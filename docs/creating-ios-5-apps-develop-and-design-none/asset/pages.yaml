- pgno: 137
  md: '![](img/fe9fea534a8e7868f811f7cd33da015f_137_0.png)


    # SETTING ADDITIONAL WARNINGS


    Xcode can perform sophisticated analysis and provide quite a bit of feedback on
    your code, helping to avoid a great number of common programming errors. Unfortunately,
    many of these settings are turned off by default. Let''s fix that.


    With the Health Beat project icon still selected, click the Build Settings tab
    in the Editor area. Make sure the All and Combined buttons are pressed, and then
    type **analyzer** in the search bar. This will bring up the Run Static Analyzer
    setting. Change this value to **Yes**. This will force the compiler to run the
    static analyzer every time you build your application (Figure 3.8).


    Running the static analyzer on every build provides a great sanity check; however,
    it can significantly slow down compile time. You may find that you need to turn
    it off when working on very large projects or when developing on slower computers.
    In my experience, however, it can take such a long time to upload a new copy of
    the application onto the device (or even onto the simulator) that a little extra
    compile time is hardly noticeable. Still, your mileage may vary.


    Next, clear the search bar, and scroll down until you find the section labeled
    Apple LLVM compiler 3.0 – Warnings (it should be near the bottom). These settings
    let us configure the warnings that the compiler generates. Xcode already has a
    number of useful warnings enabled; however, I highly recommend turning on all
    of the following:


    +   1. Check Switch Statements (on by default)

    +   2. Hidden Local Variables

    +   3. Implicit Conversion to 32 Bit Type

    +   4. Incomplete Objective-C Protocols (on by default)

    +   5. Initializer Not Fully Bracketed

    +   6. Mismatched Return Type (on by default)'
  merge: -1
  img_proc: true
- pgno: 138
  md: '+   7. Missing Braces and Parentheses (on by default)

    +   8. Missing Fields in Structure Initializers

    +   9. Missing Function Prototypes

    +   10. Missing Newline At End Of File

    +   11. Overriding Deprecated Objective-C Methods

    +   12. Pointer Sign Comparison (on by default)

    +   13. Sign Comparison

    +   14. Strict Selector Matching

    +   15. Suspicious Implicit Conversions

    +   16. Treat Warnings as Errors

    +   17. Typecheck Calls to printf/scanf (on by default)

    +   18. Undeclared Selector

    +   19. Unused Functions

    +   20. Unused Labels

    +   21. Unused Values (on by default)

    +   22. Unused Variables (on by default)

    +   23. Warn About Deprecated Functions (on by default)

    +   24. Warn About Undefined Use of offsetof Macro (on by default)


    Now, I’m not going to lie to you. In the short run, turning these warnings on
    may force you to do some extra typing—sometimes a lot of extra typing. You will
    occasionally have to add unnecessary steps to your methods just to keep the compiler
    happy. Some developers prefer to turn these warnings off when focusing on rapid
    build-test-modify cycles; then they turn them back on when polishing up the code.
    Of course, there’s a risk that you might never have time to come back and fix
    things. I recommend leaving them on as much as possible. One of these days they
    will save you from an embarrassing bug and you will thank me.'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'Of all these warnings, the most important is undoubtedly Treat Warnings as
    Errors. This forces you to clean up your code and get rid of all your warnings.
    This is a very good habit to get into. As frustrating as it may be, you really
    want to clear out all warnings. Otherwise, you may overlook something truly important
    one day.


    Trust me, nothing’s worse than compiling someone else’s code and watching a steady
    stream of warnings scroll by. You get that sinking feeling in the pit of your
    stomach. Are these serious issues that need to be resolved, or are they trivial
    matters that you can simply ignore? Do everyone a favor and fix your warnings.


    This brings up another point. Not all developers will follow this advice. You
    will find that some third-party libraries may trigger hundreds of warnings. As
    always, it’s better to be pragmatic and finish a project than to be dogmatic and
    proud of yourself. If you have to turn off one of the warnings to move forward,
    then turn off the warning.


    # ## ADDING IMAGES


    We will need icons for our tab buttons. These are a little odd. They need to be
    30 by 30 PNG files (60 by 60 @2x.png files for phones with the Retina display).
    The actual color of the image does not matter; the tab-bar icons just use their
    alpha level. For this reason, I find it easiest to draw the icons in black on
    a transparent background. If I want shading, I change the opacity of the black
    ink. That way, the image I see in my graphics application will at least be close
    to what I get when I load the icon.


    Feel free to create your own icons. Alternatively, you can just download the source
    code from www.freelancemadscience.com/source and copy over the artwork. Right-click
    the Images group, and select Add Files to “Health Beat.” Make sure the “Copy items
    into destination group’s folder (if necessary)” checkbox is selected. Then select
    graph.png, graph@2x.png, plus.png, and plus@2x.png from the downloaded code. Click
    Add.


    The plus icon will be used on our tab for entering new weights. The graph tab
    will be used for our graph view (surprise, surprise). We will use a built-in icon
    for the history view, so it doesn’t need any additional artwork.'
