    \n```\n```objc\nNSDictionary *optionsDictionary =\n[NSDictionary\n dictionaryWithObject:[NSNumber\
    \ numberWithBool:YES]\n forKey:NSMigratePersistentStoresAutomatically];\nif (![self.persistentStoreCoordinator\n\
