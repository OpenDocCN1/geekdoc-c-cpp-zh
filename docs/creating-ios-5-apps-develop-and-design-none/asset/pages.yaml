    Key-value coding is a technique for getting and setting an object’s instance variables\
    \ indirectly using strings. The NSKeyValueCoding protocol defines a number of\
    \ methods for accessing or setting these values. The simplest examples are valueForKey:\
    \ and setValue:forKey:.\n\n```\n```objc\nNSString* oldName = [emp valueForKey:@\"\
