    Sometimes this is done to provide consistency and to increase portability across
    multiple platforms. For example, CGFloat and NSInteger are both defined so that
    their size matches the target processor’s integer size (either 32 or 64 bits).
    All else being equal, these values should be the most efficient data type for
    that particular processor. Other types are defined to better communicate their
