- pgno: 261
  md: "# ## SUBPIXEL DRAWING\n\nBy default, our gridLineWidth is set to 0.25 points.\
    \ On an older iPhone, this would produce a line a quarter of a pixel wide. On\
    \ the iPhone 4 (or anything with a Retina display), it would be half a pixel wide.\
    \ Obviously, you cannot draw less than a single pixel.\n\nUIKit manages this by\
    \ using anti-aliasing—proportionally blending the drawn line with the background\
    \ color. Anti-aliasing often makes lines look smoother (especially curved or diagonal\
    \ lines), but it can also make them appear softer or somewhat fuzzy.\n\nBy default,\
    \ anti-aliasing is turned on for any window or bitmap context. It is turned off\
    \ for any other graphics contexts. However, we can explicitly set our context’s\
    \ anti-aliasing using the CGContextSetShouldAntiAlias() function. Notice that,\
    \ if we do this for our graph view, our grid lines will be drawn with a minimum\
    \ 1-pixel width.\n\nIt’s also important to realize that the graphics context’s\
    \ coordinates fall in between the pixels. For example, if you draw a 1-point-wide\
    \ horizontal line at y = 20, on a non-Retina display (iPad or iPhone 3GS or earlier),\
    \ the line will actually be drawn half in pixel row 19 and half in row 20. If\
    \ anti-aliasing is on, this will result in two rows of pixels, each with a 50%\
    \ blend. If anti-aliasing is off, you will get a 2-pixel-wide line. You can fix\
    \ this by offsetting the drawing coordinates by half a point (y = 20.5). Then\
    \ the line will fall exactly along the row of pixels.\n\nFor a Retina display,\
    \ the 1-point line will result in a 2-pixel line that properly fills both rows\
    \ on either side of the y-coordinate. For more information on how Retina displays\
    \ and scale factors work, see the “Drawing for the Retina Display” sidebar later\
    \ in this chapter.\n\nAnd finally, we restore our graphics state, thus removing\
    \ the rounded rectangle from the clipping path. Then we set the line width and\
    \ color, and draw the rounded rectangle’s border. It’s important to draw the border\
    \ last, placing it over the top of the other drawings. Otherwise, the fill and\
    \ graph lines would cover its inner edge. Similarly, we have to remove the clipping\
    \ path, because half the line’s width will be drawn outside the path. If we leave\
    \ the clipping in place, we’ll only get the inner half of our border.\n\nNow,\
    \ let’s add stubs for our helper methods. These will let us compile and test our\
    \ app (Figure 5.2).\n\n```\n    - (void)drawSingleEntryTrendLine {\n    }\n  \
    \  - (void)drawTrendLine {\n    }\n    - (void)drawReferenceLineWithLabel:(NSString*)label\n\
    ```"
