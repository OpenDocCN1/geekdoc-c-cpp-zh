- pgno: 103
  md: '# ## ARC VS. GARBAGE COLLECTION


    ARC is not garbage collection. They share a goal—both technologies automate memory
    management, making it easier to develop our applications. However, they use very
    different means. Garbage collection tracks objects at runtime. When it determines
    that an object is no longer in use, it deletes the object from memory.


    Unfortunately, this creates several potential performance problems. The infrastructure
    needed to monitor and delete objects adds overhead to your application. We also
    have very little control over when a garbage collector initiates its scan. While
    modern garbage collectors try to minimize their impact on an application''s performance,
    they are inherently non-deterministic. This means the garbage collector may cause
    your application to slow down or pause randomly during the application''s execution.


    ARC, on the other hand, handles all the memory management at compile time. There
    is no additional overhead at runtime—in fact, due to numerous optimizations, ARC
    code runs faster than manually managed memory. In addition, the memory management
    system is completely deterministic—meaning there will be no unexpected surprises.


    # ## FINDING AND PREVENTING MEMORY CYCLES


    While ARC represents a huge step forward in memory management, it doesn''t completely
    free developers from thinking about memory issues. It''s still possible to create
    memory leaks under ARC—ARC is still susceptible to retain cycles.


    To understand this problem, we have to peek a bit under the hood. By default,
    all variables in ARC use strong references. When you assign an object to a strong
    reference, the system automatically retains the object. When you remove the object
    from the reference (by assigning a new object to the variable or by assigning
    a nil value to the variable), the system releases the object.


    A retain cycle occurs when two objects directly or indirectly refer to each other
    using strong references. This often happens in parent/child hierarchies, when
    the child object holds a reference back to the parent.'
  merge: -1
  img_proc: true
