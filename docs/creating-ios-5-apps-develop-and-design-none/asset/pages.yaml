- pgno: 92
  md: 'The @property declaration automatically defines the accessor methods, as shown
    here:


    ```

    // This property

    @property (nonatomic, copy) NSString* firstName;


    // declares these methods

    - (NSString*)firstName;

    - (void)setFirstName:(NSString*)firstName;

    ```


    The getter simply uses the property’s name and returns the instance variable’s
    current value. The setter adds set to the front of the property name and will
    assign the argument (or a copy of the argument) to the instance variable.


    Now, we need to tell the compiler to implement these methods. Typically, we will
    add a @synthesize directive in the class’s @implementation block.


    ```

    @synthesize firstName;

    ```


    This generates the requested methods (if they are not already implemented—you
    can still choose to create manual versions if you wish). By default, the accessor
    methods will get and set the value stored in the class’s firstName instance variable.
    If you have already declared this variable in the @interface block, the accessors
    will use it. Otherwise, @synthesize will create the instance variable for you.


    Alternatively, we can specify a different name for our instance variables. The
    following code will use _firstName instead of firstName.


    ```

    @synthesize firstName = _firstName;

    ```


    I always rename my instance variables as shown above. The underscore, by convention,
    labels the instance variable as a private value that should not be accessed directly.
    This is exactly what we want. In general, you should access your instance variables
    through their properties—even within the class’s @implementation block. If you
    use the default instance variable name, it’s too easy to forget and directly access
    the variable by mistake.'
