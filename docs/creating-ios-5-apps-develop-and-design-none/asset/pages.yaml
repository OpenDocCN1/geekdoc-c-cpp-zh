  md: 'And that’s it for our Hello World app. In this chapter, we’ve examined how
    iOS applications are pieced together. We’ve built and modified our own (albeit
    incredibly simple) application, and we’ve gotten some hands-on experience using
    the development tools. This should give you a good jump-off point for the rest
    of the book.


    In Chapter 2, we will dig into Objective-C. We will look at the different building
    blocks used in the language, as well as some of the common design patterns found
    throughout Cocoa Touch. Then, in Chapter 3, we will take everything we’ve learned
    so far and start building a more complex, real-world application.'
