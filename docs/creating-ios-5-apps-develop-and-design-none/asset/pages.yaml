- pgno: 450
  md: 'This chapter covers a broad range of advanced topics that focus on creating
    an immersive custom user interface. We start by building a view hierarchy that
    divides our dynamic and static elements into separate layers, allowing us to rapidly
    redraw the interface as changes occur. We also create a custom UIView Controller
    container to manage our subviews, while using Core Animation to control the transition
    between these views. Next, we respond to user input using gesture recognizers
    to track different touch-based commands and Core Motion to monitor the device’s
    rotation. Finally, we will use Core Location to geotag images, then export those
    images by saving them to the photo library, attaching them to email, or tweeting
    them using the new integrated Twitter API.


    ![](img/fe9fea534a8e7868f811f7cd33da015f_450_0.png)'
