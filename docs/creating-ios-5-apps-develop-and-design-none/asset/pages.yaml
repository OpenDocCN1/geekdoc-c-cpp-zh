- pgno: 200
  md: "# # CHANGING WEIGHT UNITS\n\nWhen the user presses the units button, we need\
    \ to open a new view and let them change the default units. To do this, we will\
    \ use a modal view. Modal views are perfect for presenting focused, short-term\
    \ tasks that the user must either complete or explicitly cancel.\n\nLet’s start\
    \ by adding another `UIViewController` subclass. Name it `UnitSelectorViewController`\
    \ and place it in the Controllers group (if you need help, follow the step-by-step\
    \ instructions in “Configuring the Tab Bar” in Chapter 3).\n\nNow open `MainStoryboard.storyboard`.\
    \ Drag out a new `UIViewController` object and place it next to our enter weight\
    \ view controller scene. Switch to the Identity inspector, and change its Class\
    \ setting so that it uses our new `UnitSelectorViewController` class.\n\nIdeally,\
    \ we want a segue from our `changeUnits:` action to the unit selector view. Unfortunately,\
    \ we cannot draw segues from actions directly. Instead, let’s create a segue that\
    \ we can manually call from our code.\n\nControl-drag from the enter weight view\
    \ controller icon to our new scene. In the pop-up window, select `modal`. This\
    \ creates a generic modal storyboard segue. This sets the segue between the two\
    \ scenes. Select the segue and switch to the Attributes inspector. Set the Identifier\
    \ attribute to `Unit Selector Segue`, and the Transition attribute to `Flip Horizontal`.\
    \ Now we just need to trigger this segue from our `changeUnits:` action.\n\nSwitch\
    \ back to `EnterWeightViewController.m`. Let’s start by defining a string constant\
    \ for our segue’s identifier. Add the following line before the `@implementation`\
    \ block:\n\n```\n```\nstatic NSString* const UNIT_SELECTOR_SEGUE = @\"Unit Selector\
    \ Segue\";\n```\n```\n\nNow navigate down to the `changeUnits:` action. We just\
    \ need to call our controller’s `performSegueWithIdentifier:sender:` method.\n\
    \n```\n```\n- (IBAction)changeUnits:(id)sender {\n    [self performSegueWithIdentifier:\n\
    \     UNIT_SELECTOR_SEGUE sender:self];\n}\n```\n```\n\nThis will trigger our\
    \ segue. Our enter weight view will flip over and reveal the new unit selector\
