- pgno: 311
  md: "# TRACKING CHANGES\n\nUIDocument uses a saveless model. This means we never\
    \ ask the document to save. Instead, we let the document know whenever our model\
    \ changes. The document then automatically saves itself as needed. Furthermore,\
    \ the best way to alert the UIDocument to changes is to register an undo action\
    \ with the document’s undo manager.\n\nWhen we register an undo action, we need\
    \ to tell our application how to undo the change we just made. In Health Beat,\
    \ we are only adding and deleting entries from the history. This means that our\
    \ undo actions may need to know both the WeightEntry involved in the change and\
    \ its index in our history array. Let’s create an object to encapsulate that data.\n\
    \nSince we’re only going to use this data inside our WeightHistory class, let’s\
    \ declare it as a private class. With WeightHistory.m still open, add the following\
    \ code before the @implementation block:\n\n```\n```objective-c\n// Private class,\
    \ used to store undo information.\n\n@interface UndoInfo : NSObject\n@property\
    \ (strong, nonatomic) WeightEntry* weight;\n@property (assign, nonatomic) NSUInteger\
    \ index;\n@end\n\n@implementation UndoInfo\n@synthesize weight = _weight;\n@synthesize\
    \ index = _index;\n@end\n```\n```\n\nThis simply creates a new class, UndoInfo,\
    \ with two parameters: our WeightEntry and our index. Now let’s look at the methods\
    \ that actually modify our model. Let’s start with the addWeight: method.\n\n\
    ```\n```objective-c\n- (void)addWeight:(WeightEntry*)weight {\n    // Manually\
    \ send KVO messages.\n    [self willChange:NSKeyValueChangeInsertion\n      valuesAtIndexes:[NSIndexSet\
    \ indexSetWithIndex:0]\n             forKey:KVOWeightChangeKey];\n```\n```"
  merge: -1
