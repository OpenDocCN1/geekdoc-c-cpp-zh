- pgno: 388
  md: '# LIGHTWEIGHT MIGRATION


    In the simplest cases, you may not need a mapping model. Core Data can often infer
    the differences between the source and destination models and automatically migrate
    your data. In particular, you can perform lightweight migration if you are only
    adding attributes to an existing entity or changing a non-optional attribute to
    an optional attribute. You can also change an optional attribute to a non-optional
    attribute as long as you provide a default value.


    In this case, open your persistent store by calling `addPersistentStoreWithType:configuration:URL:options:error:`
    and setting both the `NSMigratePersistentStoresAutomaticallyOption` and the `NSInferMappingModelAutomaticallyOption`
    keys to YES.


    Remember, not all changes require migration. You can change an attribute’s default
    value or validation constraints without altering the existing stores. Additionally,
    you will want to test your data migration very carefully. You don’t want to corrupt
    or lose your user’s data. If you’ve ever updated an app only to have it erase
    all your data, you know exactly what I mean.


    # SUPPORT DATA


    The model may also contain fetch requests and configurations. As noted, fetch
    requests let us request all the entities that match a given specification. While
    we often create our fetch requests at runtime, we may want to build complex or
    commonly used fetch requests directly into our model.


    Xcode’s predicate builder can be helpful when creating complex fetch requests—though
    the version included with Xcode 4 lacks many of the features found in previous
    versions. We can only select attributes in the left-hand side and constants in
    the right—no variables, keys, or nested compound predicates. Hopefully Apple will
    restore the full set of features in later releases.


    Additionally, we cannot add a sort description using the graphic interface. This
    isn’t a huge problem, though, since we can use the predicate builder to build
    the basic fetch request, and then we can add the sort descriptors at runtime,
    if necessary.


    Configurations, on the other hand, represent the second type of support data.
    Technically, they are just arrays of entity descriptions. We access our configurations
    using `NSManagedObjectModel`’s `entitiesForConfiguration:` and'
  merge: -1
  img_proc: true
- pgno: 389
  md: 'setEntities:forConfiguration: methods. We can use these to define different
    subsets of our model. For example, a user logged in as an administrator may have
    access to a broader set of entities than someone logged in as a user.


    Mostly, however, we use configurations when we want to split our model across
    several persistent data stores. In this case, we need to partition our model using
    configurations. Then we specify the correct configuration for each store as we
    add them to our persistent store coordinator. Core Data handles the rest.


    # MANAGED OBJECT CONTEXT


    We now move from defining our data to actually managing it. The managed object
    context acts as a temporary scratch space. When you fetch objects from a persistent
    store, they are placed in the context. We can then manipulate them, change their
    properties, or even add or remove objects from the context. The managed object
    context monitors these changes, recording them and enabling undo/redo support.
    In addition, when we save these changes back to our persistent store, the context
    validates our objects, ensuring that everything remains in a valid state before
    committing the changes.


    We can open more than one managed object context at a time. In fact, an object
    in our persistent store may be modified by multiple contexts simultaneously. By
    default, the context will attempt to merge these changes, causing an error if
    there are conflicts. We can further control the merge process by changing the
    merge policy or by observing NSManagedObjectContextObjectsDidChangeNotification
    notifications. Note that the system may use its own managed object contexts internally,
    so we want to make sure we specify known contexts when we register as an observer.
    Otherwise, we may receive notifications from these system-level sources.


    Starting with iOS 5, we can create nested contexts, where each parent context
    may contain one or more child contexts. When connected this way, saving a child
    context merely pushes the changes up to the parent context. Data is not saved
    to the persistent store until the top-level context is saved. Fetch requests will
    pull data down through every context level, while objectWithID: will pull through
    the fewest number of contexts possible.


    Nested contexts can greatly simplify a number of difficult problems, including
    performing asynchronous saves on a background thread, sharing unsaved changes
    between different contexts, and even simplifying background fetching.'
  merge: -1
  img_proc: true
- pgno: 390
  md: 'For example, to implement asynchronous saves, we simply need to create two
    managed object contexts with a simple parent-child relationship. Our application
    makes all its changes to the child context. When it wants to save, we start by
    saving the child context on the main thread. This creates a snapshot of our data—pushing
    our changes up to the parent context. Then we save the parent context on a background
    thread. As we will see, UIManagedDocument uses this technique when auto-saving
    document data.


    > **NOTE:** In previous Core Data project templates, Xcode’s auto-generated code
    accessed the managed object context directly from the app delegate. With iOS 5,
    Apple highly recommends switching to a “pass the baton” approach, where the correct
    context is handed from object to object along the view controller hierarchy. This
    is especially true in any applications using multi-layer contexts.


    ![](img/fe9fea534a8e7868f811f7cd33da015f_390_0.png)


    # MANAGED OBJECTS


    All Core Data entities are instantiated as an NSManagedObject or one of its subclasses.
    Each managed object is associated with an entity description. This includes both
    the object’s metadata and information about the managed object context where our
    object resides.


    In many cases, we can simply use raw managed objects in our project. Each managed
    object will automatically generate both public and primitive accessors for all
    the modeled properties. For attributes and other to-one relationships, these follow
    the standard <key> and set<Key> naming conventions.


    For to-many relationships, these accessors can be used to get and set the entire
    collection (as an NSSet or NSOrderedSet, depending on the type of to-many relationship).
    However, if we want to simply add or remove individual members, we can request
    a mutable set using the mutableSetValueForKey: or mutableOrderedSetValueForKey:
    method. We can then add or remove entities from this set—all changes will be made
    to the managed object context’s object graph. We can also use the dynamic relationship
    accessors add<Key>Object: and remove<Key>Object: (insertObject:in<Key>AtIndex:
    and removeObjectFrom<Key>AtIndex: for ordered to-many relationships).'
