- pgno: 97
  md: '# CATEGORIES AND EXTENSIONS


    Categories allow you to add new methods to existing classes—even classes from
    libraries or frameworks whose source code you otherwise cannot access. There are
    a number of uses for categories. First, we can extend a class’s behavior without
    resorting to rampant subclassing. This is often useful when you just want to add
    one or two helper functions to an existing class—for example, adding push: and
    pop methods to an NSMutableArray.


    You can also add methods to classes farther up the class hierarchy. These methods
    are then inherited down the class hierarchy just like any other methods. You can
    even modify NSObject or other root classes—adding behaviors to every object in
    your application. In general, however, you should avoid making such broad changes
    to the language. They may have unintended consequences. At the very least, they
    will undoubtedly make the code somewhat confusing to anyone else who has to work
    with it.


    Lastly, you can use categories to break large, complex classes into more manageable
    chunks, where each category contains a set of related methods. The Cocoa Touch
    frameworks often do this, declaring specialized helper methods in their own categories.


    # CREATING CATEGORIES


    We create categories much like we create new classes. The @interface block looks
    almost identical to its class counterpart. There are only two differences. First,
    instead of declaring a superclass, we provide the category name in parentheses.
    This can, optionally, be followed by a list of new protocols adopted by the category.
    Second, there is no block for declaring instance variables. You cannot add instance
    variables with a category. If you need additional instance variables, you must
    make a subclass instead.


    ```

    ```objective-c

    @interface ClassName (CategoryName) <new protocols>


    // Declare methods here.


    @end

    ```

    ```'
