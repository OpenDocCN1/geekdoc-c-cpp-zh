  md: "```\n````c\n} DAY;\nconst DAY HUMPDAY = WEDNESDAY;\n````\n```\n\nJust as in\
    \ the earlier struct example, we use a typedef to declare a type for\nour enum.\
    \ In this example, we nest the enum declaration inside the typedef. Both\nstyles\
    \ are perfectly valid C code. Additionally, we could give the enum a name (e.g.,\n\
    typedef enum DAY { ... } DAY;), but since we will always access it through the\n\
    type's name, that seems redundant.\n\nNow, this isn't exactly the same as the\
    \ unsigned char example. The enums take\nup a little more memory. However, they\
    \ sure save on typing. More importantly,\nthe enum better communicates our intent.\
    \ When we define HUMPDAY as a const\nunsigned char, we are implicitly saying that\
    \ it should have a value between 0 and\n255. In the enum example, we are explicitly\
    \ stating that HUMPDAY should only be\nset equal to one of our DAY constants.\
    \ Of course, nothing will stop you from setting an invalid value.\n\n```\n````c\n\
    const DAY HUMPDAY = 143;    // While this will compile fine,\n               \
    \             // it is just wrong.\n````\n```\n\nStylistically, it is best to\
    \ always use the named constants when assigning values\nto enum types. And while\
    \ the compiler won't catch assignment errors, it can help\nin other areas—especially\
    \ when combining enums and switch statements.\n\nBy default, the enum assigns\
    \ 0 to the first constant, and the values increase by\n1 as we step down the list.\
    \ Alternatively, you can assign explicit values to one or\nmore of the named constants.\
    \ You can even assign multiple constants to the same\nvalue—making them aliases\
    \ of each other.\n\n```\n````c\ntypedef enum {\n    BOLD = 1;\n    ITALIC = 2;\n\
    \    UNDERLINE = 4;\n    ALL_CAPS = 8;\n    SUBSCRIPT = 16;\n    STRONG = BOLD\n\
    } STYLE;\n````\n```"
