  md: "```\n```objc\n// Designated initializer.\n- (id)initWithFirstName:(NSString\
    \ *)firstName\n              lastName:(NSString *)lastName\n                 \
    \   id:(int)id {\n    self = [super init];\n    if (self) {\n        _firstName\
    \ = [firstName retain];\n        _lastName = [lastName retain];\n        _id =\
    \ id;\n    }\n    return self;\n}\n```\n```\n\nUsually, when we call a method\
    \ on an object, the object first searches for a matching method defined in the\
    \ object’s class. If it cannot find a match, it moves to the superclass and continues\
    \ searching up the class hierarchy. The super keyword allows us to explicitly\
    \ start searching for methods defined in self’s superclass. Often when you override\
    \ an existing method, you still want to call the original implementation. The\
    \ super keyword lets you access that version of the method.\n\nSo, this method\
    \ starts by assigning the return value of [super init] to the self variable. This\
    \ method call will ignore the current implementation of init and begin searching\
    \ up the class hierarchy for an older implementation.\n\nAssigning the return\
    \ value to self may seem odd, but it is really just a variation on an issue we’ve\
    \ seen before. Remember that when we discussed initializing objects, we always\
    \ nested the init and alloc calls, because init might return a different object\
    \ than alloc. This code deals with the same basic problem. The self argument contains\
    \ the value returned by alloc. However, [super init] may return a different value.\
    \ We need to make sure our code initializes and returns the value returned by\
    \ [super init].\n\nNew Objective-C programmers often feel uncomfortable assigning\
    \ new values to self, but remember, it is one of our method’s hidden arguments.\
    \ This means it is just a local variable. There’s nothing magical about it—we\
    \ can assign new values to it, just like we would any other variable."
