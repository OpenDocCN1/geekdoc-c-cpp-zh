- pgno: 239
  md: '# # DISPLAYING TEXTUAL OUTPUT (continued)


    The UIWebView represents the high-level approach. Here, we lay out our text using
    HTML and CSS. We then load this into the Web view to display it. This has a number
    of advantages. You get full copy-paste support for free. You can also leverage
    any existing Web development experience you might have. You can incorporate images
    and other media. The UIWebView supports a wide range of (non-Flash) Web technologies,
    including JavaScript. You can even communicate between your native Objective-C
    code and the JavaScript running in your Web view, producing a hybrid application.
    In fact on iOS 5, with a little help from contentsEditable and execCommand, you
    can easily build a fully featured rich text editor.


    The main disadvantage is that the UIWebView is an infamous memory hog. And it’s
    true; the system performs a lot of behind-the-scenes setup when you instantiate
    your first Web view. This can cause a noticeable lag when first displaying a Web
    view. However, this reputation may be a little unfair. You can often hide the
    initial startup cost by pre-loading your Web view, and once the initial setup
    is done, the performance really isn’t as bad as most people think.


    Core Text, on the other hand, provides a full-throttled, high-octane, pedal-to-the-metal
    text system. It is designed for high performance and ease of use. It can also
    provide higher quality typographical controls—especially on older devices (kerning
    and ligatures were not available in the UIWebView before iOS 5).


    Core Text is particularly well suited for paging apps, where the Web view more
    naturally supports scrolling apps. Core Text is also tightly integrated with Core
    Graphics, giving us the power to perform a wide range of drawing tasks.


    On the downside, because it’s a low-level library you will have to do most of
    the work yourself. There’s no support for other media, and there’s no support
    for copy-paste. This last point is particularly important. The iOS copy-paste
    system acts as a gateway to a lot of really interesting controls. As developers,
    we can add our own items into the copy-paste menu, which lets us include support
    for everything from highlighting the selected text to looking up keywords in Wikipedia.


    My basic advice is to always use a UIWebView when you can. They can be frustrating
    at times, but you get so much bang for your buck. Only consider switching to Core
    Text when you absolutely need the additional power.


    You can find more information on both of these technologies in Apple’s documentation.
    See the Text Web and Editing Programming Guide for iOS, and the Core Text Programming
    Guide. You can also find some execCommand documentation (for editing rich text
    in a Web view) at https://developer.mozilla.org/en/rich-text_editing_in_mozilla.'
