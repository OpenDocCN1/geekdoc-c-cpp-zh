- pgno: 49
  md: '# # SAFELY ACCESSING A VIEW CONTROLLER''S OUTLETS


    In this example, we could not modify the text field''s contents until after the
    system fully loaded the view. We will discuss this in more depth in Chapters 3
    and 4. However, the simple explanation is that UIKit does not immediately load
    the views when it creates our view controllers. Instead, it waits until the view
    is actually needed (usually, just before the system displays it on the screen).
    While UIKit does this for performance reasons, it can cause very confusing bugs
    if you are not careful.


    Typically, these bugs occur when you make in-code changes to a view controller''s
    outlet—especially an outlet assigned using Interface Builder. When you run the
    application, the code is triggered, but the changes don''t appear to take effect.


    Whenever this happens, double-check to make sure the outlet actually exists. It
    should have a non-nil value. If it doesn''t, you''ll need to delay your configuration
    code, much as we did here.


    One improvement down, one more to go. Open the assistant editor again, with the
    storyboard on the left and HWFlipsideViewController.h on the right. We want to
    connect the text field''s Did End On Exit event with the controller''s done: method.
    There are several ways to draw connections. For example, we could Control-click
    and drag from the text field to the done: method. Unfortunately, this does not
    allow us to select the event, and it will connect the Editing Did End event, not
    the Did End On Exit event.


    Instead, Control-click the text field to bring up the Connections dialog. Click
    and drag from the circle that is to the right of the Did End On Exit event to
    the done: method, as shown in Figure 1.30.


    There are several other equally valid alternatives. You can Control-click the
    HWFlipsideViewController icon in the scene''s dock, and then drag from the done:
    action to the text field. Xcode will then prompt you for the correct event. You
    can also use the Connection inspector in the Utilities area, instead of using
    the pop-up dialogs. Most of these approaches are equivalent. Feel free to experiment
    with the different approaches and see which one works best for you.'
