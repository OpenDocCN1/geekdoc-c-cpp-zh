- pgno: 36
  md: "These methods respond to changes in our application’s state. They are called\
    \ when our application first loads, becomes active or inactive, goes into or out\
    \ of the background, or prepares to terminate. We will discuss these (and other)\
    \ methods in more detail in the Chapter 3 sidebar “Tasks Every Application Should\
    \ Perform.” For now, read the comments in these method stubs. They should give\
    \ you a good overview of their intended use.\n\nNext, look at HWMainViewController.h.\
    \ This is even simpler than the app delegate’s interface declaration. We define\
    \ our class as a subclass of UIViewController. It also adopts a custom protocol,\
    \ HWFlipsideViewControllerDelegate. That’s it.\n\n```\n```objc\n#import \"HWFlipsideViewController.h\"\
    \n@interface HWMainViewController : UIViewController\n<HWFlipsideViewControllerDelegate>\n\
    @end\n```\n```\n\nLook at the implementation by selecting HWMainViewController.m.\
    \ Much like the app delegate, the UIViewController class has a number of methods\
    \ that we can override to monitor our view. In particular, this includes any method\
    \ with will or did in its name. The will methods are called just before the event\
    \ takes place. The did methods are called just after.\n\nLook up UIViewController\
    \ in the developer documentation to see the complete list (click it to open the\
    \ Quick Help inspector, and then click the name link to open the full description).\
    \ If you scan through this file, you will see that it includes a number of these\
    \ as method stubs. Most have default implementations that don’t do anything; they\
    \ just call the superclass’s implementation.\n\nThere are only three methods containing\
    \ functional code: shouldAutorotateToInterfaceOrientation:, flipsideViewControllerDidFinish:,\
    \ and prepareForSegue:sender:.\n\n```\n```objc\n- (BOOL)shouldAutorotateToInterfaceOrientation:\n\
    \        (UIInterfaceOrientation)interfaceOrientation\n{\n        // Return YES\
    \ for supported orientations.\n        return (interfaceOrientation !=\n     \
    \           UIInterfaceOrientationPortraitUpsideDown);\n}\n```\n```"
