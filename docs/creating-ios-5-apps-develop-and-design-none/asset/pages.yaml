  md: "The selector is a unique identifier of type SEL that is used to look up methods\
    \ at runtime. You can create a SEL from a method's name using @selector(). You\
    \ can also get the string representation of a SEL using NSStringFromSelector().\n\
    \nThe connection between C functions and Objective-C methods really becomes clear\
    \ when you start dynamically adding methods to an object, as shown:\n\n```\n```objc\n\
    // Defined before the @implementation block.\nvoid myFunction(id self, SEL _cmd)\
    \ {\n    NSLog(@\"Executing my method %@ on %@\",\n          NSStringFromSelector(_cmd),\n\
    \          self);\n}\n// Defined inside the @implementation block.\n+ (void)addMethod\
    \ {\n    SEL selector = @selector(myMethod);\n    class_addMethod(self, selector,\
    \ (IMP)myFunction, \"v@:\");\n}\n```\n```\n\nRunning the class method addMethod\
    \ will add myMethod to the current class at runtime. You can then call [myObject\
    \ myMethod], and it will call the function myFunction(myObject, @selector(myMethod)).\n\
    \n# # INITIALIZERS\n\nWe've already discussed an object's two-step instantiation.\
    \ Now let's look at the initializer methods themselves. These are just methods\
    \ like any other method we may write; however, there are a few conventions we\
    \ need to follow to get everything right.\n\nFirst, there's the name. All the\
    \ initializers traditionally start with init. Do yourself (and anyone who might\
    \ maintain your code in the future) a huge favor and always follow this naming\
    \ convention.\n\nNext, there are two methods that require special attention: the\
    \ class's designated initializer and the superclass's designated initializer."
