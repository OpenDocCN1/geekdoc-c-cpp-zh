- pgno: 296
  md: '# SAVING TO iCLOUD


    With the release of iOS 5, Apple has given us a new way to store our document’s
    data. Instead of stashing the information in our device’s local file system, we
    can share it using iCloud.


    iCloud is a new set of services and APIs that enable automatically sharing data
    among different devices. It provides a local directory, the iCloud container,
    where our device can read and write its data. The system then automatically syncs
    all the data in our container with our iCloud storage area. The truth is in the
    cloud—the system keeps the most current version in our iCloud storage, pushing
    updates back to our devices as needed.


    This has several benefits. First, all our data is safely backed up remotely. If
    something bad happens to the local copy (for example, you accidentally drop your
    phone in the toilet), we can simply download the file again from the cloud.


    Our data is also available on all our devices. Create a file on your Mac at home.
    Edit it on your iPad while sitting at a café. Show it to your friends on your
    iPhone. You can even access it from your PC at work. Your data is everywhere.


    Enabling this ubiquitous access requires shuffling around a fair number of bits.


    Fortunately, iCloud uses several techniques for minimizing bandwidth usage. First,
    it stores both the file itself as well as metadata about the file. When a file
    is created, the system uploads both the metadata and the file to the cloud. iCloud
    then pushes the updated metadata to all devices associated with that iCloud account—alerting
    them to the change. The actual file is only pulled down to a device when it is
    actually needed. Most of the time this happens transparently, though iCloud provides
    API calls to both monitor and trigger the download of non-local files.


    iCloud also tries to minimize the amount of data it needs to upload and download.
    It will automatically break your application’s data into chunks and—when possible—only
    upload and download the chunks that actually change. iCloud will also transmit
    data peer-to-peer across the local Wi-Fi network whenever possible. Still, as
    developers, we need to be careful about what we store and how often we perform
    updates.


    Finally, it’s important to note that iCloud is not a general communication channel.
    We can share containers among a relatively small suite of related applications.
    For example, we probably want to share data between the lite and pro versions
    of our app. We can also publish URLs that allow others to copy data from our iCloud
    containers. However, we cannot create a communal container for other, third-party
    developers to access. We also cannot share cloud data across multiple users.'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'iCloud is designed to allow a closely related set of applications to share
    their data and preferences across all the devices associated with a single account.
    That''s all. Don''t try to force it to do things that it cannot.


    iCloud''s APIs can be broken into two general categories: iCloud document storage
    and iCloud key-value storage.


    # iCLOUD DOCUMENT STORAGE


    We should primarily use iCloud document storage to store any user-created documents.
    We may also use it to store other internal application data—but we have to be
    a little careful here. We want to minimize the amount of data we''re uploading
    and downloading to the cloud. That means we should avoid uploading cached data
    or anything that the application could easily re-create.


    iCloud document storage supports both files and packages and is only limited by
    the amount of available memory in the user''s iCloud account. To enable document
    storage, we first have to add an entitlements file and then set our ubiquity container
    identifiers. These define the different iCloud containers available to our application.
    We need at least one application-specific container, but we may include additional
    shared containers.


    Then, early in our application, we need to call NSFileManager''s URLForUbiquityContainerIdentifier:
    method to determine if iCloud is enabled. It''s true that everyone using iOS 5
    has a free 5 GB iCloud account; however, that doesn''t mean that the user actually
    set up their account. Some users might not understand iCloud. They may have skipped
    those steps when setting up their device. Others may deliberately disable their
    account—especially if they''re worried about incurring additional bandwidth costs
    or increasing the drain on the battery. Bottom line, we cannot assume that iCloud
    is enabled. We must always check.


    URLForUbiquityContainerIdentifier: also has a secondary purpose. It extends our
    application''s sandbox to the specified container. Until this method is called,
    we cannot read or write into the container. Therefore, we must call URLForUbiquityContainerIdentifier:
    before using any other iCloud APIs.


    Next, we need to access our file. If we''re creating a new file, we start by saving
    it in our application''s sandbox and then using NSFileManager''s setUbiquitous:itemAtURL:destinationURL:error:
    to move it to the cloud. If we want to open an existing file, we search for its
    current URL using NSMetadataQuery. We shouldn''t store and reuse the iCloud URLs
    in our app, since the file''s location may change.'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'We also have to be careful how we access our file. We must use an NSFileCoordinator
    to read or write any files in our iCloud container. The coordinator manages access
    to our data, ensuring that no process is trying to read our data while another
    is modifying it. However, within a coordinated block, our iCloud containers can
    be treated just like any other directory. We can read, write, create, delete,
    move, or rename files and directories using regular NSFileManager methods.


    Finally, we need to make sure we receive notifications about the changes to our
    files. Any class that allows users to view or edit things inside the iCloud container
    must also implement the NSFilePresenter protocol. This protocol allows us to monitor
    the data’s state and respond to changes as needed. This includes loading a new
    version of the data when changes are made remotely, or managing conflicting versions
    as they are detected. NSFilePresenters also work hand in hand with the NSCoordinators
    to ensure that all running copies of your application have the correct, up-to-date
    version of the file when they need it. For example, an NSCoordinator may ask another
    process’s NSFilePresenter to save its changes before it creates a coordinated
    block.


    As you can see, working with iCloud documents can get quite complex. Fortunately,
    iOS 5 also provides the UIDocument abstract class. While this doesn’t make using
    iCloud simple, it does manage many of the details for us.


    # ## THE UIDOCUMENT ABSTRACT CLASS


    The UIDocument automates many of the tedious and complex details in managing a
    document’s data. For example, it automatically saves and loads data on a background
    thread. This prevents our user interface from locking up whenever it has to access
    large files.


    The UIDocument uses a saveless user model. Users never need to explicitly save
    their documents. Instead, as developers, we let the document know whenever its
    data has changes. UIDocument caches these changes, waiting for an opportunity
    to write them back to disk. If possible, it takes advantage of lulls in the application,
    writing its data during idle moments. However, UIDocument will also save all its
    changes before the application goes into the background.


    We can use UIDocument for both standard files and iCloud storage. It adopts the
    NSFilePresenter protocol and will automatically reload the document’s data whenever
    it detects a remote update. It also wraps its reading/writing code in NSFileCoordinators,
    ensuring safe access to our data.'
  merge: -1
  img_proc: true
- pgno: 299
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 300
  md: '# iCLOUD KEY-VALUE STORAGE


    iCloud key-value storage provides a simpler interface for saving data in the cloud.
    Unfortunately, it is also more restricted. Key-value storage is intended for non-critical
    configuration data. In many ways, it parallels the NSUserDefaults. It can only
    store a limited amount of data—up to 64 kilobytes per app—and can only store simple
    property-list data types: numbers, dates, strings, arrays, dictionaries, and so
    on. Finally, it does not have any conflict resolution—the last save always wins.


    As in iCloud document storage, we need to set up the key-value store identifier
    in our application’s entitlements. Once that is done, we simply access the shared
    NSUbiquitousKeyValueStore. We then call the store’s instance methods to read and
    write our data. All changes are initially cached in memory. We must call synchronize
    to save these changes to disk. The system will then automatically sync the data
    from our local container with iCloud.


    > **NOTE:** Syncing the NSUbiquitousKeyValueStore does not force the system to
    upload its changes to iCloud immediately. Indeed, the system may deliberately
    delay uploading, especially when our application makes frequent changes. The more
    frequent the updates, the longer the delay.


    ![](img/fe9fea534a8e7868f811f7cd33da015f_300_0.png)


    In general, we should not use iCloud key-value storage to save user-generated
    data. It’s really intended for syncing user preferences. In fact, we shouldn’t
    use it to replace NSUserDefaults. Instead, our applications should still use NSUserDefaults
    to manage their preferences locally. We simply use key-value storage to sync these
    preferences across multiple devices.


    We will see how NSUserDefaults and iCloud key-value storage work hand in hand
    in the “Saving User Defaults” section, later this chapter.'
  merge: -1
