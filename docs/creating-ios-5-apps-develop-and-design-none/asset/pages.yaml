- pgno: 196
  md: "While this is an elegant solution, it brings up a common problem with iOS development.\
    \ We can easily build complicated touch-, gesture-, and motion-based controls\
    \ (see Chapter 8 for more examples), but how do we make sure the user knows they\
    \ exist? iOS applications usually don’t have help screens, and—in my experience—few\
    \ users actually read the help information that does exist.\n\nFor example, you\
    \ might create a great three-finger swipe that radically simplifies your application’s\
    \ workflow. However, unless your users stumble upon it by accident, most will\
    \ never know it exists. That’s not to say that you should avoid using unusual\
    \ gestures. On the contrary, many applications use novel gestures to great effect.\
    \ The Twitter app is an excellent example: You scroll through the table view of\
    \ incoming tweets. When you get to the top, you just pull down to check for new\
    \ messages.\n\nThis is a brilliant gesture. Users will almost certainly stumble\
    \ upon it as they accidentally try to scroll past the end of their tweets. More\
    \ importantly, once you find it, the gesture is so natural that it quickly becomes\
    \ part of your regular workflow.\n\nThe bottom line is that successfully communicating\
    \ how your app operates can be one of the biggest challenges in iOS development.\
    \ Typically, this involves extensive usability testing to make sure your interface\
    \ is as intuitive and natural as possible.\n\nOK, let’s switch gears and tackle\
    \ the `saveWeight:` action.\n\n```\n```objective-c\n#pragma mark - Action Methods\n\
    \n- (IBAction)saveWeight:(id)sender {\n    // Save the weight to the model.\n\
    \    NSNumber* weight = [self.numberFormatter\n                        numberFromString:self.weightTextField.text];\n\
    \n    WeightEntry* entry = [[WeightEntry alloc]\n                          initWithWeight:[weight\
    \ floatValue]\n                          usingUnits:self.weightHistory.defaultUnits\n\
    \                          forDate:self.currentDate];\n\n    [self.weightHistory\
    \ addWeight:entry];\n    // Automatically move to the second tab.\n    // Should\
    \ be the graph view.\n    self.tabBarController.selectedIndex = 1;\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 197
  md: "First, we parse the text field to extract the weight's floating point value.\
    \ Normally you want to check numberFromString:'s return value. If the number does\
    \ not match the specified format, this method will return nil. However, in this\
    \ case we know that the text field can only have valid values. The saveWeight:\
    \ action is only triggered when the keyboard's Done button is pressed, and the\
    \ Done button only becomes active when our text field contains text. Since we\
    \ will be filtering the user input, this text can only contain a valid decimal\
    \ number.\n\nNext, we instantiate a new WeightEntry object using this weight value,\
    \ our defaultUnits, and the currentDate property (if you remember, currentDate\
    \ was set when the enter weight view appeared onscreen). We add this entry to\
    \ our model.\n\nFinally, we change the tab bar's selected controller. This will\
    \ automatically move us to the second tab—currently set to the graph view. Again,\
    \ we are trying to make entering new weights as streamlined as possible. For the\
    \ most part, this means removing unnecessary touches. Users will typically enter\
    \ only one weight at a time. Therefore, we should streamline their interaction\
    \ and automatically bring up the weight trends graph after each new value.\n\n\
    We're going to skip the changeUnits: method for now. We'll get back to it in the\
    \ \"Changing Weight Units\" section. Instead, let's begin filtering the user's\
    \ input.\n\n# FILTERING KEYBOARD INPUT\n\nThe UITextFieldDelegate protocol has\
    \ a number of optional methods that we can use to monitor and control our text\
    \ field. In particular, we will implement textField:shouldChangeCharactersInRange:replacementString:\
    \ to filter the user input. Implement the method as shown:\n\n```\n#pragma mark\
    \ - Delegate Methods\n- (BOOL)textField:(UITextField *)textField\nshouldChangeCharactersInRange:(NSRange)range\n\
    replacementString:(NSString *)string {\n    // It's OK to hit return.\n    if\
    \ ([string isEqualToString:@\"\\n\"]) return YES;\n    NSString* changedString\
    \ =\n    [textField.text stringByReplacingCharactersInRange:range\n          \
    \                                   withString:string];\n```"
  merge: -1
  img_proc: true
- pgno: 198
  md: "```\n```objective-c\n// It's OK to delete everything.\nif ([changedString isEqualToString:@\"\
    \"]) return YES;\nNSNumber* number =\n[self.numberFormatter numberFromString:changedString];\n\
    // Filter out invalid number formats.\nif (number == nil) {\n    // We might want\
    \ to add an alert sound here.\n    return NO;\n}\nreturn YES;\n}\n```\n```\n\n\
    This method is called whenever the user presses a button on the keyboard (including\
    \ the backspace button). If we return YES, the change is made. If we return NO,\
    \ the change is canceled.\n\nWe start by checking to see if the user hit the Return\
    \ key. Since this is the trigger for our saveWeight: action, we need to accept\
    \ it.\n\nNext, we create a new string by applying the proposed change to textField’s\
    \ current contents. If the resulting string represents a valid decimal number,\
    \ we accept the change. Otherwise, we reject it.\n\nOf course, it’s not quite\
    \ that simple. First, we have to deal with another corner case. If the resulting\
    \ string is empty, we allow the change. Technically, an empty string is not a\
    \ valid decimal number; however, we really want to let the users delete all the\
    \ characters, just in case they made a typing mistake and want to start over.\n\
    \nIf the string is not empty, we use our numberFormatter to parse our string.\
    \ Again, we use the numberFromString: method. If the string does not match the\
    \ expected format, this method returns nil. We simply check the return value and\
    \ return YES or NO as appropriate.\n\nTechnically, we could simplify the code\
    \ and just return the result from parsing the string as shown here:\n\n```\n```objective-c\n\
    return [self.numberFormatter numberFromString:changedString];\n```\n```"
  merge: -1
  img_proc: true
