- pgno: 468
  md: '![](img/fe9fea534a8e7868f811f7cd33da015f_468_0.png)


    **FIGURE 8.2** Resetting the canvas


    Our reset method looks deceptively simple, but this hides a subtle feature. When
    we instantiate our new CanvasViewController, we are not calling the designated
    initializer. Instead, we''re calling the generic init method. This will then call
    [self initWithNibName:nil bundle:nil]. When the system goes to create our view
    hierarchy, it will call our controller''s loadView method. Since we passed in
    a nil value for the nib name, the default implementation would normally look for
    a nib file named CanvasViewController.xib. However, as we saw earlier, we''ve
    overridden loadView to programmatically create our view hierarchy instead.


    # CREATING POP-UP VIEWS


    GSRootViewController will also be able to display pop-up views over the top of
    our canvas. We will use this to display a number of support views, including custom
    alert messages, a pause indicator, our acceleration control, and an export menu.
    GSRootViewController will also provide different animation options for when the
    view appears. It could slide in from the sides (with an animated bounce at the
    end), drop down from the top (also with a bounce), or simply fade in and out.


    The pop-ups themselves consist of view and controller combinations. All of them
    use the same UIView subclass, PopupView. This is a simple, non-opaque view that
    draws a semi-transparent, rounded-rectangle backdrop, on which we will place our
    labels and other controls.'
  merge: -1
  img_proc: true
- pgno: 469
  md: '![](img/fe9fea534a8e7868f811f7cd33da015f_469_0.png)


    FIGURE 8.3 Creating a nib-based view controller


    To create a pop-up view, add a new UIViewController subclass to the project. In
    the options panel, make sure the "With XIB for user interface" check box is selected
    (Figure 8.3). This will create our class header, an implementation file, and an
    initial nib file.


    Then open PauseViewController.xib. Working with a nib is almost the same as working
    with a storyboard. However, we will find a few differences. The scene list is
    gone, as is the scene dock. Instead, we have a single dock that holds the top-level
    objects for the entire nib. Meanwhile, the Interface Builder area simply displays
    our top-level views.


    Our nib starts with three top-level objects: the File''s Owner, the first responder,
    and our view (Figure 8.4). Of the three, only the File''s Owner is new. Like the
    first responder, it is a placeholder (also sometimes called a proxy object). The
    system does not instantiate the placeholders when we load the nib. Instead, we
    instantiate an instance of the File''s Owner in our code and then pass it to the
    nib-loading method. This is implicitly handled for us when we call UIViewController''s
    initWithNibName:bundle: method. Our newly instantiated controller will be passed
    to the nib-loading code, which will in turn set up and configure our controller.
    The File''s Owner represents the main link between the nib and the rest of your
    application. In our case, the File''s Owner is our PauseViewController instance.'
  merge: -1
  img_proc: true
- pgno: 470
  md: '![](img/fe9fea534a8e7868f811f7cd33da015f_470_0.png)


    ![](img/fe9fea534a8e7868f811f7cd33da015f_470_1.png)


    **FIGURE 8.4** Editing a nib


    **FIGURE 8.5** Laying out the pause view


    Within the nib file, I typically set the view''s Status Bar attribute to None.
    This is one of the simulated metrics attributes; that means it doesn''t actually
    affect the nib at runtime—it just modifies how the nib appears within Interface
    Builder. Specifically, it removes the status bar from our view, just leaving us
    a blank white rectangle. Since our pop-up view won''t fill the entire screen,
    we don''t need to worry about leaving space for any of the system elements.


    We also need to change the view''s class to PopupView and set its size (200 x
    216 points for the PauseViewController). GSRootViewController will set the view''s
    position, centering it in the screen. However, it will respect the size that we
    set in the nib.


    Eventually, we will also want to set the view''s background color to clear—but
    since we will be placing white controls on the view, they can be somewhat hard
    to see. Therefore, I use a gray background color while designing the interface,
    and I change it back when I''m done. We can then drag out whatever controls we
    need, drawing connections back to the File''s Owner as necessary. Our pause view
    is relatively simple. We just add an image view to hold the pause.png image and
    a label saying “Paused” (Figure 8.5).'
  merge: -1
  img_proc: true
