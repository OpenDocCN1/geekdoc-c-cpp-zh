    \ = p1.x - p2.x;\n    CGFloat yDist = p1.y - p2.y;\n\n    // Calculate the distance\
    \ using the Pythagorean theorem.\n    return sqrt(xDist * xDist + yDist * yDist);\n\
    }\n```\n\nIn the above example, reading left to right, CGFloat is the return value,\
    \ calculateDistance is the function name, and CGPoint p1 and CGPoint p2 are the\
    \ function’s two arguments.\n\nInside the function, we first create two local\
    \ variables. These variables are stored on the stack and will be automatically\
    \ deleted when the method returns. We assign the difference between our point’s\
    \ x- and y-coordinates to these variables.\n\nThe next line is blank. Whitespace\
    \ is ignored by the compiler and should be used to organize your code, making\
    \ it easier to follow and understand. Then we have a comment. The compiler will\
