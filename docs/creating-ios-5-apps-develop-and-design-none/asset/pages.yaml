  md: "With the extension in place, we still have to synthesize our properties:\n\n\
    ```\n@synthesize entries = _entries;\n@synthesize startingDate = _startingDate;\n\
    @synthesize endingDate = _endingDate;\n@synthesize duration = _duration;\n@synthesize\
    \ minWeight = _minWeight;\n@synthesize maxWeight = _maxWeight;\n@synthesize weightSpan\
    \ = _weightSpan;\n```\n\nNow, let's implement the designated initializer and override\
    \ the superclass's designated initializer, as shown here:\n\n```\n// Designated\
    \ Initializer.\n- (id)initWithWeightEntryArray:(NSArray*)weightEntries {\n   \
    \ if ((self = [super init])) {\n        [self processArray:weightEntries];\n \
    \   }\n    return self;\n}\n// Superclass's Designated Initializer.\n- (id)init\
    \ {\n    // Create with an empy array.\n    return [self initWithWeightEntryArray:[NSArray\
    \ array]];\n}\n```\n\nWe've had a lot of practice with designated initializers,\
    \ so these should seem familiar by now. The initWithWeightEntryArray: method calls\
    \ the processArray: helper method, while init simply defaults back to the designated\
    \ initializer and passes in an empty array. That's it."
