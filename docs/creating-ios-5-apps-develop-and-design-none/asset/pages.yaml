  md: "![](img/fe9fea534a8e7868f811f7cd33da015f_164_0.png)\n\n**FIGURE 3.21** Using\
    \ the `#pragma mark` directive to organize your code\n\nTo get started, add the\
    \ highlighted code shown here:\n\n```\n~~~objectivec\n@implementation WeightHistory\n\
    @synthesize weightHistory = _weightHistory;\n@synthesize defaultUnits = _defaultUnits;\n\
    #pragma mark - virtual weights property\n// This ensures key-value observing works\
    \ for weights.\n+ (NSSet *)keyPathsForValuesAffectingWeights {\n    return [NSSet\
    \ setWithObjects:@\"weightHistory\", nil];\n}\n// Virtual property implementation.\n\
    - (NSArray*) weights {\n    return self.weightHistory;\n}\n@end\n~~~\n```\n\n\
    First things first, the `#pragma mark` directive is a convenient technique for\
    \ organizing your code. The compiler ignores it completely; however, Xcode will\
    \ use the `#pragma mark` directives to add labels and dividing lines when displaying\
    \ your class's details in the jump bar. For example, after entering the code,\
    \ click the `@implementation WeightHistory` item in the editor's jump bar (or\
    \ whatever the last item in the jump bar happens to be). It will now have a line\
    \ and header separating our new methods from the rest of the class (Figure 3.21)."
