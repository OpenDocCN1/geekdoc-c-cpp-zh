- pgno: 515
  md: "```\n```objective-c\n- (void)dispatchCallbackAndStopSearching {\n    [self.manager\
    \ stopUpdatingLocation];\n    // Make local copies that will be captured by the\
    \ block.\n    void (^callback)(CLLocation* location) = self.callbackBlock;\n \
    \   CLLocation* location = self.location;\n    // This will be added to the end\
    \ of the main queue.\n    dispatch_async(dispatch_get_main_queue(), ^{\n     \
    \   callback(location);\n    });\n    // Clear the originals.\n    self.callbackBlock\
    \ = nil;\n    self.location = nil;\n    self.done = NO;\n}\n```\n```\n\nThis method\
    \ stops our updates and then calls our callback block. However, our location updates\
    \ may arrive on a background thread, and we want to make sure our completion handler\
    \ is always run on the main thread. Therefore, this method dispatches our callback\
    \ back to the main thread, passing in our most recent location estimate.\n\nOf\
    \ course, there’s a bit of subtlety here. We start by making local copies of both\
    \ our location data and our callback block. Then we dispatch the callback block\
    \ to the main queue, and clear our properties. If we didn’t make local copies,\
    \ our dispatch block would capture the properties, but they would be set to nil\
    \ before the dispatch block executed. By saving the properties as local variables,\
    \ we ensure that the current values are captured by the local block and that they’re\
    \ not affected when we clear the properties.\n\nNow we simply need to implement\
    \ the delegate methods.\n\n```\n```objective-c\n- (void)locationManager:(CLLocationManager\
    \ *)manager\n    didUpdateToLocation:(CLLocation *)newLocation\n        fromLocation:(CLLocation\
    \ *)oldLocation {\n```\n```"
