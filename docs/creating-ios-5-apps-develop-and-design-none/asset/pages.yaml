    # TABLE 7.2 Sample Key Path Patterns


    | VALID | INVALID |

    |---|---|

    | `<to_one>.<to_one>.<to_many>` | `<to_many>.<to_one>.<to_many>` |

    | `<to_one>.<to_many>.<to_one>` | `<to_many>.<to_many>.<to_one>` |

    | `<to_many>.<to_one>.<to_one>` | `<to_one>.<to_many>.<to_many>` |

    | `<to_one>.<to_one>.<to_one>` | `<to_many>.<to_many>.<to_many>` |


    Remember that if you need additional features, you can always perform a more general
    fetch request and then execute the custom sorting and filtering on the resulting
    array. This wastes memory, but sometimes you just gotta do what you gotta do.


    > > **NOTE:** iOS 5 also allows the creation of custom incremental stores, letting
    us connect Core Data to any arbitrary data storage. This involves creating a subclass
    of the NSIncrementalStore abstract class, overriding a number of methods to support
    data access. This lets us connect Core Data to the data storage technology of
    our choice. It is also the preferred way to connect Core Data to a Web service.


