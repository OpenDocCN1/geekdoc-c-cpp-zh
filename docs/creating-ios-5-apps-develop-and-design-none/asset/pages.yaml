  md: "desiredAccuracy and distanceFilter based on our application’s needs, since\
    \ these can have a significant impact on our application’s performance. Then we\
    \ call startUpdatingLocation to begin generating location updates. When we’re\
    \ done, we call stopUpdatingLocation.\n\nIn GravityScribbler, we don’t need super\
    \ accuracy, and we’re not going to be tracking the user as they move. Instead,\
    \ we really want a quick snapshot of their general location. To simplify this,\
    \ we’ll create a wrapper class, CurrentLocationManager. This will also act as\
    \ our CLLocationManagerDelegate. This class will provide three methods: startNewSearch,\
    \ cancelSearch, and getLocationWithCompletionHandler:.\n\nWe’ll call startNewSearch\
    \ as soon as our export menu is displayed. This will let us begin generating location\
    \ updates in the background. Likewise, we’ll call cancelSearch when the pop-up\
    \ is dismissed. If the user exports an image, we can get our best location estimate\
    \ by calling getLocationWithCompletionHandler:.\n\n```\n```objc\n- (void)startNewSearch\
    \ {\n    self.location = nil;\n    self.callbackBlock = nil;\n    self.done =\
    \ NO;\n\n    // Check on our location authorization status.\n    switch ([CLLocationManager\
    \ authorizationStatus]) {\n        case kCLAuthorizationStatusNotDetermined:\n\
    \        case kCLAuthorizationStatusAuthorized:\n            // If we have permission,\
    \ or if we haven’t yet asked,\n            // start checking for location (will\
    \ ask if necessary).\n            self.manager = [[CLLocationManager alloc] init];\n\
    \            self.manager.delegate = self;\n            self.manager.distanceFilter\
    \ = 10.0f;\n            self.manager.desiredAccuracy =\n                kCLLocationAccuracyNearestTenMeters;\n\
    \            self.manager.purpose =\n                @\"Location data is used\
    \ to geotag\"\n```\n```"
