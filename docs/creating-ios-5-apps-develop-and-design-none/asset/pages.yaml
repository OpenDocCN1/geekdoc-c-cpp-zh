  md: "Some of these, like the stroke or fill color, are simple enough to set and\
    \ reset manually. In other cases, it may not be so easy to undo your changes.\
    \ Look at the clipping path. Both the UIKit methods and the Core Graphics functions\
    \ offer ways of adding shapes to the current clipping path; however, there’s no\
    \ way to remove them.\n\nThe graphics context’s stack of states gives us an easy\
    \ way to quickly undo a large number of changes. We can even roll back those hard-to-fix\
    \ changes. By calling CGContextSaveGState() and CGContextRestoreGState(), we can\
    \ push and pop the current state onto and off of the state stack.\n\nIn this particular\
    \ case, we want to add the rounded rectangle to the clipping path (thus limiting\
    \ all drawing to the inside of our rounded rectangle). However, we will still\
    \ want to draw outside the rectangle later on. Therefore, we must save the state\
    \ before we alter the clipping path.\n\n![](img/fe9fea534a8e7868f811f7cd33da015f_259_0.png)\n\
    \n**NOTE:** You only need to use CGContextSaveGState() and CGContextRestoreGState()\
    \ if you plan to undo state changes within your own drawing code. The system automatically\
    \ creates a new graphics context each time a view is drawn. Any changes you make\
    \ will not persist beyond the current draw cycle and the current view.\n\n```\n\
    \    // Draw graph paper background.\n    [self.gridColor setStroke];\n\n    CGContextSetLineWidth(context,\
    \ self.gridLineWidth);\n\n    // Draw horizontal.\n    CGFloat y = innerBounds.origin.y\
    \ + self.gridSquareSize;\n\n    while (y < innerBounds.origin.y + innerBounds.size.height)\
    \ {\n        CGPoint segments[] = {CGPointMake(innerBounds.origin.x, y),\n   \
