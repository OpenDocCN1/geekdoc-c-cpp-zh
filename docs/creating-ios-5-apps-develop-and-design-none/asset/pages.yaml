    \ the image.\nCIImage* image =\n[CIImage imageWithCGImage:self.imageToExport.CGImage];\n\
    ```\n```\n\nThis code creates a CIImage from our imageToExport property. A CIImage\
    \ object represents an image in the Core Image framework.\n\nCore Image is an\
    \ image manipulation framework. It lets us change an image's appearance by scaling,\
    \ cropping, rotating, or adding filters to the image. The CIImage object is really\
    \ more of an image recipe. It contains a set of instructions, but the framework\
    \ does not actually create the final image until the CIImage is rendered onto\
    \ a context. In our case, the CIImage's instructions will include our input image\
    \ and our rotation matrix.\n\nThis is a rather simplistic example of Core Image's\
    \ capabilities. The Core Image framework comes with a rich set of filters that\
    \ can be combined in an almost unlimited number of ways to produce a wide range\
    \ of visual effects. You can find a lot more information in the Core Image Programming\
    \ Guide.\n\n```\n```objc\nCGFloat rotation;\nswitch (self.deviceOrientation) {\n\
    \    case UIDeviceOrientationLandscapeLeft:\n        rotation = M_PI_2;\n    \
    \    break;\n    case UIDeviceOrientationLandscapeRight:\n        rotation = -M_PI_2;\n\
    \        break;\n    default:\n        [NSException\n```\n```"
