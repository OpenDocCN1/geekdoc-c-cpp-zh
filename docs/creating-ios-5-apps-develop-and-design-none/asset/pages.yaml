  md: '![](img/fe9fea534a8e7868f811f7cd33da015f_42_0.png)


    ![](img/fe9fea534a8e7868f811f7cd33da015f_42_1.png)


    ![](img/fe9fea534a8e7868f811f7cd33da015f_42_2.png)


    Xcode will help you correctly place the control. As you drag the label across
    the Editor area, it highlights and labels the current view. It also adds blue
    guidelines to help properly position your objects. Drag the label until it is
    centered vertically and aligned with the view''s left margin, as shown in **Figure
    1.20**.


    **FIGURE 1.20** Aligning the label with the view''s left margin


    When you release the label, it will appear surrounded by eight blue dots. You
    can click and drag these anchor points to resize the label. Grab the right side
    and stretch it until you hit the right-margin guide. Next, make it about half
    as tall as the enclosing view. Now, with the label still selected, let''s change
    its appearance.


    **FIGURE 1.21** Setting the label''s font


    Open the Attributes inspector. In the Alignment attribute, click the button for
    centered text. Then click the [T] icon at the far right side of the Font attribute''s
    text field. This will open a pop-up window. Change the Font setting to System
    Bold and the Size setting to 24 (**Figure 1.21**). Now let''s change the text
    itself. You can either modify the label''s Text attribute, or you can double-click
    the label and modify it directly. Replace “Label” with **Hello World**.


    **FIGURE 1.22** Centering the label


    Finally, click and drag the label until it is centered both horizontally and vertically
    (if you cannot move the label, try clicking the view to clear the selection, then
    click and drag the label again). If you''ve done everything correctly, the left
    and right margin guidelines should appear as well (**Figure 1.22**).


    Run the application. Our changes should appear on the main view.'
