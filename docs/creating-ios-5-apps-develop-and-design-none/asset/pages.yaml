- pgno: 47
  md: "Now, modify the `flipsideViewControllerDidFinish:` method as shown here.\n\n\
    ```\n```objc\n- (void)flipsideViewControllerDidFinish:\n(HWFlipsideViewController\
    \ *)controller\n{\n    self.label.text = controller.labelText.text;\n    [self\
    \ dismissModalViewControllerAnimated:YES];\n}\n```\n```\n\nAs we discussed earlier,\
    \ this line simply copies the text value from the flipside view's text field to\
    \ the main view's label using our outlets and properties.\n\nThat's it. Run the\
    \ application again. It should display the default Hello World message when it\
    \ launches. Click the info button, and type new text into the text field. Click\
    \ the Done button. The label should now show your new text.\n\n# REFINING THE\
    \ INTERFACE\n\nFunctionally, everything's OK, but it's not the most polished (or,\
    \ for that matter, useful) app in the world. Let's make it a little bit better.\
    \ When the flipside view appears, let's fill the text field with the label's current\
    \ value. Additionally, let's go ahead and dismiss the flipside view when the user\
    \ taps the Return key.\n\nLet's start by passing the text from our main view's\
    \ label to our flipside view. Ideally, we would like to set this value in our\
    \ `prepareForSegue:sender:` method. This should be the reverse of the code in\
    \ `flipsideViewControllerDidFinish:`; we copy the value from our main view's label\
    \ directly to our flipside view's text field. Unfortunately, because of the way\
    \ views are loaded, the text field may not exist yet. There are a couple of ways\
    \ around this. Let's add a property to our `HWFlipsideViewController` class and\
    \ use that to hold our text until we're sure the view is ready to go.\n\nOpen\
    \ `HWFlipsideViewController.h` and add the following line just after the other\
    \ properties:\n\n```\n```objc\n@property (nonatomic, strong) NSString* startingText;\n\
