- pgno: 289
  md: '# READING RESOURCE FILES


    We often need to include resource files in our application. Typically, these include
    the images and sounds that our application will use—but they don’t need to be
    limited to these. Any type of support data files could be included.


    We start by adding the resource files to our project. We saw this in the “Adding
    Images” section of Chapter 3 when we added the graph.png and plus.png files to
    our application. These files are then included in our application’s main bundle.


    We can then generate a path to these resources using the NSBundle class. This
    is a two-step process. First we get a reference to the main bundle by calling
    [NSBundle mainBundle], and then we use the bundle’s pathForResource:ofType: method
    (or one of its variants) to get the path. For example, to get the path to the
    graph.png file, we would use the following:


    ```

    NSBundle* bundle = [NSBundle mainBundle];


    NSString* path = [bundle pathForResource:@"graph" ofType:@"png"];

    ```


    Other classes also support loading resource files directly from the main bundle.
    For example, UIImage has the imageNamed: convenience method.


    In iOS 4.0 or later, we can provide device-specific resource files, using specially
    formatted filenames. When we search for a path, we will automatically get the
    correct resource for our current device. Device-specific filenames use the following
    format:


    ```

    <base name><device string>.<extension>

    ```


    Here, <device string> should be either ~iphone or ~ipad. For example, to provide
    device-specific versions of our graph.png file, we could add two files: a lower-resolution
    version named graph~iphone.png and a higher-resolution version named graph~ipad.png.
    We then use the code shown above to generate the path—it will automatically load
    the correct version for our device.


    Many of the image-loading methods also support automatically loading higher-resolution
    images on Retina display devices by appending @2x to the <base name>, producing
    filenames like graph@2x.png. For more information, see Apple’s iOS Application
    Programming Guide.


    Finally, remember that all files in the main directory are read-only. If your
    application needs to modify these files, you must copy them to another directory
    first.'
  merge: -1
  img_proc: true
- pgno: 290
  md: '# STRING-BASED PATHS VS. NSURL OBJECTS


    When working with iOS 4.0 or later, you should probably use NSFileManager''s URLsForDirectory:inDomain:
    or URLForDirectory:inDomain:appropriateForURL:create:error: methods instead of
    NSSearchPathForDirectoriesInDomains().


    URLsForDirectory:inDomain: works similarly to the NSSearchPathForDirectoriesInDomains()
    function, but it returns an array of NSURLs instead of an array of NSStrings.
    URLForDirectory:inDomain:appropriateForURL:create:error: just returns a single
    NSURL — making it even more convenient to use—but it has a few additional arguments
    we''ll need to set before we call it. Still, we will get a chance to see it in
    action in the "Loading iCloud Documents" section.


    Most of the time, it doesn''t matter which format we use. Most methods that deal
    with the file system have parallel versions for both URLs and raw file-names.
    Yes, we will occasionally run across a method that only accepts one form or the
    other, but these are getting increasingly rare. Besides, it''s relatively easy
    to convert the paths from NSURL to NSString and back again.


    In fact, the most important difference is that URLs are more flexible than string-based
    paths. NSURL can refer to both locally stored and remote files. This can be particularly
    useful if our application deals with both types of data. For example, if the app
    downloads a file from a URL and then caches a local copy for later use, we could
    use the same code to load and process both files—we just need to change the NSURL''s
    address.


    # USING PATHS


    So once you have the path to a file or directory, what can you do with it?


    Well, NSString has a number of methods for manipulating paths. For example, stringByAppendingPathComponent:
    adds a subdirectory or filename to an existing path. stringByDeletingLastPathComponent:
    lets us move back up the directory tree. NSURL has a parallel set of path manipulation
    methods, letting us easily manipulate URLs as well.


    NSFileManager also provides a number of useful methods for querying and manipulating
    the file system. For example, the following code explores a given path. If it
    points to a file, it will print out information about that file. If it points
    to a directory, it will get a list of the entire directory''s contents and then
    recursively explore each item in the list.'
  merge: -1
  img_proc: true
