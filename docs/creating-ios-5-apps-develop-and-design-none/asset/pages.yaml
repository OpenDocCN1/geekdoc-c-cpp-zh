- pgno: 384
  md: '> **NOTE:** While inverse relationships are not required, they are highly recommended.
    Core Data uses this information to ensure that the object graph remains consistent
    as the application makes changes. If you do not use inverse relationships, then
    you are responsible for ensuring the consistency, tracking changes, and managing
    the undo support. See the “Unidirectional Relationships” section of the Core Data
    Programming Guide for more information.


    ![](img/fe9fea534a8e7868f811f7cd33da015f_384_0.png)


    Relationships can be either to-one or to-many. To-one references are modeled using
    a pointer to the target object. Before iOS 5, all to-many relationships were modeled
    using NSSets. The relationship did not have any inherent order; it could be sorted
    based on any of the values from the entities. With iOS 5, we can also create ordered
    relationships, which use an NSOrderedSet. This allows us to place our entities
    into any arbitrary order we wish, without regard to the entities’ values.


    Like attributes, relationships support optional and transient settings. For to-many
    relationships, we can also set the minimum and maximum number of entities in the
    relationship. Finally, we can specify a delete rule. Delete rules describe what
    happens to the relationship when we delete our entity. The different options are
    listed here:


    +   - **Cascade:** Deleting the source object also deletes all the objects at
    the relationship’s destination. For example, deleting a Course object also deletes
    all its Students.

    +   - **Deny:** If there is at least one object at the relationship’s destination,
    then the source object cannot be deleted. If you want to delete a Course entity,
    you first need to remove all its Students.

    +   - **Nullify:** Sets the inverse relationship for any entities at the destination
    to nil. Deleting the Course entity sets all the Students’ Course relationship
    to nil.

    +   - **No Action:** The entity at the other end remains unchanged. In general,
    this should only be used for unidirectional relationships. If it has an inverse
    relationship, that relationship now points to an entity that no longer exists.
    For example, our Students will still think they’re registered for the now-nonexistent
    Course.'
  merge: -1
  img_proc: true
- pgno: 385
  md: '# ## MANY-TO-MANY RELATIONSHIPS


    Relationships are implicitly either one-to-one or one-to-many. It’s possible to
    create a many-to-many relationship—but this requires a bit more work.


    There are two recommended approaches. You can just make sure both ends are set
    as to-many relationships and set them as the inverse of each other. If you save
    these objects to an SQLite-based store, Core Data will automatically build the
    join table for you. Alternatively, you can explicitly build a join entity that
    represents these relationships. See the “Many-to-Many Relationships” section of
    the Core Data Programming Guide for more information.


    Fetched properties are similar to relationships, but they are used to model weak
    one-way connections between entities. As the name suggests, the fetched property’s
    value is calculated using a fetch request. We will discuss fetch requests in more
    detail later this chapter, but basically fetch requests let us look up entities
    that match a given entity description. We can also apply a predicate to filter
    our results and then sort them according to a set of sort descriptors. For example,
    we could create a fetch request that returns all students (entity description)
    who are taking more than 18 credit hours (predicate), and then we could sort them
    by descending GPA (sort description).


    Fetched properties use lazy initialization. The actual fetch is not performed
    until the property’s value is accessed. However, once the value is calculated,
    it is cached for future use. Our system models fetch properties using arrays,
    not sets, since fetched properties have a defined sort order. Additionally, fetched
    properties are the only way to model cross-store relationships. Normal relationship
    properties can only refer to objects saved in the same persistent store.


    In many ways, an entity description is similar to a class. It is a blueprint used
    to instantiate managed objects—and, like classes, entity descriptions support
    inheritance. If you have a number of similar entities, you can factor out the
    common properties into a super-entity. You can even explicitly declare abstract
    entities (something not supported by the Objective-C object model).


    However, there are a few important differences between entity inheritance and
    object inheritance. Remember, the entities describe how our data is organized.
    We use the entities to create objects—but the resulting object inheritance tree
    is separate from our entity inheritance tree. For example, we will often use NSManagedObjects
    for all of our entities—superclasses and subclasses alike. If we are creating'
  merge: -1
  img_proc: true
- pgno: 386
  md: 'custom classes for our entities, we probably want the model’s inheritance tree
    to match our entities—but that’s not required, and it’s something we will have
    to manage by hand.


    Most importantly, however, entity inheritance can have unexpected performance
    implications. If you save your entities in an SQLite-based store, then the database
    will place your entire hierarchy in a single table. It will create a column for
    each property, requiring a table large enough to contain all the properties from
    all the different sub-entities.


    If you have a large number of sub-entities, and your sub-entities each add a significant
    number of unique properties, you may end up with large, sparsely populated tables.
    This can affect both the amount of disk space you need to store your entities,
    and the performance of fetch requests.


    # MIGRATING DATA


    Changes to the schema may make the model incompatible with previously created
    data stores. When this happens, you will need to migrate the old stores before
    you can open them. By default, Core Data manages this with a three-step process:


    +   1. Model versioning

    +   2. Mapping model

    +   3. Data migration


    Core data lets us create multiple versions of our managed object model. We can
    add a new version by selecting our managed object model and then selecting Editor
    > Add Model Version.


    The mapping model describes how to transform the data from one version to the
    next. Typically, we add a new mapping model to our project by selecting File >
    New File and then selecting iOS > Core Data > Mapping Model (**Figure 7.1**).
    Xcode’s mapping model editor allows us to graphically set the transformations
    between the source and destination models.


    Finally, you must migrate the existing data from your old model to your new one.
    Most of the time, you will perform automatic migration by calling `addPersistentStoreWithType:configuration:URL:options:error:`
    to open your persistent store. For the `options:` parameter, pass in an `NSDictionary`
    containing the `NSMigratePersistentStoresAutomaticallyOption` key with an `NSNumber`
    object set to `YES`.'
  merge: -1
  img_proc: true
- pgno: 387
