  md: "If the Core Foundation function retains the data (CFRetain, CFCreate, or Copy),\
    \ then we need to cast it using the `__bridge_transfer` annotation. If Core Foundation\
    \ releases the data (CFRelease), then we use the `__bridge_retain` annotation.\
    \ Examples of both are shown here.\n\n```\n```objc\n// The Core Foundation function\
    \ retains the data.\n// We need to tell ARC to release it when we're done:\nNSString*\
    \ myString =\n    (__bridge_transfer NSString*)CFStringCreateMutableCopy(NULL,\
    \ 0,\n                                                             myCFString);\n\
    ...now do something useful with myString\n// This time, our Core Foundation code\
    \ will release the object.\n// We need to tell ARC to retain it.\nCFStringRef\
    \ myCFString = (__bridge_retain NSString*)[myString copy];\n...now do something\
    \ useful with myCFString\nCFRelease(myCFString);\n```\n```\n\nFinally, if we get\
    \ the Core Foundation data in some other way (not a Create or Copy function and\
    \ not an Objective-C method), and we don’t call either `CFRetain()` or `CFRelease()`\
    \ on it, we simply need to add the `__bridge` annotation to the cast, as shown\
    \ here. ARC will then manage the memory for us, as normal.\n\n```\n```objc\n//\
    \ From Objective-C to Core Foundation\nCFStringRef myCFString = (__bridge CFStringRef)\
    \ myString;\nCFShow(myCFString);\n...\n\n// From Core Foundation to Objective-C\n\
    myLabel.text = (__bridge NSString*)myCFString;\n```\n```"
