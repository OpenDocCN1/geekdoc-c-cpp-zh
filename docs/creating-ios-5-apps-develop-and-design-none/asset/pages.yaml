- pgno: 94
  md: 'Using the properties helps produce clean, consistent code. More importantly,
    it ensures that techniques like key-value observing work properly. There is, however,
    one place where you should access the instance variables directly: inside your
    class’s designated initializer.


    > > **NOTE:** Many old-school Objective-C programmers seem to hate the dot notation
    with a fury usually reserved for telemarketers. They think it is unnecessary and
    confusing. Personally, I like the fact that it mirrors the way we get and set
    values in C-style structs. This makes a clear distinction between accessors and
    other methods. However, your mileage may vary, and you should use whichever notation
    feels the most comfortable.


    ![](img/fe9fea534a8e7868f811f7cd33da015f_94_0.png)


    In general, your initializers should avoid doing anything that might generate
    errors, call external methods, or otherwise eat up computational time. Admittedly,
    your properties should be relatively straightforward assignments without any unexpected
    side effects, so using the properties probably won’t kill you. Still, there’s
    always the chance that someone will eventually add a custom setter to one of the
    properties, inadvertently making your initialization method unstable. So direct
    assignment’s not a bad idea.


    # PROTOCOLS


    Some object-oriented languages (most notably C++ and Python) allow multiple inheritance,
    where a class can inherit behaviors from more than one superclass. This can create
    problems, especially when both parents define identical methods. This may sound
    like a rare corner case—but it accidentally happens all the time. If the classes
    share a common ancestor (and all classes share a root ancestor), both superclasses
    will have copies of the common ancestor’s methods. If you override one of these
    methods anywhere in either of the superclasses’ hierarchies, your subclass will
    inherit multiple implementations for that method.


    Other languages (like Java and Objective-C) do not allow multiple inheritance,
    largely because of these added complexities. However, there are times when you
    still want to capture common behaviors across a number of otherwise unrelated
    classes. This is particularly true in static, strongly typed languages like Java.'
  merge: -1
  img_proc: true
- pgno: 95
  md: "Let's say you want to have an array of objects, and you want to iterate over\
    \ each object, calling its makeNoise() method. One approach would be to make a\
    \ NoisyObject superclass and have all the objects in your array inherit from that\
    \ class. While this sounds good in theory, it is not always possible. Sometimes\
    \ your objects must inherit from another, existing class hierarchy. In C++, no\
    \ problem. Your class could inherit from both. In Java, we can simulate multiple\
    \ inheritances using a Noisy interface. Any class implementing this interface\
    \ must also implement the makeNoise() method.\n\nIn Objective-C, this is somewhat\
    \ less of a concern. We don't have Java's strict static typing (and all the extra\
    \ convolutions that come with it). After all, we can already send any message\
    \ to any object. So, this is really a matter of communicating our intent. You\
    \ could just make sure all the objects in the array implement the makeNoise method\
    \ and you're good to go. However, we often want to explicitly capture these requirements.\
    \ In this case, protocols fill a similar role to Java's interfaces—but they have\
    \ other uses as well.\n\nA protocol declares a number of methods. By default,\
    \ these methods are required. Any class adopting the protocol must implement all\
    \ of the required methods. However, we can also declare methods as optional. The\
    \ adopting class may implement optional methods, but they are not required.\n\n\
    At first glance, optional methods may seem a bit odd. After all, any object can\
    \ implement any method; we don't need the protocol's permission. However, it's\
    \ important to remember that Objective-C's protocols are really about communicating\
    \ developer intent. Developers most often use optional methods when developing\
    \ protocols for delegates. Here they document the methods that the delegate could\
    \ override to monitor or modify the delegating class's behavior. We will examine\
    \ this topic in more depth when we discuss delegates later in this chapter.\n\n\
    # ADOPTING PROTOCOLS\n\nTo adopt a protocol, simply add a comma-separated list\
    \ of protocols inside angled brackets after the superclass declaration in your\
    \ class's @interface block.\n\n```\n@interface ClassName : SuperClassName\n<list,\
    \ of, protocols, to, adopt> {\n    ...\n@end\n```"
