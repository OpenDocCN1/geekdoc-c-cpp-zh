- pgno: 26
  md: 'In Xcode 4, Interface Builder was incorporated into Xcode itself. This allows
    us to edit the interface and any related code side by side. With iOS 5, storyboards
    allow us to encapsulate a number of nibs, which lets us not only define a single
    scene’s worth of information, but also draw the transitions between scenes.


    As you will see throughout the rest of this chapter, our storyboards contain a
    lot more than just views and controls. They also contain controller objects, as
    well as the connections between the various controls, views, and controllers.
    We will get some experience drawing these connections as we expand our Hello World
    app in the "Modifying the Template" section, later this chapter. Additionally,
    we will discuss nibs, the underlying technology behind storyboards, in more detail
    in the Chapter 3 sidebar "The Secret Life of Nibs."


    ![](img/fe9fea534a8e7868f811f7cd33da015f_26_0.png)


    **FIGURE 1.10** Enabling the Utilities area


    > **NOTE:** Originally, Interface Builder saved nib archives as binary files,
    with a .nib extension. As of Xcode 3.0, Interface Builder allowed storing the
    nib files in an intermediate XML format with a .xib extension. This allowed greater
    compatibility with source control and other development tools. The .xib files
    are then compiled into binary .nib files when the application is built. For simplicity’s
    sake, both versions are typically referred to as "nib files." In Xcode 4.2, storyboards
    are also stored as XML files with a .storyboard extension. These files are automatically
    compiled into one or more nib files. The system then loads these nibs as needed
    at runtime.


    How does UIApplicationMain() know which storyboard file to open? As we saw earlier,
    the name of the main storyboard is stored in our configuration file. Click Hello
    World-Info.plist in the Supporting Files group. You should see a list of key-value
    pairs. Look for the Main storyboard file base name key. It should be set to MainStoryboard.
    This means UIApplicationMain() will automatically load the MainStoryboard.storyboard
    file.


    Let’s open this file. Click MainStoryboard.storyboard in the Project navigator.
    This will open the storyboard file in Xcode’s Editor area. You will probably want
    to close the Navigator area to give the editor as much space as possible. You
    will also want to make sure the Utilities area is open along the right-hand side
    of the screen. Make sure the Utilities area View button is depressed (Figure 1.10).'
  merge: -1
  img_proc: true
- pgno: 27
  md: '![](img/fe9fea534a8e7868f811f7cd33da015f_27_0.png)


    **FIGURE 1.11** The Storyboard editor


    The Storyboard editor consists of two separate regions. On the left, we have our
    scene list. This shows us all the scenes in our storyboard, as well as every object
    within each scene. On the right, we have the Interface Builder. This lets us view
    and design the actual user interface for our scenes, as well as the flow of control
    among the scenes (Figure 1.11).


    Our project starts out with two scenes. If you look at the scene list, you will
    see that each scene has at least two top-level objects: the first responder and
    the scene''s view controller. Let''s start with the first responder. This is,
    in many ways, a very unusual object. Or rather, it''s not an object at all—it''s
    a proxy. The system never creates an instance of the first responder. Instead,
    it sets the first responder at runtime.'
  merge: -1
  img_proc: true
