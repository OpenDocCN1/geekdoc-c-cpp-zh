- pgno: 522
  md: '# # SENDING MMS MESSAGES


    OK, I have some good news and some bad news. First the good news: The MessageUI
    framework has excellent support for sending SMS messages. You can use the MFMessageComposeViewController
    class to display the standard interface for creating SMS messages. We can even
    set the initial recipients and message text. With iOS 5, this support has been
    expanded to automatically use iMessage instead of SMS whenever possible.


    Unfortunately, the MessageUI only supports text messages. We cannot use the framework
    to programmatically attach images or video.


    However, this doesn''t mean the user cannot send their image as an MMS. It just
    means that they have to do it on their own. If they save the image to their photo
    library, they can then attach it to their own MMS messages. It''s not ideal, but
    right now it''s one of the few options available.


    Alternatively, we could programmatically copy the image to the pasteboard. This
    would let the user paste it into an SMS message. This will be difficult to clearly
    communicate to the user, however.


    # # SENDING EMAIL ATTACHMENTS


    Email attachments also use the MessageUI framework. However, unlike SMS messages,
    the email composer lets us set the sender, the subject, and the message body,
    and (most importantly) it lets us add attachments.


    In theory, to send an email message we just need to instantiate our message composition
    view, set a few parameters, and display it for the user. We cannot send the message
    ourselves. We can prepare the message for the user, but they have to press the
    send button.


    Unfortunately, we cannot attach a UIImage directly. Rather, we must attach an
    NSData object holding the contents of the file we wish to attach. Also, we would
    typically want to check and make sure the device supported email before creating
    the compose view. In this case, however, we performed that check when the export
    menu was created. If the device does not support email, then the email button
    will not appear in our menu.'
