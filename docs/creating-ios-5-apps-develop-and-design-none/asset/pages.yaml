- pgno: 563
  md: "# Creating\niOS 5 Apps\n\n# DEVELOP AND DESIGN\n\n**WITH MORE THAN 250 MILLION\
    \ iOS DEVICES SOLD.** Apple’s booming mobile platform provides a large and rapidly\
    \ growing app market for developers. With the release of the iOS 5 SDK, Apple\
    \ has provided its richest, most exciting set of development tools yet. In this\
    \ book, iOS programming expert Richard Warren shows you how to use these powerful\
    \ tools to begin writing the next generation of iOS apps.\n\nYou will hone your\
    \ app-development skills by developing a complete, full-featured application.\
    \ You start by building the app’s user interface, covering everything from linking\
    \ View Controllers in the Storyboard to drawing custom views. Next, you will use\
    \ iCloud storage and Core data to manage your app’s data model, synchronizing\
    \ your data across multiple devices. Then you tackle more advanced topics, including\
    \ Core Animation, Core Motion, Core Location, and Core Image. Finally, Richard\
    \ shows you how to prepare your apps for submission to the iTunes App Store.\n\
    \n> > “I’ve had the pleasure of working with Rich Warren through MacTech magazine.\
    \ He knows what he’s talking about and can explain it in a clear manner with practical\
    \ examples. With this book covering very new Apple technology, I’m looking forward\
    \ to reading it cover to cover.”\n> >\n> > Edward Marczak  \n> > Executive Editor,\
    \ *MacTech* magazine\n\n# THIS BOOK INCLUDES:\n\n+   - Real-world guidance and\
    \ advice\n+   - Insight into best practices from an iOS programming expert\n+\
    \   - A solid introduction to the Objective-C language and Cocoa design patterns\n\
    +   - Coverage of key iOS 5 technologies, including Automatic Reference Counting,\
    \ Storyboards, and iCloud storage\n\n**RICHARD WARREN** lives in Houston with\
    \ his wife, Mika; daughter, Haruko; son, Kai; and their dog, Mary Lu. He is a\
    \ freelance writer and an iPhone developer for hire. He has written almost 20\
    \ articles for *MacTech* magazine, mostly focusing on iOS development. He also\
    \ contributed to several apps in Apple’s App Store, including ColorIt!, Etch A\
    \ Sketch, Etch A Sketch Premium, Moonstone, and Moonstone HD.\n\n# COMPANION WEB\
    \ PAGE:\n\nwww.freelancemadscience.com/book\n\nBOOK LEVEL  INTERMEDIATE\nCOMPUTER\
    \ BOOK SHELF CATEGORY  APPLE DEVELOPMENT\nCOVERS  iOS 5\nCOVER DESIGN  AREN HOWELL\
    \ STRAIGER\n\nUS $49.99    CANADA $51.99\nISBN-13: 978-0-321-76960-2\nISBN-10:\
    \ 0-321-76960-0"
