- pgno: 267
  md: "Now we’re getting into the nitty-gritty. We start by creating a label string\
    \ from our weight. As always, this will include the properly formatted number\
    \ and the unit label. We then request the bold system font based on our current\
    \ fontSize property. We can use the font to calculate the bounding box needed\
    \ to draw our string. Simply call the sizeWithFont: method from NSString’s UIStringDrawing\
    \ extension.\n\nWith the string, font, y-coordinate, and text width in hand, we\
    \ can call the drawReferenceLineWithLabel:font:atY:withTextWidthOffset: helper\
    \ function. We will look at this function in a bit, but basically it will draw\
    \ our text label at the specified y-coordinates along the left margin. This is\
    \ followed by a small space (based on the text width offset and our margin property),\
    \ and then a thin horizontal line is drawn stretching to the right margin.\n\n\
    ```\n    UIBezierPath* trendLine = [UIBezierPath bezierPath];\n\n    trendLine.lineWidth\
    \ = self.trendLineWidth;\n\n    trendLine.lineCapStyle = kCGLineCapRound;\n\n\
    \    [trendLine moveToPoint:CGPointMake(x, y)];\n\n    [trendLine addLineToPoint:CGPointMake(x\
    \ + 1, y)];\n\n    [self.trendLineColor setStroke];\n\n    [trendLine stroke];\n\
    \    }\n```\n\nFinally, we draw our trend line—or actually our trend point. While\
    \ we could have used the UIBezierPath to create an actual circle, we wanted our\
    \ trend point to match a multiple-entry trend line as closely as possible. The\
    \ easiest way to do this is to just draw a very short line.\n\nHere, we create\
    \ our Bezier path. We set the line width based on our trendLineWidth property.\
    \ This is 4 points wide by default. We then set the line cap style to round caps.\
    \ This defines the shape of the line’s endpoints. We then move the cursor to the\
    \ center of the view and create a 1-point-long line.\n\nFinally, we set the line’s\
    \ color, based on our trendLineColor property, and draw the line. By drawing a\
    \ very short, wide line with round end caps, we create a nice little dot that\
    \ will perfectly match the actual lines we will draw in our next helper method."
