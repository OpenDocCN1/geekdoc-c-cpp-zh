- pgno: 268
  md: "# DRAWING THE FULL TREND LINE\n\nWhile similar to the previous method in many\
    \ ways, drawTrendLine adds a few layers of complexity. Here, we’re going to draw\
    \ two labeled reference lines. One corresponds to the minimum weight, one to the\
    \ maximum. We will also need to coordinate their appearance, so even though the\
    \ weight labels may have different widths, the left edge of the reference lines\
    \ remains properly aligned. Finally, we need to dynamically size our graph so\
    \ our trend line fills the bulk of the view.\n\nAgain, because of the length of\
    \ this method, we will look at it in smaller chunks.\n\n```\n```objective-c\n\
    - (void)drawTrendLine {\n    // Draw the reference lines.\n    UIFont* font =\
    \ [UIFont boldSystemFontOfSize:self.fontSize];\n    CGFloat textPadding = font.lineHeight\
    \ / 2.0f;\n    CGFloat topY = self.margin * 2 + textPadding;\n    CGFloat bottomY\
    \ = self.bounds.size.height - topY;\n```\n```\n\nWe start by requesting the bold\
    \ system font again. Then we calculate a text Padding variable based on half the\
    \ font’s height. We then use this value and our margin property to calculate a\
    \ safe upper and lower limit for our reference lines. After all, we don’t want\
    \ to cut off the tops and bottoms of our labels.\n\n```\n```objective-c\nNSString*\
    \ topLabel =\n    [WeightEntry stringForWeightInLbs:self.graphStats.maxWeight\n\
    \                               inUnit:self.units];\nNSString* bottomLabel =\n\
    \    [WeightEntry stringForWeightInLbs:self.graphStats.minWeight\n           \
    \                     inUnit:self.units];\nCGSize topTextSize = [topLabel sizeWithFont:font];\n\
    CGSize bottomTextSize = [bottomLabel sizeWithFont:font];\n// Get the maximum width.\n\
    CGFloat textOffset =\n    topTextSize.width > bottomTextSize.width ?\n```\n```"
