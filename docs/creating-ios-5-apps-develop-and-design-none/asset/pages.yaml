  md: "Now, let's implement documentStateChanged:.\n\n```\n```objc\n#pragma mark -\
    \ Resolve Conflicts\n\n- (void)documentStateChanged:(NSNotification*)notification\
    \ {\n    UIDocumentState state = self.documentState;\n    if (state & UIDocumentStateInConflict)\
    \ {\n        NSURL* url = self.fileURL;\n        NSURL* currentURL =\n       \
    \ [[NSFileVersion currentVersionOfItemAtURL:url] URL];\n        NSFileCoordinator*\
    \ coordinator =\n        [[NSFileCoordinator alloc] initWithFilePresenter:self];\n\
    \        dispatch_queue_t backgroundQueue =\n        dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_DEFAULT,\n\
    \                                  0);\n        dispatch_async(backgroundQueue,\
    \ ^{\n            [self resolveConflictsWithCurrentURL:currentURL\n          \
    \  coordinator:coordinator];\n        });\n    }\n}\n```\n```\n\nIt’s important\
    \ to note that UIDocument represents its states using a bit field. Multiple state\
    \ bits can be turned on at one time. Therefore, we need to use a bitwise AND operator\
    \ to check for the state we’re interested in. If the UIDocumentStateInConflict\
    \ flag is set, we move on to resolve the conflict.\n\nWe start by using NSFileVersion\
    \ to get access to the URL of our current version. Then we create an NSFileCoordinator.\
    \ You may remember that UIDocument automatically creates NSFileCoordinators for\
    \ all the regular file loads and saves—but we need to do a bit of digital bushwhacking\
    \ here, so we have to handle the file coordination ourselves."
