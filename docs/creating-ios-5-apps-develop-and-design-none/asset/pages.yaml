- pgno: 404
  md: '# USING **SQLite STORES** TO **REDUCE MEMORY USAGE**


    Remember that for SQLite stores, predicates and sort descriptors are translated
    into SQL and executed in the database. While this can be a bit of a pain, it also
    means we can filter and sort based on relationships, but those relationships are
    still returned as faults. We never have to instantiate the corresponding managed
    objects into memory.


    If we wanted to perform the same sorting or filtering in Objective-C, we would
    need to instantiate all those relationships as well—and then execute the sort
    descriptors and predicates. This is just one of the ways an SQLite-based store
    helps improve performance and reduce your application’s memory footprint.


    # DATA PROTECTION


    For iOS 5 applications, the persistent stores now encrypt the data on disk. The
    persistent stores support a range of encryption options:


    +   - NSFileProtectionNone turns off encryption.

    +   - NSFileProtectionComplete provides the tightest security. The files can only
    be accessed after the device is authenticated and as long as the device is unlocked.
    Unfortunately, this can prevent your app from accessing the data while operating
    in the background.

    +   - NSFileProtectionCompleteUnlessOpen prevents access to files unless the device
    is authenticated and unlocked. Your application can continue to access any open
    files while locked; however, you cannot open new files.

    +   - NSFileProtectionCompleteUntilFirstUserAuthentication prevents access to
    files while the device is booting and until the user authenticates with their
    password. However, once the user authenticates, the files remain accessible, even
    if the device is later locked.


    Core Data will use NSFileProtectionCompleteUntilFirstUserAuthentication by default.
    We can change the protection level by assigning a value to the NSPersistentStoreFileProtectionKey
    when configuring our persistent store.'
  merge: -1
  img_proc: true
- pgno: 405
  md: '# # iCLOUD SUPPORT


    Core Data provides easy integration with iCloud. The iCloud support focuses on
    managing many of the details that were dealt with in Chapter 6. If you''re using
    a single centralized Core Data store, then setup is simple: Set a couple of preferences
    when setting up the persistent store, then listen for updates. Everything else
    is handled automatically. There''s no need to use NSMetadataQuery to search for
    the file. We no longer need to worry about merging conflicts. We don''t even need
    to tell the application how to save and load our data. All of that is handled
    for us automatically.


    When using Core Data with SQLite stores, each application manages its own local
    database, and the database is never actually uploaded into iCloud storage. Instead,
    each database saves transaction log files and uploads the log files to iCloud.
    Other copies of the application can then identify and download these log files,
    using them to update the local database. This also means the file is only uploading
    deltas—the differences between the files on a per-entry basis. This greatly minimizes
    the amount of data that Core Data transmits between the app and iCloud.


    iCloud also uses three-way merges to automatically resolve conflicts on a per-entry
    basis. Here, the system compares both of the conflicting copies with the original.
    This allows for a much more accurate and autonomous merging.


    For example, look at the two-way merge we implemented in Chapter 6. Imagine a
    case where a WeightEntry instance is present in version A, but missing from version
    B. Our two-way merge had no way of telling whether this entry had been added to
    A or deleted from B. So, we erred on the side of caution, always choosing to keep
    the mismatched entry.


    A three-way merge, on the other hand, would be able to positively identify whether
    the entry had been added or deleted and would be able to take the appropriate
    action when merging. If it had been added to A, it should be included in the merged
    version. If it had been deleted from B, it should be removed.


    To set up a centralized Core Data store, we simply set the NSPersistentStoreUbiquitousContentNameKey
    and NSPersistentStoreUbiquitousContentURLKey keys in the options dictionary that
    we pass to addPersistentStoreWithType:configuration:URL:options:error: when creating
    our persistent store. We then register for the NSPersistentStoreDidImportUbiquitousContentChangesNotification
    (probably the longest constant name in Objective-C history),'
  merge: -1
