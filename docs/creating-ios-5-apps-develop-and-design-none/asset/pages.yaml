  md: "# SAVING USER DEFAULTS\n\nWe’re going to start by storing the default weight\
    \ units using NSUserDefaults. First, let’s define a few functions to simplify\
    \ our code.\n\nWe are just going to write C functions, but we still want them\
    \ to have full access to our Objective-C classes. So, we need the file to be compiled\
    \ as if it were Objective-C. The easiest way to do this is to create a new NSObject\
    \ class and then delete both the class interface and its implementation.\n\nRight-click\
    \ the Model group and create a new NSObject named WeightUnits. Then open up both\
    \ the header and implementation file and delete everything except the #import\
    \ directives. We can even move the Foundation import directive from the header\
    \ to the implementation file.\n\nNow, in WeightUnits.h, add the following code:\n\
    \n```\ntypedef enum {\n\n    LBS,\n\n    KG\n\n} WeightUnit;\n\nWeightUnit getDefaultUnits(void);\n\
    \nvoid setDefaultUnits(WeightUnit value);\n```\n\nHere we’re just defining our\
    \ WeightUnit enum and declaring two accessor functions for our default weights.\n\
    \nNext, switch to the implementation file.\n\n```\n#import \"WeightUnits.h\"\n\
    \n#import <Foundation/Foundation.h>\n\nstatic NSString* const WeightUnitKey =\
    \ @\"weight_unit\";\n\nWeightUnit getDefaultUnits(void) {\n    return [[NSUserDefaults\
    \ standardUserDefaults]\n        integerForKey:WeightUnitKey];\n}\n\nvoid setDefaultUnits(WeightUnit\
    \ value) {\n    [[NSUserDefaults standardUserDefaults]\n        setInteger:value\
    \ forKey:WeightUnitKey];\n}\n```"
