    # GRAPHVIEWCONTROLLER


    GraphViewController needs to populate the graph with data from Core Data, but
    unlike what we did with HistoryViewController, we won''t be using an NSFetchedResultsController.
    Instead, we will be using a raw NSFetchRequest. This means we must manage any
