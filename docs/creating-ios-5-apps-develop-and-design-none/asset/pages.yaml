- pgno: 171
  md: "```\n```objective-c\n[stack addObjectsFromArray:\n    [controller viewControllers]];\n\
    }\n\n// If it responds to setWeightHistory, set the weight\n// history.\nif ([controller\
    \ respondsToSelector:\n        @selector(setWeightHistory:)]) {\n    [controller\
    \ setWeightHistory:self.weightHistory];\n}\n\n}}\n```\n```\n\nWe start by creating\
    \ a new WeightHistory object and assigning it to our weight history property.\
    \ Then things get interesting. We create a mutable array and fill it with the\
    \ controllers for our tabs. We then use this array as a stack, taking each controller\
    \ off the stack and processing it in turn.\n\nIf the controller acts as a container\
    \ for other controllers (i.e., navigation controller, tab bar controller, split\
    \ view controller, or page view controller), we add its controllers to our stack.\
    \ Finally, if the controller has a setWeightHistory: method, we call it, passing\
    \ in our newly created WeightHistory object.\n\nFor our current project, we will\
    \ assign the weight history directly to our Enter weightViewController and GraphViewController\
    \ objects. However, when we get the navigation controller, we grab the HistoryViewController\
    \ from our navigation controller and add it to our stack. Then when the HistoryViewController\
    \ is popped off the stack, we assign our weight history to it as well.\n\nWe could\
    \ have simply hard-coded paths to our three main controllers and passed the data\
    \ objects directly, but this approach gives us additional flexibility for future\
    \ enhancements. We can easily add new view controllers, and our system will handle\
    \ them appropriately. We can even handle most view controller containers without\
    \ any modification to this code.\n\nThis is also an excellent example of how Objective-C’s\
    \ dynamic nature can greatly simplify our code. We pull an object from the viewControllers\
    \ array. We don’t need to know its class—or really anything about it. If it responds\
    \ to the methods we’re interested in, we call those methods. If not, we simply\
    \ move on to the next object in our stack."
