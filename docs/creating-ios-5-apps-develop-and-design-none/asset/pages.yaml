- pgno: 131
  md: '# UNDERSTANDING

    PRODUCTIVITY APPS


    The original iPhone Human Interface Guidelines (HIG) organized applications into
    three general categories: utility, productivity, and immersive applications. Utility
    applications provide a single view of the data with little or no interaction.
    Productivity applications manage and organize complex data. Immersive applications
    use custom views and controls, taking over the entire screen to provide a rich,
    interactive user experience.


    Apple has since dropped these categories from the iOS HIG, and that makes a certain
    amount of sense. As the platform continues to mature, developers naturally push
    against these boundaries. Few modern applications fit cleanly into one of these
    categories. Even back when the iPhone first came out, many applications used a
    hybrid approach. Look at the iPod app. Its Cover Flow interface injects an immersive
    element into an otherwise straightforward productivity app.


    However, there seems to be some benefit to at least thinking about these categories,
    especially when you are designing a new application. They can help you identify
    your application''s core features and then focus your design to maximize those
    features.


    We looked at a simple utility application in Chapter 1. Honestly, there''s not
    a lot to say about them. Utility apps provide a quick way to access relatively
    simple information. One screen, a few settings—if you''re thinking of anything
    more complicated than that, you should probably consider a different approach.


    Over the next few chapters, we will look at productivity applications. These apps
    manage and organize complex data. While you may provide some custom user interfaces,
    you should focus heavily on usability. Work to create a clean, streamlined solution
    that helps the user to move through the data in an unobtrusive and intuitive manner.


    Productivity applications typically use three tools to organize and interact with
    your data: UITabBarController, UINavigationController, and UITableView. You may
    not need all three, but these are the primary built-in tools for sifting through
    data.


    The UITabBarController lets the user easily switch between different tasks or
    different groups of data. For example, the Clock application lets the user choose
    between the different time-related tasks: World Clock, Alarm, Stopwatch, and Timer.
    The iPod app, on the other hand, allows the user to select different views of
    their data: Albums, Artists, Genres, Songs, Playlists, Videos, and so on. The
    App Store mixes both approaches, displaying three data groups (Features, Categories,
    and Top 25) and two tasks (Search and Updates).'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# WHAT DOES “PRODUCTIVITY” MEAN ANYWAY?


    The name “productivity app” is somewhat misleading. While many of these applications
    do focus on traditional productivity-oriented tasks, like to-do lists and calendars,
    any application that emphasizes data and organization may benefit from the productivity
    style.


    Mail is a perfect example of a traditional productivity app. It allows you to
    manage incoming and outgoing messages from a variety of email accounts. Many social
    networking applications also fall into this category—though you’d have trouble
    convincing me that Facebook improves productivity. Even the iPod app falls into
    this category, since its main task is organizing and accessing data.


    The tab bar can support any number of tab items. However, it can only show five
    tabs at a time. UITabBarController automatically manages any extra tab items by
    providing a More button and letting the user customize the items that appear on
    the tab bar. Note that if you have more than five tabs, the tab bar will display
    only four of them, since the More button takes up one of the spaces.


    Next, the UINavigationController lets users move from general to more specific
    views. This controller maintains a stack of views. When a new view is added to
    the top of the stack, that view slides in from the right while the old view slides
    off to the left. When the top view is popped from the top of the stack, the animation
    is reversed. This provides a very intuitive interface for moving through a hierarchy
    of views.


    While both UITabBarController and UINavigationController manage navigation between
    views, UITableView handles the actual display of data. Tables are often used to
    present lists. For example, the list of email accounts, the list of mailboxes
    within a single account, or even the list of messages within a single mailbox.
    UITableView displays a single column of cells. Individually, each cell can be
    quite complex, combining images, icons, and formatted text. In general, a single
    cell type is used throughout the table. Each cell represents a different entry
    from a list of similar items.


    However, UITableView has a secondary use as well. We can create a static table
    to organize a fixed set of heterogeneous pieces of data. In this case, the entire
    table is used to represent a single entry. Each row has its own unique formatting,
    displaying some aspect of this entry. As we change entries, the number and type
    of rows remain the same, only the data changes. We often use static tables to
    display detailed information about a selected leaf object in our data hierarchy.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# TAB BARS VS. NAVIGATION CONTROLLERS


    An application may have multiple UINavigationControllers or UITableViews; however,
    they should have only a single UITabBarController. Additionally, the UITabBarController
    should always be the root controller for your application. You can add a UINavigationController
    to a UITabBarController, but you should never add a UITabBarController to a UINavigationController.


    If you really need to, you can add tab bars to a view managed by a navigation
    controller, but you must create your own tab bar controller class. Generally,
    this should be a subclass of UIViewController and should adopt the UITabBarDelegate
    protocol. It’s not hard, but you will need to write custom code for managing the
    list of subviews, swapping them in and out as the user selects new tabs.


    Apple’s documentation strongly recommends having a single tab bar, making it your
    application’s root view, and having it visible and accessible in every scene.
    If this does not fit your application’s needs, then perhaps you should rethink
    your user interface. For example, a table view might better fit your needs.


    A productivity application combines some or all of these tools into a user interface
    that naturally matches the application’s data. In general, UITabBarController
    provides the coarsest organization, defining our broadest groups. Within each
    group, UINavigationController lets the user move from general to specific, while
    UITableView displays the information available at each level of detail.


    If you’re like me, you spend much of your day sitting in front of a computer.
    This has led to an ongoing battle to lose weight. To help in this fight, let’s
    build an application that will let users track their weight over time.


    Health Beat will have three main tasks: Users can enter new weights, they can
    view a graph showing how their weight changes over time, and they can bring up
    the complete history showing all their weight entries. We will use a tab view
    to navigate between these tasks. In addition, we will use a table view/navigation
    controller combination to manage our history view.


    This chapter will focus on the overall architecture of the application, on building
    a storyboard that connects our tab bar, table view, and navigation controllers,
    and on building and attaching our application’s model. We will flesh out this
    design and cover additional topics, such as saving and loading the data and drawing
    custom views, in later chapters.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '![](img/fe9fea534a8e7868f811f7cd33da015f_134_0.png)


    ![](img/fe9fea534a8e7868f811f7cd33da015f_134_1.png)


    Open the iOS Development workspace we created in Chapter 1. It should contain
    our Hello World project. Add a new project by selecting File > New > New Project
    from the menu. Then select iOS > Application > Tabbed Application and click the
    Next button (Figure 3.1).


    **FIGURE 3.1** Select the Tabbed Application template


    **FIGURE 3.2** Naming the product


    In the “Choose options” panel, name the project Health Beat, and set the Class
    Prefix to HB. Make sure that the Device Family pop-up menu is set to iPhone and
    that the Use Storyboard, Use Automatic Reference Counting, and Include Unit Tests
    checkboxes are all selected. Then click Next (Figure 3.2).


    In the final panel, select the location for the project. Make sure the “Create
    local git repository for this project” checkbox is selected, and that the Group
    drop-down is set to our iOS Development workgroup. Then click Create (Figure 3.3).


    This creates a basic tabbed application. In Xcode’s toolbar, change the scheme
    to Health Beat > iPhone 5.0 Simulator (Figure 3.4) and run the application.


    As you can see, the application template gives us a simple two-tab application
    (Figure 3.5). You can press the tab buttons to switch between the first and second
    views.


    Looking at the code, our template created an app delegate (HBAppDelegate), two
    view controllers (HBFirstViewController and HBSecondViewController), the storyboard
    (MainStoryboard.storyboard), our tab-bar icons (first.png, first@2x.png, second.png,
    second@2x.png), and our supporting files. We also have a new group for our unit
    tests.'
