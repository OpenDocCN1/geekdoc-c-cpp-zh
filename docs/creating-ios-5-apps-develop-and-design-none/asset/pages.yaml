    \ between /* and */, allowing us to create comments spanning several lines.\n\n\
    Finally, we reach the return keyword. This evaluates the expression to its right\
    \ and then exits the function, returning the expression’s value (if any) to the\
    \ caller. The calculateDistance() function calculates the distance between two\
    \ points using the Pythagorean theorem. Here we square the x and y distances using\
    \ the multiply operator. We add them together. Then we pass that value to the\
    \ C math library’s sqrt() function and return the result."
