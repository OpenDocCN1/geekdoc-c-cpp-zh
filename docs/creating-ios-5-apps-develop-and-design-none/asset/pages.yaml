- pgno: 397
  md: "easier to create our predicate using a formatting string. The NSPredicate class\
    \ then parses this string and builds a predicate to match.\n\nThe predicate parser\
    \ is whitespace insensitive. It is also case insensitive when it comes to keywords,\
    \ and it supports nested parenthetical expressions. The simplest predicates have\
    \ three parts: the left expression, a comparison, and the right expression.\n\n\
    These expressions can be constants, key paths, or variables. Most of the time,\
    \ we will compare one of the object’s key paths against a constant. String constants\
    \ can be typed directly into the formatting string, but they must be surrounded\
    \ by double quotes. Most of the other values (e.g., NSDate or NSNumber) are passed\
    \ in using the %@ formatting argument. We can even pass in string constants using\
    \ %@, and the parser will automatically quote them for us.\n\nThe comparison includes\
    \ most of what we expect: ==, <, >, <=, >=, and !=. The parser often understands\
    \ common variations for these. For example, the following comparisons are also\
    \ valid: =, =<, =>, and <>. The parser also adds the BETWEEN comparison—whose\
    \ right-hand side must be a two-value array.\n\nFor strings, we have the BEGINSWITH,\
    \ CONTAINS, ENDSWITH, LIKE, and MATCHES comparisons. Most of these should be relatively\
    \ straightforward. LIKE simply checks to see if the left-hand string is equal\
    \ to the right-hand string. However, it supports the ? and * wildcards for matching\
    \ a single character or zero or more characters. MATCHES, on the other hand, treats\
    \ the right-hand value as a regular expression. Appending [cd] to the end of the\
    \ comparison makes it case and diacritic insensitive.\n\nA few sample predicates\
    \ are shown below:\n\n```\n```objc\n// Determines if the object's lastName attribute\
    \ equals @\"Jones\".\n[NSPredicate predicateWithFormat:@\"lastName LIKE 'Jones'\"\
    ];\n\n// Determines if the object's pubDate occurred before\n// the given targetDate.\n\
    [NSPredicate predicateWithFormat:@\"pubDate < %@\", targetDate];\n\n// Determines\
    \ if the person is in our target demographics.\n[NSPredicate predicateWithFormat:@\"\
    age BETWEEN %@\",\n    [NSArray arrayWithObjects: [NSNumber numberWithInt:18],\n\
    \                               [NSNumber numberWithInt:34], nil]];\n```\n```"
