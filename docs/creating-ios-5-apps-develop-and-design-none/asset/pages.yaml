- pgno: 286
  md: '# # HOW THE SYSTEM MANAGES DIRECTORIES (continued)


    Apple currently appears to be cracking down on applications that save large files
    to either the Document or Application Support directories. This is especially
    true of any files downloaded from the Internet. As a rule of thumb, all downloaded
    content (at least, any significant amount of downloaded content) should be saved
    to the Caches file. Obviously, this could create a problem, since files in the
    Caches folder may be cleared whenever the device runs low on disk space.


    Imagine the following situation: A user downloads a number of maps for a GPS app
    before hopping on an international flight. The application saves these files to
    the Caches folder. Next, the user downloads an audio book. This uses up most of
    the device’s available space, triggering a low disk space warning. In response,
    iOS clears all the Caches folders. When the user gets off the plane, they will
    discover that they no longer have the maps they needed—and without an international
    data plan, there’s no good way to download replacements.


    Developers are currently talking with Apple about this issue, so don’t be surprised
    if this policy is refined as iCloud usage matures.


    # ## FILES COPIED DURING UPDATES


    When you update an application, the new application is saved to the device’s drive.
    Then, some files are copied from the old application to the new one. Finally,
    the old application is deleted.


    All files within the Document folder and within `<Application_Home>/Library/`
    are copied during an application update. This means the Application Support and
    Caches directories are both copied, as are any custom directories within `<Application_Home>/Library/`
    (e.g., the Private Documents directory mentioned previously).


    The Temporary directory is not copied.'
  merge: -1
  img_proc: true
