- pgno: 273
  md: "# CALCULATING A WEIGHT ENTRY’S COORDINATES\n\nThis method takes a weight entry\
    \ and the bounds for our trend line. We then calculate the coordinates for that\
    \ entry within those bounds.\n\n```\n```objective-c\n- (CGPoint) coordinatesForEntry:(WeightEntry*)entry\n\
    \                    inBounds:(CGRect)bounds {\n    NSTimeInterval secondsAfterStart\
    \ =\n        [entry.date timeIntervalSinceDate:\n         self.graphStats.startingDate];\n\
    \    CGFloat x = (float)secondsAfterStart /\n                (float)self.graphStats.duration;\n\
    \    x *= bounds.size.width;\n    x += bounds.origin.x;\n    CGFloat y = 1.0f\
    \ - (entry.weightInLbs -\n        self.graphStats.minWeight) /\n        self.graphStats.weightSpan;\n\
    \    y *= bounds.size.height;\n    y += bounds.origin.y;\n    return CGPointMake(x,\
    \ y);\n}\n```\n```\n\nWe start by calculating our x-coordinates. The x-coordinates\
    \ should be based on the entry’s date. The starting date should be at the left\
    \ edge of the bounds; the end date along the right.\n\nWe start by using timeIntervalSinceDate:\
    \ to calculate the number of seconds since our GraphStats starting date. We then\
    \ divide this by the duration of the GraphStats. This gives us a number from 0.0\
    \ to 1.0, where 0.0 is the starting date and 1.0 is the ending date. We convert\
    \ this to the actual x-coordinate by multiplying it by the bound’s width and then\
    \ adding the bound’s x-offset.\n\nNext, we do the same thing for the y-coordinates.\
    \ This time the maximum weight should be at the top of the graph’s bounds, the\
    \ minimum weight at the bottom. The math is basically the same as above—with one\
    \ small change. We need to invert the y-coordinates."
