- pgno: 317
  md: '# KNOW WHEN TO LOAD THEM, KNOW WHEN TO SAVE THEM


    Unlike desktop applications, iOS apps shouldn’t have a Save button. Instead, the
    application automatically saves its state at the appropriate times. Of course,
    that raises the question, what are the appropriate times?


    Traditionally, there have been two basic approaches. The first involves waiting
    and saving the application’s entire state (or at least all the changes) just before
    it goes into the background or terminates. The second involves saving each change
    as soon as the user makes it. They both have their advantages and disadvantages.


    It is often simpler to wait and save everything at once. This can greatly reduce
    the number of times you need to write to disk, and it can streamline and simplify
    your code. This is especially true when you are using NSCoder to persist a large
    object hierarchy. You cannot save just part of the object hierarchy—it’s an all
    or nothing procedure, and you probably don’t want to save your whole data file
    every time you make a tiny little change.


    On the other hand, iOS applications need to be able to transition quickly to the
    background. In general, we have about 5 seconds to save our data. In practice,
    we want to stay well short of that. We don’t want to accidentally lose user data
    because it took a fraction of a second longer than we expected. If our application
    needs to save a large amount of data, we may need to find ways to split it up
    and save off portions as the application is running, rather than leaving everything
    until the end.


    Additionally, even though well-made iOS applications tend to be more reliable
    than their desktop counterparts, they still crash. If you’re bulk-saving your
    application’s data, your users will lose all their work from the current session.


    Saving as you go helps to spread the computational cost over the application’s
    entire life cycle. In general, this prevents any noticeable lags as the application
    loads or saves a large chunk of data. In practice, this can be harder to achieve.
    We often intend to load only one or two entries—but if they refer to other entries,
    which refer to still other entries, we may accidentally pull in a much larger
    chunk of data.'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# # KNOW WHEN TO LOAD THEM (continued)


    You will typically need to use some sort of database or database-like technology
    to support a save-as-you-go approach. I highly recommend using Core Data, but
    SQLite is also well supported. You can also find a number of third-party solutions
    that are worth considering.


    On the downside, loading and saving as you go can easily become more complex and
    harder to maintain, especially if your persistence code ends up scattered throughout
    your model rather than concentrated in a couple of methods.


    Additionally, you need to make sure your application''s data does not end up in
    an inconsistent state if your application stops unexpectedly. For example, if
    a typical task involves several steps, you might want to wait until the entire
    task is finished before saving your application. If your application crashes in
    the middle of a task, saving after each step could leave a half-finished, malformed
    task in your database.


    Fortunately, UIDocument simplifies all of this. We no longer need to worry about
    when our document will be saved. UIDocument handles this for us.


    Unfortunately, we still need to give some thought to our data.


    If we use NSData objects in our contentsForType:error: and loadFromContents:ofType:error:
    methods, our data will be saved in a flat file. This means it must save and load
    our entire model, even if we only make a slight change. UIDocument tries to do
    its best. It will cache changes when it can, waiting for a lull in the application''s
    activities, and then perform the save operation on a background thread. Still,
    it is an all-or-nothing procedure.


    In some cases, we can fix this by using an NSFileWrapper instead. NSFileWrapper
    allows us to save our data as a file package. This means we''re saving a directory,
    which can contain any number of files and subdirectories. More importantly, our
    document can save and load the individual files within our directory independently
    of each other. If we have data that can be easily partitioned into separate files,
    then switching to an NSFileWrapper may produce significant performance improvements
    when saving and loading our documents.'
  merge: -1
  img_proc: true
- pgno: 319
  md: "The second approach is to show the user the different versions and let them\
    \ select the one to use. This has one major advantage—the user is in complete\
    \ control. They get to decide exactly what happens to their data. However, it\
    \ has several problems as well. First, it’s much harder to design. In some cases,\
    \ it may be extremely difficult to display the differences between versions in\
    \ any meaningful way. Also, it requires user intervention, and that means that\
    \ instead of using your app to get work done, they’re forced to waste their time\
    \ solving conflicts. Finally, we still risk losing user data. Anytime we pick\
    \ one version over another, something may get lost.\n\nThe best approach is to\
    \ merge all the conflicting versions. Unfortunately, this may not be possible\
    \ for all documents in all situations—but if you can do it, you probably should.\
    \ In our case, merging is relatively easy. We can simply take the union of all\
    \ the entries across all versions. Yes, this may cause a deleted weight entry\
    \ to reappear—but we’re not going to lose any information. The user can always\
    \ delete it again if they really want to.\n\nUnfortunately, as we will soon see,\
    \ relatively easy is not the same as actually easy.\n\nTo start with, we need\
    \ to monitor changes in our document’s state. In particular, we are looking for\
    \ a UIDocumentStateInConflict flag. Let’s start by registering our subclass for\
    \ notifications. Add the following code to initWithFileURL:.\n\n```\n```objc\n\
    // Set an initial defaults.\n_weightHistory = [[NSMutableArray alloc] init];\n\
    \n// Monitor document state.\n[[NSNotificationCenter defaultCenter]\n    addObserver:self\n\
    \    selector:@selector(documentStateChanged:)\n    name:UIDocumentStateChangedNotification\n\
    \    object:self];\n```\n```\n\nHere, we register to receive UIDocumentStateChangeNotifications,\
    \ calling documentStateChanged: whenever any occur. Of course, whenever we register\
    \ for notifications, we also need to unregister. We can override our class’s dealloc\
    \ method to unregister before our WeightHistory instance is deleted."
