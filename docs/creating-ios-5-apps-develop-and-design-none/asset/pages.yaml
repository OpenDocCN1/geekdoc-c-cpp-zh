  md: "# ADDING HELPER METHODS\n\nYou may have noticed that there is a problem with\
    \ our designated initializer. The class method [WeightEntry convertKgToLbs:weight]\
    \ does not actually exist. Let's fix that. Switch back to the header file and\
    \ declare the following two class methods:\n\n```\n@interface WeightEntry : NSObject\
    \ {\n}\n@property (nonatomic, assign, readonly) CGFloat weightInLbs;\n@property\
    \ (nonatomic, strong, readonly) NSDate* date;\n+ (CGFloat)convertLbsToKg:(CGFloat)lbs;\n\
    + (CGFloat)convertKgToLbs:(CGFloat)kg;\n- (id) initWithWeight:(CGFloat)weight\n\
    \            usingUnits:(WeightUnit)unit\n                forDate:(NSDate*)date;\n\
    @end\n```\n\nGo back to the implementation file. Just before the @implementation\
    \ block, add the following static variables. LBS_PER_KG will be used to convert\
    \ from pounds to kilograms and back, while formatter will be used to provide a\
    \ standard format for all weight values, using the proper number formatting for\
    \ your current locale. Yes, number formatting changes from country to country\
    \ as well.\n\n```\nstatic const CGFloat LBS_PER_KG = 2.20462262f;\nstatic NSNumberFormatter*\
    \ formatter;\n```\n\nNow, in the @implementation block, add our class methods:\n\
    \n```\n+ (CGFloat)convertLbsToKg:(CGFloat)lbs {\n    return lbs / LBS_PER_KG;\n\
    }\n+ (CGFloat)convertKgToLbs:(CGFloat)kg {\n    return kg * LBS_PER_KG;\n}\n```"
