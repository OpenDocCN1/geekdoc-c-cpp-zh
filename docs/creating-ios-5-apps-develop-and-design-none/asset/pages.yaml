- pgno: 501
  md: '# CORE MOTION


    The gestures give us access to all our ancillary controls, but we still haven’t
    dealt with our device’s main control; we want the user to steer the cursor by
    tipping and tilting their device. To do this, we must dig into the Core Motion
    framework.


    Core Motion lets us access data from a variety of sensors on the device. The `CMMotionManager`
    class acts as the gateway to all our motion data. It provides access to our device’s
    accelerometer, gyroscopes, and magnetometer, as well as the processed device motion
    data.


    Device motion combines data from all the sensors using a sensor fusion algorithm.
    This produces more accurate motion estimates but comes at a somewhat higher computational
    cost. Device motion also provides some features that individual sensors cannot
    perform on their own. For example, it automatically separates acceleration from
    the device’s motion, and acceleration from gravity.


    Unfortunately, not all devices have the same set of sensors. In particular, iPhone
    4 and iPad 2 both have access to all the sensors. iPhone 3GS and the original
    iPad only have the accelerometer and the magnetometer. The 4th generation iPod
    touch has both the accelerometer and gyroscopes, but no magnetometer. The 3rd
    generation iPod touch only has the accelerometer. And the simulator doesn’t support
    any of these sensors. Fortunately, Core Motion provides methods to check and make
    sure a feature is supported before you attempt to use it.


    > **NOTE:** Device motion is only available on devices that have both the accelerometer
    and the gyroscopes. If you have a magnetometer, that will be used to improve accuracy,
    but it is not necessary. Unfortunately, this means the iPhone 3GS, the original
    iPad, and the 3rd generation iPod touch do not support device motion.


    ![](img/fe9fea534a8e7868f811f7cd33da015f_501_0.png)


    Core Motion also provides both push and pull approaches to accessing the data.
    In the push approach, Core Motion runs on its own operation queue. We set the
    interval, and we provide a block of code to execute. Core Motion will then sample
    the sensors and call this block at every interval.


    In the pull approach, Core Motion updates the motion data in the background, and
    we sample it whenever we need to. In general, the pull approach is recommended
    for most applications. It is more efficient and typically requires less code.
    The push data should only be used for applications that focus on data collection,
    where we want to make sure we don’t accidentally miss any samples.'
  merge: -1
  img_proc: true
