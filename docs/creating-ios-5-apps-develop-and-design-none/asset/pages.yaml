- pgno: 127
  md: 'Notice that we did not need to alter the implementation of enumerateObjectsUsingBlock:
    at all. We also didn''t need any instance variables. Most importantly, everything
    is kept nicely in one place.


    Best of all, the solution is scalable. If we want different behaviors somewhere
    else—no problem. We write a new block, capture all the local variables we need,
    and then call our generic enumeration method. A single generic method handles
    all our needs.


    NOTE: Before ARC, we had to be a little careful with blocks. By default, blocks
    were built on the stack, and they were destroyed once they went out of scope.
    To store a block in an instance variable for later execution, we had to copy the
    block to the heap. Then we had to release it once we were done. Fortunately, ARC
    has simplified things yet again. We can create blocks, store them, use them, and
    even return them. We don''t need to worry about whether they''re on the heap or
    on the stack. ARC handles all the copying and memory management details for us.


    ![](img/fe9fea534a8e7868f811f7cd33da015f_127_0.png)'
  merge: -1
  img_proc: true
