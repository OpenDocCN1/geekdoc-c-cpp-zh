- pgno: 271
  md: "We start by calling the coordinatesForEntry:inBounds: helper method to calculate\
    \ the entry’s coordinates within our selected bounds. Then, if our Bezier path\
    \ is empty, we move the cursor to the starting point. Otherwise, we add a new\
    \ line segment stretching from the current cursor location to the provided point.\
    \ This also updates the cursor’s location to the new point.\n\nOnce the path is\
    \ complete, we set the stroke color and draw it.\n\n# ## DRAWING THE REFERENCE\
    \ LINES AND LABELS\n\nNow let’s implement the reference line helper method:\n\n\
    ```\n```objc\n- (void)drawReferenceLineWithLabel:(NSString*)label\n          \
    \                    font:(UIFont*)font\n                                 atY:(CGFloat)y\n\
    \                  withTextWidthOffset:(CGFloat)xOffset {\n    // Set x-coordinate.\n\
    \    CGFloat x = self.margin * 2.0f;\n    [self.textColor setFill];\n    [label\
    \ drawAtPoint:CGPointMake(x, y - (font.lineHeight / 2.0f))\n             withFont:font];\n\
    \    x += self.margin + xOffset;\n    UIBezierPath* referenceLine = [UIBezierPath\
    \ bezierPath];\n    referenceLine.lineWidth = self.referenceLineWidth;\n    [referenceLine\
    \ moveToPoint:CGPointMake(x, y)];\n    [referenceLine addLineToPoint:\n      \
    \  CGPointMake(self.bounds.size.width -\n            (self.margin * 2.0f), y)];\n\
    \    [self.referenceLineColor setStroke];\n    [referenceLine stroke];\n}\n```\n\
    ```"
