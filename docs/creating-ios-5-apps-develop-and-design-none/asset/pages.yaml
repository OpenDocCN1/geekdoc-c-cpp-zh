- pgno: 409
  md: '# ## REDUCING MEMORY OVERHEAD


    In general, unless you have a very good reason to do otherwise, you should always
    use an SQLite-based store. You should also avoid loading more objects into memory
    than is absolutely necessary. I also recommend saving changes as you go—rather
    than letting unsaved changes accumulate in the managed object context. This also
    helps free up memory and can help you avoid problems with overly long save times.


    By default, Core Data only retains objects that have unsaved changes. However,
    managed objects do retain each other through relationships. This can easily create
    retain cycles, which will prevent objects from being released. If you find that
    you are accumulating large numbers of objects in memory, you can break these cycles
    by re-faulting the objects.


    We can manually refault objects by calling the context’s `refreshObject:mergeChanges:`
    method. We can also clear the entire managed object context by calling its `reset`
    method.


    > > **NOTE:** Calling `reset` on the managed object context will invalidate any
    objects currently in the context. Be sure to dispose of all references you have
    to these objects before resetting. Accidentally holding onto these references
    will produce dangling pointers, leading to errors that are bizarre, intermittent,
    and otherwise difficult to debug.


    ![](img/fe9fea534a8e7868f811f7cd33da015f_409_0.png)


    # ## LARGE DATA OBJECTS


    Adding large binary objects (i.e., images, sounds, videos, etc.) to a persistent
    store can severely affect performance. Here we get into an area that’s more art
    than science. How large is large? Well, the answer really depends on how your
    application uses the data. If you’re only loading one or two objects into memory
    at a time, then large attributes may not be a problem. If you’re loading hundreds
    or thousands—you really need to think things through.


    In general there are three approaches. You can store the object directly in the
    data as an attribute. This is usually only recommended for small binary objects.


    Next, you can create a separate entity for the data and refer to it using a to-one
    relationship. This can be particularly helpful if the binary data isn’t always
    used. When your object is fetched, the to-one relationship will be a fault. You
    won’t load the binary data unless you actually need it. This is recommended for
    modestly sized data objects.'
  merge: -1
  img_proc: true
- pgno: 410
  md: 'Finally, you can store the data object directly in the device''s file system
    and save the path in the database. You then manually load the data when necessary.
    This is recommended for the largest objects.


    As a rule of thumb, if your object is measured in kilobytes, it''s probably modest;
    if it''s measured in megabytes, it''s large. However, this is an area where you
    definitely want performance testing. Just remember, the end users often use applications
    in unexpected ways. Don''t be surprised when they add 100,000 entities to the
    persistent store or try to load a 10 MB text file. Try to test these extremes,
    if possible.


    Fortunately, iOS 5 simplifies all this. Binary data attributes now have an Allows
    External Storage checkbox. Simply select this when configuring the attribute.
    The system will heuristically decide whether to store your binary data directly
    in the database or to simply store a URL and load the file as needed. All of this
    is transparently handled behind the scenes. There is, however, one small restriction:
    Once external storage is enabled, we cannot use the binary data in our fetch request''s
    predicate.


    # TOOLS


    Performance testing is covered in more detail in Bonus Chapter B, which can be
    found at the book''s website: http://www.freelancemadscience.com/book. However,
    it''s worth noting that Instruments has a number of tools to help troubleshoot
    Core Data performance issues. These include instruments to track Core Data fetches,
    saves, faults, and cache misses. You will want to use these in conjunction with
    the regular allocations, leaks, and time profile when testing your application.


    As always, you should focus on getting the application working properly first
    and then try to optimize the code based on actual performance data. Premature
    optimization often wastes your time without producing any tangible results.'
  merge: -1
  img_proc: true
