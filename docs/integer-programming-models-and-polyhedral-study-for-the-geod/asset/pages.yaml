    # 2. Geodesic classification and segmentation problems


    # 2.1. Preliminary


    We follow the basic concepts and terminology in graph theory as in Bondy & Murty
    (2014). A path in a graph $G=(V, E)$ between two vertices $u$ and $v$ is a sequence
    of vertices $p=(v_0, v_1, ..., v_k)$ where $v_0=u$, $v_k=v$ and $(v_{i-1}, v_i)
    \in E$ for all $i=1, ..., k$. The length of the path is $k$. A shortest path between
    $u$ and $v$ is denoted by $d(u, v)$. The distance between $u$ and $v$ is the length
    of the shortest path between them.


    In this section, we formulate the different types of 2-GSP that form the basis
    based on the geodesic classification.


