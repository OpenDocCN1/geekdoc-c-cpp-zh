    # 1. Introduction


    A present approach to the classification problem that appears in the context of
    supervised learning classification. It consists of the methods, which are characterized
    by numerical features, as colored points in ℝᵈ, where d ≥ 1. The goal is to assign
    a point to a class represented by a center. The method then aims to carry out
    the classification of natural samples by non-intersecting convex sets in such
    a way that all points in each set have the same color (the color of the set).
    The sample points whose color deviate from the color of their sets are outliers.
    This approach, using continuous optimization methods, including linear and quadratic
    programming, has been developed in recent years (see e.g. Cortes & Vargas (1995),
    Fanios & Hansson (1998) and others). As seen in Bertsimas & Shimida (2017), Xu
    & Papageorgiou (2009), typical solution methods are used to determine which convex
    hulls of the remaining samples of each class are distinct. Then, they simultaneously
    select theers that best separate the two classes (for example, by maximizing


    the distance between closest points of either class and a hyperplane.


    In Araújo, Corrêa, Labbé (2019), a novel variant of the classification problem
    was introduced that differs from the Euclidean classification in several aspects
    of the input parameters. This variant can be regarded as a discrete version in
    the case where space is replaced by an undirected graph. Similarly, the method
    is based on the convexity between discrete and continuous methods. This correspondence
    is established by the vertex set and the distance between the vertices as


    Geodesic classification. From the notion of convexity, the geodesic classification
    problem (GCP) is defined in Araújo et al. (2019) with the following characteristics:


    Unlike the Euclidean case, where an instance is defined by an arbitrary hyperplane
    and the set of points, an instance of GCP is characterized by an arbitrary (unweighted
    and connected) graph G=(V, E) and a set that represents a subset of V. The universe
    U is the set of vertices of the graph. In contrast to the Euclidean case, where
    each object in GCP is characterized by its binary similarities with other objects,
    which are represented by the edges of E. While in the Euclidean formulation the
