    # ABSTRACT


    +   Article history

    Received 21 May 2022

    Accepted 18 August 2023


    +   Keywords:

    Combinatorial optimization

    Classification

    Geodesic convexity

    Polyhedral combinations

    Integer programming


    We study a discrete version of the classification problem in Euclidean space,
    to be called the geodesic classification problem. It is defined on a graph, where
    some vertices are initially assigned and the remains classified. This vertex partition
    is grounded on the concept of geodesic convexity on graphs, as a replacement for
    Euclidean convexity in the multidimensional space. We propose new integer programming
    models along with branch-and-bound algorithms to solve them. We carry out a polyhedral
    analysis of the methods, which defines inequalities and separation algorithms.
    Finally, we run experiments to evaluate the computational efficiency and the classification
    accuracy of the proposed approaches by classic solution methods for the Euclidean
    classification problem.


