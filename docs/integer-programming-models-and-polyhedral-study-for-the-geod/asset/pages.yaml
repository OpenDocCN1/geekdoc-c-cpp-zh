    # **5.1 Objective functions**


    Given a feasible solution $(a, b)$ of 2-GCP, the vertices in $V \setminus (U \cup
    \mathcal{R})$ are outliers while in $(H_a \cup H_b)$ they are called $(a, b)$.
    Outliers and uncovered vertices establish a relationship between $a_G$ and $b_G$
    concerning their linear distance. The objective function of the formulation as
    a measures how much $V$ deviates from the separable sets $a, b$.


    In practice, there are several ''criteria'' that could guide the minimization
    of the outliers. The base of the formulation could, with the objective function,
    to penalize uncovered vertices.


    The experiments consider here the minimization of the outliers, the objective
    function in both formulations ILP1 and ILP2 we use


    ```

    $\min \sum_{i \in V} y_i$,

    ```


    Other evaluated functions have not led to results in terms of classification measures
    such as accuracy.


