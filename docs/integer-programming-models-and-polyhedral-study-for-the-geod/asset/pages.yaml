    # Integer programming and polyhedral study for the geodesic classification on
    graphs


    Paulo H. M. Araújoᵃ,b*, Manuel Campeloᵇ, Ricardo C. Corrêaᶜ, Martine Labbéᵈ


    +   ª Federal University of Coeará, Quixadá, Brazil

