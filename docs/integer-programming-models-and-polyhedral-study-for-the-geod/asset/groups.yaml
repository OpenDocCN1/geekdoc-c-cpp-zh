    instances, because in such cases the size of U for the model constraints is generally
    smaller, which can reduce the number of nodes. The instances between 25% and 35%
    are shown to be the hardest to solve.


    ## 6.2. Realistic instances


    To test the algorithms for realistic applications, we perform experiments using
    two datasets: Parkinson''s instances (Litcher, McCarthy, Costello, Monge) and
    Cardiac Emission Tomography (SPECT) images (Kiuran, Tadis, Ogela) available at
    https://archive.org/. These instances are generated in terms of the Euclidean
    classification problem, where each point represents a point to predict. From each
    dataset, we derive two groups of 10 instances: the first (resp. second) group
    is formed by randomly choosing. Considering all random instances, the average
    running time of Algorithm 1 was about twice, which is very good for every random
    instance. However, Algorithm 2 worked better in time, yielding an average running
    time T2 much larger than T1. Overall, T1 was better than T2 in instances with
    many constraints, except for the greater number of variables and added lazy constraints/cuts.


    The addition of the generalized inequalities (16) and (17) in the root node yielded
    a very good reduction of instances, rare inequalities (9, 16), and generalized
    inequalities did not reduce the number of instances in the final result of the
    branch-and-cut algorithms. Regarding the lazy constraints proposed for ILP, its
    application with all valid constraints (4) added to the initial model, it was
    impractical to solve the problem without the lazy constraints scheme since the
    number of such constraints is potentially exponential. Same was observed for the
    lazy constraints of ILP2. was much better than including all of them in the initial
    model. On average, only 5/7 of these inequalities which are added during the root
    node in step 5 of Algorithm 2, did not have a significant effect on the running
    time for random instances. However, they reduced the number of lazy constraints
    (15) by 78%. On average, only 8/8 of these were added in ILP2, and they reduced
    the running time in 31 and would be very useful for such instances.


