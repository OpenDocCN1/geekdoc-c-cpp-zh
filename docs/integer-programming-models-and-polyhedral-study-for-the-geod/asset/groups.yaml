    \mathcal{R})$ are outliers while in $(H_a \cup H_b)$ they are called $(a, b)$.
    Outliers and uncovered vertices establish a relationship between $a$ and $b$ concerning
    their linear distance. The objective function of the formulation measures how
    much $V$ deviates from separable sets $a, b$.


