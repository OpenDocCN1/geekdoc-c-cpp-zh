    **相关问题**。在图文献方面，GSP（以及 GSP CP）可以与广泛的图划分问题相关。例如，顶点划分问题涉及将图划分为两个集合（$V_1, V_2$），使得
    $V_1$ 和 $V_2$ 之间的任何路径都经过 $S$。目标是最小化受某些值限制的集合 $V_1$ 和 $V_2$ 的大小。相比之下，GSP 解决的问题是每个顶点都寻找通往并返回离群点的最短路径。OUTSP
    已被广泛研究。特别是，Balanas 和 Sousa (2008, 2009) 中提出了 GSP 的各种变体，多商品相关的树划分问题（MRTMSP）通过将图划分为
    $k$ 个不交集（$V_1, ..., V_k$）来解决，使得每个 $V_i$ 有一个区分特征，且不同集合之间的任意两个顶点至少被隔开 $d$（Mahjoubi,
    Moutin, 2019）。Cornaaz 等人 (2019) 也出现在我们的结果中——特别是最短路径通向引用参考文献提到的锚点图的离群点，星形树也出现在我们的背景中。在这种情况下，我们可以从将颜色数量切换到丰富的图中获益，使得每种颜色连接一个连通子图。在树的情况下，这意味着两个顶点之间的（最短）路径是唯一的。对于
    GSP，相似性约束类似于 Lima (Karp & Wakabayashi, 2014) 中用于建模 CRP 的约束，CRP 也出现在我们为 GSP 提出的一种
    ILP 表述中。这些是我们希望建模团划分问题（Grötsch & Wakabayashi, 1990）的问题实例。


    值得注意的是 GSP 与寻找最大直径为 $d$ 的图划分问题之间存在自然联系。对于 $d=2$，正如 Complete 等人 (2017; Buzatu &
    Catarcius, 2015) 所证明的，这意味着某些图无法被覆盖或划分为 $k$ 个集合。此外，对于 $d > 2$，该问题是 NP-hard 的。对于
    GSP 也是如此。另一方面，GSP 可以看是非图复杂度问题与数学规划中众知的集合覆盖问题的结合。


    **论文结构**。第 2 节介绍了测地线 2-GSP 分割问题的生成，与问题相关的 ILP 表述在第 3 和第 4 节中研究。第 5 节给出实验结果，第 6
    节评估了每种计算方法的性能。我们使用了生成的实例以及源自真实数据（社交网络案例）的实例，以便我们的方法与已知方法进行比较。最后，我们在第 7 节提出了结论和未来工作方向。参考文献、图论、线性代数、多面体组合、编程的结果以及
    Nemhauser & Wolsey (1988) 中使用的分支定界法。


