    250] 之间变化。结果显示算法 1 运行良好，特别是对于中等规模实例，因为在这种情况下模型约束的 U 通常较小，可以减少节点数量。25% 到 35% 之间的实例被证明是最难求解的。


    ## 6.2. 实际实例


    为了通过实际应用测试算法，我们使用了两个数据集进行实验：帕金森实例（Litcher, McCarthy, Costello, Monge）和心脏发射断层（SPECT）图像（Kiuran,
    Tadis, Ogela），可从 https://archive.org/ 获取。这些实例根据欧几里得分类问题生成，每个点代表一个待预测的点。从每个数据集中，我们得到两组
    10 个实例：第一组（相应第二组）通过随机选择。考虑所有随机实例，算法 1 的平均运行时间大约是倍，这对于每个随机实例都是非常好的。然而，算法 2 在时间上表现更好，产生的平均运行时间
    T2 远大于 T1。总体而言，在约束多的实例中，T1 优于 T2，变量数量更多且添加了懒约束/割除。


