    # 2. Geodesic classification and segmentation problems


    # 2.1. Preliminary


    We follow the basic concepts and terminology in graph theory as in Bondy & Murty
    (2014). A path in a graph $G=(V, E)$ between two vertices $u$ and $v$ is a sequence
