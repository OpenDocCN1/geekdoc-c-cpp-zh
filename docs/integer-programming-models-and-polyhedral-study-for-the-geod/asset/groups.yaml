    RAM 和 Linux 操作系统的机器上进行，使用 C++ 语言和 CPLEX 软件包求解线性和整数规划问题。实例 1 和 2 的结果仅显示了主导实例以及实际所需的时间。每个实例被设置为
    3600 秒。这表明相应的实例超过了时间限制。


