    $v$）最短路径中的序列，其不等式使得左侧产生最大值。我们在 DAG（有向无环图）中搜索路径，该图描述了所有从 $h$ 开始的最短路径中所包含的序列。为了为给定的
    $h \in V$ 创建这样一个 DAG，我们应用搜索（在图 7 的图中所示）。


    - 1. 创建所有从 $h$ 开始的路径的 DAG。这可以通过类似于第 5.2 节中描述的广度优先搜索算法计算出来（图 7b）；

    - 2. 计算步骤 1 中 DAG 的传递闭包（该 DAG 中从 $h$ 出的路径是包含在从 $h$ 开始的最短路径中的序列）。为此，我们再次应用该算法。

    - 3. 最后，创建一个汇点 $f$，并对于每个满足 $(h, v) \in E$ 的顶点 $v$ 添加边 $(v, f)$。


    对于给定的 $h, v$，得到的 DAG 给出。注意最短路径从 $h$ 到 $v$ 具有凸性的路径（序列）产生了一个广凸不等式 (17)。


    考虑 DAG 中从 $h$ 到 $f$ 的具有凸性的路径，其顶点序列为 $S = (h=v_0, v_1, ..., v_k=f)$。广凸不等式 (17)
    的左侧由 $S$ 和类 $K \in [B, R]$ 诱导。


    $$K_{v_0,v_1} + K_{v_1,v_2} + ... + K_{v_{k-1},v_k} = K_{v_0,v_1} + K_{v_1,v_2}
    + ... + K_{v_{k-1},v_k} + 2K_{v_1,v_2} + ... + 2K_{v_{k-2},v_{k-1}} = K_{v_0,v_k}
    + 2\sum_{i=1}^{k-2} K_{v_i,v_{i+1}} \quad (22)$$


    设 $\phi$ 为 $\phi$ 的泛函解。因此，为了计算 DAG 中的最大路径，我们为 DAG 的每条边分配权重 $w(u, v) = K_{u,v}$。通过计算包含弧
    $(u, v)$ 的路径权重，我们根据 $u$ 是否出现在路径中或处于偶数位置，将 $w(u, v)$ 乘以 1 或 2；然而，路径的权重是其边权重（带有相应的权重）之和，这产生了
    $\phi$。


    我们可以通过按拓扑顺序遍历 DAG 并计算路径权重来确定最大权路径。我们必须注意将权重乘以 1 或 -1。如果最大路径的权重大于 0，则违反了不等式并选择该路径。


    对于给定的源点 $h$，算法主要由 Dijkstra 算法决定，其复杂度为 $O(|V|^2 \log |V|)$，拓扑排序可以通过深度优先搜索算法在 $O(|V|
    + |E|)$ 的复杂度内实现。


    ## 计算实验


