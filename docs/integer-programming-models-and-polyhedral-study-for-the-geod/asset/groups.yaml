    # 1. Introduction


    A present approach to the classification problem that appears in the context of
    supervised learning classification. It consists of the methods, which are characterized
    by numerical features, as colored points in ℝᵈ, where d ≥ 1. The goal is to assign
    a point to a class represented by a center. The method then aims to carry out
    the classification of natural samples by non-intersecting convex sets in such
    a way that all points in each set have the same color (the color of the set).
    The sample points whose color deviate from the color of their sets are outliers.
    This approach, using continuous optimization methods, including linear and quadratic
    programming, has been developed in recent years (see e.g. Cortes & Vargas (1995),
    Fanios & Hansson (1998) and others). As seen in Bertsimas & Shimida (2017), Xu
    & Papageorgiou (2009), typical solution methods are used to determine which convex
    hulls of the remaining samples of each class are distinct. Then, they simultaneously
    select theers that best separate the two classes (for example, by maximizing the
    distance between closest points of either class and a hyperplane.


