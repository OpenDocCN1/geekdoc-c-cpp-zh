    执行中的平均分支节点数是 ILP1 的两倍。然而，ILP2 在分支后关闭间隙，且 CPLEX 生成的割比步骤 5 创建的间隙更大。这解释了为什么带根算法可能会获益。因此，如果我们不添加懒约束，这些潜在更大的间隙将会添加。图
