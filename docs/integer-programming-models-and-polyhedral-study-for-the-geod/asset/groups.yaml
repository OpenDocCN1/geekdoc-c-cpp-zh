    dataset (set of points used to choose the algorithm of). On the second hand, the
    classified instances are identified as p = 80 and p = 70% in the first and second
    group. Each instance is then transformed into a similarity graph (of 2-GCP) by
    the transformation suggested by Zakaria et al. (2016). As follows, each pair of
    points $(x_i, x_j)$ in $X$ is mapped to a distance using the Gaussian kernel function,
    $k(x_i, x_j) = \exp(-\frac{\|x_i - x_j\|^2}{2\sigma^2})$, where $\|x_i - x_j\|^2$
    is the square of the Euclidean distance between points $x_i$ and $x_j$. Then each
    point $x_i$ is mapped to a node of the graph, and the graph weights are the similarity
    values. We consider the $q$ nearest neighbors in terms of similarity, $v_{ij}$
    where $v_{ij}$ represents the similarity value between it and its $q$th most similar
    (used $q=10$).


    Some characteristics of each instance are shown in Table 6. Each table shows a
    summary of the graph properties: number (n); number of edges (m); edge density
    (Dens); diameter (Diam); minimum degree (minDeg); maximum degree (maxDeg).


    As a way to evaluate the quality of our classification algorithm, we run the SVM
    and MLP Euclidean classification on the instances as well as Algorithms 1 and
    2.


    Tables 7 and 8 show the results for Parkinson and SPECT instances with p = 70%
    (p is the absolute of instances). The columns are: running time of Algorithm 1
    ($T_{Alg1}$); running time of Algorithm 2 ($T_{Alg2}$); running time of MLP ($T_{MLP}$);
    accuracy ($Acc_{SVM}$/$Acc_{MLP}$) (the best among three methods; accuracy).


    Regarding the 20 Parkinson instances, our approach obtained the best accuracy
    in 10 instances, while 9 and 11 in others. For the 20 SPECT instances, the 2-GCP
    approach presented the best accuracy in 18 instances, while SVM and MLP did in
    1 and 14 respectively.


    average, 2-GCP has the best accuracy, significantly better than the one MLP. The
    results show that the 2-GCP approach was the best for 28 instances, while SVM
    was the best for only 11 and MLP for 25 of them.


    Comparing the running time of the three algorithms, we observe that Algorithm
    1 is the fastest, however, we notice that Algorithm 2 is the fastest for the Parkinson
    instances.


    # 7. Concluding


    In this work, we studied the 2-class geodesic classification problem (introduced
    in Araijo (2019), a new classification problem that is an element of the geodesic
    classification. The proposed methods present different perspectives on classification
    aspects and appear as an intersection of graph connectivity problem and the well-known
    set covering problem.


    The main focus of this work was, to polish the algorithms associated with these
    associations, by providing some values that indicate the performance. To run computational
    experiments, we show the results of the geodesic classification approach and the
    effectiveness of the proposed validation algorithm.'
