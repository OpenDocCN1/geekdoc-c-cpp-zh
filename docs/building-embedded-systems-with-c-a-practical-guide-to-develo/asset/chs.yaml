  ✨\U0001F389\n\n## I²C 简介\n\n\n\n\n# I²C 通信协议学习\n\n我们将了解“I to C”（`I2C`）模型，它代表内部集成电路（Inter-Integrated\
  \ Circuit）。有时也简称为 `I2C`。但这是一个简单的双线双向串行通信系统，旨在用于微控制器与外围设备之间的短距离通信。\n\n## I²C 的基本特性\n\
  \n`I2C`器件仅使用两个引脚进行数据传输，而不是传统并行总线使用的八个或更多引脚。这两个引脚分别是：同步芯片间数据传输的时钟信号线（SCL），以及数据信号线（SDA）。其中\
  \ SCL 表示串行时钟 (Serial Clock)，而 SDA 代表串行数据 (Serial Data)。\n\n这种减少通信引脚的方案可以极大地缩小封装尺寸并降低功耗，使其非常适合对空间有较高要求的应用场景。\n\
  \n![](img/image_rsrc1U7.jpg)\n\n由于使用了上述两条线路及相应机制，使得**两线接口**成为了一种名为*双工通讯接口*的双向通讯方式！每一个位于总线上传输数据的装置都扮演着角色。我们只需要为每个总线外加上拉电阻即可实现高电压电平输出状态的值设定——通常选用\
  \ 47.4 欧姆电阻；这表明一个过低或多个控制端口的低压影响将导致最终高低态变化取决于有无强制将其置零──从而达成所需的 ATX protocol 握手程序：当多条支流中有任何一条走到低电位时该路就被拒绝且无法恢复至高值——除非全部释放回初始默认定义下的完全非导通情形才被认为属于\"\
  单一高电平状态\"。所以整个过程简单来说是一个硬性规定为实现回应符合指定条件做决策依据设置特定门槛形成握手让权程序.\n\n根据所述物理限制之外还有几十甚至上百个从属节点能被挂载在这个单一架构体系中并由一组主控核心统一调配分配资源等等……在这里把它们称作\
  \ **Node**,它们能够扮演两种主要身份中的一种 :Master 负责产生全部时序振荡来源同时拥有发起结束某轮对话的绝对话语权限 ; Slave 则接收指令并且总是被动等待\
  \ master 寻址呼叫 ——双方均可在任意时刻互换信息有着四种工作情景即:主机发送、无线获取遥控讯号收到的变体(按桌面类型)、服务器回复应答确认末段结果......注意不同时间段内每一条单元具备多重身份属性但是只能选用其中之一执行瞬时操作;模式转换并非不能调节单次设定不允许重叠数值组合;接下来分析高速位间距规范格式详细步骤如下:\n\
  \n```\n在每位 byte 传送期间所使用的 data relay 都有来自沿 clk pin 特定的 high-to-low 边沿所产生的 sync 特征图案规则。\n\
  ```\n\n依照该规则实施,相关切换字段在 clk 端口活跃状态下不可变动只能在暂停时期展开调用————例外情况只有开始位和停止序列———稍后会专门介绍这部分流程意义阐述如下:\n\
  \n因此启动终止行为正如其名字含义本身同等简明扼要作用在于区分边界识别空闲忙碌状态维持秩序避免多者争夺干扰冲突 ；假设某个已掌控局势 master 想要开启新一轮\
