  \n\n\n\n\n我们可以使用定时器来测量事件之间的时间间隔，而时间有多种形式。一种分类方式是单次计时（one-shot）与周期计时（periodic）。此外，对于单次计时还有递减计数器（down\
  \ counter）和递增计数器（up counter）：当超时到达时，单次定时器完成工作并停止计数；而对于周期定时器，当超时时会自动复位自身并重新开始计数。\n\
