  \ 1 来将引脚拉高；要将其拉低则需要向其复位的不同比特位也写入一个 1 来实现清零功能。（翻译进行更清晰的解释）\n\n## BSRR 的使用机制\n在该寄存器中要将一个管脚设成**逻辑‘0’**(即让其变低)——你必须在其对应的某一位置上设为\
