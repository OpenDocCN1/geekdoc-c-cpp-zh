  \ 32 nucleo, 64 boats”的选项。我点击后，就得到了我们眼前的内容。\n\n通常它会附带一个原理图（schematic），以便人们能够设计自己的电路板。所以我们在这里看到了所有的引脚定义（`penultures`）。如果你曾经困惑过：在开发板上，引脚排列是以\
  \ Arduino 格式标注的——那我如何知道哪个是 `PE1`, `PE3`等？你可以在用户手册中找到答案。\n\n让我放大一下图片，这样我们可以看清微控制器实际的引脚名称是如何在此处标明的。在我们的开发板上，这些往往被写成类似于\
  \ U.S.的名称；我想让你对这些三个端子做什么呢？仿佛它不是 Raino 芯片似的——但这是微控制器芯片上真正的名称：如 P↑三→10、PB3 等。\n所以如果你想查清楚这一点就要去看用户手册。\n\
  继续滚动页面吧 ->我再缩小一点视图……往下看：\n如果没有 LED 部分的说明或者没有原理图的话我们就得自己找解决方案了……\n旧版本的手册里是有提供作为参考设计的示意图表的路径来寻找到相应的回路信息……\n\
  \n要找到对应的指示灯连接位置:  \n我可以按 Ctrl + F ，直接输入关键词 。到这里它显示:“features three leads.”  但这并不是我们需要的信息…因为它后面才告诉我们具体的灯(LED)在哪\
  \ ?    我们再按下回车键 。\n\n接着我们看到‘Getting Started’段落附近有绿颜色的提示 ——有关那个 LED （就在那里）哦请耐心看完这个过程;嗯很快会变得快起来的!\
  \    \n这边已经进入入门指导部分啦 ;并且它告诉你此处有一个用户按键按钮( User Button)，但它并没有告知你这是连接到什么的 …只是说有绿色 LCD\
  \ 屏幕 ·但其并不说哪里接了这个绿灯管脚....而在下文 ...当我们进入到关于 “LEds ”的小节时 :就会看到能用红色 **蓝色*以及**黄色/【绿色的】L-E-D\
  \ 做各种用途例如用作状态指示·其中某一颗 GREEN-Led 接到了 Arduino 数字 13 号口对应于 GPIO 端口 PA5 的位置... (有些其他\
  \ NUCLEO 开发版可能将之接到 PB13 上去).至于那枚按键则关联到了 PC134 上面正如我们在前面所见那样 …\n\n故想要查询某颗发光二极管只需要翻到\
  \ UserManual 中的《Led 章节》,而想查找物理上的轻触式开关就可以去查阅 《Push-button》段的描述了 :-)\n\n整个过程也许显得比你预料中花费时间更多一些\
  \ ,但我必须向你展示这些东西究竟是怎样一步一步从文档里面检索定位出来的噢 ~最后我会直接将结论甩给你即可简单地告诉你说:\"哎 !    diyodc_Simply_LEd\
  \ 等于 PA5 rdkey 时刻 PC138 啊\"并附言道如果还不放心可以去下载某个特定 PDF 验证)。不过当第一次演示完了以后待下次我一再强调哪些资料需要大家自行搜索的时候你们就能自主搞定了…\n\
