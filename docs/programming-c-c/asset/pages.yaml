    # Storage Classes


    Storage class of a variable defines the lifetime and visibility of a variable.
    Lifetime means the duration till the variable remains active and visibility defines
    in module of the variable is accessible. When we do not define a storage class,
    compiler automatically assigns a default storage class to it. A variable''s storage
    class gives information about the **storage location of variable in memory, default
    initial value, scope of the variable and its lifetime**. There are five types
    of storage classes in C++. They are:


    +   1. Automatic

    2. External

    3. Static

    4. Register

    5. Mutable


    | Storage Class | Keyword | Lifetime | Visibility | Initial Value |

    |---|---|---|---|--|

    | Automatic | auto | Function Block | Local | Garbage |

    | External | extern | Whole Program | Global | Zero |

    | Static | static | Whole Program | Local | Zero |

    | Register | register | Function Block | Local | Garbage |

    | Mutable | mutable | Class | Local | Garbage |


