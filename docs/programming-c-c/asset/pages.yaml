  md: '# C POINTER ADDITION


    We can add a value to the pointer variable. The formula of adding value to pointer
    is given below:


    ```

    new_address= current_address + (number * size_of(data type))

    32-bit

    ```


    For 32-bit int variable, it will add 2 * number.


    ```

    64-bit

    ```


    For 64-bit int variable, it will add 4 * number.

    Let''s see the example of adding value to pointer variable on 64-bit architecture.


    ```

    #include <stdio.h>

    int main(){

    int number=50;

    int *p;//pointer to int

    p=\&number;//stores the address of number variable

    printf("Address of p variable is %u \n",p);

    p=p+3; //adding 3 to pointer variable

    printf("After adding 3: Address of p variable is %u \n",p);

    return 0;

    }

    ```


    Output:

    Address of p variable is 3214864300

    After adding 3: Address of p variable is 3214864312


    As you can see, the address of p is 3214864300. But after adding 3 with p variable,
    it is 3214864312, i.e., 4*3=12 increment. Since we are using 64-bit architecture,
    it increments 12. But if we were using 32-bit architecture, it was incrementing
    to 6 only, i.e., 2*3=6. Integer value occupies 2-byte memory in 32-bit OS.'
