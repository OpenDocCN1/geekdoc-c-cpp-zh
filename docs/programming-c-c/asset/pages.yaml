    We can access the value 10 either by using the variable a or by using its address
    80F.


    The question is how we can access a variable using its address? Since the memory
    addresses are just numbers, they can also be assigned to some other variable.
    The variables which are used to hold memory addresses are called Pointer variables.


    A pointer is therefore nothing but a variable which holds an address of some other
    variable. And the value of a pointer variable gets stored in another memory location.


