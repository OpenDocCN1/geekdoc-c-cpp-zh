    \ union statement defines a new data type with more than one member for your program.\n\
    \nThe format of the union statement is as follows:\n\n```\nunion[union tag]{\n\
    \    member definition;\n    member definition;\n    ...\n    member definition;\n\
    }[one or more union variables];\n```\n\nThe union tag is optional and each member\
    \ definition is a normal variable definition, as int i; or float f; or any other\
    \ valid definition. At the end of union's definition, before the final semicolon,\
    \ you can specify one or more union variables but it is optional. Here is the\
    \ way you would define a union type named Data having three members i, f, and\
    \ str\n\n```\nunionData{\nint i;\nfloat f;\nchar str[20];\ndata};\n```\n\nNow,\
    \ a variable of Data type can store an integer, a floating-point number, or a\
    \ string of characters. It means a single variable, i.e., same memory location,\
    \ can be used to store multiple types of data. You can use any built-in or user-defined\
    \ data types inside a union based on your requirement.\n\nThe memory occupied\
    \ by a union will be large enough to hold the largest member of the union. For\
    \ example, in the above example, data type will occupy 20 bytes of memory space\
    \ because this is the maximum space which can be occupied by a character string.\
