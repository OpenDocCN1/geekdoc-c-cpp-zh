  md: '# Advantages and Disadvantages of Recursion


    Recursion makes program elegant. However, if performance is vital, use loops instead
    as recursion is usually much slower.


    That being said, recursion is an important concept. It is frequently used in data
    structure and algorithms. For example, it is common to use recursion in problems
    such as tree traversal.


    # ARRAYS


    Array is a kind of data structure that can store a fixed-size sequential collection
    of elements of the same type. An array is used to store a collection of data,
    and it is often more useful to think of an array as a collection of variables
    of the same type.


    Instead of declaring individual variables, such as number0,number1, ..., and number9,
    you declare array variable such as numbers and use numbers[0], numbers[1], and
    ..., numbers[99] to represent individual variables. A specific element in an array
    is accessed by an index.


    All arrays consist of contiguous memory locations. The lowest address corresponds
    to the first element and the highest address to the last element.


    First Element


    Last Element


    | Numbers[0] | Numbers[1] | Numbers[2] | Numbers[3] | .... |


    # Characteristics of Arrays in C


    +   1. An array holds elements that have the same data type.

    2. Array elements are stored in subsequent memory locations.

    3. Two-dimensional array elements are stored row by row in subsequent memory locations.

    4. Array name represents the address of the starting element.

    5. Array size should be mentioned in the declaration. Array size must be a constant
    expression and not a variable.'
