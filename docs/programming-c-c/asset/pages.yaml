    # LOOPING STATEMENTS


    # Introduction


    A computer is the most suitable machine to perform repetitive tasks and can tirelessly
    to do a task of thousands of times. Every programming language has the feature
    to do such repetitive tasks with the help of certain form of statements. The process
    of repeatedly executing a collection of statement is called looping. The statements
    executed many numbers of times based on the condition. But if the condition is
    given in such logic that the repetition continues any number of times with no
    fixed condition to stop looping those statements, then this type of looping is
    called Infinite looping.


    A loop statement allows us to execute a statement or group of statements repeatedly
    multiple times. In C programming language, there are three types of loops: while,
    do-while and for.


    A loop consists of two parts, a body of a loop and a control statement. The control
    statement is a combination of some conditions that direct the body of the loop
    to execute until the specific condition becomes false.


    # Why use loop?


    When you need to execute a block code several number of times, then you need to
    use looping concept in C language.


    # Advantage with looping statement


    +   - Reduce length of Code.

    - Take less memory space.

    - Burden on the developer is reducing.

    - Time-consuming process to execute the program is reduced.'
