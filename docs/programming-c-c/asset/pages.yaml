  md: "# 4. Inline Functions in C++\n\nAll member functions defined inside the class\
    \ definition are by default declared as Inline.\n\nInline functions are actual\
    \ functions, which are copied everywhere during compilation, like preprocessor\
    \ macro, the overhead of function calling is reduced. All the functions defined\
    \ inside class definition are by default inline, but you can also make any non-class\
    \ function inline by using keyword **inline** with them.\n\nFor an inline function,\
    \ declaration and definition must be done together.\n\n```\ninline void fun(int\
    \ a)\n{\n    return a++;\n}\n```\n\n# Some Important Points about Inline Functions\n\
    \n+   1. We must keep inline functions small, small inline functions have better\
    \ efficiency.\n\n+   2. Inline functions increase efficiency, but we should not\
    \ make all the functions inline. Because if we make large functions inline, it\
    \ may lead to **code bloat**, and might affect the speed too.\n\n+   3. Hence,\
    \ it is advised to define large functions outside the class definition using scope\
    \ resolution :: operator, because if we define such functions inside class definition,\
    \ then they become inline automatically.\n\n+   4. Inline functions are kept in\
    \ the Symbol Table by the compiler, and all the call for such functions is taken\
    \ care at compile time.\n\n# Limitations of Inline Functions\n\n+   1. Large Inline\
    \ functions causes Cache misses and affect performance negatively.\n\n+   2. Compilation\
    \ overhead of copying the function body everywhere in the code on compilation,\
    \ which is negligible for small programs, but it makes a difference in large code\
    \ bases.\n\n+   3. Also, if we require address of the function in program, compiler\
    \ cannot perform inlining on such functions. Because for providing address to\
    \ a function, compiler will have to allocate storage to it. But inline functions\
    \ do not get storage, they are kept in Symbol table."
  merge: -1
  img_proc: true
