- pgno: 50
  md: '# 2. Explicit Type Conversion


    Explicit type conversion rules out the use of compiler for converting one data
    type to instead the user explicitly defines within the program the data type of
    the operands in the expression.


    The example below illustrates how explicit conversion is done by the user.


    Example:


    ```

    double da = 4.5;

    double db = 4.6;

    double dc = 4.9;

    //explicitly defined by user

    int result = (int)da + (int)db + (int)dc;

    printf("result = %%d", result);

    Output:

    result=12

    ```


    Thus, in the example above, we find that the output result is 12 because the result
    expression the user has explicitly defined the operands (variables) as integer
    data type. Hence, there is no implicit conversion of data type by the compiler.


    If in case implicit conversion was used, the result would be 13.


    # FORMAT INPUT AND OUTPUT FUNCTIONS IN C


    Input means to provide the program with some data to be used in the program and
    Output means to display data on screen or write the data to a printer or a file.


    C programming language provides many built-in functions to read any given input
    and display data on screen when there is a need to output the result.


    All these built-in functions are present in C header files, we will also specify
    the name of header files in which a particular function is defined while discussing
    about it.


    # scanf() and printf() functions


    The standard input-output header file, named stdio.h contains the definition of
    the functions printf() and scanf(), which are used to display output on screen
    and to take input from user respectively.'
