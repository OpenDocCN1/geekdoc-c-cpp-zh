    # Accessing Data Members of Class in C++


    Accessing a data member depends solely on the access specifiers (public, private
    and protected) of that data member. If it is public, then the data member can
    be easily accessed using the direct member access (.) operator with the object
    of class.


    If the data member is defined as private or protected, then we cannot access the
    data variables directly. We will have to create special public member functions
    to access, use or initialize the private and protected data members. These member
    functions are also called Accessors and Mutator methods or getter and setter functions.


