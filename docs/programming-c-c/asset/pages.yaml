    # C Identifiers


    In C language, identifiers are names given to variables, constants, functions
    and user-defined data. These identifiers are defined against a set of rules.


    # Rules for an Identifier


    +   1. An identifier can only have alphanumeric characters (a-z, A-Z, 0-9) and
    underscore (_).

    2. The first character of an identifier can only contain alphabet (a-z, A-Z) or
    underscore (_).

    3. Identifiers are also case sensitive in C. For example, name and Name are two
    different identifiers in C.

    4. Keywords are not allowed to be used as Identifiers.

    5. No special characters, such as semicolon, period, whitespaces, slash or comma
    are permitted to be used in or as Identifier.


    When we declare a variable or any function in C language program, to use we must
    provide a name to it, which identified it throughout the program.


    # Example:


    ```

    Intmyvariable = "sekhar";

    ```


    Here, myvariable is the name or identifier for the variable which stores the value
    "sekhar" in.


    # C CONSTANTS


    Constants refer to fixed values that the program may not alter during its execution.
    These fixed values are also called literals.'
