  md: '# STRUCTURES


    Structure is a user-defined data type in C language which allows us to combine
    different data types together. Each element of a structure is called a member.
    Structure helps to construct a complex data type which is more meaningful. It
    is somewhat similar to an Array, but an array holds data of similar type only.
    But structure on the other hand, can store data of any type, which is practical
    more useful.


    # Why structures in C7


    Suppose, you want to store information about a person: his/her name, citizenship
    number, and salary. You can create different variables name, citNo and salary
    to store this information.


    What if you need to store information of more than one person? Now, you need to
    create different variables for each information per person: name1, citNo1, salary1,
    citNo2, etc.


    A better approach would be to have a collection of all related information under
    a single Person structure and use it for every person.


    # Example:


    If I want to write a program to store Student information, which will have student''s
    name, age, branch, permanent address, father''s name, etc., which included string
    values, integer values etc, how can I use arrays for this problem, I will require
    something which can hold data of different types together.


    In structure, data is stored in records.


    # Features of Structures


    +   1. To copy elements of one array to another array of same data type, copy
    it by one. It is not possible to copy all the elements at a time. Whereas in structure,
    it is possible to copy the contents of all structure elements of different data
    types to another structure variable of its type using assignment (=) operator.
    It is possible because the structure elements are stored in successive locations.


    +   2. Nesting of structure is possible, i.e., one can create within the structure.
    Using this feature, can handle complex data types.


    +   3. It is also possible to pass structure elements to a function. This is similar
    to passing an ordinary variable to a function. One can pass individual structure
    elements or entire structure by value or address.


    +   4. It is also possible to create structure pointers. In the pointer, we have
    studied pointing pointer to an integer, pointing to a float and pointing'
