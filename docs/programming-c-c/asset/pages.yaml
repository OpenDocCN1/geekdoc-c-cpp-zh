- pgno: 6
  md: 'expressing a set of detailed instructions for a digital computer. Such instructions
    can be executed directly when they are in the computer manufacturer-specific numerical
    form known as machine language, after a simple substitution process when expressed
    in a corresponding assembly language, or after translation from some "higher-level"
    language. Basically, languages can be divided into two categories according to
    how the computer understands them.


    # Types of Computer Languages


    Basic types of Computer Language are:


    +   - Low-level languages: A language that corresponds directly to a specific
    machine.

    - High-level languages: Any language that is independent of the machine.

    - System languages: These are designed for low-level tasks, like memory and process
    management.

    - Scripting languages: These tend to be high-level and very powerful.

    - Domain-specific languages: These are only used in specific contexts.

    - Visual languages: Languages that are not text-based.

    - Esoteric languages: Languages that are jokes or are not intended for serious
    use.


    These languages are not mutually exclusive, and some languages can belong to multiple
    categories. The terms low-level and high-level are also open to interpretation,
    and some languages that were once considered high-level are now considered low-level
    as languages have continued to develop.


    # Low-level Languages


    Low-level computer languages are either machine codes or are very close. A computer
    cannot understand instructions given to it in high-level languages or in English.
    It can only understand and execute instructions given in the form of machine language,
    i.e., binary. There are two types of low-level languages:


    +   - Machine language: a language that is directly interpreted into the hardware.

    - Assembly language: a slightly more user-friendly language that directly corresponds
    to machine language.


    # Machine Language


    Machine language is the lowest and most elementary level of programming language
    and was the first type of programming language to be developed. Machine language
    is basically the only language that a computer can understand and it is usually
    written in hex.'
  merge: -1
  img_proc: true
- pgno: 7
  md: '# Introduction to C Language, Variables, Data Types and Operators


    In fact, a manufacturer designs a computer to obey Just one language, its machine
    code, which is represented inside the computer by a string of binary digits (bits)
    0 stands for the absence of an electric pulse and 1 stands for the presence of
    an electric pulse. Since a computer is capable of recognizing electric signals,
    it understands machine language.


    | Advantages | Disadvantages |

    |---|---|

    | Machine language makes fast and efficient use of the computer. | All operation
    codes have to be remembered. |

    | It requires no translator to translate the code. This is directly understood
    by the computer. | All memory addresses have to be remembered. |

    | | It is hard to amend or find errors in a program written in the machine language


    # Assembly Language


    Assembly language was developed to overcome the many inconveniences of machine
    language. This is another low-level but very important language in which operation
    codes and operands are given in the form of alphanumeric instead of 0''s and I''s.


    These alphanumeric symbols are known as mnemonic codes and can combine in a maximum
    of five-letter combinations, e.g., ADD for addition, SUB for subtraction, START,
    LABEL, etc. Because of this feature, assembly language is also known as "Symbolic
    Programming Language.


    This language is also very difficult and needs a lot of practice to master because
    there is only a little English in this language. Mostly, assembly language is
    used to help in compiler orientations. The instructions of the assembly language
    are converted to machine codes by a translator and then they are executed by the
    computer.


    | Advantages | Disadvantages |

    |---|---|

    | Assembly language is easier to understand and as compared to machine language.
    | Like machine language, it is also machine dependent/specific. |

    | It is easy to locate and correct errors. | Since it is machine dependent, the
    programmer also needs to understand the hardware. |

    | It is easily modified. |'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# High-level Languages


    High-level computer languages use formats that are similar to English. The purpose
    of developing high-level languages was to enable people to write programs easily,
    in their own native language environment (English).


    High-level languages are basically symbolic languages that use English words and/or
    mathematical symbols rather than mnemonic codes. Each instruction in the high-level
    language is translated into many machine language instructions that the computer
    can understand.


    # Advantages


    # Disadvantages


    High-level languages are user-friendly.


    A high-level language has to be translated into the machine language by a translator,
    which takes up time.


    They are similar to English and use English vocabulary and well-known symbols.


    The object code generated by a translator might be inefficient compared to an
    equivalent assembly language program.


    They are easier to learn.


    They are easier to maintain.


    They are problem-oriented rather than ''machine''-based.


    A program written in a high-level language can be translated into many machine
    languages and can run on any computer for which exists an appropriate translator.


    The language is independent of the machine on which it is used, i.e., programs
    developed in a high-level language can be run on any computer text.


    # TYPES OF HIGH-LEVEL LANGUAGES


    Many languages have been developed for achieving a variety of different tasks.
    Some are fairly specialized, and others are quite general.'
  merge: -1
  img_proc: true
