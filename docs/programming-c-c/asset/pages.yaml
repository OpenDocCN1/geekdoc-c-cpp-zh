  md: 'The main aim of OOP is to bind together the data and the functions that operate
    on them so that no other part of the code can access this data except that function.


    In object programming, we write programs using classes and objects utilising features
    of OOPs such as abstraction, encapsulation, inheritance and polymorphism.


    # Advantages of OOPs over Procedure-oriented Programming


    +   1. Reusability


    OOP allows the existing code to be reused through inheritance. We can easily acquire
    the existing functionality and improve on it without having to rewrite the code
    again. This results in less bloated code.


    +   2. Modularity


    As we modularize the program in OOP, it is easy to modify or troubleshoot the
    program if a problem occurs or new feature or enhancement is to be added. Modularization
    also helps in code clarity and makes it more readable.


    +   3. Flexibility


    OOP helps us with flexible programming using the polymorphism feature. As polymorphism
    takes many forms, we can have operators or functions that will work with many
    objects and thus save us from writing different functions for each object.


    +   4. Maintainability


    Maintaining code is easier as it is easy to add new classes, objects, etc. without
    much restructuring or changes.


    +   5. Data and Information Hiding


    OOP aids us in data hiding thereby keeping information safe from leaking. Only
    the data that is required for the smooth functioning of the program are exposed
    to the user by hiding intrinsic details.


    # STRUCTURE OF C++ PROGRAM


    Programs are a sequence of instructions or statements. These statements form the
    structure of a C++ program. C++ program structure is divided into various sections,
    namely, headers, class definition, member functions definitions and main function.'
