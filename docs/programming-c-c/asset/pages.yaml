    # ARITHMETIC OPERATIONS WITH POINTERS (POINTER ARITHMETIC IN C)


    C allows programmers just like you to do arithmetic operations using pointers.
    So, programmers can perform any arithmetic operations using pointer variables.
    Performing arithmetic operations using pointer variables is said to be arithmetic
    pointer.


    We can perform arithmetic operations on the pointers like addition, subtraction,
    However, as we know that pointer contains the address, the result of an arithmetic
    operation performed on the pointer will also be a pointer if the other operand
    is of type integer. In pointer-from-pointer subtraction, the result will be an
    integer value.


    Following arithmetic operations are possible on the pointer in C language:


    +   * Increment

    * Decrement

    * Addition

    * Subtraction

    * Comparison


    # Increment Pointer Variable


    If we increment a pointer by 1, the pointer will start pointing to the immediate
    next location. This is somewhat different from the general arithmetic since which
    the pointer will get increased by the size of the data type to which the pointer
    is pointing.


    We can traverse an array using the increment operation on a pointer which will
    keep pointing to every element of the array, perform some operation on that, and
    update it in a loop.


    The rule to increment the pointer is given below:


    ```

    new_address = current_address + i * size_of(data_type)

    ```


    where i is the number by which the pointer get increased.


    # 32-bit


    For 32-bit int variable, it will be incremented by 2 bytes.


    # 64-bit


    For 64-bit int variable, it will be incremented by 4 bytes.'
