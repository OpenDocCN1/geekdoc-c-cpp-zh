  md: '# Functions, Arrays and Strings


    | CALL BY VALUE | CALL BY REFERENCE |


    | While calling a function, we pass values of variables to it. Such functions
    are known as "Call By Values". | While calling a function, instead of passing
    the values of variables, we pass address of variables(location of variables) to
    the function known as "Call By References". |


    | In this method, the value of each variable in calling function is copied into
    corresponding dummy variables of the called function. | In this method, the address
    of actual variables in the calling function are copied into the dummy variables
    of the called function. |


    | With this method, the changes made to the dummy variables in the called function
    have no effect on the actual variables in the calling function. | With this method,
    using addresses, we would have access to the actual variables and hence we would
    be able to manipulate them. |


