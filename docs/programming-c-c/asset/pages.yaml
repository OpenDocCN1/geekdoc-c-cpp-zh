  md: '# Object Oriented Concepts C++


    namespace permits grouping of various entities like classes, objects, functions,
    and various C++ tokens, etc. under a single name. Different users can create separate
    namespaces and thus use similar names of entities. This avoids compile-time error
    that may exist due to identical-name conflicts.


    The C++ Standards Committee has rearranged the entities of the standard library
    under a namespace called std. In Figure, the statement using namespace std informs
    the compiler to include all the entities present in the namespace std. The entities
    of a namespace can be accessed in different ways which are listed here.


    +   By specifying the using directive:


    using namespace std;

    cout<<"Hello World";


    +   By specifying the full member name:


    std::cout<<"Hello World";


    +   By specifying the using declaration:


    using std::;

    cout<<"Hello World";


    As son the new-style header is included, its contents are included in the std
    namespace. Thus, all the modern C++ compilers support these statements.


    ```

    #include<iostream>


    using namespace std;

    ```


    However, some old compilers may not support these statements. In that case, the
    statements are replaced by this single statement.


    ```

    #include<iostream.h>;

    ```


    # main() Function


    The main() is a start-up function that starts the execution of a C++ program.
    All C++ statements that need to be executed within main(). The compiler executes
    all the instructions written within the opening and closing braces ''{'' that
    enclose the body of main(). Once all the instructions in main() are executed,
    the control passes out of main(), terminating the entire program and returning
    a value to the operating system.


    By default, main() in C++ returns an int value to the operating system. Therefore,
    main() should end with the return 0. A return value zero indicates success and
    a non-zero value indicates failure or error.'
