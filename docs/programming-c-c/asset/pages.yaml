    in the program.


    +   Members, declared as **private** in a class, can be accessed only from within
    the class. They are not allowed to be accessed from any part of code outside the
    class.


    We can easily implement abstraction using the above two features provided by access
    specifiers. Say, the members that defines the internal implementation can be marked
    as private in a class. And the important information needed to be given to'
