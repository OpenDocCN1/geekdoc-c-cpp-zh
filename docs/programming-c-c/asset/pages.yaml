    # Advantages of Unions


    +   1. Unions are used for generating portable codes which are machine independent.

    2. While declaring unions you don''t have to worry about sizes of it, long, or
    any other data types.

    3. It is usually used for specialized conversions.


    # Comparison between Structure and Unions/Similarities between Structure and Union


    +   1. Both are user-defined data types used to store data of different types
    as a single unit.

    2. Their members can be objects of any type, including other structures and unions
    or arrays. A member can also consist of a bit field.

    3. Both structures and unions support only assignment = and sizeof operators.
    The two structures or unions in the assignment must have the same members and
    member types.

    4. A structure or a union can be passed by value to functions and returned by
    value by functions. The argument must have the same type as the function parameter.
    A structure or union is passed by value just like a scalar variable.

    5. * operator is used for accessing members.


    # Differences between Structure and Unions


    | Distinctive Feature | Structure in C | Union in C |

    |---|---|--|

    | Keyword | It is pretty obvious that a structure begins with a struct keyword.
    | A union begins with a union keyword. |

    | Memory location | All the data members of a structure have their own | All the
    data members of a union share the same memory location. |'
