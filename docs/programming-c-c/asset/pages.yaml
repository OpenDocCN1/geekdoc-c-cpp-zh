- pgno: 18
  md: '# Some Commonly Used Library Functions in C Language


    Standard Library Functions are basically the inbuilt functions in the C compiler
    that makes things easy for the programmer.


    Every C program has at least one function, i.e., the main() function. The main()
    function is also a standard library function in C since it is inbuilt and conveys
    specific meaning to the C compiler.


    # <stdio.h>


    This is the basic header file used in almost every program written in the C language.


    It stands for standard input and standard output to perform input-output functions,
    some of which:


    +   - printf() To display output on the screen.

    - scanf() To take input from the user.

    - getchar() To return characters on the screen.

    - putchar() To display output as a single character on the screen.

    - fgets() To take a line as an input.

    - puts() To display a line as an input.

    - fopen() To open a file.

    - fclose() To close a file.


    # <conio.h> with


    It is used to perform console input and console output operations like clscr()
    to clear the screen (works in Turbo C) and get() to get the character from the
    keyboard.


    # SIGNIFICANCE OF STANDARD LIBRARY FUNCTIONS IN C


    # Usability


    Standard library functions allow the programmer to use the pre-existing codes
    available in the C compiler without the need to define his own code by deriving
    the logic to perform certain basic functions.


    # Flexibility


    A wide variety of programs can be made by the programmer by making slight modifications
    while using the standard library functions in C.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# User-friendly Syntax


    Syntax of C is very easy to grasp and easy to implement.


    # Optimization and Reliability


    All the standard library functions in C have been tested multiple times in order
    to generate the optimal output with maximum efficiency making it reliable to use.


    # Time-saving


    Instead of writing numerous lines of codes, these functions help the programmer
    to save time by simply using the pre-existing functions.


    # Portability


    Standard library functions are available in the C compiler irrespective of the
    device you are working on. These functions connote the same meaning and hence
    serve the same purpose regardless of the operating system or programming environment.


    # Overview of Compiler and Interpreter


    # Compiler


    A compiler takes entire program and converts it into object code which is typically
    stored in a file. The object code is also refered as binary code and can be directly
    executed by the machine after linking. Examples of compiled programming languages
    are C and C++.


    # Interpreter


    An Interpreter directly executes instructions in a programming or scripting language
    without previously converting to an object code or machine code. Interpreter reads
    only one line of source program at a time. Examples of interpreted languages are
    Perl, Python and Matlab.


    # Comparison between Compiler and Interpreter


    | Basis for Comparison | Compiler | Interpreter |

    | --- | --- | --- |

    | Input | It takes an entire program at a time. | It takes a single line of code
    or instruction at a time. |

    | Output | It generates intermediate object code. | It does not produce any intermediate
    object code. |

    | Working mechanism | The compilation is done before execution. | Compilation
    and execution take place simultaneously. |'
