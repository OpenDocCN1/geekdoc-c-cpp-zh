    # JUMPING STATEMENTS IN C


    In C, Jumping statements are used to transfer control from one point to another
    point in the program due to some specified code while executing the program. There
    are three keywords in the Jumping Statements:


    Break Statement


    Continue Statement


    Go to Statement


    # break Statement in C


    The break statement in C programming has the following two usages.


    +   When a break statement is encountered inside a loop, the loop is immediately
    terminated and the program control resumes at the next statement following the
    loop.


    +   It can be used to terminate a case in the switch statement (covered in the
    next chapter).


    +   The break statement is almost always used with if...else statement inside
    the loop.


    If you are using nested loops, the break statement will stop the execution of
    the innermost loop and start executing the next line of code after the block.


    # Syntax of break Statement:


    ```

    break;

    ```'
