  md: '# Introduction to C Language, Variables, Data Types and Operators


    # Arithmetic Operators


    The following table shows all the arithmetic operators supported by the C language.
    Assume variable A holds 10 and variable B holds 20, then show examples.


    | Operator | Description | Example |

    | --- | --- | --- |

    | + | Adds two operands | A + B = 30 |

    | " | Subracts second operand from the first | A " B = -10 |

    | * | Multiplies both operands | A * B = 200 |

    | / | Divides numerator by de-number | B / A = 2 |

    | % | Modulus operator and remainder of after an integer | B % A = 0 |

    | ++ | Increment operator increases the integer value by one | A++ = 11 |

    | -- | Decrement operator decreases the integer value by one | A-- = 9 |


    # Relational Operators


    C has six relational operators that can be used to formulate a Boolean expression
    for making a decision and testing conditions, which returns true or false. The
    following table shows all the relational operators supported by C. Assume variable
    A holds 10 and variable B holds 20 then show examples.


    | Operator | Description | Example |

    | --- | --- | --- |

    | == | Checks if the values of two operands are equal or not. If yes, then the
    condition becomes true. | (A == B) is not true. |

    | != | Checks if the values of two operands are equal or not. If the values are
    not equal, then the condition becomes true. | (A != B) is true. |

    | > | Checks if the value of left operand is greater than the value of right operand.
    If yes, then the condition becomes true. | (A > B) is not true. |

    | < | Checks if the value of left operand is less than the value of right operand.
    If yes, then the condition becomes true. | (A < B) is true. |'
