  md: 'Introduction to C Language, Variables, Data Types and Operators


    These languages, categorized according to their use, are:


    # 1. Algebraic Formula-type Processing Languages


    These languages are oriented towards the computational procedures for solving
    mathematical and statistical problems.


    Examples include:


    +   * BASIC (Beginners All Purpose Symbolic Instruction Code)

    * FORTRAN (Formula Translation)

    * PL/I (Programming Language, Version 1)

    * ALGOL (Common Business Oriented Language)

    * APL (A Programming Language)


    # 2. Business Data Processing Languages


    These languages are best able to maintain data processing procedures and problems
    involved in handling files. Some examples include:


    +   * COBOL (Common Business Oriented Language)

    * RPG (Report Program Generator)


    # 3. String and List Processing Languages


    These are used for string manipulation, including search patterns and inserting
    and deleting characters. Examples are:


    +   * LISP (List Processing)

    * Prolog (Program in Logic)


    # 4. Object-oriented Programming Languages


    In OOP, the computer program is divided into objects. Examples are:


    +   * C++

    * Java


    # 5. Visual Programming Languages


    These programming languages are designed for building Windows-based applications.
    Examples are:


    +   * Visual Basic

    * Visual Java

    * Visual C'
