    # Return Statement


    The keyword return is used to terminate function and return a value to its caller.
    The return statement may also be used to exit a function with out returning a
    value. The return statement may or may not include an expression.


    The general form of the return statement is:


    ```

    return;

    or

    return( expression ); */

    ```'
