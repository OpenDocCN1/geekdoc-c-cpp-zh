  md: "# Friend Functions in C++\n\nFriend function is a function that is not member\
    \ function of a class, but it has access to private and protected members of a\
    \ class. Friend function is declared and implemented outside of class as a simple\
    \ function. But the class has to grant \"friend\" privileges by declaring this\
    \ function with friend keyword inside of the class declaration. Here is an example\
    \ of creating a friend function for class:\n\nExample:\n\n```\nbool checkSalary(Raman\
    \ v)\n{\n    if (v.salary > 40000) //salary is protected data member\n       \
    \ return true;\n    else\n        return false;\n}\n```\n\nThis is a function\
    \ with a global scope. Inside the class, we have to add its declaration with friend\
    \ keyword:\n\n```\nbool checkSalary(Raman v):;friend function\n```\n\nThe access\
    \ specifiers do not influence friend functions. That is why they can be declared\
    \ anywhere in the class. Now, you can call check Salary from main as a simple\
    \ function:\n\n```\nbool result = checkSalary(raman);\n```\n\nHence, friend functions\
    \ can access private data members by creating object of the class. Similarly,\
    \ we can also make function of some other class as friend, or we can also make\
    \ an entire class as friend class.\n\nWhen we make a class as friend, all its\
    \ member functions automatically become friend functions.\n\nFriend Functions\
    \ is a reason, because C++ is not as a pure Object Oriented language. Because\
    \ it violates the concept of Encapsulation.\n\n# Virtual Member Functions\n\n\
    Virtual member function is a member function that is expected to be overloaded\
    \ in the derived class. Virtual functions are used in inheritance - they provide\
    \ correct behaviour when you call a function from derived class that is declared\
    \ virtual in base class by using a pointer to the base class."
