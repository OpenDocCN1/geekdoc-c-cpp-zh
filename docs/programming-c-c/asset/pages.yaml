  md: "Introduction to C Language, Variables, Data Types and Operators\n\n# # Preprocessors\
    \ in C\n\nThe C processor is a macro processor used automatically by the C compiler\
    \ to transform your program before actual compilation (preprocessor directives\
    \ are executed before compilation). It is called a macro processor because it\
    \ allows you to define macros, which are brief abbreviations for longer constructs.\
    \ A macro is a segment of code which is replaced by the value of macro. Macro\
    \ is defined by #define directive.\n\nPreprocessing directives are lines in your\
    \ program that start with #. The # is followed by an identifier that is the directive\
    \ name. For example, #define is the directive that defines a macro. Whitespace\
    \ is allowed before and after the #.\n\nThe # the directive name cannot come from\
    \ a macro expansion. For example, if foo is defined as a macro expanding to define,\
    \ that does not make #foo a valid preprocessing directive.\n\nAll preprocessor\
    \ directives start with # symbol.\nLet's see a list of preprocessor directives.\n\
    \n+   1. #include\t7. #else\n2. #define\t8. #elif\n3. #undef\t9. #endif\n4. #ifdef\t\
    10. #error\n5. #ifndef\t11. #pragma\n6. #if\n\n![](img/967bcdbdba6f2e1f56642982e8b39e66_23_0.png)\n\
    \n| File inclusion directive | Macro substitution directive | conditional directive\
    \ | Miscellaneous directive |\n| --- | --- | --- | --- |\n| #include | #define\
    \ | #if | #pragma |\n| | | #elif | #error |\n| | | #else | #line |\n| | | #endif\
    \ | |\n| | | #ifdef | |\n| | | #ifndef | |\n| | | #undef | |\n\n| Operators in\
    \ preprocessor |\n#\n##"
  merge: -1
  img_proc: true
