  md: "When the compiler encounters a function call, the control is transferred to\
    \ the function definition and executes the function line by line and a computed\
    \ value is returned with the help of return statement.\n\nThe returned value is\
    \ assigned to the receiver variable. This is illustrated as below:\n\n```\nvoid\
    \ sum ( )\n{\n    float result ; // receiver local variable\n    result = sum\
    \ (10.0, 20.0) ); // function call\n    printf(\\\n sum is %.2f ,\", result);\n\
    }\nfloat sum ( float x, float y )\n{\n    float result ; // local variable\n \
    \   result = x + y ; // executable statement\n    return result ; // return statement\n\
    }\n```\n\nArguments that passed in function call and arguments receiving in function\
    \ definition should have the same data type.\n\nFor example in above function\
    \ call sum (10.0, 20.0), we have passed arguments of float type and inside function\
    \ definition those float type arguments are received by float variable x and y\
    \ respectively. In short, type of arguments in function call and function definition\
    \ should be the same.\n\nThe arguments names used in function definition is known\
    \ as formal parameters.\n\n# Function Arguments\n\nIf a function is to use arguments,\
    \ it must declare variables that accept the values of the arguments. These variables\
    \ are called the formal parameters of the function.\n\nFormal parameters behave\
    \ like other local variables inside the function and are created upon entry into\
    \ the function and destroyed upon exit.\n\nWhile calling a function, there are\
    \ two ways in which arguments can be passed to a function-"
