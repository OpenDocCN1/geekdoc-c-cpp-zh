- pgno: 48
  md: '# Rules:


    +   1. char or short type operands will be converted to int during an operation
    and the outcome data type will also be int.


    +   2. If an operand of long double is present in the expression, then the corresponding
    operand will also be converted to long double same for the data type.


    +   3. If an operand of float type is present, then the corresponding operand
    in the expression will also be converted to float type and the final result will
    also be float type.


    +   4. If an operand of unsigned int is present, then the other operand will be
    converted to unsigned int and the final result will also be unsigned int.


    +   5. If an operand of long int is present, then the other operand will be converted
    to long int and the final result will be long int.


    +   6. If an operand of unsigned int is present, then the other operand will be
    converted to unsigned int and the final result will also be unsigned int.


    Now, let''s focus on some examples to further understand about type conversions
    in.


    # Example 1:


    ```

    int a = 20;

    double b = 20.5;

    a + b;

    ```


    Here, first operand is unsigned int and other is of type double. So, as per rule
    2, the variable will be converted to double. Therefore, the final answer a + b
    = 40.500000.


    # Example 2:


    ```

    char ch=''a'';

    int a =13;

    a + c;

    ```


    Here, first operand is char type and other is of type int. So, as per rule 1,
    the char variable will be converted to int type during the operation and the final
    answer will be of type int. We know the ASCII value for ch is 97. Therefore, final
    answer is a + c = 97 + 13 = 110.'
  merge: -1
  img_proc: true
