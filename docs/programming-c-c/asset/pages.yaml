  md: '# Functions, Arrays and Strings


    # 1. Function Declaration (Function prototype)


    +   - Similar to variables, in C, every function needs to be declared before it

    can be used.


    +   - Functions can be declared either globally (inside the main() ) or locally

    (outside the main()) as per the program requirement. (You can read more

    on this at **Structure of C Program)


    Syntax:


    ```

    return_type function_name(argument list );

    ```


    +   - Function prototype has the function the three parts:


    Return type:


    +   - It specifies return type of the function what means type of the data that

    a function will return as *int, float, char,* etc.


    +   - Function that does not return any value will have return type as *void*


    Function Name:


    +   - It is the name of the function and it should be any meaningful name.


    +   - It should follow all *naming convention rules.*.


    +   - Some examples of function names are *display, show, calculate,** etc.


    Argument List:


    +   - Argument list specifies list of all arguments required for the function
    to

    perform the desired task.


    +   - Arguments are separated by comma. It may include both data type and

    argument name normally only data type is provided.


    +   - The following is an example of function prototype for summing of two

    float values:


    **Function Declaration Example**


    float sum (float, float); OR float sum (float x, float y);


    +   - Where, int is a return type, *sum* is the name of the function and *int
    x,

    *int y* are the argument list.


    # 2. Function Definition


    +   - Function definition contains executable block of statements.


    +   - It can be written either before or after the main() but normally it is written

    after the main().'
