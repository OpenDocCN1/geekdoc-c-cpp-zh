- pgno: 10
  md: 'History of C language is interesting to know. Here, we are going to discuss
    a brief history of the C language. C programming language was developed in 1972
    by Dennis Ritchie and Brian Kernighan at bell laboratories of AT&T (American Telephone
    & Telegraph), located in the USA. Dennis Ritchie is the founder of C language.
    It was developed to overcome the problems of previous languages such as B, BCPL,
    etc. Initially, C was developed to be used in UNIX operating system inherits many
    features of previous languages such as B and BCPL.


    Let''s see the programming languages that were developed before C language.


    | Language | Year | Developed by |

    | --- | --- | --- |

    | Algol | 1960 | International Group |

    | BCPL | 1967 | Martin Richard |

    | B | 1970 | Ken Thompson |

    | Traditional C | 1972 | Dennis Ritchie |

    | K&RC | 1978 | Kernighan & Dennis Ritchie |

    | ANSI C | 1989 | ANSI Committee |

    | ANSI/ISO C | 1990 | ISO Committee |

    | C99 | 1999 | Standardization Committee |


    # FEATURES OF C LANGUAGE


    C is the widely used language. It provides many features that are given below.


    +   1. Simple

    2. Machine Independent or Portable

    3. Mid-level Programming Language

    4. Structured Programming Language

    5. Rich Library

    6. Memory Management

    7. Fast Speed

    8. Pointers

    9. Recursion

    10. Extensible'
  merge: -1
  img_proc: true
- pgno: 11
  md: '+   1. **Simple**: C is a simple language in the sense that it provides a structured

    approach (to break the problem into parts), the rich set of library functions,

    data types, etc.


    +   2. **Machine Independent or Portable**: Unlike assembly language, C programs

    can be executed on different machines with machine specific changes.

    Therefore, C is a machine independent language.


    +   3. **Mid-level Programming Language**: Although, C is intended to develop
    low-level

    programming. It is used to develop system applications as kernel, driver, etc.

    etc. It also supports the features of a high-level language. That is why it

    is known as mid-level language.


    +   4. **Structured Programming Language**: C is a structured programming language

    in the sense that we can break the program into parts using functions. So,

    it is easy to understand and modify. Functions also provide code reusability.


    +   5. **Rich Library**: C provides a lot of inbuilt functions that make the development

    fast.


    +   6. **Memory Management**: It supports the feature of dynamic memory allocation.

    In C language, we can free the allocated memory at any time by calling

    t free() function.


    +   7. **Speed**: The compilation and execution time of C language is fast since
    there

    are lesser inbuilt functions and hence the lesser overhead.


    +   8. **Pointer**: C provides the feature of pointers. We can directly interact
    with

    the memory by using the pointers. We can use pointers for memory, structures,

    functions, array, etc.


    +   9. **Recursion**: In C, we can call the function within the function. It provides

    code reusability for every function. Recursion enables us to use the approach

    of backtracking.


    +   10. **Extensible**: C language is extensible because it can easily adopt new

    features.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# BASIC STRUCTURE OF C PROGRAM


    ![](img/967bcdbdba6f2e1f56642982e8b39e66_12_0.png)


    +   1. Documentation Section: It is the section in which you can give comments
    to make the program more interactive. The compiler will not compile this and hence
    this portion would not be displayed on the output screen.


    +   2. Definition Section: This section involves the variable definition and declaration
    in C.


    +   3. Main Function: It is the major section from where the execution of the
    program begins. The main section involves the declaration and executable section.


    +   4. Preprocessor Directives Section: This section involves the use of header
    files that are to be included necessarily program.


    +   5. Global Declaration Section: This section is used to define the global variables
    to be used in the program, that means can use these variables throughout the program.


    +   6. User-defined Function Section/Sub-programming Section: When you want to
    define your function that fulfils a particular requirement, you can define them
    in this section.


    +   7. Function Prototype Declaration Section: This section gives the information
    about a function that includes the data type or the return type, the parameters
    passed or the arguments.'
  merge: -1
  img_proc: true
