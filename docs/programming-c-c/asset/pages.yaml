    # # Abstraction


    Data abstraction is one of the most essential and important features of object
    oriented programming in C++. Abstraction means displaying only essential information
    and hiding the details. Data abstraction refers to providing only essential information
    about the data outside world, hiding the background details or implementation.


    Consider a real-life example of a man driving a car. The man only knows that pressing
    the accelerators will increase the speed of the car or but he does not know how
    on pressing accelerator the speed is actually increasing, he does not know about
    the inner mechanism of the car or the implementation of accelerator, brakes, etc.
    in the car. This is what abstraction


    +   **Abstraction using Classes:** We can implement Abstraction in C++ classes.
    The class helps us to group data members and member functions using available
    access specifiers. A Class can decide which data member will be visible to the
    outside world and which is not.


    +   **Abstraction in Header Files:** One more type of abstraction in C++ can be
    header files. For example, consider the pow() method in math.h header file. Whenever
    we need to calculate the power of a number, we simply call the function pow()
    present in the math.h header file and pass the numbers as arguments without knowing
    the underlying algorithm according to the function is actually calculating the
    power of numbers.


    # # Abstraction using Access Specifiers


