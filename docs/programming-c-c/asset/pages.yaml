    # # Headers


    Generally, a program includes various programming elements like built-in functions,
    classes, keywords, constants, operators, etc., that are already defined in the
    standard C++ library. In order to use such pre-defined elements in a program,
    an appropriate header must be included in the program. The standard headers contain
    the information like prototype, definition and return type of library functions,
    data type of constants, etc. As a result, programmers do not need to explicitly
    declare (or define) the predefined programming elements.


