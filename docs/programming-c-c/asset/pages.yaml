- pgno: 110
  md: 'The general form of function definition is:


    Type specifier function-name (argument list):


    ```

    argument declarations;

    {

    Local declarations;

    Body of the functions;

    __

    return (expression);

    }

    ```


    # Function header


    The function header contains a type, the function name and an argument list. The
    type specifier is the type of the data that the function is expected to return.
    In the absence of any data type, the type integer is assumed.


    The type specifier is followed by a function-name. The arguments of the function,
    if any, are given within parentheses after this. If the function takes no arguments,
    the parentheses must still be included. The function header is not terminated
    by a semicolon.


    # Declaration list


    The function header is followed by a declaration list, which declares the types
    of the arguments (formal parameters). No other variables can be declared at this
    point. Recent compilers permit including the argument declaration with in parentheses
    like type-specifier function-name (data-type argument1, data-type argument2...).


    # Examples:


    ```

    1 float average (int a, b, c);

    or

    float average (a,b,c);

    inta,b,c;

    ```


    The data type void may be used for the return type of the function where the function
    does not return any value.int'
