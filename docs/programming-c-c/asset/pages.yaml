  md: '![](img/967bcdbdba6f2e1f56642982e8b39e66_89_0.png)


    # Types of Loops


    Depending upon the position of a control statement in a program, a loop is classified
    into two types:


    +   1. Entry controlled loop

    2. Exit controlled loop


    In an entry controlled loop, a condition is checked before executing the body
    of a loop. It is also called as a pre-checking loop.


    In an exit controlled loop, a condition is checked after executing the body of
    a loop. It is also called as a post-checking loop.


    The control conditions must be well-defined and specified. Otherwise, the loop
    will execute an infinite number of times. The loop that does not stop executing
    the statements number of times is called as an infinite loop. An infinite loop
    is also called as an "Endless loop."'
