    # Inheritance


    The capability of a class to derive properties and characteristics from another
    class is Inheritance. Inheritance is an important feature of object oriented programming
    used for code reusability. Inheritance allows us to inherit all the code (except
    declared as private) of one class to another class.


    +   - **Derived Class:** The class that inherits properties from another class
    is called Derived Class or Sub Class.

    - **Base Class:** The class whose properties are inherited by derived class is
    called Base Class or Super Class.


    ![](img/967bcdbdba6f2e1f56642982e8b39e66_244_0.png)


    Hierarchical Inheritance with Class Shape'
  merge: -1
  img_proc: true
- pgno: 245
  md: '+   - Reusability: Inheritance supports the concept of "reusability", i.e.,
    when we want to create a new class we want and there is already a class that includes
    some of the code that we want, we can derive our new class from the existing class.
    By doing this, we are reusing the fields and methods of the existing class.


    # Modes of Inheritance


    +   1. Public Mode: If we derive a sub class from a public base class, then the
    public member of the base class will become public in the derived class and protected
    members of the base class will become protected in derived class.


    +   2. Protected Mode: If we derive a sub class from a protected base class, then
    both public member and protected members of the base class will become protected
    in derived class.


    +   3. Private Mode: If we derive a sub class from a private base class, then
    both public member and protected members of the base class will become private
    in derived class.


    # TYPES OF INHERITANCE


    Different computer languages offer different types of inheritance. However, the
    basic idea remains that derived class gets access to the (non-private) members
    of the base class. C++ is very flexible in inheritance and provides the following
    types of inheritance.


    # Single Inheritance


    This is the basic type of inheritance where the base and derived classes remain
    one, i.e., one class is inherited by exactly one class. It means that there will
    be only one child and one parent only.


    ![](img/967bcdbdba6f2e1f56642982e8b39e66_245_0.png)


    As shown above, if a parent class has exactly one child class and the child class
    has exactly one parent class, then this kind of inheritance is called single inheritance.'
