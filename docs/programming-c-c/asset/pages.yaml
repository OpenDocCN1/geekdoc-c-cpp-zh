  md: '# Multidimensional arrays


    | Concept | Description |

    |---|---|

    |   | C supports multidimensional arrays. The simplest form of the multidimensional
    array is the two-dimensional array. |

    | Passing arrays to functions | You can pass to the function a pointer to an array
    by specifying the array''s name without an index. |

    | Return array from a function | C allows a function to return an array. You can
    generate a pointer to the first element of an array by simply specifying the array
    name, without any index. |


    # Two-dimensional Arrays


    The simplest form of multidimensional array is the two-dimensional array. A two-dimensional
    array is, in essence, a list of one-dimensional arrays. To declare a two-dimensional
    array of size [x][y], you would write something as follows:


    ```

    arrayName[x][y];

    ```


    Where type can be any valid C type and arrayName will be a valid C identifier.
    A two-dimensional array can be considered as a table which will have x number
    of rows and y number of columns. A two-dimensional array, a, which contains three
    rows and four columns can be shown as follows:


    | Row 0 | Column 1 | Column 2 | Column 3 |

    |---|---|---|---||

    | Row 0 | a[0][0] | a[0][1] | a[0][2] | a[0][3] |

    | Row 1 | a[1][0] | a[1][1] | a[1][2] | a[1][3] |

    | Row 2 | a[2][0] | a[2][1] | a[2][2] | a[2][3] |


    Thus, every element in the array a is identified by an element name of the form
    a[i][j], where ''a'' is the name of the array, and ''i'' and ''j'' are the subscripts
    that uniquely identify each element in ''a''.


    # Initializing Two-dimensional Arrays


    Multidimensional arrays may be initialized by specifying bracketed values for
    each row. Following is an array with 3 rows and each row has 4 columns.'
