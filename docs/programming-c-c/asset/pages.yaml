    is simply because they work. These functions have gone through multiple rigorous
    testing and are easy to use.

    2. **The functions are optimized for performance:** Since, the functions are "standard
    library" functions, a dedicated group of developers constantly make them better.
    In the process, they are able to create the most efficient code optimized for
    maximum performance.

    3. **It saves considerable development time:** Since the general functions like
