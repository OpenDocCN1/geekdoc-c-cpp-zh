- pgno: 14
  md: '# Advantages


    +   - Easy to write.

    - Human readable techniques to understand logic.

    - Algorithms for big problems can be written with moderate efforts.


    # Disadvantages


    +   - Difficult to debug.

    - Difficult to show branching and looping.

    - Jumping (goto) makes it hard to trace some problems.


    Example: Print 1 to 20


    # Algorithm:


    ```

    Step 1: Initialize X as 0.

    Step 2: Increment X by 1.

    Step 3: Print X.

    Step 4: If X is less than 20 then go to step 2.

    ```


    # FLOWCHARTS


    # Definition of Flowchart


    A flowchart is a pictorial or graphical representation of a process. Each step
    in the process is represented by a different symbol and contains a short description
    of the process step. The flowchart symbols are linked together with arrows showing
    the process flow direction. This pictorial representation can give a step-by-step
    solution to the given problem.


    # Advantages


    +   - Easy to draw.

    - Easy to understand the logic.

    - Easy to identify mistakes by the non-computer person.

    - Easy to show branching and looping.


    # Disadvantages


    +   - Time-consuming.

    - Difficult to modify.

    - Very difficult to draw a flowchart for big or complex problems.'
  merge: -1
  img_proc: true
