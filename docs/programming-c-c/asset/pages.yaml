  md: "# #include\n\nThe #include preprocessor directive is used to paste code of\
    \ given file into current file. It is used include-systemdefined and user-defined\
    \ header files. If included file is not found, compiler renders error.\n\nBy the\
    \ use of #include directive, we provide information to the preprocessor where\
    \ to look for the header files. There are two variants to use #include directive.\n\
    \n+   1. #include <filename>\n2. #include \"filename\"\n\nThe #include <filename>\
    \ tells the compiler to look for the directory where system header files. In UNIX,\
    \ it is \\usr\\include.\n\nThe #include \"filename\" tells the compiler to look\
    \ in the current directory where program is running.\n\n```\n#include directive\
    \ example\n\nLet's see a simple example of #include directive. In this program,\
    \ we are including stdio.h because printf() function is defined in this file.\n\
    \n#include<stdio.h>\nint main(){\n    printf(\"Hello C\");\n    return 0;\n}\n\
    **Output:** Hello C\n```\n\n# #include notes:\n\n+   Note 1: In #include directive,\
    \ comments are not recognized. So in case of #include <a>/b>, a/b is treated as\
    \ filename.\n\n+   Note 2: In #include directive, backslash is considered as normal\
    \ text not escape sequence. So, in case of #include <a>nb>, a'nb is treated as\
    \ filename.\n\n+   Note 3: You can use only comment after #include otherwise it\
    \ will give error.\n\n# #define\n\nThe #define preprocessor directive is used\
    \ to define constant or micro substitution. It can use any basic data type.\n\n\
    Syntax:\n\n```\n#define token value\n```"
