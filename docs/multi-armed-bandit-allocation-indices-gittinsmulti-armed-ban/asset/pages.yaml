  md: "# Multi-population random sampling\n(theory)\n\n# 7.1 Introduction\n\nAn arm\
    \ of the multi-armed bandit problem described as Problem 5 in Chapter 1 generates\
    \ a sequence $X_1, X_2, \\dots$ of independent and identically distributed random\
    \ variables taking the values 1 and 0 with probabilities $\theta$ and $1-\theta$.\
    \ The reward associated with the value $X$ is $a^{t-1}X$ if this is the outcome\
    \ on the $t$th pull, counting polls on every arm. This is one of the problems\
    \ discussed in the present chapter, which is characterized by bandit processes\
    \ defined by sequences of independent identically distributed random variables\
    \ $X_1, X_2, \\dots$. When in the multi-armed bandit, these random variables themselves\
    \ constitute a sequence of rewards, the resulting bandit process will be termed\
    \ a reward process. Any function of the $X_i$ may also be taken to define a sequence\
    \ of rewards, and thereby a bandit process. All bandit processes defined in this\
    \ way will be termed sampling processes. The bandit processes defined by the function\
    \ which takes the value 1 for the $X_i$ to be sampled with a value $\\ge T$, and\
    \ 0 for all other $X_i$, in particular be investigated. In the following section\
    \ it will be shown that a family of alternative bandit processes (in this chapter\
    \ we will be concerned only with simple families) of this type serves as model\
    \ for the situation where a number of populations are sampled sequentially with\
    \ the aim of identifying as rapidly as possible an individual that achieves a\
    \ target level $T$ on some scale of interest. This type of bandit process will\
    \ thus be termed a target process.\n\nMulti-armed Bandit Allocation Indices, Second\
    \ Edition. John Gittins, Kevin Glazrook and Richard Weber\n© 2011 John Wiley &\
    \ Sons, Ltd. Published 2011 by John Wiley & Sons, Ltd. ISBN: 978-0-470-67002-6"
