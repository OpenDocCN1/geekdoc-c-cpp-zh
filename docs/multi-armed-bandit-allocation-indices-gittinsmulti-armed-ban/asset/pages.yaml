    problem for a simple family of alternative bandit processes (SFABP). In Section
    2.4 we specialize to discrete time and formulate the relevant dynamic programming
    equation. Its solution is presented in terms of an index policy in Section 2.5.
    It is proved using an argument with an economic flavour. This proof only starts
    the ball rolling. There remains much more to say about the index theorem and properties
    of the Gittins index. That discussion continues in Section 2.6. Our book contains
    a number of complementary proofs of the index theorem, and generalizations of
    it. Each proof has its merits and can help the reader to develop greater insight.
    A second proof, in Section 2.7, uses an interchange argument. In Section 2.8 we
    extend to semi-Markov bandit'
