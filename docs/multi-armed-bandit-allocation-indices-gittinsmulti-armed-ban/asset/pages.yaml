    \ the target at each trial is known. For target processes our discussion will\
    \ focus largely on the undiscounted case ($a=1$ or $\\gamma=0$). The recurrence\
    \ corresponding to (7.10) is\n\n```\n$M(\\phi, \\pi, T) = \\min \\left[ \\phi^{-1},\
    \ 1 + \\int_{-\\infty}^{T} M(\\phi, \\pi, x) f(x|\\pi) d\\mu_1(x) \\right] \\\
    quad (7.11)\n```\n\nwhere $M(\\phi, \\pi, T)$ is the expected number of values\
