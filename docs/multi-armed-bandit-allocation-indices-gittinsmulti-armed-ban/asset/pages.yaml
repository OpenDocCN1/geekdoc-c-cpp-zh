    # 4.4 Stoppable bandit processes


    D is admittedly a strong condition. Indeed, one might say that it restricts attention
    to the most interesting case of SFAS because the choice of control $u$ in $\Omega_i(x_i)$
    becomes irrelevant. However, it is interesting that Condition D is sufficient
    for Theorem 4.3 and that something stronger is not required. Furthermore, we can
    describe at least one interesting model for which Condition D is guaranteed to
    hold.


    The term *stopping bandit process* was coined by Glazebrook (1979) to describe
    the process obtained by adding to the control of a bandit process a *stop control*,
    control 2, which causes the process to behave as a standard bandit process with
    a parameter $\mu(x)$ depending on the state $x$. Strictly speaking this is a superprocess
    of switching from the use of control 2. Thus if control 2 is selected, the state
    of the stoppable bandit process, and the any of SFAS to it belongs, does not change,
    so we can, as usual with a standard bandit process, ignore the possibility of
    switching from the use of control 2. Thus to use control 2 has the same effect
    as terminating the decision process with a final reward of $\gamma^{-1}\mu(x)$,
    and this is why it is the stop control.


    A SFAS made up of stoppable bandit processes might be a suitable model for an
    industrial research project in which there are several possible approaches, each
    represented by one of theable bandit processes. Using the stop control corresponds
    to searching and exploiting the knowhow gained by one of the approaches.


    A stoppable bandit process will be said to have an *improving stopping option*
    if $\mu(x(t))$ is almost surely nondecreasing in process time $t$. The process
    time remains the total time for which the continuation control 1 has been applied.


    **Lemma 4.4** Condition D holds for a stoppable bandit process $S$ with an improving
    stopping option.


