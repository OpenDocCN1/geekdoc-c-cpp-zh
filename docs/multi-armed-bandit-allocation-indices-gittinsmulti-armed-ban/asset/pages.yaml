    event that $S_1$ dies before the first time after 0 at which its prevailing state
    drops below $M$ (equivalently, $S_1$ dies before $S_2$ when the index policy is
    applied after time).


    We may write $E(r_1) = E[R(M)]$, where $R(M)$ denotes the expected reward obtained
    from $S_1$ until it dies, or its prevailing state drops below $M$. Let $p_M$ be
    the probability that the index of $S_1$ drops below $M$ before $S_1$ dies, then
    $p_M = E[1 - X_1(M)]$. As we have said, $E(r_1 + r_2)$ is equivalent to maximizing
    $E(r_1 - r''_2)$. From the argument above, we have


    ```

    $E(r_1 - r''_2) = E[R(M) - X_1(M)M] = E[R(M) - (1 - p_M)M]\n= E[R(M) + p_M M].$

    ```'
