    In Section 6.2 we present the basic model along with some motivating applications.
    The theory, including the existence of Whittle''s index, depends on a structural
    property of the constituent bandits, called indexability. This is discussed in
    Section 6.3 where the index is introduced. The price of Whittle''s generalization
    is that his index heuristic is not optimal in general. However, it has been shown
    to be optimal under given conditions in an asymptotic regime in which the number
    of bandits in total (n) and the activated (m) grow in proportion. These ideas
    are explained in outline in Section 6.4. We proceed to explain Section 6.5 that
    indexability is easy to establish in cases where the optimal policy for Whittle''s
    Lagrangian relaxation has a monotone structure for each bandit. There are many
    such examples including the spinning plates model discussed here. The remaining
    sections of the chapter all focus on the application of the Lagrangian relaxation/Whittle
    index methodology to problems in queuing control. In Section 6.6 we discuss how
    to overcome a difficulty in applying the ideas to problems of service control,
    which Whittle himself were not able to treatment by these methods. In Section
    6.7 we use a problem involving the admission and routing of impatient customers
    for service as a context within which to discuss ideas how to assess the closeness
    to optimality of the Whittle index heuristic. Here we consider both the tightness
    of the Lagrangian relaxation and approaches which utilize achievable methodology.
    Finally, in Section 6.8 we point out that Whittle''s Lagrangian relaxation approach
    has the potential to undermine the design of effective index heuristics in a range
    of more general resource allocation problems.


    # 6.2 Restless bandits


    Again, with a state of n alternative semi-Markov decision processes. Given their
    states at time t, say $x_1(t), \dots, x_n(t)$, we are to choose actions $u_1(t),
    \dots, u_n(t)$ to apply at time t. As in the multi-armed bandit problem, suppose
    there are just two available actions, $u_i(t) \in [0, 1]$. The first generalization
    is to require that at each time exactly $m (< n)$ of the bandits be given the
    action $u_i = 1$.


    The second generation is that the application of action $u=0$ no longer freezes
    the bandit; instead, it evolves, in a distinct way from its continuation under
    the action $u=1$. Once the action $u_i=1$ is applied to bandit $i$, that action
    must be continued until the next decision time for that bandit. The same is true
    for action $u_j=0$ (so this differs from the usual bandit model, while $u_j=0$
    every time is a decision time).


    Let us briefly give three examples of decision processes that are nicely modelled
    as restless bandits. The first example is along the lines envisaged by Whittle.
    Following his lead, we call $u=1$ the active action and $u=0$ the passive action.


