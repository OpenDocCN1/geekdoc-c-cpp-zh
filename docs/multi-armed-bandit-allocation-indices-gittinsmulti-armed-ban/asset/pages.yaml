    # 2.6 Gittins index


    In this section we make some important observations about the Gittins index theorem
    and the index defined by (2.6).


    # 2.6.1 Gittins index and the multi-armed bandit


    The index theorem for a FABP was first obtained by Gittins and Jones in 1971.
    They presented their index solution to the multi-armed bandit problem to the European
    Meeting of Statisticians in Budapest in 1972. Publication of the theorem followed
    in 1974(a). They give v the dynamic allocation index, and that is the name that
    was used in the first edition of this book. However, all researchers in the field
    now use the name Gittins index. We (Glazebrook and Weber) use this name throughout
    we write. Applications of Gittins indices have been made in the fields of econometrics,
    economics, engineering, numerical analysis, military planning, operational research,
    probability, statistics and website design. We give examples throughout the remaining
    chapters, and in Chapter 9.


    The problem that is most closely associated in many people''s minds with the Gittins
    index is the multi-armed bandit problem (Problem 5). However, the reader may be
    interested to know that practical problem which led to discovery of the index
    theorem was not the multi-armed bandit problem, but rather a problem of selecting
    chemical compounds for screening potential drugs. This is modelled as a type of
    bandit process that we term a target process (see Section 7.1).'
