  md: '# MULTI-POPULATION RANDOM SAMPLING (THEORY) 195


    # 7.5 Random sampling times


    A sampling process for the times $U_1, U_2, \dots$ needed to sample a value are
    independent identically distributed random variables is an example of a semi-Markov
    bandit process. Thus (Theorem 2.1) optimal policies for sampling sequentially
    from a family of such processes are again index policies. Semi-Markov sampling
    processes are of interest as models for whole areas of research in a pharmaceutical
    or agricultural laboratory. A family of two semi-Markov reward processes, for
    example, serves as a model for the herbicide and fungicide programmes. Each sampled
    value is, in accountants'' language, the expected net present value of a particular
    herbicide or fungicide at the time of its discovery. The aim of the model would
    be to indicate the relative priorities of the two research programs.


    No index values for semi-Markov reward processes have as yet been calculated,
    though this would be feasible, particularly when the problem provides the distributions
    of the $U_s$ and of the $X_i$ are independent, and the prior distributions for
    their parameters are also independent, the theorems of Section 7.4 continue to
    hold, with the obvious modification that the state space must now specify a posterior
    distribution for the parameters of the $U$-distribution. We also have an analogue
    of Theorem 7.9, referring to the $U$-distribution instead of the $X$-distribution.
    To state this theorem the notation is extended by letting $\rho_n$ be the posterior
    density for the parameter (in $\mathbb{R}^+$) and including the discount parameter
    $\gamma$ in the notation. Since the prior densities $\rho_0$ and $\pi_0$ are by
    assumption independent, it follows that $\rho_n$ and $\pi_n$ are also independent.


    **Theorem 7.25** If the parameter $\sigma (>0)$ for the family of distributions
    for the sampling time of a semi-Markov reward process is a scale parameter, the
    sample mean $\bar{U}$ is a sufficient statistic, and $\rho_0(\sigma) \propto \sigma^{-d}$
    for some $d>0$, then $\rho_n$ may be identified by its parameters $\tilde{u}$
    and $n$, and for $b > 0$,


    ```

    $R(b^{-1}\lambda, \tilde{b}, \tilde{u}, n, \pi_n, b^{-1}\gamma) = R(\lambda, \tilde{u},
    n, \pi_n, \gamma)$

    ```


    and


    ```

    $v(\tilde{u}, n, \pi_n, \gamma) = \gamma v(\tilde{u}, n, \pi_n, 1).

    ```


    *Proof.* The two parts of the theorem are direct consequences of changing the
    time unit, for the first part by the factor $b$, and for the second part by the
    factor $\gamma$.


    A further modification is to allow a switch from a sampling process to occur at
    any time, rather than restricting switches to when a new value is obtained. This
    works out nearly when the $U$-distribution is exponential, which means that the
    times when new values are obtained form a Poisson process in process time.'
