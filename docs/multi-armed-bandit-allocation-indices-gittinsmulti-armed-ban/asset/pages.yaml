    # 4.8 Bandit processes with arrivals


    Let us start with a SFABB and add the possibility that new bandits may become
    available subsequent to the start. This might be because they are exogenous arrivals,
    or because precedence constraints have been met. It turns out that an index theorem
    holds that the distribution of bandits that are newly available at any decision
    time depends only on events related to the bandit that was for continuation at
    the previous decision time. Specifically, when $B$ is in state $x$ and is selected
    for some decision time $t$, a random set of bandits becomes newly available at
    the next decision time, $t+T$. As we have previously, let us imagine for simplicity
    that all bandits evolve on the finite state space, $E=\{1,\dots,N\}$. We suppose
    that the distribution of the set of bandits becoming newly available at $t+T$
    depends on $x$, and the state $y$ which makes a transition at $t+T$. Note that
    the distribution of arrivals does not depend on the actual time $t$. This model
    for arrivals has been variously arm-acquiring bandits (Whittle 1981), branching
    bandits (Weiss 1988), and bandit process-linked arrivals (or job-linked arrivals)
    (Gittens 1989). Such bandits can also be viewed as a model for what happens when
    a job $B$ generates a random out-forest of successors when it reaches a completion
    state. We shall meet branching bandits again in Example 5.4.


    The model permits some convenient simplifications. If bandits are then selected
    then it completes by the next decision time. The possibility that the job may
    not complete be accounted for by including in the set of arriving jobs a job which
    represents its continuation having completed.


    It would be possible to obtain a proof of an index theorem for bandits with bandit
    process-linked arrivals by generalizing Theorem 4.11 to bandits with random out-forest
    precedence constraints. However, it is perhaps easier intuitive to generate a
    proof of the index theorem in Chapter 1. As remarked by Tsitsikis (1994), it is
    straightforward to see that the method for the index theorem in Section 2.9 continues
    to work when bandit arrivals are of this type. Recall that the proof in Section
    2.9 is based on an interchange argument and induction on the size of the state
    space. In the presence of job-linked arrival it remains the case that if a bandit
    starting in state $i_N$ among all states, the greatest equivalent reward rate
