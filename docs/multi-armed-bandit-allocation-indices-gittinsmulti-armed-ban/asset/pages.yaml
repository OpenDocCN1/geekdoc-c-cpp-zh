    flow time (EWFT) in the M/G/1 multi-class queue. Most readers will know that M/G/1
    is standard queuing theory (Kendall 1951) and refer to randM (i.e. Poisson) arrivals,
    General independent service times, and J server. Suppose there are J job classes
    and class i arrives as a Poisson process of rate $\lambda_i$, and class i have
    independent service times all with the distribution $F_i$, each of costing $c_i$
    per unit time between their arrival time and its completion.


    Let us ignore for the moment the assumption we have made in the Klimov model that
    the number of job classes is finite (from which it follows that the $v(i,j)$ define
    the same priority policy for all $\gamma$ sufficiently small). In our M/G/1 model
    we shall not permit preemption at any instant, but only at certain times, or of
    ages. Each age at which preemption is allowed can be considered as a new class.
    So a class i job can be thought of as passing through classes (i,0), (i,1), (i,2),
    ..., as it reaches successive ages of which preemption is allowed, until finally
    it completes. Jobs arrive to class (i,0) as a Poisson process of rate $\lambda_i$.
    This defines a job-linked arrivals process. If we assume there is a finite k such
    that each job is guaranteed to complete before reaching class (i,k), then there
    are only finitely classes. The problem of minimizing EWFT in the multi-class M/G/1
    is an example of the Klimov problem and the same conclusions can be reached. This
    gives us the following.


    > **Theorem 4.15** EWFT in a busy period of M/G/1 queue with J job classes is
