  md: '# 4 MULTI-ARMED BANDIT ALLOCATION INDICES


    The point of this observation is that our indices do not simply tell us which
    alternative to choose at a given stage in a particular problem with $n$ alternatives.
    Rather, specify the optimal policy for a problem with any set of alternatives
    of a given type. This means that if we know such an index exists for a given class
    of problems, but as yet having an explicit expression for it, then it is sufficient,
    in order to find an explicit expression, to consider problems for which $n=2$,
