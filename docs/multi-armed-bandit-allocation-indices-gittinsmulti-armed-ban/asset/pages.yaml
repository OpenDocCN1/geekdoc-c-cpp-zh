  md: '# 24 MULTI-ARMED BANDIT ALLOCATION INDICES


    where the supremum is over all post-measurable measures $\pi$. The existence of
    $V()$ is guaranteed by standard theory.


    Presented in this way, a SFABP is merely a special type of infinite-horizon discounted-reward
    Markov decision process. The natural way to address it is via the dynamic programming
    equation (or functional equation) of


    ```

    $V(\xi) = \max_{i\in{\{1,...,n\}} \{r_i(\xi) + a \sum_{y\in E} P(y|\xi)V(\xi_{i-1},
    y, \xi_{i+1}, ...,\xi_n)\}, \quad (2.2)$

    ```


    Relevant results from the theory of discounted Markov decision processes (summarized
    in Theorem 2.10) permit us to conclude that (i) there is at least one optimal
    policy that is deterministic and Markov; (ii) the value function $V$ defined in
    (2.1) is the unique bounded function satisfying (2.2); and (iii) a policy is optimal
    if and only for every $\xi$ the maximum on the right-hand side of (2.2). Furthermore,
    approximations to $V$ may be computed by the method of *value iteration*, $V_n$
    is computed from the recursion formed by replacing $V$ with $V_n$ and $V_{n-1}$,
    on the left and right-hand sides of (2.2), respectively. If $V_0$ is any bounded
    function, then $V_n \to V$ as $n \to \infty$.


    These facts are true for general Markov decision processes under the assumptions
    that $|r_i|$ is bounded (which we assume) and that the control space is finite
    (which it is, since we are to continue one of $n$ bandits).


    Unfortunately, the dynamic programming equation (2.2) is not usually helpful in
    computing $V()$ which grows exponentially in the number of bandits, $n$. For example,
    for that the state space of $B_i$ is finite and $k_i = |E_i|, k_i \geq 2$. In
    principle, a solution to (2.2) could be found by using any of the standard solution
    methods, such as the policy improvement algorithm, or linear programming. However,
    the vector state $\xi = (\xi_1, ...,\xi_0)$ evolves on the state space of size
    $k = |E| = \prod k_i$. So the number of stationary policies is $n^k$, where $k
    > 2^n$. In a policy formulation the number of variables would be $O(2^n)$. The
    solution of (2.2) is computationally infeasible for moderate sizes of $k$ and
    $n$.


    # 2.5 Gittins index theorem


    We have defined a discrete-time SFABP as a Markov decision process in which exists
    exactly one of $n$ constituent bandit processes (or Markov rewards) is to be continued
    (or advanced) at each of the decision times 0, 1, ... Remarkably, the optimal
    policy for this problem takes the form of an *index policy*. That is, there exists
    a real-valued index, $v(B_i, \xi_i)$, which we may compute separately for each
    bandit process as a function only of its current state. The optimal policy is
    always to continue the bandit with the greatest index.'
