  md: '# 1


    # Introduction or exploration


    This book is about mathematical models for optimizing in a sequential manner the
    allocation of effort between a number of competing projects. The effort and the
    projects may take a variety of forms. Examples are: an industrial processor and
    jobs waiting to be processed; a server with a queue of customers; an industrial
    laboratory with research projects; any busy person with jobs to do; a stream of
    patients and alternative treatments (yes, the patients correspond to effort –
    see Problem 5 later in this chapter); a searcher who may look in different places.
    In every case effort is treated as being homogeneous, and the problem is to allocate
    it between the different projects so as to maximize the expected reward which
    they yield. It is a sequential problem, as effort is allowed to be reallocated
    in a feedback manner, taking account of the pattern of rewards so achieved. The
    reallocations are assumed to be costly, and to take a negligible time, since the
    alternative is to impose a travelling-salesman-like feature, thereby seriously
    complicating an already difficult problem.


    The techniques which come under the heading of dynamic programming have been devised
    for sequential optimization problems. The key idea is a recurrence equation relating
    the expected total reward (call this payoff) at a given decision time to the distribution
    of its possible values at the next decision time (see (2.2)). This equations may
    be solved analytically. Otherwise a recursive numerical solution may, at any rate
    in principle, be carried out. This involves making an initial approximation to
    the payoff function, and then successive further approximations by substituting
    in the right-hand side of the recurrence equation. As Bellman (1957), for many
    years the chief protagonist of this methodology, pointed out that the recurrence
    equation involves computing a complete enumeration of all policies and their corresponding
    payoffs, but none the soon runs into the sands of intractable storage and'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# MULTI-ARMED BANDIT ALLOCATION INDICES


    processing requirements as the number of variables on which the payoff function
    depends increases.


    For the problem of allocating effort to projects, the number of variables is at
    least equal to the number of projects. An attractive idea, therefore, is to establish
    priority indices for each project, depending on its past history but not of any
    other project, and to allocate effort at each decision time only to the project
    with the highest current index. To calculate a project in a given state against
    some set of standard projects with simple properties. If this could be done we
    should have a reasonable policy without having to deal with the function of states
    of more than one project.


    Optimal policies for some problems of effort allocation are expressible in terms
    of such index is well known. The first three problems described in this chapter
    are cases in point. Chapters 2, 3 and 4 set out a theory which puts these results
    into context. They include several theorems asserting the optimality of policy
    indices under different conditions. In fact of the seven problems described in
    this chapter may be solved rapidly by using the index theorem (Theorem 2.1), and
    its Corollary 3.5. Problem 4 requires Theorem 3.1, which is a continuous-time
    version of the index theorem.


    Since they may change as more effort is allocated, these priority indices may
    be termed dynamic allocation indices. The policies that they define, in relevant
    circumstances, the Smith rule, and the shortest processing time rule (SPT). The
    main aim of this chapter is to exhibit their range of application by describing
    a number of particular articles. A second aim is to provide an informal introduction
    to the main methods available for determining indices. These are by (i) interchange
    agents; (ii) exploiting any special features of the bandit processes concerned,
    in particular those which lead to the optimality of myopic policies; (iii) calibration
    by reference to standard bandit processes, often involving iteration using the
    dynamic programming recurrence equation; and (iv) using the fact that a dynamic
    allocation index may be regarded as a maximized equivalent constant reward.


    # Problem 1 Single-machine scheduling (see also Section 2.12, Section 3.2 and
    exercise 4.1)


    There are $n$ jobs to be processed on a single machine. A cost $c_i$ is incurred
    per unit of time until job $i$ has been completed, and the service time (processing
    time) for job $i$ is $s_i$. In order should the jobs be processed as to minimize
    the total cost?


    # Problem 2 Gold-mining (see also Section 3.5.2)


    A woman owns $n$ gold mines and a gold-mining machine. Each day she must assign
    the machine to one of the mines. When the machine is assigned to mine $i$ there
    is a probability $p_i$ that it extracts a proportion $q_i$ of the gold left in
    the mine, and a probability $1-p_i$ that it extracts no gold and breaks down permanently.
    To what sequence of mines on successive days should the machine be assigned as
    to maximize the expected amount of gold mined before it breaks down?'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# INTRODUCTION AND EXPLORATION


    **Problem Search** (see also Section 3.5.4 and exercise 3.6)

    A stationary object is hidden in one of $n$ boxes. The probability that a search
    of box $i$ finds the object if it is in box $i$ is $q_i$. The probability that
    the object is in box $i$ is $p_i$, and by Bayes'' theorem as successive boxes
    are searched. The cost of a single search of box $i$ is $c_i$. How should the
    boxes be sequenced for search so as to minimize the expected cost of finding the
    object?


    For Problem 1 an optimal schedule is one which processes the jobs in decreasing
    order of $c_i/s_i$, as may be shown by the following simple interchange argument.
    If jobs 1 and 2 are processed as the first and second, respectively, then the
    holding cost due to these two jobs is $c_1s_1+c_2(s_2)$. If the processing of
    jobs 1 and 2 is interchanged, this quantity becomes $c_2s_2+c_1(s_1)$. The holding
    cost due to the other jobs is unchanged. Thus, the first ordering has the smallest
    cost if and only if $c_1/s_1 \geq c_2/s_2$. It follows that the relationshipshipship
    $c_i/s_i \geq c_j/s_j$ must hold for any two jobs $i$ and $j$ such that $i$ immediately
    precedes $j$ in an optimal processing order of the jobs. This implies that the
    total cost is maximized by processing the $n$ jobs in order of indices which are
    defined as $\mu_i = c_i/s_i$.


    For Problem 2, an optimal policy is one, when $x_i$ is the amount of gold remaining
    in mine $i$ on a particular day, allocates the machine to a mine $j$ such that


    > $$\frac{p_iq_j}{1-p_i} = \max \frac{p_jq_i}{1-p_j}$$


    For Problem 3, if box $j$ is searched next under an optimal policy, then


    > $$p_jq/c_j = \max p_iq/c_i$$


    For Problems 2 and 3, a policy is specified by a sequence of numbers corresponding
    to the order of the mines to which the machine is allocated until it breaks down,
    or the order in which the boxes are to be searched until the object is found.
    The policies just quoted may therefore be shown to be optimal in the class C of
    all policies specified by sequences in which each $i = (1, 2, \dots, n)$ occurs
    an infinite number of times, by arguments involving interchanges of adjacent mines.
    Since any policy may be matched by an arbitrarily large initial of specifying
    the number sequence, it follows that the above policies are optimal in the class
    of all policies.


    The optimal policies for Problems 1, 2 and 3 are described as follows. At each
    stage a job, mine or box is to be selected by a real-valued function defined on
    the set of available alternatives, and the one selected is as to maximize this
    function. These functions, then, are dynamic allocation indices for the three
    mines.


    We have described these indices as functions on the set of available alternatives.
    More precisely, the index for Problem 2, for example, is a function of the three
    variables, $x_i, q_i$ and $p_i$, which constitute the information available for
    mine $i$ when the amount of gold which it contains is $x_i$.'
  merge: -1
