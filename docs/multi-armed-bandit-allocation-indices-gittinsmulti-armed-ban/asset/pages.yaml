    # 5.4 Generalized conservation laws and indexable systems


    A few key facts are critical to the account of the multi-armed bandit given in
    the preceding section. The first is that the system performance is an expectation
    and the second is that the objective is optimized in linear performance. Finally,
    there is the fact that the system performance satisfies a collection of (in)equalities
    of the form given in Lemma 5.1. The current section points out that there are
    a wide range of other problems which have a formulation which shares these features
    and have solutions in the form of priority policies determined according to a
    Gittins index ordering derived from an adaptive greedy algorithm. In this more
    general setting, Gittins indices have sometimes been called generalized Gittins
    indices and we will drop the qualifying.


