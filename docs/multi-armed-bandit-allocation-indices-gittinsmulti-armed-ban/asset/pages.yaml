    The family P of distributions with densities of the form (7.2) is said to be conjugate
    to D, a concept discussed in detail by Raffa and Schlaifer (1961). To restrict
    the prior distribution to P is often acceptable, since it allows the prior mean
    and variance of a parameter to be given arbitrary values, and is virtually essential
    for computational tractability.


    This sequential Bayesian setup fits into the bandit process framework where the
    state of a bandit sampling process is identified as the current (posterior) distribution
    for θ. For a target process we also need a completion state C, as in the joints
    of Section 3.2, attainment means that an Xi as the target has been observed, and
    that further rewards are zero rewards. The undiscounted reward r(S,π) from continuing
    the bandit sampling process when it is in state π is the expected discounted reward
    yielded by the Xi when π is the current density for θ. Thus


    ```

    r(S,π) = ∫ g(x)f(x|π)dμ₁(x).  (7.3)

    ```


    where for reward process g(x) = g(x), for a target process g(x) = 1, if x ≥ T,
    and g(x) = 0 if x < T, and f(.|π) = f(.|θ)θdμ₁(x). The restriction of the prior
    distribution to a particular conjugate family means that the state may be specified
    by the parameters of the current distribution for θ. Note that, for a target,
    r(S,π) is the probability in state π that the new observation reaches the target.
    It is referred to as the current probability of success.


    To refer to the current distribution of the unknown parameter θ as the state of
    a bandit process may seem a little odd. Certain theorists would be more likely
    to reserve this designation for θ itself. The reader may find it helpful to regard
    θ as the true or absolute state from an all-knowing divine standpoint, and π as
    the existential state summarizing the incomplete information about θ available
    to each decision maker.


