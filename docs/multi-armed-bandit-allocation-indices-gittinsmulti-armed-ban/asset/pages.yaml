    # 5.3 Proof of the index theorem by greedy algorithm


    In this section we sketch the key ideas of the achievable region approach by using
    to give one more proof of the index theorem for the general multi-armed bandit
    problem (or simple family of alternative bandit processes).


    Suppose that $n$ bandits are identical and have the same finite state space $E
    = \{1, \dots, N\}$. As noted in Section 3.2 this is without loss of generality,
    but provides a useful specification because bandits are distinguished only by
    their state. Previously, we have used $x$ to denote a state, but as stated above
    it is convenient in this chapter to reserve $x_1, \dots, x_n$ for linear programming,
    or system performance variables. In this chapter we need only a notation for the
    initial state of a multi-armed bandit, and denote this by $k = (k_1, \dots, k_n)$.
    $I_i(t)$ is an indicator variable for the event that a bandit in state $i$ is
    continued at time $t$. For a given policy $\pi$, $x_i^\pi$ denote the discounted
    reward of times that a bandit in state $i$ is continued under policy $\pi$. That
    is,


    ```

    $x_i^\pi = E_\pi \left[ \sum_{t=0}^{\infty} a^t I_i(t) \mid k \right]$

    ```


    Since the initial state $k$ is to be regarded as fixed, we do not explicitly the
    dependence on $x_i^\pi$. Assuming that whenever a bandit is in state $i$ is continued
    we obtain reward $r_i$, the multi-armed bandit problem is equivalent to the problem
    of maximizing $\sum r_i x_i^\pi$, by choice of $(x_1^\pi, \dots, x_n^\pi)$ optimally
    within the space of performance vectors that are ''achievable'' by admissible
    policies $\pi$.


    The crux of the approach is to characterize the achievable region of performance
    vectors as a polyhedral space that is defined by a set of linear constraints.
    These constraints, sometimes called conservation laws, can be obtained by thinking
    about some objective functions that are obviously optimized by priority policies.
    We start with one constraint that is trivial. Since one bandit is being continued
    at time, we must have one simple conservation law:


    ```

    $\sum_{i\in E} x_i^\pi = 1 + a + a^2 + \dots = \frac{1}{1-a}$

    ```'
