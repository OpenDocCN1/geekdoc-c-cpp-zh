  md: '# INTRODUCTION OR EXPLORATION


    future searches. The goal is to determine in what order to search locations and
    when to stop searching altogether in order to maximize overall returns.


    Before search begins at $t=0$, we express our beliefs about the number of objects
    at each location by assigning a prior distribution to each. It will be convenient
    at this point to focus discussion on the nature of a single location, and we drop
    the location identifier $i$ until we need it. We shall use $Y$ for the unknown
    number of objects. We shall assume that the number of objects at distinct locations
    are independent. As searching proceeds, the prior distribution will be transformed
    by Bayes'' theorem into a posterior distribution for the number of objects at
    the location remaining to be discovered. Suppose that $s$ searches have been made
    at that location and their outcomes are summarized by the vector $x = (x_1, x_2,
    \dots, x_s)$, where $x_i$ is the number of objects found when the location was
    searched for the $i$th time. We write $\Pi(x,s)$ for the posterior distribution
    of $Y - \sum_{i=1}^s x_i$, the number of still-undiscovered objects. In addition
    to the above, we also need a detection model, namely a set of conditional probabilities
    for the number of objects discovered during a search. We use $\phi(x|y)$ for the
    probability that a search will yield $x$ objects, given that $y$ were before the
    search.


    An intriguing question is raised in this relation to model whether the discovery
    of a large or small number of objects at a location is an encouragement or a incentive
    to revisit that location to make further searches. Roughly speaking, small discoveries
    are always a incentive to return, as the decision-maker reviews her beliefs about
    the potential value that was at the location prior to the search as well as removing
    the few objects she found. The effect of a large discovery is a considerably more
    complex issue and will depend important on the way we go about modelling our beliefs.
    It must presumably be true that, over a long run, locations become less attractive
    as they are emptied of objects.


    In order to make progress, we seek some simplification of the problem''s structure
    by requiring that the posterior distribution $\Pi(x,s)$ depend upon the search
    history $(x,s)$ only through $\sigma_s = \sum_{i=1}^s x_i$, the total number of
    objects discovered, and $s$, the number of searches. We write $\Pi(x,s) \equiv
    \Pi(\sigma_s,s)$ when this is the case. For example, it can be shown that the
    probability a search discovers nothing must take the form $\phi(0|y) = q^y$ for
    some $q$, $0 \le q \le 1$. A natural choice for the detection model which requires
    the guaranteed simplification of the posterior structure takes $\phi(x|y) = \binom{y}{x}p^xq^{y-x}$,
    $0 \le x \le y$, where $p=1-q$, namely the conditional model $B(y,p)$. This flow
    flows from a detection rate $p$, constant across individual objects at the location,
    together with a further assumption that objects are discovered (or not) independently
    of one another.


