    # 4.3 The index theorem for superprocesses


    Mirroring our definition of an index policy for a FABP in Section 2.5, we show
    that a policy is an index policy with respect to μ₁, ..., μn if any decision time
    superprocess S_k is selected for continuation, with control u, is such that μ_k(x,
    u) = max_{j∈Ω(x)} μ_j(x_j, u). Assuming Condition D, we can prove an index theorem.


    **Theorem 4.3 Index theorem for a SFAS** A policy for a simple family of alternative
    superprocesses S₁, ..., Sn, which all satisfy Condition D, is optimal if it is
    an index policy with respect to v(S₁, ..., v(S_n)).


    As in Section 2.8, we make use of the fact that a simple family of alternative
    semi-Markov superprocesses is equivalent to a discrete-time Markov decision process
    with stochastic discounting. The decision times are 0, 1, 2, ... When a superprocess
    continues it makes an unsuccessful transition with a probability of 1 − α^t, where
    T is the time until the next decision time in the equivalent semi-Markov process.
    In the special case that the superprocesses are discrete-time Markov processes,
    we say that when S makes an unsuccessful transition it ''dies''. The objective
    in our problem is to maximize the expected (undiscounted) total reward earned
    from a SFAS before the first constituent process dies. We generalize the proof
    given in Section 2.8 as follows.


    *Proof.* We start with a proof for a family of n = 2 superprocesses, S1 and S2.
    Suppose that they are initially in state x1(0) and x2(0). Given that Condition
    D holds, gi(xi) be the optimal continuation for Si when it is in state xi. We
    consider a class of policies, Π_k, in which the index policy must follow at decision
    times k, k+1, ... That is, compute for each superprocess i its fair stake, μ_i(x_i),
    and then continue from time k the superprocess i having the greatest fair stake,
    applying the control g_i(x_i). Extending the terminology introduced in Section
    2.5 to apply to superprocesses, the fair stake, μ_i(x_i), is the maximum amount
    we would be willing to sacrifice if Si while we continue, in exchange for any
    rewards arising from Si until it dies or we choose to stop collecting its rewards.'
