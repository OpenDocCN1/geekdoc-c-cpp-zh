    # 2.1 Introduction


    Chapter 1 in large measure set out to dazzle the reader with the diversity of
    the allocation problems which succumb to a solution in terms of indices. In this
    chapter we introduce the key concepts of a bandit process and of a family of alternative
    bandit processes (FABP). For simplicity, we shall abbreviate these terms to ‘bandit’
    and ‘bandits processes’, respectively. We apologize to the reader who feels that
    it is illogical to refer to an arm of a multi-armed bandit as a bandit. It is
    indeed illegal, but we judge that the precedents for this contraction and its
    convenience outweigh the purist argument. Bandit process is the generic term for
    the jobs, gold mines, research projects, arms and locations of the various problems
    in Chapter 1. A FABP is a model for the problem when choices must be made between
    different bandit processes. In discrete time, a special type of exponentially
    discounted semi-Markov decision process. For this reason, we provide in Section
