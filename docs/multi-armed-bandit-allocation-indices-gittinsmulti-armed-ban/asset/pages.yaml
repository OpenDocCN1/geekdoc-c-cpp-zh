    A policy for a decision process is any rule, including randomized rules, which
    for each decision t specifies the control to be applied at time t as a function
    of t, the state at time t, the set of previous decision times, and the states
    of the process and the controls applied at those times. Thus the control applied
    at time t may depend on the entire history of the process, not on what happens
    after time t, a situation which we describe by saying that it is measurable. A
    policy which maximizes the expected total reward over the set of all policies
    for every initial state will be an optimal policy. Deterministic policies are
    those which involve no explicit time dependence. Stationary policies and Markov
    policies are those for which the control chosen at time t depends only on t and
    the state at time t.


    At any stage, the time during which the process has not been frozen by applying
    control 0 is termed the process time. The time when control 1 is applied for the
    (i+1) time is denoted by ti (i=0, 1, 2, ...). The state at process time ti is
    denoted by x(ti). The sequences of ti and states x(ti), i=0, 1, ..., constitute
    a realization of the bandit process, which does not depend on the sequence of
    controls applied. The reward at decision time t control 1 has been applied after
    every previous decision time, so process time coincides with real time, it is
    r''(x(t), 1), which we abbreviate to r''(t).


    A policy which results in 1 being applied to a time τ, and 0 applied thereafter,
    will be a stopping rule, and τ the corresponding stopping time. In particular,
    a policy which divides the state into a continuation set, on which control 1 is
    applied, and a stopping set on which 0 is applied, is a deterministic Markov stopping
    rule.


    We note that τ may take the value infinity with positive probability. Stopping
    rules have been extensively studied, for many part in the context of bandit processes
    (e.g. Chow, Robbins and Sigmund, 1971); these may be regarded as defined by bandit
    processes in which the freeze controls nonzero reward, that is r(x,0)≠0. We now
    come to the central concept of a family of alternative bandit processes (FABP).
    This is a decision process formed by bringing together a set of n bandit processes
    with the same discount factor. Time zero is a decision time for every bandit process,
    and at time zero, control 1 is applied to just one of them, bandit process B1
