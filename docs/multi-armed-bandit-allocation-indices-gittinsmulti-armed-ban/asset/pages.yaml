    # 3.3.3 The continuous-time index theorem for a SFABP of jobs


    **Theorem 3.1** Index policies are optimal for a SFABP consisting of jobs.


    *Outline of proof.* From Theorem 2.1 we know that index policies are optimal in
    the class of $\Delta$-policies, for switching between jobs is restricted to decision
    times occurring at intervals $\Delta$. To prove the theorem it would suffice to
    show that (i) the payoff from one of these index $\Delta$-policies as $\Delta
    \to 0$ to the payoff from a continuous-time index policy; and (ii) the maximal
    payoff from a $\Delta$-policy to the continuous-time maximal payoff as $\Delta
    \to 0$. The proof may be completed along these lines.


    # 3.4 Necessary assumptions


    The index theorem for a SFABP (Theorem 2.1) has been proved over modelling assumptions
    that (i) rewards are accumulated up to an infinite horizon; (ii) there is constant
    exponential discounting; and (iii) in the language of scheduling, there is just
    one processor/server. Using jobs as the basis for examples, we now show that these
    assumptions cannot be relaxed.


    # 3.4.1 Necessity of an infinite horizon


    Consider the first infinite time horizon assumption. If instead of this is a finite
    time horizon $T$ at which the reward stream is terminated, we can see what happens
    by putting $\gamma = 0$ and supposing that the $n$ jobs have deterministic service
    times $t_i$ ($i=1, 2, \dots, n$), with $\sum_i t_i > T$. We have the problem of
    maximizing $\sum_{i \in S} V_i$ with respect to $S$ such that $\sum_{i \in S}
