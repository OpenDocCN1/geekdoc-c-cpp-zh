  md: "# 94 MULTI-ARMED BANDIT ALLOCATION INDICES\n\nProof. Consider the problem of\
    \ maximizing, over $f$, the quantity\n\n$Z_f(B) = R_f(B) - v(B)W_f(B).$\n\nIf\
    \ $B$ under $f$ ever reaches a decision time in which its state is $y$, that going\
    \ forward $Z_f(B,y) < 0$, then it would be better to stop than to continue with\
    \ $f$. On the other hand, if going forward $Z_f(B,y) > 0$, then it must be optimal\
    \ to continue without introducing any period of freeze control at that point (since\
    \ to freeze for time $\\phi$ would reduce subsequent payoff by a factor $a^\\\
    phi$). These observations imply that $Z_f(B)$ is maximized by a stopping rule,\
    \ from which fact the lemma follows.\n\nBefore starting the next lemma we need\
    \ one preliminary idea. Consider a policy $g$ that is applied to $\\mathscr{F}$\
    \ up to stopping time $\tau$. Over the period up to $\tau$, each $B_j$ is sometimes\
    \ continued and sometimes frozen. We may say that $(g,\tau)$ defines a freezing\
    \ rule $f^j$ that is applied to $B_j$. It is Part (i) of the lemma that we need.\
    \ The parts (ii) and (iii) make clear the equivalence of index policies and forwards\
    \ induction policies for $\\mathscr{F}$.\n\n# Lemma 4.6 $\\mathscr{F}$ is a SFABF,\
    \ comprised of $B_1, \\dots, B_n$. Then\n\n+   (i) $v(\\mathscr{F}) = \\max_j\
    \ v(B_j)$.\n\n+   (ii) If $f^j$ is a policy for $B_j$ defined by a policy $\\\
    pi$ and stopping time $\\sigma$ such that $v_{\\pi(\\sigma)} = v(\\mathscr{F})$,\
    \ then $v_{f^j}(B_j) = v(\\mathscr{F})$ for all $j$ such that $W_{f^j}(B_j) >\
    \ 0$.\n\n+   (iii) A policy for $\\mathscr{F}$ is an index policy if and only\
    \ if it is a forwards induction policy.\n\nProof.\n\n+   (i) Suppose an arbitrary\
    \ policy $g$ is applied to $\\mathscr{F}$, with a stopping time $\tau$. As explained\
