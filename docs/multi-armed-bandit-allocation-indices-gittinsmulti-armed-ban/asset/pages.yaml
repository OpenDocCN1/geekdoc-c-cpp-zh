    # 6.4 Asymptotic optimality


    We now turn to the question of optimality or near optimality of the Whittle policy.
    $m = an$, $R_{w}^{(n)}(\alpha)$, $R_{opt}^{(n)}(\alpha)$ and $r(\alpha)$ denote,
    respectively, the average reward that is obtained from $n$ restless bandits under
    the Whittle policy, under an optimal policy, and from a single bandit under the
    relaxed policy (that the bandit receives the action $u = 1$ for a fraction $\alpha$
    of the time). Then


    ```

    $R_{w}^{(n)}(\alpha) \leq R_{opt}^{(n)}(\alpha) \leq nr$

    ```


    It is plausible that the Whittle index should be asymptotically optimal as $n$
    becomes large, in the sense that $r(\alpha) - R_{w}^{(n)}(\alpha)/n \to 0$ as
    $n \to \infty$. Weber and Weiss (1990, 1991) have shown that this is true if certain
    differential equations have an asymptotically stable equilibrium point (i.e. a
    point to which converge from any starting state). These are the differential equations
    which describe a fluid approximation to the stochastic process of the bandit states
    evolving under the Whittle index.


    Suppose bandits move on a state of space of size $k$, and $z(t)$ be the proportion
    of the bandits in $i$; the differential equations are of the form $dz/dt = A(z)z+b(z)$,
    where $A(z)$ and $b(z)$ are constants within $k$ polyhedral regions which partition
    the positive orthant of $\mathbb{R}^k$. It turns out that there are examples of
    dual-speed restless bandits (needing $k>3$) in which the differential equations
    have an asymptotically stable cycle (rather than a stable equilibrium point),
    and this can lead to suboptimality of the Whittle index. However, in examples,
    the suboptimality was never found to be more than about one part in $10^4$.


    It is tempting to try to generalize the idea of a Whittle index for restless bandits
    to problems with a discounted reward criterion, starting with the appropriate
    functional equation in place of the passive action. However, there is no asymptotic
    result for this case that is analogous to the result of Weber and Weiss for the
    average reward case. The use of discounted versions of Whittle indices can actually
    end recommending the worst of all priority policies, and a payoff that is very
    far from the optimum. This is because the identity of the optimal priority policy
    can critically depend on the starting state of the $n$ restless bandits, whereas
    the ordering of Whittle indices is calculated without reference to the starting
    state.


