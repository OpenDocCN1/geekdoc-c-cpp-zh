    # 2.2 Decision processes


    A Markov process is a mathematical model of a system which passes through a succession
    of states in a manner determined by a corresponding succession of transition probability
    distributions which depend on the current state. This concept is one of the most
    powerful weapons in the probabilist''s armour. The mathematical theory is elegant,
    and examples abound in all branches of the physical and economic sciences.


    To such a process let us add a set of decisions at each stage, and on which the
    probability governing the next state of the system depends. Let us also add a
    set of rewards at each stage, so that the decision-maker receives a reward which
    depends on his or her decision and on the subsequent transition. These additions
    give us a Markov decision process, of which varieties are appropriate models for
    a wide range of situations where a sequence of decisions has to be made. The study
    of Markov decision processes began with the work of Wald (1950) and Bellman (1957)
    and continues in the present day. There is a substantial literature—see, for example,
    the book by Howard (1971) and the review by Tegels (1976). The modern theory is
    well explained in many books, such as by Whittle (1983), Ross (1983) and Puterman
    (2005).


    Various different criteria may be used to choose which decision to make at each
    stage. We shall consider Markov decision processes with an infinite time horizon:
    that is, which go on forever. Future rewards will be discounted, ensuring that
    the total reward obtained is finite. The aim will be to find policies which maximize
    the expected value of this total discounted reward, which will be termed simply
    the payoff. Some of the most interesting applications of our theory are non-discounted
    problems, whose solutions may be obtained by letting the discount factor tend
    to one, or by reinterpreting the discount factor in some way. Problems 1, 2 and
    3 of Chapter 1 are cases in point.


    It was Blackwell (1965) who proved many of the fundamental results for Markov
    decision processes. These results include the existence and uniqueness of a solution
    to the dynamic programming equation, the fact that an optimal policy'
