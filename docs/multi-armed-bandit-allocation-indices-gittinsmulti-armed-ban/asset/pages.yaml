    # **Theorem 4.14** In the Klimov model with $J$ classes, the mean holding cost
    is minimized by the index policy defined by the $\gamma=0$ indices, ignoring arrivals.


    *Proof.* Note that the first busy period is independent of scheduling. Assume
    that arrivals are job linked, so that, once the first busy period ends, no more
    jobs arrive. This problem is equivalent to one of maximizing the expected discount
    during the first busy period (where a reward $r_i$ is obtained when a class $i$
    job completes service). We have already noted above that there is a solution in
    terms of a Gitts index policy.


    Suppose that class $i$ is the class of $i$th highest priority, $i=1, 2, \dots,
    J$. Then the Gitts index of a class $j$ job is computed by just one job in class
    $j$, serving that job, and subsequently arriving or feedback jobs in classes $1,
    \dots, j-1$, until there is no longer any in the system of class $i$ higher than
    $j$.


    If $\gamma > 0$ it matters that class $i$ jobs are given priority over those in
    class $i+1$. However, in the $\gamma \to 0$ limit it does not matter how the jobs
    in classes $1, \dots, j-1$ are scheduled because the index is just the quotient
    of the expected reward collected and the expected period elapsed, required to
    reach the situation in which there remain no jobs in any class of higher priority
    than $j$. Since the order of service does not matter in the $\gamma \to 0$ limit,
    we may suppose that the initial job and any feedback jobs are served first, until
    there is no more feedback. Suppose this takes time $T$, and that during this the
    rewards collected to $C$. Once time $T$ is reached, there will be numbers of jobs
    in classes $1, 2, \dots, j-1$ (the ones that arrived). The number in class $i$
    will have $\lambda_i T$. It follows by thinking about the busy period created
    from serving each of these jobs that the expected time it to reach a point where
    there are no jobs in system of priority higher than $j$ is proportional to $T$,
    say $\beta T$, and the expected reward collected is also proportional to $T$,
    say $\alpha T$. This means that the index for $j$ in the $\gamma \to 0$ limit
    has the value


    ```

    $v(j) = \frac{\frac{E(C+\alpha T)}{E(T+\beta T)}}{(1+\beta)}$

    ```


    This is an increasing function of $EC/ET$, which is the value of the index in
    a problem with no arrivals. Thus, we may conclude that the priority order of the
    classes is the same as that with no arrivals.'
