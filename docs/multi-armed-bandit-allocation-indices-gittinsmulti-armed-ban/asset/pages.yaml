  md: 'The problem of developing optimal policies for job scheduling or a family of
    alternative bandit processes with switching penalties is a famously intractable
    one to which several important contributions have been made. For example, Globebrook
    (1990b), Agrawal, Hedge and Teneketis (1988), Oyen and Teneketis (1994), Banks
    and Sundaram (1994), Le Ny and Feron (2006) perform a linear relaxation for the
    restless bandit problem with discounted rewards and with additional costs penalizing
    switching between projects. Similarly, Gha and Munagala (2009) examine a multi-armed
    bandit problem with pulling an arm in state x incurring an cost c(x), and a switch
    from pulling an arm in state x to state y c(x, y). They consider the finite-horizon
    utilization problem, in which the aim is to maximize the reward at the Tth pull,
    subject to constraints on the total operating costs and switching costs incurred
    during the previous pulls. It is a problem that addresses practical problems in
    robot navigation, sensor networks and labour economics. They construct a polynomial-time
    computable policy that achieves a reward of at least $\frac{1}{4}-\epsilon$ times
    that achieved by an optimal policy.


    The paper of Jun (2004) provides a good survey of research on bandit problems
    with switching costs.


    # 9.6 Military applications


    Military logistics has produced a fruitful field for the application of index
    policies. Problem domains already mentioned in the text which provide models and
    analyses of relevance to military applications include the optimal exploration
    of Model 6 in Chapter 1, the discrete search models of Chapter 3, and the work
    on sensor management mentioned in Chapter 6 in relation to restless bandits. In
    this section we shall briefly describe two further problems.


    First, Globebrook and Washburn (2004), in their review of so-called Look-Look-Shoot
    models, argue that the advent of modern long-range, accurate, but very expensive
    weapons has lent importance to analyses of shooting at targets which make good
    use of the information gathered on status in the process. They describe and discuss
    the importance of multi-armed bandit models in this context. They cite the work
    of Manor and Kress (1997), who considering a problem in which target has probability
    $p_j$ of being killed by a single shot. If the target is killed, fact is confirmed
    with probability $q_j$. Otherwise there is no feedback regarding the outcome of
    shots. The goal is to kill as many targets as possible with a fixed number of
    shots. This latter technically places the models outside of the infinite-horizon
    class with which we have primarily concerned. However, the status of one-step-lookahead
    or myopic rules renders the horizon irrelevant. A proof is given that the myopic
    policy of always shooting at the target which offers the largest immediate gain
    is optimal. The authors argue the relevance of such models to the operation of
    weapon systems such as fibre-optic guided missiles. A manifest disadvantage of
    a myopic policy is its likely to switch targets frequently.'
