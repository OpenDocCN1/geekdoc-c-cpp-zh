  md: '# Preface


    The first edition of this book was published in 1989. A shortened version of the
    preface to that edition follows this preface. The uninitiated reader might find
    it helpful to read it at this point.


    Since 1989 the field has developed apace. There has been a remarkable flowering
    of different proofs of the main index theorem, each giving its particular insight
    as to why the result is true. Major bodies of related theory have also emerged,
    notably the achievable region and restless bandit methodologies, and the discussion
    in economics of the appropriate balance between exploration and exploitation.
    These have led, for example, to improved algorithms for calculating indices and
    to improved bounds on the performance of index strategies when they are not necessarily
    optimal. These developments form the case for a new edition, plus the fact that
    there is an ongoing interest in the book, which is now difficult to buy.


    There are now three authors rather than just John Gittins. Kevin Glazebrook and
    Richard Weber bring familiarity with recent developments, to which they made important
    contributions. Their expertise has allowed us to include new chapters on achievable
    regions and on restless bandits.


    We have also taken the opportunity to substantially revise the earlier chapters.
    Our aim is to provide an accessible introduction to the main ideas, taking advantage
    of more recent work, before proceeding to the challenging material in Chapters
    4, 5 and 6. Overall we have tried to produce an expository account rather than
    just a research monograph. The exercises are designed as aid to a deeper understanding
    of the material.


    The Gittins index, as it is commonly known, for a project competing for investment
    with other projects allows both for the immediate expected reward, and for the
    value of the information gained from the initial investment, which may be useful
    in securing later rewards. These factors are often called exploitation and exploration,
    respectively.


    In this spirit Chapter 1, which is a taste for the rest of the book, is subtitled
    ‘Exploration’. The mainstream of the book then continues through Chapters 2 to
    4. It breaks into independent substreams represented by Chapter 5, Chapter 6,
    Chapters 7 and 8, and Chapter 9, which looks briefly at further application areas.'
  merge: -1
