  md: '# Foreword to the first edition


    The term ''Gittins index'' now has firm currency in the literature, denoting the
    concept which first proved so crucial in the solution of the long-standing multi-armed
    bandit problem and since then has provided a guide for the deeper understanding
    of all such problems. The author is, nevertheless, too modest to use the term
    so I regard it as my sole role to reassure the potential reader that the author
    is indeed the Gittins of the index, and that this book sets forth his pioneering
    work on the solution of the multi-armed bandit problem and his subsequent investigation
    of a wide class of sequential allocation problems.


    Such allocation problems are concerned with the optimal distribution of resources
    between projects which need resources in order to develop and yield benefit at
    a rate depending upon their degree of development. They embody in essential form
    a conflict evident in all human action. This is the conflict between taking actions
    which yield immediate reward and those (such as acquiring information or skill,
    or preparing the ground) whose benefit will come later.


    The multi-armed bandit is a prototype of this class of problems, prolonged during
    the Second World War, and once recognized so difficult that it quickly became
    a classic, and a byword for intransigence. In fact, John Gittins solved the problem
    by the late sixties, although the fact that he had done so was not generally recognized
    until the early eighties. I illustrate the mode of propagation of this news, when
    it began to propagate, by telling of an American friend of mine, a colleague of
    high repute, who asked an equally well-known colleague ‘What would you say if
    you were told that the multi-armed bandit problem had been solved? The reply was
    somewhat in the Johnsonian form:


    > ‘Sir, the multi-armed bandit problem is not of such a nature that it can be
    solved’. My friend undertook to convince the doubter in a quarter of an hour.
    This is indeed a feature of John’s solution: that, once explained, carries conviction
    before it is proved.


    John Gittins gives here an account that unifies his original pioneering contributions
    with the considerable development achieved by both himself and other workers subsequently.
    I recommend the book as the authentic and authoritative source-work.


    Peter Whittle'
  merge: -1
