    # 2.12 History of the index theorem


    It is now 40 years since Gittins and Jones first proved the index theorem for
    a SFABP. The idea that an optimal policy for a sequential decision problem may
    sometimes take the form of an index policy was not new at the time; it had known
    for some simple scheduling problems since the 1950s. For example, for Problem
    1, it was Smith (1956) who observed that, to minimize the weighted flow of n jobs
    with have processing times on a single machine, one should process them in decreasing
    order of an index computed as weighted by processing time (an index priority policy
    known as ''Smith’s rule'').


    An elementary version of the multi-armed bandit problem (Problem 5) was solved
    by Bellman (1956), for the special case in which there were just two drugs and
    the success probability of one is known, and by Brady, Johnson and Karlin (1956)
    in the case of undisclosed rewards and a finite horizon. Their authors defined
    and discussed indices characterizing optimal policies (but without calling them
    indices). They praised the idea, above, in which an arm with unknown $p_i$ can
    be calibrated against an arm with known $p_k$ that is one different (in a two-armed
    bandit problem) as regards pulling arm $i$ or $k$.


    The 1970s saw rapid advances in researchers’ appreciations of how index policies
    can be optimal for more complicated problems. Klimov (1974), Vivek (1974), Harrison
    (1975), Tcha and Pliska (1977) Meijson and Weiss (1977) were all obtaining results
    about the optimality of index policies for scheduling problems in various forms
    of multi-class queues, and finding indices similar to the Gittins index. They
    were mostly unaware of the index theorem. This was first presented by Gittins
    and Jones at a conference in 1972 (whose proceedings were published in 1974).
    It became more known after the publication of Gittins’ 1979 paper.


    Perhaps it is because the theorem is so remarkable and unexpected that many researchers
    sought to re-prove it for themselves. It is impossible to list all who have studied
    the index theorem and contributed proofs or insights. At the time of the first
    edition this book we contributed by Beale (1979), Willey (1980), Karatzas (1984),
    Varaiya, Walrand and Buyukkok (1985), Mandelbaum (1986, 1988), Chen and Katehakis
    (1986), Kallenberg (1986), Elett (1986), R. P. Kertz (1986), Tsitsiklis (1986),
    Katehakis and Veinott (1987) (restart-in-state method), and Lai (1988).


    The proof of Varaiya et al. is distinctive for showing that results can be in
    the context of monotone sequences of sigma-fields, also known as filtrations,
    for each bandit process, rather than the Markov or semi-Markov setting to which'
