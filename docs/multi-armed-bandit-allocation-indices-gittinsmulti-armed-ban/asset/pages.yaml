    \ no sooner under $g$. The reward $r(t_i)$ is discounted by $a^{f_i+1}$ rather\
    \ than $a^{f_i}$, where $f_i$ is the total time that $g$ applies $f_0, f_1, \\\
    dots, f_{i-1}$ is a nondecreasing sequence of non-negative random variables whose\
    \ distribution depends upon $g$ and on the evolution of the other bandits.\n\n\
    Under $g$ the rewards in $\\mathscr{R}$ continue defined by\n\n```\n$R_f(B) =\
    \ E \\sum_{t_i < \\tau} a^{f_i}r_f(t_i). \\quad \\quad \\quad \\quadquad (4.7)$\n\
    ```\n\nWe shall prove a lemma (Lemma 4.5) by which compare (4.6) and (4.7). The\
