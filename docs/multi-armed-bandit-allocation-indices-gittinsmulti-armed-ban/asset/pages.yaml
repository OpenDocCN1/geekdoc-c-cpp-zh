  md: "# MULTI-ARMED BANDIT ALLOCATION INDICES\n\nThe $X_i$ for a given sampling process\
    \ we suppose to be drawn from a distribution with an unknown, vector-valued parameter\
    \ $\theta$ belonging to a family $\\mathscr{D}$ of distributions for which a density\
    \ $f(\\cdot|\theta)$ exists with respect to fixed probability space $(R, \\mathcal{F}_1,\
    \ \\mu_1)$. Adopting the Bayesian setup (e.g. Barra, 1981), $\theta$ has a prior\
    \ density $\\pi_0$ with respect to a probability space $(R', \\mathcal{F}_2, \\\
    mu_2)$, and $f(x)$ is $\\mathcal{F}_2$-measurable for all $x \\in \\mathbb{R}$.\
    \ Thus the joint density of $\theta$ and $X_1$ is $\\pi_0(\theta)f(x|\theta)$,\
    \ and it follows that $\theta$ has a density with respect to $(R', \\mathcal{F}_2,\
    \ \\mu_2)$ conditional on $X_1$ taking the value $x_1$, which may be written as\n\
    \n```\n$$\\pi_1(\\theta|x_1) = \\frac{\\pi_0(\\theta)f(x_1|\\theta)}{\\int \\\
    pi_0(\\phi)f(x_1|\\phi)d\\mu_2(\\phi)}$\n```\n\nThe density $\\pi_1$ is termed\
    \ the *posterior* for $\theta$ after observing $X_1$ to take the value $x_1$.\n\
    \nSimilarly, after observing $X_i$ to take the values $x_i$ ($i=1, 2, \\dots,\
    \ n$), the posterior density for $\theta$ is\n\n```\n$$\\pi_n(\\theta|x_1, \\\
    dots, x_n) = \\frac{\\pi_{n-1}(\\theta|x_1, \\dots, x_{n-1}) f(x_n|\\theta)}{\\\
    int \\pi_{n-1}(\\phi|x_1, \\dots, x_{n-1}) f(\\phi)d\\mu_2(\\phi)} = \\frac{\\\
    pi_0(\\theta)\\prod_{i=1}^n f(x_i|\\theta)}{\\int \\pi_0(\\phi)\\prod_{i=1}^n\
    \ f(x_i|\\phi)d\\mu_2(\\phi)} \\quad (7.1)$\n```\n\nThe reader should not be alarmed\
    \ by the appearance of the measures $\\mu_1$ and $\\mu_2$ in this account. We\
    \ shall be concerned only with densities with respect to Lebesgue measure, counting\
    \ measure and simple combinations of these two measures. These are the usual densities\
    \ for continuous, discrete or mixed distributions, respectively. Equation (7.1)\
    \ is sometimes written in the form\n\n```\n$$\\pi_n(\\theta|x_n) \\propto \\pi_0(\\\
    theta)\\prod_{i=1}^n f(x_i|\\theta)$\n```\n\nthe proportionality sign $\\propto$\
    \ indicating that the $\\mathscr{F}_n$-measurable function of $x_n = (x_1, x_2,\
    \ \\dots, x_n)$ has been omitted, which one may be determined from the fact that\
    \ $\\pi_n d\\mu_2=1$. This Result is sometimes called the generalized Bayes' theorem.\n\
    \nTwo assumptions will be made for the sake of computational tractability. They\
    \ concern the important statistic of sufficiency. For present purposes, a *statistic*\
    \ is any real-valued function defined for every positive integer $n$ as a $\\\
    mathscr{F}_n$-measurable function of $X_n = (X_1, \\dots, X_n)$. The statistics\
    \ $u_1, \\dots, u_m$ are a sufficient set of statistics for random samples of\
    \ size $n$ if the distribution of $X_n$ conditional on $u_1(X_n), \\dots, u_m(X_n)$\
    \ does not depend on $\theta$. The following equivalent condition for sufficiency\
    \ is due to Neyman (e.g. see Barra, 1981)."
