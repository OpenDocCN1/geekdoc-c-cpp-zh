  md: "# MULTI-ARMED BANDIT ALLOCATION INDICES\n\nA different proof of this theorem,\
    \ which uses the machinery of freezing and promotion rules in Section 4.5, can\
    \ be found in the first edition of this book. It uses some ideas that are similar\
    \ to those in the proof above, such as the analysis in the penultimate paragraph.\
    \ However, it involves rearranging portions of discounted rewards, the algebraic\
    \ details are more complicated than in the analysis of the expected prevails that\
    \ are paid in an undiscounted setting.\n\nWe conclude this section by giving a\
    \ brief presentation of the means by which Whittle (1980) has also proved Theorem\
    \ 4.3. The proof is elegant and provides valuable insight.\n\nWhittle's proof\
    \ of Theorem 4.3. The key idea is to give a formula for the value function. Suppose\
    \ that we add to $S_1, \\dots, S_n$ a standard bandit $S(\\lambda)$. Assuming\
    \ that Theorem 4.3 is true, then we know that the decision proceeds by continuing\
    \ one or the other of the $S_i$ until all have indices less than $\\lambda$. From\
    \ this onwards $S(\\lambda)$ is continued. For this, Whittle calls the standard\
    \ process a retirement option, if it is ever optimal to choose this option it\
    \ must mean optimal to the total reward thereafter will be $m=\\lambda/(1-a)$.\
    \ Suppose for $S_i$ first falls below $\\lambda$ when it has time $\\tau_i$. Then\
    \ our candidate for the value function can\n\n```\n$$\\Phi(x,m) = E(R+a^{\\tau_1+\\\
    dots+\\tau_n}|m)$\n```\n\nwhere $x=(x_1, \\dots, x_n)$ is the vector of initial\
    \ states of $S_1, \\dots, S_n$, and $R$ represents the discounted sum of rewards\
    \ obtained from $S_1, \\dots, S_n$ under the index policy up to time $\\tau=\t\
    au_1+\\dots+\\tau_n$. If $\\Phi(x,m)$ is differentiable,\n\n```\n$$\\frac{\\partial}{\\\
    partial m}\\Phi(x,m) = E(a^{\\tau_1+\\dots+\\tau_n}|x) = \\prod_{i=1}^n \\frac{\\\
    partial}{\\partial m}\\Phi_i(x_i,m)$\n```\n\nwhere $\\Phi(x,m)$ is the value of\
    \ the SFAS consisting of just $S_1$ and $S_1((1-a)m)$. Assume, without loss of\
    \ generality, that rewards accruing from $S_1, \\dots, S_n$ are non-negative and\
    \ bounded above by $(1-a)M$. Then by integration, and $\\Phi(x,M)=(1-a)M$, we\
    \ have\n\n```\n$$\\Phi(x,0)=(1-a)M-\\int_0^M \\prod \\frac{\\partial}{\\partial\
    \ m}\\Phi_i(x_i,m)dm.(4.2)$\n```\n\nThe argument is true; however, taking (4.2)\
    \ to define $\\Phi(x,0)$ we have a candidate value function for the SFAS consisting\
    \ of just $S_1,\\dots,S_n$. It is well defined because each $\\Phi_i(x_i,m)$ is\
    \ a convex function of $m$ (being the maximum over stopping times of a linear\
