    # # Multi-population random sampling (calculations)


    # ## 8.1 Introduction


    This chapter sets out in some detail the methods by which the general principles
    described in Chapter 7 have been used to calculate Gittins indices. This is done
    in turn for reward processes based on a normal distribution with unknown variance;
    a normal distribution with unknown variance; a {0, 1} distribution and an exponential
    distribution; for undiscounted target processes based on an exponential distribution;
    and on an exponential distribution together with an atom of probability at the
    origin. The results of these calculations are also described for each case except
    the Bernoulli/exponential target process, for which some results are given by
    Jones (1975). Two approximations which should prove useful are given in Section
    8.7.


