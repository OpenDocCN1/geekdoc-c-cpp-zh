    # 2.8 Continuous-time bandit processes


    Thus far, we have placed our discussion in discrete time, and we have assumed
    that all bandits move on countable state spaces. The second of these assumptions
    can be relaxed by saying that the state space, $\Theta$, should be a (Borel) subset
    of some (complete separable metric) space, that is equipped with a $\sigma$-algebra
    $\mathcal{X}$ of subsets of which includes every subset consisting of just one
    element of $\Theta$. Any further functions that we introduce to our model and
    which depend on states must be measurable with respect to $\mathcal{X}$. The last
    two sentences need not worry readers who are unfamiliar with these notions, since
    in most interesting bandit problems the state space is either countable, or some
    subset of Euclidean space (such as $\mathbb{R}^+$).


    In continuous time, a FABP is to be a type of semi-Markov decision process. This
    is a generalization of a Markov decision process in which the distribution of
    the time that elapses between two successive states $x$ and $y$ depends on $x,
    y$ and the decision action $(u \in \Omega)$ taken in state $x$.


    For a SFABP which bandits are semi-Markov processes and have general state spaces,
    this means that if $t_j$ is the $j$th decision time after $t_0=0$ is a decision
    time, that at this time $t_j$ bandit $B_i$ is in state $x_i$ and is chosen for
    continuation. Rewarded $r_i(x)$ is immediately obtained. The next decision time
    is $t_{j+1} = t_j + T$. At this time a bandit is to be obtained $B_i$, or some
    other state. At time $t_{j+1}$ the state of $B_i$ is $y$, where $y$ lies in set
    $\mathcal{X}^-$ and $\mathcal{X}^+$-measurable, but otherwise can be quite general.
    The probability of the event $\{T \le s\}$ is $F_i(x, y)$. The functions $r_i(\cdot),
    P_i(A|\cdot)$ and $F_i(s|\cdot, y)$ can be quite general.


    In Section 2.4 we made certain claims about the value function and solution of
    the dynamic programming equation, which are true under the assumptions of strict
    continuity, bounded rewards and a finite control. In the case of a semi-Markov
    decision process we need in addition a small technical condition that an infinite
    number of transitions does not occur in finite time. This is guaranteed if there
    exist positive $\delta$ and $\epsilon$ such that, whatever the state of the bandit
    that it is continued, we have $P(T > \delta) > \epsilon$ (see, for example, Ross,
    1970, p. 157, or Puterman, 2005, Section 11.1).


    Condition A There exist $\delta$ (>0) and $\epsilon$ (>0) such that


    > $\int(\delta, \infty) [x, y]P(dy|x, u) > \epsilon \quad (x \in \Theta, u \in
    \Omega(x))$


    where $(\delta, \infty)$ denotes the unbounded interval to the right of.


    Our assumption that rewards can also be replaced by a weaker condition. Let $x(0)$
    be the state of a semi-Markov decision process $D$ at time $t$, $x_g(t)$ the state
    at time $t$ if policy $g$ is followed, and $R_g(D,x)$ the expected discounted
    reward under policy $g$ when $x(0)=x$. Let $[t]$ denote the first decision time
    after time $t$. .'
