    # 3.2 Jobs


    A bandit process which yields a positive reward at a random time, and no other
    rewards, positive or negative, is termed a job. A simple family of such bandit
    processes defines a version of the well-known problem of scheduling a number of
    jobs on a single machine, such as we have already met in Problems 1 and Chapter
    4. Many papers on scheduling problems have been written over the past 50 years.
    For a review of the field the reader is referred in particular to the books by
    Conway, Maxwell and Miller (1967), Baker (1974), Coffman (1976), and the conference
    proceedings edited by Dempster, Lenstra and Rinnooy Kan (1982). French (1982)
    gives a convenient introduction. An excellent reference for problems in scheduling
    is the book of Pinedo (2008).


    A natural extension of the notion of a job is to allow costs and rewards to occur
    before completion of the job, to a state (or set of states) C representing completion.
    Selection of an uncompleted job at each decision time until all the jobs have
    been completed be forced by supposing that a job in state C behaves like a standard
    bandit process with parameter -M, where M is large, this means it can only be
    optimal to select a job for continuation if every job has been completed. Jobs
    of this kind will be termed generalized jobs to distinguish these from the more
    elaborate jobs of the opening paragraph of this section.


    Restrictions of the first ''Job A must be completed before job B may be started''
    are precedence constraints. They are present in many real-life scheduling problems.
    Resource allocation to jobs, including generalized jobs, under precedence constraints
    is one of the themes of Chapter 4.


