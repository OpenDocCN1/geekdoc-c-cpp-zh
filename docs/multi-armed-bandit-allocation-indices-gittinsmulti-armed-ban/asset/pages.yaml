    This chapter is about families of alternative superprocesses, and families of
    alternative bandit processes that are not simple. The notion of a superprocess
    is introduced in Section 4.2. This is a generalization of a bandit process in
    which, if superprocess $S_i$ is chosen for continuation, the control with which
    to continue it must be from a set which may have more than one element. In Section
    4.3 we prove an index theorem for a simple family of alternative superprocesses.
    The proof uses the idea from Section 2.8 (in which the index is given an interpretation
