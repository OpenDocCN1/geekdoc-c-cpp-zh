  md: "# SUPERPROCESSES, PRECEDENCE CONSTRAINTS AND ARRIVALS 91\n\nWe are now ready\
    \ to present another proof of Theorem 2.1. The emphasis in this proof is on the\
    \ characterization of the optimal policy as a modified forwards induction policy.\
    \ So let us recapit it that way.\n\n**Theorem 2.1** The classes of index policies\
    \ and modified induction policies, and optimal policies are identical for a simple\
    \ family $\\mathscr{F}$ of alternative bandit processes, $B_1, \\dots, B_n$.\n\
    \n*Proof.* We know from Lemma 2.2 that, for a SFABP, the classes of index policies\
    \ and modified forwards policies are the same. So we show that given any policy\
    \ $g$, and a modified induction policy $\\pi$, there exists a policy which is\
    \ as good as $g$ and starts with the first stage of $\\pi$.\n\nSuppose that the\
    \ first stage of $\\pi$ consists of applying the continuation control to $B=B_1$\
    \ until $\tau$. Then, we are assuming that $B$ is the bandit of greatest index,\
    \ and $\tau$ is a stopping time such that $v(B) = R_\tau(B)/W_\tau(B)$. Let us\
    \ denote the set of rewards that accrue from $B$ during this stage of $\\pi$ by\
    \ $\\mathscr{R}$.\n\nUnder $\\pi$, the rewards in $\\mathscr{R}$ accrue at $t$\
    \ (to a payoff) way\n\n```\n$R_\tau(B) = E \\sum_{t_i < \\tau} a^{f_i}r(t_i) =\
    \ W_\tau(B)v(B), \\quad (4.6)$\n```\n\nwhere on the $(i+1)$th occasion that the\
    \ continuation control is applied to $B$ it has process time $t_i$, and reward\
