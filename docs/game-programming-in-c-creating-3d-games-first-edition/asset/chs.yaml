  \n点击此处查看代码图片\n```cpp\n// 矩阵色板\nMatrixPalette mPalette;\n// 当前播放的动画\nAnimation* mAnimation;\n\
  // 动画播放率 (1.0 是正常速度)\nfloat mAnimPlayRate;\n\n![Image 1361](img/index-821_1.jpg)\n\
  ![Image 1362](img/index-821_2.jpg)\n// 动画中的当前时间\nfloat mAnimTime;\n```\n\n接下来，你创建一个\
  \ `ComputeMatrixPalette` 函数，如 列表 12.9 所示，它获取全局逆绑定姿态矩阵以及全局当前姿态矩阵。然后对于每个骨节点，你将这些矩阵相乘，得到矩阵色板条目。\n\
  \n**列表 12.9** `ComputeMatrixPalette` 实现\n\n点击此处查看代码图片\n```cpp\nvoid SkeletalMeshComponent::ComputeMatrixPalette()\n\
  {\n    const std::vector<Matrix4>& globalInvBindPoses = mSkeleton->GetGlobalInvBindPoses();\n\
  \    std::vector<Matrix4> currentPoses;\n    mAnimation->GetGlobalPoseAtTime(currentPoses,\
  \ mSkeleton, mAnimTime);\n\n    // 为每个骨节点设置色板\n    for (size_t i = 0; i < mSkeleton->GetNumBones();\
  \ i++)\n    {\n        ![Image 1363](img/index-822_1.jpg)\n        ![Image 1364](img/index-822_2.jpg)\n\
  \        // 全局逆绑定姿态矩阵乘以当前姿态矩阵\n        mPalette.mEntry[i] = globalInvBindPoses[i]\
  \ * currentPoses[i];\n    }\n}\n```\n\n最后，你创建一个 `PlayAnimation` 函数，接收一个 `Animation`\
  \ 指针以及动画的播放率。这会设置新的成员变量，调用 `ComputeMatrixPalette` 并返回动画的持续时间：\n\n点击此处查看代码图片\n```cpp\n\
  float SkeletalMeshComponent::PlayAnimation(const Animation* anim, float playRate)\n\
  {\n    mAnimation = anim;\n    mAnimTime = 0.0f;\n    mAnimPlayRate = playRate;\n\
  \    if (!mAnimation) { return 0.0f; }\n    ComputeMatrixPalette();\n    return\
  \ mAnimation->GetDuration();\n}\n```\n![Image 1365](img/index-823_1.jpg)\n![Image\
  \ 1366](img/index-823_2.jpg)\n![Image 1367](img/index-823_3.jpg)\n![Image 1368](img/index-823_4.jpg)\n\
  \n现在你可以加载全局逆绑定姿态矩阵以及全局当前姿态矩阵。然后对于每个骨节点，你将这些矩阵相乘得到矩阵色板。\n\n#### 蒙皮顶点色器 (The Skinning\
  \ Vertex Shader)\n\n回顾 第五章，由于并不是每个骨节点都有轨道，`GetGlobalPoseAtTime` 必须首先检查该骨节点是否有轨道。如果没有，该骨节点的局部姿态矩阵将保持为单位矩阵。因此，为了让骨骼工作，你需要在\
  \ `Skinned.vert` 中添加一个新的 uniform 声明：\n\n```glsl\nuniform mat4 uMatrixPalette[96];\n\
  ```\n\n一旦顶点色器有了矩阵色板，你就可以根据骨骼权重来混合不同的位置。这将在将顶点转换到裁剪空间之前完成。\n\n**列表 12.10** `Skinned.vert`\
  \ 主函数\n\n点击此处查看代码图片\n```glsl\nvoid main()\n{\n    // 将位置转换为齐次坐标\n    vec4 pos =\
  \ vec4(inPosition, 1.0);\n\n    // 蒙皮位置\n    vec4 skinnedPos = pos * uMatrixPalette[inBones.x];\n\
  \    skinnedPos += pos * uMatrixPalette[inBones.y];\n    skinnedPos += pos * uMatrixPalette[inBones.z];\n\
  \    skinnedPos += pos * uMatrixPalette[inBones.w];\n\n    // 将位置转换到世界空间\n    skinnedPos\
  \ = skinnedPos * uTransform;\n\n    // 保存世界位置\n    fragWorldPos = skinnedPos.xyz;\n\
  \n    // 转换到裁剪空间\n    gl_Position = skinnedPos * uViewProj;\n\n    // 蒙皮法线\n   \
  \ vec4 skinnedNormal = vec4(inNormal, 0.0);\n    skinnedNormal = skinnedNormal *\
  \ uMatrixPalette[inBones.x];\n    skinnedNormal += skinnedNormal * uMatrixPalette[inBones.y];\n\
  \    skinnedNormal += skinnedNormal * uMatrixPalette[inBones.z];\n    skinnedNormal\
  \ += skinnedNormal * uMatrixPalette[inBones.w];\n\n    // 将法线转换到世界空间（w = 0）\n  \
  \  fragNormal = (skinnedNormal * uTransform).xyz;\n\n    // 将纹理坐标传递给片元色器\n    fragTexCoord\
  \ = inTexCoord;\n}\n```\n\n同样，你还需要对顶点法线进行蒙皮；如果不这样做，角色动画时的光照效果将是不正确的。\n\n![Image\
  \ 1371](img/index-826_1.jpg)\n![Image 1372](img/index-826_2.jpg)\n\n然后，回到 `SkeletalMeshComponent::Draw`\
  \ 的 C++ 代码中，你需要确保 `SkeletalMeshComponent` 将矩阵色板数据拷贝到 GPU：\n\n```cpp\nshader->SetMatrixUniforms(\"\
  uMatrixPalette\", &mPalette.mEntry[0], MAX_SKELETON_BONES);\n```\n\n现在你已经准备好绘制动画的第一帧。图\
  \ 12.5 显示了 `CatActionIdle.gpanim` 动画的第一帧。本章及其他动画也由 Pior Oberson 创作。\n\n![Image 1373](img/index-827_1.jpg)\n\
  \n\n\n\n\n**图 12.5** “待机动作”动画第一帧中的一个角色\n\n### 更新动画\n\n获取一个可运行的骨骼动画系统的最后一步是根据增量时间（delta\
  \ time）每帧更新动画。你需要修改 `Animation` 类，使其能够根据动画的时间正确获取姿态（pose），并且你需要在 `SkeletalMeshComponent`\
  \ 中添加一个 `Update` 函数。\n\n关于列表中的 `GetGlobalPoseAtTime` 函数，请参考索引\n\n12.11，你不能再将其硬编码为仅使用动画的第\
  \ 0 帧。相反，根据每帧的持续时间和当前时间，计算出当前时间之前的帧（`frame`）和当前时间之后的帧（`nextFrame`）。然后，你计算出一个从 `0.0`\
  \ 到 `1.0` 的值，用于指定你处于两个帧之间的精确位置（`pct`）。这样，你就可以考虑到动画帧率和游戏帧率不同的问题。\n\n一旦有了这个小数，计算全局姿态的方法与之前基本相同。然而，现在你不再直接使用某一帧的\
  \ `BoneTransform`，而是在 `frame` 和 `nextFrame` 的骨骼变换之间进行插值，以计算出正确的中间姿态。\n\n**列表 12.11**\
  \ `GetGlobalPoseAtTime` 的最终版本\n\n**点击此处查看代码图片**\n\n```cpp\nvoid Animation::GetGlobalPoseAtTime(std::vector<Matrix4>&\
  \ outPoses, const Skeleton* inSkeleton, float inTime) const\n{\n    if (outPoses.size()\
  \ != mNumBones)\n    {\n        outPoses.resize(mNumBones);\n    }\n\n    // 计算当前帧索引和下一帧\n\
  \    // (这假设 inTime 局限于 [0, AnimDuration] 之间)\n    size_t frame = static_cast<size_t>(inTime\
  \ / mFrameDuration); size_t nextFrame = frame + 1;\n\n    // 计算帧和下一帧之间的小数值\n   \
  \ float pct = inTime / mFrameDuration - frame;\n\n    // 设置根节点的姿态\n    if (mTracks[0].size()\
  \ > 0)\n    {\n        // 在当前帧的姿态和下一帧之间之间进行插值\n        BoneTransform interp = BoneTransform::Interpolate(mTracks[0][frame],\
  \ mTracks[0][nextFrame], pct);\n        outPoses[0] = interp.ToMatrix();\n    }\n\
  \    else\n    {\n        outPoses[0] = Matrix4::Identity;\n    }\n\n    const std::vector<Skeleton::Bone>&\
  \ bones = inSkeleton->GetBones();\n\n    // 现在设置其余骨骼的姿态\n    for (size_t bone =\
  \ 1; bone < mNumBones; bone++)\n    {\n        ![Image 1374](img/index-830_1.jpg)\n\
  \        ![Image 1375](img/index-830_2.jpg)\n        Matrix4 localMat; // (默认为单位矩阵)\n\
  \        if (mTracks[bone].size() > 0)\n        {\n            BoneTransform interp\
  \ =\n            BoneTransform::Interpolate(mTracks[bone][frame],\n            mTracks[bone][nextFrame],\
  \ pct);\n            localMat = interp.ToMatrix();\n        }\n        outPoses[bone]\
  \ = localMat * outPoses[bones[bone].mParent];\n    }\n}\n```\n\n然后，在 `SkeletalMeshComponent`\
  \ 中，你添加一个 `Update` 函数：\n\n**点击此处查看代码图片**\n\n```cpp\nvoid SkeletalMeshComponent::Update(float\
  \ deltaTime)\n{\n    if (mAnimation && mSkeleton)\n    {\n        mAnimTime += deltaTime\
  \ * mAnimPlayRate;\n        ![Image 1376](img/index-831_1.jpg)\n        ![Image\
  \ 1377](img/index-831_2.jpg)\n        // 如果超过了持续时间，则动画时间循环\n        while (mAnimTime\
  \ > mAnimation->GetDuration())\n        { mAnimTime -= mAnimation->GetDuration();\
  \ }\n        // 重新计算矩阵调色板\n        ComputeMatrixPalette();\n    }\n}\n```\n\n在这里，你做的只是根据增量时间和动画播放速率更新\
  \ `mAnimTime`。你还会在动画循环时让 `mAnimTime` 循环回位。即使在从动画的最后一帧过渡到第一帧时，这种方法也是有效的，因为正如前面提到的，动画数据在轨迹的末尾重复了第一帧。\n\
  \n最后，`Update` 调用 `ComputeMatrixPalette`。该函数使用 `GetGlobalPoseAtTime` 来计算当前帧的新矩阵调色板。\n\
  \n由于 `SkeletalMeshComponent` 是一个组件，拥有它的 Actor 每帧都会调用 `Update`。然后在此游戏循环的“生成输出”阶段，`SkeletalMeshComponent`\
  \ 照常使用这个新的矩阵调色板进行绘制，这意味着动画现在会在屏幕上更新了！\n\n### 游戏项目\n\n本章的游戏项目实现了本文描述的骨骼动画。它包含了 `SkeletalMeshComponent`、`Animation`\
  \ 和 `Skeleton` 类，以及蒙皮顶点着色器。代码可以在书籍的 GitHub 仓库中找到，位于 `Chapter12` 目录下。在 Windows 中打开\
  \ `Chapter12-windows.sln`，在 Mac 中打开 `Chapter12-mac.xcodeproj`。\n\n本章的游戏项目回顾了第 9\
  \ 章中提到的相机。\n\n### 总结\n\n本章对骨骼动画进行了全面的概述。在骨骼动画中，角色拥有一个会动画的刚性骨骼，顶点随之变形。骨骼包含一个层次结构，除了根节点外的每个骨骼都有一个父节点。绑定姿态（bind\
  \ pose）是任何动画之前的初始姿态。你可以为每个骨骼存储一个局部变换，它描述了骨骼相对于父节点的位置和朝态。全局变换则描述了骨骼相对于对象空间的位置和朝态。你可以通过乘以父节点的全局姿态将局部变换转换为全局变换。根节点的局部姿态和全局姿态是相同的。逆绑定姿态矩阵是每个骨骼全局姿态矩阵的逆。该矩阵将点从绑定空间的对象空间变换到骨骼坐标空间。动画是随时间播放的姿态序列。与绑定姿态一样，你可以为当前姿态构造全局姿态。矩阵调色板（matrix\
  \ palette）存储了每个骨骼的逆绑定姿态矩阵与当前姿态矩阵的乘积。在计算蒙皮顶点的对象空间位置时，使用了影响该顶点的骨骼调色板项。\n\n### 延伸阅读\n\
  \nJason Gregory 深入探讨了动画的高级主题，例如动画混合、动画数据压缩和逆动力学。\n\nGregory, Jason. *Game Engine\
  \ Architecture,* 2nd edition. Boca Raton: CRC Press, 2014.\n\n### 练习\n\n在本章的练习中，你将为动画系统添加功能。在练习\
  \ 12.1 中，你添加获取当前姿态骨骼位置的支持，在练习 12.2 中，你为为两个动画之间的过渡添加混合。\n\n### 练习 12.1\n\n在动画播放时获取骨骼的位置对游戏非常有用。例如，如果角色手里拿着一个物体，你需要知道随着动画变化，骨骼的位置。否则，角色将无法正确持有该物品！\n\
  \n由于 `SkeletalMeshComponent` 知道动画的进度，因此该系统的代码需要在这里。首先，作为成员变量添加一个 `std::vector` 来存储当前姿态矩阵。然后，当代码调用\
  \ `GetGlobalPoseAtTime` 时，将当前姿态矩阵保存到该成员变量中。\n\n接下来，添加一个名为 `GetBonePosition` 的函数，\n\
  \n\n\n\n接收骨骼名称并返回该骨骼在当前姿态下的对象空间位置。这比听起来要简单，因为如果你将一个零向量乘以骨骼的当前姿态矩阵，就会得到该骨骼在当前姿态下的对象空间位置。之所以有效，是因为这里的零向量意味着它恰好位于骨骼局部空间的原点，然后当前姿态矩阵会将其转换回对象空间。\n\
  \n### 练习 12.2\n\n目前，`SkeletalMeshComponent::PlayAnimation` 会立即切换到新动画。这看起来并不够精细，你可以通过为动画添加混合（blending）来解决这个问题。首先，为\
  \ `PlayAnimation` 添加一个可选的混合时间参数，表示混合的持续时间。要在多个动画之间进行混合，你必须单独跟踪每个动画和动画时间。如果你将混合限制为仅两个动画，那么只需要复制那些成员变量。\n\
  \n然后，为了在动画之间进行混合，当你调用 `GetGlobalPoseAtTime` 时，需要对两个活跃动画都执行此操作。你需要获取每个动画中每个骨骼的变换，插值这些骨骼变换以获得最终变换，然后将它们转换为姿态矩阵以获得混合后的当前姿态。\n\
  \n## 第 13 章：高级图形\n\n游戏使用了许多不同的图形技术，这就是为什么关于这个主题有整卷的书和系列丛。本章探索了一些高级图形概念：如何提高纹理质量、渲染到纹理以及一种不同的场景光照方法，称为*延迟着色*（deferred\
  \ shading）。\n\n### 提高纹理质量\n\n回想第 5 章，“OpenGL，，图像只是像素的二维网格，这些这些“纹理像素”中的每一个被称为 `texel`（纹素元素）。观察放大效果的另一种方式是，当墙壁纹理在屏幕上变大时，每个\
  \ `texel` 在屏幕上的尺寸也变大。换句话说，纹理中的 `texel` 与屏幕像素之间的比例减小。\n\n例如，如果每 1 个 `texel` 对应屏幕上的\
  \ 2 个像素，那么比例就是 1:2。**纹素密度**（Texel density）就是屏幕像素与 `texels` 之间的这种比例。理想情况下，你希望纹素密度尽可能接近\
  \ 1:1。随着密度的降低，图像质量下降。\n\n最终，纹理看起来要么太像素化（如果使用最近邻过滤），要么太模糊（如果使用双线性过滤）。\n\n如果纹素密度过高，这意味着屏幕上的每个像素都对应纹理中的多个\
  \ `texels`。\n\n![Image 1379](img/index-839_1.jpg)\n\n例如，10:1 的 `texel` 密度意味着屏幕上的每个像素对应\
  \ 10 个 `texels`。最终，这些像素中的每一个都需要选择一种颜色来显示。这意味着在屏幕上查看时，纹理似乎会有 `texels` 丢失；这被称为**采样伪影**（sampling\
  \ artifact）。在图形学中，**伪影**（artifact）一词是指由于图形算法导致的图形故障。\n\n图 13.1 说明了由不同 `texel` 密度引起的不同图形伪影。图\
  \ 13.1(a)显示了大约 1:1 纹素密度下的星形纹理，这意味着纹理在屏幕上显示的比例与原始图像文件完全相同。图 13.1(b)显示了 1:5 纹素密度下的星的一部分，这使得边缘看起来很模糊。最后，图\
  \ 13.1(c)](#index_split_005.html_p839)显示了 5:1 纹素密度的纹理，这会导致星的边缘消失；为了让图像更容易，该图显示的尺寸比实际尺寸大。\n\
  \n**图 13.1** 在不同纹素密度下进行双线性过滤的星形纹理：(a) 1:1，(b) 1:5，(c) 5:1\n\n#### 纹理采样回顾\n\n为了理解为什么高\
  \ `texel` 密度会导致 `texels` 似乎丢失，我们需要更仔细地观察纹理采样是如何工作的。回想纹理使用 UV 坐标（称为纹理坐标），范围从左上角的\
  \ (0, 0) 到右下角的 (1, 1)。\n\n假设你有一个由 4×4 `texels` 组成的正方形纹理。在这种情况下，左上角 `texel` 的中心 UV\
  \ 坐标为 (0.125, 0.125)。同样，纹理的正中心对应于 UV 坐标 (0.5, 0.5)，如图 13.2 所示。\n\n现在假设你有一个 1:2 的纹素密度，并且从\
  \ (0, 0) 绘制到 (0.5, 0.5) 的纹理。这意味着左上角的像素放大了一倍。例如，如果每 1 个 `texel` 对应屏幕上的 2 个像素，那么比例就是\
  \ 1:2。\n\n在**最近邻过滤**中，你只需选择距离该 UV 坐标最近的 `texel`。因此，因为 (0.625, 0.625) 距离 (0.125,\
  \ 0.125) 处的 `texel` 最近，最近邻过滤选择了该像素。更直接地说，增大纹理尺寸会让图像看起来有像素感。\n\n在**双线性过滤**中，你找到距离\
  \ UV 最近的四个 `texels`，该坐标的采样颜色是这四个 `texels` 的加权平均值。这使得图像放大时过渡更平滑，尽管放大过度时会显得模糊。图 13.2(c)说明了双线性过滤。注意相同颜色的像素减少了，但颜色混合在一起了。\n\
  \n**图 13.2** (a) 原始纹理；2 倍放大后的纹理，采用 (b) 最近邻过滤和 (c) 双线性过滤\n\n为了理解如何在双线性过滤中计算加权平均值，记住你可以将颜色视为一个三维值，并像插值其他值一样对颜色进行插值。将双线性插值分解为两个独立轴的插值。\n\
  \n考虑一个靠近四个 `texels` *A、B、C、D* 的点 *P*，如图 13.3 所示。首先，你在 u 方向上计算 *A* 和 *B* 颜色之间的插值，同样，在\
  \ u 方向上计算 *C* 和 *D* 之间的插值。这得到了点 *R* 和 *S* 处的颜色，如图 13.3 所示。最后，你在 v 方向上对 *R* 和 *S*\
  \ 的颜色进行插值，从而得到 *P* 的最终颜色。\n\n**图 13.3** P 相对于纹素 A、B、C、D 的双线性插值\n\n给定 *A、B、C、D* 和\
  \ *P* 的纹理坐标，你可以可以使用计算此双线性插值\n\n\n\n遵循以下方程：\n\n在这些方程中，`uFactor` 决定了 u 分量方向的权重，`vFactor`\
  \ 决定了 v 分量方向的权重。你使用这些权重首先计算 `R` 和 `S` 处的颜色，最后计算 `P` 处的颜色。\n\n如果纹理启用了双线性过滤，这些双线性过滤计算将自动在显卡上完成。尽管对于每个采样纹理的片元来说，计算量很大，但现代图形硬件可以每秒快速执行数百万次此类计算。\n\
  \n正如你所看到的，过度放大纹理会导致图像呈现像素化或模糊，具体取决于所使用的技术。缩小纹理尺寸的问题在于没有足够的纹理样本来维持存储在纹理中的所有信息。回到示例纹理，如果你将图像尺寸缩小一半，过滤将丢失纹理中的细节，如图\
  \ 13.4(b)\n\n**图 13.4** (a) 原始纹理；(b) 双线性过滤至一半尺寸的纹理\n\n#### 多级像素映射 (Mipmapping)\n\
  \n在 `mipmapping` 中，并不是使用单个源纹理，而是生成一系列额外的纹理，称为 `mipmaps`，它们的分辨率低于源纹理。例如，如果源纹理的分率为\
  \ 256×256，你可以生成 128×128、64×64 和 32×32 的 mipmaps。然后，当需要在屏幕上绘制纹理时，图形硬件可以选择纹素密度接近 1:1\
  \ 的 mipmap 纹理。虽然当你将纹理放大到高于原始分辨率时，`mipmapping` 不能提高纹理质量，但在缩小纹理尺寸时，它极大提高了质量。\n\n质量提高的主要原因是你只需要生成一次\
  \ mipmap 纹理——在纹理加载时。这意味着你可以使用更复杂的算法来生成高质量的 mipmaps（例如使用盒形过滤器）。因此，以接近 1:1 的纹素密度从这些高质量的\
  \ mipmaps 中采样，其效果将比从具有较高纹素密度（如 4:1）的原始纹理中采样要好得多。图 13.5 展示了星形纹理的示例 mipmaps。分辨率最高的纹理是\
  \ 256×256 的原始纹理，其余纹理是自动生成的 mipmaps。注意即使是最小的 mipmap 也保持了纹理的边界，而之前当你直接以低纹素密度从 256×256\
  \ 纹理采样时，边界是缺失的。\n\n![Image 1383](img/index-846_1.jpg)\n\n**图 13.5** 带有三个 mipmap\
  \ 纹理的星形纹理\n\n纹理采样可以使用最近邻过滤或双线性过滤，应用 mipmaps 也有两种不同的方法。在最近邻 `mipmapping` 中，你只需选择纹素密度最接近\
  \ 1:1 的 mipmap。尽管这种方法在很多情况下效果良好，但在某些情况下（例如地板纹理），它可能会在 mipmap 纹理（或 `mip level`）变化的边界处产生带带。在三线性\
  \ `filtering` 中，你分别对两个接近 1:1 纹素密度的 mip level 进行采样（使用双线性过滤），最终颜色是这两个采样之间的混合。这是\n\n\
  ![Image 1384](img/index-847_1.jpg)\n\n![Image 1385](img/index-847_2.jpg)\n\n之所以被称为“三线性”，是因为它现在是在三个维度上进行混合——纹理采样的\
  \ UV 坐标以及 mip-level 的混合。\n\n在 OpenGL 中为纹理启用 mipmapping 是非常简单的。在使用第 5 章 中的代码加载纹理后，你只需添加对\
  \ `glGenerateMipmap` 的调用即可：\n\n**点击此处查看代码图像**\n\n```\nglGenerateMipmap(GL_TEXTURE_2D);\n\
  ```\n\n这会使用高质量过滤算法自动生成相应的 mip levels。在设置纹理参数时，你可以同时设置缩小过滤（当纹理在屏幕上变小时发生的情况）和放大过滤（当纹理在屏幕上变大时发生的情况）。这就是\
  \ `GL_TEXTURE_MIN_FILTER` 和 `GL_TEXTURE_MAG_FILTER` 参数所引用的。在生成 mipmaps 后，你再更改纹理的缩小过滤参数以使用\
  \ mipmapping。要执行三线性过滤，你使用这些纹理参数：\n\n**点击此处查看代码图像**\n\n```\nglTexParameteri(GL_TEXTURE_2D,\
  \ GL_TEXTURE_MIN_FILTER, GL_LINEAR_MIPMAP_LINEAR);\n```\n\n![Image 1386](img/index-848_1.jpg)\n\
  \n![Image 1387](img/index-848_2.jpg)\n\n```\nglTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MAG_FILTER,\
  \ GL_LINEAR);\n```\n\nmipmapping 的另一个优势是由于纹理缓存的工作方式提升了性能。就像 CPU 缓存一样，显卡也有内存缓存。较小的\
  \ mip level 对缓存友好，这意味着整体性能得到了提升。\n\n#### 各向异性过滤 (Anisotropic Filtering)\n\n尽管 mipmapping\
  \ 极大减少了大多数情况下的采样伪影，但倾斜角度的纹理会显得模糊。这在纹纹理上为明显，如图 13.6(b)所示。各向异性 `filtering` 通过采样纹理上的额外点来缓解这个问题。例如，16x\
  \ 各向异性过滤意味着纹素颜色有 16 个不同的样本。显卡执行各向异性计算，使用一系列数学函数。本文未涵盖这些函数，但你可以参考章节末尾“补充阅读”中的 OpenGL\
  \ 扩展注册获取更多信息。虽然 OpenGL 最新的规范将各向异性过滤作为默认功能，但在 OpenGL 3.3 中它是扩展。这意味着在启用该功能之前，你应该验证图形硬件是否支持各向异性。大多数情况下这只是学术讨论，因为过去的所有显卡都支持各向异性过滤。但通常情况下，在使用该扩展之前测试\
  \ OpenGL 扩展可用是一个好主意。\n\n要开启各向异性过滤，你需要设置纹理使用 mipmapping，然后添加以下代码行：\n\n**点击此处查看代码图像**\n\
  \n```\nif (GLEW_EXT_texture_filter_anisotropy)\n{\n    // 获取最大各向异性值\n    GLfloat\
  \ largest;\n    glGetFloatv(GL_MAX_TEXTURE_ANISOTROPY_EXT, &largest);\n    // 启用它\n\
  \    glTexParameterf(GL_TEXTURE_2D, GL_TEXTURE_MAX_ANISOTROPY_EXT, largest);\n}\n\
  ```\n\n![Image 1388](img/index-850_1.jpg)\n\n![Image 1389](img/index-850_2.jpg)\n\
  \n![Image 1390](img/index-850_3.jpg)\n\n图 13.6 显示了本章游戏项目中不同设置下的地面。图 13.6(a) 显示了仅使用双线性过滤的地板；注意地面砖块边缘有很多采样伪影。\n\
  \n\n\n\n\n图 13.6(b) 显示启用了三线性过滤；这是一种改进，但远处的地面是模糊的。最后，\n\n图 13.6(c) 同时启用了三线性过滤和各向异性过滤，这在三种选择中产生了最佳视觉效果。\n\
  \n**图 13.6** 使用不同的过滤方法观察地面：(a) 双线性过滤，(b) 三线性过滤，以及 (c) 三线性和各向异性过滤\n\n![Image 1391](img/index-851_1.jpg)\n\
  ![Image 1392](img/index-851_2.jpg)\n![Image 1393](img/index-851_3.jpg)\n![Image\
  \ 1394](img/index-851_4.jpg)\n![Image 1395](img/index-851_5.jpg)\n![Image 1396](img/index-851_6.jpg)\n\
  ![Image 1397](img/index-851_7.jpg)\n![Image 1398](img/index-851_8.jpg)\n\n### 渲染到纹理\n\
  \n到目前为止，你一直直接将多边形绘制到颜色缓冲区中。然而，这个颜色缓冲区并不特殊；它只是一个你在特定坐标写入颜色的 2D 图像。事实证明，你也可以将场景渲染到任意纹理上，或者说\
  \ `render-to-texture`（渲染到纹理）。尽管这似乎没有必要，但有很多理由你可能想要渲染到纹理。\n\n例如，赛车游戏中可能有一辆带有后视镜的汽车。如果你想让镜子看起来准确，你可能会从后视镜的视角将游戏世界渲染到纹理上，然后在场景中的镜子上画上该纹理。此外，某些图形技术在计算颜色缓冲区的最终输出之前，使用纹理作为临时存储。\n\
  \n本节探讨如何渲染到纹理并在屏幕上显示此纹理。这将需要对整体渲染代码进行一些更改，之前的代码假设所有内容都直接写入颜色缓冲区。你还需要添加支持从不同摄像机的视角渲染场景的功能。\n\
  \n#### 注意\n对于高质量的反射（例如大镜子），你必须从表面的视角渲染场景。然而，如果游戏场景包含许多需要低质量反射的表面，那么从这些表面的每个视角渲染场景的开销太大了。在这种情况下，你可以转而生成整个场景的单个\
  \ `reflection map`（反射图）。\n\n然后，对于每个低质量反射表面，你从该反射图中进行采样，以产生反射的幻觉。尽管质量远低于从反射表面视角渲染的质量，但对于只需要低质量反射的表面来说足够了。\n\
  \n![Image 1399](img/index-852_1.jpg)\n![Image 1400](img/index-852_2.jpg)\n![Image\
  \ 1401](img/index-852_3.jpg)\n![Image 1402](img/index-852_4.jpg)\n![Image 1403](img/index-852_5.jpg)\n\
  ![Image 1404](img/index-852_6.jpg)\n![Image 1405](img/index-852_7.jpg)\n![Image\
  \ 1406](img/index-852_8.jpg)\n\n本书未涵盖如何实现反射图，但你可以咨询本章末尾的“附加阅读”部分获取有关该主题的更多信息。\n\n\
  #### 创建纹理\n\n要渲染到纹理，你首先需要创建一个纹理。你可以向 `Texture` 类添加一个新函数，以支持创建用于渲染的纹理。创建纹理的代码如列表\
  \ 13.1 所示，与第 5 章中创建纹理的代码类似。\n\n然而，并不是假设你想要 `RGBA` 格式（这将导致每个组件 8 位，每个像素 32 位），而是使用参数来指定格式。其次，纹理没有初始数据，这就是为什么\
  \ `glTexImage2D` 的最后一个参数是 `nullptr`。如果这个最后一个参数是 `nullptr`，那么第二个和倒数第二个参数将被忽略。最后，你特意没有在纹理上开启多级映射（mipmapping）或双线性过滤。你希望从纹理采样的数据与实际输出精确匹配。\n\
  \n**列表 13.1** 创建用于渲染的纹理\n\n**点击此处查看代码图片**\n\n```\nvoid Texture::CreateForRendering(int\
  \ width, int height, unsigned int format)\n{\n\n![Image 1407](img/index-853_1.jpg)\n\
  ![Image 1408](img/index-853_2.jpg)\n\nmWidth = width;\nmHeight = height;\n// 创建纹理\
  \ id\nglGenTextures(1, &mTextureID);\nglBindTexture(GL_TEXTURE_2D, mTextureID);\n\
  // 使用空初始数据设置图像宽/高\nglTexImage2D(GL_TEXTURE_2D, 0, format, mWidth, mHeight, 0, GL_RGB,\
  \ nullptr);\n// 对于我们将使用的纹理\nglTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MIN_FILTER,\
  \ GL_NEAREST);\nglTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MAG_FILTER, GL_NEAREST);\n\
  }\n```\n\n#### 创建帧缓冲区\n\n就像 OpenGL 提供一个 ID 为 0 的默认帧缓冲区（这是你到目前为止一直在绘制的缓冲区）一样，你也可以根据需要创建帧缓冲区。\n\
  \n首先，你必须在 `Renderer` 类中添加两个新的成员变量：\n\n**点击此处查看代码图片**\n\n// 后视镜的帧缓冲区对象\nunsigned\
  \ int mMirrorBuffer;\n// 后视镜的纹理\nTexture* mMirrorTexture;\n\n你将创建的帧缓冲区 ID 存储在 `mMirrorBuffer`\
  \ 中并将关联纹理存储在 `mMirrorTexture` 中。接下来，你需要一个创建并配置后视镜缓冲区的函数，如列表 13.2 所示。\n\n几个步骤是必要的。首先，`glGenFramebuffers`\
  \ 创建帧缓冲区对象并将 ID 存储在 `mMirrorBuffer` 中。`glBindFramebuffer` 调用将该帧缓冲区设置为激活状态。接下来的几行创建一个深度缓冲区并将其附加到当前帧缓冲区。这样，在渲染后视镜时，你仍然拥有深度缓冲区。\n\
  \n然后你创建后视镜纹理，其宽高为屏幕的四分之一。你没有使用全屏尺寸，因为你想让镜子占据屏幕的一部分。你为纹理请求 `GL_RGB` 格式，因为镜子将包含从后视镜视角看到的场景颜色。\n\
  \n接下来，`glFramebufferTexture` 调用将后视镜纹理与帧缓冲区关联。注意你是如何指定第二个参数 `GL_COLOR_ATTACHMENT0`\
  \ 的。这意味着纹理对应于片色器的第一个颜色输出。目前你的片色器只写一个输出，但正如在本章稍后部分看到的，可以从片色器写入多个输出。\n\n`glDrawBuffers`\
  \ 调用表示对于此帧缓冲区，你想向 `GL_COLOR_ATTACHMENT0` 槽（即后视镜纹理）绘制。最后，`glCheckFramebufferStatus`\
  \ 调用验证所有操作是否正常。如果有问题，你删除帧缓冲区对象和镜子纹理并返回 false。\n\n**列表 13.2** 创建后视镜帧缓冲区\n\n**点击此处查看代码图片**\n\
  \n```\nbool Renderer::CreateMirrorTarget()\n{\n    int width = static_cast<int>(mScreenWidth)\
