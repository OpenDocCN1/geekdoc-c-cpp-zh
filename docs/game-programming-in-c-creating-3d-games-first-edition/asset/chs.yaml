  \ prompt.)*\n\n*Wait, let's re-read the input carefully:*\n\"You’ve used JSON file\
  \ formats throughout this book: for meshes, animations, skeletons, text localization,\
  \ and now for level loading. The advantages of using a text-based file format are\
