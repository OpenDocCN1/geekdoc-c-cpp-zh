  如下所示：\n\n点击此处查看代码图片\n\n```cpp\nconst size_t MAX_SKELETON_BONES = 96;\n\nstruct MatrixPalette\n\
  {\n    Matrix4 mEntry[MAX_SKELETON_BONES];\n};\n```\n\n你将最大骨节点数量的常量设置为 96，但你也可以设为\
