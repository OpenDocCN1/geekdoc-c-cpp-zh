  \ 16 日。\n\n### 练习\n在本章的练习中，你将探索改进章节后半部分涵盖的延迟渲染技术。\n\n### 练习 13.1\n为全局光（方向光）和点光添加对高光分量的支持。要做到这一点，你首先需要在\
  \ G-buffer 中创建一个新的纹理，用于存储表面的高光强度。将此新纹理添加到代码的相关部分（包括 C++ 和 GLSL）。接下来，修改 `PointLightComponent`\
  \ 类、`PointLightComponent::Draw` 函数以及用于点光和全局光的着色器代码。对于点光，像处理漫反射颜色一样，使用强度来插值高光颜色。像之前一样根据\
  \ Phong 方程计算高光分量。\n\n### 练习 13.2\n在延迟渲染中添加新类型的光源需要新的光路几何体。为聚光灯添加支持。为此，你需要创建一个 `SpotLightComponent`\
  \ 以及一个用于在点光之后绘制这些光的相应着色器。使用提供的 `SpotLight.gpmesh` 文件（这是一个锥体）作为聚光灯的网格。聚光灯应该具有像点光那样的参数，但还需要一个角度变量。为了能够改变角度，网格也需要进行非均匀缩放。默认网格的半角为\
  \ 30 度。\n\n\n\n\n到目前为止，本书尚未采用数据驱动的方法来放置游戏世界中的对象。相反，`Game::LoadData` 函数的代码决定了游戏中的执行体（actors）、组件（components）以及全局属性（例如环境光）。\n\
  \n目前的方法有几个缺点，最显著的一点是即使是微小的变化（例如在关卡中放置一个立方体），也需要重新编译源代码。想要更改游戏对象位置的设计师不应该被迫修改 C++\
  \ 源代码。\n\n解决方案是为关卡创建一个单独的数据文件。该数据文件能够指定关卡包含哪些执行体以及哪些属性，并可选地调整这些执行体的组件。该关卡文件还应该包含任何需要的全局属性。\n\
  \n对于 2D 游戏，使用基础文本文件效果非常好。你只需要为世界中的不同对象定义不同的 ASCII 字符，并创建一个包含这些对象的文本网格。这使得关卡文件看起来像\
  \ ASCII 艺术。遗憾的是，这种方法对于 3D 游戏效果并不理想，因为游戏世界中的每个对象可能位于任意的 3D 坐标。此外，在本书使用的游戏对象模型中，执行体拥有组件，因此你可能还需要保存每个附加组件的属性。\n\
  \n出于上述所有原因，你需要一种更结构化的文件格式。与本书的其他部分一样，在本章中你再次使用基于文本的 JSON 格式处理数据。然而，本章还探索了任何文本格式的权衡，以及二进制文件格式所需的技巧。\n\
  \n本节探索了如何构建 JSON 关卡文件格式。你从全局属性开始，逐渐向文件中添加额外功能，使得 `Game::LoadData` 函数除了指定要加载关卡文件的函数调用外几乎没有代码。与之前的章节不同，本章探索了使用\
  \ RapidJSON 库来解析 JSON 文件。\n\n#### 加载全局属性\n\n游戏世界真正拥有的全局属性只有光照属性——环境光和全局方向光。由于属性数量有限，这是定义\
  \ JSON 关卡文件格式的良好起点。列表 14.1 显示了你如何在关卡文件中指定全局光照属性。\n\n**列表 14.1** 带有全局光照的关卡 (Level0.gplevel)\n\
  \n**点击此处查看代码图片**\n\n```json\n{\n  \"version\": 1,\n  \"globalProperties\": {\n \
  \   \"ambientLight\": [0.2, 0.2, 0.2],\n    \"directionalLight\": {\n      \"direction\"\
  : [0.0, -0.707, -0.707],\n      \"color\": [0.78, 0.88, 1.0]\n    }\n  }\n}\n```\n\
  \n列表 14.1 显示了你在关卡文件中常见的几种结构。首先，从核心上讲，JSON 文档是一个键值对（或 `properties`）的字典，称为 `JSON 对象`。键名在引号中，冒号后面是值。值可以是多种类型。基本类型是字符串、数字和布尔值。复杂类型是数组和\
  \ JSON 对象。对于此文件，`globalProperties` 键对应一个 JSON 对象。该 JSON 对象随后有两个键：一个用于环境光，一个用于方向光。`ambientLight`\
  \ 键对应一个包含三个数字的数组。同样，`directionalLight` 键对应另一个带有两个额外键的 JSON 对象。\n\n这种 JSON 对象和属性的嵌套驱动了解析代码的实现。具体来说，你可以看到常见的操作，即给定一个\
  \ JSON 对象和一个键名，你想读取一个值。在你的 C++ 代码中，你拥有的类型比 JSON 格式要多样得多，因此你应该添加代码来辅助解析。\n\n为了在代码中解析这些全局属性，你首先声明一个\
  \ `LevelLoader` 类。因为从文件加载关卡会影响游戏状态，但不会影响加载器本身，你将 `LoadLevel` 函数声明为静态函数，如下：\n\n**点击此处查看代码图片**\n\
  \n```cpp\nclass LevelLoader\n{\npublic:\n    // 加载关卡 -- 如果成功返回 true\n    static\
  \ bool LoadLevel(class Game* game, const std::string& fileName);\n};\n```\n\n注意，除了文件名外，`LoadLevel`\
  \ 函数还接收指向 `Game` 对象的指针。这是必要的，因为创建或修改任何内容都需要访问游戏。\n\n`LoadLevel` 的第一步是将关卡文件加载并解析到\
  \ `rapidjson::Document` 中。最有效的方法是先将整个文件加载到内存，然后将此缓冲区传递给 `Document` 的成员函数 `Parse`。因为将\
  \ JSON 文件加载到 Document 是一项常用操作，创建一个辅助函数是有意义的。这样，`gpmesh`、`gpanim` 以及任何需要加载的资源类型都可以重用此函数。列表\
  \ 14.2 显示了实现。\n\n该函数也是静态函数。它接收文件名和输出文档的引用。注意，你以二进制模式而非文本模式加载文件。如果文件加载成功，你使用 `tellg`\
  \ 函数获取位置。接下来，你通过 `seekg` 将流回到文件开头。创建一个容纳整个文件加上结束符的 vector，然后让 `read` 函数将字节读入 vector。最后，调用\
  \ `outDoc` 的 `Parse` 函数来解析文件。\n\n**列表 14.2** LevelLoader::LoadJSON 实现\n\n```cpp\n\
  bool LevelLoader::LoadJSON(const std::string& fileName, rapidjson::Document& outDoc)\n\
  {\n    // 以二进制模式从磁盘加载文件到 ifstream\n    // 加载时流缓冲区位于末尾 (ate)\n    std::ifstream file(fileName,\
  \ std::ios::in | std::ios::binary | std::ios::ate);\n\n    if (!file.is_open())\n\
  \    {\n        SDL_Log(\"找不到文件 %s\", fileName.c_str());\n        return false;\n\
  \    }\n\n    // 获取文件大小\n    std::ifstream::pos_type fileSize = file.tellg();\n\n\
  \    // 回到文件开头\n    file.seekg(0, std::ios::beg);\n\n    // 创建大小+1（用于结束符）的 vector\n\
  \    std::vector<char> bytes(static_cast<size_t>(fileSize) + 1);\n\n    // 将字节读入\
  \ vector\n    file.read(bytes.data(), static_cast<size_t>(fileSize));\n\n    //\
  \ 将原始数据加载到 RapidJSON 文档\n    outDoc.Parse(bytes.data());\n\n    if (!outDoc.IsObject())\n\
  \    {\n        SDL_Log(\"文件 %s 不是有效的 JSON\", fileName.c_str());\n        return\
  \ false;\n    }\n\n    return true;\n}\n```\n\n接着你在 `LoadLevel` 的开头调用 `LoadJSON`：\n\
  \n```cpp\nrapidjson::Document doc;\nif (!LoadJSON(fileName, doc))\n{\n    SDL_Log(\"\
  无法加载关卡 %s\", fileName.c_str());\n    return false;\n}\n```\n\n给定一个 JSON 对象，你需要读取键和\n\
  \n\n\n\n提取它们对应的值。你不应该假设给定的键总是存在，因此你应该首先验证该键是否存在并匹配预期的类型。如果存在，你就可以读取该值。你可以在另一个名为\
  \ `JsonHelper` 的类中通过静态函数来实现这种行为。列表 14.3 显示了 `JsonHelper::GetInt` 函数。它尝试查找属性，验证它是否匹配预期的类型，如果成功则返回\
  \ true。\n\n### 列表 14.3 `JsonHelper::GetInt` 实现\n\n**点击此处查看代码图片**\n\n```cpp\nbool\
  \ JsonHelper::GetInt(const rapidjson::Value& inObject, const char* inProperty, int&\
  \ outInt)\n{\n    // 检查此属性是否存在\n    auto itr = inObject.FindMember(inProperty);\n\
  \    if (itr == inObject.MemberEnd())\n    {\n        ![Image 1501](img/index-917_1.jpg)\n\
  \        ![Image 1502](img/index-917_2.jpg)\n        return false;\n    }\n    //\
  \ 获取值类型，并检查它是否为整数\n    auto& property = itr->value;\n    if (!property.IsInt())\n\
  \    {\n        return false;\n    }\n    // 我们已获得属性\n    outInt = property.GetInt();\n\
  \    return true;\n}\n```\n\n你你可以在 `LoadLevel` 中使用 `GetInt` 函数来验证加载的文件版本是否与预期的版本匹配：\n\
  \n**点击此处查看代码图片**\n\n```cpp\nint version = 0;\n![Image 1503](img/index-918_1.jpg)\n\
  ![Image 1504](img/index-918_2.jpg)\nif (!JsonHelper::GetInt(doc, \"version\", version)\
  \ || version != LevelVersion)\n{\n    SDL_Log(\"Incorrect level file version for\
  \ %s\", fileName.c_str()); \n    return false;\n}\n```\n\n在这里，涉及的 JSON 对象是整个文档（根\
  \ JSON 对象）。你首先确保 `GetInt` 返回了一个值，如果返回了，则检查其值是否匹配预期值（一个名为 `LevelVersion` 的常量）。你还为\
  \ `JsonHelper` 添加了类似的函数来提取其他基础类型：`GetFloat`、`GetBool` 和 `GetString`。然而，这种范式在处理非基础类型时真正变得强大。具体来说，游戏中的许多属性是\
  \ `Vector3` 类型（例如 `ambientLight`），因此拥有一个 `GetVector3` 函数非常有用。函数的整体结构仍然相同，只是你需要验证该属性是一个包含三个浮点数成员的数组。你可以类似地声明一个\
  \ `GetQuaternion` 函数。\n\n### 环境光和方向光\n\n有了这些辅助函数后，你可以创建一个函数来加载全局属性。由于全局属性是多样的，并且不一定需要相同的类类型，你必须手动查询你需要的特定属性。列表\
  \ 14.4 中的 `LoadGlobalProperties` 函数演示了如何加载环境光和方向光属性。注意，在大多数情况下，你为这些属性调用了你创建的辅助函数。\n\
  \n注意，你可以通过 `operator[]` 直接以 `rapidjson::Value&` 的形式访问属性。`dirObj[\"directionalLight\"\
  ]` 调用获取带有 `directionalLight` 键名的值，然后通过 `IsObject()` 调用验证该值的类型是否为 JSON 对象。对于方向光的另一种有趣模式是让你直接访问你想要设置的变量。在这种情况下，你不需要在\
  \ `GetVector3` 调用上添加任何条件检查。这是因为如果请求的属性不存在，`Get` 函数保证不会改变变量。如果你对变量有直接访问权限且不在乎属性是否未设置，那么这可以减少代码量。\n\
  \n### 列表 14.4 `LevelLoader::LoadGlobalProperties` 实现\n\n**点击此处查看代码图片**\n\n```cpp\n\
  void LevelLoader::LoadGlobalProperties(Game* game,\n![Image 1505](img/index-920_1.jpg)\n\
  ![Image 1506](img/index-920_2.jpg)\nconst rapidjson::Value& inObject)\n{\n    //\
  \ 获取环境光\n    Vector3 ambient;\n    if (JsonHelper::GetVector3(inObject, \"ambientLight\"\
  , ambient))\n    {\n        game->GetRenderer()->SetAmbientLight(ambient);\n   \
  \ }\n    // 获取方向光\n    const rapidjson::Value& dirObj = inObject[\"directionalLight\"\
  ]; \n    if (dirObj.IsObject())\n    {\n        DirectionalLight& light = game->GetRenderer()->GetDirectionalLight();\n\
  \        // 设置方向/颜色，如果它们存在\n        JsonHelper::GetVector3(dirObj, \"direction\"\
  , light.mDirection); \n        JsonHelper::GetVector3(dirObj, \"color\", light.mDiffuseColor);\n\
  \    }\n}\n```\n\n![Image 1507](img/index-921_1.jpg)\n![Image 1508](img/index-921_2.jpg)\n\
  ![Image 1509](img/index-921_3.jpg)\n![Image 1510](img/index-921_4.jpg)\n\n你随后在 `LoadLevel`\
  \ 中调用 `LoadGlobalProperties`，紧接着是文件的版本：\n\n**点击此处查看代码图片**\n\n```cpp\n// 处理全局属性\n\
  const rapidjson::Value& globals = doc[\"directionalLight\"]; \nif (globals.IsObject())\n\
  {\n    LoadGlobalProperties(game, globals);\n}\n```\n\n你随后在 `LoadLevel` 中调用 `LoadGlobalProperties`，紧接着是文件的版本：\n\
  \n**点击此处查看代码图片**\n\n```cpp\n// 处理全局属性\nconst rapidjson::Value& globals = doc[\"\
  directionalLight\"];\nif (globals.IsObject())\n{\n    LoadGlobalProperties(game,\
  \ globals);\n}\n```\n\n加载实体意味着在 JSON 文件中有一个数组，每个实体都有属性信息。然而，你需要一种方法来指定哪个 `Actor`\
  \ 子类。正如之前一样，这有助于可视化数据可能的样子。列表 14.5 显示了文件中的实体。这显示了 `TargetActor` 类型。\n\n```json\n\
  {\n  // 版本和全局属性\n  \"actors\": \n    {\n      \"type\": \"TargetActor\",\n     \
  \ ![Image 1501      ![Image 1502](img/index-917_2.jpg)\n      \"properties\": {\n\
  \        \"position\": [1450.0, 200.0, 0.0]\n      }\n    },\n    {\n      \"type\"\
  : \"TargetActor\",\n      \"properties\": {\n        \"position\": [1450.0, 200.0,\
  \ 0.0]\n      }\n    }\n  ]\n}\n```\n\n假设你现在有一个构建特定类型实体的方法，你还需要能够加载实体的属性。简单的方法是在基类\
  \ `Actor` 中创建一个虚的 `LoadProperties` 函数，如 列表 14.6 所示。\n\n### 实体加载\n\n### 列表 14.6 `Actor::LoadProperties`\
  \ 函数\n\n```cpp\nvoid Actor::LoadProperties(const rapidjson::Value& inObj)\n{\n \
  \   // 使用字符串处理不同的状态\n    std::string state;\n    if (JsonHelper::GetString(inObj,\
  \ \"state\", state))\n    {\n        if (state == \"active\")\n        {\n     \
  \       SetState(EActive);\n        }\n        else if (state == \"paused\")\n \
  \       {\n            SetState(EPaused);\n        }\n        else if (state ==\
  \ \"dead\")\n        {\n            SetState(EDead);\n        }\n    }\n    // 加载位置、旋转和缩放，并计算变换\n\
  \    JsonHelper::GetVector3(inObj, \"position\", mPosition); \n    JsonHelper::GetQuaternion(inObj,\
  \ \"rotation\", mRotation); \n    JsonHelper::GetFloat(inObj, \"scale\", mScale);\
  \ \n    ComputeWorldTransform();\n}\n```\n\n那么，对于 `Actor` 的子类，你可以重写 `LoadProperties`\
  \ 函数来根据需要加载任何额外的属性：\n\n```cpp\nvoid SomeActor::LoadProperties(const rapidjson::Value&\
  \ inObj)\n{\n}\n```\n\n\n\n\n```cpp\n// 加载基础 属性\n\nActor::LoadProperties(inObj);\n\
  ```\n\n![Image 1515](img/index-926_1.jpg)\n\n![Image 1516](img/index-926_2.jpg)\n\
  \n```cpp\n// 加载我的任何自定义属性\n\n// ...\n\n}\n```\n\n现在你已经有了加载属性的方法，下一步是解决构造正确类型 actor\
  \ 的问题。一种方法是创建一个映射（map），其键（key）是 actor 类型的字符串名称，值（value）是一个可以动态分配该类型 actor 的函数。键是非常直观的，因为它就是一个字符串。\n\
  \n对于值，你可以编写一个静态函数，用于动态分配特定类型的 actor。为了避免在 `Actor` 的每个子类中都声明一个单独的函数，你可以在基类 `Actor`\
  \ 中创建一个如下的模板函数：\n\n点击此处查看代码图片**\n\n```cpp\ntemplate <typename T>\nstatic Actor*\
  \ Create(class Game* game, const rapidjson::Value& inObj)\n{\n    // 动态分配类型为 T 的\
  \ actor\n    T* t = new T(game);\n    // 在新 actor 上调用 LoadProperties\n    t->LoadProperties(inObj);\n\
  \    return t;\n}\n```\n\n![Image 1517](img/index-927_1.jpg)\n![Image 1518](img/index-927_2.jpg)\n\
  ![Image 1519](img/index-927_3.jpg)\n![Image 1520](img/index-927_4.jpg)\n\n因为它是基于类型进行模板化的，所以它可以动态分配指定类型的对象，然后根据需要调用\
  \ `LoadProperties` 来设置该 actor 类型的任何参数。\n\n然后，回到 `LevelLoader`，你需要创建这个映射。键类型是 `std::string`，但对于值，你需要一个与\
  \ `Actor::Create` 函数签名匹配的函数。为了这一点，你可以再次使用 `std::function` 辅助类来定义该签名。\n\n首先，你使用别名声明（类似于\
  \ `typedef`）来创建一个 `ActorFunc` 类型标识符：\n\n点击此处查看代码图片**\n\n```cpp\nusing ActorFunc\
  \ = std::function<\nclass Actor*(class Game*, const rapidjson::Value&)\n>;\n```\n\
  \n`std::function` 的模板参数指定了函数返回一个 `Actor*` 并接收两个参数：`Game*` 和 `rapidjson::Value&`。\n\
  \n接下来，你在 LevelLoader 中将该映射声明为静态变量：\n\n![Image 1521](img/index-928_1.jpg)\n![Image\
  \ 1522](img/index-928_2.jpg)\n![Image 1523](img/index-928_3.jpg)\n![Image 1524](img/index-928_4.jpg)\n\
  LevelLoader:\n\n点击此处查看代码图片**\n\n```cpp\nstatic std::unordered_map<std::string, ActorFunc>\
  \ sActorFactoryMap;\n```\n\n然后在 `LevelLoader.cpp` 中，你构造 `sActorFactoryMap` 以填充你可以创建的不同的\
  \ actor：\n\n点击此处查看代码图片**\n\n```cpp\nstd::unordered_map<std::string, ActorFunc> LevelLoader::sActorFactoryMap\n\
  {\n    { \"Actor\", &Actor::Create<Actor> },\n    { \"BallActor\", &Actor::Create<BallActor>\
  \ },\n    { \"FollowActor\", &Actor::Create<FollowActor> },\n    { \"PlaneActor\"\
  , &Actor::Create<PlaneActor> },\n    { \"TargetActor\", &Actor::Create<TargetActor>\
  \ },\n};\n```\n\n这种初始化语法在映射中设置了条目，键为指定的字符串名称，值为 `Actor::Create` 函数的地址，该函数通过模板创建特定类型的\
  \ `Actor` 子类。注意，你并没有在这里调用这些各种创建函数。相反，你只是获取了函数的内存地址并将其保存以供以后使用。\n\n映射设置完成后，你现在可以创建一个\
  \ `LoadActors` 函数，如列表 14.7 所示。在这里，你遍历 JSON 文件中的 actor 数组并获取 actor 的类型字符串。你使用该类型在\
  \ `sActorFactoryMap` 中查找。如果你找到了该类型，就会调用存储在映射值中的函数（`iter->second`），这反过来会调用 `Actor::Create`\
  \ 的正确版本。如果你没有找到该类型，会输出一条非常有用的调试日志。\n\n**列表 14.7** `LevelLoader::LoadActors` 实现\n\
  \n点击此处查看代码图片**\n\n```cpp\nvoid LevelLoader::LoadActors(Game* game, const rapidjson::Value&\
  \ inArray)\n{\n    // 遍历 actor 数组\n    for (rapidjson::SizeType i = 0; i < inArray.Size();\
  \ i++)\n    {\n        const rapidjson::Value& actorObj = inArray[i];\n        if\
  \ (actorObj.IsObject())\n        {\n            // 获取类型\n            std::string\
  \ type;\n            ![Image 1525](img/index-930_1.jpg)\n            ![Image 1526](img/index-930_2.jpg)\n\
  \            if (actorObj.GetString(\"type\", type))\n            {\n          \
  \      // 在映射中查找该类型？\n                auto iter = sActorFactoryMap.find(type);\n\
  \                if (iter != sActorFactoryMap.end())\n                {\n      \
  \              // 使用函数构造\n                    Actor* actor = iter->second(game,\
  \ actorObj);\n                }\n                else\n                {\n     \
  \               _Log(\"Unknown type %s\", type.c_str());\n                }\n  \
  \          }\n        }\n    }\n}\n```\n\n随后在 `LoadLevel` 中加载 `doc` 之后添加对 `LoadActors`\
  \ 的调用：\n\n```cpp\nLoadActors(game, doc[\"actors\"]);\n```\n\n有了这些代码，你现在正在加载 actor\
  \ 并设置属性。然而，你还没有调整属性或添加组件。\n\n### 组件\n\n为了确定 `Actor` 是否已具有特定类型的组件，你需要一种通过类型遍历其 `mComponents`\
  \ vector 的方法。虽然可以使用 C++ 内置的类型信息，但游戏程序员通常会使用自己的类型信息（并禁用内置功能）。这主要是因为 C++ 内置的运行时类型信息（RTTI）不符合“只为你使用的部分付费”的原则，这一点有许多有记载的缺点。\n\
  \n实现自己的类型信息有许多方法；本章展示了一种简单的方法。首先，在 `Component` 类中声明一个 `TypeID` 枚举，如下：\n\n点击此处查看代码图片**\n\
  \n![Image 1531](img/index-934_1.jpg)\n![Image 1532](img/index-934_2.jpg)\n![Image\
  \ 1533](img/index-934_3.jpg)\n![Image 1534](img/index-934_4.jpg)\n\n```cpp\nenum\
  \ TypeID\n{\n    TComponent = 0,\n    TAudioComponent,\n    TBallMove,\n    // 其他类型省略\n\
  \    // ...\n    NUM_COMPONENT_TYPES\n};\n```\n\n然后，你添加一个名为 `GetType` 的虚函数，它根据组件返回正确的\
  \ `TypeID`。例如，`MeshComponent::GetType` 的实现如下：\n\n点击此处查看代码图片**\n\n```cpp\nTypeID\
  \ GetType() const override { return TMeshComponent; }\n```\n\n接下来，你为 `Actor` 添加一个\
  \ `GetComponentOfType` 函数，该函数遍历 `mComponents` vector 并返回匹配该类型的第一个组件。\n\n\n\n\n\n\
  ```cpp\nComponent* GetComponentOfType(Component::TypeID type)\n```\n\n![Image 1535](img/index-935_1.jpg)\n\
  \n![Image 1536](img/index-935_2.jpg)\n\n```cpp\n{\nComponent* comp = nullptr;\n\
  for (Component* c : mComponents)\n{\n    if (c->GetType() == type)\n    {\n    \
  \    comp = c;\n        break;\n    }\n}\nreturn comp;\n}\n```\n\n这种方法的缺点是，每当你创建一个新的\
  \ `Component` 子类时，都必须记住在 `TypeID` 枚举中添加一个条目并实现 `GetType` 函数。你可以通过宏或模板在某种程度上实现自动化，但为了代码的可读性和理解考虑，这里的代码并没有这样做。\n\
  \n请注意，该系统还假设你不会向一个 actor（执行者）挂载多个相同类型的组件。如果你想拥有相同类型的多个组件，那么 `GetComponentOfType`\
  \ 可能需要返回一个组件集合，而不仅仅是单个指针。\n\n此外，类型信息并没有提供继承信息；你无法判断出 `SkeletalMeshComponent` 是 `MeshComponent`\
  \ 的子类，因为 `SkeletalMeshComponent` 的 `GetType` 只是返回 `TSkeletalMeshComponent`。为了支持继承信息，你需要一种也能保存某些层级信息的方法。\n\
  \n在基础类型系统建立之后，你可以继续更熟悉的步骤。与 `Actor` 一样，你需要在基类 `Component` 类中创建一个虚拟的 `LoadProperties`\
  \ 函数，然后根据需要对任何子类进行重写。各个子类的实现并不总是直观的。列表 14.9 显示了 `MeshComponent` 的 `LoadProperties`\
  \ 实现。记住 `MeshComponent` 有一个 `mMesh` 成员变量，它是指向要绘制顶点数据的指针。你不想在 JSON 文件中直接指定顶点；而是想引用\
  \ `gpmesh` 文件。代码首先检查 `meshFile` 属性，然后从渲染器中获取相应的网格。\n\n**列表 14.9** `MeshComponent::LoadProperties`\
  \ 实现\n\n**点击此处查看代码图片**\n\n![Image 1537](img/index-937_1.jpg)\n\n![Image 1538](img/index-937_2.jpg)\n\
  \n```cpp\nvoid MeshComponent::LoadProperties(const rapidjson::Value& inObj)\n{\n\
  Component::LoadProperties(inObj);\nstd::string meshFile;\nif (JsonHelper::GetString(inObj,\
  \ \"meshFile\", meshFile))\n{\n    SetMesh(mOwner->GetGame()->GetRenderer()->GetMesh(meshFile));\n\
  }\nint idx;\nif (JsonHelper::GetInt(inObj, \"textureIndex\", idx))\n{\n    mTextureIndex\
  \ = static_cast<size_t>(idx);\n}\nJsonHelper::GetBool(inObj, \"visible\", mVisible);\n\
  JsonHelper::GetBool(inObj, \"isSkeletal\", mIsSkeletal);\n}\n```\n\n![Image 1539](img/index-938_1.jpg)\n\
  \n![Image 1540](img/index-938_2.jpg)\n\n![Image 1541](img/index-938_3.jpg)\n\n![Image\
  \ 1542](img/index-938_4.jpg)\n\n下一步是为 `Component` 添加一个静态模板化的 `Create` 函数，这与 `Actor`\
  \ 中的实现非常相似，只是参数不同。（它接收 `Actor*` 作为第一个参数，而不是 `Game*`。）\n\n然后你需要在 `LevelLoader` 中一个\
  \ map（映射）。你再次使用 `std::function` 来创建一个名为 `ComponentFunc` 的辅助类型：\n\n**点击此处查看代码图片**\n\
  \n```cpp\nusing ComponentFunc = std::function<\nclass Component*(class Actor*, const\
  \ rapidjson::Value&)\n>;\n```\n\n然后，你声明这个 map。然而，与只有一个单一值的 `sActorFactoryMap` 不同，在这种情况下，你需要一对值（pair）。值对中的第一个元素是对应于组件\
  \ `TypeID` 的整数，第二个元素是 `ComponentFunc`：\n\n**点击此处查看代码图片**\n\n```cpp\nstatic std::unordered_map<std::string,\n\
  std::pair<int, ComponentFunc>> sComponentFactoryMap;\n```\n\n接着，在 `LevelLoader.cpp`\
  \ 中实例化 `sComponentFactoryMap`：\n\n![Image 1543](img/index-939_1.jpg)\n\n![Image\
  \ 1544](img/index-939_2.jpg)\n\n**点击此处查看代码图片**\n\n```cpp\nstd::unordered_map<std::string,\
  \ std::pair<int, ComponentFunc>> LevelLoader::sComponentFactoryMap\n{\n    { \"\
  AudioComponent\",\n        { Component::TAudioComponent, &Component::Create<AudioComponent>\n\
  \    },\n    { \"BallMove\",\n        { Component::TBallMove, &Component::Create<BallMove>\
  \ }\n    },\n    // 其他组件省略\n    // ...\n};\n```\n\n然后你在 `LevelLoader` 中实现一个 `LoadComponents`\
  \ 辅助函数，如列表 14.10 所示。与 `LoadActors` 一样，它接收一个组件数组。你使用 `sComponentFactoryMap` 来查找类型。如果找到了，检查\
  \ actor 是否已经有了该组件。`iter->first` 对应于 `TypeID`。如果 actor 还没有该类型的组件，则通过存储在 `iter->second`\
  \ 中的函数来创建一个。如果组件已经存在，则可以直接调用 `LoadProperties`。\n\n**列表 14.10** `LevelLoader::LoadComponents`\n\
  \n```cpp\nvoid LevelLoader::LoadComponents(Actor* actor, const rapidjson::Value&\
  \ inArray)\n{\n    for (rapidjson::SizeType i = 0; i < inArray.Size(); i++)\n  \
  \  {\n        const rapidjson::Value& compObj = inArray[i];\n        if (compObj.IsObject())\n\
  \        {\n            std::string type;\n            if (JsonHelper::GetString(compObj,\
  \ \"type\", type))\n            {\n                auto iter = sFactoryMap.find(type);\n\
  \                if (iter != sFactoryMap.end())\n                {\n           \
  \         Component::TypeID tid = static_cast<Component::TypeID>(iter->first);\n\
  \                    Component* comp = actor->GetComponentOfType(tid);\n       \
  \             if (comp == nullptr)\n                    {\n                    \
  \    comp = iter->second.second(actor, compObj);\n                    }\n      \
  \              else\n                    {\n                        comp->LoadProperties(compObj);\n\
  \                    }\n                }\n                else\n              \
  \  {\n                    SDL_Log(\"Unknown component type %s\", type.c_str());\n\
  \                }\n            }\n        }\n    }\n}\n```\n\n最后，在 `LoadActors`\
  \ 中添加代码来访问组件属性（如果存在），并调用 `LoadComponents`：\n\n```cpp\n// 使用 map 中的函数进行构造\nActor*\
  \ actor = iter->second(game, actorObj[\"properties\"]);\n// 获取 actor 的组件\nif (actorObj.HasMember(\"\
  components\"))\n{\n    const rapidjson::Value& components = actorObj[\"components\"\
  ];\n    if (components.IsArray())\n    {\n        LoadComponents(actor, components);\n\
  \    }\n}\n```\n\n![Image 1547](img/index-942_1.jpg)\n\n![Image 1548](img/index-942_2.jpg)\n\
  \n有了这些代码，你现在可以从文件加载整个关卡，包括全局属性、actor 以及每个 actor 关联的所有组件。\n\n### 保存关卡文件\n\n从概念上，保存比从文件中加载要简单。首先，写入关卡的全局属性。然后，遍历游戏中的每个\
  \ actor 以及每个 actor 挂载的每个组件。对于这些项，你需要写入相关的属性。实现细节有些复杂，因为 RapidJSON 创建 JSON 文件的接口比读取文件的要复杂一些。但总体来说，可以使用类似于加载关卡文件的技术。\n\
  \n首先，在 `JsonHelper` 中创建辅助 `Add` 函数，以便能够快速向现有的 JSON 对象添加额外的属性。例如，`AddInt` 函数的语法如下：\n\
  \n```cpp\nvoid JsonHelper::AddInt(rapidjson::Document::AllocatorType& alloc,\nrapidjson::Value&\
  \ inObject, const char* name, int value)\n{\n    rapidjson::Value v(value);\n  \
  \  inObject.AddMember(rapidjson::StringRef(name), v, alloc);\n}\n```\n\n\n\n\n\n\
  最后三个参数与 `GetInt` 函数的参数相同，但 `Value` 现在不再是 `const`。第一个参数是一个分配器，`RapidJSON` 在需要分配内存时使用它。\n\
  \n每次调用 `AddMember` 都需要一个分配器，因此你必须传递一个。你可以直接从 `Document` 对象获取默认分配器，但根据需要，你理论上也可以使用不同的分配器。然后，你创建一个\
  \ `Value` 对象来封装整数，并使用 `AddMember` 函数将带有指定名称的值添加到 `inObject` 中。\n\n其余的 `Add` 函数都类似，但\
  \ `AddVector3` 和 `AddQuaternion` 除外，对于这两个函数，你必须先创建一个数组，然后向该数组添加浮点值。（当你在查看全局属性时会看到这种数组语法。）\n\
  \n然后，你为 `LevelLoader::SaveLevel` 函数创建一个骨架，如 Listing 14.11 所示。首先，你创建 `RapidJSON`\
  \ 文档，并通过 `SetObject` 为其根创建一个对象。接下来，你添加版本整数。然后，你使用 `StringBuffer` 和 `PrettyWriter`\
  \ 创建 JSON 文件的格式化输出字符串。最后，你使用标准的 `std::ofstream` 将该字符串写入文件。\n\n**Listing 14.11**\
  \ LevelLoader::SaveLevel 实现\n\n**点击此处查看代码图片**\n\n```cpp\nvoid LevelLoader::SaveLevel(Game*\
  \ game, const std::string& fileName)\n{\n    // 创建文档和根对象\n    rapidjson::Document\
  \ doc;\n    doc.SetObject();\n\n    // 写入版本\n    JsonHelper::AddInt(doc.GetAllocator(),\
  \ doc, \"version\", LevelVersion);\n\n    // 创建文件的其余部分 (TODO)\n    // ...\n\n  \
  \  // 将 JSON 保存到字符串缓冲区\n    ![Image 1551](img/index-946_1.jpg)\n    ![Image 1552](img/index-946_2.jpg)\n\
  \n    rapidjson::StringBuffer buffer;\n    // 使用 PrettyWriter 进行格式化输出（否则使用 Writer）\
  \ \n    rapidjson::PrettyWriter<rapidjson::StringBuffer> writer(buffer);\n    doc.Accept(writer);\n\
  \n    const char* output = buffer.GetString();\n\n    // 将输出写入文件\n    std::ofstream\
  \ outFile(fileName);\n    if (outFile.is_open())\n    {\n        outFile << output;\n\
  \    }\n}\n```\n\n目前，此函数仅向输出文件写入版本号。但有了这段骨架代码，你可以开始添加剩余的输出。\n\n#### 保存全局属性\n\n接下来，你需要在\
  \ `LevelLoader` 中添加一个 `SaveGlobalProperties` 函数。我们在这里省略它的具体实现，因为它与到为止编写的其他函数非常相似。你只需要为环境光和方向光对象添加属性即可。\n\
  \n![Image 1553](img/index-947_1.jpg)\n![Image 1554](img/index-947_2.jpg)\n![Image\
  \ 1555](img/index-947_3.jpg)\n![Image 1556](img/index-947_4.jpg)\n\n一旦该函数完成，你按照如下方式将其集成到\
  \ `SaveLevel` 函数中：\n\n**点击此处查看代码图片**\n\n```cpp\nrapidjson::Value globals(rapidjson::kObjectType);\n\
  SaveGlobalProperties(doc.GetAllocator(), game, globals); \ndoc.AddMember(\"globalProperties\"\
  , globals, doc.GetAllocator());\n```\n\n### 保存 Actor 和组件\n\n为了能够保存 Actor 和组件，你需要一种方法根据\
  \ `Actor` 或 `Component` 指针获取其类型的字符串名称。你已经为组件拥有 `TypeID`，因此为了获取对应的字符串，你只需要在 `Component`\
  \ 中声明一个包含不同名称的常量数组。你在 `Component.h` 中如下声明该数组：\n\n**点击此处查看代码图片**\n\n```cpp\nstatic\
  \ const char* TypeNames[NUM_COMPONENT_TYPES];\n```\n\n然后在 `Component.cpp` 中填充该数组。重要的一点是必须保持与\
  \ `TypeID` 枚举相同的顺序：\n\n![Image 1557](img/index-948_1.jpg)\n![Image 1558](img/index-948_2.jpg)\n\
  ![Image 1559](img/index-948_3.jpg)\n![Image 1560](img/index-948_4.jpg)\n\n**点击此处查看代码图片**\n\
  \n```cpp\nconst char* Component::TypeNames[NUM_COMPONENT_TYPES] = {\n    \"Component\"\
  ,\n    \"AudioComponent\",\n    \"BallMove\",\n    // 其他省略\n    // ...\n};\n```\n\
  \n通过保持这种顺序，你可以使用类似下面的代码段根据类型轻松地获取组件的名称：\n\n**点击此处查看代码图片**\n\n```cpp\nComponent*\
  \ comp = /* 指向某些内容 */;\nconst char* name = Component::TypeNames[comp->GetType()];\n\
  ```\n\n要对 `Actor` 及其子类执行同样的操作，你需要在 `Actor` 中添加 `TypeID` 枚举，并为每个子类实现虚拟的 `SaveProperties`。这与之前组件的\
  \ `SaveProperties` 方法类似，你只需要在 `Actor` 中添加它。Listing 14.12 显示了 `Actor::SaveProperties`\
  \ 的实现。\n\n```cpp\nvoid Actor::SaveProperties(rapidjson::AllocatorType& alloc, rapidjson::Value&\
  \ inObj) const\n{\n    std::string state = \"active\";\n    if (mState == EPaused)\n\
  \    {\n        state = \"paused\";\n    } else if (mState == EDead)\n    {\n  \
  \      state = \"dead\";\n    }\n    ![Image 1561](img/index-950_1.jpg)\n    ![Image\
  \ 1562](img/index-950_2.jpg)\n    JsonHelper::AddString(alloc, inObj, \"state\"\
  , state);\n    JsonHelper::AddVector3(alloc, inObj, \"position\", mPosition);\n\
  \    JsonHelper::AddQuaternion(alloc, inObj, \"rotation\", mRotation);\n    JsonHelper::AddFloat(alloc,\
  \ inObj, \"scale\", mScale);\n}\n```\n\n**Listing 14.12** Actor::SaveProperties\n\
  \n**Listing 14.13** LevelLoader::SaveActors 实现\n\n**点击此处查看代码图片**\n\n```cpp\nvoid\
  \ LevelLoader::SaveActors(rapidjson::AllocatorType& alloc, Game* game, rapidjson::Value&\
  \ inArray)\n{\n    const auto& actors = game->GetActors();\n    for (const Actor*\
  \ actor : actors)\n    {\n        // 创建一个 JSON 对象\n        rapidjson::Value obj(rapidjson::kObjectType);\n\
  \        // 添加类型\n        AddString(alloc, obj, \"type\", Actor::TypeNames[actor->GetType()]);\n\
  \        // 为属性创建对象\n        rapidjson::Value props(rapidjson::kObjectType);\n \
  \       // 保存属性\n        actor->SaveProperties(alloc, props);\n        // 将属性添加到\
  \ JSON 对象\n        obj.AddMember(\"properties\", props, alloc);\n        // 保存组件\n\
  \        rapidjson::Value components(rapidjson::kArrayType);\n        SaveComponents(alloc,\
  \ actor, components);\n        obj.AddMember(\"components\", components, alloc);\n\
  \n        ![Image 1563](img/index-952_1.jpg)\n        ![Image 1564](img/index-952_2.jpg)\n\
  \        ![Image 1565](img/index-952_3.jpg)\n        ![Image 1566](img/index-952_4.jpg)\n\
  \        ![Image 1567](img/index-952_5.jpg)\n        ![Image 1568](img/index-952_6.jpg)\n\
  \        ![Image 1569](img/index-952_7.jpg)\n        ![Image 1570](img/index-952_8.jpg)\n\
  \        ![Image 1571](img/index-952_9.jpg)\n        ![Image 1572](img/index-952_10.jpg)\n\
  \n        // 将 actor 添加到 inArray\n        inArray.PushBack(obj, alloc);\n    }\n\
  }\n```\n\n\n\n\n虽然这段代码会保存游戏中的几乎所有内容，但它并没有完全捕获游戏在特定时间点的当前状态。例如，它没有保存任何活跃的 FMOD 音频事件的状态。要实现这一点，你需要向\
  \ FMOD 请求这些音频事件的当前时间戳，然后当从文件加载游戏时，你需要使用这些时间戳重启音频事件。从保存关卡文件转变为可供玩家使用的存档文件，还需要一些额外的工作。\n\
  \n## 二进制数据\n\n在整本书中，你一直在使用 JSON 文件格式：用于网格、动画、骨骼、文本本地化，现在又用于关卡加载。使用基于文本的文件格式有许多优点。文本文件易于人类查看、查找错误，并且（在需要时）进行手动编辑。文本文件与\
  \ `Git` 等源版本控制系统的兼容性也非常好，因为非常容易查看文件在两个版本之间发生了什么变化。在开发过程中，如果资产是文本文件，那么调试资产的加载也会更加容易。\n\
  \n然而，使用基于文本的文件格式的缺点是它们效率低下，无论是在磁盘和内存使用方面，还是在运行时性能方面。像 `JSON` 或 `XML` 这样的格式仅仅因为它们使用的格式字符（如大括号和引号）就占据了大量的磁盘空间。此外，即使使用如\
  \ `RapidJSON` 这样的高性能库，在运行时解析基于文本的文件也是慢的。例如，在我的电脑上，在调试版本中加载 `CatWarrior.gpmesh` 文件大约需要三秒钟。显然，这会导致更大规模的游戏加载时间变慢。\n\
  \n为了兼顾两者的优点，你可能希望在开发期间使用文本文件（至少对于团队中的某些成员而言），然后在优化后的版本中使用二进制文件。本节将探索如何创建一个二进制网格文件格式。\n\
  \n为了保持简单性，在加载 `gpmesh` JSON 格式的代码中，你首先会检查是否存在对应的 `gpmesh.bin` 文件。如果存在，你将加载它而不是 JSON\
  \ 文件。如果不存在，游戏将创建二进制版本的文件，这样当你下次运行游戏时，你就可以加载二进制版本而不是文本版本了。\n\n请注意，这种方法的一个潜在负端是，它可能会导致只在二进制格式中出现而在文本格式中不出现的逻辑错误。为了避免这种情况，在整个开发过程中继续使用这两种格式是非常重要的。如果两种格式中的一种变得过时，那么该格式停止工作的概率就会增加。\n\
  \n## 保存二进制网格文件\n\n对于任何二进制文件格式，重要的一步是决定文件的布局。大多数大多数二进制文件都以某种 `header`（头部）开头，该头部定义了文件内容以及读取文件其余部分所需的任何特定大小信息。在网格文件格式的情况下，你希望头部能够存储关于版本、顶点和索引数量等的信息。插图\
