  \ 1184](img/index-688_2.jpg)\n    return false;\n}\n}\n```\n\n`Intersect` 函数如 列表\
  \ 10.8， 所示，它使用 `TestSidePlane` 函数来测试 `AABB` 的六个不同面平面与线段的交情况。每个平面交点的 `t` 值都存储在 `tValues`\
  \ 向量中。然后，你对该向量进行升序排序，并返回位于 `AABB` 内部的第一个交点。如果 `AABB` 不包含其中任何一个点，该函数返回 `false`。\n\
  \n### 列表 10.8 线段与 AABB 相交\n\n**点击此处查看代码图像**\n\n```\nbool Intersect(const LineSegment&\
  \ l, const AABB& b, float& outT)\n{\n    // Vector to save all possible t values\n\
  \    std::vector<float> tValues;\n\n    // Test the x planes\n    TestSidePlane(l.mStart.x,\
  \ l.mEnd.x, b.mMin.x, tValues);\n    TestSidePlane(l.mStart.x, l.mEnd.x, b.mMax.x,\
  \ tValues);\n\n    // Test the y planes\n    TestSidePlane(l.mStart.y, l.mEnd.y,\
  \ b.mMin.y, tValues);\n    TestSidePlane(l.mStart.y, l.mEnd.y, b.mMax.y, tValues);\n\
  \n    // Test the z planes\n    TestSidePlane(l.mStart.z, l.mEnd.z, b.mMin.z, tValues);\n\
  \    TestSidePlane(l.mStart.z, l.mEnd.z, b.mMax.z, tValues);\n\n    // Sort the\
  \ t values in ascending order\n    std::sort(tValues.begin(), tValues.end());\n\n\
  \    // Test if the box contains any of these points of intersection \n    Vector3\
  \ point;\n    for (float t : tValues)\n    {\n        point = l.PointOnSegment(t);\n\
  \        if (b.Contains(point))\n        {\n            outT = t;\n            return\
  \ true;\n        }\n    }\n\n    ![Image 1185](img/index-690_1.jpg)\n    ![Image\
  \ 1186](img/index-690_2.jpg)\n\n    //None of the intersections are within bounds\
  \ of box\n    return false;\n}\n```\n\n通过独立测试盒的每个侧面，你可以修改代码以返回哪一个面与线段相交。如果一个物体需要从盒上反弹（例如本章游戏项目中的球体反弹），这将非常有用。虽然这里没有显示，但这需要将每次对\
  \ `TestSidePlane` 的调用与盒的一个面关联。然后，将该侧面（或该面的法线）作为引用参数传递给 `Intersect`，以便其写入。\n\n你可以通过使用\
  \ `slabs`（即由两个平面界定的无限区域）来优化线段与 `AABB` 的相交测试。然而，掌握这种方法需要额外的数学支持。这是 Christer Ericson\
  \ 书中讨论的许多主题之一，该书列在本章末尾的“延伸阅读”部分中。\n\n### 动态物体\n\n到目前为止涵盖的相交测试都是`瞬时`（instantaneous）测试。在游戏中，这意味着你在测试两个物体是否在当前帧上相交。![Image1187](img/index-691.jpg)\
  \ 考虑角色向纸射射子弹的情况。假设你对弹药使用边界球体，对纸张使用盒子。在每一帧中，你都测试弹药是否与纸相交。由于弹药移动速度很快，不太可能在某个特定帧弹药恰好与纸相交。这意味着瞬时测试会漏掉交点，正如\
  \ 图 10.12 所示。\n\n**图 10.12 帧 0 和帧 1 上的瞬时测试**\n\n对于子弹的特定示例，你可以通过将弹药表示为线段来解决这个问题。线段的起点是弹药在上一帧的位置，终点是本帧的位置。这样，你就可以检测弹药在上一帧和本帧之间的任何点上是否与纸相交。然而，这之所以行得通是因为弹药非常小。你无法用线段表示更大的物体。对于某些类型的移动物体（例如两个球体），你可以直接求解相交时间。对于其他类型的移动物体，你可以尝试在帧与帧之间的多个点对相交进行采样。`连续碰撞检测\
  \ (CCD)` 术语可以指直接求解交点，也可以对交交进行采样。为了体验如何直接求解相交时间，请考虑两个移动球体之间的相交情况。这种相交被称为`扫掠球相交`（swept-sphere\
  \ intersection），它恰好出现在视频游戏公司的面试题中。对于每个球体，你拥有上一帧和本帧的中心位置。你可以使用与线段相同的参数方程来表示这些位置，上一帧的位置为\
  \ `t = 0`，本帧的位置为 `t = 1`。\n\n[/content]\n\n```\nif (t >= 0.0f && t <= 1.0f)\n{\n\
  \    out.emplace_back(t);\n    return true;\n}\nelse\n{\n    ![Image 1183](img/index-688_1.jpg)\n\
