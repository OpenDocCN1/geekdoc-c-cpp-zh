  \ 1333      ![Image 1334](img/index-792_2.jpg)\n      \"bindpose\": {\n        \"\
  rot\": [0.000000, 0.000000, 0.000000, 1.000000],\n        \"trans\": [0.000000,\
  \ 0.000000, 0.000000]\n      }\n    },\n    {\n      \"name\": \"pelvis\",\n   \
  \   \"parent\": 0,\n      \"bindpose\": {\n        \"rot\": [0.001285, 0.707106,\
  \ -0.001285, -0.707106],\n        \"trans\": [0.000000, -1.056153, 96.750603]\n\
  \      }\n    }\n  ]\n}\n```\n\n### 逆绑定姿态矩阵（Inverse Bind Pose Matrix）\n\n有了存储在骨架中的局部绑定姿态信息，你可以像之前所示容易地计算每个骨骼的全局姿态矩阵。给定骨骼坐标空间中的一个点，乘以此全局姿态矩阵会将该点变换到对象空间。这假设骨架处于绑定姿态。\n\
  \n骨骼的**逆绑定姿态矩阵**简单来说就是全局姿态矩阵的逆矩阵。给定对象空间中的一个点，将其乘以逆绑定姿态矩阵会将该点变换到骨骼的坐标空间。这实际上非常有用，因为模型的顶点位于对象空间中，而模型的顶点处于绑定姿态。因此，逆绑定姿态矩阵允许你将顶点从模型转换为特定骨骼的坐标空间（绑定姿态下）。\n\
  \n例如，你可以通过这个计算脊柱骨的全局姿态矩阵：其逆绑定姿态矩阵如下：计算逆绑定姿态矩阵最简单的方法分两次进行。首先，使用上一节的乘法步骤计算每根骨骼的全局姿态矩阵。其次，对这些矩阵中的每一个求逆以得到逆绑定姿态。由于每根骨骼的逆绑定姿态矩阵永远不变，你可以在加载骨架时计算这些矩阵。\n\
  \n#### 动画数据\n\n就像你通过每根骨骼的局部姿态来描述骨架的绑定姿态一样，你可以描述任何任意姿态。正式地说，骨架的当前姿态只是每根骨骼局部姿态的集合。**动画**随后就是随时间播放的姿态序列。与绑定姿态一样，你可以根据需要将这些局部姿态转换为全局姿态矩阵。\n\
  \n你可以使用骨骼变换的二维动态数组来存储这种动画数据。在这种情况下，行对应骨骼，列对应动画的帧。\n\n\n\n\n\n按帧存储动画的一个问题是，动画的帧率可能与帧的帧率不对应。例如，游戏可能以\
  \ 60 FPS 更新，但动画可能以 30 FPS 更新。如果动画代码记录了动画的持续时间，那么在每一帧中，你都可以通过 `delta time` 来更新它。然而，有时会出现游戏需要在两个不同的帧之间显示动画的情况。为了支持这一点，你可以为\
  \ `BoneTransform` 添加一个静态的 `Interpolate` 函数：\n\n**点击此处查看代码**\n\n![Image 1335](img/index-795_1.jpg)\n\
  \n![Image 1336](img/index-795_2.jpg)\n\n```cpp\nBoneTransform BoneTransform::Interpolate(const\
  \ BoneTransform& a, const BoneTransform& b, float f)\n{\n    BoneTransform retVal;\n\
  \    retVal.mRotation = Quaternion::Slerp(a.mRotation, b.mRotation, f); \n    retVal.mTranslation\
  \ = Vector3::Lerp(a.mTranslation, b.mTranslation, f);\n    return retVal;\n}\n```\n\
  \n那么，如果游戏必须在两个不同的帧之间显示状态，你可以对每个骨骼的变换进行插值以获取当前的局部姿态。\n\n### 蒙皮 (Skinning)\n\n`Skinning`\
  \ 涉及将 3D 模型中的顶点与相应骨架中的一个或多个骨骼关联。（这与非动画语境下的 *skinning* 术语不同。）然后，在绘制顶点时，任何关联骨骼的位置和朝向都会\
  \ `influence`（影响）顶点的位置。因为模型的蒙皮在游戏过程中不会改变，因此蒙皮信息是每个顶点的一个属性。\n\n在蒙皮的典型实现中，每个顶点可以与多达四根不同的骨骼关联。这些关联中的每一个都有一个权重，该权重指定了四根骨骼中每一个对顶点的影响程度。这些权重的和必须为为\
  \ 1。例如，脊椎骨和左髋骨可能会影响角色躯干左下部分的顶点。如果该顶点更靠近脊椎，那么它脊椎骨的权重可能是 0.7，髋骨的权重为 0.3。如果一个顶点只有一个骨骼影响它（这很常见），那么这根骨骼的权重简单为\
  \ 1.0。\n\n目前，不必担心如何为骨骼和蒙皮权重添加这些额外的顶点属性。相反，考虑一个仅受一个骨骼影响的顶点的示例。记住，存储在顶点缓冲区中的顶点是在对象空间中的，而模型处于绑定姿态（bind\
  \ pose）中。但如果你想以任意姿态 `P` 绘制模型，你必须将每个顶点从对象空间的绑定姿态转换到当前姿态 `P` 的对象空间中。\n\n为了让这个例子更具体，假设顶点\
  \ `v` 的唯一骨骼影响是脊椎骨。你已经通过早些的计算知道了脊椎骨的反向绑定姿态矩阵。此外，从动画数据中，你可以计算出当前姿态 `P` 下脊椎的全局姿态矩阵。要将\
  \ `v` 转换到当前姿态的对象空间，你首先将其转换到绑定姿态下脊椎的局部空间。然后你将其转换到当前姿态的对象空间。在数学上，它看起来像这样：\n\n现在，假设\
  \ `v` 有两个骨骼影响：脊椎的权重为 0.75，左髋的权重为 0.25。在这种情况下，计算当前姿态下的 `v`，你需要分别计算每根骨骼的当前姿态顶点位置，然后使用这些权重在它们之间插值：\n\
  \n你可以类似地扩展具有四根不同骨骼影响的顶点的计算。\n\n某些骨骼（如脊椎）影响角色模型上的数百个顶点。对于这些每个顶点，重新计算脊椎的反向绑定姿态矩阵与当前姿态矩阵之间的乘法是冗余的。在单帧内，此结果的结果永远不会改变。解决方案是创建一个名为\
  \ `matrix palette`（矩阵调色板）的矩阵数组。该数组中的每个索引包含对应索引骨骼的反向绑定姿态矩阵与当前姿态矩阵相乘的结果。\n\n例如，如果脊椎在骨骼数组中的索引为\
  \ 1，那么矩阵调色板的索引 1 就包含以下：任何受脊椎影响的顶点都可以使用调色板中预计算的矩阵。对于仅受脊椎影响的顶点，其变换后的位置如下：\n\n使用此矩阵调色板每帧可以节省数千次额外的矩阵乘法。\n\
  \n#### 实现骨骼动画\n\n在建立数学基础后，你现在可以为游戏添加骨骼动画支持。首先，你添加对蒙皮模型所需的额外顶点属性（骨骼影响和权重）的支持，然后以绑定姿态绘制模型。接下来，你添加加载骨骼的支持，并计算每根骨骼的反向绑定姿态。然后，你可以计算动画的当前姿态矩阵并保存矩阵调色板。这允许你在动画的第一帧绘制模型。最后，你添加根据\
  \ `delta time` 更新动画的支持。\n\n#### 使用蒙皮顶点属性绘图\n\n尽管使用不同的顶点属性绘制模型看起来很直接，但在第 6 章“3D 图形”中编写的若干代码假设了单一顶点布局。记住，到为止，所有\
  \ 3D 模型都使用了包含位置、法线和纹理坐标的顶点布局。为了添加新的顶点属性，你需要进行相当数量的修改。首先，创建一个名为 `Skinned.vert` 的新着色器。不需要\
  \ C++，因为你仍然需要用第 6 章“3D 图形”中的 Phong 着色器来着光。因此，你必须将 `Skinned.vert` 中的顶点布局更改如下：**点击此处查看代码**\n\
  \n```glsl\nlayout(location = 0) in vec3 inPosition;\nlayout(location = 1) in vec3\
  \ inNormal;\nlayout(location = 2) in uvec4 inBones;\nlayout(location = 3) in vec4\
  \ inSkinWeights;\nlayout(location = 4) in vec2 inTexCoord;\n```\n\n![Image 1337](img/index-800_1.jpg)\n\
  \n![Image 1338](img/index-800_2.jpg)\n\n这组声明表示你期望顶点布局具有位置、法线、影响顶点的四个无符号整数、这些影响的四个浮点数以及纹理坐标。之前的顶点布局——位置、法线和纹理坐标——所有值都使用单精度浮点数（每个\
  \ 4 字节）。因此，旧的顶点布局大小为 32 字节。如果你对蒙皮权重使用单精度浮点数并对骨骼使用完整的 32 位整数，这将额外 32 字节，使每个顶点的大小翻倍。\n\
  \n相反，你可以将模型中的骨骼数量限制为 256 个。这意味着每个骨骼影响只需要 0 到 255 的范围——每个一个字节。这使得 `inBones` 的大小从\
  \ 16 字节减少到 4 字节。此外，你还可以指定蒙皮权重也在 0 到 255 的范围内。OpenGL 随后可以将此 0–255 范围转换为归一化的浮点数范围\
  \ 0.0–1.0。这使得 `inSkinWeights` 的大小也减少到 4 字节。这意味着总共每个顶点的大小将是原始的 32 字节，加上用于骨骼和权重的额外\
  \ 8 字节。图 12.3 描述了这种布局。\n\n![Image 1339](img/index-801_1.jpg)\n\n![Image 1340](img/index-801_2.jpg)\n\
  \n\n\n\n\n![Image 1341](img/index-801_3.jpg)\n\n**图 12.3** 带有骨骼影响和权重顶点布局\n\n为了减少\
  \ `inSkinBones` 和 `inSkinWeights` 的内存占用，你不需要对色器代码进行任何更改。相反，你需要在 C++ 代码中定义顶点数组属性时，指定这些属性的预期大小。回想第\
  \ 5 章“OpenGL”，顶点数组属性的定义发生在 `VertexArray` 构造函数中。\n\n为了支持不同的顶点布局，你需要在 `VertexArray.h`\
  \ 中的 `VertexArray` 类声明中添加一个新枚举：\n\n```cpp\nenum Layout\n{\n  PosNormTex,\n  PosNormSkinTex\n\
  };\n```\n\n然后，你修改 `VertexArray` 构造函数，使其接受 `Layout` 作为参数。接着，在构造函数的代码中，检查布局以确定如何定义顶点数组属性。对于\
  \ `PosNormTex` 情况，你使用之前写的顶点属性代码。否则，如果布局是 `PosNormSkinTex`，则按照列表 12.2.(index_split_005.html_p802)\
  \ 定义布局。\n\n**列表 12.2** 在 VertexArray 构造函数中声明顶点属性\n\n**点击此处查看代码图像**\n\n```cpp\nif\
  \ (layout == PosNormTex) \n{ /* 来自第 6 章... */ } \nelse if (layout == PosNormSkinTex)\
  \ \n{\n  // 位置是 3 个 float\n  glEnableVertexAttribArray(0);\n  glVertexAttribPointer(0,\
  \ 3, GL_FLOAT, GL_FALSE, vertexSize, 0);\n  // 法线是 3 个 float\n  glEnableVertexAttribArray(1);\n\
  \  glVertexAttribPointer(1, 3, GL_FLOAT, GL_FALSE, vertexSize, reinterpret_cast<void*>(sizeof(float)\
  \ * 3));\n\n  // 骨骼骨骼（保持为 int）\n  glEnableVertexAttribArray(2);\n  glVertexAttribIPointer(2,\
  \ 4, GL_UNSIGNED_BYTE, vertexSize, reinterpret_cast<void*>(sizeof(float) * 6));\n\
  \  // 骨骼权重（转换为 float）\n  glEnableVertexAttribArray(3);\n  glVertexAttribPointer(3,\
  \ 4, GL_UNSIGNED_BYTE, GL_TRUE, vertexSize, reinterpret_cast<void*>(sizeof(float)\
  \ * 6 + 4));\n  // 纹理坐标\n  glEnableVertexAttribArray(4);\n  glVertexAttribPointer(4,\
  \ 2, GL_FLOAT, GL_FALSE, vertexSize, reinterpret_cast<void*>(sizeof(float) * 6 +\
  \ 8));\n}\n```\n\n![Image 1342](img/index-803_1.jpg)\n![Image 1343](img/index-803_2.jpg)\n\
  \n前两个属性（位置和法线）的声明与第 6 章相同。回想 `glVertexAttribPointer` 的参数是：属性编号、属性中的元素数量、属性类型（在内存中）、OpenGL\
  \ 是否应该对值进行归一化、每个顶点的大小（或步长）以及从顶点开始到该属性的字节偏移。因此，位置和法线都是三个 float 值。\n\n接下来，你定义了骨骼骨骼和权重属性。对于骨骼，你使用\
  \ `glVertexAttribIPointer`，它用于色器中为整数的值。由于 `inSkinBones` 的定义使用了四个无符号整数，你必须使用 `AttribIPointer`\
  \ 函数而不是普通的 `Attrib` 版本。在这里，你指定每个整数都是一个无符号字节（0 到 255）。对于权重，你指定每个权重在内存中存储为无符号字节，但你希望将这些无符号字节转换为\
