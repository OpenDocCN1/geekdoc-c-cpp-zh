  \ `Draw3DScene` 函数，其骨架位于 Listing 13.3 中。\n\n`Draw3DScene` 函数接收 framebuffer 的 ID、视图矩阵、投影矩阵以及视口的缩放。视口大小让\
  \ OpenGL 知道正在写入的 framebuffer 目标的实际大小。因此，在这里你需要一个视口缩放参数，以便普通 framebuffer 使用全屏宽度和高度，而镜子可以使用其四分之一的大小。你使用\
  \ `glViewport` 调用根据屏幕宽/高和缩放将视口设置为正确的大小。\n\n绘制网格的代码与 第 6 章 “[3D 图形，”相同，绘制骨骼网格的代码与\
