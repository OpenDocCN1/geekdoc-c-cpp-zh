  \n### 列表 11.8 `HUD::UpdateRadar` 实现\n\n`点击此处查看代码图片**\n\n```cpp\nvoid HUD::UpdateRadar(float\
  \ deltaTime)\n{\n    // 清除上一帧的信号点位置\n    mBlips.clear();\n\n    // 将玩家位置转换为雷达坐标系（x\
