  \n解引用空指针会导致程序崩溃。错误信息取决于操作系统，但通常在解引用空指针时会发生“访问违规”（access violation）或“段错误”（segmentation\
  \ fault）错误。\n\n### 数组\n\n**数组**是多个相同类型元素的集合。以下代码声明了一个名为 `a` 的 10 个整数的数组，并将数组中的第一个元素（索引\
  \ 0）设置为 `50`：\n\n```cpp\nint a[10];\na[0] = 50;\n```\n\n默认情况下，数组中的元素是未初始化的。虽然你可以手动初始化数组中的每个元素，但使用初始化语法或循环会更方便。初始化语法使用大括号，如下：\n\
  \n```cpp\nint fib[5] = { 0, 1, 1, 2, 3 };\n```\n\n或者，你可以使用循环。以下代码将数组中 50 个元素中的每一个都初始化为\
  \ `0`：\n\n```cpp\nint array[50];\nfor (int i = 0; i < 50; i++)\n{\n    array[i]\
  \ = 0;\n}\n```\n\n![Image 1614](img/index-977_1.jpg)\n![Image 1615](img/index-977_2.jpg)\n\
