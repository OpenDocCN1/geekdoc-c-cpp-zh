  \ Math::Pi));\n    }\n    else\n    {\n        // 绕叉积得到的轴进行旋转\n    }\n}\n```\n\n\
  \n\n\n```cpp\nVector3 axis = Vector3::Cross(Vector3::UnitX, forward); axis.Normalize();\n\
  \nSetRotation(Quaternion(axis, angle));\n\n}\n\n}\n```\n\n接下来，你创建一个 `BallActor`\
