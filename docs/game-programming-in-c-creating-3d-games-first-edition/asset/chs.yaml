  **图 13.7** 左下角带有后视镜的游戏\n\n## 延迟渲染 (DEFERRED SHADING)\n\n回想一下在第 6 章中实现的 Phong 光照在绘制网格时会为每个片元执行光照计算。这种类型光照计算的伪代码如下：\n\
  \n**点击此处查看代码图片**\n\n```\nforeach Mesh m in Scene\n  foreach Pixel p to draw from\
  \ m\n    if p passes depth test\n      foreach Light li that effects p\n       \
  \ color = Compute lighting equation(li, p)\n      Write color to framebuffer\n```\n\
  \n![Image 1422](img/index-866_1.jpg)\n![Image 1423](img/index-866_2.jpg)\n\n###\
  \ 前向渲染 (Forward Rendering)\n\n这种执行光照计算的方法被称为**前向渲染**，它适用于光源较少的情况。例如，目前的游戏只有一个方向光，因此前向渲染渲染工作得非常完美。然而，考虑一个发生在城市夜晚的游戏。对于这样的游戏，单一的方向光无法产生令人信服的夜景。相反，你可能需要几十个光源，用于路灯、汽车大灯、建筑内部灯等。遗憾的是，前向渲染在这种情况下扩展性不佳。你需要计算数量级为\
  \ `O(m · p · li)` 的光照方程，这意味着每增加几个光源，就会显著增加光照计算量。\n\n### 延迟渲染 (Deferred Shading)\n\
  \n另一种方法是创建一系列纹理，合称为**G 缓冲区 (G-buffer)**，用于存储场景中可见表面的信息。该 G-buffer 可能包含场景中可见表面的漫反射颜色（反照）、反射光力和法线。然后你通过两个通道来渲染场景。首先，你遍历每个网格并将它们的表面属性渲染到\
  \ G-buffer 中。然后，在第二个通道中，你遍历每个光源，并根据这些光源以及 G-buffer 中的内容计算光照方程。以下伪代码实现了这一过程：\n\n\
  **点击此处查看代码图片**\n\n```\nforeach Mesh m in Scene\n  foreach Pixel p1 to draw from\
  \ m\n    if p passes depth test\n      Write surface properties of p1 to G-buffer\n\
  \      foreach Light li in the scene\n        foreach Pixel p2 affected by li\n\
  \          s = surface properties from the G-buffer at p2\n          color = Compute\
  \ lighting equation (l, s)\n        Write color to framebuffer\n```\n\n![Image 1424](img/index-867_1.jpg)\n\
  ![Image 1425](img/index-867_2.jpg)\n\n注意这种双通道方法的复杂度为 `O(m · p * (1 + li · p) / 2)`。这意味着与前向渲染相比，你可以在场景中支持多得多的光源。由于有两个通道，且屏幕上片元的着色直到第二个通道才会发生，因此这种技术被称为**延迟渲染**（deferred\
  \ shading）或**延迟渲染**（deferred rendering）。\n\n### 实现 (Implementation)\n\n实现延迟渲染需要几个步骤。首先，你必须设置一个支持多个输出纹理的帧缓冲区对象（framebuffer\
  \ object）。然后，你必须创建将表面属性写入 G-buffer 的片元着色器。接着，你绘制一个覆盖整个屏幕的正方形，并从 G-buffer 采样以输出全局光照的结果（如方向光和环境光）。\n\
  \n![Image 1426](img/index-868_1.jpg)\n![Image 1427](img/index-868_2.jpg)\n![Image\
  \ 1428](img/index-868_3.jpg)\n![Image 1429](img/index-868_4.jpg)\n![Image 1430](img/index-868_5.jpg)\n\
  ![Image 1431](img/index-868_6.jpg)\n![Image 1432](img/index-868_7.jpg)\n![Image\
  \ 1433](img/index-868_8.jpg)\n![Image 1434](img/index-868_9.jpg)\n![Image 1435](img/index-868_10.jpg)\n\
  最后，你设置了帧缓冲区。\n\n## 创建 G-buffer 类\n\n由于 G-buffer 对象的实现比之前的要复杂得多，因此将帧缓冲区及其相关的纹理封装到一个类中是明智的。\n\
  \n> **注意**\n> G-buffer 存储了不同类型的数据。G-buffer 对象的实现比之前的要复杂得多，因此将帧缓冲区及其相关的纹理封装到一个类中是明智的。G-buffer\
  \ 存储了不同类型的数据。参考列表 13.6。\n\n### 列表 13.6：GBuffer 声明\n\n```cpp\nclass GBuffer\n{\n\
  public:\n  // G-buffer 数据类型\n  enum Type {\n    EDiffuse = 0,\n    ENormal,\n  \
  \  EWorldPos,\n    NUM_BUFFER_TEXTURES\n  };\n\n  GBuffer();\n  ~GBuffer();\n\n\
  \  bool Create(int width, int height);\n  void Destroy();\n\n  // 获取类型的纹理\n  Texture*\
  \ GetTexture(Type type);\n\n  // 获取帧缓冲区 ID\n  unsigned int GetBufferID() const {\
  \ return mBufferID; }\n\n  // 设置纹理\n  void SetTextures();\n\nprivate:\n  // 与 G-buffer\
  \ 相关的纹理\n  std::vector<Texture*> mTextures;\n\n  // 帧缓冲区 ID\n  unsigned int mBufferID;\n\
  };\n```\n\n### 列表 13.7：GBuffer 实现\n\n```cpp\nbool GBuffer::Create(int width, int\
  \ height)\n{\n  // 创建帧缓冲区并保存 mBufferID\n  // ...\n  // 添加一个深度缓冲区\n  // ...\n  //\
  \ 为每个输出创建纹理\n  for (int i = 0; i < NUM_BUFFER_TEXTURES; i++)\n  {\n    Texture*\
  \ tex = new Texture();\n    // 我们每个纹理都需要 32 位浮点组件\n    tex->CreateRendering(width,\
  \ height, GL_RGB32F);\n    mTextures.push_back(tex);\n    // 将此纹理挂接到颜色输出\n    glFramebufferTexture(GL_FRAMEBUFFER,\
  \ GL_COLOR_ATTACHMENT + i, tex->GetTextureID(), 0);\n  }\n\n  // 创建附件向量\n  std::vector<GLenum>\
  \ attachments;\n  for (int i = 0; i < NUM_BUFFER_TEXTURES; i++)\n  {\n    attachments.emplace_back(GL_COLOR_ATTACHMENT\
  \ + i);\n  }\n\n  // 设置渲染到的缓冲区列表\n  glDrawBuffers(static_cast<GLsizei>(attachments.size()),\
  \ attachments.data());\n\n  // 确保一切工作正常\n  if (glCheckFramebufferStatus(GL_FRAMEBUFFER)\
  \ != GL_FRAMEBUFFER_COMPLETE)\n  {\n    Destroy();\n    return false;\n  }\n\n \
  \ return true;\n}\n```\n\n\n\n`glFramebufferTexture` 调用。该代码利用了 OpenGL 中颜色附件的定义是连续数字这一事实。\n\
  \n### 注意事项\n\n尽管 `GL_RGB32F` 为 G-buffer 中的值提供了很高的精度，但代价是 G-buffer 占用了大量的显存。在 1024×768（你的屏幕分辨率）的分辨率下，三个\
  \ `GL_RGB32F` 纹理会在 GPU 上占用 27 MB 内存。为了减少内存占用，许多游戏转而使用 `GL_RGB16F`（三路半精度浮点数），这将使内存占用减半。\n\
  \n你还可以通过其他技巧进一步优化内存使用。例如，由于法线的长度为单位长度，给定 `x` 和 `y` 分量以及 `z` 分量的符号，你就可以求解出 `z` 分量。这意味着你可以将法线存储在\
  \ `GL_RG16F` 格式（两个半精度浮点数）中，并在之后推导出 `z` 分量。为了简单，本章没有实现这些优化，但你应该知道许多商业游戏都使用了此类技巧。\n\
  \n然后，你创建一个包含所有不同颜色附件的向量，并调用 `glDrawBuffers` 来设置 G-buffer 的纹理附件。最后，你验证创建 G-buffer\
  \ 是否成功。如果失败，`Destroy` 函数将删除所有关联纹理并销毁帧缓冲对象。\n\n接下来，你在 `Renderer` 的成员数据中添加了一个 `GBuffer`\
  \ 指针：\n\n![Image 1446](img/index-874_1.jpg)\n\n![Image 1447](img/index-874_2.jpg)\n\
  \n![Image 1448](img/index-874_3.jpg)\n\n![Image 1449](img/index-874_4.jpg)\n\n```cppclass\
  \ GBuffer* mGBuffer;\n```\n\n然后在 `Renderer::Initialize` 中，你创建了 `GBuffer` 对象并将其设置为屏幕的宽度/高度：\n\
  \n**点击此处查看代码图片**\n\n```cpp\nmGBuffer = new GBuffer();\nint width = static_cast<int>(mScreenWidth);\n\
  int height = static_cast<int>(mScreenHeight);\nif (!mGBuffer->Create(width, height))\n\
  {\n    SDL_Log(\"Failed to create G-buffer.\");\n    return false;\n}\n```\n\n在\
  \ `Renderer::Shutdown` 中，你添加了调用 `mGBuffer` `Destroy` 成员函数的代码。\n\n#### 写入 G-buffer\n\
  \n现在你已经有了 G-buffer，需要向其中写入数据。回想网格渲染目前使用 Phong 片元着色器将最终（完全光照）的颜色写入默认帧缓冲区。然而，这与延迟渲染的方法背道而驰。你需要创建一个新的片元着色器，将表面属性写入\
  \ G-buffer。\n\n另一个区别是，之前的每个片元着色器只写入一个输出值。然而，片元着色器可以有多个输出值，或者说“多个渲染目标”（multiple render\
  \ targets）。这意味着写入 G-buffer 中的每个纹理只需写入每个正确的输出即可。事实上，片元着色器 `main` 函数的 GLSL 代码与你在书中之前看到的片元着色器代码相比相对简单。你从纹理中采样漫反射颜色，并直接将法线和世界位置传递给\
  \ G-buffer。\n\nListing 13.8 提供了 `GBufferWrite.frag` 的完整 GLSL 代码。注意你为三个不同的 G-buffer\
  \ 纹理声明了三个不同的 `out` 值。你还为每个输出指定了布局位置（layout locations）；这些数字与创建 G-buffer 时指定的颜色附件索引对应。\n\
  \n**Listing 13.8** GBufferWrite.frag Shader Shader\n\n**点击此处查看代码图片**\n\n```glsl\n\
