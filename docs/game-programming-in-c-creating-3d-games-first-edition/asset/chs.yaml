  \ 1472](img/index-879_10.jpg)\n\n![Image 1473](img/index-879_11.jpg)\n\n![Image\
  \ 1474](img/index-879_12.jpg)\n\n![Image 1475](img/index-879_13.jpg)\n\n\n\n\n方向光。基本原理是在默认帧缓冲区中绘制一个与屏幕大小相同的四边形（quad）。对于该四边形的每个片段（fragment），你从\
  \ G-buffer 中采样表面属性。然后，使用这些表面属性，你可以计算与第 6 章中相同的 Phong 光照方程来照亮该片段。\n\n首先，你在 GLSL 中创建一个用于从\
  \ G-buffer 进行全局光亮的顶点着色器和片元着色器。由于你最终是在屏幕上绘制一个四边形，因此顶点着色器与第 5 章.中的精灵顶点着色器完全相同。如代码列表\
  \ 13.9，所示，片元着色器与 Phong 片元着色器有些不同之处。\n\n首先，来自顶点着色器的唯一输入是纹理坐标。这是因为片段处的法线和世界位置都在 G-buffer\
  \ 中。接下来，你为 G-buffer 中的三种不同纹理（漫反射颜色、法线和世界位置）添加三个 `sampler2D` 统一变量。在片元着色器的 `main`\
  \ 函数中，你从 G-buffer 纹理中采样漫反射颜色、法线和世界位置。这结合方向光统一变量（如第 6 章所示），提供了使用 Phong 反射模型的环境光和漫反射分量照亮片段所需的所有信息。你无法计算高光分量，因为这取决于每个表面的高光系数（specular\
  \ power），而你目前没有在 G-buffer 中存储高光信息。（在练习 13.1 中你将探索添加高光分量。）\n\n计算完 Phong 环境光和漫反射分量后，你将表面的漫反射颜色（来自\
  \ G-buffer）相乘，以计算像素的最终颜色。\n\n### 代码列表 13.9 GBufferGlobal.frag 着色器\n**点击此处查看代码图像**\n\
  \n```glsl\n#version 330\n\n// 来自顶点着色器的输入\nin vec2 fragTexCoord; // 纹理坐标\nlayout(location\
  \ = 0) out vec4 outColor;\n\n// 来自 G-buffer 的不同纹理\nuniform sampler2D uGDiffuse;\n\
  uniform sampler2D uGNormal;\n\n![Image 1471](img/index-881_1.jpg)\n![Image 1472](img/index-881_2.jpg)\n\
  uniform sampler2D uGWorldPos;\n\n// 光照统一变量（如第 6 章所示）\n// ...\n\nvoid main()\n{\n\
  \    // 从 G-buffer 采样漫反射颜色、法线、世界位置\n    vec3 gbufferDiffuse = texture(uGDiffuse,\
  \ fragTexCoord).xyz;\n    vec3 gbufferNorm = texture(uGNormal, fragTexCoord).xyz;\n\
  \    vec3 gbufferWorldPos = texture(uGWorldPos, fragTexCoord).xyz;\n\n    // 计算\
  \ Phong 光照（如第 6 章所示，减去高光）\n    // ...\n\n    // 最终颜色是漫反射颜色乘以 Phong 光\n    outColor\
  \ = vec4(gbufferDiffuse * Phong, 1.0);\n}\n```\n\n写好全局光照顶点和片元着色器代码后，下一步是在 `Renderer`\
  \ 类中加载这些着色器。你创建了一个名为 `mGGlobalShader` 的 `Shader` 成员变量，并在 `LoadShader` 函数中实例化它。在代码列表\
  \ 13.10 所示的代码中，你首先加载顶点着色器和片元着色器文件。然后，你为着色器设置了一些统一变量。`SetIntUniform` 调用将片元着色器中的三个\
  \ `sampler2D` 统一变量每一个与特定的纹理索引关联。第一次 `SetMatrixUniform` 调用将视图-投影矩阵设置为与精灵视图-投影矩阵相同（因为你正在绘制一个四边形）。第二次调用设置世界变换，将四边形缩放至整个屏幕并反转\
  \ y 轴（以解决 y 轴反转的问题，当将镜像纹理绘制到屏幕时也是）。\n\n### 代码列表 13.10 加载 G-buffer 全局光照着色器\n**点击此处查看代码图像**\n\
  \n```cpp\nmGGlobalShader = new Shader();\nif (!mGGlobalShader->Load(\"Shaders/GBufferGlobal.vert\"\
  , \"Shaders/GBufferGlobal.frag\"))\n{\n    return false;\n}\n\n// 对于 GBuffer，我们需要将每个\
  \ sampler 与索引关联\n![Image 1473](img/index-883_1.jpg)\n![Image 1474](img/index-883_2.jpg)\n\
  mGGlobalShader->SetActive();\nmGGlobalShader->SetIntUniform(\"uGDiffuse\", 0);\n\
  mGGlobalShader->SetIntUniform(\"uGNormal\", 1);\nmGGlobalShader->SetIntUniform(\"\
  uGWorldPos\", 2);\n\n// 视图投影就是精灵的\nmGGlobalShader->SetMatrixUniform(\"uViewProj\"\
  , spriteViewProj);\n\n// 世界变换缩放到屏幕并翻转 y\nMatrix4 gbufferWorld = Matrix4::CreateScale(mScreenWidth,\
  \ -mScreenHeight, 1.0f);\nmGGlobalShader->SetMatrixUniform(\"uWorldTransform\",\
  \ gbufferWorld);\n```\n\n接下来，你在 `GBuffer` 类中添加一个函数，为 G-buffer 激活每个纹理：**点击此处查看代码图像**\n\
  \n```cpp\nvoid GBuffer::SetTexturesActive()\n{\n    for (int i = 0; i < NUM_GBUFFER;\
  \ i++)\n    {\n        Textures[i]->SetActive();\n        ![Image 1475](img/index-884_1.jpg)\n\
  \        ![Image 1476](img/index-884_2.jpg)\n    }\n}\n```\n\n\n\n![Image 1481](img/index-887_1.jpg)\n\
  \n**图 13.9** 通过延迟着色计算全局光的场景\n\n### 添加点光源\n\n回想一下使用延迟着色的主要原因之一是，随着场景中光源数量的增加，它的扩展性非常好。本节将讨论如何添加对许多非全局光照的支持。\n\
  \n假设游戏中有 100 个不同的点光源。你可以在着色器中创建一个统一数组（uniform array），存储所有这些点光源的信息，包括位置、颜色、半径等。然后，\
  \ `GBufferGlobal.frag` 着色器代码中，你可以对这些点光源进行循环。使用 G-buffer 采样的世界位置，你可以判断片段是否在点光源的范围内，如果是，则为该片段计算\
  \ Phong 方程。\n\n尽管这种方法可行，但它也存在一些问题。你需要对每个片段与每个点光源进行测试，即使对于那些远远远离片段的光源也是如此。这意味着着色器代码中有大量的条件检查，这是非常开销的。\n\
  \n这些问题的解决方案是改用光照几何体，即表示光源的网格（meshes）。因为点光源具有半径，其对应的光照几何体是放置在世界中的球体。绘制这个球体会为球体接触到的每个片段触发片段着色器调用。使用来自\
  \ G-buffer 的世界位置信息，你可以计算光照到片段的强度。\n\n### 添加 PointLightComponent 类\n\n对于点光源，你可以创建一个组件，以便方便地附加到任何执行体（actor）上移动光源。首先，你声明\
  \ `PointLightComponent` 类，如列表 13.12\n\n![Image 1483](img/index-889_2.jpg)\n\n**列表\
  \ 13.12** PointLightComponent \n\n**点击此处查看代码图像**\n\n```cpp\nclass PointLightComponent\n\
  {\npublic:\n    PointLightComponent(class Actor* owner);\n    ~PointLightComponent();\n\
  \    // 将此点光源作为几何体进行绘制\n    void Draw(class Shader* shader, class Mesh* mesh);\n\
  \    // 漫反射色\n    Vector3 mDiffuseColor;\n    // 光的半径\n    float mInnerRadius;\n\
  \    float mOuterRadius;\n};\n```\n\n然后，你向 `Renderer` 类添加一个名为 `mPointLights` 的 `PointLightComponent`\
  \ 指针向量（vector）。`PointLightComponent` 的构造函数将光源添加到 `mPointLights` 中，而析构函数则从向量中移除光源。\n\
  \n### 点光源片段着色器\n\n下一步是创建一个 `GBufferPointLight.frag` 片段着色器文件。与 `GBufferGlobal.frag`\
  \ 着色器一样，你需要为三个不同的 G-buffer 纹理声明三个不同的 `sampler2D` uniform。然而，与全局光照着色器不同，你需要存储关于特定点光源的信息。你声明了一个\
  \ `PointLight` 结构体，并为此添加了 `uPointLight` uniform。你还添加了一个 uniform `uScreenDimensions`，用于存储屏幕的宽/高：\n\
  \n**点击此处查看代码图像**\n\n```cpp\n// 用于 GBufferPointLight.frag 的额外 uniforms\nstruct PointLight\n\
  {\n    // 光源位置\n    vec3 mWorldPos;\n    // 漫反射色\n    vec3 mDiffuseColor;\n    //\
  \ 光的半径\n    float mInnerRadius;\n![Image 1484](img/index-891_1.jpg)\n![Image 1485](img/index-891_2.jpg)\n\
  \    float mOuterRadius;\n};\n\nuniform PointLight uPointLight;\n// 存储屏幕的宽/高\nuniform\
  \ vec2 uScreenDimensions;\n```\n\n着色器的 `main` 函数（在列表 13.13 中给出）与全局光着色器有几处不同。对于你为全局光绘制的四形（quad），你可以直接使用四形的纹理坐标正确采样到\
  \ G-buffer。然而，使用点光源球体网格的纹理坐标将无法得到用于采样 Gbuffer 的正确 UV 。相反，你可以使用 `gl_FragCoord`，这是一个内置\
  \ GLSL 变量，包含片段在屏幕空间中的位置。在这种情况下，你只关心 `x` 和 `y` 坐标。但由于 UV 坐标的范围是 `[0, 1]$`，你需要将屏幕空间坐标除以屏幕尺寸。在这种情况下，除法运算符是分量除法（component-wise\
  \ division）。\n\n一旦有了正确的 UV 坐标，你就使用它们从 G-buffer 中采样漫反射、法线和世界位置。接下来，你像之前的 Phong 片段着色器中一样计算\
  \ `N` 和 `L` 向量。\n\n**列表 13.13** GBufferPointLight.frag Main Function\n\n**点击此处查看代码图像**\n\
  \n```glsl\nvoid main()\n{\n    // 计算采样到 G-buffer 的坐标\n    vec2 gbufferCoord = gl_FragCoord.xy\
  \ / uScreenDimensions;\n    // 从 G-buffer 采样\n    vec3 gbufferDiffuse = texture(uGDiffuse,\
  \ gbufferCoord).xyz;\n    vec3 gbufferNorm = texture(uGNormal, gbufferCoord).xyz;\n\
  \    vec3 gbufferWorldPos = texture(uGWorldPos, gbufferCoord).xyz;\n    // 计算法线和来自光的向量\n\
  \    vec3 N = normalize(gbufferNorm);\n    vec3 L = normalize(uPointLight.mWorldPos\
  \ - gbufferWorldPos);\n    // 计算光源的漫反射分\n    vec3 Phong = vec3(0.0, 0.0, 0.0);\n\
  \    float NdotL = dot(N, L);\n\n    if (NdotL > 0)\n    {\n        // 获取光源与片段之间的距离\n\
  \        float dist = distance(uPointLight.mWorldPos, gbufferWorldPos);\n      \
  \  // 使用 smoothstep 计算 [0,1] 之间的值\n        // 在内/外半径之间\n        float intensity\
  \ = smoothstep(uPointLight.mInnerRadius, uPointLight.mOuterRadius, dist);\n    \
  \    // 光的漫反射色取决于强度\n        vec3 DiffuseColor = mix(uPointLight.mDiffuseColor,\
  \ vec3(0.0, 0.0, 0.0), intensity);\n        Phong = DiffuseColor * NdotL;\n    }\n\
  \    // 最终颜色是纹理颜色乘以光\n    outColor = vec4(gbufferDiffuse * Phong, 1.0);\n}\n```\n\
  \n（注：然而在计算漫反射色时，你首先计算点光源与片段世界位置之间的距离。然后，`smoothstep` 函数计算 `[0, 1]` 范围内的值。该函数对于小于或等于内半径的距离返回\
  \ 0，对于大于或等于外半径的距离返回 1。之间的距离产生一个中间值。`smoothstep` 函数使用亥米特函数（一种多项式）来计算这个中间值。结果对应于漫反射光的强度；值\
  \ 0 表示由于在内半径内，具有全强度，而值 1 表示点光源不影响片段。）\n\n然后，你根据强度计算应用的 `DiffuseColor`。请注意的是，由于点光源渲染发生在全局光\
  \ G-buffer 之后，\n\n\n\n\n进行计算时，帧缓冲区（framebuffer）中的每个片段已经有了颜色。你不希望点光源着色器覆盖掉已有的颜色。例如，如果一个片段的世界位置显示它超出了点光源的范围，则着色器将返回黑色。如果你只是将片段设置为黑色，你就会丢失之前从全局光照阶段获得的所有颜色。\n\
  \n相反，你希望将点光源着色器的输出结果*相加*到现有的任何颜色上。向颜色中添加黑色不会改变任何 RGB 值，这意味着它保留了现有的光照。反之，如果你添加绿色值，就会会该片段变得更绿。将输出颜色加到现有颜色上不需要修改片段着色器代码本身；相反，你可以在\
  \ C++ 侧完成这一操作。\n\n### 绘制点光源\n\n在 `DrawFromGBuffer` 中绘制点光源之前，你需要在 `Renderer` 和 `PointLightComponent`\
  \ 中添加一些胶水代码。首先，你添加一个名为 `mGPointLightShader` 的新着色器成员变量。然后你在 `LoadShaders` 中加载该着色器。对于顶点着色器，你使用来自第\
  \ 6 章的 `BasicMesh.vert` 着色器，因为点光源的球体网格不需要特殊行为。对于片段着色器，你使用 `GBufferPointLight.frag`\
  \ 着色器。\n\n与全局光照着色器一样，你需要为不同的采样器设置 uniform，以将它们绑定到特定的 G-buffer 纹理。你还将将 `uScreenDimensions`\
  \ uniform 设置为屏幕的宽高度。\n\n你还添加了 `mPointLightMesh` 成员变量，它简单指向你想用于点光源的网格。你在初始化 `Renderer`\
  \ 时加载网格并将其保存在变量中；该网格是一个球体。\n\n现在，你在 `DrawFromGBuffer` 中添加了额外的代码，如列表 13.14 所示。这段代码位于所有绘制应用全局光照的全屏四边形的代码之后。这段代码的第一部分是将深度缓冲区从\
  \ G-buffer 复制到默认帧缓冲区的深度缓冲区。因为你正在向 G-buffer 绘制 3D 场景，它的深度缓冲区包含了每个片段的实际深度信息。因为你想对点光源球体进行深度测试，你需要将这些信息复制到默认深度缓冲区。\n\
  \n**列表 13.14** 在 `Renderer::DrawFromGBuffer` 中绘制点光源\n\n**点击此处查看代码图片**\n\n```cpp\n\
  // 将深度缓冲区从 G-buffer 复制到默认帧缓冲区\nglBindFramebuffer(GL_READ_FRAMEBUFFER, mGBuffer->GetBufferID());\n\
  int width = static_cast<int>(mScreenWidth);\nint height = static_cast<int>(mScreenHeight);\n\
  glBlitFramebuffer(0, 0, width, height, 0, 0, width, height, GL_DEPTH_BUFFER_BIT,\
  \ GL_NEAREST);\n\n// 启用深度测试，但禁用深度缓冲区写入\nglEnable(GL_DEPTH_TEST);\nglDepthMask(GL_FALSE);\n\
  ```\n\n![Image 1488](img/index-897_1.jpg)\n![Image 1489](img/index-897_2.jpg)\n\n\
  ```cpp\n// 将点光源着色器和网格设为激活\nmGPointLightShader->SetActive();\nmPointLightMesh->GetVertexArray()->SetActive();\n\
  \n// 设置视图投影矩阵\nmGPointLightShader->SetMatrixUniform(\"uViewProj\", mView * mProjection);\n\
  \n// 设置用于采样的 G-buffer 纹理\nmGBuffer->SetTexturesActive();\n\n// 点光源颜色应该加到现有颜色上\n\
  glEnable(GL_BLEND);\nglBlendFunc(GL_ONE, GL_ONE);\n\n// 绘制点光源\nfor (PointLightComponent*\
  \ p : mPointLights)\n{\n    p->Draw(mGPointLightShader, mPointLightMesh);\n}\n```\n\
  \n接下来，你重新启用深度测试（因为你在绘制用于全局光照的全屏四边形时禁用了它），但禁用了深度掩码。这意味着当你尝试为每个点光源球体绘制片段时，它们需要通过深度测试，*但*这些片段不会将新的深度值写入深度缓冲区。这确保了点光源球体网格不会干扰现有的深度缓冲区值。\n\
  \n由于你在这里禁用了深度缓冲区写入，你需要在 `Draw3DScene` 的开头添加相应的调用，以重新启用深度缓冲区的写入。（否则，你无法清除深度缓冲区！）\n\
  \n然后，你激活点光源的着色器以及相应的点光源网格。你需要像渲染世界中的任何其他对象一样设置视图投影矩阵，以确保点光源在屏幕上有有正确的位置。你还需要将 G-buffer\
  \ 纹理绑定到各自的槽位。\n\n因为你想在颜色缓冲区中已有的颜色上叠加，所以你启用了混合。两个参数都使用 `GL_ONE` 的混合函数表示你只想直接将两种颜色相加，而不考虑\
  \ alpha 值或任何其他参数。\n\n最后，你遍历所有点光源并对每个点光源调用 `Draw` 函数。`PointLightComponent::Draw`\
  \ 的代码如列表 13.15 所示，看起来与代码没有太大区别。\n\n**列表 13.15** `PointLightComponent::Draw`\n\n\
  **点击此处查看代码图片**\n\n```cpp\nvoid PointLightComponent::Draw(Shader* shader, Mesh* mesh)\n\
  {\n    // 将世界变换缩放到外外半径（除以\n    // 网格半径）并定位到世界位置\n    Matrix4 scale = Matrix4::CreateScale(mOwner->GetScale()\
  \ * mOuterRadius / mesh->GetRadius());\n    Matrix4 trans = Matrix4::CreateTranslation(mOwner->GetPosition());\n\
  \n    Matrix4 worldTransform = scale * trans;\n    shader->SetMatrixUniform(\"uWorldTransform\"\
  , worldTransform);\n\n    // 设置点光源着色器常量\n    shader->SetVectorUniform(\"uPointLight.mWorldPos\"\
  , mOwner->GetPosition());\n    shader->SetVectorUniform(\"uPointLight.mDiffuseColor\"\
  , mDiffuseColor);\n    shader->SetFloatUniform(\"uPointLight.mInnerRadius\", mInnerRadius);\n\
  \    shader->SetFloatUniform(\"uPointLight.mOuterRadius\", mOuterRadius);\n\n  \
  \  // 绘制球体\n    glDrawElements(GL_TRIANGLES, mesh->GetVertexArray()->GetNumIndices(),\
  \ GL_UNSIGNED_INT, nullptr);\n}\n```\n\n### 改进与问题\n\n尽管延迟光照是一种被许多现代游戏使用的非常强大的渲染技术，但它并非完美。一个问题是它无法处理半透明物体，例如窗户。因为\
  \ G-buffer 只能存储一个表面的属性，将此类物体绘制到 G-buffer 中会覆盖它背后的物体。针对这种情况的解决方案是在绘制场景的其他部分之后，单独通过一个渲染阶段绘制透明物体。\n\
  \n\n\n\n\n此外，对于某些游戏，设置 G-buffer 和渲染到多个目标的开销并不划算。如果游戏大部分时间发生在白天，或者光源数量非常少，那么每帧设置延迟渲染（deferred\
  \ shading）的成本可能会高于正向渲染（forward-rendering）方法的成本。许多需要高帧率的虚拟现实游戏因此因此使用了正向渲染。\n\n另一个问题是光路几何有很多边缘情况需要考虑和修复。例如，如果点光球体与墙部分相交，在当前的方法中，点光会影响墙的两侧。\n\
  \n此外，如果你创建了一个非常大的点光并将相机放在光照内部，你将看不到该光的效果。要解决这些光路几何问题，你需要使用模板缓冲区（stencil buffer），这是一种不同的输出缓冲区。\n\
  \n### 游戏项目\n本章的游戏项目提供了延迟渲染的完整实现。此外，它同时使用了多级映射（mipmapping）和各向异性滤波（anisotropic aliasing）来提高纹理质量。该项目包含了使用正向渲染的镜面纹理。代码可以在书籍的\
  \ GitHub 仓库中找到 `Chapter13` 目录。在 Windows 中打开 `Chapter13-windows.sln`，在 Mac 上打开 `Chapter13-mac.xcodeproj`。\n\
  \n控制方式或角色与上一章相比没有变化。玩家仍然使用 `WASD` 键移动角色。为了演示点光，`Game::LoadData` 中提供了几个点光。\n\n###\
  \ 总结\n本章涵盖了一些中级图形技术。首先，它查看了纹理过滤的工作原理——包括最近邻滤波和双线性滤波。多级映射可以在缩小纹理尺寸时减少采样伪影，因为它生成了多个低分辨率的纹理。\n\
  \n然而，对于倾斜表面，多级映射可能会显得模糊。在这种情况下，各向异性滤波可以提高纹理质量。\n\n另一个强大的技术是将场景渲染到纹理。OpenGL 允许创建与纹理相关的任意帧缓冲区对象。然后，你可以选择将\
  \ 3D 场景绘制到此纹理。这种技术的用途之一是绘制高质量的反射，例如镜子。\n\n最后，本章探讨了延迟渲染，这是一种双通道的光照方法。在第一通道中，你将对象的表面属性（如漫反射颜色、法线和世界位置）写入\
  \ G-buffer。在第二通道中，你从 G-buffer 读取数据以计算光照方程。对于范围有限的光（如点光），你渲染光照几何体以确保光照只影响范围内的片元。当场景中有许多光源时，延迟渲染是一种极佳的方法，尽管存在一些问题，例如无法处理半透明物体。\n\
