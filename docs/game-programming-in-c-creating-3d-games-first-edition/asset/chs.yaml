  \ 1634](img/index-978_9.jpg)\n![Image 1635](img/index-978_10.jpg)\n\n### 任意名称指针\n\
  \nC++ 的前身 语言不支持引用。相反，你必须使用指针。例如，以下代码：\n\n```cpp\nvoid Swap(int* a, int* b)\n{\n\
  \    int temp = *a;\n    *a = *b;\n    *b = temp;\n}\n```\n\n解引用空指针会导致程序崩溃。错误信息取决于操作系统，但通常在解引用空指针时会发生“访问违规”或“段错误”错误。\n\
  \n### 动态分配\n\nC++ 中的 `new` 和 `delete` 运算符在堆上分配和释放内存。`new` 运算符为请求的类型分配内存，对于类和结构体体会调用构造函数。`delete`\
  \ 运算符执行相反操作：调用类/类型的析构函数并释放变量的内存。\n\n例如，以下代码为单个 int 分配内存：\n\n```cpp\nint* dynamicInt\
  \ = new int;\n```\n\n要释放动态分配变量的内存，请使用 delete：\n\n```cpp\ndelete dynamicInt;\n```\n\
  \n忘记删除动态分配的变量会导致**内存泄漏**，这意味着该内存在程序的剩余生命周期内无法使用。对于运行长时间的程序，微小的内存泄漏会随着时间不断积累，最终导致堆耗尽内存。\n\
  \n当然，仅动态分配单个整数无法充分利用堆上的可用内存。你也可以动态分配数组：\n\n```cpp\nchar* dynArray = new char[4*1024*1024];\n\
  ```\n\n注意，在动态分配数组时，你在类型后面紧跟方括号并指定大小。与静态分配数组不同，你可以在运行时指定大小。要删除动态分配的数组，请使用 `delete[]`：\n\
  \n```cpp\ndelete[] dynArray;\n```\n\n\n\n\n\n熟悉 C++ 类的基础知识：类与对象、如何声明带有成员变量和函数的类、构造函数，以及继承和多态。相反，本文关注在\
  \ C++ 中使用类时会导致某些问题的主题。\n\n![Image 1646](img/index-982_1.jpg)\n![Image 1647](img/index-982_2.jpg)\n\
  \n## 引用、const 与类\n\n将对象按值传递给函数是低效的。这是因为拷贝对象的代价开销可能很大，特别是当对象包含大量数据时。因此，最佳实践是通过引用传递对象。\n\
  \n然而，引用的一个问题是它们允许函数修改参数。例如，假设一个 `Intersects` 函数接收两个 `Circle` 对象并返回这些圆是否相交。如果该函数通过引用接收这些圆，它可能会修改圆的圆心或半径。\n\
  \n解决方案是使用常量（`const`）引用。`const` 引用保证了函数只能从引用读取而不能对其进行写入。因此，更正确的 `Intersects` 声明使用了常量引用：\n\
  \n点击此处查看代码图像\n\n```cpp\nbool Intersects(const Circle& a, const Circle& b);\n```\n\
  \n你也可以将成员函数标记为 `const` `member functions`，以保证成员函数不会修改成员数据。例如，`Circle` 的 `GetRadius`\
  \ 函数不应该修改成员数据，这意味着它应该是一个常量成员函数。要表示一个成员函数是 `const`，请在函数声明的右括号后立即添加 `const` 关键字，如下：\n\
  \n![Image 1648](img/index-983_1.jpg)\n![Image 1649](img/index-983_2.jpg)\n\n###\
  \ 列表 A.1. 带有常量成员函数的 Circle 类\n\n点击此处查看代码图像\n\n```cpp\nclass Circle\n{\npublic:\n\
  \    float GetRadius() const { return mRadius }\n    // 省略其他函数\n    // ...\nprivate:\n\
  \    Point mCenter;\n    float mRadius;\n};\n```\n\n总结一下，关于引用、`const` 和类的最佳实践如下：\n\
  1. 按引用、常量引用或指针传递非基本类型，以避免创建副本。\n2. 当函数不需要修改引用参数时，按常量引用传递。\n3. 将不修改数据的成员函数标记为 `const`。\n\
  \n![Image 1650](img/index-984_1.jpg)\n![Image 1651](img/index-984_2.jpg)\n\n## 类的动态分配\n\
  \n与任何其他类型一样，你可以对动态分配类。列表 A.2 显示了一个 `Complex` 类的声明，它封装了实部和虚部。\n\n### 列表 A.2. 一个 Complex\
  \ 类\n\n点击此处查看代码图像\n\n```cpp\nclass Complex\n{\npublic:\n    Complex(float real,\
  \ float imaginary)\n    : mReal(real)\n    , mImaginary(imaginary)\n    { }\nprivate:\n\
  \    float mReal;\n    float mImaginary;\n};\n```\n\n注意 `Complex` 的构造函数接收两个参数。要动态分配\
  \ `Complex` 的实例，你必须传入这些参数：\n\n![Image 1652](img/index-985_1.jpg)\n![Image 1653](img/index-985_2.jpg)\n\
  ![Image 1654](img/index-985_3.jpg)\n![Image 1655](img/index-985_4.jpg)\n\n点击此处查看代码图像\n\
  \n```cpp\nComplex* c = new Complex(1.0f, 2.0f);\n```\n\n与其它类型的动态分配一样，`new` 运算符返回一个指向动态分配对象的指针。给定一个对象的指针，使用\
  \ `->` 运算符可以访问任何公共成员。例如，如果 `Complex` 类有一个不接受任何参数的公共 `Negate` 成员函数，以下代码将在对象 `c` 上调用该函数：\n\
  \n```cpp\nc->Negate();\n```\n\n你也可以动态分配对象数组。这只有在类具有 `default constructor`（一个不接受任何参数的构造函数）时才有效。这是因为在动态分配数组时，没有方法指定构造函数参数。如果你没有为类定义任何构造函数，C++\
  \ 会自动为你创建一个默认构造函数。然而，如果你声明了一个接受参数的构造函数，那么 C++ 将不会自动创建默认构造函数。在这种情况下，如果你需要默认构造函数，则必须自己声明它。在\
  \ `Complex` 的情况下，由于你声明了非默认构造函数，因此没有默认构造函数。\n\n## 析构函数\n\n假设你在程序过程中多次动态分配整数数组。与其反复手动编写这些代码，不如将此功能封装在\
  \ `DynamicArray` 类中可能更有意义，如列表 A.3 所示。\n\n### 列表 A.3. DynamicArray 的基础声明\n\n点击此处查看代码图像\n\
  \n```cpp\nclass DynamicArray\n{\npublic:\n    // 构造函数接收元素的大小\n    DynamicArray(int\
  \ size)\n    : mSize(size)\n    , mArray(nullptr)\n    {\n        mArray = new int[mSize];\n\
  \    }\n    // 用于访问索引的函数\n    int& At(int index) { return mArray[index]; }\nprivate:\n\
  \    int* mArray;\n    int mSize;\n};\n```\n\n使用此 `DynamicArray`，你可以通过以下代码创建一个包含\
  \ 50 个元素的数组：\n\n```cpp\nDynamicArray scores(50);\n```\n\n`destructor` 是一个特殊的成员函数，在销对象时自动运行。析构函数的名称与类名相同，但加上波浪号\
  \ (`~`）。对于 `DynamicArray`，析构函数如下：\n\n```cpp\n~DynamicArray()\n{\n    delete[] mArray;\n\
  }\n```\n\n如果你添加了这个析构函数，当 `scores` 离开作用域时，析构函数会释放 `mArray`。\n\n## 拷贝构造函数\n\n`copy\
  \ constructor` 是一种作为相同类型对象拷贝对象的构造函数。例如，假设你声明了以下 `Complex` 对象：\n\n```cpp\nComplex\
  \ c1 = Complex(5.0f, 3.5f);\n```\n\n然后你可以实例化第二个 `Complex` 对象作为 `c1` 的拷贝：\n\n```cpp\n\
  Complex c2(c1);\n```\n\n在大多数情况下，如果程序员没有声明，C++ 会提供拷贝构造函数的实现。这种默认拷贝构造会将所有成员数据从原始对象拷贝到新对象。对于\
  \ `Complex`，这工作得很好；例如，这意味着 `c2.mReal` 和 `c2.mImaginary` 从 `c1` 的对应成员处拷贝。\n\n然而，对于带有数据指针类（例如\
  \ `DynamicArray`），直接拷贝成员数据并得想要的结果。假设你运行以下代码：\n\n```cpp\nDynamicArray array(50);\n\
  DynamicArray otherArray(array);\n```\n\n使用默认拷贝构造函数，你直接拷贝了 `mArray` 指针，而不是拷贝动态分配的数组。这意味着如果你接下来修改\
  \ `otherArray`，你也会同时修改 `array`！图 A.1 说明了这种产生问题的行为，被称为**浅拷贝**。\n\n### 图 A.1. mArray\
  \ 的浅拷贝\n\n![Image 1669](img/index-990_1.jpg)\n![Image 1670](img/index-990_2.jpg)\n\
  \n\n\n\n如果默认的拷贝构造函数不可用（例如 `DynamicArray` 的情况），你必须声明一个自定义的拷贝构造函数：\n\n点击此处查看代码\n\n\
  ```cpp\nDynamicArray(const DynamicArray& other)\n: mSize(other.mSize)\n, mArray(nullptr)\n\
  {\n    // 动态分配我自己的数据\n    mArray = new int[mSize];\n    // 从其他数据中拷贝\n    for (int\
  \ i = 0; i < mSize; i++)\n    {\n        mArray[i] = other.mArray[i];\n    }\n}\n\
  ```\n\n注意，拷贝构造函数的唯一参数是指向该类另一个实例的常量引用。在这种情况下，该实现动态地分配了一个新数组，然后从另一个 `DynamicArray`\
  \ 拷贝数据。这被称为**深拷贝**，因为两个对象现在拥有独立的动态分配底层数组。\n\n![Image 1671](img/index-991_1.jpg)\n\
  ![Image 1672](img/index-991_2.jpg)\n![Image 1673](img/index-991_3.jpg)\n![Image\
  \ 1674](img/index-991_4.jpg)\n![Image 1675](img/index-991_5.jpg)\n![Image 1676](img/index-991_6.jpg)\n\
  ![Image 1677](img/index-991_7.jpg)\n![Image 1678](img/index-991_8.jpg)\n\n通常情况下，动态分配数据的类应该实现以下成员函数：\n\
  - 一个析构函数，用于释放动态分配的内存\n- 一个拷贝构造函数，用于实现深拷贝\n- 一个赋值运算符（在下一节中讨论），也用于实现深拷贝\n\n如果有必要实现这三个函数中的任何一个，那么你就应该实现全部三个。这个问题在\
  \ C++ 中非常常见，开发者们创造了**三规则**（rule of three）这一术语来记住它。\n\n> ### 注意\n> 在 C++11 标准中，三规则扩展到了五规则，因为有两个额外的特有函数（移动构造函数函数和移动赋值运算符）。虽然本书使用了一些\
  \ C++11 特性，但并没有使用这些额外的函数。\n\n## 运算符重载\n\nC++ 赋予了程序员为自定义类型指定内置运算符行为的能力。例如，你可以定义 `Complex`\
  \ 类算术运算符如何工作。在加法的情况下，你可以这样声明 `+` 运算符：\n\n点击此处查看代码\n\n```cpp\nfriend Complex operator+(const\
  \ Complex& a, const Complex& b)\n{\n    return Complex(a.mReal + b.mReal,\n    \
  \               a.mImaginary + b.mImaginary);\n}\n```\n\n![Image 1679](img/index-992_1.jpg)\n\
  ![Image 1680](img/index-992_2.jpg)\n![Image 1681](img/index-992_3.jpg)\n![Image\
  \ 1682](img/index-992_4.jpg)\n![Image 1683](img/index-992_5.jpg)\n![Image 1684](img/index-992_6.jpg)\n\
  \n在这里，`friend` 关键字意味着 `operator+` 是一个独立函数，可以访问 `Complex` 的私有数据。这是二元运算符典型的声明签名。在重载\
  \ `+` 运算符后，你可以使用它来相两个复数对象，如下：\n\n```cpp\nComplex result = c1 + c2;\n```\n\n你还可以重载二比较运算符。唯一的区别是这些运算符返回一个\
  \ `bool`。例如，以下代码重载了 `==` 运算符：\n\n点击此处查看代码\n\n```cpp\nfriend bool operator==(const\
  \ Complex& a, const Complex& b)\n{\n    return (a.mReal == b.mReal) &&\n       \
  \    (a.mImaginary == b.mImaginary);\n}\n```\n\n你还可以重载 `=` 运算符（或**赋值 `operator`**）。与拷贝构造函数一样，如果你不指定赋值运算符，C++\
  \ 会给你提供一个执行浅拷贝的默认赋值运算符。因此，在“三规则”的情况下，你通常只需要重载赋值运算符。\n\n赋值运算符和拷贝构造函数之间有一个巨大的区别。在拷贝构造函数中，你正在构造一个新对象并作为现有对象的拷贝。而在赋值运算符中，你正在覆盖一个*已经存在的对象实例*。\n\
  \n例如，以下代码在第三行调用了 `DynamicArray` 的赋值运算符，因为第一行之前构造了 `a1`：\n\n点击此处查看代码\n\n```cpp\n\
  DynamicArray a1(50);\nDynamicArray a2(75);\na1 = a2;\n```\n\n由于赋值运算符会覆盖已经存在的实例，它需要释放任何动态分配的数据。例如，这是\
  \ `DynamicArray` 赋值运算符的正确实现：\n\n点击此处查看代码\n\n```cpp\nDynamicArray& operator=(const\
  \ DynamicArray& other)\n{\n    // ... 实现 ...\n}\n```\n\n![Image 1685](img/index-993_1.jpg)\n\
  ![Image 1686](img/index-993_2.jpg)\n\n## 容器\n\n**容器**提供了一种存储元素。C++ 标准库（STL）提供了许多不同的容器，因此了解何时使用哪一种非常重要。本节将讨论最常用的。\n\
  \n## 大 O 表示法\n\n**大 O 表示法**描述了算法随问题规模扩大而增长的速率。这种速率被称为算法的**时间复杂度**。你可以使用大 O 来理解特定操作的相对规模。\n\
  \n例如，复杂度为 `O(1)` 的操作意味着无论集合中有多少元素，该操作总是花费相同的时间。相反，`O(n)` 的时间复杂度是元素数量的线性函数。\n\n表\
  \ A.5 列出了最常见的时间复杂度，从快到慢。指数级或更慢的算法在小规模问题之外没有实际用途。\n\n**表 A.5 常见的大 O 表示时间复杂度（从快到慢）**\n\
  \n| 大 O | 描述为 | 示例 |\n| :--- | :--- | :--- |\n| `O(1)` | 常数级 | 链表头部插入、数组索引 |\n|\
  \ `O(log n)` | 对数级 | 二分查找（给定已排序的 n 容器） |\n| `O(n)` | 线性 | 线性查找 |\n| `O(n log n)`\
  \ | “n log n” | 合并排序、快速排序（平均情况） |\n| `O(n²)` | 平方级 | 插入排序、冒泡排序 |\n| `O(2^n)` | 指数级\
  \ | 整数因子分解 |\n| `O(n!)` | 阶乘级 | 旅行旅行商人问题的暴力破解 |\n\n\n\n\n\n特定用例。\n\n## 向量 (Vector)\n\
  \n`vector` 是一个动态数组，它根据集合中元素的数量自动调整大小。要向向量插入元素，请使用 `push_back`（或 `emplace_back`）成员函数。这会将元素添加到向量的末尾（back）。\n\
  \n例如，以下代码声明了一个 `float` 类型的向量，然后在向量的末尾添加了三个元素：\n\n**点击此处查看图片**\n\n```cpp\n// #include\
  \ <vector> to use std::vector\nstd::vector<float> vecOfFloats;\nvecOfFloats.push_back(5.0f);\
  \ // Contents: { 5.0f }\nvecOfFloats.push_back(7.5f); // Contents: { 5.0f, 7.5f\
  \ }\nvecOfFloats.push_back(10.0f); // Contents: { 5.0f, 7.5f, 10.0f }\n```\n\n![Image\
  \ 1691](img/index-998_1.jpg)\n![Image 1692](img/index-998_2.jpg)\n![Image 1693](img/index-998_3.jpg)\n\
  \n一旦向量有了元素，你可以使用数组下标符号来访问向量中的特定元素。因此，给定上一个片段中的向量，`vecOfFloats[2]` 访问向量中的第三个元素，产生\
  \ `10.0f`。\n\n从长期来看，向向量末尾插入的平均复杂度为 `O*(1)`。然而，由于向量存在于连续内存块中，如图 A.2`。\n\n正因如此，你应该避免向向量进行任意插入。但这种连续内存布局的优势是按索引访问元素是\
  \ `O*(1)`。\n\n**图 A.2** 向量的内部内存布局是连续的，与数组相同\n\n## 链表 (Linked List)\n\n`linked list`\
  \ 是一种集合，它将每个元素存储在内存中的独立位置，并通过指针将它们连接在一起。`std::list` 集合允许在列表的前部和尾部插入。使用 `push_front`（或\
  \ `emplace_front`）函数插入到头部，使用 `push_back`（或 `emplace_back`）插入到尾部。以下代码\n\n![Image\
  \ 1694](img/index-999_1.jpg)\n![Image 1695](img/index-999_2.jpg)\n![Image 1696](img/index-999_3.jpg)\n\
  \n创建了一个整数链表并插入了几个元素：\n\n**点击此处查看图片**\n\n```cpp\n// #include <list> to use std::list\n\
  std::list<int> myList;\nmyList.push_back(4);\nmyList.push_back(6);\nmyList.push_back(8);\n\
  myList.push_back(10);\nmyList.push_front(2);\n```\n\n图 A.3 展示了完成所有插入后的 `myList`。注意，根据定义，链表中的元素在内存中并不是相邻的。链表的一个优势是向列表的任一末端插入都是\
  \ `O*(1)`。如果你有一个列表中某个元素的指针，你也可以在 `O*(1)` 时间内在该元素之前或之后插入元素。\n\n**图 A.3** 插入了元素的 `myList`。然而，链表的一个缺点是访问列表的第\
  \ `n` 个元素的复杂度为 `O*(n*)`。由于这个原因，`std::list` 的实现不允许通过数组下标进行索引。\n\n![Image 1697](img/index-1000_1.jpg)\n\
  ![Image 1698](img/index-1000_2.jpg)\n![Image 1699](img/index-1000_3.jpg)\n![Image\
  \ 1700](img/index-1000_4.jpg)\n![Image 1701](img/index-1000_5.jpg)\n![Image 1702](img/index-1000_6.jpg)\n\
  ![Image 1703](img/index-1000_7.jpg)\n![Image 1704](img/index-1000_8.jpg)\n\n## 效率：链表还是向量？\n\
  \n在集合中的每个单独元素都较小（小于 64 字节）的情况下，向量的性能几乎总是优于链表。这是由于 CPU 访问内存的方式导致的。\n\n从内存中读取值对 CPU\
  \ 来说非常慢，因此当它需要从内存读取一个值时，它会将相邻的值加载到高速缓存中。因为向量中的元素在内存中是连续的，访问特定索引的元素也会将其相邻的索引加载到缓存中。\n\
  \n然而，由于链表中的元素不是连续的，加载一个元素也会无关的内存加载到缓存中。因此，遍历整个集合等操作使用向量比使用链表要高效得多，尽管两种操作的时间复杂度都是\
  \ `O*(n*)`。\n\n## 队列 (Queues)\n\n`queue` 表现出先入先出 (`FIFO`) 行为，就像商店排队一样。在队列中，你不能按任意顺序移除元素。你使用\
  \ `push`（或 `emplace`）将元素添加到队列，并使用 `pop` 将其移除。要访问队列前面的元素，使用 `front`。以下代码向队列插入了三个元素，然后依次移除它们：\n\
  \n**点击此处查看图片**\n\n```cpp\n// #include <queue> to use std::queue\nstd::queue<int>\
  \ myQueue;\nmyQueue.push(10);\nmyQueue.push(20);\nmyQueue.push(30);\nfor (int i\
  \ = 0; i < 3; i++) {\n    std::cout << myQueue.front() << ' ';\n    myQueue.pop();\n\
  }\n```\n\n由于队列以 FIFO 方式运行，上述代码输出值为：`10 20 30`。\n\n## 栈 (Stack)\n\n`stack` 表现出后入先出\
  \ (`LIFO`) 行为，就像一叠盘子。例如，如果你向栈添加 A、B、C，你只能相反顺序移除它们。你使用 `push`（或 `emplace`）将元素添加到栈，并使用\
  \ `pop` 将其移除。要访问栈顶元素，使用 `top`。以下代码展示了 `std::stack` 的用法：\n\n**点击此处查看图片**\n\n```cpp\n\
  // #include <stack> to use std::stack\nstd::stack<int> myStack;\nmyStack.push(10);\n\
  myStack.push(20);\nmyStack.push(30);\nfor (int i = 0; i < 3; i++) {\n    std::cout\
  \ << myStack.top() << ' ';\n    myStack.pop();\n}\n```\n\n由于栈的 LIFO 行为，上述代码输出：`30\
  \ 20 10`。\n\n![Image 1713](img/index-1003_1.jpg)\n![Image 1714](img/index-1003_2.jpg)\n\
  \n## 映射 (Maps)\n\n`map` 是按键排序的 `{key, value}` 对有序集合。map 中的每个键必须是唯一的。由于 map 同时具有键类型和值类型，因此在声明\
  \ map 时必须指定两种类型。向 map 添加元素的推荐方法是使用 `emplace` 函数，它接收键和值作为参数。例如，以下代码创建了一个月份的 `std::map`，键是月份数字，值是月份字符串名称：\n\
  \n**点击此处查看图片**\n\n```cpp\n// #include <map> to use std::map\nstd::map<int, std::string>\
  \ months;\nmonths.emplace(1, \"January\");\nmonths.emplace(2, \"February\");\nmonths.emplace(3,\
  \ \"March\");\n```\n\n从 map 访问元素最简单的方法是使用 `[]` 运算符传入键。例如，这将输出 February：\n\n![Image\
  \ 1715](img/index-1004_1.jpg)\n![Image 1716](img/index-1004_2.jpg)\n\n```cpp\nstd::cout\
  \ << months[2];\n```\n\n然而，这种语法仅在键于 map 中时按预期工作。要确定键是否在 map 中，请使用 `find` 函数。如果找到，它将返回指向元素的迭代器。（我们稍后会讨论迭代器。）\n\
  \n内部，`std::map` 的实现使用平衡二叉搜索树。这意味着 `std::map` 按键查找元素的时间为 `O*(log n*)`（对数级）。从 map\
  \ 中插入和删除也是\n\n\n\n\n对数级的。此外，由于使用了二叉搜索树，遍历 map 的内容是按键的升序排列的。\n\n## 哈希表\n\n普通的 map\
  \ 保持键的升序排列，而 `hash map` 是无序的。作为失去排序的代价，插入、删除和搜索的时间复杂度均为 `O(1)`。因此，在需要 map 但不需要排序的情况下，哈希表提供的性能比普通\
  \ map 更好。\n\nC++ 哈希表 `std::unordered_map` 具有与 `std::map` 相同的函数，只是没有保证任何顺序。要使用哈希表类，请使用\
  \ `#include <unordered_map>`。\n\n## 迭代器、Auto 和基于范围的循环\n\n要遍历 `vector` 中的所有元素，你可以使用与遍历数组相同的语法。然而，许多其他\
  \ C++ STL 容器（如 `list` 和 `map`）不支持这种数组语法。\n\n遍历这些其他容器的一种方法是使用 `iterator`（迭代器），它是一个帮助遍历集合的实例。每个\
  \ C++ STL 容器都支持迭代器。\n\n每个容器都有一个 `begin` 函数（返回指向第一个元素的迭代器）以及一个 `end` 函数（返回指向最后一个元素的迭代器）。迭代器的类型是容器的类型加上\
  \ `::iterator`。例如，以下代码创建了一个列表，然后使用迭代器遍历列表中的每个元素：\n\n```cpp\nstd::list<int> numbers;\n\
  numbers.emplace_back(2);\nnumbers.emplace_back(4);\nnumbers.emplace_back(6);\n\n\
  for (std::list<int>::iterator iter = numbers.begin(); iter != numbers.end(); ++iter)\n\
  {\n    std::cout << *iter << std::endl;\n}\n```\n\n![Image 1717](img/index-1006_1.jpg)\n\
  ![Image 1718](img/index-1006_2.jpg)\n![Image 1719](img/index-1006_3.jpg)\n![Image\
  \ 1720](img/index-1006_4.jpg)\n\n注意，使用 `*` 对迭代器进行解引用，与解引用指针相同。使用迭代器遍历其他集合的语法也是类似的。\n\
  \n在 map 的情况下，迭代器实际上指向一个 `std::pair`。因此，给定一个指向 map 中元素的迭代器，你必须使用 `first` 和 `second`\
  \ 分别访问键和值。回到之前的月份 map，你可以使用以下代码获取元素的迭代器并输出其数据：\n\n```cpp\n// 获取键为 2 的元素的迭代器\nstd::map<int,\
  \ std::string> iter = months.find(2); \nif (iter != months.end()) // 仅在找到时为真\n{\n\
  \    std::cout << iter->first << std::endl; // 输出 2\n    std::cout << iter->second\
  \ << std::endl; // 输出 February\n}\n```\n\n手动写出迭代器的长类型名非常令人讨厌。C++11 提供了 `auto` 关键字来帮助减轻这种痛苦。`auto`\
  \ 告诉编译器根据赋值的值为你推断变量的类型。例如，由于 `begin` 函数返回一个非常特定类型的迭代器，`auto` 可以推断出正确的类型。使用 `auto`\
  \ 不会有性能损失，尽管某些程序员发现代码变得更难理解。\n\n使用 `auto`，你可以将列表循环重写如下：\n\n```cpp\n// auto 被推断为\
  \ std::list<int>::iterator\nfor (auto iter = numbers.begin(); iter != numbers.end();\
  \ ++iter)\n{\n    std::cout << *iter << std::endl;\n}\n```\n\n本书中的代码仅在 `auto` 能提高可读性时才使用它。\n\
  \n即使有了 `auto`，通过迭代器循环的代码仍然很笨拙。许多其他编程语言都提供了 `foreach` 结构来遍历集合。C++11 有一个类似的结构，称为 `range-based`（基于范围的）for\
  \ 循环。\n\n使用基于范围 for 循环遍历数字列表，使用以下语法：\n\n```cpp\nfor (int i : numbers)\n{\n    //\
  \ i 存储当前循环迭代的元素\n    std::cout << i << std::endl;\n}\n```\n\n该循环在遍历列表时会为每个元素创建副本。然而，如果你想修改集合中的元素，也可以通过引用传递。同样，你可以使用常量引用。\n\
  \n在编写基于范围的 for 循环时，也可以对类型使用 `auto`。但是与使用显式类型一样，这会为每个元素创建副本。不过，如果需要，你也可以结合 `auto`\
  \ 配合 `const` 和 `&` 使用。基于范围的循环的一个缺点是，在循环期间不能向集合中添加或删除元素。因此，如果你需要这种行为，必须使用其他类型的循环。\n\
