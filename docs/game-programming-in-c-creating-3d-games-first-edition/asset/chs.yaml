  \ To avoid this, it’s important that you continue to use both formats throughout\
  \ development. If one of the two formats becomes stale, then there’s a greater chance\
  \ that format will stop working.\n\n## Saving a Binary Mesh File\n\nWith any binary\
  \ file format, an important step is to decide on a layout for the file. Most binary\
  \ files begin with some sort of `header` that defines the contents of the file as\
