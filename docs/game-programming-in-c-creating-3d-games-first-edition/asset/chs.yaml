  \ playerPos2D(playerPos.y, playerPos.x);\n\n    // 玩家前方方向同理\n    Vector3 playerForward\
  \ = mGame->GetPlayer()->GetForward();\n    Vector2 playerForward2D(playerForward.x,\
  \ playerForward.y);\n\n    // 使用 atan2 获取雷达旋转角度\n    float angle = Math::Atan2(playerForward2D.y,\
  \ playerForward2D.x);\n\n    // 创建一个 2D 旋转矩阵\n    Matrix3 rotMat = Matrix3::CreateRotation(angle);\n\
  \n    // 获取信号点位置\n    for (auto tc : mTargetComps)\n    {\n        Vector3 targetPos\
  \ = tc->GetOwner()->GetPosition();\n        Vector2 actorPos2D(targetPos.y, targetPos.x);\n\
  \n        // 计算玩家与目标之间的向量\n        Vector2 playerToTarget = actorPos2D - playerPos2D;\n\
  \n        // 查看是否在范围内\n        if (playerToTarget.LengthSq() <= (mRadarRange * mRadarRange))\n\
  \        {\n            // 将 playerToTarget 转换为相对于...\n            ![Image 1298](img/index-767_1.jpg)\n\
  \            ![Image 1299](img/index-767_2.jpg)\n            // 屏幕上雷达中心的偏移\n   \
  \         Vector2 blipPos = playerToTarget;\n            blipPos *= mRadarRadius/mRadarRange;\n\
  \n            // 旋转 blipPos\n            blipPos = Vector2::Transform(blipPos, rotMat);\n\
  \            mBlips.emplace_back(blipPos);\n        }\n    }\n\n    绘制雷达只需首先绘制背景，然后遍历每个信号点并将其作为雷雷达中心的偏移绘制出来：`点击此处查看代码图片**\n\
  ```cpp\nVector2 cRadarPos(-390.0f, 275.0f);\nDrawTexture(shader, mRadar, cRadarPos,\
  \ 1.0f);\n\n// 信号点\nfor (const Vector2& blip : mBlips)\n{\n    DrawTexture(shader,\
  \ blipTex, cRadarPos + blip, 1.0f);\n}\n```\n![Image 1300](img/index-768_1.jpg)\n\
  ![Image 1301](img/index-768_2.jpg)\n![Image 1302](img/index-768_3.jpg)\n\n图 11.5\
  \ 显示了游戏中的此雷达。雷达上的点每个对应游戏中的一个目标执行体。雷达中间的箭头只是为了显示玩家位置而绘制的额外纹理，但它始终绘制在雷达中心。\n\n图 11.5\
  \ 游戏中的雷达 雷达的其他扩展可能包括根据敌人是在玩家上方还是下方显示不同类型的信号点。在这些样式之间切换需要考虑玩家和对象的组件。\n\n### 本地化 (Localization)\n\
  \n`本地化`是将游戏从一个区域或 `locale` 转换为另一个的过程。最常见的本地化项目包括任何配音以及屏幕上的任何文本。例如，使用英语工作的游戏开发者如果在中国发布游戏，可能想要将其本地化为中文。本地化最大的支出在于内容：必须有人翻译所有文本，在对话的情况下，不同的演员必须用不同的语言说出词。然而，部分本地化工作落在程序员身上。在\
  \ UI 情况下，游戏需要某些系统来方便地显示来自不同地区的文本。这意味着你不能在代码中硬编码诸如“你想退出吗？”之类的字符串。相反，你至少需要一个映射，在键如\
  \ `\"QuitText\"` 和屏幕上显示的实际文本之间进行转换。\n\n### 使用 Unicode (Working with Unicode)\n\n\
  本地化文本的一个问题是，每个 `ASCII` 字符只有 7 位信息（尽管它内部存储为 1 字节）。7 位意味着总共有 128 个字符。在这些字符中，52 个是字母（英语大写和小写），其余字符是数字和其他符号。`ASCII`\
  \ 不包含任何其他语言的字形。为了解决这个问题，由许多不同机构组成的联盟在 20 世纪 80 年代引入了 `Unicode` 标准。在编写此时，`Unicode`\
  \ 的当前版本支持 100,000 多个不同的字符。本地化文本的一个问题是，单个字节无法表示超过 256 个不同的字形，`Unicode` 必须使用不同的编码。存在多种编码，包括每个字符为\
  \ 2 字节或 4 字节的编码。在字符串中，`UTF-8` 的长度在 1 到 4 字节之间变化。`UTF-8` 字符串中的字符可能是 1 字节，有些是 2 字节，有些是\
  \ 3 字节，有些是 4 字节。`UTF-8` 的优势在于它与 `ASCII` 完全兼容。这可能是 `UTF-8` 成为万维网以及 `JSON` 等格式默认编码的原因。遗憾的是，C++\
  \ 对 `Unicode` 没有很好的内置支持。例如，`std::string` 类仅用于 `ASCII` 字符。然而，你可以使用 `std::string`\
  \ 类存储 `UTF-8` 字符串。问题在于，如果字符串是 `UTF-8` 编码，`length` 成员函数不再保证字形（或字母）的数量。相反，`length`\
  \ 是存储在对象中的字节数。幸运的是，`RapidJSON` 库和 `SDL TTF` 都支持 `UTF-8` 编码。这与在 `std::string` 中存储\
  \ `UTF-8` 字符串相结合，意味着你不需要额外的代码就可以为 `UTF-8` 字符串添加支持。\n\n### 添加文本映射 (Adding a Text\
  \ Map)\n\n在游戏中，你添加了一个名为 `mTextMap` 的成员变量，它是一个键和值类型均为 `std::string` 的 `unordered_map`。该映射将如\
  \ `\"QuitText\"` 的键转换为显示的文本“你想退出吗？”你可以按照简单的 `JSON` 格式定义此映射，如列表 11.9 所示。每种语言都有该 `JSON`\
  \ 文件的版本，这使得不同语言之间的切换变得简单。\n\n### 列表 11.9 English.gptext 文本映射文件\n\n`点击此处查看代码图片**\n\
  \n```json\n{\n  \"TextMap\":{\n    \"PauseTitle\": \"PAUSED\",\n    \"ResumeButton\"\
  : \"Resume\",\n    ![Image 1303](img/index-772_1.jpg)\n    ![Image 1304](img/index-772_2.jpg)\n\
  \    ![Image 1305](img/index-772_3.jpg)\n    ![Image 1306](img/index-772_4.jpg)\n\
  \    \"QuitButton\": \"Quit\",\n    \"QuitText\": \"Do you want to quit?\",\n  \
  \  \"OKButton\": \"OK\",\n    \"CancelButton\": \"Cancel\"\n  }\n}\n```\n\n\n\n\n\
  ![Image 1310](img/index-773_4.jpg)\n\n![Image 1311](img/index-773_5.jpg)\n\n![Image\
  \ 1312](img/index-773_6.jpg)\n\n![Image 1313](img/index-773_7.jpg)\n\n![Image 1314](img/index-773_8.jpg)\n\
  \n![Image 1315](img/index-773_9.jpg)\n\n![Image 1316](img/index-773_10.jpg)\n\n\
  你调用 `TTF_RenderUTF8_Blended`，它的语法与之相同，但接收的是 UTF-8 编码的字符串而不是 ASCII 字符串：\n\n点击此处查看代码图片\n\
  \n```\nSDL_Surface* surf = TTF_RenderUTF8_Blended(font, actualText.c_str(), sdlColor);\n\
  ```\n\n最后，任何之前使用硬编码文本字符串的代码现在都改用文本键。例如，暂停菜单的标题文本不再是 \"PAUSED\" 而是 \"PauseTitle\"\
  。这样，当你最终调用 `RenderText` 时，正确的文本会从映射中加载。\n\n### 提示\n\n如果游戏代码已经确定了英文文本，那么本地化文本的一种快速权宜方法是使用确定的英文文本作为文本键。这样，你就不需要追踪代码中每一个未本地化的字符串使用处了。然而，如果有人后来认为修改代码中的英文字符串会改变屏幕上的文本，这可能是危险的！\n\
  \n为了演示这段代码的功能，你可以创建一个 `Russian.gptext` 文件，其中包含列表 11.9.中字符串的俄语翻译。图 11.6 显示了带有“你确定要退出吗？”对话框的俄语版暂停菜单。\n\
  \n![Image-Image 1317](img/index-774_1.jpg)\n\n**图 11.6** 俄语版的暂停菜单\n\n### 其他本地化考量\n\
  \n本节介绍的代码仅在 TrueType 字体文件支持所有所需字形（glyphs）时才有效。在实践中，字体文件通常只包含字形集。某些语言（如中文）通常会有该语言专用字体文件。\n\
  \n为了解决这个问题，你可以向 `gptext` 文件添加一个字体条目。在填充 `mTextMap` 时，也可以加载正确的字体。然后，UI 代码的其他部分需要确保使用这个正确的字体。\n\
  \n某些本地化问题初眼看去并不明显。例如，德语文本通常比相应的英文文本长 20%。这意味着，如果一个 UI 元素恰好能容纳英文文本，它很可能无法容纳德语文本。虽然这通常是一个内容问题，但如果\
  \ UI 代码假设了某些间边或文本大小，它可能成为一个问题。规避此问题的方法是始终查询渲染后的字体纹理的大小，如果它无法在所需的范围内范围内，则缩缩小文本的大小。\n\
  \n最后，在某些情况下，文本或对话之外的内容可能也需要本地化处理。例如，在德国，销售带有与第三帝国相关符号的产品是违法的。因此，设定在二战期间的游戏在英文版中可能会显示万字或其他符号，但德语版必须将这些符号替换为替代方案（如铁十字）。另一个例子是，某些游戏在中国也存在内容限制（例如不显示过多血迹）。然而，这类问题通常不需要程序员的额外帮助即可解决，因为美术师只需为这些地区创建替代内容。\n\
  \n#### 支持多种分辨率\n\n对于 PC 和移动游戏，玩家拥有不同屏幕分辨率的情况非常常见。在 PC 上，常见的显示器分辨率包括 1080p (1920×1080)、1440p\
  \ (2560×1440) 和 4K (3840×2160)。在移动平台上，设备分辨率的数量多得惊人。\n\n尽管 `Renderer` 类目前支持以不同的分辨率创建窗口，但本章中的\
  \ UI 代码假设了固定分辨率。\n\n支持多种分辨率的方法是避免对 UI 元素使用特定的像素位置或绝对坐标。使用绝对坐标的示例是将 UI 元素精确地放置在坐标\
  \ (1900, 1000)处，并假设这对应于右下角。\n\n相反，你可以使用**相对坐标**，坐标相对于屏幕的特定部分，称为*锚点（anchor）*。例如，在相对坐标系中，你可以说想将元素放置在相对于右下角的\
  \ (–100,–100) 位置。这意味着该元素在 1080p 屏幕上显示为 (1820, 980)，而在 1680×1050 屏幕上显示为 (1580, 950)（参见图\
  \ 11.7）。你可以相对于屏幕上的关键点（通常是角或中心）甚至相对于其他 UI 元素来表示坐标。要实现这一点，你需要能够指定锚点。\n\n![Image- 1318](img/index-777_1.jpg)\n\
  \n**图 11.7** 放置在右下角的 UI 元素。另一种改进方法是根据分辨率缩放 UI 元素的大小。\n\n### 游戏项目\n\n游戏项目演示了本章讨论的所有功能，支持多种分辨率外。`Game`\
  \ 类包含了 UI 栈以及 `UIScreen`、`PauseMenu` 和 `DialogBox` 类。HUD 显示了准星和雷达。在游戏中，使用标准的第一人称控制（WASD\
  \ 加鼠标）在世界中移动。使用 Escape 键进入暂停菜单，并使用鼠标选择和点击按钮。在游戏过程中，使用 1 和 2 键切换英文（1）和俄语（2）文本。\n\n\
  ### 总结\n\n本章概述了在代码中实现用户面的挑战。使用 SDL TTF 库是渲染字体的一种方便方法，它可以加载 TrueType 字体并将文本渲染到纹理。在\
  \ UI 栈系统中，你将每个唯一的 UI 屏幕表示为 UI 栈上的一个元素。在任何时刻，只有栈顶部的 UI 可能会接收输入。你可以扩展此系统以支持按钮以及对话框。\n\
  \n最后，UI 需要处理不同语言文本的代码。简单的映射可以在文本键和值之间进行转换。使用 UTF-8 编码这些文本值使得处理相对简单。RapidJSON 库可以加载\
  \ UTF-8 编码的 JSON 文件，且 SDL TTF 支持渲染 UTF-8 字符串。\n\n## 扩展阅读\n\nDesi Quintans 的短文从设计角度提供了游戏\
  \ UI 的优坏案例示例。Luis Sempé 是一位编写过《全面入侵：人类革命》等游戏的 UI 程序员，他编写了唯一一本专门针对游戏 UI 编程的书。为了透明起见，我多年前与该作者合作过。最后，Joel\
  \ Spolsky 的书是关于通用 UI 设计的，但它提供了如何创建有效 UI 的见解。\n\n\n\n\n\n[游戏 UI 示例](https://gamedevelopment.tutsplus.com/tutorials/game-ui-by-example-a-crash-course-in-the-good-and-the-bad--gamedev-3943/)\
  \ \n\n访问于 2017 年 9 月 10 日。\n\nSempé, Luis. *User Interface Programming for Games*.\
  \ 自出版, 2014.\n\nSpolsky, Joel. *User Interface Design for Programmers*. Berkeley:\
  \ Apress, 2001.\n\n### 练习\n\n在本章的练习中，你将探索如何添加主菜单以及对游戏的 HUD（头上显示）进行修改。\n\n### 练习\
  \ 11.1\n\n创建一个主菜单。为了支持这一点，`game` 类需要一个名为 `EMainMenu` 的新状态。游戏应该首先进入此状态，并显示一个包含“Start”（开始）和“Quit”（退出）选项的\
  \ UI 界面。如果玩家点击 `Start`，游戏应切换到游戏玩法。如果玩家点击 `Quit`，菜单应该显示一个对话框，确认玩家想要退出。\n\n为了添加更多功能，考虑仅在从主菜单首次进入游戏玩法状态时才生成演员（actors）。此外，修改暂停菜单，使\
  \ `Quit` 选项删除所有演员并返回主菜单，而不是立即退出游戏。\n\n### 练习 11.2\n\n修改雷达，使其使用不同的光点（blip）纹理，取决于演员是在玩家的上方还是下方。使用提供的\
  \ `BlipUp.png` 和 `BlipDown.png` 纹理来显示这些不同状态。测试此功能可能需要更改某些目标演员的位置，以便清晰地区分高度。\n\n\
  ### 练习 11.3\n\n实现一个指向特定演员的屏幕 2D 箭头。创建一个名为 `ArrowTarget` 的新类型演员，并将其放置在游戏世界的某处。然后，在\
  \ HUD 中，计算从玩家到 `ArrowTarget` 的向量。利用该向量与玩家在 x-y 平面上方向之间的角度，确定旋转屏幕 2D 箭头的角度。最后，在 `UIScreen::DrawTexture`\
  \ 中添加代码以支持纹理的旋转（使用旋转矩阵）。\n\n## 第 12 章：骨骼动画\n\n为 3D 游戏角色制作动画与为 2D 游戏角色制作动画大不相同。本章将介绍*骨骼动画*，这是\
  \ 3D 游戏中最常用的动画技术。本章首先介绍该方法的数学基础，然后深入探讨实现细节。\n\n### 骨骼动画的基础\n\n正如第 2 章“游戏对象与 2D 图形”所描述，对于\
  \ 2D 动画，游戏使用一系列图像文件来产生角色正在运动的幻觉。为 3D 角色制作动画的朴素方案也类似：构建一系列 3D 模型并连续渲染这些不同的模型。虽然这种方案在概念上可行行的，但它并不是一种非常实用的方法。\n\
  \n考虑一个由 15,000 个三角形组成的角色模型，这对于现代游戏来说是一个保守数字。假设每个顶点仅占用 10 字节，这一个模型的总内存占用可能是 50 到\
  \ 100 KB。一个以每秒 30 帧运行的两秒动画需要总共 60 个不同的模型。这意味着这一个动画的总内存占用将达到 3 到 6 MB。现在想象游戏使用了多种不同的动画和多种不同的角色模型。游戏模型和动画的内存占用将迅速变得过高。\n\
  \n此外，如果游戏有 20 个不同的类人角色，可能它们在跑步等动画中的动作在很大程度上是相同的。如果你使用上述描述的朴素方案，那么这 20 个角色中的每个都需要为其动画准备一套不同的模型集。这意味着艺术家需要为每个角色手动制作这些不同的模型集和动画。\n\
  \n由于这些问题，大多数 3D 游戏改为从解剖学中获取灵感：脊椎动物（如人类）拥有骨骼。骨骼连接着肌肉、皮肤和其他组织。骨骼是刚性的，而其他组织不是。因此，给定骨骼的位置，就可以推导出连接在骨骼上的组织的位置。\n\
  \n同样，在**骨骼动画**中，角色有一个底层刚性骨骼。这个骨骼是动画师操作的对象。然后，模型中的每个顶点都与骨骼中的一个或多个骨骼相关。当动画移动骨骼时，顶点围绕相关的骨骼发生变形（就像你移动时皮肤会拉伸一样）。这意味着无论该模型有多少个动画，一个角色只需要一个\
  \ 3D 模型。\n\n> **注意**：由于骨骼动画拥有骨骼以及沿骨骼变形的顶点，一些人将这种技术称为**蒙皮动画**（skinned animation）。在这种情况下，“皮肤”指的是模型的顶点。同样，*骨骼*（bone）和*关节*（joint）这两个词在解剖学背景下不同，但在骨骼动画背景下是通用的术语。\n\
  \n骨骼动画的优势在于同一个骨骼可以适用于多个不同的角色。例如，在游戏中，所有类人角色共享同一个骨骼是很常见的。这样一来，动画师为骨骼创建一套动画，所有角色就可以使用这些动画。此外，许多流行的\
  \ 3D 模型制作软件（如 Autodesk Maya 和 Blender）支持骨骼动画。因此，艺术家可以使用这些工具为角色制作骨骼和动画。\n\n然后，就像\
  \ 3D 模型一样，你可以编写导出插件以导出为游戏代码所需的所需的格式。与 3D 模型一样，本本书使用基于 JSON 的文件来处理骨骼和动画。（提醒一下，GitHub\
  \ 上的书籍代码包含一个适用于 Epic Engine 的导出器，位于 `Exporter` 目录。）\n\n本节的剩余部分将介绍驱动骨骼动画的高层概念。后续章节将深入探讨游戏代码中实现骨骼动画的细节。\n\
  \n#### 骨骼与姿态\n\n**骨骼**通常表示方法是骨骼的层次结构（或树）。**根骨骼**是层次结构的底部，没有父骨骼。骨骼中的所有其他骨骼都有唯一的父骨骼。\n\
  \n图 12.1 展示了一个类人角色的简单骨骼层次结构。脊柱骨骼是根骨骼的子级，反之，左右髋部骨骼是脊柱骨骼的子级。\n\n![图像 1327](img/index-786_1.jpg)\n\
  **图 12.1** 带有标记的基础骨骼的角色\n\n这种骨骼层次结构试图模拟解剖学。例如，如果人类旋转她的肩膀，手臂的其他部分就会随之旋转。在游戏骨骼中，你可以通过这种方式表示：肩膀骨骼是肘部骨骼的父级，肘部骨骼是腕部骨骼的父级，而腕部骨骼是手指骨骼的父级。\n\
  \n给定一个骨骼，**姿态**（pose）代表骨骼的一种配置。例如，如果角色在动画中挥手好，那么动画中有一个姿态是角色的手骨骼举起挥手的。那么，动画就是骨骼随时间切换的一系列姿态序列。\n\
  \n**绑定姿态**（bind pose）是在应用任何动画之前的骨骼默认姿态。绑定姿态的另一个术语是**T 形姿态**（t-pose），因为通常角色在绑定姿态下会形成\
  \ T 形，如[图 12.1]所示。你制作角色模型时，使其看起来像这种绑定姿态配置。\n\n\n\n\n绑定姿态（bind pose）通常看起来像 T 字，是因为这更容易将骨骼与顶点关联，正如在本章稍后讨论的那样。\n\
  \n除了指定骨架中骨骼的父子关系外，你必须指定每根骨骼的位置和朝向。记住，在 3D 模型中，每个顶点都有一个相对于模型对象空间原点的位置。对于人形角色，对象空间原点的常见放置是角色在绑定姿态下双脚之间。这并非偶然，因为它恰好对应于骨架根骨的典型位置。\n\
  \n对于骨架中的每根骨骼，你可以用两种方式来描述它的位置和朝向。**全局姿态**（global pose）相对于对象空间原点。相反，**局部****姿态**（local\
  \ pose）相对于父骨骼。由于根骨没有父骨，因此它的局部姿态和全局姿态是相同的。换句话说，根骨的位置和朝向始终相对于对象空间原点。\n\n假设你存储了所有骨骼的局部姿态数据。表示位置和朝向的一种方法是变换矩阵。给定骨骼坐标空间中的一个点，该局部姿态矩阵会将该点变换到父骨的坐标空间。\n\
  \n如果每根骨骼都有局部姿态矩阵，那么给定层级的父子关系，你始终可以计算任何骨骼的全局姿态矩阵。例如，脊柱的父级是根骨，因此它的局部姿态矩阵是相对于根骨的位置和朝向。如所述，根骨的局部姿态矩阵对应于它的全局姿态矩阵。因此，将脊柱的局部姿态矩阵乘以根骨的全局姿态矩阵，得到脊柱的全局姿态矩阵：\n\
  \n有了脊柱的全局姿态矩阵，给定脊柱坐标空间中的一个点，你可以将其变换到对象空间。\n\n同样，计算父级为脊柱的左髋的全局姿态矩阵，计算如下：\n\n由于你始终可以从局部姿态转换为全局姿态，只存储局部姿态似乎是合理的。然而，通过以全局形式存储某些信息，你可以减少每帧所需的计算量。\n\
  \n虽然使用矩阵存储骨骼姿态是行的，但就像处理演员一样，你可能希望将骨骼的位置和朝向分离为用于平移的向量：\n\n![Image 1328](img/index-789_1.jpg)\n\
  \n![Image 1329](img/index-789_2.jpg)\n\n以及用于旋转的四元数。这样做的主要原因是四元数允许在动画期间对骨骼的旋转进行更准确的插值。你可以省略骨骼的缩放，因为骨骼缩放通常只用于可以产生异拉伸的卡通角色。\n\
  \n你可以将位置和朝向组合到以下 `BoneTransform` 结构体中：\n\n**点击此处查看代码图片**\n\n```\nstruct BoneTransform\n\
  {\n    Quaternion mRotation;\n    Vector3 mTranslation;\n    // 转换为矩阵\n    Matrix4\
  \ ToMatrix() const;\n};\n```\n\n`ToMatrix` 函数将变换转换为矩阵。这只是从成员数据创建旋转矩阵和平移矩阵，并将这些矩阵相乘。此函数是必要的，因为尽管许多中间计算直接使用四元数和向量变量，但图形代码和着色器最终需要矩阵。\n\
  \n![Image 1330](img/index-790_1.jpg)\n\n为了定义整个骨架，对于每根骨骼，你需要知道骨骼的名称、骨骼的父级以及它的骨骼变换。对于骨骼变换，当整个骨架处于绑定姿态时，你具体存储的是局部姿态（从父级的变换）。\n\
  \n存储这些骨骼的一种方法是使用数组。数组的索引 0 对应根骨，随后的每根骨骼都通过索引号引用其父级。对于图 12.2，中的示例，存储在索引 1 的脊柱骨父级索引为\
  \ 0，因为根骨是它的父级。同样，存储在索引 2 的髋骨的父级索引为 1。\n\n**图 12.2** 作为骨骼数组表示的骨架\n\n这导致了以下 `Bone`\
  \ 结构体，它包含局部绑定姿态变换、骨骼名称和父级索引：\n\n**点击此处查看代码图片**\n\n```\nstruct Bone\n{\n    BoneTransform\
  \ mLocalBindPose;\n    std::string mName;\n    ![Image 1331](img/index-791_1.jpg)\n\
  \    ![Image 1332](img/index-791_2.jpg)\n    int mParent;\n};\n```\n\n然后，你定义一个骨骼的\
  \ `std::vector`，可以根据骨架来填充它。根骨将其父级索引设置为 -1，但其他所有骨骼都有一个指向数组的父级索引。为了简化后续计算，父级在数组中的索引应该早于它们的子骨骼。例如，因为左髋是脊柱的子级，所以左髋的索引永远不比脊柱低。\n\
  \n用于存储骨架数据的 JSON 文件格式直接镜像了这种表示。列表 12.1 给出了骨架文件的片段，显示了前两根骨骼：根骨和盆骨。\n\n**列表 12.1**\
