  \ manually edit. Text files also play very nicely with source control systems such\
  \ as `Git` because it’s very easy to see what changed in a file between two revisions.\
  \ During development, it’s also easier to debug loading of assets if they are text\
  \ files.\n\nHowever, the disadvantage of using text-based file formats is that they\
  \ are inefficient, both in terms of disk and memory usage as well as in terms of\
  \ performance at runtime. Formats such as `JSON` or `XML` take up a lot of space\
  \ on disk simply because of the formatting characters they use, such as braces and\
  \ quotation marks. On top of this, parsing text-based files at runtime is slow,\
  \ even with high-performance libraries such as `RapidJSON`. For example, on my computer,\
  \ it takes about three seconds to load in the `CatWarrior.gpmesh` file in a debug\
  \ build. Clearly, this would lead to slow load times for a larger game.\n\nFor the\
  \ best of both worlds, you may want to use text files during development (at least\
  \ for some members of the team) and then binary files in optimized builds. This\
  \ section explores how to create a binary mesh file format.\n\nTo keep things simple,\
  \ in the code that loads in the `gpmesh` JSON format, you will first check if a\
