  bool PhysWorld::SegmentCast(const LineSegment& l, CollisionInfo& outColl)\n{\n \
  \   bool collided = false;\n    // 初始化 closestT 为无穷，以便\n    // 总是更新 closestT\n \
  \   float closestT = Math::Infinity;\n    Vector3 norm;\n    // 测试所有的盒\n    for\
  \ (auto box : mBoxes)\n    {\n        // 线段是否与盒相交？\n        float t;\n        if\
  \ (Intersect(l, box->GetWorldBox(), t, norm))\n        {\n            // 比之前的碰撞更近\n\
  \            if (t < closestT)\n            {\n                closestT = t;\n \
  \               outColl.mPoint = l.PointOnSegment(t);\n                outColl.mNormal\
  \ = norm;\n                outColl.mBox = box;\n                outColl.mActor =\
  \ box->GetOwner();\n                collided = true;\n            }\n        }\n\
  \    }\n    return collided;\n}\n```\n\n### 使用 SegmentCast 处理碰撞\n\n在章节的项目中，你使用 `SegmentCast`\
  \ 来判断玩家发射的球体是否击中了物体。如果命中，你希望球沿着表面法线反弹。这意味着一旦球击中表面，你必须将其旋转到任意方向。\n\n你首先在 `Actor`\
