  \          {\n            \"rot\":[-0.500199,0.499801,-0.499801,0.500199],\n   \
  \         \"trans\":[0.000000,0.000000,0.000000]\n          },\n          {\n  \
  \          \"rot\":[-0.500199,0.499801,-0.499801,0.500199],\n            \"trans\"\
  :[0.000000,0.000000,0.000000]\n          }\n          // 额外的变换，直到帧数\n          //\
  \ ...\n        ],\n        ![Image 1353](img/index-814_1.jpg)\n        ![Image 1354](img/index-814_2.jpg)\n\
  \        // 每个骨骼的额外轨道\n        // ...\n      }\n    ]\n  }\n}\n```\n\n\n\n\n```cpp\n\
  // 设置根节点的姿态\n\n// 根节点是否有轨道？\nif (mTracks[0].size() > 0)\n{\n    // 根节点的全局姿态就是它的局部姿态\n\
  \    outPoses[0] = mTracks[0][frame].ToMatrix();\n}\nelse\n{\n    outPoses[0] =\
  \ Matrix4::Identity;\n}\n\nconst std::vector<Skeleton::Bone>& bones = inSkeleton->GetBones();\n\
  \n// 现在计算其他骨节点的全局姿态矩阵\nfor (size_t bone = 1; bone < mNumBones; bone++)\n{\n    Matrix4\
  \ localMat; // 默认为单位矩阵\n    if (mTracks[bone].size() > 0)\n    {\n        ![Image\
  \ 1357](img/index-819_1.jpg)\n        ![Image 1358](img/index-819_2.jpg)\n     \
  \   localMat = mTracks[bone][frame].ToMatrix();\n    }\n    outPoses[bone] = localMat\
  \ * outPoses[bones[bone].mParent];\n}\n```\n\n注意，由于并不是每个骨节点都有轨道，`GetGlobalPoseAtTime`\
  \ 必须首先检查该骨节点是否有轨道。如果没有，该骨节点的局部姿态矩阵将保持为单位矩阵。\n\n接下来，你使用一种常用模式：为你的数据创建一个映射（map）以及一个对应的\
  \ get 函数来在 map 中缓存数据。这次，map 包含 Animation 指针，并将其添加到 `Game` 中。\n\n现在你需要为 `SkeletalMeshComponent`\
  \ 类添加功能。记得，对于每个 `bone`，矩阵色板（matrix palette）存储的是逆绑定姿态矩阵乘以当前姿态矩阵的乘积。当在计算蒙皮顶点的位置时，你会使用这个色板。由于\
  \ `SkeletalMeshComponent` 类跟踪动画的当前播放情况并可以访问骨骼，因此在此处存储色板是合理的。你首先为 `MatrixPalette`\
