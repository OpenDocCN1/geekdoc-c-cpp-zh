  \ Mark DeLoura. Hingham: Charles River Media, 2001.\n\n### 练习\n\n在本章的第一个练习中，你需要减小\
  \ `SaveLevel` 创建的 JSON 文件的大小。在第二个练习中，你把 `Animation` 文件格式转换为二进制格式。\n\n#### 练习 14.1\n\
  \n`SaveLevel` 代码的一个问题是你写了每个 actor 及其所有组件的每个属性。然而，对于像 `TargetActor` 这样的特定子类，在构造后几乎没有属性或组件发生。\n\
  \n为了解决这个问题，在保存关卡时，你可以创建一个临时的 `TargetActor`，并使用标准的写入技术写入该 actor 的 JSON 对象。这个 JSON\
  \ 对象作为模板，因为它是 `TargetActor` 初始生成时的状态。然后，对于关卡中保存的每个 `TargetActor`，将其 JSON 对象与模板进行比较，并只写入不同的属性和组件。\n\
  \n你可以将此过程应用于所有不同类型的 actor。为了辅助实现，`RapidJSON` 提供了重载的比较运算符。只有当两个 `rapidjson::Values`\
  \ 的类型和内容相同时，它们才相等。通过这种，你可以消除至少大部分组件的设置（因为它们不会改变）。在细粒度（每个属性）级别上执行此操作将需要更多工作。\n\n\
