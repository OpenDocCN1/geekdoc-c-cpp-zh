  \ 状态。图 11.1 显示了使用这个简单版本的暂停菜单时暂停的游戏（它现在还不是真正的菜单，因为还没有按钮）。\n\n**图 11.1** 显示基础暂停菜单的游戏界面\n\
  \n#### 按钮\n\n游戏中的大多数菜单都有玩家可以交互的按钮。例如，暂停菜单可能有恢复游戏、退出游戏、配置选项等按钮。由于不同的 `UI` 屏幕可能需要按钮，在\
  \ `UIScreen` 类中添加这种支持是合理的。\n\n为了封装按钮，你可以声明一个 `Button` 类，如代码 11.5 所示。\n\n```cpp\n\
  class Button\n{\npublic:\n    // 构造函数接收名称、字体、回调和位置\n    Button(const std::string&\
  \ name, Font* font, std::function<void()> onClick, Vector2 pos, Vector2 dims);\n\
  \    ~Button();\n    // 设置按钮名称\n    void SetName(const std::string& name);\n   \
  \ // 如果点在范围内则返回 true\n    bool ContainsPoint(const Vector2& pt) const;\n    // 当按钮被点击时调用\n\
  \    void OnClick();\n\nprivate:\n    std::function<void()> mOnClick;\n    std::string\
  \ mName;\n    Texture* mNameTex;\n    Font* mFont;\n    Vector2 mPosition;\n   \
  \ Vector2 mDimensions;\n    bool mHighlighted;\n};\n```\n\n`Button` 有一个 `ContainsPoint`\
  \ 函数，给定一个点，如果点在边界内则返回真。该方法与第 10 章中的方法相同。如果这四种情况都不成立，则按钮包含该点：\n\n```cpp\nbool Button::ContainsPoint(const\
  \ Vector2& pt) const\n{\n    bool no = pt.x < (mPosition.x - mDimensions.x / 2.0)\
  \ ||\n               pt.x > (mPosition.x + mDimensions.x / 2.0) ||\n           \
  \    pt.y < (mPosition.y - mDimensions.y / 2.0) ||\n               pt.y > (mPosition.y\
  \ + mDimensions.y / 2.0);\n    return !no;\n}\n```\n\n`Button::SetName` 使用之前讨论过的\
  \ `RenderText` 函数创建按钮名称的纹理，并存储在 `mNameTex` 中。`OnClick` 函数简单地调用 `mOnClick` 处理器：\n\
  \n```cpp\nvoid Button::OnClick()\n{\n    if (mOnClick)\n    {\n        mOnClick();\n\
  \    }\n}\n```\n\n你在 `UIScreen` 中添加了额外的成员变量来支持按钮：一个 `Button` 指针向量和两个按钮纹理。一个纹理用于未选中按钮，另一个用于选中按钮。使用不同的纹理让玩家更容易区分选中和未选中的按钮。\n\
  \n接下来，你添加了一个辅助函数来方便创建新按钮：\n\n点击此处查看代码图片\n\n```cpp\nvoid UIScreen::AddButton(const\
