  \ Sousa 的文章讨论了如何使用资源文件，资源文件是将多个文件合并为一个文件。Martin Brownlow 的文章讨论了如何创建一个随处保存（save-anywhere）系统。最后，David\
  \ Koenig 的文章研究了如何提高加载文件的性能。\n\n*   Brownlow, Martin.“Save Me Now!” *Game Programming\
  \ Gems 3*. Ed. Dante Treglia. Hingham: Charles River Media, 2002.\n*   Koenig, David\
