  \ 函数并不特别特殊，因为它只是解析 `gpmesh` 文件并将其转换为本章早部分讨论的骨骼向量格式。（与其他的 JSON 文件加载代码一样，本章省略了此处的代码，尽管在书的\
  \ GitHub 仓库的项目代码中可以找到它。）\n\n如果骨骼文件加载成功，该函数将调用 `ComputeGlobalInvBindPose` 函数，该函数使用矩阵乘法计算每根骨骼的全局反向绑定姿矩阵。你使用了本章之前讨论的两遍历方法：首先，计算每根骨骼的全局绑定姿矩阵（global\
  \ bind pose matrix），然后对这些矩阵中的每一个进行求逆，得到每根骨骼的反向绑定姿矩阵。列表 12.5 提供了 `ComputeGlobalInvBindPose`\
  \ 的实现。\n\n### 列表 12.5 `Skeleton::ComputeGlobalInvBindPose` 实现\n\n**点击此处查看代码图像**\n\
  \n```cpp\nvoid Skeleton::ComputeGlobalInvBindPose()\n{\n    // 调整大小为骨骼数量，会自动填充单位矩阵\n\
  \    mGlobalInvBindPoses.resize(GetNumBones());\n\n    // 步骤 1: 计算每根骨骼的全局绑定姿\n \
  \   // 根节点的全局绑定姿就是其局部绑定姿\n    mGlobalInvBindPoses[0] = mBones[0].mLocalBindPose.ToMatrix();\n\
  \n    ![Image 1351](img/index-811_1.jpg)\n    ![Image 1352](img/index-811_2.jpg)\n\
  \n    // 剩余每个骨骼的全局绑定姿都是其局部姿态\n    // 与父节点全局绑定姿的乘积\n    for (size_t i = 1; i < mGlobalInvBindPoses.size();\
  \ i++)\n    {\n        Matrix4 localMat = mBones[i].mLocalBindPose.ToMatrix();\n\
  \        mGlobalInvBindPoses[i] = localMat * mGlobalInvBindPoses[mBones[i].mParent];\n\
  \    }\n\n    // 步骤 2: 反转矩阵\n    for (size_t i = 0; i < mGlobalInvBindPoses.size();\
  \ i++)\n    {\n        mGlobalInvBindPoses[i].Invert();\n    }\n}\n```\n\n使用熟悉的加载数据文件模式，你可以在\
  \ `Game` 类中添加一个存储 `Skeleton` 指针的 `unordered_map`，以及将骨骼加载到 map 并从 map 中检索它的代码。\n\n\
  最后，由于每个 `SkeletalMeshComponent` 也需要知道与其关联的骨骼，你在 `SkeletalMeshComponent` 的成员数据中添加了一个\
  \ `Skeleton` 指针。那么在创建 `SkeletalMeshComponent` 对象时，你也将为它分配恰当的骨骼。\n\n遗憾的是，添加 `Skeleton`\
  \ 代码并不会与仅仅在绑定姿下绘制角色模型相比产生任何可见的差异。要看到任何变化，你需要完成更多工作。\n\n#### 加载动画数据\n\n本书使用的动画文件格式也是\
  \ JSON。它首先包含一些基本信息，例如动画的帧数和持续时间（秒），以及关联骨骼中的骨骼数量。文件的其余部分是动画期间模型中骨骼的局部姿态信息。文件将数据组织成\
  \ `tracks`（轨道），其中包含每帧中每根骨骼的姿态信息。（`tracks` 一词源于基于时间的编辑器，如视频和音频编辑器。）\n\n如果骨骼有 10 根骨骼，且动画有\
  \ 50 帧，那么就有 10 个轨道，每个轨道对应该骨骼有 50 种姿态。列表 12.6\n\n```json\n{\n  \"version\":1,\n \
  \ \"sequence\":{\n    \"frames\":19,\n    \"duration\":0.600000,\n    \"bonecount\"\
