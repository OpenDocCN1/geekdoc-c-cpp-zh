  \ Mesh 文件加载代码，以加载带有骨骼顶点属性的 `gpmesh` 文件。（为了简洁，本章省略了文件加载代码。但像既往一样，源代码可以在本章对应的游戏项目中。）\n\
  \n接下来，你声明了一个继承自 `MeshComponent` 的 `SkeletalMeshComponent` 类，如列表 12.3。目前，该类没有重写基类\
