  | `int z = 200;` | `z` | `0xC238` | `200` |\n| `int* p = &y;` | `p` | `0xC23C` |\
  \ `0xC234` |\n\n```cpp\n*p = 42;\n```\n\n与必须引用某些对象的引用不同，指针可以指向空。指向空内容的指针被称为**空指针**。要将指针初始化为空，请使用\
  \ `nullptr` 关键字，如下代码所示：\n\n```cpp\nchar* ptr = nullptr;\n```\n\n![Image 1608](img/index-976_1.jpg)\n\
