    ```php\n$array = array( 'cute', 'fruit' => 'apple', 'name' => 'Bob' );\nkrsort($array);\n\
    print_r($array);\n```\n![](image_rsrc7XZ.jpg)\n### extract(variable_names)\nCan\
    \ accept multiple `variable_names`. Creates an array containing entries of a key\
    \ equal to `variable_name` and value equal to `variable_name`. If `variable_name`\
    \ is an array, then values of that array are used as variable names.\n\nNote:\
    \ Global variables cannot be used with `compact()`.\n\nExample:\n```php\n$variable\
    \ = 'value';\n$integer = 10;\n$name = 'Bob';\n$array = array( 'name', 'age' );\n\
    $result_array = extract('variable', 'integer', $array);\nprint_r($result_array);\n\
    ```\n![](image_rsrc7Y2.jpg) (image_rsrc7Y3.jpg)\n- `type` – `[optional]` default:\
    \ `EXTR_WRITE` (if collision, overwrite) Other values: `EXTR_SKIP` (if collision,\
    \ don't overwrite), `EXTR_SAME` (if collision, prefix), `EXTR_ALL` (prefix with\
    \ prefix), `EXTR_INVALID` (numeric w/ prefix), `EXTR_IF_EXISTS` (if variable exists,\
    \ create with prefix, else skip), `EXTR_FS` (extract as references).\n- `prefix`\
    \ – `[optional]` only if `type` is set to a value that includes `PREFIX`. The\
    \ prefix is always appended by an underscore (`_`).\n\nAll of these functions\
    \ are specific to the internal pointer of an array, and in most cases are used\
    \ in conjunction with one. They are all included here at once to give clarity\
    \ to how they work.\n\n- `current()` – Returns the current entry's value; does\
    \ not change the pointer.\n- `key()` – Returns the current entry's key; does not\
    \ change the pointer.\n- `next()` – Advances the pointer forward one, then returns\
    \ the entry's value.\n- `prev()` – Rewinds the pointer backward one, then returns\
    \ the entry's value.\n- `end()` – Advances the pointer to the end of the array,\
    \ then returns the value.\n- `reset()` – Rewinds the pointer to the beginning,\
    \ then returns the entry's value.\n\nExample:\n```php\n$array = array( 'zero',\
    \ 'one', 'two', 'three', 'four' );\ncurrent($array); // returns: zero\nkey($array);\
    \ // returns: 0\nnext($array); // returns: one\ncurrent($array); // returns: one\n\
    end($array); // returns: four\nprev($array); // returns: three\ncurrent($array);\
    \ // returns: three\nreset($array); // returns: zero\n```\n\n### each($array)\n\
    Returns an array containing the key and value of the current entry according to\
    \ the internal pointer of `$array`. Returns `FALSE` if the current position of\
    \ internal pointer when `each()` is called is past the end of the array.\n\nNote:\
    \ The returned array contains four entries, see below.\n\nExample:\n```php\n$array\
    \ = array( 'key' => 'value' );\n$entry = each($array);\nprint_r($entry);\n\n$array\
    \ = array( 'name' => 'Victor' );\n$entry = each($array);\nprint_r($entry);\n```\n\
    ![](image_rsrc7Y5.jpg) (image_rsrc7Y6.jpg) (image_rsrc7MK.jpg)\n\n### list(variable_name\
    \ [, ... variable_name ...])\nAssigns a list of variables with `variable_name`\
    \ as the variable itself. Written in the same way as assigning a value to a single\
    \ variable, however the assigned value must be an array, strings are not accepted.\n\
    \nExample:\n```php\nlist($name) = 'Bob'; // Not an acceptable value, a string\n\
    var_dump($name); // NULL\n$array = array('Bob');\nlist($name) = $array;\nvar_dump($name);\
    \ // string(3) \"Bob\"\n\n$array = array('Bob', 65, 'CEO');\nlist($name, $age,\
    \ $title) = $array;\necho \"$name ($title) - $age\"; // Bob (CEO) - 65\n$array\
    \ = array('Bob', 65, 'CEO');\nlist($name[], $name[], $name[]) = $array; // Assigned\
    \ in reverse order\nprint_r($name); // Array ([0] => CEO [1] => 65 [2] => Bob)\n\
    ```\nSee Also:\n- `array_values()` – Returns all the values in an array\n\n###\
    \ range(start , end [, increment ])\n- `start` – `$integer`, `$float` or `$string`\
    \ (single character)\n- `end` – `$integer`, `$float` or `$string` (single character)\n\
    - `increment` – `[optional]` `$integer` or `$float` default: 1\n\nReturns an indexed\
    \ array containing all the values between `start` and `end`, optionally incremented\
    \ by `increment`. Incrementation of characters is based on their ASCII value code.\n\
    \n**Note:** `Start` and `end` must be of the same variable type.\n\nExample:\n\
    ```php\nprint_r(range(0, 3)); // Array ([0] => 0 [1] => 1 [2] => 2 [3] => 3)\n\
    print_r(range(2, 8, 2)); // Array ([0] => 2 [1] => 4 [2] => 6 [3] => 8)\n```\n\
