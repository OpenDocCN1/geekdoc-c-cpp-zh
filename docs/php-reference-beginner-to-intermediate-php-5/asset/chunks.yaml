    # `strrpos( haystack , needle [, start ])`


    `haystack` – `$string`

    `needle` – `$string`

    `start` – [可选] `$integer`


    返回 `needle` 在 `haystack` 中最后一次出现的位置（从 `haystack` 开始计算的字符数）。如果包含 `start` 且为正整数，搜索将从
    `start` 个字符之后开始；如果是负数，则将从字符串末尾向前 `start` 个字符处停止搜索。


    注意：如果在 `haystack` 中未找到 `needle`，则返回 `FALSE`。提示参见 `strpos()`。


    **示例：**

    ```php

    $string = ''hello'';

    $needle = ''l'';

    echo strpos($string, $needle); // 查找第一次出现

    echo ''<br />''; // XHTML 换行

    echo strrpos($string, $needle); // 查找最后一次出现

    ```


    **相关：**

    - `strpos()` – 在 `haystack` 中查找 `needle` 的第一次出现

    - `strripos()` – 在 `haystack` 中查找 `needle` 的最后一次出现，不区分大小


    ---


    # `strripos()`


    `haystack` – `$string`

    `needle` – `$string`

    `start` – [可选] `$integer`


    返回 `needle` 在 `haystack` 中第一次出现的位置（从 `haystack` 开始计算的字符数），不区分大小。如果包含 `start`，搜索将从
    `start` 个字符之后开始。


    注意：如果在 `haystack` 中未找到 `needle`，则返回 `FALSE`。提示参见 `strpos()`。


    **示例：**

    ```php

    $string = ''And now for something completely different'';

    $needle = ''NOW'';

    echo stripos($string, $needle);

    ```


    **相关：**

    - `strripos()` – 在 `haystack` 中查找 `needle` 的最后一次出现，不区分大小

    - `strpos()` – 在 `haystack` 中查找 `needle` 的第一次出现，区分大小写


    ---


    # `strrpos()`


    `haystack` – `$string`

    `needle` – `$string`

    `start` – [可选] `$integer`


    返回 `needle` 在 `haystack` 中最后一次出现的位置（从 `haystack` 开始计算的字符数），不区分大小。如果包含 `start`
    且为正整数，搜索将从 `start` 个字符之后开始；如果是负数，则将从字符串末尾向前 `start` 个字符处停止搜索。


    注意：如果在 `haystack` 中未找到 `needle`，则返回 `FALSE`。提示参见 `strpos()`。


    **示例：**

    ```php

    $string = ''hello'';

    $needle = ''L'';

    echo strrpos($string, $needle); // 查找最后一次出现

    ```


    **相关：**

    - `strrpos()` – 在 `haystack` 中查找 `needle` 的最后一次出现，区分大小写

    - `stripos()` – 在 `haystack` 中查找 `needle` 的第一次出现，不区分大小


    ---


    # `strpos()`


    `haystack` – `$string`

    `needle` – `$string`


    查找 `haystack` 中是否包含 `needle`，并返回从 `needle` 第一次出现到 `haystack` 结束的部分。


    注意：如果在 `haystack` 中未找到 `needle`，则返回 `FALSE`。


    **示例：**

    ```php

    $string = ''www.example.com'';

    $needle = ''example'';

    echo strstr($string, $needle);

    ```


    **相关：**

    - `stristr()` – `strstr()` 的不区分大小写版本


    ---


    # `strstr()`


    `haystack` – `$string`

    `needle` – `$string`


    查找 `haystack` 中是否包含 `needle`，并返回从 `needle` 第一次出现到 `haystack` 结束的部分，不区分大小。


    注意：如果在 `haystack` 中未找到 `needle`，则返回 `FALSE`。


    **示例：**

    ```php

    $string = ''www.example.com'';

    $needle = ''EXAMPLE'';

    echo stristr($string, $needle);

    ```


    **相关：**

    - `strstr()` – `stristr()` 的区分大小写版本


    ---


    # `strlen()`


    `$string` 的长度，如果为空则返回 0。


    **示例：**

    ```php

    $string = ''Hello!'';

    echo strlen($string);

    ```


    ---


    # `strtolower()`


    将 `$string` 中的所有字符转换为小写并返回新字符串。


    **示例：**

    ```php

    $string = ''Mario Lurig'';

    echo strtolower($string);

    ```


    ---


    # `strtoupper()`


    将 `$string` 中的所有字符转换为大写并返回新字符串。


    **示例：**

    ```php

    $string = ''Mario Lurig'';

    echo strtoupper($string);

    ```


    ---


    # `ucfirst()`


    将 `$string` 中的第一个字符转换为大写并返回新字符串。


    **示例：**

    ```php

    $string = ''i wish i had some capitalization'';

    echo ucfirst($string);

    ```


    ---


    # `ucwords()`


    将 `$string` 中每个单词的第一个字母字符转换为大写并返回新字符串。


    **示例：**

    ```php

    $string = ''i wish i had 3three some capitalization'';

    echo ucwords($string);

    ```


    ---


    # `strpbrk()`


    `haystack` – `$string`

    `characters` – `$string`


    查找 `haystack` 中是否包含 `needle` 中的任何字符，并返回找到的第一个字符到 `haystack` 结束的部分。


    注意：如果在 `haystack` 中未找到任何指定字符，则返回 `FALSE`。


    **示例：**

    ```php

    $string = ''www.example.com'';

    $needle = ''./'';

    echo strpbrk($string, $needle);

    ```


    ---


    # `strrev()`


    反转字符串。


    **示例：**

    ```php

    echo strrev(''hello'');

    ```


    ---


    # Array Functions


    反转数组。


    **示例：**

    ```php

    $array = array(''apple'', ''banana'', ''cherry'');

    print_r(array_reverse($array));

    ```


    ### Array Functions


    反转数组的键和值对关系。


    **示例：**

    ```php

    $array = array(1, 2, 3);

    ```


    ### Case Conversion


    转换数组键的大小。


    **示例：**

    ```php

    $array = array(''a'' => 1, ''b'' => 2);

    print_r(array_key_case($array));

    ```


    ### Case Conversion


    `option` – [可选] `$integer` (0 或 1) 默认值：0 (小写)。转换数组键的大小。


    **示例：**

    ```php

    $array = array(''A'' => 1, ''B'' => 2);

    print_r(array_key_case($array, 1));

    ```


    ### `array_chunk()`


    `size` – `$integer`

    `preserve_keys` – [可选] `$boolean` 默认值：FALSE 按照 `size` 指定的数量拆分 `$array`，返回一个多维数组。如果没有指定
    `preserve_keys`，则将重新索引值。如果 `preserve_keys` 设置为 `TRUE`，则保留键。


    **示例：**

    ```php

    $array = array(''name'' => ''bob'', ''job'' => ''dad'' );

    print_r(array_chunk($array, 1));

    $array = array(''name'' => ''bob'', ''job'' => ''dad'' );

    print_r(array_chunk($array, 1, TRUE));

    ```


    ### `array_combine()`


    `key_array` – `$array`

    `value_array` – `$array`


    使用 `key_array` 中的值作为键，`value_array` 中的值作为值创建一个新数组。

    注意：如果两个数组的条目数量不匹配，返回 `FALSE`。


    **示例：**

    ```php

    $keys = array ( ''name'', ''job'', ''age'' );

    $values = array ( ''Bob'', ''knight'', 42 );

    $newarray = array_combine($keys, $values);

    print_r($newarray);

    ```


    ### `array_merge()`


    接受多个数组值，且只有一个参数时行为不同。如果只提供一个索引 `$array`，它将持续重新索引该数组。如果提供多个 `$array`，将合并两个数组的内容，所有索引键都包含在新数组中，而相同的关联键将取最后一个提供的
    `$array` 的值。


    **示例：**

    ```php

    $array = array ( 3 => ''one'', 0 => ''two'', 2 => ''three'' );

    print_r( array_merge($array) );

    $array = array ( ''zero'', ''one'', ''name'' => ''Bob'' );

    $array2 = array ( ''alsozero'', ''name'' => ''John'', ''job'' => ''farmer'' );

    print_r( array_merge($array, $array2) );

    ```

    '
- fmt: '

    If you want to combine two arrays and do not mind if values with the same keys
    accept the values from the first array and discard any other arrays supplied,
    simply use the plus sign ( `+` ).


    ```php

    $array = array ( ''zero'', ''name'' => ''Bob'', ''job'' => ''player'' );

    $array2 = array ( ''alsozero'', ''job'' => ''farmer'' );

    print_r( $array + $array2 );

    ```

    ```

    Array ([0] => zero [name] => Bob [job] => player)

    ```


    ### array_count_values()

    `array_count_values($array)` returns an array with the unique values in `$array`
    as the keys and their count as the values.

    **Note:** Does not work for multi-dimensional arrays.


    Example:

    ```php

    $array = array ( ''zero'', ''one'', ''zero'' );

    print_r( array_count_values($array) );

    ```

    See Also: `count()` – Count the total number of entries in an array.


    ### count()

    Counts the number of elements in `$array`. By default, entries within arrays that
    are part of `$array` (multidimensional arrays) are not counted unless `mode` is
    set to 1.

    - `mode` – [optional] `$integer` default: 0, does not count multidimensional arrays.

    - Other value: 1, counts entries within multidimensional arrays.


    Examples:

    ```php

    $array = array (''zero'',''names'' => array ( ''john'', ''dave'' ), ''ages'' =>
    array ( 22, 34 ) );

    echo count($array);

    echo count($array, 1);

    ```

    See Also: `array_count_values()` – Get the number of unique values inside of an
    array.


    ### array_diff()

    Accepts multiple `$array` for comparison against `first_array`.

    - `first_array` – `$array`: Compares the values of all `$array(s)` against the
    values in `first_array` and returns an array with the entries of `first_array`
    which do not share values with entries in `$array(s)`.


    Example:

    ```php

    $array = array( ''one'', ''two'', ''three'', ''four'' );

    $array2 = array( ''two'', ''three'' );

    $array3 = array( ''bob'' => ''one'' // value is ''one'', matching $array

    print_r( array_diff($array, $array2, $array3) );

    ```

    See Also: `array_diff_key()` – Same comparison, but based on keys instead of values;
    `array_diff_assoc()` – Same comparison, but based on both keys and values.


    ### array_intersect()

    Accepts multiple `$array` for comparison against `first_array`.

    - `first_array` – `$array`: Compares the values of all `$array(s)` against the
    values in `first_array` and returns an array with the entries of `first_array`
    which share values with entries from all `$array(s)`.


    Example:

    ```php

    $array = array( ''one'', ''two'');

    $array2 = array( ''two'', ''one'', ''three'', ''four'' ); // ''one'',''two'' match

    $array3 = array( ''bob'' => ''one'' ); // only ''one'' matches

    print_r( array_intersect($array, $array2, $array3) );

    ```

    See Also: `array_intersect_key()` – Same comparison, but based on keys; `array_intersect_assoc()`
    – Same comparison, but based on both keys and values.


    ### array_diff_key()

    Accepts multiple `$array` for comparison against `first_array`.

    - `first_array` – `$array`: Compares the keys of all `$array(s)` against the keys
    in `first_array` and returns an array with the entries of `first_array` which
    do not share keys with entries in `$array(s)`.


    Example:

    ```php

    $array = array( ''zero'', ''name'' => ''john'', ''job'' => ''john'' );

    $array2 = array( ''alsozero'', ''job'' => ''john'' );

    print_r( array_diff_key($array, $array2));

    ```

    See Also: `array_diff()` – Same comparison, but based on values only; `array_diff_assoc()`
    – Same comparison, but based on both keys and values.


    ### array_diff_assoc()

    Accepts multiple `$array` for comparison against `first_array`.

    - `first_array` – `$array`: Compares the contents of all `$array(s)` against the
    keys and values in `first_array` and returns an array with the entries of `first_array`
    which share exact keys and values with entries in `$array(s)`.


    Example:

    ```php

    $array = array( ''zero'', ''one'', ''name'' => ''john'' );

    $array2 = array( ''zero'', ''alsoone'', ''name'' => ''john'' );

    print_r( array_diff_assoc($array, $array2) );

    ```

    See Also: `array_diff_key()` – Same comparison, but based on keys instead of values;
    `array_diff()` – Same comparison, but based on values only.


    ### array_intersect_key()

    Accepts multiple `$array` for comparison against `first_array`.

    - `first_array` – `$array`: Compares the keys of all `$array(s)` against the keys
    in `first_array` and returns an array with the entries of `first_array` which
    share keys with entries from all `$array(s)`.


    Example:

    ```php

    $array = array( ''zero'', ''name'' => ''john'', ''job'' => ''john'' );

    $array2 = array( ''alsozero'', ''job'' => ''john'' );

    print_r( array_diff_key($array, $array2)); // Note: original text used array_diff_key
    here but context implies intersect_key

    ```


    ### array_flip()

    `array_flip($array)` returns an array with the keys of `$array` as values, and
    the values of `$array` as the new keys. Be aware that if the original value is
    not a `$string` or `$integer` it will not be converted and an error will be generated.

    Note: Any original values that are the same as previous original values, when
    flipped to be a key, will overwrite the previous original value/key.


    Example:

    ```php

    $array = array( ''CEO'' => ''Bob'', ''zero'', ''Owner'' => ''Bob'' );

    print_r( array_flip($array) );

    ```

    See Also: `array_reverse()` – Reverses the order of entire entities in an array.


    If there is no concern for `$boolean` or `$float` values being removed after the
    flip, you can suppress errors ( `@` ) on `array_flip()` so that they are ignored.

    ```php

    $array = array( ''CEO'' => ''Bob'', ''good guy'' => TRUE );

    $newarray = @array_flip($array);

    print_r($newarray);

    ```

    ```

    Array ( [Bob] => CEO )

    ```

