  trans: "\n\n# `implode(limiter, $array)`\n\n返回一个包含 `$array` 内容的字符串，并用提供的 `limiter`\
    \ 连接。\n\n示例：\n```php\n$array = array( 'Hello', 'World', '!' );\n$string = implode('\
    \ ', $array); // 使用空格作为分隔符\necho $string; // Hello World !\n```\n\n**参见：** `explode()`\
    \ – 使用特定的分隔字符串将字符串拆分为数组。\n\n![](img/image_rsrc7SC.jpg)\n\n# `sprintf()`\n\n接受多个输入，并在\
    \ `formatting` 中指定时使用。\n\n- `formatting` – `$string`，特定的格式字符串，见下文。\n- `inputs`\
    \ – 需要格式化的 `$scalar(s)`\n\n返回一个格式化后的字符串，使用 `inputs` 根据预设的规则（见下文）将其值动态输入到格式化字符串中。\n\
    \n以下是格式输入的可用命名法。\n\n![](img/image_rsrc7SD.jpg)\n\n每当预期输入作为格式化字符串的一部分被使用和评估时，其前面有一个百分号（`%`），后面紧跟说明符/规则：\n\
    \n**注意：** 除类型说明符外，所有说明符都是可选的。\n\n- **符号说明符**。放置加号（`+`）会强制显示负号和正号（默认仅指定负值）。\n-\
    \ **填充说明符**。默认是空格，不需要指定。也可以使用零（`0`）而无需任何次要记法。如果使用任何其他字符，应在它前面加一个单引号（`' ` `）。\n\
    - **对齐说明符**。默认是右对齐（因此填充内容放置在字符串的左侧）。放置减号/减法符号（`-` `）将将其设置为左对齐。\n- **宽度说明符**。此整数决定了输出的最小字符长度。当与填充结合时，指定的宽度减去输入的长度决定了将添加的填充字符数。\n\
    - **精度说明符**。点（`.`）后跟一个整数，设置了浮点数应输出的小数位数。如果用在字符串，它将为输出设置最大字符限制。\n- **类型说明符**：\n\
    \    - `%` – 字面量百分号，因此在格式字符串中显示百分号时应写为 `%%`。\n    - `b` – 输入应为整数，输出为二进制数。\n  \
    \  - `c` – 输入应为 0-255 之间的整数，代表 ASCII 字节值。输出代表该值的字符。\n    - `d` – 输入为整数。\n    -\
    \ `e` – 输入为科学计数法。\n    - `u` – 输入为无符号十进制。\n    - `f` – 输入为浮点数（感知区域）。\n    - `F`\
    \ – 输入为浮点数（不感知区域）。\n    - `o` – 输入为整数，输出为八进制数。\n    - `s` – 输入为字符串。\n    - `x`\
    \ – 输入为整数，输出为十六进制数（使用小写字母）。\n    - `X` – 输入为整数，输出为十六进制数（使用大写字母）。\n\n## 示例\n\n\
    ### 基础替换，无可选说明符\n```php\n$string = 'cat';\n$integer = 10;\n![](img/image_rsrc7SE.jpg)\n\
    echo sprintf(\"I have %d %s(s)\", $integer, $string);\n```\n\n### 基础替换，类型指定自动调整\n\
    ```php\n$string = 'cat';\n$string2 = '10 blah';\n![](img/image_rsrc7SF.jpg)\n\
    echo sprintf(\"I have %d %s(s)\", $string2, $string);\n```\n\n### 使用符号说明符\n```php\n\
    $string = 'cat';\n$integer = '10';\n![](img/image_rsrc7SG.jpg)\necho sprintf(\"\
    Dagger has a %+d against %ss\", $integer, $string);\n```\n\n### 使用填充和宽度说明符（默认填充说明符为空格）\n\
    ```php\n$string = 'cat'; // 长度为 3 个字符\necho '<pre>'; // 需要 HTML 来正确显示格式化\necho\
    \ sprintf(\"3 spaces added: |%6s\", $string);\n![](img/image_rsrc7SH.jpg) // 使用了\
    \ 6 个字符填充，6 – 3 = 3 个填充空格\n```\n\n### 使用零（`0`）进行填充和宽度\n```php\n$month = 12;\n\
    $day = 1;\n$year = 1980;\necho sprintf (\" Date: %02d/%02d/%04d.\", $month, $day,\
    \ $year);\n$year = 80;\n![](img/image_rsrc7SJ.jpg)\necho sprintf (\" Date: %02d/%02d/%04d.\"\
    , $month, $day, $year);\n```\n\n### 使用自定义字符星号（`*`）进行填充和宽度\n```php\n$endofpassword\
    \ = 'word';\n$output = sprintf(\"Your password: %'*8s\", $endofpassword);\necho\
    \ $output; // Your password: ****word\n```\n\n### 使用填充、对齐（左侧）和宽度\n```php\n$endofpassword\
    \ = 'word';\n$output = sprintf(\"Your password: %'*-8s\", $endofpassword);\necho\
    \ $output; // Your password: word****\n```\n\n### 使用精度说明符\n```php\n$scientific\
    \ = 1.2e3;\necho sprintf(\"Three decimal places: %.3e\", $scientific); // Three\
    \ decimal places: 1.200e+3\n$float = 1.2e3;\necho sprintf(\"Two decimal places:\
    \ %.2f\", $float); // Two decimal places: 1200.00\n$string = 'Hello World!';\n\
    echo sprintf(\"Cut-off after 4 characters: %.4s\", $string); // Cut-off after\
    \ 4 characters: Hell\n```\n\n**参见：**\n- `printf()` – 输出格式化字符串结果，而不是简单的返回它们。\n\
    - `sscanf()` – 通过格式化字符串解析字符串，是 `sprintf()` 的反向。\n\n| 为了 MySQL 安全，你可以使用 `sprintf()`\
    \ 强制用户输入具有最大长度并符合你的数据库结构。使用精度说明符自动解析由 GET 或 POST 提交的字符串。 |\n\n"
- fmt: "\n# printf( formatting , inputs [, ... inputs ... ] )\n\nAccepts multiple\
    \ inputs to be used when specified in `formatting`.\n\n- `formatting` – `$string`,\
    \ specific formatting string. See `sprintf()` for nomenclature.\n- `inputs` –\
    \ `$scalar(s)` to be formatted.\n\nPrints a formatted string, `formatting`, using\
    \ the `inputs` to dynamically input their values into the formatted string using\
    \ a preset set of rules.\n\n**Note:** See `sprintf()` for rules for formatting\
    \ strings.\n\nExample:\n```php\n$string = 'puppies';\nprintf(\"I think %s are\
    \ cute.\", $string);\n```\n![](image_rsrc7SK.jpg)\n\n**See Also:** `sprintf()`\
    \ – Returns the formatted string, explains rules/nomenclature.\n\n# sscanf( $string,\
    \ format [, ... outputs ] )\n\nAccepts multiple [optional] outputs, but changes\
    \ the behavior of the function.\n\nExamines the given `$string` and parses it\
    \ based on the expected formatting . Returns an array when no outputs are included.\
    \ If outputs are included, they specify by reference the variable names to assign\
    \ the formatted contents.\n\n**Note:** See `sprintf()` for rules for formatting\
    \ strings – type specifiers.\n\nExample:\n```php\n$string = '12/1/1980';\n$array\
    \ = sscanf($string, \"%d/%d/%d\");\necho '<pre>'; // For improved readability\n\
    print_r($array);\n```\n![](image_rsrc7SN.jpg)\n\n```php\n$string = '12/1/1980';\n\
    $outputs_count = sscanf($string, \"%d/%d/%d\", $month, $day, $year);\nvar_dump\
    \ ($month, $day, $year);\n```\n![](image_rsrc7SP.jpg)\n\n**See Also:**\n- `sprintf()`\
    \ – Reverse of `sscanf()` and provides explanation of formatting strings.\n- `list()`\
    \ – Assigns the values of an array to variable names.\n\n# list( $string [, quotes_flag\
    \ ] [, character_set ] )\n\n- `quotes_flag` – [optional] `$string` default: `ENT_COMPAT`\
    \ (double quotes only). Other values:\n    - `ENT_QUOTES` (both single and double\
    \ quotes)\n    - `ENT_NOQUOTES` (neither double nor single)\n- `character_set`\
    \ – [optional] `$string` default: `ISO-8859-1`\n\nConverts some characters in\
    \ `$string` with special meaning in HTML to their safe HTML entities. This includes\
    \ (but may be limited by some optional `flags`): double quotes (`\"`), single\
    \ quotes (`'`), greater than (`>`), less than (`<`), and ampersand (`&`).\n\n\
    Example:\n```php\n$string = '<strong>Hello & World!</strong><br />';\necho htmlspecialchars($string);\n\
    ```\n![](image_rsrc7SS.jpg)\nHTML source code:\n\n**See Also:**\n- `htmlspecialchars_decode()`\
    \ – Reverses the effect of `htmlspecialchars()`.\n- `htmlentities()` – Effects\
    \ all HTML entities, not just the five above.\n\n# htmlspecialchars_decode( $string\
    \ [, quotes_flag ] [, character_set ] )\n\n- `quotes_flag` – [optional] `$string`\
    \ default: `ENT_COMPAT` (double quotes only). Other values:\n    - `ENT_QUOTES`\
    \ (both single and double quotes)\n    - `ENT_NOQUOTES` (neither double nor single)\n\
    - `character_set` – [optional] `$string` default: `ISO-8859-1`\n\nConverts HTML\
    \ entities back to the character representation in `$string`. This includes (but\
    \ may be limited by some optional `flags`): double quotes (`\"`), single quotes\
    \ (`'`), greater than (`>`), less than (`<`), and ampersand (`&`).\n\nExample:\n\
    ```php\n$string = '&lt;strong&gt;Hello &amp; World!';\necho htmlspecialchars_decode($string);\n\
    ```\n![](image_rsrc7SU.jpg)\nHTML source code:\n\n**See Also:**\n- `htmlspecialchars()`\
    \ – Converts the five items above into their HTML entities.\n- `html_entity_decode()`\
    \ – Effects all HTML entities, not just the five above.\n\n# htmlentities( $string\
    \ [, quotes_flag ] [, character_set ] )\n\n- `quotes_flag` – [optional] `$string`\
    \ default: `ENT_COMPAT` (double quotes only). Other values:\n    - `ENT_QUOTES`\
    \ (both single and double quotes)\n    - `ENT_NOQUOTES` (neither double nor single)\n\
    - `character_set` – [optional] `$string` default: `ISO-8859-1`\n\nConverts some\
    \ characters in `$string` with special meaning in HTML to their safe HTML entities.\n\
    \nExample:\n```php\n$string = \"<strong>'Hello World!'\";\necho htmlentities($string,\
    \ ENT_QUOTES);\n```\nHTML source code: `&lt;strong&gt;&#039;Hello World!&#039;`\n\
    \n**See Also:**\n- `html_entity_decode()` – Reverses the effect of `htmlentities()`.\n\
    - `htmlspecialchars()` – Effects only five specific HTML entities.\n\n# html_entity_decode(\
    \ $string [, quotes_flag ] [, character_set ] )\n\n- `quotes_flag` – [optional]\
    \ `$string` default: `ENT_COMPAT` (double quotes only). Other values:\n    - `ENT_QUOTES`\
    \ (both single and double quotes)\n    - `ENT_NOQUOTES` (neither double nor single)\n\
    - `character_set` – [optional] `$string` default: `ISO-8859-1`\n\nConverts all\
    \ HTML entities back to the character representation in `$string`.\n\nExample:\n\
    ```php\n$string = '&lt;strong&gt;&#039;Hello World!&#039;';\necho html_entity_decode($string);\
    \ // single quotes not converted\n```\nHTML source code: `<strong>&#39;Hello World!&#39;`\n\
    \n**See Also:**\n- `htmlentities()` – Converts all HTML entities.\n- `htmlspecialchars_decode()`\
    \ – Decodes five specific HTML entities.\n\n# trim( $string [, characters ] )\n\
    \n- `characters` – [optional] `$string`\n\nRemove from the beginning and end of\
    \ `$string` the following characters when `characters` is not included: whitespace\
    \ (` `), tab (`\\t`), new line (`\\n`), carriage return (`\\r`), NUL byte (`\\\
    0`), and vertical tab (`\\x0B`). If `characters` is included, that list is used\
    \ instead.\n\n**Note:** Once a character not from the list is reached, trimming.\n\
    \nExample:\n```php\n$string = \" \\n Hello World! \\t\";\ntrim($string); // Hello\
    \ World!\n```\n![](image_rsrc7MK.jpg)\n\nWithin `characters`, a double period\
    \ (`..`) can specify a range (e.g. `a..z` is a through z).\n\nExample:\n```php\n\
    $string = \" \\t\\n!r\"; // r will be removed because d is not in the list\ntrim($string,\
    \ \" \\t\\n!d..r\"); // range of d through r (lowercase)\n```\n**See Also:**\n\
    - `ltrim()` – Trim only from the beginning of the string.\n- `rtrim()` – Trim\
    \ only from the end.\n\n# ltrim( $string [, characters ] )\n\n- `characters` –\
    \ [optional] `$string`\n\nRemove from the beginning of `$string` the following\
    \ characters when `characters` is not included: whitespace (` `), tab (`\\t`),\
    \ new line (`\\n`), carriage return (`\\r`), NUL byte (`\\0`), and vertical tab\
    \ (`\\x0B`). If `characters` is included, that list is used instead.\n\n**Note:**\
    \ Once a character not from the list is reached, trimming.\n\nExample:\n```php\n\
    $string = \" \\n Hello World!\";\nltrim($string); // Hello World!\n```\n```php\n\
    ltrim($string, \" \\AH..z\"); // All capital letters between A and H, and all\
    \ lowercase World!\n```\n**See Also:**\n- `trim()` – Trim from the beginning and\
    \ the end of the string.\n\n# rtrim( $string [, characters ] )\n\nrtrim is also\
    \ known as `chop()`.\n\n- `characters` – [optional] `$string`\n\nRemove from the\
    \ end of `$string` the following characters when `characters` is not included:\
    \ whitespace (` `), tab (`\\t`), new line (`\\n`), carriage return (`\\r`), NUL\
    \ byte (`\\0`), and vertical tab (`\\x0B`). If `characters` is included, that\
    \ list is used instead.\n\n**Note:** Once a character not from the list is reached,\
    \ trimming.\n\n![](image_rsrc7MK.jpg)\n\nWithin `characters`, a double period\
    \ (`..`) can specify a range (e.g. `a..z` is a through z).\n\nExample:\n```php\n\
    $string = \"Hello World42! \\t\\t\";\ntrim($string); // Hello World42!\n```\n\
    ```php\ntrim($string, \" \\t!0..9\"); // Range between 0 and 9\n```\n**See Also:**\n\
    - `ltrim()` – Trim only from the beginning of the string.\n- `trim()` – Trim from\
    \ the beginning and the end.\n\n# crypt( $string [, salt ] )\n\n- `salt` – [optional]\
    \ `$string`\n\nPerforms a one-way hashing using an algorithm specified by the\
    \ system. The salt can be used to generate stronger encryption, but when not specified,\
    \ it will be created once per run of the script.\n\nExample:\n```php\n$password\
    \ = 'mypassword';\ncrypt($password); // Output will vary\n```\n**See Also:**\n\
    - `md5()`\n\n# md5( $string [, raw_flag ] )\n\n- `raw_flag` – [optional] `$boolean`\
    \ default: `FALSE`, 32-character hexadecimal\n\nPerforms a one-way hashing on\
    \ `$string using the MD5 Digest Algorithm. If `raw_flag` is set to `TRUE`, it\
    \ returns a binary format with a length of 16 characters.\n\nExample:\n```php\n\
    $password = 'mypassword';\nmd5($password); // 3481d7beeabb9260a5c8bc85b3e44\n\
    ```\n![](image_rsrc7MK.jpg)\n\nSoftware moving between platforms may have different\
    \ encryptions, and thus will cause problems with compatibility. Best to use `md5()`\
    \ or `sha1()` instead for portability\n\n**See Also:** `sha1()` – Sha1 algorithm\
    \ based encryption■​ ■​ ■\n"
