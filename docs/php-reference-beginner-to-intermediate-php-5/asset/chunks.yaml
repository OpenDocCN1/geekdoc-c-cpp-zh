  trans: "\n\n## 示例\n\n- `SELECT * FROM employees`\n- `SELECT pkey,name,age FROM employees`\n\
    - `SELECT employees.pkey,employees.name,employees.age FROM table`\n- `SELECT name\
    \ FROM employees`\n- `SELECT name,age FROM employees`\n- `SELECT * FROM employees\
    \ WHERE age = 17`\n- `SELECT name FROM employees WHERE name LIKE 'm%'`\n- `SELECT\
    \ name FROM employees WHERE name LIKE BINARY 'm%'`\n- `SELECT name FROM employees\
    \ WHERE name LIKE '%a%'`\n- `SELECT name FROM employees WHERE name LIKE '    \
    \  ' ` // 5 个下划线\n- `SELECT COUNT(*) FROM employees`\n- `SELECT COUNT(*) FROM\
    \ employees WHERE age = 17`\n- `SELECT age,COUNT(age) FROM employees GROUP BY\
    \ age`\n- `SELECT SUM(age) FROM employees`\n- `SELECT MAX(age) FROM employees`\n\
    - `SELECT DISTINCT age FROM employees`\n- `SELECT * FROM employees LIMIT 1,2`\n\
    - `SELECT name FROM employees ORDER BY name`\n- `SELECT name FROM employees ORDER\
    \ BY name DESC`\n\n以下示例未使用包含的表格，仅供参考：\n\n- `INSERT INTO table (column1,column2)\
    \ VALUES ('value1','value2'), ('value1','value2'), ('value1','value2')`\n- `UPDATE\
    \ table SET column1='newvalue' WHERE column2='value'`\n- `DELETE FROM table WHERE\
    \ column='value'`\n- `SELECT * FROM table1 INNER JOIN table2 on table1.id = table2.id`\n\
    - `SELECT table1.* FROM table1 INNER JOIN table2 on table1.id = table2.id`\n-\
    \ `SELECT table1.id FROM table1 INNER JOIN table2 on table1.id = table2.id`\n\
    - `SELECT table.id AS tableid FROM table`\n\n## MySQL 函数\n\n### mysql_connect()\n\
    \n- `server` – [可选] `$string` 默认值：' localhost:3306'` 或 `mysql.default_host`\n\
    - `username` – [可选] `$string` 默认值：由 `mysql.default_user` 定义\n- `password` – [可选]\
    \ `$string` 默认值：由 `mysql.default_password` 定义\n- `new_link` – [可选] `$boolean`\
    \ 默认值：`FALSE`，第二次调用时不建立新链接\n- `client_flag` – [可选] `$integer`\n\n与位于 `server`\
    \ 的 MySQL 服务器建立初始连接/链接，并使用 `username` 和 `password` 提供的权限。失败时返回 `FALSE`，出于安全考虑应结合\
    \ `die()` 使用。大多数情况下，你会使用：`mysql_connect(server , username , password )`。\n\n示例：\n\
    ```php\nmysql_connect('localhost', 'user', 'password') or die('Could not connect\
    \ to the database');\n```\n\n另见：\n- `die()` – 函数失败时停止脚本\n\n### mysql_close()\n\
    \n- `mysql_close([ link_identifier ])`\n- `link_identifier` – [可选] 默认值：最后打开的链接\n\
    \n关闭与 MySQL 服务器的连接，默认关闭由 `mysql_connect()` 打开最后一个连接。如果指定了 `link_identifier`，则关闭该链接。\n\
    \n示例：\n```php\n$link = mysql_connect('localhost', 'username', 'password') or die();\n\
    $link2 = mysql_connect('/path/to', 'username', 'password') or die();\nmysql_close($link);\
    \ // 关闭第一个链接\nmysql_close(); // 关闭最后创建的链接，在此情况下为 $link2\n```\n\n另见：\n- `mysql_connect()`\
    \ – 建立到 MySQL 服务器的连接\n\n### mysql_select_db()\n\n- `mysql_select_db( database\
    \ [, link_identifier ])`\n- `database` – `$string`\n- `link_identifier` – [可选]\
    \ 默认值：最后打开的链接\n\n根据名称 `database` 选择数据库。默认情况下，它使用 `mysql_connect()` 最近的 MySQL 服务器连接，除非指定了\
    \ `link_identifier`，则使用该链接。\n\n示例：\n```php\n$link = mysql_connect('localhost',\
    \ 'username', 'password') or die();\nmysql_select_db('database'); // 或 mysql_select_db('database',$link);\n\
    ```\n\n另见：\n- `mysql_connect()` – 建立到 MySQL 服务器的连接\n\n### mysql_query()\n\n- `query`\
    \ – `$string`\n- `link_identifier` – [可选] 默认值：最后打开的链接\n\n将查询提交到服务器，除非指定了可选的 `link_identifier`，否则使用最近的\
    \ `mysql_connect()` 链接。查询出现任何错误时返回 `FALSE`。`SELECT`、`SHOW`、`DESCRIBE` 和 `EXPLAIN`\
    \ 查询将返回一个资源，需要通过 `mysql_result()` 或 `mysql_fetch_*()` 函数之一进行解析，所有其他查询在成功后将返回 `TRUE`。\n\
    \n示例：\n```php\nmysql_connect('localhost', 'username', 'password') or die();\n\
    mysql_select_db('database');\n$result = mysql_query(\"SELECT * FROM 'table'\"\
    );\n```\n\n另见：\n- `mysql_fetch_array()` – 从创建的资源中以数组获取行\n- `mysql_fetch_assoc()`\
    \ – 返回关联数组：`column=>value`\n- `mysql_fetch_row()` – 返回行的索引数组\n- `mysql_result()`\
    \ - 从创建的资源中获取单个结果\n\n### db_query()\n\n- `database` – `$string`\n- `query` – `$string`\n\
    - `link_identifier` – [可选] 默认值：最后打开的链接\n\n将查询发送到 MySQL 服务器和 `database`。列出的参考，请使用\
    \ `mysql_select_db()` 和 `mysql_query()` 代替。\n\n示例：\n```php\n$result = db_query('database',\
    \ \"SELECT * FROM 'table'\");\n```\n\n另见：\n- `mysql_select_db()` 选择数据库\n\n###\
    \ mysql_error()\n\n- `link_identifier` – [可选] 默认值：最后打开的链接\n\n默认返回上次操作的 MySQL 错误，如果指定了则返回\
    \ `link_identifier`。\n\n示例：\n```php\n$link = mysql_connect('localhost', 'user',\
    \ 'password'); // 有效\nmysql_select_db('No');\necho mysql_error();\n```\n\n###\
    \ mysql_fetch_array()\n\n- `resource` – 包含 `mysql_query()` 输出的变量\n- `result_type`\
    \ – [可选] `$string` 默认值：`MYSQL_BOTH`\n\n值：`MYSQL_BOTH`（包含关联和索引数组）、`MYSQL_ASSOC`（关联数组）、`MYSQL_NUM`（索引数组）\n\
    \n返回由 `mysql_query()` 生成的资源的单行数组，并将资源的内部指针移动到下一行。这通常用于循环提取资源的所有行并获取查询的完整输出。默认提供关联和索引，可以通过\
    \ `result_type` 修改。\n\n示例：\n```php\n$result = mysql_query(\"SELECT * FROM name\"\
    );\n$array = mysql_fetch_array($result);\nprint_r($array);\n\n$array = mysql_fetch_array($result,MYSQL_ASSOC);\n\
    print_r($array);\n```\n\n使用 `MYSQL_NUM` 选项的示例：\n```php\n$result = mysql_query(\"\
    SELECT * FROM name\");\nwhile ($row = mysql_fetch_array($result,MYSQL_NUM) ){\n\
    \    print_r($row);\n}\n```\n\n### mysql_fetch_assoc()\n\n- `resource` – 包含 `mysql_query()`\
    \ 输出的变量\n\n返回由 `mysql_query()` 生成的单行数组，并将资源的内部指针移动到下一行，返回 `column => value` 关联数组。\n\
    \n示例：\n```php\n$result = mysql_query(\"SELECT * FROM name\");\n$array = mysql_fetch_assoc($result);\n\
    print_r($array);\n```\n\n使用 while 循环的示例：\n```php\n$result = mysql_query(\"SELECT\
    \ * FROM name\");\nwhile ($row = mysql_fetch_assoc($result) ){\n    print_r($row);\n\
    }\n```\n\n### mysql_fetch_row()\n\n- `resource` – 包含 `mysql_query()` 输出的变量\n\n\
    返回由 `mysql_query()` 生成的单行数组，并将资源的内部指针移动到下一行，返回仅包含值的索引数组（无列名）。\n\n示例：\n```php\n\
    $result = mysql_query(\"SELECT * FROM name\");\n$array = mysql_fetch_row($result);\n\
    print_r($array);\n```\n\n使用 while 循环的示例：\n```php\n$result = mysql_query(\"SELECT\
    \ * FROM name\");\nwhile ($row = mysql_fetch_row($result) ){\n    print_r($row);\n\
    }\n```\n\n### mysql_result()\n\n- `resource` – 包含 `mysql_query()` 输出的变量\n- `row`\
    \ – `$integer`\n- `column` – [可选] `$string` 或 `$integer` 默认值：0，获取第一列\n\n返回包含来自\
    \ `mysql_query()` 生成的资源特定行的单元单元的字符串。如果指定了 `field`，则获取指定的字段（可以通过从 0 开始的数字或别名引用）。\n\
    \n注意：如果你需要多个一个结果，应该使用 `mysql_fetch_*()`。\n\n示例：\n```php\n$result = mysql_query(\"\
    SELECT * FROM name\");\nvar_dump( mysql_result($result, 0) );\nvar_dump( mysql_result($result,\
    \ 1) );\nvar_dump( mysql_result($result, 1, 'name') );\n```\n\n### mysql_num_rows()\n\
    \n- `resource` – 包含 `mysql_query()` 输出的变量\n\n以整数形式返回 `mysql_query()` 生成的资源的总行数。\n\
    \n示例：\n```php\n$result = mysql_query(\"SELECT * FROM name\");\n$row_total = mysql_num_rows($result);\n\
    var_dump($row_total);\n```\n\n### mysql_free_result()\n\n- `resource` – 包含 `mysql_query()`\
    \ 输出的变量\n\n清除与 `resource` 相关的所有系统内存。只有在单个脚本内处理大型数据集时才是必要的，内存在脚本/页面结束会自动清除。\n\n\
    示例：\n```php\n$result = mysql_query(\"SELECT * FROM name\");\nmysql_free_result($result);\n\
    ```\n\n### mysql_get_server_info()\n\n- `link_identifier` – [可选] 默认值：最后打开的链接\n\
    \n返回包含 MySQL 服务器版本的字符串，默认是 `mysql_connect()` 最后的最后一个连接。如果指定了 `link_identifier`，则使用该链接。\n\
    \n示例：\n```php\n$link = mysql_connect('localhost', 'username', 'password') or die();\n\
    var_dump( mysql_get_server_info() );\n```\n\n### mysql_real_escape_string()\n\n\
    - `link_identifier` – [可选] 默认值：最后打开的链接\n\n返回对 `$string` 进行处理的字符串，添加反斜杠以防止 SQL\
    \ 攻击。默认使用 `mysql_connect()` 的连接。如果指定了 `link_identifier`，则使用该链接。影响以下字符：`\\x00`、`\\\
    n`、`\\r` 和 `''`。注意：与 `addslashes()` 相同。\n\n示例：\n```php\n$string = \"SELECT * FROM\
    \ table'\";\nmysql_connect('localhost', 'username', 'password') or die();\nvar_dump(\
    \ mysql_real_escape_string($string) );\n```\n\n### mysql_data_seek()\n\n- `resource`\
    \ – 包含 `mysql_query()` 输出的变量\n- `row` – `$integer`\n\n将 `mysql_query()` 生成的资源的内部指针移动到\
    \ `row`（从 0 开始）。通过 `mysql_fetch_*()` 获取指定的行。\n\n示例：\n```php\n$result = mysql_query(\"\
    SELECT * FROM name\");\nmysql_data_seek($result, 1); // 选择第 1 行\n```\n\n### mysql_affected_rows()\n\
    \n- `link_identifier` – [可选] 默认值：最后打开的链接\n\n返回受 `INSERT`、`UPDATE` 或 `REPLACE`\
    \ 查询影响的行数。使用指定的 `mysql_connect()` 链接。\n\n示例：\n```php\nmysql_connect('localhost',\
    \ 'username', 'password') or die();\nmysql_select_db('database');\n$result = mysql_query(\"\
    \ INSERT INTO name (pkey,name) VALUES (NULL,'Joe') \");\nvar_dump( mysql_affected_rows()\
    \ );\n```\n\n### mysql_create_db()\n\n- `string` – `$string`\n- `link_identifier`\
    \ – [可选] 默认值：最后打开的链接\n\n在 `mysql_connect()` 使用的 MySQL 服务器上创建一个名为 `$string` 的数据库。如果指定了\
    \ `link_identifier`，则使用该链接。注意：仅参考 `mysql_query()` 和 `\"CREATE DATABASE\"`。\n\n\
    示例：\n```php\nmysql_connect('localhost', 'username', 'password') or die();\nmysql_create_db('database');\n\
    ```\n\n### mysql_drop_db()\n\n- `string` – `$string`\n- `link_identifier` – [可选]\
    \ 默认值：最后打开的链接\n\n在 `mysql_connect()` 使用的 MySQL 服务器上销毁名为 `$string` 的数据库。注意：仅参考\
    \ `mysql_query()` 和 `\"DROP DATABASE\"`。\n\n示例：\n```php\nmysql_connect('localhost',\
    \ 'username', 'password') or die();\nmysql_drop_db('database');\n```\n\n## 目录\
    \ & 文件系统函数\n\n### getcwd()\n\n返回包含当前目录的字符串。\n\n示例：\n```php\nvar_dump( getcwd()\
    \ ); // 结果各异\n```\n\n另见：\n- `chdir()` – 更改目录\n\n### chdir()\n\n- `directory` –\
    \ `$string`\n\n将当前目录更改为 `$string`，成功时返回 `TRUE`。注意：目录更改仅持续脚本/页面。\n\n示例：\n```php\n\
    var_dump( getcwd() ); // 获取当前目录\nchdir('images');\n```\n\n另见：\n- `getcwd()` –\
    \ 获取当前目录\n\n### scandir()\n\n- `directory` – `$string`\n- `sort_flag` – [可选] `$integer`\
    \ 默认值：`0`（升序）其他值为：`1`（降序）\n\n返回包含 `$directory` 内部所有文件的数组。如果 `sort_flag` 为 0 或未指定，数组按字母顺序排序。\n\
    \n示例：\n```php\n$array = scandir('directory'); // 结果各异\n```\n\n### copy()\n\n-\
    \ `source` – `$string`\n- `destination` – `$string`\n\n将名为 `source` 的文件复制到 `destination`，如果\
    \ `destination` 已存在则覆盖它。原始源保持不变。\n\n示例：\n```php\ncopy('file.txt', 'file.txt.bak');\n\
    ```\n\n### rename()\n\n- `oldname` – `$string`\n- `newname` – `$string`\n\n将名为\
    \ `oldname` 的文件或目录重命名为 `newname`。\n\n示例：\n```php\nrename('file.txt', 'file.tmp');\n\
    ```\n\n### mkdir()\n\n- `path` – `$string`\n- `ix_mode` – [可选] `$integer` 默认值：`0777`（八进制），所有人可读写\n\
    - `recursive_flag` – [可选] `$boolean` 默认值：`FALSE`，一次创建一个目录\n\n在 `path` 处创建一个目录。如果在\
    \ Unix/Linux 服务器上，你可以将默认模式从 0777 更改为八进制形式的其他权限（前导零）。每次只能创建一个层级的目录，除非 `recursive_flag`\
    \ 设置为 `TRUE`。\n\n示例：\n```php\nmkdir('tmp');\nmkdir('tmp/2/tmp', 0775, TRUE);\n\
    ```\n\n另见：\n- `chmod()` – 修改文件模式（权限）\n\n### rmdir()\n\n- `path` – `$string`\n\n\
    移除名为 `path` 的目录。\n\n示例：\n```php\nrmdir('/temp/tmp');\n```\n\n### unlink()\n\n\
    - `filename` – `$string`\n\n删除名为 `filename` 的文件。\n\n示例：\n```php\nunlink('file.txt');\n\
    ```\n\n### fopen()\n\n- `filename` – `$string`\n- `mode` – `$string`\n- `use_include_path`\
    \ – [可选] `$boolean` 默认值：`FALSE`\n\n使用以下模式打开 `filename`：\n- `r`（只读，文件指针在开头）\n-\
    \ `r+`（读写，文件指针在开头）\n- `w`（只写，文件指针在开头，零长度文件，不存在则创建）\n- `w+`（读写，文件指针在开头，零长度文件，不存在则创建）\n\
    - `a`（只写，文件指针在末尾，零长度文件）\n- `a+`（读写，文件指针在末尾，零长度文件）\n- `x`（只写，文件指针在开头，如果存在则返回 `FALSE`）\n\
    - `x+`（读写，文件指针在开头，如果存在则返回 `FALSE`）\n\n如果 `use_include_path` 设置为 `TRUE`，系统也会在 PHP\
    \ 定义的 `include_path` 中检查该文件。返回一个供其他使用的资源。\n\n示例：\n```php\n$file = fopen('file.txt',\
    \ 'r');\n```\n\n另见：\n- `fclose()` – 关闭由 `fopen()` 打开的资源\n\n### fclose()\n\n- `resource`\
    \ – 包含 `fopen()` 创建的文件指针的变量\n\n关闭用 `fopen()` 打开的文件。\n\n示例：\n```php\n$file = fopen('file.txt',\
    \ 'r');\nfclose($file);\n```\n\n另见：\n- `fopen()` – 打开文件进行读取、写入或两者两者\n\n### fread()\n\
    \n- `resource` – 包含 `fopen()` 创建的文件指针的变量\n- `length` – `$integer`\n\n返回包含 `fopen()`\
    \ 创建的资源内容的字符串，字节长度为 `length`。\n\n示例：\n```php\n// file.txt 包含句子 Hello World!!\n\
    $file = fopen('file.txt', 'r');\nvar_dump( fread($file, 8) );\n```\n\n另见：\n- `fwrite()`\
    \ – 写入打开的文件\n\n"
- fmt: "\nTo read the entire file into a string, use the function `filesize()`.\n\n\
    ```php\n// file.txt contains the sentence: Hello World!\n$filename = 'file.txt';\n\
    $file = fopen($filename, 'r');\n$string = fread( $file, filesize($filename) );\n\
    var_dump($string);\n```\n\n`string(13) \"Hello World!\"`\n\n### fwrite( resource\
    \ , $string [, length ]) \nAlso known as `fputs()`.\n\n- `resource` – Variable\
    \ name containing the file pointer created by `fopen()`.\n- `length` – [optional]\
    \ `$integer` default: `filesize($string)`\n\nWrites the contents of `$string`\
    \ to the file `resource` created by `fopen()`. If `length` is specified, writing\
    \ will stop once `length` bytes or the end of `$string` has been reached.\n\n\
    **Example:**\n```php\n$file = fopen('file.txt', 'a'); // appending on to the end\n\
    fwrite($file, 'Hello World!');\n```\n`string(8) \"Hello Wo\"`\n\n**See Also:**\n\
    - `fwrite()` – Writes to the opened file\n- `fopen()` – Opens a file for reading,\
    \ writing, or both\n\n### To read the entire file into a string, use the function\
    \ `filesize()`.\n\n```php\n// file.txt contains the sentence: Hello World!\n$filename\
    \ = 'file.txt';\n$file = fopen($filename, 'r');\n$string = fread( $file, filesize($filename)\
    \ );\nvar_dump($string);\n// file.txt now contains at the end: Hello World!\n\
    ```\n"
