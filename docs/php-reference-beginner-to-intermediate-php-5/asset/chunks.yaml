  trans: "\n\n![](img/image_rsrc7NC.jpg)停止当前脚本并输出可选的 `$string`。\n\n示例：\n```php\n$result\
    \ = @mysql_connect('db', 'user', 'pw') or die('Unable to connect to database!');\
    \ \necho 'If it fails, this will never be seen';\n```\n![](img/image_rsrc7ND.jpg)\n\
    注意：上述输出仅在失败时才会显示。如果 `mysql_connect()` 之前没有 `@` 符号，PHP 也会输出一个警告。\n\n![](img/image_rsrc7NE.jpg)\n\
    \n### eval($string)\n将字符串作为代码进行评估。这可以用于将代码存储在数据库中并让 PHP 动态处理，就像它是页面的一部分。必须包含代码的所有适当方面，例如使用反斜杠（`\\\
    `）转义项目，并在字符串末尾包含分号（`;`）。\n\n示例：\n```php\n$name = 'Mario';\n$string = 'My name\
    \ is $name.'; // 注意单引号\necho $string;\n$code = \"\\$evalstring = \\\" $string\
    \ \\\" ;\";// 反斜杠转义的影响：\n$code = \"$evalstring = \" $string \"\";\neval($code);\
    \ // eval($evalstring = \" My name is $name \" ;);\n```\n![](img/image_rsrc7NF.jpg)\
    \ // $evalstring 与 $string 相同，只是现在使用了双引号\necho $evalstring;\n\n![](img/image_rsrc7NG.jpg)\n\
    \n### sleep($integer)\n暂停 PHP `$integer` 秒后继续执行。\n\n示例：\n```php\nsleep(2); //\
    \ 暂停 2 秒\n```\n![](img/image_rsrc7NH.jpg)\n\n### usleep($integer)\n暂停 PHP `$integer`\
    \ 微秒后继续执行。\n\n示例：\n```php\nusleep(1000000); // 暂停 1 秒\n```\n![](img/image_rsrc7NJ.jpg)\n\
    \n### uniqid($prefix)\nentropy – [可选] `$boolean` 默认：FALSE，输出 13 个字符\n根据 `$scalar`\
    \ 生成一个唯一 ID。如果没有输入，则自动使用当前的微秒级时间。这最好与其他函数结合使用，以生成更独特的值。如果 `$scalar` 为空字符串（''`）且\
    \ `entropy` 设置为 TRUE，则提供 26 个字符的输出而非 13 个字符。\n\n示例：\n![](img/image_rsrc7NK.jpg)\n\
    ```php\n$id = uniqid(); echo $id;\n$random_id = uniqid(mt_rand()); echo $random_id;\n\
    ```\n![](img/image_rsrc7NM.jpg)\n\n### md5($string)\n![](img/image_rsrc7NN.jpg)\n\
    ```php\n$md5 = md5($random_id); echo $md5;\n```\n另请：`md5()` – 基于 MD5 算法的加密\n\n\
    ![](img/image_rsrc7NP.jpg)\n\n### setcookie($name, $value, $expire, $path, $domain,\
    \ $secure, $httponly)\nname – `$string`\nvalue – [可选] `$string`\ntime – [可选] `$integer`\
    \ 默认：直到会话结束\npath – [可选] `$string` 默认：当前目录\ndomain – [可选] `$string` 默认：当前域名（例如\
    \ http://www.example.com）\nsecure – [可选] `$boolean` 默认：FALSE，不需要安全连接\n```php\n\
    httponly – [可选] `$boolean` 默认：FALSE，脚本语言可用\n\n设置一个 cookie，在下一次页面加载时对服务器可见。要发送默认值，对于你想跳过的每个参数（时间参数除外），请使用一对单引号（`''''`），而时间参数应使用\
    \ 0 来发送默认值。在大多数情况下，提供名称、值、时间和域名将涵盖大部分用途（path 使用 `''`）。\n\n示例：\n```php\nsetcookie('Cookie','Set\
    \ till end of this session',0);\n// 这在页面重载后将正常显示\nprint_r($_COOKIE);\nArray (\
    \ [Cookie] => Set till end of this session )\n```\n![](img/image_rsrc7NR.jpg)\n\
    ```php\nsetcookie('Cookie','Set for 60 seconds for all subdomains of example.com,\
    \ such as www., mail., etc.',time()+60,'','.example.com');\nprint_r($_COOKIE);\n\
    ```\n常用的过期时间：\n- `time()+60*60*24` 等于 1 天\n- `time()+60*60*24*30` 等于 30 天\n- `time()-1`\
    \ 是过去的一秒，用于使 cookie 过期/删除\n\n```php\nsetcookie('Cookie','',time()-1); // 过期名为\
    \ 'Cookie' 的 cookie。注意值为空字符串\n```\n\n### urlencode($string)\n将 `$string` 的格式更改为适用于通过\
    \ URL 传递的格式（例如 GET 查询的一部分），并返回新字符串。\n\n示例：\n```php\n$string = 'Hello There! How\
    \ are you?';\necho urlencode($string);\nHello+There%21+How+are+you%3F\n```\n\n\
    ### urldecode($string)\n将 `$string` 的格式从 URL 兼容格式（例如 GET 查询）更改为人类可读格式，返回新字符串。\n\
    \n示例：\n```php\n$string = 'Hello+There%21+How+are+you%3F';\necho urldecode($string);\n\
    Hello There! How are you?!\n```\n![](img/image_rsrc7MK.jpg)\n\n### 2\n必须在发送任何头部或其他内容（包括\
    \ `<html>` 标签）之前发送。查看 `ob_start()` 了解实现此点的简单方法。\n\n![](img/image_rsrc7NS.jpg)\n\
    \n### get_magic_quotes_gpc()\n如果关闭则返回 0，否则返回 1。\n用于判断魔引号是否开启。此检查用于代码移植性以及防止 SQL\
    \ 注入。如果开启，魔引号会自动处理上述数据。\n\n示例：\n```php\nif (get_magic_quotes_gpc()){\n    echo\
    \ 'Magic Quotes is on!';\n}else{\n    echo 'Magic Quotes is NOT on, use addslashes!';\n\
    }\n```\n![](img/image_rsrc7NT.jpg)\n另请：\n- `addslashes()` 为字符串中的特殊字符添加反斜杠\n- `stripslashes()`\
    \ 从字符串中的特殊字符移除反斜杠\n\n![](img/image_rsrc7NU.jpg)\n\n### phpinfo($option)\noption\
    \ – [可选] 使用特定的 `$integer` 或 `$string` 显示 `phpinfo()` 的部分。为了简单排除了特定选项。\n默认情况下，`phpinfo()`\
    \ 显示有关 PHP 安装的所有信息，包括模块、版本、变量等。\n\n示例：\n```php\nphpinfo();\n```\n![](img/image_rsrc7NV.jpg)\n\
    \n### error_reporting 和 ini_set\n为了捕获编程错误、缺陷或确保 PHP 不对你的代码做任何假设，最好的故障排除是显示所有 PHP\
    \ 错误。以下两行代码将启用此模式：\n```php\nerror_reporting(E_ALL);\nini_set('display_errors',\
    \ '1');\n```\n![](img/image_rsrc7NW.jpg)\n\n"
- fmt: "\n## Functions and References\n\nUse this for functions when you wish to simply\
    \ alter the original variable and return it again to the same variable name with\
    \ its new value assigned.\n\n```php\nfunction add(&$var){ \n    // The & is before\
    \ the argument $var\n    $var++;\n}\n$a = 1;\n$b = 10; \nadd($a);\necho \"a is\
    \ $a,\";\nadd($b);\necho \" a is $a, and b is $b\"; // Note: $a and $b are NOT\
    \ referenced\n```\n**Output:** `a is 2, a is 2, and b is 11`\n\nYou can also do\
    \ this to alter an array with `foreach`:\n```php\n$array = array(1,2,3,4); \n\
    foreach ($array as &$value){\n    $value = $value + 10;\n}\nunset ($value); //\
    \ Must be included, $value remains after foreach loop\nprint_r($array);\n```\n\
    **Output:** `Array ( [0] => 11 [1] => 12 [2] => 13 [3] => 14 )`\n\n## Ternary\
    \ Operator\n\nThe Ternary Operator is a short-hand form for evaluating what to\
    \ do when an expression is evaluated as either TRUE or FALSE. The conditional\
    \ returns either the TRUE or FALSE output.\n\nBasic format is as follows:\n`(\
    \ expr ) ? ValueIfTrue : ValueIfFalse ;`\n\n**Examples:**\n```php\n$boolean =\
    \ TRUE;\n$result = ($boolean) ? 'Is True' : 'Is False'; \necho $result; // $result\
    \ is not yet set\n\n$result = (isset($result)) ? $result+1 : 10; \necho \" \\\
    $result = $result.\";\n\n$result = (isset($result)) ? $result+1 : 10; \necho \"\
    \ \\$result = $result.\";\n```\n\n## Operators\n\n- **Assignment (`=` )**: Assigns\
    \ the value on the right to the variable on the left.\n- **Equality (`==` )**:\
    \ Checks if the left and right values are equal.\n- **Identical (`===` )**: Checks\
    \ if the left and right values are equal AND identical.\n\n**Example:**\n```php\n\
    $a = 1; // Sets the value of $a as 1 by assignment\n$b = TRUE; // Sets the value\
    \ of $b to the boolean TRUE\nif ($a == $b){\n    echo 'a is equal to b.';\n}\n\
    if ($a === $b){\n    echo 'a is identical and equal to b.';\n}\n```\n\n## Logical\
    \ Operators\n\nUsed in conditional statements to evaluate as true a FALSE result\
    \ of an expression or if a value is NOT equal to the second value.\n\n**Example:**\n\
    ```php\n$a = 1;\nif (!isset($a)){ \n    // If the variable $a is NOT set then...\n\
    \    echo '$a is not set'; // The expression is TRUE if it is NOT set\n    //\
    \ Since there is no ELSE statement, nothing is displayed\n}\nif ($a != 0){\n \
    \   echo '$a does not equal zero';\n}\n```\n*See The Equal Sign above for equality\
    \ versus identical.*\n\n## Concatenation\n\nA period (.) is used to join dissimilar\
    \ items as part of a string in the same order as they are listed. In many cases\
    \ this is used to reference the value of a function or of an array, which cannot\
    \ be referenced within double quotations (`\"\"`) when being assigned to a `$string`\
    \ variable.\n\n**Example:**\n```php\n$array = array( 1 => 'Hello' );\n$string\
    \ = 'World';\necho '$string in single quotes, followed by ' . $array[1] . \"$string\"\
    ;\n```\n\n## Logical Comparison\n\n- **and (`&&` )**\n- **or (`||` )**\n- **xor\
    \ (`xor`)** - Or, but not All.\n\n**Examples:**\n```php\nif (1 == 1 && 2 == 2){\n\
    \    echo 'And is True';\n}\nif (1 == 1 || 2 == 2){\n    echo 'At least one of\
    \ these is True';\n}\nif (1 == 1 xor 2 == 10){\n    echo 'One of these is True,\
    \ but not both';\n}\n```\n\n## Control Structures\n\nThe heart of PHP is the control\
    \ structures. Variables and arrays are lonely without them as they facilitate\
    \ comparisons, loops, and large hands telling you to go that way and do it this\
    \ way.\n\n### If, ElseIf, Elseif\n\n```php\nif ( expr ) {\n    // If expr is TRUE,\
    \ do this, then exit the IF loop\n}\nelseif ( expr2 ) {\n    // If expr is FALSE,\
    \ and expr2 is TRUE, do this, then exit the loop\n}\nelse {\n    // If all expr's\
    \ are FALSE, do this, then exit\n}\n```\nThere can be only one instance of `else`\
    \ in an `if` statement, but multiple `elseif` expressions are allowed prior to\
    \ the `else` statement.\n\n**Example:**\n```php\n$x = 1;\nif ($x < 1){\n    echo\
    \ '$x is less than 1';\n}elseif ($x == 1){ \n    // Note the double equals, for\
    \ comparison\n    echo '$x is equal to 1';\n}else{\n    echo '$x is neither equal\
    \ to 1 or less than 1';\n}\n```\n**Output:** `x is equal to 1`\n\n**See Also:**\n\
    - `switch` – A simpler, more organized usage than multiple `if/else` combinations.\n\
    - `break` – Stops a loop and exits regardless of if the statement evaluates as\
    \ true.\n\n### Alternative syntax for an if statement\n```php\nif ( expr ) {\n\
    \    // If expr is TRUE, do this, then exit the IF loop\n} elseif ( expr2 ) {\n\
    \    // If expr is FALSE, and expr2 is TRUE, do this, then exit the loop\n} else\
    \ {\n    // If all expr's are FALSE, do this, then exit\n} endif;\n```\n\n###\
    \ Switch\n\n```php\nswitch ( expr ) { \n    case value :\n        // Do this if\
    \ value matches\n        break;\n    case value2 :\n        // Do this if value2\
    \ matches\n        break;\n}\n```\n`switch` is used in conditional statements\
    \ to evaluate as true a FALSE result of an expression or if a value is NOT equal\
    \ to the second value. (Note: The source text seems to have mixed descriptions\
    \ here, I have preserved the structure).\n\n**Example:**\n```php\n$x = 1;\nif\
    \ ($x < 1){\n    echo '$x is less than 1';\n}elseif ($x == 1){ \n    // Note the\
    \ double equals, for comparison \n    echo '$x is equal to 1';\n}else{\n    echo\
    \ '$x is neither equal to 1 or less than 1';\n}\n```\n\n### While\n\n```php\n\
    while ( expr ) {\n    // If expr is TRUE, do this, then evaluate again\n}\n```\n\
    The `while` loop checks the expr and if it evaluates as true, the script runs\
    \ through the contents of the while until it finishes.\n\n**Example:**\n```php\n\
    $x = 1;\nwhile ($x <= 3){\n    echo \"$x, \";\n    $x++;\n}\n```\n**Output:**\
    \ `1, 2, 3,`\n\n### Do-While\n\n```php\ndo {\n    // Do this\n} while ( expr );\n\
    ```\nThe `do-while` loop performs whatever is inside the `do` statement, checks\
    \ the expr, then if it evaluates as true, runs through the contents of the do\
    \ until it finishes, evaluating the expr again, and repeating until the expr evaluates\
    \ as false.\n\n**Example:**\n```php\n$x = 1; \ndo {\n    echo \"$x, \";\n    $x++;\
    \ // Makes $x = 2, therefore the while will evaluate as false\n} while ($x <=\
    \ 1);\n```\n**Output:** `1, `\n\n### For\n\n```php\nfor ( expr1 ; expr2 ; expr3\
    \ ) {\n    // If expr2 is TRUE, do this\n}\n```\nWhen started, the `for` loop\
    \ executes `expr1` once at the beginning. Next, `expr2` is evaluated. If `expr2`\
    \ is true, the code inside the `for` loop is executed. When the `for` loop reaches\
    \ the end, `expr3` is executed before looping and checking `expr2` again.\n\n\
    **Example:**\n```php\nfor ($x = 1; $x <= 5; $x++){ \n    echo $x;\n}\n```\n**Output:**\
    \ `12345`\n"
