- fmt: "\n## Common Octal Modes\n\n| Mode | Description |\n| :--- | :--- |\n| `0777`\
    \ | Read, write, execute for everyone |\n| `0755` | Read/write/execute for owner,\
    \ read/execute for others |\n| `0644` | Read/write for owner, read for everyone\
    \ else |\n| `0600` | Read/write for owner, no access for anyone else |\n| `0754`\
    \ | Read/write/execute for owner, read/execute group, read others |\n\n## Output\
    \ Control (Output Buffer)\n\nImagine all of your code, your output, stuffed into\
    \ a big bag then dumped all at once on the counter, or if you prefer, thrown in\
    \ the trash instead. The code still ran, just the output changed. That is output\
    \ buffering in a nutshell. Furthermore, it also makes things easier, especially\
    \ when dealing with headers and cookies, all requiring a specific order of output\
    \ to the user. ![](image_rsrc82X.jpg)\n\nTries to push all output to the user/browser\
    \ immediately rather than waiting till the script has completed.\n\n**Note:**\
    \ If you are within an output buffer `ob_start()`, you need to also call `ob_flush()`.\n\
    \n### Examples\n\n```php\nfor($x=0;$x<=1000;$x++){ // Loop through 1001 times\n\
    \    echo $x;\n    flush(); // Sends each echo $x to the browser\n    // If flush()\
    \ was not present, it would output the entire chain\n    // of numbers to the\
    \ browser at once when the script/loop was done\n}\n```![](image_rsrc82Y.jpg)\n\
    \n```php\nob_start(); // Start an output buffer\nfor($x=0;$x<=1000;$x++){ // Loop\
    \ through 1001 times\n    echo $x;\n    flush(); // Sends the output to the output\
    \ buffer\n}\nob_flush(); // Sends the output buffer to the browser and clears\
    \ it\n// If ob_flush() was not present, it would output the entire chain\n// of\
    \ numbers to the browser at once when the script/loop was done\n```![](image_rsrc82Z.jpg)\n\
    \n**See Also:** `ob_flush()` – Flushes the output from the output buffer.\n\n\
    ## The use of `flush()`\n\nThe use of `flush()` is used to give some feedback\
    \ to the user running the script if it takes a while to run, otherwise they may\
    \ be left with a blank page. For instance, when importing a lot of data to the\
    \ database line-by-line from a file, you could provide a period (`.`) to the screen\
    \ when each line is complete, and a line break every 70 periods or so, giving\
    \ the user feedback that it is working. While this may be slower, it would be\
    \ worse if they stopped the script thinking something was wrong.\n\nAs a comparison,\
    \ a simple script is shown here and the varying time trials for each method used\
    \ as a comparison.\n\n```php/*All of the below methods use the following code\
    \ around it to generate the time to complete. The output shown is only the time\
    \ to complete, not the long string of numbers that would be echoed as well.*/\n\
    $time = microtime(1); // At the start\n// Examples go here\n$time = number_format(microtime(1)-$time,\
    \ 6); echo \"$time seconds to complete\"; // At the end\n```\n\n### Time Trials\
    \ Comparison\n\n| Method | Result |\n| :--- | :--- |\n| `for($x=0;$x<=100000;$x++){\
    \ echo $x;}` | `0.468251 seconds to complete` |\n| `for($x=0;$x<=100000;$x++){\
    \ echo $x;flush();}` | `3.616512 seconds to complete` |\n| `ob_start(); for($x=0;$x<=100000;$x++){echo\
    \ $x;}` | `0.182167 seconds to complete` |\n| `ob_start(); for($x=0;$x<=100000;$x++){echo\
    \ $x; flush();// Won't output to the user until script completes w/o ob_flush()}`\
    \ | `0.762600 seconds to complete` |\n| `ob_start(); for($x=0;$x<=100000;$x++){echo\
    \ $x; flush(); ob_flush();}` | `4.443787 seconds to complete` |\n\n![](image_rsrc830.jpg)\n\
    \n## Buffer Functions\n\n### `use_include_path` – [optional] `$boolean` default:\
    \ `FALSE`\nReads the contents of the file with name/path `$string` and writes\
    \ it to the output, similar to reading the contents into a string and then echoing\
    \ the string. If `use_include_path` is set to `TRUE`, the file is searched for\
    \ within the PHP `include_path`.\n\n**Example:** ![](image_rsrc831.jpg)\n```php\n\
    // file.txt contains: Hello World\nreadfile('file.txt');\n```![](image_rsrc832.jpg)\n\
    \n### `callback_function` – [optional] `$string` (function name)\n### `flush_size`\
    \ – [optional] `$integer` default: `0` (flush at the end)\nOther preset values:\
    \ `1` (set the size to 4096)\n### `erase` – [optional] `$boolean` default: `TRUE`,\
    \ buffer cleared at `flush_size`\nStarts an output buffer, storing all output\
    \ before sending it to the user/browser at once at the end of the script, or when\
    \ specified by other `ob_*()` functions. The end of the script closes the buffer.\n\
    \nIf a `callback_function` is specified, the output stored in the buffer is sent\
    \ as a string to the function with the name `callback_function` when the script\
    \ is completed or `ob_end_flush()` is called. The function should return a string\
    \ so it can be output to the user/browser.\n\nIf `flush_size` is set, the buffer\
    \ will be flushed (same as `ob_flush()`) when a section of output causes the buffer\
    \ to exceed the `flush_size` length. If `erase` is set to `FALSE`, the buffer\
    \ is not deleted until the script finishes.\n\n**Note:** Returns `FALSE` if the\
    \ function specified in `callback_function` fails.\n\n**Examples:**\n\n```php\n\
    ob_start();\n```![](image_rsrc833.jpg) // Some code generating output here\n```php\n\
    function ChangeName($buffer){\n    // Replace all instances of 'username' with\
    \ 'Bob' in the buffer\n    $buffer = str_replace('username', 'Bob', $buffer);\n\
    \    return $buffer; // Return for output the new buffer\n}\n```\n```php\nob_start('ChangeName');\n\
    echo 'My name is username';\n```![](image_rsrc834.jpg)\n```php\nfunction ChangeName($buffer){\n\
    \    $buffer = $buffer . '||'; // Add || to the end of the buffer\n    return\
    \ $buffer;\n}\nob_start('ChangeName',10);\necho 'My name is Mario';\necho 'My\
    \ name is Mario';\n```\nMy name is Mario||My name is Mario\n\nThere is a predefined\
    \ function called `ob_gzhandler` that will compress the buffer prior to sending\
    \ the output to the user/browser. To call it, use:\n```php\nob_start('ob_gzhandler');\n\
    ```\n\nThe output buffer reorganizes the output of `header()` and `setcookie()`\
    \ automatically to the top of the page so there are no Apache errors. This makes\
    \ it easy to include a redirect in `header()` somewhere in your script if something\
    \ fails, even if you have output data already to the page earlier in the script.\
    \ The redirect and header information is placed first and the user never sees\
    \ the data.\n\n```php\nob_start();\necho 'You will never see this';\nif ($baduser){\
    \ // If $baduser is TRUE\n    header('Location: http://www.someotherplace.com');\n\
    }\nob_end_flush; // Ends the buffer and sends the output to the user\n```\n"
