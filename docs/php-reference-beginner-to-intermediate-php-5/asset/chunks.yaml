  trans: "\n\n## 函数与引用\n\n当你只想简单修改原始变量并将其带有新值返回给同一个变量名时，请使用此项。\n\n```php\nfunction\
    \ add(&$var){ \n    // & 位于参数 $var 之前\n    $var++;\n}\n$a = 1;\n$b = 10; \nadd($a);\n\
    echo \"a is $a,\";\nadd($b);\necho \" a is $a, and b is $b\"; // 注意：$a 和 $b 没有被引用\n\
    ```\n**输出：** `a is 2, a is 2, and b is 11`\n\n你也可以通过 `foreach` 来修改数组：\n```php\n\
    $array = array(1,2,3,4); \nforeach ($array as &$value){\n    $value = $value +\
    \ 10;\n}\nunset ($value); // 必须包含，$value 在 foreach 循环后仍然存在\nprint_r($array);\n\
    ```\n**输出：** `Array ( [0] => 11 [1] => 12 [2] => 13 [3] => 14 )`\n\n## 三元运算符\n\
    \n三元运算符是用于在表达式被评估为 TRUE 或 FALSE 时决定执行什么操作的简写形式。条件返回 TRUE 输出或 FALSE 输出。\n\n基本格式如下：\n\
    `( expr ) ? ValueIfTrue : ValueIfFalse ;`\n\n**示例：**\n```php\n$boolean = TRUE;\n\
    $result = ($boolean) ? 'Is True' : 'Is False'; \necho $result; // $result 尚未设置\n\
    \n$result = (isset($result)) ? $result+1 : 10; \necho \" \\$result = $result.\"\
    ;\n\n$result = (isset($result)) ? $result+1 : 10; \necho \" \\$result = $result.\"\
    ;\n```\n\n## 运算符\n\n- **赋值 (`=` )**：将右侧的值赋给左侧的变量。\n- **相等 (`==` )**：检查左右侧的值是否相等。\n\
    - **全等 (`===` )**：检查左右侧的值是否相等且类型完全相同。\n\n**示例：**\n```php\n$a = 1; // 通过赋值将 $a\
    \ 的值设置为 1\n$b = TRUE; // 将 $b 的值设置为布尔 TRUE\nif ($a == $b){\n    echo 'a is equal\
    \ to b.';\n}\nif ($a === $b){\n    echo 'a is identical and equal to b.';\n}\n\
    ```\n\n## 逻辑运算符\n\n用于条件语句，将表达式的 FALSE 结果评估为真，或者当一个值不等于第二个值时。\n\n**示例：**\n```php\n\
    $a = 1;\nif (!isset($a)){ \n    // 如果变量 $a 未被设置，则...\n    echo '$a is not set';\
    \ // 如果未设置，则表达式为 TRUE\n    // 因为没有 ELSE 语句，所以什么都不显示\n}\nif ($a != 0){\n    echo\
    \ '$a does not equal zero';\n}\n```\n*参见上方的“等号”部分了解“相等”与“全等”的区别。*\n\n## 字符串拼接\n\
    \n句号 (.) 用于按照列出的顺序将不同类型的项目组合成字符串的一部分。在许多情况下，这被用于引用函数或数组的值，这些值在赋值给 `$string` 变量时，不能在双引号\
    \ (`\"\"`) 内直接引用。\n\n**示例：**\n```php\n$array = array( 1 => 'Hello' );\n$string\
    \ = 'World';\necho '$string in single quotes, followed by ' . $array[1] . \"$string\"\
    ;\n```\n\n## 逻辑比较\n\n- **与 (`&&` )**\n- **或 (`||` )**\n- **异或 (`xor`)** - 或，但不同全真。\n\
    \n**示例：**\n```php\nif (1 == 1 && 2 == 2){\n    echo 'And is True';\n}\nif (1 ==\
    \ 1 || 2 == 2){\n    echo 'At least one of these is True';\n}\nif (1 == 1 xor\
    \ 2 == 10){\n    echo 'One of these is True, but not both';\n}\n```\n\n## 控制结构\n\
    \nPHP 的核心是控制结构。没有了它们，变量和数组就是孤立的，因为它们促进了比较、循环以及告诉你该往哪里走、如何做的逻辑指令。\n\n### If, ElseIf,\
    \ Else\n\n```php\nif ( expr ) {\n    // 如果 expr 为 TRUE，执行此操作，然后退出 IF 循环\n}\nelseif\
    \ ( expr2 ) {\n    // 如果 expr 为 FALSE 且 expr2 为 TRUE，执行此操作，然后退出循环\n}\nelse {\n\
    \    // 如果所有 expr 都为 FALSE，执行此操作并退出\n}\n```\n`if` 语句中只能有一个 `else`，但在 `else` 语句之前允许有多个\
    \ `elseif` 表达式。\n\n**示例：**\n```php\n$x = 1;\nif ($x < 1){\n    echo '$x is less\
    \ than 1';\n}elseif ($x == 1){ \n    // 注意双等号，用于比较\n    echo '$x is equal to 1';\n\
    }else{\n    echo '$x is neither equal to 1 or less than 1';\n}\n```\n**输出：** `x\
    \ is equal to 1`\n\n**另见：**\n- `switch` – 比多个 `if/else` 组合更简单、更有组织的用法。\n- `break`\
    \ – 停止循环并退出，无论语句评估结果是否为真。\n\n### if 语句的替代语法\n```php\nif ( expr ) {\n    // 如果\
    \ expr 为 TRUE，执行此操作，然后退出 IF 循环\n} elseif ( expr2 ) {\n    // 如果 expr 为 FALSE 且\
    \ expr2 为 TRUE，执行此操作，然后退出循环\n} else {\n    // 如果所有 expr 都为 FALSE，执行此操作并退出\n} endif;\n\
    ```\n\n### Switch\n\n```php\nswitch ( expr ) { \n    case value :\n        //\
    \ 如果 value 匹配则执行此操作\n        break;\n    case value2 :\n        // 如果 value2 匹配则执行此操作\n\
    \        break;\n}\n```\n`switch` 用于条件语句，将表达式的 FALSE 结果评估为真，或者当一个值不等于第二个值时。（注：原文此处描述似乎混合了，我保留了其结构）。\n\
    \n**示例：**\n```php\n$x = 1;\nif ($x < 1){\n    echo '$x is less than 1';\n}elseif\
    \ ($x == 1){ \n    // 注意双等号，用于比较\n    echo '$x is equal to 1';\n}else{\n    echo\
    \ '$x is neither equal to 1 or less than 1';\n}\n```\n\n### While\n\n```php\n\
    while ( expr ) {\n    // 如果 expr 为 TRUE，执行此操作，再次评估\n}\n```\n`while` 循环检查 expr，如果评估为真，则运行\
    \ while 内部的内容直到结束。\n\n**示例：**\n```php\n$x = 1;\nwhile ($x <= 3){\n    echo \"\
    $x, \";\n    $x++;\n}\n```\n**输出：** `1, 2, 3,`\n\n### Do-While\n\n```php\ndo {\n\
    \    // 执行此操作\n} while ( expr );\n```\n`do-while` 循环执行 `do` 语句中的内容，检查 expr，如果评估为真，则运行\
    \ do 内容直到结束，再次评估 expr，重复直到 expr 为假。\n\n**示例：**\n```php\n$x = 1; \ndo {\n    echo\
    \ \"$x, \";\n    $x++; // 使 $x = 2，因此 while 将评估为假\n} while ($x <= 1);\n```\n**输出：**\
    \ `1, `\n\n### For\n\n```php\nfor ( expr1 ; expr2 ; expr3 ) {\n    // 如果 expr2\
    \ 为 TRUE，执行此操作\n}\n```\n启动时，`for` 循环在开始执行一次 `expr1`。接下来评估 `expr2`。如果 expr2 为真，则执行\
    \ `for` 循环内部的代码。当 `for` 循环结束时，会在再次检查 expr2 之前执行 `expr3`。\n\n**示例：**\n```php\n\
    for ($x = 1; $x <= 5; $x++){ \n    echo $x;\n}\n```\n**输出：** `12345`\n\n"
- fmt: "\n## For Loop\n\nAlternative syntax for a `for` statement:\n```\nfor ( expr1\
    \ ; expr2 ; expr3 ) // If expr2 is TRUE, do this endfor;\n```\n\nAn example of\
    \ `continue` and `break` in a `for` loop:\n```php\nfor ($v=0;$v<=10;$v++){ \n\
    \    echo $v;\n    if ($v == 5){ \n        continue;\n    }\n    if ($v == 8){\
    \ \n        break;\n    }\n    echo ',';\n}\n```\n`0,1,2,3,4,56,7,8`\n\n## Foreach\
    \ Loop\n\nThe `foreach` loop goes through all items in an array, assigning a temporary\
    \ variable name for value and, if chosen, the key as well so they can be used\
    \ within the executed code inside the loop.\n\n**Syntax:**\n```php\nforeach($array\
    \ as $value ){// Do something}\n// Another form, for keys and values\nforeach\
    \ ($array as $key => $value ){// Do something}\n```\n\n**Examples:**\n```php\n\
    $array = array('John' => 20, 'Jane' => 24, 'Joseph' => 28);\nforeach ($array as\
    \ $value){\n    echo \"$value, \"; \n}\nforeach ($array as $name => $age){ \n\
    \    echo \"$name - $age\";\n    echo '<br />'; // XHTML for a line break \n}\n\
    ```\n\n**See Also:**\n- Pass by Reference – Using the ampersand (`&`) to alter\
    \ an array through `foreach`\n\n## Break Statement\n\n`$integer` – [optional]\
    \ Specifies the number of nested loops to break out of. Exits and stops execution\
    \ of the current (default) `for`, `foreach`, `while`, `do-while`, or `switch`\
    \ loop.\n\n**Example:**\n```php\n$counter = 0;\nwhile (1 == 1){ // Will run forever\n\
    \    while (0 == 0){ // Will also run forever\n        $counter++; // Increment\
    \ $counter plus 1 \n        echo $counter;\n        if ($counter == 5){ \n   \
    \         break 2;\n        }\n    }\n    echo 'First while loop'; // Never displayed\
    \ because of break 2; \n    break; // Never run, but if it did, would end the\
    \ first while loop \n}\n```\n\n## Continue Statement\n\n`$integer` – [optional]\
    \ Specifies the number of nested loops to skip out of. Note: The `$integer` does\
    \ not supply the number of iterations to skip, it always only stops the current\
    \ iteration from continuing any further. Skips the rest of the current loop iteration\
    \ and if applicable, continues to the next iteration of the loop 3.\n\n**Example:**\n\
    ```php\nfor ($x=1;$x<=10;$x++){ \n    if ($x == 5){\n        continue;\n    }\
    \ // The echo never occurs if $x == 5 \n    echo $x;\n}\n```\n\n## Return Statement\n\
    \n`$variable` – [optional] The variable to be returned from a function. If used\
    \ as part of a regular script and not part of a function, it works the same as\
    \ `exit()` or `die()`. Return is more commonly used as part of a function to assign\
    \ a value to the results of a function back at the original function call.\n\n\
    **See Also:**\n- Functions – Provides an example of returning a `$variable` as\
    \ part of a function\n\n## File Functions\n\n`exit()` – Terminate the current\
    \ script immediately.\n\n`include` - `$string` Include and evaluate the file as\
    \ part of the current script/page. This is an easy way to store common variables,\
    \ functions,4, or lines of HTML that will be included by multiple scripts/pages.\
    \ Failure of the function generates an error.\n**Example:**\n```php\ninclude('somefile.inc');\n\
    ```\nIn the case of a `switch`, `continue` has the same effect as `break`4. Functions\
    \ should only be included once. Consider using `include_once()` or `require_once()`.\n\
    \n`include_once` - `$string` Include and evaluate the file as part of the current\
    \ script/page. If the file has already been included, it will ignore the request.\
    \ This is an easy way to store common variables, functions, or lines of HTML that\
    \ will be included by multiple scripts/pages. Failure of the function generates\
    \ an error and terminates the script immediately.\n**Example:**\n```php\ninclude_once('somefile.php');\n\
    ```\n\n`require` - `$string` Include and evaluate the file as part of the current\
    \ script/page. This is an easy way to store common variables, functions,5, or\
    \ lines of HTML that will be included by multiple scripts/pages. Failure of the\
    \ function generates an error.\n**Example:**\n```php\nrequire('somefile.htm');\n\
    ```\n\n`require_once` - `$string` Include and evaluate the file as part of the\
    \ current script/page. If the file has already been included, it will ignore the\
    \ request. This is an easy way to store common variables, functions, or lines\
    \ of HTML that will be included by multiple scripts/pages. Failure of the function\
    \ generates an error and terminates the script immediately.\n**Example:**\n```php\n\
    require_once('somefile.php');\n``` Functions should only be included once. Consider\
    \ using `require_once()`.\n\n## Global Variables\n\nWhile some global variables\
    \ can be created through the use of `define()`, some are reserved because of a\
    \ special function, giving access to different types of data. All global variables\
    \ listed below are arrays that may or may not contain data, depending on the current\
    \ script and environment.\n\n- `$_SERVER`\n- `$_SERVER['HTTP_USER_AGENT']` – Browser\
    \ description from header\n  `[HTTP_USER_AGENT] => Mozilla/5.0 (X11; U; Linux\
    \ i686; en-US; rv: 1.8.1.12) Gecko/20080207 Ubuntu/7.10 (gutsy) Firefox/2.0.0.12`\n\
    - `$_SERVER['HTTP_REFERER']` – The page address that referred the user\n  `[HTTP_REFERER]\
    \ => http://www.example.com/index.htm`\n- `$_SERVER['REMOTE_ADDR']` – The client's\
    \ IP address\n  `[REMOTE_ADDR] => 127.0.0.1`\n- `$_SERVER['DOCUMENT_ROOT']` –\
    \ System root location of current script\n  `[DOCUMENT_ROOT] => /opt/lampp/htdocs`\n\
    - `$_SERVER['SCRIPT_FILENAME']` – Absolute path of current script\n  `[SCRIPT_FILENAME]\
    \ => /opt/lampp/htdocs/test.php`\n- `$_SERVER['REQUEST_URI']` – The Universal\
    \ Resource Identifier for the page\n  `[REQUEST_URI] => /test.php?test=value`\n\
    - `$_SERVER['SCRIPT_NAME']` – The current scripts path\n  `[SCRIPT_NAME] => /test.php`\n\
    - `$_SERVER['QUERY_STRING']` – The current scripts path\n  `[QUERY_STRING] =>\
    \ test=value`\n- `$_SERVER['PHP_SELF']` – The name of the current script, relative\
    \ to the root\n  `[PHP_SELF] => /test.php`\n\nWhen submitting a form to the same\
    \ page/file that contains it, you can use the `$_SERVER['PHP_SELF']` variable\
    \ to dynamically provide the location.\n```html\n<form method=\"POST\" action=\"\
    <?php echo $SERVER['PHP_SELF']; ?>\">\n```\n```html\n<form method=\"POST\" action=\"\
    filename.php\">\n```\n"
