    ### `preserve_keys` – [optional] `$boolean` default: `FALSE`, indexed keys are
    reindexed


    Returns an array which contains the `$array` in reverse order, with indexed keys
    destroyed and reindexed by default. If `preserve_keys` is set to `TRUE`, the original
    keys will be kept.


    **Example:**

    ```php

    $array = array( ''zero'',''one'',''two'',![](image_rsrc7W4.jpg) array( ''zero'',
    ''name'' => ''Bob'' ) );

    print_r( array_reverse($array) );

    print_r( array_reverse($array, TRUE) );

    ```

    ![](image_rsrc7W5.jpg)

    **See Also:** `array_flip()` – Switch the keys and values within an array


    ![](image_rsrc7W6.jpg)

    ### `key` – `$string` or `$integer`


    Returns TRUE if `key` is present within `$array`.


    **Example:**

    ```php

    ![](image_rsrc7W7.jpg) $array = array( ''name'' => ''John'', ''job'' => ''unknown''
    );

    var_dump(  array_key_exists(''name'', $array) );

    ```

    **See Also:** `array_search()` – Similar, except returns the key if it is found


    ### `in_array()` – Checks whether a specific value exists in an array


    `array_search( search_value , $array [, strict ])`


    *   `search_value` – `$variable`

    *   `strict` – [optional] `$boolean` default: `FALSE`, match value only, not type
    of variable


    Checks whether `search_value` 1 exists in `$array` and returns its key if present.
    If it is not found, FALSE is returned. If `strict` is set to `TRUE`, `array_search()`
    will only return TRUE if the value and its variable type matches as well.


    **Note:** Only the first instance of `search_value` found returns its key. If
    the same value is present later in the array, it is ignored.


    **Example:**

    ```php

    $array = array( ''name'' => ''Bob'', ''age'' => 12, ''title'' => ''owner'' );

    echo array_search(''owner'', $array);

    $array = array( ''name'' => ''Bob'', ''age'' => 12, ''title'' => ''owner'' );

    var_dump( array_search(''12'', $array, TRUE) ); // Because strict is TRUE, string
    ''12'' does not match integer 12 bool(false)

    ```

    **See Also:** `array_keys()` – Similar, except it returns multiple keys with the
    same value; `array_key_exists()` – Similar, except returns only TRUE or FALSE


    ### `in_array()` – Checks whether a specific value exists in an array


    `in_array( value , $array [, strict ])`


    *   `value` – `$variable`

    *   `strict` – [optional] `$boolean` default: `FALSE`, match value only, not type
    of variable


    Returns TRUE if `value` is present within `$array`. If `strict` is set to `TRUE`,
    `in_array()` will only return TRUE if the value and the variable type matches
    as well.


    ![](image_rsrc7MK.jpg)


    If `search_value` is a string, it is evaluated as case-sensitive.


    **Example:**

    ```php

    $array = array( ''name'' => ''John'', ''age'' => ''12'' ); // ''12'' is a string

    ![](image_rsrc7W8.jpg) $integer = 12; // 12 is an integer

    var_dump( in_array( $integer, $array) );

    var_dump( in_array( $integer, $array, TRUE) );

    ```

    ![](image_rsrc7W9.jpg)

    **See Also:** `array_key_exists()` – Checks whether a specific key exists in an
    array; `array_search()` – Checks whether a specific key exists and returns it


    ![](image_rsrc7WA.jpg)


    *   `search_value` – [optional] `$variable`

    *   `strict` – [optional] `$boolean` default: `FALSE`, match value only, not type
    of variable


    Returns an array with all the keys in `$array`. If `search_value` is present,
    it only returns the keys that contain `search_value`. If `strict` is set to `TRUE`,
    `search_value` will be considered a match if the value and the type of variable
    are correct.


    **Example:**

    ```php

    ![](image_rsrc7WB.jpg) $array = array( ''name'' => ''Bob'', ''nickname'' => ''Bob'',
    ''age'' => ''12'' );

    print_r( array_keys($array) );

    $array = array( ''name'' => ''Bob'', ''nickname'' => ''Bob'', ''age'' => ''12''
    );

    print_r( array_keys($array, ''Bob'') );

    ```

    ![](image_rsrc7WC.jpg)

    // Notice that the 12 key is a string, not the indexed value of 12

    $array = array( ''name'' => ''Bob'', ''nickname'' => ''Bob'', ''12'' => ''age''
    );

    $integer = 12;

    ![](image_rsrc7WD.jpg) print_r( array_keys($array, $integer, TRUE) );

    ```

    **See Also:** `array_values()` – Returns all the values in an array


    ![](image_rsrc7WE.jpg)

    ### `array_values()` – Returns all the values in an array


    Return all values in `$array` as an indexed array.


    **Example:**

    ```php

    ![](image_rsrc7WF.jpg) $array = array( ''name'' => ''Eric'', ''age'' => 12, ''zero''
    );

    print_r( array_values($array) );

    ```

    **See Also:** `array_keys()` – Returns all the keys in an array


    ### `array_keys()` – Returns all the keys in an array (or keys matching a specific
    value)


    ![](image_rsrc7WG.jpg)

    Can accept multiple `$array` with their own optional order and type flags

    *   `order` – [optional] default: `SORT_ASC` (ascending) Other: `SORT_DESC` (descending)

    *   `type` – [optional] default: `SORT_REGULAR` (compare items normally) Other
    values: `SORT_NUMERIC` (compare items numerically), `SORT_STRING` (compare items
    as strings)


    Sorts the `$array` ascending by their values unless altered by the order and type
    flags. All indexed (numeric) keys will be rewritten, while associative keys will
    be unchanged. Sorting of uppercase letters is prior to lowercase letters when
    sorting in ascending order. Be aware that this function effects `$array` directly,
    and returns TRUE on success.


    **Note:** If multiple `$array` are provided, unless order and type flags are included,
    each array uses the default order and type flags are set (`SORT_ASC`, `SORT_REGULAR`).


    **Example:**

    ```php

    ![](image_rsrc7WH.jpg) $array = array( ''2'', ''3'', ''1'', ''a'', ''b'');

    array_multisort($array);

    print_r($array);

    ![](image_rsrc7WJ.jpg) $array = array( ''2'', ''3'', ''1'', ''a'', ''b'');

    array_multisort($array, SORT_NUMERIC);

    print_r($array);

    $array = array( ''2'', ''3'', ''1'', ''a'', ''b'');

    array_multisort($array, SORT_DESC, SORT_NUMERIC);

    print_r($array);

    ```

    ![](image_rsrc7WK.jpg)

    ```php

    ![](image_rsrc7WM.jpg) $array = array( ''2'', ''3'', ''1'', ''a'', ''b'');

    array_multisort($array, SORT_DESC, SORT_STRING);

    print_r($array);

    ```

    ■​ ■​ ■


    | This function is similar to the ORDER BY option of MySQL queries. |

