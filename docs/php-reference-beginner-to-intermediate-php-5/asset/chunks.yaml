    \ == FALSE){ // evaluating equality\n    echo 'Not Found!';\n}\n```\n输出：`Not Found!`\n\
    \n由于 `strpos($string,$needle)` 的结果等于 `0`，而布尔值 `FALSE` 等于整数 `0`，因此该表达式为真，并触发了 `echo`。因此，重要的是使用全等运算符\
    \ `===` 来进行恒等匹配的评估：\n\n```php\n$string = 'hello';\n$needle = 'h';\nif (strpos($string,$needle)\
    \ === FALSE){ // identical evaluation\n    echo 'Not Found!';\n}else{\n    echo\
    \ 'Found!';\n}\n```\n输出：`Found!`\n"
