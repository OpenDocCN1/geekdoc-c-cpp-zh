    ![](image_rsrc83T.jpg)session_write_close()Ends the current session and stores
    the current session data. This occurs automatically at the end of the script/page,
    but may be used to allow faster access to the session information since it is
    locked to one script at a time.

    Example:

    ```php

    session_start();

    session_write_close(); // Would be done at the end of the page anyway

    ```

    ![](image_rsrc83U.jpg)## Regular Expressions


    Sometimes you want to check for a specific structure as opposed to a specific
    value. Regular expressions allow this type of matching. Besides the few examples
    below and the inclusion of some regular expression syntax, no tutorial on regular
    expressions is given here (that could be its own book).


    ### Regular Expression Syntax


    - `^` – Start of string

    - `$` – End of string

    - `.` – Any single character

    - `()` – Group of expressions

    - `[]` – Item range (e.g. `[afg]` means a, f, or g)

    - `[^]` – Items not in range (e.g. `[^cde]` means not c, d, or e)

    - `-` (dash) – character range within an item range (e.g. `[a-z]` means a through
    z)

    - `|` (pipe) – Logical or (e.g. `(a|b)` means a or b)

    - `?` – Zero or one of preceding character/item range

    - `*` – Zero or more of preceding character/item range

    - `+` – One or more of preceding character/item range

    - `{integer }` – Exactly integer of preceding character/item range (e.g. `a{2}`)

    - `{integer ,}` – Integer or more of preceding character/item range (e.g. `a{2,}`)

    - `{integer ,integer }` – From integer to integer (e.g. `a{2,4}` means 2 to four
    of a)

    - `\` – Escape character

    - `[:punct:]` – Any punctuation

    - `[:space:]` – Any space character

    - `[:blank:]` – Any space or tab

    - `[:digit:]` – Any digit: 0 through 9

    - `[:alpha:]` – All letters: a-z and A-Z

    - `[:alnum:]` – All digits and letters: 0-9, a-z, and A-Z

    - `[:xdigit:]` – Hexadecimal digit

    - `[:print:]` – Any printable character

    - `[:upper:]` – All uppercase letters: A-Z

    - `[:lower:]` – All lowercase letters: a-z


    ### PERL Compatible (PCRE) only ( preg_*() )


    `/` - delimiter before and after the expression


    **Character classes:**

    - `\c` – Control character

    - `\s` – Whitespace

    - `\S` – Not whitespace

    - `\d` – Digit (0-9)

    - `\D` – Not a digit

    - `\w` – Letter (a-z, A-Z)

    - `\W` – Not a letter

    - `\x` – Hexadecimal digit

    - `\O` – Octal digit


    **Modifiers:**

    - `i` – Case-insensitive

    - `.` – Period matches newline

    - `m` – `^` and `$` match lines

    - `U` – Ungreedy matching

    - `e` – Evaluate replacement

    - `x` – Pattern over several lines


    `ereg( pattern , $string [, group_array ])`

    - `pattern` – `$string` Regular expression

    - `group_array` – [optional] Name of array to use for regular expression groups


    Matches the regular expression in `pattern` against `$string`. If items in `pattern`
    are grouped `()`, supplying the variable name for an array to assign those group''s
    values to is set as `group_array`.

    Returns FALSE on failed match, 1 if `group_array` is not provided, and the length
    of `$string` if `group_array` is provided.


    **Examples:**

    ```php

    $regex = "^[A-Z][a-z]+$"; // start, one uppercase letter, one or more lowercase
    letters, end

    $string = "Hello";

    var_dump( ereg($regex, $string) ); // int(1)


    $regex = "^([A-Z][a-z]+)[[:space:]]+([[:alpha:]]+)$"; // start, (one uppercase
    letter, one or more lowercase letters)// one or more spaces, (one or more letters),
    end

    $string = "Hello World";

    var_dump( ereg($regex, $string, $array) ); // The array in group_array will contain
    the entire string as key [0] print_r($array);

    ```

    ![](image_rsrc7MK.jpg)


    `gi( pattern , $string [, group_array ])`

    - `pattern` – `$string` Regular expression

    - `group_array` – [optional] Name of array to use for regular expression groups


    Matches the regular expression in `pattern` against `$string` in a case-insensitive
    manner. If items in `pattern` are grouped `()`, supplying the variable name for
    an array to assign those group''s values to is set as `group_array`.

    Returns FALSE on failed match, 1 if `group_array` is not provided, and the length
    of `$string` if `group_array` is provided.

    **Example:**

    ```php

    $regex = "^[a-z]+$";

    $string = "Hello";

    var_dump( eregi($regex, $string) ); // int(1)

    ```


    `ereg_replace( pattern , replacement , $string)`

    - `pattern` – `$string` Regular expression

    - `replacement` – `$string` `\digit` represents group `()` matches


    Returns a string containing `$string` after being evaluated by `pattern` and replacing
    it with the format in `replacement`. Items placed in groups `()` within the regular
    expression pattern can be reused within `replacement` and referred to by `\digit`,
    with `\0` representing all of `$string` and `\1` equal to the first grouped match,
    `\2`, etc.

    Note: If no matches are found, the original `$string` is returned.


    **Examples:**

    ```php

    $string = ''Hello'';

    $pattern = "^([A-Z])[a-z]+$"; // pattern: start, 1 uppercase letter, one or more
    lowercase, end

    $replacement = ".\1.\0."; // replacement: put periods around first group and whole
    string

    $newstring = ereg_replace($pattern, $replacement, $string); echo $newstring;


    $string = ''5551234567''; // phone number without punctuation

    $pattern = "^([0-9]{3})([0-9]{4})$";

    $replacement = "(\1)\2-\3"; // replacement: put formatting around a phone number

    $newstring = ereg_replace($pattern, $replacement, $string); echo $newstring;

    ```


    `egireplace()` – Case-insensitive version of `eregreplace()`

    - `pattern` – `$string` Regular expression

    - `replacement` – `$string` `\digit` represents group `()` matches (e.g. `\0`
    whole string)


    Returns a string containing `$string` after being evaluated by `pattern` and replacing
    it with the format in `replacement`. Items placed in groups `()` within the regular
    expression pattern can be reused within `replacement` and referred to by `\digit`,
    with `\0` representing all of `$string` and `\1` equal to the first grouped match,
    `\2`, etc.

    Note: If no matches are found, the original `$string` is returned.

    **Example:**

    ```php

    $string = ''Hello'';

    $pattern = "^([a-z])[a-z]+$";// pattern: start, one letter, one or more letters,
    end

    $replacement = ".\1.\0."; // replacement: put periods around first group and whole
    string

    $newstring = egireplace($pattern, $replacement, $string); echo $newstring;

    ```


    `preg_replace( pattern , replacement , subject [, limit ] [, count ])`

    - `pattern` – `$string` or `array` Regular expression(s)

    - `replacement` – `$string` or `array`

    - `subject` – `$string` or `array`

    - `limit` – [optional $integer default: -1, no limit

    - `count` – [optional] Variable name to contain an $integer


    Replaces all instances matching `pattern` with `replacement` within `subject`.
    If `subject` is an array, the match and replace occurs on all entries within the
    array. To refer to groups `()` created in `pattern` within the `replacement`,
    use `${digit}`, where `${0}` represents the entire string, `${1}` is the first
    group, and so on. If `pattern` and `replacement` are arrays, the entire subject
    is processed for each entry in the arrays, finding the first entry in `pattern`
    and replacing it with the first entry in `replacement`, then repeating with the
    next set of entries. If there are more values in the pattern array than the replacement
    array, an empty string (`''''`) is used as the replacement. If `pattern` is an
    array and `replacement` is a string, it is used for every entry in pattern .The
    optional `count` variable will be set with the total number of replacements that
    occurred.

    Note: This is PERL/PCRE, and the expression delimiter (`/`) may be used with the
    modifiers at the end of the expression.

    **Example:**

    ```php

    $pattern = "/^(\d{3})(\d{3})(\d{4})$/";

    $replacement = "(${1})${2}-${3}";

    $subject = ''5551234567'';

    $result = preg_replace($pattern, $replacement, $subject, -1, $count); echo "result:
    $result, count: $count";

    ```


    `preg_split( pattern , string [, limit [, flags ])`

    - `pattern` – `$string` Regular expression

    - `limit` – [optional $integer default: -1, no limit

    - `flags` – [optional] $string default: none

    Values: `PREG_SPLIT_NOEMPTY` (return only non-empty pieces) `PREG_SPLIT_DELIM_CAPTURE`
    (parenthesized delimiters inside of pattern will be returned in the array as well)
    `PREG_SPLIT_OFFSET_CAPTURE` (for each match, an entry is made to include its position
    (characters from start))


    Returns an array containing the contents of `$string` after being split upon regular
    expression pattern . If `limit` is specified, it sets the maximum number of entries
    in the array, with the last one being the remaining portion of `$string` that
    was not processed. The optional `flags` provide extra functionality described
    above

    Note: If `limit` is set to 1, the array will contain only `$string`.Note: This
    is PERL/PCRE, and the expression delimiter (`/)`) may be used with the modifiers
    at the end of the expression.

    **Examples:**

    ```php

    $string = ''2-0128'';

    $pattern = ''\D/''; // Split on anything is not a digit

    $array = preg_split($pattern, $string); print_r($array);


    $string = ''2-0128'';

    $pattern = ''/(\D)/''; // Split on anything is not a digit

    $array = preg_split($pattern, $string, -1, PREG_SPLIT_DELIM_CAPTURE); print_r($array);


    $string = ''2-0128'';

    $pattern = ''/\D/''; // Split on anything is not a digit

