  trans: "\n\n# 数学函数\n\n有时你需要更高级的数学函数。\n\n### abs(number)\n`number` – `$integer` 或\
    \ `$float`\n返回 `number` 的绝对值，类型与原变量相同。\n示例：\n```php\nvar_dump( abs(-21) );\nint(21)\n\
    ```\n\n### dechex($integer)\n返回 `$integer` 的十六进制值。最大值：`4294967295`。\n示例：\n```php\n\
    var_dump( dechex(4294967295) );\nstring(8) \"ffffffff\"\n```\n![](img/image_rsrc7Z2.jpg)\n\
    \n### max()\n根据提供的参数，有两种不同的格式：\n- 如果提供单个参数 `$array`，它返回数组中的最大值。\n- 如果提供两个或多个 `$variable`，它返回参数中的最大值。\n\
    \n注意：非数字字符串在比较时会被评估为零 (0)。\n示例：\n```php\n$array = array(4, 7, 2); \nvar_dump(\
    \ max($array) );\nint(7)\n```\n![](img/image_rsrc7MK.jpg)\n\n如果比较两个数组，它们将从左到右进行值与值的对比较：\n\
    ```php\nvar_dump( max(2, 5, 'string', '8') );\nstring(1) \"8\"\n```\n另请：`min()`\
    \ – 寻找最小值。\n\n### min()\n根据提供的参数，有两种不同的格式：\n- 如果提供单个参数 `$array`，它返回数组中的最大值。\n\
    - 如果提供两个或多个 `$variable`，它返回参数中的最小值。\n\n注意：非数字字符串在比较时会被评估为零 (0)。\n示例：\n```php\n\
    $array = array(-3, 7, 2); \nvar_dump( min($array) );\nint(-3)\n\nvar_dump( min(\
    \ array(1,2,3), array(1,2,4) ) ); // 1==1, 2==2, 3<4\narray(3) { \n    [0]=> int(1)\
    \ \n    [1]=> int(2) \n    [2]=> int(3) \n}\n```\n另请：`max()` – 寻找最大值。\n\n![](img/image_rsrc7Z3.jpg)\n\
    \n### pi()\n返回浮点数形式的 pi。\n示例：\n```php\nvar_dump( pi() );\nfloat(3.14159265359)\n\
    ```\n\n### pow(base, exponent)\n`base` – `$integer` 或 `$float`\n`exponent` – `$integer`\
    \ 或 `$float`\n返回 `base` 的 `exponent` 次幂值。\n示例：\n```php\nvar_dump( pow(2, 4) );\n\
    int(16)\n```\n![](img/image_rsrc7MK.jpg)\n\n### sqrt($float)\n返回 `$float` 的平方根。\n\
    示例：\n```php\nvar_dump( sqrt(16) );\nfloat(4)\n```\n如果比较两个数组，它们将从左到右进行值与值的比较。\n\
    \n### log($float [, base])\n`base` – [可选] `$float`\n返回 `$float` 的自然对数。可选的底数形式如下：`log$base`。\n\
    示例：\n```php\nvar_dump( log(10) );\nfloat(2.302585092)\n```\n\n### round($float\
    \ [, decimals])\n`decimals` – [可选] `$integer` 默认值：0 位小数\n将 `$float` 四舍五入到最近的整数。如果指定了\
    \ `decimals`，则四舍五入到 `decimals` 位小数。\n示例：\n```php\nvar_dump( round(3.14) );\nfloat(3)\n\
    \nvar_dump( round(pi(), 2) );\nfloat(3.14)\n\nvar_dump( round(143257.432, -2)\
    \ );\nfloat(143300)\n```\n如果 `decimals` 为负数，它将处理小数点左侧对应的位数。\n另请：`floor()` – 向下取整到最近的整数。\n\
    \n### floor($float)\n将 `$float` 向下取整到最近的整数。\n示例：\n```php\nvar_dump( floor(3.99)\
    \ );\nfloat(3)\n```\n另请：`round()` – 四舍五入到最近的整数或小数。\n\n### rand(min, max)\n`min,\
    \ max` – [可选] `$integers`\n生成一个随机整数。为了获得更好的随机性，请使用 `mt_rand()`。\n示例：\n```php\n\
    var_dump( rand(), rand(1,100) ); // 结果异\n```\n另请：`mt_rand()` – 一个更好、更快的随机数生成器。\n\
    \n### mt_rand(min, max)\n`min, max` – [可选] `$integers`\n生成一个随机整数，比 `rand()` 好。如果提供了参数，将生成\
    \ `min` 和 `max` 之间的随机整数。\n示例：\n```php\nvar_dump( mt_rand(), mt_rand(1,100) );\
    \ // 结果异\n```\n\n# MySQL 函数\n\n数据库。以某种形式形式，如果你想高效地存储和检索数据，你可能都会使用数据库。流行的 MySQL\
    \ 数据库是 LAMP 栈（Linux-Apache-MySQL-PHP）的一部分，值得稍微关注和解释。请注意，除少数示例外，本节介绍的是 PHP 函数，而不是如何构建查询。\n\
    \n![](img/image_rsrc7ZA.jpg)\n下表将用于演示这些查询：\n表名：`employees`\n| pkey | name | age\
    \ |\n| :--- | :--- | :--- |\n| 1 | Mary | 24 |\n| 2 | John | 17 |\n| 3 | Mark\
    \ | 53 |\n| 4 | Susan | 17 |\n\n"
- fmt: "\n## Examples\n\n- `SELECT * FROM employees`\n- `SELECT pkey,name,age FROM\
    \ employees`\n- `SELECT employees.pkey,employees.name,employees.age FROM table`\n\
    - `SELECT name FROM employees`\n- `SELECT name,age FROM employees`\n- `SELECT\
    \ * FROM employees WHERE age = 17`\n- `SELECT name FROM employees WHERE name LIKE\
    \ 'm%'`\n- `SELECT name FROM employees WHERE name LIKE BINARY 'm%'`\n- `SELECT\
    \ name FROM employees WHERE name LIKE '%a%'`\n- `SELECT name FROM employees WHERE\
    \ name LIKE '      ' ` // 5 underscores\n- `SELECT COUNT(*) FROM employees`\n\
    - `SELECT COUNT(*) FROM employees WHERE age = 17`\n- `SELECT age,COUNT(age) FROM\
    \ employees GROUP BY age`\n- `SELECT SUM(age) FROM employees`\n- `SELECT MAX(age)\
    \ FROM employees`\n- `SELECT DISTINCT age FROM employees`\n- `SELECT * FROM employees\
    \ LIMIT 1,2`\n- `SELECT name FROM employees ORDER BY name`\n- `SELECT name FROM\
    \ employees ORDER BY name DESC`\n\nThe following examples do not use the included\
    \ table and are for reference only:\n\n- `INSERT INTO table (column1,column2)\
    \ VALUES ('value1','value2'), ('value1','value2'), ('value1','value2')`\n- `UPDATE\
    \ table SET column1='newvalue' WHERE column2='value'`\n- `DELETE FROM table WHERE\
    \ column='value'`\n- `SELECT * FROM table1 INNER JOIN table2 on table1.id = table2.id`\n\
    - `SELECT table1.* FROM table1 INNER JOIN table2 on table1.id = table2.id`\n-\
    \ `SELECT table1.id FROM table1 INNER JOIN table2 on table1.id = table2.id`\n\
    - `SELECT table.id AS tableid FROM table`\n\n## MySQL Functions\n\n### mysql_connect()\n\
    \n- `server` – [optional] `$string` default: `' localhost:3306'` or `mysql.default_host`\n\
    - `username` – [optional] `$string` default: defined by `mysql.default_user`\n\
    - `password` – [optional] `$string` default: defined by `mysql.default_password`\n\
    - `new_link` – [optional] `$boolean` default: `FALSE`, no new link on second call\n\
    - `client_flag` – [optional] `$integer`\n\nEstablishes the initial connection/link\
    \ to the MySQL server located at `server` and using the permissions provided by\
    \ the `username` and `password`. Returns `FALSE` on failure and should be combined\
    \ with `die()` for security purposes. In most cases, you will use: `mysql_connect(server\
    \ , username , password )`.\n\nExample:\n```php\nmysql_connect('localhost', 'user',\
    \ 'password') or die('Could not connect to the database');\n```\n\nSee Also:\n\
    - `die()` – Halts the script when the function fails\n\n### mysql_close()\n\n\
    - `mysql_close([ link_identifier ])`\n- `link_identifier` – [optional] default:\
    \ last link opened\n\nCloses the connection to the MySQL server, by default, of\
    \ the last connection by `mysql_connect()`. If `link_identifier` is specified,\
    \ that link is closed instead.\n\nExample:\n```php\n$link = mysql_connect('localhost',\
    \ 'username', 'password') or die();\n$link2 = mysql_connect('/path/to', 'username',\
    \ 'password') or die();\nmysql_close($link); // Closes first link\nmysql_close();\
    \ // Closes the last link created, $link2 in this case\n```\n\nSee Also:\n- `mysql_connect()`\
    \ – Establish a connection to the MySQL server\n\n### mysql_select_db()\n\n- `mysql_select_db(\
    \ database [, link_identifier ])`\n- `database` – `$string`\n- `link_identifier`\
    \ – [optional] default: last link opened\n\nSelects the database to use specified\
    \ by the name `database`. By default, it uses the most recent MySQL server connection\
    \ by `mysql_connect()`, unless `link_identifier` is specified, then that link\
    \ is used instead.\n\nExample:\n```php\n$link = mysql_connect('localhost', 'username',\
    \ 'password') or die();\nmysql_select_db('database'); // or mysql_select_db('database',$link);\n\
    ```\n\nSee Also:\n- `mysql_connect()` – Establish a connection to the MySQL server\n\
    \n### mysql_query()\n\n- `query` – `$string`\n- `link_identifier` – [optional]\
    \ default: last link opened\n\nSubmits query to the server, using the most recent\
    \ `mysql_connect()` link unless the optional `link_identifier` is specified. Returns\
    \ `FALSE` on any errors in the query. `SELECT`, `SHOW`, `DESCRIBE`, and `EXPLAIN`\
    \ queries will return a resource that will need to be parsed by one of the `mysql_result()`\
    \ or `mysql_fetch_*()` functions, all other queries will return `TRUE` upon success.\n\
    \nExample:\n```php\nmysql_connect('localhost', 'username', 'password') or die();\n\
    mysql_select_db('database');\n$result = mysql_query(\"SELECT * FROM 'table'\"\
    );\n```\n\nSee Also:\n- `mysql_fetch_array()` – Get a row as an array from the\
    \ resource created\n- `mysql_fetch_assoc()` – Returns an associative array: `column=>value`\n\
    - `mysql_fetch_row()` – Returns an indexed array of the row\n- `mysql_result()`\
    \ - Get a single result from the resource created\n\n### db_query()\n\n- `database`\
    \ – `$string`\n- `query` – `$string`\n- `link_identifier` – [optional] default:\
    \ last link opened\n\nSends query to the MySQL server and `database`. Listed for\
    \ reference, use `mysql_select_db()` and `mysql_query()` instead.\n\nExample:\n\
    ```php\n$result = db_query('database', \"SELECT * FROM 'table'\");\n```\n\nSee\
    \ Also:\n- `mysql_select_db()` – Select the database to\n\n### mysql_error()\n\
    \n- `link_identifier` – [optional] default: last link opened\n\nReturns the MySQL\
    \ error of the last operation by default, or if specified, the `link_identifier`.\n\
    \nExample:\n```php\n$link = mysql_connect('localhost', 'user', 'password'); //\
    \ Valid\nmysql_select_db('No');\necho mysql_error();\n```\n\n### mysql_fetch_array()\n\
    \n- `resource` – Variable name containing the output of `mysql_query()`\n- `result_type`\
    \ – [optional] `$string` default: `MYSQL_BOTH`\n\nValues: `MYSQL_BOTH` (array\
    \ with both associative and numeric), `MYSQL_ASSOC` (array with associative indices),\
    \ `MYSQL_NUM` (array with numeric indices)\n\nReturns an array with a single row\
    \ of the resource generated from `mysql_query()` and advances the resource's internal\
    \ pointer to the next row. This is typically used in loop to extract all rows\
    \ of the resource and get the entire output of the query. By default, it provides\
    \ both the associative and numeric indices, but this can be altered by `result_type`.\n\
    \nExample:\n```php\n$result = mysql_query(\"SELECT * FROM name\");\n$array = mysql_fetch_array($result);\n\
    print_r($array);\n\n$array = mysql_fetch_array($result,MYSQL_ASSOC);\nprint_r($array);\n\
    ```\n\nExample using a loop and `MYSQL_NUM` option:\n```php\n$result = mysql_query(\"\
    SELECT * FROM name\");\nwhile ($row = mysql_fetch_array($result,MYSQL_NUM) ){\n\
    \    print_r($row);\n}\n```\n\n### mysql_fetch_assoc()\n\n- `resource` – Variable\
    \ name containing the output of `mysql_query()`\n\nReturns an array with a single\
    \ row of the resource generated from `mysql_query()` and advances the resource's\
    \ internal pointer to the next row, returning an associative array with `column\
    \ => value` association.\n\nExample:\n```php\n$result = mysql_query(\"SELECT *\
    \ FROM name\");\n$array = mysql_fetch_assoc($result);\nprint_r($array);\n```\n\
    \nExample using a while loop:\n```php\n$result = mysql_query(\"SELECT * FROM name\"\
    );\nwhile ($row = mysql_fetch_assoc($result) ){\n    print_r($row);\n}\n```\n\n\
    ### mysql_fetch_row()\n\n- `resource` – Variable name containing the output of\
    \ `mysql_query()`\n\nReturns an array with a single row of the resource generated\
    \ from `mysql_query()` and advances the resource's internal pointer to the next\
    \ row, returning an indexed array with only the values (no column names).\n\n\
    Example:\n```php\n$result = mysql_query(\"SELECT * FROM name\");\n$array = mysql_fetch_row($result);\n\
    print_r($array);\n```\n\nExample using a while loop:\n```php\n$result = mysql_query(\"\
    SELECT * FROM name\");\nwhile ($row = mysql_fetch_row($result) ){\n    print_r($row);\n\
    }\n```\n\n### mysql_result()\n\n- `resource` – Variable name containing the output\
    \ of `mysql_query()`\n- `row` – `$integer`\n- `column` – [optional] `$string`\
    \ or `$integer` default: 0, first column is retrieved\n\nReturns a string containing\
    \ a single cell from a specific row of the resource generated from `mysql_query()`.\
    \ If `field` is specified, instead of the value of the first column, the specified\
    \ field is retrieved (can be referenced by number starting with 0 or by name/alias).\n\
    \nNote: If you need more than a single result, you should use a `mysql_fetch_*()`\n\
    \nExample:\n```php\n$result = mysql_query(\"SELECT * FROM name\");\nvar_dump(\
    \ mysql_result($result, 0) );\nvar_dump( mysql_result($result, 1) );\nvar_dump(\
    \ mysql_result($result, 1, 'name') );\n```\n\n### mysql_num_rows()\n\n- `resource`\
    \ – Variable name containing the output of `mysql_query()`\n\nReturns the total\
    \ number of rows in the resource generated by `mysql_query()` as an integer.\n\
    \nExample:\n```php\n$result = mysql_query(\"SELECT * FROM name\");\n$row_total\
    \ = mysql_num_rows($result);\nvar_dump($row_total);\n```\n\n### mysql_free_result()\n\
    \n- `resource` – Variable name containing the output of `mysql_query()`\n\nClears\
    \ the system memory of all memory associated with `resource`. Only necessary if\
    \ working with large data sets within a single script, memory is automatically\
    \ cleared at the end of the script/page.\n\nExample:\n```php\n$result = mysql_query(\"\
    SELECT * FROM name\");\nmysql_free_result($result);\n```\n\n### mysql_get_server_info()\n\
    \n- `link_identifier` – [optional] default: last link opened\n\nReturns a string\
    \ with the MySQL server version, by default, of the last connection by `mysql_connect()`.\
    \ If `link_identifier` is specified, that link is used instead.\n\nExample:\n\
    ```php\n$link = mysql_connect('localhost', 'username', 'password') or die();\n\
    var_dump( mysql_get_server_info() );\n```\n\n### mysql_real_escape_string()\n\n\
    - `link_identifier` – [optional] default: last link opened\n\nReturns a string\
    \ with the `$string` processed for any special characters, adding a backslash\
    \ to escape the character and prevent SQL attacks. By default, the last connection\
    \ by `mysql_connect()` is used. If `link_identifier` is specified, that link is\
    \ used. Effects the following characters: `\\x00`, `\\n`, `\\r`, `\\`, and `'`.\n\
    \nNote: Performs the same functionality as `addslashes()`.\n\nExample:\n```php\n\
    $string = \"SELECT * FROM 'table'\";\nmysql_connect('localhost', 'username', 'password')\
    \ or die();\nvar_dump( mysql_real_escape_string($string) );\n```\n\n### mysql_data_seek()\n\
    \n- `resource` – Variable name containing the output of `mysql_query()`\n- `row`\
    \ – `$integer`\n\nAdvances the internal pointer of resource generated by `mysql_query()`\
    \ to row `row` (starting with row 0). Thus, the next `mysql_fetch_*()` function\
    \ grabs the specified row number.\n\nExample:\n```php\n$result = mysql_query(\"\
    SELECT * FROM name\");\nmysql_data_seek($result, 1); // Choose row 1\n```\n\n\
    ### mysql_affected_rows()\n\n- `link_identifier` – [optional] default: last link\
    \ opened\n\nReturns the number of rows affected by the last `INSERT`, `UPDATE`,\
    \ or `REPLACE` query. If `link_identifier` is specified, the last query associated\
    \ with the specified `mysql_connect()` link is used.\n\nExample:\n```php\nmysql_connect('localhost',\
    \ 'username', 'password') or die();\nmysql_select_db('database');\n$result = mysql_query(\"\
    \ INSERT INTO name (pkey,name) VALUES (NULL,'Joe') \");\nvar_dump( mysql_affected_rows()\
    \ );\n```\n\n### mysql_create_db()\n\n- `string` – `$string`\n- `link_identifier`\
    \ – [optional] default: last link opened\n\nCreates a database with the name `$string`\
    \ on the MySQL server last used with `mysql_connect()`, unless `link_identifier`\
    \ is specified, then that one is used instead.\n\nNote: Reference only, use `mysql_query()`\
    \ and `\"CREATE DATABASE\"`\n\nExample:\n```php\nmysql_connect('localhost', 'username',\
    \ 'password') or die();\nmysql_create_db('database');\n```\n\n### mysql_drop_db()\n\
    \n- `string` – `$string`\n- `link_identifier` – [optional] default: last link\
    \ opened\n\nDestroys a database with the name `$string` on the MySQL server last\
    \ used with `mysql_connect()`, unless `link_identifier` is specified, then that\
    \ one is used instead.\n\nNote: Reference only, use `mysql_query()` and `\"DROP\
    \ DATABASE\"`\n\nExample:\n```php\nmysql_connect('localhost', 'username', 'password')\
    \ or die();\nmysql_drop_db('database');\n```\n\n## Directory & File System Functions\n\
    \n### getcwd()\n\nReturns a string containing the current directory.\n\nExample:\n\
    ```php\nvar_dump( getcwd() ); // Results will vary\n```\n\nSee Also:\n- `chdir()`\
    \ – Changes the current directory\n\n### chdir()\n\n- `directory` – `$string`\n\
    \nChanges the current directory to `$string`, returning `TRUE` when successful.\
    \ Note: Directory change lasts only as long as the script/page.\n\nExample:\n\
    ```php\nvar_dump( getcwd() ); // Get the current directory\nchdir('images');\n\
    ```\n\nSee Also:\n- `getcwd()` – Get the current directory\n\n### scandir()\n\n\
    - `directory` – `$string`\n- `sort_flag` – [optional] `$integer` default: `0`\
    \ (ascending) Other value: `1` (descending)\n\nReturns an array containing all\
    \ files and directories inside the `$directory`. If `sort_flag` is 0 or not specified,\
    \ the array is sorted alphabetically in order.\n\nExample:\n```php\n$array = scandir('directory');\
    \ // Results vary\n```\n\n### copy()\n\n- `source` – `$string`\n- `destination`\
    \ – `$string`\n\nCopies a file with name `source` to `destination`, overwriting\
    \ the `destination` if already exists. The original source is unchanged.\n\nExample:\n\
    ```php\ncopy('file.txt', 'file.txt.bak');\n```\n\n### rename()\n\n- `oldname`\
    \ – `$string`\n- `newname` – `$string`\n\nRenames the file or directory with the\
    \ name `oldname` to the name `newname`.\n\nExample:\n```php\nrename('file.txt',\
    \ 'file.tmp');\n```\n\n### mkdir()\n\n- `path` – `$string`\n- `ix_mode` – [optional]\
    \ `$integer` default: `0777` (octal), read/write for everyone\n- `recursive_flag`\
    \ – [optional] `$boolean` default: `FALSE`, one directory at a time\n\nCreates\
    \ a directory at `path`. If on a Unix/Linux server, you can change the default\
    \ mode from `0777` to other permissions in octal form (leading zero). Only one\
    \ directory deep can be created at time unless `recursive_flag` is set to `TRUE`.\n\
    \nExample:\n```php\nmkdir('tmp');\nmkdir('tmp/2/tmp', 0775, TRUE);\n```\n\nSee\
    \ Also:\n- `chmod()` – Change file mode (permissions)\n\n### rmdir()\n\n- `path`\
    \ – `$string`\n\nRemoves the directory with the `path`.\n\nExample:\n```php\n\
    rmdir('/temp/tmp');\n```\n\n### unlink()\n\n- `filename` – `$string`\n\nDeletes\
    \ the file with the name/path `$string`.\n\nExample:\n```php\nunlink('file.txt');\n\
    ```\n\n### fopen()\n\n- `filename` – `$string`\n- `mode` – `$string`\n- `use_include_path`\
    \ – [optional] `$boolean` default: `FALSE`\n\nOpens a file with name `filename`\
    \ using the following mode:\n- `r` (read only, file pointer at the beginning)\n\
    - `r+` (read and write, file pointer at the beginning)\n- `w` (write only, file\
    \ pointer at the beginning, zero length file, create it if it does not exist)\n\
    - `w+` (read and write, file pointer at the beginning, zero length file, create\
    \ it if it does not exist)\n- `a` (write only, file pointer at the end, zero length\
    \ file)\n- `a+` (read and write, file pointer at the end, zero length file)\n\
    - `x` (write only, file pointer at the beginning, if exists, return `FALSE`)\n\
    - `x+` (read and write, file pointer at the beginning, if exists, return `FALSE`)\n\
    \nIf `use_include_path` is set to `TRUE`, the system will check in the PHP defined\
    \ `include_path` for the file as well. Returns a resource for the usage of other\
    \ functions.\n\nExample:\n```php\n$file = fopen('file.txt', 'r');\n```\n\nSee\
    \ Also:\n- `fclose()` – Closes the file and resource opened by `fopen()`\n\n###\
    \ fclose()\n\n- `resource` – Variable name containing the file pointer created\
    \ by `fopen()`\n\nCloses a file opened with `fopen()`.\n\nExample:\n```php\n$file\
    \ = fopen('file.txt', 'r');\nfclose($file);\n```\n\nSee Also:\n- `fopen()` – Opens\
    \ a file for reading, writing, or both\n\n### fread()\n\n- `resource` – Variable\
    \ name containing the file pointer created by `fopen()`\n- `length` – `$integer`\n\
    \nReturns a string containing the contents of resource created by `fopen()` for\
    \ the byte length `length`.\n\nExample:\n```php\n// file.txt contains the sentence:\
    \ Hello World!!\n$file = fopen('file.txt', 'r');\nvar_dump( fread($file, 8) );\n\
    ```\n\nSee Also:\n- `fwrite()` – Writes to the opened file\n"
