  trans: "\n\n## 常用八进制模式\n\n| 模式 | 描述 |\n| :--- | :--- |\n| `0777` | 所有人可读、写、执行 |\n\
    | `0755` | 所有者读/写/执行，其他人可读/执行 |\n| `0644` | 所有者读/写，其他人可读 |\n| `0600` | 所有者读/写，其他人无访问权限\
    \ |\n| `0754` | 所有者读/写/执行，组用户可读/执行，其他人可读 |\n\n## 输出控制（输出缓冲区）\n\n想象你将所有的代码、所有的输出内容都塞进一个大袋子里，然后一次性倒在柜台上，或者如果你愿意的话，直接扔进垃圾桶。代码仍然在运行，只是输出变了。这就是输出缓冲的概述。此外，它还让事情变得更容易，特别是在处理头和\
    \ cookie 时，这些内容都需要按照特定的顺序发送给用户。![](img/image_rsrc82X.jpg)\n\n尝试立即将所有输出推送到用户/浏览器，而不是等待脚本完成。\n\
    \n**注意：** 如果你处于输出缓冲区 `ob_start()` 中，你还需要调用 `ob_flush()`。\n\n### 示例\n\n```php\n\
    for($x=0;$x<=1000;$x++){ // 循环 1001 次\n    echo $x;\n    flush(); // 将每个 echo\
    \ $x 发送到浏览器\n    // 如果不存在 flush()，它将在脚本/循环结束时\n    // 一次性将整个数字链输出到浏览器\n}\n```![](img/image_rsrc82Y.jpg)\n\
    \n```php\nob_start(); // 开启输出缓冲区\nfor($x=0;$x<=1000;$x++){ // 循环 1001 次\n    echo\
    \ $x;\n    flush(); // 将输出发送到输出缓冲区\n}\nob_flush(); // 将输出缓冲区发送到浏览器并清空\n// 如果不存在\
    \ ob_flush()，它将在脚本/循环结束时\n// 一次性将整个数字链输出到浏览器\n```![](img/image_rsrc82Z.jpg)\n\n\
    **另见：** `ob_flush()` – 从输出缓冲区刷新输出。\n\n## `flush()` 的用法\n\n使用 `flush()` 是为了在脚本运行时间较长时给运行脚本的用户提供反馈，否则他们可能会面对一个空白页面。例如，当从文件逐行向数据库导入大量数据时，你可以在每行完成后在屏幕上提供一个点（`.`），并每隔\
    \ 70 个左右的点换一次行，向用户提供程序正在运行的反馈。虽然这可能会慢一点，但如果他们认为认为出了问题而停止脚本，情况会更糟。\n\n作为对比，这里显示了一个简单的脚本，并使用了每种方法的不同时间测试作为比较。\n\
    \n```php/*以下所有方法都使用其外围的代码来生成完成时间。所示的输出仅为完成时间，而不是随之 echo 出来的长串数字。*/\n$time = microtime(1);\
    \ // 开始\n// 示例代码在此处\n$time = number_format(microtime(1)-$time, 6); echo \"$time\
    \ seconds to complete\"; // 结束\n```\n\n### 时间测试对比\n\n| 方法 | 结果 |\n| :--- | :---\
    \ |\n| `for($x=0;$x<=100000;$x++){ echo $x;}` | `0.468251 seconds to complete`\
    \ |\n| `for($x=0;$x<=100000;$x++){ echo $x;flush();}` | `3.616512 seconds to complete`\
    \ |\n| `ob_start(); for($x=0;$x<=100000;$x++){echo $x;}` | `0.182167 seconds to\
    \ complete` |\n| `ob_start(); for($x=0;$x<=100000;$x++){echo $x; flush();// 没有\
    \ ob_flush()，在脚本完成前不会输出给用户}` | `0.762600 seconds to complete` |\n| `ob_start();\
    \ for($x=0;$x<=100000;$x++){echo $x; flush(); ob_flush();}` | `4.443787 seconds\
    \ to complete` |\n\n![](img/image_rsrc830.jpg)\n\n## 缓冲区函数\n\n### `use_include_path`\
    \ – [可选] `$boolean` 默认：`FALSE`\n读取名称/路径为 `$string` 的文件内容并将其写入输出中，类似于将内容读入字符串然后\
    \ echo 该字符串。如果 `use_include_path` 设置为 `TRUE`，则会在 PHP `include_path` 中搜索该文件。\n\n\
    **示例：**![](img/image_rsrc831.jpg)\n```php\n// file.txt 内容：Hello World\nreadfile('file.txt');\n\
    ```![](img/image_rsrc832.jpg)\n\n### `callback_function` – [可选] `$string`（函数名）\n\
    ### `flush_size` – [可选] `$integer` 默认：`0`（在结束时刷新）\n其他预设值：`1`（将大小设置为 4096）\n###\
    \ `erase` – [可选] `$boolean` 默认：`TRUE`，缓冲区在 `flush_size` 时清空\n启动一个输出缓冲区，在将其发送给用户/浏览器之前存储所有输出。在脚本结束时或通过指定的\
    \ `ob_*()` 函数时一次性发送。\n\n如果指定了 `callback_function`，存储中的输出将作为字符串发送给名为 `callback_function`\
    \ 的函数，当脚本完成或调用 `ob_end_flush()` 时。关闭缓冲区。该函数应返回一个字符串，以便输出到用户/浏览器。\n\n如果设置了 `flush_size`，当某部分输出超过\
    \ `flush_size` 长度时，缓冲区将被刷新（同于 `ob_flush()`）。如果 `erase` 设置为 `FALSE`，缓冲区在脚本结束之前不会删除。\n\
    \n**注意：** 如果指定的 `callback_function` 失败，则返回 `FALSE`。\n\n**示例：**\n\n```php\nob_start();\n\
    ```![](img/image_rsrc833.jpg) // 此处生成输出的代码\n```php\nfunction ChangeName($buffer){\n\
    \    // 在缓冲区中将所有的 'username' 替换为 'Bob'\n    $buffer = str_replace('username',\
    \ 'Bob', $buffer);\n    return $buffer; // 返回新缓冲区进行输出\n}\n```\n```php\nob_start('ChangeName');\n\
    echo 'My name is username';\n```![](img/image_rsrc834.jpg)\n```php\nfunction ChangeName($buffer){\n\
    \    $buffer = $buffer . '||'; // 在缓冲区末尾添加 ||\n    return $buffer;\n}\nob_start('ChangeName',10);\n\
    echo 'My name is Mario';\necho 'My name is Mario';\n```\nMy name is Mario||My\
    \ name is Mario\n\n有一个名为 `ob_gzhandler` 的内置函数，它会在将输出送到用户/浏览器之前对缓冲区进行压缩。调用它使用：\n\
    ```php\nob_start('ob_gzhandler');\n```\n\n输出缓冲区会自动将 `header()` 和 `setcookie()`\
    \ 的输出重新排列到页面顶部，从而避免 Apache 错误。这使得在脚本某处出错时，很容易在 `header()` 中包含重定向，即使在脚本早期部分已经向页面输出了数据。重定向和头部信息将放在前面，用户永远看不到那些数据。\n\
    \n```php\nob_start();\necho 'You will never see this';\nif ($baduser){ // 如果 $baduser\
    \ 为 TRUE\n    header('Location: http://www.someotherplace.com');\n}\nob_end_flush;\
    \ // 结束缓冲区并将输出发送给用户\n```\n\n"
- fmt: '

    `ob_flush()` sends all the contents of the buffer to the user/browser as if you
    had reached the end of the script, erasing the current contents of the buffer.
    The buffer is not closed.

    Example:

    ```php

    ob_start();

    echo ''Send me now!''; ob_flush();

    echo ''Send me at the end of the script.'';

    // Output:

    // Send me now!Send me at the end of the script.

    ```


    `ob_clean()` discard/deletes the current contents of the output buffer. The buffer
    is not closed.

    Example:

    ```php

    ob_start();

    echo ''I will never be seen''; ob_clean();

    ![](image_rsrc835.jpg) echo ''Send me at the end of the script.'';

    ![](image_rsrc836.jpg)

    ```


    `ob_end_flush()` sends all the contents of the current output buffer to the user/browser
    as if you had reached the end of the script, erasing the current contents of the
    buffer. The buffer is then closed. This function is called automatically at the
    end of the script/page that has `ob_start()` present.

    Example:

    ```php

    ob_start();

    echo ''Send me now!''; ob_end_flush();

    ![](image_rsrc837.jpg) // The rest of the code is not buffered.

    ![](image_rsrc838.jpg)

    ```


    `ob_end_clean()` discard/deletes the current contents of the current output buffer,
    then close the buffer.

    Example:

    ```php

    ob_start();

    echo ''I will never be seen''; ob_end_clean();

    ![](image_rsrc839.jpg) // The following code is not buffered

    echo ''Send me at the end of the script.'';

    ![](image_rsrc83A.jpg)

    ```


    `ob_get_flush()` returns a string with all the contents of the current output
    buffer, flushes/sends the contents of the buffer to the user/browser, erases the
    current contents of the buffer and finally closes it.

    Example:

    ```php

    ob_start();

    echo ''Send me, store me. '';![](image_rsrc83B.jpg)

    $buffer = ob_get_flush(); // Buffer is now closed

    echo "buffer: $buffer";

    ```


    `ob_get_clean()` return the contents of the current buffer to a string then discard/deletes
    the current contents of the buffer, finally closing the buffer.

    Example:

    ```php

    ob_start();

    echo ''I will exist in a string'';

    $buffer = ob_get_clean(); // Buffer is now closed

    echo "buffer: $buffer";

    // Output: buffer: I will exist in a string

    ```


    `ob_get_contents()` returns a string with all the contents of the current output
    buffer without clearing it. The buffer is not closed.

    Example:

    ```php

    ob_start();

    echo ''Send me, store me. '';

    $buffer = ob_get_contents();

    ob_end_clean(); // Close and erase the buffer

    echo "buffer: $buffer";

    // Output: buffer: Send me, store me.

    ```


    `ob_get_length()` returns an integer with the length of the current output buffer.

    Example:

    ```php

    ob_start();

    ![](image_rsrc83C.jpg) echo ''Hello World!'';

    var_dump( ob_get_length() );

    echo ''Hello again...'';

    var_dump( ob_get_length() );

    ```


    `ob_get_level()` returns an integer containing the number of output buffers it
    is nested within, or 0 if output buffering is not enabled.

    Example:

    ```php

    ![](image_rsrc83D.jpg) var_dump( ob_get_level() );

    ob_start(); // First output buffer

    ob_start(); // Second output buffer

    var_dump( ob_get_level() );

    ```


    # Sessions


    Sessions are used in PHP to provide a method to track a user throughout a website
    and pass data between pages about that user during their time on the site. A unique
    ID is assigned to the user and the data is stored on the server itself, rather
    than on the user''s computer such as with cookies. The most common form of session
    usage is for commerce sites and the ability to have a shopping cart, user login
    and customized interfaces, and navigation history.

    ![](image_rsrc83E.jpg)


    `session_start()` start a new session or continue an already open session based
    on the current session id stored in a cookie or passed through GET or POST.

    Note: If using the `ob_start()` function, place it before `session_start()`. Secondarily,
    `session_start()` must be called prior to any other output is generated when `ob_start()`
    is not used.

    Examples:

    ```php

    session_start();

    ![](image_rsrc83F.jpg) echo "Your session id is " . session_id();


    session_start();

    ![](image_rsrc83G.jpg) $_SESSION[''color''] = ''blue'';

    ![](image_rsrc83H.jpg)

    ```


    `session_unset()` unset/remove all session variables, essentially removing all
    entries in the `$_SESSION` global variable array.

    Note: If you want to unset a specific key, use `unset($_SESSION[''key''])`.

    Example:

    ```php

    session_start();

    $_SESSION[''color''] = ''blue'';

    echo $_SESSION[''color''];

    session_unset();

    ![](image_rsrc83J.jpg) echo $_SESSION[''color''];

    ```

    See Also: `session_destroy()` – Destroy everything related to a session


    `session_destroy()` destroy/delete the current session. The values stored in `$_SESSION`
    are not deleted and any session cookies are also not deleted (see tip below).

    Note: It is necessary to call `session_start()` again after `session_destroy()`
    if you still want to have a session.

    Example:

    ```php

    session_start();

    $_SESSION[''color''] = ''blue'';

    echo $_SESSION[''color''];

    session_unset();

    ![](image_rsrc83K.jpg) echo $_SESSION[''color''];

    ```

    See Also:

    - `session_unset()` – Remove all variables assigned to `$_SESSION`

    - `session_regenerate_id()` – Recreate a new session id

    - `setcookie()` – Create or delete a cookie


    To completely destroy the session, you must destroy the cookie as well. This is
    done using the `setcookie()` function.

    ```php

    session_start(); // Load session

    session_destroy(); // Destroy session

    session_unset(); // Delete all variables in $_SESSION

    setcookie( session_name(), '''', time()-1 ); // Sets the cookie to expire 1 second
    ago, essentially deleting it

    ```

