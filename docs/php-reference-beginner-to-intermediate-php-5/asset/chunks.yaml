  trans: "\n\n# 密码安全与盐（Salt）\n\n为了更安全地存储用户密码，应该考虑使用盐（salt）。盐基本上是添加到提供的 `$string` 上的一个字符串，用于增加其长度和复杂度。对于用户密码，盐将由系统随机创建，然后作为与该用户密码分离的独立条目保存到数据库中。这有助于防止反向\
    \ `md5` 字典攻击。\n\n```php\n$password = 'password'; // 非常糟糕的密码\n$salt = substr(md5(uniqid(mt_rand(),\
    \ TRUE)), 0, 5); // 5 位字符的盐\n$salted_password_hash = md5($salt . md5($password));\
    \ \necho $salted_password_hash; // 输出结果异\n```\n\n`d1239dcc6e017572ea6fed5df0d6e07e`\n\
    \n## 哈希函数\n\n### md5_file\n- `filename` – `$string`\n- `raw_flag` – [可选] `$boolean`\
    \ 默认: `FALSE`，32 位十六进制\n\n生成名为 `filename` 的文件的 `MD5` 哈希。如果 `raw_flag` 设置为 `TRUE`，则返回长度为\
    \ 16 位的原始二进制格式。\n\n**示例：**\n```php\n$hash = md5_file('somefile.txt');\n```\n**另见：**\
    \ `md5()` – 基于 MD5 算法的字符串加密。\n\n### sha1\n- `raw_flag` – [可选] `$boolean` 默认: `FALSE`，40\
    \ 位十六进制\n\n使用美国安全哈希算法（US Secure Hash Algorithm）对 `$string` 进行单向哈希加密。如果 `raw_flag`\
    \ 设置为 `TRUE`，则返回长度为 20 的原始二进制格式。\n\n**示例：**\n```php\n$password = 'mypassword';\
    \ \necho sha1($password);\n```\n**另见：** `md5()` – 常用的基于 MD5 算法的加密。\n\n请参考 `md5()`\
    \ 提示如何为密码添加盐以增加额外的安全性。\n\n### sha1_file\n- `filename` – `$string`\n- `raw_flag`\
    \ – [可选] `$boolean` 默认: `FALSE`，40 位十六进制\n\n生成名为 `filename` 的文件的 `Sha1` 哈希。如果\
    \ `raw_flag` 设置为 `TRUE`，则返回长度为 20 的原始二进制格式。\n\n**示例：**\n```php\n$hash = sha1_file('somefile.txt');\n\
    ```\n**另见：** `sha1()` – 基于 Sha1 算法的字符串加密。\n\n### number_format\n- `decimals` –\
    \ [可选] `$integer` 默认: `0`，无小数\n- `decimal_point` – [可选] `$string` 默认:句点 ( `.`\
    \ )\n- `thousand_separator` – [可选] `$string` 默认:逗号 ( `,` )\n\n如果指定，则对 `$float`\
    \ 进行千分位分隔和数位格式化处理。\n注意：如果浮点数的位数多于指定的格式，将进行四舍五入。\n\n**示例：**\n```php\n$float = 1234567.891;\n\
    echo number_format($float);\necho number_format($float, 2); // 美式符号\necho number_format($float,\
    \ 2, \",\", \" \"); // 法式格式\n```\n\n### nl2br\n- `string` – `$string`\n\n将 `$string`\
    \ 中所有的换行符字符（ `\\n` ） 替换为 XHTML 换行符 `<br />`。\n\n**示例：**\n```php\n$string = \"\
    Hello\\nWorld\"; \necho nl2br($string);\n```\n\n### parse_str\n将 `$string` 视为查询字符串，并将变量赋值为与查询键相同的名，然后赋值与查询值相同的值。如果指定了\
    \ `$array`，则查询变量将赋值给数组，并具有相同的键=>值关联关系。\n注意：输出受 `magic_quotes_gpc` 设置的影响，与 `$_GET`\
    \ 相同。\n\n**示例：**\n```php\n$query_string = 'key=value&color=red'; \nparse_str($query_string);\n\
    echo \"\\$key equals $key, and \\$color equals $color\";\n\n$query_string = \"\
    key=value&color='red'\"; \nparse_str($query_string, $array);\necho '<pre>'; //\
    \ 为了便于阅读\nprint_r($array);\n```\n- 未启用 `magic_quotes_gpc`。\n- 启用了 `magic_quotes_gpc`。\n\
    \n**另见：** `get_magic_quotes_gpc()` – 检查是否启用了魔法引号；`list()` – 将数组的内容赋值给变量。\n\n这是一个非常方便的方法，可以使用以下代码将\
    \ `$_SERVER['QUERY_STRING']` 提交的所有查询键/值轻松转换为变量：\n```php\nparse_str($_SERVER['QUERY_STRING']);\n\
    ```\n\n"
- fmt: "\n## str_replace()\n\n- **find** – `$string` or `$array`\n- **replace** –\
    \ `$string` or `$array`\n- **subject** – `$string` or `$array`\n- **count** –\
    \ [optional] variable name - `$integer`\n\nReplaces all instances of `find` with\
    \ `replace` within `subject`. If `subject` is an array, the `find` and `replace`\
    \ occurs on all entries within the array. If `find` and `replace` are arrays,\
    \ the entire string is processed for each entry in the arrays, finding the first\
    \ entry in `find` and replacing it with the first entry in `replace`, then repeating\
    \ with the next set of entries. If there are more values in the `find` array than\
    \ the `replace` array, an empty string (`''`) is used as the replacement. If `find`\
    \ is an array and `replace` is a string, `replace` is used for every entry in\
    \ `find`. The optional `count` variable will be set with the total number of replacements\
    \ that occurred. \n\n**Note:** This function is case-sensitive.\n\n### Examples:\n\
    ```php\n$newstring = str_replace('find', 'replace', 'I will find');\necho $newstring;\n\
    $array = array('I like dogs', 'I hate dogs');\n$newarray = str_replace('dog',\
    \ 'cat', $array);\nprint_r($newarray);\n$findarray = array('l', 'p');\n$replacearray\
    \ = array('p', 'x');\n$string = \"Hello\";\n// It will find l, replace with p,\
    \ then find p and replace with x\n$newstring = str_replace($findarray, $replacearray,\
    \ $string, $count);\necho \"$newstring had a total of $count replacements\";\n\
    $findarray = array('l', 'p', 'x'); // has one extra entry\n$replacearray = array('p',\
    \ 'x');\n$string = \"Hello\";\n$newstring = str_replace($findarray, $replacearray,\
    \ $string);\necho $newstring;\n$findarray = array('l', 'o');\n$replace = 'x';\n\
    $string = \"Hello\";\n$newstring = str_replace($findarray, $replace, $string);\n\
    echo $newstring;\n```\n\n**See Also:**\n- `str_ireplace()` – Case-insensitive\
    \ version of `str_replace()`\n- `strtr()` – Simplified variation that also does\
    \ not repeat on find/replace\n\n---\n\n## str_ireplace()\n\n- **find** – `$string`\
    \ or `$array`\n- **replace** – `$string` or `$array`\n- **subject** – `$string`\
    \ or `$array`\n- **count** – [optional] variable name - `$integer`\n\nReplaces\
    \ all instances of `find` with `replace` within `subject`. If `subject` is an\
    \ array, the `find` and `replace` occurs on all entries within the array. If `find`\
    \ and `replace` are arrays, the entire string is processed for each entry in the\
    \ arrays, finding the first entry in `find` and replacing it with the first entry\
    \ in `replace`, then repeating with the next set of entries. If there are more\
    \ values in the `find` array than the `replace` array, an empty string (`''`)\
    \ is used as the replacement. If `find` is an array and `replace` is a string,\
    \ `replace` is used for every entry in `find`. The optional `count` variable will\
    \ be set with the total number of replacements that occurred. \n\n**Note:** This\
    \ function is case-insensitive.\n\n### Example:\n```php\n$newstring = str_ireplace('find',\
    \ 'replace', 'I will FIND');\necho $newstring;\n```\nSee `str_replace()` for more\
    \ examples.\n\n**See Also:**\n- `str_replace()` – Case-sensitive version of `str_ireplace()`\n\
    \n---\n\n## strtr()\n\n- **find** – `$string`\n- **replace** – `$string`\n- **replace_array**\
    \ – `$array`, associative `find => replace`\n\nThis function behaves differently\
    \ if presented with either three arguments (single find/replace) or two arguments\
    \ (uses an array of find/replace). With three arguments, all instances of `find`\
    \ inside of `$string` are replaced with `replace`. With two arguments, each entry\
    \ of `replace_array` is processed so that the key is replaced with the value.\n\
    \n**Note:** Unlike `str_replace()`, only the original values of `$string` will\
    \ be subject to the find/replace.\n\n### Example:\n```php\necho strtr('I like\
    \ dogs', 'dog', 'cat');\n$array = array( 'find' => 'replace', 'replace' => 'find');\n\
    $string = 'I will find and then replace';\n$newstring = strtr($string, $array);\n\
    echo $newstring;\n```\n**See Also:**\n- `str_replace()` – A more flexible method\
    \ of replacing items within a string\n\n---\n\n## substr()\n\n- **start** – `$integer`,\
    \ if negative, starts counting from the end of `$string`\n- **length** – [optional]\
    \ `$integer` default: `strlen($string)` if negative, number of characters left\
    \ off from the end of `$string`\n\nReturns only a portion of string starting with\
    \ the character after number `start` and optionally for `length` characters long.\n\
    \n### Examples:\n```php\necho substr('1234567890', 3);\necho substr('1234567890',\
    \ -3, 1);\necho substr('1234567890', -3, -1);\n```\n\n---\n\n## substr_replace()\n\
    \n- **subject** – `$string` or `$array`\n- **replace** – `$string`\n- **start**\
    \ – `$integer`, if negative, counts from the end of the string\n- **length** –\
    \ [optional] `$integer` default: `strlen($string)`\n\nReplaces text till the end\
    \ of the string within `subject` with `replace` starting after character number\
    \ `start`. If `length` is specified, only `length` number of characters after\
    \ `start` are replaced with `replace` when `length` is positive. If `length` is\
    \ negative, it represents the number of characters to stop replacing from the\
    \ end of the string. If `subject` is an array, the function returns an array instead\
    \ of a string, with the replacement processed on every entry in the array.\n\n\
    ### Examples:\n```php\n$string = substr_replace('1234567890', 'hello', 3);\necho\
    \ $string;\necho substr_replace('1234567890', 'hello', 3, 2);\n$array = array('1234567890',\
    \ '098765432');\n$array = substr_replace($array, 'hello', -3, -2);\nprint_r($array);\n\
    ```\n**See Also:**\n- `str_replace()` – A find and replace of specific strings\
    \ or contents\n\n---\n\n## substr_count()\n\n- **haystack** – `$string`\n- **needle**\
    \ – `$string`\n- **start** – [optional] `$integer`, must be 0 or a positive number\n\
    - **length** – [optional] `$integer`, must be 0 or a positive number\n\nReturns\
    \ the total number of instances of `needle` in `haystack`. If `start` is provided,\
    \ it ignores `start` number of characters from the beginning. If `length` is provided,\
    \ it only checks `length` characters from `start`.\n\n### Examples:\n```php\n\
    echo substr_count('abcdef', 'bc');\necho substr_count('abcdef', 'bc', 3);\n```\n\
    \n---\n\n## str_pad()\n\n- **pad_length** – `$integer`, must be positive and greater\
    \ than `strlen($string)`\n- **pad_string** – [optional] `$string` default: `'\
    \ '`\n- **type** – [optional] `$integer` (0, 1, or 2) default: 0 (pad right only),\
    \ 1 (pad left only), 2 (pad both sides)\n\nInserts into `$string` spaces or the\
    \ optional `pad_string` until `$string` is `pad_length` characters long.\n\n###\
    \ Examples:\n```php\n$string = 'Hello';\necho '<pre>'; // So preformatted text\
    \ is shown echo str_pad($string, 7), '|';\n$string = 'Hello';\necho str_pad($string,\
    \ 10, '#', 2);\n```\n### See:\n- `sprintf()` – More complex function designed\
    \ for formatting\n\n---\n\n## str_repeat()\n\n- **string** – `$string`\n- **multiplier**\
    \ – `$integer`\n\nReturns a string with `$string` repeated `multiplier` times.\n\
    \n### Example:\n```php\necho str_repeat('123', 3); // 123123123\n```\n\n---\n\n\
    ## str_shuffle()\n\n- **string** – `$string`\n\nRandomly shuffles the characters\
    \ in a string. A string jumble, essentially.\n\n### Example:\n```php\necho str_shuffle('Hello\
    \ World!'); // reW! ollod\n```\n\n---\n\n## str_split()\n\n- **string** – `$string`\n\
    - **length** – [optional] `$integer`\n\nReturns an array of `$string` separated\
    \ by each character or the optional `length` number of characters.\n\n### Examples:\n\
    ```php\n$array = str_split('Hello');\nprint_r($array);\n$array = str_split('Hello',\
    \ 2);\nprint_r($array);\n```\n**See Also:**\n- `chunk_split()` – Splits a string\
    \ after a specific length with `\\r\\n` and returns a string\n\n---\n\n## str_word_count()\n\
    \n- **option** – [optional] `$integer` (0, 1, or 2) default: 0 (returns: number\
    \ of words). Other values: 1 (returns: array containing all words found), 2 (returns:\
    \ array with position => word)\n- **characters** – [optional] `$string`\n\nCounts\
    \ the number of words inside `$string` and returns that count by default (can\
    \ be altered by `options`). If `characters` is present, it contains any characters\
    \ that should be considered as a letter.\n\n### Examples:\n```php\n$string = 'Welcome\
    \ to the jungle';\necho str_word_count($string);\n$string = 'Welcome to the jun3gle';\n\
    $without = str_word_count($string, 0);\n$withchar = str_word_count($string, 0,\
    \ '3');\necho \"Without: $without, WithChar: $withchar\";\n$string = 'Welcome\
    \ to the jungle';\necho '<pre>'; // Easier readability\n$array = str_word_count($string,\
    \ 1);\nprint_r($array);\n$array = str_word_count($string, 2);\nprint_r($array);\n\
    ```\n\n---\n\n## str_tags()\n\n- **allowed_tags** – [optional] `$string`\n\nRemove\
    \ HTML tags and comments from `$string`. If specific tags should be excluded,\
    \ they can be specified inside `allowed_tags`.\n\n### Examples:\n```php\n$string\
    \ = \"<p>This is a paragraph. </p><strong>Yay!</strong\";\necho str_tags($string),\
    \ str_tags($string, '<p>');\n// HTML Source Code:\necho str_tags($string, '<p>');\n\
    ```\n**See Also:**\n- `htmlspecialchars()` – Convert HTML special characters to\
    \ their entity equivalent\n\n---\n\n## strpos()\n\n- **haystack** – `$string`\n\
    - **needle** – `$string`\n- **start** – [optional] `$integer`\n\nReturns the position\
    \ (number of characters from the beginning of `haystack`) of the first occurrence\
    \ of `needle` in `haystack`. If `start` is included, searching begins after `start`\
    \ number of characters.\n\n**Note:** If `needle` is not found in `haystack`, `FALSE`\
    \ is returned. See tip below.\n\n### Example:\n```php\n$string = 'And now for\
    \ something completely different';\n$needle = 'thing';\necho strpos($string, $needle);\n\
    ```\n**See Also:**\n- `strrpos()` – Finds the last occurrence of `needle` in `haystack`\n\
    - `stripos()` – Finds the first occurrence of `needle` in `haystack`, case insensitive\n"
