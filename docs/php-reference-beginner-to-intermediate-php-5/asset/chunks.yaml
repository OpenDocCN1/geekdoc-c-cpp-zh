    ## Preface


    I taught myself PHP and MySQL and found myself, at times, without internet access
    and thus without search access to the PHP.net manual ([http://www.php.net/manual/en/](http://www.php.net/manual/en/)).
    Since coding was not my primary job, I needed a refresher on syntax, usage, and
    most of all, a reminder of how to code PHP without spending an hour debugging
    a silly mistake. I printed out reference sheets, cards, cheat sheets and tried
    to work off of them exclusively. However, I still found myself needing more than
    would fit on one page of 8.5" x 11" paper front and back. So, off I went to the
    web and the local bookstore. After spending some time with a few books, giving
    them a trial run, I ran into two major problems:


    1. I spent most of the time weeding through extensive tutorials to find the keyword
    and answer I was looking for, sometimes fruitlessly.

    2. Information was biased or surrounded by irrelevant and often confusing code.


    The majority of the book is a collection of functions, their descriptions, example
    code, maybe an extra tip, and some related functions that may be of interest.
    All functions will be presented using the following formatting:


    ![](image_rsrc7MK.jpg)


    1 Boolean is usually used within an expression. While it is also evaluated as
    a variable, output results may vary and are noted within specific functions whenever
    possible.


    ```

    function name(input, [optional input])

    ```


