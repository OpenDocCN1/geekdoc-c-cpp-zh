    ). Since coding was not my primary job, I needed a refresher on syntax, usage,
    and most of all, a reminder of how to code PHP without spending an hour debugging
    a silly mistake. I printed out reference sheets, cards, cheat sheets and tried
    to work off of them exclusively. However, I still found myself needing more than
    would fit on one page of 8.5" x 11" paper front and back. So, off I went to the
    web and the local bookstore. After spending some time with a few books, giving
    them a trial run, I ran into two major problems:


    1.  I spent most of the time weeding through extensive tutorials to find the keyword
    and answer I was looking for, sometimes fruitlessly.


    2.  Information was biased or surrounded by irrelevant and often confusing code
    that did little to explain the what of the function.


    I figured I couldn''t be the only one with this problem, and quickly found out
    that I wasn''t alone thanks to a chance run-in at a local bookstore. Casual PHP
    programmers, sometimes away from the internet, wanting a quick reference book
    that assumes they have some experience with PHP and understood the basics while
    still needing a little clarification sometimes on the details. Therefore, this
    book was born.For this edition, I decided to eliminate some of the more advanced
    aspects of PHP programming: object oriented programming, image manipulation/creation,
    secondary modules, and a few others. Secondarily, items such as mail handling,
    file manipulation, regular expressions, MySQL, sessions, and cookies were balanced
    for complexity and usability, usually excluding the more advanced uses, such as
    streams . Finally, this book is not an exhaustive collection of every PHP function,
    but a majority selection of those appropriate for beginner to intermediate programmers.
    The most common or effective functions are included and some aliases are left
    out to reduce confusion, such as including is_int() and not is_long().A few bits
    of nomenclature should be addressed and provided, to better understand the word/code
    used inside this book. In other words, here are some assumptions made inside this
    book that you should understand:expr – An expression (e.g. $x == 1), including
    boolean$variable – A string, integer, float, array or boolean1$scalar - A string,
    integer, float, or boolean$string – A string variable or its equivalent ( e.g.
    "string" or ''string'' )$array – An array variable or its equivalent ( e.g. array(
    ''one'' , ''two'' , ''three'' ) ) key – Represents the key (integer or string)
    of an array ( e.g. $array[key ] ) value – In relation to an array, represents
    the $variable value ( e.g.array( ''value '') )This book also shows all code using
    procedural PHP and standard syntax. However, you will find many tips will include
    the alternative syntax for control structures as to better allow you, the reader,
    to choose whichever you would prefer. Here is an example of both:// Standard syntax
    if ($x == 1) {echo ''Hello World!'';} else {echo ''Goodbye World!'';}// Alternative
    syntax if ($x == 1):echo ''Hello World!''; else:echo ''Goodbye World!''; endif;Furthermore,
    the use of whitespace and indenting is for clarity and is completely up to your
    preference. Styles vary greatly in the community, so please be aware that the
    use of spaces or whitespace does not directly affect the PHP code.The majority
    of the book is a collection of functions, their descriptions, example code, maybe
    an extra tip, and some related functions that may be of interest. All sample code
    will be accompanied by the sample output, and the output will have a gray background.
    The definition and example section is separated from the extraneous tip section
