  trans: "\n\n要将整个文件读入字符串中，请使用函数 `filesize()`。\n\n```php\n// file.txt contains the\
    \ sentence: Hello World!\n$filename = 'file.txt';\n$file = fopen($filename, 'r');\n\
    $string = fread( $file, filesize($filename) );\nvar_dump($string);\n```\n\n`string(13)\
    \ \"Hello World!\"`\n\n### fwrite( resource , $string [, length ]) \n也称为 `fputs()`。\n\
    \n- `resource` – 包含由 `fopen()` 创建的文件指针的变量名。\n- `length` – [可选] `$integer` 默认：`filesize($string)`\n\
    \n将 `$string` 的内容写入由 `fopen()` 创建的文件 `resource` 中。如果指定了 `length`，则在达到 `length`\
    \ 字节或 `$string` 的末尾时停止写入。\n\n**示例：**\n```php\n$file = fopen('file.txt', 'a');\
    \ // 追加到文件末尾\nfwrite($file, 'Hello World!');\n```\n`string(8) \"Hello Wo\"`\n\n\
    **另见：**\n- `fwrite()` – 写入已打开的文件\n- `fopen()` – 打开文件进行读取、写入或两者结合\n\n### 要将整个文件读入字符串中，请使用函数\
    \ `filesize()`。\n\n```php\n// file.txt contains the sentence: Hello World!\n$filename\
    \ = 'file.txt';\n$file = fopen($filename, 'r');\n$string = fread( $file, filesize($filename)\
    \ );\nvar_dump($string);\n// file.txt now contains at the end: Hello World!\n\
    ```\n\n"
- fmt: '

    ![](image_rsrc81U.jpg)

    Returns an integer containing the length of the file with name/path of `$string`.
    Note: The results are cached. See `clearstatcache()`. Example:


    ![](image_rsrc81V.jpg)

    ```php

    // file.txt contains the word: Hello

    var_dump( filesize(''file.txt'') );

    ```


    ![](image_rsrc81W.jpg)

    `flags` – [optional] `$string` Values:

    - `FILE_USE_INCLUDE_PATH` (search for the file in `include_path`)

    - `FILE_IGNORE_NEW_LINES` (Don''t add `\n` to end of array entries)

    - `FILE_SKIP_EMPTY_LINES` (skip empty lines)


    Reads an entire file with filename `$string` line-by-line into an array, appending
    a newline (`\n`) to the end of each array entry (each entry is a line in the file),
    unless `flags` specifies otherwise.


    Example:

    ```php

    // file.txt contains these tab delimited items

    // Bob owner 34

    // Mark manager 27

    $array = file(''file.txt'');

    ```


    ![](image_rsrc81X.jpg)

    ```php

    echo ''<pre>''; // Preformatted text, for readability

    print_r($array);

    ```


    See Also: `file_get_contents()` – Similar, but returns a string instead of an
    array


    ![](image_rsrc81Y.jpg)

    `flags` – [optional] `$string` Values:

    - `FILE_USE_INCLUDE_PATH` (search for the file in `include_path`)

    - `context` – [optional] Ignore. Set to `NULL` if using `start` or `max_length`

    - `start` – [optional] `$integer` default: 0, beginning of the file

    - `max_length` – [optional] `$integer` default: `filesize($string)`


    Reads an entire file with filename `$string` into a string. Starts at the beginning
    of the file unless `start` is specified, then it starts `start` position into
    the file. If `max_length` is specified, only `max_length` bytes will be read into
    the string.


    Examples:

    ```php

    // file.txt contains these tab delimited items

    // Bob owner 34

    // Mark manager 27

    $string = file_get_contents(''file.txt'');

    ```


    ![](image_rsrc81Z.jpg)

    ```php

    echo ''<pre>''; // Preformatted text, for readability

    var_dump($string);

    $string = file_get_contents(''file.txt'', NULL, NULL, 5, 4);

    echo ''<pre>''; // Preformatted text, for readability

    var_dump($string);

    ```


    ![](image_rsrc820.jpg)

    See Also: `file()` – Similar, but returns an array instead of a string


    ![](image_rsrc821.jpg)

    `input` – `$string` or `$array`

    `flags` – [optional] `$string` Values:

    - `FILE_USE_INCLUDE_PATH` (search for the file in `include_path`)

    - `FILE_APPEND` (if file already exists, append instead of overwriting)

    - `LOCK_EX` (acquire an exclusive lock on the file for writing)


    Equivalent to the combination of `fopen()`, `fwrite()`, and `fclose()`. Writes
    to the file with name/path of `$string` the contents of `input`. If `input` is
    an array, the entry values are combined as if they were one long string without
    a separating character. By default, if the file exists, it will be overwritten
    unless otherwise specified with `flags`. Returns the number of bytes written to
    the file.


    Examples:

    ![](image_rsrc822.jpg)

    ```php

    $input = ''Hello World!'';

    file_put_contents(''file.txt'', $input);

    $input = array(''Hello'', ''World!'');

