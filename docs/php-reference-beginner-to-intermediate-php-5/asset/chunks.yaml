- fmt: "\n```php\n$array = array( 'css', 'php', 'xml', 'html', 'xhtml', 'tutorial'\
    \ );\n$rand_key = array_rand($array);\n$keyword = $array[$rand_key];\n```\n![](image_rsrc7X2.jpg)\n\
    ```php\necho $keyword; // Results will vary\n```\n![](image_rsrc7X3.jpg)\nRandomizes\
    \ the values in `$array`, returning `TRUE` if successful. \n\n**Note:** All keys,\
    \ including associative, are removed and the entire array is reindexed.\n\nExample:\n\
    ```php\n$array = array( 'zero' => 'zero', 'one' => 'one', 'two' => 'two');\nshuffle($array);\
    \ // Results will vary\n```\n![](image_rsrc7X4.jpg)\n```php\nprint_r($array);\n\
    ```\n\nSee Also:\n- `array_rand()` – Returns one or more random keys from an array\n\
    \n![](image_rsrc7X5.jpg)\n### offset\n- `offset` – `$integer`\n- `length` – `[optional]`\
    \ `$integer` default: till end of `$array`\n- `preserve_keys` – `[optional]` `$boolean`\
    \ default: `FALSE`, indexed keys are reindexed\n\nSelects the entries in `$array`\
    \ from the `offset` where a positive offset will skip `offset` number of entries\
    \ from the beginning, while a negative offset will start from `offset` number\
    \ of entries from the end.\n\nIf `length` is specified and positive, it determines\
    \ the maximum number of entries returned from `offset`. If `length` is negative,\
    \ it specifies stopping that many entries from the end of `$array` after `offset`.\n\
    \nBy default, any indexed keys will be reindexed in the returned array of results.\
    \ If `preserve_keys` is set to `TRUE`, the original keys will be represented in\
    \ the result array.\n\nExample:\n```php\n$array = array( 'zero', 'one', 'two',\
    \ 'three', 'four', 'five' );\n```\n![](image_rsrc7X6.jpg)\n```php\n$result_array\
    \ = array_slice($array, 3);\nprint_r($result_array);\n\n$array = array( 'zero',\
    \ 'one', 'two', 'three', 'four', 'five' );\n$result_array = array_slice($array,\
    \ 3, 1);\nprint_r($result_array);\nArray ( [0] => three )\n```\n```php\n$array\
    \ = array( 'zero', 'one', 'two', 'three', 'four', 'five' );\n```\n![](image_rsrc7X7.jpg)\n\
    ```php\n$result_array = array_slice($array, -4, -1, TRUE);\nprint_r($result_array);\n\
    ```\n\n### array_splice($array, offset [, length ] [, replacement ])\n- `offset`\
    \ – `$integer`\n- `length` – `[optional]` `$integer` default: till end of `$array`\n\
    - `replacement` – `[optional]` `$variable`\n\nAlters `$array` based on the `offset`\
    \ and other optional arguments, returning any removed entries in an array and\
    \ replacing them with the optional `replacement`.\n\nIf `offset` is positive,\
    \ the function will skip `offset` number of entries in `$array`. If `offset` is\
    \ negative, it will start `offset` number of entries from the end.\n\nIf `length`\
    \ is specified and positive, it determines the maximum number of entries returned\
    \ from `offset`. If `length` is negative, it specifies stopping that many entries\
    \ from the end of `$array` after `offset`. If `length` is 0, nothing is removed.\n\
    \nWhen `replacement` is specified, removed entries from `$array` are replaced\
    \ with `replacement`. If nothing was removed, the contents of `replacement` are\
    \ inserted into `$array` based on the `offset`.\n\n**Note:** Indexed keys in `$array`\
    \ may be reindexed.\n\n![](image_rsrc7MK.jpg)\nUse `count($array)` to specify\
    \ the end of the array in `offset`.\n\nExamples:\n```php\n$array = array( 'zero',\
    \ 'one', 'two' );\n$result_array = array_splice($array, 1);\nprint_r($array);\n\
    print_r($result_array);\n```\n![](image_rsrc7X8.jpg) (image_rsrc7X9.jpg)\n```php\n\
    $array = array( 'zero', 'one', 'two' );\n$result_array = array_splice($array,\
    \ -2, 1);\nprint_r($array);\nprint_r($result_array);\n```\n![](image_rsrc7XA.jpg)\
    \ (image_rsrc7XB.jpg) (image_rsrc7XC.jpg)\n```php\n$array = array( 'zero', 'one'\
    \ );\narray_splice($array, count($array), 0, 'end');\nprint_r($array);\n\n$array\
    \ = array( 'zero', 'one', 'two' );\narray_splice($array, 2, 0, 'middle');\nprint_r($array);\n\
    ```\n![](image_rsrc7XD.jpg) (image_rsrc7XE.jpg)\n```php\n$array = array( 'zero',\
