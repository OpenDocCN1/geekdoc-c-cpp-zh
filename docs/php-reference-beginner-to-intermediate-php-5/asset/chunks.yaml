    ![](img/image_rsrc83R.jpg) echo session_id();![](img/image_rsrc83S.jpg)delete_old_session
    – [可选] $boolean 默认: FALSE，保持相同 session 生成一个新的 session id，不会丢失 id 以外的当前 session
    信息。如果 `delete_old_session` 设置为 TRUE，则删除旧的关联 session 文件。

