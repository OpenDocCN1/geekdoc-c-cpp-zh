    ## Variable Functions


    The following functions check details about variables themselves, rather than
    addressing a specific aspect of a type of variable. Put another way, you don''t
    want to know what type of elephant you have, just that it is an elephant, and
    it is about to trample you. Too much? Oh well, here we go again.![](image_rsrc7RB.jpg)


    ### Determine whether the $variable is empty.


    Returns TRUE if the `$variable` is:

    * `''''` – Empty `$string`

    * `0` – For an `$integer`

    * `''0''` – For a `$string`

    * `array()` – For an `$array`

    * `NULL`

    * `FALSE`

    * An undeclared variable


    Example:

    ```php

    $string = ''Hello'';

    $array = array();

    ```

    ![](image_rsrc7RC.jpg) ```php

    var_dump( empty($string), empty($array), empty($DoesNotExist) );

    ```

    See Also:`is_null()` – Check whether a variable is `NULL`, `isset()` – Check whether
    a variable has been set/created/declared![](image_rsrc7RD.jpg)


    ### Determine whether the $variable is `NULL`.


    Returns TRUE if it is `NULL`. Note: An undeclared `$variable` will return TRUE
    but may return an error.


    Example:

    ```php

    $string = '''';

    $integer = 0;

    $array = NULL;

    ```

    ![](image_rsrc7RE.jpg) ```php

    var_dump( is_null($string), is_null($integer), is_null($array) );

    ```![](image_rsrc7RF.jpg)


    ### Accepts multiple $variables separated by commas, but will only return TRUE
    if all variables are set.


    Determine whether `$variable` has been set/created/declared.


    Example:

    ```php

    $string = '''';

    $integer = 0;

    var_dump( isset($string,$integer) ); // True because BOTH are set

    echo ''<br />''; // XHTML break for new line

    ```

    ![](image_rsrc7RG.jpg) ```php

    unset($string); // unset or destroy the variable

    var_dump( isset($string), isset($integer) );

    ```

    See Also:`unset()` – Destroy/delete a variable or multiple variables![](image_rsrc7RH.jpg)


    ### Accepts multiple $variables separated by commas.


    Unsets or destroys/deletes the given `$variable`(s). Example:

    ```php

    $string = ''hello'';

    var_dump( isset($string) ); // Check if it is set

    echo ''<br />''; // XHTML break for new line

    unset($string);

    ```

    ![](image_rsrc7RJ.jpg) ```php

    var_dump( isset($string) ); // Check again

    ```

    See Also:`isset()` – Determine whether a variable has been set![](image_rsrc7RK.jpg)


    ### Determine whether the $variable is an array.


    Returns TRUE if it is an array. Example:

    ```php

    $array = array();

    ```

    ![](image_rsrc7RM.jpg) ```php

    $array2 = array( ''one'', ''two'', ''three'' );

    var_dump( is_array($array), is_array($array2) );

    ```![](image_rsrc7RN.jpg)


    ### Also known as: `is_integer()`


    Determine whether the `$variable` is an integer. Returns TRUE if it is an integer.
    Example:

    ```php

    $int = 0;

    $string = ''0'';

    ```

    ![](image_rsrc7RP.jpg) ![](image_rsrc7RR.jpg) ```php

    var_dump( is_int($int), is_int($string) );

    ```


    ### Determine whether the $variable is a string.


    Returns TRUE if it is a string. Example:

    ```php

    $int = 0;

    $string = ''0'';

    ```

    ![](image_rsrc7RS.jpg) ```php

    var_dump( is_string($int), is_string($string) );

    ```![](image_rsrc7RT.jpg)


    ### Determine whether the $variable is an integer or a numeric string (e.g. "12").


    If either is true, it will return TRUE. Example:

    ```php

    $int = 10;

    $string = ''10'';

    ```

    ![](image_rsrc7RU.jpg) ```php

    var_dump( is_numeric($int), is_numeric($string) );

    ```

    See Also:`is_int()` – Determine if a variable is an integer, `is_string()` – Determine
    if a variable is a string.


    ### `var_dump( expr [, ... expr ...])`


    Accepts multiple expressions, separated by commas.

    `expr` – A `$variable` or any expression that generates a result. Shows the type
    of

