  trans: "\n\n## For 循环\n\n`for` 语句的替代语法：\n```\nfor ( expr1 ; expr2 ; expr3 ) // 如果\
    \ expr2 为真，则执行此操作 for;\n```\n\n在 `for` 循环中使用 `continue` 和 `break` 的示例：\n```php\n\
    for ($v=0;$v<=10;$v++){ \n    echo $v;\n    if ($v == 5){ \n        continue;\n\
    \    }\n    if ($v == 8){ \n        break;\n    }\n    echo ',';\n}\n```\n`0,1,2,3,4,56,7,8`\n\
    \n## Foreach 循环\n\n`foreach` 循环遍历数组中的所有项，为值分配一个临时变量名，如果需要，也为键分配名称，以便在循环内部执行的代码中使用它们。\n\
    \n**语法：**\n```php\nforeach($array as $value ){// 执行某些操作}\n// 另一种形式，用于键和值\nforeach\
    \ ($array as $key => $value ){// 执行某些操作}\n```\n\n**示例：**\n```php\n$array = array('John'\
    \ => 20, 'Jane' => 24, 'Joseph' => 28);\nforeach ($array as $value){\n    echo\
    \ \"$value, \"; \n}\nforeach ($array as $name => $age){ \n    echo \"$name - $age\"\
    ;\n    echo '<br />'; // 用于换行的 XHTML 代码\n}\n```\n\n**另需阅读：**\n- 引用传递 – 使用取地址符\
    \ (`&`) 通过 `foreach` 修改数组\n\n## Break 语句\n\n`$integer` – [可选] 指定要跳出的嵌套循环次数。退出并停止当前（默认）`for`、`foreach`、`while`、`do-while`\
    \ 或 `switch` 循环的执行。\n\n**示例：**\n```php\n$counter = 0;\nwhile (1 == 1){ // 将无限运行\n\
    \    while (0 == 0){ // 也会无限运行\n        $counter++; // $counter 加 1 \n       \
    \ echo $counter;\n        if ($counter == 5){ \n            break 2;\n       \
    \ }\n    }\n    echo 'First while loop'; // 因为 break 2; 永远不会显示\n    break; //\
    \ 永远不会运行，但如果执行，将结束第一个 while 循环 \n}\n```\n\n## Continue 语句\n\n`$integer` – [可选]\
    \ 指定要跳过的嵌套循环次数。注意：`$integer` 并不提供跳过的迭代次数，它始终停止当前迭代的继续执行。跳过当前循环迭代的剩余部分，如果适用，则继续循环的下一次迭代。\n\
    \n**示例：**\n```php\nfor ($x=1;$x<=10;$x++){ \n    if ($x == 5){\n        continue;\n\
    \    } // 如果 $x == 5，则 echo 永远不会发生\n    echo $x;\n}\n```\n\n## Return 语句\n\n`$variable`\
    \ – [可选] 从函数返回的变量。如果作为普通脚本的一部分而不是函数的一部分，它的作用与 `exit()` 或 `die()` 相同。`Return` 更常用作函数的一部分，将函数的执行结果赋值回原始函数调用处。\n\
    \n**另需阅读：**\n- 函数 – 提供了作为函数一部分返回 `$variable` 的示例\n\n## 文件函数\n\n`exit()` – 立即终止当前脚本。\n\
    \n`include` - `$string` 作为当前脚本/页面的一部分包含并评估文件。这是存储通用变量、函数或会被多个脚本/页面包含的 HTML 行的简单方法。函数失败将生成错误。\n\
    **示例：**\n```php\ninclude('somefile.inc');\n```\n在 `switch` 的情况下，`continue` 的效果与\
    \ `break` 相同。函数应该只包含一次。考虑使用 `include_once()` 或 `require_once()`。\n\n`include_once`\
    \ - `$string` 作为当前脚本/页面的一部分包含并评估文件。如果文件已经包含，将忽略该请求。这是存储通用变量、函数或会被多个脚本/页面包含的 HTML\
    \ 行的简单方法。函数失败将生成错误并立即终止脚本。\n**示例：**\n```php\ninclude_once('somefile.php');\n```\n\
    \n`require` - `$string` 作为当前脚本/页面的一部分包含并评估文件。这是存储通用变量、函数或会被多个脚本/页面包含的 HTML 行的简单方法。函数失败将生成错误。\n\
    **示例：**\n```php\nrequire('somefile.htm');\n```\n\n`require_once` - `$string` 作为当前脚本/页面的一部分包含并评估文件。如果文件已经包含，将忽略该请求。这是存储通用变量、函数或会被多个脚本/页面包含的\
    \ HTML 行的简单方法。函数失败将生成错误并立即终止脚本。\n**示例：**\n```php\nrequire_once('somefile.php');\n\
    ``` 函数应该只包含一次。考虑使用 `require_once()`。\n\n## 全局变量\n\n虽然某些全局变量可以通过使用 `define()` 创建，但某些变量由于特殊函数而被预留，提供了访问不同类型数据的权限。下面列出的所有全局变量都是数组，可能包含也包含数据，取决于当前脚本和环境。\n\
    \n- `$_SERVER`\n- `$_SERVER['HTTP_USER_AGENT']` – 头部中的浏览器描述\n  `[HTTP_USER_AGENT]\
    \ => Mozilla/5.0 (X11; U; Linux i686; en-US; rv: 1.8.12) Gecko/20080207 Ubuntu/7.10\
    \ (gutsy) Firefox/2.0.12`\n- `$_SERVER['HTTP_REFERER']` – 引导用户的页面地址\n  `[HTTP_REFERER]\
    \ => http://www.example.com/index.htm`\n- `$_SERVER['REMOTE_ADDR']` – 客户端 IP 地址\n\
    \  `[REMOTE_ADDR] => 127.0.0.1`\n- `$_SERVER['DOCUMENT_ROOT']` – 当前脚本的系统根位置\n\
    \  `[DOCUMENT_ROOT] => /opt/lampp/htdocs`\n- `$_SERVER['SCRIPT_FILENAME']` – 当前脚本的绝对路径\n\
    \  `[SCRIPT_FILENAME] => /opt/lampp/htdocs/test.php`\n- `$_SERVER['REQUEST_URI']`\
    \ – 页面的统一资源标识符\n  `[REQUEST_URI] => /test.php?test=value`\n- `$_SERVER['SCRIPT_NAME']`\
    \ – 当前脚本路径\n  `[SCRIPT_NAME] => /test.php`\n- `$_SERVER['QUERY_STRING']` – 当前查询字符串\n\
    \  `[QUERY_STRING] => test=value`\n- `$_SERVER['PHP_SELF']` – 相对于根的当前脚本名称\n  `[PHP_SELF]\
    \ => /test.php`\n\n当向包含表单的相同页面/文件提交表单时，可以使用 `$_SERVER['PHP_SELF']` 变量动态提供位置。\n\
    \n```html\n<form method=\"POST\" action=\"<?php echo $SERVER['PHP_SELF']; ?>\"\
    >\n```\n\n```html\n<form method=\"POST\" action=\"filename.php\">\n```\n\n"
