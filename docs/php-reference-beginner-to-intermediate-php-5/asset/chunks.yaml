- fmt: "\n# String Functions\n\nIf you were a cat, string functions would be the cat's\
    \ meow, all puns intended. Besides being a large part of your PHP code, they provide\
    \ much of the functionality to identify and alter your data into other formats,\
    \ such as arrays.\n\n![](image_rsrc7RX.jpg)\n\n## addslashes()\n\nAdds backslashes\
    \ (escape string) to items within `$string` to make it safe for database queries.\
    \ Effects single quotes (`'`), double quotes (`\"`), backslashes (`\\`), and the\
    \ NUL byte. \n\n**Example:**\n```php\n$string = ' Tom said, \"Marcus is mad!\"\
    '; echo $string;\n```\n![](image_rsrc7RY.jpg)\n```php\n$string = addslashes($string);\
    \ echo $string;\n```\n\n**See Also:**\n- `get_magic_quotes_gpc` – Server setting\
    \ for automatically applying `addslashes` to `GET/POST/COOKIE` data\n- `stripslashes()`\
    \ – Remove the backslashes created by `addslashes()`\n\n## stripslashes()\n\n\
    Removes backslashes (escape string) from items within `$string` added through\
    \ `addslashes()` or `magic_quotes_gpc`.\n\n**Example:**\n```php\n$string = ' Tom\
    \ said, \"Marcus is mad!\"';\n$string = addslashes($string); echo $string;\n```\n\
    ![](image_rsrc7S0.jpg)\n```php\n$string = stripslashes($string); echo $string;\n\
    ```\n\n**See Also:**\n- `get_magic_quotes_gpc` – Server setting for automatically\
    \ applying `addslashes` to `GET/POST/COOKIE` data\n\n## chunk_split()\n\nAdds\
    \ backslashes to make a string safe for database queries.\n\n`chunk_split($string\
    \ [, length ] [, endstring ])`\n\n- `length` – [optional] `$integer` default :\
    \ `76`\n- `endstring` – [optional] `$string` default : `\"\\r\\n\"` (carriage\
    \ return and new line)\n\nSplits `$string` into sections of `length` characters,\
    \ every section is terminated with the `endstring`. Evaluates only the character\
    \ length to generate the resulting string.\n\n**Example:**\n```php\n$string =\
    \ 'Hello Nurse!';\n$string = chunk_split($string, 3); var_dump($string);\n```\n\
    ![](image_rsrc7S1.jpg)\n```php\necho nl2br($string); // Converts \\n to the XHTML\
    \ <br />\necho 'Notice I am on a new line?';\n```\nHTML source code:\n![](image_rsrc7S2.jpg)\n\
    \n**See Also:**\n- `nl2br()` – Convert instances of `\\n` into the XHTML `<br\
    \ />` line break\n- `str_replace()` – Replace specified characters in a string\n\
    - `wordwrap()` – Similar to `chunk_split()`, but with some minor variations\n\n\
    | The `\\r\\n` are formatting characters, which are ignored in HTML if part of\
    \ the standard output. If placed within `<textarea>` or `<pre>` (preformatted)\
    \ tags, they are evaluated properly in the browser's output. |\n\n```php\n$string\
    \ = 'Hello Nurse!';\n$string = chunk_split($string, 3); echo '<pre>';\n```\n![](image_rsrc7S3.jpg)\n\
    ```php\necho $string; echo '</pre>';\n```\n\n## wordwrap()\n\n`wordwrap($string\
    \ [, length ] [, breakstring ] [, wordcut ])`\n\n- `length` – [optional] `$integer`\
    \ default : `75`\n- `breakstring` – [optional] `$string` default : `\"\\n\"` (new\
    \ line)\n- `wordcut` – [optional] `$boolean` default : `FALSE`, words are not\
    \ broken up\n\nSplits `$string` into sections of `length` characters with the\
    \ `breakstring`. If `wordcut` is set to `TRUE`, words longer than the specified\
    \ length will be split, ensuring the exact width.\n\n**Examples:**\n```php\n$origstring\
    \ = 'I said to her, Hellooooo Nurse!!!';\n$string = wordwrap($origstring, 8);\n\
    ```\n![](image_rsrc7S4.jpg)\n```php\necho nl2br($string); // Converts \\n to the\
    \ XHTML <br />\n$origstring = 'I said to her, Hellooooo Nurse!!!';\n```\n![](image_rsrc7S5.jpg)\n\
    ```php\n$string = wordwrap($origstring, 8, \"<BR \\>\\n\", TRUE); echo $string;\n\
    ```\n\n**See Also:**\n- `nl2br()` – Convert instances of `\\n` into the XHTML\
    \ `<br />` line break\n- `str_replace()` – Replace specified characters in a string\n\
    - `chunk_split()` – Similar to `wordwrap()`, but with some minor variations\n\n\
    | For standards compliance, sending text based email with the mail() command should\
    \ have the message parsed with `wordwrap()` prior to being supplied to `mail()`.\
    \ |\n\n![](image_rsrc7S6.jpg)\n\n## count_chars()\n\n`mode` – [optional] `$integer`\
    \ (0, 1, 2, 3, or 4) default: `0`\n\n**Values:**\n- `0` – Returns an array with\
    \ the count for all characters\n- `1` – Returns an array with the count for all\
    \ characters with at least one instance in `$string`\n- `2` – Returns an array\
    \ with the count for all characters with zero instances\n- `3` – Returns a string\
    \ of all characters contained within `$string`\n- `4` – Returns a string of all\
    \ characters not contained within `$string`\n\nChecks `$string` for instances\
    \ of all ASCII characters and counts the number of times that a character is included\
    \ within the string. Output varies depending on `mode`.\n\n**Note:** The key in\
    \ the array is the ASCII byte-value of the character (modes 0-2) while the string\
    \ output is the characters themselves (modes 3 and 4).\n\n**Examples:**\n```php\n\
    $string = 'Hello';\n$array = count_chars($string, 1);\n```\n![](image_rsrc7S7.jpg)\n\
    ```php\necho '<pre>'; // Not required, included for easier readability\nprint_r($array);\n\
    foreach ($array as $key => $value){\n  $char = chr($key); // Character represented\
    \ by the byte-value\n  $chararray[$char] = $value; // Make new array with characters\n\
    }\n```\n![](image_rsrc7S8.jpg)\n```php\nprint_r($chararray);\n$usedcharacters\
    \ = count_chars($string, 3); var_dump($usedcharacters);\n```\n![](image_rsrc7S9.jpg)\n\
    \n**See Also:**\n- `chr()` – Get the ASCII character represented by its byte-value\n\
    \n`chr($integer)`\n`$integer` – 0 - 255 Returns the single character representation\
    \ of the ASCII byte-value\n\n`explode( delimiter , $string [, limit ])`\n\n- `delimiter`\
    \ – `$string`, if set to '', explode will return `FALSE`\n- `limit` – [optional]\
    \ `$integer`, default: no limit Returns an array of strings created by searching\
    \ through `$string` and separating it using the provided delimiter as the separation\
    \ point. Limit sets the maximum number of elements, with the last element of the\
    \ array being the remainder of the string.\n\n`boolean` is represented by 1 (TRUE)\
    \ or nothing (FALSE) while floats may be displayed as integers at greater than\
    \ e6. If `limit` is negative, all values are returned except the last limit number\
    \ of them.\n\n**Example:**\n```php\n$explodeme = '02-01-1980';\n$array = explode('-',\
    \ $explodeme); // dash (-) is the delimiter\necho '<pre>'; // For easier readability\n\
    ```\n![](image_rsrc7SA.jpg)\n```php\nprint_r($array);\n$array = explode('-', $explodeme,\
    \ 2); // Limit to 2 elements\nprint_r($array);\n```\n![](image_rsrc7SB.jpg)\n\n\
    | As shown above, explode can be used to break apart common language syntax, such\
    \ as separating a paragraph submitted by a user into its individual sentences,\
    \ or allowing a user to submit tags for a particular item, separated by commas,\
    \ and then explode() those items for database storage. |\n"
