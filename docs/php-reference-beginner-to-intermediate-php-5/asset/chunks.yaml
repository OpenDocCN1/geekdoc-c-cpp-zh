    ![](image_rsrc83R.jpg) echo session_id();![](image_rsrc83S.jpg)delete_old_session
    – [optional] $boolean default: FALSE, keep the same sessionGenerates a new session
    id, without losing any of the current session information other than the id. If
    `delete_old_session` is set to TRUE, the old associated session file is deleted.

    Example:

    ```php

    session_start();

    echo session_id() . '' || ''; session_regenerate_id(); echo session_id();

