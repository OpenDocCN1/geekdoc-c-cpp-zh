- fmt: "\n# If you want to know how long it took to complete a script, for instance\
    \ when comparing two different functions to see which is faster, you can use `microtime()`\
    \ to track the efficiency.\n\n```php\n$start = microtime(1);\n// Do something\
    \ here\n$end = microtime(1);\n$lengthoftime = number_format($end - $start, 6);\n\
    echo \"It took $lengthoftime seconds to run this script.\";\n```\n\nIt took 0.000005\
    \ seconds to run this script.\n\n## strtotime\n\n`strtotime($string [, timestamp\
    \ ])` \n`timestamp` – [optional] `$integer` default: `time()`\n\nReturns the Unix\
    \ timestamp based on the interpretation of the date/time in `$string`, which is\
    \ a common language format of the date/time. If `$string` is a relative input\
    \ format that refers to a date (e.g. 'last month'), the current date/time is used\
    \ unless the optional `timestamp` is supplied. Returns `FALSE` if `$string` is\
    \ not valid and the function fails.\n\n### Examples\n```php\n$result = strtotime('December\
    \ 8th, 1941'); echo $result;\necho '<br />'; // XHTML line break\necho date('r',\
    \ $result);\n$result = strtotime('26apr86'); echo date('r', $result); // Sat,\
    \ 26 Apr 1986 00:00:00 -0700\n$result = strtotime('20010911 08:45:00'); echo date('r',\
    \ $result); // Tue, 11 Sep 2001 08:45:00 -0600\n```\n\n### Relative $string examples\n\
    ```php\n$result = strtotime('last week'); // This time, last week\necho date('r',\
    \ $result); // Mon, 10 Mar 2008 14:31:54 -0600\n$date = mktime(8,45,00,9,11,2001);\
    \ // Sept. 11, 2001 8:45am\n$result = strtotime('next week', $date); echo date('r',\
    \ $result); // Tue, 18 Sep 2001 08:45:00 -0600\n$date = mktime(8,45,00,9,11,2001);\
    \ // Sept. 11, 2001 8:45am\n$result = strtotime('+2 friday', $date); echo date('r',\
    \ $result); // Fri, 21 Sep 2001 00:00:00 -0600\n$result = strtotime('1 hour ago');\
    \ echo date('r', $result); // Mon, 17 Mar 2008 13:36:54 -0600\n$result = strtotime('yesterday\
    \ 3am'); echo date('r', $result); // Sun, 16 Mar 2008 03:00:00 -0600\n$result\
    \ = strtotime('7am 4 days ago'); echo date('r', $result); // Thu, 13 Mar 2008\
    \ 07:00:00 -0600\n```\n\nThere are many more examples. Please see the following\
    \ websites:\n- [http://www.gnu.org/software/tar/manual/html_node/tar_113.html](http://www.gnu.org/software/tar/manual/html_node/tar_113.html)\n\
    - [http://www.phpdig.net/ref/rn13re206.html](http://www.phpdig.net/ref/rn13re206.html)\n\
    \nSee Also: `date()` – Convert the Unix timestamp to a more human readable format\n\
    \nThe power of this function is not only to convert common language into something\
    \ usable without an endless string of regular expressions, but also when working\
    \ with relative dates and times. If pulling data from a database using MySQL queries\
    \ to generate a report of all calls in the previous week (Monday through Friday),\
    \ you would have to go through a lot of calculations to figure out what day it\
    \ is today, then based on that figure out what the date was on Monday, then submit\
    \ the proper query. With this function, you can quickly find the two dates without\
    \ the extra math, it's done for you!\n"
