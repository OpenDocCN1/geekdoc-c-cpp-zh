    Clear the system cache of certain information gathered about files by specific
    functions, listed below. Used when a file is being altered and reevaluated within
    the same script/page. Effects the following functions: `file_exists()`, `is_writable()`,
    `is_readable()`, `is_file()`, `is_dir()`, `fileatime()`, `filemtime()`, `filesize()`,
    `stat()`, `lstat()`, `is_executable()`, `is_link()`, `filectime()`, `fileinode()`,
    `filegroup()`, `fileowner()`, and `fileperms()`. Note: If a file does not exist,
    PHP does not cache anything. See examples. Examples:


