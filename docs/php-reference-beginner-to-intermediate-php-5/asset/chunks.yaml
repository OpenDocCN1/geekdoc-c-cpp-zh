  trans: "\n\n# printf( formatting , inputs [, ... inputs ... ] )\n\n接受多个输入，并在 `formatting`\
    \ 中指定时使用。\n\n- `formatting` – `$string`，特定的格式化字符串。术语名称请参见 `sprintf()`。\n- `inputs`\
    \ – 需要格式化的 `$scalar(s)`。\n\n使用 `inputs` 打印一个格式化字符串 `formatting`，通过一组预设的规则将值动态地输入到格式化字符串中。\n\
    \n**注意：** 有关格式化字符串的规则请参见 `sprintf()`。\n\n示例：\n```php\n$string = 'puppies';\nprintf(\"\
    I think %s are cute.\", $string);\n```\n![](img/image_rsrc7SK.jpg)\n\n**另见：**\
    \ `sprintf()` – 返回格式化后的字符串，解释了规则/术语。\n\n# sscanf( $string, format [, ... outputs\
    \ ] )\n\n接受多个[可选]输出，但它会改变函数的行为。\n\n检查给定的 `$string` 并根据预期的格式对其进行解析。当未包含输出时，返回一个数组。如果包含了输出，则通过引用指定用于赋值格式化内容的变量名。\n\
    \n**注意：** 有关格式化字符串的规则——类型说明符请参见 `sprintf()`。\n\n示例：\n```php\n$string = '12/1/1980';\n\
    $array = sscanf($string, \"%d/%d/%d\");\necho '<pre>'; // 为了提高可读性\nprint_r($array);\n\
    ```\n![](img/image_rsrc7SN.jpg)\n\n```php\n$string = '12/1/1980';\n$outputs_count\
    \ = sscanf($string, \"%d/%d/%d\", $month, $day, $year);\nvar_dump ($month, $day,\
    \ $year);\n```\n![](img/image_rsrc7SP.jpg)\n\n**另见：**\n- `sprintf()` – `sscanf()`\
    \ 的反向，并提供了格式化字符串的解释。\n- `list()` – 将数组的值赋值给变量。\n\n# list( $string [, quotes_flag\
    \ ] [, character_set ] )\n\n- `quotes_flag` – [可选] `$string` 默认值：`ENT_COMPAT`（仅双引号）。其他值：\n\
    \    - `ENT_QUOTES`（单双引号均包含）\n    - `ENT_NOQUOTES`（单双引号均不包含）\n- `character_set`\
    \ – [可选] `$string` 默认值：`ISO-8859-1`\n\n将 `$string` 中某些具有 HTML 特殊含义的字符转换为安全的 HTML\
    \ 实体。这包括（但可能限于某些可选的 `flags`）：双引号（`\"`）、单引号（`'`）、大于（>`）、小于（`<`）和和（`&`）。\n\n示例：\n\
    ```php\n$string = '<strong>Hello & World!</strong><br />';\necho htmlspecialchars($string);\n\
    ```\n![](img/image_rsrc7SS.jpg)\nHTML 源代码：\n\n**另见：**\n- `htmlspecialchars_decode()`\
    \ – 取消 `htmlspecialchars()` 的效果。\n- `htmlentities()` – 所有 HTML 实体，而不只是上述五个。\n\n\
    # htmlspecialchars_decode( $string [, quotes_flag ] [, character_set ] )\n\n-\
    \ `quotes_flag` – [可选] `$string` 默认值：`ENT_COMPAT`（仅双引号）。其他值：\n    - `ENT_QUOTES`（单双引号均包含）\n\
    \    - `ENT_NOQUOTES`（单双引号均不包含）\n- `character_set` – [可选] `$string` 默认值：`ISO-8859-1`\n\
    \n将 `$string` 中的 HTML 实体转换回字符表示。这包括（但可能限于某些可选的 `flags`）：双引号（`\"`）、单引号（`'`）、大于（>`）、小于（`<`）和和（`&`）。\n\
    \n示例：\n```php\n$string = '&lt;strong&gt;Hello &amp; World!';\necho htmlspecialchars_decode($string);\n\
    ```\n![](img/image_rsrc7SU.jpg)\nHTML 源代码：\n\n**另见：**\n- `htmlspecialchars()`\
    \ – 将上述五项转换为 HTML 实体。\n- `html_entity_decode()` – 所有 HTML 实体，而不只是上述五个。\n\n# htmlentities(\
    \ $string [, quotes_flag ] [, character_set ] )\n\n- `quotes_flag` – [可选] `$string`\
    \ 默认值：`ENT_COMPAT`（仅双引号）。其他值：\n    - `ENT_QUOTES`（单双引号均包含）\n    - `ENT_NOQUOTES`（单双引号均不包含）\n\
    - `character_set` – [可选] `$string` 默认值：`ISO-8859-1`\n\n将 `$string` 中某些具有 HTML\
    \ 特殊含义的字符转换为安全的 HTML 实体。\n\n示例：\n```php\n$string = \"<strong>'Hello World!'\"\
    ;\necho htmlentities($string, ENT_QUOTES);\n```\nHTML 源代码：`&lt;strong&gt;&#039;Hello\
    \ World!&#039;`\n\n**另见：**\n- `html_entity_decode()` – 取消 `htmlentities()` 的效果。\n\
    - `htmlspecialchars()` – 仅五个特定的 HTML 实体。\n\n# html_entity_decode( $string [, quotes_flag\
    \ ] [, character_set ] )\n\n- `quotes_flag` – [可选] `$string` 默认值：`ENT_COMPAT`（仅双引号）。其他值：\n\
    \    - `ENT_QUOTES`（单双引号均包含）\n    - `ENT_NOQUOTES`（单双引号均不包含）\n- `character_set`\
    \ – [可选] `$string` 默认值：`ISO-8859-1`\n\n将 `$string` 中的所有 HTML 实体转换回字符表示。\n\n示例：\n\
    ```php\n$string = '&lt;strong&gt;&#039;Hello World!&#039;';\necho html_entity_decode($string);\
    \ // 单引号未转换\n```\nHTML 源代码：`<strong>&#39;Hello World!&#39;`\n\n**另见：**\n- `htmlentities()`\
    \ – 所有 HTML 实体。\n- `htmlspecialchars_decode()` – 解码五个特定的 HTML 实体。\n\n# trim( $string\
    \ [, characters ] )\n\n- `characters` – [可选] `$string`\n\n当不包含 `characters` 时，从\
    \ `$string` 的开头和结尾移除以下字符：空格（` `）、制表符（`\\t`）、换行（`\\n`）、回车（`\\r`）、NUL 字节（`\\0`）和垂直制表符（`\\\
    x0B`）。如果包含了 `characters`，则使用该列表。\n\n**注意：** 一旦遇到列表之外的字符，将停止修剪。\n\n示例：\n```php\n\
    $string = \" \\n Hello World!\";\ntrim($string);\n```\n![](img/image_rsrc7SN.jpg)\n\
    \n在 `characters` 包含 `$string`。\n\n示例：\n```php\n$string = \" \\n Hello World!\"\
    ;\ntrim($string); // Hello World!\n```\n```php\ntrim($string, \" \\t\"); // 只有\
    \ r\n```\n**另见：**\n- `ltrim()` – 字符串的开头。\n- `rtrim()` – 字符串的结尾。\n\n# ltrim( $string\
    \ [, characters ] )\n\n- `characters` – [可选] `$string`\n\n当不包含 `characters` 时，从\
    \ `$string` 的开头移除以下字符：空格（` `）、制表符（`\\t`）、换行（`\\n`）、回车（`\\r`）、NUL 字节（`\\0`）和垂直制表符（`\\\
    x0B`）。如果包含了 `characters`，则使用该列表。\n\n**注意：** 一旦遇到列表之外的字符，将停止修剪。\n\n示例：\n```php\n\
    $string = \" \\n Hello World!\";\nltrim($string); // Hello World!\n```\n```php\n\
    ltrim($string, \" \\t\"); // 只有 r\n```\n**另见：**\n- `trim()` – 开头和结尾。\n- `rtrim()`\
    \ – 字符串的结尾。\n\n# rtrim( $string [, characters ] )\n\n- `characters` – [可选] `$string`\n\
    \n当不包含 `characters` 时，从 `$string` 的结尾移除以下字符：空格（` `）、制表符（`\\t`）、换行（`\\n`）、回车（`\\\
    r`）、NUL 字节（`\\0`）和垂直制表符（`\\x0B`）。如果包含了 `characters`，则使用该列表。\n\n**注意：** 一旦遇到列表之外的字符，将停止修剪。\n\
    \n示例：\n```php\n$string = \" Hello World! \\n\";\nrtrim($string); // Hello World!\n\
    ```\n```php\nrtrim($string, \" \\t\"); // 只有 r\n```\n**另见：**\n- `ltrim()` – 字符串的开头。\n\
    - `trim()` – 开头和结尾。\n\n"
- fmt: "\n# Password Security and Salt\n\nFor better security in storing user passwords,\
    \ the use of a salt should be considered. The salt is basically a string added\
    \ onto the supplied `$string` to increase its length and complexity. In the case\
    \ of user passwords, it would be randomly created by the system then saved to\
    \ the database as a separate entry in the database from the password for that\
    \ user. This helps protect against reverse `md5` dictionary attacks.\n\n```php\n\
    $password = 'password'; // Very bad password\n$salt = substr(md5(uniqid(mt_rand(),\
    \ TRUE)), 0, 5); // 5 char. salt\n$salted_password_hash = md5($salt . md5($password));\
    \ \necho $salted_password_hash; // Output varies\n```\n\n`d1239dcc6e017572ea6fed5df0d6e07e`\n\
    \n## Hashing Functions\n\n### md5_file\n- `filename` – `$string`\n- `raw_flag`\
    \ – [optional] `$boolean` default: `FALSE`, 32-character hexadecimal\n\nGenerates\
    \ the `MD5` hash of a file with `filename`. If the `raw_flag` is set to `TRUE`,\
    \ it returns a raw binary format with a length of 16 characters.\n\n**Example:**\n\
    ```php\n$hash = md5_file('somefile.txt');\n```\n**See Also:** `md5()` – MD5 algorithm\
    \ based encryption for a string.\n\n### sha1\n- `raw_flag` – [optional] `$boolean`\
    \ default: `FALSE`, 40-character hexadecimal\n\nPerforms a one-way hashing encryption\
    \ on `$string` using the US Secure Hash Algorithm. If the `raw_flag` is set to\
    \ `TRUE`, it returns a raw binary format with a length of 20.\n\n**Example:**\n\
    ```php\n$password = 'mypassword'; \necho sha1($password);\n```\n**See Also:**\
    \ `md5()` – MD5 algorithm based encryption, commonly used.\n\nPlease see `md5()`\
    \ tip for adding a salt to a password for extra security.\n\n### sha1_file\n-\
    \ `filename` – `$string`\n- `raw_flag` – [optional] `$boolean` default: `FALSE`,\
    \ 40-character hexadecimal\n\nGenerates the `Sha1` hash of a file with `filename`.\
    \ If the `raw_flag` is set to `TRUE`, it returns a raw binary format with a length\
    \ of 20.\n\n**Example:**\n```php\n$hash = sha1_file('somefile.txt');\n```\n**See\
    \ Also:** `sha1()` – Sha1 algorithm based encryption for a string.\n\n### number_format\n\
    - `decimals` – [optional] `$integer` default: `0`, no decimal places\n- `decimal_point`\
    \ – [optional] `$string` default: period ( `.` )\n- `thousand_separator` – [optional]\
    \ `$string` default: comma ( `,` )\n\nFormat the `$float` with thousand separating\
    \ and decimal places, if specified.\nNote: Rounding occurs if the float has more\
    \ values than the formatting specifies.\n\n**Examples:**\n```php\n$float = 1234567.891;\n\
    echo number_format($float);\necho number_format($float, 2); // US notation\necho\
    \ number_format($float, 2, \",\", \" \"); // French formatting\n```\n\n### nl2br\n\
    - `string` – `$string`\n\nReplaces all instances of the new line ( `\\n` ) formatting\
    \ character in `$string` with the XHTML line break `<br />`.\n\n**Example:**\n\
    ```php\n$string = \"Hello\\nWorld\"; \necho nl2br($string);\n```\n\n### parse_str\n\
    Examines `$string` as a query string and assigns the variables with names equal\
    \ to the query's key, then assigning values equal to the query's value. If `$array`\
    \ was specified, query variables will be assigned to an array instead with the\
    \ same key => value association.\nNote: Output is affected by the `magic_quotes_gpc`\
    \ setting the same as `$_GET`.\n\n**Examples:**\n```php\n$query_string = 'key=value&color=red';\
    \ \nparse_str($query_string);\necho \"\\$key equals $key, and \\$color equals\
    \ $color\";\n\n$query_string = \"key=value&color='red'\"; \nparse_str($query_string,\
    \ $array);\necho '<pre>'; // For easier readability \nprint_r($array);\n```\n\
    - Without `magic_quotes_gpc` enabled.\n- With `magic_quotes_gpc` enabled.\n\n\
    **See Also:** `get_magic_quotes_gpc()` – Check if magic quotes is enabled; `list()`\
    \ – Assign contents of an array to variables.\n\nThis is a handy way to easily\
    \ convert all the query submitted keys/values from `$_SERVER['QUERY_STRING']`\
    \ into variables using the following:\n```php\nparse_str($_SERVER['QUERY_STRING']);\n\
    ```\n"
