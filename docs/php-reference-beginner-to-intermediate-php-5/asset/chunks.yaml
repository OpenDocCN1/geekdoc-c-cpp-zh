    # `strrpos( haystack , needle [, start ])`


    `haystack` – `$string`

    `needle` – `$string`

    `start` – [optional] `$integer`


    Returns the position (number of characters from the beginning of `haystack` )
    of the last occurrence of `needle` in `haystack`. If `start` is included and is
    a positive integer, searching begins after `start` number of characters; if negative,
    it stops searching `start` number of characters from the end of the string.


    Note: If `needle` is not found in `haystack`, `FALSE` is returned. See `strpos()`
    for tip.


    **Example:**

    ```php

    $string = ''hello'';

    $needle = ''l'';

    echo strpos($string, $needle); // Search for first occurrence

    echo ''<br />''; // XHTML line break

    echo strrpos($string, $needle); // Search for last occurrence

    ```


    **See Also:**

    - `strpos()` – Finds the first occurrence of `needle` in `haystack`

    - `strripos()` – Finds the last occurrence of `needle` in `haystack`, case insensitive


    ---


    # `strripos()`


    `haystack` – `$string`

    `needle` – `$string`

    `start` – [optional] `$integer`


    Returns the position (number of characters from the beginning of `haystack` )
    of the first occurrence of `needle` in `haystack`, case insensitive. If `start`
    is included, searching begins after `start` number of characters.


    Note: If `needle` is not found in `haystack`, `FALSE` is returned. See `strpos()`
    for tip.


    **Example:**

    ```php

    $string = ''And now for something completely different'';

    $needle = ''NOW'';

    echo stripos($string, $needle);

    ```


    **See Also:**

    - `strripos()` – Finds the last occurrence of `needle` in `haystack`, case insensitive

    - `strpos()` – Finds the first occurrence of `needle` in `haystack`, case sensitive


    ---


    # `strrpos()`


    `haystack` – `$string`

    `needle` – `$string`

    `start` – [optional] `$integer`


    Returns the position (number of characters from the beginning of `haystack` )
    of the last occurrence of `needle` in `haystack`, case insensitive. If `start`
    is included and is a positive integer, searching begins after `start` number of
    characters; if negative, it stops searching `start` number of characters from
    the end of the string.


    Note: If `needle` is not found in `haystack`, `FALSE` is returned. See `strpos()`
    for tip.


    **Example:**

    ```php

    $string = ''hello'';

    $needle = ''L'';

    echo strrpos($string, $needle); // Search for last occurrence

    ```


    **See Also:**

    - `strrpos()` – Finds the last occurrence of `needle` in `haystack`, case sensitive

    - `stripos()` – Finds the first occurrence of `needle` in `haystack`, case insensitive


    ---


    # `strpos()`


    `haystack` – `$string`

    `needle` – `$string`


    Find if `needle` is found in `haystack` and returns the first occurrence of `needle`
    to the end of `haystack`.


    Note: If `needle` is not found in `haystack`, `FALSE` is returned.


    **Example:**

    ```php

    $string = ''www.example.com'';

    $needle = ''example'';

    echo strstr($string, $needle);

    ```


    **See Also:**

    - `stristr()` – case insensitive version of `strstr()`


    ---


    # `strstr()`


    `haystack` – `$string`

    `needle` – `$string`


    Finds if `needle` is found in `haystack` and returns the first occurrence of `needle`
    to the end of `haystack`, case insensitive.


    Note: If `needle` is not found in `haystack`, `FALSE` is returned.


    **Example:**

    ```php

    $string = ''www.example.com'';

    $needle = ''EXAMPLE'';

    echo stristr($string, $needle);

    ```


    **See Also:**

    - `strstr()` – case sensitive version of `stristr()`


    ---


    # `strlen()`


    The length of `$string`, or 0 if it is empty.


    **Example:**

    ```php

    $string = ''Hello!'';

    echo strlen($string);

    ```


    ---


    # `strtolower()`


    Converts all characters in `$string` to lowercase and returns the new string.


    **Example:**

    ```php

    $string = ''Mario Lurig'';

    echo strtolower($string);

    ```


    ---


    # `strtoupper()`


    Converts all characters in `$string` to uppercase and returns the new string.


    **Example:**

    ```php

    $string = ''Mario Lurig'';

    echo strtoupper($string);

    ```


    ---


    # `ucfirst()`


    Converts the first character in `$string` to uppercase and returns the new string.


    **Example:**

    ```php

    $string = ''i wish i had some capitalization'';

    echo ucfirst($string);

    ```


    ---


    # `ucwords()`


    Converts the first alphabetic characters of words in `$string` to uppercase and
    returns the new string.


    **Example:**

    ```php

    $string = ''i wish i had 3three some capitalization'';

    echo ucwords($string);

    ```


    ---


    # `strpbrk()`


    `haystack` – `$string`

    `characters` – `$string`


    Find if any of the characters in `needle` are found in `haystack` and returns
    the first occurrence of the character found in `needle` to the end of `haystack`.


    Note: If `needle` is not found in `haystack`, `FALSE` is returned.


    **Example:**

    ```php

    $string = '' [www.example.com/index.htm'';

    $needle = ''./c'';

    echo strpbrk($string, $needle); // Finds the period (.) first

    ```


    **See Also:**

    - `strstr()` – Same as `strpbrk()` but searches for a string instead of characters


    ---


    # `strrev()`


    Reverses a string.


    **Example:**

    ```php

    echo strrev(''hello world'');

    ```


