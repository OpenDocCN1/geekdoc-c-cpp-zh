    $stringRemove from the beginning and end of $string the following characters when
    characters is not included: whitespace ('' ''), tab (\t), new line (\n), carriage
    return (\r), NUL byte (\0), and the vertical tab (\x0B). If characters is included,
    that list is used instead9 .Note: Once a character not from the list is reached,
    trimming halts. Examples:$string = " \n Hello World! \t\t"; echo trim($string);![](image_rsrc7MK.jpg)
    Hello World!9 Within characters , a double period ( .. ) can specify a range (
