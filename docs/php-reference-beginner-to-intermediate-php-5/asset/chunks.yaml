- fmt: "\nThanks, and enjoy the show!\n\n## Miscellaneous Things You Should Know\n\
    \nNot everything fits into a neat little category, nor does everything in PHP\
    \ belong in this reference book. However, sometimes they deserve a quick note\
    \ and a little attention and shall be included here.\n\n![](image_rsrc7MM.jpg)\n\
    \n### Portability and Compatibility\n\nFor portability and compatibility, always\
    \ use the long form.\n- Long form: `<?php expr ?>`\n- Short form: `<? expr ?>`\n\
    - Short form equivalent of `<? echo expr ?>`\n\nNote: No closing semicolon (`;`)\
    \ is required. `<?= expr ?>`\n![](image_rsrc7MN.jpg)\n\nAll statements must end\
    \ in a semicolon (`;`)! Otherwise, errors will be generated. If the error doesn't\
    \ make sense, you probably are missing a semicolon somewhere!!\n\n[](image_rsrc7MP.jpg)\n\
    \n### Quotes\n\n`' '` (single quotes) – Content inside single quotes is evaluated\
    \ literally. Therefore, `$string` actually means: (dollar sign)string, and does\
    \ not represent the variable's value.\nExample:\n![](image_rsrc7MR.jpg)\n```php\n\
    $string = 'Single Quotes'; echo '$string';\n```\n\n`\" \"` (double quotes) – Variables\
    \ inside double quotes are evaluated for their values.\nExample:\n![](image_rsrc7MS.jpg)\n\
    ```php\n$string = 'Double Quotes'; echo \"$string\";\n```\n![](image_rsrc7MT.jpg)\n\
    \nEscapes characters that should be evaluated literally when inside double quotations.\n\
    Example:\n```php\n$string = 'Double Quotes';\n```\n![](image_rsrc7MU.jpg)\n```php\n\
    echo \"\\$string is set as $string\";\n```\n![](image_rsrc7MV.jpg)\n\nbackslash\
    \ (`\\`) question mark (`?`) single (`'`) quotes double (`\"`) quotes dollar sign\
    \ (`$`)\nExample:\n```php\n$string = 'Hello World!';\n```\n![](image_rsrc7MW.jpg)\n\
    ```php\necho \"The variable \\$string contains \\' $string \\' \\\" \\\\\";\n\
    echo 'The variable \\$string contains \\' $string \\' \\\" \\\\';\n```\n![](image_rsrc7MX.jpg)\n\
    \n### Comments and Special Characters\n\n![](image_rsrc7MY.jpg)\n\nSingle line,\
    \ for everything to the right of the double forward slashes:\n```php\n// This\
    \ is a comment\n```\n\nMultiple lines, opening and closing tags:\n```php\n/*\n\
    \ * This is a comment \n */\n```\n![](image_rsrc7MZ.jpg)\n\n- `\\n` – New line\n\
    - `\\r` – Carriage return\n- `\\t` – Tab\n- `\\b` – Backspace\n[](image_rsrc7N0.jpg)\n\
    \n### Constants\n\n- `name` – `$string`\n- `value` – `$scalar`\n- `$boolean` –\
    \ `[optional]` default : `FALSE`, case-sensitive\n\nDefine a constant, a set value\
    \ that is assigned globally, making it available to functions and classes without\
    \ passing them directly as an argument.\nExamples:\n![](image_rsrc7N1.jpg)\n```php\n\
    define('HELLO', 'Hello World!'); echo HELLO;\ndefine('GREETINGS', 'Hello World!',\
    \ TRUE); echo GREETINGS;\n```\n![](image_rsrc7N2.jpg)\n```php\necho greetings;\n\
    ```\n![](image_rsrc7N3.jpg)\n\n### Functions\n\n`function functionname([arguments])\
    \ { }`\n\nFunctions can be placed anywhere in a page and will be available even\
    \ if called above the actual function being created. The exception to this rule\
    \ is if the function is only defined as part of a conditional statement, and is\
    \ not available to be called until that conditional statement has been evaluated.\n\
    \nExamples:\n```php\nhello();\n// Above the conditional statement, this will cause\
    \ an error\nif (0==0){\n    function hello(){ echo 'Hello!';}\n}\n```\n[](image_rsrc7N4.jpg)\n\
    ```php\nif (0==0){\n    function hello(){ echo 'Hello ';\n}\nhello();\nthere();\n\
    function there(){echo 'there'; }\n```\n[](image_rsrc7N5.jpg)\n\nFunctions can\
    \ have no arguments (as above), arguments passed to them, or default arguments\
    \ with passed arguments as optional. The argument names are used within that function\
    \ as variable names.\n\n```php\nfunction args($a, $b){\n    // Has no default\
    \ values, requires two inputs\n    echo \"a = $a, b = $b\";\n}\n```\n[](image_rsrc7N6.jpg)\n\
    ```php\nargs(1,2);\n```\n\nSome examples using the following function:\n```php\n\
    function args($a = 1, $b = 2){\n    // Has default values set\n    $c = $a + $b;\n\
    \    echo \"a = $a, b = $b, a+b = $c\";\n}\n```\n[](image_rsrc7N7.jpg)\n```php\n\
    args();\nargs(5,5);\n```\n[](image_rsrc7N8.jpg)\n\n![](image_rsrc7N9.jpg)\n```php\n\
    args(10);\nargs($DoesNotExist,20); // Do not do this, send (NULL,20) instead\n\
    ```\n[](image_rsrc7NA.jpg)\n\nFunctions can also return a `$variable` (including\
    \ an array):\n```php\nfunction Add($one,$two){\n    $total = $one + $two;\n  \
    \  return $total;\n}\n$a = 2;\n$b = 3;\n```\n[](image_rsrc7NB.jpg)\n```php\n$result\
    \ = Add($a,$b); // Assigns the value of $total to $result\necho $result;\n```\n\
    ■​ ■​ ■\n\n| If multiple pages will refer to the same functions, create a separate\
    \ `functions.php` file (name it whatever you like) and `require()` or `require_once()`\
    \ with pages that will need to use those functions. For speed and file size, page\
    \ specific functions should be included directly on the necessary page. |\n"
