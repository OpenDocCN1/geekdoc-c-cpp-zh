    var_dump( min( array(1,2,3), array(1,2,4) ) ); // 1==1, 2==2, 3<4 array(3) { [0]=>
    int(1) [1]=> int(2) [2]=> int(3) }               See Also:max() – Finds the highest
    valuepi() ​ Returns an approximation of pi as a float.Example:var_dump( pi() );float(3.14159265359)pow(
    base, exponent )base – $integer or $floatexponent – $integer or $floatReturns
    the value of base raised to the power of exponent . Example:var_dump( pow(2, 4)
    );![](image_rsrc7MK.jpg) int(16)19                                                                                                                                                                                                                                    
    If comparing two arrays, they are evaluated value vs value, left to righ tsqrt($float)
    ​ Returns the square root of $float.Example:var_dump( sqrt(16) );float(4)log($float
    [, base ])base – [optional] $floatReturns the natural logarithm of $float. The
    optional base is presented as follows:logbase $floatExample:var_dump( log(10)
    );float(2.30258509299)round($float [, decimals ])decimals – [optional] $integer
    default: 0 decimal placesRounds up the $float to the nearest integer. If decimals
    is specified, it is rounded to decimals number of decimal places20 .Examples:var_dump(
    round(3.14) );float(3) ​ var_dump( round(pi(), 2) );float(3.14) ​ var_dump( round(143257.432,
    -2) );float(143300)See Also:floor() – Rounds down to the nearest integer instead
    of rounding up20                                                                                                                                                                                                                                    
    If decimals is negative, it will round that many places to the left of the decimal
    place             ![](image_rsrc7Z4.jpg)Rounds down $float to the nearest integer.Example:![](image_rsrc7Z5.jpg)
    var_dump( floor(3.99) );See Also:round() – Rounds up to the nearest integer or
    decimal place![](image_rsrc7Z6.jpg)min, max – [optional] $integersGenerates a
    random integer. For better randomization, use mt_rand()instead.Example:![](image_rsrc7Z7.jpg)
    var_dump( rand(), rand(1,100) ); // Results varySee Also:mt_rand() – A better
    and faster random number generator![](image_rsrc7Z8.jpg)min, max – [optional]
    $integersGenerates a random integer, better than rand(). If supplied, it will
    generate a random integer between min and max .Example:![](image_rsrc7Z9.jpg)
    var_dump( mt_rand(), mt_rand(1,100) ); // Results varyMySQL FunctionsAh databases.
    In one form or another, if you want to store data and retrieve it in an efficient
    manner, you probably will use a database. The popular MySQL database is part of
    the LAMP stack (Linux-Apache-MySQL- PHP) and deserves a little attention and explanation.
    Be aware, with the exception of a few examples, this section explains PHP functions,
    not how to build MySQL queries.Note: MySQL 5 is assumed. Some queries listed here
    will not work in MySQL 4.MySQL data typestype – max value (signed/unsigned)TINYINT
    – 127 / 255SMALLINT – 32,767 / 65,535MEDIUMINT – 8,388,607 / 16,777,215INT – 2,147,483,647
    / 4,294,967,295BIGINT – 9,223,372,036,854,775,807 / 18,446,744,073,709,551,615date/time
    formatsDATE format: YYYY-MM-DDTIME format: HH:MM:SSDATETIME format: YYYY-MM-DD
    HH:MM:SSTIMESTAMP format: YYYY-MM-DD HH:MM:SS and auto-updates now()Alternate
    forms for datetime/timestamp: YYYYMMDDHHMMSStype – max lengthCHAR() – 255, fixed
    VARCHAR() – 255, variable TINYTEXT – 255TEXT / BLOB – 65,535MEDIUMTEXT / MEDIUMBLOB
    – 16,777,215 LONGTEXT / LONGBLOB – 4,294,967,295![](image_rsrc7ZA.jpg)The following
    table will be used to demonstrate these queries:Table Name: employees  |          
      pkey           |                 name        |                age          
    |


    | Rows -> &#124; | 1 | &#124; | Mary | &#124; | 24 | &#124; |


    | &#124;---> &#124; | 2 | &#124; | John | &#124; | 17 | &#124; |


    | &#124;---> &#124; | 3 | &#124; | Mark | &#124; | 53 | &#124; |


    | &#124;---> &#124; | 4 | &#124; | Susan | &#124; | 17 | &#124; |'
