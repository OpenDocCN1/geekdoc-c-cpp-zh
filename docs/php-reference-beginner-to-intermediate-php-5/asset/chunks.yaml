    `preg_match( pattern , $string [, group_array ] [, flag ] [, offset ])`

    - `pattern` – `$string` Regular expression

    - `group_array` – [optional] Name of array to use for regular expression groups

    - `flag` – [optional] $string default: none

    Value: `PREG_OFFSET_CAPTURE` for each match, an entry is made to include its position
    (characters from start)

    - `offset` – [optional] default: 0, start of the string


    Checks `$string` for regular expression match in `pattern`. If items in `pattern`
    are grouped `()`, supplying the variable name for an array to assign those group''s
    values to is set as `group_array`. The `offset` can specify how many characters
    from the beginning of `$string` to start from, though it can have conflicts with
    expression syntax such as `^` and `$` in `pattern . Returns the number of matches:
    1 if matched, 0 if no match, and FALSE on error.

    **Example:**

    ```php

    $pattern = "/^(\w+)\s(\w+)$/i"; // Using case-insensitive modifier: i// Pattern:
    start, one or more letters, space, one or more letters, end

    $string = ''Hello world'';

    var_dump( preg_match($pattern, $string) );


    $pattern = "/(\w+)\s(\w+)/i"; // Using case-insensitive modifier: i// Pattern:
    one or more letters, single space, one or more letters

    $string = ''Hello world'';

    var_dump( preg_match($pattern, $string, $array) ); print_r($array);

    ```


    `preg_match_all( pattern , $string [, group_array [, flag ])`

    - `pattern` – `$string` Regular expression

    - `group_array` – Variable name of array to use for regular expression groups

    - `flag` – [optional] $string default: noneValues: `PREG_PATTERN_ORDER` (Order
    results so that `group_array [0]` contains full pattern matches, `group_array
    [1]` contains first group, etc.) `PREG_SET_ORDER` (Order `group_array` by set
    of matches) `PREG_OFFSET_CAPTURE` for each match, an entry is made to include
    its position (characters from start)

    - `offset` – [optional] default: 0, start of the string


    Checks for multiple matches within a string

    **Example:**

    ```php

    $pattern = "/(\w+)/i"; // Using case-insensitive modifier: i// Pattern: start,
    one or more letters, space, one more letters, end

    $string = ''Hello world'';

    var_dump( preg_match_all($pattern, $string, $array) ); print_r($array);

    ```

