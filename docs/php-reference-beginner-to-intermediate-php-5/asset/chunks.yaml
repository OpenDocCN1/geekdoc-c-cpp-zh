    ## 序言


    我自学了 PHP 和 MySQL，发现自己有时无法访问互联网，因此无法查询 PHP.net 手册 ([`www.php.net/manual/en/`](http://www.php.net/manual/en/))。由于编码不是我的主要工作，我需要温习语法、用法，最重要的是提醒自己如何编写
