  trans: "\n\n# 如果你想知道完成一个脚本需要多长时间，例如在比较两个不同的函数以查看哪一个更快时，可以使用 `microtime()` 来跟踪效率。\n\
    \n```php\n$start = microtime(1);\n// 在此处执行操作\n$end = microtime(1);\n$lengthoftime\
    \ = number_format($end - $start, 6);\necho \"It took $lengthoftime seconds to\
    \ run this script.\";\n```\n\n运行此脚本花费了 0.000005 秒。\n\n## strtotime\n\n`strtotime($string\
    \ [, timestamp ])` \n`timestamp` – [可选] `$integer` 默认值：`time()`\n\n根据 `$string`\
    \ 中日期/时间的解释返回 Unix 时间戳，`$string` 是日期时间的常用语言格式。如果 `$string` 是指日期的相对输入格式（例如 'last\
    \ month'），则除非提供了可选的 `timestamp`，否则将使用当前日期/时间。如果 `$string` 无效且函数失败，则返回 `FALSE`。\n\
    \n### 示例\n```php\n$result = strtotime('December 8th, 1941'); echo $result;\necho\
    \ '<br />'; // XHTML 换行\necho date('r', $result);\n$result = strtotime('26apr86');\
    \ echo date('r', $result); // Sat, 26 Apr 1986 00:00:00 -0700\n$result = strtotime('20010911\
    \ 08:45:00'); echo date('r', $result); // Tue, 11 Sep 2001 08:45:00 -0600\n```\n\
    \n### 相对 $string 示例\n```php\n$result = strtotime('last week'); // 时间，上周\necho\
    \ date('r', $result); // Mon, 10 Mar 2008 14:31:54 -0600\n$date = mktime(8,45,00,9,11,2001);\
    \ // Sept. 11, 2001 8:45am\n$result = strtotime('next week', $date); echo date('r',\
    \ $result); // Tue, 18 Sep 2001 08:45:00 -0600\n$date = mktime(8,45,00,9,11,2001);\
    \ // Sept. 11, 2001 8:45am\n$result = strtotime('+2 friday', $date); echo date('r',\
    \ $result); // Fri, 21 Sep 2001 00:00:00 -0600\n$result = strtotime('1 hour ago');\
    \ echo date('r', $result); // Mon, 17 Mar 2008 13:36:54 -0600\n$result = strtotime('yesterday\
    \ 3am'); echo date('r', $result); // Sun, 16 Mar 2008 03:00:00 -0600\n$result\
    \ = strtotime('7am 4 days ago'); echo date('r', $result); // Thu, 13 Mar 2008\
    \ 07:00:00 -0600\n```\n\n还有更多示例。请参阅以下网站：\n- [`www.gnu.org/software/tar/manual/html_node/tar_113.html`](http://www.gnu.org/software/tar/manual/html_node/tar_113.html)\n\
    - [`www.phpdig.net/ref/rn13re206.html`](http://www.phpdig.net/ref/rn13re206.html)\n\
    \n另参：`date()` – 将 Unix 时间戳转换为更易于读的格式\n\n此函数的威力不仅在于可以将普通语言转换为可用的内容而无需大量的正则表达式字符串，还在于处理相对日期和时间时。如果你使用\
    \ MySQL 查询从数据库中提取数据以生成上周（周一到周五）的所有调用报告，你将不得不反复计算来确定今天是星期几，然后根据该结果算出周一的日期，最后提交正确的查询。使用此函数，你可以无需额外的数学计算即可快速找到日期，一切都会为你处理好！\n\
    \n"
- fmt: "\n# Mathematical Functions\n\nSometimes you need more advanced mathematics.\n\
    \n### abs(number)\n`number` – `$integer` or `$float`\nReturns the absolute value\
    \ of `number` as the same variable type.\nExample:\n```php\nvar_dump( abs(-21)\
    \ );\nint(21)\n```\n\n### dechex($integer)\nReturns the hexadecimal value of `$integer`.\
    \ Maximum number: `4294967295`.\nExample:\n```php\nvar_dump( dechex(4294967295)\
    \ );\nstring(8) \"ffffffff\"\n```\n![](image_rsrc7Z2.jpg)\n\n### max()\nDepending\
    \ on the arguments supplied, there are two different formats:\n- If supplied a\
    \ single argument, `$array`, it returns the highest value in the array.\n- If\
    \ supplied two or more `$variable`, it returns the highest value argument.\n\n\
    Note: Non-numeric strings are evaluated as zero (0) for comparison purposes.\n\
    Examples:\n```php\n$array = array(4, 7, 2); \nvar_dump( max($array) );\nint(7)\n\
    ```\n![](image_rsrc7MK.jpg)\n\nIf comparing two arrays, they are evaluated value\
    \ vs value, left to right:\n```php\nvar_dump( max(2, 5, 'string', '8') );\nstring(1)\
    \ \"8\"\n```\nSee Also: `min()` – Finds the lowest value.\n\n### min()\nDepending\
    \ on the arguments supplied, there are two different formats:\n- If supplied a\
    \ single argument, `$array`, it returns the highest value in the array.\n- If\
    \ supplied two or more `$variable`, it returns the lowest value argument.\n\n\
    Note: Non-numeric strings are evaluated as zero (0) for comparison purposes.\n\
    Examples:\n```php\n$array = array(-3, 7, 2); \nvar_dump( min($array) );\nint(-3)\n\
    \nvar_dump( min( array(1,2,3), array(1,2,4) ) ); // 1==1, 2==2, 3<4\narray(3)\
    \ { \n    [0]=> int(1) \n    [1]=> int(2) \n    [2]=> int(3) \n}\n```\nSee Also:\
    \ `max()` – Finds the highest value.\n\n![](image_rsrc7Z3.jpg)\n\n### pi()\nReturns\
    \ an approximation of pi as a float.\nExample:\n```php\nvar_dump( pi() );\nfloat(3.14159265359)\n\
    ```\n\n### pow(base, exponent)\n`base` – `$integer` or `$float`\n`exponent` –\
    \ `$integer` or `$float`\nReturns the value of `base` raised to the power of `exponent`.\n\
    Example:\n```php\nvar_dump( pow(2, 4) );\nint(16)\n```\n![](image_rsrc7MK.jpg)\n\
    \n### sqrt($float)\nReturns the square root of `$float`.\nExample:\n```php\nvar_dump(\
    \ sqrt(16) );\nfloat(4)\n```\nIf comparing two arrays, they are evaluated value\
    \ vs value, left to right.\n\n### log($float [, base])\n`base` – [optional] `$float`\n\
    Returns the natural logarithm of `$float`. The optional base is presented as follows:\
    \ `log$base`.\nExample:\n```php\nvar_dump( log(10) );\nfloat(2.302585092)\n```\n\
    \n### round($float [, decimals])\n`decimals` – [optional] `$integer` default:\
    \ 0 decimal places\nRounds up the `$float` to the nearest integer. If `decimals`\
    \ is specified, it is rounded to `decimals` number of decimal places.\nExamples:\n\
    ```php\nvar_dump( round(3.14) );\nfloat(3)\n\nvar_dump( round(pi(), 2) );\nfloat(3.14)\n\
    \nvar_dump( round(143257.432, -2) );\nfloat(143300)\n```\nIf `decimals` is negative,\
    \ it will round that many places to the left of the decimal place.\nSee Also:\
    \ `floor()` – Rounds down to the nearest integer instead of rounding up.\n\n###\
    \ floor($float)\nRounds down `$float` to the nearest integer.\nExample:\n```php\n\
    var_dump( floor(3.99) );\nfloat(3)\n```\nSee Also: `round()` – Rounds up to the\
    \ nearest integer or decimal place.\n\n### rand(min, max)\n`min, max` – [optional]\
    \ `$integers`\nGenerates a random integer. For better randomization, use `mt_rand()`\
    \ instead.\nExample:\n```php\nvar_dump( rand(), rand(1,100) ); // Results vary\n\
    ```\nSee Also: `mt_rand()` – A better and faster random number generator.\n\n\
    ### mt_rand(min, max)\n`min, max` – [optional] `$integers`\nGenerates a random\
    \ integer, better than `rand()`. If supplied, it will generate a random integer\
    \ between `min` and `max`.\nExample:\n```php\nvar_dump( mt_rand(), mt_rand(1,100)\
    \ ); // Results vary\n```\n\n# MySQL Functions\n\nAh databases. In one form or\
    \ another, if you want to store data and retrieve it in an efficient manner, you\
    \ probably will use a database. The popular MySQL database is part of the LAMP\
    \ stack (Linux-Apache-MySQL-PHP) and deserves a little attention and explanation.\
    \ Be aware, with the exception of a few examples, this section explains PHP functions,\
    \ not how to build queries.\n\n![](image_rsrc7ZA.jpg)\nThe following table will\
    \ be used to demonstrate these queries:\nTable Name: `employees`\n| pkey | name\
    \ | age |\n| :--- | :--- | :--- |\n| 1 | Mary | 24 |\n| 2 | John | 17 |\n| 3 |\
    \ Mark | 53 |\n| 4 | Susan | 17 |\n"
