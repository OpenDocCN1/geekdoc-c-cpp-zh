  trans: "\n\n# 字符串函数\n\n如果你是一只猫，那么字符串函数就是猫的喵喵声（这里是个双关语）。它们不仅占据了你 PHP 代码的很大一部分，还提供了许多用于识别和将你的数据转换为其他格式（如数组）机能。\n\
    \n![](img/image_rsrc7RX.jpg)\n\n## addslashes()\n\n向 `$string` 中的项目添加反斜杠（转义字符串），使其能够安全数据库查询。它会影响单引号（`'`）、双引号（`\"\
    `）、反斜杠（`\\`）和 NUL 字节。\n\n**示例：**\n```php\n$string = ' Tom said, \"Marcus is mad!\"\
    '; echo $string;\n```\n![](img/image_rsrc7RY.jpg)\n```php\n$string = addslashes($string);\
    \ echo $string;\n```\n\n**另见：**\n- `get_magic_quotes_gpc` – 自动对 `GET/POST/COOKIE`\
    \ 数据应用 `addslashes` 的服务器设置\n- `stripslashes()` – 由 `addslashes()` 创建的反斜杠\n\n##\
    \ stripslashes()\n\n移除 `$string` 中通过 `addslashes()` 或 `magic_quotes_gpc` 添加的反斜杠。\n\
    \n**示例：**\n```php\n$string = ' Tom said, \"Marcus is mad!\"';\n$string = addslashes($string);\
    \ echo $string;\n```\n![](img/image_rsrc7S0.jpg)\n```php\n$string = stripslashes($string);\
    \ echo $string;\n```\n\n**另见：**\n- `get_magic_quotes_gpc` – 自动对 `GET/POST/COOKIE`\
    \ 数据应用 `addslashes` 的服务器设置\n\n## chunk_split()\n\n添加反斜杠使字符串能够安全数据库查询。\n\n`chunk_split($string\
    \ [, length ] [, endstring ])`\n\n- `length` – [可选] `$integer` 默认：`76`\n- `endstring`\
    \ – [可选] `$string` 默认：`\"\\r\\n\"`（回车和换行符）\n\n将 `$string` 分成长度为 `length` 的字符段，每个部分都以\
    \ `endstring` 结束。仅评估字符长度以生成结果字符串。\n\n**示例：**\n```php\n$string = 'Hello Nurse!';\n\
    $string = chunk_split($string, 3); var_dump($string);\n```\n![](img/image_rsrc7S1.jpg)\n\
    ```php\necho nl2br($string); // 将 \\n 转换为 XHTML 的 <br />\necho 'Notice I am on\
    \ a new line?';\n```\nHTML 源代码：\n![](img/image_rsrc7S2.jpg)\n\n**另见：**\n- `nl2br()`\
    \ – 将 `\\n` 实例转换为 XHTML 的 `<br />` 换行\n- `str_replace()` – 替换字符串中的指定字符\n- `wordwrap()`\
    \ – 与 `chunk_split()` 类似，但有一些细微差异\n\n| `\\r\\n` 是格式化字符，如果是标准输出的一部分，它们会被忽略。如果放置在\
    \ `<textarea>` 或 `<pre>`（预格式）标签内，它们会在浏览器的输出中被正确解析。 |\n\n```php\n$string = 'Hello\
    \ Nurse!';\n$string = chunk_split($string, 3); echo '<pre>';\n```\n![](img/image_rsrc7S3.jpg)\n\
    ```php\necho $string; echo '</pre>';\n```\n\n## wordwrap()\n\n`wordwrap($string\
    \ [, length ] [, breakstring ] [, wordcut ])`\n\n- `length` – [可选] `$integer`\
    \ 默认：`75`\n- `breakstring` – [可选] `$string` 默认：`\"\\n\"`（换行）\n- `wordcut` – [可选]\
    \ `$boolean` 默认：`FALSE`，单词不会切分\n\n将 `$string` 分成长度为 `length` 的字符段，并带有 `breakstring`。如果\
    \ `wordcut` 设置为 `TRUE`，超过指定长度的单词将被分割，以确保精确的宽度。\n\n**示例：**\n```php\n$origstring\
    \ = 'I said to her, Hellooooo Nurse!!!';\n$string = wordwrap($origstring, 8);\n\
    ```\n![](img/image_rsrc7S4.jpg)\n```php\necho nl2br($string); // 将 \\n 转换为 XHTML\
    \ 的 <br />\n$origstring = 'I said to her, Hellooooo Nurse!!!';\n```\n![](img/image_rsrc7S5.jpg)\n\
    ```php\n$string = wordwrap($origstring, 8, \"<BR \\>\\n\", TRUE); echo $string;\n\
    ```\n\n**另见：**\n- `nl2br()` – 将 `\\n` 实例转换为 XHTML 的 `<br />` 换行\n- `str_replace()`\
    \ – 替换字符串中的指定字符\n- `chunk_split()` – 与 `wordwrap()` 类似，但有一些细微差异\n\n| 为了符合标准，使用\
    \ `mail()` 命令发送基于文本的电子邮件时，在提供给 `mail()` 之前应该使用 `wordwrap()` 对消息解析。 |\n\n![](img/image_rsrc7S6.jpg)\n\
    \n## count_chars()\n\n`mode` – [可选] `$integer` (0, 1, 2, 3, 或 4) 默认：`0`\n\n**值：**\n\
    - `0` – 返回包含所有字符计数的数组\n- `1` – 返回在 `$string` 中至少出现一次的字符的计数数组\n- `2` – 返回所有出现次数为零的字符计数数组\n\
    - `3` – 返回 `$string` 中包含的所有字符的字符串\n- `4` – 返回 `$string` 中包含的所有字符的字符串\n\n检查 `$string`\
    \ 中的 ASCII 字符实例并统计每个字符出现的次数。输出取决于 `mode`。\n\n**注意：** 数组中的键是字符的 ASCII 字节值（模式 0-2），而字符串输出是本身（模式\
    \ 3 和 4）。\n\n**示例：**\n```php\n$string = 'Hello';\n$array = count_chars($string,\
    \ 1);\n```\n![](img/image_rsrc7S7.jpg)\n```php\necho '<pre>'; // 为了方便阅读\nprint_r($array);\n\
    foreach ($array as $key => $value){\n  $char = chr($key); // 由字节值表示的字符\n  $chararray[$char]\
    \ = $value; // 创建字符的新数组\n}\n```\n![](img/image_rsrc7S8.jpg)\n```php\nprint_r($chararray);\n\
    $usedcharacters = count_chars($string, 3); var_dump($usedcharacters);\n```\n![](img/image_rsrc7S9.jpg)\n\
    \n**另见：**\n- `chr()` – 获取由字节值表示的 ASCII 字符\n\n`chr($integer)`\n`$integer` – 0 -\
    \ 255 返回 ASCII 字节值的单个字符表示\n\n`explode( delimiter , $string [, limit ])`\n\n- `delimiter`\
    \ – `$string`，如果为空，`explode` 将返回 `FALSE`\n- `limit` – [可选] `$integer`，默认：无限制。通过搜索\
    \ `$string` 并使用提供的分隔符分割创建字符串数组。限制设置元素的最大数量，数组的最后一个元素是字符串的剩余部分。\n\n布尔值由 1 (TRUE)\
    \ 或空 (FALSE) 表示，而浮点数大于 e6 时可能会显示为整数。如果 `limit` 为负，则返回除最后 limit 个之外的值。\n\n**示例：**\n\
    ```php\n$explodeme = '02-01-1980';\n$array = explode('-', $explodeme); // 横杠 (-)\
    \ 是分隔符\necho '<pre>'; // 为了方便阅读\n```\n![](img/image_rsrc7SA.jpg)\n```php\nprint_r($array);\n\
    $array = explode('-', $explodeme, 2); // 限制为 2 个元素\nprint_r($array);\n\n```\n\
    ![](img/image_rsrc7SB.jpg)\n\n| 如上所示，explode 可用于拆分常见的语言语法，例如将用户提交的段落拆分成单个句子，或者允许用户提交特定项目的标签（用逗号分隔），然后\
    \ explode() 那些项目以存储在数据库中。 |\n\n"
- fmt: "\n# `implode(limiter, $array)`\n\nReturns a string containing the contents\
    \ of `$array` joined by the provided `limiter`.\n\nExample:\n```php\n$array =\
    \ array( 'Hello', 'World', '!' );\n$string = implode(' ', $array); // Using a\
    \ space as the limiter\necho $string; // Hello World !\n```\n\n**See Also:** `explode()`\
    \ – Separate a string into an array using a specific delimiting string.\n\n![](image_rsrc7SC.jpg)\n\
    \n# `sprintf()`\n\nAccepts multiple inputs to be used when specified in `formatting`.\n\
    \n- `formatting` – `$string`, specific formatting string, explained below.\n-\
    \ `inputs` – the `$scalar(s)` to be formatted\n\nReturns a formatted string, using\
    \ the `inputs` to dynamically input their values into the formatted string using\
    \ a preset set of rules, specified below.\n\nThe following is the available nomenclature\
    \ for the formatting input.\n\n![](image_rsrc7SD.jpg)\n\nEvery time an input is\
    \ expected to be used and evaluated as part of the formatted string, it is preceded\
    \ by a percent sign (`%`), followed by the specifiers/rules:\n\n**Note:** All\
    \ specifiers, excluding the type specifier, are optional.\n\n- A **sign specifier**.\
    \ Placing a plus sign (`+`) forces negative AND positive signs to be visible (only\
    \ negative values are specified by default).\n- A **padding specifier**. The default\
    \ is a space, and does not need to be specified. A zero (`0`) can be used as well\
    \ without any secondary notation. If any other character is to be used, it should\
    \ be preceded with a single quote (`' `).\n- An **alignment specifier**. The default\
    \ is right-justified (thus padding is placed on the left of the string). Placing\
    \ a dash/subtract (`-`) will set it to left-justified.\n- A **width specifier**.\
    \ This integer determines the minimum length in characters the output should be.\
    \ When combined with padding, the specified width minus the input's length determines\
    \ the number of padded characters that will be added.\n- A **precision specifier**.\
    \ A period (`.`) followed by an integer, sets the number of decimal places that\
    \ should be output for a float. If used on a string, it sets a maximum character\
    \ limit for the output.\n- **A type specifier**:\n    - `%` – a literal percent\
    \ sign, thus would be written `%%` to display a percent sign in the formatting\
    \ string.\n    - `b` – the input should be an integer, a binary number is the\
    \ output.\n    - `c` – the input should be an integer between 0-255, representing\
    \ the ASCII byte-value. The character represented is output.\n    - `d` – the\
    \ input should be an integer.\n    - `e` – the input is scientific notation.\n\
    \    - `u` – the input is an unsigned decimal number.\n    - `f` – the input is\
    \ a float (locale aware).\n    - `F` – the input is a float (not locale aware).\n\
    \    - `o` – the input is an integer, an octal number is the output.\n    - `s`\
    \ – the input is a string.\n    - `x` – the input is an integer, a hexadecimal\
    \ number is the output (with lowercase letters).\n    - `X` – the input is an\
    \ integer, a hexadecimal number is the output (with uppercase letters).\n\n##\
    \ Examples\n\n### Basic substitution, no optional specifiers\n```php\n$string\
    \ = 'cat';\n$integer = 10;\n![](image_rsrc7SE.jpg)\necho sprintf(\"I have %d %s(s)\"\
    , $integer, $string);\n```\n\n### Basic substitution, type specification automatic\
    \ adjustments\n```php\n$string = 'cat';\n$string2 = '10 blah';\n![](image_rsrc7SF.jpg)\n\
    echo sprintf(\"I have %d %s(s)\", $string2, $string);\n```\n\n### Using the sign\
    \ specifier\n```php\n$string = 'cat';\n$integer = '10';\n![](image_rsrc7SG.jpg)\n\
    echo sprintf(\"Dagger has a %+d against %ss\", $integer, $string);\n```\n\n###\
    \ Using padding and width specifiers (default padding specifier of a space)\n\
    ```php\n$string = 'cat'; // length, 3 characters\necho '<pre>'; // HTML Required\
    \ to display the formating properly\necho sprintf(\"3 spaces added: |%6s\", $string);\n\
    ![](image_rsrc7SH.jpg) // Used padding of 6 characters, 6 – 3 = 3 spaces padded\n\
    ```\n\n### Using padding and width using a zero (`0`) for padding\n```php\n$month\
    \ = 12;\n$day = 1;\n$year = 1980;\necho sprintf (\" Date: %02d/%02d/%04d.\", $month,\
    \ $day, $year);\n$year = 80;\n![](image_rsrc7SJ.jpg)\necho sprintf (\" Date: %02d/%02d/%04d.\"\
    , $month, $day, $year);\n```\n\n### Using padding and width using a custom character,\
    \ the asterisk (`*`)\n```php\n$endofpassword = 'word';\n$output = sprintf(\"Your\
    \ password: %'*8s\", $endofpassword);\necho $output; // Your password: ****word\n\
    ```\n\n### Using padding, alignment (left), and width\n```php\n$endofpassword\
    \ = 'word';\n$output = sprintf(\"Your password: %'*-8s\", $endofpassword);\necho\
    \ $output; // Your password: word****\n```\n\n### Using the precision specifier\n\
    ```php\n$scientific = 1.2e3;\necho sprintf(\"Three decimal places: %.3e\", $scientific);\
    \ // Three decimal places: 1.200e+3\n$float = 1.2e3;\necho sprintf(\"Two decimal\
    \ places: %.2f\", $float); // Two decimal places: 1200.00\n$string = 'Hello World!';\n\
    echo sprintf(\"Cut-off after 4 characters: %.4s\", $string); // Cut-off after\
    \ 4 characters: Hell\n```\n\n**See Also:**\n- `printf()` – prints a formatted\
    \ string results rather than simply returning them.\n- `sscanf()` – Parses a string\
    \ through a formatted string, reverse of `sprintf()`\n\n| For MySQL security,\
    \ you can use `sprintf()` to force user input to have a maximum length and be\
    \ valid for the structure of your database. Use the precision specifier to automatically\
    \ parse the string submitted by GET or POST. |\n"
  raw: 'implode( limiter , $array)limiter – $stringReturns a string containing the
    contents of $array joined by the providedlimiter . Example:$array = array( ''Hello'',
    ''World'', ''!'' );$string = implode('' '', $array); // Using a space as the limiterecho
    $string;Hello World !See Also:explode() – Separate a string into an array using
    a specific delimiting string![](image_rsrc7SC.jpg)Accepts multiple inputs to be
    used when specified in formatting formatting – $string, specific formatting string,
    explained belowinputs – $scalar(s) to be formattedReturns a formatted string formatting
    , using the inputs to dynamically input their values into the formatted string
    using a preset set of rules, specified below.The following is the available nomenclature
    for the formatting input.![](image_rsrc7SD.jpg)Every time an input is expected
    to be used and evaluated as part of the formatted string, it is preceded by a
    percent sign ( % ), followed by the specifiers/rules:Note: All specifiers, excluding
    the type specifier, are optional.☐         A sign specifier. Placing a plus sign
    ( + ) forces negative AND positive signs to be visible (only negative values are
    specified by default).☐         A padding specifier. The default is a space, and
    does not need to be specified. A zero ( 0 ) can be used as well without any secondary
    notation. If any other character is to be used, it should be preceded with a single
    quote ( '' ).☐         An alignment specifier. The default is right-justified
    (thus padding  is placed on the left of the string). Placing a dash/subtract (
    - ) will set it to left-justified.☐         A width specifier. This integer determines
    the minimum length in characters the output should be. When combined with padding,
    the specified width minus the input''s length determines the number of padded
    characters that will be added.☐         A precision specifier. A period ( . )
    followed by an integer, sets the number of decimal places that should be output
    for a float. If used on a string, it sets a maximum character limit for the output.☐         
    A type specifier:


    *   % - a literal percent sign, thus would be written %% to display a percent
    sign in the formatting string


    *   b – the input should be an integer, a binary number is the output.


    *   c - the input should be an integer between 0-255, representing the ASCII byte-value.
    The character represented is output.


    *   d – the input should be an integer.


    *   e – the input is scientific notation.


    *   u – the input is an unsigned decimal number.


    *   f – the input is a float (locale aware).


    *   F - the input is a float (not locale aware).


    *   o – the input is an integer, an octal number is the output.


    *   s – the input is a string.


    *   x - the input is an integer, a hexadecimal number is the output (with lowercase
    letters).


    *   X - the input is an integer, a hexadecimal number is the output (with uppercase
    letters).


    Examples:Basic substitution, no optional specifiers$string = ''cat'';$integer
    = 10;![](image_rsrc7SE.jpg) echo sprintf("I have %d %s(s)", $integer, $string);Basic
    substitution, type specification automatic adjustments$string = ''cat'';$string2
    = ''10 blah'';![](image_rsrc7SF.jpg) echo sprintf("I have %d %s(s)", $string2,
    $string);Using the sign specifier$string = ''cat'';$integer = ''10'';![](image_rsrc7SG.jpg)
    echo sprintf("Dagger has a %+d against %ss", $integer, $string);Using padding
    and width specifiers (default padding specifier of a space)$string = ''cat'';
    // length, 3 charactersecho ''<pre>''; // HTML Required to display the formating
    properly echo sprintf("3 spaces added: |%6s", $string);![](image_rsrc7SH.jpg)
    // Used padding of 6 characters, 6 – 3 = 3 spaces paddedUsing padding and width
    using a zero ( 0 ) for padding$month = 12;$day = 1;$year = 1980;echo sprintf ("
    Date: %02d/%02d/%04d.", $month, $day, $year);$year = 80;![](image_rsrc7SJ.jpg)
    echo sprintf (" Date: %02d/%02d/%04d.", $month, $day, $year);Using padding and
    width using a custom character, the asterisk ( * )$endofpassword = ''word'';$output
    = sprintf("Your password: %''*8s", $endofpassword); echo $output;Your password:
    ****wordUsing padding, alignment (left), and width$endofpassword = ''word'';$output
    = sprintf("Your password: %''*-8s", $endofpassword); echo $output;Your password:
    word****Using the precision specifier$scientific = 1.2e3;echo sprintf("Three decimal
    places: %.3e", $scientific);Three decimal places: 1.200e+3$float = 1.2e3;echo
    sprintf("Two decimal places: %.2f", $float);Two decimal places: 1200.00$string
    = ''Hello World!'';echo sprintf("Cut-off after 4 characters: %.4s", $string);Cut-off
    after 4 characters: HellSee Also:printf() – prints a formatted string results
    rather than simply returning themsscanf() – Parses a string through a formatted
    string, reverse of sprintf()■​ ■​ ■


    | For MySQL security, you can use sprintf() to force user input to have a maximum
    length and be valid for the structure of your database. Use the precision specifier
    to automatically parse the string submitted by GET orPOST. |'
