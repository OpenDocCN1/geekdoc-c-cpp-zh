    World42! ​                                                         echo trim($string,
    " \t!0..9");// Range included is all numbers between 0 and 9Hello WorldSee Also:ltrim()
    – Trim only from the beginning of the stringtrim() – Trim from the beginning and
    the end of the stringcrypt($string [, salt ])salt – [optional] $stringPerforms
    a one-way hashing encryption on $string using an algorithm specified by the system11
    . The salt can be used to generate a stronger encryption, but when not specified
    and generated by the system, it will be created once per run of the script.Example:$password
    = ''mypassword'';echo crypt($password); // Output will vary$1$QeU8Xekg$KhD/hMl4C9zDpGc2WszeD.See
    Also:md5() – MD5 algorithm based encryption, portable, more secure, commonly usedsha1()
