    ![](image_rsrc7WN.jpg)Returns the last value in `$array` and removes it from the
    array.


    Example:

    ```php

    $array = array(''zero'', ''one'', ''two'');

    $value = array_pop($array);

    echo $value;

    print_r($array);

    ```

    ![](image_rsrc7WR.jpg)


    See Also:

    - `array_shift()` – Similar to `array_pop`, but to the beginning of the array

    - `array_unshift()` – Adds values onto the beginning of an array

    - `array_push()` – Adds values onto the end of an array

    - `array_splice()` – Similar, but is flexible enough to do other things as well


    ![](image_rsrc7WS.jpg)Can accept multiple values


    `value` – `$variable` Adds value (s) to `$array`, equivalent to:

    `$array[] = value`

    The above is the preferred method if adding a single value.


    Example:

    ```php

    $array = array(''zero'');

    array_push($array, ''one'', ''two'');

    print_r($array);

    ```

    See Also:

    - `array_unshift()` – Adds values onto the beginning of an array

    - `array_pop()` – Removes the last value from the end of an array

    - `array_shift()` – Similar to `array_pop`, but to the beginning of the array

    - `array_splice()` – Similar, but is flexible enough to do other things as well


    Returns the first value in `$array` and removes it from the array, reindexing
    all numerical keys.


    Example:

    ```php

    $array = array(''zero'', ''one'', ''two'', ''name'' => ''Bob'');

    $value = array_shift($array);

    echo $value;

    print_r($array);

    ```

    ![](image_rsrc7WW.jpg)


    See Also:

    - `array_unshift()` – Adds values onto the beginning of an array

    - `array_pop()` – Removes the last value from the end of an array

    - `array_push()` – Adds values onto the end of an array

    - `array_splice()` – Similar, but is flexible enough to do other things as well


    ![](image_rsrc7WX.jpg)Can accept multiple values


    `value` – `$variable` Adds value (s) to the beginning of `$array`, reindexing
    all numerical keys.


    Example:

    ```php

    $array = array(''zero'');

    array_unshift($array, ''one'', ''two'');

    print_r($array);

    ```

    See Also:

    - `array_push()` – Adds values onto the end of an array

    - `array_pop()` – Removes the last value from the end of an array

    - `array_shift()` – Similar to `array_pop`, but to the beginning of the array

    - `array_splice()` – Similar, but is flexible enough to do other things as well


    ![](image_rsrc7WZ.jpg)Returns the product (multiplication) of values in `$array`.


    Note: If any values in the array cannot be evaluated as an integer, `array_product()`
    returns the integer `0`.


    Examples:

    ```php

    $array = array( 2, 4, 8 );

    echo array_product($array);

    $array = array( ''2'', ''4'', ''8'' );

    var_dump( array_product($array) );

    // int(64)

    ```


    `array_sum($array)` Returns the sum (addition) of values in `$array`.


    Note: Any values in the array that cannot be evaluated as an integer are ignored.


    Examples:

    ```php

    $array = array( 2, 4, 8 );

    echo array_sum($array);

    // 14

    $array = array( ''2'', ''4'', ''8'', ''blah'' );

    var_dump( array_sum($array) );

    // int(14)

    ```


    `array_rand($array [, count ])`

    `count` – [optional] `$integer` default: 1 Returns a string containing a randomly
    selected key from `$array`. If `count` is supplied and greater than 1, it specifies
    the number of keys to select randomly from `$array` and returns an array.


    Examples:

    ```php

    $array = array( ''name'' => ''Bob'', ''job'' => ''n/a'', ''age'' => 12 );

    $random_key = array_rand($array);

    echo $random_key; // Results will vary: job


    $array = array( ''name'' => ''Bob'', ''job'' => ''n/a'', ''age'' => 12 );

    ![](image_rsrc7X1.jpg)

    $random_array = array_rand($array, 2);

    print_r($random_array); // Results will vary

    ```

    See Also:

    - `shuffle()` – Randomizes the values in an array


    | This function is meant to be combined with other code, since it only retrieves
    the key(s). Here is a simple usage example on an indexed array containing keywords,
    possibly retrieved from a database. |

