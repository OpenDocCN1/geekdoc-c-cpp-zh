    must be used prior to any other output is sent to the user/browser. Use ob_start()
    to workaround this.Examples:![](image_rsrc7P2.jpg) header(''Location: http://www.someotherplace.com'');header(''HTTP/1.0
    404 Not Found'');![](image_rsrc7P3.jpg)See Also:ob_start() – Start the output
    buffer![](image_rsrc7P4.jpg)While this is outside of the scope of this book, I
    have included a few notes here on basic usage to extend the flexibility of this
    book.Class Structure: ( brackets[] delineate optional syntax )class class_name
    [extends base_class ]{var variable_name ; // Defines a variable function function_
    name([ arguments ]) {// Stuff to do goes here}}Refer to the containing class –
    use the reserved variable $this Declare a class:               $variable = new
    class_name() ; Creating an object:               $variable-> function_name() ;Static
    call to an object:​ class_name :: function_name() ;OperatorsWhen comparing or
    processing variables and other values you use operators. Without them, PHP would
    be more of a word jumble instead of a language. In some unique cases, operators
    slightly alter the relationship between two variables or their function within
    PHP. Without further adieu, here they are.Basic Operators ​ Add ( + ): $a = 1;
    $a = $a + 5; // $a is equal to 6Subtract ( - ): $s = 10; $s = $s - 5; // $s is
    equal to 5Multiply ( * ): $m = 2; $m = $m * 10; // $m is equal to 20 Divide (
    / ): $d = 20; $d = $d / 5; // $d is equal to 4 Modulus ( % ) Provides the remainder
    after division:$u = 5; $u = $u % 2; // $u is equal to 1Assignment Operators ​
    Add ( += ): $a = 1; $a += 5; // $a is equal to 6Subtract ( -= ): $s = 10; $s -=
    5; // $s is equal to 5Multiply ( *= ): $m = 2; $m *= 10; // $m is equal to 20
    Divide ( /= ): $d = 20; $d /= 5; // $d is equal to 4 Modulus ( %= ) Provides the
    remainder after division:$u = 5; $u %= 2; // $u is equal to 1Concatenate ( .=
    ) Join onto the end of a string:$c = 5; $c .= 2; // $c is now a string, ''52''See
    Also:Concatenate – Join together in succession![](image_rsrc7P5.jpg)Greater Than
    ( > ): 2 > 1Less Than ( < ): 1 < 2Greater Than or Equal To ( >= ):  2 >= 2 ​ 3
    >= 2Less Than or Equal To ( <= ):​ 2 <= 2 ​ 2 <= 3![](image_rsrc7P6.jpg)Also known
    as:Increment ( $integer++; ) Decrement ( $integer--; )Example:$a = 1;$a = $a +
    1; // $a is now equal to 2$a++; // $a is now equal to 3$a--; // $a is now equal
    to 2 again, same as $a = $a – 1;![](image_rsrc7P7.jpg)Placing the commercial at
    symbol (@) before a function tells PHP to suppress any errors generated by that
    function.Examples:![](image_rsrc7P8.jpg) include(''DoesNotExist.txt'');@include(''DoesNotExist.txt'');![](image_rsrc7P9.jpg)
    // blank output below because the error was suppressed![](image_rsrc7PA.jpg)References
    allow two variables to refer to the same content. In other words, a variable points
    to its content (rather than becoming that content). Passing by reference allows
    two variables to point to the same content under different names. The ampersand
    ( & ) is placed before the variable to be referenced.Examples:$a = 1;$b = &$a;
    // $b references the same value as $a, currently 1![](image_rsrc7PB.jpg) $b =
    $b + 1; // 1 is added to $b, which effects $a the same way echo "b is equal to
    $b, and a is equal to $a";■​ ■​ ■'
