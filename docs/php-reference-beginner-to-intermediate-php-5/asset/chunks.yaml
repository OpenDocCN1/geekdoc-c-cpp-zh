    # Array Functions


    It took me a while to learn about arrays, they were these scary things with keys
    and values, associative and indexed, and then you could have an array inside an
    array... I was scared. Truth was, they were infinitely useful in keeping things
    organized, efficient in keeping things organized.


    ### Nomenclature and Syntax


    ```php

    $array = array(); // Define arrays

    $array = array( ''value'', ''two'', ''three'' ); // Indexed

    $array = array( ''key'' => ''value'' ); // Associative

    $array[] = ''value''; // Assign value

    $array[''name''] = ''value''; // Assign value

    ```


    ### Case Conversion


    `option` – [optional] `$integer` (0 or 1) default: 0 (lowercase) Changes the case
    of keys inside `$array`.


    **Examples:**

    ```php

    $array = array( ''NaMe'' => ''BoB'' );

    print_r( array_key_case($array) );

    print_r( array_key_case($array, 1) );

    ```


    ### `array_chunk()`


    `size` – `$integer`

    `preserve_keys` – [optional] `$boolean` default: FALSE Splits the `$array` by
    size number of values for each new array, returning a multi-dimensional array.
    If `preserve_keys` is not specified, the values are reindexed. If `preserve_keys`
    is set to `TRUE`, keys are retained.


    **Example:**

    ```php

    $array = array( ''name'' => ''bob'', ''job'' => ''dad'' );

    print_r( array_chunk($array, 1));

    $array = array( ''name'' => ''bob'', ''job'' => ''dad'' );

    print_r( array_chunk($array, 1, TRUE));

    ```


    ### `array_combine()`


    `key_array` – `$array`

    `value_array` – `$array`


    Creates a new array using the values from `key_array` as the keys and the values
    from `value_array` as the values.

    Note: Returns `FALSE` if number of entries in both arrays not match.


    **Example:**

    ```php

    $keys = array ( ''name'', ''job'', ''age'' );

    $values = array ( ''Bob'', ''knight'', 42 );

    $newarray = array_combine($keys, $values);

    print_r($newarray);

    ```


    ### `array_merge()`


    Can accept multiple array values, and behaves differently with only one argument
    If supplied with only one indexed `$array`, it reindexes that array continuously.
    If supplied with more than one `$array`, the content of both arrays are combined
    with all indexed keys included in the new array, while associative keys that are
    identical take the value of the last `$array` supplied.


    **Example:**

    ```php

    $array = array ( 3 => ''one'', 0 => ''two'', 2 => ''three'' );

    print_r( array_merge($array) );

    $array = array ( ''zero'', ''one'', ''name'' => ''Bob'' );

    $array2 = array ( ''alsozero'', ''name'' => ''John'', ''job'' => ''farmer'' );

    print_r( array_merge($array, $array2) );

    ```

