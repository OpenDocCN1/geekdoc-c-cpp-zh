    of sscanf() and provides explanation of formatting stringslist() – Assigns the
    values of an array to variable names![](image_rsrc7SR.jpg)quotes_flag – [optional]
    $string default: ENT_COMPAT (double quotes only) Other values:              ENT_QUOTES
    (both single and double quotes)ENT_NOQUOTES (neither double nor single)character_set
    – [optional] $string default: ISO-8859-1Converts some characters in $string with
