    - `array_shift($array)` – `array_splice($array, 0)`

    - `array_unshift($array)` – `array_splice($array, 0)`

    - `array_push($array)` – `array_splice($array, count($array), 0)`

    - `array_pop($array)` – `array_splice($array, -1)`


