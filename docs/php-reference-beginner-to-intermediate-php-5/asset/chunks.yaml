  trans: "\n\n感谢，祝你愉快！\n\n## 你应该了解的杂项\n\n并不是所有内容都能归入整齐的类别，PHP 中也不是所有内容都属于本参考书。然而，某些内容值得简单说明和关注，并应当包含在这里。\n\
    \n![](img/image_rsrc7MM.jpg)\n\n### 可移植性与兼容性\n\n为了移植性和兼容性，请始终使用长形式。\n- 长形式：`<?php\
    \ expr ?>`\n- 短形式：`<? expr ?>`\n- `<? echo expr ?>` 的短形式等价\n\n注意：不需要结束分号（`;`）。`<?=\
    \ expr ?>`\n![](img/image_rsrc7MN.jpg)\n\n所有语句必须以分号（`;`）结束！否则将产生错误。如果错误不明，你可能在某处漏掉了分号！！\n\
    \n[](image_rsrc7MP.jpg)\n\n### 引号\n\n`' '`（单引号）——单引号内部的内容按字面量评估。因此，`$string` 实际上意味着：(美元符号)string，而不代表变量的值。\n\
    示例：\n![](img/image_rsrc7MR.jpg)\n```php\n$string = 'Single Quotes'; echo '$string';\n\
    ```\n\n`\" \"`（双引号）——双引号内部的变量会求其值。\n示例：\n![](img/image_rsrc7MS.jpg)\n```php\n\
    $string = 'Double Quotes'; echo \"$string\";\n```\n![](img/image_rsrc7MT.jpg)\n\
    \n在双引号内应按字面量评估的转义字符。\n示例：\n```php\n$string = 'Double Quotes';\n```\n![](img/image_rsrc7MU.jpg)\n\
    ```php\necho \"\\$string is set as $string\";\n```\n![](img/image_rsrc7MV.jpg)\n\
    \n反斜杠 (`\\`) 问号 (`?`) 单引号 (`'`) 双引号 (`\"`) 美元符号 (`$`)\n示例：\n```php\n$string =\
    \ 'Hello World!';\n```\n![](img/image_rsrc7MW.jpg)\n```php\necho \"The variable\
    \ \\$string contains \\' $string \\' \\\" \\\\\";\necho 'The variable \\$string\
    \ contains \\' $string \\' \\\" \\\\';\n```\n![](img/image_rsrc7MX.jpg)\n\n###\
    \ 注释与特殊字符\n\n![](img/image_rsrc7MY.jpg)\n\n单行，用于双正斜线右侧的内容：\n```php\n// This is\
    \ a comment\n```\n\n多行，使用起始和结束标签：\n```php\n/*\n * This is a comment \n */\n```\n\
    ![](img/image_rsrc7MZ.jpg)\n\n- `\\n` – 新行\n- `\\r` – 回车\n- `\\t` – 制表符\n- `\\\
    b` – 退格\n[](image_rsrc7N0.jpg)\n\n### 常量\n\n- `name` – `$string`\n- `value` –\
    \ `$scalar`\n- `$boolean` – `[可选]` 默认值：`FALSE`，区分大小写\n\n定义常量，这是一个全局分配的设置值，使得函数和类可以直接使用，而无需将其作为参数传递。\n\
    示例：\n![](img/image_rsrc7N1.jpg)\n```php\ndefine('HELLO', 'Hello World!'); echo\
    \ HELLO;\ndefine('GREETINGS', 'Hello World!', TRUE); echo GREETINGS;\n```\n![](img/image_rsrc7N2.jpg)\n\
    ```php\necho greetings;\n```\n![](img/image_rsrc7N3.jpg)\n\n### 函数\n\n`function\
    \ functionname([arguments]) { }`\n\n函数可以放置在页面的任何位置，即使在实际创建函数之前调用它们也可以的。此规则的例外是，如果函数仅作为条件语句的一部分定义，那么在\
    \ fact 条件语句求值之前是无法调用。\n\n示例：\n```php\nhello();\n// 在条件语句上方，这会导致错误\nif (0==0){\n\
    \    function hello(){ echo 'Hello!';}\n}\n```\n[](image_rsrc7N4.jpg)\n```php\n\
    if (0==0){\n    function hello(){ echo 'Hello ';\n}\nhello();\nthere();\nfunction\
    \ there(){echo 'there'; }\n```\n[](image_rsrc7N5.jpg)\n\n函数可以没有参数（如上所示）、有传递的参数，或者带有默认参数的传递参数（可选）。参数名称在函数内部用作变量名使用。\n\
    \n```php\nfunction args($a, $b){\n    // 没有默认值，需要两个输入\n    echo \"a = $a, b =\
    \ $b\";\n}\n```\n[](image_rsrc7N6.jpg)\n```php\nargs(1,2);\n```\n\n使用以下函数的示例：\n\
    ```php\nfunction args($a = 1, $b = 2){\n    // 设置了默认值\n    $c = $a + $b;\n   \
    \ echo \"a = $a, b = $b, a+b = $c\";\n}\n```\n[](image_rsrc7N7.jpg)\n```php\n\
    args();\nargs(5,5);\n```\n[](image_rsrc7N8.jpg)\n\n![](img/image_rsrc7N9.jpg)\n\
    ```php\nargs(10);\nargs($DoesNotExist,20); // 不要这样做，请发送 (NULL,20) \n```\n[](image_rsrc7NA.jpg)\n\
    \n函数还可以返回一个 `$variable`（包括数组）：\n```php\nfunction Add($one,$two){\n    $total =\
    \ $one + $two;\n    return $total;\n}\n$a = 2;\n$b = 3;\n```\n![](img/image_rsrc7NB.jpg)\n\
    ```php\n$result = Add($a,$b); // 将 $total 的值赋值给 $result\necho $result;\n```\n\
    ■​ ■​ ■\n\n| 如果多个页面将引用相同的函数，请创建一个单独的 `functions.php` 文件（名称自自定义），并在需要使用这些函数的页面中使用\
    \ `require()` 或 `require_once()`。为了速度和文件大小，页面特定的函数应直接包含在必要的页面中。 |\n\n"
- fmt: "\n![](image_rsrc7NC.jpg)Stops the current script and outputs the optional\
    \ `$string`.\n\nExample:\n```php\n$result = @mysql_connect('db', 'user', 'pw')\
    \ or die('Unable to connect to database!'); \necho 'If it fails, this will never\
    \ be seen';\n```\n![](image_rsrc7ND.jpg)\nNote: The above output would only display\
    \ if it failed. If the `@` was not present before `mysql_connect()`, PHP would\
    \ output a warning as well.\n\n![](image_rsrc7NE.jpg)\n\n### eval($string)\nEvaluates\
    \ a string as if it was code. This can be used to store code in a database and\
    \ have it processed dynamically by PHP as if it were part of the page. All appropriate\
    \ aspects of code must be included, such as escaping items with a backslash (`\\\
    `) and including a semicolon (`;`) at the end of the string.\n\nExample:\n```php\n\
    $name = 'Mario';\n$string = 'My name is $name.'; // Note the single quotes\necho\
    \ $string;\n$code = \"\\$evalstring = \\\" $string \\\" ;\";// Effect of backslash\
    \ escape:\n$code = \"$evalstring = \" $string \"\";\neval($code); // eval($evalstring\
    \ = \" My name is $name \" ;);\n```\n![](image_rsrc7NF.jpg) // $evalstring is\
    \ the same as $string, except with double quotes now\necho $evalstring;\n\n![](image_rsrc7NG.jpg)\n\
    \n### sleep($integer)\nPauses PHP for `$integer` amount of seconds before continuing.\n\
    \nExample:\n```php\nsleep(2); // pause for 2 seconds\n```\n![](image_rsrc7NH.jpg)\n\
    \n### usleep($integer)\nPauses PHP for `$integer` amount of microseconds before\
    \ continuing.\n\nExample:\n```php\nusleep(1000000); // pause for 1 second\n```\n\
    ![](image_rsrc7NJ.jpg)\n\n### uniqid($prefix)\nentropy – [optional] `$boolean`\
    \ default: FALSE, 13 character output\nGenerate a unique ID based on the `$scalar`.\
    \ If no input is given, the current time in microseconds is used automatically.\
    \ This is best used in combination with other functions to generate a more unique\
    \ value. If the `$scalar` is an empty string ('') and `entropy` is set to TRUE,\
    \ a 26 character output is provided instead of a 13 character output.\n\nExamples:\n\
    ![](image_rsrc7NK.jpg)\n```php\n$id = uniqid(); echo $id;\n$random_id = uniqid(mt_rand());\
    \ echo $random_id;\n```\n![](image_rsrc7NM.jpg)\n\n### md5($string)\n![](image_rsrc7NN.jpg)\n\
    ```php\n$md5 = md5($random_id); echo $md5;\n```\nSee Also: `md5()` – MD5 algorithm\
    \ based encryption\n\n![](image_rsrc7NP.jpg)\n\n### setcookie($name, $value, $expire,\
    \ $path, $domain, $secure, $httponly)\nname – `$string`\nvalue – [optional] `$string`\n\
    time – [optional] `$integer` default : till the end of the session\npath – [optional]\
    \ `$string` default : current directory\ndomain – [optional] `$string` default\
    \ : current domain (e.g. http://www.example.com)\nsecure – [optional] `$boolean`\
    \ default : FALSE, does not require a secure connection\nhttponly – [optional]\
    \ `$boolean` default : FALSE, available to scripting languages\n\nSets a cookie\
    \ 2, visible to the server on the next page load. To send then default value,\
    \ use a set of single quotes ('') for each argument you want to skip except the\
    \ time argument, which should use 0 to send the default value. In most cases,\
    \ providing the name, value, time, and domain will cover most uses (with '' for\
    \ path ).\n\nExamples:\n```php\nsetcookie('Cookie','Set till end of this session',0);\n\
    // This will display properly after the page has been reloaded\nprint_r($_COOKIE);\n\
    Array ( [Cookie] => Set till end of this session )\n```\n![](image_rsrc7NR.jpg)\n\
    ```php\nsetcookie('Cookie','Set for 60 seconds for all subdomains of example.com,\
    \ such as www., mail., etc.',time()+60,'','.example.com');\nprint_r($_COOKIE);\n\
    ```\nSome common times used for expiration:\n- `time()+60*60*24` is equal to 1\
    \ day\n- `time()+60*60*24*30` is equal to 30 days\n- `time()-1` is one second\
    \ in the past, used to expire/delete a cookie\n\n```php\nsetcookie('Cookie','',time()-1);\
    \ // expires the Cookie named 'Cookie'. Note the empty string for value\n```\n\
    \n### urlencode($string)\nChanges the formatting of `$string` to the proper format\
    \ for passing through a URL, such as part of a GET query, returning the new string.\n\
    \nExample:\n```php\n$string = 'Hello There! How are you?';\necho urlencode($string);\n\
    Hello+There%21+How+are+you%3F\n```\n\n### urldecode($string)\nChanges the formatting\
    \ of `$string` from the URL compatible (such as a GET query) format to human readable\
    \ format, returning the new string.\n\nExample:\n```php\n$string = 'Hello+There%21+How+are+you%3F';\n\
    echo urldecode($string);\nHello There! How are you?!\n```\n![](image_rsrc7MK.jpg)\n\
    \n### 2\nMust be sent prior to any headers or anything else is sent to the page\
    \ (including the `<html>` tag). See `ob_start()` for an easy way to make this\
    \ work\n\n![](image_rsrc7NS.jpg)\n\n### get_magic_quotes_gpc()\nReturns 0 if it\
    \ is off, 1 otherwise.\nUsed to determine if magic quotes is on. This check is\
    \ used for code portability and determining if the addition of backslashes is\
    \ necessary for security purposes and preventing SQL injection. `Magic_quotes_gpc`\
    \ processes GET/POST/Cookie data and, if turned on, automatically processes the\
    \ above data every time with `addslashes()`.\n\nExample:\n```php\nif (get_magic_quotes_gpc()){\n\
    \    echo 'Magic Quotes is on!';\n}else{\n    echo 'Magic Quotes is NOT on, use\
    \ addslashes()!';\n}\n```\n![](image_rsrc7NT.jpg)\nSee Also:\n- `addslashes()`\
    \ – Add backslashes to certain special characters in a string\n- `strilashes()`\
    \ – Remove backslashes from certain special characters in a string\n\n![](image_rsrc7NU.jpg)\n\
    \n### phpinfo($option)\noption – [optional] Used with a specific `$integer` or\
    \ `$string` to display only a portion of `phpinfo()`. Specific options excluded\
    \ for simplicity.\nBy default, `phpinfo()` will display everything about the PHP\
    \ installation, including the modules, version, variables, etc.\n\nExample:\n\
    ```php\nphpinfo();\n```\n![](image_rsrc7NV.jpg)\n\n### error_reporting and ini_set\n\
    To catch programming errors, mistakes, or make sure that PHP is not making any\
    \ assumptions about your code, troubleshooting is best done with all PHP errors\
    \ being displayed. The following two lines of code will enable this mode:\n```php\n\
    error_reporting(E_ALL);\nini_set('display_errors', '1');\n```\n![](image_rsrc7NW.jpg)\n\
    \n### mail($to, $subject, $message, $headers, $parameters)\nto – `$string`\nsubject\
    \ – `$string`\nmessage – `$string`\nheaders – [optional] `$string`\nparameters\
    \ – [optional] `$string`\nThis uses the sendmail binary which may not be configured\
    \ or available depending on your system/setup. This is included here for basic\
    \ reference. The configuration and security concerns are outside of the scope\
    \ of this book.\n"
