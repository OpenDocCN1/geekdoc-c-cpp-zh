  \ `array_splice($array, 0)`\n- `array_unshift($array)` – `array_splice($array, 0)`\n\
  - `array_push($array)` – `array_splice($array, count($array), 0)`\n- `array_pop($array)`\
  \ – `array_splice($array, -1)`\n\n### array_unique($array)\n返回一个去除了 `$array` 中所有重复值的数组。\n\
  \n示例：\n```php\n$array = array( 'zero', 'one', 'zero', 'three' );\n$new = array_unique($array);\n\
  print_r($new);\n```\n![](img/image_rsrc7XH.jpg) (image_rsrc7XK.jpg)\n- `sort_flag`\
  \ – `[optional]` 默认：`SORT_REGULAR`（正常比较）。其他值：`SORT_NUMERIC`、`SORT_STRING`、`SORT_LOCALE_STRING`\n\
  \n从低到高排序 `$array` 的值并重新索引所有值。默认情况下，项正常比较，但在包含 `sort_flag` 时可以进行更改。\n\n示例：\n```php\n\
  $array = array( 'babe', 1, 'name' => 'Bob' );\nsort($array);\nprint_r($array);\n\
  ```\n![](img/image_rsrc7XM.jpg)\n```php\n$array = array( 'babe', 1, 'name' => 'Bob'\
  \ );\nsort($array, SORT_NUMERIC);\nprint_r($array);\n```\n![](img/image_rsrc7N.jpg)\n\
  ```php\n$array = array( 'babe', 1, 'name' => 'Bob' );\nsort($array, SORT_STRING);\n\
  print_r($array);\n```\n![](img/image_rsrc7XP.jpg)\n从高到低排序 `$array` 的值并重新索引所有值，销毁所有键。默认情况下，项正常比较，但在包含\
  \ `sort_flag` 时可以进行更改。\n\n示例：\n```php\n$array = array( 'babe', 'apple', 'name' =>\
  \ 'Bob' );\nrsort($array);\nprint_r($array);\n```\n![](img/image_rsrc7XS.jpg)\n\
  ```php\n$array = array( 'babe', 'apple', 'name' => 'Bob' );\nksort($array);\nprint_r($array);\n\
  ```\n![](img/image_rsrc7XT.jpg)\n从低到高排序 `$array` 的值并保持键。默认情况下，项正常比较，但在包含 `sort_flag`\
  \ 时可以进行更改。\n\n示例：\n```php\n$array = array( 'babe', 'apple', 'name' => 'Bob' );\n\
  asort($array);\nprint_r($array);\n```\n![](img/image_rsrc7XV.jpg)\n```php\n$array\
  \ = array( 'babe', 'apple', 'name' => 'Bob' );\narsort($array);\nprint_r($array);\n\
  ```\n![](img/image_rsrc7WU.jpg)\n从高到低排序 `$array` 的值（按键）。默认情况下，项正常比较，但在包含 `sort_flag`\
  \ 时可以进行更改。\n\n示例：\n```php\n$array = array( 'cute', 'fruit' => 'apple', 'name' =>\
  \ 'Bob' );\nksort($array);\nprint_r($array);\n```\n![](img/image_rsrc7XY.jpg)\n\
  从低到高排序 `$array` 的项（按键）。默认情况下，项正常比较，但在包含 `sort_flag` 时可以进行更改。\n\n示例：\n```php\n$array\
  \ = array( 'cute', 'fruit' => 'apple', 'name' => 'Bob' );\nkrsort($array);\nprint_r($array);\n\
  ```\n![](img/image_rsrc7XZ.jpg)\n### extract(variable_names)\n可以接受多个 `variable_names`。创建一个键等于\
  \ `variable_name` 且值等于 `variable_name` 的数组。如果 `variable_name` 是数组，则该数组的值被用作变量名。\n\
  \n注意：全局变量不能与 `compact()` 使用。\n\n示例：\n```php\n$variable = 'value';\n$integer = 10;\n\
  $name = 'Bob';\n$array = array( 'name', 'age' );\n$result_array = extract('variable',\
  \ 'integer', $array);\nprint_r($result_array);\n```\n![](img/image_rsrc7Y2.jpg)\
  \ (image_rsrc7Y3.jpg)\n- `type` – `[optional]` 默认：`EXTR_WRITE`（如果冲突则覆盖）。其他值：`EXTR_SKIP`（如果冲突时不覆盖）、`EXTR_SAME`（如果冲突则前缀）、`EXTR_ALL`（带前缀）、`EXTR_INVALID`（带前缀的数字）、`EXTR_IF_EXISTS`（如果变量存在则带前缀创建，否则跳过）、`EXTR_FS`（作为引用提取）。\n\
  - `prefix` – `[optional]` 仅当 `type` 设置为包含 `PREFIX` 的值时有效。前缀总是通过下划线（`_`）附加。\n\n这些函数都特定于数组的内部指针。\n\
  \n这些函数都特定于数组的内部指针。`current()` – 返回当前条目的值。`key()` – 返回当前条目的键。`next()` 将指针向前移动一个位置。`prev()`\
  \ 将指针向后移动一个位置。`end()` 将指针移动到末尾。`reset()` 将指针重置到开头。\n\n示例：\n```php\n$array = array(\
  \ 'zero', 'one', 'two', 'three', 'four' );\ncurrent($array); // 返回 zero\nkey($array);\
  \ // 返回 0\nnext($array); // 移动到 one\ncurrent($array); // 返回 one\n```\n\n\n\n\n\n\
