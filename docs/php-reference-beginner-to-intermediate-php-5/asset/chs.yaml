  ```php\nis_file('file.txt');\n```\n\n![](img/image_rsrc82S.jpg)\n清除系统缓存的由特定函数收集的某些文件信息（如下）。用于在同一脚本/页面内修改并重新评估文件时。影响以下函数：`file_exists()`、`is_writable()`、`is_readable()`、`is_file()`、`is_dir()`、`fileatime()`、`filemtime()`、`filesize()`、`stat()`、`lstat()`、`is_executable()`、`is_link()`、`filectime()`、`fileinode()`、`filegroup()`、`fileowner()`\
  \ 和 `fileperms()`。\n\n\n\n\n\n## 常用八进制模式\n\n| 模式 | 描述 |\n| :--- | :--- |\n| `0777`\
  \ | 所有人可读、写、执行 |\n| `0755` | 所有者读/写/执行，其他人可读/执行 |\n| `0644` | 所有者读/写，其他人可读 |\n|\
  \ `0600` | 所有者读/写，其他人无访问权限 |\n| `0754` | 所有者读/写/执行，组用户可读/执行，其他人可读 |\n\n## 输出控制（输出缓冲区）\n\
  \n想象你将所有的代码、所有的输出内容都塞进一个大袋子里，然后一次性倒在柜台上，或者如果你愿意的话，直接扔进垃圾桶。代码仍然在运行，只是输出变了。这就是输出缓冲的概述。此外，它还让事情变得更容易，特别是在处理头和\
  \ cookie 时，这些内容都需要按照特定的顺序发送给用户。![](img/image_rsrc82X.jpg)\n\n尝试立即将所有输出推送到用户/浏览器，而不是等待脚本完成。\n\
  \n**注意：** 如果你处于输出缓冲区 `ob_start()` 中，你还需要调用 `ob_flush()`。\n\n## 示例\n\n```php\nfor($x=0;$x<=1000;$x++){\
  \ // 循环 1001 次\n    echo $x;\n    flush(); // 将每个 echo $x 发送到浏览器\n    // 如果不存在 flush()，它将在脚本/循环结束时\n\
  \    // 一次性将整个数字链输出到浏览器\n}\n```![](img/image_rsrc82Y.jpg)\n\n```php\nob_start();\
  \ // 开启输出缓冲区\nfor($x=0;$x<=1000;$x++){ // 循环 1001 次\n    echo $x;\n    flush();\
  \ // 将输出发送到输出缓冲区\n}\nob_flush(); // 将输出缓冲区发送到浏览器并清空\n// 如果不存在 ob_flush()，它将在脚本/循环结束时\n\
  // 一次性将整个数字链输出到浏览器\n```![](img/image_rsrc82Z.jpg)\n\n**另见：** `ob_flush()` – 从输出缓冲区刷新输出。\n\
  \n## `flush()` 的用法\n\n使用 `flush()` 是为了在脚本运行时间较长时给运行脚本的用户提供反馈，否则他们可能会面对一个空白页面。例如，当从文件逐行向数据库导入大量数据时，你可以在每行完成后在屏幕上提供一个点（`.`），并每隔\
  \ 70 个左右的点换一次行，向用户提供程序正在运行的反馈。虽然这可能会慢一点，但如果他们认为认为出了问题而停止脚本，情况会更糟。\n\n作为对比，这里显示了一个简单的脚本，并使用了每种方法的不同时间测试作为比较。\n\
  \n```php/*以下所有方法都使用其外围的代码来生成完成时间。所示的输出仅为完成时间，而不是随之 echo 出来的长串数字。*/\n$time = microtime(1);\
  \ // 开始\n// 示例代码在此处\n$time = number_format(microtime(1)-$time, 6); echo \"$time\
  \ seconds to complete\"; // 结束\n```\n\n### 时间测试对比\n\n| 方法 | 结果 |\n| :--- | :---\
  \ |\n| `for($x=0;$x<=100000;$x++){ echo $x;}` | `0.468251 seconds to complete` |\n\
  | `for($x=0;$x<=100000;$x++){ echo $x;flush();}` | `3.616512 seconds to complete`\
  \ |\n| `ob_start(); for($x=0;$x<=100000;$x++){echo $x;}` | `0.182167 seconds to\
  \ complete` |\n| `ob_start(); for($x=0;$x<=100000;$x++){echo $x; flush();// 没有 ob_flush()，在脚本完成前不会输出给用户}`\
  \ | `0.762600 seconds to complete` |\n| `ob_start(); for($x=0;$x<=100000;$x++){echo\
  \ $x; flush(); ob_flush();}` | `4.443787 seconds to complete` |\n\n![](img/image_rsrc830.jpg)\n\
  \n## 缓冲区函数\n\n### `use_include_path` – [可选] `$boolean` 默认：`FALSE`\n读取名称/路径为 `$string`\
  \ 的文件内容并将其写入输出中，类似于将内容读入字符串然后 echo 该字符串。如果 `use_include_path` 设置为 `TRUE`，则会在 PHP\
  \ `include_path` 中搜索该文件。\n\n**示例：**![](img/image_rsrc831.jpg)\n```php\n// file.txt\
  \ 内容：Hello World\nreadfile('file.txt');\n```![](img/image_rsrc832.jpg)\n\n### `callback_function`\
  \ – [可选] `$string`（函数名）\n### `flush_size` – [可选] `$integer` 默认：`0`（在结束时刷新）\n其他预设值：`1`（将大小设置为\
  \ 4096）\n### `erase` – [可选] `$boolean` 默认：`TRUE`，缓冲区在 `flush_size` 时清空\n启动一个输出缓冲区，在将其发送给用户/浏览器之前存储所有输出。在脚本结束时或通过指定的\
  \ `ob_*()` 函数时一次性发送。\n\n如果指定了 `callback_function`，存储中的输出将作为字符串发送给名为 `callback_function`\
  \ 的函数，当脚本完成或调用 `ob_end_flush()` 时。关闭缓冲区。该函数应返回一个字符串，以便输出到用户/浏览器。\n\n如果设置了 `flush_size`，当某部分输出超过\
  \ `flush_size` 长度时，缓冲区将被刷新（同于 `ob_flush()`）。如果 `erase` 设置为 `FALSE`，缓冲区在脚本结束之前不会删除。\n\
  \n**注意：** 如果指定的 `callback_function` 失败，则返回 `FALSE`。\n\n**示例：**\n\n```php\nob_start();\n\
  ```![](img/image_rsrc833.jpg) // 此处生成输出的代码\n```php\nfunction ChangeName($buffer){\n\
  \    // 在缓冲区中将所有的 'username' 替换为 'Bob'\n    $buffer = str_replace('username', 'Bob',\
  \ $buffer);\n    return $buffer; // 返回新缓冲区进行输出\n}\n```\n```php\nob_start('ChangeName');\n\
  echo 'My name is username';\n```![](img/image_rsrc834.jpg)\n```php\nfunction ChangeName($buffer){\n\
  \    $buffer = $buffer . '||'; // 在缓冲区末尾添加 ||\n    return $buffer;\n}\nob_start('ChangeName',10);\n\
  echo 'My name is Mario';\necho 'My name is Mario';\n```\nMy name is Mario||My name\
  \ is Mario\n\n有一个名为 `ob_gzhandler` 的内置函数，它会在将输出送到用户/浏览器之前对缓冲区进行压缩。调用它使用：\n```php\n\
  ob_start('ob_gzhandler');\n```\n\n输出缓冲区会自动将 `header()` 和 `setcookie()` 的输出重新排列到页面顶部，从而避免\
  \ Apache 错误。这使得在脚本某处出错时，很容易在 `header()` 中包含重定向，即使在脚本早期部分已经向页面输出了数据。重定向和头部信息将放在前面，用户永远看不到那些数据。\n\
  \n```php\nob_start();\necho 'You will never see this';\nif ($baduser){ // 如果 $baduser\
  \ 为 TRUE\n    header('Location: http://www.someotherplace.com');\n}\nob_end_flush;\
  \ // 结束缓冲区并将输出发送给用户\n```\n\n\n\n\n\n`ob_flush()` 将缓冲区中的所有内容发送给用户/浏览器，就像你已经到达脚本结束一样，并清空缓冲区当前的内容。缓冲区不会关闭。\n\
  示例：\n```php\nob_start();\necho 'Send me now!'; ob_flush();\necho 'Send me at the\
  \ end of the script.';\n// Output:\n// Send me now!Send me at the end of the script.\n\
  ```\n\n`ob_clean()` 丢弃/删除输出缓冲区当前的内容。缓冲区不会关闭。\n示例：\n```php\nob_start();\necho 'I\
  \ will never be seen'; ob_clean();\n![](img/image_rsrc835.jpg) echo 'Send me at\
  \ the end of the script.';\n![](img/image_rsrc836.jpg)\n```\n\n`ob_end_flush()`\
  \ 将当前输出缓冲区的所有内容发送给用户/浏览器，就像你已经到达脚本结束一样，清空缓冲区当前的内容。随后关闭缓冲区。此函数会在存在 `ob_start()` 的脚本/页面结束时自动调用。\n\
  示例：\n```php\nob_start();\necho 'Send me now!'; ob_end_flush();\n![](img/image_rsrc837.jpg)\
  \ // 剩余代码不会被缓冲。\n![](img/image_rsrc838.jpg)\n```\n\n`ob_end_clean()` 丢弃/删除当前输出缓冲区当前的内容，然后关闭缓冲区。\n\
  示例：\n```php\nob_start();\necho 'I will never be seen'; ob_end_clean();\n![](img/image_rsrc839.jpg)\
  \ // 后的代码不会被缓冲\necho 'Send me at the end of the script.';\n![](img/image_rsrc83A.jpg)\n\
  ```\n\n`ob_get_flush()` 返回一个包含当前输出缓冲区所有内容的字符串，刷新/发送缓冲区内容到用户/浏览器，清空缓冲区当前的内容并最后关闭。\n\
  示例：\n```php\nob_start();\necho 'Send me, store me. ';![](img/image_rsrc83B.jpg)\n\
  $buffer = ob_get_flush(); // 缓冲区已关闭\necho \"buffer: $buffer\";\n```\n\n`ob_get_clean()`\
  \ 将当前缓冲区的内容返回为字符串，然后丢弃/删除缓冲区当前的内容，最后关闭缓冲区。\n示例：\n```php\nob_start();\necho 'I will\
  \ exist in a string';\n$buffer = ob_get_clean(); // 缓冲区已关闭\necho \"buffer: $buffer\"\
  ;\n// Output: buffer: I will exist in a string\n```\n\n`ob_get_contents()` 返回一个包含当前输出缓冲区所有内容的字符串，但不清除它。缓冲区不会关闭。\n\
  示例：\n```php\nob_start();\necho 'Send me, store me. ';\n$buffer = ob_get_contents();\n\
  ob_end_clean(); // 关闭并擦除缓冲区\necho \"buffer: $buffer\";\n// Output: buffer: Send\
  \ me, store me.\n```\n\n`ob_get_length()` 返回当前输出缓冲区长度的整数。\n示例：\n```php\nob_start();\n\
  ![](img/image_rsrc83C.jpg) echo 'Hello World!';\nvar_dump( ob_get_length() );\n\
  echo 'Hello again...';\nvar_dump( ob_get_length() );\n```\n\n`ob_get_level()` 返回一个包含嵌套输出缓冲区数量的整数，如果未启用输出缓冲则返回\
  \ 0。\n示例：\n```php\n![](img/image_rsrc83D.jpg) var_dump( ob_get_level() );\nob_start();\
  \ // 第一输出缓冲区\nob_start(); // 第二输出缓冲区\nvar_dump( ob_get_level() );\n```\n\n## 会话\
  \ (Sessions)\n\nSession 在 PHP 中用于提供在整个网站跟踪用户的方法，并在用户访问期间在页面之间传递有关该用户的数据。用户被分配一个唯一的\
  \ ID，数据存储在服务器本身，而不是像 Cookie 那样存储在用户的计算机上。Session 最常见的用法是电子商务网站，使其具备购物车、用户登录和自定义界面以及导航历史的功能。\n\
  ![](img/image_rsrc83E.jpg)\n\n`session_start()` 开启新会话，或根据 cookie 中存储或通过 GET 或 POST\
  \ 传递的 session id 继续已打开的会话。\n注意：如果使用 `ob_start()` 函数，请将其放在 `session_start()` 之前。其次，当不使用\
  \ `ob_start()` 时，必须在生成任何输出之前调用 `session_start()`。\n示例：\n```php\nsession_start();\n\
  ![](img/image_rsrc83F.jpg) echo \"Your session id is \" . session_id();\n\nsession_start();\n\
  ![](img/image_rsrc83G.jpg) $_SESSION['color'] = 'blue';\n![](img/image_rsrc83H.jpg)\n\
  ```\n\n`session_unset()` 取消/移除所有会变量，本质上删除了 `$_SESSION` 全局变量数组中的所有项。\n注意：如果你想取消特定的键，请使用\
  \ `unset($_SESSION['key'])`。\n示例：\n```php\nsession_start();\n$_SESSION['color']\
  \ = 'blue';\necho $_SESSION['color'];\nsession_unset();\n![](img/image_rsrc83J.jpg)\
  \ echo $_SESSION['color'];\n```\n另请：`session_destroy()` – 销毁与会话相关的一切\n\n`session_destroy()`\
  \ 销毁/删除当前会话。存储在 `$_SESSION` 中的值不会被删除，会话 cookie 也也不会删除（见下文提示）。\n注意：如果你仍然想拥有会话，则在\
  \ `session_destroy()` 之后再次调用 `session_start()`。\n示例：\n```php\nsession_start();\n\
  $_SESSION['color'] = 'blue';\necho $_SESSION['color'];\nsession_unset();\n![](img/image_rsrc83K.jpg)\
  \ echo $_SESSION['color'];\n```\n另：\n- `session_unset()` – 移除分配给 `$_SESSION` 的变量\n\
  - `session_regenerate_id()` – 重新创建 session id\n- `setcookie()` – 创建或删除 cookie\n\n\
  要完全销毁会话，你必须同时删除 cookie。这通过 `setcookie()` 函数实现。\n```php\nsession_start(); // 加载会话\n\
  session_destroy(); // 销毁会话\nsession_unset(); // 删除 $_SESSION 中的所有变量\nsetcookie(\
  \ session_name(), '', time()-1 ); // 设置 cookie 在一秒前过期，本质上将其删除\n```\n\n\n\n\n\n![](img/image_rsrc7MK.jpg)\
  \ 22 使用 `session_unset()` 或 `$_SESSION = array();` 移除 session 变量 ![](img/image_rsrc83M.jpg\n\
  \n返回 session 名称。如果提供了 `$string`，则 session 名称被设置为 `$string` 的值。如果不使用 `session_name()`，默认的\
  \ session 名称为 `PHPSESSID`。\n注意：如果设置 session 名称，应在 `session_start()` 之前调用。\n示例：\n\
  ```php\nsession_name('SessionName'); session_start();\n```\n![](img/image_rsrc83N.jpg)\
  \ echo session_name();![](img/image_rsrc83P.jpg)返回一个包含 session id 的字符串。如果提供了 `$string`，则\
  \ session id 被设置为 `$string` 的值。\n注意：如果设置 session id，应在 `session_start()` 之前调用。\n\
  示例：\n```php\nsession_id('1234567890abcdefgh'); session_start();\n```\n![](img/image_rsrc83R.jpg)\
  \ echo session_id();![](img/image_rsrc83S.jpg)delete_old_session – [可选] $boolean\
  \ 默认: FALSE，保持相同 session 生成一个新的 session id，不会丢失 id 以外的当前 session 信息。如果 `delete_old_session`\
  \ 设置为 TRUE，则删除旧的关联 session 文件。\n示例：\n```php\nsession_start();\necho session_id()\
  \ . ' || '; session_regenerate_id(); echo session_id();\n```\n![](img/image_rsrc83T.jpg)session_write_close()结束当前的\
  \ session 并存储当前的 session 数据。这会在脚本/页面结束时自动发生，但也可以用于更快地访问 session 信息，因为 session 一时间被一个脚本锁定。\n\
  示例：\n```php\nsession_start();\nsession_write_close(); // 无论如何，页面结束时都会执行\n```\n![](img/image_rsrc83U.jpg)##\
  \ 正则表达式\n\n有时你想检查特定的结构而不是特定的值。正则表达式允许这种匹配。除了下文的几个示例和包含的一些正则表达式语法外，这里没有提供关于正则表达式的教程（那可以单独写一本书）。\n\
  \n### 正则表达式语法\n\n- `^` – 字符串开始\n- `$` – 字符串结束\n- `.` – 任意单个字符\n- `()` – 表达式组\n-\
  \ `[]` – 项目范围（例如 `[afg]` 意味着 a、f 或 g）\n- `[^]` – 不在范围内的项目（例如 `[^cde]` 意味着不是 c、d\
  \ 或 e）\n- `-` (连字符号) – 项目范围内的字符范围（例如 `[a-z]` 意味着 a 到 z）\n- `|` (管道符) – 逻辑或（例如 `(a|b)`\
  \ 意味着 a 或 b）\n- `?` – 前一个字符/项目范围的零或一次\n- `*` – 前一个字符/项目范围的零次或多次\n- `+` – 前一个字符/项目范围的一次或多次\n\
  - `{integer }` – 恰好整数次的前一个字符/项目范围（例如 `a{2}`）\n- `{integer ,}` – 整数次或更多次的前一个字符/项目范围（例如\
  \ `a{2,}`）\n- `{integer ,integer }` – 从整数到整数（例如 `a{2,4}` 意味着 2 到 4 个 a）\n- `\\`\
  \ – 转义字符\n- `[:punct:]` – 任意标点符号\n- `[:space:]` – 任意空白字符\n- `[:blank:]` – 任意空格或制表符\n\
  - `[:digit:]` – 任意数字：0 到 9\n- `[:alpha:]` – 所有字母：a-z 和 A-Z\n- `[:alnum:]` – 所有数字和字母：0-9，a-z\
  \ 和 A-Z\n- `[:xdigit:]` – 十进制数字\n- `[:print:]` – 任意打印字符\n- `[:upper:]` – 所有大写字母：A-Z\n\
  - `[:lower:]` – 所有小写字母：a-z\n\n### 仅限 PERL 兼容 (PCRE) ( preg_*() )\n\n`/` - 表达式前后的分隔符\n\
  \n**字符类：**\n- `\\c` – 控制字符\n- `\\s` – 空白\n- `\\S` – 非空白\n- `\\d` – 数字 (0-9)\n- `\\\
  D` – 非数字\n- `\\w` – 字母 (a-z, A-Z)\n- `\\W` – 非字母\n- `\\x` – 十进制数字\n- `\\O` – 进制数字\n\
  \n**修饰符：**\n- `i` – 不忽略大小写\n- `.` – 点匹配换行符\n- `m` – `^` 和 `$` 匹配行\n- `U` – 非贪婪匹配\n\
  - `e` – 计算替换结果\n- `x` – 跨多行的模式\n\n`ereg( pattern , $string [, group_array ])`\n\
  - `pattern` – `$string` 正则表达式\n- `group_array` – [可选] 用于正则表达式组的数组名称\n\n在 `$string`\
  \ 中匹配 `pattern` 中的正则表达式。如果 `pattern` 中的项目被分组 `()`，则提供一个用于数组的变量名来分配这些组的值，将其设置为 `group_array`。\n\
  匹配失败时返回 FALSE，如果未提供 `group_array` 则返回 1，并返回 `$string` 的长度。\n**示例：**\n```php\n$regex\
  \ = \"^[A-Z][a-z]+\"; // 开始，一个大写字母，一个或多个小写字母，结束\n$string = \"Hello\";\nvar_dump(\
  \ ereg($regex, $string) );\n\n$regex = \"^([A-Z][a-z]+)[[:space:]]+\"; // 开始（一个大写字母，多个小写字母），一个或多个空格，结束\n\
  $string = \"Hello World\";\nvar_dump( ereg($regex, $string) );\n```![](img/image_rsrc7MK.jpg)`gi(\
  \ pattern , $string [, group_array ])`\n- `pattern` – `$string` 正则表达式\n- `group_array`\
  \ – [可选] 用于正则表达式组的数组\n\n以忽略大小写的方式在 `$string` 中匹配 `pattern` 中的正则表达式。如果 `pattern`\
  \ 中的项目被分组 `()`，则提供一个数组的变量名来分配这些组的值，将其设置为 `group_array`。\n匹配失败时返回 FALSE，如果未提供 `group_array`\
  \ 则返回 1，如果提供了 `group_array` 则返回 `$string` 的长度。\n**示例：**\n```php\n$regex = \"^[a-z]+\"\
  ;\n$string = \"Hello\";\nvar_dump( eregi($regex, $string) ); // int(1)\n```\n\n\
  `ereg_replace( pattern , replacement , $string)`\n- `pattern` – `$string` 正则表达式\n\
  - `replacement` – `$string` `\\digit` 代表 `()` 匹配\n\n返回经 `pattern` 评估并替换为 `replacement`\
  \ 格式的字符串 `$string`。正则表达式模式中组 `()` 中的项目可以在 `replacement` 中重用，并通过 `\\digit` ，`\\0`\
  \ 代表整个字符串，`\\1` 是第一个分组匹配，`\\2` 等。\n注意：如果没有找到匹配，则返回原始 `$string`。\n**示例：**\n```php\n\
  $string = 'Hello';\n$pattern = \"^([A-Z])[a-z]+$\"; // 模式：开始，一个大写，多个小写，结束\n$replacement\
  \ = \".\\1.\"; // 替换：在第一个组和整个字符串周围加上点\n$newstring = ereg_replace($pattern, $replacement,\
  \ $string); echo $newstring;\n\n$string = '5551234567'; // 不带标点的数字\n$pattern = \"\
  ^([0-9]{3})([0-9]{4})$\";\n$replacement = \"(\\1)\\2-\\3\"; // 替换：数字格式\n$newstring\
  \ = ereg_replace($pattern, $replacement, $string); echo $newstring;\n```\n\n`egireplace()`\
  \ – `eregreplace()` 的忽略大小写版本\n- `pattern` – `$string` 正则表达式\n- `replacement` – `$string`\
  \ `\\digit` 代表 `()` 匹配（例如 `\\0` 字符串）\n\n返回经 `pattern` 评估并替换为 `replacement` 格式的字符串\
  \ `$string`。正则表达式模式中组 `()` 中的项目可以在 `replacement` 中重用，并通过 `\\digit` ，`\\0` 代表整个字符串，`\\\
  1` 是第一个分组匹配，`\\2` 等。\n注意：如果没有找到匹配，则返回原始 `$string`。\n**示例：**\n```php\n$string = 'Hello';\n\
  $pattern = \"^([a-z])[a-z]+$\";// 模式：开始，一个字母，一个或多个字母，结束\n$replacement = \".\\1.\\\
  0.\"; // 替换：在第一个组和整个字符串周围加上点\n$newstring = egireplace($pattern, $replacement, $string);\
  \ echo $newstring;\n```\n\n`preg_replace( pattern , replacement , subject [, limit\
  \ ] [, count ])`\n- `pattern` – `$string` 或 `array` 正则表达式(s)\n- `replacement` –\
  \ `$string` 或 `array`\n- `subject` – `$string` 或 `array`\n- `limit` – [可选] $integer\
  \ 默认: -1，无限制\n- `count` – [可选] 包含 $integer 的变量名\n\n在 `subject` 中将所有匹配 `pattern`\
  \ 的实例替换为 `replacement`。如果 `subject` 是数组，则匹配和替换发生在数组的所有项目上。要在 `replacement` 中引用 `pattern`\
  \ 中创建的组 `()`，使用 `${digit}`，其中 `${0}` 代表整个字符串，`${1}` 是第一个组，依此类推。如果 `pattern` 和 `replacement`\
  \ 是数组，则对数组中的每个条目处理整个 subject，找到 `pattern` 中的第一个项并将其替换为 `replacement` 中的第一个项，然后对下一组条目重复。如果\
  \ pattern 数组中的值比 replacement 数组多，则使用空字符串（''`）作为替换。如果 `pattern` 是数组而 `replacement`\
  \ 是字符串，则它用于 pattern 中的每个条目。可选的 `count` 变量将被设置为发生的替换总数。\n注意：这是 PERL/PCRE，且表达式分隔符\
  \ (`/`) 可以与表达式末尾的修饰符一起使用。\n**示例：**\n```php\n$pattern = \"/^(\\d{3})(\\d{3})(\\d{4})$/\"\
  ;\n$replacement = \"(\\1)\\2-\\3\";\n$subject = '5551234567';\npreg_replace($pattern,\
  \ $replacement, $subject);\n```\n\n`preg_split( pattern , subject [, limit flags\
  \ ])`\n- `pattern` – `$string` 正则表达式\n- `limit` – [可选] $integer 默认: -1，无限制\n- `flags`\
  \ – [可选] $string 值：`PREG_SPLIT_NO_EMPTY`（不返回空）、`PREG_SPLIT_CAPTURE`（返回匹配组）\n\n`preg_match`\
  \ 以忽略大小写的方式在 `$subject` 中匹配 `pattern` 中的正则表达式。如果 `pattern` 中的项目被分组 `()`，则提供一个数组的变量名来分配这些组的值，将其设置为\
  \ `group_array`。\n匹配失败时返回 FALSE，如果未提供 `group_array` 则返回 1，如果提供了 `group_array` 则返回匹配项的长度。\n\
  **示例：**\n```php\n$pattern = \"^[a-z]+\";\n$string = \"Hello\";\nvar_dump( preg_match($pattern,\
  \ $string) ); // int(1)\n```\n"
