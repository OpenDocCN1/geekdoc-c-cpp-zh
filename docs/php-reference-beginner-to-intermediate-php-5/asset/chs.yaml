  \n## 日期/时间函数\n\n![](img/image_rsrc7YM.jpg)\n\n- `month` – `$integer` (1-12) 月份\n\
  - `day` – `$integer` (1-31, 视月份而定) 日\n- `year` – `$integer` (1-32767) 年\n\n检查给定日期的有效性，有效则返回\
  \ `TRUE`。\n\n**示例：**\n![](img/image_rsrc7YN.jpg)\n```\nvar_dump( checkdate(2, 29,\
  \ 2006) );\nvar_dump( checkdate(2, 29, 2008) );\n```\n![](img/image_rsrc7YP.jpg)\n\
  ![](img/image_rsrc7YR.jpg)\n\n- `format` – `$string`\n- `timestamp` – `[optional]\
  \ $integer` 默认：`time()`，当前 Unix 时间戳\n\n根据 `format` 中指定的格式返回当前日期和/或时间。如果不包含 `timestamp`，则使用由\
  \ `time()` 函数提供的当前时间。否则，将评估提供的时间戳。\n\n`format` 可用选项选项：\n\n### 日 (Day)\n- `d` – (01\
  \ – 31) 带前导零的日期\n- `j` – (1 – 31) 不带前导零的日期\n- `D` – (Mon – Sun) 星期的三字母版本\n- `l`\
  \ (小写 'L') – (Sunday – Saturday) 星期完整单词\n- `N` – (1 – 7) ISO-8601 星期，数字表示周一(1)–周日(7)\n\
  - `w` – (0 – 6) 星期，数字表示周日(0) –周六(6)\n- `S` – (st,nd,rd,th) 日期的后缀，与 `j` 配合\n- `z`\
  \ – (0 – 365) 一年的天数\n\n### 周 (Week)\n- `W` – (01 – 52) 一年的周数\n\n### 月 (Month)\n\
  - `F` – (January – December) 月份完整单词\n- `M` – (Jan – Dec) 月份三字母版本\n- `m` – (01 –\
  \ 12) 带前导零的数字月份\n- `n` – (1 – 12) 不带前导零的数字月份\n- `t` – (28 – 31) 当前月的天数\n\n### 年\
  \ (Year)\n- `L` – (1 or 0) 是否为闰年 (1)\n- `Y` – (2008) 四位数字年份\n- `y` – (08) 两位数字年份\n\
  - `o` – (2008) ISO-8601 版本的 'Y'受周 ('W') 影响\n\n### 时间 (Time)\n- `a` – (am or pm)\
  \ 小写上午或下午\n- `A` – (AM or PM) 大写上午或下午\n- `B` – (000 – 999) 网络时间 (Swatch internet\
  \ time)\n- `g` – (1 – 12) 12 小时制小时，不带前导零\n- `h` – (01 – 12) 12 小时制小时，带前导零\n- `G`\
  \ – (0 – 23) 24 小时制小时，不带前导零\n- `H` – (00 – 23) 24 小时制小时，带前导零\n- `i` – (00 – 59)\
  \ 带前导零的分钟\n- `s` – (00 – 59) 带前导零的秒\n- `u` – (e.g. 54321) 毫秒\n\n### 时区 (Timezone)\n\
  - `e` – (e.g. GMT, America/Denver) 完整时区标识符\n- `T` – (e.g. GMT, EST, PST) 时区缩写\n\
  - `I` – (1 or 0) 是否为夏令时间 (1)\n- `O` – (e.g. - 0700) 与 GMT 的小时差\n- `P` – (e.g. -07:00)\
  \ 带冒号的 GMT 小时差\n- `Z` – (-43200 – 50400) 时区偏移量（秒），UTC 西侧为负数\n\n### 完整日期/时间 (Full\
  \ Date/Time)\n- `c` – (e.g. 2008-03-17T12:27:40-06:00) ISO-8601 格式日期\n- `r` – (e.g.\
  \ Mon, 17 Mar 2008 12:27:40 -0600) RFC 2822 日\n- `U` – (e.g. 1205778601) 自 Unix\
  \ 纪戳，同于 `time()`\n\n**示例：**\n```\necho date('m-d-y'); // 03-17-08\necho date('M\
  \ jS, Y'); // Mar 17th, 2008\necho date('g:i:sA'); // 12:27:40PM\n```\n\n\n\n\n\n\
  # 如果你想知道完成一个脚本需要多长时间，例如在比较两个不同的函数以查看哪一个更快时，可以使用 `microtime()` 来跟踪效率。\n\n```php\n\
  $start = microtime(1);\n// 在此处执行操作\n$end = microtime(1);\n$lengthoftime = number_format($end\
  \ - $start, 6);\necho \"It took $lengthoftime seconds to run this script.\";\n```\n\
  \n运行此脚本花费了 0.000005 秒。\n\n## strtotime\n\n`strtotime($string [, timestamp ])` \n\
  `timestamp` – [可选] `$integer` 默认值：`time()`\n\n根据 `$string` 中日期/时间的解释返回 Unix 时间戳，`$string`\
  \ 是日期时间的常用语言格式。如果 `$string` 是指日期的相对输入格式（例如 'last month'），则除非提供了可选的 `timestamp`，否则将使用当前日期/时间。如果\
  \ `$string` 无效且函数失败，则返回 `FALSE`。\n\n## 示例\n```php\n$result = strtotime('December\
  \ 8th, 1941'); echo $result;\necho '<br />'; // XHTML 换行\necho date('r', $result);\n\
  $result = strtotime('26apr86'); echo date('r', $result); // Sat, 26 Apr 1986 00:00:00\
  \ -0700\n$result = strtotime('20010911 08:45:00'); echo date('r', $result); // Tue,\
  \ 11 Sep 2001 08:45:00 -0600\n```\n\n### 相对 $string 示例\n```php\n$result = strtotime('last\
  \ week'); // 时间，上周\necho date('r', $result); // Mon, 10 Mar 2008 14:31:54 -0600\n\
  $date = mktime(8,45,00,9,11,2001); // Sept. 11, 2001 8:45am\n$result = strtotime('next\
  \ week', $date); echo date('r', $result); // Tue, 18 Sep 2001 08:45:00 -0600\n$date\
  \ = mktime(8,45,00,9,11,2001); // Sept. 11, 2001 8:45am\n$result = strtotime('+2\
  \ friday', $date); echo date('r', $result); // Fri, 21 Sep 2001 00:00:00 -0600\n\
  $result = strtotime('1 hour ago'); echo date('r', $result); // Mon, 17 Mar 2008\
  \ 13:36:54 -0600\n$result = strtotime('yesterday 3am'); echo date('r', $result);\
  \ // Sun, 16 Mar 2008 03:00:00 -0600\n$result = strtotime('7am 4 days ago'); echo\
  \ date('r', $result); // Thu, 13 Mar 2008 07:00:00 -0600\n```\n\n还有更多示例。请参阅以下网站：\n\
  - [`www.gnu.org/software/tar/manual/html_node/tar_113.html`](http://www.gnu.org/software/tar/manual/html_node/tar_113.html)\n\
  - [`www.phpdig.net/ref/rn13re206.html`](http://www.phpdig.net/ref/rn13re206.html)\n\
  \n另参：`date()` – 将 Unix 时间戳转换为更易于读的格式\n\n此函数的威力不仅在于可以将普通语言转换为可用的内容而无需大量的正则表达式字符串，还在于处理相对日期和时间时。如果你使用\
  \ MySQL 查询从数据库中提取数据以生成上周（周一到周五）的所有调用报告，你将不得不反复计算来确定今天是星期几，然后根据该结果算出周一的日期，最后提交正确的查询。使用此函数，你可以无需额外的数学计算即可快速找到日期，一切都会为你处理好！\n\
  \n\n\n\n\n## 数学函数\n\n有时你需要更高级的数学函数。\n\n### abs(number)\n`number` – `$integer` 或\
  \ `$float`\n返回 `number` 的绝对值，类型与原变量相同。\n示例：\n```php\nvar_dump( abs(-21) );\nint(21)\n\
  ```\n\n### dechex($integer)\n返回 `$integer` 的十六进制值。最大值：`4294967295`。\n示例：\n```php\n\
  var_dump( dechex(4294967295) );\nstring(8) \"ffffffff\"\n```\n![](img/image_rsrc7Z2.jpg)\n\
  \n### max()\n根据提供的参数，有两种不同的格式：\n- 如果提供单个参数 `$array`，它返回数组中的最大值。\n- 如果提供两个或多个 `$variable`，它返回参数中的最大值。\n\
  \n注意：非数字字符串在比较时会被评估为零 (0)。\n示例：\n```php\n$array = array(4, 7, 2); \nvar_dump( max($array)\
  \ );\nint(7)\n```\n![](img/image_rsrc7MK.jpg)\n\n如果比较两个数组，它们将从左到右进行值与值的对比较：\n```php\n\
  var_dump( max(2, 5, 'string', '8') );\nstring(1) \"8\"\n```\n另请：`min()` – 寻找最小值。\n\
  \n### min()\n根据提供的参数，有两种不同的格式：\n- 如果提供单个参数 `$array`，它返回数组中的最大值。\n- 如果提供两个或多个 `$variable`，它返回参数中的最小值。\n\
  \n注意：非数字字符串在比较时会被评估为零 (0)。\n示例：\n```php\n$array = array(-3, 7, 2); \nvar_dump( min($array)\
  \ );\nint(-3)\n\nvar_dump( min( array(1,2,3), array(1,2,4) ) ); // 1==1, 2==2, 3<4\n\
  array(3) { \n    [0]=> int(1) \n    [1]=> int(2) \n    [2]=> int(3) \n}\n```\n另请：`max()`\
  \ – 寻找最大值。\n\n![](img/image_rsrc7Z3.jpg)\n\n### pi()\n返回浮点数形式的 pi。\n示例：\n```php\n\
  var_dump( pi() );\nfloat(3.14159265359)\n```\n\n### pow(base, exponent)\n`base`\
  \ – `$integer` 或 `$float`\n`exponent` – `$integer` 或 `$float`\n返回 `base` 的 `exponent`\
  \ 次幂值。\n示例：\n```php\nvar_dump( pow(2, 4) );\nint(16)\n```\n![](img/image_rsrc7MK.jpg)\n\
  \n### sqrt($float)\n返回 `$float` 的平方根。\n示例：\n```php\nvar_dump( sqrt(16) );\nfloat(4)\n\
  ```\n如果比较两个数组，它们将从左到右进行值与值的比较。\n\n### log($float [, base])\n`base` – [可选] `$float`\n\
  返回 `$float` 的自然对数。可选的底数形式如下：`log$base`。\n示例：\n```php\nvar_dump( log(10) );\nfloat(2.302585092)\n\
  ```\n\n### round($float [, decimals])\n`decimals` – [可选] `$integer` 默认值：0 位小数\n\
  将 `$float` 四舍五入到最近的整数。如果指定了 `decimals`，则四舍五入到 `decimals` 位小数。\n示例：\n```php\nvar_dump(\
  \ round(3.14) );\nfloat(3)\n\nvar_dump( round(pi(), 2) );\nfloat(3.14)\n\nvar_dump(\
  \ round(143257.432, -2) );\nfloat(143300)\n```\n如果 `decimals` 为负数，它将处理小数点左侧对应的位数。\n\
  另请：`floor()` – 向下取整到最近的整数。\n\n### floor($float)\n将 `$float` 向下取整到最近的整数。\n示例：\n```php\n\
  var_dump( floor(3.99) );\nfloat(3)\n```\n另请：`round()` – 四舍五入到最近的整数或小数。\n\n### rand(min,\
  \ max)\n`min, max` – [可选] `$integers`\n生成一个随机整数。为了获得更好的随机性，请使用 `mt_rand()`。\n示例：\n\
  ```php\nvar_dump( rand(), rand(1,100) ); // 结果异\n```\n另请：`mt_rand()` – 一个更好、更快的随机数生成器。\n\
  \n### mt_rand(min, max)\n`min, max` – [可选] `$integers`\n生成一个随机整数，比 `rand()` 好。如果提供了参数，将生成\
  \ `min` 和 `max` 之间的随机整数。\n示例：\n```php\nvar_dump( mt_rand(), mt_rand(1,100) ); //\
  \ 结果异\n```\n\n## MySQL 函数\n\n数据库。以某种形式形式，如果你想高效地存储和检索数据，你可能都会使用数据库。流行的 MySQL 数据库是\
  \ LAMP 栈（Linux-Apache-MySQL-PHP）的一部分，值得稍微关注和解释。请注意，除少数示例外，本节介绍的是 PHP 函数，而不是如何构建查询。\n\
  \n![](img/image_rsrc7ZA.jpg)\n下表将用于演示这些查询：\n表名：`employees`\n| pkey | name | age\
  \ |\n| :--- | :--- | :--- |\n| 1 | Mary | 24 |\n| 2 | John | 17 |\n| 3 | Mark |\
  \ 53 |\n| 4 | Susan | 17 |\n\n\n\n\n\n## 示例\n\n- `SELECT * FROM employees`\n- `SELECT\
  \ pkey,name,age FROM employees`\n- `SELECT employees.pkey,employees.name,employees.age\
  \ FROM table`\n- `SELECT name FROM employees`\n- `SELECT name,age FROM employees`\n\
  - `SELECT * FROM employees WHERE age = 17`\n- `SELECT name FROM employees WHERE\
  \ name LIKE 'm%'`\n- `SELECT name FROM employees WHERE name LIKE BINARY 'm%'`\n\
  - `SELECT name FROM employees WHERE name LIKE '%a%'`\n- `SELECT name FROM employees\
  \ WHERE name LIKE '      ' ` // 5 个下划线\n- `SELECT COUNT(*) FROM employees`\n- `SELECT\
  \ COUNT(*) FROM employees WHERE age = 17`\n- `SELECT age,COUNT(age) FROM employees\
  \ GROUP BY age`\n- `SELECT SUM(age) FROM employees`\n- `SELECT MAX(age) FROM employees`\n\
  - `SELECT DISTINCT age FROM employees`\n- `SELECT * FROM employees LIMIT 1,2`\n\
  - `SELECT name FROM employees ORDER BY name`\n- `SELECT name FROM employees ORDER\
  \ BY name DESC`\n\n以下示例未使用包含的表格，仅供参考：\n\n- `INSERT INTO table (column1,column2)\
  \ VALUES ('value1','value2'), ('value1','value2'), ('value1','value2')`\n- `UPDATE\
  \ table SET column1='newvalue' WHERE column2='value'`\n- `DELETE FROM table WHERE\
  \ column='value'`\n- `SELECT * FROM table1 INNER JOIN table2 on table1.id = table2.id`\n\
  - `SELECT table1.* FROM table1 INNER JOIN table2 on table1.id = table2.id`\n- `SELECT\
  \ table1.id FROM table1 INNER JOIN table2 on table1.id = table2.id`\n- `SELECT table.id\
  \ AS tableid FROM table`\n\n## MySQL 函数\n\n## mysql_connect()\n\n- `server` – [可选]\
  \ `$string` 默认值：' localhost:3306'` 或 `mysql.default_host`\n- `username` – [可选] `$string`\
  \ 默认值：由 `mysql.default_user` 定义\n- `password` – [可选] `$string` 默认值：由 `mysql.default_password`\
  \ 定义\n- `new_link` – [可选] `$boolean` 默认值：`FALSE`，第二次调用时不建立新链接\n- `client_flag` –\
  \ [可选] `$integer`\n\n与位于 `server` 的 MySQL 服务器建立初始连接/链接，并使用 `username` 和 `password`\
  \ 提供的权限。失败时返回 `FALSE`，出于安全考虑应结合 `die()` 使用。大多数情况下，你会使用：`mysql_connect(server , username\
  \ , password )`。\n\n示例：\n```php\nmysql_connect('localhost', 'user', 'password')\
  \ or die('Could not connect to the database');\n```\n\n另见：\n- `die()` – 函数失败时停止脚本\n\
  \n## mysql_close()\n\n- `mysql_close([ link_identifier ])`\n- `link_identifier`\
  \ – [可选] 默认值：最后打开的链接\n\n关闭与 MySQL 服务器的连接，默认关闭由 `mysql_connect()` 打开最后一个连接。如果指定了\
  \ `link_identifier`，则关闭该链接。\n\n示例：\n```php\n$link = mysql_connect('localhost', 'username',\
  \ 'password') or die();\n$link2 = mysql_connect('/path/to', 'username', 'password')\
  \ or die();\nmysql_close($link); // 关闭第一个链接\nmysql_close(); // 关闭最后创建的链接，在此情况下为\
  \ $link2\n```\n\n另见：\n- `mysql_connect()` – 建立到 MySQL 服务器的连接\n\n## mysql_select_db()\n\
  \n- `mysql_select_db( database [, link_identifier ])`\n- `database` – `$string`\n\
  - `link_identifier` – [可选] 默认值：最后打开的链接\n\n根据名称 `database` 选择数据库。默认情况下，它使用 `mysql_connect()`\
  \ 最近的 MySQL 服务器连接，除非指定了 `link_identifier`，则使用该链接。\n\n示例：\n```php\n$link = mysql_connect('localhost',\
  \ 'username', 'password') or die();\nmysql_select_db('database'); // 或 mysql_select_db('database',$link);\n\
  ```\n\n另见：\n- `mysql_connect()` – 建立到 MySQL 服务器的连接\n\n## mysql_query()\n\n- `query`\
  \ – `$string`\n- `link_identifier` – [可选] 默认值：最后打开的链接\n\n将查询提交到服务器，除非指定了可选的 `link_identifier`，否则使用最近的\
  \ `mysql_connect()` 链接。查询出现任何错误时返回 `FALSE`。`SELECT`、`SHOW`、`DESCRIBE` 和 `EXPLAIN`\
  \ 查询将返回一个资源，需要通过 `mysql_result()` 或 `mysql_fetch_*()` 函数之一进行解析，所有其他查询在成功后将返回 `TRUE`。\n\
  \n示例：\n```php\nmysql_connect('localhost', 'username', 'password') or die();\nmysql_select_db('database');\n\
  $result = mysql_query(\"SELECT * FROM 'table'\");\n```\n\n另见：\n- `mysql_fetch_array()`\
  \ – 从创建的资源中以数组获取行\n- `mysql_fetch_assoc()` – 返回关联数组：`column=>value`\n- `mysql_fetch_row()`\
  \ – 返回行的索引数组\n- `mysql_result()` - 从创建的资源中获取单个结果\n\n### db_query()\n\n- `database`\
  \ – `$string`\n- `query` – `$string`\n- `link_identifier` – [可选] 默认值：最后打开的链接\n\n\
  将查询发送到 MySQL 服务器和 `database`。列出的参考，请使用 `mysql_select_db()` 和 `mysql_query()` 代替。\n\
  \n示例：\n```php\n$result = db_query('database', \"SELECT * FROM 'table'\");\n```\n\
  \n另见：\n- `mysql_select_db()` 选择数据库\n\n## mysql_error()\n\n- `link_identifier` –\
  \ [可选] 默认值：最后打开的链接\n\n默认返回上次操作的 MySQL 错误，如果指定了则返回 `link_identifier`。\n\n示例：\n```php\n\
  $link = mysql_connect('localhost', 'user', 'password'); // 有效\nmysql_select_db('No');\n\
  echo mysql_error();\n```\n\n## mysql_fetch_array()\n\n- `resource` – 包含 `mysql_query()`\
  \ 输出的变量\n- `result_type` – [可选] `$string` 默认值：`MYSQL_BOTH`\n\n值：`MYSQL_BOTH`（包含关联和索引数组）、`MYSQL_ASSOC`（关联数组）、`MYSQL_NUM`（索引数组）\n\
  \n返回由 `mysql_query()` 生成的资源的单行数组，并将资源的内部指针移动到下一行。这通常用于循环提取资源的所有行并获取查询的完整输出。默认提供关联和索引，可以通过\
  \ `result_type` 修改。\n\n示例：\n```php\n$result = mysql_query(\"SELECT * FROM name\"\
  );\n$array = mysql_fetch_array($result);\nprint_r($array);\n\n$array = mysql_fetch_array($result,MYSQL_ASSOC);\n\
  print_r($array);\n```\n\n使用 `MYSQL_NUM` 选项的示例：\n```php\n$result = mysql_query(\"\
  SELECT * FROM name\");\nwhile ($row = mysql_fetch_array($result,MYSQL_NUM) ){\n\
  \    print_r($row);\n}\n```\n\n## mysql_fetch_assoc()\n\n- `resource` – 包含 `mysql_query()`\
  \ 输出的变量\n\n返回由 `mysql_query()` 生成的单行数组，并将资源的内部指针移动到下一行，返回 `column => value` 关联数组。\n\
  \n示例：\n```php\n$result = mysql_query(\"SELECT * FROM name\");\n$array = mysql_fetch_assoc($result);\n\
  print_r($array);\n```\n\n使用 while 循环的示例：\n```php\n$result = mysql_query(\"SELECT\
  \ * FROM name\");\nwhile ($row = mysql_fetch_assoc($result) ){\n    print_r($row);\n\
  }\n```\n\n## mysql_fetch_row()\n\n- `resource` – 包含 `mysql_query()` 输出的变量\n\n返回由\
  \ `mysql_query()` 生成的单行数组，并将资源的内部指针移动到下一行，返回仅包含值的索引数组（无列名）。\n\n示例：\n```php\n$result\
  \ = mysql_query(\"SELECT * FROM name\");\n$array = mysql_fetch_row($result);\nprint_r($array);\n\
  ```\n\n使用 while 循环的示例：\n```php\n$result = mysql_query(\"SELECT * FROM name\");\n\
  while ($row = mysql_fetch_row($result) ){\n    print_r($row);\n}\n```\n\n## mysql_result()\n\
  \n- `resource` – 包含 `mysql_query()` 输出的变量\n- `row` – `$integer`\n- `column` – [可选]\
  \ `$string` 或 `$integer` 默认值：0，获取第一列\n\n返回包含来自 `mysql_query()` 生成的资源特定行的单元单元的字符串。如果指定了\
  \ `field`，则获取指定的字段（可以通过从 0 开始的数字或别名引用）。\n\n注意：如果你需要多个一个结果，应该使用 `mysql_fetch_*()`。\n\
  \n示例：\n```php\n$result = mysql_query(\"SELECT * FROM name\");\nvar_dump( mysql_result($result,\
  \ 0) );\nvar_dump( mysql_result($result, 1) );\nvar_dump( mysql_result($result,\
  \ 1, 'name') );\n```\n\n## mysql_num_rows()\n\n- `resource` – 包含 `mysql_query()`\
  \ 输出的变量\n\n以整数形式返回 `mysql_query()` 生成的资源的总行数。\n\n示例：\n```php\n$result = mysql_query(\"\
  SELECT * FROM name\");\n$row_total = mysql_num_rows($result);\nvar_dump($row_total);\n\
  ```\n\n## mysql_free_result()\n\n- `resource` – 包含 `mysql_query()` 输出的变量\n\n清除与\
  \ `resource` 相关的所有系统内存。只有在单个脚本内处理大型数据集时才是必要的，内存在脚本/页面结束会自动清除。\n\n示例：\n```php\n$result\
  \ = mysql_query(\"SELECT * FROM name\");\nmysql_free_result($result);\n```\n\n##\
  \ mysql_get_server_info()\n\n- `link_identifier` – [可选] 默认值：最后打开的链接\n\n返回包含 MySQL\
  \ 服务器版本的字符串，默认是 `mysql_connect()` 最后的最后一个连接。如果指定了 `link_identifier`，则使用该链接。\n\n\
  示例：\n```php\n$link = mysql_connect('localhost', 'username', 'password') or die();\n\
  var_dump( mysql_get_server_info() );\n```\n\n## mysql_real_escape_string()\n\n-\
  \ `link_identifier` – [可选] 默认值：最后打开的链接\n\n返回对 `$string` 进行处理的字符串，添加反斜杠以防止 SQL 攻击。默认使用\
  \ `mysql_connect()` 的连接。如果指定了 `link_identifier`，则使用该链接。影响以下字符：`\\x00`、`\\n`、`\\\
  r` 和 `''`。注意：与 `addslashes()` 相同。\n\n示例：\n```php\n$string = \"SELECT * FROM table'\"\
  ;\nmysql_connect('localhost', 'username', 'password') or die();\nvar_dump( mysql_real_escape_string($string)\
  \ );\n```\n\n## mysql_data_seek()\n\n- `resource` – 包含 `mysql_query()` 输出的变量\n-\
  \ `row` – `$integer`\n\n将 `mysql_query()` 生成的资源的内部指针移动到 `row`（从 0 开始）。通过 `mysql_fetch_*()`\
  \ 获取指定的行。\n\n示例：\n```php\n$result = mysql_query(\"SELECT * FROM name\");\nmysql_data_seek($result,\
  \ 1); // 选择第 1 行\n```\n\n## mysql_affected_rows()\n\n- `link_identifier` – [可选]\
  \ 默认值：最后打开的链接\n\n返回受 `INSERT`、`UPDATE` 或 `REPLACE` 查询影响的行数。使用指定的 `mysql_connect()`\
  \ 链接。\n\n示例：\n```php\nmysql_connect('localhost', 'username', 'password') or die();\n\
  mysql_select_db('database');\n$result = mysql_query(\" INSERT INTO name (pkey,name)\
  \ VALUES (NULL,'Joe') \");\nvar_dump( mysql_affected_rows() );\n```\n\n## mysql_create_db()\n\
  \n- `string` – `$string`\n- `link_identifier` – [可选] 默认值：最后打开的链接\n\n在 `mysql_connect()`\
  \ 使用的 MySQL 服务器上创建一个名为 `$string` 的数据库。如果指定了 `link_identifier`，则使用该链接。注意：仅参考 `mysql_query()`\
  \ 和 `\"CREATE DATABASE\"`。\n\n示例：\n```php\nmysql_connect('localhost', 'username',\
  \ 'password') or die();\nmysql_create_db('database');\n```\n\n## mysql_drop_db()\n\
  \n- `string` – `$string`\n- `link_identifier` – [可选] 默认值：最后打开的链接\n\n在 `mysql_connect()`\
  \ 使用的 MySQL 服务器上销毁名为 `$string` 的数据库。注意：仅参考 `mysql_query()` 和 `\"DROP DATABASE\"\
  `。\n\n示例：\n```php\nmysql_connect('localhost', 'username', 'password') or die();\n\
  mysql_drop_db('database');\n```\n\n## 目录 & 文件系统函数\n\n### getcwd()\n\n返回包含当前目录的字符串。\n\
  \n示例：\n```php\nvar_dump( getcwd() ); // 结果各异\n```\n\n另见：\n- `chdir()` – 更改目录\n\n\
  ### chdir()\n\n- `directory` – `$string`\n\n将当前目录更改为 `$string`，成功时返回 `TRUE`。注意：目录更改仅持续脚本/页面。\n\
  \n示例：\n```php\nvar_dump( getcwd() ); // 获取当前目录\nchdir('images');\n```\n\n另见：\n-\
  \ `getcwd()` – 获取当前目录\n\n### scandir()\n\n- `directory` – `$string`\n- `sort_flag`\
  \ – [可选] `$integer` 默认值：`0`（升序）其他值为：`1`（降序）\n\n返回包含 `$directory` 内部所有文件的数组。如果 `sort_flag`\
  \ 为 0 或未指定，数组按字母顺序排序。\n\n示例：\n```php\n$array = scandir('directory'); // 结果各异\n```\n\
  \n### copy()\n\n- `source` – `$string`\n- `destination` – `$string`\n\n将名为 `source`\
  \ 的文件复制到 `destination`，如果 `destination` 已存在则覆盖它。原始源保持不变。\n\n示例：\n```php\ncopy('file.txt',\
  \ 'file.txt.bak');\n```\n\n### rename()\n\n- `oldname` – `$string`\n- `newname`\
  \ – `$string`\n\n将名为 `oldname` 的文件或目录重命名为 `newname`。\n\n示例：\n```php\nrename('file.txt',\
  \ 'file.tmp');\n```\n\n### mkdir()\n\n- `path` – `$string`\n- `ix_mode` – [可选] `$integer`\
  \ 默认值：`0777`（八进制），所有人可读写\n- `recursive_flag` – [可选] `$boolean` 默认值：`FALSE`，一次创建一个目录\n\
  \n在 `path` 处创建一个目录。如果在 Unix/Linux 服务器上，你可以将默认模式从 0777 更改为八进制形式的其他权限（前导零）。每次只能创建一个层级的目录，除非\
  \ `recursive_flag` 设置为 `TRUE`。\n\n示例：\n```php\nmkdir('tmp');\nmkdir('tmp/2/tmp',\
  \ 0775, TRUE);\n```\n\n另见：\n- `chmod()` – 修改文件模式（权限）\n\n### rmdir()\n\n- `path`\
  \ – `$string`\n\n移除名为 `path` 的目录。\n\n示例：\n```php\nrmdir('/temp/tmp');\n```\n\n###\
  \ unlink()\n\n- `filename` – `$string`\n\n删除名为 `filename` 的文件。\n\n示例：\n```php\n\
  unlink('file.txt');\n```\n\n### fopen()\n\n- `filename` – `$string`\n- `mode` –\
  \ `$string`\n- `use_include_path` – [可选] `$boolean` 默认值：`FALSE`\n\n使用以下模式打开 `filename`：\n\
  - `r`（只读，文件指针在开头）\n- `r+`（读写，文件指针在开头）\n- `w`（只写，文件指针在开头，零长度文件，不存在则创建）\n- `w+`（读写，文件指针在开头，零长度文件，不存在则创建）\n\
  - `a`（只写，文件指针在末尾，零长度文件）\n- `a+`（读写，文件指针在末尾，零长度文件）\n- `x`（只写，文件指针在开头，如果存在则返回 `FALSE`）\n\
  - `x+`（读写，文件指针在开头，如果存在则返回 `FALSE`）\n\n如果 `use_include_path` 设置为 `TRUE`，系统也会在 PHP\
  \ 定义的 `include_path` 中检查该文件。返回一个供其他使用的资源。\n\n示例：\n```php\n$file = fopen('file.txt',\
  \ 'r');\n```\n\n另见：\n- `fclose()` – 关闭由 `fopen()` 打开的资源\n\n### fclose()\n\n- `resource`\
  \ – 包含 `fopen()` 创建的文件指针的变量\n\n关闭用 `fopen()` 打开的文件。\n\n示例：\n```php\n$file = fopen('file.txt',\
  \ 'r');\nfclose($file);\n```\n\n另见：\n- `fopen()` – 打开文件进行读取、写入或两者两者\n\n### fread()\n\
  \n- `resource` – 包含 `fopen()` 创建的文件指针的变量\n- `length` – `$integer`\n\n返回包含 `fopen()`\
  \ 创建的资源内容的字符串，字节长度为 `length`。\n\n示例：\n```php\n// file.txt 包含句子 Hello World!!\n$file\
  \ = fopen('file.txt', 'r');\nvar_dump( fread($file, 8) );\n```\n\n另见：\n- `fwrite()`\
  \ – 写入打开的文件\n\n\n\n\n\n要将整个文件读入字符串中，请使用函数 `filesize()`。\n\n```php\n// file.txt contains\
  \ the sentence: Hello World!\n$filename = 'file.txt';\n$file = fopen($filename,\
  \ 'r');\n$string = fread( $file, filesize($filename) );\nvar_dump($string);\n```\n\
  \n`string(13) \"Hello World!\"`\n\n### fwrite( resource , $string [, length ]) \n\
  也称为 `fputs()`。\n\n- `resource` – 包含由 `fopen()` 创建的文件指针的变量名。\n- `length` – [可选] `$integer`\
  \ 默认：`filesize($string)`\n\n将 `$string` 的内容写入由 `fopen()` 创建的文件 `resource` 中。如果指定了\
  \ `length`，则在达到 `length` 字节或 `$string` 的末尾时停止写入。\n\n**示例：**\n```php\n$file = fopen('file.txt',\
  \ 'a'); // 追加到文件末尾\nfwrite($file, 'Hello World!');\n```\n`string(8) \"Hello Wo\"\
  `\n\n**另见：**\n- `fwrite()` – 写入已打开的文件\n- `fopen()` – 打开文件进行读取、写入或两者结合\n\n### 要将整个文件读入字符串中，请使用函数\
  \ `filesize()`。\n\n```php\n// file.txt contains the sentence: Hello World!\n$filename\
  \ = 'file.txt';\n$file = fopen($filename, 'r');\n$string = fread( $file, filesize($filename)\
  \ );\nvar_dump($string);\n// file.txt now contains at the end: Hello World!\n```\n\
  \n\n\n\n\n![](img/image_rsrc81U.jpg)\n返回一个包含名为/路径 `$string` 的文件长度的整数。注意：结果会被缓存。请参见\
  \ `clearstatcache()`。示例：\n\n![](img/image_rsrc81V.jpg)\n```php\n// file.txt 包含单词:\
  \ Hello\nvar_dump( filesize('file.txt') );\n```\n\n![](img/image_rsrc81W.jpg)\n\
  `flags` – [可选] `$string` 值：\n- `FILE_USE_INCLUDE_PATH`（在 `include_path` 中搜索文件）\n\
  - `FILE_IGNORE_NEW_LINES`（不在数组条目末尾添加 `\\n`）\n- `FILE_SKIP_EMPTY_LINES`（跳过空行）\n\n\
  将文件名为 `$string` 的整个文件逐行读取到数组中，除非 `flags` 另有指定，否则会在每个数组项末尾附加一个换行符（`\\n`）（每个项都是文件中的一行）。\n\
  \n示例：\n```php\n// file.txt 包含以下由制表符分隔的项\n// Bob owner 34\n// Mark manager 27\n$array\
  \ = file('file.txt');\n```\n\n![](img/image_rsrc81X.jpg)\n```php\necho '<pre>';\
  \ // 预格式化文本，为了可读性\nprint_r($array);\n```\n\n另请：`file_get_contents()` – 类似，但返回字符串而不是数组\n\
  \n![](img/image_rsrc81Y.jpg)\n`flags` – [可选] `$string` 值：\n- `FILE_USE_INCLUDE_PATH`（在\
  \ `include_path` 中搜索文件）\n- `context` – [可选] 忽略。使用 `start` 或 `max_length` 时设置为 `NULL`\n\
  - `start` – [可选] `$integer` 默认值：0，文件开头\n- `max_length` – [可选] `$integer` 默认值：`filesize($string)`\n\
  \n将文件名为 `$string` 的整个文件读取到一个字符串中。除非指定了 `start`，否则从文件开始开始，指定则从文件的 `start` 位置开始。如果指定了\
  \ `max_length`，则只读取 `max_length` 字节到字符串中。\n\n示例：\n```php\n// file.txt 包含以下由制表符分隔的项\n\
  // Bob owner 34\n// Mark manager 27\n$string = file_get_contents('file.txt');\n\
  ```\n\n![](img/image_rsrc81Z.jpg)\n```php\necho '<pre>'; // 预格式化文本，为了可读性\nvar_dump($string);\n\
  $string = file_get_contents('file.txt', NULL, NULL, 5, 4);\necho '<pre>'; // 预格式化文本，为了可读性\n\
  var_dump($string);\n```\n\n![](img/image_rsrc820.jpg)\n另请：`file()` 类似，但返回数组而不是字符串\n\
  \n![](img/image_rsrc821.jpg)\n`input` – `$string` 或 `$array`\n`flags` – [可选] `$string`\
  \ 值：\n- `FILE_USE_INCLUDE_PATH`（在 `include_path` 中搜索文件）\n- `FILE_APPEND`（如果文件已存在，则追加而不是覆盖）\n\
  - `LOCK_EX`（获取对文件的排他锁以进行写入）\n\n等同于 `fopen()`、`fwrite()` 和 `fclose()` 的组合。向名为/路径\
  \ `$string` 的文件写入 `input` 的内容。如果 `input` 是数组，则条目值将组合，就像一个长字符串且中间没有分隔符。默认情况下，如果文件存在，除非用\
  \ `flags` 另指定，否则将被覆盖。返回写入文件的字节数。\n\n示例：\n![](img/image_rsrc822.jpg)\n```php\n$input\
  \ = 'Hello World!';\nfile_put_contents('file.txt', $input);\n$input = array('Hello\
  \ ', 'World!');\nfile_put_contents('file.txt', $input);\n```\n\n![](img/image_rsrc823.jpg)\n\
  另请：`file()` – 将文件读取到数组\n`file_get_contents()` – 将文件读取到字符串\n\n![](img/image_rsrc824.jpg)\n\
  当在格式化中指定时，接受多个 `inputs`\n`resource` – 由 `fopen()` 创建的文件指针\n`formatting` – `$string`，参见\
  \ `sprintf()` 格式化指南\n`inputs` – [可选] 格式化的 `scalar`\n使用格式化规则（参见 `sprintf()`）向 `resource`\
  \ 写入字符串。如果提供了 `inputs`，则返回格式化后的字符串的长度。\n\n示例：\n```php\n$string = 'dog';\n$file =\
  \ fopen('file.txt', 'w');\nfprintf($file, \"I like %s.\", $string);\nfclose($file);\n\
  ```\n\n![](img/image_rsrc825.jpg)\n```php\n$length = fprintf($file, \"%s %s\");\n\
  var_dump($length);\n```\n\n![](img/image_rsrc826.jpg)\n另请：`sprintf()` – 应用于字符串的格式化\n\
  `fwrite()` – 向文件写入字符串\n\n当在格式化中指定时，接受多个 `inputs`\n`resource` – 由 `fopen()` 创建的文件指针\n\
