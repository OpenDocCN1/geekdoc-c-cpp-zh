  print_r( array_diff_key($array, $array2)); // 原文此处为 diff_key 但上下文暗示为 intersect_key\n\
  \n### array_flip()\n`array_flip($array)` 返回一个数组，将 `$array` 的键作为值，并将 `$array` 的值作为新键。注意，如果原始值不是\
