  \ `offset` 个条目，而负偏移量将从末尾倒数第 `offset` 个条目开始。\n\n如果指定的 `length` 且为正数，它决定了从 `offset`\
  \ 返回的最大条目数。如果 `length` 为负数，它指定在 `offset` 之后从 `$array` 末尾停止相应数量的条目。\n\n默认情况下，结果数组中的任何索引键都将被重新索引。如果\
