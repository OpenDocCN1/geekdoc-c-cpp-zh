    For example, an extraordinary situation might be a case in which we don’t have
    sufficient resources to handle our program, or if we use invalid operation, violate
    range and many other extraordinary situations. Exception handling is a great advantage
    in C++, as we can target the program’s anomalies in real-time.


    It is very important to understand that exception handling in C++ should be performed
    only on synchronous code, and not in asynchronous code. There is specific terminology
    when using exception handling in C++:


    - `Exception`– a primitive or object type that signals an occurring or about to
    occur error. This also includes information about the exception, or in other words:
    what happened.


    - `Throwing an exception`– when something is wrong, an exception is thrown. Throwing
    the exception can be done to other parts of the program that will know how to
    handle it. For example, if an exception is thrown and the program is about to
    crash, we may want to save the files or data first, so another part of the program
    will handle this, allowing a soft crash. Throwing an exception, in this case,
    is like a basketball player who runs into a problem and then throws the ball to
    another player, hoping that his teammate can handle the play from there.


    - `Catching an exception`– once another part of the program catches the exception,
    it will need to deal with it in a manner that we can define. It might cause the
    program to terminate, to close specific windows, recover, log an error message,
    or partially shut the program. For example, let’s say our program needs to write
    something to a database, but the database is full. This part of the program runs
    an exception, and maybe another part can delete unnecessary data entries and allow
    the program to continue as usual.


    C++ uses specific keywords when dealing with exceptions:


    - `try { statement }` – We use the `try` keyword when we want to use a code section
    that might cause an exception. If an exception is thrown, the program exits the
    code block and goes to a catch handler. If there is no catch handler, the program
    terminates.


    - `throw` – We use `throw` when an exception is thrown, followed by an argument,
    which is the exception we want to throw. For example, this can be used if we want
    to allocate new memory, but the memory is full.


    - `catch {statement}` – We use `catch` when we want a catch handler, which is
    another code section we dedicated for this purpose, to handle the exception. For
    example, if the memory is full, we can maybe delete some unnecessary stored items
    or clear cached items.


    Let’s look at a simple example. In this example, we divide `int a` with `int b`.
    What will happen if `int b` is 0? Will our program crash? Will it overflow? It
    depends on the application in this case, but let’s say we don’t want `int b` to
    be equal to `0` as it will cause problems. We need to handle an exception in this
    case. Here is our basic code (assume that all variables have been declared and
    initialized):


    ```cpp

    double sum {}; sum = int a / int b;

    ```


    Of course, we can check if `b` is equal to `0`, and if it is, we will not run
    the division. But what do we do if `b` is equal to `0`? Here comes exception handling
    to our use:


    ```cpp

    double sum {}; try //our try statement { if (b==0) throw 0; //throw an exception
    } sum = a / b; catch (int &ex) //our exception handler {

    std::cout <<“Please change the value of b to be higher than 0” << std::endl;

    }

    ```


    ## Exception handling from a function


    Functions and methods can also handle an exception, and they can as well throw
    multiple exceptions. Let’s look at an example of how to handle an exception from
    a function. Below is a simple function (we assume that all objects have been declared
    and initialized):


    ```cpp

    double sum (int a, int b) { return static_cast <double> (a / b);

    //using static_cast in case an integer is not a double, we turn it into a //double

    }

    ```


    What happens if `int b` is a 0? We can re-write the function:


    ```cpp

    double sum (int a, int b) { if (b == 0) //if b is equal to 0, we throw an exception
    throw 0; return static_cast <double> (a) / b; }

    ```


    Now, we need to find a handler to catch the exception. We might not have a handler
    at all, and in this case, our program will crash. If the handler does exist, it
    has to be found on the call stack that called this function:


    ```cpp

    double sum {};

    try { sum = calc_sum (int a, int b); std::cout << sum << std::endl; } catch (int
    ex) { std::cerr << “Exception“ << ex << std::endl; }

    ```


    Note that we use `std::cerr`. We used it as `std::cerr` is an object of class
    `ostream` that represents the standard error stream oriented to narrow characters.


    ### Multiple exception handling


    As we mentioned previously, C++ allows us to handle multiple exceptions in a function
    or method, as functions or methods might fail in various circumstances. Let’s
    say we have a function that calculates a cars’ miles per gallon of gas used. We
    assume that all objects have been declared and initialized. The code is as follows:


    ```cpp

    double calc_mpg (int miles, int gallons) //mpg = miles per gallon { return static_cast
    <double> (miles) / gallons; }

    ```


    What happens if the number of miles is a negative number? What will occur if the
    `gallons` are 0?


    Let’s see how to handle these potential problems with multiple exception handling,
    and you will see it is pretty simple:


    ```cpp

    double calculate_mpg( int miles , int gallons ) { if ( gallons == 0) throw 0;
    if ( miles < 0 || gallons < 0) throw std:: string {“Error! It is impossible to
    drive a negative number of miles!” }; return static_cast < double >( miles ) /
    gallons ; }

    ```


    When we call this function, this is what we should expect:


    ```cpp

    int main() { int miles{}; int gallons{}; double miles_per_gallon{}; std::cout
    <<“Enter the distance you drove in miles:“ ; std::cin >> miles; std::cout << “Enter
    the number of gallons you had: “ ; std::cin >> gallons; try { miles_per_gallon
    = calculate_mpg(miles, gallons); std::cout <<“Result: your car uses “ << miles_per_gallon
    <<“ per mile” << std::endl; } catch ( int &ex) { std::cerr << “Error! 0 gallons
    are not an option” << std::endl; } catch(std:: string &ex) { std::cerr << ex .c_str()
    << std::endl; } std::cout <<“Thank you and goodbye!” << std::endl; return 0; }

    ```


    Try running this code and entering various data, including negatives and zeros.
    See how the exception handling works with this code.


    It is important to know that in C++, we can also use a catch all handler, which
    can catch any type of exception. If you use a catch all handler, place it as the
    last catch statement at the end of your catch block, as it should catch anything
    that was not caught by any other handler. This is the syntax you should use:


    ```cpp

    catch (…) //use an ellipse as a parameter, as we don’t kno w what //exception
    will be { std::cerr << “unknown exception” << std::endl; }

    ```


    ### Creating own exception classes


    C++ allows us to define very specific exception handling classes, to best suit
    our application. When creating these user-defined classes, it is best to throw
    objects, not primitive types, and also to throw them by value while catching them
    by reference or const reference. This may sound confusing, but it is actually
    simple, as we will demonstrate in this section.


    Let’s create two classes: the first, will handle a divide by zero exception, and
    the second one will handle a negative value:


    ```cpp

    class Divide_By_Zero_Ex { }; class Negative_Val_Ex { };

    ```


    Let’s use the function we already wrote together with the classes we just created:

