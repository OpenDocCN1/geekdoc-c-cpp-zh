    pointers. However, unlike shared_ptr, they do not have any owner relationship
    with the object they are pointing to and have no effect on the lifetime of the
    object (in other words, they are not participating in any counter activity as
    the shared pointers are). Does this sound strange? Let’s explain: weak pointers
    are used in cases where we want to prevent any strong reference cycle, which might
    have an effect on the deletion of objects. It is as if you copy the shared pointer
    entity, but as a non-owning reference or a weak reference position.


