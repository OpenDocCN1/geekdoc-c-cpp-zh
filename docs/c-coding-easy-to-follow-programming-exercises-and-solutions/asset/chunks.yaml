    # **Chapter 25: C++ I/O and Stream**


    Every programing language uses an input and output stream, which are fundamental
    roots from which the program can run and perform its expected tasks. These input
    and output streams are, in fact, sequences of bytes—also known as streams. C++
    provides us with an abstraction of I/O stream that can work with various input
    and output sources, such as physical devices, console, virtual devices, and more.
    As mentioned, the streams are for input and output. In an input stream, the flow
    of the bytes is from the device to the main memory. For example, the text we type
    on our keyboard is an input. An output stream is to the device from the main memory—for
    example, text displayed on the screen.


    You’re already familiar with the two input and output keywords : cin and cout,
    as we have used it in most of our code examples so far. We also used cerr—which
    is a standard error stream that is commonly used in exception handling. clog is
    also a commonly used keyword for a standard log stream, which connects by default
    to the console and displays logs.


    There are three most commonly used header files for I/O stream in C++: 1\. iomanip–
    iomanip stands for input-output manipulation and it is used for the definition
    of manipulators used to format stream I/O.


    2\. iostream – iostream stands for standard input-output stream and defines formatted
    inputs and outputs from/to stream.


    3\. fstream – fstream stands for file stream and defines formatted inputs and
    outputs from/to file stream.


    Using these header files provides us with the use of many C++ classes, such as
    the ios class, which is a base class for most of the other stream classes used
    in C++. You can learn more about C++ I/O stream classes in this link:


    http://www.cplusplus.com/doc/tutorial/files/


    **Stream manipulation**


    In C++, we can use many member methods within the I/O stream classes in order
    to manipulate the stream. To use stream manipulators, a method version (manipulation
    function) or a manipulator version requires the inclusion of an iomanip header
    file. We will demonstrate how to use both methods in this section. There are several
    common stream manipulators which are often used in C++:


    - Integer – We can use showbase,noshowbase, dec, hex,oct, uppercase, nouppercase
    and more, in order to manipulate integers base 10, 16, or base 8, and also to
    determine whether we want the base prefix to display in lower or uppercases.


    - Floating point – We can usefixed, setprecision,showpoint, noshowpoint,scientific,
    showpos, and noshowpos to manipulate floating points.


    - Boolean– We can use boolalpha and noboolalpha to display boolean values of true
    or false for either strings (display true– false) or integers (display 1 or 0).


    - Field width, justification and fill – We can usesetw, right, left, setfill,
    and internal to manipulate floating points.


    There are other very useful and common manipulators, such as endl, which we have
    used many times in most of our code samples. Other manipulators you will probably
    use and see are ws (white space), skipsw—skip white space, while noskipws will
    not skip it. There are many other manipulators, and we cannot cover them all in
    this section, but as you go along, you will encounter many of the ones that are
    commonly used, depending on your application type.


    **Using stream manipulators - integer values**


    We already used many integer variables in our code examples. Integers are very
    powerful in any application and manipulating them can also be powerful. There
    are four types of integers default values:


    1\. dec– Will display base 10 values by default.


    2\. noshowbase– Used to show hex values. 3\. nouppercase– Used to display lower
    cases when prefix and hex values are used.


    4\. noshowpos – no + will be displayed for positive values. **Beside these default
    values, we can also use additional manipulators such as:**


    - octal – Displays 8 based values.


    - hexadecimal – Displays base 16 values.


    These two manipulators are used for computing when we need to use numbers that
    are easier to convert to binary values because computers “think” in binary. Converting
    10 base numbers is harder than using octal or hexadecimal base. For example, it
