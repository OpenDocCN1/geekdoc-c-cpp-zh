    # **Chapter 11: Conditional Ternary Operator?:**


    The conditional operator ?: is a ternary operator, which means it works with three
    operands. It is very similar to the if-else structure and can be very handy to
    use. The operator evaluates two expressions, and the syntax used in this case
    is simple.


