    4. **配置**


    有几个与目标处理器（主要是 x64 和 Win32 或 x86）关联的配置（Configurations），以及用于开发和调试的配置（`DEBUG`）与发布最终版本的配置（`RELEASE`），后者将生成一个
    `.exe` 文件。我们将从默认的 `DEBUG / x86` 开始，因为我们想要查找错误并跟踪代码的运行，正如我们稍后演示的那样。


    5. **预处理器**


    C++ 使用称为头文件（或 `.h` 文件）的预处理库。这些文件被添加到项目中并在任何事情之前进行预处理，它们的存在是为了节省你的时间。这些文件包含了对 C++
    中常用库的引用。需要提到的是，最新的 C++20 Modules 已引入以取代旧的 `.h` 文件方法，但它们仍然处于实验阶段，不属于目前使用的 C++ 标准的一部分。


    6. **pch.h**


    `pch.h` 代表预编译头文件（Pre Compiled Header），用于将一个文件中使用的所有 `#include` 文件放在一起。`pch.h`
    已经过编译，因此它包含了二进制文件，可以在构建过程中节省时间。`.h` 文件是不被编译的，你每次运行程序时，它们都会重新编译。这意味着如果你的代码中有 6
    或 8 个 `.h` 文件（有时甚至更多），那么——编译起来就很沉重。因此，使用 `pch.h` 是节省时间和资源的做法。我们稍后会深入研究 `pch.h`，所以如果你在这个阶段觉得难以理解，请不要担心。


    如果你的 IDE 没有默认的 `pch.h` 文件——不要担心，你在这个阶段不需要它。


    7. **函数– main()**


    `main()` 函数是程序开始执行的地方，也是你放置希望执行的第一条指令的地方。`main()` 函数通常在给你控制权之前完成了一些与操作系统相关的准备之后执行。例如：设置输入和输出（如控制台窗口）、加载系统库等。


    你作为 `main()` 函数部分编写的代码始终写在 `main()` 顶部和底部的大括号 `{}` 之间。


    8. **行号**


    行号有助于帮助你跟踪代码，在发生编译器错误时，大多数情况下会指示问题所在。


    9. **输出区域**


    输出区域包含几个不同用途的标签页，我们将在本指南中详细讨论。通常，根据你正在的操作，输出区域将显示相关细节；例如：当你编译代码时，你将看到编译进度。当你链接代码时，你将看到链接器的输出。当程序开始运行时，你将看到任何发生的错误。此区域不是程序的输出；程序的输出将显示在单独的控制台窗口中。


    10. **解决方案管理器（Solution Explorer）**


    解决方案管理器或或文件系统目录允许你在项目内的不同文件和文件夹之间导航。你可以使用目录顶部的搜索管理器按名称搜索文件，并打开/关闭目录树。


    提示：如果你想在解决方案管理器中轻松找到当前正在工作的文件，只需点击双箭头图标：


    ![](img/image00109.jpeg)


    11. **命名空间（Namespaces）**


    标准命名空间是 C++ 内部的一部分。但它到底是什么呢？


    解释这一点最好的方法是使用生活中的例子：假设你去医院看一个朋友。接待员告诉你你的朋友在 A 楼的 204 室。当你到达 A 楼时，又被告知朋友不在那里，而在医院另一边的另一栋
    A 楼。在现实生活中这绝不可能发生——医院建筑群中的建筑将有唯一的名称，例如 A 楼、B 楼等。永远不会有两个名为“A”的楼——这没有任何意义。街道名称也是如此——你不会在同一个城市里有两条名为“主街”（Main）的街道，对吧？


    编程中也是如此：命名空间是一种为了消除歧义而创建的声明的标准。例如，`cin`（输入）和 `cout`（输出）是 `std` 命名空间的一部分，`std`
    是 C++ 的标准命名空间。你将在第一个程序中使用这些语句。


    12. **cout 和 cin 语句**


    '
- fmt: '

    Each program requires input and output. In C++, one of the most common ways is
    to use `cout` (the program’s output) and `cin` (the program’s input). We will
    demonstrate this in the next section. Note that input and output are the foundation
    of programming, as the user will always need to input something and get some sort
    of output. The way to use `cin` and `cout` is as follows:


    `std::cin >> YOUR INPUT >> std::endl; std::cout << "YOUR OUTPUT" << std::endl;`


    We are using `std::` at the beginning of the line, as explained in the Namespace
    section, then using the `<<` and `>>` operators.


    To remember when to use `<<` and when to use `>>` memorize this: `cout` : less
    than, less than (`<<`). `cin` : more than, more than (`>>`). 13\. **End line**


    `std::endl;` represents the end of the line, so the next line will start right
    after this one as though we typed“enter.” You may also use“\n`;` instead of `endl;`–
    they both do the same job and move the user to the next line.


    14\. **Notice that we will always end each line with a semicolon “;” (See further
    the“Punctuation” section).**


    15\. **Comments**


    One of the essential parts of your code is your comments. Comments are not part
    of the real code that will be compiled and executed, but just a note for you or
    your team for future purposes. It is extremely important to use comments in your
    code, just to make it as clear as possible. This is considered a MUST best practice
    among developers. You really don’t want to dive into uncommented code.


    To create a comment, you just need to add two forward slashes `//` in front of
    the text you wish to comment on. This text will turn green. Note that the `//`
    will comment only on the one line you are currently commenting on. If you want
    to comment on a whole section across multiple lines, use `/*` at the beginning
    of the section and `*/` at the end. To un-comment, simply erase the `//` or the
    `/*--*/` block.


