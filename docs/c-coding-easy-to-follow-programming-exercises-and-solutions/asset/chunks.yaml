    of main:


    **#include <iostream> using namespace std; int main() { // code from above *num_ptr
    = 40; // assigning 40 to num_ptr }** Upon running we get an exception:


    ![](Images/image00152.jpeg)This means that we cannot access where this pointer
    is pointing to after we deallocated the storage.


    If we then assign the pointer to nullptr, so that it will point nowhere, here
    is what we should expect to get:


    ![](Images/image00153.jpeg)


    The relationship between pointers and arrays is a bit more interesting than we
