    e. You can also add Language Packs, which are literally add-ons to support your
    native language (i.e., English, French, etc.).


    ## 4. Other considerations


    There are many other options and methods not mentioned here, such as using the
    Command Line to make the installation and/or changes/customization, selecting
    a different location for the installation (we recommend sticking to the default),
    and so on. However, now that you have installed Visual Studio, it’s time to get
    your hands dirty and start coding.


    **Tips** Before starting (or during your first time working with Visual C++),
    there are 2 default options that you may want to set:


    1. Never run a previous version when the current version doesn’t compile. If the
    current version doesn’t compile, your compiler may offer you to run the last successful
    build. However, there is no point in doing so. Just fix any errors and build the
    code again.


    2. Always build the source code when the current compiled code isn’t up to date.
    This is done by an attribute called `UpToDateChecker`. During your second build,
    you will be asked whether to build the new source code or just run the previous
    build. Unless the entire source code is up to date, you won’t be able to perform
    proper debugging.


    3. On Run, build or deployment errors may occur. When running a project with `F5`
    or the `Debug > Start Debugging` command, the default setting “Prompt to launch”
    displays a message if a project should be run even if the build failed. Select
    “Launch old version” to automatically launch the last good build, which could
    result in mismatches between the running code and the source code. Select Do Not
    launch to suppress the message.


    ## 1.5 - Setting your IDE for Linux


    Linux users tend to use open-source compilers, and a great example would be `G++`.


    First, let’s open the Terminal. That can be done by pressing: `Ctrl + Alt + T`
    Then, install the `G++` compiler using the following command:


    ```bash

    sudo apt -get install g++

    ```


    If you are already authorized to install new software, the installation will proceed
    flawlessly. In case you are not, you will be asked to enter the Admin password.


    Then, just follow the instructions when prompted.


    ## 1.6 - Setting your IDE for MAC


    Like any other App, Xcode can be installed from the App Store.


    ![](Images/image00105.jpeg)


    You can find detailed instructions and guidelines on the following page. You can
    also register as an Apple developer on this page.


    # Chapter 2: Creating Your First Program


    ## Let’s Get Started...


    Why not jump into the cold water? Let’s write your first program together! First,
    launch Visual Studio. In the File menu select New / Project.


    ![](Images/image00106.jpeg)


    To save you time, Visual Studio provides pre-configured templates for commonly
    used source code projects. We will elaborate on this later. Currently, we selected
    the console window, as console provides a simple output (and input) to your program
    via a console window. Now let’s configure your new project:


    1. Choose the Windows console application.

    2. Choose a name for your program and path to save it.

    3. Click OK.


    2. **Once the project is opened, you will notice that Visual Studio has already
    done some preliminary work and preparations for you to get you up and running
    fast. Let''s see which features and elements Visual Studio provides:**


    ![](Images/image00107.jpeg)![](Images/image00108.jpeg)


    3. **Program breakdown**


    4. **Configuration**


    There are several Configurations that are associated with the target Processor
    (mainly x64 and Win32 or x86) and also Configurations for development and debugging
    (`DEBUG`) as opposed to releasing the final version (`RELEASE`), which will generate
    a `.exe` file. We will start with the default `DEBUG / x86`, as we want to be
    able to look for for errors and follow the code as it runs, as we will demonstrate
    later.


    5. **Preprocessors**


    C++ uses pre-processed libraries called header files, or `.h` files. These files
    are added to projects and pre-processed before anything else, and they exist to
    save you time. These files have references to commonly used libraries in C++.
    It is important to mention that the latest C++20 Modules were introduced to replace
    the old `.h` files method, yet they are still experimental and not part of the
    currently used C++ standard.


    6. **pch.h**


    `pch.h` stands for Pre Compiled Header, and it is used to place all `#include`
    files to be used in one file. The `pch.h` is already compiled, so it contains
    the binary that saves time during the build process. The `.h` files are not compiled,
    and each time you run your program, they are re-compiled. It means that if you
    have 6 or 8 `.h` files (sometimes even more) in your code, well—it’s heavy to
    compile. Therefore, using `pch.h` is a time and resource saver. We will dive deeper
    into `pch.h` later, so don’t worry if this seems a bit too much to understand
    at this stage.


    If your IDE does not have a default `pch.h` file—don’t worry, you won’t need it
    at this stage.


    7. **Functions– main()**


    The `main()` function is where the program starts its execution and where you
    place the first instructions you wish to be executed. The `main()` function is
    usually executed after some OS-related preparations that take place before giving
    you the control. For example: setting the input and output (such as Console window),
    loading system libraries, etc.


    The code you will write as part of the `main()` function will always be written
    between the curly braces `{}` at the top and bottom of `main()`.


    8. **Line numbers**


    Line numbers are there to help you follow the code, and in the case of compiler
    errors, the problematic line will be indicated in most cases.


    9. **The output area**


    The output area contains several tabs for several purposes, which will be discussed
    in more detail throughout this guide. Normally, based on the action you are taking,
    the output area will display the relevant details; for example: when you compile
    your code, you will see the compilation progress. When you link your code, you
    will see the linker’s output. When the program starts running, you will see any
    errors occur. This area is not the program’s output; the program’s output will
    be shown at separate Console window.


    10. **Solution Explorer**


    The solution explorer, or file system directory, allows you to navigate between
    different files and folders within your project. You can easily search a file
    by name using the search explorer at the top of the directory, and open/close
    the directory tree.


    Tip: If you wish to easily find the file that you are currently working on in
    the solution explorer, simply click the double arrow icon:


    ![](Images/image00109.jpeg)


    11. **Namespaces**


    The standard namespace is part of the C++ internals. But what is it exactly?


    The best way to explain this is with a real-life example: Let’s say you are visiting
    a friend at a hospital. The receptionist tells you that your friend is in room
    204 in building A. When you arrive at building A, you’re then told that your friend
    is not there and that he’s in another building A on the opposite side of the hospital.
    In real life, this could never happen—buildings in a hospital complex will have
    unique names, such as building A, building B, and so on. There are never two buildings
    named“A”—this would not make any sense. The same applies to street names—you don’t
    expect to have two streets named Main in the same city, right?


    The same applies to programming: Namespace is a standard for declared names that
    were created for the sake of disambiguation. For example, `cin` (input) and `cout`
    (output) are part of the `std` namespace, which is the standard namespace in C++.
    You will use these statements in your first program.


