    \ among several lines, we use `getline()`.\n\n### b. Using ‘getline()’ as a better\
    \ option for long text statements\n\n`getline` is used to input strings, along\
    \ several lines, from the user’s input (console) or from files. `getline` receives\
    \ the source as its parameters. That can be the console or a given file.\n\nGive\
    \ It A Try! Update the previous practice problem by asking the user for their\
    \ complete name. Then output their name and how old they are going to be in the\
    \ current year. For example, the output should say: “Hello Joe Smith. In 2020,\
