    ### 等运算符


    到这里你可能已经在想 C++ 使用哪个运算符来表示“等于”运算符。答案是我们使用“==” 运算符，你将在下一节中学习到。然而，这里有一些被检查为真或假的条件，这就是为什么我们喜欢把它们看作提出的“问题”：


    ```cpp

    (child == kinder) // 英语中的“child”等于德语中的“kinder”吗？

    ( “cellphone” == “handy” ) // 德语中的“cellphone”等于“handy”吗？

    (a + 3 == b + 2) // a+3 的值等于 b+2 的值吗？

    ```


    ### 数学运算符


    数学运算符用于在二进制位级上执行数学计算，它们是你最可能在小学早期学过的基础运算符：


    字体 加法运算符 `+`

    - 减法运算符 `-`

    - 乘法运算符 `*`

    - 除法运算符 `/`

    - 取模运算符 `%`


    让我们来看看这些运算符的使用示例：


    ```cpp

    a = 25; // a 被赋值为值 25

    b = 42; // b 被赋值为值 42

    x = 3; // x 被赋值为值 3

    i = a + b; // i 被赋值为 (25+42) = 67

    b = a – x; // 现在 b 被赋值为 (25-3) = 22

    ```


    ### C++ 复合赋值运算符


    既然我们理解了普通的赋值运算符和数学运算符，现在我们可以继续讨论复合赋值运算符了。这些运算符在对变量赋值的同时，会对其进行数学运算。正如从这些示例所示，这很容易理解：


    ```cpp

    x += y // 等同于说 x = x+y

    x -= 10 // 等同于说 x = x-10

    x /= 2 // 等同于说 x = x/2

    ```


    ### C++ 关系运算符


    关系运算符在 C++ 中非常强大。当我们想要比较操作数时使用它们，而比较可以在几个级别上进行。让我们看看示例：


    ```cpp

    (c <= 4) // c 小于或等于 4 吗？

    (a > c) // a 比 c 大吗？

    (b != a) // b 不等于 a 吗？

    (b < c) // b 小于 c 吗？

    (x == a) // x 等于 a 吗？

    (x == a) // x 等于 5 吗？

    ```


    ### 逻辑运算符


    逻辑运算符用于组合条件或约束，且输出仅为真或假的结果。当我们想要输出一个真或假的结果时使用它们，这就是为什么我们喜欢看到这些问题：


    1. `&&` 运算符意味着“与”。

    2. `||` 运算符意味着“或”。


    很多情况下，运算符的优先级总是从左到右设置。这意味着当我们使用 `&&` 运算符时，如果左侧为假，则将不再检查右侧。当使用 `||` 运算符时，如果左侧为假，则将检查右侧。


    ```cpp

    (i == 4) && (a < 6) // i 等于 4 且 a 小于 6 吗？

    (i == 4) || (a < 6) // i 等于 4 或 a 小于 6 吗？

    ```


    ### 条件运算符


    正如我们在指南第一节解释的，现代 C++ 总是试图简化代码。`?:` 运算符是代码变得变得很好的例子。我们刚刚学习了如何使用 `&&` 和 `||` 条件，`?:`
    让我们的生活更加简单。


    在这种情况下使用的表达式为：`条件? 结果 1 : 结果 2`。如果条件为真，则执行结果 1。如果条件为假，则执行结果 2。你可以看到，这非常简单。


    让我们来看另一个例子。假设我们要编写一个为 18 岁及以上的成人提供折扣的程序。在这种情况下，我们将用户输入年龄，程序可以立即判断他们是否为成年。我们将以这种方式使用条件
    `?` 和 `:` 运算符：


    - `?` —— 条件为真时的值。

    - `:` —— 条件为假时的值。


    ```cpp

    Adult = (Age > 18) ? true : false ;

    ```


    这等同于编写以下：`Adult = (Age > 18);`


