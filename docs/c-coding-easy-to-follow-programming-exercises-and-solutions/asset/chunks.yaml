    Basically, you can access class members in two ways: by using the dot (.) operator,
    and by using the arrow operator -> also known as a member of the pointer operator.
    We can access class attributes and class methods.


    Using the dot (.) operator. Let ’s look at an example of using the dot operator
    from our last class, Manage_Account. We already created an account for Linda.
    We can now access methods from the class:


    **Manage_Account linda_account; Linda_account.is_overdrawn(50); //using the .
    in order to //access is_overdrawn method Linda_account.deposit (50); //using .
    to access deposit method**


    You can see how simple it is to use the dot operator to access class members.
    But what do we do if we have a pointer as an object? Well, you probably guessed,
    we need to dereference it:


    **Manage_Account *linda_account = new Manage_Account (); (*linda_account).deposit
    (500);**


    You probably noticed that we used parenthesis here. The reason is that the dot
    operator has a higher priority than the dereference operator * and we need to
    be sure that the dereferencing will take place before accessing the class object.


    **Important to remember: *linda_account is NOT an object, but a pointer to an
    object.**


    The second method to access class objects is by using the arrow operator, also
    called member of pointer operator -> (a dash followed by a greater than sign)
    like this:


    **linda_account->deposit (500);**


    The arrow operator is easier to use and read. It was introduced in C++ because
    the dot operator, such as with the use of dereferencing pointers, can be somewhat
    awkward. You will probably see the arrow operator used commonly in code.


    **Public and private class members**


    We already mentioned that when defining a class, we can determine who can access
    the class and class members. In C++, we have three class access member options:
    public, private, and protected. A public class can be accessed by anyone from
    anywhere. A private class is accessible only by members of the class, or friends
    of the class (we will elaborate more about this). Protected classes can be used
    and accessed only with inheritance, which we will introduce in a later section.


    In order to use the access member modifier, we will use very simple syntax. We
    simply write the access modifier in the body of the class, like this:


    **class Class_Name { public: //deceleration };**


    We can use several access modifiers within a class so that some class members
    will be public and some private. Let’s use the class we already defined:


    **class Manage_Account { private: //attributes string name; //the name of the
    client int UID; //Unique ID per client int DOB //date of birth double balance
    //account balance //methods public: bool is_overdrawn(double); //is the account
    overdrawn bool deposit(double); //is there a deposit bool withdraw(double); //is
    there a window }**


    In this case, the methods are accessible outside the class, but the attributes
    are only accessible to members of the class. It is very common to use several
    access modifiers within a class. It’s important to remember that if you try to
    access a private class member, you will get a compilation error.


    ## **15.2 - Implementing class methods**


    Once we have created our class, we will need to implement the c lasses’ methods,
    which is very similar to the way we implement functions. We can implement methods
    inside and outside the class declaration, but remember that when we implement
    them outside the class declaration, we must use the following syntax:


    **class_name::method_name** As you can see, when implementing class methods, we
