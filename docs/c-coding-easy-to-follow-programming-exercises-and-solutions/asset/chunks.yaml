    \ Rank // 抽象基类\n{\nprivate :\n    // 所有等级共有的属性\npublic :\n    virtual void move()\
    \ = 0; // 纯虚函数\n    virtual void go_back() = 0; // 纯虚函数\n    virtual ~Rank() {\
    \ }\n};\nclass General : public Rank // 抽象类\n{\npublic :\n    virtual ~General()\
    \ { }\n};\nclass Colonel : public Rank // 抽象类\n{\npublic :\n    virtual ~Colonel()\
    \ { };\n};\nclass Captain : public Rank // 抽象类\n{\npublic :\n    virtual ~Captain()\
    \ { };\n};\nclass Player_General : public General // 具体类\n{\npublic :\n    virtual\
    \ void move() override {\n        cout <<“The General is moving forward” << endl;\n\
    \    }\n    virtual void go_back() override {\n        std::cout <<“The General\
    \ is moving backward” << std::endl;\n    }\n    virtual ~Player_General() {}\n\
    };\nclass Player_Colonel : public Colonel // 具体类\n{\npublic :\n    virtual void\
    \ move() override {\n        std::cout <<“The Colonel is moving forward” << std::endl;\n\
    \    }\n    virtual void go_back() override {\n        std::cout <<“The Colonel\
    \ is moving backwards” << std::endl;\n    }\n    virtual ~Player_Colonel() {}\n\
    };\nclass Player_Captain : public Captain // 具体类\n{\npublic :\n    virtual void\
    \ move() override {\n        std::cout <<“The Captain is moving forward” << std::endl;\n\
    \    }\n    virtual void go_back() override {\n        std::cout <<“The Captain\
    \ is moving Backwards” << std::endl;\n    }\n    virtual ~Player_Captain() {}\n\
    };\nint main() {\n    Rank *ptr1 = new Player_General ();\n    ptr1->move(); //\
    \ 调用 move 函数并动态绑定\n    ptr1->go_back(); // 调用 go_back 函数并动态绑定\n\n    Rank *ptr2\
    \ = new Player_Colonel ();\n    ptr2->move(); // 调用 move 函数并动态绑定\n    ptr2->go_back();\
    \ // 调用 go_back 函数并动态绑定\n\n    Rank *ptr3 = new Player_Captain ();\n    ptr3->move();\
    \ // 调用 move 函数并动态绑定\n    ptr3->go_back(); // 调用 go_back 函数并动态绑定\n}\n```\n\n当我们运行这段代码时，我们预期的结果是：\n\
    \n![](img/image00168.jpeg)\n随着你对 C++ 知识和经验的增加，多态还有更多内容可以学习。你可以在以下链接中找到非常有用的信息：`http://www.cplusplus.com/doc/tutorial/polymorphism/`\n\
    \n# 第 21 章：C++ 练习\n\n你在精通 C++ 的道路上已经走了很远。C++ 是一门复杂且难以掌握的编程语言，还有很多需要学习的内容。下面你将看到一个代码示例，用来总结你在书中学到的内容。这个练习旨在解决一个复杂的问题，同时利用你目前已获得的工具和知识来完成它。\n\
    \n## 练习示例\n\n### 在反方向移动 vector 元素\n\n在这个代码谜题中，我们需要旋转 vector 中的项，使得第一个项变成最后一个项，第二个项变成倒数第二个项。例如，如果我们有一个值为如下的\
    \ vector：\n\n**3, 8, 9, 7, 6**\n\n你需要翻转 vector 元素的顺序，使其显示为：\n\n**6, 7, 9, 8, 3**\n\
    \n解决这个问题有多种方法，下面演示的方法在时间和资源方面是最效率的。\n\n以下代码移动了传递给我们函数的、以 vector 形式传入的给定数字集合的内容。接下来，我们将每个项向右移动，无法再向右移动的最后一项（最右侧）被放在最左侧的位置。这种移动被称为“位移”（shifting），用于许多用途，例如为了统计目的打乱数据。\n\
    \n让我们来看代码中的一些函数：\n\n- `shift_once()` 执行单次位移。\n- `print_vector()` 输出 vector 在当前状态下的内容。正如之前解释的，为了调试测试目的，拥有自己的“打印”函数总是很有用的。\n\
    - `shift_all()` 函数执行 `K` 次位移，其中 `K` 是随 vector 一起提供的函数参数。\n- `main` 函数仅在给定预定义 vector\
    \ 和值 `K` 的情况下调用 `shift_all()`。\n\n```cpp\n#include \"pch.h\"\n#include <iostream>\n\
    #include <vector>\nusing namespace std;\n\n// print_vector 函数显示 vector 的当前状态\n\
    // 建议在几乎任何工作或练习中准备好这样的函数\n// 这样做可以让你打印 vector 在任何时刻的状态\nvoid print_vector( vector\
    \ < int > v )\n{\n    int len = v .size();\n    for ( int i = 0; i < len; i++)\n\
    \    {\n        cout << i << “ = “ << v [ i ] << endl;\n    }\n}\n// 此函数是项目的构建模块\n\
    // 在此函数中我们位移 vector 一\n// 然后我们可以多次调用此函数来多次位移 vector\nvoid shift_once( vector <\
    \ int > & v ) {\n    int len = v .size();\n    int temp = v [ len - 1 ]; // 为了位移\
    \ vector，我们首先将最后一个项存储在‘temp’中\n    for ( int i = len - 1; i > 0; i--) {\n    \
    \    v [ i ] = v [ i - 1 ]; // 然后向向移动并将每个项设置为上一个项的值\n    }\n    v [ 0 ] = temp;\
    \ // 最后我们将第一个项设置为\n}\n// 此函数通过调用 shift_all 参数将 vector 位移 K 次\nvector < int > shift_all(\
    \ vector < int > A , int K ) {\n    for ( int i = 0; i < K ; i++) {\n        cout\
    \ <<“Shifted vector:\\n” ;\n        shift_once( A );\n    }\n    return A;\n}\n\
    // 这是项目的主函数\nint main() {\n    vector < int >v{ 3, 8, 9, 7, 6 };\n    vector <\
    \ int > shifted;\n    shifted = shift_all(v, 3);\n    cout <<“Solution vector:\\\
    n” ;\n    print_vector(shifted);\n    return 0;\n}\n```\n"
- fmt: "\nWhen you learned about raw pointers, you saw that raw pointers can be extremely\
    \ robust when used in your code. Pointers allow us to allocate and deallocate\
    \ memory in a flexible manner, thus helps us to better manage our program during\
    \ its lifetime. However, sometimes these operations open the door for various\
    \ problems and issues. In case there is a slight oversight, then your whole program\
    \ is in danger of crashing. Since the management of raw pointers is managed solely\
    \ by the programmer, and as every dynamically allocated object must be followed\
    \ by manual deallocation, serious problems might follow if, by chance, you make\
    \ a mistake and forget to conduct the manual deallocation. Such issues might be\
    \ memory leaks.\n\nThere might be some more issues when dealing with dynamically\
    \ allocated arrays, as the deletion of an array object requires a different operator.\
    \ This basically means that you are forced to keep following every allocated storage.\
    \ Failing to do so will result in the undefined behavior of your program.\n\n\
    There are so many potential issues with raw pointers, such as the mentioned memory\
    \ leaks and wild pointers (uninitialized pointers), which may point anywhere in\
    \ memory. You also learned about dangling pointers, which point to a storage that\
    \ is believed to be valid, yet it is not. There are more pointerrelated issues,\
    \ exceptions, and potential bugs. When it comes to complex code, this can result\
    \ in a catastrophic result.\n\nSmart pointers were introduced In modern C++ in\
    \ order to prevent these problems. Using smart pointers can, in many cases, make\
    \ your life easier and prevent you from spending hours hunting and fixing bugs.\
    \ Many programmers use only smart pointers, while others use both smart and raw\
    \ pointers. In modern C++, we also use Atomic Pointers, but we will not cover\
    \ this subject in this section, as it is more advanced and relates to multithreading.\n\
    \nLet ’s understand what smart pointers are and how they work.\n\nSmart pointers\
    \ allow automatic management of memory allocation and deallocation in order to\
    \ solve and prevent all the issues mentioned above. Smart pointers are C++ objects\
    \ and are implemented as a C++ template class (in the same manner that we used\
    \ the built-in C++ `vector` class). You will learn more about the C++ template\
    \ class in a later section. Smart pointers can only point to memory that is allocated\
    \ on the heap. When there is no more need to use the allocated memory, smart pointers\
    \ delete it automatically. Smart pointers are basically just C++ classes, which\
    \ are an internal part of the C++ library, and they wrap the raw pointers, as\
    \ these classes know how to handle raw pointers in various situations and use\
    \ cases. It is important to remember that it is not possible to do any arithmetic\
    \ operations with smart pointers, while raw pointers allow you to do so.\n\nC++\
    \ offers several types of smart pointers:\n\n- Unique pointers (`unique_ptr`)\n\
    - Shared pointers (`shared_ptr`)\n- Weak pointers (`weak_ptr`)\n- Auto pointers\
    \ (`auto_ptr`) - Auto Pointers are not covered in this section as they are a thing\
    \ of the past and hardly used in modern up to date C++ code. We will explain and\
    \ demonstrate the use cases and methods for using all of these pointers in this\
    \ section.\n\nFirst, in order to use a smart pointer, we need to include the C++\
    \ memory `.h` file as it holds the methods and functions for using smart pointers:\
    \ `#include <memory>`. The syntax for using smart pointers is demonstrated below.\
    \ Remember that the destructor is called automatically:\n\n```cpp\n{\nstd::pointer_type\
    \ <Class_Name> ptr = … .. ptr -> function (); //function body goes here \n}\n\
    ```\n\n### Smart Pointers and the RAII design pattern\n\nThe term `RAII` is related\
    \ to a design pattern that is used in C++, and it is based on container object\
    \ lifetime. The initials `RAII` stand for Resource Acquisition Is Initialization.\
    \ At first look, this complicated name might seem complex, but it is actually\
    \ really simple. The `RAII` objects are stored on the stack. The `RAII` objects\
    \ require resources to conduct various operations, such as allocating memory.\
    \ The `RAII` objects require initialization—a concept that you should already\
    \ be familiar with at this point. These objects must also be relinquished, as\
    \ we did with the use of destructors.\n\nSmart pointers are `RAII` classes, as\
    \ they answer each of the features we just mentioned.\n\n### Unique Pointers\n\
    \nWe already introduced you to the types of smart pointers used in C++. Let ’s\
    \ explore each one and see how and when they are used. The first smart pointer\
    \ we shall look into is the `unique_ptr`, as this is probably the most simple\
    \ and common pointer used. You will probably see a lot of it when you start working\
    \ on existing codes.\n\n`unique_ptr` are, as the name indicates, unique. It means\
    \ that you can use only one `unique_ptr` to point to an object on the heap, and\
    \ it can point to any object type as we require. It is also referred to as the\
    \ ownership relationship between the pointer and the object’s memory allocation.\
    \ `unique_ptr` also can be copied or assigned to another memory allocation. This\
    \ makes sense as we just mentioned the ownership relationship between the `unique_ptr`\
    \ and the allocated memory—which works both ways. However, `unique_ptr` can be\
    \ moved.\n\nLastly, when the pointer is destroyed, that which it points to is\
    \ also automatically destroyed as well, as it holds a unique ownership relationship.\n\
    \nLet ’s see a code sample for using `unique_ptr`:\n```cpp\n{ \nstd::unique_ptr\
    \ <int> p {new int {30}}; \nstd::cout << *p << std::endl; \n*p = 2; \nstd::cout\
    \ << *p << std::endl; \n}\n```\n\n`unique_ptr` also has some pretty nice methods,\
    \ which are built in the class. Let’s have a quick look at some of these methods:\n\
    \n```cpp\n{ \nstd::unique_ptr <int> p {new int {30}}; \nif (p) //checks if p is\
    \ initialized \nstd::cout << *p << std::endl; //will display 30 \np.reset(); //sets\
    \ the pointer to nullptr \nif (p) //checks if p is initialized \nstd::cout <<\
    \ *p << std::endl; //won’t execute as we just //set p to null ptr \nstd::cout\
    \ << p.get() << std::endl; //will display the memory //address on the heap. Deletes\
    \ //automatically what the object //points to. \n}\n```\n\nThere is a better way\
    \ to initialize unique pointers, in which we don ’t have to use the `new` keyword,\
    \ all while keeping our code simpler and cleaner. The method is called `make_unique`,\
    \ and it was introduced in C++14. This method helps us prevent some exceptions\
    \ related to the cleanup process after the objects run out of scope. You will\
    \ learn more about exception in a later section.\n\n```cpp\nstd::unique_ptr<int>\
    \ p = std::make_unique<int>(100);\n```\n\nSo, you can see that we initialize `p`\
    \ to a new `int` object on the heap. We Then dereferenced the pointer, in the\
