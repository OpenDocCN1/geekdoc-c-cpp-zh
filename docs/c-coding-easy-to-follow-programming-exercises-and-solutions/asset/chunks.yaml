    \ //note the indentation in this code\n    {\n    case 1: cout <<“You selected\
    \ option 1” ; break;\n    case 2: cout <<“You selected option 2” ; break;\n  \
    \  case 3: cout <<“You selected option 3” ; break;\n    case 4: cout <<“You selected\
    \ option 4” ; break;\n    default : cout <<“No choice was made, please try again”\
    \ ;\n    }\n}\n```\n\nIn many ways, a switch case is similar to the if-else statement\
    \ in the manner that they move from one expression to another, yet there are some\
    \ core differences between the two. The switch case can basically replace the\
    \ if-else statements when we need a more efficient loop. Let’s look at some of\
