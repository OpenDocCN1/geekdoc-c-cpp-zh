    \ (int)` 构造函数，后者具有单个整数参数。我们将整数 `p` 传递给父类 `Account` 并进行初始化。让我们看看更详细的代码：\n\n我们的父类包含两个构造函数的形式如下：\n\
    ```cpp\nclass Account { \n    int balance; //balance 是私有成员，因为类中默认的访问修饰符是私有的 \n\
    \    public: \n        Account() : balance {0} { Std::cout <<“no arguments constructor”\
    \ << std::endl; } \n        Account (int p) : balance {p} { Std::cout <<“integer\
    \ based constructor” << std::endl; } \n}; \n```\n我们的派生类将是：\n```cpp\nclass Turst_Account:\
    \ public Account { \n    int double_balance; \n    public: \n        // 取消基类构造函数\
    \ \n        Turst_Account() : Account{}, double_balance {0} { Std::cout <<“Derived\
    \ constructor with no arguments” << std::endl; } \n        // 初始化派生类自己的 double\
    \ 类型值属性\n        Turst_Account (int p) : Account{p}, double_balance {p * 0.2}\
    \ { Std::cout <<“Integer derived constructor” << std::endl; } \n}; \n```\n\n你还应该注意，并不是所有内容都会自动继承。让我们来看一个例子，看看子类没有从父类中继承什么内容：\n\
    \n- 基类的构造函数和析构函数。\n- 基类的重载赋值运算符。\n- 基类的友元函数。\n\n### 修改基类方法\n\n正如我们所解释的，基类成员对派生类是可用的。此外，我们展示了派生类如何调用基类的构造函数。在本节中，我们将解释派生类如何调用、重写或重定义基类方法。为了实现这一点，我们首先需要在派生类中提供该方法名。实现此操作的代码如下：\n\
    \n首先，让我们看看我们的父类：\n```cpp\n#include <iostream> \nclass Account { \npublic: \n \
    \   // 这是原始的 get_ballance() 函数 \n    double get_ballance(double amount) { \n \
    \       double ballance{ 100 }; \n        ballance += amount; \n        return\
    \ ballance; \n    }; \n}; \nclass Trust_Account : public Account { \n    // get_balance()\
    \ 的这个派生版本重定义了基类方法 \n    double get_balance(double amount) { \n        double ballance{\
    \ 500 }; \n        ballance += amount; \n        amount *= 1.07; // 这行触发了对基类方法的调用\
    \ \n        return(Account::get_ballance(amount)); \n    } \n}; \nint main() {\
    \ \n    Trust_Account test; \n    double result = test.get_ballance(1000.0); \n\
    \    std::cout <<“result =“ << result << std::endl; \n}\n```\n\n你可以看到，我们使用相同的基类方法签名在派生类中重定义该方法。\n\
    \n如你所知，一个类可以继承另一个基类，但在 C++ 中，我们也可以使用多重继承。多重继承是指派生类同时继承两个或多个类。多重继承的语法非常简单：我们声明派生类，然后简单地用逗号分隔基类的名称，如下所示：\n\
    \n```cpp\nclass Child:\npublic Parent_1 , public Parent_2\n{\n    // 在此处放置语句\n\
    };\n```\n\n多重继承可能非常复杂，我们建议你在重构代码以满足程序需求时，尽量避免使用它。如果你想阅读更多内容，可以访问此链接：`https://www.learncpp.com/cpp-tutorial/117-multiple-inheritance/`\n\
    \n### 关于继承还有很多需要学习的内容，因为它是一个复杂的课题。你会在大多数 C++ 项目中遇到继承，因此我们建议你进一步深你的 C++ 知识。你可以在此链接找到很好的资源：`https://www.geeksforgeeks.org/inheritance-in-c/`，以及这一个：`http://www.cplusplus.com/doc/tutorial/inheritance/`\n\
    \n总结这个主题，请查看下方的代码并遵循它执行。你可以尝试自己修改它，添加另一个类并重定义方法。请注意，这段代码包含一个 getter (get) 和一个\
    \ setter (set) 函数，我们将在稍后的章节中详细讨论。\n\n```cpp\n#include \"pch.h\"\n#include <iostream>\
    \ \nusing namespace std; // 首先我们定义一个枚举，列出所有可能的军衔 \ntypedef enum\n{ \n    General\
    \ , \n    Admiral , \n    Major , \n    Lieutenant \n} Rank ; // 我们定义了一个名为 User\
    \ 的通用类 \nclass User { \nprivate : \n    string m_FirstName; \n    string m_LastName;\n\
    \    int m_UserCode; \npublic : \n    void SetDetails( string FirstName , string\
    \ LastName , int UserCode ) { \n        m_FirstName = FirstName ; \n        m_LastName\
    \ = LastName ; \n        m_UserCode = UserCode ; \n    } \n    string GetFirstName()\
    \ { return m_FirstName; } \n    string GetLastName() { return m_LastName; } \n\
    \    int GetUserCode() { return m_UserCode; } \n}; // 现在我们从 User 派生了一个新类，称为 Commander\
    \ 类 \nclass Commander : public User { \n    Rank m_Rank; \n    void PrintRank(\
    \ Rank rank ); \n    public : \n    void SetRank( Rank rank ); \n}; // 下面的类打印给定\
    \ User/Commander 的军衔\nvoid Commander ::PrintRank( Rank rank ) \n{\n    // 由于枚举值实际上是数值，我们可以使用\
    \ switch \n    switch ( rank )\n    { \n        case Rank :: Admiral : cout <<“Admiral”\
    \ ; break; \n        case Rank :: General : cout <<“General” ; break; \n     \
    \   case Rank :: Lieutenant : cout <<“Lieutenant” ; break; \n        case Rank\
    \ :: Major : cout <<“Major” ; break; \n        default : cout <<“Unknown” ; \n\
    \    } \n}\n// 这是我们的 setter 函数，因为我们不能直接修改值\nvoid Commander ::SetRank( Rank rank\
    \ ) { \n    m_Rank = rank ; \n    cout <<“Set rank to” ; \n    PrintRank(rank);\
    \ \n    cout << endl; \n}\n\n// 这里是我们的 main 函数，我们在其中演示了如何使用这两个类\nint main()\n\
    {\n    Commander ourCommander; // 我们定义了一个 Commander 的实例\n    ourCommander.SetDetails(\
    \ “John” , “Smith” , 1);\n    // 我们使用 setter 设置实例中的数据\n    cout <<“Our soldier\
    \ details are: “ << ourCommander.GetFirstName().c_str() <<““ << ourCommander.GetLastName().c_str()\
    \ << “ ” << ourCommander.GetUserCode() << endl;\n    // 我们使用 setter 函数更改数据。这个特定的函数还调用了我们的打印函数，因此在设置值之后\n\
    \    ourCommander.SetRank( Rank :: Admiral ); \n}\n```\n\n"
- fmt: "\n# Virtual Functions\n\nWe mentioned Virtual functions, but what are they?\
    \ We know what regular functions and methods do, yet the difference is that virtual\
    \ functions allow us to override methods into subclasses during runtime. Let’s\
    \ say we have two classes: `class A` and `class B`, `class B` is derived from\
    \ `A`. If we create a method in `class A` and mark it as `virtual`, we then get\
    \ the option to override it to the `B` class, using it to do different things,\
    \ while we skip the static default binding. This might seem confusing, and indeed,\
    \ this is a bit more complex subject to master. We will take you step by step,\
    \ explain the basic concepts and syntax, so that you can be confident during programming.\n\
    \nWe actually used compile time polymorphism in a few of our previous sections:\
    \ when we overloaded operators and when we overloaded functions. When we talk\
    \ about run time polymorphism, we are discussing function overriding. It is also\
    \ called `dynamic polymorphism` and, in other words: `virtual functions`.\n\n\
    So, in a derived class, we can redefine the way the base class functions will\
    \ work, and this is done dynamically. This is the basic concept of virtual functions—an\
    \ overridden function is a virtual function, which is a special version of the\
    \ base class function. Below is the syntax we use for declaring a function as\
    \ virtual. This code snippet is from the base class:\n\n```cpp\nclass Account\
    \ { public: virtual void deposit (double amount); //statements };\n```\n\nLet’s\
    \ see how we can override the base function in our derived class:\n\n```cpp\n\
    class Trust_Account : public Account { public: virtual void deposit (double amount);\n\
    //we don’t have to use the keyword virtual in this case, but it is best //practice\
    \ to do so\nstatements can go here\n};\n```\n\nImportant: to override a function,\
    \ the function signature and return type must match the base class, or else, the\
    \ compiler will bind it statically. Let’s see a code example. When we run the\
    \ code below, there is no dynamic binding taking place. Let’s go through this\
    \ code and understand it better:\n\n```cpp\n#include \"pch.h\" \n#include <iostream>\
    \ \n// Below is the Account Class hierarchy \nclass Account { \n    public : \n\
    \    void deposit( double amount ) { \n        std::cout <<“In Account::deposit”\
    \ << std::endl; \n    } \n}; \nclass Trust_Account : public Account { \n    public\
    \ : \n    void deposit( double amount ) { \n        std::cout <<“In Trust_Account::deposit”\
    \ << std::endl; \n    } \n}; \nclass Student_Account : public Account { \n   \
    \ public : \n    void deposit( double amount ) { \n        std::cout <<“In Student_Account::deposit”\
    \ << std::endl; \n    } \n}; \nclass Savings_Account : public Account { \n   \
    \ public : \n    void deposit( double amount ) { \n        std::cout <<“In Savings::deposit”\
    \ << std::endl; \n    } \n}; \nint main() { \n    std::cout <<“Pointers pointing\
    \ to each account type“ << std::endl;\n    std::cout << “=======================================“\
    \ << std::endl;\n    Account *p1 = new Account (); \n    Account *p2 = new Trust_Account\
    \ (); \n    Account *p3 = new Student_Account (); \n    Account *p4 = new Savings_Account\
    \ ();\n    std::cout <<“Calling our deposit method for each account” << std::endl;\n\
    \    std::cout <<“=======================================“ << std::endl;\n   \
    \ p1->deposit(200); \n    p2->deposit(200); \n    p3->deposit(200); \n    p4->deposit(200);\n\
    \    std::cout <<“=======================================“ << std::endl;\n   \
    \ std::cout <<“Delete the pointers “ << std::endl; \n    std::cout <<“=======================================”\
    \ << std::endl;\n    delete p1; delete p2; delete p3; delete p4; \n    return\
    \ 0;\n}\n```\n\nThis is what we get when we execute: We can see that all of the\
    \ `deposit` methods are currently statically bound to the base class.\n\n## How\
    \ do we turn this code into a polymorphic one?\n\nFirst, we need to see the methods\
    \ that we want to bind dynamically. Can you guess the one(s)? In this code, there\
    \ is only one method we need to turn into a virtual function: the `deposit` function.\
    \ We simply need to add the keyword `virtual` at the beginning of the function:\n\
    \n```cpp\nvirtual void deposit( double amount )\n```\n\nFurthermore, as we mentioned\
    \ before, it is best practice to add the `virtual` keyword to all the methods\
    \ in the derived classes.\n\nNow let’s run the code and see what happens. Here\
    \ is the output that is shown when the program runs:\n\n## Virtual destructors\n\
    \nWhen using polymorphism, we may encounter issues or compiler warnings related\
    \ to destroying polymorphic objects. In fact, when you run the previous code,\
    \ you can see these warnings. Why does this happen? Well, as a derived class destroys\
    \ objects, it deletes storage via the base class pointer with the class non-virtual\
    \ destructor. This is a kind of behavior that is not part of the C++ standard\
    \ and can cause memory leaks. Using `virtual destructors` helps us destroy the\
    \ objects in the correct order using the correct destructor. Using `virtual destructors`\
    \ is very simple. If your class uses a virtual function, you must use a virtual\
    \ destructor like in the example below:\n\n```cpp\nclass Account\n{\npublic :\n\
    \    virtual void deposit( double amount );\n    virtual ~Account();\n};\n```\n\
    \nYou can see that the syntax is very simple, we add the `virtual` keyword before\
    \ our destructor.\n\n## Pure virtual function\n\nBefore we dive into pure virtual\
    \ functions, let ’s get to know another term:`abstract class`. An abstract class,\
    \ also known as an abstract base class, is used as a base class in inheritance\
    \ hierarchies, and it cannot be instantiated (make object of class). Until now,\
    \ we used classes that can be instantiated, and they are called `concrete classes`.\
    \ As you saw already, it is used to define a useful object that can be instantiated\
    \ as an automatic variable on the program stack. It will be accurate to say that\
    \ an abstract class will be used as a parent class, and the classes which will\
    \ derive from it can be `concrete classes`. For example, when we use the `Account`\
    \ class and the derived classes, we can say that there is no such thing as “just\
    \ an account”—if a client wants to open an account, they will need to choose the\
    \ type of account they want, as the general term “Account” is too abstract. It\
    \ is important to know that an abstract class must contain at least one pure virtual\
    \ function—which takes us back to the subject of this section.\n\nWhat is a pure\
    \ virtual function, and how does it look like? Well, first, it is used to make\
    \ a class abstract and is declared using `= 0` in its declaration:\n\n```cpp\n\
    virtual void function() = 0;\n```\n\nUsually, we do not add any implementation\
    \ to the pure virtual function, as this will usually be added in the derived classes.\
    \ It also means that the derived class has to override the base class—if it does\
    \ not, the derived class will also be an abstract class.\n\nSo, when do we use\
    \ abstract classes? It is best to use them when we do not need to use any function\
    \ implementation in the base class. This all might seem very confusing, but think\
    \ about it this way: do you remember the generalization diagram in the inheritance\
    \ section? It is when you cannot open a general account in your bank, only a specific\
    \ account, such as a checking account, a trust account, or a savings account.\
    \ The general base account class is abstract, and there will be no pure virtual\
    \ function implementation, as this account is just a skeleton with commonalities\
    \ for all the derived classes and not an actual account type. Let’s look at another\
    \ example. Let’s say we have a class named `Shape`. `Shape` is a very general\
    \ term that can describe either a circle, a triangle, or a square. Therefore,\
    \ `Shape` is a perfect abstract class, and the attributes of `Shape` must have\
    \ a shared commonality with all of its derived classes.\n\nIt is also important\
    \ to remember that when dealing with abstract classes, we cannot create abstract\
    \ class objects or allocate new memory on the heap:\n\n```cpp\nAccount account;\
    \ // compilation error\nAccount *ptr = new Account (); // compilation error\n\
    ```\n\nHowever, we can use pointers and references within the derived concrete\
    \ classes to achieve polymorphism:\n\n```cpp\nAccount *ptr = new Saving_Account();\
    \ //ok no compilation error\nptr->deposit(); //ok no compilation error\n```\n"
