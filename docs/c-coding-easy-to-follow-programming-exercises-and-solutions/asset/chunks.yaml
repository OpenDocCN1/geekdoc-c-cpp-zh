    # **Chapter 27: Multithreading and Concurrency in C++**


    When we discuss multithreading and concurrency in C++ or any programming language,
    we mean two or more separate activities that are occuring in parallel or concurrently,
    as our program performs multiple independent activities simultaneously. Current
    computer systems with powerful processors allow programs to perform concurrent
    activity easily, with no overload.


    The word multithreading implies that we use threads, but what is a thread? In
    computer programming, each process holds a thread of execution, which is called
    the main thread. Other threads can be created with the same address of the parent
    process, yet each thread also holds a unique ID, which separates it from other
    threads, even from the same parent process.'
