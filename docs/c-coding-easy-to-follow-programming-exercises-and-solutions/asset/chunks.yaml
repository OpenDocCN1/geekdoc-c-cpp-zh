    ## **Local vs. Global Variables**


    In the last coding exercise, we declared and initialized variables within the
    main function. These variables can only be used within this function and are therefore
    called Local Variables. The scope of local variables is limited to the main function.


    Another way to declare and initialize variables is outside the main function,
    allowing other parts of your program to access them. These variables are called
    Global Variables.


    **Important: Global variables are always initialized to zero (0) by default if
    you don''t initialize them yourself, while uninitialized local variables do not
    have any default initialization value.**


    Many programmers prefer to use local variables as it is easier to debug and manage
    when the code is very complex, in the sense of keeping your variable close and
    accessible. Another disadvantage with global variables is the fact that they cannot
    only be accessed from anywhere in your program; they are also subject to change
    from any part, which can be risky sometimes.


    ## **C++ hierarchy with local and global variables**


