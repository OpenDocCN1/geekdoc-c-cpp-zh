    **Dynamic memory allocation with pointers**


    One of the great things about C++ is that it allows us to truly control every
    aspect that is affected by our program, and memory is a meaningful part of that.
    In many cases, we don’t really know in advance how much memory is needed in order
    to perform a specific action, especially when we work with arrays or even more
    with vectors. The solution in these cases is to allocate the required memory space
    during runtime. Here is where pointers come into the picture: we use pointers
    to allocate memory dynamically on the heap. Dynamic memory allocation is important,
    and you will use it in many cases in your program, so it’s important to truly
    understand it.


    We already explained the basics of the heap and the stack, and in this section,
    we will explain it even further.


    In order to allocate memory dynamically on the heap, we use the new keyword:


    **int *ptr = new int; //allocating memory for an integer on the //heap using “new”**


    By using new, instead of assigning an address of an integer to the pointer, (like
    we did previously), we actually create an address dynamically during runtime.
    You just have to remember that until you initialize, the storage will contain
    garbage data. Let’s see how it will look in real code:


    **#include <iostream>


    using namespace std;


    int main()


    {


    int *num_ptr{ nullptr }; //we initialize a pointer to point nowhere num_ptr =
    new int ; //we allocate memory for an integer on the heap //and stores the address
    in the pointer num_ptr


    cout << &num_ptr << endl; //this will show us the address of the new // int we
    just created


    cout << *num_ptr << endl; //since we didn’t initialize the variable //we will
    get garbage data here


    *num_ptr = 25; //initializing to 25


    cout << *num_ptr << endl; //25 will be displayed now instead of the //garbage
    that was displayed before we //initialized }** When we run this code, this is
    what we should expect:


    ![](Images/image00151.jpeg)


    - The first output is the address allocated on the heap.


    - The second output is garbage data as we didn’t initialize the variable yet.


    - 25 is the value that was initialized.


    This straightforward example is important since it demonstrates that unless you
    initialize your newly created variable, it will display garbage. Still, even more
    importantly, the only way to get access to the data is via the pointer. If you
    somehow lose the pointer (reassigning it, for example), you will never be able
    to know where the data is or to access it, and this is, as you may recall, as
    we mentioned earlier, a memory leak. You don’t want that in your program.


    Another important thing to know is that once we use the storage, we must deallocate
    it so it will be free, and we can reuse the space. In order to do this, we simply
    use the delete keyword followed by the name of the pointer, like this:


    **delete num_ptr;


    Pointer and const**


    In C++, we can use const (constant) with pointers to achieve several desired results.
    First, we can use the pointer to point to constant values; in this case, we can
    change the pointer’s value at any time. Second, we can use const to create constant
    pointers, which cannot be changed. Let’s see an example:


