  trans: "\n到目前为止，你所编写和学习的所有代码都运行在单线程上，这意味着一旦代码执行，它将一次只运行一行代码。随着程序变得越来越复杂，为了性能考虑，使用线程工作将极有益，同时也能让我们在利用线程时通过代码实现更多的功能。例如，假设我们想使用\
    \ `cin` 从用户处获取输入——在用户输入内容之前，程序将无法执行其他操作。在大多数情况下，我们需要程序并行执行额外的任务。\n\n当然，我们运行的线程数不应超过机器\
    \ CPU 的核心数，因为线程依赖于计算机资源才能平滑运行——我们将在下一节讨论并发时对此进行更详细的说明。\n\n我们可以通过使用 `std::thread`\
    \ 或使用 `<process.h>` 以三种不同的方式来创建线程，我们将在这里进行演示。这些类中已经内置了带有线程函数的线程类：\n\n1. 使用函数指针。\n\
    2. 使用仿函数（functor，即函数对象）。\n3. 使用 lambda 表达式（由于我们还没有介绍 lambda，因此我们在本节中不会讨论这一选项）。\n\
    \n要启动一个线程，我们只需要创建一个新的线程对象，并将要调用的执行代码（即可调用对象）传递给对象的构造函数。一旦对象创建完成，一个执行可调用对象中指定代码的新线程就会启动。在我们定义好可调用对象后，将其传递给线程构造函数。\n\
    \n### 使用函数指针运行线程\n\n假设我们希望程序执行各种 CMD（命令行）命令，例如“dir”或“tree”，并显示结果。\n\n如果我们的程序是同步的，那么在执行命令期间，程序将等待且什么都不做。某些命令的执行时间比其他命令长。如果我们希望程序运行的同时让命令在独立的线程上执行，我们应该使用异步编程。\n\
    \n通过这种方法，我们启动一个命令，然后继续执行程序的其他操作，并定期检查在独立线程上运行的命令的状态。当线程完成工作后，我们显示结果。\n\n我们将用于运行命令的线程将是：`void\
    \ cdecl ThreadFunc( void *)`。首先，我们将看到如何启动线程：`void SetCommand( string command )\
    \ { Command = command ;`\n\n```cpp\nHANDLE hThread = ( HANDLE )_beginthread(ThreadFunc,\
    \ 0, NULL );\n```\n\n我们的 `SetCommand` 函数接收一个要执行的命令（例如“dir”）。然后，它使用 `_beginthread`\
    \ 启动一个线程。\n\n为了简化程序，我们为实际命令字符串定义了一个全局变量，这样就可以从主线程和新线程访问它，如下：\n\n`string Command;`\
    \ 另一个全局变量将是 `BOOL IsRunning = FALSE ;`。`IsRunning` 将告诉我们线程在任何时刻是否正在运行。我们的线程函数看起来像这样：\n\
    \n```cpp\nvoid cdecl ThreadFunc( void *) { CommandResult =““ ; if (DoRun(Command.c_str()))\
    \ { IsRunning = true ; while (IsRunning) { if (CheckCommandExecutionStatus())\
    \ { break ; } Sleep(500); } } IsRunning = false ; _endthreadex(0); }\n```\n\n\
    我们不会解释 `DoRun()` 函数，因为它不属于本书的讨论范围内。基本上，它使用 `ShellExecute` 执行 Windows 命令/程序：\n\n\
    ```cpp\nResult = ( BOOL ) ShellExecute (GetActiveWindow(), \"open\" , \"cmd\"\
    \ , Command, NULL , 0);\n```\n\n你可以通过最初发表在 Codeproject 上的文章了解更多关于 Michael Haephrati\
    \ 编写的 Tiny CMD 程序：\nhttps://www.codeproject.com/Articles/5163375/Tiny-CMD\n\n\
    ### 使用函数对象运行线程\n\n也可以通过使用成员函数通过 `std::thread` 启动线程。为了这样做，我们必须为调用该成员函数的对象添加一个特定的参数。我们必须将成员函数的指针与一个值一起传递，以便我们可以将此指针用于\
    \ `std::thread` 构造函数中的对象。我们还需处理引用。我们通过使用 `std::ref` 来实现。\n\n让我们来看一个简单的代码示例：\n\n\
    ```cpp\n#include \"pch.h\" \n#include <thread> \n#include <iostream> \nclass Say_somthing\
    \ { \n    public : \n    void greeting() const // 我们的公共成员函数 \n        std::cout\
    \ <<“Hello!” << std::endl; // 打印 hello! \n    } \n}; \nint main() { \n    Say_somthing\
    \ i; \n    std:: thread t(& Say_somthing ::greeting, &i); // 作为新线程调用 greeting\
    \ () \n    t.join();\n}\n```\n\n记住你的对象生命周期比线程长是非常非常重要的，否则你的程序将会崩溃。\n\n除了使用 `std::thread`\
    \ 还有其他方法。我们可以使用 `std::async` 创建一个任务并在 `std::future` 中获取返回值。正如你刚刚学到的，在这种情况下，我们也可以通过三种方法执行任务：函数指针、函数对象或\
    \ lambda 函数。事实上，`std::future` 是一个值得探索的非常有趣的类。正如我们刚刚提到的，当我们希望线程返回结果或值时，我们使用 `std::future`。例如，返回文件名或文件大小。我们可以通过两种不同的方式实现此：我们可以使用指针来共享数据——这是一种旧方法，当我们需要返回多一个结果或值时，处理起来可能会很复杂。\n\
    \n实现此更好方法是使用 `std::future` 类。“future”代表未来将返回的数据——例如当线程超出作用域时。这是一个未来的值。当我们说“未来值”时，你可能会想：这怎么可能呢？要么有一个值，要么没有；我们如何能存储一个尚未生成的值呢？\n\
    \n`std::future` 类可以存储未来将赋值的对象值，并使用 `get()` 在稍后访问该值。换句话说，一旦存储了未来数据，它就可以存储并访问。`std::future`\
    \ 与 `std::promise` 密不可分。这是一个模板类，承诺在未来设置值。每个 `std::promise` 对象都与一个 `std::future`\
    \ 对象关联，当 `std::promise` 对象设置值时，该对象将提供该值。`std::future` 对象与其关联的 `std::future` 对象共享数据（注：原文此处有误，应为\
    \ `std::promise` 对象）。\n\n让我们回顾一个代码示例：\n\n```cpp\n#include <iostream> \n#include\
    \ <thread> \n#include <future> \n// 如果值尚未被线程 2 设置\n// get() 调用将阻塞，直到线程 2 设置 promise\
    \ 对象\n// 我们为这种情况设置承诺值\n// 直到未来值被设置\n#define PROMISE_VALUE 35 \nvoid InitThread(std::\
    \ promise < int > * myPromiseObject ) { \n    std::cout <<“InsideThread” << std::endl;\
    \ \n    myPromiseObject ->set_value( PROMISE_VALUE ); \n} \nint main() { \n  \
    \  // 创建 std::promise 对象： \n    std:: promise < int > myPromise; \n    // 创建 std::future\
    \ 对象： \n    std:: future < int > myFuture = myPromise.get_future(); \n    std::\
    \ thread th(InitThread, &myPromise); \n    std::cout <<“Value: “ << myFuture.get()\
    \ << std::endl; \n    th.join(); \n    return 0; \n}\n```\n\n当我们运行这段代码时，我们预期会得到：\n\
    ![](img/image0191.jpeg)\n\n我们还可以创建一个返回多个值的线程。我们只需要使用多个 `std::promise` 和 `std::future`\
    \ 对象即可。\n\n现在你对使用 `std::future` 的线程有了更好的理解，让我们更深入地了解 `std::async()`，因为你可能会发现它你未来的代码中非常有用。\n\
    \n`std::async()` 是一个函数模板，接受回调（意味着函数或函数对象）作为参数，然后可能异步地执行它们。使用异步代码可以有许多用途。例如，它可以用于执行操作系统命令，或者一个异步扫描文件的备份应用程序。它还可以用于查看哪些发生了变化，哪些没有，并备份文件。这些只是为了让你更好地理解我们为什么要使用异步代码的几个例子。\n"
- fmt: "\n`std::async` returns a `std::future<T>` that hold the stored value returned\
    \ by the function object executed by `std::async()`. Arguments expected by a function\
    \ can be passed to `std::async()` as arguments after the function pointer argument.\n\
    \nAs we must control the manner in which our asynchronous behavior will behave,\
    \ the first argument in `std::async` will be the launch policy. C++ allows us\
    \ to three different launch policies:\n\n1. `std::launch::async`\n   This function\
    \ ensures that the passed function will be executed on a separate thread.\n\n\
    2. `std::launch::deferred`\n   This function indicates that the function call\
    \ will be deferred until either `wait()` or `get()` is called on the `future`.\n\
    \n3. `std::launch::async | std::launch::deferred`\n   This function will decide\
    \ whether to run asynchronously or another subject to the system load.\n\nLet’s\
    \ see some code samples: In this code, we run two threads asynchronously: one\
    \ fetches data from a file while the other fetches data from a database:\n\n```cpp\n\
    #include <iostream> \n#include <string> \n#include <chrono> // used for time calculations\
    \ \n#include <thread> // used for multithread actions \n#include <future> // used\
    \ for obtaining a result from a thread // once it has completed its mission. \n\
    #define DATABASE_PREFIX “_db_” \n#define FILE_PREFIX “_f_” \nusing namespace std::chrono;\
    \ \nstd:: string readFromDatabase(std:: string recvdData ) { \n    // We use the\
    \ sleep method. Using this method is good \n    // only if the task will take\
    \ up to 5 seconds \n    std::this_thread::sleep_for( seconds (5));\n    // Connect\
    \ to our database\n    return DATABASE_PREFIX + recvdData ; \n} \n\nstd:: string\
    \ readFromDatafile(std:: string recvdData ) { \n    // We use the sleep method.\
    \ Using this method is good \n    // only if the task will take up to 5 seconds\n\
    \    std::this_thread::sleep_for( seconds (5));\n    // Connect to our file\n\
    \    return FILE_PREFIX + recvdData ; \n} \n\nint main() { \n    // First we use\
    \ the system_clock class to log the current time\n    system_clock :: time_point\
    \ start = system_clock ::now(); \n    std:: future <std:: string > resultFromDB\
    \ = std::async(std:: launch :: async , readFromDatabase, “Data” );\n\n    //Fetch\
    \ Data from File\n    std:: string fileDataItem = readFromDatafile( “Data” );\n\
    \n    //Fetch Data from DB \n    // Waiting until data is available in our future<std::string>\
    \ object.\n    std:: string databaseDataItem = resultFromDB.get();\n\n    // we\
    \ use the system_clock class to log end Time\n    auto end = system_clock ::now();\
    \ \n    auto diff = duration_cast <std::chrono:: seconds > (end - start).count();\n\
    \n    std::cout <<“It took us = “ << diff << “ Seconds to complete.” << std::endl;\n\
    \n    //Combine the 2 data items \n    std:: string data = databaseDataItem +\
    \ “ :: “ + fileDataItem;\n\n    //Printing the combined Data from the 2 data items\
    \ we fetched\n    std::cout << “Data =“ << data << std::endl; \n    return 0;\
    \ \n}\n```\n\nWhen we run this code, our result will be:\n\n![](Images/image00192.jpeg)\n\
    \nNote that if no launch policy is specified, the default value will be similar\
    \ to: `std::launch::async` or `std::launch::deferred`.\n\n## C++ mutex objects\n\
    \nWhen using threading in C++, it is important to become familiar with mutex objects\
