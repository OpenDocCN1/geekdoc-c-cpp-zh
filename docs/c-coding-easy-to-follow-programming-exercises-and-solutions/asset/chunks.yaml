    \ conditions to examine both scenarios and address them:\n\n```cpp\n#include \"\
    pch.h\"\n#include <iostream>\n#include <string>\nint main() {\n    std::string\
    \ age;\n    std::cout <<“Enter your age\\n”;\n    std::cin >> age;\n    int intVal\
    \ = atoi(age.c_str());\n    if (age == “0” ) {\n        std::cout <<“Age 0 doesn’t\
