    using namespace std;


    int main() { int grades[]{ 78, 86, 90, 52 }; int *grades_ptr{ grades }; cout <<
    grades_ptr[0] << endl; cout << grades_ptr[1] << endl; cout << grades_ptr[2] <<
    endl; cout << grades_ptr[3] << endl; }** When we run this code, we will get a
    list of all the elements of the array:


    ![](Images/image00154.jpeg)


    The reason we can access the elements in an array using the pointer is that in
    C++, the value of the name of an array is actually the value of the first element
