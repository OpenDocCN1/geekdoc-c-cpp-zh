    \        std::cout <<“You were born in” << result.c_str() << \"\\n”;\n    }\n\
    }\n```\n\nLet’s see what happens if the user enters “0” as their age:\n\n![](Images/image00132.jpeg)\n\
    \nNow let’s examine the original scenario of entering some text:\n\n![](Images/image00133.jpeg)\n\
    \nGive It A Try! Create a program that asks the user for their birth year and\
