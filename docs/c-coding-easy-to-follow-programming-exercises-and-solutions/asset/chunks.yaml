    We showed you how we can use single-dimensional arrays in a simple manner, but
    we can actually create multidimensional arrays in C++. Note: C++ allows us to
    use multiple dimensions in an array, not only two dimensions—jwhich can make our
    program really powerful.


    The syntax for declaring multidimensional arrays is pretty simple: `Data type
    Array_Name [dimension 1] [dimension 2]`


    It will look like this:


    ```cpp

    int m[100][200];

    ```


    or:


    ```cpp

    int n[25][34][45];

    ```


    and so on.


    For example, let’s say we want an array that displays the tests scores of all
    students in school across all grades from 1st to 5 th grade over the past 5 tests.
    We need an array for the grade and the scores (i.e., 1st grade students and their
    scores in the 1st test, 2nd grade students and their scores, etc.):


    ```cpp

    int school_grades [grade] [scores]

    ```


    This way, we can access the name of the grade (i.e., 1st grade, 2nd grade, etc.)
    and the test score per grade.


    ![](Images/image00134.jpeg)If we try to find the score of 3rd grade students in
    the second test, it will look like this:


    ```cpp

    int school_grade[2][1]; // 2nd element in index and 1st element // the result
    will be 84

    ```


    To initialize a multidimensional array, we would use a similar method for initialization
    as we used with variables. Let’s look at the school_grade example this time with
    3 tests scores per 5 school grades:


    ```cpp

    School_grade[3][5] // number of elements in each dimension is 3 // tests and 5
    grades

    { // using curly braces while each dimension has its own curly // braces followed
    by a colon {70, 90, 100, 95, 76}, {89, 60, 84, 100, 86}, {73, 85, 79, 79, 70}
    // last element does not have the colon }; // don’t forget the semicolon at the
    end

    ```


    Note that you don’t need to use multiple lines, but it is best practice to use
    separate lines per index dimension.


    ### **Vectors—the dynamic arrays**


    We said at the beginning of this section that arrays are a fixed range or collection
    of elements that are structured together and cannot be altered in size. This means
    that we have a huge restriction in our code, preventing us from dynamically growing
    our data. This is a major cause for crashes, especially if you don’t know the
    final or actual size of your stored data. Sure, you can always pick an array size
    much larger than your actual needs, but this isn’t always the best option. This
    is why, in C++, we use Vectors.


    Vectors are dynamic arrays that can expand “elastically” with your program. Vectors
    are a part of an object-oriented template class in C++, which you will need to
    add to your code with the familiar `#include` statement:


    ```cpp

    #include <vector>

    ``` When using vectors in our code, we use the following syntax using angle brackets
    `< >`:


    ```cpp

    vector <int> voters_age; vector <char> first_letter;

    ``` Vectors Vectors not only grow dynamically, but they can also shrink in size
    dynamically, making them extremely powerful in resource management.


    Remember —just like with arrays, elements in a vector must be of the same type,
    and you can also access each individually, using the same index rules as in arrays.


    #### **How to initialize a vector**

    You can initialize elements in a vector when it is defined. You do this by adding
    the elements right after the definition.


    ```cpp

    vector < int > x{ 20,10,20,30,20,10 };

    ```


    Doing so not only assigns the values to the vector, it also allocates the necessary
    memory space for the 6 elements. After doing so, you can set any of these 6 elements
    to a different value:


    ```cpp

    x.at[0] = 3;

    ```


    However, if you don’t initialize the vector, or set its initialize size, the line
    above will lead to a runtime error, as the compiler will not allow you to set
    a value to an address that isn’t allocated.


    You can set the vector size in several ways: Set an initial size during declaration,


    ```cpp

    vector < int > x(6);

    ```


    or you can dynamically add more size during the flow of your program, as we will
    explain later.


    #### **How to access vector elements**


    We learned that in order to access array elements, we simply need to point out
    the index position. Accessing vector elements is also pretty simple. To access
    the element, we would need to call the vector by name and use the dot operator
    like in the example below:


    ```cpp

    Vector_name.at(element_index)

    ```


    Let’s say we have a vector that holds a list of grades named `grade_list`. How
    do we access the 4th and 6th grade? Here is how:

    ```cpp

    Grade_list.at(3) // 4th element will be #3 in index

    Grade_list.at(5) // 6th element will be #5 in index

    ```


    If you want to assign something to the vector, we simply use the assignment operator
    with the dot operator:


    ```cpp

    Grade_list.at(5) = 70; // we assigned 70 to the element at index 5 (which is the
    6th element)

    ```


    You can also use:


    ```cpp

    Grade_list(5) = 70; // we assigned 70 to the element at index 5 (which is the
    6th element)

    ```


    #### **Vector’s push_back method**


    We explained that unlike arrays, a vector could change in size dynamically, but
    how exactly do they do that? In order to change the size of a vector, we simply
    need to use the `push_back` method, which basically adds a new element to the
    end of the vector. Let’s see how this works:


    Let’s say we have a vector `grade_list`, which contains 50 grades. We want to
    add two more grades—the grade 78 and grade 66, so we use:


    ```cpp

    Grade_list.push_back(78); // adding the grade 78 to the back of the list

    Grade_list.push_back(66); // adding the grade 66 to the back of the list

    ```


    Now we have two new elements to our vector, and space will be allocated automatically.
    As simple as that! You only need to remember, again, that elements MUST be the
    same type.


    We will get back to arrays and vectors later on and show you some additional examples
    involving loops and functions.


    **Give It A Try!** Create a program that asks the user their favorite six lottery
    numbers. Don’t forget to tell the user to press space after each number and press
    ‘Enter’ when finished. Store those numbers in an array and display them one by
    one.


    # **Chapter 9: Loops**


    Loops, also known as iterations or repetitions, are a significant part of any
    program and a building block in any program, especially in C++. Loops, as you
    can understand from the name, are methods of executing your code several times
    by a given order, under different conditions using a statement or several statements
    for repeating. This allows you to conduct more complex program operations, solve
    problems, and create a powerful program. Loops are a great and powerful way to
    control your program flow. Let’s have a closer look at loops and learn how and
    when to use them.


    In order to use loops, we first need to set a condition, just as we did earlier
    with the `if` statement. Once we reach the condition, a statement or statements
    will move into action. Looping can take place at specified amount of times, or
    as long as we have elements in a vector, when we have a true/false condition,
    or it can loop forever—which rarely happens.


    **Did you know? Operation systems, such as Windows, loop forever, allowing the
    continued operation of the OS.**


    In C++, there are four types of loops commonly used:


    - **While Loops**


    *While loops perform an action while a condition is true and stop when the condition
    is false*. This condition must be true before the loop begins.


    - **Do – while loops**


    *Do-while loops perform an action while a condition is true and stop when the
    condition is false*. The condition must be true after the loop ends.


    - **For loops**


    *For loops iterate a specified amount of times*.


    - **Nested loops** This means looping within a current loop. We will also discuss
    infinite loops, when, and how they are used.


    Let’s have a closer look at each loop type and learn how to use loops in our code.


    ## **9.1 - While loop**


    As we explained earlier, loops are always based on some sort of conditions. The
    while loop checks if the condition is true BEFORE it starts. If the loop began
    and the condition becomes false, the loop will be terminated.

