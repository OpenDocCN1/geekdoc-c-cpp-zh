    我们已经向你展示了如何简单地使用一维数组，但实际上，我们可以在 C++ 中创建多维数组。注意：C++ 允许我们在数组中使用多个维度，而不仅仅是两个维度——这可以使我们的程序变得非常强大。


    声明多维数组的语法非常简单：`数据类型 数组名 [维度 1] [维度 2]`


    它看起来像这样：


    ```cpp

    int m[100][200];

    ```


    或者：


    ```cpp

    int n[25][34][45];

    ```


    以此此类推。


    例如，假设我们想要一个数组来显示学校从 1 年级到 5 年级所有学生在过去 5 次考试中的成绩。我们需要一个用于年级和分数的数组（即：1 年级学生及其在第
    1 次考试中的成绩，2 年级学生及其成绩，等）：


    ```cpp

    int school_grades [grade] [scores]

    ```


    通过这种方式，我们可以访问年级的名称（例如 1 年级、2 年级等）以及每个年级的考试成绩。


    ![](img/image00134.jpeg)如果我们尝试查找第 3 年级学生在第二次考试中的分数，它看起来像这样：


    ```cpp

    int school_grade[2][1]; // 索引第 2 个元素和第 1 个元素 // 结果将是 84

    ```


    要初始化多维数组，我们将使用与变量类似的初始化方法。这次让我们来看 school_grade 的示例，每个 5 个年级有 3 次考试成绩：


    ```cpp

    School_grade[3][5] // 每个维度的元素数量为 3 // 测试和 5 个年级

    { // 使用大括号，每个维度都有自己的大括号，后面跟着冒号 {70, 90, 100, 95, 76}, {89, 60, 84, 100, 86}, {73,
    85, 79, 79, 70} // 最后一个元素没有冒号 }; // 不要忘记末尾的分号

    ```


    注意，你不需要使用多行，但最佳实践是为每个索引维度使用单独行。


    ### **Vectors——动态数组**


    我们在本节开始时提到，数组是固定范围或元素集合，它们结构在一起且不能更改大小。这意味着我们在代码中有一个巨大的限制，阻止了我们动态地增长数据。这是导致崩溃的一个主要原因，特别是当你不知道存储数据的最终或实际大小时。当然，你总是可以选择一个远大于你实际需求的数组大小，但这并不总是最佳选择。这就是为什么在
    C++ 中，我们使用 Vectors。


    Vectors 是可以随着你的程序“弹性”扩展的动态数组。Vectors 是 C++ 中面向对象的模板类的一部分，你需要使用熟悉的 `#include` 语句将其添加到代码中：


    ```cpp

    #include <vector>

    ``` 在我们的代码中使用 vectors 时，我们使用带有角括号 `< >` 的语法：


    ```cpp

    vector <int> voters_age; vector <char> first_letter;

    ``` Vectors 不仅可以动态增长，还可以动态缩小尺寸，这使得它们在资源管理方面极其强大。


    记住——就像数组一样，vector 中的元素必须是相同类型，你也可以使用与数组相同的索引规则单独访问每个元素。


    #### **如何初始化 vector**

    你可以在定义 vector 时初始化其内部元素。你通过在定义后直接添加元素来实现这一点。


    ```cpp

    vector < int > x{ 20,10,20,30,20,10 };

    ```


    这样做不仅将值分配给 vector，还为这 6 个元素分配了必要的内存空间。之后，你可以将这 6 个元素中的任何一个设置为不同的值：


    ```cpp

    x.at[0] = 3;

    ```


    然而，如果你没有初始化 vector 或设置它的初始化大小，上面的行将导致运行时错误，因为编译器不允许你向未分配的地址设置值。


    你可以通过几种方法设置 vector 大：在声明期间设置初始大小，


    ```cpp

    vector < int > x(6);

    ```


    或者你可以在程序运行期间动态增加大小，我们稍后会解释。


    #### **如何访问 vector 元素**


    我们学过，为了访问数组元素，我们只需要指定索引位置。访问 vector 元素也很简单。要访问元素，我们需要通过名称调用 vector，并像下面的示例中那样使用点运算符：


    ```cpp

    Vector_name.at(element_index)

    ```


    假设我们有一个存储年级列表的 vector `grade_list`。我们如何访问第 4 年级和第 6 年级？方法如下：

    ```cpp

    Grade_list.at(3) // 第 4 个元素将索引为 #3

    Grade_list.at(5) // 第 6 个元素将索引为 #5

    ```


    如果你想给 vector 赋值，我们只需要使用赋值运算符并配合点运算符即可：


    ```cpp

    Grade_list.at(5) = 70; // 我们将 70 分配给索引 5 的元素（即第 6 个元素）

    ```


    你也可以使用：


    ```cpp

    Grade_list(5) = 70; // 我们将 70 分配给索引 5 的元素（即第 6 个元素）

    ```


    #### **Vector 的 push_back 方法**


    我们解释过，与数组不同，vector 的大小可以动态变化，但它们具体是如何做到的呢？为了更改 vector 的大小，我们只需要使用 `push_back`
    方法，它基本上是向 vector 的末尾添加新元素。让我们看看它是如何工作的：


    假设我们有一个包含 50 个年级的 vector `grade_list`。我们想再添加两个年级——78 年级和 66 年级，所以我们使用：


    ```cpp

    Grade_list.push_back(78); // 在列表末尾添加 78 年级

    Grade_list.push_back(66); // 在列表末尾添加 66 年级

    ```


    现在我们的 vector 有了两个新元素，空间将自动分配。就这么简单！你只需要记住，vector 中的元素必须类型相同。


    **尝试一下！** 创建一个程序询问用户他们喜欢的六个彩票号码。不要忘记在每个数字后按空格，完成后按“回车”。将这些数字存储在数组中逐个显示。


    # **第 9 章：循环**


    循环（称为迭代或重复）是任何程序的重要组成部分，也是 C++ 的构建模块。循环通过给定的顺序在不同条件下多次执行代码，这允许你进行更复杂的程序操作并解决问题。循环是控制程序设计的强大方法。让我们仔细查看循环，并学习何时以及使用它们。


    为了使用循环，我们首先需要设置条件，就像我们之前使用 `if` 语句一样。一旦达到条件，语句或多个语句就会开始执行。循环可以在指定的次数内进行，也可以只要我们在
    vector 中有元素就进行，或者当有真/假条件时，或者它可以无限循环——这很少发生。


    **你知道吗？操作系统（例如 Windows）会无限循环，允许操作系统持续运行。**


    在 C++ 中，常用的循环有四种：


    - **While 循环** *While 在条件为真时执行操作，在条件为假时停止*。此条件在循环开始之前必须为真。


    - **Do – while 循环** *Do-while 在在条件为真时执行操作，在条件为假时停止*。条件在循环结束后必须为真。


    - **For 循环** *For 循环按指定的次数迭代*。


    - **嵌套循环** 这意味着在当前循环内部进行循环。我们还将讨论无限循环、何时以及如何使用。


    让我们仔细查看每种循环类型，并学习如何在代码中使用循环。


    ## **9.1 - While loop**


    正如我们之前解释过的，循环总是基于某种条件。while 循环在开始之前检查条件是否为真。如果循环开始且条件变为假，循环将终止。

