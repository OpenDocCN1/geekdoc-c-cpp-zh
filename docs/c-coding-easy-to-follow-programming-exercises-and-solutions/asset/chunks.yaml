    \ the ‘tax’ parameter so it is used and not the default\n```\n\n## 函数重载\n\n在 C++\
    \ 中使用函数时，我们有时会看到不同的参数列表具有相同的函数名。例如，我们可以有一个向数据库保存信息的函数或打印某些内容的函数，但它也可以被用于保存或打印整数、字符串、日期等。这是一个非常有价值的特性，因为它简化了你的代码，并节省了编写多个功能相同代码的大量时间。与其使用许多名称不同的函数（鉴于它们名称都不同），我们只需要为所有情况使用同一种函数——这被称为**函数重载**（Function\
    \ Overloading）。这是多态领域的内容——它意味着调用同一个名称来处理多种数据类型的数据。多态本身是一门学科，我们建议你在读完这本书后进一步学习它，因为它是\
    \ C++ 的重要部分。\n\n让我们复习一个函数重载的例子。在这个例子中，我们有可以每次打印不同类型数据的函数：\n\n函数原型和在 main 函数中的调用看起来如下：\n\
    \n```cpp\n// function prototype\nvoid print( int , int ); // print int\nvoid print(\
    \ char , char ); // print char\n\n//function call\nint main() { \n    print (2,\
    \ 3); // 两个 print 的函数调用看起来一样\n    print (‘a’ , ‘b’ ); \n}\n\n// function definition\n\
    void print( int a , int b ) { \n    cout << a << b << endl; \n}\nvoid print( char\
    \ a , char b ) { \n    cout << a << b << endl; \n}\n```\n\n如你所见，这非常简单可以让你的生活变得更容易。请注意，为了让函数重载无错误运行，你必须知道编译器在决定调用哪个函数时**不考虑返回值**。假设你写了：\n\
    \n`int add_numbers(); // 添加两个或多个整数\n`double add_numbers(); // 添加两个或多个浮点数`\n\n\
    当调用函数 `add_numbers` 时，编译器将不知道调用哪个函数，因为它不考虑返回值，并会报错。`引用传递函数`\n\n在上一节中，我们讨论了函数如何通过值传递，这意味着它们使用参数的副本，如果更改了副本的值，则不会改变参数。我们将其称为实际参数和形式参数。引用传递函数的作用恰恰相反——我们在使用函数时使用参数的位置来改变它。为了实现这一点，我们必须使用参数在内存中的实际地址。\n\
    \n我们如何知道参数的内存位置？非常简单：C++ 在参数前放置 `&` 符号以找到位置。所以，如果我们有一个命名为 `num` 的整数，那么 `num` 的位置就是\
    \ `&num`。就这么简单！\n\n让我们看一个这样做的例子。在这个非常简单的例子中，我们想要为价格提供折扣。商店里所有单价为 70 美元的物品都将改为\
    \ 60 美元。这是我们在代码中使用的逻辑（这里没有 cin 和 cout，只有逻辑）：\n\n```cpp\n// function prototype\n\
    void discount( int & num ); // &num 指向 num 的位置\n\n//function call\nint main()\
    \ { \n    int number {70}; \n    discount (number);\n    cout << number << endl;\
    \ \n    return 0; \n}\n\n// function definition\nvoid discount ( int & num ) {\
    \ \n    if ( num > 60) num = 60; // 将 num 的实际值从 70 改为 60\n}\n```\n\n如果你运行代码，你会发现初始化为\
    \ 70 的 `num` 现在变成了 60，这意味着我们更改了实际参数，而不仅仅是使用了它的副本。再次，这非常简单，并且节省我们在复制参数时可能需要的大内存。选择按值传递还是引用传递取决于任务和需求，因为每种方法都有你需要考虑的优缺点。\n\
    \n## 调用函数——推入与弹出\n\n在 C++ 中调用函数的工作方式是“推入（Push）”和“弹出（Pop）”方法。这意味着什么？嗯，假设你的衣子里有一堆\
    \ T 恤，它们都折叠并叠在一起。你会取最上面的那件 T 恤，或者移动它来取下面的，或者多移动几件来获取底部的。这基本上就是 C++ 中函数调用的工作方式。这被称为\
    \ LIFO——后进先出。在顶部放置一个项目被称为“推入”，移除它被称为“弹出”。这很合逻辑，对吧？\n\n当函数被调用时，栈（内存）上会创建一个函数的激活记录（activation\
    \ record）。栈的大小可以是无限的，或者如果不考虑机器资源，或者当你同时运行太多函数时过度操作，可能会导致崩溃。这被称为“栈溢出（Stack Overflow）”——也就是崩溃。当函数执行完毕，该记录会从栈中“弹出”。通常，这整个过程发生得非常高效且难以察觉，但有时它会产生一些不需要的开销。为了克服这一点，C++\
    \ 允许我们将函数内联（inline）编译。\n\n内联代码为我们了函数调用的开销，因为它直接内联生成快速的汇编代码。只需记住，过度使用内联会使你的代码膨肿，因为它在许多地方复制了代码，这将导致适得其反的结果。听起来很困惑吗？嗯，大多数现代编译器足够先进，可以在不需要你帮助的情况下知道何时使用内联，但这仍然是一个重要的学习点。内联函数通常在\
    \ .h 文件中声明，因为它需要对尽可能多的源可见。\n\n让我们看看在使用最后一个例子之一时，内联函数看起来是样子的：\n\n```cpp\n// function\
    \ prototype\nvoid print( int , int );\nvoid print( char , char );\n\n//function\
    \ call\nint main() { \n    print (2, 3); \n    print (‘a’ , ‘b’ ); \n    return\
    \ 0; \n}\n\n// function definition\ninline void print( int a , int b ) // 在函数\
    \ // 定义中使用 inline\n{ cout << a << b << endl; }\ninline void print( char a , char\
    \ b ) // 在函数 // 定义中使用 inline\n{ cout << a << b << endl; }\n```\n\n让我们复习一下目前学到的所有内容，并编写包含循环和\
    \ switch 语句的代码。在这段代码中，我们要求用户输入 1 到 4 之间的数字，然后用单词显示该数字。如果用户输入 0，程序将终止。如果用户输入其他数字，将显示以下消息：“我不知道这个数字，请重试。”\n\
