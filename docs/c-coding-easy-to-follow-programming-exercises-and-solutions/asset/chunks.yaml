    ## **16.2 - Friends of a class**


    You saw across this section that we defined parts of our class as private and
    public. In C++, we can manage the access functions of other classes from our class
    and class members. One of the methods for doing so is by defining friends of a
    class. Friends of a class can be very powerful and can relate to a function or
    another class that will have access to private class members, even if the function
    of the class are not members of the class itself. But remember, friends must be
    declared clearly and explicitly in the class, which grants access within the function
    prototype with the keyword friend.


    It is alSo important to remember that when talking about friends of a class, unlike
    friends in real life, it does not work both ways: granting access to a function
    or method from another class does not grant access the other way around. So, if
    X is a friend of Y, Y is not a friend of X.


    Also, if X is a friend of Y, and Y is a friend of Z, Z is not a friend of X. In
    other words, they are not commutative in nature.


    Let’s see what the syntax for declaring a friend of a class will look like when
    we declare a non-member friend for our library class Lib_Book:


    **class Lib_Book


    {


    public:


    friend void get_book_num (Lib_Book &p);


    friend string get_book_name(Lib_Book &p);


    private:


    std::string book_name;


    int serial_num;


    //statements };**


    In this example, the friend function has access to everything in the Lib_Book
    class. Now we can access the private attributes of our class without going through
    public getters to display the private information. We can run the function simply
    as follows. Note that the function returns the contents of a private member named
    serial_num which we can’t access directly:


    **int get_book_num(Lib_Book &p) { return p.serial_num; }**


    In this function, we also access a private member named book_name, and again we
    can’t access it directly, as it is private, which is why we need to use this function,
    which is also a getter:


    **string get_book_name(Lib_Book &p) { return p.book_name; }**


    Aside from accessing private attributes, we can also modify them, as the objects
    are passed by reference, so we can change them as long as they are not const.
    We can also declare a method in another class as a friend:


    class Lib_Book { private: friend void Other_Class:: get_book_num ( Lib_Book &p);
    std::string book_name; int serial_num; public:


    //statements };


    In this example, we display the get_book_num method as a friend, and it will have
    access to anything in the Lib_Book class.


    Now let ’s see how to implement the method in our Other_Class: class Other_Class
    **{ // Statement/s public:**


    **int get_book_num ( Lib_Book &p); { return p.serial_num; } };**


    Friends of a class can also be declared for an entire class. We can declare the
    entire class Other_Class as a friend of the Lib_Books class, so that all the methods
    and functions that we will use in the Other_Class will have access to the Lib_Book
    attributes:


    **class Lib_Book { friend class Other_Class; std::string book_name; int serial_num;
    public: //statements };**


    It is best practice to use friends only when necessary and when it suits the design
    of your program. However, when using friends, we can add a lot of power and great
    performance to your program. In many cases, it can be better than using getters
    and setters.


