    \ 值而不是 `R` 值：\n\n```cpp\ncalc_num(30);\n```\n\n让我们看看如何在给定的类利用移动语义。为了演示这一点，我们创建了一个带有指针属性的类并添加了一些方法——我们将使用如下所示的拷贝构造函数：\n\
    \n```cpp\nclass Wallet {\nprivate:\n    int *sum; //这是我们的原始指针\npublic:\n    void\
    \ set_sum_value(int x); //*sum = x\n    int get_sum_value(); //返回 *sum\n    Wallet(int\
    \ x); //构造函数\n    Wallet(const Wallet &source); //拷贝构造函数\n    ~Wallet; //析构函数\n\
    };\n```\n\n这是我们预期的拷贝构造函数代码。有不同类型的拷贝构造函数，在我们的情况下，我们使用了深拷贝方法的拷贝构造函数：\n\n```cpp\n\
    Wallet::Wallet(const Wallet &source)\n{\n    sum = new int;\n    *sum = *source.sum;\n\
    }\n```\n\n现在让我们看看如果我们想在 `main` 函数中可以做什么，比如，创建一个 vector 对象并使用我们的拷贝构造函数将临时数据拷贝到该对象：\n\
    \n```cpp\nmain() {\n    vector <Wallet> vec;\n    vec.push_back(Wallet {20});\n\
