    \ `price` 的值是多少。这在执行执行时会导致很多问题。\n\n让我们尝试看看如果不初始化变量会发生什么。让我们写一段简单的代码。在代码中，我们将声明一个类型为\
    \ `int` 的变量并将其命名为 `price`，因为它应该代表某个物品的价格。我们不会初始化它。\n\n```cpp\n#include <iostream>\n\
