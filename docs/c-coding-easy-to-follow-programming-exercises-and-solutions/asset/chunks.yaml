    \n"
- fmt: "\nUsually, stack is used when you need a speedy program, as storing and pulling\
    \ values from the stack is very fast, even with very old CPUs. Yet the free volume\
    \ of the stack is limited, so large objects or if you need to expand memory will\
    \ simply not work with the stack. Another problem is when trying to pull data\
    \ from the stack. Let’s go back to the book analogy: when you try to pull a book\
    \ from the middle of a book pile, you need to lift the books on top first; otherwise,\
    \ the pile will collapse. The same applies to the stack—in order to obtain a value\
    \ stored somewhere in the middle of the stack, the computer needs to go through\
    \ everything on top first and dig its way in. How do we solve this problem? We\
    \ simply use heap memory.\n\n# Heap heap hurray!\n\nThe heap is a pull of memory\
    \ that can be allocated dynamically, and it works well with pointers, as we will\
    \ shortly demonstrate. The way data is allocated and arranged in the heap is different\
    \ from the way it is done on the stack, and basically, it is piled up randomly.\
    \ There are several key rules to remember when working with the heap, and we will\
    \ go over them later on. You should remember to deallocate it from the heap once\
    \ we are done using the stored value, otherwise, you will get what is called“memory\
    \ leak.” The heap does not have any restriction on the variable size, except for\
    \ the obvious physical memory size on the machine. Also, unlike the stack, which\
    \ operates really fast, the heap works a bit slower when reading and writing to\
    \ and from memory.\n\nThis is how our variables will appear on the heap:\n\n#\
    \ Void my_stack_program\n\n![](Images/image00147.jpeg)If you want to learn more\
    \ about the stack and the heap, go to: https://www.learncpp.com/cpp-tutorial/79-the-stack-and-the-heap/\n\
    \n## Declaring pointer variables\n\nThe syntax for declaring pointer variables\
    \ is similar to the way we declare variables, except that we need to add the asterisk\
    \ `*` at the beginning of the variable name:\n\n`variable_type *pointer_name`\n\
    \nThis is how some pointers might look:\n\n- `int *sum;`\n- `char *first_letter;`\n\
    - `string *user_name;`\n- `double *temp;`\n\nIt’s important to remember that the\
    \ asterisk sign is not used in any way as a mathematical operator in this case.\n\
    \n## Initializing pointers\n\nInitializing pointers work in the same logic as\
    \ variable initialization does. However, we want to make sure that our pointer\
    \ will not point anywhere, but to a specific memory address, or to no address\
    \ at all. We can also initialize a pointer to point to a variable or a function.\
    \ This is not as confusing as it may sound. First, in your code, you MUST initialize\
    \ all pointers before they are used, or else, the pointer will point to some rubbish\
    \ address anywhere, and that is not what we want. Let’s look first at the syntax\
    \ we need to use when initializing a pointer to point to an address:\n\n`variable_type\
    \ *pointer_name (nullptr)`\n\nWe use `nullptr`, and it is as if we pointed the\
    \ pointer to address zero, meaning that our pointer will point nowhere. If your\
    \ pointer is not pointing to a variable or a function, always use the `nullptr`\
    \ when initializing it.\n\nWe will look into initializing pointers when pointing\
    \ to variables and functions later on.\n\n## Accessing pointer's address\n\nWhen\
    \ we want to access the address a pointer is pointing to, we use the address operator\
    \ `&` which is a unary operator (if you don’t remember what unary operators are,\
    \ you should refer back to the operator chapter).\n\nLet ’s review an example\
    \ using a simple variable: `int *age`\n\n```cpp\n//int age is initialized to 50\n\
    int age {50}; //we can check the size of age using the sizeofoperator\n\n//(the\
    \ size will be 4)\ncout <<“Size of the int age is“ << sizeof (age) << endl;\n\
    //we can check the value of age (which is 50)\ncout <<“The value of age is“ <<\
    \ age << endl;\n//we can check the address of age by using the address operator\n\
    cout <<“The address of age is “ << &age << endl;\n```\n\nLet’s see what occurs\
    \ when we run this code using a pointer variable:\n\n```cpp\n#include \"pch.h\"\
    \n#include <iostream>\nusing namespace std;\nint main() {\n    //initializing\
    \ age to a nullptr (so it will point no where)\n    int *age{ nullptr };\n   \
    \ //we can check the size of age using the sizeof operator (the size will be 4)\n\
    \    cout <<“Size of the age is“ << sizeof( age) << endl;\n    //we can check\
    \ the value of age\n    cout <<“The value of age is“ << age << endl;\n    // we\
    \ can check the address of age by using the address operator\n    cout <<“The\
    \ address of the pointer is“ << &age << endl;\n}\n```\n\nWhen we run this code,\
    \ we should expect this: ![](Images/image00148.jpeg)\n\nIt is important to remember\
    \ that the size of a pointer is different from the size of the variable it points\
    \ to. It means that if the pointer variable `int *age` points to a variable type\
    \ `long long`, the size of `age` will be 4 bytes, even though the size of any\
    \ `long long` variable is 8 bytes.\n\n## Accessing pointed data\n\nIf we want\
    \ to access data to which the pointers are point to, it is called dereferencing\
    \ a pointer, and basically, it follows where the pointer points and accesses the\
    \ data. In order to do that, we use the asterisk operator `*`. Yes— the asterisk.\
    \ You probably think this doesn’t make sense, as we used the asterisk when we\
    \ wanted to declare pointers, and you are right. This is a choice highly criticized\
    \ by C++ users, as it can be confusing to use the same operator for two different\
    \ purposes. However, once we go over some examples, you will get a better sense\
    \ and will probably find this less confusing.\n\nLet ’s see an example:\n\n```cpp\n\
    //declaring and initializing a char named letter\nchar letter {'a'};\n\n//we declare\
    \ and initialize a pointer named letter_ptr and initialize it to point to the\
    \ address of letter\nchar *letter_ptr {&letter};\n\n//now we deference letter_ptr;\n\
    cout << *letter_ptr << endl;\n```\n\nWhen we run this code, this is what we get:\
    \ ![](Images/image00149.jpeg)\n\nSo, you see that we followed the pointer using\
    \ the dereferencing operator, and this leads us to the data which the pointer\
    \ was pointing to, in this case, the letter a.\n\nWhat will happen if we change\
    \ the value of the pointer?\n\nLet’s add this line to our code:\n\n```cpp\nletter_ptr\
    \ = 'b';\ncout << *letter_ptr << endl;\ncout << letter << endl;\n```\n\nThis is\
    \ what we get:![](Images/image00150.jpeg)\n\nWhat happened here? We changed the\
    \ value of letter via the pointer. In order to understand this, you will need\
    \ to learn about L values and R values in C++.\n\nL value (`lvalue`) are values\
    \ that hold a specific location in memory which you can access with a pointer,\
    \ for example:\n\n```cpp\nint num {100}; //num is an L value \nstring name {Alex};\
    \ //name is an L value\n```\n\nHow do you know if a value can be accessed? Simple,\
    \ if you can place it on the left side of an assignment statement:\n\n```cpp\n\
    num = 200; name = Donald;\n```\n\nNote that the number 200 and the name Donald\
    \ are NOT an L value, they are literals, and they cannot be assigned on the left-hand\
    \ side of an assignment statement:\n\n```cpp\n200 = num; //this is not a valid\
    \ statement!\n\"Donald\" = name; //this is not a valid statement!\n```\n\nIn fact,\
    \ these values are R values. R values, as you may guess, are the opposite of L\
    \ values, as they are not addressable, and not assignable, as we have seen from\
    \ the last statements. R values will be found on the right-hand side of an assignment\
    \ statement, and they will always be literals. In general, you can say that anything\
    \ that is not an L value is an R value.\n\nIt is important to get to know L values,\
    \ R values, and also understand the difference between them. We will get back\
    \ to these terms later on. Let’s go back to pointers and have a look at another\
    \ example of dereferencing them:\n"
  raw: 'Usually, stack is used when you need a speedy program, as storing and pulling
    values from the stack is very fast, even with very old CPUs. Yet the free volume
    of the stack is limited, so large objects or if you need to expand memory will
    simply not work with the stack. Another problem is when trying to pull data from
    the stack. Let’s go back to the book analogy: when you try to pull a book from
    the middle of a book pile, you need to lift the books on top first; otherwise,
    the pile will collapse. The same applies to the stack—in order to obtain a value
    stored somewhere in the middle of the stack, the computer needs to go through
    everything on top first and dig its way in. How do we solve this problem? We simply
    use heap memory.


    **Heap heap hurray!**


    The heap is a pull of memory that can be allocated dynamically, and it works well
    with pointers, as we will shortly demonstrate. The way data is allocated and arranged
    in the heap is different from the way it is done on the stack, and basically,
    it is piled up randomly. There are several key rules to remember when working
    with the heap, and we will go over them later on. You should remember to deallocate
    it from the heap once we are done using the stored value, otherwise, you will
    get what is called“memory leak.” The heap does not have any restriction on the
    variable size, except for the obvious physical memory size on the machine. Also,
    unlike the stack, which operates really fast, the heap works a bit slower when
    reading and writing to and from memory.


    This is how our variables will appear on the heap:


    **Void my_stack_program**


    ![](Images/image00147.jpeg)If you want to learn more about the stack and the heap,
    go to: https://www.learncpp.com/cpp-tutorial/79-the-stack-and-the-heap/ **Declaring
    pointer variables**


    The syntax for declaring pointer variables is similar to the way we declare variables,
    except that we need to add the asterisk * at the beginning of the variable name:


    **variable_type *pointer_name**


    This is how some pointers might look:


    - **int *sum;**


    - **char *first_letter;**


    - **string *user_name;**


    - **double *temp;**


    It’s important to remember that the asterisk sign is not used in any way as a
    mathematical operator in this case.


    **Initializing pointers**


    Initializing pointers work in the same logic as variable initialization does.
    However, we want to make sure that our pointer will not point anywhere, but to
    a specific memory address, or to no address at all. We can also initialize a pointer
    to point to a variable or a function. This is not as confusing as it may sound.
    First, in your code, you MUST initialize all pointers before they are used, or
    else, the pointer will point to some rubbish address anywhere, and that is not
    what we want. Let’s look first at the syntax we need to use when initializing
    a pointer to point to an address:


    **variable_type *pointer_name (nullptr)**


    We use nullptr, and it is as if we pointed the pointer to address zero, meaning
    that our pointer will point nowhere. If your pointer is not pointing to a variable
    or a function, always use the nullptr when initializing it.


    We will look into initializing pointers when pointing to variables and functions
    later on.


    **Accessing pointer''s address**


    When we want to access the address a pointer is pointing to, we use the address
    operator & which is a unary operator (if you don’t remember what unary operators
    are, you should refer back to the operator chapter).


    Let ’s review an example using a simple variable: int *age **//int age is initialized
    to 50 int age {50}; //we can check the size of age using the sizeofoperator**


    **//(the size will be 4)


    cout <<“Size of the int age is“ << sizeof (age) << endl;


    //we can check the value of age (which is 50) cout <<“The value of age is“ <<
    age << endl;**


    **//we can check the address of age by using the address //operator cout <<“The
    address of age is “ << &age << endl;** Let’s see what occurs when we run this
    code using a pointer variable: **#include "pch.h" #include <iostream> using namespace
    std; int main() { //initializing age to a nullptr (so it will point no where)
    int *age{ nullptr }; //we can check the size of age using the sizeof operator
    (the size will be 4) cout <<“Size of the age is“ << sizeof( age) << endl; //we
    can check the value of age cout <<“The value of age is“ << age << endl; // we
    can check the address of age by using the address //operator cout <<“The address
    of the pointer is“ << &age << endl;**


    **}** When we run this code, we should expect this: ![](Images/image00148.jpeg)


    It is important to remember that the size of a pointer is different from the size
    of the variable it points to. It means that if the pointer variable int *age points
    to a variable type long long, the size of age will be 4 bytes, even though the
    size of any long long variable is 8 bytes.


    **Accessing pointed data**


    If we want to access data to which the pointers are point to, it is called dereferencing
    a pointer, and basically, it follows where the pointer points and accesses the
    data. In order to do that, we use the asterisk operator. Yes— the asterisk. You
    probably think this doesn’t make sense, as we used the asterisk when we wanted
    to declare pointers, and you are right. This is a choice highly criticized by
    C++ users, as it can be confusing to use the same operator for two different purposes.
    However, once we go over some examples, you will get a better sense and will probably
    find this less confusing.


    Let ’s see an example:


    **//declaring and initializing a char named letter


    char letter {''a''};**


    **//we declare and initialize a pointer named letter_ptr and initialize it to
    point to the address of letter**


    char *letter_ptr {&letter};


    //now we deference letter_ptr;


    cout << *letter_ptr << endl;


    When we run this code, this is what we get:


    ![](Images/image00149.jpeg)


    So, you see that we followed the pointer using the dereferencing operator, and
    this leads us to the data which the pointer was pointing to, in this case, the
    letter a.


    What will happen if we change the value of the pointer?


    Let’s add this line to our code:


    ***letter_ptr = ''b'';


    cout << *letter_ptr << endl;


    cout << letter << endl;**


    This is what we get:


    ![](Images/image00150.jpeg)


    What happened here? We changed the value of letter via the pointer. In order to
    understand this, you will need to learn about L values and R values in C++.


    L value (lvalue) are values that hold a specific location in memory which you
    can access with a pointer, for example:


    **int num {100}; //num is an L value


    string name {Alex}; //name is an L value**


    How do you know if a value can be accessed? Simple, if you can place it on the
    left side of an assignment statement:


    **num = 200; name = Donald;**


    Note that the number 200 and the name Donald are NOT an L value, they are literals,
    and they cannot be assigned on the left-hand side of an assignment statement:


    **200 = num; //this is not a valid statement! "Donald" = name; //this is not a
    valid statement!**


    In fact, these values are R values. R values, as you may guess, are the opposite
    of L values, as they are not addressable, and not assignable, as we have seen
    from the last statements. R values will be found on the right-hand side of an
    assignment statement, and they will always be literals. In general, you can say
    that anything that is not an L value is an R value.


    It is important to get to know L values, R values, and also understand the difference
    between them. We will get back to these terms later on. Let’s go back to pointers
    and have a look at another example of dereferencing them:'
