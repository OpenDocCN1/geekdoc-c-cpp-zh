    R_val = 140; //we change R_val to 140** Let’s see another example, this time in
    a function named calc_num: **int i {50}; void calc_num(int &&num);** calc_num
    (30); //calc_num is changing the R value But what will happen if we try to execute
    this statement?: calc_num(i);


    This will result in a compilation error, as i is a L value, and we expect an R
    value in our function.


    This will only work if we use this code: **int i {50}; void calc_num(int &num);
    calc_num(i); //calc_num is changing the L value**


