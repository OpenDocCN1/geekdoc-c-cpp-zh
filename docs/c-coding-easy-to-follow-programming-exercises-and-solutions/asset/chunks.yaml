  trans: "\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n  \
    \  //声明并初始化一个字符串为“David”\n    string name {\"David\"};\n    //我们声明并初始化了一个名为 name_ptr\
    \ 的指针，并将其\n    //初始化指向 name 的地址。\n    string *name_ptr{ &name };\n    //现在我们对\
    \ name_ptr 进行解引用；\n    cout << (*name_ptr).c_str() << endl;\n    //现在我们将名字“James”赋值给\
    \ name；\n    name =“James\";\n    cout << (*name_ptr).c_str() << endl;\n    cout\
    \ << name.c_str() << endl;\n}\n```\n\n\n\n现在我们已经对指针是什么、如何使用以及何时使用它们有了相当好的了解，让我们进一步深入探讨，并详细解释如何使用指针来动态分配内存。\n\
    \n## 使用指针进行动态内存分配\n\nC++ 的伟大之处之一在于，它允许我们真正控制受程序影响的每一个方面，而内存就是其中一个非常有意义的部分。在很多情况下，我们无法预先知道执行某个特定操作需要多少内存，特别是当我们在处理数组，甚至是向量（vector）时。这些情况的解决方案是在运行时分配所需的内存空间。这就是指针大显身手的地方：我们使用指针在堆（heap）上动态分配内存。动态内存分配是非常重要的，你将在程序的许多地方中用到它，因此真正理解它非常重要。\n\
    \n我们已经解释了堆（heap）和栈（stack）的基础知识，在本节中，我们将对其进一步的解释。\n\n为了在堆上动态分配内存，我们使用 `new` 关键字：\n\
    \n`int *ptr = new int; //使用“new”在//堆上为整数分配内存`\n\n通过使用 `new`，我们不再是给指针赋值整数的地址（就像我们之前做的那样），而是在运行时动态创建一个地址。你只需要记住，在初始化之前，存储器将包含垃圾数据。让我们看看在实际代码中看起来是\
    \ own 样的：\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main()\n\
    {\n    int *num_ptr{ nullptr }; //我们初始化一个指针指向空处 num_ptr\n    num_ptr = new int\
    \ ; //我们在堆上为一个整数分配内存\n//并将地址存储在指针 num_ptr 中\n\n    cout << &num_ptr << endl; //这将向我们展示刚刚创建的\
    \ new//int 的地址\n\n    cout << *num_ptr << endl; //由于我们没有初始化变量\n//我们在这里将获得垃圾数据\n\
    \n    *num_ptr = 25; //初始化为 25\n\n    cout << *num_ptr << endl; //现在将显示 25，而不是我们在//初始化之前显示的//垃圾数据\n\
    }\n```\n\n当我们运行这段代码时，我们预期的结果如下：\n\n![](img/image00151.jpeg)\n\n- 第一个输出是在堆上分配的地址。\n\
    - 第二个输出是垃圾数据，因为我们还没有初始化变量。\n- 25 是初始化的值。\n\n这个简单直接的例子很重要，因为它证明了除非你初始化新创建的变量，否则它将显示垃圾数据。尽管如此，更重要的是，访问数据的唯一途径是通过指针。如果你以某种方式丢失了指针（例如重新赋值），你将永远无法知道数据在哪里，也无法访问它，这正如你可能记得的，正如我们早些提到的，这就是内存泄漏。你不希望在你的程序中发生这种情况。\n\
    \n另一个需要知道的重要点是，一旦我们使用了该存储器，就必须释放它以便释放，我们可以重用该空间。为了做到这一点，我们只需使用 `delete` 关键字后跟指针名称，如下：\n\
    \n`delete num_ptr;`\n\n## 指针与 const\n\n在 C++ 中，我们可以将 `const`（常量）与指针结合来实现几种预期的结果。首先，我们可以使用指针指向常量值；在这种情况下，我们可以随时更改指针的值。其次，我们可以使用\
    \ `const` 创建常量指针，这种指针是不能更改的。让我们来看一个例子：\n\n`int tv_sold {120}; const int *tv_ptr\
    \ {&tv_sold};`\n\n在这段代码中，我们初始化了 `int` 变量，然后是一个初始化为指向 `tv_sold` 的指针。我们在变量类型之前使用了\
    \ `const`。这意味着指针所指向的值不能更改，因为现在它指向一个整数常量，但我们仍然可以更改它指向的地址。如果我们在代码中添加这一行，我们将得到编译错误，因为指针所指向的变量（`tv_sold`）的值不能更改：\n\
    \n`tv_ptr = 60; // 错误!` \n\n但如果我们改变 `tv_ptr` 指向的方向，将不会得到编译器错误：\n\n`tv_ptr = &tv_sold;\
    \ // 无错误`\n\n在声明常量指针时，我们应该期望这种语法：`int tv_sold {120}; int *const tv_ptr {&tv_sold};`\n\
    \n在这种情况下，指针是常量的，不能被更改。如果我们尝试运行这一行，将不会得到编译器错误：\n\n`tv_ptr = 60; // 无错误`\n\n但如果我们改变\
    \ `tv_ptr` 指向的位置，我们将得到编译器错误：`tv_ptr = &tv_sold; // 错误!`\n\n我们还可以同时使用常量变量和常量指针：\n\
    \n`int tv_sold {120}; const int *const tv_ptr {&tv_sold};`\n\n在这种情况下，两条语句都将导致编译错误，因为\
    \ `int` 变量和指针都不能更改：\n\n`tv_ptr = 60; // 错误!`\n\n`tv_ptr = &tv_sold; // 错误!`\n\n\
    ## 指针与数组\n\n在处理数组时，在堆上分配内存的有用方法之一。让我们来看一个例子。在这个例子中，我们想要创建一个给定班级学生人数的数组。我们询问用户：你们班级有多少个学生？然后在堆上动态创建一个具有所需大小的新数组：\n\
    \n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main()\n{\n    int\
    \ *num_ptr{ nullptr };\n    int number_of_students{};\n\n    cout << “你们班级有多少个学生?”\
    \ << endl;\n    cin >> number_of_students;\n    num_ptr = new int [number_of_students];\
    \ //在//堆上为数组分配内存\n    cout <<“你们班级的学生人数是 ” << number_of_students << endl;\n\n\
    \    delete num_ptr; //我们释放了在堆上使用的内存\n}\n```\n\n这段代码将正常运行并显示学生人数，而 `num_ptr =\
    \ new int [number_of_students];` 这一行是在堆上分配我们所需的确切大小。如果我们尝试给指针赋值，会发生什么？我们在 main\
    \ 函数末尾添加了这一行：\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
    \ {\n    // 上述代码\n    *num_ptr = 40; // 给 num_ptr 赋值 40\n}\n```\n\n运行时我们得到了一个异常：\n\
    \n![](img/image00152.jpeg) 意味着我们在释放存储器后无法访问它指向的位置。\n\n如果我们随后将指针赋值为 `nullptr`，使其指向无处，这是我们预期的结果：\n\
    \n![](img/image00153.jpeg)\n\n指针与数组的关系比我们展示的更有趣，因为我们还可以使用指针访问数组内的元素。让我们创建一个成绩数组，然后使用指针访问它：\n\
    \n```cpp\n#include <iostream>\n\nusing namespace std;\nint main() {\n    int grades[]{\
    \ 78, 86, 90, 52 };\n    int *grades_ptr{ grades };\n    cout << grades_ptr[0]\
    \ << endl;\n    cout << grades_ptr[1] << endl;\n    cout << grades_ptr[2] << endl;\n\
    \    cout << grades_ptr[3] << endl;\n}\n```\n\n当我们运行这段代码时，我们将获得数组的所有元素列表：\n\n\
    ![](img/image00154.jpeg)\n\n我们之所以可以使用指针访问数组中的元素，是因为在 C++ 中，数组名称的值实际上是数组第一个元素的值。由于指针变量的值也是一个地址，一旦我们将其指向数组（假设它们的数据类型相同），那么我们就可以使用指针和数组名来访问元素。这起初可能看起来困惑，但实际上非常简单，并且可以为你的代码增加巨大的价值。\n\
    \n"
- fmt: "\nIn C++, we can make arithmetic calculations and comparisons using pointers,\
    \ besides the possibility to use them for an assignment, as we have seen so far.\
    \ Arithmetic and comparison using pointers use the same operators and semantics\
    \ as you learned and know so far.\n\nPointers ’ arithmetic combined with arrays\
    \ can be very powerful. We use the `++` and `--` arithmetic operators to point\
    \ to the next or previous element of an array. Incrementing and decrementing is\
    \ within the size of the memory. So, for example, incrementing in an array of\
    \ integers will increment by 4 (as integers size is 4 bytes), while a `double`\
    \ will increment by 8.\n\nThe syntax will be: `int_ptr ++; int_ptr--;`\n\nWe can\
    \ also use `+=` or `-=` in order to increment or decrement a pointer by a specific\
    \ value:\n\n`int_ptr += i; int_ptr -=i;`\n\nAdditionally, we can subtract one\
    \ pointer from another only if they are pointing to the same data type:\n\n`int\
    \ i = int_ptr_2 – int_ptr_1;` In this case, the result will be the number of elements\
    \ between these two pointers.\n\nWe can also compare two pointers, but bear in\
    \ mind that pointers can only be equal as long as they are pointing to the same\
    \ address. To compare, we use the `==` operators or the `!=` operators.\n\n###\
    \ Working with pointers and functions\n\nPointers can play an important role when\
    \ working with functions and can do so in various ways. The first method we will\
    \ look into is passing pointers to a function by reference. In a previous section,\
    \ we explained how to pass functions by reference. Let’s refresh our memory a\
    \ bit:\n\nWhen we discussed functions that are passed by value, we explained that\
    \ they use a copy of the arguments and do not change the arguments if the copy\
    \ is changed in value. We called it actual parameters and formal parameters. Passing\
    \ function by reference works the other way around: we use the location of the\
    \ parameter to change it when using the function. In order to do this, we must\
    \ use the actual address in memory of the parameter by using the `&` sign before\
    \ a parameter.\n\nPointers passed to a function by reference are passed as parameters,\
    \ and if there is any change in the pointer’s value, it will not affect the function.\
    \ Let’s review an example for a function that adds a bonus score to a given score\
    \ (incrementing by 1):\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    //function prototype\nvoid bonus_score(int * int_ptr); // function definition\n\
    void bonus_score(int * int_ptr) {\n    *int_ptr += 1; //dereferencing the pointer\
    \ and\n    //incrementing by 1\n}\nint main() {\n    int score{89};\n    cout\
    \ << score << endl;\n    bonus_score(&score);\n    cout << score << endl;\n}\n\
    ```\n\nWhen running the code, we get exactly what we expect—the score 89 and then\
    \ the score 90:\n\n![](Images/image00155.jpeg)\n\nLet ’s go through another example,\
    \ this time we will be working with a pointer within a function and displaying\
    \ the collection of elements in a vector. This can be a good recap for working\
    \ with functions, for loop, and vectors.\n\nIn this example, we want to create\
    \ a vector that contains a collection of strings. We will use a pointer to iterate\
    \ through the collection (we will need to dereference the pointer First, of course)\
    \ and then display the names. First, let’s look at the function:\n\n```cpp\n#include\
    \ <iostream>\n#include <vector>\nusing namespace std;\n// function definition\n\
    void name_list(vector<string> * v) {\n    for (auto str : *v) // looping through\
    \ the vector\n        cout << str.c_str() << \" is a name on the list\" << endl;\n\
    }\nint main() {\n    //function call\n    vector<string> names{\"Joe\", \"Shirley\"\
    , \"Jack\", \"Linda\"};\n    name_list(&names);\n}\n```\n\nLet’s review the code:\n\
    \nWe created a function (we didn ’t use function prototype here), which calls\
    \ a vector of strings and a pointer `*v`. We then iterated through the vector\
    \ list by dereferencing `v` and displayed the names. In main, we initialized a\
    \ vector called `names`. We call the function, and it displays the names on the\
    \ collection: Joe, Shirley, Jack, and Linda. When we run this code, this is what\
    \ we should expect:\n\n![](Images/image00156.jpeg)\n\nNow that we have discussed\
    \ how to pass a pointer to a function, let’s now see how we can return a pointer\
    \ from a function. In order to return a pointer by a function, we first need to\
    \ define the type of pointer both in the function prototype and function definition.\
    \ At the end of this process, the function is expected to return an address.\n\
    \nHere is an example for a function that returns a pointer parameter—notice that\
    \ the comparison is not between the pointers themselves, but between what they\
    \ are pointing to, and we do that by dereferencing them:\n\n```cpp\n#include <iostream>\n\
    #include <vector>\nusing namespace std;\n// function definition\nint *smaller_num(int\
    \ * int_ptr1, int * int_ptr2) {\n    if (*int_ptr1 < *int_ptr2)\n        return\
    \ int_ptr1;\n    else\n        return int_ptr2;\n}\n//now we need to call this\
    \ function:\nint main() {\n    int a{25};\n    int b{34};\n    int *smaller_ptr{nullptr};\n\
    \    smaller_ptr = smaller_num(&a, &b);\n    cout << \"The smaller number is \"\
    \ << smaller_ptr << endl;\n}\n```\n\nWhen we run this code, we get a strange result:\n\
    \n![](Images/image00157.jpeg)\n\nWe notice that the output actually displays an\
    \ address in memory. Why is that? Well, we didn’t dereference `smaller_ptr` in\
    \ our output statement, so it will show us the address that `smaller_ptr` is pointing\
    \ to, but not the value. Once we dereference it like this:\n\n`cout << \"The smaller\
    \ number is \" << *smaller_ptr << endl;`\n\nwe will then get the correct output:\n\
    \n![](Images/image00158.jpeg)\n\n### Allocating memory dynamically from a function\n\
    \nDynamic memory allocation via a function is very powerful and a common use case\
    \ when working with pointers within a function. However, there are certain rules\
    \ of thumb that are important to maintain.\n\nLet ’s look at some code in order\
    \ to understand how to allocate memory dynamically. In this code, we first create\
    \ a function that creates an array during run time. In the function definition,\
    \ we need to define an `unsigned int` for size—which will allow us to set the\
    \ size of the array during runtime, and another `int` which will be set to the\
    \ value of the array’s elements:\n\n```cpp\n#include <iostream>\n#include <vector>\n\
    using namespace std;\n// defining our function\nint *build_array(size_t size,\
    \ int element_value) {\n    //creating new storage during runtime:\n    int *new_storage{nullptr};\n\
    \    //assigning new int to new storage:\n    new_storage = new int[size];\n\n\
    \    //looping through arrays elements:\n    for (size_t i{0}; i < size; ++i)\n\
    \        *(new_storage + i) = element_value;\n    //this will return the address\
    \ of the newly created first\n    //integer in the array\n    return new_storage;\n\
    }\n// calling the function:\nint main() {\n    // we will use the function to\
    \ allocate elements to this array:\n    int *new_array;\n    new_array = build_array(40,\
    \ 12);\n    //we can do all kinds of things with this code…\n    // we can do\
    \ this...\n    // we can do that...\n\n    //after using the code we have to delete\
    \ the array which\n    //captures space in memory by using the delete keyword.\
    \ Don’t\n    //forget to free up the storage!\n    delete[] new_array;\n}\n```\n\
    \nIMPORTANT: Note that we are using square brackets in this case as these brackets\
    \ indicate that we are deleting an array. `delete` is used in C++ to preform many\
    \ other deleting functions, so it is important to distinguish the case that we\
    \ are deleting a whole array which is why `[]` is used in this case.\n\n#### Potential\
    \ issues when working with pointers\n\nWe went over several potential problems\
    \ when working with pointers. We explained how important it is to initialize pointers,\
    \ or else they will point to garbage. We explained the best way to avoid this\
    \ is by using `nullptr` so that the pointer will point nowhere. It’s important\
    \ to keep this in mind.\n"
  raw: 'In C++, we can make arithmetic calculations and comparisons using pointers,
    besides the possibility to use them for an assignment, as we have seen so far.
    Arithmetic and comparison using pointers use the same operators and semantics
    as you learned and know so far.


    Pointers ’ arithmetic combined with arrays can be very powerful. We use the ++
    and - - arithmetic operators to point to the next or previous element of an array.
    Incrementing and decrementing is within the size of the memory. So, for example,
    incrementing in an array of integers will increment by 4 (as integers size is
    4 bytes), while a double will increment by 8.


    The syntax will be: **int_ptr ++ int_ptr -**


    We can also use + = or - = in order to increment or decrement a pointer by a specific
    value:


    **int_ptr += i; int_ptr -=i;**


    Additionally, we can subtract one pointer from another only if they are pointing
    to the same data type:


    **int i = int ptr_2– int ptr_1;** In this case, the result will be the number
    of elements between these two pointers.


    We can also compare two pointers, but bear in mind that pointers can only be equal
    as long as they are pointing to the same address. To compare, we use the = = operators
    or the ! = operators.


    **Working with pointers and functions**


    Pointers can play an important role when working with functions and can do so
    in various ways. The first method we will look into is passing pointers to a function
    by reference. In a previous section, we explained how to pass functions by reference.
    Let’s refresh our memory a bit:


    When we discussed functions that are passed by value, we explained that they use
    a copy of the arguments and do not change the arguments if the copy is changed
    in value. We called it actual parameters and formal parameters. Passing function
    by reference works the other way around: we use the location of the parameter
    to change it when using the function. In order to do this, we must use the actual
    address in memory of the parameter by using the ‘&‘ sign before a parameter.


    Pointers passed to a function by reference are passed as parameters, and if there
    is any change in the pointer’s value, it will not affect the function. Let’s review
    an example for a function that adds a bonus score to a given score (incrementing
    by 1):


    **#include <iostream> using namespace std; //function prototype void bonus_score(
    int * int_ptr ); // function definition void bonus_score( int * int_ptr ) { *
    int_ptr += 1; //dereferencing the pointer and //incrementing by 1 } int main()
    int score{ 89 }; cout << score << endl; bonus_score(&score); cout << score <<
    endl; }**


    When running the code, we get exactly what we expect—the score 89 and then the
    score 90:


    ![](Images/image00155.jpeg)


    Let ’s go through another example, this time we will be working with a pointer
    within a function and displaying the collection of elements in a vector. This
    can be a good recap for working with functions, for loop, and vectors.


    In this example, we want to create a vector that contains a collection of strings.
    We will use a pointer to iterate through the collection (we will need to dereference
    the pointer First, of course) and then display the names. First, let’s look at
    the function:


    **#include <iostream>


    #include <vector>


    using namespace std;


    // function definition


    void name_list( vector < string > * v )


    for ( auto str : * v ) // looping through the vector cout << str.c_str() <<“ is
    a name on the list” << endl; } int main() { //function call vector < string >
    names{ “Joe” , “Shirley” , “Jack” , “Linda” }; name_list(&names); }** Let’s review
    the code:


    We created a function (we didn ’t use function prototype here), which calls a
    vector of strings and a pointer *v. We then iterated through the vector list by
    dereferencing v and displayed the names. In main, we initialized a vector called
    “names.” We call the function, and it displays the names on the collection: Joe,
    Shirley, Jack, and Linda. When we run this code, this is what we should expect:


    ![](Images/image00156.jpeg)


    Now that we have discussed how to pass a pointer to a function, let’s now see
    how we can return a pointer from a function. In order to return a pointer by a
    function, we first need to define the type of pointer both in the function prototype
    and function definition. At the end of this process, the function is expected
    to return an address.


    Here is an example for a function that returns a pointer parameter —notice that
    the comparison is not between the pointers themselves, but between what they are
    pointing to, and we do that by dereferencing them:


    #include <iostream> #include <vector> using namespace std; // function definition
    int *smaller_num( int * int_ptr1 , int * int_ptr2 ) { if (* int_ptr1 < * int_ptr2
    ) return int_ptr1 ;


    else return int_ptr2 ; } //now we need to call this function: int main() { int
    a{ 25 }; int b{ 34 }; int *smaller_ptr{ nullptr }; smaller_ptr = smaller_num(&a,
    &b); cout <<“The smaller number is “ << smaller_ptr << endl; } When we run this
    code, we get a strange result:


    ![](Images/image00157.jpeg)


    We notice that the output actually displays an address in memory. Why is that?
    Well, we didn’t dereference smaller_ptr in our output statement, so it will show
    us the address that smaller_ptr is pointing to, but not the value. Once we dereference
    it like this:


    **cout << "The smaller number is " << * smaller_ptr << endl;** we will then get
    the correct output:


    ![](Images/image00158.jpeg)**Allocating memory dynamically from a function**


    Dynamic memory allocation via a function is very powerful and a common use case
    when working with pointers within a function. However, there are certain rules
    of thumb that are important to maintain.


    Let ’s look at some code in order to understand how to allocate memory dynamically.
    In this code, we first create a function that creates an array during run time.
    In the function definition, we need to define an unsigned int for size—which will
    allow us to set the size of the array during runtime, and another int which will
    be set to the value of the array’s elements:


    #include <iostream> #include <vector> using namespace std; // defining our function
    int * build_array( size_t size, int element_value ) { //creating new storage during
    runtime: int *new_storage{ nullptr }; //assigning new int to new storage: new_storage
    = new int [ size ];


    //looping through arrays ’ elements: for ( size_t i{ 0 }; i < size ; ++i) *(new_storage
    + i) = element_value ; //this will return the address of the newly created first
    //integer in the array return new_storage; } // calling the function: int main()
    { // we will use the function to allocate elements to this array: int *new_array;
    // this will create an array with 40 elements and value of 12 to each // element
    new_array = build_array(40, 12); //we can do all kinds of things with this code…
    // we can do this... // we can do that...


    //after using the code we have to delete the array which //captures space in memory
    by using the delete keyword. Don’t //forget to free up the storage!


    delete[] new_array;


    }


    IMPORTANT: Note that we are using square brackets in this case as these brackets
    indicate that we are deleting an array. Delete is used in C++ to preform many
    other deleting functions, so it is important to distinguish the case that we are
    deleting a whole array which is why [] is used in this case.


    **Potential issues when working with pointers**


    We went over several potential problems when working with pointers. We explained
    how important it is to initialize pointers, or else they will point to garbage.
    We explained that the best way to avoid this is by using nullptr so that the pointer
    will point nowhere. It’s important to keep this in mind.'
