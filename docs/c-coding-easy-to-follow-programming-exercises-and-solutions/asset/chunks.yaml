    \n```cpp\ncout << \"The first basketball score is \" << basketball_scores [0];\n\
    cout << \"The second basketball score is \" << basketball_scores [1];\ncout <<\
    \ \"The third basketball score is \" << basketball_scores [2];\ncout << \"The\
    \ fourth basketball score is \" << basketball_scores [3];\ncout << \"The fifth\
    \ basketball score is \" << basketball_scores [4];\n```\n\nAs you can see, this\
    \ is very simple!\n\n### Multidimensional arrays\n"
