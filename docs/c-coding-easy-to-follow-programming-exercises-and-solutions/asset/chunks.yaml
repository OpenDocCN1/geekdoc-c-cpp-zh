    thread std::cin.get(); say_something = true ; // if the user typed something your_input.join();
    // the second thread joins only when the first thread // finished std::cin.get();


    } When we run this code, we get this output until we type something:


    Note that the join() function can be a complex topic, and we recommend reading
    more about it in the link below:


    http://www.cplusplus.com/reference/thread/thread/join/


    It is important to understand that when we execute threads, we use available CPU
    cores between different threads. This is also called hardware concurrency, and
    it works in a non-deterministic way. This means that various threads can run on
    various cores in parallel, while each executes a specific task. C++ standard library
    offers the


    std::thread::hardware_concurrency() function, which can tell the number of threads
    the program can run concurrently on a given machine. thread::hardware_concurrency()
    function observes a state and then returns the corresponding output, which will
    be the number of concurrent threads, which the machine’s hardware implementation
    can support. However, the returned value might not always be accurate.


    Before reviewing the code sample of thread::hardware_concurrency(), let ’s first
    understand how these operations work on a given computer with two cores or a single
    core, compared to single code where tasks are switching and is not same as threading:


    **Dual cores:**


    Below is a simple code sample demonstrating how to use the hardware_concurrency()
    function:


    **#include "pch.h" #include <iostream> #include <thread> using namespace std;
    int main() { unsigned int num_threads; num_threads = thread ::hardware_concurrency();
    cout <<“Number of concurrent threads supported are:“ << num_threads << endl; return
    0; }**


    Running the code will differ between various computers, as the configuration is
    different. In our case, the result will be 4 threads:


    ![](Images/image00194.jpeg)**Passing arguments to a thread function**


    It can be extremely simple and easy to pass an argument to a thread function —we
    simply need to pass the argument to the callable object or to the function. Yet,
    it is important to remember that by default, the arguments are copied into the
    internal memory, where the thread can access them upon execution.


    It is also important to remember that we do not want to pass addresses of variables
    from local stack to the threads’ callback, as in a case where a local variable
    in Thread A will run out of scope, and as Thread B might be trying to access the
    address it used– we will have a serious problem and unexpected behavior in our
    program. The same applies when using pointers pointing to a memory location on
    the heap, as the address might be invalid if one of the threads deletes it upon
    reaching its scope.


    Let ’s see a code sample:


    **#include "pch.h"


    #include <iostream>


    #include <string>


    #include <thread>


    // This is our callback function


    // It is invoked by our thread object


    void myCallbackFunction( int myInt , std:: string myStr )


    {**


    **std::cout <<“The string passed to this function is =“ << myStr << std::endl;


    std::cout <<“The integer passed to this function is = “ << myInt << std::endl;**


    **} int main() { int x = 24; std:: string str =“This is a string” ; // Invoking
    our thread and indicating a callback function, along // with the parameters sent
    to it (int, string) std:: thread myThreadObject(myCallbackFunction, x, str); myThreadObject.join();
    return 0; }** When running this code, this is what we would expect:


    ![](Images/image00195.jpeg)


    There is so much that you can learn about multithreading and concurrency in C++,
    and this topic can be quite advanced. We recommend that you continue to explore
    this subject and the link below is a good place to start: https://www.tutorialspoint.com/cplusplus/cpp_multithreading.htm


    # **Chapter 28: C++ Coroutines**


    Coroutines in C++ are a form of control structures, which keep flow control between
    two different routines without returning. In other words, coroutines are a new
    way to write an async code in a manner that allows the async operation to run
    in parallel. In a way, using Coroutines is as though we forgot the concepts of
    the caller and callable, which is the normal way async functions or operations
    work. Think of both as collaborating equal partners. We can use Coroutines in
    various scenarios, and they can be extremely powerful when you want to write an
    event-driven application such as games, UI, communication apps, servers, and more.


    Before Coroutines came to life in the new C++ standard, it was possible to handle
    async operations in a complex manner (using handler code to handle call back is
    one way of doing so). Still, these methods complicate the code and are hard to
    follow. Coroutines are a great abstraction– they make it easier for you as a programmer
    to handle the complex operation of async in a serialized fashion. Note that using
    Coroutines will not necessarily help to generate better performance but will make
    it easier to write and handle.


    Coroutines are a new addition to C++, and as such, you can say it is still under
    the experiment of the users (it is officially now part of the C++ new standard
    since February 2020). In fact, Coroutines are a big part of the evolution of C++,
    even from the early days of C, as they are a real evolution of how we define,
    manage, and use functions. The brand-new C++ 20 standard released a massive and
    important yet another evolution of Coroutines, which made the C++ community pretty
    happy. But first, let’s gain a better understanding of the concept of Coroutines
    in C++.


    The word Coroutines is actually constructed from two words: Co and Routines. Co
    stands for cooperating, while routines are functions. In other words, Coroutines
    are a way for functions to work in cooperation. You already learned how to define,
    declare, and use functions in C++. We could have a function namedfunc1, which
    will call another function named func2:


    **void func1() { //statements Func2; //statements }**


    When func1() calls func2(), the control is passed over to func2(), and untilfunc2()
    runs out of scope, the control will remain with func2(). Only once func2() runs
    out of scope will the control be returned to func1(). The control will not be
    passed in between executions.


    Coroutines change the rules of the game, which is why it is considered a major
    change in modern C++ ever since it was introduced. With Coroutines, the control
    from func2() can be returned to func1() when func2() completes only part of its
    execution. The control can go back and forth between the functions several times
    during the lifecycle of both. When func2() is done, the control will go back to
    func1() one final time. You can understand from this example the type of cooperation
    and relationship Coroutines offers between functions, which can give us a lot
    of power and control over the flow of our program. Each of the functions that
    cooperate will remember exactly where it left off and will continue from there
    once the control is returned to it. This is truly brilliant and powerful.


    But that ’s not all because, during the lifecycle of the Coroutines, the functions
    can pass values. So, for example, if func1() moves the control to func2() and
    func2() performs a calculation, it can return the result to func1(), and func1()
    will use the result and continue from where it left off. Then func1() can calculate
    something and return a new value to func2(), which will, as you may guess, use
    it when it resumes.'
