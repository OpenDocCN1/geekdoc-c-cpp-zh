    \ important to check what was input by the user. Here is an example: you want\
    \ the user to enter his/her age, then do some manipulation on the number entered.\
    \ What if the value entered isn’t a number at all? What if the number doesn’t\
    \ make sense (i.e., `age = 2000` or `-100)?\n\nFor these reasons, you should always\
    \ check both the type of data entered and the value, allowing a range of values\
    \ to be entered.\n\nThe following example tries to find out the year of birth\
    \ based on the age input by the user.\n\n```cpp\n#include \"pch.h\"\n#include\
    \ <iostream>\n#include <string>\nint main() {\n    std::string age;\n    std::cout\
