    ![](Images/image00160.jpeg)Adding a source file (.cpp) is similar to adding a
    header file, except for selecting the “C++ File” type.


    Let’s see an example of implementing the member method by using our Manage_Account
    class:


    **class Manage_Account


    {


    private:


    double balance; //only class members can access this attribute public:


    //we have two public methods and onlythey can access ‘double balance’ void calc_balance
    (double balance) { balance = bal; } double show_balance() { return balance; }
    };**


    If we want to declare these methods outside the class declaration, it will look
    like this:


    This part of our class declaration will be a part of our .h file: **class Manage_Account
    { private: double balance; //only class members can access this //attribute public:**


    **void calc_balance(double bal); //this is the method prototype double show_balance();
    //this is the method prototype //our class declaration ends here };** This part
    of our class declaration will be a part of our .cpp file: **//implementing member
