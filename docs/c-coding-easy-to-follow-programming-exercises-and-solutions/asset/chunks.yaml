    ```


    我们并不是在检查 `A` 是否等于 5，或者 `b` 是否等于 4。我们是在给 `A` 赋值 5。`B` 被赋值为 4。`c` 现在拥有 `a` 加上 `b`
    的值，最后，`a` 不等于 `c`。


