    试一试！更新之前的练习题，要求用户输入完整姓名。然后输出他们的名字以及他们在今年将是几岁。例如，输出应该为：“Hello Joe Smith. In 2020,\
    \ you are going to be xx years old”。\n\n### 意外的输入类型\n\n检查用户输入了什么总是重要的。这里有一个例子：你想让用户输入他们的年龄，然后对输入的数字进行一些处理。如果输入的值根本不是数字怎么办？如果这个数字没有意义（例如\
    \ `age = 2000` 或 `-100`）怎么办？\n\n由于这些原因，你应该始终检查输入的数据类型和值，允许输入一个范围的值。\n\n下面的示例尝试根据用户输入的年龄查找出生年份。\n\
    \n```cpp\n#include \"pch.h\"\n#include <iostream>\n#include <string>\nint main()\
    \ {\n    std::string age;\n    std::cout <<\"Enter your age\\n\";\n    std::cin\
    \ >> age;\n    int YearOfBirth = 2020 - atoi(age.c_str());\n    std::string result\
    \ = std::to_string(YearOfBirth);\n    std::cout <<\"You were born in\" << result.c_str()\
    \ << \"\\n\";\n}\n```\n\n然而，如果用户输入的内容没有意义怎么办？让我们看看两种可能性的例子：1. 用户输入字符串而不是数字。\n\n\
    ![](img/image00131.jpeg)\n\n如你所见，用户输入了：“I am not telling my age!”而结果是“2020”，就好像给出的年龄是\
    \ 0。让我们检查代码看看原因以及如何修复：\n\n`atoi()` 函数用于将存储在字符串中的数值转换为整数。如果你在字符串中存储“6”，它将将其转换为\
    \ 6。\n\n然而，如果给定的字符串内部没有数值数据（如我们的示例所示），返回值将是 0。\n\n**如何修复：** 首先，让我们在程序中添加另一行：`int\
    \ intVal = atoi(age.c_str());`。\n\n现在，`intVal` 将持有以字符串形式输入的数值与其实际数值值（存储在 `Integer`\
    \ 中）之间的转换结果。\n\n如果结果为 0，则用户要么输入了某些文本，要么输入了 0。这两种情况都会导致 `intVal` 被赋值为 0。\n\n现在，我们将使用几个\
    \ `if / else` 条件来检查这两种情况并处理它们：\n\n```cpp\n#include \"pch.h\"\n#include <iostream>\n\
    #include <string>\nint main() {\n    std::string age;\n    std::cout <<“Enter\
    \ your age\\n”;\n    std::cin >> age;\n    int intVal = atoi(age.c_str());\n \
    \   if (age == “0” ) {\n        std::cout <<“Age 0 doesn’t make sense\\n”;\n \
    \   } else if (intVal == 0) {\n        std::cout <<“You entered some text (“ <<\
    \ age.c_str() <<“) instead of a numeric value\\n”;\n    } else {\n        int\
    \ YearOfBirth = 2020 - intVal;\n        std::string result = std::to_string(YearOfBirth);\n\
    \        std::cout <<“You were born in” << result.c_str() << \"\\n”;\n    }\n\
    }\n```\n\n让我们看看如果用户输入“0”作为年龄会发生什么：\n\n![](img/image00132.jpeg)\n\n现在让我们检查输入某些文本的原始场景：\n\
    \n![](img/image00133.jpeg)\n\n试一试！创建一个程序，要求用户输入出生年份和当前年份。年份格式应包含 4 位数字（例如 1995，2020）。例如，输出应该是：“On\
    \ 2020, you are going to be xx years old.”\n\n# 第 8 章：数组 (Arrays)\n\n数组是 C++ 中的数据结构。数组是固定范围或元素集合，这些元素被结构化在一起；例如字母或数字的列表。它可以是固定数量的名称、数字、日期、单词、字符等。数组始终具有相同类型的数据。因此，它可以是同类变量的列表，例如\
    \ `int`、`char` 和 `double` 等。你永远不能在数组中混合数据类型，所以你永远不会在同一个数组中看到整数和字符串在一起——这没有意义。需要注意的是，当使用数组时，我们仍然可以直接访问每一个元素。\n\
    \n还记得你小学时学习学习乘法吗？你的老师可能向你展示了比写 `2+2+2+2+2+2+2` 更好的方法，即 `2 X 7`。同样，数组简化了我们的代码并减少了重复。例如，假设我们有一个价格列表：\n\
    \n```cpp\nint price1 {10};\nint price2 {20};\nint price3 {30};\nint price4 {40};\n\
    ```\n\n与其写列表，我们可以简单地写：`int price [4] {10, 20, 30, 40};`\n\n`变量类型 数组名 [数组大小]`\n\
    \n注意，在数组中，我们使用方括号 `[ ]`。\n\n我们提到过当使用数组时，我们仍然可以直接访问每一个元素。我们通过使用元素的索引位置来实现。第一个元素始终是\
    \ `#0`，所以第二个是 `#1`。最后一个元素始终是 `size-1`。如果数组的大小为 100，最后一个元素的位置将是 `#99`。\n\n让我们看看如何使用数组的示例：\n\
    \n我们有一个类型 `char`，并且有一个 5 个字符的列表。这传达了使用数组有多简单：\n\n```cpp\nchar Letter_Count [5];\n\
    ```\n\n在这个示例中，我们有一个 5 个字符的数组，但我们并不知道每一个元素的名称是什么。如果我们想初始化数组，可以以类似的方式通过使用赋值运算符初始化变量来实现：\n\
    \n```cpp\nchar Letter_Count [5] = {a, b, c, d, e};\n```\n\n如果我们在声明数组时不指定数组大小，编译期间将创建一个精确大小的数组。例如：`char\
    \ Letter_Count [ ] = {a, b, c, d, e};`\n\n在这种情况下，当你初始化数组元素时会自动创建一个大小为 5 的数组。\n\
    \n注意数组中的项目必须至少有一个，或者大于一个。记住数组的大小是静态的，这意味着如果例如我们声明了一个包含 7 个元素的数组，添加另一个元素会导致编译错误或程序崩溃。\n\
    \n如果我们想初始化数组中的单个元素，可以：\n\n```cpp\nLetter_Count [2] = Z;\n```\n\n在这个示例中，数组中的第三个字符将被赋值为\
    \ Z。\n\n### 操作数组和访问元素\n\n访问数组元素简单直接。我们只需要使用数组名称，后面跟着我们要访问的元素的索引位置。\n\n假设我们有一个得分数组：`int\
    \ basketball_scores [45, 107, 86, 190, 131];`。让我们按顺序向控制台打印：\n\n```cpp\ncout <<\
    \ \"The first basketball score is \" << basketball_scores [0];\ncout << \"The\
    \ second basketball score is \" << basketball_scores [1];\ncout << \"The third\
    \ basketball score is \" << basketball_scores [2];\ncout << \"The fourth basketball\
    \ score is \" << basketball_scores [3];\ncout << \"The fifth basketball score\
    \ is \" << basketball_scores [4];\n```\n\n如你所见，这非常简单！\n\n### 多维数组\n"
