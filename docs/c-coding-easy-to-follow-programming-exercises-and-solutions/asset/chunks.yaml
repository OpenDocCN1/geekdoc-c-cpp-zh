  trans: "\n\n# 继承概念\n\n在继承方面，要理解的最概念之一是“是一个”（Is-A）关系。理解这个概念的方法首先是理解被继承的类是父类的子类型。这正是我们使用“是一个”关系时所隐含的含义。我们将在本节中进一步解释这一概念以及我们如何进一步使用它。你需要学习的另一个概念是“泛化”（generalization），当我们把几个具有相似功能的类根据它们的通用属性合并成一个单一的通用类时，泛化就会发挥作用。而“特化”（specialization）的概念在某种意义上是相反的，因为它创建一个具有更特定属性、方法和功能的类。\n\
    \n## 层次结构\n\n处理继承时，另一个核心术语是“层次结构”（Hierarchy）。层次结构是我们从上到下组织继承关系的方式。这允许我们更好地组织代码。下方的图展示了层次结构是如何与泛化和特化共同作用的：\n\
    \n![](img/image00163.jpeg)\n\n在这张图中，我们可以看到父类 `A` 与子类 `B` 和 `C` 之间存在关系。层级越高，我们的类就越通用。层级越低，它就越具体。`B`\
    \ 是一个 `A`，`C` 也是一个 `A`。`D` 是一个 `C`，但 `D` 也是一个 `A`。`E` 是一个 `D`，但它也是一个 `C` 和一个 `A`。显然，类\
    \ `B` 不是 `C`。它只是一个 `A`，因为两者之间不存在继承关系。\n\n到目前，你应该已经熟悉类与其父类或子类之间的关系概念，以及我们需要的问题——类\
    \ `X` 和类 `Y` 之间是否存在关系？然而，还有另一个我们需要问的问题：类 `X` 是否与类 `Y` 有关系？事实上，这是类继承中的另一个概念，被称为公共继承（“是一个”问题）和组合（composition,“有一个”问题）。让我们复习一些例子：\n\
    \n### 公共继承：\n- 客户是一个人。\n- 储蓄账户是一个账户。\n\n### 组合：\n- 客户有一个账户。\n- 储蓄账户有一个存款限额。\n\n\
    在很多情况下，程序员在类中使用组合，而且到目前为止我们一直这样做。例如，当我们类中声明 `name` 和 `age` 属性时，我们使用了组合：\n\n```cpp\n\
    Class client\n{\nprivate:\n    std::str name; //有一个名字\n    Account account; //有一个账户\n\
    \    //以下是语句\n};\n```\n\n当你开始作为一名程序员工作时，你很快就会发现组合和继承是结合使用的。现在让我们看看如何使用继承从现有类派生出一个新类。\n\
    \n## 实现继承\n\n我们需要做的第一件事是声明父类。如你所知，这个类有它自己的数据成员：\n\n```cpp\nclass Parent { //类成员\
    \ };\n```\n\n现在，我们必须声明子类，为此，我们需要一个访问修饰符（private、public 或 protected）以及基类的名称：\n\n\
    ```cpp\nclass Child: access-specifier Parent { //派生类成员 };\n```\n\n在在处理继承时，理解访问修饰符的含义是非常重要的。在大多数其他编程语言中，你只会遇到公共继承，但在\
    \ C++ 中，我们拥有所有三个选项。首先，最常用的访问修饰符是 `public`，它建立了我们在本节之前解释的“是一个”关系。注意：如果你不指定访问修饰符，默认将使用私有继承。第二个选项是使用\
    \ `private` 或 `protected` 访问。这样做将在子类和父类之间建立“有一个”的关系。在本节中，我们将关注公共继承。如果你想了解更多关于私有或保护继承的内容，可以在以下链接中找到额外信息：https://www.learncpp.com/cpp-tutorial/115-inheritance-and-access-specifiers/\n\
    \n让我们复习一个使用公共继承的父类和子类的示例：\n\n```cpp\nclass Account //父类 { //在这里我们定义类成员 };\nclass\
    \ Trust_Account: public Account //子类 {在这里我们定义派生类成员 };\n```\n\n观察这两个类时，我们可以问：储蓄账户是一个账户吗？答案是肯定的。你可以看到这两个类之间存在“是一个”的关系。现在我们可以为\
    \ `Trust_Account` 类指定特殊的行为，而其他部分将从 `Account` 类派生。\n\n这这一切看起来非常简单，事实也如此，但请记住，随着代码复杂性的增长，继承有时会变得相当复杂。\n\
    \n## 代码示例\n\n让我们复习一下演示继承使用的简单代码。在这个例子中，我们创建了一个名为 `Animals` 的类并创建了两个子类：`Dog` 和\
    \ `Cat`。\n\n让我们先看 `.h` 文件中的类原型：\n```cpp\n#pragma once \nclass Animal { \npublic\
    \ : \n    virtual void SaySomething(); \n};\n```\n现在让我们看 `Animal` 的 `.cpp` 文件：\n\
    ```cpp\n#include <iostream> \n#include“Animal.h”\nusing namespace std;\nvoid Animal\
    \ ::SaySomething() { \n    cout <<“I’t know what to say...” << endl; \n}\n```\n\
    现在我们有两个派生类。这里是 `Dog` 类的 `.h` 文件：\n```cpp\n#pragma once \n#include“Animal.h”\n\
    class Dog : public Animal { \npublic : \n    void SaySomething(); \n};\n```\n\
    以及 `Cat` 类的 `.h` 文件：\n```cpp\n#pragma once \n#include“Animal.h”\nclass Cat : public\
    \ Animal { \npublic : \n    void SaySomething() \n};\n```\n现在让我们看 `Dog` 的 `.cpp`\
    \ 文件：\n```cpp\n#include <iostream> \n#include“Dog.h”\nusing namespace std;\n//\
    \ 这是 Dog 继承的 SaySomething() 函数。\n// 它继承自 Animal 类，该类有一个同名的虚\n// 函数\n// 虚函数就像是每个派生类所继承的真实\n\
    // 函数的占位符\n// 即：Cat 和 Dog\nvoid Dog ::SaySomething() { \n    cout <<“How How”\
    \ << endl; \n}\n```\n现在是 `Cat` 的 `.cpp` 文件：\n```cpp\n#include \"Cat.h\" \n#include\
    \ <iostream>\nusing namespace std;\n// 这是 Cat 继承的 SaySomething() 函数。\n// 它继承自\
    \ Animal 类，该类有一个同名的虚\n// 函数\n// 虚函数就像是每个派生类所继承的真实\n// 函数的占位符\n// 即：Cat 和 Dog\n\
    void Cat ::SaySomething() { \n    cout <<“Miahu Miahu” << endl; \n}\n```\n\n这个简单的示例展示了我们如何继承一个函数并针对每个类进行特定的修改。让我们从\
    \ `main()` 运行程序：\n\n```cpp\n#include <iostream> \n#include “Animal.h” \n#include“Dog.h”\
    \ \n#include“Cat.h”\nint main() { \n    Dog myDog; \n    myDog.SaySomething();\n\
    \    // 相同的函数 (SaySomething) 会为狗\n    // 返回“How How”。\n    Cat myCat; \n    myCat.SaySomething();\
    \ //相同的函数 (SaySomething) 会为猫\n    // 返回 Miahu。 \n}\n```\n这是我们预期的结果：\n\n![](img/image00164.jpeg)\n\
    \n## 使用继承时的构造函数和析构函数\n\n在 C++ 中，子类继承父类的构造函数，但在任何派生对象初始化之前，首先执行父类，然后执行子类。从某种意义上说，由于派生类可以使用封装在基类中的信息，这意味着父类将首先执行构造函数，然后子类执行。\n\
    \n析构函数的调用顺序与构造函数的顺序相反。首先必须销毁派生部分，然后才能销毁基部分。这是我们预期的操作顺序：\n\n![](img/image00165.jpeg)基类\
    \ / 父类：派生类 / 子类：\n\n![](img/image00166.jpeg)\n\n注意：无论我们有一个派生类还是多个派生类，构造和析毁的顺序都适用。由于基类构造函数首先初始化，这些构造函数必须被调用。事实上，派生类可以调用构造函数、析构函数和重载的赋值运算符。\n\
    \n"
- fmt: "\nHow do we know the constructors that should be initialized and those which\
    \ should not? The derived class can control the arguments that are passed to the\
    \ base class, and therefore, control initialization. Let’s see how to do this:\n\
    \n```cpp\nclass Account //our parent\n{\npublic:\n    Account(); //our constructor\n\
    \    Account(int);\n    //statements follow here\n};\n\nTrust_Account:: Trust_Account\
    \ (int p) //child : Account (p), //we can further initialize if we want { //statements\
    \ } \n```\n\nThe code demonstrated above simply invokes the `Account()` constructor\
    \ and initializes the `Account (int)` constructor, which has a single integer\
    \ parameter. We pass the integer `p` into the parent class `Account` and initialize.\
    \ Let’s look at more detailed code:\n\nHere is how our parent class will look\
    \ with two constructors: \n```cpp\nclass Account { \n    int balance; //balance\
    \ is a private member, as the default of access //modifier in a class is private\
    \ \n    public: \n        Account() : balance {0} { Std::cout <<“no arguments\
    \ constructor” << std::endl; } \n        Account (int p) : balance {p} { Std::cout\
    \ <<“integer based constructor” << std::endl; } \n}; \n```\nHere is how our child\
    \ class will appear: \n```cpp\nclass Turst_Account: public Account { \n    int\
    \ double_balance; \n    public: \n        //revoking the base class constructor\
    \ \n        Turst_Account() : Account{}, double_balance {0} { Std::cout <<“Derived\
    \ constructor with no arguments” << std::endl; } \n        //initializing the\
    \ derived classes’ own double value attribute \n        Turst_Account (int p)\
    \ : Account{p}, double_balance {p * 0.2} { Std::cout <<“Integer derived constructor”\
    \ << std::endl; } \n}; \n```\n\nYou should also note that not everything is inherited\
    \ automatically. Let’s go over an example and see what a child class does not\
    \ inherit from its parent class:\n\n- Base class constructor and destructor.\n\
    - Base class overloaded assignment operators.\n- Base class friends function.\n\
    \n### Modifying base class methods\n\nAs we have explained, base class members\
    \ are available to the derived class. Also, we showed how a derived class could\
    \ invoke the base classes’ constructors. In this section, we will explain how\
    \ the derived class can invoke, override, or redefine the base class methods.\
    \ In order to do this, we will first need to provide the method name in the derived\
    \ class. The code for doing this should look as follows:\n\nFirst, let ’s look\
    \ at our parent class:\n```cpp\n#include <iostream> \nclass Account { \npublic:\
    \ \n    // This is the original get_ballance() function \n    double get_ballance(double\
    \ amount) { \n        double ballance{ 100 }; \n        ballance += amount; \n\
    \        return ballance; \n    }; \n}; \nclass Trust_Account : public Account\
    \ { \n    //this derived version of get_ballance() redefines the base class method\
    \ \n    double get_balance(double amount) { \n        double ballance{ 500 };\
    \ \n        ballance += amount; \n        amount *= 1.07; //this line invokes\
    \ the call to the base class method \n        return(Account::get_ballance(amount));\
    \ \n    } \n}; \nint main() { \n    Trust_Account test; \n    double result =\
    \ test.get_ballance(1000.0); \n    std::cout <<“result =“ << result << std::endl;\
    \ \n}\n```\n\nAs you can see, we use the same baseline method signature to redefine\
    \ the method in our derived class.\n\nAs you already know, a class can inherit\
    \ from another base class, but in C++, we can also use multiple inheritance. Multiple\
    \ inheritance is when a derived class inherits from two or more classes simultaneously.\
    \ The syntax for multiple inheritance is simple: we state our derived class and\
    \ then simply add the names of the base classes separated by a comma as shown\
    \ below:\n\n```cpp\nclass Child:\npublic Parent_1 , public Parent_2\n{\n    //place\
    \ statements here\n};\n```\n\nMultiple inheritance can be very complex, and we\
    \ recommend that you should try and avoid it while refactoring your code in a\
    \ manner to answer your program needs. If you wish to read more, you can go to\
    \ this link: `https://www.learncpp.com/cpp-tutorial/117-multiple-inheritance/`\n\
    \n### There is a lot more to learn about inheritance, as it is a complex subject.\
    \ You will undoubtedly encounter inheritance in most C++ projects, so we recommend\
    \ you further advance your knowledge in C++. You can find good resources in this\
    \ link: `https://www.geeksforgeeks.org/inheritance-in-c/` as well as in this one:\
    \ `http://www.cplusplus.com/doc/tutorial/inheritance/`\n\nTo sum up this subject,\
    \ please review the code below and follow it. You can try and modify it yourself,\
    \ add another class, and redefine methods. Please note that this code includes\
    \ a getter and a setter function, which we will discuss in detail in a later section.\n\
    \n```cpp\n#include \"pch.h\"\n#include <iostream> \nusing namespace std; // First\
    \ we define an enum which will list all possible military ranks \ntypedef enum\n\
    { \n    General , \n    Admiral , \n    Major , \n    Lieutenant \n} Rank ; //\
    \ We define a generic class named User class \nclass User { \nprivate : \n   \
    \ string m_FirstName; \n    string m_LastName; \n    int m_UserCode; \npublic\
    \ : \n    void SetDetails( string FirstName , string LastName , int UserCode )\
    \ { \n        m_FirstName = FirstName ; \n        m_LastName = LastName ; \n \
    \       m_UserCode = UserCode ; \n    } \n    string GetFirstName() { return m_FirstName;\
    \ } \n    string GetLastName() { return m_LastName; } \n    int GetUserCode()\
    \ { return m_UserCode; } \n}; // Now we derived a new class from User which is\
    \ called Commander class \nclass Commander : public User { \n    Rank m_Rank;\
    \ \n    void PrintRank( Rank rank ); \n    public : \n    void SetRank( Rank rank\
    \ ); \n}; // The following class prints the rank of a given User / Commander \n\
    void Commander ::PrintRank( Rank rank ) \n{\n    // Since enum values are in fact\
    \ numeric, we can use the switch \n    switch ( rank )\n    { \n        case Rank\
    \ :: Admiral : cout <<“Admiral” ; break; \n        case Rank :: General : cout\
    \ <<“General” ; break; \n        case Rank :: Lieutenant : cout <<“Lieutenant”\
    \ ; break; \n        case Rank :: Major : cout <<“Major” ; break; \n        default\
    \ : cout <<“Unknown” ; \n    } \n}\n// This is our setter function which we use\
    \ as we can’t change the value directly\nvoid Commander ::SetRank( Rank rank )\
    \ { \n    m_Rank = rank ; \n    cout <<“Set rank to” ; \n    PrintRank(rank);\
    \ \n    cout << endl; \n}\n\n// Here is our main function where we demonstrate\
    \ how we use the 2 classes\nint main()\n{\n    Commander ourCommander; // we define\
    \ an instance of Commander\n    ourCommander.SetDetails( “John” , “Smith” , 1);\n\
    \    // We set the data in our instance using the setter\n    cout <<“Our soldier\
    \ details are: “ << ourCommander.GetFirstName().c_str() << ““ << ourCommander.GetLastName().c_str()\
    \ << “ ” << ourCommander.GetUserCode() << endl;\n    // We use a setter function\
    \ to change the data. This specific //function also invoke our print function\
    \ so right after setting the //value\n    ourCommander.SetRank( Rank :: Admiral\
    \ ); \n}\n```\n"
