    \ semantics）或移动构造函数（move constructor）登场的地方。移动语义处理 `R` 值，对于 `C++` 初学者来说，这被认为有点高级。这就是为什么我们不会深入探讨这个主题，而是从通俗的角度来解释这个概念。\n\
    \n在移动语义中，`R` 值被用作我们刚才提到的那些临时值的引用。它的作用不是复制对象，而是移动它。用于此类 `R` 值的运算符是双 ampersand `&&`（记住：正如你之前学过的，`L`\
    \ 值使用单 ampersand `&` 声明的）。\n\n让我们回顾一个例子：\n\n```cpp\nint i {50};\nint &L_val =\
    \ i; //这是我们的 L 值引用\nL_val = 4; //我们把 i 改为了 4\nint &&R_val = 10; //这是我们的 R 值引用\n\
    R_val = 140; //我们把 R_val 改为了 140\n```\n\n让我们另一个例子，这次是在名为 `calc_num` 的函数中：\n\n\
    ```cpp\nint i {50};\nvoid calc_num(int &&num);\ncalc_num (30); //calc_num 正在改变\
    \ R 值\n```\n\n但如果我们尝试执行这条语句会发生什么呢？`calc_num(i);`\n\n这将导致编译错误，因为 `i` 是一个 `L` 值，而我们在函数中期望一个\
