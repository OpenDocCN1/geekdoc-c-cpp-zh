    # **Chapter 24: Exception Handling in C++**


    Computer programs in any language are sometimes a source of huge headaches when
    it comes to crashes and issues related to the code, performance, hardware used,
    and much more. As programs become more and more complex, and as a code base can
    contain hundreds of thousands or even millions of code lines, it can become a
    real source for problems, even if we do everything right. It is hard to think
    about every possibility or use case, anything can go wrong for really‘silly’ reasons
    and cause our program to crash. Exception handling can help us handle issues before
    they occur and manage our code-related issues before they cause a crash. Exception
    handling handles extraordinary situations—we catch it and handle it. What is an
    extraordinary situation? Well, it really depends on your application, yet in this
    section, you will get a good understanding of the basic concepts and rules regarding
    the use of exception handling in C++.'
