    ```cpp\n#define PRINT_MULT (a,b) cout << (a)*(b) << endl\n```\n结果将是：`120`\n\n\
    ## 使用函数模板编程 (Programming with function templates)\n\nC++ 提供了各种模板，我们可以将其用于各种目的。模板就像是编译器用于生成特殊函数或类的蓝图。模板使用占位符类型，当我们需要使用它时，接入我们所需的实际类型。编译器将在编译期间知道要使用哪个模板。其他编程语言在运行时执行此操作，但\
    \ C++ 不同。处理模板是称为泛型编程（generic programming）概念的一部分。\n\n简而言之，泛型编程是一种编程风格，算法根据在编译期间（C++）或运行时（其他编程语言）指定的类型编写。模板允许我们以更通用的方式进行编程，针对不同的数据类型和行为使用特定的逻辑或代码逻辑。\n\
    \n这种灵活性对于大型软件项目非常有用，因为它提供了在不同目的之间甚至在不同程序之间复用相同代码的机会。\n\n模板用于 两种用例：\n- 函数模板\n-\
