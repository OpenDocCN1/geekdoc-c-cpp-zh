    ## C++ Unary operators (Increment and Decrement Operators)


    Additional powerful and simple operators in C++ is the increment operator, represented
    by the operators `++` (plus plus), as well as the decrement operator represented
    by the operators `--` (minus minus). These operators make code shorter and cleaner,
    as they increment or decrement by one value, which is stored in a variable. Let’s
    look at how we can use this in code:


    ```cpp

    x = 1; // x is assigned the value of 1

    y = 4; // y is assigned the value of 4

    x++; // x is incremented by 1, the value of x is now 2 (1+1)

    y--; // y is decremented by 1, the value of y is now 3 (4-1)

    ```


    35. There are more operators used in C++. We will explain and demonstrate most
    in this guide. The `sizeof` operator will be demonstrated in the variables section
    of this chapter.


    ## C++ Punctuation


    36. Just like there are rules in written languages whenever you use dots, commas,
    colons, C++ uses specific punctuation rules, some you already encountered in your
    first code (remember the `;` at the end of statements?). Just like your schoolteacher
    scolded you when you didn’t use punctuation marks as you should, the C++ compiler
    will do the same.


    C++ punctuation rules are something we will teach you as you go on working with
    this guide and with a handful of coding exercises (some homework will be helpful
    also). You will learn how and when to use the curled brackets `{}` (also referred
    to as“curlies”), the parenthesis `()`, the square brackets `[]`, the double quotes
    `“ “, the single quotes ‘ ‘` and more. We will introduce you to all the punctuations
    in this guide, and teach you when it is better to use a certain style compared
    to another. Each time we discuss punctuation, we will mark it to make it easy
    for you.


    ### Fear not!


    One of the most common “childhood diseases” all beginner programmers encounter
    is related to the use of punctuation. Don’t worry, you’ll get improve with time
    and lots of practice. Also, as you will see, your IDE will alert and pinpoint
    whenever there is a punctuation problem, and your code will not compile.


    # Chapter 5: Data Types & Variables


    ## Variables and Datatypes


    ### What Are Variables?


    Variables are at the heart of every program. To understand what variables are
    and how to use them, we need to understand how computers work:


    Every computer in the world is constructed from two core components: CPU (Central
    Process Unit) and RAM (Random Access Memory). To further simplify this, every
    computer needs to store information in memory, and needs to access the information
    it stored at some point.


    Here is where variables come into the picture. Variables are an abstraction of
    memory allocation. Instead of calling storage address (memory address), which
    is very long and impossible to remember, C++ allows us to use predefined variable
    names and types in a very abstract way. Each variable captures a specific memory
    size in bytes so you can easily use it in your code.


    Let’s say we want to store an integer (`int`) named `age`, which has a value of
    21 into memory (`int` type size if 4 bytes). This is how our memory address and
    size will appear:


    ![](Images/image00120.jpeg)


    Instead of using this ridiculously long address in your code, and as this address
    might also change during different run times, we can simply declare an `int` variable
    and call it “age.” Obviously, we can call the variable any other name that we
    want, but it must make sense to make it easy for us and others to understand our
    code.


    ### Variable types


    There are various variable types in C++. The table below illustrates different
    variable types in C++ along with their value size in memory:


    | Variable type | Description | Memory size |

    | :--- | :--- | :--- |

    | `Int` | The natural integer size for a machine | 4 bytes |

    | `long` | Using a longer number | 4 bytes |

    | `long long` | Using a longer number | 8 bytes |

    | `char` | Stores a value of a single character - this is an 1 byte integer type
    |

    | `bool` | Stores a value of true or false | 1 byte |

    | `double` | Double precision floating point | 8 bytes |

    | `long` | Using a longer precision floating point number that 12 bytes `double`
    is more precise | |

    | `float` | A single precision floating point value | 4 bytes |

    | `void` | No type and no storage assigned | |


    There are some additional variable types in C++. For additional reading go to
    http://www.cplusplus.com/doc/tutorial/variables/


    ## Coding exercise


    In this coding exercise, we will check the size of different variable types. To
    do this, we will use the `sizeof` operator we introduced in the previous chapter.
    The `sizeof` operator is used to measure the size (in Bytes) of either a type
    or of a variable. Therefore, you can use these two formats:


    `sizeof (variable)`


    For example:


    `int i, j;`


    `j = sizeof(i)`


    Or


    `sizeof(type)`


    For example:


    `sizeof(int)`


    Let’s see some code in action:


    ### First step


    Let’s open a new project and name it “Variables” First, let’s begin by including


    ```cpp

    #include <iostream>

    ```


    Then we add our namespace `std`, so we won’t have to type `std::` each time. `using
    namespace std;`


    ### Second step


    Now we can begin writing our code, which is very simple. We need to define several
    output statements using `cout`. Each output will print the size of the variable
    we are checking.


    ```cpp

    cout << "We will display here the size of several variables in bytes" << endl;

    cout <<“----------------------------------------------------” << endl;

    ```


    So, let’s write some `cout`s with `sizeof` operator – you can copy-paste them
    and just change the type name (or a variable name) each time.


    ```cpp

    cout << "The byte size of the variable char is " << sizeof ( char ) << endl;

    cout << "The byte size of the variable int is " << sizeof ( int ) << endl;

    cout << "The byte size of the variable long is " << sizeof ( long ) << endl;

    cout << "The byte size of the variable long long is " << sizeof ( long long )
    << endl;

    cout <<“The byte size of the variable double is “ << sizeof ( double ) << endl;

    ```


    Let’s run the program. This is what we should expect: ![](Images/image00121.jpeg)


    You can see from your code that each type has a size. The size of each type indicates
    the number of bytes allocated in memory whenever a variable of that type is defined.


    The `sizeof` operator is powerful and often used to better manage memory allocation,
    or when copying a block of data using an address for the variable being copied.


    We would normally want to use the `sizeof` operator so we can allocate, copy,
    read, or write the exact number of bytes that matches the size of the variable
    . This will be further explained in some more advanced chapters in this guide.


    ## Declaring Variables


    How to use variables in your code


    To use a variable in our code, we must declare it first. Variable declaration
    in C++ is constructed in two parts:


    `Variable Type <space> Variable Name`


    1. Declaring the type of the variable (i.e. `int`, `double`, `char`, etc.). **The
    type of the variable is part of the variables list that is part of C++.**

    2. Declaring the name of the variable (i.e. `num1`, `temperature`, `letter`, etc.).


    While the variable type is built-in or predefined, the variable name can be any
    name you like, as long as it follows some rules and best practices. We will go
    over these rules shortly.


    Let’s see some examples of declaring the variable type and some name samples:


    37. `int age; //for example: age is 45.`

    38. `double distance; //for example: distance is 12.3 km.`

    39. `long double pi; //for example: pi value is 3.14159.`

    40. `char letter; //for example: letter is B.`


    Don’t forget! Always use the correct punctuation: Each variable declaration line
    has to end with a semicolon `;`.


    ### Rules for declaring variables


    You can see it is quite simple to declare variables. However, there are certain
    rules of do and don’t you must follow:


    **Don’t:**


    1. You cannot use C++ reserved keywords to name your variables.

    2. You cannot use the same name for different variables in the same code scope.

