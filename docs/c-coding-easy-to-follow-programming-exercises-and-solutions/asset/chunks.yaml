    \ a really cool name” << std::endl;\n```\n\n## C++ 一元运算符（自增与自减运算符）\n\nC++ 中另一个强大且简单的运算符是自增运算符，用\
    \ `++`（加加）运算符表示，以及用 `--`（减减）运算符表示的自减运算符。这些运算符让代码更短更简洁，因为它们会将存储在变量中的值加 1 或减 1。让我们来看看如何在代码中使用它们：\n\
    \n```cpp\nx = 1; // x 被赋值为值 1\ny = 4; // y 被赋值为值 4\nx++; // x 增加 1，x 的值现在是 2 (1+1)\n\
    y--; // y 减小 1，y 的值现在是 3 (4-1)\n```\n\n35. C++ 中还使用了更多运算符。我们将在本指南中解释并演示大部分运算符。`sizeof`\
    \ 运算符将在本章的变量部分进行演示。\n\n## C++ 标点符号\n\n36. 就像书面语言在使用点号、逗号、冒号时有规则一样，C++ 也使用特定的标点符号规则，其中一些你已经在第一个代码中遇到过（记得语句末尾的\
    \ `;` 吗？）。就像你的老师在你没有按规定使用标点符号时责备你一样，C++ 编译器也会做同样的事。\n\nC++ 标点符号规则将在你学习本指南并进行一些编码练习时（做一些作业也会很有帮助）教你。你将学习如何以及何时使用大括号\
    \ `{}`（也称为“大花括号”）、圆括号 `()`、方括号 `[]`、双引号 `“ \"\"`、单引号 `' '` 以及更多。我们将在本指南中向你介绍所有的标点符号，并教你与另一种风格相比，何时使用某种特定风格更好。每当我们讨论标点符号时，我们都会对其进行标记，方便你记忆。\n\
    \n### 不要害怕！\n\n所有初学者程序员遇到的最常见“童病”之一与标点符号的使用。别担心，随着时间的推移和大量的练习，你会进步的。而且，正如你所看到的，每当出现标点符号问题时，你的\
    \ IDE 都会报警并指出位置，而且你的代码将无法编译。\n\n# 第 5 章：数据类型与变量\n\n## 变量与数据类型\n\n### 什么是变量？\n\n\
    变量是每个程序的核心。要理解变量以及如何使用它们，我们需要理解计算机的工作原理：\n\n世界上每台计算机都由两个核心组件组成：CPU（中央处理单元）和 RAM（随机访问存储器）。为了进一步简化，每台计算机都需要在内存中存储信息，并访问它曾经存储的信息。\n\
    \n这就是变量出现的地方。变量是内存分配的抽象。C++ 并不是调用非常长且无法记忆的存储地址（内存地址），而是以一种非常抽象的方式使用预定义的变量名和类型。每个变量捕获特定字节（bytes）的内存大小，以便你在代码中轻松使用它。\n\
    \n假设我们想在内存中存储一个名为 `age` 的整数（`int`），其值为 21（`int` 类型的大小为 4 字节）。这是我们的内存地址和大小的显示方式：\n\
    \n![](img/image00120.jpeg)\n\n与其在代码中使用这个长得荒谱的地址（而且地址在不同的运行期间可能会变化），我们可以简单地声明一个\
    \ `int` 变量并将其命名为“age”。显然，我们可以为变量起任何我们喜欢的名称，但它必须有意义，以便我们和其他人理解我们的代码。\n\n### 变量类型\n\
    \nC++ 中有各种变量类型。下表说明了 C++ 中不同的变量类型及其在内存中的值大小：\n\n| 变量类型 | 描述 | 内存大小 |\n| :--- |\
    \ :--- | :--- |\n| `Int` | 机器自然整数大小 | 4 字节 |\n| `long` | 使用更长的数字 | 4 字节 |\n| `long\
    \ long` | 使用更长的数字 | 8 字节 |\n| `char` | 存储单个字符的值 - 这是一个 1 字节整数类型 |\n| `bool` |\
    \ 存储真或假值 | 1 字节 |\n| `double` | 双精度浮点数 | 8 字节 |\n| `long` | 使用更高精度的浮点数，比 12 字节的\
    \ `double` 更精确 | |\n| `float` | 单精度浮点值 | 4 字节 |\n| `void` | 无类型且未分配存储 | |\n\n\
    C++ 中还有一些额外的变量类型。欲阅读更多信息请访问 http://www.cplusplus.com/doc/tutorial/variables/\n\
    \n## 编码练习\n\n在这个编码练习中，我们将检查不同变量类型的大小。为了实现这一点，我们将使用上一节介绍的 `sizeof` 运算符。`sizeof`\
    \ 运算符用于测量类型或变量的大小（以字节为单位）。因此，你可以使用这两种格式：\n\n`sizeof (variable)`\n\n例如：\n\n`int\
    \ i, j;`\n\n`j = sizeof(i)`\n\n或者\n\n`sizeof(type)`\n\n例如：\n\n`sizeof(int)`\n\n\
    让我们来看看实际运行的代码：\n\n### 第一步\n\n让我们创建一个新项目并将其命名为“Variables”。首先，开始包含\n\n```cpp\n#include\
    \ <iostream>\n```\n\n然后我们添加命名空间 `std`，这样我们就不需要输入类型了。`using namespace std;`###\
    \ 第二步\n\n现在我们可以添加 `cout`。我们将使用 `sizeof` 输出变量的大小。\n\n```cpp\ncout << \"We will\
    \ check the size here\" << endl;\ncout <<“------------------------------------”\
    \ << endl;\n```\n\n所以我们可以开始写 `cout` 语句，使用 `sizeof` \n\n```cpp\ncout << \"The size\
    \ of int is: \" << sizeof(int) << endl;\ncout << \"The size of long is: \" <<\
    \ sizeof(long) << endl;\ncout << \"The size of long long is: \" << sizeof(long\
    \ long) << endl;\ncout << \"The size of char is: \" << sizeof(char) << endl;\n\
    cout << \"The size of bool is: \" << sizeof(bool) << endl;\ncout << \"The size\
    \ of double is: \" << sizeof(double) << endl;\ncout << \"The size of float is:\
    \ \" << sizeof(float) << endl;\n```\n\n运行程序。这是我们预期的：![](img/image0121.jpeg)\n\n\
    你可以从代码中看到每个类型都有大小。当定义该类型的变量时，内存分配的字节数。\n\n`sizeof` 运算符非常强大，通常用于内存分配，或者使用地址拷贝数据块。这将在指南的后续更高级章节中进一步解释。\n\
    \n## 声明变量\n\n如何在代码中使用变量\n\n要在我们的代码中使用变量，我们必须先声明它。C++ 中的变量声明由两部分组成：\n\n`变量类型 变量名`\n\
    \n1. 声明变量类型（例如 `int`、`double`、`char` 等）。**变量类型是 C++ 变量列表的一部分。**\n2. 声明名称（例如 `num1`、`temperature`、`letter`\
    \ 等）。\n\n虽然变量类型是内置或预定义的，但变量名可以是你喜欢的任何名称，只要符合某些规则和最佳实践。我们很快就会讨论这些规则。\n\n让我们来看一些声明变量类型的示例：\n\
    \n37. `int age; // 例如：age 为 45.`\n38. `double distance; // 例如：distance 为 12.3\
    \ km.`\n39. `long double pi; // 例如：pi 值为 3.14159.`\n40. `char letter; // 例如：letter\
    \ 为 B.`\n\n不要忘记！始终使用正确的标点符号：每个变量声明行必须以分号 `;` 结束。\n\n### 变量声明的规则\n\n你可以看到声明变量非常简单。但是，你必须遵循某些遵守规则：\n\
    \n**不要：**\n\n1. 你不能使用 C++ 保留关键字来命名变量。\n2. 你不能在同一个代码作用域内为不同的变量使用相同的名称。\n\n"
