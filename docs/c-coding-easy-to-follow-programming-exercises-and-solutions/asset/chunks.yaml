  raw: 'When working with large code and complex programs, it is the best and most
    common practice to separate the function declaration and implementation. Keep
    that in mind and practice working with both files, but beware of duplication declarations
    and implementation, as this can be very confusing and cause compilation errors.
    There is a cure for this potential problem: the #include guard. You already became
    familiar with this guard when you included .h files, which are part of the C++
    internal library. Using the #include guard will guaranty that the file you wish
    to use will only be used once.


    Let’s take a look at more complex code. In this code, we create a class named
    database.


    #include <iostream> #include <string> #include <vector> using namespace std; //First
    we will define a structure for holding the data we wish to store


    //To simplify our program, we will only store the student name and student ID
    . //At the end of this code you can find some more information about it .


    typedef struct


    {


    string name; // the name of the student


    int id; // the id of the student


    } db ; // the name of our new struct ‘db’


    // Next we will define a prototype for our new class, that part along with the
    // typedef struct should both go


    // to our .h file, so other source files can use it


    class database


    {


    public : // This is the public part of the class. The public part is accessible
    // from outside the scope of the class


    // add - a function for adding new data to our database


    void add( string name , int ID );


    // findByID - a function for finding a student if we not his/her ID string findByID(
    int ID ); private : vector < db > Db; // here is the variable which is a vector
    of ‘db’ // (the structure we have defined earlier) };


    // Our add function - here we create a single item of the type‘db’ and fill it
    // with data, then add it to our vector


    void database ::add( string name , int ID ) { db SingleItem; SingleItem.name =
    name ; SingleItem.id = ID ; Db.push_back(SingleItem); }


    // This function goes over the entire vector and when the ID of the current


    // item matches the ID entered as a parameter it returns the ‘name’ field. string
    database ::findByID( int ID ) { int i; for (i = 0; i < Db.size(); i++) { if (Db
    [ i ] .id == ID ) { return Db [ i ] .name; } } return“not found” ; } int main()
    { database myDB; myDB.add( “student 1” , 1); // add data to our database myDB.add(
    “student 2” , 2); myDB.add( “student 3” , 3); myDB.add( “student 4” , 4); // search
    for a student with ID 4


    cout <<“looking for student with ID “ << 4 <<“ result:“ << myDB.findByID(4) <<
    endl;


    }


    In this code, we used something new: typedef struct. When you want to use a new
    data type that is based on several elements, you use: *Typedef struct*


    This will define struct as a datatype, so that you can later use the same as the
    built-in data types, such as int or char.


    For example, if you want a data type for storing information about a book, you
    will define it as such:


    **typedef struct


    {


    string author;


    string title;


    int pages;


    int year_of_publishing;


    } book ;**


    Then you can use a new type that you have created as long as you use it from a
    source file that has a reference to this definition. So, if you placed it in books.h,
    you must include books.h whenever you wish to refer to the book data type.


    book mybook;


    mybook.author =“James Jones” ;


    mybook.pages = 134;


    mybook.title =“Success Stories” ;


    mybook.year_of_publishing = 2001;


    ## 15.3 - Constructors and Destructors


    Constructors and destructors are special member methods in a class. Each time
    a new entity of our class is defined, we can have a special function to be executed.
    Such a function can initialize our class. For example, if the class has a private
    variable, it can be initialized to the value in which we want it to have when
    we start. If this variable is used to calculate a sum, we will initialize it to
    0\. Constructors will always have the same name as the class, and they are very
    useful when initialization is required. Also, constructors do not require any
    return type, and they can be overloaded (which we will explain shortly).


    Let’s see an example for a constructor:


    **class Manage_Account


    {


    private:


    double balance;


    public:


    //overload contractors (see more info later)


    Manage_Account(); //constructor with no arguments


    Manage_Account(std::string name, double deposit);


    //expects 2 arguments


    Manage_Account(double balance);


    //expects 1 argument


    );**


    We will demonstrate and explain more about constructors, so don’t worry if you
    feel like you don’t understand much at this point.


    **Destructors**


    Just before the program goes out of the scope of a class, another special function
    can be called, the Destructor. Destructors are also member methods in our class,
    and they have the same name as the class, except that the name will start with
    a tilde ~. Destructors can be used to free up memory, save data to a file or a
    database, or anything else you wish to be executed upon exiting the class . They
    invoke automatically once an object is destroyed. Same as constructors, they do
    not require any return type, but pay attention: they cannot be overloaded, and
    only one destructor is allowed per class!


    Let ’s see how a destructor will look in our class: **class Manage_Account { private:
    double balance; public: //overload contractors Manage_Account(); //constructor
    with no arguments Manage_Account(std::string name, double deposit);**


    **//expect 2 arguments Manage_Account(double balance); //expect 1 argument //destructor
    ~ Manage_Account(); );**


    Let’s look at another example . In this case, let’s assume that we have functions
    to read and write data in memory to and from the storage (either a database or
    a file). We can use the constructor and destructor in doing so, which will give
    us peace of mind that whenever our class is defined or used for the first time,
    data will be loaded from storage. Furthermore, all data will be saved before ending
    the use of the class:


    **database ::database()


    {


    load_data_from_storage();


    }


    database ::~database()


    {


    save_data_to_storage();


    } ;**


    As you can see, defining constructors and destructors is simple, but we still
    need to understand how and when they should be called. The first thing you need
    to know is that if you don’t provide any constructors or a destructor, C++ will
    automatically create them for you as default—these will be empty constructors
    and destructors. C++ must construct objects even if you don’t provide your own
    constructor; therefore, the default constructor has no arguments. The object that
    is created will be created on the stack, but if we create a pointer to an object,
    it will be created on the heap. Remember that as there are no arguments passed
    into the object with the default constructor, we might find some garbage data
    there. Having said that, when we provide our own constructors, it is best practice
    to provide a no-args (no argument) constructor ourselves. For example, if we use
    our account class, we can decide that when a new object is created with no initialization,
    the default will be that name, which will be“NA” and balance will be 0.0:


    **class Manage_Account { private: double balance; public: //overload contractors
    Manage_Account(); //constructor with no arguments { name =“NA”; balance = 0.0;
    } bool deposit(double); bool withdraw(double);**


    **);** But if we decide not to use the default constructor, it can look like this:
    **class Manage_Account { private: double balance; //constructor with arguments
    Manage_Account(std::string client_name, double client_balance); { name = client_name;
    balance = client_balance; } bool deposit(double); bool withdraw(double); );**


    We mentioned earlier that constructors can be overloaded and that a class can
    have as many constructors as needed, but they must be different from one another
    and not duplicates.


    Let’s see a class in a program that sends tests to students and saves the results
    of the tests.'
