    int price4 {40};\n```\n\nInstead of writing a list, we can simply write: `int\
    \ price [4] {10, 20, 30, 40};`\n\n`Variable_type array_name [array size]`\n\n\
    Note that in an array, we use square brackets `[ ]`.\n\nWe mentioned that when\
    \ using an array, we can still access every single element directly. We do this\
    \ by using the index position of the element. The first element will always be\
    \ `#0`, so the second will be `#1`. The last element will always be `size-1`.\
    \ If the size of the array is 100, the position of the last element will be `#99`.\n\
    \nLet’s see an example of how to use arrays:\n\nWe have a variable type `char`,\
    \ and there is a list of 5 characters. This conveys how simple it is to use an\
