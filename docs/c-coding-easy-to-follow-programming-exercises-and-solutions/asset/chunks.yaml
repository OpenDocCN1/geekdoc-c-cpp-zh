    \n```cpp\nchar name [] {'A', 'L', 'E', 'X', 'A', 'N', 'D', 'E', 'R'};\nfor (char\
    \ Letter : name)\ncout << Letter << endl;\n```\nWhen we run the code, we get the\
    \ same result as before:\n\nImages/image0012.jpeg\n\nModern C++ offers us another\
    \ way to simplify our code, and that’s by using the `auto` keyword. The `auto`\
    \ keyword allows us to skip the need to explicitly provide the type. Let’s use\
    \ it in our code:\n\n```cpp\nchar name [] {'A', 'L', 'E', 'X', 'A', 'N', 'D',\
    \ 'E', 'R'};\nfor (auto Letter : name)\ncout << Letter << endl;\n```\n\n## Chapter\
    \ 10: Switch Case Statements\n\nThe Switch Case statement allows you to set several\
    \ values for your variable to test. We call each value a case. Each time a value\
    \ is checked, moving on to the next is called `switch`.\n\nThe syntax used for\
    \ switch cases is simple:\n\n```cpp\nswitch (expression)\n{\ncase expression 1\
    \ : statement 1; break;\ncase expression 2 : statement 2; break;\ncase expression\
    \ 3 : statement 3; break;\n. . .\ndefault: statement_default;\n}\n```\n\nLet’s\
    \ see an example. In this example, the user can make one selection of a number\
    \ out of 4.\n\n```cpp\nint main()\n{\n    int selection {};\n    cout <<“please\
