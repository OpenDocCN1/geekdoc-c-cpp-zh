    \ `shared_ptr` 指针活跃地指向该对象。此此最佳方法是使用 `use_count()` 方法。让我们来看看方法的基础，它返回管理堆对象的 `shared_ptr`\
    \ 数量：\n\n```cpp\nstd::shared_ptr <int> p1 {new int {30}}; std::cout << p1.use_count()\
    \ << std::endl; //count 1\nstd::shared_ptr <int> p2 {p1}; std::cout << p1.use_count()\
    \ << std::endl; //count 2\np1.reset(); //decrements the count by 1 as it sets\
    \ //the p1 to nullptr std::cout << p1.use_count() << std::endl; //count 0 std::cout\
    \ << p2.use_count() << std::endl; //count 1\np2.reset(); std::cout << p2.use_count()\
    \ << std::endl; //count 0\n```\n\n如你所见，当我们把 `p1` 置空时，计数减了 1，但作为共享指针的 `p2` 仍然指向同一个对象\
    \ `p1` 所指向的对象。只有当我们对 `p2` 使用 `reset` 方法（`p2.reset()`）后，计数器才会设置为 0，对象会被析构，因为两个共享指针都离开了作用范围，不再需要使用该堆对象。\n\
    \n在处理 `vector` 时，`shared_ptr` 既可以使用拷贝赋值也可以被移动。因此，在这种情况下，以下代码可以运行：\n\n```cpp\n\
    { std::vector < std::shared_ptr <int> > vec; std::shared_ptr <int> p; vec.push_back\
    \ (p); //will work }\n```\n\n## 弱指针 (Weak Pointers)\n\n弱指针被称为 `weak_ptr`，它们总是从共享指针创建。然而，与\
    \ `shared_ptr` 不同，它们与所指向的对象没有任何所有者关系，并且对对象的生命周期没有影响（换句话说，它们不参与像 `shared_ptr` 那样的计数活动）。这听起来奇怪吗？让我们解释一下：弱指针用于我们防止任何强引用循环的情况，这可能会影响对象的删除。这就像是你拷贝了共享指针实体，但作为一个非所有权的引用或弱引用位置。\n\
    \n为了使用弱指针，我们使用以下代码：\n\n```cpp\n{ std::shared_ptr<int> p_shared = std::make_shared<int>(100);\
    \ std::weak_ptr<int> p_weak1(p_shared); std::weak_ptr<int> p_weak2(p_weak1); }\n\
    ```\n\n在这个示例中，`p_weak1` 和 `p_weak2` 指向由 `p_shared` 拥有的数据，但引用计数不会增长。\n\n"
