    **Exercise sample


    Shift vector elements in the opposite direction**


    In this code puzzle, we have to rotate the items of a vector so that the first
    item will be the last, and the second will be the one before last. For example,
    if we have a vector with the values of:


    **3, 8, 9, 7, 6**


    You will need to flip the order of the vector elements so it will display the
    following:


    **6, 7, 9, 8, 3**


    There are several ways to solve this problem, and the method demonstrated below
    is the most efficient in terms of time and resources.


    The following code shifts the contents of a given set of numbers passed to our
    function as a vector. Next, we shift every item to the right, and the last item
    (most right), which can’t move any further to the right, is placed to the most
    left position. Such movement is called“shifting” and is used for many purposes,
    such as scrambling data for statistical purposes.


    Let’s go over some of the functions in the code:


    shift_once() makes a single shift.


    print_vector() prints the contents of the vector at the current state of it. As
    explained earlier, it is always useful to have your own“print” function for debugging
    testing purposes.


    The shift_all() function makes K shifts, while K is a parameter provided to the
    function along with the vector.


    The main function just calls shift_all() given a pre-defined vector and a value
    “K”


    #include "pch.h"


    #include <iostream>


    #include <vector>


    using namespace std;


    // The print_vector function shows the current state of the vector


    // It is advised to have such function handy in almost any work or exercise


    // doing so will enable you to print how the vector looks at any point of time


    void print_vector( vector < int > v )


    {


    int len = v .size();


    for ( int i = 0; i < len; i++)


    {


    cout << i << “ = “ << v [ i ] << endl;


    }


    } // This function is the building block of the project // In this function we
    shift the vector once // then we can call this function several times to shift
    the vector several // times void shift_once( vector < int > & v ) { int len =
    v .size(); int temp = v [ len - 1 ] ; // To shift the vector we start with one
    item before the last one. // We set the one before last item to be equal to the
    last one (after // storing the original last item in‘temp’. // Then we proceed
    going backward and setting each item to the value of // the item in the index
    that follow. for ( int i = len - 1; i > 0; i--) { v [ i ] = v [ i - 1 ] ; } //
    Finally we set the first item to the original last value which we // stored in
    the‘temp’ argument v [ 0 ] = temp; print_vector( v ); } // This function shifts
    the vector K times by calling // the shift_once function vector < int > shift_all(
    vector < int > & A , int K ) { vector < int > result; cout <<“Original vector:\n”
    ; print_vector( A ); for ( int i = 0; i < K ; i++) { cout <<“Shifted vector:\n”
    ; shift_once( A );


    } return A ; } // This is the main function of the project int main() { vector
    < int >v{ 3, 8, 9, 7, 6 }; vector < int > shifted; shifted = shift_all(v, 3);
    cout <<“Solution vector:\n” ; print_vector(shifted); }


    When we compile this code and run our program, we see the process of shifting
    numbers at each stage of the loop (thanks to our “print” function): ![](Images/image00169.jpeg)


