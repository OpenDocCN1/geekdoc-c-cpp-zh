    all conditions must be true. In the second case, only one condition must be true.


    We will dive deeper into logical operators and how to use them as a powerful part
    of our code, but let’s see a fundamental example of how && and || conditions appear:


    **(i == 4) && (a < 6) // Is i equal to 4 AND is a smaller than 6? (i == 4) ||
    (a < 6) // Is i equal to 4 OR is a smaller than 6?** Important to know


    In many cases, C++ sets a hierarchy, which means some operations are a higher
    priority than others. The hierarchy in logical conditions are always set from
    left to right. This means that when we use the && (AND) operator, if the condition
    (i = = 4) on the left is false, then the program will not go further to check
    if the right-hand side condition is true, as BOTH must be true. In case of the
    || (OR) condition, if the left-hand side (i == 4) is false, then the program will
    check the right-hand side condition (a < 6) to see if it is true or false.


    **The ? : Conditional Operator**


    As we already explained in the first section of this guide, modern C++ always
    tries to simplify code and use more abstract expressions. The ? conditional operator
    is a great example of how easy code can be in order to perform more complex functions.


    We just learned how to use && and || conditions, and the ?: operator makes our
    life even simpler.


    The expression we will use in this case is: **Condition? Result1 : Result2** If
    the condition is true, then Result 1 will be executed. If the condition is not
    true (false), then Result 2 will be executed. As you can see, this is really simple.


    Let ’s look at another example. Let’s say we want to write a program that provides
    a discount for adults ages 18 and above. In this case, we will ask our user to
    type his/her age, and the program can instantly determine if they are an adult
    or not. We will use the conditional “?” and“:” operators in this manner:


    “ ?” – value in case the condition is true. “:” – value in case the condition
    is untrue. Adult = (Age > 18) ? true : false ; This is the same as writing the
    following: Adult = (Age > 18); C++ Bitwise Operators


    C++ uses bitwise operators to modify variables according to their bit-level. This
    means that the operation is first converted into bits and then performed on the
    operands. The purpose of this is the fast execution of operations. At this point,
    you don’t need to have an in-depth understanding of this, but you now basically
    know when and where to use these operators on your code. We already used the chevron
    operators << and >> in our code with cin and cout, so it’s not hard to become
    familiar with Bitwise operators, as it simply means that the data is extracted
    and stored somewhere. Here is another example:


    std::cout << "what is the name of your dog" << std::endl; std::cin >> name >>
