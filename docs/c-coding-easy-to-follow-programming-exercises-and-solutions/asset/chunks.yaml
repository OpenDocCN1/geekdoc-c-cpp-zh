  trans: "\n\n# 虚函数\n\n我们提到了虚函数，但它们究竟是什么？我们知道普通函数和方法的作用，但区别在于，虚函数允许我们在运行时将方法重写到子类中。让我们假设我们有两个类：`class\
    \ A` 和 `class B`，`class B` 继承自 `A`。如果我们在 `class A` 中创建一个方法并将其标记为 `virtual`，那么我们就有选项在\
    \ `B` 类中对其进行重写，并用它来执行不同的操作，同时跳过静态默认绑定。这看起来可能很困惑，事实上，这确实是一个比较难掌握的主题。我们将一步步地引导你，解释基本概念和语法，以便你在编程时充满信心。\n\
    \n实际上，我们在之前的几个章节中已经用过编译时多态了：当我们重载运算符时，以及当我们重载函数时。当我们谈论运行时多态时，我们讨论的是函数重写。它也被称为`动态多态`，换句话说：`虚函数`。\n\
    \n因此，在派生类中，我们可以重新定义基类函数的工作方式，并且是动态完成的。这就是虚函数的基本概念——被重写的函数是一个虚函数，它是基类函数的特殊版本。下面是我们用于声明函数为虚函数的语法。这段代码片段来自基类：\n\
    \n```cpp\nclass Account { public: virtual void deposit (double amount); //statements\
    \ };\n```\n\n让我们看看如何在派生类中重写基类函数：\n\n```cpp\nclass Trust_Account : public Account\
    \ { public: virtual void deposit (double amount);\n// 在这种情况下我们不需要使用 virtual 关键字，但这样做是最佳实践\n\
    语句可以写在这里\n};\n```\n\n重要提示：要重写一个函数，函数的签名和返回类型必须与基类匹配，否则编译器将对其进行静态绑定。让我们来看一个代码示例。当我们运行下面的代码时，并没有发生动态绑定。让我们通过这段代码来更好地理解它：\n\
    \n```cpp\n#include \"pch.h\" \n#include <iostream> \n// 以下是 Account 类层次结构 \nclass\
    \ Account { \n    public : \n    void deposit( double amount ) { \n        std::cout\
    \ <<“In Account::deposit” << std::endl; \n    } \n}; \nclass Trust_Account : public\
    \ Account { \n    public : \n    void deposit( double amount ) { \n        std::cout\
    \ <<“In Trust_Account::deposit” << std::endl; \n    } \n}; \nclass Student_Account\
    \ : public Account { \n    public : \n    void deposit( double amount ) { \n \
    \       std::cout <<“In Student_Account::deposit” << std::endl; \n    } \n};\n\
    class \nAccount\n\n\n\n\n            \n     { { { { \n \n:: << << << << << for::\
    \ account” << std::endl;\n    } \n};\nclass Savings_Account : public Account {\n\
    \    public : \n    void deposit( double amount ) {\n        std::cout <<“In Savings::deposit”\
    \ << std::endl;\n    } \n}; \nint main() { \n    std::cout <<“Pointers pointing\
    \ to account type“ << std::endl;\n    std::cout <<“=============================\
    \ << std::endl;\n    Account *p1 = new Account (); \n    Account *p2 = new Trust_Account\
    \ (); \n    Account *p3 = new Student_Account (); \n    Account *p4 = new Savings_Account\
    \ ();\n    std::cout <<“Calling our deposit method for each account” << std::endl;\n\
    \    std::cout <<“=======================================“ << std::endl;\n   \
    \ p1->deposit(0); \n    p2->deposit(0); \n    p3->deposit(0); \n    p4->deposit(0);\n\
    \    std::cout <<“Delete the pointers ” << std::endl; \n    std::cout <<“=======================================”\
    \ << std::endl;\n    delete p1; delete p2; delete p3; delete p4; \n    return\
    \ 0;\n}\n```这就是当我们执行时得到的结果：我们可以看到所有的 `deposit` 方法目前都静态绑定到了基类。\n\n## 我们是如何将这段代码转换为多态的？\n\
    \n首先，我们需要看到想要动态绑定的方法。你能猜到是（哪些）吗？在这段代码中，只有一个方法需要转换为虚函数：`deposit` 函数。我们只需要在函数开头添加\
    \ `virtual` 关键字：\n\n```cpp\nvirtual void deposit( double amount )\n```\n\n此外此外，正如我们之前提到的，最佳实践是在派生类的所有方法中添加\
    \ `virtual` 关键字。现在让我们运行代码看看会发生什么。这是程序运行时显示的输出：\n\n## 虚析构函数\n\n当使用多态时，我们可能会遇到与销毁对象相关的编译器警告。事实上，当你运行之前的代码时，你可以看到这些警告。为什么会发生这种情况？因为当派生类通过非虚基类指针销毁对象时，这种行为是不符合\
    \ C++ 标准的并会导致内存泄漏。使用`析构函数`可以帮助我们使用正确的析构函数来正确销毁对象。这非常简单。如果你的类使用了虚函数，你必须使用虚析构函数，如下所示：\n\
    \n```cpp\nclass Account\n{\npublic :\n    virtual void deposit( double amount\
    \ );\n    virtual ~Account();\n};\n```\n\n看到语法非常简单，我们在析构函数之前添加 `virtual`。\n\n\
    ## 纯虚函数\n\n在深入纯虚函数之前，让我们了解另一个术语：`抽象类`。抽象类也称为抽象基类，在继承体系中用作基类，且不能实例化（创建类对象）。到目前为止，我们使用的是可以实例化的类，它们被称为`具体类`。正如你已经看到的，它被用于定义一种可以在程序栈上作为自动变量实例化的有用对象。准确地说，抽象类被用作父类，派生自它的类可以是`具体类`。例如，当我们使用\
    \ `Account` 类和派生类时，我们可以说不存在“仅仅是一个账户”这种东西——如果客户想开账户，他们将需要选择他们账户类型，因为“Account”这个通用术语太抽象了。重要重要的是，抽象类必须包含至少一个纯虚函数——这让我们回到了本节的主题。\n\
    \n什么是纯虚函数，它看起来是什么样的？首先，它用于使类变为抽象，并在声明中使用 `= 0` 声明：\n\n```cpp\nvirtual void function()\
    \ = 0;\n```\n\n通常，我们不会为纯虚函数添加任何实现，因为这通常会在派生类中添加。这意味着派生类必须重写基类——否则，派生类也将成为抽象类。\n\
    \n那么，我们什么时候使用抽象类呢？当我们不需要在基类中使用任何函数实现时，使用它们最好。这一切看起来可能很困惑，但这样想：你还记得继承部分的泛化图吗？就是你不能在银行开一个通用账户，只能开特定的账户，例如活期账户、信托账户或储蓄账户。通用基账户类是抽象的，将没有纯虚函数的实现，因为这个账户只是一个具有所有派生类共性的骨架，而不是真正的账户类型。让我们看另一个例子。假设我们有一个名为\
    \ `Shape` 的类。`Shape` 是一个通用术语，可以描述圆、三角形或正方形。因此，`Shape` 是一个完美的抽象类，`Shape` 的属性必须与它的所有派生类具有共同的共性。\n\
    \n同样重要的是，在处理抽象类时，我们不能创建抽象类对象或在堆上分配新内存：\n\n```cpp\nAccount account; // 编译错误\nAccount\
    \ *ptr = new Account (); // 编译错误\n```\n\n然而，我们可以在派生具体类内部使用指针和引用来实现态：\n\n```cpp\n\
    Account *ptr = new Saving_Account(); // 正常，无编译错误\nptr->deposit(); // 正常，无编译错误\n\
    ```\n\n"
