    让我们回顾另一个示例。在这个示例中，我们要求用户输入密码。密码是 123789。如果用户未能输入正确的密码，它将再次询问他们，总共 5 次。如果第 5 次尝试失败，用户将收到提示。\n\
    \n在继续之前，让我们介绍另一个函数 - `strcmp()`。为什么我们不能直接对字符串（字符数组）使用 `==` 运算符呢？让我们假设我们有两个字符数组：\n\
    \n```cpp\nchar password_entered[] {\"12345\"};\n\nchar real_password[] {\"abcde\"\
    };\n```\n\n然后我们尝试使用以下条件：\n\n```cpp\npassword_entered == real_password\n```\n\n\
    `==` 比较的问题在于，它比较的是字符数组的地址而不是实际的字符串。对于这种比较，我们使用 `strcmp()`。它接收 2 个参数（2 个字符串），如果它们完全相同，它返回\
    \ 0（或 false）。\n\n函数调的形式将如下：`If(strcmp(password_entered, real_password) == false)`。让我们看看我们的代码，它稍微复杂一点：\n\
    \n```cpp\n#include <iostream> \nusing namespace std; \nint main() { \n    cout\
    \ <<“Enter your password” << endl;\n    bool correct_password = false ; \n   \
    \ int tries{ 0 }; \n    char real_password[]{ “abcde” }; \n    char entered_password[6]{\
    \ ““ }; \n    while (!correct_password && tries<5) { \n        cin >> entered_password;\
    \ \n        if (strcmp(entered_password , real_password) == 0) // 0 意味着\n//相同\
    \ { \n            correct_password = true ; \n            break ; \n        }\
    \ else { \n            tries++;\n            cout <<“Wrong password. You have\
    \ “ << 5 - tries << “ more tries” << endl;\n        } \n    } \n    if (correct_password)\
    \ { \n        cout <<“correct password” << endl; \n    } else { \n        cout\
    \ <<“too many attempts” << endl; \n    } \n}\n```\n让我们这段代码拆解成小部分：\n\n- 我们使用 `tries`\
    \ 来计算输入错误密码的次数，因此出于安全考虑，我们将此类尝试限制在 5 次。\n- 我们使用一个名为 `correct_password` 的布尔变量来指示是否输入了正确的密码。这样做时，我们将该变量初始化为\
    \ `false`，除非另有设置，否则我们假设没有输入正确的密码。将其初始化为“false”可以防止错误，除非我们成功，否则它的值将为“false”。\n\
    - 只有在输入正确的密码后，我们才将 `correct_password` 的值改为“true”，并跳循环。\n- 每次尝试后，我们增加 `tries`，如果它达到\
    \ 5，我们就跳出循环。在循环外部，有两种情况：\n  1. 用户使用了所有允许的尝试但没有输入正确密码；在这种情况下，`correct_password`\
    \ 将为 false。\n  2. 输入了正确的密码，在这种情况下，`correct_password` 为 true。\n\n尝试再次检查代码以更好地理解它。然后你可以尝试修改它并创建你自己的\
    \ `while` 循环版本。\n\n试一试！编写一个带有 `while` 循环的程序，从 100 倒数到 0，然后显示消息“Bang!”然后尝试使用 `if`\
    \ 语句仅倒数奇数。\n\n### 更好地控制循环的流\n\n在继续到其他循环类型之前，了解 `continue` 和 `break` 语句以及它们在保持\
    \ C++ 循环流和行为方面的作用是非常重要的。这两个语句在所有循环结构中的工作方式都相同。\n\n当我们使用 `break` 语句时，循环停止执行任何语句，循环将终止。循环之后的下一个语句将被执行。\n\
    \n当使用 `continue` 语句时，循环将停止执行循环体内的后续语句，控制流回到循环开头。\n\n我们将在示例中演示如何在循环中使用 `break`\
    \ 和 `continue` 语句。\n\n## 9.2 - Do-while 循环\n\n`do-while` 循环与 `while` 循环相似，但例外是：它是后测试循环。这意味着无论条件真假，循环至少执行一次。\n\
    \n*Do-while* 循环使用以下语法：\n\n```cpp\nDo\n{\n    Statements;\n}\nWhile (condition);\n\
    ```\n\n让我们回顾一个示例。在这个示例中，我们要求用户输入圆半径，然后计算圆面积。我们想至少执行一次计算。然后我们询问用户是否想进行额外的计算。如果答案是\
    \ YES，我们就再次循环；如果答案是 NO，循环终止。让我们看看它有多简单。\n\n为了这段代码，我们包含了 `math.h` 库。\n\n```cpp\n\
    #include <iostream>\n#include <math.h>\nusing namespace std;\nint main()\n{\n\
    \    char choice{}; // 用户选择是否继续\n//计算或否\n    do { \n        double circle_radius{};\
    \ \n        cout <<“Please enter the circle radius” << endl;\n        cin >> circle_radius;\
    \ \n        double circle_area{ 3.14 * circle_radius * circle_radius }; \n   \
    \     cout <<“The circle area is “ << circle_area << endl;\n        cout <<“Do\
    \ you want to make an additional calculation? (Y / N)” << endl;\n        cin >>\
    \ choice; \n    } while (choice == ‘y’ || choice ==‘Y’); // 只要\n//选择是 Y 或 y 循环就会再次运行。\
    \ cout << “Goodbye” << endl; \n```\n\n这段代码非常简单。注意，在要求用户输入内容时，提供大和小写选项始终是一个良好的习惯。让我们更好地理解这段代码：现在让我们写另一个在\
    \ `dowhile` 循环内部使用 if/else 语句的程序。\n\n"
