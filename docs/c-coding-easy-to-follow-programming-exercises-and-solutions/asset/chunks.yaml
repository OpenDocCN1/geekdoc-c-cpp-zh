    \    return 0; \n}\n```\n\n当我们运行这段代码时，结果将是：\n\n![](img/image00192.jpeg)\n\n注意，如果没有指定启动策略，默认值将类似于：`std::launch::async`\
    \ 或 `std::launch::deferred`。\n\n## C++ mutex 对象\n\n在 C++ 中使用线程时，熟悉互斥锁（mutex）对象和\
    \ C++11 引入的 `<mutex>` 标准类非常重要。`mutex` 是一个可锁对象。当代码的关键区域需要独占访问时，它会发出信号。通过这样做，它可以防止任何其他具有相同保护的线程在访问与其他线程相同的内存位置时并发执行。例如，在计算机程序的早期，\
    \ 80 年代和 90 年代的某处，人们会双击一个程序并运行它，然后在程序运行时，再次双击它会使它与已经在运行的程序并行再次运行。你可以反复并行运行同一个程序，这导致了许多崩溃和问题。`mutex`\
    \ 是解决该问题的良药，而这只是互斥锁时代之前许多问题中的一个。\n\n让我们来看使用 mutex 防止程序同时运行多次的示例：\n\n```cpp\n//\
    \ Mutex.cpp : 此文件包含 'main' 函数。程序执行从这里开始 \n// 并在此结束。\n#include <iostream>\n#include\
    \ <Windows.h> \n#include <mutex> \nusing namespace std; \nint main() { \n    HANDLE\
    \ myMutex;\n    myMutex = CreateMutex(NULL, TRUE, L”RunOnceProgram” ); \n    if\
    \ (GetLastError() == ERROR_ALREADY_EXISTS) { \n        cout <<“Don’t run this\
    \ program more than once\\n” ; \n        exit(0); \n    } \n    // 我们可以继续了\n \
    \   cout <<“Running our program\\n” ; \n}\n```\n\n事实上，在使用线程时注意细节非常重要，因为在读取和/或写入共享内存和资源时必须谨慎使用，因为它们可能会导致竞态条件。例如，如果我们从一个账户转账到另一个账户，我们需要在转账完成后才能提款。换句话说，我们可能会遇到操作\
    \ X 的结果取决于操作 Y 的情况。同样也适用于死锁的情况。死锁是指由至少两个线程组成的集合中，每个线程都在等待资源（共享数据也被视为资源），而该资源正被集合中的另一个线程锁定。结果是集合中的每个线程都在无限期等待资源释放。\n\
    \n防止这种情况的最好方法之一是使用 `lock_guard`。\n\n```cpp\n#include \"pch.h\"\n#include <thread>\n\
