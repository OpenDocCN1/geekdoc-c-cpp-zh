    # **Chapter 13: Functions**


    In this lesson, we will expand our program so that it will be split into different
    functions. Doing so simplifies the code, as each function takes care of a different
    part, and the main program makes use of the functions to perform the necessary
    work from one centralized point.


    Functions will always play a big role in your code, and there are hardly any programs
    that don’t have functions. So, the big question is: what are functions?


    In order to understand what functions are, imagine that you are a manager in a
    big firm with lots of departments and employees. You run 6 departments, and you
    need to write a report to your boss about the work that has been done in every
    department. What do you do? You ask your 6 department heads to write a report
    for you, then you sum up the 6 reports into a single report you send to your boss.
    The 6 department heads may ask some of their junior staff to write a report that
    they will use in order to form their own report—how they do it, who they ask,
    how they ask—you don’t care—as long as they deliver. Yes, that’s right, you don’t
    really need to care about how the function works internally, as long as it does.
    As the boss, you don’t really need to know how your employees do their job to
    the very specifics—as long as they do it and deliver. You might say that functions
    are sort of a black box, no need to know what’s inside. This is called information
    hiding—and we will talk about this a bit more later on.


    ## Function Basics


    What is a function?


