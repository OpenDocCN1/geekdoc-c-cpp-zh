  trans: "\n然后，当第一次处理此文件时，该字符串尚未定义，因此头文件的所有内容都会被处理。此外，我们定义了这个字符串。下次，由于字符串已经定义，头文件将不会再次被处理。\n\
    \n最佳实践是在字符串名称的开头使用下划线，并仅使用大写字母，以另一个下划线、大字母 H 和下划线结尾，如下例所示：\n\n```cpp\n#ifndef\
    \ _NAME_H #define _NAME_H <contents of header file> #endif\n```\n\n让我们来看另一个例子。在这个例子中，我们将为银行账户管理程序创建一个简单的类。\n\
    \n```cpp\n#include \"pch.h\"\n#include <iostream>\n#include <vector>\nusing namespace\
    \ std;\nclass Manage_Account {\n    //attributes\n    string name; // 客户名称\n \
    \   int UID; // 每个客户的唯一标识\n    int DOB; // 出生日期\n    double balance; // 账户余额\n\
    \    // methods\n    public :\n        bool is_overdrawn( double ); //账户是否透支\n\
    \        void deposit( double ); // 是否存款\n        void withdraw( double ); //\
    \ 是否取款\n};\nbool Manage_Account ::is_overdrawn( double balance ) {\n    return\
    \ (balance < 0);\n}\nvoid Manage_Account ::deposit( double amount ) {\n    cout\
    \ <<“The amount of $” << amount <<“ has been deposited” << endl;\n    return ;\n\
    }\nvoid Manage_Account ::withdraw( double amount ) {\n    cout <<“The amount of\
    \ $” << amount <<“ has been withdrawn” << endl;\n    return ;\n}\n```\n\n现在我们已经创建了类，可以进入\
    \ main 函数创建一些类对象：\n\n```cpp\nint main() {\n    Manage_Account linda_account; //\
    \ linda 现在是类中的一个对象\n    Manage_Account george_account; // george 现在是类中的一个对象\n\
    \    // 我们可以创建一个 vector 来添加新账户\n    vector < Manage_Account > account_vec{ linda_account\
    \ };\n    account_vec.push_back(george_account);\n}\n```\n\n如你所见，使用类以及创建类对象可以简化你的代码。现在你已经有了关于如何创建一个带有属性、方法和对象的的基础知识，让我们了解如何访问类成员。\n\
    \n基本上，你有两种方式可以访问类成员：使用点 (`.`) 运算符，以及使用箭头运算符 `->`（也称为指针的成员运算符）。我们可以访问类属性和类方法。\n\
    \n### 使用点 (.) 运算符\n\n让我们看看上一个类 `Manage_Account` 中使用点运算符的例子。我们已经为 Linda 创建了一个账户。现在我们可以访问该类中的方法：\n\
    \n```cpp\nManage_Account linda_account;\nLinda_account.is_overdrawn(50); //使用\
    \ . 来 //访问 is_overdrawn 方法\nLinda_account.deposit (50); //使用 . 访问 deposit 方法\n\
    ```\n\n你可以看到使用点运算符访问类成员是多么简单。但如果我们有一个指针作为对象，我们该怎么办呢？嗯，你可能猜到了，我们需要对它进行解引用：\n\n\
    ```cpp\nManage_Account *linda_account = new Manage_Account ();\n(*linda_account).deposit\
    \ (500);\n```\n\n你可能注意到我们在这里使用了括号。原因为点运算符的优先级高于解引用运算符 `*`，我们需要确保在访问类对象之前先进行解引用。\n\
    \n**要记住：`*linda_account` 不是一个对象，而是一个指向对象的指针。**\n\n访问类对象的第二种方法是使用箭头运算符，也称为指针成员运算符\
    \ `->`（破折号后跟大于号），如下：\n\n```cpp\nlinda_account->deposit (500);\n```\n\n箭头运算符更容易使用和阅读。它被引入\
    \ C++ 是是因为点运算符（例如在使用指针解引用时）可能会有些笨拙。你可能会在代码中看到箭头运算符。\n\n### 公共和私有类成员\n\n我们已经提到在定义类时，我们可以决定谁可以访问类和类成员。在\
    \ C++ 中，我们有三个类访问选项：`public`、`private` 和 `protected`。公共类可以被任何人从任何地方访问。私有类只能由类的成员或类的友元访问（我们将稍后详细介绍）。受保护类只能通过继承使用和访问，我们将在稍后的章节中介绍。\n\
    \n为了使用访问成员修饰符，我们将使用非常简单的语法。我们只需要在类体中编写访问修饰符，如下：\n\n```cpp\nclass Class_Name {\
    \ public: };\n```\n\n我们可以在类内部使用多个访问修饰符，使得某些类成员是公共的，某些是私有的。让我们使用已经定义的类：\n\n```cpp\n\
    class Manage_Account {\n    private: //attributes\n    string name; // 客户名称\n\
    \    int UID; //每个客户的唯一标识\n    int DOB // 出生日期\n    double balance // 账户余额\n \
    \   //methods\n    public: \n        bool is_overdrawn(double); //账户是否透支\n   \
    \     bool deposit(double); //是否存款\n        bool withdraw(double); //是否取款\n}\n\
    ```\n\n在这种情况下，方法可以在类外访问，但属性仅对类成员可见。在类内部使用多个访问修饰符是非常常见。。重要的是要记住，如果你尝试访问私有类成员，将得到一个编译错误。\n\
    \n## 15.2 - 实现类方法\n\n一旦我们创建了类，就需要实现类的方法，这与实现函数的方式非常相似。我们可以在类声明内部和外部实现方法，但请记住当我们在类声明外部实现它们时，必须使用以下语法：\n\
    \n```cpp\nclass_name::method_name\n```\n\n如你所见，在实现类方法时，我们使用作用域解析运算符 `::`。\n\n\
    当然，成员方法可以访问成员属性，你不需要将它们作为参数传递。这确实让我们的代码更简单更干净。我们已经提到使用头文件（`.h` 文件）和单独的 `.cpp`\
    \ 文件是最佳实践`.h` 文件用于类的声明，而 `.cpp` 文件用于类的实现。\n\n为了打开 `.h` 文件，你首先需要在解决方案管理器中选择项目，并点击“添加项”菜单选项：\n\
    \n![](img/image0159.jpeg)\n\n然后选择“头文件”并命名。名称将以 `.h` 结尾。\n\n![](img/image0160.jpeg)\n\
    \n添加源文件 (`.cpp`) 与添加头文件类似，区别在于选择“C++ 文件”类型。\n\n让我们看看使用我们的 `Manage_Account` 类实现成员方法的例子：\n\
    \n```cpp\nclass Manage_Account\n{\n    private:\n    double balance; //只有类成员可以访问此属性\n\
    \    public:\n    //我们有两个公共方法，只有它们可以访问‘double balance’\n    void calc_balance(double\
    \ balance) { balance = bal; }\n    double show_balance() { return balance; }\n\
    };\n```\n\n如果我们想在类声明外部声明这些方法，它看起来像这样：\n\n我们类声明的这部分将是 `.h` 文件的一部分：\n\n```cpp\n\
    class Manage_Account {\n    private: \n        double balance; //只有类成员可以访问此 //属性\n\
    \    public:\n        void calc_balance(double bal); //这是方法原型\n        double\
    \ show_balance(); //这是方法原型 //我们的类声明在此结束\n};\n```\n\n我们类声明的这部分将是 `.cpp` 文件的一部分：\n\
    \n```cpp\n//在类外部实现成员方法\nvoid Manage_Account::calc_balance(double balance) { balance\
    \ = bal; }\ndouble Manage_Account::double show_balance() { return balance; }\n\
    ```\n"
- fmt: "\nWhen working with large code and complex programs, it is the best and most\
    \ common practice to separate the function declaration and implementation. Keep\
    \ that in mind and practice working with both files, but beware of duplication\
    \ declarations and implementation, as this can be very confusing and cause compilation\
    \ errors. There is a cure for this potential problem: the `#include` guard. You\
    \ already became familiar with this guard when you included `.h` files, which\
    \ are part of the C++ internal library. Using the `#include` guard will guaranty\
    \ that the file you wish to use will only be used once.\n\nLet’s take a look at\
    \ more complex code. In this code, we create a class named `database`.\n\n```cpp\n\
    #include <iostream>\n#include <string> \n#include <vector> \nusing namespace std;\
    \ //First we will define a structure for holding the data we wish to store\n\n\
    //To simplify our program, we will only store the student name and student ID\
    \ . //At the end of this code you can find some more information about it .\n\n\
    typedef struct\n{\nstring name; // the name of the student\nint id; // the id\
    \ of the student\n} db ; // the name of our new struct ‘db’\n\n// Next we will\
    \ define a prototype for our new class, that part along with the //\n// typedef\
    \ struct should both go\n// to our .h file, so other source files can use it\n\
    \nclass database\n{\npublic : // This is the public part of the class. The public\
    \ part is accessible // from outside the scope of the class\n\n// add - a function\
    \ for adding new data to our database\nvoid add( string name , int ID );\n\n//\
    \ findByID - a function for finding a student if we not his/her ID string findByID(\
    \ int ID ); \nprivate : vector < db > Db; // here is the variable which is a vector\
    \ of ‘db’ // (the structure we have defined earlier) \n};\n\n// Our add function\
    \ - here we create a single item of the type‘db’ and fill it // with data, then\
    \ add it to our vector\nvoid database ::add( string name , int ID ) { \n    db\
    \ SingleItem; \n    SingleItem.name = name ; \n    SingleItem.id = ID ; \n   \
    \ Db.push_back(SingleItem); \n}\n\n// This function goes over the entire vector\
    \ and when the ID of the current\n// item matches the ID entered as a parameter\
    \ it returns the ‘name’ field.\nstring database ::findByID( int ID ) { \n    int\
    \ i; \n    for (i = 0; i < Db.size(); i++) { \n        if (Db [ i ] .id == ID\
    \ ) { \n            return Db [ i ] .name; \n        } \n    } \n    return“not\
    \ found” ; \n} \n\nint main() { \n    database myDB;\n    myDB.add( “student 1”\
    \ , 1); // add data to our database\n    myDB.add( “student 2” , 2);\n    myDB.add(\
    \ “student 3” , 3);\n    myDB.add( “student 4” , 4); // search for a student with\
    \ ID 4\n\n    cout <<“looking for student with ID “ << 4 <<“ result:“ << myDB.findByID(4)\
    \ << endl;\n}\n```\n\nIn this code, we used something new: `typedef struct`. When\
    \ you want to use a new data type that is based on several elements, you use:\
    \ `typedef struct`.\n\nThis will define `struct` as a datatype, so that you can\
    \ later use the same as the built-in data types, such as `int` or `char`. For\
    \ example, if you want a data type for storing information about a book, you will\
    \ define it as such:\n\n```cpp\ntypedef struct\n{\nstring author;\nstring title;\n\
    int pages;\nint year_of_publishing;\n} book ;\n```\n\nThen you can use a new type\
    \ that you have created as long as you use it from a source file that has a reference\
    \ to this definition. So, if you placed it in `books.h`, you must include `books.h`\
    \ whenever you wish to refer to the book data type.\n\n```cpp\nbook mybook;\n\
    mybook.author =“James Jones” ;\nmybook.pages = 134;\nmybook.title =“Success Stories”\
    \ ;\nmybook.year_of_publishing = 2001;\n```\n\n## 15.3 - Constructors and Destructors\n\
    \nConstructors and destructors are special member methods in a class. Each time\
    \ a new entity of our class is defined, we can have a special function to be executed.\
    \ Such a function can initialize our class. For example, if the class has a private\
    \ variable, it can be initialized to the value in which we want it to have when\
    \ we start. If this variable is used to calculate a sum, we will initialize it\
    \ to 0. Constructors will always have the same name as the class, and they are\
    \ very useful when initialization is required. Also, constructors do not require\
    \ any return type, and they can be overloaded (which we will explain shortly).\n\
    \nLet’s see an example for a constructor:\n\n```cpp evenclass Manage_Account\n\
    {\nprivate:\ndouble balance;\npublic:\n//overload contractors (see more info later)\n\
    Manage_Account(); //constructor with no arguments\nManage_Account(std::string\
    \ name, double deposit); //expects 2 arguments\nManage_Account(double balance);\
    \ //expects 1 argument\n};\n```\n\nWe will demonstrate and explain more about\
    \ constructors, so don’t worry if you feel like you don’t understand much at this\
    \ point.\n\n### Destructors\n\nJust before the program goes out of the scope of\
    \ a class, another special function can be called, the Destructor. Destructors\
    \ are also member methods in our class, and they have the same name as the class,\
    \ except that the name will start with a tilde `~`. Destructors can be used to\
    \ free up memory, save data to a file or a database, or anything else you wish\
    \ to be executed upon exiting the class. They invoke automatically once an object\
    \ is destroyed. Same as constructors, they do not require any return type, but\
    \ pay attention: they cannot be overloaded, and only one destructor is allowed\
    \ per class!\n\nLet’s see how a destructor will look in our class:\n\n```cpp\n\
    class Manage_Account { \nprivate: \ndouble balance; \npublic: \n//overload contractors\n\
    Manage_Account(); //constructor with no arguments\nManage_Account(std::string\
    \ name, double deposit); //expect 2 arguments\nManage_Account(double balance);\
    \ //expect 1 argument\n//destructor\n~ Manage_Account();\n );\n```\n\nLet’s look\
    \ at another example. In this case, let’s assume that we have functions to read\
    \ and write data in memory to and from the storage (either a database or a file).\
    \ We can use the constructor and destructor in doing so, which will give us peace\
    \ of mind that whenever our class is defined or used for the first time, data\
    \ will be loaded from storage. Furthermore, all data will be saved before ending\
    \ the use of the class:\n\n```cpp\ndatabase ::database()\n{\n    load_data_from_storage();\n\
