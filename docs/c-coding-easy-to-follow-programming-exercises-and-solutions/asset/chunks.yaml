    # Chapter 14: Pointers


    ## What Is A Pointer?


    One of the first things you were introduced to in C++ was variables. You learned
    that variables have a type name, a value, and that they are stored in memory.
    A pointer is also a variable, but the value of a pointer variable is an address
    in memory. The address of a pointer can be of a variable (for example, a pointer
    which points to an address of an int), while another pointer might lead to an
    address of a function. In order to use a pointer, we must know the type of variable
    it points to.


    **What''s the point? The reasons for using a pointer**


    The first question that comes to mind is, why can ’t we just use the original
    variable or function instead of pointing to it? Well, you can and should use variables
    and functions directly in some cases, yet in other cases, pointers can be very
    handy. Let’s understand when and why you should use pointers. For example, when
    variables are out of the scope of the function you are using. We already explained
    in the function section that functions could only use what’s within the scope
    of the function. But if we need to use something out of the scope of that function,
    pointers are a great way to do this, as they allow the function access to the
    data that is out of scope. In addition, pointers work very well with arrays, and
    we will provide some examples later on. It is also good to use pointers in order
    to allocate memory dynamically on the heap.


    **Pointers, the stack, and the heap**


    In an earlier section, we discussed briefly about the computer ’s memory. Computers
    use two main memory sections: the stack, which stores memory temporarily. The
    stack is similar to a stack of books. You pile another new book at the top of
    the stack, so the oldest books are at the bottom. Stack memory works the same
    way—new data is stored on top of older data.


    Let’s see an illustration of code as it is stored in the stack:


    **void my_stack_program**


    ![](Images/image00146.jpeg)When my_stack_program terminates, the values stored
    in the stack are deleted.'
