    \ rhs); \nbool operator <(const &Value lhs, const &Value rhs);\n```\n\n# 第 18\
    \ 章：C++ 封装\n\n封装是面向对象编程的几个基本支柱之一，与继承和多态一起——我们将在接后的章节中解释它们。封装的基本概念是不需要将你的类的内部细节暴露给外部。这被称为数据隐藏，意味着你只为你的类成员提供必要的访问。其他人甚至说，封装就像是你把你所有的问题并把它们放在一个胶囊形状的胶囊中。当你买了一台电视时，你可以打开螺丝并将一根电线连接到另一根电线上。这样做可以切换频道或开关电视，但制造商创建了专门的按钮或选项来实现这些操作。类的情况也是如此。数据隐藏允许你标记他人应该如何使用该类。事实上，这是一种抽象——你不需要知道电线是如何连接的，也不需要知道电视电子设备是如何工作的。你只需要知道如何插上、开启并使用遥控器。封装的第二个重要益处是它允许我们控制谁可以访问我们的程序，谁不能访问。为了实现封装，我们使用两种方法：\n\
    \n- 使用访问修饰符。你已经知道我们之前介绍过的 `private`、`public` 和 `protected` 访问修饰符。\n- 使用 getter\
    \ 和 setter。getter 和 setter 是简单但强大的函数，为我们对私有数据成员的访问提供了精细控制。我们很快就会演示并解释更多关于 setter\
    \ 和 getter。\n\n事实上，必须指出，将数据成员声明为 `private` 或 `public` 对代码执行的效率没有影响，编译器的视角也没有太大。有些编码人员将所有数据成员设为\
    \ `public`，这既不会减慢程序，也不会导致它消耗更多内存。封装的唯一优势（这是一个非常重要的优势）是代码的可读性以及以后其他编码人员甚至你自己对该类的易用性。将数据成员声明为\
    \ `private` 确保了你做了一个标记，不要从类外部直接访问此数据成员，而是使用专门的函数来操作。在这样的函数中你可以添加日志文件条目，因此你不希望数据成员被该函数直接访问从而丢失日志条目，等等。`public`\
    \ 数据成员是类的前端。它们反映了你希望你的类的用户做什么。\n\n## 如何使用 getter 和 setter\n\n使用 getter 和 setter\
    \ 允许你控制私有数据成员，并且只有在你确实需要精细调整这种访问时才使用它们。假设我们有一个代表专业马拉松跑者等级的类。有三个等级：金、银、铜：\n\n```cpp\n\
    #include \"pch.h\" \n#include <iostream> \n// 我们定义了一个名为 Marathon 的类 \n// 它用于根据跑步者的会员等级对其进行分类，\
    \ \n// 等级可以是：金、银和铜。 \n// 默认等级是“gold”。我们使用 getter 和 setter 函数来设置或\n// 获取值。会员等级存储在“private”部分，\n\
    // 无法直接访问，只能通过 getter 和 setter 函数。 \nclass Marathon { \nprivate : \n    std::\
    \ string level = “gold” ; //默认等级 \npublic : \n    std:: string name; \n    std::\
    \ string get_level() { \n        return level; \n    } \n    void set_level(std::\
    \ string value ) { \n        if ( value ==“gold” || value == “silver” || value\
    \ == “bronze” ) { \n            this ->level = value ; \n        } \n    } \n\
    \    Marathon(std:: string name , std:: string value ) { \n        this ->name\
    \ = name ; \n        this ->level = value ;\n    }\n    ~Marathon() {} \n}; \n\
    int main() { \n    Marathon value( “John” , “silver” ); \n    value.set_level(“bronze”\
    \ ); \n    std::cout << value.get_level().c_str() << std::endl; // 显示 bronze 值。\n\
    \    value.level = “green” ; //错误！我们不能在 main 中访问 level！ \n}\n```\n\n在这个示例中，我们有一个公共方法\
    \ `get_level`，但这个方法需要访问私有数据成员 `value`。`get_level` 方法是一个 getter，它在类的范围内，因此它有访问权限，但类外的任何其他地方都无法访问。我们有另一个名为\
    \ `set_level` 的方法，它是我们的 setter。它设置 `level` 的值并使用 `this` 指针来实现。（在其他语言中，你可能会遇到 `property`\
    \ 术语，它在单个函数中执行与 getters 和 setters 类似的工作。在 C++ 中，我们同时使用这两个函数。）\n\n然后我们想使用赋值运算符来更改\
    \ `level` 的值：\n\n`value.level = \"green\" ; //错误！我们不能在 main 中访问 level！`\n\n我们将得到编译错误。所以，你可以看到，如果不使用\
    \ getter 和 setter 函数，我们就无法访问私有数据成员。当我们注释掉那行问题的代码时，我们得到了这个结果：\n\n![](img/image00162.jpeg)\n\
    \n正如你看到的，setter 允许我们更改值。这是一个非常强大且实用的概念，你会在 C++ 中经常。\n\n# 第 19 章：继承\n\n继承允许我们使用现有类创建新类，并经常用于\
    \ C++ 程序。新创建的类从另一个使用的类“继承”行为和数据，重用方法等。这是一个节省时间和大量工作的好方法，因为我们可以关注类之间的共性，例如属性和方法，同时可以根据我们新创建类的用例对其进行修改。例如，如果我们有一个支票账户类，我们可以使用继承来创建储蓄账户、学生账户、信托账户等。这样做是因为许多属性、类方法和函数是相同的（例如，账户名称、账号、存款、取款等）。当我们谈论继承时，可以使用单继承或多重继承。\n\
    \n单继承是从单个类创建的类。多重继承是指一个类从两个或多个类创建的。\n\n被继承的类被称为 `base class`、`super class` 或 `parent\
    \ class`。从父类创建的类被称为 `derived class`、`sub class` 或 `child class`。\n\n"
- fmt: "\n# Inheritance Concepts\n\nOne of the most important concepts to understand\
    \ in relation to inheritance is the “Is-A” relationship. The way to understand\
    \ this concept is first to understand that the inherited class is a sub-type of\
    \ the parent class. This is what we imply when we use the “Is-A” relationship.\
    \ We will explain further about this concept and how we can use it further in\
    \ this section. Another concept you need to learn is generalization, which comes\
    \ into effect when we combine several classes with similar functionality into\
    \ a single general, which is based on their general attributes. The concept of\
    \ specialization works the other way around in a sense, as it is creating a single\
    \ class with more specific attributes or methods, and functionality.\n\n## Hierarchy\n\
    \nAnother essential term when dealing with inheritance is Hierarchy. Hierarchy\
    \ is how we organize our inheritance relationships from top to bottom. This allows\
    \ us to better organize our code. Below is a diagram that demonstrates how hierarchy\
    \ works in relation to generalization and specialization:\n\n![](Images/image00163.jpeg)\n\
    \nIn this diagram, we can see that there is a relationship between the parent\
    \ class `A` and the child classes `B` and `C`. The higher our hierarchy goes,\
    \ the more general our class will be. The lower we go, the more specific it will\
    \ be. `B` is an `A`, `C` is also an `A`. `D` is a `C`, but `D` is also an `A`.\
    \ `E` is a `D`, but it is also a `C` and an `A`. Obviously, class `B` is not a\
    \ `C`. It is only an `A`, as there is no inheritance relationship between the\
    \ two.\n\nBy now, you should feel comfortable with the concept of the relationship\
    \ a class has with its parent or child class and the question we need to ask—is\
    \ there a relationship between class `X` and class `Y`? However, there is another\
    \ question that we need to ask: does class `X` has a relationship with class `Y`?\
    \ In fact, this is another concept in class inheritance, and it is known as a\
    \ public inheritance (“is a” question) and composition (“has a” question). Let’s\
    \ review some examples:\n\n### Public inheritance:\n- A client is a person.\n\
    - Savings account is an account.\n\n### Composition:\n- A client has an account.\n\
    - Savings account has a deposit limit.\n\nIn many cases, programmers use composition\
    \ in their classes, and we have been doing so all along until this point. For\
    \ example, when we declared `name` and `age` attributes in a class, we used composition:\n\
    \n```cpp\nClass client\n{\nprivate:\n    std::str name; //has a name\n    Account\
    \ account; //has an account\n    //following are the statements\n};\n```\n\nWhen\
    \ you begin working as a programmer, you will soon find out that both composition\
    \ and inheritance are used together. Now let’s see how we can use inheritance\
    \ to derive a new class from an existing one.\n\n## Implementing Inheritance\n\
    \nThe first thing we need to do is to declare the parent class. As you already\
    \ know, this class has its own data members:\n\n```cpp\nclass Parent { //class\
    \ members };\n```\n\nNow, we have to declare our child class, and for that, we\
    \ will need an access specifier (private, public, or protected) and the name of\
    \ the base class:\n\n```cpp\nclass Child: access-specifier Parent { //derived\
    \ class members };\n```\n\nIt is important to understand what the access specifiers\
    \ mean when we deal with inheritance. In most other programming languages, you\
    \ will encounter only public inheritance, yet in C++, we have all 3 options. First,\
    \ the most commonly used access specifier is `public`, and it establishes the\
    \ “is-a” relationship we explained earlier in this section. Note: if you don’t\
    \ specify the access specifier, the private inheritance will be used by default.\
    \ The second option is to use `private` or `protected` access. Doing so will establish\
    \ a “has-a” relationship between the child and parent class. In the section, we\
    \ will focus on public inheritance. If you wish to learn more about private or\
    \ protected inheritance, you can find additional information in the following\
    \ link: https://www.learncpp.com/cpp-tutorial/115-inheritance-and-access-specifiers/\n\
    \nLet’s review an example of a parent and child classes using public inheritance:\n\
    \n```cpp\nclass Account //parent { //here we define the class member };\nclass\
    \ Trust_Account: public Account //child { //here we define the derived class members\
    \ };\n```\n\nWhen looking at these two classes, we can ask: is a trust account\
    \ an account? The answer is yes. You can see that there is an “is-a” relationship\
    \ between the two classes. Now we can specify special behaviors to the `Trust_Account`\
    \ class, yet the rest will be derived from the `Account` class.\n\nThis all looks\
    \ very simple, and it is, but bear in mind that inheritance can become pretty\
    \ complex sometimes as the complexity of your code grows.\n\n## Code Example\n\
    \nLet’s review simple code that demonstrates the use of inheritance. In this example,\
    \ we created a class named `Animals`, and we created two child classes: `Dog`\
    \ and `Cat`.\n\nLet’s first look at the Class prototype in the `.h` file:\n```cpp\n\
    #pragma once \nclass Animal { \npublic : \n    virtual void SaySomething(); \n\
    };\n```\nAnd now let’s look at the `.cpp` file for `Animal`:\n```cpp\n#include\
    \ <iostream> \n#include“Animal.h”\nusing namespace std;\nvoid Animal ::SaySomething()\
    \ { \n    cout <<“I’t know what to say...” << endl; \n}\n```\nNow we have two\
    \ derived classes. Here is the `.h` file of `Dog` class:\n```cpp\n#pragma once\
    \ \n#include“Animal.h”\nclass Dog : public Animal { \npublic : \n    void SaySomething();\
    \ \n};\n```\nAnd the `.h` file of `Cat` class:\n```cpp\n#pragma once \n#include“Animal.h”\n\
    class Cat : public Animal { \npublic : \n    void SaySomething() \n};\n```\nNow\
    \ let’s look at the `.cpp` file of `Dog`:\n```cpp\n#include <iostream> \n#include“Dog.h”\n\
    using namespace std;\n// This is the Doc inherited SaySomething() function.\n\
    // It is inherited from the Animal class which has a virtual\n//function by that\
    \ name\n// The Virtual function is like a placeholder for the real\n//function\
    \ inherited by each derived class\n// namely: Cat and Dog\nvoid Dog ::SaySomething()\
    \ { \n    cout <<“How How” << endl; \n}\n```\nAnd now `Cat` `.cpp` file:\n```cpp\n\
    #include \"Cat.h\" \n#include <iostream>\nusing namespace std;\n// This is the\
    \ Cat inherited SaySomething() function.\n// It is inherited from the Animal class\
    \ which has a virtual\n//function by that name\n// The Virtual function is like\
    \ a placeholder for the real\n//function inherited by each derived class\n// namely:\
    \ Cat and Dog\nvoid Cat ::SaySomething() { \n    cout <<“Miahu Miahu” << endl;\
    \ \n}\n```\n\nThis simple example shows how we can inherit a function and modify\
    \ it specifically per class. Let’s run our program from `main()`:\n\n```cpp\n\
    #include <iostream> \n#include “Animal.h” \n#include“Dog.h” \n#include“Cat.h”\n\
    int main() { \n    Dog myDog; \n    myDog.SaySomething();\n    // the same function\
    \ (SaySomething) will return“How How” for\n//the dog.\n    Cat myCat; \n    myCat.SaySomething();\
    \ // the same function (SaySomething) will return Miahu for the\n//cat. \n}\n\
    ```\nThis is what we should expect:\n\n![](Images/image00164.jpeg)\n\n## Constructors\
    \ and destructors when using inheritance\n\nIn C++, a child class inherits the\
    \ constructors from its parent class, but before any derived object can be initialized,\
    \ first, the parent class is executed, and then the child class executes. There\
    \ is a sense that, as the derived class might use information encapsulated in\
    \ the base class, this means that the parent class will execute the constructor\
    \ first, and only then, the child class will execute.\n\nThe destructors are revoked\
    \ in the reverse order of the constructors. First, the derived part must be destroyed,\
    \ and only then the base part can be destroyed. This is the order of operation\
    \ we should expect:\n\n![](Images/image00165.jpeg)Base / Parent class: Derived\
    \ / Child class:**\n\n![](Images/image00166.jpeg)\n\nNote: The order of construction\
    \ and destruction applies whether we have one derived class or multiple derived\
    \ classes. Since the base class constructor initializes first, some of these constructors\
    \ must be invoked. In fact, the derived class can invoke constructors, destructors,\
    \ and overloaded assignment operators.\n"
