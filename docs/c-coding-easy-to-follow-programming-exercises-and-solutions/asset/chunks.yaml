  trans: "\n另一个最好避免的潜在问题是野指针，也称为悬挂指针（dangling pointers）。这些指针指向一个已经释放且不再有效的内存地址。这在函数终止时经常发生，此时野指针的返回地址是栈上的一个局部变量，且该变量已不可用。此问题通常会导致程序崩溃。\n\
    \n我们已经提到的另一个问题是内存泄漏。这实际上涉及指针的最常见错误之一。如果我们忘记释放在堆上分配的内存且没有使用 `delete` 关键字，或者我们丢失了指针，在这种情况下，就会得到所谓的“孤儿内存”（orphan\
    \ memory）。\n\n在现代 C++ 中，许多此类问题和困难已成为过去式，因为你可以使用智能指针和原子指针。我们在这个阶段不会介绍原子指针，因为这是一项高级特性，但我们建议你进一步研究这些主题。\n\
    \n# 第 15 章：面向对象编程\n\n现代 C++（事实上也是大多数现代语言）的核心特性之一是面向对象编程，或 OOP。但什么是 OOP 呢？在过去，计算机编程仅能够进行过程化编程，这意味着它只关注函数、过程和程序的流程。我们将数据与函数数据分开声明，并将其传递给函数。这一切都是以适用于能力非常有限的老旧电脑的方式进行的。在\
    \ C++ 中，我们仍然使用过程化编程（到目前我们实际上做了很多），但 OOP 为我们提供了另一个更抽象的层次。更重要的是，它允许我们管理海量的代码、函数和数据，这种管理在过程化编程中是极其困难甚至无法实现的。由于现在的程序非常复杂，存储了大量涉及数十、数百甚至数千次操作和函数运行的数据，我们必须有一种更好的方法来管理所有这一切。把它想象成同时抛耍成百上千个球——这简直是不可能的。\n\
    \nOOP 是管理复杂程序的更好方法，它可以简化程序，并允许你（程序员）以更抽象的方式看待事物并操作多种类型的数据。重要的一点是，C++ 社区的某些程序员认为\
    \ OOP 变得有些庞大，社区内部对于 OOP 的优点与老派编程相比的对比也存在一些批评。但这只是顺带一提。让我们深入探讨 OOP 并学习对象和类。\n\n\
    OOP 有时可能难以理解，可能需要一些练习。花点时间学习和理解，随着学习的进行，它会变得清晰。\n\nOOP 允许我们将程序模块化为类和对象，以简化程序。类允许你将代码的部分封装在单个类中，然后我们可以将类中的数据与处理数据的操作结合使用。这意味着数据和操作不会分散在整个程序中；如果我们使用过程化编程，这将迫使我们访问每个位置，更不用说如果我们不仅需要访问数据，还要修改它。通过类，我们可以精确地使用、修改和调用我们的数据和操作——所有操作都从一个单一位置完成。这在代码中非常强大且实用。\n\
    \n另一个优势是我们可以在其他程序中重用我们的类。例如，如果你有一个可以处理照片上传和重名的类，你可以在任何处理照片的程序中使用该类。这节省了大量的时间和辛力工作。我们之后还会讨论\
    \ C++ 的另一个概念，称为继承（inheritance）。它基本上允许我们使用现有类来创建一个新类。例如，假设我们有一个处理学生注册的类。它包含学生的姓名、日期和他们将修的课程。现在我们想写一个让孩子入学幼儿园的程序。我们会在类中需要许多相同的元素，但需要进行特定的更改。通过继承，这很容易实现。\n\
    \n## 15.1 - 类与对象\n\n描述类的最好方法是把它们比作程序某部分的蓝图。通过这些“蓝图”，我们定义数据类型、数据本身、我们使用数据的方法（函数），以及谁可以访问该类（定义为公共\
    \ public 或私有 private）。\n\nOOP 的另一个重要元素是允许我们隐藏信息。这意味着我们程序的某些部分无法访问其他部分，除非授予访问权限，或者它可以具有有限的访问权限。我们将在以后进一步讨论许多用途和优点。\n\
    \n在类内部，我们可以创建所需数量的对象。这些对象被称为类的每个特定实例（instance）。例如，如果我们为学生注册创建了一个类，那么学生类的对象将是学生的姓名、年龄、所选课程以及他们获得的学分。\n\
    \n### 定义类\n\n定义类非常简单。我们只需使用 `class` 关键字并给类命名（一种最佳实践是每个单词的首字母字母大写），然后声明该类。这是你应该使用的语法格式：\n\
    \n```\nclass Class_Name\n{\n// 在此处处写类声明；\n};\n```\n\n记住：类声明以分号 `;` 结束。\n\n在类的声明部分，我们可以定义类的行为方式、对象以及类的结构。如果我们想声明学生注册类，它看起来可能像这样：\n\
    \n```\nclass Enrollment { \n    // 属性 \n    std::string student; \n    int age;\
    \ \n    int points; \n    // 方法 \n    void Add_Student(std::string student, int\
    \ age, int points); \n};\n```\n\n记住，此类中的方法仅属于此类。现在我们已经创建了类，现在可以在此类内部创建对象，在这种情况下，即学生申请：\n\
    \n```\nEnrollment George_App;\nEnrollment Lidia_App;\nEnrollment *Tara_App = new\
    \ Enrollment ();\ndelete Tara_App;\n```\n\n现在，我们可以以各种方式使用对象。例如，我们可以创建一个学生申请的向量（vector）：\n\
    \n```\nstd::vector<Enrolment> enrollment1 {George_App};\nenrollment1.push_back(Lidia_App);\n\
    ```\n\n重要的是，在定义类时，我们在 `main` 函数之外完成它，因为我们不希望类留在 `main` 函数的作用域内。我们希望将类的访问范围扩展到程序作用域之外。你可以在\
    \ `main` 函数上方创建类，但更好的方法是在创建新类时这样做。为类创建专门的文件是常见的做法。这些文件将是一个 `.cpp` 文件和一个 `.h` 文件。\n\
    \n在 `.cpp` 文件中，你对 `.h` 文件添加 `#include`，然后放置类体。\n\n在 `.h` 文件中，你放置类的原型。然后任何使用该类的源文件只需要同样对\
    \ `.h` 添加 `#include`。这听起来可能很困惑，但我们稍后会提供一些真实的示例和任务。\n\n当你想要确保 `.h`（头文件）文件只被处理一次时，常用的方法是使用预处理器指令（Preprocessor\
    \ Directive）。这些行是独特的，因为它们以哈希符号（##）开头，编译器在实际编译代码之前检查它们，因此被称为“预处理器”。它可以用于在编译前自动对代码更改。此类更改包括添加源行、决定编译代码中包含或排除的代码块，以及将一个文本替换为另一个文本。\n\
    \n为了防止头文件被处理多次，我们定义一个字符串（可以是任何内容），然后添加以下行：\n\n```cpp\n#ifndef <string>\n#define\
    \ <string>\n\n<头文件内容>\n\n#endif\n```\n"
- fmt: "Then, the first time this file is processed, the string isn’t defined yet,\
    \ so the entire contents of the header file are processed. In addition, we define\
    \ this string. Next time, since the string is already defined, the header won’t\
    \ be processed again.\n\nIt is best practice to use an underline at the beginning\
    \ of the string name, and use only capital letters ending with another underline,\
    \ a capital H and an underline, like in the example below:\n\n```cpp\n#ifndef\
    \ _NAME_H #define _NAME_H <contents of header file> #endif\n```\n\nLet’s review\
    \ another example. In this example, we will create a simple class for a bank account\
    \ management program.\n\n```cpp\n#include \"pch.h\"\n#include <iostream>\n#include\
    \ <vector>\nusing namespace std;\nclass Manage_Account {\n    //attributes\n \
    \   string name; // the name of the client\n    int UID; // Unique ID per client\n\
    \    int DOB; // date of birth\n    double balance; // account balance\n    //\
    \ methods\n    public :\n        bool is_overdrawn( double ); //is the account\
    \ overdrawn\n        void deposit( double ); // is there a deposit\n        void\
    \ withdraw( double ); //is there a withdraw\n};\nbool Manage_Account ::is_overdrawn(\
    \ double balance ) {\n    return (balance < 0);\n}\nvoid Manage_Account ::deposit(\
    \ double amount ) {\n    cout <<“The amount of $” << amount <<“ has been deposited”\
    \ << endl;\n    return ;\n}\nvoid Manage_Account ::withdraw( double amount ) {\n\
    \    cout <<“The amount of $” << amount <<“ has been withdrawn” << endl;\n   \
    \ return ;\n}\n```\n\nNow that we have created the class, we can go to the main\
    \ and create some class objects:\n\n```cpp\nint main() {\n    Manage_Account linda_account;\
    \ // linda is now an object in the class\n    Manage_Account george_account; //\
    \ george is now and object in the class\n    // we can create a vector for adding\
    \ new accounts\n    vector < Manage_Account > account_vec{ linda_account };\n\
    \    account_vec.push_back(george_account);\n}\n```\n\nAs you can see, working\
    \ with classes and creating classes and objects can simplify your code. Now that\
    \ you have basic knowledge of how to create a class with its attributes, methods,\
    \ and objects, let’s understand how to access class members.\n\nBasically, you\
    \ can access class members in two ways: by using the dot (`.`) operator, and by\
    \ using the arrow operator `->` also known as a member of the pointer operator.\
    \ We can access class attributes and class methods.\n\n### Using the dot (.) operator\n\
    \nLet ’s look at an example of using the dot operator from our last class, `Manage_Account`.\
    \ We already created an account for Linda. We can now access methods from the\
    \ class:\n\n```cpp\nManage_Account linda_account;\nLinda_account.is_overdrawn(50);\
    \ //using the . in order to //access is_overdrawn method\nLinda_account.deposit\
    \ (50); //using . to access deposit method\n```\n\nYou can see how simple it is\
    \ to use the dot operator to access class members. But what do we do if we have\
    \ a pointer as an object? Well, you probably guessed, we need to dereference it:\n\
    \n```cpp\nManage_Account *linda_account = new Manage_Account ();\n(*linda_account).deposit\
    \ (500);\n```\n\nYou probably noticed that we used parenthesis here. The reason\
    \ is that the dot operator has a higher priority than the dereference operator\
    \ `*` and we need to be sure that the dereferencing will take place before accessing\
    \ the class object.\n\n**Important to remember: `*linda_account` is NOT an object,\
    \ but a pointer to an object.**\n\nThe second method to access class objects is\
    \ by using the arrow operator, also called member of pointer operator `->` (a\
    \ dash followed by a greater than sign) like this:\n\n```cpp\nlinda_account->deposit\
    \ (500);\n```\n\nThe arrow operator is easier to use and read. It was introduced\
    \ in C++ because the dot operator, such as with the use of dereferencing pointers,\
    \ can be somewhat awkward. You will probably see the arrow operator used commonly\
    \ in code.\n\n### Public and private class members\n\nWe already mentioned that\
    \ when defining a class, we can determine who can access the class and class members.\
    \ In C++, we have three class access member options: `public`, `private`, and\
    \ `protected`. A public class can be accessed by anyone from anywhere. A private\
    \ class is accessible only by members of the class, or friends of the class (we\
    \ will elaborate more about this). Protected classes can be used and accessed\
    \ only with inheritance, which we will introduce in a later section.\n\nIn order\
    \ to use the access member modifier, we will use very simple syntax. We simply\
    \ write the access modifier in the body of the class, like this:\n\n```cpp\nclass\
    \ Class_Name { public: };\n```\n\nWe can use several access modifiers within a\
    \ class so that some class members will be public and some private. Let’s use\
    \ the class we already defined:\n\n```cpp\nclass Manage_Account {\n    private:\
