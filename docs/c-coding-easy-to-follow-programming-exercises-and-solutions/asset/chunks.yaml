    ## 16.2 - 类友元


    在这一节中，你看到我们将类的部分定义为私有（private）和公有（public）。在 C++ 中，我们可以从类和类成员管理其他类的访问函数。实现这一点的方法之一是定义类的友元。类友元非常强大，它可以与函数或另一个类相关，使其能够访问类的私有成员，即使该函数不是类本身的成员。但请记住，友元必须在类中清晰且显式地声明，通过
    `friend` 关键字在函数原型中授予访问权限。


    同样重要的是记住，当谈到类友元时，与现实中的朋友不同，它不是双向的：授予另一个类的函数或方法访问权限并不会反过来授予。所以，如果 `X` 是 `Y` 的友元，那么
    `Y` 就不是 `X` 的友元。


    此外，如果 `X` 是 `Y` 的友元，而 `Y` 是 `Z` 的友元，那么 `Z` 也不是 `X` 的友元。换句话说，它们在本质上是不交换的。


    让我们看看为我们的库类 `Lib_Book` 声明一个非成员友元时，类友元的语法是什么样的：


    ```cpp

    class Lib_Book

    {

    public:

    friend void get_book_num (Lib_Book &p);

    friend string get_book_name(Lib_Book &p);

    private:

    std::string book_name;

    int serial_num;

    //statements };

    ```


    在这个示例中，友元函数可以访问 `Lib_Book` 类中的所有内容。现在我们无需通过公有的 getter 就可以访问类的私有属性，并显示私有信息。我们可以简单地运行该函数。注意，该函数返回了名为
    `serial_num` 的私有成员的内容，我们无法直接访问它：


    ```cpp

    int get_book_num(Lib_Book &p) { return p.serial_num; }

    ```


    在这个函数中，我们还访问了名为 `book_name` 的私有成员，同样我们无法直接访问它，因为它是私有的，这就是为什么我们需要使用这个函数（它也是一个 getter）：


    ```cpp

    string get_book_name(Lib_Book &p) { return p.book_name; }

    ```


    除了访问私有属性外，我们还可以修改它们，因为对象是通过引用传递的，所以只要它们不是 `const`，我们就可以更改它们。我们可以在另一个类中声明一个方法为友元：


    ```cpp

    class Lib_Book { private: friend void Other_Class:: get_book_num ( Lib_Book &p);
    std::string book_name; int serial_num; public:

    //statements };

    ```


    在这个示例中，我们将 `get_book_num` 方法显示为友元，它将访问 `Lib_Book` 类中的任何内容。


    现在让我们如何在我们的 `Other_Class` 中实现该方法：


    ```cpp

    class Other_Class { // Statement/s public:

    int get_book_num ( Lib_Book &p); { return p.serial_num; } };

    ```


    类的友元也可以针对整个类声明。我们可以将整个 `Other_Class` 类声明为 `Lib_Books` 类的友元，这样我们在 `Other_Class`
    中使用的所有方法和函数都可以访问 `Lib_Book` 的属性：


    ```cpp

    class Lib_Book { friend class Other_Class; std::string book_name; int serial_num;
    public: //statements };

    ```


    最佳实践是仅在必要且符合你的程序设计时使用友元。然而，在使用友元时，我们可以为程序增加很多功能和极大的性能。在许多情况下，它比使用 getter 和 setter
    更好。


    # 第 17 章：运算符重载


    在 C++ 中，我们可以重载大多数运算符，以便将其作为用户定义类的一部分使用。例如 `+`、`=`、`*` 运算符。这些运算符的默认用法是 C++ 内置类型。例如，我们可以使用
    `*` 运算符乘以两个整数，或使用 `+` 运算符相两个整数，或者一个整数和一个双点数。运算符重载允许我们定义运算符在自定义类型上的使用方式，类似于它们在内置类型上的使用方式。唯一的例外是赋值运算符
    `=`，如果没有定义，它由构造函数自动定义，而其他运算符必须显式定义。正如你可以想象的，运算符重载非常强大。此外，运算符重载有助于我们编写更清晰、更易阅读和维护的代码。然而，必须遵循某些规则，我们将在本节中详细讨论。


    以下是重载运算符在代码中看起来像那样的示例：`result = (a+b) * (x-y);`


    相比之下，如果我们不重载运算符，上面的代码可能像这样：


    ```cpp

    result = multiply(add (a, b) , decrement (x, y));

    //我们必须为运算符定义函数

    ```


    你可以看到，使用重载运算符的代码非常简单且易于理解。


    我们还可以定义自己的运算符来连接字符串或字符：


    ```cpp

    std::string word1 {"Los"}, word2 {"Angeles"};

    std::string word3 = word1 + word2;

    //在接下来的章节中，我们添加一个或多个语句如果 (word1 < word2) cout <<“Word2 is larger than word1” <<
    endl; else

    cout <<“Word1 is larger than word2” << endl;

    ```


    可以看到，我们使用了 `+` 运算符将一个单词添加到另一个单词，从而创建一个新单词。我们还比较了单词的大小——尽管这些是字符串。我们使用了 `+` 和 `<`
    运算符，因为它们是合理的，这一点很重要——在重载时你应该始终使用合理的运算符。我们将在本节中进一步详细观察运算符重载。


    虽然 C++ 中的大多数运算符都可以重载，但某些运算符不能重载。这包括以下这些：


    - `sizeof` 运算符。

    - 成员指针运算符 `.*`。

    - 作用域解析运算符 `::`。

    - 条件运算符 `:?`。

    - 点运算符 `.`。


    让我们回顾一下运算符重载的一些基本规则：


    - 我们不能更改优先级。这意味着某些运算符的优先级高于其他运算符，且这种情况不会改变。运算符的结合性也是如此。

    - 我们不能更改原始类型的运算符，如 `int`、`double` 等。

    - C++ 不允许我们创建不存在的新运算符。

    - 运算符 `=`、`[]`、`()` 和 `->` 必须声明为成员方法。

    - 其他运算符可以既声明为成员方法也可以声明为全局函数。


