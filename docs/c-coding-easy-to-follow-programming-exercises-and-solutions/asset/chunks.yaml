    \ std::cout << *p << std::endl; *p = 2; std::cout << *p << std::endl; }\n```\n\
    \nIn this example, of course, we only have one `shared_ptr` pointing to an object\
    \ on the heap.\n\nIn order to initialize shared pointers, it is best to use the\
    \ `make_shared` method, which allows us to easily initialize shared pointers simply\
