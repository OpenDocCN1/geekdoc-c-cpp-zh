    \n### What went wrong?\n\nWell, the index of arrays always starts with 0, so the\
    \ loop should start incrementing at 0 and then terminate at 8. We gave this example\
    \ as this is a common beginner’s mistake. The output will start at the second\
    \ element in the index—the char ‘L,’ and after it terminates, it goes through\
    \ one more iteration hence this strange icon at the end of the list, which is\
    \ basically garbage.\n\nLet’s edit the code and see the expected results:\n\n\
    ```cpp\nChar name [] {'A', 'L', 'E', 'X', 'A', 'N', 'D', 'E', 'R'};\nFor (int\
    \ i {0}; i < = 8; ++i)\n{\n    cout << name[i] << endl;\n}\n```\n\n![](Images/image00142.jpeg)\n\
    \n### Range based ‘for’ loop\n\nUntil now, we saw that the ‘for’ loop is pretty\
