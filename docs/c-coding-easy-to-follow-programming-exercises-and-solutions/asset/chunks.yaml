    \ STL 中有超过 100 个算法！这是一个巨大的数字，使得 C++ 成为一个强大的工具。C++20 增加了一些新的算法类。算法类型分为两大大类：修改算法和非修改算法——这完全取决于算法是否修改了序列。\n\
    \n## 使用宏编程 (Programming with macros)\n\n如果你从未用过宏，或者对它们不熟悉，你应该理解宏没有没有程序化的逻辑。事实上，宏更像是你代码中的一种“搜索并替换”功能。最好的描述方法是，想象你有一个私人助手，在编译前搜索代码中的某些字符串和模式，并将它们替换为其他字符串或模式。宏不会影响程序本身，但可以帮助你让代码更具读性和易于管理。然而，宏可能会让调试变得难以管理——因此在使用要小心。\n\
    \n`#define` 预处理器指令可以定义一个给字符串，该字符串将在编译前被替换为另一个字符串（因此被称为“预处理器指令”）。\n\n此外，一个 `#define`\
    \ 指令可以包含一个或多个参数，使其成为一个宏（Macro）。\n\n这是一个示例：\n```\n#define SET_TEST_VECTOR vector\
    \ < int >test{ 900, 1,4,-1, 3,6,5,2 } \n#define PRINT_LINE (s) cout << s << endl\
    \ \n#define PRINT_TEST_VECTOR print_vector(test); \nint main() { \n    SET_TEST_VECTOR\
    \ ; \n    PRINT_LINE ( “before” ); \n    PRINT_TEST_VECTOR ; \n    sort(test);\
    \ \n    PRINT_LINE ( “after” ); \n    PRINT_TEST_VECTOR ; \n}\n```\n\n`SET_TEST_VECTOR`\
    \ 和 `PRINT_TEST_VECTOR` 预处理器指令不接受任何参数，只是将一个字符串替换另一个。\n\n当编译器发现字符串 `SET_TEST_VECTOR`\
    \ 时，它将其替换为：\n`vector < int >test{ 900, 1,4,-1, 3,6,5,2 }`\n当编译器发现字符串：`PRINT_TEST_VECTOR`\
    \ 时，它将其替换为字符串：`print_vector(test);`\n\n对于 `PRINT_LINE(s)`，这是一个宏，而 ‘s’ 是一个参数。\n\
    \n使用 `PRINT_LINE` 时，我们必须将任何可以被 `std::cout` 使用的内容放在 ‘s’ 之后，由于它是一个宏而不是函数，所以如果我们用它来替换\
    \ ‘s’，那么它是字符串、整数还是任何东西的组合并不重要。`std::cout` 将正常工作而不会报错。\n\n例如：`PRINT_LINE (100);`\
    \ 或 `PRINT_LINE (1 << \"testing\" << 2);` 提示：当发送到宏的元素在宏内部使用时，请使用括号。\n\n为了进一步解释，让我们创建一个宏来打印两个数字，并将其中一个乘以另一个：\n\
