  trans: "\n\n`func1()` 案例是调用者，而 `func2()` 是“等待项（awaitable）”。协程在两者协作时处理它们之间的关系。我们稍后会进一步解释这些术。\n\
    \n正如你可以想象的，协程在线程方面可以产生重大影响，因为它们可以在程序生命周期内管理我们的多任务执行。\n\n为了在代码中使用协程，我们可以使用三种表达式：\n\
    \n- `co_await`– 挂起或恢复函数的执行。\n- `co_return` - 用作返回语句。\n- `co_yield`– 在函数之间的迭代过程中携带值和流。\n\
    \n请注意，`co_return` 和 `co_await` 需要编译器对 C++20 标准的支持（参见 https://en.cppreference.com/w/cpp/keyword\
    \ ）和 https://en.cppreference.com/w/cpp/compiler_support )）。\n\n要更改编译器的配置，请在项目右侧的区域上点击右键，并选择“属性（properties.*.*）”。\n\
    \n当属性窗口打开时，选择“C/C++”，然后选择“命令行（command line.*.*）”。在底部输入“/await”并点击“应用（Apply）”。\n\
    \n![](img/image00196.jpeg)\n\n现在，让我们更好地理解这些表达式：\n\n### co_await 运算符\n\n`co_await`\
    \ 是一个一元运算符，只能在协程内部工作，并赋值给单个值。`co_await` 运算符与等待类型（Awaitable）协同工作——这两者密不可分。事实上，当我们谈论一个“等待者（waiter）”类型时，请记住它是通过协程的三个特殊方法实现的，这些方法是\
    \ `co_await` 的一部分：`await_suspend`、`await_ready` 和 `await_resume`。这些方法的名称可以告诉你很多关于它们的用途和用法。\n\
    \n### co_return 运算符\n\n在使用返回语句的普通函数中，返回值存储在调用者可以访问的位置，通常在函数的激活栈帧或调用者的激活栈帧中，随后它会被销毁。协程改变了调用和返回执行的方式，为了这一目的，使用了三种方法：`Suspend`（挂起）、`Resume`（恢复）和\
    \ `Destroy`（销毁）。同样，正如我们在 `co_await` 中看到的那样，这些方法的名称是清晰的，你可以理解它们的用途。\n\n- `Suspend`\
    \ 操作挂起协程的执行，并负责将执行交回给调用者或恢复状态（取决于该轮到谁）。在此时，激活栈帧将保持完好。\n- `Resume` 操作负责恢复已挂起的协程的执行，使其重新获得控制权。\n\
    - `Destroy` 操作负责销毁激活帧以及协程作用范围内的对象——同时释放已使用的内存。\n\n### co_yield 运算符\n\n`co_yield`\
    \ 与 `co_await` 一起负责挂起协程的操作——这是一个强大的选项。`co_yield` 可以在函数执行过程中挂起其执行。一旦执行被挂起，它将交回给调用者或协程的恢复者。这意味着，如果我们使用\
    \ `co_yield` 来挂起 `func1()`（调用者）的操作，该操作将移动到 `func2()`（恢复者），以此此类推——这一切完全取决于我们定义协程的方式。\n\
    \n重要的一点是，如果你在非协程函数中使用这些表达式，编译器将自动将其转换为协程函数。\n\n让我们看看不使用协程的简单函数语法。在这种情况下，函数计算并返回前\
    \ 10 个斐波那契数列数：\n\n```cpp\n#include \"pch.h\"\n#include <iostream>\nusing namespace\
    \ std;\nint fib( int x ) {\n  if (( x == 1) || ( x == 0)) {\n    return ( x );\n\
    \  } else {\n    return (fib( x - 1) + fib( x - 2));\n  }\n}\nint main() {\n \
    \ int x{ 10 };\n  int i{};\n  while (i < x) {\n    cout <<“ “ << fib(i);\n   \
    \ i++;\n  }\n  return 0;\n}\n```\n当我们运行这段代码时，预期的结果如下：\n\n![](img/image00197.jpeg)\n\
    \n现在让我们看看如何使用协程显示斐波那契数列：\n\n```cpp\n#include \"pch.h\"\n#include <iostream>\n\
    #include <future>\n\nusing namespace std;\n\nfuture < int > my_async( int a ,\
    \ int b ) // 我们的线程函数 {\n  auto fib = std::async([=]()(){\n    int c = a + b ;\n\
    \    return c;\n  });\n  return fib;\n}\n\nfuture < int > my_fib( int n ) {\n\
    \  if ( n <= 2) co_return 1;\n  int a = 1;\n  int b = 1; // 迭代斐波那契数列对于 ( int i\
    \ = 0; i < n - 2; ++i) {\n    int c = co_await my_async(a, b);\n    a = b;\n \
    \   b = c;\n  }\n  co_return b;\n}\nfuture < void > test_async_fib() {\n  for\
    \ ( int i = 1; i < 10; ++i) {\n    int result = co_await my_fib(i);\n    cout\
    \ <<“Coroutine (“ << i << “) for Fibonacci is the number” << result << endl;\n\
    \  }\n}\nint main() {\n  auto fib = test_async_fib();\n  // 测试我们的异步线程 fib\n  fib.wait();\n\
    \  return 0;\n}\n```\n运行这段代码时，预期的结果如下：\n\n![](img/image00198.jpeg)\n\n这里发生的是，当我们调用\
    \ `co_await async_add(a, b)` 时，加法操作在另一个线程中执行的同时挂起执行，然后使用返回值恢复“c =”赋值。然后我们回到下一次执行。\n\
    \n### 协程 'awaitable' 类型\n\n我们在 C++20 新的 std 库中还有 2 个“等待项”。我们也可以使用它们来控制协程函数之间的流：\n\
    \n- 下 `std::suspend_always` 是使用 std::suspend_always 时的语法：\n```cpp\nstruct suspend_always\
    \ {\n  constexpr bool await_ready() const noexcept {\n    return false ;\n  }\n\
    \  constexpr void await_suspend(coroutine_handle<>) const noexcept {}\n  constexpr\
    \ void await_resume() const noexcept {}\n};\n```\n\n- `std::suspend_never`:\n\
    ```cpp\nstruct suspend_never {\n  constexpr bool await_ready() const noexcept\
    \ {\n    return true ;\n  }\n  constexpr void await_suspend(coroutine_handle<>)\
    \ const noexcept {}\n  constexpr void await_resume() const noexcept {}\n};\n```\n\
    \n现在你已经理解了协程的基本逻辑，让我们多谈谈它的结构以及 C++ 在代码中如何接口化。与协程一起使用的有两个主要接口：`Promise` 和 `Awaitable`（你现在应该知道它们了）。\n\
    \n`Promise` 用于定义协程的工作方式、执行时会发生什么以及它将返回什么（包括异常）。这包含了 `co_await` 和 `co_yield` 表达式的行为。\n\
    \n`Awaitable` 定义了 `co_await` 表达式；一旦任何值被 `co_await`，我们就可以预先定义它，以便使用等待对象上的方法。这意味着如果我们想挂起某些内容、返回某些内容或进行任何其他操作，我们就可以定义它。\n\
    \n这看起来是一个复杂的语法和结构，但逻辑非常简单：我们管理并微调两个或多个相互协作函数之间的关系。\n\n请注意，`co_return`、`co_yield`\
    \ 和 `co_await` 需要编译器对 C++20 标准的支持（参见 https://en.cppreference.com/w/cpp/keyword\
    \ ）和 https://en.cppreference.com/w/cpp/compiler_support )）。\n\n关于 C++ 中的协程有很多需要学习和理解的内容，因为这是一个复杂的课题，可以在许多不同的方向上扩展。然而，得益于现在成为\
    \ C++ 一部分的 `<cppcoro>` 类，我们可以从协程的抽象中获益，并更好地理解如何使用它，因为它包含了许多使用的函数。C++20 为我们提供了一个处理协程的框架，这意味着我们必须做很多艰苦的工作。（希望几年后的下一个\
    \ C++ 标准能为我们解决这个问题）。\n\n你可以在这里找到关于协程的额外信息：https://en.cppreference.com/w/cpp/language/coroutines\n\
    \n关于 `<cppcoro>` 的更多信息可以在这里找到：http://www.modernescpp.com/index.php/c-20-coroutine-abstraction-withcppcoro\n\
    \n"
