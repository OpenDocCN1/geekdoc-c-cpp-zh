- fmt: "\n`ReturnType Type ::operator Operator_Name(Type &object);` This is how our\
    \ code would look (assuming that we are dealing with a friend of a class):\n\n\
    ```cpp\nValue operator++(Value &obj); //pre-increment\nValue operator++(Value\
    \ &obj, int); //post-increment\nValue operator--(Value &obj);\nValue operator-(const\
    \ Value &obj);\n```\n\nIn a very similar manner, we can overload non-member functions\
    \ with binary operators (`+`, `-`, `==`, `!=`, `<`, `>` and more). You can see\
    \ that the main difference is that we have two parameters in the parameter lists\
    \ and not a single parameter, as we did in the unary operators. In this example,\
    \ the two parameters are named `left hand side (lhs)` and `right hand side (rhs)`.\n\
    \nThis is how our method prototype would look (assuming that we are dealing with\
    \ a friend of a class):\n\n`ReturnType operator *Operator_Name*(const &Type lhs,\
    \ const &type rhs);`\n\nThis is how our code will look:\n\n```cpp\nValue operator\
    \ +(const &Value lhs, const &Value rhs); \nValue operator -(const &Value lhs,\
    \ const &Value rhs); \nbool operator ==(const &Value lhs, const &Value rhs); \n\
    bool operator !=(const &Value lhs, const &Value rhs); \nbool operator <(const\
    \ &Value lhs, const &Value rhs);\n```\n\n# Chapter 18: C++ Encapsulation\n\nEncapsulation\
    \ is one of the several fundamental pillars in object-oriented programming, along\
    \ with inheritance and polymorphism—which we will explain in the sections following\
    \ this one. The basic concept of encapsulation is that there is no need to expose\
    \ the inner details of your class to the outside. It is called data hiding, and\
    \ this means you provide only the necessary access to your class members. Others\
    \ even say that encapsulation is like taking all your problems and placing them\
    \ inside a pill-shaped capsule. When you buy a TV, you can open the screws and\
    \ connect one wire to another. Doing so will turn channels or turn the TV on and\
    \ off, but the manufacturer has created dedicated buttons or options to do this.\
    \ The same applies to a class. Data hiding allows you to mark how the class should\
    \ be used by others. This is, in fact, an abstraction—you don’t need to know how\
    \ the wires are connected, or how the electronics of the TV work. You only need\
    \ to know how to plug it in, turn it on, and use the remote control. The second\
    \ important benefit of encapsulation is that it allows us to control who has access\
    \ to our program and who doesn’t. In order to achieve encapsulation, we use two\
    \ methods:\n\n- Using access modifiers. You already know the `private`, `public`,\
    \ and `protected` access modifiers that we have introduced earlier.\n- Using getters\
    \ and setters. Getters and setters are simple, yet powerful functions that provide\
    \ us with a fine-tune control on how our private data members are being accessed.\
    \ We will demonstrate and explain more about setters and getters shortly.\n\n\
    In fact, it ’s important to point out that declaring data members as `private`\
    \ or as `public` makes no effect on the efficiency of the code execution, and\
    \ the point of view of the compiler doesn’t change much. Some coders make all\
    \ their data members `public`, and it does not slow down the program, neither\
    \ does it cause it to consume more memory. The only advantage (and this is a very\
    \ important advantage) of encapsulation is the readability of the code and the\
    \ usability of the class, later on, by other coders or even yourself. Declaring\
    \ a data member as `private` assures that you make a note not to access this data\
    \ member directly from outside the class, but instead use the dedicated function/s\
    \ to do so. In such function, you may add log file entries, so you don’t want\
    \ the data member to be accessed by this function, thus losing the log entry,\
    \ and so on. The public data members are the front end of the class. They reflect\
    \ on what you want a user of your class to do.\n\n## How to use getters and setters\n\
    \nUsing getters and setters allow you to control private data members, and should\
    \ be used only when you really need to fine-tune this access. Let’s say we have\
    \ a class that represents the level of professional marathon runners. There are\
    \ three levels: gold, silver, and bronze:\n\n```cpp\n#include \"pch.h\" \n#include\
    \ <iostream> \n// We define a class named Marathon \n// It is used to classify\
    \ runners based on their \n// membership level which can be: Gold, Silver and\
    \ Bronze. \n// The default level is“gold”. We use getter and setter functions\
    \ to set or\n// get the values. The membership level is stored in the“private”\
    \ section and\n// can ’t be access directly but only using the getter and setter\
    \ function. \nclass Marathon { \nprivate : \n    std:: string level = “gold” ;\
    \ //default level \npublic : \n    std:: string name; \n    std:: string get_level()\
    \ { \n        return level; \n    } \n    void set_level(std:: string value )\
    \ { \n        if ( value ==“gold” || value == “silver” || value == “bronze” )\
    \ { \n            this ->level = value ; \n        } \n    } \n    Marathon(std::\
    \ string name , std:: string value ) { \n        this ->name = name ; \n     \
    \   this ->level = value ;\n    }\n    ~Marathon() {} \n}; \nint main() { \n \
    \   Marathon value( “John” , “silver” ); \n    value.set_level(“bronze” ); \n\
    \    std::cout << value.get_level().c_str() << std::endl; // displays bronze value.\n\
    \    value.level = “green” ; // error! we cannot access level in main! \n}\n```\n\
    \nIn this example, we have a public method `get_level`, yet this method needs\
    \ to access a private data member `value`. The method `get_level` is a getter,\
    \ and it is within the scope of the class, so it has access, but anything else\
    \ outside the class will not have access. We have another method named `set_level`,\
    \ which is our setter. It sets the value of `level` and uses `this` pointer to\
    \ do so. (In other programming languages, you might encounter the term `property`,\
    \ which does a similar thing as getters and setters in a single function. In C++,\
    \ we use both functions.)\n\nWe then want to change the value of `level` using\
    \ the assignment operator by using this line:\n\n`value.level = \"green\" ; //\
    \ error! we cannot access level in main!`\n\nWe will get a compiler error. So,\
    \ you can see that without the use of the getter and setter functions, we cannot\
    \ access the private data member. When we comment on the problematic line, we\
    \ get this result:\n\n![](Images/image00162.jpeg)\n\nAs you can see, the se tter\
    \ doesn’t allow us to change the value object. This is a very powerful and useful\
    \ concept you will often see in C++.\n\n# Chapter 19: Inheritance\n\nInheritance\
    \ allows us to use existing classes to create new ones and is often used in C++\
    \ programs. The newly created class “inherits” the behavior and data from another\
    \ used class, reusing methods, and more. This is a great way to save time and\
    \ hard work, as we can focus on the commonality within the classes, such as attributes\
    \ and methods, while we can modify some for the use cases of our newly created\
    \ class. For example, if we have a class for checking accounts, we can use inheritance\
    \ to create a class for savings accounts, student accounts, trust accounts, and\
    \ more. This is done because many of the attributes, class methods, and functions\
    \ will be the same (i.e., account name, number, deposits, withdraws, etc.). When\
    \ talking about inheritance, we can use single inheritance or multiple inheritance.\n\
    \nA single inheritance is a class that is created from a single class. Multiple\
    \ inheritance is when a single class is created from two or more classes.\n\n\
    The class being inherited from is called the `base class`, `super class`, or `parent\
    \ class`. The class that is being created from the parent class is called `derived\
    \ class`, `sub class`, or `child class`.\n"
