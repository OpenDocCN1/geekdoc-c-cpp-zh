    # **Chapter 20: Polymorphism**


    Polymorphism is one of the powerful parts of object-oriented programming. C++
    offers several types of polymorphism, and they all go hand in hand with inheritance.
    In this section, we will introduce the basic concepts of polymorphism, as this
    can be an advanced and complex concept to master. But first, before we explain
    what polymorphism is, let’s go over some terminology which you might already know,
    while some might be new to you.


    When a program runs, the compiler knows how to bind the correct methods and data
    members; this is called static binding. It is the default and the most common
    type of binding in most C++ programs. However, sometimes we want to control what
    exactly happens during run time, and C++ allows us to do this by using pointers,
    references, and declaring virtual functions. Also, polymorphism allows us to have
    a more abstract way of writing our program, which can be very useful. When our
    code seems to be complex sometimes, polymorphism will use more general terms,
    less precise, and complex statements. Think about asking your program to simply
    print or write.'
