- fmt: "\n- Associative containers– these containers insert elements in a defined\
    \ order or with no order to create powerful data structures. For example, `set`,\
    \ `map`, etc. You may not be familiar with these terms yet, but as you continue\
    \ to advance your knowledge in C++, you will probably know them by heart.\n- Containers\
    \ adapters – Container adaptors cannot be used with the algorithm library, but\
    \ they are often used in C++, so STL supports them. For example, `stack` and `queue`\
    \ are fundamental data structure concepts in computer programming, and we will\
    \ discuss them later on in this section.\n\nIt is important to note that there\
    \ are over 100 algorithms in the C++ STL! That is a huge number, making C++ a\
    \ robust tool. Some new algorithm classes were added to C++20. The algorithm types\
    \ are divided into two main categories: modifying algorithms and non-modifying\
    \ algorithms—it all depends on if the algorithm modifies the sequence or not.\n\
    \n## Programming with macros\n\nIf you have never used macros or you’re not familiar\
    \ with them, you should understand that macros have no programmatically used logic.\
    \ In fact, macros are more like a search-replace feature within your code. The\
    \ best way to describe it is to imagine that you have a personal assistant that\
    \ searches certain strings and patterns within your code before compilation and\
    \ replaces them with other strings or patterns. Macros do not impact the program\
    \ itself but can assist you in making your code more readable and manageable.\
    \ However, macros might cause your debugging to be harder to manage—so beware\
    \ of using them.\n\nThe `#define` preprocessor directive can be used to define\
    \ a given string that will be replaced with another string before compilation\
    \ (hence the term ‘preprocessor directive’).\n\nMoreover, a `#define` directive\
    \ can include one or more parameters, making it a Macro.\n\nHere is an example:\n\
    ```\n#define SET_TEST_VECTOR vector < int >test{ 900, 1,4,-1, 3,6,5,2 } \n#define\
    \ PRINT_LINE (s) cout << s << endl \n#define PRINT_TEST_VECTOR print_vector(test);\
    \ \nint main() { \n    SET_TEST_VECTOR ; \n    PRINT_LINE ( “before” ); \n   \
    \ PRINT_TEST_VECTOR ; \n    sort(test); \n    PRINT_LINE ( “after” ); \n    PRINT_TEST_VECTOR\
    \ ; \n}\n```\n\nThe `SET_TEST_VECTOR` and `PRINT_TEST_VECTOR` preprocessor directives\
    \ don’t accept any parameters and just replace one string with another.\n\nWhenever\
    \ the compiler finds the string `SET_TEST_VECTOR`, it replaces it with:\n`vector\
    \ < int >test{ 900, 1,4,-1, 3,6,5,2 }`\nWhenever the compiler finds the string:\
    \ `PRINT_TEST_VECTOR` It replaces it with the string: `print_vector(test);`\n\n\
    As for `PRINT_LINE(s)`, this is a Macro, and the ‘s’ is a parameter. \n\nWhen\
