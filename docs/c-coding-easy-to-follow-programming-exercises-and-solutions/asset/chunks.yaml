  trans: "\n通常，当你需要快速运行程序时会栈（stack），因为从栈中存储和提取值非常快，即使对于非常老的 CPU 也是如此。然而，栈的可用空间是有限的，因此对于大对象或需要扩展内存的情况，栈将无法工作。另一个问题是尝试从栈中提取数据时。让我们回到书的类比：当你试图从一堆书的中间抽出一本书时，你需要先抬起上面的书；否则，书堆就会崩塌。栈也是如此——为了获取存储在栈中间某个处的值，计算机需要先经过上面的所有内容，才能挖进去。我们如何解决这个问题呢？我们只需使用堆（heap）内存。\n\
    \n# 堆，堆，万岁！\n\n堆是一块可以动态分配的内存池，它与指针配合得很好，正如我们稍后将的那样。数据在堆中的分配和排列方式与在栈上的方式不同，基本上，它是随机堆积的。在处理堆时，有几个关键规则需要记住，我们稍后会介绍它们。你应该记住，在使用完存储的值后要从堆中释放它，否则你将遇到所谓的“内存泄漏”。堆对变量的大小没有限制，机器上明显的物理内存限制除外。此外，与运行非常快的栈不同，堆在读写内存时速度要慢一点。\n\
    \n这就是我们的变量在堆中显示的方式：\n\n# 空函数 my_stack_program\n\n![](img/image00147.jpeg)如果你想学习更多关于栈和堆的知识，请访问：https://www.learncpp.com/cpp-tutorial/79-the-stack-and-the-heap/\n\
    \n## 声明指针变量\n\n声明指针变量的语法与声明变量的方式相似，只需在变量名开头添加星号 `*`：\n\n`variable_type *pointer_name`\n\
    \n以下是一些指针可能的外观：\n\n- `int *sum;`\n- `char *first_letter;`\n- `string *user_name;`\n\
    - `double *temp;`\n\n要记住，在这种情况下，星号符号并不被用作数学运算符。\n\n## 初始化指针\n\n初始化指针的逻辑与变量初始化相同。然而，我们希望确保指针不会指向任何地方，而是指向一个特定的内存地址，或者完全不指向任何地址。我们还可以初始化指针指向一个变量或函数。这听起来并不想象中那么复杂。首先，在你的代码中，在使用所有指针之前**必须**初始化它们，否则指针将指向任何地方的垃圾地址，那不是我们想要的。让我们先看看初始化指针以指向地址时需要使用的语法：\n\
    \n`variable_type *pointer_name (nullptr)`\n\n我们使用 `nullptr`，这就像是将指针指向地址零，意味着我们的指针将不指向任何地方。如果你的指针没有指向变量或函数，在初始化它时始终使用\
    \ `nullptr`。\n\n我们稍后将深入介绍指向变量和函数的指针初始化。\n\n## 访问指针地址\n\n当我们想要访问指针所指向的地址时，我们使用地址运算符\
    \ `&`，它是一个一元运算符（如果你不记得什么是一元运算符，应该查阅运算符章节）。\n\n让我们回顾一个使用简单变量的示例：`int *age`\n\n\
    ```cpp\n//初始化 age 为 50\nint age {50}; //我们可以使用 sizeof 运算符检查 age 的大小\n\n//（大小将是\
    \ 4）\ncout <<“Size of the int age is“ << sizeof (age) << endl;\n//我们可以检查 age 的值（即\
    \ 50）\ncout <<“The value of age is“ << age << endl;\n//我们可以使用地址运算符检查 age 的地址\n\
    cout <<“The address of age is ” << &age << endl;\n```\n\n让我们看看使用指针变量运行这段代码时会发生什么：\n\
    \n```cpp\n#include \"pch.h\"\n#include <iostream>\nusing namespace std;\nint main()\
    \ {\n    //将 age 初始化为 nullptr（所以它不指向任何地方）\n    int *age{ nullptr };\n    //我们可以使用\
    \ sizeof 运算符检查 age 的大小（大小将是 4）\n    cout <<“Size of the age is“ << sizeof( age)\
    \ << endl;\n    //我们可以检查 age 的值\n    cout <<“The value of age is“ << age << endl;\n\
    \    // 我们可以使用地址运算符检查 age 的地址\n    cout <<“The address of the pointer is“ << &age\
    \ << endl;\n}\n```\n\n当我们运行这段代码时，我们应该得到这个：![](img/image00148.jpeg)\n\n要记住，指针的大小与它所指向变量的大小不同。这意味着如果指针变量\
    \ `int *age` 指向类型为 `long long` 的变量，即使任何 `long long` 变量的大小都是 8 字节，`age` 的大小也将是\
    \ 4 字节。\n\n## 访问指向的数据\n\n如果我们想要访问指针所指向的数据，这被称为解引用（dereferencing）指针，基本上，它遵循指针指向的位置并访问数据。为了做到这一点，我们使用星号运算符\
    \ `*`。是的——星号。你可能觉得这没道理，因为我们在声明指针时用过星号，你是对的。这是一个被 C++ 用户高度批评的选择，因为将同一个运算符用于两个不同的目的可能会令人困惑。然而，一旦我们过过一些示例，你会有更好的感觉，并可能发现这没那么困惑了。\n\
    \n让我们看一个示例：\n\n```cpp\n//声明并初始化一个名为 letter 的字符\nchar letter {'a'};\n\n//我们声明并初始化一个名为\
    \ letter_ptr 的指针，并将其指向 letter 的地址\nchar *letter_ptr {&letter};\n\n//现在我们解引用 letter_ptr;\n\
    cout << *letter_ptr << endl;\n```\n\n当我们运行这段代码时，我们得到的是![](img/image00149.jpeg)\n\
    \n所以，你看到我们使用解引用运算符遵循指针，这引导我们到达指针所指向的数据，在这种情况下，是字母 a。\n\n如果我们更改指针的值会发生什么？\n\n让我们在代码中添加这一行：\n\
    \n```cpp\nletter_ptr = 'b';\ncout << *letter_ptr << endl;\ncout << letter << endl;\n\
    ```\n\n我们得到的是![](img/image00150.jpeg)\n\n发生了什么？我们通过指针更改了 letter 的值。为了理解这一点，你需要在\
    \ C++ 中学习左值（L values）和右值（R values）。\n\n左值（lvalue）是指特定内存位置的值，你可以通过指针访问它，例如：\n\n\
    ```cpp\nint num {100}; //num 是左值\nstring name {Alex}; //name 是左值\n```\n\n如何判断一个值是否可以被访问？简单，如果你可以将其放在赋值语句的左侧：\n\
    \n```cpp\nnum = 200; name = Donald;\n```\n\n注意，数字 200 和名字 Donald 不是左值，它们是字面量，不能放置在赋值语句的左侧：\n\
    \n```cpp\n200 = num; //这不是有效的语句！\n\"Donald\" = name; //这不是有效的语句！\n```\n\n事实上，这些值是右值。右值，正如你所猜的，是左值的相反，因为它们不可寻址且不可赋值，正如我们从最后的语句中看到的。右值将出现在赋值语句的右侧，并且总是字面量。通常情况下，你可以说任何不是左值的都是右值。\n\
    \n重要的是了解左值、右值，并理解它们之间的区别。我们稍后会回到这些术语上。让我们回到指针，看看关于解引用它们的另一个示例：\n\n"
- fmt: "\n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    //declaring\
    \ and initializing a string to“David”\n    string name {\"David\"};\n    //we\
    \ declare and initialize a pointer named name_prt and initialize\n    //it to\
    \ point to the address of name.\n    string *name_ptr{ &name };\n    //now we\
    \ dereference letter_ptr;\n    cout << (*name_ptr).c_str() << endl;\n    //now\
    \ we assign the name“James” to name;\n    name =“James\";\n    cout << (*name_ptr).c_str()\
    \ << endl;\n    cout << name.c_str() << endl;\n}\n```\n\nNow that have a pretty\
    \ good sense of what pointers are, how, and when to use them, let’s dive a bit\
    \ deeper and explain further how to use pointers to allocate memory dynamically.\n\
    \n## Dynamic memory allocation with pointers\n\nOne of the great things about\
    \ C++ is that it allows us to truly control every aspect that is affected by our\
    \ program, and memory is a meaningful part of that. In many cases, we don’t really\
    \ know in advance how much memory is needed in order to perform a specific action,\
    \ especially when we work with arrays or even more with vectors. The solution\
    \ in these cases is to allocate the required memory space during runtime. Here\
    \ is where pointers come into the picture: we use pointers to allocate memory\
    \ dynamically on the heap. Dynamic memory allocation is important, and you will\
    \ use it in many cases in your program, so it’s important to truly understand\
    \ it.\n\nWe already explained the basics of the heap and the stack, and in this\
    \ section, we will explain it even further.\n\nIn order to allocate memory dynamically\
    \ on the heap, we use the `new` keyword:\n\n`int *ptr = new int; //allocating\
    \ memory for an integer on the //heap using “new”`\n\nBy using `new`, instead\
    \ of assigning an address of an integer to the pointer, (like we did previously),\
    \ we actually create an address dynamically during runtime. You just have to remember\
    \ that until you initialize, the storage will contain garbage data. Let’s see\
