  trans: "\n\n与变量命名方式类似，函数名必须具有意义。它通常是一个动词，例如 `Calculate_Entries` 或 `Return_Value`。这将是你将要使用的函数的实际名称。名称必须简单，并能概括地描述该函数的功能。如果你将函数命名为\
    \ `Func1` 或 `My_Function`，它们将没有任何意义且难以于追踪。\n\n多年来，关于如何命名函数已经出现了几种标准。过去，函数的命名非常短，例如使用字母\
    \ `F`，但现今的惯例是分配较长的名称，这可以非常清楚地说明函数的功能。最佳实践是每个单词的首字母大大写，并在单词之间使用下划线。这样，你可以一眼看出一个用于查找狗的年龄的函数：\n\
    \n`Return_Age_Of_Dog`。\n\n## 2. 参数列表\n\n参数列表是函数将使用的变量列表，并对它们的类型进行了指定。函数可以获取 0\
    \ 个到任意数量的参数。参数是函数执行其工作所需的数据项。让我们来看一个例子：\n\n如果你编写一个函数来提取每个州的首府城市名称——只需要一个参数——州名。如果你需要检索一个人的\
    \ ID 号，你可能需要他们的名字、姓、出生日期、父亲的名字——总共 4 个参数。换句话之，你需要根据函数执行的操作来设置该函数将使用的参数数量。\n\n\
    ## 3. 返回类型\n\n函数可以返回任何类型的值。该值有一个类型——例如整数（`int`）。在函数不返回任何值的情况下，返回类型将为 `void`。在定义函数时，你必须选择返回类型。\n\
    \n## 4. 函数体。\n\n函数体是作为函数一部分使用的实际语句，换句话说：一旦调用此函数，将会发生什么。语句必须始终位于大括号 `{ }` 之间。\n\
    \n让我们看看使用 C++ 语法看起来是什么样子：\n\n```cpp\nint Function_Name () // 函数类型、名称和参数 {\n  \
    \  Function Statements (a);\n    return 0; // 这是可选的，因为函数可能不返回任何内容 \n}\n```\n\n\
    在编写函数时，如果使用了两个或多个参数，其执行顺序将与你的参数参数的顺序相同。让我们来看一个例子：\n\n```cpp\nvoid function_name\
    \ (char a, int i) {\n    statements (a);\n    return 0; \n}\n```\n\n在这种情况下，`char\
    \ a` 将在 `int i` 之前调用。\n\n让我们尝试写一个简单的函数，每当被调用时像猫一样说“miauu”。它不返回任何内容，只有 `cout “miauu.”`。它看起来像这样：\n\
    \n```cpp\nvoid cat_sound () { cout << \"miauu\" << endl; }\n```\n\n非常简单对吧？现在我们已经定义了函数，现在可以从\
    \ `main` 中调用它。它看起来像这样：\n\n```cpp\nvoid cat_sound () { cout << \"miauu\" << endl;\
    \ } \nint main () { \n    cat_sound (); \n    return 0; \n}\n```\n\n### 函数原型\n\
    \n自然地，编译器必须在函数被调用**之前**知道函数的细节；否则，我们将遇到编译错误。原因是编译器无法检查传递的参数数量以及参数类型是否正确。除了直接定义函数外，还有另一种方法可以实现这一点。这被称为函数原型（Function\
    \ Prototype）。我们的函数原型告诉编译器它需要知道的一切，即使我们还没有函数定义。在有更复杂的函数的情况下（例如一个调用另一个函数的函数），使用它是很好的。我们始终会在程序开头或\
    \ `.h` 文件（头文件）中使用函数原型，我们稍后会讨论这些。它的优点是，你可以使用任意数量的函数原型，而且你编写它们的顺序并不重要。\n\n让我们看看使用我们之前的示例，函数原型是什么样子：\n\
    \n```cpp\nvoid cat_sound (); // 函数原型——注意末尾的分号！ \nint main () { \n    cat_sound\
    \ (); \n    return 0; \n} \nvoid cat_sound () // 所以函数可以在以后定义 { \n    cout << \"\
    miauu\" << endl;\n}\n```\n\n### 函数参数和返回语句\n\n我们已经解释了什么是函数参数什么是返回语句。让我们进一步回顾它们，并学习如何在代码中使用这些内容。\n\
    \n当我们定义函数时，我们定义了参数。在调用函数时，这些参数被称为“实参”（arguments），正如我们已经解释过的样，它们在数量和类型上必须匹配；它们按照定义的顺序被调用。\n\
    \n让我们来看一个例子：\n\n```cpp\nint multiply_numbers (int, int); // 函数原型 \nint main ()\
    \ { \n    int calculation = {0}; \n    calculation = multiply_numbers (6, 9);\
    \ // 函数调用 \n    return 0; \n} \nint multiply_numbers (int a, int b) // 函数定义 {\
    \ \n    return a * b; \n}\n```\n\n### 向函数传递数据\n\n在 C++ 中，向函数传递数据是通过值传递（by value）实现的。这意味着数据的副本被传递给函数，如果你的函数更改了数据，它**不会**更改所传递的实际参数。编译器只使用数据的副本，而不是数据本身。复制数据有优缺点，我们将进一步讨论。尽管如此，你必须注意，在函数头中定义的实际参数被称为形参（formal\
    \ parameters）。相比之下，在函数调用中被复制的参数是实参（actual parameters）。\n\n### 返回语句\n\n我们已经讨论了返回语句是可选的。函数可以返回一个值，也可以不返回，这没关系。当函数确实返回一个值时，可以在任何地方返回。\n\
    \n让我们结合目前学到的所有知识编写一些更复杂的内容。我们将回到之前完成的华氏度到摄氏度的计算，但这次我们必须使用函数。\n\n这次我们将使用 `cmath`\
