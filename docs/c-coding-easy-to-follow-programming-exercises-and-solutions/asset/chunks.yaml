    When you begin working as a programmer, you will soon find out that both composition
    and inheritance are used together. Now let’s see how we can use inheritance to
    derive a new class from an existing one.


    The first thing we need to do is to declare the parent class. As you already know,
    this class has its own data members:


    **class Parent { //class members };**


    Now, we have to declare our child class, and for that, we will need an access
    specifier (private, public, or protected) and the name of the base class:


    **class Child: access-specifier Parent { //derived class members };**


    It is important to understand what the access specifiers mean when we deal with
    inheritance. In most other programming languages, you will encounter only public
    inheritance, yet in C++, we have all 3 options. First, the most commonly used
    access specifier is public, and it establishes the“is-a” relationship we explained
    earlier in this section. Note: if you don’t specify the access specifier, the
    private inheritance will be used by default. The second option is to use private
    or protected access. Doing so will establish a “has-a” relationship between the
    child and parent class. In the section, we will focus on public inheritance. If
    you wish to learn more about private or protected inheritance, you can find additional
    information in the following link: https://www.learncpp.com/cpp-tutorial/115-inheritance-and-access-specifiers/


    Let’s review an example of a parent and child classes using public inheritance:


    **class Account //parent { //here we define the class member }; class Trust_Account:
    public Account //child { //here we define the derived class members };**


    When looking at these two classes, we can ask: is a trust account an account?
    The answer is yes. You can see that there is an“is-a” relationship between the
    two classes. Now we can specify special behaviors to the Trust_Account class,
    yet the rest will be derived from the Account class.


    This all looks very simple, and it is, but bear in mind that inheritance can become
    pretty complex sometimes as the complexity of your code grows.


    Let ’s review simple code that demonstrates the use of inheritance. In this example,
    we created a class named Animals, and we created two child classes: Dog and Cat.


    Let ’s first look at the Class prototype in the .h file: **#pragma once class
    Animal { public : virtual void SaySomething(); };** And now let’s look at the
    .cpp file for Animal: **#include <iostream> #include“Animal.h” using namespace
    std; void Animal ::SaySomething() { cout <<“I don’t know what to say...” << endl;
    }** Now we have two derived classes. Here is the .h file of Dog class: **#pragma
    once #include“Animal.h” class Dog : public Animal { public : void SaySomething();
    };** And the .h file of Cat class: **#pragma once #include“Animal.h” class Cat
    : public Animal { public : void SaySomething(); } ;** Now let’s look at the .cpp
    file of Dog: **#include <iostream> #include“Dog.h” using namespace std; // This
    is the Doc inherited SaySomething() function. // It is inherited from the Animal
    class which has a virtual //function by that name // The Virtual function is like
    a placeholder for the real //function inherited by each derived class // namely:
    Cat and Dog void Dog ::SaySomething() { cout <<“How How” << endl; }** And now
    Cat .cpp file: **#include "Cat.h" #include <iostream> using namespace std; //
    This is the Cat inherited SaySomething() function. // It is inherited from the
    Animal class which has a virtual //function by that name // The Virtual function
    is like a placeholder for the real //function inherited by each derived class
    // namely: Cat and Dog void Cat ::SaySomething() { cout <<“Miahu Miahu” << endl;
    }**


    This simple example shows how we can inherit a function and modify it specifically
    per class. Let’s run our program from main():


    #include <iostream> #include “Animal.h” #include“Dog.h” #include“Cat.h” int main()
    { Dog myDog; myDog.SaySomething();


    // the same function (SaySomething) will return“How How” for //the dog.


    **Cat myCat; myCat.SaySomething(); // the same function (SaySomething) will return
    Miahu for the //cat. }** This is what we should expect:


    ![](Images/image00164.jpeg)**Constructors and destructors when using inheritance**


    In C++, a child class inherits the constructors from its parent class, but before
    any derived object can be initialized, first, the parent class is executed, and
    then the child class executes. There is a sense that, as the derived class might
    use information encapsulated in the base class, this means that the parent class
    will execute the constructor first, and only then, the child class will execute.


    The destructors are revoked in the reverse order of the constructors. First, the
    derived part must be destroyed, and only then the base part can be destroyed.
    This is the order of operation we should expect:


    ![](Images/image00165.jpeg)**Base / Parent class:


    Derived / Child class:**


    ![](Images/image00166.jpeg)


    Note: The order of construction and destruction applies whether we have one derived
    class or multiple derived classes. Since the base class constructor initializes
    first, some of these constructors must be invoked. In fact, the derived class
    can invoke constructors, destructors, and overloaded assignment operators.'
