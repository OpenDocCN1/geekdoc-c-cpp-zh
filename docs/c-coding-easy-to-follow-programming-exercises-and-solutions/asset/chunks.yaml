    \ endl;\n    } else {\n        cout <<“sorry, you are too young to drive” << endl;\n\
    \    }\n}\n```\n\n## 嵌套 if 语句\n\n`嵌套 if 语句` 是存在两种以上可能性的语句，它们可能相当复杂。程序将从一个语句移动到另一个语句并检查值是否为真，如果是假则移动到下一个语句。\n\
    \n让我们再次看看驾考示例。在上一个例子中我们只给了两个条件，但如果我们增加另一个条件呢：超过 100 岁的人。让我们看看这在我们的代码中应该是怎样的：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    int age;\n\
    \    cout <<“Please enter your age” << endl;\n    cin >> age;\n    if (age >=\
    \ 18) { // 第一个条件\n        cout <<“you are over 18 years old” << endl;\n      \
    \  if (age <= 100) { // 第二个条件\n            cout <<“you are eligible to drive”\
    \ << endl;\n        } else {\n            cout <<“you are too old to drive” <<\
    \ endl;\n        }\n    } else {\n        cout <<“sorry, you are too young to\
    \ drive” << endl;\n    }\n}\n```\n\n试一试！尝试编写你自己的 `if` 语句。让它们变得复杂一点——尝试不同的条件、选项——看看它们在你的程序中是如何运行的。\n\
    \n# 第 7 章：字符串\n\n1. 字符串的基础：什么是字符串以及何时使用它们？要理解字符串，你首先需要理解什么是字符（character）。字符是一种存储字母数字数据的数据类型。\n\
    \n字母数字数据可以是字母表中的任何字母，以及数字和特殊符号。\n\n字母数字数据的示例可以是：\n\na. `‘a’` 字母表中的任何字母，从`‘a’`\
    \ 到`‘z’`，以及大写的`‘A’` 到`‘Z’`。 b. `‘$’` 任何特殊符号，如`$``,`#`,`@` 等。 c. `‘1’` 从 `0` 到\
    \ `9` 的任何数字。在 C++ 中，字符存储在一种名为 `char` 的数据类型中。字符串是存储一个或多个字符的数据类型。它可以有几种形式，这些这些将在稍后讨论：\n\
    \n- 作为 `char` 元素的数组。\n- 作为 `char` 元素的 `vector`。\n- 作为用于存储整个字符串的特殊数据类型。**字符串总是以\
    \ NULL 终止的。** 在 C++ 中，字符串总是以空字符终止。\n\n换句话说，如果我们的字符串是“house”，它将如下存储：\n\n`H O U\
    \ S E \\0`\n\n`\\0` 表示我们放置的是值‘null’而不是数字 0。\n\nð 每一个字母数字符号都有一个数值。从计算机的角度来看，这些值才是重要的。最初这些值的范围是从\
    \ 0 到 127，而今天可以多达 5 位数。值 0（最后一个值）表示 `NULL`，用于标记字符串的结束。\n\n## 2. 声明字符串变量\n\n在 C++\
    \ 中有多种声明字符串的方法，大多数情况下，你声明一个字符串时并不知道要放入其中的文本大小。在某些情况下，你定义了此类文本的最大尺寸，但也有字符串数据类型不实施这种限制。\n\
    \n例如：`std::string mystring;`\n\n这将 `mytext` 声明为 `std::string` 变量。它可以容任何大小或任何数量字符的文本。\n\
    \n## 3. 操作字符串\n\nC++ 有许多操作字符串的方法，如下所示：\n\n### a. 字符串内容\n\n首先，我们应该讨论一些基本问题：我们如何给字符串分配任何内容？我们如何在稍后设置不同的内容？我们如何读取它？\n\
    \n在这个示例中，我们使用 `std::string` 来包含一个字符串：\n\n```cpp\nstd::string test1(\"this is my\
    \ string\");\n```\n\n在接下来的示例中，我们使用 char 字符数组：\n\n```cpp\nchar test1[] = \"test\"\
    ;\n```\n\n现在让我们看看我们如何给字符串设置新值：\n\n```cpp\nstd::string test1 = \"test\";\n```\n\
    \n对于对于数组，我们使用 `strcpy_s`：\n\n```cpp\nstrcpy_s(test1, \"this is new value\");\n\
    ```\n\n### b. 字符串拼接\n\n当你有两个或多个字符串，并且想要将它们拼接时，可以使用几种可选方法。\n\n这里是一个示例。在这个示例中，我们不会使用字符串库，只使用内置的字符串函数。我们将每个字符串定义为数组。\n\
    \n```cpp\nint main() {\n    char string1[] = \"word1\";\n    char string2[] =\
    \ \"word2\";\n    char result[160];\n    strcpy_s(result, string1);\n    strcat_s(result,\
    \ \" \");\n    strcat_s(result, string2);\n    std::cout << result << \"\\n\"\
    ;\n}\n```\n\n### c. 字符串长度\n\n当我们说“字符串长度”时，通常指的是此字符串内的字符数。另一种查看方法是测量存储字符串所占的尺寸（字节）。注意，尽管单个字符存储在单个字节中，但在涉及更复杂的编码方法（如\
    \ UNICODE）时，每个 `char` 元素的大小将大于一个字节，因此“字符串长度”和“字符串大小”可能是两个不同的东西。\n\n让我们取上一个示例的生成字符串的长度。这是更新后的源代码：\n\
    \n```cpp\nint main() {\n    char string1[] = \"word1\";\n    char string2[] =\
    \ \"word2\";\n    char result[160];\n    strcpy_s(result, string1);\n    strcat_s(result,\
    \ \" \");\n    strcat_s(result, string2);\n    int lengthOfString = -1;\n    lengthOfString\
    \ = strlen(result);\n    std::cout << result << \"\\n\" << \"Length of string\
    \ is \" << lengthOfString << \"\\n\";\n}\n```\n\n## 4. 用户输入和字符串\n\n"
- fmt: "\nWhen strings are used, we can, of course, assign the value to them as part\
    \ of our source code. However, this means that their value will always be the\
    \ one we assign to them during the development of our program. For example, `string1`\
    \ will always contain “word1,” and `string2` will contain “word2.” \n\nHowever,\
    \ the real value and advantage of using strings (and any other data type for that\
