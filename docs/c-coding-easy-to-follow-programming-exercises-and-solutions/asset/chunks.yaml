    ![](Images/image00198.jpeg)


    What happened here is that when we call co_await async_add(a, b), the add operation
    executes in another thread while suspending the execution, then it resumes the
    “c =” assignment with the return value. We then move back to the next execution.


    **The coroutine ''awaitable'' types**


    We also have 2 ‘awaitables’ that we can use in C++20 new std:: library. We can
    also use it to control the flow between the functions Coroutines:


    - **std::suspend_always** below is the syntax used when using std::suspend_always
    **struct suspend_always { constexpr bool await_ready() const noexcept { return
    false ; } constexpr void await_suspend(coroutine_handle<>) const noexcept {} constexpr
    void await_resume() const noexcept {} };**


    - **std::suspend_never struct suspend_never { constexpr bool await_ready() const
    noexcept { return true ; } constexpr void await_suspend(coroutine_handle<>) const
    noexcept {} constexpr void await_resume() const noexcept {} };**


    Now that you understand the basic logic of Coroutines, let ’s talk a bit more
    about the structure and the way C++ interfaces it within code. There are two main
    interfaces used with Coroutines: Promise and Awaitable (which you should already
    know by now).


    Promise is used to define the way the Coroutine will work, what will happen upon
    execution, and what it will return (including exceptions). This also includes
    the behavior of co_await and co_yield expressions.


    Awaitable defines the co_await expression; once any value is co_await, we can
    pre-define it in order to use the methods on the awaitable object. It means that
    we can define it if we want to suspend something, return something, or do any
    other thing.


    It seems to be a complex syntax and structure, but the logic is pretty simple:
    we manage and micromanage the relationship between two or more functions, which
    co-work with each other.


    Please note that co_return, co_yield, and co_await require compilers'' support
    for the C++20 standard (see


    https://en.cppreference.com/w/cpp/keyword ) and


    https://en.cppreference.com/w/cpp/compiler_support .


    There is a lot to learn and understand about Coroutines in C++ as this is a complex
    subject that can be expanded in many different directions. Yet, thanks to the
    <cppcoro> class that is now a part of C++, we can benefit from an abstraction
    of Coroutines and get a better understanding of how to work with it, as it contains
    a lot of functions we can use. C++20 provides us with a framework for working
    with Coroutines, which means that we have to do a lot of hard work. (Hopefully,
    the next C++ standard in a few years will solve this for us).


    You can find additional information about Coroutines here: https://en.cppreference.com/w/cpp/language/coroutines


    Additional information about <cppcoro> can be found here: http://www.modernescpp.com/index.php/c-20-coroutine-abstraction-withcppcoro'
