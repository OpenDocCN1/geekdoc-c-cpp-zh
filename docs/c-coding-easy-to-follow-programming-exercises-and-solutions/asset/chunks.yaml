    \ //  my_Int\nvoid safe_increment() { \n    // 在增加 my_Int 之前锁定我们的线程\n    std::\
    \ lock_guard <std:: mutex > lock(my_Int_mutex); \n    my_Int++; \n    // 在线程锁定期间我们安全地增加\
    \ my_Int，直到 \n    // 我们完成。\n    std::cout << std::this_thread::get_id() <<“: “\
    \ << my_Int << ‘\\n’ ; \n    // 当 lock 离开作用域时，my_Int_mutex 会自动释放\n} \nint main()\
    \ { \n    std::cout <<“Our Main function:” << my_Int <<‘\\n’ ; \n    // 增加 myFirstInt\n\
