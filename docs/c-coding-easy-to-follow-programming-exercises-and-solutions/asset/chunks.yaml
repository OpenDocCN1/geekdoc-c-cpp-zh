    \ `cout` 条件运算符将较大的数打印到控制台，然后打印较小的数。\n\n# 第 12 章：无限循环\n\n无限循环只有一个表达式运行，该表达式始终评估为真。除非出现错误，否则你在代码中找不到大量的无限循环，但如果有，可以使用\
    \ `break;` 语句控制它们。操作系统使用无限循环，因为它们需要不断运行和操作。\n\n这是一个 `for` 无限循环的示例：\n\n```cpp\n\
    for (;;) {\n    cout << \"This is an infinite loop\";\n}\n```\n\n这是一个 `do-while`\
    \ 无限循环：\n\n```cpp\ndo {\n    cout << \"This is an infinite loop\";\n} while (true);\n\
    ```\n\n这是一个简单的 `while` 无限循环：\n\n```cpp\nwhile (true) {\n    cout << \"This is\
    \ an infinite loop\";\n}\n```\n\n# 第 13 章：函数\n\n在本节中，我们将扩展到函数。函数始终会在你的代码中执行任务。它们允许程序程序模块化，将你的代码分离为自包含的逻辑单元。\
    \ \n\n## 函数基础\n\n什么是函数？\n\n你已经遇到过函数了——`main` 函数。每个 `C++` 程序都至少有一个函数，即 `main`。函数可以非常简单，也可以非常复杂，取决于程序。某些函数已经作为\
    \ Visual Studio 的一部分被内置了。例如，我们之前使用了 `atoi` 函数将字符串转换为整数。我们通常使用预定义函数，它们是标准库的一部分。这让你作为程序员的生活变得简单得多；否则，你将为了转换这一唯一目的而编写完整的代码。\n\
    \n另一种方法是使用第三方函数。如果你的应用程序合适，这些函数可以是开源的或其他应用程序。例如，如果你在一家游戏公司工作，你可能会使用 `Unreal Engine`，它是为游戏开发开发的，是\
    \ `C++` 的重要补充。第三方库和函数已经经过测试且运行良好良好，因此它们为你节省了大量时间——不需要重复发明轮子。然而，当然，你总是可以编写针对你需求的特定函数，你需要学习如何做到这一点。\n\
    \n你可以查看内置的 `C++` 库，其中包含供你使用的函数：\n\nhttps://en.cppreference.com/w/cpp/header\n\n\
    ### 步骤 1 定义一个函数\n\n使用函数的第一步是定义它。函数的定义有 4 个主要组成部分：**1. 函数的名称**\n\n"
- fmt: "\nIn a similar manner of naming your variables, function names must have meaning.\
    \ It is usually a verb, such as `Calculate_Entries`, or `Return_Value`. This will\
    \ be the actual name of the function you will use. The name has to be simple and\
    \ describe in general what the function does. If you call your functions `Func1`\
    \ or `My_Function` it will have no meaning and will be difficult to follow.\n\n\
    Over the years, several standards have emerged in terms of how to name functions.\
    \ In the past, functions were named in very short names like the letter `F`, but\
    \ today, the norm is to assign long names that will make it very clear as to what\
    \ the function does. The best practice is to use capital letters at the beginning\
    \ of each word, and an underscore in between words. So, you can easily see a function\
    \ that will find the age of your dog:\n\n`Return_Age_Of_Dog`.\n\n## 2. Parameter\
    \ list\n\nThe parameter list is the list of the variables that your function will\
    \ use, with a specification of their type. A function can obtain anything between\
    \ 0 to any number of parameters. Parameters are the data items that the function\
    \ needs in order to perform its work. Let’s review an example:\n\nIf you write\
    \ a function that extracts the name of the capital city of each state—there will\
    \ be only one parameter needed—the name of the state. If you need to retrieve\
    \ an ID number of a person, you might need their first name, last name, date of\
    \ birth, father’s name—so 4 parameters in total. In other words, you need to set\
    \ the number of parameters your function will use as it performs its action.\n\
    \n## 3. Return type\n\nFunctions may return a value of any type. The value has\
    \ a type—for example, an integer (`int`). In cases the function does not return\
    \ any value, the return type will be `void`. When defining the function, you must\
    \ choose the return type.\n\n## 4. Body of your function.\n\nThe body of your\
    \ function is the actual statement that will be used as part of your function,\
    \ and in other words: what will happen once this function is called. The statement\
    \ must always be in between curly braces `{ }`.\n\nLet’s see how it will look\
    \ using C++ syntax:\n\n```cpp\nint Function_Name () // function type, name and\
    \ parameters {\n    Function Statements (a);\n    return 0; // this is optional,\
    \ as function may not be returning anything \n}\n```\n\nWhen writing your function,\
    \ in case there is a use in two or more parameters, the order of execution will\
    \ be the same as the order of your parameter arguments. Let’s review an example:\n\
    \n```cpp\nvoid function_name (char a, int i) {\n    statements (a);\n    return\
    \ 0; \n}\n```\n\nIn this case, `char a` will be called before `int i`.\n\nLet’s\
    \ try writing a simple function that says “miauu” like a cat every time it’s called.\
    \ It returns nothing, but only `cout “miauu.”` It will look like this:\n\n```cpp\n\
    void cat_sound () { cout << \"miauu\" << endl; }\n```\n\nReally simple, right?\
    \ Now that we have defined the function, we can now call it from `main`. It will\
    \ look like this:\n\n```cpp\nvoid cat_sound () { cout << \"miauu\" << endl; }\
    \ \nint main () { \n    cat_sound (); \n    return 0; \n}\n```\n\n### Function\
    \ Prototype\n\nNaturally, the compiler MUST know the function details BEFORE the\
    \ function is called; otherwise, we will encounter a compilation error. The reason\
    \ is that the compiler cannot check the number of parameters passed in and if\
    \ the type of parameters are correct. There is another way to do this, other than\
    \ just defining our function. This is called a function prototype. Our function\
    \ prototype tells the compiler everything it needs to know even if we don’t have\
    \ the function definition. It’s good to use it in cases we have more complex functions,\
    \ such as a function calling another function. We will always use the function\
    \ prototype at the beginning of the program or in the `.h` files (header files),\
    \ which we will discuss later on. The nice thing about it is that you can use\
    \ as many function prototypes as you may need, and the order you write them doesn’t\
    \ matter.\n\nLet’s see how a function prototype will look like with the example\
    \ we already used:\n\n```cpp\nvoid cat_sound (); // function prototype – note\
    \ the semicolon // at the end! \nint main () { \n    cat_sound (); \n    return\
    \ 0; \n} \nvoid cat_sound () // so function can be defined later { \n    cout\
    \ << \"miauu\" << endl; \n}\n```\n\n### Function parameter and return statements\n\
    \nWe already explained what function parameters are and what the return statements\
    \ are. Let’s further review them and learn how to use these in our code.\n\nWhen\
    \ we define a function, we define the parameters. When calling the function, these\
    \ parameters are called \"arguments,\" and as we already explained, they must\
    \ match in number and type; they are called at the same order they are defined.\n\
    \nLet’s see an example:\n\n```cpp\nint multiply_numbers (int, int); // function\
    \ prototype \nint main () { \n    int calculation = {0}; \n    calculation = multiply_numbers\
    \ (6, 9); // function call \n    return 0; \n} \nint multiply_numbers (int a,\
    \ int b) // function definition { \n    return a * b; \n}\n```\n\n### Passing\
    \ data into a function\n\nPassing data into your function in C++ is done by value.\
    \ This means that a copy of the data is passed to the function, and if your function\
    \ changes the data, it will NOT change the actual argument that was passed in.\
    \ The compiler only uses a copy of the data and not the actual data itself. There\
    \ are advantages and disadvantages in copying data, which we will discuss further.\
    \ Still, you must note that the actual parameters defined at the function header\
    \ are called formal parameters. In contrast, the parameters used at the function\
    \ call, which are copied, are actual parameters.\n\n### Return statement\n\nWe\
    \ already discussed how the return statement is optional. A function may or not\
    \ return a value, and that’s ok. When a function does return a value, it can be\
    \ returned anywhere.\n\nLet’s take everything we have learned so far and code\
    \ something more complex. We will go back to our Fahrenheit to Celsius calculation,\
    \ which we did earlier, but this time we will have to use functions.\n\nWe will\
    \ use the `cmath` library this time, which is part of C++. The beginning of our\
    \ code will look like this:\n\n```cpp\n#include <iostream>\n#include <cmath>\n\
    using namespace std;\n```\n\nFirst, let’s define the function prototype which\
    \ will use a `double` parameter:\n\n```cpp\ndouble fahrenheit_into_celsius (double);\
    \ // function prototype\n```\n\nNow let’s write the function call:\n\n```cpp\n\
    double celsius_temperature = fahrenheit_into_celsius (fahrenheit);\n```\n\nAnd\
    \ here we can write the function definition:\n\n```cpp\ndouble fahrenheit_into_celsius\
    \ (double temperature) // function definition {\n    return round(((temperature\
    \ - 32)*5)/9); // we use the round function to return a rounded value\n}\n```\n\
    \n### Using Default Arguments in a function\n\nIn many cases, arguments used by\
    \ a function will always have the same value. For example, if we have a specific\
    \ sales tax rate of 18%, this rate will not change, and when using it in a function\
    \ that calculates the final sales price, we can use a default value to simplify\
    \ our code even more.\n\nIn order to do that, we can simply define the default\
    \ arguments in our function prototype, or the function definition—but NEVER in\
    \ both. The best and recommended way is to use the function prototype—as most\
    \ programmers will.\n\nThis is how our code will appear:\n\n```cpp\n// Function\
    \ prototype (in.h file)\ndouble calc_sale_price (double base_price, double tax\
    \ = 0.18); \n\n// Function body (in .cpp file)\ndouble calc_sale_price (double\
    \ base_price, double tax) {\n    return base_cost = (base_cost * tax); \n} \n\n\
    // Function is called\nint main () { \n    double final_cost {}; \n    final_cost\
    \ = calc_sale_price (150.0); \n}\n```\n"
