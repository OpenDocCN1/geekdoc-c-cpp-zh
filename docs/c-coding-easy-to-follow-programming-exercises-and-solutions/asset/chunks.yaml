    Here, we want to provide a quick overview of one of the keywords often used in
    C++ within the scope of a class (and only within this scope). In cases where only
    a single copy of each member function exists, yet it is used by multiple objects,
    we would need a way for data members to be accessed and updated.


    The “this” keyword is actually a pointer that points to an object and can be used
    by non-static class members in order to determine if two objects are the same,
    access data members, methods, and more. If you know any other programming languages,
    you probably know the keyword self, which is equivalent to this.


    Let’s look at an example. Here is our account class and it is ambiguous as we
