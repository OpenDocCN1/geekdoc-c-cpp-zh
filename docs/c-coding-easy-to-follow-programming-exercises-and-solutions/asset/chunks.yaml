    \     choice = ‘N’ ;\n        }\n        if (correct_choice) {\n            cout\
    \ <<“Do you want to checkout Y/N” << endl;\n            cin >> choice;\n     \
    \   }\n    } while (choice ==‘N’ || choice == ‘n’ );\n    if (correct_choice)\
    \ {\n        cout <<“Please collect your tickets at the box office. Thank you!”\
    \ << endl;\n    }\n}\n```\n\n在这段代码中，我们使用了嵌套的 `if` 语句来处理用户的输入（我们接收两种类型的输入：是否继续结账/继续，以及购买哪部电影）。代码还演示了如何使用“标记”——一个我们命名为\
    \ `correct_choice` 的布尔变量，它能告诉我们是否输入了有效答案，如何将布尔变量初始化为 `true`、将其更改为 `false` 或反之。这段代码乍一看可能很复杂，但如果你仔细看，会发现它其实非常简单且符合逻辑。尝试运行它并调试结果，然后尝试编写类似的代码，让用户在菜单的某些选项之间进行选择。\n\
    \n## 9.3 - For 循环\n\nfor 循环非常有趣，它们由 4 个主表达式组成：\n\n`For (initialization; condition\
    \ ; increment)`\n\n```cpp\n{\n    statement\n};\n```\n\n循环体中的条件是一个真/假的布尔值。首先，循环在其他操作之前被初始化，然后检查条件——如果条件为真，则执行循环语句；如果为假，则终止。\n\
    \n让我们来看一个非常简单基础的 for 循环。这个循环将从 1 计数到 10。首先，我们需要创建一个变量。你会看到变量 `i` 在 for 循环中经常使用。然后我们开始执行循环体：\n\
    \n我们的代码将如下所示：\n\n```cpp\nint i {0};\nfor (i=1; i <= 10; ++i)\n{\n    cout << i\
    \ << endl;\n}\n```\n\n让我们拆解这段代码：\n\na. 我们给 `i` 赋值 1。\nb. 我们检查 `i` 是否小于或等于 10。\n\
    c. 如果为真——我们将 `i` 增 1。\nd. 执行循环语句。\ne. 循环进入下一次迭代。\nf. 循环持续到 `i` 的值变为 11。条件不再为真，循环终止。\n\
    \n这是我们预期的输出：\n\n![](img/image00139.jpeg)\n\n我们也可以像下面的示例所示在循环内部初始化 `i`：\n\n```cpp\n\
    for (int i {1}; i <= 10; ++i)\n{\n    cout << i << endl;\n}\n```\n\n当我们想要完全控制循环内的变量时，这种方法非常棒，因为如果我们我们在循环外声明它，它可能会在某个时刻发生变化。\n\
    \n让我们回顾另一个使用 `if` 语句的例子。在这个例子中，我们想要从 1 计数到 100，但只显示能被 10 除的数字：\n\n```cpp\nfor\
    \ (i {1}; i <= 100; ++i) if (i % 10 == 0)\n{\n    cout << i << endl;\n}\n```\n\
    这是我们应该预期的：\n\n![](img/image00140.jpeg)\n\n‘ For’ 循环在数组中使用时特别有用。让我们来看一个例子。在这个例子中，我们有一个包含字母\
    \ A L E X A N D E R 的字符数组。我们想要单独显示每个字母：\n\n```cpp\nChar name [] {'A', 'L', 'E',\
    \ 'X', 'A', 'N', 'D', 'E', 'R'};\nFor (int i {1}; i < = 9; ++i)\ncout << name[i]\
    \ << endl;\n}\n```\n这是我们在控制台中得到的结果：\n\n![](img/image00141.jpeg)\n\n### 哪里出错了？\n\
    \n嗯，数组的索引总是从 0 开始，所以循环应该从 0 开始递增并在 8 处终止。我们提供这个例子是因为这是一个常见的初学者错误。输出将从索引的第二个元素开始——字符\
    \ ‘L’，在终止后，它又多了一次迭代，因此列表末尾出现了这个奇怪的符号，这基本上是垃圾数据。\n\n让我们修改代码并查看预期的结果：\n\n```cpp\n\
    Char name [] {'A', 'L', 'E', 'X', 'A', 'N', 'D', 'E', 'R'};\nFor (int i {0}; i\
    \ < = 8; ++i)\n{\n    cout << name[i] << endl;\n}\n```\n\n![](img/image00142.jpeg)\n\
    \n### 基于范围的 ‘for’ 循环\n\n到为止，我们看到‘for’ 循环非常易用。我们不需要使用初始化器，不需要递增，并且可以将其用于非常简单或更复杂的目的。基于范围的\
    \ for 循环是 C++11 引入的第一个现代循环，它让使用变得很有趣。\n\n这种循环背后的思想是遍历集合而不担心位置。语法非常简单：\n\n```cpp\n\
    for (variable_type variable_name : sequence)\n{\n    Statement/s;\n}\n```\n\n\
    让我们来看一个例子：\n\n```cpp\nchar name [] {'A', 'L', 'E', 'X', 'A', 'N', 'D', 'E', 'R'};\n\
    for (char Letter : name)\ncout << Letter << endl;\n```\n当我们运行代码时，得到了和之前相同的结果：\n\
    \nImages/image0012.jpeg\n\n现代 C++ 为我们提供了另一种简化代码的方法，那就是使用 `auto` 关键字。`auto` 关键字允许我们跳过显式提供类型的需要。让我们在代码中使用它：\n\
    \n```cpp\nchar name [] {'A', 'L', 'E', 'X', 'A', 'N', 'D', 'E', 'R'};\nfor (auto\
    \ Letter : name)\ncout << Letter << endl;\n```\n\n## 第 10 章：Switch Case 语句\n\n\
    Switch Case 语句允许你为变量设置多个值进行测试。我们把每个值称为一个 case。每当检查一个值并移动到下一个时被称为 `switch`。\n\n\
    用于 switch cases 的语法非常简单：\n\n```cpp\nswitch (expression)\n{\ncase expression 1\
    \ : statement 1; break;\ncase expression 2 : statement 2; break;\ncase expression\
    \ 3 : statement 3; break;\n. . .\ndefault: statement_default;\n}\n```\n\n让我们来看一个例子。在这个例子中，用户可以从\
    \ 4 个数字中选择一个数字。\n\n```cpp\nint main()\n{\n    int selection {};\n    cout <<“please\
    \ select an option between 1 and 4” << endl; cin >> selection;\n\n    switch (selection)\
    \ //注意这段代码的缩进\n    {\n    case 1: cout <<“You selected option 1” ; break;\n  \
    \  case 2: cout <<“You selected option 2” ; break;\n    case 3: cout <<“You selected\
    \ option 3” ; break;\n    case 4: cout <<“You selected option 4” ; break;\n  \
    \  default : cout <<“No choice was made, please try again” ;\n    }\n}\n```\n\n\
    在许多方面，switch case 在从一个表达式移动到另一个方式上与 if-else 语句相似，但它们之间存在一些核心差异。当我们需要更高效的循环时，switch\
    \ case 基本上可以替换 if-else 语句。让我们看看 switch 语句中某些规则：\n\na. 被控制的值必须是整数或枚举类型。b. 你可以编写任意数量的\
    \ switch cases。\n\nc. case 表达式必须是与 switch 中变量类型相同的常量表达式。\n\n"
