    add this line to the code, we will get a compilation error, as the value of the
    variable the pointer points to (tv_sold) cannot be changed:


    ***tv_ptr = 60; // error!** But if we change the direction to which tv_ptr is
    pointing to, we will not get a compiler error:


    ***tv_ptr = &tv_sold; //no error** When declaring a constant pointer, we should
    expect this syntax: **int tv_sold {120}; int *const tv_ptr {&tv_sold};**


    In this case, the pointer is constant and cannot be changed. If we try to run
    this line, we will not get a compiler error:


    ***tv_ptr = 60; //no error** But if we change where tv_ptr is pointing to, we
    will get a compiler error: ***tv_ptr = &tv_sold; // error!** We can also use a
    constant variable and a constant pointer at the same time:


    **int tv_sold {120}; const int *const tv_ptr {&tv_sold};**


    In this case, both statements will result in a compilation error as both the int
    variable and the pointer cannot be changed:


    ***tv_ptr = 60; // error** !


    ***tv_ptr = &tv_sold; // error!


    Pointer and array**


    One of the useful ways to allocate memory on the heap is when working with arrays.
    Let’s look at an example. In this example, we want to create an array of the numbers
    of students in a given class. We ask the user: how many students are in their
    class? And create a new array dynamically on the heap with the desired size:


    #include <iostream>


    using namespace std;


    int main()


    {


    int *num_ptr{ nullptr };


    int number_of_students{};


    cout << “How many students are in your class?” << endl;


    cin >> number_of_students;


    num_ptr = new int [number_of_students]; //allocating memory on //the heap for
    an array


    cout <<“The number if students in your class is “ << number_of_students << endl;


    **delete num_ptr; //we deallocate the memory we used on the heap }** This code
    will work fine and display the number of students, while the line: **num_ptr =
    new int [number_of_students];**


    is where we allocate the exact size of the array we need on the heap. We also
    deallocated the memory space, as you can see from the last line. What will happen
