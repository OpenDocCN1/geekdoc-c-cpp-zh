    \ \n\n// Driver program to test above functions \nint main() { \n    class StackDemo\
    \ s; \n    s.push(100); \n    s.push(150); \n    s.push(200); \n    s.push(250);\
    \ \n    cout << s.pop() << “ was poped from our stack” << endl; \n    return 0;\
    \ \n}\n```\n\nThe result we get is:\n\n![](Images/image00189.jpeg)\n\n### 2. The\
    \ queue\n\nThe queue is a first-in-first-out data structure (FIFO), but as it\
