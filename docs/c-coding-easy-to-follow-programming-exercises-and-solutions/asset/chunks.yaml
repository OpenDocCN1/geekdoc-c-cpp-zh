    \n## 9.3 - For loops\n\nFor loops are pretty interesting and are constructed from\
    \ 4 main expressions:\n\n`For (initialization; condition ; increment)`\n\n```cpp\n\
    {\n    statement\n};\n```\n\nThe condition in the loops ’ body is a true/false\
    \ Boolean. First, the loop is initialized before anything else, then the condition\
    \ is checked—if it is true, the loop statement is executed, and if it is false,\
    \ it terminates.\n\nLet ’s go over a very simple and basic for loop. This loop\
    \ will count from 1 to 10. First, we need to create a variable. You will see that\
    \ the variable `i` is commonly used in for loops. Then we start executing the\
    \ body of the loop:\n\nThis is how our code will appear:\n\n```cpp\nint i {0};\n\
    for (i=1; i <= 10; ++i)\n{\n    cout << i << endl;\n}\n```\n\nLet’s break down\
    \ the code:\n\na. We assign 1 to `i`.\nb. We check if `i` is smaller or equal\
    \ to 10.\nc. If true—we increment `i` by 1.\nd. The loop statement is executed.\n\
    e. The loop goes into the second iteration.\nf. The loop continues until the value\
    \ of `i` is 11. The condition is no longer true, and the loop terminates.\n\n\
    This is the output we would expect:\n\n![](Images/image00139.jpeg)\n\nWe can also\
