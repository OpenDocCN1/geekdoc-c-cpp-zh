  trans: "\n在 C++ 中，除了我们目前所看到的可以将指针用于赋值外，还可以对其进行算术运算和比较。指针的算术运算和比较使用的运算符和语义与你目前学过和熟悉的相同。\n\
    \n指针的算术运算结合数组可以非常强大。我们使用 `++` 和 `--` 算术运算符指向数组的下一个或上一个元素。递增和递减是在内存范围内的。例如，在整数数组中递增会增加\
    \ 4（因为整数的大小为 4 字节），而 `double` 则会增加 8。\n\n语法为：`int_ptr ++; int_ptr--;`\n\n我们还可以使用\
    \ `+=` 或 `-=` 来按特定值递增或递减指针：\n\n`int_ptr += i; int_ptr -=i;`\n\n此外，只有当两个指针指向相同的数据类型时，我们才能从一个指针减去另一个指针：\n\
    \n`int i = int_ptr_2 – int_ptr_1;` 在这种情况，结果将这两个指针之间的元素个数。\n\n我们还可以比较两个指针，但记住，指针只有在它们指向相同地址时才是相等的。要进行比较，我们使用\
    \ `==` 运算符或 `!=` 运算符。\n\n### 指针与函数的操作\n\n指针在处理函数时可以起着重要作用，并以各种方式实现。我们将研究的第一种方法是通过引用将指针传递给函数。在之前的章节中，我们解释了如何通过引用传递函数。让我们复习一下记忆：\n\
    \n当我们讨论按值传递的函数时，解释了它们使用参数的副本，如果副本的值发生变化，则不会改变参数。我们将其称为实际参数和形式参数。通过引用传递函数的方法相反：我们在使用函数时使用参数的位置来更改它。为了做到这一点，我们必须在参数前使用\
    \ `&` 符号使用参数的内存实际地址。\n\n通过引用传递给函数的指针作为参数传递，如果指针的值发生任何变化，将不会影响函数。让我们回顾一个示例，该函数为给定的分数增加加分（递增\
    \ 1）：\n\n```cpp\n#include <iostream>\nusing namespace std;\n//函数原型\nvoid bonus_score(int\
    \ * int_ptr); //函数定义\nvoid bonus_score(int * int_ptr) {\n    *int_ptr += 1; //\
    \ 解引用指针并\n    //递增 1\n}\nint main() {\n    int score{89};\n    cout << score <<\
    \ endl;\n    bonus_score(&score);\n    cout << score << endl;\n}\n```\n\n运行代码时，我们得到了完全预期的结果——分数\
    \ 89，然后是分数 90：\n\n![](img/image00155.jpeg)\n\n让我们来看另一个示例，这次我们将在函数内部处理指针并显示 vector\
    \ 中的元素集合。这对于处理函数、`for` 循环和 vector 是一个很好的回顾。\n\n在这个示例中，我们想要创建一个包含字符串集合的 vector。我们将使用指针来遍历集合（当然，我们首先需要对指针进行解引用），然后显示名称。首先，让我们看看函数：\n\
    \n```cpp\n#include <iostream>\n#include <vector>\nusing namespace std;\n// 函数定义\n\
    void name_list(vector<string> * v) {\n    for (auto str : *v) // 遍历 vector\n \
    \       cout << str.c_str() << \" is a name on the list\" << endl;\n}\nint main()\
    \ {\n    // 函数调用\n    vector<string> names{\"Joe\", \"Shirley\", \"Jack\", \"\
    Linda\"};\n    name_list(&names);\n}\n```\n\n让我们回顾代码：\n\n我们创建了一个函数（我们在这里没有使用函数原型），它调用了一个字符串\
    \ vector 和一个指针 `*v`。然后我们通过解引用 `v` 遍历了 vector 列表并显示了名称。在 main 中，我们初始化了一个名为 `names`\
    \ 的 vector。我们调用该函数，它显示了集合中的名称：Joe, Shirley, Jack 和 Linda。当我们运行这段代码时，这就是我们应该预期的：\n\
    \n![](img/image00156.jpeg)\n\n现在我们已经讨论了如何向函数传递指针，现在让我们看看如何从函数返回指针。为了通过函数返回指针，我们首先需要在函数原型和函数定义中定义指针的类型。在这个过程的结束处，函数预期返回一个地址。\n\
    \n这是一个返回指针参数的示例——注意，比较不是指针本身之间，而是它们所指向的内容之间，我们通过解引用它们来实现这一点：\n\n```cpp\n#include\
    \ <iostream>\n#include <vector>\nusing namespace std;\n// 函数定义\nint *smaller_num(int\
    \ * int_ptr1, int * int_ptr2) {\n    if (*int_ptr1 < *int_ptr2)\n        return\
    \ int_ptr1;\n    else\n        return int_ptr2;\n}\n//现在我们需要调用这个函数：\nint main()\
    \ {\n    int a{25};\n    int b{34};\n    int *smaller_ptr{nullptr};\n    smaller_ptr\
    \ = smaller_num(&a, &b);\n    cout << \"The smaller number is \" << smaller_ptr\
    \ << endl;\n}\n```\n\n运行这段代码时，我们得到了一个奇怪的结果：\n\n![](img/image00157.jpeg)\n\n我们注意到输出实际上显示了内存中的一个地址。为什么呢？因为我们在输出语句中没有对\
    \ `smaller_ptr` 进行解引用，所以它向我们显示 `smaller_ptr` 指向的地址，而不是值。一旦我们这样对它进行解引用：\n\n`cout\
    \ << \"The smaller number is \" << *smaller_ptr << endl;`\n\n我们就会得到正确的输出：\n\n\
    ![](img/image00158.jpeg)\n\n### 从函数动态分配内存\n\n通过函数进行动态内存分配是非常强大的，这也是在函数内部处理指针时的常用用例。然而，有一些需要维护的常规规则。\n\
    \n让我们看一些代码以理解如何动态分配内存。在这段代码中，我们首先创建了一个在运行时创建数组的函数。在函数定义中，我们需要定义一个 `unsigned int`\
    \ 作为大小——这允许我们在运行时设置数组的大小，并在另一个 `int` 将设置为数组元素的值：\n\n```cpp\n#include <iostream>\n\
    #include <vector>\nusing namespace std;\n// 定义我们的函数\nint *build_array(size_t size,\
    \ int element_value) {\n    // 创建新的存储：\n    int *new_storage{nullptr};\n    //\
    \ 在运行时分配 int 到新存储：\n    new_storage = new int[size];\n\n    // 遍历数组元素：\n    for\
    \ (size_t i{0}; i < size; ++i)\n        *(new_storage + i) = element_value;\n\
    \    // 返回数组中新创建的整数的地址\n    return new_storage;\n}\n// 调用函数：\nint main() {\n \
    \   // 我们将使用函数为此数组分配元素：\n    int *new_array;\n    new_array = build_array(40,\
    \ 12);\n    // 我们可以用这段代码做各种事情……\n    // 我们可以做这个...\n    // 我们可以做那个...\n\n    //\
    \ 使用代码后我们必须删除数组，这\n    // 使用 delete 关键字捕获空间。不要\n    // 释放存储！\n    delete[] new_array;\n\
    }\n```\n\n重要：注意在这种情况下使用了方括号，因为这些括号表示我们正在删除一个数组。`delete` 用于 C++ 中执行许多其他删除操作，因此区分我们正在删除整个数组的情况很重要，这就是为什么在这种情况下使用\
    \ `[]`。\n\n#### 处理处理指针时的潜在问题\n\n我们讨论了处理指针时的几个潜在问题。我们解释了初始化指针有多么，否则它们将指向垃圾数据。我们解释了避免这种情况的最佳方法是使用\
    \ `nullptr`，这样指针将指向任何地方。记住这一点很重要。\n"
- fmt: "\nAnother potential problem best to avoid is with wild pointers, also known\
    \ as dangling pointers. These pointers are pointing to a memory address that was\
    \ already released and is no longer valid. This can happen many times when the\
    \ function is terminated, and while the return address of the wild pointer is\
    \ of a local variable on the stack and is no longer available. This issue would\
    \ typically result in a program crash.\n\nAnother issue that we have already mentioned\
    \ is the memory leak. This is actually one of the most common mistakes involving\
    \ pointers. It can happen if we forget to release the allocated memory we allocated\
    \ on the heap and did not use the `delete` keyword, or if we lose the pointer,\
    \ in this case, we get what is known as an orphan memory.\n\nMany of these issues\
    \ and problems are a thing of the past in modern C++, as you can use smart pointers\
    \ and atomic pointers. We will not introduce atomic pointers at this stage, as\
    \ this is an advance feature, but we recommend that you look further into these\
    \ subjects.\n\n# Chapter 15: Object-Oriented Programming\n\nOne of the core features\
    \ of modern C++, and in fact, most modern languages, is Object-Oriented Programming,\
    \ or OOP. But what is OOP? Well, in the past, computer programing was only capable\
    \ of procedural programming, which means it only focused on functions, processes,\
    \ and flow of the program. We declared our data separately than that of the function\
    \ and it is passed into the function. All this was conducted in a manner that\
    \ was suitable for old computers with very limited capabilities. In C++, we still\
    \ use procedural programming (we actually did a lot of it so far), but OOP provides\
    \ us with another layer which is more abstract. More importantly, it allows us\
    \ to manage huge amounts of code, functions, and data, in a manner that is extremely\
    \ hard or even impossible with procedural programming. As programs these days\
    \ are very complex and store a lot of data that involves conducting tens, hundreds,\
    \ and thousands of operations and running functions, we must have a better way\
    \ to manage it all. Think of it like juggling hundreds and thousands of balls\
    \ at the same time—simply impossible.\n\nOOP is a better way to manage your complex\
    \ program, simplifying it, and allowing you, the programmer, to see things in\
    \ a more abstract way and to manipulate diverse types of data. It is also important\
    \ to point out that some programmers in the C++ community believe that OOP turned\
    \ out to be a bit monstrous, and there is some criticism within the community\
    \ about the benefits of OOP vs. Old school programming. But this is a side note.\
    \ Let’s dive deeper into OOP and learn about objects and classes.\n\nOOP is a\
    \ bit tricky to understand sometimes, and it might take some practice. Take your\
    \ time learning and understanding, as it will be clearer as you go along.\n\n\
    OOP allows us to module our program into classes and objects, for the purpose\
