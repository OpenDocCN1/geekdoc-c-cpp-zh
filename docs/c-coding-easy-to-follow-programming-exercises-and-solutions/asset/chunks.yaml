    company, you will probably use Unreal Engine, which was developed for game development
    and is an important addition to C++. 3rd party libraries and functions were already
    tested and work well, so it saves you lots of time—no need to reinvent the wheel.
    Yet, of course, you can always write your own functions that are specific to your
    needs, and you need to learn how to do that.


    You can check out the built-in C++ libraries which contain functions for your
    use:


    https://en.cppreference.com/w/cpp/header


    Functions will always perform specific tasks within your code. They allow the
    modularization of your program, separating your code into logical units that are
    self-contained in a way that can be reused if needed. In the past, in less advanced
    languages such as Basic and Fortran, the programmer could only conduct two separate
    actions: “Procedure” and a “Function.” Procedure does one or more actions, and
    function can perform one or more actions, but can also return a result. In C++,
    functions can perform tasks, answer a given question, or do both—so it encapsulates
    both Procedure and Function—which is great.


    Now let’s dive deeper and understand how functions really work and how to use
    them as part of your code.


