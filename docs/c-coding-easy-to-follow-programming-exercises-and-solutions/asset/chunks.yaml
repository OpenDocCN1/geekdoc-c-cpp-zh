    \ For example, the output should say: “On 2020, you are going to be xx years old.”\n\
    \n# Chapter 8: Arrays\n\nArrays are data structures in C++. An array is a fixed\
    \ range or collection of elements, which are structured together; for example,\
    \ a list of letters or numbers. It can be a fixed number of names, numbers, dates,\
    \ words, characters, and more. An array will always have the same type of data.\
    \ So, it can be a list of variables of the same kind, such as `int`, `char`, and\
    \ `double` to name a few. You can never mix data types in an array, so you will\
    \ never see an integer together with strings in the same array—this will make\
    \ no sense. It’s important to note that when using an array, we can still access\
    \ every single element directly.\n\nRemember when you learned how to multiply\
    \ in elementary school? Your teacher probably showed you that there is a better\
    \ way than writing `2+2+2+2+2+2+2`, which is `2 X 7`. In the same manner, arrays\
    \ simplify our code and reduce repetition. For example, let’s say we have a list\
