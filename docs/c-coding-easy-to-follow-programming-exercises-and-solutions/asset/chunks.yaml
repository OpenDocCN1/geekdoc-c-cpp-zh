    ### Assignment operators


    34. Assignment operators are quite simple to understand and use. They simply assign
    a value to a variable, but there is an important rule to remember—assignment always
    takes place from right to left. This means that the right-hand side value is always
    assigned to the left-hand side variable. Let’s have a look:


    ```cpp

    string1 = "Marco" ; // string1 is assigned the name "Marco".

    string2 = "Dan" ; // string2 is assigned the name "Dan". string3 = String b; //
    the value of string b is being assigned to String3\.

    string4 =“Dan” ; // now the value of string4 is changed to“Dan”.

    ```


    The `=` (equal) Operator—forget what you learned in elementary school.


    As we demonstrated above, unlike the other mathematical operators you are familiar
    with and which we have presented above, the equal“=“ operator is a bit different.
    We will discuss and demonstrate it further in this guide, but just note that the
    use of the operator `=` is not the same as “equal to” in C++. It is used to assign
    operators. So, if for example, we write the line of code below:


    ```cpp

    a = 5; // a is not equal to 5, it is assigned the number 5

    b = 4; // b is not equal to 4, it is assigned the number 4

    c = a + b; // c is assigned the result of adding a and b together

    a = c; // now a is assigned the value of c, which is 9

    ```


    We are not checking whether `A` is equal to 5, or if `b` is equal to 4\. We are
    assigning to `A` the value 5\. `B` is assigned the value 4\. `c` now has the value
    of `a` plus `b`, and finally, `a` is not equal to `c`.


    Assignment of values to variables will be explained later in this guide.


    ### Equality Operators


    You probably asked yourself by this point which operator is used by C++ to represent
    the“equal to” operator. The answer is we use the“==“ operator, as you will learn
    in the next section. However, here are some conditions that are checked to be
    either true or false, which is why we like to see them as “questions” being asked:


    ```cpp

    (child == kinder) // Is“child” in English equal to“kinder” in German?

    ( “cellphone” == “handy” ) // Is“cellphone” equal to“handy” in German?

    (a + 3 == b + 2) // Is the value of a+3 equal to the value of b+2?

    ```


    ### Mathematical operators


    Mathematical operators are used to perform mathematical calculations on a binary
    level, and they are the basic operators you most likely learned early in elementary
    school:


    - The plus operator `+`

    - The minus operator `-`

    - The multiplication operator `*`

    - The dividing operator `/`

    - The modulo operator `%`


    Let’s see some examples of these operators in use:


    ```cpp

    a = 25; // a is assigned the value of 25

    b = 42; // b is assigned the value of 42

    x = 3; // x is assigned the value of 3

    i = a + b; // i will be assigned (25+42) = 67

    b = a – x; // now b will be assigned (25-3) = 22

    ```


    ### C++ Compound Assignment Operators


    Now that we understand what regular assignment operators and mathematical operators,
    we can now move on and discuss Compound Assignment Operators. These operators
    assign a value to a variable, while simultaneously performing a mathematical operation
    on it. It’s simple to understand as you can see from these examples:


    ```cpp

    x += y // same as saying x = x+y

    x -= 10 // same as saying x = x-10

    x /= 2 // same as saying x = x/2

    ```


    ### C++ Relational operators


    Relational operators can be powerful in C++. They are used when we want to compare
    operands, while the comparison can be made on a few levels. Let’s see some examples:


    ```cpp

    (c <= 4) // Is c smaller OR equal to 4?

    (a > c) // Is a bigger than c?

    (b != a) // Is b NOT equal to a?

    (b < c) // Is b smaller than c?

    (x == a) // Is x equal to a?

    (x <= > 5) // C++20 new operator - Is x smaller, equal or larger than 5?

    ```


    ### C++ Logical operators


    Logical operators are extremely easy and powerful to use, you just need to learn
    the basic rules. We use logical operators when we want to make a logical condition
    between two expressions that have a true or false value—a single relational result.
    Depending on this value, one of two possible expressions are:


    1. The operator `&&` means “and.”

    2. The operator `||` means “or.”


    In many cases, C++ sets a hierarchy, which means some operations are higher priority
    than others. The hierarchy in logical conditions are always set from left to right.
    This means that when we use the `&&` operator, if the left-side is false, then
    the program will not go further to check the right-side. In case of `||` operator,
    if the left-side is false, then the program will check the right-side.


    ```cpp

    (i == 4) && (a < 6) // Is i equal to 4 AND a smaller than 6?

    (i == 4) || (a < 6) // Is i equal to 4 OR a smaller than 6?

    ```


    ### ? : Conditional Operator


    As we already explained in the first section of this guide, modern C++ always
    tries to simplify code and use abstract expressions. The `?:` operator is a great
    example of how easy code can be.


    We just learned how to use `&&` and `||` conditions, and `?:` makes our life even
    simpler.


    The expression we will use in this case is: `Condition? Result1 : Result2`. If
    the condition is true, then `Result1` will be executed. If the condition is not
    true (false), then `Result2` will be executed. As you can see, this is really
    simple.


    Let’s look at another example. Let’s say we want to write a program that provides
    a discount for adults ages 18 and above. In this case, we will ask our user to
    type his/her age, and the program can instantly determine if they are an adult
    or not. We will use the conditional `?` and `:` operators in this manner:


    - `?` – value in case the condition is true.

    - `:` – value in case the condition is untrue.


    ```cpp

    Adult = (Age > 18) ? true : false ;

    ```


    This is the same as writing the following: `Adult = (Age > 18);`


    ### C++ Bitwise Operators


    C++ uses bitwise operators to modify variables according to their bit-level. This
    means that the operation is first converted into bits and then performed on the
    operands. The purpose of this is the fast execution of operations. At this point,
    you don’t need to have an in-depth understanding of this, but you now basically
    know when and where to use these operators on your code. We already used the chevron
    operators `<<` and `>>` in our code with `cin` and `cout`, so it’s not hard to
    become familiar with Bitwise operators, as it simply means that the data is extracted
    and stored somewhere. Here is another example:


    ```cpp

    std::cout << "what is the name of your dog" << std::endl;

    std::cin >> name >> std::endl;

    ```

