    \ 到 sum\n    source.sum = nullptr; //将 source.data 置空\n}\n```\n\n关于移动构造函数、何时以及如何使用它，还有更多可以学习的。如果你想扩展关于移动构造函数的知识，可以在这里找到额外的资源：\n\
    \nhttps://en.cppreference.com/w/cpp/language/move_constructor\n\n# 第 16 章：静态类成员\n\
    \n在 `C++` 中，我们可以声明静态函数和类成员。这基本上意味着数据成员或函数属于类而不是属于特定的对象。\n\n例如，如果我们想知道到为止我们有多少银行账户，我们可以创建一个全局变量，每当账户打开或关闭时，该变量就会增加或减少——这听起来简单直接。尽管如此，当涉及构造函数和析构函数时，可能会变得复杂。更好的方法是声明一个作为类部分的静态变量，当我们需要使用它时，可以使用类名进行调用。当使用静态变量时，类的所有实例都共享相同的内存，因此在程序中谁使用了这个类类并不重要，因为对所有人来说，内容和值都是相同的。\n\
    \n让我们看一个例子。这次是一个可以用于管理图书馆系统的类。我们创建一个类原型的 `.h` 文件（我们将此文件命名为 `Lib_Book.h`）：\n\n\
    ```cpp\nclass Lib_Book {\nprivate:\n    static int book_num; //编译器会在整数前检查 static\
    \ 关键字\npublic:\n    static int get_book_num(); //编译器会在函数前检查 static 关键字\n};\n```\n\
    \n为了初始化静态成员，我们需要使用 `.cpp` 文件（`Lib_Book.cpp`）。\n\n```cpp\n#include \"Lib_Book.h\"\
    \ //我们必须先包含 .h 文件\nint Lib_Book::book_num = 0; //初始化\n```\n\n现在我们可以实现类方法，在这种情况下，它将只有访问静态类类的权限：\n\
    \n```cpp\nint Lib_Book::get_book_num() {\n    return book_num; //此函数简单返回书籍数量\n\
    }\n```\n\n现在让我们看看每当书籍借出或归还图书馆时如何增加和减少。增加的最佳位置是在构造函数内部。在这种情况下，我们有两个数据成员：书名（`name_val`）和书的序列号（`serial_val`）。\n\
