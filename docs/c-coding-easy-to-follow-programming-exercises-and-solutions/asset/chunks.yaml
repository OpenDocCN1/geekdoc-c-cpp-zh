    \ \n    say_something = true ; // 如果用户输入了内容 \n    your_input.join(); // 只有当第一个线程\
    \ //结束时，第二个线程才会加入 \n    std::cin.get();\n}\n```\n\n当我们运行这段代码时，在输入某些内容之前，我们会得到如下输出：\n\
