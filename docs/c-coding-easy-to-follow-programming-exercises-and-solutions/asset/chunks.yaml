  trans: "\n当你学习原始指针（raw pointers）时，你会发现原始指针在代码中使用起来非常健壮。指针允许我们以灵活的方式分配和释放内存，从而帮助我们在程序生命周期内更好地管理程序。然而，有时这些操作会为各种问题和故障留下后门。一旦稍有疏忽，你的整个程序就会面临崩溃的危险。由于原始指针的管理完全由程序员负责，而且每个动态分配的对象都必须随之进行手动释放，如果你不小心犯了错误并忘记进行手动释放，可能会导致严重的问题。这些问题可能是内存泄漏。\n\
    \n在处理动态分配的数组时，可能会出现更多问题，因为删除数组对象需要不同的运算符。这基本上意味着你被迫跟踪每一个分配的存储空间。未能这样做将导致你的程序出现未定义行为。\n\
    \n原始指针有许多潜在问题，例如提到的内存泄漏和野指针（wild pointers，即未初始指针），它们可能指向内存中的任何地方。你还学习了悬挂指针（dangling\
    \ pointers），它们指向一个认为是有效但实际上无效的存储空间。还有与指针相关的问题、异常和潜在的 Bug。在处理复杂代码时，这可能会导致灾难性的结果。\n\
    \n现代 C++ 引入了智能指针（Smart pointers）来防止这些问题。在许多情况下，使用智能指针可以让你生活变得更轻松，防止你花费数小时来寻找和修复\
    \ Bug。许多程序员只使用智能指针，而另一些则同时使用智能指针和原始指针。在现代 C++ 中，我们也使用原子指针（Atomic Pointers），但我们在本节中不会涵盖这个主题，因为它更高级且涉及多线程。\n\
    \n让我们了解什么是智能指针以及它们是如何工作的。\n\n智能指针允许自动管理内存的分配和释放，以解决并防止上述所有问题。智能指针是 C++ 对象，并实现为\
    \ C++ 模板类（就像我们使用内置的 C++ `vector` 类的方式）。你将在稍后的章节中学习更多关于 C++ 模板类的知识。智能指针只能指向分配在堆上的内存。当不再需要使用已分配的内存时，智能指针会自动将其删除。智能指针基本上就是\
    \ C++ 类，它们是 C++ 库的内部部分，并封装了原始指针，因为这些类知道如何在各种情况和用例下处理原始指针。记住这一点是，智能指针无法进行任何算术运算，而原始指针允许你这样做。\n\
    \nC++ 提供了几种类型的智能指针：\n\n- 唯一指针 (`unique_ptr`)\n- 共享指针 (`shared_ptr`)\n- 弱指针 (`weak_ptr`)\n\
    - 自动指针 (`auto_ptr`) - 本节不涵盖自动指针，因为它们是过去的事物，在现代更新的 C++ 代码中几乎不再使用。我们将在本节中解释并演示所有这些指针的用例和方法。\n\
    \n首先，为了使用智能指针，我们需要包含 C++ 内存 `.h` 文件，因为它包含了使用智能指针的方法和函数：`#include <memory>`。使用智能指针的语法如下所示。记住析构函数是自动调用的：\n\
    \n```cpp\n{\nstd::pointer_type <Class_Name> ptr = … .. ptr -> function (); //函数体写在此处\
    \ \n}\n```\n\n### 智能指针与 RAII 设计模式\n\n`RAII` 术语与 C++ 中使用的设计模式有关，它基于容器对象的生命周期。`RAII`\
    \ 的首字母代表“资源获取即初始化”（Resource Acquisition Is Initialization）。初看，这个复杂的名称似乎很复杂，但实际上非常简单。`RAII`\
    \ 对象存储在栈上。`RAII` 对象需要资源来执行各种操作，例如分配内存。`RAII` 对象需要初始化——到目前你应该已经熟悉这个概念了。这些对象也必须释放，就像我们使用析构函数那样样。\n\
    \n智能指针是 `RAII` 类，因为它们符合我们刚刚提到的每一个特征。\n\n### 唯一指针\n\n我们已经向你介绍了在 C++ 中使用的智能指针类型。让我们探索每种类型并看看它们是如何以及何时使用的。我们将研究的第一个智能指针是\
    \ `unique_ptr`，因为这可能是最简单、最常用的指针。当你开始处理现有代码时，可能会看到很多它。\n\n`unique_ptr` 正如其名，是唯一的。这意味着你只能使用一个\
    \ `unique_ptr` 指向堆上的一个对象，它可以根据我们的需要指向任何对象类型。它也被称为指针与对象内存分配之间的所有权关系。`unique_ptr`\
    \ 也可以拷贝或赋值给另一个内存分配。这是合理的，因为我们刚刚提到了 `unique_ptr` 与分配内存之间的所有权关系——这种关系是双向。然而，`unique_ptr`\
    \ 可以被移动（move）。\n\n最后，当指针被销毁时，它指向的内容也会被自动销毁，因为它持有唯一的所有权关系。\n\n让我们来看看使用 `unique_ptr`\
    \ 的代码示例：\n```cpp\n{ \nstd::unique_ptr <int> p {new int {30}}; \nstd::cout << *p\
    \ << std::endl; \n*p = 2; \nstd::cout << *p << std::endl; \n}\n```\n\n`unique_ptr`\
    \ 还有一些非常棒的方法，这些方法是内置在类中的。让我们快速看一眼这些一些方法：\n\n```cpp\n{ \nstd::unique_ptr <int>\
    \ p {new int {30}}; \nif (p) //检查 p 是否初始化 \nstd::cout << *p << std::endl; //将显示\
    \ 30 \np.reset(); //将指针设置为 nullptr \nif (p) //检查 p 是否初始化 \nstd::cout << *p <<\
    \ std::endl; //不会执行，因为我们刚刚//将 p 设置为空指针 \nstd::cout << p.get() << std::endl; //将显示堆上的内存//地址。会自动删除//对象//指向的内容。\
    \ \n}\n```\n\n有一种更好的方法来初始化唯一指针，我们不需要使用 `new` 关键字，同时保持代码更简单整洁。这种方法称为 `make_unique`，它是在\
    \ C++14 中引入的。这种方法帮助我们防止与对象超出作用范围后清理过程相关的某些异常。你将在后的章节中学习更多关于异常的知识。\n\n```cpp\n\
    std::unique_ptr<int> p = std::make_unique<int>(100);\n```\n\n所以，你可以看到我们将 `p` 初始化为堆上的一个新的\
    \ `int` 对象。我们随后对其进行解引用，就像我们使用原始指针那样。然后，我们也可以修改我们指向的整数，就像我们使用原始指针那样。然而，使用 `unique_ptr`\
    \ 修改对象不是良好的做法；使用原始指针来这样做更好。一旦指针超出作用范围，它也会自动销毁，以及它指向的内容。\n\n让我们回顾另一个真实的代码示例。注意在这段代码中我们使用了\
    \ `static_cast`，它在某些情况下是一个很好且有用的东西。`static_cast` 是类型之间简单的隐转换（例如从 int 到 float，或指针到\
    \ void* 等）。\n\n```cpp\n#include <iostream>\n#include <memory>\nusing namespace\
    \ std; // 这里我们定义了一个测试类 Chocolate，为了演示 // unique_ptr 如何工作 // 该类除了在实例获取或销毁时打印到控制台之外什么都不做\
    \ // 构造函数打印“Chocolate has been acquired\\n”。 // 析构函数打印“Chocolate has been destroyed\\\
    n”。\nclass Chocolate { \npublic : \n    Chocolate() { cout <<“Chocolate has been\
    \ acquired\\n” ; } \n    ~Chocolate() { cout <<“Chocolate has been destroyed\\\
    n” ; } \n}; \nint main() { // 我们定义了两个对象：myWhiteChocolate 和 myDarkChocolate。\n\n\
    // 我们将 myDarkChocolate 设置为空，同时我们将 myWhiteChocolate 创建为\n```\n"
