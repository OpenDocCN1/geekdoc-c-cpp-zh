    例如，异常情况可能指的是我们没有足够的资源来处理程序的情况，或者我们使用了无效操作、违反了范围以及许多其他异常情况。异常处理是 C++ 中的一个巨大优势，因为我们可以实时针对程序的异常。


    非常重要的一点是，C++ 中的异常处理应该只在同步代码中执行，而不是在异步代码中执行。在 C++ 中使用异常处理时，有特定的术语：


    - `Exception`（异常）——一种基本类型或对象类型，指示已发生或即将发生的错误。这还包含了关于异常的信息，换句话说就是：发生了什么。


    - `Throwing an exception`（抛出异常）——当出现问题时，会抛出一个异常。抛出异常可以交给程序的其他部分，这些部分将知道如何处理。例如，如果抛出一个异常且程序即将崩溃，我们可能希望先保存文件或数据，因此让程序的其他部分来处理，从而实现“软崩溃”。在这种情况下，抛出异常就像一个篮球球员遇到问题后将球传给另一个球员，希望他的队友能接手处理这个球。


    - `Catching an exception`（捕获异常）——一旦程序的其他部分捕获了异常，它将需要以我们定义的方式进行处理。这可能会导致程序终止、关闭特定窗口、恢复、记录错误消息或部分关闭程序。例如，假设我们的程序需要向数据库写入某些内容，但数据库已满。程序的这部分运行了一个异常，可能其他部分可以删除不必要的数据条目，并允许程序照常继续运行。


    C++ 在处理异常时使用特定的关键字：


    - `try { statement }` —— 当我们想要使用可能会导致异常的代码段时，我们使用 `try` 关键字。如果抛出异常，程序将退出代码块并跳转到
    catch 处理器（捕获处理程序）。如果没有 catch 处理器，程序将终止。


    - `throw` —— 当要抛出异常时，我们使用 `throw`，后面跟着一个参数，该参数就是我们想要抛出的异常。例如，如果我们想分配新内存但内存已满，就可以使用它。


    - `catch {statement}` —— 当我们需要一个 catch 处理器时，我们使用 `catch`，这是另一个我们为此目的而专门（dedicated）的代码段，用于处理异常。例如，如果内存满了，我们可能可以删除一些不必要的存储项或清除缓存项。


    让我们看一个简单的例子。在这个例子中，我们用 `int a` 除以 `int b`。如果 `int b` 为 0 会发生什么？我们的程序会崩溃吗？它会溢出吗？这取决于具体的应用，但假设我们希望
    `int b` 等于 `0`，因为它会引起问题。在这种情况下，我们需要处理异常。这里是我们的基础代码（假设所有变量已声明并初始化）：


    ```cpp

    double sum {}; sum = int a / int b;

    ```


    当然，我们可以检查 `b` 是否等于 `0`，如果是，我们就不执行除法。但如果 `b` 等于 `0` 我们该怎么办呢？异常处理就派上用场了：


    ```cpp

    double sum {}; try //我们的 try 语句 { if (b==0) throw 0; //抛出一个异常 } sum = a / b; catch
    (int &ex) //我们的异常处理器 {

    std::cout <<“Please change the value of b to be higher than 0” << std::endl;

    }

    ```


    ## 来自函数的异常处理


    函数和方法也可以处理异常，并且也可以抛出多个异常。让我们看看如何从函数处理异常的示例。下面是一个简单的函数（我们假设所有对象已声明并初始化）：


    ```cpp

    double sum (int a, int b) { return static_cast <double> (a / b);

    //使用 static_cast 以防整数不是双精度浮点数，将其转换为 double

    }

    ```


    如果 `int b` 为 0 会发生什么？我们可以重写这个函数：


    ```cpp

    double sum (int a, int b) { if (b == 0) //如果 b 等于 0，我们抛出一个异常 throw 0; return static_cast
    <double> (a) / b; }

    ```


    现在，我们需要找到一个处理器来捕获该异常。我们可能完全没有处理器，在这种情况下，我们的程序将会崩溃。如果存在处理器，它必须在调用此函数的调用栈上被找到：


    ```cpp

    double sum {};

    try { sum = calc_sum (int a, int b); std::cout << sum << std::endl; } catch (int
    ex) { std::cerr << “Exception“ << ex << std::endl; }

    ```


    注意我们使用了 `std::cerr`。我们使用它是因为 `std::cerr` 是类 `ostream` 的一个对象，代表面向窄字符的标准错误流。


    ### 多重异常处理


    正如我们之前反复提到的，C++ 允许我们在函数或方法中处理多个异常，因为函数或方法可能会在各种情况下失败。假设我们有一个函数计算汽车每加仑油的英里数。我们假设所有对象已声明并初始化。代码如下：


    ```cpp

    double calc_mpg (int miles, int gallons) //mpg = 每加仑英里 { return static_cast <double>
    (miles) / gallons; }

    ```


    如果英里数为负数会发生什么？如果 `gallons` 为 0 会发生什么？让我们看看如何通过多重异常处理来处理这些问题，你会发现非常简单：


    ```cpp

    double calculate_mpg( int miles, int gallons ) { if ( gallons == 0) throw 0; (
    ( < 0 || || < 0)) std:: string {“Error! It is impossible to drive a negative number
    of miles }; }; static_cast < double > miles ) / gallons; }

    ```当我们调用这个函数时，预期的情况如下：


    ```cpp

    int main() { int miles{}; int gallons{}; double miles_per_gallon{}; std::cout
    <<“Enter the distance you drove in miles:“ ; std::cin >> miles; std::cout << “Enter
    the number of gallons you had: ” ; std::cin >> gallons; try { miles_per_gallon
    = calculate_mpg(miles, gallons); std::cout <<“Result: your car uses “ << miles_per_gallon
    <<“ per mile” << std::endl; } catch ( int &ex) { std::cerr << “Error! 0 are not
    an option” << std::endl; } catch(std:: string &ex) { std::cerr << ex .c_str()
    << std::endl; } std::cout <<“Thank you and goodbye!” << std::endl; return 0; }

    ```尝试运行代码并输入各种数据，包括负数零。看看异常处理在代码中是如何工作的。


    重要的是，在 C++ 中，我们还可以使用 catch all 处理器，它可以捕获任何类型的异常。如果你使用 catch all 处理器，请将其放在 catch
    块最后的最后一个 catch 语句，因为它应该捕获任何未被其他处理器捕获的内容。这是你应该使用的语法：


    ```cpp

    catch (…) //使用省略号作为参数，因为我们不知道会是什么//exception { std::cerr << “unknown exception”
    << std::endl; }

    ```


    ### 创建自定义异常类


    C++ 允许我们定义非常特定的异常处理类，以最适用于应用程序。在创建这些自定义类时，最好抛出对象而不是基本类型，并且最好按值抛出，而通过引用或常量引用捕获它们。这听起来可能很混乱，但实际上很简单，正如我们在本节中演示的那样。


