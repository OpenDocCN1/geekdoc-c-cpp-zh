    \ \n    std::cout <<“Our Main function:” << my_Int <<‘\\n’ ; \n}\n```\n\n## 使用\
    \ std::thread::join()\n\n有时，我们需要在执行任何额外操作之前等待线程完成执行。例如，如果任务是打开文件，我们需要等待线程完成打开文件后再移动到下一个操作。\n\
    \n为了实现这一点，我们还可以使用 `std::thread::join()` 函数，它确保*在移动到下次执行之前这已完成执行*。在其他编程语言（如 C#）中，你可能将其识别为‘wait’。让我们来看一些代码示例：\n\
    \n```cpp\n#include \"pch.h\"\n#include <iostream>\n#include <thread>\nstatic bool\
    \ say_something = false ; //用户需要输入某些\n\nvoid wait_for_input() // 这是我们的函数，它会在无限循环中打印\n\
    ```\n\n"
