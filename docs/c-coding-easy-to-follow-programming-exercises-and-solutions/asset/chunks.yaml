    \  } else { \n        int x = a[top--]; \n        return x; \n    } \n} \n\nint\
    \ StackDemo ::peek() { \n    if (top < 0) { \n        cout <<“Our stack is Empty”\
    \ ; \n        return 0; \n    } else { \n        int x = a[top]; \n        return\
