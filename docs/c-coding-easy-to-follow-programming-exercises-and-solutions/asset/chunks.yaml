    we sum two integers together, the result will be stored in a temp value. This
    can work well; however, when we talk about raw pointers or even copying multiple
    objects using deep copy, we might have some problems and performance issues. This
    is where move semantics or move constructor comes into the picture. Move semantics
    addresses the R values, and it is considered a bit advanced for C++ beginners.
    This is why we will not dive very deep into this subject but explain the concept
    in general.


    In move semantics, R values are used as references to those temporary values that
    we just mentioned. What it does is that instead of copying an object, it moves
    it. The operator used for this purpose with R values is a double ampersand &&
    (remember:L values are declared using a single ampersand & as you learned earlier).


