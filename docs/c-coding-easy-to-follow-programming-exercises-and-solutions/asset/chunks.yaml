    \ Letter_Count [5] = {a, b, c, d, e};\n```\n\nIf we initialize the array without\
    \ declaring the array size, during compilation, an array will be created with\
    \ the exact size we need. For example: `char Letter_Count [ ] = {a, b, c, d, e};`.\n\
    \nIn this case, an array of 5 will be created automatically as you initialize\
    \ the elements in the array.\n\nNote that the number of items in an array must\
    \ be at least one, or larger than one. Remember that arrays are static in size,\
    \ which means that if, for example, we have an array with 7 elements declared,\
    \ adding another element will result in a compilation error or a program crash.\n\
    \nIf we want to initialize a single element within an array, we can do the following:\n\
    \n```cpp\nLetter_Count [2] = Z;\n```\n\nIn this example, the third character in\
    \ the array will be assigned the value of Z.\n\n### Working with arrays and accessing\
    \ elements\n\nAccessing array elements is simple and straight forward. We simply\
    \ use the array’s name, followed by the index position of the element we want\
    \ to access.\n\nLet’s say we have an array of basketball scores: `int basketball_scores\
