  trans: "\n\n在处理大型代码和复杂程序时，将函数声明与实现分离是最佳且最常见的做法。请记住这一点并练习同时操作两个文件，但要避免重复声明和实现，因为这可能会导致非常困惑并引起编译错误。对于这种潜在问题有一个解决办法：`#include`\
    \ 保护符。当你包含 `.h` 文件时就已经已经熟悉这种保护符了，它们是 C++ 内部库的一部分。使用 `#include` 保护符可以确保你想要使用的文件只被使用一次。\n\
    \n让我们来看更复杂的代码。在这个代码中，我们创建了一个名为 `database` 的类。\n\n```cpp\n#include <iostream>\n\
    #include <string> \n#include <vector> \nusing namespace std; // 首先定义一个结构体来存储我们想要的数据\n\
    \n//为了简化程序，我们将只存储学生姓名和学生 ID . 在这段代码的最后，你可以找到关于它的更多信息 .\n\ntypedef struct\n{\n\
    string name; // 学生的姓名\nint id; // 学生的 ID\n} db ; // 我们新结构体 ‘db’ 的名称\n\n// 接下来我们将为新类定义一个原型，那部分与\
    \ //\n// typedef struct 应该都放入\n// 我们的 .h 文件中，这样其他源文件就可以使用它\n\nclass database\n\
    {\npublic : // 这是类的公共部分。公共部分可以在类作用范围之外访问 //\n\n// add - 用于向我们的数据库添加新数据的函数\nvoid\
    \ add( string name , int ID );\n\n// findByID - 如果我们有学生的 ID 字符串，通过 ID 查找学生的函数\
    \ findByID( int ID ); \nprivate : vector < db > Db; // 这里是一个 ‘db’ 向量的变量 // (我们之前定义的结构体)\
    \ \n};\n\n// 我们的 add 函数 - 在这里我们创建一个类型为‘db’的单项并填充 // 数据，然后将其添加到向量中\nvoid database\
    \ ::add( string name , int ID ) { \n    db SingleItem; \n    SingleItem.name =\
    \ name ; \n    SingleItem.id = ID ; \n    Db.push_back(SingleItem); \n}\n\n//\
    \ 这个函数遍历整个向量，当当前项的 ID\n// 与作为参数输入的 ID 匹配时，它返回 ‘name’ 字段。\nstring database ::findByID(\
    \ int ID ) { \n    int i; \n    for (i = 0; i < Db.size(); i++) { \n        if\
    \ (Db [ i ] .id == ID ) { \n            return Db [ i ] .name; \n        } \n\
    \    } \n    return“not found” ; \n} \n\nint main() { \n    database myDB;\n \
    \   myDB.add( “student 1” , 1); // 向我们的数据库添加数据\n    myDB.add( “student 2” , 2);\n\
    \    myDB.add( “student 3” , 3);\n    myDB.add( “student 4” , 4); // 查找 ID 为 4\
    \ 的学生\n\n    cout <<“looking for student with ID “ << 4 <<“ result:“ << myDB.findByID(4)\
    \ << endl;\n}\n```\n\n在这个代码中，我们使用了新东西：`typedef struct`。当你想要使用基于多个元素的新数据类型时，你会使用：`typedef\
    \ struct`。\n\n这将 `struct` 定义为一种数据类型，这样你以后就可以像使用内置数据类型（如 `int` 或 `char`）一样使用它。例如，如果你想要一个用于存储书籍信息的数据类型，你可以这样定义它：\n\
    \n```cpp\ntypedef struct\n{\nstring author;\nstring title;\nint pages;\nint year_of_publishing;\n\
    } book ;\n```\n\n然后，只要你从引用了该定义的源文件中使用它，就可以使用你创建的新类型。所以，如果你将其放在 `books.h` 中，每当你想要引用书籍数据类型时，都必须包含\
    \ `books.h`。\n\n```cpp\nbook mybook;\nmybook.author =“James Jones” ;\nmybook.pages\
    \ = 134;\nmybook.title =“Success Stories” ;\nmybook.year_of_publishing = 2001;\n\
    ```\n\n## 15.3 - 构造函数与析构函数\n\n构造函数和析构函数是类中特殊的成员方法。每次定义类的类的实体时，我们都可以有一个特殊的函数执行。这种函数可以初始化我们的类。例如，如果类有一个私有变量，可以将其初始化为我们在开始时希望它具有的值。如果这个变量用于计算总和，我们将将其初始化为\
    \ 0。构造函数的名称总是与类相同，它们在需要初始化时非常有用。此外，构造函数不需要任何返回类型，并且它们可以被重载（我们稍后会解释）。\n\n让我们看一个构造函数的示例：\n\
    \n```cpp evenclass Manage_Account\n{\nprivate:\ndouble balance;\npublic:\n//重载构造函数（稍后查看更多信息）\n\
    Manage_Account(); // 无参数构造函数\nManage_Account(std::string name, double deposit);\
    \ // 期望 2 个参数\nManage_Account(double balance); // 期望 1 个参数\n};\n```\n\n我们将演示并更多更多构造函数，所以如果你觉得现在还不理解很多，不要担心。\n\
    \n### 析构函数\n\n在程序离开类作用范围之前，另一个特殊的函数会被调用，即析构函数。析构函数也是类中的成员方法，它们与类名相同，但名称以波浪号 `~`\
    \ 开头。析构函数可以释放内存、将数据保存到文件或数据库，或者在退出类时想要执行的任何操作。一旦对象销毁，它们就会自动调用。与构造函数一样，它们不需要任何返回类型，但注意：它们不能被重载，且每个类只允许一个析构函数！\n\
    \n让我们看看析构函数在我们的类中什么样子：\n\n```cpp\nclass Manage_Account { \nprivate: \ndouble balance;\
    \ \npublic: \n//重载构造函数\nManage_Account(); // 无参数构造函数\nManage_Account(std::string\
    \ name, double deposit); // 期望 2 个参数\nManage_Account(double balance); // 期望 1\
    \ 个参数\n//析构函数\n~ Manage_Account();\n );\n```\n\n让我们看另一个例子。在这种情况下，假设我们有函数从存储器读写内存中的数据（数据库或文件）。我们可以使用构造函数和析构函数来实现，每当类被定义或首次使用时，数据将从存储器加载。此外，在结束类的使用时数据将保存：\n\
    \n```cpp\ndatabase\n\n()\n{\nsave();\n}\n```\n\n正如你所见，定义构造函数和析构函数很简单，但我们仍然需要理解它们何时以及如何调用。你首先需要知道的是，如果不提供任何构造函数或析构函数，C++\
    \ 会自动为你创建它们——这些是空构造函数和析构函数。即使你没有提供构造函数，C++ 也必须构造对象；因此，默认构造函数没有参数。创建的对象将在栈上创建，但如果我们创建一个对象的指针，它将在堆上创建。请记住，由于没有向默认构造函数传递任何参数，我们可能会在那里发现一些垃圾数据。尽管如此，当我们提供自己的构造函数时，最佳实践是自己提供一个无参（no-args）构造函数。例如，如果我们使用我们的账户类，我们可以决定在没有初始化的情况下创建新对象时，默认名称将为“NA”，余额为\
    \ 0.0：\n\n```cpp\nclass Manage_Account { \nprivate: \ndouble balance;\npublic:\n\
    Manage_Account(); // 无参数构造函数\n{ \n    name =“NA”; \n    balance = 0.0;\n}\n```\n\
    \n但如果我们决定不使用默认构造函数，它可以看起来像这样：\n\n```cpp\nclass Manage_Account { \nprivate: \n\
    double balance; \npublic: \n//带参数的构造函数\nManage_Account(std::string client_name,\
    \ double client_balance); \n{ \n    name = client_name; \n    balance = client_balance;\
    \ \n}\n```\n\n```\n\n我们之前提到过构造函数可以被重载，并且类可以拥有所需的任意构造函数，但它们之间必须不同且不重复。\n\n让我们来看看向学生发送测试并保存测试结果的程序中的类。\n\
    \n"
- fmt: "\n```cpp\nclass Tests {\nprivate:\n    std::string name;\n    int age;\n \
    \   int score;\n    //overload constructors\n    Tests();\n    Tests(std::string\
    \ student_name);\n    Tests(std::string student_name, int student_age, int student_score);\n\
    };\n```\n\nOur initialization of the constructors will look like this:\n\n```cpp\n\
    Tests::Tests() { name =“NA\"; age = 0; score = 0; };\nTests::Tests (std::string\
    \ student_name) { name = student_name; age = 0; score = 0; };\n```\n\nRemember,\
    \ it is always important to initialize your objects to a default value of a sort,\
    \ in case there is no data, as we don’t want any garbage data to be part of our\
    \ program. In this case, we initialized `name` to `NA`, `age` and `score` to `0`.\n\
    \nAnother way to initialize objects is by using the constructor initialization\
    \ list. Until now, we initialized the objects by setting the data in the constructor\
    \ body, and the values are assigned to already created attributes. Using the initialization\
    \ list can be more effective, and it basically initializes the member data values\
    \ before the constructor is executed. The initialization list is a list of initializers\
    \ that follow the parameters list of the constructor. The order of the initialization\
    \ follows the order of declaration. In one of our previous examples, we used overloaded\
    \ constructors:\n\n```cpp\nclass Tests {\nprivate:\n    std::string name;\n  \
    \  int age;\n    int score;\npublic:\n    //overload constructors\n    Tests();\n\
    \    Tests(std::string student_name);\n    Tests(std::string student_name, int\
    \ student_age, int student_score);\n};\n```\n\nBut there is a better way to do\
    \ this, and it is by using an initialization list. Here is what we used to do\
    \ it now:\n\n```cpp\nTests::Tests() { name =“NA\"; age = 0; score = 0; }\n```\n\
    \nThis way is more of an assignment method and not real initialization. Below\
    \ is the better way of using initialization list, which makes sure we initialize\
    \ our data members before anything else in the constructor body code is executed—this\
    \ is real initialization:\n\n```cpp\n//the better way – using initialization list\n\
    Tests::Tests() : name {“NA\"}, age {0}, score {0}; { }\n```\n\nUsing this method\
    \ allows us to initialize as objects are created; otherwise, they are created\
    \ first given some empty value, and only then we initialize them—so we are basically\
    \ saving a step in the process of object construction. Note that the order of\
    \ initialization is the same as the order they were declared in the class declaration.\
    \ C++ also allows us to delegate constructors, which means that the code for one\
    \ constructor can call another constructor in the initialization list. This can\
    \ be very efficient in preventing errors of duplicate code, as constructors can\
    \ look very similar to one another, which can open room for mistakes.\n\nLet’s\
    \ look at our `Tests` class and see how to use delegated constructors. First,\
    \ let’s look at our overloaded constructors which we went over previously: `//overload\
    \ constructors`\n\n```cpp\nTests(); Tests (std::string student_name); Tests(std::string\
    \ student_name, int student_age, int student_score);\n```\n\nNow, let’s look at\
    \ how this code will look using the initialization list:\n\n```cpp\nTests::Tests()\
    \ : name {\"NA\"}, age {0}, score {0}; { }\nTests::Tests (std::string student_name)\
    \ : name {student_name}, age {student_age} { }\nTests::Tests (std::string student_name,\
    \ int student_age, int student_score) : name {student_name}, age {student_age}\
    \ score {student_score} { }\n```\n\nThis code is a bit long, as we keep on repeating\
    \ the same code again and again in some variations. Let’s see how this code can\
    \ be simplified by delegating constructors:\n\n```cpp\n//the first constructor\
    \ is a 3 arguments constructor\nTests::Tests(std::string student_name, int student_age,\
    \ int student_score) : name {student_name}, age {student_age} score {student_score}\
    \ { };\n\n//now we can delegate the 3 arguments constructor\nTests::Tests : Tests\
    \ {“NA”, 0, 0} { }; \n\n//delegating the 3 arguments constructor but provide student_name\
    \ as an argument along with 0 and 0\nTests::Tests(std::string student_name) :\
    \ Tests {student_name, 0, 0} { };\n```\n\n## 15.4 - Copy constructors—shallow\
    \ and deep copy\n\nWhen we copy an object in C++, we create a new object from\
    \ an existing one. As you might recall that we have already explained that the\
    \ default in C++ is always to copy values. There are several reasons for an object\
    \ to be copied, for example, as you learned in an earlier section, when we pass\
    \ an object by value, or when we return an object from a function by value. In\
    \ C++, the compiler must be able to define a copy if, by peradventure, you don’t\
    \ provide one. For doing so, we use what is called a copy constructor. If you\
    \ do provide a copy constructor, there is a proper way for doing so, which we\
    \ will demonstrate and explain.\n\nBasically, using the default way (by the compiler)\
    \ to copy objects by value can work well, but if you need to copy raw pointers,\
    \ you may have a problem. The reason is that the pointers will be copied, but\
    \ NOT what they are pointing to, and this is what is called“shallow copy” (which\
    \ will be discussed further in this section). What you need to remember is that\
    \ when dealing with pointers, it is always good practice to provide a copy constructor.\
    \ It is also best said that using raw pointers as data members is not recommended,\
    \ as it opens a door for many errors.\n\nWhen using a copy constructor, we use\
    \ the const reference parameter, as we are copying the source, and we don’t want\
    \ to modify it. As mentioned before, the name of the constructor will remain the\
    \ same. Here is the syntax used with `Tests` class:\n\n```cpp\nTests::Tests (const\
    \ Tests &source);\n```\n\nWhen we want to implement the copy constructor, we can\
    \ do it using the initialization list:\n\n```cpp\nTests::Tests (const Tests &source)\
    \ : name {source.name}, age {source.age}, score {source.score} {\n```\n\nthe newly\
    \ created attributes using the source object. By this point, you probably understand\
    \ very well that constructors allocate storage dynamically, while destructors\
    \ free up memory when called. When copying, we can use a shallow copy or a deep\
    \ copy. As mentioned earlier, a shallow copy is the default copy method, and the\
    \ problem with it starts when copying raw pointers, as the copy copies the pointer\
    \ itself, not what it is pointing to. When we release the storage of one of the\
    \ objects by the destructor, what do you think will happen?\n\nWell, if you think\
    \ that the second object, which was copied still points to the same storage while\
    \ this storage is no longer valid, then you are correct. The way to avoid this\
    \ is to use a deep copy, which doesn’t only copy the pointer, but also the data\
    \ the pointer is pointing to while it allocates storage on the heap.\n\nLet’s\
    \ look at an example. Here is a class that uses shallow copy:\n\n```cpp\nclass\
    \ Salary {\nprivate:\n    int *sum; // this is our raw pointer\npublic:\n    Salary(int\
    \ s); // this is our constructor\n    Salary(const Salary &source); // this is\
    \ our copy constructor\n    ~Salary(); // this is our destructor\n};\n```\n\n\
    The methods are implemented as shown in the example below:\n\n```cpp\nSalary::Salary(int\
    \ s) {\n    sum = new int; //we are allocating new storage on the heap\n    *sum\
    \ = s;\n}\n```\n\nHere is how our destructor will look like:\n\n```cpp\nSalary::Salary\
    \ () {\n    delete sum;\n}\n```\n\nNow, let’s see how this class will look like\
    \ using deep copy:\n\n```cpp\nSalary::Salary (const Salary &source) {\n    sum\
    \ = new int;\n    *sum = *souce.sum; //this is a deep copy so each object //displays\
    \ the exact heap storage\n}\n```\n\n## 15.5 - Move semantics\n\nEarlier, we explained\
    \ the concept of L value (lvalue) and R value (rvalue). We explained that L values\
    \ hold specific locations in memory, which you can access with a pointer. For\
    \ example:\n\n```cpp\nint sum {50}; //sum is a L value\n\nstring name {Sean};\
    \ //name is a L value\n```\n\nR values are not addressable and not assignable.\
    \ R values are found on the right-hand side of an assignment statement, and they\
    \ will always be literals.\n"
  raw: '**class Tests { private: std::string name; int age; int score; //overload
    constructors Tests(); Tests (std::string student_name); Tests(std::string student_name,
    int student_age, int student_score); };** Our initialization of the constructors
    will look like this: **Tests::Tests() { name =“NA”; age = 0; score = 0; }; Tests
    :: Tests (std::string student_name) { name = student_name; age = 0; score = 0;
    };**


    Remember, it is always important to initialize your objects to a default value
    of a sort, in case there is no data, as we don’t want any garbage data to be part


    of our program. In this case, we initialized name to NA, age and score to 0.


    Another way to initialize objects is by using the constructor initialization list.
    Until now, we initialized the objects by setting the data in the constructor body,
    and the values are assigned to already created attributes. Using the initialization
    list can be more effective, and it basically initializes the member data values
    before the constructor is executed. The initialization list is a list of initializers
    that follow the parameters list of the constructor. The order of the initialization
    follows the order of declaration. In one of our previous examples, we used overloaded
    constructors:


    **class Tests { private: std::string name; int age; int score; public: //overload
    constructors Tests(); Tests(std::string student_name); Tests(std::string student_name,
    int student_age, int student_score); };**


    But there is a better way to do this, and it is by using an initialization list.
    Here is what we used to do it now:


    **Tests::Tests() { name =“NA”; age = 0; score = 0; }**


    This way is more of an assignment method and not real initialization. Below is
    the better way of using initialization list, which makes sure we initialize our
    data members before anything else in the constructor body code is executed—this
    is real initialization:


    **//the better way – using initialization list Tests::Tests() : name {“NA”}, age
    {0}, score {0}; { }**


    Using this method allows us to initialize as objects are created; otherwise, they
    are created first given some empty value, and only then we initialize them—so
    we are basically saving a step in the process of object construction. Note that
    the order of initialization is the same as the order they were declared in the
    class declaration. C++ also allows us to delegate constructors, which means that
    the code for one constructor can call another constructor in the initialization
    list. This can be very efficient in preventing errors of duplicate code, as constructors
    can look very similar to one another, which can open room for mistakes.


    Let’s look at our Tests class and see how to use delegated constructors. First,
    let’s look at our overloaded constructors which we went over previously: **//overload
    constructors**


    **Tests(); Tests (std::string student_name);** Tests (std::string student_name,
    int student_age, int student_score); Now, let’s look at how this code will look
    using the initialization list: Tests::Tests() **: name {"NA"}, age {0}, score
    {0}; { } Tests::Tests (std::string student_name) : name {student_name), age {student_age}
    { }**


    **Tests::Tests (std::string student_name, int student_age, int student_score)**


    : name {student_name), age {student_age} score {student_score} { }


    This code is a bit long, as we keep on repeating the same code again and again
    in some variations. Let’s see how this code can be simplified by delegating constructors:


    **//the first constructor is a 3 arguments constructor Tests::Tests(std::string
    student_name, int student_age, int student_score)**


    : name {student_name), age {student_age} score {student_score} { }; //now we can
    delegate the 3 arguments constructor Tests::Tests : Tests: {“NA”, 0, 0} { }; //delegating
    the 3 arguments constructor but provide //student_name as an argument along with
    0 and 0 Tests::Tests(std::string student_name) : Tests {student_name, 0, 0} {
    };


    ## 15.4 - Copy constructors—shallow and deep copy


    When we copy an object In C++, we create a new object from an existing one. As
    you might recall that we have already explained that the default in C++ is always
    to copy values. There are several reasons for an object to be copied, for example,
    as you learned in an earlier section, when we pass an object by value, or when
    we return an object from a function by value. In C++, the compiler must be able
    to define a copy if, by peradventure, you don’t provide one. For doing so, we
    use what is called a copy constructor. If you do provide a copy constructor, there
    is a proper way for doing so, which we will demonstrate and explain.


    Basically, using the default way (by the compiler) to copy objects by value can
    work well, but if you need to copy raw pointers, you may have a problem. The reason
    is that the pointers will be copied, but NOT what they are pointing to, and this
    is what is called“shallow copy” (which will be discussed further in this section).
    What you need to remember is that when dealing with pointers, it is always good
    practice to provide a copy constructor. It is also best said that using raw pointers
    as data members is not recommended, as it opens a door for many errors.


    When using a copy constructor, we use the const reference parameter, as we are
    copying the source, and we don’t want to modify it. As we demonstrated before,
    the name of the constructor will still remain the same as the name of the class.
    Here is the syntax used with our Tests class:


    **Tests :: Tests (const Tests &source);** When we want to implement the copy constructor,
    we can do it using the initialization list:


    **Tests :: Tests (const Tests &source) : name {source .name}, age {source.age},
    score {source.score} { }**


    You can see that it is simple to initialize the newly created attributes using
    the source object attributes.


    By this point, you probably understand very well that constructors allocate storage
    dynamically, while destructors free up memory when called. When copying, we can
    use a shallow copy or a deep copy. As mentioned earlier, a shallow copy is the
    default copy method, and the problem with it starts when copying raw pointers,
    as the copy copies the pointer itself, and not what it is pointing to. When we
    release the storage of one of the objects by using the destructor, what do you
    think will happen?


    Well, if you think that the second object, which was copied still points to the
    same storage, while this storage is no longer valid, then you are correct. The
    way to avoid this is to use a deep copy, which doesn’t only copy the pointer,
    but also the data the pointer is pointing to while it allocates storage on the
    heap.


    Let’s look at an example . Here is a class that uses shallow copy: class Salary
    **{ private: int *sum; // this is our raw pointer public: Salary(int s); // this
    is our constructor Salary(const Salary &source); // this is our copy constructor
    ~Salary(); // this is our destructor };** The methods are implemented as shown
    in the example below: **Salary::Salary(int s) { sum = new int; //we are allocating
    new storage on the //heap *sum = s; }** Here is how our destructor will look like:
    **Salary::Salary () { delete sum; }** Now, let’s see how this class will look
    like when using deep copy: **Salary::Salary (const Salary &source) { sum = new
    int; *sum = *souce.sum; //this is a deep copy so each object //displays the exact
    heap storage }**


    ## **15.5 - Move semantics**


    Earlier, we explained the concept of L value (lvalue) and R value (rvalue). We
    explained that L values hold specific locations in memory, which you can access
    with a pointer. For example:


    **int sum {50}; //sum is a L value


    string name {Sean}; //name is a L value**


    R values are not addressable and not assignable. R values are found on the right-hand
    side of an assignment statement, and they will always be literals.'
