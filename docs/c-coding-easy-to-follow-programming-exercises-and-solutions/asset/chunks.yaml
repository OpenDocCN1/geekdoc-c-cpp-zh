  trans: "\n```cpp\nint main() { MyClassT < char > MyClass1; MyClass1.myFunc( ‘1’\
    \ , ‘2’ ); MyClassT < int > MyClass2; MyClass2.myFunc(30, 40); }\n```\n\n如你所见，我们使用了相同的类模板和函数调用，但使用了不同的数据类型。\n\
    \n由于该类是使用模板和数据类型的组合定义的，因此该数据类型会替换任何 ‘T’ 符号出现的地方，这包括参数类型以及返回值：\n\n`MyClassT < char\
    \ > MyClass1; MyClass1.myFunc( '1' , '2' );` 我们传递了 2 个整数，`myFunc` 返回一个整数。`MyClassT\
    \ < int > MyClass2; MyClass2.myFunc(30, 40);` 我们传递了 2 个字符，然后 `myFunc` 返回一个字符。\n\
    \n![](img/image00188.jpeg)\n\n## 容器适配器：栈（stack）和队列（queue）\n\n栈（stack）和队列（queue）经常被用作数据结构，它们是已存在容器的一部分，这就是为什么它们被链接为适配器。\n\
    \n### 1. 栈（The stack）\n\n栈是一种先进先后出（FIFO）原则的数据结构。此外，它可以实现为向量、数组、列表（list）或双端队列（deque）的一部分，但重要的是要记住，栈不支持任何迭代器。栈通常被描述为一堆书：你将一本新书放在书堆的顶部。如果你想从堆中取出一本书，你不能从底部或中间取出——你必须从顶部取出。换句话之：栈只在栈的一端上进行操作。为了使用栈，我们必须使用栈的头文件文件：\n\
    \n`#include <stack>`\n\n栈使用了一些你们可能已经知道的方法，如 `push`、`pop`、`size`，以及 `empty` 和 `top`。\n\
    \n- `push`– 在栈顶添加一个项目。\n- `pop` – 从栈顶移除一个项目。\n- `top`– 访问栈顶的元素。\n- `empty`– 检查栈是否为空。\n\
    - `size`– 检查栈中有多少元素。\n\n让我们来看一个代码示例。在接下来的程序中，我们将展示：\n\n用于指向栈顶位置的 ‘top’ 成员变量：\n\
    \n- 推入元素（Push）\n- 弹出元素（Pop）\n- 当我们遇到“栈溢出”（stack overflow）时\n- 当我们遇到“栈下溢”（stack\
    \ underflow）时\n- 当栈为空时\n\n```cpp\n// StackDemo.cpp : 此文件包含 'main' 函数。程序的执行 //\
    \ 开始并结束于那里。\n#include <iostream>\n#include <stack>\n\nusing namespace std;\n\n\
    #define MAX 1000\n\nclass StackDemo\n{ \n    int top; // 标记栈顶 \npublic:\n    int\
    \ a[ MAX ]; // StackDemo 的最大尺寸\n    StackDemo() { \n        top = -1; // 初始化 top\
    \ \n    }\n    bool push( int x ); \n    int pop(); \n    int peek(); \n    bool\
    \ isEmpty(); \n}; \n\nbool StackDemo ::push( int x ) { \n    if (top >= ( MAX\
    \ - 1))\n        // 当我们的顶部位置等于或大于 MAX-1 时，我们就有了“栈 //溢出”\n        { \n        \
    \    cout <<“Stack Overflow!” ; \n            return false ; \n        } \n  \
    \  else { \n        a[++top] = x ; \n        cout << x <<“被推入我们的栈” << endl; \n\
    \        return true ; \n    } \n} \n\nint StackDemo ::pop() { \n    if (top <\
    \ 0) { // 如果我们的顶部位置小于 0，我们就有了“栈 //下溢” \n        cout <<“Stack Underflow!” ; \n\
    \        return 0; \n    } else { \n        int x = a[top--]; \n        return\
    \ x; \n    } \n} \n\nint StackDemo ::peek() { \n    if (top < 0) { \n        cout\
    \ <<“我们的栈是空的” ; \n        return 0; \n    } else { \n        int x = a[top]; \n\
    \        return x; \n    } \n} \n\nbool StackDemo ::isEmpty() { \n    return (top\
    \ < 0); \n} \n\n// 测试上述函数的驱动程序 \nint main() { \n    class StackDemo s; \n    s.push(100);\
    \ \n    s.push(150); \n    s.push(200); \n    s.push(250); \n    cout << s.pop()\
    \ <<“从我们的栈中被弹出” << endl; \n    return 0; \n}\n```\n\n我们得到的结果是：\n\n![](img/image00189.jpeg)\n\
    \n### 2. 队列（The queue）\n\n队列是一种先进先出（FIFO）数据结构，但当它应用于栈时，元素是从尾部推入并从头部弹出的。然而，与栈的情况一样，重要的是记住队列不支持任何迭代器。\n\
    \n为了使用队列，我们必须使用队列头文件：`#include <queue>`\n\n队列使用了许多你们已经从栈中熟悉的方法，但由于元素是从尾部推入并从头部弹出的，我们还使用了：\n\
    \n- `push`– 在尾部添加一个项目。\n- `pop` – 从头部移除一个项目。\n- `back`– 访问尾部的元素。\n- `front`– 访问头部的元素。\n\
    - `empty`– 检查队列是否为空。\n- `size`– 检查队列中有多少元素。\n\n"
- fmt: "\nUntil now, all the code that you’ve written and learned all worked on a\
    \ single thread, which means that once the code executes, it runs one line of\
    \ code at a time. As your program gets more complicated, it can be extremely beneficial\
    \ to work with threads for the sake of performance, but also what we can achieve\
    \ with our code while using threads. For example, let’s say that if we want to\
    \ use `cin` to get input from the user—until the user types the input, the program\
    \ will not be able to do anything else. In most cases, we need the program to\
    \ perform additional executions in parallel.\n\nOf course, the number of threads\
    \ we run should not exceed the number of cores in our machine’s CPU, as threads\
    \ depend on computer resources in order to run smoothly—we will elaborate more\
    \ about this when we discuss concurrency in the next section.\n\nWe can create\
    \ threads in three different ways while using `std::thread` or by using `<process.h>`,\
    \ which we will demonstrate here. The thread class with the thread functions are\
    \ already built-in these classes:\n\n1. Using a function pointer.\n2. Using a\
    \ functor (a function object).\n3. Using a lambda expression (as we haven’t introduced\
    \ lambda yet, we will not discuss this option in this section).\n\nTo start a\
    \ thread, we simply need to create a new thread object and pass the executing\
    \ code to be called (i.e., a callable object) into the constructor of the object.\
    \ Once the object is created, a new thread that will execute the code specified\
    \ in callable is launched. After we define the callable, we pass it to the thread\
    \ constructor.\n\n### Running a thread using a function pointer\n\nLet’s say we\
    \ wish our program to execute various CMD (Command Line) commands, such as “dir,”\
    \ or “ tree” and display the results.\n\nIf our program is synchronous, our program\
    \ will wait and do nothing while our command is executed. Some commands take longer\
    \ than others. If we want our program to run and the commands to be executed on\
    \ a separate thread, we use asynchronous coding.\n\nWith this method, we launch\
    \ a command, then continue with our other program’s operation and periodically\
    \ check the status of the commands being executed, which run on a separate thread.\
    \ Then when the thread completes its job, we display the results.\n\nThe thread\
    \ we will use to run our commands will be: `void cdecl ThreadFunc( void *)`. First,\
    \ we will see how to launch our thread: `void SetCommand( string command ) { Command\
    \ = command ;`\n\n```cpp\nHANDLE hThread = ( HANDLE )_beginthread(ThreadFunc,\
    \ 0, NULL );\n```\n\nOur `SetCommand` function receives a command to be executed\
    \ (for example, “dir”). Then, it launches a thread using `_beginthread`.\n\nTo\
    \ simplify our program, we define a global variable for the actual command string,\
    \ that way, it will be accessible from both the main thread and the new thread\
    \ as follows:\n\n`string Command;` Another global variable will be `BOOL IsRunning\
    \ = FALSE ;`. `IsRunning` will tell you if our thread is running at any given\
    \ moment. Our thread function will look like this: \n\n```cpp\nvoid cdecl ThreadFunc(\
    \ void *) { CommandResult =““ ; if (DoRun(Command.c_str())) { IsRunning = true\
    \ ; while (IsRunning) { if (CheckCommandExecutionStatus()) { break ; } Sleep(500);\
    \ } } IsRunning = false ; _endthreadex(0); }\n```\n\nWe will not be explaining\
    \ the `DoRun()` function as it is not in the scope of this book. Basically, it\
    \ executes a Windows command / program using `ShellExecute`:\n\n```cpp\nResult\
    \ = ( BOOL ) ShellExecute (GetActiveWindow(), \"open\" , \"cmd\" , Command, NULL\
    \ , 0);\n```\n\nYou can read more about the Tiny CMD program written by Michael\
    \ Haephrati in an article first published at Codeproject:\nhttps://www.codeproject.com/Articles/5163375/Tiny-CMD\n\
    \n### Running a thread using a function object\n\nIt’s also possible to start\
    \ a thread with `std::thread` by using a member function. In order to do so, we\
    \ must add a specific argument for the object on which to invoke the member function.\
    \ We will have to pass a pointer to the member function together with a value\
    \ so that we can use this pointer for the object in the `std::thread` constructor.\
    \ We also need to handle references. We do so by using `std::ref`.\n\nLet’s look\
    \ at a simple code example:\n\n```cpp\n#include \"pch.h\" \n#include <thread>\
    \ \n#include <iostream> \nclass Say_somthing { \n    public : \n    void greeting()\
    \ const // our public member function \n        std::cout <<“Hello!” << std::endl;\
    \ // print hello! \n    } \n}; \nint main() { \n    Say_somthing i; \n    std::\
    \ thread t(& Say_somthing ::greeting, &i); // call greeting () as a new // thread\
    \ \n    t.join();\n}\n```\n\nIt is very important to remember that your object\
    \ will outlive the thread, or else your program will crash.\n\nThere are alternative\
    \ ways instead of using `std::thread`. We can use `std::async` to create a task\
    \ and get the return values in a `std::future`. As you have just learned, in this\
    \ case, we can also execute tasks by using three methods: a function pointer,\
    \ a function object, or a lambda function. In fact, `std::future` is an interesting\
    \ class worth exploring. As we have just mentioned, we use `std::future` when\
    \ we want the thread to return a result or value. For example, return the name\
    \ of a file or the size of a file. We can do this in two different ways: we can\
    \ either use pointers to share data—this is an old method, and it can be complicated\
    \ to handle when we need to return more than one result or values.\n\nThe better\
    \ way to do this is by using the `std::future` class. “future” stands for the\
    \ data which will be returned in the future—such as when the thread will run out\
    \ of scope. It is a future value. When we say“future value,” you might wonder:\
    \ how can that be? There is either a value or not; how can we store a value which\
    \ was not yet generated?\n\n`std::future` class can store an object value that\
    \ will be assigned in the future, and uses `get()` to access the value later on.\
    \ In other words, it can store and access future data once it is stored. `std::future`\
    \ goes hand in hand with `std::promise`. This is a class template that promises\
    \ to set the value in the future. Every `std::promise` object is associated with\
    \ an `std::future` object, which will provide the value once the `std::promise`\
    \ object sets it. The `std::future` object shares data with its associated `std::future`\
    \ object (Note: original text had a typo, likely meant `std::promise`).\n\nLet’s\
    \ review a code sample:\n\n```cpp\n#include <iostream> \n#include <thread> \n\
    #include <future> \n// if the value is not yet set by thread 2 \n// the get()\
    \ call will be blocked until \n// thread 2 sets the value in promise object \n\
    // so we set promised values for such case \n// until the future value is set\
    \ \n#define PROMISE_VALUE 35 \nvoid InitThread(std:: promise < int > * myPromiseObject\
    \ ) { \n    std::cout <<“Inside InitThread” << std::endl; \n    myPromiseObject\
    \ ->set_value( PROMISE_VALUE ); \n} \nint main() { \n    // Created std::promise\
    \ object: \n    std:: promise < int > myPromise; \n    // Created std::future\
    \ object: \n    std:: future < int > myFuture = myPromise.get_future(); \n   \
    \ std:: thread th(InitThread, &myPromise); \n    std::cout <<“Value: “ << myFuture.get()\
    \ << std::endl; \n    th.join(); \n    return 0; \n}\n```\n\nWhen we run this\
    \ code, this is what we should expect:\n![](Images/image00191.jpeg)\n\nWe can\
    \ also create a thread that will return multiple values. We just need to use multiple\
    \ `std::promise` and `std::future` objects.\n\nNow that you have a better understanding\
    \ of threads using `std::future`, let’s understand `std::async()` a bit better,\
    \ as you might find it very useful in various code that you will work on in the\
    \ future.\n\n`std::async()` is a function template that accepts callbacks (meaning\
    \ a function or a function object) as an argument, then potentially executes them\
    \ asynchronously. Using asynchronous code can serve many purposes. For example,\
    \ it can be used when executing operating system commands, or a backup application\
    \ that scans files asynchronously. It can also be used to see what has changed,\
    \ what has not, and back up files. These are just a few examples to give you a\
    \ better sense of why we use asynchronous code.\n"
  raw: 'Until now, all the code that you’ve written and learned all worked on a single
    thread, which means that once the code executes, it runs one line of code at a
    time. As your program gets more complicated, it can be extremely beneficial to
    work with threads for the sake of performance, but also what we can achieve with
    our code while using threads. For example, let’s say that if we want to use cin
    to get input from the user—until the user types the input, the program will not
    be able to do anything else. In most cases, we need the program to perform additional
    executions in parallel.


    Of course, the number of threads we run should not exceed the number of cores
    in our machine’s CPU, as threads depend on computer resources in order to run
    smoothly—we will elaborate more about this when we discuss concurrency in the
    next section.


    We can create threads in three different ways while using std::thread or by using
    <process.h> , which we will demonstrate here. The thread class with the thread
    functions are already built-in these classes:


    1\. Using a function pointer.


    2\. Using a functor (a function object) 3\. Using a lambda expression (as wehaven’t
    introduced lambda yet, we will not discuss this option in this section).


    To start a thread, we simply need to create a new thread object and pass the executing
    code to be called (i.e., a callable object) into the constructor of the object.
    Once the object is created, a new thread that will execute the code specified
    in callable is launched. After we define the callable, we pass it to the thread
    constructor.


    **Running a thread using a function pointer** Let’s say we wish our program to
    execute various CMD (Command Line) commands, such as “dir,” or “ tree” and display
    the results.


    If our program is synchronous, our program will wait and do nothing while our
    command is executed. Some commands take longer than others. If we want our program
    to run and the commands to be executed on a separate thread, we use asynchronous
    coding.


    With this method, we launch a command, then continue with our other program’s
    operation and periodically check the status of the commands being executed, which
    run on a separate thread. Then when the thread completes its job, we display the
    results.


    The thread we will use to run our commands will be: **void cdecl ThreadFunc( void
    *)** First, we will see how to launch our thread: **void SetCommand( string command
    ) { Command = command ;**


    **HANDLE hThread = ( HANDLE )_beginthread(ThreadFunc, 0, NULL );


    }** Our SetCommand function receives a command to be executed (for example, “dir”).
    Then, it launches a thread using _beginthread.


    To simplify our program, we define a global variable for the actual command string,
    that way, it will be accessible from both the main thread and the new thread as
    follows:


    **string Command;** Another global variable will be **BOOL IsRunning = FALSE ;**
    IsRunning will tell you if our thread is running at any given moment. Our thread
    function will look like this: **void cdecl ThreadFunc( void *) { CommandResult
    =““ ; if (DoRun(Command.c_str())) { IsRunning = true ; while (IsRunning) { if
    (CheckCommandExecutionStatus()) { break ; } Sleep(500); } } IsRunning = false
    ; _endthreadex(0); }**


    We will not be explaining the DoRun() function as it is not in the scope of this
    book. Basically, it executes a Windows command / program using ShellExecute:


    **Result = ( BOOL ) ShellExecute (GetActiveWindow(), "open" , "cmd" , Command,
    NULL , 0);**


    You can read more about the Tiny CMD program written by Michael Haephrati in an
    article first published at Codeproject:


    https://www.codeproject.com/Articles/5163375/Tiny-CMD


    **Running a thread using a function object**


    It’s also possible to start a thread w ith std::thread by using a member function.
    In order to do so, we must add a specific argument for the object on which to
    invoke the member function. We will have to pass a pointer to the member function
    together with a value so that we can use this pointer for the object in the std::thread
    constructor. We also need to handle references. We do so by using std::ref.


    Let’s look at a simple code example:


    #include "pch.h" #include <thread> #include <iostream> class Say_somthing { public
    : void greeting() const // our public member function { std::cout <<“Hello!” <<
    std::endl; // print hello! } }; int main() { Say_somthing i; std:: thread t(&
    Say_somthing ::greeting, &i); // call greeting () as a new // thread t.join();


    } It is very important to remember that your object will outlive the thread, or
    else your program will crash.


    There are alternative ways instead of using std::thread. We can use std::async
    to create a task and get the return values in a std::future. As you have just
    learned, in this case, we can also execute tasks by using three methods: a function
    pointer, a function object, or a lambda function. In fact, std::future is an interesting
    class worth exploring. As we have just mentioned, we use std::future when we want
    the thread to return a result or value. For example, return the name of a file
    or the size of a file. We can do this in two different ways: we can either use
    pointers to share data—this is an old method, and it can be complicated to handle
    when we need to return more than one result or values.


    The better way to do this is by using the std::future class. “future” stands for
    the data which will be returned in the future—such as when the thread will run
    out of scope. It is a future value. When we say“future value,” you might wonder:
    how can that be? There is either a value or not; how can we store a value which
    was not yet generated?


    std::future class can store an object value that will be assigned in the future,
    and uses get() to access the value later on. In other words, it can store and
    access future data once it is stored.std::future goes hand in hand with std::promise.
    This is a class template that promises to set the value in the future. Every std::promise
    object is associated with an std::future object, which will provide the value
    once the std::promise object sets it. Thestd::future object shares data with its
    associated std::future object.


    Let’s review a code sample: **#include <iostream> #include <thread> #include <future>
    // if the value is not yet set by thread 2 // the get() call will be blocked until
    // thread 2 sets the value in promise object // so we set promised values for
    such case // until the future value is set #define PROMISE_VALUE 35 void InitThread(std::
    promise < int > * myPromiseObject ) { std::cout <<“Inside InitThread” << std::endl;
    myPromiseObject ->set_value( PROMISE_VALUE ); } int main() { // Created std::promise
    object: std:: promise < int > myPromise; // Created std::future object: std::
    future < int > myFuture = myPromise.get_future(); std:: thread th(InitThread,
    &myPromise); std::cout <<“Value: “ << myFuture.get() << std::endl; th.join();
    return 0; }** When we run this code, this is what we should expect:


    ![](Images/image00191.jpeg)We can also create a thread that will return multiple
    values. We just need to use multiple std::promise and std::future objects.


    Now that you have a better understanding of threads usingstd::future, let ’s understand
    std::async() a bit better, as you might find it very useful in various code that
    you will work on in the future.


    std::async() is a function template that accepts callbacks (meaning a function
    or a function object) as an argument, then potentially executes them asynchronously.
    Using asynchronous code can serve many purposes. For example, it can be used when
    executing operating system commands, or a backup application that scans files
    asynchronously. It can also be used to see what has changed, what has not, and
    back up files. These are just a few examples to give you a better sense of why
    we use asynchronous code.'
