    \ `A` 和 `B` 的类型。它们可以是任何类型或几乎任何类型。正如我们将要说明的，通常使用特殊语法来定义模板，特别是函数模板。因此，如果使用我们的函数模板，我们不需要定义传递给模板的任何参数的类型。\n\
    \n这非常就像文字处理模板，你将其作为骨架，并以许多不同的方式填充它。\n\n首先，让我们像之前解释的那样创建一个宏，来对我们的函数模板 `IsLarger()`\
