    \n理解这一点非常重要：当我们执行线程时，我们在不同线程之间使用可用的 CPU 核心。这也被称为硬件并发，并且它以非确定性的方式工作。这意味着各种线程可以在不同的核心上并行运行，而每个线程执行特定的任务。C++\
    \ 标准库提供了 `std::thread::hardware_concurrency()` 函数，它可以告诉程序在给定机器上可以并发运行的线程数。`thread::hardware_concurrency()`\
    \ 函数观察一个状态并返回相应的输出，该输出是机器硬件实现可以支持的并发线程数。然而，返回的值并不总是准确的。\n\n在查看 `thread::hardware_concurrency()`\
    \ 的代码示例之前，让我们先了解这些操作在双核或单核计算机上是如何工作的，这与任务进行切换的单线程代码是不同的：\n\n### 双核：\n\n下面是一个演示如何使用\
    \ `hardware_concurrency()` 函数的简单代码示例：\n\n```cpp\n#include \"pch.h\" \n#include\
    \ <iostream> \n#include <thread> \nusing namespace std; \nint main() { \n    unsigned\
    \ int num_threads; \n    num_threads = thread ::hardware_concurrency(); \n   \
    \ cout <<“Number of concurrent threads supported are:“ << num_threads << endl;\
    \ \n    return 0; \n}\n```\n\n运行代码的结果将取决于不同的计算机，因为配置不同。在我们的情况下，结果将是 4 个线程：\n\n\
    ![](img/image00194.jpeg)\n\n### 向线程函数传递参数\n\n向线程函数传递参数可以非常简单易行——我们只需要将参数传递给可调用对象或函数即可。然而，重要的是，默认情况下，参数会被复制到内部内存中，线程在执行时可以访问它们。\n\
    \n同样重要的是，我们不希望将局部栈的变量地址传递给线程的回调函数，因为在这种情况下，线程 A 中的局部变量将超出作用域，而线程 B 可能会尝试访问它使用的地址——这将导致我们的程序出现严重问题和意外行为。使用指向堆内存位置的指针时也是如此，因为如果其中一个线程在到达作用域时删除了该内存，该地址可能会失效。\n\
    \n让我们来看代码示例：\n\n```cpp\n#include \"pch.h\"\n#include <iostream>\n#include <string>\n\
    #include <thread>\n\n// 这是我们的回调函数\n// 它由我们的线程对象调用\nvoid myCallbackFunction( int\
    \ myInt , std:: string myStr )\n{\n    std::cout <<“The string passed to this\
    \ function is =“ << myStr << std::endl;\n    std::cout <<“The integer passed to\
    \ this function is = “ << myInt << std::endl;\n} \n\nint main() { \n    int x\
    \ = 24; \n    std:: string str =“This is a string” ; \n    // 调用我们的线程并指定回调函数，\n\
    \    // 同时以及发送给它的参数 (int, string) \n    std:: thread myThreadObject(myCallbackFunction,\
    \ x, str); \n    myThreadObject.join(); \n    return 0; \n}\n```\n\n运行这段代码时，这就是我们预期的结果：\n\
    \n![](img/image00195.jpeg)\n\n关于 C++ 中的多线程和并发，你可以学到非常多，这个主题可能相当高级。我们建议你继续探索这个课题，下面的链接是一个很好的起点：https://www.tutorialspoint.com/cplusplus\n\
    \n### 第 28 章：C++ 协程\n\n协程是函数之间协作工作的一种，这可以赋予我们对程序流程很大的权力和控制力。每个协作的函数都会准确地记住它停止的地方，并在控制权返回给它时从那里继续执行。\n\
    \n"
- fmt: "\nThe case of `func1()` is the caller, while `func2()` is the ‘awaitable.\
    \ ‘ Coroutines handle the relationship between the two as they co-work together.\
    \ We will further explain these terms later on.\n\nAs you can imagine, Coroutines\
    \ can have a major impact when threading as they can manage our multitasking executions\
    \ during the lifetime of our program.\n\nIn order to use Coroutines in our code,\
    \ we can use three expressions:\n\n- `co_await`– Suspends or resumes the execution\
    \ of the function.\n- `co_return` - Used as a return statement.\n- `co_yield`–\
    \ Carries values and a stream during iteration between functions.\n\nPlease note\
    \ that `co_return` and `co_await` require compilers' support for the C++20 standard\
    \ (see https://en.cppreference.com/w/cpp/keyword ) and https://en.cppreference.com/w/cpp/compiler_support\
    \ ).\n\nIn order to change your compilers’ configuration, right-click in your\
    \ project on the right-hand side and choose“properties.*.*\"\n\nWhen the properties\
    \ window opens, choose“C/C++” and then“command line.*.*” At the bottom, type“/await”\
    \ and click“ Apply:”\n\n![](Images/image00196.jpeg)\n\nNow, let’s understand these\
    \ expressions a bit better:\n\n### The co_await operator\n\n`co_await` is a unary\
    \ operator that can only work within a Coroutine and is assigned to a single value.\
    \ The `co_await` operator works with an Awaitable type—these two work hand in\
    \ hand. In fact, when we talk about a‘waiter’ type, let’s remember that it is\
    \ implemented by using the coroutines’ three special methods, which are a part\
    \ of `co_await`: `await_suspend`, `await_ready`, and `await_resume`. The names\
    \ of these methods can tell you a lot about their purpose and use.\n\n### The\
    \ co_return operator\n\nIn a regular function that uses a return statement, the\
    \ returned value is stored in a location for the caller to access, usually either\
    \ in the function activation frame or the callers’ activation frame, which is\
    \ then destroyed. Coroutines change the way the call and return are performed,\
    \ and for this purpose, use three methods: `Suspend`, `Resume`, and `Destroy`.\
    \ Again, just as we saw in `co_await`, the names of these methods are clear, and\
    \ you can understand their purpose.\n\n- The `Suspend` operation suspends the\
    \ Coroutines’ execution and it’s responsible for transferring the execution back\
    \ to the caller or to resume (depends on whose turn is it) state. At this point,\
    \ the activation frame will stay intact.\n- The `Resume` operation is in charge\
    \ of resuming the execution of a suspended Coroutine that gains back control.\n\
    - The `Destroy` operation is in charge of destroying the activation frame, as\
    \ well as objects that are under the scope of the Coroutine—while also releasing\
    \ the used memory.\n\n### The co_yield operator\n\n`co_yield`, together with `co_await`,\
    \ are in charge of suspending the operation of a Coroutine—which is a powerful\
    \ option. `co_yield` can suspend the execution of a function in the middle of\
    \ its execution. Once the execution is suspended, it will be transferred back\
    \ to the caller or to the resumer of the Coroutine. This means that if we use\
    \ `co_yield` to suspend the operation of `func1()`—the caller, the operation will\
    \ be moved to `func2()`—the resume and so forth—all depends on the way we define\
    \ the Coroutines.\n\nIt is important to point out that if you use these expressions\
    \ in a noncoroutine function, the compiler will turn it into a Coroutine function\
    \ automatically.\n\nLet’s see simple function syntax without using Coroutines.\
    \ In this case, the function calculates and returns the first 10 Fibonacci numbers:\n\
    \n```cpp\n#include \"pch.h\"\n#include <iostream>\nusing namespace std;\nint fib(\
    \ int x ) {\n  if (( x == 1) || ( x == 0)) {\n    return ( x );\n  } else {\n\
    \    return (fib( x - 1) + fib( x - 2));\n  }\n}\nint main() {\n  int x{ 10 };\n\
    \  int i{};\n  while (i < x) {\n    cout <<“ “ << fib(i);\n    i++;\n  }\n  return\
    \ 0;\n}\n```\nWhen we run this code, this is what we should expect:\n\n![](Images/image00197.jpeg)\n\
    \nNow let’s see how to display Fibonacci numbers using Coroutines:\n\n```cpp\n\
    #include \"pch.h\"\n#include <iostream>\n#include <future>\n\nusing namespace\
    \ std;\n\nfuture < int > my_async( int a , int b ) // our thread function {\n\
    \  auto fib = std::async([=]()(){\n    int c = a + b ;\n    return c;\n  });\n\
    \  return fib;\n}\n\nfuture < int > my_fib( int n ) {\n  if ( n <= 2) co_return\
    \ 1;\n  int a = 1;\n  int b = 1; // iterate the fibonacci series for ( int i =\
    \ 0; i < n - 2; ++i) {\n    int c = co_await my_async(a, b);\n    a = b;\n   \
    \ b = c;\n  }\n  co_return b;\n}\nfuture < void > test_async_fib() {\n  for (\
    \ int i = 1; i < 10; ++i) {\n    int result = co_await my_fib(i);\n    cout <<“Coroutine\
    \ (“ << i << “) for Fibonacci is the number“ << result << endl;\n  }\n}\nint main()\
    \ {\n  auto fib = test_async_fib();\n  // Testing our async thread fib\n  fib.wait();\n\
    \  return 0;\n}\n```\nWhen running this code, this is what we should expect:\n\
    \n![](Images/image00198.jpeg)\n\nWhat happened here is that when we call `co_await\
    \ async_add(a, b)`, the add operation executes in another thread while suspending\
    \ the execution, then it resumes the “c =” assignment with the return value. We\
    \ then move back to the next execution.\n\n### The coroutine 'awaitable' types\n\
    \nWe also have 2 ‘awaitables’ that we can use in C++20 new std:: library. We can\
    \ also use it to control the flow between the functions Coroutines:\n\n- `std::suspend_always`\
    \ below is the syntax used when using std::suspend_always:\n```cpp\nstruct suspend_always\
    \ {\n  constexpr bool await_ready() const noexcept {\n    return false ;\n  }\n\
    \  constexpr void await_suspend(coroutine_handle<>) const noexcept {}\n  constexpr\
    \ void await_resume() const noexcept {}\n};\n```\n\n- `std::suspend_never`:\n\
    ```cpp\nstruct suspend_never {\n  constexpr bool await_ready() const noexcept\
    \ {\n    return true ;\n  }\n  constexpr void await_suspend(coroutine_handle<>)\
    \ const noexcept {}\n  constexpr void await_resume() const noexcept {}\n};\n```\n\
    \nNow that you understand the basic logic of Coroutines, let’s talk a bit more\
    \ about the structure and the way C++ interfaces it within code. There are two\
    \ main interfaces used with Coroutines: `Promise` and `Awaitable` (which you should\
    \ already know by now).\n\n`Promise` is used to define the way the Coroutine will\
    \ work, what will happen upon execution, and what it will return (including exceptions).\
    \ This also includes the behavior of `co_await` and `co_yield` expressions.\n\n\
    `Awaitable` defines the co_await` expression; once any value is `co_await`, we\
    \ can pre-define it in order to use the methods on the awaitable object. It means\
    \ that we can define it if we want to suspend something, return something, or\
    \ do any other thing.\n\nIt seems to be a complex syntax and structure, but the\
    \ logic is pretty simple: we manage and micromanage the relationship between two\
    \ or more functions, which co-work with each other.\n\nPlease note that `co_return`,\
    \ `co_yield`, and `co_await` require compilers' support for the C++20 standard\
    \ (see https://en.cppreference.com/w/cpp/keyword ) and https://en.cppreference.com/w/cpp/compiler_support\
    \ ).\n\nThere is a lot to learn and understand about Coroutines in C++ as this\
    \ is a complex subject that can be expanded in many different directions. Yet,\
    \ thanks to the `<cppcoro>` class that is now a part of C++, we can benefit from\
    \ an abstraction of Coroutines and get a better understanding of how to work with\
    \ it, as it contains a lot of functions we can use. C++20 provides us with a framework\
    \ for working with Coroutines, which means that we have to do a lot of hard work.\
    \ (Hopefully, the next C++ standard in a few years will solve this for us).\n\n\
    You can find additional information about Coroutines here: https://en.cppreference.com/w/cpp/language/coroutines\n\
    \nAdditional information about `<cppcoro>` can be found here: http://www.modernescpp.com/index.php/c-20-coroutine-abstraction-withcppcoro\n"
