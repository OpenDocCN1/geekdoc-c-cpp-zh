    # **Chapter 8: Arrays**


    Arrays are data structures in C++. An array is a fixed range or collection of
    elements, which are structured together; for example, a list of letters or numbers.
    It can be a fixed number of names, numbers, dates, words, characters, and more.
    An array will always have the same type of data. So, it can be a list of variables
    of the same kind, such as int, char, and double to name a few. You can never mix
    data types in an array, so you will never see an integer together with strings
    in the same array—this will make no sense. It’s important to note that when using
    an array, we can still access every single element directly.


    Remember when you learned how to multiply in elementary school? Your teacher probably
    showed you that there is a better way than writing 2+2+2+2+2+2+2, which is 2 X
    7\. In the same manner, arrays simplify our code and reduce repetition. For example,
    let’s say we have a list of prices:


    **int price1 {10};


    int price2 {20};


    int price3 {30};


    int price4 {40};**


    Instead of writing a list, we can simply


    write: int price [4] {10, 20, 30, 40};


    Variable_type array_name [array size]


    Note that in an array, we use square brackets [ ].


    We mentioned that when using an array, we can still access every single element
    directly. We do this by using the index position of the element. The first element
    will always be #0, so the second will be #1. The last element will always be size-1\.
    If the size of the array is 100, the position of the last element will be #99.


    Let’s see an example of how to use arrays:


    We have a variable type char, and there is a list of 5 characters. This conveys
    how simple it is to use an array:


    **char Letter_Count [5];**


    In this example, we have an array of 5 characters, yet we don ’t know what the
    names of each of them are. If we want to initialize the array, then we can do
    this in a similar way by initializing variables while using the assignment operator:


    **char Letter_Count [5] = {a, b, c, d, e};** If we initialize the array without
    declaring the array size, during compilation, an array will be created with the
    exact size we need. For example: **char Letter_Count [ ] = {a, b, c, d, e};**


    In this case, an array of 5 will be created automatically as you initialize the
    elements in the array.


    **Note that the number of items in an array must be at least one, or larger than
    one. Remember that arrays are static in size, which means that if, for example,
    we have an array with 7 elements declared, adding another element will result
    in a compilation error or a program crash.**


    If we want to initialize a single element within an array, we can do the following:


    **Letter_Count [2] = Z;**


    In this example, the third character in the array will be assigned the value of
    Z.


    **Working with arrays and accessing elements**


    Accessing array elements is simple and straight forward. We simply use the array’s
    name, followed by the index position of the element we want to access.


    Let ’s say we have an array of basketball scores: int basketball_scores [45, 107,
    86, 190, 131]; Let’s print to the console the scores in order:


    **cout << "The first basketball score is " << basketball_scores [0]; cout << "The
    second basketball score is " << basketball_scores [1]; cout << "The third basketball
    score is " << basketball_scores [2]; cout << "The fourth basketball score is "
    << basketball_scores [3]; cout << "The fifth basketball score is " << basketball_scores
    [4];**


    As you can see, this is very simple!


