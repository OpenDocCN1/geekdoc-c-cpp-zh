  raw: 'Another potential problem best to avoid is with wild pointers, also known
    as dangling pointers. These pointers are pointing to a memory address that was
    already released and is no longer valid. This can happen many times when the function
    is terminated, and while the return address of the wild pointer is of a local
    variable on the stack and is no longer available. This issue would typically result
    in a program crash.


    Another issue that we have already mentioned is the memory leak. This is actually
    one of the most common mistakes involving pointers. It can happen if we forget
    to release the allocated memory we allocated on the heap and did not use the delete
    keyword, or if we lose the pointer, in this case, we get what is known as an orphan
    memory.


    Many of these issues and problems are a thing of the past in modern C++, as you
    can use smart pointers and atomic pointers. We will not introduce atomic pointers
    at this stage, as this is an advance feature, but we recommend that you look further
    into these subjects.


    # **Chapter 15: Object-Oriented Programming**


    One of the core features of modern C++, and in fact, most modern languages, is
    Object-Oriented Programming, or OOP. But what is OOP? Well, in the past, computer
    programing was only capable of procedural programming, which means it only focused
    on functions, processes, and flow of the program. We declared our data separately
    than that of the function and it is passed into the function. All this was conducted
    in a manner that was suitable for old computers with very limited capabilities.
    In C++, we still use procedural programming (we actually did a lot of it so far),
    but OOP provides us with another layer which is more abstract. More importantly,
    it allows us to manage huge amounts of code, functions, and data, in a manner
    that is extremely hard or even impossible with procedural programming. As programs
    these days are very complex and store a lot of data that involves conducting tens,
    hundreds, and thousands of operations and running functions, we must have a better
    way to manage it all. Think of it like juggling hundreds and thousands of balls
    at the same time—simply impossible.


    OOP is a better way to manage your complex program, simplifying it, and allowing
    you, the programmer, to see things in a more abstract way and to manipulate diverse
    types of data. It is also important to point out that some programmers in the
    C++ community believe that OOP turned out to be a bit monstrous, and there is
    some criticism within the community about the benefits of OOP vs. Old school programming.
    But this is a side note. Let’s dive deeper into OOP and learn about objects and
    classes.


    OOP is a bit tricky to understand sometimes, and it might take some practice.
    Take your time learning and understanding, as it will be clearer as you go along.


    OOP allows us to module our program into classes and objects, for the purpose
    of simplifying it. Classes allow you to encapsulate parts of our code in a single
    class, and then we can use the data in the class together with the operation that
    works with the data. It means that the data and the operation are not spread across
    the program, which will force us to access every location if we use procedural
    programming, not to mention if we need not only to access the data, but to modify
    it as well. With a class, we can surgically use, modify, and call our data and
    operation—all from a single location. This is really powerful and helpful in code.


    Another advantage is the fact that we can reuse our classes in other programs.
    For example, if you have a class that can handle photos uploading and renaming,
    you can use that class in any program that handles photos. This saves tons of
    time and hard work. We will also discuss later on another concept in C++, which
    is called inheritance. It basically allows us to use an existing class to create
    a new one. For example, let’s say we have a class that handles students’ enrollment.
    It has the name of the students, dates, and courses they will take. Now we want
    to write a program for enrolling children in kindergarten. We will need many of
    the same elements in the class, with specific changes. With inheritance, it will
    be easy to do.


    ## **15.1 - Classes and Objects**


    The best way to describe classes is to compare them to blueprints for part of
    your program. With these“blueprints,” we define the data type, the data itself,
    the methods we use the data (functions), and who will access the class defining
    it as public or private.


    Another important element of OOP is the fact that it allows us to hide information.
    This means that some parts of our program will not have access to other parts,
    unless access is given, or it can have limited access. There are many uses and
    benefits we will discuss further on.


    Within the class, we can create as many objects as we need. These objects are
    called each specific instance of the class. So, if we created a class for students’
    enrollment, an object of the student class will be a student’s name, age, chosen
    class, and academic points they earned.


    **Defining a class**


    Defining a class is simple. We simply use the class keyword and give the class
    a name (a best practice is to use capital letters at the beginning of each word),
    and then we declare the class. This is the syntactic format you should use:


    **class Class_Name


    {


    //class declarations here;


    };**


    Remember: that the class declaration ends with a semicolon ;


    In the declaration part of the class, we can define the way our class will behave,
    the objects, and the way our class will be structured. If we want to declare our
    student enrollment class, it may look like this:


    **class Enrollment { //attributes std::string student; int age; int points; //methods
    void Add_Student(std::string student, int age, int points); };**


    Remember, the method in this class is specific to this class alone. Now that we
    have created the class, we can now create the objects within this class, in this
    case, each student application (Name_App):


    Enrollment George_App; Enrollment Lidia_App; Enrollment *Tara_App = new Enrollment
    (); delete Tara_App;


    Now, we can use the objects in various ways. For example, we can create a vector
    of student applications:


    **std::vector <Enrolment> enrollment1 {George_App}; enrollment1.puh_back(Lidia_App);**


    It ’s important to understand that when defining a class, we do it outside of
    main, as we don’t want our class to stay in the scope of the main function alone.
    We want to extend access to our class beyond the scope of our program. You can
    create your class just above the main function, but a better way to do this is
    when a new class is created. It is common to create dedicated files for the class.
    These files will be a .cpp file and a .h file.


    In the .cpp file, you add an #include to the .h file and then place the body of
    the class.


    In the .h file, you place the prototype of the class. Then any source file that
    uses this class just needs to add an #include to the .h as well. It may sound
    confusing, but we will provide you with some real-life examples and tasks later
    on.


    When you want to make sure that a .h (header) file is processed only once, the
    common method is to use a Preprocessor Directive. These are lines that are unique
    as they start with a hash sign (#), which the compiler examines before the actual
    compilation of code, hence the term “preprocessor.” It can be used to automatically
    make changes in the code before it is compiled. Such changes would be to add source
    lines, decide the code blocks that will be included or excluded in the code to
    be compiled, and replace one text with another.


    To prevent the processing of a header file more than once, we define a string,
    which can be anything, and then we add the lines:


    **#ifndef <string>


    #define <string>


    <contents of header file>


    #endif**'
