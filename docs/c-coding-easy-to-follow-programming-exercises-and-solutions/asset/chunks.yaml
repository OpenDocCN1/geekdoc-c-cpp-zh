    # Chapter 4: The C++ Structure


    Now that you wrote your first code, let ’s start to really understand the structure
    of C++. Just like any spoken language such as English, Hindi, or French, C++ is
    based on its structure and logic. The C++ structure may be complex, but its basics
    are quite simple. These are the three basic elements of the foundation structure
    that you need to learn:


    1. Reserved keywords

    2. Operators

    3. Punctuation


    Let’s get to know these core elements:


    ## 1. C++ Reserved Keywords


    C++ uses a wide range of reserved keywords and syntax as part of the language
    vocabulary—to be exact, it has 95 keywords, such as `break`, `case`, `catch`,
    `try`, and many more. Just for reference, the C programming language uses only
    32 reserved keywords, and the popular Python uses only 33\. This tells us a lot
    about the difference between these languages and C++. You already got to know
    a few keywords in your first code, such as `int`, but there are many more you
    will get to know in this guide.


    30\. There are many references online with a list of C++ keywords and their meaning.
