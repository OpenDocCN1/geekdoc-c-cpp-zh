    We used the `+` and `<` operators as they make sense, which is important to point
    out—you should always use the sensible operators when overloaded. We will take
    a closer look at overloading operators as we go along in this section.


    While most of the operators can be overloaded in C++, some operators cannot. This
    includes the following:


    - The `sizeof` operator.

    - The pointer to member operator `.*`.

    - The scope resolution operator `::`.

    - The conditional operator `:?`.

    - The dot operator `.`.


    Let’s review some of the basic rules of operator overloading:


    - We cannot change precedence. This means that some operators get precedence over
    others, and this will not change. The same goes for the associativity of the operators.

    - We cannot change the operators of primitive types, such as `int`, `double`,
    etc.

    - C++ does not allow us to create new operators that do not exist.

    - The operators `=`, `[]`, `()` and `->` must be declared as member methods.

    - Other operators can be declared both as member methods and as global functions.


