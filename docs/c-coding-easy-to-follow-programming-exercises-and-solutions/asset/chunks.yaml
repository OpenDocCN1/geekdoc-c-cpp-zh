    正如我们在上面演示的，与你熟悉的以及我们在上面介绍的其他数学运算符不同，等号“=” 运算符略有不同。我们将在本指南中进一步讨论并演示它，但请注意，运算符 `=`
    的用法与 C++ 中的“等于”不同。它被用于赋值运算符。因此，例如我们写下面这行代码：


    ```cpp

    a = 5; // a 不等于 5，它被赋值为数字 5

    b = 4; // b 不等于 4，它被赋值为数字 4

    c = a + b; // c 被赋值为 a 和 b 相加的结果

