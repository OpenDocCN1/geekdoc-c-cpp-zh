    ![](img/cover0019.jpeg)


    # 第一章：引言


    ## 1.1 - C++ 绝对非常出色！


    C++ 的日益普及以及对 C++ 专业人才日益增长的需求只是学习 C++ 的众多优势之一。你掌握它的之旅从这里开始。你将发现 C++ 是你遇过的最强大、最健壮的编程语言之一，并且被认为是最复杂但回报最丰语言之一。C++
    可以作为一种灵活且极其动态的编程工具，实现无数用途。与大多数编程语言不同，C++ 可用于底层、中层和高层编程。这意味着它可以用于许多不同层次和用例场景的无数应用程序。


    C++ 是一门多平台语言，因此你能够为 Windows、Mac、Linux 甚至移动设备编写代码。它还能为你提供一套强大的编程技能，成为你学习其他可用编程语言的阶脚石和根基。


    C++ 初看起来可能令人生生畏，但无论它有多复杂，学习基础知识都非常简单，通过大量的练习，你可以成为 C++ 忍者。C++ 在许多领域提供了大量的自由和创造力——计算机游戏、图形应用、通信、人工智能与深度学习、计算机视觉、驱动程序、道德黑客、桌面应用等。你将能够真正地微观管理计算机性能。作为一名
    C++ 程序员，你能够以各种风格和方法生产快速、可扩展且灵活的应用程序，服务于任何用例。


    `C++ = Salary++`


    学习 C++ 还有另一个巨大的优势：它是职业发展的巨大助推器。事实上，人类开发的一些最成功的应用程序都是用 C++ 编写的。Facebook、Adobe、Skype、Amazon、PayPal
    等 IT 巨头将 C++ 作为其软件开发的核心部分。换句话说，学习 C++ 可以提升你的职业生涯，开启许多大门，同时在你的简历上留下重墨的一笔。市场对 C++
    程序员有着持续的需求，而为了让你在需求出现时能够胜任，这本书将成为你的极佳指南。


    C++ 的人气越来越高，对 C++ 专业人才的需求也在不断增长。这也是形成 GitHub 和 Stack Overflow 等强大的 C++ 社区和论坛的原因之一，在这些地方你可以提问、下载代码、分享、学习并成为有价值且活跃的成员。


    ## 1.2 - 简而言之 C++ 历史……


    20 世纪 70 年代初，Dennis Ritchie 在新泽西州的贝尔实验室创建了名为 C 语言的编程语言。C 多年来一直作为一种过程化编程语言存在。到
    70 年代末，Bjarne Stroustrup 开发了最初作为 C 语言附加扩展的内容。在刚开始，Bjarne 的工作被称为“带有类的 C（C with
    classes）”，直到 1983 年才更命名为 C++。1989 年，C++ 的第一个商业版本发布。1998 年，C++ 首次获得国际标准，这为它的商业用途创建了全球性标准。这是程序创建新纪元的序幕。


    所谓的“现代 C++”引入于 2011 年，并命名为 `C++11`，随后是 2014 年发布的 `C++14`，然后是 2017 年发布的 `C++17`，最后，C++
    家族的新“宝宝”是 `C++20`，它于 2020 年发布，引入了 C++ 迄为止最强大的新特性。


    ## 1.3 - C++ 的心态


    如果你以前从未写过代码，或者你在这方面的经验很少——请阅读这一部分，因为你可能会觉得某些 C++ 概念或逻辑难以理解或令人困惑。这会发生在几乎任何初学者身上，因为学习编程不仅像学习一门带有语法规则的新语言，它还让你接触到新的、更复杂的逻辑思维方式。事实如此，尤其是对于
    C++ 而言。你只需要记住熟能生巧，并且任何初级程序员在开始阶段都会遇到同样的“童年疾病”般的错误并面临一些困难。不要担心——这非常自然。


    1. 必须注意的是，C++ 提供的自由并不是没有代价的。程序越复杂、灵活，出现错误和 bug 的空间就越大。可以公正地说，理解如何在 C++ 中编写代码固然重要，理解如何**不**那样写代码也同样重要。尽管现代编译器为你提供了许多功能和工具来帮助你管理编码和程序流，但它也能防止你犯错，指出过程中可能出现的某些问题。记住：练习永远是最好的学习途径，而你的错误是你最好的导师。


    ## 1.4 - 为 Windows 设置工作环境和 IDE


    对于本指南，我们将使用 C++ 最健壮、最常用的开发环境之一：由微软提供的 Visual Studio。Visual Studio 是 Windows 上最专业的
    IDE。它也有 Mac 版本。（参见：https://visualstudio.microsoft.com/vs/mac/ ）。使用 Visual Studio
    有许多优势，特别是如果你在团队中工作，它很可能是你会使用的工具。另一个优势是 Visual Studio 可以支持其他编程语言，如 C#、Python、Java、Angular
    等。因此，从一开始就了解如何使用 Visual Studio 将大有益处。


    要在你的机器上开始安装 Visual Studio，请先确保：


    a. 你的 PC 符合安装 Visual Studio 的要求。这是安装任何软件的必要条件，更不用说是一个重量型开发环境了。Visual Studio 2019
    的系统要求列在下方：https://docs.microsoft.com/en-us/visualstudio/releases/2019/systemrequirements

    b. 建议在安装之前运行 Windows 更新。c. 如果需要，清理任何可以腾出的空间。


    1. 根据你的需求选择合适的版本：


    a. 以下版本可能适用于你：学生折扣版、免费社区版，或者可以作为免费试用/付费获取的更高级选项。

    b. 在此处查看选项（https://visualstudio.microsoft.com/downloads/ ）并下载你想使用的版本。


    2. 使用 Visual Studio 安装程序：


    ![](img/image0103.jpeg)


    Visual Studio 使用自己的安装程序，该程序首先被下载。然后通过这个安装程序，你可以安装 Visual Studio、添加插件、更改配置并在需要时卸载
    Visual Studio。


    3. 安装 Visual Studio：


    a. 当你安装 Visual Studio 时，你不仅安装了 IDE，还安装了认为在开发过程中可能需要的“工作负载（workloads）”。


    ![](img/image0104.jpeg)


    b. 工作负载实际上是适用于不同开发类型的特征集：驱动程序、网站、桌面应用，以及你将使用的编程语言（在我们例中是 C++）。编程语言也会影响“工作负载”的选择。

    c. 如果你漏掉了某个需要的“工作负载”或安装了某个需要的“工作负载”，你不必担心，因为你可以重新启动安装程序并进行更改。要这样做，请前往“工具 > 获取工具和功能”菜单。

    d. 你还可以自定义要安装的单个组件。这与“工作负载”不同，因为“工作负载”是组件和特征的集合。如果你只想添加或删除部分此类组件和特征，只需进入“单个组件”选项卡，可以在那里手动挑选可能需要的组件和特征。例如，C++
    可以用于控制台应用程序，也可以用于使用 MFC（微软基金类库）的富图形应用程序。默认不安装 MFC，如果你计划创建基于 GUI 的应用程序，你可能需要添加
    MFC。


