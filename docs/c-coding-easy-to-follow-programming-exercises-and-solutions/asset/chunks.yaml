    an abstract class.


    So, when do we use abstract classes? It is best to use them when we do not need
    to use any function implementation in the base class. This all might seem very
    confusing, but think about it this way: do you remember the generalization diagram
    in the inheritance section? It is when you cannot open a general account in your
    bank, only a specific account, such as a checking account, a trust account, or
    a savings account. The general base account class is abstract, and there will
    be no pure virtual function implementation, as this account is just a skeleton
    with commonalities for all the derived classes and not an actual usable account
    type. Let’s look at another example. Let’s say we have a class named Shape. Shape
    is a very general term that can describe either a circle, a triangle, or a square.
    Therefore, Shape is a perfect abstract class, and the attributes of Shape must
    have a shared commonality with all of its derived classes.


    It is also important to remember that when dealing with abstract classes, we cannot
    create abstract class objects or allocate new memory on the heap:


    **Account account; // compilation error Account *ptr = new Account (); // compilation
    error**


    However, we can use pointers and references within the derived concrete classes
    to achieve polymorphism:


    **Account *ptr = new Saving_Account(); //ok no compilation error ptr->deposit();
    //ok no compilation error**'
