  trans: "\n\n```cpp\nclass Tests {\nprivate:\n    std::string name;\n    int age;\n\
    \    int score;\n    //重载构造函数\n    Tests();\n    Tests(std::string student_name);\n\
    \    Tests(std::string student_name, int student_age, int student_score);\n};\n\
    ```\n\n我们对构造函数的初始化如下：\n\n```cpp\nTests::Tests() { name =“NA\"; age = 0; score\
    \ = 0; };\nTests::Tests (std::string student_name) { name = student_name; age\
    \ = 0; score = 0; };\n```\n\n请记住，将对象初始化为某种默认值是非常重要的，以防没有数据的情况下，因为我们不希望任何垃圾数据成为我们的程序。在这种情况下，我们将\
    \ `name` 初始化为 `NA`，将 `age` 和 `score` 初始化为 `0`。\n\n另一种初始化对象的方法是使用构造函数初始化列表。到目前为止，我们通过在构造函数体中设置数据来初始化对象，并将值赋值给已经创建的属性。使用初始化列表可以更高效，它基本上在构造函数执行之前初始化了成员数据值。初始化列表是跟在构造函数参数列表之后的初始化器列表。初始化的顺序遵循声明顺序。在我们之前的一个示例中，我们使用了重载的构造函数：\n\
    \n```cpp\nclass Tests {\nprivate:\n    std::string name;\n    int age;\n    int\
    \ score;\npublic:\n    //重载构造函数\n    Tests();\n    Tests(std::string student_name);\n\
    \    Tests(std::string student_name, int student_age, int student_score);\n};\n\
    ```\n\n但有一种更好的方法，即使用初始化列表。这里是我们现在使用它的方法：\n\n```cpp\nTests::Tests() { name =“NA\"\
    ; age = 0; score = 0; }\n```\n\n这种方法更像是一种赋值方法，而不是真正的初始化。下面是使用初始化列表的更好方法，它确保我们在执行构造函数体中的任何其他代码之前初始化了数据成员——这是真正的初始化：\n\
    \n```cpp\n// 更好的方法——使用初始化列表\nTests::Tests() : name {“NA\"}, age {0}, score {0};\
    \ { }\n```\n\n使用这种方法允许我们在对象创建时对其进行初始化；否则，它们会先以某些空值被创建，然后我们才对其进行初始化——所以我们基本上在对象构造过程中节省了一个步骤。请注意，初始化的顺序与它们在类声明中的声明顺序相同。C++\
    \ 还允许我们使用委托构造函数，这意味着一个构造函数的代码可以调用初始化列表中的另一个构造函数。这在防止代码重复错误方面非常高效，因为构造函数之间可能非常相似，这会留出出错的空间。\n\
    \n让我们看看我们的 `Tests` 类并看看如何使用委托构造函数。首先，让我们看看之前讲过的重载构造函数：`//重载构造函数`\n\n```cpp\nTests();\
    \ Tests (std::string student_name); Tests(std::string student_name, int student_age,\
    \ int student_score);\n```\n\n现在，让我们看看使用初始化列表代码将是什么样子：\n\n```cpp\nTests::Tests()\
    \ : name {\"NA\"}, age {0}, score {0}; { }\nTests::Tests (std::string student_name)\
    \ : name {student_name}, age {student_age} { }\nTests::Tests (std::string student_name,\
    \ int student_age, int student_score) : name {student_name}, age {student_age}\
    \ score {student_score} { }\n```\n\n这段代码有点长，因为我们在某些变体中不断重复相同的代码。让我们看看如何通过委托构造函数简化这段代码：\n\
    \n```cpp\n// 第一个构造函数是 3 参数的构造函数\nTests::Tests(std::string student_name, int student_age,\
    \ int student_score) : name {student_name}, age {student_age} score {student_score}\
    \ { };\n\n// 现在我们可以委托这个 3 参数构造函数\nTests::Tests() : Tests {“NA”, 0, 0} { }; \n\n\
    // 委托 3 参数构造函数，但除了 0 和 0 提供 student_name 作为参数\nTests::Tests(std::string student_name)\
    \ : Tests {student_name, 0, 0} { };\n```\n\n## 15.4 - 拷贝构造函数——浅拷贝和深拷贝\n\n当我们在\
    \ C++ 中复制对象时，我们从一个现有对象创建一个新对象。你可能记得，我们已经解释过 C++ 的默认值总是复制值。对象被复制有几个原因，例如，正如你在早的章节中学到的那样，当我们按值传递对象时，或者当我们从函数按值返回对象时。在\
    \ C++ 中，万一你没有提供拷贝，编译器必须能够定义一个拷贝。为了这样做，我们使用所谓的拷贝构造函数。如果你确实提供了拷贝构造函数，那么有一个恰当的方法来这样做，我们将进行演示和解释。\n\
    \n基本上，使用默认方式（通过编译器）按值复制对象可以运行得很好，但如果你需要复制原始指针，你可能会遇到问题。原因是指针会被复制，但它们所指向的内容**不会**，这就是所谓的“浅拷贝”（在本节中将进一步讨论）。你需要记住，在处理指针时，提供拷贝构造函数始终是一个良好的做法。最好的说法是，不建议将原始指针作为数据成员，因为它为许多错误留下了可能。\n\
    \n使用拷贝构造函数时，我们使用 `const` 引用参数，因为我们正在复制源，并且我们不想修改它。如前所述，构造函数的名称将保持不变。以下是 `Tests`\
    \ 类使用的语法：\n\n```cpp\nTests::Tests (const Tests &source);\n```\n\n当我们要实现拷贝构造函数时，可以使用初始化列表来实现：\n\
    \n```cpp\nTests::Tests (const Tests &source) : name {source.name}, age {source.age},\
    \ score {source.score} {\n// 使用源对象创建新属性\n```\n\n到此，你可能已经非常理解了构造函数动态分配存储，而析构函数在调用时释放内存。在复制时，我们可以使用浅拷贝或深拷贝。如之前所述，浅拷贝是默认的拷贝方法，它的问题从复制原始指针时开始，因为拷贝复制的是指针本身，而不是它指向的内容。当我们通过析构函数释放其中一个对象的存储时，你认为会发生什么？\n\
    \n嗯，如果你认为被复制的第二个对象仍然指向相同的存储空间，而该存储空间不再有效，那么你是正确的。避免这种情况的方法是使用深拷贝，它不仅复制指针，还复制指针所指向的数据，同时它在堆上分配了存储空间。\n\
    \n让我们看一个例子。这里有一个使用浅拷贝的类：\n\n```cpp\nclass Salary {\nprivate:\n    int *sum; //\
    \ 这是我们的原始指针\npublic:\n    Salary(int s); // 这是我们的构造函数\n    Salary(const Salary\
    \ &source); // 这是我们的拷贝构造函数\n    ~Salary(); // 这是我们的析构函数\n};\n```\n\n方法的实现如下例所示：\n\
    \n```cpp\nSalary::Salary(int s) {\n    sum = new int; // 我们在堆上分配新的存储空间\n    *sum\
    \ = s;\n}\n```\n\n这里是我们的析构函数的样子：\n\n```cpp\nSalary::~Salary() {\n    delete sum;\n\
    }\n```\n\n现在，让我们看看使用深拷贝时这个类将是什么样子：\n\n```cpp\nSalary::Salary (const Salary &source)\
    \ {\n    sum = new int;\n    *sum = *source.sum; // 这是深拷贝，所以每个对象//显示精确的堆存储\n}\n\
    ```\n\n## 15.5 - 移动语义\n\n早些，我们解释了 L 值（lvalue）和 R 值（rvalue）的概念。我们解释了 L 值持有内存中的特定位置，你可以通过指针访问它。例如：\n\
    \n```cpp\nint sum {50}; //sum 是一个 L 值\n\nstring name {Sean}; //name 是一个 L 值\n\
    ```\n\nR 值不可寻址且不可赋值。R 值出现在赋值语句的右侧，并且它们将始终是字面量。\n\n"
- fmt: "\nIn some cases, the C++ compiler creates a temporary value. For example,\
    \ if we sum two integers together, the result will be stored in a temp value.\
    \ This can work well; however, when we talk about raw pointers or even copying\
    \ multiple objects using deep copy, we might have some problems and performance\
    \ issues. This is where move semantics or move constructor comes into the picture.\
    \ Move semantics addresses the `R` values, and it is considered a bit advanced\
    \ for `C++` beginners. This is why we will not dive very deep into this subject\
    \ but explain the concept in general.\n\nIn move semantics, `R` values are used\
    \ as references to those temporary values that we just mentioned. What it does\
    \ is that instead of copying an object, it moves it. The operator used for this\
    \ purpose with `R` values is a double ampersand `&&` (remember: `L` values are\
    \ declared using a single ampersand `&` as you learned earlier).\n\nLet ’s review\
    \ an example:\n\n```cpp\nint i {50};\nint &L_val = i; //this is our L value reference\n\
    L_val = 4; //we changed i to 4\nint &&R_val = 10; //this is our R value reference\n\
    R_val = 140; //we change R_val to 140\n```\n\nLet’s see another example, this\
    \ time in a function named `calc_num`:\n\n```cpp\nint i {50};\nvoid calc_num(int\
    \ &&num);\ncalc_num (30); //calc_num is changing the R value\n```\n\nBut what\
    \ will happen if we try to execute this statement?: `calc_num(i);`\n\nThis will\
    \ result in a compilation error, as `i` is a `L` value, and we expect an `R` value\
    \ in our function.\n\nThis will only work if we use this code:\n\n```cpp\nint\
    \ i {50};\nvoid calc_num(int &num);\ncalc_num(i); //calc_num is changing the L\
    \ value\n```\n\nBut now, if we execute the following statement, we will get a\
    \ compilation error, as the function expects a `L` value and not a `R` value:\n\
    \n```cpp\ncalc_num(30);\n```\n\nLet’s see how we can take advantage of the Move\
    \ Semantics within a given class. To demonstrate this, we have created a class\
    \ with a pointer attribute and added some methods—we will use the Copy Constructor\
    \ as shown below:\n\n```cpp\nclass Wallet {\nprivate:\n    int *sum; //this is\
    \ our raw pointer\npublic:\n    void set_sum_value(int x); //*sum = x\n    int\
    \ get_sum_value(); //return *sum\n    Wallet(int x); //constructor\n    Wallet(const\
    \ Wallet &source); //Copy Constructor\n    ~Wallet; //destructor\n};\n```\n\n\
    Here is the code we should expect for a Copy Constructor. There are different\
    \ types of Copy Constructors, and in our case, we used a Deep Copy method Copy\
    \ Constructor:\n\n```cpp\nWallet::Wallet(const Wallet &source)\n{\n    sum = new\
    \ int;\n    *sum = *source.sum;\n}\n```\n\nNow let’s see what we can do in our\
    \ `main` function if we want to, let’s say, create a vector object and use our\
    \ Copy Constructor to copy the temp data to this object:\n\n```cpp\nmain() {\n\
    \    vector <Wallet> vec;\n    vec.push_back(Wallet {20});\n    vec.push_back(Wallet\
    \ {30});\n}\n```\n\nNow let’s try and do the same thing, this time with the use\
    \ of a Move Constructor.\n\nLook carefully at this code. What happens here is\
    \ that we copy the address from the source itself to the current object, then,\
    \ the source object is nulled out. In other words, we do the same thing as we\
    \ would normally do with Deep Copy, but in this case, the source pointer is nulled\
    \ out, we get a much more efficient result.\n\nThe syntax for the Move Constructor\
    \ is similar to that of the Copy Constructor with two differences. Since we can’t\
    \ use `const`, we need to null out the pointer, thus modifying it. Also, we use\
    \ two ampersands (`&&`) instead of one—as we do with `R` values. Our `Wallet`\
    \ class will look like this:\n\n```cpp\nWallet::Wallet(Wallet &&source);\n```\n\
    \nNow let’s see how it’s implemented in our class declaration:\n\n```cpp\nclass\
    \ Wallet {\nprivate:\n    int *sum; //this is our raw pointer\npublic:\n\n   \
    \ void set_sum_value(int x); //*sum = x\n    int get_sum_value(); //return *sum\n\
    \    Wallet (int x); //constructor\n    Wallet (Wallet &&source); //Move Constructor\n\
    \    ~Wallet; //destructor\n};\n```\n\nHere is the code we should expect for the\
    \ Move Constructor when implementing it:\n\n```cpp\nWallet::Wallet(Wallet &&source)\
    \ {\n    Sum = {source.sum}; //shallow copy source.sum to sum\n    source.sum\
    \ = nullptr; //null out source.data \n}\n```\n\nThere is more to learn about the\
    \ Move Constructor, when, and how to use it. If you wish to expand your knowledge\
    \ about the Move Constructor, you can find additional resources here:\n\nhttps://en.cppreference.com/w/cpp/language/move_constructor\n\
    \n# Chapter 16: Static class members\n\nIn `C++`, we can declare static functions\
    \ and class members. This basically means that the data members or functions belong\
    \ to the class rather than to a specific object.\n\nFor example, if we want to\
    \ know how many bank accounts we have so far, we can create a global variable\
    \ that is incremented or decremented whenever an account is opened or closed—it\
    \ sounds easy and clear. Still, it can be complex when there are constructors\
    \ and destructors involved. A much better way would be to declare a static variable\
    \ that will be a part of the account class, and it will be called using the class\
    \ name whenever we need to use it. When a static variable is used, in all instances\
    \ of the class, this variable will share the same memory, so it doesn’t matter\
    \ who uses this class in a given program, as the content and values will be the\
    \ same for all.\n\nLet’s see an example. This time, a class that can be used to\
    \ manage a library system. We create a `.h` file with the class prototype (we\
    \ will name this file `Lib_Book.h`):\n\n```cpp\nclass Lib_Book {\nprivate:\n \
    \   static int book_num; //the compiler will check static-keyword before integer\n\
    public:\n    static int get_book_num(); //the compiler will check static-keyword\
    \ before function\n};\n```\n\nIn order to initialize the static member, we need\
    \ to use the `.cpp` file (`Lib_Book.cpp`).\n\n```cpp\n#include \"Lib_Book.h\"\
    \ //we must include the .h file first\nint Lib_Book::book_num = 0; //initializing\n\
    ```\n\nNow we can implement the class method, which in this case, will only have\
    \ access to the static class member:\n\n```cpp\nint Lib_Book::get_book_num() {\n\
