    }\n```\n\n一旦运行程序，我们就会得到编译器错误：\n\n![](img/image00122.jpeg)\n\n只有初始化变量，程序才能运行。让我们将其初始化为\
    \ `10`。`int price{ 10 };`\n\n再次运行程序。这是我们得到：\n\n![](img/image00123.jpeg)\n\n###\
    \ 出什么问题了？（在 C++ 中初始化变量的重要性）\n\n声明一个变量时，大多数情况下它将包含一个未知的随机值，或者不包含任何值，这会导致编译错误。因此，你应该在声明每个变量时对其进行初始化。初始值可以是一个特殊值，表示该变量尚未被使用。\n\
    \n### 这里有几个示例：![](img/image00124.gif)\n\n你声明了一个名为 `sum` 的变量 `i`，它最终将包含元素的和。初始值可以是\
