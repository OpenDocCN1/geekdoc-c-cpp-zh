    \ are:\narts:\nmedical:\nengineering:\nin engineering student can opt for any\
    \ of the departments: engineering in civil:\nengineering in mechanical:\nengineering\
    \ in electronics:\n\n## Hybrid inheritance\n\n* [Hybrid Inheritance](http://guides.wikinut.com/Inheritance-and-Its-types/6dfqqlfm/)\
    \ is a method where one or more types of inheritance are combined together.\n\n\
    ![](Images/image01378.jpeg)\n\nFig. Hybrid (Multilevel, multiple) inheritance\n\
    \n## Virtual base class\n\n* Consider a situation, when three kind’s of inheritance\
    \ ,namely multilevel, multiple and hierarchical inheritance are involved. \n*\
    \ Then, the `child` will have two direct base classes `parent1` and `parent2`\
    \ which they themselves have a common base class grandparent.\n* The `child` inherits\
    \ the traits of `grandparent` via two separate paths.\n* It can also inherit directly\
    \ as shown by the ‘broken line’.\n* The `grandparent` is sometimes referred to\
    \ as indirect base class.\n\n![](Images/image01379.jpeg)\n\nFig. Multipath inheritance\n\
    \n* Such inheritance by the `child` class may create some problems.\n* All the\
    \ public and protected members of the `grandparent` class are inherited into the\
    \ `child` class twice; first via `parent1` class and then again via `parent2`\
    \ class.\n* This means that the `child` class would have duplicate set of members\
    \ inherited from `grandparent`, which introduces ambiguity and should be avoided.\n\
    * The duplication of inherited members due to these multiple paths can be avoided\
    \ by making the common base class as virtual base class, while declaring the direct\
    \ or intermediate base classes as shown below:\n\n```cpp\nclass grandparent\n\
    {\n….\n….\n};\n\nclass parent1 : virtual public grandparent\n{\n…….\n…..\n….\n\
    };\n\nclass parent2 : public virtual grandparent\n{\n…….\n…..\n….\n};\n\nclass\
    \ child : public parent1, public parent2\n{\n…….\n.  ……// only one copy of grand\
    \ parent will be  inherited\n…….\n};\n```\n\n* When a class is made a virtual\
    \ base class.\n* C++ takes necessary care to see that only one copy of that class\
    \ is inherited, regardless of how many inheritance paths exist between the virtual\
    \ base class and the derived class.\nNote:- The keywords `virtual` and `public`\
    \ may be used in either order.\n\n### Example program\n\n![](Images/image01380.jpeg)As\
    \ virtual base classAs virtual base class\n\nFig.Virtual base class\n\n```cpp\n\
    #include<iostream.h> #include<conio.h>\n\nclass employee\n{\npublic:\n    char\
    \ ename[ ];\n    void getname()\n    {\n        cout<<\"Enter the emp name\";\
    \ cin>>ename;\n    }\n};\n\nclass grosssalary : virtual public employee\n{\npublic:\n\
    \    float bp,hra,da,gross;\n    void getdetails()\n    {\n        cout<<\"Enter\
    \ the basicpay, hra, da\"; cin>>bp>>hra>>da; gross=bp+hra+da; cout<<\"gross\"\
    <<gross<<endl;\n    }\n};\n\nclass taxdeduct : public virtual employee\n{\npublic:\n\
    \    float tax;\n    void deduct()\n    {\n        cout<<\"Enter the tax amount\
    \ to be deducted: \"; cin>>tax;\n    }\n};\n\nclass netsalary : public salary,public\
    \ taxcal\n{\n    float net;\npublic:\n    void netpay()\n    {\n        net=gross-tax;\n\
    \        cout<<\"Netsalary of the employee:  \"%(ename<<\"\\t\"<<net;\n    }\n\
    };\n\nvoid main()\n{\n    netsalary ob; clrscr();\n    ob.getname(); ob.getdetails();\
    \ ob.deduct();\n    ob.netpay();\n    getch();\n}\n```\n\n**Output:**\nEnter the\
    \ emp name: geetha\nEnter the  basicpay,   hra, da : 1200040005000\nGross: 21000\n\
    Enter the tax amount to be deducted: 2000 Netsalary of the employee geetha: 19000\n\
    \n## Abstract classes\n\n* An abstract class is one that is not used to create\
    \ objects.\n* An abstract class is designed only to act as a base class (to be\
    \ inherited by other classes).\n* In the previous example, the `employee` class\
    \ is an abstract class, since it was not used to create any object.\n\n## Virtual\
    \ Functions\n\n* When we use the same function name in base and derived classes,\
    \ the function in the base class is declared as virtual using keyword `virtual`\
    \ preceding its normal declaration.\n* The member function that can be changed\
    \ at runtime is called virtual function.\n* When is function is made virtual,C++\
    \ determines which function to use at run-time based on the type of object pointed\
    \ to by the base pointer, rath than the type of the pointer.\n* Thus, making the\
    \ base pointer to point to different objects,we can execute different versions\
    \ of the virtual functions.\n* Syntax for defining virtual function is:\n```cpp\n\
    class classname\n{\npublic:\n. . . . .\nvirtual returntype functionname (arguments)\n\
    {\n. . . .  .\n. . . .  .\n}\n};\n```\n* The virtual function should be defined\
    \ in the public section of a class.\n* When one function is made virtual and another\
    \ one is normal, and compiler determines which function to create at runtime.\n\
    * In this we have to create a `basepointer`.\n* If `basepointer` points to a base\
    \ class it will execute the base class function.\n* If `basepointer` points to\
    \ a derived class it will execute the derived class function.\n\n**Example Program:**\n\
    \n```cpp\n#include <iostream.h> #include<conio.h>\n\nclass Base\n{\npublic:\n\
    \    void display()\n    {\n        cout<<\"\\ndisplay base\";\n    }\n    virtual\
    \ void show()\n    {\n        cout<<\"\\nshow base\";\n    }\n};\n\nclass Derived:public\
    \ Base\n{\npublic:\n    void display()\n    {\n        cout<<\"\\ndisplay Derived\"\
    ;\n    }\n    void show()\n    {\n        cout<<\"\\nshow Derived\";\n    }\n\
    };\n\nvoid main()\n{\n    clrscr(); Base b;\n    Derived d; Base *bptr;\n    cout<<”nbptr\
    \ points to Base\"; bptr=&b;\n    bptr->display();//Calls base class display()\n\
    \    bptr->show();//Calls base class show()\n    cout<<”nbptr points to Derived\"\
    ; bptr=&d;\n    bptr->display();//Calls derived class display()\n    bptr->show();//Calls\
    \ derived class show()\n    getch();\n}\n```\n\n**Output:**\nnbptr points to Base\n\
    display base\nshow base\nnbptr points to Derived\ndisplay base\nshow Derived\n\
    \n### Explanation about the program\n\n* The base pointer first holds the address\
    \ of the base class object means it will run the base class member function display\
    \ and show will be executed.\n* Next the base pointer points to the derived class\
    \ object, in this before executing the derived class function it will check whether\
    \ the corresponding base class function is `virtual` or not.\n* If it is not virtual\
    \ then execute the base class function otherwise it will execute the derived class\
    \ function.\n\n### Rules for virtual function\n\n1. Virtual function must be a\
    \ member of some class.\n2. They cannot be static members.\n3. They are accessed\
    \ by using base pointer.\n4. A virtual function in a base class must be defined\
    \ event though it may not be used.\n5. A prototype (or declaration) of a base\
    \ class virtual function and the derived class version must be identical.\n6.\
    \ We cannot use the pointer of the derived class to access an object of the base\
    \ class.\n\n## Member function overriding\n\nBase class and derived class have\
    \ member functions with same name and arguments. If you create an object of derived\
    \ class and write code to access that member function then, the member function\
    \ in derived class is only invoked, i.e., the member function of derived class\
    \ overrides the member function of base class. This feature in C++ programming\
    \ is known as function overriding.\n\n**Example program:**\n```cpp\nClass base\n\
    {\npublic:\n    void print()\n    {\n        cout<<”Print from base”;\n    }\n\
    }\n```\n"
