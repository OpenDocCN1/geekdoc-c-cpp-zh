    \ el.display_el();\n    getch();\n}\n```\n\n**输出:**\n学生拥有的选项为：\narts:\nmedical:\n\
    engineering:\nin engineering student can opt for any of the departments: engineering\
    \ in civil:\nengineering in mechanical:\nengineering in electronics:\n\n## 混合继承\n\
    \n* [混合继承](http://guides.wikinut.com/Inheritance-and-Its-types/6dfqqlfm/)是将一种或多种类型的继承组合在一起的方法。\n\
    \n![](img/image01378.jpeg)\n\n图. 混合（多级、多重）继承\n\n## 虚基类\n\n* 考虑一种情况，当涉及三种继承，即多级继承、多重继承和层次继承。\n\
    * 那么，`child` 将拥有两个直接基类 `parent1` 和 `parent2`，而它们本身有一个共同的基类 `grandparent`。\n* `child`\
    \ 通过两条独立的路径继承 `grandparent` 的特性。\n* 它也可以像“虚线”所示那样直接继承。\n* `grandparent` 有时被称为间接基类。\n\
    \n![](img/image01379.jpeg)\n\n图. 多路径继承\n\n* `child` 类的这种继承可能会产生一些问题。\n* `grandparent`\
    \ 类的所有公共和保护成员都被继承到 `child` 类中两次；第一次通过 `parent1` 类，第二次通过 `parent2` 类。\n* 这意味着 `child`\
    \ 类将拥有一组从 `grandparent` 继承的重复成员，这引入了歧义并应该被避免。\n* 由于这些多条路径导致的继承成员重复可以通过将共同的基类声明为虚基类来避免，同时如下所示声明直接或中间的基类：\n\
    \n```cpp\nclass grandparent\n{\n….\n….\n};\n\nclass parent1 : virtual public grandparent\n\
    {\n…….\n…..\n….\n};\n\nclass parent2 : public virtual grandparent\n{\n…….\n…..\n\
    ….\n};\n\nclass child : public parent1, public parent2\n{\n…….\n.  ……// 只会继承一份\
    \ grandparent 的副本\n…….\n};\n```\n\n* 当一个类被变成虚基类时。\n* C++ 会采取必要的措施，确保无论虚基类和派生类之间存在多少条继承路径，都只继承该类的一个副本。\n\
    注意：关键字 `virtual` 和 `public` 可以任意顺序使用。\n\n### 示例程序\n\n![](img/image01380.jpeg)作为虚基类作为虚基类\n\
    \n图. 虚基类\n\n```cpp\n#include<iostream.h> #include<conio.h>\n\nclass employee\n\
    {\npublic:\n    char ename[ ];\n    void getname()\n    {\n        cout<<\"Enter\
    \ the emp name\"; cin>>ename;\n    }\n};\n\nclass grosssalary : virtual public\
    \ employee\n{\npublic:\n    float bp,hra,da,gross;\n    void getdetails()\n  \
    \  {\n        cout<<\"Enter the basicpay, hra, da\"; cin>>bp>>hra>>da; gross=bp+hra+da;\
    \ cout<<\"gross\"<<gross<<endl;\n    }\n};\n\nclass taxdeduct : public virtual\
    \ employee\n{\npublic:\n    float tax;\n    void deduct()\n    {\n        cout<<\"\
    Enter the tax amount to be deducted: \"; cin>>tax;\n    }\n};\n\nclass netsalary\
    \ : public salary,public taxcal\n{\n    float net;\npublic:\n    void netpay()\n\
    \    {\n        net=gross-tax;\n        cout<<\"Netsalary of the employee:  \"\
    %(ename<<\"\\t\"<<net;\n    }\n};\n\nvoid main()\n{\n    netsalary ob; clrscr();\n\
    \    ob.getname(); ob.getdetails(); ob.deduct();\n    ob.netpay();\n    getch();\n\
    }\n```\n\n**输出:**\nEnter the emp name: geetha\nEnter the  basicpay, hra, da :\
    \ 1200040005000\nGross: 21000\nEnter the tax amount to be deducted: 2000 Netsalary\
    \ of the employee geetha: 19000\n\n## 抽象类\n\n* 抽象类是不用于创建对象的类。\n* 抽象类的设计目的仅是作为基类（供其他类继承）。\n\
    * 在之前的示例中，`employee` 类是一个抽象类，因为没有被用于创建任何对象。\n\n## 虚函数\n\n* 当我们在基类和派生类中使用相同的函数名时，基类中的函数通过在性普通声明前使用\
    \ `virtual` 关键字声明为虚函数。\n* 可以在运行时更改的成员函数被称为虚函数。\n* 当函数被变为虚函数时，C++ 根据基指针指向的对象的类型，而不是指针的类型，在运行时决定使用哪个函数。\n\
    * 因此，通过让基指针指向不同的对象，我们可以执行虚函数的不同版本。\n* 虚函数的定义语法为：\n```cpp\nclass classname\n{\n\
    public:\n. . . . .\nvirtual returntype functionname (arguments)\n{\n. . . .  .\n\
    . . . .  .\n}\n};\n```\n* 虚函数应该定义在类的公共部分。\n* 当一个函数是虚而另一个是普通函数时，编译器在运行时决定创建哪个函数。\n\
    * 在这里我们需要创建一个 `basepointer`。\n* 如果 `basepointer` 指向基类，它将执行基类函数。\n* 如果 `basepointer`\
    \ 指向派生类，它将执行派生类函数。\n\n**示例程序：**\n\n```cpp\n#include <iostream.h> #include<conio.h>\n\
    \nclass Base\n{\npublic:\n    void display()\n    {\n        cout<<\"\\ndisplay\
    \ base\";\n    }\n    virtual void show()\n    {\n        cout<<\"\\nshow base\"\
    ;\n    }\n};\n\nclass Derived:public Base\n{\npublic:\n    void display()\n  \
    \  {\n        cout<<\"\\ndisplay Derived\";\n    }\n    void show()\n    {\n \
    \       cout<<\"\\nshow Derived\";\n    }\n};\n\nvoid main()\n{\n    clrscr();\
    \ Base b;\n    Derived d; Base *bptr;\n    cout<<”nbptr points to Base\"; bptr=&b;\n\
    \    bptr->display();// 调用基类 display 函数\n    bptr->show();// 调用基类 show 函数\n  \
    \  cout<<”nbptr points to Derived\"; bptr=&d;\n    bptr->display();// 调用派生类 display\
    \ 函数\n    bptr->show();// 调用派生类 show 函数\n    getch();\n}\n```\n\n**输出:**\nnbptr\
    \ points to Base\ndisplay base\nshow base\nnbptr points to Derived\ndisplay base\n\
    show Derived\n\n### 程序的解释\n\n* 基指针首先持有基类对象的地址，这意味着将运行基类成员函数 display 和 show。\n\
    * 接下来基指针指向派生类对象，在执行派生类函数之前，它会检查相应的基类函数是否为虚。\n* 如果不是虚函数则执行基类函数，否则将执行派生类函数。\n\n\
    ### 虚函数的规则\n\n1. 虚函数必须是某个类的成员。\n2. 它们不能是静态成员。\n3. 通过基指针访问。\n4. 基类中的虚函数即使不使用也必须定义。\n\
    5. 基类虚函数的原型（或声明）与派生类版本必须相同。\n6. 我们不能使用派生类的指针来访问基类对象。\n\n## 成员函数重写\n\n基类和派生类具有相同名称和参数的成员函数。如果你创建一个派生对象并编写代码访问该成员函数，只会调用派生类的成员函数，即派生类的成员函数重写了基类的成员函数。这一\
    \ C++ 编程特性被称为函数重写。\n\n**示例程序：**\n```cpp\nClass base\n{\npublic:\n    void print()\n\
    \    {\n        cout<<”Print from base”;\n    }\n}\n```\n"
