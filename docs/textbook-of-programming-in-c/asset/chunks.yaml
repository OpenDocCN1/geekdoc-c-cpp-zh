  trans: '

    首先，喷泉模型（fountain model）为面向对象软件生命周期中的阶段提供了图化版本，并清晰地表示了面向对象技术实现的迭代和重叠。其次，由于成功的软件项目的基础是需求分析和规范，因此这一阶段被置于图表的底部。因此，生命周期向上生长到软件使用的顶峰，仅在必要的维护阶段才会回落。这有效地将周期的某个阶段回到了较低水平。将此模型应用于特定环境可能会导致如原型设计之类的软件生命周期：面向对象的编程语言非常适合这种开发环境。


    系统不仅可以从图 1 所示的系统生命周期角度来看，还可以从许多（通常是大量的）自主类的协同整合角度来看。在类开发和系统规范之间，可以更方便地进行交互式修改，因此不再需要在系统生命周期的早期阶段冻结整个系统需求规范——这一面向对象的方法论的属性被许多作者正面评价。因此，由于面向对象的程序本质上是作为一个相互作用的类系统（通常是独立开发的），生命周期模型的阶段可以更准确地应用于每个单独类的开发周期，而不是整个系统。


    ## 喷泉模型 - 优势


    - 迭代式瀑布开发模式

    - 经典线性

    - 分析、设计、编码、测试与发布


    ## 喷泉模型 - 劣势


    - 未反映面向对象特性

    - 无法提交交付物


    ## 对象分析的不同模型


    与传统的系统分析不同（传统方法收集用户需求然后编写规范，并要求用户对规范签字），对象方法使用一种更具迭代性的过程，其中需求和规范被反复审查，并且用户深度参与。


    对象技术有许多不同的方法来帮助分析和设计计算机系统。我们将回顾四种最流行的系统：Rumbaugh、Booch、Coad-Yourdon 和 Shlaer-Mellor。在大多数情况下，这些方法非常相似，但每种方法都有自己的图形化表示实体的方法。对于所有项目来说，理解和使用这四种方法可能会变得困难甚至不可能。如果需要，可以将一种方法的概念与另一种技术的概念结合起来，基本上创建你自己的对象开发技术。最重要记住的一点是，最终结果才是真正重要的，而不是选择一种分析技术而非另一种技术。记住，进行适当的分析和设计以满足用户需求，比盲目地遵循一个毫无意义的程序要重要得多。


    传统的系统开发方法有时被称为瀑布法。通过瀑布法，对象分析师遵循分析、设计、编码、测试和维护的逻辑演进。遗憾的是，系统开发很少符合这种结构化方法。终端用户以改变主意或识别出他们忘记识别的某些功能而闻名。这些需求的变化可能发生在系统开发的任何阶段，分析师必须努力将这些变化纳入系统。


    面向对象的方法论需要一个更具迭代性的过程，且具有相同的五个步骤。迭代过程要么添加新属性，要么更清晰地定义现有属性，而不像传统方法那样重做已经完成的规范。迭代过程有助于减少对系统到底应该做什么以及用户到底想要什么的困惑。面向对象的软件开发方法假设用户需求会发生。然而，你使用哪种编程语言（无论是
    `FORTRAN` 还是 `C++`）并不重要。此外，你使用哪种系统开发技术并不重要，你将在系统开发中遵循相同的五个步骤。仅仅是这五个步骤的应用方式决定了你系统开发项目的差异。


    ## Rumbaugh 方法


    Rumbaugh 方法列在第一是因为这是这些作者最喜欢的，我们发现这是一个非常友好且易于使用的方法。对于传统的系统分析师来说，Rumbaugh 方法与传统的系统分析和设计方法最接近，新手将识别熟悉的符号和技术。Rumbaugh
    方法的主要优势在于对象分析，但它在对象设计方面也非常出色。Rumbaugh 在对象分析阶段有三个交付物：`Object model`（对象模型）、`Dynamic
    model`（动态模型）和 `functional model`（功能模型）。这三个模型与传统的系统分析相似，增加了对象模型部分，包括 `classes`（类）的定义以及
    `classes` 变量和行为。Rumbaugh 对象模型非常像实体关系图，只是现在图中有了行为和类层次结构。动态模型是一个“状态转换”图，显示了实体如何从一个状态转变为另一个状态。功能模型等同于传统系统分析中熟悉的数据流图。


    ## Booch 方法


    Booch 方法的主要优势在于对象系统设计。Grady Booch 在他的方法中包含了与传统需求分析相似的需求需求分析，以及一个领域分析阶段。Booch 的对象系统设计方法分为四个部分：定义
    `class hierarchies`（类层次结构）的逻辑结构设计，以及描述 `object methods`（对象方法）的物理结构图。此外，Booch 以非常类似于
    Rumbaugh 方法的方式定义了 `classes`（类）的动态，以及对对象实例动态的分析，在其中描述了对象如何改变状态。


    ## Coad-Yourdon 方法


    Coad-Yourdon 方法的主要优势在于系统分析。他们的方法基于一种名为 "SOSAS" 的技术，这代表了组成他们方法分析部分的五个步骤。系统分析的第一步称为
    `Subjects`（主体），它们基本上是对象的数据流图。第二步称为 `Objects`（对象），在其中他们识别 `object classes`（对象类）和
    `class hierarchies`（类层次结构）。第三步称为 `Structures`（结构），将结构分解为两种类型：`classification structures`（分类结构）和
    `composition structures`（组合结构）。`classification structures` 处理相关类之间的继承连接，而 `composition
    structures` 处理类之间的所有其他连接。分析的下一步是 `Attributes`（属性），最后一步是 `Services`（服务），在其中识别了每个类的所有行为或方法。


    在分析之后，Coad 和 Yourdon 定义了组成他们方法设计部分的四个部分。系统设计的步骤为：


    - 问题域组件 - 这将定义应该位于问题域的类。

    - 人机交互组件 - 这些步骤定义了对象之间的接口类。

    - 任务管理组件 - 在这里识别系统级管理类。

    - 数据管理组件 - 此设计步骤识别了数据库访问方法所需的类。


    ## Shlaer-Mellor 方法


