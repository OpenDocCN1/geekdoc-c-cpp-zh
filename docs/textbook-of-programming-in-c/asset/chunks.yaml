    \ or any item with which the computer must deal or handle.\n* Someobjectsmaycorrespondtoreal-worldentitiessuch\
    \ as students, employees, bank accounts, etc.\n* Every object will have a state\
    \ called `attributes`(`data`) and the behavior called `operations`(`function)`.\n\
    \nWhen a program is executed, the objects interact by sending messages to one\
    \ another. For example, if `customer` and `account` are the two objects in a program,\
    \ then the `customer` object may send a message to the `account` object. Each\
    \ object contains data and code to manipulate the data. objects can interact without\
    \ having to know details of each others data or code. It is sufficient to know\
    \ the type of message accepted, and the type of response returned by the objects.\n\
    \n![](Images/image01316.jpeg)![](Images/image01317.jpeg)\n\n**Fig. 2 ways of representing\
    \ an object**\n\nDesktop lamp may have only two possible states (`on` and `off`)\
    \ and two possible behaviors (`turn on`, `turn off`), but your desktop radio might\
    \ have additional states (`on`, `off`, `current volume`, `current station`) and\
    \ behavior (`turn on`, `turn off`, `increase volume`, `decrease volume`, `seek`,\
    \ `scan`, and `tune`).\n\n### ![](Images/image01318.jpeg) Eg:\n\n| Account |\n\
    | Ac_ number Account type Name Balance |\n| `Deposit()` `Withdraw()` `Enquire()`\
    \ |\n\n* Each object will have its own identity though its `attributes` and operations\
    \ are same, the objects will never be equal.\n* For For example in case of a person\
    \ object, two persons will have same attributes like `name`, `age`, `sex`;but\
    \ they are not equal.\n\n###  Classes\n\n* We know that objects contain data\
    \ and function or code to manipulate that data. The entire set of data and code\
    \ of an object can be made a user-defined data type with the help of a `class`.\n\
    * Objects are variables of type `class`.\n* Classes are user defined data types\
    \ and behaves like the built-in types of a programming language.\n* Once a `class`\
    \ has been defined, we can create any number of objects associated with that `class`.\n\
    * Thus, a `class` is collection of objects of similar type i.e., the objects with\
    \ the same state (`attributes`) and behavior(`operations`) are grouped into a\
    \ `class`.\n* For example, `mango`, `apple` and `orange` are members of class\
    \ `fruit`.\n* The syntax used to create an object is no different from the syntax\
    \ used to create an integer object in `C`.\n* If `fruit` has been defined as a\
    \ `class`, then the statement\n\n### Eg:\n\n```\nfruit mango;\n```\n\nwill create\
    \ an object `mango` belonging to the class `fruit`.\n\n### Examples:\n\n1. Class:\
    \ `person` Object: `girl`, `boy` Attributes: `Name`, `Age` Operations: `speak()`,\
    \ `listen()`, `walk()`\n2. Class: `vehicle` Object: `car`, `bus` Attributes: `Name`,\
    \ `model`, `color` Operations : `start()`, `stop()`, `accelerate()`\n\n### In\
    \ C++ class can be represented as:\n\n```cpp\nClass account\n{\nPrivate:\n  char\
    \ name[20]; int act_type; float balance;\nPublic:\n};\ndeposit( ); withdraw( );\n\
    ```\n\n* It is similar to structure declaration in `C`.\n* It enables the creation\
    \ of class variables called `objects`.\n\n### Example:\n\n```cpp\n#include <iostream>\n\
    #include <conio.h>\nusing namespace std;\n\nclass account {\nprivate:\n  int a;\n\
    public:\n  void getdata() {\n    cout << \"enter number to check: \";\n    cin\
    \ >> a;\n  }\n  void check() {\n    if(a % 2 == 0)\n      cout << \"given number\
    \ is even\";\n    else\n      cout << \"given number is odd\";\n  }\n};\n\nvoid\
    \ main() {\n  getscr();\n  account e;\n  e.getdata();\n  e.check();\n}\n```\n\n\
    **Output:**\nEnter number to check: 9\ngiven number is odd\n\n2.\n\n```cpp\n#include\
    \ <iostream>\n#include <conio.h>\nusing namespace std;\n\nclass velocity {\nprivate:\n\
    \  int v, a, t;\npublic:\n  void getdata() {\n    cout << \"Enter values for velocity,\
    \ acceleration,\nand time: \";\n    cin >> v >> a >> t;\n  }\n  void calculate()\
    \ {\n    v = v + (a * t);\n    cout << \"FINAL VELOCITY= \" << v;\n  }\n};\n\n\
    void main() {\n  getscr();\n  velocity ob;\n  ob.getdata();\n  ob.calculate();\n\
    }\n```\n\n**Output:**\nEnter values for velocity, acceleration,and time: 10 5\
    \ 2\nFINAL VELOCITY= 20\n\n###  Encapsulation\n\n* Encapsulation is the most\
    \ striking feature of OOP. The wrapping of data and functions into a unit is called\
    \ encapsulation.\n* The data is not accessible to the outside world; only those\
    \ functions can access it.\n* This is also known as “data hiding” or “information\
    \ hiding”.\n\n###  Abstraction\n\n* Abstraction refers to the act of representing\
    \ essential features without including details. To understand this concept more\
    \ clearly, take an example of 'switch'. You only know particular switches as What\
    \ is happening inside is hidden.\n* Classes use the concept of abstraction. They\
    \ are also known as Abstract Data Types (ADT).\n\n###  Inheritance\n\n* It is\
    \ the process by which objects of one class acquire the properties of another\
    \ class. own* It provides reusability i.e., we can add additional features to\
    \ an existing class.\n* This is possible by deriving a new class from an existing\
    \ one.\n* An existing class is known as base class and the new class is known\
    \ as derived class (sub-class), parent class (super class).\n\n###  Polymorphism\n\
    \n* Polymorphism is a key to the power of OOPs.\n* It is a Greek word, means the\
