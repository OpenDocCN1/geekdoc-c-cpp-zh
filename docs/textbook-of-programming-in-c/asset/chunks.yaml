    void multiply(); void divide();

    };inline void inlinefunc::  multiply()

    {

    cout<<"Enter 2 integers:"; cin>>a>>b;

    int x=a*b; cout<<x;

    }


    inline void inlinefunc::divide()

    {

    }


    void main()

    {

    cout<<endl<<"Enter 2 float values:"; cin>>c>>d;

    float y=c/d; cout<<y;


    inlinefunc f; clrscr();

    f.multiply();

    f.divide();


    getch();

    }

    ```


