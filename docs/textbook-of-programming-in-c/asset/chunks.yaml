- fmt: "\n* Operator overloading is a concept of overloading of existing operators.\n\
    * Operator overloading allows us to assign multiple meanings to the operators.\n\
    * An overloaded operator is called an operator function.\n* The C++ language uses\
    \ the keyword `operator` for overloading of operators.\n* You declare an operator\
    \ function with the keyword `operator` preceding the operator.\n* The `operator`\
    \ keyword is to overload built-in operators.\n* Overloaded operators are distinct\
    \ from overloaded functions.\n* Operator overloading is the ability to tell the\
    \ compiler how to perform a certain operation when its corresponding operator\
    \ is used on one or more variables.\n* We can overload (give additional meaning\
    \ to) all the C++ operators, except the following:\n\n| S.No. | Operators | Meaning\
    \ |\n| :--- | :--- | :--- |\n| 1. | `.` | Class member access operator |\n| 2.\
    \ | `.*` | Pointer-to-member access operator |\n| 3. | `::` | scope resolution\
    \ operator |\n| 4. | `size of` | size of operator |\n| 5. | `?:` | conditional\
    \ operator |\n| 6. | `#` | Preprocessor convert to string |\n| 7. | `##` | Preprocessor\
    \ concatenate |\n\nTable: Operators that cannot be overloaded\n\n* The excluded\
    \ operators are very few when compared to the large number of operators which\
    \ qualify for the operator overloading definition.\n\n**Note:** Although the semantics\
    \ of an operator can be extended, we cannot change its syntax, the rules that\
    \ govern its use such as number of operands, precedence and associativity. (For\
    \ ex. multiplication operator will have higher precedence than the addition operator)\n\
    \n* Remember, when an operator is overloaded, its original meaning is not lost.\n\
    \n## Over loadable operators\n\n* C++ provides a wide variety of operators to\
    \ perform operations on various operands.\n* The operators are classified into\
    \ unary and binary operators based on the number of arguments on which they operate.\n\
    * C++ allows almost all operators to be overloaded in which case at least one\
    \ operand must be an instance of a class (object).\n\n| S.No. | Operator category\
    \ | operators |\n| :--- | :--- | :--- |\n| 1. | Arithmetic | `+`, `-`, `*`, `/`,\
    \ `%` |\n| 2. | Bit-wise | `&`, `|`, `~`, `^` |\n| 3. | Logical | `&&`, `||`,\
    \ `!` |\n| 4. | Relational | `>`, `<`, `++`, `!=`, `<=`, `>=` |\n| 5. | Assignment\
    \ | `=` |\n| 6. | Arithmetic assignment | `+=`, `-=`, `+=`, `/=`, `%=`, `&=`,\
    \ `|=`, `^=` |\n| 7. | Shift | `<<`, `>>`, `<<=`, `>>=` |\n| 8. | Unary increment\
    \ and decrement | `++`, `--` |\n| 9. | Subscripting | `[]` |\n| 10. | Function\
    \ call | `()` |\n| 11. | Dereferencing | `->` |\n| 12. | Unary sign prefix | `+`,\
    \ `-` |\n| 13. | Allocate and free | `new`, `delete` |\n\nTable. C++ overloadable\
    \ operators\n\n### Examples:\n\nThe compiler acts differently with regards to\
    \ the subtraction operator `-` depending on how the operator is being used.\n\n\
    * When it is placed on the left of a numeric value such as `-48`, the compiler\
    \ considers the number a negative value.\n* When used between two integral values,\
    \ such as `80-712`, the compiler applies the subtraction operation.\n* When used\
    \ between an integer and a double-precision number, such as `558-9.27`, the compiler\
    \ subtracts the left number from the right number; the operation produces a double-precision\
    \ number.\n* When the `-` symbol is doubled and placed on one side of a variable,\
    \ such as `--Variable` or `Variable--`, the value of the variable needs to be\
    \ decremented; in other words, the value 1 shall be subtracted from it.\n\nThe\
    \ `*` operator when applied to a pointer variable, gives the value pointed by\
    \ the pointer. But is also commonly used for multiplication.\n\n* So, the number\
    \ and type of operands decide the nature of operation to follow.\n\nThe input/output\
    \ operations like `<<` and `>>` are good examples of operator overloading.\n\n\
    * `<<`: Built-in definition is for shifting of bits.\n* But in C++, it is used\
    \ for displaying the values.\n* Similarly, we can define additional meaning to\
    \ all other C++ operators.\n\n## Operator keyword\n\n* The keyword `operator`\
    \ facilitates overloading of the C++ operators.\n* The keyword `operator` indicates\
    \ that the operator symbol following it, is the C++ operator to be overloaded\
    \ to operate on members of its class.\n* To define an additional task to an operator,\
    \ we must specify what it means in relationship to the class to which the operator\
    \ is applied.\n* This is done with the help of a special function, called operator\
    \ function, which describes th\n\n```cpp\nreturn_type operatorop(arglist)\n{\n\
    \    body of operator function//task defined\n}\n```\nFig. Syntax of operator\
    \ overloading\n\nWhere,\n* `return_type` is the type of value returned by the\
    \ specified operation.\n* `Op` is the operator being overloaded i.e. operator\
    \ symbol.\n* `Op` is preceded by the keyword `operator`.\n* `Operator op` is the\
    \ function name.\n\nExample:\n```cpp\nint operator+(int a, int b)\n{\n    return\
    \ a+b;\n}\n```\n\n### Process of overloading\n\n* Create a class.\n* Declare the\
    \ operator function in public part of the class. It may be a member or friend\
    \ function.\n* Define the operator to implement the required operations.\n\n###\
    \ Types of operator overloading\n\n* Unary overloading\n* Binary operator overloading\n\
    \n## Unary overloading\n\n* A unary operator acts on only one operand.\n* The\
    \ syntax for invoking the unary operator is: `operator op`.\n* Overloading without\
    \ arguments is known as unary overloading.\n* Commonly used unary operators are\
    \ unary (-), increment (++) and decrement (--).\n\nExample:\n```cpp\n#include<iostream.h>\n\
    #include<conio.h>\n\nclass unary\n{\n    int x, y, z;\npublic:\n    void getdata()\n\
    \    {\n        cout<<\"Enter the x,y,z values: \";\n        cin>>x>>y>>z;\n \
    \   }\n    void display()\n    {\n        cout<<x<<\"\\t\"<<y<<\"\\t\"<<z;\n \
    \   }\n    void operator-();\n};\n\nvoid unary::operator-()\n{\n    x=-x;\n  \
    \  y=-y;\n    z=-z;\n}\n\nvoid main()\n{\n    clrscr();\n    unary ob;\n    ob.getdata();\n\
    \    cout<<\"BEFORE ACTIVATING THE OPERATOR\\n\";\n    ob.display();\n    -ob;\n\
    \    cout<<\"AFTER ACTIVATING THE OPERATOR\\n\";\n    ob.display();\n    getch();\n\
    }\n```\nOutput:\nEnter the x,y,z values: 5 6 7\nBEFORE ACTIVATING THE OPERATOR\n\
    5\t6\t7\nAFTER ACTIVATING THE OPERATOR\n-5-6-7\n\n**Note:**\n* The function `operator-()`\
    \ takes no argument.\n* It only changes the sign of data members of the object\
    \ `ob`.\n* Since this function is a member function of the same class, it can\
    \ directly access the members of the object which activated it.\n\n## Binary operator\
    \ overloading\n\n* A binary operator acts on two operands.\n* The syntax for overloading\
    \ the operator is: `operator op(arg)`.\n* Overloading with explicit arguments\
    \ is known as binary overloading.\n\nExample:\n```cpp\n#include<iostream.h>\n\
    #include<conio.h>\n\nclass space\n{\nprivate:\n    int x, y, p, q;\n\npublic:\n\
    \    void getdata(int a,int b,int m,int n)\n    {\n        x=a; y=b;\n       \
    \ p=m; q=n;\n    }\n    void display()\n    {\n        cout<<\"values of x,y for\
    \ increment operator \"<<endl; cout<<x<<\"\\t\"<<y<<endl;\n        cout<<\"values\
    \ of p,q for decrement operator \"<<endl; cout<<p<<\"\\t\"<<q<<endl;\n    }\n\
    \    void operator++();\n    void operator--();\n};\n\nvoid space::operator--()\n\
    {\n    p=--p;\n    q=q--;\n}\n\nvoid main()\n{\n    clrscr();\n    space s; \n\
    \    s.getdata(12,76,80,45);\n    cout<<\" BEFORE OVERLOADING \\n\";\n    s.display();\n\
    \    ++s;\n    --s;\n}\n```\n*(Note: The provided text example shows increment/decrement\
    \ logic but follows binary logic structure).*\n"
