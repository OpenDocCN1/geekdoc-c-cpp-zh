- fmt: '

    The Shlaer-Mellor methodology has its primary strength in system design and is
    considered somewhat weak on analysis. The Shlaer-Mellor methodology includes three
    models: the information model, the state model, and the process model. The information
    model contains `objects`, `variables`, and all the relationships between the `objects`,
    and is basically a data model for the system. The state model records the different
    states of `objects` and changes that can occur between the `objects`. The process
    model is really not much more than a traditional data flow diagram.


    Now that we have covered the basics of the object approach, let''s take a look
    at how a real-world object is created by using these techniques.


    # The Object-Oriented Design Model


    One object-oriented methodology is based around the re-use of development modules
    and components. As such, a new development model is required that takes this re-use
    into account. The object-oriented model as shown in Figure 1.15, “The Object-Oriented
    Design Model” builds integration of existing software modules into the system
    development. A database of reusable components supplies the components for re-use.
    The object-oriented model starts with the formulation and analysis of the problem.
    The design phase is followed by a survey of the component library to see if any
    of the components can be re-used in the system development. If the component is
    not available in the library then a new component must be developed, involving
    formulation, analysis, coding and testing of the module. The new component is
    added to the library and used to construct the new application.


    This model aims to reduce costs by integrating existing modules into development.
    These modules are usually of a higher quality as they have been tested in the
    field by other clients and should have been debugged. The development time using
    this model should be lower as there is less code to write.


    Figure 1.15. The Object-Oriented Design Model


    ![](Images/image01399.jpeg)


    The object-oriented model should provide advantages over the other models as the
    libary of components grows over time.


    # An Example Design Problem


    **Task:** If we were given the problem; “Write a program to implement a simple
    savings account”… The account should allow deposits, withdrawals, interest and
    fees.


    **Solution:** The problem produces many concepts, such as `bank account`, `deposit`,
    `withdrawal`, `balance` etc.. that are important to understand. An OO language
    allows the programmer to bring these concepts right through to the coding step.
    The savings account may be built with the properties of an `account number` and
    `balance` and with the methods of `deposit` and `withdrawal`, in keeping with
    the concept of the `bank account`. This allows an almost direct mapping between
    the design and the coding stages, allowing code that is easy to read and understand
    (reducing maintenance and development costs).


    OOP also allows software re-use! … The concept of this savings account should
    be understood, independent of the rest of the problem. This general savings account
    will certainly find re-use in some other financial problem.


    So after discussion with the client, the following formulation could be achieved
    - Design a banking system that contains both teller and ATM interaction with the
    rules:


    * The cashiers and ATMs dispense cash.

    * The network is shared by numerous banks.

    * Each transaction will involve an account and documentation.

    * There are different types of bank accounts.

    * There are different kinds of transactions.

    * All banks use the same currency.

    * Foreign currency transactions are permitted.

    * ATMs and tellers require a cash card.


    ### Step 1. Identify Possible Classes


    * `ATM`, `cashier`, `cashier station`, `software`, `customer`, `cash`.

    * `banking network`, `bank`.

    * `transaction`, `transaction record`.

    * `account`, `deposit account`, `long term savings account`, `current account`.

    * `withdrawal`, `lodgement`, `cheque`.

    * `currency`.

    * `foreign currency`, `euro cheque`.

    * `cash card`, `computer system`.


    ### Step 2. Remove Vague Classes


    * `software`, `computer system`, `cash`.


    ### Step 3. Add New classes that arise!


    * `currency converter`


    ### Step 4. Create Associations


    * `Banking Network` (includes cashiers and `ATMs`)

    * `Banks` (holds accounts)

    * `Account` (has a `balance`, a `currency`, a `log` of `transactions`)

    * `Transaction` (requires a cash card)

    * `Lodgement` (has an `account number`, an `amount`)

    * `Withdrawal` (has an `account number`, an `amount`)

    * `Cheque` (is a `withdrawal`, has a `payee`, an `amount`)

    * `Eurocheque` (is a `cheque`, has a `currency`)

    * `ATMs` (accept cashcards, dispenses cash)


    ### Step 5. Refine the Classes


    **Bank:**

    * has a name

    * has accounts

    * has a base currency

    * has a sort code


    **Account:**

    * has an owner

    * has a `balance`

    * has an `account number`

    * has a `log` of `transactions`


    **Deposit Account:**

    * is an `account`

    * has a shared interest rate


    **Current Account:**

    * is an `account`

    * has an `overdraft limit`


    **Transaction:**

    * has an `account`

    * has a `date`

    * has a `value`

    * has a `bank`

    * has an `account`

    * has a `number`


    **Withdrawal:**

    * is a `transaction`


    **Lodgement:**

    * is a `transaction`


    **Cheque:**

    * is a `withdrawal`

    * has a `payee`


    **EuroCheque:**

    * is a `cheque`

    * has a `currency`


    **CurrencyConverter:**


    ### Step 6. Visual Representation of the Classes


    ![](Images/image1400.jpeg) Figure 1.16. The `Bank` class.


    ![](Images/image1401.jpeg) Figure 1.17. The `Account` class.


    ![](Images/image1400.jpeg) Figure 1.18. The `Transaction` class.


    ![](Images/image1403.jpeg)


    # COMPONENT SOFTWARE


    (How to represent ‘components’ in object-oriented design? Explain.)


    The breakdown of a project into its logical components is the essence of object-oriented
    analysis and design. That''s also the basis for component software, which is composed
    of reusable pieces of software in binary form (as opposed to source code) that
    can be plugged into components from other vendors with relatively little effort.
    It is important to realize that a component-based approach to software development
    does not dictate the structure of an application. Rather, it is a model that makes
    possible the programming, use, and independent evolution of binary software components.
    Components are independent of the applications that use them as well as the programming
    languages used to create them.


    Software components can be divided into a variety of categories, including visual
    components, such as buttons or list boxes, and functional components, such as
    ones that add printing or spell checking capability. For example, a component-based
    architecture might enable spell checker components from multiple vendors to be
    plugged into a single word processing program from another vendor. This would
    hold many advantages for the end user. A user might love the word processor produced
    by company A but hate the spell checker it comes with. If the word processor was
    designed so that the spell checker component can be replaced, the user can purchase
    a spell checker from company B, which specializes in creating spell checkers.
    Component software enables software developers to specialize in what they do best.

