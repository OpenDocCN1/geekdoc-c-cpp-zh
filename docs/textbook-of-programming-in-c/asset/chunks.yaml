  trans: "\n\n```cpp\ncout<<\"\\nThe biggest number is \"<<ob2.getmax(); getch();\n\
    \n}\n```\n\n## 使用模板的优势\n\n- 模板支持泛型编程，允许开发可重用的软件组件（如函数、类等），并在单个框架内支持不同的数据类型。\n\
    - 模板会根据传递给它们的参数数据类型执行适当的操作。\n- 在实现如 `vectors`、`stacks`、`lists`、`queues` 等通用结构时，模板非常有用，这些结构可以与任意类型配合。\n\
    - 模板在编译时进行类型检查。因此，编译器可以在编译时确定与模板定义相关的类型是否能够执行该模板定义所需的所有功能。\n- 从设计上来说，模板可以用于非常复杂的问题空间。\n\
    \n## 使用模板的固有缺点\n\n- 从历史角度看，某些编译器对模板的支持较差。因此，使用模板可能会降低代码的可移植性。\n- 许多编译器在检测到模板定义错误时缺乏清晰的指令。这会增加开发模板的工作量，并促成了\
    \ Concepts（概念）的发展，以便未来将其纳入 C++ 标准中。\n- 由于编译器会为每个模板类型生成额外的代码，无加别使用模板会导致代码膨胀，导致可执行文件变大。\n\
    - 因为模板本质上暴露了其实现，在大型系统中不智的使用会导致更长的构建时间。\n- 调试使用模板开发的代码可能困难。由于编译器会替换模板，调试器在运行时很难定位到代码。\n\
    - 模板的模板（嵌套）并非所有编译器都支持，或者可能有最大嵌套层级。\n- 模板位于头文件中，当进行更改时需要对所有项目部分进行完全重新编译。\n- 没有信息隐藏。所有代码都暴露在头文件中。没有任何库可以单独包含代码。\n\
    \n## 标准模板库\n\n标准模板库 (STL) 包含：\n\n- 容器 (Containers)\n- 算法 (Algorithms)\n- 迭代器 (Iterators)\n\
    \n![](img/image01393.jpeg)\n\n容器是内存中组织存储数据的方式，例如元素数组。\n\nSTL 中的算法应用于容器以处理其数据的程序，例如在数组中搜索元素，或对数组进行排序。\n\
    \n迭代器是指针概念的泛化，它们指向容器中的元素，例如，你可以增加迭代器以指向数组中的下一个元素。\n\n- 迭代器是类指针的实体，用于访问容器中的单个元素。\n\
    - 它们通常用于从一个元素移动到另一个元素，这个过程被称为遍历容器。\n- 成员函数 `begin()` 和 `end()` 返回指向容器第一个元素和最后一个元素之后元素的迭代器。\n\
    \n### 容器\n\n容器是存储数据的方式，可以是内置数据类型（如 `int` 和 `float`），也可以是类对象。\n\nSTL 提供了几种基本类型的容器：\n\
    \n- `<vector>`: 一维数组\n- `<list>`: 双向链表\n- `<deque>`: 双端队列\n- `<queue>`: 队列\n-\
    \ `<stack>`: 栈\n- `<set>`: 集合\n- `<map>`: 关联数组\n\n### i) 序列容器\n\n序列容器按顺序存储一组元素，换句话说，每个元素（第一个和最后一个除外）前面都有一个特定的元素，后面都有另一个元素，`<vector>`、`<list>`\
    \ 和 `<deque>` 就是序列容器。\n\n### ii) 关联容器\n\n关联容器是非顺序的，但它使用一个 `key`（键）来访问元素。键（通常是数字或字符串）被容器用于按特定顺序排列存储的元素，例如在字典中，条目按字母顺序排序的。\n\
    \n- `<set>` 存储许多包含键的项。键是用于排序项的属性，例如，集合可以存储 `Person` 类的对象，这些对象根据名称按字母顺序排序。\n- `<map>`\
    \ 存储对象对：一个键对象和一个关联的值对象。`<map>` 在某种程度上类似于数组，不同之处在于它不是使用索引号访问元素，而是使用任意类型的索引来访问元素。\n\
    \n### iii) 适配器容器\n\n容器适配器只是特殊的容器，它们使用 STL 提供的容器、迭代器和算法的通用框架。\n\n![](img/image01394.jpeg)\n\
    \n## 算法\n\n范围 (range) 是任何可以通过迭代器或指针访问的对象序列，例如数组或某些 [STL 容器](http://www.cplusplus.com/stl)\
    \ 的实例。但注意，算法直接通过迭代器对值进行操作，不会以任何方式影响任何容器的结构（它永远不会影响容器的大小或存储分配）。算法的类型有：\n\nI. **非修改算法**：某些方法是：\n\
    1. `count()`\n2. `equal()`\n3. `find()`\n4. `find_end()`\n5. `find_if()`\n6. `search()`\n\
    \nII. **修改算法**：某些方法是：\n1. `copy()`\n2. `fill()`\n3. `generate()`\n4. `remove()`\n\
    5. `replace()`\n6. `reverse()`\n7. `unique()`\n\nIII. **排序算法**：某些方法是：\n1. `binary_search()`\n\
    2. `equal_range()`\n3. `merge()`\n4. `sort()`\n5. `partial_sort()`\n6. `Partition()`\n\
    \nIV. **集合算法**：\n1. `include()`\n2. `set_difference()`\n3. `set_intersection()`\n\
    4. `set_union()`\n\nV. **关系算法**：某些方法是：\n1. `equal()`\n2. `max()`\n3. `max_element()`\n\
    4. `min()`\n5. `min_element()`\n6. `mismatch()`\n\n让我们通过使用 vector 模板来展示容器、迭代器和算法的工作。\n\
    \n![](img/image0195.jpeg)\n\n```cpp\n#include <vector>\n#include <iostream>\n\n\
    vector<int> v(3);  // 创建一个大小为 3 的 int vector\nv[0]=23;\n\nv[1]=12;\nv[2]=9; //\
    \ vector 已满\nv.push_back(17);// 在数组末尾添加新值\nfor (int i=0; i<v.size(); i++) // vector\
    \ 的成员函数 size()\n    cout << v[i] << \" \"; // 随机访问 i 个元素\n```\n\n![](img/image196.gif)\n\
    ```cpp\n#include <vector>\n#include <algorithm>\n#include <iostream>\nint key;\n\
    \nint arr[] = { 12, 3, 17, 8, 34, 56, 9 }; // 标准 C 数组\nvector<int> v(arr, arr+7);\
    \ // 使用 C 数组初始化 vector\nvector<int>::iterator iter;\n\ncout << \"enter value:\"\
    ;\ncin >> key;\n\niter=find(v.begin(),v.end(),key); // 在 v 中查找整数 key\nif (iter\
    \ != v.end()) // 找到元素\n    cout << \"Element \" << key << \" found\" << endl;\n\
    else\n    cout << \"Element \" << key << \" not in vector v\" << endl;\n```\n\n\
    这个 `find()` 算法用于查找一个数字是否存在于给定的 vector 中。\n\n"
