    Waterfall approach was the first SDLC Model to be used widely in Software Engineering
    to ensure success of the project. In "The Waterfall" approach, the whole process
    of software development is divided into separate phases. In Waterfall model, typically,
    the outcome of one phase acts as the input for the next phase sequentially.


    Following is a diagrammatic representation of different phases of waterfall model.


    ![](Images/image01397.jpeg)


    The sequential phases in Waterfall model are:


    *   Requirement Gathering and analysis: All possible requirements of the system
    to be developed are captured in this phase and documented in a requirement specification
    doc.

    *   System Design: The requirement specifications from first phase are studied
    in this phase and system design is prepared. System Design helps in specifying
    hardware and system requirements and also helps in defining overall system architecture.

    *   Implementation: With inputs from system design, the system is first developed
    in small programs called units, which are integrated in the next phase. Each unit
    is developed and tested for its functionality which is referred to as Unit Testing.

    *   Integration and Testing: All the units developed in the implementation phase
    are integrated into a system after testing of each unit. Post integration the
    entire system is tested for any faults and failures.

    *   Deployment of system: Once the functional and non-functional testing is done,
    the product is deployed in the customer environment or released into the market.

    *   Maintenance: There are some issues which come up in the client environment.
    To fix those issues patches are released. Also to enhance the product some better
    versions are released. Maintenance is done to deliver these changes in the customer
    environment.


    All these phases are cascaded to each other in which progress is seen as flowing
    steadily downwards (like a waterfall) through the phases. The next phase is started
    only after the defined set of goals are achieved for previous phase and it is
    signed off, so the name "Waterfall Model". In this model phases do not overlap.


    ## WATERFALL MODEL APPLICATION


    Every software developed is different and requires a suitable SDLC approach to
    be followed based on the internal and external factors. Some situations where
    the use of Waterfall model is most appropriate are:


    *   Requirements are very well documented, clear and fixed.

    *   Product definition is stable.

    *   Technology is understood and is not dynamic.

    *   There are no ambiguous requirements.

    *   Ample resources with required expertise are available to support the product.

    *   The project is short.


    ## WATERFALL MODEL PROS & CONS


    ### ADVANTAGE


    The advantage of waterfall development is that it allows for departmentalization
    and control. A schedule can be set with deadlines for each stage of development
    and a product can proceed through the development process model phases one by
    one.


    Development moves from concept, through design, implementation, testing, installation,
    troubleshooting, and ends up at operation and maintenance. Each phase of development
    proceeds in strict order.


    ### DISADVANTAGE


    The disadvantage of waterfall development is that it does not allow for much reflection
    or revision. Once an application is in the testing stage, it is very difficult
    to go back and change something that was not well documented or thought upon in
    the concept stage.


    The following table lists out the pros and cons of Waterfall model:


    | Pros | Cons |

    | :--- | :--- |

    | * Simple and easy to understand and use | * No working software is produced
    until late during the life cycle. |

    | * Easy to manage due to the rigidity of the model. each phase has specific deliverables
    and a review process. | * High amounts of risk and uncertainty. |

    | * Phases are processed and completed one at a time. | * Not a good model for
    complex and object-oriented projects. |

    | * Works well for smaller projects where requirements are very well understood.
    | * Poor model for long and ongoing projects. |

    | * Clearly defined stages. | * Not suitable for the projects where requirements
    are at a moderate to high risk of changing. So risk and uncertainty is high with
    this process model. |

    | * Well understood milestones. | * It is difficult to measure progress within
    stages. |

    | * Easy to arrange tasks. | * Cannot accommodate changing requirements. |

    | * Process and results are well documented. | * No working software is produced
    until late in the life cycle. |

    | | * Adjusting scope during the life cycle can end a project. |

    | | * Integration is done as a "big-bang." at the very end, which doesn''t allow
    identifying any technological or business bottleneck or challenges early. |


    ## FOUNTAIN FLOW MODEL


    Anthony Aleong, Glen Mitchell, Kareem Shaw


    The waterfall model is well understood, but it''s not as useful as it once was.
    In a 1991 Information Center Quarterly article, Larry Runge says that SDLC "works
    very well when we are automating the activities of clerks and accountants. It
    doesn''t work nearly as well, if at all, when building systems for knowledge workers
    -- people at help desks, experts trying to solve problems, or executives trying
    to lead their company into the Fortune 100."


    Another problem is that the waterfall model assumes that the only role for users
    is in specifying requirements, and that all requirements can be specified in advance.
    Unfortunately, requirements grow and change throughout the process and beyond,
    calling for considerable feedback and iterative consultation. Thus many other
    SDLC models have been developed.


    The fountain model recognizes that although some activities can''t start before
    others—such as you need a design before you can start coding—here''s a considerable
    overlap of activities throughout the development cycle.


    ### FOUNTAIN MODEL


    *   Support Incremental Development

    *   Recognizes that some activities can’t stand before others, yet there’s a considerable
    overlap of activities throughout the development cycle

    *   Implies that you do some analysis, then some design, then some implementation

    *   Parallelism among various phases and iteration within phases

    *   Development of an object-oriented system that more likely to lead us to focus
    on sections of the whole known as clusters or subsystems

    *   Subsystems are collections of classes, which work closely together

    *   Supports human learning and is recommended for most projects


    ### Object-Oriented Life Cycle Notation (Fountain Model)


    Any graphical representation of the object-oriented version of the overall software
    development life cycle must take into account the high degree of overlap and iteration
    implicit. In a pure object-oriented approach to software development, the “waterfall”
    model is too restrictive an approach and may be replaced by the highly-iterative
    “fountain” model of Figure 1. This model incorporates reuse and domain analysis/design.


    ![](Images/image01398.gif)


    Figure 1. Fountain model for the object-oriented software life cycle.


    Merging and overlap of activities are represented by the degree of overlap of
    the circle symbols. The decreased need for maintenance in an object-oriented system
    is symbolized by the smaller activity circle.


    In a fountain, water rises up the middle and falls back, either to the ‘pool’
    below or is re-entrained at an intermediate level. Just so in an object-oriented
    software development where the general flow from analysis through design to implementation
    is overlain with iterative cycles across two (or all three) of these broad “phases”
    of analysis, design and implementation, the ‘pool’ representing the ‘software
    pool’ or ‘repository’ of classes.


    The picture, Figure 1, outlines the general characteristics of the systems level
    perception of an object-oriented development. There is a high degree of merging
    in the analysis, design, implementation and unit testing phases.

