  trans: "\n\n许多流操作符只是成员函数所执行任务的替代方式。一个很棒的好处是可以使用链式调用，将操作符与其他使用插入运算符的输出语句混合使用。\n\n\
    ```cpp\ncout << setw(10) << \"Hello\" << endl;\n```\n\n`setprecision()` 是一个带参数流操作符，它执行与成员函数\
    \ `precision()` 相同的任务。\n\n```cpp\ncout.precision(2);//将小数精度设置为 2 位有效数字\ncout <<\
    \ setprecision(2); // 效果相同！\n```\n\n`setw()` 是一个带参数流操作符，它执行与成员函数 `width()` 相同的任务。\n\
    \n```cpp\ncout.width(10);//为下一次输出设置字段宽度为 10\ncout << setw(10); // 效果相同！\n```\n\
    \n`setfill()` 是一个带参数流操作符，它执行与成员函数 `fill()` 相同的任务。\n\n```cpp\ncout.fill('*');//设置填充字符为\
    \ '*'\ncout << setfill('*');// 效果相同！\n```\n\n`setiosflags()` 是一个带参数流操作符，它执行与成员函数\
    \ `setf()` 相同的任务。\n\n```cpp\ncout.setf(ios::left);//设置左对齐标志\ncout << setiosflags(ios::left);\
    \ // 效果相同！\n```\n\n还有一些较新的流操作符，对应于某些格式化标志。例如：\n\n```cpp\ncout.setf(ios::left);//为\
    \ cout 设置左对齐\ncout << left; // 同样为 cout 设置左对齐\n```\n\n# 文件输入输出\n\n![](img/image01384.jpeg)\n\
    \n在 C++ 中进行文件处理，必须包含头文件 `<iostream.h>` 和 `<fstream.h>`。\n\n`<fstream>` 包含了 `<ifstream>`\
    \ 和 `<ofstream>`。\n\n## 文件打开模式\n\n其中 `filename` 是表示打开的文件名的字符串，`mode` 是一个可选参数，可以是以下标志的组合：\n\
    \n| `ios::in` | 用于输入操作打开。 |\n| :--- | :--- |\n| `ios::out` | 用于输出操作打开。 |\n| `ios::bin`\
    \ | 以二进制模式打开。 |\n| `ios::ate` | 将初始位置设置为文件末尾。如果未设置此标志，则初始位置为文件开头。 |\n| `ios::app`\
    \ | 所有输出操作都在文件末尾进行，将内容追加到文件的当前内容之后。 |\n| `ios::trunc` | 如果以输出操作打开且文件已存在，则其原有内容将被删除并由新内容替换。\
    \ |\n\n`ios::nocreate` - 如果文件不存在，则打开操作失败。\n`ios::noreplace` - 如果文件存在，则打开操作失败。\n\
    \n类 `ofstream`、`ifstream` 和 `fstream` 的每个打开打开成员函数都有默认模式，如果在未提供第二个参数的情况下打开文件，将使用该模式：\n\
    \n| 类 | 默认模式参数 |\n| :--- | :--- |\n| `ofstream` | `ios::out` |\n| `ifstream` |\
    \ `ios::in` |\n| `fstream` | `ios::in \\| ios::out` |\n\n## 文件关闭\n\n当我们完成对文件的输入和输出操作时，应当将其关闭，以便通知操作系统并使其资源重新可用。为此，我们调用流的成员函数\
    \ `close`。该成员函数会刷新关联缓冲区并关闭文件：\n\n![](img/image01385.jpeg)\n\n一旦调用了此成员函数，流对象就可以重用于打开另一个文件，该文件也可以再次被其他进程打开。\n\
    \n![](img/image01386.gif)\n\n## 示例\n\n可以使用构造函数或创建对象来打开文件。以下示例展示了：\n\n```cpp\n\
    #include <iostream.h>\n#include <fstream.h>\n\nint main() {\n    ofstream fout(\"\
    example.txt\");\n    fout << \"This is a line.\\n\";\n    fout << \"Another line.\\\
    n\";\n    fout.close();\n    return 0;\n}\n```\n\n输出：\n```\nThis is a line.\n\
    Another line.\n```\n\n## 文件位置\n\n`<istream>` 和 `<ostream>` 重新定位文件指针（读取或写入文件的字节数）的成员函数。这些成员函数是：\n\
    \n- 用于 `istream` 的 `seekg()` (seek get)\n- 用于 `ostream` 的 `seekp()` (seek put)\n\
    \n提供了 `tellg()` 和 `tellp()` 来分别返回 get 和 put 指针的当前位置。\n\n# 错误（异常）处理\n\n异常是指程序中意外的情况。这些意外情况可能是故障，导致错误，进而导致程序失败。C++\
    \ 的错误处理机制通常称为异常处理。\n\n## 异常的类型\n\n1. 同步异常\n2. 异步异常\n\n### 同步异常\n\n在程序执行期间，由于输入数据中的故障或不适合处理当前数据类型的技术而发生的异常被称为同步异常。\n\
    \n示例：`out of range`（越界）、`divide by zero`（除零）、`overflow`（溢出）、`underflow`（下溢）。\n\
    \n### 异步异常\n\n由程序控制之外事件引起的错误称为异步异常。\n\n示例：磁盘故障。\n\n## 异常处理机制\n\n异常处理机制的目的是提供检测和报告“异常情况”的方法，以便采取适当措施。异常处理机制包括以下任务操作：\n\
    \n1. 发现问题（命中异常）\n2. 通知已发生（抛出异常）\n3. 接收错误信息（捕获异常）\n4. 采取纠正措施（处理异常）\n\n以下示例展示了它是如何工作的：\n\
    \n```cpp\n#include <iostream.h>\n#include <fstream.h>\n\nint main() {\n    try\
    \ {\n        throw \"Error occurred\";\n    } catch (const char* msg) {\n    \
    \    cout << msg << endl;\n    }\n    return 0;\n}\n```\n\n"
- fmt: "\n* One to detect and to throw exceptions\n* Other to catch the exceptions\
    \ and to take appropriate actions.\n\n### Exception Handling Model\n\nThe exception\
    \ handling mechanism uses three blocks: `try`, `throw`, `catch`. The relationship\
    \ of those three exception handling models is shown below:\n\n* The keyword `try`\
    \ is used to preface a block of statements (surrounded by braces) which may generate\
    \ exceptions. This block of statements is known as a `try` block.\n* When an exception\
    \ is detected, it is thrown using a `throw` statement in the `try` block.\n* A\
    \ `catch` block defined by the keyword `catch` catches the exception thrown by\
    \ the `throw` statement in the `try` block, and handles it appropriately.\n* General\
    \ format:\n\n```cpp\ntry\n{\n    ... // block of statements which detects and\n\
    \    throw exception; // throws an exception\n    ...\n    ...\n}\ncatch (type\
    \ arg)\n{\n    ...\n    ...\n    ... // block of statements that handles the exception\n\
    }\n```\n\n* When the `try` block throws an exception, the the program control\
    \ leaves the `try` block and enters the `catch` statement of the `catch` block.\n\
    * Exceptions are objects or variables used to transmit information about a problem.\n\
    * If the `type` of object thrown matches the `arg` type in the `catch` statement,\
    \ then the `catch` block is executed for handling the exception.\n* If they do\
    \ not match, the program is aborted with the help of the `abort()` function which\
    \ is invoked automatically.\n* The `catch` block may have more than one `catch`\
    \ statement, each corresponding to a particular type of exception.\n* For example,\
    \ if the `throw` block is likely to throw two exceptions, the `catch` block will\
    \ have two `catch` statements, one for each type of exception. Each `catch` statement\
    \ is called an exception handler.\n* When no exception is detected and thrown,\
    \ the control goes to the statement immediately after the `catch` block. That\
    \ is, the `catch` block is skipped.\n\n**Example: divide by zero**\n\n```cpp\n\
    #include<iostream.h>\nvoid main()\n{\n    int x, y, z;\n    cout<<\"enter the\
    \ values of x, y, z\"; cin>>x>>y>>z;\n    try\n    {\n        if(x == y)\n   \
    \         throw y;\n        else\n        {\n            int d= z / (x - y);\n\
    \            cout<<\"the result of z/(x-y) is:\"<< d;\n        }\n    }\n    catch(int\
    \ y)\n    {\n        cout<<\"exception caught x-y is \"<<<< x-y;\n    }\n}\n```\n\
    \n**RUN 1:**\nenter the values of x, y, z 50 30 20\nthe result of z/(x-y) is:\
    \ 1\n\n**RUN 2:**\nEnter the values of x, y, z 30 30 20\nexception caught x-y\
    \ is : 0\n\n**Using function that generate exceptions:**\n\n```cpp\n#include<iostream.h>\n\
    void divide(int x, int y, int z)\n{\n    if(x == y)\n    {\n        cout<<\"we\
    \ are inside the function\";\n        throw (x-y);\n    }\n    else\n    {\n \
    \       int d= z / (x - y);\n        cout<<\"the result of z/(x-y) is:\"<< d;\n\
    \    }\n}\nvoid main()\n{\n    try\n    {\n        cout<<\" we are inside the\
    \ try block\";\n        divide(10, 20, 30); // invoke divide()\n        divide(10,\
    \ 10, 20); // invoke divide()\n    }\n    catch(int i) // catches the exception\n\
    \    {\n        cout<<\"exception caught x-y is : \"<<i;\n    }\n}\n```\n\n**RUN:**\n\
    we are inside the try block\nwe are inside the function\nthe result of z/(x-y)\
    \ is: -3\nwe are inside the function\nexception caught x-y is: 0\n\n### Multiple\
    \ catches with object\n\n* To throw an exception with an object it needs to define\
    \ an `abstract class`.\n* An `abstract class` is nothing but a class with empty\
    \ data members.\n* The class name is called as a nameless object which is used\
    \ to throw the exceptions.\n\n**Example:**\n\n```cpp\n#include<iostream.h>\nclass\
    \ positive { };\nclass negative { };\nclass zero { };\n\nvoid greater(int num)\n\
    {\n    if(num > 0)\n        throw positive();\n    else if (num < 0)\n       \
    \ throw negative();\n    else\n        throw zero();\n}\n\nvoid main()\n{\n  \
    \  int num;\n    cout<<\"enter any number \"; cin>>num;\n    try\n    {\n    \
    \    greater(num);\n    }\n    catch(positive)\n    {\n        cout<<\"positive\
    \ exception\";\n    }\n    catch(negative)\n    {\n        cout<<\"negative exception\"\
    ;\n    }\n    catch(zero)\n    {\n        cout<<\"zero exception\";\n    }\n}\n\
    ```\n\n### Templates\n\nA significant feature of OOP is reusability of code. Templates\
    \ support generic programming, allowing different data types.\n\n**Types of Templates**\n\
    There are two kinds of templates:\n* Function templates\n* Class templates\n\n\
    #### Function Templates\n\nA function template defines a group of functions. A\
    \ function template is not a function itself, but a blueprint that the compiler\
    \ uses to generate functions. A function template is instantiated at the point\
    \ of the call.\n\n**Syntax of function template**\n\n```cpp\ntemplate <template-parameter-list>\n\
    return_type function_name(parameter-list)\n{\n    ...\n}\n```\n\n**Example:**\n\
    \n```cpp\n#include<iostream.h>\n#include<conio.h>\ntemplate <class T>\nvoid swap(T\
    \ &x, T &y)\n{\n    T z; z=x; y=z;\n}\n\nvoid main()\n{\n    clrscr();\n    int\
    \ a,b;\n    cout<<\"\\nEnter 2 integers:\"; cin>>a>>b;\n    swap(a,b);\n    cout<<\"\
    \\nafter swapping the values are \"<<a<<\"\\t\"<<b;\n\n    float c,d;\n    cout<<\"\
    \\nEnter 2 float values:\"; cin>>c>>d;\n    swap(c,d);\n    cout<<\"\\nafter swapping\
    \ the values are \"<<c<<\"\\t\"<<d;\n    getch();\n}\n```\n\n#### Class Templates\n\
    \nThe relationship between a class template and an individual class is like the\
    \ relationship between a class and an individual object. An individual class defines\
    \ how objects can be constructed, while a class template defines how groups of\
    \ classes can be generated.\n\nNote the distinction between the terms class template\
    \ and template class:\n* Class template is a template used to generate classes.\
    \ You cannot declare an object of a class template.\n* Template class is an instance\
    \ of a class template.\n\n**Syntax of class template**\n\n```cpp\ntemplate <template-parameter-list>\n\
    class class_name\n{\n    ...\n};\n```\n\n**Example:**\n\n```cpp\n#include<iostream.h>\n\
    #include<conio.h>\ntemplate <class T>\nclass pair{\n    T a,b;\npublic:\n    pair(T,\
    \ T);\n    T getmax();\n};\n\ntemplate <class T> pair<T>:: pair(T x, T y)\n{\n\
    \    a=x; b=y;\n}\n\ntemplate <class T> T pair<T>::getmax()\n{\n    T z; z=(a>b)?a:b;\
    \ return z;\n}\n\nvoid main()\n{\n    clrscr();\n    int p,q;\n    cout<<\"\\\
    nEnter 2 integers:\"; cin>>p>>q;\n    pair<int> ob1(p,q);\n    cout<<\"\\nThe\
    \ biggest number is \"<<ob1.getmax();\n\n    float r,s;\n    cout<<\"\\nEnter\
    \ 2 float values:\"; cin>>r>>s;\n    pair<float> ob2(r,s);\n    cout<<\"\\nThe\
    \ biggest number is \"<<ob2.getmax();\n    getch();\n}\n```\n"
