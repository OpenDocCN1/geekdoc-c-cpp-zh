  trans: "\n\n## 定义\n使用 `friend` 关键字声明的函数称为友函数（friend function），即对两个类都具有“友元”关系的普通函数，从而允许该函数访问这些类的私有数据。\n\
    \n## 友函数的特殊性质\n- `friend 函数`的的作用域不受限制\n- `friend 函数`不能通过该类的对象来调用\n- `friend 函数`可以访问私有（private）和公共（public）数据成员\n\
    - `friend 函数`可以在私有区域或公共区域声明，而不会影响其含义。\n\n要使一个外部函数成为某个类的友，我们只需要像下面所示将该函数声明为该类的友即可：\n\
    \n```cpp\nclass ABC\n{\n……..\n……… public:\n……\n…….\nfriend void display( ); //\
    \ 声明;\n};\n```\n\n### 示例\n```cpp\n#include <iostream.h> \nclass sample\n{\n  \
    \  int x,y; \npublic:\n    void getvalue()\n    {\n        x=50; y=40;\n    }\n\
    \    friend void display( sample a);\n};\n\nvoid display( sample a)\n{\n    cout<<a.\
    \ x<< b. y;\n}\n\nvoid main( )\n{\n    ABC obj1;\n    obj1\\. getvalue( ); display(\
    \ obj1);\n}\n```\n程序的输出将为：50 40\n\n- 函数通过使用点运算符和传递给它的对象来访问类变量 `x` 和 `y`。\n- 函数调用\
    \ `display(obj1)` 将对象 `obj1` 按值传递给友函数。\n\n## 带有友函数的类\n考虑操作两个不同类对象的情况，在这种情况下，可以使用友函数来桥接这两个类。\n\
    \n### 示例\n```cpp\n#include<iostream.h>\nclass result; // 提前声明类 test\n{\n    int\
    \ n1,n2; \npublic:\n    void getmark( )\n    { \n        n1=45; n2=78;\n    }\n\
    \    friend void display(  test,  result);// 友函数声明\n};\n\nclass result\n{\n  \
    \  int tot; \npublic:\n    friend  void  display(test,result);// 友函数声明\n};\n\n\
    void display( test t, result r)\n{\n    ot=  t.n1+t.n2;// 使用 t 对象访问 test 类的私有成员\
    \ cout<<r.  tot;\n}\n\nvoid main(  )\n{\n    test t; result r;\n    t.getmark(\
    \  );\n    display( t,  r);\n}\n```\n\n### 解释\n- 程序包含两个类：`test` 和 `result`。\n\
    - `display` 函数是友函数，用于访问两个类的私有数据成员。\n- 友函数的声明可以放在类的私有区域，也可以放在公共区域。\n- 每个类的对象都已作为参数传递给函数\
    \ `display()`。\n- 它可以通过这些参数访问两个类的私有成员。\n- 在程序开头对类 `result;` 的提前声明是必要的，因为一个类在类\
    \ `test` 声明之前是无法被引用的。\n\n## 友函数的用途\n1. 对两个不同类的对象进行操作。\n2. 友函数可以用来增加重载运算符的通用性。\n\
    \n## 友元类\n### 定义\n另一个类中所有操作或使用友元类私有成员的函数。\n\n### 示例\n```cpp\n#include<iostream.h>\
    \ \nclass two;\n\nclass one\n{\nprivate:\n    int x, y;\npublic:\n    void setdata(int\
    \ a, int b)\n    {\n        x=a; y=b;\n    }\n    friend class two;\n};\n\nclass\
    \ two\n{\n    int z; \npublic:\n    void addone(one obj)\n    {\n        z= obj.\
    \ x + obj . y;\n    }\n    void display(one obj )\n    {\n        cout<<”X is:\
    \ “<<obj.x<<”Y  is:”<<obj.y;\n        cout<< “sum of one class data members”<<\
    \ z;\n    }\n};\n\nvoid main( )\n{\n    one obj1; two obj2;\n    obj1\\. setdata(\
    \ 45,65); obj2. addone(obj1); obj2\\. display( obj1);\n}\n```\n**运行**\n```\nX\
    \ is:  45\nY is:  65\nsum of one class data members: 110\n```\n\n### 解释\n- 类 `two`\
    \ 是类 `one` 的友元，因此在类 `two` 的成员函数中可以使用类 `one` 对象访问类 `one` 的所有私有成员。\n- 这里 `addone()`\
    \ 和 `display()` 函数使用了类 `one` 的私有数据成员。因此这两个函数都以类 `one` 对象作为参数。\n\n## 函数重载\n- 可以定义多个同名但执行不同操作的函数。\n\
    - 它有助于减少对不寻函数名的需求，使代码更易读。\n- 这可以通过函数多态或函数重载的概念来实现。\n- 函数重载允许多个函数具有不同的参数类型共享相同的名称。\n\
    - 函数多态意味着函数定义可以有多种形式。定义必须仅在参数的数量和类型上不同。\n\n### 示例：多个交换函数\n```cpp\n#include<iostream.h>\n\
    void swap(char x, char y)\n{\n    // 逻辑省略\n}\nvoid swap(int x, int y)\n{\n   \
