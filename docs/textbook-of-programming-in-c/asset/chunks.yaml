    \ to process their data, for example search for an element in an array, or sort\
    \ an array.\n\nIterators are a generalization of the concept of pointers, they\
    \ point to elements in a container, for example you can increment an iterator\
    \ to point to the next element in an array.\n\n- Iterators are pointer-like entities\
    \ that are used to access individual elements in a container.\n- Often they are\
    \ used to move sequentially from element to element, a process called iterating\
    \ through a container.\n- The member functions `begin()` and `end()` return an\
    \ iterator to the first and past the last element of a container.\n\n### Container\n\
    \nA container is a way to store data, either built-in data types like `int` and\
