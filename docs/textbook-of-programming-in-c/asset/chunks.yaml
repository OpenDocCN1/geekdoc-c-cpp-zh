  trans: "\n\n*   它们可能代表一个人、一个地方、一个银行账户、一个数据表或计算机必须处理的任何项目。\n*   某些对象可能对应现实世界的实体，例如学生、员工、银行账户等。\n\
    *   每个对象将有一个名为 `attributes`（`data`）的状态以及一个名为 `operations`（`function`）的行为。\n\n\
    当程序执行时，对象之间通过向彼此发送消息来相互交互。例如，如果 `customer` 和 `account` 是程序中的两个对象，那么 `customer`\
    \ 对象可能会向 `account` 对象发送消息。每个对象都包含用于操作数据的数据和代码。对象之间可以交互而无需了解对方数据或代码的细节。只需要知道对象接受的类型类型以及对象返回的响应类型即可。\n\
    \n![](img/image01316.jpeg)![](img/image01317.jpeg)\n\n**图 2 表示对象的两种方式**\n\n台台灯可能只有两种可能的状态（`on`\
    \ 和 `off`）和两种可能的行为（`turn on`、`turn off`），但你的台式收音机可能有额外的状态（`on`、`off`、`current\
    \ volume`、`current station`）和行为（`turn on`、`turn off`、`increase volume`、`decrease\
    \ volume`、`seek`、`scan` 和 `tune`）。\n\n### ![](img/image01318.jpeg) 示例：\n\n| 账户\
    \ |\n| 账号 账户类型 名称 余额 |\n| `Deposit()` `Withdraw()` `Enquire()` |\n\n*   每个对象都拥有其自己的身份，尽管它们的\
    \ `attributes` 和操作是相同的，但对象之间永远不会相等。\n*   例如，在人对象的情况下，两个人将具有相同的属性，如 `name`、`age`、`sex`；但它们是不相等的。\n\
    \n###  类\n\n*   我们知道对象包含数据以及操作这些数据的函数或代码。通过 `class` 的帮助，对象的整个数据和代码集合可以作为一个用户定义的数据类型。\n\
    *   对象是 `class` 类型的变量。\n*   类是用户定义的数据类型，行为类似于编程语言的内置类型。\n*   一旦定义了 `class`，我们就可以创建许多与该\
    \ `class` 关联的对象。\n*   因此，`class` 是相似类型对象的集合，即具有相同状态（`attributes`）和行为（`operations`）的对象被分组到一个\
    \ `class` 中。\n*   例如，`mango`、`apple` 和 `orange` 是类 `fruit` 的成员。\n*   创建对象的语法与在\
    \ `C` 中创建整数对象的语法没有区别。\n*   如果 `fruit` 已经定义为 `class`，那么语句\n\n### 示例：\n\n```\nfruit\
    \ mango;\n```\n\n将创建一个属于类 `fruit` 的对象 `mango`。\n\n### 示例例：\n\n1. 类：`person` 对象：`girl`、`boy`\
    \ 属性：`Name`、`Age` 操作：`speak()`、`listen()`、`walk()`\n2. 类：`vehicle` 对象：`car`、`bus`\
    \ 属性：`Name`、`model`、`color` 操作：`start()`、`stop()`、`accelerate()`\n\n### 在 C++\
    \ 中，类可以表示为：\n\n```cpp\nClass account\n{\nPrivate:\n  char name[20]; int act_type;\
    \ float balance;\nPublic:\n};\ndeposit( ); withdraw( );\n```\n\n*   它类似于 `C` 中的结构体声明。\n\
    *   它允许创建被称为 `objects` 的类变量。\n\n### 示例：\n\n```cpp\n#include <iostream>\n#include\
    \ <conio.h>\nusing namespace std;\n\nclass account {\nprivate:\n  int a;\npublic:\n\
    \  void getdata() {\n    cout << \"enter number to check: \";\n    cin >> a;\n\
    \  }\n  void check() {\n    if(a % 2 == 0)\n      cout << \"given number is even\"\
    ;\n    else\n      cout << \"given number is odd\";\n  }\n};\n\nvoid main() {\n\
    \  getscr();\n  account e;\n  e.getdata();\n  e.check();\n}\n```\n\n**输出：**\n\
    Enter number to check: 9\ngiven number is odd\n\n2.\n\n```cpp\n#include <iostream>\n\
    #include <conio.h>\nusing namespace std;\n\nclass velocity {\nprivate:\n  int\
    \ v, a, t;\npublic:\n  void getdata() {\n    cout << \"Enter values for velocity,\
    \ acceleration,\nand time: \";\n    cin >> v >> a >> t;\n  }\n  void calculate()\
    \ {\n    v = v + (a * t);\n    cout << \"FINAL VELOCITY= \" << v;\n  }\n};\n\n\
    void main() {\n  getscr();\n  velocity ob;\n  ob.getdata();\n  ob.calculate();\n\
    }\n```\n\n**输出：**\nEnter values for velocity, acceleration,and time: 10 5 2\n\
    FINAL VELOCITY= 20\n\n###  封装\n\n*   封装是 OOP 最显著的特征。将数据和函数封装成一个单元被称为封装。\n*  \
    \ 数据对外部不可见；只有这些函数可以访问它。\n*   这也被称为“数据隐藏”或“信息隐藏”。\n\n###  抽象\n\n*   抽象指的是在不包含细节的情况下表示基本特征的行为。为了更清楚地理解这个概念，以“开关”为例。你只知道特定的开关，因为内部发生的情况是被隐藏的。\n\
    *   类使用了抽象的概念。它们也被称为抽象数据类型 (ADT)。\n\n###  继承\n\n*   继承是一个类的对象获取另一个类属性的过程。\n*\
    \   它提供了重用性，即我们可以向现有类添加额外的功能。\n*   这可以通过从现有类派生出一个新类来实现。\n*   现有的类被称为基类，新类被称为派生类（子类）、父类（超类）。\n\
    \n###  多态\n\n*   多态是 OOP 力量的关键。\n*   它是一个希腊语词，意味着采取多种形式（许多形式）的能力。\n*   它是支持数据以多种形式进行处理的能力的概念，即它允许一个名称被用于多个相关的用途，而这些用途在技术上是不同的。\n\
    *   例如，一个操作在不同的实例中可能会表现出不同的行为。\n\n以下是在 C++ 程序中实现多态的不同方法：\n\n*   函数重载\n*   运算符重载\n\
    *   动态绑定\n\n"
- fmt: "\n## Dynamic binding\n\n- Binding refers to the linking of a procedure call\
    \ to the code to be executed in response to the call.\n- Dynamic binding (also\
    \ known as late binding) means that the code associated with a given procedure\
    \ is not known until the time of the call at run-time.\n- It is associated with\
    \ polymorphism and inheritance.\n\n### Example\n\n- Consider the procedure `draw`\
    \ in the above fig. By inheritance every object will have this procedure.\n- Its\
    \ algorithm is however, unique to each object and so the `draw` procedure will\
    \ be redefined in each class that defines the object.\n- At run-time, the code\
    \ matching the object under current reference will be called.\n\n## Message passing\n\
    \n- An OO program consists of a set of objects that communicate with each other.\n\
    - The process of programming in an OO language, therefore involves the following\
    \ steps:\n    - Creating classes that define objects and their behavior.\n   \
    \ - Creating objects from class definitions and.\n    - Establishing communication\
    \ among objects.\n- A message for an object is a request for execution of a procedure\
    \ and therefore will invoke a function (procedure) in the receiving object that\
    \ generates the desired result.\n- Objects communicate with one another by sending\
    \ and receiving information much the same way as people pass messages to one another.\n\
    - Message passing involves specifying the name of the objects, the name of the\
    \ function (message) and the information to be sent.\n\n### Example\n\n`employee.salary(name);`\n\
    \n![](Images/image01326.jpeg)\n![](Images/image01327.jpeg)\n\nInformation\n\n\
    Objects have a life cycle. They can be created and destroyed.\nCommunication with\
    \ the object is feasible as long as it is alive.\n\n## Benefits or Advantages\
    \ of OOP’s\n\n- The complexity of software can be managed easily.\n- Data hiding\
    \ concept help the programmer to build secure programs.\n- Through the class concept\
    \ we can define the user defined data type.\n- The inheritance concept can be\
    \ used to eliminate redundant code.\n- The message-passing concept helps the programmer\
    \ to communicate between different objects.\n- New data and functions can be easily\
    \ added whenever necessary.\n- OOP’s ties data elements more closely to the functions\
    \ that operates on.\n\n## Application of OOP\n\n- Real-time system\n- Simulation\
    \ and modelling\n- Object-oriented database\n- Hypertext, hypermedia and expertext\n\
    - Artificial intelligence and expert system\n- Neural network and parallel programming\n\
    - Decision support and office automation systems\n- CIM/CAM/CAD system\n\n## COMPARISON\
    \ of C with C++\n\n### C Language\n\n- Top Down approach\n- Procedure oriented\n\
    - Variables cannot be dynamically generalised\n- Reference variables cocept is\
    \ not there\n- Memory management\n- Allocation: `malloc()`, `calloc()`\n- Deallocation:\
    \ `free()`\n    - Type casting:\n      Syntax: `(typename) expression`\n- Object\
    \ Oriented concepts like Inheritanc, polymorphism, dynamic binding, encapsulation\
    \ etc are not supported.\n- There is no inline function or friend function.\n\
    - Input and output:\n    - `Scanf()` and `printf()` library functions are used\
    \ for reading input and writing output respectively.\n- There is no scope resolution\
    \ operator to access the global variables in the interior blocks of the functions.\n\
    - Constructors and destructors are not used.\n- Object oriented concepts like\
    \ inheritance, polymorphism, encapsulation, dynamic binding etc are not suppoted.\n\
    \n### C++ Language\n\n- Bottom up approach\n- Object oriented\n- Allows dynamic\
    \ initialisation of variables Eg: `cin>>str;`\n```\nint len=strlen(str);\n```\n\
    - Uses reference variables Eg: `float tot=100`\n```\nfloat & sum=tot;\n// Here\
    \ the reference variable sum references the variable tot\n```\n- Memory management\n\
    - Allocation: `new` operator is used.\n- Deallocation: `delete` operator is used.\n\
    \    - Type casting:\n      Syntax: `typename (expression)`\n- Inline functions\
    \ : an inline function is a function upon which the [compiler](http://en.wikipedia.org/wiki/Compiler)\
    \ has been requested to perform [inline expansion](http://en.wikipedia.org/wiki/Inline_expansion)\n\
    - Eg:\n```cpp\n#include<iostream.h> class class inl\n{\npublic:\n![](Images/image01328.jpeg)\n\
    inline int cube(int a) return a*a*a;\n};\n\nInt main()\n{\ninl o;\nint c=o.cube(3);\
    \ return 0;\n}\n```\n- Input and output:\n    - `>>` Extraction operator for reading\
    \ input\n    - `<<` Insertopm operator for printing the output\n        - Eg:\n\
    ```cpp\ncin>> a;\ncout<<a;\n```\n- Scope resolution operator:\n  The scope resolution\
    \ operator helps to identify and specify the context to which an identifier refers.\
    \ Syntax: `::member_name`\n- Friend functions and virtual functions are used.\n\
    - Constructors and destructors are not used.\n- Object oriented concepts like\
    \ inheritance, polymorphism, encapsulation, dynamic binding etc are suppoted.\n\
    \n## Overview of C++ Programming\n\nC++ was developed by BJARNE STROUSSTRUP at\
    \ AT&T BELL Laboratories in Murry Hill, USA in early 1980’s.\nStriysstryo combines\
    \ the features of ‘C’ language and ‘SIMULA67’ to create more powerful language\
    \ that support OOPS concepts, and that language was named as “C with CLASSES”.\
    \ In late 1983, the name got changed to C++.\nThe idea of C++ comes from ‘C’ language\
    \ increment operator (`++`) means more additions.\nC++ is the superset of ‘C’\
    \ language, most of the ‘C’ language features can also applied to C++, but the\
    \ object oriented features (Classes, Inheritance, Polymorphism, Overloading) makes\
    \ the C++ truly as Object Oriented Programming language.\n\n![](Images/image01329.jpeg)![](Images/image01330.jpeg)\n\
    \nStructure of C++ Program\n\n| Include files |\n| :--- |\n| Class Definition\
    \ |\n| Member function Definitions |\n| Main function Program |\n\nInclude files\
    \ provides instructions to the compiler to link functions from the system library.\n\
    Eg:\n```cpp\n#include <iostream.h>\n#include–Preprocessor Directive iostream.h–Header\
    \ File\n```\n- A class is a way to bind and its associated functions together.\
    \ It is a user defined datatype. It must be declared at class declaration part.\n\
    - Member function definition describes how the class functions are implemented.\
    \ This must be the next part of the C++ program.\n- Finally main program part,\
    \ which begins program execution.\n```cpp\nmain( )\n{\n}\n```\nProgram execution\
    \ begins at the opening brace and ends at the closing brace.\nThe closing brace\
    \ of the main function is the logical and of the program.\n\n## Input / Output\
    \ statements\n\n Input Stream\n\nSyntax:\n```cpp\ncin >> var1 >> var2 >>;\n```\n\
    - `cin` – Keyword, it is an object, predefined in C++ to correspond to the standard\
    \ input stream.\n- `>>` - is the extraction or get from operator\nExtraction operation\
    \ (`>>`) takes the value from the stream object on its left and places it in the\
    \ variable on its right.\nEg:\n```cpp\ncin>>x; cin>>a>>b>>c;\n```\n\nOutput Stream:\
    \ Syntax:\n```cpp\ncout<<var1<<var2;\n```\n- `cout` - object of standard output\
    \ stream\n- `<<` - is called the insertion or put to operator\nIt directs the\
    \ contents of the variable on its right to the object on its left.\nOutput stream\
    \ can be used to display messages on output screen.\nEg:\n```cpp\ncout<<a<<b;\
    \ cout<<”value of x is”<<x;\ncout<<”Value of x is”<<x<<”less than”<<y;\n```\n\n\
    ## Tokens\n\nThe smallest individual units in a program are known as tokens.\n\
    C++ has the following tokens:\n- Keywords\n- Identifiers\n- Constants\n- Strings\n\
    - Operators\n\n- In C++ program’s written using these tokens, white spaces and\
    \ the syntax of the language.\n- Most of the C++ tokens are basically similar\
    \ to the C tokens with the exception of some additions and minor modifications.\n\
    \n### Keywords\n\n![](Images/image01311.jpeg)\n- The keywords implementt specific\
    \ C++ language features.\n- Keywords has a predefined meaning and cannot be changed\
    \ by the user\n- Keywords cannot be used as names for the program variables.\n"
  raw: "###  Dynamic  binding\n\n*   Binding refers to the linking of a procedure\
    \ call to the code to be executed in response to the  call.\n\n*   Dynamic binding\
    \ (also known as late binding) means that the code associated with a given procedure\
    \ is not known until the time of the call at  run-time.\n\n*   It is associated\
    \ with polymorphism and inheritance.\n\n### Example:\n\n*   Consider the procedure\
    \ “draw” in the above fig. By inheritance every object will have this procedure.\n\
    \n*   Its algorithm is however, unique to each object and so the draw procedure\
    \ will be redefined in each class that defines the  object.\n\n*   At run-time,\
    \ the code matching the object under current reference will be called.\n\n###\
    \  Message passing\n\n*   An OO program consists of a set of objects that communicate\
    \ with each other.\n\n*   The process of programming in an OO language, therefore\
    \ involves the following  steps:\n\n    *   Creating classes that define objects\
    \ and their  behavior.\n\n    *   Creating objects from class definitions  and\n\
    \n    *   Establishing communication among  objects.\n\n*   A message for an object\
    \ is a request for execution of a procedure and therefore will invoke a function\
    \ (procedure) in the receiving object that generates the desired  result.\n\n\
    *   Objects communicate with one another by sending and receiving information\
    \ much the same way as people pass messages to one another.\n\n*   Message passing\
    \ involves specifying the name of the objects, the name of the function (message)\
    \ and the information to be  sent.\n\n### Example:\n\nObject\n\nemployee . salary\
    \ (name);\n\n![](Images/image01326.jpeg)\n\n![](Images/image01327.jpeg)Information\n\
    \nObjects have a life cycle. They can be created and destroyed.\n\nCommunication\
