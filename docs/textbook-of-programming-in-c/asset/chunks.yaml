    \  overloading\n\n*   Dynamic binding\n\n![](Images/image01322.jpeg)\n\n![](Images/image01323.jpeg)![](Images/image01324.jpeg)![](Images/image01325.jpeg)Fig.\
    \ Polymorphism\n\nFig. illustrates that a single function name can be used to\
