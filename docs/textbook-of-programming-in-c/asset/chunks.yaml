    \ >> key;\n\niter=find(v.begin(),v.end(),key); // finds integer key in v\nif (iter\
    \ != v.end()) // found the element\n    cout << \"Element \" << key << \" found\"\
    \ << endl;\nelse\n    cout << \"Element \" << key << \" not in vector v\" << endl;\n\
    ```\n\nthis Algorithm `find()` is for finding whether a number is present or not\
