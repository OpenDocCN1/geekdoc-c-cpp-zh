  trans: "\n\n```cpp\nClass derived:public base\n{\nPublic:\n    Void print()\n  \
    \  {\n        Cout<<”Print from derived”;\n    }\n};\n\nVoid main()\n{\n    Derived\
    \ d;\n    d.print(); //invokes print() from derived d\n}\n```\n**输出：**\nPrint\
    \ from derived Print from derived\n\n# 在继承中使用构造函数和析构函数\n\n## 派生类中的构造函数\n\n*  \
    \ 构造函数可以用于初始化对象的数据成员并分配内存等所需的资源。\n*   在单继承的情况下，当派生类和基类都包含构造函数时，首先执行基类构造函数，然后执行派生类的构造函数。\n\
    *   在多继承的情况下，基类构造函数按照它们在派生类声明中出现的顺序执行。\n*   在多级继承的情况下，构造函数将按照继承的顺序执行。\n*   虚基类的构造函数会在任何非虚基类之前被调用。\n\
    *   如果有多个虚基类，它们按照声明的顺序被调用。\n\n| 继承方式 | 执行顺序 |\n| :--- | :--- |\n| Class A : public\
    \ B | A(); 基类构造函数 |\n| { | B(); 派生类构造函数 |\n| }; | |\n| Class A : public B,public\
    \ C | B(); 基类(第一个) |\n| { | C(); 基类(第二个) |\n| }; | A();派生类 |\n| Class A : public\
    \ B,virtual public C | C(); 虚基类 |\n| { | B(); 普通基类 |\n| }; | A();派生类 |\n\n**表\
    \ 1. 基类构造函数的执行顺序**\n![](img/image01366.jpeg)\n\n## 派生类中的空构造函数\n\n### 单继承情况 1：基类和派生类中都没有构造函数\n\
    \n*   当基类或派生类都没有构造函数时，编译器会自动创建类对象而不会产生任何错误。\n\n**示例程序：**\n```cpp\nClass A\n{\n\
    public: void dis( )\n{\n    cout<<”Hai Friends”;\n}\n};\n\nClass B: public A\n\
    {\npublic:\n    void display( )\n    {\n        cout<<”Have a nice day”;\n   \
    \ }\n};\n\nvoid main( )\n{\n}\n```\n\n**情况 2：仅基类中有一个构造函数**\n```cpp\nB s;/*派生类的对象*/\
    \ s.dis( );\ns. display( );\n```\n```cpp\n#include <iostream.h> class A\n{\npublic:\n\
    \    A (  )/*基类中的空构造函数*/\n    {\n        cout<<” Have a nice day”;\n    }\n};\n\
    \nclass B: public A\n{\npublic:\n};\n\nvoid main( )\n{\n    B s;/*派生类的对象*/\n}\n\
    ```\n*   如果创建了派生类对象，它将首先检查基类并执行相应的默认构造函数。\n\n### 情况 3：仅派生类中有构造函数\n```cpp\n#include\
    \ <iostream.h> Class A\n{\npublic:\n};\n\nClass B: public A\n{\npublic:\n    A\
    \ (  )/*派生类中的空构造函数*/\n    {\n        cout<<”Have a nice day”;\n    }\n};\n\nvoid\
    \ main( )\n{\n    B  s;/*派生类的对象*/\n}\n```\n*   当创建派生类对象时，它会首先检查基类；如果基类中没有构造函数，它将跳过基类并运行派生类的构造函数。\n\
    \n### 情况 4：基类和派生类中都有构造函数\n```cpp\n#include <iostream.h> class A\n{\npublic:\n\
    \    A (  )/*基类中的空构造函数*/\n    {\n        cout<<”Have a nice day”;\n    }\n};\n\
    \nclass B: public A\n{\npublic:\n    B (  )/*派生类中的空构造函数*/\n    {\n        cout<<”Welcome”;\n\
    \    }\n};\n\nvoid main( )\n{\n    B  s;/*派生类的对象*/\n}\n```\n*   当创建派生类对象时，它将检查基类并执行相应的构造函数，然后执行相应的派生类构造函数。\n\
    \n## 多继承\n\n### 多继承类中的构造函数\n```cpp\n#include <iostream.h>\n\nclass  A/*基类 1*/\n\
    {\npublic:\n    A  ()/*基类 1 中的空构造函数*/\n    {\n        cout<<”Have a nice day”;\n\
    \    }\n};\n\nclass  B/*基类 2*/\n{\npublic:\n    B( )/*派生基类基类 2 中的空构造函数*/\n   \
    \ {\n        cout<<”Welcome”;\n    }\n};\n\nclass C: public A,  public B/*派生类*/\n\
    {\npublic:\n    C  ( )/*派生类中的空构造函数*/\n    {\n        cout<<”Good Morning”;\n \
    \   }\n};\n\nvoid main( )\n{\n    C  s;/*派生类的对象*/\n}\n```\n**输出：**\nHave a nice\
    \ day Welcome\nGood Morning\n\n*   构造函数的执行取决于继承这些类以创建新类的顺序，例如 `public A`、`public\
    \ B`，它将首先执行相应的类 `A` 构造函数，然后是类 `B` 构造函数，最后是派生类构造函数。\n\n## 多级继承\n\n### 多级继承中的构造函数\n\
    ```cpp\n#include <iostream.h>\n\nclass A\n{\npublic:\n    A (  )/*基类中的空构造函数*/\n\
    \    {\n        cout<<”Have a nice day”;\n    }\n};\n\nclass B: public A\n{\n\
    public:\n    B( )/*第一级派生类中的空构造函数*/\n    {\n        cout<<”Welcome”;\n    }\n};\n\
    \nclass C:  public  B/*第二级派生类中的空构造函数*/\n{\n};\n\nvoid main( )\n{\n    C c; \n\
    }\n```\n**输出：**\nHave a nice day\nWelcome\nGood Morning\n```\n\n"
- fmt: "\nC/C++ IO are based on streams, which are sequence of bytes flowing in and\
    \ out of the programs (just like water and oil flowing through a pipe). In input\
    \ operations, data bytes flow from an input source (such as keyboard, file, network\
    \ or another program) into the program. In output operations, data bytes flow\
    \ from the program to an output sink (such as console, file, network or another\
    \ program). Streams acts as an intermediaries between the programs and the actual\
    \ IO devices, in such the way that frees the programmers from handling the actual\
    \ devices, so as to archive device independent IO operations.\n\n![](Images/image01382.jpeg)\n\
    \nC++ provides both the formatted and unformatted IO functions. In formatted or\
    \ high-level IO, bytes are grouped and converted to types such as int, double,\
    \ string or user-defined types. In unformatted or low-level IO, bytes are treated\
    \ as raw bytes and unconverted. Formatted IO operations are supported via overloading\
    \ the stream insertion (`<<`) and stream extraction (`>>`) operators, which presents\
    \ a consistent public IO interface.\n\nTo perform input and output, a C++ program:\n\
    \n1. Construct a stream object.\n2. Connect (Associate) the stream object to an\
    \ actual IO device (e.g., keyboard, console, file, network, another program).\n\
    3. Perform input/output operations on the stream, via the functions defined in\
    \ the stream's pubic interface in a device independent manner. Some functions\
    \ convert the data between the external format and internal format (formatted\
    \ IO); while other does not (unformatted or binary IO).\n4. Disconnect (Dissociate)\
    \ the stream to the actual IO device (e.g., close the file).\n5. Free the stream\
    \ object.\n\n## iostream library contains\n\n- `<iostream.h>`: Contains `cin`,\
    \ `cout`, `cerr`, and `clog` objects\n- `<iomanip.h>`: Contains parameterized\
    \ stream manipulators\n- `<fstream.h>`: Contains information important to user-controlled\
    \ file processing operations\n\n## ios base class\n\n`istream` and `ostream` inherit\
    \ from `ios`. `iostream` inherits from `istream` and `ostream`.\n\n- `<<` (left-shift\
    \ operator)\n    - Overloaded as stream insertion operator\n- `>>` (right-shift\
    \ operator)\n    - Overloaded as stream extraction operator\n    - Both operators\
    \ used with `cin`, `cout`, `cerr`, `clog`, and with user-defined stream objects\n\
    \n### istream: input streams\n\n```cpp\ncin >> someVariable;\n```\n- `cin` knows\
    \ what type of data is to be assigned to `someVariable` (based on the type of\
    \ `someVariable`).\n\n### ostream: output streams\n\n```cpp\ncout << someVariable;\n\
    ```\n- `cout` knows the type of data to output.\n```cpp\ncerr << someString;\n\
    ```\n- Unbuffered - prints `someString` immediately.\n```cpp\nclog << someString;\n\
    ```\n- Buffered - prints `someString` as soon as output buffer is full or flushed.\n\
    \n### ostream: performs formatted and unformatted output\n\n- Uses `put()` for\
    \ characters and `write()` for unformatted characters.\n- Output of numbers in\
    \ decimal, octal and hexadecimal.\n- Varying precision for floating points.\n\
    - Formatted text outputs\n\n![](Images/image01383.jpeg)\n\n`cin.get()`: inputs\
    \ a character from stream (even white spaces) and returns it.\n`cin.get(c)`: inputs\
    \ a character from stream and stores it in `c`.\n\n## Unformatted Input/Output\
    \ Functions\n\n### put()`, `get()` and `getline()`\n\nThe `ostream`'s member function\
    \ `put()` can be used to put out a `char`. `put()` returns the invoking `ostream`\
    \ reference, and thus, can be cascaded. For example:\n\n```cpp\n// ostream class\n\
    ostream & put (char c); // put char c to ostream\n\n// Examples\ncout.put('A');\n\
    cout.put('A').put('p').put('p').put('\\n');\ncout.put(65);\n```\n\n```cpp\n//\
    \ istream class\n// Single character input\nint get (); // Get a char, store in\
    \ c and return the invoking istream reference\n\n// C-string input\nistream &\
    \ get (char and); // Get a char and return as int. It returns EOF at end-of-file\n\
    istream & get (char & c);\nistream & get (char * cstr, streamsize n, char delim\
    \ = '\\n'); // Get n-1 chars or until delimiter and store in C-string array cstr.\
    \ Append null char to terminate C-string. Keep the delim char in the input stream.\n\
    \nistream & getline (char * cstr, streamsize n, char delim = '\\n'); // Same as\
    \ get(), but extract and discard delim char from the input stream.\n```\n\nExample:\n\
    ```cpp\nint inChar;\nwhile ((inChar = cin.get()) != EOF) { // Read till End-of-file\n\
    \    cout.put(inchar);\n}\n```\n\n### read()`, `write()` and `gcount()`\n\n```cpp\n\
    // istream class\nistream & read (char * buf, streamsize n); // Read n characters\
    \ from istream and keep in char array buf. Unlike get()/getline(), it does not\
    \ append null char at the end of input. It is used for binary input, instead of\
    \ C-string.\nstreamsize gcount() const; // Return the number of character extracted\
    \ by the last unformatted input operation: get(), getline(), ignore() or read().\n\
    \n// ostream class\nostream & write (const char * buf, streamsize n) // Write\
    \ n character from char array.\n```\n\n## Formatted console IO functions\n\nC++\
    \ provides various formatted console I/O functions for formatting the output.\
    \ They are of three types:\n\n1. `ios` class function and flags\n2. Manipulators\n\
    3. User-defined output functions\n\n### Member functions and flags\n\nOutput streams\
    \ (class `ostream` and related classes) have some useful member functions for\
    \ controlling output formatting. Note that these can be used not only with `cout`,\
    \ but with other types of output streams. (We'll learn about file output streams\
    \ soon).\n\n`setf()` – the \"set flags\" function. Takes as parameter the flag\
    \ to be turned on. Some of the flags that can be turned on are:\n\n- `ios::fixed`\
    \ – specifies that floating-point numbers will be printed in fixed notation.\n\
    - `ios::scientific` – specifies that floating-point numbers will be printed in\
    \ scientific (exponential) notation.\n- `ios::showpoint` – specifies that the\
    \ decimal point will always be printed even for a whole number.\n- `ios::right`\
    \ – right-justifies an output item in a field if a width is specified.\n- `ios::left`\
    \ – left-justifies an output item in a field if a width is specified.\n- `unsetf()`\
    \ – Call this to turn off one of the flags.\n- `precision()` – sets the precision\
    \ for floating-point values to a specific number of digits after the decimal point.\
    \ Takes that number as a parameter.\n- `width()` – used to specify the \"field\
    \ width\" for the next item that is output. Number of character positions is specified\
    \ as a parameter. Left and right justify flags apply when this function is used.\n\
    - `fill()` – used to specify the fill character to be used to pad out extra space\
    \ in a field (using `width()`). Takes the character as a parameter.\n\n```cpp\n\
    int x = 1234;\ncout.setf(ios::right);\ncout.width(10);\ncout << \"Hello\";\ncout.width(15);\n\
    cout << x;\n// output of the above is:\n//Hello1234\n```\n\n```cpp\nint x = 1234;\n\
    cout.setf(ios::right);\ncout.fill('.'); // change the fill character\ncout.width(10);//\
    \ set field width to 10\ncout << x;\n// output of the above is:\n//......1234\n\
    ```\n\n### Stream Manipulators\n\nA Stream manipulator is a symbol or function\
    \ that is used by placing it on the right side of the insertion operator `<<`.\n\
    \nA plain manipulator is just a symbol, like a variable:\n```cpp\ncout << endl;\
    \ // endl is a stream manipulator\n```\n\nA parameterized stream manipulator looks\
    \ like a function call -- it has one or more parameters:\n```cpp\ncout << setw(10);\
    \ // setw() is a parameterized manipulator\n```\n"
