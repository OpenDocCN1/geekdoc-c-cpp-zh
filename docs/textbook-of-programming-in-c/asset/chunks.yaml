    \ acquired from its  parent.\n\n![](Images/image01320.jpeg)\n\n### Example:\n\n\
    ![](Images/image01321.jpeg) \n\nC++ supports such hierarchical classification\
    \ of classes:\n\n*   Single  inheritance\n\n*   Multiple  inheritance\n\n*   Multi-level\
    \  inheritance\n\n*   Hierarchical  inheritance\n\n###  Polymorphism\n\n*   Polymorphism\
    \ is a key to the power of  OOPs.\n\n*   It is a Greek word, means the ability\
