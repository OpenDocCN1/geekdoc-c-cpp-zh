    ### 客户端-服务器模型


    客户端寻求服务，而服务器提供由客户端请求的服务。在上面的示例中，`student` 类类似于服务器，而 `student` 类的对象类似于客户端。它们通过发送消息来调用服务器。


    在以下语句中：

    ```cpp

    s2.setdata(10, “kumar”);

    ```


    对象 `s2` 向服务器请求带有参数 `10` 和 `kumar` 的消息 `setdata`，服务器接受这些消息并执行操作，并在客户端调用 `outdata(
    )` 函数时显示结果。


    ### 定义成员函数


    类的数据成员必须在类体内部声明，而类的成员函数可以通过以下任何一种方式定义：


    *   在类规范内部

    *   在类规范外部


    成员函数定义的语法取决于它是在类规范内部定义还是外部定义的，但它们执行的操作是相同的。


    #### (a) 类体内部的成员函数


    所有在类体内部定义的成员函数。例如：

    ```cpp

    Class classname


    {


    private:

    int age;

    int  setage(int  agein);//成员  函数

    {

    age  =  agein;//函数体

    }


    ……….. public:


    int b;

    void rect( )

    {

    . .  ...//函数体

    }


    };

    ```


    #### (b) 类体外部的成员函数


    在类体内部声明函数原型，然后在类体外部定义它。这是通过使用“作用域解析运算符”（`::`）来实现的。它充当标识标签，用于通知编译器该函数属于哪个类。


    **语法：**

    ```cpp

    class classname


    {


    . . . .

    Returntype  memberfunction  (arguments);//函数  声明

    . . . .

    };


    returntype classname ::  memberfunction  (arguments)//函数定义

    {

    //函数体

    }

    ```


