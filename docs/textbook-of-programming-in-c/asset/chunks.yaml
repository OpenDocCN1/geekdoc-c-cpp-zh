    functions can be used to overload them.

    - A Unary operator, overloaded by means of a member function, takes no explicit
    arguments and returns no explicit values.

    - Binary operators overloaded through a member function takes one explicit argument.

    - When using binary operators overloaded through a member function, the left hand
    operand must be an object of the relevant class.

    - Binary arithmetic operators such as `+`, `=`, `*`, and `/` must explicitly return
    a value. They must not attempt to change their own arguments.


    # UNIT-III


    ## Base class and derived class relationship

    - Derived class declaration

    - Forms of inheritance-Inheritance and member accessibility

    - Multiple inheritance

    - Multi level inheritance

    - Hybrid inheritance

    - Constructors in derived class-Destructors in derived class

    - Virtual base classes

    - Member function overriding

    - Virtual functions.


    ## Inheritance

    - C++ strongly supports the concept of REUSABILTY i.e., one class that has been
    written and tested already can be used to create a new class.

    - It is like child inheriting the features of its parents(such as beauty of the
    mother and intelligence of the father)The reusable property will reduce the debugging
    time.

    - The time overhead and cost overhead will be reduced.

    - Thus, the reusability mechanism is applied to the inheritance.


    ### Base class and derived class relationship

    - The mechanism of deriving the new class from an old one or the technique of
    building new classes from the existing classes is called inheritance.

    - The old class is called as base class and the new class is called as derived
    class.

    - The derived class inherits some or all the traits from the base class.

    - ![](Images/image01356.jpeg)![](Images/image01357.jpeg)The base class remains
    unchanged.


    ![](Images/image01358.jpeg)


    Base class

    ![](Images/image01359.jpeg)

    ![](Images/image01360.jpeg)


    Derived class

    1

    Defined in derived class

    ![](Images/image01361.jpeg)![](Images/image01362.jpeg)![](Images/image01363.jpeg)Defined
    in base class also accessible from derived class

    Fig. Base class and derived class relationship


    - A class can also inherit properties from more than one level.

    - The base class is often called the ancestor, parent or super class.

    - And the derived class is called the descendent, child or subclass.

    - In the fig. above derived class inherits the features of the base class (A,B,C)
    and adds its own features (D).


    ### Derived class declaration

    - A derived class extends its features by inheriting the properties of another
    class,called base class and adding features of its own.

    - ![](Images/image01364.jpeg)The general form of declaring a derived class is

    ![](Images/image01365.jpeg)

    Fig. Syntax of derived class declaration


    - The derivation of he Derivedclass from the Baseclass is indicated by the colon
    (`:`).

    - The visibility mode is optional and , if present , it may be either private
    or public.

    - The default visibility mode is private.

    - Visibility mode specifies whether the features of the base class are publicly
    or privately inherited.


    **Note:**

    - No memory is allocated to the derived class when it is declared.

    - But memory is allocated when it is instantiated to create objects.


    ## 4 Inheritance and member accessiblity

    The following are the three possible styles of derivation:


    ```cpp

    Class abc : private xyz// private derivation

    {

    .......// members of abc

    .......

    };

    ```

    the above class is derived from a base class xyz.


    ```cpp

    Class abc : public xyz// public derivation

    {

    ......//members of abc

    ......

    };

    ```


    ```cpp

    Class abc : xyz// private derivation by default

    {

    ......//members of abc

    ......

    };

    ```

    ![](Images/image01366.jpeg)When a base class is inherited by a derived class with
    visibility mode “private” i.e., when base class is privately inherited:


    - All “‘public members” of the base class become “private members” of the derived
    class.

    - And therefore all the public members of the base class can only be accessed
    by the member functions of the derived class.

    - They are inaccessible to the objects of the derived class.


    **Note:**

    - All “public members” of a class can be accesseb by its own objects using dot
    operator.

    - i.e., no member of the base class is accessible to the objects of the derived
    class.


    ![](Images/image01366.jpeg)When a base class is inherited by a derived class with
    visibility mode “public” i.e., when base class is “publicly” inherited:


    - All “‘public members” of the base class become “public members” of the derived
    class.

    - And therefore all the public members of the base class can be accessed by the
    member functions of the derived class.

    - Also accessible to the objects of the derived class.


    **Note:**

    - In both the cases,the “private members” of the base class cannot be inherited
    to the derived class.

    - i.e.,the “private members” of the base class will never become the members of
    its derived class.


    ### Making a private member inheritable

    - We can make the private members inherited by the derived class.

    - This can be accomplished by modifying the visibility limit of private,by it
    public.

    - This would taking away the advantage of “data hiding”.

    - C++ provides a third visibility modifier, protected,which serve a limited purpose
    in inheritance.

    - The data members declared as protected will be accessible by the member functions
    of its own class.

    - And any class which is immediately derived from it.

    - These data protected members cannot be accessed by other functions outside these
    two classes.

    - A class can now use all three visibility modes as shown below:


    ```cpp

    class abc

    {

    protected:

    ...............

    ................//visible to member functions within

    its class and its immediate derived class

    public:

    ................//visible to all functions

    in the program

    };

    ```

    - is a valid class definition.


    **Note:**

    - When a protected member is inherited in public mode derivation,it becomes protected
    in the derived class too.

    - And therefore is accessible by the member functions of the derived class.

    - It is also ready for funther inheritance.

    - When a protected member is inherited in the private mode derivation,it becomes
    private in the derived class.

    - Although it is avaible to the member functions of the derived class.

    - It is not available for further inheritance (since private members cannot be
    inherited).

    - The keywords private,protected and public may appear in any order and any number
    of times in the declaration of the class.


    For example:


    ```cpp

    class abc

    {

    protected:

    ...............

    ................

    public:

    ................

    ................

    private:

    .............

    ..............

    public:

    .............

    .  ............


    };

    ```

    is a valid class definition.


    **Note:**

    - It is possible to inherit a base class in protected mode (known as protected
    derivation).

    - In protected derivation,both the public and protected members of the base class
    become protected members of the derived class.


    ![](Images/image0136.jpeg)Table below summarizes how the base class members undergoes
    modifications in all the three types of derivation:


    | Base class visibility | Derived class visibility | |

    | :--- | :--- | :--- |

    | Public derivation | Private derivation | Protected derivation |

    | Private | Not inherited | Not inherited | Not inherited |

    | Protected | Protected | Private | Protected |

    | Public | Public | Private | Protected |


    Table.Visibility of inherited members


    ![](Images/image01367.jpeg)Forms of Inheritance


    1. Single inheritance

    2. Multiple inheritance

    3. Multilevel inheritance

    4. Hierarchical inheritance

    5. Hybrid inheritance

