    ![](Images/cover01411.jpeg)


    # PROGRAMMING IN C++


    ![](Images/image01299.jpeg)<map name="awmap1"><area shape="rect" href="http://www.pudhiyadesambook.blogspot.com"
    coords="249, 675, 537, 692"></map>


    ## Unit 1: Object Oriented Programming Paradigms


    - Comparison of Programming Paradigms

    - Object Oriented Languages

    - Benefits of Object Oriented Programming

    - Comparison with C

    - Overview of C++

    - Pointers, References and Structures

    - Functions - Scope and Namespaces

    - Source Files and Programs


    ### Procedure-oriented Programming


    The high level languages, such as `BASIC`, `COBOL`, `C`, `FORTRAN` are commonly
    known as Procedure Oriented Programming.


    ![](Images/image01300.jpeg)[](Images/image01301.jpeg)[](Images/image01302.jpeg)[](Images/image01303.jpeg)[](Images/image01304.jpeg)[](Images/image01305.jpeg)Using
    this approach, the problem is viewed in sequence of things to be done, like reading,
    processing and displaying or printing. To carry out these tasks the function concepts
    must be used.


    ![](Images/image01306.jpeg)[](Images/image01307.jpeg)


    ### Fig. Typical structure of Procedure Oriented Programs


    - ![](Images/image01308.jpeg)This concept basically consists of number of statements
    and these statements are organized or grouped into functions.

    - While developing these functions the programmer must care about the data that
    is being used in various functions.

    - In a multi-function program, the data must be declared as global, so that data
    can be accessed by all the functions within the program & each function can also
    have its own data called local data.


    ![](Images/image01309.jpeg)


    ### Fig. Relationship of data and functions in procedural programming


    - The global data can be accessed anywhere in the program. In large program it
    is very difficult to identify what data is accessed by which function. In this
    case we must revised about the external data and as well as the functions that
    access the global data. At this situation there is so many chances for an error.


    ### Characteristics of Procedure-oriented Programming (C):


    - Emphasis is on doing things (algorithms)

    - Larger programs are divided into smaller programs known as functions.

    - Most of the functions share global data.

    - Data move openly around the system from function to functions

    - Functions transforms data from one form to another

    - Employs TOP-DOWN approach in program design.


    ### ![](Images/image01311.jpeg)Object-oriented programming


    - This programming approach is developed to reduce the some of the drawbacks encountered
    in the Procedure Oriented Programming approach.

    - The `OOProgramming` approach treats data as critical element and does not allow
    the data to flow freely around the program.

    - It bundles the data more closely to the functions that operate on it; it also
    protects data from the accidental modification from outside the function.

    - The object oriented programming approach divides the program into number of
    entities called objects and builds the data and functions that operates on data
    around the objects.

    - The data of an object can only access by the functions associated with that
    object. However the functions of one object can access the functions of other
    objects.


    ![](Images/image01312.jpeg)


    ## ![](Images/image01313.jpeg)[](Images/image01314.jpeg)Fig. Organisation of data
    and functions in OOP


    ### Characteristics of Object-oriented Programming (C++)


    - Emphasis is on data rather than procedure.

    - Programs are divided into what known as `OBJECTS`

    - Data structures are designed such that they characterize the objects

    - Functions that operate on the data of an object are tied together in the data
    structure.

    - Data is hidden and cannot be accessed by external functions.

    - Objects may communicate with each other through functions

    - New data and functions can be easily added whenever necessary

    - Follows BOTTOM-UP approach in program design.


    ### Comparison of Programming Paradigms


    #### Difference between C & C++


    `C` is an procedure oriented programming language, whereas `C++` is an object
    oriented programming language. The need for an object oriented environment is
    because procedure oriented programming language such as `C` fails to show the
    desired results for larger programs inters of bug free, complexity & reusable
    programs. `C++` eliminates the pitfalls faced by `C` language.


    There are many differences which makes `C++` as an apt alternative to `C`. There
    are many concepts in `C++` which `C` language doesn’t support. They are data hiding,
    data encapsulation, inheritance, polymorphism, classes, objects, operator overloading
    & message passing. These concepts can eliminate the complexity of `C` for larger
    programs.


    The main difference between `C` & `C++` is where we use the `class` (user defined
    data type), Through `class` we derive the other concepts. `Class` is similar to
    structure in `C`. In structure only mixed data type can be declared, whereas `C++`
    allows us to declare & define functions in addition to the data''s. This makes
    the main function more simple & grouping all functions into a single `class`.


    Operator overloading concept in `C++` makes us to create a new language of or
    own own. Through this we can perform arithmetic operations on variables of class
    i.e. objects which makes the program easier to understand. In `C` we can’t perform
    arithmetic operation on structure variable as we do in `C++`.


    In `c` for larger programs the presence of redundant codes is unavoidable. This
    can be eliminated in `C++` by following inheritance.


    In `C` there may be accidental invading of codes of one program by another program.
    This can be eliminated in `C++` which supports data hiding which helps the programmer
    to build secure programs that cannot be invaded by code in other parts of the
    program.


    In `C`, if we want to add additional features to the program without modifying
    the function is very difficult. This can be eliminated in `C++` which supports
    inheritance where we can add additional features to an existing class without
    modifying it. This concept provides the idea of reusability of the programs.


    | S.No | Procedure oriented Programming (C) | Object Oriented Programming (C++)
    |

    | :--- | :--- | :--- |

    | 1.2.3.4.5. | Programs are divided into smaller sub-programs known as functions
    Here global data is shared by most of the functions Follows Top-Down Approach
    Data cannot be secured and available to all the functions. Here, the reusability
    is not possible, hence redundant code cannot be avoided. | Programs are divides
    into objects & classes Objects are easily communicated with each other through
    functions. Follows Bottom-Up Approach Data can be secured and can be available
    in the class in which it is declared. Here, we can reuse the existing one using
    the Inheritance concept |


    ### Object oriented Languages:


    Object oriented programming languages are divided into two. They are 1.Object
    based programming languages 2.Object oriented programming languages


    #### Object based programming:


    Languages that supports programming with objects are said to be Object based programming
    languages. They do not inheritance and Dynamic binding. Object based programming
    is the style of programming that supports encapsulation and identity.


    Major features that are required for this:

    1. Data Encapsulation

    2. Data hiding and access mechanism 3. Automatic initialization and clear up of
    objects 4. Operator overloading


    #### Object oriented programming


    ![](Images/image01315.jpeg)Object oriented programming includes all features of
    Object based programming with two additional features like inheritance and Dynamic
    binding.


    ### The oops concepts are


    - Objects

    - Classes

    - Data abstraction and encapsulation

    - Inheritance

    - Polymorphism

    - Dynamic binding

    - Message passing


    ### Objects


    - Objects are the basic run time entities in an object-oriented system.

    - Each entity can be treated as object. Object contains data and code to manipulate
    these data’s.

