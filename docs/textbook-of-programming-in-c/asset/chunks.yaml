  trans: "\n\n## 动态绑定\n\n- 绑定（Binding）是指将过程调用与响应该调要执行的代码链接起来。\n- 动态绑定（也称为后期绑定）意味着与给定过程关联的代码在运行时的调用之前是未知的。\n\
    - 它与多态和继承相关。\n\n### 示例\n\n- 考虑上图中的 `draw` 过程。通过继承，每个对象都拥有此过程。\n- 然而，它的算法对于每个对象都是唯一的，因此\
    \ `draw` 过程将在定义该对象的每个类中重新定义。\n- 在运行时，将调用与当前引用对象匹配的代码。\n\n## 消息传递\n\n- 一个面向对象（OO）的程序由一组相互通信的对象组成。\n\
    - 因此，在面向对象语言中编程的过程涉及以下步骤：\n    - 创建定义对象及其行为的类。\n    - 从类定义创建对象。\n    - 建立对象之间的通信。\n\
    - 发给对象的消息是执行某个过程的请求，因此它将调用接收对象中的一个函数（过程），以生成所需的结果。\n- 对象之间通过发送和接收信息进行通信，就像人与之间传递消息一样。\n\
    - 消息传递涉及指定对象的名称、函数（消息）名称以及要发送的信息。\n\n### 示例\n\n`employee.salary(name);`\n\n![](img/image01326.jpeg)\n\
    ![](img/image01327.jpeg)\n\n信息\n\n对象具有生命周期。它们可以被创建和销毁。\n只要对象存活，与对象的通信就是可能的。\n\n\
    ## 面向对象编程（OOP）的优点\n\n- 可以轻松管理软件的复杂性。\n- 数据隐藏概念帮助程序员构建安全的程序。\n- 通过类概念我们可以自定义数据类型。\n\
    - 继承概念可以消除冗余代码。\n- 消息传递概念帮助程序员在不同对象之间进行通信。\n- 需要时可以轻松地添加新的数据和函数。\n- OOP 将数据元素与其操作的函数结合得更紧密。\n\
    \n## 面向对象编程的应用\n\n- 实时系统\n- 仿真与建模\n- 对象数据库\n- 超文本、超多媒体和专家文本\n- 人工智能和专家系统\n- 神经网络和并行编程\n\
    - 决策支持和办公自动化系统\n- CIM/CAM/CAD 系统\n\n## C 与 C++ 的比较\n\n### C 语言\n\n- 自上而下的方法\n\
    - 过程导向\n- 变量无法动态泛化\n- 没有引用变量概念\n- 内存管理\n- 分配：`malloc()`，`calloc()`\n- 释放：`free()`\n\
    \    - 类型转换：\n      语法：`(typename) expression`\n- 不支持继承、多态、动态绑定、封装等面向对象的概念。\n\
    - 没有内联函数或友元函数。\n- 输入和输出：\n    - 分别使用 `Scanf()` 和 `printf()` 库函数读取输入和写入输出。\n- 没有作用域解析符来访问函数内部块中的全局变量。\n\
    - 不使用构造函数和析构函数。\n- 不支持继承、多态、封装、动态绑定等面向对象的概念。\n\n### C++ 语言\n\n- 自下而上的方法\n- 面向对象\n\
    - 允许变量的动态初始化，例如：`cin>>str;`\n```\nint len=strlen(str);\n```\n- 使用引用变量，例如：`float\
    \ tot=100`\n```\nfloat & sum=tot;\n// 此处引用变量 sum 引用变量 tot\n```\n- 内存管理\n- 分配：使用\
    \ `new` 运算符。\n- 释放：使用 `delete` 运算符。\n    - 类型转换：\n      语法：`typename (expression)`\n\
    - 内联函数：内联函数是请求[编译器](http://en.wikipedia.org/wiki/Compiler)执行[内联展开](http://en.wikipedia.org/wiki/Inline_expansion)的函数。\n\
    - 例如：\n```cpp\n#include<iostream.h> class class inl\n{\npublic:\n![](img/image01328.jpeg)\n\
    inline int cube(int a) return a*a*a;\n};\n\nInt main()\n{\ninl o;\nint c=o.cube(3);\
    \ return 0;\n}\n```\n- 输入和输出：\n    - 用于读取输入的 `>>` 提取运算符\n    - 用于打印输出的 `<<` 运算符\n\
    \        - 例如：\n```cpp\ncin>> a;\ncout<<a;\n```\n- 作用域解析符：\n  作用域解析符有助于识别并指定标识符所指的上下文。语法：`::member_name`\n\
    - 使用友元函数和虚函数。\n- 不使用构造函数和析构函数。\n- 支持继承、多态、封装、动态绑定等面向对象的概念。\n\n## C++ 编程概述\n\n\
    C++ 由 BJARNE STROUSSTRUP 于 20 世纪 80 年代初在美国马里山的 AT&T 贝尔实验室开发。\nStroustrup 结合了‘C’语言和‘SIMULA67’的特征，创建了一种支持\
    \ OOP 概念的更强大的语言，该语言命名为“带类的 C”。1983 年底，名称改为 C++。\nC++ 的想法来源于‘C’语言的递增运算符（`++`），意味着更多的增加。\n\
    C++ 是‘C’语言的超集，大多数‘C’语言的特性也可以应用于 C++，但面向对象的特性（类、继承、多态、重载）使得 C++ 真正成为一种面向对象的编程语言。\n\
    \n![](img/image01329.jpeg)![](img/image01330.jpeg)\n\nC++ 程序的结构\n\n| 包含文件 |\n\
    | :--- |\n| 类定义 |\n| 成员函数定义 |\n| 主函数程序 |\n\n包含文件为编译器提供了链接系统库中函数的指令。\n例如：\n```cpp\n\
    #include <iostream.h>\n#include–预处理器 指令 iostream.h–头文件\n```\n- 类是将数据及其关联函数绑定在一起的方法。它是一种自定义数据类型。必须在类声明部分声明。\n\
    - 成员函数定义描述了类函数如何实现。这必须是 C++ 程序的下一个部分。\n- 最后是主程序部分，程序从这里开始执行。\n```cpp\nmain( )\n\
    {\n}\n```\n程序执行从左括号开始在右括号处结束。\n主函数的右括号是程序的逻辑终点。\n\n## 输入 / 输出语句\n\n 输入流\n\n语法：\n\
    ```cpp\ncin >> var1 >> var2 >>;\n```\n- `cin` – 关键字，它是在 C++ 中预定义的对象，对应标准输入流。\n\
    - `>>` - 是提取或获取运算符\n提取操作（`>>`）从左侧的流对象获取值并将其放入右侧的变量中。\n例如：\n```cpp\ncin>>x; cin>>a>>b>>c;\n\
    ```\n\n输出流：语法：\n```cpp\ncout<<var1<<var2;\n```\n- `cout` - 标准输出流对象\n- `<<` - 是插入或放入运算符\n\
    它将右侧变量的内容定向到左侧的对象。\n输出流可用于在屏幕上显示消息。\n例如：\n```cpp\ncout<<a<<b; cout<<”value of\
    \ x is”<<x;\n```\n\n## 令牌\n\n程序中的最小单元被称为令牌。\nC++ 具有以下令牌：\n- 关键字\n- 标识符\n- 常量\n\
    - 字符串\n- 运算符\n\n- C++ 程序使用这些令牌、空白符和语言语法编写。\n- 大多数 C++ 令牌与 C 令牌基本相似，但有一些添加和微调。\n\
    \n### 关键字\n\n![](img/image01311.jpeg)\n- 关键字实现了特定的 C++ 语言特性。\n- 关键字具有预定义的含义，用户无法更改。\n\
    - 关键字不能作为程序变量的名称。\n\n"
- fmt: "\n* Additional keywords have been added to ANSI C keywords, in order to enhance\
    \ its features amd make it an OO language.\n\n### The specific C++ Keywords\n\n\
    There are several keywords specific to C++\n\n![](Images/image01311.jpeg)![](Images/image01331.jpeg)\n\
    \nIdentifiers refer to the names of variables, functions, arrays, classes, etc.\
    \ created by the programmer. They are the fundamental requirement of any language.\n\
    \nRules for naming these identifiers are common to both C and C++:\n\n1. Only\
    \ alphabetic characters, digits and underscores are permitted.\n2. The name cannot\
    \ start with a digit.\n3. Uppercase and lowercase letters are distinct.\n4. A\
    \ declared keyword cannot be used as a variable name.\n\nThe major difference\
    \ between C and C++ is the limit on the length of a name i.e. `C` recognizes only\
    \ the first 32 characters in a name. Whereas `C++` has no limit on its length\
    \ and therefore, all the characters in a name are significant.\n\n### ![](Images/image01311.jpeg)Constants\n\
    \nIt refers to fixed values that do not change during the execution of a program.\
    \ `C++` recognises all constants available in C.\n\n### Types of constants:\n\n\
    * Integer constants-Eg: `123`, `25`– without decimal point\n* Character constants-Eg:\
    \ ‘A’, ‘B’, ‘*’, ‘1’\n* Real constants-Eg: `12.3`, `2.5` - with decimal point\n\
    \n### ![](Images/image01311.jpeg)Strings\n\nA sequence of characters is called\
    \ string. String constants are enclosed in double quotes as follows:\n\n### Eg:\n\
    \n“Hello”\n\n### ![](Images/image01311.jpeg)Operators\n\nAn operator is a symbol\
    \ that tells the computer to perform certain mathematical or logical manipulations.\n\
    \n### Types of Operators\n\n1. Arithmetic Operators\n2. Relational Operators\n\
    3. Logical Operators\n4. Assignment Operators\n5. Increment & decrement Operators\n\
    6. Conditional Operators\n7. Bitwise Operators\n8. Special Operators\n9. Manipulators\n\
    10. Memory allocate / delete Operators\n\n### • Manipulators\n\nManipulators are\
    \ operators used to format the data display. The commonly used manipulators are\
    \ `endl`, `setw`.\n\n###  endl manipulators\n\nIt is used in output statement\
    \ causes a line feed to be inserted, it has the same effect as using the newline\
    \ character `\\n` in ‘C’ language.\n\n### Eg:\n\n```cpp\n#include <iostream.h>\
    \ main()\n{\n\n}\n```\n\n### Output:\n\n```cpp\nint a=10, b=20;\ncout << “C++\
    \ language” << endl; cout << “A value: “ << a << endl; cout << “B value:” << b\
    \ << endl;\n```\nC++ language A value: 10\nB value: 20\n\n### Pointers\n\nC++\
    \ adds the concept of constant pointers and pointer to a constant.\n\n### Constant\
    \ pointer\n\n```cpp\nChar * const ptr1=”GOOD”;//constant pointer We cannot modify\
    \ the address of pointer1.\n```\n\n### Pointer to constant\n\n```cpp\nint const\
    \ * ptr1=&m;//pointer to a constant Contents of what it points to cannot be changed.\n\
    ```\n\n### Void\n\nUses of `void`:\n\n(i) To specify the return type of a function\
    \ when it is not returning a value.\n(ii) To indicate an empty argument list to\
