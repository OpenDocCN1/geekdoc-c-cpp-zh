  trans: "\n\n* 一个用于检测并抛出异常\n* 另一个用于捕获异常并采取适当措施。\n\n### 异常处理模型\n\n异常处理机制使用了三个块：`try`、`throw`、`catch`。这三个异常处理模型之间的关系所示：\n\
    \n* 关键字 `try` 用于一组（由大括号括围）可能产生异常的语句。这组语句被称为 `try` 块。\n* 当检测到异常时，使用 `try` 块中的 `throw`\
    \ 语句将其抛出。\n* 由关键字 `catch` 定义的 `catch` 块捕获 `try` 块中 `throw` 语句抛出的异常，并对其进行适当处理。\n\
    * 一般格式：\n\n```cpp\ntry\n{\n    ... // 检测并...异常的语句块\n    throw exception; // 抛出异常\n\
    \    ...\n    ...\n}\ncatch (type arg)\n{\n    ...\n    ...\n    ... // 处理异常的语句块\n\
    }\n```\n\n* 当 `try` 块抛出异常时，程序控制将离开 `try` 块并进入 `catch` 块中的 `catch` 语句。\n* 异常是用于传输有关问题信息的对象或变量。\n\
    * 如果抛出的对象的 `type` 与 `catch` 语句中的 `arg` 类型匹配，则执行 `catch` 块来处理异常。\n* 如果它们不匹配，程序将通过自动调用的\
    \ `abort()` 函数终止。\n* `catch` 块可以有多个 `catch` 语句，每个语句句对应于一种特定类型的异常。\n* 例如，如果 `throw`\
    \ 块可能会抛出两个异常，则 `catch` 块将有两个 `catch` 语句，每个语句对应一种异常类型。每个 `catch` 语句被称为异常处理程序。\n\
    * 当没有检测到并抛出异常时，控制将跳转到 `catch` 块之后紧后的语句。也就是说，`catch` 块会被跳过。\n\n**示例：除以零**\n\n```cpp\n\
    #include<iostream.h>\nvoid main()\n{\n    int x, y, z;\n    cout<<\"enter the\
    \ values of x, y, z\"; cin>>x>>y>>z;\n    try\n    {\n        if(x == y)\n   \
    \         throw y;\n        else\n        {\n            int d= z / (x - y);\n\
    \            cout<<\"the result of z/(x-y) is:\"<< d;\n        }\n    }\n    catch(int\
    \ y)\n    {\n        cout<<\"exception caught x-y is \"<<<< x-y;\n    }\n}\n```\n\
    \n**运行 1:**\nenter the values of x, y, z 50 30 20\nthe result of z/(x-y) is: 1\n\
    \n**运行 2:**\nEnter the values of x, y, z 30 30 20\nexception caught x-y is : 0\n\
    \n**使用生成异常的函数：**\n\n```cpp\n#include<iostream.h>\nvoid divide(int x, int y, int\
    \ z)\n{\n    if(x == y)\n    {\n        cout<<\"we are inside the function\";\n\
    \        throw (x-y);\n    }\n    else\n    {\n        int d= z / (x - y);\n \
    \       cout<<\"the result of z/(x-y) is:\"<< d;\n    }\n}\nvoid main()\n{\n \
    \   try\n    {\n        cout<<\" we are inside the try block\";\n        divide(10,\
    \ 20, 30); // 调用 divide()\n        divide(10, 10, 20); // 调用 divide()\n    }\n\
    \    catch(int i) // 捕获异常\n    {\n        cout<<\"exception caught x-y is : \"\
    <<i;\n    }\n}\n```\n\n**运行:**\nwe are inside the try block\nwe are inside the\
    \ function\nthe result of z/(x-y) is: -3\nwe are inside the function\nexception\
    \ caught x-y is: 0\n\n### 使用对象的多个 catch 语句\n\n* 要用对象抛出异常，需要定义一个 `abstract class`（抽象类）。\n\
    * 一个 `abstract class` 无非只是一个带有空数据成员的类。\n* 类名作为无名对象被调用，用于抛出异常。\n\n**示例：**\n\n```cpp\n\
    #include<iostream.h>\nclass positive { };\nclass negative { };\nclass zero { };\n\
    \nvoid greater(int num)\n{\n    if(num > 0)\n        throw positive();\n    else\
    \ if (num < 0)\n        throw negative();\n    else\n        throw zero();\n}\n\
    \nvoid main()\n{\n    int num;\n    cout<<\"enter any number \"; cin>>num;\n \
    \   try\n    {\n        greater(num);\n    }\n    catch(positive)\n    {\n   \
    \     cout<<\"positive exception\";\n    }\n    catch(negative)\n    {\n     \
    \   cout<<\"negative exception\";\n    }\n    catch(zero)\n    {\n        cout<<\"\
    zero exception\";\n    }\n}\n```\n\n### 模板\n\nOOP 的一个重要特性是代码的可重用。模板支持泛型编程，允许不同的数据类型。\n\
    \n**模板的类型**\n有两种模板：\n* 函数模板\n* 类模板\n\n#### 函数模板\n\n函数模板定义了一组函数。函数模板本身不是一个函数，而是编译器用于生成函数的蓝图。函数模板在调用点实例化。\n\
    \n**函数模板的语法**\n\n```cpp\ntemplate <template-parameter-list>\nreturn_type function_name(parameter-list)\n\
    {\n    ...\n}\n```\n\n**示例：**\n\n```cpp\n#include<iostream.h>\n#include<conio.h>\n\
    template <class T>\nvoid swap(T &x, T &y)\n{\n    T z; z=x; y=z;\n}\n\nvoid main()\n\
    {\n    clrscr();\n    int a,b;\n    cout<<\"\\nEnter 2 integers:\"; cin>>a>>b;\n\
    \    swap(a,b);\n    cout<<\"\\nafter swapping the values are \"<<a<<\"\\t\"<<b;\n\
    \n    float c,d;\n    cout<<\"\\nEnter 2 float values:\"; cin>>c>>d;\n    swap(c,d);\n\
    \    cout<<\"\\nafter swapping the values are \"<<c<<\"\\t\"<<d;\n    getch();\n\
    }\n```\n\n#### 类模板\n\n类模板与类的关系就像类与对象的关系。类定义如何构造对象，而类模板定义如何生成一组类。\n\n注意 class template（类模板）和\
    \ template class（模板类）之间的区别：\n* class template 是用于生成类的模板。你不能声明类模板的对象。\n* template\
    \ class 是类模板的实例。\n\n**类模板的语法**\n\n```cpp\ntemplate <template-parameter-list>\n\
    class class_name\n{\n    ...\n};\n```\n\n**示例：**\n\n```cpp\n#include<iostream.h>\n\
    #include<conio.h>\ntemplate <class T>\nclass pair{\n    T a,b;\npublic:\n    pair(T,\
    \ T);\n    T getmax();\n};\n\ntemplate <class T> pair<T>:: pair(T x, T y)\n{\n\
    \    a=x; b=y;\n}\n\ntemplate <class T> T pair<T>::getmax()\n{\n    T z; z=(a>b)?a:b;\
    \ return z;\n}\n\nvoid main()\n{\n    clrscr();\n    int p,q;\n    cout<<\"\\\
    nEnter 2 integers:\"; cin>>p>>q;\n    pair<int> ob1(p,q);\n    cout<<\"\\nThe\
    \ biggest number is \"<<ob1.getmax();\n\n    float r,s;\n    cout<<\"\\nEnter\
    \ 2 float values:\"; cin>>r>>s;\n    pair<float> ob2(r,s);\n    cout<<\"\\nThe\
    \ biggest number is \"<<ob2.getmax();\n    getch();\n}\n```\n"
