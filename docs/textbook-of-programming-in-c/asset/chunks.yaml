- fmt: "\n# Component Software and Programming\n\nA good analogy for component software\
    \ can be found in the automobile industry, in which car manufacturers often buy\
    \ individual car parts, such as engines and transmissions, from various manufacturers\
    \ and then assemble cars from these components. With component software, the pieces\
    \ can be used as they are—they don't need to be recompiled, you don't need the\
    \ source code, and you aren't restricted to one programming language. The term\
    \ for this process is binary reuse, because it is based on interfaces rather than\
    \ on reuse at the source code level. While the software components must adhere\
    \ to the agreed upon interface, their internal implementation is completely autonomous.\
    \ For this reason, you can build the components using procedural languages as\
    \ well as object-oriented languages.\n\nOne of the main goals of a component-based\
    \ programming model is to promote interoperability. Interoperability is one of\
    \ those buzzwords in the computer field that means different things to different\
    \ people. In the context of component software, interoperability simply means\
    \ the ability of components to work together. When you examine a project and notice\
    \ areas in which software seems to be forced together unnaturally, the application\
    \ should be divided into components.\n\n## Case Study: Controls\n\nLet's use the\
    \ example of controls. In the good old days of Windows programming, if your program\
    \ needed a toolbar, you simply wrote the toolbar code directly into the main part\
    \ of the application. This approach had two inherent problems. First, your goal\
    \ was probably not to create a cool toolbar but to create a great application\
    \ with a toolbar. Second, after you consumed many precious hours developing a\
    \ toolbar, if other developers in your company wanted to use that toolbar in their\
    \ projects, they couldn't easily reuse it if the code was sprinkled throughout\
    \ the program, responding to `WM_CREATE`, `WM_PAINT`, and `WM_LBUTTONDOWN` messages.\n\
    \nA component-based approach to this problem would make the toolbar into a separate\
    \ component. The problem then becomes how the toolbar component and the application\
    \ should interact—the whole issue of interoperability. The component software\
    \ paradigm mandates that all components define an interface that exposes the functionality\
    \ available in that component. As long as the component implements the interface\
    \ and the client applications abide by it, interoperability results. In the toolbar\
    \ example, the application developers could simply purchase the toolbar component\
    \ from some other developer who specializes in toolbars, thus saving development,\
    \ debugging, and maintenance time.\n\n## Encapsulation and Contracts\n\nOne important\
    \ principle of object-oriented programming, mentioned earlier, is encapsulation.\
    \ Encapsulation hides the implementation of an object from users of the object.\
    \ The users of an object have access only to the object's interface. Developers\
    \ who use prebuilt objects in their projects are interested only in the \"contract\"\
    —the promised behavior that the object supports. Component software formalizes\
    \ the notion of a contract between an object and a client. Each object declares\
    \ what it is capable of by implementing certain interfaces. The only way to access\
    \ the services of an object is through the interfaces that it supports. Such a\
    \ contract is the basis for interoperability.\n\n# Prototypes\n\nAlthough the\
    \ object-oriented analysis and design describe the system features, it is important\
    \ to construct a prototype of some of the key system components shortly after\
    \ the products are selected. A prototype enables you to fully understand how easy\
    \ or difficult it will be to implement some of the features of the system. It\
    \ also can give users a chance to comment on the usability and usefulness of the\
    \ user interface design and lets you assess the fit between the software tools\
    \ selected, the functional specification, and the user needs. Additionally, prototyping\
    \ can further define the use cases, and it actually makes use-case modeling much\
    \ easier.\n\nPrototypes have been categorized in various ways. The following categories\
    \ are some of the commonly accepted prototypes and represent very distinct ways\
    \ of viewing a prototype, each having its own strengths:\n\n*   Horizontal Prototype\n\
    *   Vertical Prototype\n*   Analysis Prototype\n\nA Horizontal prototype is a\
    \ simulation of the interface (that is, it has the entire user interface that\
    \ will be in the full-featured system) but contains no functionality. This has\
    \ the advantages of being very quick to implement, providing a good overall feel\
    \ of the system, and allowing users to evaluate the interface on the basis of\
    \ their normal, expected perception of the system.\n\nA Vertical prototype is\
    \ a subset of the system features with complete functionality. The principal advantage\
    \ of this method is that the few implemented functions can be tested in great\
    \ depth. In practice, prototypes are a hybrid between horizontal and vertical:\
    \ The major portions of the interface are established so the user can get the\
    \ feel of the system, and features having a high degree of risk are prototyped\
    \ with much more functionality.\n\nAn Analysis prototype is an aid for exploring\
    \ the problem domain. This class of prototype is used to inform the user and demonstrate\
    \ the proof of a concept. It is not used as the basis of development, however,\
    \ and is discarded when it has served its purpose. The final product will use\
    \ the concepts exposed by the prototype, not its code. A domain prototype is an\
    \ aid for the incremental development of the ultimate software solution. It often\
    \ is used as a tool for the staged delivery of subsystems to the users or other\
    \ members of the development team. It demonstrates the feasibility of the implementation\
    \ and eventually will evolve into a deliverable product.\n\nThe typical time required\
    \ to produce a prototype is anywhere from a few days to several weeks, depending\
    \ on the type and function of prototype. Prototyping should involve representation\
    \ from all user groups that will be affected by the project, especially the end\
    \ users and management members to ascertain that the general structure of the\
    \ prototype meets the requirements established for the overall design.\n\n# Order\
    \ of Activities for Object Identification\n\n1.  Formulate a few scenarios with\
    \ help from an end user or application domain expert.\n2.  Extract the use cases\
    \ from the scenarios, with the help of an application domain expert.\n3.  Then\
    \ proceed in parallel with the following:\n    *   Analyse the flow of events\
    \ in each use case using Abbot's textual analysis technique\n    *   Generate\
    \ the `UML` class diagram.\n\n# Case Study: Railway Reservation System\n\nDevelop\
    \ a system for railway reservation using object oriented design. Draw the necessary\
    \ diagrams.\n\nLet us show the process of OOAD through software tools.\n\n## Problem\
    \ Statement for Railway Reservation System\n\nSoftware has to be developed for\
    \ automating the manual railway reservation system. The system should be distributed\
    \ in nature. It should be designed to provide functionalities as explained below:\n\
    \n1. Reserve Seat: A passenger should be able to reserve seats in the train. A\
    \ reservation form is filled by the passenger and given to the clerk, who then\
    \ checks for the availability of seats for the specified date of journey. If seats\
    \ are available then the entries are made in the system regarding the train name,\
    \ train number, date of journey, boarding station, destination, person name, sex\
    \ and total fare. Passenger is asked to pay the required fare and the tickets\
    \ are printed. If the seats are not available then the passenger is informed.\n\
    2.  Cancel Reservation: A passenger wishing to cancel a reservation is required\
    \ to fill a form. The passenger then submits the form and the ticket to the clerk.\
    \ The clerk then deletes the entries in the system and changes the reservation\
    \ status of that train. The clerk crosses the ticket by hand to mark as cancelled.\n"
