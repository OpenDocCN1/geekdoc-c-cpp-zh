    \ The major portions of the interface are established so the user can get the\
    \ feel of the system, and features having a high degree of risk are prototyped\
    \ with much more functionality.\n\nAn Analysis prototype is an aid for exploring\
    \ the problem domain. This class of prototype is used to inform the user and demonstrate\
    \ the proof of a concept. It is not used as the basis of development, however,\
    \ and is discarded when it has served its purpose. The final product will use\
    \ the concepts exposed by the prototype, not its code. A domain prototype is an\
    \ aid for the incremental development of the ultimate software solution. It often\
    \ is used as a tool for the staged delivery of subsystems to the users or other\
    \ members of the development team. It demonstrates the feasibility of the implementation\
    \ and eventually will evolve into a deliverable product.\n\nThe typical time required\
    \ to produce a prototype is anywhere from a few days to several weeks, depending\
    \ on the type and function of prototype. Prototyping should involve representation\
    \ from all user groups that will be affected by the project, especially the end\
    \ users and management members to ascertain that the general structure of the\
    \ prototype meets the requirements established for the overall design.\n\nORDER\
    \ OF ACTIVITIES FOR OBJECT IDENTIFICATION\n\n1. Formulate a few scenarios with\
    \ help from an end user or application domain  expert\n\n2. Extract the use cases \
    \ from the scenarios, with the help of an application domain  expert\n\n3. Then\
    \ proceed in parallel with the  following:\n\n*   Analyse the flow of events in\
    \ each use case using Abbot's textual analysis technique\n\n*   Generate the UML\
    \ class  diagram.\n\n CASE  STUDY\n\nDevelop a system for railway reservation\
    \ using object oriented design. Draw the necessary diagrams.\n\nLet us show the\
    \ process of OOAD through software tools.\n\nProblem Statement for Railway Reservation\
    \ System\n\nSoftware has to be developed for automating the manual railway reservation\
    \ system. The system should be distributed in nature. It should be designed to\
    \ provide functionalities as explained below:\n\n1.  Reserve Seat: A passenger\
    \ should be able to reserve seats in the train. A reservation form is filled by\
    \ the passenger and given to the clerk, who then checks for the availability of\
    \ seats for the specified date of journey. If seats are available then the entries\
    \ are made in the system regarding the train name, train number, date of journey,\
    \ boarding station, destination, person name, sex and total fare. Passenger is\
    \ asked to pay the required fare and the tickets are printed. If the seats are\
    \ not available then the passenger is  informed.\n\n2.  Cancel Reservation: A\
    \ passenger wishing to cancel a reservation is required to fill a form. The passenger\
    \ then submits the form and the ticket to the clerk. The clerk then deletes the\
    \ entries in the system and changes the reservation status of that train. The\
    \ clerk crosses the ticket by hand to mark as  cancelled."
