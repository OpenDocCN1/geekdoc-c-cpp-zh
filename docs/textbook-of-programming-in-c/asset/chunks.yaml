    \n## Constructors in derived class\n\n*   Constructors can be used to initiative\
    \ an object data members and allocating required resources such as memory.\n*\
    \   In case of single inheritance, when both the derived and base class contain\
    \ constructors,the base constructor is executed first and then the constructor\
    \ in the derived class is executed.\n*   In case of multiple inheritance,the base\
    \ class constructors are executed in the order in which they appear in the declaration\
    \ of the derived class.\n*   In case of multilevel inheritance, the constructors\
    \ will be executed in the order of inheritance.\n*   The constructors of virtual\
    \ base classes are invoked before any non-virtual base classes.\n*   If there\
    \ are multiple virtual base classes, they are invoked in the order in which they\
    \ are declared.\n\n| Method of inheritance | Order of execution |\n| :--- | :---\
    \ |\n| Class A : public B | A(); base constructor |\n| { | B(); derived constructor\
    \ |\n| }; | |\n| Class A : public B,public C | B(); base(first) |\n| { | C();\
    \ base(second) |\n| }; | A();derived |\n| Class A : public B,virtual public C\
    \ | C(); virtual base |\n| { | B(); ordinary base |\n| }; | A();derived |\n\n\
    **Table. Order of execution of base class constructors**\n![](Images/image01366.jpeg)\n\
    \n## Null constructors in derived class\n\n### Single inheritance Case 1: No Constructor\
    \ in the base class and derived class\n\n*   When there are no constructors either\
    \ in the base or derived classes, the compiler automatically creates objects of\
    \ classes without any error.\n\n**Example program:**\n```cpp\nClass A\n{\npublic:\
    \ void dis( )\n{\n    cout<<”Hai Friends”;\n}\n};\n\nClass B: public A\n{\npublic:\n\
    \    void display( )\n    {\n        cout<<”Have a nice day”;\n    }\n};\n\nvoid\
    \ main( )\n{\n}\n```\n\n**Case 2: Constructor only in the base class**\n```cpp\n\
    B s;/*object for the derived class*/ s.dis( );\ns. display( );\n```\n```cpp\n\
    #include <iostream.h> class A\n{\npublic:\n    A (  )/*null constructor in base\
    \ class*/\n    {\n        cout<<” Have a nice day”;\n    }\n};\n\nclass B: public\
    \ A\n{\npublic:\n};\n\nvoid main( )\n{\n    B s;/*object for the derived class*/\n\
    }\n```\n*   If the derived class object is created it will check the base class\
    \ first and execute the corresponding default constructor.\n\n### Case 3: Constructor\
    \ only in the derived class\n```cpp\n#include <iostream.h> Class A\n{\npublic:\n\
    };\n\nClass B: public A\n{\npublic:\n    A (  )/*null constructor in derived class*/\n\
    \    {\n        cout<<”Have a nice day”;\n    }\n};\n\nvoid main( )\n{\n    B\
    \  s;/*object for the derived class*/\n}\n```\n*   When the derived class object\
    \ is created, it will check the base class first if there is no constructor in\
    \ the base class, it will skip the base class & run the constructor in the derived\
    \ class.\n\n### Case 4: Constructor in both base and derived class\n```cpp\n#include\
    \ <iostream.h> class A\n{\npublic:\n    A (  )/*null constructor in base class*/\n\
