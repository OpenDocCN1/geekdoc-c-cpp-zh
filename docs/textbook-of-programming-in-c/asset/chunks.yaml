    \ Name of the member function Arguments to the function Eg: `s1.setdata(10, “Ram”);\
    \ s1.outdata( );`\n\nThe object `s1` can be used to access the member functions\
    \ `setdata` and `outdata` respectively.\n\nConsider the following program\n\n\
