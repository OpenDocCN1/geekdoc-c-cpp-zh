    \ class\n{\n    int a,b;//private; not inheritable\npublic://public; ready for\
    \ inheritance\n    int sum;\n\n    void getdata()\n    {\n        cout<<”enter\
    \ sales values for a and b”<<endl; cin>>a>>b;\n    }\n\n    void calculate()\n\
    \    {\n        sum=a+b;;\n    }\n};\n\nclass derived: public base//derived class\n\
    {//base class is publicly inherited\npublic:\n    void putdata()\n    {\n    \
