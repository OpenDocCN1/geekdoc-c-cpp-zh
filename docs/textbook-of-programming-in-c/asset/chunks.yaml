    \ functions are used for reading input and writing output  respectively.\n\n*\
    \   There is no scope resolution operator to access the global variables in the\
    \ interior blocks of the  functions\n\n*   Constructors and destructors are not\
    \  used\n\n*   Object oriented concepts like inheritance, polymorphism, encapsulation,\
    \ dynamic binding etc are not  suppoted\n\n### C++ Language\n\n*   Bottom up \
    \ approach\n\n*   Object  oriented\n\n*   Allows dynamic initialisation of variables\
    \ Eg:cin>>str;\n\nint len=strlen(str);\n\n*   Uses reference variables Eg:float\
