    * 它就像孩子继承了一个父母的身体特征和另一个父母的智力。\n\n![](img/image01367.jpeg)\n\n示例程序 1：\n\n```cpp\n\
    #include<iostream.h> #include<conio.h>\n\nclass abc\n{\npublic:\n    int a;\n\
