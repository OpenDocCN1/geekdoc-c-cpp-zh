  trans: "\n因此，构造函数在创建对象时被调用，取决于传递参数的数量和类型。\n\n在创建类 `account` 的对象期间，调用不同构造函数的情况：\n\
    \n```cpp\nclass account\n{\npublic:\n    account(); account(int an);\n    account(int\
    \ acvalue,float bal);\n………………\n};\n```\n\n`accout acc1; account acc2(45); account\
    \ acc3(324,675.50);`\n\n### 拷贝构造函数：\n\n- 拷贝构造函数用于从另一个对象声明并初始化对象（即将所有数据从一个对象拷贝到另一个对象）。\n\
    - 例如：`integer obj2(obj1);`。上述语句定义了对象 `obj2` 并同时初始化或拷贝了‘obj1’的值。\n- 该语句的另一种形式是\
    \ `Integer obj2=obj1;`。\n- 通过拷贝构造函数初始化的过程被称为拷贝初始化。\n- “拷贝构造函数接受一个与自身同类对象的引用作为参数。”\n\
    - 示例：\n```cpp\n#include<iostream.h> \nclass code\n{\n    int id; \npublic:\n \
    \   code() {}\n    code( int a) { id=a; }\n    code( code &x) { id=x.id; }\n};\n\
    \nvoid main( )\n{\n    code A(100); code B(A); code C=A; code D; D=A;\n    cout<<”\
    \ Id of A object is:”; A.display();\n    cout<<” Id of B object is:”; B.display();\n\
    \    cout<<” Id of C object is:”; C.display();\n    cout<<” Id of D object is:”;\
    \ D.display();\n}\n```\n**输出：**\n`Id of A object is:100 Id of B object is:100\
    \ Id of C object is:100 Id of D object is:100`\n\n**解释：**\n- 在此程序中，每当调用带参数构造函数时，主程序都会传递值\
    \ `100`。\n- 现在，通过语句 `code B(A)`，可以将对象 `A` 中包含的数据拷贝到对象 `B` 中。\n- 这些数据可以通过引用被对象\
    \ `X` 接收。这里 `A` 应该作为实际参数，而 `x` 应该作为形式参数，也就是说对实际参数的更改应该反映在形式参数中，因为这是一个拷贝构造函数。\n\
    \n### 析构函数\n\n- 当对象不再被需要时，它可以被销毁。\n- 一个类可以有另一个特殊的成员函数，称为析构函数，它在对象被销毁时被调用。\n- 析构函数是一个具有字符\
    \ `~`（波浪号）后跟其类名和括号的成员函数。\n- 它应该如下声明：`~classname( );`。\n- 当对象超出作用范围且不再需要时，可以自动调用析构函数。\n\
    - 一般格式：\n```cpp\nclass classname\n{\n    …………\n    ………….. // 私有成员\npublic:\n \
    \   ~classname( ); // 析构函数原型或声明\n};\n\nclass name :: ~ classname( )\n{\n    //\
    \ 析构函数体定义\n}\n```\n\n#### 定义析构函数的规则：\n- 析构函数名与类名相同，但带有波浪号(`~`)。\n- 与构造函数不同，析构函数不接受任何参数。\n\
    - 析构函数没有构造函数那样的返回类型，因为它在对象超出作用范围时自动调用。\n- 析构函数必须声明在类的公共（public）部分，以便其所有用户访问。\n\
    - 每个类只能有一个析构函数。无法进行重载。\n\n示例程序：\n```cpp\n#include< iostream.h> \nint count =0;\n\
    \nclass test\n{\npublic: \n    test( );\n    ~test ( );\n};\n\ntest::test( )\n\
    {\n    count ++;\n    cout<< “object “<< count<<”constructor of test is called”:\n\
    }\n\ntest::~test( )\n{\n    cout<< “object “<< count<<” Destructor of test is\
    \ called”: count--;\n}\n\nvoid main()\n{\n    test x; // 构造函数调用\n    {\n     \
    \   test y; // 构造函数调用\n    }\n}\n```\n**输出：**\n`object 1 constructor of test is\
    \ called object 2 constructor of test is called object 2 destructor of test is\
    \ called object 1 destructor of test is called`\n\n在上述程序每当创建对象时，都会调用相应的构造函数。程序结束后，对象超出了范围(scope)，自动调用析构函数。\n\
    \n### 运行时内存分配/ NEW、DELETE 运算符\n\n- 每当定义数组时，编译时会设置指定数量的内存，这可能无法充分或不足。\n- 如果出现编译时未知所需内存的情况，可以在执行期间进行内存分配。\n\
    - 在在运行时分配内存的技术被称为动态内存分配。\n- C 提供了两个特殊运算符来执行内存管理：\n    - 用于动态内存分配的 `new` 运算符。\n\
    \    - 用于动态释放的 `delete` 运算符。\n\n#### new 运算符\n`new` 运算符为变量和对象提供动态内存分配。\n一般格式：`Pointer\
    \ variable = new datatype;`\n- 这里是 `datatype` 的指针。`New` 运算符为变量分配足够的内存。\n- 指针变量持有分配的内存地址。\n\
    - 示例：`p=new int; q= new float;` 其中 `p` 是 `int` 类型指针，`q` 是 `float` 类型。\n这里，`p`\
    \ & `q` 是指针变量，我们必须将其声明为指针变量：`int *p; float *q;`。\n可以将指针的声明和赋值组合：`int *p=new int;\
    \ float *q = new float;` 随后我们使用语句 `*p=32; *q=5.5;` 将 `32` 分配给新创建的 `int` 对象，将 `5.5`\
    \ 分配给 float 对象。\n\n带初始化的内存分配：`Pointer variable= new datatype(value);`\n示例：`int\
    \ *p=new int(32); float *q = new float(5.5);`。\n\n一维数组的内存分配：`Pointer variable=\
    \ new datatype [ size ];`\n示例：`int *p=new int[20];` 为 20 个整数的数组创建一个内存空间。`P[0]`\
    \ 指第一个元素，`p[1]` 指第二个，以此类推。\n\n示例：\n```cpp\nvoid main( )\n{\n    int n;\n    cout<<”enter\
    \ no of elements to be processed”; cin>>n;\n    int *pt= new int[  n];//运行时为变量\
    \ pt 分配空间\n    cout<<”enter  elements”;\n    for(int i=0;i<n;i++)\n    {\n   \
    \     cin>>pt[i];\n    }\n    cout<<”display elements”; for(int i=0;i<n;i++)\n\
    \    {\n        cout<<pt[i];\n    }\n}\n```\n**运行：**\n`enter no of elements to\
    \ be processed 5`\n`enter the elements 43 56 54 23 67`\n`display elements 43 56\
    \ 54 23 67`\n\n#### delete 运算符：\n当数据对象不再需要时，将其销毁以释放内存空间重用。\n一般格式：`delete pointer\
    \ variable;`\n`pointer variable` 是指向用 `new` 运算符创建的数据对象的指针。\n示例：`delete p; delete\
    \ q;`。\n如果我们想释放动态分配的数组，一般格式：`delete [size] pointer variable;` 其中 `size` 指定要释放的数组元素数量。\n\
    上述示例程序的示例：`delete [n] pt;`。\n\n#### this 指针：\n`this` 指针作为隐藏参数传递给所有非成员函数调用，并在所有非静态函数的体内作为局部变量可用。`this`\
    \ 指针是一个常量指针，持有当前对象的内存地址。`this` 指针在静态成员函数中不可，因为静态成员函数可以在没有对象（通过类名）的情况下调用。\n\n示例：\n\
    ```cpp\n#include<iostream.h> #include<conio.h>\nclass add\n{\n    int a; \npublic:\n\
    \    add(int x) { a=x; }\n    void sum() { this->a=this->a+4; }\n    void display()\
    \ { cout<<\"\\na=\"<<this->a; }\n};\n\nvoid main()\n{\n    clrscr();\n    add\
    \ ob(3);\n    ob.display();\n    ob.sum();\n    ob.display();\n    getch();\n\
    }\n```\n**输出：**\n`a=3 a=7`\n\n带返回返回的 this 指针：\n```cpp\n#include<iostream.h> #include<conio.h>\n\
    class add\n{\n    int a; \npublic:\n    add(int x) { a=x; }\n    add*  sum() {\
    \ this->a=this->a+4; return(this) }\n    void display() { cout<<\"\\na=\"<<this->a;\
    \ }\n};\n\nvoid main()\n{\n    clrscr(); add obj(3);\n    add *ob=&obj; ob->display();\
    \ ob=ob->sum(); ob->display();\n}\n```\n**输出：**\n`a=3 a=7`\n\n友元函数和友类\n\n"
- fmt: "\n## Definition\nThe function that are declared with the keyword `friend`\
    \ are called friend function, that is the common function to be made friendly\
    \ with both the classes, thereby allowing the function to have access to the private\
    \ data of those classes.\n\n## Special characteristics of friend function\n- The\
    \ scope of a `friend function` is not limited\n- A `friend function` cannot be\
    \ called using the object of that class\n- The `friend function` can access both\
    \ private and public data members\n- The `friend function` can be declared either\
    \ in private or public section without affecting it meaning.\n\nTo make an outside\
    \ function friendly to a class, we have to simply declare this function as a friend\
    \ of the class as shown below:\n\n```cpp\nclass ABC\n{\n……..\n……… public:\n……\n\
    …….\nfriend void display( ); //declaration;\n};\n```\n\n### Example\n```cpp\n\
    #include <iostream.h> \nclass sample\n{\n    int x,y; \npublic:\n    void getvalue()\n\
    \    {\n        x=50; y=40;\n    }\n    friend void display( sample a);\n};\n\n\
    void display( sample a)\n{\n    cout<<a. x<< b. y;\n}\n\nvoid main( )\n{\n   \
    \ ABC obj1;\n    obj1\\. getvalue( ); display( obj1);\n}\n```\nThe output of program\
    \ would be: 50 40\n\n- the function accesses the class variables `x` and `y` by\
    \ using the dot operator and the object passed to it.\n- The function call `display(obj1)`\
    \ passes the object `obj1` by value to the friend function.\n\n## Classes with\
    \ friend function\nConsider a situation of operating on objects of two different\
    \ classes, in such situation, friend function can be used to bridge the two classes.\n\
    \n### Example\n```cpp\n#include<iostream.h>\nclass result; //advance declaration\
    \ class test\n{\n    int n1,n2; \npublic:\n    void getmark( )\n    { \n     \
    \   n1=45; n2=78;\n    }\n    friend void display(  test,  result);// friend function\
    \  declaration\n};\n\nclass result\n{\n    int tot; \npublic:\n    friend  void\
    \  display(test,result);// friend function  declaration\n};\n\nvoid display( test\
    \ t, result r)\n{\n    ot=  t.n1+t.n2;// private member of test class accessed\
    \ using t objecr cout<<r.  tot;\n}\n\nvoid main(  )\n{\n    test t; result r;\n\
    \    t.getmark(  );\n    display( t,  r);\n}\n```\n\n### Explanation\n- The program\
    \ contains two classes `test` and `result`.\n- The `display` function is friend\
    \ function to access the private data members of both the classes.\n- Declaration\
    \ of the friend function can be placed either in the private or public section\
    \ of the class.\n- An object of each class has been passed as an argument to the\
    \ function `display()`.\n- It can access the private members of both classes through\
    \ these arguments.\n- The advanced declaration of the class `result;` in the beginning\
    \ of the program is necessary, since a class cannot be referred until it has been\
    \ declared before the class `test`.\n\n## Uses of friend function\n1. Function\
    \ operating on objects of two different classes.\n2. Friend function can be used\
    \ to increase the versatility of overloaded operators.\n\n## FRIEND CLASSES\n\
    ### Definition\nAll the functions of another class to manipulate or use the private\
    \ members of the friend class.\n\n### Example\n```cpp\n#include<iostream.h> \n\
    class two;\n\nclass one\n{\nprivate:\n    int x, y;\npublic:\n    void setdata(int\
    \ a, int b)\n    {\n        x=a; y=b;\n    }\n    friend class two;\n};\n\nclass\
    \ two\n{\n    int z; \npublic:\n    void addone(one obj)\n    {\n        z= obj.\
    \ x + obj . y;\n    }\n    void display(one obj )\n    {\n        cout<<”X is:\
    \ “<<obj.x<<”Y  is:”<<obj.y;\n        cout<< “sum of one class data members”<<\
    \ z;\n    }\n};\n\nvoid main( )\n{\n    one obj1; two obj2;\n    obj1\\. setdata(\
    \ 45,65); obj2. addone(obj1); obj2\\. display( obj1);\n}\n```\n**Run**\n```\n\
    X is:  45\nY is:  65\nsum of one class data members: 110\n```\n\n### Explanation\n\
    - Class `two` is friend to class `one`, so all the private members of class `one`\
    \ can be accessed in member function of class `two` using class `one` object.\n\
    - Here `addone()` and `display()` functions using the private data members of\
    \ class `one`. So both the functions are having argument as object of class `one`.\n\
    \n## Function overloading\n- It is possible to define several functions having\
    \ the same name, but performing different actions.\n- It helps in reducing the\
    \ need for unusual function name, making the code easier to read.\n- This can\
    \ be done using the concept of Function polymorphism or function overloading.\n\
    - Function overloading allows multiple functions to share the same name with different\
    \ argument type.\n- Function Polymorphism implies that the function definition\
    \ can have multiple forms. The definitions must only differ in number of arguments\
    \ and types of arguments.\n\n### Example: Multiple swap functions\n```cpp\n#include<iostream.h>\n\
    void swap(char x, char y)\n{\n    char  t=x;\n    x=y; y=t;\n    cout<<”Swapped\
    \ characters”<<x<<setw(5)<<y;\n}\n\nvoid swap(int x, int y)\n{\n    int t=x;\n\
    \    x=y; y=t;\n    cout<<”Swapped integers”<<x<<setw(5)<<y;\n}\n\nvoid swap(float\
    \ x, float y)\n{\n    float  t=x;\n    x=y; y=t;\n    cout<<”Swapped real numbers”<<x<<setw(5)<<y;\n\
    }\n\nvoid main()\n{\n    char a1,b1;\n    cout<<”Enter two characters”; cin>>a1>>b1;\n\
    \    swap(a1,b1);\n    int a2,b2;\n    cout<<”Enter two integers”; cin>>a2>>b2;\
    \ swap(a2,b2);\n    float a3,b3;\n    cout<<”Enter two real numbers”; cin>>a3>>b3;\n\
    \    swap(a3,b3);\n}\n```\n**Run:**\n```\nEnter two characters ET\nSwapped characters\
    \ T E\nEnter two integers\n20 30\nSwapped integers 30 20\nEnter two real numbers\
    \ 30.5 20.5\nSwapped real numbers 20.5 30.5\n```\n\n- In the above program, three\
    \ functions named `swap()` are defined, which only differ in their arguments data\
    \ type: `char`, `int`, or `float`. In `main()` when the statement `swap(a1,b1);`\
    \ is encountered, the compiler invokes the `swap()` function which takes character\
    \ type arguments. This decision is based on the data type of the arguments.\n\
    - C++ does not permit overloading of function differing only in their return value.\n\
    \n## Operator Overloading\n- Unlike C, in C++, such operators can also be overloaded\
    \ explicitly to operate on operand of user-defined types (i.e., objects of class).\n\
    - For instance, the statement `c3 = addcomplex(c1, c2);` performs the addition\
    \ of operands `c1` and `c2` belonging to the user defined data type and assigns\
    \ the result to `c3` (which is also operand of the user-defined data type).\n\
    - In C++, by overloading the `+` operator, the above statement can be changed\
    \ to an easily readable form: `c3 = c1 + c2;`.\n- Operator overloading, thus allows\
    \ to provide additional meaning to operators such as `+`, `*`, `>=`, `+=`, etc.,\
    \ when they are applied to user-defined data types.\n- The operator overloading\
    \ feature of C++ is one of the methods of realizing polymorphism.\n- The word\
    \ polymorphism is derived from the Greek word `poly` and `morphism` (polymorphism=poly+morphism).\n\
    - `Poly` refers to many or multiple and morphism refers to actions i.e., performing\
    \ many actions with a single operator.\n- The concept of operator overloading\
    \ can also be applied to data conversions.\n- C++ offers automatic conversion\
    \ of primitive data types.\n- For example, in the statement `x = a+b`, the compiler\
    \ implicitly converts the integer result to floating-point representation and\
    \ then assigns to the float variable `x`.\n- But, the conversion of user-defined\
    \ data types requires some effort on the part of the programmer.\n- Thus, operator\
    \ overloading concepts are applied to the following two principle areas:\n   \
    \ - Extending capability of operators to operate on user-defined data.\n    -\
    \ Data conversion.\n- Operator overloading extends the semantics of an operator\
    \ without changing its syntax.\n- The rules defined by C++ that governs its use\
    \ such as number of operands, precedence, and associativity of the operator remains\
    \ the same for overloaded operators.\n- Therefore, it should be remembered that\
    \ the overloaded operator should not change its original meaning.\n- However,\
    \ semantics (meaning) can be changed, but it is advisable to retain the predefined\
    \ logical-meaning.\n"
