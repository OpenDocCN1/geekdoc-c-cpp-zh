    ### 内联函数（Inline function）


    使用函数的主要目的是为了节省内存空间，然而每次函数被调用时，都需要花费额外的时间执行任务。为了解决这个问题，C++ 提出了一种新功能：内联函数。内联函数是在被调用时由编译器将函数调用替换为相应的代码。


    内联函数可以如下定义：

    ![](img/image346.jpeg)


    **示例：**

    ```cpp

    inline int cube(int a)

    {

    return (a*a*a);

    }

    ```

    上述内联函数可以通过语句调用：

    ```cpp

    c = cube(3);

    d = cube(2+2);

    ```

    对于 c 和 d，上述的输出分别为 27 和 64。


    要使函数变为内联，只需为函数定义加上 `inline` 关键字。所有内联函数必须在调用之前定义。记住，`inline` 关键字只是向编译器发送一个请求，而不是命令。如果函数定义过长或复杂，编译器可能会忽略此请求将其编译为普通函数。


    内联函数在某些情况下可能不起作用：


    *   对于返回值的函数存在循环、switch 或 goto。

    *   对于返回值的函数存在 return 语句。

    *   如果函数包含静态变量。

    *   如果内联函数是递归的。


    **示例程序：**

    ```cpp

    /*使用内联函数对不同数据类型进行乘法和平法的程序*/

    #include<iostream.h> #include<conio.h> class inlinefunc


    {

    int a,b; float c,d; public:

    void multiply(); void divide();

    };inline void inlinefunc::  multiply()

    {

    cout<<"Enter 2 integers:"; cin>>a>>b;

    int x=a*b; cout<<x;

    }


    inline void inlinefunc::divide()

    {

    }


    void main()

    {

    cout<<endl<<"Enter 2 float values:"; cin>>c>>d;

    float y=c/d; cout<<y;


    inlinefunc f; clrscr();

    f.multiply();

    f.divide();


    getch();

    }

    ```


