    ### Client-server Model


    A client seeks service whereas, a server provides services requested by a client
    In the above example the class `student` resembles a server whereas, objects of
    the class `student` resemble clients. They make call to the server by sending
    messages.


    In the statement

    ```cpp

    s2.setdata(10, “kumar”);

    ```


    The object `s2` seeks the messages `setdata` to the server with the parameter
    `10` and `kumar` and server accept the messages and perform the operation and
    display the result whenver the client called the `outdata( )` function.


    ### Defining member function


    The data members of a class must be declared within the body of the class, whereas
    the member functions of the class can be defined in any one of the following ways.


    *   Inside the class specification

    *   Outside the class specification


    The syntax of a member function definition changes depending on whether it is
    defined inside or outside the class specification, but it performs the same operation.


    #### (a) Member function inside the class body


    All the member functions defined within the body of a class. Eg:

    ```cpp

    Class classname


    {


    private:

    int age;

    int  setage(int  agein);//member  function

    {

    age  =  agein;//body of the  function

    }


    ……….. public:


    int b;

    void rect( )

    {

    . .  ...// body of a  function

    }


    };

    ```


    #### (b) Member functions outside the classbody


    To declare function prototype within the body of a class and then define it outside
    the body of a class. This is done by using the ‘scope resolution operator’ (`::`).
    It acts as an identity-label to inform the compiler, the class to which the function
    belongs.


    **Syntax:**

    ```cpp

    class classname


    {


    . . . .

    Returntype  memberfunction  (arguments);//function  declaration

    . . . .

    };


    returntype classname ::  memberfunction  (arguments)//function definition

    {

    //body of the function

    }

    ```


    ### Accessing member functions within the class


    A member of a class is accessed by the objects of that class using the dot operator.


    **Ex:**

    ```cpp

    #include <iostream.h> class number


    {


    int  num1, num2;//private by default public:

    void read( )

    {

    cout<<”Enter first number: “); cin>>num1;

    cout<<”Enter second number: “); cin>>num2;

    }


    int max( )

    {

    if(num1>num2)

    return num1;

    else

    }

    return num2;

    //Nesting of member function void showmax( )

    {

    cout<<”maximum = “<<max( ) ;

    }


    };


    void main( )


    {

    }

    ```


    **Output:**

    ```

    number n1; n1.read( );

    n1.showmax( );

    Enter first number : 5 Enter second number : 10 Maximum =  10

    ```


    This a member function of a class can call any other member function of its own
    class is called ‘nesting of member function’.


    ### Data Hiding


    Data is hidden inside a class, so the unauthorized access is not possible, which
    is the key feature of OOP.


    All the data and functions defined in a class are private by default. Normally
    the data members are declared as private and member functions are declared as
    public.


    **Methods of Data hiding:**


    *   Private

    *   Public

    *   Protected


    These keywords are called access-control specifiers.


    #### Private members:


    In this only the member functions of the same class can access these members.

    The private members of a class are inaccessible outside the class.


    ```cpp

    Class person


    {

    private:

    int age;//private data int  getage(  )://private  function

    . . .  .

    }


    person p1;

    a  =  p1.age;//cannot access private data //error p1.getage(  );//Error  access

    ```

    ie., we can access the private members by using objects.


    #### Protected member:


    The access control of the protected members is similar to that of private members.

    The access control of protected members is shown below:


    ```cpp

    Class person


    {

    protected:

    . . .  .

    int age;// protected data int  getage(  )://protected  function

    . . .  .

    };

    ```

    ![](Images/image01345.jpeg)

    `person p1; a = p1.age;` `p1.getage( );`


    #### Public Members


    Cannot access protected members

    All data members and function declared in the public section of the class can
    be accessed without any restriction from anywhere in the program.


    **Eg:**

    ```cpp

    Class person{

    public:

    }

    int age;//public  data

    int  getage(  );//public  function

    person p1;

    a  =  p1.age;// can access public data p1.getage(  );// can access public  function

    ```


    ### Nesting of member function


    A member function of a class can be called only by an object of that class using
    a dot operator. In nesting of member function, the member function can be called
    by using its name inside another member function of the same class is called nesting
    member function.


    Consider the following example:

    ```cpp

    #include <iostream.h>

