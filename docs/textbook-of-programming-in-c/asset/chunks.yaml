  trans: "\n空类的声明如下：\n\n```cpp\nClass xyz\n{\n\n};\n\nClass abc\n{\n\n};\n```\n\n\
    此类空类也称为存根（stubs）。它们用于创建类模板。\n\n## 传递对象参数：\n\n* 可以存在接受类对象作为参数的函数，就像存在接受其他变量作为参数的函数一样。\n\
    *可以通过以下方式将对象作为参数传递给函数： \n    1. 按值传递对象：将整个对象的拷贝传递给函数。\n    2. 按引用传递对象：仅将对象的地址隐式地传递给函数。\n\
    \    3. 按指针传递对象：将对象的地址显式地传递给函数。\n\n### 按值传递对象\n\n在这种情况下，对象的拷贝被传递给函数，在函数内部对对象进行的任何修改都不会反映在调用该函数的对象上。\n\
    \n示例： \n```cpp\n#include<iostream.h> \nclass test\n{\n    int m1,m2; \n    public:\n\
    \    void get()\n    {\n        cin>>m1>>m2;\n    }\n    void read(test t3)\n\
    \    {\n        m1=t3.m1; m2=t3.m2;\n    }\n    void display()\n    {\n      \
    \  cout<<m1<<m2;\n    }\n};\n\nvoid main()\n{\n    test t1;\n    cout<<”Enter\
    \ Ist object data”; t1.get();\n    cout<<”display Ist object data”; t1.display();\n\
    \    test t2;\n    cout<<”copy of object1 to object2”; t2.read(t1);\n    cout<<”display\
    \ 2nd object data”; t2.display();\n}\n```\n\n运行：\n```\nEnter Ist object data 34\n\
    56\ndisplay Ist object data 34\n56\ncopy of object1 to object2 display 2nd object\
    \ data 34\n56\n```\n\n`t1` 的成员被拷贝到 `t2` 中。对对象 `t1` 和 `t2` 数据成员所做的任何修改对于调用者的实际参数都是不可见的。\n\
    \n### 按引用传递对象：\n\n按引用传递的对象的访问性与按值传递的对象相似。在调用函数中对此类对象进行的修改也会反映在调用函数中。\n\n示例： \n\
    ```cpp\n#include<iostream.h> \nclass test\n{\n    int m1,m2; \n    public:\n \
    \   void get()\n    {\n        cin>>m1>>m2;\n    }\n    void read(test &t3)\n\
    \    {\n        m1=t3.m1; m2=t3.m2;\n    }\n    void display()\n    {\n      \
    \  cout<<m1<<m2;\n    }\n};\n\nvoid main()\n{\n    test t1;\n    cout<<”Enter\
    \ Ist object data”; t1.get();\n    cout<<”display Ist object data”; t1.display();\n\
    \    test t2;\n    cout<<”copy of object1 to object2”; t2.read(t1);\n    cout<<”display\
    \ 2nd object data”; t2.display();\n}\n```\n\n运行：\n```\nEnter Ist object data 34\n\
    56\ndisplay Ist object data 34\n56\ncopy of object1 to object2 display 2nd object\
    \ data 34\n56\n```\n\n## 构造函数\n\n* 构造函数是一个特殊的成员函数，用于初始化对象数据成员并为它们分配必要的资源。\n* 构造构造函数需要遵循的规则：\n\
    \    1. 构造函数应该声明在 `public` 区域。\n    2. 它们在对象创建时被自动调用。\n    3. 它们没有返回值类型，甚至不允许使用\
    \ `void`。\n    4. 它的名称与它所属的类名相同。\n\n### 语法\n\n```cpp\nclass classname\n{\n   \
    \ …………\n    ………… \n    public: \n    classname()\n    {\n        //构造函数体\n   \
    \ }\n};\n```\n\n### 构造函数的类型\n\n1. 默认构造函数\n2. 参数构造函数\n3. 拷贝构造函数\n\n### 默认构造函数：\n\
    \n不显式接受参数的构造函数被称为默认构造函数。\n\n示例：\n```cpp\n#include<iostream.h> \nclass test\n{\n\
    \    int m1,m2; \n    public: \n    test()\n    { \n        m1=50; m2=25;\n  \
    \  }\n    void display()\n    {\n        cout<<m1<<m2;\n    }\n};\n\nvoid main()\n\
    {\n    test t1; //调用默认构造函数 \n    cout<<”Initialized data members”; t1.display();\n\
    }\n```\n\n运行：\n```\nInitialized data members\n50 25\n```\n\n### 参数构造函数：\n\n构造函数可以带参数被调用。参数列表可以在大括号内指定，类似于函数中的参数列表。带参数的构造函数被称为参数化构造函数。\n\
    \n示例：\n```cpp\n#include<iostream.h> \nclass test\n{\n    int m1,m2; \n    public:\n\
    \    test(int,int);//构造函数声明 \n    void display()\n    {\n        cout<<m1<<m2;\n\
    \    }\n};\n\ntest::test(int x,int y)//构造函数定义\n{\n    m1=x; m2=y;\n}\n\nvoid main()\n\
    {\n    test t1(50,100);//参数化构造函数调用 \n    test t2(80,90);\n    cout<<”Initialized\
    \ data members”; t1.display();\n    cout<<”Initialized data members”; t2.display();\n\
    }\n```\n*(注：原文示例中 main 函数逻辑略有错乱，此处已根据语意翻译并对齐结构)*\n\n由于原文文本中存在部分重复和格式错乱，已根据您的要求对提供的英文文本进行了逻辑翻译，并保留了所有\
    \ Markdown 格式。\n\n"
- fmt: "\nThus the constructor is called during the creation of an object depending\
    \ on the number and type of arguments passed.\n\nThe invocation of different constructors\
    \ during the creation of an object of the class `account` is:\n\n```cpp\nclass\
    \ account\n{\npublic:\n    account(); account(int an);\n    account(int acvalue,float\
    \ bal);\n………………\n};\n```\n\n`accout acc1; account acc2(45); account acc3(324,675.50);`\n\
    \n### Copy constructor:\n\n- A copy constructor is used to declare and initialize\
    \ an object from another object (ie, all the data’s should be copied from one\
    \ object to another object).\n- For example: `integer obj2(obj1);`. The above\
    \ statement defines the object `obj2` and at the same time initializes or copies\
    \ the values of ‘obj1’.\n- Another form of this statement is `Integer obj2=obj1;`.\n\
    - The process of initializing through a copy constructor is known as copy initialization.\n\
    - “A copy constructor takes a reference to an object of the same class as itself\
    \ as an argument.”\n- Example:\n```cpp\n#include<iostream.h> \nclass code\n{\n\
    \    int id; \npublic:\n    code() {}\n    code( int a) { id=a; }\n    code( code\
    \ &x) { id=x.id; }\n};\n\nvoid main( )\n{\n    code A(100); code B(A); code C=A;\
    \ code D; D=A;\n    cout<<” Id of A object is:”; A.display();\n    cout<<” Id\
    \ of B object is:”; B.display();\n    cout<<” Id of C object is:”; C.display();\n\
    \    cout<<” Id of D object is:”; D.display();\n}\n```\n**Output:**\n`Id of A\
    \ object is:100 Id of B object is:100 Id of C object is:100 Id of D object is:100`\n\
    \n**Explanation:**\n- In this program the main program pass the value `100` whenever\
    \ the single parameterized constructor is called.\n- Now the data’s contained\
    \ in the object `A` can be copied into the object `B` by the statement of `code\
    \ B(A)`.\n- This data can be received by the object `X` through the reference.\
    \ Here `A` should be act as actual parameter and `x` should be act as a formal\
    \ parameter, that is the change should be made on actual argument reflect in formal\
    \ argument , because it will be a copy constructor.\n\n### DESTRUCTOR\n\n- When\
    \ an object is no longer needed it can be destroyed.\n- A class can have another\
    \ special member function called destructor, which is called when the object is\
    \ destroyed.\n- Destructor is a member function having the character `~` (tilde)\
    \ followed by the name of its class and brackets.\n- It should be declared as\
    \ follows: `~classname( );`.\n- The destructor can be called automatically when\
    \ the object goes out of scope and is no longer needed.\n- General format:\n```cpp\n\
    class classname\n{\n    …………\n    ………….. // private members\npublic:\n    ~classname(\
    \ ); // destructor prototype or declaration\n};\n\nclass name :: ~ classname(\
    \ )\n{\n    // destructor body definition\n}\n```\n\n#### Rules for defining the\
    \ destructor:\n- The destructor name is same as the class name but prefixed by\
    \ a tilde(`~`).\n- Unlike constructor, destructor does not take any arguments.\n\
    - The destructor has no return type like the constructor, since it is invoked\
    \ automatically whenever the object goes out of scope.\n- Destructor must be declared\
    \ in the public section of a class, so that it is accessible to all its users.\n\
    - There can be only one destructor in each class. The overloading is not possible.\n\
    \nExample Program:\n```cpp\n#include< iostream.h> \nint count =0;\n\nclass test\n\
    {\npublic: \n    test( );\n    ~test ( );\n};\n\ntest::test( )\n{\n    count ++;\n\
    \    cout<< “object “<< count<<”constructor of class test is called”:\n}\n\ntest::~test(\
    \ )\n{\n    cout<< “object “<< count<<” Destructor of class test is called”: count--;\n\
    }\n\nvoid main()\n{\n    test x; // constructor called\n    {\n        test y;\
    \ //constructor called\n    }\n}\n```\n**Output:**\n`object 1 constructor of class\
    \ test is called object 2 constructor of class test is called`\n`object 2 destructor\
    \ of class test is called object 1 destructor of class test is called`\n\n**Explanation:**\n\
    In this above program whenever the object is created the corresponding constructor\
    \ can be invoked. After terminating the program that is the object is out of the\
    \ range(scope) than automatically the destructor is called.\n\n### DYNAMIC OR\
    \ RUN TIME MEMORY ALLOCATION/ NEW, DELETE OPERATORS\n\n- Whenever an array is\
    \ defined, a specified amount of memory is set aside at compile time, which may\
    \ not be utilized fully or may not be sufficient.\n- If a situation arises in\
    \ which the amount of memory required is unknown at compile time, the memory allocation\
    \ can be performed during execution time.\n- Such a technique of allocating memory\
    \ during run time is known as Dynamic memory allocation.\n- C provides following\
    \ two special operators to perform memory management:\n    - `new` operator for\
    \ dynamic memory allocation.\n    - `delete` operator for dynamic deallocation.\n\
    \n#### new Operator:\nThe `new` operator offers dynamic memory allocation for\
    \ variable and object.\nGeneral format: `Pointer variable = new datatype;`\n\n\
    - Here, `pointer variable` is a pointer of type `datatype`.\n- `New` operator\
    \ allocates sufficient memory for the variable.\n- The pointer variable holds\
    \ address of the memory space allocated.\n- Example: `p=new int; q= new float;`\
    \ where `p` is a pointer of type `int` and `q` is a pointer of type `float`.\n\
    Here, `p` & `q` are pointer variable we must declare it as a pointer variable:\
    \ `int *p; float *q;`.\nWe can combine the declaration of pointer and their assignment\
    \ as: `int *p=new int; float *q = new float;` subsequently we have use statements:\
    \ `*p=32; *q=5.5;` assign `32` to the newly created `int` object and `5.5` to\
    \ the float object.\n\nAllocating memory along with initialization is: `Pointer\
    \ variable= new datatype(value);`.\nExample: `int *p=new int( 32); float *q =\
    \ new float(5.5);`.\n\nMemory allocation for one dimensional array is: `Pointer\
    \ variable= new datatype [ size ];`.\nExample: `int *p=new int[20];`. It will\
    \ creates a memory space for an array of 100 integers. `P[0]` refers to the first\
    \ element, `p[1]`, to the second, and so, on.\n\nExample:\n```cpp\nvoid main(\
    \ )\n{\n    int n;\n    cout<<”enter no of elements to be processed”; cin>>n;\n\
    \    int *pt= new int[  n];// run time allocates space for array variable pt\n\
    \    cout<<”enter the  elements”;\n    for(int i=0;i<n;i++)\n    {\n        cin>>pt[i];\n\
    \    }\n    cout<<”display elements”; for(int i=0;i<n;i++)\n    {\n        cout<<pt[i];\n\
    \    }\n}\n```\n**Run:**\n`enter no of elements to be processed 5`\n`enter the\
    \ elements 43 56 54 23 67`\n`display elements 43 56 54 23 67`\n\n#### delete Operator:\n\
    When data object is no longer needed, it is destroyed to release the memory space\
    \ fro reuse.\nGeneral format: `delete pointer variable;`\nThe `pointer variable`\
    \ is the pointer that points to a data object created with `new` operator.\nExample:\
    \ `delete p; delete q;`.\nIf we want to free a dynamically allocated array, the\
    \ general format: `delete [size] pointer variable;` where the `size` specifies\
    \ the number of elements in the array to be freed.\nExample for the above example\
    \ program: `delete [n] pt;`.\n\n#### ‘this’ pointer:\nThe `this` pointer is passed\
    \ as a hidden argument to all nonstatic member function calls and is available\
    \ as a local variable within the body of all nonstatic functions. `this` pointer\
    \ is a constant pointer that holds the memory address of the current object. `this`\
    \ pointer is not available in static member functions as static member functions\
    \ can be called without any object (with class name).\n\nExample:\n```cpp\n#include<iostream.h>\
    \ #include<conio.h>\nclass add\n{\n    int a; \npublic:\n    add(int x) { a=x;\
    \ }\n    void sum() { this->a=this->a+4; }\n    void display() { cout<<\"\\na=\"\
    <<this->a; }\n};\n\nvoid main()\n{\n    clrscr();\n    add ob(3);\n    ob.display();\n\
    \    ob.sum();\n    ob.display();\n    getch();\n}\n```\n**Output:**\n`a=3 a=7`\n\
    \n‘this’ pointer with return:\n```cpp\n#include<iostream.h> #include<conio.h>\n\
    class add\n{\n    int a; \npublic:\n    add(int x) { a=x; }\n    add*  sum() {\
    \ this->a=this->a+4; return(this) }\n    void display() { cout<<\"\\na=\"<<this->a;\
    \ }\n};\n\nvoid main()\n{\n    clrscr(); add obj(3);\n    add *ob=&obj; ob->display();\
    \ ob=ob->sum(); ob->display(); getch();\n}\n```\n**Output:**\n`a=3 a=7`\n\nFRIEND\
    \ FUNCTIONS AND FRIEND  CLASSES\n"
