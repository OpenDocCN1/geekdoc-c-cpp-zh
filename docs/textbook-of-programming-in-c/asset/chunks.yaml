    }

    ```


    ### Arrays within a class


    The arrays can be used as member variables in a class. That is more than one related
    variable or data are grouped under the common name,


    **Eg:**

    ```cpp

    Class abc

    {

    int a[size]//a is name of the array size – represents the size of the array public:

    void setdata(void); void display(void);

    };

    ```


    ### Inline function


    One of the objective of using functions in a program is to save some memory space,
    which becomes appreciable when a function is called many times. However, every
    time a function is called, it takes a lot of extra time in executing tasks such
    as jumping to the function, saving registers, pushing arguments into the stack
    and returning to the calling function. C++ has a solution to this problem. To
    eliminate the cost of calls function C++ proposes a new feature called inline
    function. An inline function is a function that is expanded in line when it is
    invoked.That is,the compiler replaces the function call with the corresponding
    code.


    An inline function can be defined as below:

    ![](Images/image1346.jpeg)


    **Example:**

    ```cpp

    inline int cube(int a)

    {

    return (a*a*a);

    }

    ```

    The above inline function can be invoked by the statement like:

    ```cpp

    c = cube(3);

    d = cube(2+2);

    ```

    The output of the above statements will be 27 and 64 for c and d respectively.


    To make the function inline, just prefix the keyword `inline` to the function
    definition. All inline functions must be defined before they are called. Remember
    that the `inline` keyword merely sends a request, not a command to the compiler.
    The compiler may ignore this request if the function definition is too long or
    complicated and compile the function as a normal function.


    Some of the situations where the inline function may not work are:


    *   For functions returning values, if a loop, a switch, or a goto exists.

    *   For functions not returning values, if a return statement exists.

    *   If a function contains static variables.

    *   If inline function are recursive.


