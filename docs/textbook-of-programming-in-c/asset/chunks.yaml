    \ return 0;\n\n}\n\n*   Input and  output:\n\n    *   >> Extraction operator for\
    \ reading  input\n\n    *   << Insertopm operator for printing the  output\n\n\
    \        *   Eg:cin>>  a;\n\ncout<<a;\n\n*   Scope resolution  operator:\n\nThe\
    \ scope resolution operator helps to identify and specify the context to which\
