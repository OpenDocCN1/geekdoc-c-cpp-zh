    \n    void calculate()\n    {\n        sum=a+b;;\n    }\n};\n\nclass derived:\
    \ public base//derived class\n{//base class is publicly inherited\npublic:\n \
    \   void putdata()\n    {\n        cout<<”the sum value is:”<<sum;\n    }\n};\n\
    \nvoid main()\n{\n    clrscr();\n    derived d;//object of derived class d.getdata();\n\
    \    d.calculate(); d.putdata();\n    getch();\n}\n```\n\n输出：\n```\nenter sales\
    \ values for a and b 58\nthe sum value is:13\n```\n\n### 程序说明：\n\n* 在上述的示例中，我们定义了\
    \ `base` 为基类，`derived` 为派生类，其中其可见性模式为 `public`。\n* 这样公有数据就可以被派生类继承，就像是它自己的类的公数据一样。\n\
    * 在此继承中，没有必要同时创建基类和派生类的对象。\n* 相反，我们可以只创建一个派生类的对象。\n* 我们可以通过该派生类对象调用派生类和基类的所有成员函数。\n\
    \n# 多重继承\n\n* ![](img/image01370.jpeg)拥有多个基类的派生类称为多重继承\n\n超类（父类 2）\n子类（子类）\n\n\
