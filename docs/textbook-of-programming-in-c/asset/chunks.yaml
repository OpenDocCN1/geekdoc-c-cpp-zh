    \n- `<vector>`: one-dimensional array\n- `<list>`: double linked list\n- `<deque>`:\
    \ double-ended queue\n- `<queue>`: queue\n- `<stack>`: stack\n- `<set>`: set\n\
    - `<map>`: associative array\n\n### i) Sequence Containers\n\nA sequence container\
    \ stores a set of elements in sequence, in other words each element (except for\
    \ the first and last one) is preceded by one specific element and followed by\
    \ another, `<vector>`, `<list>` and `<deque>` are sequential containers.\n\n###\
    \ ii) Associative Containers\n\nAn associative container is non-sequential but\
    \ uses a `key` to access elements. The keys, typically a number or a string, are\
    \ used by the container to arrange the stored elements in a specific order, for\
    \ example in a dictionary the entries are ordered alphabetically.\n\n- A `<set>`\
    \ stores a number of items which contain keys. The keys are the attributes used\
    \ to order the items, for example a set might store objects of the class `Person`\
    \ which are ordered alphabetically using their name.\n- A `<map>` stores pairs\
    \ of objects: a key object and an associated value object. A `<map>` is somehow\
    \ similar to an array except instead of accessing its elements with index numbers,\
    \ you access them with indices of an arbitrary type.\n\n### iii) Adaptor Containers\n\
    \nContainer adapters are just special containers that use the general framework\
    \ of the containers, iterators, and algorithms provided by the STL.\n\n![](Images/image01394.jpeg)\n\
    \n## Algorithms\n\nA range is any sequence of objects that can be accessed through\
    \ iterators or pointers, such as an array or an instance of some of the [STL containers](http://www.cplusplus.com/stl).\
    \ Notice though, that algorithms operate through iterators directly on the values,\
    \ not affecting in any way the structure of any possible container (it never affects\
    \ the size or storage allocation of the container). The types of algorithms are:\n\
    \nI. **Non-mutating Algorithm**: Some of the methods are:\n1. `count()`\n2. `equal()`\n\
    3. `find()`\n4. `find_end()`\n5. `find_if()`\n6. `search()`\n\nII. **Mutating\
    \ Algorithm**: Some of the methods are:\n1. `copy()`\n2. `fill()`\n3. `generate()`\n\
    4. `remove()`\n5. `replace()`\n6. `reverse()`\n7. `unique()`\n\nIII. **Sorting\
    \ algorithm**: Some of the methods are:\n1. `binary_search()`\n2. `equal_range()`\n\
    3. `merge()`\n4. `sort()`\n5. `partial_sort()`\n6. `Partition()`\n\nIV. **Set\
    \ algorithms**:\n1. `include()`\n2. `set_difference()`\n3. `set_intersection()`\n\
    4. `set_union()`\n\nV. **Relational alogorithm**: Some of the methods are:\n1.\
    \ `equal()`\n2. `max()`\n3. `max_element()`\n4. `min()`\n5. `min_element()`\n\
    6. `mismatch()`\n\nLet us the example of using vector template for showing the\
    \ working of Containers, Iterators and Algorithms.\n\n![](Images/image01395.jpeg)\n\
    \n```cpp\n#include <vector>\n#include <iostream>\n\nvector<int> v(3);  // create\
