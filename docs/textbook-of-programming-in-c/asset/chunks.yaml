    implicit operand and the second operand must be passed as an argument  explicitly.


    3. The data members of the first object are accessed without using the dot operator.


    4. Whereas, the second argument members can be accessed using the dot operator
    if the argument is object, otherwise it can be accessed directly.


    Note  that, the overloaded binary operator function is a member function defined
    in the first object’s  class.


    For example:


    *   Consider the following  expression:


    C = A  +  B;//arithmetic  notation


    o The above expression contains three objects namely A, B and C of which A and
