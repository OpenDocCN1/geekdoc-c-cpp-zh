    \ three models; the information model, the state model, and the process model.\
    \ The information model contains objects, variables, and all the relationships\
    \ between the objects, and is basically a data model for the system. The state\
    \ model records the different states of objects and changes that can occur between\
    \ the objects. The process model is really not much more than a traditional data\
    \ flow  diagram.\n\nNow that we have covered the basics of the object approach,\
    \ let's take a look at how a real-world object is created by using these techniques.\n\
    \n The Object-Oriented Design  Model\n\nOne object-oriented methodology is based\
    \ around the re-use of development modules and components. As such, a new development\
    \ model is required that takes this re-use into account. The object-oriented model\
    \ as shown in Figure 1.15, “The Object-Oriented Design Model” builds integration\
    \ of existing software modules into the system development. A database of reusable\
    \ components supplies the components for re-use. The object-oriented model starts\
    \ with the formulation and analysis of the problem. The design phase is followed\
    \ by a survey of the component library to see if any of the components can be\
    \ re-used in the system development. If the component is not available in the\
    \ library then a new component must be developed, involving formulation, analysis,\
    \ coding and testing of the module. The new component is added to the library\
    \ and used to construct the new  application.\n\nThis model aims to reduce costs\
    \ by integrating existing modules into development. These modules are usually\
    \ of a higher quality as they have been tested in the field by other clients and\
    \ should have been debugged. The development time using this model should be lower\
    \ as there is less code to  write.\n\nFigure 1.15\\. The Object-Oriented Design\
    \ Model\n\n![](Images/image01399.jpeg)\n\nThe object-oriented model should provide\
    \ advantages over the other models as the libary of components grows over time.\n\
    \nAn Example Design  Problem                                                         \n\
    \nTask: If we were given the problem; “Write a program to implement a simple savings\
    \ account”… The account should allow deposits, withdrawals, interest and  fees.\n\
    \nSolution: The problem produces many concepts, such as bank account, deposit,\
    \ withdrawal, balance etc.. that are important to understand. An OO language allows\
    \ the  programmer to  bring  these concepts  right  through  to  the coding  step.\
    \ The\n\nsavings account may be built with the properties of an account number\
    \ and balance and with the methods of deposit and withdrawal, in keeping with\
    \ the concept of the bank account. This allows an almost direct mapping between\
    \ the design and the coding stages, allowing code that is easy to read and understand\
    \ (reducing maintenance and development costs).\n\nOOP also allows software re-use!\
    \ … The concept of this savings account should be understood, independent of the\
    \ rest of the problem. This general savings account  will certainly find re-use\
    \ in some other financial  problem.\n\nSo after discussion with the client, the\
    \ following formulation could be achieved - Design a banking system that contains\
    \ both teller and ATM interaction with the  rules:\n\n• The cashiers and ATMs\
    \ dispense  cash.\n\n• The network is shared by numerous  banks.\n\n• Each transaction\
    \ will involve an account and  documentation.\n\n• There are different types of\
    \ bank  accounts.\n\n• There are different kinds of  transactions.\n\n• All banks\
    \ use the same  currency.\n\n• Foreign currency transactions are permitted.\n\n\
    • ATMs and tellers require a cash  card.\n\nStep 1\\. Identify Possible Classes\n\
    \n• ATM, cashier, cashier station, software, customer,  cash.\n\n• banking network,\
    \  bank.\n\n• transaction, transaction  record.\n\n• account, deposit account,\
    \ long term savings account, current  account.\n\n• withdrawal, lodgement,  cheque.\n\
    \n• currency.\n\n• foreign currency, euro  cheque.\n\n• cash card, computer  system.\n\
    \nStep 2\\. Remove Vague Classes\n\n• software, computer system,  cash.\n\nStep\
    \ 3\\. Add New classes that arise!\n\n• currency  converter\n\nStep 4\\. Create\
    \  Associations\n\n• Banking Network (includes cashiers and  ATMs)\n\n• Banks\
    \ (holds  accounts)\n\n• Account ( has a balance, a currency, a log of  transactions)\n\
    \n• Transaction (requires a cash  card)\n\n• Lodgement (has an account number,\
    \ an amount)\n\n• Withdrawal (has an account number, an  amount)\n\n• Cheque (\
    \ is a withdrawal, has a payee, an  amount)\n\n• Eurocheque (is a cheque, has\
    \ a currency)\n\n• ATMs (accept cashcards, dispenses  cash)\n\nStep 5\\. Refine\
    \ the Classes\n\nBank:\n\n• has a  name\n\n• has accounts\n\n• has a base  currency\n\
    \n• has a sort  code\n\nAccount:\n\n• has an  owner\n\n• has a  balance\n\n• has\
    \ an account  number\n\n• has a log of  transactions\n\nDeposit Account:\n\n•\
    \ is an  account\n\n• has a shared interest  rate\n\nCurrent Account:\n\n• is\
    \ an  account\n\n• has an overdraft  limit\n\nTransaction:\n\n• has an  account\n\
    \n• has a  date\n\n• has a  value\n\n• has a  bank\n\n• has an account  Number\n\
    \n• has a  number\n\nWithdrawal:\n\n• is a  transaction\n\nLodgement:\n\n• is\
    \ a  transaction\n\nCheque:\n\n• is a  withdrawal\n\n• has a  payee\n\nEuroCheque:\n\
    \n• is a  cheque\n\n• has a  currency\n\nCurrencyConverter:\n\nStep 6\\. Visual\
    \ Representation of the Classes\n\n![](Images/image01400.jpeg)Figure  1.16.  TheBank\
    \  class.\n\n![](Images/image01401.jpeg)\n\n![](Images/image01400.jpeg)Figure\
    \  1.17.  TheAccount  class.\n\n![](Images/image01402.jpeg)\n\n![](Images/image01400.jpeg)Figure\
    \  1.18.  TheTransaction  class.\n\n![](Images/image01403.jpeg)\n\n COMPONENT\
    \  SOFTWARE:\n\n(How to represent ‘components’ in object-oriented  design?  Explain.)\n\
    \nThe breakdown of a project into its logical components is the essence of object-oriented\
    \ analysis and design. That's also the basis for component software, which is\
    \ composed of reusable pieces of software in binary form (as opposed to source\
    \ code) that can be plugged into components from other vendors with relatively\
    \ little effort. It is important to realize that a component-based approach to\
    \ software development does not dictate the structure of an application. Rather,\
    \ it is a model that makes possible the programming, use, and independent evolution\
    \ of binary software components. Components are independent of the applications\
    \ that use them as well as the programming languages used to create  them.\n\n\
    Software components can be divided into a variety of categories, including visual\
    \ components, such as buttons or list boxes, and functional components, such as\
    \ ones that add printing or spell checking capability. For example, a component-based\
    \ architecture might enable spell checker components from multiple vendors to\
    \ be plugged into a single word processing program from another vendor. This would\
    \ hold many advantages for the end user. A user might love the word processor\
    \ produced by company A but hate the spell checker it comes with. If the word\
    \ processor was designed so that the spell checker component can be replaced,\
    \ the user can purchase a spell checker from company B, which specializes in creating\
    \ spell checkers. Component software enables software developers to specialize\
    \ in what they do best."
