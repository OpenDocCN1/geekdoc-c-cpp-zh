  trans: "\n\nC/C++ 的 IO 基于流（streams），流是流进和流出程序的一系列字节（就像水和油在管道中流动一样）。在输入操作中，数据字节从输入源（如键盘、文件、网络或另一个程序）流入程序。在输出操作中，数据字节从程序流向输出汇（如控制台、文件、网络或另一个程序）。流在程序和实际\
    \ IO 设备之间充当中介，通过这种方式使程序员无需处理实际的设备，从而实现与设备无关的 IO 操作。\n\n![](img/image01382.jpeg)\n\
    \nC++ 同时提供了格式化 IO 和非格式化 IO 函数。在格式化（或高级级）IO 中，字节被分组并转换为 `int`、`double`、`string`\
    \ 或用户定义类型。在非格式化（或低级）IO 中，字节被视为原始字节且不进行转换。格式化 IO 操作通过重载流插入运算符（`<<`）和流提取运算符（`>>`）来实现，这提供了一个一致的公共\
    \ IO 接口。\n\n要执行输入和输出，C++ 程序需要：\n\n1. 构造一个流对象。\n2. 将流对象连接（关联）到实际 IO 设备（例如：键盘、控制台、文件、网络、另一个程序）。\n\
    3. 通过流公共接口中定义的函数以与设备无关的方式执行输入/输出操作。某些函数在外部格式和内部格式之间转换数据（格式化 IO）；而另一些则不转换（非格式化或二进制\
    \ IO）。\n4. 将流与实际 IO 设备分离（例如：关闭文件）。\n5. 释放流对象。\n\n## iostream 库包含\n\n- `<iostream.h>`：包含\
    \ `cin`、`cout`、`cerr` 和 `clog` 对象\n- `<iomanip.h>`：包含参数化流操纵符\n- `<fstream.h>`：包含用户控制的文件处理操作关重要的信息\n\
    \n## ios 基类\n\n`istream` 和 `ostream` 继承自 `ios`。`iostream` 继承自 `istream` 和 `ostream`。\n\
    \n- `<<`（左移运算符）\n    - 重载为流插入运算符\n- `>>`（右移运算符）\n    - 重载为流提取运算符\n    - 这两个运算符均与\
    \ `cin`、`cout`、`cerr`、`clog` 以及用户定义的流对象一起使用\n\n### istream: 输入流\n\n```cpp\ncin\
    \ >> someVariable;\n```\n- `cin` 知道要给 `someVariable` 分配什么类型的数据（基于 `someVariable`\
    \ 的类型）。\n\n### ostream: 输出流\n\n```cpp\ncout << someVariable;\n```\n- `cout` 知道输出的数据类型。\n\
    ```cpp\ncerr << someString;\n```\n- 无缓冲 - 立即打印 `someString`。\n```cpp\nclog <<\
    \ someString;\n```\n-缓冲 - 当输出缓冲区满或刷新时立即打印 `someString`。\n\n### ostream: 执行格式化和非格式化输出\n\
    \n- 使用 `put()` 处理字符，使用 `write()` 处理非格式化字符。\n- 输出十进制、八进制和十六进制的数字。\n- 为浮点数设置不同的精度。\n\
    - 格式化文本输出\n\n![](img/image01383.jpeg)\n\n`cin.get()`：从流输入一个字符（甚至是空白字符）并返回它。\n\
    `cin.get(c)`：从流输入一个字符并存储在 `c` 中。\n\n## 非格式化输入/输出函数\n\n### put()`, `get()` 和 `getline()`\n\
    \n`ostream` 的成员函数 `put()` 可用于输出一个 `char`。`put()` 返回调用的 `ostream` 引用，因此可以级联调用。例如：\n\
    \n```cpp\n// ostream 类\nostream & put (char c); // 向 ostream 放入字符 c\n\n// 示例\n\
    cout.put('A');\ncout.put('A').put('p').put('p').put('\\n');\ncout.put(65);\n```\n\
    \n```cpp\n// istream 类\n// 单字符输入\nint get (); // 获取一个字符，存储在 c 中并返回调用的 istream\
    \ 引用\n\n// C 字符串输入\nistream & get (char and); // 获取一个字符并作为 int 返回。在文件末尾返回 EOF。\n\
    istream & get (char & c);\nistream & get (char * cstr, streamsize n, char delim\
    \ = '\\n'); // 获取 n-1 个字符或直到分隔符，并存储在 C 字符串数组 cstr 中。附加空字符以终止 C 字符串。在输入流中保留分隔符。\n\
    \nistream & getline (char * cstr, streamsize n, char delim = '\\n'); // 与 get()\
    \ 相同，但从输入流中提取并丢弃分隔符。\n```\n\n示例：\n```cpp\nint inChar;\nwhile ((inChar = cin.get())\
    \ != EOF) { // 读取到文件末尾\n    cout.put(inchar);\n}\n```\n\n### read()`, `write()`\
    \ 和 `gcount()`\n\n```cpp\n// istream 类\nistream & read (char * buf, streamsize\
    \ n); // 从 istream 读取 n 个字符并保留在字符数组 buf 中。与 get()/getline() 不同，它不会在输入末尾附加空字符。它用于二进制输入，而不是\
    \ C 字符串。\nstreamsize gcount() const; // 返回上一次非格式化输入操作（get()、getline()、ignore()\
    \ 或 read()）提取的字符数。\n\n// ostream 类\nostream & write (const char * buf, streamsize\
    \ n) // 从字符数组写入 n 个字符。\n```\n\n## 格式化控制台 IO 函数\n\nC++ 提供了各种格式化控制台函数用于格式化输出。它们有三种类型：\n\
    \n1. `ios` 类函数标志\n2. 操纵符\n3. 用户定义的输出函数\n\n### 成员函数和标志\n\n输出流（`ostream` 类）具有了一些用于控制输出的有用成员函数。注意这些函数不仅可以用于\
    \ `cout`，还可以用于其他输出流。\n\n`setf()`：设置标志函数。以标志作为参数。可以开启的标志包括：\n\n- `ios::fixed`：指定以固定点法输出浮点数。\n\
    - `ios::scientific`：指定以科学计数法（指数）输出浮点数。\n- `ios::showpoint`：指定即使对于整数也显示小数点。\n-\
    \ `ios::right`：当指定宽度时，输出项右对齐。\n- `ios::left`：当指定宽度时，输出项左对齐。\n- `unsetf()`：调用此函数关闭某个标志。\n\
    - `precision()`：为浮点数设置小数点后的特定数字位数。以该数字作为参数。\n- `width()`：用于指定下一个输出项的字段宽度。以字符数作为参数。使用此函数时，左、右对齐标志有效。\n\
    - `fill()`：用于指定填充字段额外空间的字符（配合 `width()` 使用）。以字符作为参数。\n\n```cpp\nint x = 1234;\n\
    cout.setf(ios::right);\ncout.width(10);\ncout << \"Hello\";\ncout.width(15);\n\
    cout << x;\n// 上述输出为：\n//Hello1234\n```\n\n```cpp\nint x = 1234;\ncout.setf(ios::right);\n\
    cout.fill('.'); // 修改填充字符\ncout.width(10);//设置宽度为 10\ncout << x;\n// 上述输出为：\n\
    //......1234\n```\n\n### 流操纵符\n\n流操纵符是可以通过放在插入运算符 `<<` 右侧使用的符号或函数。\n\n普通操纵符只是一个符号，类似于变量：\n\
    \n```cpp\ncout << endl; // endl 是一个流操纵符\n```\n\n参数化流操纵符看起来像函数调用 -- 它有一个或多个参数：\n\
    \n```cpp\ncout << setw(10); // setw() 是一个参数化操纵符\n```\n\n"
- fmt: "\nMany of the stream manipulators are just alternate ways of doing tasks performed\
    \ by member functions. A nice benefit is that cascading can be used, intermixing\
    \ manipulators and other output statements that use the insertion operator.\n\n\
    cpp\ncout << setw(10) << \"Hello\" << endl;\n```\n\n`setprecision()` is a parameterized\
    \ stream manipulator that performs the same task as the member function `precision()`.\n\
    \n```cpp\ncout.precision(2);// sets decimal precision to 2 significant digits\n\
    cout << setprecision(2); // does the same thing!\n```\n\n`setw()` is a parameterized\
    \ stream manipulator that performs the same task as the member function `width()`.\n\
    \n```cpp\ncout.width(10);// sets field width to 10 for next output\ncout << setw(10);\
    \ // does the same thing!\n```\n\n`setfill()` is a parameterized stream manipulator\
    \ that performs the same task as the member function `fill()`.\n\n```cpp\ncout.fill('*');//\
    \ sets fill character to '*'\ncout << setfill('*');// does the same thing!\n```\n\
    \n`setiosflags()` is a parameterized stream manipulator that performs the same\
    \ task as the member function `setf()`.\n\n```cpp\ncout.setf(ios::left);// sets\
    \ left justification flag\ncout << setiosflags(ios::left); // does the same thing!\n\
    ```\n\nThere are also some newer stream manipulators that correspond to some of\
    \ the formatting flags. For example:\n\n```cpp\ncout.setf(ios::left);// sets left\
    \ justification for cout\ncout << left; // also sets left justification for cout\n\
    ```\n\n# FILE I/O\n\n![](Images/image01384.jpeg)\n\nTo perform file processing\
    \ in C++, the header files `<iostream.h>` and `<fstream.h>` must be included.\n\
    \n`<fstream>` includes `<ifstream>` and `<ofstream>`.\n\n## File Open Modes\n\n\
    Where `filename` is a string representing the name of the file to be opened, and\
    \ `mode` is an optional parameter with a combination of the following flags:\n\
    \n| `ios::in` | Open for input operations. |\n| :--- | :--- |\n| `ios::out` |\
    \ Open for output operations. |\n| `ios::bin` | Open in binary mode. |\n| `ios::ate`\
    \ | Set the initial position at the end of the file. If this flag is not set,\
    \ the initial position is the beginning of the file. |\n| `ios::app` | All output\
    \ operations are performed at the end of the file, appending the content to the\
    \ current content of the file. |\n| `ios::trunc` | If the file is opened for output\
    \ operations and it already existed, its previous content is deleted and replaced\
    \ by the new one. |\n\n`ios::nocreate` - if the file does NOT exist, the open\
    \ operation fails.\n`ios::noreplace` - if the file exists, the open operation\
    \ fails.\n\nEach of the open member functions of classes `ofstream`, `ifstream`\
    \ and `fstream` has a default mode that is used if the file is opened without\
    \ a second argument:\n\n| class | default mode parameter |\n| :--- | :--- |\n\
    | `ofstream` | `ios::out` |\n| `ifstream` | `ios::in` |\n| `fstream` | `ios::in\
    \ \\| ios::out` |\n\n## File Close\n\nWhen we are finished with our input and\
    \ output operations on a file, we shall close it so that the operating system\
    \ is notified and its resources become available again. For that, we call the\
    \ stream's member function `close`. This member function flushes the associated\
    \ buffers and closes the file:\n\n![](Images/image01385.jpeg)\n\nOnce this member\
    \ function is called, the stream object can be re-used to open another file, and\
    \ the file is available again to be opened by other processes.\n\n![](Images/image01386.gif)\n\
    \n## Example\n\nA file can be opened either using the constructor or by creating\
    \ an object. The following example shows:\n\n```cpp\n#include <iostream.h>\n#include\
    \ <fstream.h>\n\nint main() {\n    ofstream fout(\"example.txt\");\n    fout <<\
    \ \"This is a line.\\n\";\n    fout << \"Another line.\\n\";\n    fout.close();\n\
    \    return 0;\n}\n```\n\nOutput:\n```\nThis is a line.\nAnother line.\n```\n\n\
    ## File position\n\n`<istream>` and `<ostream>` provide member functions for repositioning\
    \ the file pointer (the byte number of the file to be read or to be written).\
    \ These member functions are:\n\n- `seekg()` (seek get) for `istream`\n- `seekp()`\
    \ (seek put) for `ostream`\n\n`tellg()` and `tellp()` are provided to return the\
    \ current locations of get and put pointers, respectively.\n\n# ERROR (Exception)\
    \ HANDLING\n\nThe exception refers to unexpected condition in a program. The unexpected\
    \ conditions could be faults, causing an error which in turn causes the program\
    \ to fail. The error handling mechanism of C++ is generally referred to as exception\
    \ handling.\n\n## Types of Exceptions\n\n1. Synchronous Exception\n2. Asynchronous\
    \ Exception\n\n### Synchronous Exception\n\nThe exception which occurs during\
    \ the program execution, due to some fault in the input data or technique that\
    \ is not suitable to handle the current class of data, with in the program are\
    \ known as synchronous exception.\n\nExample: `out of range`, `divide by zero`,\
    \ `overflow`, `underflow`.\n\n### Asynchronous Exception\n\nThe errors that are\
    \ caused by events beyond the control of the program are called asynchronous exceptions.\n\
    \nExample: disk failure.\n\n## Exception handling Mechanism\n\nThe purpose of\
    \ the exception handling mechanism is to provide means to detect and report an\
    \ “exceptional circumstance” so that appropriate action can be taken. The exception\
    \ handling mechanism consists of the following task or operations:\n\n1. Find\
    \ the problem (hit the exception)\n2. Inform that an error has occurred (throw\
    \ the exception)\n3. Receive the error information (catch the exceptions)\n4.\
    \ Take corrective actions (handle the exceptions)\n\nThe following example shows\
    \ how it works:\n\n```cpp\n#include <iostream.h>\n#include <fstream.h>\n\nint\
    \ main() {\n    try {\n        throw \"Error occurred\";\n    } catch (const char*\
    \ msg) {\n        cout << msg << endl;\n    }\n    return 0;\n}\n```\n\nThe following\
    \ example:\n\n![](Images/image1387.jpeg)\n\n```cpp\n#include <iostream.h>\n#include\
    \ <fstream.h>\n\nvoid main() {\n    char line[100];\n    try {\n        ofstream\
    \ fout(\"example.txt\");\n        fout << \"This is a line.\\n\";\n        fout\
    \ << \"Another line.\\n\";\n        fout.close();\n    } catch (const char* msg)\
    \ {\n        cout << msg << endl;\n    }\n\n    ifstream fin(\"example.txt\");\n\
    \    while (fin.getline(line, 100)) {\n        cout << line << endl;\n    }\n\
    \    fin.close();\n}\n```\n\nThe following example:\n\n![](Images/image1388.jpeg)\n\
    \n```cpp\n#include <iostream.h>\n#include <fstream.h>\n\nint main() {\n    char\
    \ line[100];\n    try {\n        ofstream fout(\"example.txt\");\n        fout\
    \ << \"This is a line.\\n\";\n        fout << \"Another line.\\n\";\n        fout.close();\n\
    \    } catch (const char* msg) {\n        cout << msg << endl;\n    }\n\n    ifstream\
    \ fin(\"example.txt\");\n    while (fin.getline(line, 100)) {\n        cout <<\
    \ line << endl;\n    }\n    fin.close();\n    return 0;\n}\n```\n\nThe following\
    \ output:\n```\nThis is a line.\nAnother line.\n```\n\nThe following example:\n\
    \n![](Images/image1389.jpeg)\n\n```cpp\n#include <iostream.h>\n#include <fstream.h>\n\
    \nint main() {\n    char line[100];\n    try {\n        ofstream fout(\"example.txt\"\
    );\n        fout << \"This is a line.\\n\";\n        fout << \"Another line.\\\
    n\";\n        fout.close();\n    } catch (const char* msg) {\n        cout <<\
    \ msg << endl;\n    }\n\n    ifstream fin(\"example.txt\");\n    while (fin.getline(line,\
    \ 100)) {\n        cout << line << endl;\n    }\n    fin.close();\n    return\
    \ 0;\n}\n```\n"
