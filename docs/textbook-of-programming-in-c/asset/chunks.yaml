- fmt: "\n* The `enum` keyword automatically enumerates a list of words by assigning\
    \ them values `0`, `1`, `2`, and so on.\n* This facility provides an alternative\
    \ means for creating symbolic constants (using `#define` preprocessor directive).\n\
    * The syntax of `enum` is similar to that of the `struct` statement.\n\n### Syntax:\n\
    \n![](Images/image01334.jpeg)\n\n• In this form, `enum-type-name` is optional.\
    \ However, if you want to use `enum` type in several places, it is better to use\
    \ another way of `enum` declaration:\n\n### (Or)\n\n![](Images/image01335.jpeg)\n\
    \n• In the second case `enum-type-name` cannot be omitted.\n\n### Eg:\n\n```cpp\n\
    enum shape{circle,triangle,circle}; enum color{yellow,blue,white,red}; enum position{off,on};\n\
    ```\n\n• The enumerated data types differ slightly in C++ when compared with those\
    \ in `C`. In `C++`, the tag names `shape`, `color`, `position` becomes new type\
    \ names.\n• By using these tag names we can declare new variables. `shape ellipse;//ellipse\
    \ is of type shape` / `color background;//background is of type color`\n• `C`\
    \ defines the types of enums to be `ints`.\n• In `C++`, each enumerated data type\
    \ retains its own separate type i.e., `C++` does not permit an `int` value to\
    \ be automatically converted to an `enum` value.\n\n### Eg:\n\n```cpp\ncolor background\
    \ = blue;//allowed\ncolor background = 7;//error in C++\ncolor background = (color)\
    \ 7; //OK\n```\n\n• Enumerated value can be used in the place of an `int` value.\
    \ `int c = red;//valid,color` type promoted to `int`\n• By default, the enumerators\
    \ are assigned integer values starting with `0` and each successive enumerator\
    \ is one larger than the value of the previous one, unless you explicitly specify\
    \ a value for a particular enumerator i.e. We can over-ride the default by explicitly\
    \ assigning integer values to the enumerators.\n• Enumerators needn't have unique\
    \ values within an enumeration.\n• The name of each enumerator is treated as a\
    \ constant and must be unique within the scope where the `enum` is defined.\n\
    • An enumerator can be promoted to an integer value.\n\n### Eg:\n\n```cpp\nEnum\
    \ color{red,blue=5,green=9}; Enum color{red=5,blue,green};\n```\n\nNote:- The\
    \ subsequent initialised enumerators are larger by one than their predecessors.\n\
    • `C++` also permits the creation of anonymous enums (i.e. enums without tag names)\n\
    \n### Eg:\n\n```cpp\nenum{off,on};\n```\n\nHere, `off` is `0` and `on` is `1`.\
    \ These constants may be referenced in the same manner as regular constants.\n\
    \n```cpp\nint switch_1=off; int switch_2=on;\n```\n\n### Characteristics:\n\n\
    • An enumeration set can contain duplicate constant values. For example, you could\
    \ associate the value `0` with two different identifiers in the same set.\n• The\
    \ identifiers in the enumeration list must be distinct from other identifiers\
    \ in the same scope with the same visibility, including ordinary variable names\
    \ and identifiers in other enumeration lists.\n• Enumeration tags follow the normal\
    \ scoping rules. They must be distinct from other enumeration, structure, and\
    \ union tags with the same visibility.\n\n### Functions\n\nFunctions are the building\
    \ blocks of `C++` programs. A function groups a number of program statements into\
    \ a single unit. This unit can be invoked from other parts of the program.\n\n\
    * It is difficult to implement a large program even if it is algorithm is available.\n\
    * To implement such a program in an easy manner, it should be split into a number\
    \ of independent tasks, which can be easily designed, implemented, and managed.\n\
    * This process of splitting a large program into small manageable tasks and designing\
    \ them independently is called Modular Programming.\n* A repeated group of instruction\
    \ in a program can be organized as a function.\n* A function is a set of program\
    \ statements that can be processed independently.\n* Member functions\n* Main\
    \ function\n* Function prototyping\n* Call by reference\n* Return by reference\n\
    * Inline functions\n* Default arguments\n* Constant arguments\n* Function overloading\n\
    * Friend and virtual functions\n\n### //DEFAULT ARGUMENTS\n\n```cpp\n#include<iostream.h>\
    \ \n#include<conio.h> \nclass abc\n{\npublic:\n};\n```\n\n```cpp\nvoid abc::sum(int\
    \ a, int b, int c)\n{\n    int d=a+b+c;\n}\n```\n\n### SCOPE:\n\nIn `C`, global\
    \ version of a variable cannot be accessed from within block. `C++` resolves this\
    \ by introducing `::` operator.\n\nExample:\n\n```cpp\n#include<iostream>\nint\
    \ m=10;\nvoid main()\n{\n    int m=20;\n    cout << ::m;\n}\n```\n\n### Namespace:\n\
    \nIt is used to define a context in which names are defined. Example:\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\n\nnamespace first_space\n{\n    void\
    \ func(){\n        cout << \"Inside first_space\" << endl;\n    }\n}\n\nnamespace\
    \ second_space\n{\n    void func(){\n        cout << \"Inside second_space\" <<\
    \ endl;\n    }\n}\n\nint main()\n{\n    first_space::func();\n    second_space::func();\n\
    \    return 0;\n}\n```\n\n### Source Files and Programs\n\nAll the previous example.\
    \ Working with classes – Classes and objects Class Specification:\n\nThe class\
    \ can be described as a collection of data member with member functions. This\
    \ property of `C++`, allows association of data and functions into a single unit\
    \ is called encapsulation. Sometimes classes may not contain any data members\
    \ or member function called empty classes.\n\nSyntax for class specification:\n\
    \n![](Images/image0136.jpeg)Keyword\n\n![](Images/image0137.jpeg)Class `classname`\n\
    \n{\nUserdefined name of the class\n}; end of class requires semicolon\n\nMore\
    \ than one object can be created with a single statement as, `Class s1,s2,s3;`\
    \ Or `Student s1,s2,s3.`. Object can also be created by placing these names immediately\
    \ after the closing brace. Thus the definition\n\n```cpp\nClass student\n{\n}\
    \ s1,s2,s3;\n```\n\nAccessing class members:\n\nOnce an object of a class has\
