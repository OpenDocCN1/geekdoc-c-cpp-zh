    *   We should note the following features of this  function:


    *   It receives only one complex type argument  explicitly.


    *   It returns a complex type  value.


    *   It is a member function of  complex.


    *   The function is expected to add two complex values and return a complex value
    as the result but receives only one value as  argument.


    *   Then where does the other value comes from  ?


    *   Now look at the statement that invokes the above  function:


    c3=c1+c2;//invokes operator +( )  function


    We know that a member function can be invoked only by an object of the same class.Here,the
    object c1 takes the responsibility of invoking the function and c2 plays the role
    of an argument that is passed to the function.


    *   The above invocation statement is equivalent  to:


    c3=c1.operator+(c2);//usual function call  syntax


    Therefore,in the operator+( ) function,the data members of c1 are accessed directly
    and the data members of c2 (that is passed as an argument) are accessed using
    the dot operator.Thus,both the objects are available for the function.


    *   For example in the  statement,


    temp.x = a + c.x;


    *   c.x refers to the object  c1.


    *   temp.x is the real part of temp that has been created specially to hold the
    results of addition of c1 and  c2.


    *   The function returns the complex temp to be assigned to  c3.


    *   As a rule, in overloading of binary operators,left-hand operand is used to
    invoke operator function and the right-hand operand is passed as an  argument.


    *   The figure below shows how this is  implemented:


    ![](Images/image01355.jpeg)


    Fig. Implementation of operator +(complex c) function


     Arithmetic  operators


    *   As binary operators, these involve two arguments which do not have to be the
    same  type.


    *   The arithmetic operators  are:


    o+ (addition)


    *   -  (subtraction)


    *   * (multiplication)


    *   /  (division)


    *   %  (modulus)


     Rules for overloading  operators


    Although it looks like simple to redefine the operators, there are certain restrictions
    and limitations in overloading them.


    *   Only existing operators can be overloaded. New operators cannot be  created.


    *   The overloaded operator must have at least one operand that is of user-defined
    type.


    *   We cannot change the basic meaning of an operator i.e., we cannot  redefine
    plus(+) operator to subtract one value from the  other.


    *   Overloaded operators follow the syntax rules of the original operators. They
    cannot be  overridden.


    *   There are some operators that cannot be overloaded.'
