    }\n```\n\n## Advantages to the use of templates\n\n- Templates support generic\
    \ programming, which allows developing reusable software components such as functions,\
    \ classes, etc., supporting different data types in a single framework.\n- Templates\
    \ perform appropriate operations depending on the data type of the parameters\
    \ passed to them.\n- Templates are very useful when implementing generic constructs\
    \ like `vectors`, `stacks`, `lists`, `queues` which can be used with any arbitrary\
    \ type.\n- Templates require type-checking at compile-time. Hence, the compiler\
    \ can determine at compile-time whether or not the type associated with a template\
    \ definition can perform all of the functions required by that template definition.\n\
    - By design, templates can be utilized in very complex problem spaces.\n\n## Fundamental\
    \ drawbacks to the use of templates\n\n- Historically, some compilers exhibited\
    \ poor support for templates. So, the use of templates could decrease code portability.\n\
    - Many compilers lack clear instructions when they detect a template definition\
    \ error. This can increase the effort of developing templates, and has prompted\
    \ the development of Concepts for possible inclusion in a future C++ standard.\n\
    - Since the compiler generates additional code for each template type, indiscriminate\
    \ use of templates can lead to code bloat, resulting in larger executables.\n\
    - Because a template by its nature exposes its implementation, injudicious use\
    \ in large systems can lead to longer build times.\n- It can be difficult to debug\
    \ code that is developed using templates. Since the compiler replaces the templates,\
    \ it becomes difficult for the debugger to locate the code at runtime.\n- Templates\
    \ of Templates (nesting) are not supported by all compilers, or might have a max\
    \ nesting level.\n- Templates are in the headers, which require a complete rebuild\
    \ of all project pieces when changes are made.\n- No information hiding. All code\
    \ is exposed in the header file. No one library can solely contain the code.\n\
    \n## STANDARD TEMPLATE LIBRARY\n\nThe standard template library (STL) contains:\n\
    \n- Containers\n- Algorithms\n- Iterators\n\n![](Images/image01393.jpeg)\n\nA\
    \ container is a way that stored data is organized in memory, for example an array\
