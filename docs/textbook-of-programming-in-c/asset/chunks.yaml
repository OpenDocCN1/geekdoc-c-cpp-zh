    ### 3. Update Train Information

    Only the administrator enters any changes related to the train information like
    change in the train name, train number, train route etc. in the system.


    ### 4. Report Generation

    Provision for generation of different reports should be given in the system. The
    system should be able to generate reservation chart, monthly train report etc.


    ### 5. Login

    For security reasons all the users of the system are given a user id and a password.
    Only if the id and password are correct is the user allowed entry to the system
    and select from the options available in the system.


    ### 6. View Reservation Status

    All the users should be able to see the reservation status of the train online.
    The user needs to enter the train number and the pin number printed on his ticket
    so that the system can display his current reservation status like confirmed,
    RAC or Wait-listed.


    ### 7. View Train Schedule

    Provision should be given to see information related to the train schedules for
    the entire train network. The user should be able to see the train name, train
    number, boarding and destination stations, duration of journey etc.


