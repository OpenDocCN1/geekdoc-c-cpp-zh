- "# C++ 编程入门指南\n\n\n\n![](img/cover01411.jpeg)\n\n\n![](img/image01299.jpeg)<map\
  \ name=\"awmap1\"><area shape=\"rect\" href=\"http://www.pudhiyadesambook.blogspot.com\"\
  \ coords=\"249, 675, 537, 692\"></map>\n\n## 第 1 单元：面向对象的编程范式\n\n- 编程范式的比较\n- 面向对象语言\n\
  - 面向对象编程的优点\n- 与 C 的比较\n- C++ 概述\n- 指针、引用与结构\n- 函数 - 作用域与命名空间\n- 源文件与程序\n\n### 过程化编程\n\
  \n高级语言如 `BASIC`、`COBOL`、`C`、`FORTRAN` 通常被称为过程编程。\n\n![](img/image01300.jpeg)[](Images/image01301.jpeg)[](Images/image01302.jpeg)[](Images/image01303.jpeg)[](Images/image01304.jpeg)[](Images/image01305.jpeg)使用这种方法，问题被看作一系列要执行的操作，如读取、处理、显示或打印。为了执行这些任务，必须使用函数概念。\n\
  \n![](img/image01306.jpeg)[](Images/image01307.jpeg)\n\n### 图. 过程化程序的典型结构\n\n- ![](img/image01308.jpeg)该概念基本上由许多条语句组成，这些语句被组织或分组为函数。\n\
  - 在开发这些函数时，程序员必须注意在各个函数中使用的数据。\n- 在多函数程序中，数据必须声明为全局，以便程序内的所有函数都能访问该数据，且每个函数也可以拥有自己的数据，称为局部数据。\n\
  \n![](img/image01309.jpeg)\n\n### 图. 过程化编程中数据与函数的关系\n\n- 全局数据可以在程序的任何地方访问。在大型程序中，很难识别哪个函数访问了哪些数据。在这种情况下，我们必须重新检查外部数据以及访问全局数据的函数。在这种情况下，有很多机会出现错误。\n\
  \n### 过程化编程 (C) 的特点：\n\n- 侧重于执行任务（算法）\n- 大型程序被分成较小的程序，称为函数\n- 大多数函数共享全局数据\n- 数据在系统中从函数之间自由流动\n\
  - 函数将数据从一种形式转换为另一种形式\n- 在程序设计中采用自上而下（TOP-DOWN）的方法\n\n### ![](img/image01311.jpeg)面向对象编程\n\
  \n- 这种编程方法的开发是为了减少在过程化编程方法中遇到的某些缺点。\n- `OOProgramming` 方法将数据视为关键元素，且允许数据在程序中自由流动。\n\
  - 它将数据与操作数据的函数更紧密地封装；它还保护数据不受函数外部的意外修改。\n- 面向对象编程方法将程序分为许多称为“对象”的实体，并在对象周围构建操作数据的数据和函数。\n\
  - 对象的数据只能通过与对象相关的函数访问。然而，一个对象的函数可以访问其他对象的函数。\n\n![](img/image01312.jpeg)\n\n## ![](img/image01313.jpeg)[](Images/image01314.jpeg)图.\
  \ OOP 中数据与函数的组织\n\n### 面向对象编程 (C++) 的特点\n\n- 侧重于数据而非过程\n- 程序被分为所谓的 `OBJECTS`（对象）\n\
  - 数据结构的设计使其表征对象的特征\n- 操作对象数据的函数在数据结构中绑定在一起\n- 数据是隐藏的，不能被外部函数访问\n- 对象之间可以通过函数进行相互通信\n\
  - 需要时可以随时方便地添加新的数据和函数\n- 在程序设计中遵循自下而上（BOTTOM-UP）的方法\n\n### 编程范式的比较\n\n#### C 与 C++\
  \ 的区别\n\n`C` 是一种过程化编程语言，而 `C++` 是一种面向对象的编程语言。之所以需要面向对象的环境，是因为 `C` 等过程化编程语言在大型程序的无\
  \ Bug 性、复杂性和可重用性方面无法达到预期结果。`C++` 消除了 `C` 语言所面临的陷阱。\n\n许多差异使得 `C++` 成为 `C` 的理想替代方案。`C++`\
  \ 中有许多 `C` 语言不支持的概念，如数据隐藏、数据封装、继承、多态、类、对象、运算符重载和消息传递。这些概念可以消除大型程序中 `C` 语言的复杂性。\n\
  \n`C` 与 `C++` 的主要区别在于我们使用 `class`（用户定义数据类型）的地方，通过 `class` 我们导出其他概念。`Class` 类似于 `C`\
  \ 中的结构体。在结构体中只能声明混合数据类型，而 `C++` 允许我们在定义数据之外声明并定义函数。这使得主函数更加简单，并将所有函数分组到单个 `class`\
  \ 中。\n\n`C++` 中的运算符重载概念允许我们创建自己的新语言。通过这种方式，我们可以对类变量（即对象）进行算术运算，使得程序更容易理解。在 `C` 中，我们无法像在\
  \ `C++` 中那样对结构体变量进行算术运算。\n\n在 `c` 中，对于大型程序，冗余代码的存在是不可避免的。这在 `C++` 中可以通过继承来消除。\n\n\
  在 `c` 中，一个程序的代码意外访问另一个程序的代码是可以避免的。这在 `C++` 中可以通过数据隐藏来消除，它帮助程序员构建不被程序其他代码入侵的安全程序。\n\
  \n在 `c` 中，如果我们想在不修改函数的情况下向程序额外功能是非常困难的。这在 `C++` 中可以通过继承来消除，继承允许我们在不修改现有类的情况下添加额外功能。这一概念提供了程序的可重用性。\n\
  \n| 序号 | 过程化编程 (C) | 面向对象编程 (C++) |\n| :--- | :--- | :--- |\n| 1.2.3.4.5. | 程序被分成较小的子程序，称为函数。这里全局数据被大多数函数共享。采用自上而下的方法。数据安全且对所有函数可见。这里无法重用，因此无法避免冗余代码。\
  \ | 程序被分为对象和类。对象之间可以通过函数相互通信。采用自下而上的方法。数据是安全的，并在声明它的类中可用。在这里，我们可以通过继承概念重用现有的。 |\n\
  \n### 面向对象语言：\n\n面向对象编程语言分为两类：1. 基于对象的编程语言 2. 面向对象的编程语言\n\n#### 基于对象的编程：\n\n支持对象编程的语言被称为基于对象的编程语言。它们没有继承和动态绑定。基于对象是一种支持封装和标识的编程风格。\n\
  \n实现此功能的主要特性：\n1. 数据封装\n2. 数据隐藏和访问机制 3. 对象的自动初始化和清理 4. 运算符重载\n\n#### 面向对象编程\n\n\
  面向对象编程包含了基于对象的编程的所有特性，并增加了继承和动态绑定两个额外特性。\n\n### OOP 概念是\n\n- 对象\n- 类\n- 数据抽象与封装\n\
  - 继承\n- 多态\n- 动态绑定\n- 消息传递\n\n### 对象\n\n- 对象是面向对象系统中的基本运行时实体。\n- 每个实体都可以被视为对象。对象包含数据和操作这些数据的代码。\n\
  \n\n\n\n\n*   它们可能代表一个人、一个地方、一个银行账户、一个数据表或计算机必须处理的任何项目。\n*   某些对象可能对应现实世界的实体，例如学生、员工、银行账户等。\n\
  *   每个对象将有一个名为 `attributes`（`data`）的状态以及一个名为 `operations`（`function`）的行为。\n\n当程序执行时，对象之间通过向彼此发送消息来相互交互。例如，如果\
  \ `customer` 和 `account` 是程序中的两个对象，那么 `customer` 对象可能会向 `account` 对象发送消息。每个对象都包含用于操作数据的数据和代码。对象之间可以交互而无需了解对方数据或代码的细节。只需要知道对象接受的类型类型以及对象返回的响应类型即可。\n\
  \n![](img/image01316.jpeg)![](img/image01317.jpeg)\n\n**图 2 表示对象的两种方式**\n\n台台灯可能只有两种可能的状态（`on`\
  \ 和 `off`）和两种可能的行为（`turn on`、`turn off`），但你的台式收音机可能有额外的状态（`on`、`off`、`current volume`、`current\
  \ station`）和行为（`turn on`、`turn off`、`increase volume`、`decrease volume`、`seek`、`scan`\
  \ 和 `tune`）。\n\n### ![](img/image01318.jpeg) 示例：\n\n| 账户 |\n| 账号 账户类型 名称 余额 |\n\
  | `Deposit()` `Withdraw()` `Enquire()` |\n\n*   每个对象都拥有其自己的身份，尽管它们的 `attributes`\
  \ 和操作是相同的，但对象之间永远不会相等。\n*   例如，在人对象的情况下，两个人将具有相同的属性，如 `name`、`age`、`sex`；但它们是不相等的。\n\
  \n###  类\n\n*   我们知道对象包含数据以及操作这些数据的函数或代码。通过 `class` 的帮助，对象的整个数据和代码集合可以作为一个用户定义的数据类型。\n\
  *   对象是 `class` 类型的变量。\n*   类是用户定义的数据类型，行为类似于编程语言的内置类型。\n*   一旦定义了 `class`，我们就可以创建许多与该\
  \ `class` 关联的对象。\n*   因此，`class` 是相似类型对象的集合，即具有相同状态（`attributes`）和行为（`operations`）的对象被分组到一个\
  \ `class` 中。\n*   例如，`mango`、`apple` 和 `orange` 是类 `fruit` 的成员。\n*   创建对象的语法与在 `C`\
  \ 中创建整数对象的语法没有区别。\n*   如果 `fruit` 已经定义为 `class`，那么语句\n\n### 示例：\n\n```\nfruit mango;\n\
  ```\n\n将创建一个属于类 `fruit` 的对象 `mango`。\n\n### 示例例：\n\n1. 类：`person` 对象：`girl`、`boy`\
  \ 属性：`Name`、`Age` 操作：`speak()`、`listen()`、`walk()`\n2. 类：`vehicle` 对象：`car`、`bus`\
  \ 属性：`Name`、`model`、`color` 操作：`start()`、`stop()`、`accelerate()`\n\n### 在 C++ 中，类可以表示为：\n\
  \n```cpp\nClass account\n{\nPrivate:\n  char name[20]; int act_type; float balance;\n\
  Public:\n};\ndeposit( ); withdraw( );\n```\n\n*   它类似于 `C` 中的结构体声明。\n*   它允许创建被称为\
  \ `objects` 的类变量。\n\n### 示例：\n\n```cpp\n#include <iostream>\n#include <conio.h>\n\
  using namespace std;\n\nclass account {\nprivate:\n  int a;\npublic:\n  void getdata()\
  \ {\n    cout << \"enter number to check: \";\n    cin >> a;\n  }\n  void check()\
  \ {\n    if(a % 2 == 0)\n      cout << \"given number is even\";\n    else\n   \
  \   cout << \"given number is odd\";\n  }\n};\n\nvoid main() {\n  getscr();\n  account\
  \ e;\n  e.getdata();\n  e.check();\n}\n```\n\n**输出：**\nEnter number to check: 9\n\
  given number is odd\n\n2.\n\n```cpp\n#include <iostream>\n#include <conio.h>\nusing\
  \ namespace std;\n\nclass velocity {\nprivate:\n  int v, a, t;\npublic:\n  void\
  \ getdata() {\n    cout << \"Enter values for velocity, acceleration,\nand time:\
  \ \";\n    cin >> v >> a >> t;\n  }\n  void calculate() {\n    v = v + (a * t);\n\
  \    cout << \"FINAL VELOCITY= \" << v;\n  }\n};\n\nvoid main() {\n  getscr();\n\
  \  velocity ob;\n  ob.getdata();\n  ob.calculate();\n}\n```\n\n**输出：**\nEnter values\
  \ for velocity, acceleration,and time: 10 5 2\nFINAL VELOCITY= 20\n\n###  封装\n\n\
  *   封装是 OOP 最显著的特征。将数据和函数封装成一个单元被称为封装。\n*   数据对外部不可见；只有这些函数可以访问它。\n*   这也被称为“数据隐藏”或“信息隐藏”。\n\
  \n###  抽象\n\n*   抽象指的是在不包含细节的情况下表示基本特征的行为。为了更清楚地理解这个概念，以“开关”为例。你只知道特定的开关，因为内部发生的情况是被隐藏的。\n\
  *   类使用了抽象的概念。它们也被称为抽象数据类型 (ADT)。\n\n###  继承\n\n*   继承是一个类的对象获取另一个类属性的过程。\n*  \
  \ 它提供了重用性，即我们可以向现有类添加额外的功能。\n*   这可以通过从现有类派生出一个新类来实现。\n*   现有的类被称为基类，新类被称为派生类（子类）、父类（超类）。\n\
  \n###  多态\n\n*   多态是 OOP 力量的关键。\n*   它是一个希腊语词，意味着采取多种形式（许多形式）的能力。\n*   它是支持数据以多种形式进行处理的能力的概念，即它允许一个名称被用于多个相关的用途，而这些用途在技术上是不同的。\n\
  *   例如，一个操作在不同的实例中可能会表现出不同的行为。\n\n以下是在 C++ 程序中实现多态的不同方法：\n\n*   函数重载\n*   运算符重载\n\
  *   动态绑定\n\n\n\n\n\n## 动态绑定\n\n- 绑定（Binding）是指将过程调用与响应该调要执行的代码链接起来。\n- 动态绑定（也称为后期绑定）意味着与给定过程关联的代码在运行时的调用之前是未知的。\n\
  - 它与多态和继承相关。\n\n## 示例\n\n- 考虑上图中的 `draw` 过程。通过继承，每个对象都拥有此过程。\n- 然而，它的算法对于每个对象都是唯一的，因此\
  \ `draw` 过程将在定义该对象的每个类中重新定义。\n- 在运行时，将调用与当前引用对象匹配的代码。\n\n## 消息传递\n\n- 一个面向对象（OO）的程序由一组相互通信的对象组成。\n\
  - 因此，在面向对象语言中编程的过程涉及以下步骤：\n    - 创建定义对象及其行为的类。\n    - 从类定义创建对象。\n    - 建立对象之间的通信。\n\
  - 发给对象的消息是执行某个过程的请求，因此它将调用接收对象中的一个函数（过程），以生成所需的结果。\n- 对象之间通过发送和接收信息进行通信，就像人与之间传递消息一样。\n\
  - 消息传递涉及指定对象的名称、函数（消息）名称以及要发送的信息。\n\n## 示例\n\n`employee.salary(name);`\n\n![](img/image01326.jpeg)\n\
  ![](img/image01327.jpeg)\n\n信息\n\n对象具有生命周期。它们可以被创建和销毁。\n只要对象存活，与对象的通信就是可能的。\n\n\
  ## 面向对象编程（OOP）的优点\n\n- 可以轻松管理软件的复杂性。\n- 数据隐藏概念帮助程序员构建安全的程序。\n- 通过类概念我们可以自定义数据类型。\n\
  - 继承概念可以消除冗余代码。\n- 消息传递概念帮助程序员在不同对象之间进行通信。\n- 需要时可以轻松地添加新的数据和函数。\n- OOP 将数据元素与其操作的函数结合得更紧密。\n\
  \n## 面向对象编程的应用\n\n- 实时系统\n- 仿真与建模\n- 对象数据库\n- 超文本、超多媒体和专家文本\n- 人工智能和专家系统\n- 神经网络和并行编程\n\
  - 决策支持和办公自动化系统\n- CIM/CAM/CAD 系统\n\n## C 与 C++ 的比较\n\n### C 语言\n\n- 自上而下的方法\n- 过程导向\n\
  - 变量无法动态泛化\n- 没有引用变量概念\n- 内存管理\n- 分配：`malloc()`，`calloc()`\n- 释放：`free()`\n    -\
  \ 类型转换：\n      语法：`(typename) expression`\n- 不支持继承、多态、动态绑定、封装等面向对象的概念。\n- 没有内联函数或友元函数。\n\
  - 输入和输出：\n    - 分别使用 `Scanf()` 和 `printf()` 库函数读取输入和写入输出。\n- 没有作用域解析符来访问函数内部块中的全局变量。\n\
  - 不使用构造函数和析构函数。\n- 不支持继承、多态、封装、动态绑定等面向对象的概念。\n\n### C++ 语言\n\n- 自下而上的方法\n- 面向对象\n\
  - 允许变量的动态初始化，例如：`cin>>str;`\n```\nint len=strlen(str);\n```\n- 使用引用变量，例如：`float\
  \ tot=100`\n```\nfloat & sum=tot;\n// 此处引用变量 sum 引用变量 tot\n```\n- 内存管理\n- 分配：使用\
  \ `new` 运算符。\n- 释放：使用 `delete` 运算符。\n    - 类型转换：\n      语法：`typename (expression)`\n\
  - 内联函数：内联函数是请求[编译器](http://en.wikipedia.org/wiki/Compiler)执行[内联展开](http://en.wikipedia.org/wiki/Inline_expansion)的函数。\n\
  - 例如：\n```cpp\n#include<iostream.h> class class inl\n{\npublic:\n![](img/image01328.jpeg)\n\
  inline int cube(int a) return a*a*a;\n};\n\nInt main()\n{\ninl o;\nint c=o.cube(3);\
  \ return 0;\n}\n```\n- 输入和输出：\n    - 用于读取输入的 `>>` 提取运算符\n    - 用于打印输出的 `<<` 运算符\n\
  \        - 例如：\n```cpp\ncin>> a;\ncout<<a;\n```\n- 作用域解析符：\n  作用域解析符有助于识别并指定标识符所指的上下文。语法：`::member_name`\n\
  - 使用友元函数和虚函数。\n- 不使用构造函数和析构函数。\n- 支持继承、多态、封装、动态绑定等面向对象的概念。\n\n## C++ 编程概述\n\nC++\
  \ 由 BJARNE STROUSSTRUP 于 20 世纪 80 年代初在美国马里山的 AT&T 贝尔实验室开发。\nStroustrup 结合了‘C’语言和‘SIMULA67’的特征，创建了一种支持\
  \ OOP 概念的更强大的语言，该语言命名为“带类的 C”。1983 年底，名称改为 C++。\nC++ 的想法来源于‘C’语言的递增运算符（`++`），意味着更多的增加。\n\
  C++ 是‘C’语言的超集，大多数‘C’语言的特性也可以应用于 C++，但面向对象的特性（类、继承、多态、重载）使得 C++ 真正成为一种面向对象的编程语言。\n\
  \n![](img/image01329.jpeg)![](img/image01330.jpeg)\n\nC++ 程序的结构\n\n| 包含文件 |\n| :---\
  \ |\n| 类定义 |\n| 成员函数定义 |\n| 主函数程序 |\n\n包含文件为编译器提供了链接系统库中函数的指令。\n例如：\n```cpp\n#include\
  \ <iostream.h>\n#include–预处理器 指令 iostream.h–头文件\n```\n- 类是将数据及其关联函数绑定在一起的方法。它是一种自定义数据类型。必须在类声明部分声明。\n\
  - 成员函数定义描述了类函数如何实现。这必须是 C++ 程序的下一个部分。\n- 最后是主程序部分，程序从这里开始执行。\n```cpp\nmain( )\n\
  {\n}\n```\n程序执行从左括号开始在右括号处结束。\n主函数的右括号是程序的逻辑终点。\n\n## 输入 / 输出语句\n\n 输入流\n\n语法：\n\
  ```cpp\ncin >> var1 >> var2 >>;\n```\n- `cin` – 关键字，它是在 C++ 中预定义的对象，对应标准输入流。\n-\
  \ `>>` - 是提取或获取运算符\n提取操作（`>>`）从左侧的流对象获取值并将其放入右侧的变量中。\n例如：\n```cpp\ncin>>x; cin>>a>>b>>c;\n\
  ```\n\n输出流：语法：\n```cpp\ncout<<var1<<var2;\n```\n- `cout` - 标准输出流对象\n- `<<` - 是插入或放入运算符\n\
  它将右侧变量的内容定向到左侧的对象。\n输出流可用于在屏幕上显示消息。\n例如：\n```cpp\ncout<<a<<b; cout<<”value of x\
  \ is”<<x;\n```\n\n## 令牌\n\n程序中的最小单元被称为令牌。\nC++ 具有以下令牌：\n- 关键字\n- 标识符\n- 常量\n- 字符串\n\
  - 运算符\n\n- C++ 程序使用这些令牌、空白符和语言语法编写。\n- 大多数 C++ 令牌与 C 令牌基本相似，但有一些添加和微调。\n\n### 关键字\n\
  \n![](img/image01311.jpeg)\n- 关键字实现了特定的 C++ 语言特性。\n- 关键字具有预定义的含义，用户无法更改。\n- 关键字不能作为程序变量的名称。\n\
  \n\n\n\n\n*   ANSI C 关键字中增加了额外的关键字，以增强其功能并使其成为面向对象的语言。\n\n### 特有的 C++ 关键字\n\n有几个是\
  \ C++ 特有的关键字。\n\n![](img/image01311.jpeg)![](img/image01331.jpeg)\n\n标识符是指程序员创建的变量、函数、数组、类等的名称。它们是任何语言的基础性要求。\n\
  \n这些标识符的命名规则在 C 和 C++ 中通用：\n\n1. 仅允许字母、数字和下划线。\n2. 名字不能以数字开头。\n3. 大写和小写字母是有区别。\n\
  4. 已声明的关键字不能作为变量名。\n\nC 和 C++ 之间的主要区别在于名称长度的限制，即 `C` 只识别名称中的前 32 个字符。而 `C++` 对长度没有限制，因此名称中的所有字符都是意义的。\n\
  \n### ![](img/image01311.jpeg)常量\n\n它指的是程序执行过程中不改变的固定值。`C++` 识别 C 中可用的所有常量。\n\n\
  ### 常量的类型：\n\n* 整数常量-例如：`123`, `25`–不带小数点\n* 字符常量-例如：‘A’, ‘B’, ‘*’, ‘1’\n* 实数常量-例如：`12.3`,\
  \ `2.5` - 带有小数点\n\n### ![](img/image01311.jpeg)字符串\n\n字符序列被称为字符串。字符串常量用双引号括起来，如下：\n\
  \n### 示例：\n\n“Hello”\n\n### ![](img/image01311.jpeg)运算符\n\n运算符告诉计算机执行某些数学或逻辑操作的符号。\n\
  \n### 运算符类型\n\n1. 算术运算符\n2. 关系运算符\n3. 逻辑运算符\n4. 赋值运算符\n5. 递增运算符\n6. 条件运算符\n7. 位运算符\n\
  8. 特殊运算符\n9. 操纵符\n10. 内存分配/删除运算符\n\n### • 操纵符\n\n操纵符用于格式化数据显示的运算符。常用的操纵符有 `endl`、`setw`。\n\
  \n###  endl 操纵符\n\n它用于输出语句并插入换行符，其效果与在‘C’ 语言中使用换行符 `\\n` 相同。\n\n### 示例：\n\n```cpp\n\
  #include <iostream.h> main()\n{\n\n}\n```\n\n### 输出：\n\n```cpp\nint a=10, b=20;\n\
  cout << “C++ language” << endl; cout << “A value: “ << a << endl; cout << “B value:”\
  \ << b << endl;\n```\nC++ language A value: 10\nB value: 20\n\n### 指针\n\nC++ 增加了常量指针和指向常量的指针的概念。\n\
  \n### 常量指针\n\n```cpp\nChar * const ptr1=”GOOD”;//常量指针 我们不能修改指针 1 的地址。\n```\n\n###\
  \ 指向常量的指针\n\n```cpp\nint const * ptr1=&m;//指向常量的指针 它所指向的内容不能改变。\n```\n\n### Void\n\
  \n`void` 的用途：\n\n(i) 当函数不返回返回值时指定其返回类型。\n(ii) 为函数指示空参数列表。\n\n### 示例：\n\n```cpp\n\
  void func(void);\n```\n\n(iii) 它用于指针声明。\n\n### 示例：\n\n```cpp\nvoid *p;//p 变成指针\n\
  ```\n\n在 C 语言中允许在不转换为非 void 指类型的情况下将任何 void 指针赋值给非 void 指针。\n\n### 示例：\n\n```cpp\n\
  void *ptr1; char *ptr2; ptr2=ptr1;\n```\n\n但在 C++ 中是不允许的。C++ 中的 void 指针不能直接赋值给其他类型的指针。我们需要使用强制转换符。\n\
  \n### 例如：\n\n```cpp\nvoid *ptr1; char *ptr2;\nptr2=(char*)ptr2;\n```\n\n### 引用变量\n\
  \nC++ 提供了一种名为引用变量的新类型变量。引用变量为之前定义的变量提供了一个别名（替代名称）。\n\n例如，如果我们把变量 `sum` 变成变量 `total`\
  \ 的引用，那么\n\n![](img/image01332.jpeg) `sum` 和 `total` 可以互换使用表示该变量。引用变量的创建方式如下：\n\n\
  ### 示例：\n\n```cpp\nfloat total = 100; float & sum = total;\ncout << sum << total;\n\
  ```\n\n这两个变量引用内存中的同一个数据对象，即 `total`, `sum`\n\n![](img/image01333.jpeg)\n\n引用变量的主要应用是在向函数传递参数。\n\
  \n### 示例程序：\n\n```cpp\nvoid f(int & x)//使用引用\n{\nx=x+10;//x 增加了；所以 m 也被增加了\n}\n\
  int main( )\n{\nint m=10;\nf(m);//函数调用\n..................\n..................\n\
  }\n```\n\n当执行函数调用 `f(m)` 时，会发生以下初始化：`int & x=m;`\n\n因此在执行语句 `f(m);` 后，`x` 变成了 `m`\
  \ 的别名。\n\n当函数增加 `x` 时，`m` 也会增加。\n\n2 这种函数也被称为引用传递。\n3 引用传递机制在面向对象编程中非常有用，因为它允许通过引用操作对象，并消除了对象参数来回复制。\n\
  4 引用不仅可以为内置类型创建，也可以为自定义类型创建。\n\n\n\n\n\n* `enum` 关键字通过为单词分配值 `0`、`1`、`2` 等来自动枚举单词列表。\n\
  * 该功能提供了一种创建符号常数的替代方法（使用 `#define` 预处理器指令）。\n* `enum` 的语法与 `struct` 语句相似。\n\n###\
  \ 语法：\n\n![](img/image01334.jpeg)\n\n• 在这种形式下，`enum-type-name` 是可选的。然而，如果你想在多个地方使用\
  \ `enum` 类型，最好使用另一种 `enum` 声明方式：\n\n### （或）\n\n![](img/image01335.jpeg)\n\n• 在第二种情况下，`enum-type-name`\
  \ 不能省略。\n\n### 示例：\n\n```cpp\nenum shape{circle,triangle,circle}; enum color{yellow,blue,white,red};\
  \ enum position{off,on};\n```\n\n• 与 `C` 相比，C++` 中的枚举数据类型略有不同。在 `C++` 中，标签名 `shape`、`color`、`position`\
  \ 变成了新的类型名。\n* 通过使用这些标签名，我们可以声明新变量。`shape ellipse;//ellipse 的类型是 shape` / `color\
  \ background;//background 的类型是 color`\n* `C` 定义枚举的类型为 `ints`。\n* 在 `C++` 中，每个枚举数据类型保留其自身的独立类型，即\
  \ `C++` 不允许将 `int` 值自动转换为 `enum` 值。\n\n### 示例：\n\n```cpp\ncolor background = blue;//允许\n\
  color background = 7;//C++ 中错误\ncolor background = (color) 7; //可以\n```\n\n* 枚举值可以代替\
  \ `int` 值使用。`int c = red;// 有效，`color` 类型提升为 `int`\n* 默认情况下，枚举成员被分配从 `0` 开始的整数值，每个后续的枚举成员都比前一个值大一，除非你显式地为某个枚举成员指定值，即：我们可以通过显式为枚举成员分配整数值来覆盖默认值。\n\
  * 枚举成员在枚举内部不需要具有唯一的值。\n* 每个枚举成员的名字被视为常量，并且在定义 `enum` 的作用域内必须是唯一的。\n* 枚举成员可以提升为整数值。\n\
  \n### 示例：\n\n```cpp\nEnum color{red,blue=5,green=9}; Enum color{red=5,blue,green};\n\
  ```\n\n注意：后续初始化的枚举成员比其前一个成员大一。\n* `C++` 也允许创建匿名枚举（即没有标签名的枚举）。\n\n### 示例：\n\n```cpp\n\
  enum{off,on};\n```\n\n在这里，`off` 是 `0`，`on` 是 `1`。这些常量可以像普通常量一样的方式被引用。\n\n```cpp\n\
  int switch_1=off; int switch_2=on;\n```\n\n### 特性：\n\n• 一个枚举集合可以包含重复的常量值。例如，你可以在同一个集合中将值\
  \ `0` 与两个不同的标识符关联。\n* 枚举列表中的标识符必须与相同作用域内具有相同可见性的标识符区分开，包括普通变量名和其他枚举列表中的标识符。\n* 枚举标签遵循正常的作用域规则。它们必须与具有相同可见性的其他枚举、结构和\
  \ union 标签区分。\n\n### 函数\n\n函数是 `C++` 程序的构建块。函数将若干程序语句分组为一个单一单元。该单元可以从程序的其他部分调用。\n\
  \n* 即使算法可用，实现一个大型程序也是困难的。\n* 为了简单地实现这样的程序，应该将其拆分成若干独立的任务，这些任务可以被容易设计、实现和管理。\n* 将大型程序拆分为小的、易于管理的任务并进行独立设计的过程被称为模块化编程。\n\
  * 程序中重复的指令组可以组织成函数。\n* 函数是一组可以独立处理的程序语句。\n* 成员函数\n* 主函数\n* 函数原型声明\n* 引用传递\n* 引用返回\n\
  * 内联函数\n* 默认参数\n* 常量参数\n* 函数重载\n* 友函数和虚函数\n\n### //默认参数\n\n```cpp\n#include<iostream.h>\
  \ \n#include<conio.h> \nclass abc\n{\npublic:\n};\n```\n\n```cpp\nvoid abc::sum(int\
  \ a, int b, int c)\n{\n    int d=a+b+c;\n}\n```\n\n### 作用域：\n\n在 `C` 中，无法从块内部访问全局版本的变量。`C++`\
  \ 通过引入 `::` 运算符解决了这个问题。\n\n示例：\n\n```cpp\n#include<iostream>\nint m=10;\nvoid main()\n\
  {\n    int m=20;\n    cout << ::m;\n}\n```\n\n### 命名空间：\n\n它用于定义名称定义的上下文。示例：\n\n\
  ```cpp\n#include <iostream>\nusing namespace std;\n\nnamespace first_space\n{\n\
  \    void func(){\n        cout << \"Inside first_space\" << endl;\n    }\n}\n\n\
  namespace second_space\n{\n    void func(){\n        cout << \"Inside second_space\"\
  \ << endl;\n    }\n}\n\nint main()\n{\n    first_space::func();\n    second_space::func();\n\
  \    return 0;\n}\n```\n\n### 源文件与程序\n\n以上示例。使用类 – 类定义：\n\n类可以被描述为带有成员的数据集合。`C++`\
  \ 将数据和函数关联到一个单元的属性被称为封装。有时类不包含任何数据成员或成员函数，称为空类。\n\n类的定义的语法：\n\n![](img/image0136.jpeg)关键字\n\
  \n![](img/image0137.jpeg)类 `classname`\n\n{\n用户定义的类名\n}; 类结束需要分号\n\n可以使用一个语句创建多个对象，如\
  \ `Class s1,s2,s3;` 或 `Student s1,s2,s3;`。也可以通过在大括号后放置这些名称来创建对象。因此定义：\n\n```cpp\n\
  Class student\n} s1,s2,s3;\n```\n\n访问类成员：\n\n一旦了类的对象，必须访问其成员。这是通过成员访问运算符 `.` 实现的。\n\
  \n![](img/image0138.jpeg)[](Images/image0139.jpeg)语法：访问类的数据成员 `对象名 . 数据成员`\n\n![](img/image0140.jpeg)类定义的对象\
  \ 成员访问指示符\n\n1 类的数据成员\n\n访问成员函数的语法：\n\n![](img/image0141.jpeg)[](Images/image0142.jpeg)[](Images/image0143.jpeg)[](Images/image0144.jpeg)`对象名.函数名\
  \ (实际参数)`\n\n类定义的对象 成员访问指示符\n\n传递函数的参数 例如：`s1.setdata(10, “Ram”); s1.outdata( )`\n\
  \n对象 `s1` 可以分别用于访问成员函数 `setdata` 和 `outdata`。\n\n考虑以下程序\n\n```cpp\n#include <iostream.h>\
  \ \n#include <string.h> \nclass student\n\n{\nprivate:\nint roll_no; char  name[20];\n\
  \npublic:\nvoid setdata(int roll_no_in, char name_in)\n{\n\nroll_no = roll_no_in;\
  \ strcpy(name, name_in);\n}\n\nvoid  outdata(  )//显示数据  成员\n{\n```\n\n\n\n\n\n```cpp\n\
  cout<<”rollno = “<< roll_no <<endl; cout<<”name = “ << name << endl;\n\n}\n\n};\n\
  \nvoid main( )\n\n{\n\nstudent s1; s1.setdata(1, “Ram”);\n\ns2.setdata(10,”Kumar”);\
  \ cout<<”Student details . . .”<<endl; s1.outdata(  );\n\ns2.outdata(  );\n\n}\n\
  ```\n\n**输出:**\n```\nStudent details Rollno = 1 Name = Ram Rollno = 10 Name = Kumar\n\
  ```\n\n### 客户端-服务器模型\n\n客户端寻求服务，而服务器提供由客户端请求的服务。在上面的示例中，`student` 类类似于服务器，而 `student`\
  \ 类的对象类似于客户端。它们通过发送消息来调用服务器。\n\n在以下语句中：\n```cpp\ns2.setdata(10, “kumar”);\n```\n\
  \n对象 `s2` 向服务器请求带有参数 `10` 和 `kumar` 的消息 `setdata`，服务器接受这些消息并执行操作，并在客户端调用 `outdata(\
  \ )` 函数时显示结果。\n\n### 定义成员函数\n\n类的数据成员必须在类体内部声明，而类的成员函数可以通过以下任何一种方式定义：\n\n*   在类规范内部\n\
  *   在类规范外部\n\n成员函数定义的语法取决于它是在类规范内部定义还是外部定义的，但它们执行的操作是相同的。\n\n#### (a) 类体内部的成员函数\n\
  \n所有在类体内部定义的成员函数。例如：\n```cpp\nClass classname\n\n{\n\nprivate:\nint age;\nint  setage(int\
  \  agein);//成员  函数\n{\nage  =  agein;//函数体\n}\n\n……….. public:\n\nint b;\nvoid rect(\
  \ )\n{\n. .  ...//函数体\n}\n\n};\n```\n\n#### (b) 类体外部的成员函数\n\n在类体内部声明函数原型，然后在类体外部定义它。这是通过使用“作用域解析运算符”（`::`）来实现的。它充当标识标签，用于通知编译器该函数属于哪个类。\n\
  \n**语法：**\n```cpp\nclass classname\n\n{\n\n. . . .\nReturntype  memberfunction \
  \ (arguments);//函数  声明\n. . . .\n};\n\nreturntype classname ::  memberfunction \
  \ (arguments)//函数定义\n{\n//函数体\n}\n```\n\n### 在类内部访问成员函数\n\n类的成员通过该类的对象使用点运算符`.`来访问。\n\
  \n**示例：**\n```cpp\n#include <iostream.h> class number\n\n{\n\nint  num1, num2;//默认为私有\
  \ public:\nvoid read( )\n{\ncout<<”Enter first number: “); cin>>num1;\ncout<<”Enter\
  \ second number: “); cin>>num2;\n}\n\nint max( )\n{\nif(num1>num2)\nreturn num1;\n\
  else\n}\nreturn num2;\n//成员函数的嵌套 void showmax( )\n{\ncout<<”maximum = “<<max( )\
  \ ;\n}\n\n};\n\nvoid main( )\n\n{\n}\n```\n\n**输出:**\n```\nnumber n1; n1.read( );\n\
  n1.showmax( );\nEnter first number : 5 Enter second number : 10 Maximum =  10\n\
  ```\n\n类的成员函数可以调用其所属类的任何其他成员函数，这被称为“成员函数的嵌套”。\n\n### 数据隐藏\n\n数据被隐藏在类内部，因此无法进行未经授权的访问，这是\
  \ OOP 的特性。\n\n类中定义的所有数据和函数默认都是私有的（private）。通常情况下，数据成员被声明为私有，成员函数被声明为公共（public）。\n\
  \n**数据隐藏的方法：**\n\n*   私有（Private）\n*   公共（Public）\n*   受保护（Protected）\n\n这些关键字被称为访问控制说明符。\n\
  \n#### 私有成员（Private members）：\n\n只有同一类的成员函数可以访问这些成员。\n类的私有成员在类外部是不可访问的。\n\n```cpp\n\
  Class person\n\n{\nprivate:\nint age;//私有数据 int  getage(  )://私有  函数\n. . .  .\n\
  }\n\nperson p1;\na  =  p1.age;//无法访问私有数据 //错误 p1.getage(  );//错误访问\n```\n即，我们可以通过对象来访问私有成员。\n\
  \n#### 受保护成员（Protected member）：\n\n受保护成员的访问控制与私有成员相似。受保护成员的访问控制如下所示：\n\n```cpp\n\
  Class person\n\n{\nprotected:\n. . .  .\nint age;//受保护数据 int  getage(  )://受保护 \
  \ 函数\n. . .  .\n};\n```\n![](img/image01345.jpeg)\n`person p1; a = p1.age;` `p1.getage(\
  \ );`\n\n#### 公共成员（Public Members）\n\n无法访问受保护成员\n类中公共部分声明的所有数据成员和函数都可以从程序的任何地方无限制地访问。\n\
  \n**示例：**\n```cpp\nClass person{\npublic:\n}\nint age;//公共  数据\nint  getage(  );//public\
  \  函数\nperson p1;\na  =  p1.age;//可以访问公共数据 p1.getage(  );//可以访问公共  函数\n```\n\n###\
  \ 成员函数的嵌套\n\n类的成员函数可以调用其所属类的任何其他成员函数，这被称为“成员函数的嵌套”。通过使用点运算符调用类中的成员函数。\n\n考虑以下示例：\n\
  ```cpp\n#include <iostream.h> class set\n\n{\nm,n; public:\nvoid input( )\n\ndisplay(\
  \ );\n};\n\nvoid set:: input( )\n{\nif(m>n)\nreturn m;\nelse\n}\nreturn n;\n}\n\n\
  void set:: display( )\n{\ncout<<m;\n}\n```\n这是成员函数的嵌套。\n\n### 数组（Arrays）\n\n数组可以作为类的一部分使用。\n\
  \n**示例：**\n```cpp\nClass abc\n\n{\nint a[size]//a 是数组\nsizepublic:\nsize;\n};\n\
  ```\n\n### 内联函数（Inline function）\n\n使用函数的主要目的是为了节省内存空间，然而每次函数被调用时，都需要花费额外的时间执行任务。为了解决这个问题，C++\
  \ 提出了一种新功能：内联函数。内联函数是在被调用时由编译器将函数调用替换为相应的代码。\n\n内联函数可以如下定义：\n![](img/image346.jpeg)\n\
  \n**示例：**\n```cpp\ninline int cube(int a)\n{\nreturn (a*a*a);\n}\n```\n上述内联函数可以通过语句调用：\n\
  ```cpp\nc = cube(3);\nd = cube(2+2);\n```\n对于 c 和 d，上述的输出分别为 27 和 64。\n\n要使函数变为内联，只需为函数定义加上\
  \ `inline` 关键字。所有内联函数必须在调用之前定义。记住，`inline` 关键字只是向编译器发送一个请求，而不是命令。如果函数定义过长或复杂，编译器可能会忽略此请求将其编译为普通函数。\n\
  \n内联函数在某些情况下可能不起作用：\n\n*   对于返回值的函数存在循环、switch 或 goto。\n*   对于返回值的函数存在 return 语句。\n\
  *   如果函数包含静态变量。\n*   如果内联函数是递归的。\n\n**示例程序：**\n```cpp\n/*使用内联函数对不同数据类型进行乘法和平法的程序*/\n\
  #include<iostream.h> #include<conio.h> class inlinefunc\n\n{\nint a,b; float c,d;\
  \ public:\nvoid multiply(); void divide();\n};inline void inlinefunc::  multiply()\n\
  {\ncout<<\"Enter 2 integers:\"; cin>>a>>b;\nint x=a*b; cout<<x;\n}\n\ninline void\
  \ inlinefunc::divide()\n{\n}\n\nvoid main()\n{\ncout<<endl<<\"Enter 2 float values:\"\
  ; cin>>c>>d;\nfloat y=c/d; cout<<y;\n\ninlinefunc f; clrscr();\nf.multiply();\n\
  f.divide();\n\ngetch();\n}\n```\n\n### 空类（Empty classes / Stubs）\n\n使用类的主要目的是封装数据和代码，然而，可以拥有一个既没有数据也没有代码的类。换句话说，可以空类。\n\
  \n\n\n\n空类的声明如下：\n\n```cpp\nClass xyz\n{\n\n};\n\nClass abc\n{\n\n};\n```\n\n此类空类也称为存根（stubs）。它们用于创建类模板。\n\
  \n## 传递对象参数：\n\n* 可以存在接受类对象作为参数的函数，就像存在接受其他变量作为参数的函数一样。\n*可以通过以下方式将对象作为参数传递给函数：\
  \ \n    1. 按值传递对象：将整个对象的拷贝传递给函数。\n    2. 按引用传递对象：仅将对象的地址隐式地传递给函数。\n    3. 按指针传递对象：将对象的地址显式地传递给函数。\n\
  \n### 按值传递对象\n\n在这种情况下，对象的拷贝被传递给函数，在函数内部对对象进行的任何修改都不会反映在调用该函数的对象上。\n\n示例： \n```cpp\n\
  #include<iostream.h> \nclass test\n{\n    int m1,m2; \n    public:\n    void get()\n\
  \    {\n        cin>>m1>>m2;\n    }\n    void read(test t3)\n    {\n        m1=t3.m1;\
  \ m2=t3.m2;\n    }\n    void display()\n    {\n        cout<<m1<<m2;\n    }\n};\n\
  \nvoid main()\n{\n    test t1;\n    cout<<”Enter Ist object data”; t1.get();\n \
  \   cout<<”display Ist object data”; t1.display();\n    test t2;\n    cout<<”copy\
  \ of object1 to object2”; t2.read(t1);\n    cout<<”display 2nd object data”; t2.display();\n\
  }\n```\n\n运行：\n```\nEnter Ist object data 34\n56\ndisplay Ist object data 34\n56\n\
  copy of object1 to object2 display 2nd object data 34\n56\n```\n\n`t1` 的成员被拷贝到 `t2`\
  \ 中。对对象 `t1` 和 `t2` 数据成员所做的任何修改对于调用者的实际参数都是不可见的。\n\n### 按引用传递对象：\n\n按引用传递的对象的访问性与按值传递的对象相似。在调用函数中对此类对象进行的修改也会反映在调用函数中。\n\
  \n示例： \n```cpp\n#include<iostream.h> \nclass test\n{\n    int m1,m2; \n    public:\n\
  \    void get()\n    {\n        cin>>m1>>m2;\n    }\n    void read(test &t3)\n \
  \   {\n        m1=t3.m1; m2=t3.m2;\n    }\n    void display()\n    {\n        cout<<m1<<m2;\n\
  \    }\n};\n\nvoid main()\n{\n    test t1;\n    cout<<”Enter Ist object data”; t1.get();\n\
  \    cout<<”display Ist object data”; t1.display();\n    test t2;\n    cout<<”copy\
  \ of object1 to object2”; t2.read(t1);\n    cout<<”display 2nd object data”; t2.display();\n\
  }\n```\n\n运行：\n```\nEnter Ist object data 34\n56\ndisplay Ist object data 34\n56\n\
  copy of object1 to object2 display 2nd object data 34\n56\n```\n\n## 构造函数\n\n* 构造函数是一个特殊的成员函数，用于初始化对象数据成员并为它们分配必要的资源。\n\
  * 构造构造函数需要遵循的规则：\n    1. 构造函数应该声明在 `public` 区域。\n    2. 它们在对象创建时被自动调用。\n    3. 它们没有返回值类型，甚至不允许使用\
  \ `void`。\n    4. 它的名称与它所属的类名相同。\n\n### 语法\n\n```cpp\nclass classname\n{\n    …………\n\
  \    ………… \n    public: \n    classname()\n    {\n        //构造函数体\n    }\n};\n```\n\
  \n### 构造函数的类型\n\n1. 默认构造函数\n2. 参数构造函数\n3. 拷贝构造函数\n\n### 默认构造函数：\n\n不显式接受参数的构造函数被称为默认构造函数。\n\
  \n示例：\n```cpp\n#include<iostream.h> \nclass test\n{\n    int m1,m2; \n    public:\
  \ \n    test()\n    { \n        m1=50; m2=25;\n    }\n    void display()\n    {\n\
  \        cout<<m1<<m2;\n    }\n};\n\nvoid main()\n{\n    test t1; //调用默认构造函数 \n\
  \    cout<<”Initialized data members”; t1.display();\n}\n```\n\n运行：\n```\nInitialized\
  \ data members\n50 25\n```\n\n### 参数构造函数：\n\n构造函数可以带参数被调用。参数列表可以在大括号内指定，类似于函数中的参数列表。带参数的构造函数被称为参数化构造函数。\n\
  \n示例：\n```cpp\n#include<iostream.h> \nclass test\n{\n    int m1,m2; \n    public:\n\
  \    test(int,int);//构造函数声明 \n    void display()\n    {\n        cout<<m1<<m2;\n\
  \    }\n};\n\ntest::test(int x,int y)//构造函数定义\n{\n    m1=x; m2=y;\n}\n\nvoid main()\n\
  {\n    test t1(50,100);//参数化构造函数调用 \n    test t2(80,90);\n    cout<<”Initialized\
  \ data members”; t1.display();\n    cout<<”Initialized data members”; t2.display();\n\
  }\n```\n*(注：原文示例中 main 函数逻辑略有错乱，此处已根据语意翻译并对齐结构)*\n\n由于原文文本中存在部分重复和格式错乱，已根据您的要求对提供的英文文本进行了逻辑翻译，并保留了所有\
  \ Markdown 格式。\n\n\n\n\n因此，构造函数在创建对象时被调用，取决于传递参数的数量和类型。\n\n在创建类 `account` 的对象期间，调用不同构造函数的情况：\n\
  \n```cpp\nclass account\n{\npublic:\n    account(); account(int an);\n    account(int\
  \ acvalue,float bal);\n………………\n};\n```\n\n`accout acc1; account acc2(45); account\
  \ acc3(324,675.50);`\n\n### 拷贝构造函数：\n\n- 拷贝构造函数用于从另一个对象声明并初始化对象（即将所有数据从一个对象拷贝到另一个对象）。\n\
  - 例如：`integer obj2(obj1);`。上述语句定义了对象 `obj2` 并同时初始化或拷贝了‘obj1’的值。\n- 该语句的另一种形式是 `Integer\
  \ obj2=obj1;`。\n- 通过拷贝构造函数初始化的过程被称为拷贝初始化。\n- “拷贝构造函数接受一个与自身同类对象的引用作为参数。”\n- 示例：\n\
  ```cpp\n#include<iostream.h> \nclass code\n{\n    int id; \npublic:\n    code()\
  \ {}\n    code( int a) { id=a; }\n    code( code &x) { id=x.id; }\n};\n\nvoid main(\
  \ )\n{\n    code A(100); code B(A); code C=A; code D; D=A;\n    cout<<” Id of A\
  \ object is:”; A.display();\n    cout<<” Id of B object is:”; B.display();\n   \
  \ cout<<” Id of C object is:”; C.display();\n    cout<<” Id of D object is:”; D.display();\n\
  }\n```\n**输出：**\n`Id of A object is:100 Id of B object is:100 Id of C object is:100\
  \ Id of D object is:100`\n\n**解释：**\n- 在此程序中，每当调用带参数构造函数时，主程序都会传递值 `100`。\n- 现在，通过语句\
  \ `code B(A)`，可以将对象 `A` 中包含的数据拷贝到对象 `B` 中。\n- 这些数据可以通过引用被对象 `X` 接收。这里 `A` 应该作为实际参数，而\
  \ `x` 应该作为形式参数，也就是说对实际参数的更改应该反映在形式参数中，因为这是一个拷贝构造函数。\n\n### 析构函数\n\n- 当对象不再被需要时，它可以被销毁。\n\
  - 一个类可以有另一个特殊的成员函数，称为析构函数，它在对象被销毁时被调用。\n- 析构函数是一个具有字符 `~`（波浪号）后跟其类名和括号的成员函数。\n-\
  \ 它应该如下声明：`~classname( );`。\n- 当对象超出作用范围且不再需要时，可以自动调用析构函数。\n- 一般格式：\n```cpp\nclass\
  \ classname\n{\n    …………\n    ………….. // 私有成员\npublic:\n    ~classname( ); // 析构函数原型或声明\n\
  };\n\nclass name :: ~ classname( )\n{\n    // 析构函数体定义\n}\n```\n\n#### 定义析构函数的规则：\n\
  - 析构函数名与类名相同，但带有波浪号(`~`)。\n- 与构造函数不同，析构函数不接受任何参数。\n- 析构函数没有构造函数那样的返回类型，因为它在对象超出作用范围时自动调用。\n\
  - 析构函数必须声明在类的公共（public）部分，以便其所有用户访问。\n- 每个类只能有一个析构函数。无法进行重载。\n\n示例程序：\n```cpp\n\
  #include< iostream.h> \nint count =0;\n\nclass test\n{\npublic: \n    test( );\n\
  \    ~test ( );\n};\n\ntest::test( )\n{\n    count ++;\n    cout<< “object “<< count<<”constructor\
  \ of test is called”:\n}\n\ntest::~test( )\n{\n    cout<< “object “<< count<<” Destructor\
  \ of test is called”: count--;\n}\n\nvoid main()\n{\n    test x; // 构造函数调用\n   \
  \ {\n        test y; // 构造函数调用\n    }\n}\n```\n**输出：**\n`object 1 constructor of\
  \ test is called object 2 constructor of test is called object 2 destructor of test\
  \ is called object 1 destructor of test is called`\n\n在上述程序每当创建对象时，都会调用相应的构造函数。程序结束后，对象超出了范围(scope)，自动调用析构函数。\n\
  \n### 运行时内存分配/ NEW、DELETE 运算符\n\n- 每当定义数组时，编译时会设置指定数量的内存，这可能无法充分或不足。\n- 如果出现编译时未知所需内存的情况，可以在执行期间进行内存分配。\n\
  - 在在运行时分配内存的技术被称为动态内存分配。\n- C 提供了两个特殊运算符来执行内存管理：\n    - 用于动态内存分配的 `new` 运算符。\n \
  \   - 用于动态释放的 `delete` 运算符。\n\n#### new 运算符\n`new` 运算符为变量和对象提供动态内存分配。\n一般格式：`Pointer\
  \ variable = new datatype;`\n- 这里是 `datatype` 的指针。`New` 运算符为变量分配足够的内存。\n- 指针变量持有分配的内存地址。\n\
  - 示例：`p=new int; q= new float;` 其中 `p` 是 `int` 类型指针，`q` 是 `float` 类型。\n这里，`p` &\
  \ `q` 是指针变量，我们必须将其声明为指针变量：`int *p; float *q;`。\n可以将指针的声明和赋值组合：`int *p=new int; float\
  \ *q = new float;` 随后我们使用语句 `*p=32; *q=5.5;` 将 `32` 分配给新创建的 `int` 对象，将 `5.5` 分配给\
  \ float 对象。\n\n带初始化的内存分配：`Pointer variable= new datatype(value);`\n示例：`int *p=new\
  \ int(32); float *q = new float(5.5);`。\n\n一维数组的内存分配：`Pointer variable= new datatype\
  \ [ size ];`\n示例：`int *p=new int[20];` 为 20 个整数的数组创建一个内存空间。`P[0]` 指第一个元素，`p[1]`\
  \ 指第二个，以此类推。\n\n示例：\n```cpp\nvoid main( )\n{\n    int n;\n    cout<<”enter no of\
  \ elements to be processed”; cin>>n;\n    int *pt= new int[  n];//运行时为变量 pt 分配空间\n\
  \    cout<<”enter  elements”;\n    for(int i=0;i<n;i++)\n    {\n        cin>>pt[i];\n\
  \    }\n    cout<<”display elements”; for(int i=0;i<n;i++)\n    {\n        cout<<pt[i];\n\
  \    }\n}\n```\n**运行：**\n`enter no of elements to be processed 5`\n`enter the elements\
  \ 43 56 54 23 67`\n`display elements 43 56 54 23 67`\n\n#### delete 运算符：\n当数据对象不再需要时，将其销毁以释放内存空间重用。\n\
  一般格式：`delete pointer variable;`\n`pointer variable` 是指向用 `new` 运算符创建的数据对象的指针。\n\
  示例：`delete p; delete q;`。\n如果我们想释放动态分配的数组，一般格式：`delete [size] pointer variable;`\
  \ 其中 `size` 指定要释放的数组元素数量。\n上述示例程序的示例：`delete [n] pt;`。\n\n#### this 指针：\n`this`\
  \ 指针作为隐藏参数传递给所有非成员函数调用，并在所有非静态函数的体内作为局部变量可用。`this` 指针是一个常量指针，持有当前对象的内存地址。`this`\
  \ 指针在静态成员函数中不可，因为静态成员函数可以在没有对象（通过类名）的情况下调用。\n\n示例：\n```cpp\n#include<iostream.h>\
  \ #include<conio.h>\nclass add\n{\n    int a; \npublic:\n    add(int x) { a=x; }\n\
  \    void sum() { this->a=this->a+4; }\n    void display() { cout<<\"\\na=\"<<this->a;\
  \ }\n};\n\nvoid main()\n{\n    clrscr();\n    add ob(3);\n    ob.display();\n  \
  \  ob.sum();\n    ob.display();\n    getch();\n}\n```\n**输出：**\n`a=3 a=7`\n\n带返回返回的\
  \ this 指针：\n```cpp\n#include<iostream.h> #include<conio.h>\nclass add\n{\n    int\
  \ a; \npublic:\n    add(int x) { a=x; }\n    add*  sum() { this->a=this->a+4; return(this)\
  \ }\n    void display() { cout<<\"\\na=\"<<this->a; }\n};\n\nvoid main()\n{\n  \
  \  clrscr(); add obj(3);\n    add *ob=&obj; ob->display(); ob=ob->sum(); ob->display();\n\
  }\n```\n**输出：**\n`a=3 a=7`\n\n友元函数和友类\n\n\n\n\n\n### 定义\n使用 `friend` 关键字声明的函数称为友函数（friend\
  \ function），即对两个类都具有“友元”关系的普通函数，从而允许该函数访问这些类的私有数据。\n\n## 友函数的特殊性质\n- `friend 函数`的的作用域不受限制\n\
  - `friend 函数`不能通过该类的对象来调用\n- `friend 函数`可以访问私有（private）和公共（public）数据成员\n- `friend\
  \ 函数`可以在私有区域或公共区域声明，而不会影响其含义。\n\n要使一个外部函数成为某个类的友，我们只需要像下面所示将该函数声明为该类的友即可：\n\n```cpp\n\
  class ABC\n{\n……..\n……… public:\n……\n…….\nfriend void display( ); // 声明;\n};\n```\n\
  \n## 示例\n```cpp\n#include <iostream.h> \nclass sample\n{\n    int x,y; \npublic:\n\
  \    void getvalue()\n    {\n        x=50; y=40;\n    }\n    friend void display(\
  \ sample a);\n};\n\nvoid display( sample a)\n{\n    cout<<a. x<< b. y;\n}\n\nvoid\
  \ main( )\n{\n    ABC obj1;\n    obj1\\. getvalue( ); display( obj1);\n}\n```\n\
  程序的输出将为：50 40\n\n- 函数通过使用点运算符和传递给它的对象来访问类变量 `x` 和 `y`。\n- 函数调用 `display(obj1)` 将对象\
  \ `obj1` 按值传递给友函数。\n\n## 带有友函数的类\n考虑操作两个不同类对象的情况，在这种情况下，可以使用友函数来桥接这两个类。\n\n## 示例\n\
  ```cpp\n#include<iostream.h>\nclass result; // 提前声明类 test\n{\n    int n1,n2; \n\
  public:\n    void getmark( )\n    { \n        n1=45; n2=78;\n    }\n    friend void\
  \ display(  test,  result);// 友函数声明\n};\n\nclass result\n{\n    int tot; \npublic:\n\
  \    friend  void  display(test,result);// 友函数声明\n};\n\nvoid display( test t, result\
  \ r)\n{\n    ot=  t.n1+t.n2;// 使用 t 对象访问 test 类的私有成员 cout<<r.  tot;\n}\n\nvoid main(\
  \  )\n{\n    test t; result r;\n    t.getmark(  );\n    display( t,  r);\n}\n```\n\
  \n### 解释\n- 程序包含两个类：`test` 和 `result`。\n- `display` 函数是友函数，用于访问两个类的私有数据成员。\n- 友函数的声明可以放在类的私有区域，也可以放在公共区域。\n\
  - 每个类的对象都已作为参数传递给函数 `display()`。\n- 它可以通过这些参数访问两个类的私有成员。\n- 在程序开头对类 `result;` 的提前声明是必要的，因为一个类在类\
  \ `test` 声明之前是无法被引用的。\n\n## 友函数的用途\n1. 对两个不同类的对象进行操作。\n2. 友函数可以用来增加重载运算符的通用性。\n\n\
  ## 友元类\n### 定义\n另一个类中所有操作或使用友元类私有成员的函数。\n\n## 示例\n```cpp\n#include<iostream.h> \n\
  class two;\n\nclass one\n{\nprivate:\n    int x, y;\npublic:\n    void setdata(int\
  \ a, int b)\n    {\n        x=a; y=b;\n    }\n    friend class two;\n};\n\nclass\
  \ two\n{\n    int z; \npublic:\n    void addone(one obj)\n    {\n        z= obj.\
  \ x + obj . y;\n    }\n    void display(one obj )\n    {\n        cout<<”X is: “<<obj.x<<”Y\
  \  is:”<<obj.y;\n        cout<< “sum of one class data members”<< z;\n    }\n};\n\
  \nvoid main( )\n{\n    one obj1; two obj2;\n    obj1\\. setdata( 45,65); obj2. addone(obj1);\
  \ obj2\\. display( obj1);\n}\n```\n**运行**\n```\nX is:  45\nY is:  65\nsum of one\
  \ class data members: 110\n```\n\n### 解释\n- 类 `two` 是类 `one` 的友元，因此在类 `two` 的成员函数中可以使用类\
  \ `one` 对象访问类 `one` 的所有私有成员。\n- 这里 `addone()` 和 `display()` 函数使用了类 `one` 的私有数据成员。因此这两个函数都以类\
  \ `one` 对象作为参数。\n\n## 函数重载\n- 可以定义多个同名但执行不同操作的函数。\n- 它有助于减少对不寻函数名的需求，使代码更易读。\n-\
  \ 这可以通过函数多态或函数重载的概念来实现。\n- 函数重载允许多个函数具有不同的参数类型共享相同的名称。\n- 函数多态意味着函数定义可以有多种形式。定义必须仅在参数的数量和类型上不同。\n\
