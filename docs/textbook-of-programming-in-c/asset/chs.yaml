  \n**更正：原文中的 `swap` 示例似乎存在排版错误或截断，此处按要求保留其 Markdown 格式翻译。**\n\n\n\n\n\n* 运算符重载（Operator\
  \ overloading）是对现有运算符进行重载的概念。\n* 运算符重载允许我们为运算符分配多个含义。\n* 被重载的运算符被称为运算符函数。\n* C++\
  \ 语言使用关键字 `operator` 来对运算符进行重载。\n* 你通过在运算符前加上 `operator` 关键字来声明一个运算符函数。\n* `operator`\
  \ 关键字用于重载内置运算符。\n* 重载的运算符与重载的函数是有区别的。\n* 运算符重载是指：当在一个或多个变量上使用相应的运算符时，告诉编译器如何执行特定操作的能力。\n\
  * 我们可以重载（赋予额外的含义）所有的 C++ 运算符，但以下外：\n\n| 序号 | 运算符 | 含义 |\n| :--- | :--- | :--- |\n\
  | 1. | `.` | 类成员访问运算符 |\n| 2. | `.*` | 成员指针访问运算符 |\n| 3. | `::` | 作用域解析运算符 |\n|\
  \ 4. | `size of` | 大小运算符 |\n| 5. | `?:` | 条件运算符 |\n| 6. | `#` | 预处理器转为字符串 |\n| 7.\
  \ | `##` | 预处理器连接 |\n\n表：不能重载的运算符\n\n* 与大量符合运算符重载定义的运算符相比，这些被排除的运算符非常少。\n\n**注意：**\
  \ 尽管运算符的语义可以扩展，但我们无法改变它的语法，以及控制其使用的规则（例如操作数的个数、优先级和结合性）。（例如，乘法运算符的优先级将高于加法运算符）\n\
  \n* 记住，当一个运算符被重载时，它的原始意含义并不会丢失。\n\n## 可重载运算符\n\n* C++ 提供了各种运算符，用于对各种操作数执行操作。\n*\
  \ 根据运算符所操作的操作数数量，可以将运算符分为一元运算符和二元运算符。\n* C++ 允许几乎所有运算符被重载，在这种情况下，至少有一个操作数必须是类的一个实例（对象）。\n\
  \n| 序号 | 运算符类别 | 运算符 |\n| :--- | :--- | :--- |\n| 1. | 算术 | `+`, `-`, `*`, `/`,\
  \ `%` |\n| 2. | 位运算 | `&`, `|`, `~`, `^` |\n| 3. | 逻辑 | `&&`, `||`, `!` |\n| 4.\
  \ | 关系 | `>`, `<`, `++`, `!=`, `<=`, `>=` |\n| 5. | 赋值 | `=` |\n| 6. | 算术赋值 | `+=`,\
  \ `-=`, `+=`, `/=`, `%=`, `&=`, `|=`, `^=` |\n| 7. | 移位 | `<<`, `>>`, `<<=`, `>>=`\
  \ |\n| 8. | 一元增减 | `++`, `--` |\n| 9. | 下标 | `[]` |\n| 10. | 函数调用 | `()` |\n| 11.\
  \ | 解引用 | `->` |\n| 12. | 一元符号前缀 | `+`, `-` |\n| 13. | 分配与释放 | `new`, `delete` |\n\
  \n表。C++ 可重载运算符\n\n### 示例：\n\n编译器对减法运算符 `-` 的处理方式取决于该运算符的使用方式。\n\n* 当它放在数值的左侧（如 `-48`）时，编译器将该数字视为负值。\n\
  * 当用于两个整数值之间时（如 `80-712`），编译器执行减法操作。\n* 当用于一个整数和一个双精度浮点数之间时（如 `558-9.27`），编译器将用右侧数减去左侧数；该操作产生一个双精度浮点数。\n\
  * 当 `-` 符号双写并放在变量的一侧时（例如 `--Variable` 或 `Variable--`），变量的值需要减 1；换句话说，应该从该值中减去 1。\n\
  \n`*` 运算符应用于指针变量时，给出指针所指向的值。但它也常用于乘法。\n\n* 因此，操作数的数量和类型决定了后续操作的性质。\n\n`<<` 和 `>>`\
  \ 等输入输出操作是运算符重载的良好示例。\n\n* `<<`: 内置定义用于位移。\n* 但在 C++ 中，它用于显示值。\n* 同样地，我们可以为所有其他\
  \ C++ 运算符定义额外的含义。\n\n## operator 关键字\n\n* `operator` 关键字促进了 C++ 运算符的重载。\n* `operator`\
  \ 关键字指示其后的运算符符号是待重载的 C++ 运算符，用于对其类的成员进行操作。\n* 要为运算符定义额外任务，我们必须指定它相对于所应用的类具有什么含义。\n\
  * 这是通过一个特殊的函数（称为运算符函数）来实现的，该函数描述了该\n\n```cpp\nreturn_type operatorop(arglist)\n\
  {\n    body of operator function//定义的任务\n}\n```\n图 运算符重载的语法\n\n其中，\n* `return_type`\
  \ 是指定操作返回值的类型。\n* `Op` 是被重载的运算符，即运算符符号。\n* `Op` 前面伴有关键字 `operator`。\n* `Operator\
  \ op` 是函数名。\n\n示例：\n```cpp\nint operator+(int a, int b)\n{\n    return a+b;\n}\n\
  ```\n\n### 重载过程\n\n* 创建一个类。\n* 在类的公共部分声明运算符函数。它可以是成员函数或友元函数。\n* 定义运算符所需的操作。\n\n\
  ### 运算符重载的类型\n\n* 一元重载\n* 二元重载\n\n## 一元运算符\n\n* 一元运算符作用于一个操作数。\n* 调用运算符的语法是 `operator`。\n\
  * 不带参数的重载被称为一元重载。\n* 常用的一元运算符有减 (--) 和增 (++)。\n\n示例：\n```cpp\n#include<iostream.h>\n\
  #include<conio.h>\n\nclass unary\n{\n    int x, y, z;\npublic:\n    void getdata()\n\
  \    {\n        cout<<\"Enter the x,y,z values: \";\n        cin>>x>>y>>z;\n   \
  \ }\n    void display()\n    {\n        cout<<x<<\"\\t\"<<y<<\"\\t\"<<z;\n    }\n\
  \    void operator-();\n};\n\nvoid unary::operator-()\n{\n    x=-x;\n    y=-y;\n\
  \    z=-z;\n}\n\nvoid main()\n{\n    clrscr();\n    unary ob;\n    ob.getdata();\n\
  \    cout<<\"BEFORE ACTIVATING THE OPERATOR\\n\";\n    ob.display();\n    -ob;\n\
  \    cout<<\"AFTER ACTIVATING THE OPERATOR\\n\";\n    ob.display();\n    getch();\n\
  }\n```\n输出：\nEnter the x,y,z values: 5 6 7\nBEFORE ACTIVATING THE OPERATOR\n5\t\
  6\t7\nAFTER ACTIVATING THE OPERATOR\n-5-6-7\n\n\n\n\n\n```cpp\ncout<<\"\\ nAFTER\
  \ OVERLOADING\\n\";\n\ns.display();\n\ngetch();\n\n}\n```\n\n### 输出:\n\n```\nBEFORE\
  \ OVERLOADING\nvalues of x,y for increment operator 1276\nvalues of p,q for decrement\
  \ operator 8045\nAFTER OVERLOADING\nvalues of x,y for increment operator 1376\n\
  values of p,q for decrement operator 7945\n```\n\n### 增/减运算符的局限性\n\n对变量进行加或减 1 操作是一种非常常见的编程实践。将变量加\
  \ 1 称为递增，将变量减 1 称为递减。\n\n1. 前置符号法会导致变量在表达式中使用其值之前进行更新。\n   - 而后置符号法会导致它在在使用其值之后进行更新。\n\
  \   `obj1=++obj2;`\n   - 效果与语句 `obj1=obj2++;` 完全相同。\n   - 当 `++` 和 `–` 运算符被重载时，前置和后置重载运算符函数之间没有区别。\n\
  \n2. 增、减运算符仅适用于整数变量，不适用于浮点变量，也不适用于字面量。\n\n3. 前置和后置的执行受 Java 控制，你无法改变执行顺序。\n   例如：\n\
  \   `num = (((x--)))* count; //仍然是最后递减 x。括号不会强制提前执行`\n\n4. 使用增或减运算符的一个局限性是，被操作的变量只能增加或减少数值“一个”（ONE）。\n\
  \   - 如果你需要增加（或减少）更大的（或更小）的值，则必须使用如下语句：\n     `j += 2;`（或）j-= 5;`\n\n### 二元运算符重载\n\
  \n- [二元](http://www.tech-faq.com/binary.html)运算符可以类似于类似于运算符的方式进行重载。\n- 二元运算符作用于两个操作数，即两个两个数。\n\
  - 使用单个显式参数重载被称为二元运算符重载。\n- 重载二元运算符的语法为：\n\n![](img/image01352.jpeg)\n`Argument to\
  \ operator function return_type operator op(arg)`\n```cpp\n{\n    body of operator\
  \ function//task defined\n}\n```\n\n![](img/image01353.jpeg) 我们应该注意：\n1. 如果是成员函数，它仅显式地接收一个类类型参数。\n\
  2. 即：二元重载运算符函数将第一个对象作为隐式操作数，第二个操作数必须作为显式参数传递。\n3. 第一个对象的成员变量无需使用点运算符（dot）即可访问。\n\
  4. 此，如果参数是对象，则可以使用点运算符访问第二个参数成员，否则可以直接访问。\n\n请注意，重载的二元运算符函数是定义在第一个对象类中的成员函数。\n\n\
  例如：\n- 考虑以下表达式：\n`C = A + B;//算术表示法`\n  - 上述表达式包含三个对象分别为 `A`、`B` 和 `C`，其中 `A` 和\
  \ `B` 是操作数，而 `C` 是接收 `A` 和 `B` 之和的对象。\n  - 在上述表达式中，运算符函数应该用于相两个自定义数据类型并返回一个自定义数据类型。\n\
  - 为了执行上述表达式，二元运算符函数将写为：\n\n![](img/image01354.jpeg)\n```cpp\nuser_defined operator+(user_defined\
  \ rhs)\n{\n    user_defined temp; temp.x = x + rhs.x; temp.y = y + rhs.y;\n    return\
  \ temp;\n}\n```\n\n- 现在考虑语句：\n`temp.x = x + rhs.x;`\n  - 在上述表达式中，`x` 是调用运算符成员函数的对象\
  \ `A` 的数据成员。\n  - 而 `rhs.x` 指的是对象 `B` 的数据成员，该对象被作为参数传递给函数。由于函数 `operator+( )` 需要返回结果。\n\
  \  - 我们需要一个 `temp` 变量（相同类类型）来存储要返回的值。\n\n注意：这里应该注意到，在重载二元运算符时，运算符左侧的对象被用于调用运算符函数，而运算符右侧的操作数始终作为参数传递给函数。\n\
  \n### 示例程序\n\n```cpp\n/*演示二元运算符重载的程序*/\n#include <iostream.h>\n#include<conio.h>\n\
  \nclass complex\n{\n    float x;//实部\n    float y;//虚部 \npublic:\n    complex()//构造函数\
  \ 1\n    {\n    }\n    complex(float real,float imag)//构造函数 2\n    {\n        x=real;\
  \ y=imag;\n    }\n    complex operator+(complex c); \n    void display();\n};\n\n\
  /* 使用成员函数重载运算符*/ \ncomplex complex::operator+(complex c)\n{\n    complex temp;//临时\
  \ temp.x=x+c.x;//这些是 temp.y=y+c.y; //浮点加法\n    return(temp);\n}\n\nvoid complex::display()\n\
  {\n    cout<<x<<\"+j+\"<<y<<\"\\n\";\n}\n\nint main()\n{\n    clrscr();\n    complex\
  \ c1,c2,c3;\n    // ... 逻辑继续 ...\n    return 0;\n}\n```\n（注：提供的文本在源代码中包含一些重复和碎片化的注释；我在保持所提供逻辑的同时清理了结构。）\n\
  \n### 程序说明\n\n- 让我们看看 `operator+` 并看它是如何实现的：\n```cpp\ncomplex::operator+(complex\
  \ c)\n{\n    complex temp;//临时 temp.x=x+c.x;//这些是 temp.y=y+c.y; //浮点加法\n    return(temp);\n\
  }\n```\n- 我们应该注意以下特征：\n  - 它只接收一个类类型参数。\n  - 它返回一个复类型。\n  - 它是 `complex` 的成员函数。\n\
  \n- 现在看调用语句：\n`c3=c1+c2;`\n上述调用语句等于：\n`c3=c1.operator+(c2);`\n- 我们知道成员函数只能通过同类的对象进行调用。这里，`c1`\
  \ 承担调用函数的职责，而 `c2` 扮演参数的角色。\n\n### 算术运算符\n\n- 作为二元运算符，它们涉及两个参数，这两个类型不需要相同。\n- 算术运算符有：\n\
  \  - `+`（加法）\n  - `-`（减法）\n  - `*`（乘法）\n  - `/`（除法）\n  - `%`（取模）\n\n### 运算符重载规则\n\
  \n尽管重新定义运算符看起来很简单，但在重载它们时存在某些限制和局限性。\n\n- 只有现有的运算符可以被重载。不能创建新的运算符。\n- 重载的运算符至少有一个操作数是用户定义的类型。\n\
  - 我们不能改变运算符的基本含义，即我们不能重新定义 `plus(+)` 运算符从另一个值中减去一个值。\n- 重载的运算符遵循原始运算符的语法规则。它们不能被重写。\n\
  - 有某些运算符是不能重载的。\n\n\n\n\n\n- 我们不能使用友函数来重载某些运算符。然而，可以使用成员函数来重载它们。\n- 通过成员函数重载的一元运算符不接受显式参数，也不返回任何显式值。\n\
  - 通过成员函数重载的二元运算符接受一个显式参数。\n- 当使用通过成员函数重载的二元运算符时，左侧的操作数必须是相关类的一个对象。\n- 二元算术运算符（如\
  \ `+`、`=`、`*` 和 `/`）必须显式地返回一个值。它们不能尝试修改自身的参数。\n\n# 第三单元\n\n### 基类与派生类的关系\n- 派生类的声明\n\
  - 继承的形式-继承与成员访问权限性\n- 多重继承\n- 多级继承\n- 混合继承\n- 派生类中的构造函数-派生类中的析构函数\n- 虚基类\n- 成员函数重写\n\
  - 虚函数\n\n## 继承\n- C++ 强力支持可重用性概念，即一个已经编写并测试过的类可以被用来创建一个新类。\n- 这就像孩子继承父母的特征（如母亲的容貌和父亲的智力），可重用的属性将减少调试时间。\n\
  - 时间开销和成本开销将减少。\n- 因此，可重用机制被应用于继承。\n\n### 基类与派生类的关系\n- 从旧类派生出新类的机制，或从现有类构建新类的技术被称为继承。\n\
  - 旧类被称为基类，新类被称为派生类。\n- 派生类从基类继承部分或全部的特征。\n- ![](img/image01356.jpeg)![](img/image01357.jpeg)基类保持不变。\n\
  \n![](img/image01358.jpeg)\n\n基类\n![](img/image01359.jpeg)\n![](img/image01360.jpeg)\n\
  \n派生类\n1\n定义在派生类中\n![](img/image01361.jpeg)![](img/image01362.jpeg)![](img/image01363.jpeg)定义在基类中，也可从派生类访问\n\
  图. 基类与派生类的关系\n\n- 一个类还可以从多个层级继承属性。\n- 基类通常被称为祖类、父类或超类。\n- 派生类被称为后代类、子类或子类。\n- 在上面的图中，派生类继承了基类的特征\
  \ (A,B,C) 并添加了自身的特征 (D)。\n\n### 派生类的声明\n- 派生类通过继承另一个类（称为基类）的属性并添加自身的特征来扩展其功能。\n\
  - ![](img/image01364.jpeg)声明派生类的通用形式为\n![](img/image01365.jpeg)\n图. 派生类的声明语法\n\n\
  - 派生类自基类的派生通过冒号（:`）表示。\n- 可见性模式是可选的，如果存在，可以是 private（私有）或 public（公共）。\n- 默认的可见性模式是\
  \ private。\n- 可见性模式指定了基类的特征是以公开还是私有的方式继承的。\n\n**注意：**\n- 在声明派生类时，不会为其分配内存。\n- 但在实例化创建对象时，会分配内存。\n\
  \n## 4 继承与成员访问权限\n以下是派生的三种可能样式：\n\n```cpp\nClass abc : private xyz// 私有派生\n{\n.......//\
  \ abc 的成员\n.......\n};\n```\n上述类派生自基类 xyz。\n\n```cpp\nClass abc : public xyz// 公有派生\n\
  {\n......//abc 的成员\n......\n};\n```\n\n```cpp\nClass abc : xyz// 默认的私有派生\n{\n......//abc\
  \ 的成员\n......\n};\n```\n![](img/image01366.jpeg)当派生类以“private”（私有）可见性模式继承基类时，即当基类以私有方式被继承时：\n\
  \n- 基类的所有“公共成员”都变成派生类的“私有成员”。\n- 因此，基类的所有公共成员只能通过派生类的成员函数访问。\n- 派生类的对象无法访问这些成员。\n\
  \n**注意：**\n- 类的所有“公共成员”都可以通过其自身的对象使用点操作符访问。\n- 即基类的任何成员对派生类的对象来说都是不可见的。\n\n![](img/image01366.jpeg)当派生类以“public”（公共）可见性模式继承基类时，即当基类以“公共”方式被继承时：\n\
  \n- 基类的所有“公共成员”都变成派生类的“公共成员”。\n- 因此，基类的所有公共成员都可以通过派生类的成员函数访问。\n- 派生类的对象也可以访问它们。\n\
  \n**注意：**\n- 在这两种情况下，基类的“私有成员”都无法继承到派生类中。\n- 即基类的“私有成员”永远不会成为其派生类的成员。\n\n### 使私有成员可继承\n\
  - 我们可以让派生类继承私有成员。\n- 这可以通过将 private 的可见性限制修改为 public 来实现。\n- 这将消除“数据隐藏”的优势。\n- C++\
  \ 提供了第三种可见性修饰符 protected，它在继承中具有有限的作用。\n- 声明为 protected 的数据成员可以被所属类的成员函数访问。\n- 任何直接派生自该类的类也可以访问。\n\
  - 这些数据成员无法被这两个类之外的函数访问。\n- 类现在可以使用下所示的可见性模式：\n\n```cpp\nclass abc\n{\nprotected:\n\
  ...............\n................//对类内部及其直接派生类可见\npublic:\n................//对程序中的所有函数可见\n\
  };\n```\n- 是合法的类定义。\n\n**注意：**\n- 当保护成员在公共派生中被继承时，它在派生类中也变为保护。\n- 因此可以被派生类的成员函数访问。\n\
  - 它也适用于进一步继承。\n- 当保护成员在私有派生中被继承时，它在派生类中变为私。\n- 尽管它可以被派生类的成员函数访问。\n- 它无法用于进一步继承（因为私有成员不可被继承）。\n\
  - private、protected 和 public 关键字可以在类声明中以任何顺序和任意次数出现。\n\n例如：\n\n```cpp\nclass abc\n\
  {\nprotected:\n...............\n................\npublic:\n................\n................\n\
  private:\n.............\n..............\npublic:\n.............\n.  ............\n\
  \n};\n```\n是合法的类定义。\n\n**注意：**\n- 可以以 protected 模式继承基类（称为保护派生）。\n- 在保护派生中，基类的公共和保护成员都变成派生类的保护成员。\n\
  \n![](img/image0136.jpeg)下表总结了基类成员在三种派生类型中发生的变化：\n\n| 基类可见性 | 派生类可见性 | |\n| :---\
  \ | :--- | :--- |\n| 公有派生 | 私有派生 | 保护派生 |\n| 私有 | 不继承 | 不继承 | 不继承 |\n| 保护 | 保护 |\
  \ 私有 | 保护 |\n| 公有 | 公有 | 私有 | 保护 |\n\n表.继承成员的可见性\n\n\n\n\n\n## 单继承\n\n* 拥有一个基类的派生类称为单继承。\n\
  \n![](img/image01368.jpeg)\n\n图. 单继承\n\n* 单继承的语法格式：\n\n![](img/image01369.jpeg)\n\
  \n示例程序：\n\n```cpp\n#include <iostream.h> #include<conio.h>\n\nclass base//base class\n\
  {\n    int a,b;//private; not inheritable\npublic:public; ready for inheritance\n\
  \    int sum;\n\n    void getdata()\n    {\n        cout<<”enter sales values for\
  \ a and b”<<endl; cin>>a>>b;\n    }\n\n    void calculate()\n    {\n        sum=a+b;;\n\
  \    }\n};\n\nclass derived: public base//derived class\n{//base class is publicly\
  \ inherited\npublic:\n    void putdata()\n    {\n        cout<<”the sum value is:”<<sum;\n\
  \    }\n};\n\nvoid main()\n{\n    clrscr();\n    derived d;//object of derived class\
  \ d.getdata();\n    d.calculate(); d.putdata();\n    getch();\n}\n```\n\n输出：\n```\n\
  enter sales values for a and b 58\nthe sum value is:13\n```\n\n### 程序说明：\n\n* 在上述的示例中，我们定义了\
  \ `base` 为基类，`derived` 为派生类，其中其可见性模式为 `public`。\n* 这样公有数据就可以被派生类继承，就像是它自己的类的公数据一样。\n\
  * 在此继承中，没有必要同时创建基类和派生类的对象。\n* 相反，我们可以只创建一个派生类的对象。\n* 我们可以通过该派生类对象调用派生类和基类的所有成员函数。\n\
  \n## 多重继承\n\n* ![](img/image01370.jpeg)拥有多个基类的派生类称为多重继承\n\n超类（父类 2）\n子类（子类）\n\n\
  图. 多重继承\n\n* 多重继承派生类（多个基类）的通用语法如下：\n\n![](img/image01371.jpeg)\n\n图. 多重继承的语法\n\n\
  * 多重继承的派生类声明如下：\n\n![](img/image01372.jpeg)\n\n* 多重继承允许我们将多个现有类的特征结合，作为定义新类的起点。\n\
  * 它就像孩子继承了一个父母的身体特征和另一个父母的智力。\n\n![](img/image01367.jpeg)\n\n示例程序 1：\n\n```cpp\n\
  #include<iostream.h> #include<conio.h>\n\nclass abc\n{\npublic:\n    int a;\n  \
  \  void getdata()\n    {\n        cout<<\"enter a value:\"<<endl; cin>>a;\n    }\n\
  };\n\nclass def\n{\npublic:\n    int b; void get()\n    {\n        cout<<\"\\nenter\
  \ b value: \"<<endl; cin>>b;\n    }\n};\n\nclass xyz : public abc, public def\n\
  {\npublic:\n    void show()\n    {\n        cout<<\"a and b values are: \"<<a<<\"\
  \\t\"<<b;\n    }\n};\n\nvoid main()\n{\n    clrscr();\n    xyz w; w.getdata();\n\
  \    w.get();\n    w.show();\n    getch();\n}\n```\n\n输出：\n```\nenter a value: 6\
  \ enter b value: 9\na and b values are: 6  9\n```\n\n示例程序 2：\n\n```cpp\n#include<iostream.h>\
  \ #include<conio.h>\n\nclass M\n{\nprotected:\n    int m;\npublic:\n    void getdata_m()\n\
  \    {\n        cout<<\"enter the value of m:  \"<<endl;\n        cin>>m;\n    }\n\
  };\n\nclass N\n{\npublic: public:\n};\n\nint n;\nvoid getdata_n()\n{\n    cout<<\"\
  \\nenter the value of n: <<endl; cin>>n;\n}\n\nclass mul: public M,public N\n{\n\
  public:\n    int product;\n    void calculate()\n    {\n        product=m*n;\n \
  \   }\n    void show()\n    {\n        cout<<\"product of m and n is: \"<<product;\n\
  \    }\n};\n\nvoid main()\n{\n    clrscr(); mul m1;\n    m1.getdata_n(); m1.getdata_m();\
  \ m1.calculate(); m1.show();\n    getch();\n}\n```\n\n## 多级继承\n\n* 从派生类派生出另一个类的机制被称为多级继承。\n\
  * 多级继承的派生类声明如下：\n\n![](img/image01373.gif)\n\n图. 多级继承\n\n* 多级继承的派生类声明如下：\n\n![](img/image01374.jpeg)\n\
  \n* 如上图所示，从另一个派生类派生一个类并不罕见。\n* 类 `A` 作为派生类 `B` 的基类。\n* 随后 又作为派生类 `C` 的基类。\n* 类 `B`\
  \ 被称为中间基类，因为它为 `A` 和 `C` 之间的继承提供了连接。\n* 链 `ABC` 被称为继承路径。\n\n示例程序：\n\n```cpp\n//多级继承的程序//\n\
  #include<iostream.h> #include<conio.h>\n\nclass student\n{\nprotected:\n    int\
  \ rollno; public:\n    void getdata()\n};\n// (后续代码根据逻辑省略)\n```\n\n\n\n\n```cpp\n\
  void display_a()\n{\n    cout<<\"arts:  \"<<endl;\n}\n\n};\n\nclass medical : public\
  \ student\n{\npublic:\n    void display_md()\n    {\n        cout<<\"medical: \"\
  <<endl;\n    }\n};\n\nclass engineering : public student\n{\npublic:\n    void display_e()\n\
  \    {\n        cout<<\"engineering: \\n\"<<endl;\n        cout<<\"in engineering\
  \ student can opt for any of the departments: \"<<endl;\n    }\n};\n\nclass mechanical:\
  \ public engineering\n{\npublic:\n    void display_m()\n    {\n        cout<<\"\
  engineering in mechanical: \"<<endl;\n    }\n};\n\nclass civil: public engineering\n\
  {\npublic:\n    void display_c()\n    {\n        cout<<\"engineering in civil: \"\
  <<endl;\n    }\n};\n\nclass electronics: public engineering\n{\npublic:\n    void\
  \ display_el()\n    {\n        cout<<\"engineering in electronics: \"<<endl;\n \
  \   }\n};\n\nvoid main()\n{\n    clrscr();\n    arts a; medical md; civil c; mechanical\
  \ m; electronics  el;\n    c.getdata_s(); a.display_a(); md.display_md(); c.display_e();\
  \ c.display_c(); m.display_m(); el.display_el();\n    getch();\n}\n```\n\n**输出:**\n\
  学生拥有的选项为：\narts:\nmedical:\nengineering:\nin engineering student can opt for any\
  \ of the departments: engineering in civil:\nengineering in mechanical:\nengineering\
  \ in electronics:\n\n## 混合继承\n\n* [混合继承](http://guides.wikinut.com/Inheritance-and-Its-types/6dfqqlfm/)是将一种或多种类型的继承组合在一起的方法。\n\
  \n![](img/image01378.jpeg)\n\n图. 混合（多级、多重）继承\n\n## 虚基类\n\n* 考虑一种情况，当涉及三种继承，即多级继承、多重继承和层次继承。\n\
  * 那么，`child` 将拥有两个直接基类 `parent1` 和 `parent2`，而它们本身有一个共同的基类 `grandparent`。\n* `child`\
  \ 通过两条独立的路径继承 `grandparent` 的特性。\n* 它也可以像“虚线”所示那样直接继承。\n* `grandparent` 有时被称为间接基类。\n\
  \n![](img/image01379.jpeg)\n\n图. 多路径继承\n\n* `child` 类的这种继承可能会产生一些问题。\n* `grandparent`\
  \ 类的所有公共和保护成员都被继承到 `child` 类中两次；第一次通过 `parent1` 类，第二次通过 `parent2` 类。\n* 这意味着 `child`\
  \ 类将拥有一组从 `grandparent` 继承的重复成员，这引入了歧义并应该被避免。\n* 由于这些多条路径导致的继承成员重复可以通过将共同的基类声明为虚基类来避免，同时如下所示声明直接或中间的基类：\n\
  \n```cpp\nclass grandparent\n{\n….\n….\n};\n\nclass parent1 : virtual public grandparent\n\
  {\n…….\n…..\n….\n};\n\nclass parent2 : public virtual grandparent\n{\n…….\n…..\n\
  ….\n};\n\nclass child : public parent1, public parent2\n{\n…….\n.  ……// 只会继承一份 grandparent\
  \ 的副本\n…….\n};\n```\n\n* 当一个类被变成虚基类时。\n* C++ 会采取必要的措施，确保无论虚基类和派生类之间存在多少条继承路径，都只继承该类的一个副本。\n\
  注意：关键字 `virtual` 和 `public` 可以任意顺序使用。\n\n### 示例程序\n\n![](img/image01380.jpeg)作为虚基类作为虚基类\n\
  \n图. 虚基类\n\n```cpp\n#include<iostream.h> #include<conio.h>\n\nclass employee\n{\n\
  public:\n    char ename[ ];\n    void getname()\n    {\n        cout<<\"Enter the\
  \ emp name\"; cin>>ename;\n    }\n};\n\nclass grosssalary : virtual public employee\n\
  {\npublic:\n    float bp,hra,da,gross;\n    void getdetails()\n    {\n        cout<<\"\
  Enter the basicpay, hra, da\"; cin>>bp>>hra>>da; gross=bp+hra+da; cout<<\"gross\"\
  <<gross<<endl;\n    }\n};\n\nclass taxdeduct : public virtual employee\n{\npublic:\n\
  \    float tax;\n    void deduct()\n    {\n        cout<<\"Enter the tax amount\
  \ to be deducted: \"; cin>>tax;\n    }\n};\n\nclass netsalary : public salary,public\
  \ taxcal\n{\n    float net;\npublic:\n    void netpay()\n    {\n        net=gross-tax;\n\
  \        cout<<\"Netsalary of the employee:  \"%(ename<<\"\\t\"<<net;\n    }\n};\n\
  \nvoid main()\n{\n    netsalary ob; clrscr();\n    ob.getname(); ob.getdetails();\
  \ ob.deduct();\n    ob.netpay();\n    getch();\n}\n```\n\n**输出:**\nEnter the emp\
  \ name: geetha\nEnter the  basicpay, hra, da : 1200040005000\nGross: 21000\nEnter\
  \ the tax amount to be deducted: 2000 Netsalary of the employee geetha: 19000\n\n\
  ## 抽象类\n\n* 抽象类是不用于创建对象的类。\n* 抽象类的设计目的仅是作为基类（供其他类继承）。\n* 在之前的示例中，`employee` 类是一个抽象类，因为没有被用于创建任何对象。\n\
  \n## 虚函数\n\n* 当我们在基类和派生类中使用相同的函数名时，基类中的函数通过在性普通声明前使用 `virtual` 关键字声明为虚函数。\n* 可以在运行时更改的成员函数被称为虚函数。\n\
  * 当函数被变为虚函数时，C++ 根据基指针指向的对象的类型，而不是指针的类型，在运行时决定使用哪个函数。\n* 因此，通过让基指针指向不同的对象，我们可以执行虚函数的不同版本。\n\
  * 虚函数的定义语法为：\n```cpp\nclass classname\n{\npublic:\n. . . . .\nvirtual returntype\
  \ functionname (arguments)\n{\n. . . .  .\n. . . .  .\n}\n};\n```\n* 虚函数应该定义在类的公共部分。\n\
  * 当一个函数是虚而另一个是普通函数时，编译器在运行时决定创建哪个函数。\n* 在这里我们需要创建一个 `basepointer`。\n* 如果 `basepointer`\
  \ 指向基类，它将执行基类函数。\n* 如果 `basepointer` 指向派生类，它将执行派生类函数。\n\n**示例程序：**\n\n```cpp\n#include\
  \ <iostream.h> #include<conio.h>\n\nclass Base\n{\npublic:\n    void display()\n\
  \    {\n        cout<<\"\\ndisplay base\";\n    }\n    virtual void show()\n   \
  \ {\n        cout<<\"\\nshow base\";\n    }\n};\n\nclass Derived:public Base\n{\n\
  public:\n    void display()\n    {\n        cout<<\"\\ndisplay Derived\";\n    }\n\
  \    void show()\n    {\n        cout<<\"\\nshow Derived\";\n    }\n};\n\nvoid main()\n\
  {\n    clrscr(); Base b;\n    Derived d; Base *bptr;\n    cout<<”nbptr points to\
  \ Base\"; bptr=&b;\n    bptr->display();// 调用基类 display 函数\n    bptr->show();//\
  \ 调用基类 show 函数\n    cout<<”nbptr points to Derived\"; bptr=&d;\n    bptr->display();//\
  \ 调用派生类 display 函数\n    bptr->show();// 调用派生类 show 函数\n    getch();\n}\n```\n\n\
  **输出:**\nnbptr points to Base\ndisplay base\nshow base\nnbptr points to Derived\n\
  display base\nshow Derived\n\n### 程序的解释\n\n* 基指针首先持有基类对象的地址，这意味着将运行基类成员函数 display\
  \ 和 show。\n* 接下来基指针指向派生类对象，在执行派生类函数之前，它会检查相应的基类函数是否为虚。\n* 如果不是虚函数则执行基类函数，否则将执行派生类函数。\n\
  \n### 虚函数的规则\n\n1. 虚函数必须是某个类的成员。\n2. 它们不能是静态成员。\n3. 通过基指针访问。\n4. 基类中的虚函数即使不使用也必须定义。\n\
  5. 基类虚函数的原型（或声明）与派生类版本必须相同。\n6. 我们不能使用派生类的指针来访问基类对象。\n\n## 成员函数重写\n\n基类和派生类具有相同名称和参数的成员函数。如果你创建一个派生对象并编写代码访问该成员函数，只会调用派生类的成员函数，即派生类的成员函数重写了基类的成员函数。这一\
  \ C++ 编程特性被称为函数重写。\n\n**示例程序：**\n```cpp\nClass base\n{\npublic:\n    void print()\n\
  \    {\n        cout<<”Print from base”;\n    }\n}\n```\n\n\n\n\n```cpp\nClass derived:public\
  \ base\n{\nPublic:\n    Void print()\n    {\n        Cout<<”Print from derived”;\n\
  \    }\n};\n\nVoid main()\n{\n    Derived d;\n    d.print(); //invokes print() from\
  \ derived d\n}\n```\n**输出：**\nPrint from derived Print from derived\n\n## 在继承中使用构造函数和析构函数\n\
  \n## 派生类中的构造函数\n\n*   构造函数可以用于初始化对象的数据成员并分配内存等所需的资源。\n*   在单继承的情况下，当派生类和基类都包含构造函数时，首先执行基类构造函数，然后执行派生类的构造函数。\n\
  *   在多继承的情况下，基类构造函数按照它们在派生类声明中出现的顺序执行。\n*   在多级继承的情况下，构造函数将按照继承的顺序执行。\n*   虚基类的构造函数会在任何非虚基类之前被调用。\n\
  *   如果有多个虚基类，它们按照声明的顺序被调用。\n\n| 继承方式 | 执行顺序 |\n| :--- | :--- |\n| Class A : public\
  \ B | A(); 基类构造函数 |\n| { | B(); 派生类构造函数 |\n| }; | |\n| Class A : public B,public\
  \ C | B(); 基类(第一个) |\n| { | C(); 基类(第二个) |\n| }; | A();派生类 |\n| Class A : public\
  \ B,virtual public C | C(); 虚基类 |\n| { | B(); 普通基类 |\n| }; | A();派生类 |\n\n**表 1.\
  \ 基类构造函数的执行顺序**\n![](img/image01366.jpeg)\n\n## 派生类中的空构造函数\n\n### 单继承情况 1：基类和派生类中都没有构造函数\n\
  \n*   当基类或派生类都没有构造函数时，编译器会自动创建类对象而不会产生任何错误。\n\n**示例程序：**\n```cpp\nClass A\n{\npublic:\
  \ void dis( )\n{\n    cout<<”Hai Friends”;\n}\n};\n\nClass B: public A\n{\npublic:\n\
  \    void display( )\n    {\n        cout<<”Have a nice day”;\n    }\n};\n\nvoid\
  \ main( )\n{\n}\n```\n\n**情况 2：仅基类中有一个构造函数**\n```cpp\nB s;/*派生类的对象*/ s.dis( );\n\
  s. display( );\n```\n```cpp\n#include <iostream.h> class A\n{\npublic:\n    A (\
  \  )/*基类中的空构造函数*/\n    {\n        cout<<” Have a nice day”;\n    }\n};\n\nclass\
  \ B: public A\n{\npublic:\n};\n\nvoid main( )\n{\n    B s;/*派生类的对象*/\n}\n```\n*\
  \   如果创建了派生类对象，它将首先检查基类并执行相应的默认构造函数。\n\n### 情况 3：仅派生类中有构造函数\n```cpp\n#include <iostream.h>\
  \ Class A\n{\npublic:\n};\n\nClass B: public A\n{\npublic:\n    A (  )/*派生类中的空构造函数*/\n\
  \    {\n        cout<<”Have a nice day”;\n    }\n};\n\nvoid main( )\n{\n    B  s;/*派生类的对象*/\n\
  }\n```\n*   当创建派生类对象时，它会首先检查基类；如果基类中没有构造函数，它将跳过基类并运行派生类的构造函数。\n\n### 情况 4：基类和派生类中都有构造函数\n\
  ```cpp\n#include <iostream.h> class A\n{\npublic:\n    A (  )/*基类中的空构造函数*/\n   \
  \ {\n        cout<<”Have a nice day”;\n    }\n};\n\nclass B: public A\n{\npublic:\n\
  \    B (  )/*派生类中的空构造函数*/\n    {\n        cout<<”Welcome”;\n    }\n};\n\nvoid main(\
  \ )\n{\n    B  s;/*派生类的对象*/\n}\n```\n*   当创建派生类对象时，它将检查基类并执行相应的构造函数，然后执行相应的派生类构造函数。\n\
  \n## 多继承\n\n### 多继承类中的构造函数\n```cpp\n#include <iostream.h>\n\nclass  A/*基类 1*/\n\
  {\npublic:\n    A  ()/*基类 1 中的空构造函数*/\n    {\n        cout<<”Have a nice day”;\n\
  \    }\n};\n\nclass  B/*基类 2*/\n{\npublic:\n    B( )/*派生基类基类 2 中的空构造函数*/\n    {\n\
  \        cout<<”Welcome”;\n    }\n};\n\nclass C: public A,  public B/*派生类*/\n{\n\
  public:\n    C  ( )/*派生类中的空构造函数*/\n    {\n        cout<<”Good Morning”;\n    }\n\
  };\n\nvoid main( )\n{\n    C  s;/*派生类的对象*/\n}\n```\n**输出：**\nHave a nice day Welcome\n\
  Good Morning\n\n*   构造函数的执行取决于继承这些类以创建新类的顺序，例如 `public A`、`public B`，它将首先执行相应的类\
  \ `A` 构造函数，然后是类 `B` 构造函数，最后是派生类构造函数。\n\n## 多级继承\n\n### 多级继承中的构造函数\n```cpp\n#include\
  \ <iostream.h>\n\nclass A\n{\npublic:\n    A (  )/*基类中的空构造函数*/\n    {\n        cout<<”Have\
  \ a nice day”;\n    }\n};\n\nclass B: public A\n{\npublic:\n    B( )/*第一级派生类中的空构造函数*/\n\
  \    {\n        cout<<”Welcome”;\n    }\n};\n\nclass C:  public  B/*第二级派生类中的空构造函数*/\n\
  {\n};\n\nvoid main( )\n{\n    C c; \n}\n```\n**输出：**\nHave a nice day\nWelcome\n\
  Good Morning\n```\n\n\n\n\n\nC/C++ 的 IO 基于流（streams），流是流进和流出程序的一系列字节（就像水和油在管道中流动一样）。在输入操作中，数据字节从输入源（如键盘、文件、网络或另一个程序）流入程序。在输出操作中，数据字节从程序流向输出汇（如控制台、文件、网络或另一个程序）。流在程序和实际\
  \ IO 设备之间充当中介，通过这种方式使程序员无需处理实际的设备，从而实现与设备无关的 IO 操作。\n\n![](img/image01382.jpeg)\n\
  \nC++ 同时提供了格式化 IO 和非格式化 IO 函数。在格式化（或高级级）IO 中，字节被分组并转换为 `int`、`double`、`string` 或用户定义类型。在非格式化（或低级）IO\
  \ 中，字节被视为原始字节且不进行转换。格式化 IO 操作通过重载流插入运算符（`<<`）和流提取运算符（`>>`）来实现，这提供了一个一致的公共 IO 接口。\n\
  \n要执行输入和输出，C++ 程序需要：\n\n1. 构造一个流对象。\n2. 将流对象连接（关联）到实际 IO 设备（例如：键盘、控制台、文件、网络、另一个程序）。\n\
  3. 通过流公共接口中定义的函数以与设备无关的方式执行输入/输出操作。某些函数在外部格式和内部格式之间转换数据（格式化 IO）；而另一些则不转换（非格式化或二进制\
  \ IO）。\n4. 将流与实际 IO 设备分离（例如：关闭文件）。\n5. 释放流对象。\n\n## iostream 库包含\n\n- `<iostream.h>`：包含\
  \ `cin`、`cout`、`cerr` 和 `clog` 对象\n- `<iomanip.h>`：包含参数化流操纵符\n- `<fstream.h>`：包含用户控制的文件处理操作关重要的信息\n\
  \n## ios 基类\n\n`istream` 和 `ostream` 继承自 `ios`。`iostream` 继承自 `istream` 和 `ostream`。\n\
  \n- `<<`（左移运算符）\n    - 重载为流插入运算符\n- `>>`（右移运算符）\n    - 重载为流提取运算符\n    - 这两个运算符均与\
  \ `cin`、`cout`、`cerr`、`clog` 以及用户定义的流对象一起使用\n\n### istream: 输入流\n\n```cpp\ncin >>\
  \ someVariable;\n```\n- `cin` 知道要给 `someVariable` 分配什么类型的数据（基于 `someVariable` 的类型）。\n\
  \n### ostream: 输出流\n\n```cpp\ncout << someVariable;\n```\n- `cout` 知道输出的数据类型。\n\
  ```cpp\ncerr << someString;\n```\n- 无缓冲 - 立即打印 `someString`。\n```cpp\nclog << someString;\n\
  ```\n-缓冲 - 当输出缓冲区满或刷新时立即打印 `someString`。\n\n### ostream: 执行格式化和非格式化输出\n\n- 使用 `put()`\
  \ 处理字符，使用 `write()` 处理非格式化字符。\n- 输出十进制、八进制和十六进制的数字。\n- 为浮点数设置不同的精度。\n- 格式化文本输出\n\
  \n![](img/image01383.jpeg)\n\n`cin.get()`：从流输入一个字符（甚至是空白字符）并返回它。\n`cin.get(c)`：从流输入一个字符并存储在\
  \ `c` 中。\n\n## 非格式化输入/输出函数\n\n### put()`, `get()` 和 `getline()`\n\n`ostream` 的成员函数\
  \ `put()` 可用于输出一个 `char`。`put()` 返回调用的 `ostream` 引用，因此可以级联调用。例如：\n\n```cpp\n// ostream\
  \ 类\nostream & put (char c); // 向 ostream 放入字符 c\n\n// 示例\ncout.put('A');\ncout.put('A').put('p').put('p').put('\\\
  n');\ncout.put(65);\n```\n\n```cpp\n// istream 类\n// 单字符输入\nint get (); // 获取一个字符，存储在\
  \ c 中并返回调用的 istream 引用\n\n// C 字符串输入\nistream & get (char and); // 获取一个字符并作为 int\
  \ 返回。在文件末尾返回 EOF。\nistream & get (char & c);\nistream & get (char * cstr, streamsize\
  \ n, char delim = '\\n'); // 获取 n-1 个字符或直到分隔符，并存储在 C 字符串数组 cstr 中。附加空字符以终止 C 字符串。在输入流中保留分隔符。\n\
  \nistream & getline (char * cstr, streamsize n, char delim = '\\n'); // 与 get()\
  \ 相同，但从输入流中提取并丢弃分隔符。\n```\n\n示例：\n```cpp\nint inChar;\nwhile ((inChar = cin.get())\
  \ != EOF) { // 读取到文件末尾\n    cout.put(inchar);\n}\n```\n\n### read()`, `write()`\
  \ 和 `gcount()`\n\n```cpp\n// istream 类\nistream & read (char * buf, streamsize n);\
  \ // 从 istream 读取 n 个字符并保留在字符数组 buf 中。与 get()/getline() 不同，它不会在输入末尾附加空字符。它用于二进制输入，而不是\
  \ C 字符串。\nstreamsize gcount() const; // 返回上一次非格式化输入操作（get()、getline()、ignore() 或\
  \ read()）提取的字符数。\n\n// ostream 类\nostream & write (const char * buf, streamsize\
  \ n) // 从字符数组写入 n 个字符。\n```\n\n## 格式化控制台 IO 函数\n\nC++ 提供了各种格式化控制台函数用于格式化输出。它们有三种类型：\n\
  \n1. `ios` 类函数标志\n2. 操纵符\n3. 用户定义的输出函数\n\n### 成员函数和标志\n\n输出流（`ostream` 类）具有了一些用于控制输出的有用成员函数。注意这些函数不仅可以用于\
  \ `cout`，还可以用于其他输出流。\n\n`setf()`：设置标志函数。以标志作为参数。可以开启的标志包括：\n\n- `ios::fixed`：指定以固定点法输出浮点数。\n\
  - `ios::scientific`：指定以科学计数法（指数）输出浮点数。\n- `ios::showpoint`：指定即使对于整数也显示小数点。\n- `ios::right`：当指定宽度时，输出项右对齐。\n\
  - `ios::left`：当指定宽度时，输出项左对齐。\n- `unsetf()`：调用此函数关闭某个标志。\n- `precision()`：为浮点数设置小数点后的特定数字位数。以该数字作为参数。\n\
  - `width()`：用于指定下一个输出项的字段宽度。以字符数作为参数。使用此函数时，左、右对齐标志有效。\n- `fill()`：用于指定填充字段额外空间的字符（配合\
  \ `width()` 使用）。以字符作为参数。\n\n```cpp\nint x = 1234;\ncout.setf(ios::right);\ncout.width(10);\n\
  cout << \"Hello\";\ncout.width(15);\ncout << x;\n// 上述输出为：\n//Hello1234\n```\n\n\
  ```cpp\nint x = 1234;\ncout.setf(ios::right);\ncout.fill('.'); // 修改填充字符\ncout.width(10);//设置宽度为\
  \ 10\ncout << x;\n// 上述输出为：\n//......1234\n```\n\n### 流操纵符\n\n流操纵符是可以通过放在插入运算符 `<<`\
  \ 右侧使用的符号或函数。\n\n普通操纵符只是一个符号，类似于变量：\n\n```cpp\ncout << endl; // endl 是一个流操纵符\n```\n\
  \n参数化流操纵符看起来像函数调用 -- 它有一个或多个参数：\n\n```cpp\ncout << setw(10); // setw() 是一个参数化操纵符\n\
  ```\n\n\n\n\n\n许多流操作符只是成员函数所执行任务的替代方式。一个很棒的好处是可以使用链式调用，将操作符与其他使用插入运算符的输出语句混合使用。\n\
  \n```cpp\ncout << setw(10) << \"Hello\" << endl;\n```\n\n`setprecision()` 是一个带参数流操作符，它执行与成员函数\
  \ `precision()` 相同的任务。\n\n```cpp\ncout.precision(2);//将小数精度设置为 2 位有效数字\ncout <<\
  \ setprecision(2); // 效果相同！\n```\n\n`setw()` 是一个带参数流操作符，它执行与成员函数 `width()` 相同的任务。\n\
  \n```cpp\ncout.width(10);//为下一次输出设置字段宽度为 10\ncout << setw(10); // 效果相同！\n```\n\n\
  `setfill()` 是一个带参数流操作符，它执行与成员函数 `fill()` 相同的任务。\n\n```cpp\ncout.fill('*');//设置填充字符为\
  \ '*'\ncout << setfill('*');// 效果相同！\n```\n\n`setiosflags()` 是一个带参数流操作符，它执行与成员函数\
  \ `setf()` 相同的任务。\n\n```cpp\ncout.setf(ios::left);//设置左对齐标志\ncout << setiosflags(ios::left);\
  \ // 效果相同！\n```\n\n还有一些较新的流操作符，对应于某些格式化标志。例如：\n\n```cpp\ncout.setf(ios::left);//为\
  \ cout 设置左对齐\ncout << left; // 同样为 cout 设置左对齐\n```\n\n## 文件输入输出\n\n![](img/image01384.jpeg)\n\
  \n在 C++ 中进行文件处理，必须包含头文件 `<iostream.h>` 和 `<fstream.h>`。\n\n`<fstream>` 包含了 `<ifstream>`\
  \ 和 `<ofstream>`。\n\n## 文件打开模式\n\n其中 `filename` 是表示打开的文件名的字符串，`mode` 是一个可选参数，可以是以下标志的组合：\n\
  \n| `ios::in` | 用于输入操作打开。 |\n| :--- | :--- |\n| `ios::out` | 用于输出操作打开。 |\n| `ios::bin`\
  \ | 以二进制模式打开。 |\n| `ios::ate` | 将初始位置设置为文件末尾。如果未设置此标志，则初始位置为文件开头。 |\n| `ios::app`\
  \ | 所有输出操作都在文件末尾进行，将内容追加到文件的当前内容之后。 |\n| `ios::trunc` | 如果以输出操作打开且文件已存在，则其原有内容将被删除并由新内容替换。\
  \ |\n\n`ios::nocreate` - 如果文件不存在，则打开操作失败。\n`ios::noreplace` - 如果文件存在，则打开操作失败。\n\n\
  类 `ofstream`、`ifstream` 和 `fstream` 的每个打开打开成员函数都有默认模式，如果在未提供第二个参数的情况下打开文件，将使用该模式：\n\
  \n| 类 | 默认模式参数 |\n| :--- | :--- |\n| `ofstream` | `ios::out` |\n| `ifstream` | `ios::in`\
  \ |\n| `fstream` | `ios::in \\| ios::out` |\n\n## 文件关闭\n\n当我们完成对文件的输入和输出操作时，应当将其关闭，以便通知操作系统并使其资源重新可用。为此，我们调用流的成员函数\
  \ `close`。该成员函数会刷新关联缓冲区并关闭文件：\n\n![](img/image01385.jpeg)\n\n一旦调用了此成员函数，流对象就可以重用于打开另一个文件，该文件也可以再次被其他进程打开。\n\
  \n![](img/image01386.gif)\n\n## 示例\n\n可以使用构造函数或创建对象来打开文件。以下示例展示了：\n\n```cpp\n#include\
  \ <iostream.h>\n#include <fstream.h>\n\nint main() {\n    ofstream fout(\"example.txt\"\
  );\n    fout << \"This is a line.\\n\";\n    fout << \"Another line.\\n\";\n   \
  \ fout.close();\n    return 0;\n}\n```\n\n输出：\n```\nThis is a line.\nAnother line.\n\
  ```\n\n## 文件位置\n\n`<istream>` 和 `<ostream>` 重新定位文件指针（读取或写入文件的字节数）的成员函数。这些成员函数是：\n\
  \n- 用于 `istream` 的 `seekg()` (seek get)\n- 用于 `ostream` 的 `seekp()` (seek put)\n\
  \n提供了 `tellg()` 和 `tellp()` 来分别返回 get 和 put 指针的当前位置。\n\n## 错误（异常）处理\n\n异常是指程序中意外的情况。这些意外情况可能是故障，导致错误，进而导致程序失败。C++\
  \ 的错误处理机制通常称为异常处理。\n\n## 异常的类型\n\n1. 同步异常\n2. 异步异常\n\n### 同步异常\n\n在程序执行期间，由于输入数据中的故障或不适合处理当前数据类型的技术而发生的异常被称为同步异常。\n\
  \n示例：`out of range`（越界）、`divide by zero`（除零）、`overflow`（溢出）、`underflow`（下溢）。\n\n\
  ### 异步异常\n\n由程序控制之外事件引起的错误称为异步异常。\n\n示例：磁盘故障。\n\n## 异常处理机制\n\n异常处理机制的目的是提供检测和报告“异常情况”的方法，以便采取适当措施。异常处理机制包括以下任务操作：\n\
  \n1. 发现问题（命中异常）\n2. 通知已发生（抛出异常）\n3. 接收错误信息（捕获异常）\n4. 采取纠正措施（处理异常）\n\n以下示例展示了它是如何工作的：\n\
  \n```cpp\n#include <iostream.h>\n#include <fstream.h>\n\nint main() {\n    try {\n\
  \        throw \"Error occurred\";\n    } catch (const char* msg) {\n        cout\
  \ << msg << endl;\n    }\n    return 0;\n}\n```\n\n\n\n\n\n* 一个用于检测并抛出异常\n* 另一个用于捕获异常并采取适当措施。\n\
  \n### 异常处理模型\n\n异常处理机制使用了三个块：`try`、`throw`、`catch`。这三个异常处理模型之间的关系所示：\n\n* 关键字 `try`\
  \ 用于一组（由大括号括围）可能产生异常的语句。这组语句被称为 `try` 块。\n* 当检测到异常时，使用 `try` 块中的 `throw` 语句将其抛出。\n\
  * 由关键字 `catch` 定义的 `catch` 块捕获 `try` 块中 `throw` 语句抛出的异常，并对其进行适当处理。\n* 一般格式：\n\n\
  ```cpp\ntry\n{\n    ... // 检测并...异常的语句块\n    throw exception; // 抛出异常\n    ...\n\
  \    ...\n}\ncatch (type arg)\n{\n    ...\n    ...\n    ... // 处理异常的语句块\n}\n```\n\
  \n* 当 `try` 块抛出异常时，程序控制将离开 `try` 块并进入 `catch` 块中的 `catch` 语句。\n* 异常是用于传输有关问题信息的对象或变量。\n\
  * 如果抛出的对象的 `type` 与 `catch` 语句中的 `arg` 类型匹配，则执行 `catch` 块来处理异常。\n* 如果它们不匹配，程序将通过自动调用的\
  \ `abort()` 函数终止。\n* `catch` 块可以有多个 `catch` 语句，每个语句句对应于一种特定类型的异常。\n* 例如，如果 `throw`\
  \ 块可能会抛出两个异常，则 `catch` 块将有两个 `catch` 语句，每个语句对应一种异常类型。每个 `catch` 语句被称为异常处理程序。\n*\
  \ 当没有检测到并抛出异常时，控制将跳转到 `catch` 块之后紧后的语句。也就是说，`catch` 块会被跳过。\n\n**示例：除以零**\n\n```cpp\n\
  #include<iostream.h>\nvoid main()\n{\n    int x, y, z;\n    cout<<\"enter the values\
  \ of x, y, z\"; cin>>x>>y>>z;\n    try\n    {\n        if(x == y)\n            throw\
  \ y;\n        else\n        {\n            int d= z / (x - y);\n            cout<<\"\
  the result of z/(x-y) is:\"<< d;\n        }\n    }\n    catch(int y)\n    {\n  \
  \      cout<<\"exception caught x-y is \"<<<< x-y;\n    }\n}\n```\n\n**运行 1:**\n\
  enter the values of x, y, z 50 30 20\nthe result of z/(x-y) is: 1\n\n**运行 2:**\n\
  Enter the values of x, y, z 30 30 20\nexception caught x-y is : 0\n\n**使用生成异常的函数：**\n\
  \n```cpp\n#include<iostream.h>\nvoid divide(int x, int y, int z)\n{\n    if(x ==\
  \ y)\n    {\n        cout<<\"we are inside the function\";\n        throw (x-y);\n\
  \    }\n    else\n    {\n        int d= z / (x - y);\n        cout<<\"the result\
  \ of z/(x-y) is:\"<< d;\n    }\n}\nvoid main()\n{\n    try\n    {\n        cout<<\"\
  \ we are inside the try block\";\n        divide(10, 20, 30); // 调用 divide()\n \
  \       divide(10, 10, 20); // 调用 divide()\n    }\n    catch(int i) // 捕获异常\n  \
  \  {\n        cout<<\"exception caught x-y is : \"<<i;\n    }\n}\n```\n\n**运行:**\n\
  we are inside the try block\nwe are inside the function\nthe result of z/(x-y) is:\
  \ -3\nwe are inside the function\nexception caught x-y is: 0\n\n### 使用对象的多个 catch\
  \ 语句\n\n* 要用对象抛出异常，需要定义一个 `abstract class`（抽象类）。\n* 一个 `abstract class` 无非只是一个带有空数据成员的类。\n\
  * 类名作为无名对象被调用，用于抛出异常。\n\n**示例：**\n\n```cpp\n#include<iostream.h>\nclass positive\
  \ { };\nclass negative { };\nclass zero { };\n\nvoid greater(int num)\n{\n    if(num\
  \ > 0)\n        throw positive();\n    else if (num < 0)\n        throw negative();\n\
  \    else\n        throw zero();\n}\n\nvoid main()\n{\n    int num;\n    cout<<\"\
  enter any number \"; cin>>num;\n    try\n    {\n        greater(num);\n    }\n \
  \   catch(positive)\n    {\n        cout<<\"positive exception\";\n    }\n    catch(negative)\n\
  \    {\n        cout<<\"negative exception\";\n    }\n    catch(zero)\n    {\n \
  \       cout<<\"zero exception\";\n    }\n}\n```\n\n### 模板\n\nOOP 的一个重要特性是代码的可重用。模板支持泛型编程，允许不同的数据类型。\n\
  \n**模板的类型**\n有两种模板：\n* 函数模板\n* 类模板\n\n#### 函数模板\n\n函数模板定义了一组函数。函数模板本身不是一个函数，而是编译器用于生成函数的蓝图。函数模板在调用点实例化。\n\
  \n**函数模板的语法**\n\n```cpp\ntemplate <template-parameter-list>\nreturn_type function_name(parameter-list)\n\
  {\n    ...\n}\n```\n\n**示例：**\n\n```cpp\n#include<iostream.h>\n#include<conio.h>\n\
  template <class T>\nvoid swap(T &x, T &y)\n{\n    T z; z=x; y=z;\n}\n\nvoid main()\n\
  {\n    clrscr();\n    int a,b;\n    cout<<\"\\nEnter 2 integers:\"; cin>>a>>b;\n\
  \    swap(a,b);\n    cout<<\"\\nafter swapping the values are \"<<a<<\"\\t\"<<b;\n\
  \n    float c,d;\n    cout<<\"\\nEnter 2 float values:\"; cin>>c>>d;\n    swap(c,d);\n\
  \    cout<<\"\\nafter swapping the values are \"<<c<<\"\\t\"<<d;\n    getch();\n\
  }\n```\n\n#### 类模板\n\n类模板与类的关系就像类与对象的关系。类定义如何构造对象，而类模板定义如何生成一组类。\n\n注意 class template（类模板）和\
  \ template class（模板类）之间的区别：\n* class template 是用于生成类的模板。你不能声明类模板的对象。\n* template\
  \ class 是类模板的实例。\n\n**类模板的语法**\n\n```cpp\ntemplate <template-parameter-list>\nclass\
  \ class_name\n{\n    ...\n};\n```\n\n**示例：**\n\n```cpp\n#include<iostream.h>\n#include<conio.h>\n\
  template <class T>\nclass pair{\n    T a,b;\npublic:\n    pair(T, T);\n    T getmax();\n\
  };\n\ntemplate <class T> pair<T>:: pair(T x, T y)\n{\n    a=x; b=y;\n}\n\ntemplate\
  \ <class T> T pair<T>::getmax()\n{\n    T z; z=(a>b)?a:b; return z;\n}\n\nvoid main()\n\
  {\n    clrscr();\n    int p,q;\n    cout<<\"\\nEnter 2 integers:\"; cin>>p>>q;\n\
  \    pair<int> ob1(p,q);\n    cout<<\"\\nThe biggest number is \"<<ob1.getmax();\n\
  \n    float r,s;\n    cout<<\"\\nEnter 2 float values:\"; cin>>r>>s;\n    pair<float>\
  \ ob2(r,s);\n    cout<<\"\\nThe biggest number is \"<<ob2.getmax();\n    getch();\n\
  }\n```\n\n\n\n\n```cpp\ncout<<\"\\nThe biggest number is \"<<ob2.getmax(); getch();\n\
  \n}\n```\n\n## 使用模板的优势\n\n- 模板支持泛型编程，允许开发可重用的软件组件（如函数、类等），并在单个框架内支持不同的数据类型。\n- 模板会根据传递给它们的参数数据类型执行适当的操作。\n\
  - 在实现如 `vectors`、`stacks`、`lists`、`queues` 等通用结构时，模板非常有用，这些结构可以与任意类型配合。\n- 模板在编译时进行类型检查。因此，编译器可以在编译时确定与模板定义相关的类型是否能够执行该模板定义所需的所有功能。\n\
  - 从设计上来说，模板可以用于非常复杂的问题空间。\n\n## 使用模板的固有缺点\n\n- 从历史角度看，某些编译器对模板的支持较差。因此，使用模板可能会降低代码的可移植性。\n\
  - 许多编译器在检测到模板定义错误时缺乏清晰的指令。这会增加开发模板的工作量，并促成了 Concepts（概念）的发展，以便未来将其纳入 C++ 标准中。\n\
  - 由于编译器会为每个模板类型生成额外的代码，无加别使用模板会导致代码膨胀，导致可执行文件变大。\n- 因为模板本质上暴露了其实现，在大型系统中不智的使用会导致更长的构建时间。\n\
  - 调试使用模板开发的代码可能困难。由于编译器会替换模板，调试器在运行时很难定位到代码。\n- 模板的模板（嵌套）并非所有编译器都支持，或者可能有最大嵌套层级。\n\
  - 模板位于头文件中，当进行更改时需要对所有项目部分进行完全重新编译。\n- 没有信息隐藏。所有代码都暴露在头文件中。没有任何库可以单独包含代码。\n\n##\
  \ 标准模板库\n\n标准模板库 (STL) 包含：\n\n- 容器 (Containers)\n- 算法 (Algorithms)\n- 迭代器 (Iterators)\n\
  \n![](img/image01393.jpeg)\n\n容器是内存中组织存储数据的方式，例如元素数组。\n\nSTL 中的算法应用于容器以处理其数据的程序，例如在数组中搜索元素，或对数组进行排序。\n\
  \n迭代器是指针概念的泛化，它们指向容器中的元素，例如，你可以增加迭代器以指向数组中的下一个元素。\n\n- 迭代器是类指针的实体，用于访问容器中的单个元素。\n\
  - 它们通常用于从一个元素移动到另一个元素，这个过程被称为遍历容器。\n- 成员函数 `begin()` 和 `end()` 返回指向容器第一个元素和最后一个元素之后元素的迭代器。\n\
  \n### 容器\n\n容器是存储数据的方式，可以是内置数据类型（如 `int` 和 `float`），也可以是类对象。\n\nSTL 提供了几种基本类型的容器：\n\
  \n- `<vector>`: 一维数组\n- `<list>`: 双向链表\n- `<deque>`: 双端队列\n- `<queue>`: 队列\n- `<stack>`:\
  \ 栈\n- `<set>`: 集合\n- `<map>`: 关联数组\n\n### i) 序列容器\n\n序列容器按顺序存储一组元素，换句话说，每个元素（第一个和最后一个除外）前面都有一个特定的元素，后面都有另一个元素，`<vector>`、`<list>`\
  \ 和 `<deque>` 就是序列容器。\n\n### ii) 关联容器\n\n关联容器是非顺序的，但它使用一个 `key`（键）来访问元素。键（通常是数字或字符串）被容器用于按特定顺序排列存储的元素，例如在字典中，条目按字母顺序排序的。\n\
  \n- `<set>` 存储许多包含键的项。键是用于排序项的属性，例如，集合可以存储 `Person` 类的对象，这些对象根据名称按字母顺序排序。\n- `<map>`\
  \ 存储对象对：一个键对象和一个关联的值对象。`<map>` 在某种程度上类似于数组，不同之处在于它不是使用索引号访问元素，而是使用任意类型的索引来访问元素。\n\
  \n### iii) 适配器容器\n\n容器适配器只是特殊的容器，它们使用 STL 提供的容器、迭代器和算法的通用框架。\n\n![](img/image01394.jpeg)\n\
  \n## 算法\n\n范围 (range) 是任何可以通过迭代器或指针访问的对象序列，例如数组或某些 [STL 容器](http://www.cplusplus.com/stl)\
  \ 的实例。但注意，算法直接通过迭代器对值进行操作，不会以任何方式影响任何容器的结构（它永远不会影响容器的大小或存储分配）。算法的类型有：\n\nI. **非修改算法**：某些方法是：\n\
  1. `count()`\n2. `equal()`\n3. `find()`\n4. `find_end()`\n5. `find_if()`\n6. `search()`\n\
  \nII. **修改算法**：某些方法是：\n1. `copy()`\n2. `fill()`\n3. `generate()`\n4. `remove()`\n\
  5. `replace()`\n6. `reverse()`\n7. `unique()`\n\nIII. **排序算法**：某些方法是：\n1. `binary_search()`\n\
  2. `equal_range()`\n3. `merge()`\n4. `sort()`\n5. `partial_sort()`\n6. `Partition()`\n\
  \nIV. **集合算法**：\n1. `include()`\n2. `set_difference()`\n3. `set_intersection()`\n\
  4. `set_union()`\n\nV. **关系算法**：某些方法是：\n1. `equal()`\n2. `max()`\n3. `max_element()`\n\
  4. `min()`\n5. `min_element()`\n6. `mismatch()`\n\n让我们通过使用 vector 模板来展示容器、迭代器和算法的工作。\n\
  \n![](img/image0195.jpeg)\n\n```cpp\n#include <vector>\n#include <iostream>\n\n\
  vector<int> v(3);  // 创建一个大小为 3 的 int vector\nv[0]=23;\n\nv[1]=12;\nv[2]=9; // vector\
  \ 已满\nv.push_back(17);// 在数组末尾添加新值\nfor (int i=0; i<v.size(); i++) // vector 的成员函数\
  \ size()\n    cout << v[i] << \" \"; // 随机访问 i 个元素\n```\n\n![](img/image196.gif)\n\
  ```cpp\n#include <vector>\n#include <algorithm>\n#include <iostream>\nint key;\n\
  \nint arr[] = { 12, 3, 17, 8, 34, 56, 9 }; // 标准 C 数组\nvector<int> v(arr, arr+7);\
  \ // 使用 C 数组初始化 vector\nvector<int>::iterator iter;\n\ncout << \"enter value:\"\
  ;\ncin >> key;\n\niter=find(v.begin(),v.end(),key); // 在 v 中查找整数 key\nif (iter !=\
  \ v.end()) // 找到元素\n    cout << \"Element \" << key << \" found\" << endl;\nelse\n\
  \    cout << \"Element \" << key << \" not in vector v\" << endl;\n```\n\n这个 `find()`\
  \ 算法用于查找一个数字是否存在于给定的 vector 中。\n\n\n\n\n瀑布模型是软件工程中首次广泛使用的软件开发生命周期（SDLC）模型，以确保项目的成功。在“瀑布”方法中，软件开发的整个过程被划分为不同的阶段。在瀑布模型中，通常上一个阶段的输出将顺序作为下一个阶段的输入。\n\
  \n以下是瀑布模型不同阶段的图示表示。\n\n![](img/image01397.jpeg)\n\n瀑布模型中的顺序阶段包括：\n\n*   需求收集与分析：在这一阶段，捕获待开发系统的所有可能需求，并记录在需求规格文档中。\n\
  *   系统设计：在这一阶段研究第一阶段的需求规格书，并准备系统设计。系统设计有助于明确硬件和系统需求，还有助于定义整体系统架构。\n*   实现：根据系统设计的输入，首先开发称为“单元”的小型程序，并在下一阶段对它们进行集成。每个单元都将对其功能进行开发和测试，这被称为单元测试。\n\
  *   集成与测试：在实现阶段开发的所有单元在对每个单元进行测试后，集成到一个系统中。集成完成后，对整个系统进行测试，以发现任何故障和失败。\n*   系统部署：一旦完成功能和非功能测试，产品将部署到客户环境或发布到市场。\n\
  *   维护：客户环境中会出现一些问题。为了修复这些问题，会发布补丁。此外，为了增强产品，还会发布更好的版本。维护是为了在客户环境中交付这些更改。\n\n所有这些阶段都是相互级联的，进度表现为稳步地向下流动（像瀑布一样）穿过各个阶段。只有在完成前一个阶段定义的\
  \ set 目标并获得签字确认后，才会开始下一个阶段，因此得名“瀑布模型”。在该模型中，各阶段之间是不重叠的。\n\n## 瀑布模型的应用\n\n每种开发的软件都是不同的，需要根据内部和外部因素遵循适当的\
  \ SDLC 方法。使用瀑布模型最合适的情况包括：\n\n*   需求有详尽的文档、清晰且固定。\n*   产品定义稳定。\n*   技术已理解且不具动态性。\n\
  *   没有模糊的需求。\n***拥有充足的资源和所需的专业知识来支持产品。\n*   项目周期较短。\n\n## 瀑布模型的优缺点\n\n### 优点\n\n\
  瀑布式开发的优点是它允许部门化和控制。可以为开发的每个阶段设定带有截止日的计划，产品可以逐一通过开发模型的各个阶段。\n\n开发从概念开始，经过设计、实现、测试、安装、故障排除，最后于运行和维护。开发的每个阶段都按照严格的顺序进行。\n\
  \n### 缺点\n\n瀑布式开发的缺点是不允许进行大量的反思或修订。一旦应用程序进入测试阶段，就很难回溯并更改在概念阶段没有妥善记录或考虑周全的内容。\n\n\
  下表列出了瀑布模型的优缺点：\n\n| 优点 | 缺点 |\n| :--- | :--- |\n| * 简单、易于理解和使用 | * 在生命周期后期之前不会产生可运行的软件。\
  \ |\n| * 由于模型的僵性，易于管理。每个阶段都有特定的交付物和评审过程。 | * 风险和不确定性高。 |\n| * 阶段一个一个地处理并完成。 | *\
  \ 不适用于复杂和面向对象的项目的模型。 |\n| * 对于需求非常明确的小型项目效果良好。 | * 长期和持续项目的糟糕模型。 |\n| * 阶段定义明确。\
  \ | * 不适用于需求具有中等到高变更风险的项目。因此，该过程模型的风险和不确定性很高。 |\n| * 里程碑明确。 | * 很难衡量阶段内的进度。 |\n\
  | * 任务于安排。 | * 无法适应变化的需求。 |\n| * 过程和结果都有详尽文档。 | * 在生命周期后期之前产生可运行的软件。 |\n| | * 在生命周期期间调整范围会导致项目终止。\
  \ |\n| | 集成在最后以“爆炸式”完成，这使得无法早期识别任何技术或业务瓶颈或挑战。 |\n\n## 喷泉流模型\n\nAnthony Aleong, Glen\
  \ Mitchell, Kareem Shaw\n\n瀑布模型已广为人知，但它不再像以前那样有用了。在 1991 年《信息中心季刊》的一篇文章中，Larry Runge\
  \ 表示，“当我们自动化文员和会计师的工作时，SDLC 效果非常好。但在为知识工作者构建系统时——帮助台的人员、试图解决问题的专家或试图带领公司进入世界百强名单的高管——它的效果就差得多，甚至完全无效。”\n\
  \n另一个问题是，瀑布模型假设用户的唯一角色是指定需求，并且所有需求都可以预先指定。遗憾的是，需求在整个过程中以及之后不断增长和变化，需要大量的反馈和迭代咨询。因此，开发了许多其他\
  \ SDLC 模型。\n\n喷泉模型承认，尽管某些活动不能在其他活动之前开始（例如，你需要设计然后可以开始编码），但在整个开发周期中活动存在大量的重叠。\n\n\
  ### 喷泉模型\n\n*   支持增量式开发\n*   承认某些活动无法先于其他活动，但在整个开发周期中活动存在大量的重叠\n*   意味着你先进行某些分析，然后是某些设计，然后是某些实现\n\
  *   各个阶段之间的并行性以及阶段内的迭代\n*   开发面向对象的系统，这更有可能让我们关注整体的局部，称为“类”或子系统\n*   子系统是紧密工作的类集合\n\
  *   支持人类学习，并适用于大多数项目\n\n### 面向对象的生命周期符号（喷泉模型）\n\n任何面向对象的版本的整体软件开发生命周期的图形表示都必须考虑到隐含的高度重叠和迭代。在纯面向对象的软件开发方法中，“瀑布”模型是一种过于限制的方法，可以被图\
  \ 1 所示的高度迭代的“喷泉”模型所取代。该模型包含了复用和域分析/设计。\n\n![](img/image1398.gif)\n\n图 1. 面向对象的软件生命周期的喷泉模型。\n\
  \n活动的合并和重叠通过圆形符号的重叠程度来表示。面向对象系统中维护需求的减少通过较小的活动圆圈来象征。\n\n在喷泉中，水向中间上升然后落回，要么落入下方的“池”，要么在中间层被重新捕获。面向对象的软件开发也是如此，从分析到设计到实现的总体流贯穿了分析、设计和实现这二（或三个）宽泛“阶段”的迭代循环，“池”代表类的“软件池”或仓库”。\n\
  \n这张图图 1 概述了面向对象开发系统级感知的般特征。在分析、设计、实现和单元测试阶段存在高度的合并。\n\n\n\n\n首先，喷泉模型（fountain model）为面向对象软件生命周期中的阶段提供了图化版本，并清晰地表示了面向对象技术实现的迭代和重叠。其次，由于成功的软件项目的基础是需求分析和规范，因此这一阶段被置于图表的底部。因此，生命周期向上生长到软件使用的顶峰，仅在必要的维护阶段才会回落。这有效地将周期的某个阶段回到了较低水平。将此模型应用于特定环境可能会导致如原型设计之类的软件生命周期：面向对象的编程语言非常适合这种开发环境。\n\
  \n系统不仅可以从图 1 所示的系统生命周期角度来看，还可以从许多（通常是大量的）自主类的协同整合角度来看。在类开发和系统规范之间，可以更方便地进行交互式修改，因此不再需要在系统生命周期的早期阶段冻结整个系统需求规范——这一面向对象的方法论的属性被许多作者正面评价。因此，由于面向对象的程序本质上是作为一个相互作用的类系统（通常是独立开发的），生命周期模型的阶段可以更准确地应用于每个单独类的开发周期，而不是整个系统。\n\
  \n## 喷泉模型 - 优势\n\n- 迭代式瀑布开发模式\n- 经典线性\n- 分析、设计、编码、测试与发布\n\n## 喷泉模型 - 劣势\n\n- 未反映面向对象特性\n\
  - 无法提交交付物\n\n## 对象分析的不同模型\n\n与传统的系统分析不同（传统方法收集用户需求然后编写规范，并要求用户对规范签字），对象方法使用一种更具迭代性的过程，其中需求和规范被反复审查，并且用户深度参与。\n\
  \n对象技术有许多不同的方法来帮助分析和设计计算机系统。我们将回顾四种最流行的系统：Rumbaugh、Booch、Coad-Yourdon 和 Shlaer-Mellor。在大多数情况下，这些方法非常相似，但每种方法都有自己的图形化表示实体的方法。对于所有项目来说，理解和使用这四种方法可能会变得困难甚至不可能。如果需要，可以将一种方法的概念与另一种技术的概念结合起来，基本上创建你自己的对象开发技术。最重要记住的一点是，最终结果才是真正重要的，而不是选择一种分析技术而非另一种技术。记住，进行适当的分析和设计以满足用户需求，比盲目地遵循一个毫无意义的程序要重要得多。\n\
  \n传统的系统开发方法有时被称为瀑布法。通过瀑布法，对象分析师遵循分析、设计、编码、测试和维护的逻辑演进。遗憾的是，系统开发很少符合这种结构化方法。终端用户以改变主意或识别出他们忘记识别的某些功能而闻名。这些需求的变化可能发生在系统开发的任何阶段，分析师必须努力将这些变化纳入系统。\n\
  \n面向对象的方法论需要一个更具迭代性的过程，且具有相同的五个步骤。迭代过程要么添加新属性，要么更清晰地定义现有属性，而不像传统方法那样重做已经完成的规范。迭代过程有助于减少对系统到底应该做什么以及用户到底想要什么的困惑。面向对象的软件开发方法假设用户需求会发生。然而，你使用哪种编程语言（无论是\
  \ `FORTRAN` 还是 `C++`）并不重要。此外，你使用哪种系统开发技术并不重要，你将在系统开发中遵循相同的五个步骤。仅仅是这五个步骤的应用方式决定了你系统开发项目的差异。\n\
  \n## Rumbaugh 方法\n\nRumbaugh 方法列在第一是因为这是这些作者最喜欢的，我们发现这是一个非常友好且易于使用的方法。对于传统的系统分析师来说，Rumbaugh\
  \ 方法与传统的系统分析和设计方法最接近，新手将识别熟悉的符号和技术。Rumbaugh 方法的主要优势在于对象分析，但它在对象设计方面也非常出色。Rumbaugh\
  \ 在对象分析阶段有三个交付物：`Object model`（对象模型）、`Dynamic model`（动态模型）和 `functional model`（功能模型）。这三个模型与传统的系统分析相似，增加了对象模型部分，包括\
  \ `classes`（类）的定义以及 `classes` 变量和行为。Rumbaugh 对象模型非常像实体关系图，只是现在图中有了行为和类层次结构。动态模型是一个“状态转换”图，显示了实体如何从一个状态转变为另一个状态。功能模型等同于传统系统分析中熟悉的数据流图。\n\
  \n## Booch 方法\n\nBooch 方法的主要优势在于对象系统设计。Grady Booch 在他的方法中包含了与传统需求分析相似的需求需求分析，以及一个领域分析阶段。Booch\
  \ 的对象系统设计方法分为四个部分：定义 `class hierarchies`（类层次结构）的逻辑结构设计，以及描述 `object methods`（对象方法）的物理结构图。此外，Booch\
  \ 以非常类似于 Rumbaugh 方法的方式定义了 `classes`（类）的动态，以及对对象实例动态的分析，在其中描述了对象如何改变状态。\n\n## Coad-Yourdon\
  \ 方法\n\nCoad-Yourdon 方法的主要优势在于系统分析。他们的方法基于一种名为 \"SOSAS\" 的技术，这代表了组成他们方法分析部分的五个步骤。系统分析的第一步称为\
  \ `Subjects`（主体），它们基本上是对象的数据流图。第二步称为 `Objects`（对象），在其中他们识别 `object classes`（对象类）和\
  \ `class hierarchies`（类层次结构）。第三步称为 `Structures`（结构），将结构分解为两种类型：`classification structures`（分类结构）和\
  \ `composition structures`（组合结构）。`classification structures` 处理相关类之间的继承连接，而 `composition\
  \ structures` 处理类之间的所有其他连接。分析的下一步是 `Attributes`（属性），最后一步是 `Services`（服务），在其中识别了每个类的所有行为或方法。\n\
  \n在分析之后，Coad 和 Yourdon 定义了组成他们方法设计部分的四个部分。系统设计的步骤为：\n\n- 问题域组件 - 这将定义应该位于问题域的类。\n\
  - 人机交互组件 - 这些步骤定义了对象之间的接口类。\n- 任务管理组件 - 在这里识别系统级管理类。\n- 数据管理组件 - 此设计步骤识别了数据库访问方法所需的类。\n\
  \n## Shlaer-Mellor 方法\n\n\n\n\n\nShlaer-Mellor 方法论的主要优势在于系统设计，而在分析方面被认为较为薄弱。Shlaer-Mellor\
  \ 方法论包含三个模型：信息模型、状态模型和过程模型。信息模型包含 `objects`、`variables` 以及 `objects` 之间所有的关系，它基本上是系统的数据模型。状态模型记录\
  \ `objects` 的不同状态以及 `objects` 之间可能发生的变化。过程模型本质上只不过是传统的数据流图。\n\n既然我们已经涵盖了对象方法的基础知识，让我们来看下如何使用这些技术创建现实世界的对象。\n\
  \n## 面向对象的设计模型\n\n一种面向对象的方法论基于开发模块和组件的重用。因此，需要一种考虑到这种重用的新开发模型。如图 1.15 “面向对象的设计模型”所示，面向对象模型构建了将现有软件模块集成到系统开发中。一个可用组件数据库为重用提供组件。面向对象模型从问题的表述和分析开始。在设计阶段之后，会对组件库进行调查，查看是否有任何组件可以在系统开发中重用。如果库中没有该组件，则必须开发一个新组件，这涉及该模块的表述、分析、编码和测试。新组件被添加到库中并用于构建新应用程序。\n\
  \n该模型旨在通过将现有模块集成到开发中降低成本。这些模块通常质量更高，因为它们已经过其他客户的现场测试，并且应该经过了调试。使用该模型的开发时间应该更短，因为需要写的代码更少。\n\
  \n图 1.15 面向对象的设计模型\n\n![](img/image01399.jpeg)\n\n随着组件库随时间的增长，面向对象模型应该与其他模型相比更具优势。\n\
  \n# 一个设计问题示例\n\n**任务：** 如果给我们这样一个问题：“编写一个程序来实现简单的储蓄账户”……账户应允许存款、取款、利息和手续费。\n\n**解决方案：**\
  \ 问题产生了许多需要理解的概念，例如 `bank account`、`deposit`、`withdrawal`、`balance` 等。OO 语言允许程序员将这些概念一直引入编码步骤。储蓄账户可以用\
  \ `account number` 和 `balance` 属性以及 `deposit` 和 `withdrawal` 方法来构建，以符合 `bank account`\
  \ 的概念。这允许设计阶段和编码阶段之间几乎直接的映射，使得代码易于阅读和理解（从而降低维护和开发成本）。\n\nOOP 还允许软件重用！……这个储蓄账户的概念应该独立于问题的其他部分被理解。这种通用的储蓄账户肯定会在其他某些金融问题中找到重用。\n\
  \n在与客户讨论后，可以实现以下表述——设计一个包含柜员和 ATM 交互的银行系统，规则如下：\n\n* 现金银员和 ATM 负责发放现金。\n* 网络由许多银行共享。\n\
  * 每笔交易都将涉及一个账户和记录。\n* 有不同类型的银行账户。\n* 有不同类型的交易。\n* 所有银行使用相同的货币。\n* 允许外币交易。\n* ATM\
  \ 机机和柜员需要银行卡。\n\n### 步骤 1. 识别可能的类\n\n* `ATM`、`cashier`、`cashier station`、`software`、`customer`、`cash`。\n\
  * `banking network`、`bank`。\n* `transaction`、`transaction record`。\n* `account`、`deposit\
  \ account`、`long term savings account`、`current account`。\n* `withdrawal`、`lodgement`、`cheque`。\n\
  * `currency`。\n* `foreign currency`、`euro cheque`。\n* `cash card`、`computer system`。\n\
  \n### 步骤 2. 移除模糊的类\n\n* `software`、`computer system`、`cash`。\n\n### 步骤 3. 添加产生的新类！\n\
  \n* `currency converter`\n\n### 步骤 4. 创建关联\n\n* `Banking Network`（包括柜员和 `ATMs`）\n\
  * `Banks`（持有账户）\n* `Account`（有一个 `balance`、一个 `currency` 和一个 `transactions` 日志）\n\
  * `Transaction`（需要银行卡）\n* `Lodgement`（有一个 `account number` 和一个 `amount`）\n* `Withdrawal`（有一个\
  \ `account number` 和一个 `amount`）\n* `Cheque`（是一种 `withdrawal`，有一个 `payee` 和一个 `amount`）\n\
  * `Eurocheque`（是一种 `cheque`，有一个 `currency`）\n* `ATMs`（接受银行卡，发放现金）\n\n### 步骤 5. 细化类\n\
  \n**Bank（银行):**\n* 有一个名称\n* 有账户\n* 有基本货币\n* 有一个排序代码\n\n**Account（账户）:**\n* 有一个所有者\n\
  * 有 `balance`\n* 有一个 `account number`\n* 有 `transactions` 日志\n\n**Deposit Account（存款账户）:**\n\
  * 是一种 `account`\n* 有一个共享利率\n\n**Current Account（活期账户）:**\n* 是一种 `account`\n* 有 `overdraft\
  \ limit`\n\n**Transaction（交易）:**\n* 有一个 `account`\n* 有一个 `date`\n* 有一个 `value`\n\
  * 有一个 `bank`\n* 有一个 `account`\n* 有一个 `number`\n\n**Withdrawal（取款）:**\n* 是一种 `transaction`\n\
  \n**Lodgement（存款）:**\n* 是一种 `transaction`\n\n**Cheque（支票）:**\n* 是一种 `withdrawal`\n\
  * 有一个 `payee`\n\n**EuroCheque（欧元票）:**\n* 是一种 `cheque`\n* 有一个 `currency`\n\n**CurrencyConverter（货币转换器）:**\n\
  \n### 步骤 6. 类的视觉化表示\n\n![](img/image4400.jpeg) 图 1.16 `Bank` 类。\n\n![](img/image1401.jpeg)\
  \ 图 1.17 `Account` 类。\n\n![](img/image1400.jpeg) 图 1.18 `Transaction` 类。\n\n![](img/image1403.jpeg)\n\
  \n## 组件软件\n\n（如何在面向对象设计中表示“组件”？请解释。）\n\n将项目分解为逻辑组件是面向对象分析设计的本质。这也是组件软件的基础，组件软件由二进制形式（而非源代码）的可重用软件部分组成，可以相对容易地插入其他供应商的组件中。重要的是，基于组件的软件开发方法并不规定应用程序的结构。相反，它是一种使二进制组件能够编程、使用和独立演变的模型。组件独立于使用它们的应用程序，也独立于创建它们的编程语言。组件软件允许软件开发人员专注于他们最擅长的领域。\n\
  \n\n\n\n\n## 组件软件与编程\n\n组件软件的一个很好的类比可以在汽车行业中找到，在该行业中，汽车制造商通常从不同的制造商购买单个汽车零件（如发动机和变速箱），然后用这些组件组装成汽车。对于组件软件，这些部分可以原样使用——它们不需要重新编译，你不需要源代码，而且不受限于某一种编程语言。这一过程的术语是**二进制重用**，因为它基于接口而不是基于源代码层面的重用。虽然软件组件必须遵守约定的接口，但它们的内部实现是完全自主的。正因如此，你可以使用过程化语言也可以使用面向对象的语言来构建组件。\n\
  \n基于组件的编程模型的主要目标之一是促进互操作性。互操作性是计算机领域中的流行术语之一，对不同的人有不同的含义。在组件软件的语境下，互操作性简单意味着组件之间协同工作的能力。当你检查一个项目并注意到软件似乎被不自然地强凑在一起的地方时，就应该将应用程序划分为组件。\n\
  \n## 案例研究：控件\n\n让我们以控件为例。在过去的 Windows 编程旧时代，如果你的程序需要一个工具栏，你只需将工具栏代码直接写入应用程序的主部分。这种方法存在两个固有的问题。首先，你的目标可能不是创建一个酷炫的工具栏，而是创建一个带有工具栏的优秀应用程序。其次，在你花费了许多宝贵时间开发工具栏后，如果你公司的其他开发者想在他们的项目中使用该工具栏，由于代码散落在整个程序中并响应\
  \ `WM_CREATE`、`WM_PAINT` 和 `WM_LBUTTONDOWN` 消息，他们无法轻松地重用它。\n\n解决这一问题的基于组件的方法是将工具栏变成一个独立的组件。问题就变成了工具栏组件和应用程序应该如何交互——即整个互操作性问题。组件软件范式要求所有组件都定义一个接口，以暴露该组件可用的功能。只要组件实现了接口且客户端应用程序遵守该接口，就能实现互操作性。在工具栏示例中，应用程序开发者可以从某个专门制作工具栏的其他开发者那里购买工具栏组件，从而节省开发、调试和维护时间。\n\
  \n## 封装与合约\n\n之前提到的面向对象编程的一个重要原则是封装。封装向对象用户隐藏了对象的实现。对象的用户只能访问对象的接口。在项目中使用预构建对象的开发者只感兴趣“合约”——即对象支持的承诺行为。组件软件正式化了对象与客户端之间合约的概念。每个对象通过实现某些接口来声明它的能力。访问对象服务的唯一方法是通过它所支持的接口。这种合约是互操作性的基础。\n\
  \n## 原型\n\n尽管面向对象的分析和设计描述了系统功能，但在选择产品后不久，为一些关键系统组件构建原型是非常重要的。原型能够让你充分理解实现系统某些功能的难易程度如何。它还可以给用户提供一个对用户界面设计的可用性和实用用性发表意见的机会，并让你评估所选软件工具、功能规范与用户需求之间的匹配程度。此外，原型制作可以进一步定义用例，它实际上实际上让用例建模变得简单得多。\n\
  \n原型有多种方式进行分类。以下类别是一些被接受的原型，代表了查看原型的非常不同的方式，每种方式都有自己的优势：\n\n*   水平原型\n*   垂直原型\n\
  *   分析原型\n\n水平原型是对接口的模拟（即它具有完整功能系统中将包含的整个用户界面），但不包含任何功能。这种方法的优点是实现非常快，提供了对系统的良好感受，并允许用户根据他们对系统的正常预期感知来评估界面。\n\
  \n垂直原型是具有完整功能的系统特征的子集。这种方法的主要优势是实现的少数功能可以进行深度的测试。在实践中，原型是水平和垂直的混合体：建立界面的大部分部分以便用户获得系统的感觉，而具有高风险特征的功能会带有更多功能进行原型制作。\n\
  \n分析原型是探索问题领域的辅助工具。这类原型用于告知用户并演示概念验证。然而，它不被用作开发的基础，完成任务后就会被丢弃。最终产品将使用原型暴露的概念，而不是它的代码。领域原型是最终软件解决方案增量开发的辅助工具。它通常用作向用户或其他开发团队其他成员分阶段交付子系统的工具。它证明了实现的可行性，并最终将演变成一个可交付的产品。\n\
  \n制作原型所需的典型时间从几天到几周不等，取决于原型的类型和功能。原型制作应该包含来自所有受项目影响的用户组的代表，特别是终端用户和管理人员，以确保原型的整体结构符合为整体设计的要求。\n\
  \n## 对象识别的活动顺序\n\n1.  在终端用户或应用领域专家的帮助下制定几个场景。\n2.  在应用领域专家的帮助下，从场景中提取用例。\n3.  然后并行进行以下操作：\n\
  \    *   使用 Abbot 的文本分析技术分析每个用例中的事件流。\n    *   生成 `UML` 类图。\n\n## 案例研究：铁路预订系统\n\n\
  使用面向对象设计开发一个铁路预订系统。绘制必要的图表。\n\n让我们通过软件工具展示 OOAD 的过程。\n\n## 铁路预订系统问题描述\n\n需要开发软件来自动化人工铁路预订系统。系统应该是分布式的。它被设计为提供以下功能：\n\
  \n1.  订座：乘客应该能够在火车上预订座位。乘客填写预订表并交给办事员，然后由办事员检查指定旅行日期的座位可用情况。如果有座位，则在系统中输入关于车次名称、车次、旅行日期、出发站、目的地、人员姓名、性别和总票价的信息。要求乘客支付所需的票价并打印车票。如果没有座位，则通知乘客。\n\
  2.  取消预订：想要取消预订的乘客需要填写表单。然后将表单和车票提交给办事员。办事员随后删除系统中的条目并更改该列车的预订状态。办事员手划车票以标记为已取消。\n\
  \n\n\n\n\n### 3. 更新列车信息\n只有管理员可以在系统中输入与列车信息相关的更改，如列车名称、车次、列车路线等。\n\n### 4. 报告生成\n\
  系统应提供生成不同报告的功能。系统应能够生成订票图、每月列车报告等。\n\n### 5. 登录\n出于安全考虑，系统的所有用户都分配了用户 ID 和密码。只有当\
  \ ID 和密码正确时，用户才允许进入系统并从系统的可用选项中选择。\n\n### 6. 查看订票状态\n所有用户都应该能够在线查看列车的订票状态。用户需要输入车次和票上打印的\
  \ 码，以便系统显示其当前的订票状态，如已确认、RAC 或候补名单。\n\n### 7. 查看列车时刻\n应提供查看整个列车网络时刻表的相关信息。用户应该能够查看车名、车次、上车站和终点、行程时长等。\n\
  \n## 分析与设计方法论\n\n该流程的步骤序列如下：\n\n#### 步骤 1：如果存在预设计模型，则选择它。\n根据开发平台选择框架。\n\n#### 步骤\
  \ 2：利用用例图。\n任何分析和设计过程的通用流程都是从识别系统功能和与系统相关的参与者开始。我们用用例图来描述要开发的系统的概览。\n\n在分析上述问题后，我们确定了系统的以下用例和参与者。\n\
  \n与系统相关的参与者有：\n1. 管理员\n2. 订票员\n3. 乘客\n4. 打印机\n\n系统的用例有：\n1. 预订座位\n2. 取消订票\n3. 更新列车信息\n\
  4. 报告生成\n5. 登录\n6. 查看订票状态\n7. 查看列车时刻\n\n![](img/image01404.jpeg)\n\n图 2：铁路订票系统用例图\n\
  \n#### 步骤 3：定义类并将它们与每个用例关联。\n我们将考虑登录用例并描述其完整流程。\n\n为了实现此用例，我们需要一个用户界面来输入用户 ID 和密码。这需要与数据库进行验证，因此我们需要一个实体类，并且为了协调前端和后端之间的工作，我们需要一个控制类。我们需要为这些类每一个分配一个名称。\n\
  \n- 边界类类型：`Login Form`\n- 实体类：`Login_Information`（数据库表名）\n- 控制类：`Login_Ctrl`\n\n\
