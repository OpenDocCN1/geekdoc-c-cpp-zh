  raw: 'A Bad Example:


    f = open(''file.txt'')


    a = f.read()


    print a


    f.close()


    A Good Example:


    with open(''file.txt'') as f:


    for line in f:


    print line


    Using the with statement is far more efficient because it makes sure the file
    is always closed even when the with block contains an exception


    ## Line Continuations


    THERE ARE ACCEPTED limits to logical code lines and when you have one that is
    longer, it should be split up over several lines. Your Python interpreter will
    take consecutive lines and, so long as the final character on each line is a backslash
    (/), it will join the lines. However, although this can be useful sometimes, really
    you should avoid doing it because it can be fragile. If you were to add a whitespace
    after the backslash, it can break your code and the results might not be what
    you expected.


    A better way to do this is to enclose elements inside parentheses. If there is
    an unclosed parenthesis at the end of the line, the next line will be joined,
    and so on until there is a closed parenthesis. You could also use square or curly
    braces to do the same thing, so long as you remain consistent – whatever you use
    to start, you must also use to finish.


    A Bad Example:


    an_incredibly_big_string = """For many years I would go to bed early. Sometimes,
    \


    after I had put out my light, my eyes would shut so fast that I would not even
    \


    have the time to say “I am going to sleep.”"""


    from some.module.inside.another.module import a_good_function, another_good_function,
    \


    yet_another_good_function


    A Good Example:


    my_incredibly_big_string = (


    "For many years, I would go to bed early. Sometimes, "


    "when I had put out my light, my eyes would shut so fast "


    "that I would not even have time to say “I am going to sleep.”"


    )


    from some.module.inside.another.module import (


    a_good_function, another_good_function, yet_another_good_function)


    That said, if you find that you are having to keep on splitting up long lines,
    it is just a sign that you are trying to do too much and this will affect the
    readability of the code


