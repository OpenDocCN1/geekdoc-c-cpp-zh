    \ `__lt__`, `__ne__`, `__ge__`, `__gt__`, `__le__)`.\n\nTo cut down on the effort\
    \ needed, one particular decorator helps to generate any comparison methods that\
    \ are missing. That decorator is `functools.total_ordering()`.\n\nThe style guidelines\
    \ indicate that Python assumes reflexivity rules. As such, the Python interpreter\
    \ might change things about by swapping `y > x` with `x < y`, or it may swap `y\
    \ >= x` with `x <= y`.\n\nYou may also find that the argument `x == y` has been\
    \ swapped with `x != y`. The `min()` and `sort()` operations will also definitely\
    \ use the `<` operator and the `max()` function will use the `>`operator. However,\
    \ you should, as a best practice guide, use all of them so that there is no confusion.\n\
    \n*   Rather than using an assignment statement that will bind a lambda expression\
    \ to an identifier, use a `def` statement.\n\nA Good Example:\n```python\ndef\
    \ f(x): return 2*x\n```\n\nA Bad Example:\n```python\nf = lambda x: 2*x\n```\n\
    \nThe first example shows that the name given to the function object is ‘f’ rather\
    \ than the collective `<lambda>`. This is the most useful for string representations\
    \ and for tracebacks and, by using the assignment statement, you cut out the one\
    \ benefit that a lambda expression offers over and above a def statement – that\
    \ it may be embedded within a bigger statement.\n\nWhen you want to derive exceptions,\
    \ use `Exception` and not `BaseException`. Inheritance from the latter is reserved\
    \ for those exceptions where it is pretty much always wrong to catch them.\n\n\
    When you design your exception hierarchies, base them on the quality that is likely\
    \ to be needed by catching exceptions, rather than on the location where the exception\
    \ is raised. Always answer one question – “what has gone wrong?” rather than just\
    \ saying that something is wrong. Use the conventions for class naming but do\
    \ remember to add the “Error” suffix to the exception classes that produce an\
    \ error.\n\nThere is no need to put any special suffixes on exceptions that are\
    \ not errors and are used as flow-control or another form of signaling.\n\n* \
    \  When you use exception chaining, use it only where needed.\n\nWhen you replace\
    \ an inner exception deliberately, make sure that the right details are relocated\
    \ into the newer exception. Examples of this are making sure the name of the attribute\
    \ is preserved when you convert `KeyError` to `AttributeError` or when you embed\
    \ the original exception text into the message in the newer exception.\n\n*  \
    \ When using Python 2 and you raise an exception, always use the `raise ValueError('message')`\
