    \n感谢你的阅读，并祝贺你阅读了《Python：编程最佳实践》。这本书包含了关于如何更有效地编写 Python 代码的经过证明的步骤和策略。当你初学 Python\
    \ 时，会教你如何编写代码，但在很多情况下，并不会教你如何整洁地编写这些代码。\n\n如果你接触任何 Python 程序员，问问他们喜欢 Python 的哪一点。我保证他们会告诉你，主要原因之一是因为它易于阅读。事实上，这是\
    \ Python 语言绝对的核心，因为计算机代码被阅读的次数远大于编写的次数。这在很大程度上归于 Python 代码遵循一套指南和“Pythonic”（Python\
    \ 式）惯用法——如果你听到程序员提到某部分代码不“Pythonic”，意味着它没有遵循这些指南，并且没有以任何可读的方式表达意图。\n\n代码风格和布局至关重要，你所使用的风格的一致性也是如此。尽管如此，有时一致性并不是正确的选择，指南也并不适用——你必须知道什么时候是时候，而这正是进行\
    \ Python 编程时的最佳判断。\n\n通过本指南，我将向你展示编写代码的绝对最佳方法，整理你的程序并使其更加有效、高效。我不会只给你基础知识。我将深入探讨你需要了解的一切，从代码布局到如何编写函数、惯用法和命名。\n\
    \n我将讨论空白符和制表符、字符串和方法。我还会提供一些关于 Python 编程的建议以及通用概念。简而言之，当你读完我的最佳实践指南后，你将成为你可能最好的\
    \ Python 程序员。\n\n我的书假设你具备 Python 编程的一些先验知识，所以如果你是编程领域的完全新手，请在阅读本书之前熟悉 Python 代码。我的目标是帮助你编写出没有（或至少很少）复杂或明显问题的\
    \ Python 代码，并使其对他人更具可读性。\n\n再次感谢阅读，希望你喜欢！\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
    \n# 第一章：Python 编码通用概念\n\n![image](img/chapter_title_below.png)\n\n在我们正式进入本书之前，这些是你应该意识的编码通用概念；这些概念会让你的生活变得更轻松。\n\
    \n## 显式代码\n\n虽然你可以用 Python 做到所有奇奇妙妙的事情，但最好保持代码直观和显式。\n\n**错误示例：**\n```python\n\
    def make_complex(*args):\n    x, y = args\n    return dict(**locals())\n```\n\n\
    ––––\n\n![image](img/scene_break.png)\n\n**正确示例：**\n```python\ndef make_complex(x,\
    \ y):\n    return {'x': x, 'y': y}\n```\n\n比较这些示例；在后一种代码示例中，我们显式地接收了 x 和 y，并且返回一个字典。错误示例中并非如此。\n\
    \n## 一行一个语句\n\n虽然存在复合语句（如列表推导式）是被允许的并且在很多情况下受到推崇，但将两个不连续的语句放在同一行并不是良好的做法。\n\n\
    **错误示例：**\n```python\nprint 'one'; print 'two'\nif x == 1: print 'one'\nif <complex\
    \ comparison> and <other complex comparison>: do something\n```\n\n––––\n\n![image](img/scene_break.png)\n\
    \n**正确示例：**\n```python\nprint 'one'\nprint 'two'\nif x == 1:\n    print 'one'\n\
    cond1 = <complex comparison>\ncond2 = <other complex comparison>\nif cond1 and\
    \ cond2:\n    do something\n```\n\n## 返回值\n\n当函数的复杂度不断增加时，在函数体中使用多个返回语句并不罕见。然而，如果你想保持清晰的意图和良好的可读性，你应该尽量避免从函数体的多个点返回返回值。\n\
    \n在函数内部返回数值时，有两种情况：来自正常处理的函数返回的结果，以及指示输入参数错误或由于任何原因函数无法完成计算的错误。\n\n如果你不想在后一种情况下引发异常，那么可能需要返回值（例如\
    \ False 或 None），作为函数无法正常执行的指示。在这样的情况下，最佳实践是在注意到错误的上下文时立即返回。\n\n"
- fmt: "\nThat said, if a function contains several different courses it can go, it\
    \ can be unwieldy to debug the result so it is preferable to maintain just one\
    \ course. This also helps in working out code paths and, if you have several courses,\
    \ it could be an indication that you need to re-look at your code and tidy it\
    \ up.\n\nFor Example:\n\n```python\ndef complex_function(c, b, a):\n    if not\
    \ c:\n        return None  # Raising an exception might be better\n    if not\
    \ b:\n        return None  # Raising an exception might be better\n    # Some\
    \ elaborate code that is trying to make x from c, b and a\n    # Try not to return\
    \ x if successful\n    if not x:\n        # A Plan-B calculation of x\n      \
    \  return x  # One exit point for the value x will be helpful\n```\n\n# Chapter\
    \ 2\n\n## Programming Recommendations\n\nThese are the basic recommendations for\
    \ writing Python code, recommendations that you should follow if your code is\
    \ going to be more effective and efficient as well as being readable.\n\n*   Your\
    \ code must be written so that it doesn’t disadvantage other Python implementations,\
    \ such as `IronPython`, `Jython`, `PyPy`, `Psyco` and `Cython`.\n\nFor example,\
    \ you should never rely on the efficient string concatenation of `CPython` that\
    \ takes the form of `a=a+b` or `a+=b`. This is a somewhat fragile optimization,\
    \ even though it super-efficient in `CPython`, because it won’t work on al type\
    \ it won’t be present in any Python implementation that does not use refcounting.\n\
    \nInstead, where you use a part of the library that is performance-sensitive,\
    \ you should use the `.join()` form instead. This will make sure the concatenation\
    \ is linear across all the different Python implementations.\n\n*   Never use\
    \ an equality operator to make comparisons to a singleton such as `None`. Instead,\
    \ use `is` or `not`.\n\nYou should also be wary of using `if x` when really you\
    \ should be using `if is not None`. An example of this is when you are testing\
    \ if an argument or a variable that defaults to a value of `None` was actually\
    \ set to a different value. The other value could have a type that is false in\
    \ the Boolean context.\n\n*   Rather than using the operator `not...is`, you should\
    \ use `is not`. While they both are identical in terms of function, the first\
    \ is low on the readability scale, making the second one more preferable. An example:\n\
    \nUse This:\n```python\nif foo is not None:\n```\n\nDon’t Use This:\n\n```python\n\
    if not foo is None\n```\n\n*   When you implement an ordering operation with a\
