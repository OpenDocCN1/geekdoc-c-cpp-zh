    # Chapter 5:


    ![image](Images/chapter_title_below.png)


    Comments


    Because you already have some experience of Python coding, you will know that
    a comment is invisible when the program is run. A comment is there to help the
    coder and others who read it to understand what has been done and why. Now, some
    people think that, because they are invisible then there is no need to write them
    while others write comments that make no sense and that contradict their code.
    I have to tell you that, out of the two, having a contradictory comment is far
    worse than not writing one at all and, as such, whenever you make changes to your
    code, you must make sure that you update your comments.


    When you write a comment, ensure that it is a proper sentence with a proper ending.
    As it is when you write anything, your comment, be it a sentence or a phrase,
    must have a capital letter to start it. The only exception to that rule is if
    it is an identifier that starts with a lower-case letter – a golden rule here
    is that you NEVER change the case of an identifier!


    If you are using a short comment you can leave off the full-stop at the end. If
    you are writing block comments, these tend to be made up of at least one paragraph,
    sometimes more, each one built from whole sentences. Each of these sentences must
    have a full-stop. Following each full-stop there should be 2 spaces and all comments
    should be written in English. The only exception to this is if you are 200% certain
    that your code is never going to be read by people who do not speak or read your
    language


    ## Block Comments:


    A BLOCK COMMENT TENDS to apply to some or all of the code that comes after it.
    The comment should be indented in the exact same way as the code it refers to
    and each line of each block must begin with a # and one space. The only exception
    is if you have used indented text within the comment. All paragraphs in each block
    comment must be separated with a line that contains one #.


    ## Inline Comments


    THESE SHOULD BE USED as little as possible. As a refresher, an inline comment
    is a comment that is placed on the same line that a statement is on. An inline
    comment has to be separated from the statement by a minimum of two spaces and
    they must begin with one # and one space.


    In all honesty, you should avoid using inline comments because they are not really
    necessary and can cause an unwanted distraction.


    For example, you should never do this:


    x = x + 1  # Increment x


    However, sometimes, this could be useful:


    x = x + 1  # Compensate for the border


