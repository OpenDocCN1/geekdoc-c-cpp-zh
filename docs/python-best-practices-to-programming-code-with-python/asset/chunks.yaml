    \ |\n\n![image](Images/chapter_title_above.png)\n\n# Introduction\n\n![image](Images/chapter_title_below.png)\n\
    \nI want to thank you and congratulate you for reading the book, “Python: Best\
    \ Practices to Programming Code with Python”. This book contains proven steps\
    \ and strategies on how to program in Python more effectively. When you first\
    \ learn Python, you will be taught how to write code, but in many cases, you will\
    \ not be taught how to write that code neatly.\n\nIf you speak to any Python programmer,\
    \ ask them what it is they like about Python. I guarantee they will tell you that\
    \ one of the main reasons is because it is easily readable. In fact, this is the\
    \ absolute heart of the Python language, simply because computer code is read\
    \ far more than it is written. Much of this is down to the fact that Python code\
    \ follows a set of guidelines and “Pythonic” idioms – if you hear a programmer\
    \ refer to a part of the code as not being “Pythonic”, it means that it doesn’t\
    \ follow those guidelines and it doesn’t express intent in any readable manner.\n\
    \nCode style and layout is incredibly important, as is consistency in the style\
    \ that you use. With that said, there are times when consistency isn’t the right\
    \ thing and the guidelines are simply not applicable – you have to know when that\
    \ time is and that is when best judgment comes into programming with Python.\n\
    \nWith this guide, I am going to show you the absolute best way to write your\
    \ code, tidying up your program and making it all more effective and efficient.\
    \ I won’t just give you the basic. I will delve deep into everything you need\
    \ to know, from the layout of the code to how to write functions, idioms, and\
    \ names.\n\nI will talk about whitespaces and tabs, strings, and methods. I will\
    \ also be giving you some general recommendations for Python programming along\
    \ with the general concepts. In short, by the time you have read my Best Practice\
    \ guide, you will be the best Python programmer you can possibly be.\n\nMy book\
    \ does assume some prior knowledge of Python programming, so if you are a complete\
    \ newbie to the programming scene, please familiarize yourself with Python code\
    \ before you read this book. My aim is to help you to produce Python code that\
    \ is free from, or at least has very few, complications or obvious problems, as\
    \ well as making it more readable for others.\n\nThanks again for reading this\
    \ book, I hope you enjoy it!\n\n| ![image](Images/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](Images/chapter_title_corner_decoration_right.png) |\n\n![image](Images/chapter_title_above.png)\n\
    \n# Chapter 1: General Concepts of Python Coding\n\n![image](Images/chapter_title_below.png)\n\
    \nBefore we get properly into the book, these are the general concepts of coding\
    \ that you should be aware of; these will make life easier for you.\n\n## Explicit\
    \ Code\n\nWHILE YOU CAN DO ALL sorts of weird and wonderful things with Python,\
    \ it is best to keep it straightforward and explicit.\n\n**Bad Example:**\n```python\n\
    def make_complex(*args):\n    x, y = args\n    return dict(**locals())\n```\n\n\
    ––––––\n\n![image](Images/scene_break.png)\n\n**Good Example:**\n```python\ndef\
    \ make_complex(x, y):\n    return {'x': x, 'y': y}\n```\n\nCompare these examples;\
    \ in the latter example of code, we explicitly received x and y from the caller\
    \ and the return is an dictionary. This is not the case with the bad example.\n\
    \n## One Line, One Statement\n\nWHILE THERE ARE COMPOUND statements, like the\
    \ list comprehensions, that are allowed and, in many cases, appreciated, it is\
    \ not good practice to have 2 statements that are disjointed on one line.\n\n\
    **Bad Example:**\n```python\nprint 'one'; print 'two'\nif x == 1: print 'one'\n\
    if <complex comparison> and <other complex comparison>: do something\n```\n\n\
    ––––––\n\n![image](Images/scene_break.png)\n\n**Good Example:**\n```python\nprint\
    \ 'one'\nprint 'two'\nif x == 1:\n    print 'one'\ncond1 = <complex comparison>\n\
    cond2 = <other complex comparison>\nif cond1 and cond2:\n    do something\n```\n\
    \n## Returning Values\n\nWHEN YOU GET A FUNCTION that is ever-growing in complexity,\
    \ it isn’t unheard of to use several return statements in the body of the function.\
    \ However, if you want to maintain clear intent and a good level of readability,\
    \ you should try not to return values from several points in the function body.\n\
    \nWhen it comes to returning values within a function, there are 2 cases for doing\
    \ so: the result that comes from a normally processed function return, and the\
    \ errors that are indicative of incorrect input parameters or for any reason that\
    \ the function cannot complete the computation.\n\nIf you don’t want exceptions\
    \ raised for the latter case, then it might be necessary for values, such as False\
    \ or None to be returned, as an indication that the function was not able to perform\
    \ properly. In cases such as this, it is best practice to return as soon as the\
    \ wrong context has been noticed.\n\nThis will help to neaten up the function\
    \ structure because all code that comes after the error return assumes that the\
    \ condition has been met so that the main function result can be computed. As\
    \ such, it is sometimes necessary to have several return statements like this.\n"
