    \ as f:\n    for line in f:\n        print line\n```\n\n使用 `with` 语句要高效得多，因为它能确保即使在\
    \ `with` 块包含异常时，文件始终被关闭。\n\n## 行延续\n\n逻辑代码行是有接受限制的，当有一行较长的代码时，应该将其拆分成几行。你的 Python\
    \ 解释器会处理连续的行，只要每行的最后一个字符是反斜杠（`\\`），它就会将这些行合并。然而，尽管这有时很有用，但实际上你应该避免这样做，因为它是脆弱的。如果你在反斜杠后面添加了空格，可能会破坏代码，并且结果可能不是你预期的。\n\
    \n此事的更好方法是将元素包含在括号内。如果行尾有一个未闭合的括号，下一行将被合并，依此类推，直到遇到闭合括号。你也可以使用方括号或花括号来做同样的事情，只要保持一致性即可——无论用什么开始，也必须用什么结束。\n\
