  trans: "\n\n在以下情况下请勿使用不必要的空格：\n\n*   紧在大括号、中括号或圆括号内部\n\n良好的示例：\n```python\nham(spam[1],\
    \ {eggs: 2})\n```\n\n错误的示例：\n```python\nham( spam[ 1 ], { eggs: 2 } )\n```\n\n\
    *   在冒号、分号或逗号的前正面：\n\n良好的示例：\n```python\nif x == 4: print x, y; x, y = y, x\n\
    ```\n\n错误的示例：\n```python\nif x == 4 : print x , y ; x , y = y , x\n```\n\n然而，当你使用切片（slice）时，冒号（`:`）类似于二元运算符，两侧应包含等量的空格。当你使用扩展切片时，两个冒号必须包含完全相同的间距。唯一的例外是省略了切片参数以及对应的空格。\n\
    \n良好的示例：\n```python\nspam[1:8], spam[1:8:2], spam[:8:2], spam[1::2], spam[1:8:]\n\
    spam[lower:upper], spam[lower:upper:], spam[lower::step]\nspam[lower+offset :\
    \ upper+offset]\nspam[: upper_fn(x) : step_fn(x)], ham[:: step_fn(x)]\nspam[lower\
    \ + offset : upper + offset]\n```\n\n错误的示例：\n```python\nspam[lower + offset:upper\
    \ + offset]\nspam[1: 8], ham[1 :8], ham[1:8 :2]\nspam[lower : : upper]\nspam[\
    \ : upper]\n```\n\n*   在函数调用参数列表开始的左圆括号之前：\n\n良好的示例：\n```python\nham(1)\n```\n\
    \n––––––––\n\n![image](img/scene_break.png)\n\n错误的示例：\n```python\nham (1)\n```\n\
    \n*   在开始切片或索引的左圆括号之前：\n\n良好的示例：\n```python\ndct['key'] = lst[index]\n```\n\n\
    错误的示例：\n```python\ndct ['key'] = lst [index]\n```\n\n*   当运算符（如赋值符号）周围有多个空格，且为了与另一个运算符对齐时\n\
    \n良好的示例：\n```python\nx = 1\ny = 2\nlong_variable = 3\n```\n\n错误的示例：\n```python\n\
    x  = 1\ny  = 2\nlong_variable = 3\n```\n\n## 其他建议\n\n**避免在代码各处出现行尾空格**，因为它们是不可见的且可能会引起混惑。例如，如果你输入一个反斜杠后跟一个空格然后换行——这不会被计为行延续符。事实上，某些文本编辑器不会保留它，而某些包含预提交钩子（pre-commit\
    \ hooks）的项目会直接拒绝它——其中之一就是 CPython。\n\n以下二元运算符周围应保留单个空格——每侧一个：\n\n*   赋值（=`）\n\
    *   复合赋值（`+=`, `=` 等）\n\n以下比较运算符的处理方式相同：\n\n*   `==`\n*   `<`\n*   `>`\n*   `!=`\n\
    *   `<>`\n*   `<=`\n*   `>=`\n*   `in`\n*   `not in`\n*   `is`\n*   `is not`\n\
    \n以及这些布尔值：\n\n*   `and`\n*   `or`\n*   `not`\n\n如果你使用优先级不同的运算符，考虑在低优先级的运算符周围添加空格——在此处请根据你的最佳判断。然而，你不应使用超过一个空格，并确保运算符的每一侧都有相同的空格——不要在一侧放\
    \ 1 个另一侧放 2 个：\n\n良好的示例：\n```python\ni = i + 1\nsubmitted += 1\nx = x*2 - 1\n\
    hypot2 = x*x + y*y\nc = (a+b) * (a-b)\n```\n\n错误的示例：\n```python\ni=i+1\nsubmitted\
    \ +=1\nx = x * 2 - 1\nhypot2 = x * x + y * y\nc = (a + b) * (a - b)\n```\n\n当使用\
    \ `=` 符号表示参数或关键字参数的默认值时，不要在该符号周围使用空格：\n\n良好的示例：\n```python\ndef complex(real,\
    \ imag=0.0):\nreturn magic(r=real, i=imag)\n```\n\n错误的示例：\n```python\ndef complex(real,\
    \ imag = 0.0):\nreturn magic(r = real, i = imag)\n```\n\n对于函数注解的冒号使用标准规则，并确保在使用\
    \ `->` 时其周围有空格：\n\n良好的示例：\n```python\ndef munge(input: AnyStr): ...\ndef munge()\
    \ -> AnyStr: ...\n```\n\n错误的示例：\n```python\ndef munge(input:AnyStr): ...\ndef\
    \ munge()->PosInt: ...\n```\n\n当结合使用默认值和参数注解时，`=` 符号周围应该有空格——除非该参数既有默认值又有注解，否则请勿这样做：\n\
    \n良好的示例：\n```python\ndef munge(sep: AnyStr = None): ...\ndef munge(input: AnyStr,\
    \ sep: AnyStr = None, limit=1000): ...\n```\n\n错误的示例：\n```python\ndef munge(sep:\
    \ AnyStr=None): ...\ndef munge(input:AnyStr, limit = 1000): ...\n```\n\n偶尔在一行内组合\
    \ `if`、`for` 和 `while` 语句是可以允许的，只要它们的体很短：\n\n良好的示例：\n```python\nif foo == 'that':\n\
    \    do_that_thing()\n    do_one()\n    do_two()\n    do_three()\n```\n\n错误的示例：\n\
    ```python\nif foo == 'that': do_that_thing(); do_one(); do_two(); do_three()\n\
    ```\n\n在一行内使用复合语句不是好的做法，但你不应该折叠非常长的行：\n\n"
