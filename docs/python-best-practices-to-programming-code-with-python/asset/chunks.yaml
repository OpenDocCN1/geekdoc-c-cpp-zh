  trans: "\n第二个示例没有向我们提供任何信息，表明 `__enter__` 和 `__exit__` 方法除了关闭事务之外是否还做了其他操作。在这种情况下，保持显式说明是非常重要的。\n\
    \n- 返回语句的一致性非常重要。要么所有的函数返回语句都返回表达式或值，要么一个返回语句都不返回。如果一个返回语句确实返回了表达式，那么任何不返回任何值的返回语句都应该显式地声明返回值为\
    \ `None`，并且在该函数的末尾应该有一个返回语句。\n\n### 一个好的示例：\n\n```python\ndef foo(x):\n    if\
    \ x >= 0:\n        return math.sqrt(x)\n    else:\n        return None\n\ndef\
    \ bar(x):\n    if x < 0:\n        return None\n    return math.sqrt(x)\n```\n\n\
    ### 一个不好的示例：\n\n```python\ndef foo(x):\n    if x >= 0:\n        return math.sqrt(x)\n\
    def bar(x):\n    if x < 0:\n        return\n    return math.sqrt(x)\n```\n\n-\
    \ 不要使用字符串模块；而要使用字符串方法。\n\n这些方法总是更快，而且它们与 Unicode 字符串共享 API。如果你需要与早于 2.0 的 Python\
    \ 实现向后兼容，则可以忽略这条规则。\n\n- 不要使用字符串切片作为检查后缀和前缀的方法，而要使用 `.startswith()` 和 `.endswith()`。\n\
    \n这些方法简洁得多，而且不容易出错。\n\n––––––––\n\n![image](img/scene_break.png)\n\n### 一个正好的示例：\n\
    \n```python\nif foo.beginswith('bar'):\n```\n\n### 一个不好的示例：\n\n```python\nif foo[:3]\
    \ == 'bar':\n```\n\n- 当你比较对象类型时，使用 `isinstance()` 而不是直接比较。\n\n### 一个好的示例：\n\n\
    ```python\nif isinstance(obj, int):\n```\n\n### 一个不好的示例：\n\n```python\nif type(obj)\
    \ is type(1):\n```\n\n当你检查一个对象是否实际上是字符串时，记住它也可能是一个 Unicode 字符串。在 Python 2.0 中，Unicode\
    \ 和 `str` 共享一个名为 `basestring` 的基类，因此你可以这样做：\n\n```python\nif isinstance(obj, basestring):\n\
    ```\n\n然而，在 Python 3 中，你找不到 `basestring` 或 `Unicode`，只有 `str` 和 `bytes` 对象不再是字符串，它们现在是整数序列。\n\
    \n对于序列——元组、列表、字符串等——请利用空序列为假的这一特性。\n\n### 一个好的示例：\n\n```python\nif not seq:\n\
    if seq:\n```\n\n### 一个不好的示例：\n\n```python\nif len(seq):\nif not len(seq):\n```\n\
    \n不要包含任何需要大量尾部空格的字符串字面量，因为这些是无法区分的，某些文本编辑器会删除它们。\n\n不要使用 `==` 来比较布尔值与 True 或 False：\n\
    \n### 一个好的示例：\n\n```python\nif greeting:\n```\n\n––––––––\n\n![image](img/scene_break.png)\n\
    \n### 一个不好的示例：\n\n```python\nif the greeting == True:\n```\n\n### 一个更糟糕的示例：\n\n\
    ```python\nif the greeting is True:\n```\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
    \n# 第 3 章：\n\n 代码布局\n\n![image](img/chapter_title_below.png)\n\n最显眼的起点是如何布局你的代码。我将为你提供代码布局的最佳实践指南，以及关于如何这样做以及如何不做的示例：\n\
    \n## 缩进与对齐\n\n每一个缩进级别都应该是 4 个空格。\n\n当你使用延续行时，它们应该使用以下两种方法之一来对齐折行的元素：\n\n- 使用 Python\
    \ 在大括号、括号和圆括号内部隐式连接行的办法，或\n- 使用悬挂缩进。\n\n当你使用悬挂缩进时，考虑到第一行不应该有任何参数，并且为了标记延续行，必须使用缩进。\n\
    \n考虑以下示例：\n\n### 正确的方法：\n\n```python\ndef my_function(arg1, arg2,\n          \
    \      arg3, arg4):\n    print(arg1, arg2)\n\ndef my_function(arg1,\n        \
    \        arg2,\n                arg3, arg4):\n    print(arg1, arg2)\n```\n\n###\
    \ 错误的方法：\n\n```python\ndef my_function(arg1, arg2,\n    arg3, arg4):\n    print(arg1,\
    \ arg2)\n\ndef my_function(arg1,\n    arg2, arg3, arg4):\n    print(arg1, arg2)\n\
    ```\n\n### 好的示例：\n\n```python\ndef my_function(arg1, arg2,\n                arg3,\
    \ arg4):\n    print(arg1, arg2)\n```\n\n### 不好的示例：\n\n```python\ndef my_function(arg1,\
    \ arg2,\n    arg3, arg4):\n    print(arg1, arg2)\n```\n\n（注：上述示例仅为演示缩进逻辑，实际代码根据上下文调整）\n"
- fmt: "\nYou will often see it recommended that you use a single underscore `_` for\
    \ variables that are throwaway, rather than using a double underscore `__`. The\
    \ problem with this is, `\"-\"`, the single underscore, tends to be used in the\
    \ `gettext()` function as an alias. It is also used to store the value of the\
    \ previous operation at the interactive prompt. When you use a double underscore,\
    \ `__`, it is clear and it is convenient. It also cuts out the accidental risk\
    \ of interfering with the other use cases of the single underscore.\n\n## Creating\
    \ Length-N Lists\n\nTO CREATE A LENGTH-N list that is of the same thing, you would\
    \ use the `*` operator\n\n```python\nfour_zeros = [Zero] * 4\n```\n\nTo create\
    \ a length-N list of a list you should not use the `*` operator. That operator\
    \ creates lists of N that refer to the same list and that is not what we want\
    \ here. Instead, we use a list comprehension:\n\n```python\nfour_lists = [[] for\
    \ __ in xrange(4)]\n```\n\nNote – If you are using Python 3, use `range()` and\
    \ not `xrange()`.\n\n## Creating Strings from Lists\n\nTHE MOST COMMON IDIOM for\
    \ creating strings is `str.join()` on empty strings:\n\n```python\nletters = ['c',\
    \ 'l', o, 't']\nword = ''.join(letters)\n```\n\nThis sets a value of “clot” to\
    \ the variable `word`. You can apply this idiom to tuples and lists.\n\n## Searching\
    \ a Collection for an Item\n\nON OCCASION, YOU WILL need to search a collection\
    \ for a specific option and there are two ways to do this – using lists or sets\n\
    \nLook at this example:\n\n```python\ns = set(['c', 'l', 'o', 't'])\nl = ['c',\
    \ 'l', 'o', 't']\n\ndef lookup_set(s):\n    return 's' in s\n\ndef lookup_list(l):\n\
    \    return 's' in l\n```\n\nNow, both of these functions look exactly the same\
    \ simply because `lookup_set` uses that fact that Python sets are hash tables.\
    \ However, the performance of lookup in each of the examples is different. In\
    \ order to decide whether a specific item is contained in a list, Python has to\
    \ search through every single item until it finds one that matches. This takes\
    \ time, especially if you have a long list. With sets, each item has a hash that\
    \ tells Python where to look for the matching item. This makes the search much\
    \ quicker even if the sets are big ones. You can also search dictionaries in the\
    \ same way. Because there is a difference in the performance, it is a better idea\
    \ to use a set or a dictionary rather than a list in the following cases:\n\n\
    * Where a collection contains a lot of items\n* Where you are going to be searching\
    \ for items in a collection on a repeated basis\n* There are no duplicate items\n\
    \nIn cases of smaller collections or those that you are not likely to be searching\
    \ on a frequent basis, the extra memory and time needed to set the hash table\
    \ up will, more often than not, be more than the time you save by improving the\
    \ speed of the search.\n\n| ![image](Images/chapter_title_corner_decoration_left.png)\
    \ | | ![image](Images/chapter_title_corner_decoration_right.png) |\n\n![image](Images/chapter_title_above.png)\n\
    \n# Chapter 5: Comments\n\n![image](Images/chapter_title_below.png)\n\nBecause\
    \ you already have some experience of Python coding, you will know that a comment\
    \ is invisible when the program is run. A comment is there to help the coder and\
    \ others who read it to understand what has been done and why. Now, some people\
    \ think that, because they are invisible then there is no need to write them while\
    \ others write comments that make no sense and that contradict their code. I have\
    \ to tell you that, out of the two, having a contradictory comment is far worse\
    \ than not writing one at all and, as such, whenever you make changes to your\
    \ code, you must make sure that you update your comments.\n\nWhen you write a\
    \ comment, ensure that it is a proper sentence with a proper ending. As it is\
    \ when you write anything, your comment, be it a sentence or a phrase, must have\
    \ a capital letter to start it. The only exception to that rule is if it is an\
    \ identifier that starts with a lower-case letter – a golden rule here is that\
    \ you NEVER change the case of an identifier!\n\nIf you are using a short comment\
    \ you can leave off the full-stop at the end. If you are writing block comments,\
    \ these tend to be made up of at least one paragraph, sometimes more, each one\
    \ built from whole sentences. Each of these sentences must have a full-stop. Following\
    \ each full-stop there should be 2 spaces and all comments should be written in\
    \ English. The only exception to this is if you are 200% certain that your code\
    \ is never going to be read by people who do not speak or read your language.\n\
