- fmt: "\nThe second example does not give us any information that indicates whether\
    \ the `__enter__` and `__exit__` methods do anything other than shutting the transaction.\
    \ In this case, it is important to be explicit.\n\n- Consistency in return statements\
    \ is important. Either all of the function return statements or none of the return\
    \ statements should return an expression or value. If a return statement does\
    \ return an expression, any that do not return any value should state explicitly\
    \ that the return is `None` and there should be a return statement at the end\
    \ of that function.\n\n### A Good Example:\n\n```python\ndef foo(x):\n    if x\
    \ >= 0:\n        return math.sqrt(x)\n    else:\n        return None\n\ndef bar(x):\n\
    \    if x < 0:\n        return None\n    return math.sqrt(x)\n```\n\n### A Bad\
    \ Example:\n\n```python\ndef foo(x):\n    if x >= 0:\n        return math.sqrt(x)\n\
    def bar(x):\n    if x < 0:\n        return\n    return math.sqrt(x)\n```\n\n-\
    \ Don’t use string modules; use string methods instead.\n\nThese are always faster\
    \ and they share an API with the Unicode strings. This rule can be ignored if\
    \ you need backward compatibility with a Python implementation that is earlier\
    \ than 2.0.\n\n- Instead of using string slicing as a way of checking for suffixes\
    \ and prefixes, use `.startswith()` and `.endswith()` instead.\n\nThese are much\
    \ cleaner methods and they are less prone to errors.\n\n––––––––\n\n![image](Images/scene_break.png)\n\
    \n### A GOOD EXAMPLE:\n\n```python\nif foo.beginswith('bar'):\n```\n\n### A Bad\
    \ Example:\n\n```python\nif foo[:3] == 'bar':\n```\n\n- When you are comparing\
    \ object types, use `isinstance()` instead of direct comparisons.\n\n### A Good\
    \ Example:\n\n```python\nif isinstance(obj, int):\n```\n\n### A Bad Example:\n\
    \n```python\nif type(obj) is type(1):\n```\n\nWhen you check to see if an object\
    \ is actually a string, remember that it could be a Unicode string as well. In\
    \ Python 2.0, Unicode and `str` share the base class called `basestring` so you\
    \ could do:\n\n```python\nif isinstance(obj, basestring):\n```\n\nHowever, in\
    \ Python 3, you won’t find `basestring` or `Unicode`, only `str` and `bytes` objects\
    \ are not strings anymore, they are integer sequences instead.\n\nFor a sequence\
    \ – tuples, lists, strings, etc. – make use of the fact that an empty sequence\
    \ is false.\n\n### A Good Example:\n\n```python\nif not seq:\nif seq:\n```\n\n\
    ### A Bad Example:\n\n```python\nif len(seq):\nif not len(seq):\n```\n\nDon’t\
    \ include any string literals that require significant levels of trailing whitespace\
    \ because this is not distinguishable and some text editors will remove them.\n\
    \nDon’t use `==` to compare a Boolean value to True or False:\n\n### A Good Example:\n\
    \n```python\nif greeting:\n```\n\n––––––––\n\n![image](Images/scene_break.png)\n\
    \n### A BAD EXAMPLE:\n\n```python\nif the greeting == True:\n```\n\n### An Even\
