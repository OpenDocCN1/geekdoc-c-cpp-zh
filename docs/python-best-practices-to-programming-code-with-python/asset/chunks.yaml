  trans: "\n\n你经常会看到建议你使用单下划线 `_` 作为弃用变量，而不是使用双下划线 `__`。这样做的问题在于，单下划线 `\"-\"` 经常在\
    \ `gettext()` 函数中用别名。它还用于存储交互式提示符中上一次操作的值。当你使用双下划线 `__` 时，它既清晰又方便。它还避免了意外干扰单下划线其他用例的风险。\n\
    \n## 创建长度为 N 的列表\n\n要创建一个相同元素的长度为 N 的列表，你会使用 `*` 运算符。\n\n```python\nfour_zeros\
    \ = [Zero] * 4\n```\n\n要创建一个长度为 N 的嵌套列表，你不应该使用 `*` 运算符。该运算符会创建引用同一个列表的 N 个列表，而这并不是我们想要的结果。相反，我们使用列表推导式：\n\
    \n```python\nfour_lists = [[] for __ in xrange(4)]\n```\n\n注意 – 如果你使用的是 Python\
    \ 3，请使用 `range()` 而不是 `xrange()`。\n\n## 从列表创建字符串\n\n创建字符串最常用的惯用法是在空字符串上使用 `str.join()`：\n\
    \n```python\nletters = ['c', 'l', o, 't']\nword = ''.join(letters)\n```\n\n这为变量\
    \ `word` 设置了值“clot”。你可以将这种惯用法应用于元组和列表。\n\n## 在集合中查找项目\n\n有时，你需要在集合中搜索特定的选项，有两种方法可以实现这一点——使用列表或集合。\n\
    \n看这个示例：\n\n```python\ns = set(['c', 'l', 'o', 't'])\nl = ['c', 'l', 'o', 't']\n\
    \ndef lookup_set(s):\n    return 's' in s\n\ndef lookup_list(l):\n    return 's'\
    \ in l\n```\n\n现在，这两个函数看起来完全一样，仅仅是因为 `lookup_set` 利用了 Python 集合是哈希表的这一。然而，每个示例中的查找性能是不同的。为了判断某个特定项目是否在列表中，Python\
    \ 必须搜索每一个项目，直到找到匹配的项为止。这需要时间，尤其是当你有一个长列表时。对于集合，每个项目都有一个哈希值，告诉 Python 在哪里查找匹配的项目。这使得即使集合很大，搜索速度也快得多。你也可以以相同的方式搜索字典。由于性能存在差异，在以下情况下，使用集合或字典比使用列表更好的主意：\n\
    \n* 集合包含大量项目时\n* 你将重复地搜索集合中的项目时\n* 没有重复项目\n\n对于较小的集合或你可能不会频繁搜索的集合，设置哈希表所需的额外内存和时间，通常会超过你通过提高搜索速度所节省的时间。\n\
    \n| ![image](img/chapter_title_corner_decoration_left.png) | | ![image](img/chapter_title_corner_decoration_right.png)\
    \ |\n\n![image](img/chapter_title_above.png)\n\n# 第 5 章：注释\n\n![image](img/chapter_title_below.png)\n\
    \n由于你已经有一些 Python 编程经验，你会知道注释在程序运行时是不可见的。注释是为了帮助代码编写者和其他阅读代码的人理解他们做了什么以及为什么要这样做。现在，有些人认为，因为注释是不可见的，所以没有必要编写它们；而另一些人编写了毫无意义且与其代码矛盾的注释。我必须告诉你，在这两者中，拥有一个矛盾的注释比完全不写要糟糕得多。因此，每当你对代码进行更改时，都必须确保更新了你的注释。\n\
    \n当你写注释时，确保它是一个带有正确结尾的完整句子。正如你写任何内容一样，你的注释（无论是句子还是短语）必须以大写字母开头。该规则的唯一例外是它是一个以小字母开头的标识符——这里的黄金法则是：**永远不要**改变标识符的大小写！\n\
    \n如果你使用短注释，可以省略末尾的句号。如果你在写块注释，这些通常由至少一个段落组成，有时更多，每个段落由完整的句子组成。这些句子中的每一个都必须有句号。每个句号后面应该有两个空格，且所有注释都应该用英文编写。唯一的例外是你\
    \ 200% 确定你的代码永远不会被不会说或读你语言的人阅读。\n\n## 块注释\n\n块注释通常适用于其后的部分或全部代码。注释的缩进方式必须与其所指的代码完全相同，每个块的每一行必须以\
    \ `#` 和一个空格开头。唯一的例外是你在注释内部使用了缩进文本。每个块注释中的所有段落必须用包含一个 `#` 的行隔开。\n\n## 行内注释\n\n\
    这些应该尽可能少用。作为回顾，行内注释是放置在语句同一行的注释。行内注释与语句之间至少要有两个空格隔开，并且必须以一个 `#` 和一个空格开头。\n\n诚实地说，你应该避免使用行内注释，因为它们并不是必要的，并且会引起不必要的干扰。\n\
    \n例如，你不应该这样做：\n\n```python\nx = x + 1  # 递增 x\n```\n\n然而，有时可以这样：\n\n```python\n\
    word = ''.join(letters) # 组合字母\n```\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \ | | ![image](img/chapter_title_corner_decoration_right.png) |\n\n# 第 6 章：惯例\n\
    \n为了让你的 Python 代码更好，遵循这些惯例：\n\n## 如何访问字典元素\n\n不要使用 `has_key()` 方法，使用 `x in d`\
    \ 语法或使用 `get()` 来传递默认参数。\n\n坏示例：\n\n```python\nd = {'hello': 'world'}\nif d.has_key('hello'):\n\
    \    print d['hello']\nelse:\n    print 'the_default_value'\n```\n\n好示例：\n\n```python\n\
    d = {'hello': 'world'}\nprint d.get('hello', 'default_value') # 输出 'world'\nprint\
    \ d.get('thingy', 'default_value') # 输出 'default_value'\n# 或者：\nif 'hello' in\
    \ d:\n    print d['hello']\n```\n\n## 简洁地操作列表\n\n在操作列表时，你不需要冗长；当你想要对列表执行操作时，使用列表推导式或\
    \ `filter()`、`map()` 函数来使用简洁语法。\n\n坏示例：\n\n```python\n# 过滤所有大于 4 的元素\na = [5,\
    \ 4, 3]\nb = []\nfor i in a:\n    if i > 4:\n        b.append(i)\n```\n\n好示例：\n\
    \n```python\na = [5, 4, 3]\nb = [i for i in a if i > 4]\n# 或者：\nb = filter(lambda\
    \ x: x > 4, a)\n```\n\n另一个坏示例：\n\n```python\n# 给列表的所有成员加 3\na = [5, 4, 3]\nfor\
    \ i in range(len(a)):\n    a[i] += 3\n```\n\n另一个好示例：\n\n```python\na = [5, 4,\
    \ 3]\na = [i + 3 for i in a]\n# 或者：\na = map(lambda i: i + 3, a)\n```\n\n你也可以使用\
    \ `enumerate()` 函数来记录你在列表中的位置：\n\n```python\na = [5, 4, 3]\nfor i, item in enumerate(a):\n\
    \    print i, item\n# 输出：\n# 0 5\n# 1 4\n# 2 3\n```\n\n"
- fmt: "\n### A Bad Example:\n\n```python\nf = open('file.txt')\n\na = f.read()\n\n\
    print a\n\nf.close()\n```\n\n### A Good Example:\n\n```python\nwith open('file.txt')\
    \ as f:\n    for line in f:\n        print line\n```\n\nUsing the `with` statement\
    \ is far more efficient because it makes sure the file is always closed even when\
    \ the `with` block contains an exception\n\n## Line Continuations\n\nThere are\
    \ accepted limits to logical code lines and when you have one that is longer,\
    \ it should be split up over several lines. Your Python interpreter will take\
    \ consecutive lines and, so long as the final character on each line is a backslash\
    \ (`\\`), it will join the lines. However, although this can be useful sometimes,\
    \ really you should avoid doing it because it can be fragile. If you were to add\
    \ a whitespace after the backslash, it can break your code and the results might\
    \ not be what you expected.\n\nA better way to do this is to enclose elements\
    \ inside parentheses. If there is an unclosed parenthesis at the end of the line,\
    \ the next line will be joined, and so on until there is a closed parenthesis.\
    \ You could also use square or curly braces to do the same thing, so long as you\
    \ remain consistent – whatever you use to start, you must also use to finish.\n\
    \n### A Bad Example:\n\n```python\nan_incredibly_big_string = \"\"\"For many years\
    \ I would go to bed early. Sometimes, \\\n\nafter I had put out my light, my eyes\
    \ would shut so fast that I would not even \\\n\nhave the time to say “I am going\
    \ to sleep.”\"\"\"\n\nfrom some.module.inside.another.module import a_good_function,\
    \ another_good_function, \\\n\nyet_another_good_function\n```\n\n### A Good Example:\n\
    \n```python\nmy_incredibly_big_string = (\n    \"For many years, I would go to\
    \ bed early. Sometimes, \"\n    \"when I had put out my light, my eyes would shut\
    \ so fast \"\n    \"that I would not even have time to say “I am going to sleep.”\"\
    \n)\n\nfrom some.module.inside.another.module import (\n    a_good_function, another_good_function,\
    \ yet_another_good_function)\n```\n\nThat said, if you find that you are having\
    \ to keep on splitting up long lines, it is just a sign that you are trying to\
    \ do too much and this will affect the readability of the code\n\n| ![image](Images/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](Images/chapter_title_corner_decoration_right.png) |\n\n![image](Images/chapter_title_above.png)\n\
    \n# Chapter 7:\n\nMethod and Function Arguments\n\nFor the first argument in any\
    \ instance method always use `self` and, for the first argument in any class method,\
    \ always use `cls`.\n\nIf the name of a function’s argument is the same as one\
    \ of the reserved keywords, then it is best to add one trailing underscore than\
    \ it is to use a corrupted spelling or an abbreviation. As such, you should use\
    \ `class_` rather than `clss`. Perhaps even better than causing a clash - use\
    \ a synonym.\n\n## Function Arguments\n\nThere are 4 WAYS that you can pass an\
    \ argument to a function:\n\n1. **Positional Argument** – these are mandatory\
    \ and do not contain any default values. The positional is the simplest argument\
    \ form and are used for the arguments that are a complete part of the meaning\
    \ of a function; they also have a natural order so, in the following example,\
    \ the function user should find it easy to remember that the 2 functions need\
    \ 2 arguments and they should remember the order: `Send(message, recipient)` and\
    \ `point(x, y)`\n\nIn both cases, you can use the argument names when you call\
    \ the functions and, by doing this, you can change the order the arguments are\
    \ in. For example, you could call `send(recipient='world', message='Hello')` and\
    \ `point(y=2, x=1)`. However, as you can see from this, it is not very readable\
    \ and there are way more words there than we need. Compare that version to the\
    \ one that is more straightforward – `send('Hello', 'World')` and `point(1,2)`\
    \ and you can see the difference in readability instantly.\n\n2. **Keyword Argument**\
    \ – these do contain default values and they are not mandatory. Keyword arguments\
    \ are sometimes used for optional parameters that you send to the function. When\
    \ a function contains at least 2 or 3, preferably more, positional parameters,\
    \ it is not easy to remember. Using a keyword argument that has a default value\
    \ is more helpful. For example, you could define a complete `send` function as\
    \ `send(message, to, cc=None, bcc=None)`. The use of `cc` and `bcc` is optional\
    \ and both have a value of `None` if they are not given another value.\n\nThere\
    \ are a few ways that you can call a function with a keyword argument in Python.\
    \ For example, you could follow the argument order in a definition and no explicitly\
    \ name those arguments; for example, `send('Hello', 'World', 'Galactus', 'God')`.\
    \ In this, you are sending a carbon copy of the message to Galactus and a blind\
