  raw: 'You will often see it recommended that you use a single underscore (_) for
    variables that are throwaway, rather than using a double underscore(__). The problem
    with this is, “-“, the single underscore, tends to be used in the gettext() function
    as an alias. It is also used to store the value of the previous operation at the
    interactive prompt. When you use a double underscore, “__”, it is clear and it
    is convenient. It also cuts out the accidental risk of interfering with the other
    use cases of the single underscore.


    ## Creating Length-N Lists


    TO CREATE A LENGTH-N list that is of the same thing, you would use the * list
    operator


    four_zeros = [Zero] * 4


    To create a length-N list of a list you should not use the * operator. That operator
    creates lists of N that refer to the same list and that is not what we want here.
    Instead, we use a list comprehension:


    four_lists = [[] for __ in xrange(4)]


    Note – If you are using Python 3, use range() and not xrange()


    ## Creating Strings from Lists


    THE MOST COMMON IDIOM for creating strings is str.join() on empty strings:


    letters = [‘c’, ‘l’, o, ''t'']


    word = ''''.join(letters)


    This sets a value of “clot” to the variable word. You can apply this idiom to
    tuples and lists.


    ## Searching a Collection for an Item


    ON OCCASION, YOU WILL need to search a collection for a specific option and there
    are two ways to do this – using lists or sets


    Look at this example:


    s = set([''c'', ''l'', ''o'', ''t''])


    l = [''c'', ''l'', ''o'', ''t'']


    def lookup_set(s):


    return ''s'' in s


    def lookup_list(l):


    return ''s'' in l


    Now, both of these functions look exactly the same simply because lookup_set uses
    that fact that Python sets are hash tables. However, the performance of lookup
    in each of the examples is different. In order to decide whether a specific item
    is contained in a list, Python has to search through every single item until it
    finds one that matches. This takes time, especially if you have a long list. With
    sets, each item has a hash that tells Python where to look for the matching item.
    This makes the search much quicker even if the sets are big ones. You can also
    search dictionaries in the same way. Because there is a difference in the performance,
    it is a better idea to use a set or a dictionary rather than a list in the following
    cases:


    *   Where a collection contains a lot of items


    *   Where you are going to be searching for items in a collection on a repeated
    basis


    *   There are no duplicate items


    In cases of smaller collections or those that you are not likely to be searching
    on a frequent basis, the extra memory and time needed to set the hash table up
    will, more often than not, be more than the time you save by improving the speed
    of the search


