    # Chapter 7:


    Method and Function Arguments


    ![image](Images/chapter_title_below.png)


    For the first argument in any instance method always use self and, for the first
    argument in any class method, always use cls.


    If the name of a function’s argument is the same as one of the reserved keywords,
    then it is best to add one trailing underscore than it is to use a corrupted spelling
    or an abbreviation. As such, you should class_ rather than clss. Perhaps even
    better than causing a clash - use a synonym.


    ## Function Arguments


    THERE ARE 4 WAYS THAT you can pass an argument to a function:


    1.  Positional Argument – these are mandatory and do not contain any default values.
    The positional is the simplest argument form and are used for the arguments that
    are a complete part of the meaning of a function; they also have a natural order
    so, in the following example, the function user should find it easy to remember
    that the 2 functions need 2 arguments and they should remember the order:


    Send(message, recipient) and point(x, y)


    In both cases, you can use the argument names when you call the functions and,
    by doing this, you can change the order the arguments are in. For example, you
    could call send(recipient=’world’, message=’Hello’) and point(y=2, x=1). However,
    as you can see from this, it is not very readable and there are way more words
    there than we need.  Compare that version to the one that is more straightforward
    – send(‘Hello’, ‘World’) and point(1,2) and you can see the difference in readability
    instantly.


    1.  Keyword Argument – these do contain default values and they are not mandatory.
    Keyword arguments are sometimes used for optional parameters that you send to
    the function. When a function contains at least 2 or 3, preferably more, positional
    parameters, it is not easy to remember. Using a keyword argument that has a default
    value is more helpful. For example, you could define a complete send function
    as send(message, to, cc=None, bcc=None). The use of cc and bcc is optional and
    both have a value of None if they are not given another value.


    There are a few ways that you can call a function with a keyword argument in Python.
    For example, you could follow the argument order in a definition and no explicitly
    name those arguments; for example, send(‘Hello’, ‘World’, ‘Galactus’, ‘God’).
    In this, you are sending a carbon copy of the message to Galactus and a blind
    carbon copy to God. You can also name the arguments in a different order, for
    example, send(‘Helloagain’, ‘World’, bcc=’God’, cc=’Galactus’). Unless you have
    a very good reason not to follow the correct syntax as closely as possible, these
    two examples are best avoided; they are verbose and not readable. The best way,
    the way that is closest to the function definition, is send(‘Hello’, ‘World’,
    cc=’Galactus’, bcc=’God’).


    1.  Arbitrary Argument List - This is the next way of passing an argument to a
    function. Sometimes, the intention of a function is better expressed with a signature
    that has a number of positional arguments, a number that can be extended. In that
    case, you are better using the *args constructs to define it. In the body of the
    argument, args is a tuple of all of the positional arguments that are left. For
    example, you can use send(message, *args) and list all of the recipients as a
    separate argument: send(’Hello’, ‘Galactus’, ‘Dad’, ‘God’) – in the body of the
    function, *args is equal to (‘Galactus’, ‘Dad’, ‘God’)


    However, you should really use this construct cautiously because it does have
    some drawbacks. If a function is sent a list that contains arguments that are
    of the same or similar nature, a better definition would be a function of a single
    argument; that single argument would be a sequence or a list. For example, if
    send had several recipients, you would be better with an explicit definition:
    send(‘Hello’, ‘God’, ‘Dad’, ‘Galactus’) and then call it by using send(‘Hello’,[‘God’,
    ‘Dad’, ‘Galactus’]). In this way, the function user can change the recipient list
    beforehand and that opens up the possibility for any sequence that can’t be unpacked
    to be passed, and that includes iterators.


    1.  Arbitrary Keyword Argument Dictionary - This is final way of passing an argument
    to a function. If a function needs an unknown array of named arguments, you can
    use the construct **kwargs. Within the body of the function, **kwargs is a dictionary
    that contains all of the named arguments that have been passed and not caught
    by another keyword argument in the signature of the function


    However, you should use the same level of caution that you did with arbitrary
    argument lists, for pretty much the same reasons. These are powerful techniques
    that should only be used when you can prove that it is necessary to use them.
    They most definitely should not be used if there is a clearer and simpler construct
    that will do the job.


    It really is down to you, the programmer, to decide which of the function arguments
    are optional keywords and which are positional and to determine whether you should
    use the more advanced techniques to pass the arguments.


    Keep it simple and follow these rules of writing Python functions that:


    *   Are readable – the names and the arguments do not need any explanations


    *   Are easily changeable – you can add a keyword argument in without the rest
    of the code breaking.


