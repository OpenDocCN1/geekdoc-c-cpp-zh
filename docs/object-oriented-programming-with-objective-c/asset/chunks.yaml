    \ for it specially, so your design never needs to bother with what’s being done\
    \ when.\n\n### Dynamic Loading\n\nHistorically, in many common environments, before\
    \ a program can run, all its parts had to be linked together in one file. When\
    \ it was launched, the entire program was loaded into memory at once.\n\nSome\
    \ object-oriented programming environments overcome this constraint and allow\
    \ different parts of an executable program to be kept in different files. The\
    \ program can be launched in bits and pieces as they’re needed. Each piece is\
    \ dynamically loaded and linked with the rest of program as it’s launched. User\
    \ actions can determine which parts of the program are in memory and which aren’t.\n\
    \nOnly the core of a large program needs to be loaded at the start. Other modules\
    \ can be added as the user requests their services. Modules the user doesn’t request\
    \ make no memory demands on the system.\n\nDynamic loading raises interesting\
    \ possibilities. For example, an entire program does not have to be developed\
    \ at once. You can deliver your software in pieces and update one part of it at\
    \ a time. You can devise a program that groups several tools under a single interface,\
    \ and load just the tools the user wants. The program can even offer sets of alternative\
    \ tools to do the same job—the user then selects one tool from the set and only\
    \ that tool would be loaded.\n\nPerhaps the most important current benefit of\
    \ dynamic loading is that it makes applications extensible. You can allow others\
    \ to add to and customize a program you’ve designed. All your program needs to\
    \ do is provide a framework that others can fill in, and, at runtime, find the\
    \ pieces that they’ve implemented and load them dynamically.\n\nThe main challenge\
    \ that dynamic loading faces is getting a newly loaded part of a program to work\
    \ with parts already running, especially when the different parts were written\
    \ by different people. However, much of this problem disappears in an object-oriented\
    \ environment because code is organized into logical modules with a clear division\
    \ between implementation and interface. When classes are dynamically loaded, nothing\
    \ in the newly loaded code can clash with the code already in place. Each class\
    \ encapsulates its implementation and has an independent namespace.\n\nIn addition,\
    \ dynamic typing and dynamic binding let classes designed by others fit effortlessly\
    \ into the program you’ve designed. Once a class is dynamically loaded, it’s treated\
    \ no differently than any other class. Your code can send messages to their objects\
    \ and theirs to yours. Neither of you has to know what classes the other has implemented.\
    \ You need only agree on a communications protocol."
