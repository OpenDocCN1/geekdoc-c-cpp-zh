- fmt: "\nIt can refine or extend the behavior it inherits by replacing an existing\
    \ method with a new version, but it still retains the old version by incorporating\
    \ it in the new method. A subclass sends a message to perform the old version\
    \ in the body of the new method. Each class in an inheritance chain can contribute\
    \ part of a method’s behavior. In [Figure 3-3](#ooObjectModel.html_apple_ref-doc-uid-TP40005149-CH5-86542),\
    \ for example, class `D` might override a method defined in class `C` and incorporate\
    \ `C`’s version, while `C`’s version incorporates a version defined in the root\
    \ class.\n\nSubclasses thus tend to fill out a superclass definition, making it\
    \ more specific and specialized. They add, and sometimes replace, code rather\
    \ than subtract it. Note that methods generally can’t be disinherited and instance\
    \ variables can’t be removed or overridden.\n\n## Uses of Inheritance\n\nThe classic\
    \ examples of an inheritance hierarchy are borrowed from animal and plant taxonomies.\
    \ For example, there could be a class corresponding to the `Pinaceae` (pine) family\
    \ of trees. Its subclasses could be `Fir`, `Spruce`, `Pine`, `Hemlock`, `Tamarack`,\
    \ `DouglasFir`, and `TrueCedar`, corresponding to the various genera that make\
    \ up the family. The `Pine` class might have `SoftPine` and `HardPine` subclasses,\
    \ with `WhitePine`, `SugarPine`, and `BristleconePine` as subclasses of `SoftPine`,\
    \ and `PonderosaPine`, `JackPine`, `MontereyPine`, and `RedPine` as subclasses\
    \ of `HardPine`.\n\nThere’s rarely a reason to program a taxonomy like this, but\
    \ the analogy is a good one. Subclasses tend to specialize a superclass or adapt\
    \ it to a special purpose, much as a species specializes a genus.\n\nHere are\
    \ some typical uses of inheritance:\n\n*   **Reusing code**. If two or more classes\
    \ have some things in common but also differ in some ways, the common elements\
    \ can be put in a single class definition that the other classes inherit. The\
    \ common code is shared and need only be implemented once.\n\n    For example,\
    \ `Faucet`, `Valve`, and `Pipe` objects, defined for the program that models water\
    \ use, all need a connection to a water source and should be able to record the\
    \ rate of flow. These commonalities can be encoded once, in a class that the `Faucet`,\
    \ `Valve`, and `Pipe` classes inherit from. A `Faucet` object can be said to be\
    \ a kind of `Valve` object, so perhaps the `Faucet` class would inherit most of\
    \ what it is from `Valve`, and add little of its own.\n\n*   **Setting up a protocol**.\
    \ A class can declare a number of methods that its subclasses are expected to\
    \ implement. The class might have empty versions of the methods, or it might implement\
    \ partial versions that are to be incorporated into the subclass methods. In either\
    \ case, its declarations establish a protocol that all its subclasses must follow.\n\
    \n    When different classes implement similarly named methods, a program is better\
    \ able to make use of polymorphism in its design. Setting up a protocol that subclasses\
    \ must implement helps enforce these conventions.\n\n*   **Delivering generic\
    \ functionality**. One implementer can define a class that contains a lot of basic,\
    \ general code to solve a problem but that doesn’t fill in all the details. Other\
    \ implementers can then create subclasses to adapt the generic class to their\
    \ specific needs. For example, the `Appliance` class in the program that models\
    \ water use might define a generic water-using device that subclasses would turn\
    \ into specific kinds of appliances.\n\n    Inheritance is thus both a way to\
    \ make someone else’s programming task easier and a way to separate levels of\
    \ implementation.\n\n*   **Making slight modifications**. When inheritance is\
    \ used to deliver generic functionality, set up a protocol, or reuse code, a class\
    \ is devised that other classes are expected to inherit from. But you can also\
    \ use inheritance to modify classes that aren’t intended as superclasses. Suppose,\
    \ for example, that there’s an object that would work well in your program, but\
    \ you’d like to change one or two things that it does. You can make the changes\
    \ in a subclass.\n\n*   **Previewing possibilities**. Subclasses can also be used\
    \ to factor out alternatives for testing purposes. For example, if a class is\
    \ to be encoded with a particular user interface, alternative interfaces can be\
    \ factored into subclasses during the design phase of the project. Each alternative\
    \ can then be demonstrated to potential users to see which they prefer. When the\
    \ choice is made, the selected subclass can be reintegrated into its superclass.\n\
    \n## Dynamism\n\nAt one time in programming history, the question of how much\
    \ memory a program might use was typically settled when the source code was compiled\
    \ and linked. All the memory the program would ever need was set aside for it\
    \ as it was launched. This memory was fixed; it could neither grow nor shrink.\n\
    \nIn hindsight, it’s evident what a serious constraint this was. It limited not\
    \ only how programs were constructed, but what you could imagine a program doing.\
    \ It constrained design, not just programming technique. The introduction of functions\
    \ that dynamically allocate memory as a program runs (such as `malloc`) opened\
    \ possibilities that didn’t exist before.\n\nCompile-time and link-time constraints\
    \ are limiting because they force issues to be decided from information found\
    \ in the programmer’s source code, rather than from information obtained from\
    \ the user as the program runs.\n\nAlthough dynamic allocation removes one such\
    \ constraint, many others, equally as limiting as static memory allocation, remain.\
    \ For example, the elements that make up an application must be matched to data\
    \ types at compile time. And the boundaries of an application are typically set\
    \ at link time. Every part of the application must be united in a single executable\
    \ file. New modules and new types can’t be introduced as the program runs.\n\n\
    Objective-C seeks to overcome these limitations and to make programs as dynamic\
    \ and fluid as possible. It shifts much of the burden of decision making from\
    \ compile time and link time to runtime. The goal is to let program users decide\
    \ what will happen, rather than constrain their actions artificially by the demands\
    \ of the language and the needs of the compiler and linker.\n\nThree kinds of\
    \ dynamism are especially important for object-oriented design:\n\n*   Dynamic\
    \ typing, waiting until runtime to determine the class of an object\n*   Dynamic\
    \ binding, determining at runtime what method to invoke\n*   Dynamic loading,\
    \ adding new components to a program as it runs\n\n### Dynamic Typing\n\nThe compiler\
    \ typically complains if the code you write assigns a value to a type that can’t\
    \ accommodate it. You might see warnings like these:\n\n```\nincompatible types\
    \ in assignment\n```\n\n```\nassignment of integer from pointer lacks a cast\n\
    ```\n\nType checking is useful, but there are times when it can interfere with\
    \ the benefits you get from polymorphism, especially if the type of every object\
    \ must be known to the compiler.\n\nSuppose, for example, that you want to send\
    \ an object a message to perform the `start` method. Like other data elements,\
    \ the object is represented by a variable. If the variable’s type (its class)\
    \ must be known at compile time, it would be impossible to let runtime factors\
    \ influence the decision about what kind of object should be assigned to the variable.\
    \ If the class of the variable is fixed in source code, so is the version of `start`\
    \ that the message invokes.\n\nIf, on the other hand, it’s possible to wait until\
    \ runtime to discover the class of the variable, any kind of object could be assigned\
    \ to it. Depending on the class of the receiver, the `start` message might invoke\
    \ different versions of the method and produce very different results.\n"
