    \ functional area. It can play a full-fledged modular role within a larger program\
    \ design.\n\nTerminology:  Object-oriented terminology varies from language to\
    \ language. For example, in C++, methods are called member functions and instance\
    \ variables are known as data members. This document uses the terminology of Objective-C,\
    \ which has its basis in Smalltalk.\n\nFor example, if you were to write a program\
    \ that modeled home water usage, you might invent objects to represent the various\
    \ components of the water-delivery system. One might be a `Faucet` object that\
    \ would have methods to start and stop the flow of water, set the rate of flow,\
    \ return the amount of water consumed in a given period, and so on. To do this\
    \ work, a `Faucet` object would need instance variables to keep track of whether\
    \ the tap is open or shut, how much water is being used, and where the water is\
    \ coming from.\n\nClearly, a programmatic `Faucet` object can be smarter than\
    \ a real one (it’s analogous to a mechanical faucet with lots of gauges and instruments\
    \ attached). But even a real faucet, like any system component, exhibits both\
    \ state and behavior. To effectively model a system, you need programming units,\
    \ like objects, that also combine state and behavior."
