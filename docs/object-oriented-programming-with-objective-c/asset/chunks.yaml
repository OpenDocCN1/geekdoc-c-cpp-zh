- fmt: '

    In modern C, the fields of a structure live in their own namespace—that is, their
    names won’t conflict with identically named data elements outside the structure.
    Partitioning the program namespace is essential for keeping implementation details
    out of the interface. Imagine, for example, the enormous task of assigning a different
    name to every piece of data in a large program and of making sure new names don’t
    conflict with old ones.


    *   On the procedural side of the world, functions encapsulate behaviors that
    can be used repeatedly without being reimplemented. Data elements local to a function,
    like the fields within a structure, are protected within their own namespace.
    Because functions can reference (call) other functions, complex behaviors can
    be built from smaller pieces.

    *   Functions are reusable. Once defined, they can be called any number of times
    without again considering the implementation. The most generally useful functions
    can be collected in libraries and reused in many different applications. All the
    user needs is the function interface, not the source code.


    *   However, unlike data elements, functions aren’t partitioned into separate
    namespaces. Each function must have a unique name. Although the function may be
    reusable, its name is not.


    C structures and functions are able to express significant abstractions, but they
    maintain the distinction between data and operations on data. In a procedural
    programming language, the highest units of abstraction still live on one side
    or the other of the data-versus-operations divide. The programs you design must
    always reflect, at the highest level, the way the computer works.


    Object-oriented programming languages don’t lose any of the virtues of structures
    and functions—they go a step further and add a unit capable of abstraction at
    a higher level, a unit that hides the interaction between a function and its data.


    Suppose, for example, that you have a group of functions that act on a particular
    data structure. You want to make those functions easier to use by, as far as possible,
    taking the structure out of the interface. So you supply a few additional functions
    to manage the data. All the work of manipulating the data structure—allocating
    memory for it, initializing it, getting information from it, modifying values
    within it, keeping it up to date, and freeing its memory—is done through the functions.
    All the user does is call the functions and pass the structure to them.


    With these changes, the structure has become an opaque token that other programmers
    never need to look inside. They can concentrate on what the functions do, not
    on how the data is organized. You’ve taken the first step toward creating an object.


    The next step is to give this idea support in the programming language and completely
    hide the data structure so that it doesn’t even have to be passed between the
    functions. The data becomes an internal implementation detail; all that’s exported
    to users is a functional interface. Because objects completely encapsulate their
    data (hide it), users can think of them solely in terms of their behavior.


    With this step, the interface to the functions has become much simpler. Callers
    don’t need to know how they’re implemented (what data they use). It’s fair now
    to call this an object.


    The hidden data structure unites all the functions that share access to it. So
    an object is more than a collection of random functions; it’s a bundle of related
    behaviors that are supported by shared data. To use a function that belongs to
    an object, you first create the object (thus giving it its internal data structure),
    and then tell the object which function it should perform. You begin to think
    in terms of what the object does, rather than in terms of the individual functions.


    This progression from thinking about functions and data structures to thinking
    about object behaviors is the essence of learning object-oriented programming.
    It may seem unfamiliar at first, but as you gain experience with object-oriented
    programming, you find it’s a more natural way to think about things. Everyday
    programming terminology is replete with analogies to real-world objects of various
    kinds—lists, containers, tables, controllers, even managers. Implementing such
    things as programming objects merely extends the analogy in a natural way.


    A programming language can be judged by the kinds of abstractions that it enables
    you to encode. You shouldn’t be distracted by extraneous matters or forced to
    express yourself using a vocabulary that doesn’t match the reality you’re trying
    to capture.


    If, for example, you must always tend to the business of keeping the right data
    matched with the right procedure, you’re forced at all times to be aware of the
    entire program at a low level of implementation. While you might still invent
    programs at a high level of abstraction, the path from imagination to implementation
    can become quite tenuous—and more and more difficult as programs become bigger
    and more complicated.


    By providing another, higher level of abstraction, object-oriented programming
    languages give you a larger vocabulary and a richer model to program in.


    # The Object Model


    The insight of object-oriented programming is to combine state and behavior—data
    and operations on data—in a high-level unit, an object, and to give it language
    support. An object is a group of related functions and a data structure that serves
    those functions. The functions are known as the object’s methods, and the fields
    of its data structure are its instance variables. The methods wrap around the
    instance variables and hide them from the rest of the program, as Figure 3-1 illustrates.


    Figure 3-1 An object


    ![](Art/singleobject.gif)


    If you’ve ever tackled any kind of difficult programming problem, it’s likely
    that your design has included groups of functions that work on a particular kind
    of data—implicit “objects” without the language support. Object-oriented programming
    makes these function groups explicit and permits you to think in terms of the
    group, rather than its components. The only way to an object’s data, the only
    interface, is through its methods.


    By combining both state and behavior in a single unit, an object becomes more
    than either alone; the whole really is greater than the sum of its parts. An object
    is a kind of self-sufficient “subprogram” with jurisdiction over a specific functional
    area. It can play a full-fledged modular role within a larger program design.


    Terminology: Object-oriented terminology varies from language to language. For
    example, in `C++`, methods are called member functions and instance variables
    are known as data members. This document uses the terminology of Objective-C.


    For example, if you were to write a program that modeled home water usage, you
    might invent objects to represent the various components of the water-delivery
    system. One might be a `Faucet` object that would have methods to start and stop
    the flow of water, set the rate of flow, return the amount of water consumed in
    a given period, and so on. To do this work, a `Faucet` object would need instance
    variables to keep track of whether the tap is open or shut, how much water is
    being used, and where the water is coming from.


    Clearly, a programmatic `Faucet` object can be smarter than a real one (it’s analogous
    to a mechanical faucet with lots of gauges and instruments attached). But even
    a real faucet, like any system component, exhibits both state and behavior. To
    effectively model a system, you need programming units, like objects, that also
    combine state and behavior.

