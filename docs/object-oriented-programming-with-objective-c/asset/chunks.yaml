  trans: '

    Objective-C Runtime 参考文档描述了 Objective-C 运行时支持库的数据结构和函数。你的程序可以使用这些接口与 Objective-C
    运行时系统进行交互。例如，你可以添加类或方法，或者获取所有加载类的类定义列表。


    # 为什么选择 Objective-C？


    选择 Objective-C 语言有多种原因。首先也是最重要的一点是，它是一种面向对象的语言。Cocoa 框架中封装的功能只能通过面向对象的技术来实现。其次，由于
    Objective-C 是标准 ANSI 语言的扩展，现有的 C 程序可以被适配使用这些软件框架，而不会丢失原始开发中投入的任何工作。由于 Objective-C
    整合了 C，因此在 `Objective-C` 中进行工作时，你可以获得 C 的所有优点。你可以自由选择何时以面向对象的方式执行某些操作（例如定义一个新类），何时坚持使用过程化编程技术（定义一个结构和一些函数，而不是类）。


    此外，Objective-C 是一种从根本上非常简单的语言。它的语法简洁、无歧且易于学习。面向对象编程由于其自洽的术语和对抽象设计的强调，往往给新成员带来陡峭的学习曲线。像
    Objective-C 这样组织良好的语言可以让你成为一名精通的面向对象程序员变得容易得多。


    与基于 C 的其他面向对象语言相比，Objective-C 非常动态。编译器保留了大量关于对象本身的信息以供运行时使用。在其他情况下可能在编译时做的决策可以推迟到程序运行时。动态性为
    Objective-C 程序赋予了非凡的灵活性和力量。例如，它带来了其他名义上面向对象的语言难以获得的两大优势：


    *   Objective-C 支持开放式的动态绑定风格，这种风格可以适应交互式用户界面的简单架构。消息并不一定受限于接收者的类，甚至不受限于方法名，因此软件框架可以在运行时允许用户进行选择，并允许开发者在设计中自由表达。（动态绑定、消息、类和接收者等术语将在本文的适当之处进行解释。）


    *   动态性使得构建复杂的开发工具成为可能。运行时系统的接口提供了访问运行应用程序信息的途径，因此可以开发出监控、干预并揭示 Objective-C 应用程序底层结构和活动的工具。


    历史说明：作为一种语言，Objective-C 有悠久的历史。它由 Brad Cox 和 Tom Love 在 20 世纪 80 年代初在 Stepstone
    公司创建。它在 80 年代后期被 NeXT Computer Inc. 授权，用于开发 Cocoa 之前的 NeXTStep 框架。NeXT 以多种方式扩展了这种语言，例如添加了协议（protocols）。


    # 面向对象编程


    作为人类，我们不断面对无数的事实和印象，必须对它们进行理解。为了做到这一点，我们必须将底层结构从表面细节中抽象出来，并发现起的基本关系。抽象揭示了因果关系，暴露了模式和框架，并将重要的与不重要的分开。面向对象提供了你所操作的数据的抽象；此外，它在数据与你可以对数据执行的操作之间提供了一个具体的组合——实际上赋予了数据行为。


    ## 数据与操作


    编程语言传统将世界分为两个部分：数据和对数据的操作。数据是静态且不可变的，除非操作可能会对其进行改变。操作数据的过程和函数没有它们自己的持久状态；它们只有在影响数据方面是有用的。


    当然，这种划分是基于计算机的工作方式，因此它不是你可以轻易忽略或推开的。就像物质与能量之间、名词与动词之间同样普遍的区别一样，它构成了我们工作的背景。在某个时刻，所有程序员——即使是面向对象的程序员——必须列出他们的程序将使用的数据结构，并定义作用于数据的函数。


    使用像 `C` 这样的过程化编程语言时，你必须列出数据结构。语言可能为组织数据和函数提供各种支持，但并没有改变世界。函数和数据结构是设计的基本元素。


    面向对象编程并没有否定这种世界观，而是在更高层次上重构了它。它将操作和数据组合成被称为对象的模块化单元，并让你组合对象形成完整的程序。在面向对象的编程语言中，对象及其交互是设计的基本元素。


    每个对象都有状态（数据）和行为（对数据的操作）。在这一点上，它们与物理对象没有太大区别。很容易看到机械设备（如手表或钢琴）如何体现状态和行为。但几乎任何设计用来执行任务都是如此。即使是一个普通的瓶子也结合了状态（瓶装了多少、是否打开、内容温度如何）和行为（以各种流速分发内容、打开或关闭）。


    这种与实物的相似性赋予了对象许多力量和吸引力。它们不仅可以模拟现实系统，同样可以胜任软件系统中的角色。


    ## 接口与实现


    为了发明程序，你必须捕捉抽象并在程序设计中表达它们。这是编程语言的工作。语言应该通过让你编码揭示工作方式的抽象来促进发明和设计过程。表面细节不应掩盖你的程序架构。


    所有编程语言都提供帮助表达抽象的设备。本质上，这些设备是分组实现细节、隐藏细节并在某种程度上为它们提供通用接口的方法——就像机械对象将其接口与实现分离一样，如图
    2-1 所示。


    图 2-1 接口与实现


    ![](img/watchcalls_35.gif)


    内部观察这样一个单元，作为实现者，你会关注它的组成部分以及如何工作。从外部观察它，作为用户，你只关心它是什么以及它做什么。你可以忽略细节，仅从整体的角度进行思考。


    `C` 语言中主要的抽象单元是结构和函数。两者都以不同的方式隐藏了实现元素：


    *   在数据世界中，`C` 结构将数据元素分组为更大的单元，然后作为单个实体进行处理。虽然某些代码必须进入内部并单独操作字段，但程序的大部分可以将其视为一个整体——而不是元素的集合。


