  trans: "\n\n它可以通过用新版本替换现有方法来精炼或扩展其所继承的行为，但它仍然通过将旧版本整合在新方法中来保留旧版本。子类可以在新方法的体部发送一个消息来执行旧版本。继承链中的每个类都可以贡献方法行为的一部分。例如，在图\
    \ 3-3 中，类 `D` 可能会覆盖在类 `C` 中定义的方法，并整合 `C` 的版本，而 `C` 的版本又整合了在根类中定义的一个版本。\n\n因此，子类趋向于完善父类的定义，使其变得更加具体和专门化。它们是添加（有时是替换）代码，而不是减少代码。请注意，方法通常不能被反继承，实例变量也无法被移除或重写。\n\
    \n## 继承的用途\n\n继承层次结构的经典示例借用自动物和植物的分类学。例如，可能有一个对应于 `Pinaceae`（松科）树木的类。它的子类可以是 `Fir`（冷杉）、`Spruce`（云杉）、`Pine`（松树）、`Hemlock`（云杉）、`Tamarack`（落松）、`DouglasFir`（花叶松）和\
    \ `TrueCedar`（真柏），对应组成该科的各种属。`Pine` 类可能有 `SoftPine`（软松）和 `HardPine`（硬松）子类，其中 `WhitePine`（白松）、`SugarPine`（糖松）和\
    \ `BristleconePine`（针松）是 `SoftPine` 的子类，而 `PonderosaPine`（黄松）、`JackPine`（矮松）、`MontereyPine`（蒙特利松）和\
    \ `RedPine`（红松）是 `HardPine` 的子类。\n\n很少有理由编写这样的分类体系，但这种类比非常好。子类倾向于使父类专门化或使其适应特殊目的，就像物种专门化一个属一样。\n\
    \n以下是继承的一些典型用途：\n\n*   **代码复用**。如果两个或多个类有一些共同点，但在某些方面又不同，可以将共同元素放在单个类定义中，让其他类继承该类。公共代码被共享，只需实现一次。\n\
    \n    例如，为模拟用水的程序定义的 `Faucet`（水龙头）、`Valve`（阀门）和 `Pipe`（水管）对象都需要连接到水源，并能够记录流速。这些共同点可以编码一次，放在\
    \ `Faucet`、`Valve` 和 `Pipe` 类继承的类中。一个 `Faucet` 对象可以认为是一种 `Valve` 对象，因此 `Faucet`\
    \ 类可能从 `Valve` 继承其大部分内容，而只添加少量自己的内容。\n\n*   **设置协议**。类可以声明若干个期望其子类实现的方法。该类可以拥有方法的空版本，也可以实现将要整合到子类方法中的部分版本。无论哪种情况，它的声明都建立了一个所有子类都必须遵循的协议。\n\
    \n    当不同的类实现同名的方法时，程序能够更好地利用其设计中的多态性。设置子类必须实现的协议有助于强制执行这些约定。\n\n*   **提供通用功能**。一个实现者可以定义一个类，包含大量基础、通用的代码来解决问题，但没有填充所有细节。其他实现者随后可以创建子类，将通用类适配到他们的特定需求。例如，模拟用水程序中的\
    \ `Appliance`（家电器）类可能会定义一个通用的用水设备，子类将其转换为特定类型的电器。\n\n    因此，继承既是一种让别人的编程任务更容易的方法，也是一种分离实现层级的方法。\n\
    \n*   **进行微调**。当使用继承提供通用功能、设置协议或复用代码时，会设计一个其他类预期继承的类。但你也可以使用继承来修改那些并非意图作为父类的类。例如，假设有一个对象在你的程序中运行良好，但你想更改它所执行的一个或两个功能。你可以在子类中进行这些更改。\n\
    \n*   **预览可能性**。子类还可以用于为了测试目的提取出替代方案。例如，如果一个类要编码一个特定的用户界面，则可以在项目设计阶段将替代界面提取到子类中。然后可以将每种备选方案展示给潜在用户，以查看他们更倾向于哪种。一旦做出选择，选定的子类就可以重新整合到其父类中。\n\
    \n## 动态性\n\n在编程历史的某时期，程序可能使用多少内存的问题通常在源代码编译和链接时解决。程序在启动时，其永远需要的所有内存都会被留出。这种内存是固定的；它既不能增长也不能缩小。\n\
    \n回首看来，显而易见这是一个严的限制。它不仅限制了程序的构建方式，还限制了你对程序用途的想象。它约束的是设计，而不仅仅是编程技术。程序运行运行时动态分配内存的函数（如\
    \ `malloc`）的引入开启了以前不存在的可能性。\n\n编译和链接时间的限制是有局限性的，因为它们迫使问题根据程序员源代码中找到的信息来做决定，而不是根据程序运行时从用户处获得的信息来决定。\n\
    \n尽管动态分配消除了这样一种限制，但仍然存在许多与静态内存分配同样限制的限制。例如，组成应用程序的元素必须在编译时与数据类型匹配。应用程序的边界通常在链接时设置。应用程序的每个部分必须统一在一个单一的可执行文件中。在程序运行时不能引入新模块和新类型。\n\
    \nObjective-C 试图克服这些局限性，并让程序尽可能动态和灵活。它将决策的很大负担从编译时间和链接时间转移到运行时。目标是让程序用户决定发生什么，而不是通过语言的要求以及编译器和链接器的需求来人为限制他们的行为。\n\
    \n三种动态性对于面向对象的设计尤为重要：\n\n*   动态类型：在运行时确定对象的类\n*   动态绑定：在运行时确定调用哪个方法\n*   动态加载：在程序运行时向程序添加新组件\n\
    \n### 动态类型\n\n如果你编写的代码将值赋值给无法容纳它的类型，编译器通常会报错。你可能会看到如下警告：\n\n```\nincompatible\
    \ types in assignment\n```\n\n```\nassignment of integer from pointer lacks a\
    \ cast\n```\n\n类型检查是有用的，但有时会干扰你从多态中获得的益处，特别是当每个对象的类型都对编译器已知时。\n\n例如，假设你想向对象发送一个消息执行\
    \ `start` 方法。与其他数据元素一样，对象由变量表示。如果变量的类型（其类）必须在编译时已知，那么无法让运行时因素影响关于分配什么类型对象的决策。如果变量的类在源代码中是固定的，那么消息调用的\
    \ `start` 版本也是固定的。\n\n反之，如果可以在运行时再发现变量的类，那么任何类型的对象都可以被分配给它。取决于接收者的类，`start` 消息可能会调用不同的版本并产生非常不同的结果。\n\
    \n"
- fmt: '

    Dynamic typing thus gives substance to dynamic binding (discussed next). But it
    does more than that. It permits associations between objects to be determined
    at runtime, rather than forcing them to be encoded in a static design. For example,
    a message could pass an object as a parameter without declaring exactly what kind
    of object it is—that is, without declaring its class. The message receiver might
    then send its own messages to the object, again without ever caring about what
    kind of object it is. Because the receiver uses the passed object to do some of
    its work, it is in a sense customized by an object of indeterminate type (indeterminate
    in source code, that is, not at runtime).


    ## Dynamic Binding


    In standard C, you can declare a set of alternative functions, such as the standard
    string-comparison functions,


    ```

    int strcmp(const char *, const char *);   /* case sensitive */

    ```


    ```

    int strcasecmp(const char *, const char *); /*case insensitive*/

    ```


    and declare a pointer to a function that has the same return and parameter types:


    ```

    int (* compare)(const char *, const char *);

    ```


    You can then wait until runtime to determine which function to assign to the pointer,


    ```

    if ( argv == ''i'' )

    ```


    ```

    compare = strcasecmp;

    ```


    ```

    else

    ```


    ```

    compare = strcmp;

    ```


    and call the function through the pointer:


    ```

    if ( compare(s1, s2) )


    This is akin to what in object-oriented programming is called dynamic binding,
    delaying the decision of exactly which method to perform until the program is
    running.


    Although not all object-oriented languages support it, dynamic binding can be
    routinely and transparently accomplished through messaging. You don’t have to
    go through the indirection of declaring a pointer and assigning values to it as
    shown in the example above. You also don’t have to assign each alternative procedure
    a different name.


    Messages invoke methods indirectly. Every message expression must find a method
    implementation to “call.” To find that method, the messaging machinery must check
    the class of the receiver and locate its implementation of the method named in
    the message. When this is done at runtime, the method is dynamically bound to
    the message. When it’s done by the compiler, the method is statically bound.


    **Late binding**: Some object-oriented programming languages (notably C++) require
    a message receiver to be statically typed in source code, but don’t require the
    type to be exact. An object can be typed to its own class or to any class that
    it inherits from. The compiler therefore can’t tell whether the message receiver
    is an instance of the class specified in the type declaration, an instance of
    a subclass, or an instance of some more distantly derived class. Because it doesn’t
    know the exact class of the receiver, it can’t know which version of the method
    named in the message to invoke. In this circumstance, the choice is between treating
    the receiver as if it were an instance of the specified class and simply bind
    the method defined for that class to the message, or waiting until some later
    time to resolve the situation. In C++, the decision is postponed to link time
    for methods (member functions) that are declared `virtual`. This is sometimes
    referred to as late binding rather than dynamic binding. While dynamic in the
    sense that it happens at runtime, it carries with it strict compile-time type
    constraints. As discussed here (and implemented in Objective-C), dynamic binding
    is unconstrained.


    Dynamic binding is possible even in the absence of dynamic typing, but it’s not
    very interesting. There’s little benefit in waiting until runtime to match a method
    to a message when the class of the receiver is fixed and known to the compiler.
    The compiler could just as well find the method itself; the runtime result won’t
    be any different.


    However, if the class of the receiver is dynamically typed, there’s no way for
    the compiler to determine which method to invoke. The method can be found only
    after the class of the receiver is resolved at runtime. Dynamic typing thus entails
    dynamic binding.


    Dynamic typing also makes dynamic binding interesting, for it opens the possibility
    that a message might have very different results depending on the class of the
    receiver. Runtime factors can influence the choice of receiver and the outcome
    of the message.


    Dynamic typing and binding also open the possibility that the code you write can
    send messages to objects not yet invented. If object types don’t have to be decided
    until runtime, you can give others the freedom to design their own classes and
    name their own data types and still have your code send messages to their objects.
    All you need to agree on are the messages, not the data types.


    **Note**: Dynamic binding is routine in Objective-C. You don’t need to arrange
    for it specially, so your design never needs to bother with what’s being done
    when.


    ## Dynamic Loading


    Historically, in many common environments, before a program can run, all its parts
    had to be linked together in one file. When it was launched, the entire program
    was loaded into memory at once.


    Some object-oriented programming environments overcome this constraint and allow
    different parts of an executable program to be kept in different files. The program
    can be launched in bits and pieces as they’re needed. Each piece is dynamically
    loaded and linked with the rest of program as it’s launched. User actions can
    determine which parts of the program are in memory and which aren’t.


    Only the core of a large program needs to be loaded at the start. Other modules
    can be added as the user requests their services. Modules the user doesn’t request
    make no memory demands on the system.


    Dynamic loading raises interesting possibilities. For example, an entire program
    does not have to be developed at once. You can deliver your software in pieces
    and update one part of it at a time. You can devise a program that groups several
    tools under a single interface, and load just the tools the user wants. The program
    can even offer sets of alternative tools to do the same job—the user then selects
    one tool from the set and only that tool would be loaded.


    Perhaps the most important current benefit of dynamic loading is that it makes
    applications extensible. You can allow others to add to and customize a program
    you’ve designed. All your program needs to do is provide a framework that others
    can fill in, and, at runtime, find the pieces that they’ve implemented and load
    them dynamically.


    The main challenge that dynamic loading faces is getting a newly loaded part of
    a program to work with parts already running, especially when the different parts
    were written by different people. However, much of this problem disappears in
    an object-oriented environment because code is organized into logical modules
    with a clear division between implementation and interface. When classes are dynamically
    loaded, nothing in the newly loaded code can clash with the code already in place.
    Each class encapsulates its implementation and has an independent namespace.


    In addition, dynamic typing and dynamic binding let classes designed by others
    fit effortlessly into the program you’ve designed. Once a class is dynamically
    loaded, it’s treated no differently than any other class. Your code can send messages
    to their objects and theirs to yours. Neither of you has to know what classes
    the other has implemented. You need only agree on a communications protocol.

