    加载与链接：尽管这是一个常用术语，但动态加载也可以称为动态链接。当程序的各个部分被组合在一起以便共同工作时，程序会被链接；当它们在启动时被读入易性内存时，会被加载。链接通常发生在加载之前。动态加载指的是分别加载程序的新部分或额外部分，并将它们动态地链接到已运行部分上的过程。


    # 程序的结构化


    面向对象的程序有两种结构。其中一种可以在类定义的继承层次结构中看到；另一种则体现在程序运行时的消息传递模式中。这些消息揭示了对象连接的网络。


    - 继承层次结构解释了对象如何通过类型建立相互关系。例如，在模拟用水的程序中，可能会发现水龙头和管道是同一种对象，区别在于水龙头可以开关，而管道可以与其他管道有多个连接。如果
    `Faucet` 类和 `Pipe` 类继承自一个共同的父类，这种相似性就会被捕捉在程序设计中。


    - 对象连接的网络解释了程序是如何运作的。例如，`Appliance` 对象可能会向阀门发送请求水的消息，阀门再向管道发送消息。管道可能会与 `Building`
    对象通信，而 `Building` 对象与所有阀门、水龙头和管道通信，但不会直接与电器通信。为了以这种方式相互通信，对象必须相互感知。`Appliance`
    对象需要与 `Valve` 对象的连接，`Valve` 对象需要与 `Pipe` 对象的连接，以此此类推。这些连接定义了程序的结构。


    面向对象的程序设计通过布局具有特定行为和交互模式的对象网络，以及安排类的层次结构来实现的。程序的活动和定义中都存在结构。


    ## 接口连接 (Outlet Connections)


    设计面向对象程序的任务之一是安排对象网络。网络不需要是静态的；它可以随着程序的运行而动态变化。对象之间的关系可以根据需要即兴创建，扮演分配角色的对象队列也可以随时间改变。但必须有一个剧本。


    某些连接可以是完全瞬间即逝的。消息可能包含一个标识对象的参数（可能是消息的发送者），接收者可以与该对象通信。在响应消息时，接收者可以向该对象发送消息，可能是标识其自身，或者是该对象可以反过来通信的另一个对象。这种连接是转瞬即逝的；它们的持续时间仅取决于消息链。


    但并非所有对象之间的连接都可以实时处理。有些需要记录在程序结构中。有多种方法可以实现。可以维护一个对象连接表，或者可以有一个通过名称识别对象的服务。然而，最简单的方法是让每个对象拥有实例变量，用于跟踪它必须通信的其他对象。这些实例变量——被称为接口（outlets），因为它们记录了消息的出口——定义了程序网络中对象之间的主要连接。


    接口实例变量的名称是任意的，但它们通常反映了接口对象所扮演的角色。图 4-1 展示了一个具有四个接口的对象：一个代理、一个朋友、一个邻居和一个老板。扮演这些角色的对象可能会偶尔变化，但角色保持不变。


    **图 4-1 接口**


    某些接口在对象首次初始化时设置，并可能永远不会改变。另一些可能作为其他操作的结果自动设置。还有一些可以使用专门为此目的提供的方法进行自由设置。


    无论如何设置，接口实例变量都揭示了应用程序的结构。它们将对象连接成一个通信网络，就像水系统的组件通过物理连接连接在一起，或者个人通过其社会关系模式联系在一起一样。


    ### 外在连接与内在连接 (Extrinsic and Intrinsic Connections)


    接口连接可以捕捉对象之间许多不同的关系。有时，连接位于应用程序中或或少作为平等伙伴的对象之间，每个对象都有自己的角色要扮演，且都不主主对方。例如，`Appliance`
    对象可能有一个接口实例变量，用于跟踪它连接的阀门。


    有时，一个对象应该被视为另一个对象的一部分。例如，`Faucet` 对象可能使用 `Meter` 对象来测量释放的水量。`Meter` 对象不会为任何其他对象服务，并且仅在
    `Faucet` 对象的指令下运行。它是 `Faucet` 对象的内在部分，与之相反，`Appliance` 对象与 `Valve` 对象之间是外在连接。


    同样，监控其他对象的对象可能会维护其下属对象的列表。例如，`Building` 对象可能包含一个程序中所有 `Pipe` 对象的列表。`Pipe` 对象被认为是
    `Building` 对象的内在部分并属于它。另一方面，`Pipe` 对象之间将维持着相互的外在连接。


    内在接口的行为与外在接口不同。当一个对象被释放或归档到磁盘文件时，其内在接口所指向的对象必须随它一起释放或归档。例如，当一个水龙头被释放时，它的水表就变得毫无用，因此也应该被释放。一个在没有水表的情况下归档的水龙头在取消归档时几乎毫无用（除非它能为自己创建一个新的
    `Meter` 对象）。


    另一方面，外在接口在更高层上捕捉了程序的组织结构。它们记录了相对独立的程序子组件之间的连接。当一个 `Appliance` 对象被释放时，它所连接的 `Valve`
    对象仍然可用并留在原处。当一个 `Appliance` 对象取消归档时，它可以连接到另一个阀门，并恢复到它之前扮演的那种角色。


    ### 激活对象网络


    对象网络通过外部刺激启动。如果你正在编写一个带有用户界面的交互式应用程序，它将对键盘和鼠标上的用户操作做出响应。尝试对大数字进行分解的程序可能在你通过命令行向它传递目标数字时启动。其他程序可能对通过电话接收的数据、从数据库获取的信息或程序监控的机械过程状态的信息做出响应。


    程序通常由事件流激活，事件流是对某种外部活动的报告。显示用户界面的应用程序是由键盘和鼠标的事件驱动的。每次按键或点击鼠标都会产生应用程序接收并响应的事件。面向对象的程序结构（一个准备好响应外部刺激的对象网络）非常适合这种用户驱动的应用程序。


    ## 聚合与分解 (Aggregation and Decomposition)


    设计任务的另一个部分是决定类的安排——何时通过定义子类来向现有类添加功能，以及何时定义一个独立的类。通过想象在极端情况下会发生什么，可以澄清这个问题：


    '
- fmt: '

    *   It’s possible to conceive of a program consisting of just one object. Because
    it’s the only object, it can send messages only to itself. It therefore can’t
    take advantage of polymorphism, or the modularity of a variety of classes, or
    a program design conceived as a network of interconnected objects. The true structure
    of the program would be hidden inside the class definition. Despite being written
    in an object-oriented language, there would be very little that was object-oriented
    about it.

    *   On the other hand, it’s also possible to imagine a program that consists of
    hundreds of different kinds of objects, each with very few methods and limited
    functionality. Here, too, the structure of the program would be lost, this time
    in a maze of object connections.


    Obviously, it’s best to avoid either of these extremes, to keep objects large
    enough to take on a substantial role in the program but small enough to keep that
    role well-defined. The structure of the program should be easy to grasp in the
    pattern of object connections.


    Nevertheless, the question often arises of whether to add more functionality to
    a class or to factor out the additional functionality and put it in a separate
    class definition. For example, a `Faucet` object needs to keep track of how much
    water is being used over time. To do that, you could either implement the necessary
    methods in the `Faucet` class, or you could devise a generic `Meter` object to
    do the job, as suggested earlier. Each `Faucet` object would have an outlet connecting
    it to a `Meter` object, and the meter would not interact with any object but the
    faucet.


    The choice often depends on your design goals. If the `Meter` object could be
    used in more than one situation, perhaps in another project entirely, it would
    increase the reusability of your code to factor the metering task into a separate
    class. If you have reason to make `Faucet` objects as self-contained as possible,
    the metering functionality could be added to the `Faucet` class.


    It’s generally better to try for reusable code and avoid having large classes
    that do so many things that they can’t be adapted to other situations. When objects
    are designed as components, they become that much more reusable. What works in
    one system or configuration might well work in another.


    Dividing functionality between different classes doesn’t necessarily complicate
    the programming interface. If the `Faucet` class keeps the `Meter` object private,
    the `Meter` interface wouldn’t have to be published for users of the `Faucet`
    class; the object would be as hidden as any other `Faucet` instance variable.


    ## Models and Frameworks


    Objects combine state and behavior, and so resemble things in the real world.
    Because they resemble real things, designing an object-oriented program is very
    much like thinking about real things—what they do, how they work, and how one
    thing is connected to another.


    When you design an object-oriented program, you are, in effect, putting together
    a computer simulation of how something works. Object networks look and behave
    like models of real systems. An object-oriented program can be thought of as a
    model, even if there’s no actual counterpart to it in the real world.


    Each component of the model—each kind of object—is described in terms of its behavior,
    responsibilities, and interactions with other components. Because an object’s
    interface lies in its methods, not its data, you can begin the design process
    by thinking about what a system component must do, not how it’s represented in
    data. Once the behavior of an object is decided, the appropriate data structure
    can be chosen, but this is a matter of implementation, not the initial design.


    For example, in the water-use program, you wouldn’t begin by deciding what the
    `Faucet` data structure looked like, but what you wanted a `Faucet` object to
    do—make a connection to a pipe, be turned on and off, adjust the rate of flow,
    and so on. The design is therefore not bound from the outset by data choices.
    You can decide on the behavior first and implement the data afterwards. Your choice
    of data structures can change over time without affecting the design.


    Designing an object-oriented program doesn’t necessarily entail writing great
    amounts of code. The reusability of class definitions means that the opportunity
    is great for building a program largely out of classes devised by others. It might
    even be possible to construct interesting programs entirely out of classes someone
    else defined. As the suite of class definitions grows, you have more and more
    reusable parts to choose from.


    Reusable classes come from many sources. Development projects often yield reusable
    class definitions, and some enterprising developers market them. Object-oriented
    programming environments typically come with class libraries. There are well over
    two hundred classes in the Cocoa libraries. Some of these classes offer basic
    services (hashing, data storage, remote messaging). Others are more specific (user
    interface devices, video displays, sound).


    Typically, a group of library classes work together to define a partial program
    structure. These classes constitute a software framework (or kit) that can be
    used to build a variety of different kinds of applications. When you use a framework,
    you accept the program model it provides and adapt your design to it. You use
    the framework by:


    *   Initializing and arranging instances of framework classes

    *   Defining subclasses of framework classes

    *   Defining new classes of your own to work with classes defined in the framework


    In each of these ways, you not only adapt your program to the framework, but you
    also adapt the generic framework structure to the specialized purposes of your
    application.


    The framework, in essence, sets up part of an object network for your program
    and provides part of its class hierarchy. Your own code completes the program
    model started by the framework.


    # Structuring the Programming Task


    Object-oriented programming not only structures programs in a better way, it also
    helps structure the programming task.


    As software tries to do more and more, and programs become bigger and more complicated,
    the problem of managing the task grows. There are more pieces to fit together
    and more people working together to build them. The object-oriented approach offers
    ways of dealing with this complexity, not just in design, but also in the organization
    of the work.


    ## Collaboration


    Complex software requires an extraordinary collaborative effort among people who
    must be individually creative, yet still make what they do fit exactly with what
    others are doing.


    The sheer size of the effort and the number of people working on the same project
    at the same time in the same place can get in the way of the group’s ability to
    work cooper towards a common goal. In addition, collaboration is often impeded
    by barriers of time, space, and organization:


    *   Code must be maintained, improved, and used long after it’s written. Programmers
    who collaborate on a project may not be working on it at the same time, so they
    may not be in a position to talk things over and keep each other informed about
    details of the implementation.

    *   Even if programmers work on the same project at the same time, they may not
    be located in the same place. This also inhibits how closely they can work together.

    *   Programmers working in different groups with different priorities and different
    schedules often must collaborate on projects. Communication across organizational
    barriers isn’t always easy to achieve.


    The answer to these difficulties must grow out of the way programs are designed
    and written. It can’t be imposed from the outside in the form of hierarchical
    management structures and strict levels of authority. These often get in the way
    of people’s creativity, and become burdens in and of themselves. Rather, collaboration
    must be built into the work itself.

