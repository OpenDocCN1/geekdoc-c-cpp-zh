    Loading and linking: Although it’s the term commonly used, dynamic loading could
    just as well be called dynamic linking. Programs are linked when their various
    parts are joined so that they can work together; they’re loaded when they’re read
    into volatile memory at launch time. Linking usually precedes loading. Dynamic
    loading refers to the process of separately loading new or additional parts of
    a program and linking them dynamically to the parts already running.


    # Structuring Programs


    Object-oriented programs have two kinds of structure. One can be seen in the inheritance
    hierarchy of class definitions. The other is evident in the pattern of message
    passing as the program runs. These messages reveal a network of object connections.


    - The inheritance hierarchy explains how objects are related by type. For example,
    in the program that models water use, it might turn out that faucets and pipes
    are the same kind of object, except that faucets can be turned on and off and
    pipes can have multiple connections to other pipes. This similarity would be captured
    in the program design if the `Faucet` and `Pipe` classes inherit from a common
    superclass.


    - The network of object connections explains how the program works. For example,
    `Appliance` objects might send messages requesting water to valves, and valves
    to pipes. Pipes might communicate with the `Building` object, and the `Building`
    object with all the valves, faucets, and pipes, but not directly with appliances.
    To communicate with each other in this way, objects must know about each other.
    An `Appliance` object would need a connection to a `Valve` object, and a `Valve`
    object to a `Pipe` object, and so on. These connections define a program structure.


    Object-oriented programs are designed by laying out the network of objects with
    their behaviors and patterns of interaction and by arranging the hierarchy of
    classes. There’s structure both in the program’s activity and in its definition.


    ## Outlet Connections


    Part of the task of designing an object-oriented program is to arrange the object
    network. The network doesn’t have to be static; it can change dynamically as the
    program runs. Relationships between objects can be improvised as needed, and the
    cast of objects that play assigned roles can change from time to time. But there
    has to be a script.


    Some connections can be entirely transitory. A message might contain a parameter
    identifying an object, perhaps the sender of the message, that the receiver can
    communicate with. As it responds to the message, the receiver can send messages
    to that object, perhaps identifying itself or still another object that the object
    can in turn communicate with. Such connections are fleeting; they last only as
    long as the chain of messages.


    But not all connections between objects can be handled on the fly. Some need to
    be recorded in program structures. There are various ways to do this. A table
    might be kept of object connections, or there might be a service that identifies
    objects by name. However, the simplest way is for each object to have instance
    variables that keep track of the other objects it must communicate with. These
    instance variables—termed outlets because they record the outlets for messages—define
    the principal connections between objects in the program network.


    Although the names of outlet instance variables are arbitrary, they generally
    reflect the roles that outlet objects play. Figure 4-1 illustrates an object with
    four outlets—an agent, a friend, a neighbor, and a boss. The objects that play
    these parts may change every now and then, but the roles remain the same.


    **Figure 4-1 Outlets**


    ![](Art/outlets.gif)


    Some outlets are set when the object is first initialized and may never change.
    Others might be set automatically as the consequence of other actions. Still others
    can be set freely, using methods provided just for that purpose.


    However they’re set, outlet instance variables reveal the structure of the application.
    They link objects into a communicating network, much as the components of a water
    system are linked by their physical connections or as individuals are linked by
    their patterns of social relations.


    ### Extrinsic and Intrinsic Connections


    Outlet connections can capture many different kinds of relationships between objects.
    Sometimes the connection is between objects that communicate more or less as equal
    partners in an application, each with its own role to play and neither dominating
    the other. For example, an `Appliance` object might have an outlet instance variable
    to keep track of the valve it’s connected to.


    Sometimes one object should be seen as being part of another. For example, a `Faucet`
    object might use a `Meter` object to measure the amount of water being released.
    The `Meter` object would serve no other object and would act only under orders
    from the `Faucet` object. It would be an intrinsic part of the `Faucet` object,
    in contrast to an `Appliance` object’s extrinsic connection to a `Valve` object.


    Similarly, an object that oversees other objects might keep a list of its charges.
    A `Building` object, for example, might have a list of all the `Pipe` objects
    in the program. The `Pipe` objects would be considered an intrinsic part of the
    `Building` object and belong to it. `Pipe` objects, on the other hand, would maintain
    extrinsic connections to each other.


    Intrinsic outlets behave differently from extrinsic ones. When an object is freed
    or archived in a file on disk, the objects that its intrinsic outlets point to
    must be freed or archived with it. For example, when a faucet is freed, its meter
    is rendered useless and therefore should be freed as well. A faucet archived without
    its meter would be of little use when it’s unarchived (unless it could create
    a new `Meter` object for itself).


    Extrinsic outlets, on the other hand, capture the organization of the program
    at a higher level. They record connections between relatively independent program
    subcomponents. When an `Appliance` object is freed, the `Valve` object it was
    connected to still is of use and remains in place. When an `Appliance` object
    is unarchived, it can be connected to another valve and resume playing the same
    sort of role it played before.


    ### Activating the Object Network


    The object network is set into motion by an external stimulus. If you’re writing
    an interactive application with a user interface, it will respond to user actions
    on the keyboard and mouse. A program that tries to factor very large numbers might
    start when you pass it a target number on the command line. Other programs might
    respond to data received over a phone line, information obtained from a database,
    or information about the state of a mechanical process the program monitors.


    Programs often are activated by a flow of events, which are reports of external
    activity of some sort. Applications that display a user interface are driven by
    events from the keyboard and mouse. Every press of a key or click of the mouse
    generates events that the application receives and responds to. An object-oriented
    program structure (a network of objects that’s prepared to respond to an external
    stimulus) is ideally suited for this kind of user-driven application.


    ## Aggregation and Decomposition


    Another part of the design task is deciding the arrangement of classes—when to
    add functionality to an existing class by defining a subclass and when to define
    an independent class. The problem can be clarified by imagining what would happen
    in the extreme case:

