    A program consists of a network of interconnected objects that call upon each
    other to solve a part of the puzzle (as illustrated in [Figure 3-2](#ooObjectModel.html_apple_ref-doc-uid-TP40005149-CH5-85963)).
    Each object has a specific role to play in the overall design of the program and
    is able to communicate with other objects. Objects communicate through messages,
    which are requests to perform methods.


    **Figure 3-2** Objects in a network


    ![](Art/objnetwork.gif)


    The objects in the network won’t all be the same. For example, in addition to
    `Faucet` objects, the program that models water usage might also have `Pipe` objects
    that can deliver water to the `Faucet` and `Valve` objects to regulate the flow
    among pipes. There could be a `Building` object to coordinate a set of pipes,
    valves, and faucets, some `Appliance` objects—corresponding to dishwashers, toilets,
    and washing machines—that can turn valves on and off, and maybe some `User` objects
    to work the appliances and faucets. When a `Building` object is asked how much
    water is being used, it might call upon each `Faucet` and `Valve` object to report
    its current state. When a user starts up an appliance, the appliance will need
    to turn on a valve to get the water it requires.


    ## The Messaging Metaphor


    Every programming paradigm comes with its own terminology and metaphors. The jargon
    associated with object-oriented programming invites you to think about what goes
    on in a program from a particular perspective.


    There’s a tendency, for example, to think of objects as actors and to endow them
    with human-like intentions and abilities. It’s tempting sometimes to talk about
    an object deciding what to do about a situation, asking other objects for information,
    introspecting about itself to get requested information, delegating responsibility
    to another object, or managing a process.


    Rather than think in terms of functions or methods doing the work, as you would
    in a procedural programming language, this metaphor asks you to think of objects
    as performing their methods. Objects are not passive containers for state and
    behavior, but are said to be the agents of the program’s activity.


    This metaphor is actually very useful. An object is like an actor in a couple
    of respects: It has a particular role to play within the overall design of the
    program, and within that role it can act fairly independently of the other parts
    of the program. It interacts with other objects as they play their own roles,
    but it is self-contained and to a certain extent can act on its own. Like an actor
    onstage, it can’t stray from the script, but the role it plays can be multifaceted
    and complex.


    The idea of objects as actors fits nicely with the principal metaphor of object-oriented
    programming—the idea that objects communicate through messages. Instead of calling
    a method as you would a function, you send a message to an object requesting it
    to perform one of its methods.


    Although it can take some getting used to, this metaphor leads to a useful way
    of looking at methods and objects. It abstracts methods away from the particular
    data they act on and concentrates on behavior instead. For example, in an object-oriented
    programming interface, a `start` method might initiate an operation, an `archive`
    method might archive information, and a `draw` method might produce an image.
    Exactly which operation is initiated, which information is archived, and which
    image is drawn isn’t revealed by the method name. Different objects might perform
    these methods in different ways.


    Thus, methods are a vocabulary of abstract behaviors. To invoke one of those behaviors,
    you have to make it concrete by associating the method with an object. This is
    done by naming the object as the receiver of a message. The object you choose
    as receiver determines the exact operation that is initiated, the data that is
    archived, or the image that is drawn.


    Because methods belong to objects, they can be invoked only through a particular
    receiver (the owner of the method and of the data structure the method will act
    on). Different receivers can have different implementations of the same method.
    Consequently, different receivers can do different things in response to the same
    message. The result of a message can’t be calculated from the message or method
    name alone; it also depends on the object that receives the message.


    By separating the message (the requested behavior) from the receiver (the owner
    of a method that can respond to the request), the messaging metaphor perfectly
    captures the idea that behaviors can be abstracted away from their particular
    implementations.


    ## Classes


    A program can have more than one object of the same kind. The program that models
    water usage, for example, might have several faucets and pipes and perhaps a handful
    of appliances and users. Objects of the same kind are said to be members of the
    same class. All members of a class are able to perform the same methods and have
    matching sets of instance variables. They also share a common definition; each
    kind of object is defined just once.


    In this, objects are similar to C structures. Declaring a structure defines a
    type. For example, the declaration


    ```c

    struct key {

    ```


    ```c

    char *word;

    ```


    ```c

    int count;

    ```


    ```

    ```


    defines the `struct key` type. Once defined, the structure name can be used to
    produce any number of instances of the type:


    ```c

    struct key a, b, c, d;

    ```


    ```c

    struct key *p = malloc(sizeof(struct key) * MAXITEMS);

    ```


    The declaration is a template for a kind of structure, but it doesn’t create a
    structure that the program can use. It takes another step to allocate memory for
    an actual structure of that type, a step that can be repeated any number of times.


    Similarly, defining an object creates a template for a kind of object. It defines
    a class of objects. The template can be used to produce any number of similar
    objects—instances of the class. For example, there would be a single definition
    of the `Faucet` class. Using this definition, a program could allocate as many
    `Faucet` instances as needed.


    A class definition is like a structure definition in that it lays out an arrangement
    of data elements (instance variables) that become part of every instance. Each
    instance has memory allocated for its own set of instance variables, which store
    values particular to the instance.


    However, a class definition differs from a structure declaration in that it also
    defines methods that specify the behavior of class members. Every instance is
    characterized by its access to the methods defined for the class. Two objects
    with equivalent data structures but different methods would not belong to the
    same class.


    ### Modularity


    To a C programmer, a module is nothing more than a file containing source code.
    Breaking a large (or even not-so-large) program into different files is a convenient
    way of splitting it into manageable pieces. Each piece can be worked on independently
    and compiled alone, and then integrated with other pieces when the program is
    linked.


    Using the `static` storage class designator to limit the scope of names to just
    the files where they’ declared enhances the independence of source modules. This
    kind of module is a unit defined by the file system. It’s a container for source
    code, not a logical unit of the language. What goes into the container is up to
    each programmer. You can use them to group logically related parts of the code,
    but you don’t have to. Files are like the drawers of a dresser; you can put your
    socks in one drawer, underwear in another, and so on, or you can use another organizing
    scheme or simply choose to mix everything up.

