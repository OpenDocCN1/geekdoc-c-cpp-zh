    ## 方法的访问


    将方法视为对象的一部分（就像实例变量一样）是非常方便的。正如[图 3-1]所示，方法可以被绘制为围绕对象的实例变量周围。但方法在内存中并没有与实例变量分组。内存为每个对象的实例变量分配了空间，但所有实例都需要访问其方法，且同一类的所有实例都共享同一组方法。无论创建了多少个类实例，内存中只有一份方法的拷贝。


    面向对象的语言支持使用文件作为源代码，但它们还增加了类定义。正如你预期的那样，通常每个类都定义在自己的源文件中——逻辑模块与容器相匹配。例如，在 Objective-C
    中，可以在定义类的同一个文件中定义与对象交互的类部分，从而在程序构建中仍然作为一个模块化单元运行——无论它位于多少个文件中。


    使类定义成为语言逻辑单元的机制将在“抽象机制”章节中进行详细讨论。


    ### 可重用性


    面向对象编程的一个主要目标是使你编写的代码尽可能具有可重用性——让它适用于许多不同的场景和应用程序——这样你就可以避免重复实现已经完成的内容（即使方式不同）。可重用性受以下因素影响：


    * 代码的可靠性和无 bug 程度

    * 文档的清晰度

    * 编程接口的简单直观程度

    * 代码执行任务的效率

    * 功能集的完备程度


    这些因素不仅适用于对象模型。它们可以用于判断任何代码的可重用性——包括标准函数和类定义。例如，高效且文档良好的函数比没有文档且不可靠的函数更具重用性。


    尽管如此，通用的比较将显示类定义在可重用代码方面具有函数不具备的优势。你可以采取多种方法让函数更具重用性——例如将数据作为参数传递而不是假设全局变量。尽管如此，事实证明只有极少数函数可以扩展到其最初设计的应用程序之外。它们的可重用性在至少三个方面具有内在局限性：


    * 函数名是全局的；每个函数必须有唯一的名称（声明为 `static` 的函数除外）。这种命名要求使得在构建复杂系统时难以依赖库代码。编程接口将变得难以学习且庞杂，至于无法轻易捕捉概括性。另一方面，类可以共享编程接口。当反复使用相同的命名约定时，可以用相对小且易于理解的接口封装大量功能。

    * 函数是从库中一个接一个选择的。程序员需要自己去挑选他们所需的单个函数。相反，对象是作为功能包提供的，而不是单独的方法和实例变量。它们提供了集成化服务，因此面向对象库的用户不会被困于为某个问题拼凑自己的解决方案。

    * 函数通常与为特定程序设计的特定类型数据结构紧密相连。数据与函数之间的交互是接口中不可避免的一部分。函数只对那些同意使用其接受的参数的相同类型数据结构的人有用。因为对象隐藏了其数据，所以它没有这个问题。这是类比函数更容易被重用的主要原因之一。


    对象的数据受到保护，不会被程序的任何其他部分触。因此，方法可以信任其完整性。它们可以确定外部访问没有将数据置于不符合逻辑或不可维持的状态。结果，对象数据结构比传递给函数的更可靠，方法也可以更多地依赖它。因此，可重用的方法更容易编写。


    此外，由于对象的数据是隐藏的，可以重新实现类以使用不同的数据结构而不影响其接口。所有使用该类的程序都可以在更改任何源代码的情况下采用新版本；无需重新编程。


    ## 抽象机制


    到目前为止，对象已被引入为体现高级抽象的单元，以及应用程序中连贯的角色扮演者。然而，如果没有各种语言机制的支持，就无法这样使用它们。两个最重要的机制是封装和多态。


    封装将对象的实现与其接口分离，而多态则源于给每个类自己的命名空间。接下来的章节将逐一讨论这些机制。


    ### 封装


    要在任何抽象层次上进行有效设计，你都需要能够忽略实现细节，并以将这些细节分组在通用接口下的单元来来思考。为了使一个编程单元真正有效，接口与实现之间的障碍必须是绝对的。接口必须封装实现——即将其从程序的其他部分隐藏起来。封装保护实现免受无意操作和无意访问的影响。


    在 `C` 中，函数被清晰地封装了；其实现对程序的其他部分是不可访问的，并且不受函数体之外可能采取的任何操作的影响。在 `Objective-C` 中，方法的实现同样被封装，但更重要的是对象的实例变量也被封装了。它们被隐藏在对象内部，在外部不可见。实例变量的封装有时被称为信息隐藏。


    初看起来，隐藏实例变量中的信息可能会限制你作为程序员的自由。实际上，它为你提供了更多行动空间，并让你从其他可能施加的约束中解放出来。如果对象的实现的任何部分泄露并变成程序其他部分可访问或关注的内容，它将束缚对象实现者和使用对象的人的手。在没有先询问对方的情况下，双方都无法进行修改。


    假设，你对正在为模拟用水量的程序开发的 `Faucet` 对象感兴趣，并想将其整合到你正在编写的另一个程序中。一旦对象的接口确定，当其他人对其进行开发、修复
    bug 并找到更好的实现方式时，你就不需要担心了。你从这些改进中受益，但这些改进都不会影响你在程序中的操作。因为你完全依赖于接口，他们所做的任何都不会破坏你的代码。你的程序与对象的实现了隔离。


    '
- fmt: '

    Moreover, although those implementing the `Faucet` object might be interested
    in how you use the class and might try to make sure it meets your needs, they
    don’t have to be concerned with the way you write your code. Nothing you do can
    touch the implementation of the object or limit their freedom to make implementation
    changes in future releases. The implementation is insulated from anything that
    you or other users of the object might do.


    ### Polymorphism


    The ability of different objects to respond, each in its own way, to identical
    messages is called polymorphism.


    Polymorphism results from the fact that every class lives in its own namespace.
    The names assigned within a class definition don’t conflict with names assigned
    anywhere outside it. This is true both of the instance variables in an object’s
    data structure and of the object’s methods:


    *   Just as the fields of a `C` structure are in a protected namespace, so are
    an object’s instance variables.

    *   Method names are also protected. Unlike the names of `C` functions, method
    names aren’t global symbols. The name of a method in one class can’t conflict
    with method names in other classes; two very different classes can implement identically
    named methods.


    Method names are part of an object’s interface. When a message is sent requesting
    that an object to something, the message names the method the object should perform.
    Because different objects can have methods with the same name, the meaning of
    a message must be understood relative to the particular object that receives the
    message. The same message sent to two different objects can invoke two distinct
    methods.


    The main benefit of polymorphism is that it simplifies the programming interface.
    It permits conventions to be established that can be reused in class after class.
    Instead of inventing a new name for each new function you add to a program, the
    same names can be reused. The programming interface can be described as a set
    of abstract behaviors, quite apart from the classes that implement them.


    Overloading: The terms polymorphism and parameter overloading refer basically
    to the same thing, but from slightly different points of view. Polymorphism takes
    a pluralistic point of view and notes that several classes can each have a method
    with the same name. Parameter overloading takes the point of view of the method
    name and notes that it can have different effects depending on the parameters
    passed to it. Operator overloading is similar. It refers to the ability to turn
    operators of the language (such as `==` and `+` in `C`) into methods that can
    be assigned particular meanings for particular kinds of objects. Objective-C implements
    polymorphism of method names, but not parameter or operator overloading.


    For example, suppose you want to report the amount of water used by an `Appliance`
    object over a given period of time. Instead of defining an `amountConsumed` method
    for the `Appliance` class, an `amountDispensedAtFaucet` method for a `Faucet`
    class, and a `cumulativeUsage` method for a `Building` class, you can simply define
    a `waterUsed` method for each class. This consolidation reduces the number of
    methods used for what is conceptually the same operation.


    Polymorphism also permits code to be isolated in the methods of different objects
    rather than be gathered in a single function that enumerates all the possible
    cases. This makes the code you write more extensible and reusable. When a new
    case comes along, you don’t have to reimplement existing code; you need only to
    add a new class with a new method, leaving the code that’s already written alone.


    For example, suppose you have code that sends a `draw` message to an object. Depending
    on the receiver, the message might produce one of two possible images. When you
    want to add a third case, you don’t have to change the message or alter existing
    code; you merely allow another object to be assigned as the message receiver.


    ### Inheritance


    The easiest way to explain something new is to start with something understood.
    If you want to describe what a schooner is, it helps if your listeners already
    know what a sailboat is. If you want to explain how a harpsichord works, it’s
    best if you can assume your audience has already looked inside a piano, or has
    seen a guitar played, or at least is familiar with the idea of a musical instrument.


    The same is true if you want to define a new kind of object; the description is
    simpler if it can start from the definition of an existing object.


    With this in mind, object-oriented programming languages permit you to base a
    new class definition on a class already defined. The base class is called a superclass;
    the new class is its subclass. The subclass definition specifies only how it differs
    from the superclass; everything else is taken to be the same.


    Nothing is copied from superclass to subclass. Instead, the two classes are connected
    so that the subclass inherits all the methods and instance variables of its superclass,
    much as you want your listener’s understanding of schooner to inherit what they
    already know about sailboats. If the subclass definition were empty (if it didn’t
    define any instance variables or methods of its own), the two classes would be
    identical (except for their names) and would share the same definition. It would
    be like explaining what a fiddle is by saying that it’s exactly the same as a
    violin. However, the reason for declaring a subclass isn’t to generate synonyms;
    it to create something at least a little different from its superclass. For example,
    you might extend the behavior of the fiddle to allow it to play bluegrass in addition
    to classical music.


    #### Class Hierarchies


    Any class can be used as a superclass for a new class definition. A class can
    simultaneously be a subclass of another class, and a superclass for its own subclasses.
    Any number of classes can thus be linked in a hierarchy of inheritance, such as
    the one depicted in Figure 3-3.


    Figure 3-3 An inheritance hierarchy


    ![](Art/emptyhierarchy.gif)


    Every inheritance hierarchy begins with a root class that has no superclass. From
    the root class, the hierarchy branches downward. Each class inherits from its
    superclass and, through its superclass, from all the classes above it in the hierarchy.
    Every class inherits from the root class.


    Each class is the accumulation of all the class definitions in its inheritance
    chain. In the example above, class D inherits both from C—its superclass—and the
    root class. Members of the D class have methods and instance variables defined
    in all three classes—D, C, and root.


    Typically, every class has just one superclass and can have an unlimited number
    of subclasses. However, in some object-oriented programming languages (though
    not in Objective-C), a class can have more than one superclass; it can inherit
    through multiple sources. Instead of having a single hierarchy that branches downward
    as shown in Figure 3-3, multiple inheritance lets some branches of the hierarchy
    (or of different hierarchies) merge.


    #### Subclass Definitions


    A subclass can make three kinds of changes to the definition it inherits through
    its superclass:


    *   It can expand the class definition it inherits by adding new methods and instance
    variables. This is the most common reason for defining a subclass. Subclasses
    always add new methods and add new instance variables if the methods require it.

    *   It can modify the behavior it inherits by replacing an existing method with
    a new version. This is done by simply implementing a new method with the same
    name as one that’s inherited. The new version overrides the inherited version.
    (The inherited method doesn’t disappear; it’s still valid for the class that defined
    it and other classes that inherit it.)

