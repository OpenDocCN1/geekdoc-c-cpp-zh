  trans: '


    *   我们可以构想出一个只包含一个对象的程序。因为它是唯一的对象，它只能向自己发送消息。因此，它无法利用多态性，无法利用各种类的模块化，也无法利用那种构想为互互连接对象网络的程序设计。程序的真实结构将隐藏在类定义内部。尽管是用面向对象的语言编写的，但它几乎没有任何是面向对象的特征了。

    *   另一方面，我们也可以想象一个由成百上千不同类型的对象组成的程序，每个对象只有极少数的方法且功能有限。在这种情况下，程序的结构同样会丢失，只不过是迷失在了对象连接的迷宫中。


    显然，最好是避免这两种极端情况，让对象足够大以在程序中承担实质性的作用，同时又足够小以保持该角色的定义良好。程序的结构应该能够通过对象连接的模式中易于理解。


    尽管如此，经常会出现这样的问题：是给类添加更多功能，还是将额外的功能提取出来并放在单独的类定义中？例如，一个 `Faucet`（龙头）对象需要跟踪时间推移的用水量。为了做到，你既可以在
    `Faucet` 类中实现必要的方法，也可以像之前建议的那样设计一个通用的 `Meter`（表）对象来完成这项工作。每个 `Faucet` 对象都有一个连接到
    `Meter` 对象的出口，而表不会与龙头之外的任何对象进行交互。


    选择通常取决于你的设计目标。如果 `Meter` 对象可以用于多个场景（可能在另一个完全不同的项目中），那么将计量任务提取到单独的类中将增加代码的可重用性。如果你有理由让
    `Faucet` 对象尽可能自成自足，则可以将计量功能添加到 `Faucet` 类中。


    通常情况下，尝试编写可重用的代码更好，并避免拥有由于包含的事情太多而无法适应其他情况的大型类。当对象被设计成组件时，它们就会变得更具重用性。在某个系统或配置中有效的东西，可能在另一个系统中同样有效。


    在不同的类之间划分功能并不一定会增加编程界复杂度。如果 `Faucet` 类将 `Meter` 对象设为私有，那么 `Meter` 接口就不需要向 `Faucet`
    类的用户公开；对象将像任何其他 `Faucet` 实例变量一样被隐藏。


    ## 模型与框架


    对象结合了状态和行为，因此类似于现实世界中的事物。因为它们类似于真实事物，设计面向对象的程序非常像在思考真实事物——它们做什么、如何工作，以及一个事物是如何与另一个连接的。


    当你设计一个面向对象的程序时，你实际上在组合一个关于事物如何运作的计算机仿真。对象网络看起来和行为上就像真实系统的模型。面向对象的程序可以被认为是一个模型，即使它在现实世界中没有实际对应物。


    模型的每个组件——每种对象——都通过其行为、职责以及与其他组件的交互来描述。因为对象的接口在于其方法而不是其数据，所以你可以通过思考系统组件必须做什么（而不是它在数据中如何表示）来开始设计过程。一旦决定了对象的行为，就可以选择合适的数据结构，但这是实现问题，而不是初始设计问题。


    例如，在用水程序中，你不会从一开始就决定 `Faucet` 数据结构看起来什么样，而是考虑你想要让 `Faucet` 对象做什么——连接到管道、开启和关闭、调整流速等。因此，设计从一开始就不受限于数据选择的束缚。你可以先决定行为，然后再实现数据。你对数据结构的选择可以随着时间而改变，而不会影响设计。


    设计面向对象的程序并不意味着编写大量的代码。类定义的可重用性意味着你有很大机会很大程度上通过他人设计的类来构建程序。甚至可能完全利用别人定义的类来构建有趣的程序。随着类定义套件的增长，你会有越来越多可重用的部分供选择。


    可重用的类来自许多来源。开发项目通常会产生可重用的类定义，一些有进心的开发者会将其投入市场。面向对象的编程环境通常带有类库。Cocoa 库中有超过两百个类。其中一些类提供基本服务（哈希、数据存储、远程消息）。另一些则更具体（用户界面设备、视频显示器、声音）。


    通常，一组库类共同工作定义部分程序结构。这些类构成了一个软件框架（或工具包），可以用于构建各种不同类型的应用程序。当你使用框架时，你接受它提供的程序模型并使你的设计与之相适应。你通过以下方式使用框架：


    *   初始化并安排框架类的实例

    *   定义框架类的子类

    *   定义你自己的新类以与框架中定义的类协作


    在这些每一种方式，你不仅将你的程序适应于框架，还将通用的框架结构适应于应用程序的特殊用途。


    框架本质上为你的程序建立部分对象网络，并提供部分类层次结构。你自己的代码完成了由框架启动的程序模型。


    # 编程任务的结构化


    面向对象编程不仅以更好的方式组织程序，还帮助结构化编程任务。


    随着软件尝试做得越来越多，程序变得越来越大越来越复杂，管理任务的问题也随之增长。有更多的部分需要组合在一起，有更多的人共同工作构建它们。面向对象的方法提供了处理这种复杂性的方法，不仅在设计上，而且在工作组织上。


    ## 协作


    复杂的软件需要人们之间卓越的协作，这些人既要保持个人创造力，又要确保所做的与他人完全契合。


    工作的巨大规模以及在同一时间同一地点工作同一个项目的人数可能会阻碍小组朝着共同目标努力的能力。此外，协作往往受到时间、空间和组织障碍的影响：


    *   代码在编写后很长一段时间内都需要进行维护、改进和使用。协作项目的程序员可能不在同一时间工作，因此他们可能无法随时进行讨论并让对方了解实现的细节。

    *   即使程序员在同一时间工作于同一个项目，他们可能不在同一个地点。这同样限制了他们紧密合作的程度。


    *   在不同小组、不同优先级和不同进度下工作的程序员经常需要在项目上协作。跨越组织障碍的沟通并不总是容易。


    解决这些困难的答案必须从程序设计和编写的方式中产生。它不能从外部以层级管理结构和严格的权威的形式被强加。这些往往会阻碍人的创造力，并本身就成为负担。相反，协作必须构建到工作之中。


    '
- fmt: '

    That’s where object-oriented programming techniques can help. For example, the
    reusability of object-oriented code means that programmers can collaborate effectively,
    even when they work on different projects at different times or are in different
    organizations, just by sharing their code in libraries. This kind of collaboration
    holds a great deal of promise, for it can conceivably lighten difficult tasks
    and make seemingly impossible projects achievable.


    ## Organizing Object-Oriented Projects


    Object-oriented programming helps restructure the programming task in ways that
    benefit collaboration. It helps eliminate the need to collaborate on low-level
    implementation details, while providing structures that facilitate collaboration
    at a higher level. Almost every feature of the object model, from the possibility
    of large-scale design to the increased reusability of code, has consequences for
    the way people work together.


    ### Designing on a Large Scale


    When programs are designed at a high level of abstraction, the division of labor
    is more easily conceived. It can match the division of the program on logical
    lines; the way a project is organized can grow out of its design.


    With an `object-oriented design`, it’s easier to keep common goals in sight, instead
    of losing them in the implementation, and easier for everyone to see how the piece
    they’re working on fits into the whole. Their collaborative efforts are therefore
    more likely to be on target.


    ### Separating the Interface from the Implementation


    The connections between the various components of an object-oriented program are
    worked out early in the design process. They can be well-defined, at least for
    the initial phase of development, before implementation begins.


    During implementation, only this interface needs to be coordinated, and most of
    that falls naturally out of the design. Because each `class` encapsulates its
    implementation and has its own `namespace`, there’s no need to coordinate implementation
    details. Collaboration is simpler when there are fewer coordination requirements.


    ### Dividing the Work into Modules


    The modularity of `object-oriented programming` means that the logical components
    of a large program can each be implemented separately. Different people can work
    on different `classes`. Each implementation task is isolated from the others.


    Modularity has benefits, not just for organizing the implementation, but for fixing
    problems later. Because implementations are contained within `class boundaries`,
    problems that come up are also likely to be isolated. It’s easier to track down
    bugs when they’re located in a well-defined part of the program.


    Separating responsibilities by `class` also means that each part can be worked
    on by specialists. `Classes` can be updated periodically to optimize their performance
    and make the best use of new technologies. These updates don’t have to be coordinated
    with other parts of the program. As long as the interface to an `object` doesn’t
    change, improvements to its implementation can be scheduled at any time.


    ### Keeping the Interface Simple


    The `polymorphism` of `object-oriented programs` yields simpler programming interfaces,
    since the same names and conventions can be reused in any number of `classes`.
    The result is less to learn, a greater shared understanding of how the whole system
    works, and a simpler path to cooperation and collaboration.


    ### Making Decisions Dynamically


    Because `object-oriented programs` make decisions dynamically at runtime, less
    information needs to be supplied at compile time (in source code) to make two
    pieces of code work together. Consequently, there’s less to coordinate and less
    to go wrong.


    ### Inheriting Generic Code


    `Inheritance` is a way of reusing code. If you can define your `classes` as specializations
    of more generic `classes`, your programming task is simplified. The design is
    simplified as well, since the `inheritance hierarchy` lays out the relationships
    between the different levels of implementation and makes them easier to understand.


    `Inheritance` also increases the reusability and reliability of code. The code
    placed in a `superclass` is tested by its `subclasses`. The generic `class` you
    find in a library will have been tested by other `subclasses` written by other
    developers for other applications.


    ### Reusing Tested Code


    The more software you can borrow from others and incorporate in your own programs,
    the less you have to do yourself. There’s more software to borrow in an `object-oriented
    programming environment` because the code is more reusable. Collaboration between
    programmers working in different places for different organizations is enhanced,
    while the burden of each project is eased.


    `Classes` and `frameworks` from an `object-oriented library` can make substantial
    contributions to your program. When you program with the `software frameworks`
    provided by Apple, for example, you’re effectively collaborating with the programmers
    at `Apple`; you’re contracting a part of your program, often a substantial part,
    to them. You can concentrate on what you do best and leave other tasks to the
    `library developer`. Your projects can be prototyped faster, completed faster,
    with less of a collaborative challenge at your own site.


    The increased reusability of `object-oriented code` also increases its reliability.
    A `class` taken from a library is likely to have found its way into a variety
    of applications and situations. The more the code has been used, the more likely
    it is that problems will have been encountered and fixed. Bugs that would have
    seemed strange and hard to find in your program might already have been tracked
    down and eliminated.


    # Document Revision History


    This table describes the changes to Object-Oriented Programming with Objective-C.


    | Date |

    | --- |

    | 2010-11-15 |

    | 2008-11-19 |

    | 2007-12-11 |

    | 2007-07-09 |

    '
