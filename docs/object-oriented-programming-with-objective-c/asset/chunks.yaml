  trans: '

    一个程序由网络相互连接的对象组成，这些对象相互调用以解决谜题的一个部分（如图 3-2 所示）。每个对象在程序的整体设计中都扮演着特定的角色，并能够与其他对象进行通信。对象通过消息进行通信，消息是执行某个方法的请求。


    **图 3-2** 网络中的对象


    ![](img/objnetwork.gif)


    网络中的对象并不都是相同的。例如，一个模拟用水量的程序除了 `Faucet`（龙头）对象外，还可能包含 `Pipe`（管道）对象来向 `Faucet` 供水，以及
    `Valve`（阀门）对象来调节管道之间的流量。可能有一个 `Building`（建筑）对象来协调一组管道、阀门和龙头，一些 `Appliance`（电器）对象——对应洗碗机、马桶和洗衣机——可以打开或关闭阀，可能还有一些
    `User`（用户）对象来操作电器和水龙头。当 `Building` 对象被询问用水量是多少时，它可能会调用每个 `Faucet` 和 `Valve` 对象来报告其当前状态。当用户启动电器时，该电器需要打开一个阀门来获取所需的水。


    ## 消息比喻


    每种编程范式都有自己的术语和比喻。与面向对象编程相关的术语引导你从特定的视角来思考程序中发生的事情。


    例如，人们倾向于将对象视为演员，并赋予它们类似人类的意图和能力。有时，人们很想谈论对象如何对某种情况做出决定、向其他对象请求信息、通过自省来获取请求的信息、将责任委托给另一个对象，或管理一个过程。


    这种比喻并不是像在过程化编程语言中那样，以函数或方法执行工作的方式来思考，而是要求你将对象视为执行它们的方法的实体。对象不是状态和行为的被动容器，而是被视为程序活动的代理（agent）。


    这种比喻实际上非常有用。在某些方面，对象就像演员：它在程序的整体设计中扮演着特定的角色，并且在该角色内，它可以相当独立地作用于程序的其他部分。它在其他对象扮演它们自己的角色时与它们进行交互，但它是自给自的，并在某种程度上可以独立行动。就像舞台上的演员一样，它不能偏离剧本，但它所扮演的角色可以是多方面且复杂的。


    将对象视为演员的想法与面向对象编程的主比喻完美契合——即对象通过消息进行通信的想法。你不是像调用函数那样调用方法，而是向对象发送一条消息，请求它执行其方法中的某一个。


    尽管这可能需要一些时间来适应，但这种比喻提供了一种观察方法和对象的有用方式。它将方法从其作用的特定数据中抽象出来，转而关注行为。例如，在某种面向对象的编程接口中，`start`
    方法可能会启动一个操作，`archive` 方法可能会归档信息，而 `draw` 方法可能会生成一张图像。具体启动了哪种操作、归档了哪些信息以及绘制了哪张图像，并不是通过方法名直接揭示的。不同的对象可能会以不同的方式执行这些方法。


    因此，方法是抽象行为的词汇。要调用这些行为之一，你必须通过将方法与对象关联来使其具体化。这是通过将对象命名为消息的接收者（receiver）完成的。你选择的接收者决定了所启动的精确操作、归档的数据或绘制的图像。


    由于方法属于对象，因此它们只能通过特定的接收者（该方法以及该方法将作用的数据结构的所有者）被调用。不同的接收者对同一个方法有不同的实现。因此，不同的接收者在响应时做出不同的事情。

    '
- fmt: '

    ## Access to methods


    It’s convenient to think of methods as being part of an object, just as instance
    variables are. As in [Figure 3-1], methods can be diagrammed as surrounding the
    object’s instance variables. But methods aren’t grouped with instance variables
    in memory. Memory is allocated for instance variables of each object, but all
    instances needs access to its methods, and all instances of the same class share
    access to the same set of methods. There’s only one copy of the methods in memory,
    no matter how many instances of the class are created.


    Object-oriented languages support the use of file for source code, but they also
    add class definitions. As you’d expect, it is often the case that each class is
    defined in its own source file—logical modules are matched to container. In Objective-C,
    for example, it would be possible to define part of the class that interacts with
    objects in the same file that defines the class, thus still act as modular unit
    within the construction of the program—no matter how many files it was located
    in.


    The mechanisms that make class definitions logical units of the language are discussed
    in some detail under “Mechanisms of Abstraction.”


    ### Reusability


    A principal goal of object-oriented programming is to make the code you write
    as reusable as possible—to have it serve many different situations and applications—so
    that you can avoid reimplementing something that’s already done, if only differently.
    Reusability is influenced by factors such as:


    * How reliable and bug-free the code is

    * How clear the documentation is

    * How simple and straightforward the programming interface is

    * How efficiently the code performs its tasks

    * How full the feature set is


    These factors don’t apply just to the object model. They can be used to judge
    reusability of any code—standard functions as well as class definitions. Efficient
    and well-documented functions, for example, would be more reusable than undocumented
    and unreliable ones.


    Nevertheless, a general comparison would show that class definitions lend themselves
    to reusable code in ways that functions do not. There are various things you can
    do to make functions more reusable—for example passing data as parameters rather
    than assuming global variables. Even so, it turns out that only a small subset
    of functions can be generalized beyond the applications they were originally designed
    for. Their reusability is inherently limited in at least three ways:


    * Function names are global; each function must have a unique name (except for
    those declared `static`). This naming requirement makes it difficult to rely heavily
    on library code when building a complex system. The programming interface would
    be hard to learn and so extensive that it couldn’t easily capture generalizations.
    Classes on the other hand can share programming interfaces. When the same naming
    conventions are used over over, a great deal of functionality can be packaged
    with a relatively small and easy-to-understand interface.

    * Functions are selected from a library one at a time. It’s up to programmers
    to pick and choose the individual functions they need. In contrast, objects come
    as packages of functionality, not as individual methods and instance variables.
    They provide integrated services, so users of object-oriented library won’t get
    bogged down piecing together their own solutions to a problem.

    * Functions are typically tied to particular kinds of data structures devised
    for a specific program. The interaction between data and function is an unavoidable
    part of the interface. A function is useful only to those who agree to use the
    same kind of data structures it accepts as parameters. Because it hides its data,
    an object doesn’t have this problem. This is one of the principal reasons that
    classes can be reused more easily than functions.


    An object’s data is protected and won’t be touched by any other part of the program.
    Methods can therefore trust its integrity. They can be sure that external access
    hasn’t put data into an illogical or untenable state. As a result, an object data
    structure is more reliable than one passed to a function, and methods can depend
    on it more. Reusable methods are consequently easier to write.


    Moreover, because an object’s data is hidden, a class can be reimplemented to
    use a different data structure without affecting its interface. All programs that
    use the class can pick up the new version without changing any source code; no
    reprogramming is required.


    ## Mechanisms of Abstraction


    To this point, objects have been introduced as units that embody higher-level
    abstractions and as coherent role-players within an application. However, they
    couldn’t be used this way without the support of various language mechanisms.
    Two of the most important mechanisms are encapsulation and polymorphism.


    Encapsulation keeps the implementation of an object out of its interface, and
    polymorphism results from giving each class its own namespace. The following sections
    discuss each of these mechanisms in turn.


    ### Encapsulation


    To design effectively at any level of abstraction, you need to be able to leave
    details of implementation behind and think in terms of units that group those
    details under a common interface. For a programming unit to be truly effective,
    the barrier between interface and implementation must be absolute. The interface
    must encapsulate the implementation—that is, hide it from other parts of the program.
    Encapsulation protects an implementation from unintended actions and from inadvertent
    access.


    In `C`, a function is clearly encapsulated; its implementation is inaccessible
    to other parts of the program and protected from whatever actions might be taken
    outside the body of the function. In `Objective-C`, method implementations are
    similarly encapsulated, but more importantly so are an object’s instance variables.
    They’re hidden inside the object and invisible outside it. The encapsulation of
    instance variables is sometimes called information hiding.


    It might seem, at first, that hiding the information in instance variables might
    constrain your freedom as a programmer. Actually, it gives you more room to act
    and frees you from constraints that might otherwise be imposed. If any part of
    an object’s implementation could leak out and become accessible or a concern to
    other parts of the program, it would tie the hands both of the object’s implementer
    and of those who would use the object. Neither could make modifications without
    first checking with the other.


    Suppose, for example, that you’re interested in the `Faucet` object being developed
    for the program that models water use and you want to incorporate it in another
    program you’re writing. Once the interface to the object is decided, you don’t
    have to be concerned when others work on it, fix bugs, and find better ways to
    implement it. You get the benefit of these improvements, but none of them affects
    what you do in your program. Because you depend solely on the interface, nothing
    they do can break your code. Your program is insulated from the object’s implementation.

    '
