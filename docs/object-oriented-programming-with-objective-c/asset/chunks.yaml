    \ combine state and behavior—objects. It then explains how you characterize these\
    \ objects as belonging to a particular class, how one class can inherit state\
    \ and behavior from another class, and how objects can send messages to other\
    \ objects.\n* **Structuring Programs**: explains how you think about designing\
    \ an object-oriented program by creating connections between objects. It introduces\
    \ the techniques of aggregation and decomposition, which divide responsibility\
    \ between different sorts of object, and the role of frameworks in defining libraries\
    \ of objects designed to work together.\n* **Structuring the Programming Task**:\
    \ discusses issues of project management related to collaboration among programmers\
    \ and to code implementation.\n\n## See Also\n\nObjective-C Programming Language\
    \ describes the Objective-C programming language.\n\nObjective-C Runtime Programming\
    \ Guide describes how you can interact with the Objective-C runtime.\n"
