    \n如果你已经使用面向对象环境开发过应用程序，本文档将帮助你理解使用 Objective-C 必不可的基础概念。\n\n由于这不是关于关于 C 语言的文档，它假设你对该语言已有一定的了解。然而，这种了解不需要非常深入。Objective-C\
    \ 中的面向对象编程与 ANSI C 中的过程化编程有显著区别，即使你不是一名丰富的 C 程序员，也不会受到阻碍。\n\n# 文档结构\n\n本文档分为几个章节：\n\
    \n*   **为什么选择 Objective-C**：解释了为什么选择 Objective-C 作为 Cocoa 框架的开发语言。\n*   **面向对象编程**：讨论了面向对象语言的原理，并引入了许多术语。它发展了面向对象技术背后的思想。即使你已经熟悉面向对象编程，也鼓励你阅读这一章，以获得\
    \ Objective-C 对面向对象的视角。\n*   **对象模型**：描述了你如何通过结合状态和行为的单元——对象——来思考程序。然后解释了如何将这些对象表征为属于特定类、一个类如何继承另一个类的状态和行为，以及对象如何向其他对象发送消息。\n\
    *   **程序结构化**：解释了如何通过创建对象之间的连接来思考设计面向对象程序。它引入了聚合和分解技术，这些技术在不同类型的对象之间分配责任，以及框架在定义旨在协同工作的对象库中的作用。\n\
    *   **编程任务的结构化**：讨论了与程序员协作以及代码实现相关的项目管理问题。\n\n## 另另参考\n\n《Objective-C Programming\
    \ Language》描述了 Objective-C 编程语言。\n\n《Objective-C Runtime Programming Guide》描述了你如何与\
    \ Objective-C 运行时交互。\n\n"
