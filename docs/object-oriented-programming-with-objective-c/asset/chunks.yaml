    Objective-C Runtime Reference describes the data structures and functions of the
    Objective-C runtime support library. Your programs can use these interfaces to
    interact with the Objective-C runtime system. For example, you can add classes
    or methods, or obtain a list of all class definitions for loaded classes.


    # Why Objective-C?


    The Objective-C language was chosen for a variety of reasons. First and foremost,
    it’s an object-oriented language. The kind of functionality that’s packaged in
    the Cocoa frameworks can only be delivered through object-oriented techniques.
    Second, because Objective-C is an extension of standard ANSI C, existing C programs
    can be adapted to use the software frameworks without losing any of the work that
    went into their original development. Because Objective-C incorporates C, you
    get all the benefits of C when working within `Objective-C`. You can choose when
    to do something in an object-oriented way (define a new class, for example) and
    when to stick to procedural programming techniques (define a structure and some
    functions instead of a class).


    Moreover, Objective-C is a fundamentally simple language. Its syntax is small,
    unambiguous, and easy to learn. Object-oriented programming, with its self-conscious
    terminology and emphasis on abstract design, often presents a steep learning curve
    to new recruits. A well-organized language like Objective-C can make becoming
    a proficient object-oriented programmer that much less difficult.


    Compared to other object-oriented languages based on C, Objective-C is very dynamic.
    The compiler preserves a great deal of information about the objects themselves
    for use at runtime. Decisions that otherwise might be made at compile time can
    be postponed until the program is running. Dynamism gives Objective-C programs
    unusual flexibility and power. For example, it yields two big benefits that are
    hard to get with other nominally object-oriented languages:


    *   Objective-C supports an open style of dynamic binding, a style that can accommodate
    a simple architecture for interactive user interfaces. Messages are not necessarily
    constrained by either the class of the receiver or even the method name, so a
    software framework can allow for user choices at runtime and permit developers
    freedom of expression in their design. (Terminology such as dynamic binding, message,
    class, and receiver are explained in due course in this document.)


    *   Dynamism enables the construction of sophisticated development tools. An interface
    to the runtime system provides access to information about running applications,
    so it’s possible to develop tools that monitor, intervene, and reveal the underlying
    structure and activity of Objective-C applications.


    Historical note: As a language, Objective-C has a long history. It was created
    at the Stepstone company in the early 1980s by Brad Cox and Tom Love. It was licensed
    by NeXT Computer Inc. in the late 1980s to develop the NeXTStep frameworks that
    preceded Cocoa. NeXT extended the language in several ways, for example, with
    the addition of protocols.


    # Object-Oriented Programming


    As humans, we’re constantly faced with myriad facts and impressions that we must
    make sense of. To do so, we must abstract underlying structure away from surface
    details and discover the fundamental relations at work. Abstractions reveal causes
    and effects, expose patterns and frameworks, and separate what’s important from
    what’s not. Object orientation provides an abstraction of the data on which you
    operate; moreover, it provides a concrete grouping between the data and the operations
    you can perform with the data—in effect giving the data behavior.


    ## Data and Operations


    Programming languages have traditionally divided the world into two parts—data
    and operations on data. Data is static and immutable, except as the operations
    may change it. The procedures and functions that operate on data have no lasting
    state of their own; they’re useful only in their ability to affect data.


    This division is, of course, grounded in the way computers work, so it’s not one
    that you can easily ignore or push aside. Like the equally pervasive distinctions
    between matter and energy and between nouns and verbs, it forms the background
    against which we work. At some point, all programmers—even object-oriented programmers—must
    lay out the data structures that their programs will use and define the functions
    that will act on the data.


    With a procedural programming language like `C`, that’s about all there is to
    it. The language may offer various kinds of support for organizing data and functions,
    but it won’t divide the world any differently. Functions and data structures are
    the basic elements of design.


    Object-oriented programming doesn’t so much dispute this view of the world as
    restructure it at a higher level. It groups operations and data into modular units
    called objects and lets you combine objects into structured networks to form a
    complete program. In an object-oriented programming language, objects and object
    interactions are the basic elements of design.


    Every object has both state (data) and behavior (operations on data). In that,
    they’re not much different from ordinary physical objects. It’s easy to see how
    a mechanical device, such as a pocket watch or a piano, embodies both state and
    behavior. But almost anything that’s designed to do a job does, too. Even simple
    things with no moving parts such as an ordinary bottle combine state (how full
    the bottle is, whether or not it’s open, how warm its contents are) with behavior
    (the ability to dispense its contents at various flow rates, to be opened or closed,
    to withstand high or low temperatures).


    It’s this resemblance to real things that gives objects much of their power and
    appeal. They can not only model components of real systems, but equally as well
    fulfill assigned roles as components in software systems.


    ## Interface and Implementation


    To invent programs, you need to be able to capture abstractions and express them
    in the program design. It’s the job of a programming language to help you do this.
    The language should facilitate the process of invention and design by letting
    you encode abstractions that reveal the way things work. It should let you make
    your ideas concrete in the code you write. Surface details shouldn’t obscure the
    architecture of your program.


    All programming languages provide devices that help express abstractions. In essence,
    these devices are ways of grouping implementation details, hiding them, and giving
    them, at least to some extent, a common interface—much as a mechanical object
    separates its interface from its implementation, as illustrated in Figure 2-1.


    Figure 2-1 Interface and implementation


    ![](Art/watchcalls_35.gif)


    Looking at such a unit from the inside, as the implementer, you’d be concerned
    with what it’s composed of and how it works. Looking at it from the outside, as
    the user, you’re concerned only with what it is and what it does. You can look
    past the details and think solely in terms of the role that the unit plays at
    a higher level.


    The principal units of abstraction in the `C` language are structures and functions.
    Both, in different ways, hide elements of the implementation:


    *   On the data side of the world, `C` structures group data elements into larger
    units that can then be handled as single entities. While some code must delve
    inside the structure and manipulate the fields separately, much of the program
    can regard it as a single thing—not as a collection of elements, but as what those
    elements taken together represent. One structure can include others, so a complex
    arrangement of information can be built from simpler layers.

