    \ #1 和消息 #2。每条消息都设置为少于 16 个字符，以使显示内容整齐美观，也就是说，每条消息都限制在单行显示范围内。下一步是在使用 LCD 之前对其进行初始化并清除显示内容。之后，将光标定位到第一行的开头（光标位置\
    \ = 0），并写入消息 #1。然后，将光标定位到第二行的开头（光标位置 = 16），并写入消息 #2。\n\n为了增加一些趣味性，接着将光标定位到第三行的中间位置（光标位置\
    \ = 36），并写入五个字符。如果你到现在还没有弄清楚，那么 LCD 显示屏的光标位置 0 到 15 对应第一行，即顶行。位置 16-31 对应第二行，位置\
    \ 32-47 对应底行，即第三行。LCD 初始化时，光标本身不可见；当数据写入显示屏后，光标位置会自动移动到下一个位置。写入 LCD 并显示的任何数据都必须采用\
    \ ASCII（美国信息交换标准代码）格式。\n\n## 使用 LCD 的关键应用回顾：\n- LCD 是一种可配置的智能设备，在应用程序运行期间由 PIC24H\
    \ 发出命令进行控制。\n\n## 源代码关键特性回顾：\n- 使用 include 指令可以使代码高度模块化，在本例中引入了 ADC 驱动程序库。\n-\
    \ 项目为每个驱动程序分别包含多个文件，其中驱动程序函数的声明位于 .h 文件中，函数主体位于 .c 文件中。\n- Main 只需包含所需的 .h 文件，即可直接访问所有驱动程序代码。\n\
    - 在 main 函数之前声明的全局变量可被所有代码访问。\n- 在本例中，我们又引入了一个库函数：LCD。\n\n## 练习：\n- 1. 尝试将第一个实验中的消息修改为自定义内容，然后重新运行实验。\n\
    - 2. 确定 BCD1000 在源代码中的位置。main 如何访问它？\n- 3. 让实验 2 使用电位器滑动端连接到另一个模拟输入。\n- 4. 尝试在实验\
    \ 2 中使用 ADC 库中的平均函数。注意，使用平均功能后，显示读数会更加稳定。\n\n中断控制器；最后，还必须有一个特定的函数调用，该函数被指定为中断服务程序，并会在中断发生后被调用和执行。关于服务程序的具体细节、其构造方式以及它至少必须执行的操作，还有一些需要说明的内容。我们稍后会介绍这些内容。\n\
    \n一旦发生定时器中断条件，CPU 的当前状态（程序计数器、状态寄存器和标志位）就会被保存，或称为“压入”堆栈（PIC24H 内部的先进先出 RAM 缓冲区）。随后，定时器中断服务程序会被调用并由\
    \ CPU 执行，以处理定时器中断条件。当 CPU 退出服务程序后，中断发生之前的 CPU 状态会从堆栈中恢复，或称为“弹出”。然后，CPU 继续执行正常操作。从某种意义上说，这种中断机制允许外设处理服务按需执行。\n\
    \n## 硬件说明\n\n我们在第 2 章中已经见过这种特定的硬件设置，现在将再次使用它。这是熟悉的 LED 闪烁原型，但在本实验中，软件完全不同。我们将使用定时器的新技术。所有实验都会采用相同的软件\
    \ I/O 设置。在这些实验中，我们希望将一个 LED 连接到 PORTB 的第 5 位，即 RB5，并将 RB5 设置为数字输出。\n\nRB5 是 PIC24HJ128GP502\
    \ 上的第 14 号引脚。该器件采用 28 引脚 DIP 封装，因此芯片两侧各有 14 个引脚。从芯片顶部向下看，封装上有一个缺口，用于指示第 1 号引脚；所有引脚从\
    \ 1 到 28 逆时针编号。因此，第 14 号引脚，即 RB5，应当是芯片右下方的最后一个引脚。\n\n图 6-2 展示了原理图。PIC24H 的数字输出端每个最多可以提供\
