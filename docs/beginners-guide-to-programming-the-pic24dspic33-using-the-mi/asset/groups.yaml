  - '[PAGE 27]


    illustrate this point. Let''s compare the PIC24HJ128GP502 part to a well-known
    8 bit member of the Microchip family the PIC16F887.


    We will compare data size, memory size, clock rates and final instruction speed
    measured in MIPS (Millions of Instructions per Second). The comparison shows that
    the PIC24H has 16x the memory capacity in flash, over 20x the RAM capacity, and
    a MIPS rate of 8x the PIC16F887. If we also compare peripheral content we will
    find that the 16 bit exceeds by a factor or 2:1 numerically over most of the 8
    bit internal peripherals, and introduces new peripherals. Finally as the 16 data
    bus is 2x the size of the 8 data bus meaning that twice as much data is handled
    during any one instruction. With this type of processing power and peripheral
    power you can handle a broader range of applications that 8 bit world could not
    handle standalone. We discussed these briefly in the introduction but could include
    network connectivity with TCP/IP stack, high resolution graphics, wireless stacks
    like ZIGBEE, 802.11b, SD-CARD with 2GB+ capacity that is formatted in a WINDOWS
    compatible file I/O, to name a few.


    | | PIC24HJ128GP502 | PIC16F887 |

    |---|---|---|

    | Data bus | 16 bit | 8 bit |

    | Flash Size | 128K Flash | 8K Flash |

    | Ram Size | 8K RAM | 386 RAM |

    | Clock rate | 80 MHZ | 20 MHZ |

    | MIPS | 40 MIPS | 5 MIPS |

    | Supply Voltage | 3.3V operation | 5 V operation |


    # The PIC24HJ128GP502 Microcontroller


    Let''s dig a little deeper and now explore the PIC24HJ128GP502 microcontroller
    more closely. This device, as mentioned earlier, comes prepackaged in a "skinny
    DIP". As discussed earlier the PIC24HJ128GP502 is a +3.3VDC logic part and supports
    40 MIPS of operation with both a 128K FLASH, 8K RAM. Even though this part is
    +3.3V logic it can also support +5V Input on some of its pins (see +5V input tolerant
    pins) and it has the ability to drive +5VDC output logic level by using device
    configurable open drain setting on output levels. Interrupt handling and response
    times are important considerations in the use of microcontrollers for any real
    time operations. The PIC24H is well equipped here. It has an internal interrupt
    controller with guaranteed 5-cycle latency in respond to interrupts, up to 45
    available interrupt sources, with seven priority levels, five traps for any processor
    exception handling (i.e. divide by zero) and three external interrupts.


    The PIC24H has built-in peripheral for Direct Memory Access (DMA) that supports
    8 channels of DMA with an independent dual ported 2KB RAM that'
  - '[PAGE 28]


