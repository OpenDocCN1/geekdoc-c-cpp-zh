    ![](img/a9229e7b0ddd9608f171b22b52514f39_66_2.png)


    Physical switch


    Functional Block


    Electrical Symbol


    Figure 3-2: Switch Representation


    When the switch is non-depressed it will be open and the RB3 pin will float (not
    have any direct connection between ground or +3.3VDC). In this case, the condition
    as read by the microcontroller will be indeterminate. To remedy this situation,
    we need to tie +3.3VDC through a resistor to the NO terminal of the switch. In
    this matter when not depressed RB3 will read a one or high value, when depressed
    the switch will connect that point to ground and the RB3 reading will be zero.


    Rather than use an external resistor to make the circuit, the PIC24H has a neat
    feature, the capability of configuring a pull up resistor internally to the pin
    through a 100K resistor. It is called a weak pull up in that it uses 100K so not
    much current is available, which is ok here. The pull up control is enabled by
    setting the appropriate bit within a SFR. In this case the SFR is CNPU1 (Change
    Notification Pull Up). See Figure 3-3.


    When you examine the pin out for the PIC24HJ128GP502, pin 7 RB3, it shows that
    RB3 shares pin with CN7, so this is the control bit we want to set in the CNPU1
    SFR. By setting it, the RB3 pin will be pulled up through an internal 100K resistor
    to +3.3VDC, or the microcontroller supply, eliminating the need for an external
    pull-up resistor.'
