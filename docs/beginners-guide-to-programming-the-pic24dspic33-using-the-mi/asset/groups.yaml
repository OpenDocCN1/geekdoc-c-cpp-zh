    ## 运行实验


    将 Microstick II 插入无焊面包板。按原理图所示将电位器添加到电路中。将电位器的一端接地，另一端接 +3.3VDC 外部电源。确保接地端也连接到
    Microstick II 的引脚 8。将 Microstick II 连接到 PC 的 USB 端口。


    ![](img/a9229e7b0ddd9608f171b22b52514f39_91_0.png)


    图4-8：ADC 原型


    导航到第 4 章的练习 1 文件夹。打开此文件夹并双击 Microchip 项目图标。MPLAB lab 应打开，输出窗口应显示 Microstick II
    已连接。在调试模式下构建并编程 Microstick II。


    打开一个监视窗口，并设置监视两个变量 adcvalue 和 count 数组。注意，您可以通过单击与变量关联的 + 符号来展开 count 数组。在主函数中的
    delay 函数处设置断点，并从复位状态运行。


    为了快速检查，PIC24H 应停在 delay 函数处，监视变量应被填充。调整电位器并再次运行程序，变量值应发生变化。如果变量没有变化，请对照原理图检查接线。您的接线存在错误。


    让我们进行一些最终验证。将您的 adcvalue 与 count 数组值进行比较。您可以使用计算器对 adcvalue 进行十六进制到十进制的转换，或者在监视窗口中右键单击
    adcvalue 并将属性设置为十进制，然后直接进行比较。


    另一种更完整的验证方式是使用电压表，并将该电压表连接在电位器滑片与地之间进行电压测量。


    ## 第5章 – 将 LCD 显示器与 Microstick II 配合使用


    在本章中，我们将使用 Microstick II 与一个外部 LCD（液晶显示器）。需要考虑软件（以库的形式）和硬件接口两个方面。LCD 通过显示状态、提供重要的应用反馈以及促进与用户的操作控制，真正增强了微控制器的操作能力。


    我们将使用的 LCD 支持多行文本显示：3 行 × 16 字符，共 48 个字符。LCD 带有集成内置控制器，负责处理显示操作中较为繁琐的大量“繁重工作”。例如，LCD
    控制器驱动显示器上的各个显示段；为 ASCII 文本输入自动生成显示字符段；最后，响应与外部微控制器（在本例中为 Microstick II）之间的固定命令和数据接口。


    在本章中，我们将采用一种易于在您未来项目中复用的接线方案和软件库。为了巩固理解，我们将使用此配置进行几个实验。第一个实验将只关注首次设置和操作 LCD。在第二个实验中，我们将把
    LCD 与第 4 章介绍的 ADC 库结合使用，使其充当简单的电压表；以电压格式输出并显示 ADC 数据。让我们开始吧！


    ### 硬件描述


    该 LCD 是一款由 Electronic Assembly Corporation 制造的 +3.3VDC 供电的 16x3 字符液晶显示器。它在控制方式上与其他标准
    LCD 非常相似，但具有内置对比度控制的扩展功能（无需任何外部电位器）。此外，它的功耗非常低（通常在 +3.3VDC 下为 250 微安）。该 LCD 专为紧凑型手持设备而设计；它也非常紧凑、超薄，并支持“类
    DIP”引脚排列，非常适合面包板原型制作。


    ![](img/a9229e7b0ddd9608f171b22b52514f39_97_0.png)


    ![](img/a9229e7b0ddd9608f171b22b52514f39_97_1.png)


    图5-1 EA DOGM LCD 显示器


    LCD 显示接口是一个 4 位数据和 2 位命令的数字接口。4 位接口是相对于正常 8 位接口的可选方案，需要向 LCD 写入两次 4 位半字节，而不是一个字节。选择此接口是为了简化与
    Microstick II 的原型接线和引脚需求。另一个简化是让 Microstick II 不从 LCD 读取数据，而只向其写入数据。为此，LCD 库强制
    Microstick II 的 PIC24H 在与 LCD 控制器进行命令/数据事务之间延迟足够长的时间，让 LCD 有时间响应，而无需读取和检查其忙状态。


    图5-2 展示了 Microstick II 与 LCD 连接的原理图。


    ![](img/a9229e7b0ddd9608f171b22b52514f39_98_0.png)


    图5-2：LCD 与 Microstick II 原理图


    请注意，驱动 LCD 需要单独的 +3.3VDC 电源，因为 Microstick II 本身不提供外部电源。另一种获取 +3.3VDC 的方式是连接到 Microstick
    II 上的 TP1 过孔，因为 LCD 的电流需求非常小。LCD 与 Microchip 之间的接地必须共地，并按图示连接到引脚 8。


    LCD 确实需要使用单独的电子元件才能运行。对比度控制和 LCD 内部电压调节需要 2.2uF 和 .22uF 两个电容（C3、C2）（见图5-2）。请注意，2.2uF
    电容是有极性的——因此请遵循其标记，确保正极连接到引脚 25 和 26。


    如前所述，LCD 引脚排列配置为 40 引脚 DIP（底部一行引脚大多缺失）。从显示器顶部看，左下角引脚为引脚 1，右下角为引脚 20。顶部一排引脚从左到右为引脚
    40 至 21。请按照原理图中显示的所有连接进行操作，并与原型图片进行目视比较。另请注意，Electronic Assembly LCD 显示器在显示面带有保护膜。应将其撕掉（剥下）以便无障碍观看。


    总之，LCD 与 Microstick II 的 4 位并行数据接口如下：


    - LCD D7 连接到 Microstick II 引脚 RA3

    - LCD D6 连接到 Microstick II 引脚 RB2

    - LCD D5 连接到 Microstick II 引脚 RA1

    - LCD D4 连接到 Microstick II 引脚 RA0


    命令接口由两条命令线实现：


    - LCD 命令/数据控制 RS 连接到 Microstick II 引脚 RB10

    - LCD 选通输入 E 连接到 Microstick II 引脚 RB11


    ![](img/a9229e7b0ddd9608f171b22b52514f39_99_0.png)


    图5-3：LCD 原型


    ### 软件库描述


    硬件部分就到此为止，现在是有趣的部分。让我们学习驱动 LCD 的软件函数以及如何使用它们。这里我们将使用五个函数。它们的名称基本说明了它们的功能。请记住，LCD
    的数据只接受 ASCII 字符。如前所述，LCD 组织为具有 0-47（48）个字符位置的显示器，或者类似地，一个 16x3 显示矩阵。同样，这指的是 16
    列 × 3 行。第一行包含位置 0-15，第二行 16-31，第三行 32-47。该库允许完全自由地将字符放置在显示矩阵中的任何位置。当您一次接一个字符（如字符串）写入时，它还会自动递增字符位置。

