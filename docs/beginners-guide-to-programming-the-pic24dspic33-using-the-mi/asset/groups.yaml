  - '[PAGE 81]


    In Figure 4-1 the analog environment (typical of an input sensor value) is shown
    as a continuous voltage output over time. As environment conditions change the
    sensor output value also changes smoothly without interruption. The microcontroller,
    however, is a digital device; it operates only with digital numbers, and can only
    make a measurement periodically (as part of a normal processing loop). From the
    microcontroller viewpoint the continuous sensor signal is now a discrete set of
    values sampled at a fixed rate. The values are approximate values to true analog
    value given the simple fact that the digital number size itself is limited in
    resolution, or number of bits. For the PIC24H the ADC can generate a either a
    10 or 12 bit value (user selectable).


    A 10 bit resolution provides a 1/1024 *3.3VDC voltage resolution or 3 millivolts
    (remember that the PIC24H is a +3.3VDC part). The 12 bits does better with 1/4096
    * 3.3VDC or 8 millivolts. In both cases the ADC provides for a fixed resolution
    of the input sensor value based on the size of the ADC conversion. The PIC24H
    ADC resolution accuracy is good to +-1 LSB of the digital word size. This accuracy
    can be improved by averaging successive reading (assuming input does not change
    during averaging) to better than an LSB. A rule of thumb with this technology
    is to insure that the signal (by dynamically adjusting its amplitude) gets as
    large a signal as possible to the ADC and without exceeding full scale to achieve
    the best signal resolution during sample measurement. In our experiments we will
    not control any signal amplitude and only measure the raw output directly.


    Let’s now discuss the fixed measurement rate or sample rate. As mentioned earlier,
    by using a fixed sample rate you are measuring the signal periodically. With periodical
    sampling the risk is that the signal may change between the periodic samples significantly
    and the microcontroller will not “see” and therefore measure and respond to these
    changes. A rule of thumb in engineering is that the sample rate should be high
    enough to capture the highest frequency of the signal. To be more precise the
    rule states that the sample rate = 2X Highest Input frequency (also known as Shannon’s
    Rule). In most cases (outside of audio) the sensor outputs are typically very
    low in frequency content so that a high sample rate isn’t necessary. However,
    the highest sample rate for the PIC24H with 10 bit ADC is 1.1MSPS (million samples
    per second) and for 12 bit ADC is 500 KSPS (500 hundred samples per second).


    There is no free lunch in life, like everything else, there is a tradeoff for
    the user, and you essentially can trade off voltage resolution (10 or 12 bits)
    for conversion speed (1.1 MSPS or 500KSPS). The choices are up to you and should
    be dictated by what is needed for highest accuracy and most timely sensor reading.
    In our experiments we will work the 12 bit only.


    Let’s cover some more basics a before moving on with the experiments. Figure 4-2
    shows some of the discrete steps that are involved with an ADC operation, beyond
    sampling rate and digital resolution. The ADC operation is broken into'
  - '[PAGE 82]


    two discrete steps: acquisition time (sampling and holding the signal) and then
    conversion (performing the ADC process on the sampled and held signal). In order
    to collect and hold an analog signal for conversion a sample and hold capacitor
    is used. This capacitor is internal to the PIC24H electronics. The capacitor follows
    the analog input signal and then upon a sample command stores a voltage capture
    of the analog value for the conversion process. This is denoted as the sample
    and hold process.


    While the signal is held in the capacitor an analog to digital conversion process
    takes place. The conversion uses an exact number of CPU clock cycles (equivalent
    to resulting output word size), to perform the conversion. This type of conversion
    process is known as successive approximation, where an internal comparator is
    used to measure the difference between the analog sampled input and an internal
    generated ramp comparator. The ramp output voltage size is dictated by the number
    of conversion clocks. For each clock (one of the 10 or 12) a digital decision
    is made and a digital bit value is generated and stored as part of the final digital
    word result.


    ![](img/a9229e7b0ddd9608f171b22b52514f39_82_0.png)


    Figure 4-2: ADC Sampling Time


    The PIC24H ADC peripheral is an extremely versatile part and has a number of operational
    modes configurable by setting peripheral specific SFR (special function registers).
    One of these modes is resolution and is selectable from 10 to 12 bit. The other
    is the number of sample and hold (S/H) channels that you can use. With 10 bit
    selection the number of total S/H is four, with a 12 bit ADC'
