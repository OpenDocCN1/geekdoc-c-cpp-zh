    ![](img/a9229e7b0ddd9608f171b22b52514f39_55_0.png)


    Figure 2-14: Programming Microstick II


    Congratulations! You have you first working prototype! If you are tired of the
    blinking LED you can stop at any time by clicking pause. To continue, click run
    or reset. The simulation tools also work under Microstick II debug. For instance
    you can still set breakpoints and watch as needed, stopwatch only works under
    simulation. Let''s move on to Experiment 2.


    # Experiment 2


    Let''s expand on what we have and add some new functionality. Here we use the
    same software structure as in Experiment 1 but modify the software and add hardware
    to demonstrate a eleven LED digital counter. Let''s start with the hardware first.
    The schematic shown in Figure 2-16 adds ten LEDs and series resistors to the prototype.
    RB15 on the Microchip board already has its own LED (not shown in schematic).
    Here we are now using most of the LATB associated pins. Also included is a photo
    of the new assembly below.


    ![](img/a9229e7b0ddd9608f171b22b52514f39_55_1.png)'
  - '[PAGE 56]


    ![](img/a9229e7b0ddd9608f171b22b52514f39_56_0.png)


    Figure 2-16: Experiment 2 Schematic


    The objective here is to blink all the LEDs. We will use a binary counter. With
    a binary counter each successive LED in the LATB port will blink at a rate twice
    as less as the previous LED. Besides the hardware addition very little change
    needs to happen in software or the MPLAB workspace settings to make this happen.


    First let''s modify example 1 by replacing the existing source code file with
    a new source code file. The Figure 2-17 shows this process in five steps.'
  - '[PAGE 57]


    ![](img/a9229e7b0ddd9608f171b22b52514f39_57_0.png)


    No source code present


    ![](img/a9229e7b0ddd9608f171b22b52514f39_57_1.png)


    Figure 2-17: Changing Source Code for Experiment2


    Once the new source code is in place, do a build. There should be no compile errors.
    Let''s examine the code changes before executing. Again you have the option of
    simulating, but it is really not necessary. Experiment 2 is a modification of
    experiment1. Rather than simply toggling a LED (RB5 of LATB), we increment the
    entire LATB and display each available pin as a digital out. To achieve this we
    set up a new integer variable display. We then increment this display with each
    cycle through the continuous loop and then output the entire display value to
    LATB. Note that TRISD in initialization set all LATB pins to output.


    We have available to us 11 LEDs on PORTB starting with RB5 to RB15 and designated
    as the ''user LED''). To increment we do so with a value of 0x2f. This treats
    RB5 as the least significant bit in our binary counter.'
