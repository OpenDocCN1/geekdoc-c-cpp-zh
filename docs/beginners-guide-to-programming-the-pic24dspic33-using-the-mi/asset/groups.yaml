  - '[PAGE 149]


    Let''s take a closer look at the SPI interface. It requires three signals: SDO
    (serial data out), SDI (serial data in), and SCLK serial clock. The SPI is typically
    used between a pair of communicating entities. The SDO of one entity is connected
    to the SDI of the other. The clock originates at the “Master” side, the entity
    that initiates and sustains communications. The “Slave” communication is in response
    to the Master (see Figure 8-2). There is no protocol only data movement. Both
    sides function as shift registers where the common clock is used to shift data
    from one transmitting register (SPI BUF) into the receiving register (SPI BUF).
    Optionally a fourth signal can also be used: CS or chip select. This signal is
    used to enable slave peripheral for communications and can be duplicated to allow
    the SPI communication interface to be shared between one master and many slaves
    (however, only one slave at a time). In summary:


    +   - Simple interface

    +   - Uses 3 to four signals

    +     - CS, SDO, SDI, CLK

    +   - Based upon a shift register concept

    +   - Very high speed ( up to 20MHZ with PIC24H)

    +   - Robust and very noise immune


    ![](img/a9229e7b0ddd9608f171b22b52514f39_149_0.png)


