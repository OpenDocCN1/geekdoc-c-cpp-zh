    ## Demos That Come with PIC24F


    The Experimenter comes with a P24FJ64GA002 that is preprogrammed with the following
    built-in demos. The demos were written using Microchip’s free MPLAB and PIC24
    C code. The PIC24 C Compiler, MPLAB C30 v3.11b (or later), Student Edition, is
