    \ mode ...\n_FOSC(FCKSM_CSDCMD & OSCIOFCN_ON & FCKSM_NONE); // use OSCIO pin for\
    \ RA...\n_FWDT(FWDTEN_OFF);                      // turn off watchdog\n#define\
    \ lend 25 //delay loop is lend times lend instruction cycles\nint display\nvoid\
    \ delay(void)  // 100 msec\n{\n    int i,j;\n    for(i=0;i<...;i++)\n        for(j=0;j<lend;j++);\n\
    }\nint main (void)\n{\n    /* Initialize ports */\n    AD1PCFG = 0xFFFF;   //\
    \ set all pins that ... and make them digital\n    LATB = 0x0000;      // set\
    \ latch level for PORTB\n    TRISB = 0x0000;     // set RB as outputs for PORTB\n\
    \    while(1)\n    {\n        delay();\n        display = display + 0x002f;\n\
    \        LATB = display;\n    }\n```\n\nFigure 2-18: Experiment 2 Code\n\nMake\
    \ the project, program the Microchip and then watch the binary counting light\
    \ show. Any problems at this point must be attributed to hardware so double check\
    \ with the provided schematic and assembly photos.\n\n# The 16 Bit Micro Experimenter\
    \ (optional)\n\nThis is the LED experiment for the 16 bit Micro Experimenter.\
    \ This operates in an identical fashion to Experimenter 1 in this chapter and\
    \ in fact uses the same source code. You need to build the code and uses either\
    \ PICKIT2/3 as debugger/programmer. The Experimenter can be used with or without\
    \ an external power supply if the PICKIT2 is used (the PICKIT2 senses power and\
    \ automatically supplies power if not sensed). In addition the Experimenter needs\
    \ an external LED with series resistor to be added to J3 PIN3 (see hookup diagram)."
