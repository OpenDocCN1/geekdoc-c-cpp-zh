    \ 的 PPS 功能是什么？如何使用？\n7. 微控制器的配置字是什么意思？如何使用？如何设置？\n\n## 8. 探索 MPLAB\na. 打开演示项目\
    \ FLASH_LED\nb. 关闭所有窗口\n   i. 关闭项目视图\n   ii. 关闭源代码视图\n   iii. 关闭输出窗口\nc. 打开所有窗口（仅应存在基本的\
    \ IDE 面板和工具栏）\n   i. 在 IDE 面板上选择 view 并从下拉菜单中选择 project——项目窗口应打开且项目树可见\n   ii.\
    \ 双击 FLASH_LED.c（这是主函数）——源代码应打开且源代码可见。使用编辑工具查找 Main 函数。\n   iii. 在工具栏上单击构建按钮——注意输出窗口中的构建选项卡会自动打开并显示构建结果。\n\
    \   iv. 连接 Microstick II 并注意输出窗口。它会从构建选项卡切换到调试选项卡并自动识别连接。\n   v. 单击运行，然后暂停，然后单步执行并跟随源窗口中的绿色箭头，指示执行停止的位置以及下一行代码的执行位置。现在按下复位并注意箭头位置，按下单步执行并注意绿色箭头现在位于源代码的开头。单击运行，Microstick\
    \ II 应闪烁用户 LED。\n\n## 第 2 章 – 驱动 LED\n\n在本章中，我们将为 LED 开发原型硬件和软件。我们将使用第 1 章中创建的已安装开发系统。对于我们的第一个实验，我们将首先只使用一个\
    \ LED。这让人想起 'C' 程序 \"Hello World!\"。在这里，程序员努力编写他们的第一个应用程序，将 hello world 消息输出到控制台。我们的微控制器没有控制台——所以我们只能将闪烁\
    \ LED 作为一种 \"Hello World\"。在这里，我们将逐步进行硬件和软件构建，并使用仿真进行软件调试，最后使用 Microstick II 进行硬件调试。在第二个练习中，我们通过将\
    \ LED 数量增加到十个来扩展硬件原型功能，并增强软件以执行二进制计数显示。\n\n## 实验 1- 硬件\n\nPIC24H 具有用户可编程引脚。这些引脚可配置为数字输入、数字输出、模拟，或分配为特定外设输入/输出。框图（见图\
    \ 2-1）突出了单个 PIC24H 引脚的内部组织，以展示其工作原理。该图仅描述了引脚的外设和数字功能，未显示模拟功能。\n\n![](img/a9229e7b0ddd9608f171b22b52514f39_40_0.png)\n\
    \n引脚的输出可以来自外设侧或数字侧。两者都有各自独立的数据路径和使能信号，通过输出多路复用器决定哪一侧成为引脚的输出。必须启用外设才能使用其输出。要启用引脚的数字输出，必须清除该引脚的\
    \ TRIS 信号。同一时间只能有一侧（外设或数字）输出，如果两者都启用，则优先级更高的外设获胜！在输入侧不存在多路复用器，因此输入信号连接到两侧。本章我们仅使用数字输出。\n\
    \n每个引脚都有一个对应的 TRIS 控制位来设置引脚的数字方向。零使引脚成为输出；一使引脚成为输入。每个引脚还具有一个 PORT 位，允许读取或写入该引脚。对于我们的\
    \ PIC24H 器件，我们有两个 PORT 寄存器 PORTA 和 PORTB，两者均为 16 位宽。然而，由于 28 引脚 DIP 封装尺寸，并非所有这些\
    \ PORT 位都可用作引脚。\n\nPORTA 允许对引脚 RA0、RA1、RA3、RA4 进行读写，这些引脚对应于 PORTA 的位 0、1、3、4（其余位未分配）。\n\
    \nPORTB 允许对引脚 RB0、RB1、RB2、RB3、RB4、RB5、RB6、RB7、RB8、RB9、RB10、RB11、RB12、RB13、RB14、RB15\
    \ 进行读写，每个引脚都对应寄存器中的一个位位置。\n\n如前所述，每个 PORT 都有一个 TRIS。因此该器件中具有 TRISA 和 TRISB。PORT\
    \ 和 TRIS 在 PIC24H 中都存在为“特殊功能寄存器”或简称为 SFR。它们是 PIC24H 中专用于数字引脚操作的 RAM 内存位置。PORT\
    \ 中的引脚位位置与其 TRIS 中的相同。例如，如果 RB2 要作为输出，则将 TRISB 寄存器中的位位置 2 写入零，然后通过向 PORTB 中对应的位位置写入一（+3.3VDC\
    \ 输出）或零（接地）来设置该引脚的输出值。\n\n还有一个用于数字 I/O 的第三个 SFR，称为 LAT 或锁存器。它的工作方式与 PORT 类似，不过使用\
    \ LAT 我们可以锁存输出或输入，而不是直接使用 PORT 进行读写。我们同时具有 LATA 和 LATB，两者均为 16 位。在 C 代码中访问特殊功能寄存器（如\
    \ TRIS、PORT 和 LAT）有多种软件技术，我们在讨论软件时将进一步讨论。\n\n对于实验 1，我们希望将单个 LED 连接到 PORTB 的位 5\
    \ 或 RB5，并将 RB5 设置为数字输出。RB5 在 PIC24HJ128GP502 上是引脚号 14。该器件为 28 引脚 DIP，因此芯片每侧有 14\
    \ 个引脚。俯视芯片时，封装上有一个缺口表示引脚 1，所有引脚编号为 1 到 28，并在器件上逆时针排列。这将使引脚 14 或 RB5 成为芯片右下方的最后一个引脚。\n\
    \n实验 1 的原理图如下所示。PIC24H 数字输出可在数字输出上驱动高达 25 毫安的电流。我们不需要这么大的电流来点亮 LED（3 毫安已经足够），因此我们在\
    \ LED 串联使用限流电阻（1K）。电路基本上是一个串联电路，其中 RB5 连接到电阻的一侧，电阻的另一侧连接到 LED 的阳极，最后 LED 的阴极连接到地。这样，当我们使\
    \ RB5 = 1 时，LED 会亮起，如果我们使 RB5 = 0，LED 会熄灭。确保原型电路的地电位与 Microstick II 使用的同一地参考相同，因此将无焊面包板的地连接到\
    \ Microstick II 的引脚 8。\n\n组装好的电路如图 2-3 所示。请注意，地是从引脚 8 取出并连接到原型板上的公共地总线。同一地用于 LED\
    \ 阴极。LED 阴极必须接地才能工作。你需要能够区分 LED 的阳极和阴极，以便正确连接。阴极通常是器件上较短的引线，也由器件上的平面边缘标记。\n\n\
    ![](img/a9229e7b0ddd9608f171b22b52514f39_42_0.png)\n"
