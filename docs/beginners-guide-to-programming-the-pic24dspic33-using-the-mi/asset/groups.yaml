    it is also extremely compact, ultra-flat, and also supports a "DIP-like" pinout,
    making it ideal for breadboard prototyping.


    ![](img/a9229e7b0ddd9608f171b22b52514f39_97_0.png)


    ![](img/a9229e7b0ddd9608f171b22b52514f39_97_1.png)


    Figure 5-1 EA DOGM LCD Display


    The LCD display interface is a 4-bit data and 2-bit command digital interface.
    The 4-bit interface is optional to the normal 8-bit interface, and requires two
    4-bit nibble writes rather than one byte write to the LCD. This interface is selected
    to simplify prototype wiring and pin requirements with the Microstick II. Another
    simplification is to not have the Microstick II read from the LCD but only to
    write to it. To facilitate this, the LCD library forces the Microstick II''s PIC24H
    to delay between its command/data transactions with the LCD controller with enough
    time to allow the LCD time to respond without having to read and check its busy
    status.


    A schematic that illustrates the Microstick II connection to the LCD is shown
    in Figure 5-2.


    ![](img/a9229e7b0ddd9608f171b22b52514f39_98_0.png)


    Figure 5-2: LCD and Microstick II Schematic


    Note that a separate +3.3VDC supply is required to drive the LCD since the Microstick
    II itself does not supply external power. Another option for +3.3VDC is to connect
    to the TP1 via on the Microstick II, since the LCD has a very small current need.
    The ground connection between the LCD and Microchip must be common and connected
    to pin 8 as shown.


    The LCD does require the use of separate electronic components for its operation.
    Both 2.2uF and .22uF capacitors (C3, C2) are needed (see Figure 5-2) for contrast
    control and internal voltage regulation on the LCD. Note that the 2.2uF is polarized
    – so follow those markings, ensuring the positive side is connected to pins 25
    and 26.


    The LCD pin arrangement, as indicated earlier, is configured as a 40-pin DIP (with
    most of the bottom row pins missing). As you look at the display from its top,
    the bottom left hand side pin is pin 1, and the bottom right is pin 20. The top
    row of pins, from left to right are pins 40 to 21. Please follow along with all
    the connections shown in the schematic and do a visual comparison with the picture
    of the prototype. Also note that the Electronic Assembly LCD display comes packaged
    with a protective film on the display side. This should be removed (peeled off)
    for unobstructed viewing.


    In summary, the LCD 4-bit parallel data interface to Microstick II is as follows:


    - LCD D7 to Microstick II pin RA3

    - LCD D6 to Microstick II pin RB2

    - LCD D5 to Microstick II pin RA1

    - LCD D4 to Microstick II pin RA0


    The command interface is facilitated with two command lines:


    - LCD command/data control RS to Microstick II pin RB10

    - LCD strobe in E to Microstick II pin RB11


    ![](img/a9229e7b0ddd9608f171b22b52514f39_99_0.png)


    Figure 5-3: LCD prototype


    ### Software Library Description


    So much for hardware, now here''s the fun part. Let''s learn the software functions
    for driving the LCD and how to use them. Here are the five we will be working
    with. Their titles pretty much capture what they do. Remember the LCD only accepts
    ASCII characters for data. The LCD, as mentioned earlier, is organized as a display
    with 0-47 (48) character positions or similarly a 16x3 display matrix. Again,
    this refers to 16 columns by 3 rows. The first row contains positions 0-15, the
    second 16-31, the third 32-47. The library allows complete freedom to position
    a character anywhere in the display matrix. It also auto-increments the character
    position when you are writing one character after another (like a string) at a
    time.

