    A more elaborate light show demo using the 16 Bit experimenter LCD library and
    J3 I/O Expansion is shown in Figure 2-20. Use LIGHTSHOWDEMO project in Chapter2
    source code. The Demo configures pins 1-8 of J3 I/O expansion bus as digital outputs
    where only one of the eight outputs is a high level at a time in rapid succession
    in random. To actually see the demo you must add eight LED''s and eight current
    limiting resistors (330 ohms each) to the I/O bus pin as shown. Each pin will
    have a 330 ohm resistor in series with an LED where the LED cathode is tied to
    ground. Enjoy the show!'
