    interrupt controller, and finally you must have a specific function call, which
    is designated the interrupt service routine, that will be invoked and executed
    once the interrupt occurs. There are some more details about specifics of the
    service routine, its construction, and what it minimally must do. We will cover
    this shortly.


    Once a timer interrupt condition occurs, the current state (program counter, status
    registers, and flags) of the CPU is saved or "pushed" onto a stack (first in first
    out ram buffer internal to the PIC24H). The timer interrupt service is then invoked
    for CPU execution to handle the timer interrupt condition. Once the CPU exits
    the service routine, the CPU state prior to the interrupt is restored or "popped"
    from the stack. The CPU then resumes its normal operations. It in a sense interrupts
    to allow for an "on demand" peripheral processing service.


    # Hardware description


    We have seen this specific hardware setup in Chapter 2, here we will use it again.
    It is the familiar blinking LED prototype, but in this experiment the software
    is entirely new. We will be using entire new techniques with the timer. The same
    software I/O setup will be common in all the experiments. In these experiments
    we want to connect a single LED to bit 5 of PORTB or RB5 and set RB5 to be a digital
    output.


    RB5 is pin number 14 on the PIC24HJ128GP502. The device is a 28 pin DIP, so there
    are 14 pins on each side of the chip. Looking down on the chip there is a notch
    in the package to indicate pin 1, all the pins are numbered 1 to 28 and go counter
    clockwise on the device. This would make pin 14 or RB5 the last pin on the bottom
    right hand side of the chip.


    A schematic is shown in Figure 6-2. The PIC2H digital output can drive up to 25
    milliamps on a digital output. We don''t need all this current to turn on a LED
    (3 milliamps is more than enough), so we use a current limiting resistor (1K)
    in series with the LED. The circuit basically a series circuit where RB5 tied
    to one side of the resistor, the other side of the resistor is connected to LED
    anode, and finally the LED cathode is tied to ground. In this way when we make
    RB5 =1 the LED will light up, if we make RB5 =0 the LED will turn off.'
