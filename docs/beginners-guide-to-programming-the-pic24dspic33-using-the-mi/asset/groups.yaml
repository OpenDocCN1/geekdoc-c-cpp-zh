  mdcn: "\n## 16 位微实验器（可选）\n\n这是一个针对 16 位微实验器的定时器实验。它的操作方式与本章节中的实验 1 和实验 2 完全相同，实际上使用了相同的源代码。你需要构建代码，并使用\
    \ PICKIT2/3 作为调试器/编程器。如果使用 PICKIT2，实验器可以在使用或不使用外部电源的情况下工作（PICKIT2 会感应电源，如果检测不到电源，会自动供电）。此外，实验器需要将一个带有串联电阻的外部\
    \ LED 连接到 J3 的 PIN3（参见接线图）。\n\n![](img/a9229e7b0ddd9608f171b22b52514f39_123_0.png)\n\
    \n### PIC24H 定时器能力概述：\n\n-   五个 16 位通用定时器/计数器\n  - 所有 5 个定时器功能相似\n  - 每个都有周期寄存器\n\
    \  - 与周期匹配时产生中断\n  - 匹配时复位\n-   其中四个定时器（定时器 2+3 和 4+5）可以组成两个 32 位定时器/计数器\n-  \
    \ 在 32 位操作中：定时器 2+3 或定时器 4+5 分别作为最低有效字和最高有效字\n\n## 第 7 章 – 串行通信\n\n在本章中，我们将介绍使用\
    \ UART（通用异步收发器）进行 RS-232 和 USB 应用的串行通信。我们将使用 PIC24H 的可配置外设引脚分配系统（称为外设引脚选择，PPS）来应用\
    \ PIC24H UART 外设。让我们首先讨论串行通信。\n\n### 串行通信概述\n\n串行通信通过每次一位地发送和接收数据字节来实现。传输的位不仅包含完整的数据字节，还包括用于起始、停止和错误检查的帧位。这种通信类型可能是微控制器使用的最古老的通信方式之一，至今仍被广泛应用。串行通信可应用于微控制器之间、微控制器与\
    \ PC 或显示器之间，甚至无线收发器之间。\n\nPIC24H 有两个完全独立的 UART：UART1 和 UART2。在我们的实验中，我们将使用 PIC24H\
    \ 的 UART2 与 PC 通信。每个 UART 外设都有独立的发送和接收硬件。发送部分从 PIC24H CPU 接收并行数据（字节），并以固定的比特率或波特率逐位串行发送出去。这样，发送硬件充当\
    \ PISO（并行输入串行输出）数字寄存器。接收硬件接收串行数据，并形成并行数据（字节）以供 PIC24H CPU 取用。接收部分充当 SIPO（串行输入并行输出）数字寄存器。完整的\
    \ UART 外设不仅包含这些功能，还包含内部位时钟发生器、帧逻辑和数据缓冲区，这些都是在两个设备之间进行串行数据传输所必需的，无论这两个设备之间是否使用共享时钟。\n\
    \n当不使用共享时钟时，我们将采用一种称为“异步”的串行通信方式。如果使用共享时钟，则通信称为同步通信。异步通信能够工作的原理是，通信系统中的每个 UART\
    \ 都预先配置了相同的比特率时钟或波特率时钟。在 PIC24H 中，波特率时钟由内部时钟源产生。在系统通信期间，发送方向接收方发出有字节要传输的提示。它通过将串行数据线拉低一个位时间来实现这一点（这被称为起始位）。接收方将其内部波特率发生器与起始位同步，以开始接收数据。随后，构成数据字节的\
    \ 8 个数据位从发送方逐位传送到接收方。\n\n除了 8 个数据位之外，还可以发送纠错位或校验位（可选）。通信的最后一部分是停止位，即在校验位之后，串行通信线路保持高电平一个或两个位时间（长度也是可选的）。请参见下面的图\
    \ 7-1。\n\n注意，要使此通信正常工作，每个发送器输出线必须直接连接到接收器输入线。具体来说，一方的发送器必须连接到另一方的接收器，而另一方的发送器必须连接到一方的接收器（如果需要在两个方向上进行通信）。\n\
    \n当只允许一个 UART 在某一时刻传输数据时，这种通信被称为“半双工”。然而，当配置允许两个 UART 同时传输数据时，这种通信被称为“全双工”。\n\n\
    ### 串行通信\n\n![](img/a9229e7b0ddd9608f171b22b52514f39_127_0.png)\n\n图 7-1 UART\
    \ 半异步通信\n\nUART 自然地扩展到无线和有线通信。图 7-2 显示了 UART 在无线应用中的示例。无线发射器通常共享相同的载波频率，这迫使通信采用半双工模式（一次只能有一个发射器开启）。这确保了通信避免数据冲突。通信协调通常借助驻留在该“底层”数据链路上的“高层”软件协议来完成，以确定谁可以在何时发送数据。\n\
    \n### 串行无线通信\n\n![](img/a9229e7b0ddd9608f171b22b52514f39_128_0.png)\n\n始终为半双工通信\n\
    \n图 7-2：串行无线通信示例\n\n### RS-232 和 RS-485 行业标准串行通信\n\n有几种用于连接具有 UART 的设备的传统行业标准。其中一种用于点对点通信的标准是\
    \ RS-232。该标准规定了连接器类型、波特率、引脚排列和电压电平。RS-232 规定，PIC24H UART 输出的 +3.3V 至 0V 电压电平必须转换为\
    \ -12V 至 +12V 才能符合标准。这意味着需要电平转换电子器件。RS-232 标准还使用一组常见的 9 针公头和母头连接器对。对于 RS-232，通信的一方必须配置为\
    \ DCE（数据通信设备），另一方配置为 DTE（数据终端设备）。这种划分确定了每一方的发送/接收引脚排列和连接器类型。PC 预配置为 DTE。这迫使 PIC24H\
    \ 或 Microstick II 成为 DCE。\n\n图 7-3 显示了使用 RS-232 将 Microstick II 连接到 PC 的完整端到端接线图。PC\
    \ 上运行一个名为 HyperTerminal（超级终端）的软件应用程序，它可以将串行数据通信流显示在 PC 屏幕上。我们的实验中将需要这个软件。Microstick\
    \ II 需要电平转换硬件和一个 RS-232 DCE 连接器。我们将使用一个 ACRONAME 模块；它把这两者都集成在一块方便的可插拔电路板上。然后我们将一根标准的\
    \ DCE 转 DTE RS-232 电缆与 PC 连接起来，以便进行调试。最后需要说明的是，通信的数据速率和串行格式需要设置。这对 PIC24H UART\
    \ 初始化和 HyperTerminal 配置都很重要。需要考虑的因素包括波特率、停止位数、数据位大小、是否使用校验位，以及是否使用硬件握手。就我们的目的而言，我们将使用\
    \ 1200 波特、8 位数据、无校验、1 位停止位且无硬件握手。其简写表示法为 1200-8-N-1。\n\n![](img/a9229e7b0ddd9608f171b22b52514f39_129_0.png)\n\
    \n### 美国信息交换标准码（ASCII）\n\n实际上，用户可以选择传输任何类型的数字字节，但超级终端只能显示 ASCII（美国信息交换标准码）格式的数据。图\
    \ 7-4 显示了一个表格。该表格包含 128 个不同的字符，包括控制字符、数据字符（大写/小写 A-Z）、数字（0-9）、特殊字符（如引号、感叹号、问号和井号）。在我们的串行通信实验中，我们将使用\
    \ ASCII 数据编码。\n\n"
