    # Experiment 2 - The Software


    Ok, the hardware is in place, lets discuss the software. Navigate to Chapter 3
    code folder open exercise #2 folders, and then double click the MPLAB project
    icon Flash_LED.MCP.


    The application again uses a single C source file (main_led.c), as in exercise
    1, that is a main function that references generic PIC24H headers/peripherals
    use (#include "pic24Hxxxx.h"). This header will determine the specific PIC24H
    processor in use. The processor configuration is set using predefined C library
    macros (also referenced in the header file). These settings are internal CPU clock
    selection of 8Mhz, no external oscillator, no clock switch over, no watchdog operation,
    and finally use of RA3 as a digital/analog pin versus an external crystal pin
    input.


    A define statement is used to label the switch SW as PORTBbits.RB3. This is the
    input pin connected to the pushbutton. Other defines are associated with limits
    used in the delay function. Again we use the delay function and it will be instrumental
    in debouncing the pushbutton.


    In the main function the application executes I/O initialization. We initially
    set all pins from analog to digital setting AD1PCFGL to all ones. We clear LATB
    and initially set all of PORTB pins to digital out. Remember that RB5, RB6, RB7,
    RB8, RB9 are tied to LEDs and will represent our binary counter. We then set TRISbits.TRISB3
    =1 to enable RB3 as an input. The other final setting is _CN7PUE =1 to set the
    corresponding weak pull up for RB3 input.


    The main code then proceeds to enter a continuous loop testing whether pin 7 RB3
    (SW) is low representing a pushbutton depression. If low we delay and increment
    a debounce counter. If the SW is still low after 3 counts we interpret this as
    a final stable pushbutton depression and then perform the binary count. This binary
    count is then output to LATB to drive the LEDs. A flow diagram of this application
    is shown in Figure 3-11.


    The main continuous loop uses three nested decision constructs. The first IF statement
    tests the SW condition, the second nested IF ELSE tests the debounce count and
    then determines to increment the binary count or not. The third nested IF does
    a check on the incremented count and resets the count if it exceeds a maximum
    count of 1024. Note there is also a view count variable. This variable was set
    up for debugging using watch to test if the binary count was working. The actual
    counter "binarycount" increments by 0x2f (remember our LSB is RB5), and this seemed
    a little too confusing to watch directly.'
