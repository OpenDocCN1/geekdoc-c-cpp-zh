    \ 连接到电阻的一端，电阻的另一端连接到 LED 的阳极，最后将 LED 的阴极接地。这样，当我们将 RB5 = 1 时，LED 就会点亮；当我们将 RB5\
    \ = 0 时，LED 就会熄灭。\n\n"
