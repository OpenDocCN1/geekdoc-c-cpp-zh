  - '[PAGE 29]


    <!-- no content -->'
  - '[PAGE 30]


    As a final note with the PIC24H, you not only program its flash memory with object
    code, but you also program its configuration setting by programming its internal
    "configuration word". The configuration word setting can be set using the MPLAB
    GUI or integrated in the source code as complier directives. The configuration
    word itself resides in flash memory but it is a reserved location and not considered
    as part of the code area. The configuration word controls clock settings as to
    what clock source (i.e. external clock, internal clock, clock type), or whether
    or not the device is being programmed in debug mode or whether the device is configured
    for final release mode (program mode). The configuration word also sets which
    pins are used for ICSP and finally use of watchdog timer. We will cover more of
    these specific details in the chapters to follow, but for the demo LED_FLASH covered
    in this chapter the specific configuration was set to disable the external oscillator,
    use the internal 8MHz oscillator resident in the PIC24H, select pins 14 and 15
    of the PIC24HJ128GP502 as ICSP data and clock, and disable the watchdog timer.


    # Microstick II Hardware Description


    Let''s now get into the Microstick II operational details. To reiterate, the Microstick
    II is designed to provide users with an easy to use, economical programmer/debugger
    for 16-bit Digital Signal Controllers and Microcontrollers and is fully integrated
    with Microchip''s MPLAB Integrated Development Environment.


    Microstick II supports all the essential features for programming/debugging. It
    can be used stand-alone or plugged into a prototyping board. Once you are satisfied
    with your design and feel that all the bugs are fixed, you take it the microcontroller
    out of debug mode, and then program the device for standalone operation (release
    mode). In release mode MPLAB is no longer required. The only requirement here
    is to retain the USB connection to the Microstick II to retain power to the microcontroller.


    A final option is to remove the microcontroller from the Microstick II and plug
    the microcontroller directly into the prototype without the Microstick II. For
    this you need to furnish your standalone microcontroller with its own power, ground,
    and Master Clear. We will cover this process in the some of the chapters to follow.


    Let''s discuss the detailed operation of the Microstick II hardware starting with
    a block diagram of the device (see Figure 1-15).'
