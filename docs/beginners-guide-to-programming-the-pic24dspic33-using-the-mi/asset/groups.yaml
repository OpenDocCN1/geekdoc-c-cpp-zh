    # Experiment 1- Hardware


    As discussed in Chapter 2 PIC24H has user programmable pins. These pins can be
    configured as digital inputs, digital outputs, analog, or assigned as specific
    peripheral.


    In this chapter we leverage the knowledge we gained in chapter 2 and now use digital
    input. As you may recall every pin has a corresponding TRIS control bit to set
    the digital direction of the pin. A zero makes the pin an output; a one makes
    the pin an input. Each pin also has a PORT bit that allows reading or writing
    to the pin and a LAT that works in a similar way to PORT, however with LAT we
    can latch output or input rather than directly reading or writing using PORT.
    The LAT, PORT, and TRIS are special function registers or SFR. All these registers
    are 16 bits but with the reduced package 28 pin "skinny" DIP like the one are
    using with the Microstick II, not all of this SFR bits are used.


    There are a number of software techniques to access special function registers,
    like TRIS, PORT, and LAT in C code, we covered this in Chapter 2 and we will continue
    to expand on this some more when we talk about the software here. For experiment
    1 we connect a single LED to bit 5 of PORTB or RB5 (pin 14 of PIC24H) and then
    set RB5 to be a digital output to drive a LED through a current limiting resistor.
    A pushbutton is connected to RB3 or pin 7 of the PIC24H. This pin will be set
    to be a digital input.


    Let''s briefly discuss how the switch is connected. The switch is a mini-tactile
    pushbutton. It is called a SPST (single pole single throw) switch. The contacts
    are showed as normally open with no electrical conduction through the switch.
    As you press the push button, contact is made across the switch. In using this
    switch we connect one end to ground and the other end to the RB3 digital input.
    When the switch is depressed the input will read ground or zero condition.'
