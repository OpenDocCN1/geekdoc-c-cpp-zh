    the LCD and pushbuttons. To operate these you must first call library function
    RTCCInit (). The two functions we will discuss use the RTCC library but reside
    outside of it in the MAIN.C.


    +   - Set_ALARM (alarm) – this function initializes the alarm functions of the
    RTCC and sets the alarm (for the data logger we referred to this as rate) base
    on the value passed as alarm. It is called during the rate setting menu. It sets
    as follows:

    +     - if (alarm =0) then alarm every 10 seconds

    +     - if (alarm =1) then alarm every minute

    +     - if (alarm =2) then alarm every 10 minutes

    +     - if (alarm =3) then alarm every hour

    +     - if (alarm =4) then alarm every day

    +     - if (alarm =5) then alarm every week

    +     - if (alarm =6) then alarm every month

    +     - if (alarm =7) then alarm every year


    Once the alarm is set this function will then enable the RTCC to interrupt the
    PIC24H when the alarm condition occurs. The RTCC interrupt service then can perform
    whatever function required for the alarm application. Code snippets for set alarm
    and RTCC interrupt are shown in Figures 10-5 and 10-6. Note in the interrupt that
    there is a comment for you to add your own code for whatever function you want
    to perform as a result of alarm condition (the default is toggling the LED).


    +   - clock_Setup () –This routine displays current RTCC time setting in ASCII
    on the display and allows the operator to accept or make changes to RTCC using
    the display and pushbuttons.

    +     - Button SW1 -toggles between clock set mode and clock accept mode. Hitting
    the SW1 twice in accept mode exits the function with RTCC set to the displayed
    time.

    +     - Button SW2 -if in clock setting mode increments current data field

    +     - Button SW3 -if in clock setting mode decrements current data field

    +     - Button SW4 -advance to next allowable data field


    # Clock and Alarm Experiment


    This experiment uses the RTCC library and clock_Setup () and set_alarm () functions
    as part of main. The Experimenter essentially performs the clock demo'
  md: "\n![](img/a9229e7b0ddd9608f171b22b52514f39_159_0.png)\n\nFigure 8-16: Experimenter\
    \ EEPROMDEMO Flowcharts\n\nTo gain better understandings examine the EEPROMDEMO\
    \ code shown below and some of the Experimenter displays that occur as part of\
    \ your EEPROMDEMO operation. This program structure of updating the LCD display\
    \ with live data can be an important part for any of your future Experimenter\
    \ applications.\n\nEEPROM DEMO MAIN Code (code screenshot)\n\n![](img/a9229e7b0ddd9608f171b22b52514f39_160_0.png)\n\
    \n### EEPROM DEMO MAIN Code\n\n### Experimenter Display\n\nFigure 8-17: Experimenter\
    \ EEPROM DEMO main code and results\n\n### Review of SPI Key features:\n\n- Supports\
    \ four wires SDO, SDI, SCLK, /CS\n- Data can move in both directions simultaneously\n\
    - Master supplies Clock and initiates data transfer\n- Simple synchronous interface\
    \ used extensively in microcontroller peripheral communications\n- Capable of\
    \ high speed transfers (clock rate dependent)\n- SPI Peripheral functions as a\
    \ digital shift register\n\n### Review of EEPROM Key Features:\n\n- EEPROM retains\
    \ memory content when power is off\n- Use in setting passwords, access code, and\
    \ calibration data\n\n### Review of PIC24H SPI Key Features:\n\n- PIC24H has two\
    \ available SPI peripherals #1 and #2\n- PPS is used to configure programmable\
    \ pins for SPI interface\n- SPI is programmed through the bit setting in two SFR\
    \ registers SPI2CON1 and SPI2STAT\n\n![](img/a9229e7b0ddd9608f171b22b52514f39_163_0.png)\n\
    \nFigure 9-1: Output Compare Peripheral\n\nThe OCx module can use either the PIC24HJ64GP502\
    \ 16 bit Timer 2 (TMR2) or Timer3 (TMR3) as a time base, and the period setting\
    \ for the output pulse waveform. PR2 is the period setting for Timer 2 and PR3\
    \ is the period setting for Timer 3. In our examples we will use Timer 2. The\
    \ OCxRS and OCxR registers are loaded with a 16 bit value to control the width\
    \ of the pulse generated during the output period. This value is compared against\
    \ the Timer during each period cycle. The OCx output starts high and then when\
    \ a match occurs OCx logic will generate a low on output. This will be repeated\
    \ on a cycle by cycle basis (See Figure 9-2).\n\nThis is OCx Pulse Width Modulation\
    \ (PWM) mode. An important notion in thinking about PWM is that it allows dynamic\
    \ changing of the DC voltage level to a load. Wait a minute you say --- where's\
    \ the DC voltage here? Think of the DC voltage as an average voltage value of\
    \ the pulsed DC across the waveform period. For example, if we have pulse high\
    \ for 50% of the period consistently, and the pulses are +3.3V then we are supplying\
    \ on the average 50% of 3.3V to the load or 1.65V. In order to change the pulse\
    \ width while the system is running we simply write into OCxRS and it automatically\
    \ loads into OCxR on the next cycle.\n\n- void turnon (int setting) - turn on\
    \ RB2 pin output, Timer2 clock and the PWM OC1 configuration on this pin. The\
    \ period of Timer2 is preset to 0x7FF the max value of the 12 bit ADC. Setting\
    \ is any value set by the pot ADC between 0-0x7FF that adjusts the PWM duty cycle.\
    \ If setting is 0 then duty cycle is zero, if setting is 0x3FF then duty cycle\
    \ is 50%, if setting is 0x7FF then duty cycle is 100%\n- void setPWM (int setting)\
    \ - This performs the same function of running turnoff (void) and turnon (int\
    \ setting) with one call. This turns PWM off first before setting it.\n\nThere\
    \ are also several ADC functions that we will use. These functions were introduced\
    \ in Chapter 4 and are in the ADC library. If you need to, please review chapter\
    \ 4 to gain an understanding of ADC.\n\n- void initADC (int ANpin) – this function\
    \ initializes the ADC for 12 bit manual conversion using the \"ANpin\" as the\
    \ single input pin. ANpin possible settings are AN0, AN1, AN4, AN5, AN9, AN10,\
    \ AN11, and AN12. In this experiment we will use AN0.\n- int readADC (int ANpin)\
    \ – this function forces a manual ADC conversion on the designated ANpin, again\
    \ we will use AN0.\n\nThe hook-up schematic is shown in Figure 9-4. A 10K pot,\
    \ LED, 1K resistor and external +3.3V supply is needed for the other side of the\
    \ 10K. Assure that all grounds between Microstick II and external components are\
    \ common. Build up the prototype per the schematic and the prototype is shown\
    \ in Figure 9-5 to assist you.\n\n![](img/a9229e7b0ddd9608f171b22b52514f39_166_0.png)\n\
    \nFigure 9-4: Schematic LED Dimmer\n\n## Running the Experiment\n\nWe have covered\
    \ both the hardware and software so you are ready to run the prototype. Connect\
    \ to the USB port of the PC. Connect your external +3.3V supply for use with the\
    \ pot. Make sure the pot and LED circuit grounds are common with the Microstick\
    \ II ground. Open chapter 9 folder to PWM.MCP. Open workspace by double-clicking\
    \ the icon and do a build and download.\n\nRun the program and as you turn the\
    \ pot either clockwise or counter clockwise you should see the LED change brightness.\
    \ If this does not occur please refer to schematic and prototype picture as you\
    \ have a wiring error.\n\n## 16 Bit Micro Experimenter (optional)\n\nThis is PWM\
    \ experiment for the 16 bit Micro Experimenter. This operates in an identical\
    \ fashion to Experiment 1 and 2 in this chapter and in fact uses similar source\
    \ code modified for a different pin set on J3 I/O connector. Use source code PWMDEMO\
    \ Experimenter. You need to build the code and use either PICKIT2/3 as debugger/programmer.\
    \ The Experimenter can be used with or without an external power supply if the\
    \ PICKIT2 is used (the PICKIT2 senses power and automatically supplies power if\
    \ not sensed). In addition the Experimenter needs an external LED with series\
    \ resistor and 10K to be added to J3 (see hookup diagram).\n\n## Exercises:\n\n\
    1. What does PWM stand for?\n2. How is it used?\n3. Run experiment 1 by turning\
    \ pot to both extreme. Capture those using watch.\n    Read and record values.\
    \ What are they? Where do they originate from?\n4. Describe an application that\
    \ can use PWM\n5. Configure exercise 1 to work with OC2 versus OC1\n    a) Change\
    \ PPS for OC2 pins\n    b) Rewrite Library for operation with OC2 SFR\n\n## Chapter\
    \ 10 – RTCC (Real Time Clock Calendar)\n\nIn this chapter we will exercise the\
    \ RTCC (Real Time Clock Calendar) peripheral on the PIC24H. The experiment is\
    \ recommended for use only with the 16 Bit Micro Experimenter (see appendix A),\
    \ because all necessary support hardware i.e. clock crystal, LCD, and four pushbuttons\
    \ are already in place.\n\n### The Real Time Clock Calendar\n\nWe have been talking\
    \ about the Experimenter's clock, so here it is. It is a Real-Time Clock and Calendar\
    \ (RTCC) function and is intended for applications where accurate time must be\
    \ maintained for extended periods of time with minimum to no intervention from\
    \ the CPU. The peripheral is optimized for low-power usage in order to provide\
    \ extended battery lifetime while keeping track of time. It features a 100-year\
    \ clock and calendar with automatic leap year detection. The range of the clock\
    \ is from 00:00:00 (midnight) on January 1, 2000 to 23:59:59 on December 31, 2099.\
    \ The hours are available in 24-hour (military time) format. The clock provides\
    \ a granularity of one second.\n\nThe RTCC internal register interface with the\
    \ PIC24H Microcontroller is implemented using the Binary Coded Decimal (BCD) format.\
    \ This simplifies the software, when reading and writing to the module, as each\
    \ of the digit values is contained within its own 4-bit value.\n\n![](img/a9229e7b0ddd9608f171b22b52514f39_174_0.png)\n\
    \nThe LCD and pushbuttons. To operate these you must first call library function\
    \ RTCCInit(). The two functions we will discuss use the RTCC library but reside\
    \ outside of it in the MAIN.C.\n\n- Set_ALARM(alarm) – this function initializes\
    \ the alarm functions of the RTCC and sets the alarm (for the data logger we referred\
    \ to this as rate) based on the value passed as alarm. It is called during the\
    \ rate setting menu. It sets as follows:\n    - if (alarm =0) then alarm every\
    \ 10 seconds\n    - if (alarm =1) then alarm every minute\n    - if (alarm =2)\
    \ then alarm every 10 minutes\n    - if (alarm =3) then alarm every hour\n   \
    \ - if (alarm =4) then alarm every day\n    - if (alarm =5) then alarm every week\n\
    \    - if (alarm =6) then alarm every month\n    - if (alarm =7) then alarm every\
    \ year\n\nOnce the alarm is set this function will then enable the RTCC to interrupt\
    \ the PIC24H when the alarm condition occurs. The RTCC interrupt service then\
    \ can perform whatever function required for the alarm application. Code snippets\
    \ for set alarm and RTCC interrupt are shown in Figures 10-5 and 10-6. Note in\
    \ the interrupt that there is a comment for you to add your own code for whatever\
    \ function you want to perform as a result of alarm condition (the default is\
    \ toggling the LED).\n\n- clock_Setup() – This routine displays current RTCC time\
    \ setting in ASCII on the display and allows the operator to accept or make changes\
    \ to RTCC using the display and pushbuttons.\n    - Button SW1 - toggles between\
    \ clock set mode and clock accept mode. Hitting the SW1 twice in accept mode exits\
    \ the function with RTCC set to the displayed time.\n    - Button SW2 - if in\
    \ clock setting mode increments current data field\n    - Button SW3 - if in clock\
    \ setting mode decrements current data field\n    - Button SW4 - advance to next\
    \ allowable data field\n\n### Clock and Alarm Experiment\n\nThis experiment uses\
    \ the RTCC library and clock_Setup() and set_alarm() functions as part of main.\
    \ The Experimenter essentially performs the clock demo\n"
  mdcn: "\n\n![](img/a9229e7b0ddd9608f171b22b52514f39_159_0.png)\n\n图 8-16：实验板 EEPROMDEMO\
    \ 流程图\n\n为了更好地理解，请查看下面所示的 EEPROMDEMO 代码，以及在 EEPROMDEMO 操作过程中出现的一些实验板显示。这种用实时数据更新\
    \ LCD 显示的程序结构，对于你未来任何实验板应用来说都可能是重要的一部分。\n\nEEPROM DEMO 主代码（代码截图）\n\n![](img/a9229e7b0ddd9608f171b22b52514f39_160_0.png)\n\
    \n### EEPROM DEMO 主代码\n\n### 实验板显示\n\n图 8-17：实验板 EEPROM DEMO 主代码及结果\n\n### SPI\
    \ 关键特性回顾：\n\n- 支持四根线：SDO、SDI、SCLK、/CS\n- 数据可以同时双向传输\n- 主机提供时钟并启动数据传输\n- 简单的同步接口，广泛用于微控制器外设通信\n\
    - 能够进行高速传输（取决于时钟频率）\n- SPI 外设功能相当于数字移位寄存器\n\n### EEPROM 关键特性回顾：\n\n- EEPROM 在断电时保留存储内容\n\
    - 用于设置密码、访问代码和校准数据\n\n### PIC24H SPI 关键特性回顾：\n\n- PIC24H 有两个可用的 SPI 外设：#1 和 #2\n\
    - 使用 PPS 配置 SPI 接口的可编程引脚\n- 通过设置两个 SFR 寄存器 SPI2CON1 和 SPI2STAT 中的位来对 SPI 进行编程\n\
    \n![](img/a9229e7b0ddd9608f171b22b52514f39_163_0.png)\n\n图 9-1：输出比较外设\n\nOCx 模块可以使用\
    \ PIC24HJ64GP502 的 16 位定时器 2（TMR2）或定时器 3（TMR3）作为时基，并设置输出脉冲波形的周期。PR2 是定时器 2 的周期设置，PR3\
    \ 是定时器 3 的周期设置。在我们的示例中，我们将使用定时器 2。OCxRS 和 OCxR 寄存器中加载一个 16 位值，用于控制输出周期内生成的脉冲宽度。该值在每个周期内与定时器进行比较。OCx\
    \ 输出初始为高电平，当发生匹配时，OCx 逻辑会在输出端产生低电平。这将按周期重复进行（见图 9-2）。\n\n这就是 OCx 脉冲宽度调制（PWM）模式。在考虑\
    \ PWM 时，一个重要的概念是它允许动态改变施加到负载上的直流电压电平。等一下，你可能会说——这里的直流电压在哪里？把直流电压想象成波形周期内脉冲直流电压的平均值。例如，如果脉冲在一个周期内持续\
    \ 50% 的时间为高电平，且脉冲为 +3.3V，那么我们向负载提供的平均电压为 3.3V 的 50%，即 1.65V。为了在系统运行期间改变脉冲宽度，我们只需写入\
    \ OCxRS，它会在下一个周期自动加载到 OCxR 中。\n\n- void turnon (int setting) - 打开 RB2 引脚输出、定时器\
    \ 2 时钟以及该引脚上的 PWM OC1 配置。定时器 2 的周期预设为 0x7FF，即 12 位 ADC 的最大值。setting 是电位器 ADC 设置的\
    \ 0-0x7FF 之间的任意值，用于调整 PWM 占空比。如果 setting 为 0，则占空比为零；如果 setting 为 0x3FF，则占空比为 50%；如果\
    \ setting 为 0x7FF，则占空比为 100%\n- void setPWM (int setting) - 该函数通过一次调用执行 turnoff\
    \ (void) 和 turnon (int setting) 的相同功能。它在设置 PWM 之前先将 PWM 关闭。\n\n我们还会使用几个 ADC 函数。这些函数在第\
    \ 4 章中介绍过，并包含在 ADC 库中。如果需要，请回顾第 4 章以了解 ADC。\n\n- void initADC (int ANpin) – 此函数将\
    \ ADC 初始化为 12 位手动转换，使用“ANpin”作为单一输入引脚。ANpin 可能的设置为 AN0、AN1、AN4、AN5、AN9、AN10、AN11\
    \ 和 AN12。在本实验中，我们将使用 AN0。\n- int readADC (int ANpin) – 此函数强制对指定的 ANpin 进行手动 ADC\
    \ 转换，同样我们将使用 AN0。\n\n连接原理图如图 9-4 所示。需要 10K 电位器、LED、1K 电阻以及用于 10K 另一侧的外部 +3.3V\
    \ 电源。确保 Microstick II 与外部元件之间的所有地线公共。按照原理图搭建原型，原型如图 9-5 所示，以供参考。\n\n![](img/a9229e7b0ddd9608f171b22b52514f39_166_0.png)\n\
    \n图 9-4：LED 调光器原理图\n\n## 运行实验\n\n我们已经涵盖了硬件和软件，因此你可以准备运行原型了。连接到 PC 的 USB 端口。连接外部\
    \ +3.3V 电源以供电位器使用。确保电位器和 LED 电路的地线与 Microstick II 的地线公共。打开第 9 章文件夹中的 PWM.MCP。双击图标打开工作区，然后进行编译并下载。\n\
    \n运行程序，当你顺时针或逆时针转动电位器时，应该会看到 LED 亮度发生变化。如果没有发生这种情况，请参考原理图和原型图片，因为你的接线有误。\n\n##\
    \ 16 位微型实验板（可选）\n\n这是 16 位微型实验板的 PWM 实验。其操作方式与本实验 1 和实验 2 完全相同，事实上使用了类似的源代码，只是针对\
    \ J3 I/O 连接器上的不同引脚组进行了修改。使用源代码 PWMDEMO Experimenter。你需要编译代码，并使用 PICKIT2/3 作为调试器/编程器。如果使用\
    \ PICKIT2，实验板可以使用外部电源，也可以不使用外部电源（PICKIT2 会检测电源，如果未检测到电源会自动供电）。此外，实验板需要外接一个带串联电阻的\
    \ LED 和 10K 电阻，添加到 J3 上（参见连接图）。\n\n## 练习：\n\n1. PWM 代表什么？\n2. 它是如何使用的？\n3. 运行实验\
    \ 1，将电位器转到两个极端。使用观察窗口捕获这些值。\n    读取并记录这些值。它们是什么？它们从哪里来？\n4. 描述一个可以使用 PWM 的应用\n\
    5. 将实验 1 配置为使用 OC2 而不是 OC1\n    a) 更改 OC2 引脚的 PPS\n    b) 重写库以使用 OC2 SFR 进行操作\n\
    \n## 第 10 章 – RTCC（实时时钟日历）\n\n在本章中，我们将使用 PIC24H 上的 RTCC（实时时钟日历）外设。建议仅在 16 位微型实验板（参见附录\
    \ A）上使用本实验，因为所有必要的支持硬件（即时钟晶体、LCD 和四个按钮）都已就位。\n\n### 实时时钟日历\n\n我们一直在谈论实验板的时钟，现在它来了。它是一个实时时钟和日历（RTCC）功能，适用于需要在长时间内以最少甚至无需\
    \ CPU 干预的情况下保持精确时间的应用。该外设针对低功耗使用进行了优化，以便在跟踪时间的同时延长电池寿命。它具有 100 年时钟和日历功能，并具有自动闰年检测功能。时钟范围为\
    \ 2000 年 1 月 1 日 00:00:00（午夜）到 2099 年 12 月 31 日 23:59:59。小时以 24 小时制（军用时间）格式提供。时钟提供一秒的精度。\n\
    \nRTCC 与 PIC24H 微控制器的内部寄存器接口使用二进制编码十进制（BCD）格式实现。这简化了软件读取和写入模块的操作，因为每个数字值都包含在各自的\
    \ 4 位值中。\n\n![](img/a9229e7b0ddd9608f171b22b52514f39_174_0.png)\n\nLCD 和按钮。要操作这些，你必须首先调用库函数\
    \ RTCCInit()。我们将讨论的两个函数使用 RTCC 库，但位于其外部的 MAIN.C 中。\n\n- Set_ALARM(alarm) – 此函数初始化\
    \ RTCC 的报警功能，并根据传入的 alarm 值设置报警（在数据记录器中我们称之为速率）。它在速率设置菜单中调用。其设置如下：\n    - 如果 (alarm\
    \ = 0)，则每 10 秒报警一次\n    - 如果 (alarm = 1)，则每分钟报警一次\n    - 如果 (alarm = 2)，则每 10\
    \ 分钟报警一次\n    - 如果 (alarm = 3)，则每小时报警一次\n    - 如果 (alarm = 4)，则每天报警一次\n    - 如果\
    \ (alarm = 5)，则每周报警一次\n    - 如果 (alarm = 6)，则每月报警一次\n    - 如果 (alarm = 7)，则每年报警一次\n\
    \n一旦设置了报警，此函数将启用 RTCC，以便在报警条件发生时中断 PIC24H。然后，RTCC 中断服务程序可以执行报警应用所需的任何功能。设置报警和\
    \ RTCC 中断的代码片段如图 10-5 和图 10-6 所示。请注意中断中有一条注释，你可以在此处添加自己的代码，以执行因报警条件而希望执行的任何功能（默认为切换\
    \ LED）。\n\n- clock_Setup() – 此例程在显示屏上以 ASCII 格式显示当前 RTCC 时间设置，并允许操作员使用显示屏和按钮接受或修改\
    \ RTCC。\n    - 按钮 SW1 - 在时钟设置模式和时钟接受模式之间切换。在接受模式下按两次 SW1 会退出该函数，并将 RTCC 设置为显示的时间。\n\
    \    - 按钮 SW2 - 如果在时钟设置模式下，则递增当前数据字段\n    - 按钮 SW3 - 如果在时钟设置模式下，则递减当前数据字段\n  \
    \  - 按钮 SW4 - 前进到下一个允许的数据字段\n\n### 时钟和报警实验\n\n本实验使用 RTCC 库以及 clock_Setup() 和 set_alarm()\
    \ 函数作为 main 的一部分。实验板本质上执行的是时钟演示\n\n"
