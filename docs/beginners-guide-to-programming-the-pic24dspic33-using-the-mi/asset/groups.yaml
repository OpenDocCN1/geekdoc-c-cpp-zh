    +   - LCD_Initialize () - initializes the LCD display and makes it ready for output.
    This needs to be called before any other LCD function is called. Keep in mind
    initialization is a two-step process, first the PIC24H must initialize it ports
    for output connection to the LCD and then once this is achieved it then executes
    the LCD initialization command sequence. Also keep in mind that the library is
    written specifically to support the connections illustrated in the schematic.
    Any deviation from this wiring will cause the LCD library not to work correctly.


    The LCD requires specific initialization sequence for its proper operation. There
    is also a strict command set for PIC24H to interact with the LCD for writing command
    and data and also positioning the LCD cursor. These functions are performed by
    using the supplied ''C'' library functions. Both an initialization sequence and
    command interface using elements of the ''C'' library are shown for illustration.
    You are encouraged to review this code (in project under Graphics.c) and compare
