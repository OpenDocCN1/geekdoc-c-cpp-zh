    \ communications equipment) and the other as DTE (data terminal equipment). This\
    \ partitioning establishes each side's transmit and receive pin outs and connector\
    \ type. The PC is pre-configured as DTE. This forces the PIC24H or Microstick\
    \ II to be DCE.\n\nA complete end-to-end hookup diagram for a Microstick II connection\
    \ to a PC using RS-232 is shown in Figure 7-3. The PC runs a software application\
