    \n绿色调试 LED 亮起（已连接 MPLAB）\n\n用户红色 LED 因程序运行而闪烁\n\nPIC24HJ128GP502 微控制器\n\nMicrostick\
    \ II 通过 USB 连接到 PC\n\n图 1-18：连接 USB 到 Microstick II\n\n请注意，如这些照片中所示安装 Microstick\
    \ II，并且其板尺寸为 20x76 mm，列引脚访问每个连接仅限于两个连接。这对于大多数原型制作工作来说已经足够了。\n\n## 16 位微实验器（可选）\n\
    \nMicrostick II 开发系统是本书的主要重点。Microstick II 充当低成本的入门开发系统。随着您进一步发展实验范围并希望包含内置电源、LCD、EEPROM、按钮等元素时，大量的重复布线可能会很麻烦。超越\
    \ Microstick II 的替代方案是 16 位微实验器。本书的每一章都会讨论 16 位微实验器选项。实验器的完整描述在附录 A 中给出。实验器可通过\
    \ www.Kibacorp.com 购买。实验器促进了 Microchip 16 位\n\nPIC24H/PIC24J/dsPIC33 微控制器的原型探索和测试，具有完整的板载支持和外设功能。这些功能支持广泛的原型电路环境，而无需重建任何电子设备。与\
    \ Microstick II 一样，实验器可直接插入无焊面包板。实验器采用插座式设计，可轻松支持多种 Microchip 16 位 SDIP 部件，如 PIC24FJ128GP502（随\
    \ Microstick II 提供）。实验器随附 PIC24FJGA002。\n\n显示了 16 位实验器放置在无焊面包板上的照片。实验器板载支持具有 16x3\
    \ LCD。4 个用户按键、板载电源调节（带电源指示 LED 和电源开关）、32KB EEPROM、电源复位按钮、ICSP（在线串行编程和调试器接口），最后是一个\
    \ I/O 扩展连接器。\n\n显示了 16 位实验器放置在无焊面包板上的照片。\n\n![](img/a9229e7b0ddd9608f171b22b52514f39_35_0.png)\n\
    \n## 16 位实验器功能集：\n\n- 插入式模块格式，内置 3.3V 调节器，可用于更大的无焊面包板。\n- 16x3 低轮廓 LCD 显示屏和 4\
    \ 个用户定义按键\n- 用于在线编程和调试的 ICSP 接口\n- 标准 I/O 扩展总线，可通过面包板访问 PIC24F/PIC24H 外设集\n- 板载\
    \ 32KHz 定时晶体，用于精确计时\n- 板载 32KB EEPROM\n- 配备 PIC24FJGA002，但可使用 PIC24HJ128GP502\n\
    \  - +3.3 V 工作 40 MIPS，具有一定的 +5 伏逻辑兼容性\n  - 128K Flash 8K RAM\n  - 主芯片外设众多：ADC、可编程\
    \ I/O、双 UART、双 SPI、I2C、模拟比较器、捕获/比较模块\n- 带电源指示 LED 的开关——由墙壁变压器或直接连接供电。+3.3V 输出也可用于面包板。\n\
    - 以套件格式提供，使用全套通孔元件便于组装的装配和操作说明（见 www.kibacorp.com）\n\n## MPLAB 关键功能回顾：\n\n- Microchip\
    \ 微控制器的集成开发环境\n- 使用集成项目管理器组织和维护项目文件和用户工作区\n- 使用支持 'C' 和汇编语言的语法源代码编辑器\n- 单按钮构建和编程功能\n\
    - 支持使用外部设备如 Microstick II 对微控制器进行编程和调试\n- 调试操作期间的运行、暂停、单步工具栏。\n\n## Microstick\
    \ II 关键功能回顾：\n\n- 低成本\n- 集成 USB 编程器/调试器 – 无需外部调试器\n- USB 供电 – 易于使用，无需外部电源\n- 插座式\
    \ dsPIC/PIC24/PIC32 – 灵活，易于更换器件\n"
