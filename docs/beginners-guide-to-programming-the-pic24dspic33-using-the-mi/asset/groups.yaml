  mdcn: "\n## 1. 源代码 - 项目视图\n-   源代码实际上是主要的设计。它是一个 .C 文件扩展名，符合 ANSI C 标准，唯一例外是对 Microchip\
    \ 处理器特定功能寄存器（SFR）设置和控制的操作\n-   你可以通过在项目视图中双击源代码列表来查看源代码的内容。源代码窗口将会打开。\n-   源代码窗口会根据语言语法对源代码内容进行颜色编码。例如注释为绿色，C\
    \ 语言元素为深蓝色。\n-   在源代码窗口中，你有一个编辑器，可以修改代码或添加新代码\n-   在此源代码中有几个主要组件。通用头文件、配置字、一个附加函数（我们加入以帮助模块化代码），最后是\
    \ Main 函数\n\n## 2. 通用头文件\n```\n#include \"p24hxxxx.h\"  /* generic header for\
    \ PIC24H family */\n```\n-   此文件在源代码中被引用。它被称为头文件（具有 .H 扩展名）。它由 Microchip 开发并提供。对于我们的工作，其内部定义在\
    \ C 语言环境中支持对 PIC24H 微控制器外设和 I/O 的读写操作时是必需的。\n-   实际文件存在于项目之外，位于 MPLAB C30 目录中。\n\
    -   此文件包含对所有特定 Microchip 外设功能和寄存器定义的引用。此引用使我们能够以无缝的方式使用符合 ANSI C 的语言组件访问 Microchip\
    \ SFR 功能。\n\n## 3. 配置字\n-   这些是 C 语言宏（自定义 C 语言脚本），用于设置配置字。这些宏是 .H 文件的一部分而定义。在此情况下，使用单独的脚本将\
    \ PIC24H CPU 时钟源固定为内部 RC 振荡器并禁用主主晶振振荡器。\n```\n_FOSCSEL(FNOSC_FRC);\n_FOSC(FCKSM_CSDCMD\
    \ & OSCIOFNC_ON & POSCMD_NONE);\n_FWDT(FWDTEN_OFF);\n```\n\n## 5. 延时函数\n-   为了使\
    \ LED 闪烁，我们需要在打开和关闭时有一定的延时，以便在我们的视野中保持为“闪烁”。此函数提供了此功能。它配置为固定延时，仅空闲并消耗 CPU 周期时间，约为\
    \ ½ 秒。延时配置为循环嵌套循环。循环次数由 lend 和 jend 值确定。总延时约为 lend 乘以 jend 个周期，即 400 x 1000 或\
    \ 400,000 个周期，以实现 500 毫秒延时。\n```c\nvoid delay(void); // 501 msec\n\nint i,j;\n\
    for (i=0; i<lend; i++)\n    for (j=0;j<jend; j++);\n}\n```\n\n## 6. 主代码\n-   每个\
    \ C 程序必须有一个名为 \"main\" 的单一函数。用户执行的开始位置在此处，仅在编译器设置配置字、初始化处理器堆栈指针并初始化所有变量之后。一次 C\
    \ 语言应用程序中只能存在一个 main 函数。正如我们将看到的，main 函数通常分为初始化部分和连续循环部分。初始化完成后，微控制器进入其操作的连续（“无限”）循环。这由\
    \ while (1) { ...... } 标记。微控制器通常不会离开 main 的这一部分，除非发生电源复位或看门狗超时。\n```c\n// main\
    \ entry point\n...................\nint main(void)\n/* Initialize ports */\nAD1PCFGL\
    \ = 0x0fff;    // reset all pins that others initialized make them digital\nLATB\
    \ = 0x0000;        // set latch levels for ports\nTRISB = 0x0000;       // set\
    \ IO as outputs for ports\n/* endless loop */\nwhile (1) {\n    delay();\n   \
    \ led = !led;\n}\n```\n-   通常基于 PC 的 C 应用程序会运行，然后在 main 函数完成后返回到 PC 操作系统。对于微控制器应用程序，没有操作系统，因此如果\
    \ main 终止，编译器会通过从头开始执行来复位处理器\n\n## 7. I/O 初始化\n-   这在 main 函数内部，如前所述，是 main 中专门用于在应用程序开始使用它们之前初始化所有微控制器端口和外设（SFR）的部分。初始化通常在\
    \ main 中只发生一次，然后进入连续运行循环。我们的应用程序涉及三个特殊功能寄存器（SFR）。AD1PCFGL 用于配置并关闭具有模拟内容的引脚的所有模拟相关功能。LATB\
    \ 是与 PORTB 引脚输出相关联的所有引脚的锁存输出设置。在此情况下，所有锁存设置都被清零——启动时输出上不会出现高电平。TRISB 是 PORTB 的方向设置，在此情况下使其全部为输出。\n\
    ```\nAD1PCFGL = 0xFFFF\nLATB = 0x0000\nTRISB = 0x0000\n```\n\n## 8. 连续循环\n-  \
    \ 这是微控制器应用程序的主要工作段。连续循环是所有工作完成的地方。在我们的循环中，我们调用延时函数，之后我们 'toggle' LED 的当前值（定义为\
    \ LATB 位 5 或 RB5 引脚）。通过 'toggle'，如果当前 RB5 的值为 1 则设为 0，如果为 0 则设为 1。这样在每次延时后，连接到\
    \ RB5 的 LED 将闪烁。\n```\nwhile(1)\n    delay()\n    led = !led\n```\n\n## 9. Microstick\
    \ II 状态\n-   IDE 提供一个输出窗口，显示 Microstick II 调试器的状态（如果它已在您保存的工作区中配置为首选调试器）。请注意，输出窗口具有选择标签，允许您选择查看哪个输出。查看选项包括编译器构建、文件搜索结果、版本控制和调试器状态。所示的图假设您的\
    \ Microstick II 已连接到运行 MPLAB 的 PC 的 USB 端口。\n\n## 10. 调试器具体信息\n-   这是 IDE 系统的一个组成部分，突出显示处理器类型、处理器状态以及当前使用的调试器。\n\
    \n## 实验 1 - 工作原理\n该应用程序使用单个 C 源文件（main_led.c），其中包含一个 main 函数，引用通用 PIC24H 头文件/外设使用（#include\
    \ \"pic24Hxxx.h\"）。此头文件将确定使用的特定 PIC24H 处理器。处理器配置使用预定义的 C 库宏设置（也在头文件中引用）。这些设置是内部\
    \ CPU 时钟选择为 8MHz，无外部振荡器，无时钟切换，无看门狗操作，最后将 RA3 用作数字/模拟引脚而不是外部晶振引脚输入。\n\n在 main 函数中，应用程序执行\
    \ I/O 初始化，然后进入连续循环交替打开然后关闭 LED。此特定 LED 显示应用程序的流程图如图 2-5 所示。\n\n![](img/a9229e7b0ddd9608f171b22b52514f39_49_0.png)\n\
    \n图 2-5：实验1 软件操作\n\n## 实验 1 执行\n让我们开始调试。在此阶段，鉴于原型硬件配置正确，且源代码和处理器配置良好，我们对执行期间会发生什么有相当好的了解。PIC24H\
    \ 将使连接到 Microstick II 的 14 号引脚 RB5 的 LED 闪烁。\n\n让我们验证延时时间并确保其足以产生良好的闪烁频率。一种快速方法是使用仿真工具“秒表”来测量此延时时间。在仿真下，有一些工具优势可以进行详细分析。秒表就是一个例子。在“秒表”下，我们可以进行实际时间测量。让我们先设置仿真，然后使用秒表验证延时时间，然后再进行实时调试和\
    \ Microstick II 的工作。\n\n![](img/a9229e7b0ddd9608f171b22b52514f39_50_0.png)\n\n\
    图 2-6：选择仿真器\n\n一旦仿真器被选为调试器，请确保调试器的特定仿真设置正确（如处理器时钟频率）。\n\n![](img/a9229e7b0ddd9608f171b22b52514f39_50_1.png)\n\
    \n图 2-7：设置仿真器时钟\n"
