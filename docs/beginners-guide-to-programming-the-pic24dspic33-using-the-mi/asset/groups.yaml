  - '[PAGE 40]


    # Chapter 2 – Driving an LED


    In this chapter we will develop prototype hardware and software for a LED. We
    will be using the installed development system created in chapter 1. For our first
    experiment will first start with just one LED. This is reminiscent of the ''C''
    program "Hello World!" Here the programmer strives to write their first application
    program outputting a hello world message to the console. With our microcontroller
    there is no console- so we have to just settle to blink a LED as a type of "Hello
    World". Here we will walk through hardware and software builds, and do the software
    debug using simulation and the finally do hardware debugging using Microstick
    II. In the second exercise we expand the hardware prototype capability by increasing
    the number of LEDs to total of ten and enhance the software to perform a binary
    counting display.


    # Experiment 1- Hardware


    The PIC24H has user programmable pins. These pins can be configured as digital
    inputs, digital outputs, analog, or assigned as specific peripheral in/out. A
    block diagram (see Figure 2-1) highlights the inner organization of an individual
    PIC24H pin to show just how this works. The diagram depicts only the peripheral
    and digital functionality of the pin, analog is not shown.


    ![](img/a9229e7b0ddd9608f171b22b52514f39_40_0.png)'
  - '[PAGE 41]


    A pin''s output can originate from either the peripheral side or the digital side.
    Both have their own independent data paths and enabling signals through an output
    mux which determines which side becomes the pin''s output. A peripheral must be
    enabled for its output to be used. To enable a pin for digital output the pin''s
    TRIS signal must be cleared. Only one side (peripheral or digital) can output
    at any one time, and if both are enabled, the peripheral with higher priority
    wins! On the input side no mux exists and so input signals connect to both sides.
    In this chapter we will use digital output only.


    Every pin has a corresponding TRIS control bit to set the digital direction of
    the pin. A zero makes the pin an output; a one makes the pin an input. Each pin
    also has a PORT bit that allows reading or writing to the pin. For our PIC24H
    part we have two PORT registers PORTA and PORTB that are both 16 bits wide. However,
    because of the 28 DIP package size not all of these PORT bits are available as
    pins.


    PORTA allows for read/write of pins RA0, RA1, RA3, RA4 these pins correspond to
    bits 0, 1, 3, 4 of PORTA (the rest of the bits are unassigned).


    PORTB allows for read/write of pins RB0, RB1, RB2, RB3, RB4, RB5, RB6, RB7, RB8,
    RB9, RB10, RB11, RB12, RB13, RB14, RB15 again each of these pins corresponds to
    a bit position in the register.


    As mentioned earlier, for each PORT we have a TRIS. So in this device we have
    a TRISA and a TRISB. Both PORT and TRIS exist in the PIC24H as "special function
    registers" or SFR for short. They are RAM memory locations in the PIC24H dedicated
    to digital pin operation. Pin bit positions in a PORT are identical to those in
    its TRIS. For example if RB2 is to be an output then write a zero to bit position
    2 in the TRISB register and then set that pin''s output value by writing a one
    ( for +3.3VDC output) or zero (ground) to the corresponding bit position in PORTB.


    There is also a third SFR that is used for digital I/O called LAT or latch. It
    works in a similar way to PORT, however with LAT we can latch output or input
    rather than directly reading or writing using PORT. We have both a LATA and LATB,
    again both are 16 bits. There are a number of software techniques to access special
    function registers, like TRIS, PORT, and LAT in C code and we will discuss this
    some more when we talk about the software.


    For experiment 1 we want to connect a single LED to bit 5 of PORTB or RB5 and
    set RB5 to be a digital output. RB5 is pin number 14 on the PIC24HJ128GP502. The
    device is a 28 pin DIP, so there are 14 pins on each side of the chip. Looking
    down on the chip there is a notch in the package to indicate pin 1, all the pins
    are numbered 1 to 28 and go counter clockwise on the device. This would make pin
    14 or RB5 the last pin on the bottom right hand side of the chip.'
  - '[PAGE 42]


    A schematic for experiment 1 is shown. The PIC24H digital output can drive up
    to 25 milliamps on a digital output. We don’t need all that current to turn on
    a LED (3 milliamps is more than enough), so we use a current limiting resistor
    (1K) in series with the LED. The circuit is basically a series circuit where RB5
    is tied to one side of the resistor, the other side of the resistor is connected
    to LED anode, and finally the LED cathode is tied to ground. In this way when
    we make RB5 = 1 the LED will light up, if we make RB5 = 0 the LED will turn off.
    Make sure that the ground potential for your prototype circuit is the same ground
    reference used by the Microstick II, so connect the Solderless breadboard ground
    to pin 8 of Microstick II.


    An assembled circuit is shown in Figure 2-3. Notice that ground is picked up from
    pin 8 and connected to a common bus for ground on the prototype board. This same
    ground is used for the LED cathode. The cathode must be grounded for the LED to
    work. You need to be able to Figure out anode from cathode with the LED, to be
    able to hook it up correctly. The cathode is typically the shorter lead on the
    device is also marked by a flat edge on the part.


    ![](img/a9229e7b0ddd9608f171b22b52514f39_42_0.png)'
