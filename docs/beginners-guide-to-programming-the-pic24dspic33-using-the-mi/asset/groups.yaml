    \n图11-3：I2C实验\n\n## 实验应用程序库\n应用程序库支持低密度和高密度EEPROM。低密度指的是那些只需要8位地址且容量低于256字节的设备。高密度设备为512到64K字节，需要16位地址。该库支持字节读/写以及页（多字节）读/写。提供的代码不需要额外库。固件由两个.c文件（main.c、i2c_Func.c）和一个.h文件组成，分为九个部分：\n\
