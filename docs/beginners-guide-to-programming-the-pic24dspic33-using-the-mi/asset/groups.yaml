    \ 中显示了模拟环境（典型的输入传感器值）随时间变化的连续电压输出。随着环境条件变化，传感器输出值也会平滑地、无中断地变化。然而，微控制器是一个数字设备；它仅使用数字进行操作，并且只能定期进行测量（作为正常处理循环的一部分）。从微控制器的角度来看，连续的传感器信号现在变成以固定速率采样的离散值集合。这些值是相对于真实模拟值的近似值，原因很简单，数字本身的大小在分辨率或位数上是有限的。对于\
    \ PIC24H，ADC 可以生成 10 位或 12 位值（用户可选择）。\n\n10 位分辨率提供 1/1024 *3.3VDC 的电压分辨率或 3 毫伏（请记住\
    \ PIC24H 是 +3.3VDC 器件）。12 位更好，1/4096 * 3.3VDC 或 0.8 毫伏。在这两种情况下，ADC 都根据 ADC 转换的大小为输入传感器值提供固定的分辨率。PIC24H\
    \ ADC 分辨率精度达到数字字长 +-1 LSB。通过对连续读数进行平均（假设平均期间输入不变），精度可以提高到优于 1 LSB。对于该技术的一个经验法则是确保信号（通过动态调整其幅度）尽可能大地进入\
    \ ADC，并且不超过满量程，以实现采样测量期间的最佳信号分辨率。在我们的实验中，我们不会控制任何信号幅度，只直接测量原始输出。\n\n让我们现在讨论固定的测量速率或采样速率。如前所述，使用固定采样速率意味着您会定期测量信号。使用周期性采样时存在风险，即信号可能在周期性采样之间显著变化，而微控制器将“看不到”，因此无法测量和响应这些变化。工程上的经验法则是采样率应足够高以捕获信号的最高频率。更精确地说，该规则指出采样率\
    \ = 2X 最高输入频率（也称为 Shannon 规则）。在大多数情况下（音频除外），传感器输出通常频率含量非常低，因此不需要高采样率。然而，PIC24H\
    \ 在 10 位 ADC 下的最高采样率为 1.1MSPS（每秒百万次采样），在 12 位 ADC 下为 500 KSPS（每秒 50 万次采样）。\n\n\
    生活中没有免费的午餐，就像其他一切一样，用户也存在权衡，您本质上可以以转换速度（1.1 MSPS 或 500KSPS）换取电压分辨率（10 或 12 位）。选择由您决定，应根据实现最高精度和最及时传感器读取的需求来决定。在我们的实验中，我们只使用\
    \ 12 位。\n\n在继续实验之前，让我们再介绍一些基础知识。图 4-2 显示了 ADC 操作涉及的一些离散步骤，超出采样率和数字分辨率。ADC 操作分为\n\
    \n两个离散步骤：采集时间（采样并保持信号）然后是转换（对采样并保持的信号执行 ADC 过程）。为了收集并保持模拟信号以便转换，使用了采样保持电容。该电容内部于\
    \ PIC24H 电子器件中。电容跟随模拟输入信号，然后在采样命令后存储模拟值的电压捕获以供转换过程使用。这被表示为采样保持过程。\n\n在信号保持在电容中时，模拟到数字转换过程会进行。转换使用确切数量的\
    \ CPU 时钟周期（相当于结果输出字长）来执行转换。这种类型的转换过程称为逐次逼近，其中使用内部比较器来测量模拟采样输入与内部生成的斜坡比较器之间的差异。斜坡输出电压大小由转换时钟的数量决定。对于每个时钟（10\
    \ 或 12 中的一个），会做出数字决策并生成数字位值并存储为最终数字字结果的一部分。\n\n![](img/a9229e7b0ddd9608f171b22b52514f39_82_0.png)\n\
    \n图 4-2：ADC 采样时间\n\nPIC24H ADC 外设是一个极其多功能的部分，具有许多可通过设置外设特定 SFR（特殊功能寄存器）配置的操作模式。其中一种模式是分辨率，可从\
    \ 10 位选择到 12 位。另一种是您可以使用采样保持（S/H）通道的数量。选择 10 位时，总 S/H 数量为四个，使用 12 位 ADC 时\n\n\
    - 可选缓冲填充模式 - DMA 辅助结果存储\n\nADC 模块总共有十个 SFR 控制和状态寄存器，其中一部分将在我们即将进行的实验中使用。让我们回顾一下\
    \ SFR 内容。我们希望在实验中能够将 ADC 设置为 12 位单通道模式操作，无扫描，整数输出和手动模式触发。\n\n在此类配置的 ADC 框图显示如下。这里只有一个\
    \ S/H 处于活动状态，12 位 ADC 仅使用一个输入通道且无扫描。我们的特定 PIC24H，硬件预配置为 Microstick II，并没有 16 个模拟通道，而是限制为\
    \ 8 个。这些八个通道为 AN0、AN1、AN4、AN5、AN9、AN10、AN11 和 AN12。\n\n使用 SFR 设置为 12 位整数无符号格式，信号数字输出格式将从\
    \ 0x0000 变到 0x0FFF。这对于大多数单电压输入传感器值是典型的，其中 0 表示 0.0 伏特，0X0FFF 表示 +3.3 伏特。\n\n![](img/a9229e7b0ddd9608f171b22b52514f39_84_0.png)\n\
    \n下面列出了用于控制 ADC 模块操作的 AD1CON1、AD2CON2 和 AD3CON3 SFR 寄存器。\n\n## AD1CON1 SFR 位\n\
    \n- ADON =1 打开 ADC\n- AD12B =1 将 ADC 操作设置为 12 位\n- FORM 位\n  - 01 输出格式为有符号\n \
    \ - 00 输出格式无符号\n\n- CH0NA 通道 A =0 负输入为 –REF\n- CH0SB 通道 B =000 – 未使用\n- CH0SB\
    \ 通道 B =0 负输入为 –REF - 未使用\n\n## AD1CSSL SFR 位 – 输入扫描选择低\n\n- CSS = 0x0001 对应 AN0\n\
    \n## AD1PCFGL SFR 位 - 模拟输入选择\n\n- PCFG =0xFFFE 初始为 AN0，但在库中也可以设置其他可用通道\n\n## 硬件描述\n\
    \n硬件原理图在图 4-4 中给出。这里我们使用一个模拟 10K 电位器作为可设置输入模拟源，用于模拟输入通道 0 或 PIC24HJ128GP502 的\
    \ AN0 引脚 2。10K 电位器有一个端子连接到外部 +3.3 VDC 电压源。Microstick II 有两个裸焊盘 GND 和 VDD（或原理图上的\
    \ TP1）。您的选择是经由板上 TP1 连接 +3.3VDC 或为此实验提供该供电电压。使用 TP1 时需要注意的是，该连接可提供的电流有限。请记住，微控制器本身也使用该连接。其需求会根据振荡器设置和输出驱动电流而变化。作为经验法则，当您的原型实验超过\
    \ 100ma 标记时，您可能希望使用外部电源作为电源。在本练习中，由于我们仅使用电位器，我们将连接到 VDD（TP1）以提供电位器的 +3.3VDC，并将\
    \ Microstick II 的引脚 8 接地连接到电位器的接地。电位器的滑动端连接到 AN0 输入引脚 2。您必须移除跳线 J3 以断开该引脚的用户 LED。使用电位器，我们可以将\
    \ AN0 的输入电压在 +3.3VDC 到地之间变化，以进行 ADC 实验。\n\n"
