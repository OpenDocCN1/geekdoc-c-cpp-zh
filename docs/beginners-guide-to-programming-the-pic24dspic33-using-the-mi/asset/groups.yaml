    提供了此功能。指定的按钮功能如下：


    - 按钮 S1 在时钟运行模式和时钟设置模式之间切换。

    - 按钮 S2，如果处于时钟设置模式，则递增当前数据字段。

    - 按钮 S3，如果处于时钟设置模式，则递减当前数据字段。

    - 按钮 S4，如果处于时钟设置模式，则进入下一个允许的数据字段；如果在时钟运行模式下按下，则退出到“Flash Screens。”


