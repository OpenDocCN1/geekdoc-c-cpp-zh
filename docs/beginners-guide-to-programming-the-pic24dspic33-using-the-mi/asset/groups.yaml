    图 3-1：机械开关抖动


    ## 实验 1 - 硬件


    如第 2 章所述，PIC24H 具有用户可编程引脚。这些引脚可以配置为数字输入、数字输出、模拟输入，或分配给特定外设。


    在本章中，我们利用第 2 章学到的知识，开始使用数字输入。您可能还记得，每个引脚都有对应的 TRIS 控制位来设置引脚的数字方向。置 0 使引脚成为输出；置
    1 使引脚成为输入。每个引脚还有一个 PORT 位，用于读取或写入该引脚，以及一个 LAT，其工作方式与 PORT 类似，但使用 LAT 我们可以锁存输出或输入，而不是直接通过
    PORT 读取或写入。LAT、PORT 和 TRIS 都是特殊功能寄存器（SFR）。这些寄存器都是 16 位的，但在我们与 Microstick II 一起使用的
    28 引脚“细型”DIP 封装中，并非所有这些 SFR 位都被使用。


    在 C 代码中访问 TRIS、PORT 和 LAT 等特殊功能寄存器有多种软件技术，我们已在第 2 章中介绍过，后面讨论软件时还会进一步扩展。对于实验 1，我们将一个
    LED 连接到 PORTB 的第 5 位，即 RB5（PIC24H 的第 14 引脚），然后将 RB5 设置为数字输出，通过限流电阻驱动 LED。一个按钮开关连接到
    RB3，即 PIC24H 的第 7 引脚。该引脚将被设置为数字输入。


    让我们简要讨论一下开关是如何连接的。这个开关是一个小型触觉按钮开关，称为 SPST（单刀单掷）开关。其触点显示为常开状态，开关上没有电气导通。当您按下按钮时，开关两端接通。使用该开关时，我们将一端接地，另一端连接到
    RB3 数字输入。当开关被按下时，输入将读取到接地状态，即零。


    ![](img/a9229e7b0ddd9608f171b22b52514f39_66_0.png)


    ![](img/a9229e7b0ddd9608f171b22b52514f39_66_1.png)


    ![](img/a9229e7b0ddd9608f171b22b52514f39_66_2.png)


    物理开关


    功能框图


    电气符号


    图 3-2：开关的表示形式


    当开关未被按下时，它处于断开状态，RB3 引脚将处于悬空状态（与地或 +3.3VDC 之间没有直接连接）。在这种情况下，微控制器读取到的状态是不确定的。为了解决这个问题，我们需要通过一个电阻将
    +3.3VDC 连接到开关的常开端（NO）端子。这样，当开关未被按下时，RB3 将读取到 1 或高电平；当开关被按下时，开关将该点连接到地，RB3 读取到的值将为
    0。


    与其使用外部电阻来搭建电路，PIC24H 有一个很好的特性：它可以通过内部一个 100K 电阻将引脚配置为内部上拉。这被称为弱上拉，因为它使用 100K 电阻，所以可提供的电流不大，但在这里已经足够了。通过设置
    SFR 中相应的位可以启用上拉控制。在本例中，该 SFR 是 CNPU1（变化通知上拉）。参见图 3-3。


    当您查看 PIC24HJ128GP502 的引脚排列时，第 7 引脚 RB3 显示它与 CN7 共用引脚，因此这就是我们要在 CNPU1 SFR 中设置的控制位。通过设置该位，RB3
    引脚将通过内部 100K 电阻上拉到 +3.3VDC（即微控制器电源），从而无需外部上拉电阻。


    这可以在没有任何延迟的情况下完成。这里确实不需要延迟，因为我们希望尽可能立即响应开关闭合，并通过 LED 报告。


    ![](img/a9229e7b0ddd9608f171b22b52514f39_70_0.png)


    图 3-6：实验 1 的软件操作


    ## 实验 1 执行


    让我们开始调试吧。此时，假设原型硬件配置正确，源代码和处理器配置也正常，我们已经很清楚执行过程中会发生什么。当按钮被按下时，PIC24H 将点亮连接到 Microstick
    II 第 14 引脚 RB5 的 LED。由于我们使用了实际的硬件输入，仿真在这里帮助不大。


    因此，将调试器设置为“starter kit”。（见图 3-7）。


    1.  设置断点

    2.  并设置监视变量为 PORTB

    3.  在 SW 未按下时运行，您应该在以下设置处中断（RB3=1）

    4.  在 SW 按下时运行，您应该在以下设置处中断（RB3=0）


    ![](img/a9229e7b0ddd9608f171b22b52514f39_72_0.png)


    ![](img/a9229e7b0ddd9608f171b22b52514f39_72_1.png)


    RB3 监视窗口显示开关按下状态


    ![](img/a9229e7b0ddd9608f171b22b52514f39_72_2.png)


    图 3-9：设置 RB3（开关）的监视变量


    好的，如果您的监视窗口捕捉到了图 9 所示的结果，说明您的硬件工作正常。如果没有，请返回查看前面给出的原理图和装配图，说明存在硬件接线错误。假设一切正常，只需使用工具栏关闭断点设置并运行。每次您按下按钮时，LED
    都应该点亮。


    ## 实验 2 - 硬件


    让我们继续实验 2。在这里，我们必须考虑开关抖动，以便准确计数开关闭合次数。我们将构建一个五级 LED 计数器。该计数器将对手动按钮按下的次数进行计数。对于五级计数器，我们应该能计数
    32 次按钮按下后才溢出。对于这个实验来说，这应该足够了。同样，按钮连接到 RB3。LED 通过 1K 限流电阻连接到 RB5、RB6、RB7、RB8 和
    RB9。下面提供了原理图。


    ## 实验 2 - 软件


    好的，硬件已经就绪，让我们讨论一下软件。导航到第 3 章的代码文件夹，打开练习 #2 文件夹，然后双击 MPLAB 项目图标 Flash_LED.MCP。


    该应用程序再次使用单个 C 源文件（main_led.c），与练习 1 相同，其中包含一个主函数，引用通用的 PIC24H 头文件/外设（#include
    "pic24Hxxxx.h"）。该头文件将确定所使用的具体 PIC24H 处理器。处理器配置使用预定义的 C 库宏（也在头文件中引用）进行设置。这些设置包括：内部
    CPU 时钟选择为 8MHz，无外部振荡器，无时钟切换，无看门狗操作，最后将 RA3 用作数字/模拟引脚而非外部晶振引脚输入。


    使用一条 define 语句将开关 SW 标记为 PORTBbits.RB3。这是连接到按钮的输入引脚。其他 define 与延迟函数中使用的限制值相关。我们再次使用延迟函数，它将对按钮去抖起到重要作用。


    在主函数中，应用程序执行 I/O 初始化。我们首先通过将 AD1PCFGL 设置为全 1，将所有引脚从模拟模式转换为数字模式。我们清零 LATB，并首先将
    PORTB 的所有引脚设置为数字输出。请记住，RB5、RB6、RB7、RB8、RB9 连接到 LED，将代表我们的二进制计数器。然后我们设置 TRISbits.TRISB3
    = 1，将 RB3 使能为输入。最后一个设置是 _CN7PUE = 1，为 RB3 输入设置相应的弱上拉。


    然后，主代码进入一个连续循环，测试第 7 引脚 RB3（SW）是否为低电平，以表示按钮被按下。如果是低电平，则延迟并递增一个去抖计数器。如果经过 3 次计数后
    SW 仍为低电平，我们将其解释为一次最终稳定的按钮按下，然后执行二进制计数。该二进制计数随后输出到 LATB 以驱动 LED。图 3-11 显示了该应用程序的流程图。


    主连续循环使用了三个嵌套的判断结构。第一个 IF 语句测试 SW 条件，第二个嵌套的 IF ELSE 测试去抖计数，然后决定是否递增二进制计数。第三个嵌套
    IF 检查递增后的计数，如果超过最大计数 1024 则重置计数。请注意，还有一个 view count 变量。该变量是为了调试而设置的，使用监视窗口测试二进制计数是否正常工作。实际的计数器“binarycount”按
    0x2f 递增（请记住我们的最低有效位是 RB5），这看起来直接监视有点令人困惑。


