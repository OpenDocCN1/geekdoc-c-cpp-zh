    ## PIC24/dsPIC33 编程初学者指南


    托马斯·基巴洛（Thomas Kibalo）曾为《Nuts & Volts》杂志撰写多篇文章，他带来了许多人一直期待的初学者书籍：《PIC24/dsPIC33
    编程初学者指南》。基巴洛使用低成本的 Microchip Microstick 模块（搭载 PIC24HJ128GP502）以及免费下载的 MPLAB C
    编译器精简版（适用于 PIC24 MCU 和 dsPIC MCU），一步步带你学习 PIC24H 编程的基础知识，这些知识同样适用于 dsPIC33。他对内部工作原理的清晰解释使学习
    PIC24/dsPIC33 16 位架构变得容易。他的代码示例演示了如何实现大多数应用所需的功能。硬件采用简单的面包板搭建方式展示，即使是初学者也能跟着搭建，而且几乎不需要额外元件。


    - 驱动 LED

    - 读取瞬时开关

    - 模数转换

    - 驱动 LCD 显示屏

    - 定时器与定时器中断

    - 外部 EEPROM 的写入/读取

    - RS232 串行通信

    - SPI 通信

    - I2C 通信

    - 脉冲宽度调制

    - 控制 PIC24H 实时时钟和日历


    对于不想在面包板上搭建电路的人，基巴洛还展示了如何使用他的 Experimenter 板。Experimenter 板（Kibacorp.com）是他自己设计的，内置了
    LCD、开关和其他功能。你也不必使用这个硬件。这本书可以作为你选择的任何 PIC24H 甚至 dsPIC33 开发板的指南。如果你想进阶到 Microchip
    16 位架构，这本书能让你轻松走上这条路。


    '
