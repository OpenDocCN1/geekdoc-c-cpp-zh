    Make sure we are set to 8MHz. This is the clock rate for the internal RC, which
    matches configuration. We want to be sure that simulation matches the real world
    condition.


    Ok, at this point we should be good to go with our delay measurement. Go to the
    source code. Position the cursor at the exact line where delay function is called
    in the main loop. Move the cursor to the grey left side column in the source and
    double click your mouse. A red breakpoint icon should appear aligned with source
    code that calls the delay. The toolbar and associated buttons are shown for review.


    ![](img/a9229e7b0ddd9608f171b22b52514f39_51_0.png)


    Figure 2-8: Tool bar Button definitions


    Position cursor over line in text


