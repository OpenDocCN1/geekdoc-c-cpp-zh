  mdcn: "\n\n## PIC24/dsPIC33 编程初学者指南\n\n![](img/a9229e7b0ddd9608f171b22b52514f39_0_0.png)\n\
    \nThomas Kibalo\n\n> “拒绝拥抱独特机遇的人，与尝试后失败的人一样，注定与奖赏失之交臂”\n> ——威廉·詹姆斯\n\n- 运行实验……89\n\
    - 16 位微实验板（可选）……92\n- **第 5 章 – 使用 LCD 显示器与 Microstick II**……95\n  - 硬件描述……95\n\
    \  - 软件库描述……98\n  - 实验 #1 – LCDDEMO……101\n  - 运行 LCDDEMO……102\n  - 实验 #2 – 简易电压表……103\n\
    \  - 运行电压表……105\n  - 16 位微实验板（可选）……106\n- **第 6 章 – 使用定时器和定时器中断**……109\n  - 16\
    \ 位定时器外设……109\n  - 硬件描述……111\n  - 定时器 1 实验 – 非中断模式……113\n  - 定时器 1 – 16 位执行……115\n\
    \  - 定时器 1 – 使用中断的 16 位实验……116\n  - 使用定时器外设对的 32 位定时器……118\n  - 定时器3/4 32 位操作\
    \ – 非中断模式……119\n  - 定时器3/4 32 位操作中断模式……121\n  - 16 位微实验板（可选）……122\n- **第 7 章 –\
    \ 串行通信**……125\n  - 串行通信概述……125\n  - RS-232 和 RS-485 工业标准串行通信……127\n  - 美国信息交换标准代码（ASCII）……128\n\
    \  - USB（通用串行总线）……130\n  - 串行通信回顾……131\n  - PIC24H 外设引脚选择系统（PPS）……132\n  - 初始化\
    \ PPS……134\n  - 实验 1 “实现与 PC 的串行接口”……136\n  - 软件配置……137\n  - 硬件配置……138\n  - 执行代码……140\n\
    \  - 使用 USB 代替 RS-232……143\n  - 16 位微实验板（可选）……145\n\n嵌入式设计周期首先从为目标应用设计和输入源代码开始，然后处理与该目标代码软件语言相关的任何源代码语法错误，以使源代码达到可执行的形式。这种可执行形式的源代码被指定为目标代码。在此周期中，下一个关键步骤是将目标代码编程到微控制器原型中，以测试和验证原始代码设计。在周期的这一点上，需要外部工具设备来对微控制器进行编程。这种工具类型，如\
    \ Microchip 的 Microstick II，允许“在电路编程”，使您能够在微控制器位于原型中时对其进行编程，而无需将其取出。\n\n好的，我们假设在嵌入式设计周期中已经走得足够远，现在已经在原型中编程了可执行的目标代码。接下来我们开始测试源代码设计的下一步。十有八九，最初设计的代码都会包含需要识别和修复的潜在逻辑错误。作为设计者，我们都“太人性化了”，因此难免会犯错。在此阶段，错误不是源代码的语法错误，而是原始源代码设计中隐含的逻辑错误。这些逻辑错误最终总是与您作为设计者可能对应用或微控制器硬件所做的任何假设相关。这就是调试“挺身而出”的地方。\n\
    \n在调试中，我们需要测试和验证那些原始假设，并发现它们是否正确。IDE 在这里帮助我们，并在外部调试器的支持下，允许在“电路”中对微控制器进行操作测试和控制，并能够以调查研究的方式查看其操作。例如，您应该能够实时检查存储器、单步执行微控制器操作，或在代码指定点暂停操作。当您应用这些工具，加上自己的仔细思考时，您就开始发现设计中潜在的错误或“缺陷”。\n\
    \n现在真正的苦差事变成了重新编写源代码，对源代码进行修改以修复问题，然后通过再次运行整个周期来验证修复。事实上，该过程依赖于嵌入式设计周期的多次迭代。在每次迭代中，您将继续发现缺陷并修复它们，最终收敛到一个希望没有缺陷的基线解决方案。有些专家认为，所有设计在达到产品成熟时仍会带有一定程度的潜在缺陷（我倾向于相信他们）。您在迭代上花费的时间取决于多种因素，例如设计的总体复杂性、您对所设计应用的完整理解、您使用工具的技能、您对微控制器的了解，以及最后、也是最重要的一点——您在以上所有方面所做假设的数量。随着经验和技能的积累，以及技术知识的增长，其中许多因素肯定会逐渐减少。\n\
    \n## 第 1 章 – 入门\n\n在本章中，我们将指导您完成 Microchip MPLAB、Microchip 'C' 编译器和 Microstick\
    \ II 编程器/调试器的安装过程。我们将使用演示项目“FLASH_LED”测试整个安装，以确保安装的所有元素都正确且完整。然后，我们将介绍工具套件的一些重要硬件元素，首先概述\
    \ Microchip 的 16 位微控制器系列，然后更详细地介绍 PIC24H，最后讨论 Microstick II 及其操作。本章将作为所有其他章节的基础，并为我们提供必要的开发工具套件和硬件概述，供后续所有章节的讨论和实验使用。\n\
    \n特别说明：本书中描述的硬件设置和项目是为 PIC24H 编写的。只需几个简单步骤即可轻松配置为 PIC24F 和 dsPIC33。详情见本章末尾。\n\n\
    ### Microchip MPLAB IDE 简介\n\n在此重申，Microchip MPLAB IDE 是一个基于 Windows 的程序，运行在 PC\
    \ 上，用于开发 Microchip 微控制器的应用。作为 IDE，它提供了一个单一的集成“环境”来开发和测试代码，这是所有微控制器嵌入式设计周期的一部分。该环境帮助设计者推进“嵌入式设计周期”，而无需在各种不同工具之间切换分心，并允许设计者专注于完成应用，而无需被这些独立工具及其各自不同的操作模式所打断。\n\
    \n同样，MPLAB IDE 作为一个框架，充当“包装器”的作用，它通过一个图形用户界面协调所有工具。例如，一旦编写了代码，就必须将其转换为可执行的指令集（目标代码），然后下载并编程到微控制器中，以确定其运行效果。在此过程中需要多种工具：编写代码的编辑器、组织文件和设置的项目管理器、将源代码转换为目标代码的编译器，以及用于测试目标代码在微控制器上运行的硬件编程器/调试器。MPLAB\
    \ 与 Microstick II 编程器/调试器一起满足了所有这些要求，并将作为本书中的基本开发环境。\n\nMPLAB 的基本组件和功能如图 1-1 所示。在接下来的章节中，我们将继续讨论和说明这套集成工具集的具体使用，作为每章“动手”实验的一部分。\n\
    \n### MPLAB® 集成开发环境\n\n- 基于 GUI\n- 集成项目管理器\n  - 组织和维护项目文件空间\n  - 保留工作区布局\n  -\
