    # 16 Bit Micro Experimenter (optional)


    An example project Experimenter based LCDDEMO is supplied. No hook up diagram
    is required as the Experimenter contains all LCD connections on-board. Because
    of differences between the Experimenter and Microstick II LCD connections the
    Microstick II''s experiments will not run on the Experimenter without modification.


    For this Experimenter project we show how to use of each of the above LCD functions
    and then how to call them from your MAIN file. Let''s walk through the flowchart
    and then the code. LCDDEMO starts by declaring two strings message# 1 and message#
    2. Each message is configured to be fewer than 16 characters to keep the display
    nice and neat, that is, keeping each message to within a single display row. The
    next step is to initialize the LCD and clear display contents before use. The
    next step after this is to position the cursor to beginning of row one (cursor
    position =0) and write out message #1. We then position the cursor to the beginning
    of row two (cursor position =16) and write out message #2.


    Just to keep things interesting we then position the cursor to the middle of line
    three (cursor position = 36) and write out five characters. If you haven''t figured
    it out by now, cursor positions 0 to 15 correspond to the top row, row #1, of
    the LCD display. Positions 16-31 are row #2 and Positions 32-47 correspond to
    the bottom row, or row #3. The LCD is initialized so that the cursor itself is
    not visible, and the cursor position automatically advances to the next position
    when data is written to the display. Any data that is written to the LCD and display
    must be in ASCII (American Standard for Information Interchange) format.'
