    \ SPI_ENABLE 0x8000 // enable SPI port, clear status\nvoid InitNVM(void)\n{ //\
    \ init the SPI peripheral\n CS EE = 1; // select the Serial EEPROM\n TCS EE =\
    \ 0; // make CS EE pin output\n SPI2CON1 = SPI_MASTER; // select mode\n SPI2STAT\
