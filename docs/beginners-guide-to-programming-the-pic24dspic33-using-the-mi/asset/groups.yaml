    \n## 附录A – 16位实验器板\n如第1章所述，可选的16位Micro实验器有助于对Microchip 16位PIC24HJ64GP502微控制器进行原型探索和测试，它具备板载电源、编程/调试接口和外设支持能力。与Microstick\
