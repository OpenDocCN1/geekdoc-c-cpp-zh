  - "[PAGE 46]\n\n# 5. Delay function\n\n+   - In order to blink the LED we need some\
    \ delay time for turning it on and turning it off in order to allow it to persist\
    \ in our vision as a \"blink\". This function provides this. It is configured\
    \ with a fixed delay, that idles and does nothing else but consume CPU cycle time\
    \ for about ½ second. The delay is configured as a loop within a loop. The loop\
    \ times are established by lend and jend values. The total delay time is approximately\
    \ lend times jend cycles or 400 x 1000 or 400,000 cycles to achieve 500 millisecond\
    \ delay.\n\n```\n```c\nvoid delay(void) ; // 501 msec\n\nint i,j;\nfor (i=0; i<lend;\
    \ i++)\n    for (j=0;j<jend; j++);\n}\n```\n```\n\n# 6. Main code\n\n+   - Every\
    \ C program must have a single function called \"main\". This is where execution\
    \ begins for the user, only after the compiler sets the configuration word, initializes\
    \ the processor stack pointer, and initializes all the variables. Only one main\
    \ function can exist in a C language application at a time. As we will see the\
    \ main function is often segmented with an initialization section and a continuous\
    \ loop section. Once initialization is complete the microcontroller enters the\
    \ continuous (\"infinite\") loop for its operations. This is marked by a While\
    \ (1) { ...... }. The microcontroller normally never leaves this part of main\
    \ unless a power reset or watchdog timeout occurs.\n\n```\n```c\n// main entry\
    \ point\n...................\nint main void\n/* Initialize ports */\nAD1PCFGL\
    \ = 0x0fff;    // reset all pins that others initialized make them digital\nLATB\
    \ = 0x0000;        // set latch levels for ports\nTRISB = 0x0000;       // set\
    \ IO as outputs for ports\n/* endless loop */\nwhile (1) {\n    delay();\n   \
    \ led = !led;\n}\n```\n```"
  - "[PAGE 47]\n\n+   - Normally PC based C applications will run on and then return\
    \ back to the PC operating system once the main function is finished. For microcontroller\
    \ applications there is no Operating system so if main terminates the complier\
    \ resets the processor by starting execution from the beginning\n\n# 7. I/O initialization\n\
    \n+   - This is within the main function, as mentioned earlier, and it is the\
    \ segment of main that is dedicated to initializing all microcontroller ports\
    \ and peripherals (SFR) before the application can begin to use them. Initialization\
    \ usually happens once in main before it enters into a continuous operating loop.\
    \ Three special function register (SFR) are involved for our application. AD1PCFGL\
    \ is used and configured to turn off all analog associated capability to those\
    \ pins that have analog content. LATB is a latch output setting for all pins associated\
    \ with PORTB pin outputs. In this case all latched settings are zeroed —nothing\
    \ will appear as a high level on output to start. TRISB is the directional setting\
    \ for PORTB that in this case makes them all outputs.\n\n```\nAD1PCFGL = 0xFFFF\n\
    LATB = 0x0000\nTRISB = 0x0000\n```\n\n# 8. Continuous loop\n\n+   - This is the\
    \ primary working segment of microcontroller applications. The continuous loop\
    \ is where all the work gets done. In our loop things we invoke the delay function\
    \ and after this we 'toggle' the current value of LED (which is defined as the\
    \ LATB bit 5 or RB5 pin). By 'toggling' if the current RB5 is value 1 then is\
    \ set to 0, if 0 then it is set to 1. In this way after every delay the LED connected\
    \ to RB5 will blink.\n\n```\nwhile(1)\n    delay()\n    led = !led\n```\n\n# 9.\
    \ Microstick II Status\n\n+   - IDE provides an output widow with the status of\
    \ the Microstick II debugger (if it has been configured as the debugger of choice\
    \ in your"
