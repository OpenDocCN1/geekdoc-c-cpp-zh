    # Chapter 1 – Getting Started


    In this chapter we will guide you through the installation process for Microchip
    MPLAB, the Microchip ''C'' compiler, and the Microstick II programmer/debugger.
    We will test this total install using the demo project "FLASH_LED" to insure that
    all elements of the install are correct and complete. We will then cover some
    of the important hardware elements of our tool suite, starting with an overview
    of Microchip''s 16 bit Microcontroller family, and then covering in more detail
    the PIC24H, and then finally discussing the Microstick II and its operation. This
    chapter will serve as the foundation for all other chapters, and will leave us
    with the necessary development tool suite, and hardware overviews, for all subsequent
    chapter discussions and experiments.


    Special Note: The hardware setup and projects described in this book are written
    for the PIC24H. They are easily configurable with a few simple steps for both
    the PIC24F and the dsPIC33. Details are at the end of this chapter.


    # Introducing Microchip MPLAB IDE


    To reiterate at this point, the Microchip MPLAB IDE is a Windows based program
    that runs on a PC and is used to develop applications for Microchip microcontrollers.
    As an IDE, it provides a single integrated "environment" to develop and test code,
    as part of the embedded design cycle required for all microcontrollers. The environment
    assists the designer in progressing through the "embedded design cycle" without
    the distraction of switching among an array of distinct and different tools, and
    allows for the designer to concentrate on completing the application without the
    interruption of using these separate tools and their associated specific different
    modes of operation.'
  - '[PAGE 15]


    Again, MPLAB IDE, as a framework, functions as a "wrapper" in that it coordinates
    all the tools from a single graphical user interface. For instance, once code
    is written, it must be converted to executable instruction set (object code) and
    then downloaded and programmed into a microcontroller to determine how well it
    works. During this process multiple tools are needed: an editor to write the code,
    a project manager to organize files and settings, a compiler to convert the source
    code to object code and then a hardware programmer/debugger to test the object
    code in operation with the microcontroller. MPLAB along with the Microstick II
    programmer/debugger meets all these requirements, and will serve in this book
    as our basic development environment.


    The basic components and features of MPLAB are shown in the Figure 1-1. In the
    chapters to follow we will continue to discuss and illustrate the detailed use
    this integrated tool set as a part of each chapters'' "hands on" experiments.


    # MPLAB®

    Integrated Development Environment


    +   - GUI Based

    +   - Integrated Project Manager

    +     - Organizers and maintains project file space

    +     - Retains the workspace layout

    +     - Provides quick view of all functions/symbols

    +     - Automatic build operation operations ( single button)

    +   - Syntactic Source code editor

    +     - Color Syntax assisted-assembly and C code entry/review

    +   - Language tools

    +     - MPASM assembler, MPLIB linker, MPLIB Library tool

    +     - C30 C compiler ( free student version)

    +     - Extensive Library support ( Audio, Wireless, graphics, Ethernet, USB)

    +   - Programming and Debug capability

    +     - Fully compatible with Microstick

    +   - Debug

    +     - Simulation (MPLAB SIM software simulator) or in circuit with Microstick
    debug

    +     - Extensive tools sets

    +     - Breakpoint, single step and animate operations

    +     - Stopwatch, Logic Analyzer, Variable Watch, DCM, memory gauges


