  mdcn: "\n我们关注的类别是 CDC。我们将使用一个 UART 转 USB 桥接器，它在微控制器侧提供 UART 接口，在 PC 侧提供符合 USB CDC\
    \ 规范的设备接口。ACRONAME 为其 S22 提供了一个可插拔模块。S22 模块为桥接芯片提供相同的四针连接器用于微控制器侧，并在另一侧提供一个 USB\
    \ 设备连接器。你可以使用常见的 USB Host A 型到 Device B 型连接线连接到 PC。USB 支持“即插即用”。\n\n每个设备在连接到 USB\
    \ 时都会被 PC“枚举”，这意味着设备向 PC 标识其类别类型、操作需求和驱动要求。PC 会检查自己是否满足操作需求，以及该设备标识的驱动程序是否存在于当前软件注册表中。只有当所有这些都完成后，才允许进行通信。然后我们可以在\
    \ PC 上打开超级终端（HyperTerminal），识别与 S22 关联的 COM 端口，配置该 COM 端口，并开始通信。\n\n对于 USB CDC，我们将使用\
    \ ACRONAME 提供的注册表文件 (.INF) 向操作系统注册通信端口，并使用 ACRONAME 提供的 S22 驱动程序。首次连接到 PC 时，系统会将\
    \ S22 视为 USB 上的“新硬件”，并尝试检索驱动程序信息。此时，你需要在 PC 上指定 ACRONAME 驱动程序的存储位置。这是一次性配置要求，之后每次重新连接都会自动完成。USB\
    \ 是 +5V 总线，但是我们只需要使用微型 USB（通用串行总线）上可用的 +3.3V 为 S22 供电。\n\n## 串行通信回顾\n\n串行通信的一些重要提醒和经验法则：\n\
    \n- 消息的大小等于一个起始位、停止位个数、数据位个数、校验位（如果存在）（图中显示 10 位）\n- 波特率\n  - 消息期间的位传输速率，最高可达\
    \ 115K\n- 数据位\n  - 消息中传输的数据位个数\n- 校验位\n  - 消息中存在的可选奇偶校验错误检查位\n\n- 五个 16 位定时器（5\
    \ 个输入引脚）\n- 五个输入捕获——自动脉冲捕获和测量（5 个输入引脚）\n- 五个输出比较/PWM 模块——自动脉冲生成（5 个输出引脚）\n- 两个\
    \ UART（通用异步收发器），具有地址能力（4 个引脚（2 个输入和 2 个输出））\n- 两个 SPI（同步外设接口）（6 个引脚（2 个数据输出，2\
    \ 个数据输入，2 个时钟（输入/输出）））\n- I2C（集成电路间通信）接口（2 个引脚（1 个输入和 1 个输出））\n\n显然，外设引脚的总需求很大，事实上，对于这些\
    \ 28 引脚的 PIC24H 器件，内部外设数量多于可用引脚数量。作为折衷方案，PIC24HJ128GP502 28 支持 PPS，具有 16 个可重新映射的引脚。这些可重新映射的引脚可以配置为上述任何外设的输入或输出。这些引脚被指定为“RP”，表示可重新编程引脚。这几乎等同于自行布局设计自己的器件。\n\
    \n![](img/a9229e7b0ddd9608f171b22b52514f39_134_0.png)\n\n| 引脚 | RP | 模拟 | 变更通知\
    \ | 数字 |\n|---|---|---|---|---|\n| 2 |  | AN0 | CN2 | RA0 |\n| 3 |  | AN2 | CN3\
    \ | RA1 |\n| 4 | RB0 | AN3 | CN4 | RB0 |\n| 5 | RB1 | AN4 | CN5 | RB1 |\n| 6 |\
    \ RB2 | AN5 | CN6 | RB2 |\n| 7 | RP3 |  | CN7 | RB3 |\n| 8 |  |  | CN30 | RA2\
    \ |\n| 9 |  |  | CN? | RA3 |\n| 10 |  |  | CN20 | RA5 |\n| 11 | RP4 |  | CN1 |\
    \ RB4 |\n| 12 |  |  | CN? | RB5 |\n| 13 | RP5 |  | CN27 | RP6 |\n| 14 | RP6 |\
    \  | CN24 | RB6 |\n| 15 | RP7 |  | CN25 | RB7 |\n| 16 | RP8 |  | CN22 | RB8 |\n\
    | 17 | RP9 |  | CN21 | RB9 |\n| 18 | RP10 |  | CN? | RB10 |\n| ... | ... | ...\
    \ | ... | ... |\n\nMicrostick 底部可用的 PIC24HJ128GP502 引脚\n接地引脚 8/19 也可用\n未显示固定 I/O\
    \ 分配\n\n## 图 7-6：PIC24HJ128GP502 PPS 引脚集\n\n## 初始化 PPS\n\n外设引脚选择（Peripheral Pin\
    \ Select，PPS）必须被初始化，一旦初始化后就不能被意外更改。为了实现这一点，Microchip 制定了一系列特定的步骤来配置 PPS。\n\n基本思路如下：在主程序开始时，你可以解锁并配置指定外设的\
    \ PPS，先配置输出，再配置输入。完成此操作后，PIC24H 被锁定并保持该引脚状态配置。为此，需要设置 OSCON SFR 寄存器中的 IOLOCK 位。一旦设置，PPS\
    \ 除非发生复位，否则无法解除。PPS 锁定和解锁控制实际上是通过特殊代码序列来实现对 OSCON SFR 的访问。这确保了随机的代码读写无法访问和污染固定的\
    \ PPS 设置。总体软件流程如图 7-7 所示。\n\n### 外设锁定与解锁\n\n- 复位后初始化设备\n- 为了最大程度保护设备，设置 IOL1WAY\n\
    \  - PPS 无法解锁\n- PPS 在运行期间提供灵活性\n- 持续监控设备以检测意外变化\n\n![](img/a9229e7b0ddd9608f171b22b52514f39_135_0.png)\n\
    \n设置 IOL1WAY 后，PPS 寄存器无法解锁\n\n图 7-8 为外设初始化 PPS\n\n图 7-8 展示了初始化 PPS 所需代码的示例，这些代码将\
    \ RP10 配置为 UART2 输入接收，将 RP11 配置为 UART2 输出发送。注意使用 'C' 库宏来设置和复位 OSCON SFR 中的锁。该宏执行特定的\
    \ PPS 锁定和解锁代码序列。\n\n外设代码（在我们的例子中，UART2 TX 为 5），然后设置适当的输出 PPS SFR 寄存器以进行写入。在我们的例子中，对于\
    \ RP11 分配，这里是 RPOR5。因此，我们将代码写入 RPOR5 的低位，如图所示。参见图 7-10。\n\n## 可重新映射输出\n\n![](img/a9229e7b0ddd9608f171b22b52514f39_137_0.png)\n\
    \n图 7-10：RP10 的带 SFR 示例的可重新映射输出\n\n提醒一下，PPS 的优点如下：\n\n- 允许最佳使用片上外设\n- 任何数字外设都可以重新映射到任何\
    \ RP 引脚\n- 引脚分配在软件中设置\n  - 输出将外设分配到特定引脚\n  - 输入将引脚分配到特定外设\n  - 支持一个引脚上的多个输入外设功能\n\
    \n## 实验 1 “使用 PC 实现串行接口”\n\n第一个实验将使用 PIC24H 的 UART2，通过 RS-232 与运行超级终端软件的 PC 进行通信。该实验遵循图\
    \ 7-3 的连接方案。\n\n图 7-11 显示了从用户代码（通过微控制器 UART 到 RS-232）到带有 Windows 驱动程序并使用超级终端的\
    \ PC 之间完整的端到端通信框图流程。应用程序发送在 PC 键盘上键入的 ASCII 字符，然后使用超级终端显示窗口显示这些字符。在 PC 键盘上键入的\
    \ ASCII 字符通过串行通信发送到 Microstick II 的 UART，并在接收后被“回显”（或传输）到 PC 进行超级终端显示。\n\n![](img/a9229e7b0ddd9608f171b22b52514f39_138_0.png)\n\
    \n图 7-11：实验 1 的串行通信层\n\n## 软件配置\n\n该实验在 MAIN 中包含 `#include \"CONU2.H\"`，并在项目中包含\
    \ CONU2.C 驱动程序源代码，允许从用户应用程序代码侧使用 UART2 串行端口。串行通信中使用的 CONU2 库函数有：\n\n- `initU2\
    \ ()` – 使用 PIC24H 的 UART2 初始化串行端口，对应 Microstick II 的 RB11 和 RB10，或引脚 22 和 21。引脚\
    \ 21 是 Microstick II UART2 的输入接收（RX），引脚 22 是 Microstick II UART2 的输出发送（TX）。UART2\
    \ 配置为 1200 波特率、8 位数据、无校验、1 位停止位，简写为 1200 8N1。\n- `putU2( character)` – 将一个字符写入串行端口\n\
