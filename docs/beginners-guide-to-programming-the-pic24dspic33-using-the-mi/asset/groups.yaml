    \ bit by bit stream at a fixed bit or baud rate. In this manner the transmit hardware\
    \ functions as a PISO (Parallel in Serial Out) digital register. The receive hardware\
    \ takes in serial data and forms a parallel data (byte) for transfer to the PIC24H\
    \ CPU. The receive section functions as a SIPO (Serial in Parallel Out) digital\
