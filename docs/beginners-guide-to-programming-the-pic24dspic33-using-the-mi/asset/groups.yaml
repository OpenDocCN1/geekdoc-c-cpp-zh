    源代码和完整的演示说明，以及套件装配说明，都包含在随套件提供的 Experimenter CD-ROM 上。演示以一系列循环的十一个不同闪屏开始，每个闪屏持续约
    4 秒。用户通过按下其中一个按钮来调用特定的功能演示。随套件提供的两个入门功能演示（数字温度计和 RGB LED）需要一些额外的硬件和连接，如图所示。第三个功能演示（Clock）不依赖任何额外硬件。


