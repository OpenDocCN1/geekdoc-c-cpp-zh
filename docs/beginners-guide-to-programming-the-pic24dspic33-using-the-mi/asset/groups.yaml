    \ pot value to change readings ---full CCW of pot should be zero count and zero\
    \ volts, full CW of pot should be 4096 count and +3.3V. If readings are erratic\
    \ you have a wiring error with pot or are on the wrong analog input pin.\n\nCongratulations\
    \ you have a simple ADC voltmeter capability.\n\n## 16 Bit Micro Experimenter\
    \ (optional)\n\nAn example project Experimenter based LCDDEMO is supplied. No\
    \ hook up diagram is required as the Experimenter contains all LCD connections\
    \ on-board. Because of differences between the Experimenter and Microstick II\
    \ LCD connections the Microstick II's experiments will not run on the Experimenter\
    \ without modification.\n\nFor this Experimenter project we show how to use of\
    \ each of the above LCD functions and then how to call them from your MAIN file.\
    \ Let's walk through the flowchart and then the code. LCDDEMO starts by declaring\
    \ two strings message# 1 and message# 2. Each message is configured to be fewer\
    \ than 16 characters to keep the display nice and neat, that is, keeping each\
    \ message to within a single display row. The next step is to initialize the LCD\
    \ and clear display contents before use. The next step after this is to position\
    \ the cursor to beginning of row one (cursor position =0) and write out message\
    \ #1. We then position the cursor to the beginning of row two (cursor position\
    \ =16) and write out message #2.\n\nJust to keep things interesting we then position\
    \ the cursor to the middle of line three (cursor position = 36) and write out\
    \ five characters. If you haven't figured it out by now, cursor positions 0 to\
    \ 15 correspond to the top row, row #1, of the LCD display. Positions 16-31 are\
    \ row #2 and Positions 32-47 correspond to the bottom row, or row #3. The LCD\
    \ is initialized so that the cursor itself is not visible, and the cursor position\
    \ automatically advances to the next position when data is written to the display.\
    \ Any data that is written to the LCD and display must be in ASCII (American Standard\
    \ for Information Interchange) format.\n\n## Review of Key Application using LCD:\n\
    - LCD is a configurable intelligent device that is commanded by the PIC24H during\
    \ application.\n\n## Review of Source Code Key Features:\n- Use of include directive\
    \ makes the code highly modular and in this case an ADC driver library was introduced.\n\
    - Project contains multiple files for each driver where the explicit driver function\
    \ are identified in .h and the body in .c\n- Main just includes the .h it needs\
    \ and can directly access all driver code\n- Global variable identified before\
    \ main function is accessible by all code\n- Here we introduced another library\
    \ function the LCD.\n\n## Exercise :\n- 1. Try changing first experiment's messages\
    \ to your own and rerun the experiment.\n- 2. Determine where BCD1000 reside in\
    \ source. How is it accessible by main?\n- 3. Make experiment 2 use the pot wiper\
    \ to a different analog input\n- 4. Try using the averaging function from the\
    \ ADC library in experiment 2. Note that display readings are more stable with\
    \ averaging.\n\ninterrupt controller, and finally you must have a specific function\
    \ call, which is designated the interrupt service routine, that will be invoked\
    \ and executed once the interrupt occurs. There are some more details about specifics\
    \ of the service routine, its construction, and what it minimally must do. We\
    \ will cover this shortly.\n\nOnce a timer interrupt condition occurs, the current\
    \ state (program counter, status registers, and flags) of the CPU is saved or\
    \ \"pushed\" onto a stack (first-in-first-out RAM buffer internal to the PIC24H).\
    \ The timer interrupt service is then invoked for CPU execution to handle the\
    \ timer interrupt condition. Once the CPU exits the service routine, the CPU state\
    \ prior to the interrupt is restored or \"popped\" from the stack. The CPU then\
    \ resumes its normal operations. It in a sense interrupts to allow for an \"on\
    \ demand\" peripheral processing service.\n\n## Hardware description\n\nWe have\
    \ seen this specific hardware setup in Chapter 2, here we will use it again. It\
    \ is the familiar blinking LED prototype, but in this experiment the software\
    \ is entirely new. We will be using entire new techniques with the timer. The\
    \ same software I/O setup will be common in all the experiments. In these experiments\
    \ we want to connect a single LED to bit 5 of PORTB or RB5 and set RB5 to be a\
    \ digital output.\n\nRB5 is pin number 14 on the PIC24HJ128GP502. The device is\
    \ a 28 pin DIP, so there are 14 pins on each side of the chip. Looking down on\
    \ the chip there is a notch in the package to indicate pin 1, all the pins are\
    \ numbered 1 to 28 and go counter clockwise on the device. This would make pin\
    \ 14 or RB5 the last pin on the bottom right hand side of the chip.\n\nA schematic\
    \ is shown in Figure 6-2. The PIC24H digital output can drive up to 25 milliamps\
    \ on a digital output. We don't need all this current to turn on a LED (3 milliamps\
    \ is more than enough), so we use a current limiting resistor (1K) in series with\
    \ the LED. The circuit basically a series circuit where RB5 tied to one side of\
    \ the resistor, the other side of the resistor is connected to LED anode, and\
    \ finally the LED cathode is tied to ground. In this way when we make RB5 =1 the\
    \ LED will light up, if we make RB5 =0 the LED will turn off.\n"
