    Figure 3-1: I2C Configuration


    # Generic I2C message Protocol


    I²C defines several basic types of message, each of which begins with a START
    and ends with a STOP. Here are two examples:


    +   - Single message where a master writes data to a slave;

    +   - Single message where a master reads data from a slave;


    # I2C Physical Layer


    At the physical layer, both SCL & SDA lines are of open-drain design, thus, pull-up
    resistors are needed. Pulling the line to ground is considered a logical zero
    while letting the line float is a logical one. This is used as a channel access
    method. Transitions for data bits are always performed while the clock is low;
    transitions while it is high are "start" and "stop" markers delimiting a bus transaction.


    When idle, both lines are high. To start a transaction, SDA is pulled low while
