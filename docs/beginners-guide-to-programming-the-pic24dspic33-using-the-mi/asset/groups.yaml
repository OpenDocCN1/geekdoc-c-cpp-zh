    \n## 16位Micro Experimenter（可选）\n\n这是16位Micro Experimenter的UART实验。它的操作方式与本章实验1和实验2完全相同，实际上使用了为J3\
    \ I/O连接器上不同引脚组修改的类似源代码。使用源代码UARTDEMO Experimenter。你需要构建代码，并使用PICkit 2/3作为调试器/编程器。如果使用PICkit\
    \ 2，Experimenter可以在有或没有外部电源的情况下使用（PICkit 2会检测电源，如果未检测到电源，则自动供电）。此外，Experimenter需要一个带串联电阻的外部LED，连接到J3引脚3（参见连接图）。\n\
    \n![](img/a9229e7b0ddd9608f171b22b52514f39_146_0.png)\n\n图7-23：Experimenter UART演示连接\n\
    \n## 回顾PIC24H UART功能\n\n问题：\n\n1. 定义UART。\n2. 定义RS-232。\n3. 定义DCE。\n4. 定义DTE。\n\
    5. 什么是波特率？\n6. 1200 8N1是什么意思？\n7. HyperTerminal的用途是什么？\n8. 我们如何让输出为0至+5V的PIC符合RS-232的-12至+12V标准？\n\
    9. PIC可实现的最高波特率是多少？需要什么时钟？\n10. 实现双向通信所需的最少RS-232引脚连接数量是多少？\n11. 起始位和停止位的作用是什么？\n\
    12. 奇偶校验的作用是什么？\n13. PIC24H有多少个UART？\n14. 半双工是什么意思？\n15. 全双工是什么意思？\n16. RS-485与RS-232有何不同？\n\
    17. PPS有哪些优点？\n18. PIC24HJ128GP502有多少个可重新编程的引脚？\n19. PPS在代码中的什么位置出现？\n20. 定义USB。\n\
    21. USB能否替代传统的RS-232通信？如果可以，请说明方式。\n\n### 练习：\n\n1. 在当前练习中配置UART1以替代UART2。\n2.\
    \ 将波特率改为1200。\n\n让我们仔细看看SPI接口。它需要三个信号：SDO（串行数据输出）、SDI（串行数据输入）和SCLK（串行时钟）。SPI通常用于一对通信实体之间。一个实体的SDO连接到另一个实体的SDI。时钟源自“主”侧，即发起并维持通信的实体。“从”通信是对主设备的响应（参见图8-2）。没有协议，只有数据移动。双方都用作移位寄存器，公共时钟用于将数据从一个发送寄存器（SPI\
    \ BUF）移入接收寄存器（SPI BUF）。可选地，还可以使用第四个信号：CS，即片选。该信号用于使能从设备进行通信，并且可以复制以允许SPI通信接口在一个主设备和多个从设备之间共享（但一次只能一个从设备）。总结如下：\n\
    \n- 简单的接口\n- 使用3到4个信号\n  - CS、SDO、SDI、CLK\n- 基于移位寄存器概念\n- 非常高的速度（使用PIC24H时最高可达20\
    \ MHz）\n- 稳健且具有很强的抗噪性\n\n![](img/a9229e7b0ddd9608f171b22b52514f39_149_0.png)\n\
    \n图8-2：SPI串行通信\n\n## 介绍串行EEPROM\n\n我们的实验将使用串行EEPROM来演示SPI操作。具体来说，我们将使用Microchip\
    \ 25LC256 EEPROM器件，它支持256 kbit（即32K x 8字节）的非易失性存储器。EEPROM是一种存储技术，允许我们在程序控制下存储数据，并保留\n"
