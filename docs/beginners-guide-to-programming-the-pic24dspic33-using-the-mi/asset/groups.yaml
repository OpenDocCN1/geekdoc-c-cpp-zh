    # Timer 1 - 16 bit Experiment using Interrupt


    Interrupts appear in the PIC24H C code as unique function declarations as shown
    in the following template using Timer1 (see Figure 6-7). You will need to follow
    this template in order for the MPLAB ''C'' Compiler C30 to recognize the function
    code as a specific interrupt vector.


    ```

    void __attribute__((interrupt, no_auto_psv)) _T1Interrupt(void)


    led = led ...

    _T1IF

    ...

    ```


    Figure 6-7 Interrupt Service Routine


    Interrupt functions accept no parameters and returns no parameters (note the use
    of void), and each interrupt source has its own specific function call. The code
    that executes during an interrupt function is called the "interrupt service routine".
    General recommendations for writing an interrupt service are; first, to perform
    the minimal essential processing needed for the service (that is-- get in and
    out quickly), and, secondly, do not call any other functions during the service.
    Finally, an interrupt service must reset the original interrupt flag that initiated
    the interrupt before exiting. If the interrupt service communicates with other
    parts of the program, then this communication must occur through the use of shared
    variables.


    Let now view the entire main code. Here''s a snapshot. It is broken down into
    four discrete sections for our present discussions. These sections should be compared
    against the earlier non-interrupts section.'
