    Figure 9-1: Output Compare Peripheral


    The OCx module can use either the PIC24HJ64GP502 16 bit Timer 2 (TMR2) or Timer3
    (TMR3) as a time base, and the period setting for the output pulse waveform. PR2
    is the period setting for Timer 2 and PR3 is the period setting for Timer 3. In
    our examples we will use Timer 2. The OCxRS and OCxR registers are loaded with
    a 16 bit value to control the width of the pulse generated during the output period.
    This value is compared against the Timer during each period cycle. The OCx output
    starts high and then when a match occurs OCx logic will generate a low on output.
    This will be repeated on a cycle by cycle basis (See Figure 9-2).


    This is OCx Pulse Width Modulation (PWM) mode. An important notion in thinking
    about PWM is that it allows dynamic changing of the DC voltage level to a load.
    Wait a minute you say --- where''s the DC voltage here? Think of the DC voltage
    as an average voltage value of the pulsed DC across the waveform period. For example,
    if we have pulse high for 50% of the period consistently, and the pulses are +3.3V
    then we are supplying on the average 50% of 3.3V to the load or 1.65V. In order
    to change the pulse width while the system is running we simply write into OCxRS
    and it automatically loads into OCxR on the next cycle.'
