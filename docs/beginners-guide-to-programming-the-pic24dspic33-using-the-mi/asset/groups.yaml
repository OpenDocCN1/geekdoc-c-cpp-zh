    到目前为止还不错，但还不太令人兴奋。MPLAB 运行良好——但实质内容在哪里？我们需要加大筹码。让我们关闭这个配置（点击 IDE 右上角的红色 X 按钮），然后直接启动一个演示项目。在这种新场景下，我们应该会看到
    MPLAB 中填充了特定演示项目的组件，并在工作区中按上次保存的状态显示这些功能组件。


    导航到存储演示文件夹的位置，打开该文件夹并找到项目文件夹 FLASH_LED。在 Windows 下，你应该会看到以下项目文件内容（见图 1-6）。项目文件内容包括
    C 源代码（.C）和目标代码（.O），一个用于显示微控制器存储器中代码和数据分配位置的 MAP 文件，以及一个可执行文件（.HEX）。目前对我们来说最重要的文件是项目文件（.MCP）和工作区文件（.MCW）。最后提到的这两个文件都带有
    MPLAB IDE 的徽标。双击标记为 .MCP 文件的项目图标，MPLAB 将根据该项目的最后保存的工作区重建项目。工作区捕获了打开了哪些窗口、微控制器如何配置以及设置了哪些调试选项。工作区由
    .MCW 文件捕获。图 1-6 展示了整个过程。


    ![](img/a9229e7b0ddd9608f171b22b52514f39_19_0.png)


    接下来，我们使用这个项目进一步仔细查看 MPLAB 的内容，以便更好地理解 MPLAB 的可视化环境。在这个项目工作区中，有几个窗口是打开的。首先是整体项目窗口，该窗口以树状结构显示属于此项目源代码构建的所有相关用户文件或支持文件。这里只出现了两个源代码文件。你可以通过双击项目窗口中的特定文件来查看任何文件的内容。另一个打开的窗口是源代码窗口（图
    1-7）。


    请注意，这个窗口是带选项卡的，项目中的所有源代码文件都已打开供查看，但一次只能查看一个文件。你可以通过单击与特定源代码文件对应的选项卡来切换源代码视图。工作区中另一个可见的窗口是输出窗口。输出窗口有许多选项卡，你也可以在调试器状态、构建/编译错误以及其他几个选项之间切换视图（我们稍后将在本书中学习所有这些功能）。最后，主窗口顶部还有
    MPLAB 面板和工具栏。在这里，你可以指示 MPLAB 执行你想要的操作。


    如果你此时尚未连接 Microstick II，输出窗口应该会显示此信息（这是因为 Microstick II 调试器作为原始工作区配置的一部分处于活动状态）。如果
    Microstick II 尚未连接，请立即连接。首次连接 Microstick II 时，会自动安装 Microchip USB 驱动程序。完成后，Windows
    操作系统应该会自动识别 Microstick II 连接。一旦 Microstick II 已连接且驱动程序已安装，输出窗口应显示调试器已连接。Microstick
    II 的调试 LED 应保持常亮。


    ![](img/a9229e7b0ddd9608f171b22b52514f39_22_0.png)


    图 1-8：构建演示代码


    现在进行执行，这是整个过程中绝对的最后一步。我们所有辛勤工作的回报就在这里。让我们回顾一下目前的状态：我们已经成功构建，并且 Microstick II 已连接。现在只需对设备进行编程并运行调试器。这是一个两步过程；我们再次需要将注意力转向工具栏。单击编程按钮，然后单击运行按钮（图
    1-9）。


    构建全部按钮


    ![](img/a9229e7b0ddd9608f171b22b52514f39_23_0.png)


    图 1-9：对 Microstick II 编程


    单击运行后，Microstick II 应开始运行，IDE 应在窗口左下角显示一个可见的活动栏。此外，工具栏上的运行按钮将变为禁用状态，只有暂停按钮可用。你可以单击工具栏上的暂停按钮，Microstick
    II 将停止在微控制器正要开始执行的当前行。源代码窗口（如果打开）中将出现一个绿色箭头，指示微控制器暂停在哪一行源代码处。然后你可以选择从那里继续运行（单击运行），或使用单步执行（单击单步）一次执行一行源代码，或复位（单击复位），微控制器将从代码开头重新开始执行。


    这里，简要介绍到目前为止讨论过的、位于 IDE 工具栏中的一些重要调试功能会很有帮助（参见下面的要点列表和图 1-10）：


    - Make——仅重新构建新代码

    - Build All——重新构建项目窗口中的所有代码

    - 对设备编程（在此情况下用于调试功能）

    - Run——运行程序

    - Pause——停止程序

    - Single Step——从你先前暂停的位置执行一行代码，并在执行后暂停。

    - Reset——复位设备，使下一次运行或暂停执行从代码开头开始


    ![](img/a9229e7b0ddd9608f171b22b52514f39_24_0.png)


    恭喜——你现在拥有了一个功能完整的微控制器开发系统！借助这套工具，你现在可以开始进行本书中的练习，并逐渐为 16 位微控制器嵌入式设计技术做好准备和训练。


    在接下来的章节中，我们将更详细地介绍 MPLAB 的功能和特性。现在，让我们讨论 Microstick II 和 PIC24H 微控制器的一些重要硬件特性，以便更好地理解这些重要资源及其全部能力。


    ## 安装错误


    - 1. 源代码编译错误——如果出现编译错误，你可能无意中在源代码窗口中键入或输入了文本，IDE 会将其视为构建的新代码。如果出现这种情况，请关闭 IDE
    并且不要保存工作区，重新加载演示代码并重新开始。

    - 2. ''C'' 编译器未安装——如果编译操作根本没有发生，并且输出窗口报告找不到编译器；你可能覆盖了编译器的默认位置。你现在有两个选择。第一个选择是直接将编译器重新安装到
    IDE 的默认位置


    数字控制器操作，如电机控制、数字电源转换、数字滤波。该系列以其专用的 MAC（乘法累加单元）为标志，以执行高速数学运算。该系列还使用 40 位累加器以确保数学运算不会溢出。dsPIC30
    是 +5V 器件。dsPIC33 是 +3.3V 器件。Microchip 专门为这些器件免费提供自己的信号处理和高速度数学库。在本书中，我们将重点介绍 PIC24H
    的实验和操作，这些内容也可用于理解 PIC24F 和 dsPIC33。


    Microstick II 带有插座，可支持 PIC32（32 位微控制器）、PIC24H、PIC24F 和 dsPIC33（16 位微控制器）等目标器件。它出厂时插座中装有
