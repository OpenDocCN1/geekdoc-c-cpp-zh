    +   - Five 16-bit timers (5 input pins)

    +   - Five input capture –automatic pulse capture and measurement (5 input pins)

    +   - Five Output Compare / PWM modules –automatic pulse generation (5 output
    pins)

    +   - Two UART ( Universal Asynchronous Receiver Transmitter) with address capability
    (4 pins (2 in and 2 out))

    +   - Two SPI (Synchronous Peripheral Interface) ( 6 pins (2 data out, 2 data
    in, 2 clock (in/out))

    +   - I2C ( Inter Circuit Communication) interface ( 2 pins (1 in and 1 out))


    Obviously the total peripheral pin needs are large and, in fact, and with these
    28 pin PIC24H devices, there are more internal peripherals then there are available
    pins. As a compromise solution the PIC24HJ128GP502 28 supports PPS with 16 remappable
    pins. These remappable pins are configurable as input or output to any of the
    above peripheral set. These pins are designated with "RP" for reprogrammable pin.
    This is the closest thing to having to layout of your own device.


    ![](img/a9229e7b0ddd9608f171b22b52514f39_134_0.png)


    | Pin | RP | Analog | Change Notification | Digital |

    |---|---|---|---|---|

    | 2 |  | AN0 | CN2 | RA0 |

    | 3 |  | AN2 | CN3 | RA1 |

    | 4 | RB0 | AN3 | CN4 | RB0 |

    | 5 | RB1 | AN4 | CN5 | RB1 |

    | 6 | RB2 | AN5 | CN6 | RB2 |

    | 7 | RP3 |  | CN7 | RB3 |

    | 8 |  |  | CN30 | RA2 |

    | 9 |  |  | CN? | RA3 |

    | 10 |  |  | CN20 | RA5 |

    | 11 | RP4 |  | CN1 | RB4 |

    | 12 |  |  | CN? | RB5 |

    | 13 | RP5 |  | CN27 | RP6 |

    | 14 | RP6 |  | CN24 | RB6 |

    | 15 | RP7 |  | CN25 | RB7 |

