  mdcn: "\n说明这一点。让我们将 PIC24HJ128GP502 部件与 Microchip 家族中一个众所周知的 8 位成员 PIC16F887 进行比较。\n\
    \n我们将比较数据大小、内存大小、时钟频率以及以 MIPS（每秒百万条指令）衡量的最终指令速度。比较显示，PIC24H 的 Flash 内存容量是 16 倍，RAM\
    \ 容量超过 20 倍，MIPS 速率是 PIC16F887 的 8 倍。如果我们还比较外设内容，我们会发现 16 位在数值上超过了 8 位内部外设的大多数部分，比例为\
    \ 2:1，并引入了新的外设。最后，由于 16 位数据总线是 8 位数据总线的 2 倍大小，因此在任何一条指令期间处理的 数据量是两倍。凭借这种类型的处理能力和外设能力，您可以处理\
    \ 8 位世界单独无法处理的更广泛的应用。我们在介绍中简要讨论了这些内容，但可以包括具有 TCP/IP 堆栈的网络连接、高分辨率图形、ZIGBEE、802.11b\
    \ 等无线堆栈、SD-CARD 容量为 2GB+ 且格式化为 WINDOWS 兼容文件 I/O，等等。\n\n| | PIC24HJ128GP502 | PIC16F887\
    \ |\n|---|---|---|\n| 数据总线 | 16 位 | 8 位 |\n| Flash 大小 | 128K Flash | 8K Flash\
    \ |\n| RAM 大小 | 8K RAM | 368 RAM |\n| 时钟频率 | 80 MHZ | 20 MHZ |\n| MIPS | 40 MIPS\
    \ | 5 MIPS |\n| 供电电压 | 3.3V 工作 | 5 V 工作 |\n\n## PIC24HJ128GP502 微控制器\n\n让我们更深入地探讨一下\
    \ PIC24HJ128GP502 微控制器。如前所述，该器件预封装在“细长 DIP”中。如前所述，PIC24HJ128GP502 是一款 +3.3VDC\
    \ 逻辑器件，支持 40 MIPS 的运行速度，同时具有 128K FLASH、8K RAM。尽管该器件是 +3.3V 逻辑，但它也可以在某些引脚上支持 +5V\
    \ 输入（参见 +5V 输入容忍引脚），并且可以通过在输出电平上使用器件可配置的开漏设置来驱动 +5VDC 输出逻辑电平。中断处理和响应时间是使用微控制器进行任何实时操作时需要考虑的重要因素。PIC24H\
    \ 在这方面配备齐全。它具有内部中断控制器，对中断的响应保证 5 个周期延迟，最多可用的中断源为 45 个，七个优先级级别，五个陷阱用于任何处理器异常处理（例如除以零）和三个外部中断。\n\
    \nPIC24H 具有内置的直接内存访问（DMA）外设，支持 8 个 DMA 通道，具有独立的双端口 2KB RAM\n\n作为 PIC24H 的最后说明，您不仅使用目标代码对其闪存进行编程，而且还通过对其内部“配置字”进行编程来对其配置设置进行编程。配置字设置可以使用\
    \ MPLAB GUI 设置，也可以在源代码中作为编译器指令集成。配置字本身驻留在闪存中，但它是一个保留位置，不被视为代码区域的一部分。配置字控制时钟设置，例如时钟源（即外部时钟、内部时钟、时钟类型），或器件是否在调试模式下进行编程，或者器件是否配置为最终发布模式（程序模式）。配置字还设置用于\
    \ ICSP 的引脚，最后设置看门狗计时器的使用。我们将在后面的章节中介绍这些具体细节，但在本章中介绍的演示 LED_FLASH，其特定配置设置为禁用外部振荡器，使用驻留在\
    \ PIC24H 中的内部 8MHz 振荡器，选择 PIC24HJ128GP502 的引脚 14 和 15 作为 ICSP 数据和时钟，并禁用看门狗计时器。\n\
    \n## Microstick II 硬件描述\n\n现在让我们进入 Microstick II 的操作细节。重申一下，Microstick II 旨在为用户提供易于使用、经济的\
    \ 16 位数字信号控制器和微控制器的编程/调试器，并完全集成到 Microchip 的 MPLAB 集成开发环境中。\n\nMicrostick II 支持编程/调试所需的所有基本功能。它可以独立使用或插入原型板。一旦您对设计感到满意并且认为所有错误都已修复，您就会将微控制器从调试模式中取出，然后为独立操作（发布模式）对器件进行编程。在发布模式下，不再需要\
    \ MPLAB。这里唯一的<|message|>要求是保留对 Microstick II 的 USB 连接以保持微控制器的供电。\n\n另一个选项是从 Microstick\
    \ II 中取出微控制器并将微控制器直接插入原型中，而不使用 Microstick II。为此，您需要为独立微控制器提供自己的电源、地线和主复位。我们将在后面的一些章节中介绍此过程。\n\
