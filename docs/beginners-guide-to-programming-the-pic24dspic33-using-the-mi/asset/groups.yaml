    和 PIC24FJ64GB002。所有这些器件均为 +3.3VDC 逻辑，并具有相似的引脚配置。PIC24H 和 dsPIC33 具有 128K Flash
    和 8K Ram 的存储容量，两者都可以高达每秒 4000 万条指令（MIPS）的满速率运行。PIC24H 的存储容量减少为 64K Flash 和 8K
    Ram，速率为 32 MIPS。


    ![](img/a9229e7b0ddd9608f171b22b52514f39_26_0.png)


