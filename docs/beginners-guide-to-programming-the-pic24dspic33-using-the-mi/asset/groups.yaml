    \ 吸收CO₂\n    - 释放O₂\n    - 合成有机物（葡萄糖）\n    - 储存能量\n  - **细胞呼吸**\n    - 消耗O₂\n\
    \    - 释放CO₂\n    - 分解有机物\n    - 释放能量（ATP）\n\n第 5 章。打开此文件夹，然后打开电压表文件夹。双击 PIC24HVOLTMETERDemo\
    \ 项目。MPLAB 实验项目应会打开。\n\n在调试模式下构建并编程 Microstick II，输出窗口应显示 Microstick II 已连接，然后单击\
    \ RUN。此时应该会看到类似图 5-9 的显示，其中同时显示 ADC 计数值以及与该计数值对应的电压。尝试改变电位器的值以改变读数——电位器完全逆时针旋转时，计数值应为\
