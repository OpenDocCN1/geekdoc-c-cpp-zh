  md: '![](img/a9229e7b0ddd9608f171b22b52514f39_183_0.png)


    Figure 3-1: I2C Configuration


    # Generic I2C message Protocol


    I²C defines several basic types of message, each of which begins with a START
    and ends with a STOP. Here are two examples:


    +   - Single message where a master writes data to a slave;

    +   - Single message where a master reads data from a slave;


    # I2C Physical Layer


    At the physical layer, both SCL & SDA lines are of open-drain design, thus, pull-up
    resistors are needed. Pulling the line to ground is considered a logical zero
    while letting the line float is a logical one. This is used as a channel access
    method. Transitions for data bits are always performed while the clock is low;
    transitions while it is high are "start" and "stop" markers delimiting a bus transaction.


    When idle, both lines are high. To start a transaction, SDA is pulled low while
    SCL remains high. After a start, so the next step is to pull SCL low. Arbitration
    and ensures there is only one transmitter at a time. While SCL is low, the transmitter
    (initially the master) sets SDA to the desired value and (after a small delay
    to let the value propagate) lets SCL float high. The master then waits for SCL
    to actually go high, when SCL is high, the receiver latches the bit, and the master
    waits a minimum time then pulls it low again. This completes transmission of one
    bit.


    After every 8 data bits in one direction, an "acknowledge" bit is transmitted
    in the other. The transmitter and receiver switch roles for one bit and the erstwhile
    receiver transmits a single 0 bit (ACK) back. After the acknowledge bit, the master
    may do one of several things. Here are two examples:


    +   1. Prepare to transmit another byte of data: set SDA to the desired bit value
    and pulse SCL high.'
  merge: -1
  img_proc: true
