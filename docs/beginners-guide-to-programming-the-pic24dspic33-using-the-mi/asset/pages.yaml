    Bus) port can easily be adapted to your serial communication needs. Again ACRONAME
    has a solution (S22), with an UART to USB Brainstem. All PIC24H to ACRONAME connections
    are identical to RS-232. We need to use a host to device USB cable to connect
    the PC to the ACRONAME.


