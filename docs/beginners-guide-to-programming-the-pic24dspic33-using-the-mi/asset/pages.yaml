- pgno: 34
  md: 'Figure 1-18 shows the Microstick II on a Solderless breadboard and powered
    via USB connection. The debug LED is on either blinking or steady depending on
    whether or not MPLAB is communicating with the on-board debugger.


    ![](img/a9229e7b0ddd9608f171b22b52514f39_34_0.png)


    Green Debug LED on (hooked to MPLAB)


    User Red LED blinking because of running program


    PIC24HJ128GP502 Microcontroller


    Microstick II connected to PC via USB


    Figure 1-18: Connecting USB to Microstick II


    Note that with the Microstick II as installed in these photos and given its board
    size of 20x76 mm column pin access is limited to two connections each. This is
    more than enough for most prototyping efforts.


    # The 16 Bit Micro Experimenter (optional)


    The Microstick II development system is the primary focus for this book. The Microstick
    II serves as a low cost introductory development system. As you further develop
    your experimental repertoire and wish to include elements like the, built-in power
    supply LCD, EEPROM, buttons etc. a lot of the recurring wiring can be cumbersome.
    An alternative for moving beyond the Microstick II is the 16 Bit Micro Experimenter.
    In each chapter of this book a 16 bit Micro Experimenter option will be discussed.
    A complete description of the Experimenter is given in Appendix A. The Experimenter
    is available for purchase through www.Kibacorp.com . The Experimenter facilitates
    prototype exploration and testing of Microchip 16 bit'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'PIC24H/PIC24J/dsPIC33 Microcontroller with full on board support and peripheral
    capabilities. These capabilities support an extensive prototyping circuit environment
    without the need to rebuild any electronics. Like the Microstick II the Experimenter
    plugs directly into a Solderless breadboard. The Experimenter is socketed allowing
    it to easily support a number of Microchip 16 bit SDIP parts like the PIC24FJ128GP502
    (which is included with the Microstick II). The Experimenter comes with a PIC24FJGA002.


    A photo of the 16 bit Experimenter situated in a Solderless Breadboard is shown.
    The Experimenter on-board support has 16x3 LCD. 4 user pushbuttons, on-board power
    regulation (with power on LED indicator and power on/off switch), and a 32KB EEPROM,
    power on reset button, ICSP (In Circuit Serial Programmer and Debugger Interface),
    and finally an I/O Expansion Connector.


    A photo of the 16 bit Experimenter situated in a Solderless Breadboard is shown.


    ![](img/a9229e7b0ddd9608f171b22b52514f39_35_0.png)'
