- pgno: 198
  md: '+   - **RTCCProcessEvents ()** - The function grabs the current time from the
    RTCC and translate it into strings. Must be called periodically to refresh time
    and date strings `_time_str` and `_date_str`. Each string is 16 ASCII characters


    The above functions work directly with the RTCC without the advantage of the LCD
    and pushbuttons. Using the LCD and pushbuttons makes working with the RTCC a lot
    easier, and this is covered in a chapter 10 in this book for the 16 Experimenter.


    # *Demos that come with PIC24F*


    The Experimenter comes with a P24FJ64GA002 that is preprogrammed with the following
    built-in demos. The demos were written using Microchip free MPLAB and PIC24 C
    code. The PIC24 C Compiler, MPLAB C30 v3.11b (or later), Student Edition is free
    and was used for this demo. The link is below to download and see a full description
    of the compiler.


    http://www.microchip.com/C30


    Source code and full demo description as well as kit assembly instruction are
    included on the Experimenter''s CD-ROM that comes with the kit. The demo starts
    as a revolving series of eleven different flash screens, each lasting about 4
    seconds. The user invokes a specific functional demo by pushing one of the pushbuttons.
    Two of the introductory functional demos (digital thermometer and RGB LED) that
    come with the kit require some additional hardware and hook-up as shown. A third
    functional demo (Clock) does not rely on any additional hardware.


    These functional demos are intended to allow user to gain familiarity with the
    Experimenter and insure its proper operation after kit assembly. As mentioned
    earlier, they can be invoked using the pushbuttons anytime during the flash screen
    displays and then can return to Flash Displays by simply pressing pushbutton S4.'
  merge: -1
  img_proc: true
- pgno: 199
  md: '# Digital Thermometer Demo


    # Thermometer


    # Thermal sensor LM34Z


    +   - Sensor VDD -> RAW + (+5VDC)

    +   - Sensor GND -> RAW - (GND)

    +   - Sensor Out -> I/O bus pin 1


    ![](img/a9229e7b0ddd9608f171b22b52514f39_199_0.png)


    ![](img/a9229e7b0ddd9608f171b22b52514f39_199_1.png)


    Figure A-6: Digital Thermometer Demo


    You need to hook up the thermal sensor to the Experimenter as shown in figure
    8. The PIC24F is already preprogrammed at factory for this demo. Depressing Push
    Button S1 initializes Thermometer demo. This configures pin 1 of I/O expansion
    bus to be an analog input and then continuously digitizing this input using the
    PIC24F internal 10 bit ADC. The results are displayed in degrees Fahrenheit. You
    need to connect a LM34Z sensor as shown. Please use a raw input of +5VDC for input
    power to power the sensor. This can be done simply by applying power to the board
    through the RAW + and - inputs rather than using a wall transformer.'
  merge: -1
