- pgno: 129
  md: 'experiments. Level conversion hardware and a DCE connector for RS-232 are needed
    for the Microstick II. We will use an ACRONAME module; it contains both in a convenient
    pluggable board. We then incorporate a standard RS-232 cable DCE to DTE to pair
    the connector to the PC to brainstorm. As final note the data rates and serial
    format for communication needs to be set. This is an important for both the PIC24H
    UART initialization software, and HyperTerminal configuration. The considerations
    are baud rate, number of stop bits, data size, use of parity, and finally any
    hardware handshaking. For our purposes we will use 1200 baud, 8 bits; no parity,
    1 stop bit and no hardware handshake. The Short hand notation for this is 1200N81


    ![](img/a9229e7b0ddd9608f171b22b52514f39_129_0.png)


    # American Standard Code for Information Interchange (ASCII)


    In reality, a user can select any type of digital byte for transfer but HyperTerminal
    can only display ASCII (American Standard Code for Information Interchange) formatted
    data. A table is shown in Figure 7-4. The table is for 128 different characters
    that includes control, data (upper /lower case A-Z), numerical (0-9), special
    characters like quotes, exclamation point, question mark, and pound sign. We will
    be using ASCII data coding for our serial communication experiments.'
