- pgno: 19
  md: 'Ok so far, but not very exciting. The MPLAB works well --but where is the beef?
    We need to raise the ante. Let''s close this configuration out (''click'' red
    X button in top right hand corner of IDE) and then let''s fire up a Demo project
    directly. Under this new scenario we should see MPLAB populated with the components
    of the particular demo project, displaying those functional components in MPLAB
    in the workspace as they were last saved.


    Navigate to where you stored your demo folder, open this folder and locate the
    project folder FLASH_LED. Under Windows you should see the following project file
    content (see Figure 1-6). The project file content contains the C source (.C)
    and object code (.O), a MAP to show where code and data is assigned within the
    microcontroller memory, and an executable file (.HEX). The most important files,
    for our purposes at this time, are the project files (.MCP) and the workspace
    file (.MCW). Both of these last files are displayed with the MPLAB IDE logo. Double
    click the project icon marked .MCP file and MPLAB will reconstruct the project
    from the last stored workspace for that project. The workspace captures what windows
    are open, how the microcontroller is configured, and what debugging options were
    set. The workspace is captured with the .MCW file. Figure 1-6 captures the whole
    process.


    ![](img/a9229e7b0ddd9608f171b22b52514f39_19_0.png)'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'Let''s continue with a closer look at the MPLAB contents using this project
    to gain a better appreciation of the MPLAB visual environment. In this project
    workspace there are several windows open. First is the overall Project Window,
    this window shows in tree structure all the associated user files or support files
    that are part of this project''s source code build. Only two source code files
    appear here. You can examine any files contents by double clicking on the specific
    file within the Project Window. The other window that is open is the source code
    window (Figure 1-7).


    Notice that this window it is tabbed, in that all the source files within the
    project have been open for viewing, but only one file can be viewed at a time.
    You can alternate your source code views by clicking the associated tab aligned
    with the particular source code file. Another window visible in the workspace
    is the Output Window. The output window has many tabs and again you can alternate
    your views between debugger statuses, build/compile errors as well as several
    others (we will learn all of these features later in this book). Finally there
    is the MPLAB panel and tool bar on top of the main window. Here you can direct
    what operation you want the MPLAB to perform.


    If you do not have your Microstick II connected at this time, the output window
    should indicate this (only because the Microstick II debugger was active as part
    of the original workspace configuration). Please connect your Microstick II at
    this time, if it hasn''t been connected already. A Microchip USB driver is automatically
    installed the first time you hook up your Microstick II. Once done the Windows
    operating system should recognize the Microstick II connection automatically afterwards.
    Once the Microstick II is connected and driver installed the output window should
    respond that the debugger is connected. The Microstick II Debug LED should be
    constantly on.'
