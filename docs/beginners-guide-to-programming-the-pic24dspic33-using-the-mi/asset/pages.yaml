- pgno: 196
  md: 'possible settings are AN0, AN1, AN4, AN5, AN9, AN10, AN11, and AN12.

    In this experiment we will use AN0.


    +   - Int readADC (int ANpin) –this functions forces a manual ADC conversion on
    the designated ANpin, again we will use AN0.


    The EEPROM library is really straightforward. Take a quick look at the functions
    listed below.


    +   - InitNVM () - initializes the Experimenter EEPROM for access. This must be
    called first before any other EEPROM library function is called. NVM stands for
    "Non-Volatile Memory".

    +   - iReadNVM ( address)- reads EEPROM at address and returns the 16 bit value
    stored at that location

    +   - IWriteNVM (address, data) – writes 16 bit data value to EEPROM at the designated
    address.


    The UART library functions used in the data logger are:


    +   - initU2() – initializes the serial port using UART2 of PIC24F for pins 8
    and 9 of the Experimenter expansion Bus for 9600 BAUD, 8 bit data, no parity and
    1 stop bit or short hand 96008N1.

    +   - putU2( character) – writes character out to the serial port

    +   - putsU2( string) - writes an entire string out to serial port

    +   - Character getU2 () – waits for a new character to arrive to the serial port
    and returns it.


    Here are the five functions within the LCD driver their titles pretty much capture
    what they do.


    +   - LCD_Initialize () - initializes the LCD display and makes it ready for output.
    This needs to be called before any other LCD function is called.

    +   - clear_display () - clears display and places cursor at row 1 column 1 (top
    left corner)

    +   - position_cursor (position) - places cursor at designated position, a number
    from 0-47

    +   - write_string_LCD (string name) - writes a string to display at current cursor
    position ( see explanation in text)

    +   - write_character_LCD (character) -writes a single character to display at
    current cursor position


    Here are the two Button functions again we try to keep things as straightforward
    as possible.'
