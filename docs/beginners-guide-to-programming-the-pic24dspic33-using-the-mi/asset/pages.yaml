  md: '+   - Void turnon (int setting) -turn on RB2 pin output, Timer2 clock and the
    PWM OC1 configuration on this pin. The period of Timer2 is preset to 0x7FF the
    max value of the 12 bit ADC. Setting is any value set by the pot ADC between 0-0x7FF
    that adjusts the PWM duty cycle. If setting is 0 then duty cycle is zero, if setting
    is 0x3FF then duty cycle is 50%, if setting is 0x7FF then duty cycle is 100%

    +   - Void setPWM (int setting) - This performs the same function of running turnoff
    (void) and turnon (int setting) with one call. This turns PWM off first before
