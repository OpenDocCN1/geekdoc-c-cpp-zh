- pgno: 149
  md: 'Let''s take a closer look at the SPI interface. It requires three signals:
    SDO (serial data out), SDI (serial data in), and SCLK serial clock. The SPI is
    typically used between a pair of communicating entities. The SDO of one entity
    is connected to the SDI of the other. The clock originates at the “Master” side,
    the entity that initiates and sustains communications. The “Slave” communication
    is in response to the Master (see Figure 8-2). There is no protocol only data
    movement. Both sides function as shift registers where the common clock is used
    to shift data from one transmitting register (SPI BUF) into the receiving register
    (SPI BUF). Optionally a fourth signal can also be used: CS or chip select. This
    signal is used to enable slave peripheral for communications and can be duplicated
    to allow the SPI communication interface to be shared between one master and many
    slaves (however, only one slave at a time). In summary:


    +   - Simple interface

    +   - Uses 3 to four signals

    +     - CS, SDO, SDI, CLK

    +   - Based upon a shift register concept

    +   - Very high speed ( up to 20MHZ with PIC24H)

    +   - Robust and very noise immune


    ![](img/a9229e7b0ddd9608f171b22b52514f39_149_0.png)


    Figure 8-2 SPI Serial Communications


    # Introducing a Serial EEPROM


    Our experiment will use a serial EEPROM to demonstrate SPI operation. Specifically
    we will use a Microchip 25LC256 EEPROM device that supports 256kbits or 32Kx8
    bytes of nonvolatile memory. The EEPROM is a memory technology that allows us
    to store data under program control and retain the'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'contents even when power is turned off. This is can be real useful for user
    applications requiring password setting, storing calibration data, or storing
    data measurements as in a logging function. The 25LC256 uses an SPI interface
    to talk to the Microstick II PIC24H Microcontroller. For our experiment we use
    a software ''C'' library where a SPI communication is supported with an easy to
    use API.


    For this library each 25LC256 storage word is two bytes. Given the byte size of
    the 25LC256 this means we can store up to 16K words total. The double byte storage
    and retrieval makes sense since the PIC24H is a 16 bit machine. In general, for
    your experiments, you need to establish what data you want to store and how that
    data organized over 16K words. Figure 8-3 shows the physical EEPROM. It is an
    8 pin DIP. You already can recognize the basic SPI signals /CS, SCK, SI and SO.
    In addition for this EEPROM there are additional control signals. There is a write
    protect (/WP) control line to physically lock out the Microcontroller from writing
    to the EEPROM. /HOLD suspends a command/data sequence, and puts the device in
    a suspended state that does not require restarting the sequence once /HOLD is
    released.


    +   - CS – Chip Select

    +   - SCK – Serial Clock

    +   - SI – Serial Input

    +   - SO – Serial Output

    +   - WP – Write Protect

    +   - HOLD – Hold Enable


    ![](img/a9229e7b0ddd9608f171b22b52514f39_150_0.png)


    Figure 8-3: SPI EEPROM


    # Experiment 1- Hardware


    The PIC24H has user programmable PPS pins to place the I/O of any internal digital
    peripheral onto any of these pins. We will configure pins 18, 17, and 16 to function
    as the interface for SPI2, namely, SO, CLK and SI. Pin 15 will be configured as
    a normal digital output for /CS. /HOLD and /WP are not required and, so, wired
    high to disable. The final hardware schematic are shown in Figure 8-4. Figure
    5, 6, 7 shows the 25LC256 EEPROM instruction set and a read/write byte sequence
    using SPI. Note that all addresses to the EEPROM are sixteen bit. Upon /CS becoming
    active the microcontroller first sends the specific command (see Figure 8-5) to
    the EEPROM, followed by address. What happens'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'next depends on whether the command is a read or write operation; if read the
    EEPROM will output data to Master to read, if it is a write operation the Master
    will output data from the EEPROM to store. Most EEPROM are not typically high
    speed devices and a memory write cycle may take several milliseconds. The API
    handles this.


    ![](img/a9229e7b0ddd9608f171b22b52514f39_151_0.png)


    +5V external power source or tap off of TP1


    Figure 8-4 Schematic'
  merge: -1
