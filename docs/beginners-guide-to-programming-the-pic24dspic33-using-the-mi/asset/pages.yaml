- pgno: 86
  md: '+   - CH0NA Channel A =0 negative input of –REF

    +   - CH0SB Channel B =000 –not used

    +   - CH0SB Channel B =0 negative input of –REF -not used


    # AD1CSSL SFR bits –input scan select Low


    +   - CSS = 0x0001 for AN0


    # AD1PCFGL SFR bits - analog input select


    +   - PCFG =0xFFFE for ANO initially but any other available can be set as well
    in the library


    # Hardware description


    The hardware schematic is given in Figure 4-4. Here we use an analog 10K potentiometer
    to function as a settable input analog source for analog input channel 0 or AN0
    pin 2 of PIC24HJ128GP502. The 10K potentiometer has one terminal tied to an external
    +3.3 VDC voltage source. The Microstick II has two bare pads GND and VDD (or on
    schematic TP1). Your options are to connect to the TP1 via on card for +3.3VDC
    or furnish this supply voltage for this experiment. An important note in using
    TP1 is that there is a limitation in how much current this connection can supply.
    Remember that the microcontroller itself is also using this connection. Its needs
    will vary based upon oscillator setting and output drive current. As a rule of
    thumb as your prototype experiments grow beyond the 100ma mark you may want to
    use an external supply for your power source. In this exercise, since we are only
    using a potentiometer, we will connect to the VDD (TP1) for the +3.3VDC of the
    potentiometer and also connect pin 8 of Microstick II ground to the ground for
    the potentiometer. The wiper of the potentiometer is tied to the AN0 input pin
    2. You must remove jumper J3 to disconnect the User Led from this pin. With the
    potentiometer we can vary the input voltage to AN0 to any value between +3.3VDC
    to ground for our ADC experiment.'
