  md: '![](img/a9229e7b0ddd9608f171b22b52514f39_49_0.png)


    Figure 2-5: Experiment1 Software operations


    # Experiment 1 Execution


    Let''s go ahead and begin our debug. At this point we have a fairly good idea
    of what will happen during execution given that the prototype hardware is configured
    correctly, and the source code and processor configuration are in good shape.
    The PIC24H will blink the LED connected to pin 14 RB5 of the Microstick II.


    Let''s verify the delay time and ensure that it is sufficient to yield a good
    blink rate. One quick way is to use the simulation tool "stopwatch" to measure
    this delay time. Under simulation there are some tool advantages to perform detailed
    analysis. Stop watch is an example of this. Under "stopwatch" we can make actual
    time measurement. Let''s start with setting up simulation and then use stopwatch
    to verify delay time before working with real time debugging and the Microstick
    II.'
