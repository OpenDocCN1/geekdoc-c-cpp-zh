- pgno: 132
  md: 'The class of interest to us is CDC. We will use a UART to USB Bridge that allows
    for a UART interface on microcontroller side and USB CDC compliant device interface
    on the PC side. ACRONAME provides a pluggable module with their S22. The S22 module
    provides the bridge chip with the same four pin connector for the micro side and
    a USB device connector on the other side. You connect to the PC using the familiar
    USB Host type A to Device Type B connector cable. USB supports "plug and play".


    Each device, when it is connected to the USB, is "enumerated" by the PC, which
    means the device identifies to the PC its class type, operational needs, and driver
    requirements. The PC checks that it can meet the operational needs and that the
    identified driver for the device is present in its current software registry.
    Only when all this is accomplished, will communications be allowed. We can then
    open HyperTerminal on the PC and identify the COM port associated with the S22,
    configure the COM port, and begin communications.


    For USB CDC we will use the ACRONAME supplied registry file (.INF) to register
    the communication port with the Operating System and the ACRONAME supplied S22
    driver. When first connecting to the PC the system will see the S22 as "new hardware"
    on the USB and will attempt to retrieve driver information. At this point you
    direct the PC to the ACRONAME driver locations you stored on your PC. This is
    a one-time configuration requirement which will then be automatic every time you
    connect again. The USB is +5V bus, however, we only need to power up the S22 with
    available +3.3V on the micro USB (Universal serial Bus).


    # Serial Communications Review


    Some important reminders and rules of thumb with serial communications:


    +   - Message is equal in size to a Start bit, # of stop bits, # of data bits
    , parity if present ( 10 bits shown)

    +   - Baud rate

    +     - Bit transfer rate during message up to 115K

    +   - Data bits

    +     - Number of data bits transferred in a message

    +   - Parity

    +     - Optional Parity error checking bit present in message'
  merge: -1
  img_proc: true
