- pgno: 52
  md: 'Ok, we have the stopwatch and the breakpoint set correctly. We want to measure
    the delay between successive calls to the delay function. This should be good
    enough to determine blink rate. Hit reset and the processor will run to first
    breakpoint. This first reading includes execution time from the beginning; this
    is not what we are interested in. Clear stopwatch by "clicking" zero button and
    continue to run (click on the run button) without resetting. We will then break
    again when the delay function breakpoint is reached a second time. Here we have
    captured an accurate time for the delay function. The stop watch shows elapsed
    time of approximately 500 milliseconds. This means that the LED "on" time and
    the LED "off" time are both 500 milliseconds, meaning the LED has a blink rate
    at about 1 second, slow enough for us to see.


    ![](img/a9229e7b0ddd9608f171b22b52514f39_52_0.png)


    Figure 2-10: Using the Stopwatch


    One other thing we can do under simulation is to check the toggle of RB5 using
    watch. Let’s leave the breakpoint where it is and do this. We select "view" from
    the tool bar, scroll down to watch and invoke the watch window. In this window
    we can view any named variable in our code or any SFR. Here we wish to add LATB
    to our viewing. By watching LATB between the breakpoints we should be able to
    see the RB5 turn on and off.


    Ok, we should now have confidence that our source code is working as designed.
    RB5 does in fact toggle and it toggles at a blink rate of every ½ second. All
    design elements check out. Let’s now check it out for real with the prototype.'
