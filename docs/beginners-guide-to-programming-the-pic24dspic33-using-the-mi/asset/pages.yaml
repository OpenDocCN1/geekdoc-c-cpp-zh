- pgno: 176
  md: 'the LCD and pushbuttons. To operate these you must first call library function
    RTCCInit (). The two functions we will discuss use the RTCC library but reside
    outside of it in the MAIN.C.


    +   - Set_ALARM (alarm) – this function initializes the alarm functions of the
    RTCC and sets the alarm (for the data logger we referred to this as rate) base
    on the value passed as alarm. It is called during the rate setting menu. It sets
    as follows:

    +     - if (alarm =0) then alarm every 10 seconds

    +     - if (alarm =1) then alarm every minute

    +     - if (alarm =2) then alarm every 10 minutes

    +     - if (alarm =3) then alarm every hour

    +     - if (alarm =4) then alarm every day

    +     - if (alarm =5) then alarm every week

    +     - if (alarm =6) then alarm every month

    +     - if (alarm =7) then alarm every year


    Once the alarm is set this function will then enable the RTCC to interrupt the
    PIC24H when the alarm condition occurs. The RTCC interrupt service then can perform
    whatever function required for the alarm application. Code snippets for set alarm
    and RTCC interrupt are shown in Figures 10-5 and 10-6. Note in the interrupt that
    there is a comment for you to add your own code for whatever function you want
    to perform as a result of alarm condition (the default is toggling the LED).


    +   - clock_Setup () –This routine displays current RTCC time setting in ASCII
    on the display and allows the operator to accept or make changes to RTCC using
    the display and pushbuttons.

    +     - Button SW1 -toggles between clock set mode and clock accept mode. Hitting
    the SW1 twice in accept mode exits the function with RTCC set to the displayed
    time.

    +     - Button SW2 -if in clock setting mode increments current data field

    +     - Button SW3 -if in clock setting mode decrements current data field

    +     - Button SW4 -advance to next allowable data field


    # Clock and Alarm Experiment


    This experiment uses the RTCC library and clock_Setup () and set_alarm () functions
