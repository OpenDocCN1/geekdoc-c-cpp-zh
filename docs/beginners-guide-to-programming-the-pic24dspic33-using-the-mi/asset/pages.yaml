    earlier chapters (see Chapter 2).


    Set the breakpoint at LED toggle instruction in main code. Reset the processor
    and run. The first time through the stopwatch will capture erroneous time –in
    that it will capture both the initialization time as well as first time through
    the loop. Let''s zero the stopwatch and then hit run. Now the time should be exact.
