  md: 'peripheral code (in our case it is 5 for UART2 TX), and then set the appropriate
    output PPS SFR register to write to. In our case for RP11 assignment with in this
    case is RPOR5. So, we write our code into the lower bits of RPOR5 as shown. See
    Figure 7-10.


    # Remappable Output


    ![](img/a9229e7b0ddd9608f171b22b52514f39_137_0.png)


    Figure 7-10: Remappable Output with SFR example for RP10


    As a reminder the benefits of PPS are as follows:


    +   - Allows optimal usage of on-chip peripherals

    +   - Any digital peripheral can remap to any RP pin

    +   - Pin assignment is set in software

    +     - Outputs assign a peripheral to a specific pin

    +     - Inputs assign a pin to a specific peripheral

    +     - Multiple input peripheral functions on one pin is supported


    # Experiment 1 "Implementing a Serial interface with a PC"


    The first experiment will use the UART2 of the PIC24H to communicate with a PC
    using RS-232 and the PC running HyperTerminal Software. The experiment follows
    the connection scheme of Figure 7-3.


    Figure 7-11, shows the total end to end communications block diagram flow between
    User codes with microcontroller UART to RS-232 to the PC with Windows Drivers
    using HyperTerminal. The application sends ACSII characters'
  merge: -1
