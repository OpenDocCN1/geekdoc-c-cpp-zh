  md: '+   - LCD D5 to Microstick II pin RA1

    +   - LCD D4 to Microstick II pin RA0


    The command interface is facilitated with two command lines


    +   - LCD command/data control RS to Microstick II pin RB10

    +   - LCD strobe in E to Microstick II pin RB11


    ![](img/a9229e7b0ddd9608f171b22b52514f39_99_0.png)


    Figure 8-3 LCD prototype


    # Software Library Description


    So much for hardware, now here''s the fun part. Let''s learn the software functions
    for driving the LCD and how to use them. Here are the five we will be working
    with. Their titles pretty much capture what they do. Remember the LCD only accepts
    ASCII characters for data. The LCD, as mentioned earlier, is organized as a display
    with 0-47 (48) character positions or similarly a 16x3 display matrix. Again,
    this refers to 16 columns by 3 rows. The first row contains positions 0-15, the
    second 16-31, the third 32 -47. The library allows complete freedom to position
    a character anywhere in the display matrix. It also auto-increments the character
    position when you are writing one then one character (like a string) at a time.'
