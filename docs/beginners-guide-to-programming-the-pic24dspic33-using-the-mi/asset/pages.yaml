- pgno: 23
  md: '![](img/a9229e7b0ddd9608f171b22b52514f39_23_0.png)


    Figure 1-9: Programming Microstick II


    After clicking run the Microstick II should be running and the IDE should be responding
    with a visible activity bar active in the lower left hand corner of the IDE window.
    In addition, the run button on tool bar is disabled, and only the pause button
    is available for use. You can click pause button on the tool bar and the Microstick
    II will stop at the current line that the microcontroller was beginning to execute.
    A green arrow will appear in the source code window (if it is open) as to what
    line of source the microcontroller is paused at. You can then elect to run from
    there (click run), or use single step (click single step) to execute one line
    of source at a time, or reset (click reset) and the Microchip will start execution
    of your code from the beginning.


    It would help here to briefly cover some of the important debug functions, discussed
    so far, that reside in the IDE tool bar (see bullet items below and Figure 1-10):


    +   - Make – just rebuild code that is new

    +   - Build All – rebuild all code in Project Window

    +   - Program the device ( in this case for debugging functions)

    +   - Run –execute the program'
  merge: -1
  img_proc: true
- pgno: 24
  md: '+   - Pause- stop the program

    +   - Single Step – execute one line of code from where you previously paused
    and then pause after execution.

    +   - Reset –reset the device so the next run or pause execution will occur from
    beginning of code


    ![](img/a9229e7b0ddd9608f171b22b52514f39_24_0.png)


    Congratulations –you now have a fully functional microcontroller development system!
    With this tool suite you can now undertake the exercises in this book and begin
    to progressively prepare and train yourself in 16 bit Microcontroller embedded
    design techniques.


    We will be covering the function and features of MPLAB more carefully in the chapters
    to follow. Now let''s discuss some of the important hardware features of the Microstick
    II and the PIC24H microcontroller so as to better understand these important resources
    and their full capabilities.


    # Install Errors


    +   1. Source Code Compile Errors-If compile errors occur you may have inadvertently
    typed or entered text in the source window and this would be accepted by the IDE
    as new code for the build. If this is the case close the IDE and do not save the
    workspace, reload the demo code and start again.

    +   2. ''C'' Complier Not installed -If compile operation did not even occur,
    and the output window reports that it can''t find the complier; you may have overridden
    the default location for complier. You now have one of two choices. The first
    choice is to just reinstall the complier to its IDE default'
  merge: -1
  img_proc: true
