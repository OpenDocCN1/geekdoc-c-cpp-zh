  md: '# Attributes


    Attributes in C# provide a way to add metadata to an element of your code. They
    can be added to types that you create or their members. They can even be applied
    to a method''s parameters and return types.


    These attributes can be detected by the compiler, external code tools like unit
    testing frameworks, or even detected while your code is running, using reflection.
    (We''ll talk about reflection in a second.)


    There are hundreds of attributes that come with the .NET Framework, and we can''t
    cover them all. In the various places where you may need to use them, you can
    learn about the specific attributes that apply as you go.


    But to illustrate the basics of how attributes are used, we''ll look at one specific
    but simple attribute called the Obsolete attribute. You can use this to mark classes
    and methods that are out of date, and should no longer be used. To apply an attribute
    to a method, you simply put the attribute name in square brackets ([]) above the
    element:


    ```

    [Obsolete]

    private void OldDeadMethod()

    {

    ```


    Depending on what namespace the attribute lives in, they may require an additional
    using directive. The compiler uses this attribute to detect calls to obsolete
    methods and warns the programmer about it. If you use a method with this attribute
    on it, you''ll see a warning in the Error List telling you so.


    Many attributes have certain parameters that you can set as well, including the
    Obsolete attribute:


    ```

    [Obsolete("Use NewDeadMethod instead.", true)]

    private void OldDeadMethod()

    {

    ```


    In this case, the first parameter is text that will be displayed in the warning
    message, and the second indicates whether the compiler should treat the problem
    as an error rather than a warning.


    Attributes are simple classes that are derived from the Attribute class, and you
    can make your own. When we use an attribute, we''re essentially calling a constructor
    for that.


    Multiple attributes can be applied to an element:


    ```

    [Attribute1]

    [Attribute2]

    [Attribute3]

    public class MagicClass

    {

    ```


    In most cases, when creating an attribute, people put Attribute at the end of
    the name for their attribute (e.g. ObsoleteAttribute). If you do, when you use
    the attribute you can use either [Obsolete] or the longer [ObsoleteAttribute].


    For specific instructions on how to create your own attributes, see: http://msdn.microsoft.com/en-us/library/84c2s56.aspx.'
  merge: -1
