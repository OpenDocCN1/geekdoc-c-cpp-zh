    As always, C# statements end with a '';'' which tells the computer that it has
    reached the end of the statement. After this line, we created a new variable with
    the name score and with a type of int we''re now able to use!


    # Assigning Values to Variables


    The next thing we want to do is put a value in your variable. This is called assigning
    a value to the variable, and it is done using the assignment operator: "=". The
    line of code below the score variable we just created:


    ```

    score = 0;

    ```


    ![](img/ad92120e75cb88980f77f3297768b8f0_49_0.png)


    You can add this line of code right below the previous line we have added.

    If you''re programming, it is worth pointing out that this use of the equals sign
    is different than what you might be used to from math. In math, the equals sign
    indicates that two things are in the same, even though they may be written in
    different forms. In C# and many other programming languages, it means we''re going
    to take the stuff on the right-hand side of the equals and stick it in the variable
    that is named on the left.


    ```

    score = 4;

    score = 11;

