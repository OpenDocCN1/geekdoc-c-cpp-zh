    \ == null) { return; }\n\nreturn highScoreManager.Scores[0].Player.Name;\n```\n\
    \nOuch. A ton of code to make things safe for use. That's four whole lines of\
    \ null checking!\n\nC# 6.0 introduced a new operator called the null propagator\
    \ (or simply, the null propagator) that makes it easy to do these null checks\
    \ without causing your code to get ugly. It comes in two forms, depending on what\
    \ comes after: ?. and?..\n\nLet's look at a simple example that uses this for\
    \ the first null check:\n\n```\nreturn highScoreManager?.Scores[0].Player.Name;\n\
    ```\n\nWhat does this operator do if the thing was null. If it was, it simply\
    \ evaluates to a null result. If not, it continues and evaluates whatever is beyond\
    \ the operator. You could say that this line of code turns into the following:\n\
    \n```\nhighScoreManager = highScoreManager;\nif(manager == null) { return; }\n\
    return manager.Scores[0].Player.Name;\n```\n\nSo that's one null check. Four to\
    \ more. We can of string these together in one line to get what we want very quickly:\n\
    \n```\nreturn highScoreManager?.Scores[0]?.Player.Name;\n```\n\nThis shows us\
    \ the alternative (with the question mark, followed by the square brackets) in\
    \ addition to the series of null checks.\n\nWith all these null propagators, if\
    \ any of the objects (immediately before a null propagator) turns out to be null,\
    \ the expression will short circuit and evaluate to null. Otherwise, it will keep\
    \ going the chain and evaluate the next part.\n\nThis has three intriguing caveats:\
    \ first, when a null is evaluated, the result is stored for use later. The previous\
    \ code illustrates that, by copying highScoreManager to a local variable (manager)\
    \ which is then used throughout the rest of the evaluation, that means if something\
    \ causes the original highScoreManager variable to change (perhaps to a null value,\
    \ or perhaps to a different non-null value) your evaluation doesn't change.\n\n\
    Basically, we've protected ourselves against things that are about to become null\
    \ while we perform this by creating a local/cached copy of the object. That's\
    \ good defensive programming, so it's good that null propagators work like that.\n\
    \nSecond, it is important to understand that this evaluates to a null. This will\
    \ cause a small problem for us if the final value we wanted was a value type of\
    \ a reference type. Your earlier code worked because the final return value was\
    \ of the type string, which can deal with a value of null. It is a reference type.\n\
    \nWhat happens if we were trying to get the high score (perhaps an int instead\
    \ of a string)?\n score = highScoreManager?.Scores[0]?.Score;"
