  md: '# Lambda Expressions


    In a Nutshell


    +   * Lambda expressions are methods that appear "In line" and do not have a name.

    * Lambda expressions have different syntax than normal methods, which for simple
    lambda expressions makes it very readable. The expression: x => x < 5 is the equivalent
    of the method bool Method(int x) { return x < 5; }\n* Multiple parameters can
    be used: `(x, y) => x*x*y`

    * As zero parameters: `() => Console.WriteLine("Hello World!")`

    * The C# compiler can typically infer the types of variables in use, but if not,
    you can explicitly provide those types: `(int x) => x < 5`

    * If you want more than one expression, you can use a statement instead, which
    has syntax that looks more like a method: `x => { bool lessThan = x < 5; return
    lessThan; }`

    * Lambda expressions can use variables that are in scope at the place where they
    are defined.

    * Expression syntax can be used to define normal, named methods, properties, indexers,
    and operators as well: `bool Method(int x) => x < 5;`


    # The Motivation for Lambda Expressions


    Lambda expressions are a relatively simple concept. The trick to understanding
    lambda expressions is in understanding they''re actually going for. So that''s
    where we''re going to start our discussion.


    For this discussion, let''s say we have the following list of numbers:


    ```

    // Collection initializer syntax (see Chapter 24)

    List<int> numbers = new List<int> {1, 7, 4, 2, 5, 3, 9, 8, 6 };

    ```'
