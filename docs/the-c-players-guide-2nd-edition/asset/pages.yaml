  md: "# Overloading Operators 217\n\n```\npublic static bool operator == (Vector\
    \ v1, Vector v2)\n{\n    return (v1.X == v2.X) && (v1.Y == v2.Y);\n}\n```\n\n\
    ```\npublic static bool operator != (Vector v1, Vector v2)\n{\n    return !(v1\
    \ == v2); // Just return the opposite of the =\\n}\n```\n\nRemember that the logical\
    \ operators must be overloaded in pairs, so if you overload ==, you must also\
    \ !=, as shown here.\n\nIf you look closely at these overload operators, you can\
    \ probably tell that they are basically just a method. (The only real difference\
    \ is the operator keyword.) The C# compiler is actually going to turn this into\
    \ a method as it compiles it.\n\nOverloading operators is dense primarily to make\
    \ your code cleaner. It's called syntactic sugar. Anything you can do with an\
    \ operator, you could have done with a method. Overloading an operator is sometimes\
    \ times more readable.\n\nJust because you can overload operators, doesn't mean\
    \ you should. Imagine that your operator have to do something unexpected. If it's\
    \ not clear what your overloaded operator does, you'll cause yourself and others\
    \ lots of problems. This is why Java and other languages, on the side of being\
    \ overly cautious, have chosen not to even allow operator overloading. The rule\
    \ is to only overload operators that have a single, clear, intuitive, and widely\
    \ accepted usage.\n\nOur completed class might look something like this:\n\n```\n\
    using System;\nusing System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\n\
    using System.Threading.Tasks;\n```\n\n```\nnamespace OperatorOverloading\n{\n\
    \    public class Vector\n    {\n        public double X { get; set; }\n     \
    \   public double Y { get; set; }\n\n        public Vector(double x, double y)\n\
    \        {\n            X = x;\n            Y = y;\n        }\n\n        public\
    \ static Vector operator +(Vector v1, Vector v2)\n        {\n            return\
    \ new Vector(v1.X + v2.X, v1.Y + v2.Y);\n        }\n\n        public static Vector\
    \ operator +(Vector v, double scalar)\n        {\n            return new Vector(v.X\
    \ + scalar, v.Y + scalar);\n        }\n    }\n}\n```"
