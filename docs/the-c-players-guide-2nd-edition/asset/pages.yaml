    # # Mastering the Tools


    In order to master C#, you need to thoroughly understand the development tools
    that you use. We''ve spent the bulk of this book looking at how to write C# code,
    but in order to truly understand how a program works, you''ll need to learn the
    details of how C# and the .NET Framework function, and how to use Visual Studio
    effectively. In this section, we''ll look in depth at how these things work, and
    we''ll pay particular attention to how to debug your code and fix common problems.


    We''ll cover:

    - The .NET Framework in more depth (Chapter 40)

    - A detailed look at Visual Studio and useful features it has (Chapter 41)

    - How to work with multiple projects, including using code that other people or
    businesses created and made available to you (Chapter 42)

    - Dealing with multiple compiler errors (Chapter 43)

    - How to debug your code (Chapter 44)

    - A behind-the-scenes guide through the way Visual Studio organizes and manages
    your code and other assets in a project or solution (Chapter 45)'
