  md: '# Value Types and Reference Types 105


    Value and reference types are one of the biggest things that make C# stand from
    C++, Java, and other programming languages, which do things in a completely different
    way. If you''re a programmer, it''s time to pay extra attention, so that you understand
    this difference.


    Here is the key difference: when you have a variable that is a value type, the
    actual contents of that variable live where the variable lives. With a reference
    type, the contents of the variable live on the heap, and the variable itself contains
    only a reference to the actual content.


    Go back and read that paragraph again a time or to make sure you understand it.


    It turns out we have already been using both value and reference types. The string
    type is a reference type, and arrays are references as well (though the contents
    of the array may be reference or value types). All of the simple types we''ve
    discussed before, as well as enumerations (Chapter 14) are all value types.


    ![](img/ad92120e75cb88980f77f3297768b8f0_127_0.png)


    As we get started with Part 3 of this book, we''re going to learn how you can
    create your own value or reference types, and finishing filling in our system
    diagram.


    Let''s now dig into this in a more depth, starting with reference types. Look
    at the following code:


    ```

    string message = "Hello!";

    ```


    Since the string type is a reference type, the actual "Hello!" text will always
    be stored in the heap, and the message variable will simply contain a reference
    to that text. As a local variable or'
