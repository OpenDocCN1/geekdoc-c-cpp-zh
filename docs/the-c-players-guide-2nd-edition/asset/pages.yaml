  md: "# 198 Chapter 29 Error Handling and Exceptions\n\nOne option in this case is\
    \ to catch the exception, check for certain conditions and handle the things you\
    \ want, and rethink anything left over:\n\n```\ntry {\n    throw new Exception(\"\
    Message\");\n}\ncatch(Exception e) {\n    if (e.Message == \"Message\") Console.WriteLine(\"\
    I caught an exception.\");\n    else { throw; }\n}\n```\n\nThe above is called\
    \ \"rethrowing the exception.\" It allows you to throw the exact same exception\
    \ that was caught, with one limitation. The exception's stack trace has now moved\
    \ away from the original place it was thrown (the second line in the sample) and\
    \ the system now thinks it was thrown at the site of it (the second line in the\
    \ sample). This can be a little frustrating. It makes it harder to track down\
    \ where a problem originated.\n\nIn C# 6.0, there's a better way: exception filters.\n\
    Exception filters allow you to add a bit of code to a catch block that can be\
    \ used to filter whether an exception is actually caught or not. The syntax looks\
    \ like the if-statements we introduced in Chapter 10 and have been using since:\n\
    \n```\ntry {\n    throw new Exception(\"Message\");\n}\ncatch(Exception e) if(e.Message\
    \ == \"Message\") {\n    Console.WriteLine(\"I caught an exception.\");\n}\n```\n\
    \nThis approach is preferable to filtering by placing an if-statement inside the\
    \ catch block. The exception filter syntax is usually clearer, and it also avoids\
    \ the problem we had in the earlier version where the stack trace was changed.\n\
    \n# Some Rules About Throwing Exceptions\n\nWhen you are throwing exceptions,\
    \ there are a few guiding principles that you should try to follow. Throwing exceptions\
    \ can lead to some crazy things to the flow of execution in your program, and\
    \ so we want to take care to prevent bad things from happening when you do.\n\n\
    At a bare minimum, you not leave resources open that were opened before the exception\
    \ was thrown. They should be closed first. This can usually be handled in a finally\
    \ clause. But at a minimum, make sure that your program is still in a safe state.\n\
    \nSecond, you want to revert to the ways things were before the problem occurred,\
    \ so that once the error has been handled, people know the system is still in\
    \ a valid state. A finally block can do this.\n\nLastly, if you can avoid an exception\
    \ in the first place, that is what you should do."
