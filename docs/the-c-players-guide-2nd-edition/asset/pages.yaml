    # The Remainder Operator


    In elementary school, not too long after you first learned division, how you always
    did things: "23 divided by 7 is 3 remainder 2" Well in programming, the remainder
    has its own operator. This operator is called the remainder operator, though it
    is sometimes called the modulo operator, or mod for short. This operator only
    gives you the remainder, not division result. The sign for this operator is the
    percent (%). So it is important to remember in C#, % does not mean "percent,"
    it means "get the remainder of."


    # In Depth


    Remainders Refresher. I know some people haven''t done much with remainders since
    elementary school, as a refresher, remainders work like this. For 23 % 7, we know
    that 7 goes in 23 a total of three times. But since 7 * 3 is 21, there will be
    two left over. In this case, 2 is our remainder.


    Say you have 23 apples, and 7 people want the apples, this means everyone gets
    3, and there are 2 remaining, or left over. This little example would look like
    this in C#:


    ```

    int totalApples = 23;

    int people = 7;

    int remainingApples = totalApples % people; // this will be 2.

    ```


    At first glance, the remainder operator seems like an operator that''s not useful,
    but if you know how to use it, you will find lots of ways to use it. For example,
    the remainder operator can be used to determine if a value is a multiple of another
    value. If it is, then the remainder operator will give us 0.


    ```

    int remainder = 20 % 4; // This will be 0, which tells us 20 is a multiple of
    4.

    ```'
