  md: "# The Relationship between Delegates and Events\n\nIn the vast majority of\
    \ cases, delegates are not used to call more than one time at a method, and events\
    \ fire often. So C# programmers do not see delegates that reference more than\
    \ one method at a time, and make the incorrect assumption that they can't handle\
    \ it at all.\n\nA more accurate way to think of it is along the lines of an event\
    \ being a property-like wrapper around a delegate. Specifically, we've seen until\
    \ now is similar to an auto-implemented property. Let's look back at our earlier\
    \ example with our EventHandlerChanged event:\n\n```\npublic event EventHandler<NumberChangedArgs>\
    \ NumberChanged;\n```\n\nThe compiler expands this code into what it looks like\
    \ this:\n\n```\nprivate EventHandler<NumberChangedArgs> numberChanged; // The\
    \ wrapped delegate.\n\npublic EventHandler<NumberChangedArgs> NumberChanged\n\
    {\n    add { numberChanged += value; } // Defines behavior when a method subscribes.\n\
    \    remove { numberChanged -= value; } // Defines behavior when unsubscribing.\n\
    ```\n\nWrapping the delegate prevents people from outside of the class from invoking\
    \ the delegate directly (which means you can no longer raise an event from outside\
    \ of the class it exists in) as well as mucking from the methods that are contained\
    \ in the delegate chain.\n\nInterestingly, the code above is actually completely\
    \ legal code. If you don't the default implementation of an event, you can write\
    \ code that looks like the previous sample and something different or additional\
    \ with it. In practice, it's rare to have a real need to deviate from the standard\
    \ pattern, but it is allowed.\n\nOne complication with explicitly implementing\
    \ the add and remove parts for an event like this is that you can no longer invoke\
    \ the event directly. Instead, you have to invoke the delegate that it wraps (numberChanged\
    \ instead of NumberChanged, in this specific case). That you've created custom\
    \ behavior for what it means to add or remove a method to an event and the normal\
    \ rules are guaranteed to apply. For instance, it is possible that the event doesn't\
    \ wrap a delegate at all anymore, or that it subscribes or unsubscribes from multiple\
    \ delegates, depending on certain conditions. Since the compiler can guarantee\
    \ what it means to raise the event anymore, the programmer must determine what\
    \ it means.\n\nTry It Out!\nates and Events Quiz. Answer the following questions\
    \ to check your understanding. When you're done, check your answers against the\
    \ ones below. If you missed something, go back and review the section that talks\
    \ about it.\n\n+   1. True/False. Delegates allow you to assign methods to variables.\n\
    2. True/False. You can call and run the method currently assigned to a delegate\
    \ variable.\n3. True/False. Events allow one object to notify another object when\
    \ something occurs.\n4. True/False. Any method can be attached to a specific event.\n\
    5. True/False. Once attached to an event, a method cannot be detached from it.\n\
    \nAnswers: (1) True. (2) True. (3) True. (4) False. (5) False."
