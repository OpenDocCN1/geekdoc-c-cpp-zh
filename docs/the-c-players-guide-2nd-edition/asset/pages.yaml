  md: '# Access Modifiers: private and public


    ```

    private string author;

    private int pages;

    private int wordCount;

    }

    ```


    Now let''s look at what we''ve done. For each instance variable, we start off
    with the private modifier, which we''ll discuss in a second. The rest is just
    creating any other variable—we state the type of the variable, followed by the
    name we want to give it.


    These variables are a little different from what we''ve seen up until now, in
    terms of how they''re used. The variables we''ve been creating are local variables,
    meaning that they can be accessed locally, within a single method, or sometimes
    within a single loop. We''ve also seen a second type of variable called parameters,
    which are like local variables, only they are declared as a part of a method header,
    which means the calling method gives to the values. Instance variables, these
    we just created, belong to an object. They can be accessed anywhere throughout
    the class, spanning all of the methods it contains, and all of the constructors
    it''s not just limited to a simple method.


    # Access Modifiers: private and public


    Let''s go back to that private keyword. Everything in a class has an accessibility
    level. This indicates where it can be accessed from. The private keyword indicates
    that this variable can only be accessed (or changed) from inside of the class.
    Anything outside of the class doesn''t even know it exists. It''s private.


    Another accessibility level, which we''ll see shortly, is public. The public access
    modifier means that it can be seen or used from anywhere, including outside of
    the class. We have the option of making these variables public, but that would
    mean that anyone, anywhere, can directly modify them, which could have bad consequences.
    For instance, that would mean someone could change wordCount to a negative value,
    which wouldn''t make sense.


    By making things private, we keep them safe from outside middling. That''s nearly
    always what we want for instance variables. If there''s a need for things outside
    of the class to access this data or modify it, we can provide methods that are
    public, which can handle access requests and ensure that those requests don''t
    something dangerous or dumb with our class''s data.


    Generally speaking, a class should be responsible for handling changes to its
    instance variables. This keeps everything that the class is responsible for safe
    and protected inside of the class. This is called encapsulation.


    By the way, if you don''t put an access modifier, these variables would be private
    by default; private is the default accessibility level for all members of a class.
    Because of this, it wasn''t technically necessary to use private in this case,
    but I think it''s a good idea to put it there, to make it obvious.


