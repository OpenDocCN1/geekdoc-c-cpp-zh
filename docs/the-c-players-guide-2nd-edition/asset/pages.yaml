  md: "# The ‘internal’ Access Modifier\n\nThere is one other type of access modifier\
    \ that we should probably discuss at this point. That is the internal access modifier.\
    \ If something is marked as internal, then it can be used anywhere inside the\
    \ current project or assembly. While there are some exceptions to this, you can\
    \ generally think of an assembly as a single project in compiled form, resulting\
    \ in a single EXE or DLL.\n\nThings that are available to anyone who has access\
    \ to the assembly, even if it lives in a different assembly or project. If you\
    \ intend for something to be used widely, it should be public.\n\nBut public is\
    \ very... accessible. Anyone who has the compiled code can do things with it.\
    \ In some cases, you're building types for your own personal use, but your intention\
    \ is not to give it out to anyone who has your program. Programs feels like oversharing.\n\
    \nAnd this isn't about being greedy and selfish. Anything that is part of your\
    \ public interface—anything you present to the outside world with the public keyword—something\
    \ that you are going to maintain and support. Any changes you make to them will\
    \ directly affect the people using them. It is good to limit the things you want\
    \ to make public to as few things as possible.\n\nThis is where the internal access\
    \ modifier comes into play. The internal modifier means that it can be used by\
    \ anyone within the same project or assembly, but anything outside of the assembly\
    \ does not have access to it.\n\nThe reason I bring all up here and now is because\
    \ we have already seen and used the internal accessibility level without realizing\
    \ it. I indicated before that instance variables or methods that don't have an\
    \ explicitly stated accessibility default to private. Well classes default to\
    \ internal.\n\nIf the top of your class says\n\n```\nclass Book // Or any other\
    \ name...\n{\n```\n\nThis means your class has the internal accessibility level.\
    \ If you want to be able to use the class outside of the original project, you'll\
    \ need to change that to:\n\n```\npublic class Book\n{\n```\n\nAlternatively,\
    \ you can also explicitly state that a class is internal, or that a method or\
    \ instance variable is internal by using the internal keyword:\n\n```\ninternal\
    \ class AnyClass\n{\n    internal int aNumber;\n\n    internal void DoSomething()\n\
    \    }\n}\n```\n\nI should mention that if your class is internal, but a method\
    \ or instance variable is public, that people outside of the assembly still won't\
    \ be able to get access to it. The type itself must be public, in order to even\
    \ check if the member is publicly available."
