  md: '# 314 Chapter 45 How Your Project Files are Organized


    # The bin and obj Folders


    You may or not see folders called bin and obj. If you don''t see them, open the
    project and compile it these folders will appear. These are both used for building
    and storing executable versions of your projects and solutions (EXE and DLL files).


    The difference between the obj folder and the bin folder is that when the program
    is compiling, at first it will place stuff in the obj directory. The file here
    is not necessarily complete, and can be thought of as a staging area for the final
    executable code, which will get put into the bin folder. If you''re going to hand
    off the EXE, or attempt to run the EXE from here, you would go with the one in
    the bin folder, not the one in the obj folder.


    If you open up either of these directories, you''ll likely see a folder there
    called Debug or Release. Dig down further and you''ll end up seeing the EXE file
    (or a DLL file if the project is a library) with a rainbow of other files. If
    you get a Debug or Release file depending on how you''ve built your project. you''ll
    see a debug directory. If you told it to run in release mode, you''ll see a release
    directory.


    Both the obj and bin directories should be kept out of the version control repository,
    if you''re using it. If you''re submitting an assignment for a class, or handing
    off your code to another programmer, these directories do not need to be included,
    because they are giving it to someone else who has the capacity to compile it
    themselves. It reduces the total size of what you''re sending and eliminates the
    executable files, which many systems block.)


    # The Properties Folder


    The Properties folder contains properties and resources that you''ve added to
    your project. For a large project, this can be quite large.


    At a minimum, you''ll probably see an AssemblyInfo.cs file in the Properties folder
    of the project. This file contains information about your project, including versioning
    information. This file is also important, and it is a shared file, so you should
    put it in version control.


    You can open the file and see what it contains, and it is worth pointing out that
    everything in this can be edited by Visual Studio by right-clicking on your project
    in the Solution Explorer and choosing Properties, and then on the Application
    tab click the Assembly Information... button, where you can specify the information
    you want.


    # Source Files and Everything Else


    At this point, we have covered everything your actual code and other folders you
    may have added directly to your project in Visual Studio. If you look around,
    you''re bound to find a bunch of .cs files, which are your C# code. Any directories
    that we have not discussed are directories that you have made in Visual Studio,
    and each folder that you see likely represents a different namespace. This is
    the default behavior, but you can change your namespaces to something else entirely.
    I wouldn''t recommend doing that, as it is very hard to have your namespaces match
    up with the folder structure that the files are in.'
