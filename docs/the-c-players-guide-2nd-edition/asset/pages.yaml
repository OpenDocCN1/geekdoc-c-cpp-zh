  md: '# Reading and Writing Files


    +   In a Nutshell

    * The File class is a key part to any file I/O.

    * You can write out out data to a file all in one go, using File.WriteAllText
    or File.WriteAllLines.

    * You can read the entire contents of a file all at once using File.ReadAllText
    or File.ReadAllLines.

    * You can also read from and write to files little at a time, in either text or
    binary format, by wrapping the FileStream that is returned by File.OpenRead or
    File.OpenWrite in a StreamReader/TextWriter or BinaryReader/BinaryWriter.

    * When writing a little at a time, you need to clean up when you do, to ensure
    that unmanaged resources are cleaned up.


    Working with files is a very common task in programming. Reading from and writing
    files is often called file input and file output respectively, or simply file
    I/O.


    There is a collection of types that will make it easy to work with files. In this
    chapter, we''ll look at how to write to a file or read from a file all in one
    step. We''ll then look how to work with files a little reading or writing at a
    time, in both text and binary formats.


    # All At Once


    # Writing the File


    There are two simple ways to write a bunch of stuff to a file at once. These ways
    are defined in the File class, which is going to be the starting point for all
    of our file I/O.


    To write a bunch of text to a file, we can use the File class''s static WriteAllText
    method:'
  merge: -1
