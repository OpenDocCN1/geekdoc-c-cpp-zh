    \ each of curly braces as you want.\n\n# Curly Braces Not Needed\n\nSo far, our\
    \ examples have always had a block of code after the if or else statement, surrounded\
    \ by curly braces. If you have exactly one statement, then you don't actually\
    \ need the curly braces. We have written the previous code like this:\n\n```\n\
    if(score == 100)\n    Console.WriteLine(\"Perfect score! You win!\");\nelse if(score\
    \ == 99)\n    Console.WriteLine(\"Missed it by THAT much.\"); // Get Smart reference,\
    \ anyone?\nelse if(score == 0)\n    Console.WriteLine(\"You must have been TRYING\
    \ to get that bad of a score.\");\nelse\n{\n    Console.WriteLine(\"Ah, come on!\
    \ That's just boring.\");\n    Console.WriteLine(\"Seriously. Next time pick a\
    \ more interesting score.\");\n}\n```\n\nAs you can see from last part, if you\
    \ have multiple statements, you will always need the curly braces.\n\nIn a lot\
    \ of cases, if it's just a single line, it is more readable to leave off the curly\
    \ braces, which have a tendency to add a lot of weight to the code. The code feels\
    \ lighter without them.\n\nIt's important to remember one maintenance problem\
    \ when you leave off the curly braces. There's a danger as you make changes to\
    \ your code later, you might accidentally add in the new lines and forget to add\
    \ the curly braces. This completely change the way the code is executed, as shown\
    \ here:\n\n```\nif(score == 100)\n    Console.WriteLine(\"Perfect score! You win!\"\
    );\n    Console.WriteLine(\"That's awesome!\"); // Inadvertently executed every\
    \ time.\n```\n\nRemember, whitespace doesn't matter in C#, so even though that\
    \ last statement looks it belongs in the if statement, it isn't actually in. The\
    \ middle line will only be executed when the condition is met, but the last line\
    \ will always be executed, because it isn't in the if statement."
