    \ on a method like this:\n\n```\npublic new string[] Search(string findThis)\n\
    {\n    //...\n}\n```\n\nWhen you use the new keyword here, what are you saying,\
    \ \"I'm making a brand new method in the derived class that has absolutely nothing\
    \ to do with methods by the same name in the base class.\" In this example, this\
    \ Search method is completely unrelated to the Search method in the SearchEngine\
    \ class.\n\nThis is usually a bad idea because it means you now have two unrelated\
    \ methods with the same name and signature. This name conflict can be resolved,\
    \ but it is best to avoid it altogether.\n\nPeople often get this new keyword\
    \ confused with overriding virtual and abstract methods for two reasons. One,\
    \ looks like the new keyword here gets used in the exact same way as override\
    \ would. If you forget to put in anything at all (new or override) when you use\
    \ the method signature, you'll get a compiler warning that tells you to add the\
