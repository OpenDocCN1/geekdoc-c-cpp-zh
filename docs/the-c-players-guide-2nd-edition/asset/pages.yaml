    # Working with Different Types and Casting


    Typically, when you do math with two things that have the same type (adding two
    ints for example) the result is the same type as the things you started with.
    But what if you do math with two different types? For example, if you add an int
    with a long? The computer basically only knows how to do math on two with the
    same type. So to get around this on the fly the operation to be done. This conversion
    is called typecasting or simply casting.


    There are two types of casting in C#. One is implicit casting, meaning it happens
    for you, without having to say so, the other is explicit casting, meaning you
    have to indicate that you want to do it, or it won''t happen.


    Generally speaking, implicit casting happens whenever you go from a narrower type
    to a wider type. This is called a widening conversion, and it is the kind of conversion
    that doesn''t result in any loss of information. To explain, remember that an
    int uses 32 bits, while a long uses 64 bits. Because of this, the long type can
    hold all values that the int type can handle a whole lot more. Because of this,
    say the int is narrower, and the long type is wider. C# will happily cast the
    narrower int to the wider long when it sees a need, without having to be told.
    (It implicitly cast from int to long).


    So instance, you can do the following:


    ```

    int a = 4049;

    long b = 28440439;

    long sum = a + b;

    ```


    When you do the addition, it will take the value in a and turn it into a long
    and add it to b.


    This is a widening conversion. There''s no risk of losing information because
    the wider type (like a long) can always contain any value of the narrower type
    (like the int). Because there''s no risk of losing data, the conversion is safe
    to do, and will typically happen for you.


    Floating point types are considered wider than integer types, when there''s a
    need, C# will convert integer types to floating point types. For example:


    ```

    int a = 7;

    float b = 2; // this converts the integer 2 to the floating point value 2.0

    ```


    ```

    // The value inside of ''a'' will get converted to the float type before it is
    used

    // the division here. Interestingly, since the division does with two float types,

    // we will use floating point division instead of integer division.

    float result = a / b;

    ```'
