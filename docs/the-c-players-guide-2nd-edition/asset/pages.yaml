    # Operations and Operators


    Let''s start with a quick introduction to operations and operators. Whether you
    know it or not, you have been working with operations since you first learned
    how to do. In math, an operation is a calculation that uses two (usually) numbers
    and does something with them to get a result. Addition is an example of an operation,
    as is multiplication. Operations usually have two to them: an operator (like the
    ''+'' sign) and Operand is a fancy name for the thing that the operator works
    on. If we look at the operation 2 +3, the numbers 2 and 3 are operands.


    Interestingly, not all operators require two operands. Those that do are called
    binary operators. We''ll also see that some need only one operand. These are called
    unary operators. C''ll see also has an operator that requires three operands.
    It''s a ternary operator. Because of what it does, it doesn''t make sense to discuss
    it. We''ll look at it in Chapter 10.


    # Addition, Subtraction, Multiplication, and Division


    Doing the basic operations of addition, subtraction, multiplication, and division
    should be pretty straightforward. Let''s start with a simple math problem that
    you probably did in second grade. The following code adds the numbers 3 and 4
    and stores it in the variable called a:


    ```

    int a = 3 + 4;

    ```


    The same thing works for subtraction:


    ```

    int b = 5 - 2;

    ```


    I should also point out that both of the above examples show doing math on the
    same line as a variable declaration (which we see the variable''s type listed),
    all of these operations we can do anywhere, not just when a variable is first
    declared. This would work too:


    ```

    int a;               // Declaring the variable a.

    a = 9 - 2;           // Assigning a value to a, using some math.

    a = 3 + 3;           // Another assignment.

    int b = 3 + 1;       // Declaring and assigning a value to b all at once.

    b = 1 + 2;           // Assigning a second value to b.

    ```


    Remember that a variable must be declared before you use it, as shown in the above
    code. You can also use any previously existing variables in your math. You don''t
    have to use numbers:


    ```

    int a = 1;

    int b = a + 4;

    int c = a - b;

    ```


    Don''t rush by that last part too quickly. The fact that you can use variables
    on the right hand side of an equation is how you''ll be able to calculate one
    thing based on another, step-by-step. As your program is running, the computer
    will figure out the result of the calculation on the right hand side of the equals
    sign and stick that value in the variable on the left.


    You can also chain many operations together on one line:'
