    Now, we will move ahead and show how to create your own classes.

    The ability to create classes is very important. As you write your own programs,
    you will be creating lots of yours. Because building your own classes allows you
    to break your whole program into manageable pieces that you can work with.

    In this chapter we will create a simple Book class, which we could use to represent
    some information about a book in a program. While we cover a lot of ground in
    this chapter, this is the end of the beginning. By the end of this chapter, you
