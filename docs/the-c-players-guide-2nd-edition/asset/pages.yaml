  md: '# A Closer Look at Your Program 17


    using System.Text;

    using System.Threading.Tasks;


    The few lines of your program start with the keyword **using**. A *keyword* is
    simply a reserved word, or a magic word that is built in part of the C# programming
    language. It has special meaning to the C# compiler, which it uses to do something.
    The **using** keyword tells the compiler that there is a whole other pile of code
    from someone that we want to be able to access. This is actually a bit of a simplification,
    and we''ll sort out the details in Chapter 26.


    When you see a statement like **using System;** you know that there is a whole
    pile of code named System that our code wants uses. Without this line, the C#
    compiler won''t know where to find things and it won''t be able to run your program.
    You can see that there are four using directives in your little program that are
    added by default. We will learn exactly how they work in the near future.


    # Namespaces, Classes, and Methods


    Below the using directives, you''ll see a collection of curly braces ('' and ''}'')
    and you''ll see the keywords **namespace**, **class**, and in the middle, the
    **Main**. Namespaces, classes, and methods (which **Main** is an example of) are
    ways of grouping related code at various levels. Namespaces are the largest grouping,
    classes are smaller, and methods are the smallest. We''ll discuss each of these
    in great depth as we go through this book, but it is worth a brief introduction
    we''ll start at the smallest and work our way up.


    Methods are a way of consolidating a single task into a reusable block of code.
    In other programming languages, methods are sometimes called functions, procedures,
    or subroutines. We''ll get into a lot of detail about how to make and use methods
    as we go, but the bulk of our discussion about methods will be in Chapter 15,
    with some extra details in Chapter 27.


    Right in the middle of the generated code, you''ll see the following:


    ```

    static void Main(string[] args)

    {}

    ```


    This is a method, which happens to have the name **Main**. **I''t** want to point
    out that this particular setup for a method handles everything else so that C#
    knows it can be used as the starting point for your program. Since this is where
    our program starts, the compiler will run any code we put in here. For the next
    few chapters, we will explore everything we do right in here.


    You''ll also notice that there are a few curly braces in our code. Curly braces
    mark the start and end of code blocks. Every starting curly brace ({) will have
    a matching curly brace (}) later on. In this particular part, the curly braces
    mark the start and end of the **Main** method. As we discuss classes and namespaces,
    you''ll see they also use curly braces to mark the points where they begin and
    end. From looking at the code, you can already see that these code blocks blocks
    to form a sort of hierarchy.


    When one thing is contained in another, it is said to be a *member* of it. So
    the **Program** class is a member of the namespace, and the **Main** method is
    a member of the **Program** class.'
