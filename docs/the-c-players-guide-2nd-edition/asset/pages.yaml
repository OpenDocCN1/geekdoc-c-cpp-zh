    You can alternatively get a type from an object:


    ```

    MyClass myObject = new MyClass();

    Type type = myObject.GetType();

    ```


    With a given type, you can figure out constructors, methods, properties, or other
    things the type has defined. For example:


    ```

    ConstructorInfo[] constructors = type.GetConstructors();

    MethodInfo[] methods = type.GetMethods();

    ```


    If you''re looking for a member of the type with a particular name and parameter
    list, you can do that too:


    ```

    ConstructorInfo constructor = type.GetConstructor(new Type[] { typeof(int) });

    MethodInfo method = type.GetMethod("MethodName", new Type[] { typeof(int) });

    ```


    In all these cases, if you''re looking for what doesn''t exist, an empty array
    or null will be returned.

    Once you''ve got the constructor, method, or whatever thing you asked for, you
    can execute that the invoke that they have. Doing so with constructors will return
    an object that was created by the constructor, and doing so with a method or property
    will return the result of the method (or null if the method''s return type is
    void):


    ```

    object newObject = constructor.Invoke(new object[] { 17 });

    method.Invoke(newObject, new object[] { 4 });

    ```


    # Using Statements and the IDDisposable Interface


    Back in Chapter 16 when we talked about the heap, we talked about garbage collection.
    One of the big things that C# and .NET Framework do for us is get rid of memory
    that we''re no longer using. Our program''s memory is managed for us. Occasionally
    the we''re trying to accomplish using unmanaged memory and resources. When we
    do, we can no longer rely on garbage collection to clean up these resources and
    memory.


    While there may be times we create our own unmanaged memory, it is much common
    to use a pre-existing type that uses unmanaged memory. For example, when we open
    a file like back in Chapter 28, we need to access unmanaged memory to get the
    file system. In that chapter, we used the Close method when we were done with
    a file, free any unmanaged memory or resources that were in use, but there''s
    a better way.


    Typically, those that access unmanaged memory implement the IDDisposable interface.
    These classes have a Dispose method which cleans up any unmanaged memory it is
    using. We could directly call this method (in fact, the Close method we use with
    files does that) but there are some tricky issues that come up. For instance,
    if an exception is thrown while the file is open, the file open. What we already
    know, it is possible to write code to handle this, but a simpler way to handle
    this is the using statement.


    A using statement (not to be confused with a using directive) will look something
    like this:


    ```

    using (FileStream fileStream = File.OpenWrite("filename"))

    {}

    ```'
