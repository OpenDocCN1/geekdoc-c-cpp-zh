  md: '# Chapter 24 Using Generics


    Nearly every class in the .NET Framework that contains multiple items implements
    this interface. In that sense, it serves as the base or lowest level of defining
    a collection. Both the List class and Dictionary class that we will see implement
    next. Even arrays implement Iumerable<T>.


    IEnumerable<T> provides the foundation for all sorts of interesting and important
    features in C#. In 13 we were talking about arrays and the foreach loop, we saw
    that if something implements Iumerable<T>, it can be used in a foreach loop. And
    IEnumerable is used as the foundation for LINQ queries, which we''ll talk about
    in Chapter 36.


    All sorts of things implement Iumerable<T>. If you care about the ability to do
    something with each item in a collection, you can get away with treating it simply
    as an Iumerable<T>:


    ```

    IEnumerable<int> numbers = new int[] { 1, 2, 3 };

    ```


    You''ve seen methods Iumerable<T> if they don''t want you to know the actual generic
    type used (it could be an array or a List or something else) and if you want them
    to have the ability to loop through the items (add or remove items).


    # The Dictionary Class


    To wrap up our introduction using generics, let''s look at another generic class
    that is slightly more complex than the List class: the Dictionary class. This
    class isn''t as versatile as the List class, but you''ll find uses for it, so
    it''s a good choice to look at.


    Let''s start by describing what the Dictionary class actually is. To practically
    no''surprise, the name of the class is a pretty good description of what this
    is. This class works like a dictionary. In a dictionary, you have a large list
    of words and a definition that belongs to each one. You use one of them (the word)
    to look up another piece of text (the definition).


    The Dictionary class does a very similar thing. When we use one piece of information
    (the key) to look up another piece of information (the value). So it is a mapping
    of key/value pairs. Because the class is generic, we''re not limited to strings.
    We''ll use strings for people''s names, and int for their phone numbers.


    For example, let''s look at how you use a Dictionary to create a phone book. A
    better choice might be the best, if we want a simple example that shows a Person
    or Contact class that stores names and other personal information, and a PhoneNumber
    class that deals with all the details of phone numbers, like country and area
    codes. But let''s keep it simple.


    The Dictionary class is generic, like the List class, but it has two different
    types that are generic: the key, which we use to do the lookup, and the value
    that belongs to it. Instead of putting one type in the brackets like we before,
    the Dictionary class requires that we put two, for each of the types that are
    generic:


    ```

    Dictionary<string, int> phoneBook = new Dictionary<string, int>();

    ```


    The Dictionary allows us to use the indexer (''['' and '']'') to get or set values
    in it:


    ```

    phoneBook["Gates, Bill"] = 5550100;

    phoneBook["Zuckerberg, Mark"] = 5551438;

    ```


    ```

    int phoneNumber = phoneBook["Gates, Bill"];

    ```


    We''ve covered everything Dictionary can do. Feel free to explore and see what
    else is there.'
