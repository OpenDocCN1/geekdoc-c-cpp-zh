  md: '# Chapter 21 Inheritance


    # # C# Does Not Support Multiple Inheritance


    Some object-oriented programming languages (C++, for example) allowed you to choose
    more than one base class to derive from. There are some benefits to this, because
    it allows one type of object to have an is-relationship with more than one type.
    For example, if you have a Knife class and a Saw class, you could create a PocketKnife
    class that is both a knife and a (really) saw along with dozen other things.


    Unfortunately, having multiple inheritance tends to make things complicated, and
    can lead to situations where it is ambiguous how the class should behave. It is
    because of that C# has decided not to allow multiple inheritance. You must pick
    only one base class.


    You can mimic multiple inheritance by using interfaces, which we''ll talk about
    in Chapter 23.


