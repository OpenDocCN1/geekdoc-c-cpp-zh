  md: "# Unsafe Code 257\n\n```\npublic const double PI = 3.1415926;\n```\n\nAdding\
    \ const tells the compiler we're assigning a value and it will never change. In\
    \ fact, if we try to assign a value to it at some point in our program, we'll\
    \ get a compiler error.\n\nIf you have a value that you will never change, it\
    \ is a good idea to make it into a constant by adding the const keyword to it.\
    \ That way, no one will miss it on accident.\n\nIt is worth noting that anything\
    \ marked with const is automatically treated as though it is static. Because this\
    \ is assumed (and required) you don't need to (and can't) make it yourself.\n\n\
    The readonly keyword is similar to this, but it has an important difference. Anything\
    \ that is marked const must be assigned a value right up front, when the program\
    \ is being compiled. As such, they are often called compile-time constants. Constants\
    \ that are marked with readonly can be assigned to in a constructor or at the\
    \ same place it is declared, and these are called runtime constants.\n\nYou can\
    \ assign to a readonly field either when you declare the variable (like com-constants)\
    \ or also, in a constructor of the class. Which brings us to the key distinction:\
    \ run-time constants can be different in every instance of a class.\n\nFor example,\
    \ we could create a Point class that has an x and y-coordinate in such a way that\
    \ once it has been created, it is impossible to change the values.\n\n```\npublic\
    \ class Point\n{\n    private readonly double x;\n    private readonly double\
    \ y;\n\n    public double X get { return x; } // We could also have used a readonly\
    \ property\n    public double Y get { return y; } // for these, but this illustrates\
    \ the point well.\n\n    Point(double x, double y)\n    {\n        this.x = x;\n\
    \        this.y = y;\n    }\n}\n```\n\nWe can use this class, creating two point\
    \ with different values, but both are unchanging:\n\n```\nPoint p1 = new Point(5,\
    \ -2);\nPoint p2 = new Point(-3, 7);\n```\n\nBy this, it is an excellent way of\
    \ building immutable types like we discussed in Chapter 20.\n\n# Unsafe Code\n\
    \nIn C#, all memory is managed for us, as we've discussed in other chapters is\
    \ a huge help. Earlier languages like C and C++ didn't have this feature. As nice\
    \ as it is, there are a few rare cases where we want to jump outside of the safety\
    \ bounds and work in an unregulated arena.\n\nI'm not going to get into a detail\
