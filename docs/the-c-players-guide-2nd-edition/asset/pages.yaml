    int minimum = int.MinValue;

    ```


    Think about this. A short can have a maximum value of up to 32767. So what if
    we do this?


    ```

    short a = 30000;

    short b = 30000;

    short sum = (short)(a + b); // The sum will be too big to fit into a short.

    // what happens?

    ```


    First of all, I should point out that when you do with the byte or short type,
    it will automatically convert them to the int type. In the code above, I''ve had
    to do an explicit cast to get it back to a short.


    Try out that code, and print out the sum variable at the end and see what you
    get. Mathemat speaking, it should be 60000, but the computer gives a value of
    -5536.


    When a mathematical operation causes something to go beyond the allowed range
    for that type, we get a thing called overflow. What happens is paying attention
    to. For integer types byte, short, int, and the most significant bits (which overflow)
    get dropped. This is especially strange, because the computer interprets it as
    wrapping around. We end up with a negative value in our example. You can easily
    see this if you start with the maximum value for a particular type (for example,
    short.MaxValue) and adding 1 to it. You''ll end up at the minimum value.


    For the floating point types, things happen differently. Because they have PositiveInfinity
    and NegativeInfinity, instead of wrapping around, they become infinity.


    Another similar condition called underflow can occur sometimes with floating point
    types. Imagine you have a very large floating point number. Something like 1,000,000,000,000,000,000,000.
    A float can store that. Now let''s say you have a float as well as another very
    small number, like 0.00000000000000000001. However, if you add the two together,
    a float cannot store the result: 1,000,000,000,000,0000001.


    A float just cannot be that big and that at the same time. The addition would
    result in 1,000,000,000,000,000,000 again. This is close enough for most things.
    But still, potentially valuable information is lost. This happens because floating
    point types have a certain number of digits of accuracy. Starting at the first
    digit that matters, it can only keep track of so many other digits before it just
    keeps track of it.


    Underflow is not as common as overflow, and it''s entirely possible you may never
    encounter a time where it matters.


