  md: "# All At Once\n\n```\nstring informationToWrite = \"Hello file storage world!\"\
    ;\nFile.WriteAllText(\"C:/Place/Full/Path/Here.txt\", informationToWrite);\n```\n\
    \nNote that the File uses the System.IO namespace which isn't included by default,\
    \ you'll have\nto add a directive (using System.IO) as we described back in Chapter\
    \ 26.\n\nAlternatively, we can take an array of strings and write them out to\
    \ a file, with each item in the array\nplaced one line in the file, using the\
    \ WriteAllLines method:\n\n```\nstring[] arrayOfInformation = new string[2];\n\
    arrayOfInformation[0] = \"This is line 1\";\narrayOfInformation[1] = \"This is\
    \ line 2\";\nFile.WriteAllLines(\"C:/Place/Full/Path/Here2.txt\", arrayOfInformation);\n\
    ```\n\nYou can see that both of these require the path to the file to write to,\
    \ along with the text to write out.\nReading the File would work, too.\n\n# Reading\
    \ the File\n\nReading a file in it is just as easy:\n\n```\nstring fileContents\
    \ = File.ReadAllText(\"C:/Place/Full/Path/Here.txt\");\nstring[] fileContentsByLine\
    \ = File.ReadAllLines(\"C:/Place/Full/Path/Here2.txt\");\n```\n\nThis does the\
    \ same thing, but in the reverse part, the entire contents of the file are \"\
    slurped\"\nto the fileContents variable. On the second line, the whole thing is\
    \ pulled in as an array of strings,\nwhere each line in the file is a different\
    \ item in the string array.\n\n# Assembling and Parsing File Contents\n\nUsing\
    \ File.ReadAllText or File.ReadAllLines is simple to work with, but your work\n\
    does't end there. A string or an array of strings is often not the final format\
    \ of our information.\n\nAs an example, let's say you have a file that contains\
    \ high scores for a game. This might look like this\n(this is a CSV file, by the\
    \ way):\n\n+   -2778\nGimli,140\nBilbo,129\nAragorn,88\nSam,36\n\nLet's have a\
