  md: '# String Interpolation 51


    To handle this, we can take advantage of escape characters. In C#, you start an
    escape sequence with the backslash (\). Inside of a string literal, you can use
    a backslash, followed by a quotation mark, to recognize it as a quotation mark
    that belongs inside the string, opposed to one that indicates the end of the string:


    ```

    Console.WriteLine("\");

    ```


    It is worth pointing out that even though \" is visually two characters, it is
    treated as only one. C# has lots of different characters that you''ll find. \t
    is the tab character, and \n is the newline character. You can see how this works
    in the following example:


    ```

    Console.WriteLine("Text\non\nmore\nthan\nline.");

    ```


    This will print out:


    +   Text

    on

    more

    than

    one

    line.


    So what happens if you want to print out an actual backslash character? By default,
    the computer will try to take \ and combine it with the next letter to represent
    an escape character, since it marks the begin

    ing of an escape sequence. To print out the backslash character, you will need
    to use two backslashes:


    ```

    Console.WriteLine("C:\Users\\RB\Desktop\\MyFile.txt");

    ```


    This will print out:


    ```

    C:\Users\RB\Desktop\MyFile.txt

    ```


    If you find that all of these escapes are annoying of you, you can use the ''@''
