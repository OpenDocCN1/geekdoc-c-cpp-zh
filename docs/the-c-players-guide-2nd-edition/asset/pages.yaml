  md: "# Base Classes 145\n\nAnd in fact, that is getting right to the heart of what\
    \ we're going to discuss in this. A square is a polygon, but more specifically,\
    \ it is a special type of polygon that has its own things. Anything a polygon,\
    \ a square can do too, because a square is a polygon.\n\nThis is what programmers\
    \ call an is-relationship, or an is-special-type-of-relationship. It is so common\
    \ that programming languages have a special way to facilitate this kind of thing.\n\
    \nThis is called inheritance. Inheritance allows us to create a Polygon class,\
    \ and a Square class that is based on Polygon, to inherit (or use) everything\
    \ from the Polygon class that it is based on. Any changes we make to the Polygon\
    \ class will also be automatically changed in the Square class.\n\nClasses support\
    \ inheritance, but other types do not. It a key difference between the two.\n\n\
    # Base Classes\n\nA base class (or superclass or parent class) is any normal class\
    \ that happens to be used by another inheritance. In our discussion, the Polygon\
    \ class would be a base class.\n\nFor instance, we could have a class that looks\
    \ like this:\n\n```\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    using System.Text;\n\nnamespace Inheritance\n{\n    // Nothing special about this\
    \ class. It will be used as the base class.\n    class Polygon\n    {\n      \
    \  public int NumberOfSides { get; set; }\n\n        public Polygon()\n      \
    \  {\n            NumberOfSides = 0;\n        }\n\n        public Polygon(int\
    \ numberOfSides)\n        {\n            NumberOfSides = numberOfSides;\n    \
    \    }\n    }\n}\n```\n\n# Derived Classes\n\nA derived class (or subclass) is\
    \ any class that is based on, and expands upon another class. In our example,\
    \ the Square class is a derived class that is based on the Polygon class. We would\
    \ say that the Square class is derived from the Polygon class.\n\nYou can create\
    \ a derived class just like any other class with one small addition to indicate\
    \ which class is its base class. To indicate that the Square is derived from the\
    \ Polygon class, we use the colon (':') and name the base class:"
