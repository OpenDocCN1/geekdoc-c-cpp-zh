    # Referencing Existing Projects


    The simplest approach to reusing another external collection of code is by referencing
    another project. Perhaps it is another project that you wrote yourself. Or it
    might be a project from elsewhere that has the source code. (This happens a lot
    if you are taking advantage of open source software.)


    If you have another project that contains the code you want to use, it is a pretty
    easy to access to that code.


    Let''s say your main project, which we''ll call AwesomeProgram, for the moment.
    And let''s say that at some point in the past, you created another project called
    HelperCode. To get quickly, you want to allow your AwesomeProgram solution to
    know about and use the HelperCode project that you made earlier. When starting,
    Solution Explorer might look like the image to the right.


    Step 1. Add the HelperCode project, right-click on the Solution at the top and
    choose Add > Existing. Browse your file system to find the .csproj file for the
    project that you want to add. In this particular case, mine is called HelperCode.csproj.


    > Side Note

    Adding a New Project Instead of adding an existing project, you could also add
    a completely new project. The files for the new project will be contained within
    the same folder as the rest of the solution. To add a new project, instead of
    choosing Add > Existing Project, you''d simply choose Add > New Project. The rest
    of the steps for referencing this are the same as adding a reference to an existing
    project.


    ![](img/ad92120e75cb88980f77f3297768b8f0_314_0.png)


    Once you''ve chosen the project, Visual Studio will add that project and all of
    its contents to your solution, which will now look something like this in the
    Solution Explorer:


    You''ll see that your solution contains the two projects! But we''re not quite
    done yet. Our solution knows about the different projects, but by your first project,
    the AwesomeProgram project, doesn''t know it is allowed to use the code in the
    second project.


    Step 2. Under the AwesomeProgram project, right-click on References, and choose
    Add > Reference... This will open up a dialog that will allow you to choose a
    reference for the other project. It looks like the image below.'
