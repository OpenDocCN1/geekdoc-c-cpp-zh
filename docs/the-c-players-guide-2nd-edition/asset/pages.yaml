  md: 'Inside of the solution folder, you''ll find three things. You''ll see a .sin
    file, a folder for every project in your solution (only if you''ve got one project
    in your solution), and you may also see a .suo file. If you don''t see the .suo
    file, it''s probably still there, hidden. If you don''t see it, don''t worry too
    much. It''s not too critical that you can see it. It is important to know that
    it is there.


    # The .sin File


    The .sin file is your solution file. It is very important. It contains information
    about what projects are contained in the solution, as well as solution settings
    like build configurations. The .sin file contains shared information that everyone
    will want to keep the same, and it should be included in your version control
    system if you have one.


    # The .suo File


    The .suo file is the solution options file. It contains various settings for the
    project that Visual Studio uses. Like I said earlier, it is a hidden file, so
    you may not see it. This contains things like what you you open when you used
    the last project, so they can get reopened when the project is reopened.


    You could delete this file and nothing would happen.


    Because this file contains user-specific information, this file shouldn''t go
    into version control. Instead, everyone should have their version of the file.


    # The Project Directories


    In your solution directory, you will find that there is one folder for each project
    in your solution.


    Let me clarify what has confused many people in the past, including myself. By
    default, you''ll have one project in your solution. This is the name that you
    created. If you created a new project called LikeFacebookButBetter, you''ll be
    looking at here a folder LikeFacebookButBetter inside of a folder called FacebookButBetter.
    It can be confusing at it. The key to remember is that the top level is the solution
    folder, and the lower level is the project folder, and they represent two different
    things.


    # The Project Directory


    Inside of a project directory, you will see many more files. For starters, you
    will see a file ending with .csproj. You will also see another file ending with
    .csprojuser. You should also see a Properties file. And you''ll probably find
    a pile of .cs files, or other folders that contain .cs files and other resources.
    You may also see a bin and an obj file.


    # The .csproj File


    This is one of the most important files that Visual Studio creates. This file
    essentially defines your project. It identifies what files are included in your
    project, as well as listing assemblies, libraries, or other projects that this
    project uses. This file does for projects that the .sin file does for solutions.


    Again, if you''re using version control, this one belongs in the repository.


    # The .csproj.user File


    This file, like the .suo file, contains user-based settings, but for project instead
    of the solution. Like the .suo file, every user gets their own copy, so it should
    not go into version control.'
