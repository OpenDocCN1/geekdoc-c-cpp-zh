    \ convert from one type to another, but that you accidentally forgot a part of\
    \ the code that left the compiler thinking you were trying to convert types.\n\
    \n# **not all code paths return a value**\n\nIf you see an error that says something\
    \ along the lines of [Namespace].[Type]. MethodName(): not all code paths return\
    \ a value, it simply means that it is possible for the program to go through your\
    \ code that reaches the end of the method without returning anything.\n\nThe code\
    \ below is perhaps overly simple, but it gets to the heart of what's going on:\n\
    \n```\npublic int DoSomething(int a)\n{\n    if (a < 10)\n        return 0;\n\
    }\n```\n\nThe method is supposed to return an int. If the value is less than 10,\
    \ a value is returned (0). But if a is 10 or higher, it skips return statement\
    \ and goes to the end of the method without returning anything.\n\nTo solve this\
    \ problem, you need to analyze your code to find what paths through your code\
    \ are failing to return a value, and add it in. One way to fix the problem from\
    \ the code above is this:\n\n```\npublic int DoSomething(int a)\n{\n    if (a\
    \ < 10)\n        return a;\n\n    return a;\n}\n```\n\n# **The type or namespace\
    \ name 'x' could not be found**\n\nAs soon as you start trying to use someone\
    \ else's code or code in other projects that you've created, or even just putting\
    \ things in different folders or namespaces, you're going to run into this error.\n\
    \nYou'll see this error with something like:\n\n```\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\n```\n\n\
    ```\nnamespace Example\n{\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            MissingClass c = new MissingClass(); // Error\
    \ here\n        }\n}\n```"
