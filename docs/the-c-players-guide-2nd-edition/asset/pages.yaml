  md: "```\n{\n}\n```\n\n# Conditional Operators: &&& and || (And and Or)\n\nThere\
    \ are a lot of ways your conditions could become more complicated. imagine you\
    \ are making a game where the player controls a spaceship that has shields and\
    \ armor, and the player only dies when both shields and armor are gone. You will\
    \ need to check against both things, rather than just one.\n\nHere's where conditional\
    \ operators come into play. C# has an and operator, which looks like this: &&\
    \ ||. (The '|' key is above the <Enter> key on keyboards and requires pushing\
    \ <Shift+>.) You can use these to check multiple things at once:\n\n```\nint shields\
    \ = 50;\nint armor = 20;\n\nif(shields <= 0 && armor <= 0)\n    Console.WriteLine(\"\
    You're dead.\");\n```\n\nThis could be read, if shields is less than or equal\
    \ to zero, and armor is less than or equal to zero. With the && operator, both\
    \ parts of the condition must be true for the whole expression to be true.\n\n\
    The || operator works in a similar way, though if either one is true, the whole\
    \ thing becomes\n\n```\nint shields = 50;\nint armor = 20;\n\nif(shields > 0 ||\
    \ armor > 0)\n    Console.WriteLine(\"You're still alive! Keep going!\");\n```\n\
    \nOne thing worth mentioning that with either of these, the computer will do lazy\
    \ evaluation. This means it won't check the second part unless it needs to. So\
    \ in the example above, the computer will always check if shields is greater than\
    \ 0, but it only bothers checking if armor is greater than 0 if shields is less\
    \ than or equal to 0.\n\nYou can combine lots of these together, and along with\
    \ parentheses, make some pretty crazy conditions. Anything you want is possible,\
    \ though quickly become an issue. Which leads us to the next section, which might\
    \ provide an alternative approach that may be readable.\n\n# Nesting If Statements\n\
    \nYou can also put if statements (and if-else statements) inside of other if statements.\
    \ This is called nesting them. For example:\n\n```\nif(shields <= 0)\n{\n    if(armor\
    \ <= 0)\n        Console.WriteLine(\"Your shields and armor are both zero! You're\
    \ dead!\");\n    else\n        Console.WriteLine(\"Shields are gone, but armor\
    \ is keeping you alive!\");\n}\n```"
