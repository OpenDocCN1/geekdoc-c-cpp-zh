  md: "# The 'static' Keyword 127\n\nFirst, you'll note that all of these methods\
    \ are marked public. That means anyone outside of the class can call them. We\
    \ could have marked these methods private if we wanted to, which would make it\
    \ so you only call the method from inside the class. In our specific case, we\
    \ wanted to be able to call these methods, so we make them public.\n\nSecond,\
    \ we see here methods that start with Get and Set. It is extremely common to have\
    \ methods that more or less just return the value of an instance variable, and\
    \ matching ones that sets the value of the variables. Additionally, while setting\
    \ the value of an instance variable, we often check to ensure the value is valid.\
    \ So you may have some of Getting methods and Setting methods.\n\n\"Getter\" and\
    \ \"setter\" methods, as they're called, are incredibly common. So common, in\
    \ fact, C# provides a feature in the language that makes this more readable and\
    \ simple to use (called properties) which we will talk about in the next chapter.\n\
    \nPerhaps you notice that we didn't add static to these methods, which we've done\
    \ in the past. It's time for us to take a look at what static actually means,\
    \ and why we didn't add it here.\n\n# The 'static' Keyword\n\nSo far, in this\
    \ chapter, we've been working with instance variables and methods that belong\
    \ to an instance of the class. This means you can create different instances of\
    \ the class, each has its own set of data. When you call the methods using them,\
    \ the methods work on individual instance's data. For example, you can create\
    \ Book objects that each have their own author, page count, and word count. GetTitle\
    \ with static will get you the title of that specific book.\n\nIn previous chapters,\
    \ we've been marking our methods static. So let's talk about what that means.\
    \ Any class member that is marked with the static keyword belongs to the class\
    \ as a whole, rather than any particular instance. In fact, C#'s evil twin language,\
    \ Basic.NET, instead of using \"static\" we use the word \"Shared.\" That's actually\
    \ a much clearer way of thinking about it. Anything that is static does not belong\
    \ to a specific object, but rather it is shared among all of the objects of that\
    \ particular class.\n\n# Static Variables\n\nFor a class-level variable, marking\
    \ with static means that it will have the same value for all instances. If instance\
    \ #1 changes a static variable to the value of 4, then instance #2 will also change\
    \ that. Static variables are shared between all instances of the class. This means\
    \ the variable is no longer an instance variable, but rather, a class variable,\
    \ or class variable for short. It belongs to the class as a whole, not to particular\
    \ instance of it.\n\n# Static Methods\n\nIf a method is marked with static, as\
    \ we have done before, this means that you don't need an instance of the class\
    \ to call it, since it belongs to the class as a whole. To illustrate, a \"normal\"\
    \ method that isn't static might be accessed like this:\n\n```\nBook book = new\
    \ Book(\"Ender's Game\");\nbook.AssignWordCountFromText(\"\n    \"I watched through\
    \ his eyes\n```"
  merge: -1
