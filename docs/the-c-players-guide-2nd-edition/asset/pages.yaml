- img_proc: true
  md: '# 278 Chapter 40 C# and the .NET Framework


    ```

    li $0, 2

    li $1, 2

    add $2, $0, $1

    ```


    We can now see the 2s in there, and we can even identify the add instruction.
    Humans can make some sense of this, and typos are much easier to catch. But these
    three lines only do a single addition operation. Imagine if you were trying to
    write a real program.


    For the most part, assembly directly mirrors binary. Every line of assembly will
    result in a single instruction in the body. (There are a few shortcuts in many
    versions of assembly language that are exceptions to this.)This means that the
    actual instructions we have available to us in assembly are the exact instructions
    that the physical computer has. If our computer isn''t able to addition, then
    there won''t be an instruction in our version of assembly.


    Now that we''ve introduced assembly, we can more formally define the word compiling.
    Compiling code is simply translating from a high level language to a lower level.
    We can make a simple compiler to turn assembly code into machine code. It would
    be pretty simple and straightforward, because every line of assembly code becomes
    a single line of machine code.


    But even assembly is not very easy to work with. The If statements, and loops
    that we learned about in Chapters 10 and 12 don''t exist in assembly. We need
    to do a lot more work to make that kind of stuff happen. Working in assembly isnt
    still much fun.


    This is why all of these programming languages were invented. Programming languages
    are built in a way that mimics a human language but has a formal structure to
    it that a compiler can figure out, step-by-step, what binary instructions needs
    to make it happen.


    # "Classical" Compilation


    This is the "classical" compilation process, as we learned in Chapter 1, with
    C#, it''s not quite simple. Instead, C# relies on a virtual machine called the
    Common Language Runtime.


    ![](img/ad92120e75cb88980f77f3297768b8f0_300_0.png)


    # Virtual Machines and the CLR


    Since C# utilizes a virtual machine, it is worth taking to explain what a virtual
    machine is, and why it is so helpful. We''re going to make a brief detour and
    look into this.


    Binary instructions are directly tied to the hardware they are running on. This
    means that the same set of instructions won''t run on all computers. Additionally,
    every operating system that you are going to present the hardware to your program
    (as well as various operating system tools) in in different ways. So even if you
    have the same architecture, if you have a different operating system, you''ll
    potentially need a different compiler once again.


    What does that mean for compilers?


    Well, you''d need a different compiler (or at least different configuration settings)
    for each hardware architecture that you want to have your code run on.


    Let''s get things even further and see that there are multiple programming languages,
    because well... there are. With the "classic" approach, we''ll need a different
    set of compilers for each language.'
