    So far, all of the methods we've looked at haven't returned anything. If you look\
    \ back, you'll see that we've been putting the void keyword before our name when\
    \ we create it. This means that the method doesn't return void. By changing that,\
    \ our method can return something. To do this, instead of the void keyword, we\
    \ simply place a different type, like int, float, or string. This makes it so\
    \ our method can (and must) return a value of that particular type.\n\nInside\
    \ of a method, we use the return keyword to return a specific value. This is followed\
    \ by the value we want to return. A simple example of returning a value is this:\n\
    \n```\nstatic float GetRandomNumber()\n{\n    return 4.385f; // Obviously random.\n\
    ```\n\nYou can see that by stating the return type (float in this case, meaning\
    \ we're going to return something of the type float), and inside of the method,\
    \ we simply use the return keyword, along with the actual value we want to return.\
    \ Obviously, this is not a very useful example, but it illustrates the point.\n\
    \nLet's go on a more sophisticated example. For far in this book, there have been\
    \ many times that we've done things like asking the user to type in a number.\
    \ The code below creates a method that asks the user for a number between 1 and\
    \ 10, and keeps asking until they finally give us something that works. At that\
