  md: '# 34 Chapter 6 The C# Type System


    For each of the types we have looked at, we could have an alternate version where
    we shift the valid range to only include positive numbers. This would allow us
    to go twice as high, at the expense of not being able to use negative values at
    all. The ushort, uint, and long types just do this. The ushort type uses two bytes,
    like the short type, but instead of going from -32,000 to +32,000, it goes from
    0 to 64,000. The same thing applies to uint and long types. The exact ranges of
    these types will be shown a bit later.


    Likewise, we can make the byte type, which is unsigned, and shift it so that it
    includes negative numbers as well. Instead of going from 0 to 255, we go from
    -128 to +127. This gives us the signed byte type, sbyte.


    Surprisingly, we can create variables of these types just like we could with the
    int:


