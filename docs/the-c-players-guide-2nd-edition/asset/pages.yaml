    \ is critical that you know how to deal with it and every error that comes up\
    \ in your code.\n\nSo in this I'll outline a few principles that you should keep\
    \ in mind even when you have no clue how to fix the problem.\n\n# Ensure you Understand\
    \ What the Error Says\n\nLook at the error message Does each word in the error\
    \ make sense or is there something there that you don't understand? Do you understand\
    \ each of the phrases in the error? For instance, take the following error message:\n\
    \nAccess modifiers are not allowed on static constructors\n\nWhen you see this\
    \ stop and think do you know what an access modifier is? (If not, see Chapter\
    \ 18) Do you know what a static constructor is? (Also Chapter 18.2) Once you know\
    \ all of the pieces mean the solution is pretty straightforward as so This error\
    \ is saying you the public keyword from this:\n\n```\npublic static MyClass()\n\
    {\n  // initialize the class here...\n}\n```\n\n# Fix the Errors You Do Understand\n\
    \nThere are times when a single actual problem causes lots of errors to show up\
    \ in the list. If you get a large pile of errors look through the list and fix\
    \ one or two that you understand and recompile. Doing so get rid of all of the\
    \ errors.\n\nCompiling happens in parts. If the compiler can't get through one\
    \ part be of an error and you fix it it is also possible that the compiler advances\
    \ to the next part additional errors are might come up. Because of this don't\
    \ worry if by fixing one error extra errors appear to pop up. The error count\
    \ shown to you doesn't necessarily show the actual number of problems in your\
    \ code.\n\n# The Error May be in a Different Spot\n\nJust because the error list\
    \ takes you to a particular location doesn't mean that the error is actually right\
