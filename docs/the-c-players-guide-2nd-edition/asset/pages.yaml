  md: '![](img/ad92120e75cb88980f77f3297768b8f0_166_0.png)


    # Inheritance


    +   **In a Nutshell**

    * Inheritance is a way to reuse classes by expanding them into more specific types
    of classes. For instance, a Square class can be derived from (or inherit from)
    a Polygon class, giving it all of the features that the Polygon class has.

    * Any class can be used as a base class, except for sealed classes.

    * To indicate a class is derived from another, use the colon followed by the base
    class. For example class Square : Polygon { /* ... */}.

    * The protected access modifier means anything within the class can use it, as
    well as anything in any derived class.


    Imagine that you are trying to keep track of geometric polygons, like triangles,
    rectangles, squares, pentagons, and so on. You can imagine creating a Polygon
    class that stores the number of sides the polygon has, and maybe also a way to
    keep track of the actual positions of the vertices (corners) of the polygon.


    Your Polygon class could be used to represent any of these polygons, but let''s
    imagine that for a square, you want to do some extra things with it. For example,
    you might want to create only one size (since the width and height are the same
    in a square), or you may want to be able to create a method that returns the area
    of the square.


    After all, a square is just a special type of a polygon.'
  merge: -1
