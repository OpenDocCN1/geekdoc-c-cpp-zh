    # Threads


    # In a Nutshell


    +   * Threading allows you to run sections of code simultaneously.

    * Starting a new thread is relatively simple in C#: **Thread thread = new Thread(MethodNameHere);
    thread.Start();**

    * Starting a thread this way runs the method indicated. It must have a return
    type of void and must not have any parameters.

    * You can also use **ParameterizedThreadStart**, which will allow you to pass
    a parameter to the method the thread is running.

    * You can wait for a thread to finish with the **Join** method: `thread.Join();`

    * If you need to worry about thread safety (preventing problems when multiple
    threads are modifying the same data), use the lock keyword: `lock(privateObject)
    { /* code here is safe */ };`. Typically, you create a private instance if the
    critical sections are all within the same class.


    Back in the day, all computers had a processor. Nowadays, they have have more
    than one. (More specifically, this is usually done by having multiple cores that
    are all part of the same processor chip.) I''m currently working on a computer
    with four processors, each of which is "hyperthreaded", making it appear that
    I have a total of eight processors. This computer isn''t a particularly fancy
    computer. There are machines out there that have 16 or 32 processors, or even
    hundreds or thousands, all working together. (Turns out, they''re kind of expensive.)
    Beyond just that, it is possible to give work to other computers to do the network,
    giving you the possibility of having an unlimited number of processors at your
    disposal.


    Computers have lot of power, but unless intentionally structure your code to run
    on multiple processors, it will only ever use one. Think of all that raw computing
    power going to waste!


    In this chapter, we''re going to take a look at threading. The basic process of
    threading is that we can take chunks of code that are independent of each other
    and make them run in separate *threads*.'
