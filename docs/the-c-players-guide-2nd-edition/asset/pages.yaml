  md: "# The Basics of Switch Statements\n\nIt is pretty common to have a variable\
    \ and want to do something different depending on the value of variable. For instance,\
    \ let's say we have a menu with five choices (1-5). The user types in their choice,\
    \ which we store in a variable. We want to do something different depending on\
    \ which they chose.\n\nUsing only the tools that we already know, we'd probably\
    \ think about a sophisticated if-else statement. Or an if-else/if-else/if-else/if-else/if-else\
    \ statement. Something like this:\n\n```\nint menuChoice = 3;\n\nif (menuChoice\
    \ == 1)\n{\n    Console.WriteLine(\"You chose option #1.\");\n}\nelelse if (menuChoice\
    \ == 2)\n{\n    Console.WriteLine(\"You chose option #2. I like that one too!\"\
    );\n}\nelelse if (menuChoice == 3)\n{\n    Console.WriteLine(\"I can't believe\
    \ you chose option #3.\");\n}\nelelse if (menuChoice == 4)\n{\n    Console.WriteLine(\"\
    You can do better than 4....\");\n}\nelelse if (menuChoice == 5)\n{\n    Console.WriteLine(\"\
    S? Really? That's what you went with?\");\n}\nelelse\n{\n    Console.WriteLine(\"\
    Hey! That wasn't even an option!\");\n}\n```\n\nThat gets the job done, but this\
    \ could also be done with a switch statement.\nTo make a switch statement, we'll\
    \ use the switch keyword, and a case keyword for each of the various \"cases\"\
    \ or options that we have. We'll also use the break and default keywords, but\
    \ we'll talk about those in a second. The if statement we had above would look\
    \ like this as a switch statement:\n\n```\nint menuChoice = 3;\n\nswitch (menuChoice)\n\
    {\n    case 1:\n        Console.WriteLine(\"You chose option #1\");\n        break;\n\
    \    case 2:\n        Console.WriteLine(\"You chose option #2. I like that one\
    \ too!\");\n        break;\n    case 3:\n        Console.WriteLine(\"I can't believe\
    \ you chose option #3.\");\n        break;\n    case 4:\n```"
