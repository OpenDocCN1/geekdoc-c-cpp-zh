    points, for a turn score of 15. Alice chooses to hold, and her current score is
    added to her overall score. Alice now has 15 points overall, and it is now Wally''s
    turn (player #2). Wally rolls a 2 and a 3, giving him a turn score of 5. Wally
    rolls a 5, leaving him with 0 overall, and it becomes Alice''s turn again.


