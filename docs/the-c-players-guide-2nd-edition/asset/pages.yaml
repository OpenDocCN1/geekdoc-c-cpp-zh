    of compiler errors and warnings. Any hidden window can be opened by the View menu,
    or by > Other Windows menu. (Chapter 41.)


    # Declaration


    The process of creating something, specifying the important information about
    it. This is typically used to refer declaration, but it is also applied to methods
    and type definitions. (Chapter 5.)


    # EXE


    A specific type of assembly that contains an entry point which can be started
    and run by the .NET Framework. See also assembly and DLL. (Chapter 40.)


    # Decrementing


    Substracting 1 from a value. See Incrementing. (Chapter 9.)


    # Enumeration


    A listing of the possible values one can take. In C#, enums are used to represent
    a type of data where there is a known, finite set of options to choose from (Chapter
    14.)


    # Delegate


    A way to treat methods like objects. A delegate definition identifies a return
    type and a list of parameters. A delegate is created in a way similar to declaring
    a variable, and can be assigned "values" that are the names of methods that match
    the return type and parameter list of the delegate. The delegate can then be called,
    which will execute whatever method is currently assigned to the delegate and return
    (Chapter 30.)


    # Event


    A mechanism, by which one part of the code notifies others that something has
    occurred. Events are passed up the stack until handled (“Caught”). Events are
    handlers which match a particular delegate and can be attached or removed from
    the event, allowing it to start or stop receiving notifications from the event.
    (Chapter 31.)


    # Derived Class


    In inheritance, the derived class extends or adds to another class (the base class).
    All members of the base class, instance variables, methods, and events included.
    New members may also be added in a derived class. In the case of multiple levels
    of inheritance (not to be confused with multiple inheritance) a class may act
    as both base and subclass. A derived class is sometimes called subclass. See also
