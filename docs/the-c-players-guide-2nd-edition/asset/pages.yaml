  md: "# Indexers\n\n# In a Nutshell\n\n+   - An indexer is a way to overload the\
    \ indexing operator ([ and ).\n- Defining an indexer works like a cross between\
    \ operator overloading and a property: **public double this[int index] get { /*\
    \ get code here */ } set { /* set code here */ }**\n- Indexers can use any type\
    \ as a parameter.\n- You can have multiple indices by simply listing multiple\
    \ things where you define the indexer: **double this[string someTextIndex, int\
    \ numericIndex]**\n\nIn the previous chapter, we talked about how to overload\
    \ operators. In this chapter, we will talk about indexers, which is essentially\
    \ a way to overload the indexing operator ([ and ]). Like operator overloading,\
    \ because you **can** do indexing doesn't mean it is always the right solution.\n\
    \n# How to Make an Indexer\n\nDefining an indexer is almost like a cross between\
    \ overloading an operator and a property. It is pretty easy to do, so we'll just\
    \ start with some code that does. This code could be added as a member of the\
    \ **Vector** class that we made in the last chapter, though this same setup works\
    \ in any class as well.\n\n```\npublic double this[int index]\n{\nget\n    if(index\
    \ == 0) { return X; }\n    else if(index == 1) { return Y; }\n    else { throw\
    \ new IndexOutOfRangeException(); }\n}\nset\n{}\n```"
