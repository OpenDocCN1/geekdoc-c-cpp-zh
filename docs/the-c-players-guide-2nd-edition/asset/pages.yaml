    node in the Solution Explorer and choose Add Reference, then click on the Projects
    tab and select the project to add a reference to.

    - To add a component that is on the .NET Framework, right-click and choose Add
    Reference, and click on the Assemblies tab and find the assembly that you are
    interested in.

    - To add a reference to a project that has already been compiled into a DLL, use
    Add Reference, click on the Browse tab, and hit the Browse button to find it.


