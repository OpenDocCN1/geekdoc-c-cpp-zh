    \ your code to see how things change.\n\nOnce you get through any compiler errors\
    \ we have discussed in the previous chapter, you can run your program. Even though\
    \ we've gotten rid of all of the compiler errors, sometimes things go horribly\
    \ while your program is running. This could be a crash, or just that your program\
    \ isn't doing what you thought it would. These are runtime errors, and we'll talk\
    \ about how to deal with them.\n\n Studio gives us the ability to debug into program\
    \ while it is running to see what's going on, so we can fix it. This feature is\
    \ called debugging.\n\nDebugging is extremely powerful and useful when things\
    \ are going wrong. Your program is unique, so no one else can tell you what you're\
    \ going wrong, but I can show you how to use the debugging tools so that you can\
    \ find the problems yourself.\n\n# Launching Your Program in Debug Mode\n\nThe\
    \ first step is to make sure you start your program in debug mode. When the program\
    \ is compiled and ran in debug mode (as opposed to \"release\" mode) it includes\
    \ a whole lot of extra information in the EXE file. This extra information allows\
    \ Visual Studio keep track of what is currently being executed. This extra information\
    \ slows down your program and makes the EXE file significantly"
