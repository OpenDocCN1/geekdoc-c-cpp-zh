  md: "# The Motivation for Properties\n\nImagine you are creating a simple class\
    \ to represent a player in a video game, which looks like this so far:\n\n```\n\
    using System;\nusing System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\n\
    using System.Threading.Tasks;\n\nnamespace Properties\n{\n    class Player\n \
    \   {\n        private int score;\n    }\n}\n```\n\nLet's say you want to be able\
    \ to have something outside of the class be able to get and set the value of the\
    \ player's score.\n\nThe \"classic\" way (which we learned last chapter) is to\
    \ create a method that returns the value of score and another one that sets the\
    \ value of score, possibly with some extra logic to make sure that the int is\
    \ valid (like non-negative). This would be done like this:\n\n```\npublic int\
    \ GetScore()\n{\n    return score;\n}\n\npublic void SetScore(int score)\n{\n\
    \    this.score = score;\n    if(this.score < 0)\n        this.score = 0;\n}\n\
    ```\n\nThe need for getter and setter methods is extremely common. However, working\
    \ with this is a little cumbersome. You always need to set player.SetScore(10)\
    \ and it is kind of cluttered and less readable.\n\nIt is tempting to make our\
    \ score instance variable public instead of private. Then you could simply player.score\
    \ = 10. That would be very convenient, except for one problem: now the instance\
    \ variable is public, and anyone can mess it up by putting bad data in. That is\
    \ one of the things that the Set method takes care of.\n\nC# has a feature that\
    \ solves all of these issues, creating a clean way to get or set the value of\
    \ an instance without publicly exposing it. This feature is called a property.\n\
    \n# Creating Properties\n\nA property is simply an easy way to get and set methods,\
    \ while still maintaining a high level of readability. Instead of the two methods\
    \ we showed in that last example, we could do this instead:"
