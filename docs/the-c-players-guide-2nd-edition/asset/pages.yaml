    source for figuring out your error means. Check it out: http://msdn.microsoft.com/en-us/library


    # Use Other Programmers for Help


    Programmers are usually willing to help each other when they run into problems.
    Programmers, nature, like finding problems and fixing things. They''re usually
    willing and interested in helping beginners (or pros) to learn, grow, and solve
    the problems they''re running into.


    I can''t help but recommend stackoverflow.com as one of the best sites for overcoming
    software development problems. It''s extremely well put together


    If all else fails, there''s always the good old-fashioned Google search. Whatever
    problem you''re running into, someone out there has probably come across a similar
    problem before, and they''ve probably posted about it on the Internet. (Another
    thing programmers love doing.)'
