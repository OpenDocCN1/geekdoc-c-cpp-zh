    like this, the method is only ever once. It seems overkill to go all of the trouble
    of creating a whole method to do this, especially since it starts to clutter the
    namespace. We can no longer use the name Seven for anything else within the class.
    That may not be a problem, but it might.


    Second, and perhaps more important, that method is located somewhere else in the
    source code. It may be elsewhere in the file, or even in a completely different
    file. This separation makes a bit harder to truly understand what''s going on
    when you look at the source code. Our current case, this is mostly solved by calling
    the method intelligent Seven but you don''t always get lucky.


    This issue is common enough back in C# 2.0, which added a feature called anonymous
    methods to deal with it. Anonymous methods allow you to define a method "inline,”
    without a name.


    I''m not going into a whole lot of detail about anonymous lines, because lambda
    expressions properly replaced them.


    To accomplish what we were trying to do with an anonymous method, instead of creating
    a whole method named Seven, we did the following:


    ```

    numbers.Where(delegate(int number) { return (number % 2 == 0); });

    ```


    This solves two problems. We no longer have a named method floating filling up
    your namespace, and the code that does is now at the same place as the code that
    needs it.


    I know, I. You''re probably saying, "But that is not very readable! Everything''s
    smashed together!" And you''re right. Anonymous methods solved some problems,
    while introducing others. You would have to decide which of problems works best
    for you, depending on your specific case.


    But this finally brings us to lambda expressions.


    # Lambda Expressions


    Basically, a lambda expression is simply a method. More specifically, it is an
    anonymous method that is written in a different format that (theoretically) makes
    it a lot more readable. Lambda expressions are new in C# 3.0.


    > In Depth

    The Name "Lambda." The name "lambda" comes from lambda calculus, which is the
    mathematical basis for programming languages people used before there were computers
    at all. (Which is kind of strange to think about.)n"Lambda" would really be spelled
    with the Greek letter lambda (λ) but the keyboard doesn''t it, so we just use
    "lambda.".'
