  md: '# Chapter 48 Glossary


    # Curly Braces


    The symbols { } used to mark blocks of code. (Chapter 3.)


    # Enum


    See Enumeration.


    # Debug


    The process of working through your code to find and fix problems with the code.
    (Chapter 44.)


    # Error List


