    \ Everything we've covered until now will go a very long way. This chapter will\
    \ help tie together some of the loose ends.\n\n# # Iterators and the Yield Keyword\n\
    \nWay back in Chapter 13, we first introduced foreach loops. In Chapter 24 we\
    \ introduced the IEnumerable<T> interface, and stated that anything implements\
    \ IEnumerable<T> (or the non-generic variant IEnumerable) can be used in a foreach\
    \ loop. Remember, an IEnumerable is simply anything where you can examine multiple\
    \ values in a collection or collection, one at a time. This capability types that\
    \ implement this interface iterators.\n\nIn addition to a straight up IEnumerable\
    \ implementation, you can additionally define an iterator using the yield keyword.\
    \ This would look like this:\n\n```\nclass IteratorExample {\n    public IEnumerable<int>\
    \ GetEnumerator()\n    {\n        for (int index = 0; index < 10; index++)\n \
    \           yield return index;\n    }\n\n    IEnumerable GetEnumerator()\n  \
    \  {\n        return GetEnumerator();\n    }\n}\n```\n\nMuch of this code should\
    \ make sense by now. We're simply implementing the IEnumerable<int> interface,\
    \ which requires us to use the GetEnumerator method that you see. And since the\
    \ IEnumerable<T> interface is derived from the non-generic IEnumerable interface,\
    \ we also need to define that second method, which simply calls the first method.\n\
    \nThe part that will likely seem strange to you is the yield return. As we're\
    \ iterating, the method will be called multiple times, and each time, it will\
    \ return the next item that is \"yielded.\" Unlike a normal return statement,\
    \ when we use yield return, we're saying, \"pause what you're doing here and return\
    \ this value, but when you come back, start up again here.\" That is very powerful.\
    \ For example:\n\n```\npublic IEnumerable<int> GetEnumerator() {\n    yield return\
    \ 0;\n    yield return 1;\n    yield return 4;\n    yield return 6;\n}\n```\n\n\
    Interestingly, the compiler isn't simply turning all yielded values into a list.\
    \ It is happening one at a time. This means you could theoretically create an\
    \ iterator that never:\n\n```\npublic IEnumerable<int> GetEnumerator() {\n   \
    \ int number = 0;\n    {\n        yield return number;\n        number++;\n  \
    \  }\n```"
