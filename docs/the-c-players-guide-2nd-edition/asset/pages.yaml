    The second part of declaring a variable is giving it a name. It is important to
    remember that a variable''s name is really for humans only. The computer does
    not care what it is called. (In fact, once you hand it off to the computer, it
    changes the name to a memory location anywhere.) So you want to choose a name
    that makes sense to humans, and accurately describes what you''re putting in it.
    with we can call variables by a single letter (like x), but in programming we
