  md: '# Error Handling and Exceptions


    # In a Nutshell


    +   * Exceptions are C#''s built-in error handling mechanism.

    * Exceptions package up information about a problem in an object, and are "thrown"
    from the method that discovered the problem back up the call stack until it finds
    a place that can catch/handle the error, or until it reaches the top of the call
    stack and kills your program.

    * If you know running code that could potentially cause a problem, you wrap it
    in a **try-catch block**, putting the type of exception in the parentheses of
    the **catch block**: `try /* exception here * */ catch(Exception e) { /* handle
    problem here * */`

    * You can catch **Exception** or any type derived from Exception (e.g., FormatException).
    Catching a more specific type will only catch that type of error, leaving other
    types to catch blocks.

    * You can string together multiple catch blocks, going from most to specific types
    of **exceptions**: `try { catch(FormatException e) { /* handle all errors here
    */ }`

    * You can create your own types of exceptions by deriving from the **Exception**
    class.

    * If your code discovers a problem, you can start an exception with the **throw**
    keyword: `throw new Exception("An error has occurred.");`

    * Exception allow you to catch an exception only if certain conditions are met,
    letting others go to another catch clause: `catch(Exception e) if(e.Message ==
    "Message")`


    We spent the entirety of this book so far pretending that everything in our program
    went according to plan. But the reality is, that''s not just what happens. Sometimes
    a method is running, trying to do its job, when it discovers that something has
    gone terribly wrong.'
