    # Breakpoints


    Now you''re all about debugging code after your program runs into a problem. But
    you''ll of course be able to occasionally analyze running code before there''s
    a crash.


    Whenever you want, you can set a breakpoint on a particular line of code in Visual
    Studio. A breakpoint is a mark to tell line of code so when the program reaches
    that line during execution, the program will halt, allowing you to take a look
    at the program''s current state.


    To set a breakpoint, you locate the line you want to set the breakpoint at, and
    on the left side, click in the gray area, marked in the image on the left below:


    ![](img/ad92120e75cb88980f77f3297768b8f0_329_0.png)


    When you do this, a red circle will appear in the left margin of the line you
    have selected, and the text on that line will also be marked in red. This looks
    like the image on the right side.'
