  md: "# Throwing Exceptions 195\n\nDoing this makes it so you can handle different\
    \ types of exceptions in yours. Just need to be sure to put the derived type—before\
    \ the more general, base type. If your first block is the `catch(Exception e)`\
    \ block, you will catch everything, and nothing would ever get into the `FormatException`\
    \ or `Exception blocks. So ordering is important.\n\nIt's also worth pointing\
    \ out that you don't need to catch all exceptions that might come up. You can\
    \ build your catch blocks in a way that are handled while others are able to propagate\
    \ further up the call stack, possibly to a catch block in another method, or possibly\
    \ to the point where it kills the program. You're not required to catch all exceptions\
    \ if you don't want to.\n\n# Throwing Exceptions\n\nIt's time to look at the other\
    \ side of this equation: creating and throwing exceptions yourself! Don't get\
    \ carried away with throwing exceptions. If the method that discovers a problem\
    \ knows the solution to the problem, don't bother throwing. Just handle the problem\
    \ and continue on. To generalize that, the closer you handle an error to the place\
    \ it was detected the better.\n\nTo throw an exception, simply use the throw keyword:\n\
    \n```\npublic void catchTrou() // Always up to no...\n    throw new Exception(\"\
    Just doing my job!\");\n\n```\n\nIt feels like the return statement, but it throws\
    \ exceptions instead of returning a value. You create the Exception object, just\
    \ like any other object, with the new keyword, and it goes away.\n\nYou're not\
    \ limited to using the Exception class. (It's preferable not to.) there are other\
    \ options already defined. For instance, here's a list of some common exceptions\
    \ and what they're for:\n\n+   * NotImplementedException: If a method has been\
    \ defined but not implemented, you can use this. When Visual Studio automatically\
    \ generates something, it puts this in the body.\n* IndexOutOfRangeException:\
    \ You tried to access an array or something at an index that is beyond how the\
    \ array is.\n* InvalidCastException: You tried to cast to another type, but the\
    \ type you tried to wasn't the right kind of.\n* FormatException: The text you\
    \ had is not in the right format for converting to something else (like letters\
    \ in a string that is supposed to be turned into a number).\n* UnsupportedException:\
    \ You tried to do an operation that wasn't supported. For instance, make a method\
    \ call at a time that it didn't allow it.\n* NullReferenceException: A reference\
    \ type contained null all the time you were out of space or the stack from calling\
    \ too many methods. This is usually a recursion of that went bad.\n* DivideByZeroException:\
    \ You tried to divide by zero and got caught.\n* ArgumentNullException: One of\
    \ the arguments or parameters that you gave to a method was null, but the method\
    \ requires something besides't null.\n* ArgumentOutOfRangeException: An argument\
    \ contained a value that the method couldn't intelligently deal with (e.g., it\
    \ required a number between 1 and 10, but you got it 13).\n\nAnd of course, if\
    \ you can't find an existing exception type that fits, you can create your own.\
    \ All you need to do is create a class that is derived from the Exception class\
    \ or from another exception class."
