  md: '# 15 Methods


    # In a Nutshell


    +   - Methods are a way of taking a chunk of code that does a specific task and
    put it together in a way that it is reusable.

    - You can return stuff from a method by putting the return type in the method
    definition, and then using the **return** keyword inside the method anywhere where
    you want to return a value.

    - You can pass parameters to a method by listing them inside of the parentheses
    after the method''s name.

    - You can make multiple methods with the same name (called method overloading)
    as long as their method signatures are different.

    - Recursion is where you call a method from inside itself, and requires a base
    case to prevent the flow of execution from digging deeper and deeper into more
    calls.


    Think about a program like **Microsoft Word 2013** or a game like the latest *Assassin''s
    Creed*. Think about how code goes into creating something! They''re enormous!
    Especially when compared to the little tiny programs we''ve been working on so
    far.


    How do you think you could manage all of that code? Where would you look if there
    was a bug?


    As programmers, we''ve learned that when you have a large program, the best way
    to manage it is by breaking it down into smaller, more manageable pieces. This
    basic concept of breaking things into smaller pieces is called *divide and conquer*,
    and it is one we''ll see over and over again.


    C# provides us with a feature that allows us to break down our program into small
    manageable pieces. These small, reusable building blocks of code are called *methods*.
    Methods are sometimes called *functions, subroutines, or procedures* in other
    programming languages.'
