    \ It is the do-while loop. Remember I said, that a while loop will first check\
    \ the condition to see if it is met, and if not, it could potentially skip the\
    \ loop entirely; (Might add that this isn't a bad thing; it's just something to\
    \ remember. Most of the time, that's exactly how you want.)\n\nIn contrast, the\
