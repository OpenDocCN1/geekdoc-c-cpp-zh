    creating a new instance of a class, the constructor is called. If not, the C#
    compiler will automatically generate a default constructor. (Chapters 17 and 18).


    # Command Line Arguments


    When a program is started, arguments may be passed on the command line of the
    program''s main method where it can use them. These are command line arguments.
    (Chapter 39)


    # Comment


    Additional text placed within source code that is designed to be read by humans
    who are working with the code. The C# compiler ignores these entirely. (Chapter
    4)


    # Critical Section


    A block of code that should not be accessed by more than one thread at once. Critical
    sections are usually blocked off with a mutex to prevent simultaneous threatened
    access. (Chapter 37).


    # Common Intermediate Language


    A special high-level, object-oriented form of assembly code that the CLR is able
    to execute. It includes instructions for things like type conversion, exceptions,
    and method calls. (Chapter 40).


    # Common Language Runtime


    A virtual machine that any .NET language including C# is built to run on. The
    Common Language Runtime, often'
