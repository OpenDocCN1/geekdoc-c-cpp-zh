  md: 'can''t really write an operating system in C#, nor can you make device drivers
    with it. The CLR couldn''t have been written in C# either. These things are just
    too low for. If this is what you''re trying to, you''ll need something that doesn''t
    use a virtual machine. C++ is by far the most popular choice for things like this.(Though
    I''ll be honest with you, after writing in C# for so long, it makes me a little
    queer to work with C++. It''s just not nearly as pretty, or fun.)


    On the other hand, if you''re doing anything else—web development, application
    development, etc.—using C# and the CLR is an excellent choice.


    # Your Code is More Visible


    Sometimes, people are concerned that C# and the .NET Framework, your code will
    be accessible by others. To be clear, this is true to some extent. No one will
    have access to your C# source code, but they will have your EXE file, containing
    IL code. IL is essentially a high-level version of assembly, so this is more information
    than raw bits and bytes of binary instructions, but by no means is it easy to
    see figure out what''s going on.


    If you''re concerned about this, you can always apply a code obfuscator to your
    IL before making it available to the world. A code obfuscator will gore and rename
    variables, methods, classes, and the like, making it even tougher for someone
    to reverse engineer your software.


    On the other hand, (a) most people won''t care, (b) most people won''t even know
    where to begin, and (c) the ones who do care and have the know-how won''t be stopped
    by using a strictly compiled language like C or C++.


    If you''re writing code to launch missiles or something else where it is absolutely
    critical that no one discovers how your code works, don''t use C# or any .NET
    language.(Though note that in those cases, there''s far more to consider than
    just using a .NET language.)


    # The BCL and FCL Class Libraries


    In addition to the BCL, the .NET Framework also includes a large collection of
    previously built code and types. This collection is absolutely massive, and contains
    more than the "standard library" of most languages, including C+. The standard
    library in Java are similar in size. This large collection is called the Base
    Class Library, or BCL.


    The BCL contains all the built-in types, arrays, exceptions, math libraries, basic
    I/O, collections, reflection, string manipulation, and more. While not a perfect
    guide, a general rule is that anything that starts with System is a part of the
    BCL.


    Beyond the BCL, there are many more classes that Microsoft has with the .NET Framework.
    In general, these additional classes cover broad functional areas, such as database
    access or graphical user interfaces (Windows Forms or WPF). This entire collection,
    including the BCL, is called the Framework Class Library, or FCL. In casual discussion,
    sometimes people use FCL and BCL interchangeably, which isn''t strictly correct,
    but it is perhaps good enough for most things.


    In this book, we looked at some of the most common parts of the BCL, but no book
    can cover all of it. If you are about to do something that you think others have
    done before, it''s worth a quick web to see if something in the BCL or FCL already
    does it, because there probably is.'
