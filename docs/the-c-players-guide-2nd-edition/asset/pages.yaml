    The & operator can be used to check if a particular flag set, using some simple
    trickery:


    ```

    bool isSuspended = (privileges & ForumPrivileges.Suspended) == ForumPrivileges.Suspended;

    ```


    The trick that is going on here that if we do a bitwise and with something that
    only has one bit set to true, it will all become 0, which indicates the field
    was not set, or if the field was set, we''ll get back the value of the field we
    were checking for, for all other fields to 0.


    Using a combination of the & and ~ operators, we can turn off a particular field:


    ```

    privileges &= ~ForumPrivileges.Suspended;

    ```


    You can also toggle a field using the ^ operator:


    ```

    privileges ^= ForumPrivileges.DeletePosts;

    ```


    # # Reflection


    C# has the ability to inspect elements of executable code, and explore what types
    are in an assembly. You can see the methods, properties, and variables it contains,
    even while your program is running. The ability to have code analyze the structure
    of other code is called reflection.


    The biggest use for reflection is when you want to look at an unknown object or
    assembly. Not every program has a use for this. Most wont. Doing this is always
    slower than directly accessing the code.


    The core class used in reflection is the Type class. The Type class represents
    a compiled on the .NET Framework, including classes, structs, or enumerations.


    For any given type, you can use the typeof keyword to get the Type object that
    represents it:'
