  md: '# Value and Reference Types


    In a Nutshell


    +   - Your program''s memory is divided into several sections including the stack
    and the heap.

    - The stack is used to keep track of your program''s state and local variables.

    - The heap is used to store data that is accessible anytime from anywhere.

    - The CLR manages memory in the heap for you, and cleans up unused garbage collection.

    - Value types store their data directly inside the variable. Reference types store
    a reference to a location in the heap, where the rest of the data is stored.

    - Value types have value semantics, which means that when you assign one variable
    the contents of another, the entire contents of the variable are copied, so you
    get a complete copy in the other variable. Reference types have reference semantics,
    which means when you assign one variable to another, only the reference is copied,
    and the two are referencing the same object. Changes to one affects the others.


    We''re going to change gears and spend a chapter in pure learning mode, instead
    of coding mode. We''re going to discuss a few topics that are going to be important
    for understanding types and how classes work. This chapter is probably the most
    technical chapter in the book, but trust me when I say it is both important and
    useful.


    # The Stack and the Heap


    When your program first starts, the operating system gives it a pile of memory
    for it to work with. Your program splits up into several areas that it uses for
    different things, but most of it is used by two sections for storing data as your
    program runs. These two sections are the stack and the'
  merge: -1
  pgno: 124
- img_proc: true
  md: '# Memory Management and Garbage Collection


    heap. The stack and the heap are used for slightly different things, and they''re
    organized in different ways.


    The stack is used to keep track of the current state of the program, including
    all of the local variables that you have. The stack behaves like a stack of containers.
    Whenever we enter a method, we place a new container on the top of the stack.
    These containers on the stack are called frames. All of the local variables (including
    parameters) for a particular method will in a single frame.


    ![](img/ad92120e75cb88980f77f3297768b8f0_125_0.png)


    Additionally, a frame will include information to keep track of the program''s
    current state of execution, like what line of code the program was at before entering
    the new method. In fact, one of the primary purposes of the stack is to keep track
    of the program''s current state of execution.


    Like a stack of containers, you can readily access the contents of the frame on
    the top of the stack, but you can''t really get to the containers lower down.
    When we return from a method, the top frame is taken off and discarded, and we
    go back to the frame beneath it.


    Interestingly, the debugger that is built into Visual Studio can inspect the entire
    stack, including the buried frames, and show them to you.(This is called a stack
    trace.)


    The heap, on the other hand, is not concerned at all keeping track of the program''s
    state. Instead, it is only focused on storing data. The heap is organized in a
    way where it is easy to get access to any time you need. It''s easy for the program
    to grab space in the heap and start using it to store the information it needs.
    There''s not necessarily any logical organization to what gets stored where on
    the heap, so it is easy to think of it as just a pile of individual blocks of
    data.


    ![](img/ad92120e75cb88980f77f3297768b8f0_125_1.png)


    If you have a multi-threaded application (Chapter 37) each thread will have its
    own stack, but all threads in the program will share the heap.


    # Memory Management and Garbage Collection


    A program needs to manage the memory it is using. In particular, to clean up old
    memory that is no longer being used. For the stack, this is easy. Any time it
    returns from a method, it knows it can throw the top frame away and reuse that
    space immediately.'
  merge: -1
