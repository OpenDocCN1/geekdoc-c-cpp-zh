  md: '# The Built-In Types are Aliases


    You''ll also see that instead of short, int, and long, the structs use int followed
    by the number of bits they use. This is far more explicit than the keyword versions.
    There''s no confusing how big each type is.


    And last, you''ll notice that the float type is Single, instead of Float. The
    word "float" is not very accurate, since both double and float are both technically
    floating point types. The term "single" is perhaps more correct, simply because
