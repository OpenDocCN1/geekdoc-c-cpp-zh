    language C, hence the name C++, C++, and Java all have the increment operator
    too.


    One thing worth mentioning with the increment and decrement operators is that
    you can

    write it in two ways. You can write `a++;` or you can also write `++a;`. (Likewise,
    you can write

    a--; --a;). With the ++ at the end, it is called *postfix notation*, and with
    it sidesteps, it is called

    *prefix notation*.


    There''s a subtle difference between prefix and postfix notation. To understand
    the difference, it is

    important to realize that this operation, like others, "returns a value." This
    is a phrase that we

    frequently seen later on, but it is a concept we have already been working with.
    Take the addition

