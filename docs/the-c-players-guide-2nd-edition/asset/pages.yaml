  md: '# Conway''s Game of Life 321


    In the next generation (round) the top cell that is alive will die, because it
    has only one neighbor. The one in the middle will stay alive, because it has two
    neighbors. The one on the bottom will also die, because it has only one neighbor.
    Additionally, just off the left and right of the three "alive" cells, there is
    a cell with three neighbors, both of which will become alive. After one generation,
    this will turn into the following:


    ![](img/ad92120e75cb88980f77f3297768b8f0_343_0.png)


    Interestingly, if you look at this and follow it through to the next generation,
    you''ll end up back where you were initially. This happens to create what is called
    an oscillator in the Game of Life. It will keep repeating forever.


    These rules for determining when cells in the grid come to life or die create
    very interesting results that are much more interesting to see than to read in
    a book.


    Because of this, we''re going to take upon ourselves the challenge of creating
    the Game of Life as a computer program.


    There are several key parts to this. For one, we will need to store the current
    grid. There are lots of ways to do this, but one might be a two dimensional array
    of **bools**. It would look like a fancy GUI, but we can get away without needing
    to go beyond the console. If you''re sticking with the console, your best bet
    is to use 40 columns in the grid, and each cell take up two characters ("X" or
    " ") depending on if it is alive or dead, plus an empty space) because the console,
    characters are twice as tall as they are, and there are 80 columns by default.
    40 columns with two characters per column gives you nice, square shaped cells.
    About 12 rows fit on the console window by default, you can go up to 20 rows pretty
    easily and then drag the console window to resize and make it taller.


    Additionally, you will need to create a mechanism to update the grid using the
    rules described earlier for cell death and generation. It is important to work
    with a copy for the next generation or updating one will miss the calculation
    in another cell.


    Finally, you''ll need to put it all together in a loop that repeats, updating
    the grid, drawing the grid, and waiting for a while in between, to animate the
    game and let you see what''s happening. For this, you might find the Thread.Sleep
    method method useful. We talked about this method in Chapter 37. You will need
    to add a `using` directive to your type of code for `System.Threading` to get
    access to this, as discussed in Chapter 26. You might also find it useful to be
    able to clear the console window before you draw the new grid, using `Console.Clear();`


    ![](img/ad92120e75cb88980f77f3297768b8f0_343_1.png)'
  merge: -1
