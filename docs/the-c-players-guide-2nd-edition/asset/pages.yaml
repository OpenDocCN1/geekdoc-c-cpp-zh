  md: "# Chapter 20 Structs\n\nIt turns out that not only are they value types, but\
    \ they are also struct types. This means that everything that applies to structs\
    \ that we've been learning about also applies to these primitive types.\n\nEven\
    \ more, of the primitive types are aliases for other structs (or class, in the\
    \ case of the string type).\n\nWhile we've been working with say, the int type,\
    \ behind the scenes the C# compiler is simply changing over to a struct that is\
    \ in the same kind of type that we've seen here. In this case, it is the Int32\
    \ struct (System.Int32).\n\nSo while we've been writing code that looks like this:\n\
    \n```\nint x = 0;\n```\n\nWe could also have used:\n\n```\nInt32 x = new Int32();nInt32\
    \ y = 0;               // Or combined.\nint z = new Int32();          // Or combined\
    \ another way. It's all the same thing.\n w = new Int32();               // Yet\
    \ another...\n```\n\nThe int type and Int32 struct are identical. There is no\
    \ difference between the two. Which brings us to a slightly updated definition\
    \ of a primitive type, or built-in type: that the compiler has special knowledge\
    \ about, and allows for special, simplified syntax to use.\n\nAll of the primitive\
    \ types have aliases, shown in the table below:\n\n| Primitive Type | Alias For:\
    \ |\n|---|---|\n| bool | System.Boolean |\n| byte | System.Byte |\n| sbyte | System.SByte\
    \ |\n| char | System.Char |\n| decimal | System.Decimal |\n| double | System.Double\
    \ |\n| float | System.Single |\n| int | System.Int32 |\n| uint | System.UInt32\
    \ |\n| long | System.Int64 |\n| ulong | System.UInt64 |\n| object | System.Object\
    \ |\n| short | System.Int16 |\n| ushort | System.UInt16 |\n| string | System.String\
    \ |\n\nI want to point out a couple of things about the naming here. Nearly all\
    \ of these types have the same name, except with a capital letter. Keywords in\
    \ C# are all lowercase by convention, but nearly everybody will capitalize type\
    \ names, which explains that difference."
