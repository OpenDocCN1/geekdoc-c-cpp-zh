    # Message from Julius Caesar


    Encryption is the process of taking data and turning it into a format that is
    no longer readable. This keeps the information protected, so that people who are
    supposed to read it cannot. Of course, the person who is supposed to be able to
    decrypt and recover the message.


    When encryption is done, the algorithm used to encrypt stuff usually uses a special
    value called a key to perform the encryption. If a person has the key, they can
    usually decrypt the message as well.


    The Caesar cipher is one of the simplest encryption schemes, and it is something
    you used to send coded messages to friends when you were younger. It is an encryption
    method that supposedly Caesar occasionally used when he wrote letters.


    The basic idea is that every letter in your message, you shift the alphabet by
    a certain number of letters. The amount you shift is the key for the algorithm.
    If you are using a key of 3, A would become D, B would become E, etc. Once you
    get to the end of the alphabet, it wraps around, so Z becomes C.


    For example, with a key of 4, the message below is encrypted to look like this:


    ```

    Plain text: EXPERIENCE IS THE TEACHER OF ALL THINGS

    Encrypted: IBITVIRGI MW MX XIEGLIV SJ EPP XLMRKW

    ```


    Write a program that will read a message from a file (or the console) and encrypt
    it, writing out the encrypted message to another file (or back to the console).
    Don''t overwrite the original file. Ideally, your program will ask for the name
    of a file to read, and a key (number) to use in the encryption.


    Anything besides a letter (punctuation, numbers, etc.) can either be skipped or
    passed along to the output without encrypting it.


    If you want an extra challenge, try this. The Caesar cipher is really easy to
    crack. In fact, it is so basic it provides little protection in modern usage.
    More sophisticated algorithms are used now to encrypt. The point is that the Caesar
    cipher can be cracked, we''re going to try a "brute force" approach to crack the
    following:


    ```

    UX LNX MW WKBD RMK HOTEMGW

    ```


    With the Caesar cipher, there are only 26 keys. Try each one, one at a time, until
    the decrypted message makes sense. This simple approach is to have a human (you)
    inspect the decrypted message to see if it makes sense. While it is more work,
    it is possible to have the computer figure out if the message has been decrypted
    by using a dictionary file (containing all'
