  md: "# 274 Chapter 39 Other Features in C#\n\nWe then consider whether it is **implicit**\
    \ or **explicit**. In this case, we've chosen **implicit**. We then put down the\
    \ type that is converted to (`MagicNumber`, in this case), and then in parentheses,\
    \ what is being converted. From the inside of the body conversion, we write code\
    \ to actually convert from one to the other.\n\nNow, with this added to our `MagicNumber`\
    \ class, we can simply convert from `ints` to `MagicNumbers`:\n\n```\nint aNumber\
    \ = 3;\nMagicNumber magicNumber = aNumber;\n```\n\nWe can also create an explicit\
    \ cast in this way. Here, we'll define a conversion going in the opposite way,\
    \ from `MagicNumber` to **int**. It is typically a good idea to make any cast/conversion\
    \ explicit whenever you're losing information in the conversion process. (A “narrowing”\
    \ conversion).\n\nTo make an explicit cast, we would add something like the following\
    \ to our class:\n\n```\nstatic public operator int(MagicNumber magicNumber)\n\
    {\n  return magicNumber.Number;\n}\n```\n\nNow, in our code, we can use this conversion.\
    \ But this time, we'll have to explicitly state that we want to convert from one\
    \ to another (which is why it's called an explicit conversion):\n\n```\nMagicNumber\
    \ magicNumber = new MagicNumber() { Number = 3, IsMagic = true };\nint aNumber\
    \ = (int)magicNumber;\n```\n\nThere are some strange problems that can come up\
    \ with user-defined conversions. Because of this, you should think long and hard\
    \ before adding in a user-defined conversion.\n\nOf greatest importance is the\
    \ fact that when you create a user-defined conversion, you're going to be creating\
    \ an entirely new object. Imagine the scenario where you have two classes, and\
    \ each can be converted to the other using user-defined classes. This should raise\
    \ a flag in your mind.\n\n```\nTypeA a = new TypeA();\nTypeB b = a; // Con with\
    \ an implicit user-defined conversion\nb.DoingSomething();\n```\n\nWhen we use\
    \ this user-defined conversion, our **b** variable is holding a completely different\
    \ object than **a**. When we call the **DoingSomething** method, which may change\
    \ the data in **b**, **a** is completely unaffected, some kind of counterintuitive\
    \ effect. If we had used the following code instead, it would have been much clearer\
    \ that **a** and **b** are separate objects:\n\n```\nTypeA a = new TypeA();\n\
    TypeB b = a.TypeB();\nb.DoingSomething();\n```\n\nSo just because you can create\
    \ a user-defined conversion, doesn't mean it is always a good idea.\n\nInstead\
    \ of adding user-defined conversions, consider adding in a constructor, or a **ToJava**\
    \ or **FromWhatever** method to your type, as it will be more obvious of happening."
