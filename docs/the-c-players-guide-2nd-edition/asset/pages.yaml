  md: "# 230 Chapter 35 Lambda Expressions\n\nCreating a lambda expression is simple.\
    \ Returning to the ISEven problem from earlier, if we want to create a lambda\
    \ expression to determine if a variable is even or odd, we would write the following:\n\
    \n```\nx = x % 2 == 0\n```\n\nThe lambda expression (=>) is read as \"goes to\"\
    \ or \"arrow.\" (So, to read this line out loud, you would say \"x goes mod 2\
    \ equals 0\" or \"arrow x mod 2 equals 0\") The lambda expression is basically\
    \ taking the input value, x, and mod it with 2 to check the result against 0.\n\
    \nYou may also notice a lambda expression, we didn't use return. The code on the\
    \ right side of the => operator must be an expression, which evaluates to a single\
    \ value. That value is returned, and it's becomes the return type of the lambda\
    \ expression.\n\nThis version is the equivalent of all of the earlier code, this\
    \ is how we might use this along with everything:\n\n```\nIEnumerable<int> evens\
    \ = numbers.Where(x => x % 2 == 0);\n```\n\nIt may take a little getting used\
    \ to, but generally speaking it is much easier to understand than the other techniques\
    \ that used earlier.\n\n# Multiple and Zero Parameters\n\nLambda expressions can\
    \ have more than one parameter. in parentheses, To use more than one parameter,\
    \ you simply list them separated by commas:\n\n```\n(x, y) => x * x + y * y\n\
    ```\n\nThe parentheses are optional with one parameter, in the earlier example,\
    \ I've left them off. This example could have been written as a method like the\
    \ following:\n\n```\npublic int HypotenuseSquared(int x, int y)\n{\n    return\
    \ x * x + y * y;\n}\n```\n\nAlong the same lines, you can also have a lambda expression\
    \ that has no parameters:\n() => Console.WriteLine(\"Hello World!\")\n\n# Type\
    \ Inference and Explicit Types\n\nThe C# compiler is smart enough to look at most\
    \ lambda expressions and figure out what variable types and return type you are\
    \ working with. This is called type inference. For instance, in our first lambda\
    \ expression it was smart enough to figure out that x was an integer and the return\
    \ expression returned bool. With the expression (x, y) => x * x * y we saw that\
    \ the C# compiler was smart enough to figure out that x and y were integer values\
    \ and the resulting expression returned an int. And () => Console.WriteLine(\"\
    Hello World!\"), it was smart enough to know that there were no parameters, and\
    \ the lambda expression didn't return anything (void return type).\n\nType inference\
    \ is a pretty big deal. It's not a trivial accomplishment, and I'd imagine there\
    \ were a lot of smart people working to get it right."
