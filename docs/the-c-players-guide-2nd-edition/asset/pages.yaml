  md: '![](img/ad92120e75cb88980f77f3297768b8f0_25_0.png)


    # The C# Programming Language


    # In a Nutshell


    +   - Describes the general idea of programming, and goes into more details about
    why C# is a good language.

    - Describes the core of what the .NET Framework is.

    - Outlines how the compiler turns your C# source code into IL code, then JIT compiled
    by the CLR as the program is running.


    I''m going to start off this book with a very brief introduction to C#. If you''re
    already a programmer, and you''ve read the Wikipedia pages on C# and the .NET
    Framework, skip ahead to the next chapter.


    On the other hand, if you''re new to programming in general, or if you''re still
    a little vague on what exactly C# or the .NET Framework is, then this is the place
    for you.


    I should point out that we''ll get into a lot of detail about how the .NET Framework
    functions, and what it gives you as a programmer in Chapter 40. This chapter just
    provides a quick overview of the basics.


    # What Exactly is C#?


    Computers only understand binary: 1''s and 0''s. All of the information they keep
    track of is ultimately nothing more than a glorified pile of bits. All of the
    things they do boil down to instructions, written with 1''s and 0''s.'
  merge: -1
