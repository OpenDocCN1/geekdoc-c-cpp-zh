  md: "# 128 Chapter 18 Making Your Own Classes\n\nHere you have an instance of the\
    \ Book class, and you can call the method by using the dot operator on the actual\
    \ instance or object.\n\nA marked with the static keyword is accessed by using\
    \ the class name instead. You don't need to have an instance of the class to use\
    \ the static methods. We saw this with the Console class:\n\n```\nConsole.WriteLine(\"\
    Hello World!\");\n```\n\nWriteLine is a static method, so we don't need to create\
    \ a Console object (instance of the Console class) in order to use the WriteLine\
    \ method.\n\nAll of the methods we've made up now will be static. But we're now\
    \ ready to drop the static and apply methods directly to the class. While there's\
    \ still value to static methods, most of the methods we write from here on will\
    \ not be static.\n\n# Static Classes\n\nWhile you probably won't find uses for\
    \ this right away, since we're already talking about static, I should point out\
    \ that you can also use the static keyword on a class. If you do this, this means\
    \ that the class cannot have instance variables or methods. They must be static,\
    \ and the C# compiler will check for you. The Console class is one example of\
    \ this—it is impossible to create an instance of the Console class, but there's\
    \ no need to do so, because all of its methods are static. Static is great for\
    \ classes that are used simply to group together a collection of utility methods.\n\
    \n# Static Constructors\n\nIt will be a while before you'll need static constructors,\
    \ but while we're on the static topic, I should also tell you that you can use\
    \ the static keyword to constructors. Or to a single constructor. A static constructor\
    \ allows you to set up any static class variables that you may have, so that they're\
    \ ready to go anyone wants to use them.\n\nAs soon as a first attempt to use your\
    \ class, the CLR will stop for a second and check for any static constructors\
    \ that it may have. If one exists, it will run. Because of this, you can be sure\
    \ that before your class is used in any fashion, this code has already executed.\
    \ A simple example of a\n\n```\npublic class Something\n{\n    public static int\
    \ sharedNumber;\n\n    static Something()\n    {\n        sharedNumber = 3;\n\
    \    }\n}\n```\n\nOf course, this is probably overkill in this specific situation,\
    \ because if all you need to do simple assignments, you could do this instead,\
    \ which performs the same work in less space:\n\n```\npublic class Something\n\
    {\n    public static int sharedNumber = 3;\n}\n```\n\nHaving said that, there\
    \ will still be times when your class-level setup is much more involved, and you'll\
    \ still want to use a static constructor."
