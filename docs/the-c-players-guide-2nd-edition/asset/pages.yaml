    # Where Do I Go to Get Help?


    The best part of making software is that you''re creating something that has never
    been done before. It is as much a creative process as it is mathematical or analytical.
    You''re not just manufacturing the same thing over and again. You''re going to
    run into problems that have never encountered before. You''re bound to run into
    trouble sooner or later, and before we part, I want to point out to you a few
    things you can do to solve your problems when they come up.


    First, obviously, a Google search will go a very long way. That''s always a great
    place to start.


    Second, make sure you fully understand the code you''re working with. If you''re
    having trouble with a particular class that someone else created (like the List
    class, for instance) and a method isn''t doing what you thought it should, take
    the time to make sure you understand every piece you''re working with. I''ve learned
    over the years, that if you''re running into a problem with code you don''t understand,
    you''re not likely to figure the whole problem out until you''ve figured out how
    to use all of the individual pieces that are in play. Learn what each of its properties
    does. Figure out it. Once you truly understand the things you''re working on,
    the problem solves itself.


    Along those lines, the Microsoft Developer Network (MSDN) has details about about
    every type that the .NET Framework has, with plenty of examples of how to use
    it. It''s a great resource if you''re trying to learn how a specific type works.
    (msdn.microsoft.com/library/)


    I probably don''t need to say this, but if you''re stuck, and you''ve got team
    members who might know the answer, it''s always a good idea to talk to them.


    If you don''t have members who can answer your question, Stack Overflow is one
    of the best sites out there for programming Q&A.(stackoverflow.com/) Stack Overflow
    covers everything from the basics up to very specific, very detailed questions,
    and you''re likely to get good, intelligent responses from people. Just be sure
    to do a Google search to make sure the answer isn''t obvious, and search on the
    site as well, to make the question hasn''t already been asked. (Because it probably
    has.)


    # Parting Words


    You''ve learned the basics of C#, and ready to take the world by storm. There''s
    so much that you can do with your new knowledge of C#. It truly is an exciting
    time!


    From one programmer to another, I want to wish you the best of luck with the amazing
    software that you will create!'
