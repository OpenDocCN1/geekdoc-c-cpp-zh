  md: '# Introduction


    into Depth sections. These are never required reading, so if you''re busy, skip
    ahead. If you''re not too busy, I think you''ll find this additional information
    interesting, and worth taking the time to read.


    # Glossary


    As you go through this book, you''re going to learn a ton of new words and phrases.
    Especially if you''re completely new to programming in general. At the back of
    this book is a glossary that contains the definitions for these words. You can
    use this as a reference in case you forget a word means, or as you run into new
    concepts as you learn #


    # Getting the Most from This Book


    # For Programmers


    If you are a programmer, particularly one who already knows a programming language
    that is related to # (C, C++, Java, Visual Basic .NET, etc.) learning # is going
    to be relatively easy for you.


    C has a lot in common with all of these languages. In fact, it''s fair to say
    that all programming languages affect and are inspired by other languages, because
    they evolve over time. C looks and feels like a combination of Java and C++, both
    of which have roots that go back to the C programming language. Visual Basic .NET
    on the other hand, feels quite different from C (it''s based on Visual, and Basic
    before) but because both C and VB.NET are designed and built for the .NET Framework,
    they have many of the same features, and there''s almost a one-to-one correspondence
    between features and keywords.


    Because C is closely tied to those other languages, and knowing that many people
    may already know something about those other languages, you''ll see out how #
    C compares to those other languages from time to time.


    If you already know a lot about programming, you''re going to be able to move
    quickly through this book, especially the beginning, where you may find few differences
    from languages you know. To speed along the process, read it in A Nutshell at
