    all of code you will need to build a particular class (or another custom-made
    type). In fact, all of the code we''ve written so far has been inside of a Program
    class! (Starting in the next chapter, we''re going to be building our own classes,
    and putting code elsewhere.)


    The fact that classes and objects are modeled after world objects means you can
    build code that would intuitively make sense to anyone to use it, and that''s
    worth a lot.


    Classes provide us with reusable pieces of code. For example, the Random class
    was made by other people ago, and we were able to reuse it.


    Classes provide a way to break a complex program into small pieces that are easily
