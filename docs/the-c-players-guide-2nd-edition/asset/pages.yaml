  md: '# Handling Common Compiler Errors


    In a Nutshell


    +   * Outlines common compiler errors, what causes them, and how to fix them.

    * Compiler errors are shown in the Error List window.

    * If you don''t know what a compiler error means, take the time to understand
    what it is telling you, fix what errors you understand, and go to the web for
    help if all else fails.


    As you are writing code, you''re bound to write some that doesn''t compile. When
    this happens, C# will point out the problems that came up so you can fix them.
    There are hundreds of different types of errors, each with a variety of possible
    causes, so we can''t cover everything (or anywhere). But it is worth taking some
    time to look at the most common errors. Additionally, we''ll take a look at a
    general guidelines for fixing these compiler errors in general.


    # Understanding Compiler Errors


    There''s an important step that occurs before you can run your program compiling.
    The compiler takes the human-readable source code that you''ve made and turns
    it into machine-readable binary code. If there are any mistakes in what you''ve
    written, the compiler can''t turn it into something executable. This is called
    a compiler error, or a `compile-time error`.


    Fortunately, this type of problem is relatively easy to solve. The compiler can
    tell you exactly what went wrong, and can even point out how you might be able
    to fix it.


    Compiler errors are shown to you in the Error List, which I described in Chapter
    41. The Error List can be opened at any time by choosing **View > Error List**
    from the main menu.'
