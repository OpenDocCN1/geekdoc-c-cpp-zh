    # Looking at Local Variables


    When the program is stopped, you''ll have the chance to see what your program
    is currently in. One of the most useful features is available that you can hover
    over any variable and it can be your current value.


    If the variable is an object, you''ll be able to hover over it, and in the little
    popup, you''ll be able to dig down and see all the details and current state of
    the object, including its private variables. If a particular class is a derived
    class, you''ll also have the ability to dig down to the base class, so everything
    you want to know about an object''s state will be visible.


    Note that this information is also available in the Locals Window. In many cases,
    this window will already be open for you, down towards the bottom, where the Error
    List is. If you don''t see it anywhere in Visual Studio, you can find it by going
    to **Debug > Windows > Locals.**


    # The Call Stack


    The call stack is one of the most useful tools that you''ll have to help figure
    out what happened. The call stack tells you what method called the current method.
    And yes, this is directly related to the stack that we created in Chapter 16.


    The problem is sometimes caused, not by the method that you are inside of, but
    by the calling method instead. You can use the Call Stack to see what methods
    have been called to get to you.


    Like the Locals Window, the Call Stack is usually already visible when you''re
    debugging, but if it is not, it can be opened by choosing **Debug > Windows >
    Call Stack** from the menu. The Call Stack Window looks like this:


    ![](img/ad92120e75cb88980f77f3297768b8f0_328_0.png)


    The method you''re currently in is at the top. **(SomethingElse, in this case.)**
    Each line below shows the method it called. **(SomethingElse** was called by **Something**,
    which was called by **Main.)** You can click on one of those other lines and Visual
    Studio will jump over to that method, allowing you to see what your variables
    are in there.


    # Editing Your Code While Debugging


    In some cases, you will have the ability to edit your code while it is running
    and then continue running the program, exactly where you left off, with the edited
    code. I can''t overstate how this'
