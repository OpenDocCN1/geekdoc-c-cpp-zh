  md: '# Other Topics 325


    DirectX 11 under the covers. In addition to Windows, it targets Linux, Mac, Android,
    iOS, web, PlayStation Mobile, and the Ouya console. XNA and MonoGame share essential
    syntax, and you''ll find yourself able to make virtually any game you can dream
    up. XNA was effectively retired a few years back. While you can still make games
    with XNA, the momentum has shifted to MonoGame in recent years.


    MonoGame and XNA tend to aim for the middle of the road when choosing between
    power and development speed. If you want more control or have a lot of very specific
    needs in your game, you can switch to OpenGL over OpenTK or Tao, or work with
    DirectX Sharp or SimDX. These options require more low-level boilerplate code,
    in exchange you have unbound flexibility and control to whatever you need to build.
    You can also use libraries for networking, AI, physics, etc. to keep your development
    speed up.


    On the other hand, giving up some flexibility and control for more rapid development,
    there are quite a few game engines that allow you to use C# for scripting. Probably
    the most known is Unity 3D, but other options include Paradox and Delta Engine.
    There are actually many game engines that use C#.


    As you can see, C# has no shortage of development options.


    # Other Topics


    In addition to other frameworks, it is also important to learn things the best
    way to structure your code, or various algorithms and data structures to use.
    If you are studying C#, and you''re getting started with formal education at a
    university, you''ll learn this in a software engineering class, or a data structures
    and algorithms class. Most universities require you to take these classes, and
    if it is optional, don''t skip it. It will be worth.


    If you''re not at a university, you''ll still want to learn these things. Take
    the time to learn software engineering practices. It will be worth it. You''ll
    know much better how to organize code in classes and how to make classes interactively.
    Doing it right way makes it easier to make changes as your plans for project change
    grow over time. You''ll learn how to test your code to make sure it is free and
    working like it should. And you''ll get a basic idea of how to manage your projects
    to finish them.


    Also, be sure to learn about data structures and algorithms for things like sorting
    and searching. Making software is a lot more than knowing how to write lines of
    code. And to make truly awesome, you''ll need to understand how things work at
    a higher level, and how to get the fastest results, or to maximize for speed vs.
    memory usage.


    Of course, if you''ve been programming for a while, especially if you have had
    formal education in things like this, then you probably already know most of stuff.
    Generally speaking, the best practices that you learned in other languages will
    carry you to the C# world.


    # Make Some Programs


    By the best you can do now is make some programs. Nothing will launch you to the
    C# world faster than making a real project. Or several. You''ll quickly see what
    topics you didn''t grasp (and then you can go back and learn them in depth) or
    you''ll figure out what extra little pieces you''ll need to learn still, and you''ll
    be able to quickly down those things on the Internet.'
