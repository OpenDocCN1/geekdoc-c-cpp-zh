    # Making Your Own

    Classes


    +   In a Nutshell

    * Classes typically go in their own file (C# doesn''t require it).

    * Anything that is a part of a class (or other type) is called a member. This
    includes instance variables, methods, and constructors.

    * Variables can be added to a class—these are called instance variables.

    * You can add as many constructors to a class as you want.

    * You can also add methods to a class, which operate on the variables that the
    class has.

    * The private keyword, attached to a method or instance variable, means that only
    stuff inside the class can see it.

    * The public keyword, attached to a method or instance variable, means that anything
    (inside or outside of the class) can use it.

    * This chapter also covers scope, name hiding, and the this keyword.


