  md: "# 194 Chapter 29 Error Handling and Exceptions\n\nIt's worth pointing out that\
    \ in the code above, the actual information about the exception is captured in\
    \ a variable e that has the type Exception. You're allowed to use that variable\
    \ inside of the catch block as needed. Just as a normal variable.\n\n# Not Giving\
    \ the Exception Variable a Name\n\nI mentioned earlier that with a catch block,\
    \ you can use the exception you're catching, (for example, Exception e) as a variable\
    \ inside of the catch block. On the other hand, if you aren't going to use it,\
    \ you don't need to even give the variable name:\n\n```\ntry{\n  ...\n}\ncatch(Exception)\
    \ // this Exception variable has no name\n{\n  ...\n}\n```\n\nWithout a name,\
    \ it is impossible to use the exception variable, but it also frees up the name\
    \ you would have used for something else, and you won't get that compiler warning\
    \ that, \"The variable e is declared but never used.\"\n\n# Handling Different\
    \ Exceptions in Different Ways\n\nI mentioned earlier that exceptions are packaged\
    \ into an instance of the Exception class (or a derived class). This is how different\
    \ types of errors can be handled differently. Looking back at the previous exception\
    \ handling code, because we're using the base Exception type, this will catch\
    \ them all, regardless of what the actual error was. (I call this \"Pokémon exception\
    \ handling\") In most cases, you'll want to handle different exception types in\
    \ different ways. They represent different problems, and will likely have different\
    \ error handling code.\n\nInstead, you can handle different types of errors in\
    \ different catch blocks like this:\n\n```\ntry{\n  int number = Convert.ToInt32(userInput);\n\
    }\ncatch (FormatException e){\n  Console.WriteLine(\"You must enter a number.\"\
    );\n}\ncatch (OverflowException e){\n  Console.WriteLine(\"Enter a smaller number.\"\
    );\n}\ncatch (Exception e){\n  Console.WriteLine(\"An unknown error occurred.\"\
    );\n}\n```\n\nWhen you do this, only one of the catch blocks will be executed.\
    \ Once the exception is handled, it will skip the rest of the catch blocks. If\
    \ a FormatException is thrown, it enters the first catch block and run the code\
    \ to fix the problem, but the catch(Exception e) block will not get executed,\
    \ even though the exception was technically of the type Exception. It was already\
    \ handled."
