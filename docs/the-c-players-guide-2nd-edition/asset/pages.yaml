  md: '![](img/ad92120e75cb88980f77f3297768b8f0_17_0.png)


    # Introduction


    # In a Nutshell


    +   - Describes the goals of this book, which is to function like a player''s
    guide, not a comprehensive cover-everything-that-ever-existed book.

    - Breaks down how the book is organized from a high-level perspective, as well
    as pointing out some of the extra “features” of the book.

    - Provides some ideas on how to get the most out of this book for programmers,
    beginners, and anyone who is short on time.


    # The Player''s Guide


    This book is not about playing video games. (Though programming is as fun as playing
    video games for many people.) Nor is it making video games, specifically. (Though
    you definitely can make games with C#).


    Instead, think of this book like a player''s guide, but for a programming language.
    A player''s guide is a popular kind of book that is written to help game players:


    +   - learn the basics of the game,

    - prevent them from getting stuck,

    - understand how the world they''re playing in works,

    - learn how to overcome the obstacles and enemies they face,

    - point out common pitfalls they may face and locate useful items,

    - master the tools they''re given.


    This book accumulates those goals for the C# programming language. I''ll walk
    you through the language from the ground up, point out places where people get
    stuck, provide you with hands-on examples, give you quizzes to ensure you''re
    on the right track, and describe how to use the tools you''ll need to create programs.
    I''ll show you the ins and outs of many features of C#, describing why things
    work the way they do, rather than just simple mechanics and syntax.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# xviii Introduction


    My goal is to provide you with the ''dungeon map'' to direct you as you begin
    delving into C#, while still allowing you to mostly explore whatever you want,
    whenever you want.


    I want to point out that this book is intentionally not called Everything you
    Need to Know about C#, or The Comprehensive Guide to C#(Note that if books with
    titles actually exist, I''m not referring to them specifically, but rather, to
    just the general idea of an all-encompassing book.) I''m here to tell you, when
    you''ve done with this book, you''ll still have to learn about C#.


    But guess what? That''s going to happen with any book you use, including those
    all-encompassing books. Programming languages are complex creations, and there
    are enough dark corners and strange combinations that nobody can learn everything
    there to know about. In fact, I''ve seen even people who designed the C# language
    say they learned something new about it For long as you use C#, you''ll constantly
    be learning new things about it, and that''s actually one of the things that makes
    programming interesting.


    I''ve tried to cover a lot of ground in this book, and with roughly 350 pages,
    anyone would expect that to be a bit a. And it is. But there are plenty of other
    books that out are 800 or 1200 pages long. A book so heavy, you''ll need a packing
    mule to carry it away. That, permanently place it on the central dais of an ancient
    library, with a single beam of dusty light shining in through a hole in the marble
    ceiling. Instead of all, the goal of this book is effectiveness and clarity, not
    comprehensiveness. That will fit be on your shelf and in your brain.


    It is important to point out that this book is focused on the C# programming language,
    rather than libraries for building specific application types. While you can build
    desktop applications, web pages, and computer games with C#, we won''t be discussing
    WPF, ASP.Net, DirectX, or any other platform or framework-specific code. We will
    focus on C# code, without bogging you down with additional libraries at first.
    Once you''ve got the hang of C#, heading into one of these areas will be much
    easier.


    # How This Book is Organized


    This book is divided into six parts. Part 1 describes what you need to get going.
    You''ll learn how to get set up with the free software that you need to write
    code and make your first C# program.


    Part 2 describes the basics of procedural programming—how to tell the compiler,
    step-by-step, what to accomplish tasks. It will cover how information is stored
    (in variables), how to make decisions, loop over things repeatedly, and put blocks
    of code that accomplish specific tasks into a reusable chunk called a method.
    It also introduces the type system of C# language, which is one of the key features
    of C# programming.


    Part 3 goes into object-oriented programming, introducing it from the ground up,
    but also getting into a lot of details that make it so powerful. Chapter 18, in
    my opinion, is the critical point of the book. It is when we get into the details
    of making your own classes, which is the most powerful way C# provides for building
    your own data types. Everything before this point is giving us the building blocks
    that we need to understand and make classes. Everything that we do is simply providing
    us with more ways to use these custom-made types or showing how to use other classes
    that have been made by.


    Part 4 covers some common programming tasks, as well as covering some of the more
    advanced features of C#. For the most, these topics are independent of each other,
    and once you''ve made it past that critical point in Chapter 18, you should be
    able to do these at any time you want.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# How This Book is Organized


    Part 5 changes gears, and covers more details about Visual Studio, which you use
    to create programs in C#, additional information about the .NET Framework, and
    some tools, tricks, and information you can use as you program.


    Finally, Part 6 wraps up the book with larger scale programs for you to try making,
    a chapter on where to go next as you continue to learn C#, and a glossary of words
    that are defined throughout the book, which you can use as a reference when you
    run across a word or phrase that you are unfamiliar with or have forgotten about.


    # Try It Out!


    Scattered throughout the book are a variety of sections labeled Try It Out! These
    sections give you simple challenge problems and quizzes that give you a chance
    to play around with the new concepts in the chapter and test your understanding.
    If this were a class, these would be the homework.


    The purpose of Try It Out sections is to help you get some real world practice
    with the new information. You can''t learn to drive a car by reading the owner''s
    manual, and you can''t learn to program without writing any code.


    I encourage you to spend at least a few minutes doing each of these challenges
    to help you understand what you''re reading and to be sure that you''ve learned
    what you needed to.


    If you have something you want to explore with the new concepts instead of the
    challenges I''ve provided, all better. The only thing better than playing around
    with this is doing something with that you have a personal interest in. If you
    want to explore a different direction, go for it!


    At the end of the book, in Chapter 4, I have an entire chapter of larger, tougher
    problems for you to try out. These problems involve combining concepts from many
    chapters together into one. Going through some or all of these when you''re finishing
    will be a great way to make sure you''ve learned the most important things you
    needed to.


    The most important thing to remember about these Try It Out sections is that the
    answers are all online. If you get stuck, or just want to compare your solution
    to someone else''s, you can see at starsoftsoftware.com/books/c-sharp/try-it-out/.
    I point out that your solution is different from mine (or anyone else''s) does
    not necessarily mean it is wrong. That''s one of the best parts of programming—there''s
    more than one way to do something.


    # In a Nutshell


    At the beginning of each chapter, I summarize what it contains. These sections
    are designed to do the following:


    +   - Summarize the chapter to come.

    - Show enough of the chapter so that an experienced programmer can know if they
    already know to skip the chapter or if they need to study it in depth.

    - Review the chapter to ensure that you got what you needed from the chapter.
    For instance, if you''re about to take a test on C#. You can jump from chapter
    to chapter, reading in the In a Nutshell sections, and it describes anything you
    didn''t already know, then go into the chapter and review it.


    # In Depth


    On occasion, there are a few topics that are not critical to your understanding
    of C#, but they are an interesting topic that is related to the things you''re
    learning. You''ll find this information pulled out'
