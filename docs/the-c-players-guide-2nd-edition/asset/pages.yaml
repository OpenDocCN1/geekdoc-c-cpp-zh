  md: '# Chapter 18 Making Your Classes


    # Finishing the Sample


    OK, there''s one final thing we want to do before we wrap up this chapter: make
    sure we see how to use our new Book class.


    This class will work very much like what we saw in the previous chapter about
    classes. In your Main method, you can create an instance of your Book class, and
    work with it like this:


    ```

    Book book = new Book("Harry Potter", "J.K. Rowling");


    // Changed my mind. Let''s use the full name.

    book.SetTitle("Harry Potter and the Half-Blood Prince");


    // Now I forgot. What was the title again?

    Console.WriteLine(book.GetTitle());

    ```


    This chapter has described the basics of building classes. You''ll keep learning
    as you keep going through the next few chapters, the real learning will come over
    the next few weeks, months, and even years. Splitting your program into classes
    is not always easy or intuitive.


    I always tell people that class design is one part science, one part art, and
    one part black magic.


    The science comes from learning basic principles and rules that tend to lead to
    better overall (the entire discipline of software engineering).


    The art comes from practice and experience. After creating 10000 classes, you''ll
    have a natural, intuitive sense of what will work and what won''t.


    The black magic part comes from the fact that no matter how much you know and
    how experienced you are, you''ll still get it wrong sometimes. Especially as you
    develop a program and to add features you have never thought of. Fortunately,
    software can easily be refactored and rearranged from the wrong organization to
    the right organization.


    There''s no such as getting it right the time, so don''t beat yourself up when
    you do. That applies to both beginners and professionals. Just change it to make
    it work like you think it should and keep moving forward.'
