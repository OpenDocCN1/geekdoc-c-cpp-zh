  md: "# Threading Code Basics 24\n\nWhen a thread runs into this statement, it freezes\
    \ and waits until the other thread finishes, effectively joining the execution\
    \ of the two threads.\n\nYou can create as many threads as you want. As I mentioned\
    \ earlier, they'll get their fair share of the total processor time. (Though you\
    \ don't want to have too many threads, because it takes time to create them, and\
    \ more threads mean more context switches, which can take time.)\n\nFor example,\
    \ here is some code that runs two threads and waits for them to finish:\n\n```\n\
    using System;\nusing System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\n\
    using System.Threading;\nusing System.Threading.Tasks;\n\nnamespace Threading\n\
    {\n    class Program\n    {\n        static void Main(string[] args)\n       \
    \ {\n            Thread thread1 = new Thread(CountTo100);\n            thread1.Start();\n\
    \n            Thread thread2 = new Thread(CountTo100);\n            thread2.Start();\n\
    \n            thread1.Join();\n            thread2.Join();\n\n            Console.ReadKey();\n\
