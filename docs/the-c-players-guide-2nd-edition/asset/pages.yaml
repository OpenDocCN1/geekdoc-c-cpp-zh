    # Virtual Method


    If a method is virtual, any classes can provide an alternate implementation of
    the method by overriding it. To mark a method as virtual, the virtual keyword
    should be used to it. See abstract method and overriding. (Chapter 22.)


    # Windows Presentation Foundation


    A large collection of tools that are designed to create Windows-based GUI applications.
    Windows Foundation is often abbreviated WPF. WPF is a replacement for Windows
    Forms, and is the recommended GUI framework for starting with new applications.
    This book does not cover WPF. (Chapter 47.)


    # Basic.NET


    A programming language that is different from C# in syntax, but has a 1-to-1 correspondence
    in keywords and features, both were designed for the .NET Framework. (Chapter
    40.)


    # XML Documentation Comment


    A special type of comment, placed immediately above a type or member to define
    what it does and how it is used. Comments are started by three forward slashes
    (///). The format can contain XML tags. Tag comments generate documentation that
    can be displayed on websites for anyone who uses your code. It is also used by
    Visual Studio to create IntelliSense for your code. (Chapter 15.)


    # C++


    See C++.


    # Visual Studio


    Microsoft''s IDE, designed for programming in C# and other programming languages.
    (Chapters 2 and 41.) The latest version of Visual Studio is Visual Studio free.


