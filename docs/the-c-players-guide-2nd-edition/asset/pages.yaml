    \nRunning this code. there are two threads that are both going to print out the\
    \ numbers 1 through 100. Typically, you'll see one thread active for a little\
    \ while, and then the other active. You might see the numbers 1-24 printed out,\
    \ and then thread will wait and the other will print, say 1-52, and the first\
    \ one will print out 25-87, and so on, until they finish up.\n\nYou'll never get\
    \ the exact same output the second time around. Things will be a little different\
    \ because the operating system is doing context switches as it sees fit. That's\
