  md: "# 74 Chapter 12 Looping\n\n```\nConsole.WriteLine(x);\n++x;\n```\n\nLet's take\
    \ a minute and look at what the computer does when it runs into this. This starts\
    \ with the variable x being 1. The program checks the condition in the **while**\
    \ loop and, asks, \"x is less than or equal to 10?\" This is true, so the stuff\
    \ inside the **while** loop gets executed. It writes out the value of x, which\
    \ is 1, then increments x. (Remember that it adds it to one.) When it hits the\
    \ end curly brace, it finishes the loop and goes back up to the beginning of the\
    \ loop, checking the condition again. This time, however, x is now 2. x has changed.\
    \ The condition is true (2 is still less than or equal to 10) and the loop repeats\
    \ again, printing \"2\" and incrementing x to 3. While it happens 10 times total,\
    \ until x increments to 11. When the program checks to see if 11 is less than\
    \ or equal to 10, the condition is no longer true, and the flow of execution jumps\
    \ down the end of the loop.\n\nOne to think about is... Imagine (or better yet,\
