  md: "# Statement Lambdas\n\nSometimes the compiler can't figure it out. If it can't,\
    \ you'll get an error message when you compile. If this happens, you'll need to\
    \ explicitly put in the type of the variable, like this:\n\n```\n(int x) => x\
    \ % 2 == 0;\n```\n\n# Statement Lambdas\n\nAs you've seen now, most methods are\
    \ more than one line long. While lambda expressions are particularly suited for\
    \ very short, single line methods, there will be times that you'll want a lambda\
    \ expression that is more than one line long. This complicates things a bit, because\
    \ you'll need to add semicolons, curly braces, and a return statement, but it\
    \ can still be done:\n\n```\n(int x) => { bool isEven = x % 2 == 0; return isEven\
    \ };\n```\n\nThe form we were using earlier is called an expression lambda, because\
    \ it had only one expression in it. This new form is called a statement lambda.\
    \ As a statement lambda gets longer, you should probably consider pulling it out\
    \ into its own method.\n\n# Scope in Lambda Expressions\n\nFrom what we've seen\
    \ far, lambda expressions have basically behaved like a normal method, only embedded\
    \ in the code throw with a different, cleaner syntax. Now I'm going to show you\
    \ something that throw for a loop.\n\nInside a lambda expression, you can access\
    \ the variables that are in scope at the location of the lambda expression. Take\
    \ the following, for example:\n\n```\nint cutoffPoint = 5;\nList<int> numbers\
    \ = new List<int> {1, 7, 4, 2, 5, 3, 9, 8, 6};\numerable<int> numbersLessThanCutoff\
    \ = numbers.Where(x => x < cutoffPoint);\n```\n\nIf our lambda had been turned\
    \ into a method, we wouldn't have access to that cutoffPoint (Unless it is passed\
    \ as a parameter). This adds a ton of power to the way lambda expressions work,\
    \ so it's good to know how.\n\n(For what's it, anonymous methods have the same\
    \ feature.)\n\n# Expression-Bodied Members\n\nLambda expressions were introduced\
    \ to C# in version 3.0, and as I mentioned earlier, one of the draws to it is\
    \ that the syntax is much more concise. That's for short methods that would otherwise\
    \ require a lot of overhead to define.\n\nC# 6 extends this a little, allowing\
    \ you to use the same expression syntax to define normal non-lambda methods within\
    \ a class. For example, consider the method below:\n\n```\npublic int ComputeSquare(int\
    \ value)\n{\n  return value * value;\n```\n\nNow that we know about lambda expressions\
    \ and the syntax that goes with them, it makes sense to point out that this method\
    \ could also be implemented with the same expression syntax:"
