    # # A Practical Example


    Before you start thinking, "Well that''s completely useless, let me show you why
    these are so useful.

    The operator can be used to "turn on" a bit in the field:


    ```

    ForumPrivileges privileges = ForumPrivileges.BasicUser;

    privileges |= ForumPrivileges.Suspended; // Turn on the ''suspended'' field

