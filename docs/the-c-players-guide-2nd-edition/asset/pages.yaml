    # Using an Object


    Computers and Randomness. Generally speaking, random numbers on computers aren''t
    truly random. They are actually chosen using an algorithm that simply appears
    random. They need to be initialized, with a number chosen by the programmer. This
    number is called a seed. If you use the same seed, you will get the same sequence
    of random numbers, over and again.


    Since the vast majority of the time, this is not something you want, programmers
    will often see the random number generator with the current time, accurate to
    the millisecond. This makes it so that a different sequence is generated every
    time you run the program.


    The Random class that we''re using will automatically seed the random number generation
    with the current time, but you can also specify it if you would like.


    We can use the Random class in a way that is very similar to any other type:


    ```

    Random random = new Random();

    ```


    In this case, we want to use Random for our variable''s type, and like usual,
    we give our variable name (random). With any other variable, we can assign a value
    using the assignment operator (=).


    But after that, we''ll see a couple of things that we haven''t really seen. You
    can see the new keyword that ties us off to the fact that we''re going to create
    a new instance of the Random class—an object with the Random type.


    The Random() part might look like a method call to you, and it kind of is. In
    fact, it is a special method called a constructor. A constructor is placed in
    class and describes how to create or build a new object that has that type. This
    particular constructor has no parameters (hence the empty parentheses) but it
    is possible to have constructors with parameters, like any other method.


    When line is finished executing, our variable random will contain a reference
    to a brand new object with the type Random.


    # Using an Object


    When we''ve got a working object, we can do stuff with it. If you remember, an
    object has state, and it behaviors. In the specific case of the Random object
    we just created, internally, it is keeping track of its state, but it doesn''t
    expose any of that to:


    So we can modify a Random object''s state, we can use its behaviors, defined by
    its methods. Other types, aside from the Random type, will provide methods to
    allow us to change the object''s state (Like changing a ball''s color from blue
    to red).


    We can access our object''s behaviors through the methods it has defined in it.
    For starters, the Next method. We can call this method using the dot operator
    (\("").


    ```

    Random random = new Random();

    int nextRandomNumber = random.Next();

    ```


    We''ve used the dot operator in the past, and it is probably time to really explain
    what it means. The operator is used for member access. In other words, to access
    something that belongs to'
