    Let's design a really basic logging framework. We start with a simple LogEvent\
    \ class that has a Text property. Obviously, a real logging framework would probably\
    \ have quite a bit more than just this, but let's keep it simple. We're just trying\
    \ to do some delegate stuff here.\n\n```\npublic class LogEvent\n{\n    public\
    \ string Text { get; }\n    public LogEvent(string text)\n    {\n        Text\
    \ = text;\n    }\n}\n```\n\nWe'll also define another delegate type that will\
    \ handle or process these LogEvents using whatever strategy it chooses to:\n\n\
    ```\npublic delegate void LogEventHandler(LogEvent logEvent);\n```\n\nWe could\
    \ easily imagine all sorts of things we could do with an event handler method.\
    \ Writing things to the console is an obvious first choice. We could also write\
    \ to a file or to a database. If we added a Severity property to our LogEvent\
    \ class, we might even set something up that a Fatal level event can handle, we'd\
    \ send an email somewhere.\n\nLet's stick with the long hanging fruit and write\
    \ a method that can write a LogEvent to the console and one that one can write\
    \ to a file:\n\n```\nprivate static void logToConsole(LogEvent logEvent)\n{\n\
    \    Console.WriteLine(logEvent.Text);\n}\n```\n\n```\nprivate static void logToFile(LogEvent\
    \ logEvent)\n{\n    File.AppendAllText(\"log.txt\", logEvent.Text + \"\\n\");\n\
    }\n```\n\nThese don't have to be static, of course, because they don't rely on\
    \ any instance variables or methods, I've made them static\n\nThe first method\
    \ writes to the console, which we've done a million times now.\n\nThe second writes\
    \ to a file using the AppendAllText method on the File class. A file called log.txt,\
    \ and since it's a relative path, you'll find it next to the application's exe\
    \ file. I also stuck a new line character ('\\n') at the end of so that each log\
