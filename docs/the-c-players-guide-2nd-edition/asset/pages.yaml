  md: '```

    from customer in allCustomers

    select new Person() { employee, customer };

    ```


    # Try Out!

    Back to Procedural Programming. Take the query statement to find all parents of
    teenagers just presented and rewrite it without query syntax. This will probably
    require a couple of loops and an if statement. Compare which of the two is easier
    to understand at first glance.


    # Ordering Results


    One powerful feature of query statements is the ability to dictate how the results
    should be given back to you. To accomplish this, we''ll add in a new clause to
    our query: the orderby clause. The query orders person from smallest to tallest:


    ```

    IEnumerable<Person> shortestToTallest =

    from person in allPeople

    orderby person.Height

    select person;

    ```


    There''s another part to this. You have the ability to sort in ascending or descending
    order. The default is ascending. To choose between two simply use the ascending
    or descending keyword at the end of the orderby clause:


    ```

    IEnumerable<Person> tallestToShortest =

    from person in allPeople

    orderby person.Height descending

    select person;

    ```


    # Retrieving a Different Type of Data


    In all of the examples we''ve done so far, we''ve always created a resulting list
    of the same type as the original. In all of our examples, our final result has
    always been an IEnumerable of the type Person, which is what we wanted. This doesn''t
    have to be the case.


    We can return a list of a different type, based on a part of what we were looking
    at:


    ```

    IEnumerable<string> nameOfAdults =

    from person in allPeople

    where person.Age >= 18

    select person.FirstName + " " + person.LastName;

    ```


    In this example, we end up with a list of strings, not a list of Person.


    # Method Call Syntax


    We''ve seen a lot in this chapter. and now let''s do it all again! Everything
    we''ve seen with query syntax could alternatively be done with a variation called
    method call syntax. All of the things we''ve discussed with query syntax can be
    done by calling methods that have similar names. Method call syntax is often less
    readable, but it allows you to do a few other things that query syntax does not.


    Let''s go back a variation on the first query we discussed, which looked like
    this:'
