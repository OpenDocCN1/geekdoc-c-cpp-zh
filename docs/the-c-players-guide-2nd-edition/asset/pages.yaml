  md: '# Chapter 16 Value and Reference Types


    The heap is a little more complicated. In the day, when you put stuff in the heap,
    you needed to remember it, and when you were done it you had to tell the computer
    you were done with it. This would allow you to reuse that space again.


    If you were putting something on the heap for a moment, and getting rid of it
    after, this was easy to do. But this was not so simple when you were putting on
    the heap needed to stay there a while before being cleaned up. It was very easy
    to forget that it was there, and even if you remembered, it was usually all too
    easy to free that memory correctly. You''d end up with garbage that you no longer
    wanted, but the computer didn''t know it could reuse. This is called a memory
    leak, and if you had one (or many) then your program was eventually going to run
    out of space and die.


    Fortunately for us, C# uses an approach where the .NET Framework manages your
    heap''s memory for you. If you''re starting to run low on memory for your program,
    a part of the .NET Framework calls the garbage collector to run rid of any old,
    unused stuff on your heap, freeing it for other uses. If you''ve never had to
    manage your own program''s memory, it may be hard to see this, but garbage collection
    is a huge deal, and it saves you lots of time, worry, and customer complaints.


    # References


    Since data on the heap is scattered about rather structured like the stack, you
    will need a way to keep track of the variable or data you are interested in.


    Historically speaking, you would have used a thing pointer, which stored the memory
    address of the object you were interested in. The computer could use that memory
    address to go and look up what you wanted.


    With C#, the heap''s memory is managed, when the CLR is going out of its way to
    take care of it for you. If the heap''s memory wasn''t managed, we couldn''t do
    garbage collection.


    Because the CLR is managing the memory on the heap for you, it may move things
    around it as it sees needs. Not having an actual pointer to a location in memory
    is not the best idea, since it could get changed. C# uses a thing reference, which
    is like a pointer, but it is also managed for you. Even as things moved around
    in memory, a reference will always direct you straight to the information you
    are interested in.


    It is convenient to think of a reference as an arrow pointing to a specific item
    or variable within the heap. However, references aren''t truly arrays, but more
    of a unique identifier that tells the computer where to find the end of the data
    within the heap.


    # Value Types and Reference Types


    In C#, all types are divided into two broad categories: value types and reference
    types. With our discussion on the stack vs. heap, and what we now know about references,
    we''re ready to dig into the difference between these two. This is one of the
    biggest blocks or misunderstandings for both beginners and experienced programmers,
    so take the time you need to make sure you understand how these two difference
    categories of types work.'
  merge: -1
