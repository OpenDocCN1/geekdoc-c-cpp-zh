  md: '# # Getting the Most from Visual Studio


    # ## In a Nutshell


    +   - You can exclude files that you do not want in a project without deleting
    them. You can include previously excluded files.

    - You can show line numbers in your source code, which helps in debugging.

    - Describes how to use IntelliSense.

    - Outlines some basic refactoring techniques.

    - Points out some useful and interesting keyboard shortcuts.


    Visual Studio is a very sophisticated program. It is impossible to fit everything
    that is worth knowing about Visual Studio into a single chapter in book. Like
    many other topics that we''ve talked about, you could write books about this.
    In this chapter, we''ll cover some of the most important and most useful features
    of Visual Studio. There is a lot to learn beyond what I describe in this chapter,
    but these things will get you started.


    # ## Windows


    The Visual user interface is essentially composed of a collection of windows or
    views that allow you to interact with your code in different ways. Each window
    has its own specific task, and there are lots of windows to choose from.


    # ## The Code Window


    The main code window, where you have been typing in all of your code for all of
    your projects, is the most important window. This window has a lot of settings
    that you can customize, which I''ll outline in the section below, about the Options
    Dialog.'
