  md: "# Object Initializer Syntax 137\n\nThe key point to remember here is that you\
    \ can make your auto-implemented property read-only by simply having a getter\
    \ with no setter. This causes it to be writeable while the object is created,\
    \ but not afterwards.\n\n# Default Values\n\nFor an auto-implemented property,\
    \ you can assign a default value to the property.\n\n```\npublic class Vector2\
    \ {\n    public double X { get; set; } = 0;\n    public double Y { get; set; }\
    \ = 0;\n}\n```\n\nOf course, the default value of any number will be 0, so in\
    \ this case we haven't actually changed anything, but it conveys the idea and\
    \ the syntax correctly.\n\nYou can also assign default values for the read-only\
    \ properties we just described in the last section.\n\nIf your property has a\
    \ default value, it will get assigned to the property before the constructor runs.\
    \ That means that in the constructor, it will already have a specific value, and\
    \ if you give the property a value the value assigned to the constructor will\
    \ be the actual value stored in the property, simply because it happens last.\n\
    \n# Object Initializer Syntax\n\nThere's one other interesting thing that we should\
    \ discuss when we're on the subject of properties. Let's say you use a Book class\
    \ in the previous chapter that has instance variables for the book title, number\
    \ of pages, and word count. Let's also say that you create properties for each\
    \ of those, called **Author**, **Title**, **Pages**, and **WordCount**.\n\nWhen\
    \ you create a new Book object, you can use the following syntax to assign values\
    \ to the properties, right when you create the object, like this:\n\n```\nBook\
    \ = new Book { Title = \"Frankenstein\", Author = \"Mary Shelley\" };\n```\n\n\
    This prevents us from needing to do:\n\n```\nBook = new Book();\nbook.Title =\
    \ \"Frankenstein\";\nbook.Author = \"Mary Shelley\";\n```\n\nInstead, we can combine\
    \ all into one line. This particular setup is called object initializer. It can\
    \ be a convenient way to set up objects without defining to different constructors.\n\
    \n> **Try It Out!**n**Playing with Properties.** At the end of the last chapter,\
    \ we created a couple of classes as practice. Go back to those classes and add\
    \ properties for the various instance variables that they have. While doing so,\
    \ make sure you play around with at least one auto-implemented property."
