  md: '# What’s Next?


    # In a Nutshell


    +   - Your next step might include learning Windows Forms or WPF if you want to
    make desktop applications, ASP.NET if you want to make websites or web-based programs,
    the libraries for Universal apps or the Windows phone, MonoGame, XNA, Unity, and
    SharpDX if you haven''t already done while learning to try your hand at making
    video games.

    - It is also worth your time to learn software engineering, as well as data structures
    and algorithms if you haven''t already done so while learning another language.

    - The best way to learn C# is to program in C#.

    - You can get more information from MSDN, Stack Overflow, and this book''s website.


    As you finish learning everything this book has to offer, you might be wondering
    where you''re supposed to go next. And it really depends. I want to take a little
    time and give you some pointers on your next steps you might take.


    # Other Frameworks and Libraries


    If you''ve gone through this book sequentially, you already know all of the basic
    things you need to know about the C# language. Most of the rest of your learning
    in the C# world will be more learning additional libraries and frameworks, and
    understanding how to use the types and methods they contain, and less about learning
    new features of C# itself.


    The specific libraries and frameworks that you''ll want to learn depend on what
    you want to accomplish with C#. I''ll provide a brief discussion about some of
    the more useful ones.


    # WPF and Windows Forms


    If you want to make desktop applications with windows, dialog boxes, check boxes,
    and the like, you''ll want some time to learn Windows Forms (sometimes called
    WinForms) or Windows Presentation Foundation (WPF). Both of these are the same
    types of thing. Windows Forms is older,'
