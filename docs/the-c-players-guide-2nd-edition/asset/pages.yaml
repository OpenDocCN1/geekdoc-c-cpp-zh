  md: "# Revisiting the 'base' Keyword\n\nTo change the implementation for the derived\
    \ class, we simply create a new copy of the method, along with our new custom-made\
    \ implementation, and add in the override keyword.\n\nYou don't need to override\
    \ virtual methods, you're just allowed to. And if a class has more than one virtual\
    \ method, you can override some and not others.\n\nNaturally, you can make any\
    \ number of derived classes to do their own way:\n\n```\nclass RBSearchEngine\
    \ : SearchEngine{\n    public string[] Search(string findThis)\n    {\n      \
    \  return new string[]{\n            \"I found something.\", // Thanks EDI\n \
    \           \"I found this for you.\" // Thanks SIRI\n        };\n    }\n}\n```\n\
    \nHere's where it gets interesting. Because our derived classes RBSearchEngine\
    \ and GoogleSearch are inherited from the SearchEngine class, we can use them\
    \ anywhere a SearchEngine object is required:\n\n```\nSearchEngine engine1 = new\
    \ SearchEngine(); // The plain original one.\nSearchEngine engine2 = new GoogleSearch();\n\
    SearchEngine engine3 = new RBSearchEngine();\n```\n\nBut now we can use Search\
    \ method, and depending on the actual type, the various implementations will be\
    \ called:\n\n```\nstring[] defaultResults = searchEngine1.Search(\"hello\");\n\
    string[] googleResults = engine2.Search(\"hello\");\nstring[] rbsResults = engine3.Search(\"\
    hello\");\n```\n\nWe'll get different results for each of these methods, because\
    \ each of these types define the method differently. The default SearchEngine\
    \ class provides a default implementation of the method but the GoogleSearch and\
    \ RBSearchEngine \"alter the deal\" and override the original implementation,\
    \ swapping it out for their own. The CLR is smart enough to know which method\
    \ to use at the right time.\n\nThis type of setup, where calling the same method\
    \ signature results in different methods actually being executed, is the crux\
    \ of polymorphism. Polymorphism means \"many forms,\" and in this situation, we\
    \ can see that calling the same method results in different behaviors or forms.\n\
    \n# Revisiting the 'base' Keyword\n\nLast chapter, when we brought up constructors\
    \ in a derived class, we brought up the base keyword, which lets you access the\
    \ constructors from the base class. We can also use the base keyword elsewhere\
