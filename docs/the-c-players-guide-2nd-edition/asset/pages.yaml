  md: "# Chapter 43 Handling Common Compiler Errors\n\nThis gets right down to the\
    \ heart of variable scope, which I described in Chapter 18. If you're sure the\
    \ variable has been declared and you're still getting this error, you'll want\
    \ to make sure that the variable is still in scope at the place you're trying\
    \ to use it. This might mean the variable in question is a bigger scope.\n\nOne\
    \ example in particular that I think is worth looking at is one where you have\
    \ a variable that is declared at block scope, but you try to use it after the\
    \ block (but still within the method) like this:\n\n```\nstatic void Main(string[])\
    \ args\n{\n    for(int index = 0; index < 10; index++)\n    {\n        // ...\n\
    \    }\n    index = 10; // Can't use it here. It has block scope, and doesn't\
    \ exist after\n    // the loop.\n}\n```\n\nHere, the variable index cannot be\
    \ used beyond the scope of the for loop. If you want to use this variable outside\
    \ of the loop, you also need to declare it outside of the loop:\n\n```\nstatic\
    \ void Main(string[]) args\n{\n    int index;\n    for(int index = 0; index <\
    \ 10; index++)\n    {\n        // ...\n    }\n    index = 10; // You can use it\
    \ here, now.\n}\n```\n\n# **\") expected\", \"} expected\", or \"; expected\"\
    **\n\nIt is very common to see errors when a parenthesis, closing curly brace,\
    \ or semicolon is expected.\n\nInterestingly, the solution isn't to add, ), or\
    \ ; at the spot that the compiler is complaining about. (Sometimes, but not always).\
    \ It just means the compiler was unable to figure out where the end of a statement\
    \ or block was.\n\nIn fact, the compiler thinks the error is in a location that\
    \ is very different from where the problem actually lies. This is because the\
    \ compiler only realizes there's a problem when it eventually runs you into a\
    \ place where it no longer makes sense to think you're still in the same block\
    \ or statement.\n\nIt's kind like driving down the road and missing your turn,\
    \ only to discover the error ten minutes later when you see you're leaving the\
    \ city limits. You don't know when you missed the turn specifically, just that\
    \ at some point along the line, you went too far. That's exactly what the compiler\
    \ does, and so you'll potentially po-tially point out the error much later than\
    \ when it actually occurred.\n\nTake this code, for instance:\n\n```\nnamespace\
    \ Example\n{\n    class Program\n    {\n```"
