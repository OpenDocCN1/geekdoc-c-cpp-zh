  md: '# 17


    # Classes and Objects


    # In a Nutshell


    +   - Object-oriented programming is a way of programming where you create chunks
    of code that are modeled after real world objects.

    - Classes in C# define what an entire "class" of objects can do (what all players
    can do, or what any car can do, including what kind of data it stores and the
    tasks it can do).

    - Classes are reference types.

    - Creating a class is the most powerful way C# has of defining your own types.

    - You can create a new object with something like this: **Random random = new
    Random()**. This creates a new **Random** object, which is used to generate random
    numbers.


    We have worked with a lot of types as we''ve been learning C#. All along, I''ve
    promised you that we''ll learn how to make our own types, and the time has finally
    come for that!


    To define our own types, we''re going to use all of the other types we have learned
    about, combined with methods, to construct new types from scratch. We will be
    able to use these types, just like we have done with the built-in types.


    Before we start making our own types, we first want to start with a discussion
    about why we need to be able to create our own types, and how to go about designing
    our new types.


    # Modeling the Real World


    Over the many, many years that people have been programming, we''ve come to learn
    that one of the best ways to structure code is to mimic the real world works.
    It helps to break things into manageable pieces, and presents an intuitive way
    for programmers to work with their code.


    Read that last paragraph again. It''s important.'
