    \ to an event will be executed. However, if one of the event handlers throws exception\
    \ that isn't handled, the remaining handlers won't get called. For this reason,\
    \ event handlers shouldn't throw exceptions.\n\nIt is also possible to detach\
    \ event handlers from an event, which you should do when you no longer need to\
    \ be notified about the event. This is an important step. Without detaching event\
    \ handlers, it's easy to end up with tens of event handlers attached to a method,\
    \ or even the same handler attached to an event multiple times. In the best case\
    \ scenario, things slow down. In the worst case scenario, things may not function\
    \ correctly.\n\nNote that you rarely want the same event handler attached to an\
    \ event more than once, but this is allowed. The method will be called twice,\
    \ because it is attached twice.\n\nTo detach an event, you use the -= operator\
    \ in a manner similar to attaching events:\n\n```\npoint.PointChanged -= HandlePointChanged;\n\
    ```\n\nAfter this executes, HandlePointChanged will not be called when the PointChanged\
    \ event occurs.\n\n# Common Delegate Types Used with Events\n\nWhen using events,\
    \ the event can use any delegate type imaginable. Having said, there are a few\
    \ delegate types that seem to be most common, and those are worth a bit of attention.\n\
    \nThe first common delegate is of Action delegates, which we talked about in the\
    \ last chapter. For instance, if you want an event that calls a parameterless\
    \ void method when the event occurs (a simple notification that something happened,\
    \ without relating any sort of data or information to the listener) you could\
    \ use old old Action:\n\n```\npublic event Action HandlePointChanged;\n```\n\n\
    You could subscribe the method below to that event:\n\n```\nprivate void HandlePointChanged(\n\
    \    // Do something in response to the point changing.\n}\n```\n\nIf you need\
    \ to get some sort of information to the subscriber, you could use one of the\
    \ other variants of Action that has generic type parameters. For example, we might\
    \ want to pass in the point that changed. So we change the event declaration to\
    \ use the generic Action that has an extra type parameter to include the point:\n\
    \n```\npublic event Action<Point> PointChanged;\n```\n\nThen we subscribe to the\
    \ event with a method like this:\n\n```\nprivate void HandlePointChanged(Point\
    \ pointThatChanged)\n{\n```"
