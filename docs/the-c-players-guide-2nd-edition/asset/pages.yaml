    # How Data is Stored


    Before we move into a discussion about the C# type system, we need to understand
    a little about how information is stored on a computer. This is a key part of
    what drives the need for types in the first place. It is important to remember
    that computers only work with 1''s and 0''s. (Technically, they''re electric pulses
    or magnetic fields that can be one of two states which we label 1 and 0, but you
    don''t need to worry too much about unless you want to make hardware).


    A single 1 or 0 is called a bit, and a grouping of eight of them is called a byte.
    If we do the math, this means a single byte can store up to a total of 256 different
    states.


    To get more than this, we need to put multiple bytes together. For instance, two
    bytes can store 65,536 possible states. Four bytes can store 4 billion states,
    and eight bytes can combined store over 18 quintillion possible states.


    But we need to take all of these and make sense of them. This is what the type
    system is for. It defines how bytes we need to store different things, and how
    those bits and bytes will be interpreted by the computer, and ultimately, the
    user.


    For example, let''s say we use two bytes to store letters. Modern systems tend
    to use two bytes to store letters. Programmers have assigned each letter a specific
    pattern of bits. For instance, we assign the capital letter ''A'' to the bit pattern
    0000000001000001. ''B'' is one off from: 0000000001000010. Because we''re using
    two bytes, we have 65,536 different possibilities. That''s enough to store every
    symbol in every language that is currently spoken on Earth, including many ancient
    languages, and still have room for a plethora of random characters.'
