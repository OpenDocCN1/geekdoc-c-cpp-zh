  md: "# 182 Chapter 27 Methods Revisited\n\n```\npublic int RollDie(int sides = 6)\n\
    {\n    return random.Next(sides) + 1;\n}\n```\n\nWith this code, you can now call\
    \ RollDie() and the value of 6 will be used, or you can still fall back to putting\
    \ a value if you like:\n\n```\nRollDie(); // Uses the default value of 6.\nRollDie(20);\
    \ // Uses 20 instead of the default.\n```\n\nWhile you're allowed to have as many\
    \ optional parameters as you want, and you can mix and match them with non-optional\
    \ parameters, all optional parameters must come at the end, after all of the \"\
    normal\" parameters.\n\n# Named Parameters\n\nOccasionally, you'll go to use a\
    \ method, but you won't remember what order the parameters are in. This is especially\
    \ true when the method requires several parameters of the same type. As an example,\
    \ look at the method below, which takes an input value and clamps it to a particular\
    \ range, returning the:\n\n```\npublic int Clamp(int value, int min, int max)\n\
    {\n    if(value < min) return min; // Bump the value up to the min if too low.\n\
    \    if(value > max) return max; // Move the value down to the max if too high.\n\
    \    // Otherwise, we're good with the original value;\n}\n```\n\nWhen you go\
    \ to use this method, you might see something like this:\n\n```\nClamp(20, 50,\
    \ 100);\n```\n\nWhen you see this, you always need to do a little digging to figure\
    \ out what's going on. Is it going to clamp the value of 100 to the range 20 to\
    \ 50? Or clamp the value of 20 to the range 50 to 100?\n\nTo avoid this ambiguity,\
    \ C# allows you to supply names for parameters. This is done by putting the parameter\
    \ name, followed by a colon, followed by the value for that parameter:\n\n```\n\
    Clamp(min: 50, max: 100, value: 20);\n```\n\nWith named parameters, it is clear\
    \ what value belongs to which parameter. Furthermore, as long as the compiler\
    \ can figure out everything goes, this allows you to put the parameters in any\
    \ order, making it so that you don't need to worry about the effort ordering,\
    \ as long as they all have a value.\n\nWhen you call a method, you can use regular\
    \ unnamed parameters, or named parameters, but all regular parameters must come\
    \ first, and each variable must be assigned to only once.\n\nYou can combine optional\
    \ parameters with named parameters.\n\nOne side effect of this feature is that\
    \ parameter names are now a part of your public interface. Changing a parameter's\
    \ name, can break code that calls the method using named parameters."
