  md: '# 324 Chapter 47 What''s Next?


    and generally considered to be a bit easier to understand. And while you can make
    applications with it, Microsoft is no longer adding new features to it. WPF is
    designed to ultimately replace it, but there are lots of applications that still
    use WinForms, and even a lot of new ones are still based on it. WPF is a little
    harder to learn, but has far more power and probably where the future of desktop-based
    Windows programming is. (But also consider Universal apps, below.) In the long
    run, WPF is probably a better investment of your time than Windows.


    # ASP.NET


    If you''re interested in making web-based software, ASP.NET is the next step.
    ASP.NET allows you to run C# code on the server side, in place of alternatives
    like PHP, Java (Java Server Pages), Python, or Perl. By the way, don''t get confused
    with Active Server Pages (ASP), which replaced. ASP.NET allows you to run C# code
    on the server endpoint of a website to generate dynamic content for the user.
    This doesn''t take the place of client side code like JavaScript, nor eliminate
    the need for HTML. An ASP.NET program will generate a custom-made HTML page for
    the user of a website to look.


    # Universal Windows Apps


    Universal Windows Apps (usually shortened to Universal Apps, often called Windows
    Store, and previously called Metro-Style Apps, among some other name) is a framework
    that lets you make applications that run on all of the Microsoft platforms with
    only minor deviations for the different devices. This includes on a Windows desktop
    or laptop (often sold through the Windows Store), as well as Tablets, Windows
    Phones, and even the Xbox One.


    Unfortunately, "universal" is probably a bit of a misnomer. When creating universal
    apps, you''ll have to have a ton of shared code, which you''ll inevitably need
    with some custom code for each of the different platforms. This is far better
    than developing completely independent codebases for the different platforms,
    but there''s still room for improvement. Microsoft is heading in the right direction
    with this, and the platforms are growing, rather than diverging.


    The universal app platform relies heavily on XAML, one of the technologies of
    WPF, so there''s a bit of overlap when using these different frameworks.


    Making apps requires Windows 8 or newer.


    # Windows Phone


    Microsoft also provides tools to make it easy to make apps for the Windows phone.
    While Windows apps make only a small percentage of market phones worldwide, this
    is an area that is watching in the future. Microsoft''s push with universal apps,
    which will work on the next generation of Windows phones may bring a much larger
    collection of apps to the platform.


    You can easily do development for Windows 8 phones in Visual Studio, as long as
    you''re developing on a Windows 8 computer and have the Windows Phone SDK installed.


    # Game Development


    I''ve saved my favorite for last. C# is a very popular choice for game development,
    and you have a wide variety of options for doing so in C#.


    To enumerate just a few, Microsoft XNA, has been a popular game development framework
    that runs on top of DirectX 9 and runs on a wide variety of Mono-based platforms.
    The XNA framework has since been ported under the name MonoGame, which targets
    the Mono framework (an open source port of .NET Framework) and allows you to use
    either OpenGL or'
