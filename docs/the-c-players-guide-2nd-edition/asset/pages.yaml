    We now know of eight types, all of which are designed to store only integers.
    These types, as a collection, are known as integral (sometimes "integer types").
    We can organize these types in the hierarchy diagram to the right. As we continue
    our discussion of types throughout this chapter and we''ll continue to expand
    this chart. You may notice that we are still missing one integral type, which
    we''ll discuss shortly.


    | Integral Types |

    |---|---|---|---|

    | byte | short | int | long |

    | sbyte | ushort | uint | ulong |


    Each of the types we''ve discussed use a different number of bytes and store different
    ranges of values. That each of them is best suited for storing different types
    of information. How do you know what type to use? Here are three things to consider
    as you''re choosing a type for a particular variable:


    +   - Do you need signed values? (Can things be negative?) If so, can you immediately
    eliminate all of the unsigned types.

    - How large might your values be? For example, if you are using a variable to
    store the population of a country, you''ll need to use something bigger than a
    byte or a short.

    - When in doubt, many programmers tend to default to the int type. This might
    be sort of Goldocks (not too big, not too small, but just about right). As a result,
    sometimes int is overused, but it might be a good starting point, at any rate.


    # The char Type


    We have one more integral type to discuss before we move on. This last type is
    called the char type, and is used for storing single characters or letters, as
    opposed to numbers.


    It is strange to think of characters as an integral type, which are all designed
    to store a single number, which is why they get lumped among the integral types.
    Behind the scenes, each letter can be assigned to a single number. However, when
    we use the char type, the computer will know to treat it as a letter instead,
    so we''ll see it print out the letters instead of numbers.'
