  md: '# 328 Chapter 48 Glossary


    # ASP.NET


    A framework for developing web-based applications using .NET Framework. This book
    does not cover ASP.NET in depth. (Chapter 47.)


    # Assembly


    Represents a single block of redistributable code, used for deployment, security
    and versioning. An assembly comes in two forms: a process assembly in the form
    of an EXE file, and a library assembly in the form of a DLL file. An EXE contains
    code without a specified starting point. See project and solution. (Chapter 40.)


    # Assembly Language


    A low level programming language where instruction corresponds directly to an
    equivalent instruction in machine or binary code. Assembly languages can be thought
    of as a human readable format of binary. (Chapter 40.)


    # Assignment


    The process of placing a value in a specific variable. (Chapter 5.)


    # Asynchronous Programming


    The process of taking a long running task and pulling it out of the main execution,
    having it run on a separate thread at its own pace. This relies heavily on threading.(Chapters
    37 and 38.)


    # Attribute


    A feature of C# allows you to give extra information about a type or member. This
    information can be used by the compiler, other tools to parse or process the code,
    or at run-time. You can create attributes by creating a new type derived from
    Attribute class. Attributes are applied to a type or member by using the name
    and optional parameters for them. The attribute appears in brackets immediately
    above the type or member''s declaration. (Chapter 39.)


    # Base Class


    In inheritance, a base class is the one that is being derived from. The members
    of the base class are included in the derived type. A base class is also frequently
    called a superclass or parent class. A class can be a base class, and a derived
    class simultaneously. See also inheritance, derived and sealed class. (Chapter
    21.)


    # Base Class Library


    The central library of code that contains all C# programs will utilize, the built-in
    types, arrays, exceptions, and file I/O. (Chapter 40.)


    # BCL


    See Base Class Library.


    # Binary Code


    The executable instructions that work to do things. All programs are built out
    of binary code. (Chapters 1 and 40.)


    # Binary Instructions


    See Binary Code.


    # Binary Operator


    An operator that operates on two operands. Many of the most common operators are
    binary, such as addition and subtraction. (Chapter 7.)


    # Field


    The process of storing a collection of logic values in another type (such as int
    or byte) where each bit represents a single value. Enumerations can also be used
    as a bit field by applying the Flags attribute. When working with a bit field,
    bitwise operators can be used to modify the individual values contained in the
    bit field. (Chapter 39.)


    # Bitwise Operator


    One of several operators operate on the bits of a value, as opposed to treating
    the bits as a single value with semantic meaning. Bitwise operators perform logical
    operations and, or, not, xor (exclusive) on two bits in the same location of different
    values. It also includes bit shifts, which shift the bits of a value to the left
    or right. In C#, the extra bits are filled with 0. (Chapter 39.)


    # Boolean


    Pertaining to values. In programming, Boolean can only take the value of true
    or false. Boolean are a fundamental type of decision making in programming. (Chapter
    6.)


    # Built-In Type


    One of handful that the C# compiler knows about, and provides shortcuts for working
    with them. These types have their own keywords, as int int, string, or bool. (Chapter
    6.)


    # Breakpoint


    While debugging, a line of code may be marked with a breakpoint, and when the
    program reaches that point, the program will pause and switch to the Visual Studio
    debugger, allowing you to take a look at the current state of the program. (Chapter
    44.)'
