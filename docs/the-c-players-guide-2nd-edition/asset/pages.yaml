    and let you explore it in depth if you feel the need.


    There is a lot of stuff in this chapter and I don''t expect you to become a master
    of it all overnight. Some of these topics are so big that you could write books
    about them. Many of these topics will apply to some people, but not everyone.


    There are two real purposes to this chapter. One is to open your eyes to the possibilities
