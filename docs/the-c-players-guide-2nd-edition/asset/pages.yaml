  md: "# 196 Chapter 29 Error Handling and Exceptions\n\nThis will look something\
    \ like this:\n\n```\n// For all of you on the other side of the pond, if it makes\
    \ you feel any better,\n// can still call them \"beef burgers\";\npublic class\
    \ AteTooManyHamburgersException : Exception\n{\n    public int AteTooManyHamburgersEaten\
    \ { get; set; }\n\n    public AteTooManyHamburgersException(int hamburgersEaten)\n\
    \    {\n        HamburgersEaten = hamburgersEaten;\n    }\nn}\n```\n\nWith this\
    \ class, you can now say:\n\n```\nthrow new AteTooManyHamburgersException(125);\n\
    ```\n\nAnd:\n\n```\ntry {\n    EatSomeHamburgers(32);\n} catch(AteTooManyHamburgersException\
    \ e) {\n    Console.WriteLine($\"{e.HamburgersEaten} is too many hamburgers.\"\
    );\n}\n```\n\nAs a general rule, throw different exception types whenever the\
    \ calling code would want to handle the error in different ways. If your method\
    \ could fail in two ways, you would be throwing two different exception types.\
    \ This allows people to use catch blocks to handle them differently. If there's\
    \ no good pre-made exception type for you to use, make your own.\n\nI bring this\
    \ up because it is easy to get lazy and always throwing the plain old Exception\
    \ type. Don't get lazy; use the right exception types, even if that means creating\
    \ your own.\n\n# The ‘finally’ Keyword\n\nRemember that when you throw an exception,\
    \ the flow of execution stops going through the method immediately! What if you\
    \ had done something like opened a file? If everything went according to plan,\
    \ you would have been able to close the file in an intelligent way, but since\
    \ a problem came up, and an exception is thrown, that wouldn't ever be executed,\
    \ leaving our file open. The finally block allows us to address this problem.\n\
    \nAt the end of a try-catch, add a finally block (making it a try-catch-finally\
    \ block). The code inside the finally section will get executed no matter what.\
    \ If it ran through the try block without errors, or it ran into a return statement,\
    \ it will get executed. If there was an exception, it will get executed (just\
    \ before jumping up to the calling method with the exception).\n\nHere's an example\
    \ of how this works:\n\n```\ntry {\n    // Do some stuff that might throw an exception\
    \ here\n} catch (Exception)\n```"
