  md: "# 154 Chapter 22 Polymorphism, Virtual Methods, Abstract Classes\n\nWhile most\
    \ of the time, you can directly access things in the base class without actually\
    \ needing to use the base keyword, when you override a method, you will be able\
    \ to use the base keyword to still get access to the original implementation of\
    \ the method.\n\nThis is convenient for the cases in which you want to override\
    \ a method by doing everything old method did, and then doing a little more. This\
    \ could work like this:\n\n```\npublic override string[] Search(string findThis)\n\
    {\n  // Calls the version in the base class.\n  string[] originalResults = base.Search(findThis);\n\
    \n  if(originalResults.Length == 0)\n    Console.WriteLine(\"There are no results.\"\
    );\n\n  return originalResults;\n}\n```\n\n# Abstract Base Classes\n\nLet's go\
    \ back to our SearchEngine example. The SearchEngine class indicates that any\
    \ and every SearchEngine type object has the ability to search. But looking back\
    \ at our code, the base SearchEngine class didn't do any intelligent thing. We\
    \ provided a dummy implementation that does nothing besides wasting time useless\
    \ code.\n\nIn cases like this, instead of using a dummy implementation, we have\
    \ an option to provide no implementation whatsoever. With no implementation or\
    \ body for the method, the method in question becomes abstract.\n\nTo accomplish\
    \ this in code, we need to add the keyword abstract to our class, as well as to\
    \ any methods that we want to keep unimplemented in the base class:\n\n```\npublic\
    \ abstract class SearchEngine\n{\n  public abstract string[] Search(string findThis);\n\
    }\n```\n\nWhen a class is abstract, it is allowed to include abstract methods.\
    \ Abstract methods cannot go inside regular, non-abstract classes. When a class\
    \ is marked abstract, you can't create any instances of that class directly. Instead,\
    \ you need to create an instance of a derived class that isn't abstract.\n\nWith\
    \ the code above, you won't be able to actually create an instance of SearchEngine.\
    \ Instead, you'd need to create an instance of one of the derived classes, GoogleSearch\
    \ or RBSearchEngine.\n\nIn the code above, you can also see that the method is\
    \ marked with abstract as well. In this case, the method doesn't need a body,\
    \ and isn't even allowed to have one. Instead of providing an implementation in\
    \ curly braces below it, simply put a semicolon at the end of the line.\n\nAbstract\
    \ classes can also have as many virtual or normal methods as you want.\n\nIn a\
    \ derived class, to provide an implementation for an abstract method, you must\
    \ use the override keyword in the exact same way as we did with virtual methods."
