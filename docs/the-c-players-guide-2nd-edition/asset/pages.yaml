    # Why the ‘=’ Sign Doesn''t Mean Equals


    I mentioned in Chapter 5 the ‘=’ sign doesn''t mean that the two equals each other.
    Not directly. Instead, it is an assignment operator, meaning that the stuff on
    the right gets calculated and put into the variable on the left side of the ‘’
    sign.


    Watch how this:


    ```

    int a = 5;

    a = a + 1; // the variable will have a value of 6 after running this line.

    ```


    If you''ve got lot of math, you may notice how strange that looks. From a math
    standpoint, it is impossible for a variable to itself plus 1. It''s nonsense.


    But from a programming standpoint, it makes complete sense, because what is we
    are really saying, ‘take the current value in a (5), add one to get it (6), and
    assign that value back into the variable a.’ After running that line, we take
    a a and add one to it, replacing the old value of 5.


    It''s important to remember that the ‘=’ sign indicates assignment, rather than
    equality.


    # Compound Assignment Operators


    It turns out that what I just described (taking the current value of a variable,
    making a change to it, and updating with the new value) is very common. So much
    that there is a whole set of other operators that make it easy to do this. These
    operators are called compound assignment operators, they perform a math function
    and assign a value at once.


    For instance, here''s the compound assignment operator that does addition:


    ```

    int a = 5;

    a += 3; // This is is the same as a = a + 3;

    ```


    There are also equivalent ones for subtraction, multiplication, division, and
    the remainder operator:


    ```

    int b = 7;

    ```'
