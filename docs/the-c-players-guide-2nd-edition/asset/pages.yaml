    \ is 0-based. If you forget about 0-based indexing, and start with 1, you'll run\
    \ into what are called \"off-by-one\" errors, because you're on the wrong number.\n\
    \nYou can access any value in an array using the same technique:\n\n```\nint fourthScore\
    \ = scores[3];\n eighthScore = scores[7];\n```\n\nIf you try to access something\
    \ beyond the end of the array (for example, scores[54]) in an array with only\
    \ 10 items in it), your program will crash, telling you the index was out of the\
    \ bounds of the array.\n\n> Side Note\n-based Indexing. I know it seems kind strange\
    \ if you're new to programming, but there's a very good reason for 0-based indexing.\
    \ The array itself has a specific spot in memory—a specific memory address. This\
    \ address is called the base address.\n\nFor any particular array, the size of\
    \ each slot in the array may be a different size than the size of the type you're\
    \ putting into the array. An array of ints will have slots that are 4 bytes, since\
    \ ints are 4 bytes.\n\nBecause the computer knows the base memory address, and\
    \ how big each slot is, it is easy to calculate the memory location of any particular\
    \ index in the array using the simple formula:\n\n```\naddress = base + index\
    \ × size\n```\n\nIf we didn't use 0-based indexing (perhaps 1-based indexing instead)\
    \ the math would become more complicated.\n\n# More Ways to Create Arrays\n\n\
    There are a couple of other ways of initializing an array that are worth discussing\
    \ here. You can also create an array by giving it specific values right from the\
    \ get-go, by putting the values you want inside curly braces, separated by commas:\n\
    \n```\nint[] scores = new int[10] { 100, 95, 92, 87, 55, 50, 48, 40, 35, 10 };\n\
    ```\n\nWhen you create an array this way, you don't even need to specify the number\
