  md: "# Overloading Operators 215\n\noverloaded. The creators of C# tried to allow\
    \ overload as many as possible, but there are some that would be too dangerous\
    \ to overload.\n\nThe operators can be overloaded: +, *, %, %, ==, !=, >, >=,\
    \ and <. Additionally, the operators +=; -=; *= and %= are not technically overloadable,\
    \ but when we overload the + operator, the *= operator is automatically overloaded\
    \ for us, and so on.\nOh, and it is also worth pointing out that the relational\
    \ operators must be overloaded in pairs—if you overload the == operator, you must\
    \ also overload the != operator, and if you overload the > operator, you must\
    \ also overload the < operator as well, and so on.\nOn the other hand, the following\
    \ operators cannot be overloaded: the logical operators && ||, the assignment\
    \ operator =, and the new operator. Being able to overload these operators would\
    \ be too dangerous and confusing to anyone trying to use them. Take the assignment\
    \ operator =, for example. If we use it for like int x = 3. If you could make\
    \ it something else besides putting the value of x, it could cause some serious\
    \ issues.\nNote that the array indexing operator ([]) can be overloaded, but it\
    \ is done using indexers, which we'll look at in the next chapter.\nYou cannot\
    \ create new operators using operator overloading.\n\n# Overloading Operators\n\
    \nYou can overload operators for any of your own types, but for the sake of simplicity,\
    \ I'm going to pick a class that should make some sense for overloading operators.\
    \ For a Vector class, which stores an x and y coordinate. If you are fuzzy on\
    \ the concept, you can think of a vector as a point (in this case, a 2D point).\n\
    Let's start with the basic class as a starting point:\n\n```\nusing System;\n\
    using System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\nusing\
    \ System.Threading.Tasks;\n\nnamespace OperatorOverloading\n{\n    public class\
    \ Vector\n    {\n        public double X { get; set; }\n        public double\
    \ Y { get; set; }\n\n        public Vector(double x, double y)\n        {\n  \
    \          X = x;\n            Y = y;\n        }\n    }\n}\n```\n\nLet's say you\
    \ want to add two vectors together. In math and physics, when we add two vectors,\
    \ the result is another vector, but with the x and y components added together.\
    \ For example, if you add the vector (2, 3) to the vector (4, 1), you get (6,\
    \ 4), because we add the 2 + 4 is 6, and 3 + 1 is 4."
  merge: -1
  pgno: 237
