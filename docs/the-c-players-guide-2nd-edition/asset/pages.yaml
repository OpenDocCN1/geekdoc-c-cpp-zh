  md: "```\npublic int CalculateMinutes()\n{\n    return seconds / 60;\n}\nclass TimeClass\n\
    {\n    private int seconds;\n\n    public int Seconds\n    {\n        get { return\
    \ seconds; }\n        set { seconds = value; }\n    }\n\n    public int CalculateMinutes()\n\
    {\n        return seconds / 60;\n    }\n}\n```\n\nYou can see that the two are\
    \ very similar—in fact the code is used in both, with the solitary difference\
    \ being we use the struct keyword to create a struct, while we use the class keyword\
    \ to create a class.\n\n# Structs vs. Classes\n\nSince the two are so similar\
    \ in appearance, you're probably wondering how the two are different.\n\nThe answer\
    \ to this question is: structs are value types, while classes are reference types.\
    \ If you didn't fully grasp that concept back when we discussed it in Chapter\
    \ 16, it is probably worth going back and taking a second look.\n\nWhile this\
    \ is a single difference in theory, this change makes a world of difference. For\
    \ example, a struct uses value semantics instead of reference semantics. When\
    \ you assign the value of a struct from one variable to another, the entire struct\
    \ is copied. This still applies for passing one to two as a method, and returning\
    \ from one method.\n\nLet's try using the struct version of the TimeStruct we\
    \ just saw, and did this:\n\n```\npublic static void Main(string[] args)\n{\n\
    \    TimeStruct time = new TimeStruct();\n    time.Seconds = 10;\n\n    UpdateTime(time);\n\
    }\n\npublic static void UpdateTime(TimeStruct time)\n{\n    time.Seconds++;\n\
    }\n```"
