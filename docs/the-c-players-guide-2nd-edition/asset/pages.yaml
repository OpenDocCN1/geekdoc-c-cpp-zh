  md: '# 124 Chapter 18 Making Your Own Classes


    +   - Method Scope: Accessible through the method.

    - Block Scope: Accessible through only a particular block (like a for loop).


    # Name Hiding


    One interesting that you can do in C# is name a parameter or local variable (which
    has method scope or block scope) the exact same thing as something that has class
    scope. While making our class, remember that we make an instance variable called
    title, which has class scope, and is accessible throughout the class. Then, in
    our constructor, we had a parameter that is also called title, which has method
    scope and is only accessible to the method/constructor.


    This leads to a method-scoped name hiding. When we have a class-scoped instance
    variable called title, but we also have member inside this constructor (or method),
    which of the two is it referring to? The one with the smaller scope—in this case,
    the parameter, which has method scope.


    So we create a situation where one variable "hides" another variable, because
    they have the same name. That''s all fine and good, but what if we want to access
    the one in the larger scope? The instance variable?


    Well, there are few ways to address this. One is just to call the two variables
    different names, so there''s no hiding going on. For instance, we could have called
    the variable bookTitle of title. It is a bit of a hassle to think of similar or
    using different names for variables that store the same information, but at different
    levels.


    A second approach is to name all of your instance variables in a specific way,
    so that you know what you''re referring to, while still being consistent. For
    instance, start all of your instance variables with m_ (The ''m'' is for "member")
    here. Your instance variables would be m_author, m_pages, and m_count. If you
    do this, you will successfully avoid name hiding and it is systematic, you''ll
    always know where they belong.


    Let me clear on this: the m_ approach is fairly common, and a lot of people use
    it. But it has a few disadvantages that drive me away from it. Most importantly,
    it keeps readability. One of the biggest challenges with programming is that it
    is much easier to write code than it is to read. When you use all of these m_s
    floating around you have to manually remove it to know what the variables does.
    And if you''re ever reading the code out (discussing this with another programmer)
    you always have to say "em underscore title when you''re referring to m_title.
    But like I said, this is fairly common, and if that''s what you like, for go.


    There''s a third approach that I, personally, prefer. This is the way that I''ll
    be doing things throughout this book. This third approach is to name the instance
    variable and the local variable or parameter the same thing, allow name hiding,
    and use this keyword when you want to refer to the instance variable if there
    happens to be a name collision. This brings us to...


    # The ''this'' Keyword


    Any time you are inside of a class, you can get access to all of the class''s
    members, including methods and instance variables, by using this keyword. This
    is a reference to the current object that you are inside of. So coming back to
    the Book example, anywhere throughout the class, including the constructor that
    we added, you can say this.author to get to the author instance variable. This
    also works with methods, so you can call another method that belongs to the class
    by using this.MethodName():'
