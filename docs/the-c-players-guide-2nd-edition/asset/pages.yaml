    # Pig Dice


    In the game of Pig Dice, players take rolling two six-sided dice. On a player''s
    turn, they can roll the dice repeatedly until they choose to stop (hold) or roll
    a 1. As long as the player keeps rolling without getting a 1 on either die, the
    numbers on the dice are added to the player''s score. At any point, a player can
    hold, which takes their turn score and permanently adds to their overall score.
    If they roll a 1 on either die, they lose all the numbers they had in their turn
    score, nothing extra is added to their overall score, and it becomes the next
    player''s turn. When a player''s overall reaches 100, the game ends, and they
    have won.


