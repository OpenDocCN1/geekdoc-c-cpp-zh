  md: "# More Complicated with Clauses\n\nLet's look at this in a little detail. The\
    \ formatting of this, with **from**, **where**, and **select** starting on a new\
    \ line, is the most common way of writing this. It helps to keep the different\
    \ parts separated, and I'd recommend following it.\n\nThe **from** part sets up\
    \ where we're getting data from. In this case, the `allPeople` list. We also give\
    \ a name to any particular item in the list (**person**, in which case we'll be\
    \ able to use throughout the rest of the query.\n\nThe **where** part does our\
    \ filtering. Here, we're grabbing anyone with an age of 18 or higher.\n\nThe last\
    \ part, with the **select** keyword, indicates what to choose as part of the results.\
    \ In this case, the whole `Person` object.\n\nThis could have been done procedurally,\
    \ with a loop and an **if**. It would look like this:\n\n```\nList<Person> adults\
    \ = new List<Person>();\nforeach (Person person in allPeople)\n{\n    if (person.Age\
    \ >= 18)\n        adults.Add(person);\n}\n```\n\nBut even this simple example\
    \ is easier to understand with the query expression, and as we get more complicated,\
    \ the procedural loop and **if** statements get harder to read faster than the\
