  md: '# 108 Chapter 16 Value and Reference Types


    ```

    int[] a = new int[] { 1, 2, 3 };

    int[] b = a;

    b[0] = 17;

    Console.WriteLine(a[0]); // This will print out 17.

    ```


    When we create an array, the contents of the array are placed in the heap. While
    a array may be stored on the stack, it will contain a reference to the array out
    in the heap. When we assign the value of a to the variable b, we read the value
    of a variable, which is a reference, and copy it in the b variable. But copying
    a reference gives b a reference to the same object on the heap. At this point,
    both of our variables are referencing the same array in the heap. We then modify
    that going through the b variable, but since the two things are referencing the
    same thing on the heap, a has been modified as well.


    ![](img/ad92120e75cb88980f77f3297768b8f0_130_0.png)


    This same thing happens when you send things to methods as parameters. For value
    types, the value is copied over to the parameter. The copy that method ends up
    is completely different, and in the method, changing the variable won''t affect
    the original, back in the calling method.


    With reference types, while you''re still technically passing a copy of the variable''s
    contents, it is a copy of a reference, so inside of the method the parameter is
    still referencing the same thing on the heap. Making changes to it inside of the
    method affects the thing back in the calling method.


    This is often done intentionally, handing an array or other reference type to
    a method with the specific task of modifying it in some way. But of course, if
    you hand a reference type to a method, expecting it to remain unchanged, and the
    method makes changes, you''ll be in a surprise.


    This can be a useful thing or a liability, but it is a fact. You have to understand
    the differences between value types and reference types, or it will come back
    to haunt you repeatedly. Surprisingly, there are a lot of talented programmers
    who claim to know C# that haven''t figured out heap stack and value vs. reference
    type stuff yet. If you don''t understand these differences, you will be constantly
    running into strange problems that just don''t seem to make sense.'
