  md: '# Other Features in C#


    In a Nutshell


    +   * This chapter covers a large collection of random advanced topics. The purpose
    of this chapter is to ensure that you know them exist.

    * **yield return** produces an enumerator without creating a container like a
    **List.**

    * **const and **readonly** define compile-time and runtime constants that can''t
    be changed.

    * The **unsafe** keyword lets you work with pointers and operate with non-.NET
    code.

    * Attributes let you apply metadata to types and members.

    * The **nameof** operator gets a string representation of a type or member.

    * The bit shift operators let you play around with individual bits in the data.

    * Reflection allows you to write custom code while your program is running.

    * **IDisposable** lets you run custom logic on an object before being garbage
    collected.

    * **C** defines a variety of preprocessor directives to give instructions to the
    compiler.

    * **C** can automatically deduce the type of local variables `var x = 1;`

    * Nullable types allow value types to take on a value of **null**.

    * You can read in command line arguments from the command prompt.

    * You may make your own user-defined conversions between types.


    In this chapter, we''re going to cruise through a variety of features and tricks
    that we haven''t talked about. Some of these are very useful but aren''t enough
