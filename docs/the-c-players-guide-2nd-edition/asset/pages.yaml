  md: "# 216 Chapter 32 Operator Overloading\n\nTo overload the '+' operator, we simply\
    \ add in the following code as a member of the Vector class:\n\n```\npublic static\
    \ Vector operator+(Vector v1, Vector v2)\n{\n    return new Vector(v1.X + v2.X,\
    \ v1.Y + v2.Y);\n}\n```\n\nSo now your Vector class might look something like\
    \ this at this points:\n\n```\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\n\nnamespace\
    \ OperatorOverloading\n{\n    public class Vector\n    {\n        public double\
    \ X { get; set; }\n        public double Y { get; set; }\n\n        public Vector(double\
    \ x, double y)\n        {\n            X = x;\n            Y = y;\n        }\n\
    \n        public static Vector operator+(Vector v1, Vector v2)\n        {\n  \
    \          return new Vector(v1.X + v2.X, v1.Y + v2.Y);\n        }\n    }\n}\n\
    ```\n\nAll operator overloads must be public and static. This should make sense,\
    \ since we want to have access to the operator throughout the program, and it\
    \ belongs to the type as a whole, rather than a specific instance of. We then\
    \ specify a return type, Vector in this case. We use the operator keyword, along\
    \ with the operator that we are overloading. We have two parameters, which are\
    \ the two of a + operator.\n\nFor a unary operator like - (the negation operator\
    \ or negative sign) we only have one parameter:\n\n```\npublic static Vector operator-(Vector\
    \ v)\n{\n    return new Vector(-v.X, -v.Y);\n}\n```\n\nNotice, that we can have\
    \ multiple overloads of the same operator:\n\n```\npublic static Vector operator+(Vector\
    \ v, double scalar)\n{\n    return new Vector(v.X + scalar, v.Y + scalar);\n}\n\
    ```\n\nNow you can add a vector and a scalar (just a plain old number). Though\
    \ from a math standpoint, this doesn't make any sense.\n\nThe relational operators\
    \ can be overloaded in the exact same way, only they must return a bool:"
