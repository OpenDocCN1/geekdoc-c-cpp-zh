    # Interfaces


    +   In a Nutshell

    * Interfaces define the things that something makes available to the outside world.

    * Interfaces in C# define a set of methods, properties, events, and indexers that
    any class that uses the interface are required to provide.

    * Interfaces are built in way that looks like classes or structs: **public interface
    InterfaceName {/* Define members in here. */ }

    * Members of an interface are implicitly **public** and **abstract**, and are
    required to be so.

    * A class indicates that it implements an interface in the same way it shows it
    has a base class: `public AwesomeClass : InterfaceName /* Implementation Here
    */`n* You can implement multiple interfaces at the same time. You can also implement
    interfaces and declare a class at the same time.


    In this chapter, we''ll cover a feature of C# called an interface, which outlines
    things that something provides. Interfaces are a fairly straightforward concept
    compared to some of the things we''ve been looking in the last few chapters. We''ll
    outline what an interface does, how to create one, and how to set up a class or
    use one.


    # What is an Interface?


    At a conceptual level, an interface is basically just the boundary it shares with
    the outside world. Your TV, for instance, probably has several buttons on it (and
    if it is really old, maybe even a dial or two). Each of these things allows the
    outside world to interact with it. That''s its interface.


    Interfaces are everywhere in the real world. They point out to users of the object
    how it can be controlled or provides feedback on its current status. A few examples
    are in order here.


    Cars (all vehicles in general) have a specific interface that they present to
    their users (the driver). While there are some nuances and details that we''ll
    skip over, the key components are a steering'
  merge: -1
  pgno: 178
- img_proc: true
  md: '# Creating an interface 157


    wheel, a gas pedal, and a brake pedal. A car will also provide certain bits of
    feedback to the driver on the dashboard, including the vehicle''s ground and speed,
    as well as its fuel level.


    Likewise, the keys on a piano are an interface that pianist can access to make
    music. While pianos come in different forms (grand pianos, upright pianos, player
    pianos, electronic keyboards, etc.) they present a similar interface to the user
    of the system.


    Let''s take a moment and pick out a few key principles that apply to interfaces
    in the real world, like the car and keyboard interfaces. We''ll see on that C#
    interfaces provide these key principles.


    +   1. Interfaces define how outside users request to the system. By rotating
    the wheel on a car controls, we''re making a request to turn the vehicle to the
    right. By pressing Middle C key on the piano''s keyboard, we''re asking the piano
    to make a sound at a particular pitch.

    2. Interfaces define the ways in which feedback is presented to the user.


    This interface defines how other objects can interact with the car, without preserving
    the details of how it works behind the scenes. For example, in old cars, this
    was all done in a purely mechanical way. Newer cars have things like power steering,
    and perform some of their feedback to the user digitally. And consider an electric
    car, which has a "gas (acceleration) pedal but drives the vehicle using an electric
    motor instead of a gas motor.


    You can go to an amusement park and find bumper cars and speedway/race type that
    use an identical interface to control vehicles. One of the things about this shared
    interface is that soon as you understand how to use one object through the interface,
    you generally understand how to use all objects that share the same interface.


    Interfaces work both ways. When someone presenting a particular interface to the
    user, the user assumes that it''s capable of doing the things the interface promises.
    When you''ve got a brake pedal in a car, you assume it will let stop the vehicle
    quickly. When the brake pedal doesn''t fulfill the promised interface, bad things
    happen. It''s why it is frustrating when an elevator has a "Close Door" button,
    that doesn''t actually close the door. The elevator presents an interface that
    promises the ability to close the door, but fails to do so.


    The broader lesson is that interface defines a specific set of functionality.
    Users of the interface know what to expect of the object from the interface, without
    knowing the details of how the object actually makes, and in fact, as the interface
    remains intact, the details on the inside could be swapped out and the user wouldn''t
    have to change anything.


    C# has a construct called interface that fills the same role as these interfaces
    in the real world : listing a members (specifically methods, properties, events
    (Chapter 31) and indexers (Chapter 33)) that any type claiming to have the interface
    must provide.


    # Creating an Interface


    Creating an interface is actually very similar to creating a class or struct.
    As an example, let''s say our program has a need to write out files (see Chapter
    28) but you also want to write to lots of different file formats. We can create
    a different class to handle the nuances of each file type. But they are all going
    to be used in the same way as far as the calling is concerned. They all have the
    same interface.'
