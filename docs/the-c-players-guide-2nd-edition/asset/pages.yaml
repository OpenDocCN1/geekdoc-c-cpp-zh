  md: "# 228 Chapter 35 Lambda Expressions\n\nLet's say that somewhere in your code,\
    \ you want to filter out some of them. Perhaps you want only even numbers. How\
    \ do you do that?\n\n# The Basic Approach\n\nKnowing what we learned back in some\
    \ of the earlier chapters about methods and looping, perhaps we could create something\
    \ like this:\n\n```\npublic static List<int> FindEvenNumbers(List<int> numbers)\n\
    {\nList<int> onlyEvens = new List<int>();\nforeach(int number in numbers)\n{\n\
    if (number % 2 == 0) // checks if it is even using mod operator\n    onlyEvens.Add(number);\n\
    }\nreturn onlyEvens;\n}\n```\n\nWe could then call that method, and get back our\
    \ list of even numbers. But that's a lot of work for a simple method that might\
    \ only be used once.\n\n# The Delegate Approach\n\nFast forward to Chapter30,\
    \ where we learned about delegates. For this particular task, delegates will actually\
    \ be able to go a long way helping us.\n\nAs it so happens, there's a method Where\
    \ that is a part of a List class (actually, it is an extension method) that uses\
    \ a delegate. Using the Where method looks like:\n\n```\nIEnumerable<int> evenNumbers\
    \ = numbers.Where(WhereMatchingFuncDelegate);\n```\n\nThe delegate that the Where\
    \ method uses is generic, in this specific case, it must return the type bool,\
    \ and has a single parameter that is the same type as the List contains (int in\
    \ this example). Where goes through each element in the array and calls the delegate\
    \ for each item. If the delegate returns true for the item, it is included in\
    \ the results, otherwise it is not.\n\nLet me show what I mean with an example.\
    \ Instead of our first approach, we could write a simple method that determines\
    \ if a number is even or not:\n\n```\npublic static bool IsEven(int number)\n\
    {\nreturn (number % 2 == 0);\n}\n```\n\nThis matches the requirements of the delegate\
    \ Where method uses in this case (returns bool, with exactly one parameter of\
    \ type int).\n\n```\nIEnumerable<int> evenNumbers = numbers.Where(IsEven);\n```\n\
    \nThat's pretty readable and fairly easy to understand, as long as you know how\
    \ delegates work. But let's take another look at this.\n\n# Anonymous Methods\n\
    \nWhile we've done the delegate approach is a big improvement over crafting our\
    \ own method to do all of the work, it has two small problems. First, a lot of\
    \ times that we do something"
