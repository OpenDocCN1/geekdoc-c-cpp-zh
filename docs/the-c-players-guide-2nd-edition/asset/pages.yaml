  md: '# 22 Chapter 4 Comments


    The third method for creating comments is called XML Documentation Comments, which
    we''ll discuss later, because they''re used for things that we haven''t discussed
    yet. For more information about XML Documentation Comments, see Chapter 15.


    # How to Make Good Comments


    Commenting your code is easy; good comments is a little trickier. I want to take
    some time and describe some basic principles to help you make comments that will
    be more effective.


    My first rule for making good comments is to write the comments for a particular
    chunk of code as you''ve got the piece more or less. A few days or a weekend away
    from the code and you may no longer remember what you were doing with it. (Trust
    me, it happens!)


    Second, add comments to the code. Here''s an example of a bad comment:


    The code already says all of that. You might well not even add it. Here''s a better
    version:


    ```

    // Printing "Hello World" is a common first program to make.

    Console.WriteLine("Hello World");

    ```


    This explains why we did this instead of something.


    Third, you don''t need a comment for every single line of code, but it is helpful
    to have one for every section of related code. It''s possible to have too many
    comments, but the dangers of overcommenting code waste a lot less than the dangers
    of under-commented (or completely uncommented code).


    When you write comments, take the time in putting anything that you or another
    programmer may want to know if they come back and look at the code. This might
    include a human-readable description of what is happening, it may include describing
    the general method (or algorithm) you''re using to accomplish a particular task,
    and it may explain why you''re doing something. You may also find times where
    it would be useful to know why you aren''t using a different approach, or to warn
    another programmer (or yourself) that a particular chunk of code is tricky, and
    you shouldn''t mess with unless unless really know what you''re doing.


    Having said all of this, don''t take it to extreme. Good comments don''t make
    for sloppy, ugly, or hard to read code. Meanwhile, clean, understandable code
    reduces the time you need comments at all. (The code is the authority on what''s
    happening, not the comments, after all.) Make the code readable as possible first,
    then just add enough comments to fill the gaps and make the bigger picture.


    When used appropriately, comments can be a programmer''s best friend.


    > Try It Out!

    Comment ALL the things! While it''s overkill, in the name of putting together
    everything we''ve learned so far, go back to your Hello World program from the
    last chapter and add in comments for each part of the code, describing what each
    piece is. This will be a good review of the pieces of that simple program, as
    well as give you a chance to play around with some comments. Try out both ways
    of making comments (// and /* *) to see what you like.'
