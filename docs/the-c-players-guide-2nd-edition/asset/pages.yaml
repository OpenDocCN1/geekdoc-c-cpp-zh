    # # Polymorphism,

    Virtual Methods, and

    Abstract Classes


    **In a Nutshell**


    +   - Polymorphism means that you can create derived classes that implement the
    same method in different ways from each other. This allows different classes to
    do the same task in their own custom way.

    - A method in a base class can be marked **virtual**, allowing derived classes
    to use the *override* keyword and provide an alternative implementation.

    - Classes can be marked as **abstract**, making it so you can''t actually create
    an instance of the class. You have to create an instance of a derived class instead.

    - In an abstract class, you can mark methods as abstract as well, and then leave
    out the method implementation. Derived classes will need to provide an implementation
    for any abstract methods.

    - The **new** keyword, when attached to a method, means that a new method is created,
    unrelated to any methods in the base class with the same name, resulting in two
    methods with the same name, with one in the base class being hidden.


    In the last chapter, we talked about how it is possible to create a class that
    is based on another, adding more stuff to it. It turns out inheritance lets us
    do a lot more than just add new things to an existing class. In this chapter,
    we''ll look at how a derived class can provide its own implementation of a method
    that was defined in the base class, allowing it to handle the same task in its
    own way.'
