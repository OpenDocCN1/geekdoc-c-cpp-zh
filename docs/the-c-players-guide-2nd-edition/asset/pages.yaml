  md: "# Chapter 19 Properties\n\n```\npublic int Score\n{\n    get{\n        return\
    \ score;\n    }\n    set{\n        score = value;\n        if (score < 0)\n  \
    \          score = 0;\n    }\n}\n```\n\nThis creates a Score property. We can\
    \ see that it is public, so anyone can use it (though we could also use private\
    \ if we had wanted). We also specify the type of the property, in which this case\
    \ is an int. Then we give it a name.\n\nWe then use the get and set keywords to\
    \ show what should happen when someone tries to read the value of a property or\
    \ set the value of the property. The code inside the curly braces is nearly the\
    \ same that we have in the GetScore() and SetScore(int) methods.\n\nWith a normal\
    \ method (like SetScore) we would be able to list parameters for the method to\
    \ use. In a property we can't list parameters. Instead, we're given exactly one,\
    \ which we can access with the keyword value. This takes on value the caller is\
    \ trying to set. The type of value is the same as the type. We can call our property\
    \ using something like this:\n\n```\nPlayer player = new Player();\nint playerScore\
    \ = player.Score;\nplayer.Score = 50;\n```\n\nWhen we read from the Score property,\
    \ the code inside of the property's get block is executed and returned. When we\
    \ assign a value to the Score property, the code inside of the set block gets\
    \ executed. In this case, the value 50 gets into the value keyword inside of the\
    \ set block.\n\nProperties allow us to get and set the value of instance variables,\
    \ including doing extra work to validate what the user is trying to set, without\
    \ making our code harder to read.\n\nIt is worth mentioning that properties are\
    \ just syntactic sugar. Behind the scenes, the C# compiler is turning these back\
    \ into normal method calls. But since it is all happening behind the scenes, we\
    \ don't really care about that. We just care that it makes our code cleaner.\n\
    \nWhenever we have a property that gets or sets the value of a specific instance\
    \ variable, instance variable is called a backing field of the property. In our\
    \ example, the Score property uses the score instance as its backing field.\n\n\
    Properties are not required to have a backing field. Let's look at another example\
    \ where a property does not have a backing field:\n\n```\nusing System;\nusing\
    \ System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\n\
    \nnamespace Properties\n```"
