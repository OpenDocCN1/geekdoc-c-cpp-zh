    \ score = scores[index];\n  Console.WriteLine(\"Score # \" + index + \": \" +\
    \ score);\n```\n\nCompared to a for loop, a foreach loop has a tendency to be\
    \ more readable. There is not as much overhead clause inside the parentheses.\
    \ Also, in many cases the first thing you do in many for loops is use the index\
    \ to get the correct item out of the array. This is bypassed with a foreach loop.\n\
    \nBut foreach loops are somewhat slower, simply as a result of their internal\
    \ mechanics. If you're discovering that a particular foreach loop is taking more\
