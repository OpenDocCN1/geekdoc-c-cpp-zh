  md: "![](img/ad92120e75cb88980f77f3297768b8f0_160_0.png)\n\n# # Structs\n\nIn a\
    \ Nutshell\n\n+   - A struct or structure is similar to a class in terms of the\
    \ way it is organized, but a struct is a value type, not a reference type.\n-\
    \ Structs should be used to store compound data (composed of more than one part)\
    \ that does not involve a lot of complicated methods and behaviors.\n- All of\
    \ the simple types are structs.\n- The primitive types are all aliases for certain\
    \ pre-defined structs and classes.\n\nA couple of chapters ago, we introduced\
    \ classes. These are complex reference types that you can define and build from\
    \ the ground up. C# has a feature call structs or structures which look very similar\
    \ to classes organizationally, but they are value types instead of reference types.\n\
    \nIn this chapter, we'll take a look at how to create a struct, as well as how\
    \ to decide if you need a struct or a class. We'll also discuss something that\
    \ may throw you out for a loop: all of the built-in types that we've been working\
    \ with since we first learned about types are actually all aliases for structures\
    \ (or a class in the case of the string type).\n\n# ## Creating a Struct\n\nCreating\
    \ a struct is very similar to creating a class. The following code defines a simple\
    \ struct, and an identical class that does the same thing:\n\n```\nstruct TimeStruct\n\
    {\n    private int seconds;\n\n    public int Seconds\n    {\n        get { return\
    \ seconds; }\n        set { seconds = value; }\n    }\n}\n```"
