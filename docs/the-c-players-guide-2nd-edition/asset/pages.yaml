  md: '# The Options Dialog


    Your code is typically organized into namespaces, which are usually placed in
    separate folders under your project, and each new type that you create is usually
    in its own .cs file.


    # The Properties Window


    You can right-click on any item in the Solution Explorer and choose Properties
    to view properties of that file, project, solution, etc. Doing so will open up
    the Properties window.


    The Properties window shows you various properties about what you have selected.
    As you select different things, the properties window will update to reflect the
    current selection.


    This window becomes even more useful as you start to build UI applications, you
    will be able to use a designer to lay out your user interface, and by selecting
    buttons, checkboxes, or other UI controls, you''ll be able to modify various properties
    and settings that those items have.


    ![](img/ad92120e75cb88980f77f3297768b8f0_309_0.png)


    # The Error List


    The Error List shows you the problems that occurred when you compiled your program,
    it is easy to track down the problems and fix them.


    ![](img/ad92120e75cb88980f77f3297768b8f0_309_1.png)


    You can double click on any item in the list, and the Code Window will open up
    to the place where the problem occurred in your code. You can hide all errors,
    warnings, or messages at the top by clicking on the appropriate button.


    # Other Windows


    Visual Studio has many other windows as well. To see what other views you can
    access, look for them under the View menu. The windows that are described above
    can be opened from here.


    # The Options Dialog


    Visual Studio has tons of settings that you can modify. There are far too many
    to cover here, other than a few of the most popular ones. To get to these, click
    on the menu, **Tools > Options**, which will bring up the Options Dialog. Like
    many other programs, these settings are organized into various pages, and the
    pages are organized by category in the tree on the left. Selecting different items
    in the tree will present different options to configure.'
