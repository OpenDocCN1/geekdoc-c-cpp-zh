  md: "# 280 Chapter 40 C# and the .NET Framework\nWith a Virtual Machine\n\n![](img/ad92120e75cb88980f77f3297768b8f0_302_0.png)\n\
    \nIf you want to add another language to the .NET Framework, you will need to\
    \ add another compiler. If you want to add another operating system or architecture,\
    \ all you need to do is add another CLR, custom made for the system you want to\
    \ run on.\n\n# The Common Language Runtime\n\nThe Common Language Runtime (CLR)\
    \ is the virtual machine that is used within the .NET Framework. The CLR is a\
    \ complicated piece of software, and we simply can't cover it all here, but we\
    \ outline the basics.\n\nThe basic process that the CLR follows is pretty simple.\
    \ When it is time to load an assembly, like an EXE or DLL, it figures out what\
    \ needs to run a method, if it has not been run before, the CLR will load the\
    \ IL code for that method and compile it to binary that the current physical computer\
    \ can execute. This is called Just-in-Time compiling, or Jit compiling. The next\
    \ time it runs, it sees that it was already compiled and just re-runs it. Jit\
    \ compiling only to happen for any given method.\n\n# Common Intermediate Language\n\
    \nBecause C# is targeting the CLR, rather than compiling to binary, the C# compiler\
    \ will turn your C# code into a special language that is designed for the CLR.\
    \ This language is called Common Intermediate Language (often abbreviated CIL\
    \ or IL). IL is very much like the assembly language I showed you. However, IL\
    \ is actually higher level than most assembly languages. You can think of IL as\
    \ an object-oriented version of assembly. IL is aware of things like exceptions\
    \ (Chapter 29), working with data types, and creating and initializing objects.\n\
    \nI think it's showing you what IL code looks like, so to start, look at the following\
    \ code:\n\n```\nstatic void Main(string[] args)\n{\n    int x = 2;\n    int y\
    \ = 2;\n    Console.WriteLine(x + y);\n}\n```\n\nThe above method gets into something\
    \ that looks like this in IL:"
