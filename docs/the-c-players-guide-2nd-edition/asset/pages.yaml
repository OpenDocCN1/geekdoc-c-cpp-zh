    \ searching for the feed of the Internet, and give you a list of anything that\
    \ could be useful.\n\nThis is an excellent example of something programmers polymorphism,\
    \ a Greek word meaning \"many forms.\" Polymorphism is a feature that allows derived\
    \ classes to override or change how the base class does things, and do them in\
    \ their own way. Alternatively, instead of changing how the base class does things,\
    \ the base class may not have a way to do things, forcing derived classes to find\
    \ their own way to do things. But when all is said and done, these derived classes\
    \ will have a different way of doing things from the base class and from each\
    \ other. The fact that these classes can do the same task (by calling the same\
    \ method) differently is what gives us \"many forms\" and polymorphism.\n\nIn\
    \ the last chapter, with our basic inheritance model, derived classes could add\
    \ only things to a type. With polymorphism, we can do more than just add stuff.\
    \ We can also alter how the derived class will handle the base class supplies.\n\
