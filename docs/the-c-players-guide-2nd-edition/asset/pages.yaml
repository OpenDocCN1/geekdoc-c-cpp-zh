  md: '# Versions of Visual Studio 7


    # Versions of Visual Studio


    There are three main flavors of Visual Studio 2015. Our first step will be to
    look at the differences among these, and I will point out that is most likely
    your best choice, getting started. (It''s free, dont worry!) I will tell you how
    to download Visual Studio and a little about the installation process. By the
    end of this chapter, you''ll be up and running, ready to start doing some C# programming!


    Visual Studio 2015 comes in three editions: Community, Professional, and Enterprise.
    I''m ultimately going to recommend the Community edition (it''s free, and it still
    allows you to make sell commercial applications with it) it is worthy considering
    the differences between the three.


    From a raw feature standpoint, Community and Professional are essentially the
    same thing. Enterprise comes with more added bonuses, but at a significantly higher
    cost. These extra features are generally non-code-related, but instead deal with
    the surrounding issues, like team collaboration, testing, performance analysis,
    etc. While, these extra features are probably not a great use of your money if
    you''re learning, unless you work for a company or attend school at a place that
    will pay for it.


    Microsoft will also push you heavily towards buying a subscription to the Microsoft
    Developer Network (MSDN) which gives you access to all of documentation and learning
    materials, as well as support. The reality is, between the free online documentation
    other web-based sources stackstackoverflow.com, plus the option of buying a book
    or two for special tactics, an MSDN subscription is usually not until you''re
    starting out.


    Now that I''ve pushed you away from Enterprise and MSDN as a beginner, the only
    remaining question is what to actually use. And to answer that, we need to compare
    the Community Edition to the Professional Edition.


    Community and Professional are essentially the same product with a different license.
    Microsoft wants to make Visual Studio available to everybody, but they still want
    to be able to bring in money for their efforts. With the current licensing model,
    they''ve managed to do that pretty well.


    While Professionals roughly $500 without an MSDN subscription, and about $1200
    with one, Community is free. But the license prevents certain people (the ones
    with money) from using it. While the following interpretation is not legally binding
    by any, the general interpretation of the Community license is essentially this:


    You can use to make software, both commercially and non-commercially, as long
    as you don''t fit in one of the categories:


    +   You have 5+ Visual Studio developers in your company. (If you''re getting
    it for home, you dont''t count the place you work for. You have 1 developer.)

    nYou have 250+ computers or users in your company.

    You have a gross income of $1,000,000.


    If any of the above apply, you don''t qualify for the Community license, and you
    must buy Professional. But then again, if any of those you apply to, you''ve probably
    get the money to pay for Professional anyway.


    There are a couple of exceptions to that:


    +   You''re a student or educator, using it solely for educational purposes.'
