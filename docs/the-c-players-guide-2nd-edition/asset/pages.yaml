  md: "```\nif (index == 0) { X = value; }\nelse if (index == 1) { Y = value; }\n\
    else { throw new IndexOutOfRangeException(); }\n\n```\n\nWe first specify the\
    \ level of the index—public in our case—along with the type that it returns. (Note\
    \ that we don't have to use public and static, unlike overloading other operators).\
    \ We use the keyword, and the square brackets ([ ]), which indicate indexing.\
    \ Inside of the brackets we use the type and name of the indexing we'll use of\
    \ this indexer.\n\nThen, like a property, we have a get and a set block. Note\
    \ that we do not need to have both of these if we don't. We can get away with\
    \ just one. Inside of the get and set blocks, we can use the value keyword in\
    \ the setter to refer to the value that is being assigned.\n\nIn this example,\
    \ I'm making it so that people can refer to the x and y components of the vector\
    \ using the 0 and 1 respectively. Admittedly, it's not too useful. In this place,\
    \ we would be able to do this:\n\n```\nVector v = new Vector(5, 2);\ndouble xComponent\
    \ = v[0]; // Using indexing to set the x variable.\ndouble yComponent = v[1];\
    \ // Using indexing to set the y variable.\n```\n\nThis is much clearer if we\
    \ had been forced to do it with methods. (xComponent = v.GetIndex(0));\n\n# Using\
    \ Other Types as an Index\n\nWe're not stuck using int as an index. We can use\
    \ any type we want. For example, strings:\n\n```\npublic double this[string component]\n\
    {\nget{\n  if (component == \"x\") { return X; }\n  if (component == \"y\") {\
