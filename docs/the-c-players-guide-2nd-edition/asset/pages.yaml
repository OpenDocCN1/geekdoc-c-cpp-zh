    # Comments


    +   Quick Start

    * Comments are a way for you to add text for other people (and yourself) to read.

    * Computers ignore comments entirely.

    * Comments are made by putting two slashes (//) in front of the text.

    * Multi-line comments can also be made by surrounding it with asterisks and slashes,

    this/* this is a comment */


    In this chapter we''ll cover the basics of comments. We''ll look at what they
    are, why you should use them, and how to do them. Many programmers (even many
    C# books) de-emphasize comments, or completely ignore them. I''ve decided to put
    them front and center, right at the beginning of the book—they really are important.


    # What is a Comment?


    At its core, a comment is text that is put somewhere for a human to read. Comments
    are ignored entirely by the computer.


    # Why Should I Use Comments?


    I mentioned in the last chapter that whitespace should be used to help make your
    code readable. Writing readable and understandable code is a running theme you''ll
    see in this book. Writing code is actually easier than reading it, or writing
    understanding what it does. And believe it or not, you''ll actually spend far
    more time reading code than writing. You will want to do whatever you can to make
    your code easy to read. Comments will go a long way making your code more readable
    and understandable.


    You should use comments to describe what you are doing so that when you come back
    to a piece of code that you wrote after several months (or even just days) you''ll
    know what you were doing.'
