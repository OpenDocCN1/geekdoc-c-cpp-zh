  md: '# Virtual Machines and the CLR 279


    If you have four architectures and three languages, that''s a whopping 12 compilers!
    Needless to say, this gets out of hand very quickly.


    # Without a Virtual Machine


    ![](img/ad92120e75cb88980f77f3297768b8f0_301_0.png)


    Fortunately, there''s a better way to deal with this. Instead of trying to make
    compilers for each language and computer architecture, let''s just make one very
    special architecture: a virtual machine.


    A virtual machine is a software program that mimics a full computer. You can give
    it computer programs to run, just like their physical counterparts. More than
    that, virtual machines typically provide controlled access to the hardware of
    the computer that the virtual machine is running on.


    In effect, part of its role is to be a bridge between the software it is running,
    and the operating system and hardware of the physical computer that it is running
    on. Since our goal with a virtual machine is to provide a single architecture
    for our code to run on, regardless of what physical hardware or operating system
    is being used, the virtual machine can be thought of as an abstraction, hiding
    away all of the details that make the different physical machines different from
    each other.


    The Common Runtime, or CLR, is the .NET framework''s virtual machine, and it is
    the cornerstone of the .NET Framework. For languages that want to run on the CLR,
    rather than compiling directly to binary instructions, the compiler emits code
    in a special type of assembly language called Common Intermediate Language, which
    the CLR reads and ultimately compile to binary instructions.


    As you can see, this simplifies the process substantially.'
