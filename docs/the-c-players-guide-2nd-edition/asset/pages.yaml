    \ You just need to know about the language you're compiling to into its appropriate\
    \ IL.\n\n# Memory Management\n\nOne thing that the CLR provides is for memory\
    \ management. C# and other .NET languages do not require you to allocate memory\
    \ for your objects, nor do you have to clean it up when you're done (in most cases).\
    \ CLR will manage what memory is used, what isn't, and move things around. Memory\
    \ management is like having a personal assistant whose job is to take care of\
    \ all these things for you, freeing you to work on the interesting parts of your\
    \ program.\n\nI should point out, as I've done several times throughout this book,\
    \ that there are a few times you go beyond the bounds of the CLR's managed memory,\
    \ and when you do, you'll need to take extra care to clean things up correctly.\
    \ (The sections named Unsafe Code and Using Statements and IDisposable Interface\
    \ in Chapter 39 for more information about this.)\n\n# Security\n\nBecause C#\
    \ code is running on a virtual machine, it has a high level of control over what\
    \ code can access the hard drive, the network, and other hardware. And because\
    \ it is running inside a virtual"
