    In the code above, we have variables for the radius of a circle, the number π,
    and the area, which we calculate using a standard formula from geometry class.
    We display the results.


    Notice that we can use the + operator with strings (text) and numbers. This is
    a cool feature of C#. It knows that you can''t technically add a string and a
    number in a mathematical sense, but there is an intelligent way of handling it.
    It knows that it can turn the number into a string (the text representation of
    the number) and it knows of a way to add or combine strings together: concatenation.
    It sticks one piece of text at the end of another to create a new one. If you
    run this code, you will see the result that the computer prints out, "The area
    of the circle is 50.26548."


