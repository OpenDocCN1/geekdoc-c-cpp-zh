    \ use the '.' operator (usually read \"dot operator\"). We'll discuss the '.'\
    \ operator more later, but for now we need to know that it is used for member\
    \ access. This means that you use the '.' operator to use something that is a\
    \ part of something else. The values are a part of the enumeration, so we use\
    \ this operator:\n\n```\ntoday = DaysOfWeek.Tuesday;\n```\n\nThis works like any\
    \ other variable, even for things like comparison in an if statement:\n\n```\n\
    DaysOfWeek today = DaysOfWeek.Sunday;\nif(today == DaysOfWeek.Sunday)\n{\n  //\
    \ ...\n}\n```\n\n# Why Enumerations are Useful\n\nThere's a very good reason to\
    \ use enumerations. Let's go back to where we started this chapter—doing days\
    \ of the week with the int type. Remember how we defined dayOfWeek = 3; which\
    \ meant Tuesday? What if someone put dayOfWeek=17? As far as the computer knows,\
    \ this should be valid. After all, dayOfWeek is just an int type. Why not allow\
    \ it to be 17? But for what we're doing, 17 doesn't make any sense. We are only\
    \ using 1 through 7.\n\nEnumerations force the computer (and programmers) to use\
    \ specific values, which you have defined. It prevents tens of errors, and makes\
    \ your code more readable. For example, DaysOfWeek.Sunday is immediately clear\
    \ what it means, dayOfWeek = 1 is not.\n\nIn addition, enumerations allow us to\
    \ use the IntelliSense Visual Studio provides, which is another little bonus.\n\
    \n# Underlying Types\n\nBefore moving on, it is worth looking at a couple of additional\
    \ details about enumerations. Under the surface, C# is simply wrapping our enumeration\
    \ around an underlying type. By default, the underlying type is the int type,\
    \ though it is possible to choose a different integer type. So enumerations are\
    \ the int type, though at core, just numbers. (As I mentioned though, it starts\
    \ off giving values, starting with 0, and going up by one for each number. In\
    \ the enumeration that we created, Sunday has a value of 0, Monday is 1, and so\
    \ on."
