  md: "# Chapter 38 Asynchronous Programming\n\nline in the code. Rather, the continuation\
    \ is scheduled then, and executed when the task actually completes at some later\
    \ point in time.\n\n# The 'async' and 'await' Keywords\n\nWe're now ready for\
    \ the latest and greatest asynchronous programming in C#. Building off of TAP\
    \ pattern, C# 5.0 makes this far simpler and easy to read by integrating it into\
    \ the language. It does this by adding two keywords to the language: async and\
    \ await.\n\nThe Task and Task<Result> classes function as the core building block\
    \ of asynchronous programming with these new keywords. You'll create a new Task\
    \ or Task<Result> using Task.Run, like in the previous section. The real difference\
    \ happens when you get a Task returned to you from a method, where you can do\
    \ something when the task completes or do something with the result the task gives\
    \ you upon:\n\n```\nScore[] highScore = await highScoreManager.LookupScores();\n\
    ```\n\nBefore looking at what code actually does, let's compare it to the synchronous\
    \ version, right at the start of the chapter. Remember this?\n\n```\nScore[] highScore\
    \ = highScoreManager.LookupScores();\n```\n\nIt's surprisingly similar. And yes,\
    \ it is asynchronous. While previous approaches to asynchronous programming have\
    \ been convoluted, using Task and Task<Result>, combined with the new await keyword,\
    \ everything falls in place and we get a clean solution.\n\nSo what does await\
    \ keyword do exactly?\n\nWell let's start by reading that piece of code out a\
    \ bit. I'm going to put some Console.WriteLine statements in there and wrap it\
    \ in a method:\n\n```\npublic async void GrabHighScores()\n{\n    // Preliminary\
    \ work...\n    Console.WriteLine(\"Initializing asynchronous lookup of high scores.\"\
    );\n\n    // Start something asynchronously.\n    Score[] highScore = await highScoreManager.LookupScores();\n\
    \n    // Work to be done after completion of the asynchronous task.\n    Console.WriteLine(\"\
    Completed asynchronous lookup of high scores.\");\n}\n```\n\nLet's stand there\
    \ for a moment, with the await keyword, which is the central point of this discussion.\
    \ LookupScores returns a Task<[]>—ancompleted task with the promise of having\
    \ a result]. Any time a method returns a task, you can optionally \"await\" it\
    \ with the await keyword, which creates a similar situation to the ContinueWith\
    \ we see in the previous section.\n\nThe preliminary code before the await happens\
    \ immediately, by the thread that called the method jumps out of the method and\
    \ continues merrily on something else. The asynchronous code will either happen\
    \ on a separate thread (if you use Task.Run) or perhaps by no thread at all (if\
    \ it's waiting for the network or file system to complete some work)."
