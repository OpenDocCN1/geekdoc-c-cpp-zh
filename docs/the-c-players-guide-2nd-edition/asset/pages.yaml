    # User Input from the Console


    We can get input from the user using a statement like the following:


    ```

    string whatTheUserTyped = Console.ReadLine();

    ```


    This should look like Console.WriteLine, which being used up to this point. Both
    ReadLine and WriteLine are methods. Methods are little blocks of reusable code.
    We''ll get into details later (Chapter 15). Now for, all we need to know is what
    we can use to make things happen—read and write lines of text in this particular
    case. Console.ReadLine() will grab an entire line of text from the user (until
    the <Enter> key is pressed) and put it in whatTheUserTyped variable.


    # Converting Types


    For many things, though, simply grabbing the user''s input and sticking it in
    a string variable doesn''t get it into the right data type we need. For instance,
    if we need the user to input a number? When we put it into a string, we can''t
    do anything with it. We''ll need to convert it to the'
