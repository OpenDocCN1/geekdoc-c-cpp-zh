    # Using Generics


    # In a Nutshell


    +   - Generics in C# are a similar concept to generics in Java and templates in
    C++. They are a way to create safe classes and structures without needing to commit
    to a specific data type.

    - When you create an instance of a type that uses generics, you''ll need to indicate
    which type (or types) you are using it for in any particular instance using the
    angle brackets (''<'' and ''>''): List<string> listOf = new List<string>();

    - This chapter also covers some of the details of using the List class, the IEnumerable
    interface, and all of which uses generics.


    In this chapter, we''ll take a look at a powerful feature in C# called generics.
    By taking a look at why generics exists in the first place, looking at the actual
    problem they solve. We''ll then look at a few classes that come with the .NET
    Framework that use generics. These classes are the List and Dictionary classes,
    as well as the IEnumerable<T> interface. These types have many uses, and as we
    make software, we''ll definitely be putting them and other generic classes to
    use good.


    We''ll look at how to actually make your generic classes in the next chapter.


    # The Motivation for Generics


    Before we can discuss generics, we need to discuss why they exist in the first
    place. So I''m going to start by having you think about the underlying problem
    generics will address.


    Let''s say you wanted to make a class to store a list of numbers. While an array
    could do this, perhaps we could make a class that wraps an array and creates a
    new larger one when we run out of space. Then we never need to worry about how
    long the list is. (There is already a List that does this, but pretend it doesn''t
    for the sake of this discussion. We''ll revisit List before the end of this chapter.)


    Imagine for a second, what you''d need to do to make a class to accomplish this
    task. For example:'
