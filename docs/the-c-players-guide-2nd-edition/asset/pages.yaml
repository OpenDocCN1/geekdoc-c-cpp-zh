  md: "# 20  Chapter 30 Delegates\n\nWhen you create a delegate type, the class that\
    \ the C# compiler will generate is derived from MulticastDelegate. As an example,\
    \ the MathDelegate delegate we made in the last section is converted into something\
    \ like this:\n\n```\npublic class MathDelegate : System.MulticastDelegate\n{\n\
    \    // Constructor\n    public MathDelegate(Object object, IntPtr method);\n\n\
    \    // This key method matches the definition of the delegate.\n    public virtual\
    \ int Invoke(int a, int b);\n\n    // Two methods to allow the code to be called\
    \ asynchronously.\n    public virtual IAsyncResult BeginInvoke(int a, int b);\n\
    \    public virtual void EndInvoke(IAsyncResult result);\n}\n```\n\nThe constructor\
    \ in that allows the system to create a new instance of this delegate class. The\
    \ second parameter of the constructor, with the type IntPtr, references the method\
    \ you're trying to put into the delegate. If the method is an instance method\
    \ (not static) the object parameter will contain the instance it is called with.\
    \ If you create a delegate from a static method, this will be null.\n\nEarlier,\
    \ we had code like this:\n\n```\nMathDelegate mathOperation = Add;\n```\n\nThe\
    \ compiler will roughly translate this into something like this:\n\n```\nMathDelegate\
    \ mathOperation = new MathDelegate(null, Add);\n```\n\nThat's just an approximation,\
    \ and there's a lot of waving in there. I'm completely skipping over the part\
    \ where the compiler turns the method name of Add into an actual IntPtr, but that\
    \ information isn't available at the C# language level. It's only known by the\
    \ compiler.\n\nEarlier, we called the delegate method by simply using parentheses\
    \ and putting our parameters inside:\n\n```\nint result = mathOperation(3, 4);\n\
    ```\n\nIn this case, the C# compiler will turn this call into an Invoke method\
    \ it created:\n\n```\nint result = mathOperation.Invoke(3, 4);\n```\n\nWritten\
    \ this, it's a little easier to see why you might want to check for null before\
    \ invoking the method, in case the mathOperation variable is null.\n\nWhile most\
    \ C# programmers prefer the first version of calling a delegate (without the Invoke)\
    \ the second version is both legal (the C# compiler will let you directly Invoke\
    \ if you want) and is also preferred by some C# programmers. Feel free to use\
    \ it if it seems preferable or more readable to you.\n\nWe'll see more of this\
    \ syntactic sugar in the next section when we look at chaining."
