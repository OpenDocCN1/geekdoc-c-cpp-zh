  md: '# Chapter 16 Value and Reference Types


    parameter, the message variable will be stored on the stack somewhere, and contain
    a reference to that actual text on the heap.


    Depending on how things are set up, reference type variables can also live on
    the heap, so you could have references from one part of the heap pointing to other
    parts of the heap. This would be the case if you have an array of strings, which
    are of reference types. For instance, look at the following:


    ```

    string[] messages = new string[3] ( "Hello", "World", "!" );

    ```


    This might look like this:


    ![](img/ad92120e75cb88980f77f3297768b8f0_128_0.png)


    A local messages variable on the stack has a reference to the string array, but
    that actual array lives on the heap. Within that array, each item contains another
    reference to other parts of the heap—the strings that go in the array, in this
    case. Taking this further, it is entirely possible to have huge networks of references
    spread throughout the heap.


    On the other hand, value types are stored entirely at the place that the variable
    exists. If they''re local variables or parameters, this means they''re stored
    entirely on the stack. We''ve seen this with nearly all the built-in types we''ve
    been working with far, like int and double. The variable doesn''t contain a reference,
    just the actual value.


    This holds true, even when the value type is defined on the heap. Value typed
    variables always contain their data right where the variable is. Arrays give us
    a great example of how this works. Let''s say you had an array of value types,
    like this: int[3] numbers = new int[3]{ 2, 3, 4 }; This would end up looking like
    this:


    ![](img/ad92120e75cb88980f77f3297768b8f0_128_1.png)


    The items in the array don''t point to elsewhere like they did with our string
    array earlier. The numbers exist where the variable exists.


    That covers the basics of how value and reference types work. In a minute, we''ll
    come back and look at what that means for us, when we talk about value and reference
    semantics. But first, a bit of a detour to cover everything that we need to know
    about reference types.


    # Null: References to Nothing


    One thing about reference types is that you can have reference nothing at all.
    This is called a null reference. Assigning a reference type value of null can
    be done with the null keyword:'
