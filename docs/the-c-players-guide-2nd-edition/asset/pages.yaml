  md: "# Variable Number of Parameters\n\nLet's say you want to average some numbers.\
    \ It is easy to write a method to average two numbers:\n\n```\npublic static double\
    \ Average(int a, int b)\n{\n  return (a + b) / 2.0;\n}\n```\n\nWhat if you want\
    \ to average three numbers? You could write a similar method for that:\n\n```\n\
    public static double Average(int a, int b, int c)\n{\n  return (a + b + c) / 3.0;\n\
    }\n```\n\nWhat if you wanted 5? Or 10? Can you imagine that you keep adding more\
    \ and more methods, but eventually it gets out of hand.\n\nC# provides a way to\
    \ supply a variable number of parameters to a method, by using the **params**\
    \ keyword with an array variable:\n\n```\npublic static double Average(params\
    \ int[] numbers)\n{\n  double total = 0;\n\n  foreach (int number in numbers)\n\
    \    total += number;\n\n  return total / numbers.Length;\n}\n```\n\nTo the outside\
    \ world, the **params** keyword makes it look like you can supply any number of\
    \ parameters:\n\n```\nAverage(2, 3);\nAverage(2, 5, 8);\nAverage(41, 49, 29, 2,\
    \ -7, 18);\n```\n\nHowever, behind the scenes, the C# compiler will turn these\
    \ into an array of this type to use in the method.\n\n```\nint[] numbers = new\
    \ int[5]{ 5, 4, 3, 2, 1 };\nAverage(numbers);\n```\n\nYou can combine a **params**\
    \ argument with other parameters, but the **params** argument must be the last\
    \ one, and there can only be one of them.\n\n# The ‘out’ and ‘ref’ Keywords\n\n\
    Back in Chapter 16, we talked about value and reference semantics. We looked at\
    \ whenever you pass something into a method as a parameter, the contents of the\
    \ variable are copied. With value types, means we get a complete copy of the original\
    \ data. For reference types, we get a copy of the reference, which was still pointing\
    \ to the same object in the heap."
  merge: -1
  pgno: 205
- img_proc: true
  md: "# 184 Chapter 27 Methods Revisited\n\nMethods have the option of handing off\
    \ the actual variable, rather than copying its contents, by using the ref or out\
    \ keyword. Doing this means that the called method is working with the exact same\
    \ variable that existed in the calling method.\n\nThis sort of creation allows\
    \ that type values have been turned into reference types, and sort of takes reference\
    \ to the next level, where it feels like you've got a reference to a reference.\n\
    \nTo this, you can either the ref keyword or the out keyword to a particular parameter.\n\
    \n```\npublic void MessWithVariables(out int x, ref int y)\n{\n    x = 3;\n  \
    \  y = 17;\n}\n```\n\nWe can then call this code like:\n\n```\nint banana = 2;\n\
    int turkey = 5;\n```\n\n```\nMessWithVariables(out banana, ref turkey);\n```\n\
    \nAt the end of this code, the banana variable will contain a value of 3, and\
    \ the turkey variable will contain a value of 17.\n\nIf you look at this code,\
    \ you'll see that you need to put out or ref when you call the method as well.\
    \ There's a good reason for it. Handling the actual variables from one method\
    \ to another is a risky game to play. By using these keywords in both the method\
    \ and the calling method, we can ensure the variables were handed off intentionally.\n\
    \nThere is a small difference between using ref and out, and that difference is\
    \ to whether the calling method or the called method is responsible for initializing\
    \ the variable. With the ref keyword, the calling method needs to initialize the\
    \ variable before the method call. This allows the called method to assume that\
    \ it is already initialized. These are sometimes reference parameters.\n\nWith\
    \ the out keyword, the compiler ensures that the called method initializes the\
    \ variable before returning from the method. These are sometimes called output\
    \ parameters.\n\nUsing reference or output parameters gives a couple of things.\
    \ Because we're passing the actual variable, instead of just the contents of the\
    \ variable, this means that type values won't need to be completely copied when\
    \ passed into a method. This can speed up things because it could save us lot\
    \ of type values.\n\nYou can also to get multiple values from a method. You are\
    \ only allowed to return one value from a method, but multiple parameters can\
    \ be returned as an output parameter instead. (Though, there are other ways to\
    \ do this that are usually preferred, including building a class that can store\
    \ all the data of interest, or using the Tuple class.)\n\nSending the actual variable\
    \ to a method, instead of just the contents of the variable is a dangerous thing\
    \ to do. We're giving another method control over our variables, and if used carefully,\
    \ it could cause a lot of trouble. Use sparingly and wisely."
  merge: -1
