  md: '# The Action and Func Delegates 205


    The second catch is in exception handling. In the event that a method is being
    invoked by the delegate throws an exception, one of the handlers further down
    the chain will get a chance to be called. For this reason, you should do everything
    you can to avoid exceptions in methods that get attached to a delegate.


    # The Action and Func Delegates


    You can make your delegates in C# whenever you want to, but it is likely that
    you won''t actually need to create your own delegates often. Included with the
    .NET Framework is a collection of delegates that are already defined for you.
    These delegates use generics, which are incredibly flexible. These are the Action
    and Func delegates.


    The Action delegates have a void return type, while the Func delegates have a
    generic return type. There''s a whole set of delegate that are each a little different.
    For instance, there''s the plain Action delegate, which looks like:


    ```

    public delegate void Action();

    ```


    Then there''s a version that has one generic parameter, two generic parameters,
    three generic parameters, and so on, up to 16. (That''s crazy talk, right there!)


    ```

    public delegate void Action<T>(T obj);

    public delegate void Action<T1, T2, T3>(T1 arg1, T2 arg2, T3 arg3);

    public delegate void Action<T1, T2, T3>(T1 arg1, T2 arg2, T3 arg3);

    public delegate void Action<T1, T2, T3, T4>(T1 arg1, T2 arg2, T3 arg3, T4 arg4);

    ```


    So as an example, if your method has a void return type, and requires two ints
    as parameters, you could use the Action delegate with two parameters, putting
    in int for both type parameters:


    ```

    Action<int, int> myDelegate = MethodRequiresTwoInts;

    myDelegate(3, 4);

    ```


    If you need to return a value, you can use one of the Func delegates instead.
    These have a similar pattern, but return a value (of a generic type):


    ```

    public delegate TResult Func<TResult>();

    public delegate TResult Func<T1, Result>();

    public delegate TResult Func<T1, T2, Result>();

    ```


    Again, this can go up to 16 input parameters, plus the generic result parameter.
    So instead of our little MathDelegate that we made, we could have used Func<int,
    int, int> instead:


    ```

    Func<int, int, int> mathOperation = Add;

    int a = 5;

    int b = 7;

    int result = mathOperation(a, b);

    ```'
