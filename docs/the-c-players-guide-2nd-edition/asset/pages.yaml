  md: "# Chapter 21 Inheritance\n\n```\nPolygon[] lotsOfPolygons = new Polygon[5];\n\
    lotsOfPolygons[2] = new Square(2.1F);\nlotsOfPolygons[3] = new Triangle();\n```\n\
    \nIn any case where a base class can be used, you can always substitute a derived\
    \ class.\n\n# Constructors and Inheritance\n\nI mentioned earlier that in a derived\
    \ class, all properties, instance variables, and methods are inherited. Constructors,\
    \ on the other hand, do not.\n\nYou can't use the constructors in the base class\
    \ to create a derived class. For instance, a Polygon class has a constructor that\
    \ takes an int is for the polygon's number of sides. You can't create a Square\
    \ using that constructor. For good reason, constructors are special methods that\
    \ are designed to help you build new objects of a particular type. With inheritance,\
    \ a constructor in the base class doesn't have any way to set up the new parts\
    \ of the derived class. To create an instance of a class, you must use one of\
    \ the constructors that are defined in that specific class.\n\nWhen a derived\
    \ class defines a constructor, it must call one of the constructors from the base\
    \ class. By default, a constructor in the derived class will use the base class's\
    \ parameterized constructor. (Remember, if you don't define any constructor, a\
    \ default parameterized constructor will be created for you.) If the base class\
    \ doesn't have a parameterized constructor, or if you would like a constructor\
    \ in the derived class to use a different one, you will need to indicate which\
    \ constructor to use. This is done by a colon and the base keyword along with\
    \ the parameters for the constructor we want to use, like:\n\n```\npublic Square(float\
    \ size)\n{\n    base(4); // Uses the Polygon(int numberOfSides) constructor in\
    \ the base class.\n    size = size;\n}\n```\n\n# The 'protected' Access Modifier\n\
    \nIn the past, we discussed the private and public access modifiers. To review,\
    \ remember that public means anyone get access to the member (variable, method,\
    \ property, etc.), while private means that you only have access to it from inside\
    \ of the class it belongs to.\n\nWith inheritance we add another option: protected.\
    \ If a base class of the class uses the protected accessibility level, then anything\
    \ inside of the class can use it, as well as any derived class. It's a little\
    \ broader than private, but more restrictive than public.\n\nIf the Polygon class\
    \ has NumberSides property protected instead of public, then you could access\
    \ it from anywhere in the Polygon class, as well as the Square class, and any\
    \ other derived class, but not from outside of those.\n\n# The Base Class of Everything:\
    \ object\n\nWithout specifying any class to inherit from, any class will still\
    \ derive from a special base class that is the base class of everything. This\
    \ is the object class. All classes are derived from this class by default, unless\
    \ you state a different class as the base"
