  md: "# 248 Chapter 38 Asynchronous Programming\n\n# # Creating Threads Directly\n\
    \nHaving seen a synchronous version of our high scores lookup problem, let's turn\
    \ our attention to doing this in an asynchronous way.\n\nOur first option is to\
    \ create a thread like we did in the last chapter. It's using the most basic building\
    \ block (starting a thread directly) but it perfectly fits the definition of asynchronous\
    \ programming.\n\nBased on what we learned before, this might look like this:\n\
    \n```\nThread thread = new Thread(() => {\n  Score[] highScores = HighScoreManager.LookupScores();\n\
    \  // Do something with the results.\n  HighScores = highScores;\n});\nthread.Start();\n\
    ```\n\nThat code isn't so terrible. It does the job for sure. But as we'll soon\
    \ see, there are better ways of structuring this code.\n\n# # Using the ThreadPool\n\
    \nWhile directly creating a thread was our approach in the last chapter, it has\
    \ been discouraged. One obvious problem with this approach is that it's pretty\
    \ easy to end up with so many threads that you drown the CPU. You spend far much\
    \ of your time switching between threads, and far too little real work.\n\nC#\
    \ has a concept of a 'pool', wrapped up in the ThreadPool class. The idea is that\
    \ the .NET Framework and the Base Class Library can provide a collection of threads\
    \ that already exist (no wasted time in creating them) that are reused for various\
    \ tasks. The ThreadPool class has the smarts to manage the optimal number of threads.\n\
    \nWhen you have a chunk of work that you need to do asynchronously, you can just\
    \ hand it off to the thread pool. This is done by using QueueUserWorkItem method:\n\
    \n```\nThreadPool.QueueUserWorkItem(() => {\n  Score[] highScores = HighScoreManager.LookupScores();\n\
    \  // Do something with the results.\n  HighScores = highScores;\n}, null);\n\
    ```\n\nThis is pretty close to what we had in the previous iteration. This code\
    \ uses a lambda statement. We could have used a named method instead, but this\
    \ type of thing is a perfect for lambda statements, so I went with that approach\
    \ in the sample code as well.\n\nThis gets over the problem of not knowing when\
    \ we should create new threads and when we should reuse an old thread, and we\
    \ were also able to ditch the ThreadStart call.\n\nYou'll notice with this approach\
    \ that the method required a parameter (data), which I filled in with null. This\
    \ is more along the lines of the ParameterizedThreadStart we talked about in the\
    \ last chapter."
