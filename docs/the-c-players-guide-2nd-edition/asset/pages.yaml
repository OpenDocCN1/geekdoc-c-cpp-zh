  md: "# Chapter 26 Namespaces and Using Directives\n\nAs we mentioned earlier in\
    \ this chapter, when you put a using directive at the top of your file, allow\
    \ your code to just use the class name to access all of the types contained within\
    \ a namespace.\n\nWhen working with static classes, which we talked about in Chapter\
    \ 18, you can also use a special type of directive called a static directive.\
    \ Remember a static class is one that is marked as static. This forces all of\
    \ its members to be static. Static classes are primarily used for utility classes,\
    \ or ones where you want to group a bunch of related methods under a shared name.\
    \ Two very common examples of this are the Console and Math classes we've spent\
    \ a lot of time talking about.\n\nFor these static classes, you can add a using\
    \ directive with the static keyword for these classes, and you'll have access\
    \ to its methods without even needing to name the class it belongs to:\n\n```\n\
    using static System.Math;\nusing static System.Console;\n\nnamespace StaticUsingDirectives\n\
    {\n    public static class Program\n    {\n        public static void Main(string[]\
    \ args)\n        {\n            double x = PI;\n            WriteLine(Sin(x));\n\
    \            ReadKey();\n        }\n    }\n}\n```\n\nThe above code illustrates\
    \ how using the directives for a static class have been added, you can simply\
    \ reference its members. Instead of Math.PI and Math.Sin, we can simply use PI\
    \ and Sin. Instead of Console.WriteLine and Console.ReadKey, we can use WriteLine\
    \ and ReadKey.\n\nLike many features, this can be a bit of a double-edged sword.\
    \ It's nice to have your code that much more concise. But at the same time, you\
    \ might lose meaningful information about where type static method, property,\
    \ or variable come from. It's possible to get carried away with this. Use it when\
    \ this simplicity makes things clearer, and avoid it when it makes it more ambiguous.\n\
    \n> Try It Out!\nNamespaces Quiz. Answer the following questions to check your\
    \ understanding. When you're done, check your answers against the ones below.\
    \ If you missed something, go back and review the section that talks about it.\n\
    \n+   1. True/False. using directives makes potentially inaccessible code accessible.\n\
    2. True/False. using directives make it so that you do not need to use fully qualified\
