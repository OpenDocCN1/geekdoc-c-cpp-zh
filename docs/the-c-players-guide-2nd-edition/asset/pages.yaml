  md: '# What is Asynchronous Programming?


    Asynchronous programming means taking a piece of code and running it on a separate
    thread, freeing up the original thread to continue and do other things while the
    tasks complete.


    The typical use case is when you start something that you know is going to take
    a while to happen. "While" is measured in computer time, so we may be taking only
    a few milliseconds (or not). Some common scenarios include making a request to
    a server or a website, making requests to the file system, while running a particularly
    large or long algorithm that you''re using, or any other time where you know a
    particular piece of code is going to take some work to get done.


    Modern computers have a lot of computational power, and users are expecting responsive
    user interfaces. Those combined mean asynchronous programming is becoming more
    and more necessary and important to know.


    The opposite of asynchronous programming (sometimes "asynchrony") is synchronous
    programming, and it''s what we''ve been doing up until now.


    # Approaches from the Early Days


    There have been lots of approaches to doing asynchronous programming in C#''s
    past. While no longer recognized or preferred, those older approaches are worth
    mention because they illustrate the complexity of the problem, the beauty of the
    final solution, and the decade long journey to get there.


    Throughout this section of this chapter, we''ll stick with a recurring example
    of getting a list of high scores from a web server. This will help us see the
    trade-offs of the various approaches that we''ll see.


    # A Synchronous Approach


    Let''s start by looking how we might do this task (looking up high scores) using
    a traditional synchronous approach. Means blocking and waiting for the results
    to come back moving on. Obviously, this defeats the purpose of what this chapter
    is talking about, but it is a worthwhile exercise anyway. This biggest thing we''ll
    gain from this is an example of "ideal" code looks here. Because a synchronous
    request is so straightforward, the methods we can make clean and simple.


