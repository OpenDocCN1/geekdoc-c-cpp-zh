    ```

    string message = null;

    int[] numbers = new int[] { 2, 4, 6, 8 };

    numbers = null;

    ```


    Of course, you''ll note that with the middle line, we create a new array, which
    is placed on the heap, and then we reassign numbers to null. At this point, the
    numbers variable isn''t referencing that array anymore, and nothing else is referencing
    it, it becomes inaccessible, all alone in the heap. Because it is inaccessible,
    eventually it will be garbage collected.


    If a reference has a value of null, it means there''s no data at the other end.
    If you inadvertently try to do something with it, your program is going to crash:


    ```

    int[] numbers = null;

    numbers[3] = 6; // This crashes, since numbers don''t reference anything.

    ```


    To address this, you can do a simple check to see if a reference type is null
    first, if you think that could happen:


    ```

    if(numbers == null)

    numbers[3] = 6;

    ```


    Value types cannot be assigned a value of null.


    Checking for null is incredibly common. While the approach above covers you in
    all cases, C#6 introduced a new operator that allows you to check for null much
    more concise syntax. In fact, with the new syntax, checking for null with an if-statement
    is no longer the recommended approach in most cases. For more information on this,
    see the section called Simple Null Checks: Null Propagation Operators in Chapter
    39.


    # Value and Reference Semantics


    If the only difference between value and reference types was whether they stored
    their data "on site" or else in the heap, I wouldn''t worry about that kind of
    detail for an introductory book like this. However, there''s more to it. Because
    of this difference, we get different behavior.


    Reference types have what''ve called reference semantics, and value types have
    value semantics or copy semantics. Let''s compare these two with an example, using
    the int type (a value type) and array of ints (the array is a reference type,
    even though it contains things that are value types). Let''s say you have the
    following code:


    ```

    int a = 3;

    int b = a;

    b++;

    ```


    We created two variables with the int type. We place the value 3 inside a. We
    then assign the contents of a to b. Doing this means reading the contents of a
    (which is 3) and then value that to b. Next, modify b by incrementing it is now
    4. a is still the original value of 3. When we assign the contents of a to b,
    we made a new copy for b. Whatever happens with the b variable won''t affect the
    original a.


    Interestingly, the exact same thing happens with reference types, but because
    the variable contains only a reference instead of the actual value, we get different
    behavior entirely. Take a look at this example:'
