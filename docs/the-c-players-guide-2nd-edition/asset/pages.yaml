    C# is an object-oriented programming language, meaning that the code we write
    is typically organized into little blocks that are modeled after real-world objects.
    We define what kind of data these objects have and what those objects can do.


    The object-oriented aspect of C# is a key part of the language. Without knowing
    how to create and use classes, our understanding of the language is far from complete.


    Part 3 is all about designing and building your own types in C#. Building your
