  md: '# Compiling and Running Your Project


    Your computer doesn''t magically understand what you''ve written. Instead, it
    understands special instructions that are composed of 1s and 0s. Fortunately for
    us, Visual Studio includes a thing called a compiler. A compiler will take the
    C# code you''ve written and turn it into binary that your computer understands.


    Our next step is to compile our code and run it. Visual Studio will make this
    really easy for us.


    To start this process, press F5 or Debug > Starting Debug from the menu.


    There did you see it? Your program flashed on the screen for a split second! (Hang
    on... we''ll fix that in a second. Stick with it for a moment.)


    We just run our program in debug mode, which means that if something happens while
    your program is running, it won''t simply crash. Instead, Visual Studio will notice
    the problem, stop in the middle of what''s going on, and show you the problem
    that you are, allowing you to debug it. We''ll tell you more about how to actually
    debug your code in Chapter 44.


    So there you have! You''ve made a program, compiled it, and executed!


    If it doesn''t compile and execute, double check to make sure your code looks
    like the code above.


    # Help! My program is running, but disappearing before I can see it!


    You likely just ran this problem when you executed your program. You push F5 and
    the program, a black console window pops up for a split second before disappearing
    again, and you have no clue what happened.


    There''s a good reason for that. Your program ran out of things to do, so it finished
    and closed on its own.(It''s so smart, closing on its own like that)


    But we''re really going to want a way to make it so that doesn''t happen. After
    all, we''re left wondering if it even did what we told it to. There are two solutions
    to this, each of which has its own strengths and weaknesses.


    Approach #1: When you run without debugging, console programs like this will always
    pass before closing. So one option is to run it without debugging. This option
    is called Release Mode. We''ll cover this in a little more depth later on, but
    the bottom line is that your program runs in a streamlined mode is faster, but
    if something bad happens, your program will just die, giving you the chance to
    debug it.


    You can run in release mode by simply pressing Ctrl + F5 (instead of F5). Do this
    now, and you''ll see that it prints out your "Hello World!" message, plus another
    message that says "Press any key to continue..." which does exactly what it says
    and waits for you before closing the program. You can also find this under Debug
    > Start Without Debugging on the menu.


    But there''s a distinct disadvantage to running in release mode. We''re no longer
    in debug mode, so if something happens with your program while it is running,
    your application will crash and die. (Hey, just like all of the other "cool" programs
    out there!) Which brings us to an alternative approach:'
