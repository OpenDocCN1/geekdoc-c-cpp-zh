  md: '# Bit Fields 263


    0101111

    11111111

    0


    Then you look at the next value in each number. They are both 1, which is like
    having a true and true, when combined with *and*, would result in true, or a 1.


    0101101

    11111111

    01


    You continue down the entire sequence, doing this for each bit:


    0101101

    11111111

    0101101


    The bitwise operator does the same thing, but combines the two numbers with or
    instead.


    ```

    int a = 5; // 00000101

    int b = 3; // 00000011

    int combinedWithAnd = a & b; // results in 00000001, or 1.

    int combinedWithOr = a | b; // results in 00000111, or 7.

    ```


    There''s a bitwise operator that is the *exclusive* or operator (This is sometimes
    called xor, pronounced "ex-or."). The "normal" or operator returns true if either
    of the two parts are true. This still applies when both are true. The *exclusive*
    or operator is only true if *exactly one* is true. If they are both true, then
    it evaluates to false. The exclusive or operator is the caret symbol (^).


    Continuing on with the last code snippet, which would look like this:


    ```

    int combinedWithXor = a ^ b; // results in 00000110, or 6.

    ```


    One final, similar to the bitwise complement (~), which is a little like the !
    we saw first when looking at logical operators. This bit takes each bit and changes
    it to the opposite:


    ```

    int number = 200; // 11001000

    int bitwiseComplement = ~number; // 00110111, or 55.

    ```


    There is a compound assignment operator that you can use for all of these:


    ```

    number = 8; // equivalent of number = number << 1

    number <<= 1; // number = number >> 1

    number &= 32; // number = number & 32

    number |= 32; // number = number | 32

    number ^= 32; // number = number ^ 32

    ```


    # Enumeration Flags


    While it is possible to work with the *byte*, int with an enumeration in C#, to
    make the whole thing more readable. (Enumerations were this kind of stuff typically
    introduced in Chapter 14.) Before we use an enumeration for this, we must use
    the *Flags* attribute and assign the right values to each member of the enumeration:


    ```

    [Flags] // Don''t forget to add the Flags attribute

    public enum ForumPrivileges

    ```'
