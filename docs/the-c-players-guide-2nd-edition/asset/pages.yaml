    \ from a Method\n\nMethods are created to do some specific task. Often that tasks\
    \ involve figuring something out, and we want to be able to know the results.\
    \ A method has the option of giving back. (How generic of them!) This is called\
    \ returning something. (Even if it doesn't return anything, like the first we\
