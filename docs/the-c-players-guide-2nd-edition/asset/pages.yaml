  md: "# Using Derived Classes 14\n\nWhile we can put a Square in a variable with\
    \ the Polygon type, you can't go the other way around. You can assign a Polygon\
    \ object to a variable with the type Square, like this:\n\n```\nSquare square\
    \ = new Polygon(3); // Does not compile.\n```\n\nThis is because all squares are\
    \ polygons, not all polygons are squares.\n\n# Checking an Object's Type and Casting\n\
    \nAs I described, it is possible to actually cast an instance of a derived type\
    \ like the Square, but only know that it is a Polygon. Sometimes we want be able\
    \ to figure out what an object is specifically, and work with it.\n\nIt is possible\
    \ to check if an object is a specific type, with the keyword and casting:\n\n\
    ```\nPolygon polygon = new Square(4.5F);\n\nif (polygon is Square) {\n  Square\
    \ square = (Square)polygon;\n  // We can now do what we want with the square.\n\
    }\n```\n\n# The 'as' Keyword\n\nIn addition to casting, there is another way we\
    \ can convert one object type to another. This is possible by using the as keyword,\
    \ which looks like this:\n\n```\nPolygon polygon = new Square(4);\nSquare square\
    \ = polygon as Square;\n```\n\nThere are a couple of differences between the as\
    \ keyword and casting, and it turns out, using the as keyword in this type of\
    \ situation is usually a better choice.\n\nTo fully understand this, let's assume\
    \ in addition to the Polygon and Square classes we've been looking at, there is\
    \ a Triangle class as well. Let's say we have a variable with the Polygon type,\
    \ and assign it a new Triangle, but then we inadvertently try to turn it into\
    \ a Square:\n\n```\nPolygon polygon = new Triangle();\nSquare square = (Triangle)polygon;\n\
    ```\n\nIn this case, the program will crash, giving us an error that says it was\
    \ an invalid cast. On the other hand, if we use the as keyword, instead of casting,\
    \ we would get null, which we can then respond to:\n\n```\nPolygon polygon = new\
    \ Triangle();\nSquare square = polygon as Square;\n\nif (square != null) {\n \
    \ // ...\n}\n```\n\n# Using Inheritance in Arrays\n\nIn light of what we've just\
    \ discussed, it is worth mentioning that you can create an array of the base class\
    \ and put any derived class inside of it. This is just like what we already saw\
    \ with variables that weren't arrays, so it shouldn't be too surprising:"
