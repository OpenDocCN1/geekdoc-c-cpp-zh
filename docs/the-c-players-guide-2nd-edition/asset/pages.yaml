  md: '# The ''async'' and ''await'' Keywords 25


    But everything after the await is scheduled to happen the task finishes. The await
    effectively slices the method in two while using syntax that the previous code
    sample that the await is easy to understand.


    You''ll notice that the await keyword extracts the value out of the Task<T>. We
    don''t have to call Task.Result to get it. If a method returns a generic Task<Result>,
    then the await keyword will do that for you. In other words, it extracts the promised
    value out of the task completion.


    If a method returns a Task, the non-generic version which doesn''t have a promise
    value, you can still await it. It has just to be structured as a statement, rather
    than an assignment.


    ```

    Console.WriteLine("Before await.");

    await SomeMethodThatReturnsTask();

    Console.WriteLine("After await.");

    ```


    The await keyword can''t be used just anywhere. It can only be called inside a
    method that is marked with the async keyword. You can see that I added that in
    the earlier code:


    ```

    public async void GrabHighScores()

    ```


    The async keyword can be attached to a method that has a return type of void,
    Task, or Task<TResult>.


    +   * An async method with a void return type implies a fire-and-forget nature;
    you don''t care when it finishes, just that it happens asynchronously.

    * An async method with a Task for the return type implies you care about when
    it finishes, including scheduling stuff after the task completes (with await)
    but that the task itself doesn''t return any meaningful data.

    * An async method that returns the generic Task<TResult> implies the task returns
    a value (it promises a value upon completion) and allows you to grab it when it''s
    done.


    Asynchronous programming can be tough. This chapter has hopefully demystified
    it to a large extent, but there are lots of additional corner cases that we haven''t
    even begun to consider. (For example, how do you handle exceptions when dealing
    with asynchronous programming?) Becoming an expert in asynchronous programming
    takes time and practice. But Hopefully, we''ve gotten that particular adventure
    off the right foot.'
