  md: "# Chapter 39 Other Features in C#\n\nThe calling code could keep the iterator\
    \ forever, or stop when it has completed its job.\n\nThe yield return syntax can\
    \ be used anywhere, just inside of methods that return IEnumerable<T> or (as we\
    \ will see in a second) IEnumerable<T> and their non-generic counterparts.\n\n\
    # Named Iterators\n\nThere's a second way to do iterators. Instead of implementing\
    \ the IEnumerable<T> interface and adding a GetEnumerator method, you can create\
    \ a method that returns an IEnumerable<T>. You can then use this in a foreach\
    \ loop whenever you want. This approach lets you have multiple iterators for a\
    \ single data collection class, and it lets you have parameters for those methods:\n\
    \n```\nclass Counter{\n    public IEnumerable<int> CountUp(int start, int end)\n\
    \    {\n        int current = start;\n        while (current < end)\n        {\n\
    \            yield return current;\n            current++;\n        }\n    }\n\
    \    public IEnumerable<int> CountDown(int start, int end)\n    {\n        int\
    \ current = start;\n        while (current > end)\n        {\n            yield\
    \ return current;\n            current--;\n        }\n    }\n}\n```\n\nYou can\
    \ then call these iterators like this:\n\n```\nCounter counter = new Counter();\n\
    \nforeach (int number in counter.CountUp(5, 50))\n    Console.WriteLine(number);\n\
    \nforeach (int number in counter.CountDown(100, 90))\n    Console.WriteLine(number);\n\
