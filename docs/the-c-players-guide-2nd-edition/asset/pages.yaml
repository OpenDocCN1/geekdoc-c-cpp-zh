  md: "# Approaches from the Early Days\n\nAt any rate, this is a bit simpler than\
    \ what we had before. Using the thread pool is preferable to not using it, but\
    \ it's also not our final solution. Let's keep looking.\n\n# Event-Based Asynchrony\n\
    \nThe idea with the event-based asynchronous approach is to call a method that\
    \ is known to take a long time and it returns immediately. When the method completes\
    \ asynchronously, an event on the class is raised.\n\nUsing Event-based asynchronous\
    \ like this, we have to subscribe to the right event, and in most cases, the asynchronous\
    \ method will end with the Async:\n\n```\nHighScoreManager highScore = new HighScoreManager();\n\
    hScore.HighScores += OnHighScoresLoaded;\nhScore.LookupScoresAsync();\n```\n\n\
    And elsewhere we define our event handler:\n\n```\nprivate void OnHighScoresLoaded(Score[]\
    \ highScores)\n{\n    // Do something with the results.\n    HighScores = highScores;\n\
    }\n```\n\nIn the past, there has been a common approach to long running tasks.\
    \ As you explore the Base Library C#, you inevitably see methods that end with\
    \ Async like this, which expect you to subscribe to a related event, and put your\
    \ code for dealing with the results in the event handler.\n\nWhile it works, it's\
    \ definitely a little annoying that you've separated your code into two pieces.\
    \ You have the part that sets up and calls the method, and then in a different\
    \ location, you have the method for dealing with the results. You'll see this\
    \ same problem in the next few iterations as well.\n\nA second problem we encounter\
    \ with this is the event subscription. The second time we make this request, it's\
    \ easy to forget that we may already have subscribed to the event (with the +=)\
    \ and might accidentally subscribe again. We can work around that but it creates\
    \ more things for you to remember as a developer.\n\n# The AsyncResult Pattern\n\
    \nMoving along our tour our next option is the AsyncResult pattern. This approach\
    \ is similar to various fast restaurants and other places where you make your\
    \ order or request, or you've got a ticket to get your order (results). Or you\
    \ can just take the ticket and stand at the counter waiting patiently.\n\nUsing\
    \ this pattern, you typically start with a synchronous method (let's call it X).\
    \ You add a BeginX and EndX method to the mix. The Begin method starts the synchronous\
    \ method in an asynchronous way and returns your \"ticket\" in the form of an\
    \ object that implements the IAsync interface. You can use this object to periodically\
    \ check if the asynchronous task is completed or you can call the End method,\
    \ passing in the IAsyncResult you got from calling the Begin method, which will\
    \ block, and cause the thread to do nothing until the results come back.\n\nThis\
    \ sometimes shows up in the form of three distinct named methods (X, BeginX, and\
    \ EndX) the easiest way to implement this is by using some functionality on the\
    \ Delegate class:"
