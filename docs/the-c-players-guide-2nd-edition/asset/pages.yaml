  md: "# Returning Stuff from a Method\n\n```\nstatic int GetNumberFromUser()\n{\n\
    \  int usersNumber = 0;\n\n  while(usersNumber < 1 || usersNumber > 10)\n  {\n\
    \    Console.Write(\"Enter a number between 1 and 10: \");\n    string usersResponse\
    \ = Console.ReadLine();\n    usersNumber = Convert.ToInt32(usersResponse);\n \
    \ }\n\n  return usersNumber;\n}\n```\n\nIf your method returns nothing (void),\
    \ you don't need a return statement. But if it does return something, we're required\
    \ to have a return statement.\n\nIf a method returns something, we can grab the\
    \ value that a method returns and do something with it, like put it in a variable\
    \ or do math with it. For instance, the code below will take the value that is\
    \ returned by the GetNumberFromUser method and store it in a variable:\n\n```\n\
    int usersNumber = GetNumberFromUser();\n```\n\nDoes that look a little familiar?\
    \ It should. We've been doing stuff like that all along! Now we finally understand\
    \ what's going on. For instance, when we've written lines like string usersResponse\
    \ = Console.ReadLine(); we're simply calling a method (ReadLine) that belongs\
    \ to the Console and getting the value that was returned by it!\n\nWhile the return\
    \ statement is often the last line in a method, it doesn't have to be. For instance,\
    \ we can have an if statement in the middle of a method that returns a value from\
