    This could alternatively be done with method call syntax, which would look like
    this:


    ```

    IEnumerable<Person> allAdults = allPeople.

    Where(person => person.Age > 18).

    OrderByDescending(person => person.Age);

    ```


    This uses lambda expressions, which we talked about in the previous chapter. This
    is another example of why lambda expressions are so powerful.


    # We''re Just Scratching the Surface


    Query expressions are one of those things that we just can''t cover completely
    in this book. There are entire books dedicated to query expressions, and Internet
