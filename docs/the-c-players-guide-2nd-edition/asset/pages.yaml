  md: '# Acknowledgements


    The task of writing a book is like writing software. When you start, you''re sure
    it''s only going to take a few weeks. It''ll be easy, you think. But as you start
    working, your seeing that you''re going to make changes, and lots of them. You
    need to rearrange entire chapters, add topics you hadn''t even thought about,
    and you discover that there''s not even going to be a place in your book for that
    chapter called Muppets of the Eastern Seaboard.


    I couldn''t have finished this book without help. I''ll start by thanking Jack
    Wall, Sam Hulick, Daniel Mansell, and the others who wrote to the Mass Effect
    trilogy. (You think I''m joking, don''t you?) I listened to their music nearly
    incessantly as I wrote this book. Because of them, every moment of the creation
    of this book felt absolutely epic.


    I need to also thank the many visitors to my XNA tutorials site, who provided
    feedback on the early versions of this book. In particular, I want to thank Jonathan
    Log, Thomas Allen, Daniel Bickler, and Mete ÇOM, who went above and beyond, spending
    hours of their own personal time, reading through this book and provided detailed
    critique and corrections. With their help, this book is far more useful and valuable.


    I also need to thank my mom and dad. Their confidence in me and their encouragement
    to always do the best I have caused me to do things I could never have done without.


    Most of all, I want to thank my beautiful wife, who was there to lift my spirits
    when the weight of writing a book became unbearable, who read through my book
    and gave honest, thoughtful, and creative feedback and guidance, and who lovingly
    pressed me to keep going on this book, day after day. Without her, this book would
    still be a random scattering of Word documents, buried in some obscure folder
    on my computer, collecting green silicon-based mold.


    To all of you, I owe you my sincerest gratitude.


    -RB Whittaker'
