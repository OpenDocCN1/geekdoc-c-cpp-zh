  md: '# The C# Player''s Guide

    Second Edition


    The C# Player''s Guide is the ultimate guide for people starting out with C#,
    whether you are new to programming, or an experienced vet. This guide takes you
    from your journey''s beginning, through the most challenging parts of programming
    in C#, and does so in a way that is casual, informative, and fun.


    +   * Get off the ground quickly, with a gentle introduction to C#, Visual Studio,
    and a step-by-step walkthrough of how to make your first C# program.

    * Learn the fundamentals of procedural programming, including variables, math
    operations, decision making, looping, methods, and an in-depth look at the C#
    type system.

    * Delve into object-oriented programming from start to finish, including inheritance,
    polymorphism, interfaces, and generics.

    * Explore some of the most useful advanced features of C#, and take on some of
    the most common tasks that a programmer will tackle.

    * Learn to control the tools and tricks of programming in C#, including the .NET
    framework, Visual Studio, dealing with compiler errors, and hunting bugs in your
    program.

    * Master the needed skills by taking on a large collection Try It Out! challenges
    and quizzes to ensure that you''ve learned the things you need.


    With this guide, you''ll soon be off to save the world (or take over it) with
    your own C# programs!


    Check out starboundsoftware.com/books/c-sharp for solutions to challenge problems,
    additional content, and support.


    ![](img/ad92120e75cb88980f77f3297768b8f0_368_0.png)'
  merge: -1
  pgno: 368
