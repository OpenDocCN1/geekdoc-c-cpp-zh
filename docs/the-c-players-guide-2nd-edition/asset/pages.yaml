  md: '# 288 Chapter 41 Getting the Most from Visual Studio


    # # Including and Excluding Files


    Sometimes you have a file that is not being used in your project. You may want
    to remove it from your project so you don''t keep it in your Solution Explorer.
    One option is to simply delete the file (right-click on it choose **Delete**)
    but sometimes, you don''t want to delete the file, just stop it being included
    in your solution.


    To exclude a file from your project, right-click and choose **Exclude From Project**.
    When you do this, the file will disappear from your Solution Explorer, but is
    not permanently deleted.


    You can also add a file back in your solution. This is also helpful if you create
    a file outside of Visual Studio and save it in your project. To do this, right-click
    on your project (not the solution at the very top) and choose **Add > Existing
    Item**. Browse to find the file you want to add and press Add. The file will now
    be included in your project.


    # ## Showing Line Numbers


    Being able to see line numbers is very important. A lot of times, when something
    goes wrong, the error message will tell you which line and number the problem
    occurred, or if you have to manually count every line to get down to line 937,
    that information would be pretty useless.


    Visual Studio has a way to turn on the display of line numbers. To do this, on
    the menu **Tools > Options**. This opens the Options box:


    ![](img/ad92120e75cb88980f77f3297768b8f0_310_0.png)


    In the panel on the left, click on the node that is under **Text Editor > C#**.
    When you click on this, the panel on the right will show several options. At the
    bottom under Settings, check the box that says "Line numbers". Once you have done
    this, you will see line numbers on the left side of your code, as shown below.'
