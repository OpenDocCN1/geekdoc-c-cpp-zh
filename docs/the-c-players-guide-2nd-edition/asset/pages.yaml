    Your Main method will look like this:\n\n```\nstatic void Main(string[] args)\
    \ {\n    int[] numbers = GenerateNumbers();\n    Reverse(numbers);\n    PrintNumbers(numbers);\n\
    }\n```\n\nThe GenerateNumbers method should return an array of 10 numbers. (For\
    \ bonus points, change the method to allow the desired length to be passed in,\
    \ instead of just being 10.)\n\nThe PrintNumbers method should simply use a for\
    \ or foreach loop to go down the array, at a time, and print out the items in\
    \ it.\n\nThe Reverse method will be the hardest. Give it a try and see what you\
