    # The byte, short, and long Types


    Speaking of limitations in the size of the int type, there are three other types
    that also store integers, but use a different number of bytes. As a result they
    have a different range that they can represent. These are the byte, short, and
    long types. The byte type is the smallest. It uses only one byte and can store
    values in the range 0 to 255. The short type is, but smaller than int. It uses
    two bytes, and can store values in the range of about -32,000 to +32,000. The
    long type is the largest of four, and eight bytes. It can store numbers roughly
    in the range of -9 quintillion to +9 quintillion. That is absolutely massive range,
    and it is only in very rare circumstances that it wouldn''t be enough.


    | Type | Bytes | Range |

    |---|---|--|

    | byte | 1 | 0 to 255 |

    | short | 2 | -32,768 to 32,767 |

    | int | 4 | -2,147,483,648 to 2,147,483,647 |

    | long | 8 | -9,223,372,036,854,775,808 to 9,223,372,036,854,775,808 |


    So that for different types we''ve learned (byte, short, int, and long) which
    can use a different number of bytes (1, 2, 4, and 8, respectively). The larger
    they are, the bigger the number they can store. You can think of these different
    types as different sizes of boxes to store different sizes of numbers.


    It is worth a bit of an example to show you how you create variables with these
    types. It is done exactly like earlier, when we created our first variable with
    the int type:


    ```

    byte aSingleByte = 34;

    aSingleByte = 17;


    short aNumber = 5039;

    aNumber = -4354;


    long aBigNumber = 395904282569;

    aVeryBigNumber = 13;

    ```


    # The byte, short, uint, and long Types


    We''ve already talked about four different types that store all integers of various
    sizes. Now, I''m going to introduce you four additional types that are related
    to the ones we''ve already discussed.


    Before introducing to to, I should start by describing signed types vs. unsigned
    types. When I refer to a type as signed, I can mean it includes a + or - sign
    in it. In other words, the values of a signed type can be positive or negative.
    If you look back at the four we already know about, you''ll see that short, int,
    and long are all signed. You can store positive or negative numbers. The byte
    type, on the other hand, has no sign. (It is typically assumed that no sign is
    the equivalent of being positive, but that doesn''t have to be the case.)'
