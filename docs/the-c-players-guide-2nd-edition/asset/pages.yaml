  md: "# 146 Chapter 21 Inheritance\n\n```\nclass Square : Polygon // Inheritance!\n\
    {\n    //...\n}\n```\n\nInside the class, we simply indicate any new stuff that\
    \ the Square class has that the Polygon class doesn't have. Our completed Square\
    \ class might look like this:\n\n```\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Text;\n\nnamespace Inheritance\n{\n    class\
    \ Polygon\n    {\n        public float Size { get; set; }\n        public Square(float\
    \ size)\n        {\n            Size = size;\n            NumberOfSides = 4;\n\
    \        }\n    }\n}\n```\n\nSo now square will have a Size property, but in addition,\
    \ it inherits instance variables, properties, and methods that were in the Polygon\
    \ class. The Square class also has a NumberOfSides that it inherits from the Polygon\
    \ class.\n\nOne other thing that we should mention is that a class can inherit\
    \ from a class that inherits from another class. You're allowed to have as many\
    \ layers of inheritance as you want.\n\n# Using Derived Classes\n\nPolygon polygon\
    \ = new Polygon(3); // a triangle\nSquare square = new Square(4.5f); // a square,\
    \ which is a polygon with 4 sides of 4.5.\n\nBut here's the thing: Because the\
    \ computer knows that a Square is a special type of Polygon, you can actually\
    \ use the Square type anywhere you could use a Polygon type. After all, a Square\
    \ is a Polygon!\n\n```\nPolygon polygon = new Square(4.5f);\n```\n\nAs the program\
    \ is running, we can check if we're using the Polygon variable, we only have access\
    \ to the stuff that a Polygon has. But as the program is running, we can only\
    \ treat it as a Polygon. There's a chance that it is a Square (or another derived\
    \ class), but the computer assumes it. So we won't be able to automatically use\
    \ stuff created in the Square class in this particular case. Because our variables\
    \ use the Polygon type, we can only work with the things the Polygon type defines."
