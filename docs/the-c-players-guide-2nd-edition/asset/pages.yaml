  md: '# Chapter 36 Query Expressions


    Try It Out!

    BMI. In the world of health, a number called a Body Mass Index (BMI) can be calculated
    for a person given their height and weight. While not perfect, this gives people
    an idea of how much they weigh compared to their "ideal weight." Using the Person
    class defined earlier in this chapter, and assuming Height is measured in inches
    and Weight is measured in pounds, the formula for BMI is:


    ```

    BMI = \frac{703 \cdot weight}{height^2}

    ```


    +   1. Write a query expression to find all people who are overweight, defined
    by a BMI higher than 25.

    2. Write another query expression to find all people who are in their ideal weight,
    defined by a BMI > 20 and < 25.


    # Multiple from Clauses


    One interesting thing that you can do with a query expression is combine multiple
    from clauses into one query. Multiple from clauses means you can pull stuff from
    multiple places.

    You can also use a second from clause to dig further into what you''re looking
    at in the first from clause. For instance, let''s say the items in the first from
    clause have a member that is another list. A second from clause would allow you
    to look at all of the items in that list.


    ```

    For instance, take the Person class and add another property to it, containing
    a List<Person>:

    public class Person

    {public string FirstName { get; set; }

    public string LastName { get; set; }

    public int Age { get; set; }

    public int Height { get; set; }

    public int Weight { get; set; }

    public List<Person> Children { get; set; }

    }

    ```


    You could create a query expression with two from clauses like this, which creates
    a list of all people who are parents of teenagers:


    ```

    // Finds all parents of teenagers.

    IEnumerable<Person> parentsOfTeenagers =

    from person in allPeople

    from child in person.Children

    where child.Age >= 13 && child.Age < 20

    select person;

    ```


    The second from clause does not need to be pulled from a member of the object
    retrieved from the first clause. It can be entirely different. This might look
    something like the code below, though this particular case doesn''t doing anything
    amazing:


    ```

    IEnumerable<Person[]> allPairings =

    from employee in allEmployees

    ```'
