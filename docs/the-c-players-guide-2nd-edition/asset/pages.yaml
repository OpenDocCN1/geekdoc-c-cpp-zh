    \ results like this...\n        return new string[]{\n            \"Here are some\
    \ great results.\",\n            \"Aren't they neat?\",\n            \"I found\
    \ 1.2 billion things, but you will only look at the first 10.\"\n        };\n\
    \    }\n}\n```"
