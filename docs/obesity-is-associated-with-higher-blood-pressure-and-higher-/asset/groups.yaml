    with increased blood pressure, a greater proportion of high blood pressure, and
    alterations in the circulatory and renal RAS with subjects with BMI < 85th percentile.
    Subjects with overweight/obesity had higher Ang II and lower Ang-(1-7) as well
    as a higher ratio of Ang II relative to Ang-(1-7) in the plasma. Compared with
    term-born peers, adolescents born preterm have a higher ratio of Ang II relative
    to Ang-(1-7) in the plasma, and obesity magnifies whether preterm-born adolescents
    with overweight/obesity have a higher ratio of plasma Ang II relative to Ang-(1-7)
    compared with term-born adolescents with obesity¹¹².. In the current study we
    confirmed that within subjects born preterm, obesity had detrimental effects on
    the circulatory RAS that may be compound attributed to perinatal programming events.


