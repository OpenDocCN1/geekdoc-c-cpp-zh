    # Discussion


    Adolescents born preterm with low body weight, overweight/obesity was associated
    with increased blood pressure, a greater proportion of high blood pressure, and
    alterations in the circulatory and renal RAS with subjects with BMI <85th percentile.
    Subjects with overweight/obesity had higher Ang II and lower Ang-(1-7) as well
    as a higher ratio of Ang II relative to Ang-(1-7) in the plasma. Compared with
    term-born peers, adolescents born preterm have a higher ratio of Ang II relative
    to Ang-(1-7) in the plasma, and obesity magnifies whether preterm-born adolescents
    with overweight/obesity have a higher ratio of plasma Ang II relative to Ang-(1-7)
    compared with term-born adolescents with obesity^{12}. In the current study we
    confirmed that within subjects born preterm, obesity had detrimental effects on
    the circulatory RAS that may compound attributed to perinatal programming events.


    A shift in the circulatory RAS towards higher Ang II expression, or tone, and
    lower Ang-(1-7) may explain the higher blood pressure in adolescent subjects with
    overweight/obesity could serve as a mechanism for further increasing the risk
    of hypertension and cardiovascular disease in adulthood that is known to be associated
    with pregnancy. Upregulation of Ang II in the expansion of Ang-(1-7) is associated
    with persistently elevated blood pressure as well as inflammation and fibrosis
    in various systems such as the vasculature, kidneys, and heart that occur in vasoconstriction
    and reduced nitric oxide production leading to increased oxidative stress^{20,21}.
    Obesity is associated with dysregulation of the RAS which may increase the risk
    of hypertension and cardiovascular disease seen in patients with obesity^{22,23}.
    Our finding that overweight/obesity is associated with higher blood pressure in
    adolescents born preterm supports similar findings by Rootveelt et al., although
    this did not fully explain the Ang II or Ang-(1-7) pathways in the plasma and
    urine^{24}. Thus, obesity may provide an additive effect on the development of
    hypertension and cardiovascular disease in individuals born preterm that undergo
    prematity-induced perinatal programming of the RAS.


    Subjects with overweight/obesity also had a higher ratio of urinary Ang II to
    Ang-(1-7) that approached statistical significance, indicating a possible shift
    in the renal RAS that increases the deleterious Ang II pathway but reduces the
    beneficial Ang-(1-7) pathway. Evidence


