    # Obesity is Associated with Higher Blood Pressure and Lower Levels of Angiotensin
    II but Lower Angiotensin-(1-7) in Adolescents Born Preterm


    Andrew M. Smith, MD$^{a,bc}$, Patricia A. Nixon, PhD$^{a,d}$, Mark C. Chappell,
    PhD$^{b,e}$, Debra I. Diz, PhD$^{b,e}$, Gregory B. Russ, MS$^{f}$, Hossam A. Shaltout,
    PhD$^{g,h}$, T. Michael O''Shea, and Lisa K. Washburn, MD$^{b}$


    $^a$Department of Medicine, Wake Forest School of Medicine

    $^b$Cardiovascular Sciences Center, Wake Forest School of Medicine

    $^c$Department of Public Health Sciences, Department of Epidemiology and Prevention,
    Wake Forest School of Medicine

    $^d$Department of Health and Exercise Science, Wake Forest University

    $^e$Department of Surgery-Hypertension and Vascular Research, Wake Forest School
    of Medicine

    $^f$Department of Public Health Sciences, Department of Biostatistics Sciences,
    Wake Forest School of Medicine

    $^g$Department of Obstetrics and Gynecology, Wake Forest School of Medicine, Winston
    Salem, North Carolina, USA

    $^h$Department of Pharmacology and Toxicology, School of Pharmacy, University
    of Alexandria, Egypt

    $^i$Department of Pediatrics, University of North Carolina School of Medicine,
    Chapel Hill, North Carolina


    # Abstract


    **Objectives**—To evaluate if obesity is associated with increased angiotensin
    II (Ang II) and decreased angiotensin II-(1–7) in the circulation and urine among
    adolescents born prematurely.


    **Study design**—In a cross-sectional analysis of 175 14-year-olds born preterm
    with low birth weight, we quantified plasma and urinary II and Ang-(1–7) and compared
    their levels between subjects with obesity/body mass index; 55th percentile, n=61
    and those with mass index <85th percentile (n = 114) using generalized linear
    models, adjusted for race and anticortosteroid exposure.


    **Results**—weight/obesity was associated with higher systolic blood pressure
    and a greater proportion with high blood degree. After adjustment for confounders,
    weight/obesity was associated with an elevated ratio of plasma Ang II to Ang(β
    0.55, 0.57, 95% CI 0.23 to 0.91) and higher Ang II (β 0.21 pmol/l; 95% CI 0.03
    to 0.39) but lower Ang-(1–7) (β -0.37 mmol/l; 95% CI -0.7 to 0.4). Weight/obesity
    was associated with a higher ratio of urinary Ang II to Ang-(1–7) (β 0.21, 95%
    CI -0.02 to 0.44), an effect that reached statistical significance.


    **Conclusions**—Among preterm adolescents, overweight/obesity was associated with
    increased Ang II but reduced Ang-(1–7) in the circulation and the kidney as well
    as higher blood pressure. Obesity may cause the increased risk of hypertension
    and cardiovascular disease in individuals born prematurely by augmenting the premataturity-imbalance
    in the renin-angiotensin system.


    # Keywords


    cardiovascular disease; hypertension; perinatal programming; renin-angiotensin
    system


    The survival of infants born preterm has increased due to advances in preclinical
    and neonatal care, but premature birth and early life events increase the risk
    for chronic health conditions such as hypertension and cardiovascular disease.¹¹,³
    The mechanisms behind this elevated risk are described incompletely but may include
    programmed alterations in various hormonal pathways. Perinatal events have been
    shown to induce changes in the renin-angiotensin system (RAS), a critical regulator
    of blood pressure and overall cardiovascular function⁴. In addition to the angiotensin-converting
    enzyme (ACE) / angiotensin II (Ang II) / Ang type I receptor pathway, the RAS
    also consists of the regulatory ACE / Ang-(1–7)/Mas receptor which acts in concert
    to counteract Ang II actions by promoting vasodilation and sodium excretion as
    well as inhibiting inflammation and fibrosis⁵⁶. Alterations in the RAS that promote
    Ang II and suppress Ang-(1–7) are now known to be linked to hypertension⁷⁸.


    Obesity is also associated with increased Ang II expression which may lead to
    higher blood pressure but its effect in individuals born prematurely is unknown⁹.
    Race and antenatal corticosteroid exposure are associated with alterations in
    the RAS and may affect obesity''s influence¹¹. We recently demonstrated that adolescents
    born with very low birth weight had higher blood pressure and a higher ratio of
    plasma Ang II to Ang-(1–7) in the circulation. We hypothesized that obesity is
    associated with higher Ang II and lower Ang-(1–7) in adolescents born².


    # Methods


    Subjects were recruited from a prospective cohort of 175 infants born prematurely
    with low birth weight (<1500 grams) between January 1 and June 30. The Institutional
    Review Boards of Wake Forest School of Medicine approved the study. Written parental
    informed consent and assent were obtained. A nurse reviewed medical records to
    obtain birth characteristics including antenatal corticosteroid exposure, maternal
    hypertension pregnancy, maternal smoking, cesarean delivery, gestational age,
    and birth weight. Subjects were categorized as small-for-gestational if their
    birth weight was less than 10th percentile for gestational age.¹³. At the 14-year
    visit, demographic data were recorded including parental-reported race (black
    or non-black), current Medicaid used, and patient smoking status. Measurements
    of the subjects'' height, weight were measured, and the waist-to-height ratio
    and mass index (BMI) were calculated. Subjects were categorized as overweight/obesity
    if their BMI ≥85th percentile for age and according to established pediatric recommendations⁴.


    Blood pressure was measured according to established pediatric guidelines by trained
    staff using a mercury manometer and each subject was seated for a minimum of five
    minutes with their arms fully supported. Supported blood pressure (SBP) and diastolic
    blood pressure (DBP) were recorded as the average of three measurements (1 minute
    apart), and blood pressure z-scores were calculated according to age and height-specific
    value. According to pediatric recommendations, we defined high blood pressure
    as SBP or DBP ≥120/80 mmHg and further classified the stages of hypertension as
    i) elevated blood pressure as SBP was 120 to 140 mmHg but DBP < 80 mmHg; ii stage
    1 hypertension if SBP was 130 to 139 mmHg or DBP was 80 to 90 mmHg; and iii) stage
    2 hypertension if SBP was ≥140 mmHg or DBP was ≥90 mmHg.


    Detailed descriptions of RAS measures have been extensively described in previous
    publications¹², blood samples were collected for measurement of plasma renin activity,
    aldosterone, Ang II, and Ang(1–7). Peptide samples were immediately collected
    in a tube containing a cocktail of infants. Spot urine samples were immediately
    collected in a tube with HCl to prevent peptide degradation. Ang II, Ang(1–7),
    plasma renin activity, and aldosterone were analyzed using radioimmunoassay. ACE
    and ACE2 were assayed in non-acidified urine samples, ACE and ACE2 protein content
    were measured using ELISA¹⁵.


    Subjects reported their sexual maturity in private using a self-reported questionnaire
    on age 1-5, and we reported the percentage of subjects with a score of 5 in either
    of the two determinants of secondary sexual characteristics (pubic hair in all
    subjects plus breast development in females and external genitalia development
    in males)⁵⁶.

