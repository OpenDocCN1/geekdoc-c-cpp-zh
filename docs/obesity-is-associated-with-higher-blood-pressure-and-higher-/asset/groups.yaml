    South 等人


    基于人类标准（R&D Systems, Minneapolis, Minnesota, U.S.A.）。尿肌酐水平通过可追溯至同位素质谱法的改良 Jaffe
    法测定。我们计算了血浆和尿液中 Ang II 与 Ang-(7) 的比值，计算了尿中 ACE 与 ACE2 的比值，并校正了尿中 Ang II、Ang-(7)、ACE
    和肌酐的浓度。对于低于实验室检测下限的样本结果，测量值被赋予根据检测下限平方根¹/⁸ 计算的值。


    ## 统计分析


    我们使用了描述性统计，包括中心趋势测量、离散程度和频率。我们将连续变量的分布报告为均值加标准差或四分位距。我们使用卡方检验、费舍尔精确检验、t 检验和 Wilcoxon
    秩和检验进行组间比较，并使用 Pearson 或 Spearman 系数检验连续变量之间的相关性。双侧 alpha 水平小于 0.05 被认为具有统计学意义。


    我们利用广义线性模型来估算超重/肥胖与 RAS 结局之间的关系。通过对数转换改善了结局的分布特征。我们根据文献先验地采用无环图确定潜在的混杂因素，并在模型中足够的混杂因素集中识别了种族和祖先皮质醇暴露¹⁰，¹¹。所有分析均使用
    Windows 版 SAS 系统 7.11 版本（SAS Institute Inc, Cary, NC）的 Enterprise Guide 软件。


    ## 结果


    在入组的 193 名受试者中，排除了 5 人（严重的医学问题和 2 例双胞胎）。177 名受试者参加了第三年的研究；175 人提供了尿液样本，121 人提供了血样本。受试者的围期和青少年期特征见表
    I。35% 的受试者在 14 岁时出现超重/肥胖。在围期特征中，与 BMI < 第85 百位数的相比，超重/肥胖受试者的高血压妊娠和孕期母亲吸烟率更高。在
    14 岁时，超重/肥胖受试者的体重、BMI 和腰高比中值较大，且更有可能性发育评级为 5。超重/肥胖组在 14 时的平均收缩压（109.9 ± 9.1 对
    104.4 ± 7.7 mmHg）和平均舒张压 z 分（0.04 ± 0.8 对 -0.43 ± 0.9）。超重/肥胖受试者的血压率更高（20% 对 8%）。


    BMI 与血浆 Ang I 与 Ang-(7) 呈负相关（图 2）。与 BMI < 第85 百位数的受试者相比，超重/肥胖受试者的血浆 Ang II/Ang-(1)
    比值较高、Ang II 较高，且 Ang-(7) 中值较低（表 1）。血浆肾素活性和醛酮的中值没有差异。血浆中 Ang II/Ang-(7) 比值、Ang
    II 和 Ang-(7) 的差异在调整了潜在混杂因素种族和产前皮质醇暴露后依然存在（表 2）。与 BMI < 第85 百位数的相比，超重/肥胖与较高的 Ang
    II/Ang-(1-7) 比值相关（调整后 β: 0.57，95% CI 0.23 至 0.91），以及较高的 Ang II（调整后 β: 0.21 pmol/l，95%
    CI 0.03 至 0.39）和较低的 Ang-(1-7)（调整后 β: -0.37 pmol/l，95% CI -0.7 至 -0.04）。


    在基线时，使用 Ang II/Ang-(1-7) 比值、II/肌酐、ACE/肌酐、ACE2/肌酐以及 ACE/ACE2 比值，RAS 各组分的中值之间没有差异（表
    1）。然而，在控制种族和产前皮质醇暴露后，与 BMI < 第85 百位数的相比，超重/肥胖与较高的尿 Ang II/Ang-(1-7) 比值相关（β: 0.21，95%
    CI -0.02 至 0.04），该结果接近统计学意义（表 2）。


    ## 讨论


    对于早产且体重轻的青少年，与 BMI < 第85 百位数的受试者相比，超重/肥胖与血压升高、高血压比例增加以及循环和肾性 RAS 的改变有关。超重/肥胖受试者的血浆中较高的
    Ang II、较低的 Ang-(1-7) 以及较高的 Ang II 相对 Ang-(1-7) 比值。与足月出生同龄人相比，早产青少年血浆中 Ang II/Ang-(1-7)
    比值较高，且肥胖放大了超重/肥胖早产青少年是否比足月肥胖青少年具有更高的血浆 Ang II/Ang-(1-7) 比值¹²²。本研究证实，在早产受试者中，肥胖对循环
    RAS 有不利影响，这可能归因于围期编程事件。


