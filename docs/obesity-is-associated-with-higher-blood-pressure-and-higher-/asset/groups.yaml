    # 早产青少年的肥胖与较高的血压及较低的血管紧张素水平有关，但血管紧张素-(1-7)水平较低


    Andrew M. Smith, MD$^{a,bc}$, Patricia A. Nixon, PhD$^{a,d}$, Mark C. Chappell,
    PhD$^{b,e}$, Debra I. Diz, PhD$^{b,e}$, Gregory B. Russ, MS$^{f}$, Hossam A. Shaltout,
    PhD$^{g,h}$, T. Michael O''Shea, and Lisa K. Washburn, MD$^{b}$


    $^a$维克森林医学学院医学科

    $^b$维克森林医学学院血管科学中心

    $^c$维克森林医学学院公共卫生科学、流行病学与预防系

    $^d$维克森林大学健康与运动科学系

    $^e$维克森林医学学院外科-高血压与血管研究中心

    $^f$维克森林医学学院生物统计科学系

    $^g$美国北卡罗莱纳州温斯顿-塞勒姆，维克森林医学学院产产科

    $^h$埃及亚历山大大学药学院药理学与毒理学

    $^i$北卡罗莱纳大学医学院儿科，恰佩尔希尔


    # 摘要


    **目标**——评估早产青少年肥胖是否与循环和尿液中血管紧张素II（Ang II）增加以及血管紧张素II-(1–7)减少有关。


    **研究设计**——在对175名出生体重偏轻的14岁早产青少年的横截面分析中，我们量化了血浆和尿液中的II和Ang-(1–7)，并使用广义线性模型（对种族和抗糖皮质激素暴露进行校正），比较了肥胖/体重质量指数第55百分位数（n=61）组与体重指数小于第85百分位数（n
    = 114）受试者之间的水平。


    **结果**——体重/肥胖与较高的收缩压和较高的血压比例有关。在校正混杂因素后，体重/肥胖与血浆Ang II与Ang(1–7)的比升高（β 0.55, 0.57,
    95% CI 0.23 to 0.91）以及较高的Ang II（β 0.21 pmol/l; 95% CI 0.03 to 0.39）但较低的Ang-(1–7)（β
    -0.37 mmol/l; 95% CI -0.7 to 0.4）有关。体重/肥胖与尿液Ang II与Ang-(1–7)的比值较高（β 0.21, 95%
    CI -0.02 to 0.44），具有统计学意义。


    **结论**——在早产青少年中，超重/肥胖与循环和肾脏中Ang II增加、Ang-(1–7)减少以及血压升高有关。肥胖通过加剧肾素-血管紧张素系统中的失衡，可能导致早产个体高血压和心血管疾病的风险增加。


    # 关键词


    心血管疾病；高血压；围产编程；肾素-血管紧张素系统


    由于临床前和新生儿护理的进步，早产婴儿的生存率已经提高，但早产和生命早期事件增加了高血压和心血管疾病等慢性健康状况的风险¹¹³。这种风险增加的机制描述尚不完全，但可能包括各种激素通路的程序性改变。已证明围产事件会诱导肾素-血管紧张素系统（RAS）的变化，这是血压和整体血管功能的关键调节因子⁴。血管紧张素转换酶（ACE）血管紧张素II（Ang
    II)/Ang I型受体通路外，RAS还由调节性ACE/Ang-(1–7)/Mas受体组成，它们共同作用通过促进血管扩张和钠排出以及抑制炎症和纤维化来对抗Ang
    II的作用⁵⁶。目前已知促进Ang II产生和抑制Ang-(1–7)的RAS改变与高血压有关⁷⁸。


    肥胖与Ang II表达增加有关，这可能导致血压升高，但其对早产个体的影响尚不清楚⁹。种族和产前糖皮质激素暴露与RAS的改变有关，并可能影响肥胖的影响¹¹。我们最近证明，出生体重极低的青少年血压较高，且循环中血浆Ang
    II与Ang-(1–7)的比值较高。我们假设肥胖与青少年中较高的Ang II和较低的Ang-(1–7)有关²。


    # 方法


    受试者从1月1日至6月30日期间175名出生体重偏轻（<1500克）的早产婴儿的前瞻性队列中招募。维克森林医学学院机构审查委员会批准了该研究。获得了家长的书面知情同意和孩子的同意。护士审查了病历以获取出生特征，包括产前糖皮质激素暴露、孕期母亲高血压、母亲吸烟、剖宫产、胎龄和出生体重。如果受试者的出生体重小于胎龄的第10百分位数，则归类为小于胎儿¹³。在14岁的随访中，记录了人口统计学数据，包括父母报告的种族（黑色人或非黑色人）、当前使用的Medicaid情况和患者的吸烟状况。测量了受试者的身高、体重，并计算了腰高比和体重指数（BMI）。根据既定的儿科建议，如果受试者的BMI大于年龄的第85百分位数，则将其归类为超重/肥胖⁴。


    根据既定的儿科指南，由训练人员使用水银血压计测量血压，每位受试者坐姿至少五分钟，手臂完全支撑。收缩压（SBP）和舒张压（DBP）记录为三次测量（间隔1分钟）的平均值，并根据年龄和身高特定的值计算血压z-评分。根据儿科建议，我们将高血压定义为SBP或DBP≥120/80
    mmHg，并进一步将高血压分级：i）血压升高，SBP在120至140 mmHg之间但DBP<80 mmHg；ii）1级高血压，SBP在130至139 mmHg之间或DBP在80至90
    mmHg之间；iii）2级高血压，如果SBP≥140 mmHg或DBP≥90 mmHg。


    关于RAS测量的详细描述在之前的出版物中已有详细介绍¹²，血样本用于测量血浆肾素活性、醛固酮、Ang II和Ang-(1–7)。肽样本立即收集在含有婴儿鸡尾液的管中。点尿样立即收集在含有HCl的管中以防止肽降解。Ang
    II、Ang-(1–7)、血浆肾素活性和醛固酮使用放射免疫法进行分析。在未酸化的尿样样本中检测ACE和ACE2，ACE和ACE2蛋白含量使用酶免疫吸附（ELISA）测量¹⁵。


    受试者通过私密问卷报告年龄1-5成熟，我们报告了在第二性征的两个决定因素（所有受试者的阴毛以及女性的乳腺发育和男性的外生殖器发育）中得分为5分的百分比⁵⁶。


