    from experimental models in rodents indicates that urinary angiotensin peptide
    levels are independent of glomerular filtration of peptides in the circulation
    and thus indicate generation within the tubules⁵ The exact mechanisms are unclear
    but could be due increased tubular formation or reduced metabolism of Ang-(1–7).
    We found no differences in urinary ACE or ACE2 in the current study, but other
    peptides such as neprilysin, thin oligopeptide, and dipeptidyl pept3 may contribute
    to the tubular processing of angiotensins²⁶, Additional study is warranted to
    better define this shift in the renal RAS by expanding our analysis of these peptides
    in the urine.


    The shift in the renal RAS that we describe could further contribute to the development
    of hypertension and cardiovascular disease by stimulating sodium retention, raising
    blood pressure, and promoting renal activation and fibrosis in part through lower
    nitric oxide production and increased oxidative stress⁷''⁸ Experimental models
    and human studies of the fetal-programming effect of anten corticosteroid exposure
    on the renal RAS also demonstrate this shift in the kidneys towards Ang II, leading
    to elevated blood pressure and in, decreased renal function¹¹. Our findings suggest
    that adolescents born prematurely, a group already at increased risk for disease²⁹,
    overweight/obesity may augment this shift in the renal RAS towards Ang II and
    from Ang-(1–7).


    A limitation of this study is that plasma renin activity and aldosterone were
    measured, levels of neprilysin, in the circulation, ACE and ACE2 that can generate
    and metabolize Ang II and Ang-(1–7) were assessed³ Further study is warranted
    to establish whether alterations in the synthesizing components of the RAS are
    associated with higher Ang II or lower Ang-(1–7) in the overweight/obesity group.
    We did not fully examine additional factors that might influence the RAS, including
    dietary salt intake or genetic profiles. Furthermore, the sex hormones including
    estrogen and testosterone are known to influence the RAS, and did not measure
    their levels.


    Potential strategies to prevent or treat disease in individuals born premature
    could target the RAS to inhibit Ang II and augmented expression of Ang-(1–7).


