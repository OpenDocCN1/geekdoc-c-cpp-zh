    # Statistical Analyses


    We used descriptive statistics including measures of central tendency and dispersion
    and frequencies. We reported continuous variable distributions as mean with standard
    deviation or interquartile range. We used Chi-square test, Fisher exact test,
    t-test, and Wilcoxon rank-sum test for between-group comparisons and Pearson or
    Spearman coefficients to test for correlations between continuous variables. A
    2-sided alpha level less than 0.05 was considered statistically significant.


    We utilized generalized linear models to estimate the relationship between overweight/
    obesity and the RAS outcomes. Distributional characteristics of the outcomes were
    improved with logarithmic transformations. We employed acyclic graphs to determine
    potentially confounding factors based on the literature a priori and identified
    race and ancestral cortisol exposure in our sufficiently met set of confounders
    in the model¹⁰,¹¹. We used Enterprise Guide software, Version 7.11 of the SAS
    System for Windows (SAS Institute Inc, Cary, NC) for all analyses.


    # Results


    Within the cohort of 193 enrolled subjects, 5 were excluded (3 significant medical
    problems and 2 twins). One hundred and seventy-seven subjects participated in
    the third study year; 175 subjects provided urine samples and 121 subjects provided
    blood specimens. Subjects'' perinatal and adolescent characteristics are noted
    in Table I. Thirty-five percent of subjects had overweight/obesity at 14 years.
    Among the perinatal characteristics, subjects with overweight/obesity had higher
    rates of hypertensive pregnancy and maternal smoking during pregnancy compared
    with BMI <85⁵th percentile. At 14 years, subjects with overweight/obesity had
    greater median values for weight, BMI and waist-to-height ratio, and were more
    likely to have a sexual maturity rating of 5. The overweight/obesity group had
    mean systolic blood pressure (109.9 ±9.1 vs 104.4 ±7.7 mmHg) and mean diastolic
    blood pressure z-score (0.04 ± 0.8 vs. -0.43 ± 0.9) at 14 years. Subjects with
    overweight/obesity had a greater rate of high blood pressure (20% vs. 8%).


    BMI correlated with plasma Ang I inversely with Ang-(7) (Figure 2). Subjects with
    overweight/obesity had a higher median ratio of plasma Ang II to Ang-(1), higher
    Ang II, and lower median-Ang-(7) compared with subjects with BMI <85⁵th percentile
    (Table 1). There were no differences in median plasma renin activity and aldosterone.
    The differences in Ang II to Ang-(7) ratio, Ang II, and Ang-(7) in the plasma
    persisted after the adjustment for the potentially confounding factors race and
    antenatal


