    30, 1962, at a renal postnatal center (Forsyth Medical Center in Winston Salem,
    NC). As part of a broader study of cardiovascular outcomes in adolescents born
    prematuresly, we evaluated the cohort at 14 years of age (Figure 1); Inclusion
    criteria were stringent, birth weight < 1500 grams, follow-up clinical information
    from at least 1 year of age for gender, and successful contact at age 14 years.
    Exclusion criteria were major congenital anomalies or genetic syndromes and being
    a baby of the subjects. Subjects were assessed at three study visits; we report
    measurements conducted at the third visit. The Institutional Review Boards of
    Wake Forest School of Medicine and Forsyth Center approved the study. Written
    parental or legal informed consent and assent were obtained. Subjects were compensated
    upon completion of all visits, and parents/guardians received compensation for
    travel expenses.


    A nurse reviewed medical records and research databases to obtain material and
    subjects'' birth characteristics, including antenatal corticosteroid exposure,
    maternal hypertension pregnancy, maternal smoking during pregnancy, cesarean delivery,
    gestational age, and birth weight. Subjects were categorized as small-for-gestational
    if their birth weight was less than the 10th percentile for gestational age.¹³
    At the 14-year visit, demographic data were recorded including parental-reported
    race (black or non-black), current Medicaid used, and patient smoking status.
    Measurements of the subjects'' height, weight, and weight were measured, and the
    waist-to-height ratio and mass index (BMI) were calculated. Subjects were categorized
    as having overweight/obesity if their BMI was ≥85th percentile for age and according
    to established pediatric recommendations¹⁴ Subjects reported their sexual maturity
    in private using a self-reported questionnaire on age of 1-5, and we reported
    the percentage of subjects with a score of 5 in either of the two determinants
    of secondary sexual characteristics (pubic hair in all subjects plus breast development
    in females and external genitalia development in males)¹⁵.


    Blood pressure was measured according to established pediatric guidelines by trained
    staff using a mercury manometer and each subject was seated for a minimum of five
    minutes with their arms fully supported. Supported blood pressure (SBP) and diastolic
    blood pressure (DBP) were recorded as the average of three measurements (1 minute
    apart), and blood pressure z-scores were calculated according to age, and height-specific
    value¹⁷ According to pediatric recommendations, we defined high blood pressure
    as SBP or DBP ≥120/80 mmHg and further classified the stages of hypertension as
    i) elevated blood pressure as SBP was 120 to 140 mmHg but DBP < 80 mmHg; ii stage
    1 hypertension if SBP was 130 to 139 mmHg or DBP was 80 to 90 mmHg; and iii) stage
    2 hypertension if SBP was ≥140 mmHg or DBP was ≥90 mmHg.


    Detailed descriptions of RAS measures have been extensively described in previous
    publications¹², blood samples were collected for measurement of plasma renin activity,
    aldosterone, Ang II, and Ang(1–7). Peptide samples were immediately collected
    in a tube containing a cocktail of infants. Spot urine samples were immediately
    collected in a tube with HCl to prevent peptide degradation. Ang II, Ang(1–7),
    plasma renin activity, and aldosterone were analyzed using radioimmunoassay. ACE
    and ACE2 were assayed in non-acidified urine samples, ACE and ACE2 protein content'
