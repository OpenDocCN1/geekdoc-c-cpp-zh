  \n如果你正在运行 Rails 2.3.x 应用，并且想在 `vendor/rails` 目录下拥有 Rails，请运行以下命令：\n\n```bash\n%\
  \ rake rails:freeze:edge RELEASE=2.3.5\n```\n\n或者，你也可以从 GitHub 的 [`github.com/rails/rails/tree/master`](http://github.com/rails/rails/tree/master)\
  \ 下载 Rails 发布并将其放入 `vendor/rails`。\n\n## Devise\n\nDevise 是一个 Rails 身份验证解决方案，以 Rails\
  \ 引擎的形式分发，理论上，这使其可以用更少的步骤添加到应用程序中。它非常模块化，允许你选择一组可能需要的身份验证功能。这些步骤基于 [`github.com/plataformatec/devise`](http://github.com/plataformatec/devise)\
  \ 中的 Readme。\n\nRails 3 和 Rails 2 使用不同版本的 `Devise` gem。对于 Rails 3，请通过以下方式安装：\n\n\
  ```bash\ngem install devise\n```\n\n对于 Rails 2，请通过旧版本安装：\n\n```bash\ngem install\
  \ devise --version=1.0.8\n```\n\n在 Rails 3.x 中，gem 由 `bundler` 管理。你需要向 `Gemfile`\
  \ 中添加以下行以包含 `Devise` gem：\n\n```ruby\ngem \"devise\"\n```\n\nDevise 通过生成器（generator）创建其文件。Rails\
  \ 3 的命令如下：\n\n```bash\nrails generate devise:install\n```\n\n这是 Rails 2 的命令：\n\n\
  ```bash\nruby script/generate devise_install\n```\n\n在 Rails 3 中，Devise 在 `config/initializers/devise.rb`\
  \ 中创建一个初始化文件，其中有许多潜在选项，我们暂时将其保持不变。它还会创建一个用于国际化的本地化文件（locales）。生成器还在控制台中放置了一些实用的手动任务，要求我们执行以下操作：\n\
  \n1. 在 `config/environments/development.rb` 文件中添加行 `config.action_mailer.default_url_options\
  \ = { :host => ’localhost:3000’ }`。在实际系统中，我们需要为其他环境添加其他行。\n2. 取消 `config/routes.rb`\
  \ 中 `root :to => \"welcome#index\"` 行的注释。\n3. 在 `app/views/layouts/application.html.erb`\
  \ 的 body 标签之间添加以下两行：\n\n```html\n<p class=\"notice\">< notice %></p>\n<p class=\"\
  alert\">< alert %></p>\n```\n\n现在我们可以用这行代码创建用户模型了。请注意，如果你正在构建此应用的 RSpec 版本，则你必须在继续操作之前在\
  \ `Gemfile` 中包含 RSpec。更多信息请参阅 *RSpec and Rails 章节。\n\n```bash\n$ rails generate\
  \ devise User\n```\n\n这创建了一个用户模型，包含测试、数据库迁移和一个引用 Devise 引擎的路由。为用户创建的固件文件（fixture\
  \ file）是无效的；它没有任何数据，而且测试将会发生变化。请将 `test/fixtures/users.yml` 编辑为如下：\n\n```yaml\n\
  one:\n  email: \"one@one.com\"\n\ntwo:\n  email: \"two@two.com\"\n```\n\n这足以让我们开始工作了。\n\
  \n## Huddle 的数据模型\n\n完成 Devise 样板代码后，我们只需要创建用于 Huddle 的基本数据结构。我们已经有了 Devise 生成的用户模型。我们还需要一个状态报告（status\
  \ reports）模型和一个项目（project）模型。目前，`Project` 只是一个字符串：\n\n```bash\n% rails generate\
  \ scaffold project name:string\n```\n\n`StatusReport` 拥有 `Project` 和 `User`，以及用于“我做了”和“我将要做”报告的文本字段。项目和用户之间是多对多的关系，因此你需要一个中间表。\n\
  \n```bash\n% rails generate scaffold project\n```\n\n将迁移修改为：\n\n```ruby\nclass ProjectsJoin\
  \ < ActiveRecord::Migration\n  def up\n    create_table :projects_users do |t|\n\
  \      t.references :project\n      t.references :user\n      t.timestamps\n   \
  \ end\n  end\n\n  def down\n    drop_table :projects_users\n  end\nend\n```\n\n\
  现在生成状态报告：\n\n```bash\n% rails generate scaffold status_report\n```\n\n`StatusReport`\
  \ 拥有 `Project` 和 `User`，以及“我做了”和“我将要做”报告的文本字段。它还有一个 `date` 字段。\n\n```ruby\nclass\
  \ StatusReports < ActiveRecord::Migration\n  def up\n    create_table :status_reports\
  \ do |t|\n      t.references :project\n      t.references :user\n      t.text :yesterday\n\
  \      t.text :today\n      t.date :date\n      t.timestamps\n    end\n  end\n\n\
  \  def down\n    drop_table :status_reports\n  end\nend\n```\n\n## 第一批测试\n\n为了开始花了长时间。运行默认的\
