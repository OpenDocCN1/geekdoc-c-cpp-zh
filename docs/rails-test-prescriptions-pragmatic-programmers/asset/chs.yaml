  \    * 性能测试与性能改进\n    * 示例应用程序设置\n    * 参考文献\n\n\n# 第一部分\n\n开始在 Rails 中进行测试\n\n\
  # 第 1 章\n\n自动化开发者测试的目标\n\n## 一个测试寓言\n\n想象两个程序员正在处理同一个任务。他们都是同样优秀、富有魅力且令人愉快的人，并都渴望尽可能地完成高质量的工作。这项任务并不简单，但也并不极端复杂；为了方便讨论，我们假设它是关于新用户注册网站并输入相关信息的行为。\n\
  \n第一位开发者，我们称他为 `Ernie`，他说：“这非常简单，我以前做过。我不需要写测试。”五分钟后，`Ernie` 就准备好了一个可以验证的方法。\n\n\
  我们的第二个开发者当然名叫 `Bert`。`Bert` 说：“我需要写一些测试。” `Bert` 开始编写测试，五分钟后，他为这个新功能编写了一个健壮的测试。再过五分钟，`Bert`\
  \ 也准备好了一个可以验证的方法。由于这是一个寓言，我们假设 `Ernie` 对自动化测试过敏，而 `Bert` 则同样反感在浏览器中手动运行应用程序。\n\n\
  此时，你毫无疑问地希望我说，尽管 `Bert` 编写方法花费了更多时间，但 `Bert` 编写的代码更有可能是正确、健壮且易于维护的。事实如此。但我假设 `Ernie`\
  \ 对自动化测试过敏，而 `Bert` 则同样反感在浏览器中手动运行应用程序。\n\n（注：原文此处段落重复，已按逻辑保留翻译）\n\n\n\n\n我假设你已经熟练掌握\
  \ Ruby 和 Rails，并且不需要这本书来解释如何从零开始创建一个 Rails 应用。\n\n我不假设你对 Rails 内部使用的测试框架或测试工具有任何特定的熟悉。如果你已经熟悉了，可能会发现某些早期章节是多余的。然而，如果你曾尝试使用测试框架但感到很挫败，并认为它们并不有效，我推荐你阅读`编写你的第一个测试`\
  \ 章节和`Rails 风格 TDD` 章节，因为这两个章节将带你走完小型 Rails 功能的 TDD 过程。\n\n在本书中，我们将介绍用于编写测试的各种工具，并从如何让它们在构建应用程序时变得实用的角度进行讨论。既然是\
  \ Rails，我自然会有我自己的见解，但所有工具的目标都是一样的：帮助你编写出出色的应用程序，完成伟大的任务，并且还能准时回家。\n\n## 先测试的力量\n\
  \n成功测试驱动开发（TDD）的关键在于信任这一流程。经典的流程如下：\n\n1.  创建一个测试。测试应该是短小的，并且只测试代码中的某一个功能。测试结果应该是确定性的。\n\
  2.  确保测试失败。在编写代码之前验证测试失败，有助于确保测试确实执行了你预期的操作。\n3.  编写可能让测试通过的最简单代码。先不要担心代码写得好。不要急于求成。有时，编写足够消除当前错误的代码即可。\n\
  4.  重构。在测试通过后，清理重复代码，进行优化。这是设计发生的地方，所以不要跳过这一步。记得在最后运行测试，确保你没有改变任何行为。\n\n重复此过程直到完成。至少在理论纸面上，这确保了你的代码始终保持尽可能简单，并且始终被测试完全覆盖。我们将在本书的大部分时间里讨论第\
  \ 1 步的细节，以及如何使用 Rails 工具编写实用的测试。\n\n如果你使用这个流程，你会发现它会改变你所写代码的结构。你不断使代码与测试对齐这一简单事实，导致代码由许多小方法组成，每个方法都只做一件事。这些方法往往是松耦合的，并且副作用极小。\n\
  \n事实上，良好代码的标志就是：小方法只做一件事、松耦合且副作用极小。我以前认为这是一种幸运的巧合，但现在我认为这是在与测试同步构建代码的直接副作用。实际上，测试充当了整个代码库的通用客户端，引导所有代码部分之间保持整洁的交互，因为测试作为第三方闯入者，为了运行必须插到代码的所有部分之间。\n\
  \n这一理论解释了为什么先写代码会导致在写测试时产生如此巨大的痛苦，即使你只是稍等一下才写测试也是如此。当测试是先编写的，或者与代码紧密交织在一起的时，测试会驱动代码的结构，使代码具备良好的高内聚/低耦合结构。当测试后出现时，它们必须适应现有的代码，而令人惊讶的是，没有测试的代码会容易而快速地向低内聚/高耦合的形式发展，而这种形式很难被测试覆盖。如果你编写单元测试的唯一经验是在初始代码编写很久之后，那么那种经历可能是非常痛苦的。不要让这种经历让你避开\
  \ TDD 方法；你用 TDD 编写的测试和代码是完全不同的。\n\n### 历史类比\n\n没有一个关于富兰克林·罗斯福的精彩轶事，哪算得上一本 Rails\
  \ 书呢，不是吗？\n\n有一个广为流传但可能真实的故事，关于罗斯福与一群推行改革议程的活动家会面——小组要求的具体内容似乎已经迷失在历史中。\n\n总之，当会议结束时，罗斯福对他们说：“我同意你们的观点。我想做这件事；现在，去让我做出来吧。”\n\
  \n暂时忽略这句话在政治上是否合逻辑的问题；作为一条测试驱动开发的格言，它是完全合逻辑的。你的需求决定了应用程序想要做什么。你的测试让应用程序去执行。\n\n\
  ## TDD 有什么用？\n\n这种测试风格（即开发者为了自己的利益而编写测试）的初要目的是改进代码的结构。也就是说，TDD 是一种软件开发技术，而不是一个完整的测试程序。（如果不信我的，可以问问\
  \ Kent Beck，他是 TDD 概念最核心的负责人，他在最近的一期播客中说过：“正确性是一个副作用”。）[[6]](#f_0010.html_FOOTNOTE-6)\n\
  \n自动化开发者测试是证明程序运行正如开发者所想的那样的极佳方式，但证明“开发者所想的正是程序实际应该做的”却是一种很糟糕的方式。当开发者的假设完全错误时，“但测试通过了啊！”这句话对客户来说可能并没有任何慰藉意义[[7]](#f_0010.html_FOOTNOTE-7)\n\
  \n自动化开发者测试不能替代与用户或客户的验收测试（后者本身可以通过 `Cucumber` 等工具部分自动化），也不能替代某些用户或测试人员通过轰击实际程序试图破坏某些东西的\
  \ QA 阶段。\n\n然而，这个目标可能会走过极端。你有时会看到一种反对测试驱动开发的论点，逻辑如下：“测试的目的是验证我的程序是正确的。我永远无法 100%\
  \ 证明这一点。因此，测试没有价值。”（`RSpec` 和行为驱动开发的出现部分也是为了应对这种态度。）但归结底，测试对编码有许多积极益处。\n\n防止回归通常被认为是测试驱动开发过程最重要的益处之一。如果你指望我出于成见而反对，那你就没机会了。能够在他人看到之前就压制回归，是严格测试随时间推移提高速度的关键方式之一。当然，为了让这一点发挥最佳作用，你需要良好的测试。\n\
  \n关于自动化测试，你可能听过的另一个常见益处是它们提供了记录程序的替代方法。从本质上讲，测试提供了程序行为的详细功能规范。\n\n这是理论。我对于测试作为文档的经验褒贬不一。尽管如此，将其作为一个目标是有帮助的，而且大多数让测试作为文档变得更好的方法，也会让测试本身变得更好，事实如此。\n\
  \n为了让你的测试作为文档时有效，请专注于为测试赋予具描述性的名称、保持测试短小，并重构公共设置和断言部分。重构的文档优势是消除测试本身的杂质——当一个测试包含大量凌乱的设置和断言时，读者很难关注重要的功能部分。此外，将通用功能提取出来后，更容易关注每个单独测试的不同之处。\n\
  \n\n\n测试驱动开发（TDD）非常有帮助，但它本身并不能单凭自己解决你所有的开发问题。在某些领域，开发者测试并不适用，或者效果并不佳。\n\n我已经提到了其中一种情况——开发者测试并不擅长判断应用程序是否按照要求正确运行。严格的\
  \ `TDD` 并不擅长验收测试。然而，确实有一些自动化工具尝试解决验收测试问题。在 Rails 社区中，最著名的是 `Cucumber`；请参阅使用 Cucumber\
  \ 进行验收测试章节。`Cucumber` 可以与 `TDD` 集成——你会看到这被称为“由外向内的测试（outside-in testing）”，或者看到缩写\
  \ `ATDD`（验收测试驱动设计）。这是一种完全有效且实用的测试范式，但它是经典 TDD 过程的扩展。\n\n测试你的应用程序假设你知道正确答案。虽然有时你会有明确的需求或确定的正确输出来源，但在其他时候，你并不知道程序具体需要做什么。在这种探索模式下，`TDD`\
  \ 的益处较小，因为如果你不知道对程序进行哪些断言，就很难编写测试。这通常发生在初始开发阶段或概念验证期间。我在进行视图测试时经常发现自己处于这种境地——在把一些视图渲染并显示出来之前，我不知道该测试什么。\n\
  \n在经典的极速编程（Extreme Programming）术语中，这种编程被称为 `spike`（探针测试），例如：“我不知道是否能通过 `Twitter\
  \ API` 实现我们需要的功能；让我们花一天时间为它做一个 `spike` 吧。”在 `spike` 模式下工作时通常不使用 `TDD`，但预期在 `spike`\
  \ 期间编写的代码不会用于生产环境；它只是一个概念验证。\n\n在进行视图测试，或者在其他我不确定要测试什么输出的非 `spike` 情况下，我倾向于进入“测试测试（test-next）”模式，即先写代码（但是\
  \ `TDD` 粒度的小块代码），然后立即编写测试。只要我频繁地在测试和代码之间切换，以获得代码和测试相互启示对方设计的益处，这种方法就是有效的。\n\n`TDD`\
  \ 并不是验证应用程序的完整解决方案。我们已经讨论了验收测试，但事实上的，`TDD` 在编写单元测试的数量方面往往是薄弱的。首先，严格的 `TDD` 过程永远不会编写你预期会通过的测试。但在实践中，我经常这样做。有时我能看到并在代码中创建一个抽象，但仍然有有效的测试用例要写。特别是，我经常为潜在的错误条件编写代码，即使我认为它们已经在代码中覆盖了。这是一种平衡，因为创建太多无法驱动代码更改的测试用例会让你丢失一些\
  \ `TDD` 的益处。保持这种平衡的一种方法是在开始编写测试之前列出测试用例——这样你就会记得覆盖所有有趣的用例。\n\n## 处世之道（格言）\n\n- 程序逻辑的任何更改都应该由失败的测试驱动。\n\
  - 测试应该与相关的代码尽可能接近。\n- 如果没有经过测试，它就是坏的。\n- 测试应该提供长远帮助。长远从明天开始，或者也许午饭后。\n- 没运行通就不算完成。\n\
  - 测试也是代码；也要对其进行重构。\n- 从编写测试开始修复 Bug。\n\n## 接下来将要介绍...\n\n本书分为六部分。\n\n第一部分（你目前正处于这一部分）是\
  \ Rails 测试的介绍。下一章，Rails 测试基础章节，涵盖了在 Ruby 和 Rails 中开始单元测试所需要的知识，包括 `Test::Unit`、`测试驱动设计`以及\
  \ Ruby 测试的基本工作流。接下来的两章，编写你的第一个测试章节和 Rails 风格 TDD 章节，提供了使用 `TDD` 实现基础 Rails 功能的教程或演练。\n\
  \n本书的第二部分关于应用程序数据。你的大部分 Rails 测试将覆盖模型代码，这在使用 Rails 单元测试测试模型章节中讨论。你通常需要样本数据来运行测试，使用\
  \ Fixtures 和 Factories 创建模型测试数据章节讨论了管理测试数据的两种最常见方法。然而，有时你只需要完全跳过正常行为，使用 Mock 对象章节讨论了替换正常行为。\n\
  \n\n\n\n\n在我负责这个项目的两年时间里，我得到了许多人的指导和支持。希望我没有遗漏任何人。\n\n当这还只是一个 DIY 项目时，有几个人充当了早期读者并提供了有用的意见，包括\
  \ Paul Barry、Anthony Caliendo、Brian Dillard、Sean Hussey、John McCaffrey、Matt Polito\
