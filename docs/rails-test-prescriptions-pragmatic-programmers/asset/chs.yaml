  \ Pragmatic Bookshelf.\n\n# 第 2 章\n\n## Rails 测试的基础\n\n让我们从最开始的地方。对于 Rails 测试，起点是构成\
  \ Rails 核心提供的测试设施的工具集、约定和实践。基础的 Rails 测试功能由标准 Ruby 库 `Test:Unit` 加上 Rails 用于在项目中放置测试、为测试添加数据以及运行测试的标准机制组成。\n\
  \n构建 Rails 测试的所有基本功能在这一章中都将涵盖。一旦我们奠定了这一基础，我们将在第 *编写你的第一个测试* 章的 Rails 测试驱动开发过程中中使用这些功能。\n\
  \n### 总是会有一些困惑\n\n\n\n\n\n在 Rails 内部进行测试时，整个 Rails 环境会自动作为测试启动的一部分被加载，因此你的 Rails\
  \ 应用的任何部分以及任何所需的插件或宝石（gem）都是可用的。通常情况下，特定的测试类与特定的应用程序类绑定，而该测试类中的测试是为了验证匹配的应用程序类的行为。这是一种良好的实践，并且通过\
  \ Rails 内部 `Test::Unit` 的结构强制执行。如果你发现自己正在测试测试类所绑定的类之外的功能，那么你可能应该重新考虑你的方法了。\n\n在每个测试内部，你通常在尝试做四件事：\n\
  \n*   设置测试所需的数据。根据一般规则，为每个测试创建尽可能少的数据——这会让测试运行得更快。如果你发现自己创建了大量对象，这通常说明你测试的单元粒度不够小。\n\
  *   执行被测试行为的操作。例如，在 Rails 控制器测试中，这通常是调用控制器动作（controller action）。在模型测试中，它是对被测试的模型方法的调用。\n\
  *   执行一个或多个断言（assertions），以验证上一步触发的行为是否产生了预期结果。这通常涉及对操作执行后的系统状态进行断言，尽管另一种测试风格（在*使用\
  \ Mock 对象*章节中详细讨论）是对当被测试方法被调用时应用程序的行为进行断言。无论哪种情况，这都是你想要确保正确的步骤——编写得糟糕的断言会导致你的测试无法准确反映系统行为。一个行为正常却失败的测试是很糟糕，但一个在底层行为损坏的情况下仍然通过的测试更糟糕。\n\
  *   清理在下次测试运行之前需要移除的任何数据结构。在 Rails 中，这一步很少需要，因为大多数主要的账目工作（例如重置数据库状态）都由框架处理。然而，有一些测试工具需要一个拆卸语句，以确保每个单独的测试保持良好的独立性。\n\
  \n设置（Setup）、拆卸（teardown）和断言都从测试框架获得了某些特殊结构。让我们先谈谈断言。原生的 `Test::Unit` 定义了大约二十种不同的方法，用于断言特定状态的存在或不存在。从程序员的角度来看，这些方法中最简单的是基础的\
  \ `assert` 方法，它接受一个布尔值参数。如果参数为真，则断言通过；如果参数为假，则断言失败，并且当前测试在该点停止执行。通常，你会将一个求值为布尔值的表达式作为\
  \ `assert` 的参数，如下例所示，用于验证一个人的腿应该有多长：\n\n| | `test` \"询问 abe 关于人腿的长度\" `do` |\n|---|---|\n\
  | | `@user = User.new` |\n| | `assert (@user.leg.length == \"long enough to reach\
  \ the ground\")` |\n| | `end` |\n\n我在这里只提到这一点，你可以将其应用到接下来的几页中讨论的所有断言中：`assert` 以及所有其他\
  \ Test::Unit 断言方法都接受一个可选的最后一个参数，其是一个字符串消息，用于在失败时显示。在大多数情况下，默认消息和生成的堆栈轨迹已经足够诊断失败，因此这些消息很少被使用。\n\
  \n从用户的角度来看，简单的方法是 `assert`，但在 `Test::Unit` 代码内部，几乎所有内容都是构建在 `assert_block` 之上的，它接受一个不带参数的块（block），如果该块求值为真，则通过。\n\
  \n| | `test` \"询问 abe 关于人腿的长度\" `do` |\n|---|---|\n| | `@user = User.new` |\n| |\
  \ `assert_block { @user.leg.length == \"long enough to reach the ground\" }` |\n\
  | | `end` |\n\n最常用的断言是 `assert_equal`，它接受两个参数：一个预期值和一个实际计算出的值。如果两个参数使用 Ruby 的 `==`\
  \ 运算符结果相等，则该方法通过。\n\n| | `test` \"询问 abe 关于人腿的长度\" `do` |\n|---|---|\n| | `@user\
  \ = User.new` |\n| | `assert_equal \"long enough to reach the ground\", @user.leg.length`\
  \ |\n| | `end` |\n\n虽然参数的顺序在功能上并不重要，但你在失败时收到的错误消息假设第一个参数是预期值，第二个参数是实际计算的值。当你试图追溯失败的测试时，混淆这两个值会导致困惑。你可以使用反向方法\
  \ `assert_not_equal` 来否定这个断言。\n\n这些是最常用的断言，但 Test::Unit 还定义了其他几个。所有这些方法都接受一个可选的消息作为最后一个参数，我没有写出来是因为我不想让你使用它。让我们分组来看：\n\
  \n*   `assert_in_delta(expected, actual, delta)`\n    类似于 `assert_equal`，但用于浮点数。如果两个浮点数之间的差异在\
  \ delta 值范围内，则通过。\n*   `assert_instance_of(klass, object)`\n    `assert_kind_of(klass,\
  \ object)`\n    如果对象和类之间存在方法名称所蕴含的关系，则通过。\n*   `assert_match(pattern, string)`\n\
  \    `assert_no_match(pattern, string)`\n    类似于 `assert_equal`，但用于正则表达式。\n*   `assert_operator(left,\
  \ operator, right)`\n    我从未在实际中见过这个方法。如果左对象和右对象具有运算符所示的关系，则通过，例如 `assert_operator\
  \ 6, :<, 10`。使用 `send` 将运算符发送给左操作数。\n*   `assert_nil(object)`\n    `assert_not_nil(object)`\n\
  \    虽然这样说可能很自认为，这两个方法应该是显而易见的。\n*   `assert_raise(*args, &block)`\n    `assert_nothing_raised(*args,\
  \ &block)`\n    正面方法的参数是一个异常类，如果关联的代码块抛出了该异常，则通过。否定方法不在乎抛出了什么种异常。\n*   `assert_same(expected,\
  \ actual)`\n    `assert_not_same(expected, actual)`\n    类似于 `assert_equal`，但用于实际对象。\n\
  *   `assert_respond_to(object, method)`\n    如果 `object.respond_to?(method)` 为真，则通过。\n\
  *   `assert_send(array)`\n    一个奇怪的方法，接受一个形式如 `[receiver, method, argument_list]`\
  \ 的数组，如果 `receiver.method(argument_list)` 为真，则通过。\n*   `assert_throws(symbol, &block)`\n\
  \    `assert_nothing_thrown(&block)`\n    类似于 `assert_raise`，但用于 Ruby 少用的 catch/throw\
  \ 机制。\n\n## Setup 和 teardown\n\n让我们来看一对测试。目前的功能并不重要；我们感兴趣的是测试的结构：\n\n| | `test`\
  \ \"用户应该能够看到项目内的更新\" `do` |\n|---|---|\n| | `@user = User.new` |\n| | `barney =\
  \ User.new` |\n| | `project = Project.new(\"Project Runway\")` |\n| | `project.users\
  \ << fred` |\n| | `project.users << barney` |\n| | `barney.create_status_report(\"\
  I'm writing a test\")` |\n| | `assert_equal(\"I'm writing a test\", fred.project_statuses[0].text)`\
  \ |\n| | `end` |\n| | |\n| | `test` \"用户不应该能够看到另一个项目的内容\" `do` |\n|---|---|\n| |\
  \ `@user = User.new` |\n| | `barney = User.new` |\n| | `project = Project.new(\"\
  Project Other\")` |\n| | `project.users << fred` |\n| | `other.users << barney`\
  \ |\n| | `barney.create_status_report(\"I'm writing a test\")` |\n| | `assert_equal(0,\
  \ fred.project_statuses.count)` |\n| | `end` |\n\n\n\n\n这些测试共享了一些公共代码。通用的设置只需要几行，但一组真正的测试可能会导致过多的重复。你发现出问题的第一个信号是，设置代码可能已经从一个测试复制粘贴到了另一个测试中。复制粘贴多行代码几乎总是提醒你：你至少应该考虑一下自己正在做的事情，看看是否有可以重构的共性。\n\
  \n使用 `Test::Unit` 管理重复设置的经典方法是将公共代码移动到 `setup` 方法中，该方法会在测试框架执行每个测试之前自动调用：\n\n| |\
  \ `def` setup |\n| | | `@fred = User.new(:name => \"Fred\")` |\n| | `@barney = User.new(:name\
  \ => \"Barney\")` |\n| | `@project = Project.new(:name => \"Project Runway\")` |\n\
  | | `@project.users << fred` |\n| | `end` |\n| | | |\n| `test \"a user should be\
  \ able to see an update from a friend\" do` |\n| | `@project.users << @barney` |\n\
  | | `@barney.update_status(\"I'm writing a test\")` |\n| | `assert_equal(\"I'm writing\
  \ a test\", @fred.project_statuses[0].text)` |\n| | `end` |\n| | | |\n| `test \"\
  a user should not be able to see an update from a non-friend\" do` |\n| | `other\
  \ = Project.new(:name => \"Project Other\")` |\n| | `other.users << @barney` |\n\
  | | `@barney.update_status(\"I'm writing a test\")` |\n| | `assert_equal(0, @fred.project_statuses.count)`\
  \ |\n| | `end` |\n\n将公共设置代码移动到 `setup` 方法解决了几个问题。`setup` 代码会在每个测试之前自动执行，保证了每个测试都在相同的环境中执行。此外，将设置移出测试方法可以更容易编写每个单独的测试，也更容易遵循每个测试的独特目的。关于\
  \ `setup` 方法是否真的更清晰存在一些争议；还有一种观点认为，将任何内容移动到 `setup` 方法都会使测试难以理解。通常情况下，如果设置变得太复杂，你就会遇到问题——但在大多数模型和控制器测试中，你可以将公共设置保持得足够简单且清晰。\n\
  \n随着时间的推移，`setup` 方法像任何初始化器一样，可能会因为多个独立的小设置挤在同一个方法中而变得混乱。不要忘记，“不要重复自己”（Don’t Repeat\
  \ Yourself）标志的正下方是另一个写着“一个方法应该只做一件事”（A Method Should Do Exactly One Thing，缩写 AMSDEOT\
  \ 远没有 DRY 那么朗口）。混乱的 `setup` 方法违反了 AMSDEOT 原则。这个问题在 Rails 2.2 中得到了解决，它将设置代码转换为块声明，类似于控制器处理\
  \ `before_filter` 的方式。在 Rails 2.2 中，你可以通过使用 `setup` 调用并在测试类或 `test/test_helper.rb`\
  \ 中放置如下所示的内容来声明在设置期间运行的方法：\n\n| | `setup :setup_users` |\n| | |\n| `def setup_users`\
  \ |\n| | `@fred = User.new(:name => \"Fred\")` |\n| | `@barney = User.new(:name\
  \ => \"Barney\")` |\n| | `end` |\n\n这种特别棒的一点是——就像前置过滤器一样——你可以有多个设置块或方法，它们都会在每个测试之前执行：\n\
  \n| | `setup :create_fred` |\n| | `setup :create_barney` |\n| | |\n| `def create_fred`\
  \ |\n| | `@fred = User.new(:name => \"Fred\")` |\n| | `end` |\n| | | |\n| `def create_barney`\
  \ |\n| | `@barney = User.new(:name => \"Barney\")` |\n| | `end` |\n\n\n\nRails 还会创建一个名为\
  \ `test/test_helper.rb` 的文件，它包含了所有测试通用的功能和设置。任何 Rails 测试文件都需要引入此文件。该文件重新打开了 `ActiveSupport::TestCase`\
  \ 类，允许你添加自己的方法，这些方法可以在你的所有测试中可用。通常情况下，这涉及到初始化（initialization）和析构（teardown）、复杂的数据设置以及复杂的断言。本书的其他章节将更详细地介绍这些可能性。\n\
  \n标准 Rails 工具箱中还有两种类型的测试。第一种是集成测试（integration tests），它们也许是 Rails 测试中最被忽视的功能。根据设计，集成测试用于测试跨越多个动作（actions）或控制器的事件序列。然而，它们很难映射到各种测试优先（test-first）的方法论，因此\
  \ Rails 开发者往往会忽略它们。这很遗憾，因为集成测试是验证应用程序中复杂交互的良好方法，同时也能确保控制器测试中没有遗漏。集成测试是使用 Rails 生成器\
  \ `script/generate integration_test` 创建的，不会被任何其他 Rails 生成器自动创建。我们将在*使用集成测试的工作流*章节中更详细地讨论集成测试。\n\
  \n性能测试（Performance tests）与其他自动化测试类型不同。它们的目的不是验证程序的正确性；相反，它们提供了测试期间调用的动作的性能分析信息（profiling\
  \ information）。本质上，性能测试是 `ruby-prof` 剖析器的封装，但如果你曾经尝试过让 `ruby-prof` 运行，你将会感激这种帮助。性能测试是使用\
  \ Rails 生成器 `script/generate performance_test` 创建的，不会被其他 Rails 生成器自动创建。与其他的 Rails\
  \ 测试（功能性测试、单元测试和集成测试）不同，性能测试不会被 Rails 测试运行器自动运行。我们将在*性能测试与性能优化*章节中进一步讨论性能测试。\n\n\
