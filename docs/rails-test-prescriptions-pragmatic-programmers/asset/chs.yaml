  \n[content]\n## 测试运行运行时会发生什么？\n\n每当你在 Rails 中运行测试任务时，都会发生以下步骤。你可以在图*测试流程图*中看到整个工作流。\n\
  \n| ![test_flow.jpg](img/test_flow.jpg) |\n| --- |\n| * * | **图 2. 测试流程** |\n\n\
  (以下为核心逻辑步骤翻译)\n1. **重置数据** (Reset data)：默认情况下，每个测试用例都会加载一次。详细信息请参阅*加载数据*章节。\n2.\
  \ **运行断言** (Run assertions)：如果测试没有触发异常或错误，则测试将通过。\n3. **析构块** (Teardown blocks)：与初始化块类似。\n\
  \n\n\n\n性能分析测试（profile test）根据测试执行发生的方法对每个测试的时间数据进行拆分，并返回在每个方法中花费的时间，目的是确定应用程序的瓶颈所在。性能分析测试的输出可以是方法及其数据的列表，也可以是将每个方法与调用它的方法以及它调用的方法关联的调用图。\n\
  \n可以使用 `rake test:plugins` 运行所有插件的测试。也可以直接通过命令行调用单个测试文件来运行测试，例如执行 `ruby test/unit/user_test.rb`。（在\
  \ Rails 的最新版本中，你可能需要调整 Ruby 的载入路径，使得测试文件开头的 `require test_helper` 行能够找到测试辅助文件。）\n\
  \n如果你正在使用如 Eclipse 或 NetBeans 等 IDE，IDE 应该提供一个在 IDE 内部运行测试的命令——通常，这会在控制台窗口运行 `rake`\
  \ 命令行（NetBeans），或调用一个自定义测试运行器，其本质上做的是相同但界面更美观（Eclipse、RubyMine）。IDE 还应该具有运行单个测试文件或单个测试方法的命令。\n\
  \n## 更多信息：将数据导入测试\n\n通常，要正确测试一个功能需要创建数据以构建有意义的测试设置。报告功能可能通过多个填充报告不同列的各种数据项来得到最佳测试。或者，社交网络功能可能需要在各种关系组合中创建多个用户以进行适当测试。\n\
  \n有许多方法可以方便地为测试创建示例数据。Rails 核心提供了一个易用但功能有些有限的功能，称为 fixtures（固件）。广义地说，fixture 是任何被多个测试作为基准使用的预定义数据集。在\
  \ Rails 中，fixtures 是测试中定义和使用已知数据的核心机制。具体来说，每个 `ActiveRecord` 模型在 `test/fixtures`\
  \ 中都有一组关联的 fixture 数据，其中数据对象可以用 YAML 格式指定。\n\nRails fixtures 为你提供了一个一致的、可能复杂的数据集，该数据集会在每个测试之前自动创建。尽管\
  \ fixtures 从 Rails 早期就是其一部分，但大多数时候我倾向于使用其他使用工厂模式生成示例数据的工具。虽然 fixtures 确实有很强的局限性，而工厂创建方法更灵活且通常更轻量，但我们在这里关注\
  \ fixtures，因为它们易于使用且是 Rails 核心的一部分。你将在 *使用 Fixtures 和 Factories 创建模型测试数据* 章中找到更多关于为什么\
  \ fixture 数据不常用以及使用使用哪些工具的讨论。\n\n`test/fixtures` 目录预期包含每个每个 `ActiveRecord` 模型的 YAML\
  \ 文件。因此，`app/models/user.rb` 关联到 `test/fixtures/user.yml`。fixture 文件由 Rails 生成器在创建模型时自动创建。如果你手动创建一个\
  \ `ActiveRecord` 模型，也需要创建关联的 YAML 文件。反之亦然：如果你删除了一个 `ActiveRecord` 文件，你需要删除对应的 YAML\
  \ 文件。否则，你将无法运行测试，因为 Rails 会尝试为缺失的 `ActiveRecord` 类加载 fixture 数据到测试数据库中。放置在 fixture\
  \ 文件中的数据会在每个测试之前自动加载到测试数据库。\n\nRails fixtures 使用 YAML 描述，YAML 具有严格的嵌套格式；在顶层，每个单独的模型获得一个名称，后跟一个冒号。之后，该模型的数据以\
  \ Python 风格进行缩进。每行以键开头，后跟冒号，然后是值，如下所示：\n\n| [huddle/test/fixtures/projects.yml](http://media.pragprog.com/titles/nrtest/code/huddle/test/fixtures/projects.yml)\
  \ |\n| | `huddle:` |\n| | `name:` `Huddle Project` |\n\n要开始一个新模型，向左缩进回到边缘，并重新从模型名称开始。这些顶层名称（例如上一个文件的\
  \ `huddle`）在 Rails 中没有特殊含义，除了作为测试环境中该特定 fixture 的标识符之外。YAML 文件中的键必须是该模型数据库表中的列（这意味着它们不能像在调用\
  \ `new` 或 `create` 时那样是 Ruby 代码中的任意方法）。\n\n一旦这些代码进入 YAML 文件，就会从其生成一个对象，该对象在每个测试之前加载到数据库中，并且默认情况下，可以在任何测试的任何地方通过方法调用\
  \ `projects(:huddle)` 来访问。\n\n这里是我们在稍后示例中使用的状态报告类（status report class）的一些示例 fixture\
  \ 数据：\n\n| [huddle/test/fixtures/status_reports.yml](http://media.pragprog.com/titles/nrtest/code/huddle/test/fixtures/status_reports.yml)\
  \ |\n| | `ben_tue:` |\n| | `project:` `huddle` |\n| | `user:` `ben` |\n| | `yesterday:`\
  \ `Worked on Huddle UI` |\n| | `today:` `Doing some testing` |\n| | `status_date:`\
  \ `2009-01-06` |\n| | `ben_wed:` |\n| | `project:` `huddle` |\n| | `user:` `ben`\
  \ |\n| | `yesterday:` `Did Some Testing` |\n| | `today:` `More Testing` |\n| | `status_date:`\
  \ `2009-01-07` |\n\n关于 fixtures 有几点需要注意。我们不需要为每个 fixture 指定一个 `id`；Rails 会自动为我们生成一个。此外，当我说所有键必须是数据库表的列时，这并不完全准确；它们也可以是关联（associations）。如果键是关联，则值代表相关表中的\
  \ fixture 名称（对于一对多关系，则是一个逗号分隔的 fixture 名称列表）。如果我们确实在 YAML 文件中指定了 `id`，这种奇妙的自动关联功能将无法工作。此外，正如这里所示，日期会自动从字符串表示转换为日期。\n\
  \nFixture 文件被 Rails 解释为 ERb，因此你可以使用 Ruby 的完整功能进行循环或动态生成数据。此外，在将 YAML 数据粘贴到文本文件时，请记住\
  \ YAML 文件需要特定的空白布局：取消缩进的 fixture 名称需要位于行的最左侧列。给 fixtures 起一个有意义的名称；这对以后很有帮助。（Rails\
  \ 的默认名称记起来非常痛苦。）\n\n\n\n\n\nTest::Unit 和 Rails 结合提供了一套常用的测试工具，这些工具在任何 Rails 应用程序中都是可用的。如果你用过其他框架，特别是几年前的框架，你可能记得将一组测试组织成测试用例和测试套件总是一件痛苦的事。在\
  \ Rails 中并非如此，它的设计目标是减少不必要的重复工作，特别是在创建测试时。Rails 提供了定义测试的标准方法、每个测试的标准存放位置、向测试中添加数据的方法以及以不同组合运行测试的简便方法。\n\
  \n在掌握了这些 Rails 测试核心基础介绍后，是时候看一个更详细的例子了。在接下来的两个章节中，我们将采用一个几乎全新的 Rails 应用程序，并使用测试驱动的方法为其添加新功能。\n\
  \n### 注脚\n\n| [8 | 一位测试读者指出，在测试名称中使用非 ASCII 字符可能会导致测试在某些环境下被忽略。 |\n| [9 | 我也是 CAPITROAE\
  \ 的忠实粉丝：“复制粘贴是万恶之根源。” |\n| [10 | 然而，并不是自动的：Rails 将 `require` 语句放在生成的文件的顶部。如果你创建了了自己的文件，你需要手动添加该语句。\
  \ |\n| [11 | 如果你通过命令行 `rake` 任务运行测试，Rails 将自动应用任何待处理的迁移。如果你通过其他方法（例如 IDE）运行，你可能需要手动为测试环境应用待处理的迁移。\
  \ |\n| [12 | Fixture 数据也可以通过 `rake db:load:fixtures` 任务加载到开发数据库中。 |\n| [13 | 当然，YAML\
  \ 语法还有更多内容，但这里没有必要超出基础。 |\n| [14 | 嗯……情况比这要复杂一点。更多信息请参阅加载 Fixture 数据。 |\n| [15 |\
  \ 所有这些复杂的 `id` 映射都是 Rails 2.0 及以上版本的特性。之前，我们必须手动跟踪 `id` 值——对于多对多的连接表来说，这非常痛苦。 |\n\
  \nCopyright © 2011, The Pragmatic Bookshelf.\n\n# 第 3 章：编写你的第一个测试\n\n你面临一个问题。你是一个分布在多个地点的开发团队的负责人。作为一个敏捷开发团队，你的项目有一个每日站会（有时称为\
  \ scrum），在会上，每个人都会简要描述昨天做了什么、今天计划做什么，以及是否有任何阻碍他们完成工作的事情。\n\n然而，由于你的团队在地理上是分布的，你需要通过邮件进行这些\
  \ scrum。这并不是最糟糕的事情，但它会导致令人讨厌的邮件线程，我认为我们都可以通过一点 Web 应用程序的魔力做得更好。让我们创建一个名为 Huddle\
  \ 的应用程序，它将支持输入和查看这些每日状态消息。\n\n作为一名想要使用测试驱动方法的 Rails 开发者，你应该问的首要问题是“我要测试什么？”测试驱动的开发者通过编写测试来启动应用程序。本着这种精神，我们将通过编写大量测试来开启\
  \ Rails 测试之旅。具体来说，我们将走过 Huddle 应用程序的前几个测试驱动功能周期，让你让你体验到使用 Rails 进行测试驱动开发 (TDD) 的感觉。\n\
  \n我们将采用实操方法，并详细介绍如何编写第一个测试的细节。我们将讨论“测试优先”的工作实践如何改进开发，但更重要的是，我们将展示以测试驱动风格工作是什么样样的。本章将使用\
  \ Rails 核心中提供的测试工具，并限于常见的 Rails 任务，如创建和提交 Web 表单。在本章结束时，你应该对 Rails 中 TDD 开发是如何运作的有良好的理解，并准备好探索书的其余部分的第三方工具和更详细的话题。\n\
  \n附录 示例应用程序设置 包含了我们开始使用的骨架应用程序的步骤——包括初始设置、创建 Rails 脚手架（scaffolds）、添加用于用户身份验证的 Devise\
  \ 以及其他对应用程序必要但与本教程无关的内容。如果你想从相同的地方开始，可以在 [`www.pragprog.com/titles/nrtest/source_code`](http://www.pragprog.com/titles/nrtest/source_code)\
  \ 下载本章的代码示例。此应用程序是针对 Rails 3.0 编写并测试的。[16\n\n我们将以相当严格的测试驱动风格进行，这意味着除非响应失败的测试，否则不会向应用程序添加任何新逻辑。我们假设你对\
  \ Rails 概念有基本的理解；换句话说，你不需要知道什么是控制器。目前，我们将限于 Rails 核心。\n\n## 关于最佳实践的说明\n\n在本节中，在尽可能简化测试介绍与使用我所认为的最佳实践之间存在一种张力。特别是，许多常规测试实践取决于我们在这里不会涵盖的第三方工具。在本章中，我决定在保持良好实践的同时尽可能让测试简单，并包含了对改进可能的讨论。我们稍后会再次讨论风格和实践。\n\
  \n## 测试优先\n\n第一个要问的问题是“我要测试什么？”答案来自于你的需求。如果没有对程序应该做什么的感知，很难编写描述该行为的测试。\n\n需求的形式和正式程度取决于你的项目。在这种情况下，你是你自己的客户，而且它是一个很小的项目，我们没有空间进行军事级的精确描述。因此，前三个故事的非正式列表如下：\n\
  \n* 用户是项目的一部分。用户可以为该项目输入 scrum 状态。\n* 为了添加可测试的约束，让我们假设用户的状态报告有昨天的状态和今天预期的工作，并且用户必须在其中某一项中包含文本。\n\
  * 项目成员可以看到状态报告的时间线。这个将在 TDD，Rails 风格 中介绍。\n\n在教程的剩余部分中，我们将逐个处理这些故事。每当我们添加或更改应用程序逻辑时，我们都会编写测试。第一个测试的确切起点并不重要（尽管对方向有某种感知会有帮助）；你可以从程序中任何可以客观指定的任务或功能开始。\n\
  \n我们 Huddle 的起点是需要作为一个项目一部分创建状态报告。该报告应该正确设置其所有值，包括日期。因为我认为该功能的代码可能在 `StatusReportsController`\
  \ 中，我将把该功能的测试放在 `test/functional/status_reports_controller_test.rb` 中。\n\n```\n\
  test \"creation of status report with data\" do\n```\n\n\n\n\n```ruby\nassert_difference('StatusReport.count',\
  \ 1) do\n  post :create, :status_report => {\n    :project_id => projects(:one).to_param,\n\
  \    :user_id => users(:one).to_param,\n    :yesterday => \"I did stuff\",\n   \
  \ :today => \"I'll do stuff\"\n  }\n  actual = assigns(:status_report)\n  assert_equal(projects(:one).id,\
  \ actual.project.id)\n  assert_equal(users(:one).id, actual.user.id)\n  assert_equal(Date.today.to_s(:db),\
  \ actual.status_date.to_s(:db))\n  assert_redirected_to status_report_path(actual)\n\
  end\n```\n\n让我们详细分析这个测试。\n\n第 3 行模拟了对 `StatusReportsController` 中 `create` 动作的 `post`\
  \ 调用。该调用的第二个参数模拟了调用的 URL 参数——实际上，你正在设置将在动作中使用的 `params` 哈希（hash）。作为该哈希的一部分，调用引用了\
  \ `users(:one)`，它是一个固件（fixture），或者说是用于测试的已知样本数据。这个特定的固件集是在附录 *示例应用程序设置 中创建的，它定义了通过\
  \ `users(:one)` 访问的数据对象。更多信息：如何将数据导入测试 节提供了关于固件的更多详细信息。\n\n回到测试本身，从第 2 行开始到第 8 行结束的代码块使用\
  \ `assert_difference` 方法断言在代码块结束时，数据库中的 `StatusReport` 对象比开始时多了一个一个。更直白地说，该方法正在断言已创建一个新的\
  \ `StatusReport` 实例。\n\n第 9 行使用了 Rails 测试框架的 `assigns` 方法，允许访问在测试控制器中设置的实例变量——在这种情况下，是控制器变量\
  \ `@status_report`，它应该是新创建的实例。在 `assigns` 的参数中你不需要 `@` 符号。\n\n从第 10 行开始，有三行代码断言项目、用户和状态日期被添加到新创建的对象中。17\
  \ 第 13 行断言控制器调用的结果是重定向到新创建的 `StatusReport` 的显示页面。\n\n尽管人们会对这个测试的风格和结构产生意见，但它是对所需功能的一个基础、直接的测试。这是我在单个测试中可以接受的最高复杂性了。在某些情况下，测试中需要的数据量或验证表明，需要将某些复杂性重构为设置方法或自定义断言方法。\n\
  \n与其从控制器测试开始，我也可以从模型行为开始。模型测试可能更接近将编写的代码，因为良好的 Rails 风格会将复杂性放在模型中。然而，我有时发现，通过控制器开始测试时，更容易指定预期的结果。另一个选项是从集成测试或基于\
  \ Cucumber 的验收测试开始（在章节 *使用 Cucumber 进行验收测试 中对这些进行了更详细的描述）。\n\n我们测试 `status_date`\
  \ 是因为我们知道需要新代码来向对象添加该属性，我们测试项目和用户对象的存在是因为需求需要在模型之间建立关系。我们没有测试 `today` 和 `yesterday`\
  \ 文字，因为那是 ActiveRecord 的核心部分——我们可以测试它，但将是多余的。冗余在测试中并不总是坏事，但现在它是没必要的。\n\n我经常使用一种测试风格，将每个单独的测试限制为单个断言，因此可以将此测试拆分为四个共享公共设置的不同测试。这种“每个测试一个断言”风格的优势是，每个断言都能独立地通过或失败。按照目前的写法，第一个失败会阻止其余测试的运行。虽然断言应该是独立的这一点是很好，但在这种情况下，将相似的断言分组在一起更容易遵循测试的意图。此外，在第三方工具的轻微帮助下，单断言测试更易编写。在\
  \ *单行测试工具 节中，我们将看到一些可以让编写单断言测试变得更更容易的工具。\n\n当我们运行测试时，得到了一个错误。该错误的堆栈跟踪看起来如下：\n\n\
  ```\n1) Error:\ntest_creation_of_status_report_with_data(StatusReportsControllerTest):\n\
  ArgumentError: wrong number of arguments (1 for 0)\n/test/functional/status_reports_controller_test.rb:58:in\
  \ ✎to_s\n```\n\n错误信息 `wrong number of arguments (1 for 0)` 意味着调用方法时有一个参数，但预期是零。这个错误信息在技术上是正确的，但具有误导性。真正的错误是\
  \ `actual.status_date` 是 `nil` 而不是 `Date`。对于大多数类，`to_s` 不接受参数，但 ActiveSupport 用可选参数覆盖了\
  \ `to_s`。此外，注意测试中的 `user` 和 `project` 部分已经通过了。这是 Rails 的特性。通过在 `script/generate`\
  \ 命令中使用 `user:references`，Rails 会自动向 `StatusReport` 类添加 `belongs_to` 关联。正如后面看到的，它没有添加相反的关系。\n\
  \n现在让测试通过。经典的流程说是做可行的最简单的事情。让眼前的失败消失是一个好主意，即使我们怀疑测试中还有其他错误在等待。这样做可以保持测试/代码循环简洁，并防止代码变得不必要的复杂。为了通过失败，在\
  \ `app/controllers/status_reports_controller.rb` 的 `create` 方法开头处添加代码，使方法开始如下：\n\
  \n```ruby\ndef create\n  @status_report = StatusReport.new(params[:status_report])\n\
  \  @status_report.status_date = Date.today # 新的一行\n  # 方法其余部分保持不变\nend\n```\n\n\
  ## 第一次重构\n\n我们修复了直接的问题，测试通过了。我们现在进入重构步骤。这里没什么可以重构的，但我们有一个细节可以进行调整：最好不要在控制器中设置 `status_date`。良好的\
  \ Rails 实践尽可能将复杂性从控制器移动到模型中。一方面，将代码放在模型中往往会减少多个控制器动作使用功能时的重复；另一方面，模型中的代码更容易测试。\n\
  \n通常情况下，我们不会在重构期间编写测试，而是使用现有测试来验证行为没有改变。然而，当代码从一个层（控制器）移动到另一个层（模型）时，在新类中创建测试会有帮助。\n\
  \n单元测试位于 `test/unit/status_report_test.rb` 中：\n\n```ruby\ntest \"saving a status\
  \ report saves the status date\" do\n```\n\n\n\n\n\n```ruby\n2 | actual = StatusReport.new\n\
  3 | actual.save\n4 | assert_equal(Date.today.to_s, actual.status_date.to_s)\n5 |\
  \ end\n```\n测试失败了。正如之前的脚注所述，在第 4 行中，我们比较的是字面量字符串对象而不是日期对象。\n\n为了通过测试，我们为 `StatusReport`\
  \ 类添加了 `before_save` 回调函数：\n\n```ruby\nclass StatusReport < ActiveRecord::Base\n\
  \  belongs_to :project\n  belongs_to :user\n\n  before_save :set_status_date\n\n\
  \  def set_status_date\n    self.status_date = Date.today\n  end\nend\n```\n\n现在测试通过了。但还有一件事需要担心——如果在保存报告之前已经设置了\
  \ `status_date`，那么应该使用原始日期。按照目前代码 own，每当编辑模型时，`status_date` 都会发生变化。在 TDD 过程中，我们通过测试暴露错误来强迫自己进行那项代码更改。以下是在\
  \ `test/unit/status_report_test.rb` 中的实现方法：\n\n```ruby\ntest \"saving a status report\
  \ that has a date doesn't override\" do\n  actual = StatusReport.new(:status_date\
  \ => 10.days.ago.to_date)\n  actual.save\n  actual.reload\n  assert_equal(10.days.ago.to_date.to_s,\
  \ actual.status_date.to_s)\nend\n```\n\n第 2 行和第 5 行中的 `to_date` 方法用于在 `10.days.ago`（一个\
  \ Ruby `DateTime` 对象）和 `status_date`（一个 Ruby `Date` 对象）之间转换。如果没有该转换，我们将得到错误，因为第\
  \ 5 行中的字符串格式不匹配。\n\n第 4 行中的 `reload` 调用强制 `ActiveRecord` 从数据库中重新检索记录。`ActiveRecord`\
  \ 并不会阻止数据库记录拥有多个指向它的存活对象。在这种情况下，控制器从数据库创建了一个新实例并保存了该实例，而没有触碰为测试创建的 `actual` 变量。结果是数据库版本在保存时已将\
  \ `status_date` 转换为 `Date` 类型，但内存中的存活版本尚未获取该更改。\n\n通常情况下，重新加载任何被测试和保存的对象都是好主意。这在控制器测试中最为常见，你可能在设置期间创建了一个对象，然后在控制器动作期间创建了另一个由同一个数据库记录支持的对象。在那种情况下，你在测试中持有的对象并没有反映控制器动作期间对数据库所做的更改，导致你在试图弄清楚为什么测试失败时浪费了好几个小时的“乐趣时光”。重新加载（Reload）将允许测试中的对象看到在对象创建后对数据库所作的更改。\n\
  \n让新测试通过的一种方法是对模型进行这一非常微小的更改：\n\n`huddle3/app/models/status_report.rb`\n\n```ruby\n\
  def set_status_date\n  self.status_date = Date.today if status_date.nil?\nend\n\
  ```\n\n现在是令人害怕的部分：从控制器中移除更改状态的行代码，并确保测试再次通过。这涉及到移除我们几秒钟前添加到控制器的那行代码。\n\n移除该行只需要几秒钟，然后我们就可以重新运行\
  \ `rake` 来验证测试仍然通过。\n\n## 更多验证\n\n当我们查看状态报告模型时，我们还可以涵盖原始三个需求中的另一个需求，即用户必须在“昨天”和“今天”两个框中的至少一个内输入文本。回到\
  \ `test/unit/status_report_test.rb` 中：\n\n```ruby\ntest \"a report with both blank\
  \ is not valid\" do\n  actual = StatusReport.new(:today => \"\", :yesterday => \"\
  \")\n  assert !actual.valid?\nend\n```\n\n通过此测试最简单的方法是在 `app/models/status_report.rb`\
  \ 中放置以下行代码：\n\n```ruby\nvalidates_presence_of :yesterday, :today\n```\n\n太棒了！有了这行代码，一切都会很顺畅。什么问题都不会发生。（切起不祥的音乐）。让我们运行\
  \ `rake`：\n\n`1) Failure: test_saving_a_status_report_saves_the_date(StatusReport)(test/unit/status_report_test.rb:9):\
  \ expected \"2009-08-26\" but was \"\"`\n\n`2) Error: test_saving_with_a_date_doesn't_override(StatusReport):\
  \ ActiveRecord::RecordNotFound: Couldn't find StatusReport without an ID (test/unit/status_report_test.rb:17:in\
  \ test_saving_with_a_date_doesn't_override)`\n\n什么？嗯，你可能已经发现了，但添加验证导致了其他测试出现问题。具体来说，由其他测试创建的且没有设置任何字段的状态报告现在在保存时失败了。这确实很令人恼恼，因为并不是代码的退化：实际代码可能运行良好。更多是由于关于“什么是有效的\
  \ `StatusReport`”的定义发生了变化，现在导致了那些数据不足的测试卡住了。\n\n修复失败的测试非常简单。要修复 `test/unit/status_report_test.rb`\
  \ 中的两个测试，为每个 `StatusReport.new` 添加参数 `(:today => \"t\", :yesterday => \"y\")`，如下：\n\
  \n`huddle3/test/unit/status_report_test.rb`\n\n```ruby\ntest \"saving a status report\
  \ saves the date\" do\n  actual = StatusReport.new(:today => \"t\", :yesterday =>\
  \ \"y\")\n  actual.save\n  assert_equal(Date.today.to_s, actual.status_date.to_s)\n\
  end\n\ntest \"saving with a date doesn't override\" do\n  actual = StatusReport.new(:status_date\
  \ => 10.days.ago.to_date, :today => \"t\", :yesterday => \"y\")\n  actual.save\n\
  \  actual.reload\n  assert_equal(10.days.ago.to_date.to_s, actual.status_date.to_s)\n\
  end\n```\n\n这为报告放入了足够的数据使测试通过——我们不需要关心数据是什么。对于 Rails 2.x，需要在 `test/functional/status_reports_test.rb`\
  \ 中进行类似的更改：\n\n```ruby\ntest \"should create status_report\" do\n  assert_difference('StatusReport.count')\
  \ do\n    post :create, :status_report => {:today => \"t\", :yesterday => \"y\"\
  }\n  end\n  assert_redirected_to status_report_path(assigns(:status_report))\nend\n\
  ```\n\n\n\n\n\n其次，更具体到这类验证问题的是，使用某种工厂工具或通用设置方法来生成结构良好的默认数据，使得保持数据与不断变化的有效性定义同步变得容易得多。关于该主题，请参阅\
  \ *使用工厂修复固定件* 章节中的更多内容。\n\n无论如何，修复旧数据是在分散精力：我们面临着更大的问题。记住，我们希望只有当今天和昨天都为空时，状态才为无效。我们需要编写几个后续测试来确认我们没有过头。这些测试位于\
  \ `test/unit/status_report_test.rb` 中。\n\n| [huddle3/test/unit/status_report_test.rb](http://media.pragprog.com/titles/nrtest/code/huddle3/test/unit/status_report_test.rb)\
  \ |\n\n```ruby\ntest \"a report with yesterday blank is valid\" do\n  actual = StatusReport.new(:today\
  \ => \"today\", :yesterday => \"\")\n  assert actual.valid?\nend\n\ntest \"a report\
  \ with today blank is valid\" do\n  actual = StatusReport.new(:today => \"\", :yesterday\
  \ => \"yesterday\")\n  assert actual.valid?\nend\n```\n\n哎呀。\n\n```\n1) Failure:\n\
  test_a_test_with_today_blank_is_valid(StatusReportTest)\n[/test/unit/status_report_test.rb:36]:\n\
  <false> is not true.\n\n2) Failure:\ntest_a_test_with_yesterday_blank_is_valid(StatusReportTest)\n\
  [/test/unit/status_report_test.rb:31]:\n<false> is not true.\n```\n\n在此时，我们想要移动到自定义验证，因为\
  \ Rails 提供的验证函数无法为我们完美解决这个问题。\n\n将 `app/model/status_report.rb` 中的验证行替换为以下对纯 `validate`\
  \ 的调用以及关联方法：\n\n| [huddle3/app/models/status_report.rb](http://media.pragprog.com/titles/nrtest/code/huddle3/app/models/status_report.rb)\
  \ |\n\n```ruby\nvalidate :validate_has_at_least_one_status\n\ndef validate_has_at_least_one_status\n\
  \  if today.blank? && yesterday.blank?\n    errors[:base] << \"Must have at least\
  \ one status set\"\n  end\nend\n```\n\n我们又回到了通过测试.[[20]](#f_0027.html_FOOTNOTE-20)\
  \ 顺便说，这是我们在本章中看到的不同于 Rails 3 和 Rails 2 的行代码。之前的适用于 Rails 3。在 Rails 2 中，错误通过方法调用\
  \ `errors.add_to_base()` 添加。\n\n关于测试什么以及何时测试的问题，这里有几点：\n\n- 这里的通用情况非常重要。始终尝试从两边测试边界。如果你正在测试管理员是否应该看到某个链接，你还必须测试普通用户是否无法看到它。只有当你的测试涵盖了两个方向的策略边界时，它们才能为你提供应用程序的准确图景。\n\
  - 尽管我们不需要测试 Rails 验证方法本身，但我们确实需要验证模型对象在特定状态下为无效的运行行为。在严格的 TDD 过程中，正是有效性测试促使我们最初添加\
  \ Rails 验证方法。\n- 是否返回并添加一个控制器测试来验证无效对象的行为是一个开放性问题。按照常例，我们在控制器骨架中插入了一个通用测试，使用 mock\
  \ 对象来覆盖通用失败用例（详见章节 *使用 mock 对象* 章节中所示），这意味着我们不需要为每一种不同的可能的模型失败都返回去测试控制器行为，除非当然，每个特定的失败实际上决定了不同的控制器行为。\n\
  \n现在，这看起来像是有大量工作，因为我们正以极其详尽的细节检查每一个步骤。但在实践中，这些每个测试周期都非常快——对于像这样相对简单的测试，范围在 5 到 15\
  \ 分钟之间。\n\n## 现在关注安全！\n\n让我们看看使用 Devise gem 的 Huddle 登录和安全模型。Devise 有它自己的一套方法，但我们需要使用它们来测试我们的控制器。假设我们的需求如下：\n\
  \n1. 用户必须登录才能查看状态报告。\n2. 用户必须始终有一个当前项目。\n3. 用户可以编辑自己的报告。\n\n为了在整个应用中全局强制 Devise，我们需要在\
  \ `ApplicationController` 内部添加以下：\n\n| [huddle3/app/controllers/application_controller.rb](http://media.pragprog.com/titles/nrtest/code/huddle3/app/controllers/application_controller.rb)\
  \ |\n\n```ruby\nbefore_filter :authenticate_user!\n```\n\n\n\n\nDevise 机制非常简单。调用\
  \ `login_as_one` 直接调用 Devise 的 `sign_in`，这模拟了一个虚假的用户登录。\n\n完成此设置后，测试再次通过了。\n\n##\
  \ 应用安全性\n\n既然现在要求用户登录，创建状态报告的表单中就不应该再包含 `user_id` 作为表单项，因为当前登录的用户被假设为创建者。同样，虽然我们没有指定设置它的机制，但\
  \ `project_id` 将始终是一个隐式的当前项目，也不再需要在表单中显式指定。这引导我们进行一个新测试……嗯，实际上是对现有测试的修改。在 `test_helper.rb`\
  \ 中，添加以下辅助方法，以便在测试会话中设置当前项目：\n\n```ruby\n## huddle3/test/test_helper.rb\ndef set_current_project(symbol)\n\
  \  @request.session[:project_id] = projects(symbol).id\nend\n```\n\n然后，修改之前编写的状态报告测试，从我们几页前编写的测试中移除项目和用户：\n\
  \n```ruby\n## huddle3/test/functional/status_reports_controller_test.rb\ntest \"\
  creation of status report with data\" do\n  set_current_project(:one)\n  assert_difference('StatusReport.count',\
  \ 1) do\n    post :create, :status_report => {\n      :yesterday => \"I did stuff\"\
  ,\n      :today => \"I'll do stuff\"\n    }\n  end\n  actual = assigns(:status_report)\n\
  \  assert_equal(projects(:one).id, actual.project.id)\n  assert_equal(users(:one).id,\
  \ actual.user.id)\n  assert_equal(Date.today.to_s(:db), actual.status_date.to_s(:db))\n\
  \  assert_redirected_to status_report_path(actual)\nend\n```\n\n在第一个代码块中创建并在之前显示的第\
  \ 2 行调用的测试辅助方法在测试会话中设置了当前项目；目前，我们并不不在乎没有 UI 方式来设置当前项目。\n\n现在，这本书这一章节的初稿实际上将其作为一个独立的测试提出的；作为一般原则，除非测试确实因为代码的更改而损坏，否则修改现有测试并不是一个好主意。但在这种情况下，原始测试的行为是非常危险的，必须改变——我们不想表单中的\
  \ `user_id` 被任何方式认可，以防止恶意用户在你的名义下发布恶毒内容。因此，我们改为编辑现有的测试。\n\n防止恶意用户是下一个测试，但让我们先通过这个。`StatusReportsController`\
  \ 中的 `create` 方法需要修改，使其起始部分如下：\n\n```ruby\ndef create\n  params[:status_report].merge!(:user_id\
  \ => current_user.id,\n  :project_id => current_project.id)\n  @status_report =\
  \ StatusReport.new(params[:status_report])\n  ## rest of method as before\nend\n\
  ```\n\n`current_user` 方法由 Devise 定义，由于我们为了到达这一步需要登录，因此它保证不为空。我们还需要一个始终不为空的 `current_project`。将此放入\
  \ `ApplicationController` 中：\n\n```ruby\n## huddle3/app/controllers/application_controller.rb\n\
  helper_method :current_project\ndef current_project\n  project = Project.find(session[:project_id])\
  \ rescue Project.last\nend\n```\n\n如果 session 中没有 `project_id`，该方法将返回最近创建的项目。这几乎肯定不是最终逻辑，但我们目前可以应付。\n\
  \n## 惩罚不法者\n\n是时候惩罚那些试图通过在表单提交中放入他人的 `user_id` 来绕过网站的恶人了。目前，根据之前的代码，提交的 ID 被忽略，转而使用实际登录的用户。但为什么不踢掉任何尝试伪造\
  \ `user_id` 的用户呢？`status_reports_controller_test.rb` 中的测试看起来如下：\n\n```ruby\n## huddle3/test/functional/status_reports_controller_test.rb\n\
  test \"redirect and logout if the user tries to snipe a user id\" do\n  noel = User.create!(:email\
  \ => \"railspcriptions@gmail.com\",\n  :password => \"banana\", :password_confirmation\
  \ => \"banana\")\n  set_current_project(:one)\n  assert_difference('StatusReport.count')\
  \ do\n    post :create, :status_report => {\n      user_id => noel.id,\n      :yesterday\
  \ => \"I did stuff\",\n      :today => \"I'll do stuff\"\n    }\n  end\n  assert_nil\
  \ session[:user_id]\n  assert_redirected_to(new_session_path)\nend\n```\n\n这个测试与之前的测试有几处不同。在第\
  \ 7 行，我们将一个新创建的用户的 `user_id` 添加到了 params 中。在第 5 行，我们显式测试 `StatusReport.count` 不改变——即没有创建报告。最后，第\
  \ 11 行和第 12 行断言用户已注销并跳回登录页面。\n\n该测试中有几点在目前会失败（尽管长期来看保留它是有意义的）。最好一次解决这些问题。第一个失败是\
  \ `assert_difference` 调用，所以我们需要阻止新对象的创建。\n\n第一次尝试有两个问题。首先，它很丑陋；其次，它不起：\n\n```ruby\n\
  def create\n  if params[:status_report][:user_id].nil? || (params[:status_report][:user_id]\
  \ == current_user.id)\n    params[:status_report].merge!(:user_id => current_user.id,\n\
  \    :project_id => current_project.id)\n    @status_report = StatusReport.new(params[:status_report])\n\
  \  end\n  respond_to do |format|\n    if @status_report && @status_report.save\n\
  \      flash[:notice] = 'StatusReport was successfully created.'\n      format.html\
  \ { redirect_to(@status_report) }\n      format.xml { render :xml => @status_report,\
  \ :status => :created,\n      :location => @status_report }\n    else\n      format.html\
  \ { render :action => \"new\" }\n      format.xml { render :xml => @status_report.errors,\n\
  \      :status => :unprocessable_entity }\n    end\n  end\nend\n```\n\n在第 2-6 行，只有当存在用户\
  \ ID 时才尝试创建对象；如果 ID 与当前用户不同，对象的存在是第 9 行 save 测试的前提。\n\n由于在失败情况下，代码尝试渲染 `new` 操作，这假设了存在\
  \ `@status_report`。我们可以尝试在第 16 行将其重定向，但那是进入一个我们几秒后就必须离开的死胡同。让我们尝试一个更通用的解决方案：\n\n\
  ```ruby\ndef create\n  if (params[:status_report][:user_id] &&\n  params[:status_report][:user_id]\
  \ != current_user.id)\n    sign_out(current_user)\n    redirect_to new_user_session_path\n\
  \    return\n  end\n  params[:status_report].merge!(:user_id => current_user.id,\n\
  \  :project_id => current_project.id)\n  @status_report = StatusReport.new(params[:status_report])\n\
  \  respond_to do |format|\n    if @status_report && @status_report.save\n      flash[:notice]\
  \ = 'StatusReport was successfully created.'\n```\n\n\n\n\n```ruby\nformat.html\
  \ { redirect_to(@status_report) }\nformat.xml { render :xml => @status_report, :status\
  \ => :created,\n:location => @status_report }\nelse\nformat.html { render :action\
  \ => \"new\" }\nformat.xml { render :xml => @status_report.errors,\n:status => :unprocessable_entity\
  \ }\nend\nend\n```\n\n现在测试全部通过了。第 2 行的 `if` 语句捕获无效表单，注销和重定向在那里发生，第 6 行的 `return`\
  \ 防止了进一步处理。\n\n如果能将此变成一个更通用的方法就太好了——问题在于，如果我们仅仅将初始的 `if` 语句转换为辅助方法，`return` 语句仍然需要在实际的动作（action）中。如果不是，动作将继续执行，导致双重渲染错误（double-render\
  \ error）。\n\n这里有一个解决方案：方法的通用部分放在 `ApplicationController` 中。它对当前用户 ID 执行相同的测试，如果不匹配则执行注销和重定向，并返回\
  \ `true`：\n\n```ruby\ndef redirect_if_not_current_user(user_id)\n  if user_id &&\
  \ user_id != current_user.id\n    sign_out(current_user)\n    redirect_to new_user_session_path\n\
  \    return true\n  end\n  false\nend\n```\n\n控制器方法现在需要获取该结果并用它停止自己的处理。\n\n```ruby\n\
  def create\n  redirect_if_not_current_user(params[:status_report][:user_id]) and\
  \ return\n  params[:status_report].merge!(:user_id => current_user.id,\n  :project_id\
  \ => current_project.id)\n  @status_report = StatusReport.new(params[:status_report])\n\
  \  respond_to do |format|\n    if @status_report.save\n      format.html { redirect_to(@status_report,\n\
  \      :notice => 'Status report was successfully created.') }\n      format.xml\
  \ { render :xml => @status_report, :status => :created,\n:location => @status_report\
  \ }\n    else\n      format.html { render :action => \"new\" }\n      format.xml\
  \ { render :xml => @status_report.errors,\n      :status => :unprocessable_entity\
  \ }\n    end\n  end\nend\n```\n\n第 2 行是关键：它调用通用方法，如果结果为真则返回。那个版本是可读性最高的，即使它看起来有点\
  \ Perl 风格。我们也可以尝试以下方法：\n\n```ruby\nreturn if redirect_if_not_current_user(params[:status_report][:user_id])\n\
  ```\n\n或者：\n\n```ruby\nif redirect_if_not_current_user(params[:status_report][:user_id])\n\
  \  return\nend\n```\n\n或者，我们可以尝试在控制器的顶部使用 `before_filter`：\n\n```ruby\nbefore_filter\
  \ :redirect_if_not_current_user, :only => [:create]\n```\n\n在这种情况下，我们不需要在 `create`\
  \ 方法中写任何内容，但辅助方法需要进行一些变化。首先，返回值需要反转：如果发生了重定向，则返回 `false` 以停止进一步处理，如果用户正常则返回 `true`。其次，过滤器方法不能接受参数，因此从\
  \ `params[:status_report][:user_id]` 的提取需要在过滤器方法中完成。\n\n## 现在测试全部通过了。第 2 行的 `if`\
  \ 语句捕获无效表单，注销和重定向在那里发生，第 6 行的 `return` 防止了进一步处理。\n\n如果能将此变成一个更通用的方法就太好了——问题在于，如果我们仅仅将初始的\
  \ `if` 语句转换为辅助方法，`return` 语句仍然需要在实际的动作（action）中。如果不是，动作将继续执行，导致双重渲染错误。\n\n这里有一个解决方案：方法的通用部分放在\
  \ `ApplicationController` 中。它对当前用户 ID 执行相同的测试，如果不匹配则执行注销和重定向，并返回 `true`：\n\n控制器方法现在需要获取该结果并用它停止自己的处理。\n\
  \n第 2 行是关键：它调用通用方法，如果结果为真则返回。那个版本是可读性最高的，即使它看起来有点 Perl 风格。我们也可以尝试以下方法：\n\n或者：\n\n\
  或者，我们可以尝试在控制器的顶部使用 `before_filter`：\n\n在这种情况下，我们不需要在 `create` 方法中写任何内容，但辅助方法需要进行一些变化。首先，返回值需要反转：如果发生了重定向，则返回\
