  Copyright © 2011, The Pragmatic Bookshelf.\n\n\n\n\n\n# 引言\n\n集成测试的使用频率似乎比 Rails\
  \ 内置的其他测试类型要低。无疑，关于如何以及何时使用内置集成测试的在线讨论也要少得多，这可能是因为集成测试并不完全对应于经典的 TDD/BDD 流程（而且在它们可能契合的位置上，它们已在很大程度上被\
  \ Cucumber 代替了）。一方面，这很遗憾，因为集成测试是对你的应用程序进行高层测试的一种强大且灵活的方法。如果执行得当，它们甚至可以作为验收测试。另一方面，我和其他人一样，存在低使用它们的问题。就价值而言，在我使用集成测试时，它们确实非常方便。\n\
  \n## 名字的含义，第三部分\n\n我喜欢“集成测试”这个名字。所以，我这里没什么好说的。\n\n嗯，我应该指出集成测试和验收测试之间的区别。集成测试是由开发者编写的，面向开发者读者；而验收测试是由客户编写（或在与客户紧密咨询后编写），面向客户。验收测试通常包含某种领域特定语言（DSL）的魔法，允许客户可读的内容能够作为测试自动执行；详情请参阅章节使用\
  \ Cucumber 进行验收测试。\n\n## 在集成测试中测试什么\n\n集成测试是 Rails 中测试跨一个或多个控制器动作（controller actions）过程的首选工具。两种常见的用例是多步注册过程和购买/结账的电子商务功能。在这两种情况下，整个用户任务流具有完整性，只有当所有步骤都能一起执行时，才能进行完全测试。根据经验法则，如果一个控制器动作通过会话状态或其他数据共享方法与未来的控制器动作进行通信，你可能应该有一个覆盖整个过程的集成测试或验收测试。\n\
  \n集成测试通常与测试驱动开发过程中的正常紧凑循环分开编写。通常，会提前编写大量此类测试，作为需求、开发指南或完成情况的证明。有时，它们在主要开发之后编写，以确保那些仅单独测试过的部分实际上在进行预期的通信——例如，捕获当一个方法使用一个键将数据保存到会，而随后的方法在\
  \ session 中查找另一个键时产生的潜在问题。哎。\n\n## 集成测试中有哪些可用？\n\nRails 集成测试与控制器测试（controller tests）类似。它们导入相同的断言模块，因此控制器测试中可用的任何断言也可以从集成测试中调用。同样的一组方法名可模拟\
  \ HTTP 请求（`get`, `post`, `put`, `delete`, `head` 和 `xhr`），尽管我们稍后会看到，这些方法与控制器版本之间存在一些细微差异。\n\
  \n集成测试与控制器测试两个最大的差异如下：\n\n*   集成测试没有绑定到特定的控制器。这意味着 HTTP 请求方法的 `action` 参数需要一个可以解析为系统中已知\
  \ URL 的对象。大多数情况下，这仅仅是 URL 字符串，例如 `get ’tasks/show’`。\n\n*   集成测试维护一个或多个独立的会话，这些会话在不同的模拟用户请求之间持续——在控制器测试中，会话是响应的一个特性，如果你模拟多次调用，则无法保证其行为正确。\n\
  \n通过 HTTP 模拟方法，你可以使用 `url_for` 方法使用任何 Rails 可以转换为 URL 的对象。参数可以是哈希或或资源对象，例如 `get\
  \ url_for(tasks(:one))`。\n\n所有 HTTP 请求方法的第二个参数都是参数哈希值。使用第二个参数是集成测试中添加参数的首选机制，而不是为\
  \ URL 构建查询字符串或使用复杂的 `url_for` 调用。第三个参数（很少使用）包含你想要为请求设置的任意 HTTP 请求头。与控制器方法一样，`xhr`\
  \ 方法接受第一个参数指定 HTTP 动词，然后按顺序包含其他请求方法的相同参数。\n\n默认情况下，集成测试请求不会跟随重定向。然而，除了 `xhr` 之外的每个方法都有\
  \ `via_redirect` 变体，例如 `post_via_redirect`，它会执行请求并跟随所有重定向，直到获得一个不是重定向的结果。在此过程中遇到的任何和所有会话更改将进入会话对象，要测试的输出将是最终目的地的输出。如果你想在测试内部不那么自动地控制重定向行为，集成测试方法\
  \ `follow_redirect!` 将如你预期的那样恰好跟随一个重定向，如果最后一个请求没有以重定向结束，则抛出异常。你可以使用集成测试方法 `redirect?`\
  \ 来判断最后一个请求是否为重定向。70\n\n还有两个方法允许你更改测试中所有后续请求的设置。`https!` 方法将使所有后续请求表现得像使用了 HTTPS。注意，这实际上不会加密任何内容，因为没有发出实际的服务器请求，但任何依赖于请求安全性的控制器端逻辑都将得到适当测试。使用\
  \ `https!(false)` 切换回非 HTTPS 请求。同样，多主机应用程序可以使用 `host!` 方法进行测试。如果你的应用程序有依赖子域的逻辑，可以使用\
  \ `host!(blog.railsprescriptions.com)` 这样的行来切换。\n\n注意，与控制器测试不同，集成测试不允许将会话值传递到请求方法。你可以通过\
  \ `session` 方法直接设置会话的初始状态，它返回一个哈希——所以 `session[:user_id] = 3`。你应该只使用这种机制设置会话的初始状态。在实际测试期间，你应该让被测试的控制器动作隐式设置\
  \ session。\n\n## 模拟多部分交互\n\n集成测试的通用结构非常简单：调用一系列控制器，并验证一切都按计划运行。\n\n成功进行集成测试的关键在于意识到集成测试的目的与你的控制器和模型测试中已经存在（或将存在）的详细测试不同。集成测试是为了验证整个应用程序的端到端行为，而不是为了测试代码的内部工作原理。尝试使用集成测试来填充单元测试的角色不仅会让编写集成测试变得更加困难，而且当你对应用程序进行合理的更改时，还意味着更多的测试断裂。\n\
  \n开发期间集成测试的目的是验证在较大整体的不同部分之间传递的数据是否被正确地保存和正确地使用——你试图避免测试间隙。将集成测试作为验收测试的目的是对应用程序的行为进行高层验证。在任何一种情况下，你都不需要关于输出的具体\
  \ HTML 或模型后端的细节有大量细节——那是实际功能测试或单元测试的工作。你正在尝试测试系统的整体行为，而不担心实现细节。\n\n\n\n\n那么，集成测试应该是什么样的呢？让我们从\
  \ Huddle 项目中举一个例子，该项目是编写你的第一个测试章节中的每日捷站（scrum）支持工具。假设有多个页面，用户可以在这些页面上点击复选框并将某个用户添加到关注列表中。在某个时刻，用户可以进入列出所有正在关注的人的页面，允许用户查看他们的当前状态或发送消息等。\n\
  \n使用以下命令创建集成测试：\n\n```bash\n$ script/generate integration_test add_friends\n```\n\
  \n你的测试骨架看起来如下：\n\n```ruby\nrequire 'test_helper'\n\nclass AddFriendsTest < ActionController::IntegrationTest\n\
  \  fixtures :all\n\n  # 将此替换为你的真实测试。\n  test \"the truth\" do\n    assert true\n\
  \  end\nend\n```\n\n假设所有这些控制器方法确实存在，集成测试的第一轮运行可能如下所示（注意，目前项目中实际上不存在任何让此测试通过的代码）：\n\
  \n```ruby\ntest \"add friends\" do\n  post \"sessions/create\", :login => \"quentin\"\
  , :password => \"monkey\"\n  assert_equal(users(:quentin).id, session[:user_id])\n\
  \n  get \"users/show\", :id => users(:quentin).id\n  xhr :post, \"users/toggle_interest\"\
  , :id => users(:aaron).id\n  assert_equal [users(:aaron).id], session[:interest]\n\
  \n  get \"users/show\", :id => users(:old_password_holder).id\n  xhr :post, \"users/toggle_interest\"\
  , :id => users(:old_password_holder).id\n  assert_equal [users(:aaron).id, users(:old_password_holder).id].sort,\
  \ session[:interest].sort\n\n  # 测试从 session 中移除\n  xhr :post, \"users/toggle_interest\"\
  , :id => users(:old_password_holder).id\n  assert_equal [users(:aaron).id], session[:interest]\n\
  \n  get \"users/show\", :id => users(:rover).id\n  assert_select \"div.interest\"\
  \ do\n    assert_select div, :text => \"Aaron\", :count => 1\n    assert_select\
  \ div, :text => \"Old\", :count => 0\n  end\nend\n```\n\n该测试与控制器测试类似，因此其活动应该相对清晰；它通过了一些页面跳转，偶尔向服务器发起\
  \ Ajax 调用以添加或移除感兴趣的人，然后检查 session 是否符合预期。在最后，我们对输出进行了恰少的测试，以确保 session 中的值确实被使用了。\n\
  \n在实际系统中，你可能希望将这个长测试重构为一些较短的方法，这些方法封装了调用以及与之相关的一些断言。集成测试似乎鼓励创建相当复杂的机制来快速定义复杂的用户行为——当这种机制推向逻辑终时，就会产生\
  \ Webrat 或 Capybara（参见使用 Webrat 和 Capybara 编写更好的集成测试章节）。这里有一个示例方法，它接收一个用户和一个已经在\
  \ session 中的预期用户列表。该方法模拟了 Ajax 切换调用并确认 session 预期列表：\n\n```ruby\ndef toggle_user(user_symbol,\
  \ initial_user_expectation)\n  new_friend = users(user_symbol)\n  xhr :post, \"\
  users/toggle_interest\", :id => new_friend.id\n  expected_users = initial_user_expectation.map\
  \ { |sym| users(sym).id }\n  assert_equal expected_users.sort, session[:interest]\n\
  end\n```\n\n### 模拟多个会\n\n该测试与控制器测试类似，因此其活动应该相对清晰；它通过了一些页面跳转，偶尔向服务器发起 Ajax 调用以添加或移除感兴趣的人，然后检查\
  \ session 是否符合预期。在最后，我们对输出进行了恰少测试，以确保 session 中的值确实被使用了。\n\n在实际系统中，你可能希望将这个长测试重构为一些较短的方法，这些方法封装了调用以及与之相关的一些断言。集成测试似乎鼓励创建相当复杂的机制来快速定义复杂的用户行为——当这种机制推向逻辑终时，就会产生\
  \ Webrat 或 Capybara（参见使用 Webrat 和 Capybara 编写更好的集成测试章节）。这里有一个示例方法，它接收一个用户和一个已经在\
  \ session 中的预期用户列表。该方法模拟了 Ajax 切换调用并确认 session 预期列表：\n\n```ruby\ndef toggle_user(user_symbol,\
  \ initial_user_expectation)\n  new_friend = users(user_symbol)\n  xhr :post, \"\
  users/toggle_interest\", :id => new_friend.id\n  expected_users = initial_user_expectation.map\
  \ { |sym| users(sym).id }\n  assert_equal expected_users.sort, session[:interest]\n\
  end\n```\n\n\n\n\n```ruby\naaron_session = login(\"aaron\", \"monkey\")\nquentin_sesson.message(users(:aaron))\n\
  end\n```\n\n由于 `open_session` 返回了 session 且它是方法中的最后一个表达式，因此 `login` 方法会返回一个已完全登录并准备好接受更多调用的\
  \ session。这种机制的妙之处在于，断言模块中的辅助方法可以使用该 session 作为隐式的 `self`，因此辅助方法内部的调用可以采用 `get \"\
  login\"` 的形式，而不是 `session.get \"login\"`。\n\n尽管如此，虽然我通常非常喜欢所有关于 Ruby 和元编程的东西，但这对我来说确实感觉有点别扭。如果你想做更直观一点，例如这样，我是不会抱怨的：\n\
  \n```ruby\ndef login_as(session, un, pw)\n  session.post(\"session/new\", :username\
  \ => un, :password => pw)\nend\n\ndef message_from(session, to)\n  session.post(\"\
  messages/send\", :to => to)\nend\n\ntest \"trying logins\" do\n  quentin_session\
  \ = open_session\n  aaron_session = open_session\n  login_as(quentin_session, \"\
  aaron\", \"monkey\")\n  login_as(aaron_session, \"aaron\", \"monkey\")\n  message_from(quentin_session,\
  \ aaron_session)\nend\n```\n\n## 何时使用集成测试\n\n本书这部分的测试工具——Rails 集成测试、Webrat、Capybara\
  \ 和 Cucumber——设计用于工作在单元测试之上的水平。当你使用这些工具来验证在其他地方进行单元测试的组件之间的交互时，这些工具的效果最好。Cucumber\
  \ 具有自然语言语法，非常适合客户或其他非开发人员创建或批准验收测试场景的场景。集成测试往往更多地作为一种开发者工具来使用，尽管 Webrat 和 Capybara\
  \ 确实让指定交互的语法变得更易编写和阅读。这三个测试工具作为“黑盒”测试也有用，在这些测试中，你仅通过 URL 请求与应用程序交互，并仅评估应用程序的响应。黑盒测试对于测试遗留代码很有，因为测试不依赖于代码的实际结构。\n\
  \n集成或验收测试应该覆盖应用程序中任何包含多个步骤、基于之前创建的 session 数据或跨越多个用户操作的过程。诀窍是将这些测试集成到你的 TDD 过程中。通常，这种级别的集成测试相对于某个功能的\
  \ TDD 测试，要么先写，要么后写。如果先写，它们可以作为验收测试并以 TDD 的方式驱动代码编写——失败的验收测试会触发标准的 TDD 过程使验收测试通过。如果后写，集成测试往往不会驱动新代码，因为它们正在验证由\
  \ TDD 创建的本应该已经正常工作的组件之间的交互。\n\nRails 集成测试提供了跨越多个用户会测试应用程序行为最简单的方法——它们提供了在测试中模拟多个用户访问网站的唯一简易方法。\n\
  \n### 脚注\n\n- `redirect?` 的实现是 `status/100 == 3`。我正纠结这算高明还是愚蠢。\n\nCopyright © 2011,\
  \ The Pragmatic Bookshelf.\n\n# 第 14 章\n\n## 使用 Webrat 和 Capybara 编写更好的集成测试\n\n\
  Webrat 由 Seth Fitzimmons 创建并由 Brian Helmkamp 维护，可用于验收测试（即将应用程序视为黑盒的测试）变得更易编写和执行。到这里，你已经知道我无法抗拒一个好的命名故事；Webrat\
  \ 中的“RAT”是 Ruby Acceptance Testing 的缩写。当 Jonas Nicklas 创建一个库来增强 Webrat 的验收工具功能时，他延续了鼠类主题，并将他的库命名为\
  \ Capybara。\n\n尽管经常与 Cucumber 配合使用，但 Webrat 和 Capybara 支持普通的 Rails 集成测试，并提供更具表现力、更易读的语法。此外，同一个测试可以在\
  \ Rails 环境中无头运行，并通过更改驱动程序在基于浏览器的测试环境（如 Selenium）运行。Capybara 还允许你使用 Celerity 和 Culerity\
  \ gem 来测试 JavaScript 场景，而无需打开实际的浏览器窗口。\n\nWebrat 和 Capybara 非常相似。事实上，如果互联网上的传闻可信（真的，互联网又什么时候撒过谎呢？），当你在你读到这里时，它们可能已经合并为一个项目了。在本章中，我将它们视为或多已经合并，并在差异出现时指出它们之间的区别。\n\
  \n## 安装 Webrat 和 Capybara\n\nWebrat 和 Capybara 都是框架无关的，适用于 Test::Unit、RSpec 和 Cucumber。可以以\
  \ gem 的形式安装其中之一：\n\n- `sudo gem install webrat`\n- `sudo gem install capybara`\n\
  \n一旦安装了 Webrat，如果你在使用 Rails，则需要在 `test/test_helper.rb` 文件中放置一些设置代码：\n\n```ruby\n\
  require \"webrat\"\n\nWeb.configure do\n  config.mode = :rails\nend\n```\n\nCapybara\
  \ 的默认设置更简单。如果你在 Cucumber 之外使用 Capybara，你需要：\n\n```ruby\nrequire 'capybara'\nrequire\
  \ 'capybara/dsl'\n```\n\n然后在使用 Capybara 命令的模块或类内部，你需要调用 `include Capybara`。\n\n\
  ## 使用验收测试的“鼠类”\n\nWebrat 和 Capybara 是相对简单的库，有两个主要目的：首先提供一个 DSL 用于在集成或验收测试中轻松指定表单输出和用户交互；其次，提供同样简单的方法来指定交互的预期输出。\n\
  \n这些鼠类库的特征元素是它们在测试中指定表单和链接元素的活性；这种灵活性在所有核心 API 方法中是一致的。在 Webrat 或 Capybara API 方法中，你通过字符串来识别要操作的元素。该字符串被称为字段标识符或定位符，可以通过以下三种方式之一匹配\
  \ DOM 元素：\n\n* 关联标签的文本（或对于锚点标签，标签内部的文本）\n* DOM ID\n* 表单字段名称（或对于锚点标签，HTML title 属性）\n\
  \n如果字段标识符是正则表达式，Webrat 将根据除表单字段名称以外任何这些属性中的正则表达式正确找到匹配的字段。Capybara 在实现上与 XPath 结合得紧得多，不接受正则表达式。Capybara\
  \ 的 XPath 后端意味着 Capybara 的查找是大小敏感的，而 Webrat 的查找则不敏感。\n\n\n\n|   | `<label for=\"\
  phone\">`手机号码`</label>` |\n|   | `<input id=\"phone\" name=\"user[phone]\" />` |\n\
  \n这些库中另一个一致的元素是，所有通过字段标识符操作表单元素的方法都充当了验证该元素存在——如果库找不到匹配的表单元素，测试将失败。\n\n你与 Webrat\
  \ 或 Capybara 的大部分交互都是通过以下九个方法进行的：\n\n*   `attach_file(field_locator, path, content_type\
  \ = nil)`\n    模拟向多部分表单（multipart form）附加文件。`field_locator` 是如前所述接收文件的字段。`path`\
  \ 是本地文件的路径，而 `content_type` 是可选的 MIME 类型。Capybara 版本不接受第三个参数。\n\n*   `check(field_locator)`\n\
  \    断言匹配 `field_locator` 的字段是一个复选框，并将该复选框切换为已选中状态。\n\n*   `choose(field_locator)`\n\
  \    与 `check` 类似，但用于单选按钮。同一组中的任何其他单选按钮将会被取消选中。\n\n*   `click_button(value = nil)`\n\
  \    点击提交按钮；如果传递了 `value`，则使用其作为字段定位符来查找按钮。在 Webrat 中，如果没有值，则它将点击页面上的第一个按钮。在 Capybara\
  \ 中，定位符值是必须的。\n\n*   `click_link(text_or_title_or_id, options = {})`\n    点击由第一个参数指定的锚点链接。`text_or_title_or_id`\
  \ 参数与字段定位符类似，不同在于它匹配锚点标签的文本，以及 DOM ID 或 HTML `title` 属性。一个特性是，对于文本或标题，Webrat 执行子字符串文本匹配，但\
  \ DOM ID 必须精确匹配。Webrat 智能地处理文本中的 `&nbsp;`，将其视为空格，并且足够智能能够跟进伪造 HTTP 动词的 Rails JavaScript（但不够智能无法跟进\
  \ Rails 的 `link_to_remote` 调用）。我们稍后会详细讨论 Capybara 和 JavaScript。\n\n    在 Webrat\
  \ 中，你可以通过传递 `:method` 选项来覆盖 HTTP 动词，并通过传递 `:javascript => false` 来禁用 Rails 的 HTTP\
  \ 检查。类似的 `click_link_within` 接收 CSS 样式选择器和文本或标题作为参数，只有在匹配选择器的 DOM 元素内存在匹配的链接时才会点击该链接。\n\
  \n    Capybara 采用了一种不同的方式来限制范围，且不接受可选参数。Capybara 也不会对 `&nbsp;` 参数进行任何特殊处理。\n\n*\
  \   `fill_in(field_locator, options = {})`\n    该方法有一个选项，并且在每次调用中都会使用，例如 `fill_in(\"\
  Email\", :with => \"railsprescriptions@gmail.com\")`。它寻找匹配字段定位符的输入字段或文本区域，并在最终提交表单时将该字段的值设置为\
  \ `:with` 选项的值。\n\n*   `save_and_open_page`\n    这是一个**非常有帮助（wildly helpful）**的方法，用于诊断未按预期运行的测试。它会将当前响应保存到文件中（包括来自\
  \ `fill_in` 等其他方法的所有 DOM 更改），然后在你的默认浏览器中打开。这在 Cucumber 测试中也很有帮助。\n\n*   `select(option_text,\
  \ options = {})`\n    大多数时候也配合选项使用，例如 `select(\"Automotive\", :from => \"Industry\"\
  )`。该方法使具有给定显示文本的 HTML option 成为其 select 菜单中的被选中选项。如果指定了 `:from` 选项，则将其作为选择框的字段定位符。\n\
  \n*   `select_date(date_to_select, options = {})`\n    `select_datetime(time_to_select,\
  \ options = {})`\n    `select_time(time_to_select, options = {})`\n    这三个方法仅存在于\
  \ Webrat 中，允许你一次指定整个日期/时间序列选择器，假设你的表单使用了 Rails 默认的日期和时间选择器。大多数 JavaScript 选择器会提供一个你可以通过\
  \ `fill_in` 操作的文本字段。`:from` 选项的用法与 `select` 相同，且这些方法共享一个 `:id_prefix` 选项，该选项匹配在创建日期字段时指定的前缀。\n\
  \n*   `uncheck(field_locator)`\n    `check` 的相反操作。\n\n*   `visit(url = nil, http_method\
  \ = :get, data = {})`\n    创建一个指向指定 URL 的浏览器请求，使用指定的 HTTP 动词并将 `data` 参数中的键值对作为参数传递。通常，你会在测试开始时使用它；后续请求将通过\
  \ `click_button` 或 `click_link` 触发。在 Capybara 中，方法签名是 `visit(path, attributes =\
  \ {})`，且 HTTP 动词默认为 `GET`。\n\n## 简短示例\n\n在*模拟多部分交互（Simulating Multipart Interaction）*章节中，我们看到一个集成测试示例，它使用\
  \ Rails 核心集成测试功能来测试向 Huddle 添加朋友。让我们来看看该测试在更具“鼠味（rodent-y）”风格下可能的样子。这里是使用 Webrat\
  \ 的测试。这种情况可能有几种不同的写法：\n\n| 第 1 行 | `test \"add friends\" do` |\n| - | `visit login_path`\
  \ |\n| - | `fill_in :login, :with => \"quentin\"` |\n| - | `fill_in :password, :with\
  \ => \"monkey\"` |\n| 第 5 行 | `click_button :login` |\n| - | `assert_equal users(:quentin).id,\
  \ session[:id]` |\n| - | `visit users_path(users(:quentin))` |\n| - | `click_link\
  \ \"Toggle\"` |\n| 第 10 行 | `assert_equal users(:aaron).id, session[:id]` |\n| -\
  \ | `visit users_path(users(:quentin))` |\n| - | `click_link \"Toggle\"` |\n| -\
  \ | `assert_equal [users(:aaron).id, users(:old_holder).id].sort,` |\n| 第 15 行 |\
  \ `session[:id]` |\n| - | `visit users_path(users(:old_holder))` |\n| - | `click_link\
  \ \"Toggle\"` |\n| - | `assert_equal session[:interest]` |\n| 第 20 行 | `visit users_path(users(:rover))`\
  \ |\n| - | `assert_select \"interest\" do` |\n| - | `assert_select div, :text =>\
  \ \"Aaron\", count: 1` |\n| - | `assert_select div, :text => \"Old\", count: 0`\
  \ |\n| 第 25 行 | `end` |\n| - | `end` |\n\n相对于基础测试，这个测试中有几个有趣的点。这个测试比原始测试更具有验收测试（acceptance\
  \ test）风格。语言发生了变化，从应用类的语言如 `get \"users/show\", :id => users(:quentin)` 变为更偏用户的语言\
  \ `visit users_path(users(:quentin))` 和 `click_link \"Toggle\"`。原始集成测试直接进行服务器调用，而这个测试通过模拟表单提交和点击来推断服务器调用。在第\
  \ 2-5 行的登录情况下，这使得代码变得更冗长。然而，它使得测试是对整个栈从头到尾练习。\n\n并非如此。这里有一个关键点：与原始测试相比，这个测试作弊了。在原始集成测试中，切换调用都是触发\
  \ Ajax 响应的 `xhr` 调用。然而，Webrat 不处理 Ajax（除非我们在*Webrat and Ajax*章节中所配置它运行更慢的 Selenium\
  \ 测试）。在这种情况下，Webrat 测试假设切换链接在从 Ajax 链接以外的地方调用时仍然返回相同的值。\n\nCapybara 和 Webrat 各自在\
  \ Test::Unit 和 RSpec 变体中都有断言输出的方法。Webrat 在 Test::Unit 中具有如下：\n\n| | `assert_contain(\"\
  text\")` |\n| | `assert_not_contain(\"text\")` |\n| | `assert_have_selector(\"selector\"\
  , :attribute => \"something\")` |\n| | `assert_have_no_selector(\"selector\", :attribute\
  \ => \"something\")` |\n| | `assert_have_xpath(\"xpath\")` |\n| | `assert_have_no_xpath(\"\
  xpath\")` |\n\n它们在 RSpec 中看起来如下：\n\n| | `response.should contain(\"text\")` |\n\n\
  \n\n\n\n| | `response.should_not contain(\"text\")` |\n| | `response.should have_selector(\"\
  selector\", :attribute => \"something\")` |\n| | `response.should_not have_selector(\"\
  selector\", :attribute => \"something\")` |\n| | `response.should have_xpath(\"\
  xpath\")` |\n| | `response.should_not have_xpath(\"xpath\")` |\n\n`contain` 方法仅用于在输出中搜索文本（响应体是所有\
  \ Test::Unit 方法中输出的隐式源）。`selector` 方法与 `assert_select` 相似，但有两个不同之处：这些方法不是通过 `:text`\
  \ 选项来指定内容，而是使用 `:content`；此外任何 HTML 属性都不需在选择器中指定，而是可以作为键值对参数进行指定，例如 `assert_have_selector(\"\
  a\", :href => /solr/)`。参数的值部分可以是字符串或正则表达式。\n\nCapybara 在指定输出方面有一套略有不同的工具。默认情况下，这些工具是基于\
  \ XPath 的，但如果你像我一样更倾向于使用 CSS 选择器，你可以在测试的某处（例如在设置块中）放置 `Capybara.default_selector\
  \ = :css` 代码，将 CSS 设置为默认值。上一个测试的最后几行在 Capybara 中可能如下：\n\n| | `within(\"div.interest\"\
  ) do` |\n| | `page.has_css?(\"div\", :text => \"Aaron\", :count => 1)` |\n| | `page.has_no_css?(\"\
  div\", :text => \"Old\")` |\n| | `end` |\n\nCSS 默认选择器值仅适用于 `within` 方法。在这种情况下，`within`\
  \ 的作用与外部 `assert_select` 块相同；即它检查选择器是否存在，并将搜索范围限制在页面中该匹配标签内部的部分。在 Capybara 中，`within`\
  \ 不限于用于查询方法，也可以放置在交互方法周围，以将它们的搜索限制在页面的特定部分。\n\nCapybara 的整体查询方法略有不同。通用方法也命名为 `has_selector?`。该方法接受\
  \ CSS 选择器或 XPath 表达式，但不像 Webrat 方法那样接受任意的 HTML 属性作为选项。它确实接受基础的 `:count` 和 `:text`\
  \ 选项，还接受一个 `:visible` 选项（可以设置为 true 或 false 并根据显示状态进行过滤）。Capybara 还定义了 `has_css?`\
  \ 和 `has_xpath?`，它们都只是委托给 `has_selector?`。Capybara 还有一个 `has_content`；与 Webrat 方法类似，它在页面内搜索文本。\n\
  \n所有方法都有对应的否定版本，例如 `has_no_selector`。由于这些方法定义在页面对象上并且带有问号的布尔值，RSpec 的正常魔法重命名允许它们作为\
  \ RSpec 匹配器使用，如下：\n\n| | `within(\"div.interest\") do` |\n| | `page.should have_css(\"\
  div\", :text => \"Aaron\", :count => 1)` |\n| | `page.should_not have_css?(\"div\"\
  , :text => \"Old\")` |\n| | `end` |\n\nCapybara 还定义了一系列针对特定元素的匹配器方法。所有这些方法都接受字符串参数（即\
  \ Capybara 定位器），用于匹配 DOM ID 或元素文本，并且都有对应的否定方法。\n\n| | `has_button?` |\n| | `has_checked_field?`\
  \ |\n| | `has_content?` |\n| | `has_field?` |\n| | `has_link?` |\n| | `has_select?`\
  \ |\n| | `has_table?` |\n| | `has_unchecked_field?` |\n\n## Webrat 和 Ajax\n\nWebrat\
  \ 在 Rails 内部运行时有一个致命的弱点。它没有自己的 JavaScript 解释器，因此你正在加载的页面、点击的链接或填写的表单中的任何 JavaScript\
  \ 都会被静默忽略。在尝试测试带有任何类型的重大 Ajax 或 JavaScript 组件的应用时，这是一个局限性。\n\n作为一个部分替代方案，可以使用 `Selenium`\
  \ 或 `Watir` 通过浏览器内验证来驱动 Webrat。你必须安装想要使用的工具，并且为类型 `selenium` 设置 Rails 环境，这意味着需要一个列出\
  \ `database.yml` 的 `config/environments` 下的一个文件。在环境环境或测试文件的某处，你需要以下配置代码：\n\n```ruby\n\
  Webrat.configure do |config|\n  config.mode = :selenium\nend\n```\n\n\n\n\n\n这在测试文本是否移除时会导致一个奇怪的陷阱。正如我们在简要示例章节中看到的，Capybara\
  \ 提供了显式的否定方法，例如 `has_no_css?`。你应该始终使用否定方法，而不是使用诸如 `!has_css?` 这样的方法。[[75]](#f_0119.html_FOOTNOTE-75)\
  \ 原因在于 Capybara 的等待机制。假设你正在测试 Ajax 调用是否从页面上移除一个 DOM 元素。当调用否定方法 `has_no_css?` 时，如果\
  \ Ajax 方法尚未返回，元素可能仍然在那里，但否定方法知道等待并再次检查元素是否被移除。如果你错误地使用了正向方法 `has_css?`，该方法会发现所关注的元素存在并立即停止等待，因为正向方法存在的意义就是等待直到某些东西出现。这时感叹号运算符就会导致整个断言失败。教训是，Capybara\
  \ 提供否定方法是有原因的，你应该使用它们。\n\n在用 Rails 作为驱动程序时，还有另一个细微的陷阱：Capybara 不喜欢只带有哈希 href 的锚点标签，例如\
  \ `<a href=\"#\">`，因此你需要在 Rails 代码中避免这种写法。\n\n## 为什么要使用啮齿类（Rodents）？\n\n在某种意义上，为\
  \ Webrat 和 Capybara 提供独立的示例是很的，因为这两个工具的大部分用法都在 Cucumber 测试内部。不过，与 Rails 核心工具配合使用时，可以让\
  \ Rails 集成测试变得更像验收测试。如果出于实用或审美考虑无法选择 Cucumber，那么添加其中任何一个库都可以让你获得一些验收测试的收益。\n\n目前，我倾向于用\
  \ Capybara 开始一个新项目，但目前两者之间的差异还没有大到让我觉得有必要去转换现有的 Webrat 代码。当然，当你读到这里时，这些工具可能已经合并了，如果是那样，你应该使用留下的那一个。\n\
  \n在查看了 Rails 核心为验收和集成测试提供的功能后，是时候转向一个专门为验收测试设计的库了，即 Cucumber。\n\n### 脚注\n\n| [[71]](#f_0114.html_FNPTR-71)\
  \ | 当然，假设你已经安装了 MacPorts。请参阅 [`www.macports.org`](http://www.macports.org)。 |\n\
  | [[72]](#f_0115.html_FNPTR-72) | Webrat 文档说仅在 Mac OS X 上有效，但 Webrat 使用的 gem (Launchy)\
  \ 的文档似乎没有做任何类似的声明。请参阅 [`ramblingsonrails.com/using-webrats-save_and_open_page-on-linux`](http://ramblingsonrails.com/using-webrats-save_and_open_page-on-linux)\
  \ 获取 Linux 指令。 |\n| [[73]](#f_0116.html_FNPTR-73) | 我无法想象这有多大区别，但你可以假设我指的是大写的“Toggle”是文本标签，而小写的“toggle_for_aaron”\
  \ 是一个 DOM ID。 |\n| [[74]](#f_0117.html_FNPTR-74) | （感谢 [`wiki.github.com/brynary/webrat/selenium`](http://wiki.github.com/brynary/webrat/selenium)\
  \  Webrat wiki 提供的指令。） |\n| [[75]](#f_0118.html_FNPTR-75) | 在 RSpec 中，你应该避免使用 `should_not\
  \ have_css`。 |\n\nCopyright © 2011, The Pragmatic Bookshelf.\n\n# 第 15 章\n\n## 使用\
  \ Cucumber 进行验收测试\n\nCucumber 是一种用自然语言编写验收测试的工具（我几乎想说用纯英语，但那太局限了——Cucumber 支持许多不同的语言，包括\
  \ LOLcat）。它是简单清晰地进行验收测试的极佳方法，特别是当你想要让非技术客户签署你的验收测试时。另一方面，Cucumber 也可以成为一种诱人的方式，让你在感觉自己正在完成任务的同时原地打转。这其中有一个平衡点，我们将在本章中查看那个点在哪里。\n\
  \n## 开始使用 Cucumber\n\nCucumber 以 gem 的形式分发。在我写这些内容时，稳定版 gem 是 0.9.2。你还想要安装 Webrat\
  \ 或 Capybara 之一，Cucumber 将使用它们来定义常见的 浏览器模拟任务（参见章节使用 Webrat 和 Capybara 编写更好的集成测试）。与\
  \ RSpec 类似，Cucumber 既有核心 gem，也有 Rails 特定部分的独立 gem。\n\n如果你正在使用 Rails 3 和 Bundler，Cucumber\
  \ gems 应该像这样放在你的 Gemfile 中——如果你愿意，可以将 Webrat 替换为 Capybara。`cucumber-rails` gem 会自动引入核心的\
  \ `cucumber` gem。\n\n| | `group :test` `do` |\n| :--- | :--- |\n| | `gem` `'capybara'`\
  \ |\n| | `gem` `'database_cleaner'` |\n| | `gem` `'cucumber-rails'` |\n| | `end`\
  \ |\n\n在任何情况下，Cucumber 都期望一些依赖项。要开始使用 Cucumber，你需要生成一些文件。在根目录下运行以下命令：\n\n```bash\n\
  $ cucumber --testunit --capybara\n```\n\n生成器会创建一个 `features` 目录，你的 Cucumber feature\
  \ 都在其中，还有两个子目录。其中一个子目录包含一些设置代码；另一个将是你放置步骤定义的地方，我们稍后会详细介绍。你还得到了一个 Rake 文件和一个 `cucumber`\
  \ 脚本，它可以让你从命令行运行 Cucumber，并可以用于只运行一个 Cucumber feature 文件，以及其他技巧。如果你查看 `database.yml`\
  \ 文件，你会发现它增加了 Cucumber 环境条目，使得在理论上可以将你的 Cucumber feature 与其他测试同时运行，而不会让这两个测试互相干扰。默认情况下，Cucumber\
  \ feature 运行在“test”环境中，但你可以通过编辑 `features/support/env.rb` 文件来更改，该文件的默认行是 `ENV[\"\
  RAILS_ENV\"] ||= \"test\"`.[[76]](#f_0129.html_FOOTNOTE-76) `cucumber.yml` 文件包含我们目前不需要关注的一些设置。\n\
  \n## 编写 Cucumber Feature\n\nCucumber 允许你用轻结构化的自然语言格式编写新功能的验收测试，并将这些测试转换为可执行的 Ruby\
  \ 代码，以评估其正确性。我们稍后会详细讨论这可能如何影响你的工作流。首先，让我们来看一个例子。\n\n\n\n\n\n现在，Huddle 应用还没有什么用户界面。例如，目前没有方法将用户或用户的状态报告与项目关联起来。所以，让我们创建一个吧。在\
  \ Huddle 根目录下，运行以下命令：\n\n```bash\n$ script/rails generate:feature users_and_projects\n\
  exist features/step_definitions\ncreate features/manage_users_projects.feature\n\
  create features/step_definitions/users_and_projects_steps.rb\ngsub features/support/paths.rb\n\
  ```\n\n在 Rails 2.x 中，初始命令是 `script/generate feature`。Cucumber 生成器会为你提供一个 feature\
  \ 文件（可以在其中编写实际代码）以及一个 Ruby 文件（可以在其中编写步骤定义（step definitions），用于连接 Cucumber 和你的实际\
  \ Rails 应用程序）。此外还有一些模板代码，如果你尝试对基本功能进行验收测试，这些代码很有用（但我们不需要，所以我把它们删除了）。步骤定义文件中也有相关的模板代码，它们也将被删除。\n\
  \n相反，我将描述我所实现的功能。一个 Cucumber feature 以头信息开头：\n\n`huddle3/features/manage_users_projects.feature`\n\
  ```gherkin\nFeature: Add users to project\n  In order to make this useable\n  much\
  \ on the planet wants to be able to add users to a project\n```\n\n这严格来说是给人看的。在\
  \ 0.7 及以上版本中，唯一的要求是第一行（即不是注释也不是标签）必须以 `Feature` 开头。早版本的 Cucumber 对头信息没有限制。在头信息之后，有一个可选的\
  \ `Background`（背景）部分。\n\n`huddle3/features/manage_users_projects.feature`\n```gherkin\n\
  Background:\n  Given a project named \"Conquer The World\"\n  And the following\
  \ users:\n    login email password_confirmation\n    alpha@example.com\n    beta@example.com\n\
  ```\n\n`Background` 行与 `In order to` 行对齐缩进，意味着距离左侧有两个空格。背景内部的语句进一步缩进两个空格——Cucumber\
  \ 使用缩进来推断结构，类似于 Python 或 YAML。`Background` 语句类似于启动块，并在每个 scenario 运行之前进行评估。稍后我们将详细介绍背景的细节。\n\
  \nCucumber feature 的单个单元被称为 scenario（场景）。我定义了两个。第一个是进入项目的编辑页面：\n\n`huddle3/features/manage_users_projects.feature`\n\
  ```gherkin\nScenario: See user display on edit page\n  Given that user \"alpha\"\
  \ is a member of the project\n  When I visit the edit page for the project\n  Then\
  \ I should see 2 checkboxes\n  And the \"alpha\" checkbox should be checked\n  And\
  \ the \"beta\" checkbox should not be checked\n```\n\n第二个是当编辑表单实际提交时的情况：\n\n`huddle3/features/manage_users_projects.feature`\n\
  ```gherkin\nScenario: See users in project edit\n  Given I am on the edit page for\
  \ \"Conquer The World\"\n  When I check \"alpha\"\n  And I press \"Update\"\n  Then\
  \ I am taken to the show page for \"Conquer The World\"\n  And I should see \"alpha@example.com\"\
  \n  And I should not see \"beta@example.com\"\n```\n\n一个 Cucumber scenario 具有由三部分组成的基础结构：`Given`\
  \ 表示操作的前置条件；`When` 表示改变应用程序状态的用户操作；`Then` 验证状态更改的结果。以 `And` 开头的行属于其最直接的前一个语句。但在大多数情况下，`Given`、`When`\
  \ 和 `Then` 之间的区别是给人看的；Cucumber 并不要求步骤按特定顺序排列，也不使用 Given/When/Then 头信息来确定匹配哪一个步骤定义。\n\
  \n显然，`Background` 子句中的项都被预期为 `Given`。至于每个子句其余的部分，基本上是自由格式的；是步骤定义赋予了它们结构。噢——在 `Background`\
  \ 子句中看起来像表格的东西——猜怎么着？它确实是一个表格，这是为 Cucumber feature 定义一组数据的首选方法，而不是使用 fixtures（固定数据）或\
  \ factories（工厂）。\n\n事实上，现在可以使用 `rake cucumber` 命令执行这个 feature。但目前，我们必须注释掉 `app/controllers/application_controller.rb`\
  \ 中的 `before_filter :require_user` 行。（我们将在 *Login and Session Issues with Cucumber*\
  \ 章节中查看如何从 Cucumber 处理登录）。运行这些 feature 目前不会产生太大作用。以下是足以了解概述的输出：\n\n```bash\n$ rake\
  \ cucumber\nUUUUU---UU---\n2 scenarios (2 undefined)\n15 steps (7 skipped, 8 undefined)\n\
  0m0.02s\n```\n\n最后，你会得到一个总结。“15 steps”是每个测试中步骤的计数：两个 scenario 定义了十一个步骤，然后两个背景步骤运行了两次，总共十五个步骤。之后，你将得到一些关于未定义步骤的模板描述，适合直接粘贴到你的步骤定义页面中：\n\
  \n```ruby\nGiven /^a project named \"([^\"]*)\"$/ do |arg1|\n  # pending: 用你希望拥有的代码来表达上面的正则表达式\n\
  end\n\nGiven /^the following users$/ do |table|\n  # table 是一个 Cucumber::Ast::Table\
  \ \n  # pending: 用你希望拥有的代码来表达上面的正则表达式\nend\n\n# 其他许多未定义的步骤\n```\n\n### 运行 Cucumber\n\
  \n`cucumber-rails` gem 提供了三个独立的 Rake 任务来运行 Cucumber；`rake cucumber`（别名为 `rake cucumber:ok`）是默认任务。这将运行所有未标记为\
  \ `@wip`（即“进行中”）的 feature。请参考 *Annotating Cucumber Features with Tags* 章节。\n\n或者，你可以使用\
  \ `rake cucumber:wip` 命令仅运行进行中的 feature，该命令会运行所有标记了 `@wip` 的 scenario。`cucumber:wip`\
  \ 任务也与同样 `wip` 的 Cucumber 命令行选项行为相同，即它期望所有测试都会失败——否则它们就不算“进行中”。如果标记为 `wip` 的 scenario\
  \ 超过三个，`cucumber:wip` 任务也会失败，尽管你可以通过编辑 `config/cucumber.yml` 文件中的默认选项来更改此参数。\n\n\
  \n\n\n\n你可以使用 `rake cucumber:all` 任务来运行进行中和未进行的任务，它将运行所有场景。或者，你可以运行 `rake cucumber:rerun`，它在第一次调用时会运行整个测试套件并记录哪些场景失败了。如果有已知的失败场景，后续的\
  \ `rake cucumber:rerun` 运行将自动限制在这些失败场景上，直到它们通过为止。\n\n你也可以直接使用 `cucumber` 命令行脚本来获取更多选项，包括指定运行带标签（tagged）的场景的能力。关于这点的更多信息，请参考\
  \ *使用标签标记 Cucumber 特性* 章节。Rake 任务的进一步行为可以通过更改存储在 `config/cucumber.yml` 文件中的参数进行调整。\n\
  \n## 编写 Cucumber 步骤定义\n\n对于每个未定义的步骤，都需要创建对应的步骤定义。Cucumber 在运行时，它会尽力为未定义的步骤创建有用的步骤定义外壳。我们可以将这些外壳直接粘贴到\
  \ `features/step_definitions/users_and_projects_steps.rb` 文件中，至少可以作为一个开始。\n\n如从示例所示，每个步骤定义都以一个正则表达式开头，该正则定义了哪些步骤匹配它。当找到匹配的步骤时，就会执行附加到该步骤定义的块（block）。正则表达式中的组（一如既往，用括号标记）将作为参数传递给块，这使得单个步骤定义可以匹配许多不同的步骤。由于我们希望此步骤实际上创建一个项目，我们需要告诉\
  \ Cucumber 如何完成该创建操作：\n\n| [huddle3/features/step_definitions/users_and_projects_steps.rb](http://media.pragprog.com/titles/nrtest/code/huddle3/features/step_definitions/users_and_projects_steps.rb)\
  \ |\n\n|   | `Given /^a project named`*`\"(.*)\"`*`$/` `do` `&#124;project_name&#124;`\
  \ |\n|   | `@project = Project.create!(:name => project_name)` |\n|   | `end` |\n\
  \n此步骤定义匹配步骤 `Given a project named \"Conquer The World\"`。正则表达式的组表示法使得 `Conquer\
  \ The World` 成为块的参数，并最终成为添加到数据库中的新项目的名称。将该项目分配给 `@project` 允许从其他步骤访问该项目，尽管你需要对实例变量保持小心。创建过多的实例变量会使得步骤更加相互依赖，结果导致在多个场景中重用步骤变得更具挑战性。\n\
  \n在使用 Cucumber 时，我喜欢的工作方式是一步一步。定义步骤，然后添加任何使该步骤通过所需的常规测试和代码。（至少，这是我这周使用 Cucumber\
  \ 的工作方式。它非常灵活，我的工作流也会发生变化。）换句话说，Cucumber 场景中的失败行会以相同的方式触发常规的 Rails 测试，就像失败的 Rails\
  \ 测试会触发应用程序代码一样。有时这意味着这意味着需要回到 Cucumber 并对周围的某些场景进行调整，特别是在设置可用数据时。\n\n这个步骤已经通过了。我们继续吧。下一个步骤是\
  \ `And the following users`。步骤定义如下：\n\n| [huddle3/features/step_definitions/users_and_projects_steps.rb](http://media.pragprog.com/titles/nrtest/code/huddle3/features/step_definitions/users_and_projects_steps.rb)\
  \ |\n\n|   | `Given /^the following users$/` `do` `&#124;user_data&#124;` |\n|  \
  \ | `User.create!(user_data.hashes)` |\n|   | `end` |\n\n从最显而易见的一开始，尽管该步骤在场景中是通过\
  \ `And` 引入的（因为它实际上是 `Given` 子句的一部分），我们仍然用 `Given` 步骤定义来描述它。\n\n该定义的体显示了如何使用表格数据。数据以自定义\
  \ Cucumber 对象的形式传入；在对象上调用 `hashes` 会将该对象转换为哈希数组（array of hashes），其键对应于表格的第一行，值分别对应于剩余的每一行。对于\
  \ feature 文件中编写的表格，这意味着创建了两个登录名为 `alpha` 和 `beta` 的用户。这个步骤也已经通过了。\n\n进入实际场景，我们再来一个\
  \ given：`Given that user \"alpha\" is a member of the project`。这是另一个相对容易的步骤，不需要太多额外工作就能通过：\n\
  \n| [huddle3/features/step_definitions/users_and_projects_steps.rb](http://media.pragprog.com/titles/nrtest/code/huddle3/features/step_definitions/users_and_projects_steps.rb)\
  \ |\n\n|   | `Given /^that user`*`\"(.*)\"`* `is a member of the project$/` `do`\
  \ `&#124;login&#124;` |\n|   | `User.find_by_login(login).projects << @project`\
  \ |\n|   | `end` |\n\n为了让这生效，我们需要在 `Project` 和 `User` 中都添加 `has_and_belongs_to_many`\
  \ 行。在 `app/models/project.rb` 中，执行操作：\n\n|   | `class Project < ActiveRecord::Base`\
  \ |\n|   | |\n|   | `has_many :status_reports` |\n|   | `has_and_belongs_to_many\
  \ :users` |\n\n在 `app/models/user.rb` 中，执行操作：\n\n|   | `class User < ActiveRecord::Base`\
  \ |\n|   | `has_and_belongs_to_many :projects` |\n\n好的，在进入困难内容之前，我们还有一个可以通过的：\n\n\
  | [huddle3/features/step_definitions/users_and_projects_steps.rb](http://media.pragprog.com/titles/nrtest/code/huddle3/features/step_definitions/users_and_projects_steps.rb)\
  \ |\n\n|   | `When /^I visit the edit page` `for` `the project$/` `do` |\n|   |\
  \ `visit(`*\"/projects/#{@project.id}/edit\"`*`)` |\n|   | `end` |\n\n在这种情况下，我正在使用\
  \ Capybara 提供的 `visit` 方法来模拟浏览器调用。你可以在章节 *使用 Webrat 编写集成测试 中读到更多关于 Capybara 的信息。目前我们只需要知道\
  \ Cucumber 允许我们调用 Capybara 函数来模拟操作。这个步骤目前通过通过。\n\n如果你对 Cucumber 的通用性有任何怀疑态度，现在你可能会想：“这一切有什么意义？”到目前为止，我们写了一些形式化的自然语言和一些\
  \ Ruby 代码，仅用于确认我们已经知道的程序情况，代价是大约一页代码。\n\n诚然，目前如此——尽管在某种程度上，这是我们将 Cucumber 添加到现有应用程序的副作用。在很大程度上，为现有遗留应用程序添加测试与为没有\
  \ Cucumber 的程序添加测试的成本相似。本质上，我们正在偿还 Huddle 因为没有验收测试而积累的技术债。然而，为现有程序添加 Cucumber 测试比添加单元测试要容易。\n\
  \n至于最终的好处，请稍等。等完成成功的场景后我会论证。\n\n## 让步骤定义通过\n\n我们将一起编写接三个步骤定义，然后让它们全部通过。要写的第一个步骤定义是\
  \ `Then I should see 2 checkboxes`。该步骤定义使用 Capybara 的 `page.has_css?` 方法在 HTML 中查找复选框，对于我们而言，它实际上等同于\
  \ `assert_select`：\n\n| [huddle3/features/step_definitions/users_and_projects_steps.rb](http://media.pragprog.com/titles/nrtest/code/huddle3/features/step_definitions/users_and_projects_steps.rb)\
  \ |\n\n|   | `Then /^I should see (.*) checkboxes$/` `do` `&#124;checkbox_count&#124;`\
  \ |\n|   | `page.has_css(`*\"input[type = checkbox][id *= user]\"`*`,` |\n|   |\
  \ `:count => checkbox_count.to_i)` |\n|   | `end` |\n\n\n\n\n下一个要编写的步骤定义是 `Then\
  \ the \"alpha\" checkbox should be checked` 步骤。事实上，这个步骤已经由 Cucumber 定义在 `web_steps.rb`\
  \ 文件中：\n\n`huddle3/features/step_definitions/web_steps.rb`\n\n```ruby\nThen /^the\
  \ \"([^\"`*]*)\" checkbox should be checked$/ do |label, selector|\n  with_scope(selector)\
  \ do\n    field_checked = find_field(label)['checked']\n    if field_checked.respond_to?\
  \ :should\n      field_checked.should be_true\n    else\n      assert field_checked\n\
  \    end\n  end\nend\n```\n\n紧之后是 `Then the \"beta\" checkbox should not be checked`\
  \ 步骤。那一个也由 Cucumber 定义了。\n\n`huddle3/features/step_definitions/web_steps.rb`\n\n\
  ```ruby\nThen /^the \"([^\"`*]*)\" checkbox should not be checked$/ do |label, selector|\n\
  \  with_scope(selector) do\n    field_checked = find_field(label)['checked']\n \
  \   if field_checked.respond_to? :should\n      field_checked.should be_false\n\
  \    else\n      assert !field_checked\n    end\n  end\nend\n```\n\n## Cucumber\
  \ 替代了测试吗？\n\nRails 测试人员之间一直在进行一项争论：Cucumber 究竟是应该作为你已经编写的 TDD/BDD 测试的补充使用，还是应该被用来替代其中某些测试（特别是控制器测试和视图测试）。一方认为，Cucumber\
  \ 测试已经涵盖了控制器测试所添加的代码。另一方则认为，虽然每个测试都触及了相同的代码，但测试的目的不同，且两者都有用。本质上，问题在于：编写单元测试或功能测试在仅仅验证正确性之外是否具有价值，因为\
  \ Cucumber 测试已经验证了这一点。Cucumber 在端到端测试和保持开发关注点方面的价值，并不能替代常规 TDD 过程在探索、设计或代码质量方面的益处。\n\
  \nCucumber 的目标是从用户角度进行端到端测试。因此，Cucumber 并不是测试那些对用户间接显示的程序内部逻辑的地方。模型的内部逻辑应该在单元测试中进行测试。最佳实践建议控制器不应该有自己的逻辑，这意味着你可能不需要很多控制器测试——这并不是因为\
  \ Cucumber 测试替代了它们，而是因为没有多少控制器逻辑需要测试。\n\n尽管如此，我经常发现相比 `Test::Unit` 或 `RSpec` 提供的视图测试设施，Cucumber\
  \ 是指定视图测试更容易的方法。因此，我发现自己基本上把通常编写的视图测试移到了 Cucumber 中。\n\n关于 Cucumber 是否替代了常规测试的答案是：有时会。Cucumber\
  \ 并没有消除常规测试中对 TDD 益处的需求。然而，Cucumber 可以作为一种为面向用户的代码编写 TDD 测试的简单方法。Cucumber 的重点显然不是纠结于是否需要额外的测试。Cucumber\
  \ 的目标是编写更好的代码并将你的精力放在开发上。尝试用不同的方式使用 Cucumber，看看哪种最适合你。\n\n这两个步骤的定义非常相似，都使用 Capybara\
  \ 在 DOM 中查找所需的复选框，然后使用 RSpec 匹配器或 `Test::Unit` 断言来验证复选框是否勾选或未勾选。\n\n随着我们场景的步骤定义完成且其中两个没有通过，我们终于有了代码的方向。我们需要在项目的编辑视图中添加复选框。\n\
  \n在编辑屏幕上添加复选框可能不需要我更改控制器代码。考虑到这可是 Cucumber 章节，我感觉胆子大了一点，让我们直接进入视图。\n\n我已经在 `app/views/project/edit.html.erb`\
  \ 文件中的 `name` 字段下方插入了这些内容。我并不认为这段视图代码能扩展到十个用户以上。\n\n`huddle3/app/views/projects/edit.html.erb`\n\
  \n```html\n<h2>Users In Project</h2>\n<table>\n  <% User.all.each do |user| %>\n\
  \    <tr>\n      <td>\n        <%= check_box_tag(\"users_project[]\", user.id, user.projects.exists?(@project.id),\
  \ : => dom_id(user, :checkbox) %>\n      </td>\n      <td>\n        <label for=\"\
  <%= dom_id(user, :checkbox) %>\"><%= user.login %></label>\n      </td>\n    </tr>\n\
  \  <% end %>\n</table>\n```\n\n所以，对于数据库中的每个用户，我们都添加了一个包含复选框和用户名的表格行。`label` 标签在这里很重要，因为这正是\
  \ Cucumber/Capybara 步骤正在寻找的内容。到此，场景通过了。太棒！现在开始处理下一个。\n\n## 编辑场景：指定路径\n\n由于我们已经很久没看到第二个场景了，我重新运行一下：`huddle3/features/manage_users_projects.feature`\n\
  \n```gherkin\nScenario: See users in project\n  Given I am on the edit page for\
  \ \"Conquer The World\"\n  When I check \"alpha\"\n  And I press \"Update\"\n  Then\
  \ I am taken to the show page for \"Conquer The World\"\n  And I should see \"alpha@example.com\"\
  \n  And I should not see \"beta@example.com\"\n```\n\n这个场景目前在 `Given I am on the\
  \ edit page for \"Conquer The World\"` 处失败了。嗯。`Given I am` 是一个预存在的 web 步骤，但其余部分假设了可以转换为\
  \ URL 的内容。尝试这样：\n\n```ruby\nGiven /I am on the edit page for \"(.*)\"/ do |project_name|\n\
  \  @project = Project.find_by_name(project_name)\n  visit(\"/projects/#{@project.id}/edit\"\
  )\nend\n```\n\n看起来很合理，尽管与我几段落前写的 `When` 语句非常相似。但问题是，Cucumber 不喜欢它：\n\n`Ambiguous\
  \ match of \"I am on the edit page for \"Conquer The World\"\":`\n`features/step_definitions/web_steps.rb:18:in\
  \ /^I am on (.+)$/`\n`features/step_definitions/users_and_projects_steps.rb:15:in\
  \ /I am on the edit page for \"(.*)\"/`\n\n这回答了当一个步骤匹配两个定义时 Cucumber 会做什么。还有另一种指定路径的方法。默认\
  \ Cucumber 步骤 `/I am on (.*)/` 的定义引用了一个名为 `path_to` 的方法，该方法将正则表达式组作为参数传递。该方法在 `features/support/paths.rb`\
  \ 文件定义如下：\n\n```ruby\ndef path_to(page_name)\n  case page_name\n  when /the home\\\
  s?page/\n    '/'\n    # 在这里添加更多映射。\n    # 这是一个从 Regexp 中提取值的示例：\n    # #\n    #\
  \ when /^(.*)'s profile page$/i\n    # user_profile_path(User.find_by_login($1))\n\
  \  else\n    begin\n      page_name =~ /the (.*) page/\n      path_components =\
  \ $1.split(/\\s+/)\n      self.send(path_components.push('path').join('_').to_sym)\n\
  \    rescue Object => e\n      raise \"Can't find mapping from \\\"#{page_name}\\\
  \" to a path.\\n\" + \"Now, go and add a mapping in #{__FILE__}\"\n    end\n  end\n\
  end\n```\n\n\n\n\n看到那个部分友好地提示“添加映射（add a mapping）”了吗？我们在这里要做的是添加更多的 `where` 子句，返回某种类似\
  \ Rails URL 的对象。所以，删除掉我们刚刚写的 `Given` 子句，并在 `features/support/paths.rb` 中的 `path_to`\
  \ 方法中添加以下 `When` 子句：\n\n| [huddle3/features/support/paths.rb](http://media.pragprog.com/titles/nrtest/code/huddle3/features/support/paths.rb)\
  \ |\n|   | |\n|   | **`when`** `/edit page` **`for`***`\"(.*)\"`*`/` |\n|   | `@project\
  \ = Project.find_by_name($1)` |\n|   | `edit_project_path(@project)` |\n\n我想逐步讲解这个过程：\n\
  \n1. Cucumber 看到步骤 `Given I am on the edit page for \"Conquer The World\"`。\n2.\
  \ 该步骤被匹配到现有的 web 步骤 `Given /^I am on (.+)$/`。\n3. web 步骤将分组后的文本 `the edit page for\
  \ \"Conquer The World\"` 作为参数，并将其传递给 `path_to` 方法。\n4. `path_to` 方法匹配了我们刚刚添加的正则表达式\
  \ `/edit page for \"(.*)\"/`。\n5. 该正则表达式中的分组文本被用于将该表达式转换为关联项目的 RESTful 编辑路径。`$1`\
  \ 是一个 Ruby 全局变量，代表最近一次匹配的正则表达式的第一个匹配组。虽然这是一种 Perl 风格，我通常不在 Ruby 代码中使用它，但它是获取 `when`\
  \ 子句中正则表达式匹配数据最简单的方法。\n\n这种机制有两种看待方式。优点是，它是一种非常灵活的方法，允许以有意义的自然语言方式指定路径。另一方面，它具有某种“层层迷雾（fog-on-fog）”的，并且存在大量的间接层。\n\
  \n### 路由支持（Route Support）\n\n`path_to` 方法的一个问题是，它要求你在 Cucumber 使用它们之前单独输入路径。这感觉像是重复。为了防止不必要的重复，Cucumber\
  \ 最近在 `else` 子句中添加了最初由 Solomon White 发布的片段。它能从文本中推出 RESTful 路由。这段代码替换了 `path_to`\
  \ 方法的 `else` 子句：\n\n使用此片段，类似“the story page”的内容会转换为 `story_path`，而“the edit user\
  \ page”将发送路由 `edit_user_path`。\n\n到此时，该步骤应该通过，接下来的两个步骤 `When I check \"alpha\"`\
  \ 和 `And I press \"Update\"` 也应该通过，因为它们是 web 步骤，仅依赖于我们为第一个场景创建的表单元素。它们的作用是模拟用户勾选复选框并提交带有一个选用户的编辑表单的操作。\n\
  \n第四个步骤 `Then I am taken to the show page for \"Conquer The World\"` 需要定义。该步骤的意图是验证表单提交将用户引导到预期的页面。步骤定义如下：\n\
  \n| [huddle3/features/step_definitions/users_and_projects_steps.rb](http://media.pragprog.com/titles/nrtest/code/huddle3/features/step_definitions/users_and_projects_steps.rb)\
  \ |\n|   | `Then /^I am taken to (.*)$/` **`do`** `&#124;path&#124;` |\n|   | `assert(current_url.ends_with?(path_to(path)))`\
  \ |\n|   | **`end`** |\n\n此定义依赖于 `path_to` 方法中的另一个子句，与上一个非常相似：\n\n| [huddle3/features/support/paths.rb](http://media.pragprog.com/titles/nrtest/code/huddle3/features/support/paths.rb)\
  \ |\n|   | **`when`** `/show page` **`for`***`\"(.*)\"`*`/` |\n|   | `@project =\
  \ Project.find_by_name($1)` |\n|   | `project_path(@project)` |\n\n步骤定义正在对比当前页面的\
  \ URL（即 `http://www.example.com/projects/1`）与 `path_1` 输出的 URL 路径（即 `projects/1`）。\n\
  \n现在我们到了场景的核心。最后两个步骤 `And I should see \"alpha@example.com\"` 和 `And I should not\
  \ see \"beta@example.com\"` 是 web 步骤，在主体输出中搜索特定文本。在这种情况下，我们假设最终的项目显示页面将包含该项目用户的邮箱——而不包含不在项目中的用户的邮箱。\n\
  \n在这里你必须小心：Cucumber 测试并没有显式地测试用户是否真的已被添加到数据库中。你可以编写这样的测试，但更好的做法是在控制器和模型测试层面进行此类管理，并让\
  \ Cucumber 保持在用户交互层面。这没问题，但事实是我们也可以仅仅通过在输出中包含该字符串来让 Cucumber 测试通过。或者更阴险的是，通过将表单提交数据传递给视图而不进行保存。\n\
  \n我的观点并不是说 Cucumber 很坏——它并不坏。更多是想说，Cucumber 只是你营养测试早餐的一部分。在这种情况下，我们将更改控制器，所以我们应该回归控制器测试。将此控制器测试放入\
  \ `test/functional/projects_controller_test.rb`：\n\n| [huddle3/test/functional/projects_controller_test.rb](http://media.pragprog.com/titles/nrtest/code/huddle3/test/functional/projects_controller_test.rb)\
  \ |\n|   | `test` *`\"should update with users\"`***`do` |\n|   | `set_current_project(:huddle)`\
  \ |\n|   | `put :update, :id => projects(:huddle).id,` |\n|   | `:users_in_project\
  \ => [users(:quentin).id]` |\n|   | `huddle = Project.find_by_name(`*`\"Huddle\"\
  `*`)` |\n|   | `assert_equal [users(:quentin).id]` |\n\n```\ntest \"should update\
  \ with users\" do\n  set_current_project(:huddle)\n  put :update, :id => projects(:huddle).id,\n\
  \  :users_in_project => [users(:quentin).id]\n  huddle = Project.find_by_name(\"\
  Huddle\")\n  assert_equal [users(:quentin).id]\n```\n\n\n\n\n\nCucumber 无法访问控制器（controller）或会话（session），因此我们需要通过模拟用户操作来登录。如果我们使用\
  \ `Devise`，类似这样的代码是有效的：\n\n| | `Given /^the user successfully logs into Huddle$/`\
  \ `do` |\n| | `@user = User.create!(:email => \"email@email.com\",`,` |\n| | `:password\
  \ => \"password\",`,` |\n| | `:password_confirmation => \"password\")` |\n| | `visit\
  \ \"login\"` |\n| | `fill_in(\"user_email\", :with => @user.email)` |\n| | `fill_in(\"\
  user_password\", :with => \"password\")` |\n| | `click_button(\"Sign In\")` |\n\
  | | `end` |\n\n这个步骤定义创建了一个用户实例变量，然后跳转到 Devise 登录界面，并使用 Webrat 或 Capybara 模拟填写并提交登录表单。如果我们需要特定的用户名，修改步骤定义以接收该参数也是容易的。优点是，这很大程度上是模板代码，可以在少修改或不修改的情况下应用到大多数项目中。\n\
  \n任何基于会话的内容都会有类似的问题，并且通过模拟用户操作来生成。同样，这表明 Cucumber 并不会解决你所有的测试问题——只是解决其中的一部分。\n\n\
  ## 使用标签（Tags）标注 Cucumber Feature\n\nCucumber 测试套件（特别是在大型网站上）往往很慢。即使最近解析 feature\
  \ 文件的速度有所提高，相对于单元测试，端到端测试仍然很慢。为了加速开发/测试/代码循环，能够运行限制的 Cucumber 特子集非常方便，这样你就可以专注于实际正在开发的场景。\n\
  \n在 Cucumber 中，你可以通过标签将场景（scenarios）或特性（features）分组。要定义一个标签，请将标签放在场景声明之前的行中，并以 `@`\
  \ 符号为缀：\n\n| `@userpage` |\n| `Scenario: See user display on edit page` |\n| `Given\
  \ that user \"alpha\" is a member of the project` |\n| `When I visit the edit page\
  \ for the project` |\n| `Then I should see 2 checkboxes` |\n\n如果你想让多个标签作用于同一个场景，请将所有标签放在同一行，并用空格隔开。然后你可以通过从\
  \ Cucumber 命令行指定这些标签来使用它们。例如，要仅运行带有 `userpage` 标签的场景，使用此命令：\n\n`cucumber --tags\
  \ @userpage`\n\n你可以通过在标签前加波浪号来运行所有不包含特定标签的场景：\n\n`cucumber --tags ~@userpage`\n\n\
  如果你想让情况更复杂，可以从逻辑上组合标签。如果你包含多个 `--tags` 选项，它们将作为逻辑 `and`（与）。要运行同时带有 `@userpage` 和\
  \ `@complete` 标签的场景，使用此命令：\n\n`cucumber --tags @userpage --tags @complete`\n\n对于逻辑\
  \ `or`（或）行为，在同一个选项中包含多个标签，并用逗号隔开。要运行 `@userpage` 或 `@reporting` 场景，你可以这样做：\n\n`cucumber\
  \ --tags @userpage,@reporting`\n\n此外，你还可以指定使用给定标签运行的场景数量。如果带标签测试的数量超过限制，运行 Cucumber\
  \ 将失败：\n\n`cucumber --tags @userpage:3`\n\n这种行为被默认的 `cucumber:wip` 任务使用，但我不确定它在通用情况下有多用。\n\
  \nCucumber 给 `@wip` 标签赋予了特殊地位，它的意思是“进行中”（work in progress）。`@wip` 标签是特殊的，因为 Cucumber\
  \ 提供了默认的 Rake 任务 `rake cucumber:wip`，它只运行带有 `@wip` 标签的场景。\n\n如果你使用 Capybara，那么 Capybara/Cucumber\
  \ 组合使用特殊标签 `@javascript` 来表示应该使用 Capybara 的 JavaScript 驱动运行的场景，通常是 Selenium 或 Culerity。使用\
  \ JavaScript 驱动而不是默认的无头栈（headless stack）。这种行为不取决于命令行选项；JavaScript 驱动将应用于所有标记标记的场景。自然地，你会预期这些场景的运行速度更慢。\n\
  \n## 隐式与显式 Cucumber 测试\n\n在编写了一段时间 Cucumber 测试后，风格和结构上的问题开始显现。最早的问题之一是将场景的特定细节放在\
  \ Cucumber feature 中，还是放在步骤定义（step definition）中。\n\n例如，需要区分新创建的用户和经验丰富的用户的场景可以用任何一种方式编写（以及其他方式，但这些已经足够说明问题）：\n\
  \n| `Given a user named \"Noel Rappin\" who joined the site 2 years ago` |\n| `Given\
  \ a pre-existing user named \"Noel Rappin\"` |\n| `Given a pre-existing user` |\n\
  \n最顶部的版本是最显式的；步骤定义将获取 Cucumber 步骤中的数据。最底部的版本是完全隐式的；步骤定义需要创建用户。中间的显然介于两者之间。\n\n每种方式都有优点。隐式视图让\
  \ Cucumber 场景更简单，通常更便于非技术客户使用。然而，步骤定义更加复杂，并且需要管理数据。例如，一个看到一行代码的客户会好奇“几年前”有什么特别之处。\n\
  \n这里没有特定的正确答案；这是你在编写 Cucumber 测试时需要记住的一点。\n\n### 迈向 Cucumber 风格\n\n使用 Cucumber 体验好坏的关键取决于你编写步骤定义的水平有多高。以下是我发现的一些准指南：\n\
  \n- 让场景拥有符合你语境的自然语言，并在步骤定义中平滑处理。\n- 尽量不要在 feature 描述中包含代码。这包括 CSS 选择器。\n- 在可能的情况下，保持步骤定义的简单；它们绝对需要\
  \ 100% 准确。\n- 我发现，拥有多个简单的步骤比有一个执行复杂技巧性动作的步骤要好。\n- 将 `When` 和 `Then` 步骤保持在用户层面，而不是数据库层面。\n\
  - 与其他测试一样，验证不存在的内容与验证存在的内容同样重要。\n- Cucumber 不是纠结实现细节的地方；把那些留给常规测试。\n- 避免同义反复测试（tautological\
  \ tests）——步骤定义的间接很容易掩盖一个总是通过的步骤。\n\n## Cucumber 适合你吗？\n\n长期以来，Cucumber 及其前身 StoryRunner\
  \ 一直在我的待办项目列表中，但它看起来并不特别实用。让我转变为并开始使用它的原因之一，是我意识到我对 Cucumber 的许多反对（编写额外的代码、测试可能并不总是准确等）与我经常听到的关于通用测试驱动开发（TDD）的反对相似。这让我停下来思考，并决定集中精力去研究\
  \ Cucumber。\n\n事实证明，在使用 Cucumber 时与常规 TDD 的类比依然成立。启动成本通常比我预想的低，但指定端到端行为的收益非常高。令人惊讶的是，我发现使用\
  \ Cucumber 时我的编码期间变得更加专注，并且更清楚地知道什么需要完成，下一步要做什么。\n\n\n\n\n我最终得到的是双重循环：一个失败的 Cucumber\
  \ 测试会触发一个单元测试，而一个失败的单元测试会触发代码编写。这并不是一个完美的类比——单元测试具有设计价值，并且可以覆盖 难以触及的程序区域——但它是理解\
  \ `Cucumber` 地位的一种良好方式。\n\n如果你正在与客户或非编程客户打交道，既是自然语言又是可执行的验收测试，其价值是是非凡的。我目前唯一的警告是，尽管\
  \ `Cucumber` 测试没有太多结构，但仍然存在一些结构。即使在没有 `Cucumber` 的情况下，我们也倾向于对用户故事使用 `Given/When/Then`\
  \ 结构，但我第一次尝试在 `Cucumber` 中执行某些故事时，仍然需要一些转换工作。例如，故事定义往往在同一个场景（scenario）中做了太多事情。准备好随着时间的推移，为了清晰起见以及新功能的显现，反复修改并重写你的\
  \ `Cucumber` 步骤。此外，尽量保持步骤命名空间的整洁；在大型项目中，查找步骤可能会成为一个问题。\n\n使用 `Cucumber` 的平衡点在哪里？`Cucumber`\
  \ 的优势在于它能够轻松地规范和文档化应用程序的端到端行为。它是一份极好的蓝图，既从描述需要做什么的角度来说，也从允许你规划开发方向的角度来说。它是典型 `TDD/BDD`\
  \ 过程的完美补充，承担了较小的单元测试无法真正胜任的全局角色。你在使用 `Cucumber` 时遇到麻烦的地方是试图将其移动到它并不真正擅长的领域，例如尝试管理模型或实现细节。将\
  \ `Cucumber` 留在合适的位置。如果你确保自己不会永远在纠结步骤的细节，并像使用测试驱动代码那样用它来驱动你的常规测试，`Cucumber` 将改进你的代码。\n\
  \n### 脚脚注\n\n| [76 | 如果你关注 `Cucumber` 的开发，在这里可能会感到有些不适应，因为 `Cucumber` 曾有一过默认的“cucumber”\
  \ `Rails` 环境，但在 `0.9.x` 版本中被作为默认移除了。 |\n| [77 | 从技术上说，`Cucumber` 是整个系统。特性语言被称为 `Gherkin`（这是一个反复读起来非常奇有趣的词）。\
  \ |\n\nCopyright © 2011, The Pragmatic Bookshelf.\n\n# 第 6 部分：测试你的测试\n\n# 第 16 章：使用\
  \ Rcov 测量测试覆盖率\n\n测试覆盖率是评估测试质量最常用的数值型指标。覆盖率衡量了运行测试套件过程中实际执行的应用程序代码量。归结底，这通常以百分比的形式表示，例如，“我的项目有\
  \ 85% 的测试覆盖率”，或者换句话说，“当测试运行时，我的 85% 应用程序代码被触到了。”\n\n在适当的情况下，你可以就测试覆盖率的意义进行一场有趣的争论，但大多数人认同以下几点：\n\
  \n*   代码覆盖率的缺失意味着一个潜在问题——你的代码部分完全没有被测试。这个问题有多大取决于上下文。\n*   代码覆盖率的存在本身意义不大。覆盖率指标并不能说明正在执行的应用程序代码是否真的经过了验证，更不用说是否经过了完全的验证。\n\
  *   尽管如此，结合良好的测试实践，覆盖率的运行可以就你的测试套件及其范围提供一些有用信息。换句话说，如果你在使用良好的 `TDD` 实践，你可能确实获得了良好的测试覆盖率，但覆盖率本身并不能说明你在使用良好的\
  \ `TDD` 实践。\n\n## 85% 是什么的百分比？\n\n你看到我刚才在本章的第一段试图向你留了一个问题吗？当我提到一个项目有“85%”的测试覆盖率时。这引出了自然的后续问题：“具体是什么的\
  \ 85%？”问得好。虽然代码覆盖率的想法在直觉上似乎很清晰，但一旦计算机科学家们开始处理，就没有什么是简单的了。\n\n维基百科目前列出了至少七种不同的覆盖率衡量方法，范围从理论上有用到完全的荒谱不等。但实际上，只有两种衡量方法既足够容易计算，又具有足够的价值。行覆盖率（Line\
  \ coverage）衡量的是你的测试套件执行的应用程序中实际文本代码行的百分比。另一种是分支覆盖率（branch coverage），它尝试测量代码的每个分支并等等计算每个分支。（剧透：`Rcov`\
  \ 测量的是行覆盖率。）例如，假设你有如下所示的方法：\n\n| | `def code_coverage_example_silly_method` |\n\
  | --- | `if something_good` |\n| | `tell_all_my_friends` |\n| | `else` |\n| | `ignore_it`\
  \ |\n| | `run_in_circles` |\n| | `scream_and_shout` |\n| | `jump_up_and_down` |\n\
  | | `run_in_circles_some_more` |\n| | `whine_all_day` |\n| | `end` |\n| | `end`\
  \ |\n\n如果你只针对 `something_good == true` 的情况编写了测试——我们不都希望那是唯一的情况吗——那么行覆盖率估计会说你覆盖了十二行中的四行，占比\
  \ 33%。具体来说，测试覆盖了 `def`、`if` 语句、`tell_all_my_friends` 以及方法末的 `end`。另一方面，分支覆盖率估计将确定该方法有两个分支（`if`\
  \ 子句和 `else` 子句），其中一个被覆盖了，占比 50%。\n\n从理论上讲，分支覆盖率提供了一个更“真实”的覆盖率图景。在前一种方法中，`else`\
  \ 子句中的所有行本质上是一个单元；它们要么全被测试，要么全都不测试。每个分支的长度对该分支权重产生影响没有任何意义。另一方面，这两种衡量方法在真实代码之间的实际差异通常并不大，而且行覆盖率的计算要容易一亿倍。此外，无论如何，100%\
  \ 都是 100%。我认为，如果你深切关注分支覆盖和代码覆盖率之间的差异，那么你面临的问题比代码覆盖率大得多。\n\n尽管如此，`Rcov` 使用行覆盖率时仍有一些奇怪的痕迹。最令人烦恼的是单行\
  \ `if` 语句或语句后的 `if` 子句，如下：\n\n| | `return nil if x` |\n| | `if x then 3 else 2 end`\
  \ |\n\n`Rcov` 会乐此地标记整行已覆盖，无论 `if` 语句是否真的在真假两种状态下都经过测试。再次，这更多是一种困扰而非生死攸关，我绝对不建议为了适应\
  \ `Rcov` 而调整代码风格，但这是值得关注的。\n\n## 安装 Rcov\n\n就像生活中的许多事情一样，安装 `Rcov` 比应该的复杂至少了 10%。你正常地下载\
  \ gem，但然后需要安装一个允许 `Rcov` 快速运行的原生扩展。没有这个扩展，`Rcov` 的运行速度简直是地质级的：代码覆盖插桩是一个缓慢的过程。\n\n\
  在我写这些内容时，Rcov gem 的当前官方版本是 Relevance（一家领先的 Rails 咨询公司）对原始 gem 的分支。对于 [`www.rubygems.org`](http://www.rubygems.org)\
  \ 来说，Relevance 版本现在是 `Rcov` 的标准版本。要安装该 gem，请执行：\n\n```bash\n$ sudo gem install rcov\n\
  ```\n\n\n\n\n如果你无法下载二进制文件，一旦将 `Rcov` 作为 gem 安装完成，你必须编译原生二进制文件，这样 `Rcov` 的运行速度才能足够快并具有实际使用价值。对于非\
  \ Windows 用户来说，你需要在命令行终端中导航到 `Rcov` gem 目录（具体目录取决于你的系统；对于原生 Mac OS X 安装，路径为 `/Library/Ruby/Gems/1.8/gems/rcov-VERSION`）并运行以下命令：\n\
  \n```bash\nsudo ruby setup.rb\n```\n\nWindows 用户尚未获得官方支持（至少根据我看到的日期为 2010 年 2 月\
  \ 28 日的说明）；不过，你应该能够通过 [`www.rubyinstaller.org`](http://www.rubyinstaller.org) 的\
  \ Windows 开发工具包安装 `Rcov`。请注意 Ruby `1.9.x` 目前不支持，但正在开发中。\n\nWindows 用户仍然可以从 [`eigenclass.org/static/rcov/binary-win32/rcovrt.so`](http://eigenclass.org/static/rcov/binary-win32/rcovrt.so)\
  \ 下载二进制文件 `rcovert.so` 来从原始预览版本的 `Rcov` 创建二进制文件，并将文件放入 Ruby 扩展目录。如果你使用的是标准的一键安装程序，该目录可能是\
  \ `c:\\ruby\\lib\\ruby\\site_ruby\\1.8\\i386-mswin32\\`。\n\n此时，你可能想尝试运行简单的命令如 `rcov\
  \ --version` 以确保所有内容都安装正确。\n\n## Rcov 与 Rails\n\n安装粉丝们不要担心，我们还没有结束。还有一个独立的插件可以将\
  \ `Rcov` 与 `Rails` 集成。幸运的是，这个非常简单：\n\n```bash\n./script/plugin install http://svn.codahale.com/rails_rcov\n\
  ```\n\n在 `Test::Unit` 中，这会为你提供一系列 Rake 任务；我们将在 Rcov and RSpec and Cucumber 部分中讨论\
  \ RSpec。具体来说，你定义的每个 `rake:test` 任务都会获得一个 `rake test:rcov` 和一个 `rake test:clobber_rcov`，例如\
  \ `rake test:functionals:rcov` 和 `rake test:functionals:clobber_rcov`。全局测试任务是 `test:test:rcov`。`Rcov`\
  \ 任务使用 `Rcov` 运行关联测试，生成 `Rcov` 报告。该报告放置在你 `Rails` 应用顶层的 `coverage` 目录中。`clobber`\
  \ 任务会清除该目录中的报告数据。你也可以通过将文件作为 `TEST` 选项引入对特定的测试文件运行覆盖测试，如下：\n\n```bash\nrake rcov\
  \ TEST=file_to_test.rb\n```\n\n有些事情需要注意。首先，你真的不希望那些覆盖率文件出现在版本控制中，因此请务必使用适当的忽略机制将该覆盖目录排除在版本控制树之外。其次，`rails_rcov`\
  \ 插件取决于 `Rcov` 是否存在。这意味着你的测试环境和生产环境要么需要安装 `Rcov`，要么需要移除该插件，也许你可以作为 Capistrano 部署脚本的一部分来实现。\n\
  \n## 隐藏类陷阱（Invisible Class Gotcha）\n\n由于 `Rcov` 的输出仅包含被测试套件触过的文件，完全未被触过的文件不会显示 0%\
  \ 的覆盖率——它根本不会出现。结果是，你的覆盖率得分会虚高，你可能无法发现问题。由于 `Rails` 让你应用中的每个文件都至少被测试轻微触碰变得非常容易，因此遇到这个问题并不罕见。但它确实会发生——嗯，它在我身上发生过——所以我想应该提一下。\n\
  \n最后，也是最重要的一点，`Rcov` 完全忽略了不是“真实”Ruby 的视图文件，例如 `ERb` 和 `Haml`。虽然我假设在抽象上我很想看到视图的覆盖率，但我不得不承认在实践中，我的态度更倾向于“今天少一件需要担心的事”。理想情况下，你会将任何复杂的逻辑放在模型或辅助函数中，在那里它们可以被测试并衡量测试覆盖率。\n\
  \n## Rcov 输出\n\n当你从其中一个 `Rails` Rake 任务运行 `Rcov` 时，你会在控制台中获得输出，还会获得一份完整的 HTML 输出报告。（在下一节，我们将讨论如何调整该输出。）\n\
  \n控制台输出仅仅是触过的文件列表，将在正常的 `Test::Unit` 输出之后显示。以下是经过编辑的文本：\n\n```text\n+--------------------------------------------------+-------+-------+--------\n\
  | File | Lines | LOC | COV |\n+-------------------------------------------- -----+-------+-------+--------+\n\
  | app/controllers/application_controller.rb | 75 | 50 | 86.0% |\n| app/controllers/projects_controller.rb\
  \ | 87 | 71 | 80.3% |\n| app/controllers/status_controller.rb | 91 | 65 | 71.4%\
  \ |\n| app/controllers/sessions_controller.rb | 20 | 12 | 60.0% |\n| app/helpers/application_helper.rb\
  \ | 25 | 2 | 100.0% |\n+--------------------------------------------------+-------+-------+--------\n\
  | Total | 78429 | 41952 | 51.2%\n```\n\n在 `coverage` 目录内部，`Rcov` 为你的报告创建了目录。如果你打开\
  \ `index.html` 文件，你会看到类似图 Rcov 索引页 的内容——我过滤到了 `app` 目录以使其更有意义。\n\n在页面顶部，你会看到下拉菜单，它们根据顶层目录或覆盖率阈值对代码进行\
  \ JavaScript 过滤，仅显示低于指定值的文件。这两个过滤器都是 Relevance 版本中的新功能，非常受欢。这里的列与控制台输出相同，增加了 Total\
  \ 列，它是行覆盖的百分比，同时计算代码行和非代码行。\n\n点击任何文件名都会进入该文件的单独报告，如图 Rcov 文件页 所示。\n\n默认情况下，单独报告用不同深浅的绿色表示已覆盖的代码（`Rcov`\
  \ 推出的非执行行使用不同的绿色）以及不同深浅的红色表示未覆盖的行——这些行可能需要更多测试。在实践中，最后一列的代码百分比将是最有用的。\n\n## 命令行\
  \ Rcov\n\n你可以不通过 Rake 直接从命令行运行 `Rcov`。作为对比，默认 Rake `Rcov` 任务生成的系统命令如下：\n\n\n\n\n\
  \n```bash\n$ rcov -o \"/Users/noel/Projects/tasker/coverage/test\" -T \\\n-x \"\
  rubygems/*,rcov*\" --rails -I\"lib:test\" \\\n\"/Library/Ruby/Gems/1.8/gems/rake-0.8.7/lib/rake/rake_test_loader.rb\"\
  \ \\\ntest_file_1.rb test_file_2.rb\n```\n\n该命令位于单行，并在选项之后列出了一系列实际文件。虽然通常用法是让这些执行的文件成为测试用例，但它们可以是任何\
  \ Ruby 脚本。\n\n重要提示：可以通过将选项作为字符串包含在 `RCOVOPTS` 命令行变量中，将 `Rcov` 的任意选项传递给 `Rake` 任务，如下所示：\n\
  \n```bash\n$ rake rcov RCOVOPTS=\"--only-uncovered --sort coverage\"\n```\n\n这里是最常用的\
  \ `Rcov` 命令行选项简要指南。在下一节中，我将向你展示如何自定义 `Rake` 任务以使 `Rcov` 报告更有用。与大多数 Unix 命令行工具一样，这些许多选项都有单横杠快捷方式和双横杠全称。这并不是完整的列表。\n\
  \n### Rcov 选项\n\n- `--aggregate FILE`: 将当前数据与之前运行并存储在关联 `Rcov` 数据文件中的现有数据合并。\n-\
  \ `--annotate -a`: 生成带注释的源代码。\n- `--comments`: 将所有注释标记为已覆盖（默认是相反的，即 `--no-comments`）。\n\
  - `--exclude PATTERNS --x`: 不为匹配逗号分隔的正则表达式模式列表的文件生成覆盖率信息。\n- `--html`: 生成 HTML 输出。相反选项是\
  \ `--no-html`。\n- `--include DIR:DIR -I DIR:DIR`: 用冒号分隔的路径列表将被包含在加载路径（load path）中。\n\
  - `--include-file PATTERNS -i PATTERNS`: 仅为匹配给定的逗号分隔正则表达式模式的文件生成覆盖率信息。`--exclude`\
  \ 的反向。\n- `--no-color -n`: 生成对色盲安全的输出。\n- `--only-uncovered`: `threshold 100` 的同义词。\n\
  - `--output DIR -o DIR`: HTML 输出报告将保存的目录。\n- `--rails`: 等于 `-x config/,environment/,vendor/`。\n\
  - `--save FILE`: 将原始覆盖率信息保存到文件。配合 `--text-coverage-diff` 使用。\n- `--sort OPTION`:\
  \ 根据选项对输出文件排序。选项可以是 `name`、`loc` 或 `coverage`。\n- `--sort-reverse`: 反转排序后的文件列表。\n\
  - `--spec-only`: 仅计算从 `RSpec` 内部内部的代码。在正常的 `RSpec` 使用中，这是多余的。\n- `--text-coverage-diff\
  \ FILE -D FILE`: 将本次覆盖运行与使用 `--save` 保存的之前的运行进行比较。\n- `--test-unit-only`: 仅计算从 `Test::Unit`\
  \ 测试内部覆盖的代码。在正常的 `Rails` 使用中，这是多余的。\n- `--text-report -T`: 在标准输出中放置详细报告（默认）。\n-\
  \ `--text-summary -t`: 在标准输出中放置摘要。\n- `--threshold VALUE`: 仅对覆盖率低于该值的文件输出数据，例如 `--threshold\
  \ 95`。\n- `--xrefs`: 生成交叉引用报告，显示方法的调用来源。\n\n如果你需要将选项传递给由 `Rcov` 运行的程序，而不仅仅是 `Rcov`\
  \ 本身，可以通过将这些选项放在输出的双横杠之后来实现，如下所示：\n\n```bash\n$ rcov --only-uncovered script.rb\
  \ -- --opt-to-script\n```\n\n## Rcov、RSpec 和 Cucumber\n\n`RSpec` 和 `Cucumber` 使用类似的机制与\
  \ `Rcov` 集成。在这两种情况下，运行 `Cucumber` 特性集覆盖的推荐方法是在工具创建的 `Rake` 文件中创建一个新的 `Cucumber`\
  \ `Rake` 任务。对于 `RSpec`，是 `lib/tasks/rspec.rake`；对于 `Cucumber`，是 `lib/tasks/cucumber.rake`。在\
  \ `RSpec` 1.3.x 和 2.x 中，预定义了 `spec:rcov` 任务，但你可以为任何自定义的 `RSpec` `Rake` 任务添加 `Rcov`\
  \ 支持。关键是在创建的任务内部将任务变量 `rcov` 设置为 `true`。对于 `RSpec`，你会得到类似这样的代码：\n\n```ruby\nRSpec::Core::RakeTask.new(:rcov\
  \ => \"db:test:prepare\") do |t|\n  t.pattern = \"./spec/**/*_spec.rb\"\n  t.rcov\
  \ = true\nend\n```\n\n在 `Cucumber` 中，任务如下所示，它使用了默认 `Cucumber` `rake:ok` 任务的其他选项：\n\
  \n```ruby\nCucumber::Rake::Task.new({:coverage => 'db:test:prepare'}) do |t|\n \
  \ t.pattern = \"features/**/*.feature\"\n  t.rcov = true\nend\n```\n\n\n\n\n\n`Rcov::RcovTask.new`\
  \ 方法接受一个初始化块；在在该块中，我们可以为任务设置任何所需的选项。该类定义了一些属性以备帮助。仅在这个示例中，你可以看到 `libs`，它包含了要添加到加载路径的目录；`test_files`，它接收要运行的测试文件列表；`verbose`，指定输出的详细程度；`output_dir`，`Rcov`\
  \ 写入的目录；然后是 `rcov_opts`，它接受你需要的任何其他参数。\n\n注意，这两个任务的区别仅在于测试目录不同，并且单元测试任务排除了控制器目录。使用的\
  \ `Rcov` 选项包括 `--aggregate` 选项，它允许将单元测试的数据合并到控制器的运行中，以便在第二次运行时创建一个合并的覆盖率报告。\n\n\
  这就是我用来衡量项目覆盖率的方法。你可以根据自己的口味进行调整，并自己尝试一下。\n\n## 多少覆盖率才算足够？\n\n代码覆盖率有多价值？独一无二的杰·菲尔德（Jay\
  \ Fields）可能对测试的了解比我所知的还要多，她将代码覆盖率比作金钱——拥有很多钱并不一定意味着你很快乐，但毫无所有就非常糟糕。\n\n对于一个 Rails\
  \ 项目来说，实现 100% 的覆盖率并不难，但为了获得那个“魔法数字 100”而追求覆盖率，与作为实际测试驱动开发项目的结果（加上偶尔的边缘填充）而拥有覆盖率是两回事。这个魔法数字本身可能没用；然而，经历这个过程非常有价值。\n\
  \n如果你正确地执行了这个过程，你的覆盖率应该作为一种自然的副作用达到 100% 或非常接近这个数字。如果你发现自己在事后仅仅为了提高数字而编写了大量糟糕的测试，这提示你可能需要改进\
  \ TDD 流程。\n\nCopyright © 2011, The Pragmatic Bookshelf.\n\n# 第 17 章：超越覆盖率：什么是良好的测试？\n\
  \nRuby 和 Rails 社区的伟大之处之一，在于他们从很大程度上接受了“测试驱动设计（Test-Driven Design）是一个良好的开发流程”这一观点。这是一个巨大的成就，也是\
  \ Rails 社区与我参与过的其他编程小组之间的真实区别。在书中，我们花费了大量时间研究 Ruby on Rails 测试的机制、工具如何工作、如何让它们运行以及如何管理基本的\
  \ TDD 流程。换句话说，我们一直在讨论测试的技艺。现在，我想谈谈测试的艺术：什么是良好的测试、如何平衡测试优先级、如何排除故障，以及在下一章中，当你已经有一堆烂代码时该如何进行测试。\n\
  \n我希望 Ruby 社区对测试的讨论能进入下一步，即如何提高你编写的测试的质量。我看到社区中有两种关于测试的辩论模式，两者在有时很有趣，但都不是我目前想要讨论的内容。\n\
  \n*   TDD/BDD 命名之争。我测试了足够久，以仍然需要提醒自己不要称其为“测试优先编程（Test-First Programming）”。因此，当我提到\
  \ TDD 时，我并没有多少耐心去面对对方翻白眼和“你不是指的是 BDD 吗？”的回应。我们可能都有比为拼字游戏（Scrabble）字母块更有意义要做。\n*\
  \   你永远不应该使用的工具。在过去的几个月里，有很多帖子——有些很有见地，有些则不然——都围绕着“为什么你[永远不/应该总是]使用 Cucumber”这一通用主题。工具的选择是一个很有用的讨论，但\
  \ Rails 中几乎任何流行的工具都可以被有效地使用，所以这种辩论并不一定能为如何进行良好的测试提供太多指导。\n\n在这两个讨论的背后都隐藏着一个更基础的辩论：关于什么让一个测试或一组测试在应用程序的生命周期变得有效且实用的辩论。到目前，真正只有一个被广泛接受的测试质量客观指标——覆盖率。然而，正如我们在\
  \ *使用 Rcov 衡量测试覆盖率 章节中所看到的，覆盖率是测试质量的一个缺陷衡量标准。\n\n为了这次讨论，我们将使用一个更主观的指标：良好的测试从长远来看可以节省时间和精力，而糟糕的测试则会浪费时间和精力。根据我自己的测试经验，我关注了五个根据这一标准往往使测试成功的特质。另一方面，这些特质的缺失通常意味着测试在未来可能会成为问题。\n\
  \n## 高成功测试的五个习惯\n\n关于自动化测试的风格和结构，我可以提供的最好、最通用的建议是：记住你的测试也是代码。同样，记住你的测试是那些没有测试的代码。你的代码通过测试来验证，但你的测试却没有任何东西验证。因此，让你的测试尽可能清晰且易于管理是保持测试真实性并让其持续的唯一方法。[78]](#f_0143.html_FOOTNOTE-78)\n\
  \n成功的测试具有以下五个特征：\n\n*   独立性（Independence）\n*   可重复性（Repeatability）\n*   清晰性（Clarity）\n\
  *   简洁性（Conciseness）\n*   健壮性（Robustness）\n\n### 独立性\n\n如果一个测试不依赖任何外部测试或数据即可运行，它就是独立的。独立的测试套件无论以什么顺序运行都能得到相同的结果，并且往往将失败范围限制在覆盖\
  \ Bug 方法的测试上。相比之下，一个高度依赖的测试套件中某个部分的更改可能会触发整个测试的失败。测试不独立的明显标志是，只有在按特定顺序运行时才会发生失败——在完全独立的测试中，运行顺序不应该重要。\n\
  \n测试套件独立的最大障碍是全局数据的使用。如果应用程序设计不当，可能很难或无法使测试完全独立，但这并不是我们关注的重点。Rails 具（fixtures）不是测试套件中全局数据的唯一可能原因，但它们是一个非常常见的原因。在\
  \ Rails 环境下，不那么常见的是在设置中使用工具或第三方库但没有拆毁（tear down）。例如，`FlexMock` Mock 对象工具需要在测试之间显式拆毁，`Timecop`\
  \ 时间冻结 gem 也是如此。\n\n除了使用具，大多数 Rails 开发者都知道要避开全局数据，不仅仅是在测试套件中，原因也是相同的——难以追踪的异常依赖。工厂工具优于具的一个原因是，它们能产生具有更好独立性的测试。\n\
  \n### 可重复性\n\n如果多次运行同一个测试得到相同的结果，它就是可重复的。也就是说，如果多次运行同一个测试得到相同的结果，它就是可重复的。[79]](#f_0143.html_FOOTNOTE-79)\
  \ 缺乏可重复性的测试套件标志是间歇性测试失败。\n\n重复性问题的两个经典原因是时间和日期测试以及随机数。在这两种情况下，问题在于你的测试数据在测试之间发生了变化。日期和时间有一个不断增加的习惯，而随机数据倾向于固执地保持随机。\n\
  \n这两类数据的问题略有不同。日期和时间在跨越某些魔法时间边界时会导致间歇性失败。相比之下，随机数使得我们很难测试数字的随机性，以及随机生成的数字在任何需要它的计算中是否被正确使用。\n\
  \n\n\n\n\n两种情况的基本攻击顺序是类似的，并适用于任何不断变化的数据集。目标是封装与模拟（mocking）的结合。封装通常创建一个封装了不断变化的功能的服务对象。通过封装这些功能，你可以更容易对输出值进行存桩（stub）或模拟，从而提供测试所需的持续性。例如，你可以创建一个\
  \ `RandomService` 类来封装 Ruby 的 `rand` 方法，关键点在于，它提供了一种方法，让你通过使用现有的 mock 包或为服务对象提供使用预定义值流的方法来预设一组输出值。一旦你通过自己的单元测试验证了随机服务类是随机的，可以在任何其他测试中对该服务类进行打桩，以提供自矛盾但一致的随机行为。\n\
  \n封装与模拟的精确比例各异。例如，`Timecop` 直接对 `time` 和 `date` 类进行打桩，而没有进行封装。尽管如此，几乎每当我在公共论坛提到\
  \ `Timecop` 时，总会有观众指出，创建一个时间服务是一个更优的解决方案。\n\n## 清晰（Clarity）\n\n如果一个测试的目的能够被立即理解，它就是清晰的。测试的清晰度包含两个部分：第一部分是适用于任何代码的测试的标准可读性；第二部分是描述测试如何融入更大型测试套件的清晰度。每个测试都应该有一个重点，意味着它测试的内容应该与其他测试不同，且这个目的应该易于通过阅读测试代码来察觉。\n\
  \n测试固件（Fixtures）是一个与测试相关的特定问题，它可能导致清晰度下降，特别是固件倾向于产生“魔术”结果的方式。例如：\n\n|   | `test`\
  \ \"the sum should be 37\" `do` |\n|   | `assert_equal(37, User.all_total_points)`\
  \ |\n|   | `end` |\n\n`37` 是从哪里来的？嗯，如果你查看一下这个虚构示例的用户固件文件，你会发现该文件中所有用户的总分相加恰好是 `37`。测试通过了。太棒了？\n\
  \n与当前讨论最相关的两个问题是：凭空出现的魔术字面量 `37`，以及测试名称完全没有说明这到底是针对主用例的测试、针对常见错误情况的测试，还是仅仅因为程序员无聊觉得好玩才存在的测试。将这些问题结合起来，当几个月后由于\
  \ `User` 类或固件文件的更改导致测试崩溃时，修复该测试将迅速变得几乎不可能。\n\n命名显然有助于解决后一个问题。工厂工具（Factory tools）在解决清晰度问题方面也有其用武。由于工厂定义的默认值是预设的，测试中创建的对象的定义可以仅限于那些对测试其按预期运行的行为真正重要的属性。在测试中显示这些属性是揭示程序员意图的重要线索。用更清晰的写法重写测试可能会像下面所示：\n\
  \n|   | `test` \"total points should round to the nearest integer\" `do` |\n|  \
  \ | `User.make(:points => 32.1)` |\n|   | `User.make(:points => 5.3)` |\n|   | `assert_equal(37,\
  \ User.all_total_points)` |\n|   | `end` |\n\n这算不上诗歌，但至少感兴趣的读者现在知道那个讨厌的 `37` 是从哪里来的，以及该测试在宏蓝图中处于什么位置。这样，如果发生了故障，读者可能会有更好的机会修复测试。测试也变得更加独立，因为它不再依赖于全局固件——这降低了崩溃的概率。\n\
  \n我们将在下一节详细讨论长测试，但从清晰度的角度来看，长测试往往会弄浑水，使得难以识别测试的关键部分。基本上，准则就是：测试即代码，在大多数情况下，指导重构和清理代码的相同原则同样适用。这对于“方法应该只做一件事”的规则尤为如此，在这里意味着将测试设置拆分为具有语义意义的部分，并保持每个测试专注于一个特定的目标。\n\
  \n另一方面，如果你无法编写整洁的测试，请考虑可能是代码的问题，你需要进行一些重新设计。如果很难设置一个清晰的测试，通常表明代码有太多的内部依赖。\n\n有一句老的编程格言：由于调试比编码更复杂，如果你写的代码已经尽可能的复杂了，那么从定义上讲，你的技能并不足以去调试它。因为测试本身没有自己的测试且必须是正确的，这句格言建议你应该保持测试的简单，以便为自己留出认知空间来理解它们。特别是，这条准则反对使用巧妙的技巧来减少具有相似结构的多个测试之间的重复。如果你发现自己开始通过元编程来生成套件中的多个测试，你可能会在某个时刻发现复杂性反过来害你。你永远不想陷入必须决定\
  \ bug 是在测试中还是代码中的境地。好吧，你总会处于那个境地的，但如果测试端相对简单，那个处地会容易得多。\n\n## 简洁（Conciseness）\n\n\
  如果一个测试使用最少的代码和对象来实现其目标，它就是简洁的。简洁和清晰有时会发生冲突，正如上一个例子，清晰的版本比原始版本多出几行。在大多数情况下，我会说清晰胜过简洁——我们又不是在玩代码。简洁只有在它让测试变得更容易时才有用用。\n\
  \n简洁通常涉及编写最少的测试或创建最少的对象。除了更清晰之外，简洁的测试运行得更快，当你每天运行几十次测试套件时，这是一件大事。从另一个角度来看简洁性问题，假设你有一个功能，根据某种点数给用户分配不同的称号；分数少于\
  \ 500 的是新手（novice），501--1000 是学徒（apprentice），1001--2000 是行者（journeyman），2001--5000\
  \ 是大师（guru），5001 及以上是超级绝地大师（super Jedi star）。你需要多少个断言来测试这个？\n\n在这种情况下，存在合理的观点差异。我会测试以下情况——这里的设置显然是简略处理的，在实际操作中我可能会进行单个断言测试。此外，在实际操作中我会在每个新断言后编写代码。\n\
  \n```ruby\ndef assert_user_level(points, level)\n  User.make(:points => points)\n\
  \  assert_equal(level, user.level)\nend\n\ndef test_user_point_level\n  assert_user_level(1,\
  \ \"novice\")\n  assert_user_level(501, \"apprentice\")\n  assert_user_level(1001,\
  \ \"journeyman\")\n  assert_user_level(2001, \"guru\")\n  assert_user_level(5001,\
  \ \"super jedi star\")\n  assert_user_level(0, \"novice\")\n  assert_user_level(500,\
  \ \"novice\")\nend\n```\n\n\n\n\n\n```ruby\n| `assert_user_level(nil, \"novice\"\
  )`\n| `end`\n```\n\n这相当于每个新等级的开始处有一个断言，加上针对特殊情况 `0` 和 `nil` 的一个断言，以及在每个等级的末尾有一个断言，用以确保我没有出现差一错误（off-by-one\
  \ bug）。这总共有八个断言。考虑到这段代码可能的实现方式——即使用带有范围的 `while` 子句的 `case` 语句——我不认为有必要测试超过一个字段的结束条件，也没有也没有测试测试范围内的每一个点值。（别笑，我见过有些测试用例实际上会遍历范围内的每一个整数并对它们进行测试。意不意外的是，那是在一个\
  \ Java 项目中。）\n\n## 健壮性 (Robustness)\n\n如果一个测试实际上按照意图测试了逻辑，那么它就是健壮的。也就是说，当底层代码正确时，测试通过；当底层代码错误时，测试失败。这听起来足够简单，但我们已经在书中看到过偏离目标的测试案例。\n\
  \n脆弱性测试（brittle tests）的一个常见原因是将测试断言针对在表面特征上，即使底层逻辑保持不变，这些特征也可能发生变化。这方面的经典例子是视图测试，在视图测试中，你的断言基于页面上实际的文本，而这些文本经常变化，尽管基本逻辑保持不变。\n\
  \n如下所示：\n\n```ruby\n| test \"the view should show the project section\" do\n| get\
  \ :dashboard\n| assert_select(\"h2\", :text => \"My Projects\")\n| end\n```\n\n\
  这看起来是一个完全有效的测试（或者如果你使用 Cucumber 进行集成测试，那么就是一个完全有效的 Cucumber 步骤定义）——直到有人决定“My Projects”是一个很糟糕的标题，并决定改用“My\
  \ Happy Fun-Time Projects”，从而破坏了你的测试。通常情况下，测试一些与表面变化略有隔离的东西（如 DOM ID）对你更有利。\n\n\
  ```ruby\n| test \"the view should show the project section\" do\n| get :dashboard\n\
  | assert_select(\"h2#projects\")\n| end\n```\n\n这里的根本问题并不局限于视图测试。在模型测试的某些领域，针对表面特征的测试在面对模型的细微变化时可能是脆弱的（这与我们已经讨论过的面对测试数据本身变化而导致脆弱的测试不同）。例如，前一节中新手等级的测试实际上依赖于等级边界的具体值。你可能想用类似这样的代码让测试更健壮：\n\
  \n```ruby\n| def assert_user_level(points, level)\n| User.make(:points => points)\n\
  | assert_equal(level, user.level)\n| end\n\n| def test_user_point_level\n| assert_user_level(User::NOVICE_BOUND\
  \ + 1, \"novice\")\n| assert_user_level(User::APPRENTICE_BOUND + 1, \"apprentice\"\
  )\n| # 依此类推……\n| end\n```\n\n在这一点你必须保持谨慎，因为健壮性的另一面不仅是一个在逻辑良好时脆弱失败的测试，而且是一个即使底层代码糟糕也固执地通过的测试——换句话说，这是一个同义反复（tautology）。之前的测试并不是同义反复，但你可以看到它是很容易变成那样。\n\
  \n说到同义反复，Mock 对象（mock objects）有它们特殊的健壮性问题。正如第 *使用 Mock 对象 章所讨论，使用 Mock 对象很容易创建一个同义反复。由于\
  \ Mock 对象通常会对在 Mock 对象上调用的确切方法创建一个硬性预期（hard expectation），因此也很创建一个脆弱的测试。如果你在被测试的代码中添加了意之外的方法调用，那么你可能会仅仅因为调用了意之外的方法而导致\
  \ Mock 对象失败。我曾遇到过登录过滤器的更改导致数百个测试失败，因为通过登录过滤器的 Mock 用户在新的调用上被“弹回”了。一种解决办法（取决于你使用的\
  \ Mock 包）是使用类似 Mocha 的 `mock_everything` 方法，它会自动为任何意之外的方法调用返回 `nil`，而不会触发错误。\n\n\
  ## 故障排除 (Troubleshooting)\n\n点、点、点、点、点——测试通过了，看起来该吃午饭了——点、点、点、点、F。F？F？但代码是可以运行的。我知道它可以运行。我觉得它是可以的。为什么我的测试失败了？\n\
  \nTDD 开发人员生活中最令人沮丧的时刻之一就是测试失败且不清楚原因，而不是那种符合预期的测试失败失败情况。这里有一些技巧、窍门、提示和想法，帮助我们度过那段艰难的时光。\n\
  \n### 寻找变化之处\n\n这可能是历史上最显而易见的建议，但在面对糟糕的 Bug 时，它值得像咒语一样重复一遍：\n\n当一个曾经通过的测试失败时，意味着某些东西发生了变化。\n\
  \n变化可能在代码中、系统或测试中。但它可能不是因为太阳黑子，也可能不是附在你 MacBook 上的恶灵[[80]](#f_0143.html_FOOTNOTE-80)。\n\
  \n查看最近的更改可以帮助你找出失败的原因。Git 的 `bisect` 工具会自动完成此操作；或者你只需要查看所选版本控制查看器中的最近更改即可。如果测试曾经通过过，那么很有可能答案就在那里。\n\
  \n这是一个支持频繁提交的极佳论点（特别是当你使用 Git 且可以进行本地提交时），这样你的更改就会非常细粒。\n\n### 隔离失败 (Isolate the\
  \ Failure)\n\n在观察少数失败测试时，能够只运行这些测试是非常用的。`autotest` 在这方面表现出色，因为它会反复运行失败的测试直到通过。`cucumber`\
  \ 的默认行为也会重运行失败的测试。这对于你有许多不在该测试类中的失败测试时特别有用。\n\n[`gist.github.com/101130`](http://gist.github.com/101130)\
  \ 中的代码和终端片段对于快速运行一个类非常有帮助，这几乎就像隔离失败的测试，或者至少有用。取决于你使用的 IDE 和测试框架，你可能还可以从 IDE 运行单个测试。\n\
  \n隔离测试可以让你在关注少数测试时运行得更快，并且让你插入的任何诊断信息更容易解释。\n\n这里有两个我从 Kent Beck 那里学到的宝贵建议：\n\n\
  - 回退自上一次通过测试以来的所有更改并重新开始。这在你以非常小的增量工作时效果最好，但它可以让你跳出“我知道我写写错了，但我就是看不出来”的噩梦。\n- 将被测试方法中的所有表达式替换为字面量——如果这样通过了，逐个放回表达式直到找到罪祸首。\n\
  \n### 诊断 (Diagnostics)\n\n我不喜欢使用停止和单步调试器，无论是图形界面还是命令行的。我在 IDE 中时用过它们，但从未真正使用过 Rails\
  \ 的命令行调试器。与可以在测试中进行断言相比，我发现那种体验并不棒。\n\n通常，为了诊断测试中发生了什么，我要么在测试中添加额外的断言，要么让代码打印信息到控制台或日志中。如果我通过断言进行诊断，通常能够更详细地测试变量的值。\n\
  \n\n\n\n由于某种原因，我看到很多人在使用 Ruby 的 `puts` 方法向控制台输出——我推荐使用 `p`，它在打印之前会对比对象调用 `inspect`，通常会产生包含更多信息的输出。理所当然，我在我的\
  \ `test_helper.rb` 文件中放入了 `require pp`，这允许我使用 `pp` 来获取格式化后的输出，这对于嵌套数据结构非常有用。此外，`y`\
  \ 可以提供输出的 YAML 表示——对于 ActiveRecord 对象来说非常易读。`awesome_print` gem 提供了 `ap` 方法，可以为复杂数据结构提供极具读性的输出。\n\
  \n|   | `>> x = {1 => ['a', 'b'], 2 => 'c'}` |\n|    | `>> puts x` |\n|    | `1ab2c`\
  \ |\n|    |  |\n|    | `>> p x` |\n|    | `{1=>[\"a\", \"b\"], 2=>\"c\"}` |\n| \
  \   |  |\n|    | `>> pp x` |\n|    | `{1=>[\"a\", \"b\"], 2=>\"c\"}` |\n|    | \
  \ |\n|    | `>> y x` |\n|    | `---` |\n|    | `1:` |\n|    | `- a` |\n|    | `-\
  \ b` |\n|    | `2: c` |\n|    |  |\n|    | `>> require 'ap'` |\n|    | `=> true`\
  \ |\n|    | `>> ap x` |\n|    | `{` |\n|    | `1 => [` |\n|    | `[0] \"a\",` |\n\
  |    | `[1] \"b\"` |\n|    | `],` |\n|    | `2 => \"c\"` |\n|    | `}` |\n\n我曾被发现在代码各处埋下打印语句——控制器、Rails\
  \ 本身（通常是为了教学目的）。如果我开启了 Autotest 限制测试运行仅执行失败的那个测试，情况尤为如此。只需记住在完成后把打印语句删掉。在测试中添加额外的断言也可以作为打印语句的替代。\n\
  \n如果你需要查看日志（最常见是因为你正在运行 Passenger 并尝试从实际运行的应用程序获取输出），你可以在 Rails 应用的任何地方使用 `Rails.logger.error`\
  \ 写入日志。你可以用任何其他日志级别替换 error，但何必费此呢？\n\n如果你在使用 Cucumber 或 Webrat/Capybara，Webrat\
  \ 和 Capybara 拥有 `save_and_open_page` 方法，这非常有帮助。它会获取当前的 Webrat DOM（包括你使用 Webrat 表单方法所任何更改），将页面保存到临时文件，并在你的默认浏览器中打开它。生成的页面可能会丢失一些图像，你也无法真正点击链接，但你可以看到获取的是哪个页面，而且使用\
  \ Firebug 或 WebKit 网页检查器在浏览器中检查源码，比通过 `print response.body` 查看要容易得多。\n\n## 清醒头脑\n\
  \n去散散步。强制你的搭档去解决问题。去喝杯咖啡（实际上，我讨厌咖啡；去买瓶无糖可乐）。睡午觉。这些清醒头脑的步骤确实有效。尝试向别人解释这个问题——通常情况下，解释问题的行为有助于识别出你忽略的某些点。\n\
  \n注释掉那个故障测试很有诱惑力；这样你的套件就通过了，一切看起来都很良好。这通常是个坏主意，尽管有时大规模重构确实能让测试过时。\n\n## 从新项目到遗留项目\n\
  \n所有这些风格问题在规划和执行测试时都有帮助。不过，与大多数测试建议一样，它们有一个共同点：它们应用到新应用程序比应用到一堆已经存在的、未测试代码上要容易得多。在下一章中，我们将探索尝试在一个长期缺乏\
  \ TDD 的项目中引入 TDD 时所面临的特殊挑战。\n\n### 脚注\n\n| [[78]](#f_0141.html_FNPTR-78) | 话虽如此，在实践中，为了可读性，我稍微愿意在测试中允许重复。但仅是一点点。\
  \ |\n| [[79]](#f_0141.html_FNPTR-79) | 抱歉，没忍住。如果这算宽慰的话，这个玩笑我在实际演讲中讲时也没人笑。 |\n| [[80]](#f_0142.html_FNPTR-80)\
  \ | 除非你住在查尔斯·斯特罗斯（Charles Stross）的小说里。或者在使用 Perl 编程。 |\n\nCopyright © 2011, The\
  \ Pragmatic Bookshelf.\n\n# 第 18 章：测试遗留应用程序\n\n你被要求接手一个现有项目的编码工作。理论上，你只需要向现有的代码库中添加几个新功能，而它目前运行良好。嗯，会有一些偶尔的\
  \ bug——那些原始代码人员无法追踪的怪异问题。此外，要添加的新功能涉及对应用程序中几乎每个模型的更改。噢，而且之前的代码人员并没有怎么关注测试。这里那里有几个测试，但总的来说并不多。实际代码比面条工厂还要乱（spaghetti），你完全不知道其中某些“棘手”代码片段是做什么的，而且……\n\
  \n在不久以前，还没有 Rails 遗留项目，但现在有很多。因此，我们面临着一种新情况：本书到目前为止的所有建议都是好的，但如果你不是从一个新应用程序开始你的\
  \ TDD 体验呢？如果你是从一个现有的代码库开始的呢？\n\n已经有专门关于如何处理遗留代码库的著作。在本章中，我们将重点关注让遗留代码进入测试的技术。在遗留代码库中，你还需要处理许多其他问题。让遗留系统运行起来可能是一项任务，而且有各种技术可以安全地向现有代码添加功能或进行重构。我们在这里只讨论与测试交叉的话题。关于管理遗留项目的更详细信息，请参阅\
  \ Michael Feathers 的 *Working Effectively with Legacy Code*[[WELC]](#f_062.html_CITE-1)。\n\
  \n## 接受你在面对强大力量时的无能为力\n\n即前任代码人员的愚蠢，这是一个极其棒的资源[[81]](#f_0149.html_FOOTNOTE-81)。你不会一夜之间将这个旧项目巨兽变成一个具有近乎全覆盖的优雅测试驱动代码奇迹。\n\
  \n挥挥拳头，咒骂前任程序员的名字，如果这让你感觉好受的话[[82]](#f_0149.html_FOOTNOTE-82)。把情绪发泄出来，然后继续开始处理代码库。\n\
  \n## 基础设置\n\n当你第一次面对一个新的代码库时，你的首要工作是搞清楚到底发生了什么。为了这个目标，有三件事你应该立即执行。接下来的三节定义了将遗留项目转换为可以稳健进行敏捷和\
  \ TDD 工作循环项目的基础步骤。\n\n### 将项目纳入版本控制\n\n\n\n\n它可能已经受版本控制了，但防患未忧。虽然在开始处理一个新的遗留代码库时，并不是追求新奇工具的时机，但使用\
  \ `Git` 或或其他源码控制系统会让你受益匪浅，这些系统可以让你轻松创建和操作分支。这将使你能够利用分支轻松探索代码库的更改，分支可以作为草稿板，根据需要保留或丢弃。\n\
  \n### 让它运行起来\n\n如果这个遗留项目在构思时对 Rails 社区实践缺乏足够的了解（缺乏测试这一点可以证明），那么生产环境也可能有些糟糕，这并不意外。按照常识，你的开发环境、测试环境和生产环境应该尽可能相似，以防止特定环境的错误。尽管这在通常情况下是正确的，但如果你的遗留项目运行在某些随机且古怪的服务器配置上，那么在你的测试服务器上（更不用说开发机器上）复制这种配置可能是困难甚至不可能的。\n\
  \n如果无法实现完全相同的生产环境，那么测试环境和开发环境应该尽可能通用。如果可能，请尽快将生产环境迁移到一个不那么脆弱且更标准的环境中。\n\n### 运行测试套件\n\
  \n乍看之下，这可能让你觉得是一条完全没用的建议。如果遗留团队一直忽略测试，那么那里什么都没有，对吧？当然一切都能运行。\n\n嗯，并不一定。你至少需要注意两点。即使之前的代码人员完全忽略了测试，`Rails`\
  \ 可能仍然自动生成了测试代码。你可能会遇到最常见的问题是：创建初始模型时生成的 `fixtures`（固定场景）已经过时。如果列被删除或重命名，`fixtures`\
  \ 将无法加载，你会收到大量的错误。另一种可能性稍小的是，为生成的脚手架（scaffold）生成的控制器测试可能与代码脱节；例如，如果后来添加了身份验证和角色，你将需要在测试中匹配这些身份验证。\n\
  \n在某些方面，如果之前的代码人员曾尝试过编写测试，后来因为还没读过这本书而放弃了，那么你的工作会更难。（我假设是这样。）在这种情况下，你可能会遇到各种测试，这些测试可能曾经通过过，但后来由于后续代码的更改或疏忽而失效了。你目前必须假设代码是正确的，而测试是错误的——这与标准的\
  \ TDD 场景恰恰相反。利用这个机会学习遗留代码是如何工作的，但此时不要为了匹配测试而修改代码。如果你无法弄清楚如何让测试通过，就将其注释掉或删除，添加一条注释，等在你有了更完善的测试脚架后再回来处理它。正如我们讨论过的，测试覆盖率在这一阶段不是重点。\n\
  \n### 测试驱动的探索\n\n对遗留代码库进行测试从需要进行更改时才真正开始。通常，新项目的首要任务是处理前任团队留下的关键 Bug——这种任务必须在保留现有行为的同时完成，且不需要对应用程序进行剧烈的重构。\n\
  \n在这种情况下，将代码纳入测试有两个目标。你希望能够判断出 Bug 是否已修复；这一步涉及一个或多个或标准的 TDD Bug 修复过程，通过一个或多个失败的测试来隔离\
  \ Bug，并在 Bug 修复后让这些测试通过。此外，你必须确认任何现有的正确行为没有受到损害。在一个从一开始就采用 TDD 的项目中，你已经具备了这种能力，但在没有测试的遗留项目中，你需要建立起这种覆盖率。\n\
  \n通常来说，针对现有系统的测试有两种类型：黑盒测试和白盒测试——这两个短语远早于软件测试，适用于任何类型的测试过程。黑盒测试之所以被称为黑盒，因为它忽略了应用程序的内部结构，只测试系统的顶级输入和返回的输出。相反，白盒测试利用对系统内部的知识来显式地测试代码中的特定路径。\n\
  \n### 使用 Cucumber 进行黑盒测试\n\n我们在书中已经见过 Rails 应用程序的黑盒测试，尽管我们没有那样命名。根据我们的定义，`Rails`\
  \ 应用程序的黑盒测试作用于用户输入和系统输出（通常是 `HTML`）层面。这听起来很像 `Cucumber` 测试，对吧？或者任何类型的集成测试，但由于 `Cucumber`\
  \ 位于标准的 `Rails` 代码之外，它是与遗留代码进行交互的理想选择。针对遗留数据库使用 `Cucumber` 的主要优势在于它的黑盒性质。验收测试基本上以用户的方式与系统进行交互。由于不需要与代码的内部结构交互，无论代码有多混乱，都可以编写验收测试。\n\
  \n`Cucumber` 在处理 Bug 时可能很有用，因为 Bug 通常根据用户的动作和响应来描述。这些动作和响应可以很容易翻译成 `Cucumber` 测试，而且如果你改变了行为，很容易识别出来。此外，测试很少的代码库缺乏书面需求的情况也并未罕见。在测试很少的情况下，验收测试可以作为基准需求。\n\
  \n不过，这并非全完美。对于遗留应用程序，验收测试编写虽然容易，但用处有限。`Cucumber` 测试无法告诉你需要在应用程序的哪里进行更改来修复 Bug 或添加功能。此外，`Cucumber`\
  \ 测试运行较慢，所以你不希望它们成为你工具箱的全部。\n\n### 白盒测试\n\n最终，编写单元测试是不可避免的。处理遗留应用程序时，有两种不同的用户测试是有用的。我们稍后会讨论标准测试；首先，让我们检查上一节讨论的\
  \ Cucumber 测试对应的单元测试。\n\n基本过程非常直接：实现的难度取决于代码本身。首先，选择一个要测试的方法。理想情况下，该方法与你计划对应用程序进行的更改有关，尽管这个过程也适用于“发生了什么”的探索。\n\
  \n让我们为这个方法编写一个知道会失败的测试。我们不需要深入内部。我们正在做的基本上是声纳——向代码深处发送测试并希望得到信号。\n\n幸运的是，即使是最不重视测试的\
  \ Rails 应用仍然有 `test` 目录，因此我们可以很轻松地编写第一个测试：\n\n```\ntest \"calculation of sales tax\"\
  \ do\n  user = User.create(:state => :il)\n  order = user.orders.create\n  order.line_items.create(:price\
  \ => 250)\n  order.line_items.create(:price => 300)\n  assert_in_delta(order.sales_tax,\
  \ -300000)\nend\n```\n\n我们在这里拥有一个简单、直接的测试，直到最后一行（插入滑稽的 DJ 刮胶片音效）。我们并不真的期望销售税是 -300,000。但我们不想猜它是什么：我们将让应用程序告诉我们。\n\
  \n\n\n运行测试。此时，会发生两种情况之一。大多数情况下，测试会报错，因为存在我们未察觉的对象依赖、某个值不符合预期，或者我们以其他方式扰乱了遗留应用运行所需的这种微妙平衡。我们需要弄清楚如何解决这些问题。通常，我们必须创建更多对象。在这个示例中，我们可能会显式地创建\
  \ `Product` 对象。对象链可能会变得臃肿，这在目前阶段是可以接受的：目标是理解正在发生什么。如果代码本身很臃肿，就让测试作为需要修改之事项的里程碑吧。\n\
  \n最终，我们耗尽了错误，应用程序输出了销售税，测试出现了一个正常的验证失败——因为，再次所说，答案可能不是 -300,000。此时，我们将实际值插入测试中并宣告胜利。我们获得了一些测试覆盖，并对应用程序是如何组合在一起的有了更深入的理解。是时候进行下一个测试了，最可能是在其他测试用例中尝试现有的方法，例如设计用于触发错误响应的用例。\n\
  \n我们并不在乎销售税的值是否正确。好吧，从业务角度来看，计算销售税是很重要的；但从测试角度来看，我们必须假设代码是正确的，这样在我们因为所有的 bug 开始进行更改时，才有一个稳定的基础。\n\
  \nRails 控制台是我们在探索过程中的朋友和盟友。控制台是快速尝试这些对象间交互的极佳方式。一旦我们在控制台中弄清楚了，就会将命令转移到测试中，以便它们可以重复运行。\n\
  \n## 我应该使用什么工具？（遗留版）\n\n接手遗留代码库的副作用是，它让我们原本可能为此纠结的工具选择变得明朗。简而言之，如果之前的代码编写人员使用了某种工具，并且有任何可以挽救的东西，就使用该工具。我们不想处于一边要处理\
  \ `RSpec` 测试和大量现有的 `Shoulda`/`Test::Unit` 测试，一边添加代码覆盖率的境地。如果组合中还没有工厂工具，我建议添加一个工厂（factory）工具。为遗留应用编写测试可能需要创建创建相关对象的完整链。设置一个工厂工具来一次性创建关联关系可以节省大量时间。\n\
  \n当然，这条规则也有例外。脑海中浮出的两种情况是：原始开发者选择的工具完全不适合我们想要施加的测试压力；更常见的情况是，现有测试是没用的，最好快速删除它们并重新开始，到那时我们可以挑选任何我们工具。\n\
  \n> Mike Gunderloy 在《Rails Rescue Handbook》中为遗留测试的初始分拣提供了一个简单的规则：如果你在五分钟内无法弄清楚一个测试在做什么，就删掉它。\n\
  \n## 移除依赖\n\n依赖是遗留测试中最具挑战性的问题。也许良好的 TDD 代码最大的美德在于，测试迫使代码的各个部分之间尽可能保持相互独立。没有测试的情况下，遗留代码往往具有高度的相互依赖性。这在几个方面增加了添加测试的难度：为了测试单个方法可能需要创建多个对象；或者，如果某个单元难以访问或被封装在一个巨大的\
  \ 300 行方法中，就可能很难将测试限制在一个真正的功能单元内。然而，有办法可以让我们需要测试的代码不再相互依赖，并且足够分离，从而实现我们必须编写的测试。\n\
  \n### 保持分离，陌生人\n\n保持我们的新代码不依赖遗留代码最简单的方法可能是由我们自己自己分离。在可能的情况下，在新方法或新类中编写新代码，仅从现有的遗留混乱中调用它们。理论上，这使得我们的新代码足够不受干扰，可以通过\
  \ TDD 编写。\n\n让我们尝试一个简短的示例。考虑来自名为 Flitter 的社交网站中一个可能且有点混乱的方法：\n\n| | `class Flit`\
  \ |\n| :--- | :--- |\n| | `def process_flit` |\n| | `if text =~ /##/` |\n| | `flit.text\
  \ = \"testing: remove this code after 3/10/08\"` |\n| | `end` |\n| | `if text.ends_with?(\"\
  %fb%\")` |\n| | `send_to_facebook` |\n| | `else if user.flits_in_last_day > 423`\
  \ |\n| | `return` |\n| | `end` |\n| | `flit_server.check_for_mentions(self)` |\n\
  | | `flit_server.follower_list(user)` |\n| | `user.update_attributes(:flit_count\
  \ => user.flit_count + 1)` |\n| | `# and so it goes...` |\n| | `end` |\n| | `end`\
  \ |\n\n在这个纠缠的混乱中，我们必须添加一个新功能：如果 flit 包含形式为 `$username` 的文本，必须通知该用户。我们可以在方法中直接添加另一个\
  \ `if` 语句，但测试这种新行为非常困难（在现实生活中，这个方法可能是 300 行，而且谁又知道它可能调用 PayPal）。相反，我们使用常规的 TDD 在适当的位置添加新方法。如果我们觉得很有冒险且看起来似乎可行，那么添加一个\
  \ mock 测试来确认 `process_flit` 调用了 `dollar_sign` 可能也是合适的。\n\n如果我们正在添加或提取大量功能，我们可能会考虑创建自己的独立类，而不仅仅是一个方法。一个需要新类的信号是，如果它向多个方法传递了同一组实例变量。我非常喜欢代表过程并替换长方法的类。从测试目的来看，将新代码移动到新类中可以使测试更容易，因为新代码对现有应用程序的依赖更少。\n\
  \n正如 Michael 所，“当你打破遗留代码中的依赖时，通常必须暂时放弃你的审美感”（出自 *Working Effectively with Legacy\
  \ Code*）。换句话说，你是否知道在清理桌面时，会经历一个堆满纸张的中间阶段，看起来比以前更糟？还是这只是我一个人的？无论如何，我们在这里处于一个中间状态，介于原始无差别整体和良好重构组织的新版本之间。通过一个一个打破依赖来构建测试套件，稳步走向整洁的代码。\n\
  \n### 遗留数据库、测试与你\n\n如果我们的遗留应用程序与 Rails 通用标准只有点头之，那么数据库可能也是一团糟。许多困遗留数据库的问题可能令人沮丧（例如异常的命名规范或对\
  \ ActiveRecord 特性的异常用法），但它们不会影响我们测试功能的能力。\n\n如果数据库添加了代码中显而可见的约束，我们需要小心。通常这涉及超出 ActiveRecord\
  \ 模型中指定的任何验证的列约束，或者在 Rails 代码中任何处未指定的外键约束。外键约束是最难处理的。\n\n\n\n\n从测试的角度来看，问题是双重的。首先，某些业务逻辑存在于\
  \ Rails 代码之外的数据库中，在这些地方很难被发现、测试和修改。更糟糕的是，外键约束增加了依赖，要求某些对象必须一起创建。在测试环境中，这种依赖会导致诡异的\
  \ Bug：数据库不允许你创建测试数据，而你又需要创建一些与测试无关的对象，它们仅仅是为了让数据库“满意（满足约束）”。对于一个由不信任 `ActiveRecord`\
  \ 的、依赖数据库的开发团队创建的遗留应用程序，这是需要密切关注的。\n\n### 使用 Mock 对象（Mock Objects）移除依赖\n\n如果你不想一上来就从验收测试这种“2\
  \ 万英尺高”的宏观视角开始，那么 Mock 对象测试是另一种在不破坏未测试代码的情况下启动测试的方法。\n\n在遗留代码背景下，使用 Mock 对象的优势在于，通过为被测试方法调用的任何其他方法创建\
  \ mock 或存根（stub），将单个类和方法从应用程序的其他部分隔离出来。在处理遗留应用时，这允许我们暂时搁开应用程序其他部分可能有多不稳定的，专注于我们正试图理解的那个部分。同样，工厂对象（factory\
  \ objects）使得根据需要轻松指定数据，从而轻松隔离遗留方法。\n\n在实践中，这与 RSpec 中相关的重度使用 Mock 测试实践非常相似——只不过代码已经存在，所以它不是测试驱动或行为驱动的。对于我们需要进行测试的遗留方法，我们的做法如下：首先，我们获取以下遗留方法（可以假设它是某个模糊订单模型的一部分）：\n\
  \n| | `def calculate_order_status` |\n|---| | `self.total = 0` |\n| | `line_items.each\
  \ do |item|` |\n| | `if item.quantity.blank?` |\n| | `LineItem.delete(item.id)`\
  \ |\n| | `next` |\n| | `end` |\n| | `if item.cost.nil? then item.cost = 0 end` |\n\
  | | `if credit_card_is_valid? && item.ready_to_ship?` |\n| | `self.total += item.cost\
  \ * item.quantity` |\n| | `end` |\n| | `end` |\n| | `self.to_be_paid = self.total\
  \ - self.amount_paid` |\n| | `if self.to_be_paid == 0` |\n| | `self.paid_in_full\
  \ = true` |\n| | `end` |\n| | `end` |\n\n这段代码有点凌乱。它正在执行一些本该属于 `LineItem` 类的事情，而且可能需要进行拆分。当然，这个例子仅仅触及了编写糟糕的遗留系统错综缠绕的冰角。\n\
  \n这段代码调用了许多可能可以通过数据设置的属性，例如 `amount_paid` 或 `item.quantity`，但它也调用了一些本身可能是复杂方法的内容，例如\
  \ `credit_card_is_valid?` 或 `item.ready_to_ship`。\n\n针对这段代码的一个可能测试会 mock 这些方法，看起来可能如下（假设我们正在使用\
  \ `factory_girl` 并已经设置了蓝图）：\n\n```\ntest \"calculating order status\" do\n  order\
  \ = Factory(:order, :amount_paid => 2.50)\n  order.expects(:credit_card_is_valid?).at_least_once.returns(true)\n\
  \  item1 = Factory(:line_item, :quantity => 1, :cost => 3.50)\n  item1.expects(:ready_to_ship?).returns(true)\n\
  \  item2 = Factory(:line_item, :quantity => 2, :cost => 5)\n  item2.expects(:ready_to_ship?).returns(false)\n\
  \  order << item1\n  order << item2\n  order.calculate_order_status\n  assert_equal\
  \ 3.50, order.total\n  assert !order.paid_in_full\nend\n```\n\n第 2 和 3 行设置了订单以及\
  \ `credit_card_is_valid?` 方法的 mock。第 4-9 行设置了项目，实际测试动作发生在第 10 行。\n\n### 寻找缝隙（The\
  \ Seam）\n\nMock 对象是处理遗留代码的一种通用技术的特定版本，该技术涉及寻找代码中的“缝隙”（seams）并利用它们。缝隙是指可以在不改变现有代码的情况下更改应用程序行为的地方。这听起来很神奇，但基本原理很简单，而且\
  \ Ruby 让它变得非常简单。本质上，mock 通过用返回值替换方法调用来实现此点。\n\n然而，也有一些需要注意的问题。为复杂方法设置 mock 可能会非常耗时。我们可能需要\
  \ mock 无法提供的副作用，例如诊断日志。或者，我们可能比 mock 易于提供的对参数或状态进行更详尽的处理。\n\n让我们来看一段想要测试的示例 Ruby\
  \ 代码。在示例中，`flit_server` 是系统中的一个代表内部服务器的对象，而那些看起来无害的调用是对生产环境中存在但在测试环境中不存在的真实外部服务的调用：\n\
  \n```ruby\ndef process_flit\n  # 一堆凌乱的代码\n  flit_server.check_for_mentions(self)\n\
  \  # 更多凌乱的代码\n  flit_server.follower_list(user)\nend\n```\n\n现在我们需要对 `process_flit`\
  \ 方法进行测试。测试可能如下：\n\n```ruby\ntest \"a flit is processed correctly if it has followers\"\
  \ do\n  user = User.create(:screen_name => \"zot\")\n  follower = user.followers.create(:screen_name\
  \ => \"jennyw\")\n  flit = Flit.new(user, \"Hello to $jennyw, How are things on\
  \ earth?\")\n  flit.process_flit\n  assert_equal(1, follower.timeline.size)\nend\n\
  ```\n\n\n\n\n为了使此测试生效，我们需要防止原始代码中的 `flit_server` 对象实际调用在测试环境中并不存在的生产服务器。为了起起见，我们假设有一个充分的理由不能在此处使用普通的模拟（mock）包——可能是因为\
  \ `flit_server` 对象与代码的其他部分结合得太紧。我们需要解决两个问题：我们需要创建一个在被调用时执行测试安全操作的 `flit_server`\
  \ 对象，并且我们需要将该对象注入到测试中，使其在运行被测方法时成为所使用的对象。\n\n幸运的是，对我们来说，Ruby 在重定向代码执行方面非常灵活。在一种编译型面向对象语言中，我们可能需要为预期对象创建一个新的子类并重写相关方法。在\
  \ Ruby 中我们也可以这样做：\n\n```ruby\nclass TestFlitServer < FlitServer\n  def check_for_mentions(flit)\n\
  \    # test code\n  end\n\n  def follower_list(user)\n    # test code\n  end\nend\n\
  ```\n\n根据 `FlitServer` 类的具体细节，可能还有其他必须重写的方法，例如构造函数。\n\n还有其他几种 Ruby 方法实现类似的操作。与其创建子类，我们可以为测试创建一个实例，并向该实例的单例类（singleton\
  \ class）添加重写方法。\n\n该类的定义如下：\n\n```ruby\ntest_server = FlitServer.new\nclass << test_server\n\
  \  def check_for_mentions(flit)\n    # test code\n  end\n\n  def follower_list(user)\n\
  \    # test code\n  end\nend\n```\n\n或者，我们可以创建一个完全的虚拟类（dummy class），涵盖被测方法的所有调用。由于\
  \ Ruby 在检查对象是否响应方法之外，不进行任何类型检查，因此完全没有问题：\n\n```ruby\nclass FakeServer\n  def check_for_mentions(flit)\n\
  \    # test code\n  end\n\n  def follower_list(user)\n    # test code\n  end\nend\n\
  ```\n\n现在我们需要将新对象注入到测试代码中。从某种意义上说，我们在这里正在重新实现模拟对象包所的事情。我们可以通过对 `flit` 对象执行与 `flit_server`\
  \ 对象相同的的操作，尝试在测试本身中进行注入。这是一个示例：\n\n```ruby\nclass TestFlit < Flit\n  def flit_server\n\
  \    TestFlitServer.new\n  end\nend\n\ntest \"a flit is processed correctly if it\
  \ has followers\" do\n  user = User.create(:screen_name => \"zot\")\n  follower\
  \ = user.followers.create(:screen_name => \"jennyw\")\n  flit = TestFlit.new(user,\
  \ \"Hello to $jennyw, How are things on earth?\")\n  flit.process_flit\n  assert_equal(1,\
  \ follower.timeline.size)\nend\n```\n\n在这种情况下，我们通过派生 `Flit` 来模拟第一种方案。之前展示的另外两个方案在测试内部也有类似的用法。\n\
  \n如果我们愿意对原始代码进行一点微修改，可以使用 Ruby 的默认参数来获取一个几乎完美的“接缝点”（seam）：\n\n```ruby\ndef process_flit(flit_server\
  \ = nil)\n  flit_server ||= self.flit_server\n  # a bunch of messy stuff\n  flit_server.check_for_mentions(self)\n\
  \  # more messy stuff\n  flit_server.follower_list(user)\n  # more messy stuff\n\
  end\n```\n\n在新方法中，`flit_server` 是局部变量，如果不作为参数传递，它将获得对象实例方法的值。得益于 Ruby `||=` 运算符的魔力，如果传递了值，则该值将在方法的剩余部分中使用。没有使用此参数的现有旧代码行为保持不变，但它为我们提供了一个杠杆，通过将测试服务器作为参数调用\
  \ `process_flit` 来在测试中插入自己的服务器：\n\n```ruby\ntest \"a flit is processed correctly\
  \ if it has followers\" do\n  user = User.create(:screen_name => \"zot\")\n  follower\
  \ = user.followers.create(:screen_name => \"jennyw\")\n  flit = TestFlit.new(user,\
  \ \"Hello to $jennyw, How are things on earth?\")\n  flit.process_flit(TestFlitServer.new)\n\
  end\n```\n\n## 不要回回头\n\n如果你像我一样，一次性清理整个基础代码的诱惑可能会让你无所措。在这种情况下，就躺平直到这种感觉消失，或者你临近截止日期，以至于修复所有问题不再是一个可行的方案。\n\
  \n尽可能一次只做一件事。在添加新功能时，不要去扩展测试覆盖率。\n\n### 脚注\n\n- [81]: 如果你是是之前的代码编写者并回来修复过去编写的代码，这一点是双倍成立的。\n\
  - [82]: 同样，如果之前的程序员是你，这一点也是双倍成立的。\n- [83]: 嗯，如果考虑到销售税真的是 -300000 的这种极小概率，那就是三件事。\n\
  - [84]: Mike Gunderloy 在《Rails Rescue Handbook》中提出了一个遗留测试初始分类的简单规则：如果你在五分钟内无法弄清楚测试在做什么，就删掉它。\n\
  - [85]: 你真的需要警惕那些超过 300 行的控制器方法。\n- [86]: 某些模拟包允许我们传递一个任意块作为存根调用的结果，但如果我们需要的结果很复杂，创建自己的对象通常更具可读性。\n\
  \n\n\n\n\n# 第 19 章：性能测试与性能优化\n\n在测试中提到“性能”通常指的是两个独立的任务。第一个是性能测试（performance testing），即使用你的测试套件来自动化测试应用程序的实际性能。第二个是测试性能（test\
  \ performance），即尝试让你的测试套件本身运行得尽可能快。\n\n`Rails`提供的设置和评估性能测试结果的工具使用起来相对简单，至少与性能测试加入\
  \ `Rails` 核心之前阶段的那些复杂的配置相比。这些工具的结果可以用来比较随时间推移的应用程序性能，并追踪性能瓶颈的确切位置。\n\n提高测试套件运行速度的工具大部分位于测试框架之外。通常，测试性能有三种类型：你可以编写运行系统资源更少的测试，选择一个能更好地利用可用\
  \ CPU 时间的替代测试运行器，或者修改环境以允许常见的测试活动运行得更快。最后一种选择主要适用于像专用的持续集成服务器这样的设备，它们除了运行测试外几乎什么都不做。\n\
  \n有效的 TDD（测试驱动开发）依赖于编写少量测试代码和编写少量应用程序代码之间的紧密循环，如此往复。其隐含假设是你可以足够快地运行相关测试，从而让你能够在测试和代码之间来回。然而，随着应用程序的增长，你的测试套件运行时间会变长。缓慢的测试套件会持续且稳定地消耗你的生产力。套件运行得越慢，真正的\
  \ TDD 就变得越痛苦，测试套件运行的频率也就越低。这一切都会阻碍 TDD 以及整个敏捷开发所依赖的持续反馈。\n\n加速测试套件的努力通常属于以下几类：\n\
  \n*   专注于测试执行，只运行与你正在编写的代码直接相关的测试。这并不是真正的性能修复，但具有类似的实际效果。\n*   在你的实际应用程序中进行性能改进。我相信为什么这会加快你的测试，以及为什么我们在这本书中不会在这上面花费太多时间是显。\n\
  *   提高测试本身的性能，通常通过减少设置测试上花费的时间。\n*   使用更快的测试运行器。我们在这里讨论两种：保持在后台加载以减少不断重启 Rails 环境需求的测试服务器，以及尝试在你的网络上寻找未使用的处理器并使用它们并行运行测试的网络化服务器。\n\
  \n## 性能测试与基准测试\n\n就像《法律与秩序》（Law & Order）开场旁白中的司法系统一样，Rails 的性能测试包含两个独立但对等的部分。在基准测试（benchmark\
  \ test）中，一段代码（通常包含一个或多个页面访问）会被运行多次。基准测试仅测量测试代码运行所需的时间。数据随后会被存储，允许你将代码当前的性能与过去的性能进行比较。基准套件的目标是作为一个初步提示，某些某些实际上导致了你的代码变慢。或者，当你计划进行重大性能更改时，基准测试可以作为更改前后的对比，证明该更改具有价值。\n\
  \n在分析测试（profile test）中，目标是剖析应用程序的特定部分，以确定是哪些代码部分导致了性能问题。在分析测试中，你通常针对一小段代码：例如，单个控制器或模型调用。分析器会跟踪应用程序在执行过程中涉及的每个独立方法上花费的时间。最后，你会得到一份相当复杂的报告，它可能告诉你你的代码中哪些部分值得你花时间进行优化。\n\
  \n为了运行性能测试，你需要在项目中包含 `ruby-prof` gem。如果你想测试对象创建而不仅仅是 CPU 时间，你可以在 Ruby 中添加一些额外的魔法，但我们稍后会提到这一点。\n\
  \n`gem \"ruby-prof\"`\n\n通过生成器在 Rails 中创建一个新的性能测试：\n\n```\n% rails generate performance_test\
  \ huddle_performance\ninvoke test_unit\ncreate test/performance/huddle_performance_test.rb\n\
  ```\n\n非常令人兴奋。命令的最后一个参数是测试名称，完全是随机的。你将得到一段简短的 Rails 代码：\n\n```ruby\nrequire 'test_helper'\n\
  require 'rails/performance_test_help'\n\nclass HuddlePerformanceTest < ActionDispatch::PerformanceTest\n\
  \  # 将此替换为你的真实测试。\n  def test_homepage\n    get '/'\n  end\nend\n```\n\n这看起来应该像一个不带断言的集成测试，很大程度上是因为它基本上就是一个不带断言的集成测试。（`ActionDispatch::PerformanceTest`\
  \ 类是 `ActionDispatch::IntegrationTest` 的子类。）访问应用程序的所有集成测试语法在性能测试中都有效。因此，你的套件由一系列你认为对于整体感知应用程序响应情况关重要的页面视图组成。通常，这包括首页、任何其他非常重要的页面以及任何你认为可能是潜在问题的页面。对于我们一直作为示例的\
  \ Huddle 应用，一个可能的套件可能像这样：\n\n```ruby\ntest \"projects page\" do\n  get projects_path\n\
  end\n\ntest \"show a project\" do\n  get projects_path(:id => 1)\nend\n\ntest \"\
  status reports page\" do\n  get status_reports_path\nend\n```\n\n我目前正在强调两个非常重要的一点：用户登录的过程以及在生产测试期间数据库中存在数据的必要性。先想这里。\n\
  \n在你思考的同时，使用 `rake test:benchmark` 命令运行测试：\n\n```\n% rake test:benchmark\n```\n\n\
  ```\nBrowsingTest#test_homepage (92 ms warmup)\n  wall_time: 2 ms\n  memory: 0.00\
  \ KB\n  objects: 0\n  gc_runs: 0\n  gc_time: 0 ms\n```\n\n这只是输出的一部分；你会为类中的每个测试获得一个列表。`wall_time`\
  \ 是该测试期间实际通过的真实时间。你机器上运行的任何其他应用程序都会影响这个指标——关闭你的 Handbrake 视频转码可能是个好主意。\n\n\n\n\n\
  还有其他四个指标：测试期间分配的内存、测试期间分配的对象、Ruby 垃圾回收器调用的次数，以及在 Ruby 垃圾回收器花费的时间。目前这些数字都是 0。遗憾的是，这并不是因为我们创建了完美的内存使用应用程序，而是因为我们正在使用的\
  \ Ruby 版本没有对这些指标进行计数支持。\n\n要获取这些指标，你必须补丁你的 Ruby `1.8` 并重新编译。详细说明可以在 Rails Guides\
  \ 网站上找到：[`guides.rubyonrails.org/performance_testing.html#installing-gc-patched-ruby`](http://guides.rubyonrails.org/performance_testing.html#installing-gc-patched-ruby)。[[89]](#f_0156.html_FOOTNOTE-89)\n\
  \n除了控制台显示外，基准测试结果还存储在 `tmp/performance` 中的一系列 CSV 文件中——这是一个遗憾的选择，因为这些 CSV 文件实际上并不是临时的。你的性能测试套件中，每个单独的测试指标对应一个文件，或者每个单独的测试方法对应五个文件（GC\
  \ 运行、GC 时间、内存、对象和墙上时间）。每个文件都包含了测量数据，以及测试运行的时间、应用程序名称、Rails 版本和 Ruby 版本，如下：[[90]](#f_0156.html_FOOTNOTE-90)\n\
  \n|    | `measurement,created_at,app,rails,ruby,platform` |\n|    | `0.00452983379364014,2010-09-16T18:36:46Z,,3.0.0.beta4,ruby-1.8.7.174,`\
  \ |\n|    | `universal-darwin10.0` |\n\n这样做的好处是，当你再次运行套件时，Rails 只会将新行追加到同一个文件的末尾，这就是为什么它们不是真正的临时文件。CSV\
  \ 数据让绘图变得轻而易举，并非常容易显示随时间推移的性能趋势。\n\n当然，为了跟踪趋势，你实际上需要随时间运行测试，这需要一些规划和远见。一种可能性是将基准测试放在你的持续集成服务器上，并每晚左右运行一次基准测试。每日数据对于检测应用程序的部分性能何时缓慢变差非常有用。（如果你真的足够勇敢，你不会允许任何减慢基准测试的代码提交；我认为\
  \ WebKit 曾一段时间执行过这条规则。）然而，即使在重大更改之前运行一次基准测试，在之后再运行一次，也能让你确信应用程序性能正朝着正确的方向发展。\n\n\
  ### 性能分析测试 (Profile Testing)\n\n修复性能问题的问题之一是，并不总是清楚应用程序的哪个部分导致了瓶颈。这就是性能分析测试（profile\
  \ test）的用场。性能分析测试跟踪执行的代码并标记在每个方法中花费的时间。如何解释这些信息取决于你。\n\n运行性能分析测试很容易，只需使用 `rake`\
  \ 命令：\n\n```\nrake test:profile\n(in /Users/noel/Dropbox/pragprog/nrtest/Book/code/huddle3)\n\
  Loaded suite /Library/Ruby/Gems/1.8/gems/rake-0.8.7/lib/rake/rake_test_loader\n\
  Started\nBrowsingTest#test_homepage (97 ms warmup)\nprocess_time: 4 ms\nmemory:\
  \ unsupported\nobjects: unsupported\n```\n\n输出内容会继续下去，性能测试套件中的每个测试都有一个标题。注意，性能分析测试比基准测试慢得多——处理分析数据的账目工作增加了大量的开销。这就是性能分析测试只运行一次套件，而不是像基准测试那样运行四次的原因。\n\
  \n性能分析测试为每个单独的测试方法在 `test/performance` 生成三个文件。其中一个以 `_tree.txt` 结尾的文件旨在供一个名为 `kcachegrind`\
  \ 的独立图形化分析器使用。如果这个名字对你有意义，请尽管使用它——我们其他人将转向人类可读的文件。\n\n剩余两个文件中较易解释的是纯文本文件，它看起来大致如下（仅为文件开头，经过简单编辑）：\n\
  \n```\nThread ID: 2148237740\nTotal: 0.019577\n\n%self total self wait child calls\
  \ name\n3.91 0.00 0.00 0.00 0.00 367 Hash#[]\n3.39 0.00 0.00 0.00 0.00 54 Array#each\n\
  1.72 0.00 0.00 0.00 0.00 69 Class#new\n```\n\n表格的每行都有六列。\n\n\n\n\n你可能已经注意到这些示例中的一个问题是：性能测试越接近模拟生产环境，其意义就越大。在开发环境中模拟生产环境的服务器设置是困难的；如果你有资源创建一个适用于性能测试的阶段服务器（staging\
  \ server），那太棒了。数据库性能对数据量和分布特别敏感，你通常可以在开发环境中获得与生产环境数据相当的副本。\n\n一旦你拥有了足够的数据，问题就变成了如何让\
  \ Rails 使用该数据库。默认情况下，Rails 在 `test` 环境下运行性能测试，这意味着数据库会与你所有的其他测试共享，并在每次测试运行之前被清空——这两者对于性能测试来说都不特别有用。\n\
  \n这给你留下了两个选择。一种是在运行测试之前，将你的生产数据加载到测试环境中。虽然你可以在测试的设置部分（setup）中这样做，但可能创建一个单独的 `rake`\
  \ 任务或脚本来加载数据，然后根据需要调用 `rake test:benchmark` 或 `rake test:profile` 任务会更好。在 Stack\
  \ Overflow 上，一位名为 Chang 的用户指出，如果你使用 `SQLite3`，这简单只需要执行 `cp db/production.sqlite3\
  \ db/test.sqlite3` 即可，我认为这展现了一种务实主义的天赋。在 MySQL 中，你可以对数据库转储文件进行类似的操作，但对于较大的数据集来说，速度会有点慢。\n\
  \n另一个选项是在 `database.yml` 中创建一个完整的性能条目，并将其指向一个带有性能数据的数据库实例。然后，你需要让 Rails 在性能环境中运行你的测试。这需要一些小技巧，因为如果\
  \ Rails 发现环境不是 `test`，它将中止测试运行。\n\n尽管如此，这是可以做到的。创建一个 `test_helper.rb` 文件的副本，并将其命名为\
  \ `performance_test_helper.rb`。将文件的开头修改为如下所示：\n\n| `huddle3/test/performance_test_helper.rb`\
  \ | |\n| --- | `ENV[\"RAILS_ENV\"] = \"test\"` |\n| | `require File.expand_path('../../config/environment',\
  \ __FILE__)` |\n| | `require 'rails/test_help'` |\n| | `Rails.env = \"performance\"\
  ` |\n| | `ActiveRecord::Base.establish_connection` |\n\n文件的其余部分你可以保留，也可以舍弃——你可能不需要常规\
  \ `test_helper.rb` 中的所有内容来支持性能测试。我们正在做的是在测试环境中加载 Rails，然后切换到性能环境并重新连接到数据库，这指向了你在\
  \ `database.yml` 中为性能条目指定的数据库。这种方法行得通，但缺点是它会根据 `config/environments/test.rb` 的设置加载应用程序配置，因为\
  \ Rails 需要在测试环境中启动。在大多数情况下，这不应该是问题。你还需要将所有性能测试中的该行从 `require 'test_helper'` 改为 `require\
  \ 'peformance_test_helper'`。\n\n## 聚焦测试执行\n\n我承认，一次只运行其中一个测试这种“加速”你的测试套件的方法，就像把所有东西都推到桌子抽屉后面是一种整理计划一样——它在一段时间内确实有帮助，但最终你必须处理这些混乱。另一方面，从理论上说，纯属假设，你有一天可能会发现自己落入了一个项目，整个测试套件需要二十分钟才能运行完，而能够运行一组限制的测试就是决定你是今天完成该功能，还是在宇宙热死后的某个时刻完成的关键。\n\
  \n`Test::Unit`、`RSpec` 和 `Cucumber` 都有不同的机制允许运行小组测试测试。我们在其他章节中讨论过其中一些方法，但我想把它们都集中在这里。\n\
  \n在 `Test::Unit` 中，除了能够按类型拆分测试外，你还有以下选项：\n\n*   任何 `Test::Unit` 文件（技术上，任何引入 `test/unit`\
  \ 的文件）都可以通过作为 Ruby 脚本调用来单独运行，例如 `ruby -Itest test/unit/my_test.rb`。这允许你从 Rails 根目录运行测试。\n\
  *   Rails 提供了 `rake test:recent` 任务，它会查看过去十分钟内修改过的任何文件，并尝试运行其相关的测试文件。\n*   Rails\
  \ 提供了 `rake test:uncommitted` 任务，它会查看所有未提交的文件并尝试运行相关的测试文件。\n\n在 `RSpec` 中，你对最小测试运行的支持大部分来自使用\
  \ `rspec` 命令而不是 Rake 任务。你可以给 `rspec` 命令传递一系列参数，这些参数可以是 `RSpec` 文件或包含 `RSpec` 文件的目录。你可以通过命令行选项进行进一步过滤：\n\
  \n*   `-e` 或 `--example` 选项接受类似 `-e project` 的文本，将其转换为 Ruby 正则表达式，并运行任何完整描述匹配的 spec。\n\
  *   `-l` 或 `--line_number` 选项假设命令针对单个文件，且参数是一个数字。\n\n在 RSpec 2.0 中，单个 spec 可以用元数据（metadata）装饰，如果元数据足够，就可以限制范围。例如，一个\
  \ spec 定义可能如下：\n\n```ruby\nit \"does something cool\", cool: true do\nend\n```\n\
  \n在 RSpec 2.0 中，没有办法从命令行使用这些属性——该功能计划在随后的版本中发布，在收到关于人们如何使用它的反馈之后。然而，你可以进入 `spec_helper`\
  \ 并根据这些数据过滤运行。在 `RSpec.configure` 块中，你需要像下面这样的行：\n\n*   `c.filter_run cool: true`\n\
  *   `c.filter_run_excluding cool: true`\n\n使用 `filter_run` 会导致只有与键/值参数匹配的元数据的 spec\
  \ 或上下文运行。相反，`filter_run_excluding` 会运行所有匹配键/值参数以外的 spec。键值值对的值参数可以是 lambda 而不是静态值，这允许你根据运行时信息进行过滤。虽然缺乏命令行支持使得这个功能用起来有点别扭，但你可以做两件事来帮助。其一是\
  \ `run_all_when_everything_filtered` 属性，正如其名所示，它会改变 RSpec 的行为，使得如果描述的过滤器拦截了所有测试，RSpec\
  \ 将运行所有测试。换句话说，你可以像这样做：\n\n```ruby\nc.filter_run in_progress: true\nc.run_all_when_everything_filtered\
  \ = true\n```\n\n现在，如果有标记为 `in_progress` 标签的 spec，这些 spec 就会运行。但如果没有这样的标签，所有 spec\
  \ 都会被过滤，根据第二行代码，RSpec 然后将运行所有测试。这让你不必为了进行某些聚焦测试而不断更改 RSpec 配置。\n\n你也可以通过让过滤器使用可能在命令行设置的环境变量来模拟命令行支持。\n\
  \n```ruby\nif ENV[\"FOCUS_TESTS\"]\n  c.filter_run in_progress: true\nend\n```\n\
  \n然后可以像这样从命令行调用：\n\n```bash\nspec FOCUS_TESTS=true\n```\n\n\n\n\nCucumber 也有命令行机制，用于限制\
  \ Cucumber 运行期间执行的功能。`cucumber` 命令接受一个文件或目录作为其主参数。这可以进行扩展。\n\n- 如果在文件名后紧跟一个冒号和行号，则只运行该行对应的\
  \ feature。你可以使用多个行号，例如 `cucumber login.feature:12:35`。\n- Cucumber 允许你使用标签（tags）对测试进行注释，正如前文章节\
  \ 使用标签标记 Cucumber 特性 中的那样。该部分还展示了如何从命令行调用标签以及 `@wip` 标签的特殊状态。\n- 你可以指示 Cucumber\
  \ 创建一个失败的规格（specs）列表，以便下次运行时仅重新运行这些规格。此功能的命令行魔法有点深奥，因为管理此功能的失败测试输出被视为一种格式化器（formatter）。因此，命令是\
  \ `cucumber --format rerun --out rerun.txt`，但结尾的文件名是任意的。运行该测试后，你可以使用 `cucumber @rerun.txt`\
  \ 获取失败测试的信息并仅运行这些测试。Rake 任务 `rake cucumber:rerun` 是这种行为的快捷方式。\n\n## 使用 Autotest\n\
  \nAutotest 是一个非常简单的工具，如果你像我一样，它会很快变得不可或缺。它在类似于之前讨论的专注设置与接下来讨论的替代测试后台运行器之间的桥梁。当你运行\
  \ `autotest` 时，它会执行你所有的测试。之后，它会在后台运行。当你保存文件时，与该文件相关的测试将重新运行。如果你有一个或多个失败测试，这些测试将首先重新运行，当失败测试通过后，将重新执行整个测试套件以确认你的所有测试再次通过。\n\
  \n在 Rails 3 中，Autotest 位于你的 Bundler gem 文件的测试组：\n\n| | `gem` `'autotest'` |\n\n\
  如果你没有使用 `RSpec`，你可能还需要在 bundler 文件中使用 `autotest-rails` gem。无论你运行的是 `Test::Unit`\
  \ 还是 `RSpec`，请通过在 Rails 根目录下运行 `autotest` 来启动它[[96]](#f_0156.html_FOOTNOTE-96) Autotest\
  \ 将运行你来自 `test` 或 `spec` 目录的所有测试。曾有一段时间，Autotest 默认按随机顺序运行测试，但那似乎已不再是默认行为了。\n\n\
  测试运行后，Autotest 会等待。当你保存文件时，如果 Autotest 能够确定哪些测试与该文件相关，Autotest 将运行这些测试。对于控制器，它运行关联的功能测试；对于模型，它运行关联的单元测试。对测试文件的更改会运行该测试。对固件（fixture）文件的更改也会触发该模型的关联测试文件。编辑\
  \ `config` 或 `test_helper.rb` 文件会触发整个套件，对应用 helper 的更改通常也会触发许多测试。系统其他部分的编辑（如 helper\
  \ 文件或奇特目录中的文件）可能会被忽略，但你可以配置 Autotest 将任意文件映射到测试——稍后会详细介绍。\n\n如果你有失败的测试，Autotest\
  \ 的行为会发生微变化。所有失败测试的错误消息和堆栈跟踪出现在 Autotest 运行的最后。之后，如果你更改了与失败测试相关的任何文件，Autotest 会先运行失败测试。如果测试仍然失败，Autotest\
  \ 将停止。如果你更改了与失败测试无关的文件，Autotest 会运行与更改相关的测试，然后再次尝试失败的测试。任何新失败的测试都会被添加到失败测试列表中。在任何情况下，如果一次运行使得之前失败的所有测试都通过了，Autotest\
  \ 会自动运行整个测试套件以确保没有回归，尽管这种行为可以通过在启动 Autotest 时使用选项 `-c` 来关闭。\n\n### Mac  Autotest\n\
  \nAutotest 通过轮询操作系统文件更改来发挥魔力。缺点是即使在空闲时，它也可能相当消耗处理器。如果你使用 Mac OS X 10.5 或更高版本，可以使用\
  \ OS X FSEvent 库让 Autotest 接收文件更改通知而不是轮询。自然地，这消耗的处理器要少得多。要使用此，你需要安装 `autotest-fsevent`\
  \ gem。然后，在你的 `.autotest` 文件中添加 `require 'autotest/fsevent'` 行。fsevent 行必须是文件的最后一行。\n\
  \n在任何时候，你都可以按下 Ctrl-C 让 Autotest 重置当前失败测试列表，并从开始重新运行整个测试套件。连续按下两次 Ctrl-C 会退出 Autotest。\n\
  \n这就是 Autotest 表现卓越的地方。如果你正在进行类似常规 TDD 的操作，你会编写一个会失败的新测试，Autotest 会在你每次保存时不断重新运行该测试，直到测试通过。在最简单的层面上，这消除了在\
  \ IDE 或命令行中不断调用测试的需要。更有帮助的是，将测试套件限制在几个失败测试上可以带来更快的测试运行速度和对你的实际代码提供更快的反馈。\n\n稍微微妙一点，它让你更容易检查代码中发生了什么。我并不是一个真正喜欢\
  \ Rails 调试器的人，更倾向于使用基础的 print 语句来确定发生了什么。在失败模式下仅运行一两个测试的巨大优势在于，你可以肆无忌惮地在应用的任何地方放置\
  \ print 语句，因为你知道只会看到相关的输出。我曾在需要查找发生了什么时在 Rails 深处添加过 print 语句，这已为人所知，这一切在 Autotest\
  \ 中运行得非常顺畅。\n\n许多插件和钩子（hooks）可供你自定义 Autotest 的行为。Autotest 在你的用户目录或项目根目录下查找名为 `.autotest`\
  \ 的文件。\n\n如果你想让 Autotest 显示某些自定义行为，请添加事件处理块。基本形式如下：\n\n```\nAutotest.add_hook :waiting\
  \ do\n  puts\n  puts \"# 等待自 #{Time.now.strftime(\"%Y-%m-%d %H:%M:%S\")}\"\n  puts\n\
  end\n```\n\n上述实际上是 `autotest/timestamp.rb` 插件，你可以在 Ruby Gems 目录中的 ZenTest 目录找到它。第一行的\
  \ `:waiting` 是实际钩子，块将在钩子指示的时间执行。在这种情况下，当 Autotest 进入等待模式时，它会在控制台输出中添加时间戳，这有助于告诉你\
  \ Autotest 实际上已完成。\n\n可用的钩子有 `:all_good`, `:initialize`, `:interrupt`, `:quit`,\
  \ `:ran_command`, `:reset`, `:run_command` 和 `:waiting`[[97]](#f_0156.html_FOOTNOTE-97)\
  \ 大多数这些是自言易懂的。你在 Autotest 测试循环开始时获得 `:run_command`，在结束时获得 `:ran_command`。`:all_good`\
  \ 钩子在 Autotest 运行完整、干净的测试套件后运行。\n\n通常，你想做的是创建一个映射，以便 Autotest 将文件与特定的测试或一组测试关联。这里是\
  \ `auotest-rails` 插件中的一个示例，如果 Autotest 检测到它是从 Rails 应用启动，则该插件会自动调用：\n\n| add_mapping\
  \ %r%^app/models/(.*)\\.rb$% do |_, m| |\n| \"test/unit/#{m[1]}_test.rb\" |\n| end\
  \ |\n\n\n\n\n[content]\n`add_mapping` 命令接收一个正则表达式——这里使用自定义分隔符以避免转义路径名中的所有斜杠——以及一个块（block）。该块本身接收两个参数：匹配到的文件名和实际的正则表达式匹配对象。该块的返回值是一个文件名或文件名列表。你可以通过在块内部使用\
  \ `files_matching` 方法并将正则表达式作为参数，来获取匹配给定正则表达式的文件列表。当 Autotest 运行并检测到新保存的文件时，它会搜索通过\
  \ `add_mapping` 调用创建的映射。如果该文件匹配 `add_mapping` 的正则表达式参数，就会调用该块，并且由该块返回的测试文件或测试文件列表会被添加到待运行的测试文件列表中。\n\
  \n你也可以通过调用带有正则表达式参数的 `add_exception` 方法来指定某个文件不触发测试。任何匹配该正则的文件都不会触发测试，即使它们匹配了其他映射。\n\
  \nAutotest 自带了几个插件，可以通过在你的 `.autotest` 文件中引入（require）这些模块，将它们包含在本地 Autotest 运行中。以下是可用插件的部分列表（我们已经涵盖了\
  \ `autotest/timestamp`）。\n\n`autotest/autoupdate` 允许你在 Autotest 睡眠一段时间后运行任意命令，你可以通过在\
  \ `.autotest` 文件中设置 `Autotest::Autoupdate.update_cmd = whatever` 来管理它。默认命令是 `svn\
  \ up`——其设计目的是确保你的代码始终与仓库保持同步。\n\n许多插件支持各种通知。在 Mac OS X 上，`autotest/growl` 插件使用了流行的\
  \ Growl 通知工具。`autotest/jabber` 插件可以配置为通过 Jabber 发送 IM 消息。同样，`autotest/blame`（可以在\
  \ OS X 环境下配置使用 Adium 或 iChat）会发送一条包含你代码与测试用率的状态消息。如果你在 Linux/KDE 环境下，`autotest/kdenotify`\
  \ 插件使用 `knotify`。如果你在 Linux/GTK 上，请使用 `autotest/notify`。在 Windows 上，通知应用是 Snarl，插件是\
  \ `autotest/snarl`。\n\n`autotest/email_notify` 插件让你在 Autotest 完成运行后发送电子邮件，这听起来很有可能会让人反烦，但可能是持续集成环境的核心。\n\
  \n`autotest/heckle` 插件允许你指定在 Autotest 清理运行后通过 Heckle 变异测试器运行某些类。你可以使用 `autotest/rcov`\
  \ 插件在清理运行后自动运行 `rcov` 报告。\n\n几个插件支持不同的输出方式。`autotest/html_console` 插件会在你指定的目录中生成一个\
  \ HTML 文件。在 OS X 上使用 `autotest/pretty` 会给你提供一个小窗口，显示 Autotest 的运行历史，红色方块表示失败，绿色方块表示成功。`autotest/redgreen`\
  \ 插件根据成功或失败对 Autotest 报告着着。\n\n`autotest/menu` 插件提供了一个选项菜单，而不是不透明的 Ctrl-C 机制。\n\n\
  `autotest/migrate` 插件解决了一个微小的 Rails 痛点：在 autotest 启动时自动运行 Rails 数据库迁移。否则，你需要使用标准的\
  \ Rake 命令更新测试数据库。\n\n## 让你的测试更快\n\n提高测试性能可以采取的步骤可以分为两类：一类几乎总是好主意；另一类是以牺牲其他正面特性（通常是独立性或清晰度）为代价来加速测试——只有当出现显著的测试性能问题且与应用程序整体性能无关时，才应该这样做。\n\
  \nRSpec 提供了识别最慢测试的能力，这在你尝试加速测试套件时是一个非常实用的信息。在 RSpec 2.0 中，命令是 `rspec -f p`，在 RSpec\
  \ 1.3 中，命令是 `spec -f o`。\n\n加速测试的第一条原则是记住：Cucumber 和集成测试通常比控制器测试慢，因为它们会触发整个 Rails\
  \ 栈；而控制器测试又比模型测试慢，因为它们会触发部分 Rails 栈。所以，简单来说，一个快速的测试套件拥有大量的模型测试、少量控制器测试以及相对少的集成测试。\n\
  \n如果你遵循良好的 Rails “瘦控制器”设计，你可能不会有很多控制器测试，而且你有的测试也会经常与模拟对象（mock objects）交互，而不是真实的\
  \ ActiveRecord 对象。然而，如果你在验收测试驱动的过程中使用 Cucumber，你可能会得到很多相对较慢的 Cucumber 测试。考虑到在 Rails\
  \ 应用中，你可以在没有大量模型逻辑的情况下进展得很快，因此不需要大量的模型测试，这一点尤为如此。\n\n在模型和控制器测试中，你可以通过限制每个测试执行的操作量来控制速度。特别是，你希望减少与数据库的交互。在控制器测试中，这意味着模拟方法调用（mocked\
  \ method calls），这是没问题的，因为我们在控制器层面需要测试的大部分内容仅仅是调用了特定的模型方法。在模型测试中，这意味着创建测试所需的最小数量的对象，并在必要时不将模型对象保存到数据库中。ActiveRecord\
  \ 有时会让这成为一个挑战，因为关联依赖于 ID，而 ID 只有在对象保存时才会自动分配。\n\n在万不得的情况下，你可以通过显式分配 ID 来伪造已保存的对象，尽管我不建议养成这种习惯，因为这是危险的。如果你现有的测试向数据库保存了大量对象，并且不便于创建更少的对象或模拟对象，你可以通过重写或补丁（monkey-patching）`ActiveRecord::Base#columns`\
  \ 方法来中断正常的数据库交互。\n\n[/content]\n\n（注：由于提供的原始文本包含两段重复的 [content] 标记，且根据“不要重复输出原文”的原则，译文仅翻译了第一段完整文本内容。）\n\
  \n\n\n另一种加速测试的相当快速的方法与上下文（contexts）和单断言测试（single-assertion testing）有关。从审美上来说，我喜欢单断言测试，但不可否它可以减慢测试套件的速度。更准确地说，它通过多次运行设置（setup）可能会加剧结构不佳测试的影响。如果你有一系列带有某些设置操作的单断言测试，只需将它们合并回一个只执行一次设置块的单一测试中，你就能获得一些速度提升。\n\
  \n在 `RSpec` 中，你需要手动这样做，但如果你正在使用 `Test::Unit` 和 `Shoulda` 上下文，你可以使用 `fast_context`\
  \ gem。安装该 gem 后，你可以将任何对 Shoulda `context` 方法的调用替换为方法调用 `fast_context`，该 gem 将自动将该上下文内的所有测试合并为一个单一测试。\n\
  \n这可以给你带来巨大的速度提升。然而，这要求你所有的单断言测试实际上是相互独立的且没有副作用。但如果你一直遵循到目前为止的所有建议，你已经在这样做了。单断言测试在活跃开发期间非常好。但如果你遇到了速度问题，并想返回更新那些未处于活跃开发状态的代码部分以合并测试，那么对于低成本来说，这可能是一个巨大的速度胜利。\n\
  \n## 使用更快的测试运行器\n\n在某个时刻，你会达到通过更改测试内容或应用程序内容所能合理做的终点，是时候开始更改运行这些测试的上下文了。许多工具允许你更高效地利用机器资源，要么通过减少启动\
  \ Rails 环境的时间，要么允许你并行运行测试。我们在这里介绍其中一些工具，但此列表并不是详尽的；市面上有很多不同的工具。\n\n在我们深入研究各种测试服务器之前，值得提到的是，你可能通过更改\
  \ Ruby 版本就能获得速度提升。Ruby `1.9.2` 明显比 Ruby `1.8.7` 快，但 `1.9.2` 对于你的生产系统可能不可行。创建 `Phusion\
  \ Passenger` 的团队还创建了一个与 Ruby `1.8.7` 的解释器，称为 `Ruby Enterprise Edition` (`REE`)，它针对服务器使用进行了优化，并且比基础\
  \ Ruby `1.8.7` 使用内存内存。对于大多数 Ruby `1.8.7` 来说，转换为 `REE` 应该是简单的，你可以看到巨大的速度提升。`JRuby`\
  \ 因其整体性能也是一种可能，但 `JRuby` 对于 TDD 目的的缺点是它的启动时间非常慢，如果你每五分钟就要启动一次解释器来运行新测试，这可能会是一个问题。\n\
  \n这就引入了 `Spork`，它允许你保持 Ruby 解释器打开，并在解释器中运行 `RSpec` 和 `Cucumber` 测试而无需重启 Rails。这个名字可能来自“spec”和\
  \ `Spork` 在你运行测试时“派生”（fork）新进程的事实。\n\n在我写这里时，`Spork` 尚未完全集成 `RSpec 2`，但工作正在进行中，我预计\
  \ `Spork` 的安装过程不会发生本质变化。`Spork` 是一个 gem，对于 Rails 3，你需要在 `Gemfile` 的测试组中包含 `gem 'spork'`。\n\
  \n安装 gem 后，运行以下命令：\n\n```\nspork --bootstrap\n```\n\n引导 `Spork` 会将以下代码放入你的 `spec/spec_helper.rb`\
  \ 文件中：\n\n```ruby\n# huddle3_rspec2/spec/spec_helper.rb\nSpork.prefork do\n  # 在此块中加载更多内容将使你的测试运行更快。然而，\n\
  \  # 如果你更改此处加载的库的任何配置或代码，\n  # 你需要重启 spork 才能生效。\nend\n\nSpork.each_run do\n  #\
  \ 这段代码将在每次运行 specs 时都会运行。\nend\n```\n\n还有一些注释说明；让我们过一遍它们。`Spork` 有两种初始化方式。它在 `Spork`\
  \ 服务器启动时恰恰运行一个代码块且不再运行，然后每当 `Spork` 派生一个新的测试进程时，都会执行另一个代码块。`Spork` 希望你做的是将 `spec_helper.rb`\
  \ 文件中的所有项（除了加载 `Spork` 本身所需的两个 `require` 语句外）分成两堆中的堆。任何你想运行一次的代码都放在 `Spork.prefork`\
  \ 块中。你希望每次都执行的代码放在 `Spork.each_run` 块中。\n\n我真的指的是所有内容——其他的 `require` 语句、`RSpec.configure`\
  \ 块、你定义的任何辅助方法——都分成两堆中的堆。任何你想运行一次的代码都放在 `Spork.prefork` 块中。你希望每次都执行的代码放在 `Spork.each_run`\
  \ 块中。权衡是很简单的。\n\n一旦定义了这些块，使用以下命令启动 Spork 服务器：\n\n```\n$ spork\n```\n\n```\nUsing\
  \ RSpec\nPreloading Rails environment\nLoading Spork.prefork...\nNo server is running\n\
  Running locally:\nSpork is ready and listening on 989!\n```\n\n在 RSpec 侧，你需要在 `rspec.opts`\
  \ 文件中添加 `--drb`，或者在运行 specs 时作为命令行选项添加它。`Spork` 管理各种进程。\n\nCucumber 的用法类似。你可以通过在生成\
  \ Cucumber 文件的命令添加 `--spork` 来方便 `Spork` 的设置；相同的 `--drb` 会导致 Cucumber 搜索 `Spork`\
  \ 服务器。\n\n首先是 `parallel_tests`，你可以在 [`github.com/grosser/parallel_tests`](http://github.com/grosser/parallel_tests)\
  \ 找到。`parallel_tests` gem 支持创建多个测试环境来同时运行你的测试套件部分。它是一个 gem，所以在 Rails 3 中，你需要在 bundler\
  \ 文件中包含 `gem \"parallel_tests\"`。像 RSpec 一样，你希望将其放在开发和测试组中。\n\n安装 gem 后，你需要添加对多个测试数据库的支持。在\
  \ `database.yml` 中，通过附加如下环境变量来增强你的测试数据库名称：\n\n```yaml\ntest:\n  database: huddle_test\
  \ ENV['TEST_ENV_NUMBER'] %>\n```\n\n`database.yml` 文件在加载时通过 ERb 进行评估，测试编号会根据 `parallel_tests`\
  \ 管理它创建的各种测试进程获得相应的值。\n\n在更改 ERb 后，创建实际的数据库实例并将数据库架构加载到它们中：\n\n```bash\n% rake parallel:create\n\
  % rake parallel:prepare\n```\n\n\n\n然后你可以使用 `rake parallel:test` 运行 `Test::Unit`，使用\
  \ `rake parallel:spec` 运行 `RSpec`，以及使用 `rake parallel:features` 运行 `Cucumber`。如果你有多个\
  \ CPU，将启动多个并行测试进程来运行所有的测试。\n\n请注意，运行测试所需的总处理器时间并不会减少。实际上，它会增加，因为每个进程都需要自己的启动时间。然而，随着测试同时运行，实际经过的时钟时间（clock\
  \ time）应该会减少。但副作用之一是，测试运行期间你的机器会变得非常繁忙，所以如果你喜欢在测试运行期间检查邮件，请注意这会大大降低速度。此外，`Spork`\
  \ 和 `parallel_test` 完全不兼容——不要让它们一起运行。\n\n如果你正在寻找一种简单的方法将测试分发到你的网络中，`Specjour` 适用于安装了\
  \ `Bonjour` 协议的网络。`Specjour` 是一个 gem，因此通常将 `gem \"specjour\"` 写入 bundler 文件中。\n\n\
  要使用 `specjour`，请识别网络上可以运行测试的机器，并配置你的应用程序以允许这些测试运行。可用机器的发现由 `specjour` 自动管理。\n\n\
  设置一个工作节点就像执行 `specjour` 命令一样简单。工作节点并不一定与你的代码一起启动，因此你需要确保该机器上可以运行 `Ruby`，以及 `rsync`\
  \ 系统命令（它用于在文件之间移动文件）。\n\n在你实际的 `Rails` 项目中，按照之前之前为 `parallel_tests`指定的精确方式修改 `database.yml`。与\
  \ `parallel_tests` 不同，`specjour` 会为你创建并行数据库实例。然后运行 `rake specjour` 或 `rake specjour:cucumber`\
  \ 应该会启动 `specjour` 系统并在网络上搜索可用的工作节点。如果你只需要并行测试功能而不需要搜索网络的功能，可以让 `specjour` 在同一台机器上作为管理器运行。你也可以限制\
  \ `specjour` 只使用特定的 CPU 数量，或仅接受来自特定项目的请求。\n\n如果你需要更复杂的网络行为，请查看 `Hydra`，[`github.com/ngauthier/hydra/wiki`](http://github.com/ngauthier/hydra/wiki)，它提供了更大的灵活性。\n\
  \n缓慢的测试套件会摧毁 TDD，因为它让你难以以良好的 TDD 流程所需的频率运行测试。虽然性能问题没有一一不变的解决方案，但在应用程序代码或测试中，本章描述的选项应该为你诊断并采取步骤提高测试性能提供一个良好的开始。\n\
  \n# 最终……\n\n我一直尝试为测试驱动开发（TDD）推介绍最前沿、最灵活且最强大的工具和实践。从我第一次使用 `JUnit` 进行 TDD 已经已经十年了，我没有遇到过其他任何单一工具或创新能够提高我的代码质量以及我投入开发的时间质量。\n\
  \n这个领域的工具变化非常快，我确信当你读到这里时，书中的某些部分充其量说是过时的，最坏也是原始的。如果我能预判是哪些部分……我希望你在这里发现一些核心原则，无论你构建什么种应用程序或创建什么种工具，这些原则都将具有价值。迈出小步，先写代码，让代码和测试相互反馈。现在，去测试些东西吧。\n\
