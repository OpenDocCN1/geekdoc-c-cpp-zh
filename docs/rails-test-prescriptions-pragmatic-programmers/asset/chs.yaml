  \ 的提取需要在过滤器方法中完成。\n\n\n\n\n\n这些问题在`测试视图` 章节中有更完整的介绍，但在我们开始两组视图测试之前，有三点提示需要记住：\n\n\
  *   尽可能将视图逻辑移动到辅助函数（helpers）中。在 Rails 的核心核心设置中，单独测试一个 helper 比单独测试一个视图部分模板（view\
  \ partial）要容易得多（尽管如果你使用 `RSpec`，你可以直接测试视图部分模板——更多内容请参阅 `RSpec` 章节）。另一方面，将 HTML/ERb\
  \ 中的视图代码移动到 Ruby 方法中，可能会让只负责 Web 设计的团队拿着火炬和草叉来“找你算账”。所以，请小心。\n\n*   记住，视图测试的目的是让开发者验证应用程序的逻辑正确性。自动化视图测试并不能（在\
  \ Rails 中也无法）替代手动浏览网站并检查元素是否对齐以及外观是否美观。\n\n*   在语义层面进行测试，而不是在显示层面。为视图中的元素大量地分配 DOM\
  \ ID 和类名，并测试这些元素是否存在，而不是测试实际文本。显然，这是有限的；有时实际文本是至关重要的。但 DOM ID 测试的优势在于，每当内容团队更新文本或设计师更改\
  \ CSS 样式时，它都不会频繁报错。\n\n我们的第一个视图测试将仅仅验证表单元素是否如我们预期的那样存在，这意味着由控制器自动添加的属性应该不在表单中。使用\
  \ Rails 核心测试结构，此测试与控制器一起位于 `test/functional/status_reports_controller_test.rb` 中：\n\
  \n```\n| [huddle3/test/functional/status_reports_controller_test.rb](http://media.pragprog.com/titles/nrtest/code/huddle3/test/functional/status_reports_controller_test.rb)\
  \ |\n| Line 1  | `test \"new form has expected elements\" do` |\n| 2  | `get :new`\
  \ |\n| 3  | `assert_select \"form[id=new_status_report][action=/status_reports]\"\
  \ do` |\n| 4  | `assert_select \"#status_report_project\", :count => 0` |\n| 5 \
  \ | `assert_select \"#status_report_user\", :count => 0` |\n| 6  | `assert_select\
  \ \"textarea#status_report_today\"` |\n| 7  | `assert_select \"textarea#status_report_yesterday\"\
  ` |\n| 8  | `assert_select \"#status_report_status_date_1i\", :count => 0` |\n|\
  \ 9  | `end` |\n| 10 | `end` |\n```\n\n这是一个相当直接的视图测试，它在第 2 行模拟了对新状态报告表单的 `GET` 请求，然后使用\
  \ `assert_select` 验证调用输出的几个功能。`assert_select` 方法有大约七十到十一种不同的选项，所有选项在`测试视图` 章节中都有详尽的说明。目前，记住\
  \ `assert_select` 的第一个参数是 CSS 选择器，而剩余参数是关于输出中元素的断言。对于我们的目的，最实用的选项是 `:text`，它匹配字符串或正则表达式。另一个实用的选项是\
  \ `:count`，它是视图中匹配选择器的数量。如果指定了 `:count`，预期是至少有一个匹配。如果指定了 `:count` 和 `:text`，预期是匹配该选择器且文本的数量。你也可以使用块来嵌套\
  \ `assert_select` 调用；这增加了对选择器内部的断言约束。在之前的测试中，外层的 `assert_select` 匹配一个 `form` 标签。具体来说，我们正在测试该\
  \ `form` 标签内是否存在项目、用户或任何类型的日期标签，以及是否存在昨天和今天状态报告字段的文本区域标签。\n\n关于这些测试的精确结构可能会有一些争论。我们选择根据\
  \ DOM ID 来测试字段，因为这样配合 `assert_select` 语法更好。仍然，一个违反 Rails 规范的程序员可能会在不触发视图测试的情况下导致\
  \ bug。尽管如此，追踪视图损坏的方式将耗尽我们所有的精力。\n\n## 测试项目：级联测试\n\n在 Huddle 中，项目页面应该显示状态报告的时间线。这至少需要控制器和一个视图测试，我们之后可能会使用一些模型。\n\
  \n### 测试视图\n\n为了测试视图，我们需要固定数据（fixtures）。在 `test/fixtures/projects.yml` 中添加以下内容来创建项目：\n\
  \n```\n| [huddle3/test/fixtures/projects.yml](http://media.pragprog.com/titles/nrtest/code/huddle3/test/fixtures/projects.yml)\
  \ |\n| huddle: |\n| name: Huddle Project |\n```\n\n我们还需要一些状态报告，位于 `test/fixtures/status_reports.yml`：\n\
  \n```\n| [huddle3/test/fixtures/status_reports.yml](http://media.pragprog.com/titles/nrtest/code/huddle3/test/fixtures/status_reports.yml)\
  \ |\n| one_tue: |\n| project: huddle |\n| user: one |\n| yesterday: Worked on Huddle\
  \ UI |\n| today: Doing some testing |\n| status_date: 2009-01-06 |\n| one_wed: |\n\
  | project: huddle |\n| user: one |\n| yesterday: Did Some Testing |\n| today: More\
  \ Testing |\n| status_date: 2009-01-07 |\n|\n\n| two_tue: |\n| project: huddle |\n\
  | user: two |\n| yesterday: set up huddle schema |\n```\n\n\n\n\n\n| | `today:`\
  \ `pair programming with one` |\n| | `status_date:` `2009-01-06` |\n| | |\n| | `two_wed:`\
  \ |\n| | `project:` `huddle` |\n| | `user:` `two` |\n| | `yesterday:` `sick` |\n\
  | | `today:` `trying to pair again` |\n| | `status_date:` `2009-01-07` |\n\n我们可以开始使用这些固定数据进行测试了。`show`\
  \ 的控制器方法应该收集该项目的报告并按日期进行分组。\n\n这部分放入 `test/functional/projects_controller_test.rb`\
  \ 中：\n\n| `huddle3/test/functional/projects_controller_test.rb` |\n\n| 行 | 代码 |\n\
  | :--- | :--- |\n| 1 | `test \"project timeline index should be sorted correctly\"\
  \ do` |\n| 2 | `set_current_project(:huddle)` |\n| 3 | `get :show, :id => projects(:huddle).id`\
  \ |\n| 4 | `expected_keys = assigns(:reports).keys.sort.map{ |d| d.to_s(:db) }`\
  \ |\n| 5 | `assert_equal([\"2009-01-06\", \"2009-01-07\"], expected_keys)` |\n|\
  \ 6 | `assert_equal(` |\n| 7 | `[status_reports(:one_tue).id, status_reports(:two_tue).id],`\
  \ |\n| 8 | `assigns(:reports)[Date.parse(\"2009-01-06\")].map(&:id))` |\n| 9 | `end`\
  \ |\n\n在第 4–5 行中，这部分代码断言创建了一个名为 `@reports` 的对象，并且它的键是找到的报告日期。第 6–8 行断言每个键都包含其报告，并按用户名称排序（严格从技术上讲，是按用户的电子邮件——我们目前还没有在用户模型中使用名称字段）。\n\
  \n当然，该测试将会失败，因为 `assigns(:reports)` 是 `nil`。\n\n回到控制器本身，让我们先将赋值留给模型。在 `app/controllers/projects_controller.rb`\
  \ 中：\n\n| `huddle3/app/controllers/projects_controller.rb` |\n\n| | 代码 |\n| :---\
  \ | :--- |\n| `def show` |\n| `@project = Project.find(params[:id])` |\n| `@reports\
  \ = @project.reports_grouped_by_day` |\n| `respond_to do |format|` |\n| `format.html\
  \ # show.html.erb` |\n| `format.xml { render :xml => @project }` |\n| `end` |\n\
  | `end` |\n\n这意味着我们现在需要在 `test/unit/project_test.rb` 中需要一个模型测试了：\n\n| `huddle3/test/unit/project_test.rb`\
  \ |\n\n| | 代码 |\n| :--- | :--- |\n| `test \"should be able to retrieve projects\
  \ based on day\" do` |\n| `actual = projects(:huddle).reports_grouped_by_day` |\n\
  | `expected_keys = actual.keys.sort.map{ |d| d.to_s(:db) }` |\n| `assert_equal([\"\
  2009-01-06\", \"2009-01-07\"], expected_keys)` |\n| `assert_equal([status_reports(:one_tue).id,\
  \ status_reports(:two_tue).id],` |\n| `actual[Date.parse(\"2009-01-06\")].map(&:id))`\
  \ |\n| `end` |\n\n这是直接复制了我们刚刚在控制器测试中放入的代码，这引发了我们是否同时需要控制器测试和模型测试的问题。模型测试很重要，因为它最接近实际实现，并且编写错误用例测试最简单的地方。控制器测试仅仅增加了一个信息，即模型方法确实是被控制器调用的——严格来说，控制器测试不需要重新验证模型逻辑。如果你愿意，可以潜在地从控制器测试中移除模型特定的断言。这在控制器中是一个使用\
  \ mock 对象（模拟对象）调用的经典位置，它可以防止控制器测试依赖于模型中的特定代码。mock 对象本身是一个非常大的话题，将在章节 *Using Mock\
  \ Objects* 中进行详细介绍。对于我们目前的用途来说，重复测试并不是问题。\n\n无论如何，通过此测试需要一些代码。在 `app/models/project.rb`\
  \ 中：\n\n| `huddle3/app/models/project.rb` |\n\n| `has_many :status_reports` |\n\
  | `def reports_grouped_by_day` |\n| `status_reports.by_user_name.group_by(&:status_date)`\
  \ |\n| `end` |\n\n之前，这里是空的：对 `has_many` 的需求来自于测试。这里有两个重叠的问题：框架何时了何时进行测试，以及何时测试私有方法。指南是，只有当应用程序发生变化时，才需要编写新测试。例如，如果我们从一个大方法中重构出一个小方法，我们就不需要再针对这个小方法编写测试——因为它已经通过测试了。如果子方法以后获得了额外的逻辑，我们需要为它编写测试。\n\
  \n实际方法使用了 `group_by`，它返回一个哈希值。`by_user_name` 作用域按用户排序。随着工作的进行，我发现 `by_user_name`\
  \ 的复杂性足以需要它自己的测试。在 `test/unit/project_test.rb` 中：\n\n| `huddle3/test/unit/project_test.rb`\
  \ |\n\n| `test \"by name sort as expected\" do` |\n| `reports = StatusReport.by_user_name`\
  \ |\n| `expected = reports.map { |r| r.to_s(:db) }` (等等，逻辑检查) |\n| `assert_equal([\"\
  2009-01-06\", \"2009-01-07\"], expected_keys)` |\n| `end` |\n\n`app/models/status_report.rb`\
  \ 中的作用域如下：\n\n| `huddle3/app/models/status_report.rb` |\n\n| `scope :by_user_name,\
  \ :include => \"user\",` |\n| `:order => \"users.email ASC\",` |\n| `:conditions\
  \ => \"user_id IS NOT NULL\"` |\n\n并且所有测试均通过。\n\n\n\n\n\n|  | `assert_select` `\"\
  div[id *= day]\"`, `:count => 2` |\n|  | `assert_select` `\"div#2009-01-06_day\"\
  ` `do` |\n|  | `assert_select` `\"div[id *= report]\"`, `:count => 2` |\n|  | `assert_select`\
  \ `\"div#?\"`, `dom_id(status_reports(:one_tue))` |\n|  | `assert_select` `\"div#?\"\
  `, `dom_id(status_reports(:two_tue))` |\n|  | `end` |\n|  | `assert_select` `\"\
  div#2009-01-07_day\"` `do` |\n|  | `assert_select` `\"div[id *= report]\"`, `:count\
  \ => 2` |\n|  | `assert_select` `\"div#?\"`, `dom_id(status_reports(:one_wed))`\
  \ |\n|  | `assert_select` `\"div#?\"`, `dom_id(status_reports(:two_wed))` |\n| \
  \ | `end` |\n|  | `end` |\n\n继续视图层语义化级别测试的想法，此测试检查了每天是否都有某种 `div` 标签，并且在该标签内部是否为每个状态报告都有一个标记好的\
  \ `div` 标签。即使是使用 `div` 也可能过于具体了——这些可能是表格行（table rows）或其他内容。`count` 测试是为了防止显示的内容比预期的多，而这是仅通过测试已知标签的存在是无法捕获的。在这种情况下，我们还测试了恰好有两天的报告，并且每天都有两份报告。这是为了匹配我们刚刚设置的固件数据（fixture\
  \ data）而校准的，并让我们快速了解固件的一个缺点——对该固件数据的更改可能会破坏此测试。\n\n此外，为了使其生效，请在 `test/test_helper.rb`\
  \ 的类定义内部添加此行：\n\n| [huddle3/test/test_helper.rb](http://media.pragprog.com/titles/nrtest/code/huddle3/test/test_helper.rb)\
  \ |\n|  | `include ActionController::RecordIdentifier` |\n\n这允许我们在测试中使用 `dom_id`\
  \ 方法，这非常方便。\n\n暂忽略视图代码有无数种方式可以通过此测试的表面要求但违背其初衷，以下是可以通过测试的视图的基本结构，位于 `app/views/projects/show.html.erb`：\n\
  \n| [huddle3/app/views/projects/show.html.erb](http://media.pragprog.com/titles/nrtest/code/huddle3/app/views/projects/show.html.erb)\
  \ |\n|  | `<h2>`Status Reports for <%= @project.name %>`</h2>` |\n|  | `<% @reports.keys.sort.each\
  \ do |date| %>` |\n|  | `<div id=\"<%= date.to_s(:db) %>_day\">` |\n|  | `<h3>`Reports\
  \ for <%= date.to_s(:long) %>`</h3>` |\n|  | `<% @reports[date].each do |report|\
  \ %>` |\n|  | `<div id=\"<%= dom_id(report) %>\">` |\n|  | `Yesterday I: <%= report.yesterday\
  \ %>` |\n|  | `Today I will: <%= report.today %>` |\n|  | `</div>` |\n|  | `<% end\
  \ %>` |\n|  | `</div>` |\n|  | `<% end %>` |\n\n这为视图的每个日期提供了一个 `div`，并为每个单独的报告提供了一个嵌套的\
  \ `div`。\n\n## 到目前，一切良好\n\n此时，我们已经完成了 Rails 测试驱动开发（TDD）的初步演示。你应该能够为 Rails 应用添加测试；使用固件数据；测试你的控制器、模型和视图；并且感受到\
  \ DD 快速测试/代码反馈循环在实践中是如何运作的。\n\n书的其余部分根据测试应用程序的部分进行划分。第二部分处理测试 ActiveRecord 模型，通过固件和工厂将数据引入测试，以及其他数据相关主题。第三部分讨论了控制器、视图和辅助函数的测试，每一者都有一些特殊的机制来使过程变得更容易。\n\
  \n大型第三方测试框架 Shoulda 和 RSpec 将在第四部分讨论，而第五部分涵盖集成测试，包括使用 Rails 本身以及使用 Webrat 和 Cucumber\
  \ 等外部工具。最后，第六部分将介绍如何使用覆盖率测试、管理性能和排排除故障来评估和改进你的测试。\n\n### 脚注\n\n| [[21]](#f_0029.html_FNPTR-21)\
  \ | `assert_select` 的一个方便特性是它可以解析... |\n| [[22]](#f_0029.html_FNPTR-22) | 在此阶段，我们已经完成了初步演示...\
  \ |\n| [[23]](#f_0029.html_FNPTR-23) | 继续视图层语义化级别测试的想法... |\n| [[24]](#f_0029.html_FNPTR-24)\
  \ | 此外，为了使其生效，请在内部添加... |\n| [[25]](#f_0029.html_FNPTR-25) | 暂忽略视图代码有无数种方式... |\n\
  | [[26]](#f_0031.html_FOOTNOTE-26) | 这允许我们使用 `dom_id` 方法... |\n| [[27]](#f_0039.html_FOOTNOTE-27)\
  \ | 这为视图的每个日期提供了一个 `div`... |\n\n\n\n\n\n*   有一些不为人知的数据库辅助方法，你可以通过让测试用例成为 `ActiveRecord::TestCase`\
  \ 的子类来获取它们：`assert_date_from_db`、`assert_sql`、`assert_queries` 和 `assert_no_queries`。这些方法在\
  \ Rails 核心测试系统内部使用，在核心之外似乎没有太大价值。\n*   `test/test_helper.rb` 是所有 Rails 生成的模型测试所需的，也是你应用程序的一部分，它向\
  \ `ActiveSupport::TestCase` 注入了一些额外方法。这是放置所有测试所需的通用设置方法和断言方法的好地方。\n\n## 在模型测试中测试什么\n\
  \n模型。下一个问题是？\n\n## 好了，幽默先生，什么是良好的模型测试类？\n\n目标是让每个模型的独立测试文件覆盖该模型中近乎 100% 的代码。其他模型或控制器测试可能会无意中触及模型中的代码，但这不能替代在模型自身的测试文件中对特定模型进行有效测试。测试应该尽可能贴近所描述的代码。\n\
  \n你不需要为 `belongs_to` 或 `has_many` 等关系的存在编写单独的测试——Rails 会彻底测试这些功能，如果你没有预期的关系，你会发现到处都是测试失败。关系的存在应该由一个需要该关系来实现某个功能的测试来驱动。你应该编写测试来覆盖验证（validations），以确保有效对象与无效对象之间的差异你的预期。命名作用域（Named\
  \ scopes）介于关系和方法之间。简单的命名作用域可能被视为关系处理，但任何复杂的——例如带有 `lambda` 块的——都应该被测试。关于这一点，请见 *Testing\
  \ Active Record Finders* 章节。\n\n你需要多少个测试？严格的测试驱动答案是，所有新逻辑都应该由一个失败的测试驱动，反之，每个新测试都应该失败并触发一段新的代码逻辑。典型的进展如下（如果你保持方法更小、更简单，你倾向于每个方法需要更少的测试）：\n\
  \n*   一个针对正常路径（happy-path）情况的测试。\n*   针对代码中每个备选分支的测试。在这里进行重构通常会导致方法被拆分为多个更小的方法。\n\
  *   针对已知的错误情况至少一个测试，例如传递了 `nil` 参数（视需要而定）。我的观点（可能有点固执）是，只有当你确实需要错误情况来执行某些特定操作，或者理由怀疑预期的错误情况没有真的被视为错误处理时，才应该包含它。\n\
  \n保持每个单独测试的短小。在许多情况下，你只需要为单元测试创建一个单一模型对象。在开始编写测试之前，列出所有你想测试的情况可能对你有帮助。这很好，但你仍然希望一个接一个地编写并通过测试。\n\
  \n如果对方法的单一调用会导致模型发生多次变化，那么将所有断言放在同一个测试中也是可以的；你不需要做一个纯主义者，坚持在测试方法中只保留一个断言。在这个来自跟踪系统的示例中，将故事标记为完成会触发方法中的几种不同的变化。将这些断言每一个放在不同的测试中可能会很笨拙且难以追踪。\n\
  \n## 断言差异，或无差异\n\nRails 为基础单元测试添加的两个断言是常见测试模式的强大替代方案。以下测试断言在调用 `create` 之后，用户比之前多了一个：\n\
  \n```ruby\ntest \"creating creates a user\" do\n  pre = User.count\n  User.create(first_name:\
  \ \"Noel\")\n  post = User.count\n  assert_equal(pre + 1, post)\nend\n```\n\n使用\
  \ `assert_difference`，测试可以无需重复调用 `User.count`：\n\n```ruby\ntest \"creating creates\
  \ a user\" do\n  assert_difference 'User.count' do\n    User.create(first_name:\
  \ \"Noel\")\n  end\nend\n```\n\n`assert_difference` 的第一个参数是 Ruby 代码字符串。该字符串的值使用\
  \ `eval` 计算。块中的代码被执行，字符串的值被重新计算。默认情况下，预期是新值比旧值大一，但你可以通过传递第二个参数来调整这一点，例如 `assert_difference(\"\
  User.count\", 0)` 来断言没有变化，或者 `assert_difference(\"User.count\", -1)` 来断言删除了一个用户。\n\
  \n如果你想检查多个代码段，有两种选择。`assert_difference` 的调用可以嵌套：\n\n\n\n\n\n|   | `test` `\"create\
  \ a user and a log entry\"` `do` |\n|   | `assert_difference` `'User.count'` `do`\
  \ |\n|   | `assert_difference` `'LogEntry.count'` `do` |\n|   | `User.create(:first_name\
  \ => \"Noel\")` |\n|   | `end` |\n|   | `end` |\n|   | `end` |\n\n或者，如果所有代码片段的差异数量相同，可以将片段以列表的形式传入：\n\
  \n|   | `test` `\"creating creates a user\"` `do` |\n|   | `assert_difference ['User.count'`,\
  \ `'LogEntry.count']` `do` |\n|   | `User.create(:first_name => \"Noel\")` |\n|\
  \   | `end` |\n|   | `end` |\n\n最后，`assert_no_difference('User.count')` 是 `assert_difference('User.count',\
  \ 0)` 的语法糖。\n\n## 测试 Active Record Finders\n\n在 Rails 3 中，你可以将各个数据库逻辑编写成独立的方法并任意组合它们。例如，如果你经常发现自己需要按电子邮件地址排序的用户、所有活跃用户的列表，或者在数据库查找调用中仅获取五个用户，你可以将所有这些都写成单独查找方法（finder\
  \ methods）：\n\n```ruby\ndef self.by_email\n  order(\"email ASC\")\nend\n\ndef self.active_only\n\
  \  where(:active => true)\nend\n\ndef self.limit_to(x)\n  limit(x)\nend\n```\n\n\
  这些方法可以像任何其他的 ActiveRecord `find` 命令一样使用。\n\n`User.by_email`\n`User.active_only`\n\
  `User.limit_to(5)`\n\n但最好的部分是这些方法可以组合，这为你提供了一种非常易读的方式来表达复杂的数据库查询：\n\n`User.active_only.by_email.limit_to(5)`\n\
  \n因此，能够组合这种逻辑是非常棒的。但这些方法处于你可能编写的方法与 Rails 核心功能之间尴尬的位置，这导致了一个问题：如何才能测试你放置在命名作用域（named\
  \ scope）声明中的功能。以下是一些指南。\n\n类查找器（Class finders）通常在重构步骤中被提取。在这种情况下，你可能不需要任何新测试来覆盖该作用域——就像重构中提取的其他方法一样，它没有发生逻辑变化，因此对于\
  \ TDD 目的，原始测试已经覆盖了它。尽管如此，如果查找方法所在的类与原始方法不同，那么将处理该作用域的测试逻辑转移到新类中的测试通常是有用的。\n\n在测试任何数据库查找行为时，你想要避免的陷阱是测试对数据库\
  \ SQL 调用的性质，而不是调用的结果。换句话说，提取命名作用域对象在连接数据库时将使用的参数并不困难。然而，仅仅测试你的方法最终带有 `{:active =>\
  \ true}` 作为其查找参数实际上对你没有任何帮助。仅仅测试参数无法说明任何实际的数据库行为，而实际行为才是你通常想要验证的。\n\n以下方法可能会很有帮助；它可以用于测试任何从数据库中提取一组记录的方法（这意味着它无法帮助测试那些仅影响（例如，输出排序顺序）的方法）。该方法使用\
  \ Shoulda 语法，并将待测试的查找方法作为符号、传递给该方法的任何参数，以及一个块（block）：\n\n[`huddle/test/test_helper.rb`](http://media.pragprog.com/titles/nrtest/code/huddle/test/test_helper.rb)\n\
  \n```ruby\ndef self.should_match_find_method(named_scope, *args, &block)\n  should\
  \ \"match a find method #{named_scope}\" do\n    ar_class = self.class.model_class\n\
  \    found_objects = ar_class.send(named_scope, *args)\n    assert !found_objects.blank?\n\
  \    found_objects.each do |obj|\n      assert block.call(obj)\n    end\n  end\n\
  end\n```\n\n\n\n\n随着时间的推移，对固定场景（fixtures）的热情会逐渐消退，但固定场景仍然是向测试导入数据的一种快速且方便的方法。在本章中，我们将讨论如何使用固定场景，然后讨论固定场景的问题。固定场景的缺点已经通过各种使用工厂模式（factory\
  \ pattern）来创建数据对象的工具得到了解决。我们将讨论这些工厂工具，以及使用它们与使用固定场景的区别。\n\n## 定义固定场景数据\n\n固定场景（fixture）是在测试开始时已知已存在的基线或固定状态。固定状态的存在使得我们能够编写基于该特定数据集的假设并进行测试。在\
  \ Rails 中，开箱即用的固定场景定义在一组 YAML 文件中，这些文件会被自动转换为 `ActiveRecord` 对象并为每个测试加载。\n\n在通常情况下，应用程序中的每个模型都将有一个关联的固定场景文件。固定场景文件采用\
  \ YAML 格式，这是一种数据描述格式，通常用作比 XML 更易于输入的替代方案。[[32]](#f_0052.html_FOOTNOTE-32) 关于 YAML\
  \ 语法的详细细节完全超出了本书的范围，而且与固定场景基本没有关系——YAML 包含许多我们这里不需要关注的高功能。\n\n固定场景文件中的每个条目都以该条目的标识符开头，随后是该条目的属性。此示例包含了两个假设的\
  \ `User` 类条目，将位于 `test/fixtures/users.yml` 中：\n\n| 行 1 | `fred:` |\n| 行 2 | `first_name:`\
  \ `Fred` |\n| 行 3 | `last_name:` `Flintstone` |\n| 行 4 | `email:` `fflint@slaterockandgravel.com`\
  \ |\n| 行 5 | |\n| 行 6 | `barney:` |\n| 行 7 | `first_name:` `Barney` |\n| 行 8 | `last_name:`\
  \ `Rubble` |\n| 行 9 | `email:` `brubble@slaterockandgravel.com/` |\n\nYAML 语法与 Python\
  \ 有某些相似，无论是使用冒号分隔键值对（这也是 `Ruby 1.9` 的特性），还是使用缩进来标记每个条目的边界。第 6 行 `barney:` 向外缩进两个空格，这告诉\
  \ YAML 解析器一个新的条目已经开始。字符串不需要包含在引号中，尽管如果你觉得这样更易读这样做也没有处。[33]](#f_0052.html_FOOTNOTE-33)可以通过在属性名所在的行放置管道符（`|`）来指定多行字符串。可以在后续几行中编写多行字符串；每一行必须相对于属性名所在的行进行缩进。再次，向外缩进表示字符串的结束。\n\
  \n| | `fred:` |\n| | `first_name:` `Fred` |\n| | `last_name:` `Flintstone` |\n|\
  \ | `description:` `&#124;` |\n| | `Fred is very tall.` |\n| | `He is not very small.`\
  \ |\n\nRails 的固定场景创建过程使用数据库中的信息将值强制转换为类型。我使用 SQL 格式（yyyy-mm-dd）编写日期，尽管任何 Ruby 的\
  \ `Date.parse` 可读取的格式都可以生效。\n\n引入每个记录的标识符随后被用于在测试中访问各个固定场景条目。假设这是 `User` 类，你将能够在整个测试套件中通过\
  \ `users(:fred)` 和 `users(:barney)` 分别检索这些条目。除非你喜欢去猜 `users(:user_10)` 有什么特殊，否则我建议有意义的条目名称，特别是对于暴露特殊情况的条目：`users(:user_with_no_first_name)`。\n\
  \n允许通过实例变量访问固定场景（在这种情况下为 `@fred` 和 `@barney`）的旧机制可以通过在 `test/test_helper.rb` 文件中设置\
  \ `self.use_instantiated_fixtures = true` 来开启。这种风格已被弃用；因为它慢，而且当加载所有固定场景时，它要求所有的固定场景条目在所有类中具有不同的名称。然而，该功能仍然存在，你可能会在（非常）旧的遗留代码中看到它的使用。\n\
  \n与创建 `ActiveRecord` 普通方式不同，YAML 数据直接转换为数据库记录，而不通过标准的 `ActiveRecord` 创建方法。（明确一下，当你在测试中使用这些数据时，它们是\
  \ `ActiveRecord` 模型——只有在向数据库创建数据的原始过程中跳过了 `ActiveRecord`。）这意味着你不能像在 `create` 调用中那样，将模型的任意方法作为固定场景中的属性。固定场景属性必须是实际的数据库列或在模型中显式定义的\
  \ `ActiveRecord` 关联。从模型中删除数据库列并忘记将其从固定场景中移除，是导致你的每一个测试都报错的好方法。固定场景加载机制还跳过了你在 `ActiveRecord`\
  \ 上创建的任何验证，这意味着除非你自己显式测试每个固定场景，否则无法保证加载时固定场景数据的有效性。\n\n你不需要为固定场景指定 `id`（尽管如果你想指定可以）。如果你不显式指定\
  \ `id`，系统将为你生成 `id`。如果你显式指定了 `id`，则它将根据另一个模型的名称生成。如果关系是 `belongs_to`，可以使用标识符引用另一个对象：\n\
  \n| | `fred:` |\n| | `first_name:` `Fred` |\n| | `last_name:` `Flintstone` |\n|\
  \ | `company:` `slate` |\n\n并且我们有一个 `belongs_to company` 的模型，那么我们可以在 `user.yml`\
  \ 中这样做：\n\n| | `fred:` |\n| | `first_name:` `Fred` |\n| | `last_name:` `Flintstone`\
  \ |\n| | `company:` `slate` |\n\n如果关系是 `has_many`，关系中的多个值可以作为逗号分隔的列表指定。即使对象是通过连接表\
  \ `has_and_to_many` 的也是如此，尽管 `has_many :through` 关系需要显式指定连接模型。\n\n固定场景文件也被解释为 ERb\
  \ 文件，这意味着你可以拥有这样的动态属性：\n\n| | `fred:` |\n| | `last_login_time:` `<%= 5.days.ago\
  \ %>` |\n\n或者你可以动态地指定多个条目，如下：\n\n| | `<% 10.times do &#124;i&#124; %>` |\n| | `task_<%=i%>:`\
  \ |\n| | `name:`\"Task <%= i\"` |\n| | `<% end %>` |\n\n在第二的情况下，注意标识符仍在最左列；你不能像普通\
  \ Ruby 风格建议的那样对块内部缩进。\n\n\n\n\n默认情况下，固件（fixtures）只会被加载一次，每个测试方法都在一个数据库事务中运行。在测试方法结束时，事务会被回滚，从而恢复初始的固件状态。这极大地缩短了测试时间\
  \ [35]，除非你的数据库不支持事务（可能是因为你正在使用带有 MyISAM 表的 MySQL）。\n\n如果你试图测试应用程序中的事务行为，固件事务也会成为一个问题，因为固件事务会覆盖你正试图测试的事务。如果你需要不那么频繁的事务行为，可以进入\
  \ `test/test_helper.rb` 文件，并将赋值语句 `self.use_transactional_fixtures = true` 的值改为\
  \ `false`。这将更改所有测试的值，但你也可以通过在单个类中包含该赋值（设置为 `false`）来按类重写该值。目前没有方法可以将这种行为细粒化到仅对单个方法使用非事务行为。\n\
  \n# 为什么固件是令人头疼的\n\n尽管固件在刚开始时非常好用，但在复杂项目中长期使用它们会暴露出问题。以下是一些需要注意的事项。\n\n### 固件是全局的\n\
  \n默认的 Rails 应用中只有一组固件。因此，每当你需要一个边界情况（corner case）时，想要向固件集中不断添加新数据点的诱惑几乎是不可抵抗的。问题在于，每当你因为需要测试“左撇子用户给一个住在斐济且有朋友关系的用户发送消息会发生什么”或者你需要的任何奇怪场景而添加一个用户时，其他测试都必须处理该数据点作为测试数据一部分的情况。\n\
  \n### 固件是分散的\n\n固件存储在自己的目录中，每个模型都有自己的固件文件。这没问题，直到你开始需要管理连接，并且一个简单的“用户对特定文章发表评论”的设置就会迅速跨越四个不同的固件文件，且没有简单的方法来追踪这些关系。在代码结构方面，我非常推崇“小而多”优于“大而少”，但即使我也觉得固件太分散了。\n\
  \n### 固件是遥远的\n\n如果你基于特定的固件组合进行复杂的测试，你通常会发现最终数据是基于固件设置的，以至于在阅读测试时，并不清楚最终值究竟是如何推导出来的。你需要回到固件文件来理解计算过程。\n\
  \n### 固件是脆弱的\n\n当然，一旦你把那个左撇子用户添加到固件集中，你就保证会破坏任何依赖于整个用户群精确构的测试——搜索和报告测试是这方面的臭名昭首。没有什么比这更能消灭团队测试热情的方法了：每当你添加新的样本数据时，都要在地球另一端修复二十五个测试。\n\
  \n听起来很糟糕，对吧？其实并非如此。固件不仅适用于简单项目，Rails 社区还通过创建可以替代固件来创建测试数据的工厂工具，响应了固件的缺陷。\n\n# 使用工厂修复固件\n\
  \n固件替换系统的目标是将固件的三个最大问题——全局性、分散性和脆弱性——转变为优势。我们希望系统具备以下特性：\n\n*   **本地化（Local）**：每个单独的测试都应该根据该测试的需求调整设置数据。设置数据应该尽可能接近实际测试。\n\
  *   **紧凑性（Compact）**：设置数据应该易于且快速地生成；否则懒惰的程序员（像我）就不会去做。只需几行代码就能生成复杂的对象网络。\n*   **健壮性（Robust）**：测试不应该依赖于其他测试对设置数据所做的更改。我们甚至可以在当前测试中指定更多数据而不破坏其他测试。\n\
  \n泛而言之，固件问题的答案是数据工厂（data factory）。\n\n# 数据工厂\n\n数据工厂的理念是，与其精确地指定所有测试数据，不如提供一个创建模型示例实例的蓝图。当你为特定测试需要数据时，调用一个工厂方法，它会根据你的蓝图给你一个元素。你可以重写蓝图，以指定让测试运行所需的任何数据属性。调用工厂方法足够简单，使得在每个测试中设置有用量的数据变得可行。\n\
  \n最初的工厂工具是 Scott Taylor 的 FixtureReplacement (`http://replacefixtures.rubyforge.org/`)。最近，开发\
  \ Shoulda 和其他优秀工具的 ThoughtBot 团队提供了 `factory_girl` (`http://github.com/thoughtbot/factory_girl/tree/master`)。我也喜欢\
  \ Pete Yandell 的 `Machinist` (`http://github.com/notahat/machinist/tree/master`)。\n\
  \n这三个工具的基础结构相似。每个工具都为你提供了用于创建工厂蓝图的语法和用于创建新对象的 API。`factory_girl` 和 `Machinist` 还提供了根据模式创建唯一值流的机制，而\
  \ `FixtureReplacement` 具有最灵活的创建语法。\n\n本章将使用 `factory_girl` 作为工厂工具工作原理的主要示例。具体来说，我们将使用\
  \ `factory_girl` 2.0，在我写时它正处于 beta 版本。我选择 `factory_girl` 是因为它显然已成为这些工具中的思想领导者。`Machinist`\
  \ 同样处于 2.0 beta 版本，具有类似的语法和结构，而 `factory_girl` 1.3 在功能上相似，但语法更冗长。\n\n## 安装 factory_girl\n\
  \n要在 Rails 3 项目中安装 factory_girl，你应该通过在 Gemfile 中放置以下内容来安装 `factory_rails` gem：\n\
  \n```ruby\ngem 'factory_rails'\n```\n\n然而，如果你尝试在 2.0 仍在 beta 阶段时安装 factory_girl，目前有一点版本小问题，因为\
  \ `factory_rails` gem 绑定了 1.3 版本。幸运的是，有一些 `factory_rails` gem 的分支更新了它的 gem 依赖项。例如：\n\
  \n```ruby\ngem 'factory_rails', :git => \"http://github.com/CodeMonkey/factory_rails.git\"\
  \n```\n\n如果你在 Rails 2.x 应用中工作，只需执行以下操作：\n\n```ruby\ngem 'factory_girl'\n```\n\n\
  或者，当 factory_girl 仍在 beta 阶段时，你需要直接从 GitHub 获取 beta 版本，因为 Rails 扩展是针对 Rails 3 的：\n\
  \n```ruby\ngem 'factory_girl', :git => 'http://github.com/thoughtbot/factory_girl.git'\n\
  ```\n\n在 Rails 3 中，如果安装了 factory_girl，它会自动加载。自动加载的工厂文件：`test/factories.rb`, `spec/factories.rb`,\
  \ `test/factories/*.rb`, `spec/factories/*.rb`。在任何其他地方定义的工厂需要显式地引入程序。\n\n## 创建和使用简单工厂\n\
  \n你所有的工厂定义都位于 `FactoryGirl.define` 的调用中，该方法接收一个块（block）。在该块内部，可以声明工厂以定义默认数据。工厂接受一个块，你可以在其中按属性定义默认值。\n\
  \n对于我们的 Huddle 网络，一个非常简单的示例可能如下；每个属性都有一个简单的默认值。我们稍后讨论关联。默认情况下，蓝图位于 `test/factories.rb`。\n\
  \n```ruby\nFactoryGirl.define do\n  factory :project do\n```\n\n\n\n\n| | `name`\
  \ `\"Dog Meet Dog Dot Com\"` |\n| | `start_date { Date.parse(\"2009-01-23\") }`\
  \ |\n| | `end` |\n| | `end` |\n\n注意这里没有等号——这些并不是赋值。从技术上讲，它们是函数调用，所以如果写成 `name(\"\
  Dog Meet Dog Dot Com\")` 会更具可读性，请尽管这样做。\n\n在上一个工厂中，所有值都是静态的，并且在工厂文件加载时就已经确定。如果你希望在创建单个工厂对象时确定一个动态值，只需传递一个块（block）而不是值；该块会在每次调用新工厂时被求值。\n\
  \n| | `FactoryGirl.define do` |\n| | `factory :project do` |\n| | `name` `\"Dog\
  \ Meet Dog Dot Com\"` |\n| | `start_date { Date.today - rand(50) }` |\n| | `end`\
  \ |\n| | `end` |\n\n你还可以在工厂的后续部分引用之前赋值的值，这正是这些工厂开始变得强大的地方：\n\n| | `FactoryGirl.define\
  \ do` |\n| | `factory :project do` |\n| | `name` `\"Dog Meet Dog Dot Com\"` |\n\
  | | `url { \"#{name.downcase.gsub!(\" \", \"_\")}\" } }` |\n| | `end` |\n| | `end`\
  \ |\n\n这种做法的好处在于，即使你自己传递了名称，工厂仍然会使用 name 属性中的值来计算 URL：\n\n| | `test \"factory girl\
  \ url\" do` |\n| | `soup = Factory.create(:project, :name => \"Soups Online\")`\
  \ |\n| | `assert_equal(\"soups_online\", soup.url)` |\n| | `end` |\n\n在工厂内部，你可以调用模型中任何具有设置方法（setter\
  \ method）的属性；换句话说，模型中的任何虚拟属性（例如 Devise `User` 模型中的 `password` 属性）都是可以使用的。\n\n你可以通过多种方式使用此工厂。最常见的方法是使用\
  \ `Factory.create` 方法。\n\n```\nsetup do\n  @project = Factory.create(:project)\n\
  end\n```\n\n对 `create` 的此调用将使用工厂文件中定义的默认值创建一个 `Project` 实例，并将其保存到数据库中。`ActiveRecord`\
  \ 模型上的验证会被调用。（具体来说，`factory_girl` 会在返回对象之前对其调用 `save!`。）\n\n`factory_girl` 提供了其他三种构建策略，如果你不想实际上向数据库中保存新记录，可以使用它们。如果你需要一个真实的\
  \ `ActiveRecord` 实例但不保存，请调用 `Factory.build(:project)`。`Factory.attributes_for(:project)`\
  \ 调用不会创建 `ActiveRecord` 对象；它只是返回一个由工厂定义的属性哈希。这对于用于在控制器测试中模拟 HTTP `POST` 请求。你也可以尝试\
  \ `Factory.stub(:project)`，它会返回一个属性被创建为存根（stubs）的对象。如果你使用存根版本，那么任何尝试通过该对象访问数据库的调用（例如调用\
  \ `save`）将导致错误。\n\n在正常情况下，`factory_girl` 将 `create` 视为默认值，并提供了快捷方式 `Factory(:project)`。你可以基于类来更改默认策略，但我并不建议这样做；可读性的混淆不值得为了稍微短一点的语法而牺牲。\n\
  \n当你调用工厂时，可以通过向 `factory_girl` 创建方法传递哈希来覆盖任何默认值，如下：\n\n```\nsetup do\n  @project\
  \ = Factory.create(:project, :name => \"Soups Online\")\n  @other_project = Factory.create(:project,\
  \ :name => \"Google Thumbnail\")\nend\n```\n\n## 唯一属性的序列\n\n通常情况下，你需要在工厂中拥有一个唯一的属性值，即使你指定了多个对象。电子邮件地址就是一个常见的例子，因为许多应用程序要求电子邮件地址是唯一的以便验证。虽然你可以在每次调用\
  \ `User` 工厂时显式地指定电子邮件地址，但这是一个容易出错且令人痛苦的问题。你可以在 `factory_girl` 中通过序列（sequences）来避免这个问题。\n\
  \n声明序列非常简单。序列定义在主 `FactoryGirl` 块内部，接收一个参数，该参数在每次调用序列时都会递增。\n\n| | `FactoryGirl.define\
  \ do` |\n| | `sequence :name do |n|` |\n| | `\"Project_#{n}\"` |\n| | `end` |\n\
  | | `end` |\n\n可以显式引用序列：\n\n| | `factory :project do` |\n| | `name { FactoryGirl.next(:name)\
  \ }` |\n| | `url { \"#{name.downcase.gsub(\" \", \"_\")}\" }` |\n| | `end` |\n\n\
  但如果属性与序列同名，`factory_girl` 提供了一个隐式快捷方式：\n\n| | `factory :project do` |\n| | `name`\
  \ |\n| | `url { \"#{name.downcase.gsub(\" \", \"_\")}\" }` |\n| | `end` |\n\n如果序列只在一个地方使用，你可以在使用它的工厂内部声明它：\n\
  \n| | `factory :project do` |\n| | `sequence(:name) { \"Project_#{n}\" }` |\n| |\
  \ `url { \"#{name.downcase.gsub(\" \", \"_\")}\" }` |\n| | `end` |\n\n## 关联自由\n\n\
  在工厂中指定关联对象很容易。在这个示例中，`Project` 类的工厂通过显式指出用户是一个关联来调用 `User` 工厂创建关联对象。（在一对多关系中，你可能希望在\
  \ `belongs_to` 这一侧这样做。在多对多关系中，哪一侧创建项并不重要。）但你确实需要只有一侧创建项；否则，你可能会得到循环依赖和堆栈过深异常。此示例还使用了\
  \ `Faker` 库来生成结构化数据。\n\n| | `factory :user do` |\n| | `first_name { Faker::Name.first_name\
  \ }` |\n| | `last_name { Faker::Name.last_name }` |\n| | `end` |\n\n| | `factory\
  \ :project do` |\n| | `name \"Dog Meet Dog Dot Com\"` |\n| | `association :user,\
  \ :factory => :user` |\n| | `end` |\n\n你可以通过将值添加到 `association` 调末尾来像其他工厂调用一样为子对象指定值。在代码段中，从关联创建的每个用户的名字都为\
  \ `Noel`。\n\n| | `factory :project do` |\n| | `name \"Dog Meet Dog Dot Com\"` |\n\
  | | `association :user, :factory => :user, :first_name => \"Noel\"` |\n| | `end`\
  \ |\n\n如果工厂名称和关联名称匹配，可以省略工厂名：\n\n| | `factory :project do` |\n| | `name \"Dog Meet\
  \ Dog Dot Com\"` |\n| | `association :user` |\n| | `end` |\n\n如果你遵循 Rails 规范，且模型名称与属性名称匹配，工厂可以进一步简化：\n\
  \n| | `factory :project do` |\n| | `name \"Dog Meet Dog Dot Com\"` |\n| | `user`\
  \ |\n| | `end` |\n\n在任何情况下，通过 `factory_girl` 创建 `Project` 对象都会隐式地创建、验证并保存 `User`\
  \ 对象。与普通属性一样，关联对象的值可以在后续属性块可用：\n\n```\nfactory :project do\n  name \"Dog Meet Dog\
  \ Dot Com\"\n  user\n  label { \"#{user.first_name}'s project\" }\nend\n```\n\n\
  你可以像在工厂中定义的任何其他属性一样，传递你自己的关联对象。这就是创建多个兄弟对象的方法：\n\n```\nsetup do\n  me = Factory(:user,\
  \ :first_name => \"Noel\", :last_name => \"Rappin\")\n  my_project = Factory(:project,\
  \ :user => me)\n  my_other_project= Factory(:project, :name => \"Soups Online\"\
  , :user => me)\nend\n```\n\n\n\n\n\n如果你不想创建相关的对象，在调用 `make` 时需要显式地将对象设置为 `nil`：\n\
  \n| � | `Factory(:project, :user => nil)` |\n\n你经常会发现自己想要从同一个类创建多个工厂。例如，代表不同角色或不同产品类别的用户……之类的。你可以使用\
  \ `class` 选项轻松地指定一个与工厂名称不同的类名。\n\n| � | `factory :cool_project, :class => Project\
  \ do` |\n| � | `end` |\n\n你还可以让一个工厂继承另一个工厂，这样就可以避免在每个工厂中重复指定共同的默认值。\n\n| � | `factory\
  \ :project do` |\n| � | `name \"Dog Meet Dog Dot Com\"` |\n| � | `user` |\n| � |\
  \ `label { \"#{user.first_name}'s project\" }` |\n| � | `end` |\n| � | `factory\
  \ :cool_project, :parent => :project do` |\n| � | `label { \"A really nifty project\"\
  \ }` |\n| � | `end` |\n\n在这个代码段中，`cool_project` 工厂同样拥有默认的 `user` 和默认名称“Dog Meet\
  \ Dog Dot Com”。就我个人而言，我不认为属性的重复繁琐到需要牺牲可读性来避免——想象一下，如果 `project` 和 `cool_project`\
  \ 工厂在工厂文件中隔了 300 行，而你正试图追溯名称值是从哪里来源的。\n\n最后，`factory_girl` 允许你通过定义回调方法在工厂被调用后指定任意操作，这些回调方法可以是\
  \ `after_build`、`after_create` 或 `after_stub`。这些方法接收一个块（block），并在工厂使用指定的构建策略被调用后执行，尽管使用\
  \ `create` 调用工厂会同时触发 `after_build` 和 `after_create` 回调。回调块接受一个可选参数，即已完全创建的工厂对象。\n\
  \n## 世界工厂大统一：防止工厂滥用\n\n在将项目从固件（fixtures）转换为工厂（factories）时，人们的诱惑是将整个固件设置复制到工厂对象中。你会获得一些好处：工厂对象可能比固件更易阅读和维护，而且你所有的现有测试都能通过。然而，工厂测试的速度可能比事务性固件慢得多，而且你仍然面临全局性、远端数据定义的问题——尽管至少使用工厂，新测试可以避免使用全局数据。\n\
  \n使用工厂的方法是为每个测试创建更少的数据。在每个测试中，只创建暴露问题所需的最少数据。这种做法可以加快测试，让问题一目易见，而不是埋没在几十个固件中，并使更容易验证测试本身的正确性。\n\
  \n## 工厂与 RESTful 身份验证\n\n通常用于管理用户登录的 RESTful Authentication gem 在使用工厂时，会有几个细微的测试陷阱（gotchas）。\n\
  \n首先，RESTful Authentication 生成的 `UserTest` 类包含一个名为 `create_user` 的私有方法。如果你正在使用 `FixtureReplacement`，这将与从你的\
  \ `User` 类蓝图中自动创建的用户生成方法发生冲突。在这种情况下，你可以更改 `UserTest` 类中的方法名称，调整调用它的测试，然后继续即可。\n\n\
  更泛地说，RESTful Authentication 提供了固件形式的测试用户账户。如果你确实要避免使用固件并且使用的是旧版本的 RESTful Authentication，那么你可能会在\
  \ RESTful Authentication 提供的 `login_as` 方法上遇到问题，该方法在整个测试中用于设置已登录的用户。`login_as` 方法期望接收符号（symbol），并使用基于固件的\
  \ `users(:symbol)` 方法查找用户数据。即使你将 RESTful Authentication 的固件数据转换为基于工厂的设置方法（这样做很有用，因为\
  \ RESTful Authentication 账户有已知的加密密码），你仍然需要更改 `lib/authenticated_test_helper.rb`\
  \ 中的 `login_as` 方法，使其接收一个真实的 `User` 对象而不是符号：\n\n| � | `def login_as(user)` |\n|\
  \ � | `@request.session[:user_id] = user ? user.id : nil` |\n| � | `end` |\n\n然后你可以像下面的代码一样配合工厂使用它：\n\
  \n| � | `setup do` |\n| � | `login_as(User.make(:role => \"admin\"))` |\n| � | `end`\
  \ |\n\n## 管理日期和时间数据\n\n日历逻辑名之其实归是程序中不涉及 Unicode 的最令人烦恼的部分之一。测试日历逻辑——基于时间的报告、自动注销、“1\
  \ 天前”的文本显示——可能会令人头疼，但你可以做几件事来简化这个时间逻辑怪兽。\n\n### 你的方法不对\n\n想象一下。。你有一个包含一些项目的 YAML\
  \ 文件：\n\n| � | `runway:` |\n| � | `name: Project Runway` |\n| � | `start_date: 2010-01-20`\
  \ |\n| � | `greenlight:` |\n| � | `start_date: 2010-02-04` |\n| � | `gutenberg:`\
  \ |\n| � | `start_date: 2010-01-31` |\n\n你想测试一些基于时间的代码，比如在 `test/unit/project_test.rb`\
  \ 中：\n\n```ruby\ntest \"reports based on date\" do\n  actual = Project.find_started_in(6.months)\n\
  \  assert_equal(3, actual)\nend\n```\n\n这里是能让测试通过的代码，位于 `app/models/project.rb`：\n\
  \n```ruby\ndef self.find_started_in(time_span)\n  old_time = Date.today - time_span\n\
  \  all(:conditions => [\"start_date > ?\", old_time.to_s])\nend\n```\n\n在 2010 年\
  \ 1 月 20 日，测试通过了。在 21 日也会通过……但在六个月后，在 6 月 20 日，当你可能已经忘记了这个测试、这些数据甚至这个项目时，测试突然失败了。你会花费大量时间试图发生了什么，直到你想起日期问题，并意识到\
  \ 1 月 20 日的项目离开了六个月的范围。当然，更改所有日期只是把问题推后了，让你又有时间再次忘记它。\n\n这个问题对某些人来说听起来很幼稚，但就像书中许多荒谬的例子一样，这是一个曾经发生在我身上并可能浪费大量时间的错误。\n\
  \n很久以前，当我年轻且愚蠢时，我通过为每个使用 `Date.today` 的方法添加可选参数来解决这个问题，允许传递一个可选的时间并使用显式日期。这工作量比实际需要的得多，所以这里有几个更好的主意。\n\
  \n### 固件中的相对日期\n\n正如在“更多信息：将数据导入测试”部分提到的，固件文件在加载之前会作为 ERb 文件进行求值。对于我们的目的来说，这很有用，因为它允许我们动态地指定日期，如下：\n\
  \n| � | `runway:` |\n| � | `name: Project Runway` |\n| � | `start_date: <%= Date.today\
  \ - 1.month %>` |\n| � | `greenlight:` |\n| � | `start_date: <%= Date.today - 1.week\
  \ %>` |\n| � | `gutenberg:` |\n| � | `start_date: <%= Date.today - 1.day %>` |\n\
  \n使用这样编写固件，之前的测试将始终有效，因为项目的 `start_date` 永远不会超出六个月的范围。（如果你使用工厂工具而不是固件，你可以在你的工厂蓝图中进行类似的操作。）\n\
  \n\n\n\n\n尽管这种技术在保持测试数据与测试时间之间的相对距离一致方面非常有效，但如果你实际上是在尝试测试某个日期的精确值——例如在测试输出显示时——它的帮助就不那么大了。使用第一种静态的固件数据（fixture），你可以编写如下代码：\n\
  \n|   | `test` `\"that project dates are displayed in this goofy format\"` `do`\
  \ |\n|   | `assert_equal(\"2010 1 January\", projects(:runway).goofy_start_date)`\
  \ |\n|   | `end` |\n\n如果你不明确项目 `start_date` 的值，编写这个测试将会困难得多。但请继续读下去。\n\n### 显式时间戳\n\
  \n测试日期时，一个值得提的技巧是显式设置你的 `ActiveRecord` 模型的 `created_at` 属性。通常，`created_at` 是由 `Rails`\
  \ 自动生成的时间戳，它通常用于本节其他部分提到的那种基于时间的报告。由于它是按照当前时间自动创建的，如果指定了过去的其他日期，你可能会遇到一些奇怪的情况。即使没有这种复杂性，你可能仍然需要显式设置\
  \ `created_at` 以使用该属性来测试基于时间的功能。\n\n你可以像设置其他属性一样在固件文件中设置 `created_at`，也可以在 `ActiveRecord::create`\
  \ 或 `ActiveRecord::new` 中指定，在工厂蓝图中指定，或者简单地通过赋值或 `update` 方法进行重置。\n\n设置 `updated_at`\
  \ 则更为棘手。在正常情况下，如果你尝试显式设置 `updated_at`，`Rails` 会在保存时自动将其重置，这完全违背了初衷。要改变这种行为，在保存具有修改更新时间的对象之前，设置类变量\
  \ `Model.record_timetamps = false`。不要使用 `Model`，而是使用实际正在保存的模型类。保存后，通过 `Model.record_timestamps\
  \ = true` 恢复正常。\n\n> 请参考 [`www.neeraj.name/blog/articles/800-override-automatic-timestamp-in-activerecrod-rails`](http://www.neeraj.name/blog/articles/800-override-automatic-timestamp-in-activerecrod-rails)\
  \ 了解如何使用 Ruby Eigenclasses 让这种调用更友好一些的方法。\n\n### Timecop\n\n最近，我一直在使用由 John Trupiano\
  \ 编写的名为 `Timecop` 的优秀 gem 来解决时间问题，你可以在 [`github.com/jtrupiano/timecop`](http://github.com/jtrupiano/timecop)\
  \ 找到它。`Timecop` 可以通过传统的 `gem \"timecop\"` 放在 Bundler `Gemfile` 中。\n\n`Timecop` 本质上是一个非常特定的\
  \ mock 对象包：它存根了 `Date.today`、`DateTime.now` 和 `Time.now`，允许你显式设置测试的有效日期。使用 `Timecop`，原始测试可以重写如下：\n\
  \n|   | `test` `\"reports based on start date\"` `do` |\n|   | `Timecop.freeze(Date.parse(\"\
  2010-02-10\"))` |\n|   | `actual = Project.find_started_in_last(6.months)` |\n|\
  \   | `assert_equal(3, actual.size)` |\n|   | `end` |\n\n`Timecop.freeze` 命令将当前日期和时间方法桩（stub）回作为参数传递的日期——在本例中，为\
  \ 2010 年 2 月 10 日。在测试期间，时间不会移动。另一个方法 `Timecop.travel` 会重置时间，但允许系统时间从该点开始向前移动。\n\n\
  为什么需要两个选项？因为在测试的整个生命周期内保持时间不变会让测试环境更一致。（例如，RESTful 身份验证如果时间在一次测试期间以恰恰的方式滚动，就会出现间歇性测试失败。）但有时，时间需要向前移动，所以\
  \ `Timecop` 提供了这两个选项。类似，有时在设置（setup）方法中放置以下代码行是有用的：\n\n|   | `Timecop.freeze(Date.today)`\
  \ |\n\n并在清理（teardown）块中使用以下代码行：\n\n|   | `Timecop.return` |\n\n为什么？它确保了在每个测试期间当前时间不会改变。同样，对于某些与时间相关的问题，这种一致性可以消除间歇性测试失败的可能来源或纯粹的困惑。\n\
  \n`freeze` 或 `travel` 的参数是 `Date`、`DateTime`、`Time` 的实例，或者一系列形式为 `(year, month,\
  \ day, hour=0, minute=0, second=0)` 的参数。这两个方法也接受块，使得伪时间仅在块持续期间有效：\n\n|   | `test`\
  \ `\"reports based on start date\"` `do` |\n|   | `Timecop.freeze(Date.parse(\"\
  2010-02-10\")) do` |\n|   | `actual = Project.find_started_in_last(6.months)` |\n\
  |   | `assert_equal(3, actual.size)` |\n|   | `end` |\n\n### 比较日期和时间\n\nRuby 并不满足于简单的日期时间系统，它有三个独立的类来管理日期和时间。`Time`\
  \ 类是对语言几乎暴露的相同 C 库的薄封装。（座右铭：“自 1983 年以来一直困扰程序员！”）还有 Ruby 特有的类 `Date` 和 `DateTime`，它们更灵活且具有更连贯的\
  \ API，但速度较慢。对于测试目的，相关的要点是 `ActiveRecord` 根据底层数据库列的具体情况使用 `Date` 和 `DateTime`；将 `Date`\
  \ 实例与 `DateTime` 实例比较将始终失败（尝试相加或相减也是如此），而且大多数 Rails ActiveSupport 方法（例如 `5.days.ago`）返回\
  \ `DateTime`。\n\n在测试中，这可能会导致许多令人恼的失败，特别是当你有一个没有时间信息的 `Date` 列时——如果时间不重要，这是推荐的。通常情况下，通过使用\
  \ `to_s(:db)` 转换它们来比较日期和时间是一个好主意。它避免了对象相等这个令人讨厌的问题，你往往会获得更可读的测试和错误信息。当时间对象的精确时间产生疑问时，尝试通过使用\
  \ Rails ActiveSupport 方法 `to_date`、`to_time` 和 `to_datetime` 来强制执行。最常见的情况是类似于 `5.days.ago.to_date.to_s(:db)`\
  \ 的写法，这读起来可能有点笨拙，但这是一个健壮的测试并带有良好的错误消息。\n\n## 模型数据总结\n\n总结，Rails 提供了固件（fixtures）作为一种极其简单的方法，用于创建多个测试共享的测试数据。然而，固件过于简单，往往无法适应更复杂的业务需求。工厂工具（factory\
  \ tools）需要稍微多的初始设置，但在牺牲某些测试性能的代价下提供了更高的灵活性。这两种结构并不互斥。结合它们的一种模式是在固件中恰好创建一个复杂的场景，以用于集成测试或复杂的控制器测试，并在单元测试或简单的控制器测试中使用工厂。\n\
  \n\n\n\n\n固定场景（Fixtures）和工厂工具（factory tools）允许你将测试数据导入数据库，以便为测试创建一个已知的基准线。然而，在某些情况下，你可能并不想实际将数据放入数据库中。出于性能考虑，在测试中使用数据库可能是不可取的；或者出于哲学考虑（某些人认为在“单元”测试中接触数据库是不合理的）；或者是由于逻辑原因导致对象难以创建。在下一章中，我们将探索模拟对象（mock\
  \ objects），它们允许测试通过伪造产生数据的实际方法调用而非数据本身来继续进行。\n\n### 脚注\n\n| | | |\n| :--- | :---\
