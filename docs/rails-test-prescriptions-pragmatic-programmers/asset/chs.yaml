  \ Ruby 特征类（Eigenclasses）让此类调用更友善的一些方法。 |\n\nCopyright © 2011, The Pragmatic Bookshelf.\n\
  \n# 第 7 章：使用模拟对象\n\n模拟对象（mock object）是一种在自动化测试目的中用于替代“真实”对象的“伪造”对象。当真实对象不可用或在测试环境中难以访问时，可能会使用模拟对象——一个常见的例子是外部信用卡支付系统。模拟对象也可能用于轻松地重新特定的应用程序状态，这些状态在测试环境中通常很难触发，例如数据库或网络故障。可以策略性地使用模拟对象将测试范围限制在特定待测的对象和方法上。这样使用时，模拟对象驱动了一种不同的测试风格，即测试验证的是系统在测试期间的行为，而不是测试结束时系统的状态。\n\
  \n## 什么是模拟对象？\n\n处理模拟对象的一个复杂性因素是，几乎每个创建模拟框架的人都觉得完全可以采用与其他人略有不同的命名规范。以下是我使用的名称，它们当然——也是正确的名称。[[37]](#f_0061.html_FOOTNOTE-37)\n\
  \n任何作为其他对象替代品的对象的通用术语是“测试替身”（test double），这类比于“特技替身”（stunt double），并具有相同的含义，即作为更昂贵的真实对象的廉价或更具针对性的替代品。在口语中，“模拟对象”（mock\
  \ object）也被用作通用术语，但令人混淆的是，它也是特定类型测试替身的名称。\n\n存根方法（stub）是一个伪造对象，它在不调用实际对象的情况下，为方法调用返回一个预定的值。我们可以如下所示创建一个存根（这使用了\
  \ Ruby 的 gem Mocha，但你现在还不需要担心具体的语法）：\n\n```\nthing.stubs(:name).returns(\"Fred\"\
  )\n```\n\n那行代码表示，如果你调用 `thing.name`，你将得到 `Fred` 作为结果。至关重要的是，实际的 `thing.name` 方法没有被触碰，因此无论“真实”方法返回什么值都不重要；`Fred`\
  \ 响应来自存根，而不是实际对象。如果在测试中没有调用 `thing.name`，则什么都不会发生。\n\n模拟对象（mock）与存根类似，但除了返回伪造值外，模拟对象还设置了一个可测试的期望，即被替换的方法在测试中实际上会被实际调用。如果方法没有被调用，模拟对象将触发测试失败。因此，当你编写以下代码段创建模拟对象而非存根时：\n\
  \n```\nthing.expects(:name).returns(\"Fred\")\n```\n\n那么如果你在测试中调用了 `thing.name`，你仍然得到\
  \ `Fred`，并且实际的 `thing.name` 方法仍然没有被触碰。但如果你在测试中没有调用 `thing.name`，测试将失败，并产生通常被称为 `MockExpectationError`\
  \ 或类似的错误。\n\n换句话说，在方法上设置存根（stub）是被动的，它只是说：“忽略此方法的真实实现并返回此值”，而在方法上设置模拟（mock）则更具攻击性，它说：“此方法将返回此值，你最好调用这个方法，否则！”\n\
  \n你可能设置这种期望的原因是，一旦对方法设置了存根，再对其编写像这样的断言就没有意义了：\n\n```\nthing.stubs(:name).returns(\"\
  Fred\")\nassert_equal(\"Fred\", thing.name)\n```\n\n在这种情况下，你只是在测试存根是否如描述的那样工作——这个测试不会失败。但如果你使用模拟：\n\
  \n```\nthing.expects(:name).returns(\"Fred\")\n```\n\n那么你的代码实际上必须以某种方式运行。Ruby 的开放性和元编程功能的优点之一是，模拟对象库比其他语言的库更容易编写且功能更强大。在我写的时候，至少有四个广泛使用的模拟包。它们在重点和语法上略有差异。FlexMock\
  \ ([`flexmock.rubyforge.org/`](http://flexmock.rubyforge.org/)) 是最老的，但目前较少使用。Mocha\
  \ ([`mocha.rubyforge.org/`](http://mocha.rubyforge.org/)) 被 Rails 核心团队在集成测试中使用。Double\
  \ Ruby ([`github.com/btakita/rr/master`](http://github.com/btakita/rr/master)) 是一个较新的库，具有更简洁语法语法一些独特的特性。最后，RSpec\
  \ 有它自己的模拟库（在 RSpec 中讨论），尽管它允许你使用其他三个。\n\n在对这三者都没有有力支持的情况下，我们将在示例中使用 Mocha，理由是它非常接近成为核心。然而，在比较模拟对象节中，我们将对比各种模拟框架的语法。\n\
  \n废话到此为止。以下是实际使用方法。\n\n使用 `gem install mocha` 或在 Bundler 文件中使用 `gem mocha` 安装 Mocha。要使用\
  \ Mocha，在任何需要它的测试文件中放置：\n\n```ruby\nrequire 'mocha'\n```\n\n或在 `test/test_helper.rb`\
  \ 中。\n\n## 存根（Stubs）\n\n尽管基本相似，但存根和模拟进入测试模式的方式非常不同。从描述存根开始更容易。存根是对象全部或部分的替代品，它防止正常方法调用的发生，而是返回创建存根时预设的值。\n\
  \n在 Mocha 中，你可以通过使用 `stub` 方法（该方法在你的测试用例中可用）创建一个仅作为一组存根方法的对象。由于 Ruby 使用鸭子类型，因此只关心对象是否响应发送给它们的消息，这样创建的存根对象可以注入到你的应用程序中替换真实对象。\n\
  \n```ruby\ntest \"here's a sample stub\" do\n  stubby = stub(:name => \"Paul\",\
  \ :weight => 100)\n  assert_equal(\"Paul\", stubby.name)\nend\n```\n\n\n\n\n\n`stub`\
  \ 的哈希参数列出了被存根（stub）对象响应的方法以及返回的值。因此，第二行的断言为真，因为该存根已预设置为对 `name` 消息返回“Paul”。如果你用一个不在哈希参数中的方法调用存根，Mocha\
  \ 将返回一个错误。然而，Mocha 提供了 `stub_everything` 方法，它会对不在哈希参数中的方法返回 `nil`。当有大量潜在方法需要被存根，但这些值之间的差异微不足道，以至于指定它们会降低测试的可读性时，使用\
  \ `stub_everything` 就很有意义了。\n\n如果不清楚的话，这个测试使用存根的一种非常愚蠢的方法；我设置了一个漂亮的小同义反复，我并没有实际上关于这个测试周围的任何大型系统学到任何知识。\n\
  \n你会使用一个裸存根对象来代表在测试环境中无法用或创建/调用成本过高的对象。但在 Ruby 中，你更经常会利用 Ruby 允许你打开现有类和对象以添加或覆盖方法的方法。你可以轻松地获取一个“真实”对象并只存根你需要的方法。在存根对象的实际用法中，这是极其有用的。\n\
  \n在 Mocha 中，这通过 `stubs` 方法管理，该方法被混入任何 Ruby 对象中：\n\n| [huddle_mocha/test/unit/project_test.rb](http://media.pragprog.com/titles/nrtest/code/huddle_mocha/test/unit/project_test.rb)\
  \ |\n| Line 1 | `test \"lets stub an object\" do` |\n| 2 | `stub_project = Project.new(:name\
  \ => \"Project Greenlight\")` |\n| 3 | `stub_project.stubs(:name)` |\n| 4 | `assert_nil(stub_project.name)`\
  \ |\n| 5 | `end` |\n\n这个测试通过了：第 3 行设置了存根，第 4 行中的 `stub_project.name` 调用被存根拦截并返回\
  \ `nil`，甚至永远不会到达实际的项目名称。\n\n一个总是返回 `nil` 的存根有点没意义，因此 Mocha 允许你使用以下语法为存根的方法指定一个返回值：\n\
  \n| [huddle_mocha/test/unit/project_test.rb](http://media.pragprog.com/titles/nrtest/code/huddle_mocha/test/unit/project_test.rb)\
  \ |\n| Line 1 | `test \"lets stub an object again\" do` |\n| 2 | `stub_project =\
  \ Project.new(:name => \"Project Greenlight\")` |\n| 3 | `stub_project.stubs(:name).returns(\"\
  Fred\")` |\n| 4 | `assert_equal(\"Fred\", stub_project.name)` |\n| 5 | `end` |\n\
  \n第 3 行在这里负责重力工作，将返回值 `Fred` 绑定到方法 `:name`。从技术上讲，`stubs` 返回一个 Mocha Expectation\
  \ 对象，它实际上是真实对象的代理。`returns` 方法是该 Expectation 对象的一个方法，它将返回值与方法关联。\n\n由于 Ruby 中的类本身也就是对象，你可能期望可以像存根实例对象一样存根类。你是正确的：\n\
  \n| [huddle_mocha/test/unit/project_test.rb](http://media.pragprog.com/titles/nrtest/code/huddle_mocha/test/unit/project_test.rb)\
  \ |\n| Line 1 | `test \"let's stub a class\" do` |\n| 2 | `Project.stubs(:find).returns(Project.new(:name\
  \ => \"Project Greenlight\"))` |\n| 3 | `project = Project.find(1)` |\n| 4 | `assert_equal(\"\
  Project Greenlight\", project.name)` |\n| 5 | `end` |\n\n在这个测试中，类 `Project` 被存根为每当调用\
  \ `find` 时返回一个特定的项目实例。在第 3 行，当调用 `Project.find` 时，`find` 方法通过存根返回该对象。\n\n现在我们可能要找到重点了……你会发现这个测试使用了\
  \ `find` 方法的结果，而实际上没有触碰数据库。并不难找到 Rails 程序员认为在测试环境中使用数据库成本过高，这就是其中一种——诚然是过度简单的——避免它的策略。再次记住，这个存根不应该用来验证\
  \ `find` 方法是否正常工作；它应该被其他在通往实际测试逻辑的过程中需要 `find` 方法的测试所使用。\n\n`returns` 有几个高级用法，偶尔可能会很有趣。如果你指定了多个返回值，存根方法将逐个返回它们，如下面的\
  \ irb 会话所示：\n\n```ruby\n>> stubby = Project.new\n=> #<Project id: nil ....>\n>>\
  \ stubby.stubs(:name).returns(1, 2)\n=> 1\n>> stubby.name\n=> 2\n```\n\n存根对象的一个非常常见的用法是模拟异常。如果你想让你的存根方法引发异常，可以使用\
  \ `raises` 方法，它接受一个异常类和一个可选的消息：\n\n```ruby\nstubby.stubs(:name).raises(Exception,\
  \ \"oops\")\n```\n\n你甚至可以链式调用 `returns` 和 `raises`：\n\n```ruby\nstubby.stubs(:name).returns(1).raises(Exception,\
  \ \"oops\")\n```\n\n另一个用例是如果你希望测试期间创建的所有类实例都响应同一个存根。这通过 `any_instance` 方法管理，随后是你感兴趣的任何\
  \ `returns` 或 `raises` 期望：\n\n```ruby\nProject.any_instance.stubs(:save).returns(false)\n\
  ```\n\n由于我们已经强制要求 mock 包，这里是几个使用 `any_instance` 调用来验证 `create` 和 `edit` 错误行为的示例测试。这是针对\
  \ Huddle `Project` 类的你需要对你的类进行微调：\n\n| [huddle_mocha/test/functional/projects_test.rb](http://media.pragprog.com/titles/nrtest/code/huddle_mocha/test/functional/projects_test.rb)\
  \ |\n| Line 1 | `test \"fail gracefully\" do` |\n| - | `assert_no_difference('Project.count')\
  \ do` |\n| - | `Project.any_instance.stubs(:save).returns(false)` |\n| - | `post\
  \ :create, :project => {:name => 'Project Runway'}` |\n| 5 | `assert_template('new')`\
  \ |\n| - | `end` |\n| - | `end` |\n| - | `test \"fail gracefully\" do` |\n| 10 |\
  \ `Project.any_instance.stubs(:update_attributes).returns(false)` |\n| - | `put\
  \ :update, :id => projects(:huddle).id, :project => {:name => 'fred'}` |\n| - |\
  \ `assert_template('edit')` |\n| - | `actual = Project.find(projects(:huddle).id)`\
  \ |\n| - | `assert_not_equal('fred', actual.name)` |\n| 15 | `end` |\n\n\n\n\n\n\
  这两个测试具有相同的基本格式。每个测试中的第一个命令都设置了一个 `any_instance` （第 3 行和第 10 行）；然后运行实际的控制器命令（第 4\
  \ 行和第 11 行）。之后进行验证：首先检查是否使用了正确的错误模板（第 5 行和第 12 行），然后检查是否发生了实际创建或更新。对于创建（create），通过\
  \ `assert_no_difference` 调用来验证 `Product.count` 没有发生变化；对于更新（update），则是验证更新表单中的 `:name\
  \ => ’fred’` 并没有被发送到数据库。\n\n你们中眼光敏锐的人可能已经意识到，虽然测试的 `create` 版本需要使用 `any_instance`，因为在运行时并不知道正在创建的精确实例，但\
  \ `update` 版本实际上可以对 `project(:huddle).id` 包含一个存根（stub），因为这是唯一考虑的实例，且它的身份在控制器调用之前就已经已知。此观点很有道理。但在实践中，无法保证控制器中的\
  \ `find` 方法返回的对象与测试中使用的对象完全相同——它最可能会创建一个基于固定件（fixture）数据的副本，但它是从数据库加载的。如果是这样，限制测试中创建的特定实例的存根将无法应用于控制器创建的实例。在我们下一节引入\
  \ `with` 之后，我们将看到解决此问题的一种潜在黑科技/解决方案。\n\n使用 `any_instance` 时需要注意的一个相关技巧是：通过 `any_instance`\
  \ 声明的存根或模拟（mock）仅适用于声明之后创建的实例。具体来说，Rails 固定件对象如果是通过如 `users(:fred)` 等特殊固定件方法访问的（这些方法在测试开始时已经生成），将不会响应存根或模拟——需要从数据库重新创建对象，代理（double）才能生效。\n\
  \n此外，第 13 行中的 `find` 方法调用是必要的，以便强制回溯到数据库，检查数据库记录是否被更改——你可以通过对 `projects(:huddle)`\
  \ 调用 `reload` 来获得相同的效果。否则，对数据库的更改将不会反映在已经创建并存在内存中的实例上。最后可能最明显的一点是，当你将此代码适配到自己的类时，第\
  \ 11 行调用中的表单部分需要具有实际属于所考虑类的属性。\n\n## 带参数的存根\n\n微调存根的下一个级别是让它根据输入参数返回不同的值。在 Mocha\
  \ 中，这是通过 `with` 方法管理的：\n\n| `huddle_mocha/test/unit/project_test.rb` (http://media.pragprog.com/titles/nrtest/code/huddle_mocha/test/unit/project_test.rb)\
  \ |\n| :--- |\n| | `test \"let's stub a class again\"` `do` |\n| | `Project.stubs(:find).with(1).returns(`\
  \ |\n| | `Project.new(:name => \"Project Greenlight\"))` |\n| | `Project.stubs(:find).with(2).returns(`\
  \ |\n| | `Project.new(:name => \"Project Blue Book\"))` |\n| | `assert_equal(\"\
  Project Greenlight\", Project.find(1).name)` |\n| | `assert_equal(\"Project Blue\
  \ Book\", Project.find(2).name)` |\n| | `end` |\n\n在之前的示例所示的最简单形式，`with` 方法接受一个或多个参数。当调用\
  \ `stub` 方法时，Mocha 会在传递的参数与声明的存根之间搜索匹配项，并返回与这些参数匹配的值。\n\n需要注意的一点是，通过为特定的输入值设置期望，你会将\
  \ Mocha 存根限制为仅这些输入值。换句话说，如果我们在这个测试中尝试 `Project.find(3)`，测试将会失败——这对于存根来说是一个违背直觉的结果。失败会触发以下相当相当晦涩的错误信息：\n\
  \n| `test_let's_stub_a_class_again(ProjectTest)` |\n| `[/test/unit/project_test.rb:43]:`\
  \ |\n| `unexpected invocation: Project(id: integer, name: string,` |\n| `created_at:\
  \ datetime, updated_at: datetime, start_date: date,` |\n| `end_date: date).find(3)`\
  \ |\n| `satisfied expectations:` |\n| `- allowed any number of times, already invoked\
  \ once:` |\n| `Project(id: integer, name: string, created_at: datetime,` |\n| `updated_at:\
  \ datetime, start_date: date, end_date: date).find(2)` |\n| `- allowed any number\
  \ of times, already invoked once:` |\n| `Project(id: integer, name: string,` |\n\
  | `updated_at: datetime, start_date: date, end_date: date).find(1)` |\n\n在我们进一步讨论一下模拟（mocks）之后，这条信息的内容可能会稍微清晰一点，但核心意思很简单：我们做了一些\
  \ Mocha 没有预料到的事情。`with` 描述符可以附加到值或异常上：\n\n```ruby\nProject.stubs(:find).with(1).returns(Project.new(:name\
  \ => \"Project Greenlight\"))\nProject.stubs(:find).with(2).returns(Project.new(:name\
  \ => \"Project Blue Book\"))\nassert_equal(\"Project Greenlight\", Project.find(1).name)\n\
  assert_equal(\"Project Blue Book\", Project.find(2).name)\n```\n\n更通用地，我们可以这样使用\
  \ `with`：\n\n```ruby\nProject.stubs(:find).with(1).returns(Project.new(:name =>\
  \ \"Project Greenlight\"))\n```\n\n当多个值返回 `true` 时，似乎最后的一个胜出：\n\n```ruby\nProject.stubs(:find).with(2).returns(Project.new(:name\
  \ => \"Project Blue Book\"))\n```\n\n\n\n\n还有大约十个类似的匹配器（matchers），其中许多似乎——怎么说呢——在实际应用中价值不大。为了避免让你的脑子里充斥一堆你永远用不到的东西，我邀请你查看\
  \ [`mocha.rubyforge.org`](http://mocha.rubyforge.org) 上的 Mocha 文档以获取完整列表。\n\n`with`\
  \ 的一种可能用途是解决上一节中提到的 `ActiveRecord` 对象问题。Anthony Caliendo 提出了以下巧妙的解决方案，用于在测试中为 `ActiveRecord`\
  \ 对象创建模拟对象（mock）或存根（stub），并确保它仍应用于控制器创建的 `ActiveRecord` 对象[[40]](#f_0061.html_FOOTNOTE-40)。\n\
  \n请记住，问题在于从控制器发起的数据库调用所创建的 Ruby 对象与你挂载存根的对象是完全不同的。但你可以深入 `ActiveRecord` 的内部机制，并在你的测试辅助文件中定义它：\n\
  \n```ruby\ndef mock_active_records(*records)\n  records.each do |record|\n    record.class.stubs(:instantiate).with(has_entry('id'\
  \ => record.id.to_s)).returns(record)\n    record.stubs(:reload).returns(record)\n\
  \  end\nend\n```\n\n这里的关键语句是第 3 行的 `stubs(:instantiate).with`。该方法被调用时带一组键值对，用于创建一个\
  \ `ActiveRecord` 对象。接着在第 4 行，使用 Mocha 的 `has_entry` 装饰器来声明：如果键值对中包含一个与已知记录 ID 匹配的\
  \ `id` 项，则直接返回该对象。`instantiate` 方法是从 `ActiveRecord::Base::find` 调用的，因此任何尝试从数据库检索此对象的机制都会在这里被捕获，这样如果你请求的对象的\
  \ ID 与已知对象之一匹配，就会返回该对象而无需再次访问数据库。`reload` 方法同样被设置了存根。\n\n示例用法可能如下所示：\n\n```ruby\n\
  test \"My projects might be properly saved\" do\n  @bluebook = Project.make(:name\
  \ => \"Project Bluebook\")\n  @runway = Project.make(:name => \"Project Runway\"\
  )\n  mock_active_records(@bluebook, @runway)\n  @bluebook.stubs(:save => true)\n\
  \  @runway.stubs(:save => false)\nend\n```\n\n注意，你必须用 `mock_active_records` 方法标记你将要使用的记录，并实际指定这些对象上的任何其他存根或模拟。这里有几点需要注意，最明显的是，你在测试中可能找到的所有\
  \ `ActiveRecords` 都必须在 `mock_active_records` 调用中，因为尝试使用不匹配的哈希调用存根的 `instantiate`\
  \ 方法将触发预期错误。在工厂宇宙中，由于只定义了几个对象，这可能并不是难以接受的限制。此外，`ActiveRecord` 的内部机制未来可能会发生变化，导致此机制失效。\n\
  \n如果你只有一两个对象需要模拟，并且被测试的方法很简单，有一个更简单的选项。\n\n```ruby\ntest \"My projects might be\
  \ properly saved\" do\n  @bluebook = Project.make(:name => \"Project Bluebook\"\
  )\n  Project.stub(:find).return(@bluebook)\n  @bluebook.stubs(:save => true)\n \
  \ post :update, :id => @bluebook.id\nend\n```\n\n这一切所做的只是对 `Project` 类设置存根，使其在调用\
  \ `find` 时始终返回 `@bluebook`。这确保了使用 `find` 查找对象的控制器方法返回的是你在测试中设置的同一个对象。这里有严格的局限性——基本上，我们假设测试只需要创建一个\
  \ `Project` 对象。但在许多情况下（例如简单的更新或创建方法），这种假设是成立的，而且这是在测试和被测试方法之间共享存根对象的一种相当整洁的方法。\n\
  \n## 模拟，模拟，再模拟\n\n真正的模拟对象（mock object）保留了存根（stub）的基本思想——即返回指定的值而不实际调用真实方法——并增加了一项要求：指定的方法在测试期间必须被实际调用。换句话说，模拟对象就像是带脾气的存根，它期望——不，是要求——它的参数在测试中被匹配，否则会导致测试失败。\n\
  \n与存根一样，Mocha 提供了一种从无到有创建模拟对象的方法，以及一种向现有对象添加模拟预期的方法。创建纯原生模拟的方法是：\n\n```ruby\ntest\
  \ \"a mock\" do\n  mocky = mock(:name => \"Paul\", :weight => 100)\n  assert_equal(\"\
  Paul\", mocky.name)\nend\n```\n\n如发生所示，这个测试失败了：\n\n```ruby\ntest \"a mock\" do\n\
  \  mocky = mock(:name => \"Paul\", :weight => 100)\nend\n```\n未满足预期（unsatisfied）。要通过测试，请添加\
  \ `weight` 的调用：\n\n```ruby\ntest \"a mock\" do\n  mocky = mock(:name => \"Paul\"\
  , :weight => 100)\n  assert_equal(\"Paul\", mocky.name)\nend\n```\n\n向现有对象添加模拟的方法是\
  \ `expects`：\n\n```ruby\ntest \"lets mock\" do\n  mock_project = Project.new(:name\
  \ => \"Green\")\n  mock_project.expects(:name).returns(\"Fred\")\n  assert_equal(\"\
  Fred\", mock_project.name)\nend\n```\n\n到目前为止看到的所有修符都应用于存根，如 `returns`、`raises`、`any_instance`\
  \ 和 `with`，或者也可以添加到模拟语句中。例如，创建和更新的控制器测试可以改为使用模拟：\n\n```ruby\ntest \"mock fail create\"\
  \ do\n  assert_no_difference('Project.count') do\n    Project.any_instance.expects(:save).returns(false)\n\
  \    post :create, :project => {:name => \"Project Runway\"}\n    assert_template('new')\n\
  \  end\nend\n\ntest \"mock fail update\" do\n  Project.any_instance.expects(:update_attributes).returns(false)\n\
  \  put :update, :id => projects(:huddle).id, :project => {:name => 'fred'}\n  assert_template('edit')\n\
  \  actual = Project.find(projects(:huddle).id)\n  assert_not_equal('fred', actual.name)\n\
  end\n```\n\n再次，这些测试的行为与存根版本相同，额外了一个隐式测试，验证 `save` 和 `update_attributes` 方法在测试期间确实被调用。\n\
  \n默认情况下，`mock` 和 `expects` 设置的验证是方法在测试期间恰好被调用一次。如果这不满足你的测试需求，Mocha 有方法允许你指定方法的调用次数。这些方法大多一言易懂：\n\
  \n```ruby\nproj = Project.new\nproj.expects(:name).once\n```\n\n\n\n\n| | `proj.expects(:name).twice`\
  \ |\n| | `proj.expects(:name).at_least_once` |\n| | `proj.expects(:name).at_most_once`\
  \ |\n| | `proj.expects(:name).at_least(3)` |\n| | `proj.expects(:name).at_most(3)`\
  \ |\n| | `proj.expects(:name).times(5)` |\n| | `proj.expects(:name).times(4..6)`\
  \ |\n| | `proj.expects(:name).never` |\n\n在实践中，默认行为对于大多数用法都是足够的。\n\n## Mock 对象与行为驱动开发\n\
  \n使用真实 mock（true mocks）的趣味之处在于它们的使用开启了一种完全不同的测试风格。在本书大部分部分中我们过的测试中，测试验证的是计算结果：它在测试过程的最终状态。然而，当使用\
  \ mock 时，我们有机会在测试过程中测试过程的行为，而不是结果。\n\n通过一个示例将阐明这种差异。在之前的测试视图 节中，Huddle 应用有一个控制器测试，它很大程度上基于对模型调用的结果。\n\
  \n如果没有 mock 对象，测试看起来像如下（来自 `test/functional/project_controller_test.rb`）：\n\n```ruby\n\
  [huddle_mocha/test/functional/projects_controller_test.rb](http://media.pragprog.com/titles/nrtest/code/huddle_mocha/test/functional/projects_controller_test.rb)\
  \ \n\ntest \"project timeline index should be sorted correctly\" do\n  set_current_project(:huddle)\n\
  \  get :show, :id => projects(:huddle).id\n  expected_keys = assigns(:reports).keys.sort.map{\
  \ |d| d.to_s(:db) }\n  assert_equal([\"2009-01-06\", \"2009-01-07\"], expected_keys)\n\
  \  assert_equal(\n    [status_reports(:ben_tue).id, status_reports(:jerry_tue).id],\n\
  \    assigns(:reports)[Date.parse(\"2009-01-06\")].map(&:id))\n  )\nend\n```\n\n\
  正如在该节中执行的过程所示，该测试中的断言最终几乎完全相同地复制到了模型测试中，而模型测试实际上执行了此处被测试的控制器 `show` 所发出的模型调用。当时，我们提到过\
  \ mock 对象包是编写测试的另一种方式。mock 版本的测试可能像下面这个通过的测试：\n\n```ruby\n[huddle_mocha/test/functional/projects_controller_test.rb](http://media.pragprog.com/titles/nrtest/code/huddle_mocha/test/functional/projects_controller_test.rb)\n\
  \nLine 1 test \"mock show test\" do\nLine 2 set_current_project(:huddle)\nLine 3\
  \ Project.any_instance.expects(:reports_grouped_by_day).returns(\nLine 4 {Date.today\
  \ => [status_reports(:aaron_tue)]})\nLine 5 get :show, :id => projects(:huddle).id\n\
  Line 6 assert_not_nil assigns(:reports)\nLine 7 end\n```\n\n初看之下，它看起来极简得荒谱。它似乎并没有真的在断言任何东西。诀窍在于第\
  \ 3-4 行中设置的 mock 预期，与该系统中可能存在的其他测试相结合。这个测试验证了控制器恰好调用了一次模型方法 `reports_grouped_by_day`，并验证了\
  \ `reports` 变量被设置了某个值。它还验证了控制器和视图运行得没有错误，但那是次要的。该测试验证的是控制器方法的行为——即，它调用了一个特定的模型方法，而不是调用该方法后产生的状态。\n\
  \n这个测试没有做的是尝试去验证实际上属于其他测试范畴的功能。它没有验证模型方法的响应；那是模型测试的工作。视图层对该值进行的操作是视图测试的工作。该测试验证了特定的实例变量通过一个已知的模型方法被设置了一个值，其理论是：控制器方法的作用是产生一组已知的值以供视图使用。但验证\
  \ `:reports` 变量的精确值是没有意义的（至少在这种情况下），因为该值完全是由 mock 预期的生成的。\n\n在这种风格的测试中使用 mock 对象既有优势也有缺点。速度是一个巨大的优势：从\
  \ mock 获取值将比比从固件（fixture）或工厂数据库（factory database）获取值快得多。另一个优势是测试的封装性。在上一个例子中，如果模型对象中引入了错误，唯一失败的测试将是模型测试——受\
  \ mock 保护的控制器测试将保持正常。如果做得当，这种封装可以使诊断和修复更容易。\n\n然而，有几个潜在的问题需要注意。其是 mock 方法与真实方法之间不匹配。在上一个例子中，mock\
  \ 调用返回一个键为 `Date` 值为 `StatusReport` 对象的哈。然而，如果模型方法实际上返回的是一个带有字符串的哈，那么可能会出现控制器方法通过了，网站却崩溃了的情况。\n\
  \n我必须说，尽管我很喜欢使用 mock 和 stub（存桩）来覆盖难以访问的对象和状态，但我对非常基于行为的 mock 测试结构的体验并不理想。我的经验是，围绕一个对象编写所有的\
  \ mock 往往会增加测试过程的负担。但我完全接受这种可能性：这种方法对其他人更有效，或者我做得不对。或者，引用 Stephen Bristol 的：42 “如果做得当，RSpec\
  \ 不是在测试。它是设计。”\n\n## Mock 准则与禁忌\n\n以下是关于 stub 和 mock 最佳用法的一些指南：\n\n* 如果你正在使用伪对象来替代在测试环境中难以或无法创建的真实对象，使用\
  \ stub 而不是 mock 可能是一个好主意。如果你实际上是将伪值作为另一个过程的输入，那么你应该直接使用伪值测试该过程，而不是使用 mock。添加 mock\
  \ 预期只是增加了一个可能出错的地方，而在这种用例中这与你实际测试的内容无关。\n* 当你使用真实的 mock 来封装测试并将其与非测试方法隔离开时，尽量限制你在一个测试中\
  \ mock 的方法数量。mock 越多，测试对实际代码变化的敏感度就越高。大量的 mock 可能表明你的测试试图做太多事情，或者可能表明了一个糟糕的面向对象设计，即一个类向另一个类索要过多的细节。\n\
  \n\n\n\n\n*   我已经在控制器测试中频繁地使用 mock（模拟对象）来将控制器测试与模型的行为隔离开，本质上只测试控制器是否调用了特定的模型方法，并使用模型测试来验证模型的行为。这种\
  \ mock 使用方法的好处之一是，它鼓励让控制器和模型之间的接口尽可能简单。然而，这意味着控制器测试比通常情况下了解了更多模型信息，这可能会使模型代码更难以更改。\n\
  \n*   你还需要注意 mock 那些具有副作用的方法或调用了其他可能有趣的方法。mock 会完全跳过原始方法，这意味着没有副作用，也不会调用内部方法。专业提示：保存到数据库和输出到响应流都是副作用。\n\
  \n*   如果你指定了某个值作为 mock 的结果，然后断言（assert）该完全相同的值确实存在，那么请务必保持警惕。任何测试套件最大的潜在问题之一就是假阳性（false\
  \ positives），而使用 mock 值进行测试结果是产生假阳性的一种非常有效的方法。\n\n*   一个可能更大的问题是真实方法与用于 mock 的值之间的类型不匹配问题。集成测试或验收测试可以帮助这个问题，但在开发过程中帮助不大。我不知道是否有自动化的方法可以确保\
  \ mock 值实际上是可能的的结果，同时仍获得使用 mock 的好处，所以这是需要关注的。\n\n## 比较 Mock 对象库\n\n现在我们已经花了一些时间探索如何使用\
  \ `Mocha` 运行 mock 对象，现在让我们简要查看其他流行的 Ruby mock 库管理类似任务的不同方式。目前有四个流行的包：\n\n### FlexMock\n\
  这是原始的 Ruby mock 对象包。\n\n### Mocha\n我们已经详细讨论过它。它是 Rails 的准官方标准，因为它被用于 Rails 核心中。\n\
  \n### RSpec\n`RSpec` 库在章节 [`RSpec`#f_0098.html_chp.rSpec) 中有更详细的描述，它定义了自己的 mock\
  \ 对象包。\n\n### RR\n读作“Double Ruby”，它是最新的成员，具有比其他包更简洁的语法，并拥有独特的高级功能。\n\n这是对常用功能的快速介绍，而不是对每个包的完整查看。请查看文档以获取所有细节和特性——特别是\
  \ `RR`，具有无法映射到其他工具的功能。\n\n### 加载到测试套件\n\n使用这些包中的任何一个的第一部分是安装并与 `Test::Unit` 集成。当然，`RSpec`\
  \ mocks 无法与 `Test::Unit` 集成；然而，其他任何包都可以通过在 `spec_helper.rb` 文件中添加 `config.mock_with\
  \ :rr` 或 `:flexmock` 或 `:mocha` 来与 `RSpec` 集成。\n\n### FlexMock\n|   | `% sudo gem\
  \ install flexmock` |\n\n然后，在 `test_helper.rb` 中添加以下内容：\n|   | `require 'flexmock/test_unit'`\
  \ |\n\n### Mocha\n|   | `sudo gem install mocha` |\n\n然后，在 `test_helper.rb` 中添加以下内容：\n\
  |   | `require 'mocha'` |\n\n### RSpec\nN/A\n\n### RR\n|   | `sudo gem install rr`\
  \ |\n\n然后，在 `test_helper.rb` 的测试用例声明内部添加以下内容：\n|   | `include RR::Adapters::TestUnit`\
  \ |\n\n### 创建空 Stub（存桩）\n\n这些包中最基本的功能是创建一个简单的 stub 对象，在其中你可以指定一个或多个方法的返回值。当这些方法被调用时，将返回指定的值。如果方法没有被调用，则什么都不会发生。这里是创建一个与应用程序中任何预存对象连接的\
  \ stub 对象的语法。\n\n### FlexMock\n|   | `stub = flexmock(\"name\", :method => result)`\
  \ |\n\n### Mocha\n|   | `object = stub(:method => result)` |\n\n方法/结果对也可以在块参数（block\
  \ argument）中指定，如下一节所示。\n\n### RSpec\n|   | `stub = stub(\"name\", :method => value)`\
  \ |\n\n### RR\n|   | `double = stub(Object.new).method { value }` |\n\n这可以按如下方式缩写：\n\
  |   | `double = stub!.method { value }` |\n\n### 从现有对象创建 Stub\n\n尽管如此，在大多数情况下，你可能想要创建一个替换现有对象方法的\
  \ stub。在 `FlexMock` 和 `RR` 中，这涉及调用一个以对象为参数的特殊方法，如 `FlexMock` 的 `flexmock(object)`,而在\
  \ `Mocha` 和 `RSpec` 中，这涉及调用对象本身的方法，如 `object.stubs`。在任何情况下，关于被 stub 的方法及其返回值的更多信息通常在\
  \ stub 声明之后链。\n\n记住，类在 Ruby 中只是另一种类型的对象，因此类方法可以像任何其他方法一样处理，如 `stub(User).should_receive(:find)`。\n\
  \n### FlexMock\n|   | `stub = flexmock(project).should_receive(:method).and_return(value)`\
  \ |\n\n如果被 mock 的对象是字符串或符号，使用 `:base` 作为第一个参数，以防止与仅包含名称的简单测试双（test double）混淆。换句话说，调用\
  \ `flexmock(\"fred\")` 是歧义的。按照目前的写法，它只是一个名为 fred 的裸 `FlexMock` 对象。如果你实际上想在字符串上 stub\
  \ 方法，请使用 `:base`。\n\n当你的对象可能已经定义方法时，使用 `:safe` 参数。在 `FlexMock` 中，可以使用以下内容：\n\n|\
  \   | `mock = flexmock(object)` |\n|   | `mock = flexmock(object, :safe)` |\n\n\n\
  \n\n其他选项包括 `zero_or_more_times`、`twice`、`never` 和 `times(n)`。你也可以使用组合方法，例如 `at_least.once`\
  \ 或 `at_most.twice`。\n\n### Mocha\n\n基础 mock 对象（mock objects）与基础 stub 对象类似，区别是所有方法都预期会被调用一次。现有对象使用\
  \ `expects` 方法转换为 mock。\n\n|   | `mock = mock()` |\n|   | `project.expects(:method)`\
  \ |\n\n默认方法会被恰好调用一次，等同于 `project.expects(:method).once`。其他选项包括 `twice`、`at_least_once`、`at_most_once`、`at_least(x)`、`at_most(x)`、`times(x)`、`times(x..y)`\
  \ 和 `never`。\n\n### RSpec\n\n|   | `obj.should_receive(:method).and_return(1)` |\n\
  \n默认期望方法将被调用一次。如果方法永远不应该被调用，请使用此方法：\n\n|   | `obj.should_not_receive(:method)` |\n\
  \n其他的方法调用次数期望可以通过 `once`、`twice`、`exactly(n).times`、`at_least.once`、`at_least(n).times`、`at_most.once`、`at_most(n).times`\
  \ 和 `any_number_of_times` 来设置。\n\n### RR\n\n这为单个调用设置了期望。预期值是块的结果。\n\n|   | `mock(obj).method\
  \ { value }` |\n\n要设置方法被调用多次的期望，请使用此方法：\n\n|   | `mock(obj).method.times(n) { value\
  \ }` |\n\n要设置方法不被调用的期望，请使用此方法：\n\n|   | `do_not_call(obj).method` |\n\nRR 允许你创建一个创建一个方法将被调用的期望，但与\
  \ mock 不同，它会实际调用方法。代理调用的块参数允许你对实际方法的输出进行后处理：\n\n|   | `mock.proxy(project).method\
  \ { |actual| `\"#{actual}_mocked\"` }` |\n\n## 通过参数过滤方法\n\n四个库都提供了相似的语法来指定双倍方法时必须匹配的参数。这允许你根据参数指定不同的返回值。例如，你可以为\
  \ `find` 方法指定多个 stub，每个 stub 返回不同的模型对象。除了基于参数的精确值进行匹配外，每个库还提供了一些基于类或匹配正则表达式等类的更通用的匹配器。\n\
  \n### FlexMock\n\n|   | `mock.should_receive(:method).with(\"a\")` |\n\n还有 `with_any_args`\
  \ 和 `with_no_args`。如果 `with` 的参数是一个类，则该类的任何实例都匹配。如果是一个正则表达式，则任何匹配该正则表达式的字符串都会匹配。还有处理更复杂逻辑的机制。\n\
  \n### Mocha\n\n|   | `project.expects(:method).with(1)` |\n\n如果给 `with` 传递一个块，当块返回\
  \ true 时方法将匹配。其他几个匹配器可以与参数组合，包括 `instance_of`、`Not`、`any_of` 和 `regexp_matchers`。\n\
  \n### RSpec\n\n|   | `project.should_receive(:method).with(1)` |\n\n其他过滤器包括 `anything`、`any_instance_of`、`hash_including`、`boolean`、`duck_type(:message)`\
  \ 或正则表达式。\n\n### RR\n\n|   | `mock(project).method(1) { value }` |\n\n在定义方法时直接设置参数即可。可以作为参数放置的特殊匹配器包括\
  \ `anything`、`is_a`、`numeric`、`boolean` 和 `duck_type`。你也可以放入范围或正则表达式。\n\n## 为类的任何实例进行双倍处理\n\
  \n三个库还具有特殊语法，允许你为在该声明之后创建的任何类实例指定 stub 或 mock 行为。（注意，之前创建的类实例将不会具有双倍行为。）通常，在方法声明此双倍行为适用于所有新实例后，可以应用任何其他过滤器或期望。在每个示例中，`Project`\
  \ 类都被装饰为在调用 `save` 时返回 false。\n\n### FlexMock\n\n|   | `flexmock(Project).new_instances.should_receive(:save\
  \ => false)` |\n\n在 `new_instances` 之后，可以使用任何 FlexMock 期望或过滤器。\n\n### Mocha\n\n\
  |   | `Project.any_instance.expects(:save).returns(false)` |\n\n### RSpec\n\nRSpec\
  \ 没有该功能的精确匹配；最接近的变通方法似乎是：\n\n|   | `Project.stub!(:find).and_return(` |\n|   | `mock_model(Project,\
  \ :save => false))` |\n\n### RR\n\n|   | `mock.instance_of(Project).save(false)`\
  \ |\n\n## ActiveRecord Mock 功能\n\n几个库为 ActiveRecord 提供了特殊功能。\n\n### FlexMock\n\n\
  |   | `flexmock(:model, Project)` |\n\n像普通 stub 一样工作，具有方法 `id`、`to_params`、`new_record?`、`errors`、`is_`。\n\
  \n### Mocha\n\n###\n\n### RSpec\n\n|   | `mock_model(Project, :save => value)` |\n\
  \n### RR\n\n## 方法链式\n\n某些库允许在一行中为整个调用链设置 stub，而无需 mock 中间对象。\n\n### FlexMock\n\n\
  |   | `flexmock(project).should_receive(:address).and_return(mock_address)` |\n\n\
  ### Mocha\n\n### RSpec\n\n|   | `project.should_receive(:address).and_return(mock_address)`\
  \ |\n\n### RR\n\n|   | `mock(project).address.and_return(mock_address)` |\n\n# Mock\
  \ 总结\n\n在本章中，我们涵盖了模型测试。首先，我们讨论了固件（fixtures）和工厂（factories）作为创建测试数据的机制。通过本章，我们开始从模型过渡到面向用户的部分的测试。Mock\
  \ 可以控制器测试中非常重要的一部分；将应用程序各个层相互隔离。在下部分，我们将讨论控制器和视图层。\n\n\n\n\n我不想在这个问题上反复纠结（已经太晚了），尽管我在这里尽可能遵循标准的\
  \ Rails 命名规范，但功能测试（functional test）仍然让我觉得不太妥。我会坚持使用控制器测试（controller test）和视图测试（view\
  \ test），以便明确测试的实际目标。\n\n## 控制器测试可用可用？\n\nRails 生成的控制器测试是 `ActionController::TestCase`\
  \ 的子类，而后者本身又是用于模型测试的 `ActiveSupport::TestCase` 的子类。模型测试的所有功能在和视图测试中仍然存在。此外，通过混合到\
  \ `ActionController::TestCase` 中的几个模块添加了一些额外的工具。以下是你可以使用的资源：\n\n*   三个实例变量，分别是 `@controller`、`@request`\
  \ 和 `@response` 的模拟对象版本。需要真实用户请求或客户端浏览器的功能都被存根（stubbed out）。根据我的经验，我并不经常直接使用它们，除了\
  \ `@response.body`，它对于在测试方法内部检查正文文本来辅助视图测试和调试非常有帮助。\n*   四个表示控制结构的伪哈希变量。你拥有 `session`、`cookies`\
  \ 和 `flash`，它们分别代表与其同名的 Rails 构建体，例如 `session[:user_id]`——尽管 `cookie` 变量使用的是字符串键（string\
  \ keys），而不是符号键（symbol keys）。你还有 `assigns`，它允许访问控制器方法中设置的任何实例变量，因此控制器方法中的 `@user`\
  \ 可以可以通过测试中使用 `assigns(:user)` 来验证。你应该像访问方法一样访问它，而不是哈希——`assigns[:user]` 将不起作用（但\
  \ `assigns[\"user\"]` 可以……）。\n*   一个模拟每个 HTTP 动词的方法，用于伪调用控制器：`get`、`post`、`put`、`delete`，以及用于\
  \ Ajax 调的额外 `xhr`。\n*   若干针对控制器和视图测试细节的断言，其中最有价值的部分将在“测试视图”章节中进行详细介绍。\n\n## 测试什么\n\
  \n控制器测试的控制器部分通常非常直观。如果你遵循良好的开发实践，复杂的功能位于模型中，并在你的模型测试中进行测试；这是最佳实践的原因之一，因为模型更容易测试。视图测试起来确实非常头疼，我们将在“测试视图”章节中介绍。\n\
  \n控制器测试应该具有以下目标之一：\n\n1.  验证普通的、基础的用户请求是否触发了预期的 ActiveRecord 调用，并将必要的数据传递给视图。\n\
  2.  验证格式不正确或无效的用户请求是否被妥善处理（无论对你的应用来说“妥善处理”的定义是什么）。\n3.  验证你的安全角色是否按预期工作，例如根据需要对页面要求登录，并测试进入不应查看的资源\
  \ URL 的用户是否会被拦截或重定向。这些测试通常包含视图组件：管理员应该看到“删除”按钮，但其他人都不应该。\n\n## 模拟控制器调用\n\n控制器测试的通用结构包括一个\
  \ `setup` 方法（用于准备数据和会话上下文）以及一个单独的测试方法（用于模拟调用调用并验证控制器响应）。这种结构的最简化版本如下：\n\n```ruby\n\
  setup :generic_setup\n\ndef generic_setup\n  @task = Task.create\n  login_as :admin\n\
  end\n\ntest \"should show a task\" do\n  get :show, :id => @task.id.to_s\n  assert_equal(@task.id,\
  \ assigns(:task).id)\n  assert_response :success\n  assert_template :show\nend\n\
  ```\n\nRails 为每个 HTTP 动词提供了一个测试方法：`get`、`post`、`put` 和 `delete`。这些方法的工作方式相同。模拟调用的第一个参数是要要调用的控制器方法。第二个参数包含键值对，这些对将成为调用的\
  \ `params`。Rails 将复杂数据类型放入参数名称的约定在这里适用，因此 `:task => {:project => {:id => \"3\"}}`\
  \ 会创建 `params[:task][:project][:id] = \"3\"`。\n\n在大多数情况下，参数参数是唯一传递给控制器的，因此被写为 Ruby\
  \ 封装成哈希的键值对列表。然而，这些测试方法还有可选的第三和第四参数，分别设置 session 和 flash 的哈希。在下面的代码段中，session 获取用户\
  \ ID 和当前项目，而 flash 获取了一个通知：\n\n```ruby\nget :show, {:id => @task.id.to_s}, {:user_id\
  \ => \"3\", :current_project => @project.id.to_s}, {:flash => \"notice\"}\n```\n\
  \n`xhr` 方法模拟 Ajax 调用。该方法的签名略有不同；第一个参数是 HTTP 动词，第二个是控制器方法，其余参数按顺序匹配：\n\n```ruby\n\
  test \"ajax call\" do\n  xhr :post, :create, :id => \"3\"\nend\n```\n\n控制器对测试的响应与其对实际请求的响应完全相同。也就是说，如果你使用更现代的\
  \ `respond_to` 块 `format.js`。模拟控制器调用有两个坑。第一个是控制器方法是直接调用的，没有通过路由文件。这意味着测试并没有验证该方法是否可以使用给定的动词实际可达——这可以通过单独的路由测试完成。这对于\
  \ RESTful 控制器可能特别令人烦恼，因为 HTTP 动词是显著的，而测试可能会通过使用意外的动词掩盖潜在问题。\n\n我在测试 Ajax 和 REST\
  \ 的交集时掉进过陷阱。如果上一个示例中通过 Ajax 调的方法期望 `POST`（例如，它是一个 RESTful 的编辑方法），测试会通过，但代码在浏览器中会失败。\n\
  \n测试环境与真实请求之间的另一个区别是真实请求参数总是字符串，而这些测试调用在调用控制器方法之前不会将键值转换为字符串。在许多情况下，这并不是大问题——如果你只是对\
  \ ID 参数执行 `find` 操作，ActiveRecord 无论如何都会采取正确的操作。然而，如果你依赖变量的精确匹配（例如，直接将参数与 ID 进行比较），类型可能会很重要，你可能会有一个在测试环境中通过但在浏览器中代码失败的测试。\n\
  \n这在安全测试中可能会成为一个问题。如果控制器方法看起来像这样\n\n```ruby\ndef create\n  if current_user.id ==\
  \ params[:id]\n    # allow\n  else\n    # deny\n  end\nend\n```\n\n而测试看起来像这样：\n\n\
  ```ruby\ntest \"I can create\" do\n  login_as(@user)\n  put :create, @user.id\n\
  \  # assert that allowed branch was taken\nend\n```\n\n\n\n\n测试将会通过，因为测试中的 `params[:id]`\
  \ 是一个整数，但 `create` 方法在浏览器中会失败，因为 `params[:id]` 将是一个字符串。解决方法是确保在测试中将测试值转换为字符串。一种建议是使用\
  \ `@user.to_param` 作为 `put` 的参数；这种方法比使用 `@user.id.to_s` 更好，因为如果你以后重写了 `to_param`\
  \ 方法，它可以为你提供一些灵活性。\n\n# 测试文件上传\n\n当你想要在测试中模拟文件上传时，Rails 提供了辅助方法 `fixture_file_upload`\
  \ 来提供帮助。它接受两个参数：相对于 Rails 根目录的实际文件路径，以及一个 MIME 类型。你将它用作传递给控制器测试中 Rails 方法的键值对的值部分，例如\
  \ `post :upload_icon, :icon => fixture_file_upload('/public/images/test_icon.png',\
  \ 'image/png')`。控制器会将该值视同于一个已上传的文件。\n\n# 测试控制器响应\n\n你在控制器方法中通常想要验证的最基本内容是：它是否返回了你预期的\
  \ HTTP 状态码，以及相应的 Rails 模板是否负责返回响应。Rails 提供了三个断言方法来帮助：`assert_redirected_to`、`assert_response`\
  \ 和 `assert_template`。\n\n当你期望普通的 HTTP 响应而不是重定向时，你可以通过 `assert_response` 和 `assert_template`\
  \ 的组合在测试中指示你的预期，如下：\n\n| | `test \"successful index request\" do` |\n|---|---|\n\
  | | `get :index` |\n| | `assert_response :success` |\n| | `assert_template \"index\"\
  ` |\n| | **end** |\n\n让我们来分解一下。`assert_response` 实际上验证 Rails 发送给浏览器的响应码。通常，测试的预期值是\
  \ `:success`（意味着代码 200），或 `:redirect`（它匹配 300--399 范围内的任何值，表示某种形式的重定向）。其他特殊值包括匹配\
  \ 404 错误的 `:missing`，以及匹配 500--599 错误范围内任何值的 `:error`。除了使用特殊值外，预期参数也可以是预期响应的精确整数。所有单独的响应码也有它们自己特定的（尽管很少使用）符号等价值。\n\
  \n`assert_template` 验证 Rails 使用哪个模板来生成响应。模板名称的指定与你在控制器中使用 `render :action` 时的方式完全一致——模板名称可以是字符串也可以是符号。如果参数只是单个字符串或符号，则它将与渲染该操作的主模板名称进行比对。如果你在调用\
  \ `assert_template` 时使用的键值参数形式为 `assert_template :partial => '_user_data_row'`，那么你正在测试当控制器操作渲染时，指定的\
  \ partial 是否被调用。测试方法中的 partial 名称必须包含前导下划线。添加 `:count` 选项验证指定的 partial 是否被调用了特定次数，这对于在循环内部渲染的\
  \ partial 可能有用。\n\n对于重定向，Rails 提供了 `assert_redirected_to`，它接受的参数是任何可以解析为 URL 的对象（`assert_redirected_to`\
  \ 会隐式地调用 `assert_response :redirect`，因此你不需要为它编写单独的断言）。\n\n如果 `assert_redirected_to`\
  \ 的参数是一个哈希值，例如：\n\n| | `assert_redirected_to :controller => :task, :action => :show,\
  \ :id => 3` |\n\n那么如果控制器中指定的实际重定向 URL 也使用哈希值，Rails 测试将仅检查你在断言中实际使用的键，允许你检查部分匹配。然而，如果实际的重定向\
  \ URL 是通过命名路由或 RESTful 路由机制指定的，Rails 将强制要求精确匹配。\n\n你可以针对命名路由或 RESTful 路由方法进行检查：\n\
  \n| | `assert_redirected_to new_task_url` |\n\n或者一个对应于 RESTful 路由的对象：\n\n| | `assert_redirected_to\
  \ @task` |\n\nRails 控制器测试**不会**——重复一遍，**不会**——跟随重定向。你编写的任何数据验证测试都仅适用于重定向发生之前的方法。如果由于某些原因你需要测试跟随重定向，诚挚地邀请你在集成测试中尝试某些操作；请参见\
  \ *使用集成测试测试工作流* 章节。\n\n## 注意事项：需要登录\n\n这是一件在我身上发生频率令人困扰的事情。在需要用户登录的网站上，我通常会在添加要求登录的过滤器之前先编写一些代码，通常是为了在强制执行安全性之前确保网站架构是正确的。我为\
  \ Devise 添加了 `before_filter :authenticate_user!` 行，然后砰——所有的控制器测试都失败了，因为测试没有有效的登录，它们被重定向离开了控制器。似乎我记住为什么发生这种情况花费总是比应该的要长（因为现在现在这应该只需要大约十秒）。总结一下，记得在设置块中放入\
  \ `Devise::TestHelpers`。\n\n# 测试返回的数据\n\nRails 允许你通过之前提到的四个集合验证控制器生成的数据：`assigns`、`session`、`cookies`\
  \ 和 `flash`。在这些集合中，`assigns`（控制器中创建的实例变量的哈希）是最常用的。一个典型的用法可能如下：\n\n| | `test \"should\
  \ show task\" do` |\n|---|---|\n| | `get :index, :id => @task_1` |\n| | `assert_response\
  \ :success` |\n| | `assert_equal @task_1.id, assigns(:task).id` |\n| | `assert_equal\
  \ \"task/show\", session[:last_page]` |\n| | **end** |\n\n`cookies` 和 `flash` 变量的使用方式类似，尽管我不经常为\
  \ flash 编写测试。\n\n在控制器中测试模型数据时，请记住你不想重复实际的模型测试，你绝对也不希望控制器测试取代模型测试。在模型测试中测试模型更为简单且有效。请参见\
  \ *测试项目视图：测试的级联* 章节，了解如何在测试驱动开发过程中交替进行控制器和模型测试。\n\n### 是否使用 Mock（模拟）\n\n虽然你想制作并覆盖控制器特有的错误情况，但你不需要测试模型所有的错误和路径：再次，这最好在模型测试中管理。然而，你确实想要验证控制器获取了预期的对象。在许多情况下，知道控制器对象调用了预期的模型方法并设置了预期变量就足够了。由于模型测试了模型方法的结果，知道以预期的参数调用该方法即可验证控制器的状态。\n\
  \n这是 Mock 对象一个潜在的绝佳用途。Mock 对象测试在*使用 Mock 对象*章节中会有更详细的介绍，但这里有一个使用 Ruby Mock 工具 Mocha\
  \ 进行控制器测试的示例：\n\n```\ntest \"should show task\" do\n  task = Task.new\n  Task.expects(:find).with(1).returns(task)\n\
  \  get :show, :id => 1\n  assert_response :success\n  assert_equal task, assigns(:task)\n\
  end\n```\n\n\n\n\n# 测试预期\n\n`Task.expects` 行包含两个独立的函数：\n\n*   存根函数（stub function）。它通过绕过真实的\
  \ `find` 方法，以便当对象接收到 `find(1)` 调用时，将返回 `task` 而不调用实际的 `Task.find` 方法。注意，这完全跳过了数据库。\n\
  *   模拟函数（mock function）它它设置一个预期，即在此测试期间 `find(1)` 将恰好被调用一次。如果该方法没有被调用，测试将失败。\n\n\
  这样做的结果是，你可以测试控制器的行为，而无需担心模型实现的细节——事实上，你甚至可以在模型方法写出来之前就测试控制器。这也有一个缺点，是任何 mock 测试的共有问题。设置\
  \ mock 可能非常耗时且脆弱，而且如果你从 mock 返回的对象与真实方法不匹配，你可能会掩盖控制器或视图中的错误。\n\n一种折中方案是**间谍（spy）**的概念，Double\
  \ Ruby mock 对象框架允许了这种操作。基本上，你可以识别出感兴趣的模型方法，然后设置一个断言，确认该方法确实被调用过。在 Double Ruby 语法中，测试可能所示：\n\
  \n| 行 1 | `test` `\"should show task\"` `do` |\n| :--- | :--- |\n| 2 | `stub.proxy(Task).find('1')`\
  \ |\n| 3 | `get :show, :id => 1` |\n| 4 | `assert_response :success` |\n| 5 | `assert_received(Task)\
  \ { |t| t.find('1') }` |\n| 6 | `assert_equal task, assigns(:task)` |\n| 7 | `end`\
  \ |\n\n这段代码片段中有两个特殊行。在第 2 行，创建了一个名为代理（proxy）的特殊 Double Ruby 结构。在这里，它只是正常地调用方法，但将该方法标记为\
  \ Double Ruby 需要跟踪的对象。由于 Double Ruby 现在正在跟踪该方法的调用，你可以根据方法的计数进行断言，在本例中，是断言 `Task`\
  \ 类确实接收到了 `find('1')` 方法调用。我认为这是在真实 mock 和在控制器中实际测试模型方法之间取得折中的一种很好的方法。\n\n关于 mock\
  \ 对象测试的成本和收益，更多内容请参阅章节 Using Mock Objects。另外，请查看 Stubs 章节，其中介绍了如何使用 mock 对象来增强对标准\
  \ Rails scaffold 生成的代码中失败状态的测试覆盖。\n\n## 测试路由\n\n尽管 Rails 路由的基础非常简单，但自定义 Rails 对\
  \ URL 响应的愿望可能会导致在 URL 和 Rails action 之间转换时，应用程序具体会做什么产生困惑。Rails 提供了两个核心方法，你可以用来指定或验证路由行为。\n\
  \n这两个 Rails 方法 `assert_generates` 和 `assert_recognizes` 是互为镜像的。让我们按字母顺序来看它们。\n\n\
  `assert_generates` 方法接受预期的路径字符串作为第一个元素，并将键值对哈希值作为第二个元素。如果 Rails 路由器会将键值对转换为预期的字符串，则测试通过——它执行的是字符串比较。这里有一个一个来自\
  \ Huddle 的示例：\n\n| | `assert_generates \"/status_reports/1\"`, |\n| :--- | :---\
  \ |\n| | `{:controller => \"status_reports\", :action => \"show\", :id => \"1\"\
  }` |\n\n在这种情况下，Rails 针对哈希运行路由器并将其与字符串进行比较。\n\n反方法 `assert_recognizes` 翻转了参数的顺序，也翻转了执行过程。\n\
  \n| | `assert_recognizes {:controller => \"status_reports\",` |\n| :--- | :--- |\n\
  | | `:action => \"show\", :id => \"1\"}, \"/status_reports/1\"` |\n\n在这种情况下，第二个参数通过\
  \ Rails 路由器运行，将其转换出的参数与第一个参数中的哈希进行比较。\n\n`assert_recognizes` 的参数更具灵活性。第二个参数也可以包含两个键的哈希：`:path`\
  \ 键和 `:method` 键，这允许你像这样测试 RESTful 路由：\n\n| | `assert_recognizes {:controller =>\
  \ \"status_reports\",` |\n| :--- | :--- |\n| | `:action => \"update\", :id => \"\
  1\"},` |\n| | `{:path => \"/status_reports/1\", :method => :put}` |\n\n为了该测试目的，第一个参数可以写为\
  \ RESTful 方法或命名路由方法，尽管我不清楚这为什么是一项改进：\n\n| | `assert_recognizes new_status_report_url,\
  \ 'status_reports/new'` |\n\n如果你想测试将作为 RESTful 方法或命名路由方法的项，尽管我不清楚这为什么是一项改进：\n\n\
  | | `assert_recognizes {:controller => \"status_reports\",` |\n| :--- | :--- |\n\
  | | `:action => \"update\", :id => \"1\"},` |\n| | `{:path => \"/status_reports/1\"\
  , :method => :put}` |\n\n| | `assert_generates \"/status_reports/1\",` |\n\n\n\n\
  \n*   验证视图层运行过程中没有错误。这当然是你对一个视图测试（view test）所要求的最低限。尽管如此，如果你知道视图的每个分支实际上都能运行，你就可以避免在生产部署时出现尴尬。\n\
  *   验证控制器收集的数据在视图中是否以预期的方式表示。你可能特别想要测试任何依赖于特定数据存在与否的视图逻辑是否按预期工作。\n*   验证基于安全性的输出；例如，管理员在页面上可能有允许其进入编辑模式的链接。或者用户可能可以编辑自己的帖子，但不能编辑其他用户的。以此类推。\n\
  \n在 Rails 本身中，视图测试不应尝试执行以下任何操作：\n\n*   验证响应的精确文本或 HTML 标记。这很容易受到随机变化的影响而失效。\n* \
  \  验证网站面向用户的视觉效果。即使你能找到一种在 Rails 中自动完成此操作的合理方法，它同样太容易坏了。其他工具（如 Selenium）可以处理这类测试。\n\
  \n## 成功视图测试的关键\n\n前一节中的列表表明，视图测试与模型或控制器测试有所不同。视图测试比模型或控制器测试更具印象派。为了保持视图测试的可控性，你需要假设\
  \ HTML 始终符合测试的初意。也就是说，如果你正在测试一个 DOM ID 为 `project_description` 的元素是否存在，那么为了你的脑健康，你需要假设该\
  \ DOM ID 的内容实际上与项目描述相关，而不是，比如，月相。\n\n考虑到这一点，以下是在编写视图测试时保持关注重点不偏离的一些指南：\n\n尽量不要测试\
  \ HTML 标签中特定内联文本（inner text）的存在。如果你觉得有必要进行这种双重检查，那么很可能是你的测试过于具体了。不过，测试更通用的正则表达式匹配有时是有用的。你可能倾向于说，如果你正在测试一个你已经在测试数据中专门创建的字段的精确内容，那么测试\
  \ HTML 标签的内联文本是可以接受的。也许吧，但当某人决定在实际文本字段中加入“出生日期”短语而你不得不修复大量测试时，请别怪我。你比我更了解你的代码，但我看过这种电影了，它很少有完满的结局。\n\
  \n相反，要在语义层上测试视图。在 HTML 标签上随处放置 DOM ID，并测试具有预期 DOM ID 的标签是否存在。或者，考虑使用描述输出语义角色的 CSS\
  \ 类进行标记，即使该 CSS 类没有关联特定的样式（例如，给表格的所有数据行赋予一个 `data_row` CSS 类）。这让你能够验证输出的结构，而不会被内容所困。额外的\
  \ DOM ID 还有助于随后的 Ajax、CSS 和浏览器调试。\n\n测试 DOM ID 的唯一例外是表单元素；你可以使用它们的 `name` 属性来测试它们（这允许你直接验证随后的\
  \ POST 调用中的键）。你甚至可以测试 `value` 属性，至少有时可以。\n\n除了测试响应中包含什么，测试响应中不包含什么也是非常有用的，特别是当处理具有不同角色因此具有不同输出的用户时\n\
  \n### 验证 HTML\n\n`assert_select` 的一个非常强大的附加好处是，该方法会解析 HTML 并在 HTML 格式不规范时发出警告——例如，缺少结束标签。（不幸的是，警告信息不带堆栈跟踪，因此如果在你的测试套件中间突然弹出警告，可能很难追踪。）由于这个原因，即使你没有在调用中进行任何其他验证，在输出上运行\
  \ `assert_select` 也是有价值的。如果你更正式地测试有效标记，可以查看 GitHub 上的 `html_test` 插件。\n\n## 使用 assert_select\n\
  \n`assert_select` 方法是一种验证 HTML 内容的强大且灵活的方法。我们使用 CSS 选择器的语法来指定在输出中要查找的 HTML 结构。`assert_select`\
  \ 方法会自动查看 `@response.body` 以找到要测试的输出。一旦你找到了匹配的结构，就可以进一步测试结构的内容或找到匹配的数量。`assert_select`\
  \ 的基本结构在验收测试框架 Webrat 和 Capybara 中被复制并略有不同；请参见章节 *使用 Webrat 和 Capybara 编写更好的集成测试*\
  \ 。\n\n`assert_select` 最简单的用法仅仅是测试特定 HTML 标签是否存在：\n\n| | `assert_select(\"form\"\
  )` |\n\n如果响应正体中至少存在一个 HTML `form` 元素，则该断言为真。（顺便说一下，标签选择器必须是字符串，而不是符号。）\n\n有三种方法可以让\
  \ `assert_select` 测试更具体。你可以使用各种 CSS 样式的语法装饰来增强选择器，你可以指定标签的内容，还可以根据选择器和内容指定应该存在的匹配标签数量。或者你可以三者都做。\n\
  \n这三个选项中最不复杂的是指定标签的内容。如果 `assert_select` 的下一个参数是字符串或正则表达式，那么只有当至少存在一个内部内容与参数匹配的\
  \ HTML 标签时，该断言才为真。字符串参数必须精确匹配内容。正则表达式参数必须 `=~` 匹配内容。以下两个示例都匹配 `<span>Happy Birthday</span>`：\n\
  \n| | `assert_select(\"span\", \"Happy Birthday\")` |\n| | `assert_select(\"span\"\
  , /Birthday/)` |\n\n如果选择器之后的第二个参数是数字或范围（range），则测试将验证响应中匹配元素的数量是该数字或在该范围内。在实践中，我使用它来验证例如索引视图中的表格是否为每个显示的元素有一行：\n\
  \n| | `assert_select(\"tr\", 5)` |\n| | `assert_select(\"tr\", 2..3)` |\n\n你也可以使用\
  \ `true` 和 `false` 作为第二个参数编写测试`true` 表示默认的“一个或多个”行为，而 `false` 表示没有匹配的元素：`assert_select(:form,\
  \ false)`。一种常见的场景是视图为不同用户显示不同的文本元素。仅测试选项的存在会给测试留出漏洞：一个始终显示所有选项的视图将通过测试。测试不应存在的文本的不存在会暴露那个特定的\
  \ bug。\n\n如果你想大胆地同时指定文本和计数，最后一个参数是一个哈希（hash）或键值对。`:text` 和 `:count` 键匹配你已经看到的功能：\n\
  \n| | `assert_select(\"span\", :text => \"User Name\", :count => 5)` |\n\n我个人觉得键更具可读性，即使在只指定一个选项时我也倾向于使用它们。你还可以使用\
  \ `:minimum` 和 `:maximum` 键指定范围行为。\n\n这让我们变成了修改选择器。有很多不同的选择器修饰符，许多并不经常使用。这些修饰符分为五类，将在接下来的章节中描述。\n\
  \n### 指定元素的 DOM ID\n\n\n\n\n\n你可以使用 `#` 配合 DOM ID 来指定元素，例如 `\"div#user_name_3\"\
  `。如果你愿意，可以省略 HTML 标签；`\"#user_name_3\"` 会匹配任何具有该 ID 的 DOM 元素，无论标签类型为何。在任何 `assert_select`\
  \ 选择器中，`?` 的行为类似于它在 ActiveRecord SQL 条件字符串中的行为，作为稍后指定值的占位符。因此，使用 Rails 的 `dom_id`\
  \ 方法指定元素的常见用例可以写如下：50\n\n|   | `assert_select(\"div#?\", dom_id(@user, :name))`\
  \ |\n\n这比通过重复哈希符号来插值字符串通常更易读。如之前提到的，我建议经常对 ID 进行测试。\n\n### 指定元素的 CSS 类\n\n可以使用 `.`\
  \ 来指定所搜索元素的 CSS 类，例如 `\"div.headline\"`。同样，你可以省略 HTML 标签。除了查看的是类而非 ID 之外，其行为与之前描述的完全相同。\n\
  \n### 指定任意 HTML 属性的值\n\n可以让 `assert_select` 方法查找任意 HTML 属性。这在搜索 `input` 标签的 `name`\
  \ 属性时最有用。其他非人为的示例包括 `form` 标签的 `action` 属性、`img` 标签的 `src` 属性以及 `a` 标签的 `href` 属性。基本语法如下：\n\
  \n|   | `assert_select(\"input[name=user_id]\")` |\n\n注意在使用 Rails 命名规范测试表单时，你可能需要使用\
  \ `?` 语法来处理名称实际包含括号的情况；否则，可以将整个名称放在引号中：\n\n|   | `assert_select(\"input[name=?]\"\
  , \"user[email]\")` |\n\n|   | `assert_select(\"input[name='user[email]']\")` |\n\
  \n`=` 运算符表示与属性值精确匹配。`=` 有几个修饰符可以实现不同的匹配行为。我最常用的是 `*=`，如果属性值包含指定的文本，则为真，例如 `assert_select(\"\
  input[name *= email]\")`。你也可以使用 `^=` 和 `$=` 分别表示“开头于”和“结尾于”。\n\n### 使用伪类\n\n选择器中可以添加多个伪类修饰符，包括以下：\n\
  \n|   | `assert_select(\"div:first-child\")` |\n\n|   | `assert_select(\"div:last-child\"\
  )` |\n\n|   | `assert_select(\"div:only-child\")` |\n\n|   | `assert_select(\"div:nth-child(3)\"\
  )` |\n\n|   | `assert_select(\"div:nth-last-child(3)\")` |\n\n为了消除任何疑惑：你应该将这些读为“作为其父元素第一个孩子的\
  \ div 元素”，而不是“div 元素的第一个子元素”。我在测试特定顺序的输出（例如排序后的列表）时，发现这些非常有帮助。测试 `\"li:nth-child(2)\"\
  ` 比尝试通过正则表达式提取所有列表元素文本并测试结果列表中的元素要容易得多。此外，注意这些伪类名称中使用是连字符而不是下划线。我似乎总是会把它们打成下划线，然后在伪类无法被识别时感到惊讶。\n\
  \n这些每一项都有更具体的修饰符，将 `child` 替换为 `of-type`，例如 `first-of-type`，这意味着匹配的标签必须是其同类型 HTML\
  \ 兄弟元素中的第一个。将 `div:first-of-type` 读为“作为其父元素中第一个 div 元素的 div 元素”。（我需要提到你可以使用任何数字作为\
  \ nth 修饰符的参数吗？）\n\n其他不属于“第一个/最后一个/唯一”类的修饰符还包括：\n\n|   | `assert_select(\"div:root\"\
  )` |\n\n|   | `assert_select(\"div:empty\")` |\n\n|   | `assert_select(\"div:not(.headline)\"\
  )` |\n\n列表中的第一个修饰符检查一个给定类型且恰好是根元素的元素。第二个查找空标签，而 `not` 修饰符查找不匹配给定选择器的该类型元素——在这种情况下，即一个不具有\
  \ CSS 类 `headline` 的 `div` 元素。我倾向于认为前两个对于实用的测试来说过于琐碎，但我确定在某处一定有价值的用例。`not` 对于负向测试很有帮助。\n\
  \n### 组合多个选择器\n\n你可以使用 `assert_select` 测试不同标签的组合。同样，语法与标准 CSS 类似。\n\n|   | `assert_select(\"\
  div.headline span\")` |\n\n该代码段找到所有类为 `headline` 的 `div` 的 `span` 元素。在两者之间放置 `>`\
  \ 运算符意味着第二个元素必须是第一个元素的直接子。`+` 运算符意味着第二个元素紧随第一个之后，而 `~` 运算符意味着第二个元素位于第一个之后的某个。这种模式非常常见，以至于有一个快捷方式，通过传递一个不接受参数的块来实现：\n\
  \n```\nassert_select(\"div.headline\") do\n  assert_select(\"span\")\nend\n```\n\
  \n在这种情况下，块内调用的任何 `assert_select` 方法会自动应用于所有匹配元素，并且必须通过所有元素，整个断言才能通过——这意味着此片段与上一个完全等价，且都验证了每个\
  \ `div.headline` 元素至少包含一个 `span` 元素。接受参数的形式更有灵活性，尽管诚实说，我使用 `assert_select` 多多年并没有需要这种灵活性——坦率地说，甚至不知道这种灵活性的存在。如果你需要更大的灵活性，`assert_select`\
  \ 还会返回相同的匹配数组，因此相同的测试可以写成这样：\n\n```\nmatching_elements = assert_select(\"div.headline\"\
  )\nmatching_elements.each do |element|\n  assert_select(element, \"span\")\nend\n\
  ```\n\n\n\n\n\n测试发送的邮件的过程与视图测试（view testing）密切相关。通常，你感兴趣的是验证两部分独立的逻辑：首先，你的应用程序是否在预期时发送了邮件；其次，邮件内容是否是你所想要的。Rails\
  \ 的 `ActionMailer` 具有某种间接性，使得测试测试比想象中没那么直观，但并不困难。本节假设你正在使用 `ActionMailer`——如果你正在使用第三方工具管理邮件，你可能需要寻找不同的测试方法。\n\
  \n要在 Rails 中测试邮件，请配置你的测试环境，使 `ActionMailer` 将邮件保存在一个可查询的数据结构中，而不是实际发送它们。这一步应该在 Rails\
  \ 的 `config/environments/test.rb` 文件中由你完成：\n\n|   | `config.action_mailer.delivery_method\
  \ = :test` |\n\n记住在你的测试设置中加入下一行；这样做可以确保存储邮件的数据结构被清空。否则，来自其他测试的邮件将遗留，并导致你的测试结果无效：\n\
  \n|  | `ActionMailer::Base.deliveries.clear` |\n\n你可以创建的最快速邮件测试是检查邮件是否已发送。`ActionMailer::Base.deliveries.size`\
  \ 方法返回自上次清空 `ActionMailer::Base.deliveries` 对象以来发送的邮件数量。因此，确定邮件是否已发送的一种简单方法就是查询它：\n\
  \n|  | `assert_equal 1, ActionMailer::Base.deliveries.size` |\n\nRails 提供了一个类似于\
  \ `assert_difference` 的快捷方法。该方法接收一个块（block），并确定执行该块期间发送了多少邮件：\n\n|  | `assert_emails\
  \ 1` `do` |\n\n|  | `get :forgot_password` |\n\n|  | `end` |\n\n`assert_emails`\
  \ 方法的参数是断言通过所需的块中邮件数量。`assert_emails` 方法并不依赖于 `clear` 方法是否被调用；它会在块执行前后对计数进行自行跟踪。还有一个\
  \ `assert_no_emails`，它等同于 `assert_emails(0)`。\n\n如果你想指定邮件消息的内容而不仅仅是数量，Rails 提供了\
  \ `assert_select_email` 方法，你可以这样使用它：\n\n|  | `assert_select_email` `do` |\n\n| \
  \ | `assert_select \"div\", :text => \"Email Reset\"` |\n\n|  | `end` |\n\n`assert_select_email`\
  \ 允许你执行 `assert_select` 断言，这些断言将应用于 `ActionMailer::Base.deliveries` 仓库中每封邮件体。所有邮件都通过块中的断言，整个测试才能通过。此方法仅在你发送的邮件内容类型为\
  \ `text/html` 时才有效，这是一个很大的限制。\n\n你可以直接使用下面的代码来测试已发送邮件的功能：\n\n|  | `email = ActionMailer::Base.deliveries.first`\
  \ |\n\n|  | `assert_equal \"Forgot Password Notice\", email.subject` |\n|  | `assert_equal\
  \ @user.email, email.to` |\n\n|  | `assert_match /new password/, email.body` |\n\
  \n基础访问器（accessors）有预期的名称。你可以在 [`guides.rubyonrails.org/action_mailer_basics.html`](http://guides.rubyonrails.org/action_mailer_basics.html)\
  \ 更多关于如何检查邮件对象的信息。\n\n在 Rails 核心之外，Shoulda 提供了几个测试邮件的辅助方法；这些在 Shoulda Assertions\
  \ 部分进行了描述。不过，测试邮件的最稳健方法与 RSpec 相关（参见章节 RSpec），并且与 Cucumber 配合得也非常好（参见章节 Acceptance\
  \ Testing with Cucumber）。`email-spec` 库提供了许多非常有用的辅助方法。大多数情况下，它们是执行我们已经检查过的测试的良好的\
  \ RSpec 方式，但该库还提供了跟踪邮件中的链接返回网站的能力，这对于包含邮件的用户交互的验收测试非常有帮助。该库的主页是 [`github.com/bmabey/email-spec`](http://github.com/bmabey/email-spec)。\n\
  \n## 测试辅助方法 (Testing Helpers)\n\n辅助方法是大多数 Rails 应用的“储藏室”。通常，辅助模块包含可重用的视图逻辑片段，例如控制打印什么输出或根据模型数据更改显示的逻辑。在实践中，辅助模块倾向于填充各种似乎不属于任何地方的杂物。糟糕的是，由于\
  \ Rails 测试辅助方法的机制功能薄弱且宣传不足，即使辅助方法中包含大量逻辑，通常也往往不会测试。\n\n遗憾的是，辅助方法在 Rails 的 MVC 模式结构中占据了一个相当模糊的位置。辅助方法某种位于视图层，但它们经常被用作视图和模型之间、甚至是视图和控制器之间的通道。辅助方法测试与模型测试有许多共同点——例如，单个辅助方法可以逐一个地进行单元测试。\n\
  \n在 Rails 2.2 中，模板中存储输出流的私有变量 `_erbout` 被更改为了公共实例变量。这一变化在 `_erbout` 直接相关的范围之外引起了很小的动静，但它产生了两个非常好的效果。它允许从辅助方法直接将文本注入\
  \ ERb 输出中，而无需处理块变量，而且使得测试块辅助方法变得更加容易。\n\n\n\n\n\n块辅助器（block helper）是一种辅助函数，当它在 ERb\
  \ 文件中被调用时，会接收一个由 ERb 文本组成的块。块辅助器的两种常见用途是：作为访问控制，即通过辅助函数中的逻辑决定块中的代码是否被执行；二是作为 HTML\
  \ 的封装代码，用于包裹不同类型的文本——例如圆矩形效果。\n\n这里有一个块辅助器的小示例：\n\n| | `def if_logged_in` |\n| |\
  \ `yield` if `logged_in?` |\n| | `end` |\n\n它的调用方式如下：\n\n| | `<% if_logged_in do\
  \ %>` |\n| | `<%= link_to \"logout\", logout_path %>` |\n| | `<% end %>` |\n\n你可以这样对其进行测试（在\
  \ Rails 2.2 及更高版本中）：\n\n| | `test \"logged_in\" do` |\n| | `assert !logged_in?`\
  \ |\n| | `assert_nil(if_logged_in {\"logged in\"})` |\n| | `login_as users(:quentin)`\
  \ |\n| | `assert logged_in?` |\n| | `assert_equal \"logged in\", if_logged_in {\"\
  logged in\"}` |\n| | `end` |\n\n我们在这里利用的是：块的最后一个值变为块的返回值，进而变为方法的最后一个值，最后成为方法的返回值。因此，如果没有用户登录，块就不会触发，方法返回\
  \ `nil`。如果用户已登录，那么传递给块的任何内容（在此例中为字面字符串 `logged in`）都是辅助函数的返回值。\n\n这对于直接将值连接到 ERb\
  \ 流中的辅助函数同样有效。这个有些刻意的辅助函数：\n\n| | `def make_headline` |\n| | `concat(\"<h1 class='headline'>#{yield}</h1>\"\
  )` |\n| | `end` |\n\n测试用例：\n\n| | `test \"make headline\" do` |\n| | `assert_dom_equal(\"\
  <h1 class='headline'>fred</h1>\",` |\n| | `make_headline {\"fred\"})` |\n| | `end`\
  \ |\n\n再次，我们利用了 `concat` 返回最终字符串并将其放入 ERb 输出的特性。在使用这种测试时要小心：你实际上并没有在测试 ERb 的输出——而是在测试辅助方法的返回值。\n\
  \n如果这还不够，你其实利用 `concat` 将文本添加到输出缓冲区的特性（你也可以测试中访问该缓冲区），来实际测试 ERb 输出：\n\n| | `test\
  \ \"make headline with output buffer\" do` |\n| | `make_headline {\"fred\"}` |\n\
  | | `assert_dom_equal(\"<h1 class='headline'>fred</h1>\", output_buffer)` |\n| |\
  \ `end` |\n\n在此测试中，辅助函数的调用将文本放置在 `output_buffer` 中，然后在测试的最后一行对其进行验证。`assert_dom_equal`\
  \ 方法测试两个 HTML 字符串是否等效，即使它们的属性列表构建方式不同。\n\n## 在辅助函数测试中使用 assert_select\n\n输出缓冲区技巧很奇妙，但如果能将\
  \ `assert_select` 的完整灵活性应用到输出上，就更好了。在通常情况下，`assert_select` 查看 `@response.body` 以获取要解析的文本。有两种绕过限制的方法：你可以伪造一个\
  \ `@response.body` 对象，或者让 `assert_select` 指向任意字符串。\n\n任意字符串机制可能更简单——在你的 `test/test_helper.rb`\
  \ 中包含以下方法：\n\n| | `def assert_select_string(string, *selectors, &block)` |\n| |\
  \ `doc_root = HTML::Document.new(string).root` |\n| | `assert_select(doc_root, *selectors,\
  \ &block)` |\n| | `end` |\n\n该方法创建了一个 HTML 选择器对象，Rails 接受其作为 `assert_select` 的第一个选择参数。使用该方法所示：\n\
  \n| | `test \"make headline with response body\" do` |\n| | `assert_select_string(display_name(user)\
  \ \"div.first_name\")` |\n| | `end` |\n\n在其他情况下，你可能需要完整的控制器设置，因为你正在测试会话逻辑。你也可能想直接调用\
  \ `assert_select`。如果是，你可以轻松添加控制器设置。将此模块放在某处，然后引入它代替 `action_view/test_case`：\n\n\
  [huddle/test/helper_test_case.rb](http://media.pragprog.com/titles/nrtest/code/huddle/test/helper_test_case.rb)\n\
  \n| | `require 'action_view/test_case'` |\n| | |\n| | `module ActionView` |\n| |\
  \ `class TestCase` |\n| | |\n| | `setup :setup_response` |\n| | `def setup_response`\
  \ |\n| | `@output_buffer = \"\"` |\n| | `@request = ActionController::TestRequest.new`\
  \ |\n| | `@response = ActionController::TestResponse.new` |\n| | `@session = {}`\
  \ |\n| | `@request.session = @session` |\n| | `end` |\n\n```ruby\nrequire 'action_view/test_case'\n\
  \nmodule ActionView\n  class TestCase\n    setup :setup_response\n    def setup_response\n\
  \      @output_buffer = \"\"\n      @request = ActionController::TestRequest.new\n\
  \      @response = ActionController::TestResponse.new\n      @session = {}\n   \
  \   @request.session = @session\n    end\n\n    def assert_select_string(string,\
  \ *selectors, &block)\n      doc_root = HTML::Document.new(string).root\n      assert_select(doc_root,\
  \ *selectors, &block)\n    end\n  end\nend\n```\n\n\n\n\n然而，复杂的视图逻辑应该移动到辅助函数（[[51]](#f_0080.html_FOOTNOTE-51)）中，这样更容易测试；请参见测试辅助函数章节。严格的\
  \ TDD 流程在视图层往往会略微打折扣。对我来说，视图编程有时感觉更具探索性，因此我通常会先写一点视图代码，然后循环回来编写测试。只要测试与代码之间的反馈足够紧密，这个过程就不会对你产生伤害。视图测试也可以在集成测试层中使用\
  \ Cucumber 进行管理（参见章节使用 Cucumber 进行验收测试）或使用 Rails 集成测试；请参见章节使用集成测试的工作流。找到一种最适合你的工作流即可。\n\
  \n### 脚注\n\n| [[50]](#f_0074.html_FNPTR-50) | 请记住，你需要在测试类中 `include ActionView::Helpers::RecordIdentificationHelper`\
  \ 才能使用 `dom_id`。 |\n\n| [[51]](#f_0080.html_FNPTR-51) | 许多第三方工具将辅助函数概念扩展为名为 Presenter（演示器）的完整对象，它有效地在视图和一个或多个模型之间进行协调。\
  \ |\n\nCopyright © 2011, The Pragmatic Bookshelf.\n\n# 第 10 章\n\n测试 JavaScript 和\
  \ Ajax\n\n我已经进行过多次这样的对话：\n\n我：\n\n你们使用什么测试工具？\n\n别人：\n\n噢，你懂的，Shoulda，factory_girl。\n\
  \n我：\n\n你们测试视图吗？\n\n别人：\n\n有时吧。在需要的时候。\n\n我：\n\n你们怎么测试 Ajax 的？\n\n别人：\n\n[带着无奈的表情]\
  \ 我们不测。\n\n公平地说，有时角色会反过来，变成由我发现我们没有测试 JavaScript。\n\n说真的，你能怪我我吗？测试 JavaScript 和\
  \ Ajax 是一件苦差。首先，JavaScript 经常是……嗯，是用 JavaScript 写的。它是一门很好的语言，但从历史上看，它的测试框架支持和投入程度远比不上\
  \ Ruby[[52]](#f_0087.html_FOOTNOTE-52)。不仅如此，Ajax 动作通常只发生在浏览器中。如果动作只存在于视图层，那么对于用户测试来说，很难提取出来。此外还有整个浏览器依赖性的问题。很难怪某人直接放弃整套测试而只管写代码。\n\
  \n然而，随着越来越多的应用程序逻辑移动到浏览器以创建酷炫且实用的用户体验，让这些代码不测试将变成一个越来越大的风险。在本章中，我们将介绍在 Rails 应用程序内部测试\
  \ JavaScript 和 Ajax 的策略和工具。\n\n这并不是一份所有可能的 JavaScript 工具的完整指南；我们没有足够的空间。本章概述的工具结构是我取得过某些成功的方法之一，我认为你也可以取得成功。本章描述的工具链的优势在于，它允许你既可以在浏览器中测试\
  \ Ajax，也可以作为常规命令行 Ruby 测试的一部分来测试它。在 Rails 应用程序之外，你还应该考虑像 Selenium 这样的浏览器级验收工具作为测试整个\
  \ Web 应用程序的方法。\n\n## 首先，RJS\n\n即使在以对新工具喜幻无常而闻名的 Rails 社区中，Ruby JavaScript (RJS)\
  \ 从“一种编写 Ajax 的酷炫新工具”到“使用该工具是一种略显尴尬的承认，你不喜欢写 JavaScript”的兴衰似乎发生得很快。RJS 出现时，JavaScript\
  \ 工具包是如此笨拙，以至于增加一次潜在的额外服务器调用并用 Ruby 编写简单的客户端命令以避免编写可怕的 JavaScript 是很有意义的。从那时以后，JavaScript\
  \ 工具已经取得了实质性的进展，非侵入式 JavaScript 的理念已经流传，Ruby 和 Rails 社区也越来越习惯于在 JavaScript 中编写更复杂的客户端交互，所有这些因素共同使得\
  \ RJS 充其量是多此一举了。\n\n尽管如此，对于处于有限的 RJS 功能集之内的快速 Ajax 功能，RJS 仍然很好用，这些功能简单到不需要整个 JavaScript\
  \ 框架的重量，例如根据当前的服务器数据对页面上的特定点进行简单的动态更新。此外，由于 RJS 本质上是 Rails 控制器动作执行的，它比仅存在于浏览器中的其他\
  \ JavaScript 更测试得多。此外，旧的 Rails 项目可能仍然有一些你可能想要纳入测试范围的 RJS。\n\n测试 RJS 的首选武器是 `assert_select_rjs`\
  \ 方法。这个方法并不像想象中那么像普通的 `assert_select`。`assert_select_rjs` 用的含义略微取决于调用该方法时参数的数量。在我认为的标准调用方式中，它接收两个参数，第一个是匹配现有\
  \ RJS Rails 方法的符号，第二个是 DOM ID。\n\nDOM ID 可以是静态的，也可以是计算的，例所示：\n\n| | `assert_select_rjs\
  \ :replace, dom_id(@project)` |\n\n如果涉及的控制器调用返回一个 RJS JavaScript 代码段，并且该代码段包含对 RJS\
  \ `replace` 方法的调用，其 DOM ID 与 `dom_id(@project)` 匹配，则该断言通过。\n\n```ruby\nassert_select_rjs\
  \ :replace, dom_id(@project)\n```\n\n`assert_select_rjs` 中的断言可以变得更弱。如果没有方法符号，对 DOM\
  \ ID 的任何 RJS 调用都会通过。但显然，如果你能指定发送回客户端的 HTML 细节，那么 RJS 断言将更有价值，或者至少更详尽。为了管理这一点，你需要向\
  \ `assert_select_rjs` 传递一个块（block）。作为块容器，`assert_select_rjs` 的行为就像普通的 `assert_select`\
  \ 一样，这意味着你可以将 `assert_select` 调用放在块内部，它们将根据从 RJS 调用中提取的 HTML 进行求值。\n\n```ruby\n\
  assert_select_rjs :replace, dom_id(@project) do\n  assert_select \"div#project_name\"\
  , :text => @project.name\nend\n```\n\n除了测试 RJS 用的存在性外，前面的代码段还测试了用于替换现有文本的 HTML 包含一个以\
  \ `@project.name` 为内容的 `div` 元素。这对于任何与向浏览器发送文本相关的 RJS 调用都有效——例如，`remove` 就不需要块调用。\n\
  \n如果你恰好在使用 RJS，那么应该像测试视图一样样测试 RJS，由于 RJS 几乎总是意味着应用程序逻辑的变化，因此这意味着 RJS 调用几乎都应该有测试。\n\
  \n## 使用 Jasmine 从 Rails 测试 JavaScript\n\n\n\n\n当你不再需要 RJS 的辅助轮，开始骑上真正的 JavaScript\
  \ 这辆“大自行车”时，测试的局限性就显而易见了。许多 JavaScript 测试框架在浏览器中运行，这对于确保浏览器中的保真度很有帮助，但对于 TDD 风格的紧凑反馈测试来说，既慢又不方便。如果你能同时在这两种模式下工作……事实上，你可以使用一个名为\
  \ `Jasmine` 的 JavaScript BDD 测试框架，并配合一个在 Ruby 中封装 `Jasmine` 的 gem 以及另一个生成更美观命令行输出的\
  \ gem。\n\n如果你正在使用 `Jasmine`，那么使用非侵入式（unobtrusive）JavaScript Style 会让你感到许多，我将其定义为\
  \ JavaScript 与 HTML 标记分离。在编写非侵入式 JavaScript 时，HTML 页面主体不指定任何 JavaScript 行为。相反，事件处理程序被绑定到写在其他地方的\
  \ DOM ID 上，并在加载时注入页面。\n\n非侵入式样式有很多优点——总的来说，它让浏览器客户端 JavaScript 能够充分利用现代软件技术。对于我们这里，最大的优势是与\
  \ HTML 视图层分离的 JavaScript 更容易隔离和测试。\n\n## Jasmine 入门\n\nJasmine for Rails 以 gem 的形式分发，让你可以在\
  \ Rails 应用程序内部访问 `Jasmine` 测试框架。你可以通过 `gem 'jasmine'` 将 `Jasmine` 添加到你的 Gemfile\
  \ 中，然后使用 `bundle install` 确保一切准备就绪。安装 gem 后，你可以生成 Jasmine 文件：\n\n| | `% bundle exec\
  \ jasmine init` |\n| | `Jasmine has been installed with example specs.` |\n| | |\n\
  | | `运行服务器:` |\n| | |\n| | `rake jasmine` |\n| | |\n| | 使用 Selenium 运行自动化 CI 任务:`\
  \ |\n| | |\n| | `rake jasmine:ci` |\n\n在 Rails 2 中，启动命令是 `script/generate jasmine`。\n\
  \n在后台，`Jasmine` 创建了几个文件。它创建了一个 `spec/javascripts` 目录——即使你使用的是 `Test::Unit`，`Jasmine`\
  \ 也会创建一个 spec 目录。在该目录下，`Jasmine` 放置了一个示例文件 `PlayerSpec.js`（你不需要保留它），以及另外三个你需要保留的文件。`helpers/SpecHelper.js`\
  \ 文件是 Jasmine 对应的 `Test::Unit` 的 `test_helper.rb`，而 `support` 目录有一个 `jasmine_runner.rb`\
  \ 脚本和一个 `jasmine.yml` 配置文件。我们稍后会讨论配置文件。\n\n`Jasmine` 还向 `public/javascripts` 目录添加了两个示例文件，如果你不需要，同样可以删除。最后，它添加了一个\
  \ Rake 文件，定义了两个运行 Jasmine 的不同任务。\n\n## 运行 Jasmine 测试\n\n`Jasmine` gem 定义了两个允许你运行\
  \ `Jasmine` specs 的任务。第一个简单就是 `rake jasmine`。\n\n| | `$ `rake jasmine`` |\n| | 测试在这里:\
  \ |\n| | http://localhost:8888/` |\n\nRake 任务使用 Selenium 允许你在浏览器中运行测试。你只需要点击 Rake\
  \ 任务贴心提供的 [`localhost:8888`](http://localhost:8888) 地址，测试套件就会运行，如图 *Jasmine* 所示。[[53]](#f_0087.html_FOOTNOTE-53)\n\
  \n| ![jasmine.jpg](img/jasmine.jpg) |\n\n***\n\n**图 1. Jasmine**\n\n浏览器内显示显示了 Jasmine\
  \ 套件中的每一个测试——绿色表示通过，红色表示失败。点击任何测试或测试组都会重新运行这些测试。\n\n如果你想实际上从命令行运行测试，`Jasmine` 提供了\
  \ `rake jasmine:ci` 任务。取决于你对“命令行”的定义严格程度，此任务确实从命令行提示符运行。输出如下：\n\n| | `% rake jasmine:ci`\
  \ |\n| | `Waiting for jasmine server on 49421...` |\n| | `Some boring stuff` |\n\
  | | `==> Waiting for Selenium server on port 49427... Ready!` |\n| | `Waiting for\
  \ suite to finish in browser ...` |\n| | |\n| | `Player` |\n| | `- should be able\
  \ to play a Song` |\n| | `- tells the current song if the user has made it a favorite`\
  \ |\n| | |\n| | `Player when song has been paused` |\n| | `- should indicate that\
  \ the song is currently paused` |\n| | `- should be possible to resume` |\n| | |\n\
  | | `Player#resume` |\n| | `- should throw an exception if song is already playing`\
  \ |\n| | |\n| | `Finished in 0.048983 seconds` |\n\n你从会话记录无法看到的是，`Jasmine` 任务实际上打开了一个\
  \ Firefox 浏览器，在浏览器中运行测试并报告结果。\n\n\n\n\n| | `expect(num).toBeLessThan(value);` |\n\
  | | `expect(obj).toBeNull;` |\n| | `expect(obj).toBeTruthy;` |\n| | `expect(array).toContain(value);`\
  \ |\n| | `expect(obj).toEqual(value);` |\n| | `expect(str).toMatch(regex);` |\n\n\
  Jasmine 让添加自定义匹配器（matcher）变得简单。第一步是定义匹配器。你需要考虑两个不同的参数。实际值（即 `expect` 方法的参数）被暴露为\
  \ `this.actual`。任何你想作为匹配器逻辑的一部分传递给匹配器本身的参数，都可以直接作为普通的参数列表传递。匹配器函数在匹配通过时需要返回 `true`。因此，一个示例匹配器可能如下所示：\n\
  \n```javascript\nfunction(expected_name) {\n  return this.actual.name == expected_name;\n\
  }\n```\n\n要实际使用该匹配器，需要使用 `addMatcher` 函数将其注册到 Jasmine，该函数在任何 `before` 或 `it` 方法内部可用。可以像下面一样在\
  \ `addMatcher` 内部内联定义匹配器：\n\n```javascript\nbeforeEach(function() {\n  this.addMatchers({\n\
  \    toHaveTheName: function(expected_name) {\n      return this.actual.name ==\
  \ expected_name;\n    }\n  });\n});\n```\n\n当然，你并不非要内联定义匹配器函数。函数可以在任何地方定义、赋值给变量，并在\
  \ `addMatchers` 函数中引用。就此而言，这里的 `beforeEach` 也可以在辅助文件中全局定义。\n\n当然，说可以全局定义该方法引出了一个问题：Jasmine\
  \ gem 究竟是如何确定加载哪些文件的（包括测试文件和被测试的应用）。与从文件系统推断这些项目的 `Test::Unit` 和 `RSpec` 不同，Jasmine\
  \ gem 通过 `spec/javascripts/support/jasmine.yml` 文件中的项来确定测试套集的边界。\n\n在 `jasmine.yml`\
  \ 文件中你可以做的第一件事是指定要加载的 JavaScript 源库：\n\n[huddle3_rspec2/spec/javascripts/support/jasmine.yml](http://media.pragprog.com/titles/nrtest/code/huddle3_rspec2/spec/javascripts/support/jasmine.yml)\n\
  \n```yaml\nsrc_files:\n- public/javascripts/prototype.js\n- public/javascripts/effects.js\n\
  - public/javascripts/controls.js\n- public/javascripts/dragdrop.js\n- public/javascripts/application.js\n\
  - public/javascripts/**/*.js\n```\n\n这里的每一行都是不同的模式，任何匹配模式的 JavaScript 文件都会被加载并供\
  \ Jasmine 文件访问。文件按顺序加载的，这解释了为什么即使最后一行的通配符涵盖了所有文件，你仍然需要指定单独的文件。通过指定先加载哪些文件，你可以确保文件之间的任何依赖关系得到管理。\n\
  \n虽然 JavaScript 文件列表可能是你最需要修改的部分，但 `jasmine.yml` 文件还允许你指定用于 DOM 测试的 CSS 文件、带有（自定义匹配器函数的辅助文件，以及实际\
  \ Jasmine spec 文件的位置。\n\nJasmine 拥有一个非常灵活且功能丰富的 mock 框架，Jasmine 将其称为“间谍”（spies）。你使用\
  \ `spyOn` 方法声明一个间谍，该方法接受两个参数。第一个参数是对象，第二个参数是该对象响应的方法名称（字符串）。你也可以使用 Jasmine 的 `create_spy`\
  \ 方法声明一个空间谍。例如：\n\n```javascript\nvar User = {\n  username: 'zachp',\n  authenticate:\
  \ function(password) {\n    return someWebServiceCall(this.username, password);\n\
  \  },\n  authWithCallback: function(password, callbackFunction) {\n    if authenticate\
  \ {\n      return callbackFunction(password);\n    }\n  }\n};\n\ndescribe(\"user\
  \ stuff\", function() {\n  it('should call authenticate', function() {\n    var\
  \ myUser = Object.create(User);\n    spyOn(myUser, 'authenticate');\n    // ...\
  \ logic 继续\n  });\n});\n```\n\n\n\n\n\n这里的思路是编写一个脚本，其功能仅限于生成 HTML 并将其放入临时文件中，以便稍后由\
  \ Jasmine 加载。原始的 Pivotal 版本使用 `RSpec` 来实现此目的，其理论是这些文件将作为你常规测试套件的一部分被生成。但在这里 `RSpec`\
  \ 并没有什么神奇之处，仅仅是 `RSpec` 已经加载并准备好了 Rails 环境，以便于查询。你需要在任何 `RSpec` 规范文件、集成测试或类似内容中添加像下面下面的代码，以生成你希望在稍后的\
  \ Jasmine 测试中使用的 HTML。\n\n| | `save_fixture((response.body, 'body'), 'project_file')`\
  \ |\n\n`save_fixture` 方法是 JB 博客文章中的一个辅助方法，我在这里对其进行了细微的调整：\n\n| [`/huddle3_rspec2/spec/spec_helper.rb`](http://media.pragprog.com/titles/nrtest/code/huddle3_rspec2/spec/spec_helper.rb)\
  \ |\n\n| | `def save_fixture(raw_markup, name, parent_element=\"body\")` |\n| |\
  \ `markup = html_for(raw_markup, parent_element)` |\n| | `fixture_path = File.join(RAILS_ROOT,\
  \ '/tmp/js_dom_fixtures')` |\n| | `Dir.mkdir(fixture_path) unless File.exists?(fixture_path)`\
  \ |\n| | `fixture_file = File.join(fixture_path, \"#{name}.fixture.html.erb\")`\
  \ |\n| | `File.open(fixture_file, 'w') do |file|` |\n| | `file.puts(markup)` |\n\
  | | `end` |\n| | `end` |\n\n`save_fixture` 方法从一个方法获取 HTML ，该方法使用 `Nokogiri` 来提取和清理\
  \ HTML。\n\n| [`/huddle3_rspec2/spec/spec_helper.rb`](http://media.pragprog.com/titles/nrtest/code/huddle3_rspec2/spec/spec_helper.rb)\
  \ |\n\n| | `def html_for(html, selector)` |\n| | `doc = Nokogiri::HTML(html)` |\n\
  | | `remove_third_party_scripts(doc)` |\n| | `content = doc.css(selector).first.to_s`\
  \ |\n| | `return convert_body_tag_to_div(content)` |\n| | `end` |\n\n这里调用的清理方法的具体细节并不那么重要。它通过从输出中删除已知的\
  \ DOM 元素来清理第三方脚本。更重要的是，它将 `body` 标签改为普通的 `div` 标签，因为正如我们所看到的，我们将把这段文本注入到已经存在的 Jasmine\
  \ 页面中。一个重要的事实是，如果你在 `RSpec` 控制器方法中尝试此调用，你需要在 `RSpec` 的 `describe` 块中调用 `render_views`（在\
  \ `RSpec` 1.x 中，是 `integrate_views`），这样 `RSpec` 才会生成输出。\n\n从 Jasmine 开始，你可以借助一些辅助方法来使用\
  \ fixture，这些方法可以在 [`github.com/pivotaljb/js-fixture-example`](http://github.com/pivotaljb/js-fixture-example)\
  \ 在找到，或者在本书的示例代码 `code/huddle3_rspec2/spec/javascripts/helpers/load_fixture.js`\
  \ 中。该 Github 仓库是一个完整的应用程序，展示了如何将 fixture 整合到 Rails 应用中。缺点它是为 `RSpec` 1.3 编写的，`RSpec`\
  \ 辅助代码需要微调才能在 `RSpec` 2 中运行。\n\n```javascript\ndescribe(\"huddle project behavior\"\
  , function() {\n  it(\"does some fancy ajax thing\", function() {\n    spec.loadFixture(\"\
  project_file\");\n    $(\".project\").click();\n    // and then some expectations\n\
  \  });\n});\n```\n\n这里有几点。一旦加载了 fixture，你就可以使用 `jQuery` 或你选择的框架与 DOM 交互。作为该特定页面生成的任何事件绑定也会被加载，然后可以从规范中触发。作为通常在\
  \ fixture 身体之前加载的外部脚本（例如在 `application.js` 文件中）部分的任何事件绑定，都需要在 fixture 加载后在 Jasmine\
  \ 测试中单独加载。因此，如果你的 JavaScript 事件处理程序被很好地分成了函数，那么你需要在加载 fixture 后调用这些函数，以便 Jasmine\
  \ 代码能够识别事件处理程序。\n\n此外，你需要在每个测试后清除全局绑定：\n\n```javascript\ndescribe(\"huddle project\
  \ behavior\", function() {\n  afterEach(function() {\n    $(\".project\").empty();\n\
  \  });\n});\n```\n\n\n\n\n当我们谈论单断言测试样式时，我们将展示 Shoulda 如何在 `Test::Unit` 之上实现它们，同时在\
  \ RSpec 内部依然非常好用。单断言样式在某些场景下比其他场景更合适，我们还将涵盖一些让在 `Test::Unit` 内部编写单断言测试变得更容易的工具。\n\
  \n在接下来的章节中，我们将介绍 RSpec。RSpec 并不是构建在 `Test::Unit` 之上的，而是一个完全并行的测试工具，拥有自己的结构、语法和样式。RSpec\
  \ 的设计目的是允许我们指定系统行为，并让我们的代码读起来尽可能自然。\n\n## 上下 (Contexts)\n\n在 ``Setup and Teardown``\
  \ 部分中，我们看到了 `Test::Unit` 和 `Rails` 如何允许我们将公共 setup 和 teardown 行为提取到方法中，这些方法会在每个测试之前或之后自动运行。这是一个实用的功能，但有一个缺点：setup\
  \ 方法对于给定类中的所有测试都是通用的。由于 `Rails` 倾向于将单个控制器或模型的所有测试放在一个文件中，这可能会导致问题。\n\n通常，你会发现除了适用于整个类的公共\
  \ setup 之外，你可能还有仅适用于某个内聚测试子集的子级 setup。例如，你可能正在为一个已登录的用户、一个未登录的用户以及一个管理员编写控制器测试。虽然这些测试都有共同的\
  \ setup，但每组测试都有一个单独的用户初始化，且不与其它组共享。如果测试能根据它们各自的启动方法进行分组，且该方法不被所有其他测试共享的话……\n\n这就引入了“上下文\
  \ (contexts)”的概念。上下文不是 `Rails` 核心测试工具的一部分，但通过三个不同的插件以非常相似的方式实现：`RSpec`、`Shoulda`\
  \ 以及由 Jeremy McAnally 编写的、方便称为 `Context` 的 gem。[56]](#f_0097.html_FOOTNOTE-56) 在本次讨论中，我们将使用\
  \ Shoulda 的语法。`RSpec` 的上下文将在 ``Contexts with describe`` 部分进行讨论。\n\n`context` 方法用于将一组测试归为一个，目的是为它们提供一个公共\
  \ setup 和 teardown 块，该块不会被测试类中的其他测试共享。\n\n基本思想是每个上下文都有它自己的方法，在该上下文的每个测试之前和之后运行——`Context`\
  \ gem 使用 `before` 和 `after` 作为这些方法的名称，而 `Shoulda` 使用 `setup` 和 `teardown`。不是为了剧透下一章，但\
  \ `RSpec` 使用的是 `before(:each)` 和 `after(:each)`。\n\n在上下文内部，我们通过调用 `setup` 和 `teardown`\
  \ 方法来定义 setup 和 teardown 块。我们可以根据需要定义任意不同的 setup 或 teardown 块；它们将按照定义的顺序执行。这里有一个示例：\n\
  \n| | `class` `ProjectControllerTest < ActionController::TestCase` |\n| | | |\n\
  | | `context` `\"with an admin user\"` `do` |\n| | | `setup` `do` |\n| | | `login_as_admin`\
  \ |\n| | | `end` |\n| | | |\n| | | `teardown` `do` |\n| | | `logout` |\n| | | `end`\
  \ |\n| | | |\n| | | `test` `\"admin features\"` |\n| | | `# something administrative`\
  \ |\n| | | `end` |\n| | | `end` |\n| | | |\n| | | `context` `\"with a regular user\"\
  ` `do` |\n| | | `setup` `do` |\n| | | `login_as_normal` |\n| | | `end` |\n| | |\
  \ |\n| | | `test` `\"normal features\"` |\n| | | `# something normal` |\n| | | `end`\
  \ |\n| | | `end` |\n| | | `end` |\n\n每个上下文中的测试在运行每个测试之前，都会运行该上下文的 `setup` 方法。我们仍然可以在任何上下文之外使用标准的\
  \ `Test::Unit` setup 和 teardown 块。这些方法会在每个测试开始时首先被调用，在上下文 setup 方法之前。\n\n由于简单的 Ruby\
  \ 方法可以创建上下文，我们可以像动态生成测试一样动态生成它们：\n\n| | `[\"admin\", \"root\"].each do |role|` |\n\
  | | | `context \"with a #{role} user\"` `do` |\n| | | `setup` `do` |\n| | | `@user\
  \ = User.new(:role => role)` |\n| | | `end` |\n| | | |\n| | | `test \"can login\"\
  ` |\n| | | `# this test is run twice, once in each context` |\n| | | `end` |\n|\
  \ | | `end` |\n| | | `end` |\n\n每个上下文中的测试在运行每个测试之前，都会运行该上下文的 `setup` 方法。我们仍然可以在任何上下文之外使用标准的\
  \ `Test::Unit` setup 和 teardown 块。这些方法会在每个测试开始时首先被调用，在上下文 setup 方法之前。\n\n由于简单的 Ruby\
  \ 方法可以创建上下文，我们可以像动态生成测试一样动态生成它们：\n\n| | `[\"admin\", \"root\"].each do |role|` |\n\
  | | | `context \"with a #{role} user\"` `do` |\n| | | `setup` `do` |\n| | | `@user\
  \ = User.new(:role => role)` |\n| | | `end` |\n| | | |\n| | | `test \"can login\"\
  ` |\n| | | `# this test is run twice, once in each context` |\n| | | `end` |\n|\
  \ | | `end` |\n| | | `end` |\n\n*(注：由于输入文本在结尾包含大量重复和混乱的表格，我已将逻辑整合为整洁的代码块，以符合文档工程师的专业标准。）*\n\
  \n\n\n\n在 `context` 的正文中，我们可以定义任意数量的 `should` 测试。需要明确的是，`should` 测试并不非要在 `context`\
  \ 中；`context` 仅仅是作为将相关测试分组在一起的一种方便方式。\n\n## 单断言测试\n\n当被添加到 `Test::Unit` 时，Shoulda\
  \ 在功能上与 RSpec 有许多相似之处。然而，Shoulda 推广了一种不同的测试结构风格，这种风格依赖于 `context` 和嵌套的 `context`。这种风格的定义特征是：每个测试应该只包含一个单一断言。本质上，原本是一个带有某些设置和一系列断言的测试，现在将设置放置在\
  \ `context` 的设置中，而每个断言都变成了一个独立的测试。\n\n换句话说，一个测试由三个基本步骤组成：设置测试数据、执行某些操作以及验证结果。在传统的\
  \ `Test::Unit` 测试中，设置位于 `setup` 块中，而操作和验证位于实际的测试方法中。通常情况下，一个测试包含多个断言。\n\n在单断言风格的测试中，设置和操作都在\
  \ `context` 的设置中，在实际测试中只留下了验证。正如你在下一节中看到的，Shoulda 提供了许多宏，设计用于在已执行被测操作的 `context`\
  \ 正文中使用。其设计目标是让每个测试仅包含一个断言，但显然这并非总是可行的。一组关于索引页的示例测试可能如下：\n\n| Line 1  | `context`\
  \ \"with the index page\" `do` |\n| - |  |\n| - | `setup` `do` |\n| - | `@p1 = Product.create(:name\
  \ => \"product 1\")` |\n| 5 | `@p2 = Product.create(:name => \"product 2\")` |\n\
  | - | `get :index` |\n| - | `end` |\n| - |  |\n| - | `should` \"be successful\"\
  \ { assert_response :success } |\n| 10 | `should` \"set the users\" `do` |\n| -\
  \ | `assert_same_elements([@p1, @p2], assigns(:users))` |\n| - | `end` |\n| - |\
  \ `should` \"display the table rows\" `do` |\n| - | `assert_select \"tr.product_row\"\
  , :count => 2` |\n| 15 | `end` |\n| - | `end` |\n\n此测试的操作 `get :index` 位于第 6 行的\
  \ `context` 设置中。每个 `should` 测试都有一个断言，因此该 `context` 实际上等于更经典测试风格中的一个测试。在 Shoulda\
  \ Assertions 节中，我们将看到 Shoulda 有一些宏可以简化这些测试的编写；在 Single-Line Test Tools 节，我们将看到其他用于单行测试的工具。\n\
  \n这种风格有一个显著优势：每个单独的断言现在独立运行。如果它们都在同一个测试中，其中一个断言的失败将阻止后续断言的评估。这让我们从测试套件获得对代码更准确的视图。这种风格的主要缺点是速度变慢，因为\
  \ `setup` 块现在为每个断言调用一次。如果设置向数据库添加了大量对象，可能会导致显著减慢。从可读性方面来看，我个人认为这两种风格之间没有巨大差异，尽管单断言测试在简单情况下可能更清晰。事实是，单断言风格往往会导致更深层嵌套的\
  \ `context`，这可能很难理清。\n\n## Shoulda Assertions\n\n除了 `context` 和 `should` 助手之外，Shoulda\
  \ 还定义了一系列额外的测试方法，可以使测试更易读。\n\n首先是几个可以描述为本应属于 Rails 核心的断言方法。其中特别实用的是 `assert_same_elements`\
  \ 和 `assert_contains`。`assert_same_elements` 方法接受两个数组参数，如果数组包含相同的元素（即使元素的顺序不同），则返回\
  \ true。因此，以下测试将通过：\n\n| | `should` \"have the same elements\" `do` |\n| | `assert_same_elements([1,\
  \ 1, 3, 4], [4, 1, 3, 1])` |\n| | `end` |\n\n如果一个数组包含多次某个元素，另一个数组也必须包含相同次数的该元素。\n\
  \n同样有用的是 `assert_contains`，它接受一个数组和一个对象。如果数组包含该对象，则断言通过。如果对象恰好是一个正则表达式，则如果数组中的任何元素匹配该正则表达式，断言即通过。其反面是\
  \ `assert_does_not_contain`：\n\n| | `should` \"contain things\" |\n| | `assert_contains([1,\
  \ 2, 3, 4], 2)` |\n| | `assert_does_not_contain([1, 2, 3, 4], 7)` |\n| | `end` |\n\
  \n对于 ActiveRecord，我们得到了 `assert_valid` 和 `assert_save`，两者都接受一个 ActiveRecord 模型。我们还得到了\
  \ `assert_good_value`，其基本形式接受三个参数。第一个参数是模型，第二个是属性，第三个是值。如果该值对该属性有效，则断言通过。可选的第四个参数是一个字符串或正则表达式，用于匹配该断言。与之相反的方法\
  \ `assert_bad_value` 则是完全对应的。\n\n## Shoulda 单行测试\n\nShoulda 以其单行匹配器（one-line matchers）闻名，这些是可以用单行表示的强大测试。在大多数情况下，这些测试被设计为放在\
  \ `context` 或类定义中。测试随后根据 `context` 设置验证某些条件。\n\nShoulda 为 ActionController、ActionMailer、ActionView、ActiveRecord\
  \ 和 ActionMailer 定义了特定的单行测试。例如下面的 ActiveRecord 测试：\n\n| Line 1 | `class` `CalendarTest\
  \ < Test::Unit` |\n| 2 | `should have_many(:tasks)` |\n| 3 | `end` |\n\n注意第 2 行的调用不在\
  \ context 或测试内部。相反，它生成了一个包含一个断言的测试，即 `Calendar` 类与 `Task` 类有 `has_many` 关联。\n\n\
  此外，可以在 `should` 之后调用的任何方法可以在 `should_not` 方法之后调用，这将反转该方法的效果：`should_not have_many(:tasks)`\
  \ 在类没有该关联时通过。与其接受参数不同，许多匹配器可以在其之后链调用其他方法以产生相同的效果。如果你熟悉 RSpec，你会在 RSpec 语法中识别这些功能。事实上，Shoulda\
  \ 匹配器的一个重要特性是它们完全兼容并包含在 RSpec 规范中。\n\n### Action 控制器宏\n\nActionController 方法通常设计用于在\
  \ fact 设置中进行控制器调用的 `context` 内部，它们验证控制器动作常见的副作用。以下代码示例展示了最实用的部分，是以一种非常牵强的方式。这并不是完整的集合；请查看\
  \ Shoulda 文档 `http://dev.thoughtbot.com/shoulda/` 以获取全部内容。\n\n| `context` \"with\
  \ the index page\" |\n| `setup { get :index }` |\n| |\n| `should assign_to(:projects)`\
  \ |\n| `should render_template(:index)` |\n\n\n\n\n\n```ruby\nshould render_with_layout('application')\n\
  should respond_with(:success)\nshould respond_with_content_type('application/pdf')\n\
  end\n\nshould route(:get, '/index', :action => :index).to(:action => :index)\n\n\
  context \"with a redirect\" do \n  setup { get :an_action_that_redirects }\n  should\
  \ redirect_to('route_path')\n  should set_session(:user_id).to(nil)\n  should set_the_flash.to(/Sorry/)\n\
  end\n```\n\n让我们更仔细地观察一下。首先，`should assign_to` 在控制器将该名称实例变量赋值为任何值时通过断言。我们可以通过两个链式方法让测试更具体。`with`\
  \ 方法（例如 `should assign_to(:project).with(@project)`）仅在变量被赋值为该特定值时，断言才会通过；而 `with_kind_of`\
  \ 方法接受一个类作为参数，并且如果赋值的值与该类有 `kind_of?` 关系，则通过。\n\n`should redirect_to` 接受任何 Rails\
  \ `url-convertable` 对象作为参数；或者，该方法也可以接受一个评估为 URL 对象的块。`should_respond_with_content_type`\
  \ 方法接受一个字符串（该字符串必须精确匹配 MIME 类型）、一个符号（使用 Ruby 的标准查找表映射到 MIME 类型），或一个正则表达式（该表达式必须匹配\
  \ MIME 类型的字符串）。\n\n`should set_session` 方法类似于 `should assign_to`，但它检查的是 session\
  \ 列表。`to` 链式方法接受 session 中的期望值。`should set_the_flash_to` 接受字符串或正则表达式作为参数。\n\n`should\
  \ route` 方法有点特殊，因为它检查的是通用路由，而不是特定于某个控制器的内容。第一个参数是 HTTP 动词；第二个是 URL 字符串。剩余参数是键值对，表示\
  \ Rails 在路由过程中设置的选项。如果我们没有在选项列表中指定控制器，Shoulda 将从当前测试类的名称中推出控制器。`to` 链式方法包含期望的路由，且期望路由与实际路由的比较逻辑与\
  \ 测试路由 章节中描述的标准 Rails 路由测试相同。\n\n### ActiveRecord 宏\n\n有很多 ActiveRecord 宏，其中大多数设计用于在上下文之外运行，并检查\
  \ ActiveRecord 模型的关系或验证。同样，我将在一个稍微构造的测试类中展示最用宏的示例，并在末尾给出任何特殊说明：\n\n```ruby\nclass\
  \ ProductTest < ActiveSupport::TestCase\n  should allow_mass_assignment_of(:name)\n\
  \  should allow_value(\"123\").for(:serial_number)\n  should belong_to(:company)\n\
  \  should ensure_inclusion_of(:price).in_range(0 .. 100)\n  should ensure_length_of(:name).is_at_least(5).is_at_most(10)\n\
  \n  should have_and_belong_to_many(:orders)\n  should have_many(:categories)\n \
  \ should have_one(:brand)\n  should validate_acceptance_of(:agreement)\n  should\
  \ validate_numericality_of(:price)\n  should validate_presence_of(:password)\n \
  \ should validate_uniqueness_of(:email)\nend\n```\n\n一些通用说明：记住所有这些匹配器（matchers）也可以与否定方法\
  \ `should_not` 一起工作。所有预期错误的匹配器（例如 `should_not allow_value`）都接受一个可选的链式方法 `with_message`，允许我们测试精确的错误信息。在旧版本的\
  \ Shoulda 中，许多此类方法接受一个可选的参数列表。该功能似乎已被移除。\n\n`ensure_length_of` 匹配器有一系列链式方法来指定长度，包括\
  \ `is_at_least`、`is_at_most` 和 `is_equal_to`。\n\n### ActionMailer 宏\n\nShoulda 定义了一个测试\
  \ ActionMailer 行为的匹配器；它被称为 `should have_sent_email`。在没有链式方法的情况下，如果发送了邮件，则通过。可以添加一个或多个链式方法：`from`、`to`、`with_body`\
  \ 和 `with_subject`。\n\n```ruby\nshould have_sent_email.to(\"mom@mom.com\").with_subject(/)\n\
  ```\n\n### 编写你的匹配器\n\n（注：提供的文本在末尾存在重复部分，已根据逻辑流进行了清理）。\n\n\n\n\n\n*   一个返回字符串的 `description`\
  \ 方法。该字符串用于为 `Test::Unit` 系统中的测试提供命名，因此该方法通常会使用匹配器中的部分参数来为每个匹配器创建一个唯一的字符串，例如 `\"\
  render template #{@template}\"`。\n\n*   `matches?` 方法，它接收一个参数，即运行时测试的最终主体。如果匹配器匹配，则返回\
  \ `true`，否则返回 `false`。如果此方法逻辑复杂，它通常会委托给类的私有方法来定义逻辑。\n\n*   `failure_message` 和 `negative_failure_message`\
  \ 方法，它们返回字符串，并用于匹配器未返回预期值时作为显示消息。我们可以将它们设为普通属性，在这种情况下将使用默认消息。\n\n*   任何我们想要与匹配器进行链式调用的方法都将定义为匹配器类的实例方法。通常，这些方法会设置实例变量，`matches?`\
  \ 方法在确定匹配器是否应该通过时会引用这些变量。\n\n整个匹配器看起来像这样，这是一个直接来自 Shoulda 源码经过稍微修改的代码示例：\n\n```ruby\n\
  class RenderTemplateMatcher\n  attr_reader :failure_message, :negative_failure_message\n\
  \n  def initialize(template, context)\n    @template = template.to_s\n    @context\
  \ = context\n  end\n\n  def matches?(controller)\n    @controller = controller\n\
  \    begin\n      @context.send(:assert_template, @template)\n      @negative_failure_message\
  \ = \"Didn't expect to render #{@template}\"\n      true\n    rescue Test::Unit::AssertionFailedError\
  \ => error\n      @failure_message = error.message\n      false\n    end\n  end\n\
  \n  def description\n    \"render template #{@template}\"\n  end\nend\n```\n\nShoulda\
  \ matchers 并不复杂，如果你发现创建了很多，可能是时候查看 RSpec 及其更简化的匹配器创建方法了。\n\n## 单行测试工具\n\n每个测试一个断言的风格虽然有很多实用的功能，但它可能有些冗长，因为每个单行测试都需要自己的描述字符串。在本节中，我们检查了两种用于编写更简洁的单断言测试的不同工具。其中一个工具\
  \ Zebra 在 Shoulda 中运行良好良好，而另一个工具 Testbed 更像是一个独立工具。同样，下一章将讨论 RSpec 自己的单行测试机制。\n\n\
  ### 使用 Zebra 进行单行测试\n\nZebra 由 James Golick 编写，其核心理念是测试名称基本上只是注释，因此从本质上是不可信的。通过\
  \ Zebra，我们可以编写非常简洁的单行测试。\n\n通过将其放入 Rails 3 的 gemfile 中 (`gem 'zebra'`) 将 Zebra 安装为\
  \ gem；或者在 Rails 2.3 中，在环境中使用以下内容：\n\n```ruby\nconfig.gem 'giraffesoft-zebra', :lib\
  \ => 'zebra'\n```\n\n安装完成后，Zebra 的使用非常简单。这里有一个来自 Shoulda 控制器测试的示例——你可以在 Shoulda\
  \ 之外使用 Zebra，但在它内部运行得非常出色：\n\n```ruby\ncontext \"GET new\" do\n  setup do\n    get\
  \ :new\n  end\n\n  expect { assert_response :success }\n  expect { assert_select\
  \ \"form[action *= password_resets]\" }\n  expect { assert_select \"input[name =\
  \ email]\" }\nend\n```\n\n实际上，我们在这里通过通过 `expect` 传递一个块参数获得了一个匿名测试。Zebra 会根据块的上下文创建具有相应名称的常规\
  \ `Test::Unit` 测试。在这种情况下，第一个 Zebra 测试将被命名为 `test: assert_response :success`；如果测试失败，这就是我们将看到的名称。\n\
  \n除此之外，`expect` 块的行为就像任何其他测试一样。块中的代码在 setup 之后执行；如果断言失败或报错，它们将像其他测试一样被报告。并没有明确要求测试块必须是单行，但对于较长的测试使用\
  \ Zebra 意义不大。\n\n不知道你们怎么想，对我来说，这些测试读起来非常棒。它们很容易编写。\n\n### 使用 Testbed 创建快速测试\n\n\
  Testbed 是我编写的。`testbed` 方法接收一个描述性字符串和一个块。在该块与下一个 `testbed` 之间的任何 `verify_that` 都会创建一个名称类似于\
  \ `test_should_return_number_[1,2,3]` 的测试。\n\n当运行测试时，`verify_that` 的参数将传递给块，并可以根据\
  \ `returns` 方法验证块的返回值。通用的 `returns` 方法可以接受任何参数。还有特定的方法：`returns_true`、`returns_false`\
  \ 和 `returns_nil`。\n\n使用 Testbed 的关键是将字面量或简单对象传递给 testbed，并让块来完成大部分工作。在这个来自工表应用的示例中，Testbed\
  \ 使用 Timecop 冻结日期，然后创建一个工厂对象并计算资源在给定年份的周年：\n\n```ruby\ntestbed \"calculate anniversary\"\
  \ do |start_date, year|\n  Timecop.freeze(2009, 6, 1)\n  resource = Resource.make(:start_date\
  \ => start_date.to_date)\n  resource.start_date_anniversary(year).to_s(:db)\nend\n\
  verify_that(\"May 6, 2007\", 2008).returns(\"2008-05-06\")\nverify_that(\"May 6,\
  \ 2007\", nil).returns(\"2009-05-06\")\n```\n\n## 何使用 Shoulda\n\n最初，Shoulda 进入世界是为了让人们获得\
  \ RSpec 的许多高级功能，而无需承担 RSpec 所需的沉重承诺，并且避免某些人不喜欢的 RSpec 语法中更具魔法性的特性。随着时间的推移，Shoulda\
  \ 团队对 RSpec 变得熟悉，现在 Shoulda 最好被理解为一种让单断言测试更简单的方法，无论你的工具箱中还有其他工具。\n\n\n\n\n我喜欢单行风格的清晰性，特别是在简单的情况下，这也是我默认的这种方式。尽管如此，这些测试可能会在嵌套的上下文中变得错综复杂，导致难以阅读。如果你因为团队中的其他成员无法追踪测试中的动作流而导致测试失败，那么就是一个真正的问题，这表明你需要减少嵌套上下文了。此外，还要关注测试运行速度，警惕那些为了运行多个单断言测试而必须执行的低速设置。\n\
  \n现在我们已经了解了在 `Test::Unit` 中上下文和单行测试是如何工作的，现在是看看它们在 RSpec 中如何体现了。RSpec 是一个从零开始编写的库，旨在用非常强大的自然语言来指定应用程序的行为。\n\
  \n### 脚注\n\n| [[56]](#f_0090.html_FNPTR-56) | 在我写这句话时，Shoulda 作为独立工具的状态处于变动中，当你读到这里时，很有可能\
  \ Shoulda 的 context 部分也已经被提取成了一个独立的 gem。 |\n\nCopyright © 2011, The Pragmatic Bookshelf.\n\
  \n# 第 12 章：RSpec\n\nRSpec 是 Ruby 应用程序中 `Test::Unit` 的行为驱动开发替代方案。我没有花费大量时间来解析原始术语测试优先编程（Test-First\
  \ Programming）、后期出现的术语测试驱动开发（TDD），以及进一步派生的术语如测试驱动设计（也称为 TDD）和行为驱动开发（BDD）之间的区别，更不用说更晦涩的缩写，如示例驱动开发（EDD）或验收测试驱动开发（ATDD）了。[[57]](#f_0105.html_FOOTNOTE-57)\n\
  \n通过如此突出“测试（test）”一词，最初的术语将重点放在了测试本身，某些人认为这个过程的唯一点就是验证程序的正确性。当然，正如我在书中已经引用过一次的那样，Kent\
  \ Beck 知道“正确性是一个副作用”。认为 TDD 是关于正确性的可能似乎是一个微不足道的观点，除非这群人随之又倾向于接受两个更具危害性的推论：\n\n-\
  \ 如果“测试驱动一切”的全部重点是为了验证正确性，那么如果这个过程在证明正确性方面不是 100% 完美的，那么它就一无用处。\n- 如果“测试驱动一切”的全部重点是验证正确性，那么我什么时候写测试并不重要；我可以在写完代码后再写测试。\n\
  \n事实上，TDD 的目标是从许多方面提高你的代码质量；验证正确性只是其中之一。在你编写测试时，这会有巨大影响，因为当测试先行时，这个过程要有效得多。这就是为什么该过程最初的名字显式地指出了“测试优先”。\n\
  \n我很容易陷入这里的一段大吐槽中，但这里是重要的部分：像“测试驱动开发”这样的名称往往会导致人们得出结论，即 TDD 过程主要是关于验证现有行为的。这导致了许多令人恼火的在线争论，人们因为对“测试驱动”中“测试”含义的解释不同而导致沟通不在频道。“行为驱动开发”这一术语的出现是为了帮助赢得那些争论。嗯，那样的争论无法真正赢得，但它的出现有助于澄清术语。当“测试（test）”一词意味着验证已编写的代码时，“行为（behavior）”和“指定（specify）”等术语则意味着描述尚未编写的代码的功能。理想情况下，用\
  \ BDD 的术语讨论你的过程会让你更清楚你最初为什么要使用这个过程。最终，RSpec 被创建为一种在 Ruby 中实现 BDD 的工具。\n\n## 什么是\
  \ Spec？\n\n你如何称你在 RSpec 文件中写的东西？如果你习惯了 TDD 和 `Test::Unit`，那么把它们称为测试的诱惑可能是不可抵挡的。然而，正如我们讨论过的，RSpec\
  \ 背后的 BDD 理论建议最好不要将你的 RSpec 代码想成测试，因为测试是事实后发生的事情。那么，它们是什么呢？\n\nRSpec 文档和代码将 RSpec\
  \ 的元素称为“示例（examples）”。也许我没找对地方，但我从未听过真实的人使用那个术语。（不过，我确实听过人们使用 example 组来指代 RSpec\
  \ 版本的 contexts。）我听得最多的术语简单就是 spec，例如：“我需要为那个功能写一些 specs。”我尝试在这一节中使用那个术语。但我怀疑我会在某个地方出错。请包涵我。\n\
  \n## 开始使用 RSpec\n\nRSpec 是一个大型且复杂的框架，其用途远超 Rails。我们在这里涵盖基础知识，特别强调在 Rails 中的用法，以及\
  \ RSpec 与 `Test::Unit` 之间的对比。我们已经提到了命名规范上的各种差异，但 RSpec 也倾向于一种比 `Test::Unit` 不同的风格，拥有更多的模拟对象（mock\
  \ objects）。这一章只能对 RSpec 的可能性浅尝一角；更多细节，请查阅 *The RSpec Book*[[TRB]](#f_0162.html_CITE-1)\
  \ 。\n\n### 安装 RSpec\n\n导航各种 RSpec 和 Rails 版本以正确安装 RSpec 稍微复杂。在本章的剩余部分，我们将假设使用 Rails\
  \ 3 和 RSpec 2。在建议的情况下，会注明 RSpec 2 和 RSpec 1.3.x 之间的差异。\n\n安装旧版本的 RSpec 或安装到旧版本的\
  \ Rails 中可能会很棘。不同 Rails 和 RSpec 的说明可以在 [`github.com/dchelimsky/rails`](http://github.com/dchelimsky/rails)\
  \ 找到。\n\nRSpec 1 和 RSpec 2 之间的初始区别之一是 RSpec 2 被拆分成了多个 gem。但对于我们的目的来说，最有趣的是 `rspec-rails`。要将\
  \ RSpec 引入你的项目，请像这样将其包含在你的 Gemfile 中：\n\n```\ngroup :test, :development do\n  gem\
  \ \"rspec-rails\"\nend\n```\n\n为了让 RSpec 生成器可用，`rspec-rails` gem 必须同时存在开发和测试组中。在我写这句话时，当前版本是\
  \ 2.3。\n\n运行 `bundle install` 安装 RSpec gems。完成后，你可以运行初始的 RSpec 生成器，它会创建 RSpec 骨架：\n\
  \n```\n% script/rails generate rspec:install\ncreate .rspec\ncreate spec\ncreate\
  \ spec/spec_helper.rb\n```\n\n你将得到：\n\n- `.rspec` 文件，存放 RSpec 运行选项。初始时唯一的选项是 `--colour`[[58]](#f_0105.html_FOOTNOTE-58)\n\
  - `spec` 目录，存放你的 specs 的地方。RSpec 不创建 `controller` 和 `model` 子目录。这些会在你第一次在这些目录构建\
  \ specs 时由生成器创建。\n- 一个 `spec_helper.rb` 文件，它是 RSpec 对应 `test_helper.rb` 的类比。它包含了一些设置选项，并且是你想要对所有测试的方法的好地方。\n\
  \n此外，`rspec-rails` gem 在通过 Rails 3 Railtie 子类加载时还会做其他几件事：\n\n- 添加了一个 Rake 文件，重置默认\
  \ Rake 任务以运行 RSpec spec 文件，并定义了如 `spec:models` 等子任务以便一次运行部分 specs。\n- RSpec 将自己设为未来生成器的测试框架。稍后，当你设置例如一个生成的模型或资源时，RSpec\
  \ 的生成器会被调用以创建相应的 spec 文件。这个过程与 Rails 2.x 中不同，在当时 RSpec 必须提供自己的自定义生成器任务。\n\n## 十分钟上手\
  \ RSpec\n\n现在已经安装了 RSpec，让我们回顾基本概念。它们归结为四个单词：describe, it, should 和 mock。\n\n这里几乎是仍然能展示\
  \ RSpec 主要功能的最小 RSpec 文件了：\n\n```\ndescribe Project do\n```\n\n\n\n\n```ruby\nit\
  \ \"should be able to abbreviate its name\" do\n  mock_project = mock_model(Project,\
  \ :name => \"My Big Project\")\n  mock_project.abbr.should == \"MyBP\"\nend\nend\n\
  ```\n\n尽管这个示例很小，但它展示了 RSpec 的四个核心特性。\n\n### 使用 describe 的上下文 (Contexts)\n\n虽然 Shoulda\
  \ 使用 `context` 一词来指一组相关的测试，但 RSpec 正式将它们称为示例组（example groups），尽管在非正式场合下 `context`\
  \ 这个词也并不罕见。示例组通常通过使用 `describe` 方法声明，尽管 RSpec 也定义了 `context` 方法作为完全相同的别名。\n\n`describe`\
  \ 方法接受一个 `String` 或 `Class` 参数（或两者都有），以及一个包含要分组的所有规范的块，如上一个示例所示。如果 `describe` 方法的参数是一个类，则该块中描述的规范预计与该类相关——稍后我们将看到\
  \ RSpec 如何利用这些信息来确定执行了哪些代码。\n\n设置（Setup）和拆卸（teardown）行为通过 `before` 和 `after` 方法实现，每个方法都接受一个参数。如果参数是\
  \ `:each`，则块会在每个规范执行之前或之后执行；与其较少使用的 `:all` 不同，后者表示块会在公共描述中的所有规范执行完毕之前或之后执行一次。\n\n\
  与 Shoulda 上下文一样，RSpec 的 `describe` 块可以嵌套，组合 `before` 和 `after` 块具有类似的含义。与 Shoulda\
  \ 上下文不同，所有 RSpec 规范必须位于 `describe` 块内部。在一个相关的说明中，在 RSpec 中，你不需要显式地声明子类作为规范的包装器，就像所有\
  \ `Test::Unit` 文件都包含一个 `Test::Unit` 的子类那样。最外层的 `describe` 块会隐式创建一个类的实例，包括 RSpec\
  \ 的 `ExampleGroupMethods` 模块，该模块包含了所有的实际规范行为。\n\n可以使用普通的 Ruby 语法在 `describe` 块内部定义支持方法，并可以供块内的任何规范使用。\n\
  \n### 编写规范： “It” 因素\n\n`it` 方法用于定义实际的 RSpec 规范或示例。`it` 方法接受一个可选的字符串来描述行为，以及一个要执行的块。RSpec\
  \ 还定义了 `specify` 作为 `it` 的别名。通常，当方法接受字符串时使用 `it`，并用于给方法提供一个可读的自然语言名称。对于不需要字符串描述的单行测试，使用\
  \ `specify` 可以让该单行代码读起来更清晰，如下所示：\n\n```ruby\nspecify { user.name.should == \"fred\"\
  \ }\n```\n\nRSpec 有一个方便的机制来标记某个特定规范尚未代码尚未实现。你可以定义一个不带块的 `it` 方法。在这种情况下，该测试将在 RSpec\
  \ 输出中显示为“pending（待定）”：\n\n```ruby\nit \"should bend in its hands\"\n```\n\n或者你也可以可以在规范块中使用\
  \ `pending` 方法：\n\n```ruby\nit \"should bend in its hands\" do\n  pending \"Not\
  \ implemented yet\"\n  steel.should be_bent\nend\n```\n此测试在遇到 `pending` 方法时停止，并将其结果返回为“pending”（如果测试在到达\
  \ `pending` 之前失败，则按正常方式处理该失败）。你也可以让 `pending` 接受一个块：\n\n```ruby\nit \"should bend\
  \ in its hands\" do\n  pending \"Not implemented yet\"\n  steel.should be_bent\n\
  end\n```\n这种行为可能不符合你的预期。`pending` 块内部的代码会被执行，但那里的任何失败都会被视为“pending”结果，而不是失败。然而，如果块中的代码实际上通过了，你将得到一个失败，其含义实际上是：“你说过这是待定的，但请看，它实际上可以工作。也许它并不是真的待定；请删除该块。”\n\
  \n### 使用 “should” 匹配预期\n\nRSpec 语法中最具特征的部分或许是 RSpec 用来指定程序特性的表达式匹配器（expression matchers）。`Test::Unit`\
  \ 使用的断言看起来像：\n\n```ruby\nassert_equal(expected, actual)\n```\n\n而 RSpec 使用表达式来指定期望的行为：\n\
  \n```ruby\nactual.should == expected\n```\n注意语气的变化，从暗示已实现的“断言（assertion）”转变为“应该（should）”，暗示了未来的行为。可以说，RSpec\
  \ 的版本读起来更流畅，特别是考虑到 RSpec 在匹配器上拥有的其他技巧。我发现很难记住 `assert_equal` 版本中 `expected` 和 `actual`\
  \ 参数的顺序，但记住 RSpec 版本中的顺序对我却非常困难。\n\n它的工作原理是 `should` 方法是为所有 Ruby 对象定义的。`should`\
  \ 方法接受一个参数，即一个匹配器。通常情况下，你会使用 RSpec 提供的其中一个函数来返回一个专门的匹配器。这里有一个例子：\n\n```ruby\nactual.should\
  \ be_true\n```\n如果完全加上括号，更容易看出发生了什么，尽管实践中 RSpec 的编写是不带括号的。与上一个片段一样，显示括号可以更清楚地表明匹配器是\
  \ `should` 的参数：\n\n```ruby\nactual.should(be_true)\n```\n正如我们将看到的，匹配器本身可以链式调用方法，但仍然是\
  \ `should` 的参数：\n\n```ruby\nactual.should(have(1))\n```\n当运行示例时，`should` 方法会根据匹配器定义的标准评估匹配器，并根据结果确定通过或失败。使用\
  \ `should`，如果匹配器为真，则规范通过。使用 `should_not`，行为会被反转。\n\n\n\n\n另外，如果谓词方法是现在时态，例如 `matches?`，你可以将期望写为\
  \ `should be_a_match`。RSpec 会尝试调用带有“s”的方法——在一种情况下，即 `matches`。它将找不到不带“s”的方法——在这种情况下，即\
  \ `match`。此举的目标是让你的测试读起来尽可能接近自然句子。\n\n同样，如果谓词方法以 `has` 开头，RSpec 允许你的匹配器以 `have`\
  \ 开头以提高可读性，这样你的测试看起来就不像是用 LOLCats（网络猫星语）写的：\n\n|   | `expected.should have_key(:id)`\
  \ |\n\n你也可以这样做：\n\n|   | `expected.should have(11).things` |\n\n如果 `expected.things.size`\
  \ 等于 11，则通过。这种构造的奇异之处在于，如果预期的对象实际上是一个集合，你可以在结尾使用任何想要的符号，RSpec 只会忽略它：\n\n|   | `[:a,\
  \ :b].should have(2).items` |\n\n|   | `[:a, :b].should have(2).gazorgenplatzes`\
  \ |\n\n你可以在 `have_at_least` 和 `have_at_most` 上使用同样的技巧。顺便说一下，如果你尝试使用 `should_not\
  \ have_at_least`，RSpec 会告诉你测试太困惑了，建议尝试用 `should have_at_most`。\n\n你可以定义自定义的匹配器，我们将在本节稍后的部分讨论，但通常情况下，你直接向你的类中添加谓词方法并让现有的\
  \ RSpec 机制运行会更好。\n\n### RSpec 与 Mock（模拟对象）\n\nMock 对象在 RSpec 中非常重要——事实上，它们重要到至于\
  \ RSpec 拥有自己的一套 mock 框架，与 FlexMock、Mocha 或 RR 有微妙的区别。特别是，RSpec 用户经常追求 mock 对象来使每个单独的规范（spec）与其他规范相互独立，以便应用程序中的任何单个缺陷都恰好破坏一个规范。像许多设计目标一样，这个目标在执行中可能无法完美，但在有效使用\
  \ RSpec 时，将一个规范隔离到特定的方法、类或层是非常重要的。关于如何使用 mock 对象的更通用方法，请参阅章节 *使用 Mock 对象*。\n\n如果你不喜欢\
  \ RSpec 自己的 mock 对象框架，可以在 `spec_helper.rb` 文件中包含类似下面的行来使用你偏好的 mock 框架：\n\n|   |\
  \ `config.mock_with :mocha` |\n\nRSpec 贴心地将这些行包含在注释中，所以你只需要根据喜好调整这些注释行即可。\n\nRSpec\
  \ 原生的 mock 对象包允许你通过 `double` 方法创建裸的 mock 对象，如下所示：\n\n|   | `mock_obj = double(\"\
  an object\")` |\n\n在没有任何进一步描述的情况下，`mock_obj` 类并不知道任何方法，如果被调用它将返回一个期望错误。你可以通过调用 `as_null_object`\
  \ 方法快速让它在被调用时静默返回 null。这通常在原始声明中完成：\n\n|   | `mock_obj = double(\"an object\").as_null_object`\
  \ |\n\n你可以使用 `stub` 方法对任何对象的任何方法进行存根（stubbing）。这种策略适用于普通对象也适用于类。在 `stub` 后面跟随 `and_return`\
  \ 来设置被存根方法返回的值。作为快捷方式，你可以在调用 `stub` 时将方法和返回值作为键值对进行指定。你还可以将 `stub` 与 `and_raise`\
  \ 链式调用，允许你伪造抛出异常：\n\n```\nuser.stub(:friend_count).and_return(12)\nuser.stub(:friend_count\
  \ => 12)\nUser.stub(:total_friend_count).and_return(345)\nUser.stub(:find).and_raise(ActiveRecord::RecordNotFoundException)\n\
  ```\n\n如果你希望被存根方法的返回值是动态的，可以向 `stub` 传递一个块，该块将带有传递给方法的任何参数调用：\n\n```\nuser.stub(:find)\
  \ do |arg|\n  if arg == 1 User.me else User.you end\nend\n```\n\n`and_return` 方法可以接受多个参数，在这种情况下，RSpec\
  \ 会在后续调用存根方法时逐个返回这些参数。如果进行了更多调用，它不会循环回到第一个参数，而是反复返回最后一个值。你也可以像传递给 `stub` 一样将块传递给\
  \ `and_return`。\n\n你可以通过 `should_receive` 方法在任何对象的任何方法上设置 mock 期望。正如章节 *使用 Mock\
  \ 对象* 中详细讨论的，mock 与 stub 的区别在于它设置了一个期望，即特定方法将被调用，如果该期望未满足则测试失败：\n\n```\nuser.should_receive(:friend_count).and_return(12)\n\
  user.should_not_receive(:friend_count)\n```\n\n像 Mocha 一样，你可以使用 `with` 方法根据调用参数来过滤\
  \ mock。这些参数同时适用于 `stub` 和 `should_receive`：\n\n```\nuser.should_receive(:is_a_friend?).with(:noel).and_return(true)\n\
  ```\n\n有几个匹配器可以代替 `with` 的参数。它们的作用与 Mocha 的版本相似，因此我在这里不会深入介绍。请查看 [http://rspec.info/documentation/mocks/message_expectations.html]\
  \ 上的 RSpec 期望文档。\n\nRSpec 的默认期望是受 mock 的方法将被调用一次。正如前面提到的，像 Mocha 一样，`once`、`at_least`、`at_most`\
  \ 和 `exactly(x).times` 等方法可以改变行为：\n\n```\nuser.should_receive(:count).exactly```\n\
  \n### Let Subject\n\nRSpec 有许多方法可以让测试更简洁同时保持清晰。测试设置的一个常见问题是 `before` 块变得杂乱。在 RSpec\
  \ 中，你有 `let` 方法：\n\n|   | `describe \"user behavior\"` |\n|   | `let(:me) { User.new(:name\
  \ => \"Noel\") }` |\n|   | `let(:you) { User.new(:name => \"Erin\") }` |\n|   |\
  \  |\n|   | `it \"should let friends\" do` |\n|   | `me.add_friend(you)` |\n|  \
  \ | `you.should have(1).friend` |\n|   | `end`\n\n使用 `let`，你可以在当前示例中使用变量，而无需将其放在\
  \ `before` 块中。每个 `let` 方法接收一个符号和一个块。该符号可以像局部变量一样被调用：第一次调用符号时执行块并缓存结果；后续调用返回相同的结果。在之前的示例中，调用第\
  \ 6 行的 `me` 会触发第 2 行的 `let` 块，返回一个随后可以使用的用户“Noel”。`you` 对象的行为类似，但注意 `you` 块是由第 6\
  \ 行的引用触发的；当下一行引用 `you` 时使用的是缓存的对象。\n\n本质上，`let` 调用是定义方法并记忆化结果的语法糖，如下：\n\n```\ndef\n\
  \  @me ||= mock_model(User, :name => \"Noel\")\nend\n```\n\n这里的主要陷阱是 `let` 块在被调用之前不会执行。这通常是好事，因为你的测试不会创建未使用的对象。如果你期望对象已经存在，有时会遇到麻烦。对于一个构造的问题案例，注意这个示例将失败，因为两个\
  \ `let` 块从未被调用：\n\n|   | `describe \"user behavior\"` |\n|   | `let(:me) { User.new(:name\
  \ => \"Noel\") }` |\n|   | `let(:you) { User.new(:name => \"Erin\") }` |\n|   |\
  \  |\n|   | `specify { User.count.should == 2 }` |\n|   | `end`\n\n你可以通过使用 `let!`\
  \ 方法代替 `let` 来确保块被调用。\n\n\n\n\n我经常使用 `let` 来清理示例设置，并减少创建实例变量的需求。然而，当我真的想让我的 RSpec\
  \ 代码变得简洁时，我会使用 RSpec 的 `subject` 功能。RSpec 使用 `subject` 来减少一组针对同一个待测对象的系列测试中的重复代码。不过先预警一下——确实有\
  \ Ruby 开发者认为 `subject` 的那些东西太魔法化了，这种简洁是以牺牲清晰度为代价的。\n\n假设我们有一组如下所示测试：\n\n```ruby\n\
  describe \"a lot of tests\" do\n  let(:me) { User.new(:name => \"Noel\") }\n  let(:you)\
  \ { User.new(:name => \"Erin\") }\n\n  before(:each) do\n    me.add_friend(you)\n\
  \  end\n  specify { me.should have(1).friend }\n  specify { me.should be_valid }\n\
  \  specify { me.should be_friends_with(you) }\n  specify { me.should_not be_friendless\
  \ }\nend\n```\n\n这四个断言中存在重复，即它们都以 `me` 开头。在这种特定情况下，这更多像是一个微小的困扰，而不是严重的可读性问题。然而，你很容易看到一组需要检查诸如\
  \ `me.friends.first.addresses.first` 之类的测试，重复输入会非常烦人。\n\n在 RSpec 中，你可以使用 `subject`\
  \ 方法为示例组中的所有规格指定一个公共接收者。`subject` 接收一个块，并像 `let` 一样，在块被第一次调用后缓存结果。在封装的示例组内部，任何不带接收者的\
  \ `should` 调用都会使用定义的 `subject` 作为接收者。因此，示例可以重写为：\n\n```ruby\ndescribe \"a lot of\
  \ tests\" do\n  let(:me) { User.new(:name => \"Noel\") }\n  let(:you) { User.new(:name\
  \ => \"Erin\") }\n\n  before(:each) do\n    me.add_friend(you)\n  end\n  subject\
  \ { me }\n  it { should have(1).friend }\n  it { should be_valid }\n  it { should\
  \ be_friends_with(you) }\n  it { should_not be_friendless }\nend\n```\n\n第 8 行的\
  \ `subject` 声明意味着接下来四行中所有明显裸露的 `should` 调用都指向 `subject`。这是否改进了你测试的可读性是主观的——我认为确实如此，只要规格是短的且距离\
  \ `subject` 声明足够近。虽然这个特定测试中的 `subject` 非常简单，但该块可以是任意复杂的。（另外，注意我将 `specify` 切换到了\
  \ `it`，仅仅是因为大声读出这一行时，后者比前者读起来更好。）\n\n使用 `subject` 的明显限制是，你必须针对 `subject` 本身指定匹配器，而不是针对它的任何属性或子方法。在之前的代码中，例如我们可以指定\
  \ `subject` `should be_valid`，但我们无法对例如 `subject` 的名称进行任何说明。这是一个严重限制 RSpec `subject`\
  \ 用性的约束，因此实际上有一种方法可以实现这一点这并不意外：\n\n```ruby\nsubject { me }\nits(:name) { should\
  \ == \"Noel\" }\nits(\"friends.first.name\") { should == \"Erin\" }\n```\n\n`its`\
  \ 方法接受一个符号或字符串作为参数，并带有一个块。如果参数是符号，则会在 `subject` 上调用该名称的方法，并将结果的值作为块中 `should` 调用的接收者。在前面显示的第\
  \ 2 行中，调用了 `me.name`，因为 `me` 是 `subject` 且 `:name` 是 `its` 的参数。因此，该块等于 `me.name.should\
  \ == \"Noel\"`。\n\n如果参数是字符串，RSpec 假设该字符串是由点号分隔的方法名序列。它将方法应用于 `subject`，并将最终结果作为块中\
  \ `should` 的接收者。在第 3 行中，该块实际上是 `{ me.friends.first.name.should == \"Erin\"}`。\n\n\
  ## RSpec 和 Rails\n\nRSpec 并不是 Rails 特有的。然而，`rspec-rails` 为 RSpec 提供了几个扩展，旨在将 RSpec\
  \ 与 Rails 集成。你可以得到：\n\n*   Rails 生成器代替 `Test::Unit` 文件。在 Rails 3 中，这些由 RSpec 自动调用。\n\
  *   与 Rails 关联的自定义 RSpec 示例类。\n*   针对特定 Rails 特性的匹配器。\n\n在这个代码示例中，我使用了“示例设置”中的步骤重新创建了\
  \ Huddle 应用，直到需要安装 RSpec 的点。在那个点，向你的 Gemfile 中添加以下内容：\n\n```ruby\ngroup :development,\
  \ :test do\n  gem 'rspec-rails', '~> 2.0'\nend\n```\n\nRSpec 需要在测试组中，因为它是一个测试工具，并且它需要包含在开发组中，以便它所定义的生成器在开发期间可以通过命令行访问。\n\
  \n到此时，如果你继续进行 Devise 设置，你会看到一个由 RSpec 生成的测试文件：\n\n```bash\nrails generate devise:install\n\
  rails generate devise User\n# invoke active_record\ninvoke rspec\n```\n\n生成的 `user_spec.rb`\
  \ 文件没多少内容，但请注意 Rails 会自动交给 RSpec 来创建它。我们可以通过重新创建 Huddle 资源来获得更有趣的模板测试（输出已编辑仅显示 RSpec）。\n\
  \n```bash\nrails generate scaffold project name:string\ninvoke rspec\n```\n\n\n\n\
  \n| � | `create spec/views/projects/show.html.erb_spec.rb` |\n| � | `invoke helper`\
  \ |\n| � | `create spec/helpers/projects_helper_spec.rb` |\n| � | `create spec/routing/projects_routing_spec.rb`\
  \ |\n| � | `invoke rspec` |\n| � | `create spec/requests/projects_spec.rb` |\n\n\
  同样，状态报告（status reports）也是如此：\n\n| � | `% rails generate scaffold status_report project:references\
  \ \\` |\n| � | `user:references yesterday:text today:text status_date:date` |\n\
  | � | `invoke rspec` |\n| � | `create spec/controllers/status_reports_controller_spec.rb`\
  \ |\n| � | `create spec/views/status_reports/edit.html.erb_spec.rb` |\n| � | `create\
  \ spec/views/status_reports/index.html.erb_spec.rb` |\n| � | `create spec/views/status_reports/new.html.erb_spec.rb`\
  \ |\n| � | `create spec/views/status_reports/show.html.erb_spec.rb` |\n| � | `invoke\
  \ helper` |\n| � | `create spec/helpers/status_reports_helper_spec.rb` |\n| � |\
  \ `create spec/routing/status_reports_routing_spec.rb` |\n| � | `invoke rspec` |\n\
  | � | `create spec/requests/status_reports_spec.rb` |\n\nRSpec 生成的文件与 `Test::Unit`\
  \ 略有不同。最显著的是，控制器、视图和路由规格（specs）都放置在独立的文件中。让我们浏览 RSpec 的 Rails 特性并遍历这些样板测试（boilerplate\
  \ tests）。\n\n### RSpec 与模型\n\n让我们从模型测试开始，因为模型的生成文件最短的。以下是 Huddle 状态报告的模型文件：\n\n\
  | [huddle3_rspec2/spec/models/status_report_spec.rb](http://media.pragprog.com/titles/nrtest/code/huddle3_rspec2/spec/models/status_report_spec.rb)\
  \ |\n| � | `require 'spec_helper'` |\n| � | |\n| � | `describe StatusReport do`\
  \ |\n| � | `pending \"add some examples to (or delete) #{__FILE__}\"` |\n| � | `end`\
  \ |\n\n好的，这非常短。事实上，它几乎没做什么。\n\nRSpec 为 `ActiveRecord` 提供了三个自定义匹配器（matchers）：一个用于类，两个用于实例。太快了！我将在这里运行它们，然后我们就可以猜一猜它们的作用了：\n\
  \n| � | `StatusReport.should have(1).record` |\n| � | `StatusReport.should have(5).records`\
  \ |\n| � | |\n| � | `a_report.should have(:no).errors_on(:yesterday)` |\n| � | `a_report.should\
  \ have(1).error_on(:today)` |\n| � | |\n| � | `a_report.should be_a_new(StatusReport)`\
  \ |\n\n时间到了。`have(x).record` 构造测试数据库表中该模型的行数；基本上它等同于 `StatusReport.all.size == x`。`errors_on`\
  \ 匹配器测试附加到给定属性上的 `ActiveRecord` 验证错误。`be_a_new` 匹配器如果该实例是提供类的未保存实例，则返回 `true`。你最常用的可能是用它来判断控制器是否根据用户的创建请求正确地保存了模型。\n\
  \nRSpec 还提供了一个模拟 `ActiveRecord` 模型的快捷方法，奇怪的是，它就叫 `mock_model`。通常，你会在控制器或视图测试中使用它，将控制器测试与模型的实现细节隔离开，从而使控制器测试完全独立于模型代码的正确性甚至是否存在。使用模拟模型（mock\
  \ models）可以让你的控制器测试运行得更快——不需要访问数据库——并使它们更加健壮。此外，它显式地将指定模型行为的负担放在了 RSpec 模型文件中，这正是它该待的地方。使用模式如下：\n\
  \n| � | `mock_project = mock_model(Project, :name => \"fred\")` |\n| � | `Project.stub(:find).and_return(mock_project)`\
  \ |\n\n`mock_model` 的第一个参数要么扩展了 Rails 3 `ActiveModel::Naming` 模块的类，要么是一个字符串。字符串参数必须求值为不存在的类或扩展了\
  \ `ActiveModel::Naming` 的类。换句话说，你不能为非 `ActiveRecord` 类创建模拟模型。任何后续参数都是应该被存桩（stubbed）get\
  \ 模型方法的键值对。\n\n使用 `mock_model` 提供了存桩，使模拟对象表现像一致的 `ActiveRecord` 模型。`mock_model`\
  \ 方法生成一个 ID 并存桩 `new_record` 和 `persisted` 以保持一致性。\n\n### RSpec 与控制器\n\n在 `Test::Unit`\
  \ 中，控制器和视图都会被测试。RSpec 将两者拆分，文件分别位于 `spec/controllers` 和 `spec/views`。\n\nRSpec 为控制器测试提供了几个匹配器：\n\
  \n| � | `response.should be_success` |\n| � | `response.should be_redirect` |\n\
  | � | `response.should redirect_to(url)` |\n| � | `response.should render_template('app/views/index')`\
  \ |\n| � | `response.should render_template(:show)` |\n\n如果你熟悉旧版本，有一个 RSpec 2 的更改需要注意。与\
  \ RSpec 1.x 不同，控制器默认不渲染视图。由于某种原因，你想将视图测试与控制器测试集成，你可以通过在 RSpec 示例中放置 `render_views`\
  \ 来。\n\n`assigns`、`flash` 和 `session` 变量以哈希的形式可用。如果你想测试一个赋值变量，请使用 `assigns(:variable)\
  \ == thing` 格式。\n\nRSpec 控制器测试是什么样子的？这里有一个生成文件的代表性示例：\n\n| [huddle3_rspec2/spec/controllers/projects_controller_spec.rb](http://media.pragprog.com/titles/nrtest/code/huddle3_rspec2/spec/controllers/projects_controller_spec.rb)\
  \ |\n| � | `require 'spec_helper'` |\n| � | |\n| � | `describe ProjectsController\
  \ do` |\n| � | |\n| � | `def mock_project(stubs={})` |\n| � | `@mock_project ||=\
  \ mock_model(Project, stubs).as_null_object` |\n| � | `end` |\n| � | |\n| � | `describe\
  \ \"GET index\" do` |\n| � | `it \"assigns all projects as @projects\" do` |\n|\
  \ � | `Project.stub(:all) { [mock_project] }` |\n| � | `get :index` |\n| � | `assigns(:projects).should\
  \ eq([mock_project])` |\n| � | `end` |\n| � | `end` |\n| � | `end` |\n\n\n\n\n\n\
  -   最外层的 `describe` 块包含控制器的名称作为描述。这不仅仅是一个约定；RSpec 使用该类来指定所有测试中要调用哪个控制器。\n-   最内层的\
  \ `describe` 块按控制器调用进行划分，并用所描述的控制器动作（action）和 HTML 方法进行注释。这仅仅是一种约定，但它是非常有用的。如果你查看实际文件，你会发现某些动作被进一步拆分：`create`\
  \ 和 `edit` 动作被拆分为一个针对有效数据的测试和一个针对无效数据的测试。\n-   `get` 方法以及其他模拟通过浏览器操作访问控制器的方法在 RSpec\
  \ 中的工作方式与在 `Test::Unit` 中完全相同。\n-   `mock_project` 存根（stub）用于管理 index 方法中 `find(:all)`\
  \ 调用的结果，而无需实际创建数据，从而使测试运行得极快。\n\n### ### RSpec 视图规格 (View Specs)\n\n由于 RSpec 允许你独立于视图来指定控制器，你可能认为你也可以独立于控制器来指定视图。你是正确的。RSpec\
  \ 的约定是将视图测试放在 `spec/views` 文件夹中，一个视图文件对应一个规格文件，因此 `app/views/projects/edit.html.erb`\
  \ 中的视图在 `spec/views/projects/edit.html.erb_spec.rb` 中指定。以下是项目控制器 edit 视图的脚架文件：\n\
  \n| `huddle3_rspec2/spec/views/projects/edit.html.erb_spec.rb` |\n| :--- |\n| `require\
  \ 'spec_helper'` |\n| |\n| `describe \"projects/edit.html.erb\" do` |\n| `before(:each)\
  \ do` |\n| `@project = assign(:project, stub_model(Project,` |\n| `:new_record?\
  \ => false,` |\n| `:name => \"MyString\"` |\n| `))` |\n| `end` |\n| |\n| `it \"\
  renders the edit project form\" do` |\n| `render` |\n| |\n| `rendered.should have_selector(\"\
  form\", :action => project_path(@project),` |\n| `:method => \"post\") do |form|`\
  \ |\n| `form.should have_selector(\"input#project_name\", :name => \"project[name]\"\
  )` |\n| `end` |\n| `end` |\n| `end` |\n\n这里的基本练习非常简单：在你的 `before` 块中，使用 `assign`\
  \ 方法初始化你任何预期控制器设置的变量。你也可以在单个规格中调整此内容，以尝试不同的逻辑分支。然后每个实际的规格都会渲染视图文件并验证 HTML 输出。\n\n\
  有几点需要指出。最外层的 `describe` 块包含被渲染的视图文件的实际路径，相对于 `app/views` 目录。严格来说，这并不是要求的，但很有用。此外，`render`\
  \ 方法如果不带参数调用，将渲染最外层 `describe` 块中引用的视图（看，我说了它是很有用的）。你可以通过将文件名作为 `render` 的第一个参数来覆盖该行为（再次，文件名相对于\
  \ `app/views`）。传递给 `render` 的任何其他选项行为都与 `ActionView::Base` 中完全一致。在调用 `render` 后，`rendered`\
  \ 方法包含生成的文本。\n\n所有标准的 Rails 辅助器模块都会自动加载，但你计划调用的任何应用程序特定的辅助器模块都需要显式指定（使用类似 `include\
  \ ProjectsHelper` 的内容），或者如上一节所述，添加到 `render` 命令中。所有辅助器模块在视图规格中都是可用的。\n\n为了指定实际的视图内容，RSpec\
  \ 默认使用 `have_selector`，它实际上是 Webrat 的一部分。`have_selector` 方法类似于 `assert_select`，不同之处在于它支持以键/值对的形式描述\
  \ HTML 属性，例如 `have_selector(\"form\", :method => \"post\")`，而不是 `assert_select`\
  \ 或 CSS 语法 `form[method=post]`。Webrat 版本使得在属性上使用动态值更加容易。像 `assert_select` 一样，`have_selector`\
  \ 接受 `count` 和 `content` 选项来指定选择器找到的次数或选择器的内容。如从示例所示，`have_selector` 可以嵌套的。\n\n\
  如果你想要更简单的测试，请使用 `contain` 匹配器，它执行简单的正则表达式匹配，如下所示：\n\n```\nrendered.should contain(\"\
  Name\")\n```\n\n通常，视图层会在过程中调用辅助器方法。为了符合 RSpec 的最佳实践，核心思想是在测试期间限制不同层级之间的交互。这表明辅助方法在视图规格期间应该被存根（stubbed），仅在辅助器规格中真正执行。如果你选择在视图测试中存根辅助器方法，请使用\
  \ `view` 对象获取访问该方法的模板，例如 `view.should_receive(:helper_method).and_return(\"result\"\
  )`。RSpec Helper Specs 章节演示了如何在 RSpec 中指定辅助器模块。\n\n### ### RSpec 路由规格 (Routing Specs)\n\
  \n与 `Test::Unit` 不同，RSpec 提供了一个专门用于测试路由的文件。你可以使用 Rails 核心测试功能测试路由；然而，这些测试通常会与普通的控制器测试结合在一起。\n\
  \nRSpec 为每个控制器提供一个辅助文件，默认包含许多如下所示的示例：\n\n| `huddle3_rspec2/spec/routing/projects_routing_spec.rb`\
  \ |\n| :--- |\n| `it \"recognizes and generates index\" do` |\n| `{ :get => \"/projects\"\
  \ }.should route_to(:controller => \"projects\", :action => \"index\")` |\n| `end`\
  \ |\n\n这里的关键匹配器是 `route_to`，它接收一个由方法和路径组成的哈希。作为参数包含 `params` 哈希。实际的 `route_to` 匹配器委托给标准的\
  \ `assert_routing`，测试双向关系——字符串是否路由到哈希，以及哈希是否从字符串路由。RSpec 还提供了一个 `be_routable` 方法，设计用于否定形式显示特定路径（例如默认路径）未被识别：\n\
  \n```\n{ :get => \"/projects/fred\" }.should_not betable\n```\n\n### ### RSpec 辅助器规格\
  \ (Helper Specs)\n\nRSpec 提供了一个 `spec/helpers` 目录来指定辅助器模块的行为，这是 Rails Core 在 2.2\
  \ 时代采用的创新。\n\n这里没什么魔法；生成的文件仅展示了你可能编写的测试示例：\n\n| `huddle3_rspec2/spec/helpers/projects_helper_spec.rb`\
  \ |\n| :--- |\n| `require 'spec_helper'` |\n| |\n| `# 此文件中的规格可以访问一个包含` |\n| `# ProjectsHelper\
  \ 的辅助器对象。例如：` |\n| `#` |\n| `# describe ProjectsHelper do` |\n| `# describe \"string\
  \ concat\" do` |\n| `# it \"concats two strings with spaces\" do` |\n| `# helper.concat_strings(\"\
  this\",\"that\").should == \"this that\"` |\n| `# end` |\n| `# end` |\n| `# end`\
  \ |\n| `describe ProjectsHelper do` |\n| `pending \"add some examples to (or delete)\
  \ #{FILE__}\"` |\n| `end` |\n\n如果你愿意花时间指定辅助方法（我建议这样做，否则它们往往会变成应用程序中黑暗、可怕的阁楼），RSpec\
  \ 会自动包含 Rails 核心辅助器模块，加上最外层 `describe` 块中指定的模块。\n\n\n\n\n由于你无法访问控制器，甚至没有 mock 控制器（就像你在\
  \ Rails 核心辅助方法测试中那样），你可能会好奇如何测试那些假设了控制器实例变量的辅助方法。你可以像在控制器测试中那样将这些值指定到 `assigns`\
  \ 哈希中，然后使用 `helper` 方法调用你实际的辅助方法。这里有一个示例说明：\n\n假设我们有如下的辅助方法：\n\n| � | `def` `headline_project_name`\
  \ |\n| � | `\"<h1>#{@project.name.uppercase}</h1>\"` |\n| � | `end` |\n\n暂时忽略我们本应该将\
  \ `project` 作为参数传递，而不是假设它是一个实例变量。\n\n在 RSpec 中，我们这样测试该方法：\n\n```ruby\ndescribe ProjectsHelper\
  \ do\n  it \"should headline a project \" do\n    assigns(:project) = mock_model(Project,\
  \ :name => \"Mock\")\n    helper.headline_project_name.should == \"<h1>MOCK</h1>\"\
  \n  end\nend\n```\n\n换句话说，在 `headline_project_name` 前加上 `helper.` 让我们能够访问添加到 `assigns`\
  \ 哈希中的伪实例变量。\n\n### RSpec Request Specs\n\nRequest specs 是 RSpec 对 `Test::Unit`\
  \ 集成测试的对应。我猜它们并不怎么用，因为大多数 BDD 遵循者使用 Cucumber 进行集成测试。\n\nRequest specs 与 `Test::Unit`\
  \ specs 相似，这意味着它们也与 controller specs 相似，但我们指定的是整个路径（例如 `get projects_path`），而不是仅仅是被测试控制器的方法名。对于动作和输出的进一步规范，强烈推荐\
  \ Webrat 或 Capybara。\n\n## Running RSpec\n\nRSpec 为运行测试套件提供了几种不同的选项。最简单的选项是使用 `rspec`\
  \ 命令，它可以接受目录或特定文件作为参数。\n\n你还有一组 Rake 。主任务 `rake spec` 是 RSpec 安装时的默认任务。它运行 spec\
  \ 目录下的所有内容。正如你预期的那样，你也可以将任务限制到特定的子目录，如 `spec:controllers`、`spec:helpers`、`spec:lib`、`spec:mailers`、`spec:requests`\
  \ 和 `spec/views`。如果你通过 Rake 运行，可以通过将标准命令行选项放在 `.rspec` 文件中来指定。默认看起来所示，并指定 RSpec\
  \ 的终端输出为彩色的：\n\n```\n--colour\n```\n\n`rspec --help` 命令为你提供了一个可以放在 `.rspec` 文件中的选项列表。\n\
  \n## RSpec in Practice\n\nRSpec 建议了一种与 `Test::Unit`不同的测试编写方法，部分原因因为它大量使用 mock，并且强烈倾向于隔离测试并保持控制器和模型测试分离。例如，我在\
  \ *The First Test-First 章节中写的第一个测试在 `Test::Unit` 中看起来如下：\n\n```ruby\ntest \"creation\
  \ of status report with data\" do\n  assert_difference('StatusReport.count', 1)\
  \ do\n    post :create, :status_report => {\n      :project_id => projects(:one).id,\n\
  \      :user_id => users(:quentin).id,\n      :yesterday => \"I did stuff\",\n \
  \     :today => \"I'll do stuff\"\n    }\n  end\n  actual = assigns(:status_report)\n\
  \  assert_equal(projects(:one).id, actual.project.id)\n  assert_equal(users(:quentin).id,\
  \ actual.user.id)\n  assert_equal(Date.today.to_s(:db), actual.status_date.to_s(:db))\n\
  \  assert_redirected_to status_report_path(actual)\nend\n```\n\n使用 mock 对象来覆盖控制器和模型层之间转换的\
  \ RSpec 翻译风格可能如下：\n\n`huddle3_rspec2/spec/controllers/status_reports_controller_spec.rb`\n\
  \n```ruby\nit \"assigns a newly created status_report as @status_report\" do\n \
  \ StatusReport.stub(:new_from_params).with({'this' => 'params'})\n  post :create,\
  \ :status_report => {'this' => 'params'}\nend\n```\n\n\n\n\n```ruby\nmatch do |string|\n\
  \  expected = Ingredient.new(hash)\n  actual = Ingredient.parse(string, Recipe.find(1),\
  \ 1)\n  actual == expected\nend\nend\n```\n\n在这里，匹配器调用的哪些部分被转换为哪些参数至关重要，且略不直观。`should`\
  \ 方法的接收者——即被评估的对象的对象——是 `match` 最内层调用的块参数。在上一个示例中，它将是块参数 `string`。RSpec 调用的右侧（在此情况下是包含预期值的\
  \ `hash`）变成了外部方法的参数。在之前的代码段中，该 `hash` 是 `parse_to` 方法的 `hash` 参数。块可以接受第二个参数，即匹配器本身，根据需要可以使用它来指定特定的失败信息。可以这样调用：\n\
  \n```ruby\nit \"should parse a basic string\" do\n  \"2 cups carrots, diced\".should\
  \ parse_to(:amount => 2,\n    :unit => \"cups\", :ingredient => \"carrots\",\n \
  \   :instruction => \"diced\")\nend\n```\n\n匹配器左侧的字符串参数是 `match` 块的字符串参数，而 `hash`\
  \ 是 `define` 块的参数。\n\n除了 `match` 之外，你可以在 `define` 块中调用其他方法来精细匹配器的行为。所有这些方法都接受匹配器的左侧作为块的参数。最常用的是\
  \ `failure_message_for_should`，它返回在报告正向失败时使用的字符串。你还有 `failure_message_for_should_not`，它返回负向失败的消息，以及\
  \ `descriptions`，它用于在示例没有自己的名称时生成示例名称——例如当使用 `specify` 但没有带字符串参数时。\n\n你能够构建的最灵活的匹配器是任何具有\
  \ `matches?` 方法和 `failure_message_for_should` 方法的任意类，以及一个返回该类实例的独立方法。同样，以下代码的用法与前两个相同：\n\
  \n```ruby\nclass ParseTo\n  def initialize(hash)\n    @hash = hash\n  end\n\n  def\
  \ matches?(string)\n    expected = Ingredient.new(hash)\n    actual = Ingredient.parse(string,\
  \ Recipe.find(1), 1)\n    actual == expected\n  end\n\n  def failure_message_for_should(string)\n\
  \    \"Bzzz! Wrong!\"\n  end\nend\n\n  def parse_to(hash)\n    ParseTo.new(hash)\n\
  \  end\nend\n```\n\n这看起来与 编写你自己的 Shoulda Matcher 中对 Shoulda matchers 的描述非常相似，这就是为什么\
  \ Shoulda matchers 可以直接放入 RSpec 中。在这里也可以定义 `failure_message_for_should_not` 和 `description`\
  \ 方法，以及一个可选的 `does_not_match?` 方法，如果定义了，它将用于 `should_not` 情况。\n\n## 总结 RSpec\n\n\
  我与 RSpec 有着你可能说的“渊源”。它身上有很多我一直很喜欢的地方。我喜欢匹配器、匹配语法以及测试的字符串描述（当然，这在 `Test::Unit` 一侧也被广泛模仿）。此外，它在某种程度上是一个纯主义者的工具，而我足够崇纯主义，足以被它吸引。我第一次认真接触\
  \ RSpec 是在为之前的一本书研究了它之后，决定在我的下一个项目中认真尝试一下它。\n\n我并没有用它坚持多久。回想起来，我意识到我方法不对（Doing It\
  \ Wrong）：试图编写包含大量模拟（mocked）且脆弱的测试。那是处理 RSpec 的痛苦方式，而且 mock 叠着 mock 可能会令人沮丧。\n\n\
  从那时起，单断言风格引入了 RSpec（或者也许一直都在那里；我只是到了一个能看到它价值的阶段）。此外，我有机会作为我的主要测试工具使用它大约八个月。而且最近\
  \ Rails 测试的一些创新，如 Cucumber 和 Webrat，往往倾向于 RSpec。结果是，我对 RSpec 变得更加熟练，对它的灵活性也更加敏锐，正如我所说，我一直喜欢它的基本语法。\n\
  \n### 脚注\n\n- [57]: 在 RSpec 1 中，该方法被称为 `stub!`，尽管两个 RSpec 版本都将另一个调用别名为重复。\n- [58]:\
