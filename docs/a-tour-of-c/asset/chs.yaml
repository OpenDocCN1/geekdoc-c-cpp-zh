  [11] 若干更多细微扩展\n\n#### 16.2.7 已移除和废弃特性\n\n外界存在数亿行 C++ 代码，没有人确切知道哪些特性处于关键使用。因此，ISO\
  \ 委员会在移除旧特性时非常不情愿，且通常在多年警告后才进行。然而，有时也会移除某些麻烦的特性：\n\n*   C++17 最终删除了异常规范：\n\n\n\n\
  \n\n点击此处查看代码图像\n\n```cpp\n[](#cb462-1)void f() throw(X,Y); // C++98; now an error\n\
  ```\n\n异常规范的支持设施，`unexcepted_handler`、`set_unexpected()`、`get_unexpected()` 和 `unexpected()`\
  \ 同样被移除了。相反地，请使用 `noexcept` (§3.5.1)。\n\n-   不再支持三连字符（Trigraphs）。\n-   `auto_ptr`\
  \ 已弃用。请改用 `unique_ptr` (§13.2.1)。\n-   删除了对存储区类型限定符 `register` 的使用。\n-   删除了在 `bool`\
  \ 类型上使用 `++` 的操作。\n-   删除了 C++98 的 `export` 特性，因为它过于复杂且主要供应商并未提供。相反，`export` 被用作模块的关键字\
  \ (§3.3)。\n-   对于带有析构函数的类，生成拷贝操作已被弃用 (§5.1.1)。\n-   删除了将字符串字面量赋值给 `char*` 的操作。请改用\
  \ `const char*` 或 `auto`。\n-   某些 C++ 标准库函数对象及相关函数已被弃用。大部分与参数绑定有关。请改用 lambda 表达式和\
  \ `function` (§13.8)。\n\n通过弃用某项特性，标准委员会表达了希望该特性消失的意愿。然而，委员会并没有权限立即移除一个被广泛使用的特性——无论它它是多么冗余或具有多大的危险性。因此，弃用是对避免使用该特性的一个强力暗示。它可能会在未来消失。编译器可能会对使用弃用特性的行为发出警告。然而，弃用特性仍然是标准的一部分，历史表明，出于兼容性考虑，它们倾向于被“永远”支持。\n\
  \n## 16.3 C/C++ 兼容性\n\n在极少数例外之外，C++ 是 C 的超集（意味着 C11；[C11]）。大多数差异源于 C++ 对类型检查的更高关注。编写良好的\
  \ C 程序通常也是良好的 C++ 程序。编译器可以诊断 C++ 和 C 之间的每一个差异。C99/C++11 的不兼容之处列在标准的附录 C 中。\n\n###\
  \ 16.3.1 C 和 C++ 是兄弟\n\n经典的 C 有两个主要的后代：ISO C 和 ISO C++。多年年来，这些语言以不同的节奏和方向进行演进。结果之一是，每种语言都以略微不同的方式提供了传统的\
  \ C 风格编程的支持。由此产生的不兼容性可能会让同时使用 C 和 C++ 的人员感到痛苦，让用其中一种语言编写使用另一种语言实现的库的人感到痛苦，也让 C 和\
  \ C++ 库及工具的实现者感到痛苦。\n\n我该如何称呼 C 和 C++ 兄弟？看这个简化的家族树：\n\n![Image](img/00034.jpeg)\n\
  \n实线表示特征的大规模继承，虚线表示对主要特征的借用，点线表示对次要特征的借用。由此，ISO C 和 ISO C++ 成为 K&R C 的两个主要后代 [Kernighan,1978]，并成为兄弟。它们都携带了经典\
  \ C 的关键方面，且都没有与经典 C 实现 100% 兼容。我的“经典 C”这个术语来自于一个以前贴在 Dennis Ritchie 终端上的贴纸。它是 K&R\
  \ C 加上枚举类型和 `struct` 赋值。BCPL 由 [Richards,1980] 定义，而 C89 则由 [C1990] 定义。\n\n注意，C 和\
  \ C++ 之间的差异并不一定是 C++ 中对 C 所做更改的结果。在某些情况下，不兼容性源于在 C++ 中常见很久之后，才以不兼容的方式采纳到 C 中的特性。例如，将\
  \ `T*` 赋值给 `void*` 的能力以及全局 `const` 的链接 [Stroustrup,2002]。有时，某个特性甚至在成为 ISO C++ 标准的一部分之后，才以不兼容的方式被引入\
  \ C，例如 `inline` 含义的细节。\n\n### 16.3.2 兼容性问题\n\nC 和 C++ 之间存在许多细微的不兼容之处。它们都可能给程序员带来问题，但在\
  \ C++ 的语境下都可以被处理。至少，C 代码段可以被编译为 C，并使用 `extern \"C\"` 机制链接到一起。\n\n将 C 程序转换为 C++ 时，主要问题可能是：\n\
  \n*   次优的设计和编程风格。\n*   `void*` 隐式转换为 `T*`（即，在没有类型强制转换的情况下进行转换）。\n*   在 C 代码中将 C++\
  \ 关键字（如 `class` 和 `private`）用标识符。\n*   作为 C 编译的代码与作为 C++ 编译的代码之间存在不兼容的链接。\n\n####\
  \ 16.3.2.1 风格问题\n\n自然地，C 程序是用 C 风格编写的，例如 [Kernighan,1978]。这暗示了对指针和数组的广泛使用。为了从 C++\
  \ 中获得主要收益，必须做出更改：\n\n1.  不要把 C++ 想成带有几个功能的 C。把 C++ 标准作为老师。\n2.  不要使用 `malloc()`。`new`\
  \ 运算符 (§4.2.2) 效果更好，替代 `realloc()` 请尝试使用 `vector` (§4.2.3](#part0009.html_ch04lev2sec3),12.1).\n\
  3.  宏替换在 C++ 中几乎是必要的。使用 `const` (§1.6)、`constexpr` (§1.6)、`enum` 或 `enum class`\
  \ (§2.5) 来定义编译常量，`inline` (§4.2.1) 来避免函数调用开销，`template` (第 6 章) 来指定函数和类型的族，以及 `namespace`\
  \ (§3.4) 来避免命名冲突。\n4.  不要在需要之前声明变量并立即初始化它。声明可以出现在任何语句的地方 (§1.8)、在 `for` 语句的初始化部分\
  \ (§1.7) 以及条件表达式中 (§4.5.2)。\n5.  不要使用 `malloc()`。`new` 运算符 (§4.2.2) 效果更好。不要仅仅用 `malloc()`\
  \ 和 `free()` 替换为“裸”的 `new` 和 `delete` (§4.2.2)。\n6.  避免使用 `void*`、联合（union）和强制转换，除非是在某些函数或类的实现内部。它们的使用限制了从类型系统中获得的支持，并可能损害性能。\n\
  7.  如果你必须使用显式类型转换，请使用适当的命名转换（例如 `static_cast`; §16.2.7)），以便对你尝试的操作进行更精确的陈述。\n\n\n\
  \n\n\n### [8] 尽量减少数组和 C 风格字符串的使用\n\n与传统的 C 风格相比，C++ 标准库 `string` ([9.2])、`array`\
  \ ([13.4.1]) 和 `vector` ([11.2])——等等，`vector` (11.2) 通常用于编写更简单且易于维护的代码。通常情况下，尽量不要自己构建标准库已经提供的功能。\n\
  \n### [9] 除非在非常特殊的代码（如内存管理器）以及用于简单的数组遍历（例如 `++p`）中，否则避免使用指针算术。\n\n### [10] 不要假设用\
  \ C 风格费力编写的代码（避开 C++ 特性，如类、模板和异常）就比更短的替代方案（例如使用标准库设施）更高效。通常（但当然不是总是），情况恰恰相反。\n\n\
  #### 16.3.2.2 `void*`\n\n在 C 语言中，`void*` 可以作为任何指针类型变量的赋值或初始化的右侧操作数；但在 C++ 中可能不行。例如：\n\
  \n```cpp\nvoid f(int n) {\n     int* p = malloc(n*sizeof(int)); /* 不是 C++;在 C++\
  \ 中，请使用 \"new\" 分配 */\n     // ...\n}\n```\n\n这可能是最难处理的兼容性问题。注意，将 `void*` 隐式转换为不同的指针类型通常并非无害：\n\
  \n```cpp\nchar ch;\nvoid* pv = &ch;\nint* pi = pv;      // 不是 C++\n*pi = 666;  \
  \       // 覆盖 ch 和 ch 附近的字节\n```\n\n在两种语言中，请将 `malloc()` 的结果强制转换为正确的类型。如果你只使用 C++，请避免\
  \ `malloc()`。\n\n#### 16.3.2.3 链接 (Linkage)\n\nC 和 C++ 可以（并且通常）实现为使用不同的链接约定。这最根本的原因是\
  \ C++ 更为强调类型检查。一个实用的原因是 C++ 支持重载，因此可以存在两个名为 `open()` 的全局函数。这必须反映在链接器的工作方式上。\n\n\
  要给一个 C++ 函数赋予 C 链接（以便其能从 C 程序段中调用），或者允许从 C++ 程序段中调用一个 C 函数，请将其声明为 `extern \"C\"\
  `。例如：\n\n```cpp\nextern \"C\" double sqrt(double);\n```\n\n现在 `sqrt(double)` 就可以从\
  \ C 或 C++ 代码段中调用。`sqrt(double)` 的定义也可以编译为 C 函数或 C++ 函数。\n\n在一个作用域内，给定名称的函数只能有一个\
  \ C 链接（因为 C 语言不允许函数重载）。链接规范不影响类型检查，因此 C++ 关于函数调用和参数检查的规则仍然适用于声明为 `extern \"C\"`\
  \ 的函数。\n\n## 16.4 参考文献\n\n- [Boost] *The Boost Libraries: 免费同行评审的可移植 C++ 源代码库*.\
