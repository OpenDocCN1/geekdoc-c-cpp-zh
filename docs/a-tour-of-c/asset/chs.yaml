  \n```\nvector<Entry> phone_book = {\n     {\"David Hume\",12345},\n     {\"Karl\
  \ Popper\",23456},\n     {\"Bertrand Russell\",34567}\n};\n```\n\n元素可以通过下标访问。假设我们已经为\
  \ `Entry` 定义了 `<<`，我们可以写：\n\n点击此处查看代码图像\n\n```\nvoid print_book(const vector<Entry>&\
  \ book)\n{\n     for (int i = 0; i<book.size(); ++i)\n           cout << book[i];\n\
  }\n```\n\n通常情况下，索引从 `0` 开始，`book[0]` 包含（§1.7](#part0006.html_ch01lev7)).`vector`\
  \ 成员 `size()` 给出元素的数量。`vector` 的元素构成一个范围，我们可以使用 `for` 循环（part0006.html_ch01lev7)):\n\
  \ntemplate<typename T>\nclass Vector {\n    T* elem; // 指向第一个元素的指针\n    T* space;\
  \ // 指向第一个未使用且未初始化的槽位的指针\n    T* last; // 指向最后一个槽位的指针\npublic:\n    // ...\n   \
  \ int size();     // 元素的数量 (space-elem)\n    int capacity(); // 可用槽位数量 (last-elem)\n\
  \    // ...\n    void reserve(int newsz); // 将 capacity() 增加到 newsz\n    // ...\n\
  \    void push_back(const T& t); // 将 t 拷贝到 Vector\n    void push_back(T&& t); \
  \     // 将 t 移动到 Vector\n};\n```\n\n标准库 `vector` 拥有 `capacity()`、`reserve()` 和 `push_back()`。`reserve()`\
  \ 被 `vector` 的用户和其他 `vector` 成员用于为更多元素留出空间。它可能需要分配新内存，如果是这样，它会将元素移动到新的分配空间。\n\n\
  给定 `capacity()` 和 `reserve()`，实现 `push_back()` 是显而易见的：\n\n\n\n\n\n点击此处查看代码图像\n\n\
  ```cpp\n[](#cb317-1)template<typename T>\n[](#cb317-2)void Vector<T>::push_back(const\
  \ T& t)\n[](#cb317-3){\n[](#cb317-4)     if (capacity()<size()+1)             //\
  \ 确保有空间存放 t\n[](#cb317-5)           reserve(size()==0?8:2*size()); // 容量翻倍\n[](#cb317-6)\
  \     new(space) T{t};                     // 将 space 初始化为 t\n[](#cb317-7)     ++space;\n\
  [](#cb317-8)}\n```\n\n现在元素的分配和重新定位很少发生。我曾尝试使用 `reserve()` 来提高性能，但事实证明那是事倍无功：`vector`\
  \ 使用的启发式方法平均而言比我的猜测要好，因此现在只有在我想要使用元素指针以避免元素重新分配时，我才会显式地使用 `reserve()`。\n\n`vector`\
  \ 可以在赋值和初始化中拷贝。例如：\n\n点击此处查看代码图像\n\n```cpp\n[](#cb318-1)vector<Entry> book2 = phone_book;\n\
  ```\n\n`vector` 的拷贝和移动是通过构造函数和赋值运算符实现的，如 §5.2 节所述。赋值一个 `vector` 涉及拷贝它的元素。因此，在初始化\
  \ `book2` 后，`book2` 和 `phone_book` 持有电话书中每个 `Entry` 的独立副本。当 `vector` 包含许多元素时，这种看似简单的赋值和初始化可能是昂昂的。在不希望拷贝的情况下，应该使用引用或指针（§1.7）或移动操作（§5.2.2）。\n\
  \n标准库的 `vector` 非常灵活且高效。将其作为你的默认容器；也就是说，除非你有充分的理由使用其他容器，否则就使用它。如果你因为担心“效率”而避免使用\
  \ `vector`，请进行测量。在容器用法的性能问题上，我们的直觉往往是最不可靠的。\n\n### 11.2.1 元素\n\n与所有标准库容器一样，`vector`\
  \ 是某种类型 `T` 元素的容器，即 `vector<T>`。几乎任何类型都可以胜任元素类型：内置数值类型（如 `char`、`int` 和 `double`）、用户定义类型（如\
  \ `string`、`Entry`、`list<int>` 和 `Matrix<double,2>`）以及指针（如 `const char*`、`Shape*`\
  \ 和 `double*`）。当你插入一个新元素时，它的值会被拷贝拷贝到容器中。例如，当你将一个值为 `7` 的整数放入容器时，结果中的元素值确实为 `7`。该元素不是指向某个包含\
  \ `7` 的对象的引用或指针。这使得容器既简洁、紧凑又访问快速。对于关注内存大小和运行时性能的人来说，这是至关重要的。\n\n如果你有一个依赖 `virtual`\
  \ 函数来实现多态行为的类层次结构（§4.5），请直接在容器中存储对象。相反，请存储指针（或智能指针；§13.2.1）。例如：\n\n点击此处查看代码图像\n\n\
  ```cpp\n[](#cb319-1)vector<Shape> vs;                  // 不，不要这样做——没有地方给 Circle\
  \ 或 Smiley 留空间\n[](#cb319-2)vector<Shape*> vps;                // 好些，但请参阅 §4.5.3\n\
  [](#cb319-3)vector<unique_ptr<Shape>> vups;    // OK\n```\n\n### 11.2.2 范围检查\n\n\
  标准库的 `vector` 不保证范围检查。例如：\n\n点击此处查看代码图像\n\n```cpp\n[](#cb320-1)void silly(vector<Entry>&\
  \ book)\n[](#cb320-2){\n[](#cb320-3)     int i = book[book.size()].number;     //\
  \ book.size() 超出了范围\n[](#cb320-4)     // ...\n[](#cb320-5)}\n```\n\n这种初始化可能会在 `i`\
  \ 中放置一个随机值，而不是报错。这是不可接受的，且越界错误是一个常见问题。因此，我经常使用 `vector` 的一个简单范围检查适配版本：\n\n点击此处查看代码图像\n\
  \n```cpp\n[](#cb321-1)template<typename T>\n[](#cb321-2)class Vec : public vector<T>\
  \ {\npublic:\n[](#cb321-3)     using vector<T>::vector;\n[](#cb321-4)     T& operator[](int\
  \ i) {\n[](#cb321-5)         return vector<T>::at(i);\n}\n[](#cb321-6)     const\
  \ T& operator[](int i) const {\n[](#cb321-7)         return vector<T>::at(i);\n\
  }\n};\n```\n\n\n\n\n\n```cpp\nlist<Entry> phone_book = {\n    {\"David Hume\",123456},\n\
  \    {\"Karl Popper\",234567},\n    {\"Bertrand Arthur William Russell\",345678}\n\
  };\n```\n\n当我们使用链表时，往往倾向于不像对 `vector` 那样通常通过下标来访问元素。相反，我们可能会通过搜索列表来查找具有给定值的元素。为了实现这一点，我们利用了\
  \ `list` 是一个序列这一事实，如第 12 章 描述的那样：\n\n点击此处查看代码图片\n\n```cpp\nint get_number(const\
  \ string& s)\n{\n     for (const auto& x : phone_book)\n          if (x.name==s)\n\
  \                return x.number;\n     return 0; // 使用 0 表示“未找到数字”\n}\n```\n\n\
  对 `s` 的搜索从链表开始，一直持续直到找到 `s` 或到达 `phone_book` 的末尾。\n\n有时，我们需要识别 `list` 中的某个元素。例如，我们可能想要删除一个元素或在其之前插入一个新元素。为了做到这一点，我们使用迭代器（`iterator`）：`list`\
  \ 迭代器识别 `list` 中的一个元素并可以用于遍历 `list`（因此得此名）。每个标准库容器都提供了 `begin()` 和 `end()` 函数，它们分别返回指向第一个元素和指向最后一个元素之后位置的迭代器（第\
  \ 12 章）。通过显式使用迭代器，我们可以——虽然写法不那么优雅——这样编写 `get_number()` 函数：\n\n点击此处查看代码图片\n\n```cpp\n\
  int get_number(const string& s)\n{\n     for (auto p = phone_book.begin(); p!=phone_book.end();\
  \ ++p)\n          if (p->name==s)\n                return p->number;\n     return\
  \ 0; // 使用 0 表示“未找到数字”\n}\n```\n\n事实上，这大致就是编译器实现那种更简洁且更不易出错的范围 `for` 循环的方式。给定一个迭代器\
  \ `p`，`*p` 是它所指的元素，`++p` 使 `p` 进到指向下一个元素，而当 `p` 指向一个具有成员 `m` 的类时，`p->m` 等于 `(*p).m`。\n\
  \n向 `list` 中添加元素和从 `list` 中移除元素是非常简单的：\n\n点击此处查看代码图片\n\n```cpp\nvoid f(const Entry&\
  \ ee, list<Entry>::iterator p, list<Entry>::iterator q)\n{\n     phone_book.insert(p,ee);\
  \     // 在 p 指向的元素之前添加 ee\n     phone_book.erase(q);         //  q 指向的元素\n}\n```\n\
  \n对于 `list`，`insert(p,elem)` 在 `p` 指向的元素之前插入一个带有值 `elem` 拷贝的元素。在这里，`p` 可以是一个指向 `list`\
  \ 末尾之后位置的迭代器。相反，`erase(p)` 移除 `p` 指向的元素并将其销毁。\n\n这些 `list` 示例可以使用 `vector` 以相同的方式编写，而且令人惊讶的是（除非你理解机器架构），对于较小的\
  \ `vector`，其性能比较小的 `list` 更好。当我们只想要元素序列时，我们可以在使用 `vector` 和 `list` 之间进行选择。除非你有理由不这样做，否则请使用\
  \ `vector`。`vector` 在遍历（例如 `find()` 和 `count()`）以及排序和搜索（例如 `sort()` 和 `equal_range()`；§12.6，§13.4.3）方面的表现更好。\n\
  \n标准库还提供了一种名为 `forward_list` 的单向链表：\n\n![图像](img/00024.jpeg)\n\n`forward_list` 与\
  \ `list` 的区别在于仅允许正向迭代。这真正的意义在于节省空间。它不需要在每个节点中保留前驱指针，一个空 `forward_list` 的大小仅为一个指针。`forward_list`\
  \ 甚至不保存它的元素数量。如果你需要元素计数，你可以手动计数。如果你无法负担计数的代价，可能就不应该 `forward_list`。\n\n### 11.4\
  \ `map`\n\n编写在 `name,number` 对列表中查找名称的代码是非常繁琐的。此外，对于除了最短的列表以外的所有列表，线性搜索都是无效的。标准库提供了一种平衡二叉树（通常是红黑树），称为\
  \ `map`：\n\n![图像](img/00025.jpeg)\n\n在其他上下文中，`map` 被称为关联数组或字典。它被实现为平衡二叉树。标准库的 `map`\
  \ 是一个针对查找优化的键值对容器。我们可以使用与 `vector` 和 `list` 相同的初始化器（§11.2，§11.3）。\n\n\n\n\n设计良好的哈希函数是一门艺术，有时需要对将应用的数据有所了解。通过异或（`^`）组合现有的哈希函数来创建一个新的哈希函数既简单又通常非常有效。\n\
  \n我们可以通过将 `hash` 操作定义为标准库 `hash` 的特化，来避免显式传递 `hash` 操作：\n\n点击此处查看代码图像\n\n```cpp\n\
  namespace std { // 为 Record 制作哈希函数\n    template<> struct hash<Record> {\n     \
  \   using argument_type = Record;\n        using result_type = std::size_t;\n\n\
  \        size_t operator()(const Record& r) const\n        {\n             return\
  \ hash<string>()(r.name) ^ hash<int>()(r.product_code);\n        }\n    };\n}\n\
  ```\n\n注意 `map` 和 `unordered_map` 之间的区别：\n\n- `map` 需要一个排序函数（默认为 `<`）并产生一个有序序列。\n\
  - `unordered_map` 需要一个哈希函数，并且不在其元素之间维护顺序。\n\n给定一个良好的哈希函数，`unordered_map` 对于大型容器来说比\
  \ `map` 快得多。然而，对于糟糕的哈希函数，`unordered_map` 的最坏情况要比 `map` 糟糕得多。\n\n## 11.6 容器概览\n\n\
  标准库提供了一些通用且实用的容器类型，允许程序员选择最符合应用程序需求的容器：\n\n| 标准容器摘要 |\n| :--- | :--- |\n| `vector<T>`\
  \ | 变长度的向量 (§11.2) |\n| `list<T>` | 双向链表 (§11.3) |\n| `forward_list<T>` | 单向链表 |\n\
  | `deque<T>` | 双端队列 |\n| `set<T>` | 集合（一个只有键没有值的 `map`） |\n| `multiset<T>` | 元素可以出现多次的集合\
  \ |\n| `map<K,V>` | 关联数组 (§11.4) |\n| `multimap<K,V>` | 键可以出现多次的 map |\n| `unordered_map<K,V>`\
  \ | 使用哈希查找的 map (§11.5) |\n| `unordered_multimap<K,V>` | 使用哈希查找的 multimap |\n| `unordered_set<T>`\
  \ | 使用哈希查找的集合 |\n| `unordered_multiset<T>` | 使用哈希查找的 multiset |\n\n无序容器针对通过键（通常是字符串）进行查找进行了优化；换句话说，它们是使用哈希表实现的。\n\
  \n容器定义在 `std` 命名空间中，并在 `<vector>`、`<list>`、`<map>` 等文件中呈现 (§8.3)。此外，标准库还提供了容器适配器\
  \ `queue<T>`、`stack<T>` 和 `priority_queue<T>`。如果需要，请查阅它们。标准库还提供了更专门的类容器类型，例如固定大小数组\
  \ `array<T,N>` (§13.4.1) 和 `bitset<N>` (§13.4.2)。\n\n标准容器及其基本操作在表示法上设计得很相似。此外，各种容器的操作是等价的。基本操作适用于每种有意义且可以高效实现的容器：\n\
  \n| 标准容器操作（部分内容） |\n| :--- | :--- |\n| `value_type` | 元素的类型 |\n| `p=c.begin()` |\
  \ `p` 指向 `c` 的第一个元素；同样 `cbegin()` 用于指向 `const` 的迭代器 |\n| `p=c.end()` | `p` 指向 `c`\
  \ 最后一个元素的下一个；同样 `cend()` 用于指向 `const` 的迭代器 |\n| `k=c.size()` | `k` 是 `c` 中元素的数量\
  \ |\n| `c.empty()` | `c` 是否为空？ |\n| `k=c.capacity()` | `k` 是 `c` 在不重新分配的情况下可以容的元素数量\
  \ |\n| `c.reserve(k)` | 将容量设为 `k` |\n| `c.resize(k)` | 使元素数量变为 `k`；新增的元素值为 `value_type{}`\
  \ |\n| `c[k]` | `c` 的第 `k` 个元素；不进行范围检查 |\n| `c.at(k)` | `c` 的第 `k` 个元素；如果超出范围，抛出\
  \ `out_of_range` |\n| `c.push_back(x)` | 在 `c` 的末尾添加 `x`；将 `c` 的大小增加一 |\n| `c.emplace_back(a)`\
  \ | 在 `c` 的末尾添加 `value_type{a}`；将 `c` 的大小增加一 |\n| `q=c.insert(p,x)` | 在 `c` 的位置\
  \ `p` 插入 `x` |\n| `q=c.erase(p)` | 从 `c` 中删除位置 `p` 的元素 |\n| `c=d` | 赋值 |\n| `c==d`\
  \ | 相等 |\n| `c<d` | 字典序小于 |\n\n标准容器的基本操作在表示法上设计得很相似。此外，各种容器的操作含义是等价的。基本操作适用于所有有意义且可以高效实现的容器。这种表示法的统一性使得我们可以处理\
  \ (§8.3) 容器。\n\n（注：]\n\n[content]\n设计良好的哈希函数是一门艺术，有时需要对将应用的数据有所了解。通过异或（`^`）组合现有的哈希函数来创建一个新的哈希函数既简单又通常非常有效。\n\
  \n我们可以通过将 `hash` 操作定义为标准库 `hash` 的特化，来避免显式传递 `hash` 操作：\n\n点击此处查看代码图像\n\n```cpp\n\
