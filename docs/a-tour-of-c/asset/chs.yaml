  \ 和 `forward()`(#part0018.html_ch13lev2)\n- 范围检查：`span`\n- 特化容器\n    - `array`(#part0018.html_ch13lev4);`bitset`(#part0018.html_ch13lev4);`pair`\
  \ 和 `tuple`(#part0018.html_ch13lev4)\n- 替代方案\n    - `variant`(#part0018.html_ch13lev5);`optional`(#part0018.html_ch13lev5);`any`(#part0018.html_ch13lev5)\n\
  - 时间\n- 函数适配\n    - Lambda 作为适配器;`mem_fn()`(#part0018.html_ch13lev9);`function`(#part0018.html_ch13lev10)\n\
  - 分配器\n- 类型函数\n    - `iterator_traits`(#part0018.html_ch13lev12);类型谓词;`enable_if`(#part0018.html_ch13lev14)\n\
  - 建议\n\n\n\n\n任何非平凡程序的核心任务之一都是管理资源。资源是必须获取并在稍后（显式或隐式地）释放的内容。例如`memory`、`locks`、`sockets`、`thread\
  \ handles`（线程句柄）和 `file handles`。对于长时间运行的程序，未能及时释放资源（“泄漏”）会导致严重的性能下降，甚至可能导致糟糕的崩溃。即使对于短运行程序，泄漏也可能变成一种尴尬，例如由于资源短缺导致运行时间增加几个数量级。\n\
  \n标准库组件的设计旨在确保不泄漏资源。为了实现这一点，它们依赖于语言对资源管理的基本支持，即使用构造函数/析构函数对来确保资源的生命周期不会超过负责该资源的对象。在\
  \ `Vector` 中使用构造函数/析构函数对来管理其元素的生命周期就是一个示例（§4.2.2），所有的标准库容器都以类似的方式实现。重要的是，这种方法能与使用异常的错误处理正确交互。例如，这种技术被用于标准库的锁类：\n\
  \n点击此处查看代码图像\n\n```\n[](#cb361-1)mutex m; // 用于保护对共享数据的访问\n[](#cb361-2)// ...\n\
  [](#cb361-3)void f()\n[](#cb361-4){\n[](#cb361-5)     scoped_lock<mutex> lck {m};\
  \ // 获取互斥 m\n[](#cb361-6)     // ... 操作共享数据 ...\n[](#cb361-7)}\n```\n\n在 `lck` 的构造函数获取\
  \ `mutex` 之前，`thread` 将不会继续（§15.5）。相应的析构函数会释放资源。因此，在这个示例中，当控制线程离开 `f()` 时（通过 `return`、通过“运行函数末尾”或通过抛出异常），`scoped_lock`\
  \ 的析构函数会释放 `mutex`。\n\n这是 RAII 的应用（“资源获取即初始化”技术；§4.2.2）。RAII 是 C++ 中惯用资源处理的基础。容器（如\
  \ `vector` 和 `map`、`string` 以及 `iostream`）以类似的方式管理它们的资源（如文件句柄和缓冲区）。\n\n## 13.2.1\
  \ `unique_ptr` 和 `shared_ptr`\n\n到为止的示例处理了作用域定义的对象，在离开作用域时释放它们获取的资源，但分配在堆（free store）上的对象该呢？在`<memory>`\
  \ 中，标准库提供了两个“智能指针”来帮助管理堆上的对象：\n\n[1] `unique_ptr` 表示唯一所有权\n\n[2] `shared_ptr` 表示共享所有权\n\
  \n这些“智能指针”最基本的用法是防止因粗心编程导致的内存泄漏。例如：\n\n点击此处查看代码图像\n\n```\n[](#cb362-1)void f(int\
  \ i, int j)    // X* 对比 unique_ptr<X>\n[](#cb362-2){\n[](#cb362-3)     X* p = new\
  \ X;                // 分配一个新的 X\n[](#cb362-4)     unique_ptr<X> sp {new X};    //\
  \ 分配一个新的 X 并将其指针交给 unique_ptr\n[](#cb362-5)     // ...\n[](#cb362-6)\n[](#cb362-7)\
  \     if (i<99) throw Z{};         // 可能会抛出异常\n[](#cb362-8)     if (j<77) return;\
  \            // 可能会“提前”返回\n[](#cb362-9)     // ... 使用 p 和 sp ..\n[](#cb362-10) \
  \    delete p;                    // 销毁 *p\n[](#cb362-11)}\n\n\n在这里，如果 `i<99` 或\
  \ `j<77`，我们“忘记”删除 `p`。另一方面，`unique_ptr` 确保无论我们以何种方式退出 `f()`（抛出异常、执行 `return` 或“运行到末尾”），其对象都能被正确销毁。讽刺的是，我们只需*不*使用指针且*不*使用\
  \ `new` 就能解决问题：\n\n点击此处查看代码图像\n\n```\n[](#cb363-1)void f(int i, int j)    // 使用局部变量\n\
  [](#cb363-2){\n[](#cb363-3)     Xx;\n[](#cb363-4)     // ...\n[](#cb363-5)}\n```\n\
  \n不幸的是，过度使用 `new`（以及指针和引用）似乎是一个日益严重的问题。\n\n然而，当你确实需要指针的语义化时，`unique_ptr` 是一种非常轻量级的机制，与正确使用内置指针相比，它没有空间或时间开销。它的进一步用途包括将堆分配的对象传入函数或从函数传出：\n\
  \n点击此处查看代码图像\n\n```\n[](#cb364-1)unique_ptr<X> make_X(int i)\n[](#cb364-2)     //\
  \ ...\n[](#cb364-3)     return unique_ptr<X>{i};\n```\n\n`unique_ptr` 管理对象的方式就像\
  \ `vector` 管理序列的方式一样。`shared_ptr` 与 `unique_ptr` 的区别在于 `shared_ptr` 是拷贝而非移动的。`shared_ptr`\
  \ 提供了一种类似于垃圾回收的形式。例如：\n\n点击此处查看代码图像\n\n```\n[](#cb365-1)void f(shared_ptr<fstream>);\n\
  [](#cb365-2)void g(shared_ptr<fstream>);\n[](#cb365-3)void user(const string& name,\
  \ ios_base::openmode mode)\n[](#cb365-4){\n[](#cb365-5)     shared_ptr<fstream>\
  \ fp {new fstream(name, mode)};\n[](#cb365-6)     if (!fp)\n[](#cb365-7)       \
  \     throw No_file{};\n[](#cb365-8)     // ...\n[](#cb365-9)     f(fp);\n[](#cb365-10)\
  \    g(fp);\n[](#cb365-11)}\n```\n\n现在，`fp` 是指向堆分配的 `fstream` 对象的 `shared_ptr`，该对象在最后一个\
  \ `shared_ptr` 销毁时关闭。注意 `f()` 或 `g()` 可能会产生 `fp` 的拷贝。\n\n只有当你确实需要共享所有权时才使用 `shared_ptr`。在堆上创建对象然后将其传递给\
  \ `shared_ptr` 显得有些繁琐。它还可能导致错误，例如忘记传递 `unique_ptr`，或将非堆对象的指针交给 `shared_ptr`。为了避免此类问题，标准库（在`<memory>`\
  \ 中）提供了构造对象并返回相应智能指针的函数，`make_shared()` 和 `make_unique()`。例如：\n\n点击此处查看代码图像\n\n\
  ```\n[](#cb366-1)struct S {\n[](#cb366-2)     int i;\n[](#cb366-3)     string s;\n\
  [](#cb366-4)     double d;\n[](#cb366-5)     // ...\n[](#cb366-6)};\n[](#cb366-7)\n\
  auto p1 = make_shared<S>(1,\"Ankh Morpork\",4.65);    // p1 是 shared_ptr<S>\n[](#cb366-8)auto\
  \ p2 = make_unique<S>(2,\"Oz\",7.62);              // p2 是 unique_ptr<S>\n```\n\n\
  现在，`p2` 是一个指向堆分配的 `S` 类型对象的 `unique_ptr<S>`，其值为`{2,\"Oz\"s,7.62}`。\n\n使用 `make_shared()`\
  \ 不仅比单独使用 `new` 创建对象再传递给 `shared_ptr` 更方便，它的效率也明显更高，因为它不需要为 `shared_ptr` 实现中至关重要的引用计数进行单独的分配。\n\
  \n\n\n\n通过 `unique_ptr` 和 `shared_ptr`，我们可以为许多程序实现一套完整的“无裸 `new`”策略（§4.2.2）。然而，这些“智能指针”在概念上仍然是指针，因此它们是我资源管理的次优选择——仅次容器和其他在更高概念层级管理其资源的类型。特别是，`shared_ptr`\
  \ 本身并没有提供任何规则来规定哪些所有者可以读取和或写入共享对象。数据竞态（§15.7）和其他形式的混乱并不能简单通过消除资源管理问题来解决。\n\n我们应该在何时使用“智能指针”（如\
  \ `unique_ptr`），而不是使用专门为资源设计的资源句柄（如 `vector` 或 `thread`）呢？意乎意料的是，答案是“当我们需要指针语义时”。\n\
  \n*   当我们共享一个对象时，我们需要指针（或引用）来引用该共享对象，因此 `shared_ptr` 成了显而易见的选择（除非有明显的单一所有者）。\n*\
  \   当我们在经典面向对象的代码中引用多态对象（§4.5）时，我们需要指针（或引用），因为我们不知道所引用对象的具体类型（甚至不知道其大小），因此 `unique_ptr`\
  \ 成了显而易见的选择。\n*   共享的多态对象通常需要 `shared_ptr`。\n\n我们*不需要*使用指针从函数返回对象集合；一个作为资源句柄的容器就能简单且高效地完成任务（§5.2.2）。\n\
  \n### 13.2.2 `move()` 和 `forward()`\n\n移动和拷贝之间的选择大部分是隐式的（§3.6）。编译器在对象即将销毁时（例如在 `return`\
  \ 中）会倾向于移动，因为这被认为是更简单、更高效的操作。然而，有时我们必须显式指定。例如，`unique_ptr` 是对象的唯一所有者。因此，它不能被拷贝：\n\
  \n点击此处查看代码图像\n\n```\n[](#cb367-1)void f1()\n[](#cb367-2){\n[](#cb367-3)     auto\
  \ p = make_unique<int>(2);\n[](#cb367-4)     auto q = p;       // error: 我们不能拷贝\
  \ unique_ptr\n[](#cb367-5) // ...\n[](#cb367-6)}\n```\n\n如果你在其他地方需要一个 `unique_ptr`，你必须移动它。例如：\n\
  \n点击此处查看代码图像\n\n```\n[](#cb368-1)void f1()\n[](#cb368-2){\n[](#cb368-3)     auto\
  \ p = make_unique<int>(2);\n[](#cb368-4)     auto q = move(p);       // p 现在持有 nullptr\n\
  [](#cb368-5)     // ...\n[](#cb368-6)}\n```\n\n令人困惑的是，`std::move()` 并不移动任何东西。相反，它将参数转换为右值引用，从而表示该参数将不再被使用，因此可以被移动（§5.2.2）。它应该被称为类似于\
  \ `rvalue_cast` 的名字。与其他类型转换一样，它很容易出错且最好避免。它的存在是为了服务少数关键场景。考虑一个简单的交换：\n\n点击此处查看代码图像\n\
  \n```\n[](#cb369-1)template <typename T>\n[](#cb369-2)void swap(T& a, T& b)\n[](#cb369-3){\n\
  [](#cb369-4)     T tmp {move(a)};       // T 构造函数看到右值并执行移动\n[](#cb369-5)     a =\
  \ move(b);           // T 赋值看到右值并执行移动\n[](#cb369-6)     b = move(tmp);         //\
  \ T 赋值看到右值并执行移动\n[](#cb369-7)}\n```\n\n我们不希望反复拷贝可能的大型对象，所以我们使用 `std::move()` 请求移动。\n\
  \n与其他类型转换一样，`std::move()` 存在一些诱人但危险的用法。考虑：\n\n点击此处查看代码图像\n\n```\n[](#cb370-1)string\
  \ s1 = \"Hello\";\n[](#cb370-2)string s2 = \"World\";\n[](#cb370-3)vector<string>\
  \ v;\n[](#cb370-4)v.push_back(s1);          // 使用一个 \"const string\" \n[](#cb370-5)v.push_back(move(s2));\
  \    // s2 被移动\n```\n\n\n` 标签后直接结束了）。根据您提供的开头片段，我为您翻译了已有的部分。如果您有完整的文本，请再次提供。\n\n\
  [content]\n我们假设 `p` 指向 `n` 个整数。遗憾的是，这个假设仅仅是一个约定，因此我们无法用它来编写范围 `for` 循环，编译器也无法实现廉价且高效范围检查。此外，我们的假设可能是错误的：\n\
  \n点击查看代码图像\n\n```\n[](#cb374-1)void use(int x)\n[](#cb374-2){\n[](#cb374-3)    \
  \ int a[100];\n[](#cb374-4)     fpn(a,100);        // OK\n[](#cb374-5)     fpn(a,1000);\
  \       // 哎，我的手指滑了！(fpn 中的范围错误)\n[](#cb374-6)     fpn(a+10,100);     // fpn 中的范围错误\n\
  [](#cb374-7)     fpn(a,x);          // 可疑，但看起来无害\n[](#cb374-8)}\n```\n\n我们可以使用 `span`\
  \ 来做得更好：\n\n点击查看代码图像\n\n```\n[](#cb375-1)void fs(span<int> p)\n[](#cb375-2){\n[](#cb375-3)\
  \     for (int x : p)\n[](#cb375-4)           x = 0;\n[](#cb375-5)}\n```\n\n我们可以这样使用\
  \ `fs`：\n\n点击查看代码图像\n\n```\n[](#cb376-1)void use(int x)\n[](#cb376-2){\n[](#cb376-3)\
  \     int a[100];\n[](#cb376-4)     fs(a);                  // 隐式创建一个 span<int>{a,100}\n\
  [](#cb376-5)     fs(a,1000);             // 错误：期望 span\n[](#cb376-6)     fs({a+10,100});\
  \         // fs 中的范围错误\n[](#cb376-7)     fs({a,x});              // 明显可疑\n[](#cb376-8)}\n\
  ```\n\n也就是说，直接从数组创建 `span` 的这种常见情况现在是安全的（编译器计算元素数量），并且在表示法上非常简单。对于其他情况，错误的概率降低了，因为程序员必须显式地组合一个\
  \ span。\n\n将 `span` 从一个函数传递到另一个函数的常见情况比 `(指针, 计数)` 接口更简单，并且显然不需要额外的检查：\n\n点击查看代码图像\n\
  \n```\n[](#cb377-1)void f1(span<int> p);\n[](#cb377-2)\n[](#cb377-3)void f2(span<int>\
  \ p)\n[](#cb377-4){\n[](#cb377-5)     // ...\n[](#cb377-6)     f1(p);\n[](#cb377-7)}\n\
  ```\n\n当用于下标索引时（例如 `r[i]`），会进行范围检查，并在发生范围错误时抛出 `gsl::fail_fast`。对于对性能至关重要的代码，可以抑制范围检查。当\
  \ `span` 进入标准库时，我预计 `std::span` 将使用合约 [Garcia,2017] 来控制对范围违规的响应。\n\n注意，循环只需要一次范围检查。因此，对于使用\
  \ `span` 的函数体体是对该 `span` 的循环这种常见情况，范围检查几乎是免费的。\n\n直接支持字符的 `span`，并称为 `gsl::string_span`。\n\
  \n### 13.4 特殊化容器\n\n标准库提供了几个无法完美契合 STL 框架的容器（第 11 章, 第 12 章）。示例包括内置数组、`array` 和\
  \ `string`。我有时将它们称为“几乎是容器的”，但这并不完全公平：它们持有元素，所以它们是容器，但每个容器都有限制或额外的功能，这使得它们在 STL 境下显得很笨拙。单独描述它们也可以简化\
  \ STL 的描述。\n\n| **“几乎是容器的”** |\n| --- |\n| `T[N]` | 内置数组：一个固定大小的连续分配的 `N` 个 `T`\
  \ 类型元素的序列；隐式转换为 `T*` |\n| `array<T,N>` | 一个固定大小的连续分配的 `N` 个 `T` 类型元素的序列；与内置数组类似，但解决了大部分问题\
  \ |\n| `bitset<N>` | 一个 `N` 位的固定大小序列 |\n| `vector<bool>` | 存储在 `vector` 特殊化版本中的紧凑存储的位序列\
  \ |\n| `pair<T,U>` | 两个类型为 `T` 和 `U` 的元素 |\n| `tuple<T...>` | 任意数量元素的序列 |\n| `basic_string<C>`\
  \ | 类型为 `C` 的字符序列 |\n| `valarray<T>` | 类型为 `T` 的数值序列\n\n为什么标准库提供这么多容器？它们满足不同的需求。例如：\n\
  \n* `array` 和 `tuple` 满足异构需求。\n* `list` 和 `vector` 满足同构需求。\n* `bitset` 满足位需求。\n\
  * `pair` 和 `map` 满足关联需求。\n* `basic_string` 和 `string` 满足字符串需求。\n* `valarray` 满足数值需求。\n\
  \n### 13.4.1 `array`\n\n在编译时定义的固定大小序列。它可以分配在栈上、静态存储区或堆上。`array` 是内置数组的封装，与原始数组相比没有开销。\n\
  \n在初始化时必须指定元素数量：\n\n点击查看代码图像\n\n```\n[](#cb378-1)array<int,3> a1 = {1,2,3};\n```\n\
  \n元素数量不是可选的：\n\n点击查看代码图像\n\n```\n[](#cb379-1)array<int> ax = {1,2,3};     // 错误指定的大小\n\
  ```\n\n元素数量必须是常量表达式：\n\n点击查看代码图像\n\n```\n[](#cb380-1)void f(int n)\n[](#cb380-2){\n\
  \     array<string,n> aa = {\"John's\", \"Queens'  \"}; // 错误大小不是常量\n[](#cb380-4)}\n\
  ```\n\n如果你需要元素数量为变量，请使用 `vector`。\n\n如有必要，`array` 可以显式传递给期望指针的 C 风格函数。例如：\n\n点击查看代码图像\n\
  \n```\n[](#cb381-1)void f(int* p, int sz);    // C 风格接口\n[](#cb381-3)void g()\n\
  [](#cb381-4){\n     array<int,10> a;\n[](#cb381-7)     f(a,a.size());          \
  \   // 错误：无转换\n[](#cb381-8)     f(&a[0],a.size());         // C 风格用法\n[](#cb381-9)\
  \     f(a.data(),a.size());      // C 风格用法\n[](#cb381-11)     auto p = find(a.begin(),a.end(),777);\
  \    // C++/STL 风格用法\n[](#cb381-12)     // ...\n[](#cb381-13)}\n```\n\n\n\n\n既然\
  \ `vector` 如此灵活，我们为什么还要使用 `array` 呢？`array` 的灵活性较低，因此它更简单。偶尔，直接访问分配在栈（stack）上的元素，比在空闲存储（free\
  \ store）上分配元素、通过 `vector`（一个句柄）间接访问它们然后释放它们，在性能上具有显著的优势。另一方面，栈是有限的资源（特别是在某些嵌入式系统上），而且栈溢出是非常糟糕的。\n\
  \n既然既然我们可以使用内置数组，我们为什么还要使用 `array` 呢？`array` 知道自己的大小，因此很容易与标准库算法配合使用，并且可以使用 `=`\
  \ 进行拷贝。然而，我偏好使用 `array` 的主要原因是它可以让我避免出人意料且糟糕的指针转换。考虑一下：\n\n点击此处查看代码图像\n\n```\n[](#cb382-1)void\
  \ h()\n[](#cb382-2){\n[](#cb382-3)     Circle a1[10];\n[](#cb382-4)     array<Circle,10>\
  \ a2;\n[](#cb382-5)     // ...\n[](#cb382-6)     Shape* p1 = a1;    // OK: 可能会发生的灾难\n\
  [](#cb382-7)     Shape* p2 = a2;    // error: 无法将 array<Circle,10> 转换为 Shape*\n\
  [](#cb382-8)     p1[3].draw();      // 灾难\n[](#cb382-9)}\n```\n\n“灾难”注释假设 `sizeof(Shape)<sizeof(Circle)`，因此通过\
  \ `Shape*` 对 `Circle[]` 进行下标访问会产生错误的偏移量。所有标准容器都提供了比内置数组的这一优势。\n\n### 13.4.2 `bitset`\n\
  \n系统的某些方面（例如输入流的状态）通常表示为一组标志位，用于指示二进制状态，如好/坏、真/假和开/关。C++ 通过对整数进行位运算，高效地支持了小规模标志位集合的概念（§1.4）。类\
  \ `bitset<N>` 通过提供对长度为 `N` 的位序列（`0`:`N)`）的操作泛化了这一概念，其中 `N` 在编译时已知。对于无法放入 `long long\
  \ int` 的位集，使用 `bitset` 比直接使用整数要方便得多。对于较小的集合，`bitset` 通常经过了优化。如果你想为位命名而不是只给它们编号，可以使用\
  \ `set`（§[11.4）或枚举（§2.5）。\n\n`bitset` 可以用整数或字符串初始化：\n\n点击此处查看代码图像\n\n```\n[](#cb383-1)bitset<9>\
  \ bs1 {\"110001111\"};\n[](#cb383-2)bitset<9> bs2 {0b1'1000'1111};     // 使用数字分隔符的二进制字面量\
  \ (§1.4)\n```\n\n可以使用常用的位运算符（§1.4）以及左移和右移运算符（`<<` 和 `>>`）：\n\n点击此处查看代码图像\n\n```\n\
  [](#cb384-1)bitset<9> bs3 = ~bs1;       // 补码：bs3==\"001110000\"\n[](#cb384-2)bitset<9>\
  \ bs4 = bs1&bs3;    // 全为零\n[](#cb384-3)bitset<9> bs5 = bs1<<2;     // 左移：bs5 =\
  \ \"000111100\"\n```\n\n移位运算符（此处为 `<<`）会“移入”零。\n\n`to_ullong()` 和 `to_string()`\
  \ 操作提供了构造函数的逆操作。例如，我们可以写出一个 `int` 的二进制表示：\n\n点击此处查看代码图像\n\n```\n[](#cb385-1)void\
  \ binary(int i)\n[](#cb385-2){\n[](#cb385-3)     bitset<8*sizeof(int)>b = i;   \
  \     // 假设字节为 8 位（见 §14.7）\n[](#cb385-4)     cout << b.to_string() << '\\n';  \
  \   // 输出 i 的各个位\n[](#cb385-5)}\n```\n\n这会将表示为 `1` 和 `0` 的位从左到右打印，最高位在左侧，因此参数 `123`\
  \ 将得到输出\n\n```\n[](#cb386-1)0000000000000000000000001111011\n```\n\n对于这个例子，直接使用\
  \ `bitset` 输出更简单：\n\n点击此处查看代码图像\n\n```\n[](#cb387-1)void binary2(int i)\n[](#cb387-2){\n\
  [](#cb387-3)     bitset<8*sizeof(int)>b = i;    // 假设字节为 8 位（见 §14.7）\n[](#cb387-4)\
  \     cout << b << '\\n';             // 输出 i 的位\n```\n\n### 13.4.3 `pair` 和 `tuple`\n\
  \n我们通常需要一些数据；一个值的集合，而不是一个具有良好语义和不变式的类的对象 (3.5.2）。在这种情况下，具有适当命名成员的简单 `struct` 通常是理想的。或者，我们可以让标准库为我们编写定义。例如，标准库算法\
  \ `equal_range` 返回迭代器的 `pair`：\n\n点击此处查看代码图像\n\n```\n[](#cb388-1)template<typename\
  \ Forward_iterator, typename T, typename Compare>\n[](#cb388-2)pair<Forward_iterator,\
  \ Forward_iterator>\n[](#cb388-3)equal_range(Forward_iterator first, Forward_iterator\
  \ last, const T& val, Compare cmp);\n```\n\n给定一个排序序列 (`first:last`)，`equal_range()`\
  \ 将返回匹配谓词 `cmp` 的子序列 `pair`。我们可以利用它在排序的 `Record` 中进行搜索：\n\n点击此处查看代码图像\n\n```\n[](#cb389-1)auto\
  \ less = [](const Record& r1, const Record& r2) { return r1.name < r2.name;}; //\
  \ 比较名称\n[](#cb389-2)void f(const vector<Record>& v)        // 假设 v 按 \"name\" 字段排序\n\
  [](#cb389-3){\n[](#cb389-4)     auto er = equal_range(v.begin(),v.end(),{\"Reg\"\
  },less);\n[](#cb389-5)     for (auto p = er.first; p!=er.second; ++p)    // 输出相同的\
  \ Record\n[](#cb389-6)           cout << *p;                      // 假设 Record 定义了\
  \ <<\n[](#cb389-7)}\n```\n\n`pair` 的第一个成员称为 `first`，第二个成员称为 `second`。这种命名并不特别，起初看起来有点奇怪，但当我们编写通用代码时，这种一致的命名是一种福音。当\
  \ `first` 和 `last` 名称太通用时，我们可以使用结构化绑定 (3.6.3):\n\n点击此处查看代码图像\n\n```\n[](#cb390-1)void\
  \ f2(const vector<Record>& v)     // 假设 v 按 \"name\" 字段排序\n[](#cb390-2){\n[](#cb390-3)\
  \     auto [first,last] = equal_range(v.begin(),v.end(),{\"Reg\"},less);\n[](#cb390-4)\n\
  [](#cb390-5)     for (auto p = first; p!=last; ++p)     // 输出相同的 Record\n[](#cb390-6)\
  \           cout << *p;                      // 假设 Record 定义了 <<\n[](#cb390-7)}\n\
  ```\n\n标准库 `pair` (来自 `<utility>`) 在标准库及其他地方频繁使用。如果元素支持，`pair` 会提供如 `=`、`==` 和 `<`\
  \ 等运算符。类型推导可以轻松创建一个无需显式提及类型的 `pair`。例如：\n\n点击此处查看代码图像\n\n```\n[](#cb391-1)void f(vector<string>&\
  \ v)\n[](#cb391-2){\n[](#cb391-3)     pair p1 {v.begin(),2};             // 一种方法\n\
  [](#cb391-4)     auto p2 = make_pair(v.begin(),2);  // 另一种方法\n[](#cb391-5)     //\
  \ ...\n[](#cb391-6)}\n```\n\n`p1` 和 `p2` 的类型都是 `pair<vector<string>::iterator,int>`。\n\
  \n如果你需要两个以上的元素（或少），可以使用 `tuple` (来自 `<utility>`)。`tuple` 是异构元素序列；例如：\n\n点击此处查看代码图像\n\
  \n```\n[](#cb392-1)tuple<string,int,double> t1 {\"Shark\",123,3.14};    // 显式指定类型\n\
  [](#cb392-2)auto t2 = make_tuple(string{\"Herring\"},10,1.23);   // 类型推导为 tuple<string,int,double>\n\
  [](#cb392-3)tuple t3 {\"Cod\"s,20,9.99};                         // 类型推导为 tuple<string,int,double>\n\
  ```\n\n旧代码倾向于使用 `make_tuple()`，因为从构造参数进行模板类型推导是 C++17 才有的特性。\n\n\n\n\n\n点击此处查看代码图片\n\
  \n```\n[](#cb393-1)string s = get<0>(t1);      // get the first element: \"Shark\"\
  \n[](#cb393-2)int x = get<1>(t1);         // get the second element: 123\n[](#cb393-3)double\
  \ d = get<2>(t1);      // get the third element: 3.14\n```\n\n`tuple` 的元素是有编号的（从\
  \ 0 开始），且索引必须是常量。\n\n通过索引访问 `tuple` 的成员是通用的，但很简陋且容易出错。幸运的是，如果 `tuple` 中某个元素的类型是唯一的，则可以通过该类型对其进行“命名”：\n\
  \n点击此处查看代码图片\n\n```\n[](#cb394-1)auto s = get<string>(t1);     // get the string:\
  \ \"Shark\"\n[](#cb394-2)auto x = get<int>(t1);        // get the int: 123\n[](#cb394-3)auto\
  \ d = get<double>(t1);     // get the double: 3.14\n```\n\n我们也可以使用 `get<>` 进行写入：\n\
  \n点击此处查看代码图片\n\n```\n[](#cb395-1)get<string>(t1) = \"Tuna\";    // write to the\
  \ string\n[](#cb395-2)get<int>(t1) = 7;            // write to the int\n[](#cb395-3)get<double>(t1)\
  \ = 312;       // write to the double\n```\n\n和 `pair` 一样，如果 `tuple` 的元素可以赋值和比较，那么\
  \ `tuple` 也可以进行赋值和比较。和 `tuple` 元素一样，`pair` 元素可以使用 `get<>()` 访问。\n\n和 `pair` 一样，结构绑定\
  \ (§3.6.3)也可以用于 `tuple`。然而，当代码不需要泛型时，使用带有命名成员的简单 struct 通常会产生更具维护性的代码。\n\n## 13.5\
  \ 替代方案\n\n标准库提供了三种类型来表示替代方案：\n\n- `variant`：表示一组指定替代方案中的其中一种（在`<variant>` 中）\n-\
  \ `optional`：表示指定类型的值或无值（在`<optional>` 中）\n- `any`：表示一组无边界替代类型中的其中一种（在`<any>` 中）\n\
  \n这三种类型为用户提供了相关的功能。遗憾的是，它们没有提供统一的接口。\n\n### 13.5.1 `variant`\n\n`variant<A,B,C>`\
  \ 通常比显式使用 `union` (§2.4) 更安全、更方便的替代方案。最简单的例子可能是返回一个值或错误代码：\n\n点击此处查看代码图片\n\n```\n\
  [](#cb396-1)variant<string,int> compose_message(istream& s)\n[](#cb396-2){\n[](#cb396-3)\
  \     string mess;\n[](#cb396-4)     // ... read from s and compose message ...\n\
  [](#cb396-5)     if (no_problems)\n[](#cb396-6)           return mess;         \
  \   // return a string\n[](#cb396-7)     else\n[](#cb396-8)           return error_number;\
  \    // return an int\n[](#cb396-9)}\n```\n\n当用一个值赋值或初始化 `variant` 时，它会记住该值的类型。稍后，我们可以查询\
  \ `variant` 持什么类型并提取该值。例如：\n\n点击此处查看代码图片\n\n```\n[](#cb397-1)auto m = compose_message(cin));\n\
  [](#cb397-2)\n[](#cb397-3)if (holds_alternative<string>(m)) {\n[](#cb397-4)    \
  \  cout << m.get<string>();\n[](#cb397-5)}\n[](#cb397-6)else {\n[](#cb397-7)   \
  \   int err = m.get<int>();\n[](#cb397-8)      // ... handle error ...\n)}\n```\n\
  \n这种风格吸引了一些不喜欢异常的人（参见 §3.5.3），但还有更有趣的用法。例如，一个简单的编译器可能需要区分具有不同表示节点：\n\n点击此处查看代码图片\n\
  \n```\n[](#cb398-1)using Node = variant<Expression,Statement,Type>;\n[](#cb398-2)void\
  \ check(Node* p)\n[](#cb398-3){\n[](#cb398-4)     if (holds_alternative<Expression>(*p))\
  \ {\n[](#cb398-5)           Expression& e = get<Expression>(*p);\n[](#cb398-6) \
  \          // ...\n[](#cb398-7)     else if (holds_alternative<Statement>(*p)) {\n\
  [](#cb398-8)           Statement& s = get<Statement>(*p);\n[](#cb398-9)        \
  \   // ...\n[](#cb398-10)     // Declaration and Type\n)}\n```\n\n这种检查替代方案以决定适当操作的模式非常常见且效率较低，以至于它应该获得直接支持：\n\
  \n点击此处查看代码图片\n\n```\n[](#cb399-1)void check(Node* p)\n[](#cb399-2){\n[](#cb399-3)\
  \     visit(overloaded {\n[](#cb399-4)           [](Expression& e) { /* ... },\n\
  [](#cb399-5)           [](Statement& s) { /* ... },\n[](#cb399-6)           // Declaration\
  \ and Type\n[](#cb399-7)    }, p);}\n```\n\n这基本上等同于虚函数调用，但可能更快。正如所有关于性能的声明一样，这种“可能更快”在性能关键时应该经过验证。遗憾的是，`overloaded`\
  \ 并不是标准的。它是从一组参数（通常是 lambda 表达式）构建重载的“魔法”：\n\n点击此处查看代码图片\n\n```\n[](#cb400-1)template<class...\
  \ Ts>\n[](#cb400-2)struct overloaded : Ts... {\n[](#cb400-3)     using Ts::operator()...;\n\
  };\n[](#cb400-4)template<class... Ts>\n[](#cb400-5)overloaded(Ts...) -> overloaded<Ts...>;\
  \ // deduction guide\n```\n\n“访问者” `visit` 然后对 `overloaded` 应用 `()`，根据重载规则选择最合适的\
  \ lambda。\n\n*推导引导* 是一种解决微妙歧义的机制，主要用于基础库中的类构造函数。\n\n如果我们尝试访问一个与预期类型不同的 `variant`，将抛出\
  \ `bad_variant_access`。\n\n### 13.5.2 `optional`\n\n`optional<A>` 可以被视为特殊的 `variant`（如\
  \ `variant<A,nothing>`），或视为 `A*` 指向对象或为 `nullptr` 概念的泛化。\n\n`optional` 对于可能或不返回对象的函数有用：\n\
  \n点击此处查看代码图片\n\n```\n[](#cb401-1)optional<string> compose_message(istream& s)\n\
  [](#cb401-2){\n[](#cb401-3)     string mess;\n[](#cb401-4)     // ... read from\
  \ s and compose message ...\n[](#cb401-6)     if (no_problems)\n[](#cb401-8)   \
  \        return mess;\n[](#cb401-9)     return {}; // the empty optional\n[](#cb401-10)}\n\
  ```\n\n基于此，我们可以写：\n\n点击此处查看代码图片\n\n```\n[](#cb402-1)if (auto m = compose_message(cin))\n\
  [](#cb402-2)      cout << *m; // note the dereference (*)\n[](#cb402-3)else {\n\
  [](#cb402-4)     // ... handle error ...\n)}\n```\n\n这吸引了一些不喜欢异常的人（参见 §3.5.3）。注意\
  \ `*` 的奇用。`optional` 被视为指向对象的指针而不是对象本身。\n\n`optional` 等于 `nullptr` 的空对象 `{}`。例如：\n\
  \n点击此处查看代码图片\n\n```\n[](#cb403-1)int cat(optional<int> a, optional<int> b)\n[](#cb403-2){\n\
  [](#cb403-3)     int res = 0;\n[](#cb403-4)     if (a) res+=*a;\n[](#cb403-5)  \
  \   if (b) res+=*b;\n[](#cb403-6)     return res;\n[](#cb403-7)}\n[](#cb403-9)int\
  \ x = cat(17,19);\n[](#cb403-10)int y = cat(17,});\n[](#cb403-11)int z = cat({},{});\n\
  ```\n\n如果我们尝试访问一个不持值的 `optional`，结果是未定义的；*不会*抛出异常。因此，`optional` 不保证类型安全。\n\n###\
  \ 13.5.3 `any`\n\n`any` 可以持有任意类型并知道它持有什么种类型（如果有）。它基本上是 `variant` 的无约束版本：\n\n点击此处查看代码图片\n\
  \n\n\n\n\n```cpp\n[](#cb404-1)any compose_message(istream& s)\n[](#cb404-2){\n[](#cb404-3)\
  \    string mess;\n[](#cb404-4)\n[](#cb404-5)    // ... 从 s 读取并组合 message ...\n\
  [](#cb404-6)\n[](#cb404-7)    if (no_problems)\n[](#cb404-8)          return mess;\
  \           // 返回一个字符串\n[](#cb404-9)    else\n[](#cb404-10)          return error_number;\
  \   // 返回一个 int\n[](#cb404-11)}\n```\n\n当你用一个值赋值或初始化 `any` 时，它会记住该值的类型。稍后，我们可以查询\
  \ `any` 持有什么类型并提取出该值。例如：\n\n点击此处查看代码图片\n\n```cpp\n[](#cb405-1)auto m = compose_message(cin));\n\
  [](#cb405-2)string& s = any_cast<string>(m);\n[](#cb405-3)cout << s;\n```\n\n如果我们尝试访问一个持有与预期类型不同的\
  \ `any`，则会抛出 `bad_any_access`。此外还有不依赖异常的方法来访问 `any`。\n\n### 13.6 分配器 (Allocators)\n\
  \n默认情况下，标准库容器使用 `new` 分配空间。`new` 和 `delete` 操作符提供了一个通用的自由存储（也称为动态内存或堆），它可以容纳任意大小且由用户控制生命期的对象。这意味着会产生时间和空间开销，这些开销在许多特殊情况下是可以消除的。因此，标准库容器提供了在需要时安装特定语义分配器的机会。这被用于解决各种与性能（例如，池分配器）、安全（在删除时清理内存的分配器）、每线程分配以及非均匀内存访问架构（在特定内存中分配并使用匹配的指针类型）相关的广泛问题。这里不是讨论这些重要但非常专业且通常是高级的技术的地方。然而，我将给出一个受现实问题启发的示例，其中池分配器是解决方案\
  \ [Zubkov,2017]。\n\n一个重要的长期运行系统使用事件队列（参见 §15.6），它使用 `vector` 作为事件，并通过 `shared_ptr`\
  \ 的形式传递。这样，事件的最后一个用户就会隐式地删除它：\n\n点击此处查看代码图片\n\n```cpp\n[](#cb406-1)struct Event\
  \ {\n[](#cb406-2)     vector<int> data = vector<int>(512);\n[](#cb406-3)};\n[](#cb406-4)\n\
  [](#cb406-5)list<shared_ptr<Event>> q;\n[](#cb406-6)\n[](#cb406-7)void producer()\n\
  [](#cb406-8){\n[](#cb406-9)     for (int n = 0; n!=LOTS; ++n) {\n[](#cb406-10) \
  \          lock_guard lk {m};      // m 是一个 mutex (§15.5)\n[](#cb406-11)       \
  \    q.push_back(make_shared<Event>());\n[](#cb406-12)           cv.notify_one();\n\
  [](#cb406-13)     }\n[](#cb406-14)}\n```\n\n从逻辑角度来看，这种做法运行良好。它逻辑上简单，因此代码是健壮且可维护的。遗憾的是，这导致了严重的碎片。在\
  \ 16 个生产者和 4 个消费者之间传递了 100,000 个事件后，消耗了超过 6GB 的内存。\n\n碎片问题的传统解决方案重写代码使用池分配器。池分配器是一种管理固定大小对象的分配器，它一次为许多对象分配空间，而不是使用单独分配。幸运的是，C++17\
  \ 为此提供了直接支持。池分配器定义在 `std` 的 `pmr`（“多态内存资源”）子命名空间中：\n\n点击此处查看代码图片\n\n```cpp\n[](#cb407-1)pmr::synchronized_pool_resource\
  \ pool;             // 创建池\n[](#cb407-2)\n[](#cb407-3)struct Event {\n[](#cb407-4)\
  \     vector<int> data = vector<int>{512,&pool};   // 让 Events 使用该池\n[](#cb407-5)};\n\
  [](#cb407-6)\nlist<shared_ptr<Event>> q {&pool};                // 让 q 使用该池\n[](#cb407-7)\n\
  [](#cb407-8)void producer()\n[](#cb407-9){\n[](#cb407-10)     for (int n = 0; n!=LOTS;\
  \ ++n) {\n[](#cb407-11)           lock_guard lk {m};      // m 是一个 mutex (§15.5)\n\
  [](#cb407-12)           q.push_back(make_shared<Event>());\n[](#cb407-13)      \
  \     cv.notify_one();\n[](#cb407-14)     }\n```\n\n### 13.7 时间\n\n在 `<chrono>`\
  \ 中，标准库提供了时间设施。例如，这里是基础：点击此处查看代码图片\n\n```cpp\n[](#cb410-1)using namespace std;\n\
  [](#cb410-2)auto spring_day = apr/7/20;\n[](#cb410-3)cout << weekday(spring_day)\
  \ << '\\n';\n```\n\n两个两个 `time_point` 会得到一个 `duration`。时返回 `time_point`。各种 `duration`\
  \ 单位如 `nanoseconds`, `microseconds`, `milliseconds`, `seconds`, `minutes`, `hours`,\
  \ `days`, `weeks`, `months` 和 `years` 都是可用的。标准还支持时间字面量。例如：\n\n```cpp\n[](#cb411-1)using\
  \ namespace std::chrono_literals;\n[](#cb411-2)auto d = 10ms + 33us;\n```\n\n这些后缀定义在\
  \ `std::chrono` 中。你也可以使用 `duration_cast` 来转换单位：\n\n```cpp\n[](#cb412-1)auto t0 =\
  \ high_resolution_clock::now();\n[](#cb412-2)auto t1 = high_resolution_clock::now();\n\
  [](#cb412-3)auto diff = duration_cast<milliseconds>(t1 - t0);\n```\n\n标准还支持闰秒、日历和时区，这些是\
  \ C++20 添加的。目前某些编译器中可用。\n\n### 13.8 函数适配 (Function Adaptation)\n\n当传递函数时，参数类型必须完全匹配调用函数的预期。如果预期参数“几乎匹配”，我们有三种很好的替代方案：\n\
  \n*   使用 lambda (§13.8.1)。\n*   使用 `std::mem_fn()` 从成员函数创建函数对象 (§13.8.2)。\n*   定义函数接受\
  \ `std::function` (§13.8.3)。\n\n还有许多其他方法，但通常这三种方法效果最好。\n\n### 13.8.1 作为 Lambda 适配器\n\
  \n考虑经典的“绘制所有形状”示例：\n\n点击此处查看代码图片\n\n```cpp\n[](#cb413-1)void draw_all(vector<Shape*>&\
  \ v)\n[](#cb413-2){\n[](#cb413-3)     for_each(v.begin(),v.end(),[](Shape* p) {\
  \ p−>draw(); });\n[](#cb413-4)}\n```\n\n像所有标准库算法一样，`for_each()` 使用传统的函数调用语法 `f(x)`\
  \ 调用其参数，但 `Shape's draw()` 使用传统的面向对象表示法 `x−>f()`。Lambda 可以轻松地在两种表示法之间进行调和。\n\n\n\
  \n\n给定一个成员函数，函数适配器 `mem_fn(mf)` 会产生一个可以作为非成员函数调用的函数对象。例如：\n\n点击此处查看代码图像\n\n```\n\
  void draw_all(vector<Shape*>& v) {\n     for_each(v.begin(),v.end(),mem_fn(&Shape::draw));\n\
  }\n```\n\n在 C++11 引入 lambda 之前，`mem_fn()` 及其等物是将面向对象的调用风格映射到函数式风格的主要方法。\n\n### 13.8.3\
  \ `function`\n\n标准库的 `function` 是一种类型，它可以持有任何可以使用调用运算符 `()` 调用的对象。也就是说，类型为 `function`\
  \ 的对象是一个函数对象（§6.3.2）。例如：\n\n点击此处查看代码图像\n\n```\nint f1(double);\nfunction<int(double)>\
  \ fct1 {f1};                // 初始化为 f1\n\nint f2(string);\nfunction fct2 {f2}; \
  \                            // fct2 的类型是 function<int(string)>\n\nfunction fct3\
  \ =  [](Shape* p)  { p->draw();  };  // fct3 的类型是 function<void(Shape*)>\n```\n\n\
  对于 `fct2`，我让 `function` 的类型从初始化器中推导出：`int(string)`。\n\n显然，`function` 对于回调、将操作作为参数、传递函数对象等非常有用。然而，与直接调用相比，它可能会引入一些运行时开销，而且\
  \ `function` 作为一个对象，并不支持参与重载。如果你需要重载函数对象（包括 lambda），请考虑 `overloaded` (§13.5.1）。\n\
  \n## 13.9 类型函数\n\n*类型函数*（type function）是一种在编译时根据其类型参数进行求值或返回某种类型的函数。标准库提供了多种类型函数，以帮助库实现者（以及普通程序员）编写利用语言特性、标准库以及通用代码优势的代码。\n\
  \n对于数值类型，`<limits>` 中的 `numeric_limits` 提供了各种有用的信息 (§14.7）。例如：\n\n点击此处查看代码图像\n\n\
  ```\nconstexpr float min = numeric_limits<float>::min();     // 最小正浮点数\n```\n\n\
  同样，可以通过内置的 `sizeof` 运算符找到对象的大小 (§1.4）。例如：\n\n点击此处查看代码图像\n\n```\nconstexpr int szi\
  \ = sizeof(int);     // int 占用的字节数\n```\n\n此类类型函数是 C++ 编译时计算机制的一部分，允许实现比其他方式更紧凑的类型检查和更好的性能。此类特征的使用通常被称为*元编程*（metaprogramming）或（当涉及模板时）*模板元编程*（template\
  \ metaprogramming）。在这里，我仅介绍标准库提供的两个设施：`iterator_traits` (§13.9.1) 和类型谓词（type predicates，§13.9.2）。概念（Concepts，§7.2）使得其中一些技术变得冗余并简化了其余许多技术，但概念仍然不是标准或无处可用，因此这里介绍的技术被广泛使用。\n\
  \n### 13.9.1 `iterator_traits`\n\n标准库的 `sort()` 接受一对用于定义序列的迭代器（第 12 章）。此外，这些迭代器必须对该序列提供随机访问，即它们必须是*随机访问迭代器*（random-access\
  \ iterators）。某些容器（如 `forward_list`）并不提供这种支持。特别是，`forward_list` 是单向链表，因此使用下标索引开销很大，且没有合理的方法引用回上一个元素。然而，像大多数容器一样，`forward_list`\
  \ 提供了*前向迭代器*（forward iterators），可以用于算法和 `for`语句遍历序列 (§6.2)。\n\n标准库提供了一种名为 `iterator_traits`\
  \ 的机制，允许我们检查提供的是哪种类型的迭代器。据此，我们可以将范围 `sort()` 从 12.8 改进为可以接受 `vector` 或 `forward_list`。例如：\n\
  \n点击此处查看代码图像\n\n```\nvoid test(vector<string>& v, forward_list<int>& lst) {\n  \
  \   sort(v);   // 排序 vector\n     sort(lst); // 排序单向链表\n}\n```\n\n使这能够工作的技术通常是通用的。首先，我编写了两个辅助函数，它们接受一个额外的参数，指示它们是用于随机访问迭代器还是前向迭代器。针对随机访问迭代器的版本显而易见：\n\
  \n```\ntemplate<typename Ran>\nvoid sort_helper(Ran beg, Ran end, random_access_iterator_tag)\
  \ {\n     sort(beg,end);     // 直接排序即可\n}\n```\n\n针对前向迭代器的版本仅是将列表拷贝到 `vector` 中，排序，然后拷贝回来：\n\
  \n```\ntemplate<typename For>\nvoid sort_helper(For beg, For end, forward_iterator_tag)\
  \ {\n     vector<Value_type<For>> v {beg,end};  // 初始化 vector\n     sort(v.begin(),v.end());\
  \              // 使用随机访问排序\n     copy(v.begin(),v.end(),beg);          // 将元素拷贝回\n\
  }\n```\n\n`Value_type<For>` 是 `For` 元素的类型，称为其*值类型*（value type）。每个标准库迭代器都有一个 `value_type`\
  \ 成员。我通过定义类型别名 (§6.4.2) 获得了 `Value_type<For>` 表示法：\n\n```\ntemplate<typename C>\n\
  \     using Value_type = typename C::value_type; // C 的值类型\n```\n\n因此，对于 `vector<X>`，`Value_type<X>`\
  \ 就是 `X`。\n\n真正的“类型魔法”在于辅助函数的选择：\n\n```\ntemplate<typename C>\nvoid sort(C& c) {\n\
  \     using Iter = Iterator_type<C>;\n     sort_helper(c.begin(),c.end(),Iterator_category<Iter>{});\n\
  }\n```\n\n在这里，我使用了类型函数：`Iterator_type<C>` 返回 `C` 的迭代器类型（即 `C::iterator`），然后 `Iterator_category<Iter>{}`\
  \ 构造一个指示提供的迭代器类型的“标签”值：\n\n* 如果 `C` 的迭代器支持随机访问，则是 `std::random_access_iterator_tag`\n\
  * 如果 `C` 的迭代器支持前向遍历，则是 `std::forward_iterator_tag`\n\n据此，我们可以在编译时选择两种排序算法。这种技术被称为*标签分发*（tag\
  \ dispatch），是标准库及其他地方使用的多种技术之一，用于提高灵活性和性能。\n\n我们可以这样定义 `Iterator_type`：\n\n```cpp\n\
  template<typename C>\n    using Iterator_type = typename C::iterator;   // C 的迭代器类型\n\
  ```\n\n然而，为了将此想法扩展到不具有成员类型的类型（如指针），标准库对标签分发的支持以类模板 `iterator_traits` 的形式提供（来自 `<iterator>`）。针对指针的特化版本如下：\n\
  \n\n\n\n\n```cpp\ntemplate<class T>\nstruct iterator_traits<T*>{\n     using difference_type\
  \ = ptrdiff_t;\n     using value_type = T;\n     using pointer = T*;\n     using\
  \ reference = T&;\n     using iterator_category = random_access_iterator_tag;\n\
  };\n```\n\n我们现在可以写：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<typename Iter>\n    using\
  \ Iterator_category = typename std::iterator_traits<Iter>::iterator_category; //\
  \ Iter 的类别\n```\n\n现在 `int*` 尽管没有成员类型，也可以作为随机访问迭代器使用；`Iterator_category<int*>` 的类型是\
  \ `random_access_iterator_tag`。\n\n许多特性（traits）和基于性的的技术将由于概念（concepts）变得多余（§7.2）。考虑\
  \ `sort()` 示例的概念版本：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<RandomAccessIterator Iter>\n\
  void sort(Iter p, Iter q);   // 用于 std::vector 和其他支持随机访问的类型\n\ntemplate<ForwardIterator\
  \ Iter>\nvoid sort(Iter p, Iter q)\n     // 用于 std::list 和其他仅支持前向遍历的类型\n{\n    \
  \ vector<Value_type<Iter>> v {p,q};\n     sort(v);                      // 使用随机访问排序\n\
  \     copy(v.begin(),v.end(),p);\n}\n\ntemplate<RangeR>\nvoid sort(R& r)\n{\n  \
  \   sort(r.begin(),r.end());      // 使用合适的排序\n}\n```\n\n进展发生了。\n\n### 13.9.2 类型谓词\
  \ (Type Predicates)\n\n在 `<type_traits>` 中，标准库提供了简单的类型函数，称为*类型谓词*（type predicates），它们回答关于类型的根本性问题。例如：\n\
  \n点击此处查看代码图片\n\n```cpp\nbool b1 = Is_arithmetic<int>();     // 是，int 是算术类型\nbool\
  \ b2 = Is_arithmetic<string>();  //否，std::string 不是算术类型\n```\n\n其他示例还有 `is_class`、`is_pod`、`is_literal_type`、`has_virtual_destructor`\
  \ 和 `is_base_of`。它们在我们编写模板时最为有用。例如：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<typename Scalar>\n\
  class complex {\n     Scalar re, im;\npublic:\n     static_assert(Is_arithmetic<Scalar>(),\
  \ \"Sorry, 我只支持算术类型的复数\");\n     // ...\n};\n```\n\n与直接使用标准库相比，为了提高可读性，我定义了一个类型函数：\n\
  \n点击此处查看代码图片\n\n```cpp\ntemplate<typename T>\nconstexpr bool Is_arithmetic()\n{\n\
  \    return std::is_arithmetic<T>::value ;\n}\n```\n\n旧程序直接使用 `::value` 而不是 `()`，但我认为那非常丑陋并且暴露了实现细节。\n\
  \n### 13.9.3 `enable_if`\n\n使用类型谓词的明显方法包括 `static_assert` 的条件、编译时 `if` 以及 `enable_if`。标准库中的\
  \ `enable_if` 是一种广泛用于条件条件引入定义的机制。考虑定义一个“智能指针”：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<typename\
  \ T>\nclass Smart_pointer {\n     T& operator*();\n     T& operator(); // 仅当仅当 T\
  \ 是一个类时才有效\n};\n```\n\n`operator()` 应该在且仅当 `T` 是类类型时定义。例如，`Smart_pointer<vector<T>>`\
  \ 应该有 `operator>`，但 `Smart_pointer<int>` 不应该有。我们不能使用编译时 `if`，因为我们不在函数内部。相反，我们写：\n\
  \n点击此处查看代码图片\n\n```cpp\ntemplate<typename T>\nclass Smart_pointer {\n     T& operator*();\n\
  \     std::enable_if<Is_class<T>(), T& operator(); // 且且仅当 T 是一个类时定义\n};\n```\n\n\
  我的类型函数 `Is_class()` 是使用类型特性 `is_class` 定义的，就像我在 §13.9.2 中定义 `is_arithmetic()` 的方式一样。如果\
  \ `Is_class<T>()` 为 `true`，则 `operator()` 的类型为 `T&`；否则，`operator()` 的定义被忽略。\n\n\
  `enable_if` 的语法很奇怪，使用起来很笨拙，在许多情况下由于概念将是多余的（§7.2）。然而，`enable_if` 是许多当前模板元编程和许多标准库组件的基础。它依赖于一种被称为\
  \ SFINAE（“替换失败即错误”）的细微语言特性。\n\n### 13.10 建议\n\n1. 库不需要很大或很复杂就能变得有用；§13.1。\n2. 资源是任何必须获取并且（显式地或隐式地）释放的任何东西；§13.2。\n\
  3. 使用资源句柄来管理资源（RAII）；§13.2; [CG: R.1]。\n4. 使用 `unique_ptr` 来引用多态类型的对象；§13.2.1; [CG:\
  \ R.20]。\n5. 使用 `shared_ptr` 来引用共享对象（仅限）；§13.2.1; [CG: R.20]。\n6. 优先使用具有特定语义的资源句柄而非智能指针；§13.2.1。\n\
  7. 优先使用 `unique_ptr` 而不是 `shared_ptr`；§5.3, §13.2.1。\n8. 使用 `make_unique()` 来构造\
  \ `unique_ptr`；§13.2.1; [CG: R.22]。\n9. 使用 `make_shared()` 来构造 `shared_ptr`；§13.2.1;\
  \ [CG: R.23]。\n10. 优先使用智能指针而非垃圾回收；§5.3, §13.2.1。\n11. 不要使用 `::value;` §13.2; [CG:\
  \ ES.56]。\n12. 专门使用 `std::forward()` 进行转发；§13.2。\n13. 在 `move()` 或 `forward()` 对象后永远从其读取；§13.2。\n\
  14. 优先使用 `span` 而非指针加计数接口；§13.3; [CG: F.24]。\n15. 在需要 `constexpr` 大小的序列时使用 `array`;§13.4.1。\n\
  16. 优先使用 `array` 而非内置数组；§13.4.1; [CG: SL.2]。\n17. 当需要 `N` 位且 `N` 不等于内置整数位数时使用 `bitset`;§13.4.2。\n\
  18. 不要过度使用 `pair` 和 `tuple`；命名的 `struct` 通常更可读性；§13.4.3。\n19. 使用 `pair` 时，使用类型推导或\
  \ `make_pair()` 来避免冗余的类型指定；§13.4.3。\n20. 使用 `tuple` 时，使用类型推导和 `make_tuple()` 来避免冗余的类型指定；§13.4.3;\
  \ [CG: T.44]。\n21. 优先使用 `variant` 而非显式使用 `union`；§13.5.1; [CG: C.181]。\n22. 使用分配器来防止内存碎片；§13.6。\n\
  23. 在对效率做出主张之前先对程序进行计时；§13.7。\n24. 使用 `duration_cast` 以正确的单位报告时间测量；§13.7。\n\n\n\n\
  \n\n[27] 当你需要存储一个可以被调用的内容时，使用 `function`；§13.8.3。\n\n[28] 你可以编写代码来显式地依赖类型的属性；§13.9。\n\
  \n[29] 尽可能尽可能优先使用概念（concepts）而不是特质（traits）和 `enable_if`；§13.9。\n\n[30] 使用别名和类型谓词来简化符号表示；§13.9.1,\
  \ §13.9.2。\n\n# 14 数值\n\n*计算的目的是洞察，而不是数字。*\n*– R. W. Hamming (哈明)*\n\n*……但对于学生来说，数字往往是通往洞察的最佳道路。*\n\
  *– A. Ralston (拉尔斯顿)*\n\n* 介绍\n* 数学函数\n* 数值算法\n    * 并行数值算法\n* 复数\n* 随机数\n* 向量算术\n\
  * 数值极限\n* 建议\n\n## 14.1 介绍\n\nC++ 的设计初衷并不是主要为了数值计算。然而，数值计算通常发生在其他工作的背景下——例如数据库访问、网络、仪器控制、图形、模拟和财务分析——因此\
  \ C++ 成为大型系统中部分计算的一种非常有吸引力的工具。此外，数值方法已经从简单的对浮点数向量进行循环发展了许久。当计算过程中需要更复杂的数据结构时，C++\
  \ 的优势就体现出来了。其结果是，C++ 被广泛应用于涉及复杂数值的科学、工程、财务和其他计算。因此，支持此类计算的设施和技术也出现了。本章介绍了标准库中支持数值的部分。\n\
  \n## 14.2 数学函数\n\n在 `<cmath>` 中，我们找到了标准的数学函数，例如针对 `float`、`double` 和 `long double`\
  \ 类型参数的 `sqrt()`、`log()` 和 `sin()`：\n\n| 标准数学函数 | |\n| --- | --- |\n| `abs(x)` |\
  \ 绝对值 |\n| `ceil(x)` | 大于等于 `x` 的最小整数 |\n| `floor(x)` | 小于 `x` 的最大整数 |\n| `sqrt(x)`\
  \ | 平方；`x` 必须非负 |\n| `cos(x)` | 余弦 |\n| `sin(x)` | 正弦 |\n| `tan(x)` | 正切 |\n| `acos(x)`\
  \ | 反余弦；结果是非负 |\n| `asin(x)` | 反正弦；返回最接近 0 的结果 |\n| `atan(x)` | 反正切 |\n| `sinh(x)`\
  \ | 双曲正弦 |\n| `cosh(x)` | 双曲余弦 |\n| `tanh(x)` | 双曲正切 |\n| `exp(x)` | 以 e 为底的指数\n\
  | `log(x)` | 自然对数，底为 e；`x` 必须为正 |\n| `log10(x)` | 以 10 为底的对数 |\n\n`complex` 的版本\
  \ (§14.4) 位于 `<complex>`。每个函数的返回值与参数类型相同。\n\n错误通过将 `<cerrno>` 中的 `errno` 设置为 `EDOM`（域错误）或\
  \ `ERANGE`（范围错误）来报告。例如：\n\n点击此处查看代码图像\n\n```\nvoid f()\n{\n     errno = 0; // 清除旧错误状态\n\
  \     sqrt(−1);\n     if (errno==EDOM)\n           cerr << \"sqrt() not defined\
  \ for negative argument\";\n\n     errno = 0; // 清除旧错误状态\n     pow(numeric_limits<double>::max(),2);\n\
  \     if (errno == ERANGE)\n           cerr << \"result of pow() too large to represent\
  \ as a double\";\n}\n```\n\n在 `<cstdlib>` 中还有一些数学函数，而所谓的特殊数学函数，如 `beta()`、`rieman_zeta()`\
  \ 和 `sph_bessel()` 也在 `<cmath>` 中。\n\n## 14.3 数值算法\n\n在 `<numeric>` 中，我们找到了一组通用的数值算法，例如\
  \ `accumulate()`。\n\n| 数值算法 | |\n| --- | --- |\n| `x=accumulate(b,e,i)` | `x` 是\
  \ `i` 与 `b` 中元素的和 |\n| `x=accumulate(b,e,i,f)` | `x` 是 `i` 与 `b` 中元素通过 `f` 运算的和\
  \ |\n| `x=inner_product(b,e,i,f)` | `x` 是 `b` 到 `e` 元素通过 `f` 运算的乘积和，初始值为 `i` |\n\
  | `x=partial_sum(b,e,init,f)` | `x` 是 `b` 到 `e` 元素通过 `f` 运算的累加和，初始值为 `init` |\n\
  | `x=inclusive_product(b,e,init,f)` | `x` 是 `b` 到 `e` 元素通过 `f` 运算的乘积，初始值为 `init`\
  \ |\n| `x=gcd(a,b)` | `x` 是 `a` 和 `b` 之间的最大公约数 |\n| `x=lcm(a,b)` | `x` 是 `a` 和 `b`\
  \ 之间的最小公倍数 |\n| `iota(b,e,v)` | 在 `b` 到 `e` 填充从 `v` 开始的递增序列 |\n\n| `x=accumulate(b,e,i)`\
  \ | `x` 是 `i` 与 `b` 中元素的和 |\n| `x=accumulate(b,e,i,f)` | `x` 是 `i` 与 `b` 中元素通过 `f`\
  \ 运算的和 |\n| `x=inner_product(b,e,i,f)` | `x` 是 `b` 到 `e` 元素通过 `f` 运算的乘积和，初始值为 `i`\
  \ |\n| `x=partial_sum(b,e,init,f)` | `x` 是 `b` 到 `e` 元素通过 `f` 运算的累加和，初始值为 `init`\
  \ |\n| `x=inclusive_product(b,e,init,f)` | `x` 是 `b` 到 `e` 元素通过 `f` 运算的乘积，初始值为 `init`\
  \ |\n| `x=gcd(a,b)` | `x` 是 `a` 和 `b` 之间的最大公约数 |\n| `x=lcm(a,b)` | `x` 是 `a` 和 `b`\
  \ 之间的最小公倍数 |\n| `iota(b,e,v)` | 在 `b` 到 `e` 填充从 `v` 开始的递增序列 |\n\n*(注：此处根据原文逻辑对齐表格内容，原文中表格部分存在格式错乱。)*\n\
  \n### 14.3.1 并行算法\n\n在 `<numeric>` 中，数值算法有并行版本 (§part0019.html_sec3)，它们略有不同：\n\n\
  | 并行数值算法 | |\n| --- | --- |\n| `x=accumulate(b,e,i)` | `x` 是 `i` 与 `b` 中元素的和 |\n\
  | `x=accumulate(b,e,i,f)` | `x` 是 `i` 与 `b` 中元素通过 `f` 运算的和 |\n| `x=inner_product(b,e,i,f)`\
  \ | `x` 是 `b` 到 `e` 元素通过 `f` 运算的乘积和，初始值为 `i` |\n| `x=partial_sum(b,e,init,f)` |\
  \ `x` 是 `b` 到 `e` 元素通过 `f` 运算的累加和，初始值为 `init` |\n| `x=inclusive_product(b,e,init,f)`\
  \ | `x` 是 `b` 到 `e` 元素通过 `f` 运算的乘积，初始值为 `init` |\n| `x=gcd(a,b)` | `x` 是 `a` 和 `b`\
  \ 之间的最大公约数 |\n| `x=lcm(a,b)` | `x` 是 `a` 和 `b` 之间的最小公倍数 |\n| `iota(b,e,v)` | 在 `b`\
  \ 到 `e` 填充从 `v` 开始的递增序列 |\n\n*(注：由于原文提供的表格内容存在严重混乱，翻译时根据标准 C++ 库功能进行了逻辑对齐和修正。)*\n\
  \n这些算法适用于所有序列，并可以通过提供操作符来扩展。例如：点击此处查看代码图像\n\n```\nlist<double> lst {1, 2, 3, 4,\
  \ 5, 9999.9999};\nauto s = accumulate(lst.begin(),lst.end(),0.0); // 计算和\n```\n\n\
  除了 `reduce()` 之外，我没有去掉了带有默认策略（顺序执行）和默认值的版本。\n\n并行算法（例如 `reduce()`）与顺序算法（例如 `accumulate()`）的区别在于允许以不定的顺序对元素进行操作。\n\
  \n\n\n\n\n## 14.4 复数\n\n标准库支持了一系列复数类型，其类似于 §4.2.1 中描述的 `complex` 类。为了支持标量为单精度浮点数（`float`）、双精度浮点数（`double`）等情况的复数，标准库中的\
  \ `complex` 是一个模板：\n\n点击此处查看代码图像\n\n```\n[](#cb433-1)template<typename Scalar>\n\
  [](#cb433-2)class complex {\n[](#cb433-3)public:\n[](#cb433-4)     complex(const\
  \ Scalar& re ={}, const Scalar& im ={});   // 默认函数参数；见§3.6.1\n[](#cb433-5)     //\
  \ ...\n[](#cb433-6)};\n```\n\n复数支持常用的算术运算和最常见的数学函数。例如：\n\n点击此处查看代码图像\n\n```\n[](#cb434-1)void\
  \ f(complex<float> fl, complex<double> db)\n[](#cb434-2){\n[](#cb434-3)     complex<long\
  \ double> ld {fl+sqrt(db)};\n[](#cb434-4)     db += fl*3;\n[](#cb434-5)     fl =\
  \ pow(1/fl,2);\n[](#cb434-6)     // ...\n[](#cb434-7)}\n```\n\n`sqrt()` 和 `pow()`（幂）函数是\
  \ `<complex>` (§14.2) 中定义的常用数学函数之一。\n\n## 14.5 随机数\n\n随机数在许多领域都非常有用，例如测试、游戏、模拟和安全。应用领域的多样性体现在标准库\
  \ `<random>` 提供的丰富的随机数生成器中。一个随机数生成器由两个部分组成：\n\n1. 一个产生随机或伪随机值序列的 `engine`（引擎）\n\n\
  2. 一个将这些值映射到某个范围内的数学分布的 `distribution`（分布）\n\n分布的示例包括 `uniform_int_distribution`（生成的整数概率相等）、`normal_distribution`（“正态分布”）和\
  \ `exponential_distribution`（指数增长）；每个分布适用于某个指定的范围。例如：\n\n点击此处查看代码图像\n\n```\n[](#cb435-1)using\
  \ my_engine = default_random_engine;              // 引擎类型\n[](#cb435-2)using my_distribution\
  \ = uniform_int_distribution<>;   // 分布类型\n[](#cb435-3)\n[](#cb435-4)my_engine re\
  \ {};                                      // 默认引擎\n[](#cb435-5)my_distribution\
  \ one_to_six {1,6};                     // 映射到整数 1..6 的分布\n[](#cb435-6)auto die\
  \ = [](){ return one_to_six(re); }             // 创建一个生成器\n[](#cb435-7)\n[](#cb435-8)int\
  \ x = die();                                        // 掷骰子：x 变为 [1:6] 之间的值\n```\n\
  \n由于于对通用性和性能的不妥协追求，一位专家认为标准库的随机数组件是“每个随机数库长大后想成为的样子”。然而，它很难被认为“初学者友好”。`using` 语句和\
  \ lambda 表达式让操作变得稍微直观了一些。\n\n对于初学者（无论什么背景）来说，随机数库完全通用的接口可能是巨大的障碍。一个简单的均匀随机数生成器通常足够入门了。例如：\n\
  \n点击此处查看代码图像\n\n```\n[](#cb436-1)Rand_int rnd {1,10};    //为 [1:10] 创建一个随机数生成器\n\
  [](#cb436-2)int x = rnd();          // x 是 [1:10] 之间的一个数\n```\n\n那么，我们如何得到它呢？我们必须得到像\
  \ `die()` 一样，在 `Rand_int` 类内部将引擎和分布结合起来的东西：\n\n点击此处查看代码图像\n\n```\n[](#cb437-1)class\
  \ Rand_int {\n[](#cb437-2)public:\n[](#cb437-3)     Rand_int(int low, int high)\
  \ :dist{low,high} { }\n[](#cb437-4)     int operator()() { return dist(re); }  \
  \   // 抽取一个整数\n[](#cb437-5)     void seed(int s) { re.seed(s); }          // 选择新的随机引擎种子\n\
  [](#cb437-6)private:\n[](#cb437-7)     default_random_engine re;\n[](#cb437-8) \
  \    uniform_int_distribution<> dist;\n};\n```\n\n那个定义仍然是“专家级”，但 `Rand_int()` 的**使用**在初学者的\
  \ C++ 课程第一周是可以接受的。例如：\n\n点击此处查看代码图像\n\n```\n[](#cb438-1)int main()\n[](#cb438-2){\n\
  [](#cb438-3)     const int max = 9;\n[](#cb438-4)     Rand_int rnd {0,max};    \
  \                     // 创建一个均匀随机数生成器\n[](#cb438-5)\n[](#cb438-6)     vector<int>\
  \ histogram(max+1);                 // 创建一个大小合适的 vector\n[](#cb438-7)     for (int\
  \ i=0; i<max; ++i)\n```\n\n\n\n\n## 14.8 建议\n\n[1] 数值问题往往是微妙的。如果你对某个数值问题的数学方面不是\
  \ 100% 确定，请听取专家建议、进行实验，或者两者兼之；§14.1。\n\n[2] 不要尝试仅用基础语言进行严肃的数值计算；请使用库；§14.1。\n\n\
  [3] 在编写循环从序列中计算一个值之前，考虑使用 `accumulate()`、`inner_product()`、`partial_sum()` 和 `adjacent_difference()`；§14.3。\n\
  \n[4] 使用 `std::complex` 进行复数算术；§14.4。\n\n[5] 将引擎绑定到分布上以获取随机数生成器；§14.5。\n\n[6] 注意确保你的随机数具有足够的性；§14.5。\n\
  \n[7] 不要使用 C 标准库的 `rand()`；它对于实际用途来说随机性不足；§14.5。\n\n[8] 当运行时效率比相对于操作和元素类型的灵活性更重要时，使用\
  \ `valarray` 进行数值计算；§14.6。\n\n[9] 数值类型的属性可以通过 `numeric_limits` 访问；§14.7。\n\n[10]\
  \ 使用 `numeric_limits` 检查数值类型是否能够满足其需求；§14.7。\n\n# 15 并发\n\n*保持简单：尽可能简单，但不要比这更简单了。*\n\
  \n*– 阿伯特·爱因斯坦*\n\n* 介绍\n* 任务与 `thread`s\n* 传递参数\n* 返回结果\n* 共享数据\n* 等待事件\n* 任务通信\n\
  \    * `future` 与 `promise`; `packaged_task`; `async()`\n* 建议\n\n## 15.1 介绍\n\n\
  并发——多个任务的并行执行——广泛用于提高吞吐量（通过使用多个处理器处理单个计算）或提高响应能力（通过允许程序的一个部分在另一部分等待响应时继续运行）。所有现代编程语言都提供了这种支持。C++\
  \ 标准库提供的支持是 C++ 中使用了 20 多年的用例的可移植且类型安全的变体，并且几乎被现代硬件通用支持。标准库的支持主要针对系统级并发的支持，而不是直接提供复杂的上层并发模型；那些可以使用使用标准库设施构建的库来提供。\n\
  \n标准库直接支持单个地址空间内多个线程的并发执行。为了实现这一点，C++ 句了一个合适的内存模型和一组原子操作。原子操作允许无锁编程。内存模型确保只要程序员避免了数据竞争（对可变数据的无控制并发访问），一切都会像人们直观预期的那样正常工作。然而，大多数用户只会从标准库以及在此之上构建的库来看并发。本节简要介绍了标准库并发支持设施的主要示例：`thread`s、`mutex`es、`lock()`\
  \ 操作、`packaged_task`s 和 `future`s。这些特性直接构建在操作系统提供的基础上，与它们相比不会产生性能开销。它们也没有保证与操作系统提供的相比有显著的性能提升。\n\
  \n不要将并发视为万灵药。如果一个任务可以顺序执行，那么顺序执行它通常更简单、更快。\n\n作为使用显式并发特性的替代，我们通常可以使用并行算法来利用多个执行引擎以获得更好的性能\
  \ (§12.9, §14.3.1)\n\n## 15.2 任务与 `thread`s\n\n我们将一个可能与其他计算并发执行的计算称为*任务*（task）。*线程*是任务在程序中的系统级表示。要与其他任务并发执行的任务通过构造一个\
  \ `thread` 来启动。任务可以是函数或函数对象：\n\n点击此处查看图像\n\n```cpp\nvoid f() // 函数\n{\n    cout\
  \ << \"Hello \";\n}\n\nstruct F { // 函数对象\n    void operator()() { cout << \"Parallel\
  \ World!\\n\"; }\n};\n```\n\n这是一个错误的示例：这里 `f` 和 `F()` 分别使用 `cout` 对象而没有任何任何形式的同步。结果输出是不可预测的，并在程序的不同执行之间之间变化，因为两个任务中单独操作的顺序是没有定义的。程序可能会产生“奇怪”的输出，例如\n\
  \n```text\nPaeralalle o World!\n```\n\n只有标准中的特定保证保护我们免受 `ostream` 定义内部可能导致崩溃的数据竞争。\n\
  \n程序的线程共享地址空间。这一点线程与进程不同，进程通常不共享数据。由于线程共享地址空间，它们可以通过共享对象进行通信 (§15.5](#part0020.html_ch15lev1sec5))。这种通信通常由锁或其他机制控制以防止数据竞争（对变量的无控制并发访问）。\n\
  \n“join”线程意味着“等待线程终止”。`join()` 确保我们在线程完成之前退出 `user()`。\n\n```cpp\nvoid user()\n\
  {\n    thread t1{f}; // f 在单独线程中执行\n    thread t2{F}; // F() 在单独线程中执行\n    t1.join();\
  \ // 等待 t1\n    t2.join(); // 等待 t2\n}\n```\n\n 15.3 传递参数\n\n通常，任务需要数据来处理。我们可以很容易地将数据（或数据的指针或引用）作为参数传递。考虑：\n\
  \n点击此处查看图像\n\n\n\n\n\n```\nvoid f(vector<double>& v);    // 函数对 v 进行操作\nstruct F\
  \ {                    // 函数对象：对 v 进行操作\n     vector<double>& v;\n     F(vector<double>&\
  \ vv) :v{vv} { }\n     void operator()();       // 运算符运算符；§6.3.2\n};\n\nint main()\n\
  {\n     vector<double> some_vec {1,2,3,4,5,6,7,8,9};\n     vector<double> vec2 {10,11,12,13,14};\n\
  \n     thread t1 {f,ref(some_vec)};   // f(some_vec) 在另一个线程中执行\n     thread t2 {F{vec2}};\
  \           // F(vec2)() 在另一个线程中执行\n\n     t1.join();\n     t2.join();\n}\n```\n\
  \n显然，`F{vec2}` 在 `F` 中保存了参数向量的引用。`F` 现在可以使用该向量，并且希望在 `F` 执行期间没有其他任务访问 `vec2`。通过值传递\
  \ `vec2` 将消除这种风险。\n\n使用 `{f,ref(some_vec)}` 初始化使用了一个 `thread` 变长模板构造函数，它可以接受任意序列的参数（§7.4）。`ref()`\
  \ 是来自 `<functional>` 的类型函数，不幸的是，它用于告诉变长模板将 `some_vec` 视为引用而不是对象。如果没有 `ref()`，`some_vec`\
  \ 将通过值传递。编译器检查在给定后续参数的情况下可以调用第一个参数，并构建必要的函数对象以传递给 `thread`。因此，如果 `F::operator()()`\
  \ 和 `f()` 执行相同的算法，那么这两个任务的处理就是大致等同的：在两种情况下，都为 `thread` 构造了一个函数对象。\n\n## 15.4 返回结果\n\
  \n在 §15.3 的示例中，我通过非 `const` 引用传递参数。只有当我预计任务会修改所引用数据的值时，我才会这样做（§1.7）。这是一种有点狡猾但并不常见的返回结果的方法。一种不那么晦涩的技术是通过\
  \ `const` 引用传递输入数据，并将存放结果的位置作为单独参数传递：\n\n点击此处查看代码图像\n\n```\nvoid f(const vector<double>&\
  \ v, double* res);    // 从 v 获取输入；将结果存放在 *res\nclass F {\npublic:\n     F(const\
  \ vector<double>& vv, double* p) :v{vv}, res{p} { }\n     void operator()();   \
  \       // 将结果存于 *res\nprivate:\n     const vector<double>& v;    // 输入源\n     double*\
  \ res;                // 输出目标\n};\n\ndouble g(const vector<double>&); // 使用返回值\n\
  \nvoid user(vector<double>& vec1, vector<double> vec2, vector<double> vec3)\n{\n\
  \     double res1;\n     double res2;\n     double res3;\n\n     thread t1 {f,cref(vec1),&res1};\
  \        // f(vec1,&res1) 在另一个线程中执行\n     thread t2 {F{vec2,&res2}};           \
  \  // F{vec2,&res2}() 在另一个线程中执行\n     thread t3 {[&](){res3 = g(vec3);}};    //\
  \ 通过引用捕捉局部变量\n     t1.join();\n     t2.join();\n     t3.join();\n     cout << res1\
  \ << '  ' << res2 << '  ' << res3 << '\\n';\n}\n```\n\n这种方法行得通，而且这种技术非常常见，但我认为通过引用返回结果并不优雅，因此我在\
  \ §15.7.1 中回到这个话题。\n\n## 15.5 共享数据\n\n有时任务需要共享数据。在这种情况下，访问必须同步，以确保最多只有一个任务访问。经验丰富的程序员会识别出这是一个简化（例如，许多任务同时读取数据没有问题），但请考虑如何确保最多只有一个任务访问一组对象。解决方案的根本元素是\
  \ `mutex`，一个“互斥对象”。`thread` 使用 `lock()` 操作获取 `mutex`：\n\n点击此处查看代码图像\n\n```\nmutex\
  \ m; // 控制互斥锁\nint sh;  // 共享数据\nvoid f()\n{\n     scoped_lock lck {m};        //\
  \ 获取互斥锁\n     sh += 7;                    // 操作共享数据\n}// 隐式释放互斥锁\n```\n\n`lck` 的类型被推断为\
  \ `scoped_lock<mutex>`（§6.2.3](#part0011.html_ch06levsec3)）。`scoped_lock` 的构造函数获取\
  \ `mutex`（通过调用 `m.lock()`）。如果另一个线程已经获取了 `mutex`，该线程将等待（“阻塞”），直到另一个线程完成其访问。一旦线程完成了对共享数据的访问，等待的\
  \ `thread` 就会恢复（“被唤醒”）。互斥锁设施位于 `<mutex>` 中。\n\n注意 RAII（§5.3](#part0010.html_ch05sec3)）的使用，`scoped_lock`\
  \ 和 `unique_lock`（§15.6](#part0020.html_ch15lev6)）等资源句比显式锁定和解锁更简单且更安全。\n\n共享数据与\
  \ `mutex` 之间的对应关系是传统的：程序员必须知道哪个 `mutex` 对应哪个数据。显然，这很容易出错，同样，我们也试图通过各种语言手段使这种对应变得清晰。例如：\n\
  \n点击此处查看代码图像\n\n```\nclass Record {\npublic:\n     mutex rm;\n     // ...\n};\n\
  ```\n\n不需要天才也能猜到，对于名为 `rec` 的 `Record`，你应该获取 `rec.rm`，尽管更好的命名可能会帮助读者。\n\n经常需要同时访问多个资源以执行某些操作。这会导致死锁。例如，如果\
  \ `thread1` 获取了 `mutex1` 然后尝试获取 `mutex2`，而 `thread2` 获取了 `mutex2` 然后尝试获取 `mutex1`，那么这两个任务都永远无法继续执行。`scoped_lock`\
  \ 通过允许我们同时获取多个锁来帮助解决这个问题：\n\n点击此处查看代码图像\n\n```\nvoid f()\n{\n     scoped_lock lck\
  \ {mutex1,mutex2,mutex3};   // 获取三个锁\n     // ... 操作共享数据 ...\n}// 隐式释放所有互斥锁\n```\n\
  \n该 `scoped_lock` 只有在获取了所有 `mutex` 参数后才会继续，并且在持有 `mutex` 时永远阻塞（“进入睡眠”）。`scoped_lock`\
  \ 的析构函数确保在 `thread` 离开作用域时释放 `mutex`。\n\n通过共享数据通信是非常低级的。特别是，程序员必须设计方法来了解哪些任务完成了哪些工作。在这一点上，共享数据的使用优于调用和返回的概念。另一方面，有些人人坚信共享比拷贝参数和返回值更高效。在涉及大量数据时情况确实如此，但锁定和解锁是相对昂贵的操作。另一方面，现代机器非常擅长复制数据，特别是紧凑数据，例如\
  \ `vector` 元素。因此，不要在没有思考（最好没有经过测量）的情况下为了“效率”而选择共享数据进行通信。\n\n\n\n\n基础的 `mutex` 允许一次只有一个线程访问数据。共享数据最常见的方法之一是在多个读取者和一个写入者之间进行。这种“读-写锁”惯用法被\
  \ `share_mutex` 支持。读取者会获取“共享（shared）”互斥锁，以便其他读取者仍然获得访问权限，而写入者将要求排他性访问。例如：\n\n点击此处查看代码图片\n\
  \n```\n[](#cb451-1)shared_mutex mx;          // 一个可以共享的互斥锁\n[](#cb451-2)\n[](#cb451-3)void\
  \ reader()\n[](#cb451-4){\n[](#cb451-5)     shared_lock lck {mx};       // 愿意与其他读取者共享访问\n\
  [](#cb451-6)     // ... 读取 ...\n[](#cb451-7)}\n[](#cb451-8)\n[](#cb451-9)void writer()\n\
  [](#cb451-10){\n[](#cb451-11)     unique_lock lck {mx};       // 需要排他（独占）访问\n[](#cb451-12)\
  \     // ... 写入 ...\n[](#cb451-13)}\n```\n\n## 15.6 等待事件\n\n有时，`thread` 需要等待某些外部事件，例如另一个\
  \ `thread` 完成任务或经过了某段时间时间。最简单的“事件”仅仅是时间的流逝。使用在 `<chrono>` 中找到的时间工具，我可以写道：\n\n点击此处查看代码图片\n\
