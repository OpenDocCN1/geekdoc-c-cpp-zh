  \ `<stdlib.h>`。对于此类头文件，还有一个以 `c` 为缀并删除 `.h` 的版本。该版本（例如 `<cstdlib>`）将其声明放在 `std`\
  \ 命名空间中。\n\n### 8.4 建议\n\n1. 不要造轮子；使用库；§8.1 节。\n2. 当你有选择时，优先考虑标准库而不是其他库；§8.1 节。\n\
  3. 不要认为标准库适用于所有情况；§8.1 节。\n4. 记得包含你所使用的设施的头文件；§8.3 节。\n5. 记得标准库设施定义在命名空间 `std` 中；§8.3\
  \ 节。\n\n\n\n\n\n文本操作是大多数程序的重要组成部分。C++ 标准库提供了一种 `string` 类型，以让大多数用户无需通过指针进行 C 风格的字符数组操作。`string_view`\
  \ 类型允许我们对字符序列进行操作，无论它们是如何被存储的（例如，在 `std::string` 或 `char[]` 中）。此外，还提供了正则表达式匹配，以帮助在文本中查找模式。正则表达式提供的形式与大多数现代语言中的常用形式相似。`string`\
  \ 和 `regex` 对象都可以使用多种字符类型（例如 Unicode）。\n\n## 9.2 字符串\n\n标准库提供了一个 `string` 类型来补充字符串字面量（§1.2.1）。它提供了一个\
  \ `Regular` 类型（§7.2, §12.7），用于拥有和操作具有各种字符类型的字符序列。`string` 类型提供了许多实用的字符串操作，如拼接。例如：\n\
  \n点击此处查看代码图像\n\n```\n[](#cb237-1)string compose(const string& name, const string&\
  \ domain)\n[](#cb237-2){\n[](#cb237-3)     return name + '@' + domain;\n[](#cb237-4)}\n\
  [](#cb237-5)\n[](#cb237-6)auto addr = compose(\"dmr\",\"bell−labs.com\");\n```\n\
  \n在这里，`addr` 被初始化为字符序列 `dmr@bell−labs.com`。字符串的“相”意味着拼接。你可以将一个 `string`、字符串字面量、C\
  \ 风格字符串或字符拼接到 `string` 中。标准的 `string` 具有移动构造函数，因此即使通过值返回很长的 `string` 也是高效的（§5.2.2）。\n\
  \n在许多应用程序，最常见的拼接形式是向 `string` 的末尾添加内容。这通过 `+=` 操作直接支持。例如：\n\n点击此处查看代码图像\n\n```\n\
  [](#cb238-1)void m2(string& s1, string& s2)\n[](#cb238-2){\n[](#cb238-3)     s1\
  \ = s1 + '\\n';  // 添加换行符\n[](#cb238-4)     s2 += '\\n';      // 添加换行符\n[](#cb238-5)}\n\
  ```\n\n向 `string` 末尾添加内容的方式在语义上是等价的，但我更倾向于后者，因为它功能更明确、更简洁，并且可能更高效。\n\n`string` 是可变的。除了\
  \ `=` 和 `+=` 之外，还支持下标操作（使用 `[ ]`）和子串操作。例如：\n\n点击此处查看代码图像\n\n```\n[](#cb239-1)string\
  \ name = \"Niels Stroustrup\";\n[](#cb239-2)\n[](#cb239-3)void m3()\n[](#cb239-4){\n\
  [](#cb239-5)     string s = name.substr(6,10);      // s = \"Stroustrup\"\n[](#cb239-6)\
  \     name.replace(0,5,\"nicholas\");      // name 变为 \"nicholas Stroustrup\"\n\
  [](#cb239-7)     name[0] = toupper(name[0]);        // name 变为 \"Nicholas Stroustrup\"\
  \n[](#cb239-8)}\n```\n\n`substr()` 操作返回一个 `string`，它是其参数指定的子串的拷贝。第一个参数是指向 `string`\
  \ 的索引（位置），第二个参数是所需子串的长度。由于索引从 0 开始，`s` 获得了值 `Stroustrup`。\n\n`replace()` 操作用一个值替换子串。在这种情况下，从\
  \ 0 开始长度为 5 的子串是 `Niels`；它被替换为 `nicholas`。最后，我用其大写形式替换初始字符。因此，`name` 的最终值是 `Nicholas\
  \ Stroustrup`。注意，替换字符串不需要与其正在替换的子串大小相同。\n\n许多实用的 `string` 操作包括赋值（使用 `=`）、下标操作（使用\
  \ `[ ]` 或类似于 `vector` 的 `at()` ；§11.2.2）、比较（使用 `==` 和 `!=`）以及字典序排序（使用 `<`, `<=`,\
  \ `>`, `>=`）、迭代（使用迭代器，类似于 `vector`；§12.2）、输入（§10.3）和流式处理（§10.8）。\n\n自然，`string`\
  \ 可以相互之间、与 C 风格字符串 §1.2.1 以及字符串字面量进行比较。例如：\n\n```\n[](#cb237-1)string compose(const\
  \ string& name, const string& domain)\n[](#cb237-2){\n[](#cb237-3)     return name\
  \ + '@' + domain;\n[](#cb237-4)}\n[](#cb237-5)\n[](#cb237-6)auto addr = compose(\"\
  dmr\",\"bell−labs.com\");\n```\n\n在这里，`addr` 被初始化为字符序列 `dmr@bell−labs.com`。字符串的“相”意味着拼接。你可以将一个\
  \ `string`、字符串字面量、C 风格字符串或字符拼接到 `string` 中。标准的 `string` 具有移动构造函数，因此即使通过值返回很长的 `string`\
