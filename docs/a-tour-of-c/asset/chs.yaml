  \ §14.5 节 |\n| `<regex>` | `regex`, `smatch` | §9.4 节 |\n| `<string>` | `string`,\
  \ `basic_string` | §9.2 节 |\n| `<set>` | `set`, `multiset` | §11.6 节 |\n| `<sstream>`\
  \ | `istringstream`, `ostringstream` | §10.8 节 |\n| `<stdexcept>` | `length_error`,\
  \ `out_of_range`, `runtime_error` | §3.5.1 节 |\n| `<thread>` | `thread` | §15.2\
