  ```\n[](#cb238-1)void m2(string& s1, string& s2)\n[](#cb238-2){\n[](#cb238-3)  \
  \   s1 = s1 + '\\n';  // 添加换行符\n[](#cb238-4)     s2 += '\\n';      // 添加换行符\n[](#cb238-5)}\n\
