  \ ...\n     X v = fx.get();  // 如果必要，等待值完成计算\n     // ... 使用 v ...\n}\n```\n\n###\
  \ 15.7.2 `packaged_task`\n\n我们如何将一个 `future` 放入需要结果的任务中，并将相应的 `promise` 放入应该产生该结果的线程中呢？提供\
  \ `packaged_task` 类型是为了简化与 `future` 和 `promise` 关联的且在 `thread` 上运行的任务的设置工作。`packaged_task`\
  \ 提供了封装代码，将任务的返回值或异常放入 `promise` 中（如 §15.7.1 节中代码所示）。如果你通过调用 `get_future` 来请求它，`packaged_task`\
  \ 将为你提供一个与其 `promise` 对应的 `future`。例如，我们可以设置两个任务，每个任务添加 `vector<double>` 中一半的元素，使用标准库的\
  \ `accumulate()`（§14.3）：\n\n点击此处查看代码图片\n\n```\ndouble accum(double* beg, double*\
  \ end, double init)\n     // 计算从初始值 init 开始的 [beg:end) 的和\n{\n     return accumulate(beg,end,init);\n\
  }\n\ndouble comp2(vector<double>& v)\n{\n     using Task_type = double(double*,double*,double);\
  \            // 任务类型\n\n     packaged_task<Task_type> pt0 {accum};             \
  \           // 封装任务（即 accum）\n     packaged_task<Task_type> pt1 {accum};\n\n   \
  \  future<double> f0 {pt0.get_future()};                        // 获取 pt0 的 future\n\
  \     future<double> f1 {pt1.get_future()};  // 获取 pt1 的 future\n\n     double*\
  \ first = &v[0];\n     thread t1 {move(pt0),first,first+v.size()/2,0};         \
  \     // 为 pt0 启动线程\n     thread t2 {move(pt1),first+v.size()/2,first+v.size(),0};\
  \     // 为 pt1 启动线程\n\n     // ...\n\n     return f0.get()+f1.get();           \
  \                         // 获取结果\n}\n```\n\n`packaged_task` 模板接受任务类型作为其模板参数（这里是\
  \ `Task_type`，`double(double*,double*,double)` 的别名），并将任务作为其构造函数参数（这里是 `accum`）。需要\
  \ `move()` 操作是因为 `packaged_task` 不能被拷贝。`packaged_task` 不能拷贝的原因它是一个资源句柄：它拥有自己的 `promise`，并（间接地）负责其任务可能拥有的任何资源。\n\
  \n请注意这段代码中没有显式提到锁（locks）：我们能够集中在要执行的任务上，而不是关注用于管理它们之间通信的机制。这两个任务将在不同的线程上运行，因此可能以并行方式执行。\n\
  \n### 15.7.3 `async()`\n\n我在本章中遵循的思路是我认为最简单但仍属于最强大的模型之一：将任务视为一个可能与其他任务并发运行的函数。这远不是\
  \ C++ 标准库支持的唯一模型，但它很好地适用于广泛的需求。更微妙、更复杂的模型（例如依赖共享内存的编程风格）可以根据需要使用。\n\n为了启动可能异步运行的任务，我们可以使用\
  \ `async()`：\n\n点击此处查看代码图片\n\n```\ndouble comp4(vector<double>& v)        // 派生可能异步运行的任务\n\
  {\n     if (v.size()<10000)      // 值得吗？\n           return accumulate(v.begin(),v.end(),0);\n\
  \     auto v0 = &v[0];\n     auto sz = v.size();\n     auto f0 = async(accum,v0,v0+sz/2,0.0);\
  \      // 第一分之一\n     auto f1 = async(accum,v0+sz/2,v0+sz,0.0);    // 第二分之一\n  \
  \   auto f2 = async(accum,v0+sz/4,v0+sz*3/4,0.0); // 第三分之一\n     auto f3 = async(accum,v0+3*sz/4,v0+sz,0.0);\
  \ // 四分之一\n     return f0.get()+f1.get()+f2.get()+f3.get(); // 获取结果\n}\n```\n\n\
  基本上，`async()` 将函数的“调用部分”与“获取部分”分离，并将两者都与实际执行分离。使用 `async()` 你不需要考虑线程。相反，你只需按任务思考。请注意，`async()`\
  \ 不仅仅是为了增加性能的并行计算的特殊机制。例如，它也可以用于启动一个获取信息的任务，让“主程序”保持活跃处理其他事务（§15.7.3）。\n\n## 15.8\
  \ 建议\n\n1. 使用并发提高响应能力或提高吞吐量；§15.1。\n2. 在你负担得起的最高抽象级别上工作；§15.1。\n3. 考虑将进程作为线程的替代方案；§15.1。\n\
  4. 标准库的并发设施是类型安全的；§15.1。\n5. 内存模型的存在是为了让大多数程序员无需思考计算机的体系架构；§15.1。\n6. 内存模型让内存看起来大致符合天直预期；§15.1。\n\
  7. 原子操作允许无锁编程；§15.1。\n8. 将无锁编程留给专家处理；§15.1。\n9. 有时，顺序方案比并发方案更简单、更快；§15.1。\n\n\n\n\
