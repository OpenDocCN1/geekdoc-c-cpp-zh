  \ 1974.\n\n## 16.5 建议\n\n1. ISO C++ 标准 [C++,2017] 定义了 C++。\n2. 在为新项目选择风格或对代码库进行现代化时，请依靠\
  \ C++ Core Guidelines [16.1.4]。\n3. 学习 C++ 时，不要孤立地关注语言特性 [16.2.1]。\n4. 不要陷入几十年前的语言特性和设计技术中\
  \ [16.1.4]。\n5. 在生产代码中使用新特性之前，通过编写小型程序来测试你计划使用的实现的标准符合性和性能。\n6. 学习 C++ 时，使用你能获取的最新且完整的标准\
  \ C++ 实现。\n7. C 和 C++ 的共同子集不是学习 C++ 的最佳子集 [16.3.2.1]。\n8. 优先使用命名转换（如 `static_cast`）而非\
  \ C 风格转换 [16.2.7]。\n9. 将 C 程序转换为 C++ 时，确保一致使用函数声明（原型）和标准头文件 [16.3.2]。\n10. 将 C 程序转换为\
  \ C++ 时，重命名 C++ 关键字的变量 [16.3.2]。\n11. 为了可移植性和类型安全，如果你必须使用 C，请在 C++ 的共同子集中编写 [16.3.2.1]。\n\
  12. 将 C 程序转换为 C++ 时，将 `malloc()` 的结果转换为适当类型，或将所有的 `malloc()` 使用更改为 `new` [16.3.2]。\n\
  13. 从 `malloc()` 和 `free()` 转换为 `new` 和 `delete` 时，考虑使用 `vector`、`push_back()` 和\
  \ `reserve()` 代替 `realloc()` [16.3.2.1]。\n14. 在 C++ 中，没有从 `int` 到枚举的隐式转换。\n15. 对于每个将命名放在全局空间的\
  \ C 头文件 `<X.h>``<cX>` 将命名放在 `std` 命名空间。\n16. 声明 C 函数时使用 `extern \"C\"` [16.3.3]。\n\
  17. 优先使用 `string` 而非 C 风格字符串（对零终止`char`数组的直接操作）。\n18. 优先使用 `iostream` 而非 `stdio`。\n\
  19. 优先使用容器（例如 `vector`）而非内置数组。\n\n## I\n\n索引\n\n*知识分为两类：我们要么知道某个主题，要么知道可以去哪里找到关于它的信息。*\n\
