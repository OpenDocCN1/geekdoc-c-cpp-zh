  \n*它是单一的。*\n\n*它是简单的。*\n\n*它一定成功！*\n\n*– H. Nelson*\n\n* 介绍\n* `vector`\n    * 元素;\
  \ 范围检查\n* `list`\n* `map`\n* `unordered_map`\n* 容器概述\n* 建议\n\n## 11.1 介绍\n\n大多数计算涉及创建值的集合，然后操作这些集合。将字符读入\
  \ `string` 并打印出该 `string` 是一个简单的例子。主要用途是存储对象的类通常被称为容器。为特定任务提供合适的容器并用实用的基础操作支持它们，是构建任何程序的的重要步骤。\n\
  \n为了说明标准库中的容器，我们考虑一个用于存储姓名和电话号码的简单程序。对于不同背景的人来说，这种程序的不同实现方法似乎都是“简单而易见”。来自 §10.5\
  \ 的 `Entry` 类可以用于存储简单的电话簿条目。在这里，我们刻意忽略了许多现实世界的复杂性，例如许多电话号码并没有简单的 32 位 `int` 表示形式。\n\
  \n## 11.2 vector\n\n最有用的标准库容器是 `vector`。`vector` 是给定类型元素的序列。元素连续存储在内存中。`vector`\
