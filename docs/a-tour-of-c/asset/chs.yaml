  \n许多书籍包含编程代码或配置示例。为了优化这些元素的显示效果，请在单栏横屏模式下查看电子书，并将字体大小调整为最小设置。除了以流式文本格式呈现代码和配置外，我们还包含了代码的图像，模仿印刷书籍中的显示效果；因此，当流式格式可能会影响代码列表显示时，您将看到一个“点击此处查看代码图像”的链接。点击链接即可查看高保真的代码图像。要返回之前查看的页面，请点击设备或应用上的返回按钮。\n\
  \n![Image](img/00001.jpeg)\n\n\n\n\n![Image](img/00002.jpeg)\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n## 16.4 参考文献\n## 16.5 建议\n\n# 索引\n# 谢谢\n\n## 前言\n\n想要教学时，请保持简洁。C++ 感觉像是一门新语言。也就是说，今天我比在\
  \ C98 时能更清晰、更简单、直接地表达我的想法。此外，生成的程序经过编译器的检查效果更好，运行也更快。\n\n本书概述了由 C++17（当前的 ISO 标准）定义并由主要供应商实现的\
  \ C++。此外，它还提到了 ISO 技术规范中定义且当前使用的概念（concepts）和模块（modules），尽管它们尚未在 C++20 中包含。\n\n\
  与其他现代语言一样，C++ 是非常庞大的，为了有效使用它需要大量的库。这本薄书旨在为经验丰富的程序员提供一个关于什么是现代 C++ 的概念概念。它涵盖了大多数语言特性和主要的标准库组件。本书只需几个小时即可读完，但显然，编写\
  \ C++ 的学问比一天内可以学的得多。然而，这里的目标不是精通，而是提供一个概述，给出关键示例，并帮助程序员入门。\n\n假设你以前过编程经验。如果没有，请在继续阅读之前，考虑阅读一本教材，例如\
  \ Stroustrup (2014) 的 *Programming: Principles and Practice Using C++ (Second edition)*。即使你以前有过编程经验，你所使用的语言或编写的应用程序可能与这里介绍的\
  \ C++ 风格大相径庭。\n\n想象一次对城市的游览，例如哥本哈根或纽约。在短短几个小时内，你快速领略了主要景点，听了几个背景故事，并得到了关于下一步该做什么的建议。游览结束后，你并不了解这座城市。你并不理解所见和所听的一切。你不知道如何处理管理城市生活的正式和非正式规则。要真正了解一个城市，你必须住在那里，而且通常要住几年。然而，如果运气好，你将获得一个初步的概述，对这座城市的特殊之处有一个认识，并对可能感兴趣的内容产生想法。游览结束后，真正的探索才开始。\n\
  \n本导览介绍了主要的 C++ 语言特性，这些特性支持不同的编程风格，例如面向对象和泛型编程。它并不试图提供详尽的、逐项特性的语言参考手册。秉着教科书的最佳传统，我尝试在在使用某个特性之前先解释它，但这并不总是可能的，而且并不是所有人都会按顺序阅读文本。因此，鼓励读者使用交叉引用和索引。\n\
  \n同样，本导览通过示例而非穷尽的方式介绍了标准库。它没有描述 ISO 标准定义之外的库。读者可以根据需要寻找支持材料。Stroustrup (2013) 和\
  \ Stroustrup (2014) 是此类材料的示例，但网络上有大量的（质量参不齐）材料，例如 Cppreference。例如，当我提到一个标准库函数或类时，可以很容易查到它的定义，通过查看其文档，可以发现许多相关的设施。\n\
  \n本导览将 C++ 作为一个整体来呈现，而不是像层蛋糕一样。因此，它没有区分哪些语言特性是 C 特有的、属于 C++98 的，或在 C++11、C++14 或\
  \ C++17 中新增的。这类信息可以在第 16 章（历史与兼容性）中找到。我专注于基础知识并试图保持简洁，但我并没有完全抵制住过度介绍新特性的诱惑。这似乎也满足了许多已经了解旧版本\
  \ C++ 的读者的好奇心。\n\n编程语言参考手册或标准仅仅说明了可以做什么，但程序员通常更感兴趣如何良好地使用这种语言。这一方面部分体现在涵盖的主题中，部分体现在正文中，特别体现在“建议”部分。关于什么是良好的现代\
  \ C++ 的更多建议可以在 C++ Core Guidelines (Stroustrup, 2015) 中找到。核心指南可以是进一步探索书中介绍思想的良好来源。你可能会注意到核心指南与本书在建议的表述甚至编号上有惊人的相似之处。原因之一是\
  \ *A Tour of C++* 第一版是初始核心指南的主要来源。\n\n### 致谢\n\n此处介绍的一些材料借自 TC++PL4 Stroustrup,\
  \ 2013，因此感谢所有帮助完成该书的人。\n\n感谢所有帮助完成和修正《A Tour of C++》第一版的人。\n\n感谢摩根士丹给我时间编写第二版。感谢哥伦比亚大学\
  \ 2018 年春季的“使用 C++ 设计”课程在本书的初稿中发现了许多拼写错误和错误，并提出了许多建设性建议。\n\n\n\n\n\n感谢 Paul Anderson,\
  \ Chuck Allison, Peter Gottschling, William Mons, Charles Wilson 和 Sergey Zubkov\
  \ 对本书的审阅以及许多改进建议。\n\n`Bjarne Stroustrup`\n\n`纽约曼哈顿`\n\n# 1 基础知识\n\n*我们要做的第一件事，就是杀掉所有的语言法条律师。*\n\
  \n*– 亨利六世，第二部分*\n\n*   引言\n*   程序\n    *   Hello, World!\n*   函数\n*   类型、变量与算术运算\n\
  \    *   算术运算; 初始化\n*   作用域与生命周期\n*   常量\n*   指针、数组与引用\n    *   空指针\n*   测试\n* \
  \  映射到硬件\n    *   赋值; 初始化\n*   建议\n\n## 1.1 引言\n\n本章非正式地介绍了 C++ 的符号、C++ 的内存与计算模型，以及将代码组织成程序的各种机制。这些语言特性支持在\
  \ C 语言中常见的、有时被称为过程化编程的风格。\n\n## 1.2 程序\n\nC++ 是一种编译型语言。为了让程序运行，其源代码必须经过编译器的处理，生成目标文件，然后由链接器组合在一起生成一个可执行程序。一个\
  \ C++ 程序通常由多个源代码文件（通常简单称为源文件）。\n\n![Image](img/00003.jpeg)\n\n可执行程序是针对特定的硬件/系统组合创建的；它不是通用的，例如无法从\
  \ Mac 迁移到 Windows PC。当我们谈论 C++ 程序的移植性时，我们通常指的是源代码的移植性；即源代码可以在各种系统中被成功编译并运行。\n\n\
  ISO C++ 标准定义了两类实体：\n\n*   核心语言特性，例如内置类型（如 `char` 和 `int`）和循环（例如 `for`-语句和 `while`-语句）\n\
  *   标准库组件，例如容器（如 `vector` 和 `map`）和 I/O 操作（例如 `<<` 和 `getline()`）\n\n标准库组件是每个 C++\
  \ 实现所提供的、完全普通的 C++ 代码。也就是说，C++ 标准库可以用 C++ 自身来实现（尽管在线程上下文切换等任务中会极少量地使用机器代码）。这意味着\
  \ C++ 具有足够的表达力和效率来处理最严苛的系统编程任务。\n\nC++ 是一种静态类型语言。这意味着，每个实体（例如对象、值、名称和表达式）的类型在在使用点必须是编译器所知的。对象的类型决定了适用于它的操作\
  \ set。\n\n### 1.2.1 Hello, World!\n\n最简约的 C++ 程序是：\n\n点击此处查看代码图像\n\n```\n[](#cb1-1)int\
  \ main() { } //        最小的 C++ 程序\n```\n\n这定义了一个名为 `main()` 的函数，它不接受任何参数且不执行操作。\n\
  \n大括号 `{ }` 在 C++ 中表示分组。在这里，它们表示函数体的开始和结束。双斜杠 `//` 开始注释，并延伸到行尾。注释是给人类读者看的；编译器会忽略注释。\n\
  \n每个 C++ 程序必须恰好有一个名为 `main()` 的全局函数。程序从执行该函数开始。`main()` 返回的 `int` 整数值（如果有的话）是程序向“系统”返回的返回值。如果没有返回值，系统将接收一个表示圆满完成的值。`main()`\
  \ 返回非零值表示失败。并不是所有的操作系统和执行环境都会利用该返回值：基于 Linux/Unix 的环境会使用，但基于 Windows 的环境很少使用。\n\n\
  通常，程序会产生一些输出。这里是一个写入 `Hello, World!` 的程序：\n\n点击此处查看代码图像\n\n```\n[](#cb2-1)#include\
  \ <iostream>\n[](#cb2-2)\n[](#cb2-3)int main()\n[](#cb2-4){\n[](#cb2-5)     std::cout\
  \ << \"Hello, World!\\n\";\n[](#cb2-6)}\n```\n\n`#include <iostream>` 这一指示编译器包含\
  \ `std::cout` 的声明。没有这些声明，表达式 `std::cout << \"Hello, World!\\n\";` 将没有任何意义。运算符 `<<`\
  \ 指定将 `\"Hello, World!\"` 写入流中。`\\n` 是换行符。`std::` 指定 `cout` 位于 `std` 命名空间中。\n\n\n\
  \n\n函数声明可以包含参数名称。这对于程序的阅读者有所帮助，但除非该声明同时也是函数定义，否则编译器会直接忽略这些名称。例如：\n\n点击此处查看代码图片\n\
  \n```\n[](#cb7-1)double sqrt(double d);  // 返回 d 的平方根\n[](#cb7-2)double square(double);\
  \  // 返回参数的平方\n```\n\n函数的类型由其返回类型和参数类型序列组成。例如：\n\n点击此处查看代码图片\n\n```\n[](#cb8-1)double\
  \ get(const vector<double>& vec, int index);     // 类型: double(const vector<double>&,int)\n\
  ```\n\n函数可以是类的成员（§2.3, §4.2.1）。对于此类`member function`，其所属类的名称也是函数类型的一部分。例如：\n\n点击此处查看代码图片\n\
  \n```\n[](#cb9-1)char& String::operator[](int index);                // 类型: char&\
  \ String::(int)\n```\n\n我们希望代码是可理解的，因为这是通往可维护性的第一步。可读性的第一步是将计算任务分解为有意义的块（表示为函数和类）并对它们命名。这些函数随后提供了计算的基本词汇，就像类型（内置和用户定义）提供数据的基本词汇一样。C++\
  \ 标准算法（例如 `find`、`sort` 和 `iota`）了一个良好的开始（第 12 章）。接下来，我们可以将表示常见或特定任务的函数组合成更大的计算。\n\
  \n代码中的错误数量与代码量和代码复杂度密切相关。这两个问题都可以通过使用更多、更短的函数来解决。使用函数来完成特定任务通常可以避免我们在其他代码中间编写特定的代码段；将其封装为函数迫使我们为该活动命名并记录其依赖关系。\n\
  \n如果定义的两个函数名称相同，但参数类型不同，编译器将为每次调用选择最合适的函数调用。例如：\n\n点击此处查看代码图片\n\n```\n[](#cb10-1)void\
  \ print(int);     // 接收一个整数参数\n[](#cb10-2)void print(double);  // 接收一个浮点参数\n[](#cb10-3)void\
  \ print(string);  // 接收一个字符串参数\n[](#cb10-4)\n[](#cb10-5)void user()\n[](#cb10-6){\n\
  [](#cb10-7)     print(42);               // 调用 print(int)\n[](#cb10-8)     print(9.65);\
  \             // 调用 print(double)\n[](#cb10-9)     print(\"Barcelona\");      //\
  \ 调用 print(string)\n[](#cb10-10)}\n```\n\n如果两个备选函数都可以被调用，但没有一个比另一个更好，则该调用被视为模糊的，编译器会报错。例如：\n\
  \n点击此处查看代码图片\n\n```\n[](#cb11-1)void print(int,double);\n[](#cb11-2)void print(double,int);\n\
  [](#cb11-3)\n[](#cb11-4)void user2()\n[](#cb11-5){\n[](#cb11-6)     print(0,0);\
  \     // 错误：歧义\n[](#cb11-7)}\n```\n\n定义多个名称相同的函数被称为`function overloading`（函数重载），它是泛型编程的核心部分（§7.2）。当函数被重载时，同名的每个函数应该实现相同的语义。`print()`\
  \ 函数就是这样一个例子；每个 `print()` 都实现相同的逻辑。\n\n## 1.4 类型、变量与算术\n\n算运算符可以用于基本类型的适当组合：\n\n\
  点击此处查看代码图片\n\n```\n[](#cb14-1)x+y     // 加\n[](#cb14-2)+x      // 一元加\n[](#cb14-3)x−y\
  \     // 减\n[](#cb14-4)−x      // 一元减\n[](#cb14-5)x*y     // 乘\n[](#cb14-6)x/y \
  \    // 除\n[](#cb14-7)x%y     // 整数取模（模）\n```\n\n比较运算符也是如此：\n\n点击此处查看代码图片\n\n```\n\
  [](#cb15-1)x==y     // 等\n[](#cb15-2)x!=y     // 不等于\n[](#cb15-3)x<y      // 小于\n\
  [](#cb15-4)x>y      // 大于\n[](#cb15-5)x<=y     // 小于或等于\n[](#cb15-6)x>=y     //\
  \ 大于或等于\n```\n\n此外，提供了逻辑运算符：\n\n点击此处查看代码图片\n\n```\n[](#cb16-1)x&y      // 按位与\n\
  [](#cb16-2)x|y      // 按位或\n[](#cb16-3)x^y      // 按位异或\n[](#cb16-4)~x       //\
  \ 按位取反\n[](#cb16-5)x&&y     // 逻辑与\n[](#cb16-6)x||y     // 逻辑或\n[](#cb16-7)!x  \
  \     // 逻辑非（取反）\n```\n\n按位逻辑运算符产生的结果是针对每个位执行操作的操作数类型。逻辑运算符 `&&` 和 `||` 仅根据操作数的值返回\
  \ `true` 或 `false`。\n\n在赋值和算术运算中，C++ 在基本类型之间执行所有有意义的转换，以便它们可以自由混合：\n\n点击此处查看代码图片\n\
  \n\n\n\n```\nvoid some_function()    // 一个不返回值的函数\n{\n  double d = 2.2;    // 初始化浮点数\n\
  \  int i = 7;         // 初始化整数\n  d = d+i;           //将和赋值给 d\n  i = d*i;     \
  \      // 将乘积赋值给 i；注意：将 double  d*i 截断为 int\n}\n```\n\n表达式中使用的转换被称为*常规算术转换*（the\
  \ usual arithmetic conversions），其目的是确保表达式按照其操作数的最高精度进行计算。例如，一个 `double` 和 `int`\
  \ 的相加是使用双精度浮点算术计算的。\n\n注意 `=` 是赋值运算符，而 `==` 用于测试相等性。\n\n除了常规的算术和逻辑运算符外，C++ 还提供了更具体的运算来修改变量：\n\
  \n点击此处查看代码图像\n\n```\nx+=y     // x = x+y\n++x      // 递增：x = x+1\nx-==     // x\
  \ = x-y\n--x      // 递减：x = x-1\nx*=y     // 缩放：x = x*y\nx/=y     // 缩放：x = x/y\n\
  x%=y     // x = x%y\n```\n\n这些运算符简洁、方便且非常频繁。\n\n表达式的求值顺序是从左到右，赋值除外（赋值是从右到左）。遗憾的是，函数参数的求值顺序是不指定的。\n\
  \n### 1.4.2 初始化\n\n在对象可以使用之前，必须给它赋一个值。C++ 提供了多种表示初始化的符号，例如上面使用的 `=`，以及一种基于大括号分隔的初始化列表的通用形式：\n\
  \n点击此处查看代码图像\n\n```\ndouble d1 = 2.3;                 // 初始化 d1 为 2.3\ndouble d2\
  \ {2.3};                 // 初始化 d2 为 2.3\ndouble d3 = {2.3};               // 初始化\
  \ d3 为 2.3（使用 { ... } 时 = 是可选的）\ncomplex<double> z = 1;           // 一个带有双精度浮点数标量的复数\n\
  complex<double> z2 {d1,d2};\ncomplex<double> z3 = {d1,d2};    // 使用 { ... } 时 =\
  \ 是可选的\nvector<int> v {1,2,3,4,5,6};     // 一个整数向量\n```\n\n`=` 形式是传统的并可以追溯到 C 语言，但如果不确定，请使用通用的\
  \ `{}` 列表形式。即使没有其他理由，它还能让你避免导致丢失信息的转换：\n\n点击此处查看代码图像\n\n```\nint i1 = 7.8;     \
  \   // i1 变为 7（意外吗？）\nint i2 {7.8};        // 错误：浮点数到整数的转换\n```\n\n遗憾的是，丢失信息的转换（*收窄转换*，narrowing\
  \ conversions），例如从 `double` 到 `int` 以及从 `int` 到 `char`，是被允许并隐式应用的。隐式收窄转换引起的问题是为了兼容\
  \ C 语言而付出的代价（§16.3）。\n\n常量不能保持未初始化状态，变量只有在极少数情况下应该保持未初始化。在为它找到合适的值之前，不要引入它的名称。自定义类型（例如\
  \ `string`、`vector`、`Matrix`、`Motor_controller` 和 `Orc_warrior`）可以定义为隐式初始化（§4.2.1）。\n\
  \n在定义变量时，当可以从初始化器推导出类型时，不需要显式声明其类型：\n\n点击此处查看代码图像\n\n```\nauto b = true;       //\
  \ 一个 bool\nauto ch = 'x';       // 一个 char\nauto i = 123;        // 一个 int\nauto\
  \ d = 1.2;        // 一个 double\nauto z = sqrt(y);   // 一个带有双精度浮点数标量的复数\nauto z2\
  \ = {d1,d2};\nauto z3 = {d1,d2};    // 使用 { ... } 时 = 是可选的\nauto b = true;     \
  \  // 一个 bool\nauto ch = 'x';       // 一个 char\nauto i = 123;        // 一个 int\n\
  auto d = 1.2;        // 一个 double\nauto z = sqrt(y);   // 一个带有双精度浮点数标量的复数\nauto\
  \ z2 = {d1,d2};\nauto z3 = {d1,d2};    // 使用 { ... } 时 = 是可选的\nauto b = true;  \
  \     // 一个 bool\nauto ch = 'x';       // 一个 char\nauto i = 123;        // 一个 int\n\
