  \n### 7.5 模板编译模型\n\n假设存在概念（§7.2），模板的参数将根据其概念进行检查。在这里发现的错误将被报告，且程序员必须修复这些问题。在此时无法进行检查的内容（例如未受约束模板参数的参数）将推迟到为模板和一组模板参数生成代码时进行：即“模板实例化时”。对于没有概念的代码，这里是所有类型检查发生的地方。当使用概念时，我们只有在概念检查成功后才会到达这里。\n\
  \n实例化时（晚期）类型检查的一个遗憾的副作用是，类型错误可能在非常晚的时候才被发现，并可能导致糟糕的错误信息，因为编译器在结合了程序中多个地方的信息后才发现问题。\n\
  \n为模板提供的实例化时类型检查检查了参数在模板定义中使用情况。这提供了通常被称为“鸭子类型”（“如果它走起来像鸭，叫起来也像鸭，那它就是鸭”）的编译时变体。或者——使用更技术术语——我们对值进行操作，操作的存在和意义完全取决于其操作数的值。这与另一种观点不同，即对象具有类型，类型决定操作的存在和意义。值“存在”于对象中。这是\
  \ C++ 中对象（例如变量）的工作方式，且只有符合对象要求的值才能被放入其中。使用模板在编译时完成的操作大部分不涉及对象，只涉及值。例外是 `constexpr`\
  \ 函数（§1.6）中的局部变量，它们在编译器内部被用对象。\n\n要使用未受约束的模板，其定义（而不只是声明）必须在使用点处于作用范围内。例如，标准头文件 `<vector>`\
  \ 包含了 `vector` 的定义。在实践中，这意味着模板定义通常位于头文件中，而不是 `.cpp` 文件中。当我们开始使用模块（§3.3）时，情况发生了变化。使用模块时，普通函数和模板函数的源代码组织方式相同。在这两种情况下，定义都将受到文本包含问题的保护。\n\
  \n### 7.6 建议\n\n[1] 模板为编译时编程提供了一种通用机制；§7.1。\n\n[2] 设计模板时，仔细考虑假设其模板参数的概念（要求）；§7.3.2。\n\
  \n[3] 设计模板时，使用一个具体版本进行初始实现、调试和度量；§7.3.2。\n\n[4] 将概念作为设计工具；§7.2.1。\n\n[5] 为所有模板参数指定概念；§7.2;\
  \ [CG: T.10]。\n\n[6] 尽可能使用标准概念（例如 Ranges 概念）；§7.2.4; [CG: T.11]。\n\n[7] 如果你只需要在一个地方使用简单的函数对象，请使用\
  \ lambda；§6.3.2。\n\n[8] 模板没有单独编译：在每个使用模板的编译单元中 `#include` 模板定义。\n\n[9] 使用模板表达容器和范围；§7.3.2;\
  \ [CG: T.3]。\n\n[10] 避免使用没有意义语义的“概念”；§7.2; [CG: T.20]。\n\n[11] 为概念要求一组完整的操作；§7.2;\
  \ [CG: T.21]。\n\n[12] 当你需要一个接受多种类型可变参数的函数时，使用变长模板；§7.4。\n\n[13] 不要对同质参数列表使用变长模板（对于该情况，优选初始化列表）；§7.4。\n\
  \n[14] 使用模板时，确保其定义（而不只是声明）在作用范围内；§7.5。\n\n[15] 模板提供了编译时的“鸭子类型”；§7.5。\n\n# 8 库概览\n\
  \n*既然无知是瞬间完成的，何必浪费时间学习呢？*\n– 霍布斯\n\n* 介绍\n* 标准库组件\n* 标准库头文件与命名空间\n* 建议\n\n## 8.1\
  \ 介绍\n\n没有任何程序是只用语言编写的。首先需要开发一套库。这些库构成了基础。用裸语言编写大多数程序都是乏味的的，而 1 章到 7 章，以及 9 章到 15\
  \ 章提供了标准库设施的快速浏览。我简要介绍常用的标准库类型，如 `string`、`ostream`、`variant`、`vector`、`map`、`path`、`unique_ptr`、`thread`、`regex`\
  \ 以及 `complex`。标准库占据了 ISO C++ 标准的三分之一。其设计投入了大量心血，实现投入了更多，并将投入大量精力进行维护和扩展。\n\n本书描述的标准库设施是每个\
  \ C++ 实现的一部分。除了标准库组件外，大多数实现还提供图形用户界面（GUI）系统、Web 接口、数据库接口等。同样，大多数应用程序开发环境为企业或工业标准开发或执行环境提供“基础库”。在这里，我不描述此类系统和库。意图是对定义的\
  \ C++ 进行自包含描述并保持示例的可移植性。自然，鼓励程序员探索大多数系统中提供的更丰富的设施。\n\n### 8.2 标准库组件\n\n标准库提供的设施可以分类如下：\n\
  \n* 运行时语言支持（例如分配和运行时类型信息）。\n* C 标准库（带有极小的修改以减少对类型系统的违反）。\n* 字符串（支持国际字符集、本地化和子字符串只读视图）；参见\
  \ §9.2。\n* 正则表达式匹配；参见 §9.4。\n* I/O 流是一个输入输出的可扩展框架，用户可以在其中添加自己的类型、流、缓冲策略、区域和字符集（10\
  \ 章）。还有一个用于便携操作文件系统的库（§10.10）。\n\n\n\n\n*   一个包含容器（如 `vector` 和 `map`）和算法（如 `find()`、`sort()`\
  \ 和 `merge()`）的框架；参见第 11 章和第 12 章。该框架传统上被称为 STL [Stepanov,1994]，它是可扩展的，用户可以添加自己的容器和算法。\n\
  *   对数值计算的支持（例如标准数学函数、复数、带有算术运算的向量以及随机数生成器）；参见 §4.2.1 节和第 14 章。\n*   对并发编程的支持，包括\
  \ `thread`s 和锁；参见第 15 章。并发支持是基础性的，以便用户能够以库的形式为新的并发模型添加支持。\n*   大多数 STL 算法和一些数值算法的并行版本（例如\
  \ `sort()` 和 `reduce()`）；参见 §12.9 节和 §14.3.1 节。\n*   支持模板元编程的工具类（例如类型 traits；§13.9\
  \ 节）、STL 风格的泛型编程（例如 `pair`；§13.4.3 节）、通用编程（例如 `variant` 和 `optional`；§13.5.1 节，§13.5.2\
  \ 节）以及 `clock`（§13.7 节）。\n*   对通用资源进行高效安全管理的支持，以及一个可选垃圾回收器的接口（§5.3 节）。\n*   用于资源管理的“智能指针”（例如\
  \ `unique_ptr` 和 `shared_ptr`；§13.2.1 节）。\n*   特殊用途容器，如 `array`（§13.4.1 节）、`bitset`（§13.4.2\
  \ 节）和 `tuple`（§13.4.3 节）。\n*   流行单位的后缀，例如毫秒的 `ms` 和虚数的 `i`（§5.4.4 节）。\n\n将类包含在库的主要标准是：\n\
  *   它对几乎每个 C++ 程序员（无论是初学者还是专家）都有帮助，\n*   它可以以通用形式提供，且与相同功能的简单版本相比不会增加显著的开销，\n* \
  \  简单的用法应该是易于学习的（相对于其任务固有的复杂性）。\n\n本质上，C++ 标准库提供了最常用的基础数据结构以及用于这些数据结构上的基础算法。\n\n\
  ### 8.3 标准库头文件和命名空间\n\n每个标准库设施都通过某些标准头文件提供。例如：\n\n```\n[](#cb234-1)#include<string>\n\
  [](#cb234-2)#include<list>\n```\n\n这使得标准的 `string` 和 `list` 可用。\n\n标准库定义在一个名为 `std`\
  \ 的命名空间中（§3.4 节）。要使用标准库设施，可以使用 `std::` 前缀：\n\n点击此处查看代码图像\n\n```\n[](#cb235-1)std::string\
  \ sheep {\"Four legs Good; two legs Baaad!\"};\n[](#cb235-2)std::list<std::string>\
  \ slogans {\"War is Peace\", \"Freedom is Slavery\", \"Ignorance is Strength\"};\n\
  ```\n\n为了简单起见，我在示例中很少显式使用 `std::` 前缀。我也不会总是显式 `#include` 必要的头文件。要编译并运行这里的代码片段，你必须\
  \ `#include` 相应的头文件并使它们声明的名称可访问。例如：\n\n点击此处查看代码图像\n\n```\n[](#cb236-1)#include<string>\
  \           // 使标准的 string 设施可用\n[](#cb236-2)using namespace std;       // 在没有 std::\
  \ 前缀的情况下使用 std 名称\n[](#cb236-3)\n[](#cb236-4)string s {\"C++ is a general−purpose\
  \ programming language\"};   // OK: string 是 std::string\n```\n\n将命名空间中的每个名称都丢到全局命名空间中通常是不良做法。但在本书书中，我专门使用标准库，并且了解它提供了什么是。以下是标准库头文件的节选，它们都在\
  \ `std` 中提供声明：\n\n| 选定的库头文件 | | |\n| :--- | :--- | :--- |\n| `<algorithm>` | `copy()`,\
  \ `find()`, `sort()` | 第 12 章 |\n| `<array>` | `array` | §13.4.1 节 |\n| `<chrono>`\
  \ | `duration`, `time_point` | §13.7 节 |\n| `<cmath>` | `sqrt()`, `pow()` | §14.2\
  \ 节 |\n| `<complex>` | `complex`, `sqrt()`, `pow()` | §14.4 节 |\n| `<filesystem>`\
  \ | `path` | §10.10 节 |\n| `<forward_list>` | `forward_list` | §11.6 节 |\n| `<fstream>`\
  \ | `fstream`, `ifstream`, `ofstream` | §10.7 节 |\n| `<future>` | `future`, `promise`\
