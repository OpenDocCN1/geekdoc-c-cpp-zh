  - [26] 重视简单性；§15.7.\n- [27] 优先使用 `packaged_task` 和 `future` 而非直接使用 `thread` 和 `mutex`；§15.7.\n\
  - [28] 使用 `promise` 返回结果并从 `future` 获取结果；§15.7.1; [CG: CP.60].\n- [29] 使用 `packaged_task`\
  \ 处理任务抛出的异常并安排值的返回；§15.7.2.\n- [30] 使用 `packaged_task` 和 `future` 表达对外部服务的请求并等待其响应；§15.7.2.\n\
  - [31] 使用 `async()` 启动简单任务；§15.7.3; [CG: CP.61].\n\n# 16 历史与兼容性\n\n*缓慢而行（festina\
  \ lente）。*\n\n*– 奥塔维斯·凯撒·奥古斯塔*\n\n* 历史\n    * 时间线; 早期阶段; ISO C++ 标准; 标准与 C++ 使用的编程风格\n\
  * C++ 特性演进\n    * C++11 语言特性; C++14 语言特性; C++17 语言特性\n\n*(注：由于用户提供的文本在 16 节之后包含了大量重复的英文段落，我仅翻译了第一次出现的内容)*\n\
  [/content] (Wait, the user's input is actually a mess of repeats. I will just provide\
  \ the translation of the unique parts once.) \n\n*(Actually, looking at the prompt,\
  \ the user provided a block of text and wants me to translate it. I will translate\
  \ the whole block as provided, but without the repeating parts.)* \n\n\n\n\n\n**2011**\
  \ ISO C++11 标准 `[C++,2011]`。它提供了统一初始化、移动语义、从初始化器推导类型（`auto`）、范围`for` 循环、变长模板参数、lambda\
  \ 表达式、类型别名、适用于并发的内存模型等许多特性。标准库增加了多个组件，包括线程、锁以及来自 2003 年技术报告的大多数组件。\n\n**2013** 第一批完整的\
  \ C++11 实现出现。\n\n**2013** *《C++ 编程语言》第四版* 引入了 C++11。\n\n**2014** ISO C++14 标准 `[C++,2014]`\
  \ 通过变量模板、数字分隔符、泛型 lambda 以及一些标准库的改进完善了 C++11。第一批 C++14 实现完成。\n\n**2015** C++ 核心准则项目启动\
  \ `[Stroustrup,2015]`。\n\n**2015** 概念 TS（Concepts TS）获得批准。\n\n**2017** ISO C++17\
  \ 标准 `[C++,2017]` 提供了多样化的新特性，包括求值顺序保证、结构化绑定、折叠表达式、文件系统库、并行算法以及 `variant` 和 `optional`\
  \ 类型。第一批 C++17 实现完成。\n\n**2017** 模块 TS（Modules TS）和范围 TS（Ranges TS）获得批准。\n\n**2020**\
  \ ISO C++20 标准（计划）。\n\n在开发期间，C++11 被称为 C++0x。正如大型项目中常见的情况，我们对完成日期过于乐观了。在接近尾，我们开玩笑说\
  \ `C++0x` 中的 ‘x’ 是十六进制，这样 `C++0x` 就变成了 `C++0B`。另一方面，委员会和主要的编译器供应商都按时交付了 C++14 和\
  \ C++17。\n\n## 16.1.2 早期阶段\n\n我最初设计并实现这种语言，是因为我想将 UNIX 内核的服务分布到多处理器和局域网中（即现在所说的多核和集群）。为此，我需要精确指定系统的部分以及它们之间的通信方式。Simula\
  \ `[Dahl,1970]` 本来是理想的，但受限于性能考虑。我还需要直接处理硬件，并提供高性能的并发编程机制，这对于 C 语言来说是理想的，但它对模块化和类型检查的支持很弱。在\
  \ C 中添加 Simula 风格的类（经典 C；§16.3.1）的结果——“带类的 C”，被用于一些重大项目，在这些项目中，其编写极少时间和空间程序的特性经过了严苛测试。它缺乏运算符重载、引用、虚函数、模板、异常以及许多许多细节\
  \ `[Stroustrup,1982]`。C++ 在研究机构之外首次使用始于 1983 年 7 月。\n\nC++（读作 “see plus plus”）这个名字是由\
  \ Rick Masstrup 在 1983 年夏天创造的。这个名字象征着自增运算符 `++`。\n\nC++ 语言的设计是为了成为一个更好的 C。我的观点是（现在仍然是），我们需要从语言和工具中获得的每一分帮助：我们试图构建的系统固有的复杂性始终处于我们所表达能力的边缘。\n\
  \nC++ 的大部分设计是在同事们的黑板上完成的。在早期，来自 Stu Feldman、Alexander Fraser、Steve Johnson、Brian\
  \ Kernighan、Doug McIlroy 和 Dennis Ritchie 的反馈是无价的。\n\n\n\n\n\n在 20 世纪 80 年代的后半叶，我根据用户的反馈继续添加了语言特性。其中最重要的的是模板\
  \ [Stroustrup,1988]和异常处理 [Koenig,1990]，在标准制定工作启动时，这些特性被认为是实验性的。在模板的设计中，我被迫在灵活性、效率和早期类型检查之间做出选择。在当时，没有人知道如何同时获得这三者。为了在对要求极高的系统应用中与\
  \ C 风格代码竞争，我觉得我必须选择前两个属性。回想起来，我认为这个选择是正确的，而对模板更好的类型检查的探索仍在 [DosReis,2006] [Gregor,2006]\
  \ [Sutton,2011] [Stroustrup,2012a]。异常的设计侧重于异常的多级传播、向错误处理器传递任意信息，以及通过使用带有析构函数的局部对象来表示和释放资源，实现异常与资源管理的整合。我笨拙地将这一关键技术命名为`Resource\
  \ Acquisition Is Initialization`，随后很快将其缩写为`RAII`（§4.2.2）。\n\n我泛化了 C++的继承机制，以支持多个基类\
  \ [Stroustrup,1987a]。这被称为`多重继承`，被认为是困难且具有争议的。我认为它比模板或异常重要得多。抽象类的多重继承（通常称为`接口`）现在支持静态类型检查和面向对象编程的语言中已是通用的了。\n\
  \nC++语言的发展与一些关键库设施同步演进。例如，我一起设计了复杂的 [Stroustrup,1984]、`vector`、`stack` 以及（I/O）流类\
  \ [Stroustrup,1985]，以及运算符重载机制。第一个字符串类和列表类是由 Jonathan Shopiro 和我作为同一项工作的一部分开发的。Jonathan\
  \ 的字符串类和列表类是第一个作为库的一部分被广泛使用的类。标准 C++库中的字符串类根源于这些早期的努力。在 [Stroustrup,1987b] 中描述的任务任务库是\
  \ 1980 年编写的第一个“带类的 C 语言”程序的一部分。它提供了协程和调度器。我编写了它及其相关类以支持 Simula 风格的仿真。遗憾的是，我们一直等到\
  \ 2011 年（30 年了！）才让并发支持实现了标准化并处处可用（第 15 章）。协程可能会成为 C++20 的一部分 [CoroutinesTS]。模板设施的发展受到了\
  \ Andrew Koenig、Alex Stepanov、我等人设计的各种`vector`、`map`、`list`和`sort`模板的影响。\n\n1998\
  \ 年标准库最重要的创新是 STL，一个算法和容器的框架（第 11 章, 第 12 章）。这是 Alex Stepanov（与 Dave Musser, Meng\
  \ Lee 等人）基于十多年泛型编程方面工作的成果。STL 在 C++社区及其他领域产生了深远的影响。\n\nC++成长于一个拥有大量成熟和实验性编程语言的环境（例如，Ada\
  \ [Ichbiah,1979]、Algol 68 [Woodward,1974] 和 ML [Paulson,1996]）。当时，我精通大约 25 种语言，它们对\
  \ C++的影响记录在 [Stroustrup,1994] 和 [Stroustrup,2007] 中。然而，决定性的影响总是来自我遇到的应用程序。让 C++的发展“问题驱动”而非模仿，是一项刻意的策略。\n\
  \n### 16.1.3 ISO C++标准\n\nC++用量的爆炸式增长导致了一些变化。在 1987 年的某个时候，很明显，C++的正式标准化是不可避免的，我们需要开始为标准化工作做准备\
  \ [Stroustrup,1994]。结果是，人们有意识地努力保持 C++编译器实现者与其主要用户之间的联系。这通过通过论文、电子邮件以及在 C++会议及其他地方的面对面会议实现的。\n\
  \nAT&T 贝尔实验室对 C++及其更广泛的社区做出了重大贡献，允许我与实现者和用户分享修订版 C++参考手册的草案。由于其中许多人就职于被视为与 AT&T\
  \ 竞争的公司，这一贡献的意义不应被低估。大约一百人阅读并评论了后来成为`Annotated C++ Reference Manual` [Ellis,1989]。在\
  \ 1991 年 6 月，在惠普的倡议下召集了 X31。从 1990 年到 2014 年，我在这些委员会服务，特别是后来被称为演进小组的委员会，直接负责处理重大变更的提案。ISO\
  \ C++委员会被称为 WG21。委员会在日益严苛的自我规定的流程和程序下工作。这些程序导致了更好的（更严谨的）规范，但也限制了创新 [Stroustrup,2007]。1995\
  \ 年 4 月产生了一份公开评审草案。第一个 ISO C++标准（ISO/IEC 14882-1998） [C++,1998]在 1998 年以 22 票赞成通过。该标准的\
  \ 2003 年有一个“错误修复发布”，因此你有时听到人们提到 C++03，但它本质上与 C++98 相同的语言。\n\nC++11 多年来被称为 C++0x，是\
  \ WG21 成员的工作。2009 年产生了一份公开评审草案。第二个 ISO C++标准（ISO/IEC 14882-2011） [C++,2011] 在 2011\
  \ 年 8 月以 21 票赞成通过。\n\n两个标准之间长期间隔的原因之一是，委员会的大多数成员（包括我在内）错误地认为 ISO 规则要求在发布标准后有一个“等待期”才能开始新特性的工作。因此，新语言特性的严肃工作直到\
  \ 2002 年才开始。其他原因包括现代语言及其基础库的增大。从标准文本的页数来说，语言增加了约 30%，标准库增加了约 100%。大部分增长归于更详细的规范，而非新功能。此外，对新\
  \ C++标准的工作必须非常小心，不要通过不兼容的更改损害旧代码。使用的数十亿行 C++代码是委员会不能破坏的。几十年的稳定性是一个至关重要的“特性”。\n\n\
  C++11 极大地扩展了标准库，并完善了实现这种在 C++98 中证明成功的“范式”和惯用语的编程风格所需的特性集。\n\n\n\n\n\nC++11 工作的总体目标是：\n\
  \n*   让 C++ 成为一种更适合系统编程和库构建的语言。\n*   让 C++ 变得更容易教学和学习。\n\n这些目标在 [Stroustrup,2007]\
  \ 中有详细记录。\n\n为了使并发系统编程具有类型安全性和移植性，我们做了巨大的努力。这涉及到内存模型 (§15.1) 以及对无锁编程的支持。这是 Hans\
  \ Boehm、Brian McKnight 以及其他人在并发工作组的工作。此外，我们添加了 `thread`s 库。\n\n在 C++11 之后，人们广泛共识标准之间的\
  \ 13 年间隔实在太长了。Herb Sutter 提议委员会采用在固定间隔准时发布的策略，即“火车模型（train model）”。我强烈主张缩短标准之间的间隔，以减少减少延迟的概率，因为总有人坚持需要额外的时间来包含“再一个核心特性”。我们达成了一个雄勃的\
  \ 3 年期计划，想法是交替发布次要版本和主版本。\n\nC++14 刻意设计为一个次要版本，旨在“完成 C++11”。这反映了一个现实：在有固定的发布日期的情况下，会有我们知道想要但无法准时交付的特性。此外，一旦被广泛使用，特性集中的差距不可避免地会被发现。\n\
  \n为了让工作进展得更快，允许独立特性的并行开发，并更好地利用许多志愿者的热情和技能，委员会利用了 ISO 开发和发布“技术规范”（Technical Specifications，TSs）的机制。这对于标准库组件似乎效果良好，尽管它可能会导致开发过程中出现更多阶段，从而导致延迟。对于语言特性，TSs\
  \ 的效果似乎不那么好。可能的原因是很少有重要的语言特性是真正独立的，因为编写标准措辞的工作在标准和 TS 之间并没有太大区别，而且较少的人可以对编译器实现进行实验。\n\
  \nC++17 原本是一个主版本。我所说的“主”，是指包含那些将改变我们思考设计和结构化软件的方式的特性。根据这个定义，C++17 最其多也只是一个中等版本。它包含了许多次要扩展，但那些本可以带来剧烈变化的特性（例如：概念、模块和协程）要么尚未准备绪，要么陷入了争议并缺乏设计方向。结果，C++17\
  \ 包含了每个人的一点点，但没有什么能显著改变已经吸收了 C++11 和 C++14 教训的 C++ 程序员的生活。我希望 C++20 将成为那个承诺的且急需要的重大修订，并且主要的新特性能在\
  \ 2020 年之前被广泛使用。其中的危险在于“委员会设计”、特性膨胀、缺乏统一风格以及短视的决策。在一个每次会议都有超过 100 名成员且更多人在线参与的委员会中，此类不受欢迎的现象几乎不可避免。向更易使用、更连贯的语言迈进非常困难。\n\
  \n### 16.1.4 标准与风格\n\n标准规定了什么有效以及如何有效。它没有规定什么才是良好且有效的使用。在理解编程语言特性的技术细节与将其与其他特性、库和工具有效结合以产生更好的软件之间，存在显著差异。我所说的“更好”意味着“更易维护、更不容易出错且更快速”。我们需要开发、推广并支持连贯的编程风格。此外，我们必须支持旧代码向这些更现代、有效且连贯的风格演进。\n\
  \n随着语言及其标准库的发展，推广有效编程风格的问题变得至关重要。要让大量程序员放弃一种可行的方案而转向更好的方案是极其困难的。仍然有人认为 C++ 只是 C\
  \ 语言的几个微小补充，也有人认为 1980 年代基于庞大类层次的面向对象编程风格是开发的巅峰。许多人正挣扎于在充满旧 C++ 代码的环境中很好地使用 C++11。另一方面，也有许多人热衷地过度使用新设施。例如，某些程序员深信只有使用大量模板元编程的代码才是真正的\
  \ C++。\n\n什么是*现代 C++*？在 2015 年，我开始通过开发一套由阐明理由支持的编码准则来回答这个问题。我很快发现我在应对这个问题上并不孤单，通过与来自世界许多地方的人（特别是来自微软、红帽和\
  \ Facebook），我们启动了“C++ 核心准则”（C++ Core Guidelines）项目 [Stroustrup,2015]。这是一个雄勃的项目，旨在以完全类型安全和完全资源安全为基础，实现更简单、快速且更易维护的代码\
  \ [Stroustrup,2016]。除了带有理由的特定编码规则外，我们用静态分析工具和一个微小的支持库来支撑这些准则。我认为这种做法对于推动整个 C++ 社区前进是必要的，从而从语言特性、库和支持工具的改进中受益。\n\
  \n### 16.1.5 C++ 使用\n\nC++ 现在是一种非常广泛使用的编程语言。它的用户群体从 1979 年的少数增长到 1991 年的约 40 万人；也就是说，在十多年的时间里，用户数量大约每\
  \ 7.5 个月翻倍一次。自然，自从最初的增长高峰后，增长率慢了下来，但我最好的估计是，2018 年大约有 450 万 C++ 程序员 [Kazakova,2015]。这些增长大部分发生在\
  \ 2005 年之后，当时处理器速度呈指数级爆炸，使得语言性能变得越来越重要。C++ 主要是一种工业级语言；也就是说，它在工业界的应用比在教育或编程语言研究中更为突出。它成长于贝尔实验室，灵感源于电信和系统编程（包括设备驱动程序、网络和嵌入式系统）多样且严格的需求。从那里开始，C++\
  \ 的使用扩展到了关键行业：微电子、Web 应用和基础设施、操作系统、金融、医疗、汽车、航空航天、高能物理、生物学、能源生产、机器学习、视频游戏、图形、动画、虚拟现实等。它主要用于解决那些需要\
  \ C++ 结合有效使用硬件和管理复杂的能力的问题。这似乎是一个不断扩展的应用领域 [Stroustrup,1993] [Stroustrup,2014]。\n\
  \n## 16.2 C++ 特性演进\n\n在这里，我列出了 C++11、C++14 和 C++17 标准添加到 C++ 中的语言特性和标准库组件。\n\n###\
  \ 16.2.1 C++11 语言特性\n\n查看特性列表可能会令人困惑。请记住，语言特性并不是为了孤立使用的。特别是 C++11 中新增的大多数特性，如果脱离旧特性提供的框架，是没有意义的。\n\
  \n[1] 使用 `{}` 列表的统一和通用初始化 (§1.4, §4.2.3)\n\n[2] 从初始化器推导类型：`auto` (§1.4)\n\n[3] 防止窄转换\
  \ (§1.4)\n\n[4] 通用且保证常量表达式：`constexpr` (§1.6)\n\n[5] 范围 `for` 语句 (§1.7)\n\n[6] 空指针关键字：`nullptr`\
  \ (§1.7)\n\n\n\n\n\n### [7] 有作用域且强类型的枚举 `enums`：`enum class` (§2.5)\n### [8] 编译时断言：`static_assert`\
  \ (§3.5.5)\n### [9] `{}` 列表到 `std::initializer_list` 的语言映射 (§4.2.3)\n### [10] 右值引用，启用移动语义\
  \ (§5.2.2)\n### [11] 以 `>>` 结尾的嵌套模板参数（`>` 之间无需空格）\n### [12] Lambda 表达式 (§6.3.2)\n\
  ### [13] 变变模板 (§7.4)\n### [14] 类型和模板别名 (§6.4.2)\n### [15] Unicode 字符\n### [16] `long\
  \ long` 整数类型\n### [17] 对齐控制：`alignas` 和 `alignof`\n### [18] 在声明中使用表达式类型作为类型的能力：`decltype`\n\
  ### [19] 原始字符串字面量 (§9.4)\n### [20] 通用 POD（“普通旧数据”）\n### [21] 通用联合体 `union`\n###\
  \ [22] 作为模板参数的本地类\n### [23] 后置返回类型语法\n### [24] 属性语法以及两个标准属性：`[[carries_dependency]]`\
