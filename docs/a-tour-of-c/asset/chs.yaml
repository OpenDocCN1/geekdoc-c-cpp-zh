  \n[28] 熟悉标准库容器，并优先使用它们而非手工的数据结构；§11.6。\n\n# 12 算法\n\n*勿过度增加必要的实体。*\n\n*– 威廉·奥卡*\n\
  \n* 引言\n* 迭代器的用法\n* 迭代器类型\n* 流迭代器\n* 谓词\n* 算法概述\n* 概念\n* 容器算法\n* 并行算法\n* 建议\n\n\
  ## 12.1 引言\n\n一个数据结构（如 `list` 或 `vector`）本身并不十分有用。要使用它，我们需要基础访问操作，例如添加和删除元素（如 `list`\
  \ 和 `vector` 所提供的操作）。此外，我们很少仅仅是在容器中存储对象。我们还经常对它们进行排序、打印、提取子集、删除元素、搜索对象等。因此，标准库在提供常用容器类型之外，还为容器提供了最常用的算法。例如，我们可以简单且高效地对\
  \ `Entry` 的 `vector` 进行排序，并将每个唯一 `vector` 元素的拷贝放置在 `list` 中：\n\n点击此处查看代码图像\n\n```\n\
  void f(vector<Entry>& vec, list<Entry>& lst) {\n     sort(vec.begin(),vec.end());\
  \                      // 使用 < 进行排序\n     unique_copy(vec.begin(),vec.end(),lst.begin());\
  \   // 不拷贝相邻的相等元素\n}\n```\n\n为了使此能够通，必须为 `Entry` 定义小于（`<`）和等于（`==`）。例如，点击此处查看代码\n\
  \n```cpp\nbool operator<(const Entry& x, const Entry& y) {\n     // ... 实现 ...\n\
  }\n```\n\n标准算法是用半开区间序列表示的。例如，`find` 由指定起始和结束元素的迭代器对表示：![Image](img/027.jpeg)\n\n\
  在示例中，`find` 返回找到元素的迭代器。如果没有找到元素，它返回 `end()`。如果我们想将元素放入新容器，可以使用点击此处查看代码\n\n```cpp\n\
  list<Entry> f(vector<Entry>& vec) {\n     list<Entry> res;\n     sort(vec.begin(),vec.end());\n\
  \     unique_copy(vec.begin(),vec.end(),res.begin());\n     return res;\n}\n```\n\
  \n`back_inserter` 允许我们在不需要预分配空间的情况下向容器追加元素。这避免了手动内存管理。参考 5.2。\n\n## 12.2 迭代器的用法\n\
  \n与许多标准库算法一样，`find` 返回 `end()` 表示“未找到”。`has_c()` 的等效简洁定义为：\n\n```cpp\nbool has_c(const\
  \ string& s, char c) {\n     return find(s.begin(),s.end(),c)!=s.end();\n}\n```\n\
  \n一个更有趣的练习是查找字符串中所有出现字符的位置。我们可以通过 `string` 迭代器的 `vector` 返回这些出现的情况。返回 `vector` 是高效的，因为\
  \ `vector` 移动语义。假设我们想要修改找到的位置，我们传递非常量字符串：\n\n```cpp\nvector<string::iterator> find_all(string&\
  \ s, char c) {\n     vector<string::iterator> res;\n     for (auto p = s.begin();\
  \ p!=s.end(); ++p)\n           if (*p==c)\n                 res.push_back(p);\n\
  \     return res;\n}\n```\n\n我们使用常规循环遍历字符串，通过 `++` 使迭代器 `p` 向前移动一个元素，并使用解引用运算符 `*`\
  \ 查看元素。我们可以这样测试 `find_all()`：\n\n\n\n\n\n```cpp\nvoid test(){\n     string m {\"\
  Mary had a little lamb\"};\n     for (auto p : find_all(m,'a'))\n           if (*p!='a')\n\
  \             cerr << \"a bug!\\n\";\n}\n```\n\n对 `find_all()` 的调用可以用如下图形化方式表示：\n\
  \n![Image](img/00028.jpeg)\n\n迭代器和标准算法在所有有意义的标准容器上的工作方式都是等价。因此，我们可以对 `find_all()`\
  \ 进行泛化：\n\n点击查看代码图片\n\n```cpp\ntemplate<typename C, typename V>\nvector<typename\
  \ C::iterator> find_all(C& c, V v)      // 在 c 中查找所有 v 出现的位置\n{\n     vector<typename\
  \ C::iterator> res;\n     for (auto p = c.begin(); p!=c.end(); ++p)\n          \
  \ if (*p==v)\n                 res.push_back(p);\n     return res;\n}\n```\n\n使用\
  \ `typename` 是为了通知编译器 `C` 的 `iterator` 应该是一个类型，而不是某种类型的值（例如整数 `7`）。我们可以通过为 `Iterator`\
  \ 引入类型别名 (§6.4.2) 来隐藏这一实现细节：\n\n点击查看代码图片\n\n```cpp\ntemplate<typename T>\nusing\
  \ Iterator = typename T::iterator;         // T 的迭代器\n\ntemplate<typename C, typename\
  \ V>\nvector<Iterator<C>> find_all(C& c, V v)        // 在 c 中查找所有 v 出现的位置\n{\n \
  \ vector<Iterator<C>> res;\n  for (auto p = c.begin(); p!=c.end(); ++p)\n  if (*p==v)\n\
  \  res.push_back(p);\n  return res;\n}\n```\n\n现在我们可以写道：\n\n点击查看代码图片\n\n```cpp\n\
  void test(){\n     string m {\"Mary had a little lamb\"};\n\n     for (auto p :\
  \ find_all(m,'a'))           // p 是一个 string::iterator\n           if (*p!='a')\n\
  \                 cerr << \"string bug!\\n\";\n\n     list<double> ld {1.1, 2.2,\
  \ 3.3, 1.1};\n     for (auto p : find_all(ld,1.1))          // p 是一个 list<double>::iterator\n\
  \     if (*p!=1.1)\n     cerr <<  \"list bug!\\n\";\n\n     vector<string> vs {\
  \  \"red\",  \"blue\",  \"green\",  \"green\",  \"orange\",  \"green\" };\n    \
  \ for (auto p : find_all(vs,\"red\"))        // p 是一个 vector<string>::iterator\n\
  \     if (*p!=\"red\")\n     cerr <<  \"vector bug!\\n\";\n\n     for (auto p :\
  \ find_all(vs,\"green\"))\n      *p =  \"vert\";\n}\n```\n\n迭代器用于分离算法和容器。算法通过迭代器对其数据进行操作，并且对存储这些元素的容器一无所知。相反，容器对作用在其元素上的算法一无所知；它做的就是提供迭代器。\n\
  \n## 迭代器类型\n\n迭代器用于分离算法和容器。算法通过迭代器对其数据进行操作，并且对存储这些元素的容器一无所知。相反，容器对作用在其元素上的算法一无所知；它做的就是提供迭代器。\n\
  \n## 迭代器\n\n迭代器用于分离算法和容器。算法通过迭代器对其数据进行操作，并且对存储这些元素的容器一无所知。相反，容器对作用在其元素上的算法一无所知；它做的就是提供迭代器。\n\
  \n\n\n\n\n```cpp\nint main(){\n    string from, to;\n    cin >> from >> to;    \
  \                  // 获取源文件名和目标文件名\n\n    ifstream is {from};                  \
  \   // 文件 \"from\" 的输入流\n    istream_iterator<string> ii {is};       // 流的输入迭代器\n\
  \    istream_iterator<string> eos {};        // 输入哨兵\n\n    ofstream os {to};  \
  \                     // 文件 \"to\" 的输出流\n    ostream_iterator<string> oo {os,\"\\\
  n\"};  // 流的输出迭代器\n\n    vector<string> b {ii,eos};              // b 是输入初始化的 vector\n\
  \    sort(b.begin(),b.end());                // 对缓冲区排序\n\n    unique_copy(b.begin(),b.end(),oo);\
  \      // 将缓冲区拷贝到输出，丢重复值\n\n    return !is.eof() || !os;                // 返回错误状态\
  \ (§1.2.1, §10.4)\n}\n```\n\n`ifstream` 是可以关联到文件的 `istream`，而 `ofstream` 是可以关联到文件的\
  \ `ostream` (§10.7)。`ostream_iterator` 的第二个参数用于分隔输出值。\n\n实际上，这个程序比需要的要长。我们将字符串读入\
  \ `vector`，然后对它们进行 `sort()`，最后将它们写出，消除重复项。一种更优雅的解决方案是根本不存储重复项。这可以通过将 `string` 保存在\
  \ `set` 中来实现，`set` 不保留重复项并保持其元素有序 (§11.4)。这样，我们就可以使用 `vector` 的两行替换为使用 `set` 的一行，并将\
  \ `unique_copy()` 替换为更简单的 `copy()`：\n\n点击此处查看代码图片\n\n```cpp\nset<string> b {ii,eos};\
  \           // 从输入收集字符串\ncopy(b.begin(),b.end(),oo);       // 将缓冲区拷贝到输出\n```\n\n\
  我们只使用了一次名称 `ii`、`eos` 和 `oo`，因此可以进一步减小程序体积：\n\n点击此处查看代码图片\n\n```cpp\nint main(){\n\
  \    string from, to;\n    cin >> from >> to;             // 获取源文件名和目标文件名\n\n  \
  \  ifstream is {from};            // 文件 \"from\" 的输入流\n    ofstream os {to};   \
  \           // 文件 \"to\" 的输出流\n\n    set<string> b {istream_iterator<string>{is},istream_iterator<string>{}};\
  \     // 读取输入\n    copy(b.begin(),b.end(),ostream_iterator<string>{os,\"\\n\"});\
  \                   // 拷贝到输出\n\n    return !is.eof() || !os;           // 返回错误状态\
  \ (§1.2.1, §10.4)\n}\n```\n\n最后的简化是否提高了了可读性，取决于口味和经验。\n\n### 12.5 谓词 (Predicates)\n\
  \n在之前的示例中，算法仅仅是“内置”了对序列中每个元素执行的操作。然而，我们通常希望将该操作作为算法的参数。例如，`find` 算法 (§12.2, §12.6)\
  \ 提供了一种查找特定值的方便方法。一种更通用的变体是寻找满足特定要求（即*谓词*）的元素。例如，我们可能想在 `map` 中搜索第一个大于 `42` 的值。`map`\
  \ 允许我们作为 *(key,value)* 对值序列的形式访问其元素，因此我们可以在 `map<string,int>` 的序列中搜索一个 `pair<const\
  \ string,int>`，其中 `int` 大于 `42`：\n\n点击此处查看代码图片\n\n```cpp\nvoid f(map<string,int>&\
  \ m){\n    auto p = find_if(m.begin(),m.end(),Greater_than{42});\n    // ...\n}\n\
  ```\n\n在这里，`Greater_than` 是一个函数对象 (§6.3.2](#part0011.html_ch06sec5))，它持有用于比较的值 (`42`)：\n\
  \n点击此处查看代码图片\n\n```cpp\nstruct Greater_than {\n    int val;\n    Greater_than(int\
  \ v) : val{v} {\n    bool operator()(const pair<string,int>& r) const { return r.second>val;\
  \ }\n};\n```\n\n或者，我们可以使用 lambda 表达式 (§6.3.2](#part0011.html_ch06sec5))：\n\n点击此处查看代码图片\n\
  \n```cpp\nauto p = find_if(m.begin(), m.end(), [](const pair<string,int>& r) { return\
  \ r.second>42; });\n```\n\n谓词不应修改其所应用的元素。\n\n### 12.6 算法概述\n\n算法的通用定义是“一组有限的规则，为解决一组特定问题提供了一系列操作，并具有五个重要特征：有限性……确定性……输入……输出……有效性”\
  \ [Knuth,1968,§1.1](#part0006.html_ch01sec1)]。在 C++ 标准库的语境下，算法是一个作用在元素序列上的函数模板。标准库提供了许多算法。这些算法定义在\
  \ `std` 命名空间中，并在 `<algorithm>` 头文件中。这些标准库算法都以序列作为输入。从 `b` 到 `e` 的半开序列被称为 `b,e)`。以下是一些示例：\n\
  \n| 选定的算法 | |\n| :--- | :--- |\n| `f=for_each(b,e,f)` | 对 `[b,e)` 中的每个元素 `x` 执行\
  \ `f(x)` |\n| `p=find(b,e,x)` | `p` 是 `[b,e)` 中第一个等于 `x` 的元素 |\n| `p=find_if(b,e,f)`\
  \ | `p` 是 `[b,e)` 中第一个满足 `f` 的元素 |\n| `n=count(b,e,x)` | `n` 是 `[b,e)` 中等于 `x` 的元素个数\
  \ |\n| `n=count_if(b,e,f)` | `n` 是 `[b,e)` 中满足 `f` 的元素个数 |\n| `replace(b,e,old,new)`\
  \ | 将 `[b,e)` 中等于 `old` 的元素替换为 `new` |\n| `replace_if(b,e,f,new)` | 将 `[b,e)` 中满足\
  \ `f` 的元素替换为 `new` |\n| `p=copy(b,e,out)` | 将 `[b,e)` 拷贝到 `out`，返回结束位置 |\n| `p=copy_if(b,e,out)`\
  \ | 将 `[b,e)` 中满足 `f` 的元素拷贝到 `out` |\n| `p=move(b,e,out)` | 将 `[b,e)` 移动到 `out`\
  \ |\n| `p=unique_copy(b,e,out)` | 将 `[b,e)` 拷贝到 `out`，丢弃重复值 |\n| `sort(b,e)` | 使用\
  \ `<` 对 `[b,e)` 排序 |\n| `sort(b,e,f)` | 使用 `f` 对 `[b,e)` 排序 |\n| `(p1,p2)=equal_range(b,e,v)`\
  \ | `[p1,p2)` 是有序序列 `[b,e)` 中等于 `v` 的范围；基本上是二分查找 |\n| `p=merge(b,e,b2,e2,out)` |\
  \ 将两个有序序列 `[b,e)` 和 `[b2,e2)` 合并到 `out` |\n| `p=merge(b,e,b2,e2,out,f)` | 使用 `f`\
  \ 将两个有序序列 `[b,e)` 和 `[b2,e2)` 合并到 `out` |\n\n这些算法以及更多（例如 §[14.3)）适用于容器、`string`\
  \ 和内置数组的元素。\n\n某些算法（如 `replace()` 和 `sort()`）会修改元素值，但没有算法可以添加或删除容器元素。原因是序列并没有标识持有这些元素的容器。要添加或删除元素，你需要了解容器的信息（例如\
  \ `back_inserter`；§12.1)）或直接引用容器本身（例如 `push_back()` 或 `erase()`；§11.2）。\n\nLambda\
  \ 经常作为参数传递的操作。例如：\n\n点击此处查看代码图片\n\n```cpp\nvector<int> v = {0,1,2,3,4,5};\nfor_each(v.begin(),v.end(),[](int&\
  \ x){ x=x*x; });     // v=={0,1,4,9,16,25}\n```\n\n\n\n\n\n标准库算法往往比平均手写循环更经过仔细的设计、规范和实现，因此请熟悉它们并优先使用它们，而不是使用原生语言编写的代码。\n\
  \n### 12.7 概念 (C++20)\n\n最终，标准库算法将使用概念（concepts）（第 7 章）进行规范。关于这方面的初步工作可以在 Ranges\
  \ 技术规范 [RangesTS] 中找到。可以在网上找到相应的实现。这些概念定义在 `<experimental/ranges>` 中，但希望 C++20 会为\
  \ `std` 命名空间添加非常相似的内容。\n\n`Range`（范围）是 C++98 中 `begin()`/`end()` 对定义的序列的泛化。`Range`\
  \ 是一个规定了元素序列所需条件的概念。它可以通过以下方式定义：\n\n*   一对 `{begin,end}` 迭代器\n*   一对 `{begin,n}`，其中\
  \ `begin` 是迭代器，`n` 是元素个数\n*   一对 `{begin,pred}`，其中 `begin` 是迭代器，`pred` 是谓词；如果对于迭代器\
  \ `p` `pred(p)` 为 `true`，则我们到达了序列末尾。这允许我们拥有无限序列以及“动态生成”的序列。\n\n正是 `Range` 概念让我们能够使用\
  \ `sort(v)`，而不是自 1994 年以来使用 STL 时所必须的 `sort(v.begin(),v.end())`。例如：\n\n点击此处代码图像\n\
  \n```cpp\ntemplate<BoundedRangeR>\n    requires Sortable<R>\nvoid sort(R& r) {\n\
  \    return sort(begin(r),end(r));\n}\n```\n\n`Sortable` 的关系默认为 `less`。\n\n除了 `Range`\
  \ 之外，Ranges TS 还提供了许多实用的概念。这些概念可以在 `<experimental/ranges/concepts>` 中找到。准确定义请参见\
  \ [RangesTS]。\n\n| 核心语言概念 |\n| --- |\n| `Same<T,U>` | `T` 与 `U` 是相同类型 |\n| `DerivedFrom<T,U>`\
  \ | `T` 派自 `U` |\n| `ConvertibleTo<T,U>` | `T` 可以转换为 `U` |\n| `CommonReference<T,U>`\
  \ | `T` 和 `U` 共享一个公共引用类型 |\n| `Common<T,U>` | `T` 和 `U` 共享一个公共类型 |\n| `Integral<T>`\
  \ | `T` 是整数类型 |\n| `SignedIntegral<T>` | `T` 是有符号整数类型 |\n| `UnsignedIntegral<T>`\
  \ | `T` 是无符号整数类型 |\n| `Assignable<T,U>` | `U` 可以赋值给 `T` |\n| `SwappableWith<T,U>`\
  \ | `T` 可以与 `U` 交换 |\n| `Swappable<T>` | `SwappableWith<T,T>` |\n\n`Common` 对于指定那些既能与多种相关类型工作又在数学上完备的算法非常重要。`Common<T,U>`\
  \ 是类型 `C`，我们可以通过首先将两者转换为 `C` 来比较 `T` 和 `U`。例如，我们希望比较 `std::string` 与 C 风格字符串（`char*`）以及\
  \ `int` 与 `double`，但不想比较 `std::string` 与 `int`。为了确保用于 `Common` 定义的 `common_type_t`\
  \ 特化（specialization）是适当的：\n\n点击此处代码图像\n\n```cpp\nusing common_type_t<std::string,char*>\
  \ = std::string;\nusing common_type_t<double,int> = double;\n```\n\n`Common` 的定义有点复杂，但它解决了一个困难的基础性问题。幸运的是，除非我们想对库（尚未）具有适当定义的混合类型进行操作，否则我们不需要定义\
  \ `common_type_t` 特化。`Common` 或 `CommonReference` 用于大多数可以比较不同类型值的概念和算法的定义。\n\n与比较相关的概念受\
  \ [Stepanov,2009] 的深刻影响。\n\n| 比较概念 |\n| --- |\n| `Boolean<T>` | `T` 可以用作布尔 |\n|\
  \ `WeaklyEqualityComparableWith<T,U>` | `T` 和 `U` 可以使用 `==` 和 `!=` 比较相等性 |\n| `WeaklyEqualityComparable<T>`\
  \ | `WeaklyEqualityComparableWith<T,T>` |\n| `EqualityComparableWith<T,U>` | `T`\
  \ 和 `U` 可以使用 `==` 比较相等性 |\n| `EqualityComparable<T>` | `EqualityComparableWith<T,T>`\
  \ |\n| `StrictlyOrderedWith<T,U>` | `T` 和 `U` 可以使用 `<`, `>`, 和 `>=` 进行比较 |\n| `StrictlyOrdered<T>`\
  \ | `StrictlyOrderedWith<T,T>` |\n\n`Common` 对于指定那些能与多种相关类型工作且在数学上完备的算法非常重要。`Common<T,U>`\
  \ 是类型 `C`，我们可以通过首先将两者转换为 `C` 来比较 `T` 和 `U`。例如，我们希望比较 `std::string` 与 C 风格字符串（`char*`）以及\
  \ `int` 与 `double`，但不想比较 `std::string` 与 `int`。为了确保用于 `Common` 定义的 `common_type_t`\
  \ 特化是适当的：\n\n点击此处代码图像\n\n```cpp\nusing common_type_t<std::string,char*> = std::string;\n\
  using common_type_t<double,int> = double;\n```\n\n`Common` 的定义有点复杂，但解决了一个困难的基础性问题。幸运的是，除非我们想对库（尚未）具有适当定义的混合类型进行操作，否则我们不需要定义\
  \ `common_type_t`。`Common` 或 `CommonReference` 用于大多数可以比较不同类型值的概念和算法的定义。\n\n与比较相关的概念受\
  \ [Stepanov,2009] 的影响。\n\n| 比较概念 |\n| --- |\n| `Boolean<T>` | `T` 可以用作布尔 |\n| `WeaklyEqualityComparableWith<T,U>`\
  \ | `T` 和 `U` 可以使用 `==` 和 `!=` 比较相等性 |\n| `WeaklyEqualityComparable<T>` | `WeaklyEqualityComparableWith<T,T>`\
  \ |\n| `EqualityComparableWith<T,U>` | `T` 和 `U` 可以使用 `==` 比较相等性 |\n| `EqualityComparable<T>`\
  \ | `EqualityComparableWith<T,T>` |\n| `StrictlyOrderedWith<T,U>` | `T` 和 `U` 可以使用\
  \ `<`, `>`, 和 `>=` 进行比较 |\n| `StrictlyOrdered<T>` | `StrictlyOrderedWith<T,T>` |\n\
  \n| 对象概念 |\n| --- |\n| `Destructible<T>` | `T` 可以被析构 |\n| `Constructible<T>` | `T`\
  \ 可以被构造 |\n| `DefaultConstructible<T>` | `T` 可以默认构造 |\n| `MoveConstructible<T>`\
  \ | `T` 可以移动构造 |\n| `CopyConstructible<T>` | `T` 可以拷贝构造 |\n| `Assignable<T,U>` |\
  \ `U` 可以赋值给 `T` |\n| `SwappableWith<T,U>` | `T` 可以与 `U` 交换 |\n| `Swappable<T>` |\
  \ `SwappableWith<T,T>` |\n| `Movable<T>` | `T` 可以被移动 |\n| `Copyable<T>` | `T` 可以被拷贝\
  \ |\n| `MoveCopyable<T>` | `T` 可以被移动拷贝 |\n| `Semireg<T>` | `T` 的 `+=` 和 `*=` 定义\
  \ |\n| `Equality<T>` | `T` 的 `==` 和 `!=` 定义 |\n| `Ordered<T>` | `T` 的 `<`, `>`,\
  \ 和 `>=` 定义 |\n\n| 可调用概念 |\n| --- |\n| `Invocable<F, Args>` | `F` 可以用 `Args` 调用\
  \ |\n| `Regular<F, Args>` | `F` 可以用 `Args` 调用并返回值 |\n| `Predicate<F, Args>` | `F`\
  \ 可以用 `Args` 调用并返回 `bool` |\n| `Relation<F, Args>` | `F` 可以用 `Args` 调用并返回 `bool`\
  \ |\n| `StrictOrder<F, Args>` | `F` 可以用 `Args` 调用并返回 `bool` |\n\n| 迭代器概念 |\n| ---\
  \ |\n| `Iterator<I>` | `I` 可以递增 (`++`) 和解引用 (`*`) |\n| `Sentinel<S,I>` | `S` 是 `Iterator`\
  \ 的哨兵；即 `S` 是对 `I` 值的谓词 |\n| `SizedSentinel<S,I>` | 哨兵 `S` 的 `−` 运算符适用于 `I` |\n\
  | `InputIterator<I>` | `I` 是输入迭代器；`*` 只能用于读取 |\n| `OutputIterator<I>` | `I` 是输出迭代器；`*`\
  \ 只能用于写入 |\n| `ForwardIterator<I>` | `I` 是向前迭代器，支持多次通过 |\n| `BidirectionalIterator<I>`\
  \ | `I` 是支持 `--` 的 `ForwardIterator` |\n| `RandomAccessIterator<I>` | `I` 是支持 `+`、`−`、`+=`、`−=`\
  \ 和 `[]` 的 `BidirectionalIterator` |\n| `Permutable<I>` | `I` 是 `ForwardIterator`，其中\
  \ `I` 允许我们移动和交换元素 |\n| `Mergeable<I1,I2,R,O>` | 使用 `Relation<R>` 将 `I1` 和 `I2` 定义的有序序列合并到\
  \ `O` |\n\n\n\n\n\n哨兵（sentinel）的基本思想是，我们可以从一个迭代器开始遍历一个范围，直到某个元素使谓词（predicate）真。这样，一个迭代器\
  \ `p` 和一个哨兵 `s` 就定义了一个范围 `[`p`:`s(*p)]]`。例如，我们可以定义一个哨兵谓词，用于使用指针作为迭代器遍历 C 风格的字符串：\n\
  \n```cpp\n[](const char* p) {return *p==0; }\n```\n\n`Mergeable` 和 `Sortable` 的总结相对于\
  \ [RangesTS] 进行了简化。\n\n| 范围概念 (Range concepts) |\n| --- | --- |\n| `Range<R>` |\
  \ `R` 是具有起始迭代器和哨兵的范围 |\n| `SizedRange<R>` | `R` 是一个可以在常数时间内知道其大小的范围 |\n| `View<R>`\
  \ | `R` 是一个拷贝、移动和赋值均为常数时间的范围 |\n| `BoundedRange<R>` | `R` 是一个迭代器类型和哨兵类型相同的范围 |\n\
  | `InputRange<R>` | `R` 是一个迭代器类型满足 InputIterator 的范围 |\n| `OutputRange<R>` | `R`\
  \ 是一个迭代器类型满足 OutputIterator 的范围 |\n| `ForwardRange<R>` | `R` 是一个迭代器类型满足 ForwardIterator\
  \ 的范围 |\n| `BidirectionalRange<R>` | `R` 是一个迭代器类型满足 BidirectionalIterator 的范围 |\n\
  | `RandomAccessRange<R>` | `R` 是一个迭代器类型满足 RandomAccessIterator 的范围 |\n\n在 [RangesTS]\
  \ 中还有其他概念，但这组是一个很好的开始。\n\n### 12.8 容器算法 (Container Algorithms)\n\n当我们等不及 Ranges\
  \ 的发布时，可以定义自己的简单的范围算法。例如，我们可以轻轻松地提供一种简写，直接使用 `sort(v)` 而不是 `sort(v.begin(),v.end())`：\n\
  \n点击此处查看代码图像\n\n```cpp\nnamespace Estd {\n    using namespace std;\n\n    template<typename\
  \ C>\n    void sort(C& c)\n    {\n         sort(c.begin(),c.end());\n    }\n\n \
  \   template<typename C, typename Pred>\n    void sort(C& c, Pred p)\n    {\n  \
  \       sort(c.begin(),c.end(),p);\n    }\n\n    // ...\n}\n```\n\n我将 `sort()`（以及其他算法）的容器版本放在它们自己的命名空间\
  \ `Estd`（“扩展的 `std`”）中，以避免干扰其他程序员对 `std` 命名空间的使用，并便于将这种权宜之替换为 `Range`。\n\n### 12.9\
  \ 并行算法 (Parallel Algorithms)\n\n当同一个任务需要应用于许多数据项时，只要不同数据项之间的计算是独立的，我们就可以在每个数据项上并行执行：\n\
  \n- `parallel execution`（并行执行）：任务在多个线程上完成（通常运行在多个处理器核心上）。\n- `vectorized execution`（向量化执行）：任务在单线程上使用向量化完成，也称为\
  \ `SIMD`（“单指令，多数据”）。\n\n标准库对这两种方式都提供了支持，并且我们可以明确指定想要顺序执行；在 `<execution>` 中，我们找到了：\n\
  \n- `seq`：顺序执行。\n- `par`：并行执行（如果可行）。\n- `par_unseq`：并行和/或顺序（向量化）执行（如果可行）。\n\n考虑\
  \ `std::sort()`：\n\n点击此处查看代码图像\n\n```cpp\nsort(v.begin(),v.end());            //\
  \ 顺序\nsort(seq,v.begin(),v.end());        // 顺序（与默认相同）\nsort(par,v.begin(),v.end());\
  \        // 并行\nsort(par_unseq,v.begin(),v.end());  // 并行和/或向量化\n```\n\n是否并行化和/或向量化取决于算法、序列中的元素数量、硬件以及运行在该硬件上的程序对该硬件的利用率。因此，`execution\
  \ policy indicators` 执行策略指示器只是提示。编译器和/或运行时调度程序将决定使用多少并发性。这些都是非显而易见的，在这里，不经测量就对效率做出结论的规则非常重要。\n\
  \n大多数标准库算法，包括 §12.6 表中 `equal_range` 之外的所有算法，都可以要求使用 `par` 和 `par_unseq` 如 `sort()`\
  \ 那样并行化和向量化。为什么 `equal_range()` 不行？因为目前还没有人为此提出算法。许多并行算法主要用于数值数据；参见 §14.3。\n\n请求并行执行时，务必避免数据竞态（15.2）和死锁（15.5）。\n\
  \n### 12.10 建议\n\n1. `STL` 算法作用于一个或多个序列；§12.1。\n2. 输入序列是半开的，并由一对 `iterators` 定义；§12.1。\n\
  3. 搜索时，算法通常返回序列的 `end` 表示未找到；§12.1。\n4. 算法不修改其参数；§12.1,12.2。\n5. 编写循环时，考虑它是否可以表示为范围算法；§12.1。\n\
  6. 使用谓词和其他函数对象为算法提供更广泛的含义；§12.1,12.5。\n7. 谓词必须是常的；§12.5。\n8. 熟悉标准库优于手写循环；§12.6。\n\
  9. 当 `pair-of-iterators` 风格变得繁琐时，引入范围；§12.8。\n\n# 13 工具 (Utilities)\n\n*你所享受的时间不是浪费的时间。*\
