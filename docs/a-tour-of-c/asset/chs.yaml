  \   s1 = s1 + '\\n';  // 添加换行符\n[](#cb238-4)     s2 += '\\n';      // 添加换行符\n[](#cb238-5)}\n\
  ```\n\n向 `string` 末尾添加内容的方式在语义上是等价的，但我更倾向于后者，因为它功能更明确、更简洁，并且可能更高效。\n\n`string` 是可变的。除了\
  \ `=` 和 `+=` 之外，还支持下标操作（使用 `[ ]`）和子串操作。例如：\n\n```\n[](#cb239-1)string name = \"\
  Niels Stroustrup\";\n[](#cb239-2)\n[](#cb239-3)void m3()\n[](#cb239-4){\n[](#cb239-5)\
  \     string s = name.substr(6,10);      // s = \"Stroustrup\"\n[](#cb239-6)   \
  \  name.replace(0,5,\"nicholas\");      // name 变为 \"nicholas Stroustrup\"\n[](#cb239-7)\
  \     name[0] = toupper(name[0]);        // name 变为 \"Nicholas Stroustrup\"\n[](#cb239-8)}\n\
  ```\n\n### 9.2.1 字符串实现\n\n实现字符串类是一个流行且实用的练习。然而，对于通用用途，我们精心设计的尝试很难比得上 `string` 的便利性和性能。如今，`string`\
  \ 通常使用*短字符串优化*。也就是说，短字符串存储在 `string` 对象中，只有较长的字符串被放在堆上。考虑：\n\n```\n[](#cb243-1)string\
  \ s1 {\"Annemarie\"};               // 短字符串\n[](#cb243-2)string s2 {\"Annemarie\
  \ Stroustrup\"};    // 长字符串\n```\n\n当 `string` 的值从短变为长（反之亦然），其表示会相应调整。“短”字符串可以包含多少字符？这取决于实现，但“大约\
  \ 14 个字符”并不是一个糟糕的猜测。\n\n`string` 的实际性能取决于运行时环境。特别是在多线程实现中，内存分配可能代价较高。此外，当使用许多长度不同的字符串时，会导致内存碎片。这些都是短字符串优化变得普遍的主要原因。\n\
  \n为了处理多种字符集，`string` 实际上是字符类型 `char` 的通用模板 `basic_string` 的别名：\n\n```\n[](#cb244-1)template<typename\
  \ Char>\n[](#cb244-2)class basic_string {\n[](#cb244-3)     // ... Char 的字符串 ...\n\
  [](#cb244-4)};\n[](#cb244-5)\n[](#cb244-6)using string = basic_string<char>\n```\n\
  \n用户可以定义任意字符类型的字符串。例如，假设我们有一个日语字符类型 `Jchar`，我们可以写：\n\n```\n[](#cb245-1)using Jstring\
  \ = basic_string<Jchar>;\n```\n\n现在我们可以对 `Jstring`（一种日语字符字符串）执行所有常规字符串操作。\n\n\n\n\
  \n字符序列最常见的用法是将其传递给某个函数进行读取。这可以通过按值传递 `string`、传递字符串的引用或传递 C 风格字符串来实现。在许多系统中，还有进一步的替代方案，例如标准库中未提供的字符串类型。在所有这些情况下，当我们想要传递子字符串时，都会产生额外的复杂性。为了解决这个问题，标准库提供了\
  \ `string_view`；`string_view` 本质上是一个（指针，长度）对，表示一个字符序列：\n\n![Image](img/00019.jpeg)\n\
  \n`string_view` 提供了对连续字符序列的访问。字符可以以许多可能的方式存储，包括在 `string` 中和 C 风格字符串中。`string_view`\
  \ 就像指针或引用，因为它并不拥有它所指向的字符。在这一点上，它类似于 STL 中的迭代器对（pair of iterators）（§12.3）。\n\n考虑一个拼接两个字符串的简单函数：\n\
  \n点击此处查看代码图片\n\n```\nstring cat(string_view sv1, string_view sv2)\n{\n     string\
  \ res(sv1.length()+sv2.length());\n     char* p = &res[0];\n     for (char c : sv1)\
  \                 // 拷贝的一种方法\n          *p++ = c;\n     copy(sv2.begin(),sv2.end(),p);\
  \     // 另一种方法\n     return res;\n}\n```\n\n我们可以调用 `cat()`：\n\n点击此处查看代码图片\n\n```\n\
  string king = \"Harold\";\nauto s1 = cat(king,\"William\");                // string\
  \ and const char*\nauto s2 = cat(king,king);                     // string and string\n\
  auto s3 = cat(\"Edward\",\"Stephen\"sv);          // const char * and string_view\n\
  auto s4 = cat(\"Canute\"sv,king);\nauto s5 = cat({&king[0],2},\"Henry\"sv);    \
  \    // HaHenry\nauto s6 = cat({&king[0],2},{&king[2],4});     // Harold\n```\n\n\
  此 `cat()` 相比于接受 `const string&` 参数的 `compose()`（§9.2）有三个优势：\n\n* 它可以用于许多不同方式管理的字符序列。\n\
  * 对于 C 风格字符串参数，不会创建临时的 `string` 参数。\n* 我们可以轻松地传递子字符串。\n\n注意 `sv`（“string view”）后缀的使用。要使用它，我们需要：\n\
  \n点击此处查看代码图片\n\n```\nusing namespace std::literals::string_view_literals;   // §5.4.4\n\
  ```\n\n为什么要费此精力？原因是因为当我们传递 `\"Edward\"` 时，我们需要从 `const char*` 构建一个 `string_view`，这需要计数字符。而对于\
  \ `\"Stephen\"sv`，长度是在编译时计算的。\n\n当返回 `string_view` 时，记住它非常像指针；它需要指向某些东西：\n\n点击此处查看代码图片\n\
  \n```\nstring_view bad()\n{\n     string s = \"Once upon a time\";\n     return\
  \ {&s[5],4};        // 错误：返回指向局部变量的指针\n}\n```\n\n我们返回了一个指向 `string` 字符的指针，而这些字符会在我们使用它们之前销毁。\n\
  \n`string_view` 的一个重要限制是它是字符的只读视图。例如，你不能使用 `string_view` 将字符传递给一个将其参数转换为小写的函数。对于这一点，你可能考虑使用\
  \ `gsl::span` 或 `gsl::string_span`（§13.3）。\n\n对 `string_view` 进行越界访问的行为是未定义的。如果你需要保证范围检查，请使用\
  \ `at()`（它会在尝试越界访问时抛出 `out_of_range` 异常），或使用 `gsl::string_span`（§13.3）。\n\n## 9.4\
  \ 正则表达式\n\n正则表达式是处理文本的强大工具。它们提供了一种简单描述文本模式的方法（例如美国邮政编码或 ISO 日期）。在 `<regex>` 中，标准库提供了\
  \ `regex` 类及其辅助函数。为了表示模式，我使用了以 `R(` 开头并以 `\"` 结尾的原始字符串（raw strings）。这允许在字符串中直接使用反斜杠。如果使用传统的字符串，模式将会是：\n\
  \n```\nregex pat {R\"(\\w{2}\\s*\\d{5})\"}; // 美国邮政编码\n```\n\n使用模式简单的方法是在流中搜索它：\n\
  \n点击此处查看代码图片\n\n```\nint lineno = 0;\nfor (string line; getline(cin,line); ) { \
  \     // 读取到缓冲区\n      ++lineno;\n      smatch matches;                        \
  \ // 匹配的字符串存储在这里\n      if (regex_search(line,pat))             // 在 line 中搜索 pat\n\
  \            cout << lineno << \":  \" << matches[0] << '\\n';\n}\n```\n\n`regex_search(line,matches,pat)`\
  \ 在 `line` 中搜索匹配 `pat` 存储的正则表达式，如果找到匹配项，则将其存储在 `matches` 中。如果没有找到匹配项，`regex_search(line,matches,pat)`\
  \ 返回 `false`。`matches` 变量类型为 `smatch`。“s”代表“sub”或“string”，`smatch` 是 `string` 类型子匹配的\
  \ `vector`。第一个元素 `matches[0]` 是完整匹配项。`regex_search()` 的结果是一个匹配集，通常表示为 `smatch`。\n\
  \n在 `<regex>` 中，标准库提供了：\n\n* `regex_match()`：匹配已知大小字符串的正则表达式（§9.2）。\n* `regex_search()`：在任意长度的数据流中搜索匹配正则表达式的字符串（§9.2）。\n\
  * `regex_replace()`：在任意长度的数据流中搜索匹配正则表达式的字符串并进行替换。\n* `regex_iterator`：迭代匹配项和子匹配项（§9.2）。\n\
  * `regex_token_iterator`：迭代非匹配项。\n\n### 9.4.1 搜索\n\n\n\n\n```cpp\nvoid use()\n{\n\
  \     ifstream in(\"file.txt\");    // 输入文件\n     if (!in)                    //\
  \ 检查文件是否打开\n          cerr << \"no file\\n\";\n\n     regex pat {R\"(\\w{2}\\s*\\\
  d{5}(−\\d{4})?)\"};  // 美国邮政编码模式\n\n     int lineno = 0;\n     for (string line;\
  \ getline(in,line); ) {\n           ++lineno;\n           smatch matches;   // 匹配字符串存储在这里\n\
  \           if (regex_search(line, matches, pat)) {\n                 cout << lineno\
  \ << \":  \" << matches[0] << '\\n';     // 完整匹配\n                 if (1<matches.size()\
  \ && matches[1].matched)       // 如果存在子模式\n                                    \
  \                          // 且匹配成功\n                       cout << \"\\t: \" <<\
  \ matches[1] << '\\n';       // 子匹配项\n           }\n     }\n}\n```\n\n此函数读取文件并查找美国邮政编码，例如\
  \ `TX77845` 和 `DC 20500−0001`。`smatch` 类型是正则表达式结果的容器。在这里，`matches[0]` 是整个模式而 `matches[1]`\
  \ 是可选的四位子模式。\n\n换行符 `\\n` 可以是模式的一部分，因此我们可以搜索多行模式。显然，如果我们想这样做，就不应该一次只读取一行。\n\n正则表达式的语法和语义设计得使得正则表达式可以被编译为状态机以实现高效执行\
  \ [Cox,2007]。`regex` 类型在运行时执行此编译。\n\n## 9.4.2 正则表达式表示法\n\n`regex` 库可以识别正则表达式表示法的几种变体。在这里，我使用了默认的表示法，它是用于\
  \ ECMAScript（更俗称为 JavaScript）的 ECMA 标准的变体。\n\n正则表达式的语法基于具有特殊含义的字符：\n\n| 正则表达式特殊字符\
  \ |\n| --- |\n| `.` | 任意单个字符（“通配符”） |\n| `\\` | 下一个字符具有特殊含义 |\n| `[` | 字符类开始 |\n\
  | `*` | 零或多次（后缀操作） |\n| `]` | 字符类结束 |\n| `+` | 一次或多次（后缀操作） |\n| `{` | 计数开始 |\n|\
  \ `?` | 可选（零或一次）（后缀操作） |\n| `}` | 计数结束 |\n| `\\|` | 备选（或） |\n| `(` | 分组开始 |\n| `^`\
  \ | 行首；否定 |\n| `)` | 分组结束 |\n| `$` | 行尾 |\n\n例如，我们可以这样指定一个以零或多个 `A` 开头，其后跟一个或多个\
  \ `B`，最后跟上一个可选的 `C` 的行：\n\n```cpp\n^A*B+C?$\n```\n\n匹配项的示例：\n\n点击此处查看代码图片\n\n```cpp\n\
  AAAAAAAAAAAABBBBBBBBBC\nBC\nB\n```\n\n不匹配项的示例：\n\n点击此处查看代码图片\n\n```cpp\nAAAAA  \
  \         // 没有 B\n  AAAABC        // 初始空格\nAABBCC          // C 太多\n```\n\n如果模式的一部分被包含在括号中，则被认为是一个子模式（可以从\
  \ `smatch` 中单独提取）。例如：\n\n点击此处查看代码图片\n\n```cpp\n\\d+−\\d+        // 无子模式\n\\d+(−\\\
  d+)      // 一个子模式\n(\\d+)(−\\d+)    // 两个子模式\n```\n\n通过添加后缀可以让模式变为可选或重复（默认为恰好一次）：\n\
  \n| 重复 |\n| --- |\n| `{n}` | 好 `n` 次 |\n| `{n,}` | `n` 次或更多 |\n| `{n,m}` | 至少 `n`\
  \ 次且最多 `m` 次 |\n| `*` | 零或多次，即 `{0,}` |\n| `+` | 一次或多次，即 `{1,}` |\n| `?` | 可选（零或一次），即\
  \ `{0,1}` |\n\n例如：\n\n```cpp\nA{3}B{2,4}\n```\n\n匹配项的示例：\n\n```cpp\nAAAB\nAAABB\n\
  ```\n\n不匹配项的示例：\n\n点击此处查看代码图片\n\n```cpp\nAA          // A 太少\nAAA          // B\
  \ 太少\nAAABBB          // B 太多\n```\n\n在任何重复表示法（`*`、`+`、`{}`）之后加上 `?` 会使模式匹配器变为“懒的”或“非贪婪的”。也就是说，在寻找模式时，它会寻找最短匹配。默认情况下，模式总是寻找最长匹配；这被称为“最大贪婪匹配”（Max\
  \ Munch）。考虑：\n\n```cpp\n```\n模式 `(ab)+` 匹配所有 `abab`。然而，`(ab)+?` 仅匹配第一个 `ab`。常见的字符类分类如下：\n\
  \n| 字符类 |\n| --- |\n| `alnum` | 字母数字 |\n| `alpha` | 字母 |\n| `blank` | 空格 |\n| `cntrl`\
  \ | 控制字符 |\n| `d` | 数字 |\n| `digit` | 数字 |\n| `graph` | 可打印字符 |\n| `lower` | 小写字母\
  \ |\n| `print` | 可打印字符 |\n| `punct` | 标点符号 |\n| `s` | 空白字符 |\n| `upper` | 大写字母 |\n\
  | `xdigit` | 十六进制 |\n| `w` | 单词字符（字母数字或下划线） |\n\n为了完全的可移植性，使用字符类名称而不是这些缩写。例如，考虑编写一个描述\
  \ C++ 标识符的模式：一个下划线或字母，其后跟着可选的字母、数字或下划线序列。为了说明涉及的细微差别，我包含了一些错误的尝试：\n\n点击此处查看代码图片\n\
  \n```cpp\n[:alpha:][alnum:]*              // 错误：来自 \":alpha\" 集合的字符后跟 ...\n[:alpha:]][[:alnum:]*\
  \              // 错误：不接受下划线（_' 不是 alpha）\n([[:alpha:]]|_)[[:alnum:]]*      // 错误：下划线也不是\
  \ alnum 的部分\n([[:alpha:]]|_)([[:alnum:]]|_)*        // OK，但笨拙\n[:alpha:]_][[:alnum:]_]*\
  \              // OK：在字符类中包含下划线\n[_[:alpha:]][_[:alnum:]]*              // 也是 OK\n\
  [_[:alpha:]]\\w*  // \\w 等同于 [_[:alnum:]]\n```\n\n最后，这里有一个使用最简单的 `regex_match()`\
  \ (§9.4.1](#part0014.html_ch09lev2sec2)) 测试字符串是否为标识符的函数：\n\n点击此处查看代码图片\n\n```cpp\n\
  bool is_identifier(const string& s)\n{\n     regex pat {\"[_[:alpha:]]\\w*\"}; 下划线或字母\n\
  \                               // 后跟零或多个下划线、字母或数字\n     return regex_match(s,pat);\n\
  }\n```\n\n\n\n\n注意，在普通字符串字面量中使用双倍反斜杠来包含一个反斜杠。使用原始字符串字面量可以缓解特殊字符带来的问题。例如：\n\n点击此处查看代码\n\
  \n```cpp\nbool is_identifier(const string& s) {\n     regex pat {R\"([_[:alpha:]]\\\
  w*)\"};\n     return regex_match(s,pat);\n}\n```\n\n这里是一些模式的示例：\n\n点击此处查看代码\n\n\
  ```cpp\nAx*            // A, Ax, Axxxx\nAx+            // Ax, Axxx     Not A\n\\\
  d−?\\d         // 1-2, 12      Not 1--2\n\\w{2}−\\d{4,5}  // Ab-1234, XX-54321,\
  \ 22-5432      Digits are in \\w\n(\\d*:)?(\\d+)   // 12:3, 1:23, 123, :123  Not\
  \ 123:\n(bs|BS)        // bs, BS       Not bS\n[aeiouy]       // a, o, u      An\
  \ English vowel, not x\n[^aeiouy]      // x, k         Not an English vowel, not\
  \ e\n[a^eiouy]      // a, ^, o, u   An English vowel or ^\n```\n\n`group`（子模式）可能由\
  \ `sub_match` 表示，它由括号定界。如果你需要不定义子模式的括号，请使用 `(?:` 而不是普通的 `(`。例如：\n\n点击此处查看代码\n\n\
  ```cpp\n(\\s|:|,)*(\\d*)   // 可选的空格、冒号和/或逗号，后面跟着一个可选的数字\n```\n\n假设我们对数字之前的字符（通常是分隔符）感兴趣，我们可以写成：\n\
  \n点击此处查看代码\n\n```cpp\n(?:\\s|:|,)*(\\d*)  // 可选的空格、冒号和/或逗号，后面跟着一个可选的数字\n```\n\n\
  这可以节省正则表达式引擎存储第一个字符所需的：`(?` 变体只有一个子模式。\n\n| 正则表达式分组示例 |\n| --- |\n| `\\d*\\s\\w+`\
  \ | 无分组（子模式） |\n| `(\\d*)\\s(\\w+)` | 两个组 |\n| `(\\d*)(\\s(\\w+))+` | 两个组（组不嵌套）\
  \ |\n| `(\\s*\\w*)+` | 一个组；一个或多个子模式；只有最后一个子模式被保存为 `sub_match` |\n| `<(.*?)>(.*?)</\\\
  1>` | 三个组；`\\1` 意味着“与组 1 相同” |\n\n最后一个模式对于解析 XML 非常有用。它寻找标签/结束标签标记。注意，我在标签和结束标签之间的子模式使用了非贪婪匹配（*懒惰匹配*）`.*?`。如果我使用普通的\
  \ `.` `*`，此输入将导致问题：\n\n点击此处查看代码\n\n```html\nAlways look on the <b>bright</b> side\
  \ of <b>life</b>.\n```\n\n对第一个子模式的*贪婪匹配*将与第一个 `<` 与最后一个 `>` 匹配。这将是正确的行为，但可能不是程序员所想要的。\n\
  \n关于正则表达式的更详尽的介绍，请参阅 [Friedl,1997]。\n\n### 9.4.3 迭代器####迭代器\n\n我们可以定义一个 `regex_iterator`\
  \ 来遍历字符序列并寻找模式的匹配项。例如，我们可以使用 `sregex_iterator`（即 `regex_iterator<string>`）输出 `string`\
  \ 中所有由空格分隔的单词：\n\n点击此处查看代码\n\n```cpp\nvoid test() {\n     string input = \"aa as;\
  \ asd ++e^asdf asdfg\";\n     regex pat {R\"(\\s+(\\w+))\"};\n     for (sregex_iterator\
  \ p(input.begin(),input.end(),pat); p!=sregex_iterator{}; ++p)\n           cout\
  \ << (*p)[1] << '\\n';\n}\n```\n\n输出如下：\n\n```\nas\nasd\nasdf\n```\n\n我们漏掉了第一个单词\
  \ `aa`，因为它的前面没有空格。如果我们将模式简化为 `R\"((\\w+))\"`，则会得到：\n\n```cpp\naa\nas\nasd\nasdf\n\
  ```\n\n`regex_iterator` 是双向迭代器，因此我们不能直接遍历 `istream`（它只提供输入迭代器）。此外，我们无法通过 `regex_iterator`\
  \ 写入，且默认的 `regex_iterator{}` 是唯一的序列结束。\n\n### 9.5 建议\n\n1. 使用 `std::string` 来拥有字符序列。\n\
  2. 优先使用 `string` 操作。\n3. 优先使用 `string` 声明变量和成员，而不是基类。\n4. 按值返回 `string`（使用移动语义）。\n\
  5. 直接或间接地使用 `substr()` 读取子串，使用 `replace()` 写入子串。\n6. `string` 可以根据需要增长或缩小。\n7. 需要范围检查时使用\
  \ `at()` 而不是迭代器。\n8. 想要优化速度时使用迭代器而不是 `at()`。\n9. `string` 不会溢出；\n10. 仅当你需要时使用 `c_str()`\
  \ 生成 C 风格的字符串表示。\n11. 使用 `stringstream` 或通用值提取函数（如 `to<X>`）进行字符串的数值转换。\n12. `basic_string`\
  \ 可用于制作任意类型的字符串。\n13. 对于用于标准库 `string` 的字面量使用 `s` 后缀。\n14. 使用 `string_view` 作为需要读取各种方式字符序列的函数参数。\n\
  15. 使用 `gsl::string_span` 作为需要写入各种方式字符序列的函数参数。\n16. 将 `string_view` 视为带有大小的指针；它不拥有其字符。\n\
  17. 对于用于标准库 `string_view` 的字面量使用 `sv` 后缀。\n18. 对于正则表达式的大多数常规使用 `regex`。\n19. 优先使用原始字符串字面量来表示所有非简单的模式。\n\
  20. 使用 `regex_match()` 匹配完整输入；\n21. 使用 `regex_search()` 在输入中搜索模式。\n22. 正则表达式表示可以调整以匹配不同的标准。\n\
  23. 默认的正则表达式表示是 ECMAScript。\n24. 保持节制；正则表达式很容易变成一种只写的语言。\n25. 注意 `\\i` 允许你根据之前的子模式来表达子模式。\n\
  26. 使用 `?` 使模式变为“懒惰”。\n27. 使用 `regex_iterator` 遍历流以寻找模式。\n\n\n\n\n\n* C 风格 I/O\n\
  * 文件系统\n* 建议\n\n## 10.1 引言\n\nI/O 流库提供了文本和数值数值的格式化和非格式化缓冲 I/O 操作。\n\n`ostream` 将强类型对象转换为字符流（字节）：\n\
  \n![Image](img/00020.jpeg)\n\n`istream` 将字符流（字节）转换为强类型对象：\n\n![Image](img/00021.jpeg)\n\
  \n对 `istream` 和 `ostream` 的操作已在 §10.2 和 §10.3 中进行了描述。这些操作是类型安全的、类型敏感的，并且可以扩展以处理用户定义的类型（§10.5）。\n\
  \n其他形式的用户交互（例如图形化 I/O）通过不是 ISO 标准部分的库处理，因此在此不进行描述。\n\n这些流可以用于二进制 I/O、用于多种字符类型、特定区域设置，并使用高级的缓冲策略，但这些主题超出了本书的范围。\n\
  \n这些流可以用于 `std::string` 的输入和输出（§10.3）、向 `string` 缓冲区格式化（§10.8）以及文件 I/O（§10.10）。\n\
  \nI/O 流类都拥有析构函数，用于释放所有资源（如缓冲区和文件句柄）。也就是说，它们是“资源获取初始化”（RAII；§5.3）的示例。\n\n## 10.2\
  \ 输出\n\n在 `<ostream>` 中，I/O 流库为每种内置类型定义了输出。此外，很容易定义用户定义类型的输出（§10.5）。`<<` 运算符（“放入”）被用作\
  \ `ostream` 类型对象的输出运算符；`cout` 是标准输出流，而 `cerr` 是报告错误的标准流。默认情况下，写入 `cout` 的值会被转换为字符序列。例如，要输出十进制\
  \ `10`，我们可以写：\n\n```cpp\nvoid f() {\n     cout << 10;\n}\n```\n\n这在标准输出流上放置了字符 `1`\
  \ 紧接着是字符 `0`。\n\n等价地，我们可以写：\n\n```cpp\nvoid g() {\n     int x {10};\n     cout <<\
  \ x;\n}\n```\n\n不同类型的输出可以以显而易见的方式组合：\n\n点击此处查看代码图像\n\n```cpp\nvoid h(int i) {\n\
  \     cout << \"the value of i is \";\n     cout << i;\n     cout << '\\n';\n}\n\
  ```\n\n对于 `h(10)`，输出将是：\n\n```\nthe value of i is 10\n```\n\n当在输出多个相关项时，人们很快就会厌倦重复输出输出流的名称。幸运的是，输出表达式的结果本身可以用于进一步输出。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\nvoid h2(int i) {\n     cout << \"the value of i is \" <<\
  \ i << '\\n';\n}\n```\n\n这个 `h2()` 产生的输出与 `h()` 相同。\n\n字符常量是用单引号括起来的字符。注意，字符是以字符而非数值值的形式输出的。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\nvoid k() {\n     int b = 'b';     // 注意：char 隐式转换为 int\n\
  \     char c = 'c';\n     cout << 'a' << b;\n}\n```\n\n字符 `'b'` 的整数值是 `98`（在 C++\
  \ 使用的 ASCII 编码中），因此输出 `a98`。\n\n## 10.3 输入\n\n在 `<istream>` 中，标准库提供了用于输入的 `istream`。与\
  \ `ostream` 类似，`istream` 处理内置类型的字符表示，并可以很容易扩展以处理用户定义的类型。\n\n`>>` 运算符（“获取”）被用作输入运算符；`cin`\
  \ 是标准输入流。`>>` 右侧操作数的类型决定了接受什么输入以及输入操作的目标。例如：\n\n点击此处查看代码图像\n\n```cpp\nvoid f() {\n\
  \     int i;\n     cin >> i;    // 将一个整数读入 i\n     double d;\n     cin >> d;   \
  \ // 将一个双精度浮点数读入 d\n}\n```\n\n这从标准输入读取一个数字（如 `1234`）到整数 `i`，并将一个浮点数（如 `12.34e5`）读入双精度变量\
  \ `d`。\n\n像输出操作一样，输入操作也可以链式，所以我等价地写成：\n\n```cpp\nvoid f() {\n     int i;\n     double\
  \ d;\n     cin >> i >> d;     // 读入 i 和 d\n}\n```\n\n在两种情况下，整数的读取由任何非数字字符终止。默认情况下，`>>`\
  \ 会跳过初始空白字符，因此一个合适的输入序列将是\n\n```\n123412.34e5\n```\n\n通常，我们想要读取一个字符序列。这样做的一种方便方法是将其读入\
  \ `string`。例如：\n\n点击此处查看代码图像\n\n```cpp\nvoid hello() {\n     cout << \"Please enter\
  \ your name\\n\";\n     string str;\n     cin >> str;\n     cout << \"Hello, \"\
  \ << str << \"\\n\";\n}\n```\n\n如果你输入 `Eric`，响应是：\n\n```\nHello, Eric!\n```\n\n\
  默认情况下，空白字符（如空格或换行符）会终止读取，因此如果你输入 `Eric Bloodaxe` 冒充不幸的国王，响应仍然是：\n\n```\nHello, Eric!\n\
  ```\n\n你可以使用 `getline()` 函数读取整行。例如：\n\n点击此处查看代码图像\n\n```cpp\nvoid hello_line() {\n\
  \     cout << \"Please enter your name\\n\";\n     string str;\n     getline(cin,str);\n\
  \     cout << \"Hello, \" << str << \"\\n\";\n}\n```\n\n通过这个程序，输入 `Eric Bloodaxe`\
  \ 产生了预期的输出：\n\n```\nHello, Eric Bloodaxe!\n```\n\n终止行的换行符被丢弃，因此 `cin` 准备好处理输入输入。\n\
  \n使用格式化操作比逐个操作字符不易出错、更高效且代码更少。特别是 `istream` 负责内存管理和范围检查。我们可以使用 `stringstream` 在内存中进行格式化（§10.8）。\n\
  \n标准字符串具有一个很棒的属性，它们会扩展以容纳你放入的内容；你不需要预计算最大大小。所以，如果你输入几兆的分号，程序将向你回显大量的分号。\n\n### 10.4\
  \ I/O 状态\n\n`iostream` 有一个我们可以检查的状态以判断操作是否成功。最常见的用法是读取一个值序列：\n\n点击此处查看代码图像\n\n```cpp\n\
  vector<int> read_ints(istream& is) {\n     vector<int> res;\n     for (int i; is>>i;\
  \ )\n           res.push_back(i);\n     return res;\n}\n```\n\n这从 `is` 读取，直到遇到非整数的字符。该字符通常是输入的结束标志。这里发生的是操作\
  \ `is>>i` 返回了 `is` 的引用，测试 `iostream`，如果流准备好进行另一个操作，则会产生 `true`。\n\n\n\n\n\n通常情况下，I/O\
  \ 状态包含了读取或写入所需的所有信息，例如格式信息（§10.6）、错误状态（例如，是否到达输入结束端？）以及使用了何种缓冲。特别地，用户可以设置状态来反映发生了错误（§10.5），并且如果错误并不严重，可以清除该状态。例如，我们可以想象一个版本的\
  \ `read_ints()`，它能接受一个终止字符串：\n\n点击此处查看代码图像\n\n```cpp\nvector<int> read_ints(istream&\
  \ is, const string& terminator) {\n     vector<int> res;\n     for (int i; is >>\
  \ i; )\n           res.push_back(i);\n\n    if (is.eof())               // fine:\
  \ end of file\n           return res;\n\n    if (is.fail()) {            // we failed\
  \ to read an int; was it the terminator?\n            is.clear();    // reset the\
  \ state to good()\n            is.unget();    // put the non-digit back into the\
  \ stream\n            string s;\n            if (cin>>s && s==terminator)\n    \
  \              return res;\n            cin.setstate(ios_base::failbit);    // add\
  \ fail() to cin's state\n    }\n\n    return res;\n}\n\nauto v = read_ints(cin,\"\
  stop\");\n```\n\n### 10.5 自定义类型的 I/O\n\n除了内置类型和标准 `string` 的 I/O 之外，`iostream` 库允许程序员为自己的类型定义\
  \ I/O。例如，考虑一个简单的类型 `Entry`，我们可能用它表示电话簿中的条目：\n\n点击此处查看代码图像\n\n```cpp\nstruct Entry\
  \ {\n     string name;\n     int number;\n};\n```\n\n我们可以定义一个简单的输出运算符，使用 `{\"name\"\
  ,\"number\"}` 格式来写入 `Entry`，这类似于我们在代码中使用的初始化格式：\n\n点击此处查看代码图像\n\n```cpp\nostream&\
  \ operator<<(ostream& os, const Entry& e) {\n     return os << \"{\\\"\" << e.name\
  \ << \"\\\",  \" << e.number << \"}\";\n}\n```\n\n用户定义的输出运算符将其输出流（通过引用）作为第一个参数，并将其作为结果返回。\n\
  \n相应的输入运算符更为复杂，因为它必须检查格式是否正确并处理错误：\n\n点击此处查看代码图像\n\n```cpp\nistream& operator>>(istream&\
  \ is, Entry& e)\n     // read { \"name\", number } pair. Note: formatted with {\
  \ \"  \", and }\n{\n     char c, c2;\n     if (is>>c && c=='{' && is>>c2 && c2=='\"\
  ') { // start with a { \"\n  string name;  // the default value of a string is the\
  \ empty string: \"\"\n  while (is.get(c)  && c!='\"')    // anything before a \"\
  \ is part of the name\n  name+=c;\n\n  if (is>>c && c==',') {\n     int number =\
  \ 0;\n     if (is>>number>>c && c=='}') { // read the number and a }\n         \
  \  e = {name,number};      // assign to the entry\n           return is;\n     }\n\
  \  }\n  is.setstate(ios_base::failbit);      // register the failure\n  return is;\n\
  }\n```\n\n输入操作返回其 `istream` 的引用，可用于测试操作是否成功。例如，当用条件时，`is>>c` 意味着“我们成功从 `is` 中读取了一个\
  \ `char` 吗？” `is>>c` 默认跳过空白字符，但 `is.get(c)` 则不会，因此这个 `Entry` 输入运算符会忽略（跳过）名称外部的空白字符，但不会忽略内部的。例如：\n\
  \n点击此处查看代码图像\n\n```text\n{\"John Marwood Cleese\",123456}\n{\"Michael Edward Palin\"\
  ,98764}\n```\n\n我们可以像这样从输入读取这样一对值并存入 `Entry`：\n\n点击此处查看代码图像\n\n```cpp\nfor (Entry\
  \ ee; cin>>ee; )  // read from cin into ee\n      cout << ee << '\\n'; // write\
  \ ee to cout\n```\n\n输出为：\n\n点击此处查看代码图像\n\n```text\n{\"John Marwood Cleese\",123456}\n\
  {\"Michael Edward Palin\",98764}\n```\n\n更多信息请参阅 9.4。\n\n### 10.6 格式化\n\n`iostream`\
  \ 库提供了大量控制输入输出格式的操作。最简单的控制方法是*操作符*（manipulators），它们位于 `<ios>` 和 `<iomanip>` 中。例如，可以设置输出的十六进制（`hex`）、八进制（`oct`）或十进制（`dec`）格式。我们可以设置浮点数的格式：\n\
  \n点击此处查看代码图像\n\n```cpp\nconstexpr double d = 123.456;\ncout << hex << d;       \
  \   // 使用十六进制\n      << oct << d;          // 使用八进制\n      << scientific << d; \
  \    // 使用科学计数法\n      << fixed << d;         // 使用固定点\n      << defaultfloat <<\
  \ d;   // 使用默认格式\n```\n\n精度是一个整数，决定了显示浮点数的位数：\n\n- *通用*格式（`defaultfloat`）让实现选择一种最能保留值的格式。精度指定总位数。\n\
  - *科学计数法*格式（`scientific`）以小数点前一位数字和指数的形式显示值。精度指定小数点后的位数。\n- *固定点*格式（`fixed`）以整数部分、小数点和小数部分的形式显示值。精度指定小数点后的位数。\n\
  \n浮点值会被四舍五入而非直接截断，且 `precision()` 不影响整数输出。例如：\n\n点击此处查看代码图像\n\n```cpp\ncout.precision(8);\n\
  cout << 1234.56789 << '  ' << 1234.56789 << '  ' << 123456 << '\\n';\ncout.precision(4);\n\
  cout << 1234.56789 << '  ' << 1234.56789 << '  ' << 123456 << '\\n';\ncout << 1234.56789\
  \ << '\\n';\n```\n\n输出为：\n\n点击此处查看代码图像\n\n```text\n1234.5679 1234.5679 123456\n\
  1235 1235 123456\n1235\n```\n\n这些浮点数操作符是有“粘性”的；也就是说，它们的影响会持续到后续的浮点操作。\n\n### 10.7\
  \ 文件流\n\n在 `<fstream>` 中，标准库提供了与文件相关的流：\n\n- `ifstream` 用于从文件读取。\n- `ofstream` 用于写入文件。\n\
  - `fstream` 用于从文件读取和写入。\n\n例如：\n\n点击此处查看代码图像\n\n\n\n\n\n```cpp\n[](#cb299-1)ofstream\
  \ ofs {\"target\"};               // \"o\" 代表 \"output\"\n[](#cb299-2)if (!ofs)\n\
  [](#cb299-3)       error(\"couldn't open 'target' for writing\");\n```\n\n检查文件流是否已正确打开通常通过检查其状态来来实现。\n\
  \n点击此处查看代码图片\n\n```cpp\n[](#cb300-1)ifstream ifs {\"source\"};               //\
  \ \"i\" 代表 \"input\"\n[](#cb300-2)if (!ifs)\n[](#cb300-3)       error(\"couldn't\
  \ open 'source' for reading\");\n```\n\n假设测试成功，`ofs` 可以作为普通的 `ostream` 使用（就像 `cout`\
  \ 一样），而 `ifs` 可以作为普通的 `istream` 使用（就像 `cin` 一样）。\n\n文件定位以及对文件打开方式进行更详细的控制是可能的，但这超出了本书的范围。\n\
  \n关于文件名的组合和文件系统的操作，请参阅 §10.10。\n\n### 10.8 字符串流\n\n在 `<sstream>` 中，标准库提供了与 `string`\
  \ 之间输入输出的流：\n\n* `istringstream` 用于从 `string` 读取\n* `ostringstream` 用于向 `string`\
  \ 写入\n* `stringstream` 用于对 `string` 进行读取和写入。\n\n例如：\n\n点击此处查看代码图片\n\n```cpp\n[](#cb301-1)void\
  \ test()\n[](#cb301-2){\n[](#cb301-3)     ostringstream oss;\n[](#cb301-4)\n[](#cb301-5)\
  \     oss << \"{temperature,\" << scientific << 123.4567890 << \"}\";\n[](#cb301-6)\
  \     cout << oss.str() << '\\n';\n[](#cb301-7)}\n```\n\n来自 `istringstream` 的结果可以使用\
  \ `str()` 读取。`ostringstream` 的一个常见用途是在将结果字符串交给 GUI 之前进行格式化。同样，从 GUI 接收到的字符串可以通过放入\
  \ `istringstream` 中，然后使用格式化输入操作（§10.3）来读取。\n\n`stringstream` 可以用于读取和写入。例如，我们可以定义一种操作，可以将任何具有\
  \ `string` 表示形式的类型转换为另一种也可以表示为 `string` 的类型：\n\n点击此处查看代码图片\n\n```cpp\n[](#cb302-1)template<typename\
  \ Target =string, typename Source =string>\n[](#cb302-2)Target to(Source arg)  \
  \    // 将 Source 转换为 Target\n[](#cb302-3){\n[](#cb302-4)  stringstream interpreter;\n\
  [](#cb302-5)  Target result;\n[](#cb302-6)\n[](#cb302-7)  if (!(interpreter << arg)\
  \                 // 将 arg 写入流\n[](#cb302-8)      || !(interpreter >> result)  \
  \         // 从流读取 result\n[](#cb302-9)      || !(interpreter >> std::ws).eof())\
  \   // 流中还有剩余内容吗？\n[](#cb302-10)      throw runtime_error{\"to<>() failed\"};\n\
  [](#cb302-11)\n[](#cb302-12)  return result;\n[](#cb302-13)}\n```\n\n只有当函数模板参数无法被推导或没有默认值时，才需要显式提到（§7.2.4），因此我们可以写：\n\
  \n点击此处查看代码图片\n\n```cpp\n[](#cb303-1)auto x1 = to<string,double>(1.2);   // 非常显式（且冗长）\n\
  [](#cb303-2)auto x2 = to<string>(1.2);          // Source 被推导为 double\n[](#cb303-3)auto\
  \ x3 = to<>(1.2);                // Target 默认为 string；Source 被推导为 double\n[](#cb303-4)auto\
  \ x4 = to(1.2);                  // <> 是冗余的；\n[](#cb303-5)                     \
  \               // Target 默认为 string；Source 被推导为 double\n```\n\n如果所有函数模板参数都有默认值，则可以省略\
  \ `<>`。\n\n我认为这是一个通过语言特性和标准库设施结合所达到的通用性和易用性的良好范例。\n\n### 10.9 C 风格 I/O\n\nC++ 标准库也支持\
  \ C 标准库 I/O，包括 `printf()` 和 `scanf()`。从类型和安全的角度来看，该库的许多用法是不安全的，因此我不建议使用它。特别是，使用它可能会很困难。它不支持自定义类型。如果你使用\
  \ C 风格 I/O，性能会变慢。`ios_base::sync_stdio(false);` 可以与 `iostream` 兼容。\n\n### 10.10\
  \ 文件系统\n\n大多数系统都有文件概念，但它们的差异很大。为了处理这些，`<filesystem>` 提供了一个统一的接口。特别是，它可以询问 `f` 是否为普通文件。`path`\
  \ 是一个类，能够处理许多约定。考虑一个简单但不完全现实的例子：\n\n```cpp\n[](#cb306-1)int main(int argc, char*\
  \ argv[])\n[](#cb306-2){\n[](#cb306-3)     if (argc < 2) {\n[](#cb306-4)       \
  \    cerr << \"arguments expected\\n\";\n[](#cb306-5)           return 1;\n[](#cb306-6)\
  \     }\n[](#cb306-7)\n[](#cb306-8)     path p {argv[1]};   从命令行创建路径\n[](#cb306-9)\n\
  [](#cb306-10)     cout << p << \"  \" << exists(p) << '\\n';    // 注意：path 可以像字符串一样打印\n\
  [](#cb306-11)     //\n[](#cb306-12)}\n```\n\n`path` 在使用之前不会进行有效性检查。即使如此，它的有效性也取决于运行程序的系统。\n\
  \n自然地，`path` 可以用来打开文件 点击此处查看代码图片\n\n```cpp\n[](#cb307-1)void use(path p)\n[](#cb307-2){\n\
  [](#cb307-3)     ofstream f {p};\n[](#cb307-4)     if (!f) error(\"bad file name:\
  \  \", p);\n[](#cb307-5)     f << \"Hello, file!\";\n[](#cb307-6)}\n```\n\n除了 `path`\
  \ 之外，`<filesystem>` 还提供了遍历目录和查询发现的文件属性的类型：\n\n| **文件系统类型 (部分)** |\n| --- |\n| `path`\
  \ | 目录路径 |\n| `filesystem_error` | 文件系统异常 |\n| `directory_entry` | 目录条目 |\n| `directory_iterator`\
  \ | 用于遍历目录 |\n| `recursive_directory_iterator` | 用于遍历目录及其子目录 |\n\n考虑一个简单但不完全现实的例子：\n\
  \n点击此处查看代码图片\n\n\n\n\n\n```cpp\nvoid print_directory(path p)\n  try{\n       if\
  \ (is_directory(p)) {\n             cout << p << \":\\n\";\n             for (const\
  \ directory_entry& x : directory_iterator{p})\n                 cout << \"  \" <<\
  \ x.path() << '\\n';\n     }\n  }\n  catch (const filesystem_error& ex) {\n    \
  \ cerr << ex.what() << '\\n';\n  }\n```\n\n字符串可以隐式转换为 `path`，因此我们可以像这样使用 `print_directory`：\n\
  \n点击此处查看代码图像\n\n```cpp\nvoid use()\n{\n     print_directory(\".\");     // 当前目录\n\
  \     print_directory(\"..\");    // 父目录\n     print_directory(\"/\");     // Unix\
  \ 根目录\n     print_directory(\"c:\");    // Windows C 卷\n\n     for (string s; cin>>s;\
  \ )\n           print_directory(s);\n}\n```\n\n如果我想也列出子目录，我会使用 `recursive_directory_iterator{p}`。如果我想按字典顺序打印项目，我会将\
  \ `path` 拷贝到 `vector` 中并在打印之前进行排序。\n\n`path` 类提供了许多常用且实的操作：\n\n| 路径操作（部分）`p` 和 `p2`\
  \ 是 `path` 类型 |\n| --- |\n| `value_type` | 文件系统原生编码使用的字符类型：POSIX 上为 `char`，Windows\
  \ 上为 `wchar_t` |\n| `string_type` | `std::basic_string<value_type>` |\n| `const_iterator`\
  \ | 一个 `value_type` 为 `path` 的 `const` 双向迭代器 |\n| `iterator` | `const_iterator`\
  \ 的别名 |\n| `p=p2` | 将 `p2` 赋值给 `p` |\n| `p/=p2` | 使用文件名分隔符（默认认为 `/`）拼接 `p` 和 `p2`\
  \ |\n| `p+=p2` | 拼接 `p` 和 `p2`（无分隔符） |\n| `p.native()` | `p` 的原生格式 |\n| `p.string()`\
  \ | 以原生格式作为 `string` 的 `p` |\n| `p.generic_string()` | 以通用格式作为 `string` 的 `p` |\n\
  | `p.filename()` | `p` 的文件名 |\n| `p.stem()` | `p` 的主体（stem）部分 |\n| `p.extension()`\
  \ | `p` 的文件扩展名部分 |\n| `p.begin()` | `p` 元素序列的开始 |\n| `p.end()` | `p` 元素序列的结束 |\n\
  | `p==p2`, `p!=p2` | `p` 和 `p2` 的相等与不相等判断 |\n| `p<p2`, `p<=p2`, `p>p2`, `p>=p2`\
  \ | 字典序比较 |\n| `is>>p`, `os<<p` | 指向 `p` 的流 I/O |\n| `u8path(s)` | 从 UTF-8 编码源 `s`\
  \ 创建的路径 |\n\n例如：\n\n点击此处查看代码图像\n\n```cpp\nvoid test(path p)\n{\n     if (is_directory(p))\
  \ {\n           cout << p << \":\\n\";\n           for (const directory_entry& x\
  \ : directory_iterator(p)) {\n                const path& f = x;  // 目录条目的路径部分\n\
  \                if (f.extension() == \".exe\")\n                     cout << f.stem()\
  \ << \" is a Windows executable\\n\";\n                else {\n                \
  \     string n = f.extension().string();\n                     if (n == \".cpp\"\
  \ || n == \".C\" || n == \".cxx\")\n                          cout << f.stem() <<\
  \ \" is a C++ source file\\n\";\n                }\n          }\n     }\n}\n```\n\
  \n我们将 `path` 当作字符串使用（例如 `f.extension`），并且可以从 `path` 中提取各种类型的字符串（例如 `f.extension().string()`）。请注意，命名规范、自然语言和字符串编码具有很复杂性。`filesystem`\
  \ 库提供了可移植性和极大的简化。\n\n| 文件系统操作（部分）`p`, `p1`, 和 `p2` 是 `path` 类型；`e` 是 `error_code`；`b`\
  \ 是表示成功或失败的 bool |\n| --- |\n| `exists(p)` | `p` 是否指向一个存在的文件对象？ |\n| `copy(p1,p2)`\
  \ | 从 `p1` 拷贝文件或目录到 `p2`；以异常报告错误 |\n| `copy(p1,p2,e)` | 拷贝文件或目录；以代码报告错误 |\n| `b=copy_file(p1,p2)`\
  \ | 从 `p1` 拷贝文件内容到 `p2`；以异常报告错误 |\n| `b=create_directory(p)` | 创建名为 `p` 的新目录；`p`\
  \ 上的所有中间目录必须存在 |\n| `b=create_directories(p)` | 创建名为 `p` 的新目录；创建 `p` 上的所有中间目录 |\n\
  | `p=current_path()` | `p` 为当前路径 |\n| `current_path(p)` | 将 `p` 设置为当前目录 |\n| `s=file_size(p)`\
  \ | `s` 为 `p` 的字节数 |\n| `b=remove(p)` | 删除 `p`（如果其存在） |\n\n许多操作带有额外的参数，例如权限。这些超出了本书的范围，请查阅它们。像\
  \ `copy` 一样，有两个版本：\n- 以异常报告错误的 `exists(p)`。\n- 带有额外 `error_code` 参数的版本，如果操作失败则报告错误。我们使用\
  \ `error_code` 来处理那些预期的错误。\n\n\n\n\n\n- [16] 你不需要修改 `istream` 或 `ostream` 来添加新的\
  \ `<<` 和 `>>` 运算符；§10.5。\n- [17] 使用操纵符（manipulators）来控制格式；§10.6。\n- [18] `precision()`\
  \ 规范适用于所有后续的浮点输出操作；§10.6。\n- [19] 浮点格式规范（例如 `scientific`）适用于所有后续的浮点输出操作；§10.6。\n\
  - [20] 使用标准操纵符时包含 `#include <ios>`；§10.6。\n- [21] 使用带参数的标准操纵符时包含 `#include <iomanip>`；§10.6。\n\
  - [22] 不要尝试拷贝文件流。\n- [23] 在使用文件流之前，记得检查该流是否已连接到文件；§10.7。\n- [24] 使用 `stringstream`\
