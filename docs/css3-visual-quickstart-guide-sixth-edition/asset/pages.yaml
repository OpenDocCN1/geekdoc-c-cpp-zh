    \ not its margin, are clipped along with the content of the element.\n\n> TI Currently,\
    \ clips can only be rectangular.\n\n> TI Auto should restore an element to its\
    \ unclipped original state. However, Safari and Chrome will only restore the clip\
    \ to the outer edges of the border while still slipping the outline or box shadow."
