  md: '# # Alice''s Adventures In Wonderland


    # ## Chapter 1 Down the Rabbit-Hole


    Alice was beginning to get very tired of sitting by her sister on the bank, and
    of having nothing to do: once or twice she had peeped into the book her sister
    was reading, but it had no pictures or conversations in it, “and what is the use
    of a book,” thought Alice, “without pictures or conversations?”


    Next The Pool of Tears


    **B** The results of Code 3.2. Notice that although the h1 selector in the `<style>`
    tag specifies the color as orange, it does not override the inline style for the
    first h1 tag, which remains stubbornly red.


    of the document—you can easily change all the styles in a document. For example,
    rather than specifying the style of a single `<h1 id="ch01">` tag, you can specify
    the style of all the `<h1 id="ch01">` tags on the entire page, and then change
    the rule in one place to change the appearance of all level 1 headers on that
    page.


    # ### To set the style for tags in an HTML document:


    +   1. Type the opening style tag in the head of your document (Code 3.2). Define
    the type attribute as "text/css", which defines the styles that follow as CSS,
    not just any style. Also, define the media type using a value of all, which will
    apply the style sheet to the page regardless of the type of machine used to output
    it (see “Querying the Media” in Chapter 4). Then close the style tag.


    ```

    <style type="text/css"

    media="all">...</style>

    ```


    +   2. Add your CSS rules. Within the style container from Step 1, start a new
    rule by typing the selector to which you want to add styles, followed by opening
    and closing curly brackets ({}). (Basic selectors—HTML, class, IDs, and universal—are
    explained earlier in this chapter, and contextual selectors are explained in Chapter
    4.)


    ```

    h1 {...}

    ```


    Within the brackets of your rule, type the declarations to be assigned to this
    rule—formatted as property: value—using a semicolon (;) and separating individual
    declarations in the list.'
