- pgno: 345
  md: '# 3. Add more transitions as needed.


    ```

    , opacity .5s ease, transform .25s ease-in-out 0;

    ```


    You can add as many transitions as you want, separated by commas. If you are setting
    a transition for the transform value, be sure to use the browser extension version
    with the right transition browser extension, as shown here.


    The example shown in this section uses the transition shorthand, but each of these
    properties can be set separately, using the transition-property, transition-duration,
    transition-timing-function, and transition-delay properties. Of course, you will
    need to set all of these properties independently for all three browser extensions
    as well as the standard CSS version, which can lead to a lot of code. Still, using
    these properties can be useful to override a particular value.


    # A Universal Transition


    I added default transitions to the universal selector, applying these styles to
    every element on the screen. This ensures a consistent transition across my design
    and cuts down on the amount of code needed, since I apply it only once. You can
    then override the transitions, as necessary.'
  merge: -1
  img_proc: true
