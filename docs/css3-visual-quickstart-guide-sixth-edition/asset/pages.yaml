- pgno: 60
  md: '# Why You Should Never, EVER Use Inline Styles in Your Final Web Site...Mostly


    Because inline styles are the last line of styling, you cannot override them using
    embedded or external style sheets. As a result, you either are stuck with this
    style permanently or have to change it manually, which may not always be possible.
    If you are working on a large-scale Web site, the HTML code is often set independently
    of the styles, and designers may not be able to access that code or easily change
    it.


    I once spent three days trying to restyle a widget for a major Internet company,
    only to realize that the link style wouldn''t change because the developer had
    used an inline style. Because I couldn''t edit the HTML code, I was stuck. So
    don''t use them. Ever!


    Ok, there are a few exceptions:


    +   Interfaces: Often, when you are designing an interface, there are certain
    styles that if changed or removed will prevent the interface from working or appearing
    correctly. I will often use inline specific styles for that case.


    +   Testing: Inline styles can be useful for quickly testing styles. But to retain
    maximum flexibility, I recommend always placing your final styles into external
    style sheets, as discussed later in this chapter.


    +   When you have to: After you''ve been doing this stuff for a while, use your
    best judgment.


    3. Finish your HTML tag and add content. After closing the tag, add the content
    to be styled. Then close the tag pair with the corresponding end tag.


    ```

    >Alice&#8217;s Adventures In - Wonderland</hi>

    ```


    If you have conflicting styles applied to the same element, the cascade order
    determines which is applied, as explained in detail in "Determining the Cascade
    Order" in Chapter 5.


    TIP You should never use inline styles in your final Web site. See the sidebar,
    "Why You Should Never, EVER Use Inline Styles in Your Final Web Site...Mostly"
    in this chapter.


    TIP So as not to confuse the browser, it is best to use double quotation marks
    ("") around the declaration list and single quotation marks (..) around any values
    in the declaration list, such as font names with spaces.


    TIP Font names made up of more than two words are placed in single quotes ("Font
    Name") when used with a style.


    TIP When you are copying and pasting code from an application such as Microsoft
    Word into a Web-editing application such as Adobe Dreamweaver, make sure that
    you convert all smart quotes ("..") to straight quotes ("..").


    TIP A common mistake is to confuse the equals sign (=) with the colon (:). Although
    the style attribute in the tag uses an equals sign, remember that CSS declarations
    always use a colon.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# Embedded: Adding Styles to a Web Page


    To add styles that apply to a single Web page—rather than just a single element
    (inline) or an entire Web site (external)—you embed the style rules in the Web
    page using the `<style>` tag, which in turn will hold all your style rules.


    Adding styles in this manner can look identical to adding styles directly to an
    HTML tag (as seen in the previous section). However, when you place styles in
    a common location—preferably in the `<head>`.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_61_0.png)


    Code 3.2 Style rules are added within the `<style>` tag. A rule is added for the
    level 1 header to set its color, but it has no effect because the `inline` style
    overrides it. That''s why you should never use inline styles in your final code.


    ```

    <!- - HTML 5 -- >

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <title>Alice#8217;s Adventures in Wonderland</title>

    <style type="text/css" media="all">

    h1 {

    color: orange;

    font-size: 3em;

    font-weight: normal; }

    h1 .chaptertitle {

    color: yellow;

    font-size: .5em; }

    </style>

    </head>

    <body>

    <h1 style="color:red;">Alice&#8217;s Adventures In Wonderland</h1>

    <h1 id="ch01">Chapter 1 <span class="chaptertitle">Down the Rabbit-Hole</span></h1>

    <p>...strong>Alice was beginning to get very tired of sitting by her sister on
    the bank,...</p>

    ...

    </body>

    </html>

    ```'
  merge: -1
  img_proc: true
