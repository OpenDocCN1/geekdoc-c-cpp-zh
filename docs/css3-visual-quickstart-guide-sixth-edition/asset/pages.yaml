- pgno: 178
  md: '# Text Properties


    Text is everywhere and is used for everything from the ingredients in breakfast
    cereal to an ode to a Grecian urn. It is the best system that humans have ever
    devised for recording complex thoughts. Many people think of text as simply a
    way to record words, but typography adds a voice to the meaning of the words.
    Typography affects how text appears by controlling not only the shapes and sizes
    of the letters used (the font), but also the spaces between letters, words, lines,
    and paragraphs.


    Unfortunately, many of the challenges of typography on the Web have come about
    as a result of a need to circumvent the limitations of the medium. The challenge
    of Web typography is to improve screen text legibility, as well as to guide the
    viewer’s attention to important content. It’s a difficult balancing act, but this
    chapter prepares you with the right tools.


    # In This Chapter


    +   - Getting Started 158

    +   - Adjusting Text Spacing 159

    +   - Setting Text Case 164

    +   - ★ Adding a Text Drop Shadow 166

    +   - ★ Aligning Text Horizontally 171

    +   - Aligning Text Vertically 174

    +   - Indenting Paragraphs 176

    +   - Controlling White Space 177

    +   - Decorating Text 179

    +   - ★ Coming Soon! 181

    +   - Putting It All Together 182'
