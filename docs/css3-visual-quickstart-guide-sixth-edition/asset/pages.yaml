    \ a position type. For details, see “Setting the Positioning Type” earlier in\
    \ this chapter.\n\n+   2. Add the clip property to your declaration list. Type\
    \ the clip property name, followed by a colon (:), as shown in Code 11.5.\n\n\
    +   3. Specify the rectangular clipping region. Type rect to define the shape\
