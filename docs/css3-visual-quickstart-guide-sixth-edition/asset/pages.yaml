  md: '# 2. Add a keyword to tell the browser how to treat overflow from the clip.


    auto;


    Use one of the following keywords (Table 10.5 and Table 10.6):


    +   > visible forces the cropped part of the element to be displayed, essentially
    instructing the browser to ignore the cropping, pushing the content to flow outside
    of the box C.


    +   > hidden hides the overflow and prevents the scrollbars from appearing D.


    +   > scroll sets scrollbars around the visible area to allow the visitor to scroll
    through the element''s content. When you set this value, space will be reserved
    for the scrollbars, even if they are not needed E.


    +   > auto allows the browser to decide whether scrollbars need to be displayed
    F.


