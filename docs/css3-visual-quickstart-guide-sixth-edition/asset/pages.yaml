- pgno: 149
  md: 'Monospace fonts work best for text that has to be exactly (but not necessarily
    quickly) read—such as programming code—in which types can spell disaster. Although
    easier to scan, monospace fonts can become monotonous for reading large amounts
    of text. Monospace fonts often give a technical or typewritten feel to text.


    +   Cursive—Cursive fonts attempt to mimic cursive or calligraphic handwriting,
    usually in a highly stylized manner with the letters generally appearing partially
    or completely connected.


    Cursive fonts are best reserved for decoration and large headlines; they are not
    as readable in large chunks of text. Cursive fonts give an energetic and expressive
    feel to text.


    +   Fantasy—Decorative fonts that don''t fit into any of the preceding categories
    are referred to as fantasy fonts. These fonts usually are extremely ornamental
    but are still letters, so exclude dingbats or picture fonts, illustrations, or
    icons.


    Like cursive fonts, fantasy fonts are best reserved for decoration. You should
    use fantasy fonts sparingly and choose them carefully to reinforce the look and
    feel of your Web site, since each fantasy font invariably has a strong personality.'
