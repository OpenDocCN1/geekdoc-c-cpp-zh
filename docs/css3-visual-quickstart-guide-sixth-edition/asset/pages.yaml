- pgno: 161
  md: '# Using Font Squirrel to Convert Font Files


    Although you are now free to start downloading Web fonts for use in your designs,
    you still face two major hurdles:


    +   1. Legal. While you might assume that you can use a purchased font as a Web
    font, that is rarely the case. Most fonts have usage restrictions outlined in
    their End User License Agreements (EULA). If the EULA does not specifically state
    that you can use a font for @font-face linking, you can’t do so legally. To be
    sure, check with the font vendor before proceeding.


    +   2. Technical. How do you get all of those different font formats? Currently,
    even if licensed to do so, most font foundries or resellers do not provide these
    formats.


    # What to do?


    One great resource I use regularly is the Font Squirrel Web site (www.fontsquirrel.com),
    which provides an index of over 500 freely licensed, downloadable Web fonts. Each
    is complete with the font formats as well as sample CSS code


    The site also provides an insanely useful tool—the @font-face Kit Generator—that
    can convert any OTF or TTF file into EOT, SVG, and WOFF formats (www.fontsquirrel.com/fontface/generator).
    It’s easy to use and fast. Just make sure that your EULA is in order before using
    it.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_161_0.png)


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_161_1.png)


    Font Squirrel (www.fontsquirrel.com) offers over 500 free fonts that are ready
    for use in your Web site.


    Use the @font-face Kit Generator (www.fontsquirrel.com/fontface/generator) to
    convert any licensed fonts for use on the Web.'
