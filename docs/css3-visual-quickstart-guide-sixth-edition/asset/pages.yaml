    \ a CSS rule using a class selector, which can then be applied to any tag using\
    \ the class value.\n\n```\na.chaptertitle {\n    font-style: italic;\n    letter-spacing:\
    \ auto; }\n<a class=\"chaptertitle\">...</a>\n```\n\nThe general syntax of a dependent\
    \ class selector rule, which can then be applied only to tags using that HTML\
    \ selector.\n\n# Defining Reusable Classes\n\nA class selector allows you to set\
    \ up an independent style that you can apply to any HTML tag A. Unlike an HTML\
    \ selector, which automatically targets a specific tag, a class selector is given\
    \ a unique name that is then specified using the style attribute in the HTML tag\
    \ or in any tags you want to use it. However, you can also specify styles to apply\
    \ a class applied to a specific HTML tag, making it a dependent class B.\n\n#\
    \ To define a class selector:\n\n+   1. Give your class a name. Type a period\
    \ (.) and a class name you give it; then open and close your declaration block\
    \ with curly brackets ({}) (Code 3.9).\n\n```\n.chaptertitle {...}\n```\n\nCSS\
    \ classes can be defined in the head of your document within the style tags or\
    \ in an external CSS file that is imported or linked to the HTML document.\n\n\
    The class name can be anything you choose, with the following caveats:\n\n+  \
    \ > Use only letters and numbers. You can use hyphens and underscores, but not\
    \ at the beginning of the name.\n+   > The first character cannot be a number,\
    \ underscore, or hyphen.\n+   > Don't use spaces.\n\nauthor is an independent\
    \ class, so you can use it with any HTML tag you want, with one stipulation: The\
    \ properties set for the class must work with the type of tag you use it on."
