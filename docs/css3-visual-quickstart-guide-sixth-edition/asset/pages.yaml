- pgno: 180
  md: "# TABLE 6.1 Letter-Spacing Values\n\n| Value |\n| --- |\n| normal |\n| <length>\
    \ |\n\nCode 6.2 Added to text-properties.css—Space has been compressed in the\
    \ level 1 heading (the book title) to create a cramped effect A. The chapter name\
    \ has been spaced out; however, the spacing was overridden in the chapter number\
    \ (“Chapter II”), so it appears normal. I’ve also closed up the spacing after\
    \ the first letter in the first paragraph, which is being set as a drop cap.\n\
    \n```\n/*** text-properties.css ***/\nh1 {\n  letter-spacing: -.05em;\n}\nh2 {\n\
    \  letter-spacing: 2px;\n}\nh2 .chaptertitle {\n  letter-spacing: 0;\n}\nh2 +\
    \ p:first-letter {\n  letter-spacing: -.05em;\n}\n```\n\n![](img/e1ed1e3c1873fa9fc855210fb83699d0_180_0.png)\n\
    \nA Code 6.2 applied to Code 6.1: By changing its spacing, the book title takes\
    \ on a slightly more distinctive, logo-like appearance, and spacing out the chapter\
    \ title makes it stand out slightly.\n\n# # Adjusting Text Spacing\n\nCSS gives\
    \ you the ability to easily adjust text spacing, including the space between individual\
    \ letters (_tracking_), words, and lines of text in a paragraph (_leading_). Of\
    \ course, you could apply non-breaking spaces and the line break tag to get a\
    \ similar effect in straight HTML, but these “kludges” are difficult to implement,\
    \ control, and change. With CSS, you have exact control over these elements.\n\
    \n# ## Adjusting the space between letters (tracking)\n\nTracking is the amount\
    \ of space between letters in a word, which, in CSS, is controlled with the letter-spacing\
    \ property (Table 6.1). More space between letters often improves text readability.\
    \ On the other hand, too much space can hamper reading by making individual words\
    \ appear less distinct.\n\n# ## To define tracking:\n\n+   1. Add the letter-spacing\
    \ property to your CSS rule. Type `letter-spacing` in the CSS declaration list,\
    \ followed by a colon (:) (Code 6.2).\n\n+   2. Specify the amount of space between\
    \ your letters.\n\n+   - .05em;\n\nType a value for the `letter-spacing` property,\
    \ using either of the following:\n\n+   - A positive or negative length value,\
    \ such as -.05em, which sets the distance between letters. For more information,\
    \ see “Values and Units Used in This Book” in the Introduction.\n\n+   - `normal`,\
    \ which overrides inherited spacing attributes."
