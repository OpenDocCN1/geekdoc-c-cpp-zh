- pgno: 122
  md: '# Code 4.13 HTML tags can have different attributes, and you can add styles
    to an element based on its attributes.


    ```

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <title>Alice#8217;s Adventures in Wonderland<title>

    <style type="text/css" media="all">

    a [ display: block; font-size: 2em;}

    a[title] { color: red; }

    a[title="Author"] {color: orange; }

    a[title="white"] { color: yellow; }

    a[title="illustrations"] { color: green; }

    a[href~="http:/"] {color: blue; }

    a[href*="order"] { color: indigo; }

    a[href$="css3-vqs"] {color: violet; }

    </style>

    </head>

    <body class="chaptertext">

    <article About the Book:</article>

    <ul>

    <li><a href="index.html" title="Alice''s Adventures in Wonderland">Alice#8217;s
    Adventures in Wonderland</a></li>

    <li><a href="index.html">Wonderland</a></li>

    <li><a href="index.html">Alice</a></li>

    <li><a href="index.html" title="Illustrations black white">John Tenniel</a></li>

    <li><a href="index.html" title="Illustrations full-color">Arthur Rackham</a></li>

    <li><a href="http://www.jasonspeaking.com">Download Examples</a></li>

    <li><a href="http://www.jasonspeaking.com/css3-vqs/order">More Info</a></li>

    <li><a href="http://www.jasonspeaking.com/css3-vqs">Order The Book</a></li>

    </article>

    </body>

    </html>

    ```


    This will assign the styles you declare only if the tag has this attribute assigned
    to it regardless of the value.


    # 2. Set styles if a string exactly matches the property’s value.


    To set styles based on an attribute’s exact value, type the selector you want
    to style (HTML, class, or ID), a left bracket ([), the name of the attribute you
    want to check for, an equals sign (=), the value you are testing for in quotes
    (''...''), and a right bracket (]). The value is case sensitive.


    ```

    a[title=''home''] {...}

    ```


    This will assign the styles you declare only if the tag has this attribute assigned
    to it with the exact assigned value.


    # 3. Set styles if a string is in a space-separated list of values.


    To set styles based on an attribute’s value that is within a list of space-separated
    values (for example, a particular word in a sentence), type the selector you want
    to style (HTML, class, or ID), a left bracket ([), the name of the attribute you
    want to check for, a tilde (~), an equals sign (=), the value you are testing
    for in quotes (''...''), and a right bracket (]).


    ```

    a[title~="email"] {...}

    ```


    This will assign the styles you declare only if the tag has the attribute assigned
    to it with a value that contains the string as part of a space-separated list.
    Generally, this means that it is a word in a sentence. Partial words do not count.
    So in this example, testing for ''mail'' would not work.'
