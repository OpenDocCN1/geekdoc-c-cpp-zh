- pgno: 240
  md: '# # List and Table Properties


    Most of the CSS properties discussed in this book can be applied to tables and
    lists. However, CSS also includes a few unique properties specifically for tables
    and lists. The specifications of table and list properties have not changed from
    CSS2 to CSS3, although Internet Explorer has improved its implementation in the
    most recent versions.


    Although tables should never be used for page layout, as they once were, they
    are still used to lay out tabular data. Lists, on the other hand, are not only
    used to create lists (obviously), but have also become the standard way to structure
    Web site navigation.


    # ## In This Chapter


    +   - Getting Started 220

    +   - Setting the Bullet Style 223

    +   - Creating Your Own Bullets 224

    +   - Setting Bullet Positions 225

    +   - Setting Multiple List Styles 226

    +   - Setting the Table Layout 228

    +   - Setting the Space Between Table Cells 229

    +   - Collapsing Borders Between Table Cells 230

    +   - Dealing with Empty Table Cells 232

    +   - Setting the Position of a Table Caption 233

    +   - Putting It All Together 234'
