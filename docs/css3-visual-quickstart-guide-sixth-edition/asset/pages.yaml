- pgno: 124
  md: '+   6. ★Set styles if a string is the property value''s suffix. To set styles
    based on an attribute''s value being the first in a hyphen-separated list, type
    the selector you want to style (HTML, class, or ID), a left bracket ([), the name
    of the attribute you want to check for, a dollar sign ($), an equals sign (=),
    the value you are testing for in quotes (''...''), and a right bracket (]).


    ```

    a[href$=".info"]

    ```


    This will assign the styles you declare only if the value occurs at the end of
    the attribute''s value.


    +   7. Set styles if a string is anywhere in the property value. To set styles
    based on an attribute''s value being the first in a hyphen-separated list, type
    the selector you want to style (HTML, class, or ID), a left bracket ([), the name
    of the attribute you want to check for, an asterisk (*), an equals sign (=), the
    value you are testing for in quotes (''...''), and a right bracket (]).


    ```

    a[href*="speakinginstyles"]

    ```


    This will assign the styles you declare if the value occurs anywhere in the attribute''s
    value.


    Values are case sensitive. In other words, ''Alice'' and ''alice'' are two different
    values.'
