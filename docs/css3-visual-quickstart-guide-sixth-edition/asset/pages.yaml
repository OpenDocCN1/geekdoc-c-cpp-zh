  md: "+   4. Add the backface visibility property to your CSS declarations and one\
    \ value.\n\n```\n-webkit-backface-visibility:\n  visible;\n-moz-backface-visibility:\
    \ visible;\nbackface-visibility: visible;\n```\n\nAdd backface-visibility for\
    \ the special case in which two elements are placed back to back (like a playing\
    \ card) and need to be flipped together. This property will hide the back of flipped\
    \ elements using rotateZ or rotate3D (Table 12.7).\n\n+   5. Add the transform\
    \ property to your CSS declarations for the different browser extensions, including\
    \ Opera.\n\n```\n-webkit-transform:\n-moz-transform:\n-o-transform:\ntransform:\n\
    ```\n\n3D transformations use the same properties as 2D transformations; only\
    \ the values are different.\n\n+   6. Establish the perspective.\n\n```\nperspective(250px)\n\
    ```\n\nTo create a three-dimensional transformation, a three-dimensional perspective\
    \ property should be established in the element to define a depth. Values start\
    \ at 0 with lower values giving a more pronounced perspective than higher values,\
    \ thereby creating a three-dimensional foreshortening.\n\n# TABLE 12.7 Backface-Visibility\
    \ Values\n\n| Value | |\n|---|---|\n| visible | |\n| hidden | |\n\n# Do Browser\
    \ Extensions Ever Go Away?\n\nYes, browser extensions eventually go away. After\
    \ a browser implements the standard W3C syntax of a property, the browsers generally\
    \ support the extension for the next two versions of the browser, although this\
    \ is by no means a hard and fast rule. This is why—when a standard CSS syntax\
    \ has been defined—it's best to include it at the bottom of the list of browser\
    \ extension properties to ensure that it's the version that is used, if supported.\n\
    \n# TABLE 12.8 3D Transform-Style Values\n\n| Value | |\n|---|---|\n| perspective(<number>)\
    \ | |\n| rotate3d(<number>,<number>,<number>) | |\n| rotateZ(<angle>) | |\n| translate3d(<length>,<length>)\
    \ | |\n| scale3d(<number>,<number>) | |\n| scaleZ(<length>) | |\n| matrix3d(<number>,<number>)\
    \ | |"
