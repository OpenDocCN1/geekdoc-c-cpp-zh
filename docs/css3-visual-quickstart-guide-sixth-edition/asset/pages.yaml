  md: '# To define general sibling selectors:


    +   1. Set up a list of general sibling selectors. Type the selector for the first
    sibling element (HTML, class, or ID), a tilde sign (~), and then another selector
    (HTML, class, or ID) (Code 4.5).


    ```

    strong ~ em {...}

    ```


    You can repeat this as many times as necessary, but the last selector in the list
    is the one you are targeting to be styled.


    +   2. Styles are used only if the pattern is matched.


    ```

    <strong>...</strong><em>...</em></em>...<q>...</q>...</q>...<em>...</em>

    ```


    The styles are applied to any siblings that occur after the first sibling selector,
    not just the first one. Unlike the adjacent sibling, this is true even when other
    types of tags are located in between. In the case above, this includes both the
    second and third strong tags


    > TIP Although the universal selector shown in this section is used with the combinatory
    selectors, it can be used with any selector type. Table 4.2 shows how you can
    apply it.


    | Format | Elements Are Styled If... |

    | :--- | :--- |

    | a * b | b within a regardless of b''s parents |

    | a > * > b | b is the direct child of any element that is the direct child of
    a |

    | a + * + b | sibling b immediately after any element that is immediately after
    a |

    | *:hover | mouse pointer over any element |

    | *:disabled | any element that is disabled |

    | *:first-child | first child of any element |

    | *:lang(j) | any element using specified language code |

    | *:not(s) | any element that is not the using indicated selectors |

    | *:first-letter | any element''s first letter |'
