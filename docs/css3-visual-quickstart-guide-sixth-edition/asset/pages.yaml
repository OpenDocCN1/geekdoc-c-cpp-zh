  md: 'CSS rules can be defined in the head of your document within the <style> tags
    or in an external CSS file that is imported or linked to the HTML document. (See
    “Embedded: Adding Styles to a Web Page” in this chapter.)


    +   2. Add declarations for styles. Within the brackets, type the style declarations
    to be assigned to this HTML tag—formatted as property: value—using a semicolon
    (;) and separating individual declarations in the list. You can also add one or
    more line breaks, spaces, or tabs after a declaration without interfering with
    the code to make it more readable.


    ```

    color: red;

    ```


    Add as many declarations as you want, separated by semicolons:


    ```

    font-size: 3em; font-weight: normal;

    ```


    TIP Be sure that the properties will work with the HTML tag in question. For example,
    you cannot use the text-indent property (which works only on block elements) to
    define the bold tag (which is an inline element). See Appendix A to verify the
    properties that can be assigned to specific selectors.


    TIP Redefining a tag does not implicitly override that tag’s preexisting properties.
    Thus, the <strong> tag still makes text bold unless you explicitly tell it not
    to with font-weight: normal.


    TIP Although the body tag can also be redefined, it acts like a block-level tag.
    (See “Types of HTML Elements” in Chapter 2.) Any inherited properties will affect
    everything on the page. You can actually use this to your advantage to set default
    page styles, as explained in Chapter 4, “Inheriting Properties from Parents.”'
