- pgno: 431
  md: 'The following tables include all of the CSS properties included in this book.
    However, to make it easier to scan for just those properties that will work, symbols
    indicate if a value is available for use (or not) by a particular browser:


    +   - Available—Supported in all versions of the browser in common usage.

    +   - Recently available—Supported, but only in recent versions of the browser.
    Versions of the browser may still be in common use that do not support this value.

    +   - Not available—Not currently supported in any version of this browser.


    # Browsers legend


    +   IE Internet Explorer

    +   FF Firefox

    +   S Safari

    +   C Chrome

    +   O Opera


    # Table value legend


    Applies to All—Property can be applied to any HTML tag.

    Applies to Block—Property can be applied only to block-level tags.

    Applies to Inline—Property can be applied only to inline tags.

    Applies to list—Property can be applied only when the element is intrinsically
    a list element or has had the list display value applied to it.

    Applies to positioned—Property can be applied only when the element has a positioning
    value specified.

    Applies to table—Property can be applied only when the element is intrinsically
    a table element or has had the table display value applied to it.

    Inherited—Yes—Styles are also applied to descendent elements.

    Inherited—No—Styles are not applied to descendent elements.

    Default Value:value—Values in bold are the default values for that property.


