- pgno: 259
  md: "# # Changing the Mouse Pointer Appearance\n\nNormally, the browser determines\
    \ the appearance of the mouse pointer according to the content currently under\
    \ it. If the pointer is over text, for example, the pointer becomes a text selector.\
    \ Or, if the browser is working and the visitor can't do anything, the pointer\
    \ becomes a timer, indicating that the visitor needs to wait.\n\nSometimes, it's\
    \ useful to override the browser's behavior and set the appearance of the pointer\
    \ yourself using the cursor property (Table 9.1). This can be applied to any element\
    \ on the screen, not just links. Also, you do not have to associate it with the\
    \ dynamic hover state for it to work; just apply it directly to the element's\
    \ CSS rule.\n\n# ## To set the mouse pointer's appearance:\n\n+   1. Add the cursor\
    \ property to your CSS declarations. Type cursor in the CSS declaration block,\
    \ followed by a colon (:) (Code 9.2).\n\n```\ncursor:\n```\n\n+   2. Specify the\
    \ mouse pointer. Type one of the mouse pointer names listed in Table 9.2 to specify\
    \ the pointer's appearance.\n\n+   crosshair;\n\nAlternatively, type one of these\
    \ values for cursor:\n\n+   > auto to have the browser choose which mouse pointer\
    \ to use.\n\n+   > none to hide the pointer altogether.\n\n| Value |\n| :--- |\n\
    | <cursor type name> |\n| <URL> |\n| auto |\n| none |\n\nCode 9.2 Added to ui-generatedcontent-properties.css\
    \ -- set up different pointer types that depend on the type of object or link\
    \ over which the pointer is hovering.\n\n```\n/*** ui-generatedcontent-properties.css\
    \ ***/\nh1 {\n    cursor: crosshair;\n}\nfooter a {\n    cursor: url('.../images/chrome/\n\
    \    > cursor-02.png') 20 20, help;\n}\n```\n\n![](img/e1ed1e3c1873fa9fc855210fb83699d0_259_0.png)\n\
    \nCode 9.2 applied to Code 9.1: the pointer turns into the Cheshire Cat's head\
    \ when over the book title."
  merge: -1
  img_proc: true
- pgno: 260
  md: '| Name | Appearance (varies depending on OS) |

    | :--- | :--- |

    | crosshair | + |

    | e-resize | → |

    | help | ? |

    | move | ⇅ |

    | ne-resize | ↗ |

    | n-resize | ↑ |

    | nw-resize | ↖ |

    | pointer | ☞ |

    | progress | ⌛ |

    | se-resize | ↘ |

    | s-resize | ↓ |

    | sw-resize | ↙ |

    | text | I |

    | wait | ⌛ |

    | w-resize | ← |


    3. Add a graphic mouse pointer. You can also create your own pointer by adding
    the URL reference to an image file (generally in PNG format) to use as a custom
    cursor. You can specify the complete Web address or the local filename of the
    image.


    ```

    cursor: url(../images/chrome/cursor-02.png) 20 20, crosshair;

    ```


    ★ Hotspot: CSS3 adds the ability to define the pointer''s hotspot (the point at
    which the active click will happen) as determined from the upper-left corner of
    the image. Always include a backup pointer type.


    Firefox, Safari, Opera, and Chrome allow you to use CUR, ANI, GIF, PNG, or JPEG
    images as a custom pointer by specifying the URL for the image file. Unfortunately,
    Internet Explorer supports only CUR and ANI file formats for custom pointers.


    > TIP CUR and ANI are not standard image formats and can only be created using
    specialized software.


    > TIP Remember that the exact appearance of the pointer depends on the operating
    system and the Web browser in use.


    > TIP Although it''s fun to play around with switching the mouse pointers, I''ve
    tested this feature on my own Web site and have received several emails asking
    me to cut it out. Most Web users have learned to recognize the common functions
    of specific pointers and when they should appear. Breaking these conventions tends
    to confuse users.'
  merge: -1
