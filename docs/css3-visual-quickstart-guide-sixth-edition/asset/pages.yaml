- pgno: 387
  md: '# # Adapting to the Environment


    Break points can most easily be thought of as small, medium, and large screen
    sizes. At first, you may want to create entirely different style sheets for each
    break point style sheet and apply them separately. However, the fact is that most
    styles will be the same between the style sheets, so the simplest thing to do
    is put the common styles in small, and then use the medium and large style sheets
    to override those styles needed to scale the design up.


    However, between those break points, different devices have different dimensions,
    so your styles should use relative lengths to ensure that they stretch to accommodate
    A. This is referred to as adaptive design.


    +   - small.css (Code 14.8): Applied to all devices. Contains all of the general
    styles to be applied to the design with layout for small devices B.


    +   - medium.css (Code 14.9): Applied to tablets and computer screens. Contains
    override styles used to scale the design up for medium screen sizes C.


    continues on page 368


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_387_0.png)


    A 0–739 pixels is the small range. 740–979 pixels is medium range. 980 and above
    is large.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_387_1.png)


    B Small. Code 14.8 applied to Code 14.12.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_387_2.png)


    C Medium. Code 14.9 applied to Code 14.12.'
