- pgno: 38
  md: '# HTML5 Primer


    HTML is the coding language used to mark content types on the page and add structure
    using tags. Over the past 20 years or so, the language has changed—some tags were
    added, some removed, and some stayed exactly the same. HTML5 is the most recent
    version, adding tags to improve the ability to structure pages semantically, insert
    audio and video clips, and create more meaningful forms. Although mostly supported
    by all major Web browsers, there are still plenty of older browsers out there
    that do not support HTML5 at all. Fortunately, you can do something about that.
    First, let''s take a look at what markup languages are and how HTML5 fits into
    the new world order.


    # In This Chapter


    +   - What is HTML? 18

    +   - Types of HTML Elements 21

    +   - The Evolution of HTML5 24

    +   - What''s New in HTML5? 27

    +   - How Does HTML5 Structure Work? 28

    +   - Using HTML5 Structure Now 29'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# # What Is HTML?


    The HyperText Markup Language is a system of code tags that define elements on
    the page, which create the structure of a document for use on the Web. For example,
    you take a block of text and add HTML tags, as follows:


    ```

    `<h1>Alice''s Adventures in <wonderland</h1>`

    ```


    Here, you''ve used the <h1> tag to create a header element, which is the most
    important header for the page: the level 1 header. Different tags are used to
    tag different kinds of content, and tags can be placed within other tags. For
    example:


    ```

    `<p>I wonder if I shall fall right <em>through</em> the earth!</p>`

    ```


    These tags tell the browser that the text is a paragraph, and the word "through"
    should be presented with emphasis, probably by displaying it in italics.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_39_0.png)


    [A] Plain text without any markup.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_39_1.png)


    [B] The same text content with HTML tags applied.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# # What Is a Markup Language?


    HTML is used to mark up the structure of Web pages, but other markup languages
    are used by computers on the Web and beyond.


    The Standard Generalized Markup Language (SGML) is the grandfather of most markup
    languages used for print and the Internet. SGML is the international standard
    used to define the structures and appearance of documents. Multiple SGMLs have
    been created for a variety of document types and for various specialties—such
    as physics, accounting, and chemistry. HTML and XHTML are the Web’s primary version
    of SGML.


    # # Basic HTML document structure


    All HTML documents have similar basic structure, which includes the following
    elements:


    +   - Doctype (<!DOCTYPE>) sets the type of markup language the document is using
    (Table 2.4). This is important to include so that the browser can quickly and
    accurately interpret the HTML code.


    +   - Head (<head>) includes information about the page, such as the title and
    meta tags. You should also place links to external CSS and JavaScript files in
    this area. The head should not be confused with a page header. Nothing in the
    head of the page will be directly displayed in the Web page.


    +   - Body (<body>) contains the elements you actually see in the Web browser
    page, such as navigation, headers, paragraphs, lists, tables, images, and much
    more.


    # # HTML properties


    HTML elements can be modified by placing HTML properties within the tag. Some
    properties are optional, some affect the performance of the element, and some
    are needed for an element to work properly. For example, the anchor tag (<a>)
    uses the href property to define where a link is pointing:


    ```

    `<a href="http://www.jasonspeaking.com">Jason</a>`

    ```'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'Properties are also used to connect an HTML element to styles using the style,
    class, or id properties:

    `<p style="color: red;">Alice</a>`

    `<p class="hilight char names">Alice </a>`

    `<p id="name01">Alice</a>`


    Every tag has one or more properties that can be applied to them. These become
    especially important when we start using CSS to style tags based on property values,
    as explained in Chapter 4.


    # Browser inherited styles


    Most HTML tags have browser inherited styles associated with them. These default
    styles are actually defined by the Web browser developer. Because the browser
    developer has added them, you need to remember that they are there and will affect
    your design. For example, the <em> tag will italicize text on most browsers. No
    cosmic constant dictates that emphasized text is italicized; it''s just that the
    guys and gals programming the browser software decided to do it that way. The
    good news is that you can use CSS to override the default browser styles.


    For the most part, default styles are consistent from browser to browser, although
    some noticeable differences exist, especially with margins and font size. Many
    designers will start "from scratch" by resetting as many of the defaults as possible
    using a CSS reset (see Chapter 14).


    # What is SVG?


    The Scalable Vector Graphics (SVG) format is a method for creating vector graphics
    on the Web (see www.w3.org/graphics/svg/). Like Flash, instead of plotting each
    point in a graphic, SVG data describes two points and then plots the path between
    them as a straight line or curve.


    Although it still lags behind Flash in acceptance, SVG is natively supported in
    Firefox, Safari, Chrome, and Internet Explorer as of version 9. (Adobe does provide
    an IE plug-in at www.adobe.com/svg/)


    Unlike Flash, which uses an editor to create files and hides much of its graphics
    code, SVG is a markup language that can be freely read.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# # Types of HTML Elements


