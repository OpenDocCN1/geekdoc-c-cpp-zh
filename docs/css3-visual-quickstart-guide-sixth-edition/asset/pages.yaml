    The general syntax for CSS comments.


    # Adding Comments to CSS


    Comments allow you to add important notes to your code, as a reminder to yourself
    or others. A comment does not affect code; comments only add notes or give guidance
    to those viewing your code. You can include comments in <style> tags or in an
    external CSS file.


    # To include comments in a style sheet:


    +   1. Add an opening comment mark. To open a comment area in a style sheet (Code
    3.13), type a slash (/) and an asterisk (*).

    +   /*


    +   2. Type your comments. You can use any letters, numbers, symbols, or even
    line breaks by pressing the Return or Enter key.

    +   Styles for Alice''s Adventure in Wonderland


    +   3. Add a closing comment mark. Close your comment by typing an asterisk (*)
    and a slash (/).

    +   */


    > TIP Within the slash asterisk, you can add whatever text you want.


    > TIP You cannot nest comments.


    > TIP Comments are a great way to organize your code, allowing you to add “headers”
    that separate different parts of the code.


    > TIP I recommend placing constant values—like color values—at the top of your
    CSS code in comments for quick reference.'
