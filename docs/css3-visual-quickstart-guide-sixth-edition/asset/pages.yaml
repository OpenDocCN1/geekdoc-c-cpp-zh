  md: '# Getting Started


    I''ll be styling Code 8.1 in this chapter. It imports the final CSS from Chapters
    5, 6, and 7 as well as a new file, list-table-properties.css, that you will build
    in this chapter. It includes the table of contents from Alice''s Adventures in
    Wonderland and a list for the colophon and credits. Initially, the page will have
    standard bullets and an unformatted table. We are going to add a few styles to
    control the table width, padding, margins, borders, vertical alignment, and font
    and text styles (Code 8.1B). Otherwise, the table would not look nearly as nice.


    # Code 8.1 The HTML5 code used for examples in this chapter.


    ```

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="utf-8">

    <title>Alice&#8217;s Adventures In Wonderland | Chapter IV</title>

    <link href=".../css/font-properties.css" type="text/css" rel="stylesheet" media="all">

    <link href=".../css/text-properties.css" type="text/css" rel="stylesheet" media="all">

