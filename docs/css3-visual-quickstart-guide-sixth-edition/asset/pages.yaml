- pgno: 69
  md: "# Importing a style sheet\n\nAnother way to bring external style sheets into\
    \ a document is to use the @import rule.\n\nD The advantage of importing is that\
    \ it can be used not only to put an external CSS file in an HTML document file,\
    \ but also to import one external CSS file into another.\n\n# To import an external\
    \ CSS file:\n\n+   1. Within the head of your HTML document, add a style element\
    \ (Code 3.7). This is the same as discussed earlier in this chapter.\n\n```\n\
    <style type=\"text/css\"\n media=\"all\">...</style>\n```\n\n+   2. Add your @import\
    \ rule. In the <style> tag, before any other CSS code you want to include, type\
    \ @import(), and between the parentheses include the URL of the CSS document to\
    \ be imported. The URL can be global, in which case it would start with http://,\
    \ or it could be a local path pointing to another file in the same domain.\n\n\
    ```\n@import url(global.css);\n```\n\nYou can include as many imports as you want,\
    \ but all of them must be placed before any embedded CSS code in that <style>\
    \ tag.\n\nYou can also place @import directly into another external style sheet.\
    \ This will import the CSS code from one style sheet to the other so that when\
    \ the second style sheet is linked or imported into an HTML file, the styles from\
    \ the first style sheet are also included.\n\n# @import url(filename.css);\n\n\
    P The general syntax for the @import rule.\n\n![](img/e1ed1e3c1873fa9fc855210fb83699d0_69_0.png)\n\
    \nE The results of Code 3.7. The page with all of the default and Chapter 12 specific\
    \ styles applied."
  merge: -1
  img_proc: true
- pgno: 70
  md: "3. Add the rest of your embedded CSS. You can include additional embedded CSS\
    \ rules here, if necessary. (See “Embedded: Adding Styles to a Web Page” in this\
    \ chapter.)\n\nTIP Using the @import in external style sheets is now widely discouraged\
    \ due to the way in which browsers process them. In order to work, the browser\
    \ has to stop rendering other style sheets until it finishes with a @import style\
    \ sheets, slowing the site and preventing other important styles from appearing.\n\
    \n# Code 3.7 ch12.html—Imports the external style sheet ch12.css (Code 3.5) and\
