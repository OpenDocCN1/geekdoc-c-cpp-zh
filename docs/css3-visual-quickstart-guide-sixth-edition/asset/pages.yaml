    # Chapter IX The Mock Turtle''s Story


    YOU can''t think how glad I am to see you again, you dear old thing!" said the
    Duchess; "and she tucked her head affectionately into Alice''s shoulder. And they
    walked off together."


    Alice was so much pleased to find her in such a pleasant temper, and thought to
    herself that perhaps it was only the pepper that had made her so savage when they
    met in the kitchen.


    ...That''s enough about lessons," the Gryphon interrupted in a very decided tone:
    "tell her something about the games now."


    The Gryphon sat up and rubbed its eyes: "It''s all over now, my dear," said the
    Mock Turtle in a tone of great relief. "Now at last we can begin."


    "Begin what?" said Alice.


    "Why, the games, of course," said the Gryphon.


    "But we haven''t had any lessons yet," said Alice.


    "Lessons! Lessons!" cried the Gryphon in a tone of great disgust. "Who wants lessons?
    We want games!"


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_350_0.png)


    The Web page (Code 13.1) without any styles applied to it. The content is all
    stacked vertically.'
