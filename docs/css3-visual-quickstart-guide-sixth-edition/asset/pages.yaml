- pgno: 44
  md: 'Not all CSS definitions can be applied to all HTML elements. Whether a particular
    CSS property can be applied (or not) depends on the nature of the element. For
    the most part, it''s fairly obvious when a property can be applied.


    For example, you wouldn''t expect the text-indent property, which indents the
    first line of a paragraph, to apply to an inline tag such as <strong>. In fact,
    it can''t be applied, unless you use CSS to change the display type.


    When you do need help in this area, see Appendix A to determine the CSS properties
    that can be applied to specific HTML elements.'
