    +   2. Add the background repeat property and specify how the background should
    be tiled (or not). Type background-repeat, followed by a colon (:)


    ```

    background-repeat: repeat;

    ```


    Then define how you want your background to repeat by typing one of the following
    options (Table 7.8):


    +   > repeat instructs the browser to tile the graphic throughout the background
    of the element horizontally and vertically. This is the default value if the property
    is omitted.

    +   > repeat-x instructs the browser to tile the background graphic horizontally
    only, so that the graphic repeats in one straight horizontal line along the top
    of the element.

    +   > repeat-y instructs the browser to tile the background graphic vertically
    only, so that the graphic repeats in one straight vertical line along the left
    side of the element.

    +   > no-repeat causes the background graphic to appear only once (and not tile).

    +   > round resizes the image so that it repeats without clipping.

    +   > space spaces the image to fill the area so that it is not clipped.'
