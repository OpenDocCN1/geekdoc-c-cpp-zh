  md: "```\nh1 {\n  color: red; !important\n}\n```\n\nCode 4.20 The !important value\
    \ has been added to the color property in the first h2, but not in the second\
    \ h2. Typically, the second h2 would override the first, but not in this case.\n\
    \n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n\
    <title>Alice&8217;s Adventures in Wonderland</title>\n<style type=\"text/css\"\
    \ media=\"all\">\nh2 {\n  color: green !important;\n  font-size: 3em;\n }\nh2\
    \ {\n  color: red;\n  font-size: 2em;\n }\n</style>\n</head>\n<body class=\"chaptertext\"\
    >\n<article>\n<h2> Chapter I </h2>\n<span class=\"chaptertitle\">Down the Rabbit-Hole</span>\n\
    </h2>\n<p>Alice was beginning to get very tired of sitting by her sister on the\
    \ bank, and of having nothing to do: once or twice she had peeped into the book\
    \ her sister was reading, but it had no pictures or conversations in it, «and\
    \ what is the use of a book,»<q>thought Alice, «pictures or conversations?»</q></p>\n\
    </article>\n</body>\n</html>\n```\n\n# Making a Declaration !important\n\nYou\
    \ can add the !important declaration to a property-value declaration to give it\
    \ the maximum weight when determining the cascade order. Doing so ensures that\
    \ a declaration is applied regardless of the other rules in play. (See “Determining\
    \ the Cascade Order” in this chapter.)\n\n# To force use of a declaration:\n\n\
    +   1. Add your CSS rule (Code 4.20).\n+   h2 { ... }\n\nYou can use an HTML,\
    \ class, or ID selector. CSS rules can be defined within the <style> tags in the\
    \ head of your document (see “Embedded: Adding Styles to a Web Page” in Chapter\
    \ 3) or in an external CSS file that is then imported or linked to the HTML document\
    \ (see “External: Adding Styles to a Web Site” in Chapter 3).\n\n+   2. Make it\
    \ important. Type a style declaration, a space, !important, and a semicolon (;)\
    \ to close the declaration.\n+   color: green !important;\n\ncontinues on next\
    \ page\n\n![](img/e1ed1e3c1873fa9fc855210fb83699d0_138_0.png)\n\nThe result of\
    \ Code 4.20. The style that is most important wins the day, so the text is green\
    \ rather than red, despite the fact that the red declaration comes later in the\
    \ cascade."
