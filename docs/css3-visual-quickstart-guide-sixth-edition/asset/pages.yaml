  md: "# # Adding a Text Drop Shadow\n\nThe drop shadow is a time-honored method for\
    \ adding depth and texture to two-dimensional designs. Most browsers support the\
    \ `text-shadow` property, part of CSS3 (Table 6.5), which allows you to define\
    \ the color, offset (x and y), spread, and blur for any text drop shadow. Although\
    \ this property will not currently work in other browsers, neither will it interfere\
    \ with them.\n\n# ## To define the text shadow:\n\n+   1. Add the text-shadow\
    \ property to your CSS rule. Type text-shadow in the CSS declaration list, followed\
    \ by a colon (:) (Code 6.6).\n+      `text-shadow:`\n+   \n+   2. Specify the\
    \ x, y offset. Type a space followed by two positive or negative length values\
    \ separated by a space.\n+      `2px 3px`\n+   \n+      The first value is the\
    \ vertical distance to offset the shadow (positive is down; negative is up). The\
    \ second value is the horizontal offset (positive is right; negative is left).\n\
    +   \n+   3. Specify the amount of blur. Type a space and then a positive length\
    \ value for the amount of blur to apply to the shadow. All negative values will\
    \ be treated as 0.\n+      `5px`\n\n# TABLE 6.5 Text-Shadow Values\n\n| Value\
    \ | | | | | |\n|---|---|---|---|---|---|\n| `<color>` | ● | ● | ● | ● | ● |\n\
    | `<x-offset>` | ● | ● | ● | ● | ● |\n| `<y-offset>` | ● | ● | ● | ● | ● |\n|\
    \ `<blur>` | ● | ● | ● | ● | ● |\n| `none` | ● | ● | ● | ● | ● |\n\nCode 6.6.\
    \ Added to text-properties.css—The `text-shadow` property allows you to set the\
    \ x,y offset and the blur radius.\n\n```\n/*** text-properties.css ***/\nh1 {\n\
    \ text-shadow: 2px 3px 5px\n -rgba(0,0,0,.75); }\narticle h2 {\n text-shadow:\
    \ 0px 1px 1px\n -rgba(255,255,255,.6), 0px -1px 1px\n -rgba(0,0,0,.6); }\nh2 +\
    \ p:first-letter {\n text-shadow: -3px -3px 6px\n -rgba(153,0,0,.9), 2px 3px 5px\n\
    \ -rgba(0,0,0,.5); }\n```"
