    # # Dingbats


    Although it does not have an official CSS designation, there is another important
    category of fonts to consider. Dingbats, also called symbol or picture fonts,
    do not represent numbers or letters, but are instead a collection of icons or
    pictograms each corresponding to a letter on the keyboard. The most common example
    of this font type is Webdings, which is installed on most computers. Webdings
    is a collection of common international symbols. Although other dingbat fonts
    are not commonly installed on most computers, if you use dingbats as Web fonts,
    as described later in this chapter, you can be relatively sure that you will get
    what you want, replacing some graphic icons with dingbat icons.


    # ## Encoding HTML character entities


    An alternative to dingbat fonts are HTML character entities. These are a collection
    of specialized glyphs that, instead of being represented by a single letter, are
    represented by code that begins with an ampersand (&) and ends with a semicolon
    (;). For example, the ampersand is represented in the code as:


    &amp;


    For many characters (such as the ampersand, this is the only way to display them
    consistently across browsers and operating systems. For a full list of HTML and
    Unicode character values, see Appendix B.'
