- pgno: 282
  md: '# # Setting How Text Overflows


    Although being able to set box overflow is useful, often the text that is overflowing
    is rudely clipped in the middle of a word or even a letter.


    In typography, though, incomplete text is indicated using an ellipsis (..).


    The text-overflow property controls how text is displayed where the available
    space cannot display all of the content, generally because the width and height
    have been set with overflow hidden 6


    In this case, use one of the following values (Table 10.7):


    +   - clip will truncate the text wherever the space for the display area is exceeded.
    This can mean that text is clipped in a word or even in part of a letter.


    +   - ellipsis will add the ellipsis as the last character, shortening the text
    so that it can be completely displayed. This may come at the end of a word or
    within a word, but will not clip a letter.


    Opera and Internet Explorer currently use browser extensions. Safari used a browser
    extension until version 5.1.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_282_0.png)


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_282_1.png)


    6 Clip or ellipsis are used to control how text is treated in overflow mode.


    | Value | Icons |

    |---|---|

    | clip | ... |

    | ellipsis | ... |

    | inherit | ... |


    > > TIP Generally, auto is preferred for overflow because it will show the scrollbars
    only as needed and hide the scrollbar chrome when there is nothing to scroll.


    > > TIP The overflow property is also used to define how clipping overflow is
    treated.


    > > TIP Although not commonly used, I recommend implementing the ellipsis property
    for all text. This insures that if for some reason it is cut off, at least it
    will not look unattractive.'
  merge: -1
  img_proc: true
- pgno: 283
  md: '# # Floating Elements in the Window


    In addition to precisely positioning elements within the document, CSS also allows
    you to set how an element interacts with other elements by floating it.


    Using the CSS float property, you flow text around content or float block elements
    next to each other to create columns.


    # ## To float an element:


    +   1. Start your definition by typing the float property name, followed by a
    colon (:) (Code 10.5).


    ```

    float:

    ```


    Code 10.5 Added to box-properties.css—When applied to Code 10.1, the float properties
    will cause the text to wrap around the figure ④. Additionally, this code will
    cause the first letter in the first paragraph of an article to become a true drop
    cap ⑤.


    ```

    /* box-properties.css ***/

    article {

    float: left; }

    article h2 + p:first-letter {

    float: left;

    .floatleft {

    float: left; }

    .floatright {

    float: right; }

    ```


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_283_0.png)


    A Code 10.5 applied to Code 10.1: The figure now floats with the text around it.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_283_1.png)


    B Code 10.5 applied to Code 10.1: The drop cap.'
  merge: -1
  img_proc: true
