- pgno: 181
  md: '+   TIP Tracking should not be confused with kerning. Although both can add
    space between letters to improve legibility, they work in different ways. See
    the sidebar “Tracking or Kerning?”


    +   TIP Generally, setting letter spacing in ems is preferred because it spaces
    the letters based on font size. When the text size is changed, the letter spacing
    automatically adjusts with it.


    +   TIP A positive value for letter-spacing adds space between letters; a negative
    value closes the space. A value of 0 does not add or subtract space but prevents
    justification of the text. (See “Aligning Text Horizontally” in this chapter.)


    # Tracking or Kerning?


    Whereas tracking refers to the spacing between letters in a word, kerning refers
    to the spacing between individual letter pairs in a proportional font. Is this
    splitting hairs? There actually is a distinction.


    Tracking is applied to a word to equally space all the letters; kerning is applied
    between each letter to give each space the same visual appearance. However, using
    tracking may mean that some letters are spaced farther apart than others if it
    improves the readability. Although you could use CSS letter spacing to manually
    set the space between each letter, I do not recommend it. True text kerning is
    generally done using specialized layout software because it’s very hard to do
    just by “eyeballing” the letters.


    Although not yet ready for use, the W3C has started work on kerning properties
    for CSS3.'
