  md: '# # Choosing Color Values


    You can define colors in a variety of ways in CSS. Several methods simply represent
    how the primary colors—red, green, and blue—should be mixed, but that is by no
    means the only way colors are defined in CSS (Table 7.1).


    # ## Color keywords


    You have access to many predefined color values derived from lists defined in
    the HTML4 and SVG specifications. Table 7.2 shows the list of keywords along with
    the equivalent hex and decimal values.


    TABLE 7.1 Color Values


    | Name | Form | Example |

    |---|---|---|

    | Keyword | <keyword> | coral |

    | Transparent | transparent | transparent |

    | Current color | currentcolor | currentcolor |

    | RGB hex | #rrggbb, #rgb | #ff7f50, #f90 |

    | RGB decimal | rgb(rrr,ggg,bbb) | rgb(255,127,80) |

    | RGB percentage | rgb(rrr%,ggg%,bbb%) | rgb(100%, 50%,31%) |

    | RGBA | rgba(rrr,ggg,bbb,d) | rgba(255,127,80,.86) |

    | HSL | hsl(hhh,sss%,lll%) | hsl(16,65%,100%) |

    | HSLA | hsla(hhh,sss%,lll%,d) | hsla(16,65%,100%, 23) |'
