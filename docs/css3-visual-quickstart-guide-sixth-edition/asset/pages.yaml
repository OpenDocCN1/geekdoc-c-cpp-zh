    # # Chapter I Down the Rabbit-Hole


    Alice was beginning to get very tired of sitting by her sister on the bank, and
    of having nothing to do: once or twice she had peeped into the book her sister
    was reading, but it had no pictures or conversations in it, “and what is the use
    of a book,” thought Alice, “without pictures or conversations?”


    So she was considering in her own mind (as well as she could, for the hot day
    made her feel very sleepy and stupid) whether the pleasure of making a daisy-chain
    would be worth the trouble of getting up and picking the daisies, when suddenly
    a White Rabbit with pink eyes ran close by her.


    There was nothing so very remarkable in that; nor did Alice think it so very much
    out of the way to hear the Rabbit say to itself, “Oh dear! Oh dear! I shall be
    too late!” (when she thought it over afterwards, it occurred to her that she ought
    to have wondered at this, but at the time it all seemed quite natural); but when
    the Rabbit actually took a watch out of its waistcoat-pocket, and looked at it,
    and then hurried on, Alice started to her feet, for it flashed across her mind
    that she had


    The header now has a bit of flourish added before and after by the CSS. These
    images take up space as if they were in an image tag, but do not show up in the
    HTML code.


    +   3. Add content after the element. Type the selector (HTML, class, or ID) you
    want to add content after, a colon (:), and then the keyword *after*.


    ```

    h2:after { content:... }

    ```


    Next, declare the **content** property and define what generated content goes
    after the element and how it should be styled.


    The pseudo-element syntax in CSS3 has undergone a slight change from the CSS2
    syntax (which is rare). Pseudo-elements now have a double colon to distinguish
    them from pseudo-classes. Existing pseudo-elements can use either single or double
    colons. New and future pseudo-elements should use double colons, but will work
    with a single colon.


    **TIP** Since IE8 does not support double colon syntax for CSS2 pseudo-elements,
    it’s a good idea to use single colon syntax for older pseudo-elements until all
    browsers have adopted the syntax. Double colon will not work in IE8 anyway.


    **TIP** Be careful when using *before* and *after* to add content to your page.
    This content will not appear to search engines or screen readers, so do not rely
    on it for anything vital.'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# Defining Styles Based on Tag Attributes


    Although style attributes should all be handled by CSS, many HTML tags still have
    attributes that define how they behave. For example, the image tag, `img`, always
    includes the `src` attribute to define the source for the image file to be loaded.


    Styles can be assigned to an HTML element based on an attribute or an attribute
    value, allowing you to set styles if the attribute has been set, or is not a specific
    value, or contains a specific value (Table 4.6).


    # To set styles based on an element''s attributes:


    +   1. Set styles if the element has a specific property. To set styles based
    on the existence of an attribute, type the selector you want to style (HTML, class,
    or ID), a left bracket ([), the name of the attribute you want to check for, and
    a right bracket (]) (Code 4.13) A `a[title] {...}`


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_121_0.png)


    The general syntax of an attribute selector.


    # About The Book:


    +   * Alice''s Adventures in Wonderland

    +   * Lewis Carroll

    +   * John Tenniel

    +   * Arthur Rackham

    +   * Download Examples

    +   * More Info

    +   * Order The Book


    The results of Code 4.13. This shows how styles are applied to elements based
    on their properties.


    | Format | Name | Elements Are Styled If That Element: |

    |---|---|---|

    | [attr] | Attribute | has specified attribute |

    | [attr="value"] | Exact value | has specified attribute equal to exact value
    |

    | [attr~="value"] | Spaced list | has specified attribute equal to exact value
    within space-separated list |

    | [attr|="value"] | Hyphenated list | has specified attribute equal to exact value
    within hyphen-separated list |

    | [attr^="value"] | Begins with | has specified attribute equal to exact value
    at beginning |

    | [attr$="value"] | Ends with | has specified attribute equal to exact value at
    end |

    | [attr*="value"] | Contains | has specified attribute equal to exact value anywhere
    |'
