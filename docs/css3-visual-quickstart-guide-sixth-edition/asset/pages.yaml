- pgno: 312
  md: '![](img/e1ed1e3c1873fa9fc855210fb83699d0_312_0.png)


    Code 11.2 applied to Code 11.1. Position types have been set, but—without actually
    setting positions—the elements look to be a jumble. The footer, which is fixed,
    is now at the top of the page! Also, note how low the text marked with the strong
    tag is. This was caused by increasing its font size relative to the surrounding
    text. You will fix that in the next section.


    # Inheriting Position Types


    inherit is another value for positioning. It tells the element to use the same
    positioning type as its parent, overriding the default static value. This can
    be tricky to use, though, because tying the child’s position type to its parent
    can radically alter the layout if you change the parent’s position type.


    elements. Unlike an absolutely positioned element, when the window is scrolled,
    the fixed element stays where it is in the viewport as the rest of the content
    moves.


    inherit uses the position type of the element’s immediate parent. If no position
    is set, this will default to static (see the sidebar “Inheriting Position Types”).


    Absolutely positioned and fixed-positioned elements take up no space within the
    parent element. So if you have an element—such as an image—that is absolutely
    positioned, its width and height are not included as part of the width and height
    of the parent content.


    You can position elements within other positioned elements. For example, you can
    set the relative position of a child element that is within an absolutely positioned
    parent or set the absolute position of an element within an absolutely positioned
    parent.


    Remember that the browser adds a default margin to the body of your Web page,
    but the default value is not consistent across all browsers. To correct this,
    you should always set your own margin in the body tag, which allows you to position
    elements consistently. See Chapter 12 for details on using a browser reset.


    Positioning can also vary from browser to browser due to rounding errors. It’s
    generally best to use “clean” numbers, rounded to the nearest even number.


    When an element’s position type has been set to anything other than static, you
    can use JavaScript or other scripting languages to move the element, change the
    clip, change the stacking order, hide it, or display it.


    Browsers that do not understand the fixed position type default to static for
    the position type.'
  merge: -1
  img_proc: true
- pgno: 313
  md: "# # Setting an Element's Position\n\nAll positioned elements can have a top\
    \ value, a right value, a bottom value, and a left value to position the element\
    \ from those four sides (Tables 11.2 and 11.3). A relative element will be offset\
    \ relative to its own edges. An absolute element will be offset relative to its\
    \ parent’s edges. A fixed element will be offset relative to the viewport’s edges.\n\
    \n# ## To define an element's position:\n\n+   1. Specify a position type. For\
    \ details, see “Setting the Positioning Type” earlier in this chapter.\n+   \n\
    +   2. Add a position side property to your CSS declaration list. Type left, right,\
    \ top, or bottom in the CSS rule, followed by a colon (:) (Code 11.3).\n+   \n\
    +   top:\n+   \n+   3. Specify the position.\n+   \n+   0;\n+   \n+   Type a value\
    \ for the element’s offset. You can enter any of the following:\n+   \n+   > A\
    \ length value such as 120px, 2.3em, or 1.25cm.\n+   \n+   > A percentage value,\
    \ such as 1%, which creates a fluid offset.\n+   \n+   > auto, which allows the\
    \ browser to calculate the value if the position is set to absolute; otherwise,\
    \ the default value will be 0.\n\n| Value | | | | | | |\n|---|---|---|---|---|---|---|\n\
    | <length> | ● | ● | ● | ● | ● | ● |\n| <percentage> | ● | ● | ● | ● | ● | ● |\n\
    | auto | ● | ● | ● | ● | ● | ● |\n| inherit | ● | ● | ● | ● | ● | ● |\n\n| Value\
    \ | | | | | | |\n|---|---|---|---|---|---|---|\n| <length> | ● | ● | ● | ● | ●\
    \ | ● |\n| <percentage> | ● | ● | ● | ● | ● | ● |\n| auto | ● | ● | ● | ● | ●\
    \ | ● |\n| inherit | ● | ● | ● | ● | ● | ● |"
  merge: -1
  img_proc: true
