    Use one of the following alignment styles:


    +   > left to align the text in the last line to the left margin.

    +   > right to align the text in the last line to the right margin.

    +   > center to center the text within the width of the text area.

    +   > justify to align the text on both the left and right margins, adding extra
    space between words and letters.

    +   > inherit to make the text take its parents'' alignment.

    +   > auto to use the default alignment (generally left alignment).


    You should also include the -moz extension version for full compatibility.


