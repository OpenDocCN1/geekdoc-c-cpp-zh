- pgno: 340
  md: '# 7. Add the transform values.


    ```

    scale3d(.5,.75,1.5)

    .rotate3d(-3,-3,-8,18deg);

    ```


    For each browser-specific property, add the same transform value (Table 12.8)
    with its relevant parenthetical value:


    +   > rotate3d() requires three numbers to define the X, Y, Z axes, and an angle
    value to turn the element around those axes. Positive values turn the element
    clockwise, whereas negative values turn the element counterclockwise.


    +   > rotateZ() uses an angle value to turn the element around the Z axis. Positive
    values turn the element clockwise, whereas negative values turn the element counterclockwise.


    +   > scale3d() requires three numeric values that act as multipliers to the width
    (X) and/or height (Y) and depth (Z) of the element. Positive numbers increase
    element size. Negative values increase size and reflect the element along that
    axis. Decimal numbers decrease scale.


    +   > scaleZ() adds a numeric value that acts as a multiplier to the depth (Z)
    of the element. Positive numbers increase element size. Negative values will increase
    size and reflect the element along that axis. Decimal numbers decrease scale.


    +   > translate3d() requires three length values that offset the element along
    the X, Y, and/or Z axes of the element. Positive values offset down, to the right,
    and forward (larger), whereas negative values offset up, to the left, and backward
    (smaller).


    +   > translateZ() adds a length value that offsets the element along the Z axis
    of the element. Positive values offset forward, whereas negative values offset
    backward. Unlike the X and Y values, a percentage is not allowed with Z.


    +   > matrix3d() is a 4x4 matrix of 16 values that can be used as shorthand to
    represent any of the preceding transformations alone or in combination.


    **TIP** Notice that the 3D transformations work in Internet Explorer with version
    10, but do not require a browser extension. Instead, they work with the standard
    CSS3 syntax.


    **TIP** I find 3D transformations a bit mind-blowing when it comes to figuring
    out what does what. Don’t worry if they don’t seem intuitive at first. Experimentation
    is the best remedy for confusion.'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# # Adding Transitions Between Element States


    Despite users'' expectations to see change and movement on the screen, CSS and
    HTML have few controls that allow you to design interactivity, and those that
    do exist have been binary up to this point:


    +   - A link is one color or another.

    +   - A text field is one size or another.

    +   - A photo is transparent or opaque.


    No in-betweens have existed in the past from one state to the next, and no transitions.
    This has led to most Web pages feeling abrupt, with elements shifting and changing
    ungracefully.


    What we need is a quick and easy way to add simple transitions to a page, and
    that''s where CSS transitions come into the picture.


    # ## What can be transitioned?


    Almost any CSS property that has a color, length, or position component—including
    many of the new CSS3 properties—can be given a transition, changing it from one
    style to another style over time.


    Table 12.9 shows a list of the CSS properties available and the values that can
    be transitioned. (One exception is box-shadows.)


    For a transition to occur, there has to be a state change in the element using
    one of the link or dynamic pseudo-classes discussed in Chapter 4. Transitions
    work by changing a style between different element states over a period of time.
    For example, the color value of the default state of an element will pass through
    intermediate colors in the spectrum before appearing as the color value for the
    hover state.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_341_0.png)


    ① A transition is like several frames in a movie, changing gradually over time
    rather than instantly. With opacity, the transition is from transparent to opaque.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_341_1.png)


    ② With color, the transition is from one color to another on the color wheel.'
  merge: -1
  img_proc: true
