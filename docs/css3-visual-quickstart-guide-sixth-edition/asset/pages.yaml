- pgno: 287
  md: '# 2. Type a value for the margin.


    ```

    .35em .2em .2em 0;

    ```


    Use one of the following values:


    +   A length value


    +   A percentage, which creates a margin proportional to the parent element''s
    width


    +   auto, which returns control of the margins to the browser''s discretion


    You can enter one to four values, separated by spaces, to define the margins as
    follows:


    +   One value sets the margin for all four sides equally.


    +   Two values set the top/bottom margins and left/right margins.


    +   Three values set the top margin, the left/right margins (the same), and the
    bottom margin.


    +   Four values set each margin clockwise, starting from top: top, right, bottom,
    and left.


    # 3. You can also set the margin for just one side of the box independently without
    setting the other three margins.


    ```

    margin-bottom: 60px;

    ```


    This is useful when used with an inline style to override margins set elsewhere.
    To do this, specify the margin side you want to define (margin-top, margin-bottom,
    margin-left, or margin-right) and enter a legitimate margin value from Table 10.10.


    You can also set margins for the <body> tag; in which case the margins define
    the distance that elements nested in the body should appear from the top and left
    sides of the browser window.


    # Setting Negative Margins


    Although you can use negative margins (for example, margin:-5em;) to create interesting
    effects for overlapping pieces of text, this method is frowned upon because various
    browsers present different results.


    Overlapping text is better achieved using CSS positioning (see Chapter 11).


    Be careful when setting negative margins around a hypertext link. If one element
    has margins that cause it to cover the link, the link will not work as expected.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# Margin Collapse


    When two elements stacked vertically on top of each other determine the vertical
    margin between them, rather than adding the bottom and top margin together, the
    larger margin will be used, with the smaller margin collapsing to 0. This allows
    you to keep consistent margins at the top and bottom of a collection of stacked
    elements.


    In addition to the .floatleft and .floatright classes, I''ve added a .floatcenter,
    using an auto margin for left and right. This isn''t a true float, where text
    wraps around the object, since that''s not possible in CSS. What it does is simply
    center an element.


    I''ve also added margins to .floatleft and .floatright in order to make sure those
    floating elements have some breathing room.


    The best way to center an element within its parent element is to set the margins
    on the left and right to auto. This is how most Web pages with the content centered
    in the browser window are created.


    When setting proportional margins, be aware that you might get very different
    results depending on the size of the user''s window. What looks good at a resolution
    of 800 x 600 might be a mess at larger screen sizes.


    The browser has a default margin that it adds to the body of your page so the
    content doesn''t immediately begin at the edge of the screen. However, the default
    is not the same on all browsers, which can be a problem when you position elements
    on the page (see Chapter 11). It''s a good idea to set the margins in the body
    tag so that they remain consistent using a CSS reset, as explained in Chapter
    13.'
  merge: -1
  img_proc: true
