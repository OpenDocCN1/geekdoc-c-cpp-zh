- pgno: 337
  md: "# # 3D transformations\n\nAs of this writing, 3D transitions are supported\
    \ only in Safari and Chrome, although that can rapidly change as new versions\
    \ of Firefox are released. As a result, I don’t advocate the use of 3D transitions\
    \ except when you know the only browser in use supports these properties—for example,\
    \ in iOS applications or pages created for iPhone, iPod touch, or iPad display.\
    \ That said, because this is a standard under development by the W3C, you should\
    \ also include the standard CSS3 syntax for future compatibility.\n\n# ## To transform\
    \ an element in three dimensions\n\n+   1. Add the transform style property to\
    \ your CSS declarations and specify the style.\n\n```\n-webkit-transform-style:\
    \ flat;\n-moz-transform-style: flat;\ntransform-style: flat;\n```\n\nAdd transform-style\
    \ to the elements being transformed (Code 12.3), which allows you to specify whether\
    \ child elements should be set flat against the parent element or treated separately\
    \ in their own 3D spaces (Table 12.4). Although transform-style does work in Internet\
    \ Explorer, it does so using the CSS3 syntax, not its own browser extension.\n\
    \n| Value |\n|---|\n| flat |\n| preserve-3d |\n\nCode 12.3 Added to transition.properties.css—\
    \ When applied to Code 12.1, this code gives the middle image in the gallery a\
    \ slight 3D spin that will look like .\n\n```\n/*** transition.properties.css\
    \ ***/\ndiv.gallery figure {\n -webkit-transform-style: flat;\n -moz-transform-style:\
    \ flat;\n transform-style: flat;\n -webkit-perspective: 5000;\n -moz-perspective:\
    \ 5000;\n perspective: 5000;\n -webkit-perspective-origin: 25% 25%;\n -moz-perspective-origin:\
    \ 25% 25%;\n perspective-origin: 25% 25%;\n -webkit-backface-visibility: visible;\n\
    \ -moz-backface-visibility: visible;\n backface-visibility: visible;\n}\ndiv.gallery\
    \ figure#f2 {\n -webkit-transform: perspective(250px)\n scale3d(.5,.75,.5)\n rotate3d(3,-3,-8,18deg);\n\
    \ -moz-transform: perspective(250px)\n scale3d(.5,.75,.5)\n rotate3d(3,-3,-8,18deg);\n\
    \ -o-transform: perspective(250px)\n scale3d(.5,.75,.5)\n rotate3d(3,-3,-8,18deg);\n\
    \ transform: perspective(250px)\n scale3d(.5,.75,.5)\n rotate3d(3,-3,-8,18deg);\n\
    }\n```"
  merge: -1
  img_proc: true
