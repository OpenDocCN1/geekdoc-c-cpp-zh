- pgno: 151
  md: '# Setting a Font-Stack


    The font-family property lets you determine the visual effect of your message
    by choosing the font for displaying your text (Table 5.2). The typeface you use
    to display your text can make a powerful difference in how readers perceive your
    message A. However you use a serif, sans-serif, monospace, cursive, or fantasy
    typeface can speak volumes before your visitor even reads the first line of text.


    TABLE 5.2 Font-Family Values

    Value

    <family-name>

    serif

    sans-serif

    cursive

    fantasy

    monospace


    # To define the font family for an element:


    +   1. Add the font-family property to your CSS rule. Type the property name font-family,
    followed by a colon. In this example, font-family is applied to the body tag,
    which will set the font for the entire page (Code 5.2).

    +   font-family:

    +   2. Define the name of the primary font you want to use, followed by a comma.
    This name is not case sensitive. Fonts that contain a space in their names must
    be enclosed in quotation marks, either single or double (“Times New Roman” or
    ‘times new roman’ will both work).

    +   Constantia,


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_151_0.png)


    Examples of different typefaces. What voice do you hear?


    # Font or Font Family?


    Keep in mind the difference between a font and a font family. A font family is
    a series of fonts with similar appearance, such as Times. A font refers to a specific
    version—Times normal, Times bold, Times italic, Times bold italic, and so on.


    ```

    Code 5.2 Styles added to font-properties.css—Two separate typefaces are applied
    to the page

    /** font-properties.css **/

    body { font-family: Constantia, Georgia, "Times New Roman", serif; }

    h1, h2, h3, h4, h5, h6, .byline {

    font-family: Corbel, Helvetica, Arial, sans-serif; }

    h2 .chaptertitle {

    font-family: Corbel, Helvetica, Arial, sans-serif; }

    ```'
