- pgno: 335
  md: '# 2. Specify the transition type and value.


    ```

    rotate(-2deg);

    ```


    For each property, add the same transform value (Table 12.1) with its relevant
    parenthetical value:


    +   - rotate() with an angle value to rotate the element. Positive values turn
    the element clockwise, whereas negative values turn the element counterclockwise.


    +   - rotateX() or rotateY() with an angle value to turn the element around the
    X or Y axis. Positive values turn the element clockwise, whereas negative values
    turn the element counterclockwise.


    +   - scale(), scaleX(), or scaleY() with numeric values that act as multipliers
    to the width (X) and/or height (Y) of the element. Positive numbers increase element
    size. Negative values will still increase size but also reflect the element along
    its axis. Decimal numbers decrease scale.


    +   - skew(), skewX(), or skewY() with angle values that skew the element along
    the X and/or Y axis of the element. Positive values skew up and to the left, whereas
    negative values skew down and to the right.


    +   - translate(), translateX(), or translateY() with length values that offset
    the element along the X axis and/or Y axis of the element. Positive values offset
    down and to the right, whereas negative values offset up and to the left.


    +   - matrix() is a 3x3 matrix of values that can be used as a shorthand to represent
    any of the preceding transformations alone or in combination.


    # A Brief Note on Design Enhancements


    Let me emphasize one point: Never rely on styles for Web site functionality if
    the styles are not browser interoperable (that is, available on all common browsers).


    One more time for those who missed it: Never rely on styles for Web site functionality
    if the styles are not browser interoperable.


    That said, you can and should use styles—such as transitions—as design enhancements
    to improve the user experience without sacrificing usability for those who cannot
    see them. This is acceptable as long as you can live without the transitions and
    users can still complete their tasks.'
  merge: -1
  img_proc: true
