- pgno: 253
  md: "# # Dealing with Empty Table Cells\n\nIf a table data cell has no data (not\
    \ even spaces or nonbreaking spaces), it simply appears as a blank box at the\
    \ default width and height of the column and row.\n\nThe empty-cells property\
    \ (Table 8.9) allows you to specify how that empty data cell (and, most importantly,\
    \ its border) is presented.\n\n# ## To hide empty table data cells:\n\n+   1.\
    \ Add the empty-cells property to a table elements CSS rule. Type empty-cells,\
    \ followed by a colon (:) (Code 8.9).\n\n+   2. Specify how empty table cells\
    \ should be treated.\n\n+   hide;\n\nType one of the following to specify how\
    \ the cells will be treated:\n\n+   show will force the empty data cell to display\
    \ its background and border.\n\n+   hide will leave a visual gap in place of the\
    \ data cell.\n\n| Value | |\n|---|---|\n| show | |\n| hide | |\n| inherit | |\n\
    \nCode 8.9. Added to list-table-properties.css— The empty-cells property lets\
    \ you show (default) or hide empty table data cells\n\n```\n/*** list-table-properties.css\
    \ ***/\ntable {\n  empty-cells: hide;\n}\n```\n\n![](img/e1ed1e3c1873fa9fc855210fb83699d0_253_0.png)\n\
    \nCode 8.9 applied to Code 8.1: Empty table data cells have been hidden so that\
    \ their border and background colors are not displayed, leaving an empty gap in\
    \ the table."
  merge: -1
  img_proc: true
- pgno: 254
  md: "| Value |\n|---|\n| top |\n| bottom |\n| inherit |\n\nCode 8.10 Added to list-table-properties.css\
    \ — The caption-side property lets you specify whether the caption should appear\
    \ above (top) or below (bottom) the table.\n\n```\n/* *** list-table-properties.css\
    \ ***/\ntable {\n  caption-side: bottom;\n}\n```\n\n![](img/e1ed1e3c1873fa9fc855210fb83699d0_254_0.png)\n\
    \nThe caption is forced to the bottom of the table rather than its natural position\
    \ at the top.\n\n# Setting the Position of a Table Caption\n\nThe <caption> tag\
    \ lets you embed identifying text in a table. You can set the align attribute\
    \ in the tag to define where the caption should appear in relation to the table,\
    \ but this is being deprecated in favor of the CSS caption-side property (Table\
    \ 8.10), which does the same thing.\n\n# To set the position of a caption in relation\
    \ to its table:\n\n+   1. Add the caption side property to your CSS. Type caption-side,\
    \ followed by a colon (:) (Code 8.10). caption-side:\n+   2. Type a keyword indicating\
    \ which side of the table you want the caption to appear: top or bottom. bottom;"
  merge: -1
  img_proc: true
- pgno: 255
  md: "# Putting It All Together\n\nCode 8.11 shows the final version of list-table-properties.css\
    \ using the list shorthand property wherever possible. The caption-side property\
