    ```\n/* For Print */\nbody {\n color: rgb(0,0,0);\n background: white url('alice23a.gif')\n\
    \ -no-repeat 0 0;\n padding: 200px 0 0 175px;\n }\nh1 { color: gray; }\np { font:\
    \ normal 12pt/2 Constatia, palatino,\n + times, \"times new roman\", serif; }\n\
    ```"
