- pgno: 209
  md: '# Currentcolor keyword


    In addition to the color keyword list, you can use the currentcolor keyword. Using
    currentcolor to set any color value will use the element''s current color value.
    For example, to create an aqua border color, use:


    ```

    color: aqua;

    border-color: currentcolor;

    ```


    If you assign currentcolor specifically to the color property, it will inherit
    its parent element''s color value just like using color: inherit.


    # Transparent keyword


    Another important keyword is transparent, which is the equivalent of a 0 alpha.
    That is, it''s completely transparent. This keyword allows anything behind that
    element to show through.


    # RGB hex values


    Hexadecimal values can range from 0–9 and a–f. Values include three couplets of
    hexadecimal values representing the levels of red, green, and blue (in that order)
    in the desired color. The color value couplets range from 00 (no color) to FF
    (full color) A However, if the couplets contain the same hex value, only three
    values are needed to define the color. For example, these two sets of values represent
    the same pure blue:


    ```

    #0000ff

    #00f

    ```


    **TABLE 7.2 Color Keywords (continued)**


    | Keyword | Hex | Decimal |

    |---|---|---|

    | violet | #EE82EE | 238,130,238 |

    | wheat | #F5DEB3 | 245,222,179 |

    | white | #FFFFFF | 255,255,255 |

    | whitesmoke | #F5F5F5 | 245,245,245 |

    | yellow | #FFFF00 | 255,255,0 |

    | yellowgreen | #9ACD32 | 154,205,50 |


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_209_0.png)


    A RGB hex color values are represented by three couplet values, or by three single
    values ranging from 0–9 or A–F that indicate the levels of red, green, and blue
    that combine to create the color.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_209_1.png)


    B RGB decimal color values range from 0–255 to indicate the levels of red, green,
    and blue that combine to create the color.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '![](img/e1ed1e3c1873fa9fc855210fb83699d0_210_0.png)


    RGB percentage color values range from 0–100 to indicate the amount of red, green,
    and blue that are combined to create the color.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_210_1.png)


    HSL color values represent hue as the angle on a standard color wheel (0–360),
    saturation as a percentage, and lightness as a percentage.


    # Hex or Decimal?


    Until recently, it was assumed that colors should always be declared in RGB hexadecimal
    notation. In fact, I still meet designers and developers who are completely unaware
    that they have alternatives. RGB decimal has been around for quite awhile and
    will work in any browser you want to throw at it.


    But which is “better”?


    I personally find that it’s much easier to envision a color in decimal numbers
    (which I’ve used all my life) than in hex values. I can look at the value 135,
    127, 107 and know it’s a reddish beige much faster than if I see 877f6b. Additionally,
    since there is no alpha version for hex, if you want transparent colors, you have
    to use decimal values (Table 7.2).


    The only argument in favor of hex color values is that they are more compact (a
    smaller file size) than decimal values. But even over a large-scale Web site,
    you might save only a few bytes (millionths of a second in load time).


    # RGB decimal values


    Often, simply referred to as the _RGB values_, RGB uses decimal values from 0
    (no color) to 255 (full color) to represent the levels of red, green, and blue
    (in that order) present in the desired color.


    # Percentage values


    RGB values can also be expressed as whole percentages from 0% (no color) to 100%
    (full color) to represent the levels of red, green, and blue (in that order) present
    in the desired color.


    # ★HSL values


    Although their notations are different, hex, decimal, and percentage values are
    just different ways to define the levels of red, green, and blue in a color. CSS3
    adds a completely different method for defining color by its hue, saturation,
    and lightness (HSL).


    +   Hue—A degree value from 0 to 360, although the degree symbol is not included.
    The hue is based on a color’s position in the standard color wheel where red is
    at 0°, yellow at 60°, green at 120°, cyan at 180°, blue at 240°, and magenta at
    300°.


    +   Saturation—A percentage from 0% (no color) to 100% (full color).


    +   Lightness—A percentage from 0% (black) to 100% (white).


    **TIP** Hex values are currently the most popular way to define color values,
    but they are by no means the best way to add colors. I find it much easier to
    imagine colors using Base 10 decimal values rather than Base 16 hexadecimal values.


    **TIP** Although HSL is a bit difficult to master at first, it can be easier to
    use when setting complementary colors. Just add 180° to the hue.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# # Setting Alpha Values for Color Transparency


    Although the opacity property allows you to make elements transparent, this is
    applied to the entire element. CSS3 now allows you to make specific colors transparent.
    An alpha value is generally a fourth value in a color, but rather than representing
    a color, it sets the opacity of the color—a value from 0 (transparent) to 1 (opaque).
    So, an alpha of .5 is the equivalent of 50% opacity.


    +   **TIP** You can set an alpha channel for either RGB decimal or HSL color values,
    but currently there is no way to add alpha values to RGB hex values.


    +   **TIP** In addition to setting the color opacity, CSS includes the ability
    to set the opacity of an entire object and any of its content. See “Setting an
    Element’s Opacity” in Chapter 11 for more information.


    Alpha (opacity: 0–1)


    ```

    `rgba(255, 255, 255, 1.0)`

    ```


    ```

    `hsla(360, 100%, 100%, 1.0)`

    ```


    Alpha (opacity: 0–1)


    RGBA and HSLA add an alpha value as a decimal (0–1) to represent the opacity of
    a color with 0 completely transparent and 1 completely opaque.


    # ## Other Ways to Add Color


    Although this chapter presents the primary methods for setting colors in your
    design, several other CSS properties include color values:


    +   text-shadow & box-shadow—Although generally thought of as black or gray, you
    can set a text-shadow to any color. I often use this with brighter colors to create
    a glow (see Chapter 6).


    +   border—An element’s border colors can be set as part of any of the border
    properties or directly in the border-color property (see Chapter 10).


    +   outline—Like the border property, outline allows you to define a color around
    the edge of an element (see Chapter 10).'
  merge: -1
  img_proc: true
- pgno: 212
  md: "![](img/e1ed1e3c1873fa9fc855210fb83699d0_212_0.png)\n\n# # Creating Color Gradients\n\
    \nAlthough not yet a finished part of the CSS3 standard, the ability to fill an\
    \ element's background with a gradient has been introduced as extensions in Opera,\
    \ Internet Explorer, Webkit, and Mozilla—which means you can add linear and radial\
    \ gradients compatible with Opera, Internet Explorer, Safari, Chrome, and Firefox.\n\
    \n> Linear and radial gradients are available in all modern browsers, including\
    \ IE9+.\n\n![](img/e1ed1e3c1873fa9fc855210fb83699d0_212_1.png)\n\nTo ensure maximum\
    \ compatibility, you need to include the CSS3 standard version of the gradient\
    \ property along with the browser extension versions: -o-, -ms-, -webkit, and\
    \ -moz. Don't worry, they all take the same values. If you need to support really\
    \ old browsers (Safari 3 and earlier or Internet Explorer 8 or earlier), you may\
    \ also need to include values for them. For more details, see the sidebar \"Older\
    \ Gradient Syntax\".\n\n```\nlinear-gradient(\n 45deg, -------- Angle\n purple\
    \ 25%, -------- Color stop 1\n rgb(23, 136, 12), -------- Color stop 2\n #c00)\
    \ -------- Color stop 3\n```\n\n> Linear gradients have an optional angle value,\
    \ followed by two or more color stops separated by commas. The angle can be in\
    \ degrees, or one or two keywords to indicate the starting side or corner. The\
    \ color stop is a color value and an optional length or percentage value for the\
    \ position of the stop—where it is at full color—along the gradient line.\n\n\
    # ## Linear Gradients\n\nLinear gradients have two different value types, the\
    \ angle of the gradient and the colors that make up the gradient.\n\n+   * Angle\
    \ (degrees)—The angle for the gradient expressed as a numeric value, using degrees\
    \ (deg): such as 45deg.\n+   * Angle (keyword)—Instead of an angle numeric value,\
    \ you can use one or two keywords—separated by a spaces—defining the side or corner\
    \ where the gradient should start and stop—and preceded by the word to. Values\
    \ can include top, right, bottom, and/or left. If two values are used (separated\
    \ by a space), they specify a corner, such as to top left. such as to bottom right."
  merge: -1
  img_proc: true
- pgno: 213
  md: '**Color stop**—The values of two or more colors at a particular point along
    the gradient with values separated by spaces. You should include at least two
    values (otherwise you’ll get a solid color), but you can follow them with as many
    values as you want. These may include any color value type as shown in Table 71,
    including transparent colors using RGBA or HSLA, and an optional percentage or
    length value to set where the color should be positioned along the gradient axis,
    such as **green 67%**: **rgba(221,160,221)**.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_213_0.png)


    There''s more than one way to create the same gradient.


    At its simplest, a linear gradient can be two color values with the default angle
    at 270°, the start stop at 0%, and the end stop at 100%:


    ```

    ```css

    linear-gradient(navy, gold);

    ```

    ```


    This is the same as:


    ```

    ```css

    linear-gradient(270deg, rgb(0,0,128),

    · rgb(255,215,0));

    ```

    ```


    ```

    ```css

    linear-gradient(to bottom, navy,

    · gold);

    ```

    ```


    ```

    ```css

    linear-gradient(to top, gold, navy);

    ```

    ```


    ```

    ```css

    linear-gradient(#008 0%, #ffd700

    · 100%);

    ```

    ```


    ```

    ```css

    linear-gradient(180deg, gold 0%,

    · navy 100%);

    ```

    ```


    All of these values produce the same gradient.'
  merge: -1
  img_proc: true
- pgno: 214
  md: "![](img/e1ed1e3c1873fa9fc855210fb83699d0_214_0.png)\n\n```\nradial-gradient(\n\
    \    center center, ------------ Origin position\n    circle farthest-corner,\
    \ - Shape/size\n    purple 25%, --------------- Color stop 1\n    rgb(23, 136,\
    \ 12), --------- Color stop 2\n    #c00) --------------------- Color stop 3\n\
    ```\n\nRadial gradients have optional values for the origin of the gradient, the\
    \ shape and size, and two or more color stops. The position can be two values\
    \ for the horizontal and vertical location. The shape is either circle or elliptical\
    \ and the size can be keyword or two values. The color stop has a color value\
    \ and an optional length or percentage value for the position of the stop—where\
    \ it is at full color—along the gradient.\n\n| Value | Description |\n|---|---|\n\
    | closest-side | Gradient shaped to meet closest side from its center |\n| closest-corner\
    \ | Gradient shaped to meet closest corner from its center |\n| farthest-side\
    \ | Gradient shaped to meet farthest side from its center |\n| farthest-corner\
    \ | Gradient shaped to meet farthest corner from its center |\n\n# Radial Gradients\n\
    \nRadial gradients get a little more complicated than linear gradients because\
    \ they have four possible value types: D:\n\n+   Position—The location of the\
    \ center of the gradient within its box (see Chapter 10). The value(s) are a numeric\
    \ distance value (such as 5em), a percentage (such as 23%) or a keyword (such\
    \ as center) that sets the center of the radial gradient (which is the same as\
    \ setting background image positions shown later in Table 7.10). You can use two\
    \ values to define the horizontal and vertical positions independently (such as\
    \ at 2em 5em, at 23% 46%, or at left center). You can mix value types (such as\
    \ at 2em center). The position is optional, and if omitted defaults to center.\n\
    \n+   Size (keyword)—The size sets the radial gradient’s endpoint, using a keyword\
    \ (Table 7.3). Currently, the webkit version of the property uses a different\
    \ and more limited set of keywords, but they have equivalents in the new standard.\n\
    \n+   Size (length)—If the shape is not explicitly stated, the size can be set\
    \ as one or two length (such as 20px) or percentage (such as 89% 42%) values.\
    \ If two values are used, the first is the horizontal length and the second is\
    \ the vertical length. Negative values are not allowed.\n\n+   Shape—The shape\
    \ of a radial gradient, either circle or ellipse. The shape value is optional;\
    \ but if omitted, the value defaults to circle. Otherwise, the size is a single\
    \ length, and ellipse."
  merge: -1
  img_proc: true
- pgno: 215
  md: "+   - Color stop—The values of two or more colors at particular points along\
    \ the gradient with values separated by spaces. You should include at least two\
    \ values (otherwise you’ll get a solid color), but you can follow them with as\
    \ many values as you want. These may include any color value type shown in Table\
    \ 71—including transparent colors using RGBA or HSLA—and an optional percentage\
    \ or length value to set where the color should be positioned along the gradient\
    \ axis, such as green 67%, rgba(221,160,221,0.5).\n\nAt its simplest, a radial\
    \ gradient can be two color values with the default position in the center, the\
    \ shape an ellipse, the size set by the farthest-corner, and the start stop at\
    \ 0% and end stop at 100%:\n\n```\nradial-gradient(navy,gold);\n```\n\nThis is\
    \ the same as:\n\n```\nradial-gradient(ellipse rgb(0,0,128),\n  • rgb(255,215,0);\n\
    radial-gradient(center, navy, gold);\nradial-gradient(farthest-corner, #008\n\
    \  - 0%, #ffd700 100%);\nradial-gradient(center center,\n  - ellipse farthest-corner,\
    \ navy 0%,\n  - gold 100%);\n```\n\nAll of these values produce the same gradient\
    \ ①.\n\n![](img/e1ed1e3c1873fa9fc855210fb83699d0_215_0.png)\n\nThere are many\
    \ ways to create this elliptical gradient."
  merge: -1
  img_proc: true
- pgno: 216
  md: '# Repeating Gradients


    Both linear and radial gradients can repeat, rather than fill the area with the
    end color. To repeat gradients, simply use:


    ```

    -repeating-linear-gradient()

    -repeating-radial-gradient()

    ```


    TIP If you specify a gradient as a background, also specify a background color
    to ensure that text will be legible in browsers that do not support gradients.


    TIP Currently, gradients work only in the background of elements.


    TIP Use the background-image property to set gradients in the background of an
    element. You could also use the background property, but background-image works
    more consistently across multiple browsers.


    # Older Gradient Syntax?


    Although work is well underway for the official W3C CSS gradient standard as a
    part of the new Image Module (http://dev.w3.org/csswg/css3-images), the bad news
    is that Safari, Chrome, Firefox, and Internet Explorer have dabbled in creating
    their own versions of the standard. The good news is that, for the most part,
    these older syntaxes are no longer relevant. A possible exception is the older
    webkit syntax, which some developers still include. Given that a decreasing number
    of browsers are likely to use this style, I recommend leaving it out.


    If you really need to support an older syntax, though, the best way to get the
    code is to use the CSS3 Gradient Generator Tool (http://gradients.glrzad.com).


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_216_0.png)


    A great tool for plotting gradients can be found at http://gradients.glrzad.com.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# # Choosing Your Color Palette


    Graphic designers have a saying, “No color is better than bad color.” If you are
    not careful, color can work against you by obscuring your message and confusing
    your visitors. The effective use of color in design takes a lot of practice to
    get right, and designers have been practicing for centuries to get it right.


    Colors have powerful emotional meanings that cannot always be predicted, especially
    when used in different combinations. Table 7.4 presents some of the most common
    color associations in Western culture. When you put two colors together, the meanings
    begin to interrelate, much like words in a sentence.


    You want to make sure you don’t just slap colors down on your page. If you do,
    they’ll probably clash. The most important thing you can do to avoid this is to
    take time to plan your color choices. Begin by choosing the specific colors you
    will use and their exact RGB or HSL values. Then apply these colors consistently
    throughout your project.


    You will need to consider the colors that you will be applying to the basic parts
    of your Web page (including the colors in the background images). You do not have
    to choose a different color hue for each part, but you should define what color
    will be applied to each component:


    +   - Body background—Covering the entire visible area of the browser window,
    the background generally should provide the most contrast with the foreground
    text colors.


    +   - Content background—Often, you will use a different color for the background
    directly around the content of the page,


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_217_0.png)


    Eighteenth-century color wheels. Although modern color wheels have a lot more
    colors, the basic concept remains unchanged.


    # ## TABLE 7.4 Western Color Associations


    | Color | Emotional Associations | Color |

    | :--- | :--- | :--- |

    | Red | assertive, powerful, intense | |

    | Blue | consoling, fidelity, defense | |

    | Yellow | concern, rebirth, clarity | |

    | Green | wealth, fitness, food, nature | |

    | Brown | nature, maturity, wisdom | |

    | Orange | hospitality, exhilaration, vigor | |

    | Pink | vital, innocent, feminine | |

    | Purple | royalty, refinement, calm | |

    | Black | stark, stylish, somber | |

    | Gray | business-like, cool, detached | |

    | White | clean, pure, straightforward | |'
  merge: -1
  img_proc: true
- pgno: 218
  md: "+   allowing the body background color to absorb extra horizontal space in\
    \ the browser window.\n+   \n+   - **Browser/rule**—You may want to use contrasting\
    \ colors around the borders of content areas, headers, navigation blocks, lists,\
    \ and tables, or use rules to separate different chunks of content. Choose a color\
    \ that contrasts with the area that the lines are meant to separate.\n+   - **Header**—You\
    \ may choose not to change the background color for section headers, but always\
    \ make sure that the text color clearly contrasts with the background colors you\
    \ choose.\n+   - **Copy**—Your copy (generally sentences or paragraphs of text)\
    \ should have the highest contrast with the background to maximize legibility.\n\
    \n+   - **Link/navigation**—You may choose different colors for your site navigation\
    \ and for links in the copy, but these link colors should be easily discernible\
    \ from other text while still contrasting with the background.\n+   - **List/table**—You\
    \ may choose different background colors behind lists and tables or even alternating\
    \ row colors, called zebra striping, to improve readability.\n+   - **Form**—You\
    \ can specify the border, foreground, and background colors of many form elements\
    \ to give them a more distinctive look for your site, apart from their default\
    \ appearance. However, be careful not to customize them so much that the visitor\
    \ does not know what they are.\n\n![](img/e1ed1e3c1873fa9fc855210fb83699d0_218_0.png)\n\
    \nConsider which colors you will use for each component of your Web page. (Site:\
    \ SEIA.org)"
  merge: -1
  img_proc: true
- pgno: 219
  md: '# Color wheel basics


    A color wheel is a disc or circle that shows the spectrum of color values, providing
    you with a quick overview of all the possibilities from red, orange, and yellow,
    to green, blue, indigo, and violet, and back to red again. Some color wheels also
    allow you to view brightness (dark to light) and saturation (full color tone to
    gray) levels.


    When you get down to it, though, color is a matter of preference. Colors that
    I think look great together may make my wife gag (and usually result in changing
    my outfit). To be safe, you can count on a single color (monochrome) or one of
    the following color-combination schemes as (more or less) fail-safe:


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_219_0.png)


    The color wheel. This is especially important to know if you want to use HSL color
    values. The wheel goes from 0° to 90° to 180° to 270° back to 0°.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_219_1.png)


    Analogous—Three or more colors and their tones with one primary color and two
    secondary colors that are the same angle from the primary color, from 0 degrees
    to 60 degrees.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_219_2.png)


    Monochromatic—A single color with different brightness or saturation values for
    contrast.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '![](img/e1ed1e3c1873fa9fc855210fb83699d0_220_0.png)


    Triad—Three colors and their tones with one primary and two secondary colors that
    are at equal angles in the color wheel, 120 degrees to 180 degrees from the primary.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_220_1.png)


    Complementary—Two colors from opposite sides of the color wheel (180 degrees),
    providing the highest contrast.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_220_2.png)


    Compound—Four colors that include one primary color, one secondary color (in direct
    contrast to the primary color), and two colors that are the same angle from the
    primary or secondary color, from 0 degrees to 90 degrees.


    All of these color schemes allow you to choose the basic hue and then use various
    brightness and/or saturation values for the colors to add additional shades to
    your palette.'
  merge: -1
  img_proc: true
