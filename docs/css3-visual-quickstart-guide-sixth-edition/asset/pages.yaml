- pgno: 14
  md: '# Introduction


    These days, everyone is a Web designer. Whether you are adding a comment to a
    Facebook page, creating your own blog, or building a Fortune 50 Web site, you
    are involved in Web design.


    As the Web expands, everyone from PTA presidents to presidents of multinational
    corporations is using this medium to get messages out to the world because the
    Web is the most effective way to communicate your message to the people around
    you and around the world.


    Knowing how to design for the Web isn''t always about designing complete Web sites.
    Many people are creating simple Web pages for auction sites, their own photo albums,
    or their blogs. So, whether you are planning to redesign your corporate Web site
    or place your kid''s graduation pictures online, learning Cascading Style Sheets
    (CSS) is your next step into the larger world of Web design.


    # What Is This Book About?


    HTML is how Web pages are structured. CSS is how Web pages are designed. This
    book deals primarily with how to use CSS to add a visual layer to the HTML structure
    of your Web pages.


    CSS is a style sheet language; that is, it is not a programming language. Instead,
    it''s code that tells a device (usually a Web browser) how the content in a file
    should be displayed. CSS is meant to be easily understood by anyone, not just
    "computer people." Its syntax is straightforward, basically consisting of rules
    that tell an element on the screen how it should appear.


    This book also includes the most recent additions to the CSS language, commonly
    referred to as CSS3 (or CSS Level 3). CSS3 builds on and extends the previous
    version of CSS. For the time being, it''s important to understand what is new
    in CSS3 because some browsers (most notably Internet Explorer) have incomplete
    support or no support for these new features.'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'CSS3 Visual QuickStart Guide has three parts:


    +   - CSS Introduction and Syntax (Chapters 1–4)—This section lays the foundation
    you require to understand how to assemble basic style sheets and apply them to
    a Web page. It also gives you a crash course in HTML5.

    +   - CSS Properties (Chapters 5–12)—This section contains all the styles and
    values that can be applied to the elements that make up your Web pages.

    +   - Working with CSS (Chapters 13–15)—This section gives advice and explains
    best practices for creating Web pages and Web sites using CSS.


    # Who is this book for?


    To understand this book, you need to be familiar with HTML (Hypertext Markup Language).
    You don’t have to be an expert, but you should know the difference between a <p>
    element and a <b> tag. That said, the more knowledge of HTML you bring to this
    book, the more you’ll get out of it.


    Chapter 2 deals briefly with HTML5, bringing you up to date on the latest changes.
    If you are already familiar with HTML, this chapter has everything you will need
    to get going.


    # What tools do you need for this book?


    The great thing about CSS is that, like HTML, it doesn’t require any special or
    expensive software. Its code is just text, and you can edit it with programs as
    simple as TextEdit (Mac OS) or Notepad (Windows).'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Why Standards (Still) Matter


    The idea of a standard way to communicate over the Internet was the principle
    behind the creation of the World Wide Web. You should be able to transmit information
    to any computer anywhere in the world and display it in the way the author intended.
    In the beginning, only one form of HTML existed, and everyone on the Web used
    it. This situation didn''t present any real problem because almost everyone used
    Mosaic, the first popular graphics-based browser, and Mosaic was the standard.
    That, as they say, was then.


    Along came Netscape Navigator and the first HTML extensions were born. These extensions
    worked only in Netscape, however, and anyone who didn''t use that browser was
    out of luck. Although the Netscape extensions defied the standards of the World
    Wide Web Consortium (W3C), most of them—or at least some version of them—eventually
    became part of those very standards. According to some people, the Web has gone
    downhill ever since.


    The Web is a very public form of discourse, the likes of which has not existed
    since people lived in villages and sat around the campfire telling stories every
    night. The problem is that without standards, not everyone in the global village
    can make it to the Web campfire. You can use as many bleeding-edge techniques
    as you like. You can include Flash, JavaScript, QuickTime video, Ajax, HTML5,
    or CSS3, but if only a fraction of browsers can see your work, you''re keeping
    a lot of fellow villagers out in the cold.


    When coding for this book, I spent 35 to 45 percent of my time trying to get the
    code to run as smoothly as possible in Internet Explorer, Firefox (and related
    Mozilla browsers), Opera, Safari, and Chrome. This timeframe holds true for most
    of my Web projects; much of the coding time is spent on cross-browser inconsistencies.
    If the browsers stuck to the standards, this time would be reduced to almost nothing.
    Your safest bet as a designer, then, is to know the standards of the Web, try
    to use them as much as possible, and demand that the browser manufacturers use
    them as well.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# # Values and Units Used in This Book


    Throughout this book, you''ll need to enter various values to define properties.
    These values take various forms, depending on the needs of the property. Some
    values are straightforward—a number is a number—but others have special units
    associated with them.


    Values in angle brackets (< >) represent one type of value (Table I.1) that you
    will need to choose, such as <length> (a length value like 12px) or <color> (a
    color value). Words that appear in code font are literal values and should be
    typed exactly as shown, such as normal, italic, or bold.


    # ## Length values


    Length values come in two varieties:


    +   - Relative values, which vary depending on the computer being used (Table
    I.2).

    +   - Absolute values, which remain constant regardless of the hardware and software
    being used (Table I.3).


    I generally recommend using ems to describe font sizes for the greatest stability
    between operating systems and browsers.


    | Value Type | What It Is | Example |

    | :--- | :--- | :--- |

    | <number> | A number | 1, 2, 3 |

    | <length> | A measurement of distance or size | 1in |

    | <color> | A chromatic expression | red |

    | <percentage> | A proportion | 35% |

    | <URL> | The absolute or relative path to a file on the Internet | http://www.
    mySite.net/ images/01.jpg |


    | Unit | Name | What It Is | Example |

    | :--- | :--- | :--- | :--- |

    | em | Em | Relative to the current font size (similar to percentage) | 3em |

    | ex | x-height | Relative to the height of lowercase letters in the font | 5ex
    |

    | px | Pixel | Relative to the monitor''s resolution | 125px |


    | Unit | Name | What It Is | Example |

    | :--- | :--- | :--- | :--- |

    | pt | Point | 72pt = 1inch | 12pt |

    | pc | Picas | 1pc = 12pt | 3pc |

    | mm | Millimeters | 1mm = 24pc | 25mm |

    | cm | Centimeters | 1cm = 10mm | 5.1cm |

    | in | Inches | 1in = 2.54cm | 8.25in |'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Color values


    You can describe color on the screen in a variety of ways, but most of these descriptions
    are just different ways of telling the computer how much red, green, and blue
    are in a particular color.


    Chapter 7 provides an extensive explanation of color values.


    # Percentages


    Many of the properties in this book have a percentage as their values. The behavior
    of each percentage value depends on the property in use.


    # URLs


    A Uniform Resource Locator (URL) is the unique address of something on the Web.
    This resource could be an HTML document, a graphic, a CSS file, a JavaScript file,
    a sound or video file, a CGI script, or any of a variety of other file types.
    URLs can be local—describing the location of the resource relative to the current
    document—or global—describing the absolute location of the resource on the Web
    and beginning with http://.'
