- pgno: 365
  md: '4. Move the background image up or down, depending on the state. Add rules
    for all the link states (:link, :visited, :hover, :active, and :focus), setting
    the background-position property with the correct vertical offset values to display
    the relevant rollover state.


    ```

    nav.toc .menu .drop li:hover {...},

    .nav.toc .menu .drop li:active

    {...}

    ```


    For example, the visited state would use:


    ```

    background-position: right -100px;

    ```


    So only the visited button state is shown C.


    TIP You can, of course, include any other style changes you want. In this example,
    I''m also changing the background color.


    TIP The concept (and the last part of the name) of CSS sprites originated in the
    early days of video games, when memory and speed were at a premium. To overcome
    system limitations, video game producers would lay out the thousands of small
    graphics used to create the game into a grid and then display each sprite as needed,
    masking out all but the needed part of the larger image.


    TIP The example here is a simple one, but it''s possible to place dozens, hundreds,
    or more images on a single sprite to cut down on server requests and speed up
    your site.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_365_0.png)


    C With the height of the element set, only a part of the background image is revealed,
    hiding the rest. By changing the background position within the element, it appears
    as if the image has changed.'
  merge: -1
