- pgno: 325
  md: "# Box “Shadow” Effects\n\nThe box shadow can do some great effects that might\
    \ all but replace the border and outline properties. Here are just a few examples\
    \ that I created classes for:\n\n# Frame\n\nThe frame effect uses drop shadows\
    \ with the spread set to 0 to create a frame around the box. This has an advantage\
    \ over border because you can have multiple borders, and has the advantage of\
    \ the outline property in that it will not take up any space in the design 6.\n\
    \n```\n.frame {\n    box-shadow: 0 0 0 5px\n    .hsl(0,100%,0%),\n    0 0 0 10px\
    \ hsl(90,100%,20%),\n    0 0 0 15px hsl(180,100%,40%),\n    0 0 0 20px hsl(270,100%,80%),\n\
    \    0 0 0 25px hsl(0,100%,80%),\n    0 0 0 30px hsl(90,100%,100%); }\n```\n\n\
    # Inset Frame\n\nLike the frame effect, only the border is inside the element\
    \ D. You cannot do this with the border property.\n\n```\n.insetframe {\nbackground:\
    \ rgb(53,53,53);\nbox-shadow: 0 0 0 15px\n.hsla(0,0%,100%,.5) inset,\n0 0 0 10px\
    \ hsla(0,0%,100%,.5)\n.inset; }\n```\n\n![](img/e1ed1e3c1873fa9fc855210fb83699d0_325_0.png)\n\
    \n6 Using multiple Box-shadows to create a multiple border effect.\n\n![](img/e1ed1e3c1873fa9fc855210fb83699d0_325_1.png)\n\
    \nD Using Box-shadows to create a transparent border inside the image."
