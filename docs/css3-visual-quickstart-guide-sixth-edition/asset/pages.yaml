  md: '# TABLE 6.8 Text-Justify Values


    | Value | | | | | |

    | :--- | :---: | :---: | :---: | :---: | :---: |

    | kashida | ● | ● | ● | ● | ● |

    | distribute | ● | ● | ● | ● | ● |

    | inter-cluster | ● | ● | ● | ● | ● |

    | inter-ideograph | ● | ● | ● | ● | ● |

    | inter-word | ● | ● | ● | ● | ● |

    | none | ● | ● | ● | ● | ● |

    | auto | ● | ● | ● | ● | ● |


    3. If you are using justified text (text-align: justify), add the text-justify
    property. Type text-justify in the CSS declaration list, followed by a colon (:)
    (Code 6.7) and specify how justified text is treated:


    ```

    text-justify: distribute;

    ```


    Use one of the following justification styles:


    +   - kashida to justify text in cursive scripts by elongating their connections.

    +   - distribute to add space between words and letters.

    +   - inter-cluster to add space in content that has no inter-word spacing, such
    as many Asian languages.

    +   - inter-ideograph to add space between words or block scripts as with certain
    Asian scripts.

    +   - inter-word to add space between words only.

    +   - none to disable justification.

    +   - auto to use the default alignment (generally left alignment).


    **TIP** Text is left justified by default.


    **TIP** Fully justifying text may produce some strange results on the screen because
    spaces between words must be added to make each line the same length. In addition,
    opinions differ as to whether full justification helps or hinders readability.'
