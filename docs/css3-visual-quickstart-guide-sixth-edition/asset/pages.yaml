    # TABLE 12.13 Transition-Timing-Function Values


    | Value | How it Works |

    |---|---|

    | cubic-bezier (<number>...) | X and Y values are between 0 and 1 to define the
    shape of a bezier curve used for the timing function. |

    | linear | Constant speed |

    | ease | Gradual slowdown |

    | ease-in | Speed up |

    | ease-out | Slow down |

    | ease-in-out | Speed up and then slow down |


    # 2. Add values for each transition.


    ```

    color .25s ease-in

    ```


    Choose from the following values (Table 12.10):


    +   > A transition-property from Table 12.11 indicates which specific CSS property
    is affected.


    +   > transition-duration sets how long the transition should take from beginning
    to end, generally in seconds (Table 12.12). This is optional, and the default
    will be 0.


    +   > transition-timing-function defines the behavior of the transition''s speed
    as it progresses (Table 12.13). This value is not required, and defaults to linear
    when not set.


    +   > transition-delay specifies how long the duration should pause before starting
    (Table 12.14). This is optional and defaults to 0 if not set.


    continues on next page


    # TABLE 12.14 Transition-Delay Values


    | Value | |

    |---|---|

    | <time> | ●10 ◇16 ◇ ◇ ◇12.5 |'
