- pgno: 222
  md: '# Color and Accessibility


    Beyond attractive and compelling design, another critical consideration with color
    is accessibility for people who are visually impaired. The most important considerations
    are to provide enough contrast between foreground and background colors so that
    the information is readable and to make sure that color is not critical for understanding
    information. For example, if you are using color for links, also set off those
    links using some other formatting such as underlining or bold.


    For more details on color and accessibility, see section 9 of the W3C''s white
    paper "CSS Techniques for Web Content Accessibility Guidelines" at w3.org/TR/WCAG10-CSS-TECH5/#style-colors.


    I also recommend that you check your foreground and background colors for accessibility
    at http://snook.ca/technical/colour_contrast/colour.html


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_222_0.png)


    (i) Check your color contrast to make sure it''s accessible (http://snook.ca/technical/colour_contrast/colour.html).'
  merge: -1
  img_proc: true
- pgno: 223
  md: "# # Setting Text Color\n\nThe color property is used to set the text color\
    \ (sometimes called the foreground color) of an element (Table 7.5). This color\
    \ will be inherited by all of the element's children (see Chapter 4), so you need\
    \ only set it once in the body element and then provide overrides as needed. For\
    \ example, if you set the color to gray in the <body>, then all text on the page\
    \ will be gray. If you then set the <p> element to red, all paragraph text and\
    \ any elements in it will be red, overriding the gray.\n\n# ## To define the text\
    \ color:\n\n+   1. Add the text color property to your CSS declarations. Type\
    \ color in the CSS rule, followed by a colon (:) (Code 7.2).\n\n+   2. Specify\
    \ a color value. Type a value for the color based on color values from Table 7.1.\
    \ This includes RGB, HSL, transparent, or current color.\n\n```\nrgb(51, 51, 51);\n\
    ```\n\nIt's a good idea to set a default page color for the body, table, and input\
    \ tags independently—even if it's just black—to ensure that colors are consistent\
    \ across the page.\n\n| Value | |\n| :--- | :--- |\n| <color> | |\n| inherit |\
    \ |\n\nCode 7.2 Added to color-background-properties.css—The header text is rendered\
    \ in a variety of shades of red, the text is a dark gray, and the form button\
    \ and the text that gets typed into the form field are red. The brighter red text\
    \ is much more prominent than the lighter red and the gray text.\n\n```\n/***\
    \ color-background-properties.css ***/\n\nbody { color: rgb(51,51,51); }\nheader\
    \ h1 {\n    color: hsla(7,62%,40%,.8);\n}\nheader h2 {\n    color: rgba(242,237,217,.25);\n\
    }\nheader h2 cite {\n    color: rgba(242,237,217,.5);\n}\narticle h2 .chapter-title\
    \ {\n    color: rgba(135,127,107,.5);\n}\narticle p:first-of-type:first-letter\
    \ {\n    color: rgb(153,0,0);\n}\nfooter {\n    color: white;\n}\na:link {\n \
    \   color: rgb(204,0,0);\n}\na:visited {\n    color: rgb(153,0,0);\n}\na:hover\
    \ {\n    color: rgb(255,0,0);\n}\na:active {\n    color: rgb(153,153,153);\n}\n\
    ```"
  merge: -1
  img_proc: true
