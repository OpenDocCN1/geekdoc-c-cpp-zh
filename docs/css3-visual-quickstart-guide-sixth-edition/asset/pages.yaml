- pgno: 71
  md: '# # (Re)Defining HTML Tags


    Almost all HTML tags have default browser styles associated with them. Take the
    <strong> tag, for example: Its inherent style declaration is the equivalent of
    font-weight: bold.


    By adding new CSS declarations to the strong HTML selector, you can change any
    element tagged as strong to look like anything you want A. For example, you could
    make all italicized text bold or even set font-weight: normal, which would prevent
    the text from being bold.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_71_0.png)


    A The general syntax used to define the styles for an HTML tag.


    # ## To define an HTML selector:


    +   1. Start with the HTML selector whose properties you want to define. Add a
    curly bracket ({) to open your rule (Code 3.8). Make sure you always close your
    declaration list with a curly bracket (}). If you forget this, it will ruin your
    day!


    ```

    h1 {...}

    ```


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_71_1.png)


    B The results of Code 3.8. Paragraphs are indented and are no longer bright violet.'
  merge: -1
  img_proc: true
