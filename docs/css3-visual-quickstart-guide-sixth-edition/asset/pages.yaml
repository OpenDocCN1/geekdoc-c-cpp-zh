- pgno: 256
  md: '# # User Interface and Generated Content Properties


    The user interface cannot, for the most part, be controlled by CSS. It is dependent
    on the specific operating system and browser in use. Objects such as the scroll
    bars are out of your control. However, CSS does provide some control over the
    appearance of the mouse pointer and style of quotes.


    Additionally, CSS includes several properties that let you specify content to
    be placed on the page (generated) for specific instances. For example, you might
    want all chapter titles to include the word “Chapter” before them. Although you’ll
    usually want to place all of your Web page content directly into the HTML code,
    on occasion you’ll find it useful to have some redundant content generated for
    you or have it tailored to a specific language.


    | In This Chapter | |

    |---|---|

    | Getting Started | 236 |

    | Changing the Mouse Pointer Appearance | 238 |

    | Adding Content Using CSS | 240 |

    | Teaching the Browser to Count | 242 |

    | Specifying the Quote Style | 244 |

    | Putting It All Together | 246 |'
  merge: -1
  img_proc: true
