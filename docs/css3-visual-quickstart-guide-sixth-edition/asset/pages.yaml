- pgno: 285
  md: "# Clearing a floated element\n\nSometimes, you may find it necessary to override\
    \ the `float` property to prevent elements that appear after a floating element\
    \ from wrapping. Similar to the `clear` attribute of the HTML `break` tag, the\
    \ CSS `clear` property allows you to specify whether you want to deny floating\
    \ around the left, right, or both sides of an element (Table 10.9).\n\n# To prevent\
    \ an element from floating:\n\n+   1. Type the `clear` property name in the CSS\
    \ rule, followed by a colon (:) to start your declaration (Code 10.6).\n+   \n\
    +   `clear:`\n\n+   2. Type the keyword for the side that you want to prevent\
    \ floating.\n+   \n+   `right;`\n\n+   Choose one of the following keywords:\n\
    +   \n+   * `left` to prevent wrapping on the left side of the element\n+   *\
    \ `right` to prevent wrapping on the right side of the element\n+   * `both` to\
    \ prevent wrapping on both sides of the element\n+   * `none` to override a previously\
    \ set `clear` property\n\n**TIP** I like to set up float classes: `.floatleft`\
    \ and `.floatright`. These can come in handy for creating versatile Web designs.\n\
    \n**TIP** It's usually a good idea to set headers and titles to `clear:both`,\
    \ so that they don't wrap around other objects.\n\nTABLE 10.9 Clear Values\n\n\
    | Value | |\n|---|---|\n| left | ● ● ● ● ● ● |\n| right | ● ● ● ● ● ● |\n| both\
    \ | ● ● ● ● ● ● |\n| none | ● ● ● ● ● ● |\n\nCode 10.6 Added to `box.properties.css`—\
    \ When applied to Code 10.1, figures are prevented from floating next to each\
    \ other, which might create an unattractive design\n\n```\n```css\n/*** box-properties.css\
    \ ***/\nfigure {\n  clear: both;\n}\n```\n```"
