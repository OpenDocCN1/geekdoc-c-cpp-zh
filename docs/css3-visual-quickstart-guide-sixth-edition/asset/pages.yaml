- pgno: 147
  md: '# Specifying the character set


    In the previous chapter, you found that when you create an HTML5 document, you
    need to specify the character set in use by your page. A character set is simply
    a list or repertoire of characters with a unique code or name that the browser
    will recognize to display the text. These codes are agreed upon as international
    standards. You do not need to concern yourself with them, except when you choose
    the character set you use for your own Web pages.


    You specify the character set in the head of your HTML page using a meta tag.
    The most popular international character set is the UTF-8 (8-bit Unicode Transformation
    Format) character set:


    ```

    <meta charset="utf-8">

    ```


    Alternatively, if you are writing only in English, another common character set
    is the ISO 8859-1 character set:


    ```

    <meta http-equiv="Content-Type"

    content="text/html; charset=

    ISO-8859-1" />

    ```


    Both UTF-8 and ISO 8859-1 work about the same for English, but UTF-8 supports
    other alphabets. I highly recommend sticking with UTF-8. Web sites (even your
    local newspaper) are often translated on the fly into different languages.


    One other important point: if you specify a character in your HTML that doesn''t
    exist in the specified character set, the browser generally will display an error
    marker in place of the character A. If that happens, you can often encode the
    character yourself, as explained in the upcoming section Encoding HTML character
    entities.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_147_0.png)


    This glyph, or one like it, will appear in place of any characters that the browser
    does not recognize as a part of the character set.'
  merge: -1
  img_proc: true
