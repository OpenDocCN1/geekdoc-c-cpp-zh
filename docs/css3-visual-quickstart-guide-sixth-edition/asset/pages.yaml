- pgno: 363
  md: '# Using CSS Sprites


    The CSS sprite technique lets you create a single image that contains the different
    states used for buttons, menus, or interface controls using dynamic pseudo-classes.
    In that file, you place all of the individual sprites that make up your button,
    separated by enough space so that they don’t run into each other. You then call
    this image as the background for an element, and set the background position property
    (using negative values to move the background up and/or left) to position the
    correct sprite. Because only one image must load, the browser needs to make only
    one server call, which speeds up your site.


    For example, in your menu from the previous section, it might be nice to place
    a pointer icon to the right of the options to show that you will be loading a
    new page. The sprite includes all three versions of the icon for all three dynamic
    states.


    # To add CSS image rollovers to a Web page:


    +   1. Create an image with the different dynamic states for your icon. You will
    create icons for each of the dynamic states you need (default, hover, and active,
    in this example) all in the same image file, separated by a small amount of space
    and name it sprite-pointer.png. Generally, you will want to regularly space the
    states’ positions, making them easy to remember. For example, I set the top of
    each graphic at intervals of 100 pixels.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_363_0.png)


    sprite-pointer.png—The image used to create the multiple states used for the arrow.
    They are arranged at regular intervals to help you more quickly and accurately
    switch them.'
  merge: -1
  img_proc: true
