- pgno: 63
  md: '+   3. Add all the CSS rules you want to define. Rules obey the cascade order
    (explained in detail in “Determining the Cascade Order” in Chapter 5). But generally,
    you can overrule a style by rewriting it lower in the list.


    > TIP To make a rule more easily readable, you can also add one or more line breaks,
    spaces, or tabs after a declaration without interfering with the code.


    > TIP Although you can place embedded styles anywhere in your HTML document, I
    highly recommend placing them at the top of your documents in the <head>; otherwise,
    the page will display without the styles at first and then blink as the page redisplys
    with the styles.


    > TIP However, I do not recommend placing embedded styles in your final Web page
    at all. Although they aren’t as difficult to override as inline styles, embedded
    styles can confound you later when trying to redesign a page. It’s always best
    to put all your styles in an external style sheet (explained in the next section)
    where site-wide changes are easy to make.'
