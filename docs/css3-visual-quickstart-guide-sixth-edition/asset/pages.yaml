- pgno: 304
  md: '# Visual Formatting Properties


    Whether your designs are meant to be pixel perfect or fluid, element positioning
    is the key to any good design. You''ve already learned how to use CSS to control
    margins and padding in your composition (Chapter 10). With CSS, you can also position
    elements in the window, either absolutely (absolutely or fixed) or in relation
    to other elements in the document (relatively). You can also set the visibility
    of any element in the window, making it visible, hidden, transparent, or even
    clipped on its sides.


    This chapter introduces you to the methods you can use to position HTML elements
    using CSS, including how to stack elements on top of one another and float elements
    next to each other.


    # In This Chapter


    +   - Getting Started 284

    +   - Understanding the Window and Document 286

    +   - Setting the Positioning Type 288

    +   - Setting an Element''s Position 292

    +   - Stacking Objects in 3D 294

    +   - Setting the Visibility of an Element 296

    +   - Clipping an Element''s Visible Area 298

    +   - Setting an Element''s Opacity 300

    +   - Setting an Element''s Shadows 302

    +   - Putting It All Together 305'
  merge: -1
  img_proc: true
