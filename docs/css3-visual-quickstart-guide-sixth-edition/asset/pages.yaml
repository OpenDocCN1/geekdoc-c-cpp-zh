- pgno: 373
  md: '# # What Is Responsive Design?


    Clearly, a one-for-all strategy will not work A. A layout that works in one device
    may become cramped and unusable in another. Instead, our design must be responsive,
    changing as needed based on the user''s context as generally determined by the
    device she is using and its available screen resolution. Most responsive designs
    will then use break points where the interface face needs to radically change
    for different contexts and adapt to make smaller adjustments for specific devices
    B.


    To do this, we''ll use media queries to "ask" the device about itself, and then
    deliver styles accordingly C. The server will contain an assortment of style sheets,
    which are then assembled to match the capabilities of the device.


    The approach that is often called "responsive design" is actually a combination
    of techniques used to create Web pages that optimize themselves to the end user''s
    environment, regardless of her browser, version, or device.


    A responsive design includes:


    +   - **Progressive enhancement**: This is not a specific code to be deployed,
    but a general design philosophy that you will need to apply to your development
    decisions. It''s built on the idea that designs should scale up or down depending
    on the environment they are displayed in.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_373_0.png)


    One size does not fit all. The style sheet that looks good on a computer screen
    does not look as good on a tablet or smart-phone.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_373_1.png)


    Responsive design uses break points when the interface needs to change radically,
    and adaptive design to make minor adjustments for different devices.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_373_2.png)


    Small, medium, or large? Let the device tell you.'
  merge: -1
  img_proc: true
- pgno: 374
  md: "+   - Resetting styles: To ensure that the default browser styles interfere\
    \ as little as possible with the end design, we will manually reset margins, padding,\
    \ and other default style values. This has to be done only once per site, but\
    \ ensures better conformity across all browsers and devices.\n+   \n+   - Conditional\
    \ styles for Internet Explorer: Although recent versions of Internet Explorer\
    \ have come a long way in adopting CSS standards, you may need to adjust your\
    \ design for older IE versions.\n+   \n+   - Adaptive styles: Adaptive styles\
    \ replace pixel perfection with more fluid relative sizes, allowing the layout\
    \ to stretch and shrink within the confines of the screen dimensions. For example,\
    \ you would need to make interface changes between an iPhone and an iPad because\
    \ they have substantially different contexts. However, an iPhone and an Android\
    \ smart phone share similar contexts, so you could maintain similar designs; but\
    \ their exact sizes may vary, requiring some design adaptation.\n+   \n+   - Break\
    \ points: Adaptive styles get you only so far. Responsive design uses specific\
    \ break points at which point the design is more radically adjusted, generally\
    \ between small devices (such as smart phones), medium devices (tablets), large\
    \ devices (computer monitors), and extra-large devices (high-definition televisions)."
  merge: -1
  img_proc: true
- pgno: 375
  md: '# Designing with Progressive Enhancements


    It''s clear that not all browsers are created equal, so why should we expect all
    Web sites to treat them that way? For years Web designers have tried to design
    to the lowest common denominator (such as Internet Explorer), and ignore new features
    in the belief that they had to create the same, pixel-perfect experience in all
    browsers.


    Pixel perfection is a user-experience philosophy that dictates that a Web design
    must look exactly the same on every version of every browser.


    In contrast, progressive enhancement is a design philosophy that recommends using
    newer technologies (such as CSS3) even though the design may not look exactly
    the same in every browser. What''s more important is that on every target device,
    the design ultimately looks as good as possible with as little extra design and
    coding work as possible A B.


    # How does it work?


    Using progressive enhancement is critical when designing across multiple browsers
    and across multiple devices, because when it comes to designing for smart phones
    and tablets, the desire to create pixel-perfect designs can actually be counter-productive.
    Responsive design relies on the fact that the designs will automatically adjust
    to devices.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_375_0.png)


    A Forum One uses progressive enhancement to style its pages using CSS to add rounded
    corners to buttons, gradients, and shadows. This is how forumone.com looks in
    Chrome.'
  merge: -1
  img_proc: true
- pgno: 376
  md: '![](img/e1ed1e3c1873fa9fc855210fb83699d0_376_0.png)


    B This is the same page in Internet Explorer 7 Notice that the buttons are no
    longer rounded and that the gradient is missing from the bottom of the portfolio
    image. These small touches add texture to the design, but are not essential to
    the site’s content or functionality.


    However, designing this way will take some special considerations. I recommend
    that you follow these simple guidelines:


    +   - Basic content is accessible to all browsers: A design may look different
    from browser to browser and device to device, but all of the same content is available,
    regardless of its presentation. However, be careful not to add styles that will
    prevent content from appearing. For example, you might think it looks cool to
    put white text on a white background with a text-shadow to make it pop. But what
    happens when the browser does not support text-shadows? The text disappears.


    +   - Basic functionality is accessible to all browsers: An interaction may not
    act exactly the same in all contexts, but the user can perform a function with
    the same outcome. For example, you can enhance menus with CSS transitions, drop-downs,
    and other flourishes; just make sure that every user can still use the same navigation.


    +   - Enhanced layout is provided by externally linked CSS: The content should
    be kept separate from the code used to style it. In other words, always place
    all styles in external style sheets (see Chapter 3).


    +   - The end user''s styles should be honored: Many Web surfers have customized
    styles set for their browser—often because of vision impairments—that allow them
    to use the Web most effectively. You shouldn’t get in the way of those styles.'
  merge: -1
  img_proc: true
- pgno: 377
  md: '# Graceful degradation


    This means that you can use styles like border-radius, box-shadow, text-shadow,
    and others that may not work in older browsers, as long as they do not prevent
    the user from using the site and all of its functionality when they do not appear.
    The design may not look equally polished in all situations, but the site still
    performs all necessary tasks.


    Graceful degradation might require you to use conditional styles for older versions
    of Internet Explorer, but generally, it should not take nearly as much extra work
    as pixel perfection.


    # Why should I use progressive enhancement?


    Pixel perfection has a strong track record in Web design, and it may take a while
    to convince clients and other teammates that progressive enhancement is a better
    way. However, I generally find these arguments do the trick:


    +   - **Faster to develop**—Rather than spending time kludging together a bunch
    of images for rounded corners, drop shadows, and other effects, a few lines of
    code take care of it all.

    +   - **Cheaper to maintain**—Changing code is much more cost effective than reworking,
    recutting, and redeploying images.

    +   - **Better looking**—Since the styles are native to the browser, they will
    display more precisely than images that are shoehorned in.


    If these arguments don''t sway your client, then compare a budget for designing
    with progressive enhancements to a pixel perfect budget. Usually the relative
    costs will convince even the most stubborn client to approve progressive enhancement.'
  merge: -1
  img_proc: true
- pgno: 378
  md: '# A Multi-Screen Strategy?


    The world of Web design is becoming an increasingly complex place to live. Just
    as computer screens get larger, browsers get more consistent, and connection speeds
    get faster, the landscape is undergoing a seismic shift to accommodate the smaller
    screens and slower speeds of mobile devices. The number of different screen sizes
    and resolutions is constantly growing. I won’t even bother to list the most common
    mobile devices in this book, because they will probably change between now and
    the time the book is published.


    So what’s a designer to do? You need to develop a multi-screen strategy, ensuring
    that your audience gets the best experience, regardless of what device is being
    used. There are several strategies you could deploy, but one is the clear leader:


    +   - Mobile app: You could build separate applications to run on the various
    devices. Unfortunately, since each device will require separate design and development,
    this can get expensive, or require you to ignore possible users.

    +   - Mobile site: You can build a site—with a separate URL—customized for mobile
    devices. Generally, these are built separately from the general Web site, take
    more design and development time, and are generally designed for the lowest-level
    browser.

    +   - Responsive design site: You can build a site that adapts to its environment
    using media queries. It may require a little extra work to adapt the design to
    different “break points,” but these sites will likely run efficiently on the widest
    number of devices.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_378_0.png)


    The Solar Energy Industries Association uses a responsive design multi-screen
    strategy that allows the same Web page to appear optimally across a wide range
    of screen sizes and user contexts.


    Of these three strategies, responsive design is the most promising. It uses the
    same HTML files for all browsers, then applies progressive enhancement to tweak
    the design for each device.


    Responsive design works simply by using CSS media queries to ask the device about
    its specific properties, and then delivering styles to tailor the HTML being displayed
    to best fit the environment it is being presented in.'
  merge: -1
  img_proc: true
- pgno: 379
  md: '# Resetting Browser Default Styles


    In Chapter 2, you learned about browser default styles. Recall that browser developers
    set the default styles applied by HTML tags. Before you get too far into the responsive
    design weeds, start by resetting those default styles to make sure they are the
    same regardless of the browser you are designing for.


    Far too many Web sites are designed by default A. The designers and developers
    allow the browser to have the final word on how the content is displayed. Additionally,
    all browser default styles are not the same. CSS resets were developed to level
    the playing field and help prevent “vanilla” designs B.


    The exact CSS reset you choose will depend on your design needs. I like to keep
    my reset simple, adding styles to specific tags only as needed. However, several
    styles are inconsistent or (in my opinion) poorly set in most browsers.


    Redefining important CSS properties (generally to none or 0) provides a few benefits:


    +   Reduces bad styles. Undoes some of the questionable and downright annoying
    styles added by browsers, and eliminates the styles that simply do not work. One
    example is using an outline to highlight items that are in focus, such as form
    fields. Although highlighting is useful for keyboard navigation, you should design
    this yourself.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_379_0.png)


    A page with no CSS applied.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_379_1.png)


    The same page with the simple reset applied.'
  merge: -1
  img_proc: true
- pgno: 380
  md: '+   - **Eliminates design by default.** Sets a level playing field from which
    to begin a design. Rather than allowing the browser to dictate your page appearance,
    you take control.


    +   - **Makes browser styles consistent.** Ensures that values across all browser
    types and versions are the same. Because browsers slightly vary their default
    style values, a good reset will allow your designs to appear with greater consistency
    regardless of how your visitor is viewing it.


    To use a CSS reset, simply add the desired code at the very top of your CSS code.
    That''s it. The code does the rest.


    # ## What Should You Reset?


    As a designer, I recommend resetting many of the typographic and box styles and
    then setting your own defaults. In addition to not allowing the browser to set
    the direction, another good argument for resetting styles is that different browsers
    have slightly different values.


    +   - **Padding, borders, and margins**—These are the main styles that designers
    like to reset, largely because they vary so much from browser to browser.


    +   - **Text underlining**—Never use the `text-decoration` property to underline
    text. I have never seen a design in which underlining did anything other than
    add visual noise, even for links. Instead of using `underline`, apply `border-bottom`
    to achieve a similar effect with more precise control that allows you to specify
    the thickness, color, and line style of the underline.


    +   - **Line height**—The default value for line height on text is 1em, which
    means that the text has little or no breathing room. All text can benefit by bumping
    this up to at least 1.4em.


    +   - **Outline**—Outlines are applied by some browsers to highlight elements,
    such as form fields, when they come into focus. Although this is a good idea for
    accessibility reasons, the nature of this highlight should be up to you, not the
    browser.


    +   - **Vertical alignment**—Vertical alignment is tricky to deal with and rarely
    works the way you expect. The best procedure is to set the vertical alignment
    to the baseline and then use relative positioning to move elements up or down
    manually.


    +   - **Other**—These are the basics, but most CSS resets will go beyond this,
    cleaning up other perceived problems, generally with specific tag implementation.'
  merge: -1
  img_proc: true
- pgno: 381
  md: "# # A simple CSS reset\n\nThe easiest way to reset styles is to use the universal\
    \ selector and set the default styles you want applied to all tags, as shown in\
    \ Code 14.2. Remember that you want to keep your CSS reset compact. Code 14.3\
    \ does the same thing but removes all spaces and returns.\n\nThis is a quick way\
    \ to reset the most important styles, but it has one drawback: IE6 does not recognize\
    \ the universal selector. If you are concerned about supporting IE6, you will\
    \ want to include all the HTML tags in the selector list. The advantage of using\
    \ the universal selector, other than compactness, is that it will always apply\
    \ itself to new HTML tags as they become available.\n\nCode 14.2 cssreset-simple.css—This\
    \ version of the CSS uses the universal selector to reset the browser default\
    \ values of several key properties, including margin, padding, border, outline,\
    \ line-height, vertical-align, and text-decoration.\n\n```\n```css\n/*** cssreset-simple.css\
    \ ***/\n* { margin: 0;\n   padding: 0;\n   border: 0;\n   outline: 0;\n   font-size:\
    \ 100%;\n   font-style: normal;\n   font-weight: normal;\n   line-height: 1;\n\
    \   vertical-align: baseline;\n   text-decoration: none; }\n```\n```\n\nCode 14.3\
    \ cssreset-simple.css—The same code as Code 14.2, but compressed by removing all\
    \ line breaks and spaces.\n\n```\n```css\n/*** cssreset-simple.css ***/\n*{margin:0;padding:0;outline:0;\n\
    font-size:100%;font-style:normal;\nfont-weight:normal;line-height:1;vertical-\n\
    align:baseline;text-decoration:none;}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 382
  md: "# Code 14.4 cssreset-YUI2.css—Developed by Yahoo, the YUI2 reset does a more\
    \ thorough job of overriding specific browser default styles.\n\n```\n/*** cssreset-YUI2.css\
    \ ***/\nbody,div,dl,dt,dd,ul,ol,li,h1,h2,h3,h4,h5,h6,\n pre,form,fieldset,input,textarea,p,\n\
    \ blockquote,th,td {\n margin:0;\n padding:0;\n }\ntable {\n border-collapse:collapse;\n\
    \ border-spacing:0;\n }\nfieldset,img {\n border:0;\n }\naddress,caption,cite,code,dfn,em,strong,th,var\
    \ {\n var {\n font-style:normal;\n font-weight:normal;\n }\nol,ul {\n list-style:none;\n\
    \ }\ncaption,th {\n text-align:left;\n }\nh1,h2,h3,h4,h5,h6 {\n font-size:100%;\n\
    \ font-weight:normal;\n }\nq:before,q:after {\n content:'';\n }\nabbr,acronym\
    \ {\n border:0;\n }\n```\n\n# YUI2: Reset CSS\n\nYahoo developed the YUI2: Reset\
    \ CSS to remove and neutralize inconsistencies in the default styling of HTML\
    \ elements, create a level playing field across browsers, and—according to their\
    \ documentation—provide a sound foundation upon which you can explicitly declare\
    \ your intentions (developer.yahoo.com/yui/reset/).\n\nThis CSS reset (Code 14.4)\
    \ addresses the styles of many specific HTML tags by zeroing them out, as well\
    \ as resolving some problems with font sizes, weights, and the use of quotation\
    \ marks"
  merge: -1
  img_proc: true
- pgno: 383
  md: "# Eric Meyer's reset\n\nPartially in response to Yahoo, noted Web pundit Eric\
    \ Meyer developed his own CSS reset script. According to his blog, he felt that\
    \ the Yahoo code went too far in some areas and not far enough in others. This\
    \ script (Code 14.5) is useful for resetting typographic styles (meyerweb.com/eric/tools/css/reset/).\n\
    \n> TIPS Applying styles globally to every tag puts a burden on the browser's\
    \ rendering engine. This is mostly an argument against using the universal selector\
    \ (*), which applies the styles to every tag. However, I have not seen any data\
    \ showing exactly that this lag occurs, nor have I detected any noticeable degradation\
    \ in my own tests, even on complex pages.\n\n# Code 14.5 cssreset-ericmeyer.css—Developed\
    \ by Eric Meyer; this reset is simpler than the Yahoo Reset.\n\n```\n/*** cssreset-ericmeyer.css\
    \ ***/\n/* v1.0 | 20080212 */\nhtml, body, div, span, applet, object, iframe,\n\
    h1, h2, h3, h4, h5, h6, p, blockquote, pre,\na, abbr, acronym, address, big, cite,\
    \ code,\ndel, dfn, em, font, img, ins, kbd, q, s, samp,\nsmall, strike, strong,\
    \ sub, sup, tt, var,\nb, u, i, center,\ndl, dt, dd, ol, ul, li,\nfieldset, form,\
    \ label, legend,\ntable, caption, tbody, tfoot, thead, tr,\nth, td {\n margin:\
    \ 0;\n padding: 0;\n border: 0;\n outline: 0;\n font-size: 100%;\n vertical-align:\
    \ baseline;\n background: transparent;\n}\nbody {\n line-height: 1;\n}\nol, ul\
    \ {\n list-style: none;\n}\nblockquote, q {\n quotes: none;\n}\nblockquote:before,\
    \ blockquote:after,\nq:before, q:after {\n content: \"\";\n content: none;\n}\n\
    /* remember to define focus styles! */\n:focus {\n outline: 0;\n}\n/* remember\
    \ to highlight inserts somehow! */\nins {\n text-decoration: none;\n}\ndel {\n\
    \ text-decoration: line-through;\n}\n/* tables still need 'cellspacing=\"0\"'\
    \ in the\nmarkup */\ntable {\n border-collapse: collapse;\n border-spacing: 0;\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 384
  md: "```\nOpen comment\nVersion of IE      Open if statement\n<!--[if IE]>\n   \
    \ <link href=\"ie.css\" rel=\"stylesheet\">\n<![endif]>\n            IE-specific\
    \ CSS\n            Close comment\nEnd if statement\n```\n\nA General syntax for\
    \ conditional statements. Anything placed between the comments will be used only\
    \ by the specified versions of Internet Explorer.\n\n# What Is Quirks Mode?\n\n\
    CSS implementations in early versions of Internet Explorer were full of bugs,\
    \ non-standard behaviors, and outright misinterpretations of the W3C standards.\
    \ Internet Explorer 6 and later versions corrected most of these “quirks,” but\
    \ if Web browsers had instantly switched to standards compliance, older Web sites\
    \ would have started breaking left and right.\n\nThe author was doctype switching\
    \ (see Chapter 2), which allowed designers to specify whether to support the old\
    \ quirks, the standards, or a hybrid of the two.\n\nIn theory, to set a mode,\
    \ all you have to do is set a doctype:\n\n+   - Quirks mode—Used by the browser\
    \ if it detects that the page is not standards compliant or if it uses the traditional\
    \ doctype. This basically renders the page as if it were IE6.\n+   - Strict mode—Uses\
    \ the standards as defined by the particular browser and uses the strict doctype.\n\
    +   - Almost Standards mode—Firefox, Safari, and Opera (versions 7.5 and later)\
    \ have a third mode that uses all of the CSS2 standards except for table cell\
    \ vertical sizing.\n\n# Adjusting CSS for Internet Explorer\n\nAlthough Internet\
    \ Explorer no longer has the dominant position it once held over the Web, it is\
    \ still a major player and not to be ignored. However, you will face problems\
    \ if you have to support IE6, IE7, and IE8 in quirks mode (see the sidebar “What\
    \ Is Quirks Mode?”).\n\nIE9 and 10 have changed this by adding full CSS3 and HTML5\
    \ compatibility and are quickly replacing older versions of the browser. However,\
    \ the reality is that you will likely need to include code to tailor your design\
    \ to Internet Explorer for some time to come.\n\nFortunately, Internet Explorer\
    \ allows us to add conditional styles that will be applied only to Internet Explorer,\
    \ even only to specific versions of Internet Explorer. Internet Explorer (and\
    \ only Internet Explorer) has the ability to interpret conditional statements\
    \ (if this … then do that) that are ignored by other browsers A. This allows you\
    \ to insert links to style sheets that can tailor your CSS for any version of\
    \ Internet Explorer and create designs that respond to those special conditions."
  merge: -1
  img_proc: true
- pgno: 385
  md: '# To set up conditional styles for Internet Explorer:


    +   1. Add a conditional comment, specifying the version of IE you want to target.
    Within an HTML comment, use an if statement within square brackets and specify
    which version of Internet Explorer the CSS overrides should be used with (Code
    14.6):


    ```

    <!--[if IE]>

    ```


    Table 14.1 shows the possible logical operators you can include for targeting
    specific browsers or a range of browser versions.


    Using just IE will cause the CSS to be used in any version of Internet Explorer.
    Adding a space followed by a number will specify the version number. For example,
    IE 6 allows CSS to be used only in Internet Explorer 6 regardless of the doctype.


    +   2. Add the IE-specific CSS for the browser version(s). This value will override
    previous values for that property for standard CSS. This can be embedded in the
    head of your document using the <style> tag or imported using the <link> tag or
    @import rule:


    ```

    <style type="text/css" media="all">

    @import url("../css/ie-fix.css");

    </style>

    ```


    # TABLE 14.1 IE Conditionals


    | Conditional | Any version of IE |

    |---|---|

    | lt IE <version> | Versions less than version |

    | lte IE <version> | Versions less than or equal to version |

    | IE <version> | Specific version |

    | gte IE <version> | Versions greater than or equal to version |

    | gt IE <version> | Versions greater than version |

    | IEMobile | Mobile version of Internet Explorer |

    | | Not—Can be added to any other conditional |'
  merge: -1
  img_proc: true
- pgno: 386
  md: 'Code 14.6 Add this code to the head of Code 14.1. It loads a specialized style
    sheet (Code 14.7) that corrects a color problem in the header for Internet Explorer,
    and makes those new HTML5 tags all block level so that they will properly respond
    to styles. It also loads the JavaScript file you created in Chapter 2 (Code 2.3)
    that “teaches” the new HTML5 tags to older versions of Internet Explorer [B] 13


    ```

    <!--[if IE ]>

    <style type="text/css" media="all">

    @import url("../css/ie-fix.css");

    </style>

    <![endif]-->

    ```


    ```

    <!--[if lte IE 8]>

    <script type="text/javascript"

    src="./script/HTML5forIE.js"></script>

    <![endif]-->

    ```


    Code 14.7 /e-fix.css—Styles are used to override styles from previous CSS files
    to display the page as well as possible in Internet Explorer.


    ```

    /*** ie-fix.css ***/

    /*** color & background properties ***/

    header h1 {

    color: rgb(255,153,153);

    }

    /*** box properties ***/

    article,aside,canvas,details,dialog,

    eventsource,figure,footer,header,hgroup,

    mark,menu,meter,nav,output,progress,

    section,time,video { display: block; }

    ```


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_386_0.png)


    The header in most modern browsers. The header is a dark red set against a textured
    background for contrast, but Internet Explorer does not support text shadows.


    +   3. Close the conditional comment. Close your conditional comment with an endif
    in brackets:


    ```

    <!--[endif]-->

    ```


    > TIP Because IE9 is promising HTML5 and CSS3 compatibility, I recommend setting
    your IE conditional to “let IE 8,” which will apply the overrides only to versions
    of Internet Explorer less than or equal to 8.


    > TIP Although you can add specific code for different versions of Internet Explorer,
    try to keep the number of links and imports to a minimum. The more external files
    you bring in, the longer it will take your Web page to load.


    > TIP Add an exclamation mark before any of the conditionals and it becomes a
    “not” (for example, It IE 9 = not less than version 9).


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_386_1.png)


    The header in Internet Explorer. Although it looks much the same, the header is
    now a brighter red, since the text shadow property is not available.'
