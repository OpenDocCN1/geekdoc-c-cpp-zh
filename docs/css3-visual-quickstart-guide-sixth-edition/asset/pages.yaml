- pgno: 109
  md: "# Styling for interaction\n\nOnce loaded, Web pages are far from static. Users\
    \ will start interacting with the page right away, moving their pointers across\
    \ the screen and clicking hither and yon. The dynamic pseudo-classes allow you\
    \ to style elements as the user interacts with them, providing visual feedback:\n\
    \n+   - :hover—Same as for links, but sets the appearance of the element when\
    \ the pointer is hovering over it.\n+   - :focus—Applied to elements that can\
    \ receive focus, such as form text fields.\n+   - :active—Same as for links, but\
    \ sets the style of the element when it is clicked or selected.\n\n# To define\
    \ a dynamic pseudo-class:\n\n+   1. Style the default element.\n+      `input\
    \ {...}`\n+      Although optional, it's generally a good idea to set the default,\
    \ non-dynamic style for the elements receiving dynamic styles (Code 4.7).\n+ \
    \  \n+   2. Style the hover state of the element.\n+      Type the selector (HTML,\
    \ class, or ID), a colon (:), and then hover.\n+      `input:hover {...}`\n+ \
    \     As soon as the pointer enters the element's box (see Chapter 10 for details\
    \ about the box model), the style change will occur.\n\n# Code 4.7 The input elements,\
    \ with a special style for the button type, are set to change style when the user\
    \ interacts with them by hovering, selecting (focus), or clicking (active).\n\n\
    ```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n\
    \  <title>Alice&amp;8217;s Adventures in Wonderland</title>\n  <style type=\"\
    text/css\" media=\"all\">\n  input {\n    border: 3px solid gray;\n    background-color:\
    \ silver;\n    color: gray;\n    padding: 0 5px;\n    font-size: 1.5em; }\n  input[type=\"\
    button\"] {\n    border-radius: 1em;\n    color: silver;\n    background-color:\
    \ gray; }\n  input:hover {\n    background-color: white;\n    border-color: pink;\n\
    \    color: silver; }\n  input:focus {\n    border-color: red;\n    background-color:\
    \ white;\n    color: black;\n    outline: none; }\n  input:active {\n    color:\
    \ red;\n    border-color: pink;\n    background-color: silver; }\n  </style>\n\
    </head>\n<body>\n  <footer>\n    <label>Mailing list:</label>\n    <input type=\"\
    text\" value=\"email\"\n      . placeholder=\"enter your email\">\n    <input\
    \ type=\"button\" class=\"active\"\n      . value=\"submit\">\n  </footer>\n</body>\n\
    </html>\n```"
  merge: -1
  img_proc: true
- pgno: 110
  md: "# Default\n\nMailing List: email submit\n\n# Hover\n\nMailing List: email submit\n\
    \n# Active\n\nMailing List: email submit\n\n# Focus\n\nMailing List: email submit\n\
    \nThe results of Code 4.7. This shows a simple form field in the four dynamic\
    \ states. Providing this visual feedback can help users know which form field\
    \ is ready for use or that they have clicked a button.\n\n> TIP I recommend caution\
    \ when changing some attributes for :hover. Changing typeface, font size, weight,\
    \ and other properties may make the text grow larger or smaller than the space\
    \ reserved for it in the layout and force the whole page to reflow its content,\
    \ which can really annoy visitors.\n\n> TIP In this example, input is used to\
    \ show the dynamic states. The input has one styling drawback in that all input\
    \ types use the same tag. Later in this chapter, you will see how to use tag attributes\
    \ to set styles, which will allow you to set different styles for text fields\
    \ and buttons.\n\n+   3. Style the focus state of the element. Type the selector\
    \ (HTML, class, or ID), a colon (:), and then focus.\n+   \n+   input:focus {...}\n\
    +   \n+   As soon as the element receives focus (is clicked or tabbed to), the\
    \ style change occurs and then reverts to the hover or default style when the\
    \ element loses focus (called blur).\n\n+   4. Style the active state of the element.\
    \ Type the selector (HTML, class, or ID), a colon (:), and then active.\n+   \n\
    +   input:active {...}\n+   \n+   As soon as the user clicks within the element's\
    \ box (explained in Chapter 10), the style change will occur and then revert to\
    \ either the hover or default style when released.\n\n+   5. The styles are applied\
    \ to the elements' states as necessary in reaction to the user.\n+   \n+   <input\
    \ type=\"button\" value=\"Submit\">\n+   \n+   All the tags using the specific\
    \ selector will have their states styled.\n\n> TIP The order in which you define\
    \ your link and dynamic pseudo-classes makes a difference. For example, placing\
    \ the :hover pseudo-class before the :visited pseudo-class keeps :hover from working\
    \ after a link has been visited. For best results, define your styles in this\
    \ order: link, visited, hover, focus, and active.\n\n> TIP One way to remember\
    \ the pseudo-element order is the mnemonic LoVe HAte: Link Visited Hover Active.\n\
    \n> TIP You will want to always set :focus if you're setting :hover. Why? Hover\
    \ is applied only to non-keyboard (mouse) interactions with the element. For keyboard-only\
    \ Web users, :focus will apply."
  merge: -1
  img_proc: true
- pgno: 111
  md: '# ★Styling specific children with pseudo-classes


    Designers often want to apply a style to an element that is the first element
    to appear within another element, such as a parent''s first child.


    The first-child pseudo-element has been available since CSS2; however, CSS3 offers
    an assortment of new structural pseudo-elements for styling an element''s child
    element exactly (Table 4.4):


    +   - :first-child—Sets the appearance of the first instance of a selector type
    if it is the first child of its parent.

    +   - :first-of-type—Sets the appearance of an element the first time its selector
    type appears within the parent.

    +   - :nth-child(#)—Sets the appearance of the specific occurrence of the specified
    child element. For example, the third child element of a paragraph would be p:nth-child(3).

    +   - :nth-of-type(#)—Sets the appearance of the specific occurrence of a selector
    type within the parent. For example, the seventh paragraph would be p:nth-of-type(7).

    +   - :nth-last-of-type(#)—Sets the appearance of the specific occurrence of a
    selector type within the parent, but from the bottom. For example, the third paragraph
    from the bottom would be p:nth-last-of-type(3).

    +   - :last-child—Sets the appearance of the element of the indicated selector
    type if it is the last child of the parent.

    +   - :last-of-type—Sets the appearance of the last instance of a particular selector
    type within its parent.


    # Text Decoration: To Underline or Not


    Underlining is the standard way of indicating a hypertext link on the Web. However,
    the presence of many underlined links turns a page into an impenetrable mass of
    lines, and the text becomes difficult to read. In addition, if visitors have underlining
    turned off, they cannot see the links, especially if the link and text colors
    are the same.


    CSS allows you to turn off underlining for links, overriding the visitor''s preference.
    I recommend this practice and prefer to rely on clear color choices to highlight
    hypertext links or to rely on the alternative underlining method of border-bottom,
    which allows you better control over the style of the underline. See Chapter 14
    for more information.'
  merge: -1
  img_proc: true
