- pgno: 169
  md: '+   3. Add style overrides as needed. You can override italics or oblique by
    setting the font style for a child element to normal.


    Many browsers do not differentiate between italic and oblique but will simply
    use the fonts'' italic version (if available), even when they are set to oblique.


    TIP If an italicized or oblique version of the typeface does not exist, many browsers
    will attempt to synthesize one by slanting the normal version of the font to the
    right. This rarely looks good and should be avoided.


    TIP Many Web designers underline words to draw visual attention to them. I recommend
    using italic or oblique text instead. Underlining often causes the page to look
    cluttered. More important, underlined text might be confused with hypertext links.


    TIP Italicized text generally fits into a more compact space than non-italic text
    (called roman in traditional typesetting terms) and could be used to save screen
    space. But be careful—at small point sizes, italic can be difficult to read on
    the screen.'
