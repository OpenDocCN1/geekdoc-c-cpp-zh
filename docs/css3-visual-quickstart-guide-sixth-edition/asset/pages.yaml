  md: '# Normal SMALLCAPS


    With small caps, all the letters are uppercase, but the first letter is larger
    than the others.


    | Value | | | | | | |

    |---|---|---|---|---|---|---|

    | normal | | | | | | |

    | small-caps | | | | | | |


    Code 5.9. Styles added to font-properties.css— Small caps are applied to both
    header 1 and header 2, but disabled in the strong element within the h2. Note
    that the font-variant declaration was changed in the @font-face to small-caps
    rule so that the downloaded font will display in the h1.


    ```

    h1 { font-variant: small-caps; }

    h2 { font-variant: small-caps; }

    ```


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_172_0.png)


    Using small caps for the title is an elegant way to set it off from the rest of
    the text.


    # Creating Small Caps


    Small caps (sometimes referred to as mini-caps) are useful for emphasizing titles
    (Table 5.11). With small caps, lowercase letters are converted to uppercase but
    in a slightly smaller size than regular uppercase letters


    # To set small caps for an element:


    +   1. Add the font variant property to your CSS. Type the property name font-variant
    (Code 5.9), followed by a colon (:). font-variant:


    +   2. Define a value for the variant. small-caps; Type the value of the font-variant
    property, using one of the following options:


    +   small-caps, which sets lowercase letters as smaller versions of true uppercase
    letters


    +   normal, which overrides other font-variant values that might be inherited


    > TIP Small caps are best reserved for titles or other special text; they can
    be hard to read at smaller sizes.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# # Setting Multiple Font Values at the Same Time


    Although you can set font properties independently, it is often useful, not to
    mention more concise, to put all font elements in a single declaration (Table
    5.12). To do this, use the shorthand font property.


    # ## To define several font attributes simultaneously in a rule:


    +   1. Add the font property to your CSS. Type the property name font (Code 5.10),
    followed by a colon (:). Then type the values in the same order that they are
    typed in the remaining steps of this exercise.

    +   font:

    +   2. Optional Define a style value. Type a font-style value, followed by a space.
    (See “Making Text Italic” in this chapter.) italic


    | Value | | | | | | |

    |---|---|---|---|---|---|---|

    | <font-style> | ● | ● | ● | ● | ● | ● |

    | <font-variant> | ● | ● | ● | ● | ● | ● |

    | <font-weight> | ● | ● | ● | ● | ● | ● |

    | <font-size> | ● | ● | ● | ● | ● | ● |

    | <line-height> | ● | ● | ● | ● | ● | ● |

    | <font-family> | ● | ● | ● | ● | ● | ● |

    | visitor styles | ● | ● | ● | ● | ● | ● |


    Code 5.10 Changes to font.properties.css— Wherever possible, the font properties
    have been combined into the shorthand font property. This requires that the size,
    font family, and at least one of the other font properties are defined.


    ```

    ```css

    /* font-properties.css */

    body { font: normal 100%/1.5 "BodyCopy",

    Constantia, Georgia, "Times New Roman",

    serif; }

    h1 { font: italic bold small-caps 5em/9

    "TitleCopy", Corbel, Helvetica, Arial,

    sans-serif; }

    ```

    ```


    # ## Mimicking the Visitor''s Styles


    Wouldn''t it be nice if you could match your visitor''s system font styles? You
    can do this by simply declaring the font style to be one of the following keywords
    (for example, font: icon;):


    +   - caption: the font style used by controls, such as buttons

    +   - icon: the font style used to label icons

    +   - menu: the font style used in drop-down menus and menu lists

    +   - message-box: the font style used in dialog boxes

    +   - small-caption: the font style used for labeling small controls

    +   - status-bar: the font style used in the window''s status bar at the top of
    the window'
