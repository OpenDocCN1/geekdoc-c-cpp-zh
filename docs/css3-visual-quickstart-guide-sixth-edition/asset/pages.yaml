  md: '# To add a transition effect between states:


    +   1. Add the transition property.


    +   -webkit-transition:

    +   -moz-transition:

    +   -o-transition:

    +   transition:


    Include versions for the browser extensions including Webkit, Mozilla, Opera,
    and standard CSS3, including the standard property at the bottom of the list (Code
    12.4).


    Code 12.4 Added to transition-properties.css— When applied to Code 12.1, transitions
    are now applied to the color, opacity, and transformations, resulting in a gradual
    rather than instant change. Note that I also added a hover state for the figures.
    You can’t have a transition without a style change, and the easiest way to add
    a change is with the :hover pseudo-class.


    ```

    /** transition-properties.css ***/

    aside, figure, a {

    -webkit-transition: color .25s ease-in,

    opacity .5s ease, -webkit-transform

    .25s ease-in-out 0;

    -moz-transition: color .25s ease-in,

    opacity .5s ease, -moz-transform .25s

    ease-in-out 0;

    -o-transition: color .25s ease-in,

    opacity .5s ease, -o-transform .25s

    ease-in-out 0;

    transition: color .25s ease-in,

    opacity .5s ease, transform .25s

    ease-in-out 0; }

    div.gallery figure#f1:hover, div.gallery

    figure#f2:hover, div.gallery figure#f3:hover {

    -webkit-transform: rotate(0);

    -moz-transform: rotate(0);

    -o-transform: rotate(0);

    transform: rotate(0);

    cursor: pointer; }

    ```


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_343_0.png)


    With the scale transform, the transition is through sizes.'
