- pgno: 139
  md: '# 3. Add other styles.


    ```

    font-size: 3em;

    ```


    Add any other declarations you wish for this rule, making them !important or not,
    as you desire.


    !important is a powerful tool, second only to inline styles for determining style
    cascade. !important is great for debugging your CSS; but, because it can interfere
    with making changes later, it should never be used in the final Web site code.


    Setting a shorthand property to !important (background, for example) is the same
    as setting each sub-property (such as background-color) to be !important.


    TIP A common mistake is to locate !important after the semicolon in the declaration.
    This causes the browser to ignore the declaration and, possibly, the entire rule.


    TIP If you are debugging your style sheet and can''t get a particular style to
    work, try adding !important to it. If it still doesn''t work, the problem is most
    likely a typo rather than another overriding style.


    TIP Many browsers allow users to define their own style sheets for use by the
    browser. Most browsers follow the CSS 2.1 specification in which a user-defined
    style sheet overrides an author-defined style sheet.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# # Determining the Cascade Order


    Within a single Web page, style sheets may be linked, imported, or embedded. Styles
    may also be declared inline in the HTML.


    In addition, many browsers allow visitors to have their own style sheets that
    can override yours. It''s guaranteed, of course, that simultaneous style sheets
    from two or more sources will have conflicting declarations. Who comes out on
    top?


    The cascade order refers to the way styles begin at the top of the page and, as
    they cascade down, collect and replace each other as they are inherited. The general
    rule of thumb is that the last style defined is the one that is used.


    However, at times, two or more styles will conflict. Use the following procedure
    to determine which style will come out on top and be applied to a given element.'
  merge: -1
  img_proc: true
- pgno: 141
  md: "# To determine the cascade-order value for an element:\n\nCollect all styles\
    \ that will be applied to the element. Find all the inherent, applied, and inherited\
    \ styles that will be applied to the element, and then use the following criteria\
    \ to determine which styles are applied in the cascade order, with the criteria\
    \ at the top being most important A\n\n+   1. User styles\n+   Most Web browsers\
    \ allow users to specify their own default style sheets. In principle, these always\
    \ have precedence over other styles.\n\n+   2. Inline styles\n+   If the style\
    \ is inline (see Chapter 3), it is always applied regardless of all other factors.\
    \ That's why you should never use them in your final HTML code.\n\n+   3. Media\
    \ type\n+   Obviously, if the media type is set for a style and element that is\
    \ not being displayed in that media type, the style will not be used.\n\n+   4.\
    \ Importance\n+   Including !important with a declaration gives it top billing\
    \ when displayed. (See “Making a Declaration Important” in this chapter.)\n+ \
    \  \n+   Many browsers let users define their own style sheets for use by the\
    \ browser. If both the page author and the visitor have included !important in\
    \ their declarations, the user's declaration wins.\n+   \n+   In theory, an author's\
    \ style sheets override a visitor's style sheets unless the visitor uses the !important\
    \ value. In practice, however, most browsers favor a user's style sheet when determining\
    \ which declarations are used for a tag.\n\n![](img/e1ed1e3c1873fa9fc855210fb83699d0_141_0.png)\n\
    \nA The cascade order from most important to least important."
  merge: -1
  img_proc: true
- pgno: 142
  md: '# 5. Specificity


    The more contextually specific a rule is, the higher its cascade priority. So
    the more HTML, class, and ID selectors a particular rule has, the more important
    it is. In determining this priority, ID selectors count as 100, classes count
    as 10, and HTML selectors are worth only 1. Thus,


    ```

    #copy p b { color: red; }

    ```


    is worth 102, whereas


    ```

    b { color : lime; }

    ```


    is worth only 1. So, the first rule would have higher specificity and the color
    would be red.


    This priority setting may seem a bit silly at first, but it allows context-sensitive
    and ID rules to carry more weight, ensuring that they will be used.


    # 6. Order


    If the conflicting declarations applied to an element are equal at this point,
    CSS gives priority to the last rule listed, in order. Remember that inline styles
    always win.


    # 7. Inherited


    These styles are inherited from the parent.


    # 8. Inherent


    These styles are applied by the browser to HTML tags and are the least important.'
  merge: -1
  img_proc: true
