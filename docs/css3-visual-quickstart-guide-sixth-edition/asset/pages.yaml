- pgno: 399
  md: '# Define colors, fonts, and other constants


    It''s sometimes difficult to keep track of all the values that you are using in
    your design. It''s unlikely that CSS will ever include constants, so it will help
    to keep notes in an easy-to-reference location in your document. Creating a glossary
    of colors and types leads to more consistent and attractive designs (Code 15.2).


    # Use section headers


    Although section headers and dividers really aren''t anything more than CSS comments,
    they do help organize your CSS and allow you to quickly scan your code to locate
    particular CSS rule groups. If you have established a TOC, I recommend reflecting
    that organization here. In this example (Code 15.3), I''m using asterisks to indicate
    a section level.


    # The @ rules go at the top


    All of the CSS rules starting with @ (@media, @font-face, @import) must be placed
    above any other CSS in the external style or embedded style sheet. In addition
    to making these rules easier to find, many of them won''t work unless they''re
    placed at the top.


    # Choose an organization scheme


    You should choose a consistent organization pattern and stick to it. I''m not
    going to tell you how to organize your style sheets—that depends on what works
    for you—but here are a few ideas to consider:


    +   Organize by selector type. Start with HTML selectors, then IDs, and then classes.


    +   Organize based on page structure. Group rules based on their parent tags.
    This works even better with HTML5 because page structure is stronger. The downside
    occurs when the same rules need to be applied at different places in the page.
    You don''t want redundant code, so it''s best to separate those rules out into
    their own section.


    +   Organize based on purpose. Group rules based on which element you''re applying
    a style to. Instead of being grouped according to where the element is in the
    page, the styles are grouped based on their content, module, functionality, or
    other specific use (such as headings, typography, ads, article, asides, layout
    grid, and so on.)


    +   Organize alphabetically. Literally list the selectors in alphabetical order.
    No, really. I''ve never used this method, but I''ve heard several developers swear
    by it. To me, it seems like a lot of work to maintain this organization scheme.
    Plus, what if you need to override a style later in the cascade, but it doesn''t
    fit alphabetically?


    You can use one of these methods, a combination of these methods, or a method
    you make up yourself. The key is to be consistent.'
  merge: -1
  img_proc: true
