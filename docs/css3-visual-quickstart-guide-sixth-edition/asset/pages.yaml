    +   3. Add more transformations as needed.


    ```

    transform: scale(.75) rotate(3deg);

    ```


    You can include multiple transformation values separated by a space.


    +   4. Specify the transformation origin, if it is not the center of the element.


    ```

    -webkit-transform-origin: 0, 25%;

    -moz-transform-origin: 0, 25%;

    -o-transform-origin: 0, 25%;

    transform-origin: 0, 25%;

    ```


    By default, all transformations use the center of the element as the point of
    origin. Thus, a rotate transform will rotate around the middle of the element.


    To change this, add the transform() property with one or two values for the X
    and Y location of the origin (Table 12.2) as a percentage, length, or a keyword
    (Table 12.3). If you specify only a single value, it is used for both X and Y
    values. Positive values move the origin up and to the left of the element, whereas
    negative values move the origin down and to the right of the center of the element.'
  merge: -1
