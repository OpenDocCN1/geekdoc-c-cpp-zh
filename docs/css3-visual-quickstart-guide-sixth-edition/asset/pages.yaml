- pgno: 328
  md: '# Transformation and Transition Properties


    Although the use of transform and transition properties is still somewhat controversial,
    the ability to apply these changes to elements without using JavaScript will be
    a boon for Web designers and developers. Think of these as temporal styles that
    not only change the appearance of an element—as do other styles—but also change
    that element’s appearance over time and space.


    The styles presented in this chapter are extremely new, at least by Web standards.
    Although Webkit has had them in one form or another for a while and Firefox and
    Opera have started adopting them, it is only recently that many of them have been
    added to Internet Explorer and that work has started toward making them part of
    the standard CSS3 canon. I’d approach these with some caution while making sure
    they degrade gracefully in older browsers, but I can’t wait to see how you use
    them.


    +   In This Chapter

    +   Getting Started 308

    +   Transforming an Element 311

    +   Adding Transitions Between Element States 320

    +   Putting It All Together 325'
  merge: -1
  img_proc: true
