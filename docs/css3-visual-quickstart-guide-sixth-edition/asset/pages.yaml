- pgno: 225
  md: "# # Setting a Background Color\n\nThe ability to set the background color on\
    \ an HTML page has been around almost since the first Web browsers. However, with\
    \ CSS you can define the background color, not only for the entire page, but also\
    \ for individual elements using the background-color property (Table 7.6). Unlike\
    \ the color property, though, background colors are applied only to the element,\
    \ and are not directly inherited by its children. That said, by the very fact\
    \ they are within the parent, they will be set against that background.\n\n# ##\
    \ To define the background color of an element:\n\n+   1. Add the background color\
    \ property to your declaration list. Start your declaration by typing background-color\
    \ (Code 7.3), followed by a colon (:).\n\n+   2. Specify the color value. Type\
    \ a value for the background color. This value can be the name of the color or\
    \ an RGB value.\n\n```\nrgb(102,0,0);\n```\n\nAlternatively, you could type transparent,\
    \ which would allow the parent element's background color to show through, or\
    \ currentcolor to use the value of the color property.\n\n> > TIP The default\
    \ state for an element's background color is transparent, so the parent element's\
    \ background will show through unless the background color or image for that particular\
    \ child element is set.\n\n| Value | | | | | | | | |\n| --- | --- | --- | ---\
    \ | --- | --- | --- | --- | --- |\n| <color> | | | | | | | | |\n| inherit | |\
    \ | | | | | | |\n\nCode 7.3 Added to color-background-properties. css—Background\
    \ colors can be set as solid or transparent A.\n\n```\n/*** color-background-properties.css\
    \ ***/\nbody {\n  background: rgb(76,76,76); }\nheader.page {\n  background: rgb(102,0,0);\
    \ }\narticle {\n  background-color: rgb(242, 237, 217)); }\nfigure {\n  background-color:\
    \ rgb(242, 237, 217); }\nfooter {\n  background-color: rgb(0,0,0); }\n```\n\n\
    > > TIP You can also set the background color using the background property, as\
    \ described later in this chapter in “Using Background Shorthand to Add Multiple\
    \ Background Images and Gradients.”\n\n> > TIP Some older browsers had incomplete\
    \ HTML5 support, so you may see variation in the displayed appearance of your\
    \ code. For example, Safari 4 did not support backgrounds in HTML5-specific tags\
    \ such as <header> unless they have display: block set (see Chapter 10):"
  merge: -1
  img_proc: true
- pgno: 226
  md: '# # Setting Background Images


    Beyond the ability to set an image as the background of an element, CSS includes
    several properties that offer you great flexibility in the exact placement of
    the image:


    +   - **Repeat**—Sets whether the image tiles appear only once or repeat only
    horizontally or vertically.

    +   - **Attachment**—Sets whether the image scrolls with the rest of the page
    or stays in one place.

    +   - **Position**—Moves the image to the left and down (positive values) or to
    the right and up (negative values) from the top-left corner of the parent element.

    +   - **Size**—Sets the width and height of the image within the element''s background
    as an absolute length, percentage, or the keywords `cover`, `contain`, or `auto`
    (which maintains the aspect ratio).

    +   - **Clip**—Sets whether the background fits to the border or just within the
    content area.

    +   - **Origin**—Sets the position of the background relative to the border, padding,
    or content. This is especially useful for setting the background of inline elements
    that might break across multiple lines.

    +   - **Multiple background images**—Although not a specific property, CSS now
    allows you to layer multiple background images using a comma-separated list.


