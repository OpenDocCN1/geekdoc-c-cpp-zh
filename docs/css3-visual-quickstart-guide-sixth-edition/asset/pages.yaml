- pgno: 189
  md: "# # Text shadow effects\n\nAlthough it may seem like a simple effect, the text\
    \ shadow offers a lot of power to designers beyond producing simple three-dimensional\
    \ shadows. Because the shadow can be any color and you can stack numerous shadows\
    \ on top of each other, you can create a wide variety of great special effects\
    \ with them.\n\nHere are just a few examples that I created classes for:\n\n![](img/e1ed1e3c1873fa9fc855210fb83699d0_189_0.png)\n\
    \n# ## Blur\n\nBlur creates the illusion that the text is out of focus. Stack\
    \ shadows with the same color as the text, but with increasing amounts of blur\
    \ to make the text look blurry.\n\n```\n.blur {\n\tbackground-color: #ccc;\n\t\
    color: rgba(0,0,0,1);;\n\ttext-shadow: 0px 0px 2px rgba(0,0,0,1),\n\t\t0px 0px\
    \ 4px rgba(0,0,0,1),\n\t\t0px 0px 8px rgba(0,0,0,1);\n}\n```\n\n![](img/e1ed1e3c1873fa9fc855210fb83699d0_189_1.png)\n\
    \n# ## Letterpress\n\nLetterpress text looks as if old-style print press letters\
    \ were used. To create the effect, use low contrast or no-contrast between the\
    \ text and background colors, and then add a drop shadow with 1px offset down\
    \ and white with 30% opacity. If you are using dark colors, use up and black with\
    \ 30% opacity.\n\n```\n.letterpress {\n\tbackground-color: #333;\n\tcolor: #222;\n\
    \ttext-shadow: 0px 1px 1px -rgba(255,255,255,.3),\n\t\t0px -1px 1px rgba(0,0,0,.3);\n\
    }\n```"
  merge: -1
  img_proc: true
