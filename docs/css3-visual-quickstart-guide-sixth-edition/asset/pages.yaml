- pgno: 410
  md: '# If all else fails, try these ideas


    If you''ve looked for the preceding errors and still can''t get your code to work,
    here are a few more things to try:


    +   - **Make the declaration !important.** Often, your declarations will conflict
    with each other, and it may be hard to track down where the conflict is. Adding
    !important to the declaration (see “Making a Declaration !important” in Chapter
    4) will ensure that if it is working, it is applied to the page.

    +   - **Delete the rules and retype them.** When you can’t see what’s wrong, retyping
    code from scratch sometimes fixes the problem.

    +   - **Test the same code on another browser and/or operating system.** It’s
    possible that a property is buggy and doesn’t work correctly in your browser.
    It’s even possible that the browser doesn’t allow that property to work with that
    tag.

    +   - **Give up and walk away.** Just joking—although you might want to take a
    15-minute break before looking at the problem again.

    +   - **If nothing else works...** Try a different solution for your design.'
  merge: -1
  img_proc: true
- pgno: 411
  md: '# # View CSS in Firebug or Web Inspector


    Most Web designers work in Firefox, Safari, or Chrome while they are developing
    because all three have excellent add-ons and built-in tools for analyzing and
    editing code. For Firefox, this functionality is provided by the Firebug add on,
    while both Safari and Chrome use the Web Inspector provided with Webkit.


    Both tools allow on-the-fly editing of the CSS and HTML of the Web page you are
    viewing, which allows you to modify and debug your code on your local computer
    without affecting the live version. Although each tool has many unique features,
    both share several key capabilities for working with CSS:


    +   - Highlight elements. As you roll over elements in the screen, they are highlighted
    in the HTML code or vice-versa.


    +   - View all rules applied to an element. As elements are selected, the applied
    CSS code is displayed, showing declarations that have been overridden or crossed
    out.


    +   - Turn declarations on and off. You can selectively enable and disable declarations
    to see how they affect the design.


    +   - Edit declaration properties and values. In addition to switching declarations
    on and off, you can directly edit or add them to a rule.


    +   - View errors. Display any HTML or CSS errors encountered.'
  merge: -1
  img_proc: true
- pgno: 412
  md: '# # Firebug for Firefox (Win/Mac)


    The Firebug plug-in tool for Firefox has become the de facto standard for Web
    designers everywhere A. You can get it from the Firefox add-ons Web site or directly
    from the Firebug Web site, getfirebug.com.


    # ## Getting started with Firebug


    +   1. Open the Firebug panel. Navigate to the Web page you want to look at and
    then click the Firebug icon in the lower right of the browser window or choose
    View > Firebug.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_412_0.png)


    A Firebug in Firefox.'
  merge: -1
  img_proc: true
- pgno: 413
  md: '+   2. View the CSS. You can view the CSS by itself by clicking the CSS tab,
    or view it side by side with the HTML by clicking the HTML tab. I generally work
    in side-by-side mode.


    +   3. Inspect an element. Click the Inspect button and then click the element
    in the screen you want to inspect. As you hover over an element, its box will
    be outlined with color-coded margins and padding. Firebug also highlights the
    element in the HTML code and displays all of the CSS being applied. Declarations
    are crossed out if they have been overridden by other declarations and are not
    being applied. Click to select an element for editing.


    +   4. Turn off a declaration. Hover to the left of the property name in the declaration,
    and a not symbol (Ø) appears. Click it to turn off the property, and click it
    again to turn on the property. In the viewport, you immediately see the effect
    of turning the property on and off.


    +   5. Edit a declaration. Double-click the property name or value and you can
    type a new one. The effects of any changes will be visible almost immediately
    as you type.


    +   6. Add a new declaration. Double-click the empty space to the right of the
    declaration you want to precede your new declaration, type the property name,
    press Tab, and then type the property value. Do not type the closing semi-colon
    (;). Changes appear instantly as you type.'
  merge: -1
  img_proc: true
