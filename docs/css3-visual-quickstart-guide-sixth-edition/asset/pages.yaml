- pgno: 153
  md: '# 5. Add typeface overrides.


    After a font is set for the body of the page, it will be used in all text throughout
    the entire Web page, with the exception of text in forms. You need to add another
    font-family declaration to your CSS only if you want to change the font for a
    particular element. This is because properties cascade to their child elements,
    as described in Chapter 4.


    The exception to the cascade rule are form elements such as input, text, area,
    button, and so on, which require their fonts to be set in the form element to
    cascade down.


    ```

    font-family: Corbel, Helvetica, -Arial, serif;

    ```


    If you will be using bold, italic/oblique, and/or bold italic/oblique versions
    of the font, be sure that the font family supports all of these typefaces. If
    not, the text will not display properly, or worse, the browser will try to synthesize
    these versions. Either way, the results will not look professional.


    TIP Try to choose fonts with a similar size. Different fonts will have different
    relative sizes even if set to the same font size.


    TIP Some typefaces are easiest to read on a screen; others look better when printed.
    Always consider the destination when choosing your fonts.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# Using Web Fonts


    Look around the Web, and what do you see? You usually see five fonts: Arial, Georgia,
    Verdana, Trebuchet MS, and Times New Roman. This situation came about for one
    simple reason: Arial, Georgia, Verdana, Trebuchet MS, and Times New Roman are
    preinstalled on virtually every Mac and PC. I am sick of them.


    Don’t get me wrong—these are great fonts, easy to read at many sizes. But as I
    said earlier, typography adds a language to text that goes far beyond the written
    word.


    Web-based typography is mirred in using Times for serif fonts and Helvetica/Arial
    for sans-serif fonts. This arrangement mutes the power of typography, and all
    Web pages begin to look the same.


    # Web-Safe Fonts


    What are the alternatives to the “fatal five”? That depends on the computer the
    person visiting your site is using. Apple OS X and Windows computers have certain
    standard fonts that should always be installed. In addition, Internet Explorer
    (which is installed on most Windows computers these days) installs several additional
    fonts.


    Of course, there’s no guarantee that these fonts will be installed, but because
    they came with the operating system, they are just as likely to be available as
    Times, Helvetica, or Arial.


    You can find a list of Web-safe fonts on my Web site, www.webtypographynow.com/websafe-fonts.
    It lists these fonts, and includes examples of what they should look like and
    which similar-looking fonts can be used as replacements


    Web-safe fonts are still good to know about to use as understudy fonts, but increasingly
    becoming a moot point as Web fonts take over. Web fonts give a much larger selection
    and are more reliably available.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_154_0.png)


    The list of Web-safe fonts on www. webtypographynow.com/websafefonts includes
    a visual example of each typeface. You can sort the list by name, available weights
    and styles, operating system availability, and rank.'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'But there is new hope. Two factors are changing the way designers think about
    their typefaces. The first is that dozens of fonts are commonly preinstalled on
    Macs and PCs. The second, and most profound change, is that all the major browsers
    now support the use of downloadable Web fonts.


    Web fonts is a recent development in Web design that allows you to include fonts
    in your Web designs by linking to a font file on your server. Although this seems
    simple (and it is), this ability has been a long time in coming and will revolutionize
    Web typography.


    # Web font formats


    For years it has been technically feasible to download a font just as you would
    an image and use it in your design. However, browser developers have only recently
    added this feature. The good news is that you can now download Web fonts to the
    vast majority of Web users. The bad news is that different browsers use different
    file formats (Table 5.3).


    Here is a list of the file formats:


    +   TTF/OTF. TrueType and OpenType fonts are the type you are most likely to have
    on your computer. They are commonly used today and represent the majority of fonts
    sold. That said, they have no built-in security to prevent their unlicensed use.


    +   EOT. Embedded OpenType is a format developed by Microsoft in the late 1990s
    to allow secure downloadable fonts for the Web. However, because the technology
    was proprietary for many years and EOT fonts were hard


    | Format | |

    | :--- | :--- |

    | EOT | |

    | TTF/OTF | |

    | SVG | |

    | WOFF | |'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'to create, the format didn’t catch on. Because it is the only format supported
    by IE and has been supported since IE4, it has gained new life for implanting
    Web fonts for IE.


    +   - SVG. A separable W3C standard from CSS, Scalable Vector Graphics can include
    font information. Some browsers, such as Safari mobile, support only this format.


    +   - WOFF. Web Open Font Format may be the new kid on the block, developed in
    mid-2009, but it is already becoming the frontrunner as the default Web font file
    format with support in all major Web browsers. This format includes some protection
    for the font—such as licensing—but is not nearly as cumbersome as EOT.


    # ## Setting a better font stack with Web fonts


    When deploying Web fonts in your design, the key is to include links to multiple
    font files; the browser will then use the format that works for it. The good news
    is that, with a bit of clever coding, this can easily be accomplished. To learn
    how to download or convert fonts to these multiple font file formats, see “Using
    Font Squirrel to Convert Font Files” in this chapter.


    Let’s look again at the font stack and how to leverage Web-safe fonts and Web
    fonts to create a design that rises above the visual monotony that you commonly
    see on the Web.'
