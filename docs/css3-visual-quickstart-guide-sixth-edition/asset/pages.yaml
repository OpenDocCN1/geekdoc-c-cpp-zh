  md: "| Value | ● | ● | ● | ● | ● |\n|---|---|---|---|---|---|\n| <bullet name> |\
    \ ● | ● | ● | ● | ● |\n| none | ● | ● | ● | ● | ● |\n| inherit | ● | ● | ● | ●\
    \ | ● |\n\n* See Table 8.2\n\nCode 8.2 Added to list-table-properties.css— The\
    \ list-style-type property is used to choose between the different bullet and\
    \ number styles for your list ①.\n\n```\n/*** list-table-properties.css ***/\n\
    ul {\n list-style-type: circle; }\nnl.list {\n list-style-type: none; }\n```\n\
    \n| Name | Appearance (varies depending on system) |\n|---|---|\n| disc | • |\n\
    | circle | ° |\n| square | ■ |\n| decimal | 1, 2, 3 |\n| decimal-leading-zero\
    \ | 01, 02, 03 |\n| upper-roman | I, II, III |\n| lower-roman | i, ii, iii |\n\
    | upper-alpha | A, B, C |\n| lower-alpha | a, b, c |\n| lower-greek | α, β, γ\
    \ |\n\n# Setting the Bullet Style\n\nThe list-style-type property (Table 8.1)\
    \ controls the type of bullet to be used for list items—not just circles, discs,\
    \ and squares, but also letters and numerals and dots and our own custom image\
    \ bullets.\n\n# To define the bullet style:\n\n+   1. Add the list style type\
    \ property to your declaration list. Type list-style-type, followed by a colon\
    \ (:) (Code 8.2). list-style-type:\n\n+   2. Specify the bullet type. Type one\
    \ of the bullet names listed in Table 8.2, or type none if you do not want a marker\
    \ to appear. circle;\n\nAlthough the list item tag <li> is used in this example,\
    \ you can turn any element into a list item by adding the CSS list properties\
    \ along with the definition display: list-item. See Chapter 10 for more information.\n\
    \n> TIP You can change the bullet type or image using pseudo-classes such as :hover,\
    \ :visited, and :active.\n\n![](img/e1ed1e3c1873fa9fc855210fb83699d0_244_0.png)\n\
    \nA Code 8.2 applied to Code 8.1: Bullets are changed from discs (default) to\
    \ circles and the numbers are removed."
  merge: -1
  img_proc: true
- pgno: 245
  md: "# # Creating Your Own Bullets\n\nYou're not limited to the preset bullet styles\
    \ built into a browser. You can also use your own graphics as bullets from GIF,\
    \ JPEG, and PNG files by applying the list-style-image property (Table 8.3).\n\
    \n# ## To define your own graphic bullet:\n\n+   1. Add the list-style-image property\
    \ to your CSS rule. Type list-style-image, followed by a colon (:) (Code 8.3).\
    \ list-style-image:\n\n+   2. Specify the location of your image bullet. To include\
    \ your own bullet, you have to tell the browser where your bullet graphic file\
    \ is located. url(bullet-01.png);\n\nType the complete Web address or relative\
    \ path of the image. In this example, bullet-01.png is a local file.\n\nAlternatively,\
    \ type none to instruct the browser to override any inherited bullet images.\n\
    \nBullets are placed out of the layout frame by default, so they often will fall\
    \ outside of the layout box if they are particularly long.\n\n> Keep in mind that\
    \ the text being bulleted has to make space for the graphic you use. A taller\
    \ graphic will force more space between bulleted items, and a wider graphic will\
    \ force bulleted items farther to the right.\n\n> To be honest, very few developers\
    \ use the list-style-image property to add image bullets to their designs. Instead,\
    \ most developers will use the background property with padding to get more precise\
    \ styling. Want to know how to do this? Check out Chapter 17, “Navigation, Buttons,\
    \ and Controls.”\n\n| Value | |\n|---|---|\n| <url> | |\n| none | |\n| inherit\
    \ | |\n\nCode 8.3 Added to list-table-properties.css— I created a small arrow\
    \ graphic A (saved as a transparent PNG) to be inserted as the bullet using list-style-image\
    \ B.\n\n```\n/* list-table-properties.css ***/\nol.list {\n\tlist-style-image:\n\
    \t\turl(../images/chrome/bullet-01.png);\n}\n```\n\n![](img/e1ed1e3c1873fa9fc855210fb83699d0_245_0.png)\n\
    \n![](img/e1ed1e3c1873fa9fc855210fb83699d0_245_1.png)\n\nCode 8.3 applied to Code\
    \ 8.1: The fancy bullet image is used instead of numbers."
  merge: -1
  img_proc: true
- pgno: 246
  md: "# TABLE 8.4 List-Style-Position Values\n\n| Value | | | | | |\n|---|---|---|---|---|---|\n\
    | inside | ● | ● | ● | ● | ● |\n| outside | ● | ● | ● | ● | ● |\n| inherit | ●\
    \ | ● | ● | ● | ● |\n\n+   * Outside...Magnus es, domine, et laudabilis valde:\
    \ magna virtus tua, et sapientiae tuae non est numerus. et laudare te vult homo.\n\
    \n+   * Inside...Magnus es, domine, et laudabilis valde: magna virtus tua, et\
    \ sapientiae tuae non est numerus. et laudare te vult homo.\n\nOutside is generally\
    \ how bulleted lists are presented. You may want to override that by using inside.\n\
    \nCode 8.4 Added to list-table-properties: The list-style-position property allows\
    \ you to specify how lines of text flow under the bullet.\n\n```\n/*** list-table-properties.css\
    \ ***/\nul {\n list-style-position: outside;\n}\nnl.list {\n list-style-position:\
    \ inside;\n}\n```\n\n![](img/e1ed1e3c1873fa9fc855210fb83699d0_246_0.png)\n\nCode\
    \ 8.4 applied to Code 8.1: outside pushes the image bullet over, while inside\
    \ pulls the disc bullet back.\n\n# Setting Bullet Positions\n\nOften, the text\
    \ of a bulleted list item is longer than one line. Using the list-style-position\
    \ property (Table 8.4), you can specify the position of wrapping text in relation\
    \ to the bullet. Wrapped text that is indented to start below the first letter\
    \ of the first line below text is called a hanging indent.\n\n# To define the\
    \ line position for wrapped text in a list item:\n\n+   1. Add the list-style-position\
    \ property to your declarations. Type list-style-position, followed by a colon\
    \ (:) (Code 8.4).\n+   list-style-position:\n\n+   2. Specify the position type.\n\
    +   inside;\n+   Type one of the following values to set text indentation:\n+\
    \   > inside aligns the left edge of the bullet with the left edge of subsequent\
    \ text.\n+   > outside left aligns the first line of text with subsequent text,\
    \ placing the bullet as a hanging indent.\n\n> TIP Generally, bulleted lists that\
    \ have a hanging indent (outside position) stand out much better than those without\
    \ a hanging indent (inside position)."
  merge: -1
  img_proc: true
- pgno: 247
  md: "# Setting Multiple List Styles\n\nYou can use one line of code to set all list\
    \ properties described in the previous three sections using the list-style shorthand\
    \ property (Table 8.5), which sets the list-style-type, list-style-position, and\
    \ list-style-image properties.\n\n# To define multiple list-style attributes:\n\
    \n+   1. Add the list-style property to your CSS rules. Type list-style, followed\
    \ by a colon (:) (Code 8.5). list-style:\n+   2. Specify the location of your\
    \ bullet image (optional). Next, type a list-style-image value. url(arrow_02.png)\n\
    \nTo include your own bullet, you must create the bullet graphic and then tell\
    \ the browser where the graphic is located using either the complete Web address\
    \ or the relative path of the image. (See “Creating Your Own Bullets” in this\
    \ chapter for more information.)\n\nTABLE 8.5 List-Style Values\n\n| Value | |\
    \ | | | | |\n|---|---|---|---|---|---|---|\n| <list-style-type> | ● | ● | ● |\
    \ ● | ● | ● |\n| <list-style-position> | ● | ● | ● | ● | ● | ● |\n| <list-style-image>\
    \ | ● | ● | ● | ● | ● | ● |\n\nCode 8.5 Added to list-table-properties: The list-style\
    \ property lets you set the type, image, and position all in one definition 8.\n\
    \n```\n/*** list-table-properties.css ***/\nul {\n  list-style: circle outside;\
    \ }\nol.list {\n  list-style: none url(.../.../images/chrome/\n  • bullet-01.png)\
    \ inside; }\n```"
