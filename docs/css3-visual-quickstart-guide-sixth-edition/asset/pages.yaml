  md: '![](img/e1ed1e3c1873fa9fc855210fb83699d0_190_0.png)


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_190_1.png)


    # Emboss


    Emboss reverses the letterpress effect, giving the illusion that the text is rising
    off of the page.


    ```

    ```css

    .emboss {

    background-color: #ccc;

    color: #ccc;

    text-shadow: -1px -1px 1px

