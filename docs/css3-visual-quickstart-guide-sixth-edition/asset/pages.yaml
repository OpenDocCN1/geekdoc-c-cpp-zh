- pgno: 353
  md: '# To set up a multicolumn layout using CSS:


    +   1. Add rules to define the width of your content area(s). This is a container
    around your columns that will help hold them together regardless of the width
    of the browser window. I like to use the section tag to define it (Code 13.2).
    Generally, it involves defining a width for the site''s header and footer, as
    well as the section into which you will add the articles.


    The widths will depend on a number of factors:


    +   > Fluid design: If you are using a fluid grid, you will be setting your width
    in relative units, most likely a percentage.


    With a fluid design, you need to set the minimum width (using absolute units such
    as pixels) to which the content can be squeezed before vertical scrolling is needed.
    You may also want to set the maximum width to which the content can stretch; otherwise
    text columns will grow so wide that they''ll become hard to read.


    +   > Fixed design: When you want a fixed-width design, use absolute units (inches,
    cms, pixels, and so on). If you have a defined layout grid (highly recommended),
    then you should consider how wide the grid is and the number of columns it will
    contain.


    Regardless of whether you are using a fluid or fixed design, you will want to
    tailor column widths to the target device, as described in Chapter 14.


    ```

    header.site, section,

    footer.site {...}

    ```


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_353_0.png)


    Code 13.2 applied to Code 13.1. The columns now line up horizontally and we can
    see all three columns at once.'
  merge: -1
  img_proc: true
- pgno: 354
  md: '2. Set the float property for your columns. Most columns use a `float:left`
    but `float:right` or a combination will work, depending on your needs.


    `nav, article, aside {...}`


    Remember to use one of the float fixes, outlined in this chapter, if you see strange
    things happening with your box backgrounds and borders.


    3. Set the column widths. Until these widths are set, the columns will stretch
    the full width of the parent elements (`section`) and not actually float next
    to each other. Additionally, you will want to set margins and any padding. So
    you will want set a separate width using conditional styles as explained in Chapter
    12:


    `nav {...}; article {...}, aside {...}`


    TIP My general rule of thumb is to leave one to five pixels or 1 to 2% (for fluid
    columns) as a “fudge factor” between floated elements. The difference between
    columns that float and rows stacked on each other can literally come down to a
    single pixel. However, you will need to test your design on multiple browsers
    at multiple window sizes to find the exact fudge factor for your design.


    TIP When you are using padding, you will run afoul of the box model problem in
    Internet Explorer explained in the sidebar “Fixing the Box Model for Older Versions
    of Internet Explorer.”


    TIP Although I used three columns here, you can add as many columns as you want.
    Just add more `<aside>` or `<div>` elements with the float property and adjust
    your column.'
  merge: -1
  img_proc: true
- pgno: 355
  md: '# # Fixing the Float


    CSS has a nasty little bug that was apparently meant to be a feature: When you
    float block-level elements within a block-level element (see Chapter 10 for more
    information), the child elements do not take up any space in their parent A. Make
    no mistake, the child elements are still on the Web page where you expect them
    to be; but if you add a background or border to their parent, the parent''s box
    appears to collapse as if no content were present! Believe it or not, this was
    done on purpose by the browser developers as a response to the CSS specification,
    but it can be incredibly annoying when you are trying to set up columns.


    The problem is that floating elements are taken out of the normal flow of the
    document so, in effect, nothing anchors the bottom of the element and identifies
    where the bottom is. Later in this chapter I''ll show you how to float two elements
    next to each other to create a columnar layout. But to make them work effectively,
    you first need to learn the following techniques.


    Several solutions have been developed to combat this little "feature" and force
    the parent element to acknowledge all of its prodigal children B. But I find two
    solutions to be most reliable. The first is structural in the HTML; the other
    is pure and simple CSS.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_355_0.png)


    A Without a fix, the parent element (article) rolls up like a cheap newspaper,
    leaving its child elements high and dry.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_355_1.png)


    B With the fix in place, the parent is there to protect its children.'
  merge: -1
  img_proc: true
- pgno: 356
  md: '# Code 13.3 The break tag clearfix involves adding a new structural element
    (the break tag) to the bottom of the parent element to clear the floating and
    snap the parent open. The overflow fix requires that you add the overflow property
    to the parent''s selector, in this case the section tag, to display everything
    as it should be.


    ```

    /*** design-interface.css ***/

    /* Float Fixes

    ------------------------------------------ */

    .clearfix { clear: both; }

    section { overflow: auto; }

    ```


    # Using a break tag "clearall" fix


    The float problem is caused when an element is floating and its last child in
    an element is floating. As a result, the parent can''t see its bottom. The most
    common method for fixing the float problem is to clear floating at the bottom
    of the element (following all of the elements that are floated within it) so the
    parent will open to its natural height.


    To do this, we create a special "clearfix" class that we can use with any element—most
    commonly a break tag—to force an end to the float.


    # To add the clearfix:


    +   1. Create a class in your CSS called clearfix. This class will include the
    single declaration to clear all floating (Code 13.3): .clearfix { clear: both;
    }


    +   2. Add the clearfix class to an HTML tag at the bottom of every parent element
    that contains floating elements. You could also just add a break tag with the
    class at the bottom of every floating element. This class will clear floating,
    and the element will snap to its natural height: <br class="clearfix">


    > TIP Although I''ve used clearfix here for the specific purpose of fixing the
    floating box problem, this class can be applied anywhere you want to clear floating.


    > TIP Although extremely popular, this trick tends to litter the page with a lot
    of breaks with clearfix class.'
  merge: -1
  img_proc: true
- pgno: 357
  md: "# Using an overflow fix\n\nThe second method for preventing a parent element\
    \ from collapsing is so simple that if it weren't so important, it would hardly\
    \ be worth mentioning: To restore the element's height, just set the parent overflow.\
    \ That's it. You can even set the element overflow to auto. Apparently setting\
    \ overflow reminds the element to accommodate its children.\n\n# To add the overflow\
    \ fix:\n\n+   1. For any element that is collapsing, add the overflow property.\
    \ You can set the value to anything, including the default value auto, to restore\
    \ the parent to its proper height (Code 13.3):\n+   \n+   overflow: auto;\n\n\
    +   2. Set up your parent element with floating children. As long as the parent\
    \ element includes the overflow declaration, you are safe.\n+   \n+   <section>...</section>\n\
    \n> TIP While you could just set the overflow property using the universal selector,\
    \ I find that this can lead to some problems, as some browsers will throw in scrollbars\
    \ everywhere, even when there isn't any overflow.\n\n> TIP You may notice a little\
    \ trick I used to center the numbers in the blocks horizontally (easy) and also\
    \ vertically. Horizontal is achieved by adding text-align: center. Vertical is\
    \ done by setting the line-weight to be the same value as the height of the box.\
    \ As long as only a single line of text is present, it will stay vertically centered\
    \ in the element."
  merge: -1
  img_proc: true
- pgno: 358
  md: "# Fixing the Box Model for Older Versions of Internet Explorer\n\nAll elements\
    \ are rectangular “boxes” with a margin, border, padding, and content that has\
    \ a width and height. But remember that this is Web design—it can never be that\
    \ simple, right?\n\nRight. For a long time, Internet Explorer didn’t follow the\
    \ same rules for calculating the box size that other browsers did.\n\nThe W3C\
    \ definition of a box created using CSS specifies that the width and height define\
    \ the width and height of only the content area where images and other objects\
    \ are displayed. However, the total area that the element occupies includes the\
    \ content area plus the padding and border sizes. So, the apparent width would\
    \ be calculated in the following way:\n\nwidth(content) + left padding + right\
    \ padding + left border + right border = width (total)\n\nUnfortunately, Internet\
    \ Explorer through version 5.5 defined width and height values as the apparent\
    \ width and height including padding and borders. This effectively subtracted\
    \ the padding and border sizes to determine the content width and height:\n\n\
    width(total) – left padding – right padding – left border – right border = width\
    \ (content)\n\nSo, given the following CSS code:\n\n```\n#object1 {\n    border:\
    \ 5px solid #000;\n    padding: 10px;\n    width: 100px;\n}\n```\n\nBrowsers using\
    \ the W3C standard (Firefox, Safari, Opera) would set the content area to 100\
    \ pixels wide but have a total width of 130 pixels:\n\n100 + 5 + 5 + 10 + 10 =\
    \ 130\n\nOn the other hand, Internet Explorer 5.5 and earlier would set the total\
    \ width of the element (from border to border) as 100 pixels, shrinking the width\
    \ of the content to 70 pixels:\n\n100 – 5 – 5 – 10 – 10 = 70\n\nInternet Explorer\
    \ versions 6 and later fix this problem by following the W3C standards. So you\
    \ are probably wondering why I’m even mentioning this. A problem can pop up in\
    \ later versions of IE. When you are using the transitional document type definition\
    \ (DTD) for your page, which is still very common—or a DTD that the browsers do\
    \ not recognize, such as HTML5—IE6 and IE7 revert to the “quirky” version of the\
    \ box model. Unfortunately, more often than not, your site will probably trigger\
    \ IE’s “quirks” mode."
  merge: -1
  img_proc: true
- pgno: 359
  md: '# Fixing the Box Model for Older Versions of Internet Explorer (continued)


    So what’s a good Web designer to do? You have a few options:


    +   - Do not use a border and/or padding with any element that has a set dimension.
    If you do, don’t expect pixel-precise layouts. Generally, this solution isn’t
    practical, but for simple pages it might do the trick.

    +   - Code for the strict DTD so that the browser uses the standards-compliant
    box model. Generally, this approach is not practical because the slightest error
    can return the browser to quirks mode and destroy the whole design.

    +   - Use conditional CSS (explained in Chapter 14 to code separate “equalizing”
    widths and/or heights for older versions of Internet Explorer.


    Because IE7 and earlier now make up less than five percent of the browsers currently
    in use worldwide, this problem increasingly becomes a moot point, but you may
    still run across it from time to time. Interestingly, a new CSS3 property under
    discussion, box-sizing, explained in Chapter 10, will allow you to choose which
    of these box models you want to use. This gives you control over which method
    gets used.'
  merge: -1
  img_proc: true
- pgno: 360
  md: '# Beyond Links: Using Access Keys to Improve Accessibility


    Although most people visiting your Web site will be using a mouse, many visitors
    may not be able to use a mouse as effectively, or at all. To accommodate visitors
    using a keyboard or speech-recognition system to navigate the Web, you can include
    the accesskey attribute for important links:


    ```

    <a href="index.html"

    accesskey="h">Home (h)</a>

    ```


    Whenever visitors press the H key, this link will receive focus, so that users
    can then press (or speak) Return to access the page.


    # Styling Links vs. Navigation


    The Web is nothing without links. Many designers are content to rely on default
    browser styles applied to their links; but this is not only boring, it also makes
    all the links on your page look exactly the same, whether they are global navigation
    or content links.


    Styling links using pseudo-classes was covered in Chapter 4, but to bring your
    navigation to life, you need to style your links depending on the context.


    # To style navigation and links:


    +   1. Style the default link styles. In the design-interface.css file, add rules
    for the anchor tag and its :link, :visited, :hover, and :active states (Code 13.4).


    ```

    a {...}

    a:link {...}

    a:visited {...}

    a:hover {...}

    a:active {...}

    ```


    I recommend setting text decoration to "none" to eliminate the unattractive underlining.
    You can then add link underlining using the border-bottom property as needed.'
  merge: -1
  img_proc: true
- pgno: 361
  md: '2. Style specific hypertext link styles such as paragraphs, lists, and tables.
    Links in paragraphs need a little extra attention because they are surrounded
    by other text.


    ```

    p a {...}

    p a:link {...}

    p a:visited {...}

    p a:hover {...}

    p a:active {...}

    ```


    In addition to color, some options to differentiate hypertext from text include:


    +   - Underline using border-bottom to control the style, thickness, and color
    of the underline.

    +   - Italics or bold to give the linked text extra style or weight.

    +   - A background color or image to create a highlight effect. See “Using CSS
    Sprites” in this chapter.

    +   - Increase size slightly.


    3. Style the navigation links. Navigation links are most commonly set up as a
    list to allow the links to appear in a list even if CSS is present (See “Designing
    with Progressive Enhancements” in Chapter 14.)


    ```

    nav.toc .menu a {...}

    ```


    These are the basic styles applied to the navigation links, but you are not quite
    done styling the menu itself. You’ll get to that in the next two sections.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_361_0.png)


    Shows the Web page (Code 13.1) when the design-interface.css (Code 13.4) styles
    are added. The difference between hypertext links in paragraphs and navigation
    links in the menu are now clear.'
  merge: -1
  img_proc: true
