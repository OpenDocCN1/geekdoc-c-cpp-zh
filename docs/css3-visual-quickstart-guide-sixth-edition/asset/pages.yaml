  img_proc: true
- pgno: 402
  md: "# Have a Style Sheet Strategy\n\nOnce your libraries, frameworks, and site-wide\
    \ CSS are ready to go live, you need to pick the best strategy for deployment.\
    \ It is always recommended that you place all your styles in one or more external\
    \ style sheets, and then use either the `<link>` or `@import` code to apply them\
    \ to a Web document.\n\nAt this juncture, you have two competing priorities:\n\
    \n+   - Keep the file size as small as possible.\n+     The larger the file size,\
    \ the longer it takes to download. Of course, because it’s text, your files have\
    \ to be pretty large for this to be a problem, but it happens.\n+   \n+   - Keep\
    \ the number of links and imports as low as possible.\n+     The more links and\
    \ imports you have to external CSS files, the more server calls you make, and\
    \ the slower the page will load.\n\nYou can reduce file size by splitting style\
    \ sheets into multiple external files and then linking only to the ones you need,\
    \ but this means more links. You can have a single, all-inclusive CSS file, but\
    \ such a file can grow quite large. Your job will be to balance these two issues.\
    \ Here are a few methods for doing so."
  merge: -1
  img_proc: true
- pgno: 403
  md: '# The One for All method


    The One for All method includes all your styles in a single master style sheet.
    With this method, creating well-organized and readable style sheets with a TOC
    is critical because you may be poring through hundreds or even thousands of lines
    of code.


    **Pros**—One download is faster than multiple downloads, and the file is then
    cached for use on other pages. In addition, with all of your code in one place,
    you don’t have to worry about whether a page has access to the right styles.


    **Cons**—This method may lead to large file sizes that can slow down the page
    loading time and take longer to render. Additionally, these files are harder to
    manage and edit.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_403_0.png)


    The One for All method uses only a single gargantuan CSS file linked to the HTML
    document.'
  merge: -1
  img_proc: true
- pgno: 404
  md: '# The Divide and Conquer method


    The Divide and Conquer method uses multiple links to multiple style sheets on
    an as-needed basis per page. Start with a link to a file with global styles used
    by all pages, and then add links to styles used for that page only. For example,
    if you use a special carousel module only on the main page, it would not go into
    the global file, but would exist as a separate CSS file for the home page or as
    a part of a CSS file of general components.


    Pros—Mix and match style sheets from your library to load only the styles you
    need and reduce bloated file sizes. Plus, as long as you keep your files organized,
    these are generally easier to edit.


    Cons—Multiple files mean multiple server calls, which slows downloads. Plus, multiple
    files can be hard to keep up with, and their cascade order can conflict in unpredictable
    ways.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_404_0.png)


    The Divide and Conquer method splits the CSS into multiple files, which are then
    applied only if they are relevant to the page.'
  merge: -1
  img_proc: true
- pgno: 405
  md: '# # The Aggregate method


    The Aggregate method uses @import to collect all the relevant CSS files from your
    library. The HTML document then has to link to only a single external file ⑤.


    **Pros**—Similar to the Divide and Conquer method, but by using only a single
    link, it''s easier to add or remove styles as needed because they are in a single
    CSS file rather than spread out across multiple HTML files.


    **Cons**—Similar to the Divide and Conquer method, but worse. This used to be
    a very popular CSS strategy until someone discovered that using @import often
    prevents external style sheets from loading simultaneously. Instead, they must
    load one after another, which slows things down. Additionally, since the linked
    parent style sheet has to load before the imported style sheets are seen by the
    browser, this method can lead to the page re-rendering as new styles become available.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_405_0.png)


    ⑤ The Aggregate method uses the @import rule to bundle the style sheets into a
    single file that is linked to the HTML document.'
