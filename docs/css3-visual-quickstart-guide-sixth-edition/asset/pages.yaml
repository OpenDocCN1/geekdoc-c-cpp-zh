- pgno: 268
  md: '# # Box Properties


    In the physical world, atoms are the building blocks of all larger objects. Every
    type of atom, or element, has unique properties, but when bonded with other atoms,
    they create molecules—larger structures with properties different from the parts.


    Likewise, HTML tags are the building blocks of your Web page. Each tag, or element,
    has its own capabilities. Tags can be combined to create a Web page that is greater
    than the sum of its parts. Whether a tag is by itself or nested deep within other
    tags, it can be treated as a discrete element on the screen and controlled by
    CSS.


    Web designers use the concept of the box as a metaphor to describe the various
    things that you can do to an HTML element, whether it is a single tag or several
    nested tags. A box can have several properties—including margins, borders, padding,
    width, and height—that can be influenced by CSS.


    This chapter shows you how to control the box and its properties (Code 10.1).


    # ## In This Chapter


    +   - Understanding an Element''s Box 250

    +   - Displaying an Element 252

    +   - Setting the Width and Height of an Element 255

    +   - Controlling Overflowing Content 259

    +   - Floating Elements in the Window 262

    +   - Setting an Element''s Margins 265

    +   - Setting an Element''s Outline 268

    +   - Setting an Element''s Border 269

    +   - Rounding Border Corners 272

    +   - Setting a Border Image 274

    +   - Setting an Element''s Padding 276

    +   - Creating a Multi-Column Text Layout 278

    +   - Coming Soon! 280

    +   - Putting It All Together 281'
