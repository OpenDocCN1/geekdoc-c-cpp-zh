- pgno: 144
  md: '# # Font Properties


    Typography is one of your most powerful tools for presenting organized, clean-looking
    documents. It’s also the best tool for presenting chaotic, grungy-looking documents.


    The fonts you use go a long way toward getting your message across in just the
    way you want—whether that message is classical, grunge, or anything in between.
    I often say that fonts are to type what voice is to speech. Typeface, font weight,
    italic, and other typographic effects not only help designers to guide a visitor’s
    eye around the page, but they also add a layer of meaning.


    CSS gives you the ability to control the appearance of fonts, also known as *letterforms*,
    in your Web pages. You can set the font family, boldface, and italic attributes,
    and the limited font sizes available with HTML tags. CSS3 refines the ability
    to download font files (called *Web fonts*) from your server and apply them to
    the text in your Web page, giving you the power to use virtually any font you
    want in your designs.


    # ## In This Chapter


    +   - Getting Started 124

    +   - Understanding Typography on the Web 125

    +   - Setting a Font-Stack 130

    +   - Using Web Fonts 133

    +   - Setting the Font Size 144

    +   - Adjusting Font Size for Understudy Fonts 146

    +   - Making Text Italic 147

    +   - Setting Bold, Bolder, Boldest 149

    +   - Using Condensed and Expanded Fonts 150

    +   - Creating Small Caps 151

    +   - Setting Multiple Font Values at the Same Time 152

    +   - Putting It All Together 155'
