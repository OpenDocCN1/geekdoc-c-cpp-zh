  md: '7. Add the Web font name to your font stack. To leverage a downloaded Web font
    and trigger its download, place the name you gave it at as the first value of
    the font stack.


    `font-family: "BodyCopy", Constantia, Georgia, "Times New Roman", serif;`


    8. Add @font-face for different weights, styles, and stretch. Particularly if
    you will be using italic or bold text, you must define the font files for each
    of these, as well as the normal/regular style.


    9. Add @font-face for different typefaces. You can use multiple typefaces; in
    this case I''m including one for the titles.


    Although the SVG format can be used as a Web font, I tend not to include it as
    it is known to cause problems in some older Web browsers.


    For this example, I''ve loaded a lot of different font files. Although they are
    not huge—the ones I used are 20–35 KB and could be reduced in size by sub-setting
    the font. However, the file sizes can add up quickly, so be careful not to bloat
    your page size.


    Once loaded, though, the font files are cached, so they will not be downloaded
    again for subsequent pages that use them.


    For more information on Mac fonts, see developer.apple.com/textfonts/.


    For more information on Windows fonts, see www.microsoft.com/typography/fonts/.
