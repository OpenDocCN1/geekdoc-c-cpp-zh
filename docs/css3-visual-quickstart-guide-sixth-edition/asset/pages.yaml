  md: '+   5. You aren''t stuck using the same border on all four sides. You can set
    each side (border-top, border-bottom, border-left, and/or border-right).


    ```

    border-top: 2px solid

    rgb(142, 137, 129);

    ```


    If those options aren''t enough, see the sidebar “Additional Ways to Set a Border.”


    You do not have to include all the individual border attributes in your definition
    list, but if you don’t, the default value will be used.


    > TIP I''ve also added a little invisible border around the article, which has
    the affect of pushing the background image embellishment away from the edge.


    # Additional Ways to Set a Border


    CSS gives you the freedom to define aspects of the border’s appearance one side
    at a time, as follows:


    ```

    border-style: solid dashed double ridge;

    ```


    ```

    border-width: 1px 2px 4px 8px;

    ```


    ```

    border-color: red green blue purple;

    ```


    The values for these are shown in Tables 10.4 through 10.6.


    As with margins, you can include one to four values for each of these properties
    to set each border side independently, as follows:


    +   - One value sets the property for all four sides.

    +   - Two values set the property for the top/bottom and left/right sides.

    +   - Three values set the top property, the left/right properties (the same),
    and the bottom property.

    +   - Four values set the property for each side in this order: top, right, bottom,
    and left.


    This method is useful for overriding the values set by the single border property.


    Your final option for setting a border on a single side (as if you really needed
    another option!) is to set the individual properties for a specific side (top,
    bottom, left, right):


    ```

    border-top-width: 3px;

    border-top-style: solid;

    border-top-color: #f00;

    ```'
