  md: '# 2. Add the viewport meta tag.


    In the head of your HTML document (Code 4.18), add a meta tag with a name equal
    to viewport and content, as shown.


    ```

    <meta name="viewport"

    content="width=device-width,

    initial-scale=1, maximum-

    scale=1, minimum-scale=1,

    user-scalable=no" />

    ```


    This will prevent devices with smaller screens, most notably the iPhone, from
    resizing the page, overriding your styles to be set in Step 5.


    # 3. Link to your default style sheet.


    In the head of your HTML document (Code 4.18), type a <link> tag that references
    the default version of the CSS and define media as all.


    ```

    <link rel="stylesheet" media="all"

    href="default.css" >

    ```


