    \ Styles\n\nThe universal selector is a wildcard character that works as a stand-in\
    \ to represent any HTML type selector that can appear in that position in a contextual\
    \ list (A).\n\nKeep in mind, though, that the universal selector can be used in\
    \ place of any HTML selector in any configuration, not just as a stand alone selector\
    \ as shown in this section. The usefulness of this will become apparent in the\
    \ next chapter when you use contextual styles.\n\n# To use the universal selector:\n\
    \n+   1. Add the universal selector. Type an asterisk (*) and then the open curly\
    \ bracket (Code 3.11). This selector is then a wildcard that can be any HTML tag.\n\
    +      * {...}\n+   \n+   2. Add declarations to your universal selector rule.\
    \ Within the curly brackets, type the style declarations to be assigned to this\
    \ ID—formatted as property: value—using a semicolon (;) and separating individual\
    \ declarations in the list. You can also add one or more line breaks, spaces,\
    \ or tabs after a declaration without interfering with the code to make it more\
    \ readable.\n+      margin: 0; padding: 0;\n+      In this format, the styles\
    \ are applied to every element on the page."
