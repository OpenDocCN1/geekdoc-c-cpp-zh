- pgno: 370
  md: '# # Responsive Web Design


    Web design is at a crossroads. For most of this book, I showed designs and examples
    presented in a computer-based browser. However, more and more web content is being
    delivered to smart phone- and tablet-based browsers. It may surprise you to learn
    that web surfing via these mobile devices may soon overtake and surpass the computer.
    For Web designers, the problem is that one size does not fit all.


    You can use several strategies to deal with the various strategies—ignoring them
    is not a viable strategy—but the best of these solutions is simply to use the
    same HTML code with layout and content adjusted using CSS and media queries.


    In this chapter, you''ll learn the basic techniques for responsive design, including
    resetting styles, adjusting CSS for Internet Explorer, and how to easily adjust
    your page design to fit the device it is delivered to.


    +   In This Chapter

    +   - Getting Started ... 350

    +   - What Is Responsive Design? ... 352

    +   - Designing with Progressive Enhancements ... 354

    +   - Resetting Browser Default Styles ... 358

    +   - Adjusting CSS for Internet Explorer ... 363

    +   - Adapting to the Environment ... 366'
  merge: -1
  img_proc: true
- pgno: 371
  md: '# Getting Started


    This chapter uses Chapter 10 from Alice''s Adventures in Wonderland with the styles
    added in Chapters 5–13. It includes the Table of Contents and the aside that you
    placed in columns in Chapter 13. Now we''ll need to figure out how they are treated
    when the screen size is smaller.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_371_0.png)


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_371_1.png)


    The Web page (Code 14.1) before responsive design is applied.


    When the page width is reduced, the design simply scrolls horizontally off the
    page.


    Code 14.1 The HTML5 code you''ll be using in this chapter


    ```

    ```html

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="utf-8">

