    showing the values for that property and the specific browser version in which
    support first appeared. But for quick reference, all you really care about is
    “does it work now?” or at least “does it work in browsers with major market share?”
    You also need to know in a hurry the default value, the types of elements that
    the property applies to, and whether its child elements will inherit its values.
