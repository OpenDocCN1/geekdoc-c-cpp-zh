    \ the structure of your page layout, identifying unique elements in the code,\
    \ singling them out for special treatment, either for positioning with CSS or\
    \ JavaScript.\n\n# To define an ID selector:\n\n+   1. Add the ID selector to\
    \ your CSS. ID rules always start with a number sign (#) followed by the name\
    \ of the ID (Code 3.10).\n\n```\n#ch01 {...}\n```\n\nThe name can be a word or\
    \ any set of letters or numbers you choose, with the following caveats:\n\n+ \
    \  Use only letters and numbers. You can use hyphens and underscores, but do so\
    \ with caution. Some earlier browsers reject them.\n\n+   The first character\
    \ cannot be a number, hyphen, or underscore.\n\n+   Don't use spaces.\n\nCSS rules\
    \ can be defined in the head of your document within the <style> tags or in an\
    \ external CSS file that is imported or linked to the HTML document."
