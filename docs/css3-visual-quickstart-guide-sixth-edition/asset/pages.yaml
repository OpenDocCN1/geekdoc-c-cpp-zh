- pgno: 45
  md: '# # The Evolution of HTML5


    HTML5 is the next step in Web markup and will take over from XHTML. Although XHTML2
    was in development for almost eight years, it was laid to rest in 2009 in favor
    of HTML5.


    To understand how this happened, let''s take a little trip back to the halcyon
    days of the Web at the end of the twentieth century—1997, to be precise. It was
    still a Web 1.0 world, although we didn''t yet know to call it that. The dotcom
    bubble was just starting to inflate, and everyone was surfing the Web with Netscape
    Navigator. Into that landscape the World Wide Web Consortium (W3C) introduced
    HTML 4.0 (HTML4).


    HTML4 was a vast improvement, because for the first time it was created by a standards
    body that gave everyone a seat at the table and believed that Web pages should
    display the same across all available browsers.


    # # And then came XHTML


    XHTML1 (released in 2001) is a rewriting of the HTML 4.01 standard using XML,
    and was intended to bring the power of XML to Web page development. XHTML uses
    the XML Doctype. XHTML employs all the same tags as HTML, but the code will still
    work with a browser that does not understand XML.


    Although XHTML2 was primarily meant to be a transitional technology to a brave
    new Web technology, from its very beginning, something went horribly wrong.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# The problem with XHTML2


    It was quickly realized that even XHTML1 was not enough to evolve the Web from
    its relatively static "page" nature into a truly interactive and universal environment
    of applications. XHTML2 was meant to change all of that. Starting in August 2002,
    the authors of the XHTML standard began crafting a new language that they hoped
    would completely retool Web markup for the twenty-first century, bringing about
    a golden age of semantic Web pages, interactivity, internationalization, device
    independence, and tapoca pudding for everyone! But they forgot one thing: XHTML2
    was not written to be backward compatible with older Web markup languages. Existing
    browsers would not be able to run this whiz-bang new markup language. Web developers
    would have to develop one version of their site for older browsers and another
    for the XHTML2 standard.


    # And then there was HTML5


    In June 2003, HTML5 started life as Web Applications 1.0 and was created by the
    Web HyperText Application Technology Working Group (WHATWG), an organization that
    was not associated with the W3C. Instead, this independent group, frustrated with
    the slow pace and errant direction that XHTML2 was taking, began working on an
    alternative standard that would be backward compatible, more suitable for writing
    applications *and* pages, and would also address many practical issues that Web
    developers faced.'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'For several years, both languages were developed simultaneously. But in 2007,
    seeing that Web Applications 1.0 was further along than XHTML2, the W3C adapted
    it as the starting point for a new HTML5 standard, publishing the “First Public
    Working Draft” of the specification on January 22, 2008. To focus attention on
    HTML5, the W3C did not renew the XHTML Working Group’s charter and XHTML2 was
    no more.


    # Is it HTML5 or XHTML5?


    Although XHTML2 has disappeared, the need to unify XML and HTML has not. Therefore,
    a parallel initiative exists to create XHTML5. To be clear, this is *not* a new
    or different markup language; it is simply HTML5 written using XML rules and is
    similar to XHTML.


    If you know XHTML, then learning XHTML5 should not be difficult. They differ primarily
    in the ways they treat tags. Some of the most important differences are listed
    in Table 2.3.


    Whether you choose to use HTML5 or XHTML5 is your call, but they will both work
    in modern browsers. For my part, I’m enjoying the more forgiving nature of HTML5,
    and it’s what I use for the code in this book.


    | | XHTML5 | HTML5 |

    |---|---|---|

    | Tag case | lowercase | upper or lowercase |

    | Closing tags | required | optional |

    | Self closing tags | required | optional |

    | MIME type | application/xml or application/xhtml+xml | text/html |

    | Well-formedness errors | fatal | not fatal |'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# What''s Not in HTML5?


    HTML5 includes several changes. But if you want to start using it today, you also
    need to know what is *not* available anymore. The frame tags—`<frameset>`, `frame`,
    `noframes`—have been eliminated, but `iframe` is still available. Most presentation
    tags have been eliminated—such as *basefont*, *big*, *center*, *font*, *s*, *strike*,
    *tt*, *u*—and although *b* (bold) and *i* (italic) are still included, some debate
    continues over that decision.


    # What''s New in HTML5?


    HTML5 makes important structural changes to Web pages. For example, you can specify
    common elements such as headers, footers, articles, and asides. In addition, HTML5
    introduces many features natively (that is, features built into the browser) that
    used to require plug-ins and/or scripting in the form of new elements and APIs:


    +   - The Canvas element allows scriptable bitmap editing.

    +   - Document editing permits users to edit content directly in Web pages.

    +   - Web forms self validate and include more input types.

    +   - Drag-and-drop allows the manipulation of elements without scripting.

    +   - Audio and Video Timed media playback enables native control of media files
    without plug-ins.

    +   - New structural elements remove the burden of using `<div>` tags with classes
    and IDs to create common elements such as headers and footers.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# # How Does HTML5 Structure Work?


    One of the most significant changes in HTML5 is the addition of structural elements
    that will greatly enhance the semantic philosophy behind Web markup A. Most of
    the new structural tags are self-elaboration; but a few require some elaboration:


    +   - `<header>` can be used for page headers, section headers, article headers,
    or an aside header.

    +   - `<hgroup>` is used for a grouping of header elements (h1, h2, h3, and so
    on) that are related, generally as title and subtitle.

    +   - `<nav>` can be included independently or as part of the header and/or footer.

    +   - `<section>` defines the main parts of a page, generally one that includes
    articles.

    +   - `<article>` is an individual blog entry or blog entry abstract.

    +   - `<figure>` is used to contain images, audio, and video that are embedded
    in the page.

    +   - `<figcaption>` contains a caption for the figure tag it is in.

    +   - `<dialog>` replaces the `<dl>` element to contain conversation transcripts.

    +   - `<aside>` is used for support content on a page, such as related links,
    secondary navigation, and, of course, ads.

    +   - `<footer>` is similar to the header and can be placed at the bottom of other
    elements.


    Unfortunately, not all browsers are equipped to understand HTML5 without a little
    help.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_49_0.png)


    A The wireframe of a typical HTML5 document.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'Code 21 HTML5page.html—This shows a typical HTML5 page that is structured to
    use a header, navigation, article, aside, and footer for the layout graphic.


    ```

    <!DOCTYPE html>

    <html dir="ltr" lang="en-US">

    <head>

    <meta charset="utf-8">

    <title>HTML5/titl>

    </head>

    <body>

    <header>

    <hgroup>

    <nav>/nav>

    </header>

    <section>

    <article>

    </header>

    <figure>

    <figcaption>/figcaption>

    </figure>

    <footer>/footer>

    <article>

    <dialog>>dialog>

    </section>

    <aside>/aside>

    <footer>/footer>

    </body>

    </html>

    ```


    # Using HTML5 Structure Now


    I''ll let you in on a little secret: You can use the HTML5 syntax to structure
    your Web pages and combine it with CSS3 (or older versions of CSS). HTML5 is implemented
    on most current browsers (including Internet Explorer), and you should start using
    it now.


    Although CSS can be applied to any version of HTML in use today—including XHTML1
    and HTML 4.01—I''ll be using HTML5 throughout this book. This book is by no means
    an exhaustive resource of HTML5. However, I want to show you how to set up the
    basic Web document that I''ll reference in future chapters.


    # TABLE 2.4 Doctypes


    | Markup Language | Doctype Code |

    |---|---|

    | HTML 4.01 Loose | <!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
    "http://www.w3.org/TR/html4/loose.dtd"> |

    | HTML 4.01 Strict | <!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0//EN" "http://www.w3.org/TR/html4/strict.dtd">
    |

    | HTML 4.01 Frameset | <!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Frameset//EN"
    "http://www.w3.org/TR/html4/frameset.dtd"> |

    | XHTML1 Transitional | <!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd"> |

    | XHTML1 Strict | <!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
    |

    | XHTML1 Frameset | <!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Frameset//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-frameset.dtd"> |

    | HTML5/XHTML5 | <!DOCTYPE html> |'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Setting up a basic HTML5 document:


    +   1. Add the HTML5 doctype (Table 2.4).

    +   Notice that the new !DOCTYPE for

    +   HTML5 is much simpler than the

    +   complex and hard-to-decipher HTML

    +   and XHTML doctypes in use today

    +   (Code 2.1). It simply tells the browser to

    +   use HTML.

    +   <!DOCTYPE html>


    +   2. Add the HTML tag, including the

    +   intended language and the language

    +   direction (generally ltr for left-to-right

    +   text).

    +   <html dir="ltr" lang="en-US">...

    +   </html>


    +   3. Add the head to your document, which

    +   is where you will specify information

    +   about this document, including the

    +   title and the character set used by the

    +   text. I recommend using UTF-8 for

    +   best results.

    +   <head>...</head>


    +   4. Add the body to your document. This is

    +   where all the content to be displayed is

    +   added. I recommend giving every body

    +   element in your site at least one unique

    +   class name and others to identify its

    +   location in the site. By doing so, you

    +   can add styles on a per-page and per-

    +   section basis without including multiple

    +   CSS files.

    +   <body class="section Name

    +   - pageName">...</body>'
  merge: -1
  img_proc: true
- pgno: 52
  md: "# # When Will HTML5 Be Ready?\n\nIt's important to note that many people are\
    \ concerned that HTML5 is still a \"Working Draft.\" The final \"Proposed Recommendation\"\
    \ won't be finished until 2022. (Yes, that's a decade from now.) The skeptics\
    \ throw up their hands and assume that it will be some time before HTML5 is relevant.\
    \ But that date is really misleading.\n\nAll new browsers currently support the\
    \ important HTML5 properties. The 2022 date is distant, but it is when *all* browsers\
    \ will have adapted *all* the HTML5 properties.\n\nPractically speaking, HTML5\
    \ is here now and will grow in use over the next few years until it becomes the\
    \ main game in town.\n\nHTML5 is ready for prime time, if you are ready to use\
    \ it.\n\n+   5. Add the header tag for your page. This is *not* the same as the\
    \ head tag in step 3. This is where you put all the content that is displayed\
    \ in your Web page's header. You can also include the navigation here or include\
    \ it separately, depending on your design needs.\n+   \n+   <header>...</header>\n\
    \n+   6. Add the navigation tag, and include links to the top-level pages in your\
    \ site.\n+   \n+   <nav>...</nav>\n\n+   7. Add one or more article tags, which\
    \ will contain the important content on this page. Many Web browsers and RSS newsreaders\
    \ will now allow the user to focus on the articles to get to the main content\
    \ of the page. Figures and sections fit well here.\n+   \n+   <article>...</article>\n\
    \n+   8. Add the aside tag, which is where supplemental content to the article\
    \ is placed. This is also sometimes called a sidebar or rail, depending on who\
    \ you talk to. It can include anything you want, but I like putting comments and\
    \ dialogue over here.\n+   \n+   <aside>...</aside>\n\n+   9. Finally, add a footer\
    \ tag at the bottom of the page. This generally includes redundant top-level navigation,\
    \ copyrights, and other small print.\n+   \n+   <footer>...</footer>\n\nAnd that's\
    \ it. You are ready to start using HTML5 tags. Go crazy. Oh, wait, that's right:\
    \ it works in everything *but* Internet Explorer, which just happens to make up\
    \ the majority of browsers in use today. So, what do you do?"
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Making HTML5 work in older versions of Internet Explorer


    Although Internet Explorer does not know HTML5 tags, there is a partial fix (or
    kludge) that involves using JavaScript to create the HTML5 elements:


    ```

    document.createElement(''header'');

    ```


    Referred to as the “HTML5 Shiv,” this will “teach” Internet Explorer 6 (and later
    versions) that these elements exist, and that they should be treated as HTML tags.
    You can add one of these lines of JavaScript for each of the HTML5 elements you
    need.


    To make it simple to add these new tags, create an external JavaScript file (Code
    2.2) and link to it from your HTML document using the IE conditional (Code 2.3),
    which you’ll explore in greater detail in Chapter 13.


    Code 2.2 HTML5forIE.js—This adds a blank HTML tag for each of the HTML5 tags that
    Internet Explorer is missing.


