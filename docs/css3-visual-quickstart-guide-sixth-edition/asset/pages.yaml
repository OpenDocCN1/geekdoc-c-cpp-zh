    \ 1.25em; }\np { line-height: 2; font-size: 1em; }\n```\n\nCode 4.15 medium.css—A\
    \ custom view for medium-size screens. Generally, these styles will be used by\
    \ tablet devices.\n\n```\n/* Medium Device Styles */\nbody {\n color: dimgray;\n\
    \ background-color: gray;\n font-size: 1.25em;\n padding: 200px 2em; }\nh1 { color:\
    \ gold; }\nh2 { color: silver; }\n```\n\nCode 4.16 large.css—The final style sheet\
    \ will be used to serve a page tailored to larger computer screens.\n\n```\n/*\
    \ Large Device Styles */\nbody {\n color: silver;\n font: normal 1.1em/2 georgia,times,serif;\n\
    \ background: black url('alice23b.gif')\n -no-repeat 0 0;\n padding: 200px 175px;\
    \ }\nh1 {\n color: red;\n font-style: italic; }\nh2 { color: gray; }\n```\n\n\
    # Using media queries to specify styles:\n\n+   1. Create your style sheets. Create\
    \ a default media style sheet that captures all the general styles for your design\
    \ and save it. I like to call mine default.css (Code 4.14).\n\nCreate style sheets\
    \ for the various media or specific devices for which you will be designing. Print\
    \ is generally good to include (Code 4.17). You can call the sheet print.css,\
    \ but you might also want to create style sheets specifically for tablets (Code\
