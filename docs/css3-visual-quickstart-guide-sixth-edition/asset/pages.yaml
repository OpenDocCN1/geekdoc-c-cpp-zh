- pgno: 279
  md: '# # Setting How a Box Sizes


    As mentioned at the beginning of this chapter, the actual space a box takes up
    is based on the width/height, plus the padding, plus the border. However, calculating
    space this way can be problematic because it assumes you always know the border
    and padding values. The box-sizing property lets you change how the box size is
    calculated, so that the size is calculated from border to border.


    | Value | Icons |

    |---|---|

    | content-box | 8 ● ● ● ● ● |

    | border-box | 8 ● ● ● ● ● |


    To specify the model used to calculate the width and height of an element, use
    one of the following values with the box-sizing property (Table 10.4):


    +   - content-box will size only the content area. The padding and border widths
    are added separately to the space needed to display the element. This is the default
    value.

    +   - border-box will set the size of the element from the outer edges of the
    border to the facing border.


    Internet Explorer used to calculate width and height using the border box method.
    This made sense to more people, but because IE was the only browser to use this
    method, it caused a lot of problems for Web designers.


    Firefox is experimenting with the padding-box, which will size the element from
    the outer edge of the padding, and ignore the border width. No other browsers
    are currently supporting this value.'
  merge: -1
  img_proc: true
