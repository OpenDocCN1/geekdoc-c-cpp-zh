  md: "# # Setting an Element's Outline\n\nThe outline (Table 10.11) surrounds the\
    \ border and even uses the same values as the border; unlike the border, it does\
    \ not increase the apparent dimensions (width or height) of the box and does not\
    \ actually occupy any space on the screen. Instead, it appears under any margin\
    \ and out into the page under surrounding content.\n\nAn outline can be very useful\
    \ for link-rollovers, allowing you to highlight them without displacing the surrounding\
    \ content.\n\n# ## To set a box's outline:\n\n+   1. The outline property looks\
    \ identical to the border property, although it behaves differently. Enter a width,\
    \ style, and color separated by spaces (Code 10.8). outline: rgba(135,127,107,.65)\
    \ • 10px double;\n\n+   2. Alternatively, you can define each outline value, which\
    \ is useful when you need to override one element value without changing the others.\
    \ outline-color: rgba(135,127,107,.65); outline-width: 10px; outline-style: double;\n\
    \nUnlike border, outline cannot be set independently for the sides.\n\n> > TIP\
    \ I tend to use outline only when I am debugging element positioning on my page,\
    \ and I want to see exactly how much space each block is taking up and where they\
    \ extend.\n\n> > TIP Another good use of outline is using attribute selectors\
    \ (Chapter 4) to highlight particular elements without disturbing their positioning.\n\
    \n| Value |\n|---|\n| <border-width> • 8 • • • • |\n| <border-style> • 8 • • •\
    \ • |\n| <border-color> • 8 • • • • |\n\nCode 10.8 Added to box-properties.css—When\
    \ applied to Code 10.1, the outline style can be used to highlight links being\
    \ hovered over without disturbing the surrounding elements 4\n\n```\n```css\n\
    /* ** box-properties.css ** */\nfooter a:hover {\n    outline: rgba(135,127,107,.65)\
    \ 10px\n    • double;\n}\n```\n```\n\n![](img/e1ed1e3c1873fa9fc855210fb83699d0_289_0.png)\n\
    \nA Code 10.8 applied to Code 10.1: The link “Table of Contents” in the footer\
    \ navigation is highlighted using the outline.\n\n# ## Outline Offset\n\nAdd the\
    \ outline-offset property to add some distance between the outline and the border\
    \ or content edge (Table 10.12). Think of this as padding for the outline: outline-offset:\
    \ 2px;\n\n| Value |\n|---|\n| <length> • • • • • • |\n| inherit • • • • • • |"
