  md: '# To style descendants universally:


    +   1. Set up a list of descendant selectors including a universal selector. Type
    the HTML selector of the parent tag, followed by a space, and then an asterisk
    (*) or other selectors (Code 4.2).


    ```

    article chaptertext p * em {...}

    ```


    +   2. Styles will be used *only* if the pattern is matched. Generally, the universal
    selector is used at the end of a list of selectors so that the style is applied
    explicitly to all of a parent''s direct descendants (children). However, the styles
    will not be directly applied to those children''s descendants.


    In this example, the style is applied to the emphasis tag inside *any* parent
    tag (such as `<strong>`) in a paragraph, such as:


    ```

    <article class="chaptertext"><p>

    • <strong><em>...</em></em></strong>

    • </p></article>

    ```


    Or:


    ```

    <article class="chaptertext"><p>

    <q><em>...</em></q></p></article>

    ```


    However, an emphasis tag that is *not* in another tag in the paragraph will not
    be styled.


    ```

    <article class="chaptertext"><p>

    • <em>...</em></p></article>

    ```


    > TIP Like grouped selectors, contextual selectors can include class selectors
    (dependent or independent), ID selectors in the list, and HTML selectors.'
