- pgno: 64
  md: '# # External: Adding Styles to a Web Site


    A major benefit of CSS is that you can create a style sheet once and use it either
    in a single Web page or throughout your entire Web site. To do this, you create
    an external CSS file separate from the HTML document that contains only CSS code—no
    HTML, JavaScript, or any other code.


    Establishing an external CSS file is a two-step process. First, you set up the
    CSS rules in a text file. Second, you link or import this file into an HTML document
    using the <link> tag or the @import rule A.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_64_0.png)


    A External CSS files can be used to style HTML pages directly by linking or importing
    them.'
  merge: -1
  img_proc: true
- pgno: 65
  md: "# Creating an external style sheet\n\nThe first step in using an external style\
    \ sheet globally on a Web site is to create the external file that contains all\
    \ the CSS code. However, unlike adding embedded styles, you do not use <style>\
    \ tags in an external CSS file. In fact, doing so would cause the external style\
    \ sheet to fail.\n\nIn this example, I set up three CSS files: global.css, ch01.css,\
    \ and ch12.css.\n\n# To set up an external CSS file:\n\n+   1. Create a new text\
    \ file. You can use a text editor or Web-editing software. Save the file using\
    \ the .css extension. For example, global.css.\n\nNotepad or SimpleText will do,\
    \ but you may want to use a specialized code editing software program such as\
    \ Coda or BBEdit.\n\nDo not use Microsoft Word. It adds its own markup code that\
    \ will interfere with your CSS code.\n\n+   2. Import CSS files. This is optional,\
    \ but you can create as many external style sheets as you want and import style\
    \ sheets into each other to combine their styles (Code 3.4 and Code 3.5). However,\
    \ if an import rule is included in an external style sheet, it must be placed\
    \ before all other CSS code. See “Importing a style sheet” in this chapter for\
    \ more information.\n\n```\n@import(global.css)\n```\n\n# Code 3.3 global.css—All\
    \ the basic styles for the Web site are contained in the default external style\
    \ sheet.\n\n```\nbody {\n  padding: 220px 0 0 180px; }\nh1\n  color: green;\n\
    \  font-size: 3em;\n  font-weight: bold; }\nh1 .chaptertitle {\n  color: blue;\n\
    \  font-size: 5em;\n  font-weight: normal; }\np {\n  color: violet;\n  font-size:\
    \ 1.5em;\n  line-height: 2; }\n```\n\n# Code 3.4 ch01.css—Adds a special background\
    \ image for Chapter 1.\n\n```\nbody { background: white\n  url('alice23a.gif')\
    \ no-repeat 0 0; }\n```\n\n# Code 3.5 ch12.css—Adds a specific image for Chapter\
    \ 12.\n\n```\nbody { background: white\n  url('alice40b.gif') no-repeat 0 0; }\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 66
  md: "# 3. Add your CSS rules to the text file (Code 3.3). Do not include any other\
    \ code types—no HTML or JavaScript.\n\nStart a new rule by typing the selector\
    \ to which you want to add styles, followed by opening and closing curly brackets\
    \ ({}). (Basic selectors—HTML, class, IDs, and universal—are explained in this\
    \ chapter, and contextual selectors are explained in Chapter 4.)\n\n```\nh1 {\
    \ color: green;\n    font-size: 3em; font-weight:\n    .bold; }\n```\n\nIn the\
    \ brackets of your rule, type the declarations to be assigned to this rule—formatted\
    \ as property: value—using a semicolon (;) and separating individual declarations\
    \ in the list. (You can also add comments as explained later in this chapter.)\n\
    \nYou can now connect this file to your Web pages using one of the following two\
    \ methods:\n\n+   - Link. Use the <link> tag to connect external CSS files to\
    \ an HTML file.\n+   - Import. Use @import to connect external CSS files to an\
    \ HTML file.\n\n> TIP Although the external CSS file can have any name, it’s a\
    \ good idea to use a name that will remind you of the purpose of these styles.\
    \ The name “navigation.css,” for example, is probably a more helpful name than\
    \ “657nm87gp.css.”\n\n> TIP A CSS file should not contain any HTML tags (especially\
    \ not the <style> tag) or other content, with the exception of CSS comments and\
    \ imported styles."
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Linking to a style sheet


    External style sheet files can be applied to any HTML file using the <link> tag.
    Linking a CSS file affects the document in the same way as if the styles had been
    embedded directly in the head of the document; but, by placing it in a separate
    file, the code can be reused across multiple Web pages and changes made in the
    one central file will affect all of those pages.


    # To link to an external CSS file:


    +   1. Add a link tag to your HTML document. Within the <head>...</head> of your
    HTML document (Code 3.6), open your <link> tag and type a space. <link


    +   2. Specify the link''s relation to the document as a stylesheet. This is important,
    since the link tag can be used to add other file types. Leaving this out will
    cause many browsers to not load the code. rel="stylesheet"


    +   3. Specify the location of the CSS file to be used, either global or local.
    For example, ch01.css. This is the full path and name (including extension) of
    the external CSS document. In Chapter 15, you''ll explore style sheet strategies
    for locating external style sheets in relation to your HTML documents. href="global.css"


    +   4. Specify the type of information that is being linked. In this example,
    it''s a text file containing CSS. type="text/css"


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_67_0.png)


    The general syntax for the link tag.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_67_1.png)


    The results of Code 3.6. Our page with all the default and Chapter 1 specific
    styles applied'
  merge: -1
  img_proc: true
