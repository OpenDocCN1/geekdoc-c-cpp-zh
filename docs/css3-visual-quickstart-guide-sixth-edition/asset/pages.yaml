    # # Transforming an Element


    Transforms permits you to manipulate elements beyond the basic position properties,
    allowing you to finally break out of the rectangular layout grid with values to
    rotate, scale, skew, and move elements.


    Transform values have three basic value types that you might use:


    +   - **Angle** can be defined in degrees (90deg), grads (100grad), or radians
    (1.638rad). Negative values and values greater than 360deg are allowed but are
    translated into positive values.

    +   - **Number** can be any integer or decimal value, positive or negative. Numbers
    are generally used as multipliers.

    +   - **Length** is a length value, as defined in the introduction of this book.
    This can include relative values (em, px, %) or absolute values (in, mm, cm).


    Many transform values can take multiple parenthetical values, separated by a comma:
    scale(2,1,65)


    Generally, two or three values will represent the X, Y, and Z axes. If only one
    value is included, it is assumed that it should be applied to all three.


    As with many advanced CSS3 properties, transformations are currently implemented
    using extensions to browsers.


    Transformations are a bit of a cheat, though. Yes, they enable you to create incredibly
    cool designs. However, each transform “value” shown in Table 12.1 (for 2D) and
    Table 12.2 (for 3D) could actually be a property in and of itself because each
    takes its own parenthetical values. But instead, they are all associated with
    the transform property, and we’ll have to live with that.'
  merge: -1
  img_proc: true
