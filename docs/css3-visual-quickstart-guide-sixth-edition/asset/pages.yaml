- pgno: 396
  md: '# # CSS Best Practices


    It''s not enough to write CSS that makes your pages look pretty: to create the
    best Web pages, you must also write clean code that''s easy to read, easy to maintain,
    and that loads quickly.


    To manage your style sheets you need to know how to create well-organized code,
    work with CSS libraries and frameworks, optimize the linking of style sheets,
    validate your CSS, and compress the code by minifying it.


    This chapter helps you realize all these goals and finishes with a review of the
    best practices I''ve presented throughout the book.


    # ## In This Chapter


    +   - Create Readable Style Sheets 376

    +   - Have a Style Sheet Strategy 381

    +   - Troubleshoot Your CSS Code 386

    +   - View CSS in Firebug or Web Inspector 390

    +   - Validate Your CSS Code 395

    +   - Minify Your CSS 396

    +   - 33 CSS Best Practices 399'
  merge: -1
  img_proc: true
- pgno: 397
  md: '# Create Readable Style Sheets


    Although the computer interprets the CSS code to render a Web page, you and other
    humans have to create and edit it. During development, your code will probably
    get pretty messy, which makes it hard to track down rule interactions, determine
    the cascade order, or even locate rules that need changing.


    Keeping your code organized while you work can actually save you time. Follow
    these simple suggestions to keep your code as readable as possible during development,
    and then double-check and clean up your code before you deploy.


    # Include an introduction and TOC


    Place an introduction at the top of your CSS that includes basic information such
    as the title, site name, version, change date, usage, and other notes (Code 15.1).
    Additionally, some developers like to insert a rough table of contents, outlining
    the organizational structure of the style sheets.


    # CSS Libraries and Frameworks


    A CSS library is simply a collection of common styles that you use throughout
    one Web site, and potentially, multiple Web sites. The library can include your
    CSS reset, general typography, general transition styles, or any other style that
    requires consistency.


    CSS frameworks are ready-built CSS libraries that allow you to quickly deploy
    well-tested and finely crafted CSS code to your own Web site. Generally, CSS frameworks
    are free, community-based efforts maintained by interested volunteers.


    For simple Web sites, frameworks can be overkill, adding a lot of code that will
    never be used. However, even for medium-sized sites, frameworks can be a real
    time-saver.


    Some of the more popular CSS frameworks include:


    +   - Blueprint—Provides a solid layout grid, typographic styles, and a style
    sheet for printing pages. Visit www.blueprintcss.org.

    +   - Emastic—Uses ems to create elastic layouts. Visit code.google.com/p/emastic.

    +   - Intuit CSS—Uses 12- and 16-column grids at 960px wide and typographic style
    rules to create a strong vertical rhythm. Visit csswizardry.com/inuitcss.

    +   - YUI Grids—Yahoo''s CSS Grids framework provides fixed and fluid layouts.
    Visit yuilibrary.com/yui/docs/cssgrids.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_397_0.png)


    The home page of Blueprint, one of the more popular CSS frameworks.'
  merge: -1
  img_proc: true
- pgno: 398
