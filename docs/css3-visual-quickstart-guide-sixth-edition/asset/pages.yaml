- pgno: 117
  md: '# # Working with Pseudo-Elements


    A pseudo-element is a specific, unique part of an element—such as the first letter
    or first line of a paragraph—that can be styled independently of the rest of the
    element. (For a list of other pseudo-elements, see Table 4.5.)


    # ## Working with first letters and lines


    You can access the first letter of any block of text directly using the :first-letter
    pseudo-element. The first line of any block of text can be isolated for style
    treatment using the :first-line pseudo-element A.


    # ## To highlight the beginning of an article:


    +   1. Style the default version of the element.


    ```

    article p {...}

    ```


    Although not required, it''s generally a good idea to set the default style of
    the selector for which you will be styling the :first-letter pseudo-element (Code
    4.11).


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_117_0.png)


    A The general syntax for pseudo-elements. Pseudo-elements can have either a single
    or double colon, but use a single colon at present for increased browser compatibility.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_117_1.png)


    B The results of Code 4.11. A common typographic trick to draw the reader''s eye
    to the beginning of a paragraph is to use a drop cap and to bold the first line
    of text, as shown here.


    | Format | Selector Name | Elements Are Styled If... |

    | :--- | :--- | :--- |

    | :first-letter, ::first-letter | the first letter | first letter in text |

    | :first-line, ::first-line | the first line of text | they are the first line
    of text |

    | :after, ::after | After | space immediately before element |

    | :before, ::before | Before | space immediately after element |'
  merge: -1
  img_proc: true
