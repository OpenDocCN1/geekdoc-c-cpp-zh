  md: '3. Add the background attachment property and specify how the background should
    scroll with the element. Type background-attachment, followed by a colon (:).


    ```

    background-attachment: fixed;

    ```


    Then define how you want the background to be treated when the page scrolls by
    typing one of the following options (Table 7.9):


    +   - scroll instructs the background graphic to scroll with the element. This
    is the default value if the property is omitted.


    +   - fixed instructs the browser not to scroll the background content with the
    rest of the element. However, it will scroll with parent elements.


    +   - local is similar to fixed, but the background is fixed to the content of
    the element, rather than the element itself.


    | Value |

    |---|

    | scroll |

    | fixed |

    | local |


    4. Add the background position property and specify the positioning of the background.
    Type background-position, followed by a colon (:).


    ```

    background-position: 0 0;

    ```


    Then type one value or two values separated by a space to indicate where you want
    the background to appear in relation to the top-left corner of the element. If
    one value is entered, it is used for x, and y is centered. Use one of the following
    values (Table 7.10):


    +   - Length values, such as -10px. The values can be positive or negative. The
    first number tells the browser the distance the element should appear from the
    left edge of its parent; the second value specifies the position from the top
    edge of the parent.


    | Value |

    |---|

    | <length> |

    | <percentage> |

    | top |

    | bottom |

    | left |

    | right |

    | center |'
