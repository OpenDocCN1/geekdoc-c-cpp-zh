    # # Decorating Text


    Using the `text-decoration` property (Table 6.13), you can adorn text in one of
    three ways: underline, overline, or line-through. Used to add emphasis, these
    decorations attract the reader''s eye to important areas or passages on your Web
    page.


    Code 6.11 Added to `text-properties.css`—I use text decoration to set up a class
    called `.strike` that can be used to strike up unwanted text A and to turn off
    the unwanted underline on hypertext links B. Don''t worry, though. We''ll add
    hyperlinking back with more control using the border-bottom property in Chapter
    10.


    ```

    /*** text-properties.css ***/

    a { ( text-decoration: none; }

    .strike { }

    text-decoration: line-thzough; )

    ```


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_200_0.png)


    A Code 6.11 applied to Code 6.1: The address has been struck out.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_200_1.png)


    B Code 6.11 applied to Code 6.1: The links in the footer of the page are no longer
    underlined.


    # ## To decorate (or undecorate) text:


    +   1. Add the text decoration property. Type `text-decoration` in the CSS declaration
    list, followed by a colon (:) (Code 6.11).


    ```

    text-decoration:

    ```


    +   2. Specify the text decoration you want (or not).


    none;


    Type a value for the `text-decoration` property. Choose one of the following:


    +   > `underline` places a line below the text.


    +   > `overline` places a line above the text.


    +   > `line-through` places a line through the middle of the text (also called
    strikethrough).


    +   > `none` overrides decorations set elsewhere.'
