    \ weights associated with them; these weights have the effect of making the text\
    \ look more or less bold (Table 5.9). CSS can take advantage of this feature A.\n\
    \n# To define bold text in a CSS rule:\n\n+   1. Add the font weight property\
    \ to your CSS. Type the property name font-weight (Code 5.7), followed by a colon\
    \ (:).\n+      font-weight:\n+   2. Define the weight.\n+      bold;\n+      Type\
    \ the value for the font-weight property, using one of the following options:\n\
    +      - bold, which sets the font to boldface\n+      - bolder or lighter, which\
    \ sets the font's weight to be bolder or lighter relative to its parent element's\
    \ weight\n+      - A value from 100 to 900, in increments of 100, which increases\
    \ the weight, based on alternative versions of the font that are available\n+\
    \      - normal, which overrides other weight specifications\n\n> TIP Use font-weight\
    \ to add emphasis to text, but use it sparingly. If everything is bold, nothing\
    \ stands out.\n\n> TIP In reality, most fonts support only normal and bold, so\
    \ relative values have an absolute effect"
