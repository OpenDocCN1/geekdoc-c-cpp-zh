  md: "# # Grouping: Defining Elements That Are Using the Same Styles\n\nIf you want\
    \ two or more selectors to have the same declarations, group the selectors in\
    \ a list separated by commas. You can define common attributes in the declaration\
    \ block and then add rules for each selector individually to refine them, if you\
    \ like.\n\n![](img/e1ed1e3c1873fa9fc855210fb83699d0_85_0.png)\n\n```\np, .chaptertitle,\
    \ #ch01 {\n    color: red;\n    font-size: 3em;\n    font-weight: normal;\n}\n\
    ```\n\nThe general syntax for a list of selectors, all receiving the same declaration\
    \ block.\n\n# ## To group selectors:\n\n+   1. Add a grouping of selectors, separated\
    \ by commas. Type the list of selectors (HTML, class, or ID) separated by commas\
    \ (Code 3.12). You can also add one or more line breaks, spaces, or tabs after\
    \ a comma without interfering with the code to make it more readable.\n\n```\n\
    p, .chaptertitle, #ch01 {\n```\n\nThese selectors all receive the same declarations.\
    \ CSS rules can be defined within the style tags in the head of your document\
    \ or in an external CSS file that is imported or linked to the HTML document.\n\
    \n+   2. Add common declarations for the selector grouping. Within the curly brackets,\
    \ type the style declarations to be assigned to all of the listed selectors—formatted\
    \ as property: value—using a semicolon (;) and separating individual declarations\
    \ in the list. You can also add one or more line breaks, spaces, or tabs after\
    \ a declaration without interfering with the code to make it more readable.\n\n\
    ```\nfont-family: perpeutua, georgia,\n. serif;\n```"
