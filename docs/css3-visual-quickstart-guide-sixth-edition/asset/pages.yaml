- pgno: 391
  md: "# To set up a simple responsive design with CSS media queries:\n\n+   1. Add\
    \ the viewport meta tag (Code 14.12):\n\n```\n<meta name=\"viewport\"\n    content=\"\
    width=device-width,\n    • initial-scale=1,\n    • maximum-scale=1,\n    • minimum-scale=1,\n\
    \    • user-scalable=no\">\n```\n\nThis sets up the file for responsive design,\
    \ ensuring that the design is appropriately scaled to the user’s device and prevents\
    \ the user from zooming in, which might cause problems and annoyances because\
    \ the design is already scaled for best fit. If you are worried that some users\
    \ will want to zoom in, you can instead set user-scalable to yes.\n\n+   2. Add\
    \ a link to small.css\n\n```\n<link type=\"text/css\"\n    • rel=\"stylesheet\"\
    \ media=\"all\"\n    • href=\"css/small.css\" />\n```\n\nThis file contains the\
    \ base level and default styles that should be applied to any environment, as\
    \ well as the styles to make the design best fit within a smaller mobile device\
    \ such as a smart phone.\n\n+   3. Add a conditional link that will cover the\
    \ older versions of IE—not including mobile versions, which get the small version\
    \ of the CSS—loading large.css:\n\n```\n<!--[if (lt IE 9)&(IEMobile)]>\n    ...<![endif]-->\n\
    ```\n\nSince older versions of Internet Explorer can’t use media queries, we want\
    \ to make sure that they are styled for the computer screen."
  merge: -1
