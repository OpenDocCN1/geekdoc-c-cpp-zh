  md: '# # Setting Text Case


    When you''re dealing with dynamically generated output, such as from a database,
    you can never be sure whether the text will appear in uppercase, lowercase, or
    a combination of the two. With the text-transform property (Table 6.4), you can
    control the ultimate case of the text no matter how it begins.


    # ## To define the text case:


    +   1. Add the text-transform property to your CSS. Type text-transform in the
    CSS declaration list, followed by a colon (:) (Code 6.5).


    ```

    text-transform:

    ```


    +   2. Specify the text case.


    ```

    uppercase;

    ```


    Type one of the following text-transform values to specify how you want the text
    to be treated:


    +   > capitalize sets the first letter of each word to uppercase.

    +   > uppercase forces all letters to uppercase.

    +   > lowercase forces all letters to lowercase.

    +   > none overrides inherited text-case values and leaves the text unaltered.


    | Value | | | | | | |

    |---|---|---|---|---|---|---|

    | capitalize | ● | ● | ● | ● | ● | ● |

    | uppercase | ● | ● | ● | ● | ● | ● |

    | lowercase | ● | ● | ● | ● | ● | ➊ |


    Code 6.5 Added to text-properties.css—The text-transform property lets you take
    control of the text case ➊


    ```

    /*** text-properties.css ***/

    address {

    text-transform: uppercase; }

    .pageheader h2 cite {

    text-transform: uppercase; }

    ```'
