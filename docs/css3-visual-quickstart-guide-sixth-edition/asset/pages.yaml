- pgno: 152
  md: '# # Alice''s Adventures in Wonderland


    # ## By Lewis Carroll


    # ## Chapter I Down the Rabbit-Hole


    Alice was beginning to get very tired of sitting by her sister on the bank, and
    of having nothing to do: once or twice she had peeped into the book her sister
    was reading, but it had no pictures or conversations in it, “and what is the use
    of a book,” thought Alice, “without pictures or conversations?”


    So she was considering in her own mind (as well as she could, for the hot day
    made her feel very sleepy and stupid) whether the pleasure of making a daisy-chain
    would be worth the trouble of getting up and picking the daisies, when suddenly
    a White Rabbit with pink eyes ran close by her.


    The body copy is displayed in Constantia, Georgia, or Times New Roman, depending
    on which is available on the visitor''s computer. However, headers are displayed
    in Corbel, Helvetica, or Arial, also depending on availability.


    +   3. Define a list of alternative fonts, called understudy fonts, separated
    by commas. You can include as many as you want. These fonts will be used (in the
    order specified) if the previous font in the list is not available on the visitor''s
    computer. See “Why Include Understudy Fonts and Generic Font Families” in this
    chapter for more details.

    +   Georgia, “Times New Roman”,


    +   4. Define the generic font family. After the last understudy font, type the
    name of the generic font family for the particular style of font you’re using.
    Table 5.1 lists generic values for font families. Although including this value
    is optional, doing so is a good idea.

    +   serif;


    # # Why Include Understudy Fonts and Generic Font Families?


    When you provide a list of fonts, the browser tries to use the first font on that
    list. If it isn''t available, the browser continues through the list until it
    finds a font that is installed on the visitor''s computer. If no match is found,
    the browser displays the text in the visitor''s default font. The advantage of
    specifying a generic font is that the browser tries to display the text in the
    same style of font, even if the specific fonts on the list are not available.


    As a last resort, you can include the generic font family so that a browser can
    make an intelligent decision on the closest matching font.


    The advantage of using understudy and generic font families is that, even if a
    desired font is not available, you can still control which font is used in its
    place or, at least, get a close match.'
