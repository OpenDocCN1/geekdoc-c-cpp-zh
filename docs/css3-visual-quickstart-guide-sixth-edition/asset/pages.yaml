- pgno: 228
  md: '# Chapter 7: A Caucus-race and a Long Tale


    The Mouse gave a sudden leap and fell into the pool of tears which she had shed
    when she was nine feet high. ''I wish I hadn''t cried so much!'' said Alice, as
    she swam about, trying to find her way out. ''I shall be punished for it now,
    I suppose, by being drowned in my own tears! That WILL be a queer thing, to be
    sure! However, everything is queer to-day.''

    Just then she heard something splashing about in the pool a little way off, and
    she swam nearer to make out what it was: at first she thought it must be a walrus
    or hippopotamus, but then she remembered how small she was now, and she soon made
    out that it was only a mouse that had slipped in like herself.

    ''Would it be of any use, now,'' thought Alice, ''to speak to this mouse? Everything
    is so out-of-the-way down here, that I should think very likely it can talk: at
    any rate, there''s no harm in trying.'' So she began: ''O Mouse, do you know the
    way out of this pool? I am very tired of swimming about here, O Mouse!'' (Alice
    thought this must be the right way of speaking to a mouse: she had never done
    such a thing before, but she remembered having seen in her brother''s Latin Grammar,
    ''A mouse—of a mouse—to a mouse—a mouse—O mouse!'') The Mouse looked at her rather
    inquisitively, and seemed to her to wink with one of its little eyes, but it said
    nothing.

    ''Perhaps it doesn''t understand English,'' thought Alice; ''I daresay it''s a
    French mouse, come over with William the Conqueror.'' (For with all her knowledge
    of history, Alice had no very clear notion how long ago anything had happened.)
    So she began again: ''Ou est ma chatte?'' which was the first sentence in her
    French lesson-book. The Mouse gave a sudden leap out of the water, and seemed
    to quiver all over with fright. ''Oh, I beg your pardon!'' cried Alice hastily,
    afraid that she had hurt the poor animal''s feelings. ''I quite forgot you didn''t
    like cats.''

    ''Not like cats!'' cried the Mouse in a shrill, passionate voice. ''Would YOU
    like cats if you were me?''

    ''Well, perhaps not,'' said Alice in a soothing tone: ''don''t be angry about
    it. And yet I wish I could show you our cat Dinah: I think you''d take a fancy
    to cats if you could only see her. She is such a dear quiet thing,'' Alice went
    on, half to herself, as she swam lazily about in the pool, ''and she sits purring
    so nicely by the fire, licking her paws and washing her face—and she is such a
    nice soft thing to nurse—and she''s such a capital one for catching mice—oh, I
    beg your pardon!'' cried Alice again, for this time the Mouse was bristling all
    over, and she felt certain it must be really offended. ''We won''t talk about
    her any more if you''d rather not.''

    ''We indeed!'' cried the Mouse, who was trembling down to the end of his tail.
    ''As if I would talk on such a subject! Our family always HATED cats: nasty, low,
    vulgar things! Don''t let me hear the name again!''

    ''I won''t indeed!'' said Alice, in a great hurry to change the subject of conversation.
    ''Are you—are you fond—of—of dogs?'' The Mouse did not answer, so Alice went on
    eagerly: ''There is such a nice little dog near our house I should like to show
    you! A little bright-eyed terrier, you know, with oh, such long curly brown hair!
    And it''ll fetch things when you throw them, and it''ll sit up and beg for its
    dinner, and all sorts of things—I can''t remember half of them—and it belongs
    to a farmer, you know, and he says it''s so useful, it''s worth a hundred pounds!
    He says it kills all the rats and—oh dear!'' cried Alice in a sorrowful tone,
    ''I''m afraid I''ve offended it again!'' For the Mouse was swimming away from
    her as hard as it could go, and making quite a commotion in the pool as it went.

    So she called softly after it, ''Mouse dear! Do come back again, and we won''t
    talk about cats or dogs either, if you don''t like them!'' When the Mouse heard
    this, it turned round and swam slowly back to her: its face was quite pale (with
    passion, Alice thought), and it said in a low trembling voice, ''Let us get to
    the shore, and then I''ll tell you my history, and you''ll understand why it is
    I hate cats and dogs.''

    It was high time to go, for the pool was getting quite crowded with the birds
    and animals that had fallen into it: there was a Duck and a Dodo, a Lory and an
    Eaglet, and several other curious creatures. Alice led the way, and the whole
    party swam to the shore.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_228_0.png)


    ''Mine is a long and sad tale!'' said the Mouse, turning to Alice, and sighing.
    ''It is a long tail, certainly,'' said Alice, looking down with wonder at the
    Mouse''s tail; ''but why do you call it sad?'' And she kept on puzzling about
    it while the Mouse was speaking, so that her idea of the tale was something like
    this:—


    Fury said to a mouse, That he met in the house, ''Let us both go to law: I will
    prosecute YOU.—Come, I''ll take no denial; We must have a trial: For really this
    morning I''ve nothing to do.'' Said the mouse to the cur, ''Such a trial, dear
    Sir, With no jury or judge, would be wasting our breath.'' ''I''ll be judge, I''ll
    be jury,'' Said cunning old Fury: ''I''ll try the whole cause, and condemn you
    to death.''

    NOTICE THIS HORSE, AND...

    ''You are not attending!'' said the Mouse to Alice severely. ''What are you thinking
    of?''

    ''I beg your pardon,'' said Alice very humbly: ''you had got to the fifth bend,
    I think?''

    ''I had NOT!'' cried the Mouse, sharply and very angrily.

    ''A knot!'' said Alice, always ready to make herself useful, and looking anxiously
    about her. ''Oh, do let me help to undo it!''

    ''I shall do nothing of the sort,'' said the Mouse, getting up and walking away.
    ''You insult me by talking such nonsense!''

    ''I didn''t mean it!'' pleaded poor Alice. ''But you''re so easily offended, you
    know!''

    The Mouse only growled in reply.

    ''Please come back and finish your story!'' Alice called after it; and the others
    all joined in chorus, ''Yes, please do!'' but the Mouse only shook its head impatiently,
    and walked a little quicker.

    ''What a pity it wouldn''t stay!'' sighed the Lory, as soon as it was quite out
    of sight; and an old Crab took the opportunity of saying to her daughter ''Ah,
    my dear! Let this be a lesson to you never to lose YOUR temper!'' ''Hold your
    tongue, Ma!'' said the young Crab, a little snappishly. ''You''re enough to try
    the patience of an oyster!''

    ''I wish I had our Dinah here, you know!'' said Alice, addressing no one in particular.
    ''She''d soon fetch it back!''

    ''And who is Dinah, if I might venture to ask the question?'' said the Lory.

    Alice replied eagerly, for she was always ready to talk about her pet: ''Dinah''s
    our cat. And she''s such a capital one for catching mice, you can''t think! And
    oh, I wish you could see her after the birds! Why, she''ll eat a little bird as
    soon as look at it!''

    This speech caused a remarkable sensation among the party: some of the birds flew
    off at once: one old Magpie began wrapping itself up very carefully, remarking,
    ''I really must be getting home; the night-air doesn''t suit my throat!'' and
    a Canary called out in a trembling voice to its children, ''Come away, my dears!
    It''s high time you were all in bed!'' On various pretexts they all moved off,
    and Alice was soon left alone.

    ''I wish I hadn''t mentioned Dinah!'' she said to herself in a melancholy tone.
    ''Nobody seems to like her, down here, and I''m sure she''s the best cat in the
    world! Oh, my dear Dinah! I wonder if I shall see you any more at all!'' And here
    she began to cry again.

    ''You ought to be ashamed of yourself,'' said Alice, ''a great girl like you,''
    (she might well say this), ''to go on crying in this way! Stop this moment, I
    tell you!'' But she went on all the same, shedding gallons of tears, until there
    was a large pool all round her, about four inches deep and reaching half down
    the hall.

    After a time she heard a little pattering of feet in the distance, and she hastily
    dried her eyes to see what was coming. It was the White Rabbit returning, splendidly
    dressed, with a pair of white kid gloves in one hand and a large fan in the other:
    he came trotting along in a great hurry, muttering to himself as he came, ''Oh!
    the Duchess, the Duchess! Oh! won''t she be savage if I''ve kept her waiting!''
    Alice felt so desperate that she was ready to ask help of any one; so when the
    Rabbit came near her, she began, in a low, timid voice, ''If you please, sir—''
    The Rabbit started violently, dropped the white kid gloves and the fan, and skurried
    away into the darkness as hard as he could go.


