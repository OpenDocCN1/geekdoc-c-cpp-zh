    set in the group rule, make sure that this rule is placed after the group rule
    in your CSS. (See “Determining the Cascade Order” in Chapter 4.)


    **TIP** Grouping selectors like this can save a lot of time and repetition. But
    be careful. By changing the value of any of the properties in the combined declaration,
    you change that value for every selector in the list.


    **TIP** Grouping selectors does not directly affect their cascade order (explained
    in Chapter 4); rather, the grouping is treated as if each selector had this rule
    assigned to it in the order the selectors are listed.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_87_0.png)


