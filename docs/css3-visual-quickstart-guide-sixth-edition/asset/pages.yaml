  md: '# normal italic oblique


    A Italic or oblique? To really tell the difference, take a careful look at the
    letter “T” in both words.


    TABLE 5.8 Font-Style Values


    | Value | |

    |---|---|

    | normal | |

    | italic | |

    | oblique | |


    Code 5.6 Styles added to font-properties.css— The h1 and h2 tags both have italic
    set for them with this being overridden in the strong tag within an h2 ➋. We also
    need to change the font-style in the @font-face rule. This does not actually italicize
    the downloaded font, it just tells the browser to use this in place of an italicized
    version.


    ```

    /* *** font-properties.css *** */

    h1 { font-style: italic; }

    h2 { font-style: normal; }

    h2 cite { font-style: italic; }

    figcaption { font-style: italic; }

    ```


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_168_0.png)


    B Italics are often used to help set off text or to add emphasis, as with the
    chapter title.


    # Making Text Italic


    Two kinds of styled text that are often confused are italic and oblique. An italic
    font is a special version of a particular font, redesigned with more pronounced
    serifs and usually a slight slant to the right. An oblique font, on the other
    hand, is simply a font that is slanted to the right but otherwise identical to
    the normal version.


    Using the font-style property (Table 5.8), you can define a font as italic, oblique,
    or normal. When a font is set to italic but does not have an explicit italic version,
    the font defaults to oblique A


    # To set font-style for an element:


    +   1. Add the font-style property to your CSS. Type the property name font-style
    (Code 5.6), followed by a colon (:).

    +   font-style: italic;


    +   2. Define a style value. Type a value for the font-style. Your options are:

    +   > italic, which displays the type in an italic version of the font

    +   > oblique, which slants the text to the right

    +   > normal, which overrides any other styles set


    ```

    h2 strong { font-style: normal; }

    ```


    continues on next page'
