  img_proc: true
- pgno: 184
  md: 'TIP Adding space between lines of text enhances legibility—especially with
    large amounts of text. Generally, a line height of 1.5 to 2 times the font size
    is appropriate.


    TIP To double-space text, set the line-height value to 2 or 200%. Likewise, a
    value of 3 or 300% results in triple-spaced text.


    TIP You can use a percentage value lower than 100% or length values smaller than
    the font size to smash lines together. Although this effect may look neat in moderation,
    it won’t ingratiate you with your readers if they can’t actually read the text.


    TIP Line height can also be defined at the same time as the font size using the
    font shorthand property. (See “Setting Multiple Font Values at the Same Time”
    in Chapter 5.)


