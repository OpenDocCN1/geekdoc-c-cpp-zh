  md: "# # Setting an Element's Padding\n\nAt first glance, padding (Table 10.19)\
    \ seems to have an effect identical to margins: It adds space around the element's\
    \ content. The difference is that padding sets the space between the border of\
    \ the element and its content rather than between the element and the other elements\
    \ in the window. Padding is useful when you're using borders and background colors\
    \ and don't want the content butting right up to the edges.\n\n# ## To set padding:\n\
    \n+   1. Start your declaration by typing the padding property name, followed\
    \ by a colon (:) (Code 10.12).\n+      padding:\n+   2. Type a value for the element's\
    \ padding.\n+      10px;\n+   Use one of the following values:\n+   > Length values,\
    \ which create padding of the exact size you specify\n+   > A percentage, which\
    \ creates padding proportional to the parent element's width\n+   > inherit to\
    \ use the parent's padding value\n\n| Value | | | | | | |\n|---|---|---|---|---|---|---|\n\
    | <length> | ● | ● | ● | ● | ● | ● |\n| <percentage> | ● | ● | ● | ● | ● | ● |\n\
    | inherit | ● | ● | ● | ● | ● | ● |\n\nCode 10.12 Added to box-properties.css—When\
    \ applied to Code 10.1, the padding property allows you to add space between the\
    \ border of an element and its content A.\n\n```\n/*** box-properties.css ***/\n\
    body {\n    padding: 0;\n}\nh1 {\n    padding-top: 10px; }\nfooter {\n    padding:\
    \ 30px 0 10px 0; }\narticle {\n    padding: 20px; }\narticle h2 + p {\n    padding-bottom:\
