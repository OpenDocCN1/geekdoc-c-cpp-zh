- pgno: 27
  md: '# # The Evolution of CSS


    Over the years, CSS has evolved into its current form under the guidance of the
    W3C, but the process has often been slow. Although CSS is a standard—created by
    the W3C''s CSS Working Group—it is up to each browser to interpret and implement
    that standard. This has led to uneven implementation, with some browsers more
    compliant than others. A


    Even more troublesome is that, although the standard strives to be as clear and
    specific as possible, different browsers will implement the specifications with
    slightly different quirks.


    All modern browsers (Internet Explorer, Firefox, Safari, Opera) support the important
    capabilities of CSS3; but even after years of development, CSS3 remains a work
    in progress. Many features—such as transitions, transformations, and animation—are
    still not implemented or are underdeveloped in some browsers.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_27_0.png)


    A The evolutionary paths of HTML and CSS have not been particularly even or steady
    over the years. This timeline is not meant to be an exact historical chart, but
    does provide a general recountal of when each version of the standard was in its
    prime.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# ## CSS Level 1 (CSS1)


    The W3C released the first official version of CSS in 1996. This early version
    included the core capabilities associated with CSS, such as the ability to format
    text, set fonts, and set margins. Netscape 4 and Internet Explorer 3 and 4 supported
    Level 1.


    Web designers needed a way to position elements on the screen precisely. CSS1
    was already released, and CSS Level 2 was still in the future, so the W3C released
    a stopgap solution: CSS-Positioning. This standard proposed that the parties concerned
    could debate the details for awhile before the CSS-P standard became official.
    Netscape and Microsoft jumped on these proposals, however, and included the preliminary
    ideas in version 4 of their browsers.


    # ## CSS Level 2 (CSS2)


    The CSS2 spec came out in 1998 and is the most widely adopted by browser makers.
    Level 2 includes all the attributes of the previous two versions, plus an increased
    emphasis on international accessibility and the capability to specify media-specific
    CSS.


    In 2006, the W3C published an updated version: CSS Level 2.1, that corrected some
    errors, clarified a few issues, and included specifications for features that
    were already implemented in some browsers. CSS2.1 effectively replaced CSS2.


    # ## CSS Level 3 (CSS3)


    Unlike CSS1 and 2, a single, comprehensive CSS3 does not exist. Instead, rather
    than trying to release the entire specification at once, the CSS Working Group
    split the spec into a series of modules, each with its own developmental timeline.
    To read more about the ongoing work, check out www.w3.org/Style/CSS/current-work.


    TIP While knowing the differences among the CSS versions may be interesting, it
    isn''t necessary for using styles on the Web. However, you do need to know which
    styles are supported by the browsers you''re designing for. Although all modern
    browsers support most of the CSS Level 2 specification, older browsers support
    combinations of older versions of CSS. See Appendix A for details on which CSS
    properties each browser supports.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# # CSS and HTML


    When HTML was created, style properties were defined directly in the code. However,
    rather than just adding more and more tags and properties to HTML, the W3C introduced
    Cascading Style Sheets to fill the design void in straight HTML, allowing the
    Web to become semantic in structure. (See the sidebar “What Is the World Wide
    Web Consortium?”)


    Take the `<strong>` tag, for example. In HTML, this common tag does one thing
    and one thing only: It makes text “stronger,” usually by displaying it in bolder
    font. However, using CSS, you can “redefine” the `<strong>` tag so that it not
    only makes text bolder, but also adds more emphasis by displaying text in all
    caps and in a specific font. You could even set the `<strong>` tag to not make
    text bold A.


    Although both HTML and CSS have evolved over the years, they have rarely evolved
    in tandem. Instead, each standard has pretty much followed its own path. It’s
    a happy accident that both CSS3 and HTML5 have hit prime time at the same time,
    creating the new foundation and framework for modern Web sites.


    The power of CSS comes from its ability to mix-and-match rules from multiple sources
    to tailor your Web pages’ layouts to your exact needs. In some ways, it resembles
    computer programming—which is not too surprising, because a lot of this stuff
    was created by programmers, rather than Web designers. But once you get the hang
    of it, “speaking” CSS becomes as natural as putting together a sentence B.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_29_0.png)


    A The HTML `<strong>` tag is used to make text stand out; but using CSS, you can
    style that text any way you see fit.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_29_1.png)


    B The three core Web technologies—HTML, CSS, and JavaScript—work similarly to
    parts of speech. HTML provides the nouns, CSS the adjectives and adverbs, and
    JavaScript adds the verbs.'
  merge: -1
  img_proc: true
- pgno: 30
  md: "# Types of CSS Rules\n\nThe best thing about Cascading Style Sheets is that\
    \ they are amazingly simple to set up. They don’t require plug-ins or fancy software—just\
    \ text files with rules in them. A CSS rule defines what the HTML should look\
    \ like and how it should behave in the browser window.\n\nCSS rules come in four\
    \ types, each with specific uses:\n\n+   - HTML selector: The text portion of\
    \ an HTML tag is called the selector. For example, h1 is the selector for the\
    \ <h1> tag. The HTML selector is used in a CSS rule to redefine how the tag displays.\
    \ (See “(Re)Defining HTML Tags” in Chapter 3.) For example:\n+   \n+   h1 { color:\
    \ red; }\n+   \n+   will style:\n+   \n+   <h1>...</h1>\n\n+   - Class selector:\
    \ A class is a “free agent” rule that can be applied to any HTML tag at your discretion.\
    \ You can name the class almost anything you want. Because a class can be applied\
    \ to multiple HTML tags, it is the most versatile type of selector. (See “Defining\
    \ Reusable Classes” in Chapter 3.) For example, the class:\n+   \n+   .myClass\
    \ { font: bold 1.25em .times; }\n+   \n+   will style the tag:\n+   \n+   <h1\
    \ class=\"myClass\">...</h1>"
  merge: -1
  img_proc: true
- pgno: 31
  md: '+   * ID selector: Much like class selectors, ID rules can be applied to any
    HTML tag. ID selectors, however, should be applied only once to a particular HTML
    tag on a given page to create an object for use with a JavaScript function. For
    example, the ID:

    +   `#myObject1 { position: absolute; * top: 10px; }`

    +   will style the tag:

    +   `<h1 id="myObject1">...</h1>`


    +   * Universal selector: The universal selector is a stand-in selector represented
    by an asterisk (*) that is used when you


    +   want to apply a style regardless of the exact selector in use. This is especially
    helpful when you are using contextual styles and don''t know the exact context.
    For example, the universal selector:

    +   `article * strong { position: absolute; top: 10px; }`

    +   will style the strong tag in:

    +   `<article><p><strong>...</strong></p></article>`

    +   as well as in:

    +   `<article><blockquote><strong>...</strong></blockquote></article>`


    # What Is the World Wide Web Consortium?


    The World Wide Web Consortium (www.w3.org) is an organization that sets many of
    the standards that browser developers will use to create their products, including
    HTML and CSS (with the notable exception of JavaScript).

    Created in 1994, the W3C''s mission is “to lead the World Wide Web to its full
    potential by developing protocols and guidelines that ensure the long-term growth
    of the Web.”

    The W3C comprises more than 350 member organizations around the world. These organizations
    include vendors of technology products and services, content providers, corporate
    users, research laboratories, standards bodies, and governments.

    According to its Web site, the W3C has four goals:


    +   * Web for Everyone—To make the Web accessible to all people by promoting technologies
    that take into account the vast differences in culture, education, ability, material
    resources, and physical limitations of users on all continents.

    +   * Web on Everything—To allow all devices easy access to the Web. Although
    most access is still through desktop or laptop computers, an increasing array
    of devices can access the Web.

    +   * Knowledge Base—To develop an environment that permits each user to make
    the best use of the resources available on the Web.

    +   * Trust and Confidence—To guide the Web’s development with careful consideration
    for the novel legal, commercial, and social issues raised by this technology.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '![](img/e1ed1e3c1873fa9fc855210fb83699d0_32_0.png)


    (A) The basic syntax of a CSS rule. You start with a selector (HTML, Class, or
    ID). Then add a property, a value for that property, and a semicolon, which together
    are called a declaration. You can add as many definitions as you need as long
    as they are separated by a semicolon.


    # The Parts of a CSS Rule


    A CSS rule consists of properties and their values, which together are referred
    to as a declaration. A single CSS rule can have multiple declarations, each separated
    by a semicolon ( ; ). All rules, regardless of their locations or types, have
    the following structural elements:


    +   Selectors are the alphanumeric characters that identify a rule. A selector
    can be an HTML tag selector, a class selector, an ID selector, a universal selector
    (discussed in Chapter 3), or a combination of those basic selectors to create
    context-based styles (discussed in Chapter 4).


    +   Properties identify what is being defined. Several dozen properties are available.
    Each is responsible for an aspect of the page content’s behavior and appearance.


    +   Values are assigned to a property to define its nature. A value can be a keyword
    such as “red,” a number, or a percentage. The type of value used depends solely
    on the property to which it is assigned.


    > TIP Don’t confuse the selector of an HTML tag with its attributes. In the following
    tag, for example:

    > <img src="picture.gif">

    > img is the selector, and src is a property.


    > TIP Although you don’t have to include a semicolon with the last definition
    in a list, experience shows that adding this semicolon can prevent future headaches.
    For example, if you forgot to put in the required semicolon before the addition
    and you later decide to add a new definition to the rule, you may cause the rule
    to fail completely. What’s worse, not only will that one definition fail, but
    all the definitions in the rule won’t be applied.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# # CSS Browser Extensions


    In addition to supporting the specified CSS properties set by the W3C, a browser
    developer will occasionally introduce browser-specific properties. This is often
    done for one of two reasons:


    +   - A spec is still under development by the W3C but the browser developer wants
    to start using the style now.


    +   - The browser developer wants to try a new idea but doesn''t want to wait
    for the W3C to accept it and begin work on it, which can take years.


    Sometimes the exact syntax of the official CSS specification will be slightly
    different from the "sandbox" version created for a specific browser.


    To avoid confusion and ensure forward compatibility of CSS code, each rendering
    engine has adapted its own prefix to use with CSS properties that are extensions
    unique to that browser. The prefixes for each browser are shown in Table 1.2.


    | Extension | Rendering Engine | Browser(s) | Example |

    | :--- | :--- | :--- | :--- |

    | -webkit- | Webkit | Safari, Chrome | -webkit-transition |

    | -moz- | Mozilla | Firefox | -moz-transition |

    | -o- | Presto | Opera | -o-transition |

    | -ms- | Trident | Internet Explorer | -ms-transition |

    | TimeToText (time) | The text equivalent of the supplied time, for use with formulas
    involving text or text-oriented functions | | |'
  merge: -1
  img_proc: true
- pgno: 34
  md: '```

    selector {

    -moz-property: value;

    -webkit-property: value;

    -o-property: value;

    -ms-property: value;

    property: value;

    }

    ```


    The browser CSS extensions can all be included to ensure a style is applied when
    available to a particular browser.


    These CSS extensions sometimes overlap and conflict when different browsers promote
    their own solutions. The good news is that due to the nature of CSS, you can include
    versions of each of the properties for individual browsers, so that the browser
    will use whichever version suits it.


    Throughout the book, I include browser CSS extensions, when appropriate, so that
    you can ensure the widest interoperability of your styles.


    Most browser manufacturers will drop an extension version of a style within two
    releases after they adopt the official version. This practice allows designers
    to catch up before their style sheets stop working.


    # One Webkit to Rule Them All? No, Just Don''t Be Lazy.


    One disturbing trend in Web design is for developers to simply rely on Webkit
    browser extensions, and ignore other browsers. There is little doubt that Webkit
    has been the leader in many new innovations. As a result, designers who want to
    use cutting-edge technologies are not using progressive enhancement to ensure
    cross browser functionality, even where that functionality is available in those
    other browsers using their own browser extension.


    For example, rather than include transition code for all browsers, some developers
    include it only for Webkit and leave other browsers out in the cold. This is a
    huge mistake, because neglecting Internet Explorer, Firefox, and even Opera alienates
    a sizable chunk of your audience.


    To complicate matters, Microsoft, Firefox, and Opera have openly stated that they
    will begin to support the -webkit- extension, which defeats the purpose of having
    these extensions in the first place.


    The problem, though, isn''t with the browser developers—who just want to make
    sure people use their browsers—but with lazy Web developers who don''t want to
    include a few extra lines of code to address cross-browser compatibility. But,
    you would never do that, right?'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# # New in CSS3


    This is a particularly exciting time to be a Web designer because we are about
    to get an entirely new box of tools. A lot of new CSS3 capabilities are ready
    for prime time and they will explode your creativity.


    This slim volume covers the breadth of CSS3, much of which remains unchanged since
    CSS2/2.1. If you are an old hand at CSS, look for the “New in CSS3” mark A to
    quickly find the good, new stuff.


    Here''s a brief peak at what''s new:


    +   - Animations—Move objects without using JavaScript.

    +   - Borders—Multiple border colors on a border, border images, and rounded corners
    can be applied.

    +   - Backgrounds—Multiple backgrounds can be added to a single element, backgrounds
    can be more precisely positioned, backgrounds can be extended and clipped to the
    inside or outside of a border, and backgrounds can be resized.

    +   - Color—Color opacity settings, gradients in backgrounds, and HSL color values
    are available.

    +   - Text—Text shadows, text overflow, and word wrapping are available.

    +   - Transformations—Scale, skew, move, and rotate an element in 2D or 3D space.

    +   - Transitions—Use simple dynamic style transitions.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_35_0.png)


    A The “New in CSS3” mark.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# CSS4?


    Believe it or not, the CSS Work Group has already started working on the next
    generation of CSS, appropriately named CSS4. While it is unlikely that it will
    be ready to affect your work for a couple of years, it''s good to know that progress
    is being made.


    The group is focusing on adding a variety of new selectors to better refine styling.
    One new selector that I am especially gratified to see is the :local-link pseudo-class.
    I''ve been lobbying for something like this for 15 years. The :local-link pseudo-class
    will finally give us the power to style links based on where we are within a Web
    site (current page or in a particular section) and differentiate between local
    and external links.


    For more details, check out the working draft: www.w3.org/TR/2011/WD-selectors4-20110929/.


    +   - Box—Add drop shadows, place user-resizable boxes, and set overflow separately
    in horizontal and vertical directions. Use outline offset to set the space between
    the outline and the border, and apply box model specifications to set how width
    and height are applied to a box.


    +   - Content—Styles can add content to an element.


    +   - Opacity—Elements can be transparent.


    +   - Media queries—Style pages can be based on the viewport size, color, aspect
    ratio, resolution, and other important design considerations.


    +   - Web fonts—These update and extend the ability to link to fonts for use in
    a design.


    Not everything in the CSS3 specification is ready for use, though. When it would
    be “jumping the gun” to use new features right now, I’ve added a section near
    the end of some chapters called “Coming Soon!” that includes quick overviews of
    what to expect in the future.'
  merge: -1
  img_proc: true
