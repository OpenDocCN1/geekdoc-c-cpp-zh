- pgno: 249
  md: "# # Setting the Table Layout\n\nDifferent browsers use different methods to\
    \ calculate how a particular table is displayed. Two primary table-layout (Table\
    \ 8.6) methods are favored:\n\n+   - Fixed method bases its layout on the width\
    \ of the table and the width of columns in the first row. This method is generally\
    \ faster than automatic.\n\n+   - Automatic uses the table column width along\
    \ with the amount of content in the table data cell to calculate the table data\
    \ cell width. This will generally render more slowly than the fixed method, but\
    \ it also produces more accurate results for widths throughout the table.\n\n\
    # ## To set the table layout method:\n\n+   1. Add the table layout property to\
    \ a CSS rule for a table element. Type table-layout, followed by a colon (:) on\
    \ table elements (Code 8.6): table-layout:\n\n+   2. Specify the layout method.\
    \ auto;\n\nType one of the following values to specify which method you want to\
    \ use when displaying your table:\n\n+   > fixed will use your first row to calculate\
    \ the overall width of table data cells in that column of the table.\n\n+   >\
    \ auto will allow the browser to calculate the widths of table data cells based\
    \ on their content and the overall width of the table.\n\n> **TIP** Although fixed\
    \ renders faster for longer tables, auto generally provides better results unless\
    \ the rows of data are consistent in size.\n\n| Value |\n|---|\n| fixed |\n| auto\
    \ |\n| inherit |\n\nCode 8.6 Added to list-table-properties: The table-layout\
    \ property lets you force the browser to use either the fixed or auto methods\
    \ for rendering tables.\n\n```\n/* list-table-properties.css */\ntable {\n\ttable-layout:\
    \ fixed;\n}\n```\n\n![](img/e1ed1e3c1873fa9fc855210fb83699d0_249_0.png)\n\n> Code\
    \ 8.6 applied to Code 8.1 with fixed layout: When content is much longer than\
    \ subsequent rows, the table looks cramped when using fixed.\n\n> **TIP** I recommend\
    \ auto since short tables will not take long to render, and long tables will need\
    \ more accuracy. Either way, auto is preferred."
  merge: -1
  img_proc: true
- pgno: 250
  md: "| Value | | | | | | |\n|---|---|---|---|---|---|---|\n| <length> | ○ | ○ |\
    \ ○ | ○ | ○ | ○ |\n| inherit | ○ | ○ | ○ | ○ | ○ | ○ |\n\nCode 8.7 Added to list-table-properties:\
    \ The border-spacing property works like a margin around the table data cell A.\n\
    \n```\ntable {\n border-spacing: 8px;\n}\n```\n\n![](img/e1ed1e3c1873fa9fc855210fb83699d0_250_0.png)\n\
    \nCode 8.7 applied to Code 8.1: Spacing out data cells can make them easier for\
    \ users to scan.\n\n# Setting the Space Between Table Cells\n\nAlthough table\
    \ data cells and table header cells can use many of the box properties we'll explore\
    \ in Chapter 10, they cannot use the margin property. Instead, CSS has the border-spacing\
    \ property (Table 8.7) property, which sets an equal amount of space between data\
    \ cells' top, bottom, left, and right sides.\n\n# To collapse the borders in a\
    \ table:\n\n+   1. Add the border spacing property to the CSS rule for a table\
    \ element. Type border-spacing, followed by a colon (:) (Code 8.7). border-spacing:\n\
    \n+   2. Specify the spacing between table data cells. 8px;\n\nType a length value\
    \ (such as 8px) to specify the distance between cells. (See “Values and Units\
    \ Used in This Book” in the Introduction.) Alternatively, use inherit to use the\
    \ same border spacing as a cell’s parent element."
  merge: -1
  img_proc: true
- pgno: 251
  md: "# # Collapsing Borders Between Table Cells\n\nEvery table data cell defined\
    \ by the <td> tag has four borders: top, right, bottom, and left. The border-collapse\
    \ property (Table 8.8) allows you to set a table so that each table data cell\
    \ will share its borders with an adjacent table data cell rather than creating\
    \ a separate border for each.\n\n# ## To collapse the borders in a table:\n\n\
    +   1. Add the border collapse property to a table element. Type border-collapse,\
    \ followed by a colon (:) (Code 8.8). border-collapse:\n\n+   2. Specify how borders\
    \ should collapse. separate;\n\nType one of the following to determine how you\
    \ want to display the borders in the table:\n\n+   > collapse will make adjacent\
    \ table data cells share a common border; however, you won't be able to set border-spacing\
    \ if borders are collapsed.\n\n+   > separate will maintain individual borders\
    \ for each table data cell.\n\n| Value | |\n|---|---|\n| collapse | |\n| separate\
    \ | |\n| inherit | |\n\nCode 8.8. Added to list-table-properties.css— The border-collapse\
    \ property lets you remove all space between the table data cells, giving each\
    \ side a single border (A), but border spacing will be ignored. Use separate to\
    \ allow border-spacing to work. (B)\n\n```\ntable {\n border-collapse: separate;\
    \ }\n```\n\n![](img/e1ed1e3c1873fa9fc855210fb83699d0_251_0.png)\n\nA By using\
    \ collapse, the border between data cells has been reduced to a single, thin line."
  merge: -1
  img_proc: true
