- pgno: 415
  md: '+   2. Open the Web Inspector panel. Navigate to the Web page you want to look
    at and in Safari choose Develop > Show Web Inspector, or in Chrome choose View
    > Developer > Developer Tools.


    +   3. View the CSS. You can view the CSS side by side with the HTML by clicking
    the Elements tab.


    +   4. Inspect an element. Click the Inspect icon (magnifying class) and then
    click the element in the screen you want to inspect. As you hover over an element,
    its box will be outlined, along with color-coded margins and padding. Firebug
    also highlights the element in the HTML code and displays all of the CSS being
    applied. Declarations are crossed out to indicate that they have been overridden
    by other declarations and are not being applied. Click to select an element for
    editing.


    +   5. Turn off a declaration. Hover over the declarations in the CSS, and a check
    box will appear next to each on the right side. Deselect the check box to turn
    off the declaration. Select the check box to turn it on. In the viewport, you
    immediately see the effect of turning the declaration on and off.


    +   6. Edit a declaration. Double-click the declaration you want to change and
    edit it as necessary. The effects of any changes will be visible almost immediately
    as you type.


    +   7. Add a new declaration. Double-click the empty space to the right of the
    declaration you want to precede your new declaration, type the property name,
    and then type the property value. Do not type the closing semicolon (;). Press
    Return to make the changes appear.


    > TIP There is a “lite” version of Firebug available for Chrome and Safari. It’s
    not as powerful, though, and I would recommend sticking with Web Inspector on
