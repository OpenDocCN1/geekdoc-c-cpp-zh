    # Chapter VI Pig and Pepper


    For some time she sat looking at the house, and wondering what to do next, when
    suddenly a footman in livery came running out of the wood—(she considered him
    to be a footman because he was in livery: otherwise, judging by his face only,
    she would have called him a fish)—and rapped loudly at the door with his knuckles.
    It was opened by another footman in livery, with a round face, and large eyes
    like a frog; and both footmen, Alice thought, looked very like a fish. She went
    up to the door and knocked.

    "There''s no sort of use in knocking," said the Footman, "and that for two reasons.
    First, because I''m on the same side of the door as you are; secondly, because
    they''re making such a noise inside, no one could possibly hear you."

    And certainly there was a most extraordinary noise going on within—a constant
    howling and sneezing, and every now and then a great crash, as if a dish or kettle
    had been broken to pieces.

    "Then how do you get in?" said Alice.

    "There might be some sense in your knocking," the Footman went on without attending
    to her question, "if we had the door between us. For instance, if you were INSIDE,
    you might knock, and I could let you out, you know."

    He was looking up into the sky all the time he was speaking, and this Alice thought
    decidedly uncivil. "But perhaps he can''t help it," she said to herself; "his
    eyes are so VERY nearly at the top of his head. But at any rate he might answer
    questions.—How am I to get in?" she repeated aloud.

    "I shall sit here," he said, "till tomorrow—"

    At this moment the door of the house opened, and a large plate came skimming out,
    straight at the Footman''s head: it just grazed his nose, and broke to pieces
    against one of the trees behind him.

    "—or next day, maybe," the Footman continued in the same tone, exactly as if nothing
    had happened.

    "How am I to get in?" asked Alice again, in a louder tone.

    "ARE you to get in at all?" said the Footman. "That''s the first question, you
    know."

    It was, no doubt: only Alice did not like to be told so.

    "It''s really dreadful," she muttered to herself, "the way all the creatures argue.
    It''s enough to drive one crazy!"

    The Footman seemed to think this a good opportunity for repeating his remark,
    with variations. "I shall sit here," he said, "on and off, for days and days."

    "But what am I to do?" said Alice.

    "Anything you like," said the Footman, and began whistling.

    "Oh, there''s no use in talking to him," said Alice desperately: "he''s perfectly
    idiotic!"

    And she opened the door and went in.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_270_0.png)


    Alice was much too much puzzled by all this to make any remark; but she waited
    patiently till the Cat''s head appeared again, and then she said, "Please, would
    you tell me which way I ought to go from here?"

    "That depends a good deal on where you want to get to," said the Cat.

    "I don''t much care where—" said Alice.

    "Then it doesn''t matter which way you go," said the Cat.

    "—so long as I get SOMEWHERE," Alice added as an explanation.

    "Oh, you''re sure to do that," said the Cat, "if you only walk long enough."

    Alice felt that this could not be denied, so she tried another question. "What
    sort of people live about here?"

    "In THAT direction," the Cat said, waving its right paw round, "lives a Hatter:
    and in THAT direction," waving the other paw, "lives a March Hare. Visit either
    you like: they''re both mad."

    "But I don''t want to go among mad people," Alice remarked.

    "Oh, you can''t help that," said the Cat: "we''re all mad here. I''m mad. You''re
    mad."

    "How do you know I''m mad?" said Alice.

    "You must be," said the Cat, "or you wouldn''t have come here."

    Alice didn''t think that proved it at all; however, she went on. "And how do you
    know that you''re mad?"

    "To begin with," said the Cat, "a dog''s not mad. You grant that?"

    "I suppose so," said Alice.

    "Well, then," the Cat went on, "you see, a dog growls when it''s angry, and wags
    its tail when it''s pleased. Now I growl when I''m pleased, and wag my tail when
    I''m angry. Therefore I''m mad."

    "I call it purring, not growling," said Alice.

    "Call it what you like," said the Cat. "Do you play croquet with the Queen to-day?"

    "I should like it very much," said Alice, "but I haven''t been invited yet."

    "You''ll see me there," said the Cat, and vanished.

    Alice was not much surprised at this, she was getting so well used to queer things
    happening. While she was looking at the place where it had been, it suddenly appeared
    again.

    "By-the-bye, what became of the baby?" said the Cat. "I''d nearly forgotten to
    ask."

    "It turned into a pig," Alice quietly answered, just as if nothing had happened.

    "I thought it would," said the Cat, and vanished again.

    Alice waited a little, half expecting to see it again, but it did not appear,
    and after a minute or two she walked on in the direction in which the March Hare
    was said to live. She had seen hatters before: she had seen a March Hare one day
    when she was out walking with her sister, and she thought it very likely that
    she might find one here.


