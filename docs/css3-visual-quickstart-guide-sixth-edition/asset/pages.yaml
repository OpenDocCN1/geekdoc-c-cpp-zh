  md: "Code 4.14 default.css—These styles are applied regardless of the screen size;\
    \ but we are tailoring the styles for small devices, most likely mobile devices\
    \ such as smart phones. We start with the small sizes first, and then tailor for\
    \ larger sizes in the next two CSS files.\n\n```\n/* Default Screen Styles */\n\
    body {\n color: charcoal;\n font: normal 1.5em/1 helvetica, arial,\n -sans-serif;\n\
    \ background: silver url('alice23c.gif')\n -no-repeat center 0;\n padding: 120px\
