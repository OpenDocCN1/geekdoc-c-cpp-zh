- pgno: 317
  md: "# # Setting the Visibility of an Element\n\nThe visibility property designates\
    \ whether an element is visible in the window. If visibility is set to hidden\
    \ (Table 11.5), the element is invisible but still occupies space in the document,\
    \ and an empty rectangle appears where the element is located A.\n\n# ## To set\
    \ an element's visibility:\n\n+   1. Specify a position type. For details, see\
    \ “Setting the Positioning Type” earlier in this chapter.\n+   \n+   2. Add the\
    \ visibility property to your CSS. Type visibility in the element's CSS declaration\
    \ block, followed by a colon (:). visibility:\n+   \n+   3. Specify how the element's\
    \ visibility should be treated. hidden;\n\nType one of the following keywords\
    \ to specify how you want this element to be treated:\n\n+   > hidden makes the\
    \ element invisible when the document is initially rendered on the screen.\n+\
    \   > visible makes the element visible.\n+   > inherit causes the element to\
    \ inherit the visibility of its parent element.\n\n| Value | | | | | |\n|---|---|---|---|---|---|\n\
    | hidden | | | | | |\n| visible | | | | | |\n| inherit | 9 | | | | |\n\n![](img/e1ed1e3c1873fa9fc855210fb83699d0_317_0.png)\n\
    \n> The hidden element no longer appears, although its location is shown as an\
    \ empty space indicated by the dotted line in this figure (no, there will not\
    \ actually be a dotted line)."
  merge: -1
  img_proc: true
- pgno: 318
  md: 'TIP Although the properties seem similar, visibility differs radically from
    display (Chapter 10). When display is set to none, the element is scrubbed from
    the document, and no space is reserved for it. Visibility reserves and displays
    the empty space like the invisible man in his bandages.


    TIP Generally, display:none is used for JavaScript effects, such as drop-down
    menus and pop-up text, in which elements are alternately hidden and shown. Because
    this property will remove the element, it prevents the element from interfering
    with the layout of the page when not needed.


    TIP I recommend using display:none to hide elements, such as navigation, when
    creating a print style sheet.


    TIP One downside to hidden elements is that Web search engines will not see them
    nor will screen readers used by the vision impaired. If you do hide content, make
    sure it''s not something that is vital for SEO.'
  merge: -1
  img_proc: true
- pgno: 319
  md: '# Clipping an Element''s Visible Area


    Unlike setting the width and the height of an element, which controls the element''s
    dimensions (see Chapter 10), clipping an absolute- or fixed-position element designates
    how much of that element''s content will be visible (Table 11.6). The part that
    is not designated as visible will still be present, but viewers won''t be able
    to see it, and the browser will treat it as empty space A.


    TABLE 11.6 Clip Values


    | Value |

    | :--- |

    | rect (<top> <right> <bottom> <left>) |

    | auto |

    | inherit |


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_319_0.png)


    A The center area is clipped based on the top, right, bottom, and left values
    provided to the clip property. The transparent area will not be visible.'
  merge: -1
  img_proc: true
