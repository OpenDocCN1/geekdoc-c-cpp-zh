- pgno: 321
  md: '# # ★Setting an Element''s Opacity


    One of the earliest and most widely implemented CSS3 features was the ability
    to set element opacity, which let you transform an element from opaque to transparent
    and any translucency in between A. However, different browsers implement opacity
    in different ways.


    For example, rather than implementing the W3C CSS syntax, Internet Explorer builds
    on its existing filter functionality, whereas other W3C-compliant browsers simply
    add the opacity property (Table 11.7). Because Internet Explorer ignores the other
    browsers'' code, you can place both declarations in the rule list for an element
    to control its opacity.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_321_0.png)


    Changing opacity allows you to see through to the element underneath.


    | Value | | | | | |

    |---|---|---|---|---|---|

    | `<alphavalue>` | | | | | |

    | `inherit` | | | | | |'
  merge: -1
  img_proc: true
