- pgno: 315
  md: '# Stacking Objects in 3D


    Although the screen is a two-dimensional area, positioned elements can be given
    a third dimension: a relative stacking order.


    Positioned elements are assigned stacking numbers automatically, starting with
    0 and continuing incrementally—1, 2, 3, and so on—in the order in which the elements
    appear in the HTML and relative to their parents and siblings A. Elements with
    higher numbers appear above those with lower numbers. This system is called the
    z-index (Table 11.4). An element''s z-index number establishes its 3D relationship
    to other elements in its parent element B.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_315_0.png)


    The natural z order of three elements.


    TABLE 11.4 Z-Index Values


    | Value | |

    | --- | --- |

    | <number> | |

    | auto | |

    | inherit | |


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_315_1.png)


    The natural z order has been overridden using the z-index property.


    When the content of elements overlap, the element with a higher z-index number
    will appear on top of the element with a lower number C. The z-index is always
    relative to an element''s siblings, not to its parents.


    You can override the natural order of the z-index by setting a value for the z-index
    property.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_315_2.png)


    The z-index order is relative to an element''s siblings.'
  merge: -1
  img_proc: true
- pgno: 316
