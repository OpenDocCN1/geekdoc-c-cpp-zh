- pgno: 97
  md: '# Styling only the children


    If you want to style only a parent''s child elements (not a grandchild descending),
    you must specify the parent selector and child selector, separated by a right
    angle bracket (>) ⑤.


    # To define child selectors:


    +   1. Set up a list of direct child selectors.


    Type the selector for the parent element (HTML, class, or ID), followed by a right
    angle bracket (>) and the child selector (HTML, class, or ID).


    ```

    article.chaptertext > p > em {...}

    ```


    You can repeat this as many times as you want with the final selector being the
    target to which you apply the styles (Code 4.3). You can have one space between
    the selector and the greater-than sign or no spaces.


    +   2. Styles are used only if the pattern is matched.


    ```

    <article class="chaptertext"><p><em>...</em></p></article>

    ```


    The styles from Step 1 are applied if and only if the final selector is an immediate
    child element nested in the preceding element. Placing the tag within any other
    HTML tags will disrupt the pattern. In this example, the emphasis tag (em) is
    styled only if it is in a paragraph (p) within an article (article).


    However, any emphasis tag that is in another tag will not be styled:


    ```

    <article class="chaptertext"><p><q><em>...</em></q></p></article>

    ```


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_97_0.png)


    ⑤ The general syntax of the direct child selector.'
  merge: -1
  img_proc: true
