- pgno: 90
  md: "# Selective Styling\n\nIt's not enough to style a Web page element. The art\
    \ of CSS—and thus the art of Web design—is the ability to style elements based\
    \ on their context. You must consider where an element is in the document; which\
    \ elements surround it; its attributes, content, and dynamic state; and even the\
    \ platform displaying the element (screen, handheld device, TV, and so on).\n\n\
    Selective styling is the closest that CSS gets to traditional computer programming,\
    \ allowing you to style elements if they meet certain criteria. This level of\
    \ styling can get increasingly complex, so it's important, at least in this chapter,\
    \ to start out as simply as possible and build a firm foundation of understanding.\n\
    \n+   ## In This Chapter\n+   \n+   The Element Family Tree 70\n+   Defining Styles\
    \ Based on Context 71\n+   ★ Working with Pseudo-Classes 82\n+   Working with\
    \ Pseudo-Elements 96\n+   Defining Styles Based on Tag Attributes 100\n+   ★ Querying\
    \ the Media 104\n+   Inheriting Properties from a Parent 115\n+   Making a Declaration\
    \ Important 117\n+   Determining the Cascade Order 119"
  merge: -1
  img_proc: true
- pgno: 91
  md: '# # The Element Family Tree


    When a tag is surrounded by another tag—one inside another—the tags are nested.

    <h2><strong>Chapter 2</strong> The Pool of Tears</h2>


    In a nested set, the outer element in this example (<h2>) is called the parent,
    and the inner element (<strong>) is the child. The child tag and any children
    of that child tag are the parents'' descendants. Two tags in the same parent are
    called siblings, and two tags immediately next to each other are adjacent siblings.


    +   - Parent elements contain other elements (children). Child elements will often
    inherit styles from a parent element.


    +   - Descendent elements are any elements within another element.


    +   - Child elements are first-generation descendent elements in relation to the
    parent. Second generation and higher elements are sometimes referred to as grandchildren.


    +   - Adjacent or preceding sibling elements are child elements of the same generation
    that are immediately next to each other in the HTML code.


    In Chapter 3, you learned ways to specify the styles of an individual element
    regardless of where it is placed in the HTML code. However, CSS also lets you
    specify the element''s style depending on its content. Using contextual selectors,
    you can specify styles based on a tag''s relationship to other tags, classes,
    or IDs on the page.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_91_0.png)


    A The article element is the parent to the elements created by the paragraph,
    strong, and emphasis tags, which are its descendents. Only the paragraph tag is
    a direct child. The elements created by the emphasis and strong tags are children
    of the paragraph tag, and each other''s siblings.'
  merge: -1
  img_proc: true
- pgno: 92
  md: "# Defining Styles\nBased on Context\n\nContextual styles allow you to specify\
    \ how\na particular element should appear based\non its parents and siblings.\
    \ For example,\nyou may want an emphasis tag to appear\none way when it’s in the\
    \ main header of\nthe page and differently when it appears in\nthe sub-header.\
    \ You may want still another\nappearance in a paragraph of text. These\ncombinatory\
    \ selectors (Table 4.1) are\namong the most used and useful in CSS.\n\n# Styling\
    \ descendents\n\nYou can style individual descendent ele-\nments depending on\
    \ their parent selector\nor selectors in a space-separated list. The\nlast selector\
    \ will receive the style if and\nonly if it is the descendent of the preceding\n\
    selectors 4.\n\nWhen you want to indicate that the exact\nselector does not matter\
    \ at any given\nlevel, you can use the universal selector (*)\ndescribed in Chapter\
    \ 3 5.\n\n```\nSpace-separated list of selectors\np strong em {\n    color: red;\n\
    }\nDeclaration list\n```\n\nA The general syntax for the descendant selector.\n\
    \n```\nUniversal selector\np * em {\n    color: red;\n}\nSpace-separated\nlist\
    \ of selectors\nDeclaration list\n```\n\nB The general syntax for the descendant\
    \ selector\nusing the universal selector.\n\n# TABLE 4.1 Combinatory Selectors\n\
    \n| Format | Selector Name | Elements Are Styled If... |\n| :--- | :--- | :---\
    \ |\n| a b c | Descendant | c descendant of b descendant of a |\n| a * b | Universal\
    \ | b within a regardless of b's parents |\n| a > b | Direct child | b direct\
    \ child of a |\n| a + b | Adjacent sibling | sibling b immediately after a |\n\
    | a ~ b | General sibling | sibling b anywhere after a |"
  merge: -1
  img_proc: true
- pgno: 93
  md: '# To style descendant elements:


    +   1. Set up a list of descendant selectors.


    Type the HTML selector of the parent tag, followed by a space, and then the final
    child or another parent (Code 4.1).


    ```

    article.chaptertext p strong em {...}

    ```


    You can type as many HTML selectors as you want for as many parents as the nested
    tag will have, but the last selector in the list is the one that receives all
    the styles in the rule.


    +   2. Styles will be used only if the pattern is matched.


    ```

    <article class="chaptertext"><p> <strong><em>...</em></strong> </p></article>

    ```


    The style will be applied if and only if the final selector occurs as a descendant
    nested within the previous selectors. So, in this example, the emphasis tag (em)
    is styled only if it is in a paragraph (strong) that is within a paragraph tag
    (p), that is in an article tag using the class chaptertext (article.chaptertext).


    The emphasis tag would not be styled by the code in Step 1 in the following case,
    because it is not in a strong tag:


    ```

    <article class="chaptertext"><p> .em...<em></p></article>

    ```


    and emphasis will not be styled by the code in Step 1 in the following case because
    the article tag does not have the chaptertext class:


    ```

    <article><p><strong><em>...</em></strong> </p></article>

    ```


    It is important to note, though, that although the selectors do not style the
    emphasis tag in these last two cases, it does not mean that styles from other
    declarations will not do so.'
  merge: -1
  img_proc: true
