- pgno: 323
  md: '# # Setting an Element''s Shadows


    Just as with text shadows (Chapter 6), you can add one or more drop shadows to
    the box of any element on the screen—positioned or not. The term “shadow” is a
    bit misleading, though, since you can make the color anything you like—including
    light colors—to create a glow effect.


    # ## To set an element shadow:


    +   1. Add the box shadow property to your CSS rule. Type the box-shadow property
    names, followed by a colon (:) (Code 11.7).


    ```

    box-shadow:

    ```


    +   2. Specify the shadow offset, blur, choke, color, and inset.


    ```

    1px 1px 5px 1px rgba(0,0,0,.25) inset

    ```


    Type the following keywords or values (Table 11.8) to specify how you want this
    element’s shadow to be treated (from right to left):


    +   > x and y offset length values set the position of the shadow relative to
    the box. Positive values offset the shadow down and to the right, whereas negative
    values move the shadow up and to the left. These values are required.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_323_0.png)


    Shadows provide a sense of depth and texture.


    | Value | Chrome | Firefox | Safari | Opera | IE |

    | :--- | :---: | :---: | :---: | :---: | :---: |

    | inset | 9 | 4 | 5 | 10.5 | 9 |

    | <x-offset> | 9 | 4 | 5 | 10.5 | 9 |

    | <y-offset> | 9 | 4 | 5 | 10.5 | 9 |

    | <blur> | 9 | 4 | 5 | 10.5 | 9 |

    | <spread> | 9 | 4 | 5 | 10.5 | 9 |

    | <color> | 9 | 4 | 5 | 10.5 | 9 |'
  merge: -1
  img_proc: true
