- pgno: 105
  md: '# Styling links


    Although a link is a tag, its individual states are not. To set properties for
    these states, you must use the pseudo-classes associated with each state that
    a link can have (in this order):


    +   - :link lets you declare the appearance of hypertext links that have not yet
    been selected.

    +   - :visited lets you set the appearance of links that the visitor selected
    previously—that is, the URL of the `href` attribute in the tag that is part of
    the browser''s history.

    +   - :hover lets you set the appearance of the element when the visitor''s pointer
    is over it.

    +   - :active sets the style of the element when it is clicked or selected by
    the visitor.


    For ideas on which styles to use with links, see the sidebar “Picking Link Styles.”


    # To set contrasting link appearances:


    +   1. Style the anchor tag.

    +      a {...}

    +      Although not required, it''s best to first define the general anchor style
    (Code 4.6). This differs from setting the :link pseudo-class in that these styles
    are applied to all the link pseudo-classes. So, you want to declare any styles
    that will remain constant or are changed in only one of the states.


    +   TOC:

    +   1. Down the Rabbit-hole

    +   2. The Pool of Tears

    +   3. A Caucus-race and a Long Tale

    +   4. The Rabbit sends in a Little Bill

    +   5. Advice from a Caterpillar

    +   6. Pig and Pepper

    +   7. A Mad Tea-party

    +   8. The Queen''s Croquet-ground

    +   9. The Mock Turtle''s Story

    +   10. The Lobster Quadrille

    +   11. Who Stole the Tarts?

    +   12. Alice''s Evidence


    The results of Code 4.6 show the links styled for each state to help the user
    understand what''s going on.'
