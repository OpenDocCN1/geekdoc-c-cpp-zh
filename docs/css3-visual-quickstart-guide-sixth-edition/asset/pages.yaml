- pgno: 135
  md: "# Styling for Print\n\nWith the advent of laser and inkjet printers, we seem\
    \ to be buried under mounds of perfectly printed paper. Even the Web seems to\
    \ have increased the amount of paper we use. If an article on the Web is longer\
    \ than a couple of scrolls, many people print it.\n\nBut the Web was created to\
    \ display information on the screen, not on paper. Web graphics look blocky when\
    \ printed, and straight HTML lacks much in the way of layout controls. That said,\
    \ you can take steps to improve the appearance of printed Web pages. Looking good\
    \ in print and on the Web may take a little extra effort, but your audience will\
    \ thank you in the long run.\n\nHere are six simple things you can do to improve\
    \ the appearance of your Web page when it is printed:\n\n+   - Use page breaks\
    \ before page headers to keep them with their text.\n\n+   - Separate content\
    \ from navigation. Try to keep the main content—the part your audience is interested\
    \ in reading—in a separate area of the design from the site navigation. You can\
    \ then use CSS to hide navigation in the printed version with a\n+   \n+   nav\
    \ { display: none }\n+   \n+   included in the print style sheet.\n\n+   - Avoid\
    \ using transparent colors in graphics. This is especially true if the graphic\
    \ is on a background color or a graphic other than white. The transparent area\
    \ of a GIF image usually prints as white regardless of the color behind it in\
    \ the window. This situation is not a problem if the graphic is on a white background\
    \ to begin with, but the result is messy if the graphic is supposed to be on a\
    \ dark background.\n\n+   - Avoid using text in graphics. The irony of printing\
    \ content from the Web is that text in graphics, which may look smooth in the\
    \ window, can look blocky when printed; but regular HTML text, which may look\
    \ blocky on some PC screens, can print smoothly on any decent printer. Try to\
    \ stick with HTML text as much as possible.\n\n+   - Avoid dark-colored backgrounds\
    \ and light-colored text. Generally you want to keep white as your background\
    \ color for most of the printed page, and black or dark gray for the text.\n\n\
    +   - Do not rely on color to convey your message when printed. Although color\
    \ printers are quite common these days, many people are still printing with black-and-white\
    \ printers or printing in black and white on color printers to save money."
  merge: -1
  img_proc: true
- pgno: 136
  md: '# # Inheriting Properties from a Parent


    No, this book hasn''t suddenly become the Visual QuickStart Guide to Real Estate.
    Child and descendant HTML tags generally assume the styles of their parents—inherit
    them—whether the style is set using CSS or is inherited from a browser style.
    This is called inheritance of styles.


    For example, if you set an ID called copy and give it a font-family value of Times,
    all of its descendants would inherit the Times font style. If you set a bold tag
    to red with CSS, all of its descendants will inherit both the applied red and
    the inherent bold style A.


    In some cases, a style property is not inherited from its parent—obvious properties
    such as margins, width, and borders. You will probably have no trouble figuring
    out


    ```

    {CSS}

    strong { color: red; }

    .chaptertext { font-family: georgia; }

    ```


    ```

    <HTML>

    <div class="chaptertext">

    <strong>

    <em>

    Curiouser and curiouser!

    </em>

    </strong>

    </div>

    ```


    # ## Results


    Curiouser and curiouser!


    A The final result of the styles applied and inherited is bold, red, and italicized
    text in Times font. Styles in parentheses are inherent styles applied by the browser
    for the particular HTML tag.'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'which properties are inherited and which are not. For example, if you set a
    padding of four pixels for the paragraph tag, you would not expect bold tags within
    the paragraph to also add a padding of four pixels. If you have any doubts, see
    Appendix A, which lists all the CSS properties and how they are inherited.


    If you did want to force an element to inherit a property of its parent, many
    CSS properties include the inherit value. So, in the previous example, to force
    all the bold tags in a paragraph to take on the 4px padding, you could set their
    padding value to inherit.


    # # Managing existing or inherited property values


    When defining the styles for a selector, you do not cause it to lose any of its
    inherited or inherited attributes unless you specifically override those styles.
    All those properties are displayed unless you change the specific existing properties
    that make up its appearance.


    In addition to overriding the relevant property with another value, many CSS properties
    have values that allow you to override inheritance:


    +   - **inherit**—Forces a property to be inherited that would normally not be
    inherited, or overrides other applied style values and inherits the parent''s
    value.

    +   - **none**—Hides a border, image, or other visual element.

    +   - **normal**—Forces the default style to be applied.

    +   - **auto**—Allows the browser to determine how the element should be displayed
    based on context.'
  merge: -1
  img_proc: true
