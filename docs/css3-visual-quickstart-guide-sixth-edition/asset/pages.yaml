- pgno: 188
  md: "Using RGBA works best for shadows. Anything under that shadow will realistically\
    \ show through.\n\nAlthough this is a “shadow,” you can use any color for it.\
    \ Therefore, if your text is on a dark background, you could use a light color\
    \ to create a drop “glow”.\n\nIn Chapter 11, you’ll learn how to set a box-shadow\
    \ that works a lot like the text-shadow property but is applied to the element’s\
    \ box.\n\nShadows do not affect the position of the text they are placed behind.\n\
    \nText shadows make links pop off the page when used with the :hover pseudo class.\n\
    \n+   4. Specify the color. Type a space and then a color value for the shadow.\n\
    +   \n+   rgba(0,0,0,.75);\n+   \n+   For more information on color values, see\
    \ “Choosing Color Values” in Chapter 7.\n\n+   5. Add more shadows. You can add\
    \ multiple shadows (as many as you want) to any block of text. To do so, you can\
    \ add another text-shadow declaration to the rule, or add a comma followed by\
    \ another definition.\n+   \n+   text-shadow: -3px -3px 6px rgba(153,0,0,9),\n\
    +   2px 3px 5px rgba(0,0,0,5);\n+   \n+   You can set the value to none to override\
    \ a shadow that was previously set in the CSS.\n\n# ALICE'S ADVENTURES IN WONDERLAND\n\
