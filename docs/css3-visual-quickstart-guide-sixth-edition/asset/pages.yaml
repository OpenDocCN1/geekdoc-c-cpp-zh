    > TIP You can use the <link> tag to add as many style sheets to a page as you
    want.


    > TIP Keep in mind that the more style sheets you link to, the more server calls
    your Web page makes, and the slower it loads. Link as needed, but try to minimize
    links by combining files where possible.


