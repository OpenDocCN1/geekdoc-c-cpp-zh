- pgno: 171
  md: '# # Using Condensed and Expanded Fonts


    Although the bold and italic versions of fonts are most common, many fonts have
    versions that are condensed (narrower) or extended (wider) ➊. The font-stretch
    property allows you to reference particular font widths (Table 5.10). Some fonts
    include font widths that stretch or compress the font and are different from bold,
    which simply makes the letterform consistently thicker. Most fonts will not have
    these properties, but for those that do, using font-stretch will be the best way
    to access them.


    # ## To define condensed or extended fonts in a CSS rule:


    +   1. Add the font-stretch property to your CSS. Type the property name font-stretch
    (Code 5.8), followed by a colon (:).

    +   font-stretch:

    +   2. Define the weight.

    +   condensed;

    +   Type the value for the font-stretch property, using one of the following options:

    +   * A value from Table 5.10.

    +   * normal, which overrides other weight specifications


    # normal condensed expanded


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_171_0.png)


    | Value | |

    |---|---|

    | ultra-condensed | ➊➋ |

    | extra-condensed | ➊➋ |

    | condensed | ➊➋ |

    | semi-condensed | ➊➋ |

    | semi-expanded(?) | ➊➋ |

    | expanded | ➊➋ |

    | extra-expanded | ➊➋ |

    | ultra-expanded | ➊➋ |

    | normal | ➊➋ |

    | inherit | ➊➋ |


    Code 5.8 Added to font-properties.css—The author''s name is set in condensed text
    ➋


    ```

    h2 cite { font-stretch: condensed; }

    ```


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_171_1.png)


    The author''s name is condensed. ➋'
