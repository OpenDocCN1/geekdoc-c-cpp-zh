- pgno: 26
  md: '![](img/e1ed1e3c1873fa9fc855210fb83699d0_26_0.png)


    C An HTML page using CSS to add an image in the background. Position the content
    down and to the right, and format the text.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_26_1.png)


    D The same code displayed without the benefit of CSS. The page still displays
    but without the formatting shown in C.


    The interpretation by the browser''s rendering engine is where your headaches
    begin. The World Wide Web Consortium (W3C) has gone to great lengths to create
    specifications by which browser developers should render the Web code. Nonetheless,
    bugs, omissions, and misinterpretations still creep in. As a result, no two browsers
    render a Web page in exactly the same way. For the most part, these differences
    go unnoticed by most users, but occasionally the differences are glaring and require
    that you do some extra work to get the page to look right with the broadest range
    of browsers.


    You always face the possibility that your page will be rendered without the CSS
    because of an error or because the software in use—such as many mobile device
    browsers—does not accommodate CSS. You should always consider how your page will
    look without the CSS styles, and make sure that the page will still make structural
    sense, as shown in C and D.'
