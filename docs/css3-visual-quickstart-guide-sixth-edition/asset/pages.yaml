    ```


    The general syntax for defining styles directly in an HTML tag.


    # Inline: Adding Styles to an HTML Tag


    Although using CSS means you do not have to set the appearance of each tag individually,
    you still have the freedom to set a style within an individual tag, using an inline
    style A.


    This is useful when you''ve set styles for the page in the head or in an external
    style sheet, and you need to override those styles on a case-by-case basis. However,
    you should only do this as a last resort. Because inline styles have the highest
    priority in the cascade order, they are virtually impossible to override. (See
    “Why You Should Never, EVER Use Inline Styles in Your Final Web Site...Mostly.”)'
