    # Why Add All of the Browser Extensions?


    Notice that Code 12.5 is pretty extensive, mostly because we had to add several
    browser extensions. A lot of developers out there think, “No one’s using Opera
    or Firefox, so, why bother? I’ll just use Webkit.” The fact is that both Opera
    and Firefox have an audience, and cutting them out is just rude. However, browser
    neglect is becoming a big enough problem that Mozilla, Opera, and even Microsoft
    are adding support for the Webkit extension. This is understandable from their
    standpoint, but bad news for developers who now will not know whether their code
    is being used in the right browser or not.


    It takes only a few seconds to add fully compatible code. Don’t be lazy. One day,
    all of this code will be available without browser extensions. Until then, use
    them!'
