- pgno: 22
  md: '# # Understanding CSS3


    Cascading Style Sheets, or CSS, is a language used to specify the visual appearance
    of a Web page—in contrast to HTML (HyperText Markup Language), which is a markup
    language that defines the structure of a document for distribution on the Web.
    HTML tells a Web browser how the content is organized on the page, whereas CSS
    tells the browser how it should look.


    CSS3—an abbreviation for CSS Level 3—is the next generation of this style language
    that adds several new capabilities. CSS3 has taken its place alongside HTML5 at
    the forefront of all cutting-edge Web design.


    # ## In This Chapter


    | Topic | Page |

    | --- | --- |

    | What Is a Style? | 2 |

    | What Are Cascading Style Sheets? | 3 |

    | The Evolution of CSS | 6 |

    | CSS and HTML | 8 |

    | Types of CSS Rules | 9 |

    | The Parts of a CSS Rule | 11 |

    | CSS Browser Extensions | 12 |

    | New in CSS3 | 14 |'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# What Is a Style?


    Word processors allow writers to change text appearance word-by-word or paragraph-by-paragraph,
    as well as in an entire document by means of styles.


    Styles combine multiple properties—such as weight, font family, italicization,
    color, and size—that you want to apply to similar text types—titles, headers,
    captions, and so on—and they group these properties under a common name.


    For example, suppose you want to format all the section titles in your document
    in bold, Georgia font, italic, orange, and 16 point. You could assign all those
    attributes to a style called Chapter Title A.


    Whenever you type a chapter title, you only need to use the Chapter Title style,
    and all those attributes are applied to the text in one fell swoop. Even better,
    if you later decide that you really want all of those titles in 18 point instead
    of 16 point, you can just change the definition of Section Title. The word processor
    automatically changes the appearance of all the text marked with that style throughout
    the document.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_23_0.png)


    Styles applied to section titles in a word-processing page.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# What Are Cascading Style Sheets?


    Cascading Style Sheets bring the same style-setting convenience to the Web that
    you have in most word processors. You can set the CSS in one central location
    to affect the appearance of specific HTML tags, on a single Web page, or across
    an entire Web site.


    Although CSS works with HTML, it is not HTML. Rather, CSS is a separate style
    sheet language that enhances the abilities of HTML (a markup language) by allowing
    you to redefine the way that existing tags display their contents.


    For example, the level 1 header tag container, <h1>...</h1>, allows you to apply
    styles to a section of HTML text and turn it into a header. But the exact display
    of the header is determined by the viewer’s browser, not by the HTML code.


    Using CSS, you can change the nature of the header tag so that it is displayed
    as you want it to look—for example, bold, Times font, italic, orange and 36 pixels
    (px) ④. As when using word processor styles, you could choose to change the styling
    of the <h1> tag (for example, change the text size to 18 px) and automatically
    change the text size of all h1 elements on the affected Web page.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_24_0.png)


    A Styles applied to an HTML tag.'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'Table 1.1 shows some of the things you can do with CSS and where to find more
    information in this book.


    # How does CSS work?


    When a visitor loads a Web page, either by typing in the URL address or clicking
    a link, the server (the computer that stores the Web page) sends the HTML file
    to the visitor''s computer along with any files linked to or embedded in the HTML
    file. Regardless of where the CSS code is, the visitor''s browser will interpret
    it and apply it to the HTML to render the Web page using that browser''s particular
    rendering engine. Then the results are displayed in the browser window 6.


    ```

    <HTML> + {CSS} =

    ```


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_25_0.png)


    6 The code used to create the Web page is downloaded, interpreted, and rendered
    by the browser to create the final display.


    # TABLE 1.1 CSS Properties


    | Property | What You Control | For More Info, See: |

