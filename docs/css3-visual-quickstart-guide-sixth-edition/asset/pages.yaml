  img_proc: true
- pgno: 162
  md: '# Web font service bureaus


    Another add-on-coming option for adding specific fonts to a Web design is Web
    font service bureaus (WFSB). They provide licensed fonts for your use (generally
    at a cost) but retain the actual files on their own servers while allowing you
    to reference them in your code. Some enable this with a straightforward CSS link;
    others use their own proprietary methods, generally incorporating JavaScript.


    +   The advantages to using WFSBs include:

    +   - Fonts are licensed, so you don''t have to worry about violating a EULA and
    getting sued.

    +   - Fonts are hosted on the bureaus'' servers, which means you are taking up
    less bandwidth on your own servers.

    +   - Browser support is handled by the bureau, as are potential updates and upgrades.


    +   However, there are disadvantages as well:

    +   - Since the fonts are on a third-party server, you are depending on someone
    else''s system to always be fast and reliable.

    +   - If you do not have a copy of the font on your own computer, you will not
    be able to create graphical comps to show clients.

    +   - Price scales vary from service to service. Some charge a one-time fee; others
    require a yearly subscription. If you forget to pay, your font goes bye-bye.'
  merge: -1
  img_proc: true
