- pgno: 307
  md: '# Understanding the Window and Document


    A Web page (also referred to as the *document*) is displayed within a browser
    window’s *viewport*. Everything that you can present to the viewer is displayed
    in that area, although the document will require scrolling if it is larger than
    the viewport.


    You can open multiple windows (each displaying its own documents in its own viewport),
    resize and position windows on the screen, or insert smaller viewports called
    *iframes*. Everything that you present, however, is displayed within a browser
    window as part of a document.


    Like the elements contained within it (see “Understanding an Element’s Box” in
    Chapter 10), the window has a width and height, as well as a top, bottom, left,
    and right. In fact, you can think of the browser window as the ultimate element
    in your Web design—the parent of all other elements. Browser windows and the documents
    they contain have several distinct parts:


    +   - Browser width and height refers to the dimensions of the entire window,
    including any browser controls and other interface items.

    +   - Viewport is the area of the display area. All fixed-position elements are
    placed in relation to the viewport edges.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_307_0.png)


    The browser window displaying a document that will require some vertical scrolling
    to reveal the rest of its content.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '+   Viewport width and height refers to the live display area of the browser
    window''s viewport. The live dimensions, obviously, are always less than the full
    window dimensions. Generally, when I refer to "the window," I''m referring to
    the viewport.


    +   Document width and height, sometimes called the rendered width and height,
    refers to the overall dimensions of the Web page contained within the body tag.
    If the document''s width and/or height are larger than the viewport width and/or
    height, you''ll see scroll bars that let you view the rest of the document.


    +   The element edge is the edge of an element within the border. Elements are
    positioned relative to their parent element''s edges if the parent element has
    also been positioned. Otherwise, the element is positioned relative to the document
    edge.


    +   Element width and height should not be confused with content width and height
    (defined in Chapter 10). This is the total space occupied when border and padding
    are added to the content width and height.


    > TIP The document width is most often the same as the viewport width since horizontal
    scrolling is generally not preferred.


    > TIP Normal flow refers to where an element will appear in the Web page if no
    positioning is applied to it.'
  merge: -1
  img_proc: true
- pgno: 309
  md: '# # Setting the Positioning Type


    CSS positioning allows you to set several properties associated with the HTML
    element''s position not only in 2D but also in 3D, clipping, and visibility. But
    first, you have to declare how the element''s positioning should be treated.


    An element can have one of four position values—static, relative, absolute, or
    fixed (Table 11.1). The position value tells the browser how to treat the element
    when placing it into the document.


    In addition to setting the position of an element, other position-dependent properties
    include:


    +   - **Stacking order**, which is available for absolutely and fixed-position
    elements, allowing you to move elements in 3D.

    +   - **Visibility**, which hides an element''s content but not the element itself,
    effectively setting its opacity to 0.

    +   - **Clipping**, which hides parts of the content, "clipping" its sides.


    # ## Static positioning


    By default, elements are positioned as static in the document unless you define
    them as positioned absolutely, relatively, or fixed. Static elements, like the
    relatively positioned elements explained in the following section, flow into a
    document one after the next. Static positioning differs, however, in that a static
    element cannot be explicitly positioned or repositioned, cannot be clipped, and
    cannot have its visibility changed A.


    | Value | | | | | |

    | :--- | :---: | :---: | :---: | :---: | :---: |

    | static | ● | ● | ● | ● | ● |

    | relative | ● | ● | ● | ● | ● |

    | absolute | ● | ● | ● | ● | ● |

    | fixed | ● | ● | ● | ● | ● |

    | inherit | ● | ● | ● | ● | ● |


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_309_0.png)'
  merge: -1
  img_proc: true
- pgno: 310
  md: '![](img/e1ed1e3c1873fa9fc855210fb83699d0_310_0.png)


    # # Relative positioning


    A relative element is positioned in the context of its natural position in the
    document. A relatively positioned element is offset based on its position in the
    normal flow of the document. The space it occupied will remain in place but appear
    empty ①.


    # # Absolute positioning


    Absolute positioning takes an element out of the normal flow of the document,
    while leaving no space. An element that is defined in this way is placed at an
    exact point in the window by means of x and y coordinates relative to its most
    recently positioned parent element''s edges, or the body if none of its parents
    are positioned ②.


    ① A relatively positioned element is moved relative to the indicated side—top,
    right, bottom, and/or left—where it would have appeared if untouched. Negative
    values move the element in the opposite direction but still relative to the same
    side.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_310_1.png)


    ② An absolutely positioned element is removed from the normal flow and positioned
    from a positioned parent element''s sides (or the document sides if it has no
    positioned parents).'
  merge: -1
  img_proc: true
- pgno: 311
  md: "# # Fixed positioning\n\nFixing an element's position in the window is similar\
    \ to absolute positioning except that it is always in a locked position relative\
    \ to the viewport edge (rather than its parent). When a document scrolls in the\
    \ viewport, fixed elements stay in their initial positions and do not scroll with\
    \ the rest of the document. This allows you to establish constant elements in\
    \ the screen that do not scroll with the rest of the content.\n\n# ## To set an\
    \ element's position type:\n\n+   1. Add the position property to your declaration\
    \ list. Type position in a rule's declaration block or in the style attribute\
    \ of an HTML tag, followed by a colon (:) (Code 11.2).\n+   position:\n\n+   2.\
    \ Specify the positioning.\n+   relative;\n\nType a position-type value, which\
    \ can be one of the following:\n\n+   > static flows the content normally; however,\
    \ none of the position properties can be set for this element.\n\n+   > relative\
    \ also flows the element normally, but allows the position to be set relative\
    \ to its normal position using the values set on the top, left, right, and bottom\
    \ properties.\n\n+   > absolute places the element relative to the edge of its\
    \ most recently positioned parent element. This element will be the body of the\
    \ document, or the element it is nested within if that element's positioning has\
    \ been set.\n\n+   > fixed places the element relative to the edges of the viewport,\
    \ independent of any other content on the page and ignoring its parent\n\n![](img/e1ed1e3c1873fa9fc855210fb83699d0_311_0.png)\n\
    \nA fixed-positioned element is always positioned relative to the viewport's edge.\n\
    \nCode 11.2 Added to visualformatting-properties.css —Sets the position type for\
    \ several elements. Keep in mind that you won't see any difference until you start\
    \ setting the top, right, bottom, or left position.\n\n```\n/*** visualformatting-properties.css\
    \ ***/\nheader, footer {\n  position: fixed;\n}\nfooter nav {\n  position: relative;\n\
    }\nhgroup h2 {\n  position: relative;\n}\naside {\n  position: absolute;\n}\n\
    strong {\n  position: relative;\n}\ndiv.gallery {\n  position: relative;\n}\n\
    div.gallery figure {\n  position: absolute;\n}\n```"
  merge: -1
