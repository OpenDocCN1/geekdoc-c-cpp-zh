- pgno: 236
  md: '# 5. If you are using a background image, specify how it should scroll.


    ```

    fixed

    ```


    Type a keyword for the way you want the background attached—how it should be treated
    when the page scrolls—followed by a space. Use one of the following options (Table
    7.9):


    +   scroll instructs the background graphic to scroll with the element.


    +   fixed instructs the browser not to scroll the background content with the
    rest of the element.


    +   local is similar to fixed, but the background is fixed to the content of the
    element, rather than the element itself.


    # 6. If you are using a background image, specify how it should be positioned.


    ```

    0 0;

    ```


    Type two values, separated by a space, to specify where you want the background
    positioned relative to the top-left corner of the element. Use any of the following
    units; you can use a mixture across the two values if you like (Table 7.10):


    +   A length value, such as -10px. The values can be positive or negative. The
    first number tells the browser the distance the element should appear from the
    left edge of its parent; the second value specifies the position from the top
    edge of the parent.


    +   A percentage value, such as 25%. The first percentage indicates the horizontal
    position proportional to the parent element’s size; the second value indicates
    the vertical position proportional to the parent element’s size.


    +   A position keyword, such as top, bottom, left, right, or center.


    # 7. Add multiple backgrounds to an image in a comma-separated list.


    ```

    background: url(../images/chrome/bg-book-spine-title.png) no-repeat right top,
    rgb(102,0,0) url(../images/chrome/bg-book-spine.jpg) repeat-x 0 0;

    ```


    As with the stand-alone background properties, you can place multiple backgrounds
    in a single object. Just add the values in a comma-separated list. Place the background
    color value in the last value set; otherwise, it will cover everything beneath
    it.'
