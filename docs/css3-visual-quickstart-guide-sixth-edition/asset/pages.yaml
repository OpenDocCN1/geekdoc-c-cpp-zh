- pgno: 165
  md: "# # Setting the Font Size\n\nWith CSS, you can specify the size of the text\
    \ on the screen using several notations or methods (A), including the traditional\
    \ print-based point-size notation, percentage, absolute size, and even a size\
    \ relative to the surrounding text (Table 5.6).\n\nFonts can be set as either\
    \ absolute sizes, which define the size based against a standard length measurement,\
    \ or relative sizes, which are in relation to defaults set for the browser.\n\n\
    # ## To define the font size for an element:\n\n+   1. Add the font-size property\
    \ to your CSS. Type the property name `font-size`, followed by a colon (Code 5.4).\n\
    +      `font-size:`\n+   \n+   2. Define the font size.\n+      `100%;`\n\nType\
    \ a value for the font size, which could be any of the following options:\n\n\
    +   - A relative or absolute length unit (often, the font size in pixels or ems).\
    \ See “Values and Units Used in This Book” in the Introduction for more detail.\n\
    +   - An absolute size keyword relative to the default page size: xx-small, x-small,\
    \ small, medium, large, x-large, and xx-large.\n+   - A relative size keyword\
    \ of smaller or larger to describe the font size in relation to its parent element.\n\
    +   - A percentage representing how much larger (values over 100%) or smaller\
    \ (values less than 100%) the text is relative to the size of its parent element.\n\
    \n![](img/e1ed1e3c1873fa9fc855210fb83699d0_165_0.png)\n\nThe height (size) of\
    \ a font is measured from the descender to the ascender (usually the cap height).\
    \ The x-height is the height of lowercase letters.\n\n| Value | | | | | | |\n\
    |---|---|---|---|---|---|---|\n| <length> | ● | ● | ● | ● | ● | ● |\n| <percentage>\
    \ | ● | ● | ● | ● | ● | ● |\n| smaller | ● | ● | ● | ● | ● | ● |\n| larger | ●\
    \ | ● | ● | ● | ● | ● |\n| xx-small | ● | ● | ● | ● | ● | ● |\n| x-small | ● |\
    \ ● | ● | ● | ● | ● |\n| small | ● | ● | ● | ● | ● | ● |\n| medium | ● | ● | ●\
    \ | ● | ● | ● |\n| large | ● | ● | ● | ● | ● | ● |\n| x-large | ● | ● | ● | ●\
    \ | ● | ● |\n| xx-large | ● | ● | ● | ● | ● | ● |\n| inherit | ● | ● | ● | ● |\
    \ ● | ● |\n\nCode 5.4 font-properties.css—I've defined the default size of text\
    \ on the page as 100% (the default size the user has set) and then set other font\
    \ sizes on the page relative to that font size.\n\n```\n/* font-properties.css\
    \ */\nbody { font-size: 100%; }\nh1 { font-size: 3em; }\nh2 { font-size: 1em;\
    \ }\nh2 cite { font-size: 1.5em; }\nh2 .chaptertitle { font-size: 3em; }\nem {\
    \ font-size: 1.1em; }\nfigcaption { font-size: .875em; }\narticle p:first-of-type:first-letter\
    \ \n  { font-size: 5em; }\nfooter a { font-size: 1em; }\n```"
  merge: -1
