  md: '# # Teaching the Browser to Count


    Browsers can automatically create sequentially numbered lists, starting at 1 and
    counting by ones. You will explore this later in the chapter. However, what if
    you need to start numbering from 6 instead of 1? Or, what if you need to create
    two sequential lists that are nested inside each other?


    CSS allows you to set up multiple counter lists to be used with the counter value
    of the content property (see the previous section). The counter-reset property
    (Table 9.4) is used to set the initial value for the count, and the counter-increment
    property (Table 9.5) is used to increase the counter by a specific value (Code
    9.4).


    # ## To use a counter:


    +   1. Add the counter-reset property to your declaration block.


    ```

    counter-reset: chapterNum 4;

    ```


    Type counter-reset, a colon (:), and then the name of the counter identifier you
    are defining (which can be any name you want). Then insert a space and the number
    you want to start the list.


    | Value | |

    |---|---|

    | `<counterName>` | ●8 ○ ○ ○ ○ ○ |

    | `<num>` | ●8 ○ ○ ○ ○ ○ |

    | `none` | ●8 ○ ○ ○ ○ ○ |

    | `inherit` | ●8 ○ ○ ○ ○ ○ |


    | Value | |

    |---|---|

    | `<counterName>` | ●8 ○ ○ ○ ○ ○ |

    | `<num>` | ○8 ○ ○ ○ ○ ○ |

    | `none` | ●8 ○ ○ ○ ○ ○ |

    | `inherit` | ●8 ○ ○ ○ ○ ○ |'
  merge: -1
  img_proc: true
