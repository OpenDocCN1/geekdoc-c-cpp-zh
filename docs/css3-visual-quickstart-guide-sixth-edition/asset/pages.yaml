- pgno: 366
  md: "# Creating a CSS Drop-Down Menu\n\nDrop-down menus are a standard way to reduce\
    \ navigation noise, allowing you to present a lot of links in a little space.\
    \ Although generally thought of as the domain of JavaScript, drop-down menus can\
    \ also be achieved using only a little bit of CSS.\n\n# To make a pure CSS drop-down\
    \ menu:\n\n+   1. Hide the drop-down menu. To show the menu--\"dropping\" it down--you\
    \ first need to hide it (Code 13.6). Give it a triple whammy by setting its height\
    \ to 0, overflow to hidden, and opacity to completely transparent.\n+   \n+  \
    \ nav.toc .menu .drop {...}\n+   \n+   continues on next page\n\n![](img/e1ed1e3c1873fa9fc855210fb83699d0_366_0.png)\n\
    \n![](img/e1ed1e3c1873fa9fc855210fb83699d0_366_1.png)\n\n```\nCode 13.6 Added\
    \ to design-interface.css--When applied to your Web page (Code 13.1), this collapses\
    \ the menu, leaving only a menu label A, which when the pointer hovers over it,\
    \ expands the menu to full height B.\n\n/*** design-interface.css ***/\n/* Drop\
    \ Menu\n----------------------------------------------------- */\n\nnav.toc .menu\
    \ .drop {\n    overflow: hidden;\n    height: 0;\n    opacity: 0; }\n\nnav.toc\
    \ .menu:hover .drop {\n    height: auto;\n    opacity: 1; }\n```"
  merge: -1
  img_proc: true
- pgno: 367
  md: '+   2. Set the drop menu to appear when the user''s pointer hovers over it.
    When the pointer hovers over any part of the menu—including the title at the top—set
    the height to auto and opacity to opaque. You can also couple this with a transition
    to create a more subtle opening effect.


    ```

    nav.toc .menu:hover.drop {...}

    ```


    TIP It would be cool if the menu could use a transition to unroll from 0 to the
    menu''s full height. You could do this if you knew the exact height of the menu,
    but this is rarely the case, especially in a dynamic Web site.


    TIP Because this trick relies on the child selector, it will not work in IE6,
    so you will need to either show the menu (using conditional CSS to set display
    and opacity) or make other navigational arrangements.


    # Preventing Navigation Noise


    One of my chief gripes about most Web sites is the overabundance of unorganized
    links. You''ve probably seen sites with long lists of links that stretch off the
    window. These links add visual noise to the design and waste precious screen space
    without assisting navigation.


    Web surfers rarely take the time to read an entire Web page. Instead, they scan
    for relevant information. But human beings can process only so much information
    at a time. If a Web page is cluttered, visitors must wade through dozens or hundreds
    of links to find the one path to the information they desire.


    Anything designers can do to aid visitors'' abilities to scan a page, such as
    organizing links in lists and hiding sublinks until they''re needed, will improve
    the Web site''s usability. Drop-down, sliding, and collapsible menus are a great
    way to organize your page and prevent navigation noise.'
  merge: -1
  img_proc: true
