- pgno: 271
  md: '# # Understanding an Element''s Box


    As you learned in Chapter 2, an element is a part of an HTML document that is
    set off by HTML container tags. The following is an HTML element:


    ```

    <p>Alice</p>

    ```


    This is another HTML element:


    ```

    <article><p><em>Alice</em>

    · <img src="alice1.gif">

    · <em src="alice1.gif">

    ```


    The first example is an element made of a single tag. The second example is a
    collection of nested tags, and each of those nested tags is an individual element.
    Remember that nested tags are called the children of the tags within which they
    are nested, which are called the parents (see “Inheriting Properties from a Parent”
    in Chapter 4).


    # ## Parts of the box


    All HTML elements have four sides: top, right, bottom, and left. These four sides
    make up the element box, to which CSS box properties can be applied. Each side
    of the box has the following properties:


    +   - Content—At the center of the box, this is the substance of the page. The
    content includes all text (called copy), lists, forms, and images you use.

    +   - Child Elements—Elements contained within the parent element that are set
    off by their own HTML tags. Child elements typically have their own box that can
    be controlled independently of the parent.

    +   - Width and Height—The dimensions of the content area. If you leave width
    and height undefined, these dimensions are determined by the browser (see “Setting
    the Width and Height of an Element” in this chapter).


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_271_0.png)


    The box model in all its glory. Notice that the outline is part of the margin.
    If a margin is not present, the outline will appear underneath adjacent elements.
    Also, if two elements are stacked on each other, the margins between are not added,
    but collapse to the larger of the two.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '+   **Padding**—The space between the border and the content of the element
    (see “Setting an Element’s Padding” in this chapter). Background colors and images
    also fill this space. If left unset, the size of the padding is generally 0.


    +   **Background**—Space behind the content and padding of the element. This can
    be a solid color, one or more background images, or a background gradient. (See
    Chapter 7 for more information about backgrounds.)


    +   **Border**—A rule (line) that surrounds the element and can be set separately
    on any of the sides. The border is invisible unless you set its color, width,
    and style—solid, dotted, dashed, and so on. You can also set a background image.
    If left unset, the border size is generally 0.


    +   **Outline**—Similar to border, but does not occupy any space. It appears underneath
    the margin and any surrounding sibling elements in the background.


    +   **Margin**—The space between the border of the element and other elements
    in the window (see “Setting an Element’s Margins” in this chapter). If left unset,
    the browser defines the margin.


    By default, setting the content width and content height does not set the width
    and height of the space that the element occupies on the page. The overall width
    includes any padding and border on a side:


    element width = content width + left padding + left border width + right padding
    + right border width


    Height is a little different. If a content height is set, but overflow is not,
    then the height will stretch to accommodate the content plus any padding and borders:


    element height = height needed to display content + top padding + top border width
    + bottom padding + bottom border width


    If overflow is set to hidden, scroll, or auto, then height is computed:


    element height = content height + top padding + top border width + bottom padding
    + bottom border width


    Any content that does not fit within the element will be either hidden or scrollable.


    However, CSS3 introduces the new box-resize property, which simply sizes the width
    and height of the box including the padding and border.


    > **TIP** Every element is rectangular in nature, even if its content is not rectangular
    shaped. For example, even if the image in an element is a circle, it’s bound by
    a rectangular box.


    > **TIP** Every element has content area and a top, right, bottom, and left. Every
    element can also have background, padding, border, outline, and box-shadow values.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# # Displaying an Element


    In Chapter 1 you learned that all elements can be classified according to the
    way they''re displayed—inline or block (see “Types of HTML Elements” in Chapter
    2). By default, every tag has a display style that defines how it will fit with
    the surrounding tags.


    You can use the display property to define whether an element includes line breaks
    above and below (block), is included with other elements without hard line breaks
    (inline), is treated as part of a list (list), or is displayed at all (none).
    Table 10.1 shows the values available for the display property.


    # ## To set an element''s display type:


    +   1. Start your declaration by typing the display property name in the CSS declaration
    block, followed by a colon (:) (Code 10.2). display:


    +   2. Type one of the display types from Table 10.1. block;


    Choose a type depending on the desired result:


    +   > **inline** flows the element horizontally and its siblings from left to
    right until the edge of the parent element is encountered, at which point a soft
    break is added wrapping the content to the next line. Hard line breaks immediately
    before and after the box are always suppressed A.


    +   > **block** places a hard line break above and below the box, flowing the
    elements vertically. Setting this automatically forces the width of the box to
    the width of the parent element''s box B.


    | Value | | | | | | |

    |---|---|---|---|---|---|---|

    | list-item | ● | ● | ● | ● | ● | ● |

    | block | ● | ● | ● | ● | ● | ● |

    | inline | ● | ● | ● | ● | ● | ● |

    | inline-block | ● | ● | ● | ● | ● | ● |

    | table | ●8 | ● | ● | ● | ● | ● |

    | table-cell | ●8 | ● | ● | ● | ● | ● |

    | table-footer-group | ●8 | ● | ● | ● | ● | ● |

    | table-header-group | ●8 | ● | ● | ● | ● | ● |

    | table-row | ●8 | ● | ● | ● | ● | ● |

    | table-row-group | ●8 | ● | ● | ● | ● | ● |

    | inline-table | ●8 | ● | ● | ● | ● | ● |

    | none | ● | ● | ● | ● | ● | ● |

    | inherit | ● | ● | ● | ● | ● | ● |


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_273_0.png)


    A Inline level elements flow horizontally.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_273_1.png)


    B Block level elements flow vertically.'
