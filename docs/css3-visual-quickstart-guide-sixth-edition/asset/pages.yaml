- pgno: 107
  md: '2. Style the default link state. Type the selector (anchor tag, class, or ID)
    of the element you want to style, followed by a colon (:), and then link.


    a:link {...}


    You can override styles set for the anchor tag, but this rule should always come
    before the :visited pseudo-class.


    3. Style the visited link state. Type the selector (anchor, class, or ID) of the
    element you want to style, followed by a colon (:), and then visited.


    a:visited {...}


    4. Style the hover link state. Type the selector (anchor, class, or ID) of the
    element you want to style, followed by a colon (:), and then hover.


    a:hover {...}


    5. Style the active link state. Type the selector (anchor, class, or ID) of the
    element you want to style, followed by a colon (:), and then active.


    a:active {...}


    6. Style is applied to the link state as needed.


    <a href="AAIWL-ch01.html">...</a>


    All links on the page will obey the rules you lay down here when styling the various
    link states. You can—and should—use selective styling to differentiate link types.


    In this example, the pseudo-classes are applied directly to the anchor tag, but
    any class or ID could have been used as long as it was then applied to an anchor
    tag.


    # Picking Link Styles


    Most browsers default to blue for unvisited links and red or purple for visited
    links. The problem with using two different colors for visited and unvisited links
    is that visitors may not remember which color applies to which type of link. The
    colors you choose must distinguish links from other text on the screen and distinguish
    among the states (link, visited, hover, and active) without dominating the screen
    and becoming distracting.


    I recommend using a color for unvisited links that contrasts with both the page’s
    background color and the text color. Then, for visited links, use a darker or
    lighter version of the same color but contrasts with the background but is dimmer
    than the unvisited link color. Brighter not-followed links will then stand out
    dramatically from the dimmer followed links.


    For example, on a page with a white background and black text, I might use bright
    red for links (rgb(255,0,0)) and pale red (rgb(255,153,153)) for visited links.
    The brighter version stands out; the paler version is less distinctive, but still
    obviously a link.'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'TIP You can apply the dynamic pseudo-classes :hover,:active, and :focus to
    any element, not just links.


    TIP The general anchor link styles will be inherited by the different states and
    between states. The font set you set for the :link appearance, for example, will
    be inherited by the :active, :visited, and :hover states.


    TIP The Web is a hypertext medium, so it is important that users be able to distinguish
    among text, links, and visited links. Because users don''t always have their Underline
    Links option turned on, it''s a good idea to set the link appearance for every
    document.


    TIP If you use too many colors, your visitors may not be able to tell which words
    are links and which are not.


    TIP The link styles are set for the entire page in this example, but links can
    be used for a variety of purposes. For example, links might be used for global
    navigation, in a list of article titles, or even as a dynamic control. To that
    end, it''s a good idea to style links depending on their usage:


    nav a {...}

    nav a:link {...}

    nav a:visited {...}


    TIP The preceding styles would be applied only to links in the navigation element.'
  merge: -1
