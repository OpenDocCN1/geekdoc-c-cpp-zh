- pgno: 103
  md: '# # Working with Pseudo-Classes


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_103_0.png)


    Many HTML elements have special states or uses associated with them that can be
    styled independently. One prime example of this is the link tag, <a>, which has
    link (its normal state), a visited state (when the visitor has already been to
    the page represented by the link), hover (when the visitor has the mouse over
    the link), and active (when the visitor clicks the link). All four of these states
    can be styled separately.


    A pseudo-class is a predefined state or use of an element that can be styled independently
    of the default state of the element [A].


    +   ■ Links (Table 4.3)—Pseudo-classes are used to style not only the initial
    appearance of the anchor tag, but also how it appears after it has been visited,
    while the visitor hovers the mouse over it, and when visitors are clicking it.


    +   ■ Dynamic (Table 4.3)—Pseudo-classes can be applied to any element to define
    how it is styled when the user hovers over it, clicks it, or selects it.


    +   ■ Structural (Table 4.4)—Pseudo-classes are similar to the sibling combinatory
    selectors but allow you to specifically style elements based on an exact or computed
    numeric position.


    +   ■ Other (Table 4.4)—Pseudo-classes are available to style elements based on
    language or based on what tag they are not.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# TABLE 4.3 Link and Dynamic Pseudo-Classes


    | Format | Selector Name | Elements Are Styled If... |

    | :--- | :--- | :--- |

    | :link | Link | the value of href is not in history |

    | :visited | Visited link | the value of href is in history |

    | :target | Targeted link | a targeted anchor link |

    | :active | Active | the element is clicked |

    | :hover | Hover | the pointer is over the element |

    | :focus | Focus | the element has screen focus |


    # TABLE 4.4 Structural/Other Pseudo-Classes


    | Format | Selector Name | Elements Are Styled If... |

    | :--- | :--- | :--- |

    | :root | Root | is the top level element in a document |

    | :empty | Empty | has no children |

    | :only-child | Only child | has no siblings |

    | :only-of-type | Only of type | has its unique selector among its siblings |

    | :first-child | First-child | is the first child of another element |

    | :nth-of-type(n) | Nth of type | is the nth element with that selector |

    | :nth-last-of-type(n) | Nth from last of type | is the nth element with that
    selector from the last element with that selector |

    | :last-child | Last child | is the last child in the parent element |

    | :first-of-type | First of type | is the first of its selector type in the parent
    element |

    | :last-of-type | Last of type | is the last of its selector type in the parent
    element |

    | :lang() | Language | has a specified language code defined |

    | :not(s) | Negation | is not using specific selectors |'
