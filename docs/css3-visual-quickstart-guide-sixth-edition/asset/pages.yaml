- pgno: 407
  md: '# # Troubleshoot Your CSS Code


    All too often, you carefully set up your style sheet rules, go to your browser,
    and see... nothing. Or the page is displayed as an ugly mishmash of content. Don''t
    worry; this happens to everyone. Before you panic and throw your expensive laptop
    out the window, read through these suggestions.


    # ## Ask these questions


    Many things could be preventing your style sheet rules from working properly;
    most of them are easily spotted. A points out some common problems you may encounter:


    +   - Are you missing any semicolons? A missing semicolon at the end of a declaration
    will cause the entire rule to fail.


    +   - Did you remember to set the link relation? If you leave out the rel property,
    many browsers will not load the external style sheet.


    +   - Did you open and close the declaration block with curly brackets? If not,
    there''s no telling what will happen.


    +   - Did you remember to close all your multiline comment tags? If not, the rest
    of the CSS is treated as a comment. (See “Adding Comments to CSS” in Chapter 3.)


    +   - Does your selector contain typos? If you forget the opening period or number
    sign (#) for classes and IDs, they won''t work.


    +   - Did you mix up a class with an ID or vice versa? I often think I’ve set
    up a selector as an ID, but it was actually a class.


    +   - Do the properties contain typos? Typos in one property can cause the entire
    rule to fail.


    +   - Are the values you’re using permitted for that property? Using improper
    values may cause a definition to fail or behave unpredictably.


    +   - Does this property work on the browser you are testing on? This is especially
    a problem if you are using new CSS3 properties. See Appendix A to make sure a
    property works on the browser you are using.


    +   - If your rules are in the head, did you use the <style> tag correctly? Typos
    in the <style> tag mean that none of the definitions are used. In addition, if
    you set the media type, the styles will affect only the output to that medium.
    So setting the media type to print will prevent those styles from affecting content
    displayed on the screen. (See “Embedded Styles to a Web Page” in Chapter 3.)


    +   - If you are linking or importing style sheets, are you retrieving the correct
    file? Check the exact path for the file. Also, remember that you should not include
    the <style> tag or any other non-CSS code in an external CSS file. (See “External:
    Adding Styles to a Web Site” in Chapter 3.)


    +   - Do you have multiple, conflicting rules for the same tag? Check your cascade
    order. (See “Determining the Cascade Order” in Chapter 4.)'
  merge: -1
  img_proc: true
