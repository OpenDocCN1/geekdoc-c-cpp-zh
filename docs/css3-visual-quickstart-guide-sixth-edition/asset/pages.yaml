- pgno: 56
  md: "![](img/e1ed1e3c1873fa9fc855210fb83699d0_56_0.png)\n\n# # CSS Basics\n\nCSS\
    \ lets you control all the elements of your document's appearance—fonts, text,\
    \ colors, backgrounds, sizes, borders, spacing, positioning, visual effects, tables,\
    \ and lists. It even allows you to control the spatial and temporal styles of\
    \ elements using transitions and transformations. However, the real power of using\
    \ CSS for styles is that you can change the appearance of every page on your Web\
    \ site by changing only a few lines of CSS code.\n\nWith savvy use of CSS, you\
    \ can start with a plain web page, add visual design and interaction, and turn\
    \ it into a webbed environment.\n\n+   ## In This Chapter\n+   \n+   - The Basic\
    \ CSS Selectors 36\n+   - Inline: Adding Styles to an HTML Tag 37\n+   - Embedded:\
    \ Adding Styles to a Web Page 40\n+   - External: Adding Styles to a Web Site\
    \ 43\n+   - (Re)Defining HTML Tags 50\n+   - Defining Reusable Classes 53\n+ \
    \  - Defining Unique IDs 57\n+   - Defining Universal Styles 61\n+   - Grouping:\
    \ Defining Elements That Are Using the Same Styles 64\n+   - Adding Comments to\
    \ CSS 67"
  merge: -1
  img_proc: true
- pgno: 57
  md: '# # The Basic CSS Selectors


    CSS works by defining the styles of the elements on a Web page using CSS _rules_.
    Rules are applied using _selectors_, which come in four basic varieties: HTML
    selectors are used to reference a specific tag; class selectors are applied individually
    to elements; ID selectors are applied to a single element on the page; and universal
    selectors are applied to all elements on the page (Table 3.1). You will use these
    four basic selectors constantly, and they are the best place to start. In Chapter
    4, you will learn about using other selectors for creating more selective styling.


    | Format | Selector Name | What Elements Are Styled |

    | :--- | :--- | :--- |

    | a | HTML | All specified HTML tags |

    | .myClass | Class | Any HTML tag where class is applied |

    | a.myClass | Dependent class | Specified HTML tag where class is applied |

    | #myID | ID | Any HTML tag where ID is applied |

    | a#myID | Dependent ID | Specified HTML tag where ID is applied |

    | * | Universal | All HTML tags |'
  merge: -1
  img_proc: true
- pgno: 58
  md: '```

