- pgno: 166
  md: '![](img/e1ed1e3c1873fa9fc855210fb83699d0_166_0.png)


    B The font size helps determine its legibility on the page. Titles are usually
    larger than body copy, but some text, such as the `<strong>` and `<em>` tags,
    may need a little more attention.


    # Choosing Font Size Value Type for Screen or Print


    Although they give you more precise control, absolute value types (such as points)
    are unreliable for the screen and can limit how the visitor''s browser displays
    your work.


    The point (abbreviated pt) is one way to refer to a font''s absolute size. A 12-point
    font is an average size for print use and is comfortable for most readers. The
    size of a point onscreen, however, varies slightly between operating systems,
    so a 12-point font displayed on a Windows computer appears larger than the same
    font as displayed on a Mac. Although using point sizes is an acceptable choice
    in CSS for print media (see "Querying the Media" in Chapter 4), it is a poor choice
    for screen display.


    I recommend sticking with relative value types (especially em) for screen and
    absolute value types for print.


    The value you use will depend on your need; however, it is generally recommended
    to set relative font sizes to allow visitors final control of how large they are
    displayed.


    # 3. Add font size overrides as needed.


    ```

    h1 { font-size: 3em; }

    ```


    The only reason you would need to reset the font-size is if you need to increase
    or decrease it compared to the size set in the body. If you are using ems to set
    size, which I recommend, then remember that this is relative to the size of the
    parent. So a size of 2em would be twice as large as the parent, whereas a size
    of .5em would be half the size.


    Avoid defining screen media font sizes using points or other absolute font sizes
    because these tend to render inconsistently across platforms. However, they''re
    fine to use for print style sheets.


    > TIP When setting font sizes, your best strategy is to set a relative-length
    size for the `<body>` tag (such as 100%), and then use the absolute font sizes
    (such as `small`) or relative font sizes (such as `larger`) to adjust the size.
    Doing so ensures the most consistent and versatile page viewing regardless of
    the actual media used (computer screen, printed page, handheld, and so on.)'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# # Adjusting Font Size for Understudy Fonts


    Font sizes are measured based on the height of capital letters, but it is the
    lowercase letters that often vary the most from font to font. If you are relying
    on understudy fonts, your font sizes might look very different, even though the
    same physical size is set [A]. To help alleviate this, CSS3 introduces the font-size-adjust
    property, which allows you to set the font size relative to lowercase letters
    rather than uppercase.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_167_0.png)


    Verdana has a much taller x-height than Arial (top), but using font-size-adjust,
    you can set the lowercase letters to use the same height, ensuring greater consistency
    regardless of which font the browser uses.


    | Value | |

    | --- | --- |

    | <number> | |

    | inherit | |


    Code 5.5 Styles added to font-properties.css— The font size has been adjusted
    so that lowercase letters are half the size of uppercase letters.


    ```

    body { font-size-adjust: -.5; }

    ```


    # ## To adjust the font size for an element:


    +   1. Add the font size adjust property to your CSS. Type the property name font-size-adjust,
    followed by a colon (Code 5.5). font-size-adjust:


    +   2. Define a size value. .5;


    Type a value to adjust the font size by: A numeric value of 0 or greater as a
    multiplier for the current font-size to adjust the text size based on the x-height.
    None, to leave the font-size unadjusted


    > TIP You can calculate these values by dividing the set font-size by the font''s
    x-height, or you can just “eyeball” it until the value for the font-size-adjust
    appears to have no effect on the font size of the primary font.


    > TIP Font-size-adjust will adjust the size of all your glyphs (capitals as well
    as lowercase), but does so relative to the lowercase letters rather than uppercase.'
  merge: -1
  img_proc: true
