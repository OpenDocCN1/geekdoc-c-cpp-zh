  md: "# # Adding Content Using CSS\n\nFor the purposes of search engine optimization\
    \ and accessibility, it is usually best to keep all content within the `<body>`\
    \ element of your Web page. If it is dynamically generated, then it will not be\
    \ seen by Web crawlers and many screen readers. However, at times you might have\
    \ repetitive content that will not help (or may even hinder) your placement in\
    \ a search index.\n\nTo add content, you can use the `content` property (Table\
    \ 9.3), which allows you to specify a text string, image or sound file URL, counter,\
    \ quote, or even an attribute value that should be displayed on the page.\n\n\
    # ## To define generated content:\n\n+   1. Specify whether the content should\
    \ go before or after the element. Type a selector with the `:before` or `:after`\
    \ pseudo-class (see “Setting content before and after an element” in Chapter 4)\
    \ to define where the content will be positioned in relation to the selector (Code\
    \ 9.3).\n+   \n+   footer a.prev:before {...}\n\n+   2. Add the `content` property\
    \ to your CSS. In your declaration block, type the `content` property name, followed\
    \ by a colon (:) and one of the values listed in Step 3.\n+   \n+   content:\n\
    \n| Value |\n|---|\n| normal |\n| none |\n| <string> |\n| <url> |\n| <counter>\
    \ |\n| attr(<selector>) |\n| open-quote |\n| close-quote |\n| no-open-quote |\n\
    | no-close-quote |\n| inherit |\n\nCode 9.3. Added to ui-generatedcontent-properties.css—The\
    \ left arrow image (bullet-02) is inserted along with the word “Chapter,” before\
    \ the title of the previous chapter. Next, the word “Chapter” is inserted before\
    \ the next chapter title with a right-pointing arrow (bullet-01) after A.\n\n\
    ```\n/** ui-generatedcontent-properties.css **/\n\nfooter a.prev:before {\n content:\
    \ url(../images/chrome/\n -bullet-02.png) ' Chapter '\n counter(chapterNum) '\
    \ : ';\n}\n\nfooter a.next:before {\n content: 'Chapter ' counter(chapterNum)\
    \ ' : ';\n}\n\nfooter a.next:after {\n content: '' url(../images/chrome/\n -bullet-01.png);\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 262
  md: "![](img/e1ed1e3c1873fa9fc855210fb83699d0_262_0.png)\n\nCode 9.3 applied to\
    \ Code 9.1: The previous and next chapters now have back and forth arrows.\n\n\
    TIP Because the content property was not supported until Internet Explorer 8,\
    \ it is best not to rely on this property for critical information.\n\nTIP Information\
    \ rendered using the content property will not be searchable by search engine\
    \ spiders, so never use it to insert information that defines your page.\n\nTIP\
    \ Content added this way is also invisible to screen readers, so don't include\
    \ anything that they will miss.\n\nTIP One idea is to use content to add figure\
    \ captions pulled from the image's alt tag. Because this is visible to screen\
    \ readers and search engines, it's a good way to cut down on repetitive content.\n\
    \n# 3. Specify the content to be added.\n\n```\nurl('../images/chrome/\n  bullet-01.png')\
    \ 'Chapter '\n  'counter(chapterNum) ':' ;\n```\n\nTo define the content that\
    \ is being added, type one or more of the following values, separating each value\
    \ with a space:\n\n+   Type a string value, such as Chapter, within single or\
    \ double quotes. Anything within the quotes will be displayed just as you typed\
    \ it, including HTML code, although spaces are collapsed (that is, more than two\
    \ spaces are collapsed into a single space when displayed).\n\n+   url(), with\
    \ an absolute or relative URL within the parentheses pointing to an external file,\
    \ such as an image or sound file. For example, url(bg_flourish.png) will load\
    \ an image.\n\n+   counter(), with a counter name in parentheses. For example,\
    \ counter(chapterNum) adds the counter number for the chapterNum counter. (Counters\
    \ are explained in the next section.)\n\n+   open-quote or close-quote to add\
    \ a quotation mark using the current quotation style. (See “Specifying the Quote\
    \ Style” later in this chapter.)\n\n+   no-open-quote or no-close-quote to increase\
    \ the level of quoting by one level.\n\n+   attr() to display the value of the\
    \ indicated attribute. For example, attr(alt) will display the value for the alt\
    \ attribute of the element being styled.\n\n+   inherit, which will use the content\
    \ defined for the parent element.\n\n+   normal or none, which will not add any\
    \ content or apply any other values."
  merge: -1
