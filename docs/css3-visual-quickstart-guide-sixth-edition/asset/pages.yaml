- pgno: 351
  md: '# Creating Multicolumn Layouts with Float


    The most common way to lay out a page is by establishing a grid, which is generally
    made up of two or more columns A. This allows the designer to present multiple
    sources of information and functionality in the same horizontal plane, making
    better use of the screen and reducing the need to scroll.


    Although not explicitly intended to perform this duty, the float property (discussed
    in Chapter 10) is now the standard method for creating a grid structure of columns
    in most modern Web designs. This is done by taking block level elements—elements
    that would normally flow vertically—and "floating" them next to each other so
    that they flow horizontally B.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_351_0.png)


    A The basic wireframe for your page showing the three columns within the surrounding
    section element.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_351_1.png)


    B When floating is applied, the columns flow horizontally next to each other.'
  merge: -1
  img_proc: true
- pgno: 352
