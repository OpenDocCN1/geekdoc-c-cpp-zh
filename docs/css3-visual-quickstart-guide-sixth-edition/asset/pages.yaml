- pgno: 204
  md: '# Color and Background Properties


    Colors form the cornerstone of all design, even if they''re only black and white.
    They create the first impression of your site. Bright, vibrant, jewel-like colors
    make a radically different statement than earth tones. Even if you choose to use
    only black and white, your design will make a statement. Beyond their decorative
    impact, colors can also guide the viewer''s eye around the page, helping to highlight
    some important areas while downplaying others. In this chapter, you will learn
    the primary methods used to add and control color with CSS. Keep in mind, however,
    you can specify color using several CSS properties. (See the sidebar “Other Ways
    to Add Color.”) But before you learn how to code colors, let''s quickly explore
    how to choose them.


    # In This Chapter


    +   - Getting Started 184

    +   - Choosing Color Values 185

    +   - Creating Color Gradients 191

    +   - Choosing Your Color Palette 196

    +   - Setting Text Color 202

