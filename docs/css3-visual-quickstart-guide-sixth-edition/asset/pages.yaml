- pgno: 420
  md: '# 33 CSS Best Practices


    Throughout the pages of this book, I’ve offered numerous tips, recommendations,
    and suggestions. I’ve tried to follow my own advice in all of the code I’m presenting,
    but the necessities of creating useful examples had to be balanced against the
    needs of best practices for coding. So, to clear up any confusion, here are the
    33 most important best practices for CSS, along with cross-references showing
    where you can find additional information.


    +   1. Always specify units for values except when the value is 0. It’s a simple
    equation:


    ```

    opx = 0in = 0em = 0cm = 0% = 0mm = 0

    ```


    Zero is always zero, and you don’t need to define what kind of 0 it is.


    See “Values and Units Used in This Book” in the Introduction.


    +   2. Structure first, then presentation. Some designers want to start designing
    pages without first placing the HTML structure, but this is like trying to put
    siding on a house that hasn’t been framed yet.


    See “How Does HTML5 Structure Work?” in Chapter 2.


    +   3. Specify a doctype. These days, using a DTD should go without saying, but
    an HTML document without a doctype is like a book without a cover. Not only do
    you not know what’s in it, but the whole thing tends to fall apart.


    See “How Does HTML5 Structure Work?” in Chapter 2.'
  merge: -1
  img_proc: true
- pgno: 421
  md: "+   **4. All styles should be external.** To keep the Web site as easy to change\
    \ as possible, the final styles should always be located in external files and\
    \ never be embedded in the head or inline. Embedded or inline styles are acceptable\
    \ during development but should all be moved into an external style sheet before\
    \ deployment.\n+   \n+   See “External: Adding Styles to a Web Site” in Chapter\
    \ 3.\n\n+   **5. Keep the number of external style sheets to a minimum.** This\
    \ may seem to contradict the previous statement, but every external style sheet\
    \ is a call to the Web server, and every call slows down Web page loading. This\
    \ is true whether you are using <link> or @import.\n+   \n+   See “External: Adding\
    \ Styles to a Web Site” in Chapter 3.\n\n+   **6. Place style links in the <head>,\
    \ never in the <body>.** Styles placed in the <body> of an HTML document will\
    \ not be applied to the page until after the Web page has displayed, causing the\
    \ entire document to briefly flash as it re-renders the page with the styles.\
    \ This is annoying and unattractive.\n+   \n+   See “External: Adding Styles to\
    \ a Web Site” in Chapter 3.\n\n+   **7. Use link to add styles to an HTML document\
    \ and @import to add styles to other style sheets.** Older versions of Internet\
    \ Explorer will load styles in the <head> as if they were in the <body>, causing\
    \ the annoying flash as the page re-renders.\n+   \n+   See “External: Adding\
    \ Styles to a Web Site” in Chapter 3."
  merge: -1
  img_proc: true
- pgno: 422
  md: '8. Include default styles for HTML elements. Don''t design by default. Use
    a CSS override to reset some values, but always define the default style for as
    many HTML elements as you will be using in your designs.


    See “(Re)defining HTML Tags” in Chapter 3.


    9. Use generic class names. Classes are reused throughout a page, often combined
    with different elements, and are subject to change. If the name is based on a
    value, changing the value can make the class name confusing.


    See “Defining Reusable Classes” in Chapter 3.


    10. Use specific ID names. IDs should be used only once per HTML document, so
    the name needs to specify what it is or what it’s for.


    See “Defining Unique IDs” in Chapter 3.


    11. Add a unique class name or ID to the body tag of every page. This gives every
    page its own unique identification, which you can then leverage to style the page
    separately from other pages.


    You can also add classes for the page’s section or other designations that distinguish
    it in the site. This can help you reduce the number of external style sheets because
    it allows you to add styles for selective pages all in the same external file.


    See “Defining Reusable Classes” and “Defining Unique IDs” in Chapter 3.'
  merge: -1
  img_proc: true
- pgno: 423
  md: "+   **12. Mix and match classes.** You can apply multiple classes to a single\
    \ element simply by placing the class names in the same class property in the\
    \ tag, separated by spaces. This allows you to combine classes rather than creating\
    \ new ones to meet a specific need.\n+   \n+   See “Defining Reusable Classes”\
    \ in Chapter 3.\n\n+   **13. Combine rules into selector lists.** Elements that\
    \ have the same CSS properties and values can be combined into a single CSS rule.\n\
    +   \n+   See “Grouping: Defining Elements That Are Using the Same Styles” in\
    \ Chapter 3.\n\n+   **14. Use dynamic styles for form elements, buttons, and other\
    \ interface elements.** Many elements, such as form fields and form buttons, can\
    \ have multiple dynamic states that can provide visual feedback for hover and\
    \ also when a button is clicked or a form field is selected. Don’t forget to style\
    \ these, too.\n+   \n+   See “Working with Pseudo-Classes” in Chapter 4.\n\n+\
    \   **15. Use @media rules and media queries to tailor the page to the device.**\
    \ Although not available to all browsers, media queries allow you to distinguish\
    \ many mobile browsers, such as the iPhone, so that you can deliver a custom experience.\n\
    +   \n+   See “Querying the Media” in Chapter 4.\n\n+   **16. Favor specificity\
    \ over classes and IDs, but only be as specific as necessary.** Specificity allows\
    \ you to selectively style an element without explicitly identifying it with a\
    \ class or ID. Although"
  merge: -1
  img_proc: true
- pgno: 424
  md: 'classes and IDs can be useful, they will often limit the versatility of the
    page structure. Before adding a new class or ID to an element, see if you can
    use contextual styles.


    On the other hand, don''t make styles so specific that they apply only to very
    specific cases, when they may need to apply more broadly.


    See “Defining Styles Based on Context” in Chapter 4.


    +   17. Avoid !important. The !important value is a blunt weapon. It turns styles
    on and overrides the cascade order. This also means that it can be very tricky
    to override. If you do use !important during development, try to take it out before
    your site goes live.


    See “Making a Declaration !important” in Chapter 4.


    +   18. Avoid unnecessary and repetitive repetition. Style sheets can quickly
    become cluttered with redundant properties and values that do not actually change
    the value of whatever is already set. Remember that once a property value is set,
    it will cascade down to child elements.


    For example, if you set the font size for the body, you will never need to set
    it again unless a specific element uses a different size. All too often I see
    the same font size set for element after element. Remember to check whether a
    style has already been set for a parent element before you set it.


    See “Determining the Cascade Order” in Chapter 4.'
  merge: -1
  img_proc: true
- pgno: 425
  md: '# **19. Use relative sizes for font size.**


    Although it is sometimes easier to use sizes such as pixels, using relative sizes
    such as ems allows you to scale text sizes on the page uniformly and keep better
    typographic rhythm.


    See “Setting the Font Size” in Chapter 5.


    # **20. Prefer shorthand properties.**


    The shorthand properties, such as font, allow you to set multiple values with
    a single property. This not only cuts down on the amount of code, it also keeps
    similar property values together, making editing easier.


    See “Setting Multiple Font Values at the Same Time” in Chapter 5.


    # **21. Use RGB for color.**


    You may see hex color values more often than RGB, but there is no really good
    reason to use one over the other from a code standpoint. Because RGB values are
    easier for mere mortals to understand and you can now set transparent colors using
    RGBA, I recommend always using RGB.


    See “Choosing Color Values” in Chapter 7.


    # **22. Use background images or other styles for interface chrome.**


    The `` tag should be used for images that are content: photographs, figures, or
    illustrations. Chrome constitutes the visual elements of the interface such as
    backgrounds, buttons, and other controls.


    Instead of using the `` tag to add these, interface chrome should be added using
    background images. This makes it easier to make changes or to completely rework
    the design without touching the HTML code.


    See “Setting Background Images” in Chapter 7.'
  merge: -1
  img_proc: true
- pgno: 426
  md: '23. Use CSS sprites. Use sprites to add images to different dynamic states
    with only a single file that changes position to reveal each state. CSS sprites
    are faster to load than multiple images and do not flash as the states change.
    See “Using CSS Sprites” in Chapter 13.


    24. Use CSS for simple background gradients. Simple gradients are supported in
    most browsers now and can be used in backgrounds. Rather than slowing things down
    with images, use CSS gradients. See “Creating Color Gradients” in Chapter 7.


    25. Start with a clean slate. CSS resets allow you to set a level playing field,
    making it easier to design across multiple browsers. See “Resetting Browser Default
    Styles” in Chapter 14.


    26. Favor margin over padding. Due to problems with Internet Explorer and the
    box model, padding can cause problems with elements that have a defined width
    or height. If you have a choice, use margin. See “Adjusting CSS for Internet Explorer”
    in Chapter 14.


    27. Test your code in Firefox, Chrome, and/or Safari while building, and then
    fix it for Internet Explorer. Although IE still has the lion’s share of the browser
    market, it’s easiest to build a site to Web standards, and then accommodate for
    IE’s idiosyncrasies rather than the other way around. See “Adjusting CSS for Internet
    Explorer” in Chapter 14.'
  merge: -1
  img_proc: true
- pgno: 427
  md: '28. Style all link states. Many designers will style only the default link
    state and maybe the hover state. However, you can also style visited and active
    states, which provide visual feedback to the user when clicking a link. See “Styling
    Links vs. Navigation” in Chapter 13.


    29. Use comments to keep notes and organize your code, especially for constant
    values. Notes are helpful for recording information about your design, especially
    in color or font values that you will be using consistently throughout your design.
    Notes can also be used to create section dividers in your code to help organize
    and make scanning for particular parts easier. See “Create Readable Style Sheets”
    earlier in this chapter.


    30. Use specificity to organize your code. Specificity is not just a great idea
    for styling; you can use it to create an outline-like format for your code, making
    it easier to scan and find related elements. See “Create Readable Style Sheets”
    earlier in this chapter.


    31. Favor `<link>` over `@import`. Although both can be used to bring style sheets
    into Web documents, tests have shown that most browsers will download linked style
    sheets faster than imported ones. This is true even if the `@import` is in an
    external style sheet because the parent external style sheet has to be loaded
    before its children are considered. See “Have a Style Sheet Strategy” earlier
    in this chapter.'
  merge: -1
  img_proc: true
- pgno: 428
  md: '32. Minify your CSS before you launch.

    Mean and lean code leads to faster download speeds, which always make for a better
    user experience. While you are developing your site, your code should be as readable
    as possible. But when you launch the site, you can remove all spaces, returns,
    and notes from your code.


    See “Minify Your CSS” earlier in this chapter.


    33. Use fonts for icons. With web fonts now a fact of life, we can rely on them
    for a variety of purposes that would have been unthinkable just a few years ago—most
    notably using them for icons instead of images. Images are limited by their sizes
    and styles, while fonts can be resized and restyled at will. This is especially
    important for responsive design, where sizes need to change depending on the display
    device in use.


    See “Using Web Fonts” in Chapter 5.'
  merge: -1
  img_proc: true
