- pgno: 416
  md: '# # Validate Your CSS Code


    The W3C provides a Web site called the CSS Validator that lets you check your
    CSS code to confirm that it meets the requirements set in the W3C standards.


    # ## To use the W3C''s CSS Validator:


    +   1. To go to the W3C validator Web site, point your Web browser to jigsaw.w3.org/css-validator.


    +   2. Choose the method to validate your CSS. You can enter a URL (by URI), enter
    the CSS code directly in a form (with a text area), or upload your files (by file
    upload). In this example, you''ll submit a URL.


    +   3. Enter the URL of your Web site or style sheet. I recommend entering the
    exact URL of the style sheet.


    +   4. Wait. The validation takes only a few seconds. You''re given a report of
    errors and other possible problems with your CSS.


    > > TIP Although you don''t need valid CSS for a browser to display your code,
    the validation process often helps locate code errors.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_416_0.png)


    A The W3C''s Validator.'
  merge: -1
  img_proc: true
