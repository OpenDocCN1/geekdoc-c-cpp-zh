- pgno: 197
  md: '# # Indenting Paragraphs


    Indenting the first word of a paragraph several spaces (five spaces, traditionally)
    is the time-honored method of introducing a new paragraph.


    On the Web, however, indented paragraphs haven''t worked because most browsers
    compress multiple spaces into a single space. Instead, paragraphs have been separated
    by an extra line break.


    Using the `text-indent` property (Table 6.11), you can specify extra horizontal
    space at the beginning of the first line of text in a paragraph and restore the
    traditional paragraph style.


    # ## To define text indentation:


    +   1. Add the text indent property to your CSS. Type `text-indent` in the CSS
    declaration list, followed by a colon (:) (Code 6.9).

    +      `text-indent:`


    +   2. Specify the amount of indentation.

    +      `3em;`


    Type a value for the indent, using one of the following options:


    +   - A length value such as `3em` creates a nice, clear indent. (See “Values
    and Units Used in This Book” in the Introduction.)


    +   - A percentage value indents the text proportionate to the parent’s (paragraph)
    width (10%, for example).


    > > **TIP** If you are using indentation to indicate paragraphs, you should set
    the margin and padding of paragraphs to 0 to override the `<p>` tag’s natural
    tendency to add space between paragraphs. You’ll learn more about margins and
    padding in Chapter 8.


    | Value | Icons |

    | --- | --- |

    | `<length>` | ● ● ● ● ● |

    | `<percentage>` | ● ● ● ● ● |

    | `inherit` | ● ● ● ● ● |


    Code 6.9 Added to `text-properties.css`—Although you can indent any block of text,
    indentation is generally associated with paragraphs, and I’ve set all of the paragraphs
    to indent 3em (6). However, the first paragraph in a section is generally not
    indented; therefore, I’ve set the first paragraph after a header to always have
    an indentation of 0.


    ```

    /* text-properties.css */

    p { text-indent: 3em; }

    header + p {

    text-indent: 0;

    }

    ```


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_197_0.png)


    Code 6.9 applied to Code 6.1: All paragraphs except the first paragraph are indented
    a space that is equivalent to two letters. The indent space will adjust with the
    font size.


    > > **TIP** Because indenting is more common in the print world than the online
    world, you may want to consider using indents for only the printer-friendly versions
    of your page.'
  merge: -1
  img_proc: true
