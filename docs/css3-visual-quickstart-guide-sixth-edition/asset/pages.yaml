    # Math and Science


    Superscript and subscript are used for scientific notation. To express the Pythagorean
    theorem, for example, you would use superscripts:

    a² + b² = c²


    A water molecule might be expressed with subscripts as follows:

    H₂O


    However, keep in mind that neither subscript nor superscript will reduce the text
    size, so you may also want to include font-size in your definition to achieve
    a true scientific notation style. (See “Setting the Font Size” in Chapter 5.)


    # 2. Specify the vertical alignment.


    super;


    Type a value for the vertical text alignment using one of these options:


    > super superscripts the text above the baseline.


    > sub subscripts the text below the baseline.


    > baseline places the text on the baseline (its default state).


    > A relative value from Table 6.10 that sets the element''s alignment relative
    to its parent''s alignment. To align the top of your text with the top of the
    parent element''s text, for example, you would use text-top.


    > A percentage value that raises or lowers the element''s baseline proportionate
    to the parent element''s font size (25%, for example).


    > Superscript is great for footnotes that can be hyperlinked to notes at the bottom
    of the current page or to another Web page.


    > The sup and sub tags can also be used for superscript and subscript, but should
    not be used for design (as in this case) but for footnotes or mathematical notation.


    > If you are creating a multicolumn layout, you might encounter problems with
    vertical alignment when it doesn''t appear where it should be. In those cases,
    a good fallback is to use relative positioning, as explained in Chapter 10.'
