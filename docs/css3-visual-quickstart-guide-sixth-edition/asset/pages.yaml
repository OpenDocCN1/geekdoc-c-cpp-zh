  md: "# # Rounding Border Corners\n\nRounded corners can help soften an otherwise\
    \ sharp design, but they have been difficult to achieve using images. CSS3 includes\
    \ a simple method for rounding off one or all of the corners of an element's box:\
    \ border-radius.\n\nBoth Mozilla and Webkit have implemented their own versions\
    \ of border-radius in advance of the final W3C pronouncement, and you need to\
    \ take these browser extensions into account for the widest interoperability (Table\
    \ 10.17).\n\n# ## To set rounded corners:\n\n+   1. Add the Webkit, Mozilla, and\
    \ standard CSS3 border-radius properties (Code 10.10).\n\n```\nborder-radius:\n\
    ```\n\nAlthough the order doesn't matter, it's generally preferred to have the\
    \ CSS3 version last because it's the version that should be used.\n\n+   2. Type\
    \ a border-radius value, followed by a semicolon, using the same value for all\
    \ three instances.\n\n```\n5px;\n```\n\nThis value can be one of the following\
    \ depending on browser compatibility (Table 10.17):\n\n+   A length value, which\
    \ sets the radius of an imaginary circle at the corner, which is used to round\
    \ it off. The larger the value, the rounder the edge.\n\n+   A percentage (0%\
    \ to 50%), which uses the size of the element to set the corner radius. Higher\
    \ values produce rounder corners, with 50% joining\n\n| Value | |\n|---|---|\n\
    | <length> | |\n| <percentage> | |\n\nCode 10.10 Added to box.properties.css—\
    \ When applied to Code 10.1, the border-radius property is used to round the corners\
    \ of different elements\n\n```\n/* box-properties.css */\narticle {\n    border-top-right-radius:\
    \ 20px;\n}\nfigure {\n    border-radius: 5px;\n}\naside {\n    border-radius:\
    \ 20px/40px;\n}\n```\n\n![](img/e1ed1e3c1873fa9fc855210fb83699d0_293_0.png)\n\n\
    The Cat only went once when a cat... Alice... 'Then it doesn't matter which way\
    \ you go,' said the Cat.\n\nCode 10.10 applied to Code 10.1: The figure area border\
    \ also has slightly rounded corners but only on the outer line of the double line\
    \ border."
  merge: -1
  img_proc: true
- pgno: 294
  md: '# Setting Elliptical Corners


    One final option is to create elliptical rather than circular corners by defining
    two radius points. Include two values, separated by a slash:


    ```

    border-radius: 20px/40px;

    ```


    Safari and Chrome support only a single value for the four corners in border radius,
    so setting elliptical corners is problematic. If you need to set separate elliptical
    corners, use the long form for each corner instead.


    Also, I find, however, that the anti-aliasing distortion becomes even more exaggerated
    in some browsers when an elliptical corner is used, so I avoid these.


    ![](img/e1ed1e3c1873fa9fc855210fb83699d0_294_0.png)


    Code 10.10 applied to Code 10.1: The main article has been rounded off, giving
    it the look of a notebook.


    corners into a semicircle. Percentage is not supported in Webkit.


    +   3. Each corner''s border radius can be set independently without specifying
    the other corner radii.


    ```

    border-top-right-radius: 20px;

    ```


    +   4. You can include up to four values.


    ```

    border-radius: 20px 0 40 20px;

    ```


    Separate each value by a space as a shortcut for setting the border radius:


    +   One value sets all four corner radii the same.


    +   Two values set the radius for the top-left/bottom-right and bottom-left/top-right
    corners.


    +   Three values set the corner radius for the top left, bottom left/right (the
    same), and the bottom right corners.


    +   Four values set the radius for each corner in this order: top left, top right,
    bottom right, and bottom left.


    With Webkit you must set corners separately because it treats a second value as
    the second point in the radius to create elliptical (rather than circular) corners.


    > TIP Although border-radius does anti-alias the curves to make them appear smooth,
    the results can be hit or miss. I recommend keeping the contrast between your
    lines and background low to improve the curve appearance.


    > TIP Curved borders will not clip the content in the box. So, an image that might
    normally be in the corner of the box will still be there, sticking out into the
    curve.'
  merge: -1
  img_proc: true
