- pgno: 127
  md: '+   Orientation looks for *landscape* (height greater than width) or *portrait*
    (width greater than height) layout. This allows you to tailor designs for devices
    that can flip.


    +   Color, color-index, and monochrome finds the number of colors or bits per
    color. These allow you to tailor your design for black-and-white mobile devices.


    +   Resolution looks at the density of pixels in the output. This is especially
    useful when you want to take advantage of display devices that have a higher resolution
    than 72 dpi.


    By default, media queries are for the viewport (see Chapter 11 for details on
    the viewport) with the exception of those that specify *device*, in which case
    they are for the entire screen or output area. For example, width is the width
    of the visible browser viewport within the screen, whereas device-width is the
    width of the entire screen.'
  merge: -1
  img_proc: true
