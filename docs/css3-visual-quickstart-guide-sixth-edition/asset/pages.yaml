    # Why Use a Doctype?


    If you do not use a doctype, modern browsers are forced into Quirks mode. That’s
    a bad situation if you are creating new Web pages because it leaves the interpretation
    of the code solely to the discretion of the browsers, which can translate into
    a lot of display inconsistencies.


    If you do not include the doctype in your Web page, newer browsers may not recognize
    all of your code.'
