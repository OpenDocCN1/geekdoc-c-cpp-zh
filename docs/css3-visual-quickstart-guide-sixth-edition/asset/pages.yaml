    \ h2 {\n word-spacing: -.3em;\n}\n.pageheader h2 .cite {\n word-spacing: 0;\n\
    }\n```\n\n![](img/e1ed1e3c1873fa9fc855210fb83699d0_182_0.png)\n\n> Code 6.3 applied\
    \ to Code 6.1: The space between the words has been changed for effect in the\
    \ titles and slightly increased to lighten the copy.\n\n# Adjusting space between\
    \ words\n\nJust as tracking and word spacing adjustments can both help and hinder\
    \ legibility, adding a little space between words on the screen using the word-spacing\
    \ property (Table 6.2) can make your text easier to read. But too much space interrupts\
    \ the path of the reader’s eye across the screen and interferes with reading.\n\
    \n# To define word spacing:\n\n+   1. Add the word-spacing property to your declaration\
    \ list. Type word-spacing in the CSS declaration list, followed by a colon (:)\
    \ (Code 6.3).\n\n+   2. Specify the amount of space between words.\n\nSet the\
    \ value for word-spacing, using one of the following:\n\n+   > A positive or negative\
    \ length value, representing the amount of space between words (-.1em, for example).\
    \ For more information, see “Values and Units Used in This Book” in the Introduction.\n\
    \n+   > normal, which overrides inherited values.\n\n> TIP Like letter spacing,\
    \ use word spacing very sparingly. Generally, the natural word spacing has been\
    \ optimized for readability. Changing that spacing often does more harm than good."
