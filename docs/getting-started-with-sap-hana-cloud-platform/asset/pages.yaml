  md: '![](img/cf7012644082c115a2181376d9b7486d_390_0.png)


    # ## 9.3 Developing Content for SAP HANA Cloud Portal


    In the previous section, you learned that OpenSocial widgets make up the main
    content area of portal sites. From a development perspective, this implies that
    you have to package up every piece of content you plan to integrate into a portal
    site as an OpenSocial widget. In the sections that follow, we''ll look at ways
    of achieving this using familiar SAP HCP development tools.


    # ### 9.3.1 Creating OpenSocial Widgets


    As we noted in Section 9.1.2, an OpenSocial widget is essentially a wrapper around
    a web application. In the simplest case, all it takes to transform a given web
    application into an OpenSocial widget is the inclusion of an XML deployment descriptor
    in the application’s root folder. This XML descriptor file is referred to as the
    widget’s specification XML (or spec XML).


    Listing 9.1 contains a sample spec XML file that might be used to create a widget
    to display the SAP PRESS home page. As you can see, about the only thing going
    on with this markup is the specification of the widget’s content in the correspondingly
    named <Content> element. This minimal information is all the OpenSocial container
    needs to render the widget at runtime.'
  merge: -1
  img_proc: true
- pgno: 391
  md: '```

    <?xml version="1.0" encoding="UTF-8"?>

    <Module>

    <ModulePrefs title="Sample Widget" />

    <Content type="url" href="www.sap.press.com" />

    </Module>

    ```


    Listing 9.1 A Sample Spec XML File


    Looking closely at the spec XML sample provided in Listing 9.1, you can see that
    the <Content> tag used to specify the widget''s content has a type attribute that
    determines where the widget will be getting its content from. Although the example
    given in Listing 9.1 points to a URL, most of the custom gadgets that you create
    will reference content contained somewhere within the hosting application itself.


    In the next two sections, we''ll demonstrate how this works by showing you how
    to create an OpenSocial widget out of an HTML5 application deployed on SAP HCP.
    Here, you''ll create a widget to display the current temperature at a user''s
    particular location. To keep things simple this first time out, we''ll be sticking
    with plain HTML5 content. We''ll then follow this up in Section 9.3.3 with some
    examples based on other SAP HCP application types.


    # Preparing for Widget Development in the SAP Web IDE


    Technically speaking, the only OpenSocial-specific source code file that you''ll
    be maintaining when building your custom widget sources is the aforementioned
    spec XML file. Because you can edit this file using any text editor, you can develop
    OpenSocial widgets using just about any IDE or editor imaginable. Within SAP HCP,
    the list of options includes the Eclipse IDE and the SAP Web IDE.


    Although you can''t go wrong with either of these IDEs, there is an advantage
    to using the SAP Web IDE, because it includes an SAP HANA Cloud Portal-related
    plug-in that can be used to bootstrap the widget development process. With that
