- pgno: 26
  md: 'In this chapter, we introduce you to the SAP HANA Cloud Platform and describe
    its positioning in the evolving SAP technology landscape.


    # # 1 Introduction to SAP HANA Cloud Platform


    Since the initial release of SAP R/3 in 1992, SAP landscapes have primarily existed
    in isolation, being nestled safely within the nurturing confines of the corporate
    firewall. However, with the explosion of cloud computing and mobility in recent
    years, this has begun to change. Now, customers are looking to expand the limits
    of their SAP landscapes to support integration with cloud applications (provided
    by SAP or otherwise), mobile access, and the Internet of Things (IoT).


    To address this ever-widening gap, SAP introduced SAP HANA Cloud Platform (SAP
    HCP). In this chapter, we’ll get to know SAP HCP and learn how it will play a
    central role within the SAP technology landscape in the years to come.


    Further Resources

    The main product page for SAP HCP is hcp.sap.com, and serves as a valuable resource
    for SAP HCP material: trial systems, documentation, and more.


    # ## 1.1 Introducing SAP HANA Cloud Platform


    According to the SAP help documentation, SAP HCP is “an open, standards-based,
    and modular platform as a service for rapid development of on-demand applications.”
    This definition is a bit of a mouthful, so let’s take this point-by-point:


    +   ▶ First, we find that SAP HCP is a Platform-as-a-Service (PaaS) offering from
    SAP. Although we’ll have an opportunity to explore this distinction in further
    detail in Section 1.2, for now, it’s enough to simply note that SAP HCP is a platform
    that can be used to (rapidly) develop and deploy web applications in the cloud.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '+   - SAP HCP is an open environment that offers developers lots of choice
    as it relates to the selection of programming languages and models, development
    tools, and so forth.

    +   - In addition to being open, SAP HCP is also heavily standards-based, being
    developed from the ground up to support standards from leading standards organizations
    such as the W3C.

    +   - Finally, we learn that SAP HCP is a modular platform that can be customized
    to meet the needs of all customer types and use cases.


    In simplified terms, you can think of SAP HCP as a platform that customers can
    rent access to from SAP to develop and deploy applications in the cloud. From
    a technical perspective, this platform is not so different from application systems
    that are installed on-premise, such as the SAP Composition Environment. The primary
    difference is that SAP assumes responsibility for purchasing and maintaining the
    hardware, software, and other infrastructure-related concerns so that customers
    can focus on application development concerns.


    # A Brief History


    Even though SAP HCP more formally came into prominence in the latter part of 2014,
    it''s actually been around for quite some time. In late 2011, we were introduced
    to the first incarnation of the product, which at that time went by one of several
    different names: SAP NetWeaver Cloud, SAP NetWeaver NEO, and, in many circles,
    just NEO. At that time, the product offering was fairly modest, consisting mostly
    of a Java application server and a series of basic cloud enablement services.
    This changed considerably over the course of the next 18 to 24 months, as new
    features and services seemed to be popping up on an almost weekly basis.


    ![](img/cf7012644082c115a2181376d9b7486d_27_0.png)


    By mid-2013, NEO had reached a sufficient level of maturity that SAP began to
    quietly position it as part of their long-term cloud strategy. Around this same'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'time, SAP decided to drop the NetWeaver/NEO naming in favor of the name we
    recognize today: SAP HANA Cloud Platform. From here, the product really began
    to pick up momentum as we saw the scope of the platform expand to include support
    for native SAP HANA development, HTML5 applications, and much more.


    By the time the annual SAP TechEd/d-code conferences rolled around in late 2014,
    SAP HCP finally hit center stage as a key component in SAP''s cloud strategy and
    vision. In many respects, this milestone marked the end of SAP HCP''s infancy.
    Now, we look ahead to the emergence of SAP HCP as a production-ready platform
    for deploying cloud applications. With significant commitment and backing from
    SAP, the future of SAP HCP looks to be very bright indeed.


    # 1.2 The Cloud Computing Revolution


    Even though it''s been a buzzword for quite some time, many people still have
    a hard time wrapping their heads around what the cloud is exactly. For some, it''s
    a magical place where their music files live. For others, the cloud is a wild
    frontier that''s much too insecure to trust with precious IT resources. Somewhere
    in the midst of all this chatter is an idea that''s so simple and yet so powerful
    that you almost wonder why we haven''t arrived at it before. With that in mind,
    in this section we''ll take a look at the cloud computing revolution.


    # 1.2.1 What Is Cloud Computing?


    To a large extent, cloud computing is one of those stream of consciousness ideas
    whose origin is difficult to trace to any one particular individual or organization
    (see boxed note ahead). Like many economic trends, it''s a concept that evolved
    organically as a result of the convergence of several key market conditions:


    +   - A proliferation of inexpensive hardware components (e.g., multicore CPUs,
    main memory, and disk storage)

    +   - Expanded availability of high-speed network access

    +   - Continued advances and innovations in the fields of hardware virtualization'
  merge: -1
  img_proc: true
- pgno: 29
  md: '**Note**

    To a certain extent, Antonio Regalado settled the origin of cloud computing in
    a 2011 article entitled “Who Coined ‘Cloud Computing’?” (MIT Technology Review,
    2011). Here, he traced the origin of the term back to an internal business strategy
    document published by Compaq Computer Corporation in November 1996.


    As these technologies and market conditions converged with one another, it became
    apparent to many technology companies that it would be possible to bundle access
    to computer resources and sell this access to customers using an on-demand, pay-as-you-go
    subscription model.


    This idea, in and of itself, is not a novel concept. Indeed, hosting and co-location
    of server resources have been successful business models in the IT world for quite
    some time. The difference with cloud computing is that provider companies aren’t
    just standing up a handful of servers here and there to meet the demands of a
    particular customer. Instead, providers are building up huge server farms that,
    due to their overall size and computing power, can scale to meet the needs of
    hundreds or even thousands of customers at a time. This kind of economies of scale
    allows providers to provide access to computer resources at a fraction of the
    cost it would normally take to provision the same resources on premise.


    To summarize, we can simply say that “cloud computing” is a term used to describe
    the packaging and distribution of computing resources as a commodity. Of course,
    as is the case with most commercial offerings, the way that these resources are
    bundled can vary greatly. Therefore, in the next section, we’ll consider some
    of the more prominent service models that have emerged in the cloud computing
    space.


    # ## 1.2.2 Understanding the Cloud Computing Service Models


    As the idea of cloud computing really started to take form in the mid-2000s, it
    quickly became apparent that there was not a “one-size-fits-all” service model
    that could possibly satisfy the needs and demands of customers looking to jump
    onboard the cloud computing bandwagon. Therefore, before too long, lots of specialty
    shops popped up offering a la carte services, such as online data storage and
    backup, application hosting, and more. When the dust settled on all this, three
    broad categories of service models had emerged:'
  merge: -1
  img_proc: true
- pgno: 30
  md: '+   Infrastructure-as-a-Service (IaaS)


    IaaS is a service model in which providers offer access to base-level computing
    resources: servers, disk storage, and so on. Although the resources themselves
    are normally virtualized, the end product looks and behaves for consumers in almost
    identical fashion to infrastructure resources configured on-premise. Some of the
    more prominent IaaS providers in the market as of the time of writing include
    Amazon, Microsoft, and Google.


    +   Platform-as-a-Service (PaaS)


    As the name suggests, the PaaS service model offers customers a full-fledged computing
    platform. Here, in addition to virtualized hardware resources (as part of an IaaS
    offering), PaaS also includes an installed operating system (OS), one or more
    programming environments, and general-purpose services, such as database access.
    Collectively, these platform resources offer developers everything they need to
    develop applications within the cloud. Some of the more prominent PaaS solutions
    in the market as of the time of writing include Amazon Web Services (Amazon AWS),
    Force.com, Google App Engine, and Microsoft''s Windows Azure.


    +   Software-as-a-Service (SaaS)


    SaaS is just that: software that''s provided to customers as a service. Here,
    as opposed to commercial off-the-shelf (COTS) packages customers have historically
    installed on-premise, the installation and maintenance of SaaS solutions is managed
    exclusively by the software provider. This frees customers from the headaches
    of maintenance, but also restricts their ability to customize the software. Although
    most SaaS solutions are somewhat configurable, the scope of what can be enhanced
    is fairly limited by comparison.


    The positioning of these three service models within the cloud computing paradigm
    is shown in Figure 1.1. This service stack provides customers with the flexibility
    they need to choose the model that works best for them. Starting from the bottom
    up, it''s important to note that the higher you go within the service stack, the
    more abstracted the offering becomes. For example, when customers purchase licenses
    for a SaaS solution, they''re not only buying access to the software itself; included
    in this offering are the underlying platform and infrastructure resources upon
    which the software''s deployed. In addition to simplifying the buyer experience,
    this also makes it possible for customers to be up and running with a particular
    software package in mere minutes as opposed to the days,'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'weeks, or months that are normally required to stand up a new server and install
    software packages on-premise.


    ![](img/cf7012644082c115a2181376d9b7486d_31_0.png)


    Figure 1.1 Understanding the Cloud Computing Service Model


    Because this is a book about SAP software, you''re probably wondering how SAP''s
    various cloud-based offerings fit into the service model diagram shown in Figure
    1.1. These relationships are highlighted in Figure 1.2.


    ![](img/cf7012644082c115a2181376d9b7486d_31_1.png)


    Figure 1.2 Overview of the SAP Cloud Strategy'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'Considering the overview diagram contained in Figure 1.2, let''s focus in on
    some of the various components that make up SAP''s cloud strategy:


    # IaaS


    As opposed to traditional IaaS offerings, which provide generalized access to
    hardware resources, SAP''s IaaS offerings consist mostly of hosting services.
    This starts with the SAP HANA Enterprise Cloud (SAP HEC), which is a hosting service
    that allows customers to run their SAP Business Suite and/or SAP Business Warehouse
    (SAP BW) systems on a private cloud that''s managed by SAP.


    In addition to SAP HEC, SAP also provides SAP HANA-related infrastructure services
    as part of SAP HCP. For customers who have previously purchased an SAP HANA license,
    SAP provides SAP HANA Infrastructure Services. Net new customers have the option
    of subscribing to SAP HANA DB Services, which bundles infrastructure and license
    subscriptions together. In either case, SAP provides the hardware infrastructure
    to stand up an SAP HANA instance in the public cloud.


    # PaaS


    As noted earlier, SAP HCP is SAP''s PaaS offering. As you can see in Figure 1.2,
    SAP HCP runs in the public cloud and undergirds SAP''s SaaS solutions by providing
    a rich set of application services that can be used to develop extension applications
    and the like.


    # SaaS


    Over the course of the past several years, SAP has built up a fairly large cloud
    application portfolio that blends core ERP functions with applications that were
    attained via acquisitions (e.g. SuccessFactors, Concur, Ariba, and so forth).
    In early 2015, this portfolio of applications was given a common name: SAP S/4HANA.
    SAP S/4HANA is the next generation of SAP Business Suite, and will ultimately
    unite these applications into a full-scale cloud application suite. As you can
    see in Figure 1.2, SAP S/4HANA customers will have the option of deploying SAP
    S/4HANA on-premise, on the public cloud, or privately as part of a managed cloud
    solution. This flexibility allows customers to slowly move to the cloud and choose
    how much control they wish to delegate to SAP in terms of maintenance.


    Though SAP S/4HANA represents the future of SAP''s SaaS offering, we should also
    make mention of another SaaS offering that exists at the time of this writing
    for small/mid-size businesses: SAP Business ByDesign. SAP Business'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'ByDesign is an integrated, turn-key offering that allows small businesses to
    stand up a lightweight SAP Business Suite in the public cloud.


    Throughout the course of this book, our focus will be on SAP HCP and, more specifically,
    the SAP HANA App Services portion of the overall SAP HCP services offering. This
    distinction is highlighted in Figure 1.3 and Figure 1.4. As you can see, SAP HANA
    App Services builds on top of the infrastructure services provided as part of
