    # ## 2.3.2 Downloading the SAP HCP SDK


    In addition to the SAP HCP-related plug-ins integrated into Eclipse, SAP also
    provides a standalone SDK that includes a series of useful tools and examples
    to kick start the development process. Among other things, this SDK includes the
    following:


    +   - Platform API Java Archive (JAR) files

    +   - API documentation

    +   - A local SAP HCP runtime instance that can be used for offline testing

    +   - A command line tool that can be used to administer SAP HCP instances

    +   - Loads of full-scale example projects with annotated source code and documentation'
  merge: -1
