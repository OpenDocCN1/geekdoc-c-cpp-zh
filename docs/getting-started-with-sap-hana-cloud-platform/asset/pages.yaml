    # 4.2.4 Logging and Tracing Concepts


    Sometimes, an application may deploy, but there could be resource-related issues
    that prevent it from actually launching. In these situations, it can be useful
    to be able to write out a series of trace messages that provide clues about what
    went wrong. As it turns out, SAP HCP makes logging and tracing with Java applications
    a snap. In this section, we’ll look at what’s required to make this happen.


    # Getting Started with the Simple Logging Façade for Java API


    Simplified logging and tracing access for SAP HCP Java applications is provided
    via the Simple Logging Façade for Java (SLF4J), which, as the name suggests, is
    a façade or abstraction on top of a number of Java-based logging frameworks, such
    as log4j, the java.util.logging package, and so on. Java applications can access
    the SLF4J API without having to add in specialized references or copy third-party
    JAR files into the WEB-INF/lib folder.'
