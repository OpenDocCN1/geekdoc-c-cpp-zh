    # 6.4 Using the Document Service


    In Section 6.2, you learned how to use the Persistence Service to store structured
    data in relational databases. By structured data, we’re referring to data that
    is highly organized and predictable in nature. Such data fits nicely into two-dimensional
    tables and is easy to analyze using query languages, such as SQL.


    Although many enterprise applications work pretty much exclusively with structured
    data, there are times when an application may also need to deal with raw, unstructured
    data, such as document attachments, social media feeds, and so on. Although you
    could technically store this raw data in the database along with everything else,
    to do so would be tantamount to stacking boxes in the archives closest; no one
    will ever see the data again. In order to be able to do productive things with
    this unstructured data, you need something more than just a simple data store.
    What you need is a content repository.


    In addition to providing data storage capabilities, content repositories also
    provide several other important value-add features, including the following:


    +   - Versioning

    +   - Security using access control lists (ACLs)

    +   - Indexing

    +   - Advanced query and search capabilities


    Collectively, these features allow you to get more out of your unstructured data.'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'Within SAP HCP, you can create content repositories using the Document Service.
    In this section, we''ll take a brief look at the Document Service and some of
    the core features it has to offer.


    # ## 6.4.1 Conceptual Overview


    Within SAP HCP, the Document Service plays the role of content repository. It
    can be used to store and retrieve unstructured or semistructured data. Internally,
    this unstructured data can be enriched with various properties that help to classify
    the data and make it easier to mine later on.


    Conceptually speaking, content within the Document Service is organized in much
    the same way that content is organized within a file system. You can organize
    files into a hierarchical folder structure that implicitly defines a content taxonomy.
    How you choose to organize this content is up to you; the Document Service doesn''t
    really care one way or another.


    **Creating a Mock File System Using the Document Service**


    Although the Document Service is primarily intended for use as a full-scale content
    repository, it can actually be used as a mock file system whenever you have application
    scenarios that absolutely require the use of a file system. Such scenarios often
    crop up whenever you attempt to install third-party or legacy Java applications
    onto SAP HCP. Indeed, as you may recall from Chapter 4, the Cloud Jenkins project
    uses the Document Service to provide Jenkins with a file system that can be used
    to store configuration files and so on. Therefore, though widespread use of the
    Document Service in this capacity is probably not ideal, it''s certainly possible.


    In keeping with the openness of SAP HCP, the functionality of the Document Service
    is exposed using the industry standard Content Management Interoperability Services
    (CMIS) protocol defined by the OASIS consortium. Rather than building a protocol
    handler from scratch, SAP also standardized around the open-source OpenCMIS library
    provided by the Apache Chemistry Project. (For more information about the Apache
    Chemistry Project, check out http://chemistry.apache.org.) This library is automatically
    included in the classpath for SAP HCP applications, so there''s nothing we have
    to do up front to install it. In addition to being easy to work with, the use
    of OpenCMIS makes it possible to reuse libraries and frameworks that can be used
    to synchronize content and so on.'
  merge: -1
  img_proc: true
- pgno: 283
  md: '# 6.4.2 Working with the OpenCMIS API


    In order to understand how to tap into the functionality of the Document Service,
    it''s helpful to take a look at how you can interact with it using the OpenCMIS
    API. Therefore, in this section, we''ll show you how this API can be used to connect
    to a repository, add and remove content, and search for content after the fact.
    Once you grasp these concepts, it will be much easier to see how to exploit some
    of the value-add features of the Document Service within your application scenarios.


    To guide this discussion, we would recommend that you open the AttachmentProcessorBean.java
    file contained within this chapter''s source code bundle in the com.sappress.hcbook.chp06.document
    package (downloadable from www.sap-press.com/3638). This session EJB is used within
    the incident management application to process attachments that are uploaded for
    particular incidents (see Figure 6.44). As such, it provides a fairly typical
    example of how the Document Service is used from an application perspective.


    ![](img/cf7012644082c115a2181376d9b7486d_283_0.png)


    # Establishing a CMIS Session


    Before you can begin doing anything useful with the Document Service, you first
    need to establish a CMIS session. This session essentially connects you with the
    application-specific content repository that you wish to interact with.


    The code excerpt contained in Listing 6.20 demonstrates how you can create a CMIS
    session using the OpenCMIS library. The code begins by looking up the core com.sap.ecm.api.EcmService
    service façade provided by the Document Service via the JNDI context. Although
    this service is managed by the Document Service, you do have to create a resource
    reference to it in the application''s web.xml file.'
  merge: -1
  img_proc: true
- pgno: 284
  md: "```\nimport org.apache.chemistry.opencmis.client.api.*;\n\n@Stateless\n@LocalBean\n\
    public class AttachmentProcessorBean\n{\n    private static final String UNIQUE_NAME\
    \ = \"IncidentRepository\";\n    private static final String SECRET_KEY = \"IncidentAttachments\"\
    ;\n\n    private Session getCmisSession()\n    {\n        EcmService ecmService\
    \ = null;\n\n        try\n        {\n            InitialContext ctx = new InitialContext();\n\
    \            ecmService = (EcmService)\n            ctx.lookup(\"java:comp/env/EcmService\"\
    );\n            return ecmService.connect(UNIQUE_NAME, SECRET_KEY);\n        }\n\
    \        catch (NamingException ne)\n        {\n            throw new CmisRuntimeException(ne.getMessage(),\
    \ ne);\n        }\n        catch (CmisObjectNotFoundException confe)\n       \
    \ {\n            RepositoryOptions options = new RepositoryOptions();\n      \
    \      options.setUniqueName(UNIQUE_NAME);\n            options.setRepositoryKey(SECRET_KEY);\n\
    \            options.setVisibility(Visibility.PROTECTED);\n            ecmService.createRepository(options);\n\
    \n            return ecmService.connect(UNIQUE_NAME, SECRET_KEY);\n        }\n\
    \    }\n}\n```\n\n# Listing 6.20 Establishing a CMIS Session within a Session\
    \ Bean\n\nOnce you obtain a reference to the EcmService handle, you can use its\
    \ connect() method to connect to the target repository, which is keyed by two\
    \ string tokens described within the API as the unique name and secret key, respectively.\
    \ Because this call will fail the first time due to the fact that the repository\
    \ in question does not yet exist, the code is designed to catch exceptions of\
    \ type CmisObjectNotFoundException so that you can create the repository on the\
    \ fly as needed."
  merge: -1
