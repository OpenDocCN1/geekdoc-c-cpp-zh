  md: 'interfaces that make up this library are contained within the javax.persistence
    package, which is available in both the Java SE and Java EE APIs.


    +   Implementation/provider layer


    The low-level database translations and operations are performed within the implementation
    (or provider) layer. Here, an external JPA persistence provider delivers the functionality
    required to synchronize data from relational database tables into Java objects
    and vice versa.


    ![](img/cf7012644082c115a2181376d9b7486d_227_0.png)


    Figure 6.8 Understanding ORM and the Purpose of JPA


    From a historical perspective, the current version of the JPA (2.1 as of the time
    of writing) represents the culmination of countless previous attempts to implement
    ORM in the Java world. As such, JPA incorporates many of the important lessons
    learned from previous attempts at ORM standardization, such as EJB 2.x and JDO.
    The upshot of this from a developer’s perspective is that the API is considerably
    less intrusive than prior approaches. In the upcoming sections, we’ll see this
    characteristic on display quite a bit.


    # Object-Relational Mapping Concepts in JPA


    Within the JPA, the Java classes that correspond with database tables called entities.
    Here, the instance attributes of entity classes are mapped to table columns, as
    illustrated in Figure 6.9.'
