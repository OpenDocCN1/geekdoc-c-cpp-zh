  md: 'repository and manage repository resources, so if you wanted, you could develop
    the HTML5 content in Eclipse. Another option would be to use a command-line Git
    client to clone the repository and then develop the HTML5 content using a preferred
    editor tool, such as Adobe Dreamweaver, Mercury Editor, and so forth. The possibilities
