- pgno: 495
  md: '+   - If you''d like to perform OData API calls on behalf of the currently
    logged in user, then set the AUTHENTICATION field to OAuth2SAMLBEARER ASSERTION.
    This will open a number of additional fields. Alternatively, you could configure
