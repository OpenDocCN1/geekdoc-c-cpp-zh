    in further detail.


    # ## 8.2 Introduction to Java EE Security Concepts


    Even though most security concepts are universal in nature, the application of
    these concepts within a particular programming environment tends to vary quite
    a bit. Therefore, in this section, we’ll set the stage for some of the Java-based
    examples we’ll be developing later on in this chapter by examining the built-in
    features of the Java EE security model. As we progress through this chapter, you’ll
    find that these basic features provide a foundation upon which SAP has implemented
    some of the more advanced security-related functions of SAP HCP.


    # ## 8.2.1 Understanding the Java EE Security Model


    When considering Java EE security concepts, it’s important to recall that the
    Java EE specification was not designed with any particular application server
    in mind. In order to achieve this kind of portability, the writers of the Java
    EE specification defined a layer of abstraction that describes security implementation
    details in generic terms. Figure 8.1 highlights the basic elements that make up
    this abstract security model, and here you can identify the following:


    +   - Users


    Within the Java security model, users are referred to as user principals. According
    to the specification, user principals are identified by a unique principal name
    (i.e., user name) and can be authenticated using some form of authentication data.
    The specification has nothing to say about where these user principals are stored
    or how they’re maintained; these implementation details are left up to the server
    vendor(s).


    +   - Roles


    Depending on the context, the term role within the Java EE security model can
    take on several connotations. In general, roles are meant to model the business
    roles performed by users. For example, when creating a purchasing application,
    you might define a Buyer role, a PurchasingManager role, and so forth.


    From a technical perspective, roles group together a series of related authorizations
    within a Java (web) application. For instance, the Buyer role mentioned'
  merge: -1
  img_proc: true
- pgno: 327
  md: 'previously would likely provide authorizations for accessing a purchase order
    maintenance application and related functions. In essence, the role would contain
    all of the authorizations that users operating in that business role need to perform
    their job. Functionally, roles can be used to define coarse-grained authorizations,
    fine-grained authorizations, or both.


    At deployment time, users are mapped to specific roles using various features
    proprietary to a given Java server provider. Within SAP HCP, such assignments
    are normally defined within the SAP HCP Cockpit.


    +   Groups


    Groups are used to simplify role administration for various user groups. For example,
    if a company has a large purchasing group, then it''s possible that there might
    be many buyers. Therefore, rather than assigning the relevant buyer roles to each
    of those users, you can assign the roles to a Buyer group and then assign the
    users to that group. Not only does this save time up front, it also makes it easier
    to add or remove roles from that group of users down the road.


    ![](img/cf7012644082c115a2181376d9b7486d_327_0.png)


    Figure 8.1 Understanding the Java EE Security Model


    From a development perspective, you can utilize the elements of the Java EE security
    model in one of two ways:


    +   Declaratively


    If your security requirements are sufficiently coarse-grained, you can utilize
    the web.xml deployment descriptor of Java web applications to declaratively'
  merge: -1
  img_proc: true
