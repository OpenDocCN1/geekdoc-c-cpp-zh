  md: '# 3.5 Next Steps


    Hopefully, this brief introduction to Java application development helped you
    get a sense for how Java-based web applications are built on SAP HCP. Although
    we''ll be expanding on many of these concepts in subsequent chapters, our treatment
    will be much more focused on particular topics of interest (e.g., persistence
    or the consumption of cloud services). Therefore, if you''re new to Java or need
    further resources to help you get started, here are some recommended titles to
    take a look at:


    +   - Java introduction:

    +     - The Java Programming Language, 4th Edition (Arnold, Gosling, Holmes, Addison-Wesley,
    2005)

    +     - Thinking in Java, 4th Edition (Eckel, Prentice Hall, 2006)

    +   - Servlets and JSPs

    +     - Java Servlet Programming, 2nd Edition (Hunter, Crawford, O''Reilly, 2010)

    +     - JavaServer Pages, 3rd Edition (Bergsten, O''Reilly, 2009)

    +   - Enterprise JavaBeans

    +     - Enterprise JavaBeans 3.1 (Rubinger, Burke, O''Reilly, 2010)


    In addition to the standard Java SE and EE APIs, we''d also encourage you to explore
    the various open-source frameworks designed to simplify Java application development,
    such as Spring MVC. You can generally find excellent resources related to these
    frameworks online.


    Finally, another valuable resource to consider when approaching application development
    is the various sample applications included with the SAP HCP SDK. There, you will
    find many useful examples that can be used as a template for carrying out common
    development tasks.


    # 3.6 Summary


    In this chapter, you learned some of the basics of Java application development
    on SAP HCP. Collectively, the skills obtained in this chapter will serve as a
    foundation for approaching more advanced topics as we progress throughout the
    book. In general, we think you''ll find that all SAP HCP applications, regardless
    of'
