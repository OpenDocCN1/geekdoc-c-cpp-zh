    # ## 7.3 Advanced Concepts


    In Section 7.2, we showed you the basics of creating HTML5 applications within
    SAP HCP. Now that you’re armed with this basic knowledge, we’ll take a closer
    look at some advanced concepts that will help you round out your application designs.


    # ### 7.3.1 Working with the Application Descriptor


    Even though the HTML5 application model is primarily a client-side model, there
    are some server-side functions within the SAP HCP backend that you can leverage
    to influence the behavior of your applications. For example, in Section 7.3.3,
    you’ll see how to use the Connectivity Service to broker connections to REST-based
    services that are hosted externally or on-premise. Similarly, in Section 7.3.4,
    you’ll learn how to configure an HTML5 application’s security on the back-end.


    In order to configure these kinds of features, you must fill out the HTML5 application’s
    descriptor file. At runtime, the SAP HCP dispatcher service will use this descriptor
    file to determine when and where it should step in and influence the behavior
    of the application.


    According to the HTML5 application model, the application descriptor file must
    be called neo-app.json and it must be made available at the root of the application’s
    folder structure. As the .json file type suggests, the application descriptor
    content is specified using JSON notation.


    Listing 7.2 contains the default application descriptor file created via the project
    creation wizard we reviewed in Section 7.2.3. Here, you can see that the project
    wizard defined several attributes for the HTML5 application:


    +   - The welcomeFile attribute specifies the default HTML file to load whenever
    the application is loaded.'
  merge: -1
  img_proc: true
- pgno: 310
