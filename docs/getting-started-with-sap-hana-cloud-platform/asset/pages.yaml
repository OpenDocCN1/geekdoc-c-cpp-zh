- pgno: 441
  md: '# ## 10.4 Implementing a Simple SOAP-to-SOAP Scenario


    Back in Section 10.2, we discussed the different use cases for SAP HCI. As you’ll
    recall, one such use case was the ability to integrate a cloud application with
    an on-premise application. To understand this use case in a little more detail,
    consider an example where a cloud-based custom application needs to exchange data
    with an on-premise application, and both applications can be interfaced to and
    from using the SOAP adapter. In such a case, SAP HCI can be used as the ESB to
    perform integration using a simple SOAP-to-SOAP integration flow.


    The general steps in implementing such a SOAP-to-SOAP scenario are as follows:


    +   1. Create an initial integration flow.

    +   2. Configure the sender system, receiver system (name of the sender and receiver
    system; this is optional), and sender authorization (this is the public key pair).

    +   3. Import the WSDL file from the SAP PI repository or local file system.

    +   4. Create a parameters file that contains attributes and metadata that can
    be referenced from the communication channels.

    +   5. Create a mapping between sender and receiver systems, or import existing
    mapping objects from the SAP PI repository.

    +   6. Create sender and receiver communication channels.

    +   7. Deploy the integration project.

    +   8. Monitor the project to make sure everything is running smoothly.


    Each of these steps is discussed in more detail next.


    # ## 10.4.1 Creating an Integration Flow


    To create your initial integration flow, follow the steps below:


    +   1. Switch to the Integration Designer perspective by going to WINDOW • OPEN
    PERSPECTIVE. Choose OTHER and then INTEGRATION DESIGNER.

    +   2. Create an integration project by clicking on the PROJECT EXPLORER palette
    and selecting NEW • OTHER.

    +   3. Then, select INTEGRATION PROJECT from the SAP HANA CLOUD INTEGRATION folder
    (see Figure 10.6).'
  merge: -1
  img_proc: true
- pgno: 442
  md: '![](img/cf7012644082c115a2181376d9b7486d_442_0.png)


    Figure 10.6 Specify Details of the Integration Flow and Its Pattern Template


    +   4. Click on Next, and then name your integration flow.

    +   5. Proceed with the wizard, and provide details about the integration flow
    to be created. In addition to giving it a name, you will also need to specify
    a pattern to be used to create it. Each of the provided pattern templates contains
    an explanation of what it can be used for. For the sake of simplicity, choose
    Point-to-Point CHANNEL (see Figure 10.7).


    ![](img/cf7012644082c115a2181376d9b7486d_442_1.png)


    Figure 10.7 Specify Details of the Integration Flow and Its Pattern Template'
  merge: -1
  img_proc: true
- pgno: 443
  md: '**Note**

    You can define your own set of integration flow patterns; these are the so-called
    user-defined templates.


    6. Click on the Finish button to complete the initial creation steps.


    The resulting integration flow generated from the point-to-point channel template
    looks like the image shown in Figure 10.8.


    ![](img/cf7012644082c115a2181376d9b7486d_443_0.png)


    Figure 10.8 Basic Integration Flow from the Point-to-Point Channel Pattern Template


    Now it''s time to extend this empty integration flow and further configure it.


    # 10.4.2 Configuring Sender and Receiver Systems


    To properly configure the sender and receiver systems, follow the steps below:


    +   1. From the integration flow presented in Figure 10.8, click on the sender
    system (on the left side of the diagram), check the property area, and enter an
    appropriate name without whitespaces for your sender system.


    +   2. Under SENDER AUTHORIZATION, click on the Browse option to import your public
    SSL key (see Figure 10.9). Adding the SSL key is required for certificate-based
