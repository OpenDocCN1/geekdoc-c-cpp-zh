    hooks we need to invoke Console Client commands, for example.


    As you play around with Ant, you''ll find that it''s generally possible to define
    a basic template for the build.xml file that merely has to be tweaked a bit each
    time you reuse it (e.g., different project names, different archive files, etc.).
    Such a copy-and-paste approach might not be quite as convenient as Maven, but
    it sure beats having to rewrite the build script from scratch each time out.


    # Triggering Builds


    Much like we observed with Maven, Ant builds can be triggered from within the
    Eclipse IDE or via the command line. Within Eclipse, you can trigger a build by
    right-clicking on your build.xml file and selecting the Run As • Ant Build menu
    option. From the command line, you simply need to navigate to the directory where
    the build.xml file is contained and execute the ant command.


    # 4.5 Continuous Integration with Jenkins


    The next step in the evolution of software logistics is continuous integration
    (CI). As the name suggests, CI is about streamlining the integration process and
    avoiding the costly rework associated with integration conflicts. In effect, CI
    forces developers to address such conflicts up front so that integration problems
    get resolved well before they spiral out of control.


    In practice, CI is implemented using a tool that monitors the project''s source
    code repository (e.g., Git). Whenever changes are checked into the repository,
    the CI tool will react by automatically building and testing the application.
    If the build or test fails, then the associated developer(s) will be notified
    straightaway, and any integration conflicts that show up can be resolved in short
    order. Such instantaneous feedback ensures that the project doesn''t stray too
    far off course over time.


    In this section, we''ll take a brief look at how you can implement CI within the
    context of your SAP HCP application development using one of the more popular
    CI tools in the Java development space: Jenkins.'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# 4.5.1 Introducing Jenkins


    Jenkins (formerly known as Hudson) is an open-source CI tool written in Java.
    In addition to performing the core CI tasks described earlier in this section,
    Jenkins also comes equipped with many value-add features, including the following:


    +   Integration with many code quality analysis tools


    +   Extensive reporting capabilities that project managers can use to track the
    overall health of software projects


    +   Integration with test tools and the capacity for performing test coverage
    analysis


    +   A robust job scheduler tool


    +   External integration via REST APIs


    Plus, with its wide following in the software community, there''s a vast number
    of useful plug-ins to make it easy to connect with various SCM tools, build tools,
    and so on. You can find out more information about these features and others via
    the project website at http://jenkins-ci.org. Another useful resource here is
    Jenkins: The Definitive Guide (Smart, O''Reilly, 2011).


    # 4.5.2 Installing Jenkins on SAP HCP


    For the most part, Jenkins is very easy to install and configure. Indeed, if all
    you''re doing is performing a local installation, then you can download the appropriate
    installation package from the project website and be up and running in a matter
    of minutes. However, when it comes to installing Jenkins on SAP HCP, matters become
    slightly more complicated. This is because Jenkins is designed to store the various
    artifacts it creates at the file system level. Because we don''t have access to
    a file system from within SAP HCP, a workaround is required to allow Jenkins to
    operate smoothly on SAP HCP.


    Fortunately, SAP has provided just such a workaround and uploaded it to GitHub
    so that developers can create an SAP HCP-compatible Jenkins distribution. The
    solution effectively reroutes any file-based I/O to the Document Service that
    we''ll be covering in Chapter 6. You can find more information about this project
    online at https://github.com/SAP/cloud-jenkins. There, in addition to the project
    source code, you''ll also find a link to an excellent blog post on SCN written
    by the lead developer on the project (the great Mr. Stephan Weber).'
  merge: -1
  img_proc: true
- pgno: 166
