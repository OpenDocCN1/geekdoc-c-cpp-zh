    fields of custom business object instances. Similarly, SAP Business ByDesign based
    solutions allow for defining field constraints and dependencies. SAP HCP naturally
    offers packaging and import of such rules for the solutions for which this is
    supported.


    Using SAP Cloud Application Studio, developers are able to define association
    validation rules both during the creation and saving of data.


    # 11.3.6 Configurable UIs


    SuccessFactors in particular offers developers and administrators the ability
    to define configurable UIs so that you can specify which pages the object will
    be rendered in and in what form.


    Another example is SAP Jam, which offers the possibility to provide a manifest
    that specifies how the different entities in an external OData business object
    are to be rendered.


    # 11.3.7 Custom Code


    Practically the only SAP Cloud business solution that allows full-featured custom
    code execution on the application stack is SAP Business ByDesign. Development
    is done using SAP Cloud Application Studio in an SAP-specific scripting language,
    allowing you to implement custom add-ons.'
  merge: -1
  img_proc: true
- pgno: 481
  md: '# 11.3.8 Home Page Tile Configuration


    Most of the SAP Cloud solutions provide some flavor of a welcome page, rendering
    a number of different widgets. With the transition to SAP Fiori, most of those
    welcome pages will transition to SAP Fiori Launchpad over time. To check out the
    always up-to-date version of SAP Fiori, you can explore www.sap.com/fiori-demo
    at any time.


    SAP already allows extension application developers to define an embeddable HTML
    fragment, which can be registered as a custom widget in the corresponding SAP
    Cloud solution home page. There is one pitfall here, which we’ve looked at in
    Section 11.2.1: CORS. The problem lies in the fact that each of the SAP Cloud
    solutions is served out of its own domain, whereas SAP HCP applications reside
    on the hana.ondemand.com domain. Because most of the SAP Cloud solutions leverage
    CORS, this leads to the result that the straightforward approach to create a simple
    iFrame on a home page that embeds content from SAP HCP will be blocked by the
    majority of modern browsers. How do we proceed, then? We can solve this problem
    by employing IdP-initiated SAML login, in contrast to the widely used SP-initiated
    SAML flow.


    # SP-Initiated vs. IdP-Initiated SAML Login Flow


    Figure 8.12 in Chapter 8 illustrates the typical SAML SP-initiated authentication
    flow. In a nutshell, this means that when a client browser without a valid security
    session accesses a SAML-protected web resource, it’ll be redirected to the configured
    identity provider for authentication.


    There is also a less popular (but very useful) IdP-initiated SAML authentication
    flow. In this scenario, a client browser accesses the identity provider for authentication
    directly, passing over a specific mapping key. Once authenticated, IdP automatically
    forwards the browser along with a signed SAML response to the web resource corresponding
    to the specified key. The corresponding web application (in the cloud extension
    scenario, this is handled by SAP HCP) will validate the incoming SAML response
    and establish a security session as usual.


    When the SAP Cloud solution home page is rendered, the IdP URL is already known
    to the browser, because authentication took place there earlier on. Therefore,
    referring the extension application via IdP-mapped URLs eliminates the problem
    of CORS-enabled browsers blocking custom home page tile content.'
  merge: -1
  img_proc: true
- pgno: 482
  md: '# 11.3.9 Navigation Configuration


    It''s important for extension applications to be reachable for end users from
    within the extended SAP Cloud solution. In order to achieve that, a number of
    navigation plugs are available for registration. In SuccessFactors, this includes
    top-level page navigation, employee profile navigation menu, to-do list, and so
    on. It''s also possible to define a URL exit point from pretty much every configurable
    UI in the system. From an extension perspective, it''s important to automate that
    flow. Therefore, whenever an extension application is published, it will be plugged
    into all defined placeholders, thus effectively becoming accessible for end users.
    For the majority of SAP Cloud solutions, that integration is still ongoing and
    the configuration will have to be performed manually.


    # 11.4 Extending SuccessFactors with SAP HCP Applications


    SuccessFactors is the cloud HCM suite from SAP and is identified as a leader in
    18 out of 18 recent analyst reports in its respective HR areas. SuccessFactors
    allows companies to deploy the different modules at their own pace, because it
    has multiple possible starting points. With more than 28 million users in over
    177 countries, SuccessFactors provides a rich set of customization and configuration
    capabilities. The core SuccessFactors HCM module, Employee Central, is globalized
    to support legal compliance in over 71 countries and over 40 languages. SuccessFactors
    has over 1,000 certified implementation consultants globally.


    You can explore SuccessFactors Employee Central in more detail by reading SuccessFactors
    Employee Central: The Comprehensive Guide by Luke Marson, Murali Mazhavanchery,
    and Rebecca Murray (SAP PRESS, 2016).


    Regardless of the feature richness of a solution, there will always be special
    case scenarios or local market specific niches left open. Therefore, back in November
    2013 SAP kicked off the SAP HCP extensibility story at the annual SuccessConnect
    conference in Las Vegas by announcing the SAP HCP extension package for SuccessFactors.
    Since then, SAP HCP has gone a long way, integrating much deeper into the SuccessFactors
    stack and launching similar integration tracks with all other SAP Cloud solutions
    in parallel.


    In this section, we''ll explore how SAP HCP complements SuccessFactors, following
    all the basic principles defined in Section 11.3, including tooling and account'
  merge: -1
  img_proc: true
- pgno: 483
  md: 'configuration. Following the basic principles defined in the beginning of the
    chapter, there must be zero operational overhead for customers when running a
    partner extension as part of their SuccessFactors system. We''ll leave it up to
    you to judge that. We''ll point you to a practical example from SAP you can explore
    on your own, and we''ll also iterate over the APIs and possible integration points
    available for your extension application to leverage.


    # 11.4.1 SuccessFactors Administration Layers


    The first thing to keep in mind is that SuccessFactors has two separate layers
    of administration externally visible:


    +   SuccessFactors Provisioning is used for trained SuccessFactors implementation
    consultants and SuccessFactors professional services consultants.


    +   SuccessFactors OneAdmin is used by company account administrators and key
    users.


    There is a clear difference between these two roles, which we discuss next.


    # SuccessFactors Provisioning


    SuccessFactors Provisioning is the environment used to configure all the licensed
    features of the SuccessFactors product. This includes enabling the required modules,
    configuration, mapping the company business processes to workflows, enabling API
    access, adding new administration users, and so on. Regular recurring replication
    jobs are also configured and scheduled in Provisioning.


    The general trend is to grow the set of features exposed to key users and company
    administrators, enabling them to handle the company accounts they are responsible
    for. At the same time, critical operations will still remain in SuccessFactors
    Provisioning, where company admins have no access. If any configuration changes
    are required there, then such changes would be performed either by an implementation
    consultant or by SuccessFactors professional service teams.


    The point here is not that SAP does not want to provide access to customers. It''s
    about making sure that only people with the required qualifications, background,
    and skills will make low-level configuration changes to customer systems. That''s
    one approach to minimize the risk of destabilizing the account and the productive
    business processes there.'
  merge: -1
  img_proc: true
- pgno: 484
  md: 'At the end of every implementation project, a detailed handover document is
    completed, describing the intended business processes and flows. This is used
    subsequently as the basis for the SuccessFactors support team to determine whether
    a certain configuration of the account is working as intended or has to be corrected.
    Any subsequent change in provisioning environment is considered to be a bug fix
    or an enhancement.


    # SuccessFactors OneAdmin


    Company administrators and key users get access to the so-called OneAdmin tool,
    which is embedded in the SuccessFactors product experience. They are empowered
    to further configure all the installed SuccessFactors module specifics, such as
    onboarding flow, notification templates, 360 degree review campaigns, user permissions
    and roles, and MDF object definitions. System administrators also have the permissions
    required to evaluate and install extension applications. On the user experience
    side, they are responsible for managing the account branding and theme. One of
    the important roles of key users is to validate and experiment with new features
    that SuccessFactors publishes regularly, remaining actively aware of how to leverage
    the new functionality in their company''s productive account.


    Company administrators also have direct access to the embedded SAP HANA Marketplace
    view, which enables them to install trial versions of extension applications.
    Installing a trial application will automatically initialize the required SAP
    HCP infrastructure underneath.


    # 11.4.2 Account Onboarding


    An SAP HCP extension package is implemented and integrates with SuccessFactors
    like any of the different modules, such as SAP Jam, Learning, or Analytics. It
    must be enabled via the SuccessFactors Provisioning administration environment.
    If you are an end customer, you probably don''t have access to that environment,
    but either the SuccessFactors implementation partner you''re working with or your
    SAP Professional Services consultants will be able to assist you.


    Once in SuccessFactors Provisioning, select your respective company from the list
    of Companies. On the next screen, in the Edit Your Company Settings section, choose
    the EXTENSION MANAGEMENT option. If extension management has not yet been enabled
    for your SuccessFactors company, then you''ll see the screen shown in Figure 11.6.'
  merge: -1
  img_proc: true
- pgno: 485
  md: '![](img/cf7012644082c115a2181376d9b7486d_485_0.png)


