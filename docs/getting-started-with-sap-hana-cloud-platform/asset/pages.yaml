  md: 'For the most part, this is pretty much all there is to JPA development using
    CMP. Because the EJB container takes care of data source and transaction provisioning,
    you can simply use the API methods of the javax.persistence.EntityManager interface
    to perform CRUD operations and not concern yourself with low-level details, such
    as record locking and so on. Of course, if you ever have a need to take control
    over such details, then there is an alternative to CMP: application-managed persistence
    (AMP).


    With AMP, you are responsible for obtaining a data source reference, binding it
    with an entity manager, and managing transactions. Why would you want to do this?
    One of the most common reasons developers choose to go with AMP is because their
    SAP HCP Application Runtime Container is based on the Java Web profile and they
    don''t have access to an EJB container. In this scenario, the model layer for
    a Servlet/JSP application is based solely on POJOs, and AMP is the only game in
    town. If you find yourself in this boat, then you can find detailed step-by-step
    instructions for implementing AMP in the online help documentation, underneath
    the section entitled “Using Application-Managed Persistence.”


