    # 8.4.2 Working with the User Management API


    By default, the Java Servlet API provides two methods that you can use to determine
    the name of the user logged onto the application. Both of these methods are contained
    within the javax.servlet.http.HttpServletRequest interface, and they are called
    getRemoteUser() and getUserPrincipal().


    Although it’s useful to be able to determine the user name of a logged-on user,
    there are typically other things that you’d also like to know about the user,
    including the following:


    +   - Basic attributes of the user, such as the user’s first and last name, email
    address, and so on

    +   - The user’s locale and preferences (e.g., country of origin, language spoken,
    etc.)

    +   - The set of all roles and groups the user is assigned to

    +   - The validity date of the user (if applicable)


    Although the availability of much of this data is dependent on the capabilities
    of the underlying IdP, you can get your hands on the data that is available by
    using the SAP HCP User Management API contained within the com.sap.security.um.*
    package hierarchy.


    > Note

    > You can find a complete overview of the API functions available in the User
