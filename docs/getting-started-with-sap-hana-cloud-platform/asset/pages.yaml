    \ the ORM of Entities\n\nWhen it comes to creating entities within the JPA, pretty\
    \ much any Java class (or Plain Old Java Object [POJO]) can be used. This is to\
    \ say that you don’t have to inherit from an API-specific class or even implement\
    \ an interface with lots of callback methods you rarely use. With the JPA, you\
    \ need only inject the class with the javax.persistence.Entity annotation, as\
    \ demonstrated in Listing 6.1.\n\n```\nimport javax.persistence.Entity; @Entity\n\
    ```\n\n```\npublic class Incident {\n private String title;\n ...\n }\n```\n\n\
    Listing 6.1 Defining an Entity Using JPA\n\nOnce your entity classes are defined\
    \ (or identified in the case of preexisting classes), the next step is to map\
    \ them to relational database tables. For this task, you generally have one of\
    \ two options. You can describe attribute-to-column mappings using annotations,\
    \ or you can specify the mapping outside the code using XML deployment descriptors.\
    \ Both approaches get you to the same place, so which method you choose is largely\
    \ a matter of preference. For the purposes of this book, though, our focus will\
    \ be on the annotation-based approach, as it’s by far the most popular within\
    \ the community."
