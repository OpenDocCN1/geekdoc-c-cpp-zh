- pgno: 40
  md: 'In this chapter, we''ll take a look at what it takes to get up and running
    with SAP HCP application development. By the end of this chapter, you''ll have
    everything you need to begin developing live applications on the platform.


    # 2 Getting Up and Running


    Now that you have a feel for what SAP HCP is from a conceptual perspective, you''re
    probably itching to take it for a test drive and see what it can do. We''ll have
    a chance to do just that in Chapter 3. However, in the meantime, there are several
    administrative items that we need to sort out.


    First of all, in order to do any real work on SAP HCP, we need to get our hands
    on an SAP HCP developer account. This account will be used to log onto the platform,
    allocate and assign resources, deploy applications, and more. We''ll explore the
    account provisioning process in Section 2.1. In Section 2.2, we''ll take a quick
    inventory of what''s included in an SAP HCP account. Finally, in Section 2.3,
    we''ll show you how to set up SAP HCP development tools on your local machine.
    With these tools in place, you''ll be ready to hit the ground running in Chapter
    3 when we start getting our hands dirty with application development.


    # 2.1 Obtaining an SAP HCP Account


    In order to access SAP HCP, we must apply for an account with SAP. In this section,
    we''ll take a look at the various account types offered by SAP and see how they
    differ from one another. We''ll also show you how to set up a free developer account
    that you can use to take SAP HCP for a test drive.


    # 2.1.1 Understanding the SAP HCP Account Concept


    In many ways, SAP HCP accounts are not unlike the accounts you set up with utility
    companies, such as your local electricity or Internet service provider. If you'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'have ever had the pleasure of setting up one of these accounts, then you’re
    no doubt familiar with the basic procedure:


    +   1. First, you choose among the various account types and/or service plans
    offered by the service provider.

    +   2. Then, you enter into some form of contract agreement whereby you as the
    customer agree to pay a certain fee, and the provider agrees to provide the requested
    services according to the service level agreements (SLAs) set forth in the contract.


    In the context of SAP HCP, accounts are used to determine the scope of resources/services
    a customer wishes to procure from SAP. Once a customer registers for an account,
    the account becomes the key to accessing the platform, deploying applications,
    and much more.


    At the time of this writing, SAP offers three different account types: developer,
    customer, and partner. These account types differ in terms of pricing model, the
    amount of cloud-based resources allocated, and usage conditions. Let’s take a
    look at each of the available account types in detail.


    # Developer Accounts


    The first account type that we’ll take a look at is the free developer account.
    This account type is provided for developers who wish to explore SAP HCP and see
    what it has to offer. Unlike other SAP trial accounts that you may have worked
    with in the past, the SAP HCP developer account never expires, so you can continue
    to use it as a trial or sandbox account indefinitely.


    For the most part, developer accounts provide access to the majority of features
    and services provided by SAP HCP. However, because this is a free account, SAP
    does limit the amount of resources you can consume using this account. In particular,
    as of the time of writing, developer accounts come with the following limitations:


    +   - You can only run a limited number of applications at a time.

    +   - Only 1 GB of database storage and 1 GB of document storage is provided.

    +   - Only one user can exist per account.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# Customer Accounts


    As the name suggests, customer accounts are accounts that customers purchase from
    SAP in order to host productive applications in the cloud. Unlike the more limited
    developer accounts, customer accounts offer full access to SAP HCP productive
    services as well as 24-7 support from SAP.


    In order to support a wide range of customer types, SAP offers a multitude of
    configuration options, which allow customers to choose the configuration that
    best meets their needs. You can obtain a pricing sheet and browse through the
    various configuration options by logging onto the SAP HANA Marketplace at http://marketplace.saphana.com/New-SAP-HANA-App-Services/p/1808.
    In most cases, you can choose the target configuration and purchase the customer
    account right from within the SAP HANA Marketplace. After the initial purchase,
    customers have the option over time to purchase more resources from SAP as the
    need arises.


    > **Tip**

    > To ensure fast response times for productive applications, customer accounts
    are hosted in regional data centers that are in close proximity to the target
    user base. At the time of this writing, SAP has three data centers, covering the
    Americas, Europe, and Asia Pacific regions.


    # Partner Accounts


    This account type is provided for SAP partners who are interested in building
    cloud-based applications and selling them to customers. Access wise, partner accounts
    are similar to customer accounts in that they have access to the full set of SAP
    HCP productive services. However, because these types of accounts are normally
    used for development and prototyping, the amount of allocated resources tends
    to be less than for your average customer account. That being said, SAP will allow
    partners to purchase more resources as needed.


    For more information about this account type and the SAP PartnerEdge program,
    log on to https://www.sapappsdevelopmentpartnercenter.com.'
  merge: -1
  img_proc: true
