- pgno: 491
  md: 'Some of the listed solutions will allow free trial installation, thus giving
    SuccessFactors customers an opportunity to evaluate them prior to making purchasing
    decisions. The follow-up actual contract for a partner extension will typically
    go through the regular direct sales channels.


    Installing a trial extension application will automatically enable the underlying
    SAP HCP extension package. However, the difference from the approach outlined
    in Section 11.4.2 is that the SAP HCP account will be completely hidden; no customer
    users will have access to it. It''ll be managed automatically by SAP HCP.


    After a short installation cycle (or going through the procedure described in
    Section 11.4.2), you''ll notice a visible difference in the embedded extension
    administration capabilities. It still contains the embedded extensions marketplace,
    but it''s just one tab in the much more elaborate Extensions Management plug-in,
    which is now fully functional for this SuccessFactors account.


    ![](img/cf7012644082c115a2181376d9b7486d_491_0.png)


    Figure 11.13 SuccessFactors Extensions Management Plug-In in Admin Tools'
  merge: -1
  img_proc: true
- pgno: 492
  md: 'The tool has several tabs (as illustrated in Figure 11.13):


    +   **EXTENSIONS**

    +   Management of extension applications, covering both SAP HCP and MDF artifacts.


    +   **MARKETPLACE**

    +   The familiar embedded marketplace, filtering extension applications depending
    on the modules installed in your SuccessFactors account. For example, if you don''t
    have SuccessFactors Learning enabled, then you will not see any extension applications
    that depend on the Learning module.


    +   **CONTENT**

    +   Shows a list of reusable OpenSocial widgets that can be combined in different
    screens to create new mashup pages.


    +   **ANALYTICS**

    +   Provides an overview of how many clicks were made to each extension application.
    This view enables company administrators to analyze the penetration and the load
    for each of the installed or enabled extension applications.


    +   **DOCUMENTS**

    +   In many cases, it''s required to put one document or a larger attachment on
    a page and perform a rollout. SAP HCP extension accounts come prebundled with
    a certain amount of unstructured storage, which you can use to store and serve
    documents.


    # 11.4.5 SuccessFactors APIs


    Over the last few years, the SuccessFactors team has put a lot of effort into
    documenting and releasing OData APIs, in order to OData-enable SuccessFactors
    by 2016, which will certainly open up a number of opportunities for partners and
    custom development projects. All released APIs are classified either for extension
    or integration usage.


    You can find the currently released API definitions in the API INFORMATION section
    of the SuccessFactors HCM Suite page on the SAP Help Portal (at http://help.sap.com/cloud4hr).
    Here, you will find API documentation for the OData- and SOAP-based SuccessFactors
    APIs, SuccessFactors Learning API, and SuccessFactors Onboarding API.'
  merge: -1
  img_proc: true
- pgno: 493
  md: 'The detailed development guide and the ODATA API for SAP Jam are also on the
    SAP Help Portal, in the elaborate DEVELOPER INFORMATION section on the SAP JAM
    page at http://help.sap.com/sapjam.


    By definition, any available SuccessFactors ODATA API on the SAP Help Portal can
    be used to build interactive extensions. In the publicly available SuccessFactors
    API roadmap, one section is dedicated to API classification, outlining which APIs
    are intended for interactive end user extensions and which are targeted at integration
    or replication scenarios. Please take the time to get familiar with that prior
    to planning your next SuccessFactors extension project.


    The next reasonable question is this: How do you create an OAuth API Client in
    SuccessFactors so that it''s consumable from SAP HCP? Simply follow these steps:


    +   1. From SuccessFactors ADMIN TOOLS, choose COMPANY SETTINGS and then MANAGE
    OAUTH2 CLIENT APPLICATIONS.


    +   2. Click on the REGISTER CLIENT APPLICATION link.


    +   3. In the newly opened view (Figure 11.14), fill in the following fields:

    +   > The Company field is read-only (for a good reason).

    +   > The APPLICATION NAME is the display name for your OAuth 2.0 API Client.
    It has no functional impact.

    +   > Description is optional.

    +   > The APPLICATION URL should contain an arbitrary URL; you can use the application
    login URL.

    +   > X.509 CERTIFICATE is a critical field! You have to paste in the SAML SP
    signing certificate, visible in the HCP Cockpit Trust tab (refer back to Figure
    11.9).

    +   > Once you are ready, click on the REGISTER button.


    +   4. What you''ll see is that your newly created OAuth 2.0 API client is visible
    in the list. Click on the VIEW link next to it.


    +   5. From the next screen, copy the value of the API Key field.


    +   6. The process continues in the SAP HCP Cockpit, where you will create a destination
    providing API access to SuccessFactors.'
  merge: -1
  img_proc: true
- pgno: 494
