- pgno: 285
  md: '# Creating and Removing Content within a Repository


    Whenever a repository is initially created, it comes preassigned with a root-level
    folder. From this root-level folder, you can branch out by defining subfolders
    and filling them with documents. These operations are carried out using methods
    provided by the org.apache.chemistry.opencmis.client.api.Folder interface.


    Listing 6.21 demonstrates how you can use the createFolder() method to create
    a new subfolder underneath the root folder called MyFolder. As you can see, the
    details of the folder itself are captured within a java.util.Map object that maps
    a series of property names to unique property values. Conceptually, you can think
    of these properties as tags that are assigned to the folder as it is stored within
    the repository. These same tags can be used in queries to locate specific pieces
    of content and so on.


    ```

    Session session = getCmisSession();

    Folder rootFolder = session.getRootFolder();


    Map<String, String> folderProps =

    new HashMap<String, String>();

    folderProps.put(PropertyIds.OBJECT_TYPE_ID, "cmis:folder");

    folderProps.put(PropertyIds.NAME, "MyFolder");


    Folder folder = rootFolder.createFolder(folderProps);

    ```


    Listing 6.21 Creating a Folder within a CMIS Repository


    To create new files, use the createDocument() method of the Folder interface.
    This overloaded method defines three main parameters:


    +   - Much like the createFolder() method, you must pass a java.util.Map collection
    object to define the file''s properties.

    +   - The content of the file being created is passed in the form of an org.apache.chemistry.opencmis.commons.data.ContentStream
    object. This object surrounds a java.io.InputStream with additional file metadata,
    such as the file name, MIME type, and byte count.

    +   - Because documents can exist in versions, you must specify the versioning
    state of the document at the outset. If desired, you also have the option of turning
    off versioning for the file.


    Once the repository is filled with documents and folders, you can use the methods
    of the org.apache.chemistry.opencmis.client.api.Session interface to'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'traverse through the repository and search for content. Here, if you happen
    to know the ID of the object you''re looking for, you can use the getObject()
    method to fetch the object directly. Otherwise, you can search for the content
    in one of two ways:


    +   You can use the Session interface''s query() method to search for the content
    using a SQL-like query language called CMISQL. This query language allows you
    to search for documents based on their assigned properties (e.g., cmis:name, cmis:createdBy,
    etc).


    +   If you don''t know exactly what you''re looking for, then you can recursively
    search through the folder structure using the Folder interface''s getChildren()
    method.


    Regardless of how you get our hands on the content, you can then manipulate it
    using methods provided by the Folder and Document interfaces. Within these interfaces,
    you''ll find a number of overloaded methods that make it easy to update and remove
    content, create copies of files, work with version control, and more.


    For more information about the kinds of operations that can be performed, we would
    highly recommend that you read through the help documentation provided online
    at http://chemistry.apache.org. Suffice to say that there''s functionality here
    to perform just about any content management operation imaginable.


    # 6.4.3 Consuming the Document Service Externally


    Most of the time, the content stored within the Document Service is intended to
    be consumed directly by SAP HCP applications. However, that being said, there
    could be times when this content needs to be consumed externally. For example,
    it could be that you need to implement some form of content syndication between
    a cloud-based repository and a repository hosted on-premise, or, if you''re building
    standalone HTML5 applications (which we''ll cover in Chapter 7), then you might
    want to proxy document access to those applications.


    Although you could build your own application to expose this content externally,
    it turns out that SAP has already provided a (mostly) fully functional Servlet
    class in the SAP HCP SDK for this purpose. The name of this class is com.sap.ecm.api.AbstractCmisProxyServlet.
    As the name suggests, this class provides a proxy (or bridge) between the CMIS
    provider (i.e., the Document Service) and CMIS'
  merge: -1
  img_proc: true
- pgno: 287
  md: 'clients. With this functionality in place, you can hook on popular tools such
    as the Apache Chemistry Workbench to remote repositories and consume the content
    as needed.


    If you want, you can test this functionality out using the com.sappress.hcp-book.chp06.document.CMISProxyServlet
    class bundled with the incident management application. You can download the Apache
    Chemistry Workbench from the Apache Chemistry development tools page at http://chemistry.apache.org/java/developing/tools/dev-tools-workbench.html.


    # 6.5 Summary


    In this chapter, you were able to get your hands dirty with several core services
    provided as part of SAP HCP. These services go a long way towards rounding out
    Java application designs by providing developers with the tools they need to persist
    data and connect to external services within a cloud-based environment. Without
    these services, these tasks would be considerably more complicated and perhaps
    even out of reach for less experienced developers.


    In the next chapter, we''ll take a look at a fairly new application model that''s
    been added to SAP HCP: the HTML5 application model. Here, you''ll find that SAP
    HCP makes it easy to create lightweight HTML5 applications without having to deploy
    the HTML5 content through a server-side model, such as Java or SAP HANA XS.'
  merge: -1
  img_proc: true
- pgno: 288
  md: 'This chapter introduces a relatively new addition to the list of programming
    models supported by SAP HCP: the HTML5 application model. As we’ll learn, this
    application model makes it easy to rapidly develop and deploy lightweight HTML5
    applications.


    # # 7 Developing HTML5 Applications


    In the previous chapters, you learned how to create web applications using server-side
    programming models, such as the Java and native SAP HANA programming models. You
    explored various ways of exposing and/or generating HTML content and linking it
    with custom server-side components to create complex application scenarios.


    Although it’s nice to know that you have a complete portfolio of server-side components
    and services at your disposal whenever you need them, there are times when a more
    lightweight application model will suffice. For example, if the application you’re
    building is merely a consumer of one or more REST-based services, then you can
    probably get away with building the application exclusively using client-side
    HTML5 content. This is where the SAP HCP HTML5 application model comes into play.


    In this chapter, we’ll introduce you to the HTML5 application model and show you
    how it can be used to develop lightweight web applications. Along the way, we’ll
    also introduce you to the SAP Web IDE which, as the name suggests, is a web-based
    development environment that’s optimized for the development of HTML5/SAPUI5-based
    applications.


    # ## 7.1 Overview


    As we noted already, the HTML5 application model is a lightweight model that allows
    developers to build HTML5-based applications. These applications consist solely
    of client-side HTML5-based resources, such as HTML, JavaScript, and CSS'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'source files. At runtime, this static content is served up to users via a shared
    dispatcher service that''s built into SAP HCP.


    The block diagram contained in Figure 7.1 highlights the primary elements that
    make up the HTML5 application model. To understand how these elements interact
    with one another, we must explore the application model from both design time
    and runtime perspectives:


    # Design time


    At design time, developers create and manage HTML5 applications using SAP HCP
    Cockpit. Whenever a new HTML5 application is created, an application-specific
    Git repository is created behind the scenes. Developers use this repository to
    upload and maintain the HTML5 application''s resource files.


    # Runtime


    At runtime, clients access the HTML5 applications through the aforementioned dispatcher
    service. This service fetches the HTML5 application content from the corresponding
    Git repository and sends it back to the client. If the application relies on data
    from REST-based services, then these calls are also brokered through the dispatcher
    service. You can utilize the Connectivity Service to broker access to REST-based
    services hosted externally or on-premise.


    ![](img/cf7012644082c115a2181376d9b7486d_289_0.png)


    Figure 7.1 Understanding the HTML5 Application Model


    If all this seems relatively straightforward, that''s because it is. Indeed, aside
    from a few logistical items that we''ll be addressing shortly, HTML5 application'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'development consists of little more than uploading some HTML5 resource files
    to Git repositories hosted on SAP HCP. SAP purposefully gets out of the way, allowing
    developers to create the HTML5 content in whatever way they see fit and using
    the editor or IDE tool of their choice. In the next section, we''ll see how all
    this works in practice.


    # ## 7.2 Getting Started


    Now that you have a general sense for how HTML5 applications work, we''re ready
    to turn our attention towards more practical matters and see what it takes to
    create and deploy a brand-new HTML5 application. In the sections that follow,
    we''ll walk you through this process step-by-step.


    # ### 7.2.1 Defining a New HTML5 Application


    As we noted in Section 7.1, HTML5 applications are managed within the SAP HCP
    Cockpit. To access the management console, click on the HTML5 APPLICATIONS tab
    from the main landing page. This will open a panel containing a table of HTML5
    applications defined within your account. As you can see in Figure 7.2, controls
    are provided within this table to drill into application definitions and also
    start, stop, or delete applications as needed.


    ![](img/cf7012644082c115a2181376d9b7486d_290_0.png)


    Figure 7.2 Managing HTML5 Applications in the SAP HCP Cockpit'
