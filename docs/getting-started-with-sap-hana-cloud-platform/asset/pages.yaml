    # 3.4 Debugging and Tuning Java Applications


    For simple demonstration apps like the ones we’ve created throughout the course
    of this chapter, there’s usually not too much that can go wrong. However, as you
    begin to develop larger, production-quality applications, you will no doubt encounter
    situations in which it’s difficult to pinpoint locations in the code that are
    causing application errors, poor performance, or both. With that in mind, in this
    section we’ll cover a couple of tools that you can use to perform some root-cause
    analysis of your code.'
