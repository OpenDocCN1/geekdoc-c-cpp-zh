  md: '# 8.3.1 Configuring Authentication


    According to the Java EE platform specification, all compliant Java web containers
    must provide some level of built-in support for authentication. Indeed, at a minimum,
    a server provider must include support for three authentication methods: HTTP
    basic authentication, HTTPS client authentication (i.e., client certificates),
    and form-based authentication. In the case of SAP HCP, there are quite a few other
    authentication methods in play as well.


    For the most part, developers can tap into these built-in authentication methods
    by specifying the desired method within the web.xml deployment descriptor. This
    is achieved using the `<login-config>` element, as shown in Listing 8.1.


    ```

    <web-app>

    ...

    <login-config>

    <auth-method>FORM/<auth-method>

    </login-config>

    ...

    </web-app>

    ```


    Listing 8.1 Configuring the Authentication Method for a Java Web Application


    In the web.xml excerpt contained in Listing 8.1, you can see how we’ve turned
    on form-based authentication within a web application. At runtime, this setting
    is processed as follows:


    +   If a user needs to authenticate for some reason (e.g., if the user tries to
    access a secure resource), then the form-based authentication method will be used.


    +   By default, the form that users use to authenticate is the default logon form
    provided by the SAP ID Service (Figure 8.3). You’ll learn more about the positioning
    of the SAP ID Service in Section 8.5.


    +   If the user successfully authenticates, then details about the authenticated
    user will be stored in the Servlet request context.


    In addition to the (default) form-based authentication method, SAP HCP also supports
    a number of other authorization methods. Table 8.1 contains a comprehensive list
    of the authentication methods supported by SAP HCP as of the time of writing.
    To incorporate a particular authentication method into your own Java web application(s),
    you simply plug in the appropriate authentication method name into the `<auth-method>`
    tag, as demonstrated in Listing 8.1. Of course, depending on the authentication
    method you choose, there may be additional'
