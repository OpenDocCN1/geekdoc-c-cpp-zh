- pgno: 3
  md: '# Dear Reader,


    If you’ve ever bought a programming book from SAP PRESS before, my guess is that
    you’re already familiar with the work of James Wood. Well, it’s my pleasure to
    welcome you to his latest endeavor: Getting Started with SAP HANA Cloud Platform.
    It’s rare to find an author who is thoroughly talented, always professional, and
    never misses a deadline—but James is all of these things. (He also, for the record,
    makes a mean bowl of Texas chili.) I consider myself very lucky to be his editor.


    Of course, with apologies to John Donne, no book is an island. And this one wouldn’t
    have happened without the help of several collaborators, especially Matthias Steiner,
    champion of SAP HANA Cloud Platform and, well, champion in general. My thanks
    and gratitude are due to all involved.


    But enough with the thanking, right? It’s time for you to dive in. And when you’re
    done, let us know what you thought about Getting Started with SAP HANA Cloud Platform.
    After all, your comments and suggestions are the most useful tools to help us
    make our books the best they can be! We encourage you to visit our website at
    www.sap-press.com and share your feedback.


    Thank you for purchasing a book from SAP PRESS!


    Kelly Grace Weaver


    Editor, SAP PRESS


    Rheinwerk Publishing


    Boston, MA


    kellyw@rheinwerk-publishing.com


    www.sap-press.com'
