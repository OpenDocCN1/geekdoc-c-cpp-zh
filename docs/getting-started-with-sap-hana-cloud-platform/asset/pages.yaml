- pgno: 488
  md: 'When deploying additional applications, you''ll inevitably reach the configured
    resource quotas for your account. In order to increase those, you have to either
    purchase additional SAP HCP resources or (if this was already done) assign additional
    resources to the newly created extension account out of your central SAP HCP resource
    pool.


    # 11.4.3 Deploying Your First SuccessFactors Extension


    In order to explore what''s possible, the best way to move forward is to look
    at a particular example and try to derive conclusions. For that purpose, SAP has
    published an official SuccessFactors extension sample application, available under
    the Apache 2.0 license on GitHub at http://github.com/SAP/cloud-sf5-benefits-ext.
    The scenario it covers is called Corporate Benefits. The purpose of the Corporate
    Benefits sample application is to offer non-monetary perks to employees while
    at the same time having a simple process for both employees and the responsible
    HR managers.


    There are two roles in this application: Employee and HR Manager. The Employee
    role is practically everyone with a valid user ID in the underlying SuccessFactors
    system. This means that we''re not going to allow non-authenticated users in the
    application. The HR Manager role is well defined in SuccessFactors and is simply
    reused by the application, adding additional responsibilities to it.


    Employees are granted a monthly budget of an abstract “currency” called benefit
    points. These points are used to indicate the value of a large variety of nonmonetary
    benefits—for example, soccer game tickets, restaurant/fitness studio vouchers,
    and so on.


    Each selection period is called a campaign and has defined start and end dates.
    Campaigns also have a particular amount of benefit points granted for each employee.
    As Employee, you can change your benefits selection for each of the active campaigns
    and view the history of your orders in previous campaigns. In addition, you can
    browse the benefits catalog and check what the available benefits per campaign
    are. As HR Manager, you can manage the campaigns: their start date, duration,
    and so on. You can also manage the benefits of an employee on his or her behalf.'
  merge: -1
  img_proc: true
- pgno: 489
  md: 'The same application is used as a main exercise in the openSAP course for building
    SAP product extensions with SAP HCP. The course is available for free for self-study
    at http://open.sap.com/courses/hanacloud3.


    In order to deploy the application, you''ll have to go through the following steps:


    +   1. Clone the application''s Git repository.

    +   2. Import the sources as a Maven project in Eclipse. Make sure that your proxy
    settings in the Maven settings.xml file are properly configured.

    +   3. Build the project in Eclipse.

    +   4. Deploy the application to SAP HCP.

    +   5. Depending on whether you have a SuccessFactors system to experiment with,
    you have two different options to continue:

    +      > Assuming that you already have a SuccessFactors system at hand, then
    you''ll proceed directly with the steps defined in Section 11.4.2.

    +      > If you don''t have access to a commercial SuccessFactors account, then
    you can follow the application readme and leverage the public read-only SuccessFactors
    API that the SAP HCP team has set live for developers to experiment with.


    You can deploy the application using the SAP HCP command-line tool, SAP HCP Tools
    for Eclipse, or directly from the SAP HCP Cockpit.


    # 11.4.4 SuccessFactors Extension Administration


    When you log in to your SuccessFactors account as a system administrator after
    successful enablement of the SAP HCP extension package, you''ll notice some changes.


    All SuccessFactors accounts provide out-of-the-box access to an embedded extensions
    marketplace used to feature extension applications provided by SAP and SAP partners.
    This marketplace is accessible in Admin Tools under COMPANY SETTINGS and then
    EXTENSIONS, as shown in Figure 11.11.


    For SuccessFactors companies for which the SAP HCP extension package is not enabled,
    the link will open the marketplace directly, as shown in Figure 11.12.'
  merge: -1
  img_proc: true
