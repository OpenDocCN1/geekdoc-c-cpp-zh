  md: 'Once the group assignments are in place, the next step is to navigate over
    to the top-level Trust tab of the SAP HCP Cockpit and configure assertion-based
    attribute mappings for your local IdP configuration. These mappings basically
    map assertion attributes coming back from the local IdP in a SAML response to
    attributes of the user principal object that you have access to via the User Management
    API (refer back to Section 8.4.2).


    To create these mappings, you need to open the trust configuration for your local
    IdP and select the Attributes subtab screen (Figure 8.25). From here, you can
    create assertion-based attributes by clicking on the Add Assertion-Based Attribute
    link shown in Figure 8.25. Note that although the name of the Assertion Attribute
    must align with the attributes defined in the IdP, you''re generally free to call
    the corresponding Principal Attribute whatever you like. From a developer perspective,
    you just need to remember the names you choose, because these names will be what
    you use to access the attributes programmatically using the User Management API
    (refer back to Listing 8.5 for a refresher on how this works).


    ![](img/cf7012644082c115a2181376d9b7486d_360_0.png)


    Figure 8.25 Mapping Assertion Attributes to User Principal Attributes


    Finally, once the assertion-based attributes are in place, you can proceed with
    your group mappings by navigating over to the Groups tab. Here, you can define
