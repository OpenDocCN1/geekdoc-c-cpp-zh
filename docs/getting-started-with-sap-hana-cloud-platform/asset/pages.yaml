  md: '# # Service Pages


    The following sections contain notes on how you can contact us.


    # ## Praise and Criticism


    We hope that you enjoyed reading this book. If it met your expectations, please
    do recommend it. If you think there is room for improvement, please get in touch
    with the editor of the book: kellyw@rheinwerk-publishing.com. We welcome every
    suggestion for improvement, but, of course, also any praise!


    You can also share your reading experience via Twitter, Facebook, or email.


    # ## Supplements


    Supplements (sample code, exercise materials, lists, and so on) are provided in
    your online library and on the web catalog page for this book. You can directly
    navigate to this page using the following link: http://www.sap-press.com/3638.
    Should we learn about typos that alter the meaning or content errors, we will
    provide a list with corrections there, too.


    # ## Technical Issues


    If you experience technical issues with your e-book or e-book account at SAP PRESS,
    please feel free to contact our reader service: support@rheinwerk-publishing.com.


    # ## About Us and Our Program


    The website http://www.sap-press.com provides detailed and first-hand information
    on our current publishing program. Here, you can also easily order all of our
    books and e-books. Information on Rheinwerk Publishing Inc. and additional contact
    options can also be found at http://www.sap-press.com.'
