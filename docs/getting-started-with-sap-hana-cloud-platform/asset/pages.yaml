- pgno: 102
  md: 'SAP HCP instance) and pinpoint performance bottlenecks. In this section, we’ll
    observe how the SAP JVM Profiler can be used to identify segments of code that
    consume inordinate amounts of memory, I/O resources, and so on.


    # Prerequisites for Using the SAP JVM Profiler


    As the name suggests, the SAP JVM Profiler is built on top of SAP’s proprietary
    version of the JVM, called SAP JVM. Here, SAP went above and beyond the requirements
    of the default JVM specification to include first-class support for collecting
    performance traces from a running JVM instance.


    Although SAP JVM is used by default in cloud-based SAP HCP instances, it’s technically
    possible to run the SAP HCP local runtime using any compliant JVM implementation.
    However, if you plan on running the SAP JVM Profiler on your local SAP HCP instance,
    then you must configure that instance to utilize the SAP JVM. For this reason
