    # 4.3.4 Cloning a Git Repository in Eclipse


    Once our Git repository is established, the next step is to create a copy of the
    repository on our local machine. In Git terminology, this process is achieved
    by cloning the repository. As the term suggests, this operation creates a complete
    snapshot of the target repository, copying the latest and greatest version of
    all source code artifacts as well as all previous versions all in one fell swoop.
    With all this information in context, we have everything we need to unplug ourselves
    from the remote repository and work independently on project development tasks.


    In order to clone our sample repository within Eclipse, we first need to enable
    the Git Repositories view (Figure 4-32). This can be achieved by opening up the
    Window • Show View • Other... menu option, expanding the Git folder, and choosing
    the Git Repositories view. While we’re at it, it’s also a good idea to enable
    the Git Staging view, because we’ll be spending quite a bit of time there as well.'
