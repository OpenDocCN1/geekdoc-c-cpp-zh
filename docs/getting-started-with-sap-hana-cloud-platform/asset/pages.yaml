    be on access from within the Eclipse IDE using the EGit repository provider. If
    you followed along with the Eclipse installation steps described in Chapter 2,
    then EGit should be installed already. If you’re unsure about this, you can verify
    the installation by opening the HELP • ABOUT ECLIPSE menu option and looking for
    the Eclipse EGit feature (see Figure 4.25). If EGit isn’t installed, then you
    can quickly install it by opening the HELP • INSTALL NEW SOFTWARE... menu option'
