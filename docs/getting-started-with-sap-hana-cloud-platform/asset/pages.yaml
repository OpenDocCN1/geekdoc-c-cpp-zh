- pgno: 262
  md: 'As we noted in the previous section, destinations provide a layer of indirection
    between an application and an external application or service. This layer of indirection
    makes it easier for the application to focus on invoking a service without having
    to worry about where the service resides (e.g., on-premise vs. the Internet).


    # Creating Destinations


    From a configuration perspective, destinations can be established on several different
    levels:


    +   ▶ **Application level**

    +   If you need to establish a connection that''s unique to a particular application,
    then you can configure a destination directly within the application definition.


    +   ▶ **Customer account level**

    +   If a connection might be reused across multiple applications, then you can
    configure a reusable destination at the customer account level (i.e., at the root
    of the SAP HCP Cockpit).


    +   ▶ **Subscription level**

    +   This level is defined in situations in which application subscription scenarios
    are configured, a topic that''s beyond the scope of this book.


    For the most part, the definition process is the same regardless of the level
    at which you choose to define your destination. The primary difference lies in
    where you go to define the destination (e.g., from the account dashboard or the
    application dashboard). If you''re defining a destination at the application level,
    then you have the option of defining the destination directly within the Eclipse
    IDE. Otherwise, you can use the SAP HCP Cockpit or Console Client tools to configure
    destinations at all three levels.


    Because destinations are normally managed within the SAP HCP Cockpit, we''ll demonstrate
    the destination creation process within this tool. Here, you can access the destination
    editor screen in one of two ways:


    +   ▶ At the customer account level, you can access the editor by clicking on
    the Destinations link in the Content panel (Figure 6.30).


    +   ▶ At the application level, you can access the editor by opening the target
    Java application and choosing the DESTINATIONS link from the Content panel (Figure
    6.31).'
