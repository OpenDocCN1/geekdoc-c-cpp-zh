    # Design Approach and Initial Setup


    Figure 6.33 illustrates the mechanics of the RFC call that you''ll be building.
    There are several steps required to implement the integration scenario:


    +   1. First, you need to install the SAP HANA Cloud Connector somewhere on-premise.
    For the purposes of this demonstration, we''ll assume that the SAP HANA Cloud
    Connector is installed on the same application server host as the AS ABAP system
    that we''ll be calling the RFC function on.


    +   2. Next, establish an SSL VPN tunnel between the SAP HANA Cloud Connector
    and the target SAP HCP account you wish to integrate with.


    +   3. After the connection is established, the next step is to create a system
    mapping to the backend AS ABAP system and configure access control. Here, you
    must declare the RFC functions that you wish to expose to the target SAP HCP instance.


    +   4. Finally, use the virtual system mapping (shown in ①) as the basis for creating
    an RFC destination in the SAP HCP Cockpit. Within the invocation code, you can
    use this destination to obtain a JCo connection and invoke the target RFC functions.


    +   5. To get things started, you must first install the SAP HANA Cloud Connector.
    Although this is a step typically performed by system administrator types, it''s
    fairly easy to set up locally if you want to give it a try using a local SAP instance.
    Here, you basically just need to download the installation file for your OS via
    https://tools.hana.ondemand.com/#cloud and then either unpack the distribution
    or run the setup executable (Microsoft Windows). The SAP HANA Cloud Connector
    itself is rather small and takes minutes to install.'
