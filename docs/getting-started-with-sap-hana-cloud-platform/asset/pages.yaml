    If the nature of the error condition is not so obvious, then the next option is
    to remove the application, strip it down, and then begin putting the pieces back
    incrementally until you can pinpoint the error. This can be achieved by performing
    the following steps:


    +   1. If the server didn''t crash, then you''ll need to stop it. This can be
    achieved by using the toolbar functions of the Servers view in Eclipse or the
    Console Client''s `stop -local` command.

    +   2. Once the server is stopped, you''ll want to open up the server installation
    directory and navigate to the webapps folder. From here, find the archive folder
    for your application and delete it.

    +   3. Next, you''ll want to make a copy of the faulty application and begin stripping
    out any elements in the application copy that you think may be contributing to
    the error.

    +   4. Once the application copy is ready, you can restart the server and deploy
    the stripped-down version of the application. If the deployment works, then you
    can incrementally replace the elements you removed from before in a strategic
    fashion and retry the deployment.

    +   5. Finally, after several iterations of this, you should be able to locate
    the faulty element and remove it. If you''re lucky, maybe the application will
    just work, and perhaps the error condition was an anomaly to begin with; stranger
    things have happened.


