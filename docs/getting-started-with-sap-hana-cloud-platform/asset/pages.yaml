    # Exposing JPA Entities as OData Services


    In addition to providing the methods we need to perform basic CRUD operations
    on entities, the javax.persistence.EntityManager interface also exposes a method
    called getMetamodel() that can be used to introspect a persistence unit and fetch
    metadata about its defined entities. Although this sort of functionality may not
    be interesting to the average developer, it does provide all kinds of interesting
    capabilities for developers of reusable persistence frameworks.


    One such framework that''s of keen interest to SAP HCP developers is the Apache
    Olingo framework. This framework provides a collection of Java libraries that
    can be used to build and consume OData services. Included in this library collection
    is the Olingo OData JPA Processor library, which makes it easy to expose a JPA
    model as an OData service.


