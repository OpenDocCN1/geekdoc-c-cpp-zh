  md: "# Accessing and Configuring Log Files\n\nLog and trace messages such as the\
    \ ones illustrated in Listing 4.8 can be viewed via the same default trace files\
    \ described in Section 4.2.3. There is one caveat here, however. By default, the\
    \ effective logging level for a particular logger defaults to ERROR. This means\
    \ that log messages having a lower effective logging level (e.g., INFO or DEBUG)\
    \ won't show up unless we configure the effective logging level accordingly.\n\
    \nWhat does this mean? In the case of the default ERROR logging level, only messages\
    \ having ERROR-level severity will be added to the log. If we were to change the\
    \ logging level to WARN, then both warning messages and error messages would show\
    \ up. If we dialed the logging level up one more level to INFO, then we would\
    \ see information messages in addition to warning and error messages. If we simply\
    \ wanted to see all messages regardless of severity, then we could just set the\
    \ effective level to ALL.\n\nThe value in having such configurability is that\
    \ we can dynamically adjust the logging levels on an as-needed basis. For example,\
    \ in a production environment, we would probably set the logging level to ERROR\
    \ so that we wouldn't incur all the overhead of writing out trace or debug messages\
    \ and so on. However, if we were assigned a particularly complex defect, we might\
    \ turn the logging level up for a time in order to troubleshoot the problem. As\
    \ you can imagine, this is a very nice feature, because it gives us the ability\
    \ to quickly obtain more information about an application error without having\
    \ to touch the source code.\n\n# Performance Tip\n\nPerformance wise, we should\
    \ point out that there is some minimal overhead associated with calling a log\
    \ method, even in situations in which the effective log level filters out the\
    \ message from the log. You can eliminate this overhead by using the various isLogging-Level-Enabled()\
    \ Boolean methods of the org.slf4j.Logger interface. The typical usage looks like\
    \ this:\n\n```\nif (logger.isDebugEnabled()) {\n\tlogger.debug(\"Debugging message...\"\
    );\n}\n```\n\nBecause many developers already feel that logging statements clutter\
    \ up the code, it's up to you as to whether or not you want to escape every log\
    \ message with an if statement. For more details and other useful performance\
    \ tips, check out the SLF4J FAQ page, available online at www.slf4j.org/faq.html#Logging_performance."
  merge: -1
  img_proc: true
