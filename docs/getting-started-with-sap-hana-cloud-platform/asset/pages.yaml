- pgno: 322
  md: '# 7.4 Summary


    In this chapter, we showed you how to use the HTML5 application model to build
    lightweight, UI-centric applications. This application model, though less powerful
    than the Java and SAP HANA XS server-side models reviewed previously, offers tremendous
    benefits for customers looking to leverage in-house web development teams to create
    new applications or migrate existing applications to the cloud.


