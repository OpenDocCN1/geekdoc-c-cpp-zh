    # What Is SAP HCP Identity Propagation and How Does It Work?


    As you learned in Chapter 8, Section 8.5, it’s fairly easy to configure SSO between
    an SAP HCP application and another system by using a common identity provider
    system. Whenever you request any of those systems for the first time, you’ll be
    presented with a login screen. After successful login, you’ll be redirected back
    to the original solution, supplying a signed SAML assertion confirming the successful
    login. Based on that, a subsequent web session is established.


    The OAuth 2.0 SAML bearer assertion flow defines the process to use a SAML assertion
    to request an OAuth access token for a certain user, which is used to authenticate
    the user and perform OData API queries. All of that implementation is encapsulated
    in the SAP HCP Connectivity Service, making the whole process transparent for
    extension application developers.


    From a development perspective, the code looks relatively simple:


    ```

    Context ctx = new InitialContext();

    HttpDestination destination =

    (HttpDestination) ctx.lookup("*java:comp/env/sap_hcmcloud_core_

    odata");

    HttpClient client = destination.createHttpClient().execute(..)

    ```


    As a result, the query will always execute on behalf of the currently logged in
    user without any need for the application to handle it.


