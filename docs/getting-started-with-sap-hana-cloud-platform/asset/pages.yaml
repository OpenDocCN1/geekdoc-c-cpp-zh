  md: "Listing 6.2 demonstrates the annotation-based approach for an entity called\
    \ Address. In this example, you can see how you can use the javax.persistence.Table\
    \ annotation to map the entity to a specific table name (ADDRESSES). Similarly,\
    \ the javax.persistence.Column annotation allows you to map instance attributes\
    \ to specific columns in the target table. For specifying constraints, there are\
    \ annotations such as the javax.persistence.Id annotation, which identifies the\
    \ id attribute as the primary key for your Address entity.\n\n```\n@Entity @Table(name=\"\
    ADDRESSES\")\npublic class Address {\n    @Id\n    @Column(name=\"ADDRESS_ID\"\
    )\n    private String id;\n    private String street;\n    private String city;\n\
    \    ...\n}\n```\n\n# Listing 6.2 Implementing ORM Using Annotations\n\n# Understanding\
    \ the JPA's Use of Convention over Configuration\n\nAs you can imagine, the mapping\
    \ process can become quite tedious whenever you're dealing with complex database\
    \ schemas containing many entities. Fortunately, the JPA has some built-in intelligence\
    \ that allows you to skip over the mapping step in many cases. For example, if\
    \ you look closely at the Address entity in Listing 6.2, you'll notice that there\
    \ are no annotations attached to the street and city attributes. By omitting these\
    \ details, we're effectively telling the JPA persistence provider that these attributes\
    \ match up with table columns having the same name and data type. For newly developed\
    \ database schemas, you can even go so far as to let the JPA persistence provider\
    \ create the underlying database tables for you in reference to the mapped entities.\
    \ This is a classic example of how the JPA uses the \"convention over configuration\"\
    \ technique to minimize development time.\n\nIn addition to the annotations used\
    \ to configure individual entities, the JPA also contains a number of annotations\
    \ that can be used to specify relationships between entities. The code excerpt\
    \ in Listing 6.3 provides a sample of this with the Incident entity class. Here,\
    \ we're using the javax.persistence.OneToOne and javax.persistence.OneToMany annotations\
    \ to describe one-to-one and one-to-many relationships with the Location and InvolvedPerson\
    \ entity types,"
  merge: -1
  img_proc: true
- pgno: 230
  md: "respectively. Using these annotations (and their corresponding attributes),\
    \ you can specify foreign key relationships, relationship cardinalities, cascading\
    \ behaviors (e.g., delete all children whenever the parent is deleted), and so\
    \ forth.\n\n```\npublic class Incident {\n    @Id\n    private String id;\n  \
    \  @Basic\n    private String title = \"\";\n\n    ...\n\n    @OneToOne(cascade=CascadeType.PERSIST)\n\
    \    @JoinColumn(name=\"LOCATION_ID\", referencedColumnName=\"ID\")\n    private\
    \ Location location = new Location();\n\n    @OneToMany(mappedBy=\"incident\"\
