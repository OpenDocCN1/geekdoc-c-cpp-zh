  md: '# 3.4.1 Debugging a Java Web Application


    Because most application errors are a result of an inadvertent mistake, it can
    be difficult to pin down the statement or statements that are causing the problem.
    In these situations, it can be helpful to run through the application with a debugger
    so that you can step through the code line-by-line to see where things go awry.
    Although it can be a challenge to debug Java web applications in some environments,
    SAP HCP makes it easy to launch debugging sessions on demand.


    Regardless of whether you''re debugging web applications deployed on your local
    SAP HCP instance or a cloud-based SAP HCP instance, the steps for launching a
    Java web application in a debugger session are as follows:


    +   1. Before you start the debugger, you first need to set breakpoints in areas
    of the code where you suspect things may be going wrong. This can be achieved
    within the normal source code editor window in Eclipse by simply double-clicking
    on the gray panel adjacent to the line of code that you want to stop at (see Figure
    3.18).


    ![](img/cf7012644082c115a2181376d9b7486d_98_0.png)


    Figure 3.18 Setting a Breakpoint in the Java Source Code Editor


    +   2. Once your breakpoints are set, launch the debugger by right-clicking on
    the project node and selecting the Debug As • Debug on Server menu option, as
    shown in Figure 3.19. This is analogous to the Run As menu option you''ve used
    to deploy/launch your applications in normal mode.


    +   3. This will launch the Debug on SERVER wizard screen (Figure 3.20). From
    here, simply choose your preexisting server (or create a new one as needed), and
    click on the Finish button.'
