- pgno: 432
  md: 'SAP HANA Cloud Integration is the cloud-based sister of SAP Process Integration.
    This chapter will show you what it''s all about.


    # 10 Introduction to SAP HANA Cloud Integration


    One of the components provided as part of SAP HCP is SAP HANA Cloud Integration
    (SAP HCI). In this chapter, we’ll introduce you to what this solution is (Section
    10.1) and what it can be used for (Section 10.2). We’ll then walk you through
    the main steps in setting up Eclipse (Section 10.3), which is the integrated development
    environment (IDE) we’ll use in the example development scenario we present in
    this chapter. Once these basics are out of the way, we will dive into more detail
    in Section 10.4, which describes how to implement a simple scenario in which SAP
    HCI uses the SOAP adapter. Finally, although the focus in this chapter is using
    the Eclipse IDE for SAP HCI development, we’ll conclude with a brief introduction
    to the other possible development environment: the web UI, also known as SAP HCI
    Spaces (Section 10.5).


    # 10.1 Overview


    Since the introduction of cloud computing technology, there has been a shift in
    the level of investment by organizations in software licenses. Organizations are
    rapidly moving from the concept of software ownership to software rental. As a
    consequence, SAP is also currently growing its cloud portfolio, with products
    from human resources (e.g., SuccessFactors), marketing, sales, service, procurement,
    supply chain management, and finance. We’re convinced that this portfolio will
    continue to grow.


    You might now be wondering about SAP’s proposition to integrate this armada of
    cloud applications. Part of the answer lies in SAP’s release and offering of SAP'
  merge: -1
  img_proc: true
- pgno: 433
  md: 'HCI as its latest integration Platform-as-a-Service (iPaaS) for enterprise
    and B2B integration solutions.


    SAP HCI is designed to handle data and process integration between cloud to cloud
    and from on-premise to cloud. It connects to applications, databases, and files,
    and also facilitates integration between SAP and non-SAP systems. Examples of
    applications it can connect to include SAP Business Suite, SAP Sales and Operations
    Planning (S&OP), and SuccessFactors. Examples of databases it can connect to include
    SAP HANA, Oracle, DB2, SQL Server, and MySQL.


    SAP HCI comes in two flavors: SAP HCI for process integration and SAP HCI for
    data services. When SAP HCI is used for data services, it supports ETL (extract-/transform-/load)
    type integration by enabling the migration of data between on-premise and cloud
    applications. SAP HCI for process integration involves the creation of integration
    flows for end-to-end messaging and connectivity between on-premise and cloud solutions.
    (Note that the example in this chapter focuses on using SAP HCI for process integration
    purposes.)


    ![](img/cf7012644082c115a2181376d9b7486d_433_0.png)


    Figure 10-1. SAP HCI within the Context of SAP HCP'
  merge: -1
  img_proc: true
- pgno: 434
  md: 'As Figure 10.1 depicts, SAP HCI is part of SAP HCP. SAP HCI can be categorized
    as the integration component of the application services block.


    As opposed to SAP HCP, which enables customers and developers to build, extend,
    and run applications on SAP HANA in the cloud, SAP HCI is positioned as an integration
    platform or enterprise service bus (ESB) running on top of SAP HCP. From that
    perspective, the different applications provided by SAP HCP can be integrated
    together using SAP HCI.


    In principle, SAP HCI has a separate license than SAP HCP. However, it is also
    possible to use it as part of your SAP HCP license. There are three main license
    editions: the application edition, the standalone integration platform edition,
    and the developer edition. This choice of edition creates the flexibility for
    customers to choose the model that best fits their needs. These three edition
    options are subscription based and can be described as follows:


    # Application edition


    This edition can be used by customers using other SAP Cloud applications, such
    as SAP Cloud for Customer, SuccessFactors, and SAP Financial Services Network
    (FSN). This edition comes equipped with prepackaged content and flows that can
    be used directly without deep technical knowledge. This content can be found from
    the web-based application known as the Integration Content Catalog. The Integration
    Content Catalog can be accessed via https://cloudintegration.hana.ondemand.com.


    # Standalone integration platform edition


    This is a version of SAP HCI that enables you to integrate any application into
    your landscape (including SAP and third-party applications). Within this context,
    there are two different levels: the SAP HCI standard and professional packages.
    The standard edition is the entry-level package. It has full integration capabilities
    but is limited in terms of the total amount of bandwidth that can be used per
    month. The professional package, on the other hand, caters for more bandwidth.
    The professional package has many more levels that customers can select from,
    depending on their needs.


    # Developer edition


    This edition is intended for SAP partners to develop custom applications, such
    as the Adapter Development Kit (ADK), integration flows, and other integration
    artifacts. This edition was released in early 2015.'
  merge: -1
  img_proc: true
- pgno: 435
  md: '# 10.2 Use Cases


    At this point, you might be asking yourself how you will know in which situations
    SAP HCI might be applicable or relevant.


    Imagine that you have a scenario that requires you to integrate two different
    applications that have been built on top of SAP HCP. You might be tempted to build
    direct connections between the different applications using homegrown solutions
    facilitated by the SAP HCP Connectivity Service. At first sight, this might be
    an easy and quick solution, especially with fewer applications to connect. However,
    its disadvantages become visible as the organization’s cloud application landscape
    becomes more complex and larger. The point-to-point approach forms a spider web
    of application connections, as shown in Figure 10.2. This connection spaghetti
    will keep growing exponentially as more systems are introduced into the landscape.


    ![](img/cf7012644082c115a2181376d9b7486d_435_0.png)


    Figure 10.2 Point-to-Point Integration: Cloud Applications Directly Connected
    to Each Other


    When using the point-to-point integration approach, each system is aware of the
    connection and message details of the system on the other side of the exchange.
    Every time a particular system changes or needs to be replaced, the impact will
    be felt by all other systems communicating with it. If a vulnerable security connection
    is discovered in one of the systems, then all applications currently connecting
    with it will need to be changed, adapted, and potentially be unavailable for a'
  merge: -1
  img_proc: true
- pgno: 436
  md: 'long time, all of which results in higher costs of development and maintenance
    in the long run.


    That is where an ESB like SAP HCI comes to the rescue. SAP HCI eliminates and
    remedies the problems caused when using point-to-point integration by taking on
    the role of the central integration hub, which facilitates the routing and transformation
    of different structures of the systems involved in an integration, as shown in
    Figure 10.3.


    ![](img/cf7012644082c115a2181376d9b7486d_436_0.png)


    Figure 10.3 SAP HCI Integrates On-Premise and On-Demand Applications


    SAP HCI is the glue that can hold cloud-based and on-premise applications together.
    SAP HCI integrates these applications in an easy and cost-effective way—especially
    for some specific scenarios, because it provides numerous pre-packaged integration
    content choices for different SAP Cloud solutions.


    Even though SAP HCI covers a wide range of use cases, the next section will only
    focus on few illustrative and more commonly used cases. The following cases can
    be considered:


    +   ▶ Integrating with SAP Cloud for Customer

    +   Customers currently using the SAP Cloud for Customer solution can easily integrate
    it with an on-premise SAP CRM or SAP ERP solution via the prepackaged solution
    provided in SAP HCI.'
  merge: -1
  img_proc: true
- pgno: 437
  md: '+   ► **Integrating SuccessFactors**

    +   Customers using the SuccessFactors platform can rapidly integrate it with
    an on-premise SAP ERP solution using the specific prepackaged solution provided
    in SAP HCI. Furthermore, a special SuccessFactors adapter is provided in SAP HCI
    to seamlessly integrate with SuccessFactors, in case you decide to develop your
    own custom integration flows.


    +   ► **Integrating with SAP FSN**

    +   SAP FSN uses SAP HCI as its ESB to facilitate the integration between different
    corporations and financial institutions.


    +   ► **Integrating any cloud-to-cloud scenario**

    +   If different cloud-based applications need to be integrated and exchange data,
    then SAP HCI can be used to facilitate the building of custom integration flows.


    +   ► **Integrating any other cloud to on-premise applications**

    +   In addition to working with cloud applications provided by SAP (such as SuccessFactors),
    you might encounter a situation in which custom applications built on top of SAP
    HCP need to exchange data with their on-premise counterpart applications. In such
    a case, SAP HCI can be used to facilitate the building of custom integration flows.
    In this situation, an integration flow might need to be developed from scratch,
    because the likelihood of having existing prepackaged integration content for
    such a scenario will be small.


    # ## 10.3 Getting Started with the Eclipse IDE


    In order to perform development activities for SAP HCI, you will need to use an
    IDE, such as Eclipse. SAP HCI uses Eclipse to contain the necessary perspectives
    that support SAP HCI developments.


    In order to use Eclipse for SAP HCI development, you need to install some SAP
    HCI-specific plug-ins and make sure Eclipse is correctly configured. In this section,
    we’ll walk you through these steps.


    # ## 10.3.1 Installing SAP HANA Cloud Integration Plug-Ins


    SAP HCI is currently supported on Eclipse Kepler, a specific version of Eclipse.
    Other Eclipse platforms currently do not provide support for SAP HCI. Eclipse'
  merge: -1
  img_proc: true
- pgno: 438
  md: 'Kepler can be downloaded at https://www.eclipse.org/downloads/packages/release/kepler/sr2.


    After installing Eclipse Kepler, you will need to install the appropriate SAP
    HCI plug-ins in Eclipse in order to have the necessary artifacts for creating,
    designing, and monitoring integration flows. Proceed as follows to add the plug-ins:


    +   1. From the main menu, choose Help • INSTALL NEW SOFTWARE....


    +   2. On the AVAILABLE SOFTWARE page of the install wizard, add the update site
    URL: https://tools.HANA.ondemand.com/kepler.


    +   3. Select from the following three options:


    +   Show only the latest version of AVAILABLE SOFTWARE


    +   GROUP ITEMS BY CATEGORY


    +   CONTACT ALL UPDATE SITES DURING INSTALL TO FIND REQUIRED SOFTWARE


    +   4. Select the SAP HANA CLOUD INTEGRATION TOOLS category.


    +   5. Click on NEXT.


    +   6. Check the features selected for installation and click on NEXT.


    +   7. Accept the terms of the licensing agreement and click on FINISH.


    +   8. Restart the Eclipse IDE.


    The Eclipse plug-in contains the following features:


    +   Designer for SAP HCI


    This feature contains plug-ins to develop and configure integration flows.


    +   Operations for SAP HCI


    This feature contains plug-ins to perform administrative tasks related to SAP
    HCI runtime clusters and to monitor integration flows.


    +   Certificates and security artifacts


    Depending on the type of scenario you mind, designing and deploying integration
    flows on an SAP HCI tenant requires you to take security aspects into consideration.
    Different types of security artifacts might need to be included. This could include
    SSL (certificate authority, private key, and public key) and SSH (private and
    public keys). Note that many CAs are currently supported (including SAP Passport
    CA), and more will be added as time goes by.'
  merge: -1
  img_proc: true
- pgno: 439
  md: 'Because SAP HCI currently supports SOAP, IDoc, SFTP, OData, and SuccessFactors
    connectivity options, the security artifacts previously listed can be used in
    most of them.


    # Tenant account


    You need a tenant account to be able to deploy your SAP HCI developments. The
    details of the tenant includes the tenant ID and the operations server. These
    details are needed to be able to configure your Eclipse environment. For more
    information about how to apply for a tenant account, please contact your SAP representative.
    The tenant will facilitate the execution of different integration operations,
    including the deployment of integration flows and the runtime monitoring of running
    flows.


    # 10.3.2 Configuring Eclipse


    When configuring Eclipse for your SAP HCI environment, you will need to configure
    two different preference aspects in Eclipse: the operations server and the ESR.


    The operations server is required to be able to deploy your SAP HCI integration
    flows to the server. To set up the operations server, perform the following actions:


    +   1. From your Eclipse IDE, navigate to WINDOWS • PERSPECTIVES • SAP HANA CLOUD
    INTEGRATION.


    +   2. From there, enter the necessary details to connect to the operations server,
    based on the tenant details (see Figure 10.4).


    +   3. You can test the connection by using the TEST CONNECTION button. When the
    test is successful, click on the OK button.


    REPOSITORY CONNECTION will normally point to the Enterprise Service Repository
    (ESR). This configuration will enable the importing of SAP PI/SAP PO objects and
    artifacts, such as message mappings, operation mappings, and WSDL files. This
    feature is very useful and facilitates the use of existing SAP PI objects. You
    will need to input the required details under the REPOSITORY CONNECTION section
    (see Figure 10.5).'
  merge: -1
  img_proc: true
