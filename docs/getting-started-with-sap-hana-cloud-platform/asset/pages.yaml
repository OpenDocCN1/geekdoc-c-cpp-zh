- pgno: 383
  md: '# 9.1.1 What is SAP HANA Cloud Portal?


    If you''ve worked with enterprise portal solutions in the past (e.g., SAP Enterprise
    Portal or Microsoft SharePoint), then you probably have a pretty good good idea
    about what SAP HANA Cloud Portal is all about. For readers who are unfamiliar
    with portal concepts, though, some exposition is worthwhile.


    In general, portal solutions like SAP HANA Cloud Portal are used to build mashup
    sites that provide centralized access to related applications or content. The
    use of the term "mashup" here is appropriate, because (as you can see in Figure
    9.1) portal sites are aggregates that stitch together application content from
    here, there, and everywhere. To the end user, this is all abstracted behind the
    portal server, which fetches the relevant content from different locations and
    weaves it into consolidated HTML markup that clients access via their web browser
    as per usual.


    ![](img/cf7012644082c115a2181376d9b7486d_383_0.png)


    Figure 9.1 A Simplified View of Portal Content Aggregation


    Now that we''ve established the basics of portal technology, we can turn our attention
    to SAP HANA Cloud Portal itself. According to the SAP help documentation, the
    SAP HANA Cloud Portal is defined as "a cloud-based solution for easy site creation
    and consumption with a superior user experience. Designed primarily for mobile
    consumption, it runs on top of SAP HANA Cloud and is built to operate with SAP
    HANA, for in-memory computing." Based on this definition, we can draw several
    important conclusions about SAP HANA Cloud Portal:


    +   - From a software logistics perspective, we find that SAP HANA Cloud Portal
    is less a standalone application and more of an extension or service of SAP HCP.'
  merge: -1
  img_proc: true
- pgno: 384
  md: '+   Because SAP HANA Cloud Portal is built on top of SAP HCP, it’s able to
    easily integrate web applications deployed on the host SAP HCP platform. It’s
    also able to leverage other functions of SAP HCP, such as security, theming, and
    so forth.


    +   Being “designed primarily for mobile consumption,” SAP HANA Cloud Portal utilizes
    a lightweight content model based on responsive web design techniques. In and
    of itself, this doesn’t guarantee a seamless experience across different form
    factors, but it certainly provides the foundation for heading in such a direction.


    +   In addition to delivering a “superior user experience,” SAP HANA Cloud Portal
    is also focused on providing content administrator types with a simplified and
    rapid site development experience.


    To summarize, we can say that SAP HANA Cloud Portal is a (lean) portal solution
    that’s built on top of SAP HCP and positioned as a service that can be used to
    build mashup sites. If that seems overly simplistic, it’s because it’s supposed
    to be; the tool is meant to be easy to use and easy to consume.


    | SAP HANA Cloud Portal vs. SAP Enterprise Portal |

    | :--- |

    | If you’ve worked in the SAP software space for very long, then you might be
    wondering how SAP HANA Cloud Portal relates to SAP Enterprise Portal. The short
    answer here is that aside from the fact that they both fall under the heading
    of *enterprise portals*, the two solutions really have little to do with one another.
    SAP Enterprise Portal is a strictly on-premise portal offering that is best suited
    for integrating content within an intranet site; SAP HANA Cloud Portal is an extension
    of SAP HCP that embodies the concepts of a lean portal. This is to say that SAP
    HANA Cloud Portal offers a simpler, more lightweight content model that is easier
    to consume over the web using various device types. |


    # 9.1.2 Architectural Overview


    In terms of functionality, SAP HANA Cloud Portal has all of the features you would
    expect from any lean portal product offering in the marketplace: a runtime container
    for content aggregation, a WYSIWYG (what you see is what you get) authoring environment,
    a host of enablement services and APIs, and lots of reusable content. However,
    as we noted in Section 9.1.1, instead of packaging these components as part of
    a standalone product offering, SAP decided to bundle them as a service of SAP
    HCP.'
  merge: -1
  img_proc: true
