- pgno: 324
  md: 'Despite the myriad of benefits associated with cloud computing, many businesses
    remain hesitant to jump on board the cloud bandwagon for one reason: security.
    Although some security concerns are perhaps unfounded, the fact remains that security
    threats are real and must be dealt with. In this chapter, we''ll explain how to
    apply the appropriate security measures for SAP HCP applications.


    # 8 Securing Cloud Applications


    Within a given news cycle, it''s not uncommon to find multiple reports of malicious
    attacks being launched against applications running in the cloud. As a result,
    it''s not surprising that many organizations are more than a little hesitant to
    deploy enterprise applications that handle sensitive data to the public cloud.
    However, just because these attacks are so prevalent doesn''t mean that we can''t
    have secure applications running in the cloud; we just have to work at it a little
    bit more.


    In this chapter, we''ll take a look at some of the tools and services that you
    can use to secure applications running on SAP HCP. You''ll find that SAP has blended
    security concepts from a variety of open standards (such as SAML and OAuth) to
    provide developers with a robust infrastructure for tackling even the most daunting
    of security requirements.


    # 8.1 Overview


    For years, most SAP landscapes have existed in isolation on-premise, being nested
    safely within the confines of a secure corporate firewall. Although such a setup
    doesn''t eliminate security risks altogether, it certainly cuts down on the amount
    of time developers have to spend worrying about security concerns. Indeed, most
    SAP developers working in such environments rarely bother to protect against common
    security vulnerabilities because, quite frankly, the chances of such vulnerabilities
    being exploited inside the firewall are fairly low.'
  merge: -1
  img_proc: true
- pgno: 325
  md: 'In the cloud, though, it''s a completely different story. Here, you must adopt
    a holistic security model that ensures that every aspect of an application is
    protected against malicious attacks. Although the nature of this security model
    will change based on an application''s requirements, there are generally three
    main issues that you must concern yourself with:


    +   > **Authentication**

    +   Authentication is all about verifying the identity of the user(s) that will
    be accessing your applications. In essence, you need to come up with a reliable
    way of determining if users are in fact who they say they are.


    +   > **Authorization**

    +   Once you determine a user''s identity, the next step is to determine what
    functions the user is authorized to perform within the application. Here, the
    general rule of thumb is to limit a user''s access to the functions that user
    needs to carry out his or her job on a daily basis—no more, no less.


    +   > **Confidentiality and integrity**

    +   As users navigate within an application, you need to make sure that the data
    being exchanged back and forth between the user and the application is transmitted
    securely. This means that no one can eavesdrop on the application''s conversation.
    It also means that you must take steps to ensure that data packets are not tampered
    with as they travel back and forth between the client and server.


    In the sections that follow, we''ll explore the vast array of tools and services
    that SAP has provided with SAP HCP to address these key security issues. As you
    might expect, the way that these tools and services are utilized varies quite
    a bit between programming environments (e.g., Java vs. native SAP HANA). Therefore,
    because we cannot realistically cover each and every nuance of the environment-specific
    security models, we chose to develop the hands-on examples for this chapter using
    the Java programming language. This, of course, is by no means meant to be prescriptive;
    we simply felt that certain SAP HCP-related security concepts were easier to relate
    to using Java.


    Overall, our goal in this chapter will be to focus in on the main SAP HCP security
    concepts that apply across programming models. Once you grasp these concepts,
    we think that you''ll find it fairly easy to relate them to your programming model
    of choice. To that end, we''ll be sure to point out appropriate reference materials'
  merge: -1
  img_proc: true
- pgno: 326
