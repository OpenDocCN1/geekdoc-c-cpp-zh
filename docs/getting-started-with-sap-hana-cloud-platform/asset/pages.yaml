  md: "As you can imagine, this brief introduction barely scratches the surface with\
    \ regards to the myriad of ORM options available within JPA. For a more comprehensive\
    \ reference, we highly recommend that you pick up a copy of Java Persistence with\
    \ JPA 2.1 (Yang, Outskirts Press, 2013). You can also find details concerning\
    \ specific annotation types in the Java EE 6 API documentation online at http://docs.oracle.com/javaee/6/api.\n\
    \n# Manipulating Entities Programmatically\n\nIn terms of development effort,\
    \ mapping entities for use within the JPA is by far the hardest part. Once the\
    \ entities are defined, JPA makes it easy to access and manipulate entity instances\
    \ at runtime. Here, you need only obtain a javax.persistence.EntityManager instance,\
    \ and you’re off and running.\n\nWithin a managed environment like SAP HCP, EntityManager\
    \ instances are normally obtained via dependency injection inside of a stateless\
    \ session bean, as shown in Listing 6.5. This approach allows you to take advantage\
    \ of the container-managed persistence (CMP) capabilities of the Java EE application\
    \ container. Here, you allow the application container to manage the lifecycle\
    \ of the entity manager and the transactions you perform against it.\n\n```\n\
    import javax.persistence.EntityManager;\nimport javax.persistence.PersistenceContext;\n\
    \n@Stateless\n@LocalBean\npublic class IncidentBean {\n    @PersistenceContext\
    \ private EntityManager em;\n    ...\n}\n```\n\nListing 6.5 Obtaining a JPA Entity\
    \ Manager Instance via Injection\n\nBecause injection ensures that the EntityManager\
    \ instance is created during the bean-allocation process, you can begin using\
    \ it to perform CRUD operations in EJB business methods right away. For example,\
    \ in Listing 6.6, you can see how we’re using the persist() method of the EntityManager\
    \ interface to create a new incident record. In this scenario, the Incident instance\
    \ (which is basically just a POJO) was instantiated using the new operator and\
    \ populated via a series of setter methods, just like any other Java object. When\
    \ passed to the persist() method, though, the Incident instance becomes a managed\
    \ entity instance—at least for the"
  merge: -1
  img_proc: true
- pgno: 233
  md: 'duration of the JTA transaction spawned by the EJB container. After the addIncident()
    method completes, the JTA transaction is automatically committed, and the entity
    instance becomes “detached.” This is to say that the Incident instance effectively
    becomes a normal object that can be passed around via different application layers
    without fear of thread safety or transactional integrity issues.


    ```

    public class IncidentBean {

    public Incident addIncident(Incident incident) {

    return em.persist(incident);

    }

    }

    ```


    # Listing 6.6 Creating Entity Records Using the JPA


    After an entity record is created, you can update it using the merge() method
    of the EntityManager interface, as shown in Listing 6.7. As the method name suggests,
    this method effectively merges the state of the passed entity object with the
    persistence context.


    ```

    public class IncidentBean {

    public Incident updateIncident(Incident incident) {

    return em.merge(incident);

    }

    }

    ```


    # Listing 6.7 Updating Entity Records Using the JPA


    To delete an entity record, you can use the remove() method of the EntityManager
    interface. However, as you can see in Listing 6.8, there is a twist calling this
    method. Before you can remove a detached entity, you must first merge it into
    the persistence context. Therefore, first you merge the entity using merge(),
    and then you can simply pass the result on to remove().


    ```

    public class IncidentBean {

    public void removeIncident(Incident incident) {

    em.remove(em.merge(incident));

    }

    }

    ```


    # Listing 6.8 Deleting Entity Records Using the JPA


    When it comes to fetching entity instances, you have one of two options:


    +   If you happen to know the primary key of the target entity record, you can
    use the find() method of the EntityManager interface to look it up.'
