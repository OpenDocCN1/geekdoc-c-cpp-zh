    # 4.2.2 Deployment Using the Console Client


    In the previous section, we learned how easy it is to deploy applications from
    within the Eclipse IDE. However, there will be times when deployment through Eclipse
    may not be desirable or even feasible. Some examples of these situations include
    the following:


    +   Deployments to controlled environments

    +   When deploying to productive instances or even controlled QA instances, many
    organizations will have policies in place to ensure that deployments are carried
    out by administrators instead of developers. Although such administrators could
    certainly install the Eclipse IDE and corresponding SAP HCP tools to perform such
    deployments, most admins will prefer to use an external deployment tool. This
    is especially the case for admins who are uninitiated in the ways of Eclipse and
    Java development.


    +   System copies or builds

    +   For more complex landscapes, there might be situations in which code needs
    to be deployed en masse as part of a system copy or build. In these cases, automation
    of deployment is essential.'
