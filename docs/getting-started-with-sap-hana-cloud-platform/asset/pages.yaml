    # ## 4.3 Source Code Management


    One of the really great things about SAP HCP is its openness. From the use of
    industry standard libraries and APIs to the open Eclipse platform, developers
    are essentially free to use any tools at their disposal to build cloud-based applications.
    This openness also extends to the selection of source code management (SCM) tools.
    Here, development teams are free to work with most any SCM tool available on the
    market: Git, Subversion, Perforce, and many more.


    Although this is great news for development teams, it does make the job of writing
    a book like this much more difficult. Indeed, even if we wanted to, there''s no
    way we could reasonably cover all of the possible SCM tools that could be used
    to manage the source code of SAP HCP applications. That being said, our approach
    in this section will be to demonstrate source code management concepts using one
    of the more prominent SCM tools used in this space: Git. This choice is by no
    means meant to be prescriptive. Rather, we simply wanted to provide you with a
    practical example as we demonstrate how to manage the source code of your SAP
    HCP applications from within the Eclipse IDE.


    For the most part, the concepts we''ll review in this section will generally apply
    towards the use of other SCM tools. Much of this overlap is made possible by the
    core Eclipse framework, which defines a basic interface for integrating with'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'various repository types. With this basic infrastructure in place, the prospect
    of hooking up Eclipse to your SCM tool of choice generally involves little more
    than installing a repository provider plug-in (if it’s not installed already).


    # ## 4.3.1 Introduction to Git and GitHub


    At this point, we’ve already established that Git is an SCM tool. However, for
    many, Git is much more than just another SCM tool. Git was developed by Linus
    Torvalds (the creator of Linux) from the ground up as a distributed SCM tool with
    the goal of simplifying the coordination of Linux kernel development with developers
    across the world. Particular emphasis was placed on speed, distributed development,
    and efficient handling of large projects.


    Again, it is not our intent to prescribe the use of Git (or any other SCM tool,
    for that matter) in this book; however, it bears mentioning that Git usage has
    increased exponentially in the past couple of years, and its footprint continues
    to grow. As of the time of writing, this growth has also extended to SAP HCP,
    as Git has been selected as the repository of choice for HTML5 applications (a
    subject we’ll consider in Chapter 7). For these reasons, we would recommend that
    you at least familiarize yourself with Git so that you have a general sense for
    how it’s used. If you’re looking for more in-depth coverage, we recommend Version
    Control with Git, 2nd Edition (Loeliger, McCullough, O’Reilly, 2012).


    Although it is certainly possible to install and maintain Git repositories in
    various configurations on-premise, many organizations have begun to enlist web-based
    hosting services such as GitHub due to their relative low cost and value-added
    services for project management. For the purposes of our demonstration, we’ll
    be using a GitHub-based repository to give you a feel for what distributed development
    looks like with Git.


