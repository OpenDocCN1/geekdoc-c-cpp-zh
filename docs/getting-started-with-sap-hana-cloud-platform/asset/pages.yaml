- pgno: 64
  md: '# Setting Up the Local Runtime Environment


    As we noted earlier, the SAP HCP SDK includes a local runtime environment that
    allows you to test SAP HCP applications on your local machine. Although you can
    administer this local runtime environment from the command line, it’s much more
    convenient to install the local runtime environment as an available server runtime
    in Eclipse. This integration can be achieved by performing the following steps:


    +   1. Start Eclipse, select the WINDOW • PREFERENCES menu option, and expand
    the SERVERS submenu.


    +   2. Inside the Server submenu, select the SAP HANA Cloud Platform node. This
    will open the SAP HANA Cloud Platform panel shown in Figure 2.16. Within this
    panel, you’ll want to configure the relevant attributes as follows:


    +   **LANDSCAPE HOST**

    +   This attribute needs to point to the host of your target SAP HCP instance.
    If you’re using the free developer account, then the landscape host will be hanatrial.ondemand.com.
    Otherwise, it will be hana.ondemand.com.


    +   **SDK LOCATION**

    +   In this field, you’ll want to specify the directory that you unpacked the
    SAP HCP SDK to.


    +   **ACCOUNT NAME**

    +   This attribute is used to keep track of your SAP HCP account name so that
    SAP HCP Tools can automatically propose this value whenever you perform actions
    that require you to specify your SAP HCP account.


    +   **USER NAME**

    +   This attribute is used to keep track of your user name so that SAP HCP Tools
    can automatically propose this value whenever you perform actions that prompt
    you to authenticate with the server-side SAP HCP instance.'
  merge: -1
  img_proc: true
