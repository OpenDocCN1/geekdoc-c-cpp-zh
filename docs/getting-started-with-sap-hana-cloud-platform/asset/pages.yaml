  md: '4. As soon as the project is shared, you''ll notice some subtle differences
    in the way the project is visualized in the PROJECT EXPLORER. As you can see in
    Figure 4.38, each project artifact is now annotated with icons and tags that illustrate
    its status within the repository. This is a convenient way of keeping track of
    in-flight changes as you''re modifying and/or enhancing the project. Aside from
    these minor UI changes, it''s basically business as usual from an Eclipse perspective.


    ![](img/cf7012644082c115a2181376d9b7486d_149_0.png)


    Figure 4.38 Visualization Differences for Shared Projects in Eclipse


    # 4.3.6 Checking in Changes


    In order to maintain the integrity of artifacts within the repository, Git does
    not automatically commit changes to the database. Indeed, when we shared our project
    with Git, all we really did was place the project files in a directory that Git
    happens to care about. At this point, Git is generally aware of the files'' existence
    but chooses to ignore them until someone comes along and explicitly tells it to
    start tracking specific files. In Git terminology, such a command moves the files
    into the repository staging area (or index).


    Once a file is moved into the staging area, it''s ready to be committed to the
    repository database. Of course, even at this point we could still decide to change
    our mind and revert the file. This two-phase commit protocol ensures that changes
    to files don''t ever accidentally make their way into the database; if a change
    gets added, it''s because someone explicitly staged it and then pulled the trigger
    to commit it after the fact.'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'To see how this works, let''s take a look at how we would perform an initial
    check-in of our sample web project. For this task, we''ll want to open up the
    Git STAGING view shown in Figure 4.39. Here, on the left-hand side of the view,
    we can see two listboxes:


    +   UNSTAGED CHANGES


    In the UNSTAGED CHANGES listbox, we have a list of files that are contained within
    the Git repository directory but are not yet tracked within Git. Git is certainly
    aware of the presence of these files, but it doesn''t do anything with them until
    we explicitly tell it to.


    +   Staged Changes


    This listbox contains artifacts that have been moved to the staging area of the
    Git database. In order to add, update, or remove files from Git, we must first
    stage the changes within the staging area.


    ![](img/cf7012644082c115a2181376d9b7486d_150_0.png)


    Figure 4-39 Staging Changes for a Commit


    As you can see in Figure 4.40, the process of staging or unstaging changes within
    EGit is as simple as dragging files back and forth between these two listboxes.
    Once we''re satisfied with the changes in the staging area, the next step is to
    trigger a commit. In the Git Staging view, this can be achieved by keying in a
    brief Commit Message and then clicking on the Commit and Push button (see Figure
    4.40). This action will force Git to commit the changes added to the staging area
    and push them out to the repository database hosted on GitHub.'
