    \  2. On the Roles tab, you can define new roles and assign these roles to end\
    \ users or user groups. To create a new role, click on the NEW ROLE... button\
    \ shown in Figure 7.28. Here, you need only specify the role’s name and then click\
    \ on SAVE."
