    In addition to these usual suspects, SAP has recently introduced another editor
    option into the mix: the SAP Web IDE. The SAP Web IDE (formerly known as the SAP
    River RDE) is a 100% web-based IDE that requires no installation of custom components
    on your local machine.


    Although a thorough treatment of the capabilities of the SAP Web IDE is beyond
