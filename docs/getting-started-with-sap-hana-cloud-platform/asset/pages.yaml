- pgno: 178
  md: "**Tip**\nOnce a system connection is established, you can expand the newly-created\
    \ system node and browse through all of the available content in the remote SAP\
    \ HANA Repository. Although the content catalog is pretty much empty save for\
    \ some standard content provided by SAP, you can nevertheless see an up-to-date\
    \ snapshot of what's on the server.\n\n# Organizing Repository Content into Subpackages\n\
    \nIn Section 5.3, we'll begin creating custom SAP HANA artifacts in Eclipse. However,\
    \ before we head down this path, it's a good idea to spend some time up front\
    \ determining how we want to organize our development objects. After all, if you\
    \ dumped everything into the root package, it would eventually become rather difficult\
    \ to determine what's what.\n\nWithin the SAP HANA Repository, you can group related\
    \ development objects into packages. Besides providing a neat folder structure,\
    \ packages also allow you to assign relevant permissions to development objects\
    \ at a macro level (similar to access control lists in operating systems or content\
    \ repository systems). The details around this and other logistics-related contexts\
    \ are described at length in the SAP HANA help documentation.\n\nFor the purposes\
    \ of our demonstration, we'll be creating a single subpackage underneath the hcpbook\
    \ (trial) instance we created in Section 5.2.1. This can be achieved by performing\
    \ the following steps:\n\n+   1. From the same Systems view you used to establish\
    \ your repository connection in the previous section, expand the Content folder\
    \ down to the package that matches up with the SAP HANA instance you created in\
    \ Section 5.2.1.\n+   \n+   2. Once you find the target folder/package, right-click\
    \ on it and select the New • Package... menu option, as shown in Figure 5.6.\n\
    +   \n+   3. In the New PACKAGE dialog box shown in Figure 5.7, specify a name\
    \ for your new package and an optional description. Note that the name you give\
    \ to the package must be fully qualified. If you wanted to name the subpackage\
    \ bookstore, then you would need to qualify the name with the relevant parent\
    \ packages (e.g., [account_name].hcpbook.bookstore)."
  merge: -1
  img_proc: true
- pgno: 179
  md: '![](img/cf7012644082c115a2181376d9b7486d_179_0.png)


    Figure 5.6 Creating a Subpackage: Part 1


    ![](img/cf7012644082c115a2181376d9b7486d_179_1.png)


    Figure 5.7 Creating a Subpackage: Part 2


    4. Once you''re satisfied with your selection, click on the OK button to create
    the subpackage.


    Depending on the complexity of the application(s) you''re building, it might make
