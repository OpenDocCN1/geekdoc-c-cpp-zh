- pgno: 152
  md: 'Over time, a repository will accumulate a number of commits or snapshots that
    can be used as logical points to revert a project back to a stable release or
    to fork the project into different branches so that developers can work on different
    versions of the project simultaneously.


    From here, additional changes to the project are handled in largely the same way
    as we demonstrated here with the initial commit. For example, if other developers
    want to check out the project and make some changes, they would basically just
    clone the latest commit from the GitHub repository, stage their changes, and then
    commit them back to the repository using the steps outlined in this section.


    For the most part, about the only thing that can go wrong in all of this is if
    two or more developers try to check conflicting changes to the same artifact.
    Fortunately, Git is quite adept at detecting such collisions and will cancel the
    commit until the conflicts are reconciled and the changes are merged. Then (and
    only then) can the new version of the file be checked into the repository.


    # 4.3.7 Where to Go From Here


    Hopefully, this brief demonstration helped paint a picture for what source code
    management looks like in the SAP HCP development space. Obviously, we''re painting
    in broad strokes here, because there are quite a few options for maintaining source
    code versions. Indeed, you don''t have to use a SCM tool at all; some organizations
    that are just getting started with cloud application development may prefer to
    store source code on a network file share for a while until they come up with
    a better long-term strategy.


    Whether you end up using Git or some other tool, the main takeaway from this section
    is that it''s important to have a plan for keeping track of source code beyond
    merely storing it in your local Eclipse workspace. Backup reliability issues aside,
    trust us when we say that having no real plan for source code management is a
    recipe for disaster.


    # 4.4 Build Automation with Apache Maven and Ant


    In Section 4.2.2, we touched on the fact that many organizations have policies
    in place that prevent developers from deploying their own code into production.
    In'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'practice, these policies usually also stipulate that developers can''t even
    build their own code. After all, putting such checks and balances in place does
    a company little good if a developer is able to manipulate the build and sneak
    malicious code into a file that gets deployed indiscriminately by system administrators.


    The downside and potential risk of establishing such policies is that it places
    the burden of application builds squarely on the shoulders of resources who many
    not know anything about the applications they''re building. Indeed, knowing what
    you now know about source code management and deployment from within the Eclipse
    IDE, it''s pretty plain to see that checking out code and performing a build is
    not a task that can be performed by just anyone.


    To address these kinds of concerns, many companies elect to utilize build automation
    tools. Using these tools, administrators can quickly and easily build even the
    most complex of applications right from the comfort of their favorite command-line
    interface (CLI). In this section, we''ll take a brief look at what it takes to
    implement such builds.


    # 4.4.1 Getting Started with Apache Maven


    The first build automation tool we''ll take a look at is arguably the most popular
    one in the Java development space: Apache Maven. In the upcoming sections, we''ll
    try to explain what Maven is and how it can be used to automate Java application
    builds. For brevity''s sake, we can''t really get into a thorough treatment of
    Maven within the context of this book. Instead, our goal will be to simply paint
    a picture of what Maven-based project development looks like. For a more detailed
    treatment of Maven, we highly recommend Maven: The Definitive Guide, 2nd Edition
    (Sonatype Company, O''Reilly, 2014).


    # What is Apache Maven?


    According to Webster''s dictionary, a maven is defined as one who is experienced
    or knowledgeable, an expert, or even a freak. As it relates to software project
    management and, more specifically, project builds, Apache Maven is a software
    package that certainly lives up to its name. This is to say that Maven is freakishly
    adept at performing automated builds with little or no supervision.'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'How is Maven able to achieve this? Unlike other build automation tools, the
    basic unit of configuration in Maven is not a build script. Instead, Maven utilizes
    a special XML configuration file called a Project Object Model file (or POM file).
    Within a POM file, our goal is to build a conceptual model of our project. Here,
    we can specify (among other things) the following:


    +   - A unique identifier for the project, complete with the target version number

    +   - Descriptive details about the project, the involved participants, and so
    on

    +   - Defined dependencies to other projects or libraries


    Noticeably absent here are low-level build details, such as which folder to copy
    source code from, compilation details, and so on.


    The reason we can (generally) avoid having to specify these details is because
    Apache Maven subscribes to the motto of “convention over configuration.” This
    is to say that it’s rather opinionated about how builds are supposed to work.
    For example, rather than forcing developers to specify where source code resides
    each and every time, Maven conventionally assumes that source code resides in
    the SRC/MAIN directory underneath the project root folder. Of course, these rules
    aren’t set in stone; Maven will allow you to override such settings if you absolutely
    want to. However, the more we play along, the more Maven is able to intuit build
    details on our behalf.


    Another major advantage of following convention is that it allows us to leverage
    a wide array of plug-ins developed within the community to perform specific tasks.
    Besides the more obvious compile and archive plug-ins, we can find useful plug-ins
    to generate project documentation, capture source code metrics, and execute unit
    tests. Within the SAP HCP development space, SAP provides a Maven plug-in that
    can be used to invoke Console Client commands from within a help build. You can
    view details about this plug-in online at https://help.hana.ondemand.com/mavenSite/index.html.


    Ultimately, the use of Maven leads to consistency in project maintenance. Projects
    take on a similar look and feel, and this generally makes it easier for developers
    to navigate through the project artifacts and find what they’re looking for. From
    an administrative standpoint, Maven takes a lot of the guesswork out of project
    builds. Admins don’t have to manipulate build scripts, download shared'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'libraries, or do any sort of up-front prep work, because Maven is generally
    able to handle these tasks on its own. Even if admins don''t know anything about
    the project they might be building, they can generally build it in a matter of
    seconds by simply typing in the command `mvn install` at their command prompt.


    # Working with Maven in Eclipse


    Although Apache Maven is a standalone tool that can be downloaded and run from
    the command line, for SAP HCP development we''ll generally prefer to interact
    with it from within the Eclipse IDE. If you followed along with the IDE installation
    instructions described in Chapter 2, then you should find that Maven is included
    with your Eclipse installation.


    The Maven plug-ins in Eclipse allow you to create Maven projects in one of two
    ways. You can either create a Maven project from scratch or you can convert an
    existing project into a Maven project after the fact. Which approach you take
    in the course of your normal development is a matter of preference. However, because
    most SAP HCP tutorials are predicated on the use of the Eclipse Dynamic Web project,
    we thought it would be more beneficial to demonstrate how to convert existing
    projects since that will be the more typical scenario. The steps are as follows:


    +   1. Select the project you wish to convert, right-click on it, and select the
    CONFIGURE • CONVERT TO MAVEN PROJECT menu option, as shown in Figure 4.42.


    +   2. This will open the Create New POM dialog box shown in Figure 4.43. Here,
    you must enter your Maven “project coordinates” by specifying the group/artifact
    ID and version number. Collectively, these attributes uniquely identify your project
    within the Maven repository. This in turn allows other projects to create defined
    dependencies to your project down the line. Aside from these key attributes, you
    need to specify the packaging type and provide a meaningful name for your project.
    As you can see in Figure 4.43, we selected the packaging type WAR, because we''re
    converting a Dynamic Web project that will ultimately generate a WAR file.


    +   3. Once all of the POM details are specified, click on the Finish button to
    complete the project conversion process.'
  merge: -1
  img_proc: true
