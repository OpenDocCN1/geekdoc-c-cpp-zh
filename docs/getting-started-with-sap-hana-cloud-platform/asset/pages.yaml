    \ goal is to integrate our source code into a deployable application (e.g., as\
    \ a WAR file) and install it on a test environment so that end users/testers can\
    \ run through more elaborate test scenarios. The complexity of this task depends\
    \ on multiple factors:\n\n+   ▶ **Landscape differences**\n+   \n+   Various organizations\
    \ may choose to configure their SAP HCP landscapes in different ways. Some organizations\
    \ might have dedicated consolidation/test instances, whereas others may prefer\
    \ to run tests using local instances and/or trial landscape-based instances.\n\
    \n+   ▶ **Application complexity**\n+   \n+   For simple Java-based web applications,\
    \ we've seen how easy it is to create a WAR file from within the Eclipse IDE.\
    \ On the other hand, large, multi-module applications can be much more difficult\
    \ to build and deploy. Here, multiple steps are usually needed to complete the\
    \ build.\n\n+   ▶ **Environmental differences**\n+   \n+   Depending on the aforementioned\
    \ landscape differences, we could also have to account for environmental differences.\
    \ For example, as we'll learn in Chapter 6, the setup required to consume SAP\
    \ HCP services can be very different when working with local instances versus\
    \ remote cloud instances.\n\nAlthough we can't avoid such complexities, there\
    \ are tools out there that can automate and streamline this process. We'll explore\
    \ the use of a couple of tools in this space in Section 4.4.\n\nAfter the integration/testing\
    \ phase is completed, we're ready to move on to the deployment phase, in which\
    \ we deploy our application(s) to a productive SAP HCP instance. In Section 4.2,\
    \ we'll learn how the SAP HCP tools make it fairly easy to perform this task.\
    \ However, much like the integration/testing phase, this step could be complicated\
    \ by environmental differences and the like.\n\nPerhaps even more challenging\
    \ is the typical “division of labor” requirement that many organizations have\
    \ in place that prevents developers from deploying their own applications. Logistically,\
