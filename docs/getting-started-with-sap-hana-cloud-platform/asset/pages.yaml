    # ## 2.2 What''s in the Box?


    Now that you''ve gotten your hands on a shiny new SAP HCP account, let''s take
    a moment to unwrap the packaging and see what''s included out of the box with
    SAP HCP. In addition to helping you understand more about what SAP HCP provides
    on a technical level, this brief analysis will also help you recognize the types
    of tools you''ll need to install and configure in order to start developing SAP
    HCP applications.


    # ### 2.2.1 Application Runtime Containers


    As we noted in Chapter 1, SAP HCP was designed from the ground up to support a
    wide variety of programming models. This BYOL (bring your own language) approach
    lowers the entry barrier to SAP HCP by allowing development teams to leverage
    preexisting skillsets when migrating to the platform.'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'In order to support multiple programming languages, SAP HCP employs the use
    of a series of modular and lightweight runtime containers. These containers provide
    a secure and scalable runtime environment for running applications based on a
    particular programming model (e.g., Java).


    Next, we''ll take a closer look at the types of runtime containers included with
    SAP HCP. We''ll also look ahead a bit and see what other container types SAP has
    on the roadmap in the near term.


    # Runtime for Java


    Going back to the days when it went by the codename “NEO,” SAP HCP has always
    had excellent support for Java-based application development. From a technical
    perspective, the Java applications that we develop are deployed in a specialized
    runtime container called Runtime for Java. Figure 2.5 illustrates the basic architecture
    of Runtime for Java. As you can see, the basis for this runtime environment is
    the Compute Unit. As consumers of SAP HCP, we can think of Compute Units as virtualized
    host machines complete with their own CPU(s), main memory, disk space, and an
    installed operating system.


    ![](img/cf7012644082c115a2181376d9b7486d_47_0.png)


    Figure 2.5 Architecture of the Runtime for Java


    From a Java development perspective, the basis of a Compute Unit is the Java Virtual
    Machine (JVM). Here, SAP utilizes a proprietary JVM derived from Oracle''s'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'HotSpot JVM called the SAP JVM. Compared to the default JVM provided by Oracle,
    SAP JVM offers a number of useful features related to debugging, memory profiling,
    and instrumentation.


    On top of the SAP JVM, we have the Application Runtime Container, shown in the
    middle of the architecture diagram contained in Figure 2.5. If you''re familiar
    with Enterprise Java development, then you can think of the Application Runtime
    Container as being analogous to web containers you may have worked with, such
    as Apache Tomcat or any of the number of leading Java EE application containers
    on the market. In essence, the Application Runtime Container furnishes our Java-based
    web applications with all of the libraries and services they need to get the job
    done.


    As of the time of writing, SAP allows us to configure the Application Runtime
    Container according to three different profiles:


    +   - **Java EE 6 Web**

    +   This profile provides the full complement of APIs offered by the Java EE 6
    Web profile. Here, in addition to Servlets and JavaServer Pages (JSPs), we also
    have access to Enterprise JavaBeans (EJBs), the Java Transaction API (JTA), the
    Java Persistence API (JPA), and more. These APIs simplify the enterprise application
    development process by assuming ownership of lower-level technical concerns, such
    as transaction management, object-relational persistence, and so on. For more
    about the Java EE 6 Web profile, see the boxed note ahead.


    +   - **Java Web**

    +   According to the online help documentation, the Java Web profile offers “a
    subset of Java EE standard APIs typical for a standalone Java Web Container.”
    An example of a typical web container is the popular Apache Tomcat container.
    Such containers provide support for developing Java web applications using Servlets,
    JSPs, and so on. They do not, on the other hand, support the entire Java EE API.
    This means that you cannot utilize other Java EE-based technologies (such as EJBs)
    on the Java Web container. Of course, you still have access to the full Java SE
    library, as well as all of the custom SAP HCP service APIs.


    +   - **Java Web Tomcat 7**

    +   This profile (which is in beta release as of the time of writing) offers similar
    functionality to the Java Web profile. The primary difference is that the web
    container for this profile leverages the Apache Tomcat 7 web server without'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'modifications. This implies that certain cloud-based services will not be available
    at runtime.


    # What Is the Java EE 6 Web Profile?


    The Java EE 6 Web profile was introduced in conjunction with the Java EE 6 specification.
    Conceptually, you can think of the Java EE 6 Web profile as a stripped-down version
    of the Java EE stack. Here, a subset of the common APIs used to develop Java-based
    web applications were grouped into a separate profile that application server
    vendors could use to build lighter-weight application containers. Naturally, such
    profiles make a lot of sense for cloud-based software providers such as SAP.


    As developers, it''s only natural to assume that "stripped down" implies "less
    awesome." In this case, however, we think you''ll find that the APIs that were
    taken out have little to do with cloud-based application development. For example,
    it''s probably unlikely that you would need access to RMI/CORBA-based remoting
    when developing web applications in the cloud. In other cases, you will find that
    there are cloud-based services that offer features that are similar (and arguably
    better) than the missing Java EE APIs. We''ll find examples of this as we progress
    throughout the book.


    One final distinction we should make here is with regards to EJB support in the
    Java EE 6 Web profile. Although the profile does include support for EJB development,
    it utilizes a specialized specification called EJB Lite. EJB Lite is a subset
    of the EJB 3.1 specification that provides support for session beans (stateful
    and stateless), singleton beans, and the associated container-management features.
    Notably absent here are message-driven beans, JAX-WS endpoints, remoting, and
    backwards compatibility to EJB 2. Because these features aren''t really used for
    web application development, this omission doesn''t really impact the way we approach
    application design, but it''s important to understand the differences all the
    same.


    We''ll have an opportunity to delve into Java-based application development beginning
    in Chapter 3.


    # Further Resources


    You can access the Java web help documentation online at http://help.hana.ondemand.com.
    Within the SAP HANA CLOUD PLATFORM section, navigate to JAVA DEVELOPMENT • RUNTIME
    FOR JAVA to learn more about the latest innovations in this space.


    # SAP HANA Runtime


    One of the distinguishing features of SAP HCP is its built-in support for in-memory
    computing with SAP HANA. This support exists on two levels:'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Basic database access


    In this scenario, applications are developed using a general-purpose programming
    language (such as Java), and the SAP HANA database is used as the underlying database.
    Here, the SAP HANA database is used just like any other relational database management
    system (RDBMS), providing access using standard SQL.


    # Full-scale native SAP HANA development


    In this scenario, applications are built from the ground up using native SAP HANA-based
    development artifacts (e.g., SQLScript-based stored procedures, server-side JavaScript,
    and custom view types). This approach is ideal for the development of analytical
    applications, which deal with lots of data.


    In the latter usage scenario, the native SAP HANA development objects are deployed
    on the SAP HANA Runtime, which is essentially a cloud-based SAP HANA Extended
    Application Services (SAP HANA XS) instance.


    # What is SAP HANA XS?


    If you''re not familiar with SAP HANA XS, then a brief introduction is in order.
    In essence, SAP HANA XS introduces a full-featured application server that sits
    directly on top of the SAP HANA database. This application server can be used
    to develop web applications based on technologies such as SAPUI5, server-side
    JavaScript, and native SAP HANA development objects (e.g., SQLScript procedures
    and analytical views). Because SAP HANA XS sits on top of (and is tightly integrated
    with) the SAP HANA database, native applications deployed on this application
    server enjoy the benefits of having localized access to data. By eliminating the
    overhead of transferring data from the database tier to the application tier,
    native applications can churn through large amounts of data very quickly. For
    this reason, SAP HANA XS is well suited for building analytical applications and
    the like.


    Within SAP HCP, the SAP HANA XS application server plays a similar role as Runtime
    for Java. It provides an application server that we can use to create web applications.
    Here, we can go about constructing SAP HANA native applications in much the same
    way that we would develop such applications on-premise.


    To put all this into perspective, consider the basic architecture of an SAP HANA
    native application deployed on SAP HCP. As you can see in Figure 2.6, the client
    tier of this application is based on SAPUI5 technology. The SAPUI5 content is
    served up to clients by the SAP HANA XS engine, which includes a built-in web
    server. Because of the ubiquitous nature of HTML5, such content can be'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'consumed by PCs, tablets, or smartphones without requiring the installation
    of any client software (e.g., the SAP GUI client).


    ![](img/cf7012644082c115a2181376d9b7486d_51_0.png)


    Figure 2.6 Basic Architecture of an SAP HANA Native Application


    On the server side of things, we can see how the application logic is distributed
    between the SAP HANA XS engine and underlying SAP HANA database. Which layer(s)
    we choose to implement our logic depends largely on the requirements. For example,
    if all we’re doing is performing simple CRUD (create, remove, update, and display)
    operations, then basic SQL/ SQLScript should generally suffice. On the other hand,
    if the requirements call for lots of procedural logic, then we’ll need access
    to more general-purpose language, such as server-side JavaScript. In this case,
    it makes sense to exploit the capabilities of the SAP HANA XS engine in tandem
    with pure SQL/ SQLScript.


    The communication channels between the client tier and the SAP HANA XS back-end
    are primarily defined using the OData protocol. This REST-based protocol is used
    to create lightweight web services that can easily be consumed via JavaScript
    and SAPUI5 widgets. We’ll have an opportunity to see how all this comes together
    in Chapter 5.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# # HTML5 Application Container


    For UI-centric application scenarios, SAP HCP also provides support for the deployment
    of HTML5 applications. These lightweight applications are deployed to a Git repository,
    from which their static resources (e.g., HTML, JavaScript, and CSS) are served
    up via a shared dispatcher service embedded within SAP HCP itself. We’ll learn
    more about how all this works in Chapter 7.


    # # More Runtime Containers on the Horizon


    As of the time of writing, SAP has made it made it known that there are plans
    for dramatically increasing the scope of SAP HCP language support based on strategic
    partnerships with Cloud Foundry and Docker. Once this integration is in place,
    SAP HCP will truly support BYOL through a series of new runtime containers that
    are more generic in nature. For now, support for most of the popular cloud development
    languages must be deployed via the Runtime for Java via third-party implementations,
    such as JRuby, Jython, and so forth.


    # ## 2.2.2 SAP HCP Enablement Services


    As a true PaaS solution, SAP HCP provides much more than just a series of stand-alone
    runtime containers. It includes a series of enablement services that provide an
    abstraction around the access and consumption of cloud-based resources. Table
    2.1 contains a list of the more prominent services provided by SAP HCP as of the
    time of writing. As you’re reading this, keep in mind that the service offering
    continues to expand, so it’s definitely a good idea to periodically check in with
    the SAP HANA Cloud Documentation to see what’s new.


    | Service | Description |

    | :--- | :--- |

    | Persistence Service | This service provides an abstraction on top of relational
    database instances deployed in the cloud. This abstraction provides developers
    with a common interface for accessing database instances while at the same time
    shielding them from the underlying complexities of scaling databases in the cloud.
    |

    | Connectivity Service | This service provides developers with a means of transparently
    communicating with remote services that could be hosted either on-premise or elsewhere
    on the Internet. |


    Table 2.1 Enablement Services of SAP HCP'
  merge: -1
  img_proc: true
- pgno: 53
  md: '| Service | Description |

    | :--- | :--- |

    | Document Service | This service provides access to a content repository for
    storing unstructured content. It can also be used to implement a sort of virtualized
    file system as needed. |

    | Identity Service | The term "Identity Service" is the name given to a series
    of security-related services or features integrated into SAP HCP. Some highlights
    in this offering include support for single sign-on (SSO) scenarios, identity
    federation with the Security Assertion Markup Language (SAML), and authorization
    based on the OAuth protocol. |

    | Feedback Service | This service provides a framework for implementing user feedback
    scenarios in cloud applications. |


    Table 2.1 Enablement Services of SAP HCP (Cont.)


    # ## 2.2.3 Higher-Level Services


    In addition to the core services described in Section 2.2.2, the SAP HCP PaaS
    offering is rounded out by a series of higher-level application services that
    provide specialized capabilities needed in certain cloud-based application scenarios.
    Next, we’ll highlight a few of the more prominent services included in this offering.


    # ### SAP HANA Cloud Portal


    SAP HANA Cloud Portal is a cloud-based portal solution that makes it easy to create
    lightweight portal sites that combine cloud applications, cloud application extensions,
    and on-premise content to create a seamless UI experience. By using open standards
    like HTML5 and OpenSocial, SAP HANA Cloud Portal makes it easy to integrate content
    from disparate sources without having to reinvent the wheel. We’ll see how this
    works firsthand in Chapter 9.


    # ### SAP HANA Cloud Integration


    In many respects, you can think of SAP HANA Cloud Integration (SAP HCI) as a cloud-based
    version of SAP’s on-premise SOA middleware tool, SAP Process Integration (PI).
    This is to say that SAP HCI is a cloud-based middleware service that allows you
    to develop integration scenarios in the cloud. These scenarios might'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'be needed for one-time uploads of on-premise data or ongoing real-time lookups
    to on-premise systems. We''ll discuss SAP HCI in more detail in Chapter 10.


    # SAP HCP Mobile Services


    This service is used to help developers roll out mobile applications. Some of
    the more prominent features provided with SAP HCP Mobile Services include the
    following:


    +   - Support for user onboarding

    +   - Security and authorization services

    +   - Support for implementing native push notifications

    +   - Support for implementing offline support for mobile applications

    +   - Administration and monitoring of mobile applications


    We''ll take a closer look at SAP HCP Mobile Services in Chapter 12, which is available
    for download at www.sap-press.com/3638.


    # 2.3 Installing SAP HCP Development Tools


    In the previous section, we learned how SAP is really focused on positioning SAP
    HCP as an open and inviting platform for developers. Although this openness is
    unquestionably a good thing, it does make the task of setting up our development
    environments a little bit more complex, because there are so many types of development
    objects that we have to account for.


    In this section, we''ll take a look at what a typical tools setup looks like so
    that you''ll have the necessary tools in place to work through the examples described
    in this book. We emphasize the term "typical" here because tool configurations
    will tend to differ in subtle ways between developers. Fortunately, because SAP
    HCP is standardized around the extensible Eclipse integrated development environment
    (IDE), these differences usually amount to the installation of a few plug-ins
    here and there.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# 2.3.1 Setting Up the Eclipse IDE


    SAP elected to standardize the SAP HCP toolset around the open-source Eclipse
    IDE. This approach allows SAP to leverage the built-in development functions of
    the core Eclipse IDE and merely supplement with SAP HCP-specific features as needed.
    Plus, because Eclipse is arguably the most popular IDE in the world, it offers
    the added benefit of requiring little to no introduction for the average developer.


    In this section, we’ll take a look at how to set up a new instance of Eclipse
    and install the relevant plug-ins from the SAP HCP Tools library.


    # Installing the Java SDK


    Before you can install Eclipse, you first need to make sure that you have the
    appropriate version of Java installed on your local machine. Although modern versions
    of Eclipse only require the installation of the more lightweight Java Run-time
    Environment (JRE), we recommend that you go ahead and install the full Java SE
    software development kit (SDK), which is available online at www.oracle.com/technetwork/java/javase/downloads/index.html.
    This will ensure that you have the full complement of compiler tools needed to
    carry out various development tasks.


    When installing the Java SDK, you’ll want to download the version that best fits
    with the target Application Runtime Container profile you plan to work with in
    Runtime for Java (refer back to Section 2.2.1). For example, as of the time of
    writing, the available container profiles are based on Java EE versions 6 and
    7. Therefore, if you’re working with the Java Web Tomcat 7 profile, then you’d
    want to download and configure version 7 of Java SE.


    # Downloading and Installing Eclipse


    In order to maximize flexibility, SAP developed SAP HCP Tools to work with most
    recent versions of the Eclipse IDE. Therefore, if you already have a recent version
    of Eclipse lying around, it should be possible to install SAP HCP Tools on top
    of that instance if you so choose. However, given the large number of plug-ins
    associated with an SAP HCP Tools instance, we recommend that you download and
    configure a separate instance of Eclipse for SAP HCP development.'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'To download Eclipse, go to www.eclipse.org/downloads in your web browser. From
    the main DOWNLOADS page, download the latest version of Eclipse IDE for Java Developers
    for your target operating system, as shown in Figure 2.7.


    ![](img/cf7012644082c115a2181376d9b7486d_56_0.png)


    Figure 2.7 Downloading Eclipse IDE for Java Developers


    The installation bundle that you download will be a zipped archive that you can
    unpack to a directory of your choosing. Once you unpack the bundle, you can launch
    Eclipse for the first time by opening up the Eclipse folder and running the executable
    eclipse file (e.g., eclipse.exe).


    As Eclipse loads for the first time, you''ll likely be presented with the Workspace
    Launcher dialog box shown in Figure 2.8. Within this dialog box, you must select
    a directory on your local machine that Eclipse can use to store project artifacts
    and the like. Normally, it''s a good idea to select the USE THIS AS THE DEFAULT
    AND DO NOT ASK AGAIN checkbox so that Eclipse will use the selected directory
    as its default location. That way, Eclipse won''t pester you about choosing a
    location'
  merge: -1
  img_proc: true
