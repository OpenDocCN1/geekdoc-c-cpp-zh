    the context of a LESS file (see the boxed note ahead) that gets uploaded into
    the theme catalog using the ADD THEME link.


    ![](img/cf7012644082c115a2181376d9b7486d_412_0.png)


    Figure 9.24 Maintaining Themes within the SAP HANA Cloud Portal Authoring Space


    # What is LESS?


    LESS is a dynamic stylesheet language that’s compiled and parsed into Cascading
    Style Sheets (CSS) content. If you’re familiar with XSLT, then you can equate
    the relationship between LESS and CSS with the relationship between XSLT and XML.
    Compared with static CSS content, LESS provides developers with a programming
    context that can be used to automate certain tasks and speed up the design process.
    LESS files can be edited using any text editor, though there are IDE plug-ins
    out there that provide a certain amount of syntax highlighting and code completion.
    For brevity’s sake, we won’t say much about LESS here. However, as an open standard,
    you’ll find a wealth of resources online. Also, if you’re looking for a quick
    deep dive into LESS, we recommend LESS CSS Preprocessor How-To (Libby, Packt Publishing,
    2013).'
