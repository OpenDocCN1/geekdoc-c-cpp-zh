- pgno: 108
  md: 'In order to develop production-quality SAP HCP applications, we need to have
    the necessary tools and processes in place to manage the software development
    lifecycle from start to finish. In this chapter, we’ll look at some of the tools
    and processes you can use to manage and deploy Java-based SAP HCP applications.


    # # 4 Managing and Deploying Java Applications


    In the previous chapter, we observed how the SAP HCP tools make it easy to develop,
    deploy, and test Java-based web applications from within the Eclipse IDE. In the
    early phases of development, these tools provide us with everything we need to
    get the job done. However, as we progress a little bit further along in the software
    development lifecycle, matters become much more complicated.


    With that in mind, this chapter will consider how to develop a software logistics
    infrastructure for SAP HCP development. Although the focus in this chapter will
    be primarily on Java-based development, many of the concepts and tools introduced
    will also apply toward the development of other types of SAP HCP applications
    (e.g., HTML5 applications). Indeed, regardless of the language you use to develop
    SAP HCP applications, you’ll find that SAP has provided an open environment that
    makes it possible to take advantage of just about any logistics tool available
    on the market. This allows organizations to easily tailor your SAP HCP development
    to align with corporate standards and best practices.


    # ## 4.1 Overview


    Let''s face it: Software logistics is one of the more boring topics in the world
    of software engineering. For many developers, the mere mention of the subject
    evokes images of piles of red tape, tedium, and nasty emails from development
    managers trying to keep everyone in line. Still, despite its bad rap, software'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'logistics is not something to be taken lightly. After all, without the proper
    methods and procedures in place, we might inadvertently cause application outages,
    data corruption, or various other mistakes that can cost organizations dearly.


    Even if you''re lucky enough to be the master of your own little corner of the
    SAP HCP universe, keeping track of all the source code files that accumulate over
    time is not a trivial task. For developers working in larger organizations, this
    problem is compounded by the fact that development tasks are often split up among
    developers around the globe. Here, it''s vital that the developers have some sort
    of centralized repository to keep track of the various artifacts being created
    and shared among team members. We''ll explore some options for creating such repositories
    in Section 4.3.


    In addition to keeping track of source code, there are several other logistical
    issues of similar importance for us to think about: application builds, transports,
    and long-term support. To put these concerns into perspective, consider the software
    development lifecycle diagram depicted in Figure 4.1. In this (simplified) diagram,
    we can observe the high-level stages of the software development process.


    ![](img/cf7012644082c115a2181376d9b7486d_109_0.png)'
  merge: -1
  img_proc: true
- pgno: 110
