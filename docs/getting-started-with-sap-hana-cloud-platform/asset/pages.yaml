- pgno: 81
  md: '# 3.2.2 Building the Servlet-Based Controller


    With our Dynamic Web project now in place, we''re ready to begin developing the
    actual application artifacts. In keeping with the traditional model-view-controller
    (MVC) paradigm, we''ll start our development from the bottom up with the creation
    of a hybrid model-controller layer. As mentioned earlier, we''ll implement this
    layer using a faceless Java Servlet class.


    To create the Servlet, right-click on the development package created in Section
    3.2.1 and choose the NEW > SERVLET menu option, as shown in Figure 3.6. Then,
    in the CREATE SERVLET dialog box (Figure 3.7), specify the Servlet class name
    (ReadingListServlet), and click on the Finish button to confirm your selection
    and create the new Servlet class.


    ![](img/cf7012644082c115a2181376d9b7486d_81_0.png)


    Figure 3.6 Creating the Servlet Controller Class: Part 1'
  merge: -1
  img_proc: true
- pgno: 82
  md: '![](img/cf7012644082c115a2181376d9b7486d_82_0.png)


    Figure 3-7 Creating the Servlet Controller Class: Part 2


    After the Servlet class is created, we''ll want to plug in our custom application
    logic inside the doPost() method, as shown in Listing 3.1. Here, the logic is
    pretty straightforward:


    +   1. First, create a variable of type java.util.List called readingList. This
    variable will be used to store the book entries in the user''s reading list. Because
    our trivial application is not backed by a database, we''ll simply store this
    transient collection inside the user''s session context. Note that once this list
    instance is created, we''ll simply fetch it from the session context in subsequent
    calls to simulate access to a persistence store.


    +   2. Next, retrieve the name of the book the user wants to add to the list by
    using the getParameter() method of the HttpServletRequest variable passed via
