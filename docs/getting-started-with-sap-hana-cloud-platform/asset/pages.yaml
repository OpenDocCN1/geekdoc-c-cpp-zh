- pgno: 123
  md: '# Integration with external build tools


    For organizations that utilize standard build tools (e.g., Apache Maven), it''s
    important to be able to incorporate the deployment step into those tools.


    For these reasons (and many others), SAP provides a command-line tool called the
    Console Client, which can be used to perform administrative tasks, such as deployment
    from the command line. In this section, we''ll see how this tool can be used to
    facilitate deployments.


    # Getting Started with the Console Client


    Before we begin looking at how the Console Client is used to facilitate deployments,
    let''s first take a moment to understand what it is and what it brings to the
    table from an administrative perspective. In a nutshell, the Console Client is
    an executable file that launches a command prompt in which we can issue various
    commands to interact with an SAP HCP server instance. In this regard, it serves
    the same purpose as the command (DOS) prompt in MS Windows or the terminal in
    Unix, Linux, or Mac OS systems.


    For the most part, the Console Client is the command-line analog of the UI-based
    instrumentation tools provided in the Eclipse IDE and online SAP HCP Cockpit.
    This is to say that there are commands provided to perform most basic administrative
    tasks, such as starting and stopping server instances, maintaining accounts, triggering
    deployments, and so on. Aside from being convenient for admin types who prefer
    to work via a command prompt, this feature opens up all kinds of opportunities
    for automation via shell scripts and so on.


    To access the Console Client, open a command prompt and navigate to the roots
    subdirectory of your SAP HCP SDK installation folder. Within this directory, you''ll
    find an executable file called neo.bat (Windows) or neo.sh. From here, you can
    launch commands via the syntax illustrated in Listing 4.1.


    ```

    $ neo <Command name> <mandatory parameters> [optional parameters]

    ```


    Listing 4.1 Syntax for Executing a Command within the Console Client


    > Note

    > Alternatively, you can add the Console Client executable to your OS'' path variable
    so that you can launch the client from anywhere.'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'For example, if we wanted to know the status of an application on an SAP HCP
    cloud instance, then we might issue the status command, as illustrated in Listing
    4.2.


    ```

    $ neo status --account p1234567 --application example0401 --host hanatrial.ondemand.com
    --user abc@123.com

    ```


    # Listing 4.2 A Sample Command Test


    As you can imagine, keying in all the parameters required to issue particular
    commands can become quite tedious if you spend a great deal of time within the
    Console Client. Recognizing this, SAP lets you externalize some of the parameters
    that you use over and over again (i.e., user name, account name, and landscape
    host) in a .properties file. That way, rather than having to key in these properties
    for each command, you can simply issue the command using a syntax like the one
    shown in Listing 4.3.


    ```

    $ neo <command name> [properties] <properties file location>

    ```


    # Listing 4.3 Simplifying Commands Using Properties Files


    If you''re interested in learning more about some of the various commands offered
    by the Console Client, we highly recommend that you take a look at the Console
    Client • Console Client Commands section of the SAP HANA Cloud Documentation available
    online at http://help.hana.ondemand.com. There, you will find a complete list
    of supported commands and their call syntax. There''s also a link to a video tutorial
    that demonstrates how to interact with the client.


    # Triggering a Local Deployment


    Triggering a deployment to a local SAP HCP instance using the Console Client is
    generally a three-step process:


    +   1. Use the install-local command to perform a one-time installation of a local
    server instance within the <SDK installation folder>/server directory.

    +   2. Generate WAR files for the application(s) that you want to deploy.

    +   3. Use the deploy-local command to hot deploy the target WAR file(s).


    Strictly speaking, the first step in the local deployment process is an optional
    one. Internally, the Console Client assumes that the local server instance it''s
