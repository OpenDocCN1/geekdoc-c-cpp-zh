- pgno: 170
  md: 'One of the more compelling features of SAP HCP is its support for native SAP
    HANA development in the cloud. In this chapter, we''ll take a look at these capabilities
    and learn how to develop new applications on this platform.


    # # 5 Developing Native SAP HANA Applications


    In its relatively short lifespan, SAP HCP has experienced a number of significant
    transformations. From the early days in 2011 when SAP HCP went by the name SAP
    NetWeaver Cloud (or NEO), to the mature solution that''s emerged today, we''ve
    certainly seen a lot of new features come along in the last several years.


    One of the more notable additions to the SAP HCP toolset arrived in late 2013,
    when SAP first announced (limited) support for native SAP HANA development in
    SAP HCP. It was at this point that SAP HCP transcended from a generic PaaS solution
    with a feature set similar to other leading PaaS solutions of the time (e.g.,
    the Google App Engine and Amazon Web Services) into something that''s truly unique
    within the industry. After all, there''s really no other platform out there that
    compares with SAP HANA.


    In this chapter, we''ll take a look at what it takes to develop native SAP HANA
    applications on SAP HCP. Although we won''t realistically be able to cover all
    of the tools and services provided as part of the SAP HANA platform, our goal
    is to sufficiently cover the basics so that you understand enough about how SAP
    HANA technology is integrated into SAP HCP that you''ll be able to leverage other
    SAP HANA-specific resources to fill in the gaps where needed. Indeed, once you
    get a feel for how SAP HANA technology is integrated into SAP HCP, we think that
    you''ll find the cloud-based development experience to be very similar to the
    on-premise experience. If you already have experience developing native SAP'
  merge: -1
  img_proc: true
- pgno: 171
  md: "HANA applications on-premise, then you'll find the transition to development\
    \ in the cloud to be quite straightforward.\n\n> **Note**\n> \n> While this chapter\
    \ explores the possibilities for native SAP HANA development using the free SAP\
    \ HCP developer accounts, keep in mind that—although quite flexible—free accounts\
    \ have some features restricted. For example, you do not get full database administrator\
    \ rights (you're only able to manage your schemas) and you can't install software\
    \ distribution units (SDUs).\n> \n> To get a full-featured SAP HANA instance,\
    \ you need a commercial SAP HCP account, which is typically equipped with a dedicated\
    \ SAP HANA instance. This enables software developers to develop multi-tenant\
    \ cloud applications and leverage all the features in subsequent SAP HANA releases\
    \ (while still making local decisions on what to share and what to isolate between\
    \ different tenants).\n\n# 5.1 Overview\n\nBack in Chapter 2, we touched on the\
    \ positioning of SAP HANA technology within SAP HCP. We identified two primary\
    \ usage scenarios:\n\n+   **Basic database access**\n+   \n+   In this scenario,\
    \ the SAP HANA database is used as the backend database for applications developed\
    \ using general-purpose languages, such as Java. Here, the SAP HANA database plays\
    \ a role that's similar to those of other SAP HCP-supported databases, such as\
    \ SAP MaxDB.\n\n+   **Full-scale native SAP HANA development**\n+   \n+   In this\
    \ scenario, applications are developed from the ground up using native SAP HANA\
    \ development objects, such as server-side JavaScript files, analytic views, stored\
    \ procedures, and so on. These applications are deployed onto a virtualized SAP\
    \ HANA instance that's included with an SAP HCP account. The basic architecture\
    \ for this type of application is illustrated in Figure 5.1."
  merge: -1
  img_proc: true
- pgno: 172
  md: '![](img/cf7012644082c115a2181376d9b7486d_172_0.png)


    # Figure 5.1 Basic Architecture of an SAP HANA Native Application


    In this chapter, our focus will be on the development of native SAP HANA applications
    (we’ll cover the basic database access scenario in Chapter 6). You’ll learn how
    to set up a (trial) SAP HANA XS instance, create new SAP HANA XS applications,
    and deploy the finished product. As we move through the material, we’ll endeavor
    to keep this introduction gentle enough so that you can follow along even if you’re
    new to SAP HANA development. Having said that, though, we should point out that
    this chapter is by no means meant to be a thorough treatment of SAP HANA development
    concepts. For this, there are a variety of resources you can pull from, including
    the following:


    +   - SAP HANA: An Introduction, 3rd Edition (Berg, Silvia, SAP PRESS, 2014)

    +   - Implementing SAP HANA, 2nd Edition (Haun et al., SAP PRESS, 2015)

    +   - Introduction to Software Development on SAP HANA (an online introductory
    course to SAP HANA development hosted on SAP''s openSAP learning platform, available
    online at https://open.sap.com/courses/hana1-1)'
