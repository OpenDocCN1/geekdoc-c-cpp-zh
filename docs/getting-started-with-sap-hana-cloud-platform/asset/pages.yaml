- pgno: 430
  md: '# ## 9.5 Next Steps


    Despite being positioned as a service within SAP HCP, one could certainly make
    the argument that SAP HANA Cloud Portal is a product unto itself. Indeed, with
    so many powerful features, it’s difficult to do SAP HANA Cloud Portal justice
    in an introductory chapter like this one. Still, we hope that we’ve provided you
    with a good enough foundation to take the next steps on your journey.


    What are these next steps, you might ask? For developers, there’s obviously an
    emphasis on learning the ins and outs of the OpenSocial standard for widget development,
    LESS for theming, and so forth. For the foreseeable future, though, it’s also
    vitally important that developers learn their way around SAP HANA Cloud Portal’s
    administrative tools. This is because the lines between content developer and
    content administrator will likely be blurred for a while as SAP HANA Cloud Portal
    matures.


    The day-to-day administrative tasks are described in the online help documentation,
    undergo the section titled “SAP HANA Cloud Portal–User Guide.” Within this guide,
    you can find details about how to configure site security, translate site content,
    and configure the use of standard-delivered widgets. Even if you never plan on
    performing an SAP HANA Cloud Portal administrative task, this is good knowledge
    to have, because it helps you develop with the platform instead of against it.


    # ## 9.6 Summary


    In this chapter, we provided you with a whirlwind introduction to SAP HANA Cloud
    Portal. As we observed, this SAP HCP service provides a rapid development environment
    for building mashup sites. As such, it’s central to a lot of the extension application
    development that goes on in SAP HCP.


    In the next chapter, we’ll take a look at another useful service offering within
    SAP HCP: SAP HANA Cloud Integration (SAP HCI). Here, we’ll see how this service
    can be used to build complex integration scenarios between applications hosted
    on the cloud and on-premise.'
  merge: -1
  img_proc: true
