- pgno: 14
  md: '# Foreword by Matthias Steiner


    We live in a time of accelerated change, in a world in which companies fight over
    market share on a global scale. In this competitive environment, it’s more important
    than ever for enterprises to focus on their core business, to differentiate themselves
    from their competitors, and to provide products and services that deliver immediate
    value to their customers. Software has become a key enabler to help companies
    adapt to changing market trends by both streamlining and reinventing their internal
    processes as well as empowering them to develop innovative solutions. As such,
    it’s up to us developers to lead this digital evolution and shape a world that
    is driven by software.


    Having made a living as a software architect for more than a decade, I understand
    that developing enterprise software solutions is far from being a trivial task.
    Complex system landscapes, ever changing business requirements, and pressing timelines
    are not an exception, but the norm. Consequently, developers need first class
    tooling that supports them in their daily tasks and enables them to focus on their
    job: converting business requirements into viable software solutions.


    This is the problem space that SAP HANA Cloud Platform addresses: It’s a design
    and runtime environment designed from the ground up to empower developers to build,
    extend, and run next generation business applications in the cloud. Based on SAP
    HANA, SAP’s in-memory technology platform, this Platform-as-a-Service (PaaS) offering
    provides customers and partners with the comprehensive set of services and capabilities
    needed to efficiently develop business solutions for an increasingly connected
    world.


    Nowadays, where everything from people (social media), to companies (business
    networks), up to individual devices (Internet of Things) are connected to each
    other, the cloud has became the catalyst for a global digital business transformation.
    It’s the backbone of the mobile movement and the enabler for big data scenarios
    requiring lots of computing power. With SAP HANA Cloud Platform, SAP offers a
    cloud platform that enables developers to support their companies—and ultimately
    their customers—to leverage the opportunities accompanying this transformation.'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'In this book, James, Krassi, John, and Riley provide a comprehensive overview
    of SAP HANA Cloud Platform and its related technologies and how they support companies
    to extend their business into the cloud. Based on their vast experiences gained
    as development consultants over the last decade, James and John are able to holistically
    address these aspects and cover both the business and the technical perspective.
    Their expertise is ideally complemented by the inside view provided by my colleagues
    Krassi and Riley, who both have been driving their respective topics internally
    at SAP. Together, their domain knowledge is second to none.


    The book focuses on concrete development scenarios and as such primarily targets
    solution architects and developers interested in understanding how to develop
    software solutions that excel in hybrid IT landscapes comprising both on-premise
    systems and cloud solutions. Starting with a general overview of cloud computing
    and SAP HANA Cloud Platform, the authors move on to address everything from getting
    started, to key technologies, up to advanced topics such as developing extensions
    for on-premise solutions and cloud applications alike.


    After reading this book, you will understand the full potential of SAP''s PaaS
    offering and how to leverage it for your own needs. Moreover, you''ll be equipped
    with a great set of examples to kick-start your own development projects based
    on SAP HANA Cloud Platform. As such, I hope you enjoy reading through this book—and
    I ultimately look forward to welcoming you to the fast-growing community of cloud
    developers.


    Happy coding!


    Matthias Steiner

    Cloud Platform Evangelist and SAP Mentor

    SAP HANA Cloud Platform'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Preface


    Since its initial release in late 2012, SAP HANA Cloud Platform (SAP HCP) has
    flown under the radar for many within the SAP community. However, with the release
    of the new SAP S/4HANA business suite and a continued push to integrate recent
    cloud software acquisitions, such as SuccessFactors, Ariba, and Concur, SAP HCP
    has begun to emerge as one of the key components in SAP’s overall cloud strategy.
    In essence, you can think of SAP HCP as the hub of the modern SAP technology landscape.


    With that being said, if you picked up this book because you want to learn what
    SAP HCP is all about, your timing couldn’t be better. In the months and years
    ahead, SAP HCP skills are sure to be in great demand. Whether you’re a seasoned
    SAP developer looking to transition your skills or a non-SAP developer looking
    to jump onboard the SAP cloud bandwagon, we think you’ve come to the right place.


    # Target Group and Prerequisites


    This book is intended for developers who are interested in learning how to develop
    applications on SAP HCP. Notice that we don’t say Java developers or ABAP developers.
    Because SAP HCP is an open platform that offers a bring your own language (BYOL)
    approach to development, developers from all walks of life are welcome here.


    Having said that, there are a few important prerequisites for being able to navigate
    through the material we cover here. Because this is a book about cloud application
    development, there is a natural expectation that the reader is reasonably familiar
    with core concepts, such as web application development, Internet technologies,
    and so forth. Although we do attempt to provide gentle introductions to new technologies
    wherever possible, this book cannot possibly cover these topics at the depth required
    to successfully develop cloud applications.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Structure of the Book


    In many ways, we found that our biggest challenge in writing this book was in
    putting some structure around it. From the point we embarked on this journey until
    the time we finalized the manuscript many months later, SAP HCP experienced incredible
    growth. In the end, we had to narrow our focus to the core concepts and technologies
    that represent the essence of SAP HCP.


    # Part I: Foundations


    In this section, we introduce SAP HCP and show you how to get up and running with
    the platform. This brief introduction sets the stage for the hands-on portion
    of the book.


    +   Chapter 1: Introduction to SAP HANA Cloud Platform


    In this chapter, we introduce you to the cloud computing phenomenon and SAP''s
    cloud strategy. Here, we attempt to establish the positioning of SAP HCP with
    the cloud and SAP landscapes.


    +   Chapter 2: Getting Up and Running


    This chapter introduces the various SAP HCP account types and shows you how to
    set up a free developer account that we''ll use to develop sample applications.
    We''ll also show you how to install and configure the relevant SAP HCP development
    tools.


    # Part II: Core Development Concepts


    In this section, we roll up our sleeves and demonstrate how to create custom web
    applications on SAP HCP. Along the way, we cover key logistics concepts and also
    consider key enablement services that can be used to round out the design of production-quality
    applications.


    +   Chapter 3: Developing Java Applications


    In this chapter, we''ll show you how to create Java-based web applications using
    the core Java EE APIs: Servlets, JavaServer Pages (JSPs), and Enterprise JavaBeans
    (EJBs). Along the way, we''ll become acquainted with the Eclipse IDE and SAP HCP
    SDK and demonstrate how these tools are used to test and debug Java applications.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Chapter 4: Managing and Deploying Java Applications


    This chapter explores some important logistical issues to consider when developing
    Java applications. Specific topics of interest include source code management,
    automated builds, deployment, and continuous integration. Also included in this
    chapter is an introduction to source code management with Git—a concept that we’ll
    revisit in Chapter 7 when we consider HTML5 application development.


    # Chapter 5: Developing Native SAP HANA Applications


    In this chapter, we show you how to create custom applications based on the native
    SAP HANA programming model. We begin by showing you how to set up SAP HANA instances
    within an SAP HCP account and then move into the specifics of creating new SAP
    HANA XS applications and developing SAP HANA-specific development objects. By
    the end of the chapter, we’ll have completed development on a fully functional
    mobile application that can be used to browse through the titles in a fictitious
    online bookstore.


    # Chapter 6: Consuming Cloud Services


    In this chapter, we teach you how to consume some of the key enablement services
    included with SAP HCP: the Persistence Service, Connectivity Service, and Document
    Service. To better demonstrate how these services are used, we develop a custom
    Java application that integrates features of all these services to create an approximation
    of a production-quality application.


    # Chapter 7: Developing HTML5 Applications


    This chapter explores the creation of lightweight HTML5 applications based on
    the relatively new HTML5 programming model within SAP HCP. Here, we provide a
    step-by-step demonstration that shows you how to create a new HTML5 application,
    synchronize its Git repository, and develop custom HTML5 application content.
    Along the way, we’ll introduce you to the new SAP Web IDE and also show you how
    to incorporate SAPUI5 technology into HTML5 applications.


    # Chapter 8: Securing Cloud Applications


    This chapter rounds out the core development section of the book by showing you
    how to secure SAP HCP applications. Here, we take a holistic approach and survey
    the various security-related libraries and services provided with the supported
    SAP HCP programming models. In the latter half of the chapter, we also explore
    key components of the Identity Service as we consider how to implement authentication
    with SAML and authorization using OAuth.'
