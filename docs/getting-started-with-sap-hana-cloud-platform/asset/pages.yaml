    # ## 8.6 Protecting Web Resources with OAuth 2.0


    If you spend much time on your smartphone or tablet, then you may have come to
    appreciate how convenient it is to be able to open an application without having
    to authenticate each and every time. Although you may not have given this behavior
    much thought before, rest assured that your mobile applications haven''t discovered
    a loophole in security. Authentication and authorization checks are still being
    conducted behind the scenes; the only difference is that they''re being carried
    out in a different and less intrusive kind of way.


    The engine that makes all this work is the OAuth protocol. In this section, we''ll
    explore this protocol and explain how to use it to protect web-based APIs or resources
    deployed on SAP HCP.


    # ### 8.6.1 What Is OAuth?


    In his book *Getting Started with OAuth 2.0* (O''Reilly, 2012), Ryan Boyd describes
    the OAuth protocol as being rather like those fancy new car keys that allow an
    owner to provide limited access to the car for valet attendants, children, and
    so forth. Using their smart keys, owners can grant a valet attendant the minimum
    amount of access the attendant needs to park the car. This is to say that the
    key will grant the valet access to drive the car (at a reasonable speed, of course),
    but restrict access to the trunk, glove box, and so on.'
  merge: -1
  img_proc: true
- pgno: 363
  md: 'In the digital world, OAuth keys (or *tokens*) are designed to protect digital
    resources, such as personal data or account information. There are several key
    actors involved in the exchange:


    +   > **Resource server**

    +   The resource server is the server that hosts the data and resources being
    protected by OAuth. For the purposes of our discussion, the resource server is
    SAP HCP itself.


    +   > **Resource owner**

    +   The resource owner is the user who owns the rights to the data and resources
    hosted on the resource server.


    +   > **Client**

    +   In this context, the client refers to the application that''s attempting to
    access data and resources on the resource server. This application could be, for
    example, a native mobile application or a web application.


    +   > **Authorization server**

    +   The authorization server is responsible for negotiating access between a client
    application and the resource owner. Whenever a client application wishes to obtain
    access to a particular resource, it must submit a request to the authorization
    server to obtain access. This request is in turn handed over to the resource owner,
    who ultimately gets to decide whether or not the request is granted.


    To put these roles into perspective, let''s consider a real-world example of a
    native mobile application utilizing a user''s Google account to log a user in
    and access his or her account. In this scenario, the client application is the
    mobile app, the resource server is Google+, and the authorization server is Google''s
    OAuth provider.


    Whenever the resource owner (i.e., the user) attempts to log on to the mobile
    app for the first time, he or she will be prompted to log into his or her Google
    account. Once the user authenticates, he or she will then be presented with an
    authorization screen much like the one shown in Figure 8.27.


    Looking at the authorization screen shown in Figure 8.27, you can see that Google+
    is prompting the user to determine if he or she is willing to grant the client
    application access to his or her basic profile information, circles, and so on.
    If the user clicks on the STON IN button, then the request is verified and the
    client'
  merge: -1
  img_proc: true
- pgno: 364
  md: 'application will be granted an access token that grants access to perform the
    specific set of functions described on the authorization screen on the resource
    owner''s behalf.


    ![](img/cf7012644082c115a2181376d9b7486d_364_0.png)


    Figure 8.27 Using a Google Account to Authorize Access to a Mobile Application
    on a Mobile Device


    Getting back to the valet example from earlier, this approval is rather like the
    car owner handing over the keys to the valet, in that the user is granting the
    client application the authority it needs to access the user''s Google+ profile
    information. To the resource owner or the user, this is a convenience, because
    now the client application won''t pester the user every time it needs to perform
    this task.


    Before we wrap up this basic introduction to OAuth, there are several things we
    should point out about OAuth from a general security perspective:'
  merge: -1
  img_proc: true
- pgno: 365
  md: '+   1. Due to the presence of the mediating authorization server, a client
    application never gets its hands on the user''s account credentials.


    +   2. OAuth access tokens are designed to provide a client with the minimum amount
    of access it needs to do its job. Therefore, if a client is granted an access
    token to view basic information, it can''t use this token to view other hidden
    data, modify data, and so on.


    +   3. Normally, OAuth access tokens have an expiration date, which ensures that
    they don''t become a long-term security risk.


    +   4. OAuth access tokens can be revoked at any time to block access from particular
    clients and so on. This revocation process can be performed without disturbing
    the resource owner''s account (e.g., by forcing the user to change his or her
    password).


    Collectively, these principles lead to a very secure authorization protocol that
    offers the flexibility and convenience required by many modern application clients.


    # 8.6.2 Understanding the OAuth Authorization Flow


    Now that we''ve reviewed the basic concepts surrounding OAuth, let''s narrow our
    focus a bit and consider how OAuth fits into the SAP HCP development landscape.
    Looking at the flow diagram in Figure 8.28, you can identify the positioning of
    OAuth-related components as they relate to SAP HCP. Here, you can observe the
    following:


    +   - SAP HCP comes equipped with its own OAuth authorization server that can
    be used to process token requests and so on.


    +   - SAP HCP also assumes the role of resource server, playing host to a number
    of web resources and APIs that you might want to provide with delegated access
    via OAuth. The SAP HCP Servlet/web container offers excellent support for OAuth-based
    security configurations.


    +   - The SAP HCP authorization server components are able to delegate user authentication
    requests to any of the trusted SAML-based IdPs that might be configured within
    the landscape.'
  merge: -1
  img_proc: true
- pgno: 366
  md: '![](img/cf7012644082c115a2181376d9b7486d_366_0.png)


    # Figure 8.28 Tracing the OAuth Authorization Flow


    With these basic components in place, you have everything you need to secure web
    resources hosted on SAP HCP using OAuth. To put this into perspective, imagine
    that you want to expose a REST-based API hosted on SAP HCP to external client
    applications. Following along with the flow diagram contained in Figure 8.28,
    you can see that the process flow works as follows:


    +   1. The process begins with the user opening the client application.

    +   2. If the client application doesn''t have an access token on hand already,
    then its next step will be to submit an authorization request to the OAuth authorization
    server.

    +   3. In order to process the authorization request, the authorization server
    must first establish the identity of the user who owns the resources the client
    application wishes to get its hands on. This authorization request is normally
    processed using the SAML protocol described in Section 8.5.

    +   4. Once the user''s identity is verified, the authorization server will then
    present the user with a prompt asking whether or not the user wishes to grant
    access to the resource(s) requested by the application.'
  merge: -1
  img_proc: true
- pgno: 367
  md: '5. Assuming the user decides to provide the client with access, the authorization
    server will invoke a callback service on the client, providing a temporary authorization
    code. The client will then exchange this authorization code for a more permanent
    access token.


    6. Finally, with the access token in hand, the client application can begin accessing
    the target resources on the resource server by simply passing the access token
    in an HTTP request header. The resource server will use this token to perform
    the necessary authentication and authorization checks to access the resources.


    Now that we have a sense for how the OAuth authorization flow works, we’re ready
    to switch gears and take a look at how this process is implemented in practice.
    In the next two sections, we’ll take a look at how to implement an actual scenario
    like the one illustrated in Figure 8.28. In Section 8.6.3, we’ll get things started
    by looking at what it takes to expose a simple REST-based API built on top of
    a custom Java Servlet. Then, in Section 8.6.4, we’ll show you how to consume this
    service from a client application running on the SAP HCP local runtime. You can
    find complete versions of the client and the server applications in the book’s
    source code bundle (downloadable from www.sap-press.com/3638).


    > > **Note**

    > > Technically speaking, the OAuth protocol supports several other flow scenarios
    in addition to the one illustrated in Figure 8.28. However, as of the time of
    writing, not all of these scenarios are supported by the SAP HCP OAuth implementation.
    With that being said, for the purposes of our discussion in this section, we’ll
    focus on the authorization code flow illustrated in Figure 8.28.


    # ## 8.6.3 Securing Web Resources with OAuth


    Tracing through the OAuth authorization flow depicted in Figure 8.28, you can
    see that most of the hard work happens up front on the client side. Here, a client
    must enter into a protocol handshake with the OAuth authorization server to obtain
    an access token. Once this token is obtained, clients can begin submitting requests
    to the resource server to access various web resources.


    Because SAP provides a fully functional authorization server with SAP HCP, the
    scope of the server-side development is pretty much limited to securing the target'
  merge: -1
  img_proc: true
- pgno: 368
  md: 'web resources. From a Java development perspective, this can be achieved in
    one of two ways:


    +   ► **Declaratively**

    +   With the declarative approach, web resources are protected by a Servlet filter
    class delivered with the SAP HCP SDK: com.sap.cloud.security.oauth2.OAuthAuthorizationFilter.
    This filter class can be configured in the web.xml deployment descriptor to intercept
    incoming HTTP requests and make sure that an OAuth access token is provided. In
    this, the downstream web resources don’t have to be modified to provide OAuth
    support.


    +   ► **Programmatically**

    +   The alternative to the declarative approach is to utilize the various overloaded
    versions of the isAuthorized() method defined in the com.sap.cloud.security.oauth2.OAuthAuthorized
    class. Here, the web application resources themselves perform the authorization
    checks on the fly and must respond accordingly. For more information about this
    approach, we would recommend that you consult the SAP HCP API documentation online
    at https://help.hana.ondemand.com/javadoc/index.html.


    Most of the time, it makes sense to utilize the declarative approach, because
    it offers a logical separation of concerns, so let’s take a look at how this works.
    Listing 8.13 contains an excerpt of the web.xml deployment descriptor created
    for our contrived flight search API. (This is contained within the EXAMPLE08_02
    application in the book’s source code bundle, downloadable from www.sap-press.com/3638.)
    Here, you can see that we’ve defined a custom Servlet class called TravelAgentAPIServlet
    and a corresponding Servlet filter definition based on the OAuthAuthorizationFilter
    class. The glue that links the filter with the Servlet resource is the <url-pattern>
    elements contained in the Servlet/filter definitions. Because the URL pattern
    matches, the SAP HCP web container will automatically route incoming requests
    to this URL through the OAuthAuthorizationFilter class so that it can verify the
    presence of an OAuth access token. If no token is provided, then the request dies
    and the client never gets its hands on the protected web resource.


    ```

    <web-app>

    <servlet>

    <servlet-name>TravelAgentAPIServlet</servlet-name>

    <servlet-class>

    com.sapress.hcpbook.chp08.TravelAgentAPIServlet

    </servlet-class>

    ```'
  merge: -1
  img_proc: true
- pgno: 369
  md: '```

    <servlet>

    <servlet-mapping>

    <servlet-name>TravelAgentAPIServlet</servlet-name>

    <url-pattern>/api/v1/flights/<url-pattern>

    </servlet-mapping>

    <filter>

    <display-name>OAuth Scope for Flight Lookups</display-name>

    <filter-name>TravelAgentFlightsFilter</filter-name>

    <filter-class>

    com.sap.cloud.security.oauth2.OAuthAuthorizationFilter

    </filter-class>

    <init-param>

    <param-name>scope</param-name>

    <param-value>get-flights</param-value>

    </init-param>

    <init-param>

    <param-name>http.method</param-name>

    <param-value>get</param-value>

    </init-param>

    </filter>

    <filter-mapping>

    <filter-name>TravelAgentFlightsFilter</filter-name>

    <url-pattern>/api/v1/flights/<url-pattern>

    </filter-mapping>

    </web-app>

    ```


    # Listing 8.13 Configuring the OAuth Authorization Filter in the web.xml File


    Looking more closely at the filter definition contained in Listing 8.13, you can
    see that several initialization parameters are included:


    +   scope


    This parameter is used to specify the OAuth scope that gets checked during the
    authorization processing. You''ll learn what OAuth scopes are all about in just
    a moment.


    +   http.method


    This optional parameter allows you to specify the HTTP method that you want to
    provide authorization for (e.g., GET in this case). If this parameter is omitted
    (as frequently would be), then all HTTP methods would be checked indiscriminately.'
  merge: -1
  img_proc: true
- pgno: 370
  md: '► user-principal


    This parameter determines whether or not the OAuth filter will map the resource
    owner''s user ID upon successful authentication or authorization. If set to true,
    then you can get your hands on the user ID using the Servlet API as per usual.


    Believe it or not, that''s all you have to do, development-wise, to turn on OAuth-based
    authorization for your Java-based web resources. However, before you turn the
    resources over to clients, there is one last thing you have to configure on the
    server side of things.


    After the application is deployed, you need to go into the SAP HCP Cockpit and
    configure one or more OAuth scopes. Conceptually, you can think of scopes as named
    authorizations that clients request access for from the OAuth authorization server.
    For example, in our flight API example, we''ve defined a single scope called get-flights,
    which is referenced in the web.xml file illustrated in Listing 8.13. This scope
    provides clients with access to look up flight information. If our API supported
    other flight operations, then we might have also defined scopes such as create-flight,
    update-flight, and so forth.


    To define OAuth scopes for a Java application, simply open up the application
    dashboard and navigate to the OAUTH SCOPES tab page. From here, you can define
    as many scopes as you like by clicking on the New Scope button in the Scopes table.
    This will bring up the form editor shown at the bottom of Figure 8.29. Within
    this form, you need to specify the scope ID and a long text description for the
    scope. In Section 8.6.4, you''ll see that this description will be displayed on
    an SAP HCP-based authorization screen similar to the Google+ authorization screen
    depicted in Figure 8.27.


    Ultimately, the scopes that get defined for an application are rather arbitrary
    and based on whims of the API provider. Scope-based authorizations could be coarse-grained
    or fine-grained; OAuth doesn''t care one way or another. The only thing OAuth
    cares about is making sure that the scope IDs are configured according to specification.'
  merge: -1
  img_proc: true
- pgno: 371
  md: '![](img/cf7012644082c115a2181376d9b7486d_371_0.png)


