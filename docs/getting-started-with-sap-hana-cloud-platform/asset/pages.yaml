  md: "![](img/cf7012644082c115a2181376d9b7486d_193_0.png)\n\n# Figure 5-23 Creating\
    \ an XS OData File: Part 2\n\n```\nservice namespace \"hcbook.bookstore\" (\n\
    \  \"namespace\":Bookstore.Books\"\n  as \"Books\" navigates (\"Book_Authors\"\
    \ as \"Authors\");\n  \"namespace\":Bookstore.BookAuthorsView\"\n  as \"BookAuthors\"\
    \ key (\"isbnNumber\",\"firstName\",\"lastName\");\n  association \"Book_Authors\"\
