- pgno: 216
  md: 'Building industrial-strength cloud applications calls for more than just a
    runtime environment. Real-world applications need to have a reliable persistence
    layer, access to external or on-premise data sources, and occasionally a content
    repository. In this section, we’ll learn about the core services SAP HCP provides
    to satisfy these requirements.


    # 6 Consuming Cloud Services


    In Chapter 3, you learned how to create some basic web applications using the
    Java programming model. We emphasize the term basic here because, when you think
    about it, these applications were lacking some of the essential features common
    to production-quality applications: persistence, access to external resources
    or APIs, and so forth. In this chapter, we’ll look to fill in these gaps by exploring
    the core cloud-based services offered to SAP HCP applications.


    # 6.1 Overview


    Given the relatively advanced nature of the material we’re about to cover, we
    decided that a simple technical overview of the cloud services and their corresponding
    APIs was inadequate for really wrapping your head around what these services can
    do. Therefore, to better demonstrate these capabilities, we decided to create
    a fully functional Java web application that approximates something that you might
    create in the real world. Here, we show you not only how the services are consumed,
    but also how the services fit into the larger picture of cloud-based application
    development.


    Although this demonstration is purposively intended to be Java-centric, it’s important
    to keep in mind that the same basic concepts introduced in this chapter generally
    apply for SAP HANA XS applications, too. Aside from the obvious syntactical differences
    between Java and server-side JavaScript, we think that you’ll find that the usage
    patterns are basically the same.'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'Before you begin reading this chapter, we''d encourage you to download the
    book''s source code bundle (www.sap-press.com/3638) and import the sample application
    for this chapter into your local Eclipse instance. Although we''ll cover each
    related topic in depth, we think that you''ll benefit greatly by cross-referencing
    the concepts covered in the book with your application in the sample code.


    Part of the criteria for building our demo application was to find an application
    domain that would give us an opportunity to see how the various cloud-based services
    are utilized in a real-world setting. After careful consideration, we ended up
    choosing an application that typically pushes the envelope from a requirements
    perspective: Incident management. Here, we''re talking about a general-purpose
    application businesses might use to record incidents that might occur within the
    company (e.g., an employee slips on a wet floor).


    Without digressing too much into domain-specific minutiae, we purposefully designed
    our incident management application to include the following features:


    +   - Support for detailed incident recording so that we can demonstrate complex
    entity relationships in the Java Persistence API (JPA; see Section 6.2.3)

    +   - Support for dynamic queries, which allow us to show how the JDBC API can
    be used within the Persistence Service (see Section 6.2.4)

    +   - Support for loading on-premise data from an SAP Business Suite system using
    Remote Function Call (RFC) functions (see Section 6.3.3)

    +   - A call to a RESTful web service hosted on the Internet (see Section 6.3.4)

    +   - An email function that shows how the Connectivity Service can be used to
    communicate with email providers (see Section 6.3.5)

    +   - The upload and retrieval of attachment documents (see Section 6.4)


    Along the way, we''ll also touch on other features, showing you how the various
    pieces fit together from an application perspective.


    The model diagram contained in Figure 6.1 illustrates the high-level entity model
    for the incident management application. Here, we have an Incident entity that
    stores individual incident records and a number of supporting entities that keep
    track of details such as where the incident occurred, who were the involved persons,
    and what attachments exist. We''ll use this data model as a reference when we
    look at how to create the application''s database schema in Section 6.2.'
  merge: -1
  img_proc: true
- pgno: 218
  md: '![](img/cf7012644082c115a2181376d9b7486d_218_0.png)


    Figure 6.1 Data Model Diagram for the Incident Management Application


    For simplicity''s sake, we chose to keep the UI layer pretty plain, based on a
    handful of simple Servlets and JSPs. This design choice was made for illustrative
    purposes so that we could focus our attention on the application layer. Once you
    get a feel for how the various cloud-based services contribute to the development
    of the business layer of a Java web application, we think that you''ll find the
    exercise of replacing this basic UI layer with something more appropriate (such
    as SAPUI5) to be rather straightforward.


    # ## 6.2 Using the Persistence Service


    Enterprise applications, perhaps more so than any other class of applications,
    depend heavily on having a reliable and accessible persistence layer. Indeed,
    the bonds between an enterprise application and its underlying database are usually'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'so tight that most enterprise applications can''t even be launched if the database
    is unavailable. Recognizing this critical requirement, SAP designed SAP HCP from
    the ground up to include first-class support for persistence in relational databases.
    This support is provided in the form of a core service called the Persistence
    Service.


    # 6.2.1 Conceptual Overview


    In the Java world, the Persistence Service is an abstraction layer built into
    the Application Runtime Container that provides access to virtualized databases
    hosted in the cloud. As such, it plays more of a behind-the-scenes role, taking
    care of low-level technical details such as database backup and recovery, load
    balancing and scaling, connection management, and so forth.


    > Note

    > For SAP HANA XS applications, there''s no real need for a separate persistence
    service, because SAP HANA XS applications naturally have a direct connection to
    the backend SAP HANA database.


    The architectural diagram contained in Figure 6.2 illustrates how the Persistence
    Service fits into the Application Runtime Container. Here, you can see how database
    access is abstracted using the industry-standard JPA and JDBC APIs. From a development
    perspective, this is huge; it allows Java developers who are already comfortable
    working with these APIs to jump in and begin consuming the Persistence Service
    right away.


    ![](img/cf7012644082c115a2181376d9b7486d_219_0.png)


    Figure 6.2 Understanding the Positioning of the Persistence Service'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'As of the time of writing, the Persistence Service supports only two database
    platforms: the SAP HANA database and SAP MaxDB. Which platform you choose is a
    matter of preference; you can opt for the raw power of SAP HANA or the economic
    efficiency of SAP MaxDB. Depending on the complexity of your application, you
    might decide to mix and match instances. In the next section, we''ll see that
    SAP HCP makes it very easy to set up schemas on either of these database platforms
    and bind them to new or existing Java applications.


    # 6.2.2 Managing Database Schemas


    As we mentioned in the previous section, the Persistence Service provides a layer
    of abstraction that sits on top of virtualized database instances hosted within
    the cloud. From a conceptual point of view, the basis of this abstraction is the
    so-called database schema.


    Within SAP HCP, database schemas are logical databases associated with a particular
    SAP HCP account. Put a different way, you can think of database schemas as being
    the cloud-based equivalent to database instances you might stand up for on-premise
    solutions. As such, setting up database schemas is an important first step for
    implementing persistence scenarios within SAP HCP.


    With that in mind, in this section we''ll look at how schemas are created and
    linked with Java web applications. This will set the stage for exploring persistence
    scenarios from a programmer''s point of view in Section 6.2.3 and Section 6.2.4.


    # Creating Database Schemas


    Within SAP HCP, database schemas are created in one of three ways:


    +   - Interactively via the SAP HCP Cockpit

    +   - Using the create-schema command of the Console Client

    +   - Automatically during the application deployment process


    In order to understand what''s involved in the creation of a database schema,
    let''s take a look at what it takes to create a schema within the SAP HCP Cockpit.
    As you can see in Figure 6.3, this task can be performed by opening the DATABASES
    & SCHEMAS tab and clicking on the New toolbar button contained within the DATABASES
    & SCHEMAS table. This will reveal the NEW DATABASE/SCHEMA panel shown'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'in the lower half of the screen in Figure 6.3. Here, there are only two attributes
    that you must specify:


    +   ► SCHEMA ID


    For the schema ID, you must assign an ID that uniquely identifies the schema within
    the SAP HCP account. The ID value must start with a letter and can contain letters,
    numbers, and the special characters _ and -.


    +   ► DATABASE SYSTEM


    As you can see in Figure 6.3, the DATABASE SYSTEM attribute allows you to specify
    which supported database type you wish to utilize in your schema definition: SAP
    HANA or SAP MaxDB.


    ![](img/cf7012644082c115a2181376d9b7486d_221_0.png)


    Figure 6.3 Creating a Schema in the SAP HCP Cockpit


    Noticeably absent in the creation process are some of the typical installation
    and configuration parameters used to set up a physical database instance: host
    name, port, disk allocation, and so forth. Within SAP HCP, all of these low-level
    details are abstracted away by the Persistence Service. This allows you to create
    a database schema in a matter of seconds as opposed to the days or weeks it might
    take to get a database instance set up on-premise.


    For the most part, the creation of a schema using the Console Client follows what
    we demonstrated via the SAP HCP Cockpit (e.g., using the create-schema'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'command). However, the automatic creation process is a different story entirely.
    During the application deployment process, the system will automatically create
    a schema if the application does not have a schema bound to it whenever it is
    deployed or started for the first time. Although we’ve sort of glossed over this
    fallback behavior until now, you can find evidence of this by looking in the SAP
    HCP Cockpit, as shown in Figure 6.3. There, you’ll find implicitly defined schemas
    created for the demo applications we created in earlier chapters. The naming convention
    for these autogenerated schemas is `{account}.application_name.web`.


    Although the dynamic schema creation is an innate behavior within SAP HCP itself,
    you can at least determine which database type you want the system to select for
    you during the creation process by clicking on the Change Button in the toolbar
    of the DATABASES & SCHEMAS table, as shown in Figure 6.4. Here, you can choose
    the default database type within the correspondingly named DEFAULT DATABASE dropdown
    list.


    ![](img/cf7012644082c115a2181376d9b7486d_222_0.png)


    Figure 6.4 Setting the Default Database for Automatic Schema Creation


    # Binding Schemas with Java Applications


    Initially, database schemas are just empty partitions void of any data or table
    definitions. In order to put a database schema to work, you need to bind the schema
    with a Java web application. This step allows you to utilize the JPA or JDBC APIs
    to create tables and fill them with data.'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'Much like the schema creation process, schemas can be bound either explicitly
    or implicitly. You can explicitly bind a database schema to an application using
    the SAP HCP Cockpit or the Console Client via the `bind-schema` command. In the
    SAP HCP Cockpit, you can bind schemas within the same DATABASES & SCHEMAS tab
    used to create schemas in the first place. Here, simply select the target schema
    in the DATABASES & SCHEMAS panel at the top of the main content area, and then
    create a binding by clicking on the New Binding button in the lower-level schema
    editor panel. This brings up the NEW BINDING dialog box shown in Figure 6.5.


    ![](img/cf7012644082c115a2181376d9b7486d_223_0.png)


    Figure 6.5 Creating Application Bindings in the SAP HCP Cockpit


    Here, there are two main attributes that must be configured:


    +   - **DATA SOURCE**

    +   In order for your Java application to be able to address and access a binding,
    you must assign the binding a data source name. As you can see in Figure 6.5,
    the naming convention for data sources aligns with the typical JNDI naming convention
    used to create JDBC data sources—that is, `jdbc/DataSourceName-InCamelCase)`.
    In Section 6.2.4, you’ll see how this name allows you to define JDBC data sources
    as resources within your Java web application’s web.xml file. The name can also
    be used to allocate data sources using dependency injections.


    +   - **JAVA APPLICATION**

    +   In the JAVA APPLICATION dropdown list, select the target application that
    you wish to define the binding for. This list is automatically populated based
    on the Java applications that are currently deployed within the account (active
    or otherwise).'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'In addition to the two main attributes described previously, bindings to productive
    SAP HANA instances also require that we specify database user credentials so that
    we can bind to the instance with a user account that has the appropriate permissions
    to access catalog objects within the target SAP HANA database schema. More information
    can be found on this step in the online help documentation underneath the section
    entitled “Binding Productive SAP HANA Instances to Applications.”


    Schemas are implicitly bound in cases in which a database schema is created implicitly
    during the application deployment process, as described in the previous section.
    Here, the autogenerated schema becomes the “default” data source for the application
    being deployed. To remove this default data source binding, you must open up the
    target Java application in the SAP HCP Cockpit and select the Data Source Bindings
    subtab. Within the main content area, you can delete the schema binding by finding
    the target data source and clicking on the DELETE button, as shown in Figure 6.6.
    Here, options are also provided to create new bindings or navigate to the corresponding
    schema definition.


    ![](img/cf7012644082c115a2181376d9b7486d_224_0.png)


    Figure 6.6 Removing a Schema Binding from a Java Application


    # Working with Multiple Schemas


    Most of the time, Java applications are bound to a single database schema. However,
    that doesn’t mean that a given application can’t be bound to more than one schema
    at a time. Indeed, as you can see in Figure 6.7, it’s possible for a Java application
    to be bound to many schemas across database types.'
  merge: -1
  img_proc: true
- pgno: 225
  md: '![](img/cf7012644082c115a2181376d9b7486d_225_0.png)


    # Figure 6.7 Understanding the Relationship between Applications and Schemas


    This leads to all kinds of interesting scenarios. For example, if multiple applications
    happen to share the same set of database entities, then you might define a single
    schema and point (bind) each of the corresponding applications to it, or you might
    define one or more schemas to store reusable entities and then create custom ones
    for specific application requirements.


    # Sharing Schemas between Accounts


    As you can see in Figure 6.7, the relationships between Java applications and
    database schemas are normally defined within the context of an SAP HCP account.
    However, we should point out that it’s technically possible to share schemas between
    accounts if we so desire (though as of the time of writing, this feature is only
    available for database schemas defined using the SAP HANA DB). For more details
    about the security-related steps required to grant this access, please read through
    the online help documentation in the section entitled “Accessing Schemas Across
    Accounts.”


    How does all this mixing and matching of schemas work at the application level?
    To some extent, these questions will be answered as we explore the JPA and JDBC
    APIs in Section 6.2.3 and Section 6.2.4, respectively. However, the short'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'answer here is that you can use the JNDI-based data source names created as
    part of a schema binding definition in JNDI lookups to fetch the various data
    sources from the JNDI context of the Java EE application container. This step
    can be performed declaratively in deployment descriptors or interactively using
    the JNDI API at runtime.


    # 6.2.3 Working with the Java Persistence API


    According to the SAP HCP online help documentation, the JPA is “considered the
    standard approach for developing applications for the SAP HANA Cloud Platform.”
    Therefore, even if you’re a nonconformist and prefer to write your own SQL, it’s
    important to at least have a basic understanding of how persistence scenarios
    are implemented using the JPA—a concept we’ll attempt to tackle in this section.
    If nothing else, this knowledge will at least help you understand how to troubleshoot
    JPA-based applications delivered by SAP and/or other developers.


    # JPA Overview


    For developers that may be new to the JPA, it’s helpful to take a moment to understand
    what it is exactly. At a high level, JPA is a Java API that makes it easy for
    developers to implement object-relational mapping (ORM). What is ORM? As the name
    suggests, ORM is a technique for synchronizing data stored in objects with relational
    database tables. Here, Java objects and database rows become equivalent representations
    of the same data, and operations performed on a Java object are automatically
    reflected in the database and vice versa.


    From a development perspective, the advantage of using an ORM tool over performing
    such translations by hand is that developers don’t have to cross over from the
    object-oriented (OO) world into the procedural world of SQL and relational databases.
    Besides saving time, this technique also makes the code much more flexible and
    readable.


    Figure 6.8 illustrates the role that the JPA plays in implementing an ORM scenario.
    Here, we can see that the JPA consists of two parts:


    +   Interface/API layer


    At the interface layer, the JPA provides Java developers with a generic library
    that can be used to define, search for, and manipulate entities. The classes and'
