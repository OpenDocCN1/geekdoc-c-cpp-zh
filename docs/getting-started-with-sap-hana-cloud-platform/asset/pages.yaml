    # What Is Cross Origin Resource Sharing (CORS)?


    CORS defines a set of HTTP headers that provide guidance to browsers for whether
    they are allowed to embed content coming from one site into a page hosted in another
    site. All major browsers support CORS for all types of HTTP requests.


    +   Let''s look at the interaction in a nutshell:

    +   1. Your browser is loading a page served from https://www.siteA.com.

    +   2. JavaScript code on the page tries to retrieve user details by calling a
    REST API on https://www.siteB.com. In this case, it will send an additional header
    stating Origin: https://www.siteA.com.

    +   3. The Site B web server has the option to respond in several different ways:

    +      - It can return a response with an Access-Control-Allow-Origin: http://www.siteA.com
    header, indicating which sites are allowed to embed content from Site B.

    +      - It can return an error page outlining that the CORS request is not allowed.

    +      - It can return a response with an Access-Control-Allow-Origin: * header,
    indicating that any site is allowed to embed content from Site B. This is typically
    used for content that is completely public.


    In the SAP Cloud solutions extension scenario, having a mutual CORS/ACAO setup
    will significantly complicate the integration and require the extended solution
    to know and particularly recognize each and every extension application for each
    of its tenants. As SAP Cloud solutions content is typically not public, this leaves
    no viable options for managing the integration. That''s why SAP HCP handles all
    OData backend calls in a uniform way, proxying the calls via the SAP HCP Dispatcher
    service and implementing the required session handling and identity propagation
    centrally for all HTML5 apps.


    As seen in Figure 11.4, your extension application may also include an SAP HANA
    Cloud Portal site, complemented by one or more OpenSocial widgets. You learned
    how to create portal sites and register OpenSocial widgets in Chapter 9, so we
    won''t drill deeper into this topic here.


    Last but not least, you may deliver native UI elements that are to be imported
    in the extended SAP solution during installation. This might include, but is not'
