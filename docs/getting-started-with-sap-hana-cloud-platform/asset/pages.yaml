    # 9.1.3 How is SAP HANA Cloud Portal Used?


    Now that you know what SAP HANA Cloud Portal is, you might be wondering what it''s
    used for in the real world. The short answer is that SAP HANA Cloud Portal can
    be used for just about any requirement that calls for some kind of content aggregation.
    The list of content types that you can integrate includes the following:


    +   - Custom-built web applications deployed on SAP HCP (e.g., Java, native SAP
    HANA, or HTML5 applications)

    +   - SAP standard applications, such as those provided with SAP''s newer SaaS
    offerings (e.g., SuccessFactors, Concur, etc.)

    +   - Third-party applications and/or external web sites

    +   - SAP Jam feeds

    +   - Unstructured content (e.g., lists, documents, images, and videos)

    +   - Custom-built widgets that round out the user experience and facilitate interapplication
    communication


    By weaving these different content types together, you can provide users with
    a one-stop shop for performing related tasks. Although you could technically build
    such mashups from scratch, by using SAP HANA Cloud Portal you can take advantage
    of built-in features, such as site-wide branding and theming, prebuilt widgets,
    and a host of common APIs that allow you to implement certain site-wide functions
    in a portable and reusable manner.


    You''ll see many of these services and features on display in the upcoming sections,
    culminating in Section 9.4, in which we demonstrate the creation of a custom site
    definition that aggregates some of the content developed in earlier examples within
    the book. As you progress through the exercises, we would encourage'
  merge: -1
