- pgno: 386
  md: '![](img/cf7012644082c115a2181376d9b7486d_386_0.png)


    Figure 9.3 Understanding How Content Is Aggregated with OpenSocial


    # # What Is OpenSocial?


    OpenSocial is a W3C standard originally developed by Google with the goal of simplifying
    the development of social network applications (i.e., mashups). The specification
    defines the framework for building component containers, reusable UI components
    called widgets, and also provides a set of common APIs.


    The unit of development within the OpenSocial framework is the aforementioned
    widget (or gadget in the Google parlance). Conceptually, you can think of widgets
    as thin wrappers or containers around some kind of HTML-based content. This container
    is defined in terms of an XML-based descriptor file that specifies details about
    where to load the HTML content from, which OpenSocial APIs the widget plans to
    use, and so forth.


    At runtime, whenever users access portal sites, the incoming requests are funneled
    through the OpenSocial container, which dynamically generates HTML content for
    each of the embedded widget components and then weaves it together into a consolidated
    piece of HTML markup (see Figure 9.3). This approach offers several important
    benefits:


    +   - It allows developers and portal admins to integrate content from just about
    anywhere. Indeed, as long as content is addressable via a URL from the OpenSocial
    container, it’s pretty much fair game.


    +   - The introduction of the specification XML allows developers to define dependencies
    to common libraries and APIs without having to worry about library versions, resource
    paths, and so on.


    +   - The centralized OpenSocial container solves cross-domain issues that developers
    frequently encounter, because all requests (i.e., AJAX calls, etc.) end up originating
    from the same domain in the generated HTML.'
  merge: -1
  img_proc: true
- pgno: 387
