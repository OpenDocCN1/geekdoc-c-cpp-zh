- pgno: 173
  md: '+   Next Steps in Software Development on SAP HANA (a continuing course on
    open-SAP exploring more advanced SAP HANA-related development topics, available
    online at https://open.sap.com/courses/hana2)


    +   The SAP HANA Developer Guide (available online at http://help.sap.com/hana_platform)


    # Introducing the Bookstore Sample Application


    In order to demonstrate how SAP HANA development objects come together to create
    full-scale web applications, throughout the course of this chapter we''ll be developing
    an application via which users can browse through a bookstore''s catalog, search
    for books, and find out more information about a particular title. This simple
    demo app will allow us to model and load data into a custom database schema, expose
    the data via OData services, and consume it from SAPUI5 and server-side JavaScript.


    You can find all of the application''s source code in the book''s source code
    bundle, available for download from www.sap-press.com/3638. We''ve also included
    a series of CSV files that we''ll use to populate the data model with some sample
    data. If you''re new to SAP HANA development, we''d strongly urge you to browse
    through the source code as you read through this chapter, as doing so will help
    you get a better sense for the big picture.


    # 5.2 Getting Started


    In just a moment, we''ll roll up our sleeves and start getting our hands dirty
    with SAP HANA application development tasks. However, before we get started, there
    are a few administrative tasks that we need to take care of. In this section,
    we''ll review these tasks and show you how to set up your local machine for SAP
    HANA development.


    # 5.2.1 Creating a Trial SAP HANA Instance


    When developing SAP HANA XS applications in the trial landscape, the first thing
    we need to do is create a trial SAP HANA instance. Such trial instances are abstractions
    of a normal SAP HANA instance and represent a logical grouping of schemas and
    tables, repository objects, users, and so forth. SAP uses this abstraction to'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'split a physical SAP HANA instance hosted on SAP HCP into lots of little trial-account-specific
    partitions in order to conserve resources. The ramifications of all this from
    a development perspective are twofold:


    +   1. The shared instance that we are provided within the trial landscape comes
    with some built-in restrictions and limited access rights. As you might expect,
    these restrictions were put in place to ensure the isolation of data and users
    within the shared SAP HANA instance.


    +   2. For technical reasons, the up-front setup of a trial instance is a prerequisite
    for the development of SAP HANA XS applications in the trial landscape.


    Note

    You can find specific details about the limitations and restrictions of the trial
    SAP HANA instances in the SAP HCP help documentation available online at http://help.hana.ondemand.com.
    Browse to the section titled “Using a Trial SAP HANA Instance.”1


    Even though the behind-the-scenes details related to trial instances are quite
    complex, the process of setting up an instance in the SAP HCP Cockpit is relatively
    straightforward:


    +   1. From the SAP HCP Cockpit landing page, navigate to the HANA INSTANCES tab.


    +   2. Click on the NEW TRIAL INSTANCE link to reveal the NEW TRIAL INSTANCE panel
    shown in Figure 5.2.


    +   3. Give your new instance a name (we called ours hcpbook), and click on the
    Save button to create the instance.


    ![](img/cf7012644082c115a2181376d9b7486d_174_0.png)


    Figure 5.2 Creating a Trial SAP HANA XS Instance in the SAP HCP Cockpit'
  merge: -1
  img_proc: true
- pgno: 175
  md: "# ## 5.2.2 Working with Eclipse and the SAP HANA Tools\n\nWhen developing SAP\
    \ HANA XS applications, we have the choice of working with two different development\
    \ environments: the familiar Eclipse IDE introduced in Chapter 2 and the new SAP\
    \ HANA Web-Based Development Workbench (also known as the Web IDE – but not to\
    \ be confused with the other web IDEs discussed in Chapter 7 and Chapter 10).\
    \ In this section, we’ll take a look at how to set up the Eclipse IDE for SAP\
    \ HANA development in the cloud.\n\n# ### Setting up the SAP HANA Tools\n\nIn\
    \ order to be able to connect to SAP HANA instances and create SAP HANA-specific\
    \ development artifacts in Eclipse, we must install a series of plug-ins that\
    \ are collectively referred to as the SAP HANA Tools. The SAP HANA Tools plug-ins\
    \ can be installed onto a preexisting Eclipse instance or a clean Eclipse installation.\
    \ When performing SAP HANA development in the cloud, we recommend installing the\
    \ SAP HANA Tools alongside the SAP HCP Tools and other SAP HCP-related plug-ins\
    \ so that all of the relevant cloud-based development functions are there in one\
    \ place.\n\nIf you followed along with the installation instructions outlined\
    \ in Chapter 2, Section 2.3.1, then you should already have the SAP HANA Tools\
    \ plug-ins installed on your local Eclipse instance. Otherwise, we’d recommend\
    \ that you reread through that section and/or consult the installation guide available\
    \ online at https://tools.hana.ondemand.com/#hanatools.\n\n> **What about SAP\
    \ HANA Studio?**\n> \n> If you have experience developing on the SAP HANA platform\
    \ already, then you might be wondering how the Eclipse IDE instance that we’ve\
    \ set up for SAP HCP relates to the standalone SAP HANA Studio. As it turns out,\
    \ there’s really not much difference functionality wise. This is because SAP HANA\
    \ Studio is basically just a prepackaged Eclipse installation that includes the\
    \ aforementioned SAP HANA Tools by default.\n> \n> If you already have SAP HANA\
    \ Studio installed on your local machine, then you can certainly use it in lieu\
    \ of the Eclipse IDE instance described here; both IDEs work the same. We just\
    \ standardized the examples in this book around a generic Eclipse instance based\
    \ on the assumption that SAP HCP developers would prefer to work in the same IDE\
    \ used for the rest of their SAP HCP development."
  merge: -1
  img_proc: true
