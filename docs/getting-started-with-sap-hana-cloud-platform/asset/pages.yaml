    \n# 8.5 Authentication and Authorization with SAML 2.0\n\nIn Section 8.2.2, we\
    \ touched on the fact that SAP HCP is capable of integrating with a wide array\
    \ of authentication providers. Unlike other Java EE servers you may have worked\
    \ with (e.g., the SAP AS Java), in which such features are considered “nice to\
    \ have,” it turns out that this capability is actually an essential part of the\
    \ SAP HCP security infrastructure. This is because SAP HCP was designed from the\
    \ ground up to not maintain any permanent user storage of its own."
  merge: -1
  img_proc: true
- pgno: 349
  md: 'Why take this approach, you might ask? If you consider the fact that most customers''
    biggest reservation about adopting cloud-based solutions is security, then it
    makes sense for SAP to remove as many potential security risks from the mix as
    possible. Using a federated approach to authentication reduces the threat of sensitive
    user information being compromised in the cloud. Plus, it also offers the added
    benefit of letting customers leverage preexisting IdP solutions they might have
    in-house.


    In this section, you''ll learn how to configure and leverage federated authentication
    using the industry-standard Security Assertion Markup Language (SAML) 2.0 protocol.
    This protocol is the primary protocol used by SAP HCP for the purposes of authentication
    and single sign-on (SSO).


    # 8.5.1 SAML Overview


    Before you begin looking at how to configure SAML-based authentication scenarios,
    it''s helpful to understand a little more about what SAML is (and isn''t). As
    its name implies, SAML defines an XML-based vocabulary that''s used to exchange
    authentication and authorization data between parties. Within the vernacular,
    the negotiating parties are referred to as the identity provider (IdP) and service
    provider, respectively.


    In addition to the XML-based messages it defines, the SAML 2.0 standard also specifies
    a series of protocols that describe how messages are exchanged between users,
    the IdP, and the service provider. The typical message flow for a SAML authentication
    request processed through SAP HCP is illustrated in Figure 8.12.


    Within the flow diagram contained in Figure 8.12, you can observe the following:


    +   1 The process begins with a user attempting to access a secure web application
    hosted on the service provider. As you can see in Figure 8.12, SAP HCP plays the
    role of service provider in this scenario.


    +   2 Upon receipt of the request, the SAP HCP server determines via declarative
    constraints defined in the application''s web.xml file that the user needs to
    authenticate before the server can decide whether or not the user is authorized
    to access the application. Assuming that the authentication method is set to FORM
    (refer back to Section 8.3.1), the request will be handed off to a JAAS-based
    login module. This module will generate a SAML authentication request'
  merge: -1
  img_proc: true
- pgno: 350
  md: '(i.e., a SAML AuthnRequest message) and send it back to the user in an HTTP
    302 redirect message.


    +   3 The browser then follows the redirect and forwards the SAML authentication
    request on to the SSO login page defined by the IdP. By default, this results
    in the user being routed to the login page of the SAP ID Service, as shown in
    Figure 8.3. Naturally, the look and feel of the page would be different if an
    alternative IdP is being used instead.


    +   4 Once the user fills in his or her user credentials and submits the login
    form, the login request is forwarded on to the IdP.


    +   5 Upon receipt of the login request, the IdP will process the request and
    return a SAML response message back to the user''s browser.


    +   6 From here, the SAML response is forwarded on to the service provider, where
    it''s unpacked to determine if the user was authenticated. Assuming the authentication
    is successful, then the web container will grant access to the target web application.


    ![](img/cf7012644082c115a2181376d9b7486d_350_0.png)


    Figure 8.12 Tracing a Typical SAML Authentication Flow within SAP HCP'
  merge: -1
  img_proc: true
- pgno: 351
  md: 'For the most part, developers don''t really have to concern themselves with
    the intricacies of the authorization flow illustrated in Figure 8.12, because
    these details are handled automatically by the JAAS login module(s) of SAP HCP.
    With that being said, though, we should point out that a SAML response message
    contains more than just a flag indicating whether or not a user is authorized.
    The response message also contains a series of assertions (hence the name), which
    contain user attributes (e.g., first and last name, email address, telephone number,
    etc.), and sometimes authorization decision statements, which can be used to determine
    user authorizations. We''ll explore some of the ways these attributes are used
    in Section 8.5.3.


    # 8.5.2 Configuring Trusted Identity Providers


    As we noted earlier, SAP HCP is configured by default to utilize the SAP ID Service
    as its trusted IdP. This SAP ID Service is the same one users use to access SCN
    and other SAP-related sites. Although this default IdP is suitable to get things
    up and running, most customers will prefer to connect with a preexisting IdP they
    already have in-house (e.g., Microsoft Active Directory Services). This IdP could
    be provided by a third party on the Internet or on-premise; it doesn''t really
    matter one way or another to SAP HCP.


    In order to leverage another IdP from within SAP HCP, you must configure a trust
    relationship between SAP HCP (which plays the role of a service provider) and
    the target IdP. To demonstrate how this works, let''s take a look at how you can
    configure a trust relationship to the simplified (but fully SAML-compliant) IdP
    bundled with the local runtime environment included in the SAP HCP SDK. The configuration
    steps are as follows:


    +   1. Open the SAP HCP Cockpit and access the Trust tab. This will open the TRUST
    MANAGEMENT page shown in Figure 8.13. To create a new trust relationship, choose
    the Custom configuration type in the CONFIGURATION TYPE dropdown list.'
  merge: -1
  img_proc: true
