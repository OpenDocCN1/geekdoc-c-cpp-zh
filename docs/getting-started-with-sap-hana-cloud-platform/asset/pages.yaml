  md: '**Building Complex Mapping Rules**


    If needed, you can chain mapping rules together by defining a mapping rule and
    then clicking on the adjacent circular icon with the + sign on it. Any rules that
    you define using this approach are evaluated using the logical OR operator. That
    is to say that if you have a match on *any* of the expressions, then the user
