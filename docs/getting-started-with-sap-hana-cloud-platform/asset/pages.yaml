    # ## 8.6.4 Developing and Configuring OAuth Clients


    With the server portion of our OAuth demo squared away, let''s turn our attention
    now to the client application that will be consuming the flight query service.
    Here, although you may not plan to be in the business of developing client applications,
    it''s helpful to at least understand how clients interface with your secured resources
    using OAuth. Plus, it also gives us an opportunity to see how clients are configured
    and maintained within the SAP HCP Cockpit.


    To keep things simple, we decided to implement our client application as a server-side
    Java web application hosted on an instance of the SAP HCP local runtime. Of course,
    we could have just as easily developed this application using .NET technology,
    PHP, and so on. Indeed, one of the great things about OAuth is that it''s an open
    standard that can be supported by just about any kind of client device imaginable.'
  merge: -1
  img_proc: true
- pgno: 372
  md: '![](img/cf7012644082c115a2181376d9b7486d_372_0.png)


    Figure 8.30 Process Flow for Flight Client Application


    Figure 8.30 is a flow diagram that depicts the high-level process flow of the
    client application. Here, the process breaks down as follows:


    +   1. Whenever the user launches the client application in his or her web browser
    or user agent, the first thing the client does is figure out whether or not it
    already has an OAuth access token on hand.


    +   2. If it doesn''t, then the user''s browser will be redirected to the authorization
    endpoint of the SAP HCP authorization server with a request for an access code.


    +   3. The authorization endpoint will first authenticate the user (using SAML)
    and then present a prompt to allow the user to determine whether or not he or
    she wishes to grant the client application access to the flight query service.'
  merge: -1
  img_proc: true
- pgno: 373
  md: '4. Assuming the user grants the request, control picks up on the SAP HCP authorization
    server, which generates an authorization code and invokes the OAuth callback URL
    provided in the original authorization request.


    5. The OAuth callback service on the client application will receive the authorization
    code and invoke the token endpoint of the SAP HCP authorization server to exchange
    the authorization code for an access token.


    6. After the access token is received, the client application will redirect the
    user''s browser to the application start page where users can begin searching
    for flights.


    7. Finally, whenever the user submits a flight query, the client will format the
    REST call and embed the access token in the HTTP request headers. If all goes
    well, then the flight API will respond with the desired flights, and the results
    will be parsed by the client application and displayed in the results list.


    Looking closely at Figure 8.31, you can see that the client application interfaces
    with a couple of endpoints on the SAP HCP authorization server in order to obtain
    an OAuth access token. This raises the question: How do you know which URLs to
    hit when developing a client application? As is the case with most SAP HCP-related
    configuration items, you must go to the SAP HCP Cockpit to find out this information.
    From the main landing page, you can find the OAuth URLs by opening the OAuth tab,
    as shown in Figure 8.31.


    ![](img/cf7012644082c115a2181376d9b7486d_373_0.png)


    Figure 8.31 Accessing OAuth Authorization Server Endpoints'
  merge: -1
  img_proc: true
- pgno: 374
  md: 'Because the OAuth URL syntax is predictable for any SAP HCP landscape, we implemented
    our client application in such a way that it only requires the SAP HCP account
    name and host as parameters; the fully qualified URLs are dynamically generated
    from there. You can see how this works in the EXAMPLE08_03 sample application
    by looking at the initialization parameters of the ClientBootstrapServlet in the
    application''s web.xml file.


    In addition to the OAuth URLs, the OAuth SETTINGS tab page also allows you to
    upload a custom logo image to apply customized branding on the OAuth authorization
    pages. For the purposes of our demo, we uploaded the SAP PRESS logo so that you
    can see how this impacts the look and feel of the authorization page.


    Once the OAuth URLs are configured, you''re almost ready to fire up your client
    application. However, before you proceed, there''s one more configuration step
    that has to take place: you need to register your client with the OAuth authorization
    server. This registration process is required so that the authorization server
    has a tangible set of credentials to ensure the authenticity of incoming requests.


    As you might expect, clients are registered via the CLIENTS subtab contained within
    the main OAUTH SETTINGS tab page (see Figure 8.32). To register a new client,
    you must specify some or all of the following attributes:


    +   - **NAME**

    +     This mandatory attribute defines the client''s name. The name must be unique
    within the SAP HCP instance.


    +   - **DESCRIPTION (optional)**

    +     Here, you can specify a long-text description of the client.


    +   - **ID**

    +     This attribute is generated by the SAP HCP Cockpit as the client''s ID.
    This token will be used at runtime when an authorization request is submitted
    to the authorization or token endpoints.


    +   - **CONFIDENTIAL**

    +     If this checkbox is selected, then you must fill in a password that will
    be exchanged at runtime in the authorization handshake. In OAuth parlance, this
    password is called the client_secret.'
  merge: -1
  img_proc: true
- pgno: 375
  md: '# REDIRECT URI


    In this attribute, you must specify the OAuth callback URI that will be invoked
    at runtime. Although the OAuth protocol supports the exchange of this URI dynamically
    at runtime, the specification here helps reduce the risk of request forgeries.


    # TOKEN LIFETIME


    This attribute is used to define the lifetime (in days) of access tokens allocated
    to the client. If left blank, then the duration is infinite.


    # REFRESH TOKEN LIFETIME


    Although we''ve sort of glossed over this up to now, there are actually two tokens
    generated by the authorization server in response to an authorization request:
    an access token and a refresh token. Refresh tokens are used to (quickly) reacquire
    an access token in cases in which the old access token has expired.


    With that being said, the REFRESH TOKEN LIFETIME attribute can be used to define
    the lifetime of a refresh token. If left blank, then the duration is infinite.


    ![](img/cf7012644082c115a2181376d9b7486d_375_0.png)


    Figure 8.32: Registering an OAuth Client in the SAP HCP Cockpit'
  merge: -1
  img_proc: true
- pgno: 376
