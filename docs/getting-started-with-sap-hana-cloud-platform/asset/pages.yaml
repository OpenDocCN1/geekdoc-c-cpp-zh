- pgno: 34
  md: '# 1.2.3 Some Historical Perspective


    In his book *The Big Switch: Rewiring the World from Edison to Google* (W. W.
    Norton & Co., 2013), Nicholas Carr tells the story of Samuel Insull, a brilliant
    businessman who was among the first to see the practical benefits in packaging
    and selling electrical energy as a commodity. Such a notion might seem obvious
    in these modern times, but the concept was met with a considerable amount of opposition
    at the turn of the twentieth century. Indeed, among these opponents was Thomas
    Edison, Insull''s former boss and long-term mentor. Believing that direct current
    (DC) was the only way to reliably transmit electricity, Edison felt that it was
    impractical to attempt large-scale distribution, because DC couldn''t be transmitted
    very far.


    Insull saw things very differently. With ever-improving electrical dynamos and
    the advent of Nikola Tesla''s alternating current (AC), he felt that all of the
    foundational pieces were in place to establish large-scale power plants that could
    reliably transmit electricity for miles. Insull followed through with his vision
    and established the Commonwealth Edison Company, a prototype for modern electrical
    utility companies in the United States and eventually around the world.


    After building up his infrastructure, Insull initially found that driving customer
    adoption was difficult. At the time, power supply systems were mostly built and
    managed internally by customers. Because even the smallest of power outages was
    viewed as a huge risk to production operations, customers were naturally very
    concerned about stability and generally felt that it was best to manage this risk
    in-house. Through a bit of shrewd marketing and negotiating, Insull was eventually
    able to convince a few strategic customers to give his services a try. Once the
    word of success spread, it didn''t take long for other customers to see the viability
    of the model and jump on board.


    Over the course of the next 30 years or so, this trend would continue to the point
    that hardly any companies in the United States operated their own power supply
    systems. Through centralization and economies of scale, electrical utilities were
    able to produce electrical power much more efficiently and reliably at a fraction
    of the cost. In time, companies simply could no longer afford to go it on their
    own.


    Fast-forwarding about 100 years, we find that cloud computing is experiencing
    some of the same growing pains that the electrical utility industry faced in the
    early twentieth century. As a relatively new and somewhat abstract concept,'
  merge: -1
  img_proc: true
- pgno: 35
  md: "many customers are frightened and skeptical of the promises made by cloud software\
    \ and infrastructure providers. After years of installing and maintaining large\
    \ and complex IT systems, the notion of relinquishing control of that infrastructure\
    \ to a third-party vendor seems unthinkable.\n\nDespite all of these (valid) concerns,\
    \ there's simply no denying the economics of cloud computing. Much like electricity,\
    \ IT infrastructure is something that's destined to become a commodity. The question\
    \ is no longer if, but when. For companies bold enough to take the plunge, cloud\
    \ computing offers a wide range of potential benefits:\n\n+   > **Reduced operating\
    \ costs**\n+   \n+   Operating an IT infrastructure is a very costly enterprise—one\
    \ that's difficult to fully quantify when you consider the costs of racking and\
    \ stacking servers, real estate, power consumption, sustaining a competent support\
    \ staff, and so on. Cloud computing doesn't eliminate those costs, but it certainly\
    \ goes a long way towards consolidating and reducing them. Plus, it's important\
    \ to remember that we're not talking about short-term gains. In the long run,\
    \ cloud computing providers will become more efficient and therefore more economical.\n\
    \n+   > **Reliability**\n+   \n+   Because cloud providers are focused squarely\
    \ on providing a handful of services, there's a considerable amount of research\
    \ and effort that goes into building up a reliable infrastructure. Indeed, when\
    \ you read the articles that describe the lengths that providers such as Amazon\
    \ and Google go through to provide near 100% uptime, there's really no comparison\
    \ with what most IT organizations can manage internally in terms of disaster recovery,\
    \ failover, and so on.\n\n+   > **A lowering of the entry barrier**\n+   \n+ \
    \  For small startup companies, cloud computing lowers the entry barrier, because\
    \ it eliminates the capital expenses normally associated with building data centers,\
    \ procuring hardware, installing and configuring software, and so on. With the\
    \ offer of elasticity, most cloud providers offer subscription models that can\
    \ grow with a business over time.\n\n+   > **Faster turnaround times**\n+   \n\
    +   Normally, the time it takes to procure a server, mount it, configure its software,\
    \ and get it up and running is measured in weeks and sometimes months. Cloud providers,\
    \ on the other hand, can often spin up fully functional instances in a"
  merge: -1
  img_proc: true
- pgno: 36
  md: 'matter of minutes. For customers that are looking to innovate right away, there''s
    simply no comparison.


    +   > Universal access


    With data centers scattered around the world, most cloud providers make it possible
    for a customer’s user base to access IT resources from anywhere in the world.
    In general, the only thing a user needs is a public Internet connection.


    If history is any indicator, these benefits will eventually outweigh the negatives
    to the point that customers feel they can no longer afford to stick with the status
    quo. Right now, most companies are as much in the business of IT as they are in
    manufacturing and/or selling goods and services. This is an unsustainable model
    that will inevitably change. In the meantime, we’ll likely see lots of hybrid
    models that allow customers to take their time in migrating towards the cloud.


    # 1.3 A Strategic “Glue” Component for SAP


    Because SAP has such a wide customer base, it’s not practical to close up shop
    with its on-premise offerings and transition into a cloud-based solution provider
    overnight. For a variety of reasons, many of SAP’s customers will be slow to move
    towards a public cloud offering, and some may never get there. Recognizing this,
    SAP has formulated a cloud adoption strategy that supports hybrid landscapes that
    mix and match cloud-based offerings with on-premise solutions.


    At the center of this strategy lies SAP HCP, which is effectively the glue that
    holds everything together. In this section, we’ll briefly consider how SAP HCP
    satisfies this important role in SAP’s cloud strategy.


    # 1.3.1 Challenges of the Hybrid Landscape


    Although the hybrid landscape offers customers the flexibility to move towards
    cloud solutions at their own pace, it also presents plenty of challenges. To put
    this into perspective, let’s consider a customer that has historically run its
    human resources (HR) department using SAP ERP Human Capital Management (HCM) module
    on premise. Now, let’s imagine that the customer decides it wants to improve its
    talent acquisition capabilities with SAP’s SuccessFactors SaaS solution. At this
    point, the customer’s HR solution is distributed between SuccessFactors running
    in the public cloud and SAP ERP HCM running on premise.'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'In order to be successful, these two solutions will need to collaborate with
    one another in different ways. It probably goes without saying that they''ll need
    to exchange data with one another, but integration really goes beyond a handful
    of interfaces. True process integration requires streamlined process flows that
    automate task flow between groups of users that may work in different modules
    at different times.


    From a functional and productivity perspective, users within the HR department
    need to have a unified experience. If you''ve ever (redundantly) maintained data
    in two or more systems at a time, then you probably have a sense for what we''re
    talking about here. To the end user, it doesn''t matter if the software''s coming
    from SuccessFactors in the cloud or SAP ERP HCM on-premise; the user just wants
    a simplified set of tools to do his or her job.


    # 1.3.2 Where SAP HANA Cloud Platform Fits In


    If you think about the challenges considered in the previous section, it''s plain
    to see that customers require certain extensions to cloud and/or on-premise applications
    in order to be successful. Because the nature of these application extensions
    can vary significantly depending on the customer''s business requirements, a general-purpose
    development platform is needed.


    As you progress through this book, we think you''ll find that SAP HCP fills this
    role quite nicely. To put this into perspective, here are some highlights of what
    SAP HCP can be used for:


    +   - Using the various runtime containers, you can build and deploy custom or
    extension applications using the Java, native SAP HANA, and HTML5 programming
    models.

    +   - Using the SAP Cloud Connector component, you can connect with on-premise
    and third-party services in a secure and reliable manner.

    +   - You can design mashup portal sites that aggregate content from SaaS applications,
    extension apps, and third-party applications.

    +   - You can build interfaces to exchange data between cloud and on-premise systems.

    +   - You can create custom mobile applications that leverage data from cloud
    and on-premise systems in a secure manner.'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'As you consider these possibilities, we should point out that the scope of
    solutions deployed on SAP HCP is not limited to custom applications developed
    by customers. Because SAP HCP is an open platform, the SAP partner ecosystem (and
    even SAP itself, for that matter) can also target SAP HCP as a means for developing
    and distributing extension applications.


    Because of its flexibility, it’s quite likely that many industry-specific innovations
    within the SAP landscape will make their way over to SAP HCP. As more and more
    SaaS offerings become closed off for custom development, SAP HCP will become the
    one place where customers and partners can come to develop application extensions.
    For developers who enjoy working with SAP HCP, this is an exciting and intriguing
    possibility.


    # 1.4 Summary


    In this chapter, you were able to gain a better understanding of what SAP HCP
    is and its role in the next-generation SAP technology landscape. Specifically,
    you learned how SAP HCP is positioned as a PaaS offering in SAP’s cloud strategy.
    As you progress throughout the remainder of this book, we’ll be expanding on the
    high-level concepts reviewed in this chapter in order to see how they’re applied
    in real-world implementation scenarios.


    Before we delve into specifics, though, we first need to take care of a few administrative
    items. Therefore, in the next chapter, we’ll show you how to obtain access to
    an SAP HCP account, set up your development tools, and get up and running with
    SAP HCP.'
  merge: -1
