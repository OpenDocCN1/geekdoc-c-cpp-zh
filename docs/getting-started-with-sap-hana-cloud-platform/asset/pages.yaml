- pgno: 58
  md: 'Before we move on, we should probably make mention of one minor housekeeping
    task you should be aware of if you''re working behind a proxy or firewall. Because
    Eclipse receives its updates over HTTP connections, you must configure your proxy
    settings in order to extend Eclipse for use with SAP HCP. To configure a proxy
    server connection, perform the following steps:


    +   1. From within Eclipse, select the WINDOW • PREFERENCES menu option within
    the top-level menu bar, and then drill into GENERAL • NETWORK CONNECTIONS.


    +   2. From the Network Connections panel shown in Figure 2.10, select the appropriate
    schema (e.g., HTTP and/or HTTPS) in the Proxy entries table, and click on the
    EDIT... button.


    ![](img/cf7012644082c115a2181376d9b7486d_58_0.png)


    Figure 2.10 Configuring Proxy Server Access in Eclipse


    +   3. Then, in the Edit Proxy Entry subdialog box, enter the proxy host name
    and port, as well as authentication details as necessary. Click on the OK button
    to confirm your selections.


    +   4. Finally, as necessary, you can use the PROXY BYPASS table to configure
    a list of hosts that you want to access without using the proxy server.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Installing the SAP Development Tools


    At this point, you should have a vanilla version of Eclipse installed on your
    local machine. Although this Eclipse instance is fully functional, it doesn''t
    come equipped with any SAP or SAP HCP-specific features. To add these features,
    we must download and install the necessary plug-ins from SAP. This can be achieved
    by performing the following steps:


    +   1. To begin, we need to log on to the SAP Development Tools for Eclipse installation
    site, available online at https://tools.hana.ondemand.com/#cloud. As you can see
    in Figure 2.11, this site provides installation sites for several recent Eclipse
    distributions (e.g., Eclipse Luna 4.4 and Eclipse Kepler 4.3 as of the time of
    writing). Copy the URL for your version of Eclipse to your clipboard.


    ![](img/cf7012644082c115a2181376d9b7486d_59_0.png)


    Figure 2.11 Locating the SAP HCP Tools Installation Site


    +   2. Next, open up the Eclipse IDE, and select HELP • INSTALL NEW SOFTWARE...
    from the top-level menu bar.


    +   3. This will open up the INSTALL dialog box shown in Figure 2.12. From this
    screen, paste the installation site URL copied in step 1 into the Work with input
    field, and click on the Add... button. In the ADD REPOSITORY dialog box, give
    the repository a name, and click on the OK button. By naming the repository, we
    can use the same repository later on to check for updates and update the software
    as needed.'
  merge: -1
