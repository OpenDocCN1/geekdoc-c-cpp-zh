    # 7.3.3 Accessing External Resources


    Most of the time, the HTML5 applications that you develop on SAP HCP will need
    to consume data from RESTful services that are not directly accessible from the
    public Internet. Examples of the types of services you might want to access here
    include the following:


    +   - OData services developed using other application models supported by SAP
    HCP, such as Java or SAP HANA XS

    +   - RESTful services hosted by third-party partners or service providers

    +   - On-premise services exposed via the SAP HANA Cloud Connector or SAP HANA
    Cloud Integration (SAP HCI)


    To facilitate these kinds of requests, you can once again turn to the Connectivity
    Service that we covered in Chapter 6. In order to understand how this works, it’s
    helpful to look at a demonstration that shows how all the pieces fit together.
    With that in mind, in the upcoming sections we’ll walk you through a scenario
    in which you’ll hook up an SAPUI5 application to a sample OData service called
    “Northwind” that’s hosted on the official OData site. This service defines a handful
    of intuitive entity types, such as customers, sales order, and so on. You’ll use
    these entities to create a simple application that allows users to scroll through
    a customer’s sales orders.


