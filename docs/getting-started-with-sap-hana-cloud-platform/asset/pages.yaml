    # 2.3.3 Installing the SAP JVM


    One last item that we would encourage you to install when setting up your development
    environment is the SAP JVM. As we''ll learn in Chapters 3 and 4, this optional
    step allows us to tap into some of the powerful profiling capabilities of the
    SAP JVM when tuning Java applications.


    The SAP JVM can be downloaded from the same downloads page we used to download
    the SAP HCP SDK: https://tools.hana.ondemand.com/#cloud. In the SAP JVM section
    of the page, simply download the appropriate bundle for your OS configuration.
    You can find installation instructions for your particular OS in the SAP HANA
    Cloud Documentation available online at https://help.hana.ondemand.com/help/frameset.htm.
    Here, browse to Java Development • Getting STARTED • INSTALLING JAVA TOOLS FOR
    ECLIPSE AND SDK • INSTALLING SAP JVM.


    After the SAP JVM is installed, you can associate it with the set of installed
    JREs in Eclipse by performing the following steps:


    +   1. Open up Eclipse, and from the main menu select WINDOW • PREFERENCES.

    +   2. Expand the JAVA • INSTALLED JRES folders, and click on the ADD... button.'
