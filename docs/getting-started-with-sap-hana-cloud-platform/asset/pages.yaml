- pgno: 460
  md: "This chapter introduces a number of options to extend existing cloud products\
    \ from SAP using SAP HCP applications. We'll look at the different integration\
    \ options, the technology aspects involved, and the underlying infrastructure\
    \ required for an end-to-end solution.\n\n# # 11 Extension Scenarios with SAP\
    \ HANA Cloud Platform\n\nIn previous chapters, you learned about the core features\
    \ of SAP HCP and how to create and deploy real applications both on the local\
    \ development server and on the cloud. In this chapter, we will explore how to\
    \ put that knowledge to good use to extend some of the SAP Cloud products. We\
    \ start the discussion of extending applications with SAP HCP by explaining why\
    \ there is a need to do so in the first place (Section 11.1). After that, we'll\
    \ dive into the details: the architecture of an extension (Section 11.2) and the\
    \ specific integration points that you can use (Section 11.3). The chapter concludes\
    \ with an overview of the process of extending SuccessFactors using SAP HCP (Section\
    \ 11.4).\n\nThere are three key principles that SAP follows for every SAP HCP\
    \ extension integration project:\n\n+   - One unified experience for SAP partners\
    \ creating extensions for all SAP Cloud products: the same development process,\
    \ onboarding, support, and operations\n+   - One unified experience for SAP customers\
    \ leveraging and managing extensions: tightly integrated administration experience,\
    \ embedded extensions catalog, and optional trial for certified extensions\n+\
    \   - Zero integration costs for running SAP HCP applications next to an existing\
    \ SAP Cloud solution\n\n> **Note**\n> \n> This chapter focuses mostly on the SuccessFactors\
    \ Employee Central product and the specifics when extending it, but the principles\
    \ outlined in the chapter are generic"
  merge: -1
  img_proc: true
- pgno: 461
  md: 'enough to be applied to other SAP Cloud products as well—for example, Ariba,
    SAP Fieldglass, hybris, Concur, and so on. Thus, when we use the phrase “the extended
    SAP Cloud solution” in this chapter, we are using it as a generic term to refer
    to any of these products. Nevertheless, keep in mind that there are always specifics
    to consider when working with the APIs of the different solutions.


    # 11.1 The Need for Software-as-a-Solution Extensions


    One of the major differences between the Software-as-a-Service (SaaS) world and
    the on-premise world is that in the on-premise world, IT teams are fully in control
    to plan process updates and execute on new requirements and ideas. They can directly
    influence every layer starting from the bare metal hardware, through the network,
    system setup, and business objects model, and reaching to the UI-level customizations.
    In such an environment, meeting business commitments is only a matter of good
    organization, technical ability, and budget. The head of corporate IT has the
    responsibility to control the ratio between risk and innovation from one side
    and actively manage the demands from the different business units from another.


    On the other hand, SaaS solutions typically strongly emphasize the fact that there
    is “one code line” and a “continuous flow of innovation” with frequent release
    cycles. Cloud applications typically provide only the industry best practices,
    common to the complete customer base. Introducing customer-specific features in
    the main code line is practically not possible in an economically efficient way.
    Because the product is provided “as a service” by the vendor, corporate IT teams
    no longer have influence over any of the underlying layers. They effectively become
    key users, and their new role is to educate business users and channel feedback
    to the corresponding vendor. In many cases, corporate IT has to defend and explain
    why an anticipated business workflow can’t be put in production in the same short
    timeframes that were possible previously with on-premise systems. In the aviation
    industry, this phenomenon is called loss of control (LOC). Some would argue that
    this is a good thing, because cloud vendors would know better how to run their
    software at scale in an efficient manner—but, as we’ve outlined in this paragraph,
    it does have its drawbacks.'
  merge: -1
  img_proc: true
- pgno: 462
  md: "At the same time, transition to the cloud and SaaS is an unstoppable trend.\
    \ In order to address the loss-of-control issue associated with the transition\
    \ to cloud solutions, SAP is on a journey to equip corporate IT teams with the\
    \ necessary tools and practices to keep providing high-quality services to their\
    \ respective business stakeholders.\n\nDepending on the market and the industry,\
    \ there are a number of white space areas that SAP will not have the capacity\
    \ to get on to its own any time soon, making them perfect for cloud extension\
    \ applications. (Though at a later stage, these might be covered by standard SAP\
    \ products.) One example is that of country-specific scenarios, which are impacted\
    \ by the regional regulatory frame. Let's look at some particular cases:\n\n+\
    \   > **Company car management**\n+   \n+   Germany is known as a car country.\
    \ More than 85% of the high-end cars purchased there are registered to companies.\
    \ The tax frame in the country stimulates companies to offer company cars as an\
    \ employee perk. A potential HR extension application in that space could cover\
    \ all the processes around choosing, ordering, managing, servicing, and finally\
    \ returning a company car. The same practice is not at all common in the United\
    \ States or in Asia, making the scenario a niche one.\n\n+   > **Employee health\
    \ and safety**\n+   \n+   Another example from Germany is the regulatory frame\
    \ defining how employee health and safety are to be managed by large companies.\
    \ This includes emergency phone numbers, regular first aid training sessions,\
    \ and so on. An extension application would ideally cover all the specifics of\
    \ that process for a large company with multiple office locations in Germany.\
    \ There are similar (but still different) corporate requirements for companies\
    \ in other regions, such as Tokyo, Singapore, China, and so on.\n\nAnother dimension\
    \ on top of the local regulations are industry-specific scenarios:\n\n+   > **Pharmaceutical\
    \ industry**\n+   \n+   Companies in the pharmaceutical industry in Europe are\
    \ required to maintain a set of certificates for each of their R&D employees,\
    \ ensuring that they are qualified to work on certain types of drugs and have\
    \ been trained to work with particular dangerous substances."
  merge: -1
  img_proc: true
- pgno: 463
  md: '# Automotive industry


    Large automotive companies in Europe are obliged to provide mandatory training
    to employees prior to allowing them to operate certain classes of equipment.


    When combining country-specific and industry-specific requirements on a global
    scale, the result is countless niche scenarios that are perfectly suited to be
    implemented as extension applications. And this doesn''t even take into consideration
    all the company-specific practices that enable different business to stand out
    and differentiate from the competition.


    In an ideal world, all of these scenarios would be covered by corresponding standard
    cloud products. However, from a pure effort perspective, doing so is not realistic.
    The regulatory framework is constantly evolving. Therefore, the only way to scale
    in this global environment is to enable customers to cover their specific process
    variations without being dependent on a single vendor.


    This situation also opens up a significant business opportunity to application
    development partners. Despite the push towards software standardization, specific
    customizations will always be required. The region- and industry-specific requirements,
    combined with the constant strive of companies to compete, will grow the extension
    application market in the next years to come.


    # 11.2 The Architecture of an Extension


    SAP HCP is positioned as the extension platform for all SAP products going forward.
    Throughout the book, you''ve learned that SAP HCP is a secure and scalable application
    container that can integrate in a secure manner to both cloud and on-premise systems
    (Figure 11.1). You can develop extension applications on SAP HCP, granting them
    access to the SAP Cloud solution APIs. In that way, you can create tailored business
    workflows that fit precisely to your specific business needs. This approach requires
    no structural changes in the underlying SAP Cloud products, and therefore there
    is no need to avoid subsequent frequent product updates. At the same time, this
    approach strongly relies on the availability of'
  merge: -1
  img_proc: true
- pgno: 464
  md: 'stable and robust APIs. In order to achieve this and provide a first-class
    experience to customers, SAP HCP is being integrated deeply in all SAP Cloud products
    both from administration and end user perspectives.


    ![](img/cf7012644082c115a2181376d9b7486d_464_0.png)


    Figure 11.1. SAP HCP Serving as a Secure Application Container for SAP Cloud Solution
    Extension Applications


    The typical SAP HCP-based extension application follows the classical three-tier
    software architecture, and brings in solution-specific native artifacts to be
    imported in the extended SAP solution. First of all, it is a normal SAP HCP application.
    It integrates with the extended SAP solution via (typically) OData APIs. Ideally,
    it is running on SAP HCP in the same (or a close enough) datacenter together with
    the extended solution. In any case, both the extended SAP Cloud solutions and
    SAP HCP are hosted by SAP and enable applications to communicate through a secure,
    SSL-encrypted connection. In some cases, extension applications also consume data
    from other backend systems that reside either in the cloud or on-premise. An extension
    application may also bundle native artifacts specific to the extended SAP Cloud
    solution, such as custom business objects, generated UI definitions, data view
    definitions, roles, permissions, and so on (Figure 11.2).'
  merge: -1
  img_proc: true
- pgno: 465
  md: '![](img/cf7012644082c115a2181376d9b7486d_465_0.png)


    # Figure 11.2 SAP HCP Extension Application Interaction Points


    On one side are the SAP HCP extension applications, which are specifically implemented
    to interact with the extended solution via APIs. Underneath is the SAP HCP account,
    defining the environment for the extension application to run in (Figure 11.3).


    ![](img/cf7012644082c115a2181376d9b7486d_465_1.png)


    # Figure 11.3 SAP HCP Extension Account Coupling to the Extended SAP Cloud Solution


    Please note that SAP HCP extension accounts do not function separately from the
    extended SAP Cloud solution. What makes extension accounts special? Figure 11.3
    shows some of the reasons:'
  merge: -1
  img_proc: true
- pgno: 466
  md: 'There is a hard 1:1 mapping between SAP Cloud solution accounts or tenants
    and SAP HCP extension accounts. If you happen to have 10 SuccessFactors tenants,
