- pgno: 496
  md: 'There is one last detail at the end in order to enable successful login from
    the application through the default SuccessFactors IdP. In addition to X.509 certificates,
    SuccessFactors utilizes a whitelist of Assertion Consumer Service (ACS) URLs that
    are allowed to send authentication requests to its IdP. This is implemented to
    prevent potential denial-of-service attacks on the login screen from multiple
    URLs.


    To configure the authentication whitelist, perform the following steps:


    +   1. Log in to SuccessFactors Provisioning, and select the company you would
    like to manage.


    +   2. In the SERVICE PROVIDER SETTINGS section, select AUTHORIZED SP ASSERTION
    CONSUMER SERVICE SETTINGS.


    +   3. You will see a view like the one shown in Figure 11.16.


    +   4. Click on Add another Service Provide ACS, and a new line with empty text
    boxes will appear.


    +   5. In the ASSERTION CONSUMER SERVICE column, paste the URL of your application
    (you can obtain it from the SAP HCP Cockpit in the APPLICATION DETAILS view under
    the APPLICATION URLS section).


    +   6. In the LOGOUT URL and the AUDIENCE URL columns, paste the same values that
    you can find for the cloudwcportal application (line 5 of Figure 11.16).


    +   7. If you''d like to leverage IdP-initiated login, then you also have to come
    up with a SP Mapping Key value, which can be any string value. We''ll need that
    at a later stage in order to register a new custom tile on the SuccessFactors
    home page.


    +   8. Don''t forget to click on the blue Save button!


    ![](img/cf7012644082c115a2181376d9b7486d_496_0.png)


    Figure 11.16 SuccessFactors Provisioning ACS Whitelist Configuration'
  merge: -1
  img_proc: true
- pgno: 497
  md: 'With one of the next releases of SAP HCP, all of the above steps will be incrementally
    automated for extension accounts and will be triggered during extension application
    installation. Therefore, you will no longer need to perform any of these steps
    manually, although it’s of course important to be aware of the underlying mechanics,
    so that you can troubleshoot potential integration issues.


    # 11.4.6 Creating Custom MDF Objects and Consuming Them from SAP HCP


    The MDF is an essential part of SuccessFactors’ customization and extensibility.
    Combined with the flexibility of SAP HCP and the low-touch, easy integration,
    it forms one of the most flexible offerings for customizing and enriching SaaS
    solutions on the market.


    Custom MDF objects always start their existence in a SuccessFactors system. They
    are modeled using the Object Definitions tool in SuccessFactors OneAdmin. You
    can access this tool via ADMIN TOOLS • COMPANY SETTINGS • CONFIGURE OBJECT DEFINITIONS.
    It’s critical to set the API visibility flag of newly created objects to EDITABLE
    or Read-ONLY. If it’s set to Not Visible, then this will mean that the object
    is not exposed via the OData API and is practically out of reach of SAP HCP applications.
    All custom MDF objects’ names start with cust_ by default. Once you’ve though
    with modeling and saving your custom MDF object, don’t forget to make it visible
    to the outside world using the OData API Metadata Refresh and Export tool in Admin
    Tools. Prior to triggering the refresh, your object won’t be present in the OData
    API data model.


    On the SAP HCP application side, you’ll work with the custom MDF objects the same
    way that you work with any other entity in SuccessFactors, by using the sap.hcmcloud.core.odata
    destination; however, you will query entities starting with cust_ instead.


    # 11.4.7 Creating Custom Home Page Tiles Hosted on SAP HCP


    When you log in to a SuccessFactors system, regardless of the modules licensed,
    you’ll be greeted by the SuccessFactors home page (Figure 11.17). The home page
    enables user-level personalization of the product experience and allows you to
    collect all the key ingredients in one common screen.'
  merge: -1
  img_proc: true
- pgno: 498
  md: 'As noted in Section 11.3.8, it''s possible to extend the set of visible tiles
    by registering custom ones. In addition to being a standard feature of the product,
    tiles are also a great way to incorporate experience and integration with third-party
    products. SAP HCP extensions make use of that opportunity. Your next question
    may be: How do I register a tile?


    ![](img/cf7012644082c115a2181376d9b7486d_498_0.png)


    Figure 11.17 SuccessFactors Enterprise Home Page


    Once you log in as a company admin, home page tiles configuration is accessible
    via ADMIN TOOLS • COMPANY SETTINGS • MANAGE V12 HOME PAGE (Figure 11.18).


    You will see a comprehensive overview of all tiles delivered as part of the standard
    product, including some third-party integration tiles. If you want some tiles
    to be visible to all users in the system, then make sure they are listed in the
    DEFAULT section. If you want to introduce optional tiles that end users can pull
    out of a catalog, then have them in the AVAILABLE section. If there are tiles
    that you want to keep but that are not in use anymore, then move them to the Nor
    USED section.'
  merge: -1
  img_proc: true
- pgno: 499
  md: '![](img/cf7012644082c115a2181376d9b7486d_499_0.png)


    Figure 11.18 SuccessFactors Enterprise v12 Home Page Configuration


    For each tile, you can specify whether end users should have the freedom to remove
    it from the home page and the default size it should be rendered in.


    The SuccessFactors home page in version v12 supports three tile sizes:


    +   - Medium: 138 pixels wide

    +   - Large: 296 pixels wide

    +   - Extra-large: 612 pixels wide


    All of the tile rules apply both to standard and custom tiles. Having a reasonable
    strategy for managing the system home page gives you a powerful tool for rolling
    out new initiatives, campaigns, and tools to the whole employee base.


    Looking beyond the standard available tiles, you can register a new one by clicking
    on ADD CUSTOM TILE (Figure 11.19).'
  merge: -1
  img_proc: true
- pgno: 500
  md: '![](img/cf7012644082c115a2181376d9b7486d_500_0.png)


    # Figure 11.19 Custom Tile Creation Wizard


    In addition to the standard properties (e.g., Tile NAME, DISPLAY SIZE, TITLE,
    and DESCRIPTION), you have the opportunity to specify the target audience and
    the timeframe you plan to target it in.


    The SHOW TILE FOR THIS GROUP field gives you the option to narrow down the group
    of people who will see the custom tile. We strongly recommend not relying on visibility
    constraints only, but also performing active group membership checking in the
    backend services consumed by your tile UI.


    Another useful feature defined by the SHOW TILE ON THESE DATES field allows you
    to specify the effective dating of the custom tile. By default, it’s set to ALL
    DATES. This means that a tile will immediately become visible to the complete
    targeted population once you click on the SAVE button.


    The next aspect of a custom tile to consider is the body it will render. As a
    rule of thumb, it has to be as informative and as context specific to the current
    user as possible. Polluting users’ home pages with static tiles is generally suboptimal.
    Users will simply tick that tile away from their home page, or even worse will
    keep it there and start complaining.'
  merge: -1
  img_proc: true
- pgno: 501
  md: 'For managing the content of you custom tile, you have a rich wizard, allowing
    some predefined standard operations, such as embedding flash components, images,
    links, or pretty much any piece of HTML code. Therefore, you can embed any page
    that you’re serving out as an SAP HCP application in a SuccessFactors custom home
    page tile. One sample HTML snippet to use is as follows:


    ```

    <iframe border="0" frameborder="0" src="//sf-idp-init/sso/customWidgetLaunch?parameter1=value&amp;parameter2=value"
    style="width: 100%;height:235px">

    ```


    If you look closely at the snippet, you’ll notice that there is no pointer to
    any SAP HCP-specific URL. We could instead have a direct URL to your SAP HCP application,
    but then you’ll see all the CORS issues described in Section 11.3.8. Therefore,
    we’ve defined a particular custom SP mapping key, which in turn is used for IdP-initiated
    SSO, embedding the referenced application content in the defined iFrame. Any parameters
    you pass to the SuccessFactors IdP URL will be transparently passed along to the
    target URL. In that way, you can achieve a much more tailored personal experience
    in your integration.


    # 11.4.8 Managing Custom Navigation Entries


    Another key aspect of making your SuccessFactors extension reachable for users
    is to register it in the different navigation systems inside SuccessFactors, such
    as the top-level navigation or the personal profile menus. This is done via ADMIN
    TOOLS • COMPANY SETTINGS • CONFIGURE CUSTOM NAVIGATION (Figure 11.20).


    ![](img/cf7012644082c115a2181376d9b7486d_501_0.png)


    Figure 11.20 SuccessFactors Custom Navigation Management Tool'
  merge: -1
  img_proc: true
- pgno: 502
  md: 'This management tool allows you to plug any arbitrary link into the navigation
    menus, specifying certain conditions. One aspect to configure via the Link Type
    field is how the navigation should behave. Should it open the link in the same
    window, effectively handing over the control, or should it open the link in a
    new window, retaining the control in the original one? For SAP HCP extensions
    using SAP HANA Cloud Portal as the frontend, EXTERNAL LINK—SAME Browser should
    be selected. At first, it looks as if we’re navigating away from SuccessFactors.
    Although technically correct, this is misleading, because the newly opened SAP
    HANA Cloud Portal site delivers the same header and footer as any other page inside
    SuccessFactors. Therefore, there should be no visible difference between an extension
    page and another page inside SuccessFactors.


    Another field to consider is the PERMISSIONS field, which lists all existing permissions
    in the system, thus providing fine-grained access control to navigation. The general
    philosophy here is that if a user is not allowed to perform some operation, then
    it should not show up in the menus for that user. Ideally, we should never see
    an Access Denied error when simply browsing around.


    # 11.4.9 Troubleshooting SuccessFactors Extension Applications


    Once you’re done with development and moving toward real business, it’s essential
    to be aware of the different tools offered by the SuccessFactors stack. These
    tools enable you to develop and troubleshoot applications in the most efficient
    manner.


    We learned about the two different layers of administration in SuccessFactors
    in Section 11.4.1. We’ll leave the SuccessFactors Provisioning environment aside
    for now, as customers typically don’t have access to it. Instead, we’ll focus
    on the tools accessible to customer key users and developers.


    As a developer, some burning questions may include the following: Where do I see
    the results of my API calls? Are they successful? Did they fail? What is the response
    code returned? For administrators, a reasonable concern might revolve around auditing
    what data is exposed from the system via APIs and how to keep track of that.


    In general, when you’re looking for a particular SuccessFactors administration
    tool, you can always start from the search bar in the OneAdmin view (Figure 11.21).'
  merge: -1
  img_proc: true
- pgno: 503
  md: '![](img/cf7012644082c115a2181376d9b7486d_503_0.png)


    Figure 11.21 Tool Search Feature in SuccessFactors OneAdmin


    If what you''re typing doesn''t autocomplete, then this means either that there
    is no such tool or that you don''t have the required permissions to access it.


    # SFAPI Tracing


    SuccessFactors SFAPI is practically the oldest public integration API from SuccessFactors
    to be exposed publicly. It is based on SOAP and is primarily used for data replication
    and synchronization with external systems. It is therefore the basis for many
    of the prepackaged delivered integrations.


    It''s worth mentioning that SFAPI has to be explicitly enabled in Provisioning
    and that the corresponding administrator role permissions need to be granted.
    Those permissions include the following:


    +   - Access to the SFAPI Data Dictionary

    +   - Access to the SFAPI Audit Log

    +   - Access to the SFAPI Metering Details


    When planning to use SFAPI, the first thing to consider is the SFAPI Data Dictionary.
    It shows you all the available fields and objects you can query on. It also describes
    the fine-grained permissions for each of the fields. You can find it in Admin
    Tools • COMPANY SETTINGS • SFAPI DATA DICTIONARY (Figure 11.22).


    There are entities in the object data model that, although accessible through
    SFAPI, must be explicitly enabled via Provisioning in order to show up in the
    data dictionary. One example is employee personal information, which is there
    but not exposed by default.


    If you have a scenario where you need to replicate data from a backend system
    to SuccessFactors or simply keep SuccessFactors in sync with another system, then
    you''ll most probably end up using SFAPI in combination with SAP HCI, Dell Boomi,
    SAP Process Orchestration, or yet another integration product you might'
  merge: -1
  img_proc: true
- pgno: 504
  md: 'have already. In SAP HCP extension accounts for SuccessFactors, SFAPI would
    be accessible for applications using the sap_hcmcloud_core_soap destination. Keep
    in mind that due to the service user it’s accessible through, it’s not suitable
    for interactive end-user extension applications, but primarily for integration
    purposes and data synchronization.


    ![](img/cf7012644082c115a2181376d9b7486d_504_0.png)


    Figure 11.22: SFAPi Data Dictionary: UserPhoto Object Details


    SFAPI also offers a comprehensive audit log, tracing all the calls performed with
    all the necessary details and allowing further drill down and follow up. It includes
    HTTP headers, cookies, and calling user details. Another feature you’ll find useful
    is the correlation ID, which allows you to troubleshoot a problem across multiple
    modules while the other productive requests are running just fine. You’ll find
    the correlation ID attached to all the associated system log records. The SFAPI
    Audit Log also provides the raw HTTP request, containing all the HTTP headers
    and the raw SOAP payload. It also does some preprocessing to derive which business
    object was accessed. Based on all of those properties, there is a powerful filtering
    mechanism that allows you to get insights over the incoming calls. For example,
    you can query for a particular timeframe over specific objects in which the query
    took more than x seconds.


    The next tool worth mentioning as part of the SuccessFactors OneAdmin environment
    is the SFAPI Metering Details, which shows the level of utilization of the API,
    including number of requests, processing time and throughput, and so on. Historical
    data is kept for 30 days. Typically, Metering Details would be the tool that administrators
    monitor for unusual activity. It is one of the first points'
  merge: -1
  img_proc: true
- pgno: 505
  md: 'start from in the unlikely situation that you observe data inconsistencies
    between SuccessFactors and other systems that have scheduled synchronization configured.


    If you start observing high load volumes, then it might be useful to consider
    enabling API throttling, which is configurable via Provisioning and defines the
    number of parallel requests that the system will allow to that particular company
    account.


    # OData API Tracing


    There are a number of similarities between the features that SuccessFactors OData
    APIs offer and what you''ve seen already for SFAPI. From an evolution perspective,
    OData is the strategic direction in which all SuccessFactors modules are going.


    There is a set of permissions that you''d need in order to dig into OData API
    details:


    +   Access to the OData API Audit Log


    +   Access to the OData API Data Dictionary


    The OData API Data Dictionary provides the same overview of all the fields of
    each of the exposed objects, including all the supported operations, such as Insertable,
    Upsertable, Selectable, Sortable, Filterable, and the field Max Length.


    Similar to SFAPI, the SuccessFactors platform offers a comprehensive audit log
    for all the performed OData calls. What would you use this tool for? Assume that
    you have your SAP HCP application, which is calling the SuccessFactors OData API.
    In SAP HCP extension accounts for SuccessFactors, the OData API is accessible
    via the sap_hcmcloud_core_odata destination.


    It''s very useful to control both the client and the server at the same time,
    because you can check the corresponding traces and determine what the potential
    problem might be. Moreover, you can verify whether your application is really
    making the API calls you''re expecting it to make, using the proper object references.
    This is increasingly crucial nowadays as development in many areas is moving higher
    in the abstraction levels and actual API calls are made using code generation.'
  merge: -1
  img_proc: true
- pgno: 506
  md: 'The OData Audit Log provides the same flexibility to filter the traced requests
    and get further insights. In the future, both the SFAPI and the OData Audit Logs
    will leverage the upcoming API management service layer, thus allowing for further
    improvements and insights into both environments.


    ![](img/cf7012644082c115a2181376d9b7486d_506_0.png)


    Figure 11.23 SuccessFactors OData API Audit Log Tool


    # Frequently Asked Questions about SuccessFactors Extensions


    One of the most critical aspects to consider when planning your extension scenario
    is whether it’s feasible to implement, given the currently available APIs. By
    default, you can safely assume that SAP HCP can integrate with any system that
    is either directly accessible via the Internet or can be accessed on-premise using
    SAP Cloud Connector. Given the flexible nature of SAP HCP, you can implement pretty
    much any scenario there, involving an arbitrary set of external services (from
    SAP and its partners). Therefore, knowing whether certain customizations or extensions
    can be implemented boils down to answering the following questions:


    +   - Is the data required for this scenario available via API for the SAP HCP
    application to consume or modify?

    +   - Is the workflow in which customization is required able to cope programmatically
    with custom steps and results coming from external systems?

    +   - Is the screen in which you’d like to embed a UI allowing UI mashup, or does
    it have to be rebuilt from scratch on SAP HCP?


    Depending on the answers to the preceding questions above, you can judge the feasibility
    of the scenario in question. Whenever you encounter situations that can’t be implemented
    as of today, don’t give up or panic. SuccessFactors has a quarterly release cycle,
    and new entities are exposed with every release. There is an aggressive roadmap
    in place to OData-enable all of the SuccessFactors modules by 2016; therefore,
    chances'
  merge: -1
  img_proc: true
- pgno: 507
  md: 'are high that what''s not possible today will be possible in one of the subsequent
    releases.


    Another frequently asked question is whether to use an SAP HCP application to
    integrate with a third-party system or whether to use Dell Boomi or SAP HCI instead.
    The answer is that it actually depends. If you''re only after headless integration,
    running on regular intervals and doing predefined attribute mapping, then both
    Dell Boomi and SAP HCI are good choices. If you''re after higher workloads, then
    SAP HCI should be your default option. However, if you would like to have some
    user interaction as part of the integration or to have an interactive status presented
    to end users embedded in the product, then SAP HCP extension applications are
    the natural choice, building on top and relying on the already configured SAP
    HCI integrations.


    # 11.5 Summary


    The need for extensibility will only grow as more and more companies adopt cloud
    solutions. Although technically challenging for many SaaS providers to offer as
    a feature, extensibility definitely will not go away, because businesses are different
    and will continue to be different 10 years from now. There is also a clear need
    for standardization and reduced integration costs, which will drive consolidation
    and support the emergence of a number of extension partner companies specializing
    in particular product niches in multiple markets and growing side by side with
    the SAP Cloud solutions. As the default option for building extension applications
    with zero integration cost for all SAP Cloud solutions, SAP HCP is well set for
    all of those scenarios, enabling and the vibrant application development partner
    ecosystem to provide smarter solutions to customers.'
  merge: -1
  img_proc: true
