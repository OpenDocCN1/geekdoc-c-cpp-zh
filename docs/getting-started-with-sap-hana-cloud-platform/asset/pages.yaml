- pgno: 180
  md: '# Setting up a Repository Workspace


    Even though Eclipse maintains a live connection to the remote SAP HANA Repository,
    it’s important to note that changes you make to artifacts in Eclipse will be applied
    locally. This is to say that the files will be maintained in a directory on your
    local machine, and you’ll need to periodically synchronize these files with the
    remote SAP HANA Repository.


    Rather than having to coordinate these changes on our own, the SAP HANA Tools
    make it possible for us to track these changes within a repository workspace.
    In the upcoming sections, we’ll find that repository workspaces greatly simplify
    the task of checking in updates to the SAP HANA Repository.


    To set up a repository workspace in Eclipse, perform the following steps:


    +   1. Switch to the SAP HANA Development perspective in Eclipse.


    +   2. From the REPOSITORIES view shown in Figure 5.8, right-click on your remote
    system connection and select the CREATE REPOSITORY WORKSPACE menu option.


    ![](img/cf7012644082c115a2181376d9b7486d_180_0.png)


    Figure 5.8 Creating a Repository Workspace: Part 1


    +   3. In the CREATE NEW REPOSITORY WORKSPACE dialog box shown in Figure 5.9,
    assign your workspace a name and a root directory location. The latter refers
    to a directory on your local machine where you’ll store all of your repository-related
    objects during development.


    +   4. Once all of the proper settings are in place, click on the Finish button
    to create the workspace.


    For now, that’s all there is to it. A little bit later on, we’ll see how this
    repository is used to track SAP HANA XS project artifacts and perform remote activations
    in the SAP HANA Repository.'
  merge: -1
  img_proc: true
- pgno: 181
  md: '![](img/cf7012644082c115a2181376d9b7486d_181_0.png)


