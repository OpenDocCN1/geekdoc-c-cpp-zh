    # 5.4.1 Defining a Persistence Model Using Core Data Services


    As a fully SQL-compliant database, it''s fairly easy to create your application''s
    database tables from the SQL command line using the data definition language (DDL).
    However, as it turns out, SAP HANA provides several alternatives for defining
    tables that greatly simplify logistics as you promote your application(s) through
    the system landscape. In essence, these alternatives call for the creation of
    SAP HANA-specific metafiles, which define tables in logical terms. Whenever we
    deploy these metafiles to the SAP HANA Repository, SAP HANA uses the metadata
    to automatically create the corresponding physical tables on our behalf. If you''re
    familiar with the ABAP programming environment, this behavior is similar to transparent
    table definitions in the ABAP Data Dictionary.


    These days, an emerging standard for defining tables or views in SAP HANA is Core
    Data Services (CDS). Conceptually, you can think of CDS as an SAP HANA-specific
    metalanguage that allows us to define reusable types, entities, views, and so
    forth in a generic manner. For our purposes, we''ll be using CDS to build out
    the table schema shown in Figure 5.19. This simple model introduces a pair of
    entities (Books and Authors) that are linked by an association table (BookAuthors).


    ![](img/cf7012644082c115a2181376d9b7486d_188_0.png)


    Figure 5.19 Entity-Relationship (E-R) Diagram for Bookstore Data Model'
  merge: -1
  img_proc: true
