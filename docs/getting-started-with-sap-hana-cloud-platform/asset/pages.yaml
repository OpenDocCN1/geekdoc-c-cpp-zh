    # ## 9.2 Understanding SAP HANA Cloud Portal''s Content Model


    Effective site design within SAP HANA Cloud Portal starts with an understanding
    of its underlying _content model_. Here, we''re talking about the basic building
    blocks that make up a site definition: pages, widgets, and so forth. Collectively,
    these elements are used to organize portal content into a cohesive and intuitive
    site layout.


    Figure 9.5 shows the primary elements that make up SAP HANA Cloud Portal''s content
    model. As you can see, portal sites consist of the following:


    +   - At the top of the hierarchy, there are _site definitions_ that contain details
    about the site as a whole. Here, you can specify the site''s theme (i.e., its
    look and feel), its structure, security settings, and more.


    +   - The structure of a site is defined by assembling one or more _pages_ into
    a page hierarchy. To a large degree, pages within the portal content model are
    analogous to the pages you would find in traditional web sites.


    +   - The content area of pages is defined in terms of one or more OpenSocial
    widgets. The list of widgets to choose from here includes a number of out-of-the-box
    widgets, as well as third-party or custom widgets you import into the SAP HANA
    Cloud Portal content directory.


    Looking at the model diagram depicted in Figure 9.5, it''s pretty plain to see
    how all of the various pieces fit together. As a result, it can be tempting to
    jump right into the site designer tool and begin dropping in content. However,
    we''d encourage you to exercise some restraint and spend some time up front planning
    your site layout and collecting the relevant OpenSocial widgets. Because the name
    of the game with site design is to provide users with a simple and intuitive experience,
    it really pays to think about how best to organize your content within this content
    model.'
  merge: -1
  img_proc: true
