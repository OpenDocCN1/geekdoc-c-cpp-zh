- pgno: 449
  md: '# 10.5 Introduction to the Web UI for SAP HANA Cloud Integration


    As an alternative to the Eclipse IDE, you can use the web UI client for SAP HCI.
    The SAP HCI web UI is a web-based IDE; it’s also known as SAP HCI Spaces. It has
    numerous advantages compared to the Eclipse IDE. One of the most significant ones
    is that developers don’t need to install anything locally; there is no need to
    worry about the consistency of versions between the local IDE and the server.
    The developer only needs a browser and Internet connection in order to start development
    activities. This fact alone reduces the development effort and saves costs.


    In this section, we will explore the different tools that make up the web UI development
    platform. The landing page of the web UI can be accessed via http://<operations
    server url>/<spaces>.


    As can be seen on the left side of Figure 10.14, the SAP HCI web UI consists of
    the following four main sections:


    +   - DISCOVER

    +   - DESIGN

    +   - RUN

    +   - MONITOR


    ![](img/cf7012644082c115a2181376d9b7486d_449_0.png)


    Figure 10.14 Landing Page of the Web UI


    Each of these sections will be explored in more detail next.'
  merge: -1
  img_proc: true
