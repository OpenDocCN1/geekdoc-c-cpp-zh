  md: '# 6.3 Using the Connectivity Service


    Much like the SAP Composition Environment (CE) before it, SAP HCP is well-suited
    to building composite applications (also known as XApps or mashups) within the
    enterprise. Here, you can weave Internet-based services together with services
    hosted on-premise to create powerful application scenarios that may not have been
    previously possible for many organizations. From a technical perspective, the
    engine that makes all this possible within SAP HCP is the Connectivity Service.


    In this section, we''ll investigate the Connectivity Service and explain how it
    can be used to connect Java-based web applications to services hosted in different
    network segments using various application protocols. Along the way, you''ll also
    have an opportunity to familiarize yourself with the SAP HANA Cloud Connector,
    which is used to establish a secure link between Java-based web applications and
    on-premise systems.


    # 6.3.1 Conceptual Overview


    What is the Connectivity Service? Much like the Persistence Service described
    in Section 6.2, the Connectivity Service is a built-in service of SAP HCP that
    provides web applications with the ability to connect to external Internet-based
    services and/or on-premise systems in a secure and reliable manner. Such connections
    are based on standardized protocols such as HTTP, RFC, SMTP, and POP3/IMAP.


    Figure 6.29 illustrates the positioning of the Connectivity Service from the perspective
    of a Java web application running within an SAP HCP account. Here, Java applications
    can tap into the functionality of the Connectivity Service using an API provided
    with the SAP HCP SDK called the Connectivity and Destination API. (You can review
    the JavaDocs for this API online at https://help.hana.ondemand.com/javadoc/index.html.)
    This API makes it possible to create connections in an abstract manner based on
    a Connectivity Service-specific configuration object called a destination. Within
    a destination definition, you can specify all of the parameters needed to establish
    a connection to an Internet-based or on-premise service (e.g., target host/port,
    security credentials, etc.). At runtime, the Connectivity Service will use these
    connection details to create a connection object and hand it back to the application.
    From here, the Java application can utilize the connection to access remote services,
    send or retrieve email messages, and so'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'forth, just as it would if it were running on-premise. Behind the scenes, the
    Connectivity Service will step in as needed to broker connection requests, implement
    secure tunneling, and generally fill in the low-level technical requirements needed
    to ensure a seamless communication flow.


    ![](img/cf7012644082c115a2181376d9b7486d_260_0.png)


    # Figure 6.29 Understanding the Positioning of the Connectivity Service


    Looking closely at Figure 6.29, you can see that calls to on-premise systems are
    brokered through a separate software component called the SAP HANA Cloud Connector.
    This software component establishes a secure SSL VPN tunnel between on-premise
    systems and an SAP HCP instance running in the cloud. Behind the scenes, the Connectivity
    Service works very closely with the Cloud Connector to establish connections to
    on-premise systems. From an application perspective, this is all conveniently
    abstracted behind the aforementioned Connectivity and Destination API.


    In the upcoming sections, you''ll see how these communication channels are established
    from a technical perspective. However, before we move on, we thought it might
    be useful to demonstrate some application scenarios that might call for the use
    of the Connectivity Service. We''ve highlighted some of the more common scenarios
    in Table 6.1. As you browse through this list, we should also point out that the
    Connectivity Service is not intended to be used as a general-purpose middleware.
    Instead, it''s intended to be used for smaller, ad hoc service'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'calls incorporated into composite applications and the like. For large-scale
    data loads and more advanced integration scenarios, we''d recommend that you take
    a look at SAP HANA Cloud Integration (SAP HCI), which is designed to handle such
    requirements. SAP HCI is covered in Chapter 10.


    | Service Location | Protocol | Description |

    | :--- | :--- | :--- |

    | Internet | HTTP(s) | Call a web service hosted by a third-party vendor on the
    Internet. An example of this is a REST-based service call to services provided
    by Yahoo!, Google, and others. |

    | On-premise | HTTP | Call web services hosted on systems available on-premise.
    In SAP application scenarios, such services are often brokered through a product
    called SAP Gateway, which makes it easy to expose preexisting ABAP APIs as RESTful
    web services. Of course, use of SAP Gateway is not a hard requirement; it''s possible
    to consume standalone RESTful services, SOAP-based services, and even services
    exposed on non-SAP systems. |

    | On-premise | RFC | In this scenario, you use the Connectivity Service to invoke
    remote-enabled function modules on ABAP systems using the RFC protocol. Here,
    you can call custom RFC functions or preexisting RFCs/BAPIs as needed. |

    | Internet | SMTP | In this scenario, you can use the Connectivity Service to
    connect to an external mail server using the SMTP protocol and send email messages.
    |

    | Internet | POP3/ IMAP | In this scenario, you can use the Connectivity Service
    to connect to a mail server using either the POP3 or IMAP protocols to fetch email
    messages and process them. This feature could be used to implement a form of the
    publish-subscribe messaging pattern. |


    Table 6.1 Usage Scenarios for the Connectivity Service


    # 6.3.2 Working with Destinations


    The primary function of the Connectivity Service is to abstract low-level communication
    details from applications so that service calls are easier to implement. One of
    the ways the Connectivity Service pulls this off is in its use of destinations.'
