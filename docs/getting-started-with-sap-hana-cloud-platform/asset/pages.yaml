- pgno: 162
  md: '# ## 4.4.2 Working with Apache Ant


    Before Apache Maven came into prominence, the de facto build tool in the Java
    community was *Apache Ant*. To a large degree, Ant is a Java-based version of
    the popular make tool used to perform builds in the C/C++ communities. That is,
    Ant provides a runtime environment for executing build scripts.


    In this section, we''ll take a brief look at how such build scripts are constructed
    and how they''re used to automate builds. For more information on the Apache Ant
    project, we would point you in the direction of the project documentation online
    at *http://ant.apache.org/.*


    # ## Understanding the Ant Build Model


    Unlike Maven, Ant makes no real assumptions about how a project is structured
    or how it is to be built. Instead, it provides us with an empty canvas that we
    can use to define each and every detail of a build: where source code is extracted
    from, how we invoke the Java compiler, how a Java archive file is built, and so
    on. Such details are specified in an XML build file called build.xml.


    Listing 4.11 contains an example Ant build file that is used to build our sample
    project. Even if the exact syntax of the build file is new, you can generally
    gather what''s going on in the file based on the descriptive XML element names.
    First, we specify various build properties, then we have a series of *targets*,
    which are basically executable steps within an Ant build file. Using the `depends`
    attribute of the `<target>` element, we can daisy-chain steps together to define
    the build sequence—for example, clean, then `init`, followed by `compile`, and
    then finally `dist`.


    ```

    <project name="Example4_01" default="dist" basedir=".">

    <!-- Set global properties for this build -->

    <property environment="env" />

    <property name="src.dir" location="src" />

    <property name="classes.dir"

    location="WebContent/WEB-INF/classes" />

    <property name="lib.dir" location="WebContent/WEB-INF/lib" />

    <property name="war.dir" location="WebContent" />

    <property name="cloud.host" value="hanatrial.ondemand.com" />

    <property name="app.name" value="example401" />


    <path id="class.path">

    <fileset dir="${env.HCP_SDK_HOME}/repository/plugins">

    ```'
