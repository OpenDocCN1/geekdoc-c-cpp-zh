- pgno: 74
  md: 'In this chapter, we''ll show you how to develop Java-based applications for
    SAP HCP. This gentle introduction will serve as the foundation for more advanced
    topics covered in later chapters of the book.


    # # 3 Developing Java Applications


    Despite boasting an open, bring-your-own-language (BYOL) approach to cloud-based
    application development, SAP HCP definitely has some strong ties with Java. In
    terms of core language support, Java''s been around the longest (going back to
    the days when SAP HCP went under the code name "NEO"). As a result, it''s not
    surprising to learn that Java is the most mature language offering within SAP
    HCP.


    This history, in and of itself, doesn''t make Java a better language choice than
    other languages supported by SAP HCP. However, it does mean that there are many
    more Java-based application examples and resources available online to browse
    through when kick starting your own development projects. Therefore, even if you
    don''t have plans to utilize Java in your daily work, it''s not a bad idea to
    understand how Java is used on SAP HCP so that you can at least follow along and
    understand how to adapt these examples for the language of your choice.


    In this chapter, we''ll demonstrate how to develop Java-based web applications
    for SAP HCP. Although our intent with this chapter is to provide a gentle introduction,
    we should point out that this chapter should not be seen as an introduction to
    the Java programming language. If you''re a fairly experienced programmer, then
    you should probably be able to follow along with the examples provided in this
    chapter, but we would strongly recommend that you read through some of the reference
    materials described in Section 3.5 if you plan on performing serious Java development
    on SAP HCP.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# 3.1 Overview


    In Chapter 2, we spent some time analyzing the Application Runtime Container for
    Java applications deployed on SAP HCP, *Runtime for Java*. We noted that Runtime
    for Java can be configured according to several profiles based on a customer’s
    needs or preferences. From a developer’s perspective, the impacts of the profile
    choice come down to just how much of the Java EE API they have to work with. In
    all cases, the foundation is set with the core Java SE and Java Servlets/JSP APIs.
    However, only in the case of the Java EE 6 Web profile configuration do developers
    have access to EJBs, for instance.


    On top of the Java SE/EE APIs, SAP HCP provides a series of services (such as
    the Persistence Service and Connectivity Service) that can be used to fill in
    the gaps exposed from the Java EE libraries that are not available within SAP
    HCP. As we’ll learn in Chapter 6, these services are in many ways easier to work
    with in a cloud context than the core Java EE libraries/services.


    The third (and arguably most important) piece to the Java development puzzle is
    the vast community of open-source projects and libraries that can easily be integrated
    into Java web applications deployed on SAP HCP. This means that preexisting Java-based
    web applications built on frameworks such as Spring MVC, Struts, and so forth
    can be deployed pretty much as-is on SAP HCP.


    When we put all these pieces together, we end up with a blank canvas that can
    be filled in a lot of different ways. For example, UI-centric applications can
    be built using a mixture of HTML5 with Servlets/JSPs, SAPUI5, or any number of
    the available open-source UI frameworks out there in the Java space. Similarly,
    APIs can be built using EJBs or plain old Java objects (POJOs).


    Because we could scarcely enumerate the various library and framework permutations,
    much less demonstrate them, our approach in this chapter will be to stick to the
    essentials by showing you how to build basic web applications using the Java Servlets/JSP
    API. In the chapters that follow, we’ll then build on this foundation and show
    you how to incorporate third-party libraries and frameworks, cloud services, and
    more.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# ## 3.2 Creating Java Web Applications


    At the end of the day, any Java-based SAP HCP application that we develop must
    be deployed as a Java Web Archive (or WAR) file. Inside this WAR file, we can
    include a wide variety of resources, including Java class files, Servlets/JSPs,
    and static HTML artifacts. Although we’ll be looking at many of these different
    resource types as we go along, we thought it appropriate to start things off with
    a very simple Java web application based on Servlets and JSPs.


    To guide our demonstration, we’ll be developing a simple application via which
    users can maintain a reading list. Here, we’ll create a simple JSP form to display
    the reading list and add additional titles. On the backend, we’ll develop a faceless,
    Servlet-based controller class to collect and keep track of the reading list entries.
    This application, though trivial, will provide us with an opportunity to learn
    how to work with the Eclipse IDE and observe how Java web applications are packaged.
    Plus, it will give us a chance to play around a bit with the local runtime environment
    packaged with the SAP HCP SDK. Without further ado, let’s get started.


    # ### 3.2.1 Creating a Dynamic Web Project in Eclipse


    To get things started, we need to open up the Eclipse IDE and create a new Dynamic
    Web project. This project type is the default project type for building Java-based
    web applications and is included as part of the Eclipse Java EE development tools.
    To create a new Dynamic Web project, we must perform the following steps:


    +   1. Open Eclipse, and switch to the Java EE perspective. If you’ve never accessed
    this perspective before, you can do so by choosing Window • Open Perspective •
    Other... in the top-level menu bar and selecting the Java EE list option.


    +   2. Once the Java EE perspective is opened, create a new Dynamic Web project
    by selecting the FILE • NEW • DYNAMIC WEB PROJECT menu option, as shown in Figure
    3.1.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '![](img/cf7012644082c115a2181376d9b7486d_77_0.png)


    Figure 3.1 Creating a Dynamic Web Project in Eclipse: Part 1


    3. This will open the NEW DYNAMIC WEB PROJECT wizard, as shown in Figure 3.2.
    In the first step, specify the basic coordinates for the project, including the
    following:


    +   - The project name (e.g., EXAMPLE03_01).


    +   - The location where you want to store the project artifacts within the local
    file system. Normally, it makes sense to keep the Use DEFAULT LOCATION checkbox
    selected, as this will ensure that the project artifacts get stored in the default
    Eclipse workspace.


    +   - The target runtime environment (i.e., the local runtime environment you
    set up whenever you downloaded the SAP HCP SDK).


    +   - The version of the Dynamic Web Module you wish to create. Here, the numbers
    in the Dynamic Web Module Version list correspond with versions of the Java Servlet
    API. Unless you have a compelling reason to configure it otherwise, we strongly
    recommend that you choose version 3.0, as illustrated in Figure 3.2.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '![](img/cf7012644082c115a2181376d9b7486d_78_0.png)


    Figure 3.2 Creating a Dynamic Web Project in Eclipse: Part 2


    4. After the basic project coordinates are set, proceed forward through the project
    creation wizard by clicking on the **Next >** button. For the most part, you can
    accept the proposed defaults at the intermediate steps. However, at the **Web
