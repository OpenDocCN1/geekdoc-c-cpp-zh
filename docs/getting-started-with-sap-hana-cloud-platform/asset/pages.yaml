    # 7.3.4 Configuring Application Security


    As you''ve observed throughout the course of this chapter, the bulk of HTML5 application
    content is static in nature. Although this simplifies the development process
    in many ways, it also introduces some challenges when it comes to application
    security. After all, if users can get their hands on the code, then they can glean
    insight into what’s going on behind the scenes and potentially discover holes
    in security.


    To prevent these kinds of vulnerabilities, you need to make sure that you lock
    down access to sensitive resources. This starts with determining who the user
    is (authentication) and then making sure that the user is authorized to access
    particular resources (authorization). With these two constraints in place, you
    can ensure that only authorized users can access HTML5 content and, by extension,
    the more sensitive resources (e.g., REST-based services) that the HTML5 applications
    access behind the scenes.


    Within the HTML5 programming model, these kinds of checks are configured in the
    application descriptor file. Here, using a few lines of code, you can declaratively
    define the appropriate constraints. For example, Listing 7.7 shows how you can
    turn on authentication in an HTML5 application. Once this change is activated,
    users will have to log on with their SAP HCP user account in order to access the
    application.


    ```

    {

    "authenticationMethod": "saml",

    "welcomeFile": "index.html",

    ...

    ```


    Listing 7.7 Turning on Authentication in the Application Descriptor File'
  merge: -1
  img_proc: true
- pgno: 316
  md: "To protect access to particular resources (URLs), you need to define one or\
    \ more security constraints. As you can see in Listing 7.8, a security constraint\
    \ definition consists of a permission name, an optional description, and a list\
    \ of (URL) paths that you want to protect. Here, we’ve defined a security constraint\
    \ to prevent access to the application’s deployment descriptor file. Because this\
    \ file defines all of the security for the application, it’s important that you\
    \ prevent end users from browsing to this file.\n\n```\n{\n    \"authenticationMethod\"\
    : \"saml\",\n    ...\n    \"securityConstraints\": [\n        {\n            \"\
    permission\": \"AccessApplicationDescriptor\",\n            \"description\": \"\
    Access application descriptor\",\n            \"protectedPaths\": [\"/neo-app.json\"\
    ]\n        }\n    ]\n}\n```\n\n# Listing 7.8 Defining Security Constraints\n\n\
    If you were just to define a security constraint like the one shown in Listing\
    \ 7.8 and leave it at that, the only user(s) with authorization to browse to the\
    \ neo-app.json file would be users within the SAP HCP account that have the built-in\
    \ AccountDeveloper role. Although this is probably what you want for the deployment\
    \ descriptor, most of the constraints that you define will point to resources\
    \ that you want to expose on a wider scale. To provide this access to users, you\
    \ must map these constraints to roles that you assign to end users. This can be\
    \ achieved by performing the following steps:\n\n+   1. Log on to the SAP HCP\
    \ Cockpit and get into the target HTML5 application’s dashboard, as demonstrated\
