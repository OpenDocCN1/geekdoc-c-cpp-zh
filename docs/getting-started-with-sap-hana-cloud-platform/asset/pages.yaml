- pgno: 111
  md: 'use of a tool that provides for automated and continuous integration. We''ll
    consider these concepts in further detail in Section 4.4 and Section 4.5, respectively.


    # ## 4.2 Deploying Java Applications


    In order to understand how software logistics works within the SAP HCP landscape,
    it''s helpful to start by looking at the end game: application deployment. Then,
    once you understand how applications are deployed, you''ll have a better sense
    of how the rest of the logistical pieces fall into place.


    In this section, we''ll learn various techniques for deploying Java-based web
    applications. Here, we''ll differentiate between local deployments and deployments
    to a remote SAP HCP cloud instance. Along the way, we''ll take a look at ways
    of monitoring deployments and at techniques for implementing application logging
    or tracing so that you can see what''s going on behind the scenes.


    # ### 4.2.1 Deployment Using the Eclipse IDE


    As we (briefly) observed in Chapter 3, it''s pretty easy to deploy Java-based
    web applications from within the Eclipse IDE. This process is streamlined by the
    built-in server management capabilities provided by the Eclipse Web Tools Platform
    (WTP). Among other things, Eclipse WTP includes extensions for out-of-the-box
    server integration with a variety of Java EE-compliant application servers: Apache
    Tomcat, JBoss, and more. With the installation of the SAP HCP Tools plug-ins,
    this list of servers is expanded to include SAP HCP server types.


    In this section, we''ll learn how to configure SAP HCP server nodes and how we
    can use those server nodes to deploy applications using Eclipse WTP.


    # #### Creating Server Nodes


    You can see the list of servers configured within your Eclipse IDE by opening
    the SERVERS view (highlighted in Figure 4.2). If this view is not visible in your
    IDE configuration, you can access it via the menu option WINDOW • SHOW VIEW •
    OTHER.... Then, in the Show View popup window, expand the Server node, select
    the Servers view, and click on the OK button.'
