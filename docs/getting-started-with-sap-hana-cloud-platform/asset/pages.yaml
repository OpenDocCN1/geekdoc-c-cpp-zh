    # ## 9.3.2 Utilizing SAP HANA Cloud Portal Features


    As we noted earlier, an important part of the OpenSocial specification is its
    support for reusable library APIs (or features in the parlance). These library
    APIs are based on JavaScript and provide solutions to the typical problems faced
    by widget developers.


    Within SAP HANA Cloud Portal, you have access to core features defined by the
    OpenSocial specification and to a number of SAP HANA Cloud Portal-specific features.
    By standardizing around these features, you can develop widgets that are more
    lightweight and portable. This is an important feature when developing mashup
    applications that incorporate lots of different kinds of content. Here, even if
    the underlying technology stack is radically different between applications, developers
    can standardize around the OpenSocial or SAP HANA Cloud Portal features to implement
    interwidget communication, navigation, and so forth. Table 9.1 describes the SAP
    HANA Cloud Portal-specific features available as of the time of writing.'
  merge: -1
  img_proc: true
- pgno: 398
  md: '| Feature | Description |

    | :--- | :--- |

    | Site Context (Pub-Sub) API | This API is used to implement interwidget communication
    using the familiar publish-subscribe integration pattern. Using this API, widgets
    can post messages to generic channels that interested widgets can register themselves
    as listeners for. Because of the decoupled nature of the message exchange, there''s
    no hard-wiring that goes into setting up communication. This capability is particularly
    useful for SaaS vendors such as SAP that might need to broadcast events occurring
    within SuccessFactors applications, for example. |

    | Context Object API | This API provides getter and setter methods around a bag-like
    data structure referred to as the context object. The context object is typically
    used for implementing shared data scenarios. |

    | GadgetPrefs API | This API is used to implement personalization for widgets.
    Here, you can define custom properties that can be maintained by site administrators
    and/or end users when customizing a widget. The properties can be pretty much
    anything you come up with: the background color for the widget, locale information,
    and so forth. |

    | Widget Navigation API | This API is used to implement dynamic navigation from
    a widget to a particular page within the site definition. Here, rather than hard-coding
    URLs, the navigation parameters are defined generically so that the navigation
    scenarios are 100% portable. |

    | Widget Menu API | This API can be used to create custom menus within a widget.
    |

    | Open Popup API | This API can be used to open up a widget view inside of a popup
    frame. |

    | Widget Dynamic Height API | This API can be used to adjust the height of the
    widget. In particular, it can be used to define a widget''s height in proportion
    with the surrounding content area. |

    | Site Hierarchy API | This API can be used to introspect the page hierarchy within
    the current SAP HANA Cloud Portal site definition. |

    | Login/Logout API | This API can be used to trigger login and logout requests
    within SAP HCP. |'
  merge: -1
  img_proc: true
- pgno: 399
  md: '| Feature | Description |

    |---|---|

    | Busy Indicator API | This API can be used to show or hide a busy indicator whenever
    the widget performs a long-running task. |

    | Custom Rich Text Editor API | This API can be used to dynamically create a Rich
    Text Editor widget. |

    | Site Properties API | This API can be used to lookup properties that were defined
    by the site author within the overarching site definition. These properties can
    be used to initialize the widget content or perform other such tasks. |


    # Table 9.1 SAP HANA Cloud Portal APIs for OpenSocial Widgets (Cont.)


    Although a complete and thorough treatment of each and every SAP HANA Cloud Portal
    feature is beyond the scope of this book, our simple weather widget does incorporate
    several of these features in its design:


    +   - To make our widget more customizable, we utilized the GadgetPrefs API to
    allow site administrators to specify the user location when embedding the widget
    so that users get a personalized temperature reading.

    +   - Because our widget may be used in many different contexts, we''re using
    the Dynamic Height API to dynamically calculate the height of the widget''s content
    area.

    +   - To make the widget appear more responsive to the end user, we''re utilizing
    the Busy Indicator API to show the user that the widget is working whenever it
    goes and fetches the current temperature from its target REST-based service.


    In order to utilize these features, you first have to formally declare your intentions
    to use these features within the spec XML file. As you can see in Listing 9.3,
    such declarations are specified within the `<ModulePrefs>` element using the highlighted
    `<Require>` element. The actual feature IDs are described within the SAP HANA
    Cloud Portal documentation available online at `https://help.hana.ondemand.com/cloud_portal/frameset.htm`.
    If you happen to know which features you wish to use up front, then this is something
    that the SAP HANA Cloud Portal widget plug-in of the SAP Web IDE can automate
    for you (as demonstrated in Section 9.3.1).


    ```

    <?xml version="1.0" encoding="UTF-8"?>

    <Module>

    <ModulePrefs title="Weather Widget">

    ```'
