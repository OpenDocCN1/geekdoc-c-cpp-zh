    window. Here, we can browse through the contents of the remote SAP HANA Repository
    and create new folders or packages and even SAP HANA XS applications. In the latter
    case, we have the option of creating SAP HANA XS applications in reference to
    template projects that predefine a lot of common source files that we''d normally
    have to create by hand. For this reason, many developers prefer to'
  merge: -1
