    # 5.7 Deployment and Testing


    Now that we''ve created all of the relevant repository artifacts that make up
    our sample application, we''re ready to deploy our application and start testing
    it. In this section, we''ll see how these tasks are performed using the Eclipse
    IDE and SAP HCP Cockpit tools.


    # 5.7.1 Activating the SAP HANA XS Project


    As we noted in Section 5.3, all of the source code artifacts created during the
    development process in the Eclipse IDE are initially saved to a workspace folder
    on your local machine. Therefore, before you can test your SAP HANA XS application,
    you must first synchronize the contents of this workspace folder with the remote
    SAP HANA Repository.


    If you followed along with the SAP HANA XS project setup steps outlined in Section
    5.3, then all of the necessary plumbing should be in place to trigger this synchronization
