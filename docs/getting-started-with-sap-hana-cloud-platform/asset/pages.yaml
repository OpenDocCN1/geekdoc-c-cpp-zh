    If you haven''t worked with JDBC before, then a brief introduction is in order.
    Logistically, the core classes and interfaces that make up the JDBC API are contained
    within the java.sql and javax.sql packages of the Java SE library. As you browse
    through these packages, you''ll notice that roughly 90% of the API is defined
    using interfaces. This design choice was made in order to separate the core JDBC
    interface from implementation details specific to various database vendors (e.g.,
    Oracle vs. Microsoft SQL Server). The lower-level implementation details are provided
