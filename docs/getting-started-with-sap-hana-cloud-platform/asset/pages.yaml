- pgno: 382
  md: 'As we accumulate more than a handful of web applications, one of the primary
    logistical challenges we face is figuring out how to get our apps into the hands
    of the end users. In this chapter, we’ll look at how to use SAP HANA Cloud Portal
    to streamline this delivery process.


    # 9 Working with SAP HANA Cloud Portal


    Up to now, the sample applications we’ve developed have existed in isolation.
    In practice, though, this will rarely be the case. Instead, the SAP HCP applications
    we create will normally become part of a larger suite of applications that users
    use in tandem to perform various job duties. Included in this suite of applications
    are custom-developed SAP HCP applications, applications leveraged from one of
    SAP’s Software-as-a-Service (SaaS) offerings (e.g., SuccessFactors), and sometimes
    web applications from outside of the SAP landscape.


    To the end user, it doesn’t matter where these applications come from or how they’re
    implemented; users just want a simple, streamlined interface they can use to get
    in and do their job. In these situations, we need a platform for consolidating
    application content so that we can provide users with a unified, role-specific
    access point. Within the SAP cloud landscape, we can utilize SAP HANA Cloud Portal
    to implement these requirements. In this chapter, we’ll take a look at SAP HANA
    Cloud Portal and how it can be used to build beautiful mashup sites that seamlessly
    integrate various types of content.


    # 9.1 Introduction


    Before we start looking into the details of SAP HANA Cloud Portal, let’s first
    take a moment to explain a little more about what it is (and isn’t). In the sections
    that follow, we’ll introduce you to SAP HANA Cloud Portal and its positioning
    in the SAP HCP landscape.'
