  md: "# 10.07 Multiple Choice Poll (Self-Study)\n\nWhich method would you use if\
    \ you wanted to create a new variable at the time of concatenation?\n\n+   a.\
    \ APPEND procedure\n  b) SET statement\n\n# Interleaving (Self-Study)\n\nInterleaving\
    \ intersperses observations from two or more data sets, based on one or more common\
    \ variables.\n\nThe SET statement with a BY statement in a DATA step interleaves\
    \ SAS data sets.\n\n```\nDATA SAS-data-set;\n  SET SAS-data-set1 SAS-data-set2\
    \ . . ;\n  BY <DESCENDING> by-variable(s);\n  <additional SAS statements>\nRUN;\n\
    ```\n\n> The data sets must be sorted by the BY variable.\n\nUse the SORT procedure\
    \ to sort the data sets by the BY variable.\n\nTypically, it is more efficient\
    \ to sort small SAS data sets and then interleave them as opposed to concatenating\
    \ several SAS data sets and then sorting the resultant larger file."
