  md: '# APPEND Procedure versus SET Statement (Self-Study)


    +   * The data set that results from concatenating two data sets with the SET
    statement is the same data set that results from concatenating them with the APPEND
    procedure if the two data sets contain the same variables.

    * The APPEND procedure concatenates much faster than the SET statement because
    the APPEND procedure does not process the observations from the BASE= data set.

    * The two methods are significantly different when the variables differ between
    data sets.


    # APPEND Procedure versus SET Statement (Self-Study)


    | Criterion | APPEND Procedure | SET Statement |

    |---|---|--|

    | Number of data sets that you can concatenate | Uses two data sets. | Uses any
    number of data sets. |

    | Handling of data sets that contain different variables | Uses all variables
    in the BASE= data set and assigns missing values to observations from the DATA=
    data set where appropriate; cannot include variables found only in the DATA= data
    set. | Uses all variables and assigns missing values where appropriate. |'
  merge: -1
  pgno: 481
