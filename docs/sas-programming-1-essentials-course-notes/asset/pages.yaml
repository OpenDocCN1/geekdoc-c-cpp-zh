- img_proc: true
  md: "Submit the second PROC GPLOT step to specify the options in the TITLE and FOOTNOTE\
    \ statements to control the text appearance.\n\nThe TITLE and FOOTNOTE statements\
    \ specify override the default fonts, colors, height, and text justification.\
    \ The following options are used:\n\n+   - F= (or F=) specifies a font.\n- C=\
    \ (or COLOR=) specifies text color.\n- H= (or HEIGHT=) specifies text height.\
    \ Units of height can be specified as a percent of the display (PCT), inches (IN),\
    \ centimeters (CM), cells (CELLS), or points (PT).\n- J= (or JUSTIFY=) specifies\
    \ text justification. Valid values are LEFT (L), CENTER (C), and RIGHT (R).\n\n\
    All options apply to text following the option.\n\n```\nods listing style=gears;\n\
    goptions reset=all;\nproc gplot data=orion.budget;\n  plot Yr2007*Month / vref=3000000;\n\
    \  label Yr2007='Budget';\n  format Yr2007 dollar12;\n  title f=centbi h=5 pct\
    \ 'Budget by Month';\n  footnote c=green j=left 'Data for 2007';\nrun;\nquit;\n\
    ```\n\n![](img/1698e3a97543d6895ff5297aae8fd042_772_0.png)"
  merge: -1
  pgno: 772
- img_proc: true
  md: '# 13-28 Chapter 13 Introduction to Graphics Using SAS/GRAPH (Self-Study)


    3. Submit the third PROC GPLOT step to use a GOPTIONS statement to control the
    appearance of the output.


    A GOPTIONS statement specifies options to control the appearance of all text in
    the graph.

    The following options are used:


    +   * FTEXT= specifies a font for all text.

    * CTEXT= specifies the color for all text.

    * HHTEXT= specifies the height for all text.


    If a text option is specified both in a GOPTIONS statement and in a TITLE or FOOTNOTE
    statement, the option specified in the TITLE or FOOTNOTE statement overrides the
    value in the GOPTIONS statement only for that title or footnote.


    ```

    ods listing style=gears;

    goptions reset=all ftext=centb htext=3 pct ctext=dark_blue;

    proc gplot data=orion.budget;

    plot Yr2007*Month / vref=3000000;

    label Yr2007=''Budget'';

    format f=2007 dollar1;

    title f=centbi ''Budget by Month'';

