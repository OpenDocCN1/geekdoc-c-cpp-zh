- img_proc: true
  md: '# The IF-THEN DELETE Statement (Self-Study)


    An alternative to the subsetting IF statement is the DELETE statement in an IF-THEN
    statement.


    General form of the IF-THEN DELETE statement:


    ```

    IF expression THEN DELETE;

    ```


    The DELETE statement stops processing the current observation.


    When the DELETE statement executes, the current observation is not written to
    a data set, and SAS returns immediately to the beginning of the DATA step for
    the next iteration.


    # The IF-THEN DELETE Statement (Self-Study)


    ```

    data work.december:

    set orion.sales;

    where Country=''AU'';nBonusMonth=month(Hire_Date);

    if BonusMonth ne 12 then delete;

    Bonus=500;

    Compensation=sum(Salary, Bonus);

    run;

    data work.december;

    set orion.sales;

    where Country=''AU'';nBonusMonth=month(Hire_Date);

    if BonusMonth=12;

    Bonus=500;

    Compensation=sum(Salary, Bonus);

    run;

    ```'
  merge: -1
