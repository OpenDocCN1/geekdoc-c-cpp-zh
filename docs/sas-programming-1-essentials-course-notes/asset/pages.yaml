  md: '# SAS System Options


    # Subsetting Observations


    ```

    OPTIONS DATE=NODE;

    OPTIONS NUMBER=NONNUMBER;

    OPTIONS LINESIZE=n;

    OPTIONS PAGESIZE PS=m;

    OPTIONS PAGENO=n;

    OPTIONS CENTER=NOCENTER;

    OPTIONS DRESET=NODATSET;

    ```


    ```

    WHERE expression;

    ```


    ```

    IF expression THEN DELETE;

    ```


    ```

    IF expression;

    ```


    # LIBNAME Statement


    ```

    LIBNAME libref ''SAS-data-library'' <options>;

    ```


    # Subsetting Variables


    ```

    DROP variable-list;

    ```


    # Reading Excel Worksheets


    ```

    LIBNAME libref''physical-file-name'' <options>;

    ```


    ```

    KEEP variable-list;

    ```


    # Examining SAS Data Set Descriptor Portion


    # Merging SAS Data Sets


    ```

    PROC CONTENTS DATA=SAS-data-set;

    RUN;

    ```


    ```

    DATA SAS-data-sets;

    MERGE SAS-data-sets;

    BY BY-column(s);

    <additional SAS statements>

    RUN;

    ```


    ```

    PROC CONTENTS DATA=libref_ALL_NODS;

    RUN;

    ```


    # Functions


    ```

    YEAR(SAS-date)

    QTR(SAS-date)

    MONTH(SAS-date)

    DAY(SAS-date)

    WEEKDAY(SAS-date)

    TODAY()

    MDY(month, day, year)

    ```


    # Reading Delimited Raw Data Files


    ```

    DATA SAS-data-set(s);

    INFILE ''filename'' <DLM=delimiter><DSD>;nINPUT variable $ variable <informat>
    ...;

    <additional SAS statements>

    RUN;

    ```


    ```

    UPCASE(argument)

    ```


    # Reading and Concatenating SAS Data Sets


    ```

    DATA SAS-data-set(s);

    SET SAS-data-set(s);

    <additional SAS statements>

    RUN;

    ```


    ```

    SUM(argument1,argument2,... )

    ```


    # Titles and Footnotes


    ```

    TITLEn''text''

    ```


    # Appending SAS Data Sets


    ```

    PROC APPEND BASE = SAS-data-set

    DATA = SAS-data-set<FORCE>;nRUN;

    ```


    ```

    FOOTNOTEn''text''

    ```'
