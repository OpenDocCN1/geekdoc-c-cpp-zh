- img_proc: true
  md: "# Disassociating a Libref\n\nIf SAS has a libref assigned to an Excel workbook,\
    \ the workbook cannot be opened in Excel. To dissociate a libref, use a LIBNAME\
    \ statement and specify the libref and the CLEAR option.\n\n```\nlibname orionxls\
    \ 's:\\\\workshop\\sales.xls';\n\ndata work.subset2;\n    set orionxls.'Australia$n';\n\
    run;\n\nlibname orionxls clear;\n```\n\nSAS disconnects from the data source and\
    \ closes any resources that are associated with that libref's connection.\n\n\
    → otherwise no one can use this worksheet"
  merge: -1
  pgno: 217
- img_proc: true
  md: '# Reading Excel Worksheets – Windows


    1. Submit the following program except for the last LIBNAME statement.


    ```

    libname orionls ''sales.xls'';


    data work.subset2;

    set orionls ''Australia$''n

    where Job Title contains ''Rep''

    keep First Name Last Name Salary

    Job Title Hire_Date;

    label Job_Title=''Sales Title''

    Hire_Date=''Date Hired'';nformat Salary comma1. Hire_Date weekdate;

    run;


    proc contents data=work.subset2 label;

    run;


    proc print data=work.subset2 label;

    run;


    libname orionls clear;

    ```


    2. Review the PROC CONTENTS and PROC PRINT results in the Output window.


    3. Select the Explorer tab on the SAS bar to activate the SAS Explorer or select
    View ⇨ Contents Only


    ![](img/1698e3a97543d6895ff5297aae8fd042_218_0.png)'
  merge: -1
