    \n# OUTPUT Statement OUT= Option (Self-Study)\n\nThe OUT= option in the OUTPUT\
    \ statement creates an output data set with the following variables:\n\n+   -\
    \ BY variables\n- the variables requested in the TABLES statement\n- variables\
    \ that contain the specified statistics.\n\n```\nOUTPUT OUT=SAS-data-set <options>;\n\
    ```\n\nIf than one table request appears in the TABLES statement, the contents\
    \ of the data set corresponds to the last table request."
