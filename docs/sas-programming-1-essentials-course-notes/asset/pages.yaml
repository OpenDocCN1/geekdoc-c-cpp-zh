  md: '# Global Statements


    The following are global statements that enhance reports:


    +   - OPTIONS

    - TITLE

    - FOOTNOTE

    - ODS


    Global statements are specified anywhere in your SAS program and they remain in
    effect until canceled, changed, or your SAS session ends.


    # The OPTIONS Statement


    The OPTIONS statement changes the value of one or more SAS system options.

    General form of the OPTIONS statement:


    ```

    OPTIONS option(s);

    ```


    +   - Some SAS system options change the appearance of a report.

    - The OPTIONS statement is not usually included in a PROC or DATA step.'
  merge: -1
  pgno: 561
- img_proc: true
  md: '# SAS System Options for Reporting


    Selected SAS System Options:


    | DATE (default) | displays the date and time that the SAS session began at the
    top of each page of SAS output |

    | NODATE | does not display the date and time that the SAS session began at the
    top of each page of SAS output |

    | NUMBER (default) | prints page numbers on the first line of each page output
    |

    | NONUMBER | does not print page numbers on the first line of each page of SAS
    output |

    | PAGENO=n | defines a beginning page number (n) for the next page of SAS output
    |


    # SAS System Options for Reporting


    Selected SAS System Options:


    | CENTER (default) | centers-aligns SAS output |

    | NOCENTER | left-aligns SAS output |

    | PAGESIZE=n | defines the number of lines (n) that can be printed per page of
    SAS output |

    | LINESIZE=width | defines the line size (width) for the SAS log and SAS output
    |'
  merge: -1
  pgno: 562
