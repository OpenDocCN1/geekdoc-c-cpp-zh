- img_proc: true
  md: '# The TABLE Statement


    The TABLE statement describes the structure of the table.


    | | page expression | row expression | column expression |

    |---|---|---|---|

    | | dimension expressions | | |


    +   - Commas separate the dimension expressions.

    - Every variable that is part of a dimension expression must be specified as a
    classification variable (CLASS statement) or an analysis variable (VAR statement).


    # The TABLE Statement


    | | page expression | row expression | column expression |

    |---|---|---|---|

    | | | | |


    Examples:


    ```

    table Country;

    ```


    ```

    table Gender , Country;

    ```


    ```

    table Job Title , Gender , Country;

    ```'
  merge: -1
  pgno: 714
- img_proc: true
  md: "# The CLASS Statement\n\nThe CLASS statement identifies variables to be used\n\
    as classification, or grouping, variables.\nGeneral form of the CLASS statement:\n\
    \n```\nCLASS classification-variable(s);\n```\n\n+   - N, the number of nonmissing\
    \ values, is the default\nstatistic for classification variables.\n- Examples\
    \ of classification variables:\n  Job_Title, Gender, and Country\n\nClass variables\n\
    \n+   - can be numeric or character\n- identify classes or categories on which\
    \ calculations are done\n- represent discrete categories if they are numeric (for\
    \ example, Year)."
  merge: -1
  pgno: 715
- img_proc: true
  md: "# The VAR Statement\n\nThe VAR statement identifies the numeric variables for\
    \ which statistics are calculated.\nGeneral form of the VAR statement:\n\n```\n\
    VAR analysis-variable(s);\n```\n\n+   - SUM is the default statistic for analysis\
    \ variables.\n- Examples of analysis variables:\n  Salary and Bonus\n\nAnalysis\
    \ variables\n\n+   - are always numeric\n- tend to be continuous\n- are appropriate\
    \ for calculating averages, sums, or other statistics.\n\n# One-Dimensional Table\n\
    \n```\nproc tabulate data=orion.sales;\nclass Country;\ntable Country;\nrun;\n\
    ```\n\n| Country | |\n|---|---|\n| AU | US |\n| N | N |\n| 63.00 | 102.00 |\n\n\
    If there are only class variables in the TABLE statement, the default statistic\
    \ is N, or number of nonmissing values."
  merge: -1
  pgno: 716
