- img_proc: true
  md: '# Date Functions


    SAS date functions can be used to


    +   - extract extract information from SAS date values

    - create SAS date values.


    ![](img/1698e3a97543d6895ff5297aae8fd042_390_0.png)


    # Date Functions – Extracting Information


    YEAR(SAS-date) extracts the year from a SAS date and returns a four-digit value
    for year.


    QTR(SAS-date) extracts the quarter from a SAS date and returns a number from 1
    to 4.


    MONTH(SAS-date) extracts the month from a SAS date and returns a number from 1
    to 12.


    DAY(SAS-date) extracts the day of the month from a SAS date and returns a number
    from 1 to 31.


    WEEKDAY(SAS-date) extracts the day of the week from a SAS date and returns a number
    from 1 to 7, where 1 represents Sunday, and so on.


    Example:


    ```

    BonusMonth=month(Hire_Date);

    ```'
  merge: -1
  pgno: 390
