- img_proc: true
  md: "# 12.2 Using the MEANS Procedure\n\n# ## Objectives\n\n+   - Calculate summary\
    \ statistics and multilevel summaries with the MEANS procedure.\n- Enhance summary\
    \ tables with options.\n- Produce output data sets by using the OUT= option in\
    \ the OUTPUT statement. (Self-Study)\n- Compare the SUMMARY procedure to the MEANS\
    \ procedure. (Self-Study)\n\n![](img/1698e3a97543d6895ff5297aae8fd042_692_0.png)\n\
    \n# ## The MEANS Procedure\n\nThe MEANS procedure provides data summarization\
    \ tools to compute descriptive statistics for variables across all observations\
    \ and within groups of observations.\n\nGeneral form of the MEANS procedure:\n\
    \n```\nPROC MEANS DATA=SAS-data-set <statistic(s)> <option(s);\n  VAR analysis-variable(s);\n\
    \  CLASS classification-variable(s);\n```\n\nRUN;"
  merge: -1
  pgno: 692
- img_proc: true
  md: '# The MEANS Procedure


    By default, the MEANS procedure reports the number of nonmissing observations,
    the mean, the standard deviation, the minimum value, and the maximum value of
    all numeric variables.


    ```

    proc means data=orion.sales;

    run;

    ```


    | Variable | N | Mean | Std Dev | Minimum | Maximum |

    | --- | --- | --- | --- | --- | --- |

    | Employee_ID | 165 | 12070.20 | 450.866039 | 12102.00 | 121145.00 |

    | Salary | 165 | 31180.12 | 20085.67 | 22710.00 | 24319.00 |

    | Birth_Date | 165 | 3622.58 | 5456.29 | -5842.00 | 10490.00 |

    | Hire_Date | 165 | 12054.28 | 4619.94 | 5114.00 | 17167.00 |


    # The VAR Statement


    The VAR statement identifies the analysis variables and their order in the results.


    ```

    proc means data=orion.sales;

    var Salary;

    run;

    ```


    | N | Mean | Std Dev | Minimum | Maximum |

    | --- | --- | --- | --- | --- |

    | 165 | 31160.12 | 20082.67 | 22710.00 | 243190.00 |'
  merge: -1
  pgno: 693
- img_proc: true
  md: '# The CLASS Statement


    The CLASS statement identifies variables whose values define subgroups for the
    analysis.


    ```

    proc means data=orion.sales;

    var Salary; -> analysis variable

    class Gender Country;

    run;

