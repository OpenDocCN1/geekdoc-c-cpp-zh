- img_proc: true
  md: '# 7.2 Using Nonstandard Delimited Data as Input 7-31


    # # List Input for Nonstandard Data


    List input specification:


    ```

    INPUT variable $<> variable <informat>;

    ```


    +   - The :format modifier enables you to use an informat to read nonstandard
    delimited data.

    - An informat is an instruction that SAS uses to read data values into a variable.

    - The width of the informat can be eliminated.

    - For character variables, the width of the informat determines the variable length,
    if it has not been previously defined.


    ![](img/1698e3a97543d6895ff5297aae8fd042_278_0.png)


    # # SAS Informats


    SAS informats have the following form:


    ```

    <$informat<w>, <d>

    ```


    | | | |

    |---|---||

    | $ | indicates a character informat |

    | informat | names the SAS informat or user-defined informat |

    | w | specifies the number of columns to read in the input data |

    | | is a required delimiter |

    | d | specifies an optional decimal scaling factor in the numeric informats. |


    ![](img/1698e3a97543d6895ff5297aae8fd042_278_1.png)'
  merge: -1
  pgno: 278
- img_proc: true
  md: '# SAS Informats


    Selected SAS Informats:


    | Informat | Definition |

    |---|---|

    | $w. | reads standard character data. |

    | $w.d | reads standard numeric data. |

    | COMMAw.d | reads nonstandard numeric data and removes embedded commas, blanks,
    dollar signs, percent signs, and dashes. |

    | DOLLAR.d | reads nonstandard numeric data and removes embedded periods, blanks,
    dollar signs, percent signs, and dashes. |

    | COMMAXw.d | reads nonstandard numeric data and removes embedded characters in
    European currency. |

    | DOLLARXw.d | reads nonstandard numeric data and removes embedded characters
    in European currency. |


    # SAS Informats


    In list input, informats are used to convert nonstandard numeric data to SAS numeric
    values.


    | Informat | Raw Data Value | SAS Data Value |

    |---|---|---|

    | COMMA.DOLLAR. | $12,345 | 12345 |

    | COMMAX.DOLLARX. | $12,345 | 12345 |

    | EUROX. | €12,345 | 12345 |'
