  md: "# Match-Merging\n\nIn order to perform match-merging, the observations in each\
    \ data set must be sorted by the one or more common variables that are being matched.\n\
    General form of the SORT procedure:\n\n```\nPROC SORT DATA=input-SAS-data-set\n\
    \  OUT=output-SAS-data-set;\n  BY <DESCENDING> by-variable(s);\nRUN;\n```\n\n\
    The SORT procedure orders SAS data set observations by the values of one or more\
    \ variables.\n\n# The SORT Procedure\n\n```\nPROC SORT DATA=input-SAS-data-set\n\
    \  OUT=output-SAS-data-set;\n  BY <DESCENDING> by-variable(s);\nRUN;\n```\n\n\
    The SORT procedure rearranges the observations in a SAS data set\n\n+   - either\
    \ replaces the original data set or creates a new data set\n- can sort on multiple\
    \ variables\n- can sort in ascending (default) or descending order\n- does not\
    \ generate printed output."
  merge: -1
  pgno: 493
- img_proc: true
  md: '# 10.08 Quiz


    Which step is sorting the observations in a SAS data set and overwriting the same
    SAS data set?


    +   a. ```proc sort data=work.EmpsAU out=work.sorted; by First; run;```


    +   b. ```proc sort data=work.EmpsAU out=orion.EmpsAU by First; run;```


    +   c. ```proc sort data=work.EmpsAU by First; run;```


    # The BY Statement


    The BY statement specifies the sorting variables.


    +   - PROC SORT first arranges the data set by the values in ascending order,
    by default, of the first BY variable.

    - PROC SORT then arranges any observations that have the same value of the first
    BY variable by the values of the second BY variable in ascending order.

    - This sorting continues for every specified BY variable.


    The DESCENDING option reverses the sort order for the variable that immediately
    follows in the statement so that observations are sorted from the largest value
    to the smallest value.'
  merge: -1
  pgno: 494
