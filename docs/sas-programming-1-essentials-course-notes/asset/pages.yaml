- img_proc: true
  md: '10.4 Merging Data Sets One-to-One 10-45


    # Match-Merging


    Match-merging combines observations from two or more SAS data sets into a single
    observation in a new data set based on the values of one or more common variables.


    | A | B | C | C | D | E |

    |---|---|---|---|---|---||

    | | 1 | | 1 | | |

    | | | 2 | | 2 | |

    | | | 3 | | 3 | |


    | A | B | C | C | D | E |

    |---|---|---|---|---|---||

    | | | 1 | | 1 | |

    | | | 2 | | 1 | |

    | | | 3 | | 2 | |


    | A | B | C | C | D | E |

    |---|---|---|---|---|---||

    | | | 1 | 2 | | |

    | | | 2 | 3 | | |

    | | | 4 | 4 | | |


    99


    # Match-Merging


    | A | B | C | C | D | E |

    |---|---|---|---|---|---||

    | | 1 | | 1 | | |

    | | | 2 | | 2 | |

    | | | 3 | | 3 | |


    One-to-One

    A observation in one data set is related to one and only one observation from
    another data set based on the values of one or more selected variables.


    One-to-Many or Many-to-One

    A single observation in one data set is related to more than one observation from
    another data set based on the values of one or more selected variables and vice
    versa.


    | A | B | C | C | D | E |

    |---|---|---|---|---|---||

    | | 1 | | 1 | | |

    | | | 2 | | 2 | |

    | | | 3 | | 2 | |


    Nonmatches\At least one single observation in one data set is unrelated to any
    observation from another data set based on the values of one or more selected
    variables.


    | A | B | C | C | D | E |

    |---|---|---|---|---|---||

    | | 1 | | 2 | | |

    | | | 2 | | 3 | |

    | | | 4 | | 4 | |'
