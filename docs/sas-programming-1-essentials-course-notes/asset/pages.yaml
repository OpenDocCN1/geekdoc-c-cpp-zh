- img_proc: true
  md: '# 11.5 Directing Output to External Files


    +   Objectives

    * Direct output to ODS destinations by using ODS statements.

    * Specify a style definition by using the STYLE= option.

    * Create ODS files that can be opened in Microsoft Excel.


    # Output Delivery System


    Output can be sent to a variety of destinations by using ODS statements.


    ![](img/1698e3a97543d6895ff5297aae8fd042_610_0.png)'
  merge: -1
  pgno: 610
- img_proc: true
  md: '# Output Delivery System


    | Destination | Type of File | Viewed In |

    | --- | --- | --- |

    | LISTING | | SAS Output Window or SAS/GRAPH Window |

    | HTML | Hypertext Markup Language | Web Browsers such as Internet Explorer |

    | PDF | Portable Document Format | Adobe Products such as Acrobat Reader |

    | RTF | Rich Text Format | Word Processors such as Microsoft Word |


    # Default ODS Destination


    The LISTING destination is the default ODS destination.


    ```

    ods listing;

    nproc freq data=orion.sales;

    tables Country;

    run;


    proc gchart data=orion.sales;

    hbar Country / nostats;

    run;

    ```'
  merge: -1
  pgno: 611
- img_proc: true
  md: '# Default ODS Destination


    The LISTING destination directs output to the OUTPUT window and the GRAPH window.


    ![](img/1698e3a97543d6895ff5297aae8fd042_612_0.png)


    # Default ODS Destination


    The ODS LISTING CLOSE statement stops sending output to the OUTPUT and GRAPH windows.


    ```

    ods listing close;


    proc freq data=orion.sales;

    tables Country;

    run;


    proc gchart data=orion.sales;

    hbar Country / noostats;

    run;

    ```'
  merge: -1
  pgno: 612
- img_proc: true
  md: '# Default ODS Destination


    A warning will appear in the SAS log if the LISTING destination is closed and
    no other destinations are active.


    # Partial SAS Log


    ```

    23 ods listing close;

    24

    25 proc freq data=orion.sales;

    26   tables Country;

    27 run;


    WARNING: No output destinations active.

    NOTE: There were 165 observations read from the data set ORION.SALES.

    ```


    # HTML, PDF, and RTF Destinations


    ODS destinations such as HTML, PDF, and RTF are opened and closed in the following
    manner:


    ```

    ODS destination FILE = ''*filename.ext*'' <options>;


    SAS code to generate a report(s)


    ODS destination CLOSE;

    ```


    The filename specified in the FILE= option needs to be specific to your operating
    environment.'
  merge: -1
  pgno: 613
- img_proc: true
  md: '11-5 Directing Output to External Files


    # HTML Destination


    ```

    ods html file=''myreport.html''; proc freq data=orion.sales; tables Country; ods
    html close;

    ```


    ![](img/1698e3a97543d6895ff5297aae8fd042_614_0.png)


    Always terminate steps with an explicit step boundary before closing the destination.
    Otherwise, the file is closed before the step executes.


    # PDF Destination


    ```

    ods pdf file=''myreport.pdf''; proc freq data=orion.sales; tables Country; ods
    pdf close;

    ```


    ![](img/1698e3a97543d6895ff5297aae8fd042_614_1.png)'
  merge: -1
  pgno: 614
- img_proc: true
  md: '# RTF Destination


    ```

    ods rtf file=''myreport.rtf'';

    proc freq data=orion.sales;

    tables Country;

    run;\ods rtf close;

    ```


    ![](img/1698e3a97543d6895ff5297aae8fd042_615_0.png)


    The traditional RTF destination does not control vertical measurement, so page
    breaking is controlled by the word processor. Starting in SAS 9.2, there is a
    new destination, TAGSETS.RTF, which does control vertical measurement. Documentation
    about the TAGSETS.RTF destination can be found in the SAS Help and Documentation
    from the Contents tab (SAS Products -> Base SAS -> SAS 9.2 Output Delivery System
    User''s Guide -> ODS Language Statements -> Diction of ODS Language Statements
    -> ODS TAGSETS.RTF Statement).


    # 11.11 Quiz


    What is the problem with this program?


    ```

    ods pdf file=''myreport.pdf'';

    proc print data=orion.sales;

    run;

    ods close;

    ```'
  merge: -1
  pgno: 615
- img_proc: true
  md: '# Single Destination


    Output can be sent to only one destination.


    ```

    ods listing close;

    ods html file=''example.html'';\proc freq data=orion.sales;

    tables Country;

    run;

    ods html close;

    ods listing;

    ```


    > It is a good habit to open the LISTING destination at the end of a program to
    guarantee an open destination for the next submission.


    # Multiple Destinations


    Output can be sent to many destinations.


    ```

    ods listing;

    ods pdf file=''example.pdf'';

    ods rtf file=''example.rtf'';

    proc freq data=orion.sales;

    tables Country;

    run;

    ods pdf close;

    ods rtf close;

    ```


    To view the results, all destinations except the LISTING destination must be closed.'
  merge: -1
  pgno: 616
- img_proc: true
  md: '# Multiple Destinations


    Use _ALL_ in the ODS CLOSE statement to close all open destinations including
    the LISTING destination.


    ```

    ods listing;

    ods pdf file=''example.pdf'';\ods rtf file=''example.rtf'';

    proc freq data=orion.sales;

    tables Country;

    run;

    ods all close;

    ods listing;

    ```


    # Multiple Procedures


    Output from many procedures can be sent to ODS destinations.


    ```

    ods listing;

    ods pdf file=''example.pdf'';\ods rtf file=''example.rtf'';

    proc freq data=orion.sales;

    tables Country;

    run;

    proc means data=orion.sales;

    var Salary;

    run;

    ods all close;

    ods listing;

    ```'
  merge: -1
  pgno: 617
- img_proc: true
  md: "# File Location\n\nA path can be specified to control the location of where\n\
    the file is stored.\n\n```\nods html file='s:\\workshop\\example.html';\nnproc\
    \ freq data=orion.sales;\n    tables Country;\n    run;\n\nproc means data=orion.sales;\n\
    \    var Salary;\n    run;\n\nods html close;\n```\n\nIf no path is specified,\
    \ the file is saved in the current\ndefault directory.\n\nThe path and filename\
    \ specified in the FILE= option needs to be specific to your operating environment.\n\
    \n# Operating Environments\n\nThe Output Delivery System works on all operating\n\
    environments.\n\nz/OS (OS/390) Example:\n\n```\nods html file='.workshop.report(example)'\n\
    rs=none;\n\nproc freq data=orion.sales;\n    tables Country;\n    run;\n\nods\
    \ html close;\n```\n\nUse the RS=NONE option when you create HTML and\nRTF files\
    \ on z/OS (OS/390).\n\nThe RS= option is an alias for the RECORD_SEPARATOR=option.\n\
    \nRS=NONE writes one line of markup output at a time to the file. This enables\
    \ the file to be read\by a text editor. Without the option, the lines of markup\
    \ output run together.\n\nRS=NONE is not needed with the PDF destination. It is\
    \ needed with other destinations such as\nCSV, MOFFICE2K, and EXCELXP."
  merge: -1
  pgno: 618
- img_proc: true
  md: "# Creating HTML, PDF, and RTF Files\n\nSubmit the program and view the results\
    \ in the appropriate application. The HTML file can be viewed in a Web browser,\
    \ the PDF file can be viewed in an Adobe product, and the RTF file can be viewed\
    \ in a word processor.\n\n```\nods listing close;\\ods html file='myreport.html';\\\
    ods pdf file='myreport.pdf';\\ods rtf file='myreport.rtf';\nproc freq data=orion.sales;\n\
    tables Country;\n  title 'Report 1';\nrun;\nproc means data=orion.sales;\nvar\
    \ Salary;\n  title 'Report 2';\nrun;\nproc print data=orion.sales;\nvar First\
    \ Name Last Name\n  Job Title Country Salary;\n  where Salary > 75000;\n  title\
    \ 'Report 3';\nrun;\nods _all close;\\ods listing;\nods html file='.workshop.report(myhtml)'\
    \ rs=none;\nods pdf file='.workshop.report(mypdf)';\nods rtf file='.workshop.report(myrtf)'\
    \ rs=none;\n```"
