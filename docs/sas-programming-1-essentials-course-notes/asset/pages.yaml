  md: '# The WHERE Statement (Review)


    The WHERE statement subsets observations that meet a particular condition.

    General form of the WHERE statement:


    ```

    WHERE where-expression;

    ```


    The where-expression is a sequence of operands and operators that form a set of
    instructions that define a condition for selecting observations.


    +   - Operands include constants and variables.

    - Operators are symbols that request a comparison, arithmetic calculation, or
    logical operation.


    # Processing the WHERE Statement


    The WHERE statement selects observations before they are brought into the program
    data vector.


    ![](img/1698e3a97543d6895ff5297aae8fd042_426_0.png)'
  merge: -1
  pgno: 426
- img_proc: true
  md: '# 9.07 Quiz


    Why does the WHERE statement not work in this

    DATA step?


    ```

    data work.december;

    set orion.sales;

    BonusMonth=month(Hire_Date);

    Bonus=500;

    Compensation=sum(Salary,Bonus);

    where Country=''AU'' and BonusMonth=12;

    run;

    ```


    > cannot use a computer variable in a where

    statement! (where statement subset too early)


    # The Subsetting IF Statement


    The subsetting IF statement continues processing

    only those observations that meet the condition.

    General form of the subsetting IF statement:


    ```

    IF expression;

    ```


    The expression is a sequence of operands and operators

    that form a set of instructions that define a condition for

    selecting observations.


    +   * Operands include constants and variables.

    * Operators are symbols that request a comparison,

    arithmetic calculation, or logical operation.'
  merge: -1
  pgno: 427
- img_proc: true
  md: '# The Subsetting IF Statement


    Examples:


    ```

    if Salary > 50000;

    ```


    ```

    if Last Name=''Smith'' and First Name=''Joe'';

    ```


    ```

    if Country not in (''GB'', ''FR'', ''NL'');

    ```


    ```

    if Hire Date = ''15APR2008d;

    ```


    ```

    if BirthMonth = 5 or BirthMonth = 6;

    ```


    ```

    if upcase(Gender)=''M'';

    ```


    ```

    if 40000 <= Compensation <= 80000;

    ```


    ```

    if sum(Salary,Bonus) < 43000;

    ```


    Special WHERE operators such as BETWEEN-AND, IS NULL, IS MISSING, CONTAINS, and
    LIKE cannot be used with the subsetting IF statement.


    # Processing the Subsetting IF Statement


    The subsetting IF statement determines if observations continue being processed
    in the program data vector.


    ![](img/1698e3a97543d6895ff5297aae8fd042_428_0.png)'
