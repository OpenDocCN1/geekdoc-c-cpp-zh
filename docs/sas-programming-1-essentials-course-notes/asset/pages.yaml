- img_proc: true
  md: '# The MEANS Procedure


    This PROC MEANS step shows default descriptive

    statistics for Salary.


    ```

    proc means data=orion.nonsales;

    var Salary;

    run;

    ```


    | N | Mean | Std Dev | Minimum | Maximum |

    |---|---|---|---|--|

    | 234 | 43954.60 | 38354.77 | 2401.00 | 433800.00 |


    Without the VAR statement, PROC MEANS analyzes all numeric variables in the data
    set.


    # The MEANS Procedure


    By default, the MEANS procedure creates a report with

    (number of nonmissing values), MEAN, STDDEV, MIN,

    and MAX.


