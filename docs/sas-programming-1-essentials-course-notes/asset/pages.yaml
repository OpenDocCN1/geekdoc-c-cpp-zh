  md: "# The DSD Option\n\n+   The DSD option for the INFILE statement\n- sets the\
    \ default delimiter to a comma\n- treats consecutive delimiters as missing values\n\
    - enables SAS to read values with embedded delimiters if the value is surrounded\
    \ by quotation marks.\n\nGeneral form of a DSD option in an INFILE statement:\n\
    \n```\nINFILE 'raw-data-file-name' DSD;\n```\n\n# Using the DSD Option\n\nAdding\
    \ the DSD option will correctly read the phone2.csv data file.\n\n```\ndata contacts;\n\
    \  length Name $ 20 Phone Mobile $ 14;\n  infile 'phone2.csv' dsd;\n  input Name\
    \ $ Phone $ Mobile $;\nrun;\nproc print data=contacts noobs;\nrun;\n```\n\n> The\
    \ DLM=',' option is no longer needed in the INFILE statement because the DSD option\
    \ sets the default delimiter to a comma."
