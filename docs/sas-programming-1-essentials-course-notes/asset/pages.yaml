    # Cleaning the Data


    After the data is validated, the invalid data needs to be cleaned.


    +   Techniques for cleaning data:

    * Editing raw data file outside of SAS

    * Interactively editing data set using VIEWTABLE

    * Programmatically editing data set using the DATA step

    * Programmatically editing data set using the SQL procedure

    * Using the SAS DataFlux product dfPower Studio


    Ideally, invalid data should be cleaned in the original data source and not in
    the SAS data set.

    Integrity constraints are a set of data validation rules that you can specify
    in order to restrict the data values that can be stored for a variable in a SAS
    data file. Integrity constraints help you preserve the validity and consistency
    of your data. SAS enforces the integrity constraints when the values associated
    with an integrity constraint variable are added, updated, or deleted.


    Section 8.5 addresses the situation where you have no choice but to correct the
    data in the SAS data set.'
