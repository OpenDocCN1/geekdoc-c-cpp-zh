  md: '# Date Functions – Creating SAS Dates


    | TODAY() | returns the current date as a SAS date value. |


    | MDY(month,day,year) | returns a SAS date value from numeric month, day, and
    year values. |


    Example:


    ```

    AnnivBonus=mdy (month(Hire_Date),15,2008);

    ```


