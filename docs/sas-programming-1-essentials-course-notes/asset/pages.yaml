  md: '# Options to Suppress Display of Statistics


    Options can be placed in the TABLES statement after a forward slash to suppress
    the display of the default statistics.


    | Option | Description |

    |---|---|

    | NOCUM | suppresses the display of cumulative frequency and cumulative percentage.
    |

    | NOPERCENT | suppresses the display of percentage, cumulative percentage, and
    total percentage. |

    | NOFREQ | suppresses the display of the cell frequency and total frequency. |

    | NOROW | suppresses the display of the row percentage. |

    | NOCOL | suppresses the display of the column percentage. |


