  md: "# IF-THEN DO/ELSE DO Statements\n\nMultiple executable statements are allowed\
    \ in IF-THEN DO/ELSE DO statements.\n\n| IF expression DO; | DO Group |\n|---|---|\n\
    | executable statements | |\n| END; | |\n| ELSE IF expression DO; | DO Group |\n\
    | executable statements | |\n| END; |\n\n* then-do enables you to do more than\
    \ one thing for a condition!\n\n+   - Each DO group can contain multiple statements\
    \ that apply to the expression.\n- Each DO group ends with an END statement.\n\
