- img_proc: true
  md: '# Assigning Temporary Labels


    Instead of the LABEL option in PROC PRINT,

    SPLIT= option can be used.


    The SPLIT= option specifies the split character, which

    controls line breaks in column headers.

    General form of the SPLIT= option:


    ```

    SPLIT=''split-character''

    ```


    Without the SPLIT= option, PROC PRINT can split the headers at special characters
    such

    as the blank or underscore or in mixed-case values when going from lowercase to
    uppercase.


    # Assigning Temporary Labels


    The SPLIT= option makes PROC PRINT use labels.


    ```

    proc print data=orion.sales split=''*'';

    var Employee ID Job Title Salary;

    label Employee ID=''Sales ID''

    Job Title=''Job*Title''

    Salary=''Annual*Salary'';


    run;

    ```


