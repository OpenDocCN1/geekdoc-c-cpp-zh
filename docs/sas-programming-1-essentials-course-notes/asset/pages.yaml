- img_proc: true
  md: '12.1 Using the FREQ Procedure


    # #12.1 Using the FREQ Procedure


    # ## Objectives


    +   - Produce one-way and two-way frequency tables with the FREQ procedure.

    - Enhance frequency tables with options.

    - Produce output data sets by using the OUT= option in the TABLES and OUTPUT statements.
    (Self-Study)


    # ## The FREQ Procedure


    The FREQ procedure can do the following:


    +   - produce one-way to *n*-way frequency and crosstabulation (contingency) tables

    - compute chi-square tests for one-way to *n*-way tables and measures of association
    and agreement for contingency tables

    - automatically display the output in a report and save the output in a SAS data
    set


    General form of the FREQ procedure:


    ```

    PROC FREQ=SAS-data-set <option(s)>;n  TABLES variable(s) </ option(s)>;nRUN;

    ```'
  merge: -1
  pgno: 668
- img_proc: true
  md: '# The FREQ Procedure


    A FREQ procedure with NO TABLES statement generates one-way frequency tables for
    all data set variables.


    ```

    proc freq data=orion.sales;

    run;

    ```


    This PROC FREQ step creates a frequency table for the following variables:


    +   * Employee_ID

    * First_Name

    * Last_Name

    * Gender

    * Job_Title

    * Country

    * Birth_Date

    * Hire_Date


    ![](img/1698e3a97543d6895ff5297aae8fd042_669_0.png)


    By default, PROC FREQ creates a report on every variable in the data set. For
    example, the Employee_ID report displays every unique value of Employee_ID, counts
    how many observations have each value, and percentages and cumulative statistics.
    This is not a useful report because each employee has his or her own employee
    ID.


    You do not typically create frequency reports for variables with a large number
    of distinct values, such as Employee_ID, or for analysis variables, such as Salary
    You usually create frequency reports for categorical variables, such as Job_Title.
    You can group variables into categories by creating and applying formats.


    # The TABLES Statement


    The TABLES statement specifies the frequency and crosstabulation tables to produce.


    ```

    proc freq data=orion.sales;

    tables Gender Country;

    run;

    ```


    ![](img/1698e3a97543d6895ff5297aae8fd042_669_1.png)


    An asterisk between variables requests a n-way crosstabulation table.


    ```

    proc freq data=orion.sales;

    tables Gender*Country;

    run;

    ```


    ![](img/1698e3a97543d6895ff5297aae8fd042_669_2.png)'
  merge: -1
  pgno: 669
- img_proc: true
