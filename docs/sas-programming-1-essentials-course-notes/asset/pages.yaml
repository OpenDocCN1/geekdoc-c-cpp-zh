- img_proc: true
  md: '# 8.3 Validating Data with the PRINT and FREQ Procedures


    Objectives

    - Validate data by using the PRINT procedure with the WHERE statement.

    - Validate data by using the FREQ procedure with the TABLES statement.


    # Business Scenario


    +   Additional requirements of non-sales employee data:

    - **Employee_ID** ID must be unique and not missing.

    - **Gender** must have a value of F or M.

    - **Salary** must be in the numeric range of 24000 – 50000.

    - **Job_Title** must not be missing.

    - **Country** must have a value of AU or US.

    - **Birth_Date** value must occur before **Hire_Date** value.

    - **Hire_Date** must have a value of 01/01/1974 or later.'
  merge: -1
  pgno: 322
- img_proc: true
  md: '# SAS Procedures for Validating Data


    SAS procedures can be used to detect invalid data.


    | | |

    |--- |--- |

    | PROC PRINT step with VAR and WHERE statements | detects invalid character and
    numeric values by subsetting observations based on conditions. |

    | PROC FREQ step with TABLES statement | detects invalid character and numeric
    values by looking at distinct values. |

    | PROC MEANS step with VAR statement | detects invalid numeric values using summary
    statistics. |

    | PROC UNIVARIATE step with VAR statement | detects invalid numeric values by
    looking at extreme values. |


    # The PRINT Procedure


    The PRINT procedure produces detail reports based on SAS data sets.


    General form of the PRINT procedure:


    ```

    PROC PRINT DATA=SAS-data-set;

    VAR variable(s);

    WHERE where-expression;

    RUN;

    ```


    +   - The VAR statement selects variables to include in the report and determines
    their order in the report.

    - The WHERE statement is used to obtain a subset of observations.'
  merge: -1
  pgno: 323
- img_proc: true
  md: '# The WHERE Statement


    For validating data, the WHERE statement is used to retrieve the observations
    that do not meet the data requirements. General form of the WHERE statement:


    ```

    WHERE where-expression;

    ```


    The where-expression is a sequence of operands and operators that form a set of
    instructions that define a condition for selecting observations.


    +   - Operands include constants and variables.

    - Operators are symbols that request a comparison, arithmetic calculation, or
    logical operation.


    # The WHERE Statement


    The following PROC PRINT step retrieves observations that have missing values
    for Job Title.


    ```

    proc print data=orion.nonsales;

    var Employee ID Last Job_Title;

    where Job Title = '' '';

    run;

    ```


    | Obs | Employee_ID | Last | Job_Title |

    |---|---|---||

    | 10 | 120112 | Glattback | |'
  merge: -1
  pgno: 324
- img_proc: true
  md: '# The WHERE Statement


    A WHERE statement might need to reference a SAS date value.


    For example, the PRINT procedure needs to retrieve observations that have values
    of Hire_Date less than January 1, 1974.


    What is the numeric SAS date value for January 1, 1974?


    A SAS date constant is used to convert a calendar date to a SAS date value.


    # SAS Date Constant


    To write a SAS date constant, enclose a date in quotation marks in the form ddMMMMyyyy
    and immediately follow the final quotation mark with the letter d.


    +   * dd is a one- or two-digit value for the day.

    * MMM is a three-letter abbreviation for the month.

    * yyyy is a four-digit value for the year.

    * d is required to convert the quoted string to a SAS date.


    Example:

    The date constant for January 1, 1974, is ''01JAN1974''d''.


    ![](img/1698e3a97543d6895ff5297aae8fd042_325_0.png)'
  merge: -1
  pgno: 325
- img_proc: true
