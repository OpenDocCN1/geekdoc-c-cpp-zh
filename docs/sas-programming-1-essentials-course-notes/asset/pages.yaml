  md: '# The NLEVELS Option


    If the number of desired distinct values is known, the NLEVELS option can help
    to determine whether there are any duplicates.


    ```

    proc freq data=orion.nonsales nlevels;

    tables Gender Country Employee_ID;

    run;

    ```


    The NLEVELS option displays a table that provides the number of distinct values
    for each variable named in the TABLES statement.


    ![](img/1698e3a97543d6895ff5297aae8fd042_331_0.png)


    To display the number of levels without displaying the frequency counts the NOPRINT
    option to the TABLES statement.


    ```

    proc freq data=orion.nonsales nlevels;

    tables Gender Country Employee_ID / noprint;

    run;

    ```


    To display the number of levels for all variables without displaying any frequency
    counts, use the _ALL_ keyword and the NOPRINT option in the TABLES statement.


    ```

    proc freq data=orion.nonsales nlevels;

    tables _all_ / noprint;

    run;

    ```'
