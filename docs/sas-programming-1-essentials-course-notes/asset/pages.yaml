  md: '# 11.4 Subsetting and Grouping Observations


    # Objectives


    +   - Display selected observations in reports by using the WHERE statement.

    - Display groups of observations in reports by using the BY statement.


    # The WHERE Statement (Review)


    For subsetting observations in a report, the WHERE statement is used to select
    observations that meet a certain condition.


    General form of the WHERE statement:


    ```

    WHERE where-expression;

    ```


    The *where-expression* is a sequence of operands and operators that form a set
    of instructions that define a condition for selecting observations.


    +   - Operands include constants and variables.

    - Operators are symbols that request a comparison, arithmetic calculation, or
    logical operation.'
  merge: -1
  pgno: 601
