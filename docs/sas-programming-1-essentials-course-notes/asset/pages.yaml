  md: '# 8.03 Multiple Choice Poll


    Which statements are used to read a delimited raw data file and create a SAS data
    set?


    +   a. DATA and SET only

    b. DATA and INFILE only

    c. DATA, SET, and INPUT only

    (d). DATA, INFILE, and INPUT only


    # Data Errors


    One type of data error is when the INPUT statement encounters invalid data in
    a field.


    When SAS encounters a data error, these events occur:


    +   * A note that describes the error is printed in the SAS log.

    * The input record (contents of the input buffer) being read is displayed in the
    SAS log.

    * The values in the SAS observation (contents of the PDV) being created are displayed
    in the SAS log.

    * A missing value is assigned to the appropriate SAS variable.

    * Execution continues.'
