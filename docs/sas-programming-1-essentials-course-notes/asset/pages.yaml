  md: '# Syntax Errors


    Syntax errors occur when program statements do not conform to the rules of the
    SAS language.


    Examples of syntax errors:


    +   - misspelled keywords

    - unmatched quotation marks

    - missing semicolons

    - invalid options


    When SAS encounters a syntax error, SAS prints a warning or an error message to
    the log.


    ```

    ERROR 22-3322: Syntax error, expecting one of the following:

    name, a quoted string, (, /, _,DATA_, _LAST_,

    NULL_

    ```


    When SAS encounters a syntax error, SAS underlines the error and the following
    information is written to the SAS log:


    +   - the word ERROR or WARNING

    - the location of the error

    - an explanation of the error


    # 3.03 Quiz


    This program has three syntax errors. What are the errors?


    ```

    daat work.NewSalesEmps: 12

    length First Name $ 18 Job Title $ 25;

    infile newemps.csv dlm=T;

    input First Name $ Last Name $

    Job Title $ Salary;

    run;

    proc print data=work.NewSalesEmps;

    run;

    proc means data=work.NewSalesEmps average max;

    class Job Title;

    var Salary;

    ```'
