    \ in the ODS LISTING statement with the STYLE= option produces a different ODS\
    \ style.\n\n```\nods listing style=gears;\noptions reset=all;\nproc gplot data=orion.budget;\n\
    \  plot Yr2007*Month;\n  format Yr2007 dollar12;\n  label Yr2007='Budget'\n  title\
    \ 'Plot of Budget by Month';\nrun;\nquit;\n```\n\n# Plot of Budget by Month\n\n\
