  md: '# Import/Export Wizards and Procedures


    The wizards and procedures have similar capabilities; the wizards are point-and-click
    interfaces and the procedures are code-based.


    To invoke the wizards from the SAS window environment, select **File** and **Import
    Data** or **Export Data.**


    ![](img/1698e3a97543d6895ff5297aae8fd042_227_0.png)


    # The Import Wizard


    The Import Wizard enables you to read data from an external data source and write
    it to a SAS data set.


    +   Steps of the Import Wizard:

    1. Select the type of file you are importing.

    2. Locate the input file.

    3. Select the table range or worksheet from which to import data.

    4. Select a location to store the imported file.

    5. Save the generated PROC IMPORT code. (Optional)'
  merge: -1
