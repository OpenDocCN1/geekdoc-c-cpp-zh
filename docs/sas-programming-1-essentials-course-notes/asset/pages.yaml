- img_proc: true
  md: '4. Submit the fourth PROC GCHART step to use a numeric chart variable.


    The VBAR3D statement creates a vertical bar chart showing the distribution of
    values of the variable Salary Because the chart variable is numeric, PROC GCHART
    divides the values of Salary into ranges and displays one bar for each range.
    The value under the bar represents the midpoint of the range. The FORMAT statement
    assigns the DOLLAR9 format to Salary.


    ```

    options reset=all;

    proc gchart data=or.staff;

    vbar3d salary = autoref;

    where Job_Title = ''Sales Rep'';

    format salary dollar9;

    title ''Salary Distribution Midpoints for Sales Reps'';

    run;

    quit;

    ```


    # Salary Distribution Midpoints for Sales Reps


    ![](img/1698e3a97543d6895ff5297aae8fd042_758_0.png)'
  merge: -1
  pgno: 758
- img_proc: true
  md: "5. Submit the fifth PROC GCHART step to specify ranges for a numeric chart\
    \ variable and add reference lines.\n\nThe HBAR3 statement creates a three-dimensional\
    \ horizontal bar chart.\n\nThe LEVELS=option in the HBAR3 statement divides the\
    \ values of Salary into five ranges and display a bar for each range of values.\n\
    \nThe RANGE option in the HBAR3 statement displays the range of values, rather\
    \ than the midpoint, under each bar.\n\nThe AUTOREF option displays reference\
    \ lines at each major tick mark on the horizontal (response\n\n```\noptions reset=all;\n\
    proc gchart data=orion.staff;\n  hbar3d salary/levels=5 range autoref;\n where\
    \ Job Title ='Sales Rep';\n format salary dollar9;\ntitle 'Salary Distribution\
    \ Ranges for Sales Reps'\nrun;\nquit;\n```\n\nTo display a bar for each unique\
    \ value of the chart variable, specify the DISCRETE option instead of the LEVELS=\
    \ option in the VBAR, VBAR3D, HBAR, or HBAR3D statement. The DISCRETE option should\
    \ be used only when the chart variable has a relatively small number of unique\
    \ values.\n\n# Salary Distribution Ranges for Sales Reps\n\n![](img/1698e3a97543d6895ff5297aae8fd042_759_0.png)"
  merge: -1
  pgno: 759
- img_proc: true
  md: "# 13.2 Creating Bar and Pie Charts 13-15\n\n6. Submit the sixth PROC GCHART\
    \ step to create bar charts based on statistics.\n\nA vertical bar chart displays\
    \ one bar for each value of the variable Job_Title by specifying Job_Title as\
    \ the chart variable in the VBAR statement. The height of the bar should be based\
    \ on the mean value of the variable Salary for each job title.\n\nThe SUMVAR=\
    \ option in the VBAR statement specifies the variable whose values control the\
    \ height or length of the bars. This variable Salary, in (Salary, in this case)\
    \ is known as the analysis variable.\n\nThe TYPE= option in the VBAR statement\
    \ specifies the statistic for the analysis variable that dictates the height or\
    \ length of the bars. Possible values for the TYPE= option are SUM and MEAN.\n\
    \nA LABEL statement assigns labels to the variables Job_Title and Salary.\n\n\
    ```\ngoptions reset=all;\nproc gchart data=orion.staff;\n  vbar Job Title / sumvar=salary\
    \ type=mean;\n  where Job Title ='Sales Rep';\n  format salary dollar$;n  label\
    \ Job Title='Job Title'\n  Salary='Salary';\n  title 'Average Salary by Job Title';\n\
    ```\n\nrun;\nquit= option is not specified, the default value of the TYPE= option\
    \ is SUM.\n\n![](img/1698e3a97543d6895ff5297aae8fd042_760_0.png)"
  merge: -1
  pgno: 760
- img_proc: true
  md: "# Chapter 13 Introduction to Graphics Using SAS/GRAPH (Self-Study)\n\n7. Submit\
    \ the seventh PROC GCHART step to assign a different color to each bar and display\
    \ the mean statistic on the top of each bar.\n\nThe PATTERNID=MIDPOINT option\
    \ in the VBAR statement allows PROC GCHART to assign a different pattern or color\
    \ to each value of the midpoint (chart) variable.\n\nThe MEAN option in the VBAR\
    \ statement displays the mean statistic on the top of each bar. Other options\
    \ such as SUM, FREQ, and PERCENT can be specified to display other statistics\
    \ on the top of the bars.\n\n```\noptions reset=all;\nproc gchart data=orion.staff;\n\
    \  vbar Job Title / sumvar=salary type=mean patternid=midpoint;\n  where Job Title\
    \ ='Sales Rep'\n  format salary dollar$9.\n  title 'Average Salary by Job Title';\n\
    run;\nquit;\n```\n\nOnly one statistic can be displayed on top of each vertical\
    \ bar. For horizontal bar charts, you can specify multiple statistics, which are\
    \ displayed to the right of the bars.\n\n# Average Salary by Job Title\n\n![](img/1698e3a97543d6895ff5297aae8fd042_761_0.png)"
  merge: -1
  pgno: 761
- img_proc: true
  md: '8. Submit the eighth PROC GCHART to divide the bars into subgroups.


    A VBAR statement creates a vertical bar chart that shows the number of sales representatives
    for each value of Job Title.


    The SUBGROUP= option in the VBAR statement divides the bar into sections, where
    each section represents the frequency count for each value of the variable Gender.


    ```

    goptions reset=all;

    proc gchart data=orion.staff;

    vbar Job_Title/subgroup=Gender;

    where Job_Title ==''Sales Rep''

    title ''Frequency of Job Title, Broken Down by Gender''

    run;

    quit;

    ```


    # Frequency of Job Title, Broken Down by Gender


    ![](img/1698e3a97543d6895ff5297aae8fd042_762_0.png)'
  merge: -1
  pgno: 762
- img_proc: true
  md: '9. Submit the ninth PROC GCHART step to group the bars.


    A VBAR statement creates a vertical bar chart showing the frequency for each value
    of Gender.


    The GROUP=option in the VBAR statement displays a separate set of bars for each
    value of Job_Title.


    The PATTERNID=MIDPOINT option in the VBAR statement displays each value of Gender
    (the midpoint or chart variable) with the same pattern.


    ```

    options reset=all;

    proc gchart data=orion.staff;

    vbar gender/group=Job Title pattern=midpoint;

    where Job Title := ''Sales Rep'';

    title ''Frequency of Job Gender, Grouped by Job Title'';

    run;

    quit;

    ```


    # Frequency of Job Gender, Grouped by Job Title


    ![](img/1698e3a97543d6895ff5297aae8fd042_763_0.png)


    Submitting the following statements (reversing the chart and group variables)
    would produce a chart with two groups of bars:


    ```

    proc gchart data=orion.staff;

    vbar gender/group=Job Title patternid=midpoint;

    ```'
  merge: -1
  pgno: 763
- img_proc: true
  md: '# 13.2 Creating Bar and Pie Charts 13-19


    10. Submit the final PROC GCHART step to create multiple pie charts using RUN-group
    processing.


    A PIE and a PI3D statement in the same PROC GCHART step produces both a two-dimensional
    pie chart and a three-dimensional pie chart showing the number of sales representatives
    for each value of Job_Title.


    The TITLE2 statements specify different subtitles for each chart. The NOHEADING
    option in the PI3D statement suppresses the FREQUENCY of Job Title heading.


    Because RUN-group processing is in effect, note the following:


    +   * It is not necessary to submit a separate PROC GCHART statement for each
    graph.

    * The WHERE statement is applied to both charts.

    * A separate TITLE2 statement is used for each chart.


    ```

    options gchart reset=all;

    proc gchart data=orion.staff;

    pie Job_Title;

    where Job_Title =:''Sales Rep'';

    title ''Frequency Distribution of Job Titles''

    title2 ''2-D Pie Chart'';

    run;

    pie3d Job_Title / noheading;

    title2 ''3-D Pie Chart'';

    run;

    quit;

    ```


