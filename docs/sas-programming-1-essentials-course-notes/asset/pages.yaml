  md: '# 10.4 Merging Data Sets One-to-One


    # Objectives


    +   - Define the different types of match-merging.

    - Prepare data sets for merging using the SORT procedure.

    - Merge SAS data sets one-to-one based on a common variable by using the MERGE
    and BY statements in a DATA step.

    - Eliminate duplicate observations using the SORT procedure. (Self-Study)


    # Merging


    Merging involves combining observations from two or more SAS data sets into a
    single observation in a new SAS data set.


    | SAS Data Set | SAS Data Set |

    |---|---|

    | | |

    | | |

    | | |


    Observations can be merged based on their positions in the original data sets
    or merged by one or more common variables.'
