    # Assigning Permanent and Temporary Formats


    Using a FORMAT statement in a DATA step permanently associates formats with variables
    by storing the format in the descriptor portion of the SAS data set.


    ```

    data orion.bonus;

    set orion.sales;

    Bonus=Salary*0.10;

    format Salary Bonus comma8;

    keep Employee ID First Name

    Last Name Salary Bonus;

    run;

    ```


    ```

    proc print data=orion.bonus;

    format Bonus dollar8;

    run;

    ```


    +   - Temporary formats override permanent formats.'
