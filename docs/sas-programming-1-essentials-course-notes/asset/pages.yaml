  md: '# Assignment Statements (Review)


    The assignment statement evaluates an expression and assigns the resulting value
    to a variable.


    General form of the assignment statement:


    ```

    variable = expression;

    ```


    +   - variable names an existing or new variable.

    - expression is a sequence of operands and operators that form a set of instructions
    that produce a value.


    An assignment statement evaluates the expression on the right side of the equal
    sign and stores the result in the variable that is specified on the left side
    of the equal sign.


    # Operands (Review)


    Operands are constants (character, numeric, or date) and variables (character
    or numeric).


    Examples:


    ```

    Bonus = 500; -> numeric constant

    ```


    ```

    Gender = ''M''; -> character constant

    ```


    ```

    Hire_Date = ''01APR2008d''; -> date constant

    ```


    ```

    NewSalary = 1.1 * Salary;

    ```


    ```

    variable

    ```'
  merge: -1
  pgno: 386
- img_proc: true
  md: "# Operators (Review)\n\nOperators are symbols that represent an arithmetic\
    \ calculation and SAS functions.\n\nExamples:\n\n```\nRevenue = Quantity * Price;\n\
    ```\n\n```\nNewCountry = upcase (Country);\n```\n\n# Arithmetic Operators\n\n\
    Arithmetic operators indicate that an arithmetic calculation is performed.\n\n\
    | Symbol | Definition | Priority |\n|---|---|---|\n| ** | exponentiation | I |\n\
    | - | negative prefix | I |\n| * | multiplication | II |\n| / | division | II\
    \ |\n| + | addition | III |\n| - | subtraction | III |\n\n> If a missing value\
    \ is an operand for an arithmetic operator, the result is a missing value.\n\n\
    # Rules for Operators\n\n+   * Operations of priority I are performed before operations\
    \ of priority II, and so on.\n* Consecutive operations with the same priority\
    \ are performed in this sequence:\n  - from right to left within priority I\n\
    \  - from left to right within priorities II and III\n* Parentheses can be used\
    \ to control the order of operations."
  merge: -1
