    # The DROP and KEEP Statements (Review)


    The DROP statement specifies the names of the variables to omit from the output
    data set(s).


    ```

    DROP variable-list ;

    ```


    The KEEP statement specifies the names of the variable to write to the output
    data set(s).


    ```

    KEEP variable-list ;

    ```


    The variable-list specifies the variables to drop or keep, respectively, in the
    output data set.


