  md: '# 7.1 Using Standard Delimited Data as Input


    # Delimiter


    A space (blank) is the default delimiter.


    The DLM= option can be added to the INFILE statement to specify an alternate delimiter.


    ```

    DATA output-SAS-data-set;

    INFILE ''raw-data-file-name'' DLM=''delimiter'';

    INPUT specifications;

    <additional SAS statements>

    RUN;

    ```


    The DLM= option is an alias for the DELIMITER= option.


    To specify a tab delimiter on Windows or UNIX, type dlm=''09'' x.


    To specify a tab delimiter on z/OS (OS390), type dlm=''05'' x.


    The DSD (delimiter-sensitive) option changes how SAS treats delimiters when you
    use LIST input and sets the default delimiter to a comma. When you specify DSD,
    SAS treats two consecutive delimiters as a missing value and removes quotation
    marks from character values. The DSD option specifies that when data values are
    enclosed in quotation marks, delimiters within the value are treated as character
    data.


    # Standard and Nonstandard Data


    +   * Standard data is data that SAS can read without any special instructions.


    Examples of standard numeric data:


    ```

    58 -23 67.23 00.99 5.67E5 1.2E-2

    ```


    +   * Nonstandard data is any data that SAS cannot read without a special instruction.


    Examples of nonstandard numeric data:


    ```

    5,823 (23) $67.23 01/12/1999 12MAY2006

    ```'
  merge: -1
  pgno: 256
- img_proc: true
  md: '# List Input for Standard Data


    List input specification:


    ```

    INPUT variable <$>

    ```


    +   - Variables must be specified in the order that they appear in the raw data
    file, left to right.

    - $ indicates to store a variable value as a character value rather than as a
    numeric value.

    - The default length for character and numeric variables is eight bytes.


    # List Input for Standard Data


