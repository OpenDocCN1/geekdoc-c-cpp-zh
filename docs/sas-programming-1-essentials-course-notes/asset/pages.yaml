  md: '# Unlike-Structured Data Sets


    The FORCE option forces the observations to be appended when the DATA= data set
    contains variables that are not in the BASE= data set.

    General form of the FORCE option:


    ```

    PROC APPEND BASE = SAS-data-set

    DATA = SAS-data-set FORCE;


    RUN;

    ```


    The FORCE option causes the extra variables to be dropped and issues a warning
    message.


    ```

    proc append base=Emps

    data=Emps2010 force;


    run;

    ```


    The FORCE option is needed when the DATA= data set contains variables either


    +   - are not in the BASE= data set

    - do not have the same type as the variables in the BASE= data set

    - are longer than the variables in the BASE= data set.


    If the length of a variable is longer in the DATA= data set than in the BASE=
    data set, SAS truncates values from the DATA= data set to fit them into the length
    that is specified in the BASE= data set.


    If the type of a variable in the DATA= data set is different than in the BASE=
    data set, SAS replaces all values for the variable in the DATA= data set with
    missing values and keeps the variable type of the variable specified in the BASE=
    data set.


    ![](img/1698e3a97543d6895ff5297aae8fd042_461_0.png)'
  merge: -1
  pgno: 461
