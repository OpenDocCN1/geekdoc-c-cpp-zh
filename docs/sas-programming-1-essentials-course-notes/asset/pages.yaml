  md: '# STYLE= Option


    Use a STYLE= option in the ODS destination statement to specify a style definition.


    ```

    ODS destination FILE = ''filename.ext''

    STYLE = style-definition;

    ```


    +   - A style definition describes how to display the presentation aspects such
    as colors and fonts of SAS output.

    - STYLE= cannot be used with the LISTING destination.


    # SAS Supplied Style Definitions


    | Analysis | Astronomy | Banker | BarrettsBlue |

    | Beige | blockPrint | Brick | Brown |

    | Curvs | D3d | Default | Education |

    | EGDefaultDefault | Electronics | fancyPrinter | Festival |

    | FestivalPrinter | Gears | Journal | Magnify |

    | Meadow | MeadowPrinter | Minimal | Money |

    | NoFontDefault | Normal | NormalPrinter | Printer |

    | Rsvp | Rtf | sansPrinter | sasdocPrinter |

    | Sasweb | Science | Seaside | SeasidePrinter |

    | serifPrinter | Sketch | Statdoc | Statistical |

    | Theme | Torn | Watercolor |'
  merge: -1
  pgno: 623
- img_proc: true
  md: '# SAS Supplied Style Definitions


    The following style definitions are new to SAS 9.2:


    | grayscalePrinter | Harvest | HighContrast |

    | Journal2 | Journal3 | Listing |

    | monochromePrinter | Ocean | Solutions |


    ![](img/1698e3a97543d6895ff5297aae8fd042_624_0.png)


    Some of the style definitions changed between SAS 9.1.3 and SAS 9.2.


    +   - For example, the SAS 9.1.3 Analysis style definition produces different
    results than the SAS 9.2 Analysis style definition. The SAS 9.1.3 Analysis style
    definition is similar to the SAS 9.2 Ocean style definition.

    - The SAS 9.1.3 Statistical style definition produces different results than the
    SAS 9.2 Statistical style definition. The SAS 9.1.3 Statistical style definition
    is similar to the SAS 9.2 Harvest style definition.


    # HTML Examples


