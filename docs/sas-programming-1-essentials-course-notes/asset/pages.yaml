- img_proc: true
  md: "# The SUMMARY Procedure (Self-Study)\n\nThe SUMMARY procedure provides data\
    \ summarization tools to compute descriptive statistics for variables across all\
    \ observations and within groups of observations.\n\nGeneral form of the SUMMARY\
    \ procedure:\n\n```\nPROC SUMMARY DATA=SAS-data-set <statistic(s)>\n  <option(s);\n\
    \  VAR analysis-variable(s);\n  CLASS classification-variable(s);\nRUN;\n```\n\
    \n# The SUMMARY Procedure (Self-Study)\n\nThe SUMMARY procedure uses the same\
    \ syntax as the MEANS procedure.\nThe only differences to the two procedures are\
    \ the following:\n\n| PROC MEANS | PROC SUMMARY |\n|---|----|\n| The PRINT option\
    \ is set by default, which displays output. | The NOPRINT option is set by default,\
    \ which displays no output. |\n| Omitting the VAR statement analyzes all the numeric\
    \ variables. | Omitting the VAR statement produces a simple count of observations.\
    \ |"
  merge: -1
  pgno: 706
