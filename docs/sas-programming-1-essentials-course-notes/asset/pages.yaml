- img_proc: true
  md: '# The IN= Data Set Option


    The IN= data set option creates a variable that indicates the data set contributed
    data to the current observation.


    General form of the IN= data option:


    ```

    SAS-data-set (IN = variable)

    ```


    variable is a temporary numeric variable that has two possible values:


    +   -0 indicates that the data set did not contribute to the current observation

    -1 indicates that the data set did contribute to the current observation


    The variable created with the IN= data set option is temporary. Therefore, the
    variable is only available during the execution phase and is not written to the
    SAS data set.


    # The IN= Data Set Option


    MERGE statement examples:


    ```

    merge EmpsAU(in=Emps)

    PhoneC(in=Cell);

    ```


    ```

    merge EmpsAU(in=E)

    PhoneC(in=P);

    ```


    ```

    merge EmpsAU(in=AU)

    PhoneC;

    ```'
