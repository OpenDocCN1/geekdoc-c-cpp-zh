  md: '# SAS Date Formats


    The SAS National Language Support (NLS) date formats convert SAS date values to
    a locale-sensitive date string.


    | Format | Locale | Example |

    | --- | --- | --- |

    | NDATEW | English_UnitedStates | January 01, 1960 |

    | | German_Germany | 01. Januar 1960 |

    | NLDATEMNW | English_UnitedStates | January |

    | | German_Germany | Januar |

    | NLDATEWW | English_UnitedStates | Fri, Jan 01, 60 |

    | | German_Germany | Fr, 01. Jan 60 |

    | NLDATEWNW | English_UnitedStates | Friday |

    | | German_Germany | Freitag |


    National Language Support (NLS) is a set of features that enable a software product
    to function properly in every global market for which the product is targeted.
    SAS contains NLS features to ensure that SAS applications conform to local language
    conventions.


    A locale reflects the language, local conventions, and culture for a geographical
    region. Local conventions may include specific formatting rules for dates. Dates
    have many representations, depending on the conventions that are accepted in a
    culture.


    The LOCALE= system option is used to specify the locale, which reflects the local
    conventions, language, and culture of a geographical region. For example, a locale
    value of English_Canada represents the country of Canada with a language of English,
    and a locale value of French_Canada represents the country of Canada with a language
    of French. English_UnitedStates represents the country of United States with a
    language of English. German_Germany represents the country of Germany with a language
    of German.


    The LOCALE= system option can be specified in a configuration file, at SAS invocation,
    in the OPTIONS statement, or in the SAS System Options window.


    For more information, refer to the SAS 9.2 National Language Support Reference
    Guide in SAS Help and Documentation.'
  merge: -1
