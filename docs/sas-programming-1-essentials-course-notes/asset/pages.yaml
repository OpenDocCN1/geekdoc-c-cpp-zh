  md: '# The APPEND Procedure


    The APPEND procedure adds the observations from one SAS data set to the end of
    another SAS data set. General form of the APPEND procedure:


    ```

    PROC APPEND BASE = SAS-data-set

    DATA = SAS-data-set;

    RUN;

    ```


    BASE= names the data set to which observations are added.

    DATA= names the data set containing observations that are added to the base data
    set.


    # The APPEND Procedure


    Requirements:


    +   - Only two data sets can be used at a time in one step.

    - The observations in the base data set are not read.

    - The variable information in the descriptor portion of the base data set cannot
    change.'
  merge: -1
  pgno: 455
