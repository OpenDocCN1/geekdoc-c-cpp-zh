  md: '# Diagnosing and Correcting the Errors


    There are no notes in the SAS log because all of the SAS statements after the
    DLM= option became part of the quoted delimiter.


    ![](img/1698e3a97543d6895ff5297aae8fd042_91_0.png)


    The banner in the window indicates that the DATA step is still running, and it
    is still running because the RUN statement was not recognized.


    You can correct the unbalanced quotation marks programmatically by adding the
    following code before your previous statements:


    +   * ''; run;

    * If the quotation mark counter in SAS has an uneven number of quotation marks,
    as seen in the program, SAS reads the quotation mark in the code above as the
    matching quotation mark in the quotation mark counter. SAS then has an even number
    of quotation marks in the quotation mark counter and runs successfully, assuming
    no other errors occur. Both single quotation marks and double quotation marks
    are used in case you submitted double quotation marks instead of single quotation
    marks.


    # Point-and-Click Approaches to Balancing Quotation Marks


    Windows


    +   1. To correct the problem in the Windows environment, click the break icon
    or press the CTRL and Break keys.

    2. Select I. Cancel Submitted Statements in the Task Manager window and select
    OK.


