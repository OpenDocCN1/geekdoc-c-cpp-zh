    Partial Documentation


    | Command Line Commands and the Editor There are a number of commands that you
    might find useful while working in the Editor. You execute these commands from
    the command line |

    TOP scrolls to the beginning of the Editor.

    BOTTOM scrolls to the last line of text.

    BACKWARD scrolls back toward the beginning of the text.

    FORWARD scrolls forward toward the end of the text.

    LEFT scrolls to the left of the window.

    RIGHT scrolls to the right of the window.

    ZOOM increases the size of the text. You can use this command to return the window
    to its previous size.

    UNDO cancels the effect of the most recently edited text command. Continuing to
    execute UNDO undo commands, starting with the most recent and moving backward.

    SUBMIT executes the block of code in your current SAS windowing environment.

    RECALL returns the most recently executed block of statements in your current
    SAS windowing environment. Continuing to execute the RECALL command returns statements,
    starting with the most recent and moving backward.

    CLEAR clears as specified. You can clear the Editor, Log, or Output windows from
    another window by executing the CLEAR command with the appropriate option as shown
    in the following examples:

    clear prompt

    clear log

    clear output'
