  md: '# Titles with Dates and Times (Self-Study)


    The automatic macro variables &SYSDATE9 and &SYYSTEME can be used to add the SAS
    invocation date and time to titles and footnotes.


    ```

    title1 ''Orion Star Employee Listing'';ntitle2 "Created on &sysdate9 at &sisteme";

    ```


    Double quotation marks must be used when you reference a macro variable.


    Example Title Output:


    Orion Star Employee Listing

    Created on 11MAR2008 at 15:53


    # Titles with Dates and Times (Self-Study)


    The TODAY function can be used with %SYFSUNC and the TIME function to create a
    macro variable with the current date or time.


    ```

    %LET macro-variable = %SYFSUNC(today), date-format);

    ```


    ```

    %LET macro-variable = %SYFSUNC(time), time-format);

    ```


    +   - %LET is a macro statement that creates a macro variable and assigns it a
    value without leading or trailing blanks.

    - %SYFSUNC is a macro function that executes SAS functions outside of a step.'
