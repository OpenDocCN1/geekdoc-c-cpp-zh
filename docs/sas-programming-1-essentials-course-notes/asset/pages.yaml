  md: '# # 1.1 Course Logistics


    Objectives

    * Explain the naming convention that is used for the course files.

    * Compare the three levels of exercises that are used in the course.

    * Describe at a high level how data is used and stored at Orion Star Sports &
    Outdoors.

    * Navigate to the Help facility.


    # ## Filename Conventions


    ![](img/1698e3a97543d6895ff5297aae8fd042_16_0.png)


    | Code | Type |

    |---|---|

    | a | Activity |

    | d | Demo |

    | e | Exercise |

    | s | Solution |


    Example:

    The Programming 1 course ID is p1, so p104d01 = Programming 1

    Chapter 4, Demo 1.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Three Levels of Exercises


    | Level 1 | The exercise mimics an example presented in the section. |

    | Level 2 | Less information and guidance are provided in the exercise instructions.
    |

    | Level 3 | Only the task you are to perform or the results to be obtained are
    provided. Typically, you will need to use the Help facility. |


    +   * You are not expected to complete all of the exercises in the time allotted.
    Choose the exercise or exercises that are at the level you are most comfortable
    with.


    # Orion Star Sports & Outdoors


    ![](img/1698e3a97543d6895ff5297aae8fd042_17_0.png)


    Orion Star Sports & Outdoors is a fictitious global sports and outdoors retailer
    with traditional stores, an online store, and a large catalog business.


    The corporate headquarters is located in the United States with offices and stores
    in many countries throughout the world.


    Orion Star has about 1,000 employees and 90,000 customers, processes approximately
    150,000 orders annually, and purchases products from 64 suppliers.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Orion Star Data


    As is the case with most organizations, Orion Star has a large amount of data
    about its customers, suppliers, products, and employees. Much of this information
    is stored in transactional systems in various formats.


    Using applications and processes such as SAS Data Integration Studio, this transactional
    information was extracted, transformed, and loaded into a data warehouse.


    Data marts were created to meet the needs of specific departments departments
    such as Marketing.


    # The SAS Help Facility


    ![](img/1698e3a97543d6895ff5297aae8fd042_18_0.png)


    The Help facility can also be accessed from a Web browser at the following link:
    http://support.sas.com/documentation/index.html'
  merge: -1
