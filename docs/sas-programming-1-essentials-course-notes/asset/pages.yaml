    digits and a period that separates the decimal fraction. |

    | COMMAw.d | writes numeric values with a period that separates every three digits
    and a comma that separates the decimal fraction. |

    | DOLLARw.d | writes numeric values with a leading dollar sign, a comma that separates
    every three digits, and a period that separates the decimal fraction. |

    | EUROxw.d | writes numeric values with a leading euro symbol (€), a period that
