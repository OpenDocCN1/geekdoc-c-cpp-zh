  md: "# Step Boundaries\n\nSAS steps begin with either of the following:\n\n+   -\
    \ a DATA statement\n- a PROC statement\n\nSAS detects the end of a step when it\
    \ encounters one of the following:\n\n+   - a RUN statement (for most steps)\n\
    - a QUIT statement (for some procedures)\n- the beginning of another step (DATA\
    \ statement or PROC statement)\n\nA SAS program executed in batch or noninteractive\
    \ mode might not require any RUN statements to execute successfully. However,\
    \ this practice is not recommended.\n\n# Step Boundaries\n\nSAS detects the end\
    \ of the DATA step when it encounters the RUN statement.\n\n```\ndata work.NewSalesEmps;\n\
    \  length First_Name $ 18 Job Title $ 25;\n  Last_Name $ 12\n  infile 'newwemps.csv'\
    \ dlm=';\n  input First_Name $ Last_Name $ Job_ Title $ Salary;\nrun;\nproc print\
    \ data=work.NewSalesEmps;\nproc means data=work.NewSalesEmps;\n  class Job Title;\n\
    \  var Salary;\n```\n\nSAS detects the end of the PROC PRINT step when it encounters\
    \ the beginning of the PROC MEANS step."
  merge: -1
