- img_proc: true
  md: '# Using Options with the EXCELP Destination (Self-Study)


    Submit the following program and view the EXCELP documentation in the SAS log
    and the XML files in Microsoft Excel.


    ```

    ******** Documentation Option ********

    ods listing close;

    ods tagsets.excelxp file=''myexcel.xml''

    style=sasweb

    options(doc=''help'');


    proc freq data=orion.sales;

    tables Country;

    title ''Report 1'';

    run;


    proc means data=orion.sales;

    var Salary;

    title ''Report 2'';

    run;


    ods tagsets.excelxp close;

    ods listing;

    ```


    ```

    ******** Other Options ********

    ods listing close;

    ods tagsets.excelxp file=''myexcel2.xml''

    style=sasweb

    options(embedded_titles=''yes''

    sheet_Name=''First Report'');


    proc freq data=orion.sales;

    tables Country;

    title ''Report 1'';

    run;


    ods tagsets.excelxp options(sheet_Name=''Second Report'');

    proc means data=orion.sales;

    var Salary;

    title ''Report 2'';

    run;


    ods tagsets.excelxp close;

    ods listing;

    ```'
  merge: -1
