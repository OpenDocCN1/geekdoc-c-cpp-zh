    > Can''t use 2 WHERE statements!


    # The BY Statement


    For grouping observations in a report, the BY statement is used to produce separate
    sections of the report for each BY group.


    General form of the BY statement:


    ```

    BY <DESCENDING> by-variable(s);

    ```


    The observations in the data set must be sorted by the variables specified in
    the BY statement.'
