  md: '# Exercises


    Level 1


    +   1. Counting Levels of a Variable with PROC FREQ


    +   a. Retrieve the starter program p112e01.


    +   b. Modify the program to produce two separate reports:


    +   1) Display the number of distinct levels of Customer_ID and Employee_ID for
    retail orders.


    +   a) Use a WHERE statement to limit the report to retail sales by specifying
    the condition Order_Type=1.


    +   b) Display this report title: Unique Customers and Salespersons for Retail
    Sales.


    > If you do not want to see the counts for individual levels of Customer_ID and
    Employee_ID, add the NOPRINT option to the TABLES statement after a forward slash.


    +   2) Display the number of distinct levels for Customer_ID for catalog and Internet
    orders.


    +   a) Use a WHERE statement to limit the report to catalog and Internet sales
    by specifying the condition Order_Type values other than 1.


    +   b) Display this report title: Unique Customers for Catalog and Internet.


    > If you do not want to see the counts for individual levels of Customer_ID, add
    the NOPRINT option to the TABLES statement after a forward slash.'
