    \ frequencies, percentages, and cumulative percentages.\n\n```\nproc freq data=orion.sales;\n\
    tables Gender Country;\nrun;\n```\n\n| Gender | Frequency | Percent | Cumulative\
    \ Frequency | Cumulative Percent |\n| --- | --- | --- | --- | --- |\n| M | 68\
    \ | 41.21 | 68 | 41.21 |\n| | 97 | 58.79 | 165 | 100.00 |\n| Country | Frequency\
    \ | Percent | Cumulative Frequency | Cumulative Percent |\n| AU | 63 | 38.18 |\
    \ 63 | 38.18 |\n| US | 102 | 61.82 | 165 | 100.00 |\n\n# The TABLES Statement\n\
    \nAn n-way frequency table produces cell frequencies, cell percentages, cell percentages\
    \ of row frequencies, and cell percentages of column frequencies, plus total frequency\
    \ and percent.\n\n```\nproc freq data=orion.sales;\ntables Gender*Country;\nrun;\n\
    \  rows columns;\n```"
