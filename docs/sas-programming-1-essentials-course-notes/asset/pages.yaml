  md: '# IF-THEN Statements


    The IF-THEN statement executes a SAS statement for observations that meet specific
    conditions.


    General form of the IF-THEN statement:


    ```

    IF expression THEN statement;

    ```


    +   * expression is a sequence of operands and operators that form a set of instructions
    that define a condition for selecting observations.


    +   * statement is any executable statement such as the assignment statement.


    If the condition in the IF clause is met, the IF-THEN statement executes a SAS
    statement for that observation.


    # IF-THEN Statements


    All the values of Salary must be in the range of 24000 - 50000.


    ```

    data work.clean;

    set orion.nonsales;

    if Employee_ID=120106 then Salary=26960;

    if Employee_ID=120115 then Salary=26500;

    if Employee_ID=120191 then Salary=24015;

    run;

    ```


    | Employee ID | Salary Job Title |

    |---|---|---||

    | 120105 | 27110 Secretary I |'
  merge: -1
