  md: "# User-Defined Formats\n\nTo create and use your own formats, do the following:\n\
    \n+   - Part 1: Use the FORMAT procedure to create the user-defined format.\n\n\
    +   - Part 2: Apply the format to a specific variable(s) by using a FORMAT statement\
    \ in the reporting procedure.\n\n# The FORMAT Procedure\n\nThe FORMAT procedure\
    \ is used to create user-defined formats.\nGeneral form of the FORMAT procedure\
    \ with the VALUE statement:\n\n```\nPROC FORMAT;\n  VALUE format-name range1 =\
    \ 'label'\n        range2 = 'label'\n  ...;\nRUN;\n```"
  merge: -1
  pgno: 588
- img_proc: true
  md: '# The FORMAT Procedure


    A format-name


    +   - names the format that you are creating

    - cannot be more than 32 characters in SAS®9

    - for character values, must have a dollar sign ($) as the first character, and
    a letter or underscore as the second character

    - numeric values, must have a letter or underscore as the first character

    - cannot end in a number

    - cannot be the name of a SAS format

    - does not end with a period in the VALUE statement.


    Format names prior to SAS®9 are limited to 8 characters.


    # 11.05 Multiple Answer Poll


    Which user-defined format names are invalid?


    +   a. $stfmt

    b. $3levels

    c. _4years

    d. salranges

    e. dollar'
  merge: -1
  pgno: 589
- img_proc: true
  md: '# The FORMAT Procedure


    Range(s) can be


    +   - single values

    - ranges of values

    - lists of values.


    Labels


    +   - can be up to 32,767 characters in length

    - are typically enclosed in quotation marks, although it is not required.


    # Character User-Defined Format


    | character | discrete |

    | :--- | :--- |

    | format name | character values |

    | proc format; value $ctryfmt; | ''AU'' = ''Australia'' |

    | ''US'' = ''United States'' |

    | other = ''Miscoded''; | |

    | keyword | labels |


    The OTHER keyword matches all values that do not match any other value or range.'
