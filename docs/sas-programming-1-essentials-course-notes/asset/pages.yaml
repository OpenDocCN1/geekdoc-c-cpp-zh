  md: '# The SAS/ACCESS LIBNAME Statement


    The SAS/ACCESS LIBNAME statement assigns a library reference name (libref) to
    a relational database.


    General form of the SAS/ACCESS LIBNAME statement:


    ```

    LIBNAME libref engine-name <SAS/ACCESS-options>;

    ```


    After a database is associated with a libref, you can use a SAS two-level name
    to specify any table in the database and then work with the table as you would
    with a SAS data set.


    ![](img/1698e3a97543d6895ff5297aae8fd042_137_0.png)


    The engine-name such as Oracle or DB2 is the SAS/ACCESS component that reads from
    and writes to your DBMS. The engine name is required. Because the SAS/ACCESS LIBNAME
    statement associates a libref with a SAS/ACCESS engine that supports connections
    to a particular DBMS, it requires a DBMS-specific engine name.'
  merge: -1
  pgno: 137
- img_proc: true
  md: '# 4.3 Accessing Relational Databases (Self-Study)


    # Oracle Example


    This example uses the LIBNAME statement as supported in the SAS/ACCESS interface
    to Oracle.


    ![](img/1698e3a97543d6895ff5297aae8fd042_138_0.png)


    USER= specifies an optional Oracle user name. If the user name contains blanks
    or natural characters, enclose it in quotation marks. USER= must be used with
    PASSWORD=.


    PASSWORD= or PW= specifies an optional Oracle password that is associated with
    the Oracle user name.


    PATH= specifies the Oracle driver, node, and database. SAS/ACCESS uses the same
    Oracle path designation that you use to connect to Oracle directly. See your database
    administrator to determine the databases that are set up in your operating environment,
    and to determine the default values if you do not specify a database.


    SCHEMA= enables you to read database objects, such as tables and views, in the
    specified schema. If this option is omitted, you connect to the default schema
    for your DBMS. The values for SCHEMA= are usually case sensitive, so use care
    when you specify this option.'
  merge: -1
