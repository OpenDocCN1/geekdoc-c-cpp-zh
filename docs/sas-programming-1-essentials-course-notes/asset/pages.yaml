  md: '# 9.08 Quiz


    Could you write only an IF statement?

    * Yes

    * No


    ```

    data work.december;

    set orion.sales;

    where Country=''AU'';nBonusMonth=month(Hire_Date);

    if BonusMonth=12

    Bonus=500;

    Compensation work.december;

