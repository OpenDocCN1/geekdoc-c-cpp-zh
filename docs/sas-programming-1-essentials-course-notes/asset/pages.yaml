  md: '# 2.1 Introduction to SAS Programs


    # Objectives


    +   - List the components of a SAS program.

    - State the modes in which you can run a SAS program.


    # SAS Programs


    A SAS program is a sequence of steps that the user submits for execution.


    DATA steps are typically used to create SAS data sets.


    ![](img/1698e3a97543d6895ff5297aae8fd042_28_0.png)


    PROC steps are typically used to process SAS data sets (that is, generate reports
    and graphs, manage data, and sort data).'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# 2.01 Quiz


    How many steps are in this program?


    ```

    data work.NewSalesEmps;

    length First Name $ 12

    Last_Name $ 18 Job Title $ 25;

    infile ''newsemps.csv'' dlm=T'';

    input First Name $ Last Name $

    Job_ Title $ Salary;

    run;

    proc print data=work.NewSalesEmps;

    run;

