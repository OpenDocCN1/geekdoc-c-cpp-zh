  md: "# TABLES Statement OUT= Option (Self-Study)\n\nOptions can be added to the\
    \ TABLES statement after the forward slash to control the additional statistics\
    \ added to the output data set.\n\n| Option | Description |\n| --- | --- |\n|\
    \ OUTCUM | includes the cumulative frequency and cumulative percentage in the\
    \ output data set for one-way tables. |\n| OUTPCT | includes the percentage of\
    \ column frequency and row frequency in the output data set for n-way frequency\
    \ tables. |\n\n# TABLES Statement OUT= Option (Self-Study)\n\n```\nproc freq data=orion.sales\
    \ noprint;\n  tables Gender Country / out=work.freq3\n  outcum;\nrun;\nproc print\
    \ data=work.freq3;\nrun;\n```\n\n# PROC PRINT Output\n\n| Obs | Country | COUNT\
    \ | PERCENT | CUM_FREQ | CUM_PCT |\n| --- | --- | --- | --- | --- | --- |\n| 1\
    \ | AU | 63 | 38.182 | 63 | 38.182 |\n| 2 | US | 102 | 61.818 | 165 | 100.000\
    \ |"
  merge: -1
