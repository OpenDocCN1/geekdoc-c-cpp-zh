    # DROP= and KEEP: Options (Self-Study)


    Alternatives to the DROP and KEEP statements are the DROP= and KEEP data set options
    placed in the DATA statement.


    +   - The DROP data set option in the DATA statement excludes the variables for
    writing to the output set.


    ```

    DATA output-SAS-data-set (DROP = variable-list);

    ```


    +   - The KEEP data set option in the DATA statement specifies the variables for
    writing to the output set.


    ```

    DATA output-SAS-data-set (KEEP = variable-list);

    ```


    When specified for a data set named in the DATA statement, the DROP= and KEEP
    data set options are similar to DROP and KEEP statements. However, the DROP= and
    KEEP data set options can be used in situations where the DROP and KEEP statements
    cannot. For example, the DROP= and KEEP= data set options can be used in a PROC
    step to control which variables are available for processing by the procedure.'
  merge: -1
  pgno: 405
