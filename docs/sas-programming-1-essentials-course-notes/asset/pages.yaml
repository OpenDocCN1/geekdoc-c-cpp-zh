- img_proc: true
  md: "# 12.3 Using the TABULATE Procedure (Self-Study)\n\n![](img/1698e3a97543d6895ff5297aae8fd042_711_0.png)\n\
    \n# The TABULATE Procedure\n\nThe TABULATE procedure displays descriptive statistics\
    \ in tabular format.\nGeneral form of the TABULATE procedure:\n\n```\nPROC TABULATE\
    \ DATA=SAS-data-set <options>;n  CLASS classification-variable(s);\n  VAR analysis-variable(s);\n\
    \  TABLE page-expression,\n       row-expression,\n       column-expression </\
    \ option(s)>;\n\nRUN;\n```\n\nThe TABULATE procedure computes many of the same\
    \ statistics that are computed by other statistical procedures such as PROC MEANS\
    \ and PROC FREQ.\n\nA CLASS statement or a VAR statement must be specified, but\
    \ both statements together are not required."
  merge: -1
  pgno: 711
