  md: '# Solutions to Chapter Review


    Chapter Review Answers

    1. What statistics are produced by default by PROC FREQ?

    * Frequency

    * Percent

    * Cumulative Frequency

    * Cumulative Percent

    2. How can you produce a two-way frequency table using PROC FREQ?

    By using an asterisk between two variables in a TABLES statement, you can produce
    a two-way frequency table in PROC FREQ.

    Example: `tables Gender*Country;`

    continued...


    Chapter Review Answers

    3. What is the purpose of the VAR statement in PROC MEANS?

    The VAR statement identifies the analysis variables and their order in the PROC
    MEANS results.

    4. What is the purpose of the CLASS statement in PROC MEANS?

    The CLASS statement identifies variables whose values define subgroups for the
    PROC MEANS analysis.

    continued...'
  merge: -1
  pgno: 743
- img_proc: true
  md: '# Chapter Review Answers


    +   5. How can you change which statistics are displayed in PROC MEANS output?


    The statistics to compute and the order to display them can be specified as statistical
    keywords in the PROC MEANS statement.


    Example:


    ```

    proc means data=orion.sales sum mean;

    ```'
