  md: '# The DATA statement


    The DATA statement begins a DATA step and provides the name of the SAS data set
    being created.


    ```

    LIBNAME libref ''SAS-data-library'';


    DATA output-SAS-data-set;

    SET input-SAS-data-set;

    <additional SAS statements>

    RUN;

    ```


    The DATA statement can create temporary or permanent data sets.


    # The SET Statement


    The SET statement reads observations from a SAS data set for further processing
    in the DATA step.


    ```

    LIBNAME libref ''SAS-data-library'';


    DATA output-SAS-data-set;

    SET input-SAS-data-set;

    <additional SAS statements>

    RUN;

    ```


    +   - By default, the SET statement reads all observations and all variables from
    the input data set.


    +   - The SET statement can read temporary or permanent data sets.'
