  md: "# 13.3 Creating Plots\n\n# Producing Plots with the GPLOT Procedure\n\nYou\
    \ can use the GPLOT procedure to plot one variable against another within a set\
    \ of coordinate axes.\n\nGeneral form of a PROC GPLOT step:\n\n```\nPROC GPLOT\
    \ DATA=SAS-data-set;\n  PLOT vertical-variable*horizontal-variable </options>;\n\
    RUN;\nQUIT;\n```"
  merge: -1
