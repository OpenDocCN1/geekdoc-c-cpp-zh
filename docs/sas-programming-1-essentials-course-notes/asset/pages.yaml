    OUT=<libref>SAS-data-set identifies the output SAS data set.


    DATAFILE="filename" specifies the complete path and filename or a fileref for
    the input PC file, spreadsheet, or delimited external file.


    DBMS=identifier specifies the type of data to import. To import a DBMS table,
    you must specify DBMS= using a valid database identifier. For example, DBMS=EXCEL
    specifies to import a Microsoft Excel worksheet.


    REPLACE overwrites an existing SAS data set. If you do not specify REPLACE, PROC
    IMPORT does not overwrite an existing data set.


    RANGE="range-name | absolute-range" subsets a spreadsheet by identifying the rectangular
    set of cells to import from the specified spreadsheet.


    GETNAMES=YES | NO for spreadsheets and delimited external files, determines whether
    to generate SAS variable names from the column names in the input file''s first
    row of data. Note that if a column name contains special characters that are not
    valid in a SAS name, blank SAS converts the character to an underscore.'
