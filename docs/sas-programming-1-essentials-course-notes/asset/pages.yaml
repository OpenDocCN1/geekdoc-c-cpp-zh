  md: '# # Three Primary Windows


    In the SAS windowing environment, you submit and view the results of a SAS program
    using three primary windows.


    | Editor - Untitled | contains the SAS program to submit. |

    | Program Editor - (Untitled) | |

    | Log - (Untitled) | contains information about the processing of the SAS program,
    including any warning and error messages. |

    | Output - (Untitled) | contains reports generated by the SAS program. |


    # # Editor Windows


    | Enhanced Editor | Program Editor |

    | Editor - (Untitled) | Program Editor - (Untitled) |

    | Only available in the Windows operating environment | Available in all operating
    environments |

    | Default editor for Windows operating environment | Default editor for all operating
    environments except Windows |

    | Multiple instances of the editor can be open at one time | Only one instance
    of the editor can be open at one time |

    | Code does not disappear after it is submitted | Code disappears after it is
    submitted |

    | Incorporates color-coding as you type | Incorporates color-coding after you
    press ENTER'
