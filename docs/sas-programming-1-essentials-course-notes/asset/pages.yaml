    # LIKE Operator


    The LIKE operator selects observations by comparing character values to specified
    patterns.


    There are two special characters available for specifying a pattern:


    +   - A percent sign (%) replaces any number of characters.

    - An underscore (_) replaces one character.


    Consecutive underscores can be specified.

    A percent sign and an underscore can be specified in the same pattern.

    The operator is case sensitive.'
  merge: -1
  pgno: 169
- img_proc: true
  md: '# 5.3 Subsetting Observations and Variables


    # LIKE Operator


    Examples:


    ```

    where Name like ''%N'';

    ```


    This WHERE statement selects observations that begin with any number of characters
    and end with an N.


    ```

    where Name like ''T M%'';

    ```


    This WHERE statement selects observations that begin with a single character,
    followed by an M, followed by any number of characters.


    Starting in SAS 9.2, the LIKE operator supports an escape character, which enables
    you to search for the percent sign (%) and the underscore (_) in values.


    An escape character is a single character that in a sequence of characters signifies
    what is to follow takes an alternative meaning. For the LIKE operator, an escape
    character signifies to search for literal instances of the % and _ characters
    in the variable''s values instead of performing the special-character function.


    To specify an escape character, include the character in the pattern-matching
    expression and then the keyword ESCAPE followed by the escape character expression.
    When you use an escape character, the pattern-matching expression must be enclosed
    in quotation marks and it cannot contain a column name. The escape character expression
    is an expression that evaluates to a single character. The operands may be character
    or string literals. If it is a single character, it must be enclosed in quotation
    marks.


    For example, if the variable x contains the values a, b and axb, the following
    LIKE operator using an escape character selects only the value a b. The escape
    character (/) specifies the pattern search for a '' '' instead of matching any
    character:


    Without an escape character, the following LIKE operator would select the values
    a b and axb. The special underscore in the search pattern matches any single character,
    including the value with the underscore:


    ```

    where x like ''a b'';

    ```'
  merge: -1
