  md: "# Eliminating Duplicates with the SORT Procedure (Self-Study)\n\nThe SORT procedure\
    \ can be used to eliminate duplicate observations.\n\nPROC SORT Statement Options:\n\
    \n+   - The NODUPKEY option deletes observations with duplicate BY values.\n-\
    \ The EQUALS option maintains the relative order of the observations within the\
    \ input data set in the output data set for observations with identical BY values.\n\
    \n# Eliminating Duplicates with the SORT Procedure (Self-Study)\n\n```\nproc sort\
    \ data=EmpsDUP\n  out=EmpsDUP1 nodupkey equals;\n  by EmpID;\nrun;\n```\n\n| EmpsDUP\
