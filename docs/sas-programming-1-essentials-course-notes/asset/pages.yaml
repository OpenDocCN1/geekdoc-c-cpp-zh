  md: "# 8. Defining Ranges in User-Defined Formats\n\na. Retrieve the starter program.\n\
    \nb. Create a character format.\n\n```\nproc format;\nvalue $gender\n  'F'='Female'\n\
    \  'M'='Male'\n  other='Invalid code';\nrun;\n```\n\nc. Create a numeric format.\n\
    \n```\nproc format;\nvalue $gender\n  'F'='Female'\n  'M'='Male'\n  other='Invalid\
    \ code';\nvalue salrange\n  ='Missing salary'\n  20000-<100000='Below $100,000'\n\
    \  100000-500000='$100,000 or more'\n  other='Invalid salary';\nrun;\n```\n\n\
    d. In the PROC PRINT step, apply these two user-defined formats.\n\n```\nproc\
    \ print data=orion.nonsales\nvar Employee_ID Job Title Salary Gender\nformat Salary\
    \ salrange Gender $gender;\ntitle1 'Distribution of Salary and Gender Values';\n\
    title2 'For Non-Sales Employees';\nrun;\n```\n\ne. Submit the program.\n\n# 9.\
    \ Creating a Nested Format Definition\n\na. Retrieve the starter program.\n\n\
