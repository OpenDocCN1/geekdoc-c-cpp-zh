- img_proc: true
  md: '# Browsing a SAS Data Library


    ![](img/1698e3a97543d6895ff5297aae8fd042_123_0.png)


    The SAS Explorer enables you to manage your files in the windowing environment.


    In the SAS Explorer, you can do the following:


    +   - view a list of all the libraries available during your current SAS session

    - navigate to see all members of a specific library

    - display the descriptor portion of a SAS data set


    The SAS windowing environment opens the SAS Explorer by default on many hosts.
    You can issue the SAS EXPLORER command to invoke this window if it does not appear
    by default.


    The SAS Explorer can be opened by selecting


    +   - View Contents Only


    or


    +   - View Explorer


    In the Contents Only view, the SAS Explorer is a single-paned window that contains
    the contents of your SAS environment. As you open folders, the folder contents
    replace the previous contents in the same window.


    In the Explorer view of the SAS Explorer window, folders appear in the tree view
    on the left and folder contents appear in the list view on the right.'
  merge: -1
  pgno: 123
- img_proc: true
  md: "# Browsing a SAS Data Library\n\nThe CONTENTS procedure with the _ALL_ keyword\
    \ produces a list of all the SAS files in the data library.\n\n```\nPROC CONTENTS\
    \ DATA=libref_ _ALL_ NODS;\n   RUN;\n```\n\n+   - The NODS option suppresses the\
    \ descriptor portions of the data sets.\n- NODS is only used in conjunction with\
    \ the keyword _ALL_.\n\nIf you are using a noninteractive or batch SAS session,\
    \ the CONTENTS procedure is an alternative to the EXPLORER command."
  merge: -1
  pgno: 124
