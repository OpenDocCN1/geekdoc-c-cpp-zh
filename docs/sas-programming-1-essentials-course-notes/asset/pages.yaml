- img_proc: true
  md: 'MIXED=YES | NO


    converts numeric data values into character data values for a column that contains
    mixed data types. The default is NO, which means that numeric data will be imported
    as missing values in a character column. If MIXED=YES, then the engine will assign
    a SAS character type for the column and convert all numeric data values to character
    data values.


    SCANTEXT=YES | NO


    scans the length of text data for a data source column and uses the longest string
    data that is found as the SAS column width.


    USEDATE=YES | NO


    specifies which format to use. If USEDATE=YES, then the DATE format is used for
    date/time columns in the data source table while importing data from Excel workbook.
    If USEDATE=NO, then a DATETIME format is used for date/time.


    SCANTIME=YES | NO


    scans all row values for a DATETIME data type field and automatically determines
    the TIME data type if only time values (that is, no date or datetime values) exist
    in the column.


