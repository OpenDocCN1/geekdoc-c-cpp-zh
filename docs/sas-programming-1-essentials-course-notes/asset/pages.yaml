- img_proc: true
  md: "# Numeric User-Defined Formats\n\nThe less than (<) symbol excludes values\
    \ from ranges.\n\n+   - Put after the value if you want to exclude the first value\
    \ in a range.\n- Put before the value if you want to exclude the last value in\
    \ a range.\n\n| 50000 - 100000 | Includes 50000 | Includes 100000 |\n| 50000 <\
    \ 100000 | Includes 50000 | Excludes 100000 |\n| 50000 < 100000 | Excludes 50000\
    \ | Includes 100000 |\n| 50000 < 100000 | Excludes 50000 | Excludes 100000 |\n\
    \n# 11.07 Quiz\n\nIf you have a value of 100000, how will it be displayed if the\
    \ TIERS format is applied to the value?\n\n+   a. Tier 2\nb. Tier 3\nc. 100000\n\
    d. a missing value\n\n```\nproc format;\n  value tiers 20000-<50000 = 'Tier 1'\n\
    \               50000- 100000 = 'Tier 2'\n               100000-<250000 = 'Tier\
    \ 3';\nrun;\n```"
  merge: -1
