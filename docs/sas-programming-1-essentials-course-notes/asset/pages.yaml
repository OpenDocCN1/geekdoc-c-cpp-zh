  md: '# 9.2 Creating Variables Conditionally


    > ### Objectives

    * Execute statements conditionally by using IF-THEN and IF-THEN DO statements.

    * Give alternate actions if the previous THEN clause is not executed by using
    the ELSE statement.

    * Control the length of character variables by using the LENGTH statement.


    ### Business Scenario

    A new SAS data set named Work.bonus needs to be created by reading the orion.sales
    data set.


    Work.bonus must include a new variable named Bonus that is equal to

    * 500 for United States employees

    * 300 for Australian employees.'
  merge: -1
  pgno: 411
- img_proc: true
  md: '# IF-THEN Statements (Review)


    The IF-THEN statement executes a SAS statement for observations that meet specific
    conditions. General form of the IF-THEN statement.


    ```

    IF expression THEN statement;

    ```


    +   - expression is a sequence of operands and operators that form a set of instructions
    that define a condition for selecting observations.

    - statement is any executable statement such as the assignment statement.


    If the condition in the IF clause is met, the IF-THEN statement executes a SAS
    statement for that observation.


    # IF-THEN/ELSE Statements (Review)


    The optional ELSE statement gives an alternate action if the previous THEN clause
    is not executed. General form of the IF-THEN/ELSE statements:


    ```

    IF expression THEN statement;

    ELSE IF expression THEN statement;

    ```


    +   - Using IF-THEN statements without the ELSE statement causes SAS to evaluate
    all IF-THEN statements.

    - Using IF-THEN statements with the ELSE statement causes SAS to execute IF-THEN
    statements until it encounters the first true statement.


    Conditional logic can include one or more ELSE IF statements.


    For greater efficiency, construct your IF-THEN/ELSE statements with conditions
    of decreasing probability.'
  merge: -1
  pgno: 412
