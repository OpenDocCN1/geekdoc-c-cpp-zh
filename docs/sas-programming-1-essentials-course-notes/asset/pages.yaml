  md: '4.1 Examining Descriptor and Data Portions


    # SAS Data Set and Variable Names


    SAS names have these characteristics:


    +   - can be 32 characters long.

    - must start with a letter or underscore. Subsequent characters can be letters,
    underscores, or numerals.

    - can be uppercase, lowercase, or mixed case.

    - are not case sensitive.


    Special characters can be used in variable names if you put the name in quotation
    marks followed immediately by the letter N.


    ```

    Example: class ''Flight#'';

    ```


    In order to use special characters in variable names, the VALIDVARNAME option
    must be set to ANY.


    ```

    Example: options validvarname=any;

    ```


    # 4.04 Multiple Answer Poll


    Which variable names are valid?


    +   a. data5mon yes

    b. 5monthsdata no

    c. data#5 no

    d. five months data no

    e. five_months_data yes

    f. FiveMonthsData yes'
