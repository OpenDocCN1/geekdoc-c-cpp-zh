- img_proc: true
  md: '# 4.02 Multiple Choice Poll


    Which variable type do you think SAS uses to store date values?


    +   a. character

    b. numeric


    # SAS Date Values


    SAS stores date values as numeric values.


    ![](img/1698e3a97543d6895ff5297aae8fd042_108_0.png)


    A SAS date value is stored as the number of days between January 1, 1960, and
    a specific date.


    SAS can perform calculations on dates starting from 1582 A.D.


    SAS can read either two- or four-digit year values. If SAS encounters a two-digit
    year, the

    YEARCUTTOFF= system option is used to specify which 100-year span the the two-digit
    year

    should be attributed. For example, by setting the option YEARCUTTOFF= option to
    1950, the

    100-year span from 1950 to 2049 is used for two-digit year values.'
  merge: -1
  pgno: 108
