  md: '# Data Errors


    During the processing of every DATA step, SAS automatically creates the following
    temporary variables:


    +   - the _N_variable, which counts the number of times the DATA step begins to
    iterate


    +   - the ERROR_ variable, which signals the occurrence of an error caused by
    the data during execution

