    | Satyakam | Denny | Sales Rep. II | 26780 | |

    | Monica | Kletschuk | Sales Rep. IV | 30890 | Variable |

    | Kevin | Lyon | Sales Rep. I | 26955 | values |

    | Petrea | Soltau | Sales Rep. II | 27440 | |


    The data values are organized as a table of observations (rows) and variables
    (columns).


    Variable names are part of the descriptor portion, not the data portion.


    # SAS Variable Values


    There are two types of variables:


    | character | Contain any value: letters, numbers, special characters, and blanks.
    Character values are stored with a length of 1 to 32,767 bytes. One byte equals
    one character. |

    | numeric | Stored as floating point numbers in 8 bytes of storage by default.
    Eight bytes of floating point storage provide space for 16 or 17 significant digits.
    You are not restricted to 8 digits |'
