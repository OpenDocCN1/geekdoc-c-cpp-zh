    # Import/Export Wizards and Procedures


    The Import/Export Wizards and IMPORT/EXPORT procedures enable you to read and
    write data between SAS data sets and external PC files.


    The Import/Export Wizards and procedures are part of Base SAS and enable access
    to delimited files. If you have a license to SAS/ACCESS Interface to PC File Formats,
