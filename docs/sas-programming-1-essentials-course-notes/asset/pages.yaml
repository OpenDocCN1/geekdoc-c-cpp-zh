  md: '# Solutions to Chapter Review


    Chapter Review Answers

    1. What procedures can be used to detect invalid data?

    * PRINT

    * FREQ

    * MEANS

    * UNIVARIATE


    Chapter Review Answers

    2. What happens when SAS encounters a data error?

    * A note that describes the error is printed in the SAS log.

    * The input record (contents of the input buffer) being created are displayed
    in the SAS log.

    * The values in the SAS observation (contents of the PDV) being created are displayed
    in the SAS log.

    * A missing value is assigned to the appropriate SAS variable.

    * Execution continues.'
