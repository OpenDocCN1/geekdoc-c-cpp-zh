  md: '# The LIBNAME Statement (Review)


    The LIBNAME statement assigns a library reference name (libref) to a SAS data
    library.


    General form of the LIBNAME statement:


    ```

    LIBNAME libref ''SAS-data-library'' <options>;

    ```


    Example:


    ![](img/1698e3a97543d6895ff5297aae8fd042_209_0.png)


    The LIBNAME statement needs to reference a SAS data library specific to your operating
    environment.'
  merge: -1
  pgno: 209
- img_proc: true
  md: '# The SAS/ACCESS LIBNAME Statement


    The SAS/ACCESS LIBNAME statement extends the LIBNAME to support assigning a library
    reference name (libref) to Microsoft Excel notebooks.


    General form of the SAS/ACCESS LIBNAME statement:


    ```

    LIBNAME libref ''physical-file-name'' <options>;

    ```


    This enables you to reference worksheets directly in a DATA step or SAS procedure,
    and to read from and write to a Microsoft Excel worksheet as though it were a
    SAS data set.


    SAS/ACCESS options can be used in the LIBNAME statement.


    For example,


    MIXED=YES | NO


    > specifies whether to convert numeric data values into character data values
    for a column with mixed data types.


    > The default is NO, which means that numeric data will be imported as missing
    values in a character column. If MIXED=YES, the engine assigns a SAS character
    type for the column and converts all numeric data values to character data.


    The following Technical Support Usage Note addresses column data that is imported
    as missing:


    http://support.sas.com/kb/6/123.html'
  merge: -1
  pgno: 210
- img_proc: true
  md: '# SAS/ACCESS LIBNAME Statement


    SAS/ACCESS Interface to PC File Formats is required in order to use the SAS/ACCESS
    LIBNAME statement to access Excel workbooks.


    Example:


    ```

    libname orionxls ''s:\workshop\sales.xls'';

    ```


    ![](img/1698e3a97543d6895ff5297aae8fd042_211_0.png)


    SAS/ACCESS Interface to PC File Formats enables you to read data from PC files,
    to use that data in SAS reports or applications, and to use SAS data sets to create
    PC files in various formats.


    SAS/ACCESS Interface to PC File Formats gives access to Microsoft Excel, Microsoft
    Access, dBase, JMP, Lotus 1-2-3, SPSS, Stata, and Paradox.


    To determine if you have a license for SAS/ACCESS Interface to PC File Formats,
    submit the following step:


    ```

    proc setinit;

    ```


    After submitting, look in the SAS log for the products that are licensed for your
    site.


    SAS/ACCESS Interface to PC File Formats on Linux and UNIX enables access to PC
    files from the Linux and UNIX operating environments. A PC Files Server is used
    to access the PC data. The PC Files Server runs on a Microsoft Windows server,
    and SAS/ACCESS Interface to PC Formats runs on a Linux or UNIX client server.'
  merge: -1
  pgno: 211
