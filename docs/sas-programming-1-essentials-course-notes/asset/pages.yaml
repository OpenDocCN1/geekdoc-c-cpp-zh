  md: '# SAS Publishing


    SAS offers a complete selection of publications to help customers use SAS software
    to its fullest potential:


    +   * Multiple delivery methods: e-books, CD-ROM, and hard-copy books

    * Wide spectrum of topics

    * Partnerships with outside authors, other publishers, and distributors


    ![](img/1698e3a97543d6895ff5297aae8fd042_777_0.png)


    http://support.sas.com/publishing/


    # SAS Global Certification Program


    SAS offers several globally recognized certifications.


