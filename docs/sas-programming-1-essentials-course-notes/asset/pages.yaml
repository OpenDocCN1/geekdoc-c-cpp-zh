- img_proc: true
  md: "# OUTPUT Statement OUT= Option (Self-Study)\n\nIn order to specify that the\
    \ output data set contain a particular statistic, you must have PROC FREQ compute\
    \ the statistic by using the corresponding option in the TABLES statement.\n\n\
    ```\nproc freq data=orion.sales;\ntables Country / chisq;\noutput out=work.freq5\
    \ chisq;\nrun;\n\nproc print data=work.freq5;\nrun;\n```\n\nCHISQ requests chi-square\
    \ tests and measures of association based on chi-square.\n\n![](img/1698e3a97543d6895ff5297aae8fd042_683_0.png)\n\
    \n# OUTPUT Statement OUT= Option (Self-Study)\n\nPROC FREQ Output\n\n  The FREQ\
    \ Procedure\n\n| Country | Frequency | Percent | Cumulative Frequency | Cumulative\
    \ Percent |\n| --- | --- | --- | --- | --- |\n| AU | 63 | 38.18 | 63 | 38.18 |\n\
    | US | 102 | 61.82 | 165 | 100.00 |\n\n| Chi-Square Test for Equal Proportions\
    \ |\n| --- | --- |\n| Chi-Square | 9.2182 |\n| DF | 1 |\n| Pr > ChiSq | 0.0024\
    \ |\n| Sample Size = 165 |\n\n![](img/1698e3a97543d6895ff5297aae8fd042_683_1.png)"
