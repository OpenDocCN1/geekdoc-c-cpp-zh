  md: '# # 10.1 Introduction to Combining Data Sets


    # ## Objectives


    +   - Define the methods for combining SAS data sets.


    # ## Appending and Concatenating


    Appending and concatenating involves combining SAS data sets, one after the other,
    into a single SAS data set.


    | SAS Data Set |

    | --- |

    | + |

    | SAS Data Set |


    +   - **Appending** adds the observations in the second data set directly to the
    end of the original data set.

    - **Concatenating** copies all observations from the first data set and then copies
    observations from one or more successive data sets into a new data set.'
