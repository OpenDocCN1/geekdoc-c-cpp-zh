- img_proc: true
  md: '# Creating Plots


    p113d02


    +   1. Submit the first PROC GPLOT step to create a simple scatter plot.


    The PROC GPLOT creates a plot displaying the values of the variable Yr2007 on
    the vertical axis and Month on the horizontal axis. The points are displayed using
    the default plotting symbol (a plus sign).


    A FORMAT statement assigns the DOLLAR12. format to Yr2007.


    ```

    options reset=all;

    proc gplot data=orion.budget;

    plot Yr2007*Month;

    format Yr2007 dollar12;

    title ''Plot of Budget by Month'';

    run;

    quit;

    ```


    # Plot of Budget by Month


    ![](img/1698e3a97543d6895ff5297aae8fd042_767_0.png)'
  merge: -1
  pgno: 767
- img_proc: true
  md: "# 13.3 Creating Plots 13-23\n\n2. Submit the second PROC GPLOT step to specify\
    \ plot symbols and interpolation lines.\n\nThe SYMBOL statement specifies an alternate\
    \ plotting symbol and draws an interpolation line joining the plot points. The\
    \ options in the SYMBOL statement are as follows:\n\n+   - V= specifies the plotting\
    \ symbol (a dot).\n- I= specifies the interpolation method to be used to connect\
    \ the points (join).\n- CV= specifies the color of the plotting symbol.\n\n- CI=\
    \ specifies the color of the interpolation line.\nThe LABEL statement assigns\
    \ a label to the variable Yr2007.\n\n```\ngoptions reset=all;\nproc gplot data=orion.budget;\n\
    \  plot Yr2007*Month / haxis=1 to 12;\n  label Yr2007='Budget';\n  format Yr2007\
    \ dollar12.\n  title 'Plot of Budget by Month';\n  symbol v=dot i=join cv=red\
    \ ci=blue;\nrun;\nquit;\n```\n\n# Plot of Budget by Month\n\n![](img/1698e3a97543d6895ff5297aae8fd042_768_0.png)"
  merge: -1
  pgno: 768
- img_proc: true
  md: '# Chapter 13 Introduction to Graphics Using SAS/GRAPH (Self-Study)


    3. Submit the third PROC GPLOT step to overlay multiple plot lines on the same
    set of axes.


    The PLOT statement specifies two separate plot requests (Yr2006*Month and Yr2007*Month),
    which results in an overlay plot with the variables Yr2006 and Yr2007 on the vertical
    axis and Month on the horizontal axis.


    The options in the OVERLAY statement are as follows:


    +   - The OVERLAY option causes both plot requests to be displayed on the same
    set of axes.

    - The HAXIS= option specifies the range of values for the horizontal axis. (The
    VAXIS= option can be used to specify the range for the vertical axis).

    - The VREF= option specifies a value on the vertical axis where a reference line
    should be drawn.

    - The CFRAM= option specifies a color to be used for the background within the
    plot axes.


    ```

    options reset=all;

    proc gplot data=orion.budget;

    plot Yr2006*Month yr2007*Month/ overlay haxis=1 to 12

    vref=3000000

    cframe="very light gray";

    label Yr2006 dollar12.;

    format Yr2006 dollar12.;

    title ''Plot of Budget by Month for 2006 and 2007'';

    symbol1 i=join v-dot ci=blue cv=blue;

    symbol2 i=join v-triangle ci=red cv=red;

    run;

    quit;

    ```


