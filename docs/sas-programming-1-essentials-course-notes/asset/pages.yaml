- img_proc: true
  md: '# 12.5 Solutions


    Solutions to Exercises


    +   1. Counting Levels of a Variable with PROC FREQ


    +   a. Retrieve the starter program.


    +   b. Modify the program to produce two separate reports.


    ```

    proc freq data=orion.orders nlevels;

    where Order_Type=1;

    tables Customer ID Employee ID / noprint;

    title ''Unique Customers and Salespersons for Retail Sales'';

    run;

    proc freq data=orion.orders nlevels;

    where Order_Type=ne 1;

    tables Customer ID / noprint;

    title ''Unique Customers for Catalog and Internet Sales'';

    run;

    ```


    +   c. Submit the program.


    +   2. Producing Frequency Reports with PROC FREQ


    +   a. Retrieve the starter program.


    +   b. Add TABLES statements to the PROC FREQ step.


    ```

    proc format;

    value ordertypes

    1=''Retail''

    2=''Catalog''

    3=''Internet'';

    run;

    proc freq data=orion.orders ;

    tables Order_Date;

    tables Order_Type / nocum;

    tables Order_Date*Order_Type / nopocent norow nicol;

    format Order_Date year4. Order_Type ordertypes;

    title ''Order Summary by Year and Type'';

    run;

    ```


    +   c. Submit the program.'
  merge: -1
  pgno: 731
- img_proc: true
  md: '# 3. Displaying PROC FREQ Output in Descending Frequency Order


    +   a. Retrieve the starter program.


    +   b. Submit the program.


    +   c. What are the two most common values for each variable?


    The top two countries are US (United States, 28 customers) and CA (Canada, 15
    customers).


    The top two customer types are Orion Club members medium activity (20) and Orion
    Club members low activity (17).


    The top customer age groups are 31–45 years (27) and 15–30 years (22).


    +   d. Modify the program to display the frequency counts in descending order.


    ```

    proc freq data=orion.customer_dim order=freq;

    tables Customer_Country Customer_Type Customer_Age_Group;

    title ''Customer Demographics'';ntitle3 ''Top two levels for each variable)?''

    run;

    ```


    +   e. Submit the modified program.


    +   f. What are the two most common values for each variable?


    The top two countries are US (United States, 28 customers) and CA (Canada, 15
    customers).


    The top two customer types are Orion Club members medium activity (20) and Orion
    Club members low activity (17).


    The top customer age groups are 31–45 years (27) and 15–30 years (22).


    Which report was easier to answer the questions correctly?


    The ORDER=FREQ option in the PROC FREQ statement sequences the frequency in descending
    count order. Because the levels that occur most often appear near the top of each
    report, the most common data values can be identified more easily.


    # 4. Creating an Output Data Set with PROC FREQ


    +   a. Retrieve the starter program.


    +   b. Create an output data set.


    ```

    proc freq data=orion.order_fact noprint;

    tables Product_ID / out=product_orders;

    run;

    ```


    +   c. Combine the output data set with orion.product_list.


    ```

    data product_names;

    merge product_orders orion.product_list;

    by Product_ID;

    keep Product_ID Product_Name Count;

    run;

    ```'
