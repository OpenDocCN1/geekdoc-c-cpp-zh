    # SAS/GRAPH Programs


    General form of a SAS/GRAPH program:


    ```

    GOPTIONS options;

    global statements

    graphics procedure steps

    ```


    For example:


    ```

    goptions cback=white;

    title ''Number of Employees by Job Title'';

    proc gchart data=orion.staff;

    vbar Job_Title;

    run;

    quit;

    ```'
