  md: '# The DATA Statement (Review)


    The DATA statement begins a DATA step and provides the name of the SAS data set
    being created.


    ```

    DATA output-SAS-data-set;

    INFILE ''raw-data-file-name'';

    INPUT specifications;

    <additional SAS statements>

    RUN;

    ```


    The DATA statement can create temporary or permanent data sets.


    # The INFILE Statement


    The INFILE statement identifies the physical name of the raw data file to read
    with an INPUT statement.


    ```

    DATA output-SAS-data-set;

    INFILE ''raw-data-file-name'';

    INPUT specifications;

    <additional SAS statements>

    RUN;

    ```


    The physical name is the name that the operating environment uses to access the
    file.'
  merge: -1
  pgno: 253
- img_proc: true
  md: '# The INFILE Statement


    Examples:


    | Windows | infile ''s:\workshop\sales.csv''; |

    | UNIX | infile ''/users/userid/sales.csv''; |

    | z/OS (OS/390) | infile ''.workshop.rawdata(sales)''; |


    ![](img/1698e3a97543d6895ff5297aae8fd042_254_0.png)


    # The INPUT statement


    The INPUT statement describes the arrangement of values in the raw data file and
    assigns input values to the corresponding SAS variables.


    ```

    DATA output-SAS-data-set;

    INFILE ''raw-data-file-name'';

    INPUT specifications:

    <additional SAS statements>

    RUN;

    ```


    The following are input specifications:


    +   - column input

    - formatted input

    - list input


    Column input enables you to read standard data values that are aligned in columns
    in the raw data file.


    Formatted input combines the flexibility of using informats with many of the features
    of column input. By using formatted input, you can read nonstandard data for which
    SAS requires additional instructions.


    List input uses a scanning method for locating data values. Data values are not
    required to be aligned in columns, but must be separated by at least one blank
    or other defined delimiter.'
