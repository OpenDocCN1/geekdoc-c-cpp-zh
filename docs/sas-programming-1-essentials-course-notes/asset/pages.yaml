  md: '13-12 Chapter 13 Introduction to Graphics Using SAS/GRAPH (Self-Study)


    3. Submit the third PROC GCHART step to suppress the display of statistics on
    the horizontal bar chart.


    The NOSTATS option in the HBAR3D statement suppresses the display of statistics
    on the chart.


    ```

    goptions reset=all;

    proc gchart data=orion.staff;

    hbar3d Job_Title / nostats;

    title ''Number of Employees by Job Title'';

    where Job_Title =''Sales Rep''

    run;

    quit;

