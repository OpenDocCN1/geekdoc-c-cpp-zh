  md: "# Outputting to Multiple Data Sets (Self-Study)\n\nThe DATA statement can specify\
    \ multiple output data sets.\n\n```\ndata EmpsAUC EmpsOnly PhoneOnly;\nmerge EmpsAU(in=Emps)\
    \ PhoneC(in=Cell);\nby EmpID;\nif Emps=1 and Cell=1\n    then output EmpsAUC;\n\
    \    else if Emps=1 and Cell=0\n    then output EmpsOnly;\n    else if Emps=0\
    \ and Cell=1\n    then output PhoneOnly;\nrun;\n```\n\n# Outputting to Multiple\
    \ Data Sets (Self-Study)\n\nAn OUTPUT statement can be used in a conditional statement\
    \ to write the current observation to a specific data set that is listed in the\
    \ DATA statement.\n\n```\ndata EmpsAUC EmpsOnly PhoneOnly;\nmerge EmpsAU(in=Emps)\
    \ PhoneC(in=Cell);\nby EmpID;\nif Emps=1 and Cell=1\n    then output EmpsAUC;\n\
    \    else if Emps=1 and Cell=0\n    then output EmpsOnly;\n    else if Emps=0\
    \ and Cell=1\n    then output PhoneOnly;\nrun;\n```"
  merge: -1
