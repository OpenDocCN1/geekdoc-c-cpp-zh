  md: '# Course Description


    This course is for users who want to learn how to write SAS programs. It is the
    entry point to learning SAS programming and is a prerequisite to many other SAS
    courses. If you do not plan to write SAS programs and you prefer a point-and-click
    interface, you should attend the SAS® Enterprise Guide® 1: Querying and Reporting
    course.


    # To learn more...


    ![](img/1698e3a97543d6895ff5297aae8fd042_11_0.png)


    For a full curriculum of general and statistical instructor-based training at
    any of the Institute''s training facilities. Institute instructors can also provide
    on-site training.


    For information on other courses in the curriculum, contact the SAS Education
    Division at 1-800-333-7660, or send e-mail to training@sas.com. You can also find
    this information on the Web at support.sas.com/training/ as well as in the Training
    Course Catalog.


    ![](img/1698e3a97543d6895ff5297aae8fd042_11_1.png)


    For a list of other SAS books that relate to the topics covered in this Course
    Notes, USA customers can contact our SAS Publishing Department at 1-800-727-3228
    or send e-mail to sasbook@sas.com. Customers outside the USA, please contact your
    local SAS office.


    Also, see the Publications Catalog on the Web at support.sas.com/pubs for a complete
    list of books and a convenient order form.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Prerequisites


    Before attending this course, you should have experience using computer software.
    Specifically, you should be able to


    +   - understand file structures and system commands on your operating systems

    - access data files on your operating systems.


    No prior SAS experience is needed. If you do not feel comfortable with the prerequisites
    or are new to programming and think that the pace of this course might be too
    demanding, you can take the Introduction to Programming Concepts Using SAS® Software
    before attending this course. Introduction to Programming Concepts Using SAS®
    Software is designed to introduce you to computer programming and presents a portion
    of the SAS® Programming 1: Essentials material at a slower pace.'
  merge: -1
