  md: '# 9.1 Creating Variables


    +   ### Objectives

    - Create SAS variables with the assignment statement in the DATA step.

    - Create SAS values by using operators including SAS functions.

    - Subset variables using the DROP and KEEP statements.

    - Examine the compilation and execution phases of the DATA step when you read
    a SAS data set.

    - Subset variables using the DROP= and KEEP options. (Self-Study)


    ## Business Scenario

    A new SAS data set named **Work.comp** needs to be created by reading the **orion.sales**
    data set. **Work.comp** must include the following new variables:


    +   - **Bonus**, which is equal to a constant 500

    - **Compensation**, which is the combination of the employee''s salary and bonus

    - **BonusMonth**, which is equal to the month that the employee was hired


    **Work.comp** must not include the **Gender**, **Salary**, **Job_Title**, **Country**,
    **Birth_Date**, and **Hire_Date** variables from **orion.sales**.'
