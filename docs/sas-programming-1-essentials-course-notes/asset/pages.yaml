  md: '# The Assignment Statement


    The assignment statement evaluates an expression and assigns the resulting value
    to a variable.


    General form of the assignment statement:


    ```

    variable = expression;

    ```


    +   - variable names an existing or new variable.

    - expression is a sequence of operands and operators that form a set of instructions
    that produce a value.


    Assignment statements evaluate the expression on the right side of the equal sign
    and store the result in the variable that is specified on the left side of the
    equal sign.


    # The Assignment Statement Expression


    Operands are


    +   - character constants

    - numeric constants

    - date constants

    - character variables

    - numeric variables.


    Operators are


    +   - symbols that represent an arithmetic calculation

    - SAS functions.'
  merge: -1
  pgno: 354
- img_proc: true
  md: '# The Assignment Statement Expression


    Examples:


    ```

    Salary = 26960; <- numeric constant

    ```


    ```

    Gender = ''F''; <- character constant

    ```


    ```

    Hire Date = ''21JAN1995''d; <- date constant

    ```


    ```

    Country = upcase(Country);

    function variable

    ```


    # SAS Functions


    A SAS function is a routine that returns a value that is determined from specified
    arguments.


    The UPCASE function converts all letters in an argument to uppercase.


    General form of the UPCASE function:


    ```

    UPCASE(argument)

    ```


    The argument specifies any SAS character expression.'
  merge: -1
  pgno: 355
