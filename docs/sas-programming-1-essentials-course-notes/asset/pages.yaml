- img_proc: true
  md: '# Data Requirements


    | Data Requirement | where-expression to obtain invalid data |

    |---|---|

    | Employee_ID must be unique and not missing. | Employee_ID = . Does not account
    for uniqueness. |

    | Gender must have a value of or M. | Gender not in (''F'', ''M'') |

    | Salary must be in the range of 24000 - 50000. | Salary not between 24000 and
    50000 |

    | Job_Title must not be missing. | Job_Title = '''' |

    | Country must have a value of or US. | Country not in (''AU'', ''US'') |

    | Birth_Date must occur before Hire_Date. | Birth_Date > Hire_Date |

    | Hire_Date must have a value of 01/01/1974 or later. | Hire_Date < ''01JAN1974''d
    |


    # Data Requirements


    The following PROC PRINT step accounts for all of the data requirements except
    the Employee_ID being unique.


    ```

    proc print data=orion.nonsales;

    var Employee_ID Gender Salary Job_Title

    Country Birth Date Hire_Date;

    where Employee_ID = or

    Gender not in (''F'', ''M'') or

    Salary not between 24000 and 500000 or

    Job_Title = or

    Country not in (''AU'', ''US'') or

    Birth_Date > Hire_Date or

    Hire_Date < ''01JAN1974''d;

    run;

    ```


    > The OR operator is used between expressions. Only one expression needs to be
    true to account for an observation with invalid data.'
  merge: -1
  pgno: 327
