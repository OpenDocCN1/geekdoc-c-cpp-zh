    # 2.02 Quiz – Correct Answer


    How does SAS detect the end of the PROC MEANS step?


    ```

    data work.NewSalesEmps;

    length First Name $ 12

    Last Name $ 18 Job Title $ 25;

    infile ''newsemps.csv'' dlm=T,;

    input First_Name & Last Name $

