- img_proc: true
  md: "# RUN-Group Processing\n\nMany SAS/GRAPH procedures can use RUN-group processing,\
    \ which means that the following are true:\n\n+   - The procedure executes the\
    \ group of statements following a PROC statement when a RUN statement is encountered.\n\
    - Additional statements followed by another RUN statement can be submitted without\
    \ resubmitting the PROC statement.\n- The procedure stays active until a PROC,\
    \ DATA, or QUIT statement is encountered.\n\n# Example of RUN-Group Processing\n\
    \n```\nproc gchart data=orion.staff;\n  vbar Job Title;\ntitle 'Bar Chart of Job\
    \ Titles';\nrun;\n  pie Job Title;\ntitle 'Pie Chart of Job Titles';\nrun;\nquit;\n\
    ```"
  merge: -1
  pgno: 753
- img_proc: true
  md: '# 13.2 Creating Bar and Pie Charts


    Producing Bar and Pie Charts with the GCHART Procedure


    General form of the PROC GCHART statement:


    ```

    PROC GCHART DATA=SAS-data-set;

    ```


    Use one of these statements to specify the chart type:


    ```

    HBAR chart-variable ... <options>;nHBAR3D chart-variable ... <options>;nVBAR chart-variable
    ... <options>;nVBAR3D chart-variable ... <options>;

    PIE chart-variable ... <options>;nPIE3D chart-variable ... <options>;

    ```


    The chart variable determines the number of bars or slices produced within a graph.
    The chart variable can be character or numeric. By default, the height, length,
    or slice represents a frequency count of the values of the chart variable.'
  merge: -1
  pgno: 754
- img_proc: true
  md: "# Creating Bar and Pie Charts\n\n1. Submit the first PROC GCHART step to create\
    \ a vertical bar chart representing a frequency count.\n\nThe VBAR statement creates\
    \ a vertical bar chart showing the number of sales representatives for each value\
    \ of Job_Title in the orion.staff data set. Job_Title is referred to as the chart\
    \ variable. Because the chart variable is a character variable, PROC GCHART displays\
    \ one bar for each value of Job_Title.\n\n```\noptions reset=all;\nproc gchart\
    \ data=orion.staff;\n  vbar Job_Title;\n  where Job_Title =:'Sales Rep';\ntitle\
    \ 'Number of Employees by Job Title';\nrun;\n;\n```\n\nThe RESET-ALL option resets\
    \ all graphics options to their default settings and clears any titles or footnotes\
    \ that are in effect.\n\n# Number of Employees by Job Title\n\n![](img/1698e3a97543d6895ff5297aae8fd042_755_0.png)"
  merge: -1
  pgno: 755
- img_proc: true
  md: 'Submit the second PROC GCHART step to create a three-dimensional horizontal
    bar chart.


    HBAR3D statement creates a three-dimensional horizontal bar chart showing the
    same information as the previous bar chart. Notice that the HBAR and HBAR3D statements
    automatically display statistics to the right of the chart.


    ```

    options reset=all;

    proc gchart data=orion.staff;

    hbar3d Job_Title title=''Number of Employees by Job Title'';

    where Job_Title =:''Sales Rep'';

    run;

    quit;

    ```


    # Number of Employees by Job Title


    ![](img/1698e3a97543d6895ff5297aae8fd042_756_0.png)'
