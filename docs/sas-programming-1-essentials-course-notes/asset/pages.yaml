  md: '# SAS Syntax Rules


    Structured, consistent spacing makes a SAS program easier to read.


    | data work.NewSalesEmps: | Conventional Formatting |

    | length First Name $ 12 |

    | Last Name $ 18 Job.Title $ 25; |

    | infile ''newmps.csv'' dim=; |

    | input First.Name $ Last Name $ |

    | Job_Title $ Salary;

    run;

    proc print data=work.NewSalesEmps;

    run;

    proc means data=work.NewSalesEmps;

    class Job_Title;

    var Salary;

    run;


    SAS programming statements are easier to read if you begin DATA, PROC, and RUN
    statements in one column and indent the other statements.


    # SAS Syntax Rules


    SAS statements are free-format.


    +   - One or more blanks or special characters can be used to separate words.

    - They can begin and end in any column.

    - A single statement can span multiple lines.

    - Several statements can be on the same line.


    | data work.NewSalesEmps: | Unconventional Formatting |

    | length First Name $ 12 |

    | Last Name $ 18 Job.Title $ 25; |

    | infile ''newmps.csv'' dim=; |

    | input First.Name $ Last Name $ |

    | Job_Title $ Salary;

    run;

    proc print data=work.NewSalesEmps; run;

    proc means data =work.NewSalesEmps;

    class Job_Title; var Salary;run;'
  merge: -1
