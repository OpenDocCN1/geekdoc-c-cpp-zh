  md: '# 10.3 Concatenating Data Sets


    +   Objectives

    - Concatenate two or more SAS data sets by using the SET statement in a DATA step.

    - Change the names of variables by using the RENAME= data set option.

    - Compare the APPEND procedure to the SET statement. (Self-Study)

    - Interleave two or more SAS data sets by using the SET and BY statements in a
    DATA step. (Self-Study)


    # Appending and Concatenating


    Appending and concatenating involves combining SAS data sets, one after the other,
    into a single SAS data set.


    | SAS Data Set | |

    |---||

    | | |

    | | |

    | + |

    | SAS Data Set | |

    | | |


    +   - Appending adds the observations in the second data set directly to the end
    of the original data set.

    - Concatenating copies all observations from the first data set and then copies
    all observations from one or more successive data sets into a new data set.'
  merge: -1
  pgno: 466
- img_proc: true
  md: '# The SET Statement


    The SET statement in a DATA step reads observations from one or more SAS data
    sets.


    | DATA SAS-data-set; |

    | SET SAS-data-set1 SAS-data-set2...; |

    | <additional SAS statements> |

    | RUN; |


    +   - Any number of data sets can be in the SET statement.

    - The observations from the first data set appear first in the new data set. The
    observations from the second data set follow from the first data set, and so on.


    must know your data. By default, a compile-time error occurs if the same variable
    is not the same type in all SAS data sets in the SET statement.


    # Like-Structured Data Sets


    Concatenate EmpsDK and EmpsFR to create a new data set named EmpsAll11.


    | EmpsDK | | | EmpsFR | | | |

    |---|---|---|---|---|---|---|

    | First | Gender | Country | First | Gender | Country |

    | Lars | M | Denmark | Pierre | M | France |

    | Kari | F | Denmark | Sophie | F | France |

    | Jonas | M | Denmark | | | |


    The data sets contain the same variables.


    ```

    data EmpsAll11;

    set EmpsDK EmpsFR;

    run;

    ```'
