  md: '# SAS Enterprise Guide


    ![](img/1698e3a97543d6895ff5297aae8fd042_34_0.png)


    SAS Enterprise Guide provides a menu-driven system for creating and running your
    SAS programs.


    # Batch Mode


    Batch mode is a method of running SAS programs in which you prepare a file that
    contains SAS statements plus any necessary operating system control statements
    and submit the file to the operating system.


    Partial z/OS (OS/390) Example:


    ```

    //jobname JOB accounting info,name ... Appropriate JCL

    // EXEC SAS * placed before

    // SYSIN DD *\ata work.NewSalesEmps;

    length First Name = 18 Job Title = 25;

    infile ''workshop.rawdata(newemps)'' dlm='','';

    input First Name $ Last_Name $

    Job_Title $ Salary;

    ```'
