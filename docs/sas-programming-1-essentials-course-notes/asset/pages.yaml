  md: '# Noninteractive Mode


    In noninteractive mode, SAS program statements are stored in an external file
    and are executed immediately after you issue a SAS command referencing the file.


    Directory-based Example:


    ```

    SAS filename

    ```


    z/OS (OS/390) Example: handcoded data set


    ```

    SAS INPUT(filename)

    ```


    The command for invoking SAS at your site might be different from the default
    shown above. Ask your SAS administrator for the command to invoke SAS at your
    site.


