    options pagesize=18 number pageno=1 date dreset;

    title1 ''Orion Star Sales Analysis'';\proc means data=orion.order_fact;

    where Order Type=2;

    var Total_Retail Price;

    title3 ''Catalog Sales Only'';

    footnote "Based on the previous day''s posted data";

