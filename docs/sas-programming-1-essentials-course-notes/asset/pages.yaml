    | 5 | 120123 | Sales Rep. I | 26190 |


    ![](img/1698e3a97543d6895ff5297aae8fd042_577_1.png)


    The FSEDIT procedure is another procedure in addition to the PRINT procedure that
    uses the LABEL option.'
