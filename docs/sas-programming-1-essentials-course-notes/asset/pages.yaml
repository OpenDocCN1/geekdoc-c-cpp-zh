  md: '# 4.2 Accessing SAS Data Libraries


    > Objectives

    * Explain the concept of a SAS data library.

    * Assign a library reference name to a SAS data library by using the LIBNAME statement.

    * State the difference between a permanent library and a temporary library.

    * Browse the contents of a SAS data library by using the SAS Explorer window.

    * Investigate a SAS data library by using the CONTENTS procedure.


    SAS Data Libraries

    A SAS *data library* is a collection of SAS files that are recognized as a unit
    by SAS.


    | Directory-based System | A SAS data library is a directory. |

    | --- | --- |

    | Windows Example: s:\workshop | |

    | UNIX Example: /users/userid | |

    | z/OS (OS/390) | A SAS data library is an operating system file. |

    | z/OS (OS/390) Example: userid.workshop.sasdata |'
  merge: -1
  pgno: 117
- img_proc: true
  md: '# SAS Data Libraries


    You can think of a SAS data library as a drawer in a filing cabinet and a SAS
    data data set as one of the file folders in the drawer.


    ![](img/1698e3a97543d6895ff5297aae8fd042_118_0.png)


    # Assigning a Libref


    Regardless of which host operating system you use, you identify SAS data libraries
    by assigning a library reference name (libref) to each library.


    ![](img/1698e3a97543d6895ff5297aae8fd042_118_1.png)'
  merge: -1
  pgno: 118
- img_proc: true
  md: '# SAS Data Libraries


    When a SAS session starts, SAS automatically creates one temporary and at least
    one permanent SAS data library that you can access.


    ![](img/1698e3a97543d6895ff5297aae8fd042_119_0.png)


    Work – temporary library

    Sasuser – permanent library


    The Work library and its SAS data files are deleted after your SAS session ends.


    SAS data sets in permanent libraries such as the Sasuser library are saved after
    your SAS session ends.


    # SAS Data Libraries


    You can also create and access your own permanent libraries.


    ![](img/1698e3a97543d6895ff5297aae8fd042_119_1.png)


    orion – permanent library orion'
  merge: -1
  pgno: 119
- img_proc: true
  md: '# Assigning a Libref


    You can use the LIBNAME statement to assign a library reference name (libref)
    to a SAS data library.


    +   Rules for naming libref:

    * The name must be 8 characters or less.

    * The name must begin with a letter or underscore.

    * The remaining characters must be letters, numerals, or underscores.


    For Windows and UNIX, SAS can only make an association between a libref and an
    existing directory. The LIBNAME statement does not create a new directory.


    z/OS (OS/390) users can use a DD statement or TSO ALLOC command instead of issuing
    a LIBNAME statement.


    # Assigning a Libref


    Examples:


    Windows


    ```

    libname orion ''s:\workshop'';

    ```


    UNIX


    ```

    libname orion ''/users/userid'';

    ```


    z/OS (OS/390)


    ```

    libname orion ''userid.workshop.sasdata'';

    ```'
  merge: -1
  pgno: 120
- img_proc: true
  md: '# Making the Connection


    When you submit the LIBNAME statement, a connection is made between a libref in
    SAS and the physical location of files on your operating system.


    ![](img/1698e3a97543d6895ff5297aae8fd042_121_0.png)


    When your session ends, the link between the libref and the physical location
    of your files is broken.


    # 4.05 Poll


    During an interactive SAS session, every time that you submit a program you must
    also resubmit the LIBNAME statement.


    +   - True

    - False'
  merge: -1
  pgno: 121
