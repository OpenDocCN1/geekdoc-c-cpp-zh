    # Section 7.4: Integer literals


    Integer literals are used to provide integral values. Three numerical bases are
    supported, indicated by prefixes:


    | Base | Prefix | Example |

    | --- | --- | --- |

    | Decimal | | 5 |

    | Octal | 0 | 0345 |

    | Hexadecimal | 0x or 0X | 0x12AB, 0X12AB, 0x12ab, 0X12ab |


    Note this writing doesn''t include any sign, so integer literals are always positive.
    Something like -1 is treated as an expression that has one integer literal (1)
    that is negative with a


    The type of a decimal literal is the first data type that can fit the value from
    int and long. Since C99, long long is also supported for very large literals.


    The type of an octal or hexadecimal literal is the first data type that can fit
    the value from int, unsigned, and long. Since C99, long long and unsigned long
    long are also supported for very large literals.'
