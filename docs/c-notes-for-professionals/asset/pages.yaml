  md: "# # Chapter 39: Identifier Scope\n\n# ## Section 39.1: Function Prototype Scope\n\
    \n```\n#include <stdio.h>\n\n/* The parameter name, apple, has function prototype\
    \ scope. These names\nare not significant outside the prototype itself.  This\
    \ is demonstrated\nbelow. */\n\nint test_function(int apple);\nint main(void)\n\
