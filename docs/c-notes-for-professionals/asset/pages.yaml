  md: '# Chapter 4: Operators


    An operator in a programming language is a symbol that tells the compiler or interpreter
    to perform a specific mathematical, relational or logical operation and produce
    a final result.


    C has many powerful operators. Many C operators are binary operators, which means
    they have two operands. For example, in a / b , is a binary operator that accepts
    two operands (a, b). There are some unary operators which take one (for example:
    ++), and only one ternary operator ? : .


    # Chapter 4.1: Relational Operators


    Relational operators check if a relation between two operands is true. The result
    is evaluated to 1 (which means true) or 0 (which means false). This result is
    often used to affect control flow (via if, while, for), but can also be stored
    in variables.


    Equals ==="


    Checks whether the supplied operands are equal.


    ```

    1 == 0;              /* evaluates to 0. */

    1 == 1;              /* evaluates to 1. */


    int x = 5;

    int y = 5;

    int *xptr = &x, *yptr = &y;

    xptr = *yptr;       /* evaluates to 0, the operands hold different location addresses.
    */

    *xptr = *yptr;       /* evaluates to 1, the operands point at locations that hold
    the same value. */

    ```


    Attention: This operator should not be confused with the assignment operator (=)!


    Not equals !=="


    Checks whether the supplied operands are equal.


    ```

    1 != 0;              /* evaluates to 1. */

    1 != 1;              /* evaluates to 0. */


    int x = 5;

    int y = 5;

    int *xptr = &x, *yptr = &y;

    xptr != *yptr;       /* evaluates to 1, the operands hold different location addresses.
    */

    *xptr != *yptr;       /* evaluates to 0, the operands point at locations that
    hold the same value. */

    ```


    This operator effectively reverses the result to that of the equals (==) operator.


    Not !=="


    Check whether an object is equal to 0.


    The ! can also be used directly with a variable as follows:


    ```

    !someVal

    ```


