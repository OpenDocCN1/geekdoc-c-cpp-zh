  md: 'will end up in the address space of the finished program. It''s got the load
    addresses, and it can replace all the symbolic addresses in the object code with
    "real", numerical addresses in the target''s address space. The program is ready
    to be executed now.


    This includes both the object files that the compiler created from your source
    code files as well as object files that have been pre-compiled for you and collected
    into library files. These files have names which end in .a or .so, and you normally
    don''t need to know about them, as the linker knows where most of them are located
    and will link them automatically.


    # Implicit invocation of the linker


    Like the pre-processor, the linker is a separate program, often called 1d (but
    Linux uses collect2, for example).

    Also like the pre-processor, the linker is invoked automatically for when you
    use the compiler. Thus, the normal way of using the linker is as follows:


    ```

    $ gcc foo.o bar.o -o myprog

    ```


    This line tells the compiler to link together three object files (foo.o, bar.o
    and baz.o) into a binary executable file named myprog. Now you have a file called
    myprog that you can run and will hopefully do something cool and useful.


    # Explicit invocation of the linker


    It is possible to invoke the linker directly, but this is seldom advisable, and
    is typically platform-specific. That is, options that work on Linux won''t necessarily
    work on Solaris, AIX, macOS, Windows, and similarly for any other platform. When
    you use GCC, you can use gcc -v to see what is executed on your behalf.


    # Options for the linker


    The linker also takes arguments to modify its behavior. The following command
    would tell you gcc to link foo.o and bar.o, but also includes the libraries.


    ```

    $ gcc foo.o bar.o -lncurses

    ```


    This is actually (more or less) equivalent to


    ```

    $ gcc foo.o bar.o /usr/lib/lncurses.so -o foo

    ```


    (although lncurses.so could be lncurses.a, which is an archive created with ar).
    Note that you should list the libraries (either by pathname or -lname options)
    after the object files. With static libraries, the order they are specified matters;
    with shared libraries, the order doesn''t matter.


    Note that on systems, if you are using mathematical functions from <math.h>, you
    need require this. But there are other libraries that are separate libraries on
    Linux and other Unix systems, but not on macOS — POSIX threads, and POSIX realtime,
    networking libraries are examples. Consequently, the linking process varies between
    platforms.


    # Other compilation options


    This is all you need to know for beginning your own C programs. Generally, we
    also recommend that you use the -Wall command-line option:


    ```

    $ gcc -Wall -c foo.cc

    ```'
