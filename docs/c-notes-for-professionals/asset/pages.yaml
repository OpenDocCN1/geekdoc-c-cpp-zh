  md: '# Section 6.13: Safely convert Strings to Number: strto functions


    Version ≥ C99

    Since C99 library has a set of conversion functions that interpret a string as
    a number. Their names are of

    the strtoX, where X is one of 1, ul, d, etc to determine the target type of the
    conversion


    ```

    double strtod(char const p, char** endptr);

    long strtol(char const p, char** endptr);

    ```


    They provide checking that a conversion had an over- or under:


    ```

    double ret = strtod(argv[1], 0); // attempt conversion */

    /* check the conversion result.*/

    if ((ret == HUGE_VAL || ret == -HUGE_VAL) && errno == ERANGE)

    return; // numeric overflow in string */

    else if (ret == HUGE_VAL && errno == ERANGE)

    return; // numeric underflow in string */

    /* At this point we know everything went fine so may be used */

    ```


    If the string contains no number then strtod returns 0.0.


    If this is not satisfactory, the additional parameter endptr can be used. It is
    a pointer to that which will be pointed to the end of the detected number in string.
    If it is 0, as other, NULL, it is simply ignored.


    endptr parameter indicates if there has been a successful conversion and if so,
    where the number

    provided:


    ```

    char check = 0;

    double ret = strtod(argv[1], &check); // attempt conversion */


    /* check the conversion result.*/

    if (argv[1] == check)

    return; // No number detected in string */

    else if ((ret == HUGE_VAL || ret == -HUGE_VAL) && errno == ERANGE)

    return; // numeric overflow in string */

    else if (ret == HUGE_VAL && errno == ERANGE)

    return; // numeric underflow in string */


    /* At this point we know everything went fine so may be used */

    ```


    There are analogous functions to convert to the integer types:


    ```

    long strtoll(char const p, char** endptr, int nbase);

    long strtol(char const p, char** endptr, int nbase);

    unsigned long strtou(char const p, char** endptr, int nbase);

    unsigned long strtoull(char const p, char** endptr, int nbase);

    ```


    ```

    long a = strtol("101", 0, 2); // a = 5L *

    long b = strtol("101", 0, 8); // b = 65L *

    long c = strtol("101", 0, 10); // c = 101L *

    long d = strtol("101", 0, 16); // d = 257L *

    long e = strtol("101", 0, 0); // e = 101L *


    ```'
