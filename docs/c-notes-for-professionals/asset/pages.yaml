  md: "You need to be aware of endianness when defining bit-fields in this way. As\
    \ such it may be necessary to use a preprocessor directive to check for the endianness\
    \ of the machine. An example of this follows:\n\n```\ntypedef union {\n  struct\
    \ bits {\n#if defined(WIN32) || defined(LITTLE_ENDIAN)\nuint8_t commFailure :\
    \ 1;\nuint8_t hardwareFailure : 1;\nuint8_t _reserved : 6;\n#else\nuint8_t _reserved\
    \ : 6;\nuint8_t hardwareFailure : 1;\nuint8_t commFailure : 1;\n#endif\n};\nuint8_t\
    \ data;\n} hardwareStatus;\n```\n\n# Section 9.2: Using bit-fields as small integers\n\
    \n```\n#include <stdio.h>\n\nint main(void) {\n  /* define a small bit-field that\
    \ can hold values from 0 .. 7 */\n  struct {\n    unsigned int uint3: 3;\n  }\
    \ small;\n\n  /* extract the right 3 bits from a value */\n  unsigned int value\
    \ = 255; /* Binary 11111111 */\n  small.uint3 = value; /* Binary 101 */\n  printf(\"\
    %d\\n\", small.uint3);\n\n  /* This is in effect an infinite loop */\n  for (small.uint3\
    \ = 0; small.uint3 < 8; small.uint3++) {\n    printf(\"%d\\n\", small.uint3);\n\
    \  }\n\n  return 0;\n}\n```\n\n# Section 9.3: Bit-field alignment\n\nBit-fields\
    \ give an ability to declare structure fields that are smaller than the character\
    \ width. Bit-fields are implemented with byte-level or word-level mask. The following\
    \ example results in a structure of 8 bytes.\n\n```\nstruct C {\n  short s;  \
    \    /* 2 bytes */\n  char c;       /* 1 byte */\n  int bit1 : 1;  /* 1 bit */\n\
    \  int nib : 4;   /* 4 bits padded up to boundary of 8 bits. Thus 3 bits are padded\
    \ extra */\n  int septet : 7; /* 7 bits septed, padded up to boundary of 32 bits.\
    \ */\n};\n```"
