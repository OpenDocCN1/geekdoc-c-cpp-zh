  md: "A static assertion is one that is checked at compile time, not run time. The\
    \ condition must be a constant expression, and if false will in a compiler error.\
    \ The first argument, the condition that is checked, must be a constant expression,\
    \ and the second string literal.\n\nUnlike _static_assert is a keyword. A convenience\
    \ macro static_assert is defined in <assert.h>.\n\n```\n#include <assert.h>\n\n\
    enum (N = 5);\n_Static_assert(N == 5, \"does not equal 5\"); // compiler error\
    \ *\nstatic_assert(N > 10, \"N is not greater than 10\");\nVersion = C99\n```\n\
    \nPrior to C11, there was no support for static assertions. However, in C99, static\
    \ assertions could be emulated by macros that would trigger a compilation failure\
    \ if the time condition was false. Unlike _Static_assert, the second parameter\
    \ needs to be a proper token name so that a variable can be created with it. If\
    \ the assertion fails, the variable name is seen in the compiler error, since\
    \ that variable was used in a syntactically incorrect declaration.\n\n```\n#define\
    \ STATIC_MSG(msg, 1) STATIC_MSG2(msg, 1)\n#define STATIC_MSG2(msg, 1) on_line_#1##_msg\n\
    #define static_assert(x, msg) extern char STATIC_MSG(msg, __LINE__)[(x)?:1]\n\
    ```\n\n```\nenum (N = 5);\nSTATIC_ASSERT(N == 5, N_must_equal_5);\nSTATIC_ASSERT(N\
    \ > 5, N_must_be_greater_than_5); // compile error *\n```\n\nBefore C99, you could\
    \ not declare variables at locations in a block, so you would have to be extremely\
    \ cautious about using this macro, ensuring that it only appears where a variable\
    \ declaration would be valid.\n\n# 33.3: Assert Error Messages\n\nA trick exists\
    \ that display an error message along with an assertion. Normally, you would write\
    \ code like this\n\n```\nvoid f(void *p)\n{\n  assert(p != NULL);\n  /* more code\
    \ */\n}\n```\n\nIf the assertion failed, an error message would resemble\n\n>\
    \ Assertion failed: p != NULL, main.c, line 5\n\nHowever, you can use logical\
    \ AND (&&) to give an error message as well\n\n```\nvoid f(void *p)\n{\n  assert(p\
    \ != NULL) && \"function f: p cannot be NULL\";\n  /* more code */\n}\n```\n\n\
    Now, if the assertion fails, an error message will read something like this"
