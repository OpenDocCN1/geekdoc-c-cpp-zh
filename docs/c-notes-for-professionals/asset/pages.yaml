  md: "# Section 42.2: Typedef usage for Function Pointers\n\nWe can use typedef to\
    \ simplify the usage of function pointers. Imagine we have some functions, all\
    \ having the same signature, but they use their argument to print something out\
    \ in different ways:\n\n```\n#include<stdio.h>\nvoid print_to_n(int n)\n{\n  \
    \  for (int i = 1; i <= n; ++i)\n        printf(\"%d\\n\", i);\n}\n\nvoid print_n(int\
    \ n)\n{\n    printf(\"%d\\n\", n);\n}\n```\n\nNow we can use a typedef to create\
    \ a named function pointer called printer:\n\n```\ntypedef void (*printer_t)(int);\n\
    ```\n\nThis creates a type named printer_t for a pointer to a function that takes\
    \ a single int and returns nothing, matches the signature of the functions we\
    \ have above. To use it we create a variable of the created type and assign it\
    \ to one of the functions in question:\n\n```\nprinter_t p = &printer_to_n;\n\
    void (*p)(int) = &printer_to_n; // This would be required without the type\n```\n\
    \nThen to call the function pointed by the function variable:\n\n```\np(5); //\
    \ Prints 1 2 3 4 5 on separate lines\n(*p)(5); // So does this\n```\n\nThus the\
    \ typedef allows a simpler syntax when dealing with function pointers. This becomes\
    \ more apparent when function pointers are used in more complex situations, such\
    \ as arguments to functions.\n\nIf you are using a function that takes a function\
    \ pointer as a parameter without a function pointer type defined the function\
    \ would be:\n\n```\nvoid foo (void (*printer)(int), int y){\n    //code\n    printer(y);\n\
    \    //code\n}\n```\n\nHowever, with the typedef it is:\n\n```\nvoid foo (printer_t\
    \ printer, int y){\n    //code\n    printer(y);\n    //code\n}\n```\n\nLikewise\
    \ functions can return function pointers and again, the use of a typedef can make\
    \ the syntax simpler when doing so.\n\nGoalKicker.com – C Notes for Professionals"
