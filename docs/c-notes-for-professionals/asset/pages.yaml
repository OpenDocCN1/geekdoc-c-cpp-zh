  md: "# Section 39.4: Function scope\n\nFunction scope is the special scope for labels.\
    \ A label is visible through the entire function it defined and can jump (using\
    \ instruction gotoLabel) to any point in the same function. While not using example,\
    \ illustrate the point following:\n\n```\n#include <stdio.h>\n\nint main(int argc,char\
    \ *argv[]) {\n    int a = 0;\n    goto INSIDE;\nOUTSIDE:\n    if (a!=0) {\n  \
    \      int i=0;\n        INSIDE:\n        printf(\"a=%d\\n\",a);\n        goto\
    \ OUTSIDE;\n    }\n}\n```\n\nINSIDE may seem inside the if block, as it is the\
    \ case for i which scope is the block, but it is not. It is visible in the whole\
    \ function as the instruction goto INSIDE; illustrates. Thus there can't be two\
    \ labels with the same identifier in a single function.\n\nA possible usage is\
    \ the following pattern to resolve correct complex cleanups of allocated resources:\n\
    \n```\n#include <stdlib.h>\n#include <stdio.h>\n\nvoid a_function(void) {\n  \
    \  double *a = malloc(double[34]);\n    if (a) {\n        printf(stderr,\"can't\
    \ allocate\\n\");\n        /* No point in freeing a if it is null */\n       \
    \ return;\n    }\n    FILE *b = fopen(\"some_file\",\"r\");\n    if (b) {\n  \
    \      printf(stderr,\"can't open\\n\");\n        goto CLEANUP1; /* Free no point\
    \ in closing b */\n    }\n    /* do something reasonable */\n    if (error) {\n\
    \        printf(stderr,\"something's wrong\\n\");\n        goto CLEANUP2; /* Free\
    \ a and close b to prevent leaks */\n    }\n    /* do yet something else */\n\
    CLEANUP2:\n    close(b);\nCLEANUP1:\n    free(a);\n}\n```\n\nLabels as CLEANUP1\
    \ and CLEANUP2 are special identifiers that behave differently from all other\
    \ identifiers. They are visible everywhere inside the function, even in places\
    \ that are executed before the labeled statement, or in places that could never\
    \ be reached if none of the goto is executed. Labels are often written in lower-case\
    \ rather than upper-case."
