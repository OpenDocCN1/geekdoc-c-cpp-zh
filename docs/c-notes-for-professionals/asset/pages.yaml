    \ in the expected output:\n\nExample 1\nExample 2\nExample 3\nExample 4\n\n# ##\
    \ Section 63.6: Forgetting to free memory (memory leaks)\n\nA programming best\
    \ practice is to free any memory that has been allocated directly by your own\
    \ code, or implicitly by calling an internal or external function, such as a library\
    \ API likestrdup(). Failing to free memory can introduce a memory leak, which\
    \ accumulates into a substantial amount of wasted memory that unavailable to your\
    \ program (or the system), possibly leading to crashes or undefined behavior.\
    \ Problems are more likely to occur if the leak is incurred repeatedly in a loop\
    \ or recursive function. The risk of program failure increases the longer a leak\
    \ is running. Problems may appear instantly; other times won't be seen for hours\
    \ or years of constant operation. Memory exhaustion failures can be catastrophic,\
    \ depending on the circumstances.\n\nThe following infinite loop is an example\
    \ of a leak that will eventually exhaust available memory leak by calling getline(),\
    \ a function that allocates new memory, without freeing that memory.\n\n```\n\
    #include <stdlib.h>\n#include <stdio.h>\n\nint main(void)\n{\n    char *line =\
    \ NULL;\n    size_t size = 0;\n\n    /* The loop below leaks memory as fast as\
    \ it can */\n    for(;;) {\n        getline(&line, &size, stdin); /* New memory\
    \ implicitly allocated */\n        /* <do whatever> */\n\n        line = NULL;\n\
    \    }\n\n    return 0;\n}\n```\n\nIn contrast, the code below uses the getline()\
    \ function, but this time, the allocated memory is correctly freed, avoiding a\
    \ leak.\n\n```\n#include <stdlib.h>\n#include <stdio.h>\n```"
