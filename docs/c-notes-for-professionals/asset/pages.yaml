  md: "# Section 63.8: Mistakenly writing = instead of == when comparing\n\nThe =\
    \ operator is used for assignment.\n\nThe = operator is used for comparison.\n\
    \nOne should be careful not to mix the two. Times one mistakenly writes\n\n```\n\
    /* assign y to x */\nif (x = y) {\n  /* logic */\n}\n```\n\nwhat was really wanted\
    \ is:\n\n```\n/* compare if x is equal to y */\nif (x == y) {\n  /* logic */\n\
    }\n```\n\nThe former assigns value y to x and checks if value is non zero, instead\
    \ of doing comparison, which is equivalent to:\n\n```\nif ((x = y) != 0) {\n \
    \ /* logic */\n}\n```\n\nThere are times testing the result of an assignment is\
    \ is commonly used, because it avoids having duplicate code and having to treat\
    \ the first time specially. Compare\n\n```\nwhile ((c = getopt_long(argc, argv,\
    \ short_options, long_options, &option_index)) != -1) {\n  switch (c) {\n    ...\n\
    \  }\n}\n```\n\nversus\n\n```\nc = getopt_long(argc, argv, short_options, long_options,\
    \ &option_index);\nwhile (c != -1) {\n  switch (c) {\n    ...\n    c = getopt_long(argc,\
    \ argv, short_options, long_options, &option_index);\n  }\n}\n```\n\nModern compilers\
    \ will recognise this pattern and do not warn when the assignment is inside parenthesis\
    \ as, above, but may warn for other uses. For example:\n\n```\nif (x = y) { /*\
    \ warning */ }\\nif ((x = y)) { /* no warning */ }\n```"
