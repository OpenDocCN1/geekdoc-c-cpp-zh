  md: "# Chapter 63: Common pitfalls\n\nThis section discusses some of the common\
    \ mistakes that a C programmer should be aware of and should avoid making. For\
    \ some on unexpected problems and their causes, please see Undefined behavior\n\
    \n# Section 63.1: Mixing signed and unsigned integers in arithmetic operations\n\
    \nIt is not a good idea to mix signed and unsigned integers in arithmetic operations.\
    \ For example, what will be the output of following example?\n\n```\n#include\
    \ <stdio.h>\n\nint main(void) {\n    unsigned int a = 1000;\n    signed int b\
    \ = -1;\n\n    if (a > b) puts(\"a is more than b\")\n    else puts(\"a is less\
    \ or equal than b\")\n\n    return 0;\n}\n```\n\nSince 1000 is -1 you would expect\
    \ the output to be a is more than b, however that will not be the case.\n\nArithmetic\
    \ operations between different integral types are performed within a common type\
    \ defined by the so called arithmetic conversions (see the language specification,\
    \ 6.3.1.8).\n\nIn this case \"common type\" is unsigned int, Because, stated as\
    \ in Usual arithmetic conversions.\n\n> 714 Otherwise, if the operand that has\
    \ unsigned int has rank greater or equal to the rank of the type of the other\
    \ operand, the operand with signed int type is converted to the type of the operand\
    \ with unsigned integer type.\n\nThis means that int b will get converted to unsigned\
    \ int before the comparison.\n\nWhen -1 is converted to an unsigned int the result\
    \ is the maximal possible unsigned int value, which is greater than 1000, meaning\
    \ that a > b is false.\n\n# Section 63.2: Macros are simple string replacements\n\
    \nMacros are simple string replacements. (Strictly speaking, they work with preprocessing\
    \ tokens, not arbitrary strings.)\n\n```\n#include <stdio.h>\n\n#define SQUARE(x)\
    \ x*x\n\nint main(void) {\n    printf(\"%d\\n\", SQUARE(1+2));\n    return 0;\n\
    }\n```"
  merge: -1
  pgno: 313
- img_proc: true
  md: "You may expect this to print 9 (3×3), but actually 5 will be printed because\
    \ the macro will be expanded to 1+2+2.\n\nYou should wrap the arguments and the\
    \ whole macro expression in parentheses to avoid this problem.\n\n```\n#include\
    \ <stdio.h>\n\n#define SQUARE ((x)*(x))\n\nint main(void) {\n    printf(\"%d\\\
    n\", SQUARE(1+2));\n    return 0;\n}\n```\n\nAnother problem is that the arguments\
    \ of a macro are not guaranteed to be evaluated once; they may not be evaluated\
    \ at all, or may be evaluated multiple times.\n\n```\n#include <stdio.h>\n\n#define\
    \ MIN(x,y) ((x) <= (y) ? (x) : (y))\n\nint main(void) {\n    int a = 0;\n    printf(\"\
    %d\\n\", MIN(a,a++));\n    printf(\"a = %d\\n\", a);\n    return 0;\n}\n```\n\n\
    In this code, the macro will be expanded to ((a++) <= (10) ? (a++) : (10)). Since\
    \ a++ is smaller than 10, a++ will be evaluated and it will make the value of\
    \ a and what is returned from MIN differ from what you may expect.\n\nThis can\
    \ be avoided by using functions, but note that the types will be fixed by the\
    \ function definition, whereas macros can be (too) flexible with types.\n\n```\n\
