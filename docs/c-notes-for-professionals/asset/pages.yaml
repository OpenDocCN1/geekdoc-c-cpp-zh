  md: "```\n}\n}\n/* destroy stack */\ndestroy(stack);\n\nreturn result;\n}\n/* Push\
    \ a value onto the stack. */\n/* Returns 0 on success and -1 on failure. */\n\
    int push(int data, struct *stack)\n{\n    int result = 0;\n\n    /* allocate memory\
    \ for new node */\n    struct *new_node = malloc(sizeof *new_node)\n    if (NULL\
    \ == new_node) {\n        result = -1;\n    }\n    else {\n        new_node->data\
    \ = data;\n        new_node->next = stack->top;\n        stack->top = new_node;\n\
    \        stack->size++;\n    }\n\\    return result;\n}\n/* Pop a value off the\
    \ stack, */\n/* Returns the value popped off the stack */\nint pop(struct *stack)\n\
    {\n    struct node *top = stack->top;\n    int data = top->data;\n    stack->top\
    \ = top->next;\n    stack->size--;\n    free(top);\n    return data;\n}\n\n/*\
    \ destroy the stack */\nvoid destroy(struct *stack)\n{\n    /* free all pointers\
    \ */\n    while(stack->top != NULL) {\n        pop(stack);\n    }\n}\n```\n\n\
    # ## Section 13.4: Passing structs to functions\n\nIn C, all arguments are passed\
    \ by value, including structs. For small structs, this is a good thing as it means\
    \ there is no overhead for accessing the data through a pointer. However, it also\
    \ makes it very easy to accidentally pass a huge struct resulting in poor performance,\
    \ particularly if the programmer is used to other languages where arguments are\
    \ passed by reference."
