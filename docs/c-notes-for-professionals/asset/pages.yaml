  md: "# # Chapter 54: Constraints\n\n# ## Section 54.1: Duplicate variable names\
    \ in the same scope\n\nAn example of a constraint as expressed in the C standard\
    \ is having two variables of the same name declared in a scope1), for example:\n\
    \n```\nvoid foo(int bar) {\n    int var;\n    double var;\n}\n```\n\nThis code\
    \ breaks the constraint and produce a diagnostic message at compile time. This\
    \ is very useful compared to undefined behavior as the developer will be informed\
    \ of the issue before the program is run, potentially doing anything.\n\nConstraints\
    \ tend to be errors which are easily detectable at compile time such as this,\
    \ issues which result in undefined behavior would be difficult or impossible to\
    \ detect at compile time are thus not constraints.\n\n+   1) exact wording:\n\n\
    Version = C99\nnIf an identifier has no linkage, there shall be no more than one\
    \ declaration of the identifier (in a declarator or type specifier) with the same\
    \ scope and in the same name space, except for tags as specified in 6.7.2.3.\n\
    \n# ## Section 54.2: Unary arithmetic operators\n\nThe unary + - operators are\
    \ only usable on arithmetic types, therefore if example one tries to use them\
    \ on a struct which will produce a diagnostic eg:\n\n```\nstruct foo {\n    bool\
    \ bar;\n};\n\nvoid baz(void) {\n    struct foo testStruct;\n    -testStruct; /*\
    \ This breaks the constraint so must produce a diagnostic */\n}\n```"
