    ```

    MY_STRUCT info = { 1, 3.14159F };

    MY_STRUCT *instance = &info;

    ```


    When the pointer is valid, we can dereference it to access its members using one
    of two notations:


    ```

    int a = (*instance).my_int;

    float b = instance->my_int;

    ```


    While both these methods work, it is better to use the -> operator rather than
    the combination of parentheses, the dereference * operator and the . operator
    because it is easier to read and understand, especially with nested uses.


    Another difference is shown below:


    ```

    MY_STRUCT copy = *instance;

    copy.my_int = 2;

    ```


    In this case, copy contains a copy of the contents of instance. Changing my_int
    of copy will not change it in instance.


    ```

    MY_STRUCT *ref = &instance;

    ref->my_int = 2;

    ```


    In this case, ref is a reference to instance. Changing my_int will change it in
    instance.


    It is common practice to use pointers to structs as parameters in functions, rather
    than to the structs themselves. Using the structs as function parameters could
    cause the stack to overflow if the struct is large. Using a pointer to a struct
    only uses enough stack for the pointer, but can cause side effects if the function
    changes the struct which is passed into the function.


