  md: "# # Chapter 26: Pass 2D-arrays to functions\n\n# ## Section 26.1: Pass a 2D-array\
    \ to a function\n\nPassing a 2D array to functions seems simple and obvious and\
    \ we happily write:\n\n```\n#include <stdio.h>\n#include <stdlib.h>\n\n#define\
    \ ROWS 3\n#define COLS 2\n\nvoid fun1(int **, int, int);\n\nint main() {\n   \
    \ int array_2D[ROWS][COLS] = { {1, 2}, {3, 4}, {5, 6} };\n    int n = ROWS;\n\
    \    int m = COLS;\n\n    fun1(array_2D, n, m);\n    return EXIT_SUCCESS;\n}\n\
    \nvoid fun1(int **a, int n, int m) {\n    int i, j;\n    for (i = 0; i < n; i++)\
    \ {\n        for (j = 0; j < m; j++) {\n            printf(\"array[%d][%d]=%d\\\
    n\", i, j, a[i][j]);\n        }\n    }\n}\n```\n\nBut the compiler, GCC in version\
    \ 4.9.4, does not appreciate it.\n\n```\n$ gcc-4.9 -03 -g3 -W -Wall -Wextra -std=c11\
    \ passarr.c -o passarr\npassarr.c: In function 'main':\npassarr.c:16:8: warning:\
    \ passing argument 1 of 'fun1' from incompatible pointer type\nfun1(array_2D,\
    \ n, m);\npassarr.c:8:6: note: expected 'int **' but argument is of type 'int(*)[2]'\n\
    void fun1(int **, int, int);\n```\n\nThe reasons for this are twofold: the main\
    \ problem is that arrays are not pointers and the second inconvenience is that\
    \ the so pointer decay. Passing an array to a function will decay the pointer\
    \ to the first element of the array--in the case of a 2D array it decays to a\
    \ pointer to the first row because C arrays are sorted row-first.\n\n```\n#include\
    \ <stdio.h>\n#include <stdlib.h>\n\n#define ROWS 3\n#define COLS 2\n\nvoid fun1(int\
    \ (*)[COLS], int, int);\n```\n\nGoalKicker.com - C Notes for Professionals"
