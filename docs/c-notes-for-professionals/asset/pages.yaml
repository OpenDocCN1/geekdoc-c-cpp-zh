  md: "# # Chapter 43: Storage Classes\n\nA storage class is used to set the scope\
    \ of a variable or function. By knowing the storage class of a variable, we can\
    \ determine the life-time of that variable during the run-time of the program.\n\
    \n# ## Section 43.1: auto\n\nThis storage class denotes that an identifier has\
    \ automatic storage duration. This means once the scope in which the identifier\
    \ is defined ends, the object denoted by the identifier is no longer valid.\n\n\
    Since all objects, not living in global scope or declared static, have automatic\
    \ storage duration by default when defined, this keyword is mostly of historical\
    \ interest and should not be used:\n\n```\nint foo(void)\n{\n    /* An integer\
    \ with automatic storage duration. */\n    auto i = 3;\n\n    /* Same /\n    int\
    \ j = 5;\n\n    return 0;\n} The values of i and j are no longer able to be used.\
    \ */\n```\n\n# ## Section 43.2: register\n\nHints to the compiler that an object\
    \ should be as fast as possible. Whether the compiler actually uses the hint is\
    \ implementation-defined; it may treat it as equivalent to auto.\n\nThe only property\
    \ that is definitively for all objects that are declared with register is that\
    \ they cannot have their address computed. Thereby register can be a good tool\
    \ to ensure certain optimizations:\n\n```\nregister size_t size = 467;\n```\n\n\
    is an object that can never alias because no code can pass its address to another\
    \ function where it might be changed unexpectedly.\n\nThis property also implies\
    \ that array\n\n```\nregister int array[5];\n```\n\ncannot decay into a pointer\
    \ to its first element (i.e. turning into &array[]). This means the elements of\
    \ such an array cannot be accessed and the array itself cannot be passed to a\
    \ function.\n\nIn fact, the only legal use of an array declared with a register\
    \ storage class is the sizeof operator; any other operator would require the address\
    \ of the first element. For that reason, arrays generally should not be declared\
    \ with the register keyword since it makes them useless for anything than size\
    \ computation of the entire array, which can be done just easily without the register\
    \ keyword.\n\nThe register storage class is more appropriate for variables that\
    \ are defined inside a block and are accessed with high frequency. For example,\n\
    \n```\n/* prints the sum of the first 5 integers*\n/* code assumed to be part\
    \ of a function body*/\n```"
