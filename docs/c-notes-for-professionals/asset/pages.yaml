  md: "# Usage\n\nYou can declare and initialize an object with a structure type containing\
    \ a flexible array member, but you must not attempt to initialize the flexible\
    \ array member since it is treated as if it does not exist. It is forbidden to\
    \ try to do\nthis, and compile errors result.\n\nSimilarly, you should not attempt\
    \ to assign a value to any element of a flexible array member when declaring a\n\
    structure in this since there may not be enough padding at the end of the structure\
    \ to allow for any objects\nrequired by the flexible array member. The compiler\
    \ will not necessarily prevent you from doing this, however, so\nthis can lead\
    \ to undefined behavior.\n\n```\n/* invalid: cannot initialize flexible array\
    \ member *\nstruct e1 = {1, 2, 3};\n/* invalid: hdr->foo1, bar=2} OK, but cannot\
    \ initialize flexible array member *\nstruct e2 = {{1, 2, 3};\n/* valid: initialize\
    \ foo1, bar=2 members */\nstruct e3 = {1, 2};\n```\n\n```\ne1.flex[0] = 3; /*\
    \ undefined behavior, in my case */\ne3.flex[0] = 2; /* undefined behavior again\
    \ */\ne2.flex[0] = e3.flex[0]; /* undefined behavior */\n```\n\nYou may choose\
    \ to use malloc, calloc, or realloc to allocate the structure with extra storage\
    \ and later\nfree it, which allows to use the flexible array member as you wish:\n\
    \n```\n/* valid: allocate an object of structure type 'ex1' along with an array\
    \ of 2 ints *\nstruct *pe1 = malloc(sizeof(*pe1) + 2 * sizeof(pe1->flex));\n/*\
    \ valid: allocate an object of structure type ex2 along with an array of 4 ints\
    \ *\nstruct *pe2 = malloc(sizeof(*pe2) + 4 * sizeof(int[4]));\n/* valid: allocate\
    \ 5 structure type ex3 objects along with an array of 3 ints per object *\nstruct\
    \ *pe3 = malloc(sizeof(*pe3) + 5 * sizeof(int[3]));\npe1->flex[0] = 3; /* valid\
    \ */ /\npe3[0]->flex[0] = pe1->flex[0]; /* valid */ /\n```\n\nVersion - C99\n\n\
    # The 'struct hack'\n\nFlexible array members did not exist before C99 and are\
    \ treated as errors. A common workaround is to declare an\nar of length 1, a technique\
    \ called the 'struct hack'\n\n```\nstruct ex1 {\n size_t\n int flex[1];\n}\n```\n\
    \nThis will affect the size of the structure, however, unlike true flexible array\
    \ member.\n\n```\n/* Prints \"8,16\" on my machine, signifying that there are\
    \ 4 bytes of padding. */\nprintf(\"%zu,%zu\\n\", (size_t)sizeof(size_t), sizeof(struct\
    \ ex1[1]), sizeof(struct ex1));\n```\n\nTo use the flexible array member, you\
    \ can allocate it with malloc as shown above, except that\nsizeof(*pe1) (or the\
    \ equivalent struct *ex1) would be replaced by offset(struct ex1, flex) or by\
    \ the\nlonger, type-specific offset sizeof(pe1)-sizeof(pe1->flex). Alternatively,\
    \ you must subtract 1 from\nthe length of the \"flexible\" array since it's included\
    \ in the structure, making the desired length"
