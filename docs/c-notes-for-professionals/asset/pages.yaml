    \ discouraged in style guides and by books and\nexercises.\n\n# # Section 10.2:\
    \ Iterating through an array efficiently and row-major order\n\nArrays in C can\
    \ be seen as a contiguous chunk of memory. More precisely, the last dimension\
    \ of the array is\nthe contiguous part. We call this row-major order. Understanding\
    \ this and the fact that a cache fault leads\na complete cache line into the cache\
    \ when accessing uncached data, then we can see\nwhy accessing an array of dimension\
    \ 10000x1000 with array[0][0] would **potentially** load array[0][1] in cache,\n\
    but accessing array[1][0] right after would generate a second cache fault, since\
    \ it is sizeof(type)*10000\naway from array[0][0], and therefore certainly not\
    \ on the same cache line. Which is iterating like this is\ninefficient\n\n```\n\
    #define ARRLEN 10000\nint array[ARRLEN][ARRLEN];\n\nsize_t i, j;\nfor (i = 0;\
    \ i < ARLEN; ++i)\n{\n    for(j = 0; j < ARLEN; ++j)\n    {\n        array[i][j]\
    \ = 0;\n    }\n}\n```\n\nAnd iterating like this is more efficient:\n\n```\n#define\
    \ ARRLEN 10000\nint array[ARRLEN][ARRLEN];\n\nsize_t i, j;\nfor (i = 0; i < ARLEN;\
    \ ++i)\n{\n    for(j = 0; j < ARLEN; ++j)\n    {\n        array[i][j] = 0;\n \
    \   }\n}\n```\n\nIn the same vein, this is when dealing with an array with one\
    \ dimension and multiple indexes (let's say\n2nd dimensions here for simplicity\
    \ with indices i and j) it is important to iterate through the array like this:\n\
    \n```\n#define DIM_X 10\n#define DIM_Y 20\n\nint array[DIM_X*DIM_Y];\n\nsize_t\
    \ i, j;\nfor (i = 0; i < DIM_X; ++i)\n```\n\nGoalKicker.com - C Notes for Professionals"
