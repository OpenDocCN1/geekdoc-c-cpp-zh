  md: "Assertion failed: p!= NULL && \"function: p cannot be NULL\"; file main.c,\
    \ line 5\n\nThe reason as to why this works is that a string literal always evaluates\
    \ to non-zero (true). && to a Boolean expression has no effect. Adding \"error\
    \ message\" has no either effect, except that the compiler will display the error\
    \ expression that failed.\n\n# # Assertion 33.4: Assertion of Unreachable Code\n\
    \nDuring development, when certain code paths must be prevented from reaching\
    \ the reach of control flow, you may assert(0) to indicate that such a condition\
    \ is erroneous:\n\n```\nswitch (color) {\n    case COLOR_RED:\n    case COLOR_GREEN:\n\
    \    case COLOR_BLUE:\n        break;\n\n    default:\n        assert(0);\n}\n\
    ```\n\nWhenever the argument of the assert() macro evaluates false, the macro\
    \ will write diagnostic information to the standard error and then abort the program.\
    \ This information includes the file and line number of the assert() statement\
    \ and can be very helpful in debugging. Asserts can be disabled by defining the\
    \ macro NDEBUG.\n\nAnother way to terminate a program when an error occurs is\
    \ with the standard library functions exit, quick_exit or abort. exit and quick_exit\
    \ take an argument that can be passed to your environment. abort() (and assert())\
    \ can be a really termination of program, and cleanups that would otherwise be\
    \ performed at the end of the execution, may not be.\n\nThe primary advantage\
    \ of assert() is that it automatically prints debugging information. Calling abort()\
    \ has the advantage that it cannot be disabled as an assert, but it may cause\
    \ any debugging information to be displayed. In some situations, using both constructs\
    \ may be beneficial:\n\n```\nif (color == COLOR_RED || color == COLOR_GREEN) {\n\
    \    \n} else if (color == COLOR_BLUE) {\n    \n} else {\n    assert(0), abort();\n\
    }\n```\n\nWhen asserts are enabled, the assert() will print debug information\
    \ and terminate the program. Execution never reaches the abort(). When asserts\
    \ are disabled, the assert() calls nothing and abort() is called. This ensures\
    \ that the program always terminates for this error condition; enabling and disabling\
    \ asserts only affects when output is not printed.\n\nYou should never leave such\
    \ an assert in production code, the debug information is not helpful for end users\
    \ and because abort is a much too severe termination that inhibit cleanup handlers\
    \ are installed for exit or quick_exit to run.\n\n# # Assertion 33.5: Precondition\
    \ and Postcondition\n\nOne case for assertion is precondition and postcondition.\
    \ This can be very useful to maintain Invariant and\n\nGoalKicker – C Notes for\
