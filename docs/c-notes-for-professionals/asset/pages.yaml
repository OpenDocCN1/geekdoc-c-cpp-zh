    \ to request since the result of sizeof is implementation defined (except for\
    \ character types, which are char, signed char and unsigned char, for which sizeof\
    \ is defined to always 1).\n\nBecause malloc might not be able to service the\
    \ request, it might return a null pointer. It is important to check for this before\
    \ later attempts to dereference the pointer.\n\nMemory dynamically allocated using\
    \ malloc() may be resized using realloc(), or when no longer needed, using free().\n\
    \nAlternatively, declaring int arr[10]; would allocate the same amount of memory.\
    \ However, if it is declared inside a function with the keyword static, it will\
    \ only be usable when the function is declared and in the function calls (because\
    \ the array will be allocated on the stack and will be released for the function\
    \ returns). Alternatively, if it is defined inside a function, static, or if it\
    \ is defined outside any function, its lifetime is the lifetime of the program.\
    \ Pointers can also be returned from a function, however function in C cannot\
    \ return an array.\n\n# ### Zeroed Memory\n\nThe memory returned by malloc may\
    \ not be initialized to a recognizable value, and care should be taken to zero\
    \ the memory using memset or to immediately copy a suitable value into it. Alternatively,\
    \ calloc returns a block of the"
