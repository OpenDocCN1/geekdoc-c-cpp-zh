  md: "```\nprintf(\"Factorial = %d\\n\", 3, factorial(3));\nreturn 0;\n```\n\nSample\
    \ output\n\nFactorial 3 = 6\n\nThis function will terminate as it hits the condition\
    \ n is equal to 1 (provided the initial value of n is small enough — the upper\
    \ bound is 12 when int is a 32-bit quantity).\n\nRules to be followed:\n\n+  \
    \ 1. Initialize the algorithm. Recursive programs often need a seed value to start\
    \ with. This is accomplished either by using a parameter passed to the function\
    \ or by providing a gateway function that is non-recursive but sets up the seed\
    \ values for the recursive calculation.\n2. Check to whether the current value\
    \ being processed match the base case. If so, process and return the value.\n\
    3. Redefine the answer in terms of a smaller or simpler sub-problem or sub-problems.\n\
    4. Run the algorithm on the sub-problem.\n5. Combine the results in the formulation\
    \ of the answer.\n6. Return the results.\n\nSource: Recursive Function\n\n# Section\
    \ 63.21: Overstepping array boundaries\n\nArrays are zero-based, that the index\
    \ starts at 0 and ends with array length minus 1. Thus the following code will\
    \ not output the first element of the array and will output garbage for the final\
    \ value that it prints.\n\n```\n#include <stdio.h>\n\nint main(void)\n{\n    int\
    \ x = 0;\n    int myArray[5] = {1, 2, 3, 4, 5}; //Declaring 5 elements\n    for(x\
    \ = 1; x <= 5; x++)//Looping from 1 till 5.\n        printf(\"%d\\t\", myArray[x]);\n\
    \n    printf(\"\\n\");\n    return 0;\n}\n```\n\nOutput: 2 3 4 5 GarbageValue\n\
    \nThe following demonstrates the correct way to achieve the desired output.\n\n\
    ```\n#include <stdio.h>\n\nint main(void)\n{\n    int x = 0;\n    int myArray[5]\
    \ = {1, 2, 3, 4, 5}; //Declaring 5 elements\n    for(x = 0; x < 5; x++)//Looping\
    \ from 0 till 4.\n        printf(\"%d\\t\", myArray[x]);\n```\n\nGoalKicker –\
    \ C Notes for Professionals"
