  md: '# Chapter 7: Literals for numbers,

    characters and strings


    # Section 7.1: Floating point literals


    Floating point literals are used to represent signed real numbers. The following
    suffixes can be used to specify type

    of a literal:


    | Suffix | Type | Examples |

    | --- | --- | --- |

    | none | double | 3.1415926 |

    | f, F | float | 3.1415926f 2.1E-6 |

    | 1, L | long double | 3.1415926L 12E-6 |


    In order to use these suffixes, the literal must be a floating point literal.
    For example, 3f is an error, 3 is an

    integer literal, while 3.f or 3.0f are correct. For long double, the recommendation
    is to always use capital L for

    sake of readability.


    # Section 7.2: String literals


    String literals are used to specify arrays of characters. They are sequences of
    characters enclosed within double

    quotes (e.g. "abcd" and have the type char*).


    The L prefix makes the literal a wider character array, of type wchar*. For example,
    L"abcd".


    Since C11, there are other encoding prefixes, similar to L:


    | prefix type | encoding |

    | --- | --- |

    | none char | platform dependent |

    | L wchar_t | platform dependent |

    | u8 char | UTF-8 |

    | u | char16_t | usually UTF-16 |

    | U | char32_t | usually UTF-32 |


    For the latter two, it can be queried with feature macros if the encoding is effectively
    the corresponding UTF

    encoding.


    # Section 7.3: Character literals


    Character literals are a special type of integer literals that are used to represent
    one character. They are enclosed in

    squotes, ''a'' and have the type int. The value of the literal is an integer value
    adequate to the machine''s

    character set. They do not allow suffixes.


    The L prefix before a character literal makes it a wide character of type wchar_.
    Likewise C11 u and U prefixes

    make it characters type char16_t and char32_t, respectively.


    When intending to represent special characters, such as a character that is non-printing,
    escape sequences

    are used. Escape sequences use a sequence of characters that are translated into
    another character. All escape

    consist of two or more characters, the first of which is a backslash \. The characters
    immediately

    following the backslash determine what character sequence is interpreted.


    # Escape Sequence Represented Character'
