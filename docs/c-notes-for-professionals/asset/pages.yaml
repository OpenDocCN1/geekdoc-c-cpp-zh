    # Conditional Signature Modification


    In most cases a release of an application is expected to have as little overhead
    as possible. During however testing of an interim build, additional logs and information
    about problems found can be helpful.


    For example there is some function SHORT SerOpU1AllRead(PLUIF *pif, UShortLocknd)
    when doing a test build it desired will generate a log about its. However this
    function is used in multiple places and it is desired that generating the log,
    part of information is to know where the function is called from.


    So conditional compilation you can have something like the following in the file
    declaring the function. The preprocessor is to replace calls to the function SerOpU1AllRead()
    with calls to the function SerOpU1AllRead_Debug() with two additional arguments,
    the name of the file and the line number where the function is used.


    Conditional compilation is used to choose whether to override the standard function
    with a debug version or not.


    ```

    #if 0

    // function declaration and prototype for our debug version of the function.

    SHORT SerOpU1AllRead_Debug(PLUIF *pif, UShortLocknd, *asFilePath, int nLineNo);

    // macro to replace function call using old name with debug function with additional
    arguments.

    #define SerOpU1AllRead(pif, usLock) SerOpU1AllRead_Debug(pif, usLock, __FILE__,
    __LINE__)

    #else

    // standard function declaration that is normally used with builds.

    SHORT SerOpU1AllRead(PLUIF *pif, UShort Locknd);

    #endif

    ```'
