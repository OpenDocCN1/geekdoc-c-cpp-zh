    \ with m rows and n columns. **Note:** The order does matter in C. The array a[4][3]\
    \ is not the same as the array int a[3][4]. The number of rows comes first as\
    \ C is a row-major language.\n\nA two-dimensional array, which contains three\
    \ rows and four columns can be shown as follows:\n\n| Column 0 | Column 1 | Column\
    \ 2 | Column 3 |\n|---|---|---|---||\n| Row 0 | a[0][0] | a[0][1] | a[0][2] |\
    \ a[0][3] |\n| Row 1 | a[1][0] | a[1][1] | a[1][2] | a[1][3] |\n| Row 2 | a[2][0]\
    \ | a[2][1] | a[2][2] | a[2][3] |\n\nThus, every element in the array is identified\
    \ by an element name of a[i][j], where i is the name of the array, i represents\
    \ row, and j represents column. Recall that rows and columns are zero indexed,\
    \ which is very similar to mathematical notation for subscript 2-D matrices.\n\
    \n# Initializing Two-Dimensional Arrays\n\nMultidimensional arrays can be initialized\
    \ by specifying bracketed values for each row. The following example defines an\
    \ array with 3 rows where each row has 4 columns.\n\n```\nint a[3][4] = {\n  \
