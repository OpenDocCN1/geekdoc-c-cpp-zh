  md: 'region to another. Most of these functions have undefined behavior when the
    source and destination regions overlap.


    For example, this ...


    ```

    #include <string.h> /* for memcpy() */


    char str[19] = "This is an example";

    memcpy(str + 7, str, 10);

    ```


    ... attempts to copy 10 bytes where the source and destination memory areas overlap
    by three bytes. To visualize:


    ![](img/ce8e1154ba1896b573d12345aa34d5d7_174_0.png)


    Because of the overlap, the resulting behavior is undefined.


    Among the standard library functions with a limitation of this kind are memcpy(),
    strcpy(), strcat(), sprintf(), and sscanf(). The standard says of these and several
    other functions:


    > If copying takes place between objects that overlap, the behavior is undefined.


    The memmove() is the principal exception to this rule. Its definition specifies
    that the function behaves as if the source data were first copied into a temporary
    buffer and then written to the destination address. There is no exception for
    overlapping source and destination regions, nor for any one, so memmove() has
    well-defined behavior in such cases.


    The distinction reflects an efficiency vs. generality tradeoff. Copying as these
    functions perform usually occurs between disjoint regions of memory, and it is
    possible to know at development time whether a particular instance of memory copying
    will be in that category. Non-overlapping affords preventively more efficient
    implementations that do not produce correct results when the assumption does not
    hold. Most library functions allow the more efficient implementations, and memmove()
    fills in the gaps, serving the cases where the source and destination may overlap.
    To produce the correct effect in all cases, however must perform additional tests
    and/ employ a less efficient implementation.


