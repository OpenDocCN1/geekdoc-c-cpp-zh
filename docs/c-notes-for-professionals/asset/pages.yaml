  md: "# # Chapter 29: Random Number Generation\n\n# ## Section 29.1: Basic Random\
    \ Number Generation\n\nThe function `rand()` can be used to generate a pseudo-random\
    \ integer value between 0 and `RAND_MAX` (and `RAND_MAX`, included).\n\n`rand(int)`\
    \ is used to seed the pseudo-random number generator. Each time `rand()` is seeded\
    \ with the same seed, it must produce the same sequence of values. It should only\
    \ be seeded once before calling `rand()`. It should not be repeatedly seeded,\
    \ or every time you wish to generate a new batch of pseudo-random numbers.\n\n\
    Standard practice is to use the result of `time(NULL)` as a seed. If your random\
    \ number generator requires to have a deterministic sequence, you can seed it\
    \ with the same value on each program start. This is generally not required for\
    \ release code, but is useful in debug runs makes bugs reproducible.\n\nIt is\
    \ advised to seed the generator, if not seeded, it behaves as if it was seeded\
    \ with `srand(1)`.\n\n```\n#include <stdio.h>\n#include <stdlib.h>\n#include <time.h>\n\
    \nint main(void) {\n    int i;\n    srand(time(NULL));\n    i = rand();\n\n  \
    \  printf(\"Random value between [0, %d]: %d\\n\", RAND_MAX, i);\n    return 0;\n\
    }\n```\n\nPossible output:\n\nRandom value between [0, 2147483647]: 823321433\n\
    \nNotes:\n\nThe C Standard does not guarantee the quality of the random sequence\
    \ produced. In the past, some implementations of `rand()` had serious issues in\
    \ distribution and randomness of the generated numbers. The **usage of `rand()`\
    \ is not recommended for serious random number generation**, like cryptography.\n\
    \n# ## Section 29.2: Permuted Congruential Generator\n\nHere's a standalone random\
    \ number generator that doesn't rely on `rand()` or similar library functions.\n\
    \nWhy would you want such a thing? Maybe you don't trust your platform's builtin\
    \ random number generator, or you want a reproducible sequence of randomness independent\
    \ of particular library implementation.\n\nThis code uses PCG32 from `pcg-random.org`,\
    \ a modern, fast, general-purpose RNG with excellent statistical properties. It's\
    \ not cryptographically secure, so don't use it for cryptography.\n\n```\n#include\
    \ <stdint.h>\n\n/* minimal PCG32 code / (c) 2014 M.E. O'Neill / pcg-random.org\n\
    * Licensed under Apache License 2.0 (NO WARRANTY, etc. see website) */\n```"
