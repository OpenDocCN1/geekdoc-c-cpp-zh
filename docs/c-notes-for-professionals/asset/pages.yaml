    ```

    /* Assuming an int is 32-bits wide, the value ''5 * 2^72'' doesn''t fit

    * in an int. So, this is undefined. */

    ```


    ```

    int x = 5 << 72;

    ```


    Note that right shift on a negative value (e.g -5 >> 3) is not undefined but implementation-defined.'
