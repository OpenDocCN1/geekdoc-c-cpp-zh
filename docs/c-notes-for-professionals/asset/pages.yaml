  md: "# Chapter 15: Iteration Statements/Loops:\nfor, while, do-while\n\n# Section\
    \ 15.1: For loop\n\nIn order to execute a block of code over and again, loops\
    \ comes into the picture. The for loop is be used when a block of code is executed\
    \ a fixed number of times. In order to fill an array of size n with the user inputs,\
    \ we need to execute scanf() for n times.\n\n```\nVersion = C9\n#include <stdio.h>\
    \ // for size_t\nint array[10];             // array of 10 int\nfor (size_t i\
    \ = 0; i < 10; i++) // i starts at 0 and finishes with 9\n    scanf(\"%d\", &array[i]);\n\
    ```\n\nIn this way scanf() function is called n times (10 times in our example),\
    \ but is written only once.\n\nHere, the variable is the loop index, and it is\
    \ best declared as the type size_t (size type) should be used for everything that\
    \ counts or loops through data objects.\n\nThis way declaring variables inside\
    \ the for is only available for compilers that have been updated to the C99 standard.\
    \ If for some reason you are stuck with an older compiler you can declare the\
    \ loop index before the for loop:\n\n```\nVersion < C99\n#include <stdio.h> //\
    \ for size_t *\nsize_t i;\nint array[10];             // array of 10 int *\nfor\
    \ (i = 0; i < 10; i++) // * i starts at 0 and finishes at 9 *\n    scanf(\"%d\"\
    , &array[i]);\n```\n\n# Section 15.2: Loop Unrolling and Duff's Device\n\nSometimes,\
    \ the straight forward loop cannot be entirely contained within the loop body.\
    \ This is because, the loop needs to be primed by statements B. Then, the iteration\
    \ begins with statements A, which are then followed by B before looping.\n\n```\n\
    do_B();\nwhile (condition) {\n    do_A();\n    do_B();\n}\n```\n\nTo avoid potential\
    \ case problems with repeating B in the code, Duff's Device could be applied to\
    \ start the loop from the middle body, using a switch statement and fall through\
    \ behavior.\n\n```\nswitch (true) while (condition) {\ncase false: do_A(); /*\
    \ FALL THROUGH */\n```"
