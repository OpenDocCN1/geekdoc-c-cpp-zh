    "func is function returning pointer to function returning pointer to int"


    As you can see, this rule can be quite useful. You can use it to sanity check
    yourself while you are creating declarations, and to give you a hint about to
    put the next symbol and whether parentheses are required.


    Some declarations look much more complicated than they are due to array sizes
    and argument lists in prototype form. If you see [3], that''s read as "array (size
    3)..." If you see (char *,int) that''s read as "*function expecting (char *,int
    and returning...).)"


    Here''s a one:


    ```

    int (*fun_one(char *,double))[9][20];

    ```


    I won''t go through each of the steps to decipher this one.


    *fun_one is pointer to function expecting (char ,double) and returning pointer
    to array (size 9) of array (size 20) of int.


    As you can see, it''s not complicated if you get rid of the array sizes and argument
    lists:


    ```

    int (*fun_one())[9][];

    ```


    You can decipher it that way, and then put in the array sizes and argument lists
    later.


    Some final words:


    It is quite possible to make illegal declarations using this rule, so some knowledge
    of what''s legal in C is necessary. For instance, if you have been:


    ```

    int (*fun_one())[9][];

    ```


