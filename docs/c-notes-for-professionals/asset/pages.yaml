  md: "A classic example is the signal function from <signal.h>. The declaration for\
    \ it (from the C standard) is:\n\n```\nvoid (*signal(int sig, void (*func)(int)))(int);\n\
    ```\n\nThat's a function that takes two arguments — an int and a pointer to a\
    \ function which takes an int as an argument and returns nothing — which returns\
    \ a pointer to function its second argument.\n\nIf we defined a type SigCatcher\
    \ as an alias for the pointer to function type:\n\n```\ntypedef void (*SigCatcher)(int);\n\
    ```\n\nthen we could declare signal() using:\n\n```\nSigCatcher signal(int sig,\
    \ SigCatcher func);\n```\n\nOn the whole, this is easier to understand (even though\
    \ the C standard did not elect to define a type to do the job). The signal function\
    \ takes two arguments, an int and it returns a SigCatcher — where SigCatcher is\
    \ a pointer to a function that takes an int argument and returns nothing.\n\n\
    Using typedef names for pointer types makes life easier, it can also lead to confusion\
    \ for others who will maintain your code later on, so use with caution and proper\
    \ documentation. See also pointers.\n\n# Section 42.3: Simple Uses of Typedef\n\
    \nFor short names to a data type\n\nInstead of:\n\n```\nlong int foo;\nstruct\
    \ mystructure object;\n```\n\none can use\n\n```\n/* write once */\ntypedef long\
    \ long ll11;\ntypedef struct mystructure mystruct;\n\n/* use whenever needed */\n\
    l11 foo;\nmystruct object;\n```\n\nThis reduces the amount of typing needed if\
    \ the type is used many times in the program.\n\nImproving portability\n\nThe\
    \ attributes of data types vary across different architectures. For example, an\
    \ int may be a 2-byte type in implementation and an 4-byte type another. Suppose\
    \ a program needs to use a 4-byte type to run correctly.\n\nIn one implementation,\
    \ the size of int be 2 bytes and that of long be 4 bytes. In another, the size\
    \ of int be 4 bytes and that of long be 8 bytes. If the program is written using\
    \ the second implementation,\n\n```\n/* program expecting a 4 byte integer */\n\
    \ foo; /* needing to hold 4 bytes to work */\n/* some code involving many ints\
    \ */\n```"
