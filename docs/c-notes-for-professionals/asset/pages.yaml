  md: "# Chapter 33: Assertion\n\n| Parameter | Details |\n|---|---|\n| expression\
    \ | scalar type. string literal to be included in the diagnostic message. |\n\n\
    assertion is a predicate that the presented condition must be true at the moment\
    \ the assertion is encountered by the software. Most common are simple assertions,\
    \ which are validated at execution time. However, static assertions are checked\
    \ at compile time.\n\n# Section 33.1: Simple Assertion\n\nAn assertion is a statement\
    \ used to assert that a fact must be true when line of code is reached. Assertions\
    \ are useful for ensuring expected conditions are met. When the condition passed\
    \ to an assertion is true, there is no action. The behavior on false conditions\
    \ depends on compiler flags. When assertions are enabled, a false input causes\
    \ an immediate program halt. When they are disabled, no action is taken. It is\
    \ common practice to enable assertions in internal and debug builds, and disable\
    \ them in release builds, thus assertions often enabled in release. (Whether termination\
    \ is better or worse depends on the program.) Assertions should be used only to\
    \ catch programming errors, which usually means passing bad parameters.\n\n```\n\
    #include <stdio.h>\n/* Uncomment to disable 'assert()' */\n/* #define NDEBUG */\n\
    #include <assert.h>\n\nint main(void) {\n    int x = -1;\n    assert(x >= 0);\n\
    \n    printf(\"%x = %d\\n\", x);\n    return 0;\n}\n```\n\nPossible output with\
    \ NDEBUG undefined:\n\n```\na.out: main.c:9: main: Assertion 'x >= 0' failed.\n\
    ```\n\nPossible output with NDEBUG defined:\n\n```\nx = -1\n```\n\nIt's good practice\
    \ to define NDEBUG globally, so that you can easily compile your code with all\
    \ assertions either or off. An easy way to define this is NDEBUG as an option\
    \ to the compiler, or define it in a shared configuration header (e.g. config.h).\n\
    \n# Section 33.2: Static Assertion\n\nVersion C11\n\nStatic assertions are used\
    \ to check if a condition is true when the code is compiled. If it isn't, the\
    \ compiler is required to issue an error message and stop the compilation process."
