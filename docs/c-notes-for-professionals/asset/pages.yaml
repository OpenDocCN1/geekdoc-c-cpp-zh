  md: "# # Chapter 1: Getting started with C Language\n\n| Version | Standard | Publication\
    \ Date |\n| K&R | n/a | 1978-02-22 |\n| C89 | ANSI X3.159-1989 | 1989-12-14 |\n\
    | C90 | ISO/IEC 9899:1990 | 1990-12-20 |\n| C95 | ISO/IEC 9899/AMD1:1995 | 1995-03-30\
    \ |\n| C99 | ISO/IEC 9899:1999 | 1999-12-16 |\n| C11 | ISO/IEC 9899:2011 | 2011-12-15\
    \ |\n\n# ## Section 1.1: Hello World\n\nTo create a C program which prints \"\
    Hello, World\" on the screen, use a text editor to create a new file (hello.c\
    \ — the file extension must be .c) containing the following source code:\n\nhello.c\n\
    \n```\n#include <stdio.h>\n\nint main(void) {\n    puts(\"Hello, World\");\n \
    \   return 0;\n}\n```\n\nLive demo on Coliru\n\nLet's look at this simple program\
    \ line by line\n\n```\n#include <stdio.h>\n```\n\nThis line tells the compiler\
    \ to include the contents of the standard library file stdio.h in the program.\
    \ Headers are usually files containing function declarations, macros and data\
    \ types, and you must include the header before you use it. This line includes\
    \ stdio.h so it can call the function puts().\n\nSee more about headers.\n\n```\n\
    int main(void)\n```\n\nThis line starts the definition of a function. It states\
    \ the name of the function (main), the type and number of arguments it expects\
    \ (void, meaning none), and the type of value that this function returns (int).\
    \ Program execution starts in the main() function.\n\n```\n{\n  ...\n}\n```\n\n\
    The curly braces are used in pairs to indicate where a block of code begins and\
    \ ends. They can be used in a lot of ways, but in this case they indicate where\
    \ the function begins and ends.\n\n```\nputs(\"Hello, World\"); function to output\
    \ text to standard output (the screen, by default), followed by a newline.\n```\n\
    \nGoalKicker.com – C Notes for Professionals"
  merge: -1
