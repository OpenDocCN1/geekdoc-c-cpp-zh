    #ifndef HEADERFILE_H\n#define HEADERFILE_H\n\nint complicated1(int input);\nint\
    \ complicated2(int input);\n\ninline int timestowo(int input) {\n    return input\
    \ * 2;\n}\nninline int plusfive(int input) {\n```"
