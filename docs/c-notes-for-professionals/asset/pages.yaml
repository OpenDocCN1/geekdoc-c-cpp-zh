    \ int for a short int)\n\nva_list src current argument pointer to copy\n\nva_list\
    \ dst new argument list to be filled\n\nVariable arguments are used by functions\
    \ in the printf family (printf, fprintf, etc) and others to allow a function\n\
    to be called with a different number of arguments each time, hence the name varargs.\n\
    \nTo implement functions using the variable arguments feature, use #include <stdarg.h>.\n\
    \nTo call functions that take a variable number of arguments, ensure there is\
    \ a full prototype with the trailing\nellipsis in void err_exit(const char *format,\
    \ ...); for example.\n\n# Section 32.1: Using an explicit count argument to determine\n\
    t length of the va_list\n\nWith any variadic function, the function must know\
    \ how to interpret the variable arguments list. With the printf()\nor scanf(),\
    \ the format string tells the function what to expect.\n\nThe simplest technique\
    \ is to pass an explicit count of the arguments (which are generally the same\
    \ type).\nthis is demonstrated in the variadic function in the code below which\
    \ calculates the sum of a series of integers,\nwhere there may be any number of\
    \ integers but count is specified as an argument prior to the variable\nargument\
    \ list.\n\n```\n#include <stdio.h>\n#include <stdarg.h>\n\n/* first arg is the\
    \ number of following int args to sum. */\nint sum(int n, ...) {\n  int sum =\
    \ 0;\n  va_list it; /* hold information about the variadic argument list. */\n\
    \  va_start(it, n); /* start variadic argument processing */\n  while (n--) {\n\
    \    sum += va_arg(it, int); /* get and sum the next variadic argument */\n  }\n\
    \  va_end(it); /* end variadic argument processing */\n  return sum;\n}\n\nint\
    \ main(void) {\n  printf(\"%d\\n\", sum(5, 1, 2, 3, 4, 5)); /* prints 15 */\n\
    \  printf(\"%d\\n\", sum(10, 5, 9, 2, 5, 11, 6666, 42, 1, -6218)); /* prints 666\
    \ */\n  return 0;\n}\n```"
