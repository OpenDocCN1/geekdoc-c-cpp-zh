    # Section 28.10: Modifying any object more than once between two sequence points


    ```

    int i = 42;

    i = i++; /* Assignment changes variable, post-increment as well */

    int a = i++ + i--;

    ```


    Code like this leads to speculations about the "resulting value" of i. Rather
    than specifying an outcome, the C standards specify that evaluating such an expression
    produces undefined behavior. Prior to C2011, the standard formalized these rules
    in so-called sequence points:


    > Between the previous and next sequence point a scalar object shall have its
    stored value modified at most once by the evaluation of an expression. Furthermore,
    the prior value shall be read only to determine the value to be stored.


    (C99 standard, section 6.5, paragraph 2)


    That scheme proved to be a little too coarse, in some expressions exhibiting undefined
    behavior with C99 that should not be. C2011 replaces sequence points, but introduces
    a more nuanced approach to this area through sequencing and a relationship it
    calls "sequenced before":


    > A side effect on a scalar object is unsequenced relative to either a different
    side effect on the same scalar object or a computation using the value of the
    same scalar object, the behavior is undefined. If there are multiple allowable
    order of the subexpressions of an expression, the behavior is undefined if such
    an unsequenced effect occurs in any of the orderings.


    (C2011 standard, section 6.5, paragraph 2)


    The full details of the "sequenced before" relation are too long to describe here,
    but they sequence points rather than supplementing them, they have the effect
    of defining behavior for some evaluations


