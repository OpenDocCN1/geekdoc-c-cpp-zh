    {\n    value.param1 *= 2;\n    return value;\n}\n```\n\n```\n// Passing the large\
    \ struct by pointer instead, fairly fast\nvoid doubleParam1ByPtr(struct lotsOfData\
    \ *value)\n{\n    value->param1 *= 2;\n}\n```\n\n# Section 13.5: Object-based\
    \ programming using structs\n\nStructs may be used to implement code in an object\
