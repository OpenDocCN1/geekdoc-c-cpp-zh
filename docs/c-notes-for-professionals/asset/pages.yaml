  md: "# Section 32.2: Using terminator values to determine the end of va_list\n\n\
    With any variadic function, the function must know how to interpret the variable\
    \ arguments list. The \"traditional\" approach (exemplified by printf()) is to\
    \ specify number of arguments. However, this is not always a good idea:\n\n```\n\
    * First argument specifies the number of parameters; the remainder are also int\
    \ */\nextern sum(int n, ...);\n\n/* But it's far from obvious from the code. */\n\
    sum(5, 2, 1, 4, 3, 6)\n\n/* What happens if i.e. one argument is removed later\
    \ on? */\nsum(5, 2, 1, 3, 6) /* Disaster */\n```\n\nSometimes it is more robust\
    \ to add an explicit terminator, exemplified by the POSIX execclp() function.\
    \ Another function to calculate the sum of all double numbers:\n\n```\n#include\
    \ <std.h>\n#include <stdio.h>\n#include <math.h>\n\n/* Sums up until the terminator\
    \ NAN */\ndouble sum(double x, ...) {\n  double sum = 0;\n  va_list va;\n\n  va_start(va,\
    \ x);\n  for ( !isnan(x); x = va_arg(va, double)) {\n    sum += x;\n  }\n  va_end(va);\n\
    \n  return sum;\n}\n\nint main(void) {\n  printf(\"%g\\n\", sum(5, 2., 1., 4.,\
    \ 3., 6., NAN));\n  printf(\"%g\\n\", sum(1, 0.5, 0.25, 0.125, 0.0625, 0.03125,\
    \ NAN));\n}\n```\n\nGood terminator values:\n\n+   - integer (supposed to be positive\
    \ or non-negative) — 0 or -1\n- floating point types — NAN\n- pointer types —\
    \ NULL\n- enumerator types — some special value\n\n# Section 32.3: Implementing\
    \ functions with a `printf()`-interface\n\nOne common use of variable-length argument\
    \ lists is to implement functions that are a thin wrapper around the printf()\
    \ family of functions. One example is a set of reporting functions.\n\n```\nerrmsg.h\n\
    ```"
