  md: 'A C function declaration used in a C++ source file will cause link errors.
    The C++ compiler will modify the specialized name for the function using the naming
    rules for C++. The result is link errors due to externals not defined when the
    C++ compiler output is linked with the C compiler output.


    Since C compilers do not name mangling but C++ compilers do for all external labels
    (function name or variables) generated by the C++ compiler, a preprocessor macro,
    __cplusplus, was introduced to allow for detection.


    In order to work around this problem of incompatible compiler output for externals
    between C and C++, the macro __cplusplus is defined in the C++ Preprocessor and
    is not defined in the C Preprocessor. This macro name can be used with the conditional
    processor #ifdef directive or #if with the defined() operator to tell whether
    the source code or include file is being compiled as C or C.


    ```

    #ifdef __cplusplus

    printf("C++\n");

    #else

    printf("C\n");

    #endif

    ```


    Or you could use


    ```

    #ifdef defined(__cplusplus)

    printf("C++\n");

    #else

    printf("C\n");

    #endif

    ```


    In order to specify the correct function name of a function from a C source file
    compiled with the C++ compiler that the __cplusplus defined constant in order
    to declare the extern "C" { /* ... */ }; to be used to declare externals in the
    header file is included in a C++ source file. However when compiled with a C compiler,
    the extern "C" { /* ... */ }; is not used. This conditional compilation is needed
    because extern "C" { /* ... */ }; is valid in C++ but not in C.


    ```

    #ifdef __cplusplus

    // if we are being compiled with a C++ compiler declare the

    // following functions as C functions to prevent name mangling.

    extern "C" {

    #endif

    ```


    ```

    // Exported C function list.

    int foo (void);

    ```


    ```

    #ifdef __cplusplus

    // if this is a C++ compiler, we need to close off the extern declaration.

    };

    #endif

    ```


    # Section 30.7: Token pasting


    Token pasting allows to glue together two macro arguments. For example, front##back
    yields seafront. a famous example is Win32''s <CHAR.H> header. In C, one can write
    "string" to declare a wide character string. However, Windows API allow one to
    convert between character strings and narrow character strings simply by #defining
    UNICODE. In order to implement the string literals, TCHAR.H uses this


    ```

    #define UNIC

    #define TCHAR(X) L##

    ```'
