  md: "function has no parameters. The empty list in a function declarator that is\
    \ not part of a definition of\nfunction specifies no information about the number\
    \ or types of the parameters is supplied.\n\nA simplified explanation provided\
    \ by K&R (pgs: 72-73) for the above stuff:\n\n> Furthermore, if a function declaration\
    \ does not include arguments, as in\ndouble atof(); too late to mean that nothing\
    \ is to be assumed the arguments of atof; all\nparameter checking is turned off.\
    \ This special meaning of the empty argument list is intended to permit\nolder\
    \ C programs to compile with new compilers. But it's a bad idea to use it with\
    \ new programs. If the\nfunction takes arguments, declare them; if it takes no\
    \ arguments, use void.\n\nSo this is how your function prototype should look:\n\
    \n```\nint foo(void);\n```\n\nAnd this is how the function definition should be:\n\
    \n```\nint foo(void)\n{\n  <statements>\n  return 1;\n}\n```\n\nOne advantage\
    \ of using the above, over int foo() type of declaration (ie, without using the\
    \ keyword void), is that\nthe compiler can detect the error if you call your function\
    \ using an erroneous statement like foo(42). This kind of\nfunction call statement\
    \ would not cause any errors if you leave the parameter list blank. The error\
    \ would pass\nsilently, undetected and the code would still execute.\n\nThis also\
    \ means you should define the main() function like this:\n\n```\nint main(void)\n\
    {\n  <statements>\n  return 0;\n}\n```\n\nNote that though a function defined\
    \ with an empty parameter list takes no arguments, it does not provide a\nprototype\
    \ for the function, the compiler will not complain if the function is subsequently\
    \ called with arguments.\nFor example:\n\n```\n#include <stdio.h>\nstatic void\
    \ parameterless()\n{\n  printf(\"%s called\\n\", __func__);\n}\nint main(void)\n\
    {\n  parameterless(3, \"arguments\", \"provided\");\n\n```"
