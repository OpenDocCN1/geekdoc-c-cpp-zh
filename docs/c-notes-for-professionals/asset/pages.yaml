  md: "# # Chapter 8: Compound Literals\n\n# ## Section 8.1: Definition/Initialisation\
    \ of Compound Literals\n\nA compound literal is an unnamed object which is created\
    \ in the scope where is defined. The concept was introduced in C99 standard. An\
    \ example for compound literal is\n\n**Examples from C standard, C11-§6.5.2/9:**\n\
    \n```\nint *p = (int [2]){ 2, 4 };\n```\n\np is initialized to the address of\
    \ the first element of an unnamed array of two ints.\n\nThe compound literal is\
    \ an lvalue. The storage duration of the unnamed object is either static (if the\
    \ literal appears at file scope) or automatic (if the literal appears at block\
    \ scope), and in the latter case the object's lifetime ends when control leaves\
    \ the enclosing block.\n\n```\nvoid f(void)\n{\n    int *p;\n    /*...*/ */\n\
    \    p = (int [2]){*p};\n    /*...*/ */\n}\n```\n\np is assigned the address of\
    \ the first element of an array of two ints, the first having the value previously\
    \ pointed to p and the second, zero...\n\nHere p remains valid until the end of\
    \ the block.\n\n# Compound literal with designators\n\n(also from C11)\n\n```\n\
    struct point {\n    unsigned x;\n    unsigned y;\n};\n\nextern void drawline(struct\
    \ point, struct point);\n\n// used somewhere like this\ndrawline((struct point){.x=1,\
    \ .y=1}, (struct point){.x=3, .y=4});\n```\n\nA fiction drawable returns two arguments\
    \ of struct point. The first has coordinates x == 1 and y == 1, whereas the second\
    \ has x == 3 and y == 4\n\n# Compound literal without specification length\n\n\
    ```\nint *p = (int []){1, 2, 3};\n```\n\nIn this case the size of the array is\
    \ not specified then it will be determined by the length of the initializer.\n\
    \n# Compound literal having length less than array size specified\n\n```\nint\
    \ *p = (int [10]){1, 2, 3};\n```"
