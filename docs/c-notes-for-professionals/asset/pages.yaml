    \    printf(\"%j is %s\\n\", is_const_int(j));\n    printf(\"%k is %s\\n\", is_const_int(k));\n\
    }\n```\n\nOutput:\n\ni is a const int\nj is a non-const int\nk is of other type\n\
    \nHowever, if the type is_const_int(x) _Generic((x)) is implemented like:\n\n\
