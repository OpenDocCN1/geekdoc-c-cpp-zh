  md: "# # Chapter 40: Implicit and Explicit Conversions\n\n# ## Section 40.1: Integer\
    \ Conversions in Function Calls\n\nGiven that the function has a proper prototype,\
    \ integers are widened for calls to functions according to the rules of integer\
    \ conversion, C11 6.3.1.3.\n\n+   6.3.1.3 Signed and unsigned integers\nWhen a\
    \ value with integer type is converted to another integer type other than _Bool,\
    \ if the value can be represented by the new type, it is unchanged.\nOtherwise,\
    \ if the new type is unsigned, the value is converted by repeatedly adding or\
    \ subtracting one more than the maximum value that can be represented in the new\
    \ type until the value is in the range of the new type.\nOtherwise, the new type\
    \ is signed and the value cannot be represented in it; either the result is implementation-defined\
    \ or an implementation-defined signal is raised.\n\nUsually you should not truncate\
    \ a wide type to a narrower signed type, because obviously the values can't fit\
    \ and there is no clear meaning that this should. The C standard cited above defines\
    \ these cases to be \"implementation-defined\", that is, they are not portable.\n\
    \nThe following example suggests that int is 32 bit wide.\n\n```\n#include <stdio.h>\n\
    #include <stdint.h>\n\nvoid param_u8(uint8_t val) {\n    printf(\"%s val is %d\\\
    n\", __func__, val); /* val is promoted to int */\n}\n\nvoid param_u16(uint16_t\
    \ val) {\n    printf(\"%s val is %d\\n\", __func__, val); /* val is promoted to\
    \ int */\n}\n\nvoid param_u32(uint32_t val) {\n    printf(\"%s val is %d\\n\"\
    , __func__, val); /* here val fits into unsigned */\n}\n\nvoid param_u64(uint64_t\
    \ val) {\n    printf(\"%s val is %PRI64u\\n\", __func__, val); /* Fixed with format\
    \ string */\n}\n\nvoid param_s8(int8_t val) {\n    printf(\"%s val is %d\\n\"\
    , __func__, val); /* val is promoted to int */\n}\n\nvoid param_s16(int16_t val)\
    \ {\n    printf(\"%s val is %d\\n\", __func__, val); /* val is promoted to int\
    \ */\n}\n\nvoid param_s32(int32_t val) {\n    printf(\"%s val is %d\\n\", __func__,\
    \ val); /* val has same width as int */\nn\n```"
