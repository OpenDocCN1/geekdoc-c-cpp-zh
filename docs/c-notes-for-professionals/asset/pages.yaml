  md: "# # Chapter 41: Type Qualifiers\n\n# ## Section 41.1: Volatile variables\n\n\
    The `volatile` keyword tells the compiler that the value of the variable may change\
    \ at any time as a result of external conditions, not only as a result of program\
    \ control flow.\n\nThe compiler will not optimize anything that has to do with\
    \ the volatile variable.\n\n```\nvolatile int foo; /* Different ways to declare\
    \ a volatile variable *\nvolatile int foo;\nnvolatile uint8_t * pReg; /* Pointers\
    \ to volatile variable */\nuint8_t volatile = pReg;\n```\n\nThere are two main\
    \ reasons to use volatile variables:\n\n+   - To interface with hardware that\
    \ has memory-mapped I/O registers.\n- When using variables that are modified outside\
    \ the program control flow (e.g., in an interrupt service routine)\n\nLet's see\
    \ this example:\n\n```\nint quit = false;\n\nvoid main() {\n{\n    while (quit)\
    \ {\n        // Do something that does not modify the quit variable\n    }\n}\n\
    \nvoid interrupt_handler(void) {\n    quit = true;\n}\n```\n\nThe compiler is\
    \ allowed to notice the loop does not modify the quit variable and convert the\
    \ loop to an endless `while` (true) loop. Even if the quit variable is set on\
    \ the signal handler for SIGINT and SIGTERM, the compiler does not know that.\n\
    \nDeclaring it `volatile` will tell the compiler not to optimize the loop and\
    \ the problem will be solved.\n\nThe same happens when accessing hardware, as\
    \ we see in this example:\n\n```\nuint8_t * pReg = (uint8_t *) 0x1717;\n\n// Wait\
    \ for register to become non-zero\nwhile (*pReg == 0) { // Do something else\n\
    ```\n\nThe behavior of the optimizer is to read the variable's value once, there\
    \ is no need to reread it, since the value will always be the same. So to get\
    \ what we want, we modify the declaration to:\n\n```\nuint8_t volatile * pReg\
    \ = (uint8_t *) 0x1717;\n```"
