    \ 1000 long int */\n```\n\n# Memory leaks\n\nFailure to deallocate using free\
    \ leads to a buildup of non-reusable memory, which is no longer used by the program;\
    \ this is called a memory leak. Memory leaks waste memory resources and can lead\
    \ to allocation failures.\n\n# Logical errors\n\nAll allocations using malloc\
    \ (or calloc):\n\n+   1. Allocation using malloc (or calloc)\n2. Usage to store\
    \ data\n3. De-allocation using free\n\nFailure to adhere to this pattern, as using\
    \ memory after a call to free (dangling pointer) or before a call to malloc (wild\
    \ pointer), calling free twice (\"double free\"), etc., usually causes a segmentation\
    \ fault and results in a crash of the program.\n\nThese errors can be traced and\
    \ hard to debug - for example, memory is usually not immediately reclaimed by\
    \ the OS, and thus dangling pointers may persist for a while and appear to work\
    \ correctly.\n\nOn systems where it works, Valgrind is an invaluable tool for\
    \ identifying what memory is leaked and where it was originally allocated.\n\n\
    # Creating pointers to stack variables\n\nCreating a pointer does not extend the\
    \ life of the variable being pointed to. For example:\n\n```\nint* myFunction()\
    \ {\n    int x = 10;\n    return &x;\n}\n```\n\nHere, x has automatic duration\
    \ (commonly known as stack allocation). Because it is allocated on the stack,\
    \ its lifetime is only as long as myFunction; after myFunction has executed, the\
    \ variable x is destroyed. The function gets the address of x (using &x), and\
    \ returns it to the caller, the caller with a pointer to a non-existent variable.\
    \ Attempting to access this variable will then invoke undefined behavior.\n\n\
