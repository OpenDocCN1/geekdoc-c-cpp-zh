  md: 'The string to be output is included within the parentheses.


    "Hello, World" is the string that will be written to the screen. In C, every string
    literal value must be inside the double quotes ""


    See more about strings.


    In C programs, every statement must be terminated by a semi-colon (i.e. ;).


    ```

    return 0;

    ```


    When we defined main(), we declared it as a function returning an int, meaning
    it needs to return an integer. In this example, we are returning the integer value
    0, which is used to indicate that the program exited successfully. After the return
    0; statement execution will terminate.


    # Editing the program


    Simple text editors include vim or gedit on Linux, or Notepad on Windows. Cross-platform
