    \ \\ \\\n-Wmissing-declarations -Wredundant-decls -Wshadow ...\n```\n\nNote that\
    \ clang has an option -Weverthing which really does turn all warnings in clang.\n\
    \n# Section 37.4: The Preprocessor\n\nBefore the C compiler starts compiling source\
    \ code, the file is processed in a preprocessing phase. This phase can be done\
    \ by a separate program or be completely integrated into one executable. In any\
    \ case, it is invoked automatically by the compiler before compilation begins.\
    \ The preprocessing phase converts your source code into another source code or\
    \ translation unit by applying textual replacements. You can think of it as a\
    \ \"modified\" or \"expanded\" source code. That expanded source may exist as\
    \ a real file in the file system, or it may be stored in memory for a short time\
    \ before being processed.\n\nPreprocessor commands start with the pound sign (\"\
    #\"). There are several preprocessor commands; two of the most important are:\"\
    \n\n+   1. Defines:\n\n```\n#define is mainly used to define constants. For instance,\n\
    ```\n\n```\n#define BIGNUM 1000000\nint a = BIGNUM;\n```\n\nbecomes\n\n```\na\
    \ = 1000000;\n```\n\n#define is used in this way so to avoid explicitly write\
    \ out some constant value in many different places in a source code file. This\
    \ is important in case you need to change the constant value later on; it's much\
    \ less-prone to change it once, in the #define, than to have to change it in multiple\
    \ places scattered over all the code.\n\nBecause #define just does advanced search\
    \ and replace, you can also declare macros. For instance:\n\n```\n#define ISTRUE(stmt)\
