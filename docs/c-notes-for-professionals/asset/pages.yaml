  md: "# Chapter 55: Inlining\n\n# Section 55.1: Inlining functions used in more than\
    \ one source file\n\nFor small functions that get called often, the overhead associated\
    \ with the function call can be a significant fraction of the total execution\
    \ time of that function. One way of improving performance, is to eliminate the\
    \ overhead.\n\nIn this example we use four functions (plus main()) in three source\
    \ files. Two of those (plusfive() and timestowo()) each called by the other two\
