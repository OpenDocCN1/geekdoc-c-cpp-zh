  md: "# Chapter 6: Strings\n\nIn C, a string is not an intrinsic type. A C-string\
    \ is the convention to have a one-dimensional array of characters which is terminated\
    \ by a null-character, a \\ '\\0'.\n\nThis means a C-string with a content of\
    \ \"abc\" will have four characters 'a', 'b', 'c' and '\\0'.\n\nSee the basic\
    \ introduction to strings examples.\n\n# Section 6.1: Tokenisation: strtok(),\
    \ strtok_r() and strtok_s()\n\nThe function strtok breaks a string into smaller\
    \ strings, or tokens, using a set of delimiters.\n\n```\n#include <stdio.h>\n\
    #include <string.h>\n\nint main(void)\n{\n    int toknum = 0;\n    char src[]\
    \ = \"Hello, world!\";\n    const char delimiters[] = \", !\";\n    char *token\
    \ = strtok(src, delimiters);\n    while (token != NULL)\n    {\n        printf(\"\
    %d: [%s]\\n\", ++toknum, token);\n        token = strtok(NULL, delimiters);\n\
    \    }\n    /* source is now \"Hello\\0, world\\0!0\" */\n}\n```\n\nOutput:\n\n\
    ```\n1: [Hello]\n2: [world]\n```\n\nThe string of delimiters may contain one or\
    \ more delimiters and different delimiter strings may be used with each call to\
    \ strtok.\nnCall strtok to continue tokenizing the same string should not pass\
    \ the source again, but instead pass NULL as the first argument. If the same source\
    \ string is passed then the first token will be re-tokenized. That is, the given\
    \ string, strtok would simply return the first token again.\n\nNote that strtok\
    \ does not allocate memory for the tokens, it modifies the source string. That\
    \ is, in the example, the string src will be manipulated to produce the tokens\
    \ that are referenced by the pointer returned by the calls to strtok. This means\
    \ the source cannot be const (so it cannot be a string literal). It also means\
    \ that the identity of the delimiter is lost (i.e. the \"\" and \" \" are effectively\
    \ deleted from the source string and you cannot delete delimiter character).\n\
    \nNote also multiple consecutive delimiters in the source string are treated as\
    \ one; in the second comma is ignored.\n\nstrtok is neither thread safe nor re-entrant\
    \ as it uses a static buffer while parsing. That means if a function calls strtok,\
    \ no function that calls it while is using strtok can also use strtok, and it\
    \ cannot be called by any function that is using strtok."
