  md: 'The comments describe one possible layout, but because the standard says the
    alignment of the addressable storage unit is unspecified, other layouts are also
    possible.


    An unnamed bit-field may be of any size, but they can''t be initialized or referenced.


    A zero-width bit-field cannot be given a name and aligns the next field to the
    boundary defined by the datatype of the bit-field. This is achieved by padding
    bits between the bit-fields.


    The size of structure ''A'' is 1 byte.


    ```

    struct A

    unsigned char c1 : 3;

    unsigned char c2 : 4;

    unsigned char c3 : 1;


    ```


    In B, the first unnamed bit-field skips 2 bits; the zero width bit-field after
    c2 causes c3 to start from the char boundary (3 bits are skipped between c2 and
    c3). There are 3 padding bits after c4. Thus the size of the structure is 2 bytes.


    ```

    struct B

    unsigned char c1 : 1; /* Skips 2 bits in the layout */

    unsigned char c2 : 2;

    unsigned char c2 : 8; /* Causes padding up to next container boundary */

    unsigned char c3 : 4;

    unsigned char c4 : 1;


    ```


    # # Section 9.4: Don''ts for bit-fields


    +   1. Arrays of bit-fields, pointers to bit-fields and returning bit-fields are
    not allowed.

    2. The address operator (&) cannot be applied to bit-field members.

    3. The data type of a bit-field must be wide enough to contain the size of the
    field.

    4. The sizeof() operator cannot be applied to a bit-field.

    5. There is no way to create a typedef for a bit-field in isolation (though you
    can create a typedef for a structure containing bit-fields).


    ```

    typedef struct myfield

    unsigned char c1 : 20; /* incorrect, see point 3 */

    unsigned char c2 : 4; /* correct */

    unsigned char c3 : 1;

    unsigned int x[10] : 5; /* incorrect, see point 1 */


    ```


    ```

    int SomeFunction(void)

    // Somewhere in the code

    a = { ... };

    printf("Address of a2 is %p\n", &a2); /* incorrect, see point 2 */

    printf("Size of a2 is %zu\n", sizeof(a2)); /* incorrect, see point 4 */


    ```'
