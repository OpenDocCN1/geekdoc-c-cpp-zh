  md: "```\nreturn EXIT_SUCCESS;\n}\n```\n\nThe reallocated object may not have the\
    \ same address as *p. Therefore it is important to capture the return\nvalue from\
    \ realloc which contains the new address if the call is successful.\n\nMake sure\
    \ you assign the return value of realloc to a temporary instead of the original\
    \ p. realloc will return null\n case of any failure, which would overwrite the\
    \ pointer. This would lose your data and create a memory leak.\n\n# Section 46.4:\
    \ realloc(ptr, 0) is not equivalent to free\n\nrealloc is conceptually equivalent\
    \ to malloc + memcpy + free on the other pointer.\n\nIf the size requested is\
    \ zero, the behavior of realloc is implementation-defined. This is similar for\
    \ all\nmemory allocation functions that receive a size parameter of zero. Such\
    \ functions may fact return a non-null\\pointer, but must not be dereferenced.\n\
    \nThus, realloc(ptr,0) is not equivalent to free(ptr). It may\n\n+   - be a \"\
    lazy\" implementation and just return ptr\n- free(ptr), allocate a dummy element\
    \ and return that\n- free(ptr) and return zero\n- just return zero for failure\
    \ and do nothing else.\n\nThis means realloc(ptr,0) may not free/deallocate the\
    \ memory, and it should never be used as a\nreplacement for free.\n\n# Section\
    \ 46.5: Multidimensional arrays of variable size\n\nVersion C99\n\nSince C99 has\
    \ variable length arrays, VLA, that model arrays with bounds that are only known\
    \ at initialization\ntime. When have to be careful not to allocate large VLA (they\
    \ might squash your stack), pointers to VLA\nand using them in sizeof expressions\
    \ is fine.\n\n```\ndouble sumAll(size_t n, size_t m, double A[n][m]) {\n  double\
    \ ret = 0;\n  for (size_t i = 0; i < n; ++i) {\n    for (size_t j = 0; j < m;\
    \ ++j) {\n      ret += A[i][j];\n    }\n  }\n  return ret;\n}\n\nint main(int\
    \ argc, char *argv[argc]) {\n  size_t n = *argc=10;\n  size_t m = *argc=8;\n \
    \ double (*matrix) = malloc(sizeof(double[n][m]));\n  // initialize matrix somehow\n\
    \  double res = sumAll(n, m, matrix);\n  printf('result is %g\\n', res);\n  free(matrix);\n\
    }\n```\n\nHere is a pointer to elements of type double[m], and the sizeof expression\
    \ with double[n][m] ensures that\nit contains space for n* m elements."
