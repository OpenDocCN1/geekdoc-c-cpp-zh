    \n```\n#include <ctype.h>\n#include <stdio.h>\n\ntype struct {\n    size_t space;\n\
    \    size_t alphanum;\n    size_t punct;\n} chart;\nchart classify(const char\
    \ *s) {\n    chart types = { 0, 0, 0 };\n    const char *p;\n    for (p = s; p\
    \ != '\\0'; p++) {\n        types.space += isspace((unsigned char)p);\n      \
    \  types.alphanum += isalnum((unsigned char)p);\n        types.punct += isispunct((unsigned\
    \ char)p);\n    }\n    return types;\n}\n```\n\nThe classify function examines\
    \ all characters from a string and counts the number of spaces, alphanumeric and\
    \ punctuation characters. It avoids several pitfalls.\n\n+   - The character classification\
    \ functions (e.g. isspace) expect their argument to be either representable as\
    \ an unsigned char, or the value of the EOF macro.\n\n+   - The expression *p\
    \ is type of char and must be converted to the match above wording.\n\n+   - The\
