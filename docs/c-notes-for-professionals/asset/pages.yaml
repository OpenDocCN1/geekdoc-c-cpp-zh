    # Section 63.22: Passing unadjacent arrays to functions expecting "real" multidimensional
    arrays


    When allocating multidimensional arrays with malloc, calloc, and realloc, a common
    pattern is to allocate the inner arrays with multiple calls (even if the call
    only appears once, in a loop):


    ```

    /* Could also be int ** with malloc used to allocate outer array. */

    int *array[4];

    int i;


    /* Allocate 4 arrays of 16 ints. */

    for (i = 0; i < 4; i++)

    array[i] = malloc(16 * sizeof(array[i]));

    ```


    The difference between the last element of one of the inner arrays and the first
    element of the next array may not be zero as it would be with a "real" multidimensional
    array (e.g. int array[4][16]);


    ```

    /* 0x04000C, 0x040208 */

    printf("%%p, %p\n", (void*)array[0], (void*)array[1]);

    ```


    Taking into account the size of int, you get a difference of 812 bytes (8132-44),
    which is 2032 int-sized arrays, and the problem is: a "real" multidimensional
    array has no gaps between elements.


    If you need to use a dynamically allocated array with a function expecting a "real"
    multidimensional array, you should allocate an object of int * and use arithmetic
    to perform calculations:


    ```

    void func(int M, int N, int *array);


    /* Equivalent to declaring int array[M][N] = {{0}}; and assigning array4_16[i][j].
    */

    int *array;

    int M = 4, N = 16;

    array = calloc(M, N * sizeof(*array));

    array[i + N + j] = 1;

    func(M, N, array);

    ```


    If N is a constant or integer literal value, the code can use the more natural
    2-D array notation after allocation:


    ```

    void func(int M, int N, int *array);

    #define N 16

    void func(int M, int N, int (*array)[N]);

    ...

    int M = 4;

    int (*array)[N];

    array = calloc(M, sizeof(*array));

    array[i][j] = 1;

    ```


