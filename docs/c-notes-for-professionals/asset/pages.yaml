    | F | double | prints float with a default precision of 6, if no precision is
    given (upper-case used for special numbers NAN and INF INFINITY) |

    | e | double | prints float with a default precision of 6, if no precision is
    given, using scientific notation using mantissa/exponent; lower-case exponent
    and special numbers |

    | E | double | prints float with a default precision of 6, if no precision is
    given, using scientific notation using mantissa/exponent; upper-case exponent
    and special numbers |

