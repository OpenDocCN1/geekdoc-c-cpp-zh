  md: "# Section 63.18: Floating point literals are of double by default\n\nCare must\
    \ be taken when initializing variables of type float to or comparing with their\
    \ values, because regular floating literals like 0.1 are of type double. This\
    \ may lead to surprises:\n\n```\n#include <stdio.h>\nint main() {\n    float n;\n\
    \    n = 0.1;\n    if (n > 0.1) printf(\"Wierd\\n\");\n    return 0;\n}\n```\n\
    \n// Prints \"Wierd\" when n is float\n\nHere, n gets initialized and rounded\
    \ to single precision, resulting in value 0.10000000149011623. Then, n is converted\
    \ to double precision when compared with 0.1 literal (which equals to 0.10000000000000001),\
    \ resulting in a mismatch.\n\nBeyond rounding errors, mixing float variables with\
    \ double literals will result in poor performance on platforms which do not have\
    \ hardware support for double precision.\n\n# Section 63.19: Using character constants\
    \ instead of string literals, and vice versa\n\nIn C, character constants and\
    \ string literals are different things.\n\nA character surrounded by single quotes\
    \ 'a' is a character constant. A character constant is an integer whose value\
    \ code stands for the character. How to interpret character constants with multiple\
    \ characters like 'abc' is implementation-defined.\n\nZero or more characters\
    \ surrounded by double quotes \"abc\" is a string literal. A string literal is\
    \ an unmodifiable array elements containing the terminating null-character the\
    \ contents, \"abc\" has 4 elements ('a', 'b', 'c', '\\0')\n\nIn this example,\
    \ a character constant is used where a string literal should be used. This character\
    \ constant will be converted to an implementation-defined manner and there is\
    \ little chance for the converted pointer to be valid, so this example will invoke\
    \ undefined behavior.\n\n```\n#include <stdio.h>\nint main(void) {\n    const\
    \ char *hello = 'hello, world'; /* bad */\n    puts(hello);\n    return 0;\n}\n\
    ```\n\nIn this example, a string literal is used where a character constant should\
    \ be used. The pointer from the string literal will be converted to an integer\
    \ in an implementation-defined manner, and it will be converted to char"
  merge: -1
