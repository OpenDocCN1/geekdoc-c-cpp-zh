  md: "# # Chapter 45: Structure Padding and Packing\n\nBy default, C compilers lay\
    \ out structures so that each member can be accessed fast, without incurring penalties\
    \ for 'unaligned access, a problem with RISC machines like the DEC Alpha, and\
    \ some ARM CPUs.\n\nDepending on the CPU architecture and the compiler, a structure\
    \ may occupy more space in memory than the sum of the sizes of its component members.\
    \ The compiler can add padding between members or at the end of the structure,\
    \ but not at the beginning.\n\nPacking overrides the default padding.\n\n# ##\
    \ Section 45.1: Packing structures\n\nBy default structures are packed in C. If\
    \ you want to avoid this behaviour, you have to explicitly request it. GCC's `__attribute__((__packed_))`.\
    \ Consider this on a 64-bit machine:\n\n```\nstruct foo {\n    char *p;    /*\
    \ 8 bytes */\n    char c;      /* 1 byte */\n    long x;      /* 8 bytes */\n\
    };\n```\n\nThe structure will be automatically padded to have 8-byte alignment\
    \ and will look like this:\n\n```\nstruct foo {\n    char *p;      /* 8 bytes\
    \ */\n    char c;        /* 1 byte */\n\n    char pad[7];  /* 7 bytes added by\
    \ compiler */\n    long x;       /* 8 bytes */\n};\n```\n\nsizeof(struct foo)\
    \ will give us 24 instead of 17. This happened because of a 64-bit compiler read/write/from\
    \ Memory in 8 bytes of each word is obvious and when you try to write char c;\
    \ one byte in memory a 8 bytes (i.e. word) fetches and consumes only first of\
    \ it and its seven successive of bytes empty and not accessible for any read and\
    \ write operation for structure padding.\n\n# ### Structure packing\n\nBut if\
    \ you use `__attribute__((__packed_))` foo\n\n```\nstruct __attribute__((__packed_))\
    \ foo {\n    char *p;      /* 8 bytes */\n    char c;        /* 1 byte */\n  \
    \  long x;       /* 8 bytes */\n};\n```\n\nNow sizeof(struct foo) will return\
    \ 17.\n\nGenerally packed structures are used:\n\n+   * To save space."
