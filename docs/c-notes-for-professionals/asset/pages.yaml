  md: "# Chapter 38: Inline assembly\n\n# Section 38.1: gcc Inline assembly in macros\n\
    \nWe can put assembly instructions inside a macro and use the macro like you would\
    \ call function.\n\n```\n#define mov(x,y) \\\\\n    __asm__ (\"%l.cmov %0,%1,\"\
    2\" :=\"r\" (x) : \"r\" (y) : \"r\" (0x0000000F));\n\\n// some definition and\
    \ assignment\nunsigned char sbox[size];\nunsigned char sbox[size];\n\\n//Using\n\
    mov(state[0], sbox[si]);\n```\n\nUsing inline assembly instructions embedded in\
    \ C code can improve the run time of a program. This is very helpful in time situations\
    \ using cryptographic algorithms such as AES. For example, a simple shift operation\
    \ that is needed in the AES algorithm, we can substitute a rotate Right instruction\
    \ with C shift operator >>.\n\nIn an implementation of 'AES256', in 'AddRoundKey()'\
    \ we have some states like this:\n\n```\nunsigned int w;\nunsigned char subkey[4];\
    \ // 32-bit, 8*4 = 32\n\nsubkey[0] = w >> 24; // hold 8 bit, MSB, leftmost group\
    \ of 8-bits\nsubkey[1] = w >> 16; // hold 8 bit, second group of 8-bit from left\n\
    subkey[2] = w >> 8; // hold 8 bit, third group of 8-bit from right\nsubkey[3]\
    \ = w; // hold 8 bit, LSB, rightmost group of 8-bits\n```\n\n```\n// subkey <-\
    \ w\n```\n\nThey simplify the bit value of shift + assign one C expression with\
    \ only one subkey array.\n\nWe change three shift + assign one C expression with\
    \ only one assembly Rotate Right operation.\n\n```\n__asm__ (\"%l.or %0,%1,\"\
    2\" : \"r\" ((unsigned int *) subkey) : \"r\" (w), \"r\" (0x10));\n```\n\nThe\
    \ final result is exactly same.\n\n# Section 38.2: gcc Basic asm support\n\nBasic\
    \ assembly with gcc has the following:\n\n```\nasm [ volatile ] ( AssemblerInstructions\
    \ )\n```\n\nwhere AssemblerInstructions is the direct assembly code for the given\
    \ processor. The volatile keyword is optional and has no effect does optimize\
    \ code within a basic statement. AssemblerInstructions can contain multiple assembly\
    \ instructions. A basic statement is used if you have an asm routine that must\
    \ exist outside of a C function. The following example is from the GCC manual:\n\
    \n```\n/* Note that this code will not compile with -masm=intel */\n#define DebugBreak()\
    \ asm(\"$3\");\n```"
