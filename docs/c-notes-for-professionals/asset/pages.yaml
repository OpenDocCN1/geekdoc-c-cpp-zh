  md: "returnType(*name)(parameters)\n\nA mnemonic for writing a function look like\
    \ this is the following procedure:\n\n+   1. Begin by writing a normal function\
    \ declaration: returnType name (parameters)\n2. Wrap the function name with pointer\
    \ syntax: returnType (*name) (parameters)\n\n# Section 24.6: Basics\n\nJust like\
    \ you can have a pointer to an int, char, float, array/string, struct, etc. -\
    \ you can have a pointer to a function.\n\nDeclaring the pointer takes the return\
    \ value of the function, the name of the function, and the type of arguments/parameters\
    \ it receives.\n\nSay you have the following function declared and initialized:\n\
    \n```\nint addInt(int n, int m) {\n  return n+m;\n}\n```\n\nYou can declare and\
    \ initialize a pointer to this function:\n\n```\nint (*functionPtrAdd)(int, int)\
    \ = addInt; // or &addInt - the is optional\n```\n\nIf you have a void function\
    \ it could look like this:\n\n```\nvoid Print(void) {\n  printf('look ma' - no\
    \ hands, only pointers!\\n');\n}\n```\n\nThen declaring the pointer to it would\
    \ be:\n\n```\nvoid (*functionPtrPrint)(void) = Print;\n```\n\nAccessing the function\
    \ itself would require deferring the pointer:\n\n```\nsum = (*functionPtrAdd)(2,\
    \ 3); //will assign 5 to sum\n(*functionPtrPrint()); //will print the text in\
    \ Print function\n```\n\nAs seen in more examples in this document, declaring\
    \ a pointer to a function could get messy if the function is passed more than\
    \ a few parameters. If you have few pointers to functions that have identical\
    \ (\"structure\" type return value, and same type of parameters) it's best to\
    \ use the typedef command to save some typing, and to make the code more clear:\n\
    \n```\ntypedef int (*ptrInt)(int, int);\n```\n\n```\nint Add(int i, int j) {\n\
    \  return i+j;\n}\n```\n\n```\nint Multiply(int i, int j) {\n  return i*j;\n}\n\
    ```\n\n```\nint main()\n```\n\nGoalKicker.com - C Notes for Professionals"
