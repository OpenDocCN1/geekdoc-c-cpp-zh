- img_proc: true
  md: "# Notes for Professionals\n\n# Chapter 12: Enumerations\n\n# Section 12.1:\
    \ Simple Enumeration\n\nEnumerations are used to define groups of related constants.\n\
    \n```\nenum Color {\n    RED,\n    GREEN,\n    BLUE\n};\n```\n\nTo use an enumeration,\
    \ you declare a variable of the enumeration type and assign one of the named constants\
    \ to it.\n\n```\nColor myColor = RED;\n```\n\nEnumerations can also be defined\
    \ with values (optional).\n\n```\nenum Day {\n    MONDAY,\n    TUESDAY,\n    WEDNESDAY,\n\
    \    THURSDAY,\n    FRIDAY,\n    SATURDAY,\n    SUNDAY\n};\nDay today = MONDAY;\n\
    ```\n\n![](img/ce8e1154ba1896b573d12345aa34d5d7_0_0.png)\n\n# Chapter 10: Arrays\n\
    \nAn array is a collection of elements of the same type. Each element is accessed\
    \ by an index.\n\nSection 10.1: Declaring and initializing an array\nAn array\
    \ is a fixed-size array of elements of one type. It allows you to store multiple\
    \ values of the same type in a single variable.\n\n```\nint numbers[5] = {10,\
    \ 20, 30, 40, 50};\n```\n\nThe elements of an array are accessed using zero-based\
    \ indices.\n\n```\nnumbers[0] = 15;\n```\n\nYou can also initialize an array using\
    \ a loop.\n\n```\nfor (int i = 0; i < 5; i++) {\n    numbers[i] = i * 10;\n}\n\
    ```\n\nMulti-dimensional arrays are arrays of arrays.\n\n```\nint matrix[2][3]\
    \ = {{1, 2, 3}, {4, 5, 6}};\n```\n\n![](img/ce8e1154ba1896b573d12345aa34d5d7_0_1.png)\n\
    \n# Chapter 20: Files and I/O streams\n\nA stream is an abstraction for a source\
    \ or destination of data. C++ uses streams to provide a uniform interface for\
    \ performing I/O operations.\n\n# Section 20.1: Open and write to file\n\nTo work\
    \ with file streams, you must include the `<fstream>` header.\n\nThe `ofstream`\
    \ class is used for writing to files. The `ifstream` class is used for reading\
    \ from files.\n\nThe `fstream` class is used for both reading and writing to files.\n\
    \n```\nstd::ifstream inFile(\"test.txt\");\nstd::string line;\nwhile (std::getline(inFile,\
    \ line)) {\n    std::cout << line << std::endl;\n}\ninFile.close();\n```\n\nThis\
    \ program demonstrates how to open a file, write some data to it, and then read\
    \ it back.\n\n# 300+ pages\nof professional hints and tricks\n\nGoalKicker! Free\
    \ Programming Books - This is an unofficial free book created for educational\
    \ purposes and is not affiliated with official C group() or company(). All trademarks\
    \ and registered trademarks are the property of their respective owners"
