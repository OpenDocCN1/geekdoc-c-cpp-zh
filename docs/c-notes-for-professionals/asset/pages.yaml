    # Section 44.6: Using the right-left or spiral rule to decipher declaration


    The "right-left" rule is a completely regular rule for deciphering C declarations.
    It can also be useful in creating them.


    Read the samples as you encounter in the declaration...


    +   * as "pointer to" - always on the left side

    * as "array of" - always on the right side

    * () as "function returning" - always on the right side


    # How to apply the rule


    STEP 1


    Find the identifier. This is your starting point. Then say to yourself, "identifier
    is." You''ve started your declaration.


    STEP 2


    Look at the symbols on the right of the identifier. If, say, you find ( ), then
    you know that this is the declaration for a function. So you would then have "identifier
    is function returning." If you found a [ ], then you would say "identifier is
    array of.\ Continue right until you run out of symbols OR a right parenthesis).
    (If you have a left parenthesis (, that''s the beginning of a ( ) symbol, even
    if there is stuff between the parentheses. More on that.)


    STEP 3


    Look at the symbols to the left of the identifier. If it is not one of our symbols
    (something like "int"), say it. Otherwise, translate it into English using that
    table. Keep going left until you run out of symbols OR'
