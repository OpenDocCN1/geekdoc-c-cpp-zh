  md: "Place the structure definition before the function declaration, or add `struct\
    \ whatever;` as a line before the function declaration, and there is no problem.\
    \ You should not introduce new type names in a function prototype because there\
    \ is no way to use that, and hence no to define or use that function.\n\n# # Section\
    \ 39.2: Block Scope\n\nAn identifier has scope if its corresponding declaration\
    \ appears inside a block (parameter declaration in function application). The\
    \ scope ends at the end of the corresponding block.\n\nNo entities with the same\
    \ identifier can have the same scope, but scopes may overlap. In case of overlapping\
    \ scopes the only visible one is the declared in the innermost scope.\n\n```\n\
    ```c\ninclude <stdio.h>\n\nvoid test(int bar)          // bar has scope test function\
    \ block\n{\n    int foo = 5;                // foo has scope test function block\n\
    \    {\n        int bar = 10;           // bar has scope inner block, this overlaps\
    \ with previous\n        testbar declaration, and it hides testbar\n        printf(\"\
    %d%d\\n\", foo, bar); // 5 10\n    } // end of scope for inner bar\n    printf(\"\
    %d%d\\n\", foo, bar); // 5 5, here bar is testbar\n} // end of scope for test:foo\
    \ and testbar\n\nint main(void)\n{\n    int foo = 3;                // foo has\
    \ scope main function block\n    printf(\"%d\\n\", foo);      // 3\n    test(5);\n\
    \    printf(\"%d\\n\", foo);      // 3\n    return 0;\n} // end of scope for main:foo\n\
    \n```\n```\n\n# # Section 39.3: File Scope\n\n```\n```c\ninclude <stdio.h>\n\n\
    /* The identifier, foo, is declared outside all blocks.\nIt can be used anywhere\
    \ after the declaration until the end of\nt translation unit. */\nstatic int foo;\n\
    \nvoid test_function(void)\n{\n    foo += 2;\n}\n\nint main(void)\n{\n    foo\
    \ = 1;\n    test_function();\n    printf(\"%d\\n\", foo);      // foo = 3\n  \
    \  return 0;\n}\n```\n```"
