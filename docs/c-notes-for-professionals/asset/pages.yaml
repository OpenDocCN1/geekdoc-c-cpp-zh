    \n# # 46.3: Allocating Memory\n\nYou may need to expand or shrink your pointer\
    \ storage space after you have allocated memory to it. The void *realloc(void\
    \ *ptr, size_t size) deallocates the object pointed to by ptr and returns a pointer\
    \ to an object that has the size specified by ptr. ptr is the pointer to a block\
    \ previously allocated with malloc, calloc or realloc (or a null pointer) to be\
    \ reallocated. The maximal possible contents of the original memory is preserved.\
    \ If the new size is, additional memory beyond the old size is uninitialized.\
    \ If the new size is shorter, the contents of the shrunk pointer is lost. If ptr\
    \ is NULL, a new block is allocated and a pointer to it is returned by the function.\n\
    \n```\n#include <stdio.h>\n#include <stdlib.h>\n\nint main(void)\n{\n    int *p\
    \ = malloc(10 * sizeof *p);\n    if (NULL == p)\n    {\n        perror(\"malloc\
    \ failed\");\n        return EXIT_FAILURE;\n    }\n\n    p[0] = 42;\n    p[9]\
    \ = 15;\n\n    /* Reallocate array to a larger size, storing the result into a\n\
    \       * temporary pointer *temporary when realloc() fails. */\n    int *temporary\
    \ = realloc(p, 100000 * sizeof *temporary);\n\n    /* realloc() failed, the original\
    \ allocation was not free'd yet. */\n    if (NULL == temporary)\n    {\n     \
    \   perror(\"realloc() failed\"); /* * Clean up. */\n        free(p);\n      \
    \  return EXIT_FAILURE;\n    }\n\n    p = temporary;\n\n\n    /* From here on,\
    \ array can be used with the new size it\n       * realloc'ed to, until it is\
    \ free'd. */\n    /* The values of p[0] to p[9] are preserved, so this will print:\
    \ */\n    printf(\"%d %d\\n\", p[0], p[9]);\n\n    free(p);\n```"
