    # # Section 21.2: The printf() Function


    Accessed through including <stdio.h>, the function printf() is the primary tool
    for printing text to the console in C.


    ```

    printf("Hello world!");

    // Hello world!

    ```


    Normal, unwanted character arrays can be printed by placing them directly in the
    parentheses.


    ```

    printf("%d is the answer to life, the universe, and everything.", 42);

    // 42 is the answer to life, the universe, and everything.

    ```


    ```

    int x = 3;

    char y = "Example";

    printf("Int: %d, Char: %c, String: %s", x, y, String);

    // Int: 3, Char: E, String: Example

    ```


    Alternately, floating-point numbers, and more can be printed using the escape
    character %, followed by a character or sequence of characters defining the format,
    known as the format specifier.


    All additional arguments to the function printf() are separated by commas, and
    these arguments should be in the same order as the format specifiers. Additional
    arguments are ignored, while incorrectly typed arguments or a of arguments will
    cause errors or undefined behavior. Each argument can be a literal or a variable.


    After successful execution, the number of characters printed is returned with
    type int. Otherwise, a failure returns a negative value.


    # # Section 21.3: Printing format flags


    The C standard (C11, and C99) defines the flags for printf():


    | Flag | Conversions | Meaning |

    | --- | --- | --- |

    | | all | The result of the conversion will be left-justified within the field.
    The conversion is rightjust if this flag is not specified. |

    | + | signed numeric | The result of a signed conversion will always have a sign
    (''+'' or ''-''). The sign will begin with only when a negative value is converted
    if this flag is not specified. |

    | <space> | signed numeric | If the first character of a signed conversion is
    not a sign or there is no characters, a <space> shall be prefixed to the result.
    This means if the <space> and ''+'' flags appear, the <space> flag be ignored.
    |

    | all | Specifies that the value to be converted to an alternate format. For o
    conversion, it shall increase the precision, and only if necessary, to force the
    first digit of the result to be a zero (if the value and precision are not 0,
    a zero is printed). For x or X specifiers, a non-zero value shall have 0x (or
    0X) prefixed to it. For a, A, e, f, g, and G specifiers, the radix character is
    inserted in the result of these conversions only follow the radix character. Without
    this flag, a radix character appears in the result of these conversions. For G
    and g conversion specifiers, trailing zeros shall not be removed from the result
    as they normally are. For other conversion behaviors, behavior is undefined. |'
