  md: "# Chapter 56: Unions\n\n# Section 56.1: Using unions to reinterpret values\n\
    \nSome implementations permit code to write one member of union type then read\
    \ from another in order to perform a sort of reinterpreting cast (parsing the\
    \ new type as the bit representation of the old one).\n\nIt is important to notice,\
    \ this is not permitted by the C standard current or past and will result in undefined\
    \ behavior, none less is it a very common extension offered by compilers (check\
    \ your compiler docs if you plan to do this).\n\nOne real example of this technique\
    \ is the \"Fast Inverse Square Root\" algorithm which relies on implementation\
    \ details of IEEE 754 floating point numbers to perform an inverse square root\
    \ more quickly than using floating point operations, this algorithm can be performed\
    \ either through pointer casting (which is very dangerous and breaks the strict\
    \ aliasing rule) or through a union (which is still undefined behavior but works\
    \ in many compilers):\n\n```\nunion floatToInt\n{\n    int32_t intMember;\n  \
    \  float floatMember; /* Float must be 32 bits IEEE 754 for this to work */\n\
    };\n\nfloat inverseSquareRoot(float input)\n{\n    union {\n        int32_t i;\n\
    \        float f;\n    } x    n    f = input = input; to the float member */\n\
    \    n = x.intMember; /* Read back from the integer member */\n    i = 0x5f3759df\
    \ - (i >> 1);\n    x.intMember = i; /* Assign to the integer member */\n    f\
    \ = x.floatMember; /* Read back from the float member */\n    f = f * (1.5f -\
    \ f * f * 0.5f);\n    return f * (1.5f - f * f * 0.5f);\n}\n```\n\nThis technique\
    \ was widely used in computer graphics and has the great price due to its greater\
    \ speed compared to using floating point operations, and is much a compromise,\
    \ losing some accuracy and being very non portable in exchange for speed.\n\n\
    # Section 56.2: Writing to one union member and reading from another\n\nThe members\
    \ of a union share the same space in memory. This means that writing to one overwrites\
    \ the data in all other members and that reading from one results in the same\
    \ data as reading from all other members. However, because union can have different\
    \ types and sizes, the data that is read can interpreted differently,\n://stackoverflow.com/documentation/c1199/structs-and-unions/9399/using-unions-to-reinterpret-values\n\
    \nThe simple example below demonstrates a union with two members, both of the\
    \ same type. It shows that writing to member m_1 results in the value read from\
    \ member m_2 and writing to member m_2 results in the value read from member m_1.\n\
    \n```\n#include <stdio.h>\n```"
