    \ is uninitialized (not declared with an initializer and no assignment to it has\
    \ been performed prior to use), the behavior is undefined.\n\n# # Section 28.17:\
    \ Addition or subtraction of pointer not properly bounded\n\nThe following code[6]\
    \ has undefined behavior:\n\n```\nchar buffer[6] = \"hello\"; /* undefined behavior\
    \ */\nchar *ptr1 = buffer - 1; /* OK, pointing to the '\\0' inside the array */\n\
    char *ptr2 = buffer + 5; /* OK, pointing to just beyond */\nchar *ptr3 = buffer\
    \ - 6; /* undefined behavior beyond */\nchar *ptr4 = buffer + 7; /* undefined\
    \ behavior */\n```\n\nAccording to C11, if addition or subtraction of a pointer\
    \ is, or just beyond, the same object, and an integer produces a result that does\
    \ not point into, or just beyond, the same object, the behavior is undefined (6.5.6).\n\
    \nAdditionally it is naturally undefined dereferencing a pointer that points just\
    \ beyond the array:\n\n```\nchar buffer[6] = \"hello\";\nchar *ptr3 = buffer +\
    \ 6; /* OK, pointing to just beyond */\nchar value = *ptr3; /* undefined behavior\
    \ */\n```\n\n# # Section 28.18: Dereferencing a null pointer\n\nThis is an example\
    \ of dereferencing a NULL pointer, causing undefined behavior.\n\n```\nint *pointer\
    \ = NULL;\nint value = *pointer; /* Dereferencing happens here * */\n```\n\nA\
    \ NULL pointer is guaranteed by the C standard to compare unequal to any pointer\
    \ to a valid object, and dereferencing it invokes undefined behavior."
