  md: "```\ntypedef struct { uint64_t state; uint64_t inc; } pcg32_random_t;\n\nuint32_t\
    \ pcg32_random(pcg32_random_t* rng) {\n    uint64_t oldstate = rng->state;\n \
    \   /* Advance internal state */\n    rng->state = oldstate + 6364163238467933005ULL\
    \ + (rng->inc | 1);\n    uint32_t xorshifted = (oldstate >> 18) ^ (oldstate <<\
    \ 27u);\n    uint32_t rot = oldstate >> 59u;\n    return (xorshifted >> rot) |\
    \ (xorshifted << (-rot) & 31));\n}\n\nvoid pcg32_sandom(pcg32_random_t rng, uint64_t\
    \ initstate, uint64_t initseq) {\n    rng->state = initstate;\n    rng->inc =\
    \ (initseq << 1) | 1u;\n    pcg32_random(rng);\n    rng->state += initstate;\n\
    \    pcg32_random(rng);\n}\n\n```\n\nAnd here's how to call it:\n\n```\n#include\
