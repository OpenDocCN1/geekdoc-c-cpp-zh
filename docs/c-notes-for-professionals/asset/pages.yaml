    \ */\n\n        free(line);\n        line = NULL;\n    }\n    return 0;\n}\n```\n\
    \nLeaking memory doesn't always have terrible consequences and isn't necessarily\
    \ a functional problem. While \"best practice\" rigorously dictates freeing memory\
    \ at strategic points and conditions, to reduce memory footprint and lower risk\
    \ of memory exhaustion, there can be exceptions. For example, if a program is\
    \ bounded in duration and scope, the risk of allocation failure might be too small\
    \ to worry about. In that case, bypassing explicit deallocation might be considered\
    \ acceptable. For most modern operating systems automatically free memory consumed\
    \ when a program terminates, when it is due to program failure, a system will\
    \ exit(), process termination, or reaching end of main(). Explicitly freeing memory\
    \ at the point of imminent termination could be redundant or introduce a performance\
    \ penalty.\n\nAllocation can fail if memory is unavailable, and handling failures\
    \ should be accounted for at appropriate levels of the call stack. getline(),\
    \ shown above is an interesting use-case it is a library function that only allocates\
    \ memory it leaves to the caller, but can fail for a number of reasons, of which\
    \ must be taken into account. It is essential when using a API, to read the documentation\
    \ (man page) and pay particular attention to error concerns and memory usage,\
    \ and aware which software lowers the burden of returning memory.\n\nAnother memory\
    \ handling practice is to consistently set pointers to NULL immediately after\
    \ the memory referenced by them is freed, so that pointers can be tested at any\
    \ time (e.g. free / NULL), because accessing freed memory can lead to problems\
    \ such as getting garbage data (read operation), data corruption (write operation)\
    \ or to a program crash. In most modern operating systems, freeing memory 0 (NULL)\
    \ is a NOP, as required by the C standard — so by setting a pointer to NULL, there\
    \ is no risk of double-freeing if the pointer is passed to free(). Keep in mind\
    \ that double-freeing memory can lead to very time consuming, and difficult to\
