  md: "• To format a data structure to transmit over network without depending on\
    \ each architecture alignment of each node of the network.\n\nIt must be taken\
    \ in consideration that some processors such as the ARM Cortex-M0 do not allow\
    \ unaligned memory access; in cases, structure packing can lead to undefined behaviour\
    \ and can crash the CPU.\n\n# # Section 45.2: Structure padding\n\nSuppose this\
    \ struct test_32 is defined and compiled with a 32 bit compiler:\n\n```\nstruct\
    \ test_32 {\n    int a;      // 4 byte\n    short b;    // 2 byte\n    int c;\
    \      // 4 byte\n} str_32;\n```\n\nWe might expect this struct to occupy 10 bytes\
    \ of memory, but by printing sizeof(str_32) it uses 12 bytes.\n\nThis happened\
    \ because the compiler aligns variables for fast access. A common pattern is when\
    \ the base type occupies N bytes (where N is a power of 2 such as 1, 2, 4, 8,\
    \ 16 — and seldom bigger), the variable should be aligned on an N-byte boundary\
    \ (a multiple of N bytes).\n\nFor the structure below sizeof(int) == 4 and sizeof(short)\
    \ == 2, a common layout is:\n\n+   • int a; stored at offset 0; size 4.\n• short\
    \ b; stored at offset 4; size 2.\n• unnamed padding at offset 6; size 2.\n• int\
    \ c; stored at offset 8; size 4.\n\nThus struct test_32 occupies 12 bytes of memory.\
    \ In this example, there is no trailing padding.\n\nThe compiler will ensure any\
    \ struct test_32 variables are starting on a 4-byte boundary, so that the members\
    \ within the structure will be properly aligned for fast access. Memory allocation\
    \ functions such as malloc(), calloc() and realloc() are required to ensure that\
    \ the pointer returned is well aligned for use with any data type, so dynamically\
    \ allocated structures will be properly aligned.\n\nYou can end up with such situations\
    \ as on a 64-bit Intel x86_64 processor (e.g. Intel Core i7 — a Mac running Sierra\
    \ or Mac OS X) when compiling in 32-bit, the compilers place double aligned on\
    \ a 4-byte boundary; but, on the same hardware, the compilers place double aligned\
    \ on an 8-byte boundary."
