    #include \"headerfile.h\"\n\nint main() {\n    int start = 3;\n    int intermediate\
    \ = complicated1(start);\n    printf(\"First result is %d\\n\", intermediate);\n\
    \    intermediate = complicated2(start);\n    printf(\"Second result is %d\\n\"\
    , intermediate);\n    return 0;\n}\n```\n\nsource1.c:\n\n```\n#include <stdio.h>\n\
    #include <stdlib.h>\n#include \"headerfile.h\"\n\nint complicated1(int input)\
    \ {\n    int tmp = timestowo(input);\n    tmp = plusfive(tmp);\n    return tmp;\n\
    }\n```\n\nsource2.c:\n\n```\n#include <stdio.h>\n#include <stdlib.h>\n#include\
    \ \"headerfile.h\"\n\nint complicated2(int input) {\n    int tmp = plusfive(input);\n\
