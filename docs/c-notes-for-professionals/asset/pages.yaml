  md: "# # Chapter 31: Signal handling\n\nParameter Details\n\nsig The signal to set\
    \ the signal handler, one of SIGABRT, SIGFPE, SIGILL, SIGTERM, SIGINT, SIGSEGV\
    \ or some implementation defined value\n\nfunc The signal handler, which is either\
    \ of the following: SIG_DFL, for the default handler, SIG_IGN to ignore the signal,\
    \ or a function pointer with the signature void func(int sig);\n\n# # Section\
    \ 31.1: Signal Handling with \"signal()\"\n\nSignal numbers can be synchronous\
    \ (like SIGSEGV - segmentation fault) when they are triggered by a malfunctioning\
    \ of the program itself or asynchronous (like SIGINT - interactive attention)\
    \ when they are initiated from outside the program, or by a keypress Ctrl-C.\n\
    \nThe signal() function is part of the ISO C standard and can be used to assign\
    \ a handler to handle specific signal\n\n```\n#include <stdio.h> /* printf() */\n\
    #include <stdlib.h> /* abort() */\n#include <signal.h> /* signal() */\n\nvoid\
    \ handler_nonportable(int sig) {\n    /* undefined behavior, maybe fine on specific\
    \ platform */\n    printf(\"Caught: %d\\n\", sig);\n\n    /* abort is safe to\
    \ call */\n    abort();\n}\nsig_atomic_t volatile finished = 0;\nvoid handler(int\
    \ sig) {\n    switch (sig) {\n        /* interrupts should not return */\n   \
    \     case SIGSEGV:\n        case SIGFPE:\n        case SIGILL:\n        case\
    \ C1:\n            /* quick_exit is safe to call */\n            quick_exit(EXIT_FAILURE);\n\
    \        case C1:\n            /* use _Exit in pre-C11 */\n            _Exit(EXIT_FAILURE);\n\
    \        default:\n            /* Reset the signal to the default handler,\n \
    \              so we will not be called again if things goes\n               wrong\
    \ on return. */\n            signal(sig, SIG_DFL);\n            /* let everyone\
    \ know that we are finished */\n            finished = sig;\n            return;\n\
    \    }\n}\n\nint main(void) {\n}\n```"
