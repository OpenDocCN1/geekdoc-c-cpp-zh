  md: "in an implementation-defined manner. (How to convert an integer to a signed\
    \ type which cannot represent the value count is implementation-defined, and whether\
    \ char is signed is also implementation-defined.) The output will be some meaningless\
    \ thing.\n\n```\n#include <stdio.h>\n\nint main(void) {\n    char c = *a; /* bad\
    \ * */\n    printf(\"%c\\n\", c);\n    return 0;\n}\n```\n\nIn almost all cases,\
    \ the compiler will compile these mix-ups. If it doesn't, you need to use more\
    \ compiler warning options, or it is recommended that you use a better compiler.\n\
    \n# Section 63.20: Recursive function — missing out the base condition\n\nCalculating\
    \ the factorial of a number is a classic example of a recursive function.\n\n\
    Missing the Base Condition:\n\n```\n#include <stdio.h>\n\nint factorial(int n)\
    \ {\n    return n * factorial(n - 1);\n}\n\nint main() {\n    printf(\"Factorial\
    \ %d = %d\\n\", 3, factorial(3));\n    return 0;\n}\n```\n\nTypical output: Segmentation\
    \ fault: 11\n\nThe problem with this function is it would loop infinitely, causing\
    \ a segmentation fault — it needs a base condition to stop the recursion.\n\n\
    Base ConditionDeclared:\n\n```\n#include <stdio.h>\n\nint factorial(int n) {\n\
    \    if (n == 1) // Base Condition, very crucial in designing the recursive functions.\n\
    \        return 1;\n    } else {\n        return n * factorial(n - 1);\n    }\n\
    }\n\nint main() {\n\n```"
