  md: 'The pointer-to-void return type means that it is possible to assign the return
    value from malloc to a pointer to any type of object:


    ```

    int vector = malloc(10 * sizeof (*vector));

    ```


    It is generally considered good practice to not explicitly cast the values into
    and out of void pointers. In specific case of malloc() this is because without
    an explicit cast, the compiler may otherwise assume, but not warn about, an incorrect
    return type for malloc(), if you prefer to include stdlib.h. It is also a case
    of using the correct behavior of void pointers to better follow to the DRY (don''t
    repeat yourself) principle; compare the to the following, within the following
    code stands several needless places where a type could cause issues:


    ```

    int* vector = (int*)malloc(10 * sizeof int);

    ```


    Similarly, functions such as


    ```

    void* memcpy(void *restrict target, void const *restrict source, size_t size);

    ```


    have their arguments specified as void * because the address of any object, regardless
    of the type, can be passed in. Here also, a call should not use a cast


    ```

    unsigned char buffer[sizeof(int)];

    int b = 67;

    memcpy(buffer, &b, sizeof buffer);

    ```


    # Section 22.12: Same Asterisk, Different Meanings


    Premise


    The most confusing surrounding pointer syntax in C and C++ is that there are actually
    two different meanings that apply when the pointer symbol, the asterisk (*), is
    used with a variable.


    Example


    Firstly, you use * to declare a pointer variable.


    ```

    int i = 5;

    /* ''p'' is a pointer to an integer, initialized as NULL */

    int *p = NULL;

    /* *i evaluates into address of ''i'', when assigned to ''p'' */

    p = &i;

    /* ''p'' is now holding the address of ''i'' */

    ```


    When you''re declaring (or multiplying), * is used to dereference a pointer variable:


    ```

    *p = 123;

    /* ''p'' was pointing to ''i'', so this changes value of ''i'' to 123 */

    ```


    When you want an existing pointer variable to hold address of other variable,
    you don''t use *, but do to it like this:


    ```

    p = &another_variable;

    ```


    A common confusion among C-programming newbies arises when they declare and initialize
    a pointer variable at the same time.


    GoalKicker.com – C Notes for Professionals'
