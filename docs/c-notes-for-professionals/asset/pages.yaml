  md: '# ## Chapter 23: Sequence points


    # ### Section 23.1: Unsequenced expressions


    Version ≥ C11


    The following expressions are *unsequenced*:


    ```

    a + b;

    a - b;

    a + b;

    a / b;

    a & b;

    a | b;

    ```


    In the above examples, the expression may be evaluated before or after the expression
    b, b may be evaluated before a, or they may be intermixed if they correspond to
    several instructions.


    A similar rule holds for function calls:


    ```

    f(a, b);

    ```


    Here not a and b are unsequenced (i.e. the , operator in a function call *does
    not* produce a sequence point) but also f, the expression that determines the
    function is to be called.


    Side effects may be applied immediately after evaluation or deferred until a later
    point.


