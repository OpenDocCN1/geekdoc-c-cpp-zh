    \ file at the location of\n#include before it gets compiled. #include is almost\
    \ always used to include header files, which\nare files containing many function\
    \ declarations and #define statements. In this case, we use #include in\n to able\
    \ to use functions such as printf and scanf, whose declarations are located in\
    \ the file\nstdio.h. C compilers do not allow you to use a function unless it\
    \ has previously been declared or defined\nthat file; #include statements are\
    \ those who the re-use previously-written code in your C programs.\n\n# 3. Logic\
    \ operations:\n\n```\n#if defined A || defined B\nvariable = another_variable\
    \ + 1;\nelse\nvariable = another_variable * 2;\nendif\n```\n\nwill be changed\
    \ to:\n\n```\nvariable = another_variable + 1;\n```\n\nif A or B were defined\
    \ somewhere in the project. If this is not the case, of course the preprocessor\
    \ would\ndo this:\n\n```\nvariable = another_variable * 2;\n```\n\nThis is used\
    \ for code, that runs on different systems or compiles on different compilers.\
    \ Since there are\nglobal defines, that are compiler/system specific you can test\
    \ on those defines and always let the compiler\njust use the code he will compile\
    \ for.\n\n# 4. Comments\n\nThe Preprocessor replaces all comments in the source\
    \ file by single spaces. Comments are indicated by // up\nto the end of the line,\
    \ or a combination of opening /* and closing */ comment brackets.\n\n# Section\
    \ 37.5: The Translation Phases\n\nAs of the C 2011 Standard, listed in §5.1.1.2\
    \ Translation Phases, the translation of source code to program image\n(e.g.,\
    \ the executable) is listed to occur in 8 ordered steps."
