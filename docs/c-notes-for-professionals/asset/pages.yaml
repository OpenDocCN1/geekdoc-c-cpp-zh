  md: '# Chapter 22: Pointers


    A pointer is a type of variable which can store the address of another object
    or a function.


    # Section 22.1: Introduction


    A pointer is declared much like any other variable, except an asterisk (*) is
    placed between the type and the name of the variable to denote it is a pointer.


    ```

    int *pointer; /* inside a function, pointer is uninitialized and doesn''t point
    to any valid object

    yet = *;

    ```


    To declare two pointer variables of the same type, in the same declaration, use
    the asterisk before each identifier. For example:


    ```

    int *ptr1, *ptr2;

    int *ptr3, ptr4; /* ptr3 is a pointer variable, whereas ptr4 is misnamed and is
    an int */

    ```


    The address-of or reference operator denoted by an ampersand (&) gives the address
    of a given variable which can be placed in a pointer variable.


    ```

    int value = 1;

    pointer = &value;

    ```


    The indirection or dereference operator denoted by an asterisk (*) gets the contents
    of an object pointed to by a pointer.


    ```

    printf("Value of pointed to integer: %d\n", *pointer);

    /* Value of pointed to integer: 1 * */

    ```


    If the pointer points to a struct or union then you can dereference it and access
    its members directly using the ->


    ```

    SomeStruct *s = &someObject;

    s->someMember = 5; /* Equivalent to (*s).someMember = 5 */

    ```


    In C, a pointer is a distinct type value which can be reassigned and otherwise
    treated as a variable in its own right. For example the following examples show
    the pointer (variable) itself.


    ```

    printf("Value of the pointer itself: %p\n", (void *)pointer);

    /* Value of the pointer itself: 0x7ffcd1b6e4 */

    /* This will be different each time the program is executed */

    ```


    Because a pointer is a mutable variable, it is possible for it to not point to
    a valid object, by setting it to null


    ```

    pointer = 0; /* or alternatively */

    pointer = NULL;

    ```


    Or simply by assigning an arbitrary bit pattern that isn''t a valid value. The
    latter is a very bad situation, it cannot be tested before the pointer is dereferenced,
    there is only a test for the case a pointer is null:


    ```

    if (!pointer) exit(EXIT_FAILURE);

    ```'
