  md: "# # Section 37.2: File Types\n\nCompiling C programs requires you to work with\
    \ five kinds of files:\n\n+   1. **Source files**: These files contain function\
    \ definitions, and have names ending in .c by convention. Note: .cc and .cpp are\
    \ C++ files; not C files.\n e.g., foo.c\n2. **Header files**: These files contain\
    \ function prototypes and various pre-processor statements (see below). They are\
    \ used to allow source code files to access externally-defined functions. Header\
    \ files end in .h by convention.\n e.g., foo.h\n3. **Object files**: These files\
    \ are produced as the output of the compiler. They consist of function definitions\
    \ in binary format, but they are not executable by themselves. Object files end\
    \ in .o by convention, although on some operating systems (e.g., Windows, MS-DOS),\
    \ they often end in .obj.\n e.g., foo.o obj\n4. **Binary executables**: These\
    \ are produced as the output of a program called \"linker\". The linker joins\
    \ together number of object files to produce a binary file which can be directly\
    \ executed. Binary executables have no special suffix on Unix operating systems,\
    \ although they generally end in .exe on Windows.\n e.g., foo.exe\n5. **Libraries**:\
    \ A library is a compiled binary but not in itself an executable (ie., there is\
    \ no main() function in library). A library contains functions that may be used\
    \ by more than one program. A library should have header files which contain prototypes\
    \ for all functions in the library; these be referenced (e.g.#include <library.h>)\
    \ in any source file that uses the library. The linker needs to be referred to\
    \ the library so the program can be successfully compiled. There are two types\
    \ of libraries: static and dynamic.\n\n+   * **Static library**: A static library\
    \ (.a files for POSIX systems and .lib files for Windows — not to be confused\
    \ with DLL import library files, which also use the .lib extension) is statically\
    \ built into the program. Static libraries have the advantage that the program\
    \ knows exactly which version of a library is used. On the other hand, the sizes\
    \ of executables are bigger as all used library functions are included.\n e.g.,\
    \ libfoo.a foo.lib\n* **Dynamic library**: A dynamic library (.so files for most\
    \ POSIX systems, .dylib for OSX and .dll files for Windows) is dynamically linked\
    \ at runtime by the program. These are also referred to as shared libraries because\
    \ one library image can be shared by many programs. Dynamic libraries have the\
    \ advantage of taking up less disk space if more one application is using the\
    \ library. Also, they allow updates (bug fixes) without having to rebuild executables.\n\
    \ e.g., foo.so foo.dylib libfoo.dll\n\n# # Section 37.3: The Linker\n\nThe job\
    \ of the linker is to link a bunch of object files (.o files) into a binary executable.\
    \ The process of linking involves resolving symbolic addresses to numerical addresses.\
    \ The result of the link process is normally an executable program.\n\nDuring\
    \ the link process, the linker will pick up all the object modules specified on\
    \ the command line, add some system-specific startup code in front and try to\
    \ resolve all external references in the object module with external definitions\
    \ in other object files (object files can be specified directly on the command\
    \ line or implicitly be added through libraries). It will then add addresses for\
    \ the object files, that is, it specifies the code and data"
