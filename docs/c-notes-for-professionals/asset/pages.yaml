  md: "# # Chapter 61: Valgrind\n\n# ## Section 61.1: Bytes lost -- Forgetting to\
    \ free\n\nHere is a program that calls malloc not free:\n\n```\n#include <stdio.h>\n\
    #include <stdlib.h>\n\nint main(int argc, char **argv)\n{\n    char *s;\n\n  \
    \  s = malloc(26); // the culprit\n\n    return 0;\n}\n```\n\nWith no arguments,\
    \ valgrind will not look for this error.\n\nBut if we turn on --leak-check=yes\
    \ or --tool=memcheck, it will complain and display the lines responsible for those\
    \ memory leaks if the program was compiled in debug mode:\n\n```\n$ valgrind -q\
    \ --leak-check=yes ./missing_free\n==4776== 26 bytes in 1 blocks are definitely\
    \ lost in loss record 1 of 1\n==4776== at 0x402A428: malloc (vg_replace_malloc.c:236)\n\
    ==4776== by 0x804B3F8: main (missing_free.c:9)\n```\n\nIf the program is not compiled\
    \ in debug mode (for example with the -g flag in GCC) it will still show us where\
    \ the leak happened in the relevant function, but not the lines.\n\nThis lets\
    \ us go back and look at what was allocated in that line and to trace forward\
    \ to see why it wasn't freed.\n\n# ## Section 61.2: Most common errors encountered\
    \ while using Valgrind\n\nValgrind provides with the lines at which the error\
    \ occurred at the end of each line in the format (file.c:line_no). Errors in valgrind\
    \ are summarised in the following way:\n\n```\nERROR SUMMARY: 1 errors from 1\
    \ contexts (suppressed: 0 from 0)\n```\n\nThe most common errors include:\n\n\
    +   - Illegal read/write errors\n\n```\n==8451== Invalid read of size 2\n==8451==\
    \ at 0x45E731D: getenv (getenv.c:84)\n==8451== by 0x4EB1559: libc_malloc (libc_fatal.c:80)\n\
    ==8451== by 0x45F256B: fortify_fail (fortify_fail.c:37)\n==8451== by 0x45F250F:\
    \ stack_chk_fail (stack_chk_fail.c:28)\n==8451== by 0x40059C: main (valig.c:10)\n\
    ==8451== Address 0x70000007 is not stack'd, malloc'd (or recently) free'd\n```"
