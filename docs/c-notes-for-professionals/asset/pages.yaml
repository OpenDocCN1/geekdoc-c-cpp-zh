  md: "# Chapter 60: Testing frameworks\n\nMany developers use unit tests to check\
    \ that their software works as expected. Unit tests check small units of larger\
    \ pieces of software, and ensure that the outputs match expectations. Testing\
    \ frameworks make testing easier by providing setup/tear-down services and coordinating\
    \ the tests.\n\nThere are many unit testing frameworks available for C. For example,\
    \ Unity is a pure C++ framework. People quite often use C++ testing frameworks\
    \ to test code; there are many C++ testing frameworks too.\n\n# Section 60.1:\
    \ Unity Test Framework\n\nUnity is a Unit-style test framework for testing C.\
    \ It is written completely in C and is portable, quick, simple, expressive and\
    \ extensible. It is designed to be as useful as unit testing for embedded systems.\n\
    \nA simple test case that checks the return value of a function, might look like\n\
    \n```\nvoid test_FunctionTest_should_ReturnFive(void)\n{\n    TEST_ASSERT_EQUAL(5,\
    \ FunctionTest());\n}\n```\n\nA full test might look like:\n\n```\n#include \"\
    unity.h\"\n#include \"UnitTest.h\" /* The Unit to be tested. */\n\nvoid setUp(void)\
    \ /* Is run before every test, put unit calls here. */\nvoid tearDown(void) /*\
    \ Is run after every test, put unit clean-up calls here. */\n\nvoid test_TheFirst(void)\n\
    {\n    TEST_IGNORE_MESSAGE(\"Hello world!\"); /* Ignore this test but print a\
    \ message. */\n}\n\nint main(void)\n{\n    UNITY_BEGIN();\n    RUN_TEST(test_TheFirst);\
    \ /* Run the test. */\n    return UNITY_END();\n}\n```\n\nUnity comes with example\
    \ projects, makefiles and some Ruby rake scripts that help make longer test files\
    \ with a bit easier.\n\n# Section 60.2: CMocka\n\nCMocka is an elegant unit testing\
    \ framework for C with support for mock objects. It only requires the standard\
    \ library, works on a range of computing platforms (including embedded) and with\
    \ different compilers. It has a tutorial on testing with mocks, API documentation,\
    \ and a variety of examples.\n\n```\n#include <stdint.h>\n#include <stdlib.h>\n\
    #include <setjmp.h>\n#include <cmocka.h>\n\nvoid null_test_success(void ** state)\
    \ {\n```\n\nGoalKicker.com - C Notes for Professionals"
