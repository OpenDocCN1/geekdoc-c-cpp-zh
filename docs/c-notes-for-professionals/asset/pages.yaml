  md: "# Chapter 52: Side Effects\n\n# Section 52.1: Pre/Post Increment/Decrement\
    \ operators\n\nIn C, there are unary operators '++' and '-' that are very common\
    \ source of confusion. The operator ++ is called the increment operator and the\
    \ operator -- is called the decrement operator. Both of them can be used in either\
    \ prefix form or postfix form. The syntax for prefix form ++ is ++operand and\
    \ the syntax for postfix form is operand++. When used in the prefix form, the\
    \ operand is incremented by 1 and the resultant value of the operand is used in\
    \ the evaluation. Consider the following example:\n\n```\nint n, x = 5;\nn = ++x;\
    \ /* x is incremented by 1(x=6), and result is assigned to n(6) */\n/* x is a\
    \ short form for two statements: */\n/* x = x + 1; */\n/* n = x; */\n```\n\nWhen\
    \ used in the postfix form, the operand's current value is used in the expression\
    \ and the value of the operand is incremented by 1. Consider the following example:\n\
    \n```\nint n, x = 5;\nx = x++; /* value of x(5) is assigned first to n(5), and\
    \ then x is incremented by 1; x(6) */\n/* x is a short form for two statements:\
    \ */\n/* n = x; */\n/* x = x + 1; */\n```\n\nThe working of the decrement operator\
    \ -- - can be understood similarly.\n\nThe following code demonstrates what one\
    \ does\n\n```\nint main() {\n int a, b, x = 42;\na = ++x; /* a and x are 43 */\n\
    b = x++; /* b is 43, x is 44 */\na = x--; /* a is 44, x is 43 */\nb = --x; /*\
    \ b and x are 42 */\n\n return 0;\n}\n```\n\nFrom the above it is clear that post\
    \ operators return the current value of a variable and then modify it, but pre\
    \ operators modify the variable and return the modified value.\n\nIn all versions\
    \ of C, the order of evaluation of pre and post operators are not defined, hence\
    \ the following code could return unexpected outputs:\n\n```\nint main() {\n int\
    \ a, x = 42;\na = x++ + x; /* wrong */\na = x + x; /* right */\n++x;\n\n int ar[10];\n\
    x = 0;\nar[x] = x++; /* wrong */ }\n```"
