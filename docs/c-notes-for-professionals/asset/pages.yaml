  md: "# # Chapter 18: Declaration vs Definition\n\n# ## Section 18.1: Understanding\
    \ Declaration and Definition\n\nA declaration introduces an identifier and describes\
    \ it, by it a type, object, or function. A declaration is what the compiler needs\
    \ to access references to that identifier. These are declarations:\n\n```\nextern\
    \ int bar;\nextern int g(int, int);\ndouble f(int, double); /* extern can be omitted\
    \ for function declarations */\ndouble h1();             /* declaration without\
    \ prototype */\ndouble h2();            /* ditto */\n```\n\nA definition actually\
    \ instantiates/implements this identifier. It is what the linker needs in order\
    \ to link references to those entities. These are definitions of the above declarations:\n\
    \n```\nint bar;\n g(int lhs, int rhs) {return lhs+rhs;}\ndouble f(int i, double\
    \ d) {return i+d;}\ndouble h1(int a, int b) {return -1.5};\ndouble h2() { /* prototype\
    \ is implied in definition, same as double h2(void) */ }\n```\n\nA definition\
    \ can be used in the place of a declaration.\n\nHowever it must be defined exactly\
    \ once. If you forget to define something that's been declared and referenced\
    \ somewhere, then the linker doesn't know what to link references to and complains\
    \ about a missing symbols. If you define something more than once, the linker\
    \ doesn't know which of the definitions to link to and complains about duplicated\
    \ symbols.\n\nException:\n\n```\nextern int i = 0; /* defines i */\nextern int\
    \ j;      /* declares j */\n```\n\nThis exception can be explained using concepts\
    \ \"Strong symbols vs Weak symbols\" (from a linker's perspective). Please look\
    \ here (Slide 22) for more explanation.\n\n```\n/* All are definitions. */\nstruct\
    \ S { int a; int b; };\nstruct X {\n    int x;\n};\nstruct X anX; /* defines S\
    \ */\n/* defines X */\n/* defines non-static data member x */\n/* defines anX\
    \ as double */\n```"
