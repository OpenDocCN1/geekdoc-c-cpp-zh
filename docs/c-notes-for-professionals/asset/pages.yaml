  md: "# Section 12.4: Typedef enum\n\nThere are several possibilities and conventions\
    \ to name an enumeration. The first is to use a *tag name* just after the **enum**\
    \ keyword.\n\n```\nenum color\n{\n    RED,\n    GREEN,\n    BLUE\n}\n```\n\nThis\
