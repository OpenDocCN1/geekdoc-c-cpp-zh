  md: '# Chapter 17: Initialization


    # Section 17.1: Initialization of Variables in C


    In the absence of explicit initialization, external and static variables are guaranteed
    to be initialized to zero; automatic variables (including register variables)
    have indeterminate1 (i.e., garbage) initial values.


    Scalar variables may be initialized when they are defined by following the name
    with an equals sign and an expression:


    ```

    int x = 1;

    char squota = ''\'';

    long day = 1000L * 60L * 24L; /* milliseconds/day */

    ```


    For external and static variables, the initializer must be a constant expression2;
    the initialization is done once, before the program execution begins.


    For automatic and register variables, the initializer is not restricted to being
    a constant; it may be any expression involving previously defined values, even
    function calls.


    For example, see the code snippet below


    ```

    int binsearch(int x, int v[], int n)

    {

    int low = 0;

    int high = n - 1;

    int mid;

    }

    ```


    instead of


    ```

    int low, high, mid;

    low = 0;

    high = n - 1;

    ```


    In effect, initialization of automatic variables is just where to prefer is a
    largely matter of taste. We generally use explicit assignments, because initializers
    in declarations are harder to see and further away from the point of use. On the
    other hand, variables should only be declared when they''re about to be used whenever
    possible.


    # Initializing an array:


    An array may be initialized by following its declaration with a list of initializers
    enclosed in braces and separated by commas,


    For example, to initialize an array days with the number of days in each month:


    ```

    int days_of_month[] = {31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30 };

    ```


    (Note that January is encoded as month in this structure.)


    When the size of the array is omitted, the compiler will compute the length by
    counting the initializers, of which there are 12 in case.'
