  md: "# Chapter 59: Interprocess Communication (IPC)\n\nInter-process communication\
    \ (IPC) mechanisms allow different independent processes to communicate with each\
    \ other. Standard C does not provide any IPC mechanisms. Therefore, all such mechanisms\
    \ are defined by the host operating system. POSIX defines an extensive set of\
    \ IPC mechanisms; Windows defines another; and other systems define their own\
    \ variants.\n\n# Section 59.1: Semaphores\n\nSemaphores are used to synchronize\
    \ operations between two or more processes. POSIX defines two different sets of\
    \ semaphore functions:\n\n+   1. System V IPC—`semctl()`, `semop()`, `semget()`.\n\
    2. 'POSIX' Semaphores—`semclose()`, `semdestroy()`, `semgetvalue()`, `seminit()`,\
    \ `semop()`, `sempost()`, `semtrywait()`, `semunlink()`.\n\nThis section describes\
    \ the System V IPC semaphores, called because they originated with Unix S.\n\n\
    First, you will need to include the required headers. Old versions of POSIX required\
    \ `#include <sys/types.h>`; modern POSIX and most do not require it.\n\n```\n\
    #include <sys/sem.h>\n```\n\nNext, you will need to define a key in both the parent\
    \ as well as the child.\n\n```\n#define KEY 0x1111\n```\n\nThis key needs to be\
    \ the same in both programs or they will not refer to the same IPC structure.\
    \ There are ways to generate an agreed key without hard-coding its value.\n\n\
    Next, depending on your compiler, you may or not need to do this step: declare\
    \ a union for the purpose of semaphore operations.\n\n```\nunion semun {\n  int\
    \ val;\n  struct semid_ds *buf;\n  unsigned short *array;\n};\n```\n\nNext, define\
    \ your use (sem) and raise (signal) structures. The names P and V originate from\
    \ Dutch\n\n```\nstruct sembuf p = { 0, -1, SEM_UNDO }; # semwait\nstruct sembuf\
    \ v = { 0, 1, SEM_UNDO }; # semsignal\n```\n\nNow, start getting the id for your\
    \ IPC semaphore.\n\n```\nint id;\n// 2nd argument is the number of semaphores\n\
    // 3rd argument is the mode (IPC_CREAT creates the semaphore set if needed)\n\
    if ((id = semget(KEY, 1, 0666 | IPC_CREAT)) < 0) {\n/* error handling code */\n\
    }\n```"
