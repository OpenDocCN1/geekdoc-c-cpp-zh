    undefined behavior if the result is not a representative value of the expression.
    For arithmetic types, that''s called overflow. Unsigned integer arithmetic does
    not overflow because paragraph 6.2/5 applies, causing any unsigned that would
    otherwise be out of range to produce an in-range value. There is no proviso for
    signed integer types, however; these can do overflow, producing undefined behavior.
    For example,


