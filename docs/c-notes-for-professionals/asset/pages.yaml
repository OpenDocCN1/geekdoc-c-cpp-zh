  md: "# Chapter 25: Function Parameters\n\n# Section 25.1: Parameters are passed\
    \ by value\n\nIn C, all function parameters are passed by value, so modifying\
    \ what is passed in callee functions won't affect caller functions' local variables.\n\
    \n```\n#include <stdio.h>\n\nvoid modify(int v) {\n    printf(\"modify: %d\\n\"\
    , v); /* 0 is printed */\n    v = 42;\n    printf(\"modify: %d\\n\", v); /* 42\
    \ is printed */\n}\n\nint main() {\n    int v = 0;\n    printf(\"main 1: %d\\\
    n\", v); /* 0 is printed */\n    modify(v);\n    printf(\"main 2: %d\\n\", v);\
    \ /* 0 is printed, not 42 */\n    return 0;\n}\n```\n\nYou can use pointers to\
    \ let callee functions modify caller' local variables. Note that this is not *pass\
    \ by reference* because the pointer values pointing at the local variables are\
    \ passed.\n\n```\n#include <stdio.h>\n```\n\n```\nvoid modify(int *v) {\n    printf(\"\
    modify: %d\\n\", *v); /* 0 is printed */\n    *v = 42;\n    printf(\"modify: %d\\\
    n\", *v); /* 42 is printed */\n}\n```\n\n```\nint main() {\n    int v = 0;\n \
    \   printf(\"main 1: %d\\n\", v); /* 0 is printed */\n    modify(&v);\n    printf(\"\
    main 2: %d\\n\", v); /* 42 is printed */\n    return 0;\n}\n```\n\nHowever returning\
    \ the address of a local variable to the callee results in undefined behaviour.\
    \ See *Dereferencing a pointer to extend its lifetime*.\n\n# Section 25.2: Passing\
    \ in Arrays to Functions\n\n```\nint getListOfFriends(size_t size, int friend_indices[])\
    \ {\n    size_t i = 0;\n    for (i < size; i++) {\n        friend_indices[i] =\
    \ i;\n    }\n}\n```\n\nVersion C99 Version < C11\n/* \"void\" and VLAs (\"friend_indices[static\
    \ size]\") require C99 at least.\nIn C11 VLAs are optional. */\nvoid getListOfFriends(size_t\
    \ size, int friend_indices[static size]) {"
