  md: "# # Chapter 62: Common C programming idioms and developer practices\n\n# ##\
    \ Section 62.1: Comparing literal and variable\n\nSuppose you are comparing value\
    \ with some variable\n\n```\nif ( i == 2 ) //Bad-way\n{\n    doSomething;\n}\n\
    ```\n\nNow suppose you have mistaken == with = Then it will take your sweet time\
    \ to figure it out.\n\n```\nif( 2 == i ) //Good-way\n{\n    doSomething;\n}\n\
    ```\n\nThen, if an equal sign is accidentally left out, the compiler will complain\
    \ about an \"attempted assignment to literal.\" This won't protect you when comparing\
    \ two variables, but every little helps.\n\nSee here for more info.\n\n# ## Section\
    \ 62.2: Do not leave the parameter list of a function blank — use void\n\nSuppose\
    \ you are creating a function that requires no arguments when it is called and\
    \ you are faced with the dilemma of how you should define the parameter list in\
    \ the function prototype and the function definition.\n\n+   * You have the choice\
    \ of keeping the parameter list empty for both prototype and definition. Thereby,\
    \ they look just like the function statement you will need.\n* You read somewhere\
    \ that one of the uses of void (there are only a few of them), is to define the\
    \ parameter list of functions that do not accept any arguments in their call.\
    \ So, this is also a choice.\n\nSo, which is the correct choice?\n\n**ANSWER:**\
    \ using the keyword `void`\n\n**GENERAL ADVICE:** If a language provides certain\
    \ feature to use for a special purpose, you are better off using that in your\
    \ code. For example, using `enums` instead of `#define` macros (that's for another\
    \ example).\n\nC11 6.7.6.3 \"Function declarators\", paragraph 10, states:\n\n\
    > > The special case of an unnamed parameter of void is the only item in the list\
    \ specifies that the function has no parameters. \n\nParagraph 14 of that same\
    \ section shows the only difference:\n\n> > ... An empty list in a function declarator\
    \ that is part of a definition of that function specifies the"
