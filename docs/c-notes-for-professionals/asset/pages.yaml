  md: "# # Chapter 28: Undefined behavior\n\nIn C, some expressions yield undefined\
    \ behavior. The standard explicitly chooses to not define how a compiler should\
    \ behave if it encounters such an expression. As a result, a compiler is free\
    \ to do whatever it fits and may produce useless, unexpected results, or even\
    \ crash.\n\nCode that invokes UB may work as intended on a specific system with\
    \ a specific compiler, but will likely not work on another system, or with a different\
    \ compiler, compiler version or compiler settings.\n\n# ## 28.1: Dereferencing\
    \ a pointer to variable beyond its lifetime\n\n```\nint* foo(int bar)\n{\n   \
    \ int baz = 6;\n    baz += bar;\n    return &baz; /* (&baz) copied to new memory\
    \ location outside of foo. */\n    /* (1) The lifetime of baz and end here as\
    \ they have automatic storage\n    * duration (local variables), thus the returned\
    \ pointer is not valid! */\n}\n\nint main(void)\n{\n    int* p;\n\n    p = foo(5);\
    \ /* (2) this expression's behavior is undefined */\n    *p = *p - 6; /* (3) Undefined\
    \ behaviour here */\n\n    return 0;\n}\n```\n\nSome compilers help point this\
