    \ OR default : assignment-expression\n\n# ## Section 34.1: Check whether a variable\
    \ is of a certain type\n\n```\n#include <stdio.h>\n\n#define is_const_int(x) _Generic((x),\
    \ \\\n    const int * : \"a const int\", \\\n    int * : \"a non-const int\",\
    \ \\\n    default : \"of other type\")\n\nint main(void) {\n    const int i =\
