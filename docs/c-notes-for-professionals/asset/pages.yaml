  md: '# Section 50.5: Idempotence


    If a particular header included more than once in a translation unit (TU), there
    should not be any compilation problems. This is termed ''idempotence'';your headers
    are idempotent. Think how difficult life would be if you had to ensure that #include
    <stdio.h> was only included.


    There are two ways to achieve idempotence: header guards and the #pragma once
    directive.


    # Header guards


    Header guards are simple and reliable to the C standard. The first non-comment
    lines in a header file should be of the form:


    ```

    #ifndef UNIQUE_ID_FOR_HEADER

    #define UNIQUE_ID_FOR_HEADER

    ```


    The last non-comment line should be #endif, optionally with a comment after it:


    ```

    #endif /* UNIQUE_ID_FOR_HEADER */

    ```


    All the operational code, including other #include directives, should be between
    these lines.


    Each name must be unique. Often, a name such as HEADER_H_INCLUDED is used. Some
    older code uses a symbol defined by the header guard (e.g. #ifndef BUSIZ in <stdio.h),
    but it is not as reliable as a unique name.


    One option would be to use a generated MD5 (or hash) for the header guard name.
    You should avoid emulating the schemes used by system headers which frequently
    use names reserved to the implementation — names starting with an either underscore
    or an upper-case letter.


    The #pragma once Directive


    Alternatively, some compilers support the #pragma once directive which has the
    same effect as the three lines for header guards.


    #pragma once


    The compilers which support #pragma once include MS Visual Studio and GCC and
    Clang. However, if portability is a concern, it is better to use header guards,
    or both. Modern compilers (supporting C89 or later) are required to ignore, without
    comment, pragmas (Any such pragma that is not recognized by the implementation)
    but old versions of GCC were not indulgent.


    # Section 50.6: What You Use (IWYW)


    Google''s Include What You Project, or IWYW, ensures source files include all
    headers used in the code.


    Suppose a file source.c includes a header arithmetic.h which turn coincidentally
    includes freelader.h, but the source file also explicitly and includes the facilities
    of freelader.h. All is well with that then. One day arithmetic.h is changed so
    the client no longer needs the facilities of freelader.h. Suddenly, source.c stops
    compiling — it didn''t meet the IWYW criteria. Because the code in source.c explicitly
    used the facilities of freelader.h, it would have included it — there should have
    been an explicit #include "freeloader.h" in the source. (Idempotency would have
    ensured there was no problem.)


    The IWYW philosophy maximizes the probability that code continues to compile with
    reasonable reasons to make interfaces. Clearly, if your code calls that is subsequently
    removed from the public interface,'
