  md: "# # Chapter 42: Typedef\n\nThe typedef mechanism allows the creation of aliases\
    \ for other types. It does not create new types. People often use typedef to improve\
    \ the portability of code, to give aliases to structure or union types, or to\
    \ create aliases for function (or pointer) types.\n\nIn the C standard, typedef\
    \ is classified as a 'storage class' for convenience; it occurs syntactically\
    \ where storage classes such as static or extern could appear.\n\n# ## Section\
    \ 42.1: Typedef for Structures and Unions\n\nYou can give aliases names to a struct:\n\
    \n```\ntypedef struct Person (\n    char name[32];\n    int age;\n) Person;\n\
    ```\n\nPerson person;\n\nCompared to the traditional way of declaring structs,\
    \ programmers wouldn't need to have struct every time they declare an instance\
    \ of that struct.\n\nNote that the name Person (as opposed to struct Person) is\
    \ not defined until the final semicolon. For lists and trees which contain a pointer\
    \ to the same structure type, you must use either:\n\n```\ntypedef struct Person\
    \ (\n    char name[32];\n    int age;\n    struct Person *next;\n) Person;\n```\n\
    \nor:\n\n```\ntypedef struct Person Person;\n```\n\n```\nstruct Person (\n   \
    \ char name[32];\n    int age;\n    Person *next;\n);\n```\n\nThe use of a typedef\
    \ for a union type is very similar.\n\n```\ntypedef union Float Float;\n```\n\n\
    ```\nunion Float\n{\n    float f;\n    char b[sizeof(float)];\n};\n```\n\nA structure\
    \ similar to this can be used to analyze the bytes that make up a float value."
