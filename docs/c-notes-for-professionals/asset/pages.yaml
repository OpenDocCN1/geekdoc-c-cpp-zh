    # Section 19.3: Using GNU getopt tools


    Command-line options for applications are not treated any differently from command-line
    arguments by the C language. They are just arguments, which in a Linux or Unix
    environment, traditionally begin with a dash (-).


    With glibc in a Linux or Unix environment you can use the getopt tools to easily
    define, validate, and parse command-line options from the rest of your arguments.


    These tools expect you to be formatted according the GNU Coding Standards, which
    is an extension of POSIX specifies for the format of command-line options.


    The example below demonstrates command-line options with the GNU getopt tools.


    ```

    #include <stdio.h>

