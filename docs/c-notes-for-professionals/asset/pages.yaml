  md: '# Section 3.2: Fixed Width Integer Types (since C99)


    ≥ C99


    The header stdint.h provides several fixed-width integer type definitions. These
    types are optional and only provided if the platform has an integer type of the
    corresponding width, and if the corresponding signed type has a two''s complement
    representation of negative values.


    See the remarks for usage of fixed-width types.


    ```

    /* commonly used types include /

    uint32_t u32 = 32; /* exactly 32-bit wide *

    uint8_t u8 = 255; /* exactly 8-bit wide *

    int64_t i64 = -65; /* exactly 64 bit in two''s complement representation */

    ```


    # Section 3.3: Integer types and constants


    Signed integers can be of these types (the int short, or long is optional):


    ```

    signed char c = 127; /* required to be 1 byte, see remarks for further information.
    *

    signed short int si = 32767; /* required to be at least 16 bits *

    signed int i = 32767; /* required to be at least 16 bits *

    signed long li = 2147483647; /* required to be at least 32 bits. */

    ```


    ≥ C99


    ```

    signed long int li = 2147483647; /* required to be at least 64 bits */

    ```


    Each of these integer type has an unsigned version.


    ```

    unsigned int i = 65535;

    unsigned short = 2767;

    unsigned char c = 255;

    ```


    For all types char the signed version is assumed if the signed or unsigned part
    is omitted. The type constitutes a character type, different from signed char
    and unsigned char and the signed (or not) depends on the platform.


    Different types of integer constants (literals in C jargon) can be written in
    different bases, and width based on their prefix or suffix.


    ```

    /* the following variables are initialized to the same value: /

    int d = 42; /* decimal constant (base10) *

    int o = 052; /* octal constant (base8) *

    int X = 0af; /* hexadecimal constant (base16) * (letters ''a'' through ''f'' (case
    insensitive) represent 10 through 15) */

    ```


    Decimal constants are always signed. Hexadecimal constants start with 0x or 0X
    and octal constants start just with a 0. The type then signed or unsigned depending
    on whether the value fits into the signed type or not.


    ```

    /* suffixes for width and size : /

    long i = 0x32; /* no suffix int, or long int *

    unsigned ui = 65535; /* u or U represent unsigned int, or long int *

    long li = 65536; /* l or L represent long int */

    ```


    Without a suffix the first type that fits its value, is a decimal constant that
    is larger'
