  md: "# Section 4.4: Short circuit behavior of logical operators\n\nShort circuiting\
    \ is a functionality that skips evaluating parts of a (if/while/...) condition\
    \ when able. In case of a logical operation on two operands, the first operand\
    \ is evaluated (to true or false) and if there is a verdict (i.e first operand\
    \ is false using &&, first operand is true when ||) the second operand is not\
    \ evaluated.\n\nExample:\n\n```\n#include <stdio.h>\n\nint main(void) {\n    int\
    \ a = 20;\n    int b = -5;\n\n    /* 'b == -5' is not evaluated,\n       since\
    \ 'a != 20' is false. */\n    if (a != 20 && b == -5) {\n        printf(\"I won't\
    \ be printed!\\n\");\n    }\n\n    return 0;\n}\n```\n\nCheck it out yourself:\n\
    \n```\n#include <stdio.h>\n\nint print(int i) {\n    printf(\"print function %d\\\
    n\", i);\n    return 1;\n}\n\nint main(void) {\n    int a = 20;\n\n    /* 'print(a)'\
    \ is not called,\n       since 'a != 20' is false. */\n    if (a != 20 && print(a))\
    \ {\n        printf(\"I won't be printed!\\n\");\n    }\n\n    /* 'print(a)' is\
    \ called,\n       since 'a == 20' is true. */\n    if (a == 20 && print(a)) {\n\
    \        printf(\"I will be printed!\\n\");\n    }\n\n    return 0;\n}\n```"
