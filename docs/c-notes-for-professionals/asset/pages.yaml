  md: '# Section 30.8: Predefined Macros


    A predefined macro is a macro that is already understood by the C preprocessor
    without the program needing to define it. Examples include


    Mandatory Predefined Macros


    +   * __FILE__ gives the file name of the current source file (a string literal),

    * __LINE__ for the current line number (an integer constant),

    * __DATE__ for the compilation date (a string literal),

    * __TIME__ for the compilation time (a string literal).


    There''s also a related identifier, __func__ (ISO/IEC 9899:2011 §6.4.2.2), which
    is not a macro:


    > The identifier __func__ shall be implicitly declared by the translator as if,
    immediately following the opening brace of each function declaration, the declaration:

    ```c

    static const char __func__ = "function-name";

    ```nappeared, where function-name is the name of the lexically-enclosing function.


    __FILE__, __LINE__, and __func__ are especially useful for debugging purposes.
    For example:


    ```

    fprintf(stderr, "%s: %s: %d Denominator is %d\n", __FILE__, __func__, __LINE__);

    ```


    Pre-99 compilers may or not use __func__ or may have a macro that acts the same
    but is named differently. For example, gcc used __FUNCTION__ in C89 mode.


    The below macros allow for implementation details:


    +   * __STDC_VERSION__ The version of the C Standard implemented. This is a constant
    integer returning

    yyyymml (for example, 2011L for C11, 19990L for C99; wasn''t defined for C89/C90)

    * __STDC_HOSTED__ 1 if it''s a hosted implementation, else 0.

    * __STDC__ 1, the implementation conforms to the C Standard.


    Other Predefined Macros (non mandatory)


    ISO/IEC 9899:2011 §6.10.2 Environment macros:


    +   * __STDC_ISO_10646__ An integer of the form yyyymmL (for example, 19972L).
    If this is defined, then every character in the Unicode required set, when stored
    in an object

    type wchar_t, consists of all the characters that are defined by ISO/IEC 10646,
    with all amendments and technical corrigenda, as of the specified year and month.
    If some other encoding exists, the macro shall not be defined and the actual encoding
    used is implementation-defined.

    * __STDC_MB_MIGHT_NEOC__ The integer 1, intended to indicate that, in the encoding
    for wchar_t, a member of the basic character set need not have a code value equal
    to its value'
