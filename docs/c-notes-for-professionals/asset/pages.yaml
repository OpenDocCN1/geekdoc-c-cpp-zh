    \ 2, 3, 4, 5};\n    int *ptr = &array[0];\n    int *ptr2 = ptr + sizeof(int) *\
    \ 2; /* wrong # */\n    printf(\"%d %d\\n\", ptr, ptr2);\n    return 0;\n}\n```\n\
    \nThis code does extra scaling in calculating pointer assigned to ptr2. If size(int)\
    \ is 4, which is typical in modern 32-bit environments, the expression stands\
    \ for \"8 elements after array[0]\", which is out-of-range, and it invokes undefined\
    \ behavior.\n\nTo have ptr2 point to where there are 2 elements after array[0],\
    \ you should simply add 2.\n\n```\n#include <stdio.h>\nint main(void) {\n    int\
    \ array[] = {1, 2, 3, 4, 5};\n    int *ptr = &array[0];\n    int *ptr2 = ptr +\
    \ 2;\n    printf(\"%d %d\\n\", ptr, ptr2); /* \"1 3\" will be printed */\n   \
    \ return 0;\n}\n```\n\nExplicit pointer arithmetic using additive operators may\
    \ be confusing, so array subscripting may be better.\n\n```\n#include <stdio.h>\n\
    int main(void) {\n    int array[] = {1, 2, 3, 4, 5};\n    int *ptr = &array[0];\n\
    \    int *ptr2 = &array[2];\n    printf(\"%d %d\\n\", ptr, ptr2); /* \"1 3\" will\
    \ be printed */\n    return 0;\n}\n```\n\nE[1] is equal to ((E[1]+E[2])) [N1570\
    \ 6.5.2.1, paragraph 2), and &(E[1]+E[2])) is equivalent to ((E[1]+E[2]))"
