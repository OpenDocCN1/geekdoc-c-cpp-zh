  md: "# snprintf()\n\nTo avoid buffer overflow, `snprintf()` may be used. It is not\
    \ the best solution performance-wise since it has to parse the template string,\
    \ but it is the only buffer-safe function for copying strings readily-available\
    \ in standard library, without using any extra steps.\n\n```\n#include <stdio.h>\n\
    #include <string.h>\n\nint main(void) {\n    char a[] = \"012345678901234567890\"\
    ;\n    char b[8];\n\n    #if 0\n        strcpy(b, a); /* causes buffer overflow\
    \ (undefined behavior), so do not execute here! */\n    #endif\n\n    snprintf(b,\
    \ sizeof(b), \"%s\", a); /* does not cause buffer overflow */\n    printf(\"%s\\\
    n\", b); /* \"0123456\" will be printed */\n\n    return 0;\n}\n\nstrncat();\n\
    ```\n\nA option, with better performance, is to use `strncat()` (a bufferのである\
    \ checking version of `strcat()`) which takes a third argument that tells it the\
    \ maximum number of bytes to copy:\n\n```\nchar dest[32];\ndest[0] = '\\0';\n\
    strncat(dest, source, sizeof(dest) - 1);\n/* copies to the first (sizeof(dest)-1)\
    \ elements of source into dest, and then puts a \\0 at the end of * */\n```\n\n\
    Note that this formation use of `sizeof(dest) - 1` is crucial because `strcat()`\
    \ always adds a null byte (good), but doesn't count the size of the string (a\
    \ cause of confusion and buffer overflows).\n\nAlso note that the alternative\
    \ - concatenating after a non-empty string is even more fraught. Consider:\n\n\
    ```\nchar dst[24] = \"Clownfish\";\nchar src[] = \"Marvin and Nemo\";\nsize_t\
    \ len = strlen(dst);\n\nstrncat(dst, src, sizeof(dst) - len - 1);\nprintf(\"%zu:\
    \ [%s]\\n\", strlen(dst), dst);\n```\n\nThe output is:\n\n23: [Clownfish: Marvin\
    \ and N\n\nNote, though the size specified as the length was not the size of the\
    \ destination array, but the amount of space left in, not counting the terminal\
    \ null byte. This can cause overwriting problems. It is also bit wasteful; to\
    \ specify the length correctly, you know the length of the data in the destination,\
    \ so you could instead specify the address of the null byte at the end of the\
    \ existing content, saving `strncat()` from rescanning:\n\n```\nstrcpy(dst, \"\
    Clownfish: \");\n```"
