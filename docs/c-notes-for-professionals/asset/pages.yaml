  md: "# Chapter 36: Aliasing and effective type\n\n# Section 36.1: Effective type\n\
    \nThe effective type of a data object is the last type information that was associated\
    \ with it, if any.\n\n```\n// a normal variable, effective type uint32_t, and\
    \ this type never changes\nuint32_t a = 0.0;\n\n// effective type of *pa is uint32_t,\
    \ too, simply\n// because *pa is the object a\nuint32_t* pa = &a;\n\n// the object\
    \ pointed to by q has no effective type, yet\nvoid* q = malloc(sizeof(uint32_t));\n\
    // the object pointed to by q still has no effective type,\n// because nobody\
    \ has written to it\nuint32_t* q = q;\n// *qb now has effective type uint32_t\
    \ because a uint32_t value was written\nqb = 37;\n\n// the object pointed to by\
    \ r has no effective type, although\n// it is initialized\nvoid* r = calloc(1,\
    \ sizeof(uint32_t));\n// the object pointed to by r still has no effective type,\n\
    // because nobody has read to or from it\nuint32_t* rc = r;\n// *rc now has effective\
    \ type uint32_t because the read operation is valid because used calloc.\n// from\
    \ it that type. The read operation is valid because used calloc.\n// Now the object\
    \ pointed to by r (which is the same as *rc) has\n// gained an effective type,\
    \ although we didn't change its value.\nuint32_t* c = *rc;\n\n// the object pointed\
    \ to by s has no effective type, yet.\nvoid* s = malloc(sizeof(uint32_t));\n//\
    \ the object pointed to by s now has effective type uint32_t\n// because an uint32_t\
    \ value is copied into it.\n```\n\nObserve for the latter, it was not necessary\
    \ that we even have uint32_t* pointer to that object. The fact that we have copied\
    \ uint32_t object is sufficient.\n\n# Section 36.2: restrict qualification\n\n\
    If we have two arguments of the same type, the compiler can't make any assumption\
    \ and will always have to assume that the change to *e may change *.\n\n```\n\
    void fun(float* e, float* f) {\n    float a = *f;\n    *e = 22;\n    float b =\
    \ *f;\n    print(\"%%s equal to %g?\\n\", a, b);\n}\n\nfloat fval = 4;\nfloat\
    \ eval = 77;\nfun(&e, &fval);\n```"
