  md: "# Chapter 13: Structs\n\nStructures provide a way to group a set of related\
    \ variables of diverse types into a single unit of memory. The structure as a\
    \ whole can be referenced by a single name or pointer; the structure members can\
    \ be accessed individually. Structs can be passed to and returned from functions;\
    \ they are defined using the keyword struct.\n\n# Section 13.1: Flexible Array\
    \ Members\n\nVersion » C99\n\nType Declaration\n\nA structure with at least one\
    \ member may additionally contain a single array member of unspecified length\
    \ at the end of the structure. This is called a flexible array member:\n\n```\n\
    struct ex1\n{\n    size_t foo;\n    int flex[];\n};\n\nstruct ex2_header\n{\n\
    \    int foo;\n    char bar;\n};\n\nstruct ex2\n{\n    struct ex2_header hdr;\n\
    \    int flex[];\n};\n\n/* Merged ex2_header and ex2 structures. */\nstruct ex3\n\
    {\n    int foo;\n    char bar;\n    int flex[];\n}\n```\n\n# Effects on Size and\
    \ Padding\n\nA flexible array member is treated as having no size when calculating\
    \ the size of a structure, though padding between that member and the previous\
    \ member of the structure may exist:\n\n> /* Prints \"8,8\" on my machine, so\
    \ there is no padding. */\nprintf(\"%zu,%zu\\n\", sizeof(size_t), sizeof(struct\
    \ ex1));\n\n> /* Also prints \"8,8\" on my machine, so there is no padding in\
    \ the ex2 structure itself. */\nprintf(\"%zu,%zu\\n\", sizeof(struct ex2_header),\
    \ sizeof(struct ex2));\n\n> /* Prints \"5,8\" on my machine, so there are 3 bytes\
    \ of padding. */\nprintf(\"%zu,%zu\\n\", sizeof(int) + sizeof(char), sizeof(struct\
    \ ex3));\n\nThe flexible array member is considered to have an incomplete array\
    \ type, so it cannot be calculated using size."
