    The <stdint.h> header and the related <intypes.h> header define standard type
    names (using typedef) for integers of various sizes, and these names are often
    the best choice in modern code that need fixed size integers. For example, uint8_t
    is an unsigned 8-bit integer; int64_t is a signed 64-bit integer type. The type
    uintptr_t is an unsigned integer type big enough to hold any pointer to object.
    These types are theoretically optional — but is rare for them not to be available.
    There are variants like uint_least16_t (the smallest unsigned integer type with
    at 16 bits) and int_fast32_t (the fastest signed integer type with at 32 bits).
    Also, intmax_t and uintmax_t are the largest integer types supported by the implementation.
    These types are mandatory.


