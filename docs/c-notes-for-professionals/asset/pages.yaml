  md: "# # Chapter 9: Bit-fields\n\n| Parameter | Description |\n|---|---|\n| type-specifier\
    \ | signed, unsigned, int or _Bool |\n| identifier | The name for this field in\
    \ the structure |\n| size | The number of bits to use for this field |\n\nMost\
    \ variables in C have an integral number of bytes. Bit-fields are a part of a\
    \ structure that don't necessarily occupy an integral number of bytes; they can\
    \ occupy any number of bits. Multiple bit-fields can be packed into a single storage\
    \ unit. They are a part of standard C, but there are many aspects that are implementation\
    \ defined. They are one of the least portable parts of C.\n\n# ## Section 9.1:\
    \ Bit-fields\n\nA simple bit-field can be used to describe things that may have\
    \ a specific number of bits involved.\n\n```\nstruct encoderPosition {\n    unsigned\
    \ int encoderCounts : 23;\n    unsigned int encoderTurns : 4;\n    unsigned int\
    \ _reserved : 5;\n};\n```\n\nIn this example we consider an encoder with 23 bits\
    \ of single precision and 4 bits for multi-turn. Bit-fields are often used when\
    \ interfacing with hardware that outputs data with specific number of bits. Another\
    \ example could be communication with an FPGA, where the FPGA writes data into\
    \ your memory in 32 bit sections allowing for hardware reads:\n\n```\nstruct FPGAInfo\
    \ {\n    struct {\n        unsigned int bulb10n : 1;\n        unsigned int bulb20n\
    \ : 1;\n        unsigned int bulb10off : 1;\n        unsigned int bulb20off :\
    \ 1;\n        unsigned int jet0n : 1;\n    };\n    unsigned int data;\n};\n```\n\
    \nFor this example we have shown a commonly used construct to access the data\
    \ in its individual bits, or to write the data as a whole (emulating the FPGA\
    \ might do). We could then access the bits like this:\n\n```\nFPGAInfo info;\n\
    finfo.data = 0xFF34F;\nif (finfo.bits.bulb10n) {\n    printf(`Bulb 1 is on\\n`);\n\
    }\n```\n\nThis is valid, but as per the C99 standard 6.7.2.1, item: 10:\n\n> The\
    \ order of allocation of bit-fields within a unit (high-order to low-order or\
    \ low-order to high-order) is implementation-defined."
