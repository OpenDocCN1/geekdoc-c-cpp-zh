  md: "# Explanation for the Reverse List Method\n\nWe start the previousNode out\
    \ NULL, since we know on the first iteration of the loop, if we are looking for\
    \ the node before the first head, it will be NULL. The first node will become\
    \ the last node in the list, and the next variable should naturally be NULL.\n\
    \nBasically, the concept of reversing the linked list is here that we actually\
    \ reverse the links themselves. Each node's next member will become the node before\
    \ it, like so:\n\n```\nHead -> 1 -> 2 -> 3 -> 4 -> 5\n```\n\nWhere each number\
    \ represents a node. This list would:\n\n```\n1 <- 2 <- 3 <- 4 <- 5 <- Head\n\
    ```\n\nFinally, the head should point to the 5th node instead, and each node should\
    \ point to the previous of it.\n\nNode 1 should point to NULL since there was\
    \ nothing before it. Node 2 should point to node 1, node 3 should point to node\
    \ 2, and et cetera.\n\nHowever, there is one small problem with this method. If\
    \ we break the link to the next node and change it to the previous node, we will\
    \ not be able to traverse to the next node in the list it is gone to.\n\nThe solution\
    \ to this is to simply store the next element in a variable(nextNode) before changing\
    \ the link.\n\n# Section 11.3: Inserting a node at the nth position\n\nSo far,\
    \ we learned inserting at the beginning of a singly linked list. Most of the times\
    \ you will want to be able to insert nodes elsewhere as well. The code written\
    \ below shows how it is possible to insert nodes anywhere in the linked lists.\n\
    \n```\n#include <stdio.h>\n#include <stdlib.h>\n\nstruct Node {\n    int data;\n\
    \    struct Node* next;\n};\n\nstruct Node* insert(struct Node head, int value,\
    \ size_t position)\nvoid print_list(struct Node head);\n\nint main(int argc, char\
    \ *argv[]) {\n    struct Node *head = NULL; // Initialize the list to be empty\
    \ */\n    /* insert at positions with values: */\n    head = insert(head, 1, 0);\n\
    \    head = insert(head, 100, 1);\n    head = insert(head, 21, 2);\n    head =\
    \ insert(head, 2, 3);\n    head = insert(head, 5, 4);\n    head = insert(head,\
    \ 42, 2);\n\n    print_list(head);\n    return 0;\n}\n```"
