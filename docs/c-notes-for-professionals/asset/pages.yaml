  md: '# # Chapter 37: Compilation


    The C language is traditionally a compiled language (as opposed to interpreted).
    The C Standard defines translation phases, and the product of applying them is
    a program image (or compiled program). In c11, the phases are listed in §5.1.1.2.


    # ## 37.1: The Compiler


    After the C pre-processor handles all the header files and expands macros, the
    C compiler can compile the program. It does by turning the C source code into
    an object code, a file ending in .which contains the binary version of the source
    code. Object code is not directly executable, though. In order to make an executable,
    you also have to add code for all of the library functions that are #included
    in the file (this is not the same as including the declarations, which is what
    #include does). This is the job of the linker.


    In general, exact how to invoke a C compiler depends much on the system you are
    using. Here we are using gcc, though it should be noted that many compilers exist:


    ```

    % gcc -Wall -c foo.c

    ```


    % is the OS'' command prompt. This tells the compiler to run the pre-processor
    on the file foo.c and then compile it into the object file foo.o but not to invoke
    the linker. This option -c is available on POSIX systems, such as Linux or macOS;
    other systems may use different syntax.


    If your program is in one source file, you can instead do this:


    ```

    % gcc -Wall foo.c -o foo

    ```


    This tells the compiler to run the pre-processor on foo.c, compile it and then
    link it to create an executable called foo. The -o option sets the next word on
    the line is the name of the binary executable file (program). If you do not specify
    the -o (if you just type gcc.c), the executable will be named a.out for historical
    reasons.


    In general the compiler performs four steps when compiling .c file into an executable:


    +   - **pre-processing** - typically expands #include and #define macros in .c
    file

    - **compilation** - converts the source into assembly (you can stop the compiler
    at this step by adding the -S option)

    - **assembly** - converts the assembly into machine code

    - **linkage** - links the object code to external libraries to create an executable


    Note that the compiler we are using is GCC, which stands for "GNU compiler" and
    "GNU compiler collection", depending on context. Other compilers exist. For Unix-like
    operating systems, many of them have the name cc, for "C compiler", which is a
    symbolic link to some other compiler. On Linux systems, cc is an alias for GCC.
    On macOS or OS-X, it points to clang.


    The POSIX standards mandate c99 as the name of a C compiler — it supports the
    C99 standard by default. Early versions of POSIX mandated c89 as the compiler.
    POSIX also mandates that this compiler understands the options -c and -o that
    we used above.


    **Note:** The -Wall option in both gcc examples tells the compiler to print warnings
    about questionable constructs, which are recommended. It is also a good idea to
    add other warning options, e.g. -Wextra.'
