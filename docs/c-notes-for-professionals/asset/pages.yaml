    # # Section 6.4: Basic introduction to strings


    In C, a string is a sequence of characters that is terminated by a null character
    (''\0'').


    We can create strings using string literals, which are sequences of characters
    surrounded by double quotation marks; for example, take the string `hello world`.
    String literals are automatically null-terminated.


    We can create strings using several methods. For instance, we can declare a char
    * and initialize it to the point of the first character of a string:


    ```

    char * string = "hello world";

    ```


    When initializing a char * to a constant as above, the string itself is usually
    allocated in read-only data; the character is ''h''.


    Since the string literal is allocated in read-only memory, it is non-modifiable!
    Any attempt to modify it will lead to undefined behaviour, so it''s better to
    add const to get a compile-time error like this


    ```

    char const * string = "hello world";

    ```


    It has similar effect as


    ```

    char const string_arr[] = "hello world";

    ```


    To create a modifiable string, you can declare a character array and initialize
    its contents using a string literal, which is


    ```

    char modifiable_string[] = "hello world";

    ```


    This is equivalent to the following:


    ```

    char modifiable_string[] = {''h'', ''e'', ''l'', ''l'', ''o'', '' '', ''w'', ''o'',
    ''r'', ''l'', ''d'', ''\0''};

    ```


    Since the version used brace-enclosed initializer, the string is not automatically
    null-terminated unless a ''\0'' is included in the character array as its last
    element.


    Non-modifiable implies that the string in literal cannot be modified, but remember
    that the pointer can be modified (point somewhere else or can be incremented or
