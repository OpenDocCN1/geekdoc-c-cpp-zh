  md: "# # Chapter 12: Enumerations\n\n# ## Section 12.1: Simple Enumeration\n\nAn\
    \ enumeration is a user-defined data type consists of integral constants and each\
    \ integral constant is given a name. Keyword `enum` is used to define enumeration\
    \ data type.\n\nIf you use `enum` instead of `int` or `string/char*`, you increase\
    \ compile-time checking and avoid errors from passing invalid constants, and you\
    \ document which values are legal to use.\n\n**Example 1**\n\n```\nenum color\
    \ { RED, GREEN, BLUE };\n\nvoid printColor(enum chosenColor) {\n    const char\
    \ *color_name = \"Invalid color\";\n    switch (chosenColor) {\n        case RED:\n\
    \            color_name = \"RED\";\n            break;\n        case GREEN:\n\
    \            color_name = \"GREEN\";\n            break;\n        case BLUE:\n\
    \            color_name = \"BLUE\";\n            break;\n    }\n    printf(\"\
    %s\\n\", color_name);\n}\n```\n\nWith a main function defined as follows (for\
    \ example):\n\n```\nint main() {\n    enum color chosenColor;\n    printf(\"Enter\
    \ a number between 0 and 2:\");\n    scanf(\"%d\", (int*)&chosenColor);\n    printColor(chosenColor);\n\
    \    return 0;\n}\n```\n\n*Version $\\$C99*\n\n**Example 2**\n\n(This example\
    \ uses designated initializers which are standardized since C.99).\n\n```\nenum\
    \ week { MON, TUE, WED, THU, FRI, SAT, SUN };\nstatic const char *dow[] = {\n\
    \    [MON] = \"Mon\", [TUE] = \"Tue\", [WED] = \"Wed\",\n    [THU] = \"Thu\",\
    \ [FRI] = \"Fri\", [SAT] = \"Sat\", [SUN] = \"Sun\"\n};\n\nvoid printDayOfWeek(enum\
    \ week day) {\n    printf(\"%s\\n\", dow[day]);\n}\n```"
