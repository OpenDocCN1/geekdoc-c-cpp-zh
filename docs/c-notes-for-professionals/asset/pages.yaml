  md: "```\nint max_int(int, int);\nunsigned max_unsigned(unsigned, unsigned);\ndouble\
    \ max_double(double, double);\n```\n\n```\n#define MAX(X, Y) _Generic((X+Y), \\\
    \nint: max_int, \\\nunsigned: max_unsigned, \\\ndefault: max_double) \\\n(X),\
    \ (Y))\n```\n\nHere, the controlling expression (X)+(Y) is only inspected to its\
    \ type and not evaluated. The usual conversions for arithmetic operations are\
    \ performed to the selected type.\n\nFor more complex situation, a selection can\
    \ be made based on more than one argument to the operator, by nesting them.\n\n\
    This example selects between four externally implemented functions, that take\
    \ combinations of two int and/or string arguments, and return their sum.\n\n```\n\
    int AddInt(int a, int b);\nAddIntStr(int a, const char* b);\nAddIntStr(const char*\
    \ a, int b);\nAddIntStr(const char* a, const char* b);\n```\n\n```\n#define AddStr(y)\
    \ _Generic((y), \\\nint: AddIntStr, \\\nchar*: AddStr, \\\nconst char*: AddStrStr)\n\
    ```\n\n```\n#define AddInt(y) _Generic((y), \\\nint: AddInt, \\\nchar*: AddIntStr,\
    \ \\\nconst char*: AddIntStr)\n```\n\n```\n#define Add(x, y) _Generic((x), \\\n\
    int: AddInt(y), \\\nchar*: AddStr(y), \\\nconst char*: AddStr(y)) \\\n((x), (y))\n\
    ```\n\n```\nint main( void ) {\n    int result = 0;\nresult = Add(100, 999);\n\
    result = Add(100, \"999\");\nresult = Add(\"100\", 999);\nresult = Add(\"100\"\
    , \"999\");n\n```\n\n```\nconst int a = -123;\nchar b[] = \"4321\";\nresult =\
    \ Add(a, b);\n```\n\n```\nint c = 1;\nconst char d[] = \"0\";\nresult = Add(d,\
    \ ++c);\n}\n```\n\nEven though it appears as if y is evaluated more than once,\
    \ it isn't 1. Both arguments are evaluated only once, at the end of the macro\
    \ Add (x, y), just like in an ordinary function call."
