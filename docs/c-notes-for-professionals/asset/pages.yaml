    - the threads could synchronize their accesses via a mutex, one locking that mutex\
    \ before accessing a and unlocking afterward.\n\nAs the mutex option demonstrates,\
    \ avoiding a data race does not require ensuring a specific order of operations,\
    \ such as the child thread modifying a before the main thread reads it; it is\
