  md: "Some guides go so far as recommend that code sections must never be commented\
    \ and that if code is to temporarily disabled one could resort to an #if 0 directive.\n\
    \nSee #if 0 to block code sections.\n\n# Section 63.16: Ignoring return values\
    \ of library functions\n\nAlmost every function in C standard libraries returns\
    \ something on success, and something else on error. For example, malloc will\
    \ return a pointer to the memory block allocated by the function on success, and,\
    \ if the function failed to allocate the requested block of memory, a null pointer.\
    \ You should always check the return value for earlier debugging.\n\nThis is bad:\n\
    \n```\nchar x = malloc(100000000000UL * sizeof(x));\n/* more code */\nscanf(\"\
    %s\", x); // This might invoke undefined behaviour and if lucky causes a segmentation\
    \ violation, unless your system has a lot of memory /*\n```\n\nThis is good:\n\
    \n```\n#include <stdlib.h>\n#include <stdio.h>\n\nint main(void) {\n    char x\
    \ = malloc(100000000000UL * sizeof(x));\n    if (x == NULL) {\n        perror(\"\
    malloc failed\");\n        exit(EXIT_FAILURE);\n    }\n\n    if (scanf(\"%s\"\
    , x) != 1) {\n        fprintf(stderr, \"could not read string\\n\");\n       \
    \ free(x);\n        exit(EXIT_FAILURE);\n    }\n\n    /* Do not stuff with x.\
    \ */\n\n    /* Clean up. */\n    free(x);\n\n    return EXIT_SUCCESS;\n}\n```\n\
    \nThis you know right away the cause of error, otherwise you might spend hours\
    \ looking for a bug in a completely wrong place.\n\n# Section 63.17: Comparing\
    \ floating point numbers\n\nFloating types (float, double and long double) cannot\
    \ precisely represent some numbers because they have finite precision and represent\
    \ in the binary format. Just like we have repeating decimals in base 10 for fractions\
    \ such as 1/3, there are fractions that cannot be represented in binary to two\
    \ (such as 1/3, but also, importantly, 1/10). Do not directly compare floating\
    \ point values; use a delta instead.\n\nGoalKicker.com – C Notes for Professionals"
