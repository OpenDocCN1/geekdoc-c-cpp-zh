  md: "is example, you need these DebugBreak() in other places in your code and it\
    \ will execute the assembly instruction. Not that even though gcc will not modify\
    \ any asm statement, the optimizer may still move consecutive asm statements.\
    \ If you have multiple assembly instructions that must occur in a specific order,\
    \ include them in one asm statement.\n\n# Section 38.3: gcc Extended asm support\n\
    \nAsended asm support in gcc has the following syntax:\n\n```\nasm [volatile]\
    \ ( AssemblerTemplate\n    : OutputOperands\n    : InputOperands\n    : Clobbers\
    \ )\\n\nsm [volatile] goto ( AssemblerTemplate\n    : InputOperands\n    : Clobbers\n\
    \    : OutputLabels)\n```\n\nwhere AssemblerTemplate is the template for the assembler\
    \ instruction, OutputOperands are C variables that can be modified by the assembly\
    \ code, InputOperands are any variables used as input parameters, Clobbers are\
    \ a list or registers that are modified by the assembly code, and OutputLabels\
    \ are any code label that may be used in the assembly code.\n\nThe extended format\
    \ used within C functions and is the more typical type of inline assembly. Below\
    \ is an example from the Linux kernel for byte swapping 16-bit and 32-bit numbers\
    \ for an ARM processor:\n\n```\n/* From arch/arm/include/asm/swab.h in Linux kernel\
    \ version 4.6.4 */\n#if __LINUX_ARM_ARCH__ > 6\nstatic inline __attribute__((const))\
    \ __u32 __arch_swab32(__u32 x)\n{\n    __asm__ ((\"rev16, %%1\" : \"=r\" (x) :\
    \ \"r\" (x));\n    return x;\n}\n#define __arch_swab32 __arch_swab32\n#define\
    \ __arch_swab16((__u16))__arch_swab32(x))\n\nstatic inline __attribute__((const))\
    \ __u32 __arch_swab32(__u32 x)\n{\n    __asm__ ((\"rev, %%1\" : \"=r\" (x) : \"\
    r\" (x));\n    return x;\n}\n#define __arch_swab32__ __arch_swab32\n\n#endif\n\
    ```\n\nEach section uses the x as its input and output parameter. The C function\
    \ returns the manipulated result.\n\nWith the extended asm format, gcc may optimize\
    \ the assembly instructions in an asm block the same rules it uses for optimizing\
    \ C code. If you want your asm section to remain untouched, use the volatile keyword\
    \ for the asm section."
