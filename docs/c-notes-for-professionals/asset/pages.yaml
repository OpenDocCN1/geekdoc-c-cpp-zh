    \ positive value if the first\nelement passed is \"larger\" in some sense than\
    \ the latter and otherwise the function returns a\nnegative value (meaning that\
    \ the first element is \"lesser\" than the latter).\n\nWithout a typedef you would\
    \ pass a pointer as an argument to a function in the following manner:\n\n```\n\
    void sort(int (*compare)(const void *elem1, const void *elem2)) {\n    /* inside\
    \ of this block, the function is named \"compare\" */\n}\n```\n\nWith a typedef,\
    \ we'd write:\n\n```\ntypedef int (*compare_func)(const void *, const void *);\n\
    ```\n\nand then we could change the signature of sort to:\n\n```\nvoid sort(compare_func\
    \ func) {\n    /* In this block the function is named \"func\" */\n}\n```\n\n\
    both definitions of sort would accept any function of the form\n\n```\nint compare(const\
    \ void *arg1, const void *arg2) {\n    /* Note that the variables name do not\
    \ have to be \"elem1\" and \"elem2\" */\n}\n```\n\nFunction pointers are the only\
    \ place where you should include the pointer property of the type, e.g. do not\
    \ try to\ndefine types like typedef struct something_struct *something_type. This\
    \ applies even for a structure with\nmembers which are not supposed to be accessed\
    \ directly by API callers, for example the stdio.h FILE type (which is\nyou will\
    \ notice is not a pointer).\n\n# Taking pointers\n\nA function pointer should\
    \ always take a user-supplied void * as a context pointer.\n\n# Example\n\n```\n\
    /* function minimiser, details unimportant */\ndouble doubleminimum(double (*fptr)(double\
    \ x, double y, void *ctx), void *ctx) {\n    /* repeatedly makes calls like this\
    \ */\n    temp = (*fptr)(testx, testy, ctx);\n}\n\n/* the function we are minimizing,\
    \ sum cubics */\ndouble cubics(double x, double y, void *ctx) {\n    double *coeffsx\
    \ = ctx;\n    double *coeffsy = coeffsx + 4;\n\n    return coeffsx[0] = x * x\
    \ * x + coeffsx[1] * x * x + coeffsx[2] * x + coeffsx[3];\n           coeffsy[0]\
    \ = y * y * y + coeffsy[1] * y * y + coeffsy[2] * y + coeffsy[3];\n}\n```\n\n\
    ```\nvoid caller()\n```"
