  md: '# # Chapter 10: Arrays


    Arrays are derived data types, representing an ordered collection of values ("elements")
    of another type. Arrays in C have a fixed number of elements of any type, and
    its representation stores the elements contiguously in memory without gaps or
    padding. C allows multidimensional arrays whose elements are other arrays, and
    also portrays of pointers.


    C supports dynamically allocated arrays whose size is determined at run time.
    C99 and later supports variable length arrays or VLAs.


    # # Section 10.1: Declaring and initializing an array


    The general syntax for declaring a one-dimensional array is


    ```

    type arrName[size];

    ```


    where type could be built-in type or user-defined types such as structures, arrName
    is a user-defined identifier, and size is an integer constant.


    Declaring an array (an of 10 variables in case) is done like this:


    ```

    int array[10];

    ```


    it holds indeterminate values. To ensure it holds zero values while declaring,
    you can do this:


    ```

    int array[10] = (0);

    ```


    Arrays can have initializers, this example declares an array of 10 int''s, where
    the first 3 int''s contain the values 1, 2, 3, all other values will be zero:


    ```

    int array[10] = {1, 2, 3};

    ```


    In the above method of initialization, the first value in the list will be assigned
    to the first member of the array, the second value will be assigned to the second
    member of the array and so on. If the list size is smaller than the array size,
    then in the above example, the remaining members of the array will be initialized
    to zeros. With designated list initialization (ISO C99), explicit initialization
    of the array members is possible. For example:


    ```

    int array[5] = {{2] = 5, [1] = 2, [4] = 9}; /* array is {0, 2, 5, 0, 9} */

    ```


    In most cases compiler can deduce the length of the array for you, this can be
    achieved by leaving the brackets empty:


    ```

    int array[] = {1, 2, 3}; /* an array of 3 int''s */

    int array[] = {3] = 8, [0] = 9}; /* size is 4 */

    ```


    Declaring an array of zero length is not allowed.


    Version ≥ C99 < C11


    Variable Length Arrays (VLA) for for were added in C99, and made optional in C11.
    They are equal to normal arrays, with one difference: the length doesn''t have
    to be known at compile time. V''s have automatic storage duration. Only pointers
    to VLA''s have static storage duration.


    GoalKicker.com – C Notes for Professionals'
