  md: '# # Chapter 50: Create and include header files


    In modern C, header files are crucial tools that must be designed and used correctly.
    They allow the compiler to cross-check independently compiled parts of a program.


    Headers declare types, functions, macros etc that are needed by the consumers
    of a set of facilities. All the code that uses any of those facilities includes
    the header. All the code that defines those facilities includes the header. This
    allows the compiler to check that the uses and definitions match.


    # ## Section 50.1: Introduction


    There are a number of guidelines to follow when creating and using header files
    in a C project:


    +   - Idempotence


    If a header file is included multiple times in a translation unit (TU), it should
    not break builds.


    +   - Self-containment


    If you need the facilities declared in a header file, you should not have to include
    any other headers explicitly.


    +   - Minimality


    You should not be able to remove any information from a header without causing
    builds to fail.


    +   - Include What You Use (IWU)


    Of more concern to C++ than C


    Occasionally, there might be enough reason to break one or more of these guidelines,
    but you should both be aware that you are breaking the rule and be aware of the
    consequences of doing so before you break it.


    # ## Section 50.2: Self-containment


    Modern headers should be self-contained


    **Recommendation: Header files should be self-contained.**


    # ### Historical rules


    Historically, this has been a mildly contentious issue.'
