  md: "# Section 36.4: Character types cannot be accessed through non-character types\n\
    \nIf an object is defined with static, thread, or automatic storage duration,\
    \ and it has a character type, either char, unsigned char, or signed char, it\
    \ may not be accessed by a non-character type. In the example a char array reinterpreted\
    \ as the type int, and the behavior is undefined on every dereference of the int\
    \ pointer b.\n\n```\nint main(void )\n{\n    char a[100];\n    int*b = (int*)&a;\n\
    \    *b = 1;\n\n    static char c[100];\n    b = (int*)&c;\n    *b = 2;\n\n  \
    \  Thread_local char d[100];\n    b = (int*)&d;\n    *b = 3;\n}\n```\n\nThis is\
    \ undefined because it violates the \"effective type\" rule, no data object that\
    \ has an effective type may be accessed through another type that is not a character\
    \ type. Since the other type here is int, this is not allowed.\n\nEven if alignment\
    \ and pointer sizes would be known to fit, this would not exempt them from this\
    \ rule, behavior would still be undefined.\n\nThis means in particular that there\
    \ is no way in standard C to reserve a buffer of object type that can be used\
    \ through pointers with different types, as you would use a buffer that was received\
    \ by malloc or similar function.\n\nA correct way to achieve the same goal as\
    \ the above example would be to use a union.\n\n```\ntypedef union bufType bufType;\n\
    union bufType {\n    char c[sizeof(int[25])];\n    int i[25];\n};\n\nint main(void\
    \ ) {\n    bufType a = {.c = { 0 } }; // reserve a buffer and initialize\n   \
    \ // no cast necessary\n    *b = a.i;\n\n    static bufType a = {.c = { 0 } };\n\
    \    int*b = a.i;\n    *b = 2;\n\n    Thread_local bufType a = {.c = { 0 } };\n\
    \    int*b = a.i;\n    *b = 3;\n}\n```\n\nHere, the union ensures that the compiler\
    \ knows from the start that the buffer could be accessed through different"
