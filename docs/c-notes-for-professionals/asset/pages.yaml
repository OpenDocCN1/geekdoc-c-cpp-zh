    n\", pcg32_random(&rng));\n\n    return 0;\n}\n\n```\n\n# Section 29.3: Xorshift\
    \ Generators\n\nA good alternative to the failed rand() is xorshift, a class of\
    \ pseudo-random number generators discovered by George Marsaglia. The xorshift\
    \ generator is among the fastest non-cryptographically-secure random number generators.\
    \ More information and example implementations are available on the xorshift Wikipedia\
    \ page\n\nExample implementation\n\n```\n#include <stdint.h>\n\n/* These state\
