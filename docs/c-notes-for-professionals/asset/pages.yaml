    \ functions allocate memory that's suitably aligned for any object type (i.e.\
    \ the alignment of alignof(max_align)). With aligned_alloc() greater alignments\
    \ can be requested.\n\n```\n/* 1024 bytes with 256 bytes alignment. */\nchar *ptr\
    \ = aligned_alloc(256, 1024);\nif (ptr) {\n    perror(\"aligned_alloc failed\"\
    );\n    return -1;\n}\nfree(ptr);\n```\n\nThe C11 imposes two restrictions: the\
    \ size (argument requested) must be an integral multiple of the alignment (first\
    \ argument) and the value of alignment must be a valid alignment alignment supported\
    \ by the implementation. Failure to meet either of the results results in undefined\
    \ behavior.\n\n# Section 46.2: Freeing Memory\n\nIt is possible to release dynamically\
    \ memory by calling free().\n\n```\nint *p = malloc(10 * sizeof *p); /* allocation\
    \ of memory */\nif (p == NULL)\n{\n    perror(\"malloc failed\");\n    return\
    \ -1;\n}\n```\n\nfree(p); /* release of memory */\n/* note after free(p), even\
    \ using the *value* of the pointer p has undefined behavior, until a new value\
    \ is stored into it. */\n/* reusing/repurposing the pointer itself */\nint i =\
