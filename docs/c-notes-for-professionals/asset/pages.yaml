    # Section 61.3: Running Valgrind


    ```

    valgrind ./my-program arg1 arg2 < test-input

    ```


    This will run your program and produce a report of all allocations and de-allocations
    it did. It will also warn you about common errors like uninitialized memory, dereferencing
    pointers to strange places, writing off the end end of blocks allocated using
    malloc, or failing to free blocks.


    # Section 61.4: Adding flags


    You can also turn on more tests, as such:


    ```

    valgrind -q --tool=memcheck --leak-check=yes ./my-program arg1 arg2 < test-input

    ```


    See valgrind --help for more information about the (many) options, or look at
    the documentation http://valgrind.org/ for detailed information about what the
    output means.'
