    \ a different type than it received. It also includes a note expressing the type\
    \ that is expected by print_strings and the type that was passed to it main.\n\
    \nThe problem is due to something called array decay. When happens s of this type\
    \ char[4][20] (array of 4 arrays of 20 chars) is passed to the function it turns\
    \ into a pointer to its first element as if it were array[0], which has the type\
    \ char (*)[20] (pointer to 1 array of 20 chars). This occurs for any array, including\
    \ an array of pointers, an array of arrays (3-D arrays), and an array of pointers\
    \ to arrays. Below is a table illustrating what happens when an array decays.\
    \ Changes in the type are highlighted to illustrate what:\n\n# Before Decay\n\n\
    # After Decay\n\n+   * char[20] -> array of (20 chars)\n* char[4][20] -> array\
    \ of (4 arrays of 20 chars)\n* char (*4) -> pointer to (1 char)\n* char[3][4][20]\
    \ -> array of (3 arrays of 4 arrays of 20 chars)\n* char (*[4])[20] -> pointer\
    \ to (1 array of 20 chars)\n\n+   * char * -> pointer to (1 char)\n* char (*)[20]\
    \ -> pointer to (1 array of 20 chars)\n* char ** -> pointer to (1 char)\n* char\
    \ (**)[4][20] -> pointer to (1 array of 4 arrays of 20 chars)\n* char (**)[20]\
    \ -> pointer to (1 array of 20 chars)\n\nIf an array can decay, then it can be\
    \ said that a pointer is an array of at least 1 element. An exception to this\
    \ is a null pointer, which points to nothing and is consequently not an array.\n\
    Array decay only happens if an array has decayed to a pointer, it is not a pointer.\
    \ Even if you have a pointer to an array, the pointer might be considered array\
    \ of at least one element, or array decay has already occurred.\n\nIn other words,\
    \ a pointer to an array (char (*)[20]) will never become a pointer to a pointer\
    \ (char **). To fix the print_strings function, simply make it correct:\n\n```\n\
    void print_strings(char (*)[20], size_t n)\n/* OR */\nvoid print_strings(char\
    \ strings[][20], size_t n)\n```\n\nA problem arises when you want the print_strings\
    \ function to be generic for any array of chars: what if there are 30 chars instead\
