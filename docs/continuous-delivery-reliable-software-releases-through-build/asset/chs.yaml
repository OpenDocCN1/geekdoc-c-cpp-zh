  ## 第 1 章：软件交付的问题\n\n## 引言\n\n作为软件专业人员，我们面临的最重要的问题是这个：如果有人想出了一个好主意，我们如何尽可能快地将其交付给用户？本书展示了如何解决这个问题。\n\
  \n我们关注的是构建、部署、测试和发布过程，而关于这些内容的描述相对较少。这并不是因为我们认为软件开发方法不重要；而是因为，如果不关注软件生命周期中的其他方面——而这些方面往往被误认为是整体问题的次要环节——那么就不可能实现可靠、快速、低风险的软件发布，从而高效地将我们的劳动成果交付到用户手中。\n\
  \n有许多软件开发方法论，但它们主要关注于需求管理及其对开发工作的影响。有很多优秀的书籍详细涵盖了软件设计、开发和测试的各种方法；但这些书籍也只涵盖了为资助我们工作的人和组织提供价值的`价值流`\
  \ 的一部分。\n\n一旦需求被确定、解决方案被设计、开发和测试，接下来会发生什么？这些活动是如何连接和协调的，以使过程尽可能地高效和可靠？我们如何让开发者、测试人员、构建和运维人员有效协同工作？\n\
  \n本书描述了一种从开发到发布的软件有效模式。我们描述了有助于实现这种模式的技术和最佳实践，并展示了这种方法如何与软件交付的其他方面衔接。\n\n图 1.1 部署流水线\n\
  \n![Image](img/fig1_1.jpg)\n\n本书的核心模式是`部署流水线`（deployment pipeline）。本质流水线的本质是应用程序构建、部署、测试和发布过程的自动化实现。根据发布软件的价值流不同，每个组织在部署流水线的实现上会有差异，但指导它们的原则是一致的。图\
  \ 1.1 给出了一个部署流水线的示例。\n\n部署流水线的工作方式概述如下：对应用程序配置、源代码、环境或数据的任何更改都会触发一个新流水线实例的创建。流水线的初始步骤之一是创建二进制文件和安装程序。流水线的其余部分会对二进制文件运行一系列测试，以证明它们可以发布。发布候选版本通过的每项测试都让我们更有信心，即这种特定的二进制代码、配置信息、环境和数据的组合能够正常工作。如果发布候选版本通过了所有测试，就可以发布。\n\
  \n部署流水线的基础在于`持续集成`（continuous integration）过程，它本质上是将持续集成原则推向逻辑终。\n\n部署流水线的目标有三点：首先，它让构建、部署、测试和发布软件过程的每一个环节对所有参与者都可见，有助于协作。其次，它改进了反馈，以便在过程中尽早识别并解决问题。最后，它让团队能够通过全自动过程随时将任何版本的软件部署并发布到任何环境。\n\
  \n### 常见的发布反模式\n\n软件发布当天通常是紧张的。为什么会这样？对于大多数项目来说，与过程相关的风险使得发布变成了一个可怕的时刻。\n\n在许多软件项目中，发布是一个手动密集型过程。托管软件的环境通常由运维或\
  \ IT 团队手工制作。安装应用程序依赖的第三方软件。应用程序自身的软件制品被复制到生产环境中。配置信息通过 Web 服务器、应用程序服务器或其他系统第三方组件的管理控制台进行复制或创建。复制参考数据，最后如果是分布式或服务型应用程序，则逐个启动应用程序。\n\
  \n紧张的原因显而易见：在这个过程中有很多可能出错的地方。如果任何一步执行得完美，应用程序就无法正常运行。此时，可能完全不清楚错误在哪里，或者哪一步出了问题。\n\
  \n本书的其余部分讨论了如何避免这些风险——如何减轻发布日的压力，并确保每次发布都是可靠预测的。\n\n在此之前，让我们明确我们试图避免的过程失败类型。以下是一些常见的导致可靠发布过程的反模式，尽管它们在我们的行业中普遍到已成为常态。\n\
  \n\n\n\n\n# 反模式：手动部署软件\n\n任何规模的现代应用程序其部署过程都非常复杂，涉及许多环节。许多组织仍在使用手动发布软件。这意味着部署此类应用程序所需的步骤被视为是独立的且原子的，每一步都由个人或团队单独执行。在这些步骤中必须做出判断，这导致它们容易出现人为错误。即使情况并非如此，这些步骤的顺序和时机的差异也会导致不同的结果。这些差异很少是良性的。\n\
  \n这种反模式的迹象有：\n\n*   编写大量、详尽的文档，描述要采取的步骤以及这些步骤可能出错的方式\n*   依赖手动测试来确认应用程序运行正常\n* \
  \  在发布当天频繁致电开发团队，解释为什么部署出了问题\n*   在发布过程中频繁对发布流程进行修正\n*   集群中的各个环境在配置上存在差异，例如，具有不同连接池设置的应用程序服务器、不同布局的文件系统等\n\
  *   执行一次耗时超过几分钟的发布\n*   结果结果不可预测的发布，通常需要回滚或遇到不可预见的问题\n*   在发布日第二天凌晨 2 点，眼通血丝坐在显示器前，试图弄清楚如何让它运行起来\n\
  \n## 反之……\n\n随着时间的推移，部署应该倾向于完全自动化。将软件部署到开发、测试或生产环境时，人类只需执行两项任务：选择版本和环境，以及点击“部署”按钮。发布封装好的软件应该包含一个创建一个安装程序的单一自动化过程。\n\
  \n我们在本书中经常讨论了大量自动化，我们也知道有些人并不完全认同这一主意。让我们解释一下，为什么我们认为自动化部署是一个不可或缺的目标。\n\n*   当部署没有完全自动化时，每次执行都会发生错误。唯一的问题是这些错误是否严重。即使有完美的部署测试，Bug\
  \ 也可能难以追踪。\n*   当部署过程不是自动化的，它就不具有可重复性或可靠性，导致时间浪费在调试部署错误上。\n*   手动部署过程必须记录。维护文档是一项复杂且耗时的任务，涉及多个个人之间的协作，因此在任何给定时间，文档通常是不完整或过时的。一组自动化部署脚本可以充当文档，它将始终是最新的且完整的，否则部署将无法运行。\n\
  *   自动化部署鼓励了协作，因为脚本中的一切都是显式的。文档必须对读者的知识水平做出假设，而现实中通常是写给执行部署的人的备忘录，对其他人来说是晦涩的。\n\
  *   上述的推论：手动部署依赖部署专家。如果他或她休假或辞职了，你就麻烦了。\n*   执行手动部署是无聊且重复的，但需要很大程度的专业知识。要求专家去做无聊、重复且具有技术要求的任务，是我们能想到的确保人为错误最确定的方法（除了睡眠剥夺或醉酒）。自动化部署可以让你那些昂贵、高技能、过度劳的员工去从事更高价值的活动。\n\
  *   测试手动部署过程唯一方法就是去执行。这通常耗时且昂贵。自动化部署过程廉价且易于测试。\n*   我们听过手动过程比自动化过程更具审计性。我们对这一说法感到完全困惑。对于手动过程，无法保证已经遵循了文档。只有自动化过程才是完全可审计的。还有比运行良好的部署脚本更具审计性的吗？\n\
  \n每个人必须使用自动化部署过程，并且它应该是软件部署的唯一方式。这种纪律确保了部署脚本在需要时能够工作。我们在书中中描述的原则之一就是使用相同的脚本部署到每个环境。如果你使用相同的脚本部署到每个环境，那么到生产环境的部署路径在发布日需要之前，已经经过了数百甚至上千次的测试。如果发布时发生任何问题，你可以确定它们是环境特定配置的问题，而不是你的脚本问题。\n\
  \n我们确定，偶尔手动密集型的发布确实会运行得很顺畅。我们可能只是运气不好，看到的大多是糟糕的案例。然而，如果这不被识别为软件生产过程中一个可能产生错误的步骤，为什么还要搞得那么隆重？为什么需要所有的流程和文档？为什么要在周末期间叫人团队加入？为什么要让人们在现场待命，以防情况不尽人意？\n\
  \n# 反模式：仅在开发完成后才部署到类生产环境\n\n在模式模式中，软件首次部署到类生产环境（例如，预发布环境/staging）是在大部分开发工作完成之后——至少，是按照开发团队定义的“完成”来定义的。\n\
  \n该模式看起来像这样：\n\n*   如果测试人员到目前为止参与了该过程，他们已经在开发机器上测试过系统。\n*   发布到预发布环境是运维人员首次与新版本交互。在某些组织中，使用专门的运维团队将软件部署到预发布环境和生产环境。在这种情况下，运维人员第一次看到软件是发布到生产环境的那天。\n\
  *   要么类生产环境昂贵到对其访问受到严格控制，要么它没有按时到位，或者根本没有人去创建一个。\n*   开发团队组装正确的安装程序、配置文件、数据库迁移脚本和部署文档，传递给执行实际部署的人——所有这些内容在类生产或预发布环境中的都未经过测试。\n\
  *   开发团队与实际执行部署的人员之间几乎没有协作，如果说完全没有。\n\n当进行到预发布环境的部署时，会组建一个团队来执行。有时这个团队拥有所有必要的技能，但在大型组织中，部署责任往往分布在几个小组之间。DBA、中间件团队、Web\
  \ 团队等其他人都参与了最新版本的应用程序部署。由于各个步骤从未在预发布环境环境中测试过，它们经常会有错误。文档遗漏了重要步骤。文档和脚本对目标环境的版本或配置的假设是错误的，导致部署失败。部署团队不得不猜测开发团队的意图。\n\
  \n通常，导致预发布环境部署产生这么多问题的糟糕协作，是通过即时的电话、邮件和快速修复来弥补的。一个非常有纪律的团队会将所有这些沟通纳入部署计划中——但这种过程很少是有效的。随着压力的增加，开发和部署团队之间定义的协作流程会被破坏，以便在部署团队分配的时间内完成部署。\n\
  \n\n\n\n在部署过程中，发现对生产环境的错误假设被植入了系统设计中这并不罕见。例如，我们参与部署的某个应用程序使用了 `filesystem` 来缓存数据。这在开发者工作站上运行良好，但在集群环境中表现却不佳。解决这类问题可能花费很长时间，在这些问题解决之前，不能说该应用程序已经完成了部署。\n\
  \n一旦应用程序部署到测试环境（staging），发现新的 Bug 是很常的。遗憾的是，通常没有时间修复所有的 Bug，因为截止日期正迅速临近，而且在项目的这个阶段，推迟发布日期是不可接受的。因此，最关键的\
  \ Bug 被匆忙修复，项目经理会保存一份已知缺陷列表以备后用，并在开始下一个版本的工作时降低它们的优先级。\n\n有时情况甚至比这更糟。以下是一些可能加剧与发布相关问题的因素：\n\
  \n- 在开发新应用程序时，首次向测试环境的部署可能是最令人棘手的。\n- 发布周期越长，开发团队在部署发生前做出错误假设的时间越长，修复这些假设的时间也越长。\n\
  - 在大型组织中，交付流程被划分为开发、`DBA`、运维、测试等不同的小组，这些孤岛部门之间的协调成本可能是巨大的，有时会导致发布过程停滞在“工单地狱”中。在这种情况下，开发者、测试人员和运维人员不断地向对方提交工单（或发送电子邮件）以执行任何给定的部署——更糟糕的是，为了解决部署期间出现的问题这样做。\n\
  - 开发环境与生产环境之间的差异越大，开发过程中必须做出的假设就越不切实际。这很难量化，但可以肯定的是，如果你在 `Windows` 机器上开发并部署到 `Solaris`\
  \ 集群，那么你将会面临一些惊喜。\n- 如果你的应用程序是由用户安装的，或者包含由用户安装的组件，你可能对他们的环境没有太大控制权，特别是在公司环境之外。在这种情况下，需要大量的额外测试。\n\
  \n#### 这种做法\n\n解决办法是将测试、部署和发布活动集成到开发过程中。让它们成为开发过程中正常且持续的一部分，这样当你准备好将系统发布到生产环境时，就几乎没有风险，因为你已经在许多不同的、逐步接近生产环境的测试环境中演练过多次。确保参与软件交付过程的每一个人，从构建和发布团队到测试人员再到开发者，从项目开始就开始协作工作。\n\
  \n我们是测试成瘾者，广泛使用持续集成和持续部署作为测试我们的软件和部署过程的手段，是我们所描述的这种方法的基石。\n\n#### 反模式：生产环境的手动配置管理\n\
  \n许多组织通过运维团队来管理其生产环境的配置。如果需要更改，例如更改数据库连接设置或增加应用程序服务器线程池中的线程数，则在生产服务器上手动执行。如果对此类更改进行了记录，它可能只是变更管理数据库中的一个条目。\n\
  \n这种反模式的迹象有：\n\n- 在测试环境多次部署成功，但在部署到生产环境时失败了。\n- 集群中的不同成员表现不同——例如，一个节点承受的负载较少，或者处理请求的时间比另一个节点长。\n\
  - 运维团队花费长时间为发布准备环境。\n- 你无法回退到系统的之前的配置，这可能包括操作系统、应用程序服务器、Web 服务器、`RDBMS` 或基础设施设置。\n\
  - 集群中的服务器无意中具有不同版本的操作系统、第三方基础设施、库或补丁级别。\n- 系统的配置通过直接修改生产系统上的配置来完成。\n\n#### 这种做法\n\
  \n你的每个测试环境、阶段环境和生产环境的所有方面，特别是你系统中任何第三方元素的配置，都应该从版本控制通过自动化过程进行应用。\n\n我们在书中描述的关键实践之一是配置管理，其部分含义意味着能够重复地重建应用程序所使用的每一部分基础设施。这意味着操作系统、补丁级别、OS\
  \ 配置、你的应用程序堆栈、其配置、基础设施配置等都应该被管理。你应该能够精确地重建你的生产环境，最好是以自动化的方式。虚拟化可以帮助你开始这一工作。\n\n\
  你应该确切知道生产环境中有什么。这意味着对生产环境所的每处更改都应该被记录并可审计。通常，部署失败是因为某人在上一次部署时修补了生产环境，但更改没有被记录。事实上，不应该允许对测试、阶段和生产环境进行手动更改。更改这些环境的唯一途径应该是自动化过程。\n\
  \n应用程序通常依赖于其他应用程序。应该能够一眼看出每个软件的当前发布版本是什么。\n\n虽然发布可能很令人兴奋，但也可能让人精疲力竭和沮丧。几乎每次发布都涉及最后时刻的更改，例如修复数据库登录详情或更新外部服务的\
  \ URL。应该有一种引入此类更改的方法，使它们既被记录又被测试。再次，自动化是至关重要的。更改应该在版本控制中进行，然后通过自动化过程传播到生产环境。\n\n\
  如果部署出错，应该能够使用相同的自动化过程回滚到生产环境的之前的版本。\n\n#### 我们能做得更好吗？\n\n那是肯定的，这本书的目标是描述如何做到。我们描述的原则、实践和技术旨在让发布变得枯燥，即使在复杂的“企业级”环境中也是。软件发布可以——并且应该是一个低风险、频繁、廉价、快速且可预测的过程。这些实践是在过去几年中开发的，我们已经看到它们在许多项目中产生了巨大的变化。书中的所有实践都已经在具有分布式团队的大型企业项目以及小型开发小组中经过测试。我们知道它们是有效的，我们也知道它们可以扩展到大型项目。\n\
  \n* * *\n\n### 自动化部署的力量\n\n我们的一位客户以前有一个大型团队负责每次发布。团队连续工作七天，包括整个周末，以便将应用程序部署到生产环境。他们的成功率很，，很多都会引入错误，或者在发布当天需要大量的干预，随后的日子里通常还需要补丁和修复来纠发布引入的错误或由于配置新软件时的人为错误导致的错误。\n\
  \n\n\n我们帮助他们实现了一套复杂的自动化构建、部署、测试和发布系统，并引入了支持该系统所需的开发实践和技术。我们看到的最后一次发布仅花费了七秒就将应用程序部署到了生产环境。没有人察觉发生了任何变化，当然，发布实现的新功能突然变得可用了。如果这个大型网站背后的系统部署由于任何原因而失败，我们可以在相同的时间内撤销更改。\n\
  \n***我们的目标是描述部署流水线的使用，结合测试和部署的高水平自动化以及全面的配置管理，以实现一键式软件发布。也就是说，向任何部署目标（开发、测试或生产环境）实现一键式软件发布。**\n\
  \n在此过程中，我们将描述这种模式本身，以及你为了使其运行而需要采用的技术。我们将针对解决你将面对的一些问题，提供不同方法的建议。我们发现，采用这种方法的优势远大于实现它所需的成本。\n\
  \n这些内容对于任何项目团队来说都不是不可及的。它不需要僵化的流程、大量的文档或大量的人手。在本章结束时，我们希望你能够理解这种方法背后的原理。\n\n## 我们如何实现我们的目标？\n\
  \n正如我们所说，作为软件专业人员，我们的目标是尽快为用户交付有用且可行的软件。\n\n速度是至关重要的，因为不交付软件会产生机会成本。只有在软件发布后，你才能开始获得投资回报。因此，书中两个首要目标之一是寻找减少`cycle\
  \ time`（周期时间），即从决定进行更改（无论是修复错误还是新功能）到将其交付给用户所需的时间。\n\n快速交付同样重要，因为它允许你验证你的功能和错误修复是否真的有用。创建应用程序背后的决策者（我们称之为客户）对哪些功能和错误修复对用户有用做出假设。然而，在这些功能交到通过选择使用软件来“投票”的用户手中之前，它们仍然只是假设。因此，最小化周期时间以建立有效的反馈循环是至关重要的。\n\
  \n有用性的一个重要组成部分是质量。我们的软件应该符合其用途。质量并不等同于完美——正如伏尔泰所说，“完美是好的敌人”——但我们的目标始终应该是交付具有足够质量的软件，为用户带来价值。因此，虽然尽快交付软件非常重要，但保持适当的质量水平也至关重要。\n\
  \n因此，为了稍微完善我们的目标，我们希望找到以高效、快速且可靠的方式交付高质量、有价值软件的方法。\n\n我们以及我们的同行从业者发现，为了实现这些目标（低周期时间和高质量），我们需要对软件进行频繁的自动化的发布。为什么呢？\n\
  \n- **自动化。** 如果构建、部署、测试和发布过程不是自动化的，它就是不可重复的。每次执行时，它都会有所不同，因为软件、系统配置、环境以及发布过程发生了变化。由于步骤是手动的，它们很容易出错，而且没有办法准确地审查执行了什么。这意味着无法控制发布过程，从而无法确保高质量。软件发布往往太像一门艺术；它应该是一门工程学科。\n\
  - **频繁。** 如果发布是频繁的，那么发布之间的差异就会很小。这显著降低了与发布相关的风险，并使回滚变得容易得多。频繁发布还会导致更快的反馈——事实上，它们是要求的。本书的大部分内容集中在尽可能地获取关于应用程序及其相关配置（包括环境、部署过程和数据）更改的反馈。\n\
  \n反馈对于频繁、自动化的发布至关重要。反馈要有用需要三个标准：\n\n- 任何种类的任何更改都需要触发反馈过程。\n- 反馈必须尽快交付。\n- 交付团队必须接收反馈并采取行动。\n\
  \n让我们详细检查这三个标准，并考虑我们如何实现它们。\n\n### 每一个更改都应该触发反馈过程\n\n一个运行中的软件应用程序可以被有效地分解为四个部分：可执行代码、配置、主机环境和数据。如果其中任何一个发生变化，都可能导致应用程序行为的变化。因此，我们需要控制这四个组件，并确保其中任何一个组件的更改都经过验证。\n\
  \n当源代码发生更改时，可执行代码就会更改。每当源代码发生更改时，生成的二进制文件都必须构建并测试。为了控制这一过程，二进制文件的构建和测试应该是自动化的。每次提交时构建和测试应用程序的实践被称为持续集成；我们将在第\
  \ 3 章中详细描述。\n\n这种可执行代码应该是部署到每个环境（无论是测试环境还是生产环境）的相同代码。如果你的系统使用编译型语言，你应该确保构建过程生成的二进制输出——可执行代码——在所有需要的地方被重用，而从不重建。\n\
  \n环境之间的任何变化都应该作为配置信息被捕获。在任何环境中对应用程序配置的更改都应该经过测试。如果软件由用户安装，则应该在代表性的示例系统范围内测试可能的配置选项。配置管理在第\
  \ 2 章中讨论。\n\n如果应用程序要部署的环境发生变化，整个系统应该随着环境的变化进行测试。这包括操作系统配置、支持应用程序的软件栈、网络配置以及任何基础设施和外部系统的变化。第\
  \ 11 章涉及基础设施管理，包括测试和生产环境创建与维护的自动化。\n\n最后，如果数据结构发生变化，这种更改也必须经过测试。我们在第 12 章中讨论数据管理。\n\
  \n什么是反馈过程？它涉及尽可能以完全自动化的方式对每个更改进行测试。测试将取决于系统，但它们通常包括以下检查：\n\n- 创建可执行代码的过程必须运行。这验证了源代码语法是有效的。\n\
  - 软件的单元测试必须通过。这检查你的应用程序代码是否符合预期。\n- 软件应该满足某些质量标准，例如测试覆盖和其他特定技术的指标。\n- 软件的功能验收测试必须通过。这检查你的应用程序是否符合其业务验收标准——即它是否交付了预期的业务价值。\n\
  - 软件的非功能测试必须通过。这检查应用程序在容量、可用性、安全性等方面的性能是否足够，以满足用户的需求。\n\n\n\n\n- 软件必须通过探索性测试，并向客户及部分用户进行演示。这通常在手动测试环境中完成。在流程的这一阶段，产品负责人（Product\
  \ Owner）可能会认为缺少某些功能，或者我们可能会发现需要修复的漏洞，以及需要创建自动化测试来防止回归。\n\n运行这些测试的环境必须与生产环境尽可能相似，以验证对环境的任何更改是否会影响应用程序的功能性。\n\
  \n### 必须尽快接收反馈\n\n快速反馈的关键在于自动化。通过全自动化的流程，你唯一的限制是所能够投入到问题解决中的硬件数量。如果你有手动流程，你就依赖于人员来完成工作。人们花费时间更长，容易引入错误，而且不可审计。此外，执行手动的构建、测试和部署过程是枯燥且重复的——这远不是人员的最优利用。人是昂贵且宝贵的，他们应该专注于编写让用户惊喜的软件，并尽可能快地交付这些惊喜——而不是处理像回归测试、虚拟服务器配置和部署等枯燥且易出错的任务，这些任务最适合由机器完成。\n\
  \n然而，实现部署流水线是资源密集型的，尤其是当你拥有一套全面的自动化测试套件时。其主要目标之一是优化人力资源的使用：我们希望释放人员让他们去做有趣的工作，将重复性工作留给机器。\n\
  \n我们可以将流水线提交阶段（commit stage）的测试（图 1.1）描述如下：\n\n- 它们运行快速。\n- 它们尽可能全面——也就是说，它们涵盖了约\
  \ 75% 以上的代码，这样当它们通过时，我们就有足够的信心认为应用程序运行正常。\n- 如果其中任何一个测试失败，意味着我们的应用程序存在严重缺陷，在任何情况下都不应发布。这意味着，检查\
  \ UI 元素颜色的测试不应包含在这一组测试中。\n- 它们尽可能做到环境无关——也就是说，环境不需要是生产环境的精确复制，这意味着它可以更简单、更廉价。\n\n\
  另一方面，后期阶段的测试具有以下通用特征：\n\n- 它们运行速度较慢，因此是并行化的候选对象。\n- 其中某些测试可能会失败，而在某些情况下我们可能仍选择发布应用程序（也许发布候选版本中的某个关键修复导致性能下降到预定义的阈值以下——但我们可能仍然决定发布）。\n\
  - 它们应该运行在与生产环境尽可能相似的环境中，因此除了测试的直接关注点，它们还测试了部署过程以及生产环境的任何更改。\n\n这种测试流程的组织方式意味着，在第一组测试（在最便宜的硬件上运行最快）之后，我们对软件非常有信心。如果这些测试失败，发布候选版本就不会进入后续阶段。这确保了资源的最优利用。关于流水线的更多内容请参见第\
  \ 5 章“部署流水线的剖析”，以及后续第 7 章、第 8 章](#ch08.html_ch08)和第 9 章](#ch09.html_ch09)，这些章节分别描述了提交测试阶段、自动化验收测试以及非功能性需求测试。\n\
  \n我们方法的基础原则之一是需要快速反馈。确保更改的快速反馈要求我们关注软件开发过程——特别是我们如何使用版本控制以及我们如何组织代码。开发者应该频繁向版本控制系统提交更改，并将代码拆分为独立的组件，以此作为管理大型或分布式团队的方法。在大多数情况下应避免使用分支。我们在第\
  \ 13 章“管理组件与依赖”以及第 14 章“高级版本控制”中讨论了增量交付、组件的使用以及分支与合并。\n\n### 交付团队必须接收反馈并采取行动\n\n\
  参与软件交付过程的每个人必须参与反馈过程。这包括开发者、测试人员、运维人员、数据库管理员、基础设施专家和经理。如果这些角色的人员每天不共同工作（尽管我们建议团队应该是跨职能的），那么他们必须频繁见面并努力改进软件交付流程。基于持续改进的流程对于快速交付高质量软件至关重要。迭代过程有助于为这种活动建立定期的“心跳”——每轮迭代至少举行一次回顾会议，大家共同讨论如何改进下一次迭代的交付流程。\n\
  \n能够对反馈做出反应也意味着信息的广播。使用大型、可见的仪表板（不需要是电子化的）和其他通知机制，是确保反馈确实被传回并最终进入某人的大脑的核心。仪表板应该是无处不在的，而且每个团队会议室至少应该有一个。\n\
  \n最后，反馈如果不付诸行动，将毫无用处。这需要纪律和计划。当某些事情需要处理时，整个团队都有责任停止手头工作并决定行动方案。只有在完成这一点后，团队才能继续工作。\n\
  \n### 这个流程可扩展吗？\n\n我们听到的一个常见反对意见是我们描述的流程是理想化的。这些反对者说，这在小团队中可能有效，但在我庞大的分布式项目中绝不可能！\n\
  \n多年来，我们在几个不同的行业中参与过许多大型项目。我们也很幸运，能够与具有丰富经验的同事并肩工作。我们在书中描述的所有技术和原则，已经在各种组织（无论大小）的各种真实项目中得到了验证。在这些项目中反复遇到相同的问题，正是促使我们写这本书的动力。\n\
  \n### 这样做有什么好处？\n\n我们在前节中描述的方法的主要益处是，它创建了一个可重复、可靠且可预测的发布流程，这反过来大大缩短了周期，从而将功能和错误修复快速交付给用户。仅成本节省就超过了这本书的封面价格，更涵盖了建立和维护这样一个发布系统所需的时间投入。\n\
  \n\n\n\n\n除此之外，还有许多其他益处，其中一些是我们事先就能预料到的，而另一些在我们观察到它们时更像是意外惊喜。\n\n## 赋能团队\n\n部署流水线的核心原则之一是它是一个拉取系统（pull\
  \ system——它允许测试人员、运维或支持人员将他们所需的应用程序版本部署到他们选择的环境中。根据我们的经验，导致周期时间增加的一个主要因素是参与交付流程的人员等待应用程序的“良好构建”。通常，获取一个良好的构建需要发送无休止的邮件、创建工单或其他低效的通信形式。当参与交付的团队是分布式的，这就会变成效率低下的主要来源。通过实施部署流水线，这个问题被完全消除了——每个人都应该能够看到哪些构建可以部署到他们关心的环境中，并且能够通过点击按钮来完成部署。\n\
  \n我们经常看到的后果是，由于不同团队成员各自的工作，在不同的环境中运行着几个不同的版本。轻松地将任何版本的软件部署到任何环境的能力具有许多优势。\n\n* \
  \  测试人员可以选择应用程序的旧版本，以验证新版本中行为的变化。\n*   支持人员可以将发布的应用程序版本部署到环境中以重现缺陷。\n*   运维人员可以选择已知的良好构建部署到生产环境，作为灾备演练的一部分。\n\
  *   可以通过点击按钮完成发布。\n\n我们的部署工具为他们提供的灵活性改变了他们的工作方式——变得更好了。总的来说，团队成员对自己的工作有了更多控制，因此他们的工作质量得到了提高，从而提高了应用程序的质量。他们协作得更有效，被动反应减少，并且工作得更高效，因为他们不再花费大量时间等待良好的构建推送到他们手中。\n\
  \n## 减少错误\n\n错误会从各种地方渗透到软件中。最初委托软件的人可能会要求错误的内容。收集需求的分析师可能会误解，开发者可能会编写带有漏洞的代码。然而，我们在这里讨论的错误特是指由于糟糕的`configuration\
  \ management`引入生产环境的错误。我们将在第 2 章中详细描述我们所说的配置管理。现在，请想想为了让典型应用程序运行而必须准确无误的事项——正确的代码版本是\
  \ 물론，还有正确的数据库模式版本、负载均衡器的正确配置、你用于查询价格的 Web 服务的正确 URL 等。当我们谈论配置管理时，我们指的是允许你识别并控制那整套信息（每一个比特和字节）的流程和机制。\n\
  \n* * *\n\n### 一个字节的差异\n\n几年前，Dave 正在为一家著名的零售商开发一个大型点点系统。当时我们正处于思考自动化部署过程的早期阶段，所以虽然某些方面已经实现了相当好的自动化，但另一些则没有。生产环境中出现了一个非常棘手的\
  \ Bug。在某些未知的、难以判定的环境组合下，我们的日志中突然爆发了大量的错误跟踪（error traces）。我们在任何测试环境中都无法重现该问题。我们尝试了各种方法：在性能环境中进行负载测试，尝试模拟看起来像我们生产环境的病态案例——但我们无法重现该问题。最后，在进行了比描述中多得调查之后，我们决定审计我们所能想到的、这两个系统之间可能存在的任何差异。我们最终发现，应用程序依赖的一个单一二进制库（属于我们正在使用的应用程序服务器软件）在生产环境和测试环境之间是不一样的。我们更改了生产环境中的二进制文件版本，问题就消失了。\n\
  \n这个故事的重点不是我们不够努力，或者不是足够谨慎，甚至不是因为我们想到了审计系统而很聪明。真正的点在于软件可能是极其脆弱的。这是一个相当大的系统，拥有数万个类、数千个库以及与外部系统的许多集成点。然而，由于第三方二进制文件版本之间几个字节的差异，一个严重的错误就被引入了生产环境。\n\
  \n* * *\n\n在构成现代软件系统的数个 GB 的信息中，如果没有机器的辅助，没有任何人类（或人类团队）能够发现如之前侧栏中描述的那种规模的变化。与其等到问题发生，为什么不利用机器辅助从源头上防止它的发生呢？\n\
  \n通过积极管理版本控制中所有可以更改的内容——例如配置文件、创建数据库及其模式的脚本、构建脚本、测试支架、甚至开发环境和操作系统配置——我们允许计算机去做它们擅长的事：确保每一个最后的比特和字节都处于我们预期的位置，至少在我们的代码开始运行之前是如此。\n\
  \n* * *\n\n### 手动配置管理的成本\n\n我们做的的另一个项目有大量的专用测试环境。每个环境都运行着流行的 EJB 应用程序服务器。该应用程序是作为一个敏捷项目开发的，具有良好的自动化测试覆盖率。本地构建管理良好，因此开发者很容易在本地快速运行代码以便他们进行开发。然而，这是在我们开始更加关注应用程序部署自动化之前。每个测试环境都是手动配置的，使用应用程序服务器供应商提供的控制台工具。尽管开发者用于配置其本地安装的配置文件副本被保存在版本控制中，但每个测试环境的配置并没有。每个环境都与其同类环境不同。它们的属性顺序不同，有些缺失了，有些被设置了不同的值，有些有不同的名称，有些具有在其他任何环境中都没有出现过的属性。没有两个测试环境是相同的，它们也都与生产环境不同。要确定哪些属性是必要的、哪些是冗余的、哪些应该在环境间通用的、哪些应该是唯一的是非常困难的。结果，该项目雇用了一个五人的团队负责管理这些不同环境的配置。\n\
  \n* * *\n\n根据我们的经验，这种对手动配置管理的依赖是很常见的。在我们工作过的许多组织中，这在他们的生产系统和测试环境中都是如此。有时，服务器 A 的连接池限制在\
  \ 100，而服务器 B 设置为 120 可能并不重要。但在其他时候，这非常重要。\n\n\n\n\n哪些配置差异重要，哪些不重要，这可不是你希望在最忙的交易期间意外发现的事情。这类配置信息定义了代码运行的环境，并且实际上，它们经常为代码开辟了新的运行路径。对这类配置信息的更改需要经过仔细考虑，而且代码运行的环境需要像代码行为本身一样被明确定义和控制。如果我们能够访问你的数据库、应用程序服务器或\
  \ Web 服务器的配置，我们保证，让你的应用程序失败的速度比你为我们提供编译器和源代码要快得多。\n\n当这些配置参数被手动定义和管理时，它们会受到人类在重复性任务中容易出错的倾向的影响。仅仅在错误的地方出现一个简单的拼写错误就可能让应用程序停滞。更糟糕的是，编程语言具有语法检查，或许还有单元测试来验证没有拼写错误。而配置信息很少会有任何类型的检查，特别是当这些配置信息是直接输入某些控制台时。\n\
  \n将你的配置信息添加到版本控制系统中这一简单动作，就是向前迈出的巨大一步。在最简单的情况下，版本控制系统会提醒你已经在无意中更改了配置。这至少消除了一个非常常见的错误来源。\n\
  \n一旦你所有的配置信息都存储在版本控制系统中，下一个显而易见的步骤就是消除中间人，让计算机来应用配置，而不是重新输入。某些技术比其他技术更适用于此，但你（通常还有基础设施供应商）会惊讶地发现，如果你仔细考虑即使是最棘手的第三方系统的配置，你可以将其推到何种程度。我们将在稍后的第\
  \ 4 章中讨论这些细节，并在第 11 章中详细介绍。\n\n## 减轻压力\n在显而易见的处之外，最令人愉快的是减轻与发布相关的所有方的压力。任何接近软件项目发布日期的人都会意识到，这些确实是充满压力的事件。根据我们的经验，这本身就可能是问题的根源。我们见过明智、保守且注重质量的项目经理要求开发人员：“你们不能直接修改代码吗？”，或者其他清醒的数据库管理员为他们不熟悉的应用程序在数据库表中录入数据。在这两种情况下，以及许多类似的情况下，这种更改都是为了直接应对“先让东西运行起来”的压力。\n\
  \n别误会，我们也经历过那种时刻。我们并不是在暗示这总是错误的反应：如果你刚刚发布了一些代码到生产环境，导致你的公司亏损，那么几乎任何可以阻止止损的做法都是合理的。\n\
  \n我们在这里的观点不同。这两个让新部署的生产系统运行起来的“快速补救”示例并非由这种紧迫的商业需求驱动，而是由于在按计划日期发布的更微妙的压力。这里的问题在于，发布到生产环境是重大事件。只要事实如此，它们就会被大量的仪式感和紧张情绪包围。\n\
  \n想象一下，你即将到来的发布只需点击按钮即可完成。想象它可以在几分钟甚至几秒钟内完成，而且如果发生了最坏的情况，你可以在同样的几分钟或几秒钟内回滚发布。想象你频繁发布，因此当前生产环境中的内容与新版本之间的差异很小。如果事实确实如此，那么发布风险将大大降低，那种你正把职业生涯押注在发布成功上的不愉快感也会显著减少。\n\
  \n对于少数几个项目来说，这种理想可能在实践上无法实现。然而，在大多数项目中，这无疑是可以实现的，尽管需要付出努力。减轻压力的关键在于拥有我们描述的那种自动化部署流程，频繁执行它，并且在最坏情况发生时，拥有一套关于回滚更改的良好方案。当你第一次进行自动化时，它是痛苦的——但它会变得越来越容易，对项目和你个人的好处几乎是无法估量的。\n\
  \n## 部署灵活性\n在新环境中启动你的应用程序应该是项简单任务——理想情况下，只需启动机器或虚拟机镜像并创建一些描述环境独特属性的配置信息即可。然后，你应该能够使用你的自动化部署流程为新环境的部署做好准备，并将选定的应用程序版本部署其中。\n\
  \n## 在笔记本电脑上运行企业级软件\n我们最近在处理一个项目，该项目的业务案例由于政府法规的意外变化而失效了。该项目旨在为一家新业务创建核心企业系统。该业务将跨越国界，软件被设计在大型异构的高价计算机集合上运行。自然地，当得知项目存在的理由刚刚化之泡影时，每个人都感到有些灰意意。\n\
  \n不过，我们也有一个小小的聚光点。我们为开发软件的组织进行了一次缩减分析。“新系统的最小硬件占用是多少？我们该如何限制资本成本？”他们问道。“嗯，它运行在这台笔记本电脑上，”我们回答道。他们很惊讶，因为这是一个复杂的多用户系统。“你怎么知道它是可以的？”他们在深思熟虑后问道。“嗯，我们可以这样运行所有验收测试……”我们向他们展示了。“它需要承受多大的负载？”我们问他们。他们告诉我们负载，我们对性能测试的缩放参数进行了单行更改并运行了测试。我们证明了笔记本电脑太慢了，但并没有慢多少。一台配置得当服务器就能满足他们的需求，而且当它准备就绪时，只需几分钟即可让应用程序在上面启动并运行。\n\
  \n这种部署灵活性不仅取决于我们在书中描述的类自动化部署技术；应用程序本身也设计得很好。然而，我们根据需要将软件放置在任何需要的地方的能力，使我们以及我们的客户对管理任何时间点的发布具有极大的信心。当发布不再令人焦虑时，更容易考虑像敏捷的理想，即在每次迭代结束时发布。即使这对于特定项目并不适用，但也意味着我们找回了周末。\n\
  \n\n\n\n\n有一种特殊情况允许某些变动：开发环境。开发者可能需要构建二进制文件，而不是使用其他地方预先构建好的二进制文件，这是合理的，因此对于这些部署可以放宽限制。尽管，即使在开发者工作站上，我们也尽可能尝试以相同的方式进行部署和管理。\n\
  \n## 发布候选版本 (The Release Candidate)\n\n什么是`release candidate`？你对代码的更改可能可以发布，也可能不可发布。如果你查看一个更改并问：“我们应该发布这个更改吗？”，那么答案只能是猜想。正是我们应用于该更改的构建、部署和测试过程，验证了该更改是否可以发布。这个过程让我们不断增加信心，认为该更改的发布是安全的。我们获取那个微小的更改——无论是新功能、错误修复，还是为了实现某些性能变化而对系统进行的调整——并验证我们是否能以高信心发布带有该更改的系统。为了进一步降低风险，我们希望在最短的时间内完成这种验证。\n\
  \n虽然任何更改都可能导致可以发布给用户的产物，但它们最初并非如此。每项更改都必须对其适用性进行评估。如果发现生成的产品没有缺陷，并且符合客户设定的验收标准，那么它就可以发布。\n\
  \n图 1.2 发布候选版本的传统观点\n\n![Image](img/fig1_2.jpg)\n\n大多数发布软件的方法是在过程结束时确定发布候选版本。当跟踪涉及相关工作时，这种做法是有意义的。在编写，描述开发阶段的维基百科条目将“发布候选”显示为过程中的一个独立步骤（图\
  \ 1.2）。我们看到的观点略有不同。\n\n传统的软件开发方法推迟了发布候选版本的确定，直到完成了几个漫长且昂贵的步骤，以确保软件具有足够的质量且功能完整。然而，在一个积极追求构建和部署自动化以及全面的自动化测试的环境中，没有必要在项目末尾花费精力和金进行长时间且人工密集型的测试。在这个阶段，应用程序的质量通常高得多，因此手动测试只是对功能完整性的确认。\n\
  \n事实上，根据我们的经验，将测试推到开发过程之后是`decrease`应用程序质量的可靠方法。缺陷最好的发现和修复点是在它们引入的地方。当它们在之后才被发现时，修复成本总是更高的。开发者已经忘记了他们在引入缺陷时在做什么，而且功能可能在此期间已经发生了变化。将测试留到最后通常意味着没有时间实际修复这些错误，或者只能修复一小部分错误。因此，我们希望在尽可能早的机会发现并修复它们，最好在它们被提交到代码库*`before`。\n\
  \n### 每次提交都导向潜在的发布\n\n开发者对代码库所做的每种更改都旨在以某种方式增加价值。提交到版本控制的每项更改都应该增强我们正在工作的系统。我们如何知道这是真的呢？我们唯一能判断的方法就是运行软件，看它是否实现了我们预期的价值。大多数项目将该过程的这部分推迟到正在开发中的功能生命周期的后期。这意味着，在任何人的认知范围内，系统都是坏的，直到它在被测试或使用时才发现是运行正常的。如果在这个阶段发现系统是坏的，通常需要花费大量工作才能让系统按预期运行。这一阶段通常被称为“集成”，并且通常是开发过程中最不可预测且最难以管理的部分。由于它是如此痛苦，团队推迟了它，降低集成频率，这只会让情况变得更糟。\n\
  \n在软件中，当某件事很痛苦时，减轻痛苦的方法是更频繁地去做，而不是少做。因此，我们不应该偶尔地集成，而应该频繁地集成；事实上，我们应该对系统的每一次更改都进行集成。这种持续集成的实践将频繁集成的想法推向了逻辑极端。通过这样做，它在软件开发过程中创造了范式转移。持续集成会在更改引入系统时，立即检测到任何破坏系统或不符合客户验收标准的更改。团队随后在问题发生立即修复它（这是持续集成的第一条规则）。如果遵循了这种实践，软件就`always`处于工作状态。如果你的测试足够全面，并且你正在一个足够类似于生产的环境中运行测试，那么软件实际上始终处于`releasable`状态。\n\
  \n每项更改实际上都是一个发布候选版本。每当一个更改被提交到版本控制时，预期是它将通过所有测试，产生工作代码，并可以发布到生产环境。这是初始假设。持续集成系统的工作就是反驳这一假设，证明特定的发布候选版本不适合进入生产。\n\
  \n## 软件交付原则 (Principles of Software Delivery)\n\n本书背后的思想得益于作者在多年中参与的许多项目。当我们开始汇总想法并将其记录在这些页面上时，我们注意到相同的原则反复出现。我们在此处对它们进行了列举。我们所说的一些内容取决于解释或带有限制条件；但下面的原则则不是。如果我们希望我们的交付过程有效，这些是我们无法想象没有它们的情况下要做的事。\n\
  \n### 创建可重复、可靠的软件发布流程\n\n这一原则实际上表述了我们写这本书的目标：发布软件应该是简单的。它应该是简单的，因为你在此之前对发布过程的每一个部分测试了数百次。它应该像按一下按钮一样简单。重复性和可靠性源于两个原则：自动化一切，并将构建、部署、测试和发布应用程序所需的所有内容保留在版本控制中。\n\
  \n部署软件最终涉及三件事：\n\n• 配置并管理应用程序运行的环境（硬件配置、软件、基础设施和外部服务）。\n\n• 在环境中安装正确的应用程序。\n\n•\
  \ 配置应用程序，包括它所需的任何数据或状态。\n\n应用程序的部署可以通过完全自动的过程实现。应用程序配置也可以是一个完全自动的过程，将必要的脚本和状态保留在控制控制或数据库中。显然，硬件无法保留在版本控制中；但是，随着廉价虚拟化技术和\
  \ `Puppet` 等工具的出现，配置过程也可以实现完全自动化。\n\n本书的其余部分基本上描述了实现这一原则的策略。\n\n#### 自动化一切\n\n\n\
  \n\n\n有些事情是无法自动化的。探索性测试依赖于经验丰富的测试人员。向用户社区的代表演示运行中的软件是计算机无法完成的。根据定义，出于合规目的而进行的审批需要人工干预。然而，无法自动化的列表比许多人想象的要短得多。通常情况下，你的构建过程应该自动化到需要特定人工指导或决策的程度为止。这对于你的部署过程也是如此，事实上，适用于你的整个软件发布过程。验收测试是可以自动化的。数据库的升级和降级也可以是化的。甚至是网络和防火墙配置也可以实现自动化。你应该尽可能地进行自动化。\n\
  \n你的作者们可以诚实地说，只要投入足够的努力和智力，他们没有发现任何无法通过自动化的构建或部署过程。\n\n大多数开发团队没有对发布流程进行自动化，因为这看起来像是一项艰巨的任务。手动操作似乎要简单得多。也许在他们第一次执行流程中的某个步骤时确实如此，但当他们第十次执行该步骤时，这显然不再成立，而且在他们执行三或四次之后，可能也不成立了。\n\
  \n自动化是部署流水线的前提条件，因为只有通过自动化，我们才能保证人们只需轻轻点击按钮就能得到他们需要的。然而，你不需要一次性自动化所有内容。你应该从你的构建、部署、测试和发布过程中目前成为瓶颈的部分开始。你可以并且应该随着时间的推逐渐实现自动化。\n\
  \n### 将所有内容保留在版本控制中\n构建、部署、测试和发布应用程序所需的所有内容都应该以某种形式的版本化存储中。这包括需求文档、测试脚本、自动化测试用例、网络配置脚本、部署脚本、数据库创建、升级、降级和初始化脚本、应用程序栈配置脚本、库、工具链、技术文档等。所有这些内容都应该受版本控制，并且对于任何给定的构建，相关的版本应该是可识别的。也就是说，这些`change\
  \ sets`应该有一个唯一的标识符，例如构建次数或版本控制更改集号，用于引用每一个部分。\n\n新团队成员应该能够坐在新的工作站前，检出项目的修订控制仓库，并运行单个命令即可构建并部署应用程序到任何可访问的环境（包括本地开发工作站）。\n\
  \n还应该能够看到你的各种应用程序的哪个版本部署在每个环境中，以及这些构建源自版本控制中的哪些版本。\n\n### 如果痛苦，就更频繁地执行，并将痛苦提前\n\
  这是我们列表中最通用的原则，或许可以被描述为一种启发式方法。但在软件交付背景下，这可能是我们所知最有用的启发式方法，它指导着我们说的一切。集成通常是一个非常痛苦的过程。如果在你的项目中确实如此，那么每当有人提交代码时就进行集成，并且从项目开始就这样做。如果测试是一个发生在发布正前的痛苦过程，就不要在最后才做。相反，要从项目开始就持续地进行。\n\
  \n如果发布软件是痛苦的，那么目标是每当有人提交通过所有自动化测试的更改时就发布它。如果你无法在每次更改后将其发布给真实用户，请在每次提交时将其发布到类生产环境。如果创建应用程序文档是痛苦的，请在开发新功能时同时完成它，而不是留到最后。将功能的文档编写作为“完成定义”（definition\
  \ of done）的一部分，并尽可能地自动化该过程。\n\n取决于你目前的专业水平，达到这个目标可能需要付出巨大的努力，而且你在此期间仍然必须交付软件。设定中间目标，例如每几周发布一次内部版本，或者如果你已经在这样做，那就是每周发布一次。逐步向理想状态努力——即使是小小的进步也会带来巨大的益处。\n\
  \n极端编程本质上是将这种启发式方法应用于软件开发过程的结果。书中的许多建议都来自我们将相同原则应用于软件发布过程的经验。\n\n### 内置质量\n这一原则以及我们在本节中提到的最后一个原则——持续改进——是廉耻地借用自精益运动（lean\
  \ movement）。“内置质量”是 W. Edwards Deming 的格言，除了他的其他成就外，他还是精益运动的先驱之一。越早发现缺陷，修复成本就越低。如果缺陷从根本没有提交到版本控制，那么修复是最廉价的。\n\
  \n我们在书中描述的技术，如持续集成、全面的自动化测试和自动化部署，旨在尽可能在交付过程尽早发现缺陷（这是对“将痛苦提前”原则的应用）。下一步是修复它们。如果每个人都忽视火报警器，它就毫无用处。交付团队必须自律，在发现缺陷后立即进行修复。\n\
  \n“内置质量”还有两个推论。首先，测试不是一个阶段，更不是一个在开发阶段之后开始的阶段。如果将测试留到最后，就太晚了。没有时间修复缺陷。其次，测试也不是测试人员的纯粹领域，甚至不是主要领域。交付团队的每个人始终对应用程序的质量负责。\n\
  \n### 完成意味着发布\n你听过多少次开发者说某个用户故事或功能已经“完成”了？也许你听过项目经理问那个开发者它是否“真的做完了（done done）”？“完成”意味着什么？实际上，一个功能只有在为用户交付价值时才算完成。这是持续部署实践背后的动力之一（参见第\
  \ 10 章，“部署和发布应用程序”）。\n\n对于某些敏捷交付团队来说，“完成”意味着发布到生产环境。这是软件开发项目的理想状态。然而，将此作为完成的衡量标准并不可行。软件系统的初始发布可能需要一段时间才能达到真实外部用户从中受益的状态。因此，我们将退而求其次次优方案：当一个功能在类生产环境中向用户社区代表进行成功演示并测试后，它就应该是“完成”的。\n\
  \n没有所谓的“80% 完成”。事情要么已完成，要么未完成。在事情完成之前可以估计剩余的工作——但那些将永远只是估算。使用估算来确定剩余工作的总量，会导致那些引用百分比的人在估算（如往常那样）出错时产生指责和互相推诿。\n\
  \n这一原则还有一个有趣的推论：一个人没有力量独立完成任何事情。它需要交付团队中的许多人员共同努力才能完成任何事情。这就是为什么测试人员、构建和运维人员、支持团队、开发人员从开始共同工作是如此重要。这也是为什么整个交付团队都要负责交付——这一原则如此重要，以至于专门设了一节……\n\
  \n#### 每个人都对交付过程负责\n\n\n理想情况下，组织中的每一个人都与其目标保持一致，并共同努力帮助彼此实现这些目标。最终，团队的成功或失败是一个团队整体的结果，而不是个人的。然而，在太多的项目中，现实情况是开发人员将工作“扔过墙”交给测试人员。然后，测试人员在发布时将工作“扔过墙”交给运维团队。当出现问题时，人们花费在互相指责上的时间往往比修复由于这种孤岛作业模式不可避免而产生的缺陷的时间还要多。\n\
  \n如果你在一个小型组织或一个相对独立的部门工作，你可能对发布软件所需的资源拥有完全的控制权。如果是这样，那太棒了。如果不是，意识到这一原则可能需要长时间的努力，以打破那些隔离不同角色人员的“孤岛”之间的障碍。\n\
  \n从新项目开始，就让每个人都参与到交付过程中，并确保他们有机会进行频繁且定期的沟通。一旦障碍消除，这种沟通应该是持续的，但你可能需要循序渐进地朝着这一目标努力。建立一个系统，让每个人一目了然看到应用程序的状态、健康状况、各种构建版本、通过了哪些测试，以及可以部署到的环境状态。该系统还应该让人们能够执行工作所需的操作，例如部署到他们控制的环境中。\n\
  \n这是 DevOps 运动的核心原则之一。DevOps 运动关注的是我们在本书中设定的相同目标：鼓励所有参与软件交付的成员之间进行更多的协作，以便更快、更可靠地发布有价值的软件\
  \ [`aNgvoV`]。\n\n# 持续改进\n\n值得强调的是，应用程序的首次发布只是其生命期的第一阶段。所有的应用程序都会演进，并且会有后续发布。你的交付过程也随之演进是至关重要的。\n\
  \n整个团队应该定期聚集在一起，对交付过程进行回顾。这意味着团队应该反思哪些地方做得好，哪些做得不好，并讨论改进事项的意见。应该指定专人负责每个主意，并确保这些意见得到执行。然后，当团队下次聚齐时，他们应该汇报执行的情况。这被称为`德明循环`（Deming\
  \ cycle）：计划、执行、学习、处理。\n\n组织中的每个人参与到这一过程中至关重要。让反馈只在孤岛内部发生而不跨越孤岛，是灾难的根源：它会导致以牺牲全局优化为代价的局部优化——并最终导致互相指责。\n\
  \n## 总结\n\n传统上，软件发布点是一个充满压力的时刻。同时，与代码创建和管理相关的学科相比，它被视为一个未经验证的、手动的过程，并依赖于临时的配置管理技术来处理系统配置的关键方面。在我们看来，与软件发布相关的压力与其手动、易错的本质是相关的因素。\n\
  \n通过采用自动化构建、测试和部署技术，我们获得了许多益处。我们获得了验证更改的能力，使过程在系列环境中均具有可复现性，并在很大程度上消除了错误侵入生产环境的机会。我们获得了部署更改的能力，从而更快地带来业务收益，因为发布过程本身不再是阻碍。实施自动化系统会鼓励我们实施其他良好实践，例如行为驱动开发（BDD）和全面的配置管理。\n\
  \n我们还获得了与家人朋友共度更多周末的时间，以更少压力的方式生活，同时提高生产力。这有什么不好的呢？人生太短，不应该把周末浪费在服务器房里部署应用程序。\n\n\
  开发、测试和发布过程的自动化对软件发布的速度、质量和成本有着深远的影响。其中一位作者从事一个复杂的分布式系统。该系统发布到生产环境（包括大规模数据库中的数据迁移）根据特定发布相关的数据迁移规模，需要\
  \ 5 到 20 分钟不等。移动数据需要很长时间。我们了解的另一个相关且可比的系统，在同样的环节上需要 30 天。\n\n本书的其余部分在提供的建议和提出的方案方面将更加具体，但我们希望这一章能为你提供一个理想但现实的本书范围图景——从两万英尺的高度来看。我们在这里提到的项目都是真实的项目，虽然为了保护相关人员我们对它们进行了一些掩饰，但我们非常努力不夸大任何技术细节或任何技术的价值。\n\
  \n## 第 2 章。配置管理\n\n## 引言\n\n配置管理是一个广泛使用的术语，通常作为版本控制的同义词。值得用我们自己的非正式定义为本章设定背景：\n\n\
  配置管理是指对与你的项目相关的所有产物及其之间的关系进行存储、检索、唯一标识和修改的过程。\n\n你的配置管理策略将决定你如何管理项目内部发生的所有更改。因此，它记录了你的系统和应用程序的演进。它还将指导你的团队如何协作——这是任何配置管理策略至关重要但有时被忽视的后果。\n\
  \n尽管版本控制系统是配置管理中最明显的工具，但决定使用它（无论团队多小，每个团队都应该使用一个）只是开发配置管理策略的第一步。\n\n最终，如果你有一个良好的配置管理策略，你应该对以下所有问题回答“是”：\n\
  \n- 我可以准确地复现我的任何环境，包括操作系统的版本、其补丁级别、网络配置、软件栈、部署其中的应用程序及其配置吗？\n- 我可以轻松地对这些项目中的任何一个进行增量更改，并将更改部署到任何或所有环境中吗？\n\
  - 我可以轻松地查看特定环境中发生的每种更改，并追溯确切的更改是什么、是谁制作的以及何时制作的吗？- 我可以满足我必须遵守的所有合规条例吗？\n- 团队的每个成员是否都能轻松获取所需的信息并进行他们所需的更改？还是说该策略阻碍了高效交付，导致周期时间增加和反馈减少？\n\
  \n最后一点非常重要，因为我们经常会遇到虽然解决了前四点，但为团队协作设置了重重障碍的配置管理策略。这是没必要的——只要足够细心，这最后一个约束与其他点并不对立。我们不会在本章中告诉你如何回答所有这些问题，尽管我们将在全书中解决所有这些问题。在本章中，我们将问题分为三个：\n\
  \n1. 为管理应用程序的构建、部署、测试和发布过程做好准备工作。我们分两部分处理：将所有内容纳入版本控制以及管理依赖关系。\n2. 管理应用程序的配置。\n\n\
  \n\n\n\n# 3. 整个环境配置管理——应用程序所依赖的软件、硬件和基础设施；环境管理的原理，涵盖从操作系统到应用服务器、数据库以及其他商业现成（COTS）软件。\n\
  \n## 使用版本控制\n\n版本控制系统（也称为源控制、源代码管理系统或修订控制系统）是一种用于保留文件多个版本的机制，这样当你修改文件时，仍然可以访问先前的修订版本。它们也是参与软件交付的人员之间进行协作的机制。\n\
  \n第一个流行的版本控制系统是一个名为 `SCCS`（源代码控制系统）的专有 UNIX 工具，其历史可以追溯到 20 世纪 70 年代。它后被 `RCS`（修订控制系统）取代，随后又被\
  \ `CVS`（并发版本系统）取代。这三个系统今天仍在在使用，尽管它们的市场份额已日益缩小。如今，有许多更优越的版本控制系统，包括开源和专有系统，它们都是为各种不同的环境而设计的。特别是，我们认为在极少数情况下，开源工具——`Subversion`、`Mercurial`\
  \ 或 `Git`——才会无法满足大多数团队的需求。我们将在第 14 章“高级版本控制”中花费更多时间来探索版本控制系统及其使用模式，包括分支和合并。\n\n\
  从本质上，版本控制系统的目标有两个：第一，它保留并提供了对其中存储过的每个文件的每个版本的访问。此类系统还提供了一种方法，可以将元数据（即描述存储数据的信息）附加到单个文件或文件集合上。第二，它允许分布在空间和时间上的团队进行协作。\n\
  \n你为什么要这样做？有几个原因，但归根结底是为了回答这些问题：\n\n- 什么构成了你软件的特定版本？你如何重现生产环境中存在的软件二进制文件和配置的特定状态？\n\
  - 谁在何时为了什么原因做了什么操作？这不仅在出现问题时知道这些非常有用，它还讲述了你的应用程序的故事。\n\n这些都是版本控制的基础。大多数项目都使用版本控制。如果你的项目还没有使用，请阅读接几节，然后放下这本书并立即添加它。接下来的几节是关于关于如何最有效地利用版本控制的建议。\n\
  \n### 将所有内容绝对纳入版本控制中\n\n我们倾向于使用“版本控制”而非“源控制”术语的原因之一是，版本控制不仅仅是为了源代码。与软件创建相关的每一个构制品都应该处于版本控制之下。开发者当然应该将它用于源代码，但还应用于测试、数据库脚本、构建和部署脚本、应用程序、编译器和工具集的的文档、库以及配置文件等——这样你团队的新成员就可以从零开始工作。\n\
  \n存储重创建应用程序运行的测试环境和生产环境所需的所有信息同样重要。这应该包括应用程序软件栈以及组成环境的操作系统的配置信息、DNS 区域文件、防火墙配置等。最少的情况下，你需要重创建应用程序二进制文件及其运行环境所需的\
  \ `everything`（一切）。\n\n目标是将项目生命周期中任何时候可能发生更改的所有内容都以受控的方式存储起来。这允许你在项目历史的任何一点，恢复整个系统（从开发环境到生产环境）状态的精确快照。将开发团队开发环境的配置文件保留在版本控制中非常有帮助，因为这使得团队中的每个人都能轻松使用相同的设置。分析师应该存储需求文档。测试人员应该将他们的测试脚本和程序留在版本控制中。项目经理应该在这里保存他们的发布计划、进度表和风险日志。简而言之，团队的每个成员都应该将与项目相关的任何文档或文件存储在版本控制中。\n\
  \n## 提交一切内容\n\n多年前，作者之一参与了一个由三个位于不同地点的团队共同开发的项目。每个团队负责的子系统通过 `IBM MQSeries` 使用专有消息协议进行相互通信。这是在我们开始使用持续集成作为防止配置管理问题的屏障之前。\n\
  \n我们在源代码的版本控制使用上一直非常严谨。我们在职业生涯的更早阶段就学到了这门教训。然而，我们的版本控制仅停留在源代码阶段。\n\n当时间到来，在项目首次发布前需要集成这三个独立的子系统时，我们发现其中一个团队使用的是一个不同版本的描述消息协议的功能说明书。事实上，他们实现的文档已经过时了六个月。自然地，当我们试图修复由这些问题引起的问题并保持项目按计划进行时，出现了大量的深夜工作。\n\
  \n如果我们当时简单地将文档提交到我们的版本控制系统中，我们就不会遇到这个问题，也不需要需要熬夜了！如果我们使用了持续集成，项目将会早完成得多。\n\n我们再怎么强调良好的配置管理有多重要都不过。它使本书中的其他一切成为可能。如果你没有在版本控制中拥有项目的绝对每一个源构制品，你就无法享受我们在书中讨论的任何好处。我们讨论的所有旨在减少软件周期时间和提高其质量的实践，从持续集成、自动化测试到一键部署，都取决于将与你的项目相关的所有内容都放在版本控制仓库中。\n\
  \n除了存储源代码和配置信息外，许多项目还将其应用程序服务器、编译器、虚拟机以及工具链的其他部分的二进制镜像存储在版本控制中。这非常有用，它不仅加速了新环境的创建，更重要的是，确保了基础配置是完全定义的，因此已知它们是良好的。只需从版本控制仓库中检出所需的所有内容，就能确保开发、测试甚至生产环境的稳定平台。你随后可以将整个环境（包括应用了配置基准的基础操作系统）作为虚拟机镜像存储，以获得更高水平的保证和更简单的部署。\n\
  \n这种策略提供了终极的控制和可靠的行为。在如此严谨的配置管理的系统下，不会在流程的后期添加错误。这种级别的配置管理确保了只要你保持仓库完整，你始终能检索到可运行软件版本。即使与项目相关的编译器、编程语言或其他工具已成为历史的尘埃，这种方法也能保护你。\n\
  \n\n\n\n我们不建议你将应用程序编译后的二进制输出保留在版本控制中。这是出于几个原因。首先，这些文件很大，而且与编译器不同，它们会迅速增加（对于每一次编译并通过自动化提交测试的检入，我们都会创建新的二进制文件）。其次，如果你有一个自动化构建系统，你应该能够通过重新运行构建脚本从源码轻松地重新创建它们。请注意：我们不建议将重新编译作为构建过程的常规部分。然而，在紧急情况下，你的构建系统和源代码的组合就应该是重新创建一个应用程序实例所需的全部内容。最后，存储构建的二进制输出会破坏“能够为每个应用程序版本识别仓库单一版本”的理念，因为对于同一个版本可能有两个提交：一个针对源代码，另一个针对二进制文件。这听起来可能有些很晦涩，但在创建部署流水线——此本书的核心主题之一时，这会变得至关重要。\n\
  \n## 版本控制：删除的自由\n\n在版本控制中保留每个文件的每个版本，其推论是它允许你大胆地删除那些你认为不需要的东西。有了版本控制，你可以毫无风险地对“我们应该删除这个文件吗？”这个问题回答“是！”；如果你做出了错误的决定，只需从早期的配置集中检索文件即可轻松修复。\n\
  \n这种删除的自由本身就是大型配置集可维护性方面迈出的重要一步。一致性和组织性是保持大型团队高效工作的关键。剔除旧想法和旧实现的能力让团队能够尝试新事物并改进代码。\n\
  \n## 定期提交到主干（Trunk）\n\n使用版本控制工作的核心存在着一种张力。一方面，为了获得它的许多优势（例如能够回到最近的已良好的制品版本），频繁提交（check\
  \ in）是非常重要的。\n\n另一方面，一旦你将更改提交到版本控制中，它们就公开了，团队中的其他所有人都可以立即访问。此外，如果你正在使用持续集成（正如我们建议的那样），你的更改不仅对团队中的其他开发者是可见的；你还产生了一个可能进入验收测试甚至生产环境的构建。\n\
  \n由于提交是发布的一种，因此确保你的工作（无论内容是什么）已经准备好应对提交所隐含的公开水平至关重要。这对于开发者来说尤其如此，考虑到他们工作的性质，他们需要对提交的影响保持谨慎。如果开发者正在处理系统的某个复杂部分，他们不会希望在完成之前提交代码；他们希望确认自己的代码处于良好状态，并且不会对系统的其他功能产生不利影响。\n\
  \n在某些团队中，这可能导致提交之间间隔几天甚至几周，这是有问题的。当你定期提交时，版本控制的优势会得到增强。特别地，除非每个人都频繁提交到主线（mainline），否则无法安全地重构应用程序——合并过程会变得极其复杂。如果你频繁提交，你的更改就可以供其他人看到并交互，你会得到清晰的表明，你的更改没有破坏应用程序，而且合并始终是小规模且易于管理的。\n\
  \n一些人使用的用来解决这种困境的解决方案是在版本控制系统中为新功能创建一个单独分支。在某个时刻，当更改被认为是满意的，它们将被合并到主开发分支。这有点像两阶段提交；事实上，某些版本控制系统的工作方式本质上就是这样的。\n\
  \n然而，我们反对这种做法（有三个例外，在第 14 章中讨论）。这是一个争议性的观点，特别是对于 ClearCase 等工具的用户来说。这种方法有几个问题：\n\
  \n- 它与持续集成背道而驰，因为分支的创建推迟了新功能的集成，集成问题只有在分支合并时才会被发现。\n- 如果多个开发者都创建分支，问题会呈指数级增长，合并过程可能会变得荒谬地复杂。\n\
  - 尽管有一些强大的自动化合并工具，但它们无法解决语义冲突，例如某人在一个分支中重命名了方法，而另人在另一个分支中为该方法添加了新调用。\n- 重构代码库变得非常困难，因为分支往往涉及许多文件，这使得合并更加困难。\n\
  \n我们将在第 14 章“高级版本控制”中详细讨论分支和合并的复杂性。\n\n一个更好的答案是增量地开发新功能，并定期、频繁地将它们提交到版本控制的主干。这保持了软件始终处于运行和集成状态。这意味着你的软件始终是经过测试的，因为每当你提交时，持续集成（CI）服务器都会在主干上运行你的自动化测试。它减少了由重构导致大型合并冲突的可能性，确保在修复成本低廉时立即捕获集成问题，并产生更高质量的软件。我们将在第\
  \ 13 章“管理组件和依赖”中更详细地讨论避免分支的技术。\n\n为了确保你在提交时不会破坏应用程序，两种做法是很有用的。一种是在提交之前运行你的提交测试套件。这是一组运行快速（不到十分钟）但相对全面的测试，用于验证你没有引入任何明显的回归。许多持续集成服务器都有一个名为\
  \ `pretested commit`（预测试提交）的功能，它允许你在提交之前在类生产环境中运行这些测试。\n\n第二是增量地引入更改。我们建议你在完成每次独立的增量更改或重构后，将更改提交到版本控制系统。如果你正确使用这种技术，你应该至少每天提交一次，通常每天提交几次。如果你不习惯这样做，这听起来可能不现实，但向你保证，这将带来高效的软件交付流程。\n\
  \n### 使用有意义的提交信息\n\n每个版本控制系统都具有为提交添加描述的功能。省略这些信息很容易，许多人习惯了这种坏习惯。编写描述性提交信息的最重要的原因是，当构建崩溃时，你清楚是谁破坏了构建以及为什么。但这并不是唯一原因。我们的作者们曾数多次由于没有使用足够描述性的提交信息而陷入困境，通常是在紧迫的截止日期下尝试调试复杂问题时。通常的场景如下：\n\
  \n1. 你发现了一个由于某一行相当晦涩的代码引起的 bug。\n2. 你使用你的版本控制系统查找是谁在什么时候放入了那行代码的。\n3. 那个人正在休假或已经回家了，留下了一条写着“修复晦涩\
  \ bug”的提交信息。\n4. 你修改了那行晦涩的代码来修复 bug。\n5. 其他地方崩溃了。\n6. 你花费了几个小时试图让应用程序重新运行。\n\n\n\
  \n\n在这些情况下，一条解释人员在提交该更改时正在做什么的提交信息，可以节省你几个小时的调试时间。这种情况发生得越频繁，你就越会后悔起初没有使用良好的提交信息。编写最短的提交信息并不会获得任何奖励。用几句中等长度的句子概述你正在做的工作，通常会在日后为你节省许多倍倍的精力。\n\
  \n我们喜欢的一种风格是多段式的提交信息，其中第一段是摘要，后续段落添加更多细节。第一段是在每个提交一个行的列表（line-per-commit displays）中显示的内容——将其视为报纸标题，给予读者足够的信息来判断她是否有兴趣继续阅读。\n\
  \n你还应该包含指向正在处理的功能或缺陷（bug）在项目管理工具中标识符的链接。在我们工作过的许多团队中，系统管理员会锁定版本控制系统，使得任何不包含此类信息的提交都会失败。\n\
  \n## 管理依赖关系\n\n应用程序内部最常见的外部依赖是它使用的第三方库，以及由组织内其他团队开发的组件或模块之间的关系。库通常以二进制文件的形式部署，绝不会由应用程序的开发团队更改，且更新频率非常低。组件和模块通常处于其他团队的活跃开发中，变化非常频繁。\n\
  \n我们在第 13 章“管理组件和依赖关系”中花费了大量时间讨论依赖关系。然而，在这里我们将涉及依赖管理对配置管理影响的一些关键问题。\n\n### 管理外部库\n\
  \n外部库通常以二进制形式出现，除非你正在使用解释型语言。即使是解释型语言，外部库通常也会由 Ruby Gems 或 Perl 模块等包管理系统全局安装在你的系统上。\n\
  \n关于是否对库进行版本控制，存在一些争议。例如，Java 的构建工具 `Maven` 允许你指定应用程序依赖的 `JARs`，并从互联网上的仓库（或本地缓存，如果你有的话）下载它们。\n\
  \n这并不总是如人意的；新团队成员可能被迫“下载整个互联网”（或者至少是其中很大一部分）才能开始项目。然而，这确实让版本控制的检出（check-out）变得小得多。\n\
  \n我们建议你在本地某处保留外部库的副本（对于 `Maven` 来说，你应该为你的组织创建一个仓库，包含已批准使用的库版本）。如果你必须遵守合规性规定，这一点至关重要，它也能让项目启动更快。这也意味着你始终拥有重现构建的能力。此外，我们强调你的构建系统应该始终指定你所使用的外部库的精确版本。如果不这样做，你就无法重现构建。不完全精确会导致由于人员或构建系统使用不同版本的库，而偶尔出现长时间的调试过程，以追踪奇怪的错误。\n\
  \n是否将外部库保留在版本控制中，涉及一些权衡。这使得软件版本与构建这些软件所使用的库版本之间的关联变得容易得多。然而，这会使版本控制仓库变大，检出时间变长。\n\
  \n### 管理组件\n\n将除最小应用程序外的所有应用拆分为组件是一项良好的做法。这样做可以限制对应用程序的更改范围，减少回归错误。它还鼓励了重用，并在大型项目中实现了更高效的开发流程。\n\
  \n通常，你会从一个单体构建（monolithic build）开始，一步到位为整个应用程序创建二进制文件或安装程序，并通常会同时运行单元测试。取决于你使用的技术栈，单体构建通常是构建中小型应用程序最有效的方法。\n\
  \n但是，如果你的系统不断增长，或者你有多个项目共同依赖的组件，你可能考虑将组件的构建拆分成独立的流水线。如果你确实这样做，确保流水线之间是二进制依赖而非源码依赖是非常重要的。重新编译依赖不仅效率更低，而且意味着你正在的产物可能与你已经测试过的产物不同。使用二进制依赖可能导致难以将故障追溯到导致该问题的源码更改，但一个良好的\
  \ CI 服务器会帮助你解决这个问题。\n\n虽然现代 CI 服务器在管理依赖关系方面做得相当不错，但它们通常的代价是让在开发者工作站上重现应用程序的整个端到端构建过程变得更加困难。理想情况下，如果我在机器上检出了几个组件，那么对其中一些组件进行更改应该是相对直接的，只需运行一个命令即可按正确的顺序重新构建必要的部分、创建适当的二进制文件并运行相关测试。不幸的是，这超出了大多数构建系统的能力，至少在没有构建工程师进行大量巧妙黑科技的情况下，尽管像\
  \ `Ivy`、`Maven` 等工具以及 `Gradle` 和 `Buildr` 等脚本技术确实让生活比以前变得轻松了。\n\n关于管理组件和依赖关系，第 13\
  \ 章中会有更多内容。\n\n## 管理软件配置\n\n配置是构成应用程序的三个关键部分之一，与其二进制文件和数据并列。配置信息可用于在构建时、部署时运行时更改软件的行为。交付团队需要仔细考虑哪些配置选项应该是可用的、如何在整个应用程序生命周期中管理它们，以及如何确保跨组件、应用程序和技术的一致性配置管理。我们认为，你应该像对待代码一样对待系统的配置：使其受于妥当的管理和测试。\n\
  \n### 配置与灵活性\n\n如果被问及，每个人都想要灵活的软件。你为什么不要呢？但灵活性通常是有代价的。\n\n显然存在一个连续体：在的一端是单一用途软件，它能很好地完成一项工作，但几乎或没有修改其行为的能力。在光谱的另一端是编程语言，你可以用它编写游戏、应用服务器或库存控制系统——这就是灵活性！然而，大多数应用程序并不处于这两个极端。相反，它们是为特定目的设计的，但在目的范围内，它们通常会有一些可以修改其行为的方式。\n\
  \n对实现灵活性的追求可能会导致“终极可配置”这一常见的反模式，这在很多时候被列为软件项目的需求。它在最好情况下是没有帮助的，而在最坏的情况下，这一个需求就会杀掉一个项目。\n\
  \n\n\n\n根据我们的经验，一直流传着一种迷思，认为更改配置信息的风险比更改源代码低。我们的观点是，在同时拥有两者访问权限的情况下，通过更改配置来停止你的系统，与更改源代码一样容易的。如果我们更改源代码，我们有多种方式可以防止自己犯错：编译器会排除掉无意义的内容，而自动化测试应该能捕获大多数其他错误。另一方面，大多数配置信息是自由格式且未经过测试的。在大多数系统中，没有任何东西能阻止我们把一个\
  \ URI 从 `[http://www.asciimation.co.nz/]` 改为 `“this is not a valid URI.”`。大多数系统直到运行时才会被检测到这种变化——到那时，你的用户看到的将不是《星大战》（Star\
  \ Wars）的 ASCII 版本，而是一份糟糕的异常报告，因为 `URI` 类无法解析 `this is not a valid URI.`。\n\n在通往高度可配置软件的道路上有很多许多巨大的陷阱，但最糟糕的可能是以下这些：\n\
  \n- 它经常导致“分析瘫痪”，即问题看起来如此巨大且难以解决，以至于团队花费所有时间思考如何解决它，而没有花任何时间去实际解决。\n- 系统配置变得极其复杂，以至于灵活性带来的许多优势丧失了，其配置上投入的精力完全可以比拟自定义开发的成本。\n\
  \n* * *\n\n### 终极可配置性的危险\n\n我们曾遇到过一个客户，他们在某个特定的垂直市场中，与一个成包应用程序的供应商合作了三年。该应用程序被设计得非常灵活，并经过配置以满足客户的需求，尽管这些配置是由专门人员完成的。\n\
  \n我们的客户担心该系统仍然没有准备好投入生产环境。我们的组织在八个月内用 `Java` 从零开始构建实现了一个自定义的等品。\n\n可配置的软件并不总是看起来看起来那么廉价的解决方案。通常情况下，专注于交付具有少量配置的高价值功能，然后在需要时再添加配置选项要好得多。\n\
  \n* * *\n\n不要误会我们：配置本身并不邪恶。但它需要被管理且保持一致。现代计算机语言已经演化出各种特性和技术来帮助它们减少错误。在大多数情况下，这些保护机制并不适用于配置信息，而且很多时候甚至根本没有测试来验证你的软件在测试和生产环境中已配置正确。正如第\
  \ 117 页中“测试你的部署”章节部分描述的，部署烟测试是缓解这一问题的方法，并且应该始终使用。\n\n### 配置的类型\n\n配置信息可以在构建、部署、测试和发布过程的多个点注入到你的应用程序中，而且通常会包含在多个点中。\n\
  \n- 你的构建脚本可以在`build time`（构建时）拉取配置并将其整合到二进制文件中。\n- 你的打包软件可以在`packaging time`（打包时）注入配置，例如在创建程序集、`ears`\
  \ 或 `gems` 时。\n- 你的部署脚本或安装程序可以获取必要信息或向用户索取，并在`deployment time`（部署时）作为安装过程的一部分传递给你的应用程序。\n\
  - 你的应用程序本身可以在`startup time or run time`（启动时或运行时）获取配置。\n\n通常情况下，我们认为在构建或打包时注入配置信息是一种坏做法。这遵循这样一个原则：你应该能够将相同的二进制文件部署到每个环境，这样就可以确保你发布的东西与你测试的东西是同一个。此的推论是，部署之间的任何变化都需要作为配置被捕获，而不是在应用程序编译或打包时固化其中。\n\
  \n* * *\n\n### 打包配置信息\n\n`J2EE` 规范的一个严重问题是，配置必须与应用程序的其他部分一起打包在 `war` 或 `ear` 中。除非使用规范提供之外的其他配置机制，这意味着如果存在任何配置差异，你就必须为部署的每个环境创建一个不同的\
  \ `war` 或 `ear` 文件。如果你被困于此，你需要找到另一种方法在部署时或运行时配置你的应用程序。我们在下文中提供了一些建议。\n\n\n\n* *\
  \ *\n\n在部署时能够配置你的应用程序通常是重要的，这样你就可以告诉它它所依赖的服务（如数据库、消息服务器或外部系统）位于何处。例如，如果你的应用程序的运行时配置存储在数据库中，你可能希望部署时将数据库的连接参数传递给应用程序，以便它在启动时检索。\n\
  \n如果你控制着生产环境，通常可以安排部署脚本获取这些配置并将其提供给应用程序。对于成包软件，默认配置通常是包的一部分，但需要某种方法在部署时为了测试目的而覆盖它。\n\
  \n最后，你可能需要在启动时或运行时配置应用程序。启动时配置可以以环境变量的形式提供，也可以作为启动系统命令的参数提供。或者，你可以使用用于运行时配置的机制：注册表设置、数据库、配置文件或外部配置服务（例如通过\
  \ `SOAP` 或 `REST`-风格的接口访问）。\n\n无论你选择何种机制，我们强烈建议，在实际可能的范围内，你应该尝试通过相同的机制为组织中的所有应用程序和环境提供所有配置信息。这并不总是可能的，但当可行时，它意味着有一个单一的配置源可供更改、管理、版本控制和覆盖（如果需要）。在不遵循这一实践的组织中，我们看到人们经常花费几个小时来追踪某个环境中特定设置的来源。\n\
  \n### 管理应用程序配置\n\n在管理应用程序配置时，有三个问题需要考虑：\n\n1. 你如何表示你的配置信息？\n2. 部署脚本如何访问它？\n3. 它在环境、应用程序和版本之间如何变化？\n\
  \n配置信息通常被建模为一组键值字符串。(1)\n\n* * *\n\n![Image](img/common.jpg)\n\n\n\n\n请注意，存储配置的地方与应用程序访问配置的机制并不是同一个。您的应用程序可以通过本地文件系统上的文件访问配置，也可以通过更奇特的机制访问，例如\
  \ Web 服务或目录服务，或者通过数据库；下一节将对此进行详细介绍。\n\n通常情况下，将针对应用程序每个测试环境和生产环境的实际配置信息存储在与源代码分离的存储库中，是十分重要的。这些信息的变化频率通常与其他版本控制的产物不同。然而，如果你采取了这种方法，就必须小心跟踪哪个版本的配置信息与哪个版本的应用程序匹配。这种分离对于安全相关的配置元素（如密码和数字证书）尤为重要，因为对这些元素的访问应该是受限的\n\
  \n![Image](img/light.jpg)\n\n### 不要将密码提交到源码控制或在应用程序中硬编码它们\n\n如果你被他们发现这么做，运维人员会用勺子挖出你的眼睛。别给他们这个机会。如果你必须把密码存储在脑海以外的地方，可以尝试以加密的形式将其放在你的主目录下。\n\
  \n这种技术的一种极其糟糕的变体是：将应用程序某一层的密码存储在访问该层级的代码或文件系统中。密码应始终由执行部署的用户输入。处理多层系统的身份验证有几种接受的方法。你可以使用证书、目录服务或单点登录系统。\n\
  \n数据库、目录和注册表是存储配置的方便地方，因为它们可以远程访问。然而，请确保保留配置更改的历史以便进行审计和回滚。要么使用一个自动处理这些的系统，要么将版本控制作为配置的参考系统，并编写脚本根据需要将适当的版本加载到你的数据库或目录中。\n\
  \n### 访问配置\n\n管理配置的最有效方法建立一个中心服务，每个应用程序都可以通过它获取所需的配置。这对于软件包、企业内部应用程序以及托管在互联网上的软件服务（SaaS）都是如此。这些场景之间的主要区别在于注入配置信息的时机——对于软件包是在打包时，而对于其他情况则是在部署时或运行时。\n\
  \n应用程序访问配置最简单的方法可能是通过文件系统。这种方法的优点是跨平台且被每种语言支持——尽管它可能不适用于 applet 等沙箱运行环境。此外，如果你需要在集群上运行应用程序，还存在保持文件系统上配置同步一致的问题。\n\
  \n另一种备选方案是从中心化存储库（如 RDBMS、LDAP 或 Web 服务）获取配置。一个名为 `ESCAPE [apvrEr]` 的开源工具使得通过 RESTful\
  \ 接口轻松管理和访问配置信息变得简单。应用程序可以执行 `HTTP GET`，并在 URI 中包含应用程序和环境名称以获取配置。这种机制在部署时或运行时配置应用程序时最合理。你将环境名称传递给部署脚本（通过属性、命令行开关或环境变量），然后你的脚本从配置服务获取适当的配置并将其提供给应用程序，可能作为文件系统上的一个文件。\n\
  \n无论配置信息存储的本质是什么，我们都建议通过一个简单的外观模式类（facade class）将技术细节与应用程序隔离开，该类提供如下：\n\n```\ngetThisProperty()\n\
  \ngetThatProperty()\n```\n\n风格的接口，这样你就可以在测试中模拟它，并在需要时更改存储机制。\n\n### 配置建模\n\n每个配置设置都可以被建模为一个元组，因此一个应用程序的配置由一组元组组成。然而，可用元组集合及其值通常取决于以下三点：\n\
  \n- 应用程序\n- 应用程序的版本\n- 它运行的环境（例如：开发、UAT、性能测试、预发布或生产环境）\n\n例如，你的报表应用程序的 1.0 版本将有一组与\
  \ 2.2 版本不同、或与你的投资管理应用程序 1.0 版本不同的元组。这些元组的值又会根据它们被部署的环境而变化。例如，应用程序在 UAT 中使用的数据库服务器通常与生产环境使用的不同，甚至在开发者机器之间也可能不同。对于软件包或外部集成点也是如此——你的应用程序使用的更新服务在运行集成测试时，与从客户桌面访问时使用的服务将是不一样的。\n\
  \n无论你使用什么来表示和提供配置信息——源码控制中的 XML 文件还是 RESTful Web 服务——都应该能够处理这些不同的维度。以下是建模配置信息时需要考虑的一些用例：\n\
  \n- 添加一个新环境（可能是一个新的开发者工作站，或者一个容量测试环境）。在这种情况下，你需要能够为部署到此新环境的应用程序指定一组新的值。\n- 创建应用程序的新版本。通常，这将引入新的配置设置并丢弃一些旧设置。你应该确保在将此新版本部署到生产环境时，它可以获取到新设置；但如果你必须回滚到旧版本，它将使用旧设置。\n\
  - 将应用程序的新版本从一个环境迁移到另一个环境。你应该确保任何新设置在新环境中可用，但为该新环境设置了适当的值。\n- 迁移数据库服务器。你应该能够非常简单地更新引用此数据库的每个配置设置，使其指向新服务器。\n\
  - 使用虚拟化管理环境。你应该能够使用你的虚拟化管理工具创建一个特定环境的新实例，该实例包含所有正确配置的虚拟机（VM）。你可能希望将这些信息作为部署到该环境的特定版本应用程序配置设置的一部分。\n\
  \n跨环境管理配置的一种方法是将预期的生产配置设置为默认值，并在其他环境中根据需要覆盖此默认值（确保已部署防火墙，以防误中生产系统）。这意味着任何环境特定的定制都减少为为了让软件在特定环境中运行而必须更改的配置属性。这简化了在何处配置什么的视图。然而，这取决于取决于你的应用程序的生产配置是否具有特权——某些组织要求生产配置与环境配置在存储库分离。\n\
  \n### 测试系统配置\n\n正如你的应用程序和构建脚本需要测试一样，你的配置设置也需要测试。测试配置包含两个部分。\n\n\n\n\n第一阶段是确保配置设置中对外部服务的引用是正确的。作为部署脚本的一部分，你应该确保你配置为使用的消息总线在配置的地址上确实已并运行，并且确保你的应用程序在功能测试环境中预期使用的模拟订单履行服务正在工作。至少，你可以\
  \ ping 所有的外部服务。如果你的应用程序依赖的任何内容不可用，你的部署或安装脚本应该失败——这可以作为你配置设置的一项极佳的冒烟测试。\n\n第二阶段是在应用程序安装后实际运行一些冒烟测试，以确保其按预期运行。这应该仅涉及少数几个依赖于配置设置正确的各项功能测试。理想情况下，如果结果不符合预期，这些测试应该停止应用程序并导致安装或部署过程失败。\n\
  \n## 跨应用程序管理配置\n\n在中大型组织中，由于许多应用程序需要共同管理，配置管理的问题变得尤为复杂。通常在这些组织中，存在一些具有晦涩配置选项且不为人知的遗留应用程序。最重要的任务之一是为每个应用程序的所有配置选项维护一份目录，记录它们存储在何处、生命周期是什么以及如何进行更改。\n\
  \n如果可能，此类信息应该作为构建过程的一部分，从每个应用程序的代码中自动生成。在无法实现的情况下，应将其收集在 wiki 或或其他管理系统中。\n\n在管理并非完全由用户安装的应用程序时，了解每个运行应用程序的当前配置至关重要。目标是通过你运维团队的生产监控系统查看每个应用程序的配置，该系统还应该显示每个环境中部署了哪个版本的应用程序。`Nagios`、`OpenNMS`\
  \ 和 `HP OpenView` 等工具提供了记录此类信息的服务。或者，如果你以自动化方式管理构建和部署过程，你的配置信息应该始终通过此过程应用，因此存储在版本控制或类似\
  \ `Escape` 的工具中。\n\n当你的应用程序相互依赖且必须编排部署时，实时访问这些信息特别为重要。由于一个应用程序的几个配置选项设置错误而导致整组服务崩溃，已经浪费了无数小时。此类问题极难诊断。\n\
  \n每个应用程序的配置管理都应该作为项目启动的一部分进行计划。考虑你的生态系统中其他应用程序是如何管理配置的，并在可能的情况下使用相同的方法。很多时候，对如何管理配置的决定是临时做的，导致每个应用程序都将其配置封装在不同的地方，并使用不同的机制进行访问。这使得确定环境的配置变得异常困难。\n\
  \n## 应用程序配置管理原则\n\n像对待代码一样对待你应用程序的配置。妥善管理它并对其进行测试。以下是在创建应用程序配置系统时需要考虑的原则列表：\n\n\
  - 考虑在应用程序生命周期的哪个阶段注入特定的配置项是合理的——是在打包发布候选版本时的组装点、部署或安装时、启动时，还是运行时。与运维和支持团队沟通，确定他们的需求是什么。\n\
  \n- 将应用程序的可用配置选项与其源代码放在同一个存储库中，但将值存储在其他地方。配置设置的生命周期与代码完全不同，而密码和其他敏感信息绝不应提交到版本控制。\n\
  \n- 配置应始终由自动化过程执行，并从你的配置仓库获取值，这样你就可以始终识别每个环境中每个应用程序的配置。\n\n- 你的配置系统应该根据应用程序、其版本及其部署的环境为应用程序（包括其打包、安装和部署脚本）提供不同的值。任何人都应该能够查看特定版本的应用程序在将部署的所有环境中有哪些配置选项。\n\
  \n- 为你的配置选项使用清晰的命名规范。避免晦涩或加密的名字。尝试想象某人在没有手册的情况下阅读配置文件——他们应该能够理解配置属性是什么。\n\n- 确保你的配置信息是模块化且封装的，这样一处的更改不会对其他显然无关的配置部分产生连锁反应。\n\
  \n- 使用 `DRY`（不要重复自己）原则。定义你的配置元素，使得每个概念在配置信息集中只有一种表示。\n\n- 保持极简主义：让配置信息尽可能简单和聚焦。除非有要求或这样做有意义，否则避免创建额外的配置选项。\n\
  \n- 避免对配置系统进行过度设计。保持它尽可能简单。\n\n- 确保你有针对配置的测试，并在测试在部署或安装时运行。检查你的应用程序依赖的服务是否可用，并使用冒烟测试来确保任何依赖于你配置设置的功能都能正常工作。\n\
  \n## 管理你的环境\n\n没有任何应用程序是孤岛。每个应用程序的运行都依赖于硬件、软件、基础设施和外部系统。在书中，我们统称为你的应用程序环境。我们在 `第\
  \ 11 章`“管理基础设施和环境”中详细讨论了环境管理主题，但该主题在配置管理的背景下值得进一步讨论，因此我们在这里介绍它。\n\n在管理应用程序运行的环境时，需要记住的原则是：该环境的配置与应用程序的配置同样重要。例如，如果你的应用程序依赖消息总线，则该总线需要正确配置，否则应用程序将无法工作。操作系统的配置也很重要。例如，你可能有一个应用程序依赖于大量的文件描述符。如果操作系统的默认文件描述符限制较低，你的应用程序将无法工作。\n\
  \n管理配置信息最糟糕的方法是临时处理。这意味着手动安装所需的软件部分并编辑相关的配置文件。这是我们遇到的最常见的策略。虽然看起来简单，但这种策略在所有非微不足道的系统中都会出现几个常见问题。最明显的陷阱是，如果由于某种原因新配置不起作用，由于没有以前配置的记录，很难确定地返回到已知良好的状态。此类问题可以总结为：\n\
  \n- 配置信息集合非常大。\n\n- 一个微小的更改就可能破坏整个应用程序或严重降低其性能。\n\n\n\n\n- 一旦发生故障，找到问题并修复它需要花费不确定的时间，并且需要高级人员参与。\n\
  - 为了测试目的，精确复制手动配置的环境极其极其困难。\n- 如果没有配置，很难维护此类环境，从而导致不同节点之间的配置和行为产生偏差。\n\n在《可见性运维手册》（*The\
  \ Visible Ops Handbook*）中，作者将手动配置的环境称为“艺术品”。为了降低管理环境的成本和风险，将我们的环境转换为批量生产的对象，其创建过程应该是可重复的且耗时可预测的。我们参与过太多的项目，其中糟糕的配置管理意味着巨大的开支——仅仅为了支付专门团队来处理系统的这部分工作。它还会持续拖累开发过程的生产力，使得向测试环境、开发环境和生产环境的部署比实际需要的要复杂和昂贵得多。\n\
  \n管理环境的关键是将环境创建变为一个完全自动化的过程。创建一个新环境应该总是比修复旧环境更便宜。能够复制你的环境对于以下几个原因至关重要：\n\n- 它消除了周围存在随机基础设施的问题，这些基础设施的配置只有已经离开组织且无法联系的人才了解。当这些东西停止工作时，你通常会认为会出现长时间的停机。这是一个巨大且不必要的风险。\n\
  - 修复你的某一个环境可能花费几个小时。始终能够在可预测的时间内重建它以恢复已知的良好状态是更好的。\n- 为了测试目的，创建生产环境的副本是非常关重要的。在软件配置方面，测试环境应该是生产环境的精确复制，以便尽早发现配置问题。\n\
  \n你应该关注的环境配置信息类型有：\n\n- 你环境中的各种操作系统，包括它们的版本、补丁级别和配置设置\n- 为了支持你的应用程序需要在每个环境上安装的额外软件包，包括它们版本和配置\n\
  - 应用程序运行所需的网络拓扑结构\n- 你的应用程序依赖的任何外部服务，包括它们的版本和配置\n- 它们存在的任何数据或其他状态（例如，生产数据库）\n\n\
  我们发现，有两个原则构成了有效配置管理策略的基础：保持二进制文件与配置信息分离，并将所有配置信息都存储在一个地方。将这些基础原则应用于你系统的每一个部分，将为你铺平道路，使得创建新环境、升级系统部分组件以及在不影响系统可用的情况下发布新配置变成一个简单的自动化的过程。\n\
  \n所有这些事情都需要被考虑。虽然将你的操作系统提交到版本控制中显然是不合理的，但对其配置进行版本控制无疑不是不合理的。远程安装系统与环境管理工具（如 `Puppet`\
  \ 和 `CfEngine`）相结合使得操作系统的集中管理和配置变得简单。这个主题在第 11 章“管理基础设施和环境”中有详细介绍。\n\n对于大多数应用程序，将此原则应用于它们依赖的第三方软件栈甚至更为重要。良好的软件具有可以从命令行运行而无需任何用户干预的安装程序。它具有可以在版本控制中管理且不需要人工干预的配置。如果你的第三方软件依赖不符合这些标准，你应该寻找替代方案——这些第三方软件选择标准如此重要，以至于它们应该是每个软件评估工作的核心。在评估第三方产品和服务时，从问以下问题开始：\n\
  \n- 我们能部署它吗？\n- 我们能有效地对其配置进行版本控制吗？\n- 它将如何拟我们的自动化部署策略？\n\n如果这些问题的任何一个答案是否定的，有多种可能的应对措施——我们将在第\
  \ 11 章中详细讨论它们。\n\n在配置管理术语中，处于正确部署状态的环境被称为*基线*（*baseline*）。你的自动化环境供应系统应该能够建立或重新建立项目近期存在过的任何给定基线。每当你更改应用程序主机环境的任何方面时，你都应该存储该更改，创建基线的新版本，并将该版本的应用程序与基线的新版本关联起来。这确保了当你下次部署应用程序或创建新环境时，它将包含该更改。\n\
  \n***\n\n### 将配置管理应用于基础设施\n\n我们最近参与了两个项目，这两个项目凸显了有效使用配置管理方法与低效方法之间的差异。\n\n在第一个项目中，我们决定替换项目所基础的消息基础设施。我们当时已经有了非常有效的配置管理和良好的模块化设计。在替换基础设施之前，我们尝试升级到最新版本，供应商向我们保证该版本将解决我们大部分的顾虑。\n\
  \n我们的客户和供应商显然认为这次升级是一件大事。他们已经计划了几个月，并一直担心这会对开发团队产生破坏性影响。结果中，我们团队的两个成员负责按照本节描述的方法准备了一个新的基线。我们在本地进行了测试，包括在试用版本上运行了全套验收测试包。我们的测试指出了许多问题。\n\
  \n我们修复了最明显的问题，但并没有通过所有的验收测试。然而，我们已经达到了一个点，即确信修复工作应该是很简单的，我们最坏的情况是必须回滚到之前的基线镜像，而这些镜像都安全地存储在版本控制中。在得到开发团队其他成员的同意后，我们提交了更改，以便整个团队协作修复由消息基础设施版本更改引入的错误。整个过程只花了一天，包括运行所有自动化测试来验证我们的工作。在随后的迭代中，我们在手动测试中仔细观察了更多错误，但并没有发现。我们的自动化测试覆盖率被证明足够良好。\n\
  \n\n\n在第二个项目中，我们被要求对一个运行状况良好的遗留系统进行一些修复工作。该系统已经在生产环境中运行了多年，速度缓慢且容易出错。当我们到达时，它没有任何自动化测试，仅在源代码级别有最基础的配置管理。我们的任务之一是更新应用服务器的版本，因为该系统所运行的版本不再受供应商的支持。对于处于这种状态的应用程序，在没有支持的持续集成系统且没有任何自动化测试的情况下，整个过程进展得还相当顺利。然而，一个六人的小团队花费了两个月的时间才完成了更改、测试并部署到生产环境。\n\
  \n正如软件项目如常，进行直接的比较是不可能的。所涉及的技术非常不同，代码库也是如此。然而，两者都涉及到一个核心中间件基础设施的升级。其中一个项目花费了六人团队两个月，而另一个项目只有两个人花了半天时间。\n\
  \n### 管理环境的工具\n\n`Puppet` 和 `CfEngine` 是两个使自动化方式管理操作系统配置成为可能的工具示例。使用这些工具，你可以声明式地定义内容，例如哪些用户应该拥有访问机器的权限，以及应该安装哪些软件。对于处于这种状态的应用程序，在没有支持的持续集成系统且没有任何自动化测试的情况下，整个过程进展得还相当顺利。使用这些工具，你可以声明式地定义内容，例如哪些用户应该拥有访问机器的权限，以及应该安装哪些软件。使用这些工具，你可以声明式地定义内容，例如哪些用户应该拥有访问机器的权限，以及应该安装哪些软件。使用这些工具，你可以声明式地定义内容，例如哪些用户应该拥有访问机器的权限，以及应该安装哪些软件。使用这些工具，你可以声明式地定义内容，例如哪些用户应该拥有访问机器的权限，以及应该安装哪些软件。使用这些工具，你可以声明式地定义内容，例如哪些用户应该拥有访问机器的权限，以及应该安装哪些软件。使用这些工具，你可以声明式地定义内容，例如哪些用户应该拥有访问机器的权限，以及应该安装哪些软件。使用这些工具，你可以声明式地定义内容，例如哪些用户应该拥有访问机器的权限，以及应该安装哪些软件。使用这些工具，你可以声明式地定义内容，例如哪些用户应该拥有访问机器的权限，以及应该安装哪些软件。使用这些工具，你可以声明式地定义内容，例如哪些用户应该拥有访问机器的权限，以及应该安装哪些软件。使用这些工具，你可以声明式地定义内容，例如哪些用户应该拥有访问机器的权限，以及应该安装哪些软件。使用这些工具，你可以声明式地定义内容，例如哪些用户应该拥有访问机器的权限，以及应该安装哪些软件。使用这些工具，你可以声明式地定义内容，例如哪些用户应该拥有访问机器的权限，以及应该安装哪些软件。使用这些工具，你可以声明式地定义内容，例如哪些用户应该拥有访问机器的权限，以及应该安装哪些软件。使用这些工具，你可以声明式地定义内容，例如哪些用户应该拥有访问机器的权限，以及应该安装哪些软件。使用这些工具，你可以声明式地定义内容，例如哪些用户应该拥有访问机器的权限，以及应该安装哪些软件。使用这些工具，你可以声明式地定义内容，例如哪些用户应该拥有访问机器的权限，以及应该安装哪些软件。\n\
