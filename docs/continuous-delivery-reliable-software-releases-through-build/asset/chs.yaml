  \   **测试隔离**：组织测试，使得每个测试的数据仅对该测试可见。\n*   **自适应测试**：每个测试都被设计为评估其数据环境，并调整其行为以适应它所看到的数据。\n\
  *   **测试排序**：测试被设计为按已知顺序运行，每个测试在输入上都依赖前一个测试的输出。\n\n通常，我们强烈建议这些方法中的第一种。将测试相互隔离使得它们更加灵活，更重要的是，能够并行运行以优化测试套件的性能。\n\
  \n另外两种方法都是可能的，但根据我们的经验，它们的可扩展性并不好。随着测试套件变得越来越大以及其包含的交互变得越来越复杂，这两种策略往往会导致非常难以检测和纠正的失败。测试之间的交互变得越来越模糊，维护一个运行良好的测试套件的成本开始增加。\n\
  \n#### 测试隔离\n\n测试隔离是一种确保每个单独测试都是原子的策略。也就是说，它不应该依赖其他测试的结果来建立自己的状态，其他测试也不应该以任何方式影响它的成功或失败。这种隔离水平对于提交测试来说相对容易实现，即使是那些测试数据库中数据持久化的测试也是如此。\n\
  \n简单的方法是确保在测试结束时，始终将数据库中的数据恢复到测试运行之前的状态。你可以手动执行此操作，但最简单的方法是依靠大多数 RDBMS 系统的事务性。\n\
  \n对于与数据库相关的测试，我们在测试开始时创建一个事务，在该事务内执行我们所需的所有与数据库的操作和交互，并在测试结束时（无论通过与否）回滚该事务。这利用了数据库系统的事务隔离属性，确保数据库的其他测试或用户不会看到测试所做的更改。\n\
  \n测试隔离的第二种方法是对数据进行某种功能上的分层。这对于提交测试和验收测试来说都是一种有效的策略。对于需要作为结果来修改系统状态的测试，让您在测试中创建的主实体遵循某些测试特定的命名规范，这样每个测试将只查找和看到专门为它创建的数据。我们将在第\
  \ 204 页的“验收测试中的状态”部分更详细地描述这种方法。\n\n通过通过数据划分来寻找合适的测试隔离水平有多容易，很大程度上取决于问题领域。如果您的领域适合，这就是保持测试之间相互独立的极佳且简单的策略。\n\
  \n#### 设置与拆除（Setup and Tear Down）\n\n无论选择何种策略，在测试结束时始终将数据库数据恢复到测试运行之前的状态都是关重要的。你可以手动执行此操作，但最简单的方法是依靠大多数\
  \ RDBMS 系统的事务性。\n\n\n\n\n\n除了提交阶段（commit stage）测试的直接性能保障外，提交测试还是防止系统无意更改的主要防线。这些测试与实现细节越越紧密，它们在履行这一角色的表现就越差。问题在于，当你需要重构系统某个方面的实现时，你希望测试能保护你。如果测试与实现细节的联系得太紧密，你会发现对实现进行微小的更改会导致周围的测试发生巨大的变化。与实现细节过紧耦合的测试不仅不能保护系统行为并促进必要的变更，反而会阻碍变更。如果你被迫为了实现层面的相对较小的改动而对测试进行重大的修改，那么这些测试并没有有效地履行它们作为“行为的可执行规范”的角色。\n\
  \n在介绍关于数据和数据库的章节中，这听起来可能有些抽象，但测试中的紧耦合通常是测试数据过度复杂的结果。\n\n这是持续集成过程带来某些看似无关的积极行为的关键点之一。良好的提交测试会避免复杂的测试数据设置。如果你发现自己正费力为某个特定测试建立数据，这明确表明你的设计需要被更好地分解。你需要将设计拆分为更多的组件，并独立地测试每个组件，使用测试双胞（test\
  \ doubles）来模拟依赖项，正如第 180 页的使用测试双胞节所示。\n\n最有效的测试并不是真正数据驱动的；它们使用最少的测试数据来断言测试单元表现出预期的行为。那些确实需要更复杂的数据来演示预期行为的测试应该仔细地创建数据，并尽可能复用测试辅助类（helpers）或固件（fixtures）来创建，这样系统所支持的数据结构设计的变化就不会对系统的可测试性造成毁灭性的打击。\n\
  \n在我们的项目中，我们经常会隔离创建此类常用数据结构测试实例的代码并在许多不同的测试用例之间共享它们。我们可能会有一个 `CustomerHelper` 或\
  \ `CustomerFixture` 类，它可以简化测试中 `Customer` 对象的创建，以便它们以一致的方式被创建，并为每个 `Customer` 提供一组标准的默认值。每个测试随后可以根据需求定制数据，但它是从一个已知的、一致的状态开始的。\n\
  \n从根本上说，我们的目标是将每个测试的特定数据减少到直接影响测试试图建立的行为的程度。这应该是你编写的每一个测试的目标。\n\n## 验收测试中的数据\n\n\
  与提交测试不同，验收测试是系统测试。这意味着它们的测试数据不可避免更加复杂，如果你想避免测试变得臃肿，就需要更仔细地管理它们。再次，目标是尽可能减少我们的测试对大型复杂数据结构的依赖。这种方法与提交阶段的测试在本质上是相同的：我们的目标是在测试用例的创建中实现复用，并尽可能的减少每个测试对测试数据的依赖。我们应该创建足够的数据来测试系统预期的行为。\n\
  \n在考虑如何为验收测试设置应用程序的状态时，区分三类数据是有帮助的。\n\n1. **测试特定数据（Test-specific data）：** 这是驱动被测行为的数据。它代表了被测试用例的细节。\n\
  2. **测试引用数据（Test reference data）：** 通常有第二类数据与测试相关，但实际上对被测的行为几乎没有影响。它们需要存在那里，但它是配角的一部分，而不是主角。\n\
  3. **应用程序引用数据（Application reference data）：** 通常，存在一些数据与被测的行为无关，但这些数据需要存在以允许应用程序启动。\n\
  \n测试特定数据应该是唯一的，并使用测试隔离策略来确保测试在一个定义良好的环境中开始，且不受其他测试副作用的影响。\n\n测试引用数据可以通过使用预先填充的种子数据（seed\
  \ data）来管理，这些数据在各种测试中被复用以建立测试运行的般环境，但不受测试操作的影响。\n\n应用程序引用数据可以是任何值，甚至是空值，只要所选择的值持续不对测试结果产生影响即可。\n\
  \n应用程序引用数据以及如果适用，测试引用数据——应用程序启动所需的一切——都可以以数据库转储（database dumps）的形式保留。当然，你必须对这些进行版本控制，并确保它们作为应用程序设置的一部分进行迁移。这是测试你的自动化数据库迁移策略的一种有用方法。\n\
  \n这种分类并不是严谨的。在特定测试的语境下，不同类数据之间的边界可能会有些模糊。然而，我们发现这是一个非常有用的工具，可以帮助我们专注于那些需要积极管理以确保我们的测试可靠性的数据，而不是那些仅仅需要存在于那里的数据。\n\
  \n从根本上说，让测试过度依赖于代表整个应用程序的数据“宇宙”是一个错误。能够以某种程度的隔离来考虑每个测试是非常重要的，否则整个测试套件将变得过于脆弱，并在数据发生微小变化时不断失败。\n\
  \n然而，与提交测试不同，我们不建议使用应用程序代码或数据库转储来将应用程序置于正确的初始状态。相反，基于测试的系统级特性，我们建议使用应用程序的 API 将其置于正确状态。\n\
  \n这有几个优势：\n\n* 使用应用程序代码或任何其他绕过应用程序业务逻辑的机制都可能使系统处于不一致的状态。使用应用程序的 API 可以确保应用程序在验收测试期间永远不会处于不一致的状态。\n\
  * 数据库或应用程序本身的重构将对验收测试产生影响，因为根据定义，重构不会改变应用程序 API 的行为。这将使你的验收测试显著不再脆弱。\n* 你的验收测试也将作为对应用程序\
  \ API 的测试。\n\n### 测试数据的类型：示例\n\n考虑测试一个金融交易应用程序。如果某个特定测试侧重于确认在进行交易时用户的位置正确更新，那么起始位置和结束位置对该测试至关重要。\n\
  \n对于在实时数据库环境中运行的一系列有状态的验收测试来说，这可能意味着该测试需要一个已知起始位置的新账户。我们认为账户及其位置是测试特定数据，因此对于验收测试而言，我们可能会注册新账户并为其提供一些资金以允许交易，作为测试用例设置的一部分。\n\
  \n在测试过程中建立预期位置的金融工具或工具是测试的重要贡献者，但可以被视为测试引用数据，因为在连续测试中复用一组工具不会损害我们“位置测试”的结果。这些数据完全可以是预先填充的测试引用数据。\n\
  \n最后，建立新账户所需的细节与位置测试无关，除非它们以某种方式直接影响起始位置或用户位置的计算。因此，对于这些应用程序引用数据，任何默认值即可。\n\n\n\n\
  \n\n# 容量测试中的数据\n\n容量测试在大多数应用程序所需的数据方面面临着规模化问题。这个问题体现在两个方面：能够为测试提供足够数量的输入数据，以及提供合适的参考数据以同时支持许多测试用例。\n\
  \n正如第 9 章“测试非功能性需求”中所描述的那样，我们将容量测试主要视为重新运行验收测试的过程，只不过是同时针对许多用例。如果你的应用程序支持创建订单的概念，我们预计在进行容量测试时，会同时下达大量订单。\n\
  \n我们倾向于使用像交互模板（interaction templates）这样的机制来自动生成这些大量数据（包括输入数据和参考数据），这些机制在第 241 页的“使用录制的交互模板”章节中有更详细的描述。\n\
  \n这种方法实际上允许我们放大创建和管理的数据，以支持验收测试。这种数据复用策略是我们倾向于尽可能广泛应用的，其理由是：我们作为验收测试套件一部分编码的交互，以及与这些交互关联的数据，本质上是系统行为的可执行规范。如果我们的验收测试在这一角色是有效的，它们就捕获了应用程序支持的重要交互。如果它们没有编码我们希望在容量测试中衡量的系统重要行为，那就说明出了问题。\n\
  \n此外，如果我们已经建立了相应的机制和流程，使这些测试随应用程序的时间推移而保持同步，那么在进行容量测试（或者进行任何其他验收后的测试阶段）时，为什么要丢弃所有内容并重新开始呢？\n\
  \n因此，我们的策略是依靠验收测试作为对系统感兴趣交互的记录，然后并将该记录作为后续测试阶段的起点。\n\n对于容量测试，我们使用工具获取与选定验收测试相关的数据并将其扩展到许多不同的“用例”，这样我们就可以根据这一个测试应用许多与系统的交互。\n\
  \n这种测试数据生成方法允许我们将容量测试数据管理的精力集中在核心数据上，即那些数据对于每个单独的交互来说是唯一的。\n\n# 其他测试阶段中的数据\n\n至少在设计哲学层面（即使不是具体的技术方法），我们对所有验收后的自动化测试阶段都采用相同的方法。我们的目标是将自动化验收测试的“行为规范”作为任何关注点非纯功能性测试的起点。\n\
  \n![图像](img/light.jpg)\n\n在创建 Web 应用程序时，我们不仅通过验收测试套件导出容量测试，还推导出兼容性测试。对于兼容性测试，我们在所有流行的\
  \ Web 浏览器上重新运行整个验收测试套件。这并不是详尽的测试——它没有告诉我们任何关于可用性的信息——但如果我们做的更改在某些浏览器中完全破坏了用户界面，它会向我们发出报警。由于我们复用了部署机制和验收测试套件，并使用虚拟机来托管测试，我们执行兼容性测试的能力几乎是免费的——除了运行测试所需的某些\
  \ CPU 时间和磁盘空间成本外。\n\n对于手动测试阶段（例如探索性测试或用户验收测试环境），测试数据有几种方法。一种是运行最小的一组测试和应用程序参考数据，以便应用程序能够在空初始状态启动。然后测试人员可以对用户最初开始使用应用程序时发生的场景进行实验。另一种方法是加载大量数据，以便测试人员可以执行假设应用程序已运行了一段时间的场景。对于集成测试，拥有一个大型数据集也是很有用的。\n\
  \n虽然可以针对这些场景获取生产数据库的备份（dump），但在大多数情况下我们不建议这样做。这主要是因为数据集太大了，以至于难以处理。迁移生产数据集有时需要数小时。尽管如此，在某些情况下，使用生产备份进行测试是很重要的——例如，测试生产数据库的迁移，或者确定生产数据何时需要归档以防止其不当地减慢应用程序。\n\
  \n相反，我们建议根据生产数据的子集，或者在运行了一组自动化验收或容量测试后获取的数据库备份，创建一个用于手动测试的自定义数据集。你甚至可以自定义你的容量测试框架，生成一个代表在一组用户持续使用后应用程序真实状态的数据库。该数据集可以被存储并作为部署到手动测试环境的一部分进行复用。当然，它需要作为此部署过程的一部分进行迁移。有时测试人员会保留几个数据库备份，作为各种类型测试的起点。\n\
  \n这些数据集（包括启动应用程序所需的最小数据集）也应该被开发者在他们的环境中使用。开发者在任何情况下都不应在其环境中使用生产数据集。\n\n## 总结\n\n\
  由于生命周期的原因，数据管理带来了一系列与我们在部署流水线背景下讨论的问题不同的问题。然而，治理数据的基本原理是相同的。关键是确保有一套完全自动的流程来创建和迁移数据库。该过程作为部署过程的一部分，确保其可重复的可靠性。无论是将带有最小数据集的应用程序部署到开发或验收测试环境，还是作为部署到生产的一部分迁移生产数据集，都应该使用相同的流程。\n\
  \n即使有了自动化的数据库迁移过程，仔细管理用于测试的数据仍然很重要。虽然生产数据库的备份可能是一个诱人的起点，但它通常太大，而没有用处。相反，让你的测试去创建它们所需的状态，并确保它们以这种方式执行，使得你的每个测试之间都是相互独立的。即使对于手动测试，也极少数情况下生产备份是最佳起点。测试人员应该根据自己的目的创建和管理较小的数据集。\n\
  \n以下是本章一些重要的原则和实践：\n\n- 对数据库进行版本控制，并使用 `DbDeploy` 等工具管理迁移。\n- 努力保持架构更改的向前向后兼容，以便将数据部署问题与应用程序部署问题分开。\n\
  - 确保测试在设置过程中创建它们所依赖的数据，并对数据进行分区，以确保其不会影响同时运行的其他测试。\n- 将测试之间的共享仅保留用于启动应用程序所需的数据，以及一些非常通用的参考数据。\n\
  - 尽可能使用应用程序的公共 API 为测试设置正确的状态。\n\n\n\n\n当然，这些原则需要根据你的具体情况进行调整。然而，如果它们被作为默认方法，它们将帮助任何软件项目最大限度地减少自动化测试和生产环境中与数据管理相关的最常见问题和故障的影响。\n\
  \n## 第 13 章 管理组件与依赖关系\n\n## 引言\n\n持续交付提供了每天发布多次新的、可运行软件版本的能力。这意味着你必须让应用程序始终处于可发布状态。但如果你正在进行重大重构或添加复杂的新功能，该怎么办？版本控制中的分支策略（Branching）似乎是解决这个问题的方案。然而，我们坚决认为这是错误的答案。本章描述了如何在不断变化的情况下，保持你的应用程序始终处于可发布状态。实现这一点的关键技术之一是大型应用程序的组件化，因此我们将详细讨论组件化，包括构建和管理包含多个组件的大型项目。\n\
  \n什么是组件？这在软件领域中是一个被过度负载的术语，因此我们将尝试尽可能清晰地解释它的含义。当我们谈论组件时，指的是应用程序内部一个相当大的代码结构，它具有定义良好的\
  \ API，并且可能替换为其他实现。基于组件的软件系统的特点是：代码库被分为离散的部分，这些部分通过与其他组件之间定义良好且有限的交互来提供行为。\n\n基于组件系统的对立面是单体系统（monolithic\
  \ system），这种系统在负责不同任务的元素之间没有清晰的边界或职责分离。单体系统通常封装性较差，逻辑上独立的结构之间的紧耦合破坏了迪梅特节律（Law of\
  \ Demeter）。语言和技术并不重要——这与 Visual Basic 或 Java 中的 GUI 控件无关。一些人把组件称为“模块（modules）”。在\
  \ Windows 中，组件通常被封装为 `DLL`。在 UNIX 中，它可能被封装为 `SO` 文件。在 Java 世界中，它可能是一个 `JAR` 文件。\n\
  \n采用基于组件的设计通常被描述为鼓励代码复用和良好的架构特性（如松耦合）。事实确实如此，但它还有另一个重要益处：它是大型开发团队协作最高效的方式之一。在本章中，我们还描述了如何为基于组件的应用程序创建和管理构建系统。\n\
  \n如果你在做一个小型项目，你可能会考虑在读完下一节后跳过这一章（无论项目大小如何，你都应该读这一节）。许多项目对于单个版本控制仓库和简单的部署流水线运行良好。然而，许多项目已经演变成不可维护的代码泥潭，因为在成本低廉时，没有人做出创建离散组件的决定。小型项目转变为大型项目的临界点是流动的，并且会悄悄发生。一旦项目超过了某个阈值，以这种方式更改代码将非常昂贵。很少有项目负责人会有胆量要求团队停止开发足够的时间，以便将大型应用程序重新架构为组件。如何创建和管理组件是我们在本章中将探索的话题。\n\
  \n本章的内容取决于对部署流水线（deployment pipeline）的良好理解。如果你需要复习，请参考第 5 章“部署流水线的解剖”。在本章中，我们还将描述组件如何与分支进行交互。到本章结束，我们将涵盖构建系统中的所有三个自由度：部署流水线、分支和组件。\n\
  \n在开发大型系统时，这三个维度同时发挥作用并不罕见。在这样的系统中，组件形成了一系列依赖关系，这些依赖关系又依赖于外部库。每个组件可能有多个发布分支。要找到每个组件的良好版本，并将它们组装成一个甚至可以编译的系统，是一个极其困难的过程，可能像打地鼠游戏——我们听说过有些项目需要几个月的时间。只有当你完成此后，才能开始让系统通过部署流水线。\n\
  \n这本质上就是持续集成（continuous integration）旨在解决的根本问题。和往常一样，我们提出的解决方案取决于我们希望你现在已经熟悉的最佳实践。\n\
  \n### 保持应用程序的可发布性\n\n持续集成旨在让你对应用程序在功能层面的运行具有高度的信心。部署流水线作为持续持续的扩展，旨在确保你的软件始终是可发布的。但这两项实践都取决于团队在主线（mainline）上进行开发。\n\
  \n在开发过程中，团队不断添加功能，有时需要进行大的架构更改。在这些活动期间，应用程序是不可发布的，尽管它仍然会通过持续集的提交阶段。通常，在发布之前，团队会停止开发新功能并进入稳定阶段，期间仅进行错误修复。当应用程序发布时，会在版本控制中创建一个发布分支，并在主干（trunk）上重新开始开发。然而，这个过程通常会导致发布之间间隔几周或几个月。持续交付的目标是让应用程序始终处于可发布状态。我们如何做到这一点？\n\
  \n方法是在版本控制中创建分支，并在工作完成后进行合并，从而使主线始终可发布。我们在下一章“高级版本控制”中详细研究这种方法。然而，我们认为这种方法是次优的，因为如果工作在分支上进行，应用程序就没有被持续集成。相反，我们主倡每个人都在主线上提交。如何可能每个人都在主线上工作，同时又让你的应用程序始终处于可发布状态？\n\
  \n面对变化，有四种策略可以保持你的应用程序可发布：\n\n-   在新功能完成之前隐藏它。\n-   将所有更改增量地分解为一系列小更改，每个小更改都是可发布的。\n\
  -   使用抽象分支（branch by abstraction）对代码库进行大规模更改。\n-   使用组件来解耦变化速率不同的应用程序部分。\n\n我们在这里讨论前三种策略。这三种策略对于小型项目来说足够了。对于较大的项目，你将需要使用组件，我们将在本章其余部分涵盖这一点。\n\
  \n#### 在新功能完成之前隐藏它\n\n应用程序持续部署的一个常见问题是，一个功能或一组功能可能需要很长时间才能开发完成。如果增量地发布一组功能没有意义，那么人们往往倾向于在版本控制的分支上开始新开发，并在功能就绪后再整合，以免干扰对系统其他部分的开发，从而可能导致其无法发布。\n\
  \n\n\n\n\n一种解决方案是将新功能包含其中，但让用户无法访问。例如，考虑一个提供旅游服务的网站。运行该网站的公司希望提供一项新服务：酒店预订。为了实现这一目标，这项新服务将作为一个独立的组件开始开发，通过独立的\
  \ URI 根路径 `/hotel` 访问。如果需要，该组件仍然与系统的其余部分一起部署——只要不对其入口允许访问即可（这可以通过你的 Web 服务器软件中的配置设置来实现）。\n\
  \n## 增量地替换整个 UI\n\n在 Jez 的一个项目中，开发者开始使用这种方法开发一个新 UI。在开发期间，新 UI 被放置在 URI `/new/`\
  \ 下，且没有创建指向它的链接。当我们开始使用新 UI 的部分功能时，我们从现有的导航中链接到这些部分。这使得我们能够以增量的方式替换整个 UI，同时保持应用程序始终处于运行状态。两个\
  \ UI 共享样式表，因此它们看起来完全一样，尽管它们是使用完全不同的技术实现的；用户除非查看自己的 URI，否则不知道在哪些页面上使用了哪种技术。\n\n另一种确保半完成的组件可以发布但不会被用户访问的方法，是通过配置设置来开启或关闭对它们的访问。例如，在一个富客户端的应用程序中，你可能有两个菜单——一个带有新功能，另一个没有。你使用配置设置在两个菜单之间进行切换。这可以通过命令行选项，也可以通过其他部署时或运行时配置来实现（有关配置软件的更多信息，请参见第\
  \ 2 章，“配置管理”）。在运行自动化测试时，通过运行时配置切换功能的开关（或将其交换为替代实现）也非常有用。\n\n即使是大型组织也是这样开发软件的。我们同事工作的一家世界领先的搜索引擎必须修补\
  \ `Linux` 内核，以便能够接受大量的命令行参数，以开启和关闭他们软件中的各种功能部分。这是一个极端例子，我们不建议保留过多的选项——一旦它们完成了使命，就应该仔细地删掉。可以在代码库中对配置选项进行标记，并将静态分析作为提交阶段的一部分，为该目的提供可用配置选项的列表。\n\
  \n将半完成的功能与你的应用程序的其他部分一起发布是一项良好的实践，这意味着你始终在整合和测试在任何时刻存在的整个系统。这使得规划和交付整个应用程序变得简单得多，因为这意味着依赖关系和集成阶段不需要引入项目计划中。它确保了正在开发的组件从一开始就可以与软件的其他部分一起部署。它意味着你始终对整个应用程序进行回归测试，包括新组件所需的任何新服务或修改过的服务。\n\
  \n以这种方式编写软件需要一定程度的规划、细致的架构设计和严谨的开发。然而，在添加主要功能集的同时能够发布软件新版本的这种收益，通常是值得付出额外努力的。这种替代方案也优于在版本控制中使用分支进行新特性的开发。\n\
  \n## 增量地进行所有更改\n\n上面的故事——将应用程序增量地移动到全新的 UI——只是一个通用策略的特定例子：增量地进行所有更改。在进行重大更改时，人们往往很容易分支源代码并在分支上进行更改。理论是，如果开发者可以进行大型、高层更改并破坏应用程序，然后再将所有内容连接回来，他们就可以移动得更快。然而在实践中，将所有内容连接起来往往是最困难的部分。如果其他团队在此期间也在工作，最后的合并可能会很困难——更改越大，难度就越高。表面上分支的理由越充分，你就越不应该分支。\n\
  \n即使在执行过程中，将重大更改转化为一系列微小的增量更改是一项艰巨的工作，但它意味着你正在解决在执行过程中保持应用程序运行的问题，防止了最后的痛苦。它也意味着如果你需要，可以随时停止，从而避免在完成一个重大更改的一半后不得不放弃它所涉及的沉没成本。\n\
  \n分析在能够将重大更改分解为一系列小更改方面起着重要作用。在许多方面，投入其中的思维过程与将需求拆分解为更小任务的思维过程是相同的。你随后所做的是将任务转换为一组更小的增量更改。这种额外的分析通常会导致更少的错误和更有针对性的更改——而且，当然，如果你增量地进行更改，你就可以边做边总结，并决定如何（实际上是否）继续。\n\
  \n然而，有时某些更改是难以以增量方式完成的。在这种情况下，你应该考虑使用抽象分支（branching by abstraction）。\n\n## 抽象分支\n\
  \n这种模式是在需要对应用程序进行大规模更改时使用分支的替代方案。与其使用分支，不如是在要更改的部分之上创建一个抽象层。然后与现有实现并行创建一个新实现，当它完成时，移除原始实现和（可选的）抽象层。\n\
  \n## 创建抽象层\n\n创建抽象层通常是很困难的。例如，在 Windows 桌面 VB 应用程序中，应用程序的所有逻辑包含在事件处理程序中的是非常常见的。为这样的应用程序创建抽象层涉及为逻辑构建一个面向对象的设计，并通过将现有代码从事件处理程序中重构到一组\
  \ `VB`（或可能是 `C#`）类中来实现它。新的 UI（可能是一个 Web UI）随后将重用新的逻辑。请注意，不需要为逻辑实现创建接口——只有当你想要对逻辑执行抽象分支时，才需要这样做。\n\
  \n一种不会在最后移除抽象层的例子是，你希望系统用户能够选择自己的实现。在这种情况下，你本质上是在设计插件 API。诸如 Eclipse 中使用的 `OSGi`\
  \ 等工具可以简化使用 `Java` 团队的流程。根据我们的经验，在项目开始时预先创建插件 API 更好。相反，先创建第一个实现，然后是第二个，从这些实现中提取出\
  \ API。随着你添加更多的实现以及这些实现中更多的功能，你会发现你的 API 变化很快。如果你计划将其公开以允许他人开发插件，你将希望等待它稳定。\n\n尽管这种模式被我们的同事\
  \ Paul Hammant [aE2eP9] 命名为“抽象分支”，但它实际上是使用分支对应用程序进行大规模更改的替代方案。当应用程序的部分需要无法作为一系列小型增量步骤实现的更改时，请执行以下操作：\n\
  \n1. 在你需要更改的部分之上创建一个抽象。\n2. 重构系统的其余部分以使用抽象层。\n3. 创建一个新的实现，在完成之前它不属于生产代码路径。\n4. 更新你的抽象层以委托到你的新实现。\n\
  \n\n\n\n5. 移除旧的实现。\n6. 如果抽象层不再适用，则移除抽象层。\n\n## 抽象分支 (Branch by Abstraction)\n\n\
  抽象分支是使用分支或一次性实现复杂更改的替代方案。它允许团队在进行持续集成的同时继续开发应用程序，同时在主线线上替换应用程序的大部分内容。如果代码库的某部分需要更改，你首先找到该部分的入口点——一个“缝隙”（seam）——并置入一个委托给当前实现的抽象层。然后，你与旧实现并行开发新的实现。使用哪种实现由配置选项决定，该选项可以在部署时甚至运行时进行修改。\n\
  \n![Image](img/light.jpg)\n\n你可以在非常高的层次进行抽象分支，例如替换整个持久化层。你也可以在非常低的层次进行——例如使用策略模式将一个类替换另一个类。依赖注入是另一种实现抽象分支的机制。其中的诀窍在于找到或创建允许你插入抽象层的缝隙。\n\
  \n这也是一个作为策略部分的优秀模式，用于将使用“泥球模式”（ball of mud pattern）的单体代码库转换为更模块化、结构更好的形式。取代码库中你想作为组件分离或重写的部分。只要你能够管理该代码库部分的入口点（例如使用外观模式），你就可以局限这些混乱，并使用抽象分支在保持旧代码使应用程序运行的同时，创建该功能的新、模块化版本。这种策略有时被称为“扫到地毯下”或“波特达姆幻庄”\
  \ [ayTS3J]。\n\n抽象分支最困难的两个部分是隔离目标代码库部分的入口点，以及管理对开发中功能需要进行的任何更改（可能作为修复 Bug 的一部分）。然而，这些问题比使用分支时要容易管理得多。尽管如此，有时在代码库中找到一个好的缝隙实在太难了，分支是唯一的解决方案。使用分支让你的代码库达到一个可以执行抽象分支的状态。\n\
  \n对应用程序进行大规模更改（无论是通过抽象分支还是任何其他技术）都极大地受益于全面的自动化验收测试套件。当应用程序的大部分内容被更改时，单元测试和组件测试的粒度远不足以保护你的业务功能。\n\
  \n## 依赖 (Dependencies)\n\n当一个软件为了构建或运行而依赖于另一个软件时，就会产生依赖。在任何非微不足道的应用程序中，都会存在某些依赖。大多数软件应用程序至少对其主机操作系统环境有依赖。Java\
  \ 应用程序依赖 `JVM`，它提供了 Java SE API 的实现；.NET 应用程序依赖 `CLR`；Rails 应用程序依赖 Ruby 和 Rails\
  \ 框架；C 应用程序依赖 C 标准库，依此类推。\n\n在本章中，有两个特别有用的区分：组件（components）与库（libraries）的区别，以及构建时依赖与运行时依赖的区别。\n\
  \n我们通过这种方式区分组件和库：**库**是指你的团队不控制的软件包，除了选择使用哪一个之外。库通常更新频率很。相比之下，**组件**是你的应用程序所依赖的软件部分，但它们由你的团队或组织中的其他团队开发。组件通常更新频繁。这种区分非常重要，因为在设计构建过程时，处理组件需要考虑的因素比处理库多。例如，你是在单一步中编译整个应用程序，还是在每个组件更改时独立地编译它？你如何管理组件之间的依赖关系以避免循环依赖？\n\
  \n构建时依赖与运行时依赖的区别如下：构建时依赖在你的应用程序被编译和链接（如果需要）时必须存在；运行时依赖在应用程序运行执行其通常功能时必须存在。这种区别对于几个原因非常重要。首先，在你的部署流水中，你将使用许多与部署的应用程序副本无关的不同软件，例如单元测试框架、验收测试框架、构建脚本框架等。其次，应用程序在运行时使用的库版本可能与它在构建时使用的版本不同。在\
  \ C 和 C++ 中，你的构建时依赖仅仅是头文件，而在运行时，你需要一个以动态链接库（`DLL`）或共享库（`SO`）形式存在的二进制文件。但你也可以在其他编译语言中执行类似的操作，例如针对仅包含系统接口的\
  \ `JAR` 进行构建，并针对包含完整实现的 `JAR` 进行运行（例如在使用 J2EE 应用程序服务器时）。这些考虑也需要纳入你的构建系统中。\n\n管理依赖可能是困难的。我们将从概述运行时发生在库中常见的常见的依赖问题开始。\n\
  \n### 依赖地狱 (Dependency Hell)\n\n依赖管理中最著名的问题被称为“依赖地狱”，有时通俗地称为“DLL 地狱”。依赖地狱发生于应用程序依赖于某个特定版本，但在部署时使用了不同的版本，或者根本没有该版本的情况。\n\
  \nDLL 地狱是早期版本 Microsoft Windows 中非常常见的问题。所有以 `DLLs` 形式存在的共享库都存储在系统目录（`windows\\\
  system32`）中，且没有任何版本控制——新版本直接覆盖旧版本。此外，在 XP 之前的 Windows 版本中，COM 类表是一个单例，因此需要特定 COM\
  \ 对象的应用程序将获得第一个加载的版本。3 这意味着不同的应用程序无法依赖不同版本的 `DLL`，甚至无法知道在运行时会获得哪个版本。\n\n.NET 框架的引入通过引入“程序集”（assemblies）的概念解决了\
  \ DLL 地狱问题。经过加密签名的程序集可以被赋予版本号，允许相同库的不同版本被区分开，Windows 将它们存储在全局程序集缓存（称为“GAC”）中，即使文件名相同，它也可以区分库的不同版本。现在，你可以为应用程序提供多个不同版本的库。使用\
  \ GAC 的优势在于，如果需要发布关键错误或安全修复，你可以一次更新所有使用受影响 `DLL` 的应用程序。然而，.NET 也支持 `DLL` 的“xcopy\
  \ 部署”，即将它们保留在应用程序相同的目录中，而不是 GAC 中。\n\n\n\n\n# 依赖管理概述\n\nLinux 通过使用简单的命名规范来避免“依赖地狱”：它在全局库目录\
  \ (`/usr/lib`) 中的每个 `.so` 文件后都附加一个整数，并使用软链接来确定标准的系统级版本。这样，管理员就可以轻松地更改应用程序所使用的版本。如果一个应用程序依赖于特定版本，它会请求带有相应版本号的文件。当然，拥有一个库的标准的系统级版本意味着要确保每个安装的应用程序都能与该版本兼容。针对这个问题有两种答案：从源码编译每个应用程序（`Gentoo`\
  \ 采用的方法），或者对每个应用程序的二进制文件进行精细的回归测试（大多数 Linux 发行版创建者的首选）。这意味着，如果没有复杂的依赖管理工具，你无法随心所欲地安装依赖于新版本系统库的应用程序新二进制发行版。幸运的是，这种工具以\
  \ `Debian` 软件包管理系统的形式存在——这可能是世界上最优秀的依赖管理工具，也是 Debian 成为如此稳健的平台、以及 Ubuntu 能够每年发布两次稳定版本的主要原因。\n\
  \n解决操作系统级依赖问题的简单答案是审慎地应用静态编译。这意味着对你的应用程序至关重要的依赖会在编译时汇总到一个单一汇文件中，因此运行时依赖很少。然而，尽管这使得部署变得简单，但它也有一些缺点。除了会生成大型二进制文件外，它还将生成的二进制文件与特定版本的操作系统紧密耦合，并无法通过操作系统更新来修复漏洞或安全问题。因此，通常不建议使用静态编译。\n\
  \n对于动态语言，对应的方法是将应用程序所依赖的任何框架或库一并发布。`Rails` 采用了这种方法，允许整个 `Rails` 框架与使用它的应用程序一起发布。这意味着你可以同时运行多个\
  \ `Rails` 应用程序，每个程序使用不同版本的框架。\n\nJava 由于其类加载器的设计，在运行时依赖方面面临着特别严重的问题。原始设计防止了同一个 `JVM`\
  \ 中出现多个版本的同一个类。这种限制通过 `OSGi` 框架得到了克服，它提供了多版本类加载以及热部署和自动更新功能。如果不使用 `OSGi`，限制仍然存在，这意味着必须在构建时仔细管理依赖。一种常见但令人不快的场景是应用程序依赖于两个库（在这种情况下是\
  \ `JAR` 文件），每个库都依赖于同一个底层库（例如日志库），但版本不同。应用程序可能会通过编译，但在运行时几乎肯定会失败，要么抛出 `ClassNotFound`\
  \ 异常（如果所需的方法或类不存在），要么出现细微的错误。这个问题被称为钻石依赖问题。\n\n我们将在本章稍后讨论钻石依赖问题的解决方案，以及另一个病态情况——循环依赖。\n\
  \n## 管理库\n\n在软件项目中，管理库有两种合理的方法。一种是将它们提交到版本控制中。另一种是声明它们，并使用如 `Maven` 或 `Ivy` 之类的工具从\
  \ Internet 仓库或（优选）你组织自己的制品存储库下载库。你需要强制的关键约束是构建是可重复的——也就是说说，如果我从版本控制中检出项目并运行自动化构建，我可以保证将获得与项目其他其他成员完全相同的二进制文件，并且在三个月后，当我需要调试由运行旧版本软件的用户报告的问题时，我可以创建出完全相同的二进制文件。\n\
  \n将库提交到版本控制是最简单的解决方案，对于小型项目来说效果良好。传统上，会在项目根目录下创建一个 `lib` 目录来存放库。我们建议额外添加三个子目录：`build`、`test`\
  \ 和 `run`——分别用于构建时、测试和运行时依赖。我们还建议对库使用包含版本号的命名规范。所以，不要只将 `nunit.dll` 提交到 `lib` 目录——要提交\
  \ `nunit-2.5.5.dll`。这样，你就能确切知道正在使用哪些版本，并且很容易判断是否已经更新到最新、最强大的版本。这种方法的用处是，构建应用程序所需的所有内容都在版本控制中——一旦你有了项目存储库的本地检出，你就知道可以重复地构建出其他人拥有的相同包。\n\
  \n![图像](img/light.jpg)\n\n将整个工具链提交进来是一个好主意，因为这代表了你项目的构建时依赖。然而，你应该将其提交到与项目其他部分不同的存储库，因为你的工具链存储库很容易变得非常大。你应该防止项目存储库变得过大，以至于执行常用的仓库操作（如查看本地更改和将小更改提交到中央仓库）需要超过几秒钟。另一种替代方案是将你的工具链保留在共享的网络附属存储器上。\n\
  \n提交库存在一些问题。首先，随着时间的推移，你提交的库存储库可能会变得庞大且陈旧，可能很难知道这些库中哪些仍被你的应用程序使用。如果你的项目必须与同一平台上的其他项目运行，就会出现另一个问题。某些平台可以处理使用同一库多个版本的项目，而另一些平台（例如没有\
  \ `OSGi` 的 `JVM` 或 `Ruby Gems`）则不允许使用同一库的多个版本。在这种情况下，你需要小心地与其他项目使用相同的库版本。跨项目手动管理传递性依赖会迅速变得痛苦。\n\
  \n`Maven` 和 `Ivy` 提供了自动的依赖管理方法，它们允许你在项目配置中准确声明你需要的库的各个版本。然后这些工具会下载你所需的库的相应版本，传递式地解析对其他项目的依赖（如果适用），并确保项目依赖图中不存在不一致之处（例如，两个组件需要互不兼容的公共库版本）。这些工具会将项目所需的库缓存在本地机器上，因此虽然在第一次在新机器上运行项目时构建可能需要很长时间，但随后的构建不会比你将库提交到版本控制中更慢。`Maven`\
  \ 的问题在于，为了获得可重复的构建，你必须配置它使用特定版本的插件，并确保指定项目每个依赖项的确切版本。本章稍后将更多关于使用 `Maven` 进行依赖管理的介绍。\n\
  \n使用依赖管理工具的另一项重要实践是管理你自己的制品存储库。开源制品存储库包括 `Artifactory` 和 `Nexus`。这有助于确保构建是重复的，并通过控制组织内项目可用的每个库的版本来防止依赖地狱。这种做法也使得审计库变得容易得多，并防止违反法律限制，例如在\
  \ `BSD` 许可软件中使用 `GPL` 许可的库。\n\n\n\n\n\n如果 `Maven` 和 `Ivy` 不切适用，你也可以通过创建一个简单的属性文件来构建自己的声明式依赖管理系统，该文件指定了项目依赖的库以及这些库的版本。然后你可以编写一个脚本，从组织的制品仓库中下载这些库的正确版本——这可以简单到只使用备份的文件系统并以前以一个简单的\
  \ Web 服务。当然，如果你需要处理更复杂的问题（例如解析传递依赖），你将需要更强大的解决方案。\n\n## 组件\n\n几乎所有现代软件系统都由一组组件组成。这些组件可能是\
  \ `DLLs`、`JAR` 文件、`OSGi bundles`、`Perl modules` 或其他内容。组件在软件行业已经有很长的历史。然而，研究如何将它们组装成可部署的产物，以及如何实现一个考虑到组件间相互作用的部署流水线，是一项非凡的任务。这种复杂性带来的结果通常是：构建需要数小时才能组装出一个可部署、可测试的应用程序。\n\
  \n大多数应用程序最初都是单个组件。有些则从二或三个组件开始（例如，客户端-服务器应用程序）。那么，为什么要将代码库拆分成组件，又该如何管理它们之间的关系呢？除非有效地管理这些关系，否则可能会损害它们作为持续集成系统部分的能力。\n\
  \n### 如何将代码库拆分为组件\n\n在软件中，“组件”的概念是大多数人在看到它时就能识别的，但它有许多不同的、往往是模糊的定义。在引言部分，我们已经为了本章的目的粗略定义了组件的含义，但组件还有其他一些属性是大多数人都会认同的。一个相当没有争议的陈述可能是这样的：“组件是可重用的、可以与实现相同\
  \ `API` 的其他东西替换的是可以独立部署的，并且封装了系统的一组连贯的行为和职责。”\n\n显然，原则上，单个类可以具有这些特征——但通常情况下并非如此。组件需要独立部署的要求意味着类通常不符合这一条件。虽然没有什么阻止我们对单个类进行打包以便部署，但在大多数情况下，在这种细粒度上，与打包相关的开销并没有意义。此外，类通常成簇工作，一小组类类紧密协作以提供有用的行为，并且相对来说，它们与其紧密协作者的耦合更紧密。\n\
  \n从这里我们可以假设，构成组件存在某种下限。一个组件在被视为应用程序的独立部分之前，应该具有某种程度的复杂性。那么上限呢？我们将系统拆分为组件的目的是提高团队的效率。组件之所以让软件开发过程更高效，有几几个原因：\n\
  \n1. 它们将问题划分为更小、更具表现力的块。\n2. 组件通常代表了系统不同部分变化速率的差异，并具有不同的生命周期。\n3. 它们鼓励我们通过清晰职责划分来设计和维护软件，这反过来限制了更改的影响，并使得理解和更改代码库变得更容易。\n\
  4. 它们可以为我们优化构建和部署过程提供额外的自由度。\n\n大多数组件的一个显著特征是它们暴露了某种形式的 `API`。该 `API` 的技术基础可以通过不同的方式提供：动态链接、静态链接、Web\
  \ 服务、文件交换、消息交换等。`API` 的性质可能有所不同，但它的重要性在于，它代表了与外部协作者的信息交换——因此，该组件与这些协作者的耦合程度变得至关重要。即使组件的接口是一个文件格式或消息模式，它仍然代表了信息上的耦合，这反过来又要求考虑组件之间的依赖关系。\n\
  \n组件之间在接口和行为方面的耦合程度，当它们在构建和部署过程中被分离并作为独立单元处理时，增加了复杂性。\n\n以下是从代码库中分离出组件的一些良好理由：\n\
  \n1. 你的代码库部分需要独立部署（例如，服务器或富客户端）。\n2. 你想将单体代码库转换为一个核心和一组插件，也许是为了用替代实现替换系统的某些部分，或者为了提供用户扩展性。\n\
  3. 该组件为另一个系统提供接口（例如，提供 `API` 的框架或服务）。\n4. 编译和链接代码花费了太长时间。\n5. 在开发环境中打开项目花费了太长时间。\n\
  6. 你的代码库太大，一个团队无法处理。\n\n尽管列表中的最后三项听起来相当主观，但它们是提取组件的完全合理的理由。最后一点尤为关键。当团队由大约十个人组成，并且他们深入理解代码库的某个特定部分（无论是功能组件还是其他边界）时，效果最好。如果你需要十个人以上来按你所需的速度进行开发，一种非常有效的方法是将系统拆分为松散耦合的组件，并同样拆分团队。\n\
  \n我们不建议让团队负责单个组件。这是因为在大多数情况下，需求并不是沿着组件边界划分的。根据我们的经验，端到端开发功能的跨职能团队要有效得多。虽然每个组件配备一个团队似乎更高效，但事实并非如此。\n\
  \n首先，要孤立地为单个组件编写和测试需求通常是困难的，因为实现某项功能通常会触及多个组件。如果你按组件对团队分组，那么你就需要两个或多个团队协作来完成一个功能，这自动引入了巨额且不必要的通信成本。此外，以组件为中心的团队中的成员倾向于形成孤岛并进行局部优化，从而失去对项目整体最佳利益做出判断的能力。\n\
  \n更好的做法是拆分团队，让每个团队承担一个故事流（可能都具有一个共同主题），并为了完成工作而触碰他们需要的任何组件。拥有实现业务级功能特权、并能够自由更改他们所需的任何组件的团队要效率高得多。按功能区域而不是组件来组织团队，确保每个人都有权更改代码库的任何部分，定期在团队之间轮换，并确保团队之间有良好的沟通。\n\
  \n这种方法的另一个益处是，让所有组件协同工作是每个人的责任，而不仅仅是集成团队的责任。如果每个组件一个团队，一个更严重的危险之一是，应用程序在项目结束之前将无法工作，因为没有人动力去集成这些组件。\n\
  \n\n\n\n上述列表中的第四和第五点原因通常是设计不佳且模块化不足的症状。良好的代码库遵循“不要重复自己”（DRY）原则，并由遵守德梅特法则（Law of\
  \ Demeter）的封装良好的对象组成，这通常更高效、更易维护，并且在需要时更容易拆分为组件。然而，构建过程的缓慢也可能是过度激进的组件化导致的。这在 `.NET`\
  \ 世界中似乎尤为常见，那里有些人喜欢在没有理由的情况下在解决方案中创建大量项目。这样做不可避免会导致编译速度变得如蜗爬。\n\n除了上述讨论的良好设计考虑外，对于如何将应用程序组织成组件集合，并没有硬性规定。然而，存在两种常见的失败模式：“处处是组件”和“一个统治一切的组件”。经验表明，这两种极端都是不合适的，但判断边界在哪里对于任何经验水平的开发者和架构师来说，仍然是一个主观的判断。这是让软件设计既是一门工程学科，又是一门艺术、工艺和社会科学的众多因素之一。\n\
  \n### 使用组件并不意味着使用分层架构\n\nSun 在引入 `J2EE` 框架时普及了分层架构的思想。微软继续通过 `.NET` 框架将其作为最佳实践呈现。Ruby\
  \ on Rails 可以说在鼓励类似的架构方法，同时它显然让让上手变得简单得多，并对你的系统施加了更多限制。分层架构通常是解决某些问题的良好方法，但并不适用于所有问题。\n\
  \n在我们看来，分层架构通常被用作防御性设计的形式。它可以帮助防止大型且缺乏经验的团队创建一个紧耦合的“泥球” [aHiFnc]。它还具有广为人知的容量和可扩展性特征。然而，它通常不是许多问题的优化解决方案（当然，这对于所有技术和模式都是如此）。特别值得注意的是，拥有多个运行在物理隔离环境的层级会在响应任何特定请求时引入高延迟。这反过来往往会导致引入难以维护和调试的复杂缓存策略。在高性能环境中，事件驱动或分布式\
  \ Actor 模型架构可以提供更优的性能。\n\n我们遇到的一个大型项目的架构师曾规定架构中必须恰好有七层。很多时候，其中一层或多层是冗余的。然而，仍然必须引入所需的类，并且对每个方法的调用都必须记录日志。不用说，由于大量的无意义日志条目，该应用程序很难调试。由于大量的冗余代码，它很难理解；由于层之间的依赖关系，它很难修改。\n\
  \n使用组件并不强制要求使用分层架构。这意味着通过寻找有助于这种分离的合理抽象，将逻辑分离到封装模块中。分层是有用的——即使是多层分层——但它不是组件化开发的同义词。\n\
  \n在光谱的另一端，如果组件并不自动意味着分层，那么分层也不应该自动定义组件。如果你使用分层架构，不要为每一层创建一个组件。你几乎应该在一个层内拥有几个组件，而且确实可能存在被多个层使用的组件。基于组件的设计与分层是正交的。\n\
  \n### 康威律\n\n最后，值得注意的是康威律（Conway’s Law），该定律指出：“设计系统的组织……受限于，只能产生与其组织通信结构相拷贝的设计。”因此，例如，开发者仅通过电子邮件通信的开源项目往往具有很高的模块化且接口很少。由一个同地办公的小团队开发的产品倾向于紧耦合且不模块化。注意你如何建立你的开发团队——它将影响你应用程序的架构。\n\
  \n如果你的代码库已经是大型且单体的，将其拆解为组件的一种方法是使用抽象分支（branching by abstraction），正如本章早期描述。\n\n####\
  \ 组件流水线化\n\n即使你的应用程序由几个组件组成，也不意味着你需要为每个组件准备一个单独的构建。事实上，最简单的方法也是一种可以扩展到惊人程度的方法是为整个应用程序设置一条单一流水线。每当提交更改时，所有内容都会进行构建和测试。在大多数情况下，我们建议将系统作为一个整体构建，直到获取反馈的过程变得太慢为止。正如我们所说的，如果你遵循本书中的建议，你可能会发现通过这种方式可以构建出异常巨大且复杂的系统。这种方法的优点是极易追踪是哪行代码破坏了构建。\n\
  \n然而，从现实来看，有很多情况受益于将系统拆分为几个不同的流水线。以下是设置独立流水线的合理示例：\n\n- 应用程序中具有不同生命周期的部分（可能你作为应用程序的一部分构建了自己的操作系统内核，但你每几周只需要一次）。\n\
  - 由不同的（可能是分布式的）团队维护的应用程序功能区域区域可能有特定特定组件。\n- 使用不同技术或构建过程的组件。\n- 被多个其他项目使用的共享组件。\n\
  - 相对稳定且不频繁更改的组件。\n- 构建应用程序耗时过长，为每个组件创建构建会更快（但注意，这种情况变为真实的点比大多数人认为的要晚得多）。\n\n从构建和部署过程的角度来看，重要的是，基于组件的构建管理总会有额外的开销。为了将单个构建转变为多个，你需要为每个构建创建一个构建系统。这意味着对于每个独立的部署流水线都需要新的目录结构和构建文件，每个流水线都应该遵循与整个系统相同的模式。这意味着每个构建的目录结构应该包含单元测试、验收测试、它依赖的库、构建脚本、配置信息以及你通常放入项目版本控制的任何内容。每个组件或组件集的构建都应该有自己的流水线，以证明其适用于发布。该流水线将执行以下步骤：\n\
  \n- 编译代码（如有必要）。\n- 组可以部署到任何环境的二进制文件。\n- 运行单元测试。\n- 运行验收测试。\n- 在适当的情况下支持手动测试。\n\n\
  该过程与整个系统一样，确保了你尽早获取反馈，并验证每次更改的可行性。\n\n\n\n当二进制文件通过了它们自身的微型发布流程后，就可以准备提升到集成构建了（更多内容将在下一节中介绍）。你需要将二进制文件发布到制品库中，并附带一些元数据，以标识创建该二进制文件的源码版本。现代\
  \ CI 服务器应该能够为你完成这些，尽管如果你想自己操作，也可以简单地将二进制文件存储在与生成它的流水线标签同名的目录中。另一种方案是使用 `Artifactory`、`Nexus`\
  \ 或其他制品库软件。\n\n请注意，我们绝不是在说你应该为每一个 `DLL` 或 `JAR` 都创建一个流水线。这就是为什么我们在上面反复谨慎地表述“组件或一组组件”。一个组件可能由多个二进制文件组成。总的来说，指导原则应该是尽可能减少你所操作的构建次数。一个好于两个，两个好于三个，以此此类推。在转向并行流水线方法之前，请尽可能长时间持续优化构建并提高其效率。\n\
  \n## 集成流水线\n\n图 13.1 集成流水线\n\n![Image](img/fig13_1.jpg)\n\n集成流水线以构成系统的每个组件的二进制输出作为起点。集成流水线的第一个阶段应该通过组合适当的二进制集合，创建一个适用于部署的包（或多个包）。第二阶段应该将生成的应用程序部署到类生产环境，并对其运行烟雾测试（smoke\
  \ tests），以尽早指示任何基本的集成问题。如果此阶段成功，流水线应移动到传统的验收测试阶段，以通常的方式运行整个应用程序验收测试。然后是适用于应用程序的正常阶段序列，如图\
  \ 13.1 所示。\n\n在创建集成流水线时，需要记住部署流水线的两个通用原则：对快速反馈的需求，以及为所有相关方提供构建状态可视性的需求。长长的流水线或流水线链会损害反馈。如果你发现自己处于这种境地，并且有足够的硬件，一种解决方案是在二进制文件创建完成且单元测试通过后立即触发下游流水线。\n\
  \n在可见性方面，如果集成流水线的任何阶段失败，应该能够确切看到失败的原因。这意味着，能够从集成构建追溯到贡献该构建的每个组件版本是关键的。如果你希望能够发现导致故障的源码更改，那么维护这些关系至关重要。现代\
  \ CI 工具应该能够为你完成这些工作，如果你的工具不能，请找一个可以的工具。追踪集成流水线失败的原因不应超过几秒钟。\n\n同样意味着，单个组件的“绿色”（通过）构建在与组成整个应用程序的其他组件结合时，并不意味着实际上是好的。因此，负责组件的团队应该能够看到他们的组件的哪些版本最终进入了绿色的集成流水线（从而可以被认为是集成良好的）。只有这些版本的组件才是真正“绿色”的。集成流水线形成是每个独立组件流水线的扩展。因此，可见性在两个方向上都很重要。\n\
  \n如果在两次集成流水线运行之间有多个组件发生了变化，那么它可能会在很长一段时间内都处于故障状态。这是一个问题，因为这使得你更难找到哪次更改破坏了你的应用程序，因为自上一个良好的应用程序版本以来会有如此多的更改。\n\
  \n有几种不同的技术可以解决这个问题，我们将在本章的剩余部分进行探讨。最简单的方法是构建组件良好版本的每种可能的组合。如果你的组件并不频繁更改，或者你的构建网格上有足够的计算能力，你就可以这样做。这是最好的方法，因为由于不涉及任何人工干预或复杂的算法，而且与执行取证的人类相比，计算能力最终是廉价的。所以，如果可以，请这样做。\n\
  \n次优方法是尽可能构建多个版本的应用程序。你可以使用相对简单的调度算法来实现，该算法获取每个组件的最新版本并尽可能地组装你的应用程序。如果此操作足够快，你可以对应用程序的每个版本运行简短的烟雾测试套件。如果你的烟雾测试运行需要一些时间，它们可能只会对应用程序的每三个版本运行一次。\n\
  \n然后你可以通过某些手动方式选择一组给定的组件版本并说：“组装这些并用它们创建一个集成流水线的实例，”某些 CI 工具提供了这种功能。\n\n## 管理依赖图\n\
  \n对依赖项（包括库和组件）进行版本控制至关重要。如果你不对依赖项进行版本控制，将无法重现构建。这意味着，当你的应用程序由于依赖项的更改而崩溃时，你将无法追溯并找到导致故障的更改，或者找不到库的上一个“良好”版本。\n\
  \n在上一节中，我们讨论了一组组件，每个组件都有自己的流水线，并馈到一个集成流水线，该流水线组装应用程序并在最终应用程序上运行自动和手动测试。然而，情况通常并不那么简单：组件可能依赖于其他组件，包括第三方库。如果你画出组件之间的依赖关系，它应该是一个有向无环图（DAG）。如果不是如此（特别是，如果你的图中有循环），你就面临了病态依赖问题，我们稍后会解决。\n\
  \n### 构建依赖图\n\n图 13.2 依赖图\n\n![Image](img/fig13_2.jpg)\n\n首先，考虑我们如何构建依赖图是重要的。考虑图\
  \ 13.2 所示的组件集。投资组合应用程序依赖于定价引擎、结算引擎和报告引擎。这些引擎反过来都依赖于框架。定价引擎依赖于由（现在陷入困境的）第三方提供的信用违约换（CDS）库。通常，我们将图中靠左侧的组件称为“上游”依赖，将图中靠右侧的组件称为“下游”依赖。因此，定价引擎有两个上游依赖（CDS\
  \ 定价库和框架）和一个下游依赖（投资组合应用程序）。\n\n每个组件都应该有自己的流水线，由该组件源码的更改或任何上游依赖项的更改触发。下游依赖将在该组件通过其所有自动化测试后触发。在构建此组件图方面，有几种可能的考虑场景：\n\
  \n1. *对投资组合应用程序进行了更改*。在这种情况下，只需要重新构建投资组合应用程序。\n\n2. *对报告引擎进行了更改*。在这种情况下，必须重新构建报告引擎并通过其所有自动化测试。然后需要重新构建投资组合应用程序，使用新的报告引擎版本以及定价和结算引擎的当前版本。\n\
  \n\n\n\n### 3. CDS 定价库发生了更改\nCDS 定价库是一个第三方二进制依赖。因此，如果正在使用的 `CDS` 版本进行了更新，则需要针对新版本和当前的框架版本对定价引擎进行重新构建。这反过来应该触发投资管理应用程序的重新构建。\n\
  \n### 4. 框架发生了更改\n如果框架的更改成功了（意味着框架流水线通过了其测试），则其直接下游依赖项应该被重新构建：报告引擎、定价引擎和结算引擎。如果这三个依赖项都通过了测试，那么应该使用这三个上游依赖的新版本来重新构建投资管理应用程序。如果这三个中间组件的构建中任何一个失败，则不应重新构建投资管理应用程序，且这些框架组件应被视为损坏。必须修复框架，以便其三个下游依赖项都能通过测试，这反过来又会导致投资管理应用程序通过测试。\n\
  \n从这个例子中可以得出一个重要的观察结果。在考虑场景 4 时，似乎投资管理应用程序的上游依赖项之间存在某种“与（and）”的关系。然而，事实并非如此——如果报告引擎的源码发生了更改，无论定价引擎或结算引擎是否重新构建，它都应该触发投资管理应用程序的重新构建。此外，考虑以下场景。\n\
  \n### 5. 框架和定价引擎都发生了更改\n在这种情况下，整个图谱都需要重新构建。但有几种可能的结果，每种结果都有自己的考虑因素。理想路径是三个中间组件都在新版本的框架和\
  \ `CDS` 定价库下通过了测试。但如果结算引擎失败了呢？显然，投资管理应用程序不应该针对新的（但损坏的）框架版本进行构建。然而，你可能希望投资管理应用程序使用新版本的定价引擎进行构建，而（关键点是）它应该针对新版本的\
  \ `CDS` 定价库和旧的（已知的）框架版本进行构建。当然，现在你遇到麻烦了，因为并不存在这样的定价库版本。\n\n这些场景最重要的约束是，投资管理应用程序应该只针对一个版本的框架进行构建。我们特别不希望出现（例如）定价引擎针对一个版本的框架构建，而结算引擎针对另一个版本的框架构建的情况。这就是经典的“钻石依赖（diamond\
  \ dependency）”问题——它是在本章稍之前讨论的运行时“依赖地狱”问题在构建时的类比。\n\n#### 依赖图的流水线化\n\n图 13.3 组件流水线\n\
  \n![Image](img/fig13_3.jpg)\n\n那么，我们如何根据上述描述的项目结构来构建部署流水线呢？流水线的关键要素是，团队必须对任何损坏尽可能快速地反馈，并且我们应该遵守上述描述的构建依赖的规则。我们的方法如图\
  \ 13.3 所示。\n\n有两个值得注意的重要特征。首先，为了提高反馈速度，一旦每个项目流水线的提交（commit）阶段完成，就会触发依赖项目。你不需要等待验收测试通过——只需等待下游项目所依赖的二进制文件创建。这些文件随后被存储在你的制品仓库中。当然，验收测试和各种部署阶段将重用这些二进制文件（为了防止图表混乱，图中未显示）。\n\
  \n所有的触发器都是自动的，部署到手动测试环境和生产环境的情况除外，这些通常是手动授权的。这些自动触发器确保了每当（例如）框架发生更改时，都会触发定价引擎、结算引擎和报告引擎的构建。如果这三个在\
  \ във版本框架下都成功构建，投资管理应用程序将使用所有上游组件的新版本进行重新构建。\n\n图 13.4 可视化上游依赖\n\n![Image](img/fig13_4.jpg)\n\
  \n团队能够追踪进入应用程序特定构建的组件来源至关重要。一个良好的 CI 工具不仅能做到这一点，还能向你展示哪些版本的组件成功集成在了一起。例如在图 13.4\
  \ 中，你可以看到投资管理应用程序的 `2.0.63` 版本是使用定价引擎的 `1.0.217` 版本、结算引擎的 `2.0.11` 版本、报告引擎的 `1.5.5`\
  \ 版本以及框架的 `1.3.2396` 版本构建的。\n\n图 13.5 可视化下游依赖\n\n![Image](img/fig13_5.jpg)\n\n图\
  \ 13.5 显示了使用选框架版本（`1.3.2394`）构建的所有下游组件。你的 CI 工具还应该确保在整个流水线中使用一致的组件版本。它应该防止依赖地狱，并确保版本控制中影响多个组件的更改仅通过流水线传播一次。\n\
  \n我们在本初给出的关于增量开发的建议建议也适用于组件。以增量的方式进行更改，且不要破坏你的依赖关系。当你添加新功能时，在发生更改的组件中为其提供一个新的 API\
  \ 入口。如果你想废弃旧功能，请使用静态分析作为流水线的一部分，来检测是谁在使用这些旧 API。如果你的任何更改不小心破坏了任何依赖关系，流水线应该快速通知你。\n\
  \n图 13.6 组件分支\n\n![Image](img/fig13_6.jpg)\n\n如果你确实需要对组件进行影响深远的更改，可以为它创建一个新版本。在图\
  \ 13.6 中，我们假设报告引擎的团队需要创建一个破坏某些 API 的版本。为了实现这一点，他们为 `1.0` 版本创建一个分支，并在主分支（mainline）上开始开发\
  \ `1.1`。报告引擎团队将继续在主分支上添加新功能。与此同时，报告引擎的下游用户可以继续使用从 `1.0` 分支创建的二进制文件。如果他们需要修复漏洞，可以将修复程序提交到\
  \ `1.0` 分支并合并到主分支。一旦下游用户准备好使用新版本，他们就可以切换。\n\n#### 我们何时应该触发构建？\n\n上述讨论的所有示例都假设每当上游依赖发生任何更改时，我们都会触发新的构建。这是正确的做法，但在许多团队中并非常态——相反，他们倾向于在代码库稳定后才更新依赖，也许在集成时或开发达到某个其他里程碑时。这种行为强调了稳定性，但代价是增加了花费大量时间进行集成的风险。\n\
  \n\n\n\n可以看出，在涉及依赖关系的开发过程中存在着一种紧张关系。一方面，最好跟上上游依赖的最新版本，以确保你拥有最新的功能和错误修复。另一方面，集成每个依赖项的最新版本是有成本的，因为你可能会花费所有时间来修复由这些新版本导致的破坏。大多数团队会采取折中方案，在每次发布后对所有依赖项进行刷新，此时更新的风险较低。\n\
  \n在决定更新依赖项的频率时，一个关键的考虑因素是你对这些依赖项新版本的信任程度。如果你有几个组件依赖于由你团队开发的同一个组件，你通常可以非常快速简单地修复由\
  \ API 更改引起的破坏，因此频繁集成是最好的。如果组件足够小，最好为整个应用程序构建一个单一的构建——这可以提供最快的反馈。\n\n如果上游依赖项是由你组织内的另一个团队开发的，那么最好让这些组件在它们各自的流水线中独立构建。这样，你就可以在这些上游组件每次更改时，决定是否采用最新版本，还是固定在特定版本。这个决定取决于它们更改的频率，以及负责这些组件的团队解决问题的速度。\n\
  \n你对组件更改的控制、可见性和影响力越小，你对它的信任就越低，接受新版本时的态度就越应该保守。例如，如果没有明显的需要，就不要盲目地接受第三方库的更新。如果更改没有修复你所面临的问题，就不要不管更新，除非你正在使用的版本不再受支持。\n\
  \n在大多数情况下，团队在集成新版本依赖项方面越趋向于持续端效果越好。当然，持续更新所有依赖项在资源消耗（包括硬件和构建）以及修复错误和处理集成“未完成”组件版本产生的问题方面，成本更高。\n\
  \n你需要在“获得关于应用程序是否能够集成的快速反馈”与“拥有不断向你发送你并不关心的破坏信息的过度活跃构建”之间取得平衡。一个潜在的解决方案是 Alex Chaffee\
  \ 在其论文 [d6tguh] 中描述的“谨慎乐观”。\n\n### 谨慎乐观\n\nChaffee 的提议是在依赖关系图中引入一种新状态——某个特定的上游依赖是“静态的（static）”、“受保护的（guarded）”还是“流体的（fluid）”。静态上游依赖的更改不会触发新构建。流体上游依赖的更改总是触发新构建。如果“流体”上游依赖的更改触发了构建且构建失败，则上游依赖被标记为“受保护的”，并且组件被固定在上游依赖的已知良好版本。“受保护的”上游依赖的行为类似于静态的——它不接受新更改——但它的作用是提醒开发团队，上游依赖中存在需要解决的问题。\n\
  \n实际上，我们显式地表达了自己的偏好，即我们不希望持续从哪些依赖项获取更新。我们还确保了应用程序始终是“绿色的”的——我们的构建系统会自动回退由于上游依赖的糟糕新版本导致的任何破坏。\n\
  \n图 13.7 谨慎乐观触发\n\n![Image](img/fig13_7.jpg)\n\n让我们看看依赖关系图的一部分，如图 13.7 所示。我们为 CDS\
  \ 定价库与定价引擎之间的依赖关系分配一个流体触发器，并为框架与定价引擎之间的依赖关系分配一个静态触发器。\n\n考虑 CDS 定价库和框架都更新的情况。框架的新版本被忽略了，因为定价引擎和框架之间的触发器是静态的。然而，CDS\
  \ 定价库的新版本将触发定价引擎的新新构建，因为它的触发器被设置为流体。如果定价引擎的这个新构建失败了，触发器将设置为受保护的，对 CDS 定价库的进一步更改将不会触发它的新构建。如果构建通过了，触发器保持为流体。\n\
  \n然而，谨慎乐观可能会导致复杂的行为。让我们将框架与定价引擎之间的触发器也设置为流体，就像 CDS 定价库一样。在 CDS 定价库和框架都更新的情况下，定价引擎将产生一次新构建。如果定价引擎崩溃了，你并不知道是什么破坏了构建——是\
  \ CDS 定价库的新版本还是框架的新版本。你不得不尝试找到是哪一个——在此期间，你的两个触发器都会变成受保护的。\n\nChaffee 提到了一种名为“知情悲观（informed\
  \ pessimism）”的策略，作为任何依赖跟踪算法实现的起点。在这种策略中，每个触发器都被设置为“静态的”，但当下游依赖项的开发者在其上游依赖的新版本可用时，会收到通知。\n\
  \n* * *\n\n### 用于管理依赖的 Apache Gump\n\nApache Gump 可能是 Java 世界上第一个依赖管理工具。它创建于 Apache\
  \ Java 项目的早期，当时所有不同的工具（Xerces, Xalan, Ant, Avalon, Cocoon 等）都依赖于彼此的特定版本。开发这些工具的开发者需要一种方法来选择使用这些依赖项的哪些版本，以便他们能够运行一个良好的应用程序版本，他们是通过类路径操作（classpath\
  \ manipulation）来实现的。Gump 的创建是为了自动化生成控制构建时使用的类路径的脚本，以便开发者可以尝试不同版本的依赖项以找到一个良好的构建。尽管这需要你花费大量时间对构建进行参数化，但对这些项目的构建稳定性做出了重大贡献。你可以在\
  \ [9CpgMi] 了解更多关于 Gump 的历史——这是一篇简短而有趣的文章。\n\nGump 的过时恰在此时许多 Java 项目中使用的组件变成了标准 Java\
  \ API 的一部分，而像 Ant 和 Commons 组件等其他变得了向后兼容，因此在大多数情况下你不需要安装多个版本。这本身教导了一个宝贵的教训：保持依赖图浅层，并尽可能确保向后兼容——正如在本节中描述的，在构建时对组件图进行激进回归测试将帮助你实现这一点。\n\
  \n* * *\n\n### 循环依赖\n\n可能最棘手的依赖问题是循环依赖。这发生在依赖关系图中包含循环时。最简单的例子是你有一个组件 A，它依赖于另一个组件\
  \ B。不幸的是，组件 B 反过来又依赖于组件 A。\n\n这似乎会导致致命的引导问题。为了构建组件 A，我需要构建组件 B，但为了构建组件 B，我需要组件 A，以此此类推。\n\
  \n图 13.8 循环依赖构建阶梯\n\n![Image](img/fig13_8.jpg)\n\n\n\n令人惊讶的是，我们见过一些在构建系统中存在循环依赖的成功项目。你可能对我们在这种情况下对“成功”的定义有异，但生产环境中确实有可以运行的代码，这对我们来说就足够了。关键点在于，你永远不会在项目初期就引入循环依赖——它们往往是后期才渗透进去的。虽然可以避免但不建议这样做，但只要存在一个版本的组件\
  \ `A` 可以用来构建组件 `B`，那么度过这个问题是可行的。然后，你可以使用 `B` 的新版本来构建 `A` 的新版本。这导致了某种“构建梯子”，如图[图\
  \ 13.8](#ch13.html_ch13fig8）所示。\n\n在运行时，只要组件 `A` 和 `B` 能够共同可用，就没有问题。\n\n正如我们所说的，我们不建议使用循环依赖。但如果你确实遇到了一个难以规避的循环依赖，那么上述策略是可以行行的。没有任何构建系统原生支持这种配置，因此你必须通过“黑科技”（hack）你的工具链来支持它。你还需要在构建部分之间的交互上倍加小心：如果每个组件都自动触发其依赖的构建，那么这两个组件将因为循环引用而永远构建下去。始终尝试消除循环依赖；但如果你发现自己正工作在一个具有循环依赖的代码库中，请不要绝望——你可以使用构建梯子作为临时变通方案，直到你能消除这个问题为止。\n\
  \n### 管理二进制文件\n\n我们花费了大量时间讨论如何组织拆分为组件的软件的构建。我们描述了如何为每个组件创建流水线、当组件更改时触发下游组件流水线的策略，以及如何对组件进行分支处理。然而，我们还没有讨论在基于组件的构建中如何管理二进制文件。这很重要，因为在大多数情况下，组件之间应该是二进制级依赖，而不是源码级依赖。接下来的几页将讨论这个主题。\n\
  \n首先，我们将讨论制品存储库运行背后的通用原理。然后，我们将描述如何仅使用文件系统来管理二进制文件。在下一节中，我们将描述如何使用 `Maven` 来管理依赖。\n\
  \n你不需要自己构建一个制品存储库。市场上上有多种产品，包括开源项目 `Artifactory` 和 `Nexus`。一些工具，如 `AntHill Pro`\
  \ 和 `Go` 也包含了了自己的制品存储库。\n\n#### 制品存储库应该如何工作\n\n制品存储库最重要的属性是：它不应该包含任何无法重现的内容。你应该能够删除你的制品存储库，而不必担心无法找回任何价值的内容。为了实现这一点，你的版本控制系统需要包含重现任何给定二进制文件所需的所有，包括自动化构建脚本。\n\
  \n之所以需要删除制品是因为它们很大（如果现在还不是很大，将来也会变大）。最终，你需要删除它们来释放空间。出于这个原因，我们不建议将制品提交到版本控制中。如果你能重新创建它们，你本来就不需要它们了。当然，保留那些通过了所有测试并成为发布候选的制品是值得的。任何已发布的制品也值得保留，以防你需要回滚到那个较早的版本，或者支持某些使用你软件旧版本的人。\n\
  \n无论你保留制品多久，都应该始终保留每个制品的哈希值（hash），以便你可以验证任何给定二进制文件的来源。这对于审计目的非常重要——例如，如果你不确定具体哪个应用部署在特定的环境中。应该能够获取任何给定二进制文件的\
  \ `MD5`，并用它查找具体是使用了源码控制中的哪一个修订版本创建的。你可以使用构建系统来存储这些数据（某些 CI 服务器会为你完成），或者使用你的版本控制系统。无论何种方式，管理哈希都是你的配置管理策略的重要部分。\n\
  \n最简单的制品存储库是磁盘上的目录结构。通常，这个目录结构会位于 `RAID` 或 `SAN` 上，因为虽然制品应该是易弃的，但你应该是决定它们可以被删除的人，而不是某个表现不佳的硬件。\n\
  \n该目录结构最重要的限制是：它应该能够让你将二进制文件与创建它的源码控制版本关联起来。通常，你的构建系统会为运行的每次构建生成一个标签（label），通常是一个序列号。标签应该很短，以便于他人交流。它可以包含用于创建它的版本控制修订版本标识符（假设你没有使用像\
  \ `Git` 或 `Mercurial` 这种使用哈希作为标识符的工具）。该标签可以包含在二进制文件的清单中（例如 `JARs` 或 `.NET` 程序）。\n\
  \n为每个流水线创建一个目录，并在其中为每个构建编号创建一个目录。构建的所有制品就可以存储在该目录中。\n\n复杂程度的下一个小进步是添加一个简单的索引文件，允许你为每次构建关联一个状态，这样你就可以记录每个更改在通过部署流水线时的状态。\n\
  \n如果你不想为制品存储库使用共享驱动器，可以添加一个 Web 服务来存储和检索制品。然而，如果你已经到了这一步，你应该考虑使用市场上许多免费或商业产品之一。\n\
  \n#### 你的部署流水线应该如何与制品存储库交互\n\n你的部署流水线实现需要两件事：将构建过程生成的制品存储到制品存储库中，然后检索它们供以后使用。\n\n\
  考虑一个具有以下阶段的流水线：`compile`编译、`unit test`单元测试、`acceptance test`验收测试、`manual acceptance\
  \ test`人工验收测试和 `production`生产环境。\n\n- `compile` 阶段将创建需要放入制品存储库的二进制文件。\n- `unit test`\
  \ 和 `acceptance test` 阶段将检索这些二进制文件，对它们运行单元测试，并将单元测试生成的报告存储在制品存储库中，以便开发者查看结果。\n-\
  \ `user acceptance test` 阶段将获取二进制文件并将其部署到 `UAT` 环境进行手动测试。\n- `release` 阶段将获取二进制文件并发布给用户或将其部署到生产环境。\n\
  \n随着发布候选通过此流水线，每个阶段的成功或失败都会记录在索引中。后续流水线阶段可以依赖此文件中的状态，因此只有通过验收测试的二进制文件才能供手动测试和后续阶段使用。\n\
  \n将制品进出制品存储库有几种选择。你可以将其存储在共享文件系统中，该系统从你需要构建或部署的每个环境都可以访问。你的部署脚本就可以引用该文件系统的路径。或者，你可以使用像\
  \ `Nexus` 或 `Artifactory` 的解决方案。\n\n### 使用 Maven 管理依赖\n\n`Maven` 是一个用于 Java 项目的可扩展构建管理工具。特别地，它提供了一种复杂的依赖管理机制。即使你不喜欢\
  \ `Maven` 的其他部分，也可以以独立的方式使用其强大的依赖管理功能。或者，你可以使用 `Ivy`，它只解决依赖管理问题，而不包含 `Maven` 的其他构建管理工具链。如果你不使用\
  \ Java，通常可以跳过这一节，除非你对 `Maven` 如何解决依赖管理问题感兴趣。\n\n\n\n正如之前讨论的，项目有两种依赖类型：对外部库的依赖（我们在第\
  \ 354 页的“管理库”部分中讨论过）以及你的应用程序组件之间的依赖。Maven 提供了一种抽象，让你能够以多或少相同的方式处理这两者。所有的 Maven 领域对象（如项目、依赖和插件）都通过一组坐标来标识：`groupId`、`artifactId`\
  \ 和 `version`，这些坐标共同起来必须唯一标识一个对象（这些轴有时被称为 `GAV`），以及打包类型（packaging）。这些通常以以下格式编写，这也是您在\
  \ Buildr 中声明它们的方式：`groupId:artifactId:packaging:version`。例如，如果你的项目依赖于 Commons Collections\
  \ 3.2，你可以这样描述该依赖：`commons-collections:commons-collections:jar:3.2`。\n\nMaven 社区维护了一个镜像仓库，其中包含了大量的常用开源库及其相关的元数据（包括传递性依赖）。这些仓库几乎包含了你在几乎任何项目中可能需要的每一个开源库。你可以在网页浏览器中访问\
  \ [`repo1.maven.org/maven2`](http://repo1.maven.org/maven2) 来浏览此仓库。在 Maven 仓库中声明某个库的依赖将导致\
  \ Maven 在你构建项目时为你下载它。\n\n你使用名为 `pom.xml` 的文件在 Maven 中如下声明项目：\n\n![Image](img/p0376-01.jpg)\n\
  \n在构建项目时，这会将 3.8.1 版本的 JUnit 和 3.2 版本的 Commons Collections 获取到你的本地 Maven 构制品仓库：`~/.m2/repository/<groupId>/<artifactId>/<version>/`。本地\
  \ Maven 构制品仓库有两个用途：它是你项目依赖的缓存，也是 Maven 存储你项目生成的构制品的地方（稍后会介绍）。注意，你还可以指定依赖的范围（scope）：`test`\
  \ 意味着依赖仅在测试编译和组装期间可用。其他有效的范围包括：`runtime`（用于编译不需要的依赖，适用于编译时需要但在运行时提供的库）以及 `compile`（默认值，用于编译时和运行时都需要的依赖）。\n\
  \n你还可以还可以指定版本范围，例如 `1.0,2.0)`，它将给你 1.x 系列中的任何版本。方括号表示排他限定符，中方括号表示包含限定符。你可以省略左侧或右侧——所以\
  \ `[2.0,)` 意味着任何高于 2.0 的版本。然而，即使你想让 Maven 在选择版本时有一定的灵活性，指定一个上限也是个好主意，以避免你的项目引入可能破坏应用程序的新主版本修订。\n\
  \n该项目还会创建自己的构制品：一个 JAR 文件，它将存储在你在 `pom` 中指定的坐标所在的本地仓库中。在上面的示例中，运行 `mvn install`\
  \ 将在你的本地 Maven 构制品仓库中创建以下目录：`~/.m2/repository/com/continuousdelivery/parent/1.0.0/`。由于我们选择了打包类型\
  \ JAR，Maven 将你的代码打包成一个名为 `parent-1.0.0.jar` 的 JAR 并将其安装到此目录。现在，我们在本地运行的任何项目都可以通过指定其坐标作为依赖来访问此\
  \ JAR。Maven 还会将你项目的修改版 `pom` 安装到同一目录中，其中包含了其依赖的信息，以便 Maven 能够正确处理传递性依赖。\n\n通常你可能并不希望在每次运行\
  \ `mvn install` 时都覆盖你的构制品。为了实现这一点，Maven 提供了快照构建（snapshot builds）的概念。只需在版本后附加 `-SNAPSHOT`（在上面的示例中，它将是\
  \ `1.0.0-SNAPSHOT`）。然后，当你运行 `mvn install` 时， Maven 将在版本号目录的位置创建一个格式为 `version-yyyymmdd-hhmmss-n`\
  \ 的目录。消费你快照的项目只需要指定 `1.0.0-SNAPSHOT` 而不是完整的时间戳，并将获得本地仓库中的最新版本。[([6)\n\n然而，你应该谨慎使用快照，因为这可能会让重现构建变得困难。更好的主意是让你的\
  \ CI 服务器生成每个依赖的标准版本，使用构建标签作为构制品版本号的一部分，并将这些版本存储在你们组织的中央构制品仓库中。然后，你可以在你的 `pom` 文件中使用\
  \ Maven 的版本限定符来指定一个可接受的版本范围。如果你确实需要在本地机器上进行一些探索性工作，可以随时编辑你的 `pom` 定义来临时启用快照。\n\n\
  在这一节中，我们只接触了 Maven 的冰角。特别是，我们还没有讨论管理你自己的 Maven 仓库，如果你想跨组织管理依赖，或者管理多模块项目（这是 Maven\
  \ 创建组件化构建的方式），这一点非常。虽然这些是重要的课题，但它们超出了本章能够合理涵盖的范围。如果你对更高级的 Maven 技术感兴趣，我们推荐你咨询 Sonatype\
  \ 编写、O’Reilly 出版的优秀书籍 *Maven: The Definitive Guide*。同时，我们确实想涵盖你可以在 Maven 中执行的一些基础依赖重构。\n\
  \n### Maven 依赖重构\n\n假设你有一组被多个项目使用的依赖。如果你只想定义一次要使用的构制品版本，可以通过定义一个父项目来实现，该父项目包含了要使用的每个构制品的版本。只需采用上面提供的\
  \ POM 定义，并将 `<dependencies>` 封装在 `<dependencyManagement>` 中。然后你可以像这样定义一个子项目：\n\n\
  ![Image](img/p0378-01.jpg)\n\n这将使用父项目中定义的这些依赖的版本——注意 `junit` 和 `commons-collections`\
  \ 的引用没有指定版本。\n\n你还可以重构你的 Maven 构建以消除公共依赖的重复。与其创建一个 JAR 作为最终产品，你可以让一个 Maven 项目创建一个\
  \ pom，然后由其他项目引用。在第一个代码列表（artifactId 为 `parent`）中，你需要将 `<packaging>` 的值从 `jar` 改为\
  \ `pom`。你可以在任何想要使用相同依赖的项目中声明依赖此 pom：\n\n![Image](img/p0378-02.jpg)\n\nMaven 一个非常实用的功能是它可以分析项目的依赖，并告诉你未声明的依赖和未使用的声明依赖。只需使用\
  \ `mvn dependency:analyze` 运行此报告。有关使用 Maven 管理依赖的更多信息请参阅 [cxy9dm]。\n\n## 总结\n\n\
  在本章中，我们讨论了各种技术，以确保你的团队能够尽可能地开发，同时保持应用程序始终处于可发布状态。一如既往，原则是确保团队对其更改对应用程序发布就绪的影响获得快速反馈。实现这一目标的一种策略是确保每次更改都拆分为微小的、增量的步骤，并提交到主分支。\n\
  \n\n\n\n将应用程序划分为一组松耦合、高封装且协作的组件，这不仅是一种良好的设计。在处理大型系统时，它能让实现更高效的协作和更快的反馈。在你的应用程序变得足够大之前，没有必要单独构建组件——简单的方法是建立一个单一流水线，在第一阶段就一次性构建整个应用程序。如果你专注于高效的提交构建和快速的单元测试，并为验收测试实现构建网格（build\
  \ grids），你的项目可以增长到超出你想象的程度。一个多达 20 人、全职工作几年的团队，通常不需要创建多个构建流水线，尽管当然，他们仍然应该将应用程序拆分为组件。\n\
  \n然而，一旦超过了这些限制，使用组件、基于依赖的构建流水线以及有效的构物管理是实现高效交付和快速反馈的关键。本章描述的方法之妙之处在于，它建立在已经非常有益的组件化设计基础之上。这种方法避免了复杂的分支策略，这种策略通常会导致应用程序集成出现严重问题。然而，它确实依赖于一个设计良好且便于组件化构建的应用程序。遗憾的是，我们见过太多无法通过这种方式轻松实现组件化的大型应用程序了。很难迫使这样的应用程序进入易于修改和集成的状态。因此，请确保有效利用你的技术工具链来编写代码，以便这些代码在变得足够大时，可以作为一组独立的组件进行构建。\n\
  \n# 第 14 章：高级版本控制\n\n## 引言\n\n版本控制系统（也称为源码控制和修订控制系统）设计用于允许组织维护其应用程序的每项更改的完整历史，包括源代码、文档、数据库定义、构建脚本、测试等。然而，它们还具有另一个重要目的：它们让团队能够协作处理应用程序的不同部分，同时维护一个记录系统——即应用程序的最终代码库。\n\
  \n一旦你的团队规模超过了几个开发人员，要让许多人全职在同一个版本控制仓库上工作就变得困难了。人们会不小心破坏对方的功能，并且通常会互相“踩脚”。因此，本章的目标是研究团队如何利用版本控制进行高效工作。\n\
  \n我们将先从一段简短的历史开始，然后直接进入版本控制中最具争议的话题：分支与合并。接着，我们将讨论一些可以避免传统工具某些问题的现代范式：基于流的修订控制和分布式修订控制。最后，我们将提供一套处理分支的模式——或者在某些情况下是避免分支的方法。\n\
  \n我们在本章中花大量时间讨论分支和合并。所以，让我们花点时间思考它是如何融入我们讨论了这么多部署流水线的。部署流水线是一种以受控方式将代码从提交移动到生产的范式。然而，它只是大型软件系统中你可以操作的三个自由度之一。本章和上一章处理了另外两个维度：分支和依赖。\n\
  \n对代码进行分支有三个理由。首先，可以为发布应用程序的新版本创建一个分支。这允许开发人员继续开发新功能，而不影响稳定的公共发布。当发现 Bug 时，首先在相关的公共发布分支中修复，然后将更改应用到主线。发布分支永远不会合并回主线。其次，当你需要对新功能进行原型开发（spike）或重构时；原型分支会被丢弃，且永远不会合并。最后，当你需要对应用程序进行一项大更改，而上一章描述的任何方法都无法实现时，创建一个短生命分支是可以接受的——如果你的代码库结构良好，这种情况极其罕见。该分支的唯一目的是让代码库达到某种状态，以便能够增量或通过抽象分支（branch\
  \ by abstraction）进行进一步更改。\n\n### 修订控制的简史\n\n所有版本控制系统的鼻祖是 `SCCS`，由 Marc J. Rochkind\
  \ 于 1972 年在贝尔实验室编写。从它演化出了大多数久负盛名的开源源版本控制系统，且它们目前仍在在使用：`RCS`、`CVS` 和 `Subversion`。当然，市场上还有许多商业工具，每种工具都有其独特的帮助软件开发者管理协作的方法。其中流行的是\
  \ `Perforce`、`StarTeam`、`ClearCase`、`AccuRev` 和 `Microsoft Team Foundation System`。\n\
  \n修订控制系统的进化并没有放缓，目前存在一种向分布式版本控制系统发展的有趣趋势。`DVCSs` 的创建是为了支持大型开源团队的工作模式，例如 Linux 内核开发团队。我们将在后面的章节介绍分布式版本控制系统。\n\
  \n由于 `SCCS` 和 `RCS` 如今很少被使用，我们不会在这里讨论它们；专门的版本控制发烧友可以在网上找到大量信息。\n\n#### CVS\n\n`CVS`\
  \ 代表 Concurrent Versions System（并发版本系统）。在此语境下，“并发”意味着多个开发人员可以同时在同一个仓库上工作。`CVS` 是一个构建在\
  \ `RCS` 之上的开源封装器，提供了额外的功能，如客户端/服务器架构以及更强大的分支和标记功能。它最初由 Dick Grune 于 1984–1985 年编写，并于\
  \ 1986 年作为一组 shell 脚本发布，1988 年由 Brian Berliner 将其转换为 C 语言。多年来，`CVS` 是世界上最知名、最流行的版本控制系统，主要是因为它是免费的\
  \ VCS。\n\n`CVS` 为版本控制和软件开发过程带来了许多创新。其中最重要的可能是：`CVS` 的默认行为是不锁定文件（因此称为“并发”）——事实上，这是开发\
  \ `CVS` 的主要动力。\n\n尽管有了创新，`CVS` 许多许多问题，其中一些源于它继承了 `RCS` 的按文件更改跟踪系统。\n\n- 在 `CVS`\
  \ 中分支涉及将每个文件复制到仓库的副本中。如果你的仓库很大，这可能会花费很长时间并占用大量磁盘空间。\n- 由于分支是副本，从一个分支合并到另一个分支时会产生许多幻影冲突，并且无法合并一个分支中的新添加文件。虽然有变通方法，但既耗时又容易出错，而且非常糟糕。\n\
  - 在 `CVS` 中标记（tagging）涉及接触仓库中的每个文件——这是在大型仓库中另一个耗时的过程。\n- `CVS` 的提交不是原子的。这意味着如果你的提交过程被中断，你的仓库将处于中间状态。同样，如果两个人尝试同时提交，双方的更改可能会交织在一起。这使得很难查看谁更改了什么，或者回滚某组更改。\n\
  - 重命名文件不是一个等公民操作：你必须删除旧文件并添加新文件，并在此过程中丢失修订历史。\n- 设置和维护仓库是一项辛苦的工作。\n- 二进制文件在 `CVS`\
  \ 中只是二进制块（blobs）。它没有尝试管理二进制文件的更改，因此磁盘使用率效率低下。\n\n#### Subversion\n\n\n\n\n\n# Subversion\
  \ (SVN)\n\nSubversion (SVN) 的设计目标是成为“更好的 CVS”。它修复了 CVS 的许多问题，并且在任何情况下通常都可以作为 CVS\
  \ 的优越替代品。它的设计初衷是让 CVS 用户能够快速上手，并保留了本质上相同的命令结构。这种熟悉感帮助 Subversion 在应用软件开发中迅速取代了 CVS。\n\
  \nSVN 的许多优点源于放弃了 SCCS、RCS 及其衍生版本通用的格式。在 SCCS 和 RCS 中，文件是版本控制的单位：仓库中每个提交（check in）的文件都有对应的文件。而在\
  \ SVN 中，版本控制的单位是 `revision`（修订版本），它包含了一组目录中文件的一系列更改。你可以将每个修订版本理解为当时仓库中所有文件的快照。除了描述文件的更改外，增量（deltas）还可以包含复制和删除文件的指令。在\
  \ SVN 中，每次 `commit`（提交）都会原子化地应用所有更改并创建一个新的 `revision`。\n\n![Image](img/light.jpg)\n\
  \nSubversion 提供了一种名为“externals”（外部属性）的功能，允许你将远程仓库挂载到本地仓库的指定目录。如果你的代码依赖于其他代码库，这个功能非常有用。Git\
  \ 提供了类似的名为“submodules”（子模块）的功能。这提供了一种简单且廉价的方法来管理系统中组件之间的依赖，同时保持每个组件一个仓库。你还可以使用这种方法将源代码和任何大型二进制文件（编译器、工具链的其他部分、外部依赖）分离到不同的仓库中，同时让用户看到它们之间的链接。\n\
  \n## 仓库模型\n\nSubversion 仓库模型最重要的特征之一是，修订版本号适用于整个仓库，而不是单个文件。你不再能谈论某个特定文件从版本 1 移动到版本\
  \ 2 了。相反，你想要知道当仓库从版本 1 变为版本 2 时，某个特定文件发生了什么。Subversion 处理目录、文件属性和元数据的方式与处理文件相同，这意味着对这些对象的更改可以像对文件的更改一样进行版本控制。\n\
  \n## 分支与标签\n\nSubversion 的分支（Branching）和标签（Tagging）也得到了改进。Subversion 不再更新每个单独文件，而是利用了其写时复制（copy-on-write）仓库的速度和简单性。按照惯例，每个\
  \ Subversion 仓库都有三个子目录：`trunk`（主干）、`tags`（标签）和 `branches`（分支）。创建一个分支，只需在 `branches`\
  \ 目录下创建一个分支命名的目录，并将你想要分支的修订版本的 `trunk` 内容复制到你新创建的分支目录中。\n\n因此，你刚刚创建的分支只是指向 `trunk`\
  \ 所指向的同一组对象的指针——直到分支和主干开始分叉。结果是在 Subversion 中，创建分支几乎是常数时间操作。标签的处理方式完全相同，只是它们存储在名为\
  \ `tags` 的目录下。Subversion 不区分标签和分支，因此它们之间的区别仅仅是一种惯例。如果你愿意，可以在 Subversion 中将已标记的修订版本视为分支。\n\
  \nSubversion 还通过在本地保留每个文件在你最后一次从中央仓库检出（check out）时的版本副本，从而改进了 CVS。这意味着许多操作（例如，检查你在工作副本中更改了什么）可以在本地完成，比在\
  \ CVS 快得多。它们甚至可以在中央仓库不可用时进行，这使得在离线状态继续工作成为可能。\n\n## 客户端-服务器局限性\n\n然而，客户端-服务器模型仍然让某些事情变得困难：\n\
  \n- 你只能在在线时提交更改。这听起来可能显而易见，但分布式版本控制系统的主要优势之一在于，提交（check in）与将更改发送到另一个仓库是分离的操作。\n\
  - SVN 用于跟踪本地客户端更改的数据存储在仓库每个文件夹的 `.svn` 目录中。你可以将本地系统上的不同目录更新到不同的修订版本，甚至是不同的标签或分支。虽然这可能是符合要求的，但在某些情况下可能会导致混淆甚至错误。\n\
  - 虽然服务器操作是原子的，但客户端操作不是。如果客户端更新被中断，工作副本可能会处于不一致的状态。通常情况下，这相当容易修复，但在某些情况下，有必要删除整个子树并重新检出。\n\
  - 修订版本号在给定的仓库中是唯一的，但在不同仓库之间并不是全局唯一的。这意味着，例如，如果仓库由于某种原因被拆分成更小的仓库，新仓库中的修订版本号与旧版本没有任何关系。虽然这听起来像件小事，但它意味着\
  \ SVN 仓库不支持分布式版本控制系统的某些功能。\n\nSubversion 确实代表了相对于 CVS 的巨大进步。较新版本的 Subversion 具有合并跟踪（merge\
  \ tracking）等功能，使其在功能丰富性上接近 Perforce 等商业工具，尽管在性能和扩展性上可能如此。然而，与 Git 和 Mercurial 等新型分布式版本控制系统相比，它开始显示出受其最初“做一个更好的\
  \ CVS”这一初衷所带来的局限性。正如 Linus Torvalds 著名的说法：“没有任何方法可以正确地使用 CVS。”尽管如此，如果你能接受中心式版本控制系统的局限性，Subversion\
  \ 对你来说可能足够了。\n\n## 商业版本控制系统\n\n软件工具的世界变化非常快，所以本节可能会过时。请查看 [`continuousdelivery.com`](http://continuousdelivery.com)\
  \ 获取最新信息。编写此时，我们能够全心推荐的唯一商业 VCS 有：\n\n- `Perforce`：卓越的性能、扩展性和极好的工具支持。Perforce 被一些真正巨大的软件开发组织使用。\n\
  - `AccuRev`：提供类似于 ClearCase 的流开发能力，但没有了致命性的管理开销和糟糕性能。\n- `BitKeeper`：第一个真正的分布式版本控制系统，且是唯一的商业系统。\n\
  \n微软的 Team Foundation Server (`TFS`) 如果你使用 Visual Studio，可能是你的默认选择——其紧密集成可能是它唯一的区别。否则，没有好理由使用它的版本控制功能，因为它本质上是\
  \ Perforce 的劣质仿品。Subversion 完胜于 TFS。我们强烈建议尽可能避免 ClearCase、StarTeam 和 PVCS。任何仍在使用\
  \ Visual SourceSafe 的人应立即迁移到一种不会在许多情况下损坏数据库（这是版本控制系统中的大忌）的工具。为了方便的迁移路径，我们建议使用 SourceGear\
  \ 的优秀产品 Vault（TFS 也提供了方便的迁移路径，但我们不推荐它）。\n\n## 关闭悲观锁定\n\n如果你的版本控制系统支持乐观锁定（optimistic\
  \ locking，即在你的本地工作副本中编辑文件不会阻止其他人在自己的副本中进行编辑），那么你应该使用它。悲观锁定（即你必须获得文件的排他锁才能进行编辑）看起来似乎是防止合并冲突的好方法，但在实践中，它降低了开发效率，特别是在大团队中。\n\
  \n\n\n\n采用悲观锁方法的版本控制系统是以所有权为基础的。悲观锁策略确保在任何时刻，只有一个人可以对任何特定对象进行操作。如果 Amrita 已经检出了版本控制中的组件\
  \ `A`，而 Tom 尝试获取组件 `A` 的锁，他将会被退回。如果他尝试在没有先获取锁的情况下提交更改，该操作将失败。\n\n## 悲观锁 vs 乐观锁\n\
  \n乐观锁系统的工作方式完全不同。它们并不是控制访问，而是假设在大多数时候，人们并不会处理同一内容，因此允许系统的所有用户对其控制的所有对象进行自由访问。这些系统会跟踪其受控对象的更改，当需要提交更改时，它们会使用算法来合并更改。通常情况下，合并是完全自动的，但如果版本控制系统检测到无法自动合并的更改，它将突出显示该更改并向提交更改的人寻求帮助。\n\
  \n* * *\n\n![Image](img/common.jpg)\n\n## 乐观锁的工作原理\n\n乐观锁系统的工作方式通常取决于它们所管理的内容性质。对于二进制文件，它们倾向于忽略增量（deltas），直接采用最后提交的更改。然而，它们的强大之处在于处理源代码的方式。对于此类对象，乐观锁系统通常假设文件中的单行是一个合理的更改单元。因此，如果\
  \ Ben 处理组件 `A` 并修改了第 `5` 行，而同时 Tom 正在处理组件 `A` 并修改第 `6` 行，在两人提交后，版本控制系统将保留 Ben 的第\
  \ 5 行和 Tom 的第 6 行。如果他们都决定修改第 7 行，且 Tom 先提交，那么 Ben 在提交时，版本控制系统会提示他解决产生的合并冲突。他会被要求保留\
  \ Tom 的更改、保留自己的更改，或者手动将它们合并以保留两者的重要部分。\n\n对于习惯了悲观锁版本控制系统的人来说，乐观锁系统有时看起来……嗯，绝望地乐观。“它们怎么可能运行良好？”实际上，它们的效果惊人，在许多方面显著优于悲观锁。\n\
  \n我们听过悲观锁系统的用户担心，乐观锁系统的用户将花费所有时间来解决合并冲突，或者自动合并会导致代码无法执行甚至无法编译。这些担忧在实践中并没有实现。合并冲突确实会发生——在大团队中发生得相当频繁——但通常几乎所有的冲突都几秒钟就能解决，而不是几分钟。只有当你忽略了我们之前的建议且没有频繁地提交更改时，耗时才会更长。\n\
  \n## 何时使用悲观锁\n\n悲观锁唯一有意义的情况是针对二进制文件，例如图像和文档。在这种情况下，无法对结果进行有意义合并，因此悲观锁是一种合理的方法。Subversion\
  \ 允许你根据需要锁定文件，还可以对此类文件应用 `svn:needs-lock` 属性来强制执行悲观锁。\n\n悲观系统通常迫使开发团队按组件分配行为，以避免因等待相同代码的访问而导致长时间延迟。创意流——开发过程中自然且必不可少的一部分——经常由于需要检出开发者并未意识到需要的文件而被中断。它们还使得几乎不可能在不打扰许多其他用户的情况下进行影响大量文件的更改。在基于主线分支工作的大团队中，在开启悲观锁的情况下，团队几乎无法进行重构。\n\
  \n乐观锁对开发过程施加的限制较少。版本控制系统不对你施加任何策略。总的来说，它的感觉侵入性更低、更轻量，在不丢失任何灵活性或可靠性的同时，极大地提高了可扩展性，特别是对于大型分布式团队。如果你的版本控制系统有此选项，请选择乐观锁。如果没有，请考虑迁移到支持该功能的版本控制系统。\n\
  \n## 分支与合并\n\n在代码库中创建分支（或流）的能力是每个版本控制系统的首要功能。此操作在版本控制系统中创建一个所选基准的副本。该副本可以以与原始版本相同（但独立）的方式进行操作，从而允许两者分叉。分支的主要目的是促进并行开发：同时处理两个或多个工作流而互互不影响的能力。例如，在发布时进行分支是常见做法，允许在主线上进行持续开发并在发布分支中进行错误修复。团队可能选择对代码进行分支的其他几个原因：\n\
  \n- **物理层面：** 系统物理配置的分支——为文件、组件和子系统创建分支。\n- **功能层面：** 系统功能配置的分支——为特性、逻辑更改（包括错误修复和增强）以及其他重要的交付功能单元（例如补丁、发布版本和产品）创建分支。\n\
  - **环境层面：** 系统运行环境的分支——为构建和运行时平台的不同方面（编译器、窗口系统、库、硬件、操作系统等）和/或整个平台创建分支。\n- **组织层面：**\
  \ 团队工作努力的分支——为活动/任务、子项目、角色和小组创建分支。\n- **程序层面：** 团队工作行为的分支——为了支持各种策略、流程和状态而创建分支。\n\
  \n这些类别并不是互斥的，但它们提供了对人们创建分支原因的洞察。当然，你可以同时在多个维度上创建分支；如果这些分支永远不需要相互交互，那是没问题的。但通常情况下如此——我们通常必须从一个分支获取一组更改并将其引入另一个，这个过程被称为合并。\n\
  \n在讨论合并之前，值得思考分支产生的问题。在大多数创建分支的情况下，整个代码库在每个分支中独立演进——包括测试用例、配置、数据库脚本。首先，这凸显了将所有内容纳入版本控制的必要性。在开始对代码进行分支之前，请确保你已准备就绪——确保构建软件所需的所有内容都在版本控制中。\n\
  \n* * *\n\n### 版本控制恐怖故事：1\n\n创建分支最常见的原因通常是功能性的。我们合作过的一个大型网络基础设施供应商为他们的每个主要客户都创建了分支。他们还为每个错误修复和新功能创建了子分支。他们的软件版本号为\
  \ `w.x.y.z`，其中 `w` 是主版本，`x` 是发布版本，`y` 是客户标识符，`z` 是构建版本。我们被邀请是因为他们需要 12 到 24 个月才能发布一个主版本。我们发现的问题之一是他们的测试与代码在不同的版本控制仓库中。因此，他们很难确定哪些测试适用于哪个构建。这反过来阻止了他们向代码库中添加更多测试。\n\
  \n\n\n\n\n分支（Branching）和流（streaming）似乎是解决影响大型团队软件开发过程中许多问题的绝佳方法。然而，合并分支的要求意味着在分支之前进行深思非常重要，并确保你有一套合理的流程来支持它。特别是，你需要为每个分支定义一个策略，描述其在交付过程中的角色，并规定谁允许在什么情况下提交代码（check\
  \ into）。例如，一个小型团队可能有一个所有开发者都可以提交代码的主干（mainline），以及一个仅允许测试团队批准更改的发布分支（release branch）。然后，测试团队负责将错误修复合并到发布分支。\n\
  \n在规模更大且监管更严格的组织中，每个组件或产品可能都有一个开发者提交代码的主干，以及集成分支、发布分支和维护分支，后者只有运维人员有权对其进行更改。将更改引入这些分支可能需要创建变更请求，并让代码通过一系列测试（手动或自动）。系统中会定义一个晋升流程（promotion\
  \ process），例如，更改必须从主干到集成分支，然后才能晋到发布分支。代码行策略在 Berczuk (2003) 第 117–127 页中有更详细的讨论。\n\
  \n## 合并\n\n分支就像量子力学多世界解释所假设的无限宇宙。每个宇宙都是完全独立的，并处于对彼此完全无知的状态中。然而，在现实生活中，除非你是为了发布或探索（spikes）而进行分支，否则你终会需要将在一个分支中做的更改应用到另一个分支中。这样做可能非常耗时，尽管市场上几乎每个版本控制系统（VCS）都有某些功能使其变得更容易，而且分布式\
  \ VCS 使合并无冲突的分支变得相对简单。\n\n当你想要合并的两个分支中发生了不同且冲突的更改时，真正的问题出现了。当更改在字面上重叠时，你的版本控制系统会检测到并警告你。然而，你的冲突可能只是意图上的差异，这些差异会被版本控制系统忽略并自动“合并”。当两次合并之间间隔很长时间时，合并冲突通常是功能实现冲突的症状，导致需要重写大块代码，以协调两个分支中发生的更改。在不知道代码作者意图的情况下，合并此类更改是不可能的——因此必须进行交流，这可能是在代码被原始编写几周后才发生的。\n\
  \n版本控制系统无法捕获的语义冲突（Semantic conflicts）可能是最阴毒的。例如，如果 Kate 在她的一个更改中进行了重构并重命名了类，而 Dave\
  \ 在他的一个更改中引入了对该类的新引用，他们的合并将能够正常工作。在静态类型语言中，这个问题会在有人尝试编译代码时被发现。在动态语言中，直到运行时才会被发现。通过合并可能会引入更微妙的语义冲突，如果没有全面的自动化测试用集，你可能直到出现缺陷时才能捕获它们。\n\
  \n你推迟合并分支的时间越长，参与工作的人员越多，你的合并过程就会变得越不愉快。有方法可以减轻这种痛苦：\n\n*   你可以创建更多分支以减少对给定分支所做的更改数量。例如，你可以在每次开始开发一个功能时都创建一个分支；这是“早期分支”（early\
  \ branching）的示例。然而，这意味着需要更多工作来跟踪所有分支，你只是在推迟必须进行更多合并的痛苦。\n*   你可以对创建分支保持吝啬，也许为每个发布版本创建一个分支。这是“延迟分支”（deferred\
  \ branching）的示例。为了尽力减少合并的痛苦，你可以频繁合并，这意味着合并将不再那么不愉快。但是，你必须记住定期执行——例如，每天一次。\n\n事实上，有许多可能的分支模式，每种模式都有它们自己的策略、优点和缺点。我们将在本章后面的部分探索一些可能的分支样式。\n\
  \n## 分支、流与持续集成\n\n敏锐的读者会注意到，使用分支和持续集成（continuous integration）之间存在张力。如果团队的不同成员在单独的分支或流上工作，根据定义，他们并没有进行持续集成。也许使持续集成成为最重要的实践是每个人每天至少向主干提交一次代码。所以，如果你每天将你的分支合并到（而不不仅仅是从）主干合并一次，那么你就没问题。如果你没有这样做，你就没有在进行持续集成。事实上，有一种学派认为，在分支上的任何工作在精益（lean）的意义上都是浪费——即未拉入成品的库存。\n\
  \n图 14.1 一个典型的控制不当的分支示例\n\n![Image](img/fig14_1.jpg)\n\n看到持续集成基本上被忽视，人们随意地创建分支并不罕见，这导致发布过程涉及许多个分支。我们的同事\
  \ Paul Hammant 从他参与过的一个项目中提供了图 14.1 的示例。\n\n在这个示例中，分支是作为开发应用程序工作的一部分为各种项目创建的。合并回主干（或此处所说的“集成分支”）的情况相当不规则，而且当合并发生时，它们往往会破坏主干。结果是，主干保持损坏状态很长时间，直到项目发布前的“集成阶段”。\n\
  \n不幸的是，这种相当典型的策略的问题在于，分支往往在很长一段时间内处于不可部署状态。此外，通常情况下，分支之间存在软依赖关系。在给出的示例中，每个分支都需要从集成分支获取错误修复，每个分支都从性能调优分支获取性能修复。应用程序自定义版本的分支是一个进行中的工作，在很长一段时间内无法部署。\n\
  \n尽管有 Perforce 或 Subversion 等工具提供的合并点跟踪功能，跟踪分支、确定合并内容和时仍然消耗大量资源。即使在完成后，团队仍然需要让代码库处于可部署状态——这正是持续集成本应该解决的问题。\n\
  \n图 14.2 发布分支策略\n\n![Image](img/fig14_2.jpg)\n\n一种更易管理的分支策略——我们的强烈建议，并且可以说是行业标准——是仅在发布时创建长存分支，如图\
  \ 14.2 所示。\n\n在这种模型中，新工作始终提交到主干。只有在需要对发布分支进行修复时才执行合并，然后将其合并到主干。关键的错误修复也可能从主干合并到发布分支。这种模型更好，是因为代码随时可以发布，因此发布也更容易。分支更少，因此合并和跟踪分支的工作要少得多。\n\
  \n你可能担心不使用分支会阻碍你在不影响别人的情况下创建新功能。如何在不创建新分支来隔离工作的情况下进行大规模重构？我们在上一章的“保持应用程序可发布”部分（位于第\
  \ 346 页）详细讨论过这个问题。\n\n\n\n\n增量方法确实比创建一个分支并一头扎进去地重新设计架构和开发新功能需要更多的纪律和细心——而且事实上，还需要更多的创造力。但它显著降低了你的更改破坏应用程序的风险，并将将为你和你的团队节省大量的合并、修复故障以及让应用程序处于可部署状态的时间。此类活动往往非常难以计划、管理和跟踪，导致其最终成本比在主干上开发这种更具纪律的实践要高得多。\n\
  \n如果你在中大型团队中工作，看到这一点，你可能会怀疑地摇着摇头。如何在不让人们建立分支的情况下在大型项目上工作呢？如果每天有 200 人提交代码，那就意味着\
  \ 200 次合并和 200 次构建。没有人能完成任何工作——他们将把所有时间都花在合并上！\n\n在实践中，即使每个人都在一个巨大的代码库中工作，大型团队也能运行良好。只要每个人都在代码的不同区域工作，并且每次更改都是微小的那么\
  \ 200 次合并是没有问题的。在如此规模的项目上，如果几位开发人员经常触碰同一段代码，这表明代码库结构设计不良，封装不足且耦合度高。\n\n如果将合并留到发布结束时进行，情况会糟糕得多。到那个时候，几乎可以肯定每个分支都会与其他任何分支发生合并冲突。我们见过某些项目的集成阶段始于数周时间的尝试解决合并冲突，并试图让应用程序达到甚至可以运行的状态。只有在那里，项目的测试阶段才能真正启动。\n\
  \n中大型团队的正确解决方案是将你的应用程序拆分为组件，并确保组件之间存在松散耦合。这些是良好系统的特性。采用这种增量合并方法（即应用程序在主干上始终保持运行）的后果是，它施加了一种温和而微妙的压力，使你的软件设计变得更好。然后将组件集成到一个可以运行的应用程序中这本身就是一个复杂且有趣的问题，我们在上一章中探讨过它。然而，它是解决大型应用程序开发问题的一种无限优越的方法。\n\
  \n值得再次强调：你永远不要使用长寿、低频率合并的分支作为管理大型项目复杂性的首选手段。这样做会在你尝试部署或发布应用程序时埋下麻烦。你的集成过程将是一项极高风险的活动，将不可预测，并消耗你大量的时间和金钱。任何告诉你你只需要使用他们的合并工具就能解决问题的版本控制系统供应商，仅仅是在对事不道。\n\
  \n### 分布式版本控制系统\n\n在过去的几年里，分布式版本控制系统（DVCSs）变得越来越流行。存在许多强大的开源 DVCS，例如 `Git` [9Xc3HA]\
  \ 和 `Mercurial`。在本节中，我们将检查 DVCS 的特殊之处，以及如何使用它们。\n\n#### 什么是分布式版本控制系统？\n\n分布式版本控制系统的基本原理是每个用户都拥有一份代码库副本，不需要一个主服务器来确保同步（尽管通常会约定一个）。由于这种设计原则，产生了许多有趣的特性：\n\
  \n- 即使没有主服务器，用户也可以轻松与其他共享更改（这被称为 `push/pull`）。\n- 即使离线工作也可以提交更改。\n- 补丁可以在网络中传播给对它们感兴趣的用户（这被称为\
  \ `cherry-picking`）。\n- 即使不影响主仓库也可以发布更改（这被称为 `rebase`）。\n- 即使在本地仓库中也可以对提交进行重新调整。\n\
  - 地仓库可以轻松建立副本，使得 DVCS 具有更高的容错性。\n- 由于存在完整的代码库副本，主仓库不会被频繁访问，使得 DVCS 具有更好的扩展性。\n-\
  \ 本地仓库可以轻松同步，从而提供了高可用性。\n\n图 14.3 仓库中的开发行\n\n![Image](img/fig14.jpg)\n\n如果你认为使用\
  \ DVCS 听起来就像每个人都有自己的 SCCS 或 RCS，那么你是正确的。分布式版本控制系统与之前方法的区别在于它们处理并发用户的方式。与其使用一个带有版本控制系统的中央服务器来允许人们同时工作，不如它们采取了相反的方法：每个本地仓库实际上都是分支（这被称为\
  \ `merge`）。\n\nDVCS 设计的大部分工作是为了让用户轻松共享更改。Ubuntu 母公司 Canonical 的创始人 Mark Shuttleworth\
  \ 指道：“分布式版本控制的魅力在于自发团队的形成，因为对某个漏洞或功能感兴趣的人开始工作，通过发布分支和相互合并来交换工作。当分支和合并的成本降低时，这些团队更容易形成，这种极端情况表明投入是非常值得的。”\n\
  \n\n\n然而，在 1999 年 12 月，Linux PowerPC 项目开始使用 `BitKeeper`，这是一种于 1998 年问世的专有分布式版本控制系统。Linus\
  \ 开始考虑采用 `BitKeeper` 来维护内核。在接后的几年里，内核某些部分的维护者开始使用它。最终，在 2002 年 2 月，Linus 采纳了 `BitKeeper`，尽管它并不是一个开源产品，但他将其描述为“这项工作的最佳工具”。\n\
  \n`BitKeeper` 是第一个被广泛使用的分布式版本控制系统，它是构建在 `SCCS` 之上的。事实上，一个 `BitKeeper` 仓库仅仅由一组 `SCCS`\
  \ 文件组成。与分布式版本控制系统的哲学一致，每个用户的 `SCCS` 仓库本身就是一个一等仓库。`BitKeeper` 是 `SCCS` 之上的一层，允许用户将增量（deltas，或针对特定修订的更改）视为一等领域对象。\n\
  \n在 `BitKeeper` 之后，许多开源 DVCS 项目相继。其中第一个是 Tom Lord 在 2001 年启动的 `Arch`。`Arch` 现在已不再维护，并被\
  \ `Bazaar` 取代。今天有许多竞争性的开源 DVCS。其中最流行且功能最丰富的 `Git`（由 Linus Torvalds 创建用于维护 Linux\
  \ 内核并被许多其他项目使用）、`Mercurial`（Mozilla Foundation、OpenSolaris 和 OpenJDK 使用）以及 `Bazaar`（被\
  \ Ubuntu 使用）。其他活跃开发的开源 DVCS 包括 `Darcs` 和 `Monotone`。\n\n### 企业环境中的分布式版本控制系统\n\n\
  在编写此时，商业组织采用 DVCS 的速度很慢。除了普遍的保守主义外，在公司使用 DVCS 还有三个明显的反对理由。\n\n- 与集中式版本控制系统不同（后者只在用户的计算机上存储仓库的单一版本），任何复制了\
  \ DVCS 本地仓库的人都拥有了该仓库完整的历史记录。\n\n- 审计和工作流在 DVCS 领域是更难以捉摸的概念。集中式版本控制系统要求用户将所有更改提交到中央仓库。DVCS\
  \ 允许用户之间互相发送更改，甚至可以在自己的本地仓库中更改历史，而这些更改不会在中央系统中被跟踪。\n\n- `Git` 实际上允许你更改历史。对于受监管制度约束的企业环境来说，这可能是一条红线，因为他们必须定期备份仓库以保留所有发生过的记录。\n\
  \n在实践中，许多情况下，这些考虑不应成为企业采纳的障碍。虽然在理论上用户可以避免提交到指定的中央仓库，但这样做意义不大，因为鉴于持续集成系统，如果不推送更改，就不可能获得基于你代码的构建。在不向中央提交的情况下将更改推送给同事通常比其价值带来的麻烦大得多——除非你确实需要这么做，而在那种情况下，拥有一个\
  \ DVCS 是极其有用的。一旦你指定了一个中央仓库，集中式版本控制系统的所有属性都可以使用。\n\n需要记住的一点是，使用 DVCS，开发者和管理员只需付出极少努力就可以实现许多工作流。相反，集中式\
  \ VCS 只能通过添加破坏了底层（集中式）模型的复杂功能，来支持非中心化模型（如分布式团队、共享工作空间的能力和审批工作流）。\n\n### 使用分布式版本控制系统\n\
  \n分布式和集中式版本控制系统之间的主要区别在于，当你进行提交（commit）时，你提交的是仓库的本地副本——实际上，是提交到你自己的分支。为了与其他共享你的更改，你还需要执行一组额外的步骤。为了实现这一点，DVCS\
  \ 有两个新操作：从远程仓库拉取更改以及向其推送更改。\n\n例如，这里是 Subversion 的一个典型工作流：\n\n1. `svn up`——获取最新修订版本。\n\
  2. 编写一些代码。\n3. `svn up`——将我的更改与中央仓库的任何新更新合并并解决任何冲突。\n4. 在本地运行提交构建。\n5. `svn ci`——将我的更改（包括我的合并）提交到版本控制中。\n\
  \n在分布式版本控制系统中，工作流如下：\n\n1. `hg pull`——从远程仓库获取最新更新到你的本地仓库。\n2. `hg co`——从本地仓库更新你的本地工作副本。\n\
  3. 编写一些代码。\n4. `hg ci`——将你的更改保存到本地仓库。\n5. `hg pull`——从远程仓库获取任何新更新。\n6. `hg merge`——这将用合并结果更新你的本地工作副本，但不会提交合并。\n\
  7. 在本地运行提交构建。\n8. `hg ci`——这会将合并提交到你的本地仓库。\n9. `hg push`——将你的更新推送到远程仓库。\n\n***\n\
  \n![Image](img/common.jpg)\n\n我们在这里使用 `Mercurial` 作为示例，因为它的命令语法与 Subversion 类似，但其原理与其他\
  \ DVCS 完全相同。\n\n***\n\n图 14.4 DVCS 工作流（Chris Turner 绘图）\n\n![Image](img/fig14_4.jpg)\n\
  \n它看起来有点像图 14.4（每个框代表一个修订版本，箭头指示修订的父版本）。\n\n由于第 4 步的存在，合并过程比 Subversion 的等效操作安全一点。这个额外的提交步骤确保了即使合并结果糟糕，你也可以回到合并前的状态并重新尝试。这也意味着你记录了一个仅代表合并的更改，以便清楚地看到合并做了什么。\n\
  \n\n\n\n基于流的版本控制系统（如 `ClearCase` 和 `AccuRev`）设计用于通过一次性将一组更改应用于多个分支，来改进合并问题。在“流”的范式中，分支被更强大的“流（streams）”概念所取代，流的关键区别在于它们可以相互继承。因此，如果你对一个给定的流应用了更改，它的所有后代流都会继承这些更改。\n\
  \n考虑这种范式如何帮助两种常见情况：为应用的多个版本应用错误修复（bugfix），以及为代码库添加第三方库的新版本。\n\n第一种情况在你拥有用于发布的长期存分支时很常见。假设你需要对其中一个发布分支进行错误修复。你如何同时将该错误修复应用到代码的所有其他分支呢？如果不使用基于流的工具，答案是手动合并。这是一个枯燥且容易出错的过程，特别是当你有多个不同的分支需要应用更改时。使用基于流的版本控制系统，你只需将分支中的更改提升（promote）到需要该更改的所有分支的共同祖先即可。这些分支的消费者就可以更新以获取这些更改，并创建一个包含该修复的新构建。\n\
  \n在管理第三方库或共享代码时，也存在同样的考量。假设你想将图像处理库更新到新版本。每个组件都需要更新以依赖相同的版本。使用基于流的 VCS，你可以将新版本提交到每个需要更新的流的祖先中，所有继承自它的流都会获取它。\n\
  \n你可以将基于流的版本控制系统认为类似于联合文件系统（union filesystem），但文件系统形成了树形结构（连接的有向无环图）。因此，每个仓库都有根流，所有其他流都继承自它。你可以根据任何现有流创建新流。\n\
  \n图 14.5 基于流的开发\n\n![Image](img/fig14_5.jpg)\n\n在图 14.5 的示例中，根流包含一个版本为 `1.2` 的单文件\
  \ `foo` 和一个空目录。`release 1` 和 `release 2` 流都继承自它。在 `release 1` 流中，可以找到根流存在的文件，以及两个新文件：`a`\
  \ 和 `b`。在 `release 2` 流中，存在两个不同的文件：`c` 和 `d`。`foo` 已被修改，现在版本为 `1.3`。\n\n两个开发人员在各自的工作空间中处理\
  \ `release 2` 流。开发者 1 正在修改文件 `c`，开发者 2 正在修改文件 `d`。当开发者 1 提交更改时，所有在 `release 2` 流上工作的人都能看到。如果文件\
  \ `c` 是 `release 1` 需要的错误修复，开发者 1 可以文件 `c` 提升到根流，在这种情况下，它对所有流都可见。\n\n因此，对一个流进行更改不会影响任何其他流，除非这些更改被提升。一旦提升，它们对继承自原始流的所有其他流都是可见的。重要的是，这种这样提升更改不会改变历史。相反，它就像是在流现有内容之上添加包含新更改的叠加层。\n\
  \n### 流开发模型\n\n在基于流的系统中，鼓励开发者在自己的工作空间中开发。这样，开发者可以进行重构、尝试解决方案并开发功能，而不会影响其他用户。当他们准备好时，可以提升他们的更改以供他人使用。\n\
  \n例如，你可能在一个为特定功能创建的流上工作。当功能完成后，你可以将该流中的所有更改提升到团队流中，该流可以进行持续集成。当你的测试人员想要测试完成的功能时，他们可以有自己的流，所有准备好手动测试的功能都可以提升到该流中。通过测试的功能随后可以提升到发布流。\n\
  \n因此，中大型团队可以同时处理多个功能部分而互互不影响，测试人员和项目经理可以挑选（cherry-pick）他们想要的功能。与大多数团队在准备发布时面临的困境相比，这是一项真正的改进。通常，创建一个发布涉及对整个代码库进行分分支，然后稳定该分支——但当然，当你分分支时，没有简单的方法可以挑选出你想要的部分（关于此问题及解决方法的更多细节，请参阅第\
  \ 409 页上的“为发布分分支”章节）。\n\n当然，在现实生活中事情绝非如此简单。功能之间绝不是真正独立的，特别是如果你的团队像应该的那样积极地进行重构，那么当你在流之间提升大块代码时，合并问题就会频繁发生。因此，由于以下原因导致集成问题很常见并不意外：\n\
  \n- 复杂的合并，因为不同的团队以不同的方式更改共享代码。\n- 依赖管理问题，当新功能依赖于其他尚未提升的功能中引入的代码时。\n- 集成问题，因为集成和回归测试在发布流上崩溃，因为代码处于新的配置中。\n\
  \n当你有更多团队或更多层次时，这些问题会变得更糟糕。这种影响通常是倍数的，因为增加团队的常见反应是创建更多层次。意图是隔离团队之间相互的影响。一家大型公司报告说他们有五级流：团队级、领域级、架构级、系统级，最后是生产级。每个更改在到达生产环境之前必须经过每一级。不言而喻，由于这些问题的定期出现，他们在发布产品时面临着重大问题。\n\
  \n### ClearCase 与“从源码重新构建”反模式\n\n流开发模型的问题之一是，提升是在源代码级别执行的，而不是二进制级别。结果是，每当你向更高流提升更改时，都必须检出源码并重新构建二进制文件。在许多\
  \ ClearCase 工作中，运营团队坚持只部署从发布分支检出的源码从头构建的二进制文件。除了其他之外，这导致了大量的浪费。\n\n此外，它违反了我们的一个核心原则——你发布的二进制文件应该是通过你部署流水线其余部分的相同二进制文件，这样你就可以确定发布的内容就是你测试的内容。除了没有人测试过发布流生成的二进制文件外，构建过程中还可能引入差异，也许运营团队使用了不同小版本版本的编译器或某些依赖项的不同版本。这些差异可能会导致生产环境中出现需要数天才能追踪的错误。\n\
  \n记住，不每天向共享主干提交代码与持续集成实践是背道而驰的。有方法可以这种情况，但需要大量的自律——而且仍然无法完全解决中大型团队所面临的困境。准则是尽可能频繁地提升，并在开发者共享的流上尽可能频繁地运行尽可能自动化测试。在这方面，这种模式与本章稍后描述的“按团队分分支”相似。\n\
  \n\n\n\n不过这并非全是坏消息。Linux 内核开发团队使用的流程与上述描述非常相似，但每个分支都有一个所有者，其工作是保持该流的稳定；而且当然，“发布流”由\
  \ `Linus Torvalds` 维护，他对于拉入流的内容非常挑剔。Linux 内核团队的工作方式是流的分层级结构，`Linus` 位于顶端，更改是由流所有者拉取（pull）的，而不是向他们推送（push）。这与大多数组织中的结构完全相反，在这些组织中，运维或构建团队往往承担着尝试合并所有内容的不幸职责。\n\
  \n最后，关于这种开发风格的一点：你不需要具有显式流支持的工具来完成这一点。事实上，Linux 内核开发团队使用 `Git` 来管理代码，而像 `Git` 和\
  \ `Mercurial` 这样的新分布式版本控制系统完全能够处理这种过程——尽管缺乏像 `AccuRev` 等产品所提供的花哨图形化工具。\n\n## 静态与动态视图\n\
  \n`ClearCase` 有一项名为“动态视图（dynamic views）”的功能。当文件合并到其流继承自的流时，它会立即更新每个开发者的视图。这意味着开发者会立即获取其流的任何更改。在更传统的静态视图（static\
  \ view）中，在开发者决定更新之前，是看不到更改的。\n\n动态视图是在更改提交时获取更改的极佳方法，这有助于消除合并冲突并简化集成——前提是开发者频繁且定期地提交代码。然而，在技术层面和实际变更管理层面都存在问题。在技术层面，此功能运行极其缓慢：根据我们的经验，它会极大地减慢访问开发者文件系统的速度。由于大多数开发者经常执行编译等对文件系统密集型的任务，这种开销是不可接受的。在实际操作中，如果你正在进行某项工作，却被强制进行合并，这可能会打断你的思路，并扰乱你对问题的认知。\n\
  \n## 基于流的版本控制系统的持续集成\n\n基于流的开发所所谓的优点之一，是让开发者更容易在自己的私有流上工作，并承诺此后合并会变得更容易。从我们的角度来看，这种方法有一个根本性的缺陷：当更改被定期推广（即每天超过一次）时，一切都是好的，但如此频繁的推广往往限制了该方法本身的益处。如果你频繁推广，更简单的解决方案同样有效甚至更好。如果你不频繁推广，那么你的团队在发布时极有可能遇到问题。他们将花费不确定的时间让一切各归就位，修补大家认为运行正常的功能，并修复由复杂合并引入的错误。这正是持续集成本应解决的问题。\n\
  \n像 `ClearCase` 这样的工具确实拥有强大的合并能力。然而，`ClearCase` 也拥有一套完全基于服务器的模型，从合并、打标签（tagging）到删除文件，所有操作都需要大量的服务器活动。事实上，在\
  \ `ClearCase` 中将更改推广到父流，要求提交者解决在兄弟级流上发生的任何错误合并。\n\n我们对 `ClearCase` 的经验以及同事们的经验表明，对于任何规模的仓库，你预期的本该简单的操作——如提交、删除文件和（特别是）打标签——都会花费异常长的时间。如果你想定期提交，单单这一点就为使用这些工具进行开发增加了非常巨大的成本。事实上，与具有原子提交（atomic\
  \ commits）的 `Accurev` 不同，`ClearCase` 需要通过打标签才能回滚到仓库的已知版本。如果你有一支经验丰富、才华横溢的 `ClearCase`\
  \ 管理员提供帮助，你的开发流程可能尚可应对。我们担心我们的经验普遍是糟糕的。因此，我们经常采取在开发团队内部使用如 `Subversion` 等工具的方法，并定期向\
  \ `ClearCase` 进行单向自动合并，以此作为让大家都满意的方法。\n\n基于流的版本控制系统最重要的特性——能够推广更改集（change sets）——在涉及持续集成时也引发了些问题。考虑一个具有多个用于不同点发布流的应用程序。如果一个错误修复被推广到所有这些流的祖流，它将触发每一个后代流的新版本构建。这可能会迅速耗尽你构建系统的所有容量。对于在任何给定时刻都有活动流且定期进行推广的团队来说，构建将在每个流上持续运行。\n\
  \n处理这个问题有两种方案：要么在构建硬件或虚拟资源上花费巨额资金，要么更改触发构建的方式。一种实用的策略是：仅当与你的部署流水线相关的流发生更改时才触发构建，而不是当更改推广到其祖流时触发。当然，由此创建的发布候选（release\
  \ candidates）仍然应该获取流的最新版本，包括推广到其祖流的任何更改。手动触发的构建也会导致此类更改包含在发布候选中，基础设施团队需要确保在适当的情况下触发手动构建，以确保在需要时创建相关的发布候选。\n\
  \n## 在主线上开发（Develop on Mainline）\n\n在本节及后续章节中，我们将查看分支和合并的各种模式、它们的各种优缺点以及适用情况。我们将从在主线上开发开始，因为这种开发方法经常被忽视。事实上，这是一种极其有效的开发方式，也是唯一一种能让你执行持续集成的方法。\n\
  \n在这种模式下，开发者几乎总是提交到主线。分支很少被使用。在主线上开发的优点包括：\n\n- 确保所有代码都经过持续集成\n- 确保开发者能够立即获取他人的更改\n\
  - 避免项目结束时出现“合并地狱”和“集成地狱”\n\n在这种模式下，在正常开发中，开发者在主线上工作，每天至少提交一次代码。当需要进行复杂更改时（无论是开发新功能、重构部分系统、进行深远的容量改进还是重构系统层），默认并不使用分支。相反，更改被计划并实现为一系列微小的、增式的步骤，保持测试通过，从而不破坏现有功能。这在第\
  \ 346 页的“保持应用程序可发布”章节（ch13.html_page346）中进行了详细描述。\n\n主线开发并不排除分支。相反，它意味着“所有进行中的开发活动最终都会某个时间进入单一代码线”（Berczuk,\
  \ 2003, p. 54）。然而，只有在不需要合并回主线时才应该创建分支，例如执行发布或进行更改验证（spiking）。Berczuk（同上）引用了 Wingerd\
  \ 和 Seiward 关于主线开发的观点：“90% 的 SCM‘流程’都是为了强制代码线推广来弥补主线的缺失”（Wingerd, 1998）。\n\n\n\n\
  \n\n主线开发的后果之一是，并不是每一次提交到主线的代码都是发布的。如果你习惯了通过分支进行功能开发，或者使用基于流开发将更改通过多个层级推送到发布流，那么这看起来似乎是对比主线开发实践的毁灭性反驳。如果你将每项更改都提交到主线，你如何管理处理多个版本的大型开发团队呢？答案是：对软件进行良好的组件化、增量式开发和功能隐藏。这在架构和开发上需要更多的心心，但避免了不可预测的漫长集成阶段（在该阶段，必须合并多个流的工作以创建一个可行的发布分支），其收益远大于这些努力。\n\
  \n部署流水线的目标之一是允许大型团队频繁地向主线提交代码，这可能会导致暂的不稳定，但同时能让你交付稳如磐石的发布。从这个意义上说，部署流水线与源码提升模型是对立的。部署流水线的主要优势在于，你可以对每项更改对完整集成应用的影响获得快速反馈——这在源码提升模型中是不可能的。这种反馈的价值在于，你确切切地知道应用程序在任何时候的状态——你不需要等到集成阶段才发现你的应用程序还需要几周或几个月的额外工作才能发布。\n\
  \n#### 在不分支的情况下进行复杂更改\n\n在你想对代码库进行复杂更改的情况下，创建一个分支来完成更改以防中断其他开发人员的工作似乎是最简单的行动方案。然而，在实践中，这种方法会导致多个与主线产生显著差异的长寿分支。在接近发布时合并分支几乎是一个复杂的过程，耗时不可预测。每次新的合并都会破坏现有功能的不同部分，并在下一次合并发生之前，需要经过一个稳定主线的线的过程。\n\
  \n结果是，发布时间比计划要长得多，范围更小，质量也低于预期。在这种模型下，重构变得困难，除非你的代码库是松耦合并遵守“迪米法则”（Law of Demeter），这意味着技术债的偿还也变得非常缓慢。这很快会导致代码库变得不可维护，使得添加新功能、修复错误和重构变得更加困难。\n\
  \n简而言之，你面临着持续集成应该解决的所有问题。创建长寿分支从根本上反对了成功的持续集成策略。\n\n我们提出的不是一种技术解决方案，而是一种实践：始终提交到主干（trunk），并且至少每天一次。如果这看起来与对代码进行深远更改不兼容，那么我们谦虚地认为，也许你还没有足够努力。根据我们的经验，虽然将一个功能实现为一系列小的、增量的步骤以保持代码处于可用状态有时需要花费更长时间，但其收益是巨大的。保持代码始终可用是基础性的——我们再如何强调这种实践对于持续交付有价值的、良好的软件都是多么重要。\n\
  \n在某些情况下这种方法不起作用，但它们真的非常罕见，即使如此，也有策略可以缓解影响（参见第 346 页的“保持你的应用程序可发布””章节）。然而，即便如此，最好从根本上避免这种需求。通过定期提交到主线的增量更改从\
  \ A 移动到 B 几乎总是正确的做法，因此请始终将其放在你选项列表的首位。\n\n***\n\n***\n\n### 版本控制恐怖故事：#2\n\n在一个规模非常大的开发项目中，我们被迫维护一系列并行分支。在其中一个阶段，我们在生产环境中有一个发布版本，其中包含一些错误（版本\
  \ 1）。由于这些错误位于生产环境中，修复它们是迫切的，因此我们安排了一个小团队专门负责该任务。我们有第二个分支正在活跃开发中，有百多人在上面工作（版本 2）。该分支旨在即将到来的发布，但存在的一系列相当严重的结构性问题，我们知道为了项目的长期健康必须解决这些问题。为了给未来更稳定的发布做准备，我们又安排了另一个小团队对代码进行非常基础的重构（版本\
  \ 3）。\n\n版本 1 和版本 2 在整体结构上很大程度上是共享的。版本 3 一旦开始开发就迅速分叉了：这是由于另外两个版本中累积的技术债导致的。版本 3\
  \ 的功能是偿还这些技术债中最昂贵的部分。\n\n很快我们清楚，我们必须在合并更改的方法上保持极的自律。版本 1 中做的更改范围没有其他版本那么广，但是至关重要的生产环境错误修复。版本\
  \ 2 开发团队所做的更改量如果不仔细管理，其规模将是难以承受的，而版本 3 中的更改对于项目的长期成功至关重要。\n\n我们建立了几件对我们有帮助的事情：\n\
  \n1. 描述清晰的合并策略\n2. 为这些相对长寿的分支中的每一个设置一个独立的持续集成服务器\n3. 一个小型的、专门的合并团队来管理过程，并在大多数情况下执行合并操作\n\
  \n图 14.6 一致合并策略的设计与采用\n\n![Image](img/fig14_6.jpg)\n\n图 14.6 显示了我们在该项目中采用的策略图。这并不是适用于每个项目的正确策略，但对我们来说是正确的。版本\
  \ 1 处于生产环境中，仅对该代码分支进行了关键更改，因为另一个发布版本即将到来。对版本 1 的任何更改都是重要的；它们尽可能快地完成，并在必要时，通过发布流程将“修复”推送到生产环境。随后，所有版本\
  \ 1 的更改都按照其产生的顺序应用到版本 2。\n\n版本 2 正处于非常活跃的开发中。所有从版本 1 或直接在版本 2 中进行的更改，随后都应用于版本 3。再次，这些更改是按顺序进行的。\n\
  \n合并团队全职在三个发布分支之间移动更改，使用版本控制系统维护更改顺序。由于版本 1 和版本 2 之间存在广泛的功能更改，以及版本 2 和版本 3 之间存在广泛的结构更改，仅仅合并是不够的。在许多情况下，对早期版本的错误修复在版本\
  \ 3 中消失了，因为我们正在进行改进。在其他情况下，它们必须从头重写，因为问题仍然某种形式存在，但实现方式已完全不同。\n\n这是一项困难且令人沮丧的工作，团队变得非常擅。我们在团队中轮换人员，但一组核心开发人员决定坚持到底，因为他们理解这项工作有多重要。在高峰时期，合并团队有四个人全职工作了几个月。\n\
  \n分支并不并不总是如此昂贵，但它总是伴随着某种代价。如果我们有机会回到，我们会选择不同的策略，例如通过抽象分支（branching by abstraction）以便在主线继续工作的同时进行重构。\n\
  \n***\n\n### Branch for Release\n\n\n\n\n\n总是可以创建分支的一种情况是在发布前不久。一旦创建了分支，发布的测试和验证将通过分支上的代码完成，而新的开发则在主干（mainline）上进行。\n\
  \n为发布创建分支取代了“代码冻结”这种糟糕的做法——在代码冻结期间，版本控制的提交功能会完全关闭几天甚至几周。通过创建发布分支，开发者可以继续向主干提交代码，而对发布分支的更改仅限于关键的\
  \ 修复。按发布分支的方法如图 14.2 中在版本控制系统中描述了这种做法。当然，这种合并大多数可能会失败，这很好地说明了问题。\n\n### 功能团队、看板与按功能分支\n\
  \n按功能分支在“功能团队”模式的文献 [cfyl02] 中以及一些看板开发过程倡导者中经常被提到。然而，你可以在不为每个功能创建分支的情况下进行看板开发和功能团队，效果非常好（甚至比按功能分支更好）。这些模式是正交的。\n\
  \n我们对按功能分支的批评不应理解为对功能团队或看板开发过程的攻击——我们已经见过这两个开发过程运行得非常高效。\n\n分布式版本控制系统（DVCS）的设计目标正是这种模式，并使得与主干合并以及针对头部创建补丁变得异常简单。例如，使用\
  \ GitHub 的开源项目可以通过让用户轻松地分支仓库来添加功能，然后将分支提交给提交者拉取，从而获得开发速度的大幅。然而，开源项目的一些关键属性使其特别适合这种模式。\n\
  \n- 尽管许多人可以贡献，但它们由一个规模较小经验丰富的团队管理，该团队拥有接受或拒绝补丁的最终权力。\n\n\n\n\n\n-   发布日期相对灵活，这允许开源项目的提交者在拒绝次优补丁时拥有较大的自主权。虽然这在商业产品中也可能，但并非常态。\n\
  \n因此，在开源世界中，这种模式非常有效。它也适用于核心开发团队较小且经验丰富的商业项目。它也可以适用于较大的项目，但仅限于在满足以下条件的情况下：代码库是模块化且分解良好的；交付团队被分为几个小小组，每个小小组都有经验丰富的领导者；整个团队都致力于频繁向主干提交代码并进行集成；并且交付团队没有承受过度的发布压力，因为这种压力可能导致次优的决策。\n\
  \n我们对推荐这种模式持谨慎态度，因为它与商业软件开发中最常见的反模式之一紧密相关。在这个邪恶但极其常见的“镜像宇宙”中，开发者通过创建分支来开发功能。该分支会孤立很长时间。与此同时，其他开发者在创建其他分支。当临近发布时间时，所有分支都会合并到\
  \ `trunk`。\n\n此时，距离发布只剩下几周时间，原本一直在 `trunk` 上闲得没事寻找奇葩 bug 的整个测试团队，突然要面对整整一个发布版本的集成和系统级\
  \ bug，以及所有因为没人麻烦在集成前让测试人员仔细检查分支而尚未被发现的功能级 bug。测试人员大可以完全不忙了，因为开发团队没有时间在发布日期之前修复许多\
  \ bug。管理层、测试人员和开发团队将花费一到四周的时间，在疯狂中重新调整优先级，并争夺在修复关键 bug 前完成工作，然后将这一团乱狼糟的烂摊子丢给运营团队，让他们设法将其投入生产环境或其他或其他方式提供给用户——而用户对于接收这种结果导致的“狗晚餐”（烂摊子）可并不高兴。\n\
  \n这种力量非常强大，需要一个极度自律的团队才能避免这个问题。使用这种模式来推迟“确保应用程序处于可发布状态”的痛苦是太容易了。我们见过即使是小规模、经验丰富且“忍者级”的敏捷团队也会把这种模式搞砸，所以对我们其他人来说几乎没有希望。你应该始终从“在主干上开发”模式开始，然后如果你想尝试按功能分分支，请严格地按照上述规则进行。Martin\
  \ Fowler 写过一篇文章，生动地展示了按功能分支的风险 [bBjxbS]，特别是它与持续集成之间不安的关系。关于在持续集成中使用 DVCS（分布式版本控制系统）的更多信息，请参见\
  \ 79 页上的“分布式版本控制系统”章节。\n\n总来说，你需要非常确定这种模式的收益大于其巨大的开销，并且它在发布时间到来时不会导致崩溃。你应该考虑其他模式，例如使用抽象分支，通过组件而非分支来管理扩展，或者只需应用严谨的工程纪律，使每次更改都是微小且增量的，并定期提交到主干。所有这些做法在上一章都得到了详细描述。\n\
  \n值得强调的是，按功能分支实际上是持续持续的对立面，我们关于如何让它运行的所有建议都只是为了确保在合并时痛苦不要太可怕。从从源上避免痛苦要简单得多。当然，像软件开发中所有的“规则”一样，也存在某些可能合理的例外，例如开源项目或使用分布式版本控制系统的资深开发者小团队。然而，请注意，当你采用这种模式时，你是在“手持剪刀跑步”。\n\
  \n### 按团队分支 (Branch by Team)\n\n这种模式试图解决大型开发团队在多个工作流上工作，同时仍保持一个始终可以发布的主干的问题。与按功能分支一样，这种模式的主要意图是确保\
  \ `trunk` 始终是可发布的。每个团队都创建一个分支，并且只有在分支稳定后才合并到 `trunk`。对任何给定分支的任何合并都应该立即拉取到所有分支中。\n\
  \n图 14.7 按团队分支\n\n![Image](img/fig14_7.jpg)\n\n这里是按团队分支的工作流.^(7)\n\n1. 创建小团队，每个团队在自己的分支上工作。\n\
  2. 一旦功能/故事完成，该分支趋于稳定并合并到 `trunk`。\n3. `trunk` 上的任何更改每天合并到每个分支。\n4. 在分支的每次提交时都会运行单元测试和验收测试。\n\
  5. 每当一个分支合并到 `trunk` 时，都会在 `trunk` 上运行所有测试，包括集成测试。\n\n当你有开发者直接提交到 `trunk` 时，很难确保你能够像迭代开发方法要求的那样定期发布你的工作。如果你有几个团队在处理故事，`trunk`\
  \ 几乎总是包含未完成的工作，这会导致应用程序无法按现状发布，除非你自律地遵循 346 页上“保持您的应用程序可发布性”章节中的规则。在这种模式中，开发者只提交到他们团队的分支。只有当所有正在开发的功能完成后，该分支才会合并到\
  \ `trunk`。\n\n当你有几个规模小、相对独立的团队在系统的功能上相互独立的区域工作时，这种模式是有效的。至关重要的是，每个分支都需要一个所有者，负责定义和维护其策略，包括管理谁可以提交到该分支。如果你想提交到某个分支，你必须找到一个你的提交不会违反其策略的分支。否则，你必须创建一个新分支。\n\
  \n这种模式旨在保持 `trunk` 处于可发布状态。然而，这种模式中的每个分支面临着相同的问题——它只有在“稳定”时才能合并到 `trunk`。实际策略认为，如果分支在合并到\
  \ `trunk` 时不会破坏任何自动化测试（包括验收测试和回归测试），则它是稳定的。因此，每个分支实际上都需要自己的部署流水线，以便团队确定哪些构建是良好的，从而确定哪些版本可以合并到主干。任何此类版本在启动构建之前，都应该合并了主干的最新版本，以确保将分支合并到主干不会导致主干构建失败。\n\
  \n从持续集角度来看，这种策略具有一些缺点。一个根本问题是，这种策略的工作单元是针对整个分支的，而不是特定的更改。换句话说，你无法将单个更改合并到主干——你必须合并整个分支，否则无法知道你是否违反了主干策略。\n\
  \n\n\n\n\n其中一些问题可以通过通过使用分布式版本控制系统（DVCS）来缓解。Linux 内核开发团队使用了这种模式的变体，将操作系统不同部分（例如调度器和网络栈）的逻辑分支保留在独立的仓库中。DVCS\
  \ 具有将选定的更改集从一个仓库发送到另一个仓库的能力，这一过程被称为 `cherry-picking`（挑选）。这意味着你不需要总是合并整个分支，而是只合并你需要的特性。现代\
  \ DVCS 还拥有先进的变基（rebasing）功能，让你可以追溯地将补丁应用到之前的更改集并将其打包。因此，如果你在补丁中发现了 bug，可以将 bug 修复程序添加到补丁中，通过你的流水线运行此版本以验证其不会破坏主干，然后合并这个额外的补丁。**使用\
  \ `DVCS`** 使得这种模式从一种我们不推荐的模式转变为在某些情况下可能推荐的模式，前提是团队会定期向主干合并。\n\n如果合并频率不够高，这种模式就会遭受与全团队不直接提交到\
  \ `trunk` 的模式相同的缺点：**真正的持续集成会受到损害。** 这意味着始终存在发生频繁且严重的合并冲突的风险。出于这个原因，`Kniberg` 建议每个团队每完成一个故事（story）就合并到\
  \ `trunk`，并且每天从 `trunk` 合并。然而，尽管有这些前提，由于需要保持每个分支与 `mainline` 同步，始终会产生持续的开销——甚至可能是巨大的开销。如果分支之间发生了严重的分离（例如通过对紧耦合的代码库进行重构），团队将尽快同步这些更改以避免合并冲突。这反过来意味着要在分支的稳定版本上进行重构，以便它们能够立即合并到\
  \ `mainline`。\n\n在实践中，这种模式与 `branch by feature`（按特性分支）并不相似。它的优势是分支较少，因此集成发生得更频繁——至少在团队层面是如此。它的缺点是分支的分离要快得多，因为整个团队都在每个分支上提交。因此，合并可能会变得比按特性分支时复杂得多。主要的风险是团队在向\
  \ `mainline` 合并以及从其拉取更改方面缺乏足够的纪律。团队分支将迅速与 `mainline` 以及彼此之间发生分离，合并冲突可能会迅速变得极其痛苦。我们在现实生活中看到这种模式时，这几乎是不可避免的结果。\n\
  \n正如我们在第 346 页 的“保持应用程序的可发布性”部分中详细描述的那样，我们建议采用增量开发方法结合特性隐藏，这是在开发新特性的期间保持应用程序可发布性的最佳方法。总的来说，虽然这需要更多的纪律，但它比管理多个分支、不断合并，以及无法获得真正的持续集成所提供的关于更改对整个应用程序影响的快速反馈要风险要低得多。\n\
  \n然而，如果你正在一个大型的单体代码库上工作，这种模式（同 `branch by abstraction`，通过抽象分支）可以成为向松耦合组件迁移策略的有用部分。\n\
  \n***\n\n### 版本控制恐怖故事：#3\n\n我们曾参与过一个大型项目，其中团队的一部分在印度工作。那时，开发地之间的网络基础设施既慢又不可靠。每次\
  \ `commit` 的成本很高。我们为印度团队创建了一个单独的本地仓库，他们使用正常的持续集成周期频繁向其中提交更改。他们运行一个 `CruiseControl`\
  \ 的本地副本，因此拥有一个完全独立的本地 CI 周期。每天结束时，印度团队中一个幸运成员会将团队的更改合并到位于英国的 `mainline`，并确保本地仓库与\
  \ `mainline` 同步，以便第二天能够重新开始开发。\n\n***\n\n## 总结\n\n在软件开发过程中对你创建和依赖的资产进行有效控制，对于任何规模项目的成功都是至关重要的。版本控制系统的演进以及围绕它们形成的配置管理实践是软件行业历史的一个重要部分。现代版本控制系统的复杂性及其易于获取的特性，说明了它们对现代团队协作软件开发的核心重要性。\n\
  \n我们之所以在这个看似无关紧要的话题上花费这么多时间，有两点：首先，版本控制模式对于你设计部署流水线的方式是核心。其次，根据我们的经验，糟糕的版本控制实践是实现快速、低风险发布的最常见障碍之一。这些版本控制系统的一些强大功能可能会以一种危及安全、可靠、低风险软件发布机会的方式被。理解可用功能、选择正确的工具并恰当地使用它们，是一个成功软件项目的一个重要属性。\n\
  \n我们花了一些时间比较不同的版本控制系统范式：标准的集中式模型、分布式模型和基于流的模型。我们相信，特别是分布式版本控制系统将继续对软件交付方式产生巨大的积极影响。然而，使用标准模型仍然可以创建一个高效的过程。对于大多数团队来说，更重要的考虑是使用哪种分支策略。\n\
  \n持续集成愿望与分支愿望之间存在着根本性的张力。每当你在基于 CI 的开发系统中做出分支决定时，你都在某种程度上做出了妥协。使用哪种模式是一个选择，应该基于为你的团队和你的软件项目确定最佳流程。一方面，关于\
  \ CI 的绝对观点认为，每个更改都应该尽快提交到 `trunk`。`trunk` 始终是系统状态最完整、最新的陈述，因为你从它进行部署。更改与 `trunk`\
  \ 分离的时间越长——无论技术是什么，或者合并工具有多先进——在最终发生合并时出现问题的风险就越大。另一方面，某些因素（如网络糟糕、构建缓慢或方便性）使得分支变得更加高效。\n\
  \n\n\n\n本书主要面向从业人员。然而，实施持续交付不仅仅是购买一些工具和进行一些自动化工作。它取决于参与交付的所有人员之间的有效协作、执行管理层赞助者的支持，以及一线人员做出改变的意愿。本章的编写目的是为如何如何在您的组织内实现持续交付提供指导。首先，我们介绍了一个配置和发布管理的成熟度模型。接下来，我们将探索如何规划项目的生命周期（包括发布）。然后，我们描述了软件项目中构建和发布的风险管理方法。最后，我们将介绍部署过程中常见的常见的组织风险和反模式，并提供帮助您避免这些问题的最佳实践和模式。\n\
  \n在开始之前，我们想介绍持续交付的整体价值主张。持续交付不仅仅是一种新的交付方法论。它是一个依赖软件的业务运行的全新范式。为了理解为什么如此，我们需要审公司治理核心的一种根本紧张关系。\n\
  \nCIMA（英国注册会计师协会）将企业治理定义为“董事会和执行管理层实施的一系列责任和实践，其目标是提供战略方向、确保实现目标、确保风险得到妥善管理，并验证组织资源被负责任地使用。”它进一步区分了公司治理与业务治理：公司治理关注`conformance`——换句话说，即合规性、保证、监督以及负责任透明的管理；而业务治理则关注业务的`performance`和价值创造。\n\
  \n一方面，业务部门尽可能快地交付出有价值的新软件，以不断增加收入。另一方面，负责公司治理的人员希望确保组织理解任何可能导致业务亏损或关停的风险（例如违反适用法规），并有相应的流程来管理这些风险。\n\
  \n虽然业务中的每一个人最终都有共同的目标，但性能和合规性是往往会发生冲突的力量。这可以在开发团队与运营团队之间的关系中得到体现：开发团队面临着尽快交付的压力，而运营团队则将任何更改视为风险。\n\
  \n我们认为，组织的这两个部分并不是在参与一场零和博弈。同时实现合规性和性能是可能的。这一原则正是持续交付的核心。部署流水线的设计旨在通过确保交付团队获得有关应用程序生产就绪状态的持续反馈，来实现性能。\n\
  \n它还旨在通过使交付过程透明化来帮助团队实现合规性。IT 和业务部门都可以随时尝试运行应用程序，例如测试某些新功能，通过自服务方式将应用程序部署到 UAT（用户验收测试）环境。为了审计目的，流水线提供了一个记录系统，准确记录每个应用程序的哪些版本通过了交付过程的哪些部分，并能够从每个环境中的内容追溯到其在版本控制中的修订版本。该领域的许多工具都提供了限制谁可以做什么的功能，以确保部署只能由授权人员执行。\n\
  \n书中的实践，特别是增量交付以及构建、测试和部署过程的自动化，所有设计都旨在帮助管理发布新版本软件风险。全面的测试自动化提供了对应用程序质量极高水平的信心。部署自动化提供了按下按钮即可发布新更改并回滚的能力。诸如使用相同的流程部署到每个环境，以及自动化环境、数据和基础设施管理等实践，旨在确保发布过程经过了充分测试，最大限度地减少了人为错误的可能性，并且任何问题（无论是功能性的、非功能性的还是配置相关的）都能在发布前被发现。\n\
  \n通过使用这些实践，即使是拥有复杂应用程序的大型组织也能快速可靠地交付新版本的软件。这意味着企业不仅可以获得更快的投资回报，而且可以在降低风险且不承担长开发周期的机会成本——或者更糟，交付不符合用途的软件。用精益制造来类比，不频繁交付的软件就像存储在仓库中的库存。它花费了你的制造成本，但没有为你带来任何收益——事实上，存储它还在让你花钱。\n\
  \n### 配置和发布管理的成熟度模型\n\n在讨论治理话题时，清晰地了解组织变革的目标非常有帮助。在咨询行业工作多年以来——这一职业让我们有机会看到许多不同的组织并理解其工作实践的细节——我们和同事们提炼出了用于评估我们所工作组织的模型。该模型有助于识别组织在流程和实践的成熟度方面处于什么水平，并定义了一个组织可以努力改进的进展路径。\n\
  \n图 15.1 成熟度模型\n\n![Image](img/fig15_1.jpg)\n\n特别地，我们仔细地处理了跨整个组织的软件交付涉及的所有角色，以及他们是如何协作工作的。图\
  \ 15.1 显示了模型。\n\n#### 如何使用成熟度模型\n\n最终目标是让您的组织得到改进。您希望的结果是：\n\n*   缩短周期时间，以便您能够更快地为组织交付价值并提高盈利能力。\n\
  *   减少缺陷，以便您提高效率并减少在支持方面的支出。\n*   增加软件交付生命周期的可预测性，使规划更有效。\n*   能够采纳并维持对任何适用监管制度的合规态度。\n\
  *   能够有效确定和管理与软件交付相关的风险。\n*   由于更好的风险管理和更少的软件交付问题降低成本。\n\n我们相信这个成熟度模型可以作为指南，帮助您实现所有这些结果。我们一如既往地建议您应用明德环循环——计划-执行-检查-处理。\n\
  \n1.  使用该模型对您的组织的配置和发布管理成熟度进行分类。您可能会发现组织的不同部分在每个类别中达到不同的水平。\n2.  选择一个由于不成熟导致特别痛苦的领域进行关注。价值流映射将帮助您识别需要改进的领域。本书将帮助您理解每项改进带来的价值以及如何实施。您应该决定哪些改进对您的组织是有意义的，估计它们的成本效益并进行排序。您应该定义验收标准，以规定预期结果及其衡量方法，以便您可以判断更改是否成功。\n\
  3.  实施更改。首先，制定实施计划。从概念验证开始可能是合理的。如果是的话，请选择组织中一个深受苦的部分——这些人将有最好的动力来实施，而且您将从那里看到最显著的变化。\n\
  \n\n\n\n4. 更改完成后，使用你创建的验收标准来衡量这些更改是否达到了预期效果。召集所有利益者和参与者召开回顾会议，以了解更改的执行情况如何，以及潜在的改进领域在哪里。\n\
  \n5. 重复这些步骤，积累你的知识。增量地实施改进，并将其推向整个组织。\n\n组织变革是困难的，详细的指南超出了本书的范围。我们能提供的最重要的建议是增量地实施变更，并在执行过程中衡量其影响。如果你试图一步到位地让整个组织从一级跨越到五级，你将会失败。改变大型组织可能需要几年时间。寻找能够产生最大价值的更改并制定执行方案应该被视为一项科学任务：提出假设，然后进行测试。重复这一过程，并在过程中不断学习。无论你能力多强，总有改进的空间。如果某些方法不起作用，不要放弃流程；要尝试其他方法。\n\
  \n### 项目生命周期\n\n每个软件开发项目都是不同的，但抽象出共同元素并不困难。特别是，我们可以对软件交付的生命周期进行有效的泛化。每个应用程序，就像每个团队一样，都有一个叙事弧。讨论团队经历五个阶段（形成、震荡、规范、执行和哀悼/重塑）已成为常态。同样，每一份软件都会经历几个阶段。初始的高层蓝图可能包括以下阶段：识别、构思、启动、开发与部署以及运营。在转向详细检查构建和部署工程如何融入这一蓝图之前，我们将简要介绍一下这些阶段。\n\
  \n### ITIL 与持续交付\n\n《信息技术基础库》（ITIL）提供了一个软件服务交付的框架，我们认为它与本书书中描述的交付方法广泛兼容。我们共同的核心关注点是，通过让\
  \ IT 成为业务的战略资产，为客户交付更大的价值。正如 ITIL 关注服务是否具有 `utility`（效用，即适用性）和 `warranty`（保修，即可用性）一样，我们也讨论系统如何满足明确定义的各种性和非功能性需求。\n\
  \n然而，ITIL 的范围比本书大得多。它旨在为服务生命周期的所有阶段提供良好实践，从管理 IT 战略和服务组合的实践与功能，一直到如何管理服务台。相比之下，本书假设你已经有一套策略以及管理该策略的流程，并且对想要提供的服务有一些高层设想。我们主要关注\
  \ ITIL 中被称为“服务过渡”的阶段，并对服务运营进行讨论（特别是在第 11 章“管理基础设施和环境”）。\n\n在 ITIL 的背景下，本书大部分内容可以认为是为发布部署管理以及服务测试与验证过程提供良好实践，包括它们与服务资产与配置管理以及变更管理流程的关系。然而，由于我们对交付持整体观点，我们在书中讨论的内容对服务设计和服务运营也有其影响。\n\
  \n我们的方法与 ITIL 的主要区别在于，我们关注迭代和增量交付以及跨职能协作。ITIL 从服务设计和服务运营的角度认为这些是重要的，但在讨论服务过渡（特别是开发、测试和部署）时，这些在某种程度上被忽视了。我们认为，高质量软件的迭代和增量交付，对于企业创造和维持竞争优势的能力至关重要。\n\
  \n### 识别\n\n中大型组织将有一套治理策略。企业将确定其战略目标，从而识别出能够使业务实现战略目标的工作计划。这些计划随后被细分为若干项目。\n\n尽管如此，根据我们的经验，在没有业务案例的情况下就开始启动\
  \ IT 项目的情况异常常见。这可能会导致失败，因为没有业务案例，就不可能知道成功是什么样子的。你可能变得像《南方公园》里的“内裤小矮人”，他们的策略是：\n\n\
  1. 收集内裤。\n2. ?\n3. 盈利。\n\n如果没有业务案例，进行需求收集非常困难，而且无法客观地对收集到的需求进行优先级排序（这也适用于内部提供的服务）。即使有了它，你也可以确定，最终获得的应用程序或服务将与你在需求需求阶段脑海中的方案有显著差异。\n\
  \n在开始收集需求之前，另一个必备要素是利益者名单，其中最重要的是业务赞助者（在 `PRINCE2` 中被称为高级责任负责人）。每个项目应仅有一个业务赞助者，否则，不可避免地，任何合理规模的项目都会在完成之前就因为政治内斗而崩溃。这个业务所有者在\
  \ `Scrum` 中被称为 `product owner`（产品所有者），在其他敏捷学科中被称为 `customer`（客户）。然而，除了业务所有者外，每个项目还需要一个由利益相关方组成的指导委员会——在公司内部，这将包括其他高管和其他服务的用户代表；对于产品而言，它可能包括该产品的知名或具有代表性的客户。IT\
  \ 项目的其他内部利益者还包括运营、销售、市场和支持人员，当然还有开发和测试团队。所有这些利益者都应该在项目的下一个阶段：构思中代表。\n\n### 构思\n\n\
  最简单的描述是在编写任何生产代码之前的阶段。通常，在此期间会收集和分析需求，并对项目进行粗略范围划分和规划。人们很容易认为这个阶段价值很低，但即使是那些硬核敏捷派作者也从痛苦的经验中学到，为了让软件项目成功，这个阶段需要经过仔细的规划和执行。\n\
  \n构思会有许多交付物，其中某些取决于方法论和项目类型。然而，大多数构思阶段应包含以下内容：\n\n- 业务案例，包括项目的估计价值。\n- 高层功能性和非功能性需求列表（特别针对容量、可用性、服务连续性和安全性），其细节足以估算所涉及的工作并规划项目。\n\
  - 发布计划，其中包含工作进度表和与项目相关的成本。为了获取这些信息，通常需要估计需求的相对大小、所需的编码工作量、每个需求相关的风险以及人员计划。\n- 测试策略。\n\
  - 发布策略（稍后详述）。\n- 架构评估，导致对使用什么平台和框架的决策。\n- 风险和问题日志。\n- 开发生命期的描述。\n- 执行此清单的计划描述。\n\
  \n\n\n\n\n这些交付物应该包含足够的细节，以便启动项目工作，目标是在最多几个月内交付某些内容，如果可能的话则更短。根据我们的经验，合理的项目最大周期约为三到六个月——我们更倾向于下限。在完成启动流程（inception\
  \ process）后，应该根据项目的估算价值、估计成本和预测风险，对项目是否继续做出通过/否（go/no-go）决策。\n\n启动过程中最重要的部分——即确保项目有成功机会——是让所有利益相关者面对面聚集。这意味着开发人员、客户、运营人员和管理层。这些人之间的对话导致了对要解决的问题及其解决方案的共同理解，而这才是真正的交付物。上述列表旨在结构化对话，以确保讨论重要问题、识别风险，并制定出应对这些风险的策略。\n\
  \n这些交付物应该被记录下来，但由于它们是活文档，我们预计每份文档在整个项目过程中发生变化。为了以可靠的方式跟踪这些变化——以便每个人都能轻松地看到当前状况——你应该将这些文档提交到版本控制系统中。\n\
  \n有一点警告：你在项目此阶段做出的每一个决策都是基于推测的，并且会发生变化。你产生的内容是根据你拥有的少量信息做出的最佳猜测。在项目的这个阶段投入过多的精力——即你对项目了解最少的这一阶段——是错误的。这些是至关重要的规划讨论和方向设定，但预计在执行过程中对其中许多内容进行完善和重新定义。成功的项目能够成功地应对变化。试图避免变化的项目往往会失败。在项目的此阶段进行详细的计划、估计或设计是浪费金钱。泛化的决策是此阶段唯一的持久决策。\n\
  \n## 启动 (Initiation)\n\n在启动之后，你应该建立初始的项目基础设施。这是启动阶段，通常持续一到两周。以下列表描述了典型的启动阶段活动。\n\
  \n* 确保团队（分析师和经理，以及开发人员）拥有开始工作所需的硬件和软件\n* 确保基础基础设施已就位——如互联网连接、白板、纸笔、打印机、食物和饮料\n*\
  \ 创建电子邮件账户并为人员分配访问资源的权限\n* 设置版本控制\n* 设置基础的持续集成环境\n* 同意角色、职责、工作时间和会议时间（例如：站会、计划会议和演示）\n\
  * 为第一周准备工作并达成目标（注意不是截止日期）\n* 创建简单的测试环境和测试数据\n* 对预期的系统设计进行稍详细的观察：在这个阶段，探索可能性真的是目标\n\
  * 通过进行冲刺测试（spikes，即为特定需求设计的作为概念验证的弃式实现）来识别并缓解任何分析、开发和测试风险\n* 开发故事或需求待办列表（backlog）\n\
  * 设置项目结构并使用最简单的故事（即架构层面的“Hello World”），包括一个构建脚本和一些测试以启动持续集成\n\n分配足够的时间来从容地完成这些任务至关重要。如果没有人对正在开发的初始需求有验收标准，且团队成员正在使用配置不当、工具糟糕且互联网访问不稳定的计算机进行工作，那么尝试开始工作将是徒劳无功且打击士气的。\n\
  \n虽然项目的这一阶段的真正目标是建立基础项目基础设施，且不应被视为真正的开发迭代，但使用现实世界的问题来让一切运行起来是非常用的。在无物可测时构建测试环境，或在无处存储时设置版本控制系统，是一种枯燥且低效的开始方式。选择你能找到的最简单的需求，前提是它正在解决一个真实问题并在设计方面建立了一些初始方向。使用这个故事来确保你可以正确对结果进行版本控制，可以在你的\
  \ `CI` 环境中运行测试，并且可以将结果部署到手动测试环境中。目标是在启动阶段结束前完成并演示这个故事，并建立所有支持性的基础设施。\n\n一旦你完成了这些工作，就可以开始实际的开发了。\n\
  \n## 开发与发布 (Develop and Release)\n\n自然，我们建议采用迭代和增量的过程来开发和发布软件。唯一可能不适用的情况是当你正在处理一个涉及许多方的大型防御项目——但即使是航天飞机软件也是使用迭代过程实现的。尽管许多人都认同迭代过程的益处，但我们经常看到一些声称在进行迭代开发但实际上并非如此的团队。因此，重申我们认为的迭代过程的基本、本质条件是值得的。\n\
  \n* 你的软件始终处于运行状态，由自动化测试套件证明，包括单元测试、组件测试和端到端验收测试，这些测试会在每次提交（check in）时运行。\n* 你在每次迭代中都会将良好的软件部署到类生产环境中向用户展示（这除了迭代性之外，还使得该过程具有增量特性）。\n\
  * 迭代周期不超过两周。\n\n使用迭代过程有几个原因：\n\n* 如果你优先考虑具有高业务价值的功能，你可能会发现软件在项目结束很久以前就开始变得有用。通常有充分理由不在软件具有有用功能时立即发布新软件——但没有什么更好的方法能将对项目最终成功的担忧转化为对新功能的兴奋了，那就是一个人们可以使用的系统。\n\
  * 你可以从客户或赞助者那里获得定期反馈，了解哪些是有效的，哪些需求需要澄清或更改，这反过来意味着你所做的更有用。在项目开始时，没有人知道他们真正想要什么。\n\
  * 只有当客户签字时，任务才真正完成。定期举行此类演示是跟踪进度的唯一尚算可靠的方法。\n* 让你的软件始终运行（因为你必须演示它）会在你的团队中培养纪律，防止诸如长期的集成阶段、破坏一切的重构练习以及失去焦点且毫无进展的实验等问题。\n\
  * 可能重要的是，迭代方法强调在每次迭代结束时拥有`生产就绪`的代码。这是软件项目中唯一真正的进度衡量标准，也是只有迭代方法才能提供的。\n\n\n\n\n\n\
  经常被引用的不采用迭代开发的一个理由是：在完成海量功能之前，整个项目将无法交付任何价值。虽然这种门槛对于许多项目来说可能是真实存在的，但我们上面列表中的最后一点在这种情况情况下尤为适用。在管理非迭代开发的大型项目时，所有的进度衡量标准都是主观的，无法量化项目的实际进度。你在非迭代方法中看到的那些精美的图表，是基于对剩余时间的估计，以及对后期集成、部署和测试的风险与成本的猜测。迭代开发提供了一种进度速率的客观衡量，这种速率是基于开发团队产生用户认为符合用途的运行软件的速率。只有生产就绪的运行代码——即你能够与之交互的代码，即使是在\
  \ UAT（用户验收测试）环境中——才能保证某个特定功能已真正完成。\n\n至关重要的是，生产就绪还意味着软件已经在类生产环境中使用具有生产级规模的数据集对其非功能性需求进行了测试。你所关心的任何非功能性特征（如容量、可用性、安全性等）都应该使用真实的负载和使用模式进行测试。这些测试应该是自动化的，并针对每一个通过验收测试的软件版本运行，这样你就能知道你的软件始终可用。我们将在第\
  \ 9 章“测试非功能性需求”中详细介绍这一点。\n\n迭代开发过程的关键在于优先级排序和并行化。工作被进行优先级排序，以便分析师能够开始分析最有价值的功能，并将工作交给开发人员，然后交给测试人员，最后向真实用户或其代理进行展示。利用精益生产中的技术，这些工作可以并行化，并改变处理每项任务的人数以消除瓶颈。这将导致非常高效的开发过程。\n\
  \n迭代和增量开发有许多方法。最流行的之一是 Scrum，这是一种敏捷开发流程。我们见过 Scrum 在许多项目中成功，但也见过了它的失败。以下是失败的三个常见原因：\n\
  \n- **缺乏承诺**。转型到 Scrum 可能是一个令人恐惧的过程，特别是对于项目领导层而言。确保每个人定期聚会讨论进展，并建立定期的回顾会议来分析性能并寻求改进。敏捷流程依赖于透明度、协作、纪律和持续改进。当实施敏捷流程时，突然出现的大量有用会将此前隐藏的、尴尬的真相推向灯光下。关键在于意识到这些问题一直存在。既然你已经知道了它们，就可以修复它们。\n\
  \n- **忽略良好的工程实践**。Martin Fowler（Martin Fowler）等人描述了如果遵循 Scrum 的人认为可以忽略测试驱动开发、重构和持续集成等技术实践\
  \ [99QFUz]，会发生什么。被初级开发人员搞乱的代码库无法仅通过任何开发流程自动修复。\n\n- **调整直到流程不再是敏捷的**。人们将敏捷流程“调整”为他们认为在特定组织中运行效果更好的做法，是很常见的。毕竟，敏捷流程的设计初衷是为了定制以满足单个项目的需求。然而，敏捷流程的各个元素往往以微妙的方式相互作用，人们很容易误解价值所在，特别是对于那些没有这些迭代流程背景的人来说。无论如何强调都不为，从假设所写的内容是正确的开始并首先按照书面流程执行是多么重要的了。只有在你看到它是如何运作的之后，才应该开始针对你的组织对其调整。\n\
  \n最后一点让诺基亚（Nokia）感到如此困扰，以至于他们创建了一个测试来评估他们的团队是否真的在执行 Scrum。该测试分为两个部分。\n\n### 你在进行迭代开发吗？\n\
  \n- 迭代必须被限制在四周以内。(([2) \n- 软件功能在每次迭代结束时必须经过测试并能够正常运行。\n- 迭代必须在规范完成之前开始。\n\n### 你在执行\
  \ Scrum 吗？\n\n- 你知道产品所有者（Product Owner）是谁吗？\n- 产品待办（Product Backlog）是否根据业务价值进行了优先级排序？\n\
  - 产品待办是否有由团队创建的估计？\n- 是否有项目经理（或其他）干扰团队的工作？\n\n为了澄清最后一点，我们认为项目经理可以通过管理风险、消除资源缺乏等障碍以及促进高效交付来发挥有用作用。但确实有一些项目经理这些事一都不做。\n\
  \n#### 运行\n\n通常，第一次发布不是最后一次。接下去发生的情况很大程度上取决于项目。开发和发布阶段可能会继续全速进行，或者团队规模可能会缩小。如果项目是一个试点，情况可能相反，团队可能会扩大。\n\
  \n一个真正的迭代和敏捷流程中一个有趣的方面是：在许多方面，项目的运行阶段并不一定不同于常规开发阶段。正如我们所说，大多数项目不会在第一次发布时停止，而是将继续开发新功能。有些项目将有一系列维护发布，也许是为了修复不可预见的问题，也许是为了调整项目以满足新发现的用户需求，也许是作为滚动开发计划的一部分。在所有这些情况下，新功能都将经过识别、排序、分析、开发、测试和发布。这与项目的常规开发阶段没有区别。在这方面，将这些阶段合并在一起是消除风险的最佳方法之一，也是本书其他部分所描述的持续交付的核心。\n\
  \n正如我们在本节早些提到的，将发布时间推早到任何给定系统认为有意义的最早点是有用的。你将获得的最佳反馈来自真实用户；这里的关键是尽早发布你的软件供实际使用。这样你就可以尽快对有关软件可用性和实用性的任何问题或反馈做出反应。尽管如此，在系统发布给用户使用之前和之后的项目阶段，仍考虑一些差异。特别是针对应用程序及其公共接口生成的数据变更管理，在首次发布后会变成一个重大问题（参见第\
  \ 12 章“管理数据”）。\n\n### 风险管理流程\n\n风险管理是确保：\n\n- 项目的主要风险已被识别。\n- 已实施适当的缓解策略来管理这些风险。\n\
  - 在整个项目过程中持续识别并管理风险。\n\n一个风险管理流程应该具有以下几个关键特征：\n\n- 项目团队报告状态的标准化结构\n- 项目团队按照标准定期更新进展\n\
  - 项目经理可以使用一个跟踪所有项目当前状态和趋势的仪表板\n- 由项目之外的人员进行定期审计，以确保风险得到有效管理。\n\n#### 风险管理 101\n\n\
  \n\n\n需要注意的是，并非所有风险都需要制定缓解策略。某些事件是极具灾难性的，一旦发生，无法采取任何措施来缓解其影响。一颗巨大的小行星摧毁地球上所有的生命就是一个极端例子，但你明白我们的意思。现实中，通常存在某些特定的项目风险会导致项目取消，例如法律或经济变化、组织管理结构的变动，或关键项目赞助人的离职。如果一个缓解策略的成本过高或耗时过长，以至于不值得实施，那么制定它就意义不大——例如，为一家小公司的时间费用应用程序建立一套多站点多节点备份系统。\n\
  \n一种常见的风险管理模型（参见 Tom DeMarco 和 Timothy Lister 著的 *Dancing with Bears*）根据 `impact`（影响）——即风险发生时会造成多大损害——以及\
  \ `likelihood`（可能性）——其发生的概率对所有风险进行分类。将这两者结合可以评估每个风险的严重程度。用财务角度来考虑影响是最容易的：如果风险发生，会损失多少钱？然后可以将发生概率建模为\
  \ 0（不可能）到 1（确定）之间的概率。严重程度即为影响乘以概率，从而给出一个金额意义上的风险严重程度估计。这让你在决定采取什么策略来缓解风险时可以进行非常简单的计算：缓解策略的成本是否高于风险的严重程度？如果是，那么可能就不值得实施。\n\
  \n## 风险管理时间线\n\n根据我们在本章前面介绍的项目生命周期模型，风险管理过程应该在构思阶段（inception）结束时开始，在启动阶段（initiation）结束时审视，然后在整个开发和部署阶段定期审视。\n\
  \n### 构思阶段结束\n\n在此阶段有两个重要的交付物应该准备就。第一个是作为构思阶段的一部分创建的发布策略。你应该验证我们在“创建发布策略”章节中讨论的所有考虑因素是否都已考虑在内。如果没有考虑，团队计划如何管理相关风险？\n\
  \n第二个交付物是启动阶段的计划。有时构思阶段和启动阶段之间存在空隙，在这种情况下，该计划可以推迟到启动前几天。否则，它需要作为启动结束的一部分来完成。\n\n\
  ### 启动阶段结束\n\n这里的关键是确保团队已准备好开发软件。他们应该已经运行着一个持续集成服务器，用于编译代码（如果适用）并运行自动化测试套件。他们应该有一个用于部署的类生产环境。应该有一套测试策略，说明如何通过作为部署流水线一部分的自动化测试套件，对应用程序的功能和非功能（特别是容量）需求进行测试。\n\
  \n### 开发与发布的风险缓解\n\n即使有最好的准备，开发和部署阶段仍有许多方式可能变得非常糟糕，有时甚至比你想象的还要快。我们都经历过或听过关于项目的恐怖故事：项目直到部署日期之后都没有交付任何代码，或者系统虽然部署了但由于容量问题立即失败。在整个阶段，你需要问自己的问题是：“可能会发生什么差错？”因为如果你不问自己这个问题，当问题真的发生时，你将没有准备好答案。\n\
  \n在许多方面，风险管理的真正价值在于它为开发建立了一个背景，从而培养了一种深思熟虑、风险意识的开发方法。以团队形式考虑可能发生什么错误行为，可以作为具体需求的来源（而这些需求可能会被遗漏），但也允许我们对风险给予足够的关注，在它变成问题之前避免它。如果你认为第三方供应商可能会错过截止日期，你将提前监控他们的进度，从而在截止日期到达之前有时间计划并应对这种延迟。\n\
  \n在这个阶段，你的目标是识别、跟踪并管理你能想到的任何可管理风险。识别风险有几种方法：\n\n* 查看部署计划。\n* 在每次演示（showcase）后进行定期的项目微回顾，并让团队在会议期间进行风险脑脑暴。\n\
  * 将风险识别成为每日站立会议的一部分。\n\n有几种常见的构建相关和部署相关的风险需要警惕——我们将在下一节介绍这些。\n\n## 如何进行风险管理练习\n\n\
  不要打扰一个按时交付工作软件且缺陷较少的团队是重要的。然而，如果一个项目从外部看运行良好但实际上将失败，迅速发现这一点也至关重要。幸运的是，迭代方法的一个巨大益处之一就是发现是否是这种情况下相对简单。如果你正在进行迭代开发，你应该在每次迭代结束时从类生产环境展示工作软件。这可能是展示实质进展的最佳方式。你的团队生产真实可用代码（足够真实用户使用）并将其部署到类生产主机环境的速率——即速度（velocity）——是不撒谎的，即使估算会。\n\
  \n将其与非迭代方法相比——或者说，与迭代周期过长的迭代方法相比。在这样的项目中，必须进入团队运作的细节，深入研究各种项目文档和跟踪系统，以找出还有多少工作未完成以及已经完成了多少。一旦完成了这种分析，就有必要根据现实验证你的结果，这是一个极其困难且不可靠的过程，任何尝试过这样做的人都可以证实这一点。\n\
  \n分析任何项目的良好起点是提出这些问题（这个列表在我们的几个项目中效果很好）：\n\n* 你们如何跟踪进度？\n* 你们是如何防止缺陷的？\n* 你们是如何发现缺陷的？\n\
  * 你们是如何跟踪缺陷的？\n* 你们如何知道一个故事完成了？\n* 你们如何管理环境？\n* 你们如何管理配置，例如测试用例、部署脚本、环境和应用程序配置、数据库脚本以及库？\n\
  * 你们多久展示一次功能？\n* 你们多久进行一次回顾？\n* 你们多久运行一次自动化测试？\n* 你们如何部署软件？\n* 你们如何构建软件？\n* 你们如何确保发布计划可行且被运营团队接受？\n\
  * 你们如何确保风险和问题日志是最新的？\n\n这些问题不是规定性的，这很重要，因为每个团队都需要一定的灵活性来根据特定需求选择合适的流程。相反，它们是开放式的，确保你能够尽可能地获取有关项目背景和方法的信息。\n\
  \n\n\n\n\n在本节中，我们将描述在软件构建、部署、测试和发布过程中可能出现的一些常见问题。虽然你的项目中几乎可能出现*任何**差问题，但某些问题比其他问题更容易发生。通常，要弄清楚项目*实际上*出了什么问题是非常困难的——你所拥有的只有症状。当问题发生时，要找出如何才能更早地发现这些问题，并确保这些症状得到了监控。\n\
  \n一旦你观察到了症状，就需要发现其根源。任何给定的症状可能是许多潜在根本原因的体现。为了做到这一点，我们使用了一种名为“根因分析”的技术。这只是对一个非常简单程序的华丽写法。当面对一组症状时，只需表现得像小孩子一样，反复向团队询问：“为什么？”。我们建议你至少问五次“为什么”。尽管这个过程听起来近乎荒谬，但我们发现它是极其有用且完全万无一失的。\n\
  \n一旦你知道了根源，你就必须实际去修复它。然而，这超出了保证工作的范畴。因此，话话长说，以下是按根源分类的常见症状列表。\n\n## 不频繁或多 Bug 的部署\n\
  \n### 问题\n构建部署需要很长时间，且部署过程非常脆弱。\n\n### 症状\n- 测试人员关闭 Bug 需要很长时间。请注意，这种症状可能并非完全由部署不频繁引起，但它是可能的根源之一。\n\
  - 故事（Stories）的测试或由客户验收需要很长时间。\n- 测试人员发现了开发者很久以前就修复过的 Bug。\n- 没有人信任 `UAT`、性能环境或 `CI`\
  \ 环境，人们对何时能发布发布表示怀疑。\n- 演示（Showcases）很少发生。\n- 应用程序很难演示其运行正常。\n- 团队的速率（进展速度）低于预期。\n\
  \n### 可能的原因\n有很多可能的原因。以下是几个最常见的原因：\n- 部署过程没有自动化。\n- 没有足够的可用硬件。\n- 硬件和操作系统的配置没有正确管理。\n\
  - 部署过程依赖于团队控制之外的系统。\n- 没有足够的人理解构建和部署过程。\n- 测试人员、开发者、分析师和运维人员在开发期间的协作不足。\n- 开发者没有自律地通过微小的、增式的更改来保持应用程序运行，因此经常破坏现有功能。\n\
  \n## 应用程序质量差\n\n### 问题\n交付团队未能实施有效的测试策略。\n\n### 症状\n- 回归 Bug 不断出现。\n- 即使你的团队花费了大部分时间修复缺陷，缺陷数量仍在增加（当然，这种症状只有在你拥有有效的测试流程时才会表现出来）。\n\
  - 客户抱怨产品质量差。\n- 每当有新功能请求到来时，开发者就会叹气并显得很惊恐。\n- 开发者抱怨代码的可维护性，但情况从未好转。\n- 实现新功能所需的时间越来越长，团队开始落后。\n\
  \n### 可能的原因\n这个问题本质上有两个源头：测试人员与交付团队其他成员之间的协作不畅，以及自动化测试的实施不当或不足。\n- 测试人员在功能开发期间没有与开发者协作。\n\
  - 故事或功能在没有编写全面的自动化测试、没有经过测试人员验收、或没有从类生产环境向用户演示的情况下，就被标记为“已完成”。\n- 缺陷被例性地录入待办列表（backlog），而没有现场修复，也没有通过自动化测试来检测回归问题。\n\
  - 开发者或测试人员没有足够的经验开发自动化测试套件。\n- 团队不理解对于他们正在开发的技术或平台应该编写的最有效的测试类型。\n- 开发者在没有足够的测试覆盖的情况下工作，可能是因为他们的项目管理没有给他们留实施自动化测试的时间。\n\
  - 系统是一个将被丢弃的原型（尽管我们遇到过几个最初作为原型开发但从未被丢弃的重要生产系统）。\n\n请注意，自动化测试做得过头当然也是可能的——我们知道有一个项目，整个团队花了几周时间只写了测试代码。当客户发现没有可以运行的软件时，该团队被解雇了。然而，这个教训故事应该结合背景来看：到目前为止，最常见的失败模式是自动化测试太少，而不是太多。\n\
  \n## 管理不当的持续集成过程\n\n### 问题\n构建过程没有得到妥善管理。\n\n### 症状\n- 开发者提交（check in）频率不够（至少每天一次）。\n\
  - 提交阶段一直处于损坏状态。\n- 缺陷数量很多。\n- 每次发布之前都有很长的集成阶段。\n\n### 可能的原因\n- 自动化测试运行时间太长。\n- 提交阶段运行时间太长（理想情况是五分钟以内，超过十分分钟是不可接受的）。\n\
  - 自动化测试间歇性失败，产生假阳性。\n- 没有人被授权回滚提交。\n- 没有足够的人理解并能对 `CI` 过程进行更改。\n\n## 配置管理不善\n\n\
  ### 问题\n无法使用自动化过程对环境调试并可靠地安装应用程序。\n\n### 症状\n- 生产环境中出现神秘的故障。\n- 新部署是紧张、可怕的事件。\n\
  - 大团队专门负责环境配置和管理。\n- 生产环境的部署经常需要回滚或补丁。\n- 生产环境出现不可接受的停机。\n\n### 可能的原因\n- `UAT` 和生产环境不同。\n\
  - 用于更改生产和测试环境的变更管理流程糟糕或执行不力。\n- 运维、数据管理团队与交付团队之间的协作不足。\n- 对生产和测试环境的监控无效，无法检测事件。\n\
  - 应用程序内置仪表和日志记录不足。\n- 对应用程序非功能性需求的测试不足。\n\n### 合规性与审计\n许多大公司需要遵守其行业的法律约束性法规。例如，所有美国注册上市公司都必须遵守\
  \ 2002 年的《萨班斯-奥克斯利法案》（通常简称为 `Sarbox` 或 `SOX`）。美国医疗保健公司必须遵守 `HIPAA` 的规定。处理信用卡信息的系统必须符合\
  \ `PCI DSS` 标准。几乎每个领域都以某种方式受到监管，因此在设计 IT 系统时，经常需要考虑某些法规。\n\n我们既没有空间也没有精力去研究每个国家每个行业的法规，这些法规在任何情况下都会频繁变化。然而，我们想花些时间讨论一般的合规性问题，特别是对于软件发布过程有严格控制的环境。许多此类监管方案要求建立审计追踪，以便能够识别生产环境中的每项更改源自哪些代码行、谁接触过这些代码，以及谁批准了流程中的步骤。此类法规从金融到医疗保健的许多行业中都很常见。\n\
  \n以下是我们看到的用于执行此类法规规定的一些常用策略：\n\n- 限制能够访问“特权”环境的人员。\n\n\n\n\n\n-   为特权环境的变更建立建立并维护一个有效且高效的变更管理流程。\n\
  -   要求在执行部署之前必须获得管理层的批准。\n-   要求从构建到发布的每一个过程都必须记录在案。\n-   创建授权屏障，确保创建软件的人员无法将其部署到生产环境，以防止潜在的恶意干预。\n\
  -   要求对每次部署进行审计，以确切知道正在进行了哪些更改。\n\n此类策略对于受监管的组织来说至关重要，并且能够大幅减少停机时间和缺陷数量。尽管如此，它们的声誉并不好，因为人们很容易以让变更变得困难的方式来实现它们。然而，部署流水线（deployment\
  \ pipeline）使得以相当容易执行这些策略变得可能，同时又能实现高效的交付过程。在本节中，我们将介绍一些原则和实践，以确保在保持短周期的同时，符合此类监管制度的要求。\n\
  \n## 自动化优于文档\n\n许多公司坚持文档是审计的核心。我们对此持不同意见。一张写着你以某种方式做了某事的纸张，并不能保证你真的做了那件事。咨询行业充斥着这样的故事：人们（例如）通过提供一大堆“证明”他们已实施了相关要求的文档通过了\
  \ `ISO 9001` 审计，并指导员工在检查员提问时如何给出正确答案。\n\n文档还有一个过时的坏习惯。文档越详细，它就越快可能过时。当这种情况发生时，人们通常懒得去更新它。每个人都至少听过一次以下对话：\n\
  \n操作员：“我遵循了你上个月发邮件给我的部署流程，但它行不通。”\n\n开发者：“哦，我们更改了部署方式。你需要复制这套新文件并设置权限 `x`。” 或者更糟糕，“这很奇怪，让我看看……”\
  \ 接着就是花几个小时来弄清楚发生了什么变化以及如何进行部署。\n\n自动化解决了所有这些问题。自动化脚本是你的*必须*运行的流程文档。通过强制使用这些脚本，你既确保了它们是最新的，又确保了流程是完全按照你的意图执行的。\n\
  \n## 强制可追溯性\n\n通常需要能够追溯更改的历史，从生产环境的内容到生成它的源代码控制版本。有两项有助于这一过程的实践，我们想要强调它们：\n\n- \
  \  只创建一次二进制文件，并将构建过程第一阶段创建的二进制文件部署到生产环境。你可以通过对二进制文件进行哈希处理（例如使用 `MD5` 或 `SHA1`）并将其存储在安全的数据库中来确保二进制文件是相同的。许多工具会自动为你完成这一点。\n\
  -   使用全自动化的流程让二进制文件通过部署、测试和发布过程，并记录谁在什么时候做了什么。同样，市场上有多种工具可以提供此类帮助。\n\n即使有了这些措施，仍然存在一个可以引入未经授权更改的窗口：即从源代码首次创建二进制文件时。只需要有人访问了执行此操作的机器，并在编译或组装过程中向文件系统插入文件，这种情况就会发生。解决这个问题的方法之一是使用自动化流程在受访问控制的机器上单步创建二进制文件。在这种情况下，自动配置和管理此环境至关重要，以便能够调试创建过程中的任何问题。\n\
  \n## 访问控制与强制可追溯性\n\n我们的同事之一 Rolf Russell 在一家金融服务公司工作，该公司公司对可追溯性特别严格，以保护他们的知识产权。为了确保部署到生产环境的代码与提交到版本控制系统的代码确实相同，他们对要部署的二进制文件进行了反编译。将反编译的结果与生产环境中内容的反编译版本进行比较，以查看进行了哪些更改。\n\
  \n在同一家公司，只有 CTO 有权将某些业务关键应用程序部署到他们的生产环境。每周，CTO 都会留出几个小时进行发布，在此期间人们会来她的办公室，由她运行脚本来执行部署。在写本文期间，公司正转向一种系统，允许用户从一个需要\
  \ ID 卡访问的房间内的单一终端自行部署某些应用程序。该房间内有一台 CCTV 摄像头，每天 24 小时记录所有活动。\n\n## 在部门孤岛中工作\n\n\
  大型组织通常为不同的职能设有不同的部门。许多组织拥有负责开发、测试、运维、配置管理、数据管理和架构的独立团队。在本书的大部分内容中，我们提倡团队之间以及团队内部开放、自由的沟通与协作，因此在组织中负责软件创建和发布不同层面的部分之间建立屏障存在某些危险。然而，某些责任应该明确地属于一个小组而不是另一个。在受监管的环境中，许多重要活动都要经过审计员和安全团队的审查，他们的工作是确保组织不会面临法律风险或任何形式的安全漏洞。\n\
  \n这种职责的分工，在正确的时间点并以正确的方式管理，并不一定是坏事。理论上，每个为组织工作的人都会将该组织的最佳利益置于心中，这意味着他们将与其他部门有效协作。然而，事实往往并非如此。几乎例外，这种协作的缺乏都源于小组之间沟通的不畅。我们坚信，最有效的团队是在跨职能小组中开发软件的，这些小组由定义、开发、测试和发布软件所需的所有不同领域的人员组成。这些小组应该坐在一起——如果没有这样做，他们就无法从彼此的知识中获益。\n\
  \n某些监管制度使得建立此类跨职能小组变得困难。如果你处于一个孤岛化的组织中，书中描述的流程和技术（特别是实施部署流水线）有助于防止这些孤岛降低交付过程的效率。然而，最重要的解决方案是从项目开始就开始沟通，这应该以多种形式出现：\n\
  \n-   参与项目交付的每个人（包括每个部门的人员）应在项目开始时开会。我们将这群人称为发布小组，因为他们的工作是保持发布流程正常运行。他们的任务应该是为项目制定发布策略，详见第\
  \ 10 章，“部署和发布应用程序”。\n-   发布小组在整个项目进行期间应定期会议。他们应该对上次会议以来的项目进行回顾，计划如何改进，并执行计划。使用戴明循环：计划、执行、检查、行动。\n\
  \n\n\n\n\n• 即使软件还没有用户，也应该尽可能地发布到类似于生产的环境中——这意味着至少在每次迭代时发布一次。有些团队实践持续部署，这意味着发布每一个通过了流水线中所有阶段的更改。这是对这一原则的应用：“如果它让你很痛苦，就更频繁地执行它。”我们如何强调这种做法有多重要都不为过。\n\
  \n• 项目状态（包括我们在第 431 页 的“风险管理流程”章节中提到的仪表板）应该对所有参与构建、部署、测试和发布过程的人可见，最好显示在每个人都能看到的大显示器上。\n\
  \n## 变更管理\n\n在受监管的环境中，构建、部署、测试和发布过程的部分通常需要审批。特别是手动测试环境、暂存环境（staging）和生产环境应该始终处于严格的访问控制下，以便这些环境的更改只能通过组织的变更管理过程进行。这似乎是不必要的官僚主义，但事实上，研究表明，这样做的组织的平均故障间隔时间（`MTBF`）和平均修复时间（`MTTR`）较低（参见\
  \ *The Visible Ops Handbook*，第 13 页）。\n\n如果你的组织由于测试和生产环境的不受控更改而无法满足其服务水平，我们建议采用以下流程管理审批：\n\
  \n• 建立一个变更委员会（CAB），由来自开发团队、运营团队、安全团队、变更管理团队和业务部门的代表组成。\n\n• 决定哪些环境属于变更管理过程的范畴。确保这些环境受到访问控制，以便更改只能通过此过程进行。\n\
  \n• 建立一个自动化变更请求管理系统，用于提交变更请求和管理审批。任何人都应该看到每个变更请求的状态以及谁批准了它。\n\n• 每当任何人想要对环境进行更改时，无论是部署应用程序的新版本、创建新的虚拟环境还是进行配置更改，都必须通过变更请求完成。\n\
  \n• 为每项更改都要求提供补救策略（例如回滚的能力）。\n\n• 为更改的成功设定验收标准。理想情况下，创建一个现在失败但在更改成功后将通过的自动化测试。在你的运营管理仪表板上放置一个测试状态的指示器（参见第\
  \ 323 页 的“行为驱动监控”章节）。\n\n• 拥有一个应用更改的自动化流程，这样每当更改被批准后，就可以通过按下按钮（或点击链接，或其他方式）来执行。\n\
  \n最后一部分听起来很困难，但我们希望到这里它听起来也很熟悉，因为这一直是本书的重点。向生产环境部署经过审计和授权的更改的机制，与将相同更改部署到任何其他环境是相同的，增加了授权环节：在部署流水线中添加访问控制是一项轻而易举的任务。它是如此简单，以至于进一步扩展审计授权是有意义的：所有更改都由环境的所有者批准。这意味着你可以使用为测试环境创建的相同自动化工具来对属于变更管理过程的环境进行更改。这也意味着你已经测试了所创建的自动化流程。\n\
  \n`CAB` 如何决定是否执行某项更改？这只是风险管理的问题。进行更改的风险是什么？收益又是什么？如果风险大于收益，则不应进行该更改，或者应该进行另一个风险较小的更改。`CAB`\
  \ 还应该能够对工单发表评论、请求更多信息或建议修改。所有这些过程都应该通过自动化工单系统进行管理。\n\n最后，在实施和管理变更审批流程时，还应该遵循三个原则：\n\
  \n• 保持系统指标并使其可见。一个更改获得批准需要多长时间？有多少个更改正在等待审批？被拒绝的更改比例是多少？\n\n• 保持验证系统成功的指标并使其可见。`MTBF`\
  \ 和 `MTTR` 是多少？更改的周期时间是多少？ITIL 文献中定义了更完整的指标列表。\n\n• 定期对系统进行回顾，邀请你组织中每个部门的代表，并根据这些回顾的反馈来改进系统。\n\
  \n## 总结\n\n管理对于每个项目的成功至关重要。良好的管理创建了实现高效软件交付的流程，同时确保风险得到妥善管理并符合监管规定。尽管如此，太多的组织——尽管初衷良好——却创建了糟糕的管理结构，无法实现任何这些目标。本章旨在描述一种兼顾合规性和性能的管理方法。\n\
  \n我们的构建和发布成熟度模型旨在提高组织性能。它允许你识别交付实践的有效性如何，并建议改进它们的方法。这里描述的风险管理流程连同我们的常见反模式列表，旨在帮助你建立策略，在问题发生时立即识别它们，以便你能够在容易修复时尽早纠正。我们在本章（以及本书）中花了很大篇幅讨论迭代、增量流程；这是因为迭代、增量交付是有效风险管理的关键。如果没有迭代、增量的流程，你就没有客观的方法来衡量项目进度或应用程序的适用性。\n\
  \n最后，我们希望已经证明，迭代交付结合封装在部署流水线中的用于构建、部署、测试和发布软件的自动化流程，不仅与合规性和性能目标兼容，而且是实现目标的最有效方法。这一过程能够让软件交付人员之间产生更好的协作，提供快速反馈以便发现\
  \ Bug 以及不必要的或实现不当的功能，并为减少关键指标周期时间铺平道路。这反过来意味着更快地交付高质量软件，以更低的风险获得更高的利润。因此，实现了良好治理的目标。\n\
