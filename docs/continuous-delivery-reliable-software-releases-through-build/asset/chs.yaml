  \ Kent Beck，当时他在瑞士的一家保险公司工作。他向我展示了他的项目，他那支高度自律的团队有趣的方面之一是，他们每天都会将软件部署到生产环境中。这种定期的部署带给他们许多优势：编写好的软件不再无用地等待发布，他们可以快速地响应问题和机会，而快速的周转使他们与业务客户以及最终客户之间建立了更深层的关系。\n\
  \n在过去的十年里，我在 ThoughtWorks 工作，我们项目的一个共同主题是缩短从想法到可用软件的周期。我看到了许多项目案例，几乎所有的案例都涉及坚决地缩短这一周期。虽然我们通常不进行每天部署到生产环境，但现在看到团队每两周发布一次已很常见。\n\
  \nDave 和 Jez 是这一巨大变化的一部分，他们积极参与了构建频繁、可靠交付文化的项目。他们和我们的同事将那些挣挣发布一次软件的组织带入了持续交付的世界，在那里，发布变成了家常便饭。\n\
  \n这种方法的基础（至少对开发团队而言）是持续集成（`CI`）。`CI` 让整个开发团队保持同步，消除了由于集成问题导致的延迟。几年前，Paul Duvall\
  \ 在本系列丛书中写了一本关于 `CI` 的书。但 `CI` 只是第一步。成功集成到主干代码流的软件仍然并不是在生产环境中发挥作用的软件。Dave 和 Jez\
  \ 的书从 `CI` 开始接力了这个故事，以处理那“最后一公里”，描述了如何构建将集成代码转换为生产软件的部署流水线。\n\n\n\n\n这种交付思维长期以来一直是软件开发中被遗忘的角落，处于开发人员与运维团队之间的鸿沟之中。因此，本书中的技术建立在将这些团队结合的基础上，这并不意外——这是初创但不断增长的\
  \ DevOps 运动的先驱。这一过程也涉及测试人员，因为测试是确保无错误发布的关键要素。贯穿这一切的是高度的自动化，以便任务能够快速且无误地完成。\n\n实现这一切需要付出努力，但其益处是深远的。长期的、高强度的发布将成为过去。软件客户看到想法迅速转化为他们每天都可以使用的代码。也许最重要的一点是，我们消除了软件开发中最大的压力来源之一。没有人喜欢为了在周一黎明前拼命发布系统升级版本而度过那些紧张的周末。\n\
  \n对我来说，一本能够教你如何频繁且在没有往常压力的情况下交付软件的书，简直是不读不划的。为了你的团队考虑，我希望你认同这一点。\n\n## 前言\n\n##\
  \ 引言\n\n昨天，你的老板要求你向客户演示系统的一大新功能，但你什么也展示不出来。你所有的开发者都在开发新功能，且目前没有一个能立即运行应用程序。你有代码，代码可以编译，所有的单元测试在你的持续集成服务器上都通过了，但要将新版本发布到公开访问的\
  \ UAT 环境需要几天时间。在如此短的通知内要求演示，难道不合理吗？\n\n你的生产环境中存在一个致命 Bug。它每天都在为你的业务带来损失。你知道修复方法：在三层架构的所有三层用到的一个库中添加一行代码，并对一个数据库表进行相应的更改。但你上一次向生产环境发布新版本时，花费了一个周末，工作到凌晨\
  \ 3 点，而负责部署的人员不久后愤愤地辞职了。你知道下一次发布将占用周末，这意味着应用程序在工作日期间将停机一段时间。如果业务部门能理解我们的问题就好了。\n\
  \n这些问题虽然非常常见，但并不是软件开发过程不可避免的后果：它们表明某些地方出了问题。软件发布应该是一个快速、可重复的过程。如今，许多公司每天都会发布多个版本。即使对于具有复杂代码库的大型项目，这也是可能的。在本书中，我们将向你展示如何做到。\n\
  \nMary 和 Tom Poppendieck 提问：“你的组织部署一个仅涉及一行代码的更改需要多长时间？你们是否是以可重复、可靠的方式为此的？”从决定需要进行更改到更改进入生产环境的时间被称为\
  \ `cycle time`（周期时间），它是任何项目都至关重要的指标。\n\n在许多组织中，周期时间是以周或月为单位的，而且发布过程显然既不可重复也不可靠。它是手动的，通常需要一个团队才能将软件部署到测试或暂存环境，更不用说到生产环境了。然而，我们遇到过同样复杂的项目，它们起初也是这样，但在广泛的重构后，团队能够针对关键修复实现几小时甚至几分钟的周期时间。这之所以可能，是因为创建了一个完全自动化、可重复且可靠的过程，让更改通过构建、部署、测试和发布各个各个阶段。自动化是关键。它允许开发人员、测试人员和运维人员只需点击按钮即可完成涉及软件创建和部署的所有常见任务。\n\
  \n本书描述了如何通过使从想法到实现业务价值的路径——周期时间——更短、更安全，从而彻底改变软件交付。\n\n软件在到达用户手中之前，不会产生任何收入。这是显而易见的，但在大多数组织中，将软件发布到生产环境是一个劳动密集型、易错且高风险的过程。虽然以月为单位的周期时间很常见，但许多公司的做法比这糟糕得多：周期超过一年的发布并未未。对于大型公司来说，从产生想法到发布实现该想法的代码，每延迟的一周都可能代表数百万美元的机会成本——然而，这些往往是周期时间最长的公司。\n\
  \n尽管如此，允许软件低风险交付的机制和流程尚未成为当大多数软件开发项目的一部分。\n\n我们的目标是让软件从开发人员手中交付到生产环境成为一个可靠、可预测、可见且很大程度上自动化的过程，并具有良好的理解且可量化的风险。通过我们在书中描述的方法，可以从产生想法到将实现该想法的可运行代码交付到生产环境仅需几分钟或几小时，同时提高所交付软件的质量。\n\
  \n交付成功软件相关的大部分成本都发生在第一次发布之后。这是支持、维护、添加新功能和修复缺陷的成本。对于通过迭代过程交付的软件来说尤为如此，因为第一次发布包含了为客户提供价值的最小功能量。因此，本书的书名为\
  \ `Continuous Delivery`（持续交付），它源自《敏捷宣言》的第一条原则：“我们的最高优先级是通过早期和持续交付有价值的软件来满足客户。”这反映了现实：对于成功的软件，第一次发布只是交付过程的开始。\n\
  \n我们在书中描述的所有技术都减少了向用户交付软件新版本所涉及的时间和风险。它们通过增加反馈以及改进负责交付的开发、测试和运维人员之间的协作来实现。这些技术确保了，当你需要修改应用程序（无论是修复\
  \ Bug 还是交付新功能）时，从进行修改到结果部署并投入使用的时间尽可能短，问题在容易修复时尽早发现，并且风险得到了充分理解。\n\n### 本书是谁写的？涵盖了哪些内容？\n\
  \n本书的主要目标之一是改进负责交付软件的人员之间的协作。特别是我们考虑到开发人员、测试人员、系统和数据库管理员以及经理。\n\n我们涵盖的主题了从传统的配置管理、源码控制、发布计划、审计、合规和集成，到构建、测试和部署过程的自动化。我们还描述了如自动化验收测试、依赖管理、数据库迁移以及测试和生产环境的创建与管理等技术。\n\
  \n\n\n\n这是一个雄心勃勃的目标，而且我们显然无法在一本书中详细涵盖所有这些主题。事实上，我们面临着疏远每个目标受众的风险：对于开发者，是因为没有深入探讨架构、行为驱动开发和重构等主题；对于测试人员，是因为没有在探索测试和测试管理策略上花费足够的时间；对于运维人员，是因为没有关注容量规划、数据库迁移和生产环境监控。\n\
  \n然而，市面上已经有很多书籍详细讨论了这些每一个主题。我们认为，文献中缺失的是一本讨论这些所有活动部分是如何结合在一起的书籍，包括：配置管理、自动化测试、持续集成与部署、数据管理、环境管理和发布管理。精益软件开发运动教导的原则之一是，优化整体至关重要。为了实现这一点，需要一种整体方法，将交付过程的每一个部分和参与其中的每一个人联系起来。只有当你能够控制每一个更改从引入到发布的演进过程时，你才能开始优化并提高软件交付的质量和速度。\n\
  \n我们的目标是介绍一种整体方法，以及该方法涉及的原则。我们将为你提供所需的信息，以便你决定如何在自己的项目中应用这些实践。我们不认为对于软件开发的任何方面都存在“一刀切”的方法，更不用说企业系统的配置管理和运行控制如此庞大的领域了。然而，我们在书中描述的基础知识广泛适用于各种不同的软件项目——无论是大的、小的、高技术性的，还是快速实现价值的短冲项目。\n\
  \n当你开始将这些原则付诸实践时，你会发现你的特定情况下需要更多细节的领域。书末有一份参考文献，以及指向其他在线资源的链接，你可以在那里找到我们涵盖的每个主题的更多信息。\n\
  \n本书由三部分组成。第一部分介绍了持续交付背后的原则以及支持它的必要实践。第二部分描述了书的核心范式——我们称之为 `deployment pipeline`\
  \ 的模式。第三部分更详细介绍了支持 `deployment pipeline` 的生态系统——实现增量开发的技术；高级版本控制模式；基础设施、环境和数据管理；以及治理。\n\
  \n这些技术中的许多似乎只适用于大型应用程序。虽然我们的很多经验确实大型应用，但我们相信，即使是最小的项目也能从这些技术的扎实基础中受益，原因很简单：项目是会增长的。你在启动一个小项目时所出的决策将不可避免地对其演变产生影响，通过从正确的方式开始，你将为自己（或后继者）节省未来大量的痛苦。\n\
  \n我们的作者在精益和迭代软件开发哲学方面拥有共同背景。我们的意思是，我们的目标是快速、迭代地向用户交付有价值的、运行良好的软件，持续消除交付过程中的浪费。我们描述的许多原则和技术最初是在大型敏捷项目的背景下开发的。然而，我们在书中介绍的技术具有通用的适用性。我们的重点大部分放在通过更好的可见性和更快的反馈来改进协作。无论项目是否使用迭代软件开发流程，这都对每个项目产生积极影响。\n\
  \n我们尽力确保章节甚至小节是可以独立阅读的。至少，我们希望你所需要的、需要了解的任何内容，以及对进一步信息的引用，都有清晰的标记并易于获取，以便你将本书作为参考书。\n\
  \n我们应该提到，我们在处理所涵盖的主题时并不追求学术上的严谨性。市上有许多理论性更强的书籍，其中许多提供了有趣的阅读体验和见解。特别是，我们不会花费大量时间在标准上，而是专注于每个从事软件项目的人员都会发现有用的实战技能和技术，并清晰、简单地解释它们，以便在现实世界中每天使用。在适当的情况下，我们将提供一些说明这些技术的“实战故事”，以帮助将其置于背景环境中。\n\
  \n### 概要\n\n我们意识到并不是每个人都想从头到尾读完这本书。我们编写它的方式是，一旦你读完引言，就可以以几种不同的方式来攻读它。这涉及了一定的重复，但希望如果你决定通读，这种重复不会达到枯燥的程度。\n\
  \n本书由三部分组成。第一部分，第 1 章到第 4 章，带你了解定期、可重复、低风险发布的基本原则以及支持它们的实践。第二部分，第 5 章到第 10 章，描述了\
  \ `deployment pipeline`。从第 11 章开始，我们深入探讨持续交付的生态系统。\n\n我们建议每个人读一下第 1 章。我们相信，对于软件发布流程的新手，即使是经验丰富的开发者，也会发现许多材料挑战他们对什么是专业软件开发的看法。书的其余部分你可以在空闲时翻阅——或者在慌乱时查看。\n\
  \n#### 第一部分——基础\n\n第一部分描述了理解 `deployment pipeline` 的先决条件。每一章都建立在上一章的基础上。\n\n第 1\
  \ 章“软件交付的问题”从描述我们在许多软件开发团队中看到的常见反模式开始，然后开始描述我们的目标以及如何实现它。我们最后列出了作为书中其余内容基础的软件交付原则。\n\
  \n第 2 章“配置管理”概述了如何管理构建、部署、测试和发布应用程序所需的所有内容，从源代码和构建脚本到你的环境和应用程序配置。\n\n第 3 章“持续集成”涵盖了对你的应用程序所做的每一个更改进行构建和运行自动化测试的实践，以确保你的软件始终处于工作状态。\n\
  \n第 4 章“实施测试策略”介绍了作为每个项目不可或缺部分的各种手动和自动化测试，并讨论了如何判断哪种策略适用于你的项目。\n\n#### 第二部分——部署流水线\n\
  \n书的第二部分详细介绍了 `deployment pipeline`，包括如何实现流水线中的各个阶段。\n\n第 5 章“部署流水线的解剖”讨论了构成本书的核心模式——一个从提交到发布的每一个更改的自动化过程。我们还讨论了如何在团队和组织层面实现流水线。\n\
  \n第 6 章“构建与部署脚本”讨论了用于创建自动化构建和部署过程的脚本技术以及使用它们的最佳实践。\n\n第 7 章“提交阶段”涵盖了流水线的第一个阶段，一组在应用程序引入任何更改时就应触发的自动化过程。我们还讨论了如何创建一个快速、有效的提交测试套件。\n\
  \n\n\n\n\n# 第 8 章“自动化验收测试”介绍了自动化验收测试，涵盖从分析到实现的全过程。我们讨论了为什么验收测试对于持续交付至关重要，以及如何创建一个成本效益的验收测试套件，以保护应用程序的宝贵功能。\n\
  \n# 第 9 章“测试非功能性需求”讨论了非功能性需求，重点关注了容量测试。我们描述了如何创建容量测试，以及如何搭建容量测试环境。\n\n# 第 10 章“应用的部署与发布”涵盖了自动化测试之后发生的事情：通过按钮将候选版本发布到手动测试环境、用户验收测试（UAT）、分阶段环境以及最终发布，其中涵盖了持续部署、回滚和零停机发布等核心主题。\n\
  \n## 第三部分——交付生态系统\n\n书的最后一部分讨论了支持部署流水线的跨领域实践和技术。\n\n# 第 11 章“基础设施与环境管理”涵盖了环境的自动化创建、管理和监控，包括虚拟化和云计算的使用。\n\
  \n# 第 12 章“数据管理”展示了如何在应用程序的生命周期内创建和迁移测试及生产数据。\n\n# 第 13 章“组件与依赖管理”首先讨论了如何在不使用分支的情况下使应用程序始终处于可发布状态。然后我们描述了如何将应用程序组织成组件集合，以及如何管理它们的构建和测试。\n\
  \n# 第 14 章“进阶版本控制”概述了最流行的工具，并详细介绍了使用版本控制的各种模式。\n\n# 第 15 章“管理持续交付”制定了风险管理和合规方法，并为配置和发布管理提供了成熟度模型。在此过程中，我们讨论了持续交付对业务的价值，以及增量交付迭代项目的生命周期。\n\
  \n### 书中的网页链接\n\n我们没有直接放置外部网站的完整链接，而是将其缩短并以这种格式列出密钥：`[bibNp0]`。你可以通过两种方式访问链接：一种是使用\
  \ `bit.ly`，在这种情况下示例密钥的 URL 为 `http://bit.ly/bibNp0`。另一种是使用我们安装在 `http://continuousdelivery.com/go/`\
  \ 上的 URL 缩短服务，该服务使用相同的密钥——因此示例密钥的 URL 为 `http://continuousdelivery.com/go/bibNp0`。这种设计的理念是，如果由于某种原因\
  \ `bit.ly` 无法使用，链接将被保留。如果网页更改了地址，我们会尝试保持 `http://continuousdelivery.com/go/` 缩短服务的更新，因此如果链接在\
  \ `bit.ly` 无法使用，请尝试该地址。\n\n### 关于封面\n\nMartin Fowler 签名系列的所有书籍封面上都有一座桥。我们最初计划使用铁桥（Iron\
  \ Bridge）的照片，但它已被该系列中的另一本书选用。因此，我们选择了另一座英国桥梁：福斯铁路桥（Forth Railway Bridge），由 Stewart\
  \ Hardy 拍摄了这张震撼的照片。\n\n福斯铁路桥是英国第一座用钢建造的桥梁，采用全新的西门子-马丁开炉炼法制造，并从苏格兰的两家钢厂和威尔士的一家钢厂交付。钢材以预制管桁架的形式交付——这是英国桥梁首次使用批量生产的部件。与早期的桥梁不同，设计师约翰·福勒爵（Sir\
  \ John Fowler）、本杰明·贝克爵（Sir Benjamin Baker）和艾伦·斯图特（Allan Stewart）对施工应力的影响进行了计算，制定了降低未来维护成本的措施，并对风压以及温度应力对结构的影响进行了计算——这就像我们在软件中提出的功能性和非功能性需求一样。他们还监督了桥梁的建造，以确保这些需求的实现。\n\
  \n大桥的建造涉及超过 4,600 名工人，不幸的是，其中约一百人丧生，数百人残疾。然而，最终结果是工业革命的奇迹之一：在 1890 年完工时，它是世界上最长的桥；到\
  \ 21 世纪初，它仍然是世界上第二长的悬臂桥。像一个长寿的软件项目一样，大桥需要不断的维护。这是设计计划的一部分，大桥的辅助工程不仅包括一个维护车间和场地，还有达尔梅尼站（Dalmeny\
  \ Station）一个约 50 栋房屋的铁路“社区”。估计大桥的剩余寿命超过 100 年。\n\n### 版后记（Colophon）\n\n本书直接用 DocBook\
