  \n正如软件项目如常，进行直接的比较是不可能的。所涉及的技术非常不同，代码库也是如此。然而，两者都涉及到一个核心中间件基础设施的升级。其中一个项目花费了六人团队两个月，而另一个项目只有两个人花了半天时间。\n\
  \n### 管理环境的工具\n\n`Puppet` 和 `CfEngine` 是两个使自动化方式管理操作系统配置成为可能的工具示例。使用这些工具，你可以声明式地定义内容，例如哪些用户应该拥有访问机器的权限，以及应该安装哪些软件。使用这些工具，你可以声明式地定义内容，例如哪些用户应该拥有访问机器的权限，以及应该安装哪些软件。\n\
  \n（注：原文后续部分包含大量重复的描述，为了符合高级文档工程师的规范，我将按核心含义翻译如下）：\n\n使用这些工具，你可以声明式地定义内容，例如哪些用户应该拥有访问机器的权限，以及应该安装哪些软件。虚拟化允许从版本控制系统中定期拉取最新配置并更新系统。通过虚拟化，你可以从头开始创建生产环境的副本。虚拟化可以提高测试流程的效率。\n\
  \n## 管理变更\n\n最后，对于变更过程，至关重要的是能够管理它。持续集成要求每当有人提交任何更改时，都会构建整个应用程序并运行一套全面的自动化测试。如果构建或测试过程失败，开发团队必须停止正在进行的工作并立即修复问题。持续集成的目标是让软件始终处于可工作状态。\n\
  \n## 总结\n\n配置管理是其他工作的基础。没有它，无法进行持续集成、发布管理和部署。它对团队协作也有巨大的积极影响。如果你的配置管理流程是健全的，你应该对以下问题回答“是”：\n\
  \n- 你可以从版本控制资产中从头完全重建生产系统（排除数据）吗？\n- 你可以回退到之前的良好状态吗？\n- 你能确保生产、测试和测试中的每个环境完全相同吗？\n\
  \n如果不是，你的组织就面临风险。特别是，我们建议对以下内容存储策略并控制更改：\n- 应用程序源代码、构建脚本、测试、文档、数据库脚本、库和配置文件\n- 开发、测试和运维工具链\n\
  - 用于开发、测试和生产的所有环境\n- 与应用程序相关的整个堆栈——包括二进制文件和配置\n- 应用程序运行的每一个环境的配置，跨越整个生命周期（构建、部署、测试、运行）\n\
  \n## 第 3 章 持续集成\n\n## 引言\n\n许多软件项目中一个极其奇怪但常见的特征是，在开发过程的很一段时间内，应用程序处于工作状态。事实上，大型团队开发的大多数软件在很大比例的时间内处于不可用状态。这种现象的原因显易理解：在完成之前，没有人感兴趣运行整个应用程序。开发者提交更改，甚至可能运行自动化单元测试，但没有人真正尝试启动应用程序并在类生产环境中使用它。\n\
  \n对于使用长生命分支或将验收测试推后的项目，这种现象尤为严重。许多此类项目在开发结束时安排了漫长的集成阶段，以便开发团队有时间合并分支并让应用程序运行以进行验收测试。更糟糕的是，有些项目发现进入这个阶段时，他们的软件并不符合需求。这些集成周期可能花费非常长时间，最糟糕的是，没有人能预测需要多久。\n\
  \n相反，我们见过有些项目，其应用程序无法与最新更改工作的状态最多只持续几分钟。区别在于使用了持续集成。持续集成要求每当有人提交任何更改时，都会构建整个应用程序并对其运行一套全面的自动化测试。关键在于，如果构建或测试过程失败，开发团队必须停止正在进行的工作并立即修复问题。持续集成的目标是让软件始终处于可工作状态。\n\
  \n\n\n持续集成（Continuous integration）最早出现在 Kent Beck 的书籍《极限编程实战》（*Extreme Programming\
  \ Explained*，首次出版于 1999 年）。与其他极限编程实践一样，持续集成的背后的理念是：如果定期对代码库进行集成是有益的，为什么不一直这样做呢？在集成的语境下，“一直”意味着每当有人向版本控制系统提交任何更改时。正如我们的同事之一\
  \ Mike Roberts 所说，“持续”比你想象的要频繁得多” [aEu8Nu]。\n\n持续集成代表了一种范式的转移。没有持续集成，你的软件在有人证明它能运行之前一直处于损坏状态，而这通常发生在测试或集成阶段。有了持续集成（假设有一套足够完备的自动化测试），你的软件在每次发生新更改时都能被证明是运行良好的——而且在它崩溃的瞬间，你就能知晓并立即进行修复。有效使用持续集集的团队比不使用的团队能够更快地交付软件，且\
  \ Bug 更少。Bug 在交付过程的更早阶段就能被发现，修复成本也更低，从而节省了大量的成本和时间。因此，我们认为它是专业团队必不可少的实践，或许与使用版本控制一样重要。\n\
  \n本章的其余部分描述了如何实现持续集成。我们将解释如何解决项目变得复杂时出现的常见问题，列出支持持续集成及其对设计和开发过程影响的有效实践。我们还将讨论更高级的话题，包括如何在分布式团队中进行\
  \ CI。\n\n持续集成在本书的伴随书中有详细讨论：Paul Duvall 的书籍《持续集成》（*Continuous Integration*，Addison-Wesley,\
  \ 2006）。如果你想获得比本章提供的更详细的内容，那里是你的去处。\n\n本章主要面向开发者。然而，它也包含了一些我们认为对想要了解更多持续集成*实践*的项目经理会有用的信息。\n\
  \n## 实现持续集成\n\n持续集成的实践依赖于某些前提条件的到位。我们将涵盖这些内容，然后查看可用工具。最重要的是，持续集成依赖于团队遵循几项基本实践，因此我们将花一些时间讨论这些实践。\n\
  \n### 开始之前你需要什么\n\n在开始持续集成之前，你需要准备三件事。\n\n### 1. 版本控制\n\n你项目中的所有内容都必须提交到单一的版本控制仓库中：代码、测试、数据库脚本、构建和部署脚本，以及创建、安装、运行和测试你的应用程序所需的任何其他内容。这听起来显而易见，但令人惊讶的是，仍然有些项目未使用任何形式的版本控制。有些人认为他们的项目不够大，不值得使用版本控制。我们认为没有哪个项目小到可以离离开它。当我们在自己的电脑上为了自己的需求编写代码时，我们仍然在使用版本控制。目前有几种简单、强大、轻量且免费的版本控制系统。\n\
  \n我们将在第 32 页的“使用版本控制”章节以及第 14 章“高级版本控制”中更详细地描述修订版本控制系统的选择和使用。\n\n### 2. 自动化构建\n\n\
  你必须能够从命令行启动构建。你可以从一个命令行程序开始，让你的 IDE 构建软件并运行测试；或者它也可以是一组相互调用的复杂多阶段构建脚本。无论采用什么机制，都必须允许人或计算机通过命令行以自动化的方式运行你的构建、测试和部署过程。\n\
  \n如今 IDE 和持续集成工具已经变得非常复杂，你通常可以在不接触命令行的情况下构建软件并运行测试。然而，我们认为你仍然应该拥有可以通过命令行无需 IDE 运行的构建脚本。这听起来可能有争议，但有以下几个原因：\n\
  \n- 你需要能够从持续集成环境中以自动方式运行构建过程，以便在出现问题时进行审计。\n- 你的构建脚本应该被像你的代码库一样对待。它们应该被测试并不断进行重构，以保持整洁和易于理解。通过\
  \ IDE 生成的构建过程是不可能做到这些的随着项目变得越来越复杂，这一点会变得越来越重要。\n- 它让理解、维护和调试变得更容易，并允许与运维团队进行更好的协作。\n\
  \n### 3. 团队共识\n\n持续集成是一种实践，而不是一种工具。它要求你的团队做出程度的承诺。你需要每个人频繁地向主分支提交小更改，并达成共识：项目的优先级是修复任何破坏软件的更改。如果人们不采取实现所需的纪律，你的持续集成尝试将无法带来你所希望的改进。\n\
  \n### 基础持续集成系统\n\n你不需要持续集成软件来实现持续集成——正如我们所说的，它是一种实践，而不是工具。James Shore 在一篇名为《一天的持续集成》（“Continuous\
  \ Integration on a Day” [bAJjp]）的文章中描述了最简单的入门方法，仅需一台闲置的开发机和一个铃。这篇文章值得一读，因为它在不使用版本控制之外的任何工具的情况下展示了\
  \ CI 的精髓。\n\n但现实情况是，如今的 CI 工具安装和运行极其简单。有几种开源选项，例如 Hudson 和资老的 CruiseControl 家族（CruiseControl、CruiseControl.NET\
  \ 和 CruiseControl.rb）。特别是 Hudson 和 CruiseControl.rb，运行起来非常简单。CruiseControl.rb 非常轻量，而\
  \ Hudson 拥有大量的插件池，使其能够与构建和部署生态系统中的几乎每个工具集成。\n\n在编写本文时，两款商业 CI 服务器提供了为小团队设计的免费版本：ThoughtWorks\
  \ Studios 的 Go 和 JetBrains 的 TeamCity。其他流行的 CI 服务器包括 Atlassian 的 Bamboo 和 Zutubi\
  \ 的 Pulse。可用于基础简单 CI 的高级发布管理和构建加速系统包括 UrbanCode 的 AntHillPro、ElectricCloud 的 ElectricCommander\
  \ 以及 IBM 的 BuildForge。还有很多其他系统；完整列表请参阅 CI 特性矩阵 [bHOgH4]。\n\n一旦安装了你选择的 CI 工具，在满足上述前提条件的情况下，只需告诉工具如何找到源码控制仓库、运行什么脚本来编译（如有必要）并运行自动化提交测试，以及如何告知你最后的更改是否破坏了软件，就可以在几分钟内启动。\n\
  \n当你第一次在 CI 工具上运行构建时，你可能会发现运行 CI 工具的机器缺少了一堆软件和设置。这是一个独特的学习机会——记录下为了让一切正常运行你所做的操作，并将其放在项目的\
  \ wiki 上。你应该花时间将系统依赖的任何软件或设置提交到版本控制中，并将配置新机器的过程自动化。\n\n下一步是让每个人都开始使用 CI 服务器。以下是需要遵循的简单流程。\n\
  \n\n\n\n\n当你准备好提交最新更改时：\n\n1. 检查构建是否已经在运行。如果是，请等待它完成。如果失败，你需要与团队其他成员合作，在提交之前将其恢复为“绿色”（通过）。\n\
  2. 一旦构建完成且测试通过，请从版本控制仓库中的此版本更新开发环境中的代码，以获取任何更新。\n3. 在你的开发机器上运行构建脚本和测试，以确保一切在你的计算机上仍然正常运行，或者使用你\
  \ CI 工具的个人构建功能。\n4. 如果本地构建通过，将你的代码提交到版本控制中。\n5. 等待你的 CI 工具运行包含你更改的构建。\n6. 如果失败，停止手头工作并立即在开发机器上修复问题——返回第\
  \ 3 步。\n7. 如果构建通过，恭喜，并继续处理下一个任务。\n\n如果团队中的每人在每次提交任何更改时都遵循这些简单步骤，你就能知道你的软件在任何与 CI\
  \ 节点配置相同的机器上始终正常运行。\n\n## 持续集成的前提条件\n\n持续集成本身并不能修复你的构建过程。事实上，如果你在项目中期才开始这样做，可能会非常痛苦。为了让\
  \ CI 有效，在开始之前之前需要落实以下实践。\n\n#### 定期提交\n\n`continuous integration` 正常运行最重要的实践是频繁提交到主干（trunk）或主线（mainline）。你应该每天至少提交几次代码。\n\
  \n定期提交会带来许多其他好处。它让你的更改规模更小，因此破坏构建的可能性更低。这意味着当你犯错或走入歧路时，你有一个最近的“已知良好”（knowngood）的软件版本可以回滚。它帮助你在重构时更有纪律，并坚持保持行为的微小更改。它有助于确保修改大量文件的更改不太可能与其他人的工作发生冲突。它允许开发者更具探索性，尝试新想法并通过回滚到上次提交的版本来丢弃它们。它强迫你定期休息并伸展肌肉，以帮助避免卡隧道综合征或\
  \ RSI（重复性劳累损伤）。它还意味着如果发生了灾难性的事件（例如误删了某些内容），你还没有丢失太多的工作。\n\n我们特意提到提交到主干。许多项目在版本控制中使用分支来管理大型团队。但在使用分支时，无法真正实现持续集成，因为根据定义，如果你在分支上工作，你的代码就没有与其他开发者的代码集成。使用长寿命分支的团队面临着我们在本章开头描述的完全相同的集成问题。在非常有限的情况下，我们不建议使用分支。在第\
  \ 14 章“高级版本控制”中对这些问题有更详细的讨论。\n\n### 创建全面的自动化测试套件\n\n如果你没有全面的自动化测试套件，构建通过仅意味着应用程序可以编译和组装。虽然对于某些团队来说这是一个大进步了，但拥有某种程度的自动化测试对于确保你的应用程序实际上在运行是至关重要的。自动化测试有很多种类，我们将在下一章中详细讨论它们。然而，我们感兴趣的是从持续集成构建中运行的三类测试：单元测试、组件测试和验收测试。\n\
  \n单元测试用于隔离测试应用程序中微小部分的行为（例如，一个方法、一个函数，或一小组小组件之间的相互作用）。它们通常可以在不启动整个应用程序的情况下运行。它们不会访问数据库（如果你的应用程序有的话）、文件系统或网络。它们不需要你的应用程序运行在类生产环境中。单元测试运行应该非常快——即使对于大型应用程序，你的整个套件也应该能够在十分钟内运行完毕。\n\
  \n组件测试测试应用程序中几个组件的行为。与单元测试一样，它们并不总是需要启动整个应用程序。然而，它们可能会访问数据库、文件系统或其他系统（这些系统可以被桩掉）。组件测试的运行时间通常较长。\n\
  \n验收测试测试应用程序是否符合业务决定的验收标准，包括应用程序提供的功能以及其特性，如容量、可用性、安全性等。验收测试最好的编写方式是让它们在类生产环境中针对整个应用程序运行。验收测试运行可能需要很长时间——验收测试套件顺序运行超过一天的情况并非屡见未闻。\n\
  \n这三组测试结合在一起，应该提供极高的信心，确保任何引入的更改都没有破坏现有功能。\n\n#### 保持构建和测试过程简洁\n\n如果构建代码和运行单元测试需要太长时间，你将会遇到以下问题：\n\
  \n* 人将停止在提交之前进行全量构建并运行测试。你会开始看到更多失败的构建。\n* 持续集成过程将耗时过长，以至于在你再次运行构建时，已经发生了多次提交，因此你不知道是哪次提交破坏了构建。\n\
  * 人们提交的频率会降低，因为他们必须坐那里等好久来等待软件构建和测试运行。\n\n理想情况下，你在提交之前和在 CI 服务器上运行的编译和测试过程不应超过几分钟。我们认为十分钟大约是极限，五分钟更好，大约九十秒是最理想的。对于习惯开发小项目的人来说，十分钟看起来可能很长。但对于经历过一小时级编译的老手来说，这看起来时间非常短。这段时间大约足够你泡杯茶、简单聊聊天、检查邮件或伸展肌肉。\n\
  \n这这一要求似乎与前一个要求（拥有全面的自动化测试集）相矛盾。但有很多技术可以用来缩短构建时间。首先考虑的是让你的测试运行得更快。XUnit 类工具（如 `JUnit`\
  \ 和 `NUnit`）会在输出中提供每个测试耗时的明细。找出哪些测试运行缓慢，看看是否有方法优化它们或通过更少的处理获得相同的覆盖率和信心。这是你应该定期执行的实践。\n\
  \n然而，在某个时刻，你需要将测试过程拆分为多个阶段，正如第 5 章“部署流水线的结构”中所描述的那样。如何拆分它们？你的第一个动作应该是创建两个阶段。一个阶段编译软件、运行测试应用程序各个类的单元测试套件，并创建一个可部署的二进制文件。这个阶段被称为提交阶段（commit\
  \ stage）。我们在第 7 章中对构建构建阶段进行详细介绍。\n\n第二个阶段应该获取第一阶段的二进制文件，并运行验收测试、集成测试以及性能测试（如果有的话）。现代\
  \ CI 服务器可以轻松地创建这种分阶段构建，并发运行多个任务，并汇总结果，让你一目了然地看到构建状态。\n\n\n\n\n提交阶段（commit stage）应该在代码提交之前运行，并且在每次提交时都在\
  \ CI 服务器上运行。运行验收测试（acceptance tests）的阶段应该在提交测试套件通过后运行，但其耗时可能较长。如果你发现第二次构建花费超过了半小时左右，你应该考虑在更大的多处理器机器上并行运行此测试套件，或者建立一个构建网格（build\
  \ grid）。现代 CI 系统让这变得简单。在提交阶段中加入一个简单的冒烟测试套件（smoke test suite）通常有用。这个冒烟测试应该执行几个简单的验收测试和集成测试，以确保最常用的功能没有损坏——如果出现问题，则快速报告。\n\
  \n***\n\n![Image](img/light.jpg)\n\n将验收测试按功能区域进行分组通常是理想的。这允许你在对该区域进行更改后，运行专注于系统行为某些特定方面的测试测试集。许多单元测试框架都允许你以这种方式对测试进行分类。\n\
  \n***\n\n你可能会遇到这样一个阶段，即你的项目需要分成几个模块，每个模块在功能上都是独立的。这要求你在考虑版本控制和 CI 服务器上如何组织这些子项目时，进行一些仔细的思考。我们将在第\
  \ 13 章“组件与依赖的管理”中详细讨论这一点。\n\n## 管理你的开发工作空间\n\n对于开发者的生产力和心理健康来说，仔细管理他们的开发环境至关重要。开发者在开始新工作时，应该始终从一个良好的起点（good\
  \ starting point）开始。他们应该能够在自己控制的环境中运行构建、执行自动化测试并部署应用程序。通常，这应该在他们自己的本地机器上进行。只有在特殊情况下，才使用共享环境进行开发。在本地开发环境中运行应用程序，应该使用与持续集成、测试环境以及最终生产环境相同的自动化过程。\n\
  \n实现这一点的首要前提是严谨的配置管理，不仅针对源代码，还包括测试数据、数据库脚本、构建脚本和部署脚本。所有这些都必须存储在版本控制中，且这些内容的最新已知良好版本应该是开始编码的起点。在这种语境下，“已知良好”意味着你正在从中的修订版本已经通过了你持续集成服务器上的所有自动化测试。\n\
  \n第二步是对第三方依赖、库和组件的配置管理。拥有所有库或组件的正确版本至关重要，这意味着这些版本必须与你正在工作的源代码版本已知兼容。有一些开源工具可以帮助管理第三方依赖，`Maven`\
  \ 和 `Ivy` 是最常用的。然而，在使用这些工具时，你需要小心确保它们配置正确，否则你可能总会在本地工作副本中获取到某些依赖的最新可用版本。\n\n对于大多数项目而言，它们所依赖的第三方库变化并不频繁，因此最简单的解决方案是将这些库与你的源代码一起提交到你的版本控制系统中。关于这方面的更多信息，请参阅第\
  \ 13 章“组件与依赖的管理”。\n\n最后一步是确保包括冒烟测试在内的自动化测试可以在开发机器上运行。在大型系统中，这可能涉及配置中间件系统以及运行内存版本或单用户版本的数据库。这可能需要一定的精力，但允许开发者在每次提交之前，在开发机器上针对运行系统运行冒烟测试，将对你的应用程序质量产生巨大影响。事实上，良好的应用程序架构的一个标志是，它允许应用程序在开发机器上毫不费力地运行。\n\
  \n## 使用持续集成软件\n\n市场上有很多产品可以为你的自动化构建和测试过程提供基础设施。持续集成软件最基本的功能是轮询你的版本控制系统以检查是否发生了提交，如果有，则检出软件的最新版本，运行你的构建脚本编译软件，运行测试，然后通知你结果。\n\
  \n### 基础操作\n\n从本质上说，持续服务器软件有两个组件。第一个是长时间运行的进程，可以定期执行一个简单的工作流。第二个提供已运行过程结果的视图，通知你构建和测试运行的成功或失败，并提供对测试报告、安装程序等的访问。\n\
  \n通常的 CI 工作流会定期轮询你的版本控制系统。如果它检测到任何更改，会将你的项目副本检出到服务器上的目录或构建代理（build agent）上的目录中。然后它将执行你指定的命令。通常，这些命令会构建你的应用程序并运行相关的自动化测试。\n\
  \n图 3.1 Hudson 截图，作者 Kohsuke Kawaguchi\n\n![Image](img/fig3_1.jpg)\n\n大多数 CI 服务器都包含一个\
  \ Web 服务器，向你显示已运行构建列表（图 3.1），并允许你查看定义每次构建成功或失败的报告。这一系列构建指令最终应该产生并存储结果产物（如二进制文件或安装包），以便测试人员和客户轻松下载软件的最新良好版本。大多数\
  \ CI 服务器可以使用 Web 界面或简单脚本进行配置。\n\n### 附加功能（Bells and Whistles）\n\n你可以利用你的 CI 包的工作流能力来完成基础功能之外的许多其他事情。例如，你可以将最新构建的状态发送到外部设备。我们见过有人使用红色和绿色的熔岩灯来显示上次构建的状态，或者使用将状态发送到\
  \ Nabaztag 电子兔的 CI 系统。我们认识的一位具有电子设备技能的开发者创建了一个华丽的闪烁灯光和警报塔，它会采取行动来指示复杂项目中各种构建的进度。另一个技巧是使用语音转文字读出破坏构建的人。某些持续集成服务器可以显示构建状态以及提交者的头像——这可以显示在大屏幕上。\n\
  \n项目使用这些设备的原因很简单：它们是每个人一眼看到构建状态的绝佳方法。可见性是使用 CI 服务器最重要的优势之一。大多数 CI 服务器软件都带有一个小部件，你可以将其安装在开发机器上，在桌面的角落显示构建状态。这类工具对于分布式团队，或至少不在同一间房间工作的团队来说特别有用。\n\
  \n\n\n\n\n这种可见性的唯一缺点是，如果你的开发团队与客户近近距离工作（这在大多数敏捷项目中本该如此），那么构建失败——作为流程的自然组成部分——可能会被视为应用程序质量出现问题的信号。事实恰恰相反：每次构建失败，都意味着发现了一个问题，而如果没有发现的话，这个问题可能会进入生产环境。然而，这有时很难解释。由于我们经历过多次这种情况，包括在构建中断时间长于我们任何人的意愿之久，与客户进行过一些艰难的对话，我们只能建议你保持高可见性的构建监控，并努力解释其非常真实的益处。当然，所有最好的答案就是努力保持构建始终处于“绿色”（通过）状态。\n\
  \n你还可以让构建过程对源代码进行分析。团队通常会确定测试覆盖率、代码重复率、对编码标准的遵循情况、圈复杂度以及其他健康状况指标，并将结果显示在每个构建的摘要页面上。你还可以运行程序来生成对象模型或数据库模式的图表。这一切都关乎可见性。\n\
  \n如今的高级 CI 服务器可以将工作分发到构建网格中，管理协作组件集的构建和依赖关系，直接报告到你的项目管理跟踪系统中，并执行许多其他有用操作。\n\n##\
  \ 持续集成的前身\n\n在持续集成引入之前，许多开发团队使用“夜间构建”（nightly build）。这在微软多年来是一项常见做法。任何导致构建中断的人都被要求留下来监控随后的构建，直到下一个人再次导致中断。\n\
  \n许多项目仍然在使用夜间构建。其理念是，当每个人回家时，批处理程序会在每晚编译并集成代码库。这是向正确方向的一步，但当团队第二天早上到达发现代码没有编译成功时，这并没有什么帮助。第二天他们会做出新的更改——但在第二天晚上之前无法验证系统是否集成。因此，构建会一直保持红色（失败）好几天——直到，你猜的，集成时间再次到来。此外，当你有一个地理位置分散的团队从不同时区对共同代码库工作时，这种策略的用处不大。\n\
  \n下一个进化步骤是添加自动化测试。我们第一次尝试这样做是很多年前的事了。所说的测试是最基本的冒烟测试，简单地断言应用程序在编译后可以运行。这在我们当时的构建过程中是一个了一大进步，我们对自己感到非常自豪。如今，我们即使在最基础的自动化构建中也期望获得更多。单元测试已经取得了长足进步，即使是一个简单的单元测试套件也会为生成的构建提供显著提高的信心水平。\n\
  \n在某些项目中使用的下一个高级阶段（尽管我们承认最近没有见过了）是“滚动构建”（rolling builds）过程，即不是通过计划的批处理程序在夜间构建软件，而是持续运行构建。每次构建完成后，都会从版本控制中收集最新版本，然后过程重新开始。Dave\
  \ 在 20 世纪 90 年代初有效地利用了这一点；它比夜间构建好得多。这种方法的问题在于，特定的提交（check-in）与构建之间没有直接联系。因此，虽然对开发者来说有一个有用的反馈循环，但它提供的对导致构建中断的因素的追溯性不足，无法真正扩展到更大的团队。\n\
  \n## 核心实践\n\n到为止，我们描述的大部分内容与构建和部署的自动化有关。然而，这种自动化存在于人类流程的环境之中。持续集成是一种实践，而不是一种工具，它取决于自律才能发挥作用。保持持续集成系统的运行，特别是当你处理大型且复杂的\
  \ CI 系统时，需要整个开发团队具有高度的自律。\n\n我们 CI 系统的目标是确保我们的软件在本质上始终处于工作状态。为了确保这一点，以下我们在团队中强制执行的实践。稍后我们将讨论可选但理想的实践，但这里列出的实践对于持续内部的运作是强制性的。\n\
  \n### 不要向构建失败时提交代码\n\n持续集成的首要罪过是在构建失败时提交代码。如果构建中断，负责的开发人员将等待修复它。他们会尽快识别中断的原因并修复它。如果我们采用这种策略，我们始终处于最佳状态，可以找出导致中断的原因并立即修复它。如果我们的某位同事提交了代码并导致了构建中断，那么为了有最大的机会修复它，他们需要一个清晰的机会来处理问题。他们不希望我们提交更多更改、触发新的构建，并用更多问题使失败恶化。\n\
  \n当这条规则被打破时，修复构建不可避免会花费更长时间。人们习惯了看到构建处于失败状态，很快你就会进入构建一直处于失败状态的情况。这种情况会持续，直到团队中的某人决定够了，随后会进行一次赫拉克拉斯式的努力来让构建恢复绿色，然后过程重新开始。在这项工作完成后，是大家聚在一起提醒他们遵循这一原则将确保构建始终绿色，从而确保软件始终工作的绝佳时机。\n\
  \n### 在提交前始终在本地运行所有提交测试，或者让你的 CI 服务器为你完成\n\n正如我们已经确定的，提交会触发发布候选阶段的创建。这是一种发布。大多数人在以任何形式发布其工作之前都会检查自己的工作，提交也不例外。\n\
  \n我们希望提交是足够轻量的，以便我们很乐意每隔 20 分钟提交一次，但也要足够正式，以便我们在提交之前能简短停下来思考。在本地运行提交测试是提交前的完整性检查。它也是确保我们认为可以运行的东西确实可以运行的方法。\n\
  \n当开发者停下来准备好提交时，他们应该通过从版本控制系统更新来刷新本地副本。然后他们应该启动本地构建并运行提交测试。只有在成功后，开发者才准备好将更改提交到版本控制系统。\n\
  \n如果你以前遇到过这种方法，你可能会奇怪为什么在提交之前要在本地运行提交测试，如果提交后发生的第一件事就是编译代码并重新运行提交测试。这种方法有两个原因：\n\
  \n1. 其他人在你最后从版本控制更新之前可能提交了代码，他们的更改与你的新更改相结合可能会导致测试失败。如果你在本地检出并运行提交测试，你将发现这个问题而不会破坏构建。\n\
  2. 提交常见的错误来源之一是忘记将新制品添加到存储库。如果你遵循此程序，并且本地构建通过了，然后你的 CI 管理系统在提交阶段失败了，你就知道要么是因为期间有人提交了代码，要么是因为你忘记将刚刚编写的新类或配置文件添加到版本控制系统中。\n\
  \n遵循这一实践可以确保构建保持绿色。\n\n\n\n\n许多现代 CI 服务器都提供一项功能，通常被称为预测试提交（pretested commit）、个人构建（personal\
  \ build）或预检构建（preflight build）。使用此功能，你不需要亲自提交，而是由 CI 服务器接取你的本地更改并在 CI 集群上运行它们进行构建。如果构建通过，CI\
  \ 服务器将替你提交更改；如果构建失败，它会让你知道哪里出了问题。这是遵循此项实践的极佳方法，而无需等待提交测试通过就可以开始处理下一个功能或错误修复。\n\n\
  在本文写作时，CI 服务器 `Pulse`、`TeamCity` 和 `ElectricCommander` 都提供了这一功能。这种做法与分布式版本控制系统结合效果最好，因为该系统允许你在本地存储提交而不必将其推送到中央服务器。通过这种方式，你可以通过创建一个补丁（patch）来轻松地搁存更改，如果你的个人构建失败，则可以回滚到发送到\
  \ CI 服务器的代码版本。\n\n### 在继续之前，等待提交测试通过\n\nCI 系统是团队的共享资源。当一个团队有效地使用 CI、遵循我们的建议并频繁提交时，任何构建中断（break）对团队和整个项目来说都是一个微小的障碍。\n\
  \n然而，构建中断是过程中的正常且预期之中的部分。我们的目标是尽快发现并消除错误，而不是追求完美和零错误。\n\n在提交时，执行提交操作的开发者负责监控构建进度。在他们的提交完成编译并通过\
  \ `commit tests`（提交测试）之前，开发者不应该开始任何新任务。他们不应该出去吃午饭或参加会议。他们应该对构建足够的关注，以便在 `commit\
  \ stage`（提交阶段）完成后的几秒钟内知道结果。\n\n如果提交成功，开发者那时（且仅在那时）就可以自由转向下一个任务。如果失败了，他们必须在手确定问题的本质并进行修复——即通过另一次提交，或者在版本控制中回滚到之前的版本，也就是说撤销他们的更改，直到他们明白如何让它们正常工作。\n\
  \n### 绝不要在构建崩溃的情况下回家\n\n现在是周五下午 5:30，你所有的同事正走出门门，而你刚刚提交了更改。构建崩溃了。你有三个选择：你可以接受自己将晚离开的事实并尝试修复它；你可以回滚更改，并在下周再尝试提交；或者你可以现在就离开，让构建处于崩溃状态。\n\
  \n如果你带着崩溃的构建离开，当你周一回来时，你对所做更改的记忆将不再新鲜，你将花费更长的时间理解问题并修复它。如果你不是周一早晨第一个回来修复构建的人，当你的同事到达发现构建崩溃且他们的工作能力受到影响时，你的名声会在团队中臭名昭著。如果你在周末生病，第二天没上班，请做好准备：要么接到几个电话询问你如何搞砸了构建以及如何修复，要么发现你的修订版本被某位同事无情地丢弃了。尽管如此，你的名声依然会臭名昭著。\n\
  \n如果你在一个在不同时区有小组的分布式开发团队中工作，构建崩溃的普遍影响，特别是当一天工作结束时留下的崩溃构建，其影响会被放大。在这些情况下，带着崩溃的构建回家可能是疏远远程同事最有效的方法之一。\n\
  \n为了完全清楚起，`我们并不建议你在下班后留下来修复构建`。相反，我们建议你经常且尽早地提交，以便在出现问题时留有时间时间处理。或者，将提交留到第二天；许多经验开发者刻意不在下班前一小时内提交，而是将此任务留到第二天早晨首先完成。如果其他尝试都失败，只需从源码控制中撤销你的更改并将其留在本地工作副本中。某些版本控制系统（包括所有的分布式系统）通过允许你在本地仓库中积累提交而不推送到其他用户，使这变得更容易。\n\
  \n### 分布式项目中的构建纪律\n\n我们的作者曾参与过一个我们认为当时全球最大的敏捷项目。这是一个地理上分布的项目，在共享代码库上工作。整个团队在项目生命期的各个阶段，同时在美国的旧金山、芝加哥、英国伦敦和印度班加罗尔工作。在任何给定的\
  \ 24 小时内，只有大约 3 小时是世界上某处没有人在编写代码。在其余时间里，有不断的更改被提交到版本控制系统，并有不断新的构建被不断触发。\n\n如果印度的团队破坏了构建并回家，伦敦团队的一天工作可能会受到剧烈影响。同样，如果伦敦团队带着崩溃的构建回家，他们的美国同事在接下来的八小时里都会低声咒骂。\n\
  \n严谨的构建纪律至关重要，以至于我们有一位专门的构建大师（build master），他不仅维护构建，有时还负责监督，确保任何破坏构建的人都在努力修复它。如果没有修复，构建工程师就会撤销他们的提交。\n\
  \n### 始终准备好回滚到上一个修订\n\n正如我们之前描述的，尽管我们尽力保持严谨，但我们都会犯错，因此我们预计每个人都会偶尔破坏构建。在较大的项目中，这通常是常有的便饭，尽管预测试提交将极大缓解这一问题。在这种情况下，修复通常是简单的事情，我们会立即识别并通过提交单行更改来修复。然而，有时我们会错得更糟，要么找不到问题所在，要么在提交失败后意识到错过了更改性质的重要信息。\n\
  \n无论我们对失败的 `commit stage` 反应如何，让一切恢复运行都是重要的。如果我们由于任何原因无法快速解决问题，应该回滚到修订控制中的上一个更改集，并在本地环境中解决问题。毕竟，我们最初想要一个版本控制系统的原因之一就是为了让我们拥有这种回滚的自由。\n\
  \n飞机员接受过训练，每次着陆时都应该假设会发生故障，因此他们应该准备好放弃着陆尝试并上空再次尝试。在提交时使用相同的心态。假设你可能会破坏某些需要几分钟才能修复的东西，并知道如何撤销更改并回到版本控制中已良好的版本。你清楚上一个版本是好的，因为`你不会在构建崩溃的情况下提交`。\n\
  \n### 回滚前的修复时限限制\n\n建立一条团队规则：当构建在提交时崩溃时，尝试修复它十分钟。如果十分钟后你还没有完成解决方案，请从你的版本控制系统回滚到上一个版本。有时，如果我们表现得特别宽容，我们会允许你稍微灵活地处理。例如，如果你正处于为提交准备的本地构建中间，我们将允许你完成它以查看是否有效。如果有效，你就可以提交，并希望你的修复是好的；如果在本地或提交后失败，请回滚到最后已知的良好状态。\n\
  \n\n\n经验丰富的开发者通常会在任何情况下都强制执行这条规则，他们乐于回滚那些已经中断了十分钟或更的他人构建。\n\n### 1 不要注释掉失败的测试\n\n\
  一旦你开始执行上一个规则，结果通常是开发者为了提交更改而注释掉失败的测试。这种冲动可以理解，但它是错误的。当运行了一段时间通过的测试开始失败时，可能很难查明原因。真的是发现了回归问题吗？也许测试的某个假设不再有效，或者应用程序确实由于正当原因更改了正在测试的功能。要弄清楚适用哪种情况，可能需要与许多人交流并花费时间，但投入精力查明发生了什么是至关重要的，然后是修复代码（如果发现了回归问题）、修改测试（如果某个假设发生了变化），或删除它（如果被测试的功能已不再）。\n\
  \n注释掉失败的测试始终应该是最后的手段，只有在极少数且非常不情愿的情况下使用，除非你足够自律能够立即修复它。偶尔情况下，为了等待某些需要计划的重大开发工作或与客户进行长时间讨论而注释掉某个测试是可以的。然而，这可能会让你滑入斜坡。我们见过代码中一半的测试都被注释掉的情况。建议跟踪注释测试的数量，并将其显示在大尺寸可见的图表或屏幕上。你甚至可以在注释测试的数量超过某些阈值（可能是总数的\
  \ 2%）时让构建失败。\n\n### 2 对所有因你的更改导致的所有中断负责\n\n如果你提交了一个更改，并且你编写的所有测试都通过了，但其他测试失败了，构建仍然是损坏的。这通常意味着你向应用程序中引入了回归\
  \ Bug。因为你做了更改，所以修复所有因你的更改而未通过的测试是你的责任。在 `CI` 的语境下，这似乎是显而易见的，但实际上在许多项目中这并不是常见做法。\n\
  \n这种做法有几个影响。这意味着你需要能够访问任何你通过自己的更改可能破坏的代码，以便在它损坏时能够修复它。这意味着你无法负担让开发者拥有他们只有他们自己才能处理的代码子集。为了有效地进行\
  \ `CI`，每个人都需要访问整个代码库。如果由于某些原因，你被迫处于无法与整个团队共享代码访问权的境地，你可以通过与拥有必要权限的人员良好协作来解决。然而，这在很大程度上是其次之选，你应该努力消除此类限制。\n\
  \n### 3 测试驱动开发\n\n拥有一个全面的测试套件对于持续集成是至关重要的。虽然我们在下一章中详细讨论了自动化测试的策略，但值得强调的是，作为持续集成核心成果的快速反馈，只有在优秀的单元测试覆盖的情况下才可能（优秀的验收测试覆盖也是本质的，但这些测试的运行时间更长）。根据我们的经验，获得优秀的单元测试覆盖的唯一方法是通过测试驱动开发。虽然我们在本书中尽量避免在敏捷开发实践上过于教条，但我们认为测试驱动开发对于实现持续交付的实践至关重要。\n\
  \n对于不熟悉测试驱动开发的人来说，其核心思想是：在开发新功能或修复 Bug 时，开发者首先创建一个测试，该测试是对待编写代码预期行为的可执行规范。这些测试不仅驱动了应用程序的设计，它们还兼当了回归测试，以及代码和应用程序预期行为的文档。\n\
  \n对测试驱动开发的讨论超出了本书的范范围。然而，值得注意的是，与所有此类实践一样，在测试驱动开发中，保持自律和务实都是重要的。关于这个主题，我们有两本书籍推荐供进一步阅读：Steve\
  \ Freeman 和 Nat Pryce 的《测试驱动面向对象软件增长》（*Growing Object-Oriented Software, Guided\
  \ by Tests*）以及 Gerard Meszaros 的《xUnit 测试模式：重构测试代码》（*xUnit Test Patterns: Refactoring\
  \ Test Code*）。\n\n### 4 建议实践\n\n以下实践并非强制，但我们发现它们非常有用，你至少应该考虑为你的项目使用它们。\n\n#### 极端编程\
  \ (XP) 开发实践\n\n持续集成是 Kent Beck 书中描述的十二核心 `XP` 实践之一，因此它与其他 `XP` 实践相辅相成并被它们所补充。即使他们没有使用任何其他实践，持续集成也可以对任何团队产生巨大影响，但与其他实践结合使用时效果更加显著。特别是，除了我们在上一节中描述的测试驱动开发和共享代码所有之外，你还应该考虑将重构作为有效软件开发的基石。\n\
  \n重构意味着进行一系列微小的、增式的更改，在不改变应用程序行为的情况下改进你的代码。`CI` 和测试驱动开发通过确保你的更改不会改变应用程序的现有行为为重构提供了可能。因此，你的团队就可以自由进行可能触及代码大区域的更改，而无需担心它们会破坏应用程序。这种实践还实现了频繁的提交——开发者在每次微小的、增式的更改后都会提交。\n\
  \n### 因架构违规导致构建失败\n\n有时系统架构的某些方面对于开发者来说太容易忘记。我们使用的一种技术是放置一些提交时测试，以证明没有发生违反这些规则的行为。\n\
  \n这种技术实际上只是一种战术手段，除了例子之外很难描述。\n\n* * *\n\n### 在构建时强制远程调用\n\n我们能想起的最佳示例是来自一个实现为分布式服务集合的项目。这在意义上是一个真正的分布式系统，这种意义体现在：它在客户端系统中执行了重大的业务逻辑，而且在服务器端也执行了真实的业务逻辑——这是由于真实的业务需求，而不仅仅是编程糟糕。\n\
  \n我们的开发团队在他们的开发环境中部署了客户端系统和服务器系统的所有代码。对于开发者来说，很容易就可以从客户端到服务器或从服务器到客户端进行本地调用，而没有意识到如果他们真的想要这种行为，必须进行远程调用。\n\
  \n我们根据分层策略的一个方面将代码组织成包，以便我们部署。我们利用这些信息和一些可以评估代码依赖关系的开源软件，并使用 `grep` 搜索依赖工具的输出，以检查包之间是否存在任何违反我们规则的依赖。\n\
  \n这防止了功能测试阶段出现不必要的损坏，并有助于强化我们系统的架构——提醒开发者两个系统之间进程边界的重要性。\n\n* * *\n\n这种技术可能看起来有些笨重，而且它不能取代开发团队内部对正在开发的系统架构的清晰理解。然而，当需要防御重要的架构问题时——这些问题在早期很难被捕获——它是非常有用的。\n\
  \n#### 因测试运行缓慢导致构建失败\n\n\n\n\n\n正如我们之前所说的，CI 在小型、频繁的提交下效果最好。如果提交测试运行时间过长，会对团队的生产力产生极其严重的负面影响，因为需要花费大量时间等待构建和测试过程完成。这反过来会抑制频繁提交的意愿，导致团队开始积压提交，使得每次提交都变得复杂——更有可能发生合并冲突，引入错误的概率也更高，并导致测试失败。所有这一切会让一切速度进一步变慢。\n\
  \n为了让开发团队关注保持测试快速的重要性，如果你发现某个单独的测试运行超过了某些指定时间，你可以让提交测试失败。上次我们使用这种方法时，任何运行超过两秒的测试都会导致构建失败。\n\
  \n我们倾向于那种微小改变就能产生广泛影响的实践。这正是这样一种实践。如果开发者编写的提交测试运行时间过长，当他们准备提交更改时，构建将失败。这促使他们仔细思考让测试运行更快的策略。如果测试运行快速，开发者就会更频繁地提交。如果开发者提交更频繁，合并问题的概率就越小，任何出现的问题都可能很小且易于解决，因此开发者的效率更高。\n\
  \n不过有一个例外：这种做法可能是一把双刃剑。你需要警惕创建不稳定的间歇性测试，这些测试会在你的 CI 环境由于某些原因处于异常负载时失败。我们发现，使用这种方法最有效的方式是将其作为让大型团队关注特定问题的策略，而不是在每次构建中采用它。如果你的构建变慢了，你可以使用这种方法让团队在一段时间内专注于加速。\n\
  \n请注意：我们在这里讨论的是测试性能，而不是性能测试。容量测试包含在第 9 章“测试非功能性需求”中。\n\n## 为警告和代码风格违规导致构建失败\n\n\
  编译器警告通常是有充分理由在提醒你。我们采用并取得某些成功的策略（尽管它经常被我们的开发团队称为“代码纳粹主义”）是在遇到警告时让构建失败。在某些情况下，这可能有些严酷，但作为一种强制良好实践的方法，它是有效的。\n\
  \n你可以通过添加对特定或通用编码疏忽的检查，随心所欲地加强这种技术。我们成功地使用了许多开源代码质量工具之一：\n\n- `Simian` 是一个用于识别大多数流行语言（包括纯文本）重复内容的工具。\n\
  - `JDepend` 用于 Java，以及其商业版 .NET 兄弟 `NDepend`，产生大量的有用（以及一些无用）的设计质量指标。\n- `CheckStyle`\
  \ 可以测试糟糕的编码实践，例如工具类中的公共构造函数、嵌套块和长行。它还能捕获常见的 Bug 源和安全漏洞。它可以很容易扩展。`FxCop` 是它的 .NET\
  \ 兄弟。\n- `FindBugs` 是一个基于 Java 的系统，提供了 `CheckStyle` 的替代方案，包括类似的验证集。\n\n正如我们所说，对于某些项目来说，对任何警告都让构建失败听起来太严酷了。我们使用的逐渐引入这种实践的方法之一是“轮紧”（`ratcheting`）。这意味着将警告或\
  \ `TODOs` 等事项的数量与上一次提交时的数量进行比较。如果数量增加，我们就让构建失败。使用这种方法，你可以轻松地执行一项策略：每次提交都至少减少一个警告或\
  \ `TODOs` 的数量。\n\n***\n\n## CheckStyle：事后看来唠是的\n\n在我们其中一个项目中，我们为提交测试集添加了 `CheckStyle`\
  \ 测试，我们都对它没完没了的唠叨感到有些厌倦。我们是一支经验丰富的开发者团队，大家都认为，一段时间的唠叨是值得的，这能让我们养成良好的习惯，并在良好的基础上开始项目。\n\
  \n在运行几周后，我们移除了 `CheckStyle` 测试。这加快了我们的构建并消除了唠叨。然后团队规模扩大了一点，几周后，我们开始在代码中发现更多的“气味”，发现自己花在进行简单的清理重构上的时间比以前多了。\n\
  \n最终我们意识到，尽管付出了代价，但 `CheckStyle` 帮助我们的团队关注那些几乎无关紧要的细节，这些细节汇聚在一起就构成了高质量代码与普通代码之间的区别。我们重新开启了\
  \ `CheckStyle`，不得不花一些时间纠正它提出的所有小抱怨，但这是值得的，至少对于那个项目，我们学会了不再对被唠叨的感觉感到不满。\n\n***\n\n\
  ## 分布式团队\n\n在分布式团队中使用持续集成，在流程和技术方面，与任何其他环境很大程度上相同。然而，团队成员没有坐在同一个房间里——他们可能甚至在不同的时区工作——这一事实会对其他领域产生影响。\n\
  \n从技术角度来看，最简单的方法也是从流程角度来看最有效的方法，是保留共享版本控制系统和持续集成系统。如果你的项目使用了后续章节描述的部署流水线，这些也应该简单地在对等的基础上向团队所有成员开放。\n\
  \n当我们说这种方法是最有效的时，我们应该强调它是非常有效的。为了实现这一理想而努力是值得的；这里描述的所有其他方法与此相比都逊了一截。\n\n### 对流程的影响\n\
  \n对于同一时区内的分布式团队，持续集成大同小异。当然，你不能使用物理提交令牌（尽管某些 `CI` 服务器支持虚拟令牌），而且由于更不人人性化，因此在提醒某人修复构建时更容易冒犯他人。个人构建等功能变得更有用。但总的来说，流程是相同的。\n\
  \n对于不同时区的分布式团队，有更多问题需要处理。如果金山山的团队破坏了构建并回家了，这对于刚刚开始工作的北京团队来说这可能是一个严重的障碍。流程本身没有改变，但遵循流程的重要性被放大了。\n\
  \n在拥有分布式团队的大型项目中，`VoIP` 和即时消息工具对于实现保持顺利运行所需的细粒度通信至关重要。与开发相关的每个人——项目经理、分析师、开发者、测试人员——都应该可以通过\
  \ `IM` 和 `VoIP` 访问并被其他人访问。为了交付流程的顺利运行，定期让人员往返交流是必要的，这样每个本地小组都能与其他小组的成员面对面接触。这对于建立团队成员之间的信任非常重要——信任往往是分布式团队首先损害的东西。可以使用视频会议进行回顾、演示和其他定期会议。另一个很好的技巧是让每个开发团队使用屏幕录制软件录制短视频，讲解他们当天正在工作的功能。\n\
  \n显然，这是一个比持续集成要广泛得多的话题。我们想要表达的观点仅仅是保持流程不变，但在应用上要更加纪律。\n\n\n\n\n一些更强大的持续集成服务器具有诸如集中化管理的构建农场和复杂的授权方案等功能，允许你为大型和分布式团队提供集中化服务的持续集成。这些系统让团队能够轻松地实现自服务的持续集成，而无需获取自己的硬件。它们还允许运维团队整合服务器资源，控制持续集成和测试环境的配置，以确保它们都与生产环境保持一致且相似，并执行良好的实践，例如管理第三方库的配置，以及提供预装工具来收集一致的代码覆盖率和质量指标。最后，它们允许在跨项目范围内收集和监控标准指标，为经理和交付团队提供创建仪表板的能力，以便在程序层级监控代码质量。\n\
  \n虚拟化也可以与集中式 CI 服务良好地结合，提供按键即可从存储的基准镜像中启动新虚拟机的能力。你可以使用虚拟化使配置新环境成为一个完全自动化的过程，并由交付团队进行自服务。它还确保构建和部署始终运行在这些环境的一致基准版本上。这产生了一个良好的效果，消除了那些“艺术品”般的持续集成环境——这些环境在几个月里积累了软件、库和配置设置，与测试和生产环境中的内容毫无关系。\n\
  \n集中式持续集成可以是一个双赢的局面。然而，为了实现这一点，开发团队能够以自动方式轻松地自服务新的环境、配置、构建和部署是非常关重要的。如果一个团队必须发送几封邮件并等待几天才能为最新的发布分支获取一个新的\
  \ CI 环境，他们将破坏这一流程，回到使用办公桌下的备用机器来进行真正的持续集成——或者更糟，根本不进行持续集成。\n\n### 技术问题\n\n取决于版本控制系统的选择，当团队之间的链路缓慢时，为全球分布式团队共享版本控制系统以及构建和测试资源的访问是非常痛苦的。\n\
  \n当持续集成运行良好时，整个团队都会定期提交更改。这意味着与版本控制系统的交互往往保持在相当高的水平。虽然每次交互在字节交换方面通常较小，但由于提交和更新的频率很高，糟糕的会成为生产力的巨大阻碍。在开发中心之间投资足够带宽的通信是值得的。考虑迁移到分布式版本控制系统（如\
  \ `Git` 或 `Mercurial`）也是值得的，它允许人们在没有与传统指定的“主”服务器连接的情况下进行提交。\n\n## 分布式版本控制：当其他方法均告失效时\n\
  \n几年前，我们处理过一个存在此问题的项目。当时我们与印度同事的通信基础设施如此缓慢且不可靠，以至于他们某些根本无法提交，这会在随后的几天内产生连锁影响。最终，我们对流失的时间成本进行了分析，发现升级通信的成本在几天内就能收回。在另一个项目中，获取足够快速且可靠的连接根本是不可能的。该团队从使用集中式版本控制系统（VCS）`Subversion`\
  \ 迁移到分布式 VCS `Mercurial`，生产力得到了显著获益。\n\n让版本控制系统与托管自动化测试运行的构建基础设施保持较近的距离是有合逻辑的。如果这些测试在每次提交后都会运行，这意味着跨网络的系统之间存在大量的交互。\n\
  \n托管版本控制系统、持续集成系统以及部署流水线中各种测试环境的物理机器，需要从每个开发站点以平等的基础上访问。如果印度的版本控制系统因为磁盘已满、印度办公室所有人已下班回家且他们无法访问系统而停止工作，伦敦的开发团队将处于巨大的劣势。从每个位置为所有这些系统提供管理员级的访问权限。确保每个地的团队不仅拥有访问权限，还拥有管理他们值班期间可能发生的任何问题的知识。\n\
  \n### 替代方案\n\n如果存在不可逾越的问题阻止了你投入更多资金在开发中心之间建立更高带宽的通信，那么拥有本地的持续集成和测试系统，甚至在极端情况下拥有本地版本控制系统是可能的，但并不理想。正如你所预期的，我们真的不建议这种方法。尽一切避免它；它在时间和精力上都是昂昂的，而且效果远不如共享访问。\n\
  \n简单的部分是持续集成系统。拥有本地的持续集成服务器和测试环境，甚至是完整的本地部署流水线是可能的。当某个站点进行大量的手动测试时，这可能有价值。当然，这些环境需要仔细管理，以确保它们在不同地区保持一致。唯一的注意事项是，理想情况下，二进制文件或安装程序应该只构建一次，然后发送到所有所需的全球位置。然而由于大多数安装程序的体积巨大，这通常是不行的。如果你必须在本地构建二进制文件或安装程序，那么确保严格管理工具链的配置就变得至关重要，以确保在任何地方创建完全相同的二进制文件。强制这一点的一种方法是使用\
  \ `md5` 或类似的算法自动生成二进制文件的哈希值，并让你的 CI 服务器自动将其与“主”二进制文件的哈希值进行对比，以确保没有差异。\n\n在某些极端情况下，例如如果版本控制系统是远程的并通过缓慢或不可靠的链路连接，在本地托管持续集成系统的价值就会被严重削弱。我们在使用持续集成经常提到的目标是尽早发现问题。如果版本控制系统以任何方式分裂，我们就损害了这种能力。在被迫这样做的情况下，我们分裂版本控制系统的目标必须是尽可能减少从引入错误到我们能够发现它之间的时间。\n\
  \n\n\n我们见过的另一种技术是让团队拥有本地仓库和构建系统，同时共享一个全局主仓库。功能上相互分离的团队在整个工作日内将更改提交到自己的本地仓库。每天在固定时间（通常是在另一个时区的分布式团队完成当日工作之后），本地团队的一名成员负责提交整个团队的所有更改，并承担合并整组更改的痛苦。很显然，如果你使用的是专为这类任务设计的分布式版本控制系统，这要会变得容易得多。然而，这种方案绝不是理想的，由于引入了严重的合并冲突，我们曾目睹过它惨败的失败。\n\
  \n总而言之，我们在书中描述的所有技术在许多项目的分布式团队中都经过了良好的验证。事实上，我们认为使用 `CI` 是决定地理分布团队能否高效协作的二、三最重要因素之一。“持续”持续集成中的“持续”这一部分至关重要；如果真的没有其他选择，虽然有一些通融方法，但我们的建议是把钱花在通信带宽上——从中长远来看，这样更划算。\n\
  \n### 分布式版本控制系统\n\n分布式版本控制系统（`DVCSs`）的兴起正在彻底改变团队协作的方式。开源项目曾经通过电子邮件发送补丁或在论坛上发布，而像\
  \ `Git` 和 `Mercurial` 这样的工具让开发者和团队之间来拉取补丁以及对工作流进行分支和合并变得极其简单。`DVCSs` 允许你轻松地离线工作、本地提交更改，并在推送到其他用户之前对其进行变基（rebase）或暂存（shelve）。`DVCS`\
  \ 的核心特征是每个仓库都包含项目的整个历史，这意味着除了约定之外，没有任何仓库具有特权。因此，与集中式系统相比，`DVCSs` 增加了一层间接：本地工作副本的更改在推送到其他仓库之前，必须提交到本地仓库；而来自其他仓库的更新在更新你的工作副本之前，必须与本地仓库进行协调。\n\
  \n`DVCSs` 提供了新颖强大的协作方式。例如，`GitHub` 为开源项目开创了一种新的协作模型。在传统模型中，提交者充当项目定义仓库的守门员，接受或拒绝贡献者的补丁。项目的\
  \ Fork（分叉）只有在提交者之间出现不可调和的争论的极端情况下才会发生。在 `GitHub` 模型中，情况被完全颠倒了。贡献的实现是：先 Fork 你想要贡献的项目仓库，进行你的更改，然后请求原始仓库的所有者拉取你的更改。在活跃项目中，Fork\
  \ 网络迅速扩散，每个分叉都带有各种新功能集。偶尔这些 Fork 会产生分歧。这种模型比传统模型动态得多，在传统模型中，补丁会在邮件列表存档中被闲置和忽视。结果是，GitHub`\
  \ 上的开发速度往往更快，并且拥有更大的贡献者群体。\n\n然而，这种模型挑战了 `CI` 实践的一个基本假设：即存在一个单一的、标准的代码版本（通常称为主线或\
  \ `trunk`），所有更改都提交到那里。需要指出的是，你可以使用 `DVCS` 使用版本控制的主线模型，并能够很愉快地进行 `CI`。你只需指定一个仓库作为主仓库，每当该仓库发生更改时就触发你的\
  \ `CI` 服务器，并让每个人将他们所有的更改推送到这个仓库以进行共享。这是一种完全合理的方法，我们已经见过它在许多项目中被成功使用。它保留了 `DVCS`\
  \ 的许多优势，例如可以在不共享更改的情况下频繁提交更改（类似于保存游戏），这在探索新想法或执行一系列复杂的重构时非常有用。然而，存在一些 `DVCS` 的使用模式会阻碍\
  \ `CI`。例如，`GitHub` 模型违反了代码共享的主线/`trunk` 模型，因此阻碍了真正的持续集成。\n\n在 `GitHub` 中，每个用户的更改集都存在于独立的仓库中，没有办法简单地确定哪些用户的哪一组更改将成功集成。你可以采取这种方法：创建一个仓库来监控所有其他仓库，每当检测到其中任何一个仓库发生更改时，就尝试将它们全部合并到一起。然而，这几乎总会在合并阶段就失败，更不用说运行自动化测试了。随着贡献者数量（以及仓库数量）的增加，问题会呈指数级恶化。没有人会关注\
  \ `CI` 服务器说什么，因此 `CI` 作为一种通信应用程序当前是否正常（如果未运行，是谁以及什么弄坏了它）的方法失效了。\n\n图 3.2 集成分支\n\n\
  ![Image](img/fig3_2.jpg)\n\n可以退回到一个更简单的模型，提供持续集成的一些优势。在这个模型中，你为每个仓库创建一个 `CI` 构建。每当发生更改时，你尝试从指定的的主仓库合并并运行构建。图\
  \ 3.2 显示了 `CruiseControl.rb` 正在 `Rapidsms` 项目的主仓库及其两个 Fork 进行构建。\n\n为了创建这个系统，使用\
  \ `git remote add core git://github.com/rapidsms/rapidsms.git` 命令在 `CC.rb` 的每个 `Git`\
  \ 仓库中添加了指向主项目仓库的分支。每当触发构建时，`CC.rb` 尝试合并并运行构建：\n\n```\ngit fetch core\ngit merge\
  \ --no-commit core/master\n[command to run the build]\n```\n\n构建完成后，`CC.rb` 运行 `git\
  \ reset --hard` 将本地仓库重置为其指向的仓库头部。这个系统没有提供真正的持续集成。然而，它*确实*告诉 Fork 的维护者（以及主仓库的维护者）他们的\
  \ Fork 在原理上是否可以与主仓库合并，以及结果是否是一个运行正常的应用程序版本。有趣的是，图 3.2 显示主仓库的构建目前已损坏，但 `Dimagi` Fork\
  \ 不仅能成功与之合并，还修复了损坏的测试（可能还添加了一些额外的功能）。\n\n比持续集成再更远一步的是 Martin Fowler 所说的“杂乱集成” [bBjxbS]。在这个模型中，贡献者不仅在\
  \ Fork 和中央仓库之间拉取更改，还在 Fork 之间拉取。这种模式在使用 `GitHub` 的大型项目中很常见，当某些开发者在实际上是长期特性分支上工作，并从该特性分支分叉出的其他仓库拉取更改时。事实上，在这种模型中甚至不需要一个主仓库。特定的软件版本可以来自任何\
  \ Fork，只要它通过了所有测试并被项目负责人接受。这种模型将 `DVCS` 的可能性推向了逻辑终点。\n\n这些持续集的替代方案可以创建高质量、正常的软件。然而，这仅在以下条件下可行：\n\
  \n• 由一个少数且经验丰富的提交者组成的团队，管理补丁、维护自动化测试并确保软件质量。\n\n\n\n\n- 定期从派叉（forks）拉取代码，以避免积压大量难以合并的库存。如果你有严格的发布计划，这一条件尤为重要，因为人们往往会将合并推迟到发布前，而那时合并会变得极其痛苦——这正是持续集成旨在解决的问题所在。\n\
  - 一个相对较小的核心开发者群体，可能辅以一个贡献速度较慢但规模较大的社区。这使得合并工作变得可行。\n\n这些条件适用于大多数开源项目，以及通常的小型团队。然而，对于全职开发者组成的中型大型团队，这些条件很少成立。\n\
  \n总结一下：总来说，分布式版本控制系统是一项巨大的进步，并为协作提供了强大的工具，无论你是否在分式项目上工作。`DVCSs` 作为传统持续集成系统的一部分可以非常有效，在这样的系统中，有一个指定的中央仓库，每个人定期向其推送更改（至少每天一次）。它们也可以用于其他不允许持续集的模式，但这些模式可能仍然是交付软件有效的模式。然而，我们警告在不满足上述列出的正确条件下不要使用这些模式。第\
  \ 14 章“高级版本控制”对这些和其他模式以及它们有效的条件进行了全面讨论。\n\n## 总结\n\n如果你只能从本书的实践中选择一种在开发团队中实施，我们建议你选择持续集成。我们一次又一次看到它如何让软件开发团队的生产力产生质的飞跃。\n\
  \n实施持续集成意味着在你的团队中创造一种范式转变。没有 `CI`，你的应用程序就是损坏的，除非你证明它不是。有了 `CI`，你的应用程序默认状态是运行良好的，尽管这种信心程度取决于你自动化测试的覆盖范围。`CI`\
  \ 创建了一个紧密的反馈循环，允许你能够在问题被引入时立即发现它们，那时修复它们的成本是低的。\n\n实施 `CI` 迫使你遵循另外两个重要的实践：良好的配置管理以及自动化构建和测试过程的创建与维护。对于某些团队来说，这似乎是一项巨大的任务，但可以循序渐进完成。我们在上一章中讨论了良好配置管理的步骤。在第\
  \ 6 章“构建与部署脚本”中有更多关于构建自动化的内容。我们将在下一章更详细地介绍测试。\n\n很清楚，`CI` 需要良好的团队纪律——但任何过程都需要如此。持续集成的不同之处在于，你有一个简单的指标可以判断是否遵循了纪律：构建保持绿色。如果你发现构建是绿色的，但纪律不足（例如单元测试覆盖率低），你可以轻松地向你的\
  \ `CI` 系统添加检查以强制执行更好的行为。\n\n这引出了我们最后一点。一个成熟的 `CI` 系统是一个基础，你可以在基础上构建更多基础设施：\n\n-\
  \ 大屏幕显示器，聚合来自构建系统的信息以提供高质量的反馈\n- 一个为测试团队提供报告和安装程序的参考系统\n- 一个为项目经理提供应用程序质量的数据\n-\
  \ 一个可以扩展到生产环境的系统，使用部署流水线为测试人员和运维人员提供一键部署。\n\n## 第 4 章 实施测试策略\n\n## 引言\n\n太多的项目仅仅依赖手动验收测试来验证软件是否符合其功能和非功能需求。即使在存在自动化测试的情况下，它们通常维护不当且过时，需要通过大量的手动测试来补充。本书第二部分中的本章及章节旨在帮助你规划并实施有效的自动化测试系统。我们提供了常见情况下自动化测试的策略，并描述了支持和实现自动化测试的实践。\n\
  \nW. Edwards·德明明的十四点之一是：“停止依赖大规模检查来获得质量。首先要改进过程并将质量内置到产品中” [9YhQXz]。测试是一项跨职能活动，涉及整个团队，应该从项目开始就持续进行。内置质量意味着在多个级别（单元、组件和验收）编写自动化测试，并将其作为部署流水线的一部分运行，每当对应用程序、配置或其运行的环境和软件栈进行更改时，流水线就会触发。手动测试也是内置质量的不可或缺的一部分：演示、易用性测试和探索性测试需要在整个项目中持续进行。内置质量还意味着不断努力改进你的自动化测试策略。\n\
  \n在我们的理想项目中，测试人员与开发者和用户协作，从项目开始就编写自动化测试。这些测试在开发者开始编写它们要测试的功能之前就已经写好了。这些测试共同形成了系统行为的可执行规范，当它们通过时，就证明了客户所需的功能已完全且正确地实现。自动化测试套件由\
  \ `CI` 系统在每次应用程序发生更改时运行——这意味着套件也作为了一组回归测试。\n\n这些测试不仅测试系统的功能方面。容量、安全和其他非功能需求在早期就被确立，并编写了自动化测试套件来强制执行它们。这些自动化测试确保任何危及这些需求实现的问题都能尽早捕获，此时修复成本很低。这些对系统非功能行为的测试使开发者能够根据经验证据进行重构和重新架构：“最近对搜索的更改导致了应用程序性能下降——我们需要修改解决方案以确保我们满足容量需求。”\n\
  \n这种理想世界在早期就采用适当纪律的项目中是可以完全实现的。如果你需要在已经运行了一段时间的项目上实施这些内容，情况会稍微困难一些。要达到高水平的自动化测试覆盖需要时间精精细的规划，以确保在团队学习如何实施自动化测试的同时开发能够继续。遗留代码库无疑会从这些许多技术中受益，尽管可能需要很长时间才能达到从开始就通过自动化测试构建的系统的质量水平。我们将在本章稍后部分讨论将这些技术应用于遗留系统的方法。\n\
  \n测试策略的设计主要是识别和优先考虑项目风险，并决定采取什么行动来缓解风险的过程。良好的测试策略具有许多积极影响。测试建立了软件按预期运行的信心，这意味着更少的错误、降低的支持成本和提高声誉。测试还对开发过程施加了约束，鼓励良好的开发实践。全面的自动化测试套件甚至提供了最完整、最新的应用程序文档形式，表现为可执行规范，不仅说明了系统应该如何工作，还说明了它实际上是如何工作的。\n\
  \n\n\n\n最后，值得注意的是，我们在这里对测试仅触及皮毛。我们的意图是涵盖自动化测试的基础知识，为本书的其他部分提供足够的背景使其易于理解，并使你能够为项目实现合适的部署流水线。特别地，我们不会深入测试实现的技术细节，也不会详细介绍如探索性测试等话题。关于测试的更多细节，我们建议你参考本书的配套丛书之一：Lisa\
  \ Crispin 和 Janet Gregory 的《敏捷测试》（Addison-Wesley, 2009）。\n\n## 测试类型\n\n图 4.1 测试象限图，归功\
  \ Brian Marick，基于当时“广为流”的思想\n\n![Image](img/fig4_1.jpg)\n\n存在许多类型的测试。Brian Marick\
  \ 提出了图 4.1，该图被广泛用于建模为确保交付高质量应用程序而应该具备的各种测试类型。\n\n在图中，他根据测试是面向业务还是面向技术，以及它们是支持开发过程还是用于对项目进行评估对测试进行了分类。\n\
  \n### 支持开发过程的面向业务的测试\n\n该象限中的测试通常被称为功能测试或验收测试。验收测试确保了故事（story）的验收标准得到满足。在开始开发某个故事之前，应该编写验收测试，且理想情况下应是自动化的。验收测试像验收标准一样，可以测试所构建系统的各种属性，包括功能性、容量（capacity）、易用性、安全性、可修改性、可用性等。涉及系统功能的验收测试被称为功能验收测试——非功能性验收测试属于图的第四象限。关于功能性与非功能性测试之间那种有些模糊且经常被误解的区别，请参看下文我们对项目进行评估的面向技术测试的介绍。\n\
  \n验收测试在敏捷环境中至关重要，因为它们为开发者回答了“我如何知道我什么时候做完了？”以及为用户回答了“我得到我想要的了吗？”的问题。当验收测试通过时，无论它们测试的是什么需求或故事，都可以认为已完成。因此，在理想世界中，客户或用户会编写验收测试，因为他们定义了每个需求的成功标准。现代自动化功能测试工具，如\
  \ `Cucumber`、`JBehave`、`Concordion` 和 `Twist`，旨在通过将测试脚本与实现分离，同时提供一种易于同步的机制来实现这一理想。通过这种方式，用户可以编写测试脚本，而开发者和测试人员则协作实现这些脚本的代码。\n\
  \n通常，对于每个故事或需求，从用户将执行的操作来看，应用程序中有一条唯一的规范路径。这被称为*快乐路径*（happy path）。这通常使用格式表示：“给定[测试开始时系统状态的某些重要特征]，当[用户执行某系列操作]时，会导致[系统新状态的某些重要特征]。”这有时被称为测试的“给定-当-那么”（given-when-then）模型。\n\
  \n然而，在除了最简单的系统外，任何用例都允许初始状态、要执行的操作以及应用程序最终状态存在变化。有时，这些变化构成了不同的用例，这些便被称为*备用路径*（alternate\
  \ paths）。在其他情况下，它们应该导致错误条件，产生所谓的*悲伤路径*（sad paths）。显然，可以使用不同的变量值执行许多可能的测试。等价划分分析和边界值分析将这些可能性减少为一组较小的用例，这些案例将完全测试相关的需求。然而，即便如此，你仍需要使用直觉来挑选最相关的案例。\n\
  \n当系统处于类生产模式时，应该运行验收测试。手动验收测试通常通过将应用程序放在用户验收测试（UAT）环境中完成，该环境在配置和应用程序状态方面都尽可能类似于生产环境——尽管它可能使用任何外部服务的模拟版本（mock）。测试人员使用应用程序的标准界面来执行测试。自动化验收测试也应该同样在类生产环境中运行，测试框架（test\
  \ harness）以用户相同的方式与应用程序交互。\n\n### 自动化验收测试\n\n自动化验收测试具有许多价值贵的属性：\n\n- 它们让反馈循环更快——开发者可以运行自动化测试来确定他们是否已完成特定需求，而无需寻找测试人员。\n\
  - 它们减轻了测试人员的工作量。\n- 它们让测试人员能够专注于探索性测试和更高价值的活动，而不是无聊的重复任务。\n- 你的验收测试代表了一个强大的回归测试套件。这在编写大型应用程序或在使用了框架或许多模块的大团队中工作时尤为重要，因为应用程序一部分的变化可能会影响其他功能。\n\
  - 通过使用行为驱动开发（BDD）所提倡的人类可读测试和测试套件名称，可以从你的测试中自动生成需求文档。事实上，像 `Cucumber` 和 `Twist` 等工具允许分析师将需求编写为可执行的测试脚本。这种方法的用处是，你的需求文档永远不会过时——它可以在每次构建时自动生成。\n\
  \n回归测试的问题尤为重要。象限图中没有提到回归测试，因为它是一个交叉类别（crosscutting category）。回归测试代表了你所有自动化测试的集合。它们的作用是确保当你做出更改时不会破坏现有的功能。它们还通过验证在重构完成后你没有改变任何行为，使得轻松地重构代码成为可能。在编写自动化验收测试时，你应该记住它们将形成你回归测试套件的一部分。\n\
  \n然而，自动化验收测试的维护成本可能很高。如果方法不对，它们会给交付团队带来巨大的成本。由于这个原因，某些人建议不要创建复杂的自动化测试套件。(1) 然而，通过遵循良好的实践和使用适当的工具，可以大幅降低创建和维护自动化验收测试的成本，使其收益明显大于成本。我们将在第\
  \ 8 章](#ch08.html_ch08)“自动化验收测试”中更详细地讨论这些技术。\n\n\n\n\n必须记住，并不是所有内容都需要自动化。系统在许多方面，人类在测试上确实比机器更擅。易用性、视觉和感受的一致性等，在自动化测试中是难以验证的。探索性测试也不可能自动完成——当然，测试人员会将自动化作为探索性测试的一部分，用于设置场景和创建测试数据等。在许多情况下，手动测试就足够了，实际上可能优于自动化测试。通常情况下，我们倾向于将自动化验收测试限制在对“主路径（happy\
  \ path）”行为的完整覆盖，并仅对其他最重要的部分进行有限覆盖。假设你已经拥有一套全面的其他类型的自动化回归测试，这是一种安全且高效的策略。我们通常将“全面”定义为代码覆盖率大于\
  \ 80%，尽管测试的质量至关重要，单凭覆盖率是一个糟糕的指标。在此语境下，自动化测试覆盖包括单元测试、组件测试和验收测试，每种测试都应该覆盖应用程序的 80%（我们并不认同那种天真的想法，认为通过\
  \ 60% 的单元测试覆盖和 20% 的验收测试覆盖就能获得 80% 的总覆盖）。\n\n作为自动化验收测试覆盖率的良好试金石，请考虑以下场景。假设你更换了系统的部分——例如持久化层——并将其替换为不同的实现。你完成了替换，运行了自动化验收测试，并且测试通过了。你对系统真的正常工作有多大的信心？一个良好的自动化测试套件应该带给你足够的信心来执行应用程序的重构甚至重新架构，因为你知道只要测试通过，你的应用程序的行为确实没有受到影响。\n\
  \n与软件开发的任何其他方面一样，每个项目都是不同的，你需要监控在重复手动测试上花费了多少时间，以便决定何时何时对它们进行自动化。一个良好的经验法是：当你重复执行同一个测试几次，并且确信自己不会花费大量时间来维护该测试时，就进行自动化。关于何时自动化的更多信息，请阅读\
  \ Brian Marick 的论文《测试何时应该被自动化？》[90NC1y]。\n\n## 验收测试应该点击 UI 吗？\n\n验收测试通常是端到端的测试，运行在与生产环境类似的真实工作环境中。这意味着，在理想世界中，它们应该直接针对应用程序的\
  \ UI 运行。\n\n然而，大多数 UI 测试工具采用了一种天真的方法，将它们与 UI 紧耦合，导致当 UI 即使发生细微变化，测试也会破解。这导致了许多假阳性——测试的失败不是因为应用程序的行为出现任何问题，而是因为某个复选框的名称更改了。保持测试与应用程序同步可能会消耗大量时间，却无法提供任何价值。每隔问自己一个好问题是：“我的验收测试有多少次是因为真实的\
  \ bug 而失败的，有多少次是因为需求变更而失败的？”\n\n有几种方法可以解决这个问题。一种是在你的测试和 UI 之间添加一个抽象层，以减少 UI 变化时所需的工作量。另一种是针对位于\
  \ UI 下方的公共 API 运行验收测试——即 UI 用来执行实际操作的同一个 API（不言而喻，你的 UI 不得包含任何业务逻辑）。这并没有消除对 UI 测试的需求，但意味着它们可以减少为对\
  \ UI 本身的少量检查，而不是对业务逻辑的检查。随后，你的验收测试套件的大部分可以直接针对你的业务逻辑运行。\n\n我们将在第 8 章“自动化验收测试”中详细讨论这个主题。\n\
  \n## 主路径（The Happy Path）\n\n最重要的自动化测试是编写主路径测试。每个故事（Story）或需求都应该至少有一个自动化的主路径验收测试。这些测试应被开发者单独作为冒烟测试使用，以对他们是否破坏了正在处理的某些功能提供快速反馈。它们应该是自动化的首要目标。\n\
  \n当你有时间编写和自动化更多测试时，在备选的主路径和异常路径（sad paths）之间选择是困难的。如果你的应用程序相当稳定，那么备选路径应该是你的优先级，因为它们代表了所有用户定义的场景。如果你的应用程序有很多漏洞且经常崩溃，策略性应用异常路径测试可以帮助你识别问题区域并修复它们，而自动化可以确保应用程序保持稳定。\n\
  \n## 支持开发流程的面向技术的测试\n\n这些自动化测试完全由开发者编写和维护。属于这一类别的测试有三类：单元测试、组件测试和部署测试。\n\n### 单元测试\n\
  单元测试隔离地测试代码的特定部分。因此，它们通常依赖于使用测试双胞（test doubles）模拟系统的其他部分（参见[第 91 页](#ch04.html_page91）上的“测试双胞”章节）。单元测试不应涉及调用数据库、使用文件系统、与外部系统通信，或通常一般的系统组件之间的交互。这使得它们运行得非常快，以便你可以获得关于更改是否破坏了现有功能的早期反馈。这些测试还应该覆盖系统中的几乎每条代码路径（至少\
  \ 80%）。因此，它们构成了回归测试套件的关键部分。\n\n然而，这种速度是以遗漏由于应用程序各个部分之间交互而产生的 bug 为代价的。例如，对象（在 OO\
  \ 编程中）或应用程序数据具有不同的生命周期是非常常见的。只有通过测试应用程序更大的块，你才能发现由于数据或对象的生命周期管理不当而产生的 bug。\n\n###\
  \ 组件测试\n组件测试测试更大的功能簇，以便能够捕获此类问题。它们通常较慢，因为它们可能需要更复杂的设置并执行更多的 I/O，与数据库、文件系统或其他系统通信。有时，组件测试被称为“集成测试”——但“集成测试”一词存在歧义，因此我们在书中书中不使用它。\n\
  \n### 部署测试\n每当你部署应用程序时就会执行部署测试。它们检查部署是否成功——也就是说，你的应用程序是否正确安装、正确配置、能够连接任何所需的服务，并在响应。\n\
  \n## 批判项目的面向业务测试\n\n这些手动测试验证应用程序是否会向用户交付他们预期的价值。这不仅仅是验证应用程序是否符合规范，也是关于检查规范是否正确。我们从未参与过或听说过任何规范预先就完美的项目。不可避免的是，当用户在现实生活中尝试应用程序时，他们会发现有改进空间。他们破坏东西是因为他们执行了以前没有人尝试过的操作组合。他们可能会被应用程序启发，识别出能够为他们提供更多价值的新功能。软件开发是一个自然的迭代过程，由于有效的反馈循环而繁荣，如果我们认为是其他，那就是我们在自欺欺人。\n\
  \n\n\n\n\n# 演示 (Showcases)\n\n演示是一种面向业务的、针对项目评审的测试尤为重要的形式。敏捷团队在每次迭代结束时都会向用户进行演示，以展示他们交付的新功能。在开发过程中，也应该尽可能向客户演示功能，以确保尽早发现任何误解或规格问题。成功的演示既是福也是也是诅咒——用户喜欢亲手接触新事物并对其进行玩耍，但他们不可避免地会提出许多改进建议。此时，客户和项目团队必须决定他们要在多大程度上修改项目计划以吸纳这些建议。无论结果如何，尽早获得反馈远比在项目结束时（那时已经太晚，无法进行更改）才获得反馈要好得多。演示是任何项目的心脏：这是你第一次说某项工作已经真正让那些最终买单的人感到满意并完成了。\n\
  \n# 探索性测试 (Exploratory Testing)\n\nJames Bach 将探索性测试描述为一种手动测试形式，其中“测试人员在执行测试时积极控制测试的设计，并利用测试过程中获得的信息来设计新的、更好的测试。”^(2)\
  \ 探索性测试是一个创造性的学习过程，不仅能发现错误，还能导致创建新的自动化测试集，并可能为应用程序提供新需求。\n\n# 可用性测试 (Usability Testing)\n\
  \n可用性测试是为了发现用户通过你的软件实现其目标有多容易。在开发过程中，很容易陷入问题中，即使对于负责编写应用程序规格的非技术人员也是如此。因此，可用性测试是你的应用程序实际上能够为用户交付价值的终极测试。可用性测试有几种不同的方法，从情境调查到让用户坐在应用程序前并拍摄他们执行常见任务的过程。可用性测试人员收集指标，记录用户完成任务所需的时间，留意人们是否按错按钮，记录他们找到正确文本字段所需的时间，并让他们在最后记录自己的满意度。\n\
  \n# Beta 测试 (Beta Testing)\n\n最后，你可以通过 Beta 测试计划将应用程序交付给真实用户。事实上，许多网站似乎一直处于 Beta\
  \ 状态。一些更具前瞻性的网站（例如 Netflix）不断向选定用户发布新功能，而用户甚至毫无察觉。许多组织使用金丝雀发布（参见参见第 263 页 上的“金丝雀发布”部分），其中多个细微不同的应用程序版本同时处于环境中，并比较它们的有效性。这些组织收集有关新功能如何被使用的统计数据，如果它们没有提供足够的价值，就将其弃用。为功能的采用提供了一种非常有效的演化方法。\n\
  \n# 面向技术的项目评审测试 (Technology-Facing Tests That Critique the Project)\n\n验收测试分为两类：功能性测试和非功能测试。我们所说的非功能测试是指系统除功能之外的所有质量，例如容量、可用性、安全性等。正如我们在上面提到的，功能性测试和非功能测试之间的区别在某些方面是虚假的，认为这些测试不是面向业务的观点也是如此。这看起来似乎是显而易见的，但许多项目并不会像对待其他需求一样对待非功能需求，或者（更糟糕的是）根本不忙于去验证它们。尽管用户很少在前期花费大量时间指定容量和安全特性，但如果他们的信用卡详情被盗，或者网站由于容量问题不断离线，他们无疑会非常不悦。因此，许多人认为“非功能需求”是一个糟糕的名字，并建议了替代方案，如跨功能需求或系统特性。虽然我们对这一立场表示认同，但在本书中一直称它们为非功能特性，以便让知道我们在说什么。无论你如何称呼它们，非功能验收标准都应该与功能性验收标准完全相同，作为应用程序需求的一部分进行指定。\n\
  \n用于检查这些验收标准是否已满足的测试以及运行这些测试的工具，往往与验证符合功能性验收标准的工具有很大不同。这些测试通常需要大量的资源，例如用于运行的特殊环境以及用于设置和实施的专业知识，而且它们的运行通常需要很长时间（无论是否自动化）。因此，它们的实现倾向于被推迟。即使它们是完全自动化的，它们的运行频率通常也较低，并且在部署流水线中比功能性验收测试更后。\n\
  \n然而，情况正在发生。用于执行这些测试的工具正在趋成熟，开发这些测试的技术正变得更加主流。由于多次在发布前被糟糕的性能害得措手不及，我们建议你在任何项目的开始至少设置一些基础的非功能测试，无论它们有多简单或无关紧要。对于更复杂或任务关键型项目，你应该考虑从项目开始就分配项目时间研究并实现非功能测试。\n\
  \n# 测试替身 (Test Doubles)\n\n自动化测试的关键部分涉及在运行时用模拟版本替换系统的部分。通过这种方式，被测试应用程序部分与应用程序其余部分的交互可以被严格限制，从而更容易确定其行为。此类模拟通常被称为\
  \ mocks（模拟对象）、stubs（中桩）、dummies（哑桩对象）等。我们将遵循 Gerard Meszaros 在他的书籍 *xUnit Test Patterns*\
  \ 中使用的术语，正如 Martin Fowler 所总结的那样 [aobjRH]。Meszaros 创造了“测试替身”（test doubles）这一通用术语，并进一步区分了不同类型的测试替身：\n\
  \n- `Dummy` 对象被传递但从未被实际使用。它们通常只是用来填充参数列表。\n- `Fake` 对象实际上有运行的实现，但通常会采取某些捷径，导致它们不适用于生产环境。这一个很好的例子是内存数据库。\n\
  - `Stubs`（中桩）为测试期间进行的调用提供预设的答案，通常对测试中程序之外的任何内容都不作响应。\n- `Spies`（间谍）是中桩，但还会根据其调用方式记录一些信息。这种形式的一种可能是记录发送了多少消息的电子邮件服务。\n\
  - `Mocks`（模拟对象）预先编写了预期，这些预期形成了它们预期接收调用的规格。如果它们接收到未预期的调用，将抛出异常，并在验证期间确保它们收到了所有预期的调用。\n\
  \nMocks 是一种特别被滥用的测试替身形式。人们很容易误用 mocks，编写出既无意义又脆弱的测试，仅仅用它们来断言某些代码实现的特定细节，而不是其与协作者的交互。这种用法是脆弱的，因为如果实现发生变化，测试就会崩溃。研究\
  \ mocks 和 stubs 之间的区别超本书的范围，但你可以在第 8 章，“自动化验收测试”中找到更多细节。Martin Fowler 在他的文章“Mocks\
  \ Aren’t Stubs” [dmXRSC] 中也给出了一些建议。\n\n\n\n\n\n## 现实场景与策略\n\n以下是那些决定自动化测试的团队经常面临的一些典型场景。\n\
  \n### 新项目\n\n新项目代表了实现我们在书中描述的理想的机会。在这个阶段，变更的成本很低，通过建立一些相对简单的基础规则并创建一些相对简单的测试基础设施，你可以为你的持续集成流程开启一个良好的开端。在这种情况下，重要的一点是从一开始就开始编写自动化验收测试。为了做到这一点，你需要：\n\
  \n• 选择一个技术平台和测试工具。\n• 设置一个简单的自动化构建。\n• 制定符合 INVEST 原则 [ddVMFH] 的用户故事（它们应该是**独立的、可协商的、有价值的、可估算的的、微小的**且**可测试的**），并附带验收标准。\n\
  \n然后，你可以执行一套严格的流程：\n\n• 客户、分析师和测试人员定义验收标准。\n• 测试人员与开发者合作，根据验收标准自动化验收测试。\n• 开发者编写代码以满足验收标准。\n\
  • 如果任何自动化测试失败（无论是单元测试、组件测试还是验收测试），开发者会将修复这些测试视为首要任务。\n\n在项目初期采用这种流程，比在几个迭代后才决定需要验收测试要简单得多。在这些后期，你不仅必须尝试想出实现验收测试的方法（因为你的框架中还没有对这些测试的支持），还必须说服那些持怀疑态度的开发者严谨地遵循这套流程。如果从项目开始就开始，让团队上自动化自动化测试会更容易实现。\n\
  \n然而，让团队中的每个人（包括客户和项目经理）都认同这些好处也是至关重要的。我们见过有些项目被取消，是因为客户认为在编写自动化验收测试上花费了太多时间。如果客户确实宁愿牺牲自动化验收测试套件的质量来快速上市，他们有权做出这一决定——但后果应该被说得很清楚。\n\
  \n最后，确保你的验收标准编写得仔细是重要的，以便它们能够从用户的角度表达故事所交付的业务价值。盲目地自动化编写糟糕的验收标准是导致验收测试套件不可维护的主要原因之一。对于你写的每一个验收标准，应该能够编写一个自动化验收测试来证明所描述价值已交付给用户。这意味着测试人员从一开始就应该参与编写需求，确保在系统演进过程中有一个连贯、易于维护的自动化验收测试套件的支持。\n\
  \n遵循我们描述的流程会改变开发者编写代码的方式。将从一开始就使用自动化验收测试开发的代码库与那些将验收测试视为事后考虑的代码库进行比较，我们几乎总能在前者看到更好的封装性、更清晰的意图、更干净的关注点分离以及更多的代码复用。这确实是一个良性循环：在正确的时间进行测试会导致更好的代码。\n\
  \n## 项目中期\n\n虽然从零开始一个项目总是令人愉快的，但现实是，我们经常发现自己在一个大型、资源匮乏的团队中开发一个快速变化的代码库，并面临着交付压力。\n\
  \n引入自动化测试的最佳方法是从应用程序中最常见、重要且高价值的用例开始。这需要与你的客户进行对话，明确识别真正的业务价值所在，然后用测试保护这些功能免受回归。基于这些对话，你应该自动化覆盖这些高价值场景的快乐路径（happy\
  \ path）测试。\n\n此外，最大化这些测试覆盖的动作数量也是有用的。让它们覆盖比你通常通过故事级验收测试处理的稍微宽泛的场景。尽可能填充许多字段并点击尽可能多的按钮以满足测试的需求。这种方法为这些核心行为测试中正在测试的功能提供了一些广泛的覆盖，尽管测试可能不会突出系统细节中的失败或变化。例如，你将知道系统的基本行为运行正常，但可能会错过某些验证未正常运行。这样做的好处是让手动测试变得稍微高效，因为你不需要测试每一个字段。你可以确保通过自动化测试的构建将正确运行并交付业务价值，即使其行为的某些方面并不符合你的愿意。\n\
  \n这种策略意味着，由于你只自动化了快乐路径，你必须进行相应大量的手动测试，以确保你的系统完全按照预期工作。你会发现手动测试变化非常快，因为它们正在测试新的或新更改的功能。每当你发现自己手动测试同一个功能超过两次时，请检查并确认该功能是否可能发生变化。如果没有，就将该测试自动化。相反，如果你发现自己花费了大量时间修复特定的测试，你可以假设被测试的功能正在变化。再次，去向客户和开发团队确认情况是否如此。如果是，通常可以告诉你的自动化测试框架忽略该测试，记住在忽略注释中提供尽可能详细的信息，以便你知道何时重新让该测试工作。如果你怀疑该测试将不再以目前的形式再次被使用，就删掉它——如果你搞错了，你也可以随时从版本控制中找回。\n\
  \n当你时间紧迫时，将无法投入大量精力编写带有大量交互的复杂场景脚本。在这种情况下，最好使用各种测试数据集以确保覆盖率。明确指定你测试的目标，找到实现此目标的最简单脚本，并根据测试开始时的应用程序状态尽可能多地补充各种场景。我们在第\
  \ 12 章“管理数据”中讨论了自动化加载测试数据。\n\n### 遗留系统\n\n迈克尔·费德斯在《有效使用遗留代码》书中挑衅性地将遗留系统定义为没有自动化测试的系统。这是一个有用且简单（尽管有争议）的定义。随着这个简单定义而来的是简单的准则：测试你修改的代码。\n\
  \n处理此类系统时，首要任务是在没有的情况下创建一个自动化构建过程，然后围绕其创建一个自动化功能测试脚手架。如果有文档，或者更好的是工作过遗留系统的团队成员可用，创建自动化测试套件将变得更容易。\n\
  \n\n\n\n与系统用户坐谈以识别其高价值用途至关重要。使用上一节描述的相同技术，创建一组涵盖这些核心高价值功能的宽泛自动化测试。你不应该在这件事上花费过长时间，因为这只是一个保护遗留函数的骨架。稍后你将为添加的新行为增量地添加新测试。这些本质上是针对你遗留系统的烟雾测试（smoke\
  \ tests）。\n\n一旦这些烟雾测试到位，你就可以开始开发故事（stories）了。在此时，对你的自动化测试采用分层方法是有用的。第一层应该是应该是非常简单且运行快速的测试，用于解决那些阻碍你对正在处理的任何功能部分进行有效测试和开发的问题。第二层测试特定故事的关键功能。尽可能地，新行为应该按照我们为新项目所描述的方式进行开发和测试。对于新功能，应该创建带有验收标准（acceptance\
  \ criteria）的故事，并强制要求通过自动化测试来代表这些故事的完成。\n\n这有时比听起来要困难。设计为可测试的系统往往比不可测试的系统更具模块化且更容易测试。然而，这不应该偏离你的目标。\n\
  \n此类遗留系统的一个特殊问题是代码通常不是过于模块化且结构良好。因此，代码某一部分的更改经常不利地影响另一个区域的行为。在这种情况下，一种有效的策略是在测试完成时对应用程序的状态进行仔细验证。如果你有时间，可以测试故事的替代路径。最后，你可以编写更多的验收测试来检查异常情况，或防止常见的失败模式或不希望的副作用。\n\
  \n重要的是，你应该只在测试能产生价值的地方编写自动化测试。你本质上可以将你的应用程序分为两个部分：是实现应用程序功能的代码，另一部分是底层的支持或框架代码。绝大多数回归错误都是由更改框架代码引起的——所以如果你只是为你的应用程序添加不需要更改框架和支持代码的功能，那么编写完善的脚手架（scaffolding）的意义不大。\n\
  \n这种例外情况是你的软件必须运行在许多不同的环境中。在这种情况下，自动化测试结合向类生产环境的自动化部署将产生巨大的价值，因为你只需要简单将你的脚本指向要测试的环境，就能节省大量的手动测试工作量。\n\
  \n### 集成测试\n\n如果你的应用程序通过一系列不同的协议与多种外部系统进行通信，或者你的应用程序本身由一系列松耦合的模块组成，且它们之间存在复杂的交互，那么集成测试变得非常重要。集成测试与组件测试之间的界限是模糊的（尤其是因为集成测试是一个相当过度负载的术语）。我们使用\
  \ `integration testing` 一词是指那些确保你的应用程序的每个独立部分都能与其依赖的服务正常工作的测试。\n\n集成测试可以像编写普通的验收测试一样进行编写。通常情况下，集成测试应该在两个环境中运行：首先是被测系统运行在它依赖的真实外部系统上，或者运行在服务提供者控制的副本上；其次是针对你作为代码库一部分创建的测试绞具（test\
  \ harness）运行。\n\n确保你不会命中真实的外部系统，除非你在生产环境中，或者你有某种方法告诉服务你发送的是用于测试目的虚假交易（dummy transactions）。有两种常用方法可以确保安全地测试应用程序而不命中真实的外部系统，通常你需要同时采用这两种方法：\n\
  \n*   在测试环境中通过防火墙隔离对外部系统的访问，你可能在开发过程的早期就需要这样做。这也是测试当外部服务不可用时应用程序行为的有用技术。\n*   在你的应用程序中设置一个配置，使其与外部系统的模拟版本进行通信。\n\
  \n在理想情况下，服务提供者将有一个副本测试服务，其行为与生产服务完全相同，仅性能特征除外。你可以针对此开发测试。然而，在现实世界中，你经常需要自己开发一个测试绞具。情况如下：\n\
  \n*   外部系统正在开发中，但接口已提前定义（在这些情况下，要做好接口发生更改的准备）。\n*   外部系统已开发完成，但你没有可供测试的该系统实例，或者测试系统太慢或\
  \ Bug 太多，无法作为常规自动化测试运行的服务。\n*   测试系统存在，但响应是非确定性的，因此导致自动化测试无法对测试结果进行验证（例如，股市数据馈）。\n\
  *   外部系统的形式另一个难以安装或需要通过 UI 进行手动干预的应用程序。\n*   你需要为涉及外部服务的函数编写标准的自动化验收测试。这些测试几乎总是针对测试双胞（test\
  \ doubles）运行。\n*   你的自动化持续集成系统施加的负载以及它要求的服务级别，压倒了仅为了应对几次手动探索性交互的轻量级测试环境。\n\n测试绞具可能相当复杂，特别取决于它所模拟的服务是否记住状态。如果外部系统记住状态，你的绞具将根据你发送的请求表现出不同的行为。在这种情况下，你可以编写的价值价值测试是黑盒测试，即你考虑外部系统可能给出的所有响应，并为每种响应编写测试。你的模拟外部系统需要某种方式来识别你的请求并返回相应的响应，或者在收到它不预料的请求时返回异常。\n\
  \n至关重要的一点是，你的测试绞具不仅要复制服务调用的预期响应，还要复制意外的响应。在 *Release It!* 书中，Michael Nygard 讨论了创建一个测试绞具来模拟你可以从故障远程系统或基础设施问题中所预期的各种有害行为。这些行为可能是由于网络传输问题、网络协议问题、应用程序协议问题以及应用程序逻辑问题引起的。示例包括此类病态现象：拒绝网络连接、接受连接后丢弃、接受连接但不响应、对请求响应极缓慢、返回意外的大数据、返回垃圾信息、拒绝凭据、发送异常，或返回一个给定应用程序状态无效的良好响应。你的测试绞具应该能够模拟这些每种情况，可能通过监听几个不同的端口，每个端口对应某种失败模式。\n\
  \n\n\n你应该针对尽可能模拟的病态情况对你的应用程序进行测试，以确保它能够处理这些情况。随后，Nygard 描述的其他模式（如 `Circuit Breaker`\
  \ 和 `Bulkheads`）可以用来加固你的应用程序，使其能够应对生产环境中不可避免会发生的意外事件。\n\n自动化集成测试可以在系统部署到生产环境时重用为冒烟测试（smoke\
  \ tests）。它们也可以作为诊断工具来监控生产系统。如果你在开发期间将集成问题识别为一种风险（这几乎是不可避免的），那么开发自动化集成测试应该是早期的优先要事项。\n\
  \n将涉及集活动活动到你的发布计划中至关重要。与外部服务的集成是复杂的，需要时间和合理的规划。每当你需要与外部系统集成时，你都会为项目增加风险：\n\n• 测试服务是否可用？其性能是否良好？\n\
  • 服务提供者是否有足够的带宽来回答问题、修复漏洞并添加自定义功能？\n• 我是否可以访问系统的生产版本并对其进行测试，以诊断容量或可用性问题？\n• 我是否可以使用开发应用程序时所用的技术轻松访问服务\
  \ API，还是说我们团队中需要专家技能？\n• 我们是否需要编写并维护自己的测试服务？\n• 当外部服务的行为不符合预期时，我的应用程序表现如何？\n\n此外，你必须为构建和维护集成层以及相关的运行时配置，以及任何所需的测试服务和容量测试等测试策略留出范围。\n\
  \n## 流程\n\n如果团队成员之间的通信不畅，生产验收测试可能是一项昂贵甚至艰巨的任务。许多项目依赖于测试人员详细检查即将来的需求，考虑所有可能的场景，并设计他们之后将遵循的复杂测试脚本。这一过程的结果可能会发送给客户批准，随后进行测试实现。\n\
  \n这个过程有几个点可以进行非常简单的优化。我们发现，最佳解决方案是在每次迭代开始时，与所有利益相关者举行一次会议；或者如果你不使用迭代，则在故事开始开发前大约一周举行会议。我们将客户、分析师和测试人员聚在一个房间里，共同制定出优先级最高的测试场景。`Cucumber`、`JBehave`、`Concordion`\
  \ 和 `Twist` 等工具允许你在文本编辑器中用自然语言编写验收标准，然后编写代码使这些测试可执行。对测试代码的重构也会更新测试规范。另一种方法是使用领域特定语言（`DSL`）进行测试。这允许在\
  \ DSL 中输入验收标准。至少，我们会要求客户在现场写下这些场景的最简单的验收测试，涵盖这些场景的“快乐路径”（happy paths）。此后，会议结束后，人们通常会添加更多组的数据来提高测试的覆盖率。\n\
  \n这些验收测试以及它们目标的简短描述，随后成为负责相关故事的开发人员的工作起点。测试人员和开发人员应该在开始开发之前尽早聚集讨论验收测试。这让开发人员能够对故事有一个良好的概览，并理解哪些是最重要的场景。这减少了开发人员和测试人员之间的反馈周期（这种周期本可能在故事开发结束时发生），并有助于减少功能缺失和漏洞数量。\n\
  \n在故事结束时，开发人员和测试人员之间的交接过程很容易变成瓶颈。在最坏的情况下，开发人员完成一个故事，开始另一个故事，但在执行新故事的一程途中被测试人员中断，因为该测试人员对上一个故事（甚至是多位以前已完成的故事）提交了漏洞。这是非常低效的。\n\
  \n在整个故事的开发过程中，开发人员和测试人员之间的紧密协作对于顺畅发布至关重要。每当开发人员完成某些功能时，他们应该叫测试人员过来评审。测试人员应该接手开发人员的机器来进行此类测试。在此期间，开发人员可以在相邻的终端或笔记本电脑上继续工作，也许修复一些待解决的回归漏洞。这样他们仍然处于工作状态（因为测试可能需要时间），但在测试人员需要讨论任何事情时可以随时响应。\n\
  \n### 管理缺陷积压\n\n理想情况下，漏洞从一开始就不应该引入你的应用程序。如果你正在实践测试驱动开发和持续集成，并拥有一套全面的自动化测试（包括系统级验收测试以及单元测试和组件测试），开发人员应该能够在漏洞被测试人员或用户发现之前捕获它们。然而，探索性测试、演示和用户不可避免地会在你的系统中发现漏洞。这些漏洞通常会进入缺陷积压（defect\
  \ backlog）。\n\n关于什么是可接受的缺陷积压以及如何处理它，有几种不同的观点。James Shore 提倡零缺陷 [b3m55V]。实现这一目标的方法之一是确保每当发现漏洞时立即修复。这当然要求你的团队结构使得测试人员能够尽早发现漏洞，而开发人员可以立即修复它们。然而，如果你已经有了缺陷积压，这并起不了帮助。\n\
  \n在存在缺陷积压的情况下，让问题对所有人清晰可见，并让开发团队成员负责促进减少积压的过程是非常重要的。特别是，如果你的验收构建状态始终显示为“失败”，那么仅仅显示这个状态是不够的。相反，应该显示通过的测试数量、失败的数量和被忽略的数量，并在显眼位置列出这些数字随时间变化的图表。这让团队的注意力集中在问题上。\n\
  \n你决定继续保留缺陷积压的场景是有风险的。这是一个滑坡（slippery slope）。过去，许多开发团队和开发流程忽略了大量的漏洞，将修复它们的工作推迟到未来某个更方便的时间。几个月后，这几乎不可避免地导致产生巨大的漏洞列表，其中某些将永远不会被修复，某些由于应用程序功能已改变而不再适用，而某些对某些用户至关重要，但在所有杂音中丢失了。\n\
  \n当没有验收测试，或者由于功能是在未定期合并到主干的分支上开发而导致验收测试无效时，问题会更加糟糕。在这种情况下，一旦代码集成并开始手动系统级测试，团队完全被缺陷淹没的情况屡见不鲜。测试人员、开发人员和管理层之间会爆发争执，发布日期推迟，用户最终得到低质量的软件。这是一个通过遵循更好的流程就可以预防许多缺陷的案例。更多细节请参阅第\
  \ 14 章](#ch14.html_ch14)“高级版本控制”。\n\n\n\n\n另一种方法是将缺陷视为与功能同等对待。毕竟，修复 bug 所花费的时间和精力本可以用于开发其他功能，因此，应该由客户来决定某个特定\
  \ bug 与该功能之间的相对重要性。例如，在一个仅有少数用户的管理界面中，一个具有已知通融方案的罕见缺陷，其修复重要性可能不如为整个应用程序增加一个新营收的功能那么高。至少，将\
  \ bug 分类为“紧急（critical）”、“阻塞（blockers）”、“中等（medium）”和“低优先级（low）”是有意义的。更全面的方法可能会考虑\
  \ bug 发生的频率、对用户的影响以及是否存在通融方案。\n\n有了这种分类，你可以像处理用户故事（stories）一样对待办列表（backlog）中的 bug\
  \ 进行优先级排序，它们可以共同出现。这除了立即消除关于某项工作是缺陷还是功能的争论外，意味着你可以一眼看出还有多少工作需要完成，并据此进行优先级排序。低优先级\
  \ bug 将排在待办列表的靠后位置，你可以像处理低优先级故事一样处理它们。通常客户并不希望修复某些 bug——因此，将 bug 与功能一起放在待办列表中是管理它们的逻辑方式。\n\
  \n## 总结\n\n在许多项目中，测试被视为一个由专家执行的独立阶段。然而，只有当测试成为每个参与软件交付人员的责任，并且从项目开始一直贯穿整个生命周期进行实践时，高质量软件才成为可能。测试主要关注建立驱动开发、设计和发布的反馈循环。任何将测试推迟到项目末尾的计划都是失败的，因为它消除了能够产生更高质量、更高生产力，以及最重要的衡量项目完成程度任何指标的反馈循环。\n\
  \n最短的反馈循环是通过在系统每次发生变化时运行的自动化测试集创建的。此类测试应该在所有层级运行——从单元测试到验收测试（包括功能性和非功能性测试）。自动化测试应以手动测试（如探索性测试和演示/showcases）进行补充。本章旨在让你很好理解创建优秀反馈所需的各种类型的自动化和手动测试，以及如何在各种类型的项目中实施它们。\n\
  \n在第 83 页“介绍”部分中描述的原则中，我们讨论了什么是“完成（done）”。将测试整合到交付过程的每一个部分对于完成工作至关重要。由于我们测试方法定义了我们对“完成”的理解，测试结果就是项目规划的基石。\n\
  \n测试从根本上和你对“完成”的定义紧密相连，你的测试策略应该专注于能够逐功能地交付这种理解，并确保测试贯穿你的整个流程。\n\n## 第二部分：部署流水线\n\
  \n## 第 5 章：部署流水线的剖析\n\n## 引言\n\n持续集成（CI）对于大多数采用它的项目来说，是生产力和质量的一大飞跃。它确保了协作创建大型复杂系统的团队能够比不使用\
  \ CI 时具有更高水平的信心控制力来工作。CI 确保了我们作为一个团队创建的代码是可以运行的，因为它对我们提交的更改中可能引入的任何问题提供快速反馈。它主要关注断言代码能够成功编译并并通过一系列单元测试和验收测试。然而，仅有\
  \ CI 是不够的。\n\nCI 主要侧重于开发团队。CI 系统的输出通常形成手动测试过程的输入，然后进入发布过程的其他部分。软件发布中的大部分浪费来自于软件通过测试和运维的进展。例如，常见的情况有：\n\
  \n* 构建和运维团队等待文档或修复\n* 测试人员等待软件的“良好”构建版本\n* 开发团队在团队转向新功能几周后才收到 bug 报告\n* 在开发过程末尾发现应用程序架构无法支持系统的非功能性需求\n\
  \n这导致软件无法部署，因为将其引入类生产环境花费了太长时间；而且导致软件充满 bug，因为开发团队与测试及运维团队之间的反馈周期太长。\n\n软件交付方式有各种增量改进方法，可以产生即时收益，例如教授开发者编写生产就绪的软件、在类生产系统上运行\
  \ CI 以及建立跨职能团队。然而，虽然这些实践无疑会改善状况，但它们仍然无法让你洞察交付过程中的瓶颈在哪里，或者如何对其进行优化。\n\n解决方案是采用更整体、端到端的软件交付方法。我们已经处理了配置管理以及自动化大部分构建、部署、测试和发布过程的广泛问题。我们已经达到了这种程度：部署我们的应用程序（即使到生产环境）通常只需通过点击按钮选择想要部署的构建版本即可完成。这创建了一个强大的反馈循环：由于将应用程序部署到测试环境非常简单，你的团队可以获得代码和部署过程的快速反馈。由于部署过程（无论是到开发机器还是最终发布）是自动化的，它会被定期运行并测试，从而降低了发布风险并将部署过程的知识转移给开发团队。\n\
  \n我们最终得到的是（精益术语）一个`拉系统（pull system）`。测试团队自己点击按钮将构建部署到测试环境。运维人员点击按钮将构建部署到阶段环境和生产环境。开发者可以看到哪些构建经历了发布过程中的哪些阶段，以及发现了哪些问题。经理可以监控周期时间、吞吐量和代码质量等关键指标。结果，交付过程中的每个人都得到了两个东西：在需要时获得所需的东西，以及对发布过程的可视性以改进反馈，从而识别、优化并消除瓶颈。这导致交付过程不仅更快而且更安全。\n\
  \n构建、部署、测试和发布过程端到端自动化引发了一系列连锁反应，带来了一些意外收益。其中一个结果是，通过在使用此类技术的许多项目中，我们发现了构建的部署流水线系统的许多共同点。我们相信，通过我们识别的抽象，某些通用模式到为止适用于我们尝试过的所有项目。这种理解让我们能够从项目开始就快速地建立相当复杂的构建、测试和部署系统。\n\
  \n这就是部署流水线的用途。\n\n## 什么是部署流水线？\n\n\n\n\n\n# 部署流水线\n\n在抽象层面上，部署流水线是将软件从版本控制交付到用户手中的这一过程的自动化实现。软件的每一项更改在发布之前都会经过一个复杂的流程。该过程涉及软件构建，随后这些构建版本会在多个测试和部署阶段中演进。这反过来又需要许多个人、可能可能是好几个团队之间的协作。部署流水线模拟了这一过程，而它在持续集成和发布管理工具中的体现，让你能够看到并控制每项更改从版本控制通过多组测试和部署，最终发布给用户的整个过程的进度。\n\
  \n### 图 5.1 产品的简单价值流图\n![Image](img/fig5_1.jpg)\n\n## 价值流图\n\n因此，由部署流水线建模的过程（即软件从提交到发布的过程）构成了将功能从客户或用户的脑海交付到他们手中的这一过程的一部分。整个过程——从概念到现金——可以被建模为一张价值流图。用于新产品创建的高级价值流图如图\
  \ 5.1 所示。\n\n这张价值流图讲述了一个故事。整个过程大约需要三个半月。其中大约两个半月是实际在进行的工作——在软件从概念到现金的过程中，各个阶段之间存在等待。例如，在开发团队完成第一个版本的工作到开始测试流程之间，有五天的等待时间。这可能是因为将应用程序部署到类生产环境所需的时间，例如。顺便提一下，这幅图中刻意没有标清楚该产品是否是以迭代方式开发的。在迭代过程中，你预计会看到开发过程本身由多次迭代组成，其中包含测试和展示。从发现到发布的整个过程也会重复很多次^(1)。\n\
  \n创建价值流图可以是一个低技术的过程。在玛丽（Mary Poppendieck）和汤（Tom Poppendieck）的经典《精益软件开发：敏捷工具包》（*Lean\
  \ Software Development: An Agile Toolkit*）中，他们描述如下：\n\n手里拿着笔和笔记本，来到客户请求进入你组织的地方。你的目标是画一张平均客户请求的图，从到达到完成。与参与每项活动的人员合作，画出完成请求所需的所有流程步骤，以及请求在每个步骤中所花费的平均时间。在地图底部，画一条时间线，显示请求在增值活动中花费了多久，在等待状态和非增值活动中花费了多久。\n\
  \n如果你感兴趣进行一些组织转型工作以改进流程，你将需要更详细的描述，描述谁负责流程的哪个部分、在异常情况下会发生哪些子过程、谁批准交接、需要哪些资源、组织的汇报结构是什么等。然而，这对于我们这里的讨论来说并不是必要的。关于此的更多细节，请参阅玛丽和汤·波彭迪克编写的书《实施精益软件开发：从概念到现金》（*Implementing\
  \ Lean Software Development: From Concept to Cash*）。\n\n### 图 5.2 流过部署流水线的更改\n![Image](img/fig5_2.jpg)\n\
  \n## 流水线流程\n\n我们在书中讨论的价值流部分是从开发到发布的那部分。这些是图 5.1 中价值流中的阴影框。价值流中这部分的一个关键区别是，构建版本在走向发布的过程中会多次通过该部分。事实上，理解部署流水线以及更改如何通过它的的一种方法是将其可视化为序列图，^(2)，如图\
  \ 5.2 所示。\n\n注意，流水线的输入是版本控制中的特定修订版本。每项更改都会创建一个构建版本，它就像某些神话英雄一样，将通过一系列对其作为生产发布可行性的测试和挑战。这种由一系列测试阶段组成的过程（每个阶段都从不同角度评估构建版本）是从每次提交到版本控制系统时开始的，就像持续集成过程的启动一样。\n\
  \n### 图 5.3 部署流水线中的权衡\n![Image](img/fig5_3.jpg)\n\n随着构建版本通过每一项适用性测试，对它的信心也随之增加。因此，我们愿意投入其上的资源也随之增加，这意味着构建版本所通过的环境会变得越来越像生产环境。目标是尽可能在流程早期阶段消除不合格的发布候选者，并尽可能快速向团队提供失败根源的反馈。为此，任何在过程中某一阶段失败的构建版本通常不会被提升到下一个阶段。这些权衡在图\
  \ 5.3 所示。\n\n## 模式的后果\n\n应用这一模式会有一些重要的后果。首先，你有效地防止了发布未经过彻底测试且未发现符合其预期用途的生产构建版本。回归\
  \ Bug 被避免了，特别是在需要将紧急修复发布到生产环境时（此类修复与任何其他更改通过相同的流程）。根据我们的经验，新发布的软件由于系统组件与其环境之间某些不可预见的相互作用而导致崩溃也是极其常见的现象，例如由于新的网络拓扑结构或生产服务器配置的细微差异。部署流水线的纪律性缓解了这一点。\n\
  \n其次，当部署和生产发布本身是自动化的时，它们是快速、可重复且可靠的。一旦流程自动化，执行发布往往会变得容易得多，以至于它们变成了“正常”事件——这意味着根据你的选择，你可以更频繁地发布。当你能够回退之前的版本也可以前进时，情况尤为如此。当这种能力可用，发布基本上是没有风险的。最坏的情况是你发现自己引入了一个致命\
  \ Bug——此时你可以回滚到不包含该 Bug 的早期版本，同时离线修复新版本（参见[第 10 章](#ch10.html_ch10）“部署和发布应用程序”）。\n\
  \n为了实现这种令人羡慕的状态，我们必须自动化一套测试，以证明我们的发布候选版本符合用途。我们还必须自动化到测试、阶段和生产环境的部署，以消除这些手动密集且容易出错的步骤。对于许多系统，还需要其他形式的测试以及发布过程的其他阶段，但适用于所有项目的子集如下：\n\
  \n- **提交阶段**：确保系统在技术层面是可以工作的。它进行编译，通过一系列（主要是单元级）的自动化测试，并运行代码分析。\n- **自动化验收测试阶段**：确保系统在功能和非功能层面是可以工作的，在行为上满足用户需求和客户的规范。\n\
  - **手动测试阶段**：确保系统是实用的并满足其需求，检测自动化测试未发现的缺陷，并验证它是否为用户提供了价值。这些阶段通常包括探索性测试环境、集成环境和 UAT（用户验收测试）。\n\
  \n\n\n\n\n- `Release stage`（发布阶段）将系统交付给用户，可以是作为封装好的软件，也可以将其部署到生产环境或暂存环境（暂存环境与生产环境完全相同的测试环境）。\n\
  \n我们将这些阶段，以及为了建模您的软件交付过程可能需要的任何额外阶段称为 `deployment pipeline`（部署流水线）。它有时也被称为持续集成流水线、构建流水线、部署生产线或活动构建。无论它叫什么，从根本上说，这都是一个自动化的软件交付过程。这并不意味着在整个发布过程中没有人工与系统进行交互；相反，它确保了易错且复杂的步骤在执行时是自动化、可靠且可重复的。事实上，人机交互反而增加了：通过点击按钮即可在开发的各个阶段部署系统的能力，这鼓励了测试人员、分析师、开发者以及（最重要的是）用户频繁使用它。\n\
  \n### 基础部署流水线\n\n图 5.4 基础部署流水线\n\n![Image](img/fig5_4.jpg)\n\n图 5.4 显示了一个典型的部署流水线，并捕捉了该方法的精髓。当然，真实的流水线将反映您项目交付软件的实际流程。\n\
  \n该过程从开发者将更改提交到版本控制系统开始。在此时，持续集成管理系统会对提交做出响应，触发我们流水线的一个新实例。流水线的第一个阶段（提交阶段）会编译代码、运行单元测试、执行代码分析并创建安装程序。如果所有单元测试均通过且代码符合标准，我们将可执行代码组装成二进制文件并将其存储在构制品仓库中。现代\
  \ CI 服务器提供了存储此类构制品的设施，并让用户以及流水线中的后续阶段能够轻松访问它们。或者，也有许多如 `Nexus` 和 `Artifactory` 这样的工具可以帮助您管理构制品。您还可能作为流水线提交阶段的一部分运行其他任务，例如为验收测试准备要使用的测试数据库。现代\
  \ CI 服务器将允许您在构建网格上并行执行这些作业。\n\n第二个阶段通常由运行时间较长的自动化验收测试组成。同样，您的 CI 服务器应该应该允许您将这些测试拆分为套件，并并行执行这些套件以提高速度并为您提供更快的反馈——通常在\
  \ 1 到 2 小时内。此阶段将由流水线第一阶段的成功完成自动触发。\n\n在此时，流水线会分支，以便将您的构建独立部署到各种环境——在这种情况下，是 UAT（用户验收测试）、容量测试和生产环境。通常，您不希望这些阶段由验收测试阶段的成功完成自动触发。相反，您希望您的测试人员或运维团队能够手动自服务地将构建部署到他们的环境中。为了方便这一点，您需要一个执行此部署的自动化脚本。您的测试人员应该能够看到他们可用的发布候选版本以及它们的状态——每个构建通过了之前两个阶段中的哪一个、提交注释是什么，以及对这些构建构建的任何其他注释。然后他们应该能够点击按钮通过在相关环境中运行部署脚本来部署所选构建。\n\
  \n同样的原理也适用于流水线的后续阶段，不同之处在于，通常您希望能够部署到的各个环境会有不同的用户组，这些组用户“拥有”这些环境并有能力对其进行自服务部署。例如，您的运维团队可能希望成为唯一能够批准部署到生产环境的人。\n\
  \n图 5.5 Go 显示哪些更改通过了哪些阶段\n\n![Image](img/fig5_5.jpg)\n\n最后，重要的是记住这一切目的是尽可能快地获取反馈。为了让反馈周期变快，您需要看到哪个构建被部署到了哪个环境，以及每个构建通过了流水线中的哪些阶段。图\
  \ 5.5 是 Go 显示的实际操作情况的截图。\n\n注意，您可以看到页面侧侧的每一次提交、每个提交经历过的流水线中的每个阶段，以及它是通过还是失败了该阶段。能够将特定的提交（因此是构建）与其其通过的流水线阶段关联起来是至关重要的。这意味着如果您在验收测试中发现问题（例如），您可以立即查出是哪些提交到版本控制的更改导致了验收测试失败。\n\
  \n## 部署流水线实践\n\n不久后我们将更详细地介绍部署流水线中的各个阶段。但在在此之前，为了获得这种方法的益处，有一些您应该遵循的实践。\n\n### 仅构建一次您的二进制文件\n\
  \n为了方便起见，我们将可执行代码的集合称为 `binaries`（二进制文件），尽管如果您不需要编译代码，这些“二进制文件”可能只是源文件的集合。`Jars`、`.NET\
  \ assemblies` 和 `.so` 文件都是二进制文件的示例。\n\n许多构建系统使用版本控制系统中所持有的源代码作为许多步骤的规范源。代码将在不同的上下文中反复编译：在提交过程中、再次在验收测试时、再次在容量测试时，并且通常为每个独立的部署目标编译一次。每当您编译代码时，就面临着引入某些差异的风险。后期阶段安装的编译器版本可能与您用于提交测试时使用的版本不同。您可能会在无意中获取到不同版本的第三方库。甚至编译器的配置也可能改变应用程序的行为。我们已经看到来自这些来源的每一个\
  \ Bug 进入了生产环境。\n\n* *\n\n![Image](img/common.jpg)\n\n一个相关的反模式是在源代码级别进行晋，而不是在二进制文件级别。有关此反模式的更多信息，请参见第\
  \ 403 页的“ClearCase 和从源代码重建的反模式”章节。\n\n* *\n\n这种反模式违反了两个重要原则。第一个是保持部署流水线高效，以便团队尽可能快地获得反馈。重新编译违反了这一原则，因为它需要时间，特别是在大型系统中。第二个原则是始终在已知可靠的基础上进行构建。部署到生产环境的二进制文件应与通过验收测试过程的二进制文件完全相同——事实上，在许多流水线实现中，这是通过存储创建时的二进制文件哈希值并在过程后续每个阶段验证二进制文件完全相同来检查的。\n\
  \n如果我们重新创建二进制文件，就会面临在二进制文件创建和发布之间引入某些更改的风险，例如编译之间工具链的变化，并导致我们发布的二进制文件与测试过的文件不同。出于审计目的，确保在创建二进制文件和执行发布之间没有引入恶意或无意的更改是关重要的。一旦我们创建了二进制文件，我们将重复使用它们，而不是在用点时重新创建。\n\
  \n\n\n\n因此，你应该只在构建的提交阶段（commit stage）构建一次二进制文件。这些二进制文件应该存储在某处的文件系统上（而不是版本控制中，因为它们是你基准的派生物，而不是其定义的一部分），以便在流水线的后续阶段轻松检索它们。大多数\
  \ CI 服务器都会为你处理这些工作，还会执行一项至关重要的任务：允许你追溯到创建这些二进制文件的版本控制提交记录。没有必要花费大量精力来确保二进制文件的备份——理论上，你可以通过从版本控制中正确的修订运行你的自动化构建过程，来精确地重新创建它们。\n\
  \n***\n\n![Image](img/common.jpg)\n\n如果你听取了我们的建议，起会觉得工作量增加了。如果你的 CI 工具尚未自动为你完成这一操作，你就需要建立某种方法将二进制文件传播到部署流水线的后期阶段。某些在流行开发环境中自带的简单配置管理工具可能会做错。一个显著的例子是项目模板，它们会在构建过程中通过单个步骤直接生成包含代码和配置文件的程序，例如\
  \ `ear` 和 `war` 文件。\n\n***\n\n这一原则的一个重要推论是，必须将这些二进制文件部署到每一个环境。这迫使你将代码（环境之间保持不变）与配置（环境之间存在差异）分开。这反过来将引导你正确地管理配置，对构建更好的构建系统产生一种良性的压力。\n\
  \n***\n\n### 为什么二进制文件不应该是特定于环境\n\n我们认为创建旨在在单一环境中运行的二进制文件是一种非常糟糕的做法。这种方法虽然常见，但有几个严重的缺点，会损害系统部署的便利性、灵性和可维护性。某些工具甚至鼓励这种做法。\n\
  \n当构建系统以这种方式组织时，它们通常会迅速变得非常复杂，为了应对各种部署环境的差异和变化，会产生大量的特殊情况的补丁（hacks）。在我们工作过的一个项目中，构建系统极其复杂，甚至需要一个五个人的全职团队来维护。最终，我们通过重新组织构建，并将环境特定配置与环境无关的二进制文件分离，让他们解脱了这项不受欢迎的工作。\n\
  \n这种构建系统让本该轻而易的任务变得异常复杂，例如向集群中添加新服务器。这反过来迫使我们进入脆弱且昂贵的发布流程。如果你的构建创建了只能在特定机器上运行的二进制文件，现在就开始规划如何重构它们吧！\n\
  \n***\n\n这自然地引出了我们的下一个实践建议。\n\n### 以相同的方式部署到每个环境\n\n使用相同的流程部署到每一个环境——无论是开发者或分析师的工作站、测试环境还是生产环境——是至关重要的，以确保构建和部署过程得到了有效的测试。开发者经常部署；测试人员和分析师频率较低；而且通常，你部署到生产环境的频率相当低。但这种部署频率与每个环境相关的风险是反比的。你部署频率越低的环境（生产环境）是最重要的。只有在你许多环境上测试了数百次部署过程后，你才能消除部署脚本作为错误源的可能性。\n\
  \n每个环境在某些方面都是不同的。即使别无其他，它也会有一个唯一的 `IP address`，但通常还有其他差异：操作系统和中间件的配置设置、数据库和外部服务的位置，以及需要在部署时设置的其他配置信息。这并不意味着你应该为每个环境使用不同的部署脚本。相反，将每个环境特有的设置分开。实现此点的一种方法是使用\
  \ `properties files` 来存放配置信息。你可以为每个环境准备一个单独 `properties file`。这些文件应该提交到版本控制中，通过查看本地服务器的\
  \ `hostname`，或者（在多机环境中）通过提供给部署脚本的 `environment variable` 来选择正确的那个。提供部署时配置的其他方法包括将其保留在目录服务中（如\
  \ `LDAP` 或 `ActiveDirectory`），或将其存储在数据库中并通过像 `ESCAPE` [apvrEr] 这样的应用程序访问。关于管理软件配置更多信息，请参见\
  \ 39 页上的“管理软件配置”章节。\n\n***\n\n![Image](img/light.jpg)\n\n为每个应用程序使用相同的部署时配置机制很重要。这在大公司或涉及许多异构技术的情况下尤为如此。通常，我们反对发号命令——但我们见过太多的组织，要确定特定应用在特定环境中部署时实际提供了什么配置是极其困难的。我们知道有些地方，你必须给不同大陆的独立团队发邮件来拼凑出这些信息。当你试图找出某个\
  \ bug 的根源时，这将成为效率的巨大障碍——考虑到它为你价值流引入的延迟，其成本是极其昂贵的。\n\n应该可以通过一个单一源（版本控制仓库、目录服务或数据库）找到你所有环境环境中所有应用程序的配置设置。\n\
  \n***\n\n如果你所在的公司中，生产环境由一个与开发测试环境团队不同的团队管理，那么两个团队都需要协作，以确保自动化部署过程在所有环境（包括开发环境）中有效运行。使用与部署到开发环境相同的脚本部署到生产环境，是防止“在我的机器上运行良好”综合症\
  \ [c29ETR] 的极佳方法。这意味着当你准备发布时，已经通过部署到所有其他环境测试了数百次你的部署过程。这是我们已知的降低发布风险的最佳方法之一。\n\n\
  ***\n\n![Image](img/common.jpg)\n\n我们假设你有一套自动部署应用程序的过程——但当然，许多组织仍然在使用手动部署。如果你有手动部署流程，首先应该确保该流程对于每个环境都是一致的，然后开始逐步对其进行自动化，目标是实现全脚本化。最终，你只需要指定目标环境和应用程序版本即可启动成功的部署。自动化、标准化的部署过程将对你重复且可靠地发布应用程序的能力产生巨大的积极影响，并确保该过程被完全记录和审计。我们将在下一章详细介绍自动化部署。\n\
  \n***\n\n这一原则实际上是分离变化部分与不变部分的规则的另一个应用。如果你的部署脚本针对不同环境是不同的，你就无法知道你测试的内容在上线时是否真的能工作。相反，如果你使用相同的流程部署到每个地方，当某个环境部署失败时，你可以将范围缩小到三个原因之一：\n\
  \n• 应用程序环境特定配置文件中的某个设置\n\n\n\n\n\n- 你的基础设施或应用程序所依赖的某个服务的问题\n- 你的环境配置\n\n确定其中哪一个是根本原因是接下来的两项实践的主题。\n\
  \n### 对部署进行冒烟测试（Smoke-Test）\n\n当你部署应用程序时，应该有一个自动化脚本进行冒烟测试，以确保它已启动并运行。这可以简单到启动应用程序，并检查主界面是否显示了预期的内容。你的冒烟测试还应该检查应用程序依赖的任何服务是否已运行——例如数据库、消息总线或外部服务。\n\
  \n冒烟测试（或称为部署测试）可能是你在建立并运行单元测试套件后编写的最重要的测试——事实上，它可能比单元测试更重要。它让你对应用程序的实际运行充满信心。如果它没有运行，你的冒烟测试应该能够提供一些基础诊断，告知应用程序是否由于其依赖的某项未运行而宕机。\n\
  \n### 部署到生产环境的副本中\n\n许多团队在上线时遇到的另一个主要问题是，它们的生产环境与测试环境及开发环境存在显著差异。为了对上线能够成功有足够的信心，你需要在与生产环境尽可能相似的环境中进行测试和持续集成。\n\
  \n理想情况下，如果你的生产环境非常简单，或者你有充足的预算，你可以拥有生产环境的精确副本，用于运行手动和自动测试。确保环境一致需要一定程度纪律来应用良好的配置管理实践。你需要确保：\n\
  \n- 你的基础设施（如网络拓扑和防火墙配置）是相同的。\n- 你的操作系统配置（包括补丁）是相同的。\n- 你的应用程序栈是相同的。\n- 应用程序的数据处于已知且有效的状态。在执行升级时迁移数据可能是部署过程中的主要痛苦源。我们将在第\
  \ 12 章“管理数据”中更多地讨论这个话题。\n\n你可以使用磁盘镜像和虚拟化等技术，以及 `Puppet` 和 `InstallShield` 等工具结合版本控制仓库来管理环境配置。我们将在第\
  \ 11 章“管理基础设施和环境”中详细讨论。\n\n### 每次更改都应立即在流水线中传播\n\n图 5.6 流水线中的阶段调度\n\n![Image](img/fig5_6.jpg)\n\
  \n在引入持续集成之前，许多项目是按计划运行流程的各个部分的——例如，构建可能每小时运行一次，验收测试每晚运行一次，容量测试在周末运行。部署流水线采取了不同的方法：第一阶段应该在每次提交（check-in）时触发，并且每个阶段在成功完成后应立即触发下一个阶段。当然，当开发者（特别是大团队中）频繁提交时，这并不总是可能的，因为你流程中的阶段可能会耗费不短的时间。问题如图\
  \ 5.6 所示。\n\n在这个示例中，有人向版本控制提交了一个更改，创建了版本 `1`。这反过来触发了流水线的第一个阶段（构建和单元测试）。测试通过后，触发了第二阶段：自动化验收测试。随后有人提交了另一个更改，创建了版本\
  \ `2`。这再次触发了构建和单元测试。然而，尽管这些测试通过了，它们无法触发自动化验收测试的新实例，因为它们已经在运行了。在此期间，又连续发生了两次提交。但是，CI\
  \ 系统不应尝试构建这两个提交——如果遵循该规则，且开发者继续以相同的速率提交，构建任务将越来越落后于开发者当前的操作。\n\n相反，一旦构建和单元测试的实例完成，CI\
  \ 系统会检查是否有新的可用更改，如果是，则基于最新的可用集合进行构建——在本例中，即版本 `4`。假设这导致了构建和单元测试阶段失败。构建系统不知道是哪个提交（`3`\
  \ 还是 `4`）导致了阶段崩溃，但通常开发者自己就能很容易查出来。某些 CI 系统允许你无序运行指定的版本，在这种情况下，开发者可以针对修订 `3` 触发第一阶段，查看它是通过还是失败，从而判断是提交\
  \ `3` 还是 `4` 破坏了构建。无论如何，开发团队提交了版本 `5`，修复了问题。\n\n当验收测试最终完成时，CI 系统的调度器注意到有新更改，并针对版本\
  \ `5` 触发了验收测试的新轮运行。\n\n这种智能调度对于实现部署流水线至关重要。确保你的 CI 服务器支持这种调度工作流——许多服务器都支持——并确保更改立即传播，这样你就不需要按固定计划运行阶段。\n\
  \n这仅适用于完全自动化的阶段，例如包含自动化测试的阶段。流水线后期执行部署到手动测试环境的阶段需要根据需要激活，我们在本章稍后的章节中描述这一点。\n\n###\
  \ 如果流水线的任何部分失败，停止产线\n\n正如我们在第 56 页的“实现持续集成”部分提到的，实现本书目标（快速、可重复、可靠的发布）最重要的步骤是让团队接受：每当他们将代码提交到版本控制时，它都能成功构建并通过所有测试。这适用于整个部署流水线。如果向环境的部署失败，整个团队都要该失败负责。他们应该在做任何其他事情之前停止并修复它。\n\
  \n## 提交阶段（Commit Stage）\n\n每次提交都会创建一个部署流水线的新实例，如果第一阶段通过，则会生成一个发布候选版本。流水线第一阶段的目标是消除不适合生产环境的构建，并尽快向团队信号应用程序已损坏。我们不希望在明显损坏的应用程序版本上花费额外的时间和精力。因此，当开发者向版本控制系统提交更改时，我们希望快速评估最新版本的应用程序。提交的开发者随后等待结果，然后执行下一个任务。\n\
  \n在我们的提交阶段中，我们想要做一些事情。通常，这些任务在构建网格（大多数 CI 服务器提供的设施）上作为一组作业运行，以便阶段在合理的时间内完成。提交阶段理想情况下应该在五分钟内运行完成，绝对不超过十分分钟。提交阶段通常包含以下步骤：\n\
  \n- 编译代码（如有需要）。\n- 运行一组提交测试。\n- 创建供后续阶段使用的二进制文件。\n- 对代码进行分析以检查其健康状况。\n- 为后续阶段准备制品（如测试数据库）。\n\
  \n第一步是编译最新版本的源代码，如果编译错误，则通知自上次成功提交以来提交了更改的开发者。如果此步失败，我们可以立即令提交阶段失败并从后续考虑中排除该流水线实例。\n\
  \n\n\n\n\n接下来，将运行一组经过优化、执行速度极快的测试集。我们将这组测试称为“提交阶段测试”（commit stage tests）而不是单元测试，因为尽管其中绝大多数确实是单元测试，但在此阶段包含少量其他类型的测试是有用的，这样当提交阶段通过时，我们就能有更高水平的信心应用程序确实在正常工作。这些是开发者在提交代码（check\
  \ in）之前运行的（或者，如果具备条件，通过在构建网格上的预测试提交）运行的测试。\n\n通过运行所有单元测试来开始设计你的提交测试套件。随后，随着你更多地了解验收测试运行以及流水线中其他后期阶段常见的失败类型，你应该向你的提交测试套件中添加特定的测试，以尝试尽早发现它们。这是一个持续的优化过程，如果你想避免在流水线的后期阶段发现并修复漏洞的更高成本，这种优化至关重要。\n\
  \n确保代码通过编译并通过测试固然很好，但这不能告诉你太多关于应用程序的非功能特性的信息。测试容量等非功能特性可能很难，但你可以运行分析工具，提供有关代码库此类特性的反馈，例如测试覆盖率、维护性和安全性漏洞。如果代码未能达到这些指标的预设阈值，应该像测试失败一样导致提交阶段失败。这些指标包括：\n\
  \n- 测试覆盖率（如果你的提交测试仅覆盖了代码库的 5%，那么它们几乎毫无用处）\n- 重复代码量\n- 圈复杂度\n- 入入耦合和出出耦合\n- 警告数量\n\
  - 代码风格\n\n提交阶段的最后一步是在直到此为止的所有内容都成功执行后，创建一个可部署的代码汇编包，准备好部署到任何后续环境中。这一步也必须成功，整个提交阶段才能被视为成功。将创建可执行代码本身被视为一种成功标准，是确保我们的构建过程本身也受到持续集成系统不断评估和审查的的一种简单方法。\n\
  \n### 提交阶段最佳实践\n\n第 3 章 “持续集成”中段描述的大多数实践都适用于提交阶段。开发者被要求等待部署流水线的提交阶段成功后再继续。如果失败了，他们应该快速修复问题，或者从版本控制中撤销更改。在理想的世界中——一个拥有无限处理器能力和无限网络带宽的世界——我们希望开发者等待所有测试（即使是手动测试）通过，以便他们能够立即修复任何问题。在现实中，这是不切行的，因为部署流水线的后期阶段（自动化验收测试、容量测试和手动验收测试）是耗时的活动。这就是对测试过程进行流水线化的原因——在问题修复成本较低时，尽快获取反馈是重要的，但不能以牺牲在更全面的反馈可用时获取这些反馈为代价。\n\
  \n## “部署流水线”术语的起源\n\n当我们第一次使用这个想法时，我们将其命名为“流水线”（pipeline），并不是因为它像流过管道的液体；而是对于我们中的硬核极客来说，它让我们想起了处理器如何“流水线化”它们的指令执行以获得某种程度并行性。处理器芯片可以并行执行指令。但你如何将一串旨在串行执行的机器指令划分成有意义的并行流呢？处理器这样做的方法非常聪明且复杂，但本质上，它们经常会到达这样的点：即它们有效地“猜测”另一个独立执行流水线中某个操作的结果，并基于该假设开始执行。如果后来发现假设是错误的，那么基于该假设的流的结果将被直接丢弃。这没有收益，也没有损失。然而，如果假设是正确的，处理器在单流执行所需的时间内就完成了双倍的工作——因此在那段时间，它的运行速度快了一倍。\n\
  \n我们的部署流水线概念以同样的方式运作。我们设计提交阶段，使其能够捕获大多数问题，同时运行速度极快。因此，我们“猜测”后续的所有测试阶段都将通过，这样我们就可以继续开发新功能，准备下一次提交并启动下一个发布候选版本。同时，我们的流水线乐观地基于成功的假设进行工作，与我们开发新功能并行运行。\n\
  \n通过提交阶段是发布候选版本之旅中的一个重要里程碑。它是我们流程中的一个关口，一旦通过，就能释放开发者去执行下一个任务。然而，他们仍然有责任监控后期阶段的进展。即使这些故障发生在流水线的后期阶段，修复损坏的构建仍然是开发团队的首要任务。我们正在赌成功——但如果我们的赌注失败了，我们准备好了支付技术债。\n\
  \n如果你只在开发过程中实现一个提交阶段，这通常代表了你们团队输出的可靠性和质量迈出了巨大的一步。然而，还需要几个阶段才能完成我们认为的最小化部署流水线。\n\n\
  ## 自动化验收测试关口\n\n一个全面的提交测试套件是许多类错误的极佳试金石，但它也有许多无法捕获的问题。单元测试构成了提交测试的绝大部分，它们与低级 API\
  \ 高度耦合，以至于开发者往往很难避免陷阱，即证明了解决方案以特定方式工作，而不是断言它解决了某个特定问题。\n\n## 为什么单元测试是不够的\n\n我们曾经参与过一个大约\
  \ 80 名开发者的大型项目。该系统是以持续集成为开发流程的核心进行开发的。作为一个团队，我们的构建纪律相当好；对于这种规模的团队，我们需要这种纪律。\n\n\
  有一天，我们将通过了单元测试的最新构建部署到了一个测试环境中。这是一种由我们的环境专家执行的耗时但受控的部署方法。然而，系统似乎无法运行。我们花费了大量时间试图寻找环境配置的问题，但没有找到。然后，我们的一位高级开发者在自己的开发机上尝试了该应用程序。在上面也不行。\n\
  \n他回溯了早更早的版本，直到发现系统实际上在三周前就已经停止工作了。一个微小、模糊的 阻止了系统的正确启动。\n\n这个项目的单元测试覆盖率良好，所有模块的平均值达到\
  \ 90%。尽管如此，80 名通常只运行测试而不运行应用程序本身的开发者在三周内都没有发现这个问题。\n\n我们修复了该漏洞，并引入了几个简单的自动化烟雾测试，作为我们持续集成过程的一部分，证明了应用程序可以运行并执行其最基本的功能。\n\
  \n\n\n\n我们从这个大型复杂项目以及许多其他经验中中学了许多教训。但最根本的一点是：单元测试仅测试了开发者对问题解决方案的视角。它们从用户角度证明应用程序执行了其预设功能的能力有限。如果我们想确保应用程序为用户提供了我们希望它提供的价值，我们就需要另一种形式的测试。我们的开发者本可以通过更频繁地自己运行应用程序并与其交互来实现这一点。这可以解决我们上面描述的特定问题，但对于大型复杂的应用程序来说，这并不是非常有效的方法。\n\
  \n这个故事还指出了我们当时所使用的开发过程中另一个常见的失败原因。我们的第一个假设是部署出了问题——即我们在将程序部署到`test environment`\
  \ 时，以某种方式误配置了系统。这是一个合理的假设，因为那种失败非常常见。部署应用程序是一个复杂且耗费人工操作的过程，非常容易出错。\n\n因此，尽管我们已经建立了一套完善、管理良好且有纪律的持续集成流程，但仍然无法确定自己能识别出真正的功能问题。我们也无法确定在部署系统时，是否会引入额外的错误。此外，由于部署耗时很长，往往是每次部署时，部署流程都会发生变化。这意味着每次尝试部署都是一次新的实验——一个手动的、易错的过程。这造成了一个恶性循环，意味着发布风险极高。\n\
  \n***\n\n针对每次提交（check-in）运行的提交测试为我们最新构建的问题以及应用程序中的微小漏洞提供了及时的反馈。但如果不在`production-like\
  \ environment`中运行验收测试，我们对应用程序是否满足客户的规范一无所知，也不知道它是否可以在真实世界中部署并生存。如果我们想在这些主题上获得及时的反馈，我们必须扩展持续集成流程的范围，以测试并演练系统的这些方面。\n\
  \n部署流水线中自动化验收测试阶段与功能验收测试之间的关系，类似于提交阶段与单元测试之间的关系。在验收测试阶段运行的大多数测试都是功能验收测试，但并非全部都是。\n\
  \n验收测试阶段的目标是断言系统交付了客户期望的价值，并符合验收标准。验收测试阶段还充当回归测试套件的角色，验证新更改没有将漏洞引入到现有行为中。正如我们在第\
  \ 8 章“自动化验收测试”中所描述的，创建和维护自动化验收测试的过程并不是由独立团队执行，而是被带到了开发流程的核心，并由跨功能交付团队执行。开发者、测试人员和客户共同工作，在作为正常开发流程的一部分编写单元测试和代码的同时，创建这些测试。\n\
  \n至关重要的是，开发团队必须对正常开发过程中发生的验收测试中断立即做出响应。他们必须判断这种中断是由于引入了回归、应用程序行为的刻意更改，还是测试本身的问题。然后，他们必须采取适当行动，使自动化验收测试套件再次通过。\n\
  \n自动化验收测试关卡是发布候选版本（release candidate）生命周期中的第二个重要里程碑。部署流水线仅允许后续阶段（例如手动请求的部署）访问那些成功克服了自动化验收测试障碍的构建版本。虽然可以尝试规避该系统，但这样做既耗时又昂贵，将精力花在修复部署流水线识别出的问题，并以其支持的受控且可重复的方式进行部署要得多。部署流水线让做正确的事比做错误更容易，因此团队会做正确的事。\n\
  \n因此，不符合所有验收标准的发布候选版本永远不会发布给用户。\n\n### 自动化验收测试最佳实践\n\n考虑你的应用程序在生产环境中可能遇到的环境是非常重要的。如果你只部署到你控制下的单个生产环境，那么你很幸运了。只需在该环境的副本上运行你的验收测试即可。如果生产环境复杂或昂贵，你可以使用它的缩减版本，例如使用几个中间件服务器，而生产环境中可能有很多个。如果你的应用程序依赖于外部服务，你可以对你依赖的任何外部基础设施使用测试双胞（test\
  \ doubles）。关于这些方法的细节，我们将在第 8 章“自动化验收测试”中进行更详细的介绍。\n\n如果你必须针对许多不同的环境，例如，如果你正在开发一种必须安装在用户计算机上的软件，你需要在一组可能的目标环境中运行验收测试。这通过构建构建网格（build\
  \ grid）最容易实现。设置一组测试环境，每个目标测试环境至少一个，并在所有这些环境上并行运行验收测试。\n\n在许多执行了自动化功能测试的组织中，一种常见的做法是专门设立一个团队来负责测试套件的制作和维护。正如在第\
  \ 4 章“实施测试策略”中详述的那样，这是一个坏主意。最有问题的结果是，开发者感觉自己并不拥有这些验收测试。结果，他们往往不关注部署流水线这一阶段的失败，导致该阶段长时间处于损坏状态。在没有开发者参与的情况下编写的验收测试往往与\
  \ UI 紧耦合，因此是脆弱且构构不良的，因为测试人员对 UI 的底层设计没有任何洞察，并且缺乏创建抽象层或针对公共 API 运行验收测试的技能。\n\n现实情况是，整个团队都拥有验收测试，就像整个团队拥有流水线的每个阶段一样。如果验收测试失败，整个团队应该停下来并立即修复它们。\n\
  \n这种做法的一个重要推论是，开发者必须能够在他们的开发环境中运行自动化验收测试。对于发现验收测试失败的开发者来说，应该能够在自己的机器上轻松地修复它，并通过在本地运行该验收测试来验证修复。最常见的障碍是所用测试软件的许可证不足，以及应用程序架构阻止了系统部署到开发环境中以便对其运行验收测试。如果你的自动化验收测试策略想要长期成功，就必须消除这类障碍。\n\
  \n\n\n验收测试很容易与应用程序中的特定解决方案过度耦合，而不是断言系统的业务价值。当这种情况发生时，越来越多的时间被花在了维护验收测试上，因为系统行为的微小变化会导致测试失效。验收测试应该用业务语言来表达（埃里克·万文斯所谓的“通用语言”^(3)），而不是应用程序的技术语言。这意味着，虽然使用团队开发时使用的相同编程语言来编写验收测试是可以的，但抽象层应该工作在业务行为层面——是“下订单”而不是“点击订单按钮”，“确认资金转账”而不是“检查\
  \ fund_table 有结果”，以此此类推。\n\n虽然验收测试极具价值，但它们的创建和维护成本也可能非常高。因此，记住自动化验收测试也是回归测试至关重要。不要遵循一种天真的流程，即获取你的验收标准并盲目地每一项进行自动化。\n\
  \n我们参与过的几个项目发现，由于遵循了上述描述的一些糟糕实践，导致自动化功能测试没有提供足够的价值。它们的维护成本太高，因此停止了自动化功能测试。如果测试花费的精力超过了它们节省的精力，那么这就是正确的决定；但改变测试创建和维护的管理方式可以大幅减少投入的精力，并显著改变成本效益方程。正确地进行验收测试是第\
  \ 8 章“自动化验收测试”的主题。\n\n## 后续测试阶段\n\n验收测试阶段是发布候选版本生命周期中的重要里程碑。一旦完成此阶段，成功的发布候选版本就从一个很大程度上属于开发团队的东西，变成了具有更广泛关注和使用的东西。\n\
  \n对于最简单的部署流水线，通过验收测试的构建至少在系统自动化测试方面已经准备好发布给用户了。如果候选版本没有通过此阶段，根据定义，它是不适合发布的。\n\n\
  发布候选版本到这一点的进展是自动的，成功的候选版本会自动提升到下一个阶段。如果你是增量交付软件，可能会像 Timothy Fitz 的博客文章“持续部署”[dbnlG8]\
  \ 中描述的那样实现生产环境的自动部署。但对于许多系统来说，即使你有一套完整的自动化测试，在发布之前进行某种形式的人工测试也是理想的。许多项目拥有测试与其他系统集成的环境、测试容量的环境、探索性测试环境，以及分阶段环境和生产环境。这些环境中的每一个都可以或或类似于生产环境，并有它们自己独特的配置。\n\
  \n图 5.7 部署示例\n\n![Image](img/fig5_7.jpg)\n\n部署流水线也负责到测试环境的部署。如 AntHill Pro 和 Go\
  \ 等发布管理系统提供了查看当前部署到每个环境中的内容以及向该环境执行一键部署的能力。当然，在幕后，这些仅仅运行了你编写的用于执行部署的脚本。你也可以基于 Hudson\
  \ 或 CruiseControl 系列等开源工具构建自己的系统来完成此，尽管商业工具提供了开箱即用的可视化、报告和对部署的细粒度授权。如果你创建了自己的系统，关键需求是：能够看到通过了验收测试阶段的发布候选版本列表，有一个按钮可以将你选择的版本部署到你选择的环境中，查看每个环境中当前部署了哪个发布候选版本，以及它源自版本控制中的哪个版本。图\
  \ 5.7 显示了一个执行这些功能的自制系统。\n\n到这些环境的部署可以顺序执行，每一个都取决于前一个的成功结果，因此只有在部署到 UAT 和分阶段环境后，你才能部署到生产环境。它们也可以并行发生，或者作为手动选择的备选阶段提供。\n\
  \n至关重要的是，部署流水线允许测试人员根据需要将任何构建部署到他们的测试环境中。这取代了“每夜构建”的概念。在部署流水线中，测试人员不再是被给他们一个基于任意版本（每个人回家之前提交的最后更改）的构建，而是测试人员可以看到哪些构建通过了自动化测试，应用程序\
  \ string 了哪些更改，并选择他们想要的构建。如果构建在某些方面被证明是不尽如人意的——可能它没有包含正确的更改，或者包含某些使其不适合测试的错误——测试人员可以重新部署任何其他构建。\n\
  \n#### 人工测试\n\n在迭代过程中，验收测试之后总是会有某些形式的人工测试，如探索性测试、易用性测试和演示（showcases）。在此点之前，开发人员可能向分析师和测试人员演示应用程序的功能，但这两个角色都不会在一个未知的已通过自动化验收测试的构建上浪费时间。测试人员在这个过程中的角色不应该是对系统进行回归测试，而是首先要通过手动证明满足验收标准，以确保验收测试真实验证了系统的行为。\n\
  \n之后，测试人员专注于人类擅长而自动化测试不擅长的测试。他们进行探索性测试，对应用程序的易用性进行用户测试，检查各种平台上的外观和感受，并执行病态的最坏情况测试。自动化验收测试为测试人员释放了时间，让他们能够专注于这些高价值活动，而不是成为人类的测试脚本执行机器。\n\
  \n### 非功能测试\n\n每个系统都有许多非功能性需求。例如，几乎每个系统对容量和安全都有某些要求，或者它必须遵守的服务水平协议（SLA）。运行自动化测试来衡量系统遵循这些要求的程度通常是有意义的。关于如何实现这一点更多详细信息，请参见第\
  \ 9 章“测试非功能需求”。对于其他系统，非功能需求的测试不需要持续进行。在需要的情况下，根据我们的经验，在流水线中创建一个阶段来运行这些自动化测试仍然是有价值的。\n\
  \n## 准备发布\n\n\n\n\n每一个生产系统的发布都伴随着业务风险。在最好的情况下，如果发布时点出现严重问题，可能会延迟有价值的新功能的上线；在最坏的情况下，如果没有制定合理的回滚计划，可能会导致业务失去关键任务资源，因为这些资源已经作为新系统发布的一部分被下线了。\n\
  \n当我们把发布步骤视为部署流水线的自然结果时，缓解这些问题就变得非常简单。从根本上说，我们希望：\n\n*   拥有一由所有参与软件交付的人员（包括人员、测试人员，以及运维、基础设施和支持人员）创建并维护的发布计划。\n\
  *   通过尽可能地自动化流程（从最容易出错的阶段开始），最大限度地减少人为失误的影响。\n*   在类生产环境中经常演练操作流程，以便对该流程和支持该流程的技术进行调试。\n\
  *   在情况不符合预期时，具备回滚发布的能力。\n*   在升级和回滚过程中，拥有一套配置和生产数据的迁移策略。\n\n我们的目标是实现完全自动化的发布过程。发布应该像选择一个应用程序版本并按下按钮一样简单。回滚也应该同样简单。关于这些主题，在第\
  \ 10 章“部署与发布应用程序”中有更多详细信息。\n\n## 自动化部署与发布\n\n我们对代码执行环境的控制越少，出现意外行为的可能性就越大。因此，每当我们发布软件系统时，都希望对部署的每一个比特都拥有控制。有两个因素可能会阻碍这一理想。首先，对于许多应用程序，你无法对所创建的软件的运行环境拥有完全控制。这对于由用户安装的产品和应用程序（如游戏或办公软件）来说尤其如此。这个问题通常通过选择目标环境的代表性样本，并在每个样本环境中并行运行自动化验收测试套件来缓解。然后，你可以分析产生的数据，以确定哪些测试在哪些平台上失败了。\n\
  \n第二个限制是，建立这种程度控制的成本通常被认为超过了其收益。然而，通常恰恰相反：生产环境的大多数问题都是由控制不足引起的。正如我们在第 11 章中所描述的，生产环境应该被完全锁定——对其的更改只能通过自动化过程进行。这不仅包括应用程序的部署，还包括对其配置、软件栈、网络拓扑和状态的更改。只有这样，才可能可靠地对其进行审计、诊断问题并在预测的时间内进行修复。随着系统复杂性的增加，不同类型的服务器数量随之增加，而对性能的要求越高，这种级别的控制就越重要。\n\
  \n管理生产环境的过程也适用于其他测试环境，如预发布环境、集成环境等。通过这种方式，你可以利用自动化变更管理系统在手动测试环境中创建一个完美调的配置。这些配置可以调整到完美境界，或许可以使用容量测试的反馈来评估你所做的配置更改。当你对结果满意时，就可以以预测、可靠的方式复制到每个需要该配置的服务器上（包括生产环境）。环境的所有方面都应该这样管理，包括中间件（数据库、Web\
  \ 服务器、消息队列和应用程序服务器）。每一项都可以进行调整和微调，并将最优设置添加到你的配置基准中。\n\n通过使用环境自动供应和管理、良好的配置管理实践以及（在适当）虚拟化，可以显著降低环境供应和维护的成本。\n\
  \n一旦环境配置管理正确，就可以部署应用程序。这些细节很大程度上取决于系统所采用的技术，但步骤总是非常相似。我们在创建构建和部署脚本的方法中利用了这种相似性（这在[第\
  \ 6 章](#ch06.html_ch06）“构建与部署脚本编写”中讨论过），并在监控流程的方式中也利用了这一点。\n\n通过自动化部署和发布，交付过程变得民主化。开发人员、测试人员和运维团队不再需要依赖工单系统和邮件线程来部署构建，以便收集有关系统生产就绪情况的反馈。测试人员可以决定在他们的测试环境中使用哪个版本的系统，而不需要自己成为技术专家，也不需要依赖此类专业知识的可用性来进行部署。由于部署很简单，他们可以更频繁地更改被测试的构建，在发现特别有趣的\
  \ Bug 时，可能会返回系统的更早版本以将其行为与最新版本进行比较。销售人员可以访问应用程序的最新版本，其包含能打动客户的杀手锏功能。根据我们的经验，人们开始变得放松。他们认为整个项目的风险更低——主要是因为风险确实更低。\n\
  \n风险降低的一个重要原因是发布过程本身被演练、测试和完善的程度。由于你使用相同的流程将系统部署到每个环境并进行发布，因此部署过程被非常频繁地测试——也许一天多次。当你毫无故障地部署了第五十次或第百次复杂系统后，你就不再认为它是一件大事了。我们的目标是尽快到达那个阶段。如果我们想对发布过程和技术完全充满信心，我们必须经常使用它并证明它是好的，就像对待我们系统的其他任何方面一样。通过部署流水线以最短的时间和最精简的程序向生产环境部署单个更改应该是可能的。发布过程应该被持续地评估和改进，尽可能在产生问题的地方尽早发现问题。\n\
  \n许多业务需要每天发布几次软件新版本的能力。即使是产品公司，在发现关键缺陷或安全漏洞时，通常也快速向用户提供新版本。部署流水线和书中相关的实践是安全可靠地做到此点的。尽管许多敏捷开发流程受益于频繁发布到生产环境（在适用情况下，我们强烈建议这样做），但这并不总是合理的。有时，我们需要进行大量工作，才能能够发布出一组对用户整体而言有意义的功能，特别是在产品领域。\n\
  \n\n\n\n发布日之所以在传统上令人恐惧有两个原因。第一个是担心引入问题，因为某人在执行软件发布的手动步骤时可能会犯下难以察觉的错误，或者是因为指令中存在错误。第二种恐惧是，一旦发布失败（无论是因为发布过程中的问题还是因为新版本的软件缺陷），你就陷入了困境。无论何种情况，唯一的希望就是你足够聪明，能够迅速解决问题。\n\
  \n我们基本上通过每天多次演练发布来缓解第一个问题，以证明我们的自动化部署系统可以正常工作。第二种恐惧则通过提供回滚策略（back-out strategy）来缓解。在最坏的情况下，你可以回到开始发布之前的状态，这让你有时间来评估问题并找到合理的解决方案。\n\
  \n总的来说，最好的回滚策略是在发布新版本的同时，保持旧版本的可用——并在发布后一段时间内持续可用。这是我们在第 10 章“部署和发布应用程序”中讨论的某些部署模式的基础。对于非常简单的应用程序（在不忽略数据和配置迁移的情况下），可以通过将每个版本放在一个目录中，并使用符号链接（symlink）指向当前版本来实现。通常，与部署和回滚相关的最复杂问题是生产数据的迁移。这在第\
  \ 12 章“数据管理”中进行了详细讨论。\n\n下一个最佳选择是从零重新部署应用程序之前的良好版本。为了实现这一点，你应该能够点击按钮来发布通过了所有测试阶段的任何版本的应用程序，就像在部署流水线控制的其他环境中那样。这种理想化的状态对于某些系统是完全可以实现的，即使对于关联大量数据的系统也是如此。然而对于某些系统，即使是单个更改，提供完全且版本无关的回滚成本在时间上可能过高。尽管如此，这种理想是有用的，因为它设定了一个每个项目都应该努力的目标。即使在某些方面略有不足，但你越接近这个理想状态，你的部署就变得越简单。\n\
  \n绝不要使用与部署流程不同的回滚流程，也不要执行增量部署或回滚。这些流程很少经过测试，因此是不可靠的。它们也不会从已知的基准开始，因此是脆弱的。始终通过保留已部署的旧版本应用程序或完全重新部署之前的已知良好版本来回滚。\n\
  \n### 在成功的基础上\n\n当发布候选（release candidate）可以部署到生产环境时，我们就可以确定以下关于它的断言是正确的：\n\n*  \
  \ 代码可以编译。\n*   代码执行了开发者所认为应该执行的功能，因为它通过了单元测试。\n*   系统执行了分析师或用户认为应该执行的功能，因为它通过了所有的验收测试。\n\
  *   基础设施和基准环境的配置得到了妥当管理，因为应用程序已经在类生产环境中经过了测试。\n*   代码包含了所有正确的组件，因为它是可部署的。\n*   部署系统工作正常，因为至少在这一发布候选被提升到此阶段之前，它已经在开发环境中被用过一次，在验收测试阶段用过一次，在测试环境中用过一次。\n\
  *   版本控制系统包含了我们部署所需的所有内容，无需人工干预，因为我们已经部署了多次该系统。\n\n这种“在成功的基础上构建”的方法，结合我们“尽可能让流程或其任何部分失败”的格言，在每个层面都有效。\n\
  \n### 实现部署流水线\n\n无论你是从零开始一个新项目，还是尝试为现有系统创建自动化流水线，通常都应该采取增量方法来实现部署流水线。在本节中，我们将阐述从无到构建完整流水线的策略。总的来说，步骤如下：\n\
  \n1.  建模你的价值流并创建一个“行走骨架”（walking skeleton）。\n2.  自动化构建和部署过程。\n3.  自动化单元测试和代码分析。\n\
  4.  自动化验收测试。\n5.  自动化发布。\n\n#### 建模你的价值流并创建行走骨架\n\n正如本书开头所述，第一步是绘制出价值流中从提交（check-in）到发布的部分。如果你的项目已经在运行，你可以使用纸和笔在大约半小时内完成这一。去与参与此过程的每个人交谈，并写下这些步骤。包括对耗时和增值时间的最佳估计。如果你正在进行一个新项目，你必须想出一个合适的价值流。一种方法是查看同组织内另一个与你的项目特征相似的项目。或者，你可以从最基本的需求开始：一个用于构建应用程序并运行基础指标和单元测试的提交阶段，一个运行验收测试的阶段，以及第三个阶段将应用程序部署到类生产环境以便你进行演示。\n\
  \n一旦你有了价值流图，就可以在你的持续集成和发布管理工具中对流程进行建模了。如果你的工具不允许直接对价值流进行建模，你可以通过项目之间的依赖来模拟它。这些项目起初应该什么都不做——它们只是你可以顺序触发的占位符。使用我们的“最基础”示例，每当有人提交到版本控制时，就应该运行提交阶段。运行验收测试的阶段在提交阶段通过后自动触发，并使用提交阶段创建的相同二进制文件。任何将二进制文件部署到类生产环境用于手动测试或发布的阶段，都应该要求你通过按钮来选择要部署的版本，这种功能通常需要授权。\n\
  \n然后你可以让这些占位符真正发挥作用。如果你的项目已经进展良好，这意味着要接入现有的构建、测试和部署脚本。如果不是，你的目标是创建一个“行走骨架”，这意味着完成最少的工作让所有关键元素到位。首先，让提交阶段运行起来。如果你还没有任何代码或单元测试，只需创建一个简单的“Hello\
  \ world”示例，或者对于 Web 应用程序，创建一个 HTML 页面，并编写一个断言为单元测试。然后你可以进行部署——也许在 IIS 上设置一个虚拟目录并将你的网页放入其中。最后，你可以进行验收测试——你需要在部署之后进行测试，因为你需要部署应用程序才能对其运行验收测试。你的验收测试可以启动\
  \ `WebDriver` 或 `Sahi` 并验证网页是否包含“Hello world”文本。\n\n在一个新项目中，这一切都应该在开发工作开始之前完成——如果你使用的是迭代开发流程，则属于迭代\
  \ 0（iteration zero）。你组织的系统管理员或运维人员应该参与设置类生产环境，以便从中运行演示并开发部署到该环境的脚本。\n\n\n\n\n# 构建与部署过程自动化\n\
  \n实现流水线的的第一步是将构建和部署过程自动化。构建过程以源代码作为输入，并生成二进制文件作为输出。“二进制文件（Binaries）”是一个刻意模糊的词，因为你的构建过程所产生的内容取决于你所使用的技术。二进制文件的关键特征是，你应该能够将它们拷贝到一台新机器上，并且在配置适当的环境以及该环境下对应用程序进行正确配置的情况下，启动你的应用程序——而无需依赖该机器上安装了开发工具链的任何部分。\n\
  \n每当有人提交代码（check in）时，你的持续集成服务器软件都应该执行构建过程。请使用 56 页中“实施持续集成”章节列出的许多工具之一。你的 `CI`\
  \ 服务器应配置为：监控你的版本控制系统，每当代码发生变化时都检出或更新你的源代码，运行自动化构建过程，并将二进制文件存储在文件系统中，以便整个团队能够通过 `CI`\
  \ 服务器的用户界面访问这些文件。\n\n一旦你建立并运行了持续构建过程，下一步就是自动化部署。首先，你需要一台机器来部署你的应用程序。对于新项目，这可以是你持续集成服务器所在的机器。对于更成熟的项目，你可能需要寻找几台机器。根据你组织的惯，这种环境可以被称为预发布环境（staging）或用户验收测试（`UAT`）环境。无论如何，这个环境应该像第\
  \ 10 章“部署和发布应用程序”描述的那样类似于生产环境，其配置和维护应该是像第 11 章“管理基础设施和环境”描述的完全自动化的过程。\n\n第 6 章“构建与部署脚本”中讨论了部署自动化几种常用方法。部署可能涉及首先打包你的应用程序，如果应用程序的不同部分需要安装在不同的机器上，则可能将其分成几个独立的包。接下来，安装和配置应用程序的过程应该是自动化的。最后，你应该编写某种形式的自动化部署测试，以验证应用程序已成功部署。部署过程的可靠性非常重要，因为它也被用作自动化验收测试的先决条件。\n\
  \n一旦你的应用程序部署过程实现了自动化，下一步就是能够对你的 `UAT` 环境执行“一键部署”。配置你的 `CI` 服务器，使你可以选择应用程序的任何构建版本并点击按钮触发一个流程：该流程获取该构建生成的二进制文件，运行部署该构建的脚本，并运行部署测试。确保在开发构建和部署系统时，利用了我们描述的原则，例如只构建一次二进制文件并将配置与二进制文件分离，这样相同的二进制文件就可以在每个环境中使用。这将确保你的项目配置管理建立在稳实的基础上。\n\
  \n除了用户安装的软件外，发布过程应该与你部署到测试环境的相同的过程。唯一的技术差异应该在于环境的配置。\n\n# 自动化单元测试与代码分析\n\n开发部署流水线的下一步是实现完整的提交阶段（full\
  \ commit stage）。这意味着在每次提交时都运行单元测试、代码分析，并最终运行一组验收测试和集成测试。运行单元测试不应任何复杂的设置，因为根据定义，单元测试不依赖于应用程序的运行。相反，它们可以通过许多\
  \ `xUnit`-风格的框架之一针对你的二进制文件运行。\n\n由于单元测试不接触文件系统或数据库（否则它们就是组件测试了），它们的运行速度也应该很快。这就是为什么你应该在构建应用程序后直接运行单元测试的原因。你还可以对你的应用程序运行静态分析工具，以报告有用的诊断数据，如编码风格、代码覆盖率、圈复杂度、耦合性等。\n\
  \n随着你的应用程序变得越来越复杂，你将编写大量的单元测试以及一组组件测试。这些都应该进入提交阶段。一旦提交阶段耗时超过五分钟，将其拆分为并行运行的套件就有意义了。为了实现这一点，你需要获取几台机器（或一台拥有大量内存和多个\
  \ CPU 的机器），并使用支持拆分工作并并行运行的 `CI` 服务器。\n\n### 自动化验收测试\n\n你流水线的验收测试阶段可以重用你用于部署到测试环境的脚本。唯一的区别在于，运行冒烟测试（smoke\
  \ tests）之后，需要启动验收测试框架，并在测试运行结束时收集生成的报告以便分析。存储应用程序创建的日志也是有意义的。如果应用程序有 GUI，你还可以使用像\
  \ `Vnc2swf` 这样的工具在验收测试运行时创建屏幕录制，以帮助你调试问题。\n\n验收测试分为两类：功能性和非功能性。在任何项目中，从早期开始测试容量和扩展特性等非功能性参数至关重要，这样你对应用程序是否能满足其非功能性需求就有大致的了解。在设置和部署方面，这一阶段的工作方式与功能验收测试阶段完全相同。然而，测试内容自然会有不同（参见第\
  \ 9 章“测试非功能性需求”获取更多关于创建此类测试的信息）。在开始时，完全可能将验收测试和性能测试作为单个阶段的一部分连续对地运行。然后你可以将它们分开，以便轻松区分是哪一组测试失败了。一组良好的自动化验收测试将帮助你追踪间性和难以复现的问题，例如竞态条件、死锁和资源竞争，这些问题在应用程序发布后发现和调试将困难得多。\n\
  \n你作为流水线验收测试和提交阶段的一部分创建的测试类型，当然取决于你的测试策略（参见第 4 章“实施测试策略”）。然而，你应该尝试在项目早期为每种类型的测试至少自动化运行一两个，并将其整合到你的部署流水线中。这样你就拥有了一个可以随着项目增长轻松添加测试的框架。\n\
  \n### 演进你的流水线\n\n我们描述的上述步骤出现在我们看到的几乎每个价值流（以及流水线）中。它们通常是自动化的首要目标。随着你的项目变得复杂，你的价值流将发生演进。流水线有两种常见的潜在扩展：组件和分支。大型应用程序最好作为一组组合的组件进行构建。在这样的项目中，为每个组件设置一个微流水线是有意义的，然后有一个汇总所有组件并让整个应用程序通过验收测试、非功能测试，然后部署到测试、预发布和生产环境的流水线。这一主题在第\
  \ 13 章“管理组件和依赖关系”中进行了详细讨论。分支管理在第 14 章“高级版本控制”中进行了讨论。\n\n\n\n\n流水线的实现在不同项目之间会有巨大差异，但对于大多数项目，任务本身是一致的。将它们作为一种模式可以加速任何项目构建和部署过程的创建。然而，归根结底，流水线的目的是为你的构建、部署、测试和发布应用程序的过程建模。然后，流水线确保每项更改都能以尽可能自动化的方式独立地通过这一过程。\n\
  \n在实现流水线时，你会发现你与相关人员的交流以及你实现的效率提升，反过来会对你的流程产生影响。因此，记住三点至关重要。\n\n首先，不需要一次实现整个流水线。它应该增量地实现。如果你的流程中某部分目前是手动操作的，请在工作流中为它创建一个占位符。确保你的实现记录了该手动过程何时开始以及何时完成。这能让你让你看到每个手动过程花费了多少时间，从而估算出它在多大程度上是一个瓶颈。\n\
  \n其次，你的流水线是关于构建、部署、测试和发布应用程序效率的丰富数据源。你创建的部署流水线实现应该记录每个过程开始和结束的时间，以及通过流程中每个阶段的具体更改是什么。这些数据反过来允许你衡量从提交更改到将其部署到生产环境的周期时间，以及过程中每个阶段花费的时间（市场上的某些商业工具会为你完成这一点）。因此，你就可以确切地看到你的流程瓶颈在哪里，并按优先级对它们进行攻击。\n\
  \n最后，你的部署流水线是一个活的系统。当你不断努力改进交付流程时，你应该继续维护你的部署流水线，像处理你用它交付的应用程序一样，努力去改进和重构它。\n\n\
  ## 指标\n\n反馈是任何软件交付过程的核心。改进反馈的最佳方法是缩短反馈周期并使结果可见。你应该持续测量，并以某种无法避免的方式广播测量结果，例如挂在墙上非常显眼的的海报上，或者在专门显示加粗、大结果的计算机显示器上。这些设备被称为信息辐射器（information\
  \ radiators）。\n\n然而，重要的问题是：你应该测量什么？你选择测量的内容将对你团队的行为产生巨大影响（这被称为霍桑效应）。测量代码行，开发者就会写很多短代码行；测量修复缺陷的数量，测试人员就会记录那些通过与开发者进行快速讨论就能修复的缺陷。\n\
  \n根据精益哲学，全局优化比局部优化至关重要。如果你花费大量时间消除一个实际上并不是限制你交付流程的瓶颈，你对交付过程就不会产生任何影响。因此，拥有一个用于判断整个交付流程是否存在问题的全局指标非常重要。\n\
  \n对于软件交付过程，最重要的全局指标是周期时间（cycle time）。这是从决定某个功能需要实现到该功能发布给用户之间的时间。。正如 Mary Poppendieck\
  \ 所问的：“你的组织部署一个仅涉及单行代码的更改需要多久？你们是否在可重复、可靠的基础上这样做？”这个指标很难衡量，因为它涵盖了软件交付过程的许多部分——从分析、开发到发布。然而，它比任何其他指标都能让你更多关于你流程的信息。\n\
  \n许多项目错误地选择了其他衡量标准作为主要指标。关注软件质量的项目通常选择测量缺陷数量。然而，这是一个次要指标。如果使用该指标的团队发现了一个缺陷，但需要六月时间才能发布修复程序，那么知道缺陷的存在并不很有用。关注缩短周期时间会鼓励提高质量的做法，例如使用全面的自动化测试套件，并在每次提交（check-in）后运行。\n\
  \n部署流水线的正确实现应该能够简单地计算出对应于从提交到发布的价值流部分的周期时间。它还应该让你看到从提交到流程每个阶段的置置时间（lead time），以便你发现瓶颈。\n\
  \n一旦你知道了应用程序的周期时间，就可以找出如何最好减少它。你可以使用约束理论（Theory of Constraints）通过应用以下过程：\n\n1. 识别系统的限制性约束。这是你的构建、测试、部署和发布过程中的瓶颈部分。随机选一个例子，也许是手动测试过程。\n\
  2. 利用约束。这意味着要确保该过程该部分的吞吐量最大化。在我们的示例（手动测试）中，你会确保始终有一个等待手动测试的任务队列，并确保参与手动测试的资源不被用于任何其他事情。\n\
  3. 使所有其他过程服从于约束。这意味着其他资源不会以 100% 的效率工作——例如，如果你的开发者全速开发功能故事，等待测试的任务积压将继续增长。相反，让你的开发者工作到恰好保持积压不变，并将剩余时间花在编写自动化测试以捕获错误，这样就可以减少手动测试的时间。\n\
  4. 提高约束。如果你的周期时间仍然太长（也就是说，第 2 步和第 3 步没有提供足够的帮助），你需要增加可用的资源——雇佣更多测试人员，或者在自动化测试上投入更多精力。\n\
  5. 清洗并重复。找到系统中的下一个约束，并返回第 1 步。\n\n虽然周期时间是软件交付中最重要的指标，但还有许多其他诊断可以警告你问题。这些包括\n\n•\
  \ 自动化测试覆盖率\n• 代码库的属性，如重复率、圈复杂度、出耦合和入耦合、样式问题等\n• 缺陷数量\n• 速率（Velocity），即团队交付运行的、测试过的、可用代码的速率\n\
  • 每天向版本控制系统的提交次数\n• 每天构建次数\n• 每天失败次数\n• 构建持续时间，包括自动化测试\n\n图 5.8 由 Panopticode 生成的显示\
  \ Java 代码库圈复杂度的树图\n\n![Image](img/fig5_8.jpg)\n\n\n\n考虑如何呈现这些指标是值得的。上述描述的报告产生了海量数据，而解读这些数据是一门艺术。例如，项目经理可能希望看到数据被分析并聚合为一个单一的“健康”指标，并以红绿灯的形式（显示红色、琥珀色或绿色）呈现。团队的技术主管将想要更多细节，但即使是他们，也不希望翻阅一页又一页的报告。我们的同事\
  \ Julias Shaw 创建了一个名为 Panopticode 的项目，它可以针对 Java 代码运行一系列此类报告，并生成丰富且密集的视化结果（例如图 5.8），让你能一眼看出代码库是否存在问题以及问题所在之处。关键在于创建聚合数据的可视化形式，并使其呈现方式使得人类大脑能够最有效地利用其无与伦比的模式匹配能力来识别流程或代码库中的问题。\n\
  \n每个团队的持续集成服务器都应该在每次提交（check-in）时生成这些报告和可视化结果，并将报告存储在你的制品仓库中。然后，你应该在数据库中汇总结果，并在所有团队中进行跟踪。这些结果应该发布在内部网站上——为每个项目准备一个页面。最后，将它们聚合在一起，以便可以在你整个开发计划中的所有项目、甚至是整个组织中进行监控。\n\
  \n## 总结\n\n部署流水线的目的是让所有参与软件交付的人员都能看到从提交到发布的构建进度。它应该能够看到哪些更改破坏了应用程序，哪些更改产生了适用于手动测试或发布的发布候选版本（release\
  \ candidates）。你的实现应该能够实现“一键式”部署到手动测试环境中，并查看这些环境中有哪些发布候选版本。选择发布应用程序的特定版本也应该是一项一键即可完成的任务，且在执行时能够完全知晓并确认正在部署的发布候选版本已成功通过了整个流水线，因此已经在类生产环境中接受了的一系列自动化测试和手动测试。\n\
  \n一旦你实现了部署流水线，发布过程中的低效问题就会变得显而易见。从运行良好的部署流水线中可以获得各种有用信息，例如发布候选版本通过各种手动测试阶段需要多长时间、从提交到发布的平均周期时间，以及在流程的哪些阶段发现了多少缺陷。一旦你拥有了这些信息，就可以优化你构建和发布软件的流程。\n\
  \n对于实现部署流水线这一复杂问题，并没有万能的解决方案。关键点是创建一个记录系统，来管理从提交到发布的每项更改，提供你能够在流程中尽早发现问题所需的信息。拥有部署流水线的实现后，可以用来消除流程中的低效环节，从而让你的反馈循环更快、更强大，例如通过添加更多的自动化验收测试并更激进地并行化它们，或者通过让你的测试环境更接近生产环境，又通过实施更好的配置管理流程。\n\
  \n反过来，部署流水线取决于某些基础建设：良好的配置管理、用于构建和部署应用程序的自动化脚本，以及证明你的应用程序将为用户提供价值的自动化测试。它还需要自律，例如确保只有通过了自动化构建、测试和部署系统的更改才能被发布。我们在第\
  \ 15 章“管理持续交付”中讨论了这些前提条件和必要的纪律，该章节包含一个针对持续集成、测试、数据管理等的成熟模型。\n\n本书的后续章节将对实现部署流水线进行深入详细的探讨，探索一些可能出现的常见问题，并讨论在本文描述的全生命周期部署流水线背景下可以采用的技术。\n\
  \n## 第 6 章 构建与部署脚本\n\n## 引言\n\n在非常简单的项目中，软件的构建和测试可以使用 IDE（集成开发环境）的能力完成。然而，这真的只适用于最微小的任务。一旦项目扩展到单人之外、跨度超过几天，或者产生的输出多于单个可执行文件，它就要求更多的控制，否则它就会变得复杂且难以管理。在大型团队或分布式团队（包括开源项目）中工作时，对应用程序的构建、测试和打包进行脚本化也是至关重要的，否则可能需要几天时间才能让新团队成员上手并运行。\n\
  \n第一步实际上非常简单：几乎每个现代平台都有从命令行运行构建的方法。Rails 项目可以运行默认的 `Rake` 任务；.NET 项目可以使用 `MsBuild`；Java\
  \ 项目（如果设置得当）可以使用 `Ant`、`Maven`、`Buildr`、^(1) 或 `Gradle`；而使用 `SCons` 则不需要什么就能让一个简单的\
  \ C/C++ 项目运行起来。这使得开始持续集成变得而易举——只需让你的 CI 服务器运行此命令来创建二进制文件即可。在许多平台上，运行测试也是一个相对直接的过程，只要你使用的是较流行的测试框架之一。Rails\
  \ 用户和使用 `Maven` 或 `Buildr` 的 Java 项目只需要运行相关命令即可。.NET 和 C/C++ 用户将需要进行一些复制粘贴操作来让一切运行起来。然而，一旦你的项目变得更加复杂——你有多个组件，或有不寻常打包需求——你就需要卷起袖子深入构建脚本了。\n\
  \n自动化部署引入了进一步的复杂性。将软件部署到测试和生产环境很少像简单地将单个二进制文件丢进生产环境中然后带着满意的微笑坐着那么简单。在大多数情况下，它需要一系列步骤，例如配置你的应用程序、初始化数据、配置基础设施、操作系统和中间件、设置模拟系统等。随着项目的变得复杂，这些步骤会变得越来越多、耗时越长，而且（如果没有自动化的话）越容易出错。\n\
  \n使用通用构建工具执行部署，除了最简单的情况外，都是自找麻烦。可用的部署机制将限于支持你目标环境和中间件的机制。更重要的是，关于如何进行自动化的决策应该由开发人员和运维人员共同做出，因为他们都需要熟悉这项技术。本章旨在为你提供所有构建和部署工具通用原理的概述、入门所需的信息、一些技巧以及指向更多信息的指引。我们在本章中不涵盖通过脚本管理环境；那将在第\
  \ 11 章“管理基础设施和环境”中讨论。我们在本章中未提供的另一个是代码示例和工具详细描述，因为这些会迅速过时。你可以在本书的网站 [dzMeNE] 上找到关于可用工具的更多详细信息以及示例脚本。\n\
  \n\n\n\n构建和部署系统必须是充满活力的实体，它们不仅要能够在初始开发项目期间持续，还要在其作为生产环境中可维护软件系统的整个生命周期内持续。因此，它们必须被用心心地设计和维护——像对待其他源代码一样来对待它们——并定期进行测试，以便在我们准备好使用它们时知道它们是可以正常工作的。\n\
  \n## 构建工具概述\n\n图 6.1 简单的构建依赖网络\n\n![Image](img/fig6_1.jpg)\n\n自动化构建工具长期以来一直是软件开发的一部分。许多人可能还记得\
  \ `Make` 及其许多变体，它们在多年里一直是许多人使用的标准构建工具。所有构建工具都有一个共同的核心：它们允许你建模一个依赖网络。当你运行工具时，它将通过按正确顺序执行任务、并精确执行一次目标所依赖的每个任务来计算如何到达你指定的目标。例如，假设你想运行测试。为了做到，必须编译你的代码和测试代码，并设置测试数据。编译任何内容都需要初始化你的环境。图\
  \ 6.1 显示了一个依赖网络示例。\n\n你的构建工具会计算出它需要执行依赖网络中的每一个任务。它可以从 `init` 或设置测试数据开始，因为这些任务是独立的。一旦完成了\
  \ `init`，它就可以编译源码或测试代码——但在运行测试之前，它必须完成这两者并设置测试数据。尽管有多个目标依赖于 `init`，它也只执行一次。\n\n\
  值得注意的一个小点是，任务具有两个本质特征：它所做的事情以及它所依赖的其他事情。这两个特征在每个构建工具中都经过了建模。\n\n然而，构建工具在一个方面存在差异：即它们是**面向任务的**（task-oriented）还是**面向产物的**（product-oriented）。面向任务的构建工具（例如，`Ant`、`NAnt`\
  \ 和 `MSBuild`）通过一组任务来描述依赖网络。面向产物的工具（如 `Make`）则根据它们生成的产（如可执行文件）来描述事物。\n\n这种区别初看起来似乎有些学术化，但对于理解如何优化构建以及确保构建过程的正确性非常重要。例如，构建工具必须确保对于给定的目标，每个前提条件必须恰好执行一次。如果漏掉了前提条件，构建过程的结果将很糟糕。如果前提条件执行了多次，最好的情况是构建将花费更长时间（如果该前提条件是幂等的），最坏的情况是构建过程的结果再次变糟。\n\
  \n通常，构建工具会遍历整个网络，调用（但不一定执行）每个任务。因此，在我们的示例中，假设的构建工具可能会调用 `Set up test data`、`Init`、`Compile\
  \ source`、`Compile tests` 以及然后 `Run tests`。在面向任务的工具中，每个任务都会知道自己是否已经作为构建的一部分执行过。因此，即使\
  \ `Init` 任务被调用了两次，它只会执行一次。\n\n然而，在面向产物的工具中，世界被建模为一组文件。因此，例如示例中的 `Compile source`\
  \ 和 `Compile tests` 目标将分别产生一个包含所有编译代码的文件——我们称其为 `source.so` 和 `tests.so`。`Run tests`\
  \ 目标随后生成一个名为 `testreports.zip` 的文件。面向产物的构建系统会确保在 `Compile source` 和 `Compile tests`\
  \ 之后调用 `Run tests`，但只有当其中一个 `.so` 文件的时间戳晚于 `testreports.zip` 的时间戳时，`Run tests` 目标才会被实际执行。\n\
  \n因此，面向产物的构建工具以每个任务生成的文件的时间戳形式保持其状态（`SCons` 使用 `MD5` 签名）。当你编译 `C` 或 `C++` 时（例如），这非常好，因为\
  \ `Make` 会确保你只编译自上次运行构建以来更改过的源文件。这种被称为**增量构建**的特性在大型项目中可以比清洁构建节省数小时的时间。在 `C/C++`\
  \ 中，编译需要相对长时间，因为编译器必须花费大量工作来优化代码。在运行在虚拟机上的语言中，编译器只需创建字节码，而虚拟机的即时（`JIT`）编译器在运行时进行优化。\n\
  \n相比之下，面向任务的构建工具在构建之间不保留状态。这使得它们不够强大，且完全不适用于编译 `C++`。然而，它们对于 `C#` 等语言运行良好，因为这些语言的编译器内置了执行增量构建的逻辑。^(2)\
  \ 最后，值得注意的是，`Rake` 既可以作为面向产物的工具，也可以作为面向任务的工具。有关关于依赖网络的更多信息，请参考 Martin Fowler 写的\
  \ *Domain-Specific Languages* [8ZKox1]。\n\n现在我们将简要调查一下当前的构建工具。同样，你可以在本书的网站 [dzMeNE]\
  \ 上找到使用这些许多技术的构建脚本示例，以及进一步的参考。\n\n### Make\n\n`Make` 及其变体在系统开发领域仍然非常强大。它是一种强大的面向产物的构建工具，能够跟踪构建内部的依赖关系，并仅构建受特定更改影响的组件。当编译时间在开发周期中是一项重大成本时，这对于优化开发团队的性能关重要。\n\
  \n遗憾的是，`Make` 有许多缺点。随着应用程序变得越来越复杂，组件之间的依赖关系增加，`Make` 构建的复杂性使得它们变得难以调试。\n\n为了压制这种复杂性，大型代码库团队采用的一种常见做法是为每个目录创建一个\
  \ `Makefile`，并让顶层 `Makefile` 递归地运行子目录中的 `Makefile`。这意味着构建信息和过程可能分散在许多文件中。当有人提交构建的更改时，很难弄清楚到底发生了什么，以及它将产生什么影响。\n\
  \n`Makefile` 还容易受到一类非常难以发现的漏洞的影响，这是因为在某些情况下空格是有意义的。例如，在命令脚本中，传递给 shell 的命令必须以制表符（tab）开头。如果使用空格，脚本将无法工作。\n\
  \n`Make` 的另一个缺点是它依赖 shell 来实际执行任何操作。结果是，文件特定于操作系统（尽管在 `Make` 周围的工具链中做了大量工作，以便构建能够在各种\
  \ UNIX 发行版中运行）。由于 `Makefile` 是一种外部 DSL，除了定义新规则之外不提供对核心系统的扩展，任何扩展必须在无法访问 `Make` 内部数据结构的情况下重新发明解决方案。\n\
  \n这些问题，加上 `Make` 应用根的声明式编程模型对大多数开发者来说并不熟悉（他们通常更倾向于命令式编程），意味着 `Make` 很少在新开发的商业应用程序中作为主要的构建工具使用。\n\
  \n“今天是我对软件不满意的日子之一。有时我很惊讶，在这些日子中有多少天涉及到 Make。”——Mark Dominus，“受‘make install’的困扰”\
  \ [dyGIMy].\n\n### Ant\n\n\n\n\n\n随着 Java 开发者的出现，他们开始进行更多的跨平台开发。`Make` 固有的局限性变得愈发痛苦。作为回应，Java\
  \ 社区尝试了多种解决方案，最初是将 `Make` 本身移植到 Java。与此同时，`XML` 也作为一种构建结构化文档的便捷方式脱颖而出。这两种方法汇聚在一起，产生了\
  \ Apache Ant 构建工具。\n\n`Ant` 是完全跨平台的，它包含了一组用 Java 编写的任务，用于执行编译和文件系统操作等常见操作。`Ant`\
  \ 可以通过用 Java 编写新任务来轻松扩展。`Ant` 迅速成为 Java 项目的事实标准构建工具。它现在被 IDE 和其他工具广泛支持。\n\n`Ant`\
  \ 是一个以任务为中心的构建工具。`Ant` 的运行时组件用 Java 编写，但 `Ant` 脚本是用 `XML` 编写的外部 DSL（领域特定语言）。这种组合赋予了\
  \ `Ant` 强大的跨平台能力。它还是一个极其灵活且强大的系统，对于你想要做的大多数事情，都有相应的 `Ant` 任务。\n\n然而，`Ant` 也存在几个缺点：\n\
  \n- 你需要用 `XML` 编写构建脚本，这既不简洁也不利于人类阅读。\n- `Ant` 有贫乏的领域模型。除了任务之外，没有真正的领域概念，这意味着你必须花费大量时间编写样板代码来编译、创建\
  \ `JARs`、运行测试等。\n- `Ant` 是一种声明式语言，而不是命令式语言。然而，它恰好有足够的命令式风格标签（例如令人厌恶的 `<antcall>`），允许用户混用不同的比喻（逻辑），从而在各处产生不不悦感和困惑。\n\
  - 你无法轻松对 `Ant` 任务提问，例如“运行了多少测试？”以及“它们花费了多久？”你所做的只能让工具将这些信息打印到命令行以便你解析，或者通过编写自定义\
  \ Java 代码对其进行插桩以钩入 `Ant` 内部。\n- 虽然 `Ant` 通过 `import` 和 `macrodef` 任务支持重用，但初级用户对这些任务并不了解。\n\
  \n由于这些局限性，`Ant` 文件往往很长且重构不佳——`Ant` 文件达到数千行的情况并不罕见。在处理 `Ant` 文件时，Julian Simpson 发表在\
  \ *The ThoughtWorks Anthology* 一中的文章《重构 Ant 构建文件》是一项无价之宝资源。\n\n### NAnt 和 MSBuild\n\
  \n当微软首次引入 `.NET` 框架时，它与 Java 语言和环境有许多共同点。在这个新平台上工作的 Java 开发者迅速移植了一些他们喜爱的开源 Java\
  \ 工具。因此，我们没有 `JUnit` 和 `JMock`，而是有了 `NUnit` 和 `NMock`——正如意料之中，还有 `NAnt`。`NAnt` 使用与\
  \ `Ant` 基本上相同的语法，只有极少数差异。\n\n微软后来引入了他们自己的 `NAnt` 微小变体，并命名为 `MSBuild`。它是 `Ant` 和\
  \ `NAnt` 的直接后代，任何用过这些工具的人都会感到熟悉。然而，它与 Visual Studio 的集成更紧密，理解如何构建 Visual Studio\
  \ 解决方案和项目以及管理依赖（因此，`NAnt` 脚本经常调用 `MSBuild` 来编译）。虽然有些用户抱怨 `MSBuild` 的灵活性不如 `NAnt`，但它更新得更频繁且作为\
  \ `.NET` 框架的一部分发布，这一事实使得 `NAnt` 变成了一个小众工具。\n\n两者都受到上述描述的 `Ant` 许多局限性的影响。\n\n###\
  \ Maven\n\n一段时间内，`Ant` 在 Java 社区无处不在——但创新并未止于此。`Maven` 试图通过一个更复杂的领域（对你的 Java 项目的布局做出许多假设）来消除\
  \ `Ant` 文件中大量的样板代码。这种“约定优于配置”的原则意味着，只要你的项目符合 `Maven` 规定的结构，它就能通过一个命令执行你想象的几乎任何构建、部署、测试和发布任务，而无需编写超过几行的\
  \ `XML`。这包括默认为你的项目创建一个网站，用于托管你应用程序的 `Javadoc`。\n\n`Maven` 的另一个重要特性是支持 Java 库和项目间依赖的自动化管理，这是大型\
  \ Java 项目的痛点之一。`Maven` 还支持复杂但固定的软件划分方案，允许你将复杂的解决方案分解为更小的组件。\n\n`Maven` 的问题有三点。首先，如果你的项目不符合\
  \ `Maven` 对结构和生命期的假设，那么想让 `Maven` 按照你的意愿运行极其（甚至不可能）。在某些公司中，这被视为一种特性——它迫使开发团队按照 `Maven`\
  \ 的规定来构建项目。这对于缺乏经验的开发团队或拥有大量项目时来说可能是一件好事。但如果你想做一些稍微偏离常规的事情（例如在执行测试之前加载某些自定义测试数据），你就必须违背\
  \ `Maven` 的生命周期和领域模型——这是一个极其痛苦且不可维护的方案，但往往是不可避免的。`Ant` 比 `Maven` 灵活得多。\n\n`Maven`\
  \ 的第二个问题是它也使用用 `XML` 编写的外部 DSL，这意味着为了扩展它，你需要编写代码。虽然编写 `Maven` 插件并不极端复杂，但它不是那种你几分钟内就能搞定的东西；当你读到这里时，你需要学习\
  \ `Mojos`、插件描述符以及 `Maven` 正在使用的任何控制反转框架。幸运的是，`Maven` 对于你可能想做的几乎每种物都有插件。\n\n`Maven`\
  \ 的第三个问题是，在默认配置下，它是自更新的。`Maven` 的核心非常小，为了实现功能，它会从互联网下载自己的插件。`Maven` 每次运行时都会尝试升级自己，结果由于其某个插件的升级或降级，可能会导致不可预测的失败。更严重的是，这意味着你无法重现构建。一个相关问题是\
  \ `Maven` 的库和依赖管理功能允许跨项目使用组件的快照，这再次使得重现特定的构建变得困难。\n\n对于某些团队来说，`Maven` 的限制可能过于严重，或者重构构建以匹配\
  \ `Maven` 的假设需要花费太多精力。因此，他们坚持使用 `Ant`。最近，创建了一个名为 `Ivy` 的工具，它允许你管理组件间的库和依赖，而无需使用\
  \ `Maven`。这使得由于某些原因受限于使用 `Ant` 的人获得 `Maven` 的一些好处。\n\n请注意，虽然 `Ivy` 和 `Maven` 在管理组件间依赖方面非常出色，但它们管理外部依赖的默认机制（从\
  \ `Maven` 社区维护的互联网存档下载）并不总是最佳选择。首先，有那个传说中的问题：首次启动构建会导致等待 `Maven` 下载半个互联网。更具问题的是，除非你对每个依赖使用的版本非常自律，否则很容易因为\
  \ `Maven` 在你未察觉的情况下更改了某些库的版本而导致菱依赖问题和损坏。\n\n\n\n\n\nAnt 及其兄弟是用于构建软件的外部领域特定语言（DSLs）。然而，它们选择\
  \ XML 来表示这些语言，导致它们难以创建、读取、维护和扩展。Ruby 主流的构建工具 `Rake` 的出现是一次实验，旨在观察是否可以通过在 `Ruby`\
  \ 中创建一个内部 DSL 来复现 `Make` 的功能。答案是“肯定的”，于是 `Rake` 诞生了。`Rake` 是一个面向产品的的工具，类似于 `Make`，但它也可以作为面向任务的工具使用。\n\
  \n和 `Make` 一样，`Rake` 除了任务和依赖关系外对任何内容一无所知。然而，由于 `Rake` 脚本是纯 `Ruby`，你可以使用 `Ruby` 的\
  \ API 来执行任何你想要的任务。因此，在 `Rake` 中创建强大且跨平台的构建文件是轻而易举的：你可以调用通用编程语言的所有原生能力。\n\n当然，使用通用语言意味着你在正常开发中可以使用的所有工具，在维护构建脚本时也同样可用。你可以对构建过程进行重构和模块化，并可以使用你常用的开发环境。使用标准的\
  \ `Ruby` 调试器调试 `Rake` 是非常简单的。如果你在执行 `Rake` 构建脚本时遇到 bug，你将获得堆栈跟踪，帮助你理解哪里出了问题。事实上，由于\
  \ `Ruby` 中的类是开放扩展的，你可以在构建脚本内部为 `Rake` 的类添加方法以供调试。这种以及许多其他 `Rake` 有用技术在 Martin Fowler\
  \ 的 bliki 条目“使用 Rake 构建语言”[9lfL15] 中有所描述。\n\n仅仅因为 `Rake` 是由 `Ruby` 程序员开发的并被广泛用于\
  \ `Ruby` 项目，并不意味着它不能用于使用其他技术的项目（例如，`Albacore` 项目提供了一组构建 .NET 系统的 `Rake` 任务）。`Rake`\
  \ 是一个通用的构建脚本工具。当然，你的开发团队需要具备（或获得）一些基本的 `Ruby` 编程技能，但 `Ant` 或 `NAnt` 也是如此。\n\n`Rake`\
  \ 有两个通用的缺点：首先，你必须确保你的平台上有一个良好的运行时环境（`JRuby` 正在作为最可移植、最可靠的平台而迅速发展起来）；其次，你必须与 `RubyGems`\
  \ 交互。\n\n## Buildr\n\n`Rake` 的简单和强大提供了一个令人信服的理由：构建脚本应该用真正的编程语言编写。新一代构建工具如 `Buildr`、`Gradle`\
  \ 和 `Gantt` 都采取了这种方法。它们都具有用于构建软件的内部 DSL。然而，它们试图让依赖管理和多项目构建等更复杂的挑战变得同样简单。我们将详细讨论\
  \ `Buildr`，因为我们最熟悉它。\n\n`Buildr` 构建在 `Rake` 之上，因此你在 `Rake` 中可以做的一切在 `Buildr` 中也可以继续。然而，`Buildr`\
  \ 也是 `Maven` 的无缝替换——它使用了与 `Maven` 相同的约定，包括文件系统布局、制品规范和仓库。它还允许你零配置使用 `Ant` 任务（包括任何自定义任务）。它利用\
  \ `Rake` 面向产品的框架来执行增量构建。令人惊讶，它甚至比 `Maven` 更快。然而，与 `Maven` 不同，自定义任务和创建新任务极其简单。\n\n\
  如果你正在启动一个新的 Java 项目，或者正在寻找 `Ant` 或 `Maven` 的替代品，我们强烈建议你考虑 `Buildr`，或者如果你倾向于使用 `Groovy`\
  \ 作为 DSL，则考虑 `Gradle`。\n\n## Psake\n\nWindows 用户不必错过新一波内部 DSL 构建工具。`Psake` 发音为“saké”，是一个用\
  \ `PowerShell` 写的内部 DSL，提供了面向任务的依赖网络。\n\n## 构建与部署脚本的原则与实践\n\n在本节，我们将概述构建和部署脚本的一些通用原则和实践，这些原则无论你使用什么技术都适用。\n\
  \n### 为部署流水线中的每个阶段创建脚本\n\n我们是领域驱动设计^(3) 的忠实粉丝，并在创建的任何软件设计中应用这些技术。在设计构建脚本时也是如此。这可能是一个有点夸大的说法，意味着我们希望构建脚本的结构能够清晰地表示它们所实现的过程。采用这种方法可以确保我们的脚本具有良好的结构，有助于我们在维护期间保持其整洁，并最大限度地减少构建和部署系统组件之间的依赖关系。幸运的是，部署流水线为构建脚本之间的职责划分提供了一个极佳的组织原则。\n\
  \n当你刚开始项目时，拥有一个包含执行部署流水线过程中执行的所有操作的单一脚本是有意义的，对于尚未自动化的步骤设置占位目标（dummy targets）。然而，一旦你的脚本变得足够长，就可以将其划分为流水线中每个阶段的独立脚本。这样，你将拥有一个提交脚本，包含编译应用程序、打包、运行提交测试套件以及对代码进行静态分析所需的目标.^(4)。然后，你需要一个功能性验收测试脚本，调用你的部署工具将应用程序部署到相应的环境，然后准备任何数据，最后运行验收测试。你还可以有一个运行任何非功能性测试（如压力测试或安全测试）的脚本。\n\
  \n![Image](img/light.jpg)\n\n确保将所有脚本都放在版本控制仓库中，最好是与源代码相同的仓库。开发者和运维人员对构建和部署脚本进行协作是至关重要的。\n\
  \n### 使用适当的技术部署应用程序\n\n在典型的部署流水线中，成功提交之后的大多数阶段（例如自动化测试阶段和用户验收测试阶段）都依赖于应用程序部署到类生产环境。这种部署自动化也是至关重要的。然而，在自动化部署时，你应该使用正确的工具，而不是通用脚本语言（除非部署过程极其简单）。几乎每个常见的中间件都有用于配置和部署插件的工具，因此你应该使用这些工具。例如，如果你使用\
  \ WebSphere Application Server，你会希望使用 `wsadmin` 工具来配置容器并部署应用程序。\n\n最重要的是，应用程序的部署将由开发者（在他们的本地机器上，如果没有其他地方）以及测试人员和运维人员完成。因此，关于如何部署应用程序的决定涉及到所有人。它也应该在项目开始阶段进行。\n\
  \n### 运维与开发必须在部署过程上协作\n\n在大型电信公司的一个项目中，开发者创建了一个基于 `Ant` 的系统来在本地部署应用程序。然而，当需要将应用程序部署到类生产的\
  \ UAT 环境时，开发者的部署脚本不仅惨遭失败，而且管理环境的运维团队拒绝使用它，因为他们没有 `Ant` 的专业知识。\n\n部分由于这个原因，建立了一个构建团队来为每个环境创建一个统一的部署流程。该团队必须与运维人员和开发者紧密合作，创建一个双方都能接受的系统，并开发了一组\
  \ `Bash` 脚本（统称为 `Conan the Deployer`），执行诸如远程登录应用服务器节点以及重新配置 Apache 和 WebLogic 等操作。\n\
  \n\n\n\n\n运营团队之所以乐于使用 Conan 部署到生产环境主要有两个原因。首先，他们参与了该工具的创建。其次，他们看到了在整个流水线用于部署到每个测试环境的脚本，并因此产生了信任。\n\
  \n部署脚本应该涵盖升级应用程序以及从头开始安装的情况。这意味着，例如，在部署之前，它应该停止之前运行的应用程序版本，并且它应该能够从头开始创建任何数据库，也能升级现有的数据库。\n\
  \n### 使用相同的脚本部署到每个环境\n\n正如第 113 页中“部署流水线实践”章节所描述的，使用相同的流程部署到应用程序运行的每一个环境是至关重要的，这可以确保构建和部署过程得到有效的内部测试。这意味着使用相同的脚本部署到每个环境，并将环境之间的差异（例如服务\
  \ URI 和 IP 地址）表示为要单独管理的配置信息。将配置信息从脚本中分离出来并存储在版本控制中，并如第 2 章“配置管理”中描述，提供某种机制让你的部署脚本能够获取这些信息。\n\
  \n构建和部署脚本在开发人员机器以及类生产环境中运行是至关重要的，并且它们应该由开发人员用来执行所有的构建和部署活动。很容易出现一个仅供开发人员使用的并行构建系统——但这消除了保持构建和部署脚本灵活、结构良好且经过充分测试的关键力量之一。如果你的应用程序依赖于内部开发的其它组件，你将希望确保很容易将正确的版本（即已知可以可靠协同工作的版本）获取到开发人员机器。这是\
  \ `Maven` 和 `Ivy` 等工具非常实用的领域之一。\n\n如果你的应用程序在部署架构方面非常复杂，你将不得不进行一些简化以便其在开发人员机器上运行。这可能涉及大量工作，例如在部署时能够将\
  \ Oracle 集群替换为内存数据库。然而，这种努力无疑会有回报。当开发人员必须依赖共享资源来运行应用程序时，运行频率必然会降低，反馈循环也会慢得多。这反过来会导致更多的缺陷和更慢的速度。问题不是“我们如何证明成本是合理的”，而是“我们如何证明不投入让应用程序在本地运行是合理的”。\n\
  \n### 使用操作系统的打包工具\n\n我们在书中中使用“二进制文件”（binaries）一词作为应用程序部署过程中的一部分放置到目标环境中的对象的统称。大多数时候，这是由构建过程创建的一组文件、应用程序所需的任何库，以及可能的另一组提交到版本控制中的静态文件。\n\
  \n然而，部署需要在文件系统中分发的一组文件是非常低效的，并且会让维护（以升级、回滚和卸载的形式）变得极其痛苦。这就是发明打包系统的原因。如果你针对的是单一操作系统，或一小组相关的操作系统，我们强烈建议使用该操作系统的打包技术来封装所有需要的内容。例如，`Debian`\
  \ 和 `Ubuntu` 都使用 `Debian` 软件包系统；`RedHat`、`SuSE` 以及许多其他 `Linux` 变体使用 `RedHat` 包系统；用户可以使用\
  \ `Microsoft Installer` 系统，等等。所有这些打包系统都相对易用，并具有良好的工具支持。\n\n每当你的部署涉及将文件散布到文件系统中或向注册表添加键时，请使用打包系统来完成。这有许多优势。不仅维护你的应用程序变得非常简单，你还可以将部署过程挂载到\
  \ `Puppet`、`CfEngine` 和 `Marimba` 等环境管理工具上；只需将你的包上传到组织仓库，并让这些工具安装包的正确版本——就像你让它们安装正确版本的\
  \ `Apache` 一样。如果你需要在不同的机器上安装不同的内容（可能你正在使用分层架构），你可以为每个层或每种类型的机器创建一个包。打包你的二进制文件应该是你部署流水线中的自动化部分。\n\
  \n当然，并不是所有部署都能以这种方式管理。例如，商业中间件服务器通常需要特殊工具来执行部署。在这种情况下，有必要采用混合方法。使用包来准备任何不需要特殊工具的内容，然后使用专门工具执行剩余的部署工作。\n\
  \n![Image](img/light.jpg)\n\n你也可以使用特定平台的打包系统，例如 `Ruby Gems`、`Python Eggs`、Perl’s\
  \ `CPAN` 等来分发你的应用程序。然而，在创建用于部署的包时，我们倾向于使用操作系统的打包系统。如果你是在为该平台分发库，特定平台的工具运行良好，但它们是为开发者设计并使用的，而不是为系统管理员。大多数系统管理员不喜欢这些工具，因为它们增加了另一层需要处理的管理层，而这一层并不总是与操作系统的包管理系统良好兼容。如果你在多个操作系统上部署纯\
  \ `Rails` 应用程序，请尽管使用 `RubyGems` 来打包它。在可能的情况下，请坚持使用你操作系统的标准包管理工具链。([5)\n\n### 确保部署过程是幂等的\n\
  \n你的部署过程应该始终让目标环境处于相同的（正确的）状态，无论它在开始部署时处于什么状态。\n\n实现这一点的最简单方法是从已知的基线环境开始，通过自动或虚拟化进行配置。该环境应该包含所有适当的中间件以及应用程序所需的任何其他内容。然后你的部署过程就可以获取指定的应用程序版本并使用适当的中间件工具将其部署到环境中。\n\
  \n如果你的配置管理程序不足以做到这一点，其次的方案是验证你的部署过程对环境的假设，如果未满足假设则失败部署。例如，你可以验证适当的中间件是否已安装、运行以及版本是否正确。在任何情况下，你都应该验证应用程序依赖的所有服务是否正在运行以及版本是否正确。\n\
  \n\n\n\n\n许多组织坚持认为你应该只部署发生变化的产制品，以最大限度地减少变更。但确定哪些发生了变化可能比直接从头开始部署更复杂且更容易出错。这种过程的测试也要困难得多；当然，要测试此类过程的所有可能的排列组合是不可能的，因此你没有考虑到的病态情况会在发布期间发生，导致你的系统处于未定义状态。\n\
  \n这条规则有几个例外。首先，在集群系统中，同时重新部署整个集群并不总是有意义的；更多细节，请参阅第 263 页 的“**金丝雀发布**”章节。\n\n其次，如果你的应用程序是组件化的，且组件来自多个源代码仓库，你将需要从你的版本控制仓库部署从修订版本元组\
  \ `(x, y, z,...)` 创建的二进制文件。在这种情况下，如果你知道只有一个组件发生了变化，并且`如果你已经测试过即将在生产环境中部署的组件版本组合`，那么你只需要部署发生变化的组件即可。这里的关键区别在于，从以前状态到新状态的升级过程已经过测试。同样的原理也适用于构成面向服务架构的单个服务。\n\
  \n最后，另一种方法是使用本身具有等幂性的部署工具。在底层，例如，`Rsync` 将确保一个系统上的目标目录与另一个系统上的源目录相同，无论目标目录中的文件状态如何，它使用强大的算法仅通过网络传输目标目录和源目录之间的差异。执行目录更新的版本控制实现了类似的结果。`Puppet`在第\
  \ 11 章“管理基础设施和环境”中详细描述，它分析目标环境的配置，并只进行必要的更改使其与期望状态的声明式规范保持同步。`BMC`、`HP` 和 `IBM`\
  \ 大量的商业应用程序来管理部署和发布。\n\n## 逐步演进你的部署系统\n\n每个人都能看到全自动部署过程的魅力：“按下按钮即可发布软件。”当你看到一个以此方式部署的大型企业系统时，它看起来像魔法一样。魔法的问题在于，它从外面看可能极其复杂。事实上，如果你检查我们的一个部署系统，它仅仅是一系列非常简单、增量的步骤的集合，这些步骤随着时间的推移创建了一个复杂的系统。\n\
  \n我们的观点是，你不需要完成所有步骤就能从你的工作中获得价值。当你第一次编写脚本在本地开发环境中部署应用程序并与团队共享它时，你已经节省了许多开发人员大量的工作。\n\
  \n从让运营团队与开发者合作将应用程序自动部署到测试环境开始。确保运营人员对用于部署的工具表示熟悉。确保开发者可以使用相同的流程在他们的开发环境中部署和运行应用程序。然后，完善这些脚本，以便它们可以在验收测试环境中部署和运行应用程序，从而运行测试。然后，向部署流水线的更下游移动，确保运营团队可以使用相同的工具将应用程序部署到发布环境（staging）和生产环境。\n\
  \n## 针对 JVM 应用程序的项目结构\n\n尽管本书旨在尽可能避免针对特定技术，但我们认为值得花一个章节来描述如何布局针对 JVM 的项目。这是因为，虽然有一些用的约定，但它们在\
  \ `Maven` 世界之外并不被强制执行。^(6)。然而，如果开发者遵循标准布局，将会让生活变得容易得多。应该可以在花费少量额外精力的情况下将这里展示的信息抽象到其他技术中。特别是\
  \ `.NET` 项目可以很有成效使用完全相同的布局，当然是将反斜杠替换为正斜杠。^(7)\n\n### 项目布局\n\n我们将介绍 `Maven` 假设的项目布局，被称为“**Maven\
  \ 标准目录布局**”。即使你不使用（甚至不喜欢）`Maven`，它最重要的贡献之一就是引入了项目布局的标准约定。\n\n一个典型的源码看起来如下：\n\n![Image](img/p0158-01.jpg)\n\
  \n如果你使用 `Maven` 子项目，它们每个都位于项目根目录下的目录中，其子目录也遵循 `Maven 标准目录布局`。注意，`lib` 目录不是 `Maven`\
  \ 的部分——`Maven` 会自动下载依赖并将它们存储在它管理的本地仓库中。然而，如果你没有使用 `Maven`，将你的库作为源代码的一部分提交到版本控制是有意义的。\n\
  \n#### 管理源代码\n\n始终遵循标准的 Java 规范，将你的文件放在与它们包含的包命名的目录中，每个文件一个类。Java 编译器和所有现代开发环境都会强制执行这一约定，但我们仍然发现人们违反它的地方。如果你不遵循这些以及语言的其他约定，可能会导致难以发现的错误，但更重要的是，它会让维护你的项目变得更加困难，而且编译器会发出警告。出于同样的原因，务必遵循\
  \ Java 命名规范，包名使用 `PascalCase`，类使用 `camelCase`。使用开源工具如 `CheckStyle` 或 `FindBugs`\
  \ 在提交阶段的代码分析步骤中强制遵守这些命名规范。有关命名规范的更多信息，请参阅 Sun 的文档“Java 编程语言代码规范” [asKdH6]。\n\n任何生成的配置或元数据（例如由注释或\
  \ Doclet 生成）不应放在 `src` 目录中。相反，将它们放在 `target` 目录，以便在运行清理时可以删除它们，并防止它们被错误提交。\n\n####\
  \ 管理测试\n\n所有测试源代码进入 `test/[language]`。单元测试应该存储在代码包结构的镜像中——也就是说，类的测试应该与该类相同的包。\n\n\
  其他类型的测试，例如验收测试、组件测试等，可以保留在不同的包集中，例如 `com.mycompany.myproject.acceptance.ui`、`com.mycompany.myproject.acceptance.api`、`com.mycompany.myproject.integration`。然而，通常将它们放在同一个目录下。在你的构建脚本中，你可以根据包名进行过滤以确保它们分开处理。有些人更倾向于在测试目录下为不同类型的测试创建单独的目录——这是一个偏好问题，因为\
  \ IDE 和构建工具完全能够胜任两种布局。\n\n### 管理构建输出\n\n当 `Maven` 构建你的项目时，它将所有内容放在项目根目录下名为 `target`\
  \ 的目录中。这包括生成的代码、元数据文件（如 Hibernate 映射文件）等。将这些放在单独目录使得清理之前的构建制品变得容易，因为你只需删除该目录。你不应该将此目录中的任何内容提交到版本控制；如果你决定提交任何二进制产制品，请将其复制到仓库中的另一个目录。`target`\
  \ 目录应该被你的版本控制系统忽略。`Maven` 在此目录创建文件如下：\n\n![Image](img/p0159-01.jpg)\n\n\n\n\n\n\
  如果你没有使用 Maven，可以直接使用 `target` 下的名为 `reports` 的目录来存储测试报告。\n\n构建过程最终应该生成以 `JARs`、`WARs`\
  \ 和 `EARs` 形式存在的二进制文件。这些文件会进入 `target` 目录，并由你的构建系统存储在你的制品库中。首先，每个项目应该创建一个 `JAR`。然而，随着项目的增长，你可以为不同的组件创建不同的\
  \ `JARs`（有关组件的更多信息，请参阅第 13 章“管理组件和依赖”）。例如，你可以为系统中的重要功能块创建 `JARs`，它们代表了整个组件或服务。\n\
  \n无论你采取什么策略，请记住创建多个 `JARs` 有两点：首先，让应用程序的部署变得简单；其次，你可以让构建过程更高效，并尽可能地减少依赖图的复杂性。这些考虑应该指导你如何打包应用程序。\n\
  \n与其将所有代码都存储在一个项目中并创建多个 `JARs`，另一种方法是为每个组件或子项目创建独立的项目。一旦你的项目达到一定的规模，从长远来看，这样可能更容易维护，尽管这在某些\
  \ IDE 中可能会影响代码库的可导航性。这种选择实际上取决于你的开发环境以及不同组件之间代码的耦合程度。在构建过程中创建一个单独的步骤，从构成你应用程序的各种\
  \ `JARs` 组装你的应用程序，可以帮助保留对打包决定做出更改的灵活性。\n\n## 管理库\n\n你有几种方案来管理库。其中一种是将库管理完全委托给如 `Maven`\
  \ 或 `Ivy` 之类的工具。在这种情况下，你不需要将任何库提交到版本控制——只需在项目规范中声明你需要的依赖即可。在光谱的另一端，你可以将构建、测试或运行系统所需的所有库提交到源码控制，在这种情况下，通常会将它们放在项目根目录下名为\
  \ `lib` 的目录中。我们喜欢根据这些库是在构建时、测试时还是运行时需要的，将它们分离到不同的目录中。\n\n对于在多大程度上存储构建时依赖（例如 `Ant`\
  \ 本身），存在一些争议。我们认为这很大程度上取决于项目的规模和持续时间。一方面，编译器或 `Ant` 版本等工具可能用于构建许多不同的项目，因此将它们存储在每个项目中是浪费的。然而，这里存在权衡：随着项目的增长，维护依赖将变成一个越来越严重的问题。解决此问题的简单方法是将大多数依赖存储在版本控制系统中一个独立的单独项目中。\n\
  \n一种更高级的方法是在你的组织内部创建一个仓库，用以存储所有项目所需的所有库。`Ivy` 和 `Maven` 都支持自定义仓库。在合规性要求重要的组织中，这可以作为一种提供经过适当许可的库的方法。这些方法在第\
  \ 13 章“管理组件和依赖”中进行了更详细的讨论。\n\n你需要确保应用程序所依赖的任何库都与你的应用程序二进制文件一起打包，作为部署流水线的一部分，正如第\
  \ 154 页“使用你操作系统的打包工具”节所述。`Ivy` 和 `Maven` 不应该出现在生产服务器上。\n\n## 部署脚本\n\n环境管理的核心原则之一是，测试和生产环境的更改应通过自动化过程进行。这意味着你不应该远程登录此类系统来执行部署；它们应该是完全脚本化的。执行脚本化部署有三种方法。首先，如果你的系统运行在单台机器上，你可以编写一个脚本，在该机器上本地完成所有需要的操作。\n\
  \n然而，大多数情况下部署需要某种程度的编排——也就是说，在不同的计算机上运行脚本以执行部署。在这种情况下，你需要一组部署脚本——为部署过程的每个独立部分准备一个——并在所有必要的服务器上运行它们。这并不意味着每台服务器对应一个脚本——例如，可能有一个脚本用于升级数据库，一个脚本用于向你的每台应用程序服务器部署新的二进制文件，以及第三第三脚本脚本用于升级你的应用程序所依赖的服务。\n\
  \n部署到远程机器你有三种选择。第一种是编写一个脚本登录到每台机器并运行适当的命令。第二种是编写一个在本地运行的脚本，并让在每台远程机器上运行该脚本的代理。第三种选择是使用你平台的适当打包技术打包你的应用程序，并让基础设施管理或部署工具推送新版本，运行任何必要的工具来初始化你的中间件。第三种选择是最强大的，原因如下：\n\
  \n- 像 `ControlTier` 和 `BMC BladeLogic` 这样的部署工具，以及像 `Marionette Collective`、`CfEngine`\
  \ 和 `Puppet` 这样的基础设施管理工具是声明式且幂等的，确保即使在调度部署时某些机器处于离机状态，或者你向环境中添加了新机器或虚拟机，也能在所有必要的机器上安装正确版本的包。有关这些工具的更多信息，请参见第\
  \ 11 章“管理基础设施和环境”。\n\n- 你可以使用同一套工具同时管理应用程序部署和管理你的基础设施。由于是同一组人（运营团队）负责这两件事，而且这两者密不可分，因此使用单一工具顾两个目的是有意义的。\n\
  \n如果这种方案不可行，具有代理模式的持续集成服务器（也就是说，几乎所有的服务器）可以让你轻松地采用第二种方案。这种方法有几个优点：\n\n- 你的工作量减少：只需像在本地执行一样编写脚本，将其提交到版本控制，并让你的\
  \ CI 服务器在指定的远程机器上运行它们。\n\n- CI 服务器提供了管理作业的所有设施，例如在失败时重新运行作业、显示控制台输出，并提供一个仪表板，让你查看部署状态以及每个环境中部署了哪些版本的应用程序。\n\
  \n- 根据你的安全需求，让机器上的 CI 代理调用 CI 服务器以获取所需的所有内容可能是合理的，而不是允许脚本远程访问测试和生产环境。\n\n最后，如果由于某种原因你无法使用上述任何工具，你可以自己编写部署脚本。如果你的远程机器是\
  \ UNIX，你可以使用传统的 `Scp` 或 `Rsync` 拷贝二进制文件和数据，并使用 `Ssh` 执行执行部署的相关命令。如果你正在使用 Windows，你也有选择：`PsExec`\
  \ 和 `PowerShell`。还有诸如 `Fabric`、`Func` 和 `Capistrano` 等更高级的工具，可以帮你处理底层问题，使得自己编写部署脚本变得非常简单。\n\
  \n然而，无论是使用 CI 系统还是自己编写部署脚本，无法处理错误情况（例如部分完成的部署），无法处理网格中添加新节点并需要配置和部署的情况。因此，使用适当的部署工具是更优的。\n\
  \n\n\n\n\n该领域的工具正在不断演进。本书的网站 [dzMeNE] 提供了使用其中一些工具的示例，以及新工具发布时的更新信息。\n\n## 部署与测试层级\n\
  \n如果说我们通用的交付方法、特别是构建和部署复杂系统的方法中有一个核心原则，那就是：你应该始终努力在已知的良好的基础上进行构建。我们不会费精力去测试无法编译的更改，不会费精力去对通过提交测试失败的更改进行验收测试，以此此类推。\n\
  \n图 6.2 分层部署软件\n\n![Image](img/fig6_2.jpg)\n\n当我们需要将发布候选版本部署到类生产环境时，这一点愈为真实。在我们着手将二进制交付物拷贝到文件系统中的正确位置之前，我们希望知道环境已经为我们准备就绪。为了实现这一点，我们倾向于将部署想象为沉积一系列层，如图\
  \ 6.2\n\n你编写的基础设施烟雾测试对于任何给定系统都是独特的。但测试意图是一致的：证明环境配置符合我们的预期。关于基础设施监控的更多内容，请参见第 317\
  \ 页的“监控基础设施和应用程序”章节。为了让你了解我们的思路，这里是我们过去发现非常有用的测试示例：\n\n- 确认我们可以从数据库中检索到记录。\n- 确认我们可以访问该网站。\n\
  - 断言我们的消息代理器中注册了正确的消息集。\n- 通过我们的防火墙发送几次“ping”，以证明它允许我们的流量并在我们的服务器之间提供轮询负载均衡。\n\n\
  ## N 体系架构的烟雾测试\n\n我们曾向一组服务器部署一个 .NET 项目。像在许多其他 .NET 环境一样，那里有多个物理隔离的层。在该系统中，Web 服务被部署在两台服务器上：一台数据库服务器和一个应用服务器。每个\
  \ Web 服务都有自己的端口，并在其它层级的配置文件中指定了 URI。诊断通信问题非常痛苦，需要费力搜索通信通道两端机器上的服务器日志，以找出问题出在哪里。\n\
  \n我们写了一个简单的 Ruby 脚本来解析 `config.xml` 文件并尝试逐一连接到每个 URI。它会在控制台上打印出结果，如下所示：\n\n```\n\
  ![Image](img/p0164-01.jpg)\n```\n\n这使得诊断连接问题变得非常简单。\n\n## 技巧与窍门\n\n在本节中，我们将列出一些用来解决常见构建和部署问题的解决方案和策略。\n\
  \n### 始终使用相对路径\n\n构建中最常见的错误是默认使用绝对路径。这会在特定机器的配置与你的构建过程之间建立紧密的依赖，使得配置和维护其他服务器变得困难。例如，这导致在同一机器上无法对同一个项目进行两次检出——这种做法在许多不同情况下（从对比调试到并行测试）可能非常有帮助。\n\
  \n你的默认设置应该是所有内容都使用相对路径。这样，构建的每个实例都是完全自包含的，而且你提交到版本控制系统的镜像将自动确保所有内容都处于正确的位置并按预期工作。\n\
  \n偶尔，绝对路径的使用是难以避免的。尝试发挥创造力并尽可能地避免它。如果你被迫使用绝对路径，请确保它们是构建中的特例，而不是常规方法。确保它们被保存在属性文件或其他某些独立于你构建系统的配置机制中。使用绝对路径的必要性可能有几个合理的理由。首先，如果你必须与依赖于硬编码路径的第三方库集成。请尽可能地隔离你系统的这些部分，不要让它们污染你构建的其他部分。\n\
  \n即使在部署应用程序时，也可能避免绝对路径。每个操作系统和应用程序栈都有一套安装软件的惯例，例如 UNIX 的文件系统层次结构标准（FHS）。使用你系统的打包工具来强制执行这些标准。如果你必须安装在某些非标准位置，请通过配置系统中的选项来实现。尝试通过减少这些情况，使你系统中的所有路径都相对于一个或多个定义的根路径——部署根路径、配置根路径等——并仅对这些根路径进行覆盖。\n\
  \n有关在部署时配置你的应用程序的更多信息，请参阅第 2 章“配置管理”。\n\n### 消除手动步骤\n\n令人惊讶的是，竟然有这么多人通过手动或 GUI 驱动的工具来部署他们的软件。对于许多组织来说，“构建脚本”是一份打印出来的文档，上面列有一系列指令，如下所示：\n\
  \n```\n![Image](img/p0165-01.jpg)\n```\n\n这种类型的部署是枯燥且容易出错的。文档总是错误的或过时的，因此需要在预生产环境中进行大量的演练。每次部署都是唯一的——对系统的\
  \ bug 修复或小改可能只需要重新部署系统的一个或两个部分。因此，部署程序必须针对每次发布进行修订。之前部署的知识和产物是无法重用的。对于执行操作的人来说，每次部署实际上都是对记忆和系统理解的练习，而且从根本上来说是容易出错的。\n\
  \n那么，什么时候应该考虑自动化某个过程？简单的答案是：“当你必须做第二次时”。当你第三次做某事时，应该使用自动化过程来完成。这种细粒度的增量方法可以快速创建一个系统，用于自动化开发、构建、测试和部署过程中的重复部分。\n\
  \n### 构建从二进制到版本控制的可追溯性\n\n能够从任何给定的二进制文件确定生成它的版本控制修订版本是至关重要的。如果你的生产环境出现问题，能够确定该机器上运行的每个组件的确切版本以及它们的来源，将会成为救星（Bob\
  \ Aiello 在他的《配置管理最佳实践》书中讲述过一个关于此的精彩故事）。\n\n\n\n\n有多种方法可以实现这一点。在 `.NET` 中，你可以在程序集中包含版本控制元数据——确保你的构建脚本始终这样做，并包含版本控制的修订标识符。`JAR`\
  \ 文件也可以在它们的清单中包含元数据，因此你可以在此处进行类似的操作。如果你使用的技术不支持将元数据构建到包中，你可以反其道而行之：对构建过程生成的每个二进制文件获取\
  \ `MD5` 哈希值，连同其名称及其来源的修订标识符，并将它们存储在数据库中。这样，你就可以获取任何二进制文件的 `MD5`，并准确确定它是什么以及来自哪里。\n\
  \n## 不要将二进制文件作为构建的一部分提交到版本控制\n\n有时，将二进制文件或报告作为构建过程的一部分提交到版本控制中似乎是个好主意。然而，通常情况下，你应该抵制这种做法。这在几个方面都是一个坏主意。\n\
  \n首先，修订控制标识符最重要的功能之一是能够追踪特定一组提交中发生了什么。通常，你会将修订控制 ID 与构建标签（build label）关联，并用它来跟踪一组更改通过不同环境进入生产环境的过程。如果你提交了构建的二进制文件和报告，这意味着与版本控制修订标识符对应的二进制文件将拥有它们自己不同的修订标识符——这会是混乱的根源。\n\
  \n相反，将二进制文件和报告放在共享文件系统中。如果你丢失了它们或需要重新创建它们，最佳实践是获取源代码并重新创建。如果你无法从源代码中可靠地重建二进制文件，这意味着意味着你的配置管理尚未达到标准，需要改进。\n\
  \n通用的原则是，不要将作为构建、测试和部署循环的一部分*创建*的任何内容提交到源码控制。相反，将这些产物视为元数据，与触发构建的修订标识符关联。大多数现代 CI\
  \ 和发布管理服务器都拥有产物仓库和元数据管理系统，可以帮助你完成，或者你可以使用 `Maven`、`Ivy` 或 `Nexus` 等工具。\n\n# 测试目标不应导致构建失败\n\
  \n在某些构建系统中，默认行为是任务失败时构建立即失败。例如，如果你有一个“测试（test）”目标，而该目标指定的测试失败了，那么整个构建将在目标运行后立即失败。这几乎是一件坏事（Bad\
  \ Thing）——相反，应该记录活动失败的事实，并继续构建过程的其余部分。然后，在过程结束时，检查是否有任何单独的任务失败，如果是，则带失败代码退出。\n\n\
  这个问题的出现是因为在许多项目中，拥有多个测试目标是有意义的。例如，在提交测试套件中，可能有一组单元测试、几个集成测试以及少量验收烟雾测试（acceptance\
  \ smoke tests）。如果单元测试首先运行并导致构建失败，那么在下一次提交之前，我们无法知道集成测试是否会通过。这又浪费了时间。\n\n更好的做法是让失败设置一个标记，但稍后再让构建失败，即在生成更有用的报告或运行更完整的测试集之后失败。例如，在\
  \ `NAnt` 和 `Ant` 中，可以使用测试任务上的 `failure-property` 属性来实现。\n\n## 使用集成烟雾测试来约束你的应用程序\n\
  \n交互设计师经常约束界面以防止产生意外的用户输入。同样，你也可以约束你的应用程序，使其在发现自己处于不熟悉的情况下时不运行工作。例如，你可以让部署脚本在部署任何内容之前检查它们是否运行在正确的机器上。这对于测试和生产配置尤为重要。\n\
  \n几乎所有系统都有一个定期运行的“批处理”部分。在会计系统中，有些组件每月运行一次、每季度运行一次或每年运行一次。在这种情况下，确保已部署的版本在安装时验证其配置。你可希望在明年\
  \ 1 月 1 日凌晨 3 点调试你今天完成的安装。\n\n## .NET 技巧与窍门\n\n`.NET` 有它自己的特殊之处——这里有你应该注意的几点。\n\n\
  `.NET` 中的解决方案（Solution）和项目文件（project files）包含了对它们将要构建的文件的引用。如果一个文件没有被引用，它就不会被构建。这意味着一个文件可能已从解决方案中删除，但仍然存在于文件系统中。这可能导致难以诊断的问题，因为在某处，有人查看这个文件并好奇它是干什么用的。通过删除这些文件来保持项目的整洁至关重要。做到此的一种简单方法是在所有解决方案中开启“显示隐藏文件（Show\
  \ Hidden Files）”功能，然后留意没有图标的文件。当你看到一个时，从你的源码控制系统中将其删除。\n\n理想情况下，这会在你从解决方案中删除它们时自动发生，但遗憾的是大多数与\
  \ `Visual Studio` 集成的源码控制集成工具都不会这样做。在等待工具供应商实现此功能期间，关注这个问题很重要。\n\n注意 `bin` 和 `obj`\
  \ 目录。确保你的清理（clean）操作删除了解决方案中所有的 `bin` 和 `obj` 目录。确保这一点的方法是让你的“clean”调用 `Devenv`\
  \ 的 `clean solution` 命令。\n\n## 总结\n\n我们使用“脚本（script）”一词的范围非常广。通常，我们指的是所有帮助我们构建、测试、部署和发布软件的自动化操作。当你从部署流水线的末端来看这一大堆脚本时，它们看起来既艰巨又复杂。然而，构建或部署脚本中的每个任务都是简单的，过程本身并不复杂。我们非常有力的建议是，将构建和部署过程作为你脚本集合的指南。逐步扩展你的自动化构建和部署能力，通过遍历部署流水线，迭代识别并自动化最痛苦的步骤。始终记住最终目标——即在开发、测试和生产环境之间共享相同的部署机制，但在创建这些工具的早期不要纠结于这个想法。但是，要让运维和开发人员参与这些机制的创建。\n\
  \n\n\n最后，必须再次强调，脚本是你系统中一等公民。它们应该贯穿系统的整个生命周期。它们应该被版本控制、维护、测试和重构，并成为你部署软件的唯一机制。许多团队将他们的构建系统视为事后才考虑的事；根据我们的经验，在设计方面，构建和部署系统几乎总是处于边缘化的地位。结果，这些维护不善的系统往往是实现合理的、可重复发布流程的障碍，而非基础。交付团队应该花费时间和精力来确保构建和部署脚本的正确性。这不是你团队中实习生用来练手的任务。请花时间思考你想要实现的目标，并设计你的构建和部署流程以达成这些目标。\n\
  \n# 第 7 章 提交阶段（The Commit Stage）\n\n## 引言\n提交阶段始于项目状态的变更——即向版本控制系统进行提交（commit）。它结束于一份失败报告，或者如果成功，则是收集用于后续测试和发布阶段的二进制产物和可部署程序，以及关于应用程序状态的报告。理想情况下，一个提交阶段的运行时间应小于五分钟，且绝对不超过十分钟。\n\
  \n从多个方面来说，提交阶段代表了进入部署流水线的入口。它不仅是创建新发布候选（release candidate）的点；也是许多团队在开始实现部署流水线时的起点。当一个团队实施持续集成实践时，他们会在该过程中创建一个提交阶段。\n\
  \n这是至重要的第一步。使用提交阶段可以确保你的项目将尽可能地减少在代码级集成上花费的时间。它驱动了良好的设计实践，并对代码质量以及交付速度产生巨大影响。\n\n\
  提交阶段也是你应该开始构建部署流水线的点。\n\n图 7.1 提交阶段\n\n![Image](img/fig7_1.jpg)\n\n我们已经在之前的章节“持续集成”和“部署流水线的解剖”中简要地描述过提交阶段。在本章中，我们将通过更详细地描述如何创建一个有效的提交阶段和高效的提交测试来扩展这些内容。这主要会让开发人员感兴趣，因为他们是提交阶段反馈的主要消耗者。提交阶段见图\
  \ 7.1。\n\n为了唤起你的记忆，提交阶段的工作原理如下：有人向版本控制系统中的主干（trunk）提交了变更。你的持续集成服务器检测到该变更，检出源代码并执行一系列任务，包括：\n\
  \n* 针对集成后的源代码进行编译（如有必要）并运行提交测试\n* 创建可以部署到任何环境的二进制文件（如果你使用编译型语言，这将包括编译和组装）\n* 执行任何检查代码库健康状况所需的分析\n\
  * 创建后续在部署流水线使用的任何其他产物（例如数据库迁移脚本或测试数据）\n\n这些任务由你的持续集成服务器运行的构建脚本编排。你可以在第 6 章“构建与部署脚本”中阅读更多关于构建脚本的知识。二进制文件（如果阶段执行成功）和报告随后存储在你的中央产物仓库中，供你的交付团队和流水线的后续阶段使用。\n\
  \n对于开发人员来说，提交阶段是开发过程中最重要的反馈周期。它对他们作为开发人员引入系统的最常见错误提供了快速反馈。提交阶段的结果代表了每个发布候选生命周期中的一个重大事件。在此阶段成功是进入部署流水线并启动软件交付流程的唯一途径。\n\
  \n## 提交阶段的原则与实践\n如果部署流水线的目标之一是消除不适合生产环境的构建，那么提交阶段就是门口口的守门员。它的目标是确保任何不合格的内容在引起麻烦之前被拒绝。提交阶段的主要目标是创建可部署的产物，或者快速失败并通知团队失败的原因。\n\
  \n以下是一些构建有效提交阶段的原则和实践。\n\n#### 提供快速、实用的反馈\n提交测试的失败通常可以归于以下三个原因之一：代码中引入了语法错误（在编译型语言中会被编译捕获）；或者应用程序中引入了语义错误，导致一个或多个测试失败；或者应用程序或环境（包括操作系统）配置存在问题。无论问题是什么，一旦发生失败，提交阶段应在提交测试完成后立即通知开发人员，并提供失败原因的简要总结，例如失败测试列表、编译错误或任何其他错误状况。开发人员还应该轻松访问运行提交阶段时的控制台输出，这些输出可能分布在几个窗口中。\n\
  \n如果错误在早期、在接近引入它们的地方被检测到，将最容易修复。这不仅是因为这些错误在引入它们的人员脑海中仍然是新的，而且还因为发现错误原因的机制更简单。如果开发人员的变更导致了测试失败，且失败原因并非显而易见，那么自然的做法是查看自上次系统正常工作以来发生的所有变更，以缩小搜索范围。\n\
  \n如果该开发人员一直遵循我们的建议并频繁提交变更，那么每个变更的范围将很小。如果部署流水线能够快速识别该失败（理想情况下是在提交阶段），那么变更的范围就局限于该开发人员个人完成的那些变更。这意味着修复在提交阶段发现的问题，比在过程后期阶段（即可能测试了一大批变更的阶段）中发现的问题要简单得多。\n\
  \n因此，为了让我们的部署流水线高效，我们需要尽可能尽早发现错误。在大多数项目中，我们实际上在提交阶段之前就开始了这一过程，即最大限地利用现代开发环境——在开发环境中标记时尽力修复编译警告（如果适用）或语法错误。许多现代\
  \ CI 服务器还提供名为“预测试提交”（pretested commit）或“预检构建”（preflight build）的功能，在提交前对变更运行提交阶段。如果你没有这项功能，你必须在提交之前本地编译并运行提交测试。\n\
  \n提交阶段是我们将质量关注点扩展到个人开发者之外之外第一个正式步骤。提交阶段发生的第一件事是将提交者的变更与主干集成，然后对集成后的应用程序进行某种自动的“校对”。如果我们坚持尽早识别错误的目标，我们需要专注于快速失败，因此我们需要提交阶段能够捕获开发人员可能引入应用程序的大多数错误。\n\
  \n\n\n在采用持续集成早期，一个常见的错误是将“快速失败”的教条理解得过于字面化，在发现错误时立即让构建失败。这种做法接近正确，但优化过头了。我们通常将提交阶段（commit\
  \ stage）划分为一系列任务（具体任务取决于项目），例如编译、运行单元测试等。只有当错误导致该阶段的其余部分无法运行时（例如编译错误）——我们才会停止提交阶段。否则，我们会运行提交阶段直到结束，并提供一份包含所有错误和失败的汇总报告，以便一次性修复所有问题。\n\
  \n### 什么情况下应该中断提交阶段？\n\n传统上，提交阶段设计为在上述列出的任一种情况下失败：编译失败、测试中断或存在环境问题。否则，提交阶段即为成功，并报告一切\
  \ `OK`。但如果测试通过仅仅是因为测试用例寥寥无几呢？如果代码质量很差呢？如果编译成功但有数百个警告，我们应该感到满意吗？绿色的提交阶段很容易变成一个假阳性，暗示应用程序的质量是可以接受的，而实际上并非如此。\n\
  \n有一种强有力的论点认为我们对提交阶段施加的二元约束——要么成功要么失败——太具限制性。在提交阶段运行完成后，应该能够提供更丰富的信息，例如代表代码覆盖和其他指标的图表集。这些信息可以使用一系列阈值聚合为交通灯显示（红、黄、绿）或滑动刻度。例如，如果单元测试覆盖率降到\
  \ 60%，我们可以让提交阶段失败；如果低于 80%，则让它通过但状态设为琥色而非绿色。\n\n我们在现实生活中还没有见过如此复杂的机制。然而，我们编写过一些提交阶段脚本，如果警告数量增加或不再减少，会导致构建失败（我们称这种做法为“棘轮策略”），正如第\
  \ 73 页“由于警告和代码风格违规导致构建失败”节中所述。如果代码重复率超过某些预设限制，或者发生其他代码质量违规，让脚本导致提交阶段失败是完全可以的。\n\n\
  但请记住，如果提交阶段失败，规则是交付团队必须立即停止正在做的任何工作并修复它。不要因为全团队未达成的原因而让提交测试失败，否则人们将不再认真对待失败，持续集成也将崩溃。不过，要持续审查应用程序的质量，并在适当的情况下通过提交阶段强制执行质量指标。\n\
  \n### 细心维护提交阶段\n\n提交阶段将包含构建脚本以及运行单元测试、静态分析工具等的脚本。这些脚本需要细心维护，并像对待应用程序其他任何部分一样给予同样的尊重。像任何其他软件系统一样，当构建脚本设计不当且维护不力时，保持它们运行所需的精力会呈指数级增长。这具有双重打击的影响：一个糟糕的构建系统不仅会将宝贵且昂贵的开发精力从创建应用程序业务逻辑的重要工作中抽离；还会减慢任何仍在尝试实现该业务逻辑的人。我们见过几个项目在构建问题的压力下实际上已经停滞。\n\
  \n随着提交阶段脚本的演进，要不断改进其质量、设计和性能。一个高效、快速、可靠的提交阶段是任何开发团队生产力的关键推动者，因此投入少量的时间和精力使其良好运行几乎总能迅速获得回报。保持提交构建快速并确保无论什么失败都能尽早捕获需要创造力，例如对测试用例进行仔细的选择和设计。被视为次于应用程序代码的脚本会迅速变得不可理解和维护。我们到目前的记录是一个我们的手的项目，其\
  \ `Ant` 脚本高达 10,000 行 `XML`。不用说，这个项目需要整个团队专门负责构建运行——这完全是资源的浪费。\n\n确保你的脚本是模块化的，如第\
  \ 6 章“构建与部署脚本”所述。组织它们的结构，将经常使用但很少更改的常用任务与经常更改的任务（例如为代码库添加新模块）分开。将运行部署流水线不同阶段的代码分离到单独的脚本中。最重要的避免特定环境脚本：将特定环境配置从构建脚本本身分离。\n\
  \n### 让开发者拥有所有权\n\n在某些组织中，有专家团队擅长创建高效、模块化的构建流水线以及管理运行这些线的环境。我们都担任过这一角色。然而，如果我们到了只有这些专家才能维护\
  \ CI 系统的程度，我们认为是一种失败。\n\n交付团队对提交阶段（以及整个流水线基础设施）具有所有权感至关重要。这与他们的工作和生产力紧密相关。如果你在开发者与其快速有效地做出更改的能力之间设置任何障碍，你就会减慢他们的进度并为以后留下麻烦。\n\
  \n常规更改，如添加新库、配置文件等，应该由开发者和运维人员在需要时共同完成。这种活动不应由构建专家完成，除非是在项目极早期团队正努力建立构建的阶段。\n\n\
  专家的专业知识不应被低估，但他们的目标应该是建立良好的结构、模式和技术使用，并将他们的知识传递给交付团队。一旦建立了这些基本规则，他们的专业知识只需要用于转型，而不是日常的构建维护。\n\
  \n对于非常大的项目，有时会有足够的工作让环境或构建专家全职投入，但根据我们的经验，这最好被视为解决棘手问题的临时方案，通过开发者与专家合作将知识传播到交付团队。\n\
  \n开发者和运维人员必须对构建系统的维护感到自在并对其负责。\n\n### 对于特大型团队使用构建大师\n\n在多达三十人的小型且协作的团队中，自我组织可以运行得很好。如果构建损坏，在这种规模的团队中，通常很容易找到负责的人员，如果他们没有处理，则提醒他们；如果他们正在处理，则提供帮助。\n\
  \n\n\n构建主（build master）不应该是一个永久性的职位。团队成员应该轮流担任这一职位，也许是每周一次。对于每个人来说，经常尝试这个角色既是一项良好的纪律，也是一次重要的学习经验。无论如何，想要全职做这项工作的人寥寥无几。\n\
  \n## 提交阶段（The Commit Stage）的结果\n\n提交阶段像部署流水线中的每个阶段一样，既有输入也有输出。输入是源代码，输出是二进制文件和报告。生成的报告包括测试结果（这对于在测试失败时查明问题所在至关重要）以及对代码库分析的报告。分析报告可以包括测试覆盖率、圈复杂度、剪切粘贴分析、入耦合（afferent\
  \ coupling）和出耦合（efferent coupling），以及其他有助于建立代码库健康状况有用指标。提交阶段生成的二进制文件与在整个流水线中重用并可能发布给用户的文件完全相同。\n\
  \n### 制制品仓库（The Artifact Repository）\n\n提交阶段的输出（即你的报告和二进制文件）需要存储在某处，以便在流水线的后续阶段重用，并让你的团队能够获取。显而易见的地方似乎是你的版本控制系统。除了一些附带事实外，还有几个原因说明这不是正确的做法：通过这种方式你可能会很快耗尽磁盘空间，而且某些版本控制系统不支持这种行为。\n\
  \n* 制制品仓库是一种特殊的版本控制系统，因为它只需要保留某些版本。一旦发布候选版本（release candidate）在部署流水线的某个阶段失败，我们就不再对它感兴趣了。因此，如果我们愿意，可以从制制品仓库中清除二进制文件和报告。\n\
  * 能够从发布的软件追溯到创建它的版本控制修订版本是非常关重要的。为了实现这一点，流水线的实例应该与触发它的版本控制系统修订相关联。作为流水线的一部分将任何内容提交到源码控制中都会引入更多与流水线相关的修订，从而使此过程变得复杂得多。\n\
  * 配置管理策略的验收标准之一是二进制文件的创建过程应该是重复的。也就是说，如果我删除二进制文件并从最初触发它的相同修订重新运行提交阶段，我应该再次获得完全相同的二进制文件。在配置管理领域，二进制文件是二等公民，尽管在永久存储中保留二进制文件的哈希值（hashes）是值得的，以便验证你可以重新创建完全相同的内容，并从生产环境回溯到提交阶段。\n\
  \n大多数现代持续集成服务器都提供制制品仓库，包括允许在一段时间后清除不需要的制制品的设置。它们通常提供一种机制，以声明式的方式指定你在运行任何作业任务后想要存储在仓库中的制制品，并提供\
  \ Web 界面允许你的团队访问报告和二进制文件。或者，你可以使用诸如 `Nexus` 之类的专用制制品仓库，或其他 `Maven` 风格的仓库管理器来处理二进制文件（这些工具通常不适用于存储报告）。仓库管理器使得从开发机器访问二进制文件变得容易得多，而无需与你的\
  \ CI 服务器集成。\n\n## 创建自己的制制品仓库\n\n如果你想的话，创建自己的制制品仓库非常简单。我们在第 13 章“管理组件和依赖”中更详细地描述了制制品仓库背后的原理。\n\
  \n图 7.2 制制品仓库的角色\n\n![Image](img/fig7_2.jpg)\n\n图 7.2 显示了典型安装中使用制制品仓库的流程图。它是存储你的每个发布候选版本的二进制文件、报告和元数据的关键资源。\n\
  \n以下详细说明了发布候选版本成功进入生产环境的“快乐路径”（happy path）中的每个步骤。数字指的是图 7.2 所示的枚举步骤。\n\n1. 交付团队中的某人提交了一个更改。\n\
  2. 你的持续集成服务器运行提交阶段。\n3. 完成后，二进制文件以及任何报告和元数据都被保存到制制品仓库中。\n4. 你的 CI 服务器检索提交阶段生成的二进制文件，并部署到类生产测试环境。\n\
  5. 你的持续集成服务器运行验收测试，重用提交阶段生成的二进制文件。\n6. 完成后，发布候选版本被标记为通过验收测试。\n7. 测试人员可以获得通过验收测试的所有构建列表，并可以点击按钮运行自动化过程将其部署到手动测试环境。\n\
  8. 测试人员执行手动测试。\n9. 手动测试成功结束后，测试人员更新发布候选版本的状态，指示其已通过 `manual testing`（手动测试）。\n10.\
  \ 你的 CI 服务器根据流水线配置，从制制品仓库检索通过验收测试或手动测试的最新候选版本，并将应用程序部署到生产测试环境。\n11. 对发布候选版本运行容量测试（capacity\
  \ tests）。\n12. 如果成功，候选版本的状态将更新为“capacity-tested”（已通过容量测试）。\n13. 这种模式按流水线所需的阶段重复。\n\
  14. 一旦 RC（发布候选版本）通过所有相关阶段，它就“ready for release”（准备发布），可以由任何具有相应权限的人发布，通常是 QA 和运维人员共同签字。\n\
  15. 在发布过程结束时，RC 被标记为“released”（已发布）。\n\n![Image](img/common.jpg)\n\n为了简单起见，我们将其描述为一个顺序处理的过程。在早期阶段这是正确的：它们应该按顺序执行。然而，根据项目的不同，非顺序运行某些验收阶段后的步骤可能是有意义的。例如，手动测试和容量测试都可以由验收测试的成功完成触发。或者，测试团队也可以选择将不同的发布候选版本部署到他们的环境中。\n\
  \n## 提交测试套件的原则与实践\n\n提交测试测试的设计有一些重要的原则和实践。你的大多数提交测试应该由单元测试组成，这也是本节的重点。单元测试最重要的属性是执行速度非常快。如果测试套件不够快，我们有时会失败构建。另一个重要的属性是它们应该覆盖代码库的大部分（大约\
  \ 80% 是一个很好的准则），让你有足够的信心，当它们通过时，应用程序很可能正常工作。当然，每个单元测试只测试应用程序的一部分且不启动它——因此从定义上说，单元测试套件无法给你关于应用程序工作的完全信心；那是部署流水线其他部分要做。\n\
  \n图 7.3 测试自动化金字塔 (Cohn, 2009, 第 15 章)\n\n![Image](img/fig7_3.jpg)\n\n\n\n\nMike\
  \ Cohn 有一种很好的方法可以可视化你应该如何构建自动化测试套件。在图 7.3 所示的测试自动化金字塔中，单元测试构成了测试的大绝部分。但由于它们执行速度非常快，单元测试套件仍然应该在几分钟内完成。尽管验收测试较少（这些被进一步细分为服务测试和\
  \ UI 测试），但这些测试的执行时间通常要长得多，因为它们是针对整个运行系统运行的。所有层次对于确保应用程序正常运行并交付预期业务价值都是至关重要的。这个测试金字塔涵盖了第\
  \ 84 页“测试类型”章节所示的测试象限图（“支持编程”）的左侧。\n\n设计能够快速运行的提交测试（commit tests）并不总是简单的。我们将在接下来的几段中描述几种策略。不过，其中大多数都是为了实现一个单一目标的技术：最小化任何给定测试的范围，并使其尽可能专注于测试系统的某一个方面。特别是，运行单元测试不应触碰文件系统、数据库、库、框架或外部系统。对你环境中这些部分的任何调用都应该被测试双体（test\
  \ doubles）取代，例如 mocks 和 stubs（测试双体的类型在第 91 页的“测试双体”章节中定义）。关于单元测试和测试驱动开发已有许多著作，所以我们在这里仅仅是冰山一角。请查看参考文献以获取更多关于此主题的信息。(([1)\n\
  \n### 避免用户界面\n\n根据定义，用户界面是用户发现 bug 最显而易见的地方。因此，人们自然倾向于将测试精力集中在上面，有时甚至以牺牲其他类型的测试为代价。\n\
  \n但是，对于提交测试而言，我们建议完全不要通过 UI 进行测试。UI 测试的困难源于两个方面：首先，它往往涉及许多受测软件组件或层级。这是一个问题，因为在执行测试本身之前，为测试准备好所有部分需要花费精力和时间。其次，UI\
  \ 的设计是为了适应人类的时间尺度，而与计算机的时间尺度相比，这种尺度是极其缓慢的。\n\n如果你的项目或技术选择允许你避开这两个问题，也许值得创建通过 UI\
  \ 运行的单元级测试，根据我们的经验，UI 测试通常是有问题的，而且通常在部署流水线的验收测试阶段处理得更好。\n\n我们将在关于验收测试的章节中更详细地讨论\
  \ UI 测试的方法。\n\n### 使用依赖注入\n\n依赖注入（Dependency injection），或称为控制反转（inversion of control），是一种设计模式，描述了对象之间的关系应该从对象外部而不是从内部建立。显然，这一建议仅适用于你使用面向对象的语言的情况。\n\
  \n如果我创建一个 `Car` 类，我可以将其设计为：每当我创建一个新的 `Car` 时，它都会创建自己的 `Engine`。或者，我可以选择设计 `Car`，使其在我创建它时强制我为它提供一个\
  \ `Engine`。\n\n后者就是依赖注入。这样更加灵活，因为现在我可以在不更改 `Car` 代码的情况下创建带有不同类型 `Engine` 的 `Cars`。我甚至可以创建一个特殊的\
  \ `TestEngine` 来创建我的 `Car`，在测试 `Car` 时它仅假装成一个 `Engine`。\n\n这种技术不仅是实现灵活、模块化软件的绝佳途径，而且使其非常容易将测试范围限制在你想要测试的类上，而不是包含它们所有的依赖负担。\n\
  \n### 避免数据库\n\n初次接触自动化测试的人通常会编写与代码中的某些层交互的测试，将结果存储在数据库中，然后确认结果已存储。虽然这种方法的优点是易于理解，但在所有其他方面，它并不是一种非常有效的方法。\n\
  \n首先，它产生的测试运行速度要慢得多。当你想要重复这些测试，或紧连续运行几个相似的测试时，测试的状态性（statefulness）可能会成为障碍。基础设施设置的复杂性使得整个测试方案的建立和管理变得更加复杂。最后，如果无法简单从测试中消除数据库，这意味着你的代码分层不当且关注点分离不良。这是另一个测试性（testability）和\
  \ CI 对你和你的团队施加微妙压力、促使开发更好代码的领域。\n\n构成提交测试大部分单元测试绝不应该依赖数据库。为了实现这一点，你应该能够将受测代码与其存储分离离开。这要求代码具有良好的分层，还需要使用诸如依赖注入的技术，甚至在最后手段下使用内存数据库。\n\
  \n然而，你还应该在提交测试中包含一两个两个非常简单的冒烟测试（smoke tests）。这些应该是来自你验收测试套件的端到端测试，用于测试高价值、常用的功能，并证明你的应用程序实际上在运行。\n\
  \n#### 在单元测试中避免异步化\n\n单个测试用例范围内的异步行为会使系统难以测试。最简单的方法是通过拆分测试来避免异步化，使得一个测试运行到异步断点处，然后启动另一个单独测试。\n\
  \n例如，如果你的系统发布一条消息然后对其采取操作，请用你自己的接口封装原始的消息发送技术。然后，你就可以在一个测试用例中确认调用如你预期的那样发生，也许可以使用一个实现消息接口的简单\
  \ stub，或者使用下一节中描述的 mocking。你可以添加第二个测试来验证消息处理器的行为，只需调用通常会调用的那个点即可。但是，取决于你的架构，如果不进行大量工作，有时是不可能的。\n\
  \n我们建议你努力消除提交阶段的异步化。依赖基础设施（即使是内存）的测试属于组件测试，而不是单元测试。更复杂、运行较慢的组件测试应该是验收测试阶段的一部分，而不是提交阶段。\n\
  \n#### 使用测试双体\n\n理想的单元测试专注于少数的、密相关的代码组件，通常是一个类或几个密相关的类。\n\n然而，在一个设计良好的模块化系统中，每个类的规模都较小，并通过与其他类的交互来实现其目标。这是良好封装的核心——每个类都向其他类隐藏关于其如何实现目标的秘密。\n\
  \n问题是，在这样一个设计良好的模块化系统中，测试关系网络中的一个对象可能需要对所有周围类进行复杂的设置。解决方案是伪造与依赖类的交互。stub 掉此类依赖的代码有一个悠久且光光的传统。当我们建议使用\
  \ `TestEngine` 替换 `Engine` 时，我们已经描述了依赖注入的使用。\n\nStubbing 是用一个提供固定响应的模拟版本替换系统的部分部分。Stub\
  \ 不对编程之外的任何内容做出响应。这是一种强大且灵活的方法，在每个层次都有用——从 stub 一个受测代码依赖的单个简单类，到 stub 整个系统。\n\n\
  * * *\n\n### 使用 Stub 替代消息系统\n\n\n\n\nDave 曾经参与过一个交易系统，该系统需要通过消息队列以一种相当复杂的方式与另一个由其他团队开发的系统进行交互。这种交互非常频繁，包含了一系列消息，这些消息在很大程度上驱动了交易的生命周期，并保持两个系统之间的步调一致。由于这个外部系统，我们的系统无法拥有交易的完整生命周期，因此很难创建有意义的端到端验收测试。\n\
  \n我们实现了一个相当复杂的存根（stub）来模拟真实系统的运行。这给我们带来了很多益处：它允许我们为了测试目的，填补系统生命周期中的空白；它的另一个优势是，允许我们模拟那些在真实系统中难以设置的边缘情况（edge\
  \ cases）。最后，它打破了我们对另一个系统正在进行的并行开发的依赖。\n\n我们不再需要维护一个相互通信的复杂分布式系统网络，而是可以选择何时与真实对象交互，何时处理更简单的存根。我们通过配置来管理存根的部署，这样就可以根据环境来决定是与真实系统交互还是与存根交互。\n\
  \n***\n\n我们倾向于在大规模组件和子系统中广泛使用存根技术，但在编程语言层面的组件上得较少；在这一层面，我们通常更倾向于使用 Mock（模拟）。\n\n\
  Mock 是一种较新的技术。它的动力来源于对存根的喜爱，以及希望广泛使用它们而无需承担编写大量存根代码的工作量。如果我们不需要为正在测试的类编写冗长的代码来存根所有的依赖，而是让计算机自动为我们构建一些存根，那不是太好了吗？\n\
  \nMock 本质上就是这样。有多种 Mock 工具集，例如 `Mockito`、`Rhino`、`EasyMock`、`JMock`、`NMock`、`Mocha`\
  \ 等。Mock 允许你有效地表示：“我创建一个伪装成类型 X 对象。”\n\n至关重要的是，它更进了一，允许你通过几个简单的断言（assertions）来指定你对测试代码的预期行为。这是\
  \ Mock 和存根之间的本质区别——对于存根，我们并不关乎存根是如何被调用的；而对于 Mock，我们可以验证代码是否以我们预期的方式与 Mock 进行了交互。\n\
  \n让我们回到汽车的例子，并对比比较这两种方法。为了方便起见，假设有一个需求：当我们调用 `Car.drive` 时，我们期望先调用 `Engine.start`，然后调用\
  \ `Engine.accelerate`。\n\n正如我们已经描述过的，在这两种情况下我们都会使用依赖注入将 `Engines` 与 `Cars` 关联。我们的简单类可能像这样：\n\
  \n![Image](img/p0182-01.jpg)\n\n如果我们使用存根技术，我们将创建一个存根实现，即 `TestEngine`，它会记录 `Engine.start`\
  \ 和 `Engine.accelerate` 都被调用的事实。由于我们要求 `Engine.start` 应该先调用，如果 `Engine.accelerate`\
  \ 先调用，我们可能需要在存根中抛出异常，或者以某种方式记录错误。\n\n我们的测试现在将包括：创建一个新的 `Car`并将 `TestEngine` 传入其构造函数，调用\
  \ `Car.drive` 方法，并确认 `Engine.start` 和 `Engine.accelerate` 分别被调用。\n\n![Image](img/p0182-02.jpg)\n\
  \n使用 Mock 工具的相应测试更像这样：我们通过调用 Mock 类来创建一个 Mock `Engine`，并传递定义 `Engine` 接口的接口或类的引用。\n\
  \n我们声明了两个预期，按照正确的顺序指定我们期望 `Engine.start` 和 `Engine.accelerate` 被调用。最后，我们要求 Mock\
  \ 系统验证我们预期的事情是否真的发生了。\n\n![Image](img/p0183-01.jpg)\n\n这里的示例基于使用一个名为 `JMock` 的开源\
  \ Mock 系统，但其他系统也类似。在这种情况下，最后的验证步骤是在每个测试方法的结束时隐式完成的。\n\nMock 的益处是显而易见的。即使在这个微不足道且过度简化的例子中，代码也少得多。在实际使用中，Mock\
  \ 可以节省大量精力。Mock 也是将第三方代码从测试范围中隔离出来的绝佳方法。你可以对第三方代码的任何接口进行 Mock，从而从测试范围中消除真实代码——当这些交互使用昂贵的远程通信或重型基础设施时，这是一个极佳的策略。\n\
  \n最后，与组装所有依赖及其状态相比，使用 Mock 的测试通常非常快。Mock 是一项有很多益处的技术：我们强烈向你推荐。\n\n### 最小化测试中的状态\n\
  \n理想情况下，你的单元测试应该专注于断言系统的行为。一个常见问题（特别是对于有效测试设计的新手来说）是测试周围状态堆积。问题实际上是双重的。首先，很容易想象出几乎任何形式的测试：你向系统的中的某个组件输入某些值并获得某些结果。你通过组织相关的数据结构来编写测试，以便以正确的格式提交输入，并将结果与预期的输出进行比较。事实上，几乎所有测试在不同一程度上都是这种形式的。问题在于，如果不留心，系统及其相关的测试会变得越来越复杂。\n\
  \n为了支持测试而掉入构建复杂、难以理解且难以维护的数据结构的陷阱是非常容易的。理想的测试应该是设置起来快速简单，拆卸（tear down）起来更快更简单。结构良好的代码往往有整洁的测试。如果你的测试看起来笨拙且复杂，这反映了系统设计的问题。\n\
  \n尽管，这是一个很难解决的问题。我们的建议是尽量减少测试对状态的依赖。你现实中无法消除它，但关注运行测试所需构建的环境的复杂度是明智的。随着测试变得越来越复杂，它通常意味着需要检查代码结构。\n\
  \n### 伪造时间\n\n由于几个原因，时间在自动化测试中可能会成为问题。也许你的系统需要在晚上 8 点触发日终处理。也许它在继续下一步之前需要等待 500\
  \ 毫秒。也许它需要在闰年的 2 月 29 日执行不同的操作。\n\n所有这些情况处理起来都非常棘手，如果你试图将它们绑定到真实的系统时，对你的测试策略可能是灾难性的。\n\
  \n对于任何基于时间的行为，我们的策略是将对时间需要抽象到一个受我们控制的独立类。我们通常应用依赖注入来注入我们使用的系统级时间行为的封装。\n\n这样，我们就可以\
  \ Stub 或 Mock `Clock` 类（或我们选择的任何合适的抽象）。如果我们在测试范围内决定现在是闰年或 500 毫秒后，这完全在我们的控制之下。\n\
  \n对于快速构建，这对于任何需要延迟或等待的行为尤为重要。组织你的代码，使测试运行期间的所有延迟为零，以保持测试性能。如果你的单元测试需要真实的延迟，也许应该重新考虑代码和测试的设计以避免它。\n\
  \n### 暴力破解\n\n\n\n\n开发者总是会追求最快的提交周期。然而，实际上，这种需求必须与提交阶段（commit stage）识别你可能引入的最常见错误的能力相平衡。这是一个只有通过试错才能生效的优化过程。有时，接受一个较慢的提交阶段比花费太多时间去优化测试速度或减少测试能捕获的\
  \ bug 比例要好。\n\n我们通常的目标是将提交阶段保持在十分钟以内。就于我们来说，这基本上是上限。它比理想状态（五分钟以内）要长。在大型项目上工作的开发者可能会对十分钟这个目标感到望而却步，认为这个目标低得无法实现。其他开发团队会认为这是一种过度的妥协，因为他们知道最高的提交阶段比这快得多。尽管如此，基于对许多项目的观察，我们认为这个数字是一个很有用的指南。当这个限制被打破时，开发者会开始做两件事，这两者对开发过程都有极糟糕的影响：他们开始降低提交频率，而且如果提交阶段的运行时间\
  \ `significantly` 超过十分钟，他们就不再关心提交测试套件是否通过。\n\n你有两个技巧可以让你的提交测试套件运行得更快。首先，将其拆分为单独套件并在几台机器上并行运行它们。现代\
  \ CI 服务器具有“构建网格”（build grid）功能，让这变得极其简单。记住，计算能力是廉价的，而人是贵的。及时获得反馈比几台服务器的成本价值得多。你可以使用的第二个技巧是在构建优化过程的一部分，将那些运行时间长且不失败的测试推到你的验收测试阶段（acceptance\
  \ test stage）。注意，这会导致获取一组更改是否破坏了这些测试的反馈等待时间更长。\n\n## 总结\n\n提交阶段应该专注于一件事：尽可能地检测到系统更改可能引入的最常见失败，并通知开发者以便他们能够快速解决问题。提交阶段提供的反馈价值极高，因此投入精力保持其高效运行是重要的，最重要的是，要快速。\n\
  \n你的部署流水线中的提交阶段应该在有人向应用程序代码或配置引入更改时运行。因此，你开发团队的每位成员每天都会多次执行它。开发者的自然倾向是，如果构建性能下降到不可接受的标准，他们就会抱怨：让它增长到五分钟以上，抱怨就会开始。听取这些反馈并尽一切保持该阶段的快速是重要的，同时还要关注真实价值——即它能够快速失败，从而对那些如果以后修复将昂贵得多的错误提供反馈。\n\
  \n因此，建立提交阶段——一个在每次更改时启动的、构建二进制文件、运行自动化测试并生成指标的自动化过程——是你采用持续集成实践的道路上可以做的最低工作。提交阶段在你的交付流程的质量和可靠性方面提供了巨大的进步——假设你遵循了持续集成涉及的其他实践，例如定期提交并在发现任何缺陷时立即修复它们。尽管它只是部署流水线的起点，但它可能提供了最高的性价比：一种范式转变，使你能够确切地获知某项更改是在何时引入刻破坏了你的应用程序的，并能够立即让它重新恢复工作。\n\
  \n# 第 8 章 自动化验收测试\n\n## 引言\n\n图 8.1 验收测试阶段\n\n![Image](img/fig8_1.jpg)\n\n在本章中，我们将更详细地探索自动化验收测试及其在部署流水线中的位置。验收测试是部署流水线中的关键阶段：它们让交付团队超越了基础的持续集成。一旦你建立了自动化验收测试，你就是在测试应用程序的业务验收标准，即验证它是否为用户提供了有价值的功能。验收测试通常针对通过提交测试的每个软件版本运行。部署流水线验收测试阶段的工作流如图图\
  \ 8.1 的“作为可执行规范的验收标准”部分中详细介绍这一点。\n\n如果你具有测试驱动设计的背景，你可能在想为什么这些与我们的单元测试不同。区别在于，验收测试是面向业务的，而不是面向开发者的。它们针对类生产环境中的运行应用程序版本对整个故事进行测试。单元测试是任何自动化测试策略中不可或缺的一部分，但它们通常无法提供足够的信心来发布应用程序。验收测试的目标是证明我们的应用程序执行了客户想要的功能，而不是按照程序员认为应该的方式运行。\n\
  \n### 为什么自动化验收测试至关重要？\n\n\n\n\n\n关于自动化验收测试一直存在很大争议。项目经理和客户往往认为这些测试的创建和维护成本太高——事实上，如果操作方法不当，成本确实很高。许多开发者认为，通过测试驱动开发（TDD）创建的单元测试套件已足以防止回归错误。根据我们的经验，正确创建并维护一套良好的自动化验收测试套件，其成本远低于频繁进行手动验收测试和回归测试的成本，也远低于发布低质量软件的代价。我们还发现，自动化验收测试能够捕捉到单元或组件测试套件（无论多么全面）永远无法发现严重问题。\n\
  \n### 手动验收测试的成本\n\n首先，值得指出手动验收测试的成本。为了防止缺陷发布，每当发布应用时，都需要对其进行验收测试。我们知道有一家机构在每次发布上花费了\
  \ `$3,000,000` 进行手动验收测试。这对于他们频繁发布软件的能力是一个极其严苛的限制。对于任何复杂程度应用程序，任何有价值的手动测试工作都是非常昂贵的。\n\
  \n此外，为了发挥捕捉回归缺陷的作用，这种测试需要在开发完成且发布临近时作为一个阶段来执行。因此，手动测试通常发生在项目中的某个阶段，此时团队面临着交付软件的巨大压力。结果是，计划的时间通常不足以修复手动验收测试中发现的缺陷。最后，当发现需要复杂修复的缺陷时，极有可能向应用程序引入进一步的回归问题。\n\
  \n### 敏捷的替代方案\n\n敏捷社区中一些人倡导的方法是几乎完全取消自动化验收测试，转而编写全面的单元和组件测试套件。这些测试结合其他 XP 实践（如结对编程、`refactoring`，以及客户、分析师和测试人员共同进行的细致分析和探索性测试），被一些人认为是自动化验收测试成本的优越替代方案。\n\
  \n这种论点存在几个缺陷。首先，没有其他类型的测试能证明应用程序在在种程度上与生产环境运行的情况下，确实交付了用户所预期的业务价值。单元和组件测试不测试用户场景，因此无法发现用户在与应用交互过程中使其处于一系列状态时会出现的缺陷。验收测试正是为此设计的。它们还非常擅长捕捉线程问题、事件驱动应用程序中的突发行为，以及由架构错误或环境和配置问题引起的其他类\
  \ Bug。这类缺陷通过手动测试很难发现，更不用说单元或组件测试了。\n\n当你在对应用程序进行大规模更改时，验收测试也能保护你的应用程序。在这种情况下，单元测试和组件测试通常需要随着你的领域模型进行彻底更改，这限制了它们作为应用程序功能防御者的能力。只有验收测试能够证明在该过程结束后，你的应用程序仍然能够工作。\n\
  \n最后，选择放弃自动化验收测试的团队会给测试人员带来更大的负担，测试人员必须花费更多时间花在枯燥且重复的回归测试上。我们所知的测试人员并不支持这种方法。虽然开发者可以承担部分部分负担，但许多编写单元和组件测试的开发者在发现自己工作中的缺陷方面，远不如测试人员有效。根据我们的经验，有测试人员参与编写的自动化验收测试，在发现用户场景中的缺陷方面，比开发者编写的测试要好得多。\n\
  \n### 效率与协作\n\n人们不喜欢自动化验收测试的真正原因是它被认为成本太高。然而，将自动化验收测试的成本降低到使其变得高效且具有成本效益的水平以下是可能的。当对每个通过提交测试的构建版本都运行自动化验收测试时，对软件交付过程的影响是巨大的。首先，由于反馈循环缩短了，缺陷会被更早地发现，修复成本也更低。其次，由于测试人员、开发者和客户需要紧密协作来创建一个良好的自动化验收测试套件，他们之间的协作会好得多，每个人都专注于应用程序应该交付的业务价值。\n\
  \n有效的基于测试的策略还会产生其他积极的副作用：验收测试在构构良好的应用程序中运行效果最好，这些应用程序结构合理，具有薄薄的 UI 层，并经过精心设计，能够在开发机器以及生产环境中运行。\n\
  \n我们将创建和维护有效的自动化验收测试件的问题分分为四个部分：创建验收测试；创建应用程序驱动层；实现验收测试；以及维护验收测试套件。在详细介绍之前，我们先简要介绍我们的方法。\n\
  \n### 如何创建可维护的验收测试套件\n\n编写可维护的验收测试首先需要对分析过程进行仔细关注。验收测试源于验收标准，因此你的应用程序的验收标准必须考虑到自动化进行编写，并遵循\
  \ `INVEST` 原则，特别是要对最终用户*有价值的*且*可测试*。这是关注自动化验收测试对整个开发过程施加的另一个微妙但重要的压力：对更好需求的压力。如果验收标准编写得糟糕，没有解释待开发的功能对用户有何价值，那么将这些标准自动化就是产生糟糕且难以维护的验收测试套件的主要来源。\n\
  \n图 8.2 验收测试层\n\n![Image](img/fig8_2.jpg)\n\n一旦你有一组描述交付给用户价值验收标准，下一步就是将其自动化。自动化验收测试应该始终是分层的，如图\
  \ 8.2 所示。\n\n验收测试的第一层是验收标准。`Cucumber`、`JBehave`、`Concordion`、`Twist` 和 `FitNesse`\
  \ 等工具允许你将验收标准直接放在测试中并与底层实现链接。然而，正如本章后面描述，你也可以采用将验收标准编码在 `xUnit` 测试名称中的方法。你可以直接从\
  \ `xUnit` 测试框架运行验收测试。\n\n至关重要的是，你的测试实现应使用你的领域语言，而不包含如何与应用程序交互的细节。直接引用应用程序 API 或\
  \ UI 的测试实现是脆弱的，即使 UI 发生微小变化也会立即破坏所有引用已更改 UI 元素的测试。看到单个 UI 元素的改变导致大片此类验收测试套件崩溃的情况并不罕见。\n\
  \n\n\n\n\n遗憾的是，这种反模式非常常见。大多数测试都是在详细执行层级编写的：“点这里，弄弄那里，看这里获取结果。”这类测试通常是录制和回放式测试自动化产品的产物，这也是自动化验收测试被认为昂贵的主要原因之一。使用此类工具创建的任何验收测试套件都与\
  \ UI 紧耦合，因此极其脆弱。\n\n大多数 UI 测试系统都提供了各种操作，允许你向字段中输入数据、点击按钮并从页面的指定区域读取结果。这种程度的细节最终是必要的，但它离测试用例的意义——即真实价值——还有很远的距离。任何定的验收测试用例意图断言的行为，不可避免地处于一个不同的抽象层级。我们真正想知道的是问题的答案，例如：“如果我下了一个订单，它会被接受吗？”或“如果我超过了信用额度，我是否收到了正确的通知？”\n\
  \n测试实现应该调用下层（我们称之为应用驱动层，application driver layer）来与被测系统进行实际交互。应用驱动层拥有一个知道如何执行并返回结果的\
  \ API。如果你的测试是针对应用程序的公共 API 运行的，那么是应用驱动层知道该 API 的细节并调用其正确的部分。如果你的测试是针对 GUI 运行的，则此层将包含一个窗口驱动程序（window\
  \ driver）。在一个结构良好的窗口驱动程序中，特定的 GUI 元素只会被引用几次，这意味着如果它发生了变化，只需要更新对它的这些引用。\n\n长期维护验收测试需要自律。必须密切关注以保持测试实现高效且结构良好，特别是在管理状态、处理超时和使用测试双胞（test\
  \ doubles）方面。当添加新的验收标准时，必须对验收测试套件进行重构，以确保它们的连贯性。\n\n## 针对 GUI 进行测试\n\n在编写验收测试时，一个重要的问题是是否直接针对应用程序的\
  \ GUI 运行测试。由于我们的验收测试意在模拟用户与系统的交互，理想情况下，我们应该通过系统的用户界面（如果有的话）工作。如果我们不通过用户界面进行测试，我们测试的并不是系统用户在实际交互中调用的相同代码路径。然而，直接针对\
  \ GUI 进行测试存在几个问题：它的变化速度快、场景设置复杂、获取测试结果不便以及存在无法测试的 GUI 技术。\n\n用户界面在应用程序开发过程中通常经常变化。如果你的验收测试与\
  \ UI 耦合，UI 的微小变化就能轻易破坏你的验收测试套件。这不仅限于应用程序开发阶段；也可能发生在对系统的用户测试期间，由于于可用性的改进、拼写纠正等原因。\n\
  \n其次，如果 UI 是进入系统的唯一途径，场景设置可能会变得复杂。设置一个测试用例可能涉及许多交互，以便系统进入准备好测试的状态。在测试结束时，结果可能无法通过\
  \ UI 直观看出，因为 UI 可能无法提供你验证测试结果所需的信息。\n\n最后，某些 UI 技术（尤其是新的技术）极难进行自动测试。检查你选择的 UI 技术是否可以通过自动化框架进行驱动是非常重要的。\n\
  \n除了通过 GUI 测试外还有一种替代方案。如果你的应用程序设计良好，GUI 层代表了一组定义清晰的仅用于显示的代码，其本身不包含任何业务逻辑。在这种情况下，绕过它并针对其下方代码层编写测试的风险可能相对较小。考虑到可测试性编写的应用程序将具有一个\
  \ GUI 和测试框架（test harness）都可以通信的 API，以此驱动应用程序。直接针对业务层运行测试是一种合理的策略，如果你的应用程序能够支持，我们建议这样做。这只需要你的开发团队具备足够的自律，使表现层仅专注于像素绘制，而不偏入业务或应用程序逻辑领域。\n\
  \n如果你的应用程序不是这样设计的，你就必须直接针对 UI 进行测试。我们将在本章稍后的部分讨论管理这种情况的策略，主要策略是窗口驱动模式。\n\n## 创建验收测试\n\
  \n在本节中，我们将讨论如何创建自动化验收测试。我们从让分析师、测试人员和客户共同识别验收标准开始，然后讨论如何以可以自动化的形式表示验收标准。\n\n###\
  \ 分析师和测试人员的角色\n\n你的开发流程应该根据个人项目的需求进行量身定制，但作为一种通用建议，我们建议大多数任何规模的项目都应该有一位业务分析师作为每个团队的一部分工作。业务分析师的角色主要是代表系统的客户和用户。他们与客户合作，以识别并确定需求的优先级。他们与开发者合作，确保他们从用户的角度良好地理解应用程序。他们引导开发者，确保故事（stories）交付了它们应提供的业务价值。他们与测试人员合作，以确保正确定义了验收标准，并确保开发的功能符合这些验收标准并交付预期的价值。\n\
  \n测试人员在任何项目中都是必不可缺的。他们的角色最终是确保交付团队的每一个人（包括客户）都理解正在开发的软件的当前质量和生产就绪性。他们通过与客户和分析师合作来定义故事或需求的验收标准，与开发者合作编写自动化验收测试，并执行手动测试活动（如探索性测试、手动验收测试和演示展示）来实现这一点。\n\
  \n并不是每个团队都有专门的人员 100% 的时间执行这些角色。有时，开发者充当分析师，或者分析师充当测试人员。理想情况下，客户与团队在一起执行分析师的角色。重要的一点是，这些角色应该始终存在于团队中。\n\
  \n### 迭代项目中的分析\n\n通常情况下，在本书中我们尝试避免对你正在使用的开发过程做出任何假设。我们相信我们描述的模式对于使用任何过程的交付团队都有益。然而，我们相信迭代开发过程对于创建高质量软件至关重要。因此，如果我们认为在这里提供更多关于迭代开发过程的细节是相关的，请不要介意，因为这有助于划分分析师、测试人员和开发者的角色。\n\
  \n在交付的迭代方法中，分析师花费大量时间定义验收标准。这些标准是团队判断特定需求是否已满足的标准。最初，分析师将与测试人员和客户密切合作以定义验收标准。鼓励分析师和测试人员在这一阶段协作对双方都有益，并使过程更有效。分析师受益是因为测试人员可以提供他们的经验，说明哪些事情可以以及应该被有效地衡量以定义一个故事何时完成。测试人员受益是因为在测试这些需求成为他们的主要工作之前，他们对需求的性质有了理解。\n\
  \n\n\n\n一旦定义了验收标准，在需求实现之前，分析师和测试人员将与负责实现的开发者坐在一起，如果客户方便的话，客户也会参与。分析师描述需求及其所在的业务背景，并逐条过验收标准。然后，测试人员与开发者合作，约定一组自动化验收测试，通过这些测试来证明已满足验收标准。\n\
  \n这些简短的启动会议是连接迭代交付过程的“胶水”的重要组成部分，确保了需求实现的每个参与方都对该需求以及他们在交付过程中的角色有良好的理解。这种方法防止了分析师创建出实现或测试成本高昂的“象牙塔”式需求。它避免了测试人员提出并非缺陷、而是对系统的误解的“缺陷”。它防止了开发者实现出与人们真实需求关联乎甚微的东西。\n\
  \n在需求实现期间，如果开发者发现某个领域他们理解不够深入，或者他们发现了该需求所引发的问题或解决该问题更有效的方法，他们将咨询分析师。这种交互性是迭代交付过程的核心，而部署流水线提供的能力——允许我们随时在选择的环境上运行应用程序——极大地促进了这种交互性。\n\
  \n当开发者认为他们已完成工作时——这意味着所有相关的单元测试和组件测试均已通过，且验收测试已全部实现并显示系统已满足需求——他们将向分析师、测试人员和客户演示。这次评审允许分析师和客户看到该需求的运行解决方案，并给他们一个机会来确认它是否确实如预期地满足了需求。通常在这次评审中，会发现一些细小问题并立即予以解决。有时，此类评审会引发对替代方案或变更影响的讨论。这是团队测试他们对系统演进方向的共同理解的绝佳机会。\n\
  \n一旦分析师和客户对需求的实现表示满意，它将交由测试人员进行测试。\n\n### 验收标准作为可执行规范\n\n随着自动化测试在采用迭代流程的项目交付中变得愈发核心，许多从业者已经意识到，自动化测试不仅仅是为了测试。相反，验收测试是正在开发的软件行为的**可执行规范**。这是一个重大的发现，它催生了一种新的自动化测试方法，被称为“行为驱动开发”（BDD）。行为驱动开发的核心思想之一是，你的验收标准应该写成客户对应用程序行为的期望的形式。这样，就可以获取此类编写的验收标准并直接在应用程序上执行它们，以验证应用程序是否符合其规范。\n\
  \n这种方法具有显著优势。随着应用程序的演进，大多数规范会变得过时。但对于可执行规范来说，这是不可能可能的：如果它们没有准确指定应用程序的功能，它们在运行时会抛出相应的异常。当流水线的验收测试阶段针对不符合规范的应用程序版本运行运行时，它将会失败，因此该版本将无法用于部署或发布。\n\
  \n验收测试是面向业务的，这意味着它们应该验证你的应用程序是否为用户交付了价值。分析师为故事（stories）定义验收标准——这些标准必须被满足，该用户故事才能被认定为“已完成”。Chris\
  \ Matts 和 Dan North 设计了一了一种用于编写验收标准的领域特定语言，其格式如下：\n\n**Given**（假设）某些初始上下文，\n\n**When**（当）发生某个事件时，\n\
  \n**Then**（那么）有一些结果。\n\n对于你的应用程序，“given”代表应用程序在测试用例开始时的状态。“when”句描述了用户与你的应用程序之间的交互。“then”句描述了该交互完成后应用程序的状态。你的测试用例的任务是让应用程序进入“given”句中描述的状态，执行“when”句中描述的操作，并验证应用程序的状态如“then”句所描述的。\n\
  \n例如，考虑一个金融交易应用程序。我们可以按照以下格式编写一个验收标准：\n\n![Image](img/p0196-01.jpg)\n\n`Cucumber`、`JBehave`、`Concordion`、`Twist`\
  \ 和 `FitNesse` 等工具允许你以纯文本的形式编写此类验收标准，并保持它们与实际应用程序同步。例如，在 `Cucumber` 中，你会将上述验收标准保存在类似\
  \ `features/placing_an_order.feature` 的文件中。该文件代表图 8.2 中的验收标准。然后你会创建一个 Ruby 文件，列出该场景所需的步骤，命名为\
  \ `features/step_definitions/placing_an_order_steps.rb`。该文件代表图 8.2 中的测试实现层。\n\n\
  ![Image](img/p0196-02.jpg)\n\n为了支持这项及其他测试，你需要在 `application_driver` 目录下创建 `AdminApi`\
  \ 和 `TradingUi` 类。这些类构成了图 8.2 中应用程序驱动层的一部分。如果你的应用程序是基于 Web 的，它们可能会调用 `Selenium`、`Sahi`\
  \ 或 `WebDriver`；如果是富客户端 .NET 应用程序，则使用 `White`；如果你的应用程序有 REST API，则使用 `HTTP POST`\
  \ 或 `GET`。在命令行运行 `cucumber` 将得到如下输出：\n\n![Image](img/p0197-01.jpg)\n\n这种创建可执行规范的方法是行为驱动设计的本质。回顾一下，这个过程是：\n\
  \n- 与客户讨论故事的验收标准。\n- 按照上述可执行格式将它们记录下来。\n- 编写测试实现，仅使用领域语言访问应用程序驱动层。\n- 创建一个与被测试系统通信的应用程序驱动层。\n\
  \n### 应用程序驱动层\n\n应用程序驱动层是理解如何与你的应用程序（即被测试系统）通信的层。应用程序驱动层的 API 使用领域语言表示，并且确实可以被视为一种自己的领域特定语言。\n\
  \n* * *\n\n### 什么是领域特定语言？\n\n\n\n\n领域特定语言（DSL）是一种旨在解决特定领域内特定问题的计算机编程语言。它与通用编程语言的区别在于，它有许多无法处理的问题类，因为它设计初衷仅是为了在特定的问题区域内工作。\n\
  \nDSL 可以分为两类：内部 DSL 和外部 DSL。外部领域特定语言是在执行其内部指令之前，需要进行显式解析的语言。上一节中 Cucumber 示例中构成顶层的验收标准脚本就展示了一种外部\
  \ DSL。其他示例包括 `Ant` 和 `Maven` 的 XML 构建脚本。外部 DSL 并不需要是图灵完备的。\n\n内部 DSL 是直接用代码中表示的语言。下方的\
  \ `Java` 示例就是一个内部 DSL。`Rake` 是另一个例子。通常情况下，内部 DSL 更加强大，因为你可以调用底层语言的功能，但根据底层语言的语法，它们的可读性可能会较差。\n\
  \n在可执行规范（executable specifications）领域正在进行一些非常有趣的工作，这些工作与现代计算中的另外两个主题相交叉：意图编程（intentional\
  \ programming）和领域特定语言。你可以开始将你的测试套件，或者准确说是你的可执行规范，视为在定义应用程序的意图。你陈述这种意图的方式可以被视为一种领域特定语言，其中领域就是应用程序规范。\n\
  \n***\n\n通过设计良好的应用程序驱动层（application driver layer），可以完全放弃验收标准层，并在测试的实现中表达验收标准。以下是我们在上面在\
  \ `Cucumber` 中编写的同一个验收测试，用简单的 `JUnit` 测试表示出来。这个示例对 Dave 目前的项目进行了非常微小的调整。\n\n![Image](img/p0199-01.jpg)\n\
  \n此测试创建了一个新用户，成功注册了他们并确保他们有足够的资金进行交易。它还为他们创建了一个用于交易的新型工具。这两项活动本身都是复杂的交互，但 DSL 在某种程度上对它们进行了抽象，使得初始化此测试的任务变得像几行代码一样简单。这种方式编写的测试的关键特征是，它们将测试从实现细节中抽象出来。\n\
  \n这些测试的一个关键特征是使用别名（aliases）来表示关键值。在上面的示例中，我们创建了一个名为 `bond` 的工具和一个系统名为 `Dave` 的系统用户。应用程序驱动程序在后台执行的操作是创建真实的工具和用户，每个对象都有由应用程序生成的唯一标识符。应用程序驱动程序会在内部对这些值设置别名，这样我们就可以引用\
  \ `Dave` 或 `bond`，即使真实的用户可能被称为类似于 `testUser11778264441` 的名称。该值是随机的，并且每次运行测试时都会更改，因为每次都会创建一个新用户。\n\
  \n这有两个好处。首先，它使得验收测试之间完全独立。因此，你可以轻松地并行运行验收测试，而不必担心数据互相干扰。其次，它允许你创建测试数据。\n\n#### 如何表达你的验收标准\n\
  \n将上述 `JUnit` 中的示例验收测试与上一节中用 `Cucumber` 表达的进行对比是非常有启发性的。这两种方法都可以很好地工作，并且各自都有优缺点。这两种方法都比传统的验收测试方法有了显著改进。Jez\
  \ 在他目前的项目中使用 Cucumber 风格的方法（尽管使用的是 `Twist` 而不是 `Cucumber`），而 Dave 则直接使用 `JUnit`（如上面的示例所示）。\n\
  \n外部 DSL 方法的优势在于，你可以对验收标准进行“往返转换”（round-trip）。你不需要在跟踪工具中拥有验收标准然后在 xUnit 测试套件中重新表达它们，你的验收标准——以及你的故事——简单地*就是*你的可执行规范。然而，虽然现代工具减少了编写可执行验收标准并保持与验收测试实现同步的开销，但不可避免地仍会有一些开销。\n\
  \n\n\n\n本章的示例旨在清晰地说明将验收测试分为三层：可执行的验收标准、测试实现和应用驱动层。应用驱动层是唯一理解如何与应用程序交互的层——另外两层仅使用业务的领域语言。如果你的应用程序有\
  \ GUI，且你决定验收测试应该针对 GUI 运行，那么应用驱动层将理解如何与该 GUI 交互。你的应用驱动层中与 GUI 交互的部分被称为窗口驱动（window\
  \ driver）。\n\n窗口驱动模式的设计目的是为了让针对 GUI 运行的测试变得不再那么脆弱，它通过提供一个抽象层，减少了验收测试与被测系统 GUI 之间的耦合性。因此，它有助于保护我们的测试免受系统\
  \ GUI 变化的影响。本质上，我们编写了一个抽象层，为我们的测试伪装用户界面。所有测试都仅通过这一层与真实的 UI 交互。因此，如果 GUI 发生了变化，我们可以对窗口驱动进行相应的更改，从而保持窗口驱动的接口（因此测试本身）不变。\n\
  \nFitNesse 开源测试工具采用了非常相似的方法，允许将 Fit 固定件（fixtures）创建任何你需要测试的对象的“驱动”。这是一个非常优秀的工具，在这种背景下它发挥了巨大的作用。\n\
  \n### 图 8.3 窗口驱动模式在验收测试中的应用\n\n![Image](img/fig8_3.jpg)\n\n在实现窗口驱动模式时，你应该为 GUI 的每个部分编写等同于设备驱动。验收测试代码仅通过适当的窗口驱动与\
  \ GUI 交互。窗口驱动提供了一个抽象层，作为应用驱动层的一部分，保护你的测试代码免受 UI 细节变化的影响。当 UI 变化时，你更改窗口驱动中的代码，所有依赖于它的测试都会随之修复。窗口驱动模式如图\
  \ 8.3 所示。\n\n应用驱动与窗口驱动之间的区别在于：是窗口驱动理解如何与 GUI 交互。如果你为应用程序提供了一个新的 GUI——例如，除了 Web 界面之外还有一个富客户端——你只需要创建一个新的窗口驱动并将其插入到应用驱动中。\n\
  \n### 使用窗口驱动模式创建可维护的测试\n\n在一个非常大的项目中，我们曾选择使用一个开源 GUI 测试脚本工具。在第一个版本的开发期间，我们几乎能够跟上开发进度：我们的自动化验收测试套件正在运行，尽管它比软件版本落后了一周或两周。\n\
  \n在第二个版本中，我们的验收测试套件落后得越来越快。到该版本结束时，它落后得严重，以至于第一个版本中的测试完全无法运行——一个也没有！\n\n在第三个版本中，我们实现了窗口驱动模式，并改变了测试创建和维护过程的某些方面，最显著的是让开发者负责测试维护。到该版本结束时，我们拥有了可以运行的部署流水线，其中包括在每次成功提交（commit）后立即运行自动化测试。\n\
  \n以下是一个没有使用本章描述的任何分层结构编写的验收测试示例：\n\n![Image](img/p0203-01.jpg)\n\n以下是相同的示例重构为两个层：测试实现和窗口驱动。此示例中的\
  \ `AccountPanelDriver` 就是窗口驱动。这是拆解你测试的良好开始。\n\n![Image](img/p0203-02.jpg)\n\n我们可以看到测试语义与与其底层的\
  \ UI 交互细节之间有更清晰的划分。如果你考虑支撑此测试的代码（即窗口驱动中的代码），虽然该测试的总代码量更多，但抽象层次更高。我们能够在许多与页面交互的不同测试中复用窗口驱动，并在过程中不断完善它。\n\
  \n如果为了示例起见，业务部门决定与其基于 Web 的用户界面，我们的产品在触摸屏上的基于手势的用户界面会更有效，那么该测试的基础将保持不变。我们可以创建一个新的窗口驱动来与基于手势的\
  \ UI 交互，而不是无聊的老旧网页，将其替换为应用驱动层内部原始驱动，测试将继续运行。\n\n### 实现验收测试\n\n验收测试的实现不仅仅是分层。验收测试涉及将应用程序置于特定状态，对其执行若干操作并验证结果。验收测试必须编写为能够处理异步和超时，以避免测试不稳定（flakiness）。测试数据必须经过仔细管理。通常需要测试双胞（test\
  \ doubles）来模拟与外部系统的任何集成。这些主题是本节的主题。\n\n#### 验收测试中的状态\n\n在前一章中，我们讨论了有状态的单元测试的问题，并建议尽量减少测试对状态的依赖。对于验收测试来说，这是一个更为复杂的问题。验收测试旨在通过某种方式模拟用户与系统的交互，以运行系统并证明其符合业务需求。当用户与你的系统交互时，他们将建立并依赖于你的系统管理的信息。如果没有这种状态，你的验收测试就是意义的。但建立一个已知的良好起始状态（任何真实测试的前提），然后构建一个依赖于该状态的测试可能是困难的。\n\
  \n当我们谈论有状态的测试（stateful tests）时，我们使用了一种略写。我们使用“有状态”一词的含义是：为了测试应用程序的某些行为，测试取决于应用程序处于特定的起始状态（行为驱动开发中的“given”句）。也许应用程序需要一个具有特定权限的账户，或者一组特定的库存物品来操作。无论所需的起始状态是什么，让应用程序准备好以展示待测的行为通常是编写测试中最困难的部分。\n\
  \n虽然我们现实上无法从任何测试中消除状态，更不用说验收测试了，但关注减少测试对复杂状态的依赖是非常重要的。\n\n首先，避免获取生产数据转储来填充验收测试数据库的诱惑（尽管这在容量测试中偶尔有用）。相反，应维护一个受控的最小化集合。测试的关键方面是建立一个已知的良好起点。如果你尝试在测试环境中跟踪生产系统的状态——这种方法我们在各种组织中见过很多——你花费在让数据集工作上的时间将超过花费测试的时间。毕竟，测试的焦点应该是系统的行为，而不是数据。\n\
  \n维护一组允许你探索系统行为的最小连贯数据集。自然，这种最小起始状态应该表示为一组存储在版本控制系统中的脚本，可以在验收测试运行开始应用。理想情况下，正如我们在第\
  \ 12 章“管理数据”中所述，测试应该使用应用程序的公共 API 将其置于所需的正确状态。\n\n\n\n理想的测试应该是原子的。原子化测试意味着测试执行的顺序并不重要，这消除了难以追踪的\
  \ bug 的主要原因之一。它意味着测试可以并行运行，这对于在拥有任何规模的应用后，获取快速反馈至关重要。\n\n原子化测试会创建执行所需的所有资源，并在完成后进行清理，除了通过通过或失败的记录外，不留任何痕迹。尽管，在验收测试中实现这一点可能困难，但并非不可能。我们在处理涉及事务系统（特别是关系型数据库）的组件测试时，经常使用的一种技术是：在测试开始时建立事务，然后在测试结束时将其回滚。这样数据库就会保持在测试运行之前的状态。遗憾的是，如果你采纳了我们的另一条建议——即将验收测试视为端到端测试，那么这种方法通常是不可行的。\n\
  \n验收测试最有效的方法是利用应用程序的功能来隔离测试范围。例如，如果你的软件支持具有独立账户的多用户，请使用应用程序的功能在每次测试开始时创建一个新账户，如上一节中的示例所示。在你的应用程序驱动层中创建一些简单的测试基础设施，使创建新账户变得变得轻而易举。现在，当你的测试运行时，任何与测试关联账户的活动及产生的状态都与其他账户中发生的活动相互独立。这种方法不仅确保了测试的隔离性，而且测试了这种隔离性，特别是在你并行运行验收测试时。只有当应用程序异常到没有自然手段来隔离用例时，这种有效方法才会出现问题。\n\
  \n然而，有时在测试用例之间共享状态是不可避免的。在这种情况下，测试必须设计得非常小心。这类测试往往是脆弱的，因为它们运行在一个起点不可知的环境中。简单粗暴地说，如果你写了一个测试，向数据库写入四条记录，然后获取第三条作为下一步，那么你最好确定在你的测试开始之前没有其他人添加任何行，否则你将选取错误的记录。你还应该小心，不要在没有执行清理过程（tear-down）的情况下反复运行测试。这些测试在维护和持续运行方面非常棘手。遗憾的是，它们有时难以避免，但尽力避免它们是值得付出的努力。仔细思考如何以不同的设计测试，使其不会留下任何状态。\n\
  \n当你走到走投无路的地步，发现自己必须创建无法保证初始状态且无法清理的测试时，我们建议你专注于让此类测试具有很强的防御性。验证测试开始时的状态是否符合你的预期，如果发现任何异常，立即让测试失败。使用先置断言来保护你的测试，确保系统已准备好运行你的测试。让此类测试以相对而非绝对的方式进行运行；例如，不要写一个向集合中添加三个对象然后确认其中只有三个对象的测试，而是获取一个初始计数，并断言结果为\
  \ `x` + 3。\n\n## 进程边界、封装与测试\n\n最直接的测试，因此也是应该作为所有验收测试模范的测试，是那些不需要对系统进行特权访问即可证明系统要求的测试。自动化测试的新手意识到，为了让代码具有测试性，他们必须修改设计方法，事实确实如此。但通常，他们认为需要为代码提供许多秘密“后门”以允许确认结果，事实并非如此。正如我们在其他地方描述的，自动化测试确实会迫使你的代码更具模块化且封装得更好，但如果你是为了提高可测试性而破坏封装，那么你通常是错过了实现相同目标的更好方法。\n\
  \n在大多数情况下，你应该对“创建一个仅为了允许你验证应用程序行为的代码”这种想法保持极大的怀疑。努力避免这种特权访问，在屈协之前深思熟虑，对自己采取强硬立场——在绝对确定找不到更好的方法之前，不要向简单的选择妥协。\n\
  \n然而，有时灵灵感会枯竭，你被迫提供某种形式的后门。这些可能是允许你修改系统部分行为的调用，也许是为了返回某些关键结果，或者将该部分系统切换到特定的测试模式。如果你确实没有其他选择，这种方法是行得通的。但是，我们建议仅对系统外部的组件这样做，将负责与外部组件交互的代码替换为可控的存根（stub）或其他测试双胞（test\
  \ double）。我们建议你永远不要为部署到生产环境的远程系统组件添加仅用于测试的接口。\n\n### 使用存根模拟外部系统\n\n我们遇到的这个问题最显眼的例子是，我们在测试中途遇到了进程边界。我们想要编写一个验收测试，涉及与代表另一个系统网关的服务通信，该系统在我们的测试范围之外。然而，我们需要确保系统在这一点之前是正常工作的。我们还需要确保系统对该通信中的任何问题做出恰当响应。\n\
  \n我们已经有一个代表外部系统的存根，我们的服务与之交互。最后，我们实现了一个 `what-to-do-on-the-next-call` 方法，我们的测试可以使用该方法将存根切换到等待模式，触发它按照我们的定义对下一次调用做出响应。\n\
  \n作为特殊接口的替代方案，你可以提供对“魔法”数据值做出响应的测试组件。再次，这种策略是有效的，但应该留给不会作为生产系统一部分部署的组件。这对于测试双胞来说是一个非常实用的策略。\n\
  \n这两种策略往往会导致维护成本高昂且经常需要调整的测试。真正的解决方案是尽可能在范围内避免此类妥协，并依赖系统本身的实际行为来验证任何测试的成功完成。只有在你用尽了其他选择时，才保留这些策略。\n\
  \n## 管理异步性与超时\n\n测试异步系统带来了其独特的一系列问题。对于单元测试，你应该避免测试范围内的任何异步性，或者说避免跨越测试边界的异步性。后者可能导致难以发现的间歇性测试失败。对于验收测试，取决于应用程序的性质，异步性可能是无法避免的。这个问题不仅可能出现在显式的异步系统中，也可能出现在任何使用线程或事务的系统中。在这些系统中，你发出的调用可能需要等待另一个线程或事务完成。\n\
  \n问题归结为：测试是失败了，还是我们只是在等待结果到达？我们发现最有效的策略是构建固件（fixtures），将测试本身与此问题隔离开。技巧在于，对于测试本身而言，使体现测试的事件序列*看起来*是同步的。这通过在同步调用之后隔离异步性来实现。\n\
  \n\n\n想象一下，我们正在构建一个收集文件并存储它们的系统。我们的系统有一个收件箱（文件系统上的一个位置），它会定期轮询该位置。当它在那里发现文件时，会安全地将其存储，然后向某人发送电子邮件告知新文件已到达。\n\
  \n当我们编写在提交时运行的单元测试时，可以隔离地测试系统的每个组件，断言每个组件在这些使用测试双子（test doubles）的小对象簇中与其邻居的交互是恰当。此类测试实际上不会触碰文件系统，而是将使用测试双子来模拟文件系统。如果在测试过程中遇到了“时间”这个概念——因为轮询的存在，我们确实会遇到——我们会伪造时钟，或者直接强制让轮询发生在“现在”。\n\
  \n对于我们的验收测试，我们需要知道更多信息。我们需要知道部署是否有效生效、我们是否能够配置轮询机制、我们的电子邮件服务器是否配置正确，以及我们所有的代码是否能够无缝地协同工作。\n\
  \n我们的测试在这里面临两个问题：系统在检查是否有新文件到达之前所等待的轮询间隔，以及邮件到达所需的时间。\n\n我们理想测试的概要（使用 C# 语法）看起来像这样：\n\
  \n![Image](img/p0208-01.jpg)\n\n然而，如果我们只是简单地编写此测试代码，仅在测试运行到那行代码时检查我们是否收到了预期的邮件，那么我们的测试几乎会快于应用程序。在我们检查邮件是否到达时，邮件还没有被收到。我们的测试将失败，尽管实际上这只是我们到达断言的速度比应用程序发送邮件的速度快。\n\
  \n![Image](img/p0208-02.jpg)\n\n相反，我们的测试必须暂停，在决定失败之前给应用程序一个追上的机会。\n\n![Image](img/p0208-03.jpg)\n\
  \n如果我们将 `DELAY_PERIOD` 设置得足够长，那么它就能作为一个有效的测试正常工作。\n\n这种方法的缺点是，这些 `DELAY_PERIOD`s\
  \ 会迅速累积。我们曾经通过将这种策略改为稍微精细化的策略，将验收测试的时间从 2 小时缩短到了 40 分钟。\n\n新策略主要基于两个想法：一个是轮询结果，另一个是监控中间事件作为测试的闸门。我们不再简单地等待最可接受的时间直到超时，而是实现了一些重试。\n\
  \n![Image](img/p0209-01.jpg)\n\n在这个示例中，我们保留了短暂的暂停，因为否则我们将浪费宝贵的 CPU 周期来检查邮件，而这些周期本可以用于传入的邮件。但即使有了这个\
  \ `SMALL_PAUSE`，此测试也比之前的版本高效得多，只要 `SMALL_PAUSE` 相比 `DELAY_PERIOD` 非常小（通常小两个或更多数量级）。\n\
  \n最后的增强更具机会性，很大程度上取决于你应用程序的性质。我们发现，在大量使用异步的系统中，通常会有其他可以帮助的事情。在我们的示例中，想象我们有一个处理入站邮件的服务。当邮件到达时，它会生成相应的事件。如果我们等待该事件而不是轮询邮件的到达，我们的测试就会变得更快（尽管更复杂）。\n\
  \n![Image](img/p0209-02.jpg)\n\n对于任何 `ConfirmEmailWasRecived` 的客户端来说，在我们在这里展示的所有版本中，确认步骤看起来都是同步的。这使得使用它的高层测试编写起来简单得多，特别是当测试中有紧随此检查的动作时。这种代码应该存在于应用程序驱动层，以便供许多不同的测试用例复用。它的相对复杂度是值得的，因为它可以被调整得既高效又完全可靠，从而让所有依赖它的测试也变得调优且可靠。\n\
  \n## 使用测试双子\n\n验收测试依赖于在类生产环境中执行自动化测试的能力。然而，此类测试环境的一个至关重要的属性是能够成功支持自动化测试。自动化验收测试不等同于用户验收测试。其区别之一是，自动化验收测试不应该在包含与所有外部系统集成的环境中运行。相反，你的验收测试应该专注于提供一个可控的环境，被测系统可以在其中运行。在此语境下，“可控”意味着你能够为我们的测试创建正确的初始状态。与真实的外部系统集成会剥夺我们这样做的能力。\n\
  \n你应该努力尽量减少验收测试期间外部依赖的影响。然而，我们的目标是尽早发现问题，为了实现这一点，我们的目标是持续集成系统。显然，这里存在一种张力。与外部系统的集成很难正确处理，是问题的常见根源。这意味着仔细且有效地测试此类集成点至关重要。问题在于，如果你将外部系统本身纳入验收测试的范围内，你对系统及其初始状态的控制就会减少。此外，自动化测试的强度可能会在项目生命期的早期对那些外部系统施加巨大且意外的负载，这比负责那些系统的人预期的要早。\n\
  \n图 8.4 外部系统的测试双子\n\n![Image](img/fig8_4.jpg)\n\n这种平衡行为通常会导致团队作为其测试策略的一部分建立某种妥协。与你开发过程中的任何其他方面一样，很少有“正确”的答案，项目也会各不相同。我们的策略是双管齐下的：我们通常创建代表与系统交互的所有外部系统连接的测试双子，如图\
  \ 8.4)。\n\n\n\n\n此组件代表了与外部系统的接口。无论暴露的接口属于外部系统本身，还是你代码库的一部分，该接口都代表了你需要证明其有效的契约。该接口需要从你的系统与它交互的角度，以及作为与外部系统通信的真实端点，这两个方面来通过证明。存根（Stubs）允许你断言你的系统与远程系统的交互是正确的。我们接下来描述的集成测试（Integration\
  \ tests）则允许你断言外部系统对你的交互行为符合预期。从这个意义上说，测试双（test doubles）和交互测试共同工作，以消除错误的可能。\n\n##\
  \ 测试外部集成点\n\n由于各种原因，指向外部系统的集成点是问题的常见来源。你团队正在编写的代码可能会某些与成功通信相关的内容。你的系统与外部系统之间共享的数据结构变化、消息交换频率的变化，或者地址机制配置的更改——任何类型的差异都可能成为问题。通信另一端的代码也发生变化。\n\
  \n我们编写用于断言此类集成点行为的测试应该关注可能出现的问题，这些问题在很大程度上取决于集成的性质以及外部系统所处的生命周期阶段。如果外部系统已经趋成熟并处于生产环境中，那么问题将与其处于活跃开发阶段时你面临的问题不同。这些因素在某种程度上决定了我们在何时以及何时运行这些测试。\n\
  \n如果外部系统处于活跃开发阶段，两个系统之间接口的性质可能会发生变化。架构（Schemas）、契约等可能会改变，或者更微妙地，你交换的信息内容的方式可能会发生变化。这种场景需要定期进行细致测试，以识别两个团队产生分歧点。根据我们的经验，大多数集成中通常会有几个明显的场景可以模拟。我们建议你用少量的测试来覆盖这些明显的场景。这种策略会漏掉一些问题。我们的方法是在发现破坏性变化时通过编写测试来捕获每种情况来解决问题。随着时间的推移，我们为每个集成点构建一小套测试套件，能够快速地捕获大多数问题。这种策略并非完美，但在这种情况下尝试获得完美的覆盖通常非常困难，且投入与回报的比例会迅速递减。\n\
  \n测试的范围应该始终限制在你的系统与外部系统之间的特定交互上。它们不应该旨在完全测试外部系统的接口。再次，这基于边收益递减法则：如果你不在乎某个字段是否存在，就不要对它进行测试。此外，请遵循我们在第\
  \ 96 页“集成测试”部分中提供的指南。\n\n正如我们所说的，运行集成测试的时机是不固定的。它随项目而异，也随集成点而异。偶尔，集成点可以明智地在与验收测试的同时运行，但大多数情况下情况并非如此。仔细考虑你对外部系统提出的要求。记住，你的测试每天会运行多次。如果与外部系统的每一次交互测试都会导致真实的交互，你的自动化测试可能会对外部系统产生类似生产环境的负载。这并不总是受欢迎的，特别是当你的外部系统提供者本身没有进行很多自动化测试时。\n\
  \n缓解这一问题的一种策略是实现你的测试套件，使其不要在每次运行验收测试时运行，而是可能每天一次或每周一次。你可以将这些测试作为部署流水线中的独立阶段运行，或者作为容量测试阶段的一部分。\n\
  \n### 验收测试阶段\n\n一旦你拥有一了一套验收测试，它们就需要作为部署流水线的一部分来运行。规则是，验收测试套件应该针对每一个通过提交测试（commit\
  \ tests）的构建运行。以下是一些适用于运行验收测试的实践。\n\n验收测试失败的构建将无法部署。在部署流水线模式中，只有通过此阶段的发布候选版本才能部署到后续阶段。后期的流水线阶段通常被视为人为判断的问题：如果发布候选版本没有通过容量测试，在大多数项目中，某人会决定失败是否足够重要，足以让该版本的旅程到此结束，还是在存在性能问题的情况下允许其继续。验收测试不留任何通融的余地。通过意味着发布候选版本可以继续，失败意味着它永远无法继续。\n\
  \n由于这种硬性规定，验收测试关口是一个极关重要的阈值，如果你的开发过程要顺利进行，就必须对其视如珍归。保持运行复杂的验收测试将消耗你开发团队的时间。然而，这种成本是以投资的形式存在的，根据我们的经验，这种投资将通过减少维护成本、允许你对应用程序进行广泛更改的保护以及显著提高质量而获得数倍回报。这遵循了我们“在过程中尽早痛苦（bringing\
  \ the pain forward）”的通用原则。我们从经验中知道，如果没有优秀的自动化验收测试覆盖，就会发生三种情况之一：要么在认为已经完成的流程末尾花费大量时间尝试寻找并修复错误，要么在手动验收和回归测试上花费大量金钱，要么你最终发布了低质量的软件。\n\
  \n*** *\n\n### 记录验收测试以进行调试\n\n自动化 UI 测试的一个常见问题是理解测试究竟为什么会失败。由于这些测试必然是极高层级的，因此有许多潜在的失败点。有时这些失败可能与项目完全无关。在其他时候，测试套件早期可能在不同的窗口或对话框中发生失败，导致后续出现问题。通常，发现发生什么错误的唯一方法是重新运行测试并观察其执行过程。\n\
  \n在某个项目中，我们发现了一种让这变得简单得的方法。在测试开始之前，我们使用名为 `Vnc2swf` 的开源工具在测试机器上启动屏幕录制。测试结束后，如果发生失败，我们将视频作为产物发布。只有在创建了视频后，我们才会让构建失败。这样调试验收测试就变得非常简单。\n\
  \n在某个阶段，我们发现有人登录了机器并查看了任务管理器，可能是为了检查内存使用情况或性能。他们留下了窗口，由于这是一个模态窗口，它遮挡了应用程序窗口。因此，UI\
  \ 测试无法点击某些按钮。构建页面报告的错误信息是“找不到按钮‘X’”——但视频揭示了真实原因。\n\n\n\n\n\n很难列举所有让一个项目值得在自动化验收测试上投入如此资金的理由。对于我们通常参与的类型项目，我们的默认做法是：自动化验收测试和部署流水线的实现通常是一个合理的起点。对于周期极短且团队规模较小（也许四名或更少开发人员）的项目，这可能大材小用——你可能只需要作为单阶段\
  \ CI 过程的一部分运行几个端到端测试。但对于任何比这规模更大的项目，自动化验收测试为开发者带来的业务价值是如此巨大，以至于值得投入成本。需要重复的是，大型项目都是从小项目开始的，等一个项目变得庞大时，如果不付出极其艰巨的努力，事后补齐一套完整的自动化验收测试往往为太晚了。\n\
  \n我们建议，使用由交付团队创建、拥有并维护的自动化验收测试，应该是你所有项目的默认立场。\n\n## 保持验收测试通过（Keeping Acceptance\
  \ Tests Green）\n\n由于运行一个有效的验收测试套件需要花费时间，因此在部署流水线的后期运行它们通常是合理的。这样做的问题在于，如果开发者没有坐在那里等待提交测试（commit\
  \ tests）通过的话，那么他们往往会忽略验收测试的失败。\n\n这种低效率是我们为了部署流水线而接受的权衡——流水线允许我们在提交测试关口非常快速地捕获大多数失败，同时对应用程序保持良好的自动化测试覆盖。让我们快速解决这个反模式：归根结底，这是一个纪律问题，整个交付团队都负责保持验收测试通过。\n\
  \n当一个验收测试失败时，团队需要停止并立即对问题进行分检。这是一个脆弱的测试、环境配置不当、由于应用程序更改而不再生效的假设，还是一个真实的失败？然后，有人需要立即采取行动让测试重新通过。\n\
  \n******\n\n## 谁拥有验收测试的所有权？（Who Owns Acceptance Tests?）\n\n有一段时间，我们采用的是一种相当传统的模型，即验收测试是测试团队的责任。这种策略被证明非常麻烦，特别是在大型项目中。测试团队始终处于开发链的末端，因此我们的验收测试大部分时间里都处于失败状态。\n\
  \n我们的开发团队会埋头工作，进行更改，从而在没有意识到其更改影响的情况下破坏大片验收测试。测试团队会在流程的较晚阶段发现这些更改，即在代码已经开发并提交之后。由于测试团队有如此多的自动化测试需要修复，需要一些时间才能轮到修复最近的故障，这意味着开发者通常已经转向了其他任务，因此并不是修复该问题的理想人。测试团队迅速陷入了需要修复的测试泥潭中，以及要为开发者正在实现的新需求实现新测试的工作压力中。\n\
  \n这不是一个微不足道的问题。验收测试通常是复杂的。确定验收测试失败的根源通常需要时间。正是由于这一系列情况促使我们尝试了第一次流水线化构建（pipelined\
  \ build）。我们希望缩短代码更改（暴露问题）到有人发现验收测试存在问题之间的时间间隔。\n\n我们更改了自动化验收测试的所有权。我们不再让测试团队负责它们的开发和维护，而是让整个交付团队（包括开发者和测试人员）共同负责。这带来了许多积极益处：它让开发者专注于实现需求的验收标准。它让他们能更直接地意识到他们所做更改的影响，因为他们现在负责跟踪验收测试构建。这也意味着，既然开发者现在开始从验收测试的角度思考问题，他们往往能更成功地预测其新更改可能会影响验收测试套件的哪些区域，从而更好地针对性开展工作。\n\
  \n为了保持你的验收测试正常运行，并让开发者专注于应用程序的行为，让验收测试由整个交付团队拥有和维护，而不是由一个独立的测试团队，是非常重要的。\n\n***\n\
  \n## 如果让你的验收测试腐化会怎样？（What happens if you let your acceptance tests rot?）\n\n随着发布时间的临，你会尝试让验收测试变绿（通过），以便你对软件的质量充满信心。在检查验收测试时，你发现极难区分：是因为验收标准发生了变化而失败的测试，是因为代码已重构且该测试之前与实现耦合过紧密而失败的测试，还是因为应用程序的行为现在错了而失败的测试。在这些情况下，测试通常会被删除或忽略，因为没有足够的时间进行必要的“代码考古学”来查明失败原因。你最终陷入了持续集成本该解决的那种境地——在最后阶段忙乱让一切运行起来，但完全不知道需要多长时间，而且对代码的实际状态缺乏清晰认知。\n\
  \n尽快修复验收测试的失败至关重要，否则该套件无法提供任何真实价值。最重要的一步是让失败可见。我们尝试过各种方法，例如由构建大师（build masters）追踪最可能导致失败的人员、向可能的嫌疑人发送邮件、甚至站起来大喊：“谁在修复验收测试构建？”（这效果非常好）。我们发现最有效的方法是通过小花招，例如熔岩灯、大型构建显示器，或者[`#ch03.html_page63`]中“额外点缀（Bells\
  \ and Whistles）”部分描述的其他技术之一。以下是一些保持你的测试良好状态的方法。\n\n### 识别可能的嫌疑人（Identify Likely\
  \ Culprits）\n\n确定什么导致了特定的验收测试失败，不像单元测试那样简单。单元测试是由单个开发者或一对对开发者的单次提交触发的。如果你提交了某些内容而构建在之前运行良好的情况下现在失败了，那么毫无疑问，是你破坏了它。\n\
  \n然而，由于两次验收测试运行之间可能存在多次提交，构建被破坏的机会更多。设计你的构建流水线，能够追踪哪些更改与每次验收测试运行相关，是一个非常有价值的步骤。一些现代持续集成系统可以轻松跟踪流水线构建的整个周期，从而使解决这个问题变得相对直接。\n\
  \n***\n\n#### 部署测试（Deployment Tests）\n\n\n\n\n正如我们所描述的，良好的验收测试重点在于证明已满足了特定用户故事或需求的特定验收标准。最佳验收测试是**原子的**——也就是说，它们会创建自己的起始条件并在结束时进行清理。这些理想的测试尽可能地减少了对状态的依赖，并且仅通过公开的通道测试应用程序，而不通过任何后门访问。然而，某些类型的测试虽然在这一标准上不符合要求，但在验收测试关中运行它们仍然非常有价值。\n\
  \n当我们运行验收测试时，我们将测试环境设计得在合理合理范围内尽可能接近预期的生产环境。如果这样做成本并不高，它们应当是完全相同的。否则，请使用虚拟化技术尽可能地模拟你的生产环境。操作系统以及你使用的任何中间件应该与生产环境保持一致，而且我们在开发环境中可能模拟或忽略的重要进程边界，在这里也定会得到体现。\n\
  \n这意味着，除了测试我们的验收标准是否已满足之外，这是我们确认**自动化部署到类生产环境是否成功**以及**部署策略有效**的最早机会。我们通常会选择运行一小少数新的烟雾测试，这些测试旨在断言我们的环境配置符合预期，并且系统各个组件之间的通信通道已正确就位并按预期工作。我们有时将这些称为基础设施测试或环境测试，但它们本质上是部署测试，旨在证明部署已成功，并为执行更具功能的验收测试建立一个已知的良好起点。\n\
  \n如往常，我们的目标是**快速失败（fail fast）**。如果验收测试构建将会失败，我们希望它尽可能快失败。出于这个原因，我们通常将部署测试视为特殊的套件。如果它们失败，我们将立即让整个验收测试阶段失败，而不会等待漫长的验收测试套件运行完成。这在测试异步系统尤为重要，在异步系统中，如果你的基础设施没有正确设置，你的测试将在每个点都执行到最大超时。我们在其中一个项目中，这种失败模式曾导致一次验收测试运行了超过\
  \ 30 小时才全面失败——而该测试运行在正常情况下大约在 90 分钟内即可完成。\n\n这种优先的、快速失败的测试集也是存放任何间性测试或定期捕获常见问题的测试的方便之处。正如我们之前说的，你应该寻找可以捕获常见失败模式的提交级测试，但有时在思考如何捕获某个常见但难以测试的问题时，这种策略可以作为一种过渡方案。\n\
  \n***\n\n### 豚鼻点名 (The Aardvark Roll Call)\n\n在我们其中一个项目中，我们使用了基于 `JUnit` 的验收测试。我们对哪些测试套件何时运行的唯一方便控制就是套件的名称——它们是字母顺序排序的。我们建立了一个环境测试集合，并称之为我们的“豚鼻点名测试”（aardvark\
  \ roll call tests），以确保它们在任何其他套件之前运行。\n\n在开始依赖它们之前，永远记住对你的豚鼻进行一次点名。\n\n***\n\n###\
  \ 验收测试性能\n\n由于我们的自动化验收测试是为了断言系统为用户交付了预期价值，因此性能并不是我们首要考虑的问题。创建部署流水线的原因之一是，验收测试运行时间通常太长，无法在提交周期中等待其结果。有些人从哲学角度上反对这一观点，认为性能不佳的验收测试套件是验收测试套件维护不善的症状。让我们明确一下：我们认为不断维护你的验收测试套件以保持其良好的构和连贯性是很重要的，但最终拥有一个全面的自动化测试套件比一个运行在十分钟内完成的套件更重要。\n\
  \n验收测试必须断言系统的行为。它们必须尽可能从外部用户的视角来看此，而不仅仅是通过测试其内部某些隐藏层的行为。这自动意味着即使对于相对简单的系统也会产生性能开销。在我们甚至考虑运行单个测试的时间之前，系统及其所有适当的基础设施必须经过部署、配置、启动和停止。\n\
  \n然而，一旦你开始走实现部署流水线的道路，快速失败系统和快速反馈循环就会显示出它们的价值。从引入问题点到发现问题点之间的时间越长，寻找问题源头并修复它就越困难。通常情况下，验收测试套件需要几个小时才能完成，而不是几分钟。这无疑可以可以接受的状态；许多项目在持续数小时的验收测试阶段运行得良好。但你可以变得更高效。有一系列技术可以通缩短从验收测试阶段获得结果的时间来提高团队的整体效率。\n\
  \n#### 重构常见任务\n\n显而易见的第一步是通过维护一个最慢测试列表来寻找“快速胜利”，并定期花一点时间在这些测试上，寻找让它们更高效的方法。这与我们建议管理单元测试的策略完全相同。\n\
  \n更进一步一步是寻找常见模式，特别是在测试设置中。通常情况下，由于其性质，验收测试比单元测试具有更多的状态。由于我们建议对验收测试采用端到端的方法并尽可能地减少共享状态，这意味着每个验收测试都应该设置自己的起始条件。通常，此类测试设置中的特定步骤在许多测试中是相同的，因此值得花额外的时间确保这些步骤是高效的。如果有一个公共的\
  \ `API` 可以用来替代通过 `UI` 执行此类设置，那么将是理想的。有时，用“种子数据”预填充应用程序，或使用进入应用程序的某些后门向其填充测试数据，这是一种有效的方法，但你应该对此类后门保持某种怀疑态度，因为这种测试数据很容易与应用程序正常运行产生的数据不一致，从而导致后续测试的正确性失效。\n\
  \n无论机制如何，通过创建测试辅助类来重构测试，以确保它们执行常见任务的代码是一致的，是提高测试性能和可靠性的重要一步。\n\n#### 共享昂贵资源\n\n\
  在前面的章节中，我们已经描述了一些在提交阶段测试中实现合适初始状态的技术。这些技术可以改进到验收测试，但验收测试的黑盒属性排除了一些选项。\n\n解决这个问题的直接方法是在测试开始时创建一个标准的空白实例，并在结束时将其丢弃。然后测试完全负责为该实例填充所需的任何启动数据。这种方法简单且非常可靠，具有价值的特性：每个测试都从一个已知的、完全可的起点开始。遗憾的是，对于我们创建的大多数系统，这样做也非常慢，因为对于不是简单的软件系统，清除任何状态并启动应用程序本身就需要大量时间。\n\
  \n\n\n\n因此，折中是很有必要的。我们需要决定哪些资源将在测试之间共享，而哪些资源将在单个测试的上下文中进行管理。通常，对于大多数基于服务器的应用程序，可以从共享系统本身的实例开始。在验收测试运行的开始时，为被测系统创建一个干净的运行实例，针对该实例运行所有验收测试，并在结束时将其关闭。根据被测系统的性质，有时还有其他耗时较资源可以进行优化，以使整个验收测试套件运行得更快。\n\
  \n## 加快 Selenium 测试\n\n在 Dave 目前的项目中，他使用优秀的开源工具 `Selenium` 对 Web 应用进行测试。他使用 `Selenium`\
  \ 远程调用（remoting），并在本章之前描述的 DSL 技术将验收测试编写为 `JUnit` 测试，这些 DSL 建立在窗口驱动程序（window drivers）层之上。起初，这些窗口驱动程序根据需要启动和停止\
  \ `Selenium` 实例以及测试浏览器。这样做既方便又健壮且可靠，但速度很慢。\n\nDave 可以修改代码，在测试之间共享运行中的 `Selenium`\
  \ 实例和浏览器。这将使代码变得复杂一些，并可能会话状态（session state）上产生一些复杂性，但最终可以作为加速长达三小时验收测试构建的选项。\n\n\
  相反，Dave 最终选择了不同的策略：并行化验收测试并在计算网格（compute grid）上运行。后来，他优化了每个测试客户端，使其运行自己的 `Selenium`\
  \ 实例，正如下一节所述。\n\n## 并行测试\n\n当你的验收测试的隔离性良好时，另一种加速方法就出现了：并行运行测试。对于多用户、基于服务器的系统，这是一个显而易见的步骤。如果你可以将测试划分，使得它们之间没有交互的风险，那么在单个系统实例上并行运行测试将显著缩短整个验收测试阶段的时间。\n\
  \n## 使用计算网格\n\n对于非多用户系统、对于本身成本较高的测试，或对于需要模拟大量并发用户的测试，使用计算网格具有巨大的益处。与虚拟服务器结合使用，这种方法变得极其灵活且可扩展性。在极限情况下，你可以为每个测试分配自己的主机，这样验收测试套件的耗时将仅取决于最慢的那个测试。\n\
  \n在实践中，更受限的分配策略通常更有意义。该领域的某些厂商没有忽视这一优势。大多数现代 CI 服务器都提供管理测试服务器网格的功能，专门用于此目的。如果你在使用\
  \ `Selenium`，另一种替代方案是使用开源的 `Selenium Grid`，它允许使用 `Selenium` 远程调用编写的未经修改的验收测试在计算网格上并行执行。\n\
  \n## 使用云计算进行验收测试\n\nDave 的项目之一随着时间的推移，其验收测试环境变得越来越复杂。我们开始使用基于 `Java` 编写的 `JUnit`\
  \ 验收测试，并通过 `Selenium` 远程调用与我们的 Web 应用进行交互。这效果非常好，但随着添加了越来越多的测试，运行验收测试套件的时间不断增加。\n\
  \n我们从常规的优化方法开始，即识别并重构验收测试中的常见模式。我们最终得到了一些非常有用的辅助类，这些类抽象并简化了我们的大部分测试设置。这在某种程度上提高了性能，但主要提高了我们在一个难以测试的、高度异步的应用程序上的测试可靠性。\n\
  \n我们的应用程序有一个公共 API，还有几个不同的 Web 应用，这些 Web 应用通过 API 与后端系统进行交互。因此，我们做的下一次优化是将 API 测试分离出来，并让它们在\
  \ UI 测试之前优先运行。如果 API 验收测试套件（其运行速度远快于 UI 测试）失败，我们立即在该处停止验收测试。这让我们获得了更快的失败反馈，并提高了我们发现低级错误并快速修复它们的能力。\n\
  \n尽管如此，随着测试的增加，我们的验收时间仍然在攀升。\n\n我们的下一步是对测试进行一些粗粗粒度的并行运行。我们将它们分为几批。为了简单起见，我们按照字母顺序组织这些组。然后，我们在开发环境的单独虚拟机上运行了这两批测试，每批测试都有它们自己的应用程序实例。到此时，我们已经是开发环境中虚拟化的深度用户，程度已至于我们所有的服务器（包括开发和生产环境）都是虚拟的。\n\
  \n这一下缩减了一半我们的验收测试时间，我们可以以很小的配置开销轻松扩展这种方法。这种方法的明显优势是比全并行运行需要更少的测试隔离。每个部分验收测试套件都可以有自己独特的应用程序实例；在每个套件的范围内，测试像以前一样串行运行。这种优势的代价是需要的额外主机数量（无论是虚拟的还是物理的）要等于部分验收测试套件的数量。\n\
  \n图 8.5 使用计算网格进行验收测试的特定示例\n\n![Image](img/fig8_5.jpg)\n\n然而，在这一点我们决定稍微改变策略。我们切换到使用\
  \ `Amazon EC2` 计算云，以便能够轻松访问更广泛的可扩展性。图 8.5 显示了我们的测试虚拟机逻辑结构的图。一组虚拟机托管在公司内部；另一组运行与被测系统交互的模拟客户端分布在\
  \ `Amazon EC2` 云中。\n\n## 总结\n\n使用验收测试是提高开发流程有效性的重要补充。它能够将交付团队所有成员的注意力集中在真正的事情上：用户从系统中需要的行为。\n\
  \n自动化验收测试通常比单元测试复杂。它们需要更多时间来维护，而且由于修复失败到验收测试通过之间固有的延迟，它们在生命周期内花费故障的时间可能比单元测试更多。然而，当从用户角度保证系统行为时，它们对于任何任何复杂性的应用程序在生命期间出现的回归问题提供了无价的防御。\n\
  \n由于以任何有意义的方式衡量一个软件项目相对于另一个极其困难甚至不可能，这使得我们无法提供任何数据来支持我们的断言——使用自动化验收测试将获得数倍回报。我们只能向你保证，尽管在许多项目中保持验收测试运行是艰辛的工作，并让我们暴露了一些复杂的问题，但我们从未后悔过使用它们。事实上，它们通过提供安全更改系统大部分部分的能力经常拯救了我们。我们仍然坚信，这种测试在开发团队内部鼓励的关注是成功软件交付的强力因素。我们建议你尝试采用本章描述的对验收测试的关注，并亲眼看看是否值得。\n\
  \n\n\n\n我们对软件行业的经验是，手动测试是常态，并且往往是团队采用的唯一测试形式。我们发现，手动测试的成本高得惊人，而且单凭它很难足以确保结果的高质量。当然，手动测试有其用武之地：探索性测试、可用性测试、用户验收测试（UAT）以及功能演示。但人类根本无法有效地处理手动回归测试所要求的那些枯燥、重复但复杂的任务——至少在不感到痛苦的情况下做不到这一点。低质量软件是这种低质量流程的必然结果。\n\
  \n近年来，对单元测试关注的增加帮助提升了一些团队的水平。这是从仅依赖手动测试中迈出的重要的一步，但根据我们的经验，它仍然可能导致代码无法满足用户的需求。单元测试并不是以业务为核心的。我们认为，采用由验收标准驱动的测试代表了进一步向前迈出的一步，具体体现在：\n\
  \n*   增加对软件适用性的信心\n*   为系统的大规模变动提供保护\n*   通过全面的自动化回归测试显著提高质量\n*   每当发生缺陷时都能提供快速且可靠的反馈，以便立即修复\n\
  *   释放测试人员，去制定测试策略、开发可执行规范，并进行探索性和可用性测试\n*   缩短周期时间并实现持续部署\n\n# 第 9 章 测试非功能性需求\n\
  \n## 引言\n\n在实现部署流水线的过程中，我们描述了自动化应用程序测试的不同方面。然而，到目前为止，我们的重点主要在测试那些通常被称为功能性需求的应用程序行为。在本章中，我们将描述测试非功能性需求的方法，特别关注容量、吞吐量性能。\n\
  \n首先，让我们消除一些术语上的混乱。我们将使用与 Michael Nygard 相同的术语。换句话之，`performance` 是处理单个事务所需时间的衡量，既可以在隔离状态下测量，也可以在负载下测量。`throughput`\
  \ 是系统在给定时间内能处理的事务数量。它总是受到系统中某些瓶颈的限制。对于给定的负载，系统在保持每个单独请求的可接受响应时间的同时能维持的最大吞吐量就是其 `capacity`。客户通常对吞吐量或容量感兴趣。在现实生活中，“性能”经常被用为一个通用术语；在本章中我们将尝试做得更加谨慎。\n\
  \n非功能性需求（NFRs）很重要，因为它们给软件项目带来了重大的交付风险。即使你清楚自己的非功能性需求是什么，要做到“恰好做足够的工作来确保满足这些需求”这一平衡点也非常困难。许多系统失败是因为无法应对施加在它们身上的负载、不安全、运行太慢，或者最常见的原因——由于代码质量差而变得不可维护。有些项目失败是因为它们走向了另一个极端，过度担心\
  \ NFRs，导致开发过程太慢，或者系统变得如此复杂且过度设计，以至于没有人能想出如何高效或恰当地进行开发。\n\n因此，在许多方面，将需求划分为功能性和非功能性是人为的划分。可用性、容量、安全性和可维护性等非功能性需求与功能性需求一样，同样重要且有价值，并且它们对系统的运行至关重要。这个名称具有误导性——人们曾建议过替代方案，如“跨功能需求”和“系统特性”——根据我们的经验，通常处理这些需求的方法很少运作良好。项目的利益相关者应该能够做出优先级决策：是实现允许系统接受信用卡支付的功能，还是实现允许\
  \ 1000 个并发用户访问的功能。其中一个可能比另一个对业务更有真正的价值。\n\n在项目开始时识别哪些非功能性需求是关重要的。然后，团队需要找到一种衡量它们的方法，并将对它们的定期测试纳入交付计划，并且在适当的情况下纳入部署流水线。我们在本章开始开始讨论对非功能性需求的分析。然后我们讨论如何开发应用程序以满足其容量需求。接下来，我们将涵盖如何衡量容量以及如何创建一个进行测量的环境。最后，我们将讨论如何从自动化验收测试套件创建容量测试的策略，以及将非功能测试纳入部署流水线的策略。\n\
  \n## 管理非功能性需求\n\n从某种意义上说，非功能性需求（NFRs）与其他任何需求相同：它们可以具有真实的业务价值。在另一个意义上，它们是不同的，因为它们倾向于跨越其他需求的边界。许多\
  \ NFRs 的横跨性质使得它们在分析和实现方面都难以处理。\n\n将系统的非功能性需求与功能性需求区别对待的困难之处在于，这很容易让它们在项目计划中忽略，或者对其分析给予足够的关注。这可能是灾难性的，因为\
  \ NFRs 是项目风险的常见来源。在交付过程后期发现应用程序由于基础安全漏洞或性能极差而无法适用，这种情况屡见不鲜——并可能导致项目延期甚至被取消。\n\n\
  在实现方面，NFRs 是复杂的，因为它们通常对系统架构有很强的影响。例如，任何要求高性能的系统都不应涉及跨越多个层的请求。由于系统架构在交付过程后期很难更改，因此在项目开始时考虑非功能性需求至关重要。这意味着在前期进行足够的分析，以便对系统选择何种架构做出明智的决策。\n\
  \n此外，NFRs 倾向于以无帮助的方式相互作用：非常安全的系统往往会牺牲易用性；非常灵活的系统往往会牺牲性能，以此此类推。我们的观点是，虽然在理想世界中每个人都希望他们的系统既安全、高性能、极度灵活、极易扩展、易用、易支持且易开发和维护，但现实中每一种特性都有代价。每种架构都涉及到非功能性需求之间的权衡——这就是软件工程学院的架构权衡分析方法（ATAM）的设计目的，该方法通过对\
  \ NFRs（称为“质量属性”）进行深入分析，帮助团队决定合适的架构。\n\n总之，在项目开始时，所有参与交付的人员——开发人员、运维人员、测试人员和客户——都需要思考应用程序的\
  \ NFRs，以及它们对系统架构、项目进度、测试策略和总体成本的影响。\n\n### 分析非功能性需求\n\n\n\n\n\n对于一个正在进行的项目，我们有时会将非功能性需求（NFRs）作为功能性用户故事的常规验收标准，前提是我们不预见到满足这些需求需要投入大量的额外精力。但这种管理方式往往是笨拙且低效的。相反，为非功能性需求创建特定的用户故事或任务集通常更有意义，特别是在项目初期。由于我们的目标是尽可能地减少我们必须处理跨越性关注点（crosscutting\
  \ concerns）的程度，因此需要结合这两种方法——既创建特定任务来管理非功能需求，又在其他需求中添加非功能验收标准。\n\n例如，管理如可审计性（auditability）等\
  \ NFR 的一种方法是规定“与系统的所有重要交互都应经过审计”之类的要求，并可能为涉及需要审计的交互的故事制定一套添加相关验收标准的策略。另一种方法是从审计者的角度来收集需求。该角色的用户想看到什么？我们只需描述审计员对他们想看到的每份报告的需求即可。这样，审计就不再是一个跨越性的非功能性需求；而是被视为与其他任何其他需求相同的对待，以便能够与其他需求同等水平的测试和优先级排序。\n\
  \n容量（capacity）等特性也是如此。将你对系统的期望以量化的故事形式定义是有意义的，并指定足够的细节，以便你可以进行成本效益分析并据此进行优先级排序。根据我们的经验，这也倾向于使需求得到更高效的管理，从而让用户和客户更满意。对于大多数常见的非功能需求类别：安全性（security）、审计性、可审计性、可配置性等，这种策略可以让你走得很远。\n\
  \n在分析 NFR 时，提供合理程度的细节至关重要。仅仅说响应时间要求“越快越好”是不够的。“越快越好”对于合理投入的精力或预算没有上限。“越快越好”是指要仔细考虑缓存的方式和内容，还是意味着像\
  \ Apple 为 iPad 那样自己制造 CPU？所有需求（无论是否是功能性的）都必须分配一个值，以便对其进行估算和排序。这种方法迫使团队去思考开发预算花在哪里最划算。\n\
  \n许多项目面临着应用程序验收标准不够特别明确的问题。它们会有一些看似定义良好的陈述，例如“所有用户交互的响应时间都将在两秒内”或“系统每小时将处理 80,000\
  \ 次交易”。此类定义对于我们的需求来说太笼统了。关于“应用性能”的模糊辞藻通常被用作描述性能需求、易用性需求以及许多要求的简写。如果我们声明应用程序响应时间应在两秒以内，这指的是在所有情况下都是吗？如果我们的其中一个数据中心故障，我们仍然需要满足两秒的阈值吗？该阈值对于很少使用的交互仍然有效吗，还是仅针对常用交互？当我们说两秒时，是指交互成功完成所需的两秒，还是指在用户收到某种反馈之前的两秒？如果发生错误，我们需要在两秒内返回错误消息吗，还是说只针对成功案例？当系统处于压力下、处理峰值负载或处于平均响应时间时，是否需要满足两秒的要求？\n\
  \n性能需求的另一个常见误用是将其作为描述系统易用性的偷懒方式。当许多人说“两秒内响应”时，他们通常的意思是“我不想坐在电脑前没有任何反馈地坐太久”。易用性问题在被识别为易用性问题时处理最好，而不是伪装成性能需求。\n\
  \n### 针对容量的编程\n\n分析不当的非功能需求的问题在于，它们往往会限制思维，并经常导致过度设计和不恰的优化。花费大量时间编写“高性能”代码是太容易的事情了。程序员在预测应用程序性能瓶颈在哪里方面相当糟糕。他们往往为了获得难以怀疑的性能提升，而使代码变得不必要的复杂，从而增加了维护成本。这里值得完整引用唐纳德·克努斯（Donald\
  \ Knuth）的著名格言：\n\n我们应该忘记那些微小的效率提升，比如在 97% 的时间里：过早优化是万恶恶的根源。然而，我们不应该在那个关键的 3% 中放弃我们的机会。一个优秀的程序员不会被这种推理诱导导致自满，他会明智地仔细查看关键代码；但仅在这些代码被识别之后。\n\
  \n关键短语是最后一句。在找到解决方案之前，必须识别问题的根源。在发生之前，我们需要知道是否真的存在问题。容量测试阶段的意义在于告诉我们是否存在问题，以便我们继续修复它。不要猜；要去测量。\n\
  \n* * *\n\n### 过早优化的实例\n\n我们的项目之一涉及“增强”一个遗留系统。该系统是为数量较少的用户群编写的，由于其性能非常糟糕，使用它的人更少。对于一组交互，有必要显示源自消息队列的错误消息。错误从队列中提取并放入内存中的一个列表中。该列表在单独的线程中被异步轮询，然后转发到另一个模块，在模块中被放入第二个列表，然后再次被轮询。这种模式在消息最终显示在用户界面之前重复了七次。\n\
  \n你可能认为这是糟糕的设计——事实确实如此。但该设计背后的意图是避免性能瓶颈。异步轮询模式旨在处理负载的激增，而不会损害应用程序的整体容量能力。显然，这样做七次是做得过了了，但从理论上讲，如果负载变大，这保护应用程序并不是一个坏策略。真正的问题在于，它为一个并不存在的问题提供了一个复杂的解决方案。这种情况根本没有出现，因为消息队列从未被错误淹没。即使发生了，除非应用程序请求信息的频率过于频繁，否则它无法淹没应用程序。有人在消息队列前面发明了七个手工的队列。\n\
  \n这种对容量近乎偏执的关注是导致代码过度——因此质量低下的常见原因。设计高容量系统是困难的，但在开发过程中的错误点关注容量会使之变得更加困难。\n\n* *\
  \ *\n\n过早且过度关注优化应用程序的容量是低效的、昂贵的，而且很少能交付高性能系统。在极端情况下，它甚至可能导致整个项目无法交付。\n\n事实上，为高容量系统编写的代码在必要上比日常系统编写的代码更简单。复杂性会延迟，但大多数程序员发现很难理解这一点，更不用付诸行动了。这本书并不是关于高性能系统设计的论著，但这里是我们所用方法的大体轮——在这里呈现是为了将容量测试放在交付过程的上下文中。\n\
  \n\n\n\n\n在任何系统的设计中，性能受限的地方就会出现瓶颈。有时，这些瓶颈是容易预测的，但更多时候并非如此。在项目启动阶段，识别容量问题的常见原因并努力避免遇到这些问题是明智的。大多数现代系统执行的成本最高昂的操作就是跨网络进行通信或在磁盘上存储数据。跨进程和网络边界的通信在性能上非常昂贵，并会影响应用程序的稳定性，因此应该尽量减少此类通信。\n\
  \n编写高容量软件比其他类型的系统需要更多的纪律，并且对支持应用程序的底层硬件和软件的工作原理具有某种程度的机械共情（mechanical sympathy）。高性能是有代价的，这种额外成本必须被理解，并与性能提升带来的业务价值进行权衡。对容量的关注往往迎合技术人员的心态。它可能会激发我们最糟糕的一面，成为导致过度设计解决方案和项目成本膨胀的最可能原因。将基于系统容量特性的决策交给业务赞助人是非常关重要的。我们想重申一个事实：高性能软件实际上更简单，而不是更复杂。困难在于，为一个问题找到简单的解决方案可能需要额外的工作。\n\
  \n这其中存在平衡。构建高容量系统是棘性的，而天真地假设你以后可以修复所有问题也不是一个成功的良好策略。一旦应用程序最初的（通常是宽泛的）性能问题通过定义架构来减少跨进程边界的交互而得到解决，那么在开发期间应避免更详细的“优化”，除非它们是为了修复一个明确识别且可衡量的问题。这就是经验发挥作用的地方。为了成功，你必须避免两个极端：一端是假设以后可以修复所有容量问题；另一端是由于担心未来的容量问题而编写防御性的、过度复杂的代码。\n\
  \n我们的策略通过以下方式解决容量问题：\n\n1. 为你的应用程序决定一种架构。特别关注进程和网络边界以及通用的 I/O。\n\n2. 理解并使用模式，并避免影响系统稳定性和容量的反模式。Michael\
  \ Nygard 的优秀著作《释放性能》（*Release It!*）中详细描述了这些内容。\n\n3. 让团队在所选架构的范围内工作，但在适时应用模式外，忽略为了容量进行优化的诱惑。鼓励代码的清晰和简单，而非晦涩。在没有显式测试证明其价值的情况下，绝不要为了容量而牺牲可读性。\n\
  \n4. 注意所选的数据结构和算法，确保它们的属性适用于你的应用程序。例如，如果你需要 `O(1)` 的性能，就不要使用 `O(n)` 算法。\n\n5. 对线程要极其小心。Dave\
  \ 目前的项目是他工作过的性能最高的系统——他的交易系统每秒可以处理数万次交易——实现这一点的关键方法之一是保持应用程序的核心为单线程。正如 Nygard 所说，“阻塞线程反模式是大多数失败的直接原因……导致链反应和级联故障。”\n\
  \n6. 建立自动化测试来断言预期的容量水平。当这些测试失败时，将它们作为修复问题的指南。\n\n7. 使用性能分析工具作为针对测试识别出的问题进行针对性尝试，而不是作为一种通用的“尽可能快”的策略。\n\
  \n8. 在尽可能的情况下，使用真实世界的容量衡量。你的生产环境系统是你唯一的真实测量来源。使用它并理解它在告诉你什么。特别关注系统的用户数量、他们的行为模式以及生产数据集的大小。\n\
  \n### 测量容量\n\n测量容量涉及调查应用程序的广泛特征。以下是可以执行的某些测量类型：\n\n* *可扩展性测试*（Scalability testing）。随着我们增加更多的服务器、服务或线程，单个请求的响应时间以及可能的并发用户数量如何变化？\n\
  * *持久性测试*（Longevity testing）。这涉及长时间运行系统，以查看在长时间的运行期间性能是否会发生变化。这种测试可以捕获内存泄漏或稳定性问题。\n\
  * *吞吐量测试*（Throughput testing）。系统每秒可以处理多少次交易、消息或页面访问？\n* *负载测试*（Load testing）。当应用程序的负载增加到生产环境的比例甚至更高时，容量会发生什么变化？这可能是最常见的容量测试类型。\n\
  \n所有这些都代表了系统行为的有趣且有效的测量，但可能需要不同的方法。前两种测试与另外两种在根本上是不同的，因为它们意味着相对测量：当我们改变系统的属性时，系统的性能特征如何变化？而第二组测试仅作为绝对测量值时才有用。\n\
  \n在我们看来，容量测试的一个重要方面是能够为给定的应用程序模拟真实的使用场景。这种方法的替代方案是对系统中的特定技术交互进行基准测试：“数据库每秒可以存储多少次交易？”、“消息队列每秒可以传递多少条消息？”等等。虽然在项目的某些时刻此类基准测量可能具有价值，但与更关注业务的问题相比，它们是学术性的，例如：“根据常规使用模式，我每秒可以处理多少次销售？”或“我的预测用户群在高峰负载期间能有效使用该系统吗？”\n\
  \n针对性的、基准测试式的容量测试对于防御代码中的特定问题和优化特定区域的代码非常有用。有时，它们通过提供有助于技术选型过程的信息来有用。然而，它们只构成了图景的一部分。如果性能或吞吐量对于应用程序来说是一个重要问题，那么我们需要一些测试来断言系统满足业务需求的能力，而不是我们作为技术人员对特定组件吞吐量的猜测。\n\
  \n正因如此，我们认为将基于场景的测试纳入我们的容量测试策略至关重要。我们将系统的特定使用场景表示为一个测试，并根据我们对其在现实世界中必须成就的业务预测进行评估。我们在第\
  \ 238 页的“自动化容量测试”章节（ch09.html_page238）中详细描述了这一点。\n\n然而在现实世界中，大多数现代系统——至少是我们通常处理的类型——并不是一次只做一件事。当销售点系统正在处理销售时，它还在更新库存位置、处理服务订单、记录工时、支持店内审计等等。如果我们的容量测试不测试此类复杂的交互组合，那么将会有许多类问题是它们无法防御的。这种隐含意味着，我们的每个基于场景的测试都应该能够与其他涉及其他交互的容量测试并运行。为了达到最佳效果，容量测试应该组合成更大规模的套件并并行运行。\n\
  \n\n\n\n确定需要施加多少负载以及什么样的负载，并处理替代路径场景（例如未经授权的索引服务抓取你的系统），正如 Nygard 所言，“这既是一门艺术也是一门科学。复制真实的生产流量是不可能的，因此你使用流量分析、经验和直觉来尽可能地实现对真实的模拟。”\n\
  \n## 容量测试应该如何定义成功与失败？\n\n我们看到的许多容量测试，与其说是“测试”，倒不如说是“测量”。成功或失败通常取决于对收集到的测量结果进行的人工分析。采用容量测量策略而非容量测试策略的缺点是，分析结果可能是一项耗时的工作。然而，如果任何容量测试系统能够生成测量数据，它就具有一个极其有用的特性，能够提供关于发生了什么的洞察，而不仅仅是一个关于成功或失败的二进制报告。在容量测试的语境下，图表真的胜过千言万——趋势对决策的影响可能与绝对值一样重要。因此，我们始终将创建图表作为容量测试的一部分，并确保可以从我们的部署流水线仪表板中轻松访问。\n\
  \n然而，如果我们利用容量环境同时进行测试和测量，那么对于我们运行的每项测试，我们都需要定义“通过”意味着什么。设置容量测试应该通过的水平是棘手的。一方面，如果你设置的水平太高，以至于你的应用程序只有在一切顺利的情况下才能通过，那么你可能会遭受定期的、间歇性的测试失败。当网络被用于其他任务，或者当你的容量测试环境同时处理另一个任务时，你的测试可能会失败。\n\
  \n相反，如果你的测试断言应用程序必须处理每秒 100 次交易（`tps`），而它实际上可以处理 200 次，那么你的测试将无法发现某个让吞吐量几乎减半的变化。这意味着你把一个潜在的困难问题推迟到了某个不可预测的未来时刻，那时你已经忘记了那个引起问题的变更的细节。一段时间后，你可能会进行某项看似无辜的更改，出于合理的理由减少了容量，即使这种减少只有几个百分之，测试也会失败。\n\
  \n这里这里有两个策略可以采用。首先，追求稳定、可重复的结果。在实际允许范围内，将容量测试环境与其他影响隔离开，并将它们专门用于测量容量的任务。这最大限度地减少了其他非测试相关任务的影响，从而使结果更加一致。容量测试是少数几个不适合虚拟化的场景之一（除非你的生产环境是虚拟的），因为虚拟引入了性能开销。接下来，当测试达到最低可接受水平后，通过逐步调高来调整每项测试的通过阈值。这可以为你免受误报场景的干扰。如果测试在提交后开始失败，且阈值设置得远高于需求，那么如果容量下降是由于已知且可接受的原因，你始终可以决定简单地降低阈值，但测试将保留其作为防止无意损害容量变更的价值。\n\
  \n## 设置初始容量阈值\n\n让我们以一个处理文档的虚拟系统为例。该系统每天需要接受 100,000 份文档。每份文档将在三天内通过一系列五个验证步骤。为了方便说明，让我们假设该应用程序将运行在单个时区，并根据其性质在工作时间内达到峰值负载。\n\
  \n从文档开始，我们可以假设如果负载分布均匀，我们需要在每个工作日的 8 小时内处理大约 100,000 份文档。这意味着每小时 12,500 份。如果我们主要关注应用程序的吞吐量，我们并不需要运行一整天，甚至不需要一整小时——我们将持久性测试视为另一项独立任务。每小时\
  \ 12,500 份文档略低于每分钟 210 份，或每秒 3.5 份。我们可以运行 30 秒的测试，如果我们能接受 105 份，我们就可以很有信心一切正常。\n\
  \n嗯，几乎如此。在现实世界中，当所有这些文档被接受时，系统中还有其他工作在进行。如果我们想要一个代表现实的测试，我们需要模拟系统在接受文档时将承受的其他负载。每份文档将运行三天，每份文档都会经历其五步验证过程。因此，在任何一天，除了处理接受文档施加系统的负载外，我们必须加上一个代表这些验证的负载。在任何一天中，我们将处理两天前的\
  \ 5/3 验证、一天前的 5/3 以及今天的 5/3 验证。因此平均而言，对于系统接受的每份文档，我们必须在同一时间内模拟五个验证步骤中的每一个。\n\n所以，我们\
  \ 30 秒测试的通过标准现在看起来像是：“在 30 秒内接受 105 份文档并执行每个验证步骤 105 次。”\n\n这个示例基于我们在一个真实项目中执行的测试——对于那个项目，这种外推是准确的。然而，重要的是，许多系统的负载特征要剧烈得多，负载波动很大，因此任何针对代表性测试的计算都应该基于对峰值负载的估计。\n\
  \n为了让我们的测试成为真正的测试而非性能测量，每项测试必须体现特定的场景，并针对一个阈值进行评估，超过该阈值即被认为通过。\n\n## 容量测试环境\n\n\
  系统容量的绝对测量理想情况下应在尽可能复制系统最终运行的生产环境中进行。\n\n虽然从不同配置的环境中学习信息是有可能的，但除非基于测量，否则从测试环境的容量外推到生产环境的容量任何行为都是高度推测的。高性能计算机系统的行为是一个专业且复杂的领域。配置更改对容量特性往往具有非线性影响。简单的操作，例如更改允许的\
  \ UI 会话与应用程序服务器以及数据库连接之间的比例，就可以将系统的整体吞吐量提高数量级（因此这些是值得尝试的重要变量）。\n\n如果容量或性能对你的应用程序是一个严重问题，请投入资金为你的系统核心创建一个生产环境克隆。使用相同的硬件和软件规范，并遵循我们关于如何管理配置的建议，以确保每个环境使用相同的配置，包括网络、中间件和操作系统配置。在大多数情况下，如果你正在构建一个高容量系统，任何除此以外的策略都是妥协，并伴随着额外的风险——即当它处于生产环境中、连接到真实的外部系统、并且具有真实的负载和生产规模数据集时，你的应用程序无法满足你的容量需求。\n\
  \n\n\n\n\n我们的一组同事曾为一家著名的 Web 公司开发一个项目。这是一家历史悠久的公司，其历史之久到已经产生了一系列自己的遗留问题。我们的团队正在为该客户构建一个全新的系统，但客户试图通过使用非常老旧的生产环境硬件作为性能测试环境来节省费用。\n\
  \n客户对系统的容量担忧是合理的，他们花费了大量时间（以及金钱）试图让开发团队关注容量问题。在多次对话中，我们的团队指出，测试环境中的硬件太旧了，单单此一点就对应用程序感知的低容量表现造成了重大影响。\n\
  \n在一次特别糟糕的测试结果后，团队进行了一些对比，并证明了小组 iPod 的性能可以优于容量测试环境。在展示了这些发现后，客户购买了一些较新的的测试硬件。\n\
  \n***\n\n在现实世界中，在完全复制的生产环境中进行容量测试的理想状态并不总是可能的。有时这甚至是不合理的，例如当项目规模足够小时，或者应用程序的性能受关注的程度不足以负担复制生产环境的开支时。\n\
  \n对于另一个极端的项目，复制生产环境同样是不恰当的。大型软件服务（SaaS）提供商通常在其生产环境中运行成百甚至上千台服务器，因此要完全复制其生产环境所涉及的维护开销（更不用硬件成本）是不切行的。即使他们这样做，生成用于压力测试此类环境的负载以及具有代表性的数据集的复杂性也将是一项艰巨工程。在这种情况下，容量测试可以作为金丝发布策略的一部分进行（更多信息请参阅第\
  \ 263 页的“金丝发布”章节）。通过更频繁的发布可以降低新更改改变应用程序容量的风险。\n\n然而，大多数项目处于这些极端情况之间的范围内，此类项目应该尝试在与生产环境尽可能相似的环境中运行容量测试。即使项目小到不值得负担复制生产环境的开支，你也应该记住，虽然在低规格硬件上进行容量测试会凸显任何严重的容量问题，但它无法证明应用程序能够完全满足其目标。这是一个必须对项目进行评估的风险——但在计算时不要太天真。\n\
  \n不要寄希望你的应用程序会随着硬件的某个特定参数线性扩展而自欺欺人。例如，如果你的测试处理器的时钟频率生产服务器的一半，就假设应用程序在生产环境中的速度会快一倍，这是天真的。这不仅假设你的应用程序是\
  \ CPU 密集型的，还假设随着 CPU 速度的增加，它仍然是瓶颈。复杂系统极少以这种线性的方式运行，即使它们被设计成是这样。\n\n如果你别无选择，请尝试获取一些缩放运行数据，以基准测试测试环境和生产环境之间的差异。\n\
  \n***\n\n### 缩放因子的缺陷\n\n在我们的一个项目中，客户不想花钱购买两套生产标准硬件，而是提供了性能要弱得多的机器，让我们在这些机器上运行容量测试。幸运的是，我们成功说服了他们，如果他们能推迟一周交付升级后的生产服务器，我们就能更好地缓解（正如我们告诉过他们的）他们正面临的容量风险。在那周里，我们拼命工作，运行了容量测试并收集了大量数据。然后，我们在功率较低的容量测试环境中重新运行了完全相同的测试，并建立了一系列缩放因子，我们可以用来推断未来的容量测试结果。\n\
  \n这是一个好故事，但实际上，当我们的系统进入生产环境时，我们仍然发现了几个未预料的容量问题，如果我们有生产标准硬件，本可以发现这些问题。对于这个特定项目，不复制生产环境进行容量测试是一种虚假的节省，因为我们正在构建一个高性能系统，而我们发现的问题是在我们低规格容量测试环境中无法应用的负载下表现出来的。这些随后的问题修复成本高昂。\n\
  \n***\n\n图 9.1 生产服务器集群示例\n\n![Image](img/fig9_1.jpg)\n\n图 9.2 容量测试环境示例\n\n![Image](img/fig9_2.jpg)\n\
  \n当应用程序要部署到服务器集群时，有一种明显的策略可以限制测试环境成本并提供合理的准确性能测量，如图[图 9.1](#ch09.html_ch09fig1）所示。复制服务器的一部分，如图[图\
  \ 9.2](#ch09.html_ch09fig2）所示，而不是整个集群。\n\n例如，如果你的应用程序部署在四台 Web 服务器、八台应用服务器和四个数据库上，在你的性能测试环境中各准备一台\
  \ Web 服务器、一台数据库服务器和两个应用服务器。这将为你提供单链路性能的相当准确测量，并可能揭示当两个或多个服务器竞争另一层的资源（如数据库连接）时产生的一些问题。\n\
  \n推断容量是一种启发式方法，其在最佳实践方法以及成功与否方面在不同项目之间会存在巨大差异。我们只能建议你对推断结果的假设保持健康程度的怀疑态度。\n\n###\
  \ 自动化容量测试\n\n在过去的项目中，我们曾错误地将容量测试视为一项完全独立的活动：它是交付过程本身中的一个独立阶段。这种方法是对开发和运行这些测试的成本的反应。暂且不考虑成本，当容量是某个项目的特定问题时，了解你是否引入了影响系统容量的更改是重要的，这与了解你引入了功能性问题同样重要。你需要在相应的更改引入后尽快获知容量下降的情况，以便你能够快速高效地修复它。这支持了将容量测试作为一阶段添加到部署流水线中。\n\
  \n如果我们要在流水线中添加容量测试，则应该创建一个自动化的容量测试套件，并针对每个通过提交阶段和（可选的）验收测试阶段的更改进行运行。这可能是很困难的，因为比其他类型的验收测试，容量测试可能是脆弱的、复杂的实体，很容易由于软件的微小更改而崩溃——这种崩溃不是预示容量问题的有用故障，而是由于容量测试与之交互的接口发生变化导致的。\n\
  \n容量测试应该：\n\n- 测试特定的真实场景，以免我们通过过度抽象的测试而错过真实世界使用中的重要 Bug\n- 具有预定义的成功阈值，以便我们判断它们是否通过\n\
  - 持续时间短，以便容量测试能够在合理的时间内进行\n- 面对更改具有健壮性，避免为了跟上应用程序的变化而不断重复工作\n- 可以组合成更大的复杂场景，以便我们模拟真实世界的使用模式\n\
  - 可重复，能够顺序或并行运行，以便我们既可以构建应用负载的测试套件，也可以运行长时间测试\n\n\n\n\n以一种不会因过度设计测试而阻碍开发进度的方式来实现所有这些目标并非易事。一种良好的策略是采取现有的验收测试，并将其调整以转变为容量测试（capacity\
  \ tests）。如果你的验收测试是有效的，它们将代表与你的系统交互的真实场景，并且在应用程序发生变化时具有健壮性。它们所缺乏的属性是：扩展能力（以便你能够对应用程序施加严苛的负载），以及对成功衡量标准的规范化。\n\
  \n在大多数其他方面，我们在之前的几个章节中给出的关于编写和管理有效验收测试的建议，意味着它们在很大程度上已经满足了上述对于良好容量测试的大多数标准。我们的目标是双重的：创建一个真实的类生产环境负载，以及选择并实现代表真实但病态的现实加载情况的场景。最后一点至关重要：我们并不只在验收测试中测试“正快路径”（happy\
  \ path），容量测试也是如此。例如，Nygard 建议了一种测试系统如何扩展的有用技术：“识别出你最耗费资源的交易是什么，并将这些交易的比例增加一倍或两倍。”^(4)\n\
  \n如果你能够记录这些测试与系统执行的交互，将它们复制多次，然后重放这些副本，你就可以对被测系统施加各种负载，从而测试各种场景。\n\n我们已经在几个项目中看到这种通用策略奏效，每个项目使用的技术非常不同，且每个项目的容量测试需求也完全不同。测试本身的信息是如何记录的、如何扩展的以及如何重放的，这些细节在项目之间存在巨大差异。其一致之处在于基本原理：记录功能性验收测试的输出，对其进行后处理以扩展请求，为每个测试添加成功标准，然后重放测试以对系统施加极高流量的交互。\n\
  \n要做出的第一个策略决策是，在应用程序的哪个点进行记录以及随后的回放。我们的目标是尽可能地模拟系统的真实使用情况；然而，这是有成本的。对于某些系统，只需记录通过用户界面执行的交互并进行回放就足够了。但如果你正在开发一个供数万或更多用户使用的系统，请不要尝试通过\
  \ UI 交互来给系统施加负载。为了实现这种真实的模拟，你需要数千台专用客户端机器来向系统注入负载。有时必须做出妥协。\n\n使用现代面向服务的架构构建的系统，或那些将异步通信作为主要输入的系统，特别适用于我们常用的策略之一：记录和回放。\n\
  \n图 9.3 容量测试的潜在注入点\n\n![Image](img/fig9_3.jpg)\n\n取决于系统行为和其基础架构的许多变量，选择归结为在几个点进行记录和回放（见图\
  \ 9.3）：\n\n1. 通过用户界面。\n2. 通过服务或公共 API——例如，直接向 Web 服务器发送 `HTTP` 请求。\n3. 通过更底层的 API——例如，直接调用服务层或数据库。\n\
  \n### 通过用户界面进行容量测试\n\n记录并随后回放与系统交互的最显而易见的点用户界面。这是大多数商业负载测试产品运行的点。此类工具提供了通过用户界面编写脚本或直接记录交互的能力，然后复制并扩展这些测试交互，以便测试可以为每个测试用例模拟成百或数千次交互。\n\
  \n正如我们已经提到的，对于高流量系统，尽管充分测试系统具有显著优势，但这并不总是一个切实可行的方法。这种方法还有另一个显著缺点：在分布式架构中，服务器承载了大量的业务逻辑——因此也是容量问题更容易集中的地方——可能无法向系统施加足够的负载来测试系统。在这种情况下，当客户端本身逻辑复杂，或者过于简单（例如用于中心化服务的轻量级\
  \ UI）时，可能无法对系统进行适当测试。真实的衡量标准是客户端与服务器的比例。\n\n对于某些系统，基于 UI 的测试是正确的做法，但实际上，这种策略只对处理中等流量的系统是合适的。即使如此，管理和维护\
  \ UI 测试的成本可能很高。\n\n基于 UI 的测试存在一个根本性问题。任何设计良好的系统都会由不同关注点的组件组成。在大多数应用程序中，UI 的作用是为用户提供一个与交互接口。这个接口通常接收一系列交互，并将其压缩为与其他组件更具针对性的交互：例如，一系列文本输入、列表选择、按钮点击通常会产生传递给另一个组件的单个事件。这个第二个组件具有更稳定的\
  \ `API`，因此针对该 `API` 的测试会比针对 GUI 的测试不那么脆弱。\n\n对于分布式应用程序的容量测试，我们是否关注 UI 的性能取决于系统的性质。对于简单的基于\
  \ Web 的客户端，我们通常不关注客户端本身的性能，而是关注服务器端中心化资源的性能。如果我们的验收测试是为了测试 UI 并确保通过它的交互在功能上是正确的，那么在应用程序的后续点进行记录以用于容量测试可能是更有效的选择。反之，某些容量问题仅会在客户端与服务器的交互中表现出来，特别是在厚客户端的情况下。\n\
  \n对于具有复杂客户端应用程序和中心化服务器组件的分布式系统，分离容量测试通常是有意义的，正如我们描述的那样，找到一个中间记录和注入点来测试服务器，并针对 Stub\
  \ 版本定义独立的 UI 客户端测试。我们意识到这一建议违背了我们之前使用端到端“全系统”测试进行容量测试的建议，但我们认为在测试分布式系统时，UI 是特殊情况，最好这样处理。在这种情况下，比其他情况更取决于测试系统的性质。\n\
  \n总结来说，尽管这是容量测试测试产品中最常见的方法，但我们通常倾向于避免通过 UI 进行容量测试。例外是当需要证明 UI 本身、或者客户端与服务器之间的交互不是性能瓶颈时。\n\
  \n### 针对服务或公共 API 记录交互\n\n\n\n\n\n这种策略可以用于提供图形用户界面之外的公共 API 的应用程序，例如 `web-service`、`message\
  \ queues` 或其他事件驱动的通信机制。这可以是一个记录交互的理想点，允许你避开客户端扩展问题、管理成百上千个客户端进程的复杂性，以及通过用户界面与系统交互时相对的脆弱性。面向服务的架构特别适用于这种方法。\n\
  \n图 9.4 记录针对公共 API 的交互\n\n![Image](img/fig9_4.jpg)\n\n图 9.4 显示了一个容量测试记录器组件的图，它在交互发生时对其进行记录。\n\
  \n## 使用记录的交互模板\n\n我们记录交互的首要目标是实现一种与系统交互的模板，就像验收测试一样。这些交互模板稍后将用于为后续的容量测试运行生成测试数据。\n\
  \n我们的理想是执行一次验收测试的特殊运行，或者是代表容量测试场景的子集。在这次特殊运行期间，我们将通过注入额外的代码对代码进行插桩，这段代码将记录交互、将其保存到磁盘并将其转发给系统本身。从系统的其他角度来看，所发生的交互没有区别——记录是透明的：我们只是将所有输入输出的副本重定向到磁盘。\n\
  \n图 9.5 创建交互模板\n\n![Image](img/fig9_5.jpg)\n\n图 9.5 显示了该过程的一个简单示例图。在这个示例中，某些值被标记以供以后替换，另一些值保持原样，因为它们不影响测试的含义。显然，消息中的标记数量可以根据需要多或或少。但总的来说，我们倾向于少替换而非多替换；我们的目标是在尽可能减少替换量的情况下完成任务。这将限制测试与测试数据之间的耦合，从而使我们的测试更加灵活且不那么脆弱。\n\
  \n图 9.6 从交互模板创建测试实例\n\n![Image](img/fig9_6.jpg)\n\n一旦记录了交互模板，我们就会创建与其配套的测试数据。这些数据的生成是为了补充交互模板，每组测试数据在与适当模板结合时，都代表了与被测系统交互的一个有效实例。图\
  \ 9.6\n\n除了模板记录的内容外，我们为模板所代表的测试添加了成功标准。我们还没有足够的这种方式测试的经验来将其推荐为最佳且唯一的方法；到目前为止我们只在一个项目中尝试过，但对于那个项目，这样做非常成功，并帮助我们创建了一个非常简单但非常强大的容量测试系统。一旦建立，该系统记录新测试只需要极小的精力，而准备和执行容量测试运行则完全不需要精力。\n\
  \n最后，当执行容量测试测试时，将独立的测试实例在相同点馈回系统。\n\n交互模板和测试数据也可以作为开源性能测试工具的输入，例如 Apache 的 `JMeter`、`Marathon`\
  \ 或 `Bench`。也可以编写一个简单的测试框架来以这种方式管理和运行测试。构建自己的容量测试框架并不像听起来那么愚蠢或那么困难；它允许对容量测试框架进行定制，以精确测量你项目所需的内容。\n\
  \n我们对本节提出的建议有一个注意事项。对于真正的高容量和高性能系统，整个系统中性能最高的部分必然是测试，而不是生产代码。测试必须运行得足够快以施加负载并确认结果。现代硬件非常快，以我们所讨论的性能水平是极寻常的，但如果你已经到了计算时钟周期并调整编译器创建的机器代码的程度，那么交互模板就太昂贵了。至少，我们还没有找到让它们高效到可以测试应用程序的方法。\n\
  \n## 使用容量测试存根开发测试\n\n对于极高性能系统的容量测试，编写容量测试的复杂性往往超过编写足够快以通过测试的代码的复杂性。因此，确保测试能够以所需的速率进行测试以断言通过至关重要。当你编写容量测试时，从是从实现被测应用程序、接口或技术的简单\
  \ no-op（无操作）存根，这样你就可以证明你的测试以所需的速度运行，并在另一端没有进行工作时正确地断言通过。\n\n这听起来可能有些过度，但我们向你保证，我们见过许多容量测试断言应用程序失败，而实际上是测试本身无法跟上。Dave\
  \ 在本书写作期间工作于一个非常高性能计算的环境。在该项目中，我们在所有层上运行了一系列容量和性能测试。正如你所期的，这些测试作为我们部署流水线的一部分运行，其中大多数测试都有一个基准运行，首先针对测试存根执行每个测试，在我们信任其结果之前断言测试本身是有效的。这些基准运行的结果与我们的容量测试结果一起报告，因此我们能清楚地指示任何故障在哪里。\n\
  \n## 将容量测试添加到部署流水线\n\n大多数应用程序需要满足某些最小容量阈值。大多数现代商业应用程序将服务于许多并发用户，因此需要扩展以满足其峰值需求，同时提供可接受的性能。在开发期间，我们需要能够断言我们的应用程序将实现客户所需的容量。\n\
  \n虽然容量相关的非功能性需求是项目开发的一个重要方面，但在某些量化指标上指定“足够好”意味着很重要。这些指标应该通过作为部署流水线一部分的某些自动测试进行评估。这意味着每一个通过提交测试和验收测试的更改都应该对其运行自动容量测试。因此，就可以识别出引入显著影响应用程序容量的更改时刻。\n\
  \n通过自动容量测试，并通过其成功标准清晰地勾勒出点，可以确保满足容量需求。通过这种方式，我们防止了对容量问题的过度工程解决方案。我们始终遵循这一格言：我们将尽最少的工作来完成我们想要的结果，正如\
  \ `YAGNI`（“你不需要它”）原则所暗示的那样。`YAGNI` 提醒我们，我们防御性添加的任何行为都可能是徒劳努力。应用 Knuth 的格言，优化应该推迟到明确需要时再进行，推迟到最后一个负责时刻，并根据运行时应用程序分析进行目标，以便按重要性递减顺序攻击瓶颈。\n\
  \n一如既往，我们对任何测试的目标都是在引入破坏假设的更改后尽可能地失败。通过这种方式，更改可以被容易识别并快速修复。然而，容量测试通常相对复杂，并且运行时间很长。\n\
  \n\n\n\n\n如果你足够幸运，能够在几秒钟内证明你的应用程序符合性能目标，请将你的容量测试添加到提交测试（commit testing）阶段，这样你就可以在任何问题上获得即时反馈。然而，在这种情况下，请注意任何依赖运行时优化编译器的技术。`.NET`\
  \ 和 `Java` 中的运行时优化需要多次迭代才能稳定，只有在经过几分钟的“预热”后才能获得合理的结果。\n\n类似的策略对于保护已知的性能热点不随代码演进而变恶化也很有用。当识别出此类热点时，创建一个“守卫测试”（guard\
  \ test），它作为你提交测试循环的一部分快速运行。此类测试充当性能烟雾测试——它们不会告诉你你的应用程序完全符合所有性能标准，但它们可能会强调向错误方向发展的趋势，并让你在趋势演变成问题之前处理它们。不过，注意不要用这种策略引入会间歇性失败的不可靠的测试。\n\
  \n尽管如此，大多数容量测试并不是部署流水线提交阶段的候选者。它们通常运行时间过长，且运行所需的资源过多。如果容量测试保持相当简单且运行时间不过过长，那么将容量测试添加到验收阶段（acceptance\
  \ stage）是可行的。但总体而言，我们不建议将容量测试添加到部署流水线的验收测试阶段。原因有以下几点：\n\n*  为了真正有效，容量测试需要在它们自己的特殊环境中运行。如果最新的发布候选版本如此糟糕地未能满足其容量需求，而真实原因是某些其他自动化测试在同一环境中同时运行，那么找出这一原因将是非常昂贵的。某些\
  \ CI 系统允许为测试指定目标环境。你可以利用此功能对容量测试进行分区，并与验收测试并行运行。\n* 某些类型的容量测试运行可能需要长时间，导致在获得验收测试结果之前出现无法接受的延迟。\n\
  * 验收测试下游的许多活动可以与容量测试并行进行，例如演示最新的可用软件、手动测试、集成测试等。将这些活动挂在容量测试成功运行之后是没有必要的，而且对于许多项目来说，效率很低。\n\
  *  对于某些项目，像运行验收测试那样频繁地运行容量测试没有意义。\n\n总来说，除了我们描述的性能烟雾测试外，我们更喜欢将自动化容量测试作为一个完全独立的阶段添加到部署流水线中。\n\
  \n流水线中这一容量阶段的处理方式在不同项目之间有所不同。对于某些项目，将其以类似于验收测试阶段的方式处理是有意义的——作为一个完全自动化的部署网关。也就是说，除非容量测试阶段的所有测试都通过，否则如果没有手动干预，你就无法部署应用程序。这对于高性能或大规模应用程序最为合适，因为如果它们不满足一个明确的容量阈值，就无法胜任。这是容量测试中最严谨的模型，表面上看对大多数项目来说都是最优的。然而，情况并非总是如此。\n\
  \n如果存在吞吐量或延迟的真实问题，或者仅与特定时间窗口相关或准确的内，自动化测试可以非常有效地作为可执行规范，用于断言需求已满足。\n\n### 图 9.7\
  \ 部署流水线的容量测试阶段\n\n![Image](img/fig9_7.jpg)\n\n在高级别，部署流水线中的验收测试阶段是所有后续测试阶段（包括容量测试）的模板，如图[图\
  \ 9.7](#ch09.html_ch09fig7）所示。对于容量测试，与其他测试一样，该阶段始于准备部署、执行部署，然后验证环境和应用程序已正确配置和部署。只有在此之后才会运行容量测试。\n\
  \n### 容量测试系统的额外收益\n\n容量测试系统通常与你的预期生产系统最接近。因此，它是一项非常有价值资源。此外，如果你遵循我们的建议，将容量测试设计成一系列可组合的、基于场景的测试，那么你真正拥有的实际上是对你生产系统的复杂仿真。\n\
  \n出于许多原因，这是一项无价的资源。我们已经讨论过为什么基于场景的容量测试很重要，但考虑到更常见的针对特定技术关注型交互进行基准测试的方法，这值得重申。基于场景的测试提供了与系统真实交互的模拟。通过将这些场景的集合组织成复杂的复合体，你可以在类生产系统中带有尽可能多的诊断仪器的情况下，有效地进行实验。\n\
  \n我们使用此机制来帮助我们执行各种各种活动：\n\n*   复现复杂的生产缺陷\n*   检测并调试内存泄漏\n*   持久性测试（Longevity testing）\n\
  *   评估垃圾回收的影响\n*   调整垃圾回收\n*   调整应用程序配置参数\n*   调整第三方应用程序配置，例如操作系统、应用程序服务器和数据库配置\n\
  *   模拟病态的、最糟糕的场景\n*   评估复杂问题的不同解决方案\n*   模拟集成失败\n*   在不同硬件配置的一系列运行中衡量应用程序的可扩展性\n\
  *   对外部系统的通信进行负载测试，尽管我们的容量测试最初旨在针对存根接口（stubbed interfaces）运行\n*   演练从复杂部署中回滚\n*\
  \   选择性地让应用程序部分失败以评估服务的降级\n*   在临时可用的生产硬件上执行真实的容量基准测试，以便为长期、低规格的容量测试环境计算更准确的缩放因子\n\
  \n这不是完整列表，但每个场景都源于真实的项目。\n\n从根本上说，你的容量测试系统是一个实验资源，你可以在其中有效地加速或减慢时间以适应你的需求。你可以用它设计并执行各种实验来帮助诊断问题，或预测问题并制定应对策略。\n\
  \n## 总结\n\n设计系统以满足其非功能性需求是一个复杂的话题。许多非功能性需求（NFRs）的交叉特性意味着，很难管理它们对任何给定项目带来的风险。反之，这可能导致两种瘫痪的行为：从项目开始就没有给予足够的关注，或者在另一个极端变成防御性架构和过度工程。\n\
  \n技术人员被完整、封闭的解决方案吸引——即对于他们能想象的大多数情况都是完全自动化的解决方案。对于他们来说，这通常是解决问题的默认方法。例如，运维人员希望系统能够在不关机的情况下重新部署和重新配置，而开发者则希望针对应用程序未来的任何可能的演变进行防御，无论这是否真的被需要。\n\
  \n\n\n\n非功能性需求（Nonfunctional requirements）在软件领域等同于筑梁者确保所选横梁足够坚固以应对预期的流量和天气。这些需求是真实的，必须被考虑，但它们并不是支付桥梁费的业务人员脑海中所想的：他们想要一种能让他们从河流的一侧到达另一侧，且外观优良好的东西。这意味着，作为技术人员，我们必须仔细警惕自己优先考虑技术解决方案的倾向。我们必须与客户和用户紧密合作，确定应用的敏感点，并根据真实的业务价值定义的非功能性需求。\n\
  \n一旦完成这项工作，交付团队就可以为应用程序选择正确的架构，并创建捕获非功能需求的需求和验收标准，其方式与功能性需求相同。这样，就可以估计满足非功能性需求所需的工作量，并像处理功能性需求一样对其进行优先级排序。\n\
  \n一旦这项工作完成，交付团队需要创建并维护自动化测试，以确保这些需求的实现。这些测试应该在应用程序、基础设施或配置的更改通过提交测试和验收测试阶段时，作为部署流水线的一部分进行运行。以你的验收测试为起点，对非功能性需求（NFRs）进行更广泛的场景测试——这是获取系统特性全面且可维护覆盖的极佳策略。\n\
  \n## 第 10 章 应用程序的部署与发布\n\n## 引言\n\n将软件发布到生产环境与将其部署到测试环境之间存在差异——至少在执行发布的人员血液肾上腺素水平上如此。然而，从技术角度来说，这些差异应该被封装在一组配置文件中。当进行生产环境部署时，应该遵循与任何其他部署相同的流程。启动你的自动化部署系统，赋予它要部署的软件版本和目标环境名称，然后点击开始。这一相同的流程也适用于所有后续的部署和发布。\n\
  \n由于两者都使用相同的流程，本章将同时涉及软件的部署和发布。我们将描述如何创建并遵循一套软件发布策略，包括向测试环境的部署。部署和发布之间的主要区别在于是否具备回滚（roll\
  \ back）的能力，我们将在本章中详细讨论这个问题。我们还介绍了两种极其强大的技术，它们可以在即使是最大的生产系统上执行零停机发布和回滚：蓝绿部署（blue-green\
  \ deployments）和金丝发布（canary releasing）。\n\n所有这些过程——部署到测试环境和生产环境以及回滚——都需要成为你部署流水线实现的一部分。应该能够看到部署到这些每个环境的可用构建版本列表，并通过按下按钮或点击鼠标选择要部署的版本和目标环境来运行自动化部署过程。事实上，这应该是对这些环境进行任何更改的唯一方式——包括操作系统和第三方软件的配置。这样，就可以确切地看到你的应用程序的哪些版本运行在哪些环境中，是谁授权了部署，以及自上次部署以来对应用程序\
  \ string 了哪些更改。\n\n在本章中，我们将重点关注将应用程序软件部署到多个用户共享的环境中的问题，尽管相同的原则也适用于用户安装的软件。特别地，我们讨论了产品的发布，以及确保客户端安装软件的持续交付。\n\
  \n### 创建发布策略\n\n创建发布策略最重要的部分是让应用程序的利益相关者在项目规划过程中会面。他们讨论的重点应该是对应用程序在整个生命周期内的部署和维护达成共识。这种共享的理解随后被捕获为发布策略。该文档将由利益相关者在应用程序的生命周期内进行更新和维护。\n\
  \n在项目开始创建第一版本的发布策略时，你应该考虑包含以下内容：\n\n- 负责每个环境部署以及负责发布的双方。\n- 资产和配置管理策略。\n- 用于部署的技术描述。这应该由运营团队和开发团队共同达成一致。\n\
  - 实现部署流水线的计划。\n- 可用于验收、容量、集成和用户验收测试的环境枚举，以及构建通过这些环境的过程。\n- 部署到测试环境和生产环境时需要遵循的流程描述，例如需要开启的变更请求和需要授予的批准。\n\
  - 监控应用程序的需求，包括应用程序应使用的任何通知运营团队状态的 `APIs` 或服务。\n- 关于管理应用程序部署时和运行时配置方法的讨论，以及这与自动化部署过程的关系。\n\
  - 与任何外部系统集成的描述。它们在发布的哪个阶段以及如何作为发布的一部分进行测试？在发生问题时，运营人员如何与供应商通信？\n- 日志记录细节，以便运营人员确定应用程序状态并识别任何错误情况。\n\
  - 灾难恢复计划，以便在灾难发生后恢复应用程序状态。\n- 软件的服务水平协议（SLAs），这将决定应用程序是否需要故障转移（failover）等高可用性策略。\n\
  - 生产规模规划和容量规划：你的在线应用程序将产生多少数据？你需要多少个日志文件或数据库？你需要多少带宽和磁盘空间？客户期望的延迟是多少？\n- 归档策略，以便将不再需要的生产数据保留用于审计或支持目的。\n\
  - 初始生产部署是如何运作的。\n- 如何处理修复缺陷和向生产环境应用补丁。\n- 如何处理生产环境的升级，包括数据迁移。\n- 如何管理应用程序支持。\n\n\
  创建发布策略的行为本身是有用的：它通常会是软件开发以及硬件环境设计、配置和调试的功能性和非功能性需求的来源。这些需求应该被识别为此类需求，并在发现时添加到开发计划中。\n\
  \n创建策略仅仅是开始；随着项目的进行，它将被不断添加和修改。\n\n发布策略中一个至关重要的部分是描述如何执行发布的*发布计划*（release plan）。\n\
  \n### 发布计划\n\n首次发布通常是风险最高的；它需要周密的规划。这种规划的结果可能是可靠且重复地部署应用程序到生产环境所需的自动化脚本、文档或其他程序。除了发布策略的内容外，它还应该包括\n\
  \n- 首次部署应用程序所需的步骤\n- 在部署过程中如何对应用程序及其使用的任何服务进行冒烟测试（smoke-test）\n\n\n\n\n\n- 如果部署出现故障，回滚部署所需的步骤\n\
  - 备份和恢复应用程序状态所需的步骤\n- 在不破坏应用程序状态的情况下升级应用程序所需的步骤\n- 如果运行失败，重启或重新部署应用程序的步骤\n- 日志的存放位置及其包含信息的描述\n\
  - 监控应用程序的方法\n- 作为发布的一部分需要执行的任何数据迁移的步骤\n- 之前的部署中出现的问题日志及其解决方案\n\n有时还需要添加其他考虑因素。例如，如果你的新软件正在接管遗留系统，你应该记录将用户迁移到新系统以及停用旧系统的步骤，并且不要忘记在情况出现问题时执行回滚流程。\n\
  \n同样，随着项目的进展和新见解的获得，该计划需要不断维护。\n\n## 发布产品\n\n上述列出的策略和计划相当通用。对于所有项目来说，它们都值得考虑，即使在经过考虑后，你决定只使用其中的几个章节。\n\
  \n有一类软件项目必须考虑其他问题，即旨在作为商业产品发布的软件。如果你的项目产出是一个软件产品，以下应该考虑的额外交付列表：\n\n- 定价模型\n- 许可策略\n\
  - 使用的第三方技术相关的版权问题\n- 包装\n- 营销材料——印刷品、网页、播客、博客、新闻稿、会议等\n- 产品文档\n- 安装程序\n- 准备销售和支持团队\n\
  \n## 部署和推广你的应用程序\n\n以可靠、一致的方式部署任何应用程序的关键在于持续的实践：使用相同的流程部署到每个环境，包括生产环境。自动化部署应该从第一次部署到测试环境开始。不要通过手动将软件组件调整到位，而是编写一个简单的脚本来完成这项工作。\n\
  \n### 首次部署\n\n任何应用程序的首次部署应该在第一次迭代中进行，即向客户展示你的第一个故事或需求。选择一两个高优先级但在第一次迭代中非常易交付的故事或需求（假设你的迭代周期为一或两周，且你有一个较小的团队——如果不符合这些条件，你应该选择更多）。利用这次展示作为将应用程序部署到类生产环境的演示环境（UAT）的理由。在我们看来，项目首次迭代的主要目标之一是让部署流水线的早期阶段运行起来，并能够在最后部署和演示“某些东西”，无论它多么小。这是极少数建议优先考虑技术价值而非业务价值的情况之一。你可以将这种策略视为为你的开发过程“打水泵”。\n\
  \n在这次打水泵迭代结束时，你应该具备以下内容：\n\n- 你的部署流水线的提交阶段\n- 一个用于部署的类生产环境\n- 一个自动化过程，用于获取提交阶段生成的二进制文件并将其部署到环境中\n\
  - 一个验证部署成功且应用程序正在运行的简单烟雾测试\n\n对于一个仅活跃开发了几天的应用程序来说，这不应该太麻烦。这里的棘手之处在于确定类生产环境应该有多接近生产。你的部署目标不需要是最终生产环境的克隆，但生产环境的某些方面比其他方面重要。\n\
  \n一个好的问题是：“生产环境与我的开发环境有多不同？”如果生产环境运行在不同的操作系统上，那么你应该在 UAT 环境中使用与生产环境相同的操作系统。如果你的生产环境是一个集群，你应该为你的阶段环境构建一个小型的、受限的集群。如果你的生产环境是具有许多不同节点的分布式环境，请确保你的类生产测试环境至少有一个独立的进程来代表每一类进程边界。\n\
  \n虚拟化和数数（0, 1, 多个）在这里是你的朋友。虚拟化让你轻松创建一个代表你生产环境重要方面的环境，同时能够在单台物理机器上运行。数数意味着，如果你的生产站点有\
  \ 250 台 Web 服务器，那么 2 台就足够代表重要的进程边界了。随着以后开发的进行，你可以做得更复杂。\n\n通常情况下，类生产环境具有以下特征：\n\n\
  - 它运行的操作系统应与生产系统相同。\n- 它安装的软件应与生产系统相同——特别是，不应在安装任何开发工具链（如编译器或 IDE）。\n- 在合理范围内，该环境的管理方式应与生产环境相同，使用`第\
  \ 11 章`，“管理基础设施和环境”描述的技术。\n- 对于客户端安装的软件，你的 UAT 环境应该代表客户的硬件统计数据，或者至少是其他人的真实数据。\n\n\
  ## 建模你的发布过程和推广构建\n\n随着你的应用程序增长并变得越来越复杂，你的部署流水线实现也会之增长。由于你的部署流水线应该模拟你的测试和发布过程，你首先需要确定这个过程是什么。虽然这通常用在环境之间推广构建的术语来表达，但我们关心更多细节。特别是，捕捉以下内容至关重要：\n\
  \n- 构建为了发布必须经过哪些阶段（例如：集成测试、QA 验收测试、用户验收测试、阶段环境、生产环境）\n- 所需的关口或审批是什么\n- 对于每个关口，谁有权批准构建通过该关口\n\
  \n图 10.1 测试和发布过程示例图\n\n```\n![Image](img/fig10_1.jpg)\n```\n\n在这次练习结束，你可能会得到一张类似于`图\
  \ 10.1`的图。当然，你的过程可能比这更复杂或更简单。创建这样的图实际上是为你的发布过程创建价值流图的第一步。我们在`第 5 章`，“部署流水线的剖析”中讨论过将价值流映射作为优化发布过程的方法。\n\
  \n一旦你创建了这张图，就可以在你管理部署的工具中为发布过程的每个部分创建占位符。Go 和 AntHill Pro 都允许开箱执行此操作，大多数持续集成工具也可以通过一些工作建模并管理此过程。一旦完成，负责审批的人应该能够使用你的工具，批准特定的构建通过发布过程中的某个关口。\n\
  \n\n\n\n你用于管理部署流水线的工具必须提供的另一项核心功能是：在每个阶段，都能看到哪些构建已经通过了流水线中的所有上一个阶段并因此准备好下一个阶段。随后，应该能够选择这些构建中的一个并点击按钮进行部署。这一过程被称为“提升”（promotion）。通过点击按钮即可提升构建，这使得部署流水线变成了拉取式系统，让参与交付过程的每个人都具备管理自己工作的能力。分析师和测试人员可以为探索性测试、演示或可用性测试实现自助部署。运维人员可以点击按钮，将他们选择的任何版本部署到测试环境或生产环境。\n\
  \n自动化部署机制使得提升变成了一个简单的问题：只需选择所需的发布候选版本并等待其部署到正确的环境。这种自动化部署机制应该供任何需要部署应用程序的人使用。它不应该对部署本身的技术细节有任何知识或理解。为此，在部署系统认为系统就绪后运行自动化冒烟测试（smoke\
  \ tests）非常有帮助。这样，我们就可以向请求部署的人员（无论是分析师、测试人员还是运维人员）确保系统已就绪并按预期正常工作，或者在出现问题时能够轻松诊断原因。\n\
  \n### 产品开发的持续演示\n\n我们做的项目之一是针对一家初创公司的。那是一个全新业务领域的绿地开发（greenfield development）。能够向潜在客户、合作伙伴和投资者展示他们签署的是什么至关重要。在项目的非常早期阶段，这些任务是通过模型图、幻灯片和简单的原型完成的。\n\
  \n然而，很快，应用程序就开始超越原型的了，因此我们开始使用其中一个手动测试环境来进行此类演示，而且通常通知得很晚。我们的部署流水线很好，因此我们可以有信心，任何通过了验收测试关卡的构建都是可以用于演示的。我们还很有信心能够非常容易、快速地部署任何候选版本。\n\
  \n我们的业务分析师可以控制向测试环境的部署。他们可以选择展示哪一个发布候选版本，并与测试团队协调使用哪种测试环境，而不会干扰测试。\n\n你的测试和发布过程中的每个阶段基本上都涉及相同的工作流：对应用程序的特定版本进行测试，以根据一组验收标准来确定其是否符合发布条件。为了进行这项测试，需要将选定的应用程序构建部署到环境中。如果你的应用程序是需要手动测试的用户级安装软件，那么该环境可能是测试人员的桌面机器。对于嵌入式软件，这可能需要一个专门的、专用硬件环境。对于托管软件服务，它可能是一组类似于生产环境的服务器。或者可能是这些者的组合。\n\
  \n在任何一种情况下，该过程中任何测试阶段的工作流都是相似的。\n\n1.  执行测试的人员或团队应该有一种方法来选择他们想要部署到测试环境的应用程序版本。此列表将包含所有通过部署流水线之前所有阶段的应用程序版本。选择特定的构建应导致自动执行以下步骤，直到进入实际测试阶段。\n\
  2.  准备环境和相关基础设施（包括中间件），使其处于清洁状态，准备好部署应用程序。这应该以完全自动化的方式完成，如第 11 章“管理基础设施和环境”所述。\n\
  3.  部署应用程序的二进制文件。这些二进制文件应始终从构制品仓库（artifact repository）获取，而绝不要为每次部署都从头构建。\n4.  配置应用程序。配置信息应以一致的方式在所有应用程序中进行管理，并在部署时或运行时使用类似\
  \ `Escape` [apvrEr] 的工具进行应用。关于此主题的更多信息请参阅第 2 章“配置管理”。\n5.  准备或迁移应用程序管理的任何数据，如第 12\
  \ 章“管理数据”所述。\n6.  对部署进行冒烟测试。\n7.  执行测试（可能是手动或自动的）。\n8.  如果该版本的应用程序通过了测试，批准将其提升到下一个环境。\n\
  9.  如果该版本的应用程序未通过测试，记录原因。\n\n### 提升配置\n\n需要提升的不仅仅二进制文件。环境和应用程序的配置也需要同时提升。为了使情况变得更复杂，你不希望提升所有的配置。例如，你需要确保任何新的配置设置都得到提升，但你不想将指向你的\
  \ SIT 数据库或外部服务的测试双胞器（test double）的设置提升到生产环境。管理与应用程序相关的某些配置部分——而不是与环境相关的其他部分——是一个复杂的问题。\n\
  \n解决这个问题的一种方法是让你的冒烟测试来验证你指向的是正确的对象。例如，你可以让一个测试双胞服务返回它期望通信的环境（字符串形式），并让冒烟测试检查应用程序从外部服务获取的字符串是否与它正在部署的环境匹配。在中间件配置（如线程池）的情况下，你可以使用类似\
  \ `Nagios` 的工具监控这些设置。你还可以编写基础设施测试来检查任何关键设置并将其报告给你的监控软件。第 323 页上的“行为驱动监控”部分提供了更多详细信息。\n\
  \n在面向服务的架构和组件化应用程序的情况下，构成应用程序的所有服务或组件需要被一起提升。正如我们在上一节中讨论的样，通常在系统集成测试环境中找到应用程序服务和组件版本的良好组合。你的部署系统需要强制将此组合作为一个整体进行提升，以避免有人部署了某个服务的错误版本，导致应用程序故障——或者糟糕的是，引入间性和难以追踪的缺陷。\n\
  \n### 编排\n\n环境通常由多个应用程序共享。这会从两个方面引起复杂性。首先，这意味着在为应用程序的新部署准备环境时，必须格外小心，以免干扰该环境中其他应用程序的运行。这通常意味着要确保操作系统或任何中间件的配置更改不会导致其他应用程序出现异常。如果生产环境是由相同的应用程序共享的，那么这项工作就有了用处：确保所选应用程序版本之间没有冲突。如果事实证明这是一个复杂的练习，你可能考虑使用某种虚拟化技术来将应用程序隔离。\n\
  \n\n\n\n其次，共享环境的应用之间可能相互依赖。这在使用服务面向的架构时非常常见。在这种情况下，集成测试环境（也称为系统集成测试，或 `SIT`）是应用程序首次进行相互通信，而非与某种测试双胞（test\
  \ double）通信的阶段。因此，`SIT` 环境中的大部分工作涉及部署每个应用程序的新版本，直到它们能够协同工作。在这种情况下，冒烟测试套件通常是一套针对整个应用程序运行的完整验收测试。\n\
  \n## 部署到发布环境 (Staging Environments)\n\n在将应用程序发布给毫无防备的用户之前，你应该在与生产环境非常相似的发布环境中执行一些最终测试。如果你设法获得了一个与生产环境高度复制的容量测试环境，有时跳过发布步骤可能是有意义的：你可以利用容量测试环境同时进行容量测试和发布。尽管如此，对于简单系统以外的任何情况，我们建议不要这样做。如果你的应用程序包含与外部系统的任何集成，那么发布环境就是你获得最终确认点，确保每个系统预期的生产版本之间的所有集成方面都能正常工作。\n\
  \n你应该从项目开始时就应该着搭建发布环境。如果你有生产所需的硬件且它没有用于其他用途，请将其作为发布环境使用，直到你执行第一次发布。以下是从项目开始就应该规划的一些事项：\n\
  \n- 确保你的生产环境、容量测试环境和发布环境已就绪。特别是在绿地项目中，要在发布前某段时间准备好你的生产环境，并作为流水线的一部分将其部署到那里。\n- 拥有一个自动化过程来配置你的环境，包括网络、外部服务和基础设施。\n\
  - 确保部署过程经过了充分的冒烟测试。\n- 测量应用程序的预热时间。如果你的应用程序使用了缓存，这一点尤为适用。将其纳入你的部署计划中。\n- 测试与外部系统的集成。你不希望应用程序的发布是第一次运行在真实外部系统的时刻。\n\
  - 如果可能，在发布前很早将应用程序放入其生产环境。如果“发布”可以简单地重新配置某些路由器将流量从等待页面重定向到你的生产环境，那就越好。这种技术被称为蓝绿部署（blue-green\
  \ deployment），在本章稍后部分将介绍。\n- 如果可能，尝试在向所有人发布之前，先向一小部分用户推出系统。这种技术被称为金丝发布（canary releasing），在本章稍后部分也会进行描述。\n\
  - 将每个通过验收测试的更改部署到你的发布环境（尽管不一定部署到生产环境）。\n\n## 回滚部署与零停机发布\n\n在部署出现问题时，能够进行回滚是至关重要的。在运行中的生产环境中调试问题几乎肯定会导致熬夜、产生具有不幸后果的错误，以及引起用户的愤怒。你需要一种方法，在出情况发生问题时为你的用户恢复服务，这样你就可以在正常工作时间的舒适的环境中调试故障。我们这里将讨论几种执行回滚的方法。更高级的技术——蓝绿部署和金丝发布——也可以用于执行零停机发布和回滚。\n\
  \n在我们开始之前，有两个重要的限制条件。第一个是你的数据。如果你的发布过程对数据造成了更改，那么回滚可能会很困难。另一个限制是你集成的其他系统。对于涉及多个系统的发布（称为编排发布，orchestrated\
  \ releases），回滚过程也会变得更加复杂。\n\n在创建发布回滚计划时，你应该遵循两个通用原则。第一是确保在执行发布之前，备份你的生产系统状态，包括数据库和文件系统上保留的状态。第二是练习你的回滚计划，包括在每次发布之前从备份恢复或将数据库迁回，以确保它有效。\n\
  \n### 通过重新部署上一个良好版本进行回滚\n\n这通常是最简单的回滚方式。如果你有一个部署应用程序的自动化过程，那么回到良好状态的最简单方法是从头重新部署上一个良好版本。这还包括重新配置它运行的环境，使其配置方式与之前完全相同。这就是为什么能够从头开始创建环境如此重要的原因之一。\n\
  \n为什么要从头开始创建环境并执行部署呢？有几个很好的理由：\n\n- 如果你没有自动化回滚过程，但有自动化部署过程，那么重新部署上一个版本是一个固定耗时的操作，风险较低（因为出错的机会较少）。\n\
  - 这是你之前（希望）已经测试过数百次的完全相同的流程。回滚执行的频率低得多，因此更容易包含 Bug。\n\n我们想不出任何这种方法无效的情况。然而，它也有一些缺点：\n\
  \n- 尽管重新部署旧版本花费是固定的，但它不是零。这会导致停机。\n- 它让调试哪里出了问题变得更加困难。重新部署旧版本通常会覆盖新版本，从而失去了查明发生了什么的机会。如果你的生产环境是虚拟的（我们将在稍后描述），这种情况可以得到缓解。对于相对简单的应用程序，通常可以通过将每个版本部署到新目录并使用符号链接指向当前版本来保留旧版本。\n\
  - 如果你从部署最新版本之前拍摄的数据库备份中恢复，你将丢失部署后创建的任何数据。如果你回滚得足够快，这可能不是大问题，但在某些情况下这是不可接受的。\n\n\
  ### 零停机发布\n\n零停机发布，也称为热部署（hot deployment），是指用户从一个发布切换到另一个发布的实际过程是瞬间完成的。至关重要的是，如果发生故障，必须能够几乎瞬间将用户回退到之前的版本。\n\
  \n零停机发布的关键是将发布过程的各个部分解耦，以便它们尽可能独立进行。特别是要在升级应用程序之前，应该能够部署应用程序依赖的共享资源（如数据库、服务和静态资源）的新版本。\n\
  \n对于静态资源和基于 Web 的服务，这相对容易。你只需要在 URI 中包含资源或服务的版本，并且可以同时拥有多个版本。例如，Amazon Web Services\
  \ 使用了基于日期的版本控制系统，EC2 API 的最新版本（编写本文时）位于 `http://ec2.amazonaws.com/doc/2009-11-30/AmazonEC2.wsdl`。当然，他们仍然让旧版本的\
  \ API 在旧 URI 处继续工作。对于资源，当你推送网站的新版本时，将静态资源（如图像、JavaScript、HTML 和 CSS）放在一个新的目录中——例如，你可以将应用程序\
  \ `2.6.5` 版本的图像放在 `/static/2.6.5/images` 下。\n\n的情况要困难一些。在第 12 章“管理数据”中，有一个章节专门介绍零停机场景下的数据库管理。\n\
  \n\n\n\n\n## 蓝绿部署\n\n这是我们所知的管理发布的最强大的技术之一。其核心思想拥有两个完全相同的生产环境，我们称之为`blue`蓝色）和`green`绿色）。\n\
  \n图 10.2 蓝绿部署\n\n![Image](img/fig10_2.jpg)\n\n在图 10.2 的示例中，系统用户被路由到 `green` 环境，该环境是当前指定的生产环境。我们想要发布新版本的应用程序。因此，我们将其部署到\
  \ `blue` 环境，并让应用程序进行预热（你可以根据需要反复进行）。这在任何方面都不会影响 `green` 环境的运行。我们可以对 `blue` 环境运行冒烟测试以检查其运行是否正常。当我们准备就绪后，切换到新版本只需更改路由器配置使其指向\
  \ `blue` 环境而不是 `green` 环境即可。因此，`blue` 环境就变成了生产环境。这种切换通常可以在一秒钟内完成。\n\n如果出现问题，我们只需将路由器切换回\
  \ `green` 环境即可。然后我们就可以在 `blue` 环境上调试哪里出了问题。\n\n可以看出，这种方法相比重新部署方法有若干改进。然而，在使用蓝绿部署管理数据库时需要小心。通常无法直接从\
  \ `green` 数据库切换到 `blue` 数据库，因为如果模式发生了变化，将数据从一个版本迁移到下一个版本需要时间。\n\n解决此问题的一种方法是在切换前不久将应用程序设置为只读模式。然后你可以获取\
  \ `green` 数据库的副本，将其恢复到 `blue` 数据库中，执行迁移，然后切换到 `blue` 系统。如果一切正常，你就可以将应用程序恢复回读写模式。如果出现问题，你可以简单切回\
  \ `green` 数据库。如果这种情况在应用程序恢复回读写模式之前发生，则无需进行任何其他操作。如果你的应用程序写入了你想保留到新数据库的数据，你需要找到一种方法在再次尝试发布之前提取这些新记录并迁移回\
  \ `green` 数据库。或者，你也可以找到一种方法，让新版本的应用程序同时向新旧两个数据库发送事务。\n\n另一种方法是设计你的应用程序，使其能够独立于升级过程迁移数据库，我们在第\
  \ 12 章“管理数据”中对此详细描述。\n\n如果你只能负担得起一个生产环境，仍然可以使用蓝绿部署。只需在同一个环境中并排运行两个应用程序的副本即可。每个副本都有自己的资源——自己的端口、文件系统中的自己的根目录等——因此它们可以同时运行而互不干扰。你可以独立地部署到每个环境。另一种方法是使用虚拟化，尽管你应该先测试虚拟化对你应用程序容量的影响。\n\
  \n如果你有足够的预算，你的 `blue` 和 `green` 环境可以是彼此完全分离的副本。这需要的配置较少，但当然更昂贵。这种方法的一种变体被称为`影子域域发布`、`影子环境发布`或`双实活发布`，是将你的测试环境（staging）和生产环境作为你的\
  \ `blue` 和 `green` 环境。将新版本的应用程序部署到测试环境，然后将用户从生产环境切换到测试环境，以发布新版本的应用程序。此时，测试环境变成生产环境，而生产环境变成测试环境。\n\
  \n***\n\n![Image](img/common.jpg)\n\n我们与一家非常大的组织合作，他们拥有五个并行的生产环境。他们使用了这种技术，但也并行运行多个版本的生产系统，允许他们以不同的速度迁移其业务的不同领域。这种方法也具有下文描述的金丝雀发布的一些特征。\n\
  \n## 金丝雀发布\n\n通常可以假设你在生产环境中一次只有一个版本的软件。这使得管理内部错误修复（事实上是管理你的整个基础设施）变得容易得多。然而，它也为测试你的软件造成了障碍。即使有稳健且全面的测试策略，缺陷也会在生产环境中出现。即使周期很短，开发团队仍然可以从新功能以及他们为使软件更有价值所做的任何工作的快速反馈中获益。\n\
  \n此外，如果你有一个极其巨大的生产环境，无法创建一个有意义的容量测试环境（除非你的应用程序架构采用了端到端共享）。你如何确保应用程序的新版本性能不会很差？\n\
  \n图 10.3 金丝雀发布\n\n![Image](img/fig10_3.jpg)\n\n金丝雀发布旨在解决这些挑战。如图 10.3 所示，金丝雀发布涉及将新版本的应用程序部署到部分生产服务器以获得快速反馈。就像矿井里的金丝雀一样，这可以迅速发现新版本的任何问题，而不会影响大多数用户。这是降低新版本发布风险的一种极方法。\n\
  \n与蓝绿部署一样，你首先将新版本的应用程序部署到一组没有用户路由的服务器上。然后你可以对新版本进行冒烟测试，如果需要，进行容量测试。最后，你可以开始将选定的用户路由到新版本的应用程序。有些公司选择“高级用户”首先使用新版本的应用程序。你甚至可以在生产环境中同时运行多个版本的应用程序，将不同的用户组路由到不同的版本。\n\
  \n金丝雀发布有几个优点：\n\n1. 它让回滚变得简单：只需停止将用户路由到错误的版本，你就可以慢慢调查日志。\n\n2. 你可以通过将部分用户路由到新版本并将部分路由到旧版本来进行\
  \ A/B 测试。有些公司衡量新功能的使用情况，如果没有足够的人使用就将其删除。其他公司衡量新版本产生的实际收入，如果新版本的收入较低，则回滚。(2）如果你的软件生成搜索结果，你可能会比较真实用户在新版本和旧版本中获得的结果质量。进行\
  \ A/B 测试不需要向新版本路由大量用户；一个代表性样本即可。\n\n3. 你可以通过逐渐增加负载来检查应用程序是否满足容量要求，逐渐将更多的用户路由到应用程序，并测量应用程序的响应时间和\
  \ CPU 使用率、I/O 和内存使用等指标，并监控日志中的异常。如果你的生产环境太大，无法创建一个真实的生产级容量测试环境，这是一种相对低风险的方法。\n\n\
  该主题还有一些变体。金丝雀发布不是进行 A/B 测试的唯一方法——你可以使用应用程序中的开关将不同的用户路由到不同的行为。或者，你可以使用运行时配置设置来更改行为。然而，这些替代方案没有提供金丝雀发布的其他益处。\n\
  \n\n\n\n然而，金丝雀发布并不适用于所有人。在用户在自己的电脑上安装你的软件的情况下，使用这种方法会更加困难。针对这个问题有一个解决方案（一种网格计算常用的方法）——让你的客户端软件或桌面应用程序自动更新到托管在你的服务器上的已知良好版本。\n\
  \n金丝雀发布对数据库升级实施了进一步的限制（这也适用于其他共享资源，如共享会话缓存或外部服务）：任何共享资源都需要与你希望在生产环境中运行的所有版本兼容。另一种方法是使用“无共享”架构，其中每个节点都真正独立于其他节点，没有共享的数据库或服务，或者是这两种方法的某种混合体。\n\
  \n***\n\n### 针对销售点系统的金丝雀发布\n\n金丝雀发布听起来可能有些理论，但我们向你保证，它之所以存在是因为我们在真实项目中见过它的应用（远在\
  \ `Google`、`NetFlix` 和 `IMVU` 提出这一想法之前）。在一个交付高体量销售点系统的项目中，我们由于上述所有原因使用了这种策略。我们的应用程序是一个高度分布的富客户端系统，拥有数万个客户端。当需要向客户端系统部署更改时，有时我们根本没有足够的网络带宽在所有商店关闭期间将所有更改发送到所有客户端。相反，我们在几天甚至几周的时间内逐步推出新版本的系统。\n\
  \n这意味着不同的商店集合将运行不同版本的客户端系统，并与不同版本的服务器端系统进行通信，但它们都共享一个共同的底层数据库。\n\n使用我们系统的商店被分为几个不同的品牌。我们的增量发布策略意味着，不同的商店组可以决定何时承担更新系统的风险。如果某个发布版本包含了对他们运营至关的新功能，他们会倾向于尽早采用；但如果该版本主要侧重于与其某个兄弟商店组更相关的功能，他们就可以推迟发布，直到该功能在其他地方得到证实。\n\
  \n***\n\n最后，重要的是尽可能在生产环境中保留尽可能少的应用程序版本——尝试将其限制在两个以内。支持多个版本是痛苦的，因此请将金丝雀的数量保持在最低。\n\
  \n### 紧急修复\n\n在任何系统中，总会有发现关键缺陷并必须尽快修复的时刻。在这种情况下，最需要记住的一点是：**在任何情况下，都不要破坏你的流程。**\
  \ 紧急修复必须与其他任何更改通过相同的构建、部署、测试和发布流程。我们为什么要说这一点？因为我们见过太多次通过直接登录生产环境并进行不受控制的更改来完成修复的情况。\n\
  \n这导致了两个不幸的后果。首先，更改没有经过充分测试，可能导致回归，且补丁不仅没有解决问题甚至可能加剧问题。其次，更改通常没有被记录（即使记录了，为了修复由第一个更改引入的问题而进行的第二次和第三次更改也不会被记录）。因此，环境最终处于一种不可知的状态，导致无法复现，并以不可管理的方式破坏进一步的部署。\n\
  \n这个故事的教训是：让每一个紧急修复都通过你的标准部署流水线。这是保持低周期周的另一个理由。\n\n有时，通过紧急修复来修复缺陷并不总是值得的。你应该始终考虑缺陷影响了多少人、发生的频率有多高，以及缺陷对用户影响的严重程度。如果缺陷影响的人很少、发生频率很低且影响较小，如果部署新版本的相关风险相对较高，那么立即修复它可能没有意义。当然，这也是支持通过有效的配置管理和自动化部署过程来降低部署相关风险的有力论点。\n\
  \n进行紧急修复的替代方案是如之前所述，回滚到之前的已知良好版本。\n\n在处理生产环境中的缺陷时，需要考虑以下事宜：\n\n- 永远不要在深夜操作，并且始终与他人协作。\n\
  - 确保你已经测试过你的紧急修复流程。\n- 仅在极端情况下才跳过更改应用程序的常规流程。\n- 确保你已经使用分测试环境测试过进行紧急修复。\n- 有时，回滚到之前的版本比部署修复要好。进行一些分析以确定最佳解决方案。考虑如果丢失数据或面临集成或编排问题会发生什么。\n\
  \n### 持续部署\n\n遵循极端编程的格言——如果这样做很痛苦，就多做几次——逻辑上的极端做法是将每一个通过你自动化测试的更改都部署到生产环境。这种技术被称为持续部署，这个术语由\
  \ Timothy Fitz 推广。当然，这不仅仅是持续部署（我可以随心地持续部署到 `UAT`：这没什么大）。关键点是它是**到生产环境的**持续部署。\n\n\
  这个想法很简单：我将我的流水线的最后一步——部署到生产环境——变为自动。这样，如果一次提交通过了所有自动化测试，它就会直接部署到生产环境。为了防止这导致故障，你的自动化测试必须是出色的——应该有覆盖你整个应用程序的自动化单元测试、组件测试和验收测试（功能性和非功能性的）。你必须先编写所有的测试——包括验收测试——这样只有当一个故事完成后，提交才能通过验收测试。\n\
  \n持续部署可以与金丝雀发布相结合，使用自动化流程首先将新版本推向小部分用户，一旦确定新版本没有问题（可能作为手动步骤完成），再将其推给所有用户。良好的金丝雀发布系统提供的额外安全措施使得持续部署成为一个更低风险的提议。\n\
  \n持续部署并不适用于所有人。有时，你并不希望立即将新功能发布到生产环境。在对合规性有约束的公司，部署到生产环境需要审批。产品类公司通常需要支持他们发布的每一个版本。然而，它确实在许多地方都有潜力。\n\
  \n对持续部署的直观反对是它风险太大了。但正如我们之前所说的，更频繁的发布会降低任何特定发布的风险。这是因为每次发布之间的更改量变小了。因此，如果你发布每一个更改，风险的大小就仅限于该更改本身的风险。持续部署是*降低任何特定发布风险*的极佳方法。\n\
  \n也许最重要的是，持续部署迫使你做正确的事（正如 Fitz 在他的博客文章指出的那样）。如果不自动化整个构建、部署、测试和发布流程，你就无法实现它。如果没有一套全面的、可靠的自动化测试集，你就无法实现它。如果没有编写在类生产环境中运行的系统测试，你就无法实现它。这就是为什么，即使你无法*实际*发布每一个通过所有测试的更改，你也应该致力于创建一个在你选择这样做时可以做到的流程。\n\
  \n\n\n\n你的作者们看到持续部署文章在软件开发社区引起如此轰动，感到非常高兴。这强化了我们多年年来关于发布过程的言论。部署流水线的核心在于创建一个可重复、可靠、自动的系统，以便尽可能地将更改提交到生产环境。其目的是通过最高质量的流程创建最高质量的软件，在此过程中大幅降低发布过程的风险。持续部署将这种方法推向了逻辑终。它应该被引起重视，因为它代表了软件交付方式的范式转变。即使你有充分理由不发布你所做的每一个更改——而且这种理由比你想象的要少——你也应该像打算发布它们那样去行动。\n\
  \n## 持续发布用户安装的软件\n\n向你控制的生产环境发布应用程序的新版本是一回事；而发布用户在自己机器上安装的软件（客户端安装软件）的新版本则是另一回事。有几个问题需要考虑：\n\
  \n* 维护升级体验\n* 迁移二进制文件、数据和配置\n*  测试升级过程\n* 从用户处获取崩溃报告\n\n客户端安装软件的一个严重问题是管理随着时间推移而在野外运行的大量软件版本。这可能导致支持工作的噩梦：为了调试任何问题，你必须将源代码回滚到正确的版本，并回想该程序在那个时间点的特性以及任何已知问题。理想情况下，你希望每个人都使用相同的软件版本：最新的稳定版本。为了实现这一点，让升级体验变得尽可能无痛是至关重要的。\n\
  \n客户端有几种方式可以处理升级过程：\n\n1. 让你的软件检查新版本，并提示用户下载并升级到最新版本。这种最容易实现，但使用体验最痛苦。没有人想盯着下载进度条。\n\
  2. 在后台下载并提示安装。在这种模型下，你的软件在运行时定期检查更新并静默下载。下载完成后，持续提示用户升级到最新版本。\n3. 在后台下载并在下次重启应用程序时静默升级。应用程序也可能会提示你现在重启（如\
  \ Firefox 所做的那样）。\n\n如果你想保守一点，选项 1 和 2 看起来可能更有吸引力。然而，在几乎所有情况下它们都是错误的选择。作为应用程序开发者，你希望给用户提供选择。但在升级的情况下，用户并不理解他们为什么可能想延迟升级。这迫使他们考虑升级，但没有提供任何信息帮助他们做出决策。因此，理性的选择通常是不升级，仅仅因为任何升级都可能破坏应用程序。\n\
  \n事实上，开发团队脑海中正在进行完全相同的思考过程。开发团队认为，升级过程可能会破坏应用程序，所以我们应该在这个问题上给用户选择。但是，如果升级过程确实不稳定，用户从不升级无疑是正确的。如果升级过程并不不稳定，那么提供选择就没有意义了：升级应该自动发生。所以事实上，给用户选择仅仅是告诉他们，开发者对升级过程没有足够的信心。\n\
  \n正确的解决方案是让升级过程变得无懈可击——并进行静默升级。特别是，如果升级过程失败，应用程序应该自动恢复到上一个版本，并向开发团队报告失败。他们可以修复问题并发布一个（希望地）能够正确升级的新版本。这一切都可以在用户无需感知任何信息的情况下发生。提示用户的唯一正当理由是采取某些纠正措施。\n\
  \n当然，你可能某些原因不想让软件静默升级。也许你不想希望它“向家汇报”（phone home），或者你所在公司网络运营团队的一部分，该团队只允许在与其他已批准的应用程序进行详尽测试后才部署新版本，以确保桌面环境稳如磐山。这些都是合理的用例，可以通过关闭自动升级的配置选项来解决。\n\
  \n为了提供稳如磐山的升级体验，你需要处理二进制文件、数据和配置的迁移。在每情况下，升级过程都应该保留旧版本的副本，直到绝对确定升级成功。如果升级失败，它应该静默恢复旧的二进制文件、数据和配置。实现此点的简单方法是在安装目录内创建一个目录，存放所有内容的当前版本，并创建一个新目录存放新版本。然后，切换版本只需重命名目录或在某处放置当前版本目录的引用（在\
  \ `UNIX` 系统上，这通常通过符号链接实现）。\n\n你的应用程序应该能够从任何版本升级到任何其他版本。为了实现这一点，你需要对数据存储和配置文件进行版本控制。每当你更改数据存储的架构或配置时，你都需要创建一个脚本将它们从一个版本滚动到下一个版本，如果你想支持降级，还需要一个从新版本回滚到旧版本的脚本。然后，当你的升级脚本运行时，它会确定数据存储和配置的当前版本，并应用相关脚本将它们迁移到最新版本。这种技术在第\
  \ 12 章“管理数据”中有更详细的描述。\n\n你应该将升级过程作为部署流水线的一部分进行测试。你可以在流水线设置一个专门的阶段，获取来自友好用户的真实数据和配置的初始状态选择，并运行升级到最新版本。这应该在代表性的目标机器上自动完成。\n\
  \n最后，客户端安装软件能够向开发团队报告崩溃情况是至关重要的。在关于客户端持续部署的博客文章[amYycv]中，Timothy Fitz 描述了客户端软件面临的各种敌对事件：“硬件故障、内存不足、外语操作系统、随机\
  \ DLL、其他进程向你的程序注入代码、驱动程序在崩溃时争夺优先权，以及其他日益奇异和不可预测的集成问题。”\n\n这使得崩溃报告框架至关重要。Google 开源了用于\
  \ `Windows` 上 `C++` 的框架[b84QtM]，如果需要可以从 `.NET` 内部调用。关于如何做好崩溃报告以及哪些指标有用的讨论取决于你所使用的技术栈，这超出了本书的范围。Fitz\
  \ 的博客文章提供了一些有用的讨论作为起点。\n\n## 技巧\n\n### 执行部署的人员应该参与创建部署过程\n\n通常，部署团队被要求部署他们没有参与开发的系统。他们被给了一个\
  \ `CD` 和一叠复印纸，上面只有模糊的指令，如“安装 SQL Server”。\n\n\n\n\n\n这种现象是运维与开发团队关系糟糕的征兆，可以肯定，当实际部署到生产环境时，过程将是痛苦且漫长的，充满了相互指责和急躁。\n\
  \n开发者在启动项目时应该做的第一件事，是非正式地寻找运维人员，并让他们参与到开发过程中。这样一来，运维人员从一开始就参与了软件开发，双方在发布很久就已经确切知道并多次练习了将会发生什么，从而使发布过程变得像新生婴儿的屁股一样顺畅。\n\
  \n### 当开发与运维成为朋友时，事情会更顺利\n\n我们曾想要按照非常紧迫的时间表部署一个系统。在运维与开发团队的会议上，运维团队对该进度表示了强烈反对。会议结束后，一些技术人员留下来聊天，并交换了电话号码。在接下来的几周里，他们持续着交流，一个月后，系统被部署到了生产服务器并供一小部分用户使用。\n\
  \n部署团队的一名成员与开发团队合作创建了部署脚本，同时在 wiki 上编写了安装文档。这意味着在部署时没有出现意外。在讨论许多系统并安排部署的运维团队会议上，这个系统几乎没有被讨论，因为运维团队对部署它的能力以及软件本身的质量非常有信心。\n\
  \n### 记录部署活动\n\n如果你的部署过程没有完全自动化（包括环境置备），那么记录你的自动化部署过程复制或创建的所有文件是非常重要的。这样，调试任何发生的问题就会变得容易——你确切知道该去哪里查找配置信息、日志和二进制文件。\n\
  \n同样，保留环境中每件硬件的清单、你在部署期间触碰了哪些位，以及实际部署的日志，也是非常重要的。\n\n### 不要删除旧文件，要移动它们\n\n当你进行部署时，务必保留上一个版本的备份。然后，确保在部署新版本之前清理掉旧文件。如果旧部署的某个“遗留文件”仍然留在新部署的版本中，可能会导致难以追踪的错误。在最坏的情况下，例如如果一个旧的管理界面页面被留在那里，可能会导致数据损坏。\n\
  \n`UNIX` 世界中的一种良好实践是将每个版本的应用程序都部署到一个新目录中，并建立一个指向当前版本的符号链接。部署和回滚版本只需更改符号链接指向之前的版本即可。这种方法的网络版本是让不同的版本位于不同的服务器上，或者同一台服务器上不同的端口范围内。使用反向代理在它们之间切换，正如我们在第\
  \ 261 页的“蓝绿部署”章节中所描述的那样。\n\n### 部署是整个团队的责任\n\n“构建与部署专家”是一种反模式。团队的每个成员都应该知道如何部署，每个成员都应该知道如何维护部署脚本。可以通过确保每次构建软件时（即使是在开发者的机器上）都使用真实的部署脚本来实现。\n\
  \n一个损坏的部署脚本应该导致构建失败。\n\n### 服务器应用程序不应该有 GUI\n\n以前看到带有 GUI 的服务器应用程序是很常见的现象。这在 `PowerBuilder`\
  \ 和 `Visual Basic` 应用程序中尤为常见。这些应用程序通常会有我们提到的其他问题，例如无法通过脚本化的配置、对安装位置敏感的应用程序等。然而，主要问题是，为了运行，机器上必须有用户登录且显示着\
  \ UI。这意味着重启（无论是意外的还是由于升级）都会导致用户注销，服务器停止。然后，支持工程师就必须登录机器并手动启动服务器。\n\n### Chris Stevenson\
  \ 的 PowerBuilder 瓶颈\n\n在某个客户处，有一个 `PowerBuilder` 应用程序处理来自一家大宗商品经纪商的所有入交易。该应用程序带有\
  \ GUI，且每天必须手动启动。它还是一个单线程应用程序，如果在处理交易时发生错误，应用程序就会弹出一个对话框，显示消息“错误。继续吗？”以及单单“确定”按钮。\n\
  \n当这个对话框出现在屏幕上时，所有的交易处理都会停止。必须等一个沮丧的交易员来电话，支持人员才去查看机器并点击“确定”按钮让处理继续。在某个阶段，有人又写了另一个\
  \ `VB` 应用程序，其工作是监控对话框并程序化地点击“确定”按钮。\n\n很久以后，当系统的其他部分得到改进后，我们发现了另一个异常情况。在某个阶段，该应用程序被部署在旧版本的\
  \ `Windows 3.x` 上，该版本无法可靠地关闭保存的文件。应用程序通过在每笔交易中加入一个硬编码的五秒暂停来解决这个问题。结合单线程的限制，这意味着如果有大量交易同时涌入，系统将花费很长时间来处理所有交易。挫败感会上升，交易员会重新向系统输入交易，导致重复条目并降低系统的可靠性。\n\
  \n这是 2003 年的事了。不要低估你的应用程序会被使用多长时间。\n\n### 为新部署设置预热期\n\n不要在预设的时间点开启你的“eBay 杀手级”网站。当网站正式“上线”时，它应该已经运行了一段时间，足够让应用程序服务器和数据库填充它们的缓存、建立所有连接并完成“预热”。\n\
  \n对于网站，这可以通过金丝雀发布（canary releasing）来实现。你的新服务器和新版本可以先处理一小部分请求；当环境稳定并得到证明后，你就可以切换更多负载到新系统。\n\
  \n许多应用程序具有内部缓存，会在部署时积极填充。在缓存填充之前，应用程序的响应时间通常很差，甚至可能失败。如果你的应用程序表现成这样，请确保在部署计划中记录下这一点，包括填充缓存所需的时间（你当然会在类生产环境中测试过这一点）。\n\
  \n\n\n\n生产环境中的大多数停机是由不受控制的更改引起的。生产环境应该被完全锁定，以便只有你的部署流水线可以对其进行更改。这涵盖了从环境配置到部署在环境上的应用程序及其数据的所有内容。许多组织都实施了严格的访问管理流程。我们见过的用于管理生产环境访问的方案包括：通过审批流程创建的有限生命期密码，以及需要从\
  \ RSA 令牌中输入代码的双重身份验证系统。在某机构中，对生产环境的更改只能在带有 CCTV 监控屏幕的锁定房间内的终端上获得授权。\n\n这些授权过程应该被嵌入到你的部署流水线中。这样做可以为你带来巨大的益处：这意味着你对生产环境所做的每项更改都有一套记录系统。没有比精确记录在何时、谁对生产环境做了什么种更改、以及由谁授权的这种记录更完美的审计追踪了。部署流水线恰恰提供了这样的功能。\n\
  \n## 总结\n\n部署流水线的后期阶段都关注于部署到测试环境和生产环境。这些阶段与流水线之前的阶段不同，之处在于，后期阶段不会运行自动化测试。这意味着这些阶段没有“通过”或“失败”之说。但它们仍然是流水线不可或缺的一部分。你的实现应该能够：在凭据正确的情况下，只需点击按钮，就能将通过自动化测试的任何应用程序版本部署到你的任何环境中。你团队中的每个人都应该能够确切看到什么被部署在哪里，以及该版本包含了哪些更改。\n\
  \n降低发布风险的最佳方法当然是进行演练。你越频繁地将应用程序发布到各种测试环境，效果越好。具体而言，你越频繁地首次将应用程序发布到新的测试环境，你的流程就越可靠，在生产发布中遇到问题的概率就越小。你的自动化部署系统应该能够从零启动新环境，也能更新已有的环境。\n\
  \n尽管如此，对于任何规模和复杂性的系统来说，首次发布到生产环境将始终是一个重大的时刻。对该过程进行充分的思考和规划，使其尽可能简单是至关重要的。然而，无论你的团队有多敏捷，发布策略都是软件项目中的这类方面：即做出决策的最后责任时刻并不是发布前的几天，甚至几次迭代。这应该是你规划的一部分，并且至少在某种程度上从项目早期就开始影响你的开发决策。发布策略将随着时间的推移而演变，也应该这样演变，随着首次发布时间的临近而变得越来越准确、越来越详细。\n\
  \n发布规划最关键的部分是召集组织中参与交付的所有部门代表：构建团队、基础设施和运维团队、开发团队、测试人员、DBA 和支持人员。这些人要在整个项目生命周期内持续保持会议，并不断使交付过程更加高效。\n\
  \n## 第三部分：交付生态系统\n\n## 第 11 章 管理基础设施和环境\n\n## 引言\n\n正如我们在第 1 章 中描述的，部署软件有三个步骤：\n\
  \n- 创建并管理应用程序运行的基础设施（硬件、网络、中间件和外部服务）\n- 将正确版本的应用程序安装其中\n- 配置应用程序，包括它所需的任何数据或状态\n\
  \n本章涉及这些步骤中的第一步。由于我们的目标是让所有测试环境（包括持续集成环境）都像生产环境，特别是在管理方式上，因此本章也将涵盖测试环境的管理。\n\n让我们先定义在此语境下“环境”的含义。一个`environment`\
  \ 是你的应用程序运行所需的所有资源及其配置。以下属性描述了环境：\n\n- 构成环境的服务器硬件配置（例如 CPU 的数量和类型、内存容量、磁盘、网卡等）以及连接它们的网络基础设施\n\
  - 操作系统和中间件的配置（如消息系统、应用服务器和 Web 服务器、数据库服务器），用于支持运行在其中的应用程序\n\n`infrastructure`（基础设施）这一通用术语代表你组织中的所有环境，以及支持它们的服务，例如\
  \ DNS 服务器、防火墙、路由器、版本控制仓库、存储、监控应用程序、邮件服务器等。事实上，应用程序环境与你组织其他基础设施之间的边界可能从非常明确（例如嵌入式软件的情况）到极其模糊（例如面向服务的架构，其中许多基础设施被应用程序共享并信赖）。\n\
  \n为部署准备环境以及在部署后管理环境的过程是本章的重点。然而，实现这一点需要基于以下原则对所有基础设施进行整体管理(1)：\n\n- 基础设施期望状态应该通过版本控制配置来指定。\n\
  - 基础设施应该是自主的——也就是说，它应该自动纠正到期望状态。\n- 你应该始终通过仪器测量和监控了解基础设施的实际状态。\n\n虽然基础设施应该是自主的，但其易于重建也至关重要，这样在硬件故障的情况下，你可以快速重新建立一个已知的良好配置。这意味着基础设施供应也应该是一个自动化过程。这种自动化供应与自主维护的结合，确保了基础设施在发生故障时可以在预测的时间内重建。\n\
  \n有几件事需要仔细管理，以降低部署到任何类生产环境的风险：\n\n- 测试环境和生产环境的操作系统及其配置\n- 中间件软件栈及其配置，包括应用服务器、消息系统和数据库\n\
  - 基础设施软件，如版本控制仓库、目录服务和监控系统\n- 外部集成点，例如外部系统和服务服务\n- 网络基础设施，包括路由器、防火墙、交换机、DNS、DHCP\
  \ 等\n- 应用开发团队与基础设施管理团队之间的关系\n\n我们将从列表的最后一项开始。在其他技术性的枚举中，它似乎与背景无关。然而，如果这两个团队能够紧密合作解决问题，其他所有事情都会变得容易得多。\n\
  \n\n\n\n这种对协作的关注是 DevOps 运动的核心原则之一，其旨在将敏捷方法引入系统管理和 IT 运营领域。该运动的另一个核心原则是，敏捷技术可以有效应用于基础设施管理。本章讨论的许多技术，例如自主基础设施和行为驱动监控，都是由参与创立这一运动的人士所开发的。\n\
  \n在阅读本章内容时，请记住一个指导性原则：测试环境应该尽可能类似于生产环境。这意味着在上述列出的大多数技术方面，它们应该是相似的（尽管不一定完全相同）。目标是在进入生产环境之前尽早发现环境问题，并在上线前演练部署和配置等关键活动，从而降低发布风险。测试环境应该足够相似以实现这一目标。至关重要的是，管理这些环境的技术应该是完全一致的。\n\
  \n这种方法可能工作艰巨且可能成本高昂，但也有工具和技术可以提供帮助，例如虚拟化和自动化数据中心管理系统。在开发过程早期捕捉晦涩且难以复制的配置和集成问题方面，这种方法带来的益处是巨大的，以至于你的付出将获得多倍的回。\n\
  \n最后，尽管本章假设应用程序的生产环境由运营团队控制，但这些原则和问题对于软件产品同样适用。例如，虽然软件产品并不一定有人定期备份其数据，但数据恢复对于任何用户来说都将是一个重要的关注点。这同样适用于其他非功能性需求，如可恢复性、可维护性和审计性。\n\
  \n### 理解运营团队的需求\n\n一个公认的假设是，大多数项目的失败是因为人为问题而非技术问题。在将代码部署到测试环境和生产环境时，这一点表现得尤为明显。几乎所有中大型公司都将开发活动和基础设施管理（通常称为运营）分到不同的小组或部门孤岛中。这两类利益相关者小组之间的关系往往并不和谐。这是因为开发团队的动力是尽可能快速地交付软件，而运营团队的目标是保持稳定。\n\
  \n可能最需要记住的一点是，所有利益相关者都有一个共同目标：让发布有价值的软件成为一项低风险活动。根据我们的经验，我们发现实现这一点的最佳方法是尽可能频繁地发布（因此产生`continuous\
  \ delivery`）。这确保了发布之间的变化尽可能少。如果你在一个发布需要数几天、伴随着彻夜不眠和长时间工作的组织中工作，你无疑会对这个想法感到惊恐。我们的回答是，发布可以且应该是一个可以在几分钟内完成的活动。这可能看起来是不切实际的。然而，我们见过许多大型公司的大型项目，发布已经从由甘特图驱动的剥夺睡眠的实验转变为每天执行几次的几分钟内完成的低风险活动。\n\
  \n在小型组织中，开发团队通常负责运营。然而，在大多数中大型组织中，这些是独立的群体。每个群体都有自己的汇报路线：将有一个运营主管和一个软件开发主管。每当发生生产发布时，这些团队及其经理都会努力确保出现的任何问题都不是他们的错。这显然是各小组之间产生紧张局的潜在原因。每个小组都想尽可能地降低部署风险，但每个小组都有自己的方法。\n\
  \n运营团队通过关键的服务质量指标（QoS）来衡量有效性，例如平均故障间隔时间（`MTBF`）和平均故障修复时间（`MTTR`）。运营团队通常需要满足服务水平协议（`SLAs`）。任何变更，包括流程的变更，如果它影响了运营团队满足这些及任何其他目标（如符合法律法规）的能力，就代表着一种风险。在此背景下，以下是运营团队最重要的一些高级关注点。\n\
  \n#### 文档与审计\n\n运营经理希望确保对他们控制的任何环境的任何变更都经过记录和审计，这样当出现问题时，他们就可以找到导致问题的相关变更。\n\n运营经理关注跟踪变更能力还有其他原因；例如，符合《萨班斯-奥克斯莱法案》（Sarbanes-Oxley，一项旨在鼓励良好的公司审计和责任的美国法律），以及确保环境保持一致的愿望。但根本目的是为了他们能够弄清环境从最后已知良好状态到任何故障之间发生了什么。\n\
  \n组织将拥有的最重要的流程之一是变更管理流程，用于管理对任何受控环境进行的任何更改——运营通常会同时控制生产环境和类生产的测试环境。这通常意味着当任何人想要对任何测试或生产环境进行更改时，都必须请求变更。许多类型的低风险配置变更可以由运营自行完成（在\
  \ ITIL 中，这些是“标准”变更）。\n\n然而，部署应用程序的新版本通常将是“普通”变更，需要变更经理批准，并在变更咨询委员会（`CAB`）的建议。变更请求需要包含有关变更风险和影响的细节，以及如果失败将如何补救。请求应在开始对要部署的新版本进行工作之前提交，而不是在业务预期上线前的几个小时提交。当你第一次通过这个流程时，请准备好回答很多问题。\n\
  \n软件开发团队的成员有`responsibility`去熟悉运营团队建立的任何此类系统和流程，并遵守这些流程。识别发布软件需要遵循的程序应该是你们开发团队发布计划的一部分。\n\
  \n#### 异常事件的警报\n\n运营经理将建立系统来监控他们的基础设施和运行的应用程序，并在由于他们管理的任何系统出现异常状况时希望收到警报，以便他们尽可能地减少任何停机时间。\n\
  \n每个运营团队都有某种监控其生产环境的方法。他们可能使用 `OpenNMS`，或者如 `Nagios` 或 `HP Operations Manager` 等替代方案。也许他们创建了自身的自定义监控系统。无论他们使用哪种系统，他们都希望你的应用程序能够与之挂接，这样一旦发生错误情况，他们就能知道，并知道去哪里查看更多详细信息以判断出了问题。\n\
  \n在项目开始阶段确定运营团队期望如何监控你的应用程序，并将其作为发布计划的一部分是非常重要的。他们想要监控什么？他们期望你的日志在哪里？你的应用程序应该使用哪些钩子来通知运营人员故障？\n\
  \n\n\n\n\n例如，缺乏经验的开发者最常犯编码错误之一就是吞掉错误（swallow errors）。与你的运维团队进行简短交流就能让你明白，有必要将每个错误条件记录到单一的已知位置，并带有相应的严重程度，这样他们就能确切知道问题所在。此导出的结论是：如果你的应用程序由于某种原因失败，运维人员应该能够轻松地重启或重新部署它。\n\
  \n再次，开发团队有责任确定运维团队的监控需求并将其作为发布计划的一部分。处理这些需求的最佳方法是像对待任何其他需求一样对待它们。从运维人员的角度积极考虑你的应用程序的使用情况——他们是重要的用户群体。在首次发布发布临近时，你需要在发布计划中更新重启和重新部署应用程序的流程。\n\
  \n首次发布只是任何应用程序生命周期的开始。你的应用程序的每个新版本都会有所不同，包括它产生的错误类型和日志消息，可能还有其监控方式。它可能会以新的方式失败。在发布应用程序的新版本时，让运维人员知情是关重要的，这样他们就可以为这些变化做好准备。\n\
  \n## IT 服务连续性规划\n\n运维经理将参与其组织 IT 服务连续性计划的创建、实施、测试和维护。运维团队管理的每个服务都将有一个恢复点目标（RPO）——衡量灾难发生前可接受数据丢失的时间长度；以及一个恢复时间目标（RTO）——在服务恢复之前允许的最大时长。\n\
  \n`RPO` 决定了数据备份和恢复策略，因为数据必须足够频繁备份才能达到 `RPO`。当然，如果没有运行在数据上的应用程序以及其运行所处的环境和基础设施，数据就一无用处，因此你必须能够重新部署正确版本的应用程序及其环境和基础设施。这反意味着所有这些内容必须经过仔细的配置管理，以便运维团队能够进行重现。\n\
  \n为了满足业务期望的 `RTO`，可能需要在第二个位置建立生产环境和基础设施的副本，以便在主系统故障时可以使用它。应用程序应该能够处理这种意外情况。对于高可用应用程序，这意味着在应用程序运行时复制数据和配置。\n\
  \n另一个相关需求是归档：应用程序在生产环境中产生的数据量可能会迅速变得。应该有一种简单的方法对生产数据进行归档，以便出于审计或支持目的保留它们，同时不会填满磁盘或减慢运行速度。\n\
  \n你应该作为业务连续性测试的一部分，测试过应用程序数据的备份、恢复和归档，以及任何给定版本应用程序的提取和部署，并在发布计划中为运维团队提供执行每项活动的流程。\n\
  \n## 使用运维团队熟悉的技术\n\n运维经理希望使用其团队熟悉的的技术对其环境进行更改，以便他们能够拥有并维护自己的环境。\n\n运维团队精通 `Bash`\
  \ 或 `PowerShell` 是很常见的，但他们不太可能是 `Java` 或 `C#` 的高手。然而，几乎可以肯定，他们想要审查对其环境和基础设施配置所做的更改。如果运维团队因为部署过程使用了他们不熟悉的技术和语言而无法理解该过程，那么不可避免地会增加出错的风险。运维团队可能会否决那些他们没有技能维护的部署系统。\n\
  \n开发团队和运维团队应该在每个项目开始时坐下来，决定如何执行应用程序的部署。运维团队或软件开发团队可能需要学习一种约定的技术——也许是 `Perl`、`Ruby`\
  \ 或 `Python` 等脚本语言，或者像 `Debian` 打包系统或 `WiX` 等打包技术。\n\n两个团队都理解部署系统是非常重要的，因为必须使用相同的流程向每个环境（开发、持续集成、测试和生产）部署更改，而开发者最初将负责创建这些流程。在某个时刻，它们将移交给运维团队，由运维团队负责维护，这意味着他们从一开始就应该参与编写这些流程。用于部署以及对环境和基础设施进行其他更改的技术应作为发布计划的一部分。\n\
  \n部署系统是应用程序不可或缺的一部分——它应该像应用程序的其他部分一样以同样的关注和投入进行测试和重构，并保持在版本控制中。如果不是如此（我们已经见过很多这样的项目），结果总是一组测试不充分、脆弱且难以理解的脚本，这使得变更管理变得充满风险且痛苦。\n\
  \n## 基础设施建模与管理\n\n除了利益相关者管理外，本章的所有其他内容都可以被广泛认为是配置管理的一个分支。然而，对你的测试和生产环境实施完全配置管理并非易事，这解释了我们在这个主题上投入了这么多空间。尽管如此，我们只涵盖环境和基础设施管理的高层原则。\n\
  \n图 11.1 服务器类型及其配置\n\n![Image](img/fig11_1.jpg)\n\n任何环境中都涉及许多不同类型的配置信息，所有信息都应该以自动方式进行配置和管理。图\
  \ 11.1 显示了按抽象级别划分的服务器类型示例。\n\n如果你对正在创建的系统的技术选择有完全控制权，你应该在采购和启动过程中询问，自动化硬件和软件基础设施本身的部署和配置将有多容易。拥有可以以自动方式进行配置和部署的底层技术，是实现系统集成、测试和部署过程自动化必要条件。\n\
  \n即使你无法控制基础设施的选择，如果你打算完全自动化你的构建、集成、测试和部署，你必须解决以下每个问题：\n\n• 我们将如何配置基础设施？\n\n• 我们将如何部署和配置构成基础设施的各种软件？\n\
  \n• 在基础设施配置和部署后，我们如何管理它？\n\n\n\n\n现代操作系统有成千上万种使得一个安装版本与另一个产生不同的方式：不同的设备驱动程序、不同的系统配置设置，以及大量影响你软件运行方式的参数。某些软件系统对这种层面的差异的容忍度比其他系统高得多。大多数商业现成软件（COTS）被预期为可以在各种软件和硬件配置下运行，因此不应该过度关注这种层面的差异——尽管在采购或升级过程中，你始终应该检查你的\
  \ COTS 系统的系统要求。然而，一个高性能的 Web 应用可能即使对微小的变化也十分敏感，例如包大小的变化或文件系统配置的差异。\n\n对于运行在服务器上的大多数多用户应用程序来说，直接接受操作系统和迁移件的默认设置是不恰当的。需要配置访问控制、防火墙和其他加固措施（如禁用非必要的服务）。数据库需要配置并为用户设置正确的权限，应用程序服务器需要部署组件。\n\
  \n## Controlling Access to Infrastructure\n\n如果你的组织规模较小或处于创业阶段，就有余裕制定一套基础设施管理的策略。如果你的现有基础设施缺乏良好的控制，你需要建立一套流程流程来解决问题。这包含三个部分：\n\
  \n* 防止在未经批准的情况下进行更改\n* 为基础设施的更改建立自动化流程\n* 监控基础设施以尽早发现问题\n\n虽然我们通常不喜欢锁定并建立审批流程，但对于生产环境，这是至关重要的。作为补充，我们应该以相同的方式对待测试环境。\n\
  \n锁定生产环境以防止未经授权的访问，不仅是针对组织外部人员，也针对内部人员——否则，当出现问题时，人们往往忍不住进入环境进行尝试以解决问题（这种做法有时被称为“调试”）。这几乎是一个糟糕的主意，原因有两个：首先，它会导致服务中断（人们倾向于随机应用补丁）。其次，如果以后出现问题，没有任何记录谁在何时做了什么，这意味着无法查明你面临的问题所在。在这种情况下，你最好从头创建环境，使其处于已知状态。\n\
  \n如果你的基础设施无法通过自动化流程从头创建，首要任务是实施访问控制，以便在没有审批流程的情况下进行任何更改。《视觉运营手册》将其称为“稳定病人”。这无疑会引起很多反感，但它是下一步——创建基础设施管理的自动化流程的前提。如果不关闭权限，运维人员将花费所有时间来救火，因为计划之外的更改会破坏一切。创建维护窗口是设定工作执行时间并实施访问控制的一种良好方法。\n\
  \n对生产和测试环境的更改请求应通过变更管理流程。这并不意味着要官僚化：正如《视觉运营手册》指出的，在 `MTBF`（平均故障间隔）和 `MTTR`（平均修复时间）方面表现最好的许多组织，“每周执行\
  \ 1000 到 1500 次更改，变更成功率超过 99%。”\n\n然而，测试环境更改的审批当然比生产环境的审批更容易获得。通常，生产环境的更改需要部门负责人或你的\
  \ `CTO` 批准（取决于组织的规模和监管环境）。但是，大多数 `CTO` 如果被要求批准 `UAT` 环境的更改会感到不满。关键点在于，你对测试环境的处理与生产环境相同。\n\
  \n## Making Changes to Infrastructure\n\n当然，有时必须对基础设施进行更改。有效的变更管理流程有几个基本特征：\n\n\
  * 每项更改，无论是更新防火墙规则还是部署你核心服务的新版本，都应该通过相同的变更管理流程。\n\n\n\n\n## 变更原则\n\n- 此过程应使用单一的工单系统进行管理，每个人都可以登录该系统，并且它能生成有用的指标，例如每次变更的平均周期时间。\n\
  - 应该记录所做的具体更改，以便日后进行审计。\n- 应该能够看到每个环境（包括部署）的变更历史。\n- 你想要进行的更改应该应该先在你的某一个类生产环境的测试环境中进行测试，并且应该运行自动化测试以确保它不会破坏使用该环境的任何应用程序。\n\
  - 更改应提交到版本控制中，然后通过你的自动化部署流程来实施基础设施更改。\n- 应该有一项测试来验证更改已生效。\n\n创建一个从版本控制部署基础设施更改的自动化过程，是良好变更管理的核心。实现此目标最有效的方法是要求所有对环境的更改都通过中央系统进行。使用测试环境来确定你想进行的更改，在一个新鲜的、类生产的暂存环境中对其进行测试，将其放入配置管理中以便未来的重建能够包含它，获得批准，然后让自动化系统发布该更改。许多组织已经针对这个问题构建了自己的解决方案，但如果你还没有，可以使用数据中心自动化工具，如\
  \ `Puppet`、`CfEngine`、`BladeLogic`、`Tivoli` 或 `HP Operations Center`。\n\n强制审计性的最佳方法是让所有更改都由自动化脚本完成，以便在有人需要查找确切做了什么时可以进行引用。通常情况下，由于这个原因，我们更倾向于自动化而非文档。书面文档永远无法保证所记录的更改已正确执行，而且某人声称执行的操作与实际执行的操作之间的差异足以导致问题，而可能需要数小时或几天时间才能追踪。\n\
  \n## 管理服务器置备与配置\n\n服务器的置备和配置管理在小型甚至中型运营中经常被忽视，简单原因是它们看起来很复杂。几乎每个人获取服务器启动并运行的初始体验都来自于获取安装介质、放入计算机并进行交互式安装，随后是一个不受控的配置管理过程。然而，这很快会导致服务器变成“艺术品”，导致服务器和系统之间的行为不一致，并且在发生故障时无法轻松重新创建。此外，置备新服务器是一个手动、重复、资源密集型且容易出错的过程——这正是可以通过自动化解决的问题类型。\n\
  \n图 11.2 服务器的自动化置备和配置\n\n![Image](img/fig11_2.jpg)\n\n在高级层次，置备服务器——无论是为了测试还是生产环境——都从将一台新机器放入你的数据中心并接线开始。一旦完成，其生命周期几乎每一个部分（包括首次上电）都可以以完全自动化的方式远程完成。你可以使用带外管理系统如\
  \ `IPMI` 或 `LOM` 来开启机器并使其通过网络启动，以通过 `PXE`（下文描述）安装基础操作系统，其中应该包含一个用于数据中心管理工具的代理。你的数据中心管理工具（下图中的\
  \ `Puppet`）从那时起管理机器的配置。这个完全自动化的过程在图 11.2 所示。\n\n### 置备服务器\n\n创建操作系统基准有几种方法：\n\n\
  - 全手动过程\n- 自动化远程安装\n- 虚拟化\n\n我们不会考虑全手动过程，除非为了说明它不是可靠的、重复的，因此无法扩展。然而，这通常是开发团队管理其环境的方式。通常情况下，开发者工作站甚至由开发团队管理的持续集成环境都是长期累积了杂乱代码的“艺术品”。这些环境与你的应用程序实际运行的环境没有任何关系。这本身可能是一个巨大的效率低下的来源。实际上，这些系统应该按照你管理测试和生产环境的方式来管理。\n\
  \n虚拟化作为一种创建操作系统基准和管理环境的方法，将在稍后第 303 页的“虚拟化”部分进行考虑。\n\n自动化远程安装是获取一台新物理机并使其运行起来的最佳选项（即使你计划以后将其作为虚拟主机）。开始此工作的最佳地点是\
  \ `PXE`（预启动执行环境）或 Windows 部署服务。\n\n`PXE` 是通过以太网启动机器的标准。当你从 BIOS 中选择通过网络启动时，底层发生的是\
  \ `PXE`。该协议使用修改过的 `DHCP` 版本来寻找提供启动镜像的服务器。当用户选择了要启动的镜像后，客户端随后会通过 `TFTP` 将适当的镜像加载到内存中。标准的互联网服务联盟\
  \ `DHCP` 服务器 `dhcpd` 随所有 Linux 发行版发布，可以配置为提供 `PXE` 服务，然后你需要配置一个 `TFTP` 服务器来提供实际镜像。如果你使用的是\
  \ RedHat，一个名为 `Cobbler` 的应用程序将通过 `PXE` 提供一系列 Linux 操作系统镜像。它还允许你（如果你运行的是 RedHat 机器）使用你选择的操作系统镜像启动新的虚拟机。`Hudson`\
  \ 也有一个插件提供 `PXE` 服务。`BMC` 的 `BladeLogic` 包含一个 `PXE` 服务器。\n\n几乎每个常见的 UNIX 变体提供了适用于\
  \ `PXE` 的镜像。当然，你也可以创建自己的自定义镜像——RedHat 和 Debian 包管理系统都允许你将已安装系统的状态保存到文件中，该文件随后可以用于初始化其他系统。\n\
  \n一旦你置备了基础系统，你就会对其进行配置。实现此目标的方法之一是通过操作系统的无人值安装过程：RedHat 的 `Kickstart`、Debian 的 `Preseed`\
  \ 或 Solaris 的 `Jumpstart`。这些可以用于执行安装后活动，例如安装操作系统补丁以及决定运行哪些守护进程。安装后的下一步是在是在机器上安装一个用于基础设施系统的代理，并从那时起让这些工具管理你操作系统的配置。\n\
  \n`PXE` 的 Windows 对应物被称为 Windows 部署服务——事实上，它在底层使用了 `PXE`。`WDS` 随 Windows Server\
  \ 2008 企业版提供，也可以安装在 Windows Server 2003 上。为了使用 `WDS`，你需要一个 `ActiveDirectory` 域。要在\
  \ `WDS` 中设置一个启动配置文件，你需要两个东西：启动镜像和安装镜像。启动镜像是 `PXE` 加载到内存中的——在 Windows 的中，这是一个名为 `WinPE`（Windows\
  \ 预安装环境）的软件，也就是当你启动 Vista（或更高版本）安装 DVD 时运行的内容。安装镜像是启动镜像加载到你机器上的完整安装镜像。从 Vista 开始，这两个镜像都位于安装\
  \ DVD 的 Sources 目录中，文件名为 `BOOT.WIM` 和 `INSTALL.WIM`。有了这两个文件，`WDS` 将完成所有必要的配置，以便通过网络提供供启动。\n\
  \n\n\n\n你也可以为 WDS 创建自己的自定义安装镜像。这最简单的方法是使用 Microsoft Hyper-V，正如 Ben Armstrong [9EQDL4]\
  \ 所描述的那样。只需根据你想创建镜像的操作系统启动一个虚拟机。按照你的需求对其进行配置，在其运行 `Sysprep`，然后使用 `ImageX` 将驱动器镜像转换为\
  \ `WIM` 文件，你就可以将其在 WDS 中进行注册。\n\n#### 服务器的持续管理\n\n一旦安装了操作系统，你就需要确保其配置不会以不受控的方式发生变化。这意味着，首先要确保除了运维团队外，没有人能够登录这些机器；其次，任何更改都必须通过自动化系统执行。这包括应用操作系统服务包、升级、安装新软件、更改设置或执行部署。\n\
  \n你的配置管理流程的目标是确保配置管理是声明式的且等幂的（idempotent）——这意味着你配置了基础设施的期望状态，而系统会确保该配置被应用，以便无论基础设施的初始状态如何，最终结果都是相同的，即使重复应用相同的配置也是如此。这在\
  \ Windows 和 UNIX 世界中都是实现的。\n\n一旦该系统建立，你就可以通过一个中央化的、版本的配置管理系统来管理基础设施中所有的测试和生产环境。你将获得以下收益：\n\
  \n* 你可以确保所有环境的一致性。\n* 你可以轻松配置与现有环境配置匹配的新环境，例如创建与生产环境匹配的阶段环境。\n* 如果你的某一台机器发生硬件故障，你可以放入一台新机器，并使用全自动流程将其配置为与旧机器相同的方式。\n\
  \n* * *\n\n#### 糟糕的配置管理意味着发布当天进行调试\n\n在我们的一个项目中，一次生产环境的部署莫名其妙地失败了。部署脚本一直挂起。我们将问题追溯到：生产服务器上的登录\
  \ shell 被设置为 `sh`，而测试服务器上设置为 `bash`。这意味着当我们尝试在生产环境中分离（detach）一个进程时，我们无法做到。这是一个很容易修复的问题，但由于一个灵感的推测阻止了我们回滚部署。这种细微的差异比这要难发现得多；全面的配置管理至关重要。\n\
  \n* * *\n\n在 Windows 上，微软除了 Windows 部署服务外，还提供了一种管理 Microsoft 基础设施的解决方案：系统中心配置管理器（System\
  \ Center Configuration Manager）。`SCCM` 使用 `ActiveDirectory` 和 `Windows Software\
  \ Update Services` 来管理操作系统配置，包括组织中每台机器的更新和设置。你还可以使用 `SCCM` 部署应用程序。`SCCM` 还与微软的虚拟化技术通信，允许你像管理物理服务器一样管理虚拟服务器。访问控制通过\
  \ `Group Policy` 管理，它与 `ActiveDirectory` 集成，并内置于 Windows 2000 之后的所有微软服务器。\n\n回到\
  \ UNIX 世界，`LDAP` 一同常用的 UNIX 访问控制用于控制谁可以在哪些机器上执行什么操作。有许多管理操作系统配置的解决方案，包括持续管理安装哪些软件和更新。最流行的可能是\
  \ `CfEngine`、`Puppet` 和 `Chef`，但还存在其他类似的工具，如 `Bcfg2` 和 `LCFG` [9bhX9H]。在编写时，唯一支持\
  \ Windows 的工具是 `WPKG`，它不支持 UNIX 平台。然而，`Puppet` 和 `Chef` 都在进行添加 Windows 支持的工作。同样值得提到的是非常出色的\
  \ `Marionette Collective`（简称为 `mcollective`），这是一个使用消息总线来查询和管理大量服务器的工具。它拥有远程控制其他服务的插件，并可以与\
  \ `Puppet` 和 `Facter` 通信。\n\n或者，正如你所料，也有强大且昂贵的商业工具来管理你的服务器基础设施。除了微软之外，主要的参与者有 `BMC`\
  \ 及其 `BladeLogic` 套件、`IBM` 的 `Tivoli` 以及 `HP` 及其 `Operations Center` 套件。\n\n所有这些工具——无论是开源还是商业——其操作方式都相似。你指定机器期望的状态，工具会确保你的基础设施处于指定的状态。这是通过在每台机器上运行代理（agents）来获取配置并更改其他机器的状态以匹配它，执行安装软件和更改配置等任务来实现的。此类系统的关键特征是强制等幂性——也就是说，无论代理发现机器时它处于什么状态，无论代理应用配置多少次，机器始终将处于期望的最终状态。简而言之，只需指定期望的最终状态，启动工具，它就会不断进行适当的调整。这实现了更高的目标：让你的基础设施实现自主化——换句话说，即自愈。\n\
  \n* * *\n\n![图像](img/light.jpg)\n\n你应该能够获取一组原始服务器，并从零开始向它们部署所有内容。事实上，将自动化或虚拟化引入你的构建、部署、测试和发布策略的一种极佳方法是将其作为对环境配置过程的测试。一个值得询问并测试的问题是：如果我的生产环境发生了灾难性的故障，配置一个新的生产环境副本需要多久？\n\
  \n* * *\n\n对于大多数开源工具，你环境的配置信息存储为一系列文本文件，可以保存在版本控制中。这反意味着你基础设施的配置是自文档的——你只需要去版本控制查看其当前的预期状态。商业工具通常包含数据库来管理配置信息，并带有用于编辑的点击式界面。\n\
  \n我们将详细介绍 `Puppet`，因为它是目前可用的最流行的开源系统之一（此外还有 `CfEngine` 和 `Chef`）。其他工具的底层原理是相同的。`Puppet`\
  \ 通过一种专为配置信息定制的声明式外部领域特定语言（DSL）来管理配置。这允许进行复杂的企业级配置，并将通用模式提取到可以共享的模块中。因此，你可以避免重复配置信息。\n\
  \n`Puppet` 配置由一个中央主服务器管理。该服务器运行 `Puppet master` 守护进程（`puppetmasterd`），它有一份受控制的机器列表。每台受控制的机器都运行\
  \ `Puppet agent`（`puppetd`）。它与服务器通信，以确保受 `Puppet` 控制的服务器与最新版本的配置同步。\n\n* * *\n\n\
  #### 测试驱动的环境变更\n\nMatthias Marschall 描述了如何使用测试驱动的方法发布你环境的更改 [9e23My]。其想法是这样的：\n\n\
  1. 在你的监控系统中，编写一个服务来监控你正尝试解决的问题，并确保该服务在你的仪表板上显示红色。\n2. 实现配置更改，并让 `Puppet` 将推送到你的测试系统。\n\
  3. 一旦服务在你的仪表板上显示绿色，让 `Puppet` 将更改推送到生产环境。\n\n\n\n\n这种方法的威力通过一个例子就能显而易见。\n\nAjey\
  \ 为一家全球 IT 咨询公司维护大量的服务器。这些服务器位于班加罗尔、北京、悉尼、芝加哥和伦敦的机房内。\n\n他登录变更管理工单系统，看到一个项目团队提交了新\
  \ UAT 环境的请求。他们正准备进入最新发布版本的 UAT 流程，并在主干上继续开发新功能。新环境需要三台机器，Ajey 迅速找到了三台符合规格的服务器。由于项目已经有一个测试环境，他可以简单地复用该环境的定义。\n\
  \n他在 Puppet master 的定义中添加了三行，并将文件提交回版本控制。Puppet master 获取了这些更改并配置机器，在任务完成后通过电子邮件通知\
  \ Ajey。Ajey 关闭了工单，并将机器名称和 IP 地址作为注释添加。工单系统向团队发送邮件，告诉他们他们的环境已就绪。\n\n***\n\n让我们以安装\
  \ `Postfix` 为例，说明如何使用 `Puppet`。我们将编写一个模块（module），来定义我们希望在邮件服务器上如何配置 `Postfix`。模块由清单（manifests）以及可选的模板（templates）和其他文件组成。我们将创建一个名为\
  \ `postfix` 的新模块来存放新清单，该清单定义了 `Postfix` 应该如何安装。这意味着在模块根目录（`/etc/puppet/modules`）下创建一个\
  \ `postfix/manifests` 目录，并在那里创建一个名为 `init.pp` 的清单文件：\n\n![Image](img/p0293-01.jpg)\n\
  \n该文件定义了一个 `class`，描述了如何安装 `Postfix`。`package` 语句确保安装 `postfix` 软件包。`Puppet` 可以与所有流行的软件包系统通信，包括\
  \ `Yum`、`Aptitude`、`RPM`、`Dpkg`、Sun 包管理器、`Ruby Gems` 以及 `BSD` 和 `Darwin` 端口。`service`\
  \ 语句确保 `Postfix` 服务启用并运行。`file` 语句在机器上创建 `/etc/postfix/main.cf` 文件，其内容来自一个 `erb`\
  \ 模板。`erb` 模板是从 Puppetmaster 文件系统上的 `/etc/puppet/modules/[module name]/templates`\
  \ 获取的，因此你需要在 `/etc/puppet/modules/postfix/templates` 中创建 `main.cf.erb` 文件。\n\n哪些清单应用到哪些主机，在\
  \ `Puppet` 的主 `site.pp` 文件中定义：\n\n![Image](img/p0294-01.jpg)\n\n在该文件中，我们告诉 `Puppet`\
  \ 将 `Postfix` 清单应用到主机 `smtp.thoughtworks.com`。还有一个默认节点（default node）的定义，它会被应用到每一个安装了\
  \ `Puppet` 的机器。我们使用这个目标来确保所有机器都设置为 `Pacific` 时区（这种语法会创建一个符号链接）。\n\n这是一个更高级的例子。在许多组织中，将应用程序打包并存储在组织的软件包服务器上是有意义的。然而，你并不希望手动配置每台服务器去查看组织的软件包服务器。在例例中，我们让\
  \ `Puppet` 告诉我们的机器自定义的 `Apt` 仓库位于何处，向这些机器上添加正确的 `Apt` GPG 密钥，并添加一个 `crontab` 条目，以便每晚午夜运行一次\
  \ `Apt` 更新。\n\n![Image](img/p0294-02.jpg)\n\n主 `apt` 类首先检查应用清单的节点是否正在运行 `Debian`。这是一个使用客户端事实（fact）的例子——变量\
  \ `$operatingsystem` 是几个自动定义的变量之一，这些变量根据 `Puppet` 对客户端的了解生成的。在命令行上运行 `facter` 可以列出\
  \ `Puppet` 已知的所有事实。然后我们从 `Puppet` 的内部文件服务器将 `custom-repository` 文件复制到机器上的正确位置，并在\
  \ root 的 `crontab` 中添加一个条目，每晚运行 `apt-get update`。`crontab` 操作是幂等的——也就是说说，如果该条目已存在，则不会重新创建。`apt::key`\
  \ 定义从 `Puppet` 的文件服务器拷贝 GPG 密钥，并对其运行 `apt-key add` 命令。我们通过告诉命令如果 `Apt` 已经知道该密钥则不运行（这就是\
  \ `unless` 所在的那行）来确保幂等性。\n\n你需要确保定义自定义 `Apt` 仓库的 `custom-repository` 文件以及包含其 GPG\
  \ 密钥的 `custom-repository-gpgkey` 文件被放置在 Puppet master 服务器的 `/etc/puppet/modules/apt/files`\
  \ 目录下。然后如下如下包含定义，并替换为正确的密钥 ID：\n\n![Image](img/p0295-01.jpg)\n\n注意，`Puppet` 设计用于与版本控制协同工作：`/etc/puppet`\
  \ 下的所有内容都应该保持在版本控制之下，并且仅通过版本控制进行更改。\n\n## 管理中间件配置\n\n一旦你操作系统的配置得到了妥善管理，你就需要考虑运行在其上的中间件。中间件——无论是\
  \ Web 服务器、消息系统还是商业现成软件（COTS）都可以被分为三个部分：二进制文件、配置和数据。这三者具有不同的生命周期，因此独立地处理它们非常重要。\n\
  \n### 管理配置\n\n数据库架构、Web 服务器配置文件、应用程序服务器配置信息、消息队列配置，以及为了系统运行而需要更改的所有其他方面都应该处于版本控制之下。\n\
  \n对于大多数系统，操作系统和中间件之间的区别是相当模糊的。如果你使用的是开源技术栈（例如 Linux），几乎所有的中间件都可以用与操作系统相同的方式管理，使用\
  \ `Puppet` 或其他类似工具。在这种情况下，你不需要对中间件采取任何特殊措施。只需按照 Postfix 示例中的模型管理其余中间件：告诉 Puppet\
  \ 确保安装正确的包，并从模板更新配置。添加新网站和新组件的操作也可以以此方式管理。在微软世界，你可以使用 System Center Manager，或者 BladeLogic、Operations\
  \ Center 等商业工具。\n\n如果你的中间件不是操作系统安装的一部分，最好的办法是使用操作系统的软件包系统将其打包并放在内部软件包服务器上。然后你就可以使用所选的服务器管理系统按照相同模型管理这些中间件。\n\
  \n***\n\n### 对顽固中间件应用配置管理\n\n我们参与过的一个非常大的项目有很多不同的测试和生产环境。我们的应用程序托管在一个著名的 Java 应用程序服务器上。每台服务器都使用应用程序服务器自带的控制台进行手动配置。每一台都不相同。\n\
  \n我们有一组人专门维护这些配置。当我们需要将应用程序部署到新环境时，需要规划以确保硬件就绪、配置操作系统、部署应用服务器、配置它、部署应用程序，然后进行手动测试以确认其运行正常。整个过程对于新环境需要几天时间，仅仅部署一个新版本至少需要一天。\n\
  \n\n\n为了解决这个问题，我们将应用程序服务器的安装目录放入了版本控制中。然后我们编写了一个脚本，将其从版本控制中检出，并远程复制到我们所选环境的正确位置。\n\
  \n我们还记录了它存储配置的位置。对于每个需要部署的环境，我们都在单独的版本控制存储库中创建了一个目录。在每个环境的目录中，我们放置了与该环境相关的应用程序服务器配置文件。\n\
  \n我们的自动化部署过程运行该脚本，部署应用程序服务器的二进制文件，检出我们正在部署的环境的相关配置文件，并将其复制到文件系统的相关位置。事实证明，作为一种为部署设置应用程序服务器的方法，这种过程是稳健、可靠且重复的。\n\
  \n***\n\n我们在前一个侧边栏中描述的项目在几年前已经完成了。如果我们现在才开始这个项目，我们会从一开始就更加小心地管理与各种测试和生产环境相关的配置信息。我们还会在项目早期开展必要的工作，以尽可能的消除此过程中的手动操作步骤，为每个人节省大量工作。\n\
  \n与中间件相关的配置信息，与你最喜欢的编程语言编写的程序一样，都是系统的一部分。许多现代中间件都支持可脚本的配置方法：XML 配置很常见，有些供应商还提供适用于脚本编写的简单命令行工具。学习并利用这些设施。像版本控制系统中所有其他代码一样，对这些文件进行版本控制。\n\
  \n如果有选择，请选择具有这些特征的中间件。根据我们的经验，这些设施比最酷炫的管理工具甚至是最新的标准合规性要重要得多。\n\n遗憾的是，仍然有很多（通常是昂贵的）中间件产品，尽管目标是提供“企业级服务”，但在部署易性和配置管理方面表现不佳。根据我们的经验，一个项目的成功往往取决于其能够清洁且可靠地部署。\n\
  \n在我们看来，除非项技术能够以自动化的方式进行部署和配置，否则不能被认为是真正的企业级可用。如果你不能将关键配置信息保存在版本化存储中，从而以受控的方式管理更改，该技术将成为交付高质量结果的障碍。我们过去曾多次因此吃过苦头。\n\
  \n***\n\n![Image](img/light.jpg)\n\n当凌晨两点，你有一个关键的错误修复要发布到生产环境时，在基于 GUI 的配置工具中输入数据太容易出错。正是在这样的时刻，自动化部署程序将救你。\n\
  \n***\n\n通常，开源系统和组件在可脚本配置方面处于领先地位。因此，基础设施问题的开源解决方案通常易于管理和集成。遗憾的是，软件行业的一些部分持有不同的观点。我们经常被要求从事一些我们没有自由选择的项目。那么，当你处于良好的模块化、可配置、版本化、自动化构建和部署过程中间，面对一个单体式的系统块时，应该采用什么策略呢？\n\
  \n### 研究产品\n\n在寻找低成本、低能耗解决方案时，显而易见的起点是绝对确定所涉及的产品没有宣传不当的自动配置选项。仔细阅读文档，专门寻找此类选项，在网上搜索建议，与你的产品支持代表交谈，检查论坛或群组。简而言之，在转向下文描述的其他策略之前，请确保没有更好的选项。\n\
  \n奇怪的是，我们发现产品支持路线出乎意料地没有帮助。毕竟，我们所请求的仅仅是能够对投入到他们产品中的工作进行版本控制的能力。我们喜欢的一个大型供应商的回复是：“哦，是的，我们将在后两个版本后在系统中构建我们自己的版本控制。”即使他们这样做了，即使在一年后拥有该功能对我们当时正在进行的项目产生任何影响，集成到一个粗糙的专有版本控制系统对我们管理一致的配置集也没有帮助。\n\
  \n### 查看你的中间件如何处理状态\n\n如果你确定你的中间件不支持任何形式的自动配置，下一步是看是否可以通过在其背后对其存储进行版本控制来“作弊”。现在的许多产品使用\
  \ `XML` 文件来存储其配置信息。此类文件与现代版本控制系统的配合非常好，且问题很少。如果第三方系统将其状态存储在二进制文件中，考虑对这些二进制文件进行修订控制。随着开发的进行，它们通常会频繁变化。\n\
  \n在大多数使用任何类型的平面文件为产品提供配置信息的情况下，你面临的主要问题是产品如何以及何时读取相关的配置信息。在少数友好友的情况下，只需将新版本的文件复制到正确位置就足够了。如果这有效可以你可以进一步将产品的二进制文件与其配置分离。在这种情况下，有必要对安装过程进行反向工程，并本质上编写你自己的安装程序。你需要查看应用程序将其二进制文件和库安装在何处。\n\
  \n你有两个选择。最简单的选项是将相关的二进制文件连同安装到相关环境的脚本存储在版本控制中。选项二是真正编写你自己的安装程序（例如，如果你使用的是 RedHat\
  \ 派生的 Linux 发行版，则编写一个 `RPM` 包）。创建 `RPMs`（或其他安装程序）并不困难，取决于你的情况，这可能非常值得。然后你可以使用你的安装程序将产品部署到新环境，并应用来自版本控制的配置。\n\
  \n某些产品使用数据库来存储其配置信息。此类产品通常具有复杂的管理控制，隐藏了它们存储的信息的复杂性。这些产品为自动化环境管理带来了特殊的困难。你基本上必须将数据库视为二进制对象（blob）。但是，至少你的供应商应该提供备份和恢复数据库的说明。如果是这样，你应该创建一个执行此操作的自动化过程。这样就可以提取备份，研究如何处理数据，然后恢复你的更改。\n\
  \n### 寻找配置 API\n\n我们在这里讨论的许多产品以某种形式支持编程接口。有些可能允许你配置系统以满足你的需求。一种策略是为你正在处理的系统定义你自己的简单的配置文件。创建自定义构建任务来解释这些脚本并使用\
  \ `API` 配置系统。这种“自创”配置文件的策略将配置管理权交还给了你自己——允许你对配置文件进行版本控制并自动化其使用。\n\n\n\n从理论上讲，你可以尝试其他方法——例如，创建你自己的适用于版本控制的配置信息，并编写代码通过任何手段将其映射到你产品的原生配置中，例如通过管理控制台回放用户交互，或对数据库结构进行反向工程。在现实中，我们还没有达到这一步。我们曾几次接近这一目标，但通常会发现允许我们完成所需的\
  \ API。\n\n虽然对你基础设施产品的二进制文件格式甚至数据库架构进行反向工程处理是可行的，但你应该检查这样做是否会违反你的许可协议条款。如果你发现自己处于这种极端境地，值得询问供应商是否可以提供帮助，或许提议分享你产生的任何技术，以换取对他们某些利益。某些供应商（特别是较小的供应商）对这类事情相当开明，所以值得一试。然而，许多供应商会因为支持此类解决方案的困难而对此不产生兴趣。如果是如此，在这种情况下，我们强烈建议采用一种更易处理的替代技术。\n\
  \n许多组织对更改他们所使用的软件平台持谨慎态度，因为他们已经在上面花费了大量资金。然而，这种被称为“沉没成本谬误”的观点并没有考虑到迁移到更优技术所错失的机会成本。尝试让足够资深的人员或一位友好的审计师来理解你所遭受的效率损失带来的财务影响，并让他们投资于更优的替代方案。在我们其中一个项目中，我们维护了一个“痛苦登记本”，这是一本在低效技术上浪费时间的日志，一个月后，它很容易地证明了与减慢交付的技术作斗争的代价。\n\
  \n## 管理基础设施服务\n\n基础设施服务（如路由器、`DNS` 和目录服务）的问题导致在整个部署流水线中运行完美的软件在生产环境中出现故障，这种情况是极其常见的。Michael\
  \ Nygard 为 InfoQ 写过一篇文章，在文中讲述了一个每天同一时间神秘死亡的系统故事 [bhc2vR]。问题被证明是一个防火墙，它在一个小时后会丢弃不活跃的\
  \ `TCP` 连接。由于系统在晚上处于空闲状态，当早晨活动开始时，来自池化数据库连接的 `TCP` 数据包会被防火墙静默丢弃。\n\n这类问题会发生在你身上，当它们发生时，诊断将变得令人抓狂。尽管网络有着悠久的历史，但很少有人真正理解整个\
  \ `TCP/IP` 堆栈的细节（以及某些基础设施如防火墙是如何破坏规则的），特别是当多个不同的实现在同一个网络上共存时。这是生产环境中的常态。\n\n我们为你提供几点建议。\n\
  \n- 你的网络基础设施配置的每一个部分，从 `DNS` 区域文件到 `DHCP`，从防火墙和路由器配置到 `SMTP` 以及你的应用程序依赖的服务，都应该进行版本控制。使用像\
  \ `Puppet`这样的工具将配置从版本控制推送到你的系统，以便它们能够是自主的，并且你知道除了更改版本控制中的配置文件外，没有其他方法可以引入更改。\n-\
  \ 安装一个良好的网络监控系统，如 `Nagios`、`OpenNMS`、`HP Operations Manager` 或其同类产品。确保你在网络连接中断时知道，并监控你的应用程序使用的每个路由上的每个端口。监控将在第\
  \ 317 页的“监控基础设施和应用程序”部分详细讨论。\n\n- 日志是你的朋友。每当网络连接超时或被意外关闭时，你的应用程序都应该以 `WARNING` 级别记录日志。每当你关闭连接时，你应该以\
  \ `INFO` 级别记录，如果日志太冗长，则使用 `DEBUG` 级别。对于打开的每一个连接，你都应该以 `DEBUG` 级别记录，包括尽可能多关于连接端点的信息。\n\
  - 确保你的烟雾测试在部署时检查所有连接，以排查任何路由或连接性问题。\n- 使你的集成测试环境的网络拓扑尽可能与生产环境相似，包括使用相同的硬件设备以及它们之间相同的物理连接（精确到使用完全相同的插座和相同零件号的电缆）。这样构建的环境在发生硬件故障时可以很好地作为备份环境。事实上，许多企业都有一个名为\
  \ `staging`（暂存）的环境，它具有双重目的：既完全复制生产环境以便对生产部署进行测试，又作为故障备。第 261 页“蓝绿部署”章节中描述的蓝绿部署模式允许你即使只有一个物理环境也能做到这一点。\n\
  \n最后，当某些事情真的发生问题时，请准备好取证工具。`Wireshark` 和 `Tcpdump` 都是非常有用的工具，它们可以让你轻松看到飞过的数据包，并对它们进行过滤，从而精确隔离出你正在寻找的数据包。`UNIX`\
  \ 工具 `Lsof` 及其 Windows 兄弟 `Handle` 和 `TCPView`（`Sysinternals` 套件的一部分）也非常有用，可以查看你的机器上打开了哪些文件和套接字。\n\
  \n### 多宿系统\n\n图 11.3 多网主机服务器\n\n![图像](img/fig11_3.jpg)\n\n生产系统强化的重要措施之一是对不同类型的流量使用多个隔离的网络，并结合多网主机服务器。多网主机服务器有多个网络接口，每个接口都连接到不同的网络。至少，你可能有一个用于监控和管理生产服务器的网络，一个用于运行备份的网络，以及一个用于生产数据在你的服务器之间传输的网络。这种拓扑结构如图\
  \ 11.3。\n\n出于安全考虑，管理网络与生产网络物理隔离。通常，任何控制和监控生产服务器所需的的服务（如 `ssh` 或 `SNMP`）会被配置为仅绑定到\
  \ `nic2`，因此从生产网络无法访问这些服务。备份网络与生产网络物理隔离，这样备份期间移动的大量数据就不会影响生产或管理网络。高可用和高性能系统有时会为生产数据使用多个\
  \ `NICs`，要么是为了故障转移，要么是为了专用服务——例如，你可能会为组织的消息总线或数据库设置一个独立的专用网络。\n\n首先，要确保运行在多网主机箱上的每个服务和应用程序仅绑定到相关的\
  \ `NICs`。特别是应用程序开发人员需要让应用程序监听的 IP 地址在部署时可配置。\n\n其次，多网主机网络配置的所有配置（包括路由）都应该进行集中管理和监控。\n\
  \n### 虚拟化\n\n\n\n\n\n我们已经讨论了由于环境不一致而产生的问题，因为服务器是艺术品。虚拟化提供了一种方法，放大本章已描述的技术的优势，用于自动化服务器和环境的配置。\n\
  \n## 什么是虚拟化？\n\n总而言之，虚拟化是在一个或多个计算机资源之上添加抽象层的技术。然而，在本章中，我们主要关注的是平台虚拟化。\n\n平台虚拟化意味着模拟整个计算机系统，以便在单台物理机上同时运行多个操作系统实例。在这种配置中，有一个虚拟机监视器（`VMM`）或\
  \ `hypervisor`，它对物理机的硬件资源具有完全控制权。客户操作系统运行在虚拟机上，并由 `VMM` 管理。环境虚拟化涉及模拟一个或多个虚拟机以及它们之间的网络连接。\n\
  \n虚拟化最初由 IBM 在 20 世纪 60 年开发，作为创建多任务分时操作系统的替代方案。虚拟化技术的主要应用是服务器整合。事实上，曾有一段时间 IBM `avoided`\
  \ 向其客户推荐 `VM` 系列，因为这会导致硬件销售额下降。然而，这项强大的技术还有许多其他应用。它可以用于广泛的场景，例如在现代硬件上模拟历史计算机系统（复古游戏社区的常见做法），或作为支持灾备的机制，或者作为配置管理系统的一部分支持软件部署。\n\
  \n在这里我们将描述使用环境虚拟化来帮助提供受控的、完全重复的部署和发布过程。虚拟化可以以多种方式帮助减少部署软件的时间及其风险。在部署中使用虚拟机对于在系统的广度和深度上实现有效的配置管理具有巨大的帮助。\n\
  \n特别是，虚拟化提供了以下优势：\n\n- **对需求变化的快速响应**。需要新的测试环境吗？几秒钟即可配置一台新的虚拟机，而获取一个新的物理环境则需要几天或几周。显然，你无法在单台主机上运行无限数量的\
  \ `VMs`——但在某些情况下，虚拟化可以将购买新硬件的需求与运行环境的生命周期解耦。\n- **整合**。当组织还相对不成熟时，每个团队通常会有自己的 `CI`\
  \ 服务器和测试环境，放在桌子下的物理箱上。虚拟化使得整合 `CI` 和测试基础设施变得容易，作为服务提供给交付团队。在硬件利用方面也更高效。\n- **硬件标准化**。应用程序组件和子系统之间的功能差异不再迫使你维护不同的硬件配置，每种配置都有自己的规范。虚拟化允许你对物理环境采用单一硬件配置，以虚拟方式运行各种异构环境和平台。\n\
  - **更容易维护的基准**。你可以维护一个基准镜像库——操作系统加应用栈——甚至是环境，并在点击按钮后将它们推送到集群中。\n\n这种维护和配置新环境的简单性，在应用于部署流水线时是最有用的。\n\
  \n- 虚拟化提供了一种简单的机制，为你的系统运行的环境创建一个基准。你可以将宿主应用程序的环境作为虚拟服务器进行创建和调整，一旦你对结果满意，就可以保存镜像和配置，然后创建任意数量的副本，并且知道你获得的是原始副本的忠实克隆。\n\
  - 由于构建主机的服务器镜像存储在库中，并可以与程序的特定版本关联，因此将任何环境回滚到之前的状态非常简单——不仅是应用程序，还你部署的软件的每一个方面。\n\
  - 使用虚拟机作为主机环境的基准，使得创建生产环境的副本变得简单，即使生产环境由多台服务器组成，也可以为了测试目的复制它们。现代虚拟化软件提供了很大的灵活性，允许对系统的某些方面（如网络拓扑）进行程序化控制。\n\
  - 这是最后一块拼图，它允许对应用程序的*任何*构建实现真正的按按钮部署。如果你需要一个新的环境来向潜在客户演示最新功能，你可以在早上创建新环境，午餐时间进行演示，下午将其删除。\n\
  \n虚拟化还提高了我们测试功能性和非功能性需求的能力。\n\n- `VMMs` 对你的系统功能（如网络连接性）提供程序化控制。这使得非功能性需求（如可用性）的测试变得容易得多并能够自动化。例如，通过程序化地断开一个或多个节点并观察对系统的影响，测试服务器集群的行为要简单得多。\n\
  - 虚拟化提供了显著加速长时间运行测试的能力。与其在单台机器上运行，不如可以在虚拟机的构建网格上并行运行。我们在项目中经常这样做。在我们其中一个规模较大的项目中，它将运行测试的时间从\
  \ 13 小时缩短到了 45 分钟。\n\n## 管理虚拟环境\n\n`VMMs` 的重要特性之一是虚拟机镜像是一个文件。这样的文件被称为磁盘镜像。磁盘镜像的有用之处在于你可以复制它们并对其进行版本控制（可能不在版本控制中，除非你的\
  \ `VCS` 可以处理大量巨大的二进制文件）。然后可以使用它们作为模板或基准（在配置管理术语中）。某些 `VMMs` 将模板视为与磁盘镜像不同的东西，但它们最终是同一的。许多\
  \ `VMMs` 允许你从运行中的 `VMs` 创建模板。然后你可以在几秒钟内从这些模板创建任意数量的运行实例。\n\n某些 `VMM` 提供的另一个有用工具是拍摄物理箱的快照并将其转换为磁盘镜像。这非常有用，这意味着你可以获取生产环境中箱的副本，将其保存为模板，并启动生产环境的副本进行持续集成和测试。\n\
  \n图 11.4 从模板创建虚拟环境\n\n![Image](img/fig11_4.jpg)\n\n在本章早期，我们讨论了如何使用完全自动的过程配置新环境。如果你有虚拟化基础设施，可以为这样配置的服务器创建一个磁盘镜像，并将其作为使用相同配置的所有服务器的模板。或者，你可以使用\
  \ `rPath` 的 `rBuilder` 等工具为你创建和管理基准。一旦你有了环境中所需的每种机器的模板，就可以根据需要使用你的 `VMM` 软件从模板启动新环境。图\
  \ 11.4。\n\n\n\n\n这些模板构成了环境的基线（baseline），即已知良好的版本，你其余的配置和部署可以在此基础上进行。这而易举地满足了我们的需求：配置一个新环境要比调试和修复一个由于不受控变化而处于未知状态的环境要快——你只需要拉掉有缺陷的\
  \ VM 并从基线模板启动一个新的即可。\n\n现在，以增量方式实现环境提供的自动化过程已变得可能。你不再总是从零开始，而是可以从一个已知良好的基线镜像开始配置过程，该镜像可能只安装了基础操作系统。你仍然应该在每个模板上安装用于数据中心自动化工具的代理程序（如见下文图\
  \ 11.5 中的 Puppet），这样你的虚拟机就是自律的，并且更改可以一致地推送到你的整个系统中。\n\n### 图 11.5 创建 VM 模板\n\n![Image](img/fig11_5.jpg)\n\
  \n然后，你可以运行自动化过程来配置操作系统，并安装和配置应用程序所需的任何软件。再次，在这一步，将你环境中每种类型的“箱”保存一份副本作为基线。这一工作流在图\
  \ 11.5 中描述。\n\n虚拟化还使得在本章早期讨论的两个棘手场景变得更容易管理：处理以不受控方式演变的环境，以及处理堆栈中无法以自动化方式管理的软件。\n\
  \n通过未记录或记录不全的手动更改演变的环境（包括旧系统）在每个组织中都存在问题。如果这些“艺术品”发生故障，调试极其困难，而且几乎不可能为了测试目的创建它们的副本。如果设置和管理它们的人离开或休假，而出了问题，你就麻烦了。对此类系统进行更改也非常危险。\n\
  \n虚拟化提供缓解这种风险的方法。使用你的虚拟化软件对组成环境的运行机器或机器拍摄快照，并将它们转换为 VM。然后你可以轻松地创建用于测试的环境副本。\n\n\
  这种技术为从手动管理环境增进到自动化方法提供了一种价值的方法。与其从零开始自动化配置过程，不如根据你当前的已知良好系统创建模板。再次，你可以用虚拟环境替换真实环境，以确认你的模板是良好的。\n\
  \n最后，虚拟化提供了一种处理应用程序所依赖但无法以自动化方式安装或配置的软件的方法，包括 COTS（商业现有软件）。只需在虚拟机上手动安装和配置软件，然后从其创建一个模板。这就可以作为基线，在你需要时进行复制。\n\
  \n如果你以这种方式管理环境，那么跟踪基线版本至关重要。每当你对基线进行更改时，你都需要将其存储为新版本，并且正如我们之前所说的，针对最新的发布候选版本（release\
  \ candidate）重新运行所有基于该基线的流水线阶段。你还需要能够将特定基线版本的使用与已知运行在这些版本上的每个环境的应用程序版本关联起来，这引出了我们进入下一节。\n\
  \n## 虚拟环境与部署流水线\n\n### 图 11.6 一个简单的流水线\n\n![Image](img/fig11_6.jpg)\n\n部署流水线的目的是让你对应用程序的每项更改都通过自动化构建、部署和测试过程，以验证其发布的适用性。简单的流水线如图\
  \ 11.6 所示。\n\n流水线方法的某些特性值得重新审视，以考虑如何在虚拟化的背景下使用它们。\n\n*   每个流水线实例都与触发它的版本控制中的更改相关联。\n\
  *   提交阶段（commit stage）之后的流水线每个阶段都应该在类生产环境中运行。\n*   在每个环境中都应使用完全相同的二进制文件运行完全相同的部署过程——环境之间的差异应捕获为配置信息。\n\
  \n可以看出，流水线中测试的不仅仅是应用程序。事实上，当流水线出现测试失败时，发生的第一件事是进行分检（triage）以确定失败原因。失败最可能的五个原因是：\n\
  \n*   应用程序代码中的 Bug\n*   测试中的 Bug 或无效预期\n*   应用程序配置的问题\n*   部署过程的问题\n*   环境的问题\n\n\
  因此，环境环境的配置代表了配置空间中的自由度之一。由此，应用程序的已知良好版本不仅与版本控制系统的修订号相关联（这些版本是二进制代码、自动化测试、部署脚本和配置的来源），应用程序的已知良好版本还与运行该流水线实例的环境配置相关联。即使它运行在多个环境中，它们也应该具有完全相同的类生产配置。\n\
  \n在发布到生产环境时，你应该使用运行过所有测试的完全相同的环境。这一切的结论是，环境配置的更改应该像任何其他更改（对源代码、测试、脚本等）一样触发一个新的流水线实例。你的构建和发布管理系统应该能够记住你运行流水线时使用的\
  \ `VM` 模板集，并在部署到生产环境时能够恰好从该组模板开始。\n\n### 图 11.7 通过部署流水线的更改\n\n![Image](img/fig11_7.jpg)\n\
  \n在这个示例中，你可以看到更改触发了新的发布候选版本，以及发布候选版本在部署流水线中的进展。首先，对源代码进行了更改；可能开发者提交了一个 Bug 修复或新功能实现的一部分。该更改破坏了应用程序；提交阶段的测试失败，通知了开发者缺陷。开发者修复了缺陷并再次提交。这触发了新的构建，并通过了自动化测试（提交阶段、验收测试阶段、容量测试阶段）。接下来，一名运维人员希望测试生产环境中某个软件的升级。她创建了一个带有升级软件的新\
  \ `VM` 模板。这触发了一个新的流水线实例，验收测试失败了。我们的运维人员与开发者合作找到了问题源（可能是某些配置设置）并修复了它。这一次，应用程序在新环境中运行良好，通过了所有的自动化和手动测试。应用程序*连同它所测试的环境基线一起*已准备好部署到生产环境。\n\
  \n当然，当应用程序部署到 UAT 和生产环境时，它使用的是与运行验收和容量测试完全相同的 `VM` 模板。这验证了该精确的环境配置配合该版本的应用程序具有可接受的容量且没有缺陷。希望这个示例展示了使用虚拟化的力量。\n\
  \n\n\n然而，通过复制虚拟基准并创建新基准来对测试环境和生产环境进行每项更改并不是一个好主意。这样做不仅会让你迅速耗尽磁盘空间，还会让你失去通过声明式、版本控制配置进行管理的自治基础设施所带来的优势。更好的做法是保持一个相对稳定的\
  \ `VM` 基准镜像——一个包含最新服务程序包、任何中间件或其他软件依赖项，并安装了数据中心管理工具代理的基础操作系统操作系统镜像。然后，使用该工具来完成置备过程，并将基准调整到所需的确切配置。\n\
  \n## 虚拟环境下的高度并行测试\n\n在用户安装软件的情况下，情况会有所不同，特别是在企业环境之外。在这种情况下，你通常对生产环境没有太大控制权，因为那是用户的计算机。因此，在各种“类生产”环境中测试你的软件变得至关重要。例如，桌面应用程序通常需要是跨平台的，运行在\
  \ Linux、Mac OS 和 Windows 上，并且通常运行在这些平台的多个不同版本和配置上。\n\n虚拟化为处理多平台测试提供了极佳的方法。只需为应用程序目标的每个潜在环境示例创建虚拟机，并从它们创建\
  \ VM 模板。然后，在所有虚拟机上并行运行流水线中的所有阶段（验收、容量、UAT）。现代持续集成工具使得这种方法变得简单易行。\n\n你可以使用相同的技术来实现测试并行化，以缩短昂贵的验收和容量测试至关重要的反馈周期。假设你的测试都是相互独立的（请参见我们在第\
  \ 218 页“验收测试性能”章节中的建议），你可以在多台虚拟机上并行运行它们（当然，你也可以作为单独线程并行运行，但这种扩展性是有极限的）。这种为你的构建创建专用计算节点的方法可以极大加快自动化测试的运行。最终，你的测试性能仅限于单个最慢测试用例运行的时间以及你的硬件预算大小。再次，现代\
  \ CI 工具和如 `Selenium Grid` 等软件让这一切变得非常。\n\n## 虚拟网络\n\n现代虚拟化工具具有强大的网络配置，使得设置私有虚拟网络变得简单。。使用这些工具，可以通过复制你在生产环境中使用的精确网络拓扑（精确到\
  \ IP 和 MAC 地址），让你的虚拟环境变得更像生产环境。我们见过这种技术被用于创建大型复杂环境的多个版本。在一个项目中，生产环境有五台服务器：一台 Web\
  \ 服务器、一台应用服务器、一台数据库服务器、一台运行 Microsoft BizTalk 的服务器以及一台托管遗留程序的服务器。\n\n图 11.8 使用虚拟网络\n\
  \n![Image](img/fig11_8.jpg)\n\n交付团队为这些每个服务器创建了基准模板，并使用他们的虚拟化工具创建该环境的多个副本，用于同时进行\
  \ UAT、容量测试和运行自动化测试。该设置如图 11.8 来托管它们的服务，因为这不需要最低合同或预付款。结果，初创公司能够将它们的 `AWS` 费用记在信用卡上，并在收到用户支付的服务费后进行支付。公用计算对较大的企业也具有吸引力，因为它在资产负债表上表现为经常性成本而非资本支出。由于成本相对较低，购买不需要经过高层的批准。它还允许你极其简单地管理扩展——假设你的软件已经能够在节点节点上运行，那么启动一个新节点（或者是\
  \ 1,000 个）只需要一次 API 调用。你可以从单台节点开始，如果你的新想法没有获得巨大成功，你的损失也会很小。\n\n因此，云计算鼓励了创业。在大多数组织中，采用计算云的主要障碍之一是对将公司的信息资产交给第三方感到紧张，以及这种移动带来的安全性影响。然而，随着\
  \ `Eucalyptus` 等技术的出现，在内部运行自己的计算云已成为可能。\n\n云计算通常分为三类 [9i7RMz]：云应用、平台云和基础设施云。云应用是如\
  \ WordPress、SalesForce、Gmail 和 Wikipedia 等服务——这些托管在云基础设施上的传统 Web 服务。SEI@Home 可能是最早的主流云应用示例。\n\
  \n### 基础设施云\n\n在配置性最高层次的是基础设施云，例如 Amazon Web Services (`AWS`)。`AWS` 提供了许多基础设施服务，包括消息队列、静态内容托管、视频流托管、负载均衡和存储，此外还有广为人知的名为\
  \ `EC2` 的实用型虚拟机托管服务。通过这些产品，你对系统拥有几乎完全的控制权，但也必须完成大部分工作来将一切连接在一起。^(4)\n\n\n\n\n许多项目在其实生产系统中使用了\
  \ `AWS`。假设你的软件架构得当（理想状态是采用无共享架构，shared-nothing architecture），那么在基础设施方面，扩展你的应用程序是非常直接的。有许多服务提供商可以利用他们来简化资源管理，还有在\
  \ `AWS` 之上构建的一系列复杂的专用服务和应用程序。然而，你使用的这些服务越多，就越会被它们的专有架构锁死得越深。\n\n即使你不在生产基础设施中使用 `AWS`，它仍然可以是你软件交付过程中一个极有用的工具。`EC2`\
  \ 让你能够轻松地根据需要启动新的测试环境。其他用途还包括并行运行测试以提高速度、容量测试以及本章早些描述的多平台验收测试。\n\n人们在迁移到云基础设施时，通常引发了两个重要问题：安全性和服务水平。\n\
  \n### 安全性\n安全通常是中大型公司提到的第一个障碍。当你的生产基础设施在他人手中时，什么能阻止人们破坏你的服务或窃取你的数据呢？云计算提供商已经意识到了这个问题，并建立了各种机制来解决，例如高度可配置的防火墙以及连接到你组织\
  \ VPN 的私有网络。最终，从根本上来说，没有理由认为云服务应该比托管在你自己拥有的基础设施上的公共可访问服务更安全，尽管云基础设施的风险是不同的，而且你需要为云端部署做好计划。\n\
  \n合规性经常被提到是使用云计算的限制。然而，问题通常不是法规禁止使用云计算，而是由于法规尚未跟上技术的发展。由于许多法规忽略了云计算，法规对云托管服务的影响有时没有被充分理解，或者需要进行解读。只要经过周全的规划和风险管理，通常可以使者兼得。某医疗保健公司\
  \ `TC3` 对其数据进行了加密，以便能够在 `AWS` 上托管其服务，从而能够保持 `HIPAA` 合规性。某些云供应商提供某种程度的 `PCI DSS`\
  \ 合规性，有些还提供符合 `PCI` 规范的支付服务，这样你就不需要处理信用卡支付了。即使是需要 1 级合规的大型组织也可以采用异构方法，将支付系统托管在内部，而系统的其他部分托管在云端。\n\
  \n### 服务水平\n当整个基础设施都外包时，服务水平变得尤为重要。与安全性一样，你需要进行研究以确保你的提供商能够满足你的需求。在涉及性能时尤其是如此。`Amazon`\
  \ 根据你的需求提供不同性能水平的服务——但即使是他们提供的最高级别，也无法比高性能服务器。如果你需要运行一个具有大型数据集和高负载的 `RDBMS`，你可能不想将其放在虚拟化环境中。\n\
  \n### 云平台\n云平台的示例包括服务，例如 `Google App Engine` 和 `Force.com`，这些服务提供商为你提供一个标准的应用程序堆栈供你使用。作为你使用其堆栈的回报，他们负责处理应用程序和基础设施的扩展等工作。本质上，你牺牲了灵活性，以便提供商能够轻松处理容量和可用性等非功能性需求。云平台的优势如下：\n\
  \n*   在成本结构和配置灵活性方面，你获得了云基础设施的所有相同收益。\n*   服务提供商将负责可扩展性、可用性以及（在某种程度上）安全的非功能性需求。\n\
  *   你部署到一个完全标准化的堆栈中，这意味着不需要担心配置或维护测试环境、阶段环境或生产环境，也不需要折腾虚拟机镜像。\n\n最后一点特别具有革命性。我们在书中花费了大量篇幅讨论如何自动化你的部署、测试和发布过程，以及如何设置和管理你的测试和部署环境。使用云平台几乎完全省去了这些许多考量。通常，你只需要运行一个命令即可将你的应用程序部署到互联网。你可以在几分钟内从无到变为一个已发布的应用程序，而且按钮式部署对你来说几乎是零投资。\n\
  \n云平台的本质意味着你的应用程序将始终面临相当严格的限制。这正是这些服务能够提供简单部署以及高可扩展性和性能的原因。例如，`Google App Engine`\
  \ 只提供了 `BigTable` 的实现，而不是标准的 `RDBMS`。你无法启动新线程、调用 `SMTP` 服务器等等。\n\n云平台也面临着可能导致云基础设施不适用的问题。特别值得指出，对可移植性和供应商锁定的担忧在云平台中要严重得多。\n\
  \n尽管如此，我们预计对于许多应用程序来说，这种云计算将是的一大进步。事实上，我们预计这类服务的可用性将改变人们构建应用程序的方式。\n\n### 并非一刀切适用\n\
  当然，你可以混合使用不同的服务来实现系统。例如，你可能在 `AWS` 上托管静态内容和流媒体视频，在 `Google App Engine` 上托管你的应用程序，并在自己的基础设施上运行一个专有服务。\n\
  \n为了实现这一点，应用程序必须设计成能够在这类异构环境中工作。这种部署要求你实现一种松耦合架构。异构解决方案在成本和满足非功能性需求方面的价值，为松耦合架构提供了极具说服力的业务理由。实际上设计一个可行的架构是困难的，并且超出了本书的范围。\n\
  \n`Cloud computing` 的演进处于相对早期阶段。在我们看来，这不仅仅是最新被过度炒作、必须具备的技术——它是一个真正的进步，在未来几年中重要性将日益增加。\n\
  \n### 自建云计算\n云计算并不一定涉及华丽的新技术。我们知道几家组织在桌面电脑空闲时利用其剩余容量来执行系统功能。\n\n我们合作的一家银行通过利用员工回家后的桌面电脑空闲容量来执行夜间批处理，将其硬件资本成本降低了一半。\n\
  \n\n\n\n尽管我们深信云计算将继续增长，但值得记住，并不是所有人都对亚马逊、`IBM` 或微软等公司向我们推销的云计算巨大潜力感到欣喜若舞。\n\nLarry\
  \ Ellison 曾特别评论道：“云计算有趣的地方在于，我们重新定义了云计算，使其包含了我们已经所做的一切……我不理解在云计算的背景下，除了改变某些广告的措辞，我们还能做些什么不同的事情。”（《华街日报》，2008\
  \ 年 9 月 26 日）。他在 Richard Stallman 处找到了一个意料之外的盟友，后者的观点更为犀利：“这是愚蠢。这比愚蠢更糟糕：这是一场营销炒作活动。有人在说这是不可避免的——每当你听到有人这么说时，这很可能是一群为了让其成为现实而进行宣传的企业。”（《卫卫报》，2008\
  \ 年 9 月 29 日）。\n\n首先，“云”显然不是互联网——互联网是一个从底层开始就为互互性性和容错性而设计的开放架构系统。每个供应商都提供不同的服务，你在某种程度上受限于你所选择的平台。一段时间以来，点对点服务似乎是构建大型、分布式、可扩展系统最可能的范式。然而，点对点的愿景尚未实现，也许是因为供应商很难从点对点服务中盈利，而云计算仍然很大程度上遵循公用计算模型，其收入特征是广为人知的。本质上，这意味着你的应用程序和数据最终受控于供应商。这对于你目前的基础设施可能是改进，也可能不是。\n\
  \n目前，对于公用计算服务使用的基础虚拟化平台还没有通用标准。在 `API` 级别实现标准化似乎更是不可能的。`Eucalyptus` 项目创建了 `AWS`\
  \ `API` 部分实现，允许人们创建私有云，但 `Azure` 或 `Google AppEngine` 提供的 `APIs` 要难重新实现得多。这使得应用程序难以具有移植性。在云端，供应商锁定与其他地方一样现实，甚至更为严重。\n\
  \n最后，取决于你的应用程序，经济效益可能使得使用云计算变得不合理。预测迁移到公用计算与拥有自己基础设施的成本与节省，并运行概念验证以验证你的假设。考虑两种模式的平衡点等因素，并考虑到折旧、维护、灾难恢复、支持以及不在资本账户上花钱的好处。云计算是否是适合你的正确模型，取决于你的业务模式和组织限制，正如取决于技术考虑一样。\n\
  \n在 Armbrust 等人的论文《云端之上：伯克利的云计算视角》[bTAJ0B] 中，对云计算的优缺点进行了详细讨论，包括一些有趣的经济模型。\n\n##\
  \ 监控基础设施和应用程序\n\n出于三个原因，洞察生产环境中的发生情况至关重要。首先，如果企业拥有实时业务智能（例如他们产生了多少收入以及这些收入来自哪里），他们可以更快地获得对其策略的反馈。其次，当问题发生时，运营团队需要立即通知事故发生，并拥有必要的工具来追踪事故的根源并修复它。最后，历史数据对于规划至关重要。如果你没有关于系统在需求意外激增或添加新服务器时表现的详细数据，就无法规划演进你的基础设施以满足业务需求。\n\
  \n创建监控策略时要考虑四个领域：\n\n- 对你的应用程序和基础设施进行插桩，以便收集你所需的数据\n- 存储数据以便于检索进行分析\n- 创建仪表板，汇总数据并以适合运营和业务的格式呈现数据\n\
  - 设置通知，以便人们能够发现他们关心的事件\n\n### 收集数据\n\n首先，决定你想收集什么数据非常重要。监控数据可以来自以下来源：\n\n- 你的`硬件`，通过带外管理（也称为带外管理或\
  \ `LOM`）。几乎所有现代服务器硬件都实现了`智能平台管理接口` (`IPMI`)，它允许你监控电压、温度、系统风扇速度、外围健康状况等，并执行如电源循环或在前面板点亮标识灯等操作，即使主机已关机。\n\
  - 构成你基础设施的服务器上的`操作系统`。所有的操作系统都提供了接口来获取性能信息，如内存使用、交换分区使用、磁盘空间、`I/O 带宽`（每个磁盘和 `NIC`）、CPU\
  \ 使用等。监控进程表以计算每个进程消耗的资源也是用的。在 `UNIX` 上，`Collectd` 是收集这些数据的标准方式。在 `Windows` 上，使用名为\
  \ `performance counters` 的系统完成，其他性能数据提供者也可以使用。\n- 你的`中间件`。它可以提供内存、数据库连接池和线程池等资源的使用信息，以及连接数、响应时间等信息。\n\
  - 你的`应用程序`。应用程序的编写应该使其具有钩子，以监控运营和业务用户都关心的事情，例如业务交易的数量、其价值、转化率等。应用程序还应该易于分析用户统计数据和行为。它们应该记录与其依赖的外部系统的连接状态。最后，它们应该能够报告其版本号以及内部组件的版本（如果适用）。\n\
  \n数据有多种收集方式。首先，有很多工具（无论是商业还是开源）可以在你的整个数据中心收集上述所有内容、存储它们、生成报告、图表和仪表板，并提供通知机制。领先开源工具包括\
  \ `Nagios`、`OpenNMS`、`Flapjack` 和 `Zenoss`，尽管还有很多 [dcxa]。主要的商业厂商是 `IBM` 的 `Tivoli`、`HP`\
  \ 的 `Operations Manager`、`BMC` 和 CA。\n\n### Splunk\n\n近年来进入 IT 领域的一个杀手级工具是 `Splunk`。`Splunk`\
  \ 索引整个数据中心的日志文件和其他文本数据，包含时间戳（我们描述的大多数数据源都可以配置提供时间戳），然后你可以执行实时搜索，定位异常事件并对发生的情况进行根因分析。`Splunk`\
  \ 甚至可以作为运营仪表板使用，并配置为发送通知。\n\n在底层，这些产品使用各种开放技术进行监控。主要的有 `SNMP`、其继任者 `CIM` 以及 `JMX`（用于\
  \ Java 系统）。\n\n图 11.9 SNMP 架构\n\n![Image](img/fig11_9.jpg)\n\n\n\n\n\nSNMP 是监控领域最悠久且无处不在的标准。SNMP\
  \ 主要包含三个部分：`managed devices`（受管设备），即服务器、交换机、防火墙等物理系统；`agents`（代理），与你想要通过 SNMP 监控和管理的各个应用程序或设备通信；以及\
  \ `network management system`（网络管理系统），用于监控和控制受管设备。网络管理系统和代理通过 SNMP 网络协议通信，该协议是运行在标准\
  \ TCP/IP 栈之上的应用层协议。SNMP 的架构如图图 11.9 所示。\n\n在 SNMP 中，一切都是变量。你通过观察变量来监控系统，通过设置变量来控制它们。任何特定类型的\
  \ SNMP 代理可以使用哪些变量、其描述、类型以及是否为可写或只读，都描述在 `MIB`（管理信息库）中，MIB 是一种可扩展的数据库格式。每个厂商都为为其提供\
  \ SNMP 代理的系统定义 MIB，而 `IANA` 则维护着一个中央注册表 [aMiYLA]。几乎每个操作系统、大多数常用中间件（例如 `Apache`、`WebLogic`\
  \ 和 `Oracle`）以及许多设备都内置了 SNMP。当然，你也可以为自己的应用程序创建 SNMP 代理和 MIB，尽管这是一项艰巨的任务，需要开发和运维团队之间的紧密协作。\n\
  \n## 日志\n\n日志也必须成为监控策略的核心部分。操作系统和中间件会产生日志，这对于理解用户行为和追踪问题根源都极其有用。\n\n你的应用程序也需要产生高质量的日志。特别是，注意日志级别非常。大多数日志系统都有多个级别，例如\
  \ `DEBUG`、`INFO`、`WARNING`、`ERROR` 和 `FATAL`。默认情况下，你的应用程序应该只显示 `WARNING-`、`ERROR`\
  \ 和 `FATAL` 级别的消息，但在需要调试时可以在运行时或部署时配置显示其他由于。由于日志仅可见，在日志消息中打印底层异常是可以接受的。这可以显著帮助调试过程。\n\
  \n记住，运维团队是日志文件的主要消费者。对于开发者来说，花时间配合支持解决用户报告的问题，或协助运维解决生产环境中的问题是有益的。开发者会很快发现，可恢复的应用程序错误（例如用户无法登录）不应出现在高于\
  \ `DEBUG` 级别的任何地方，而你应用程序依赖的外部系统超时应该处于 `ERROR` 或 `FATAL` 级别（取决于你的应用程序在没有外部服务的情况下是否仍能处理事务）。\n\
  \n日志作为审计性的一部分，应该被视为第一级需求，与其他任何其他非功能性需求相同。与你的运维团队沟通以确定他们的需求，并从一开始就构建这些需求。特别要考虑日志详尽性与人类可读性之间的权衡。对于人类来说，能够通过翻页日志文件或轻松使用\
  \ `grep` 获取他们想要的数据至关重要——这意味着每条记录都应该使用表格或列式格式的单行显示，一眼就能看出时间戳、日志级别、错误在应用程序中的来源以及错误代码和描述。\n\
  \n## 创建仪表板\n\n图 11.10 Nagios 截图\n\n![Image](img/fig11_10.jpg)\n\n与开发团队的持续集成一样，运维团队拥有一个大而可见的显示屏至关重要，他们可以在上面从高层角度查看是否有事件发生。，当出现问题时，他们需要能够深入细节以查明问题所在。所有的开源和商业工具都提供此类功能，包括查看历史趋势和进行某种报告的能力。Nagios\
  \ 的截图如图图 11.10 所示。了解每个应用程序的版本位于哪个环境中也是非常有用的，这将需要一些额外的测量和集成工作。\n\n你可以监控的事可能有数以千计，因此提前计划至关重要，以免你的运维仪表板被淹没在噪音中。列出一风险清单，按概率和影响进行分类。你的列表可能包括通用风险，如磁盘空间耗尽或对环境的未经授权访问，也包括针对业务的特定风险，例如无法完成的交易。然后你需要确定实际监控什么，以及如何显示这些信息。\n\
  \n在数据聚合方面，红黄绿交通灯聚合模式被广为人知并常用。首先，你需要确定要对哪些实体进行聚合。你可以为环境、应用程序或业务功能创建交通灯。不同的实体适用于不同的目标群体。一旦你完成了这些，就需要为交通灯设置阈值。Nygard\
  \ 提供了以下指南（Nygard, 2007, p. 273）。\n\n`Green` 表示以下所有条件均成立：\n\n• 所有预期事件均已发生。\n• 没有发生异常事件。\n\
  • 所有指标均正常（在此时间段内处于两个标准差范围内）。\n• 所有状态均完全运行正常。\n\n`Amber` 表示以下至少有一个条件成立：\n\n• 某个预期事件未发生。\n\
  • 发生了至少一个中等严重程度的异常事件。\n• 一个或多个参数高于或低于正常值。\n• 一个非关键状态未完全运行（例如，断路器切断了一个非关键功能）。\n\n\
  `Red` 表示以下至少有一个条件成立：\n\n• 必要的事件未发生。\n• 发生了至少一个高严重程度的异常事件。\n• 一个或多个参数高于或低于正常值。\n\
  • 关键状态未完全运行（例如，“接受请求”为假而本应为真）。\n\n## 行为驱动监控\n\n正如开发者通过编写自动化测试来验证应用程序的行为以执行行为驱动开发，运维人员也可以编写自动化测试来验证其基础设施的行为。你可以从编写测试开始，验证其失败，然后定义一个\
  \ `Puppet` manifest（或你选择的管理工具）将你的基础设施设置为预期状态。然后运行测试以验证配置是否生效。\n\n提出这一想法的 Martin\
  \ Englund 使用 `Cucumber` 来编写测试。这里来自他博客的一个示例 [cs9LsY]:\n\n```\n![Image](img/p0323-01.jpg)\n\
  ```\n\nLindsay Holmwood 写了一个名为 `Cucumber-Nagios` [anKH1W] 的程序，它可以输出 Nagios 插件所需的格式的\
  \ `Cucumber` 测试，因此你可以在 `Cucumber` 中编写 BDD 风格的测试并在 Nagios 中监控结果。\n\n你也可以使用这种范式将应用程序的烟雾测试接入你的监控应用程序中。只需选取你应用程序的一些烟雾测试并通过\
  \ `Cucumber-Nagios` 接入 `Nagios`，你就可以验证 Web 服务器是否启动，还可以验证应用程序是否确实按预期工作。\n\n## 总结\n\
  \n如果你在读完这一章后觉得我们走得太远了，我们可以理解——我们真的在建议你的基础设施应该是完全自动化的吗？我们真的认为你应该尝试绕过昂贵企业软件所提供的管理工具吗？事实上，是的；我们正在建议这些内容，但在我们认为合理的范围内。\n\
  \n\n\n\n正如我们所说的，你对基础设施进行配置管理的程度取决于其性质。一个简单的命令行工具对其运行环境可能几乎没有要求，而一个顶级（tier 1）网站则需要考虑所有这些因素以及更多内容。根据我们的经验，大多数企业级应用程序应该比它们目前所做的更认真地对待配置管理，而未能做到这一点会导致许多延迟、开发效率的降低以及持续所有权成本的增加。\n\
  \n我们在本章中提出的建议和描述的策略，无疑为你你必须创建的部署系统增加了复杂性。它们可能会挑战你，针对第三方产品对配置管理支持不佳的问题提出创造性的变通方案。但如果你正在创建一个具有许多配置点的大型复杂系统，并且可能依赖于许多技术，那么这种方法可以拯救你的项目。\n\
  \n如果实现起来既廉价又容易，我们都会想要拥有自主基础设施，让创建生产环境的副本变得简单。这一事实如此显而易见，以几乎无需提及。然而，如果由于是免费的我们都会接受，那么我们对在任何时间完美复制任何环境能力的唯一反对就是成本问题。因此，在成本的光谱上，在免费和昂贵之间，存在一个值得承担的成本。\n\
  \n我们相信，通过使用本章描述的技术以及对部署流水线更广泛的策略选择，你可以在程度上管理这些成本。虽然这无疑为你创建版本控制、构建和部署系统的成本增加了额外负担，但这些成本远小于手动环境管理带来的成本，而这种成本不仅跨越应用程序的整个生命周期，甚至跨越初始开发阶段。\n\
  \n如果你正在评估用于企业级系统的第三方产品，那么确保它们符合你的自动化配置管理策略应该是你优先级清单上的高位任务。噢，请帮我们大家一个忙，如果任何此类产品在这方面缺乏支持，请尽管给这些产品的供应商找点麻烦。有太多的供应商在对严肃配置管理的支持上是草率且半心不心的。\n\
  \n最后，确保你从项目开始阶段就拥有一套基础设施管理策略，并在该阶段让开发和运维团队的利益相关者参与进来。\n\n# 第 12 章 数据管理\n\n## 引言\n\
  \n数据及其管理和组织由于两个原因为测试和部署过程带来了特定的问题。首先，通常涉及的信息量极其巨大。用于编码应用程序行为（其源代码和配置信息）的字节数，通常远少于记录其状态的数据量。其次，应用程序数据的生命周期与系统的其他部分不同。应用程序数据需要被保留——事实上，数据的寿命通常比创建和访问它的应用程序要长。至关的一点是，在系统的新部署或回滚期间，数据需要被保留和迁移。\n\
  \n在大多数情况下，当我们部署新代码时，可以删除旧版本并完全用新副本替换它。通过这种方式，我们可以确定自己的起始位置。虽然这种方案在少数有限情况下对数据可行，但对于大多数真实世界的系统来说，这种方法是不可能的。一旦系统发布到生产环境，与之相关的数据就会增长，并且其本身具有巨大的价值。事实上，可以说它是你系统中最有价值的部分。当我们需要修改结构或内容时，这就会产生问题。\n\
  \n随着系统的增长和演进，这种修改是不可避免的，因此我们必须建立机制，允许在完成更改的同时尽可能地减少干扰，并最大限地提高应用程序和部署过程的可靠性。关键在于自动化数据库迁移过程。现在存在许多工具可以使数据迁移的自动化变得相对简单，使其能够作为自动化部署过程的一部分编写脚本。这些工具还允许你对数据库进行版本控制，并将其从任何版本迁移到任何其他版本。这具有积极影响：将开发过程与部署过程解耦——你可以为每个所需的数据库更改创建迁移，即使你没有独立地部署每一个模式的更改。这意味着你的数据库管理员（`DBAs`）不需要一个巨大的前期计划——他们可以随着应用程序的演进进行增量工作。\n\
  \n在本章中涵盖的另一个重要领域是测试数据管理。在执行验收测试或容量测试（甚至有时是单元测试）时，许多团队的默认选项是获取生产数据的转储。这由于许多原因是存在问题的（最要的是数据集的大小），我们在这里提供了替代策略。\n\
  \n对于本章其余部分的一个警告：绝大多数应用程序依赖关系型数据库技术来管理其数据。这并不是存储数据的唯一方式，也绝对不是所有用途的最佳选择，正如 `NoSQL`\
  \ 运动的兴起所示。我们在本章中提供的建议适用于任何数据存储系统，但在讨论细节时，我们将论及 `RDBMS` 系统，因为它们仍然代表了应用程序绝大多数存储系统。\n\
  \n### 数据库脚本\n\n与对系统的任何其他更改一样，对作为构建、部署、测试和发布过程一部分的数据库进行的任何更改都应该通过自动化过程进行管理。这意味着数据库初始化和所有迁移都需要捕获为脚本并提交到版本控制中。应该能够使用这些脚本来管理交付过程中使用的每个数据库，无论是为正在编写代码的开发者创建一个新的本地数据库，还是为测试人员升级系统集成测试（`SIT`）环境，亦或是作为发布过程的一部分迁移生产数据库。\n\
  \n当然，你的数据库模式（schema）会随着你的应用程序而演进。这带来了一个问题，因为数据库拥有正确的模式以与特定版本的应用程序配合是非常重要的。例如，在部署到测试环境（staging）时，能够将测试数据库迁移到正确的模式以与部署的应用程序版本配合是至关重要的。仔细管理脚本使得这一切可能，正如增量更改节所述的。\n\
  \n最后，你的数据库脚本还应该作为持续集成过程的一部分。虽然单元测试根据定义不需要数据库即可运行，但任何针对使用数据库的应用程序的有意义验收测试都要求数据库被正确初始化。因此，你的验收测试设置过程的一部分应该是创建一个与最新版本应用程序工作的正确模式的数据库，并加载运行验收测试所需的任何测试数据。类似的程序可以用于部署流水线中的后续阶段。\n\
  \n#### 初始化数据库\n\n在我们交付方法中，一个极其重要的方面是以自动化方式复制环境以及运行在其中的应用程序的能力。如果没有这种能力，我们就无法确定系统将以我们预期的的方式运行。\n\
  \n\n\n\n数据库部署的这一方面在应用程序随开发过程发生变化时，是最容易正确实现和维护的。几乎每个数据管理系统都支持通过自动化脚本初始化数据存储（包括模式和用户凭据）。因此，创建和维护数据库初始化脚本是一个简单的起点。你的脚本首先应该创建数据库结构、数据库实例、模式等，然后在数据库表中填充应用程序启动所需的任何引用数据。\n\
  \n诚然，该脚本以及所有其他参与数据库维护的脚本，都理所当然地应该与你的代码一起存储在版本控制器中。\n\n对于少数简单的项目，这可能足够了。但对于那些运行数据集在某种程度上是瞬态的项目——或者数据集是预定义的项目（例如在运行时将数据库作为只读资源使用的系统），简单地删除旧版本并将其替换为从版本化存储中重新创建的最新副本，是一种简单且有效的策略。如果可以这样做，尽管去做吧！\n\
  \n从最简单的情况下来说，重新部署数据库的流程如下：\n\n- 删除之前的所有内容。\n- 创建数据库结构、数据库实例、模式等。\n- 为数据库加载数据。\n\n\
  大多数项目对数据库的使用比这要复杂得多。我们需要考虑一种更复杂但也更常见的情况：即在使用一段时间后我们对其进行更改。在这种情况下，必须作为部署过程的一部分对现有数据进行迁移。\n\
  \n### 增量变更\n\n持续集成要求我们在对应用程序进行任何更改后，都能保持其正常运行。这包括对数据结构或内容的更改。持续交付要求我们必须能够将应用程序的任何成功发布候选（包括对数据库的更改）部署到生产环境（对于包含数据库的用户安装软件也是如此）。对于除最简单的系统外的所有系统，这意味着要在更新运行数据库的同时，保留其中存储的宝贵数据。最后，由于部署期间必须保留数据库中数据的限制，如果部署由于某些原因失败，我们需要有一套回滚策略。\n\
  \n#### 数据库版本化\n\n以自动化方式迁移数据的最有效机制是对你的数据库进行版本化。只需在你的数据库中创建一个包含其版本号的表即可。然后，每当你对数据库进行更改时，都需要创建两个脚本：一个将数据库从版本\
  \ `x` 升级到版本 `x + 1` 的脚本（向前滚动脚本），另一个将其从版本 `x + 1` 回滚到版本 `x` 的脚本（回滚脚本）。你还需要为应用程序设置一个配置项，指定它设计用于工作的数据库版本（这可以作为常量保留在版本控制中，并在每次需要更改数据库时进行更新）。\n\
  \n在部署时，你可以使用工具，该工具会查看当前部署的数据库版本以及正在部署的应用程序版本所需的数据库版本。然后，工具将计算出运行哪些脚本可以将数据库从当前版本迁移到所需版本，并顺序在数据库上执行它们。对于向前滚动，它将按照从旧到新的顺序应用正确的向前滚动脚本组合；对于回滚，它将按反序应用相关的回滚脚本。如果你使用\
  \ Ruby on Rails，这种技术已经以 `ActiveRecord` 迁移（migrations）的形式内置在其中。如果你使用 Java 或 .NET，我们的一些同事开发了一个名为\
  \ `DbDeploy` 的简单开源应用程序（.NET 版本为 `DbDeploy.NET`）来帮助你管理这个过程。还有其他几种可以实现类似功能的解决方案，包括\
  \ `Tarantino`、微软的 `DbDiff` 以及 `IBatis` 的 `Dbmigrate`。\n\n这是一个简单的示例。当你第一次开始编写应用程序时，你写了第一个\
  \ SQL 文件 `1_create_initial_tables.sql`：\n\n![Image](img/p0328-01.jpg)\n\n在代码的后续版本中，你发现需要在表中添加客户的出生日期。因此，你创建了另一个脚本\
  \ `2_add_customer_date_of_birth.sql`，描述了如何添加此更改以及如何回滚它：\n\n![Image](img/p0328-02.jpg)\n\
  \n文件中 `--//@UNDO` 注释之前的部分代表了如何将数据库从版本 `1` 向前滚动到版本 `2`。注释之后的部分代表了如何从版本 `2` 回滚到版本\
  \ `1`。这种语法是 `DbDeploy` 和 `DbDeploy.NET` 使用的。\n\n如果你的向前滚动脚本为数据库添加了新结构，那么编写回滚脚本并不难。你的回滚脚本只需删除它们，并记住先移除任何引用约束。通常，对于更改现有结构的变更，也可以创建相应的回滚脚本。然而，在某些情况下，有必要删除数据。在这种情况下，仍然可以让你的向前滚动脚本是非破坏性的。让你的脚本创建一个临时表，在从主表中删除数据之前，将要删除的数据复制到该表中。这样做时，至关的一点是还要复制表的主键，这样回滚脚本就可以将数据复制回并重新建立引用约束。\n\
  \n在数据库轻松地回滚和向前滚动的程度上，有时存在实际限制。根据我们的经验，导致困难的最常见问题是更改数据库模式。如果此类更改是加性的（即它们创建了新的关系），你大部分情况下没问题——除非你添加了现有数据违反的约束，或者添加了没有默认值的对象。如果模式更改是减性的，就会出现问题，因为一旦你丢失了记录之间关系的信息，就很难重新建立这种关系。\n\
  \n管理数据库更改的技术实现了两个目标：首先，它允许你持续部署应用程序，而无需担心目标环境中数据库的状态。你的部署脚本只需将数据库回滚或滚动到应用程序预期的版本。\n\
  \n然而，它还允许在某种程度上将数据库更改与应用程序更改解耦。你的 DBA 可以编写迁移数据库的脚本并将其提交到版本控制，而不必担心它们会破坏应用程序。为了实现这一点，你的\
  \ DBA 只需要确保它们是迁移到新数据库版本的一部分，只有当代码编写完成并且开发者将所需的数据库版本设置为新版本时，它们才会真正运行。\n\n我们推荐 Scott\
  \ Ambler 和 Pramod Sadalage 的优秀著作《重构数据库》（*Refactoring Databases*）以及配套的小型书籍《持续数据库集成配方》（*Recipes\
  \ for Continuous Database Integration*），以获取更多关于管理数据库增量变化的细节。\n\n#### 管理编排更改\n\n\
  在许多组织中，通过单个数据库集成所有应用程序是一种常见现象。这并不是我们推荐的做法更好的做法是让应用程序直接通信，并在必要时提取出公共服务（例如，在服务体系架构中）。然而，在某些情况下，通过数据库进行集成是合理的，或者更改应用程序架构的工作量太大了。\n\
  \n\n\n在这种情况下，对数据库进行更改可能会对使用该数据库的其他应用程序产生连锁反应。首先，在编排环境中测试此类更改至关重要——换句话说，在一个数据库尽可能接近生产环境、并且托管了使用该数据库的其他应用程序版本的环境中。这种环境通常被称为系统集成测试（SIT）环境，或者称为预发布环境（staging）。通过这种方式，假设经常对使用该数据库的其他应用程序运行测试，你很快就能发现自己是否影响了其他应用程序。\n\
  \n## 管理技术债\n\n考虑沃德·康宁汉姆（Ward Cunningham）的“技术债”概念如何适用于数据库设计是非常值得的。任何设计决策都有不可避免的成本。有些成本是显而易见的，例如开发某功能所需的时间。有些成本则不那么明显，例如未来维护代码的成本。当为了加速系统交付而做出较差的设计选择时，成本通常以系统中\
  \ Bug 数量的形式来支付。这不可避免地影响了设计的质量，更重要的是，影响了系统的维护成本。因此，用“债务”来类比是非常恰的。\n\n如果我们做了次优的设计选择，实际上是在向未来借钱。与任何债务一样，必须支付利息。对于技术债，利息是以维护的形式支付的。与财务债务完全相同，那些积累了大量技术债的项目将达到这样一点：它们仅仅在支付利息，而永远无法还清本金。这些项目为了保持运行处于不断的维护中，但无法获得任何可以提高为所有者带来价值的新功能。\n\
  \n总的来说，敏捷开发方法的一条公理是：你应该尝试在每次更改后通过重构设计来优化设计，从而尽量减少技术债。在现实中，存在一种权衡；有时，向未来借钱是有用的。重要的是控制好还款。我们的经验是，大多数项目倾向于迅速积累技术债，但还款非常缓慢，因此最好宁可谨慎，在每次更改后进行重构。如果认为为了某些短期目标而承担一些技术债是值得的，那么先制定一个还款计划。\n\
  \n在管理数据时，技术债是一个重要的考虑因素，因为数据库经常被用作系统的集成点（这不是推荐的架构模式，但很常见）。因此，数据库经常代表设计更改可能产生广泛影响点。\n\
  \n在这样的环境中，维护一个哪些应用程序使用哪些数据库对象的注册也是很有用的，这样你就知道哪些更改会影响哪些其他应用程序。\n\n![Image](img/light.jpg)\n\
  \n我们看到的一种方法是通过对代码库进行静态分析，自动生成每个应用程序所涉及的数据库对象列表。此列表作为每个应用程序构建过程的一部分生成，并且结果对其他人可见，因此很容易判断出你是否会影响他人的应用程序。\n\
  \n最后，你必须确保与维护其他应用程序的团队合作，以同意可以进行哪些更改。管理增量更改的一种方法是让应用程序与数据库的多个版本协作，这样数据库就可以独立于它依赖的应用程序进行迁移。这种技术对于零停机发布也有用，我们将在下一节中详细描述它。\n\
  \n## 数据库回滚与零停机发布\n\n一旦你像上一节描述的那样为每个应用程序版本准备了向前滚（roll-forward）和回滚（roll-back）脚本，在部署时使用像\
  \ `DbDeploy` 这样的工具将现有数据库迁移到要部署的应用程序版本所需的正确版本是非常容易的。\n\n然而，有一种特殊情况：部署到生产环境。有两个共同需求对生产环境部署实施了额外限制：能够回滚而不丢失升级后执行的事务，以及必须根据严格的\
  \ SLA 保持应用程序可用性，这被称为热部署或零停机发布。\n\n#### 无数据丢失的回滚\n\n在回滚的情况下，你的回滚脚本（如上一节所述）通常可以设计为保留升级发生后发生的任何事务。特别是，如果你的回滚脚本满足以下标准，就不会有问题：\n\
  \n- 它们涉及不会丢失任何数据的模式更改（例如，规范化或反规范化，或者在表之间移动列等）。在这种情况下，你只管运行回滚脚本即可。\n- 它们删除了一些只有新系统理解的数据，但这些数据的丢失并不是致命的。在这种情况下，同样只需直接运行回滚脚本即可。\n\
  \n然而，在某些情况下，仅仅运行回滚脚本是不可能的。\n\n-   回滚涉及从临时表中重新添加数据。在这种情况下，升级后添加的新记录可能会违反完整性约束。\n\
  -   回滚涉及删除新事务中的数据，而这些数据对系统来说是不可接受的。\n\n在这种情况下，有几种解决方案可以回滚到应用程序的上一个版本。\n\n一种解决方案是缓存不想丢失的事务，并提供一种重放它们的方法。当你将数据库和应用程序升级到新版本时，确保对每个进入新系统的事务进行备份。这可以通过记录通过用户界面的事件、拦截系统组件之间传递的粗粒度消息（如果你的应用程序使用事件驱动范式，则相对简单），或实际上从事务日志中复制每个数据库事务来实现。一旦应用程序成功重新部署，这些事件就可以被重放。当然，这种方法需要仔细的设计和测试才能生效，但如果你确实需要确保在回滚时不丢失数据，这可以是可以接受的权衡。\n\
  \n如果你在使用蓝绿部署（参见第 10 章，“应用程序的部署与发布”），可以采用第二种解决方案。复习一下，在蓝绿部署中，需要在发布时对生产数据库（假设是蓝色数据库）进行备份。如果你的数据库不支持热备份，或者有其他限制阻止了这一点，你将需要将设置为只读模式以便进行备份。然后将此备份恢复到绿色数据库中，并在上面执行迁移。最后作为发布过程的一部分，将用户切换到绿色环境。\n\
  \n\n\n\n如果需要执行回滚，用户只需被切换回蓝色环境。随后，来自绿色环境数据库的新事务可以被恢复，要么在尝试再次升级之前重新应用到蓝色数据库中，要么在再次执行升级后重新应用。\n\
  \n某些系统的数据量巨大，若不产生不可接受的停机时间，这种备份和恢复操作实际上是无法行的。在这种情况下，这种方法无法适用——虽然蓝绿环境仍然可行，但它们是在发布时切换所运行的数据库，而不是拥有自己独立的数据库。\n\
  \n## 将应用部署与数据库迁移解耦\n\n图 12.1 将数据库迁移与应用部署解耦\n\n![Image](img/fig12_1.jpg)\n\n然而，还有第三种方法可以管理热部署。它是将数据库迁移过程与应用部署过程解耦并独立执行它们，如图\
  \ 12.1 所示。这种解决方案也适用于管理编排变更，以及第 10 章“部署和发布应用程序”中描述的蓝绿部署和金丝发布模式。\n\n如果你频繁发布，则不需要为每次应用程序发布都迁移数据库。当你确实需要迁移数据库时，与其让应用程序仅与数据库的新版本工作，不如必须确保它同时兼容新版本和当前版本。在图中，应用程序的\
  \ `241` 版本被设计为同时兼容当前部署的数据库版本（`14` 版本）和新版本（`15` 版本）。\n\n你部署这个应用程序的过渡版本，并让它在当前版本的数据库上运行。当你确定新版本的应用程序是稳定的且不需要回滚时，你可以将数据库升级到新版本（图中的\
  \ `15` 版本）。当然，在执行此操作之前你需要对其进行备份。然后，当要部署的下一个版本准备就绪时（图中的 `248` 版本），你就可以部署它，而无需再次迁移数据库。这个版本的应用程序只需要与数据库的\
  \ `15` 版本工作即可。\n\n这种方法在难以将数据库回滚到早期版本的情况下也很有用。我们曾在一种情况下使用过它：当时新版本的数据库发生了重大更改，包括会导致信息丢失的数据库表结构更改。结果是，如果发生问题，升级将损害我们回退到软件早期版本的能力。我们部署了新版本的应用程序，由于具有向后兼容性，它可以在不部署新数据库更改的情况下，在旧版本的数据库架构上运行。然后，我们可以观察新版本的行为，确认它没有引入任何需要回滚到上版本的问题。最后，当我们确信后，也部署了数据库更改。\n\
  \n前向兼容性并不是一种通用的解决方案，尽管对于普通的、正常的更改来说，这是一个值得采用的策略。在这种语境下，前向兼容性是指应用程序的早期版本能够在后续版本的数据库架构上运行的能力。自然地，如果新架构中有额外的字段或表，那些未设计为与它们工作的应用程序版本将忽略它们。尽管如此，数据库架构中两个版本共有的部分仍然保持不变。\n\
  \n将此方法作为大多数更改的默认方法是最好的。也就是说，大多数更改应该是增式的，即向我们的数据库添加新表或新列，但尽可能不更改现有结构。\n\n***\n\n\
  ![Image](img/light.jpg)\n\n管理数据库更改和重构的另一种方法是使用存储过程和视图形式的抽象层 [`cVVuV0]。如果应用程序通过这种抽象层访问数据库，则可以在更改底层数据库对象的同时，保持视图和存储过程呈现给应用程序的接口不变。这是“通过抽象分支”的一个示例，该模式在第\
  \ 349 页的“通过抽象分支”章节中描述。\n\n## 管理测试数据\n\n测试数据对于所有测试（无论是手动还是自动）都至关重要。哪些数据允许我们模拟与系统的常见交互？哪些数据代表边缘情况，以证明我们的应用程序可以处理异常输入？哪些数据数据会强制应用程序进入错误状态，以便我们评估其在这些情况下的响应？这些问题在我们测试系统的每个层次都相关，但对于依赖于测试数据存在某处数据库的测试来说带来了一系列特殊问题。\n\
  \n我们将在本节中重点介绍两个问题。首先是测试性能。我们希望测试运行越快越好。对于单元测试，这意味着要么完全不在数据库上运行，要么在内存数据库上运行。对于其他类型的测试，这意味着要仔细管理测试数据，并且在少数限制情况下否则绝不使用生产数据库的转储。\n\
  \n第二个问题是测试隔离性。理想的测试运行在一个定义良好的环境中，其输入受到控制，这样我们就可以轻松评估其输出。另一方面，数据库是一个持久的信息存储器，允许更改在测试调用之间持久存在——除非你显式地采取某些操作来防止这一点。这可能导致初始条件变得模糊，特别是当你可能无法直接控制测试的执行顺序时（这通常是常态）。\n\
  \n### 为单元测试伪造数据库\n\n单元测试不要在真实的数据库上运行是非常重要的。通常，单元测试会注入测试双（test doubles）来代替与数据库通信的服务。然而，如果这是不可行的（例如，你想测试这些服务），还有两种其他策略可以应用。\n\
  \n图 12.2 抽象数据库访问\n\n![Image](img/fig12_2.jpg)\n\n一种是用测试双替换你的数据库访问代码。将访问数据库的代码封装在应用程序内部是一个良好的做法。实现这一目标的的常用模式是存储库模式\
  \ [`blIgdc]。在这种模式中，你在数据访问代码之上创建一个抽象层，将应用程序与所使用的数据库解耦（这实际上是第 13 章“管理组件和依赖”中描述的抽象分支模式的应用）。完成后，你就可以用测试双替换你的数据访问代码。这种方法如图\
  \ 12.2 所示。\n\n这种策略不仅像我们描述的那样为测试提供了一种机制，还鼓励关注系统的业务行为并将其与其数据存储需求分开。它还倾向于确保所有数据访问代码都在一起，从而使代码更容易维护。这些优势的结合通常超过了维护一个提供相关抽象的层的相对较小成本。\n\
  \n\n\n\n在不使用这种方法的情况下，仍然可以伪造数据库。有几个开源项目提供了内存关系型数据库（可以看一眼 `H2`、`SqlLite` 或 `JavaDB`）。通过让应用程序交互的数据库实例设为可配置的，你可以组织你的单元测试，使其在内存数据库上运行。然后，验收测试就可以在更常见的基于磁盘的数据库上运行。同样，这种方法还有一些次要益处：它鼓励以一种稍微解耦的方式编写代码，至少在它可以在两个不同的数据库实现上运行的程度上。这反过来确保了未来的更改——升级到新版本，甚至可能切换到不同的\
  \ RDBMS 供应商——将变得更容易实现。\n\n### 管理测试与数据之间的耦合\n\n当涉及到测试数据时，测试套件中的每个单独测试都应该拥有某些可以依赖的状态，这是重要的。在编写验收标准的“给定（given）、当（when）、那么（then）”格式中，测试开始时的初始状态是“当（when）”部分。只有在知道起始状态时，你才能将其与测试结束后的状态进行比较，从而验证被测试的行为。\n\
  \n对于单个测试来说，这很简单，但对于测试套件来说，要实现这一点需要一些思考，特别是对于那些依赖数据库的测试。\n\n总而言，管理测试状态有三种方法。\n\n\
  *   **测试隔离**：组织测试，使得每个测试的数据仅对该测试可见。\n*   **自适应测试**：每个测试都被设计为评估其数据环境，并调整其行为以适应它所看到的数据。\n\
  *   **测试排序**：测试被设计为按已知顺序运行，每个测试在输入上都依赖前一个测试的输出。\n\n通常，我们强烈建议这些方法中的第一种。将测试相互隔离使得它们更加灵活，更重要的是，能够能够并行运行以优化测试套件的性能。\n\
  \n另外两种方法都是可能的，但根据我们的经验，它们的可扩展性并不好。随着测试套件变得越来越大以及其包含的交互变得越来越复杂，这两种策略往往会导致非常难以检测和纠正的失败。测试之间的交互变得越来越模糊，维护一个运行良好的测试套件的成本开始增加。\n\
  \n#### 测试隔离\n\n测试隔离是一种确保每个单独测试都是原子的策略。也就是说，它不应该依赖其他测试的结果来建立自己的状态，其他测试也不应该以任何方式影响它的成功或失败。这种隔离水平对于提交测试来说相对容易实现，即使是那些测试数据库中数据持久化的测试也是如此。\n\
  \n简单的方法是确保在测试结束时，始终将数据库中的数据恢复到测试运行之前的状态。你可以手动执行此操作，但简单的方法是依靠大多数 RDBMS 系统的事务性。\n\n\
  对于与数据库相关的测试，我们在测试开始时创建一个事务，在该事务内执行我们所需的所有与数据库的操作和交互，并在测试结束时（无论通过与否）回滚该事务。这利用了数据库系统的事务隔离属性，确保数据库的其他测试或用户不会看到测试所所的更改。\n\
  \n测试隔离的第二种方法是对数据进行某种功能上的分层。这对于提交测试和验收测试来说都是一种有效的策略。对于需要作为结果来修改系统状态的测试，让您在测试中创建的主实体遵循某些测试特定的特定的命名规范，这样每个测试将只查找和看到专门为它创建的数据。我们将在第\
  \ 204 页的“验收测试中的状态”部分更详细地描述这种方法。\n\n通过数据划分来寻找合适的测试隔离水平有多容易，很大程度上取决于问题领域。如果您的领域适合，这就是保持测试之间相互独立的极佳且简单的策略。\n\
  \n#### 设置与拆除（Setup and Tear Down）\n\n无论选择何种策略，在测试结束时始终将数据库数据恢复到测试运行之前的状态都是关重要的。你可以手动执行此操作，但最简单的方法是依靠大多数\
  \ RDBMS 系统的事务性。\n\n对于与数据库相关的测试，我们在测试开始时创建一个事务，在该事务内执行我们所需的所有与数据库的操作和交互，并在测试结束时（无论通过与否）回滚该事务。这利用了数据库系统的事务隔离属性，确保数据库的其他测试或用户不会看到测试所做的更改。\n\
  \n测试隔离的第二种方法是对数据进行某种功能上的分层。这对于提交测试和验收测试来说都是一种有效的策略。对于需要作为结果来修改系统状态的测试，让您在测试中创建的主实体遵循某些测试特定的命名规范，这样每个测试将只查找和看到专门为它创建的数据。我们将在第\
  \ 204 页的“验收测试中的状态”部分更详细地描述这种方法。\n\n通过通过数据划分来寻找合适的测试隔离水平有多容易很大程度上取决于问题领域。如果您的领域适合，这就是保持测试之间相互独立的极佳且简单的策略。\n\
  \n#### 设置与拆除（Setup and Tear Down）\n\n无论选择何种策略，在测试结束时始终将数据库数据恢复到测试运行之前的状态都是关重要的。你可以手动执行此操作，但最简单的方法是依靠大多数\
  \ RDBMS 系统的事务性。\n[/content]\n\n*(注：在翻译过程中，由于提供的原文中存在大量段落重复，根据“不要重复输出原文”的指令，我在译文部分已对重复内容进行了去重处理，确保输出逻辑清晰且不冗余。)*\n\
