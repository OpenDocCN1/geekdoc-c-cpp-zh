- "# 持续交付：通过构建、测试和部署自动化实现可靠的软件发布\n\n\n\n![](img/0321670221.jpg)\n\n![cover](img/0321670221.jpg)\n\
  \n\n“如果你需要更频繁地部署软件，这本书就是为你准备的。应用它将帮助你降低风险、消除繁燥工作并增加信心。我将在目前所有的项目中使用书中提到的这些原则和实践。”\n\
  —Kent Beck，三河学院\n\n“无论你的软件开发团队是否已经理解持续集成与源代码控制同等重要，这本书都是必读之作。这本书的独特之处在于将整个开发和交付过程结合在一起，提供了一种哲学和原则，而不仅仅是技术和工具。作者们让从测试自动化到自动化部署的话题变得让读者易于理解。开发团队中的每一个人，包括程序员、测试人员、系统管理员、DBA\
  \ 和经理，都需要阅读这本书。”\n—Lisa Crispin，《敏捷测试》合著者\n\n“对于许多组织来说，持续交付不仅是一种部署方法论，更是业务运营的关键。这本书向你展示了如何让持续交付在你的环境中成为有效的现实。”\n\
  —James Turnbull，《Pulling Strings with Puppet》作者\n\n“一本清晰、精准、编写良好的书籍，让读者对发布流程有了预期。作者们对软件部署的预期和障碍进行了逐步的阐述。对于任何软件工程师的书库来说，这本书都是必不可少的。”\n\
  —Leyna Cotran，加州大学欧文文分校软件研究所\n\n“Humble 和 Farley 阐述了快速增长的 Web 应用成功的关键。持续部署和交付已从争议转变为常态，这本书对此涵盖得非常出色。它在许多层面上确实是开发与运维的交汇点，这两个哥们做得非常好。”\n\
  —John Allspaw，Etsy.com 技术运营副总裁，《The Art of Capacity Planning and Web Operations》作者\n\
  \n“如果你从事构建和交付软件服务的业务，那么内化《持续交付》书中解释得如此清晰的概念将让你大有裨浅。但不仅限于概念，Humble 和 Farley 还提供了一份优秀的指南，用于快速且可靠地交付变更。”\n\
  —Damon Edwards，DTO Solutions 总裁，dev2ops.org 合编辑\n\n“我相信，任何处理软件发布的人都能拿起这本书，翻到任何一章并快速获取有价值的信息；或者从头到尾读一遍，并以符合组织逻辑的方式简化他们的构建和部署流程。在我看来，这是一本构建、部署、测试和发布软件的基础手册。”\n\
  —Sarah Edrie，哈佛商学院质量工程总监\n\n“对于任何现代软件团队来说，持续交付是持续集成之后的逻辑下一步。这本书接受了不断向客户交付价值软件的这一宏伟目标，并通过一套清晰、有效的原则和实践使其成为可能。”\n\
  —Rob Sanheim，Relevance, Inc. 负责人\n\n\n\n![Image](img/pub.jpg)\n\n新泽西州上河 • 波士顿 •\
