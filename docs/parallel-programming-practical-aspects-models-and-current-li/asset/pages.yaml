    It should notice that the problem of a rapidly rotating cloud can not be solved
    with AstroPhi, or any other code in SPH, AMR or ALE approach. Here the close quantitative
    or qualitative account to the results of this Lagrangian code speaks about the
    capability of AstroPhi to simulate the rapidly forming galaxies.


    So, having considered the differences in Figure 19, it is possible to state that
    AstroPhi successfully simulated the collapse of a rapidly rotating cloud.


