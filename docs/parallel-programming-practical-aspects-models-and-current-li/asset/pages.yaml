    of the cellular array into $d_1, d_2,\dots,d_p$, we can divide the sequence $X$
    into $2p$ parts: for each $d_k$ we take the interior $I_k$ and boundary $B_k$
    subsequences. The sequences $I_k$ and $B_k$ are formed by uniform, exponential,
    and binomial pseudorandom generators. The algorithm is based on the stochastic
    properties of $I_k$ and $B_k$, and on planning the order of interactions between
    processes. The main idea of the parallel algorithm is as follows. First, a process
    $k$ (hosting a domain $d_k$) forms the $(I_k, B_k)$ independently of other processes.
    Secondly, each process avoids unnecessary synchronizations because it is informed
    about neighbours'' $B_l$. It means the process works only for those new boundary
