    control list. Each process is in one of four states defined in connection with
    the queue of processes in the control list, dynamically assigned to it. The states
    are:


    +   - active when the process is executed;

    - suspended when the process execution is interrupted but the point of resuming
    activity (address in the program) is memorized and the process is in control list;

    - passive when the process is interrupted, the point of resuming activity is memorized,
    but it is not present in the control list,

    - completed when the process is interrupted, and the point of the resuming activity
    is not stored.


    The control list simulates times. Its first process is the only active one. If
    it is interrupted, the following suspended process becomes active. The process
    can be inserted into the control list (before any process, or after a certain
    process) or removed from it. It can be assigned to a certain time. This means
