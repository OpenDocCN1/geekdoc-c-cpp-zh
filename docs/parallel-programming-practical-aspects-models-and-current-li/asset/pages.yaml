  md: '# 1. Introduction


    This work has been inspired by the effect of anomalous heat conductivity observed
    at the GOL-3 facility in Budker Institute of Nuclear Physics [1]. The GOL-3 facility
    is a long open trap where the dense plasma is heated in a strong magnetic field
    by the injection of the powerful relativistic electron beam of microsecond duration.
    The effect is the decrease of the plasma heat conductivity by 100 or 1000 times
    compared to the classical value for the plasma with the temperature and density
    observed in the experiment. Anomalous heat conductivity arises because of the
    turbulence that is caused by the relaxation of the relativistic electron beam
    in the high-temperature Maxwellian plasma.


    The physical problem is to define the origin and mechanism of the heat conductivity
    decrease. This is of great importance for the fusion devices because the effect
    of anomalous transport helps to heat the plasma and also to confine it. The problem
    of heat transport in fusion devices has been widely discussed (e.g., [2]).


    This problem needs high-performance computing because of the necessity to have
    a large enough grid to simulate the resonance interaction of the relativistic
    electron beam plasma. The beam interacts with the plasma through the electric
    field (similar to Landau damping), thus it is necessary to observe two different
    scales simultaneously. The first is the plasma Debye length and the second is
    the plasma-beam interaction wavelength, which is 10 or 100 times larger than the
    Debye length. At least 8 cell grids must be defined on the Debye length.


    It is also necessary to provide a large number of particles for each cell of grid
    for the simulation of turbulence. The level of non-physical statistical fluctuations
    is inversely proportional to the number of particles per cell. So if there are
    too few particles, all the physical plasma waves and oscillations will be suppressed
    by non-physical noise.


    # 2. Large-Scale Parallelism in Plasma Simulation


    # 2.1. Cluster Efficiency Problem


    This work also aims at more efficient use of cluster supercomputers. In order
    to achieve this goal it is necessary to evaluate their performance with some programs
    solving physical problems. It would be incorrect to limit performance testing
    to the general purpose tests like the LinPack package since there is a dramatic
    difference between the performance of the cluster declared in Top500 (either peak
    or LinPack performance) and the performance achieved by a particular user with
    his particular program. For example, if one employs four of a cluster with a peak
    performance of 5.4 TeraFlop/S (1 TeraFlop/S $10^{12}$ floating point operations
    per second), the peak performance should be about 1 TeraFlop/S. In fact, 0.18
    TeraFlop/S was obtained with the program simulating the relaxation in plasma.


    The difference between the declared performance (1 TeraFlop/S) can be explained
    by the fact that cluster systems are not appropriate for such kind of problem.'
