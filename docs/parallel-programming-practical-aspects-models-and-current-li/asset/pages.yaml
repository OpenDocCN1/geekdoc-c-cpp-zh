    # Conclusion


    In this chapter, a new cellular-automaton model FHP-MP, in which more than one
    particle is enabled in a cell with equal velocity vectors, is proposed. The computing
    experiments were carried out with this model; they demonstrate a correlation of
    the new model with the classical FHP model and with the physical laws. Experimentally,
    the obtained velocity field matches the Poiseuille parabola. The maximum flow
    velocity in the experiments is a little larger than the velocity in the FHP model.
    In the new model, it is possible to augment the initial concentration of particles.
    The obtained flow velocity is considerably superior than that for the classical
    model. We hope that the FHP-MP model allows us to simulate a turbulent flow. The
    experiments with a valve and a circle-shaped obstacle are possible to use, because
    the flows with whorls were obtained in the experiments and the Kármán vortex behind
    the obstacle is sight.\ Our investigations show that, when simulating the flow
    using multi-particle LGA, the dynamic load balancing is not only necessary, but
    it can also be successfully used. With the acceptable efficiency, the number of
    cores is limited by the communication speed faster than the load imbalance. In
    comparison with balancing by the PIC method, balancing by the LGA shows better
    results. It is worth noting, that in future LGA models, the transitions will be
    more complex, more imbalanced and the balancing will be more urgent.


