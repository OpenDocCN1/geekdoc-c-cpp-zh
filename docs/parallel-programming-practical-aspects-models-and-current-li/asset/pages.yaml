    # Abstract


    The continuous proliferation of multicore architectures has placed developers
    under great pressure to parallelize their applications in order to take advantage
    of such platforms. Unfortunately, traditional low-level programming models exacerbate
    the difficulties of building large and complex parallel applications.


    Consequently, programmers are facing a complex productivity performance trade-off
    where they should extract enough parallelism to justify the use of a dedicated
    parallel programming library. High-level parallel programming models are in high
    demand and reduce the burden on developers significantly and provide enough abstraction
    to accommodate hardware heterogeneity.


    In this chapter, we present a task-based parallel programming model named XPU
    which allows ease parallelism expression without sacrificing performances. Contrary
    to many parallel programming models which introduce new languages, define annotations
    or require specialized compilers, virtual machines or hardware—XPU is a software
    technology entirely based on the traditional C++ language and requires nothing
    more than a standard C++ compiler to be used, and improves curve steepness and
    is easily portable to many systems.


