    # Chapter 5


    # EFFICIENT COMPUTATIONAL APPROACHES

    FOR PARALLEL STOCHASTIC SIMULATION

    ON SUPERCOMPUTERS


    Mikhail A. Marchenko\*

    Institute of Computational Mathematics

    and Mathematical Geophysics of the SB RAS,

    Novosibirsk State University, Novosibirsk, Russian Federation


    # Abstract


    The Monte Carlo method (the method of stochastic simulation) is often used to
    solve real-life problems. But the main issue of the Monte Carlo simulation is
    usually the value of its computational cost. Nevertheless, using parallel high
    performance computers it is possible to get results of simulation in a reasonable
    time. A question is how to develop justified and effective parallel algorithms
    and programs. In this chapter, we provide some computational approaches for effective
    parallel stochastic simulation. As an example, we apply these approaches to stochastic
    evolution of electron avalanches in gases.


    **Keywords:** numerical methods (Monte Carlo, series resummation, etc.), random
    generation, kinetic theory of gases


    # 1. Introduction


    At the present, among specialists in numerical analysis it becomes a common point
    of view that probabilistic imputation models and the Monte Carlo simulation will
    be widely used for computer-aided modeling in the nearest future ([1]–[4], e.g.).
    There are several reasons for such prediction. First of all, using probabilistic
    models to be an adequate way to simulate physical, chemical or biogenic phenomena
    from "first principles". On the other hand, the corresponding Monte Carlo methods
    can be effectively parallelized.

    The main issue of the Monte Carlo simulation is the value of its computational
    cost.


