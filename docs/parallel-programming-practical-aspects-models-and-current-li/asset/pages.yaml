  md: '# Large-Scale and Fine-Grain Parallelism in Plasma Simulation


    # 4. Electron Heat Conductivity in Computational Experiments


    This section displays a sketch of the anomalous heat conductivity effect. The
    exact physics needs much greater numbers of particles and grid sizes. In order
    to simulate the interaction of the electron beam with the following values of
    the main physical parameters were:


    +   - electron temperature of 1 keV

    - the mass of ion 1836 electron masses (hydrogen ions)

    - plasma density of $10^{14}$ cm³

    - the ratio of beam density to plasma density of $10^{-3}$

    - beam energy of 1 MeV

    - the size of the beam $L_b = 0.065$ cm and Ly = Lz = $0.008$ cm.

    - grid size of 512x64x64 nodes, 150 particles per cell


    The modulation of 220 % of the initial value of density was observed in the computational
    experiments. The amplitude of the modulation in this case means the emergence
    of regions with very high or low density in the uniform-density plasma as it is
    shown in Figure 7. It is seen from Figure 7 that the density becomes non-uniform
    not only along the direction of the beam (the X axis), but also along the Y axis.
    Thus, the density is modulated not along X, that seems quite natural, but also
    along Y and Z. It corresponds to the physics of the process well, because it is
    known that the waves propagating in plasma due to beam relaxation have all the
    three components of wave-vector non-zeros.


    # Conclusion


    The parallel implementation of the PIC-based plasma model has been developed for
    both the CPU and the GPU-based supercomputers. The resulting code is able to simulate
    plasma with high resolution needed to study the turbulent transport in plasma.

    Through the example of beam-plasma interaction the large-scale and fine-grain
    aspects or parallel programming have been shown. The main conclusion is that the
    parallelisation can be limited to large-scale for the PIC method. In order to
    obtain best performance the fine-grain (e.g., GPU-based) parallelisation is also
    necessary.

    The research work was supported by the RFFR grants 14-07-00241 and 14-01-31088.


