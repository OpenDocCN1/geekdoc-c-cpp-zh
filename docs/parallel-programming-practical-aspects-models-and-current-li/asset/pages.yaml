  md: "# 2. Description of the Numerical Method\n\nWe will be guided by the algorithms\
    \ co-design concept which is based on the development of parallel computing technologies\
    \ taking into account all faces of parallelism during the construction of astrophysical\
    \ models. Mitchell et al. [36] proposed a new approach to describe collisionless\
    \ components based on the first moments of the collisionless Boltzmann equation.\
    \ This approach has limitations when it is necessary to consider the motion of\
    \ each individual particle rather a cluster of particles (e.g., modeling the dynamics\
    \ of planets). In this paper we consider the numerical solution of the gas dynamics\
    \ equations, magnetic gas dynamics equations for the first moments of the collisionless\
    \ Boltzmann equation and the solution of the N-body problem.\n\nWe use a 3D model\
    \ of self-gravitating gas dynamics for a hydrodynamic component in the Cartesian\
    \ coordinate system with cooling function:\n\n```\n$$\\frac{\\partial\\rho}{\\\
    partial t} +\\div(\\rho\\mathbf{v})=0$$\n```\n\n```\n$$\\frac{\\partial\\rho\\\
    mathbf{v}}{\\partial t} +\\div(\\rho\\mathbf{v}\\mathbf{v})=-grad(p)-\\rho grad\\\
    Phi$\n```\n\n```\n$$\\frac{\\partial\\rho E}{\\partial t} +\\div(\\rho E\\mathbf{v})=-div(p\\\
    mathbf{v})-(p\\rho grad\\Phi,\\mathbf{v})-Q$$,\n```\n\n```\n$$\\frac{\\partial\\\
    rho E}{\\partial t} +\\div(\\rho E\\mathbf{v})=-(-(\\gamma-1)\\rho E\\div(\\mathbf{v})-Q$$\n\
    ```\n\n```\n$$p=\\rho E(\\gamma-1)$$\n```\n\n```\n$$\\rho E\\Delta\\Phi_{self}=4\\\
    pi\\rho$$\n```\n\n```\n$$\\Phi=\\Phi_{self}+\\Phi$$\n```\n\n$\rho$ is the density,\
    \ $\\mathbf{v}$ is the velocity vector, $p$ is the pressure, $\rho E$ is the density\
    \ of total energy, $\\rho E$ is the density of inner energy, $\\Phi$ is the gravitational\
    \ potential, $\\Phi_{self}$ is the gravitational potential of the gas itself,\
    \ $\\Phi$ is the contribution of the dark matter and stars to the gravitational\
    \ potential, $\\gamma$ is the adiabatic index, $Q$ is the cooling function.\n\n\
    The solver for the system of gas dynamics equations is based on the Fluids-in-Cells\
    \ method, which automatically satisfies the conservation laws. The method consists\
    \ of two stages: Eulerian and Lagrangian."
