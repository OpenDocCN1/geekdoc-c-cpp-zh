- img_proc: true
  md: '# Early Learning in Parallel Programming


    which shall be approved of when restrictions on the minimization of local agent
    memory and/or a share for all agents are introduced.


    It is useful to compare the old and new problems and their solutions, to show
    the general principles of dynamic programming. Note that this method can be used
    to study it after solving the problem and not before.


    A fundamentally similar problem is finding the shortest acyclic paths for all
    pairs of cities A and B. A ready agent-based sketch may be used to solve the task
    in a trivial but not untenable case when the previous solution is run for all
    pairs of A and B. To improve it, one should attempt to glue common fragments of
    agent behavior, but each agent does not know anything about the behavior of other
    agents. Overcoming obstacles is possible due to more information that may be applied
    to agents to select the desired behavior. There are different possible solutions
    but this is beyond our decision. We only note that the well known technique of
    constructing the so-called wave algorithms [13] can be eventually built. It is
    important to emphasize that this technique is given to trainees not as a finished
    sketch, but it is derived from the needs for specific tasks.


    The development of the sketch decisions in conjunction with their analysis is
    very productive not only in the curriculum. The goal is to summarize the decisions
    in the parallel program development schemes. The sufficiently general schemes
    can be offered as specialized techniques. The Ian Foster''s approach [14] is an
    example of this technique. obviously recognizes with the agent-based sketch and
    can be obtained it by generalization. This approach presented the process of designing
    a parallel program for four distinct stages: partitioning, communication, agglomeration,
    and mapping. In the first two stages, the developer focuses on concurrency and
    scalability and is aimed at the discovery of algorithms with these qualities.
    In the third and fourth stages, attention shifts to locality and other performance-related
    issues. The stages of the methodology called PCAM (acronym for the first letters
    of stages names) can be summarized as follows:


    +   1. The computations to be performed and the data processed by the computations
    are decomposed into small tasks. Practical issues, such as the number of processors
    in the target computer, are ignored, and attention is focused on recognizing opportunities
    for parallel execution.

    2. Communications. The communications required to coordinate task execution are
    determined and appropriate communication structures, and algorithms are defined.

    3. Agglomeration. The tasks and communication structures defined in the first
    two stages of a design are evaluated with respect to performance requirements
    and implementation costs. If necessary, the tasks are combined into larger tasks
    to improve performance or reduce the costs of development.

    4. Mapping. Each task is assigned to a processor in order to satisfy the competing
    objectives to maximize the processor utilization and minimize communication costs.
    Mapping can be specified statically or runtime by load-balancing algorithms.


    The last stage of the methodology clearly indicates that the mapping is based
    on the results of the first three stages, i.e., it is performed as a development
    of the program sketch. The methods of stages 2 – 4 are not associated with the
    use of formal languages (but they do not eliminate the use of them). So, these
    stages should be considered as a sketch programming that adds the appropriate
    restrictions by step.'
