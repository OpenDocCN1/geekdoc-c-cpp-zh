    # Abstract


    This chapter describes a comprehensive computer technology of numerical modeling
    of

    astrophysical flows on hybrid supercomputer equipped with computations accelerators

    (NVIDIA and/or Intel accelerators). The design of parallel computing algorithms
    for modeling

    t gas-dynamic, magnetic gas collisionless component of astrophysical objects with

    consideration of chemical processes are presented. There are three software packages
    described

    in this chapter: GPUPAGE code designed for simulation of astrophysics objects
    on hybrid

    supercomputers; AstroPhi code which is used for the dynamics of stars and molecular
    clouds

    simulation on hybrid supercomputers equipped with Intel Xeon accelerators; PADME

    code for simulation of planetary systems on hybrid supercomputers.


    Keywords: Co-design of parallel algorithms, parallel programming, computational

    astrophysics, hybrid architecture of computational systems, GPU-accelerators NVIDIA,
    Intel

    Xeon Phi accelerators


