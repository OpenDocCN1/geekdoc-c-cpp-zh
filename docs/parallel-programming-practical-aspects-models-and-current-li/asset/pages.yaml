    # 8. Conclusion


    Results of testing that efficiency of the algorithm [4] is high on multicore computers
    (Core-i7) for relatively small cellular arrays. The algorithm [6] delivers good
    efficiency only for large cellular arrays but can run on cluster with several
    nodes. The reason is in additional costs of MPI send and receivers. Further improvement
    of the algorithm should be focused on multread extensions to reduce the costs
    of communications. The algorithm [7,8] shows high efficiency for all sizes of
    cellular array and on all parallel architectures. The reason of such high performance
    is reduction of asynchronism (at the expense of Independence). For some models
    it is shown [7,8] that such reduction does not affect the simulation process.
    Nevertheless, for each new one has to make sure that the model allows such reduction.


