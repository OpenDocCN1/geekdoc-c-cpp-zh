    # ### Abstract


    This chapter presents some directions of the development of gas flows cellular
    automata models. The transitions from Boolean to integer models, from two-dimensional
    to three-dimensional models, and from the gas-stream to flow models in multiphase
    media are traced. A software implementation of a two-dimensional model of gas-powder
    flow with integer FHP-GP is proposed. A mechanism for parallel execution of the
    model on a cluster using the library MPI is described. The need for dynamic load
    balancing of cluster cores in the implementation of models with integer alphabet
    is shown. A diffusion balancing implemented for this model is argued. Also, some
    results of computational experiments are presented. A problem of dynamic load
    balancing application for gas and fluid flow by lattice gas automata (LGA) is
    considered. The choice of a diffusion balancing method is justified. The results
    of testing both balanced and imbalanced cases are presented. The efficiency of
    the realizations for LGA simulation is presented and the PIC-method compared.


    **Keywords:** cellular automaton, flows simulation, LGA, parallel program, dynamic
    balancing


