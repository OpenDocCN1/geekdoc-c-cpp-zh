    (pro-grams written in C),


    +   manaver - a program to manage subtotal sample moments calculated on processors
    (in a manual mode),


    +   genparam - a program to calculate multipliers of the parallel RNG (in a manual
    mode).


    Here rnd128, parmoncf and parmoncc are library routines to use in FORTRAN or C/C++
    user-supplied programs, genparam and manaver are executable files to run from
    a command line. Object files for the library routines are archived to a static
    library libr-monc.


    The PARMONC software realization does not use any unique features of a specific
    FORTRAN compiler or a MPI implementation. Therefore, it can be compiled and built
    with any FORTRAN compiler and MPI library and ported to different high-performance
    clusters or powerful personal computers with multi-core processors.


    The subroutine parmoncf/parmoncc initializes the parallel RNG, distributes the
    simula-tion of independent realizations among processors, makes all operations
    to, collect and save to the simulation results in files. The simulation results
    are stored in several files in a special subdirectory of the user''s working directory.


    These subunits take a name of a user-defined routine which computes a single-ization
    of a random object as argument. The main user-supplied program where a call to
    parmoncf/parmoncc is located is considered as MPI program despite the fact that
    it does not contain any MPI instructions (see an example in Section 3.3). This
    means that must be compiled, linked and launched according to specific rules defined
    by a particular MPI realization on the computer.


    The argument res is a resumption fact. It defines whether the previous simulation
    resumes the previous one or:


    +   res = 0 in case of a new simulation. In this case the parmonc creates new
    files with results.


    +   res = 1 in case of resuming the previous simulation. In this case the parmonc
    automat-ically takes into account results of the previous simulation (from the
    corresponding files) and averages it by formulas (5).


    The argument seqnum is the ''experiments'' subsequence number (it is equal to
    0,1,2, ...). In case of resuming the previous simulation, this argument must be
    different from the same argument of the previous use of parmoncfparmoncc.


    Also, there are parameters perpass, defining the days of data passing and averaging,
    respectively, as the number of minutes.


    The double precision function rnd128 is written using 64-bit integer arithmetic.
    The function has no arguments. After the initialization of the parallel RNG, rnd128
    starts-turning random numbers from a selected subsequence. Thus, on different
    processors, parallel streams of random numbers are generated independently.


    The program manaver is used to save and save in files the subtotal sample-ments
    calculated on processors. It is launched after the termination of a job on a cluster.'
