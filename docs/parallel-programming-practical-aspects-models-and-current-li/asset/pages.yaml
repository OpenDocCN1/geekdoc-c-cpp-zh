    Editor: Mikhail S. Tarkov

    ISBN: 978-1-63321-957-1

    © 2015 Nova Science Publishers, Inc.


    # Chapter 3


    # LARGE-SCALE AND FINE-GRAIN

    PARALLELISM IN PLASMA SIMULATION


    A. Snytnikov*


    Institute of Computational Mathematics and Mathematical Geophysics,

    The Siberian Branch of the RAS, Novosibirsk, Russia


    # Abstract


    A 3D kinetic study of the relaxation processes caused by the propagation of an
    electron beam

    in high-temperature plasma was carried out. This problem has two different spatial
    scales: the

    plasma Debye length and the beam-plasma interaction wavelength, that is the longs
    10 or 100

    times larger, thus one needs high-performance computation to observe the two at
    once.

    A mathematical model is built on the basis of the Particle-in-Cell (PIC) method.
    In order to

    ieve the highest possible computation performance, both large-scale and fine-grain
    parallel

    techniques are employed.

    The large-scale part is presented by the domain decomposition and is performed
    by

    supercomputers. The parallelisation efficiency is presented as well as the performance

    of the program achieved with different clusters. The tests show that it is

    necessary to provide a good bandwidth for the cluster if one wants to achieve
    good

    performance on real physical problems.

    The fine-grain part is created by pushing each particle with a separate thread
    of a GPU

    (Graphics Processing Unit). Hybrid (GPU-equipped) supercomputers have reached
    very high

    performance level nearly.

    Unfortunately, the solution of real physical problems with supercomputers is

    restricted by complexity of the GPU programming. In order to simplify the development
    of

    high-performance physics codes for supercomputers a template implementation

    of the PIC method was created. The template templates are the problem-specific

    implementations of "particles" and "cells" (as C++ classes). Thus, it is possible
    to develop a

    PIC code for a new plasma physics problem without studying the GPU programming
    by a

    plasma physicist. Instead the new physical features are just included into the
    existing code as

    new implementations of "particle" and "cell" classes.


    **Keywords:** Plasma simulation. PIC method, GPU, C++ templates


    > * E-address: snyav@gmail.com'
