  md: '# XPU: A C++ Metaprogramming Approach to Ease Parallelism Expression 191


    SIMD technologies are available in most recent monocore, and manycore processors.
    Intel and AMD processors implements the Streaming SIMD Extension (SSE) [39] which
    is a SIMD instruction set extension to the x86 architecture. SSE operates on 128-bit
    registers and allows simultaneous SIMD operations on eight chars, integers, simple
    precision floats or double precision floats.


    While implementing data level parallelism through the "parallel_for" construct,
    XPU provide instruction-level parallelism at finer gain through a set of built-in
    vectorized types that are implemented in top of SSE to support SIMD. Traditional
    SSE programming can be a hard and time-consuming task since programmer is responsible
    of performing many low-level routines such as data loading, storing and computations
    in addition to ensuring data alignment in memory and organizing data structures
    for SIMD operations... XPU try to recover parallelism from these by hiding these
    low-level details behind a set of built-in vectorized types that act like regular
    floating-point types in C/C++ language and handle internally many of these low-level
    routines. XPU provide the "vec3fvec4f" vectorized types to enable simultaneous
    operations on respectively three and four single precision floats and the "vec64d"
    Supported operations include basic arithmetic operations such as addition or multiplication
    natively supported by SSE in addition to more advanced functions such as trigonometric
    primitives, logarithm and exponential approximations... [1].


    # 8.3. Application


    The "parallel_for" construct has been used in several applications such as the
    "Black-Scholes" algorithm and the "Fluid Animation" problem from the PARSEC benchmark.
    The results of these benchmarks have been discussed in previous works [1, 4].


    In our signal processing application, we use the vectorization capability of XPU
    to speed up the filtering process. At each processing stage (filter bank), each
    filtering operation implies uniform multiplication of large number of signal samples
    by the filter coefficients then the accumulation of their sum. Both signal samples
    and filter coefficients are stored as tables of floats. Vectorization can be naturally
    implemented using the regular float buffers as XPU "vec4f". This allows us to
    process four pairs of floats at once each operation instead of one single pair
    float at a time.


