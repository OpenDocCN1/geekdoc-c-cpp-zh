    # 6.2. Type of Cell State


    Cell state is of primitive, or structure type. A primitive type is one out of:
    byte, int or float. In case of set type, a set of possible cell state values is
    defined by a list of identifiers. The structure type is a list of fields, where
    each field has a name and a type. A type is also of primitive, set, or structure
    type. Several examples of cell state type definition:


    ```

    Ex.2: cell

    cell : int;

    cell : set{empty, stable, movable};

    cell : int;

    cell : struct{

    h : int;

    a : set{CO, Oss, CO.Oss, Empty};

    };

    ```


    # 6.3. Parameters


    Description of a parameter starts from ''param''. Parameter is a variable of primitive
    type visible among all arithmetico-logical expressions in cellular automata definition.
    Value of parameter by default is to be written in the text as follows:


    ```

    Ex.3: param float probCodes = 0.2;

    param float prob2ads = 0.1;

    ```


    In addition to user-defined parameters, there are two built-in integers N and
    M: sizes of cellular array $N_y$ and $N_z$, respectively. Default value for N
    and M is 100.

    The default value of a parameter can be changed by program arguments:


    ```

    Ex.4: ./ca -probCodes 0.5 -N 124 -M 128

    ```'
