    # 4. Stochastic Simulation of Electron Avalanche Evolution


    Gas discharges are of great interest to physicists and engineers in a number of
    fields. The primary element of the often complicated breakdown process is the
    *electron avalanche*, which develops in the gas when a strong electric field is
    applied to it. An avalanche begins with a small number of "seed" electrons that
    appear accidentally (it can be triggered by a single electron). An electron picks
    up energy in the electric field. Having reached energy greater than the ionization
    potential, the electron ionizes a molecule, losing its energy. The result is the
    production of two slow electrons. They are again accelerated in the field, ionize
    molecules, thereby producing four electrons, and so forth [27].'
  merge: -1
  pgno: 143
