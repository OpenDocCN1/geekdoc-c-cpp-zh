  md: 'Parallelization of the ACA is performed by domain decomposition method: each
    process hosts its own domain of cells and stores the copies of boundary cells
    of neighboring processes. A parallel algorithm simulation should preserve the
    behavioral properties of ACA: Independence, Fairness, Correctness, and Efficiency.
    Efficiency means independent selection of cells during simulation. Fairness means
    deadlock-absence and coherence of boundary cells and storing copies in different
    processes. Efficiency implies that $T_k$ is less than $T_1$ for some $k$. Here
    $T_k$ is the total time of parallel algorithm execution on $k$ processors, and
    $T_1$ is the total time of sequential execution on one processor.


    There are several parallel algorithms of ACA simulation on computers with different
    architectures. [4] an algorithm suitable for shared memory computers is proposed.
    Parallel algorithms for distributed memory computers are presented in [5, 6].
