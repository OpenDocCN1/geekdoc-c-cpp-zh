  md: '# 3.2. The Template Implementation of the PIC Method


    In order to provide the tool for fast development of the new problem-oriented
    PIC codes for GPUs it is necessary


    +   - to develop an optimized GPU implementation of the PIC method for a particular
    problem

    - to create a set of diagnostic tools to facilitate the analysis of results by
    a physicist

    - to provide an option to replace the problem-specific parts of the computational
    algorithm


    In order to achieve the third point the C++ templates are used. It means that
    the "computational domain" class is implemented with "cell" class objects. "Cell
    class contains "particle" class objects. Here "computational domain" is a template
    class with "cell" as a parameter. "Cell" is a template itself, "particle" being
    its parameter.


    For a variety of PIC method implementations most of the operations of a cell with
    its particles are absolutely the same (adding/removing a particle, particle push,
    the evaluation of the particle''s contribution to the current).


    Only the gridless particles of gyrokinetics might be an exception. And even they
    fit into the proposed scheme since they don''t need some of the operations, they
    don''t introduce anything new. This fact brings that these operations implemented
    as a template will be efficient for a number of problems solved with the PIC method.


    The operations of the computation with cells are absolutely the same for all implementations
    of the PIC method. The things that differ are the initial distribution and boundary
    conditions. These operations must be implemented as virtual functions.


    Since particle attributes and the particles are alike in most cases, it is possible
    to create a basic implementation of the "particle" class containing particle position,
    momentum, charge and mass.


    If some new physical problem the "particle" needs new attributes, a derived class
    is implemented. And this new class "derived particle" is used as the parameter
    to "cell" template class.


    At present there are object-oriented implementations of the PIC method (e.g.,
    OOPIC library). There are also the template libraries for PIC method [4] but only
    for the CPU-based supercomputers, not for the hybrid ones.


    ![](img/b73f5fa8e889a0cc9390bc30e4d82ae3_78_0.png)


    ![](img/b73f5fa8e889a0cc9390bc30e4d82ae3_78_1.png)'
