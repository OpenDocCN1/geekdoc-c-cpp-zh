    # 6.2. The Method of Partial Sums


    In [9] it is shown that the recurrent Wang (21)-(23) gave good results in solving
    the system of equations (24) by Seidel. It is easy to see that the solution of
    the problem (21)-(23) is associated with multiple calculation of the same partial
    sums in the equations:


    $\sum_{i=1}^{n} v_{ij}=1, j=1,...,n,$


    $\sum_{j=1}^{n} v_{ij}=1, i=1,...,n.$


    In to avoid redundant computation, let us calculate the partial sums

    "Vertical" partial sums


    $V_{ij}=\sum_{k=1}^{i} v_{kj}, V_{ij}''=\sum_{k=1}^{j} v_{ik}, i, j=1,...,n,$


    "Horizontal" partial sums


    $H_{ij}=\sum_{l=j}^{n} v_{il}, H_{ij}''=\sum_{l=1}^{j} v_{lj}, i, j=1,...,n,$'
