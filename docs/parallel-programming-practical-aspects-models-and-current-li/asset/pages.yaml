- img_proc: true
  md: 'Introducing his approach, Foster rightly warns that the PCAM technique is not
    universal

    it it is not the only one. He demonstrates its use in solving a number of problems
    as a

    design pattern. Thus the Foster''s teaching concurrency is solved within the traditional

    teaching methods opposite to what is proposed in this chapter.


    # # Conclusion


    The discussion shows that early learning parallel programming should be

    associated with a more general provision on the division of programming into two
    activities: a

    logical construction of a program sketch and mapping it on a real computer. Of
    course, the

    design must be fitting for building computable sketches, i.e., they should be
    represented so

    mapping is simplified. The mere fact that the division of two activities during

    programming promotes liberated training and allows one effective teaching methods.

    Applied to the study of concurrency in programming, it means that the teacher
    has abandon

    the traditional design of the template solutions. Or if she should focus on offering
    the

    greatest number of sketches for discussion. Comparing the sketches from different
    points of

    view, the learners learns to a decision for which the mapping should be constructed.
    In other

    words, we encourage the learners to select the problematic tasks involving an
    analysis of options

    choosing the optimal solution [15] that has good for the skills evolution in the

    methods creation and development.


    Selection of activities for constructing the program sketch, for a good reason,
    may

    regarded as a special kind of programming which is naturally called the sketch
    preliminary

    programming. Everything else remains usual: the sketches of data structures and
    the

    operators retain their meaningful understanding, and "manual" mapping of the sketch

    program on a real computer is completely analogous to a usual compilation. Thanks
    to the

    freedom of choice of the language means, the sketch programming can be regarded
    as the

    most high-level program design. If we turn to the traditional design of programming
    which

    uses a fixed language, then such development can be considered as a sketch programming
    for

    which the compiler enables automatic mapping of the sketch on the real computer.
    Thus,

    the sketch programming, highlighted this chapter, can be defined as the process
    for which the

    compilation remains manual work. This does not mean that the sketch programming
    should

    not be automated. On the contrary, it needs an adequate support which, in particular,
    pointed

    to possible errors so as as the compilation completes.


    In developing the early learning parallel programming methods, the main problem
    to

    solved is to find problems that provide solutions with a natural parallelism.
    To realize

    this, traditional learning should be analyzed, especially the tasks that allow
    one parallel

    solution. It is needed to reconstruct the sketch tasks to select the sketch components
    allowing the

    parallel solutions and mapping them on real computers. The examples above may
    be regarded

    as the first step in direction.'
