    an edge between $x$ and $y$, i.e., $(x,y)\in E_p$.


    Analogous, the graph of distributed CS $G_s=(V_s,E_s)$ is defined as a set of
    nodes (elementary computers – ECs) and a function


    ```

    $G_s:V_s \times V_s \to{0,1].$

