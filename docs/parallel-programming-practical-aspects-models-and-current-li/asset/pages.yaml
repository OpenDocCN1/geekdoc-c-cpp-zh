    # 5. Mapping Problem for Uniform Graphs


    For distributed computer systems (CS), the graph of a parallel program $G_p(V_p,
    E_p)$ is usually deemed as a set $V_p$ of the program (virtual elementary computers)
    interacting with each other by the point-to-point principle through traversing
    via logical (virtual) channels (which may be unidirectional or bidirectional)
    of the set $E_p = V_p \times V_p$. Interactions between the processes are ordered
    and in space for most parallel applications (line, ring, mesh, etc.). (Figure
    1).


    For this reason, the maximum efficiency of information interactions in advanced
    high-performance CS $G_s(V_s, E_s)$ of connections between individual computers
    (hypercube, 2D-torus, or 3D-torus) [5, 6]. The hypercube structure is defined
    by a graph as a $m$-dimensional Boolean cube with a number of nodes $n=2^m$. Toroidal
    structures are $m$-dimensional Euclidean meshes with clouded boundaries. The group
    of automorphisms $E_m = E_m^ \otimes C_{N_k}$, where $N_k$ is the order of the
    subgroup and $\otimes$ is the symbol of the direct product. For $m=2$, we obtain
    a two-dimensional torus (2D-torus); for $m=3$, we obtain a 3D-torus.


    In many cases of parallel programming practice the weights of all nodes (and all
    edges) may be equal to each other. In these cases of mapping parallel program
