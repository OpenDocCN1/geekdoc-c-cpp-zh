    # Conclusion and Future Work


    In this new software codes AstroPhi and GPUPEGAS is proposed. The codes are designed
    for simulation of astrophysical objects dynamics on hybrid supercomputers equipped
    with Intel Xeon Phi and GPU computation accelerators. The details of parallel
    implementation are described. Also the changes to the computational algorithm
    are shown that enable the efficient parallel implementation. The speed-up of 27
    times was obtained within a single Xeon Phi accelerator. The use of 32 Xeon Phi
    accelerator resulted in 94% parallel efficiency. The speed-up of 55 times was
    obtained within a single GPU accelerator. The use of 60 GPU-accelerator resulted
    in 96% parallel efficiency. This work is part of project "Hydrodynamical Numerical
    Modelling of Astrophysical Flow at the Peta- and Exascale", developed by the present
    authors in the Siberian Supercomputer Center, ICMMG SB RAS in collaboration with
    the Institute of Astronomy RAS.


    Further on the AstroPhi code will be developed in different directions. For example,
    the technique used for computation at Lagrangian stage.'
