    # Conclusion


    The methods for efficient mapping data processing neural networks onto robust
    distributed computer systems (DCS). The cellular neural networks are mapped onto
    the graphs of parallel programs with structures "mesh" and "line". The efficiency
    of the proposed methods for neural networks with global connections (Hopfield
    network


    The method for mapping a layer (for multilayer feedforward networks, Hopfield
    network or Kohonen network ) depends on the ratio of the neurons in the layer
    and the number of neuron weight coefficients (image pixels number) : if the numbers
    are relatively small, it is a more efficient method of distributing the layer
    weight columns (synapses parallelism). Otherwise the distribution of the weight
    rows (neurons parallelism) is more efficient. In particular, mapping the Hopfield
    network onto the torus, the rows distribution gives the best result. On the hypercube,
    for the Hopfield network, both weights distribution methods give the same result.


    The proposed mapping techniques provide a uniform distribution of the results
    of image transformation by the neurons layer on the processes of the parallel
    program with a toroidal structure. Hence, the mapping of the weight matrix of
    the second neurons layer can be realized similar to the first layer mapping. The
    mapping method (by rows or columns) is also determined by the ratio of the neurons
    number of the second layer to input signals number.


    So, we found that the neural network layers mapping onto a distributed computing
    system, by the network operation and during the training phase, it is reduced
    to the following types of distributed computing schemes:


    +   1) parallel (independent) computations in elementary computers of the system;

    2) an all-to-all intercomputer data exchange;

    3) sums computation by a doubling scheme with the mapping of this scheme onto
    a hypercube with a subsequent embedding of the hypercube into the torus (implementation
    of semigroup array operations on the hypercube and torus).


    The proposed methods lead to the parallel programs generation with the following
    regular structures: line, mesh, binary tree, hypercube and toroidal structures
    of different dimensions (in particular, the ring).


