  md: "# 6 Mikhail S. Tarkov\n\nlow-level image processing. In modern supercomputer\
    \ distributed systems the multidimensional torus are usually used as network graphs\
    \ [15, 16].\n\nA $p_1 \times p_2 \times \\dots \times p_n$ mesh is the nearest\
    \ neighbor network where each node is labeled as $(a_1, a_2, \\dots, a_n)$, $a_i\
    \ \\in \\{0, \\dots, p_i-1\\}$, $i=1, 2, \\dots, n$. Two nodes $(a_1, a_2, \\\
    dots, a_n)$ and $(b_1, b_2, \\dots, b_n)$ are adjacent in the mesh, if $a_i =\
    \ b_i \\pm 1$ and for every $j \neq i$, $a_j = b_j$. Multidimensional torus are\
    \ multidimensional meshes with a \"wrap around.\" That is a $p_1 \times p_2 \t\
    imes \\dots \times p_n$ torus is a network of $p_1 \times p_2 \times \\dots \t\
    imes p_n$ nodes where nodes $(a_1, a_2, \\dots, a_n)$ and $(b_1, b_2, \\dots,\
    \ b_n)$ are adjacent, if $i$, $a_i = b_i \\pm 1 \\pmod{p_i}$ and for every $j\
    \ \neq i$, $a_j = b_j$.\n\nA parallel algorithm for DCS should be considered as\
    \ a set of mutually interacting processes, where each process follows a sequential\
    \ program and local data memory [18–21]. The processes interact by sending and\
    \ receiving messages. The message transfer is asynchronous. Receiving operation\
    \ of the communication is synchronous; it causes a blockage of the process up\
    \ to receiving the message. In words, a parallel algorithm for distributed CS\
    \ will be considered a distributed virtual CS and the interacting processes of\
    \ a parallel algorithm as virtual processors (elementary components) of such a\
    \ system.\n\nMethodology for designing parallel algorithm involves the following\
    \ phases [18]:\n\n+   * decomposition to processes\n* synthesis of a graph of\
    \ interactions between processes\n* merging processes\n* mapping processes to\
    \ the processors of a computer system\n\nThe interaction between the processes\
    \ is called local if the process interacts with a small number of other processes\
    \ called neighbors (the number of neighbors is significantly less than the total\
    \ number of processes). An example of a neural network with local interactions\
    \ is a cellular network. If the number of processes involved in the interaction\
    \ is compared to the total number of processes, then the interaction is the global\
    \ (e.g., in computation of the sum of the vector components distributed over all\
    \ the processes of the parallel program). Neural networks with global interactions\
    \ are sigmoidal multilayer neural networks, Hopfield networks, Kohonen networks\
    \ and others.\n\nThe algorithms with local interactions are easily mapped onto\
    \ regular structures of parallel programs of types \"line\" or \"mesh\" (Figure\
    \ 3). The algorithms with global interactions are mapped onto a hypercube which\
    \ can then be embedded into tori of various dimensions (including the ring, i.e.,\
    \ one-dimensional torus).\n\n# 3. Mapping Neural Networks with Local Interactions\
    \ (Cellular Neural Networks)\n\nIn a cellular neural network (CNN) neurons are\
    \ located in the mesh nodes (for example, see Figure 3a), or in the nodes of a\
    \ regular graph. Each neuron has weighed connections with his"
