  md: '# 2.6. Cluster Performance Comparison


    Every time step consists of the following procedures:


    +   - Computation of electric and magnetic fields

    - Computation of the movement of particles

    - Evaluation of the new values of current and charge density


    In addition, during selected time steps (usually one time step a half) of the
    physical data are filed for future analysis. The most important part of the data
    is the Fourier Transform of main physical quantities (current and charge densities,
    absolute values of electric and magnetic fields). The sometime of the above listed
    procedures was measured with the GnuProf(gprof) profile. Each time case of the
    single procedure is called.


    The program was tested with four supercomputers. The first one is installed in
    Tomsk State University. It has 564 Xeon 5150 processors and is called SKIF Cyber.
    The second is the MVS-100K. It is installed in the Joint Supercomputer Center,
    Moscow and is equipped with different Xeon Processors. Each of them is Xeon and
    the total number of cores is 7920. The third one is the SKIF MSU. It is installed
    in the Research Computing Center of Moscow State University. It has 1250 processors
    (mostly Xeon E5472). The fourth cluster is installed in Novosibirsk State University,
    so it will be called the NSU cluster. It is equipped with Xeon 5355 processors
    with the total number of cores 512. A detailed description for these clusters
    can be found at http://supercomputers.ru (the list of most powerful supercomputers
    in Russia). All the clusters are equipped with similar processors, but with different
    networks, and this results in a dramatic difference.


    In order to evaluate the new values of position and impulse of a particle it is
    necessary to know the values of electric and magnetic fields at the present position
    of the particle. Each of the three components of the field is stored in a 3D array.
    3D arrays. Since the particles are situated randomly in the subdomain, the access
    to the arrays is unordered. It means that the use of the cache memory can not
    reduce the computation time. If a part of the field array were fetched to the
    cache in the process of computation of the particle movement, it would be impossible
    to use this part of the field array for the computation with the next particle,
    because it is (most) located in a completely different part of subdomain.


    Since the cache memory can not store all the arrays for fields, one has access
    to the RAM (Random Access Memory) for computation of the particle movement. And
    since the performance of the program is usually limited by the memory bandwidth,
    it is the memory bandwidth that determines the speed of the computation with particles
    and the performance of the program as a whole (particles take over 60 % of the
    total time). Figure 3 shows the time of computation with particles during one
    timestep.


    The conclusion of the major influence of the memory bandwidth on the particle
    computation time is confirmed by the comparison of the times obtained with the
    MVS-100K and the SKIF MSU clusters. Both clusters are equipped with similar processors,
    so the resulting difference (almost twofold) can only be explained by the difference
    of the memory bandwidth. Figure 3 also shows that there are opportunities for
    performance optimization. One of the possible ways is to sort particles along
    their position to enable the efficient use of cache memory.'
