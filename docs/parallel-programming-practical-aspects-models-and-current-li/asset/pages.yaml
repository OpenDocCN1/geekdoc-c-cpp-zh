    +   * a simple processing element, the neuron;

    * huge number of neurons are participated in information processing;

    * each neuron is connected to many other neurons (global connections);

    * huge number of inter-neuron connections with changing weights;

    * massive parallelism of information processing.


    The network possessing these properties belongs to the class of connectionist
    models of information processing. Their main feature is the use of weighed connections
    between processing elements as a means of storing information. The processing
    is carried out at the same time by a large number of neurons, and each neuron
    is connected to many other neurons; the neural network is resistant to malfunctions
    and is capable of fast computing. To create a neural network for a specific task
    is to determine:


    +   * a neuron model;

    * connection topology;

    * connection weights.


    Neurocomputer is a device that contains a neural network as the major component
    and has applications in many areas:


    +   * artificial intelligence: pattern recognition, image processing, reading
    handwriting characters, etc;

    * control system and technical control;

    * creation of special parallel computers;

    * study of the human brain.


    Neural networks are different not so much in their neuron model as the topology
    of connections and rules determining the weights (training rules). The neural
    network structures are divided into single-layer structures and multi-layer ones.
    Single-layer networks are cellular networks, Hopfield and Kohonen networks.


    Multi-layer network has an input layer, output layer and hidden layers. The input
    layer receives input data; the output generates the output result of processing
    and hidden layers are involved in processing information.


    Unlike traditional means of information processing, the neural network programming
    performed implicitly in the training process. Training is constructed as follows.
    There is a training set, i.e., a set of examples with answers. These examples
    are presented to the neural network. The neurons receive conditions of the example
    and transform them. The neurons are communicated repeatedly by transformed signals
    and, finally, a response in the form of an output set of signals. A deviation
    of an output from the correct answer is penalized. Training is meant to minimize
    the penalty as an implicit function of weights of neuronal interconnections.


    Traditional computer systems have the following systems:'
