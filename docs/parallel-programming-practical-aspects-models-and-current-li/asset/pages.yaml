  md: "# Large-Scale and Fine-Grain Parallelism in Plasma Simulation\n\n# 2.2. Model\
    \ Description\n\nThe mathematical model employed for the solution of the problem\
    \ of beam relaxation in plasma consists of the Vlasov equations for ion and electron\
    \ components of the plasma and also of the Maxwell system. The equations have\
    \ the following form in the usual notation:\n\n```\n$\\frac{\\partial f_{i,e}}{\\\
    partial t}+\\mathbf{v} \\cdot\\frac{\\partial f_{i,e}}{\\partial \\mathbf{r}}+\\\
    mathbf{F}_{i,e} \\cdot\\frac{\\partial f_{i,e}}{\\partial \\mathbf{p}}=0, \\quad\
    \ \\mathbf{F}_{i,e}=q_{i,e}\\left(\\mathbf{E}+\\mathbf{v} \\times \\mathbf{B}\\\
    right),$\n\\n$\\mathbf{B} = \\frac{4\\pi}{c}\\mathbf{j}+\\frac{\\partial \\mathbf{E}}{\\\
    partial t},\\n\\n$\\mathbf{E} =-\\frac{1}{c}\\frac{\\partial \\mathbf{B}}{\\partial\
    \ t},\\n\\n$\\mathbf{div} \\mathbf{E}=4\\pi\\rho$,\\n\\n$\\mathbf{div} \\mathbf{B}=0.$\n\
    ```\n\nAll these equations worked are solved by the method described in [3]. All\
    \ the equations will be further given in the non-dimensional form. The following\
    \ basic quantities are used for the transition to the non-dimensional form:\n\n\
    +   * characteristic velocity is the velocity of light $v_{ch}=3\\times10^{10}$\
    \ cm/sec\n* characteristic plasma density $n=10^{14}$ cm$^{-3}$\n* characteristic\
    \ time $\tau_{ch}=\\omega_{be}^{-1}$ (a value inverse to the electron plasma frequency)\
    \ $\tau_{ch}=(4\\pi n_0 e^2/m_e)^{0.5}=5.3\\times10^{-12}$\n\nThe Vlasov equations\
    \ are solved by the PIC method. This method implies the solution of the equation\
    \ of movement for model particles. The movement equations of the particles are\
    \ the equations of characteristics of the Vlasov equation.\n\nThe scheme proposed\
    \ by Langdon and Lekinski is used to obtain the values of the electric and magnetic\
    \ fields. The scheme employs the finite-difference form of the Faraday and Ampere\
    \ laws:\n\n```\n$\\frac{\\mathbf{B}^{m+1/2}-\\mathbf{B}^{m-1/2}}{\\tau}=-rot_j\\\
    mathbf{E}^m,\\n\\n$\\mathbf{E}^{m+1}-\\mathbf{E}^m=-4\\pi\\mathbf{j}^{m+1/2}/\\\
    tau+rot_j\\mathbf{B}^{m+1/2}.$\n```\n\nA detailed description of the scheme is\
    \ found in [3]. The scheme gives the second order of approximation with respect\
    \ to space and time."
