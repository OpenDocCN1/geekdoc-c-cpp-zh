    high performance clusters, it is desirable to define a hierarchy of embedded subsequences
    of the general sequence $\{\alpha_l\}$. To this goals sequences of base random
    numbers may be assigned to: a) different stochastic experiments, b) different
    processors and c) different realizations:


    +   * within each subsequence $\{\alpha_l\}$, the ''leaps'' of length $n$ are
    used in (8) to define the initial numbers of subsequences that will be used to
    perform stochastic experiments (when doing it, "experiments" subsequences are
    produced)


    +   * within each ''experiment'' subsequence, the ''leaps'' of length $n_p < n_e$
    are made using (8) to define the initial numbers of embedded subsequences that
    will be used on different processors (when doing it, "processors" subsequences
    are produced)


    +   * within each ''processor'' subsequence, the ''leaps'' of length $n_r < n_p$
    are made using (8) to define the initial numbers of embedded subsequences that
    will be used to simulate independent realizations (when doing it, "realizations"
    subsequences are produced)


    Thus, the hierarchy of the embedded subsequences is as follows:


    general sequence $\supset$ "experiments" subsequences

    "experiments" subsequence $\supset$ "processors" subsequences

    "processors" subsequence $\supset$ "realizations" subsequences'
