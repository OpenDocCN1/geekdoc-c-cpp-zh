  md: 'The particles are excluded from the particle array and put into the transfer
    buffer. Next, the buffers are transmitted to the processors assigned to adjacent
    subdomains. If the rank of the current subdomain is Y, the particles are first
    transmitted "to the left", that is, to the subdomain with Y coordinates less than
    those in the current subdomain, and to "to the right". If the number of the current
    subdomain is odd, exactly the opposite happens - first the particles are transmitted
    to the right, and then to the left.


    Consequently the time shown in Figure 5 includes the search through the list of
    particles and transmitting operations MPI_SendRecv.


    The number of particles being transmitted cannot be large due to physical considerations.
    In plasma physics no large differences in density may occur within the Debye length,
    10 % being a large difference in this. The Debye length, as pointed above, must
    be not less than 8 cells for the correct simulation of wave dynamics.


    With the grid size of 512x64x64 nodes, the domain is divided into 32 subdomains,
    the width of a subdomain along the Y axis is 2 cells.


    Thus the densities in adjacent subdomains should not differ by more than 10 %.
    If particle flux from one processor to another is one, the computation is physically
    incorrect. In a way it is possible to set the size of the transfer buffer to 5
    % of the size of the particle array, the number of particles being sent usually
    much less.


    Figure 5 shows that the loss of transfer time is minimal with the SKIF Cyberia
    and the SKIF MSU. This is possibly because the ServNet technology installed on
    the SKIF machines. The maximal time is wasted for transfer with the MVS-100K.
    This is probably because of the large size and heterogeneous nature of this supercomputer.


    # 3. Fine-Grain Parallelism in Plasma Simulation


    The fine-grain level of parallelism is represented here by assigning separate
    particles in the PIC method to the processes or threads in a single core or processor
    is impractical since the number of cores is usually much less than the number
    of particles (usually thousands and millions, respectively).


