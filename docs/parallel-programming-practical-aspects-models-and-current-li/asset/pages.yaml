    # Abstract


    Overview and experimental comparative study of parallel algorithms of asynchronous

    cellular automata cells. The algorithms are tested for the model of

    physicochemical process of surface CO + O2 reaction on the supported Pd nanopar-

    ticles on different computers. For testing we used shared memory,

    distributed memory computers (i.e. clusters), and graphical processing unit. Char-\acterization
    of the cells in respect of methods of parallelism maintenance is

    given. A new domain language CACHE and its translator into C and Process-

    ing are presented, where the domain is a set of cellular automata models of physico-

    chemical processes.


    **Keywords:** asynchronous cellular automata, parallel algorithm, domain specific


    # 1. Introduction


    Asynchronous cellular automata (ACA) are used for simulation of physical and chemical

    reactions on molecular level, for example, to study oscillatory chemical surface
    reactions

    [1,2], absorption, sublimation and diffusion of atoms in the epitaxial growth
    processes [3].

    Simulation of natural processes requires large space and many of iterative steps

    for obtaining the real scene of the process. Therefore, it requires a lot of computing
    power.

    Unfortunately, ACA cannot be easily parallelized as synchronous cellular automata

    (SCA). As distinct to SCA, ACA functioning is a sequential application of transition
    rule

    to randomly select cells. The cells are selected with equal probabilities and
    irrespective

    of the process history.


