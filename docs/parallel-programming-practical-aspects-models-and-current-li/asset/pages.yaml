    # 6.4. Mapping Multilayer Neural Networks


    Consider a two-layer sigmoid network with $m$ neurons in the hidden layer and
    $k$ neurons in the output layer. When processing data arrays (images, for example)
    with $N$ elements, the following relations are usually performed:


    ```

    $m << N, k << N.$

    ```


    Let the neural network is mapped onto DCS with the structure of a hypercube or
    torus with the number of computers $n \leq m$. According to Theorem 6 for $m <
    N$ the weights matrix of the hidden layer should be placed on processors by columns
    (parallelism of synapses).


    For the output neural network layer, we obtain the parallelization coefficients:


    +   a) for the hypercube


    ```

    $S_r = \frac{n}{(n-1)t_w}{2kt_o}, S_c = \frac{n}{(n-1)t_w}{2mt_o};$

    ```


    +   b) for the torus


    ```

    $S_r = \frac{n}{(n-1)Dt_w}{2kt_o}, S_c = \frac{n}{(n-1)Dt_w}{2mt_o}.$

    ```


    Hence, when $k > m$, we see $S_r > S_c$; otherwise $S_c > S_r$, i.e., for image
    (or signal) compression problems $(k > m)$ in the output layer, we should use
    neurons parallelism, and, for classification tasks (recognition) $(m > k)$, we
    should use synapses parallelism.


