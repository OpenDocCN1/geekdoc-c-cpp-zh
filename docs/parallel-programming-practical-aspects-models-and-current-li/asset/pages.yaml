    # 4. Parallel Implementation


    The main problem in the astrophysical code development is the efficient solution
    of gas dynamics equations and the Boltzmann moment equations since it takes up
    to 94% of computation time (Figure 13).


    The uniform mesh in Cartesian coordinates is used for the solution of gas dynamics
    equations. Thus it is possible to use the arbitrary Cartesian topology for domain
    decomposition. Such a combination of mesh and topology enables potentially infinite
    scalability. The GPUPEGAS code is an MPI decomposition along the coordinate, while
    the other coordinates the CUDA tool is used. The Astrophi code uses 1D domain
    decomposition. One of the directions the decomposition is performed by the MPI
    tools, and further decomposition is performed by OpenMP tools within each subdomain.
    The parallel implementation is related to the topology and architecture of a hybrid
    supercomputer NKS-G6 of the Siberian Supercomputer ICandMG SB RAS. The co-design
    of the numerical method for solving the hydrodynamic equations is implemented
    at every stage irrespective computation of the fluxes through each cell. In this
    case, the one-layer overlapping of the boundary points of the neighboring subdomains
    is needed. In order to increase the scalability of the numerical method the next
    step will be to abandon the solution of Poisson equation and to evaluate the field
    from the equivalent evolution equation of the Cauchy-Kowalewskaya type for the
    gradient of potential.


    ![](img/b73f5fa8e889a0cc9390bc30e4d82ae3_107_0.png)


