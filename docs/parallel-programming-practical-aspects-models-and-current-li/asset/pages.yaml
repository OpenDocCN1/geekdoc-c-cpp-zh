  md: '# 3.4. Evaluation of Scalability of Distributed Stochastic Simulation on Supercomputers


    The problem of studying the properties of scalability of parallel algorithms and
    programs when transferring their implementation from current computer to more
    powerful (up to future exascale supercomputers) reached the level of technological
    challenges and requires thorough researches. Computational algorithms are generally
    more conservative with the development of computer technology. Evaluating future
    behavior of an algorithm developed by a given computational scheme can be done
    by simulating its execution. Such model represent usage of thousands or millions
    of computational cores by a parallel program. By simulation, it is possible to
    find bottlenecks in algorithms for understanding how to modify them for achieving
    efficient scaling to a large number of cores.


    In many cases, we need estimating scalability of parallel programs, not exact
    loading of computer''s kernels and memory/or computation time. For this purpose,
    we use the agent-based simulation system named AGNES (Agent Network Simulator)
    [24]. The AGNES proves to be the efficient tool for comparison of different variants
    of mapping parallel program data and onto high-performance computational system
    up to future exascale supercomputers [25], [26]. Prior simulation of these algorithms
    allows choosing their parameters for improvement over their real execution and
    predicting performance for future runs on more powerful supercomputers.


    The simulation model have been calibrated on a real data obtained by profiler
    when running computational program (by the PARMONC). Important information for
    configuring the model includes a diagram of the computation algorithm and temporal
    characteristics of the stages of computation.


    For simulating large scale computations by the Monte-Carlo method, a computational
    core with algorithm running on it has chosen as an elementary unit. That is, the
    same agent completes the behavior of the computational core and the communication
    of the hardware. For this model, two types of agents are designed:


    +   * MonteCarlo involved in direct simulation of computations;


    +   * CentralMC agent simulates aggregation of calculation results.


    The simulation model works the following steps:


    +   1. All functional agents are initialized and prepared for work.


    +   2. Agents MonteCarlo start starting computations of realizations of the Monte
    Carlo algorithm. After completing each L realizations, with results of these calculations
    are sent to the agent CentralMC.


    +   3. Agents CentralMC collect data with results of calculations and process
    periodically, saving resulting information to the disk (for analysis of simulation
    results).


    +   4. The criterion for stopping the simulation is achieving the desired accuracy
    of calculations, in other words the number of simulations by agents MonteCarlo.


    Thus, CentralMC counts the total number of performed operations and at achieving
    threshold sends to the AGNES a command to complete the simulation run.'
  merge: -1
