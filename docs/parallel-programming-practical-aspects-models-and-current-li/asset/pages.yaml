    # Conclusion


    Along this chapter, we parallelized the target application progressively by expressing
    several parallelism types at different granularity levels starting from coarse
    grain to finer grains. Use of both tasks, pipeline and data parallelism, enabled
    us to extract a significant amount of parallelism and to achieve high performance
    and good scalability.


    We outline the programmability of the XPU programming model which allows the programmers
    to easily express several types of parallelism at the cost of a little amount
    of parallelism-related extra-code and in the same time, by enabling him to reuse
    most of the legacy sequential code without significant alteration. This programmability
    can significantly improve programmers'' productivity.


