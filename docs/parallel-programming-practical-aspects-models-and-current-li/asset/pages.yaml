    # 3. Task Parallelization Methodology


    Task-based programming is based on the decomposition of a program into a set of
    tasks which cooperates with each other to perform the main work of the application
    program. Task granularity can be controlled and specified by the programmer: a
    program is basically the main task which is split into several coarse-grained
    tasks which may be split, in turn, into finer grain tasks, and so on... until
    we reach the finest-grain by the host programming language (cf. Figure 1).


    Each task of the application performs a piece of work in which it may consume
    or produce data, i.e., read or write or operate shared data.


    In order to speed program execution on parallel computing architectures, we have
    to extract the maximum amount of parallelism. The ideal case, is the one in all
    tasks, at the finest possible granularity level, do not display any or control
    dependencies, so they can be executed simultaneously (cf Figure 2).


