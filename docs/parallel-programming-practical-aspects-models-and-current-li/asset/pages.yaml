    Mikhail S. Tarkov*

    Institute of Semiconductor Physics SB RAS, Novosibirsk, Russia


    # Abstract


    The methods for efficient mapping data processing networks onto robust distributed
    computer systems (CS) are proposed, Cellular neural networks are mapped onto the
    graphs of parallel programs with structures "mesh" and "line". The efficiency
    of the proposed methods for neural networks with global connections (Hopfield
    network, Kohonen network, and multilayer perceptron) is based on a butterfly scheme
    and mapping this scheme onto hypercube with subsequent embedding of the hypercube
    onto a torus. These networks are mapped onto regular graphs of parallel programs
    ("line", "ring", "mesh", "hypercube", "torus") intended for implementation on
    distributed computer systems.


    **Keywords:** neural networks, distributed computer systems, mapping, hypercube,
    torus


    # 1. Introduction


    Currently, there is a steady growth in the volume of processed measurement information
    (signals and images) in modern information systems. This also increases the performance
    requirements for such systems.


    Neural networks realize a perspective model of parallel computations [1-9]. The
    artificial neural networks are based on the following features of live neural
    networks allowing them to cope with irregular tasks:


    > * E-mail address: tarkov@isp.nsc.ru'
