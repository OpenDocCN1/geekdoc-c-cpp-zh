  md: '# 5. Case Study: Implementation of the Quadrature Mirror Filter Bank


    The Quadrature Mirror Filter Bank (QMFB) is a powerful signal processing technique
    that offers a fine spectral decomposition of a signal: a wide frequency band signal
    is decomposed into a set of narrow frequency sub-band. The QMFB is implemented
    as a set of band-pass filters that isolate each of these sub-bands. Several filter
    banks can be used as cascading filter stages to perform hierarchical spectral
    decomposition.


    In this case, the main wide frequency band is decomposed into several narrow sub-bands,
    each of these sub-bands is then decomposed into manner sub-bands, etc... QMFB
    have many applications such as frequency spectrum analysis, audio equalization,
    signal compression or speech recognition.


    Figure 6 gives an overview of a three-stage filter bank implementations. In the
    first stage, the input is decomposed into two sub-bands then these sub-bands are
    decomposed into four then eight sub-bands respectively in the second and third
    stage. Note that decimation is performed after each filtering operation. For the
    sake of simplicity, decimation is not represented in the figure.


    The QMFB has been implemented as a sequential C++ program within an industrial
    context. An experimental version has been derived from the industrial one. The
    latter is still sequential and has smaller filter banks containing less filters.
    We used XPU to parallelize progressively the sequential QMFB code using different
    parallelism types at different granularity levels. As we present the XPU parallelism
    techniques along this chapter, we use the QMFB application as a case study to
    evaluate XPU programmability and performance.


    # 6. Task Definition


    Decomposing a program into a set of pieces of code is the first step in the parallelization
    process in most parallel programming models. In low-level thread-lock programming
    models, these pieces of code are called callbacks, in higher level task-based
    programming models this piece of code is called task.


    # 6.1. POSIX Threads Callbacks


    In the traditional low-level thread-lock model, this piece of code is called “callback”
    and plays the role of tasks in task-based programming models and is the main component
    of our multi-threaded applications. If we consider C++ language, the host-language
    of our programming model, sequential code is often greatly altered since the targeted
    piece of code to meet the new callback prototype "void function(void*)" which
    imposes many restrictions on the programmer when parallelizing or reusing sequential
    code; only static functions can be used as callback, the class method cannot be
    used directly. In addition, consumed and produced data should be stored in a common
    intermediate structure then extracted and restored to their original type through
    type casting.'
