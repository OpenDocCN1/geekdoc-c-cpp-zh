    $$\min \sum_{i=1}^n \sum_{j=1}^n C_{ij} v_{ij} \quad (21)$


    under the constraints


    $v_{ij} \in \{0,1\,$


    $$\sum_{i=1}^n v_{ij} = 1, j=1, 2, \dots, n,$ \quad (22)$


    $$\sum_{j=1}^n v_{ij} = 1, i=1, 2, \dots, n,$


    $v$ forms a Hamiltonian cycle.


    Here $C_{ij}, i \neq j,$ is the cost of assignment of element $i$ to position
    $j$, which corresponds to the motion of the travelling salesman from city $i$
    to city $j$; $v_{ij}$ is the decision variable: if element $i$ is assigned to
    position $j$, then $v_{ij}=1$; otherwise, $v_{ij}=0$.


    For this problem, J.Wang [10, 11] proposed a recurrent neural network that is
