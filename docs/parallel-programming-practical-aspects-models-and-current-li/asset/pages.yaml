    # 7.2. Training Two-Layer Sigmoid Neural Network on a Hypercube


    Consider the backpropagation algorithm [1] which calculates the weight corrections
    for the output and hidden layers. A two-layer sigmoidal neural network processes
    a vector $x=(x_1, x_2, ..., x_N)$. The outputs of the hidden layers are calculated
    by the formula


    ```

    $u_j = f(a_j^{(1)}), a_j^{(1)} = \sum_{i=0}^N w_{ij}^{(1)}x_i, j=1,...,n,$

    ```


    where $n$ is a neuron in the hidden layer, $a_j^{(1)}$ is the activation of the
    $j$-th neuron of the hidden layer, $w_{ij}^{(1)}, i=0,1,...,N, j=1,...,n$ are
    these neuron weights, $f$ is the neuron activation function. Network outputs output
    the output in the output layer)


    ```

    $y_k = f(a_k^{(2)}), a_k^{(2)} = \sum_{j=0}^N w_{kj}^{(2)}u_j, k=1,...,m,$

    ```


    where $m$ is a neuron in the output layer, $a_k^{(2)}$ is the $k$-th activation
    of the output layer, $w_{kj}^{(2)}, k=1,...,m, j=1,...,n$ are these neuron weights.


    # 7.2.1. Training Neurons in the Output Layer Is Carried Out by Formulas


    ```

    $$\Delta w_{kj}^{(2)} = -\alpha\delta_k u_j, \delta_k = (y_k - d_k)\frac{\partial
    f(a_k^{(2)})}{\partial a_k^{(2)}}$ (33)

    ```


    ```

    $w_{kj}^{(2)}(t+1) = w_{kj}^{(2)}(t) + \Delta w_{kj}^{(2)}(t),$ (34)

    ```


    where $d_k$ is a desired $k$-th neuron output of the output layer, $t$ is a number
    of the current training iteration.


    Values $\delta_k, k=1,...,m$ and $u_j, j=1,...,n$ are distributed on computers,
    as well as the neurons of the output and hidden layers, respectively. Formula
    (33) implies the need for computing products $\delta_k u_j, k=1,...,m, j=1,...,n$.
    Therefore, before perform calculations using formulas (33)–(34), you must perform
    an all-to-all interchange of quantities $\delta_k, k=1,...,m$ or $u_j, j=1,...,n$,
    depending on the method of matrix $w^{(2)}(t)$ elements distribution on computers.


    If the matrix $w^{(2)}(t)$ rows are distributed on computers (neurons parallelism),
    it is necessary to make an all-to-all exchange of the signal $u_j, j=1,...,n$
    values and then perform parallel computations using formulas (33)–(34). In each
    computer signals $u_j, j=1,...,n$ are multiplied by the elements $\delta_k, k=1,...,m$
    that are located on this computer.'
