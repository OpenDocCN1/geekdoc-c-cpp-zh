  md: '# 2.3. Problem Statement


    Let us consider the following problem statement. The 3D computational domain has
    the shape of a cube with the following dimensions:


    ```

    $0 \le x \le L_x, 0 \le y \le L_y, 0 \le z \le L_z$

    ```


    Within this domain there is the model plasma. The plasma particles are distributed
    uniformly within the domain. The density of plasma and the temperature of electrons
    are set by the physicist as well as the electron temperature. The temperature
    of ions is considered to be zero. Beam electrons are also uniformly distributed
    within the domain.


    Thus, it is believed that the beam is already present in the plasma. The effects
    that occur when the beam is entering the plasma, are beyond the scope of the study.


    The particles simulating beam electrons differ from those simulating electrons
    by the value of their energy. Initially beam electrons have the energy of about
    1 MeV, and the plasma electrons have the energy of about 1 keV.


    Moreover, beam electrons have one direction of movement strictly along the X axis,
    and plasma electrons have the Maxwellian velocity distribution for all three dimensions.


    The main physical parameters of the problem under study are the following: the
    density and the temperature of the plasma electrons, the ratio of beam density
    to the plasma density and the energy of the beam.


    # 2.4. Parallel Implementation


    The program was parallelised by the domain decomposition method. The computational
    domain is divided into parts along the direction orthogonal to the direction of
    the beam (along the Y axis, the beam moving along the X axis). The computational
    grid in the whole domain is divided into equal parts (subdomains) along the Y
    axis. Each subdomain is assigned to a group of processors (in the case of a multicore
    system a single core would be called a processor, since no hybrid parallelization
    like MPI+OpenMP is employed, just mere MPI).


    Furthermore, the particles of each subdomain are distributed uniformly between
    processors of the group with no regard to their position, as it is shown in Figure
    1.


    ![](img/b73f5fa8e889a0cc9390bc30e4d82ae3_72_0.png)


    Different symbols (circles, squares, diamonds, stars) denote particles belonging
    to different processors in the same subdomain.


    Figure 1. The scheme of domain decomposition. The computational domain is divided
    into 4 subdomains. The particles of each subdomain are distributed between four
    processors uniformly with no regard to their position.'
