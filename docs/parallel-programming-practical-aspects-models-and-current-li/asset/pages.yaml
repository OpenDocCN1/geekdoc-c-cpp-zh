    # 2. Specification Statement of the FHP-MP Model


    # 2.1. The Basic Definitions


    As a cellular automaton, the FHP-MP model is denoted by a triplet (W, A, N), where
    W =

    {$w₁, w₂, \dots, w_n$} is the set of cells located in the corresponding sites
    in some discrete

    space. Each cell w \in W is associated with a finite state machine (FSM) A called
    the

    elementary FSM. Its states are an integer-valued vector, distinct from a Boolean

    vector in the Cartesian plane. Each cell w \in W is correlated with some coordinates
    x(w)

    and y(w) on the Cartesian plane. Between any two cells w₁ \in W and w₂ \in W,
    it is

    possible to calculate distance d(w₁, w₂), easily.


    For each w \in W an ordered set N(w)={N(w)=w, N(w) \in W & d(w,N(w))=

    (i=1, 2, \dots, b)} is determined. Its members belong to a neighborhood of the
    cell w and

    they are called its neighboring cells or neighbors. Constant b characterizes an
    amount

    of nonidentical neighbors of each cell w \in W. The cells are neighbors to each
    other. There is a

    correspondence between the elementary automaton A outputs in a cell w \in W and
    the inputs

    of the neighbors of this cell and vice versa, the structure of the cellular automaton
    cells

    set W a graph in which the vertices are cells, and the edges from the set is the

    neighborhood relation. This graph has a regular degree and the degree of it is
    equal to

    b. The cell state is represented by a vector with integer-valued components. A
    set of states

    s(w) of all cells w \in W in the instant t is called global state σ(t)={s(w₁),
    s(w₂), \dots,

    s(w_), \dots} of the cellular automaton.'
