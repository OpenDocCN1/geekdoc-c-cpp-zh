  md: '# 4. Dynamic Load Balancing for Lattice Gas Simulations on a Cluster


    # 4.1. Features of the Multi-Particle Models


    It is not in all tasks that the traditional LGA [4] with the Boolean alphabet
    yields a good simulating effect. So, it is impossible to use them processes with
    the heavy pressure (for example, for detonation) gradients. Also, they cannot
    simulate the flows with moving obstacles. These limitations are absent in the
    multi-particle model [5, 6]. Its state is represented by an integer vector, a
    cell has a number of possible states. It is impossible to find all the states
    conserving the particles mass and momentum in a cell at each collision execution.
    Therefore, one has compute a new state ad-hoc. From the above, it follows that
    the multi-particle LGA has the following properties:


    +   - The collisions take more than time in Boolean case;

    - The collision runtime depends on a cell state essentially;

    - If the program runs on a cluster, there may be a load imbalance.


    # 4.2. Parallel Program Implementation


    In the LGA implementation the domain decomposition method is used. The cellular
    array is divided into stripes along $i$. It is enough, for a good performance,
    to use one dimension cuts in this case. A stripe is assigned to any of $p$ cores
    $(0 < rank < p)$ for processing which consists of several lines $i_l(rank) \le
    i < i_g(rank)$. The stripes boundaries are related by the following ratios:


    ```

    $i_l(rank+1) = i_g(rank),$ for $0 \le rank < p-1, i_l(0) = 0, i_g(p) = L.$

    ```


    In the absence of balancing, the stripes have equal widths (exactly within integer
    rounding, $\lfloor x \rfloor$ denotes floor x):


    ```

    $i_L(rank) = \lfloor rank \cdot I / p \rfloor,$ for $0 \le rank < p-1$,

    $i_g(rank) = \lfloor (rank+1) \cdot I / p \rfloor,$ for $1 \le rank < p.$

    ```


    Iteration consists of the following three stages:


    +   - 1. Collisions.

    - 2. Exchange of boundary states.


    The core with the number rank sends:


    to the core $rank-1$ the line $i_l(rank)$, for $1 \le rank < p$,

    to to the core $rank+1$ the line $i_g(rank)-1$, for $0 \le rank < p-1$.'
  merge: -1
