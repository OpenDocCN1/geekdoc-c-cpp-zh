    $\u_{ij}^{t+\Delta t} = u_{ij}^t - \Delta t \cdot \left(\sum_{k=1}^n v_{ik}(t)
    + \sum_{l=1}^n v_{lj}(t) - 2\right) - \lambda C_{ij} \exp(\left(-\frac{t}{\tau}\right)),$
    \quad (24)$


    where $\Delta$ is the time step. Parameters $\Delta, \eta, \tau,$ and $\beta$
    are found experimentally and substantially affect the velocity of solving the
    problem and the quality of the solution.


    The computational complexity of iteration (24) is equal to $O(n^2)$ if, for $n^2$
