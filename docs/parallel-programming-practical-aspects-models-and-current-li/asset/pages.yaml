    system can have a different performance and different communication capabilities.
    In general, the structure of a computer system is arbitrary and depends on several
    factors, such as, for example, the hardware capabilities, the purpose for which
    the system is created, the financial constraints.


    Unlike systems with shared memory, in multicore systems, a more urgent issue is
    reducing the amount of interconnections, since the capacity of the network is
    low. We must, therefore, allocate the processes of a parallel program to available
    computing nodes to minimize the execution time of a parallel program. To do this
    we must down the processors according to their performance (the higher the performance,
    the higher the load) and minimize the interaction between the processes at different
    nodes, which can reduce the CPU idle time, reducing the efficiency of the computer
    system.


    In general, this problem is reduced to the mapping of the graph of the parallel
    program onto the graph of the computer system [2-6]. The purpose of mapping is
    to minimize the execution time of the program. Due to the complexity of the mapping
    problem (it is NPcomplete), various heuristics are used to find the best mappings.
    Currently, popular methods are based on the analogies with physics and biology,
    such as the method of simulated annealing, genetic algorithms and neural networks
    [7]. The latter include [8, 9].


    # 2. Mapping Problem


    The purpose of optimal allocation of parallel program processes (branches) to
    the system processors is to minimize the execution time of the program, which
    is equivalent to minimizing the downtime of each processor involved in the task
    and, at the same time, the cost of shared communications among the processors
    placed in different processors.


