  md: '# PREFACE


    Parallel programming is designed for the use of parallel computer systems for
    solving time-consuming problems that cannot be solved on a sequential computer
    in a reasonable time.


    These problems are divided into two classes:


    +   1. Processing large data arrays (including processing images and signals in
    real time).

    2. Simulation of complex physical processes and chemical reactions.


    For each of these classes prospective methods are designed for solving problems.
    For data processing of one of the most promising technologies is the use of artificial
    neural networks. Method of particles-in-cell and cellular automata are very useful
    for simulation.


    Problems of scalability in parallel algorithms and the transfer of existing parallel
    programs to future parallel computers are very acute. An important task is to
    optimize the use of the equipment (including the CPU cache) of parallel computer.
    Along with parallelizing information processing it is essential to ensure the
    processing reliability by the relevant organization of systems of concurrent interacting
    processes. From the perspective of creating qualitative parallel programs it is
    important to develop advanced methods of teaching parallel programming.


    The above reasons are the basis for the creation of this book, chapters of which
    are devoted to solving these problems.


    The first chapter (by Dr. Mikhail S. Tarkov) is devoted to mapping neural networks
    onto regular structures (distributed computer systems (CS). These structures are
    used not only in supercomputers but serve as a basis for the construction of parallel
    systems for VLSI chips (System-on-Chip). As a result of mapping neural networks
    on such a structure we can obtain an effective solution to the problem of organizing
    interactions between the neurons and within the distributed CS.


    The second chapter (by Dr. Mikhail S. Tarkov) examines the possibility of using
    the Hopfield recurrent neural network for mapping structures of parallel programs
    into the structures of distributed CS. It is shown that such a network can be
    successfully used for mapping of parallel programs on a multicore computer and
    for constructing Hamiltonian cycles in the structure of distributed CS. In the
    last case the neural network algorithms are not inferior in speed to the permutation
    ones.


    The third chapter (by Dr. Alexey Sytnikov) investigates the relaxation processes
    in high-temperature plasma. The mathematical Particle-In-Cell (PIC) model is used
    the problem. To achieve high performance both large-scale and'
  merge: -1
  pgno: 7
- img_proc: true
  md: '# Mikhail S. Tarkov


    fine-grain parallelization techniques are used. Large-scale parallelization is
    achieved by domain decomposition on computing nodes of the cluster supercomputer.
    Fine-grain parallelization is done by implementing the computation of motion of
    each particle as a separate stream. Thus, the highest performance is achieved
    by hybrid supercomputers with GPU.


    The fourth chapter (Dr. Igor Kulikov et al.) describes the technology of numerical
    modeling of astrophysical flows on the hybrid supercomputer with NVIDIA accelerators.
    To solve this problem the software packages GPUPEAGES (simulation of astrophysical
    objects), AstroPhi (simulation of the stars and molecular clouds), PADME (simulation
    of the formation of planetary systems) are developed.


    The fifth chapter (Dr. Mikhail A. Marchenko) focuses on the problems of using
    the Monte method (method of numerical stochastic modeling) on supercomputers.
    An effective approach is proposed for parallel stochastic modeling and its application
    in practice, in particular in the modeling of the evolution of electron avalanches
    in gases. The basis of this approach the software library PARMONC was created.
    The results of the study on the scalability of parallel algorithms of stochastic
    modeling are presented.


    The sixth chapter (Dr. Yuri Medvedev) presents the development of cellular automata
    of gas flows. Transitions from Boolean models to integral models, from two-dimensional
    models to three-dimensional models, and from gas flow models to multipiphase flows
    are considered. Implementation of models on a cluster using the MPI library is
    proposed. The problem of load balancing is suggested for multiple cores of the
    cluster in the implementation of models with integer alphabet.


    The seventh chapter (Dr. Konstantin Kalgin) is devoted to the modeling of parallel
    asynchronous cellular automata. A comparative analysis of their parallel implementations
    is. Parallel algorithms on the model of physical and chemical process of surface
    CO + O2 reaction are tested on different parallel computers: a computer with shared
    memory, a cluster (distributed memory computer), and GPU. The specialized CACHE
    algorithms for conversion of this language to C are proposed for cellular automata
    models of physical and chemical processes.


    In the eighth chapter (Dr. Nader Khamassi and Prof. Jean-Christophe Le Lann) the
    parallel programming model XPU is suggested. It facilitates the programming of
    parallel computations without loss of performance. The XPU technology is based
    entirely on traditional parallel programming language C++ and can be easily integrated
    into many systems. The XPU uses methods of C++ metaprogramming in order to simplify
    the complexity of various kinds of parallelism (task parallelism, data parallelism,
    temporal parallelism) at all levels of granularity.


    In the ninth chapter (Dr. Igor N. Skopin) a robust approach to the construction
    of interacting processes is proposed. It is shown how the successive of some problems
    can be naturally represented as a system of interacting concurrent processes.
    Such representation improves the robustness of computations.


    Tenth (final) chapter (Dr. Igor N. Skopin) considers the problems with learning
    parallelism. A new approach is proposed to learn parallel programming. This approach
    is based on constructing program sketches, which does not take into account any
    restrictions on concurrency, and the subsequent mapping of the sketches on a real
    computer.'
