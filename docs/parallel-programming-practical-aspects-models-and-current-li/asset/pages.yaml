  md: 'To reduce the influence of these factors the cell density of the particles
    and the force acting on it are determined according to the method Clouds-In-Cells
    (CIC) (Birdsall 1997).


    With this approach the coordinates of the particles are the centers of the mass
    of the "cloud" of finite size. The density of such clouds is distributed between
    the cells in which it fell (Figure 2). Thus, the particle density in a cell and
    the force acting on a particle is calculated as:


    ```

    $$\rho_{i,j} = \sum_{clouds} W_{i,j}(x,y) \rho_c(x,y)$

    ```


    ```

    $F_c = -\sum_{i,j} W_{i,j}(x,y) \text{grad}\Phi_{i,j}$

    ```


    where


    ```

    $W_{i,j}(x,y) = \begin{cases} \frac{|x-x_i|}{h_x} \frac{|y-y_j|}{h_y}, & |x-x_i|
    \le h_x \&quad |y-y_j| \le h_y, \ 0, & \text{other} \end{cases}$

    ```


    This approach does not solve the problem completely but it can significantly reduce
    the error of calculations that considered in detail [7].


    Traditionally, collisionless component is described using N-body models. Nevertheless,
    this model has disadvantages as a spurious generation of entropy, increased communication
    overhead and poor load balancing [36]. Therefore, co-design algorithms to describe
    collisionless components in the context of modeling the galaxies collision was
    selected "Collisionless Stellar Hydrodynamics" approach. This approach is based
    on the equations for the first moments of the collisionless Boltzmann equation.
    The first moments of the collisionless Boltzmann moment equations are:


    ```

    $$\frac{\partial \tilde{n}}{\ t} + \text{div}(\tilde{n}\tilde{u}) = 0$

    ```


    ```

    $$\frac{\partial \tilde{n}\tilde{u}}{\ t} + \text{div}(\tilde{n}\tilde{u}\tilde{u})
    = -\text{grad}(\tilde{n}\sigma^2) - \rho\text{grad}(\Phi_{gas} + \Phi)$

    ```


    ```

    $$\frac{\partial \tilde{n}E_{ij}}{\ t} + \text{div}(\tilde{n}E_{ij}\tilde{u})
    = -\text{div}(2\tilde{n}\sigma_{ij}^2\tilde{u}) - 2(\tilde{n},\text{grad}(\Phi_{gas}
    + \Phi))$

    ```


    ```

    $nE_{ij} = n\sigma_{ij}^2 + \rho u_i u_j$

    ```


    ```

    $$\Delta(\Phi_{gas} + \Phi) = 4\pi(\rho + n)$

    ```'
