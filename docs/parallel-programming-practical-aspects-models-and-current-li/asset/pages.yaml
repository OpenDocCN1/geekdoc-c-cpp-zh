  md: '# An Approach to the Construction of Robust Systems of Interacting Processes


    Availability of object methods for all generation variants, as well as the uniqueness
    of the choice of a variant by the first analyzed symbol, guarantees the correctness
    of such decentralized algorithm.


    The object-oriented view of the structured text is productive not only in solving
    the problems of parsing. In particular, in connection with the structuring of
    texts, the concept of the document object model [6] was introduced. This concept
    describes structural units of the text as its active components, i.e., objects
    capable of performing certain actions.


    These actions are described as class methods that can be interpreted as processes.
    The process activities and interactions are controlled by the syntactic structure
    of the text.


    The recursive descent method is interesting as one of the approaches to overcome
    the processes multiplicity:


    +   1. By external information, available to all processes (the current symbol
    of parsed string), it can be established which processes need to be activated.


    Most practical schemes of bottom-up analysis are not described explicitly by defining
    interacting processes, but they can be treated as a reduction in the number of
    active processes by special techniques.


    However, there is a scheme which clearly does not involve resolution of a set
    of active processes. This is the LR-analysis of D. Knut [7]. In LR-analysis


    +   2. The encoding of the set of all processes combinations by states of the
    automaton, as an approach to overcome processes reproduction, is opposed to processes
    avalanche.


    For so called deterministic languages, this coding is efficiently feasible. Because
    the operating role of analyzing processes is negligible (they should be noted
    as final with the hope to continue), you can do without them, and the alignment
    of recovered productions sequences can be entrusted to the stage of convolution.
    Knut builds the states encoding-analyzers by grammatical tracking all line sequences.
    He uses the lookahead on the line to eliminate transitions ambiguities and hence
    the avalanche growth in the processes number.


    The states encode the processes, but rather, the potential of their activation
    and completion. It turns out that the number of these processes and the transitions
    between states is finite and foreseeable. There is a technique of reducing the
    size of tables representing the transition diagrams, by which the Knut method
