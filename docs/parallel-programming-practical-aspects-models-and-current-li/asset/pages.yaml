    The construction of Hamiltonian cycles in a graph of distributed computing by
    a recurrent neural network is considered. We propose a method of partial sums,
    which allows one to reduce the time to solve the system of differential equations,
    describing the neural network, from $O(n^3)$ to $O(n^2)$, where n is a number
    of graph nodes. It is shown that the neural network algorithm using the partial
    sums is not inferior to the known permutation methods in terms of cycle construction.


    The permutation algorithms do not require a floating point processor and the choice
    of parameters, but they work with irregular data structures (list-representation
    of the graph), which may complicate their parallelization. Neural network algorithms
    require floating-point processors and a choice of parameters, which they work
    with regular data structures and, therefore, have a high potential for parallelization.
    Thus, the choice of algorithm for constructing Hamiltonian cycles in graphs of
    distributed computing systems is determined by the configuration of the hardware
    processors on which they are executed. Comparison of parallel versions of the
    considered algorithm is the aim of further research.


