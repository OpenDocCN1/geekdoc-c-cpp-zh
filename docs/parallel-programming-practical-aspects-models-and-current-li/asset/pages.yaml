  md: '# Large-Scale and Fine-Grain Parallelism in Plasma Simulation


    Every processor in the group solves the Maxwell equations in the whole subdomain,
    and exchanges boundary values of the fields with processors assigned to adjacent
    subdomains. Then the movement equations for the particles are solved, and the
    3D matrix of the current density and the charge density are evaluated by each
    processor.


    But since the processor has only a part of a total number of particles located
    inside the subdomain, it is necessary to sum the matrices through all the processors
    of the group to obtain the whole current density matrix in the subdomain. Interprocessor
    data exchange is performed by the MPI subroutines.


    # 2.5. Parallelization Efficiency


    The parallel program has been developed recently for the simulation of beam interaction
    with plasma on have large numbers of particles. That is why parallelisation efficiency
    k was computed in the following way:


    ```

    k = T2/T1 × N1/N2 × S2/S1 × 100 %

    ```


    Here T1 - is the computation time with N1 processors, T2 is the computation time
    with N2 processors, S is the characteristic size of the problem in each case.
    Here the characteristic size is the grid size along the X axis. In this characteristic
    size S is proportional to the number of processors N.


    It means that the workload of a single processor is constant. The purpose of such
    a definition of efficiency is to find out what the communication overhead is when
    the number of processors is increased with the constant workload for each processor.


    In the ideal case the computation time must remain the same (the ideal k=100%).
    In the computations devoted to efficiency evaluation the X axis grid size only
    increased, all the other parameters remained constant, the results are shown in
    Figure 2.


    ![](img/b73f5fa8e889a0cc9390bc30e4d82ae3_73_0.png)


    Figure 2. Parallelization efficiency measured with the cluster named MVS-100K,
    Joint Supercomputer Centre of the RAS (Russian Academy of Sciences). The grid
    size along Y and Z is 64 nodes, the grid size along X is equal to the number of
    processors (150 particles per cell for all the cases).'
