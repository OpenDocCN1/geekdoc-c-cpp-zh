    The primary particle dynamics simulation algorithmic complexity is to determine
    the force acting on each particle from other particles. Besides it is necessary
    to take into account the interaction of the gravitational field of gas and particles.
    In this chapter the Particle-Mesh method [22] used.


    This method allows to reduce the computational cost of this step of the simulation.
    The Particle-Mesh method is based on the fact that we divide the computational
    domain into a finite set of cells (in our implementation essentially coinciding
    with the computational grid for the gas components) and in each them calculating
    the particle density.


    Then to obtain the density distribution, the Poisson equation is solved for the
    gravitational potential. Knowing the potential can easily calculate the gravitational
    force:


    ```

    $F = -grad\Phi$

    ```


    where $\Phi$ determines from:


    ```

    $\Phi = 4\pi(\rho_{gas} + \rho_{particles})$

    ```


    This method has a significant drawback - accuracy. Using the classical approach
    to the calculation accuracy of the attractive force depends only on the accuracy
    of summation. By the same method, there are several sources of error:


    +   1 Calculation particle density in the cell. The Harlow method is avoid fluctuations
    of the particle density in the transition from cell to cell, which leads to fluctuations
    in unphysical solutions.

    2 Calculation of gravitational force. The gravitational potential is bound to
    the center of the cell.


    | | j-1 | j | j+1 |

    |---|---|---|---|n| i+1 | | | * |

    | i | | * | | |

    | i-1 | | | |


