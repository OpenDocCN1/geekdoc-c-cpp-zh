    # Conclusion


    The problem of mapping a parallel program with weighted vertices (processes) and
    edges (inter-processor communications) onto a weighted graph of the distributed
    computing system is considered. An algorithm for solving this problem based on
    the use of Hopfield networks is proposed. The algorithm is tested on the particular
    case of this problem – mapping some graphs of parallel programs (homogeneous set
    of independent tasks - the empty graph, line, ring, mesh, irregular grids) onto
    a multi-core processor. Experiments have shown, that for graphs of parallel programs
    with dozens of nodes, the proposed algorithm provides well-balanced optimal mappings.
    With the increasing number of vertices of the program graph, the share of its
    edges, concerning inter-core data exchanges, is significantly reduced.


    Optimal solutions are found for mapping a “line”-graph onto a two-dimensional
    torus. To increase the probability of finding an optimal mapping, a method for
    splitting the mapping procedure is proposed. The method’s essence is reducing
    solution matrix to a block-diagonal form. The Wang recurrent neural network is
    used to exclude incorrect solutions of the problem of mapping the line-graph onto
    a three-dimensional torus.'
