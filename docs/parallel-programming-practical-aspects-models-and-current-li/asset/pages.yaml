  md: '# 4. XPU Overview


    XPU [38] is a task-based library that exploits C++ meta-programming capabilities
    [27, 28] to case parallelism. C++ Meta-programming techniques exploit the potential
    of standard C++ language without any extension and thus do not introduce any particular
    tool other than a standard C++ compiler. Thus, XPU based programs are provides
    a friendly and light weight programming interface which enables programmer to
    design parallel applications or parallelize those which are sequential at the
    cost of a little amount of extra-code.


    XPU is based on a set of reusable parallel constructs which specifies execution
    configuration of a group of tasks. Without any alteration, these tasks are designed
    to encapsulate different pieces of code including functions, class method or lambda
    expression. As depicted in Figure 5, these tasks can be ordered by choosing the
    appropriate parallel construct to express data or temporal parallelism. Several
    types of parallelism can be implemented at different granularity by composing
    different skeletons in a hierarchical fashion. This allows progressive parallelization
    of a program starting from coarse-grain parallelism to finer parallelism.


    The XPU execution patterns handle transparently many parallel-related routines
    such as synchronization, communication or task scheduling. An intelligent run-time
    system exploits information, extracted transparently from both hardware system
    and execution patterns (task ordering and task-data dependencies) to perform dynamically
    efficient execution on the underlying architecture through cache-aware and load-balanced
    task scheduling.


