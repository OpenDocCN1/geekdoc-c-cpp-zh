    # 6. On the Efficient Construction of Hamilton Cycles in Distributed Computer
    Systems by Recurrent Neural Networks


    The ring structure of the parallel program is one of the fundamental structures
    for parallel and distributed computing. These parallel applications, as processing
    signals and images, tend to have a ring architecture [14] prompted many simple
    and effective algorithms for solving various algebraic and graph-theoretical problems
    [15, 16]. It is, therefore, to have an effective mapping of the ring onto the
    structure of the distributed system.


    Here we present the neural algorithms for mapping the ring structures of parallel
    programs into the structures of distributed CS when $|V_i|=|V_j|=n$. Such a mapping
    is reduced to the construction of a Hamiltonian cycle in the CS graph. The mapping
    is based on the solution of the traveling salesman problem using a matrix of the
    distances between the vertices of the CS graph with the unit distance between
    adjacent vertices. We propose a method of partial sums to reduce the system of
    differential equations describing the neural network from $O(n^3)$ to $O(n^2)$
    and show that the neural network algorithm, using the method of partial sums for
    the cycle construction, is not inferior than the known permutation methods [2,
    17-19] in the run-time.


    # 6.1. On Solving the Traveling Salesman Problem by Recurrent Neural Networks


    Many papers are devoted to the solution of combinatorial optimization problems
    by neural networks [8]. The most popular in this respect are the Hopfield networks
    [20], but their use is limited by high computational complexity $O(n^4)$. The
    situation can be simplified by the following approach.


    The traveling salesman problem can be formulated as an assignment problem [21]:'
