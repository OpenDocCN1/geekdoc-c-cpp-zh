    # 3. Software Library PARMONC for Implementation of Distributed Stochastic Simulation


    Let us introduce a software library PARMONC (an acronym for PARALMonte Carlo –
    a library of easy-to-use programs that was implemented on high-performance clusters
    of the Siberian Supercomputer Center and can also be used in other supercomputers
    [18]. A description of the PARMON can be found on the web site of the Siberian
    Supercomputer Center [19]; full description is provided in , [20].


    The main objectives of the PARMONC are as follows:


    +   - creation of a software tool suitable for the massively parallel stochastic
    simulation for a wide range of applications,


    +   - creation of an easy-to-use software framework to parallelize stochastic
    simulation to be applied without knowledge of MPI language.


    A number of publications are devoted to the development of software packages for
    parallel computations with the Monte Carlo method (see, e.g., [21]–23]). Different
    hardware and software platforms are reported in these publications. In our opinion,
    the following features distinguish the PARMONC from other software tools and make
    it an easy-to-use instrument for specialists in the field of stochastic simulation:


    +   - The only thing the user has to do in parallelize stochastic simulation is
    to write in C, C++ or in FORTRAN a sequential subroutine to simulate a single
    realization of random object of interest and to pass its name to the PARMONC routines.'
