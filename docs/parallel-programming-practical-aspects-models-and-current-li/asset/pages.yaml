    # 2.2. The Neighbourhood Relation


    Each cell in the classical FHP model has 6 neighbors ($b=6$) (Figure 1). In some
    modifications of the model, each cell is a neighbor to itself (possibly several
    times), as well that stipulates the possibility of the presence of the rest particles.
    A ground of the FHP-MP model is the FHP model with one rest particle. In Figure
    1 cell $w$, and its neighbors $N(w)$, $i=0, 1, ..., 6$ are represented. Thus,
    the amount of neighbors of each cell $w$ of the FHP-MP model is equal to seven,
    one of the neighbors is cell $w$, i.e., $N_0(w)=w$.


    ![](img/b73f5fa8e889a0cc9390bc30e4d82ae3_155_0.png)


    Unlike the FHP, the FHP-MP model, components $s_0(w)$, $s_1(w)$, ..., s_6(w)$
    of state vector $s(w)$ are not Boolean, but integer. The particles mass in cell
    $w$ is equal to


    ```

