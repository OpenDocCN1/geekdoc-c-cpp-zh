    But with a GPU-equipped cluster the things are different. First, the number of
    computational cores is greater than in CPU cluster. Second, the concurrent processing
    of a large number of particles is performed much more effectively. With the GPU
    computations the same computational model and numerical methods are used, as those
    described above.


    # 3.1. GPU Implementation


    The implementation of the above PIC algorithm for the GPUs is quite standard.
    The field evaluation method is ported to the GPU almost without any change. The
    computation speed is high enough even without optimization. The field arrays are
    stored in the GPU global memory. The bottleneck of PIC codes is the particle push.
    With the CPUs it takes up to 90 % of runtime. The first step is the distribution
    of particles among cells. This step only reduces the push time twice with the
    CPUs. With the GPUs it is even more important than with the GPUs it enables the
    use of texture memory (texture memory is limited and the particle array will never
    fit). The second step is keeping the field values to the cell (and to the adjacent
    cells) in the cell itself. This is important since each particle needs 6 field
    and 12 current values to the grid nodes.


    Now it is all done within a small amount of memory (the cell) without addressing
    the global field or current arrays that contain the whole domain. Then the evaluated
    currents from all cells are added to the global current array.


    Figure 6 shows the ratio of computation time with a GPU (Nvidia Tesla 2070 or
    the to the computation time with 4 cores of Intel Xeon CPU. It is seen from the
    Figure 6 that particle push is accelerated better than field evaluation. Particle
    push is the most important for the PIC method. This speed means that it might
    be possible to perform the plasma simulation of the new scale (grid of 1000x1000x1000
    nodes with 10000 particles each) with a cluster equipped with Kepler GPUs.


    Speedup (one GPU with respect to 4 Xeon cores)


