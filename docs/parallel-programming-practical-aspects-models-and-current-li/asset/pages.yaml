  md: '# Numerical Modelling of Astrophysical Flow ... 101


    There is one remarkable point that should be mentioned here. It is the time-step
    evaluation procedure. In the case when GPUs were used (GPUPEG code), this procedure
    could be run on CPU (the same in GAMER code). The reason is the absence of efficient
    global minimum operation (min) in CUDA. On the contrary, on OpenMP such an efficient
    operation is present. The computational cost of this operation is about 1%. Thus
    it doesn''t affect the performance of the single-core run. But when the number
    of GPU cores is raised to several thousand and the speed-up is about hundred within
    one GPU, then time-step evaluation procedure may become the most expensive. This
    situation may easily become possible in the next couple of years since the speed-up
    of 55 times was already obtained in GPUPEGAS code with a single Nvidia Tesla and
    constantly increasing. It should be noticed that such a problem with very expensive
    min procedure is not at possible with Intel Xeon Phi accelerators.


    Thus, for the hybrid parallel implementation let us define three different kinds
    of scalability.


    +   1. SingleDevice scalability (high scalability within one single Intel Xeon
    Phi or GPU) significant computation decrease during one timestep as a result of
    a large number of Intel Xeon Phi or GPU cores.

    2. MultiDevice scalability (low scalability for the case of many Intel Xeon Phi
    or GPU accelerators). The computation for one timestep remains constant using
    a larger number of Intel Xeon Phi or GPU accelerators.

    3. FFTW scalability (high scalability for FFTW library). It means the significant
    decrease of computation for one timestep using more CPUs or CPU cores.


    The mesh of the size 256³ was used for speed-up evaluation within a single Intel
    Xeon Phi or GPU. In this case each of the Intel Xeon Phi accelerators contained
    a portion of the whole mesh, the size of the portion being equal to 256³. Let
    us remind that accelerators were not used for Poisson equation solution. The speed-up
    is given in figure 16 for GPUPEGAS code and figure 17 for AstroPhi.


    ![](img/b73f5fa8e889a0cc9390bc30e4d82ae3_111_0.png)


    Figure 16. Continued on next page.'
