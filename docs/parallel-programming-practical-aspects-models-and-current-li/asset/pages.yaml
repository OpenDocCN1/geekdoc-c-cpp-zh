    of this sum is one of the semigroup array operations.


    # 4. Mapping Semigroup Array Operations onto Distributed Computer System with
    Torus Topology


    Semigroup operation is a binary associative operation [19]. The examples of such
    operation are addition, multiplication, convolution, disjunction, excluding OR
    and computation of minimum or maximum. In [19] the problem of implementation of
    semigroup operations on data arrays distributed on the mesh is solved so that
    the operation result is located in every process. This solution can be easily
    translated onto the torus.

    In this chapter we consider an alternative approach to mapping the semigroup operation
    onto computer systems with torus topology. This approach is based on using the
    butterfly scheme in parallel realization of semigroup operation and mapping the
    butterfly onto the hypercube with subsequent XOR-embedding [12] of the hypercube
    onto torus. We show that this approach gives more efficient parallel execution
    of the semigroup operation than the approach proposed in [19].'
