  md: '# 3. Experimental Study of the FHP-MP Model


    For validation of the proposed model, its program realization was constructed.
    It allows one to carry out the computing experiments both on single-processor
    computers and multiprocessor and multcomputer systems. The code is written in
    C, the parallelism is implemented by members of the MPI library. The computing
    experiments performed with the FHP-MP model are described below. Qualitative behavior
    of a simulated flow is obtained.


    # 3.1. Two-Dimensional Approximating of a Fluid Flow between Two Parallel Planes


    This experiment, which has become already classical, allows us to check our model
    on the correspondence to physics. Its essence is in the fact that a longitudinal
    velocity (the flow moves lengthways $Oy$ in a positive direction) should be described
    by the parabolic along axis $Ox$, when boundary velocity ($u_w$) is zero. The
    cellular automaton in this computing experiment has the size of $100\times200$
    cells (along Cartesian axes $Ox$ and $Oy$ accordingly). The cells with coordinates
    in the interval $[1, 2]$, $(99, 1)$ are sources. The cells with coordinates in
    spacing $[1, 1]$, $(1, 200)$ and $(100, 1)$, $(100, 2000)$ are walls. The remaining
    ones are conventional cells. This 2D-construction is a cutting of a parallelepiped
    of the infinite width (lengthwise axis $Ox$) and it is an approximation of a three-dimensional
    flow between two parallel planes.


    The projection of flow velocity ($u_y$), onto $Oy$ in a flow cross-section (lengthways
    $Ox$) is shown in Figure 2. The curve with markers illustrates results of numerical
    simulation. It is approximated by the parabola equation (in Figure 2 it is a curve
    without markers):


    ```

    $$\langle u_y\rangle(r) = -0.0008r^2 + 2$$

    ```


    where $r$ is the spacing interval between the middle of the bisecting point and
    an observed point of the cross-section.


    Curve (14) is the inferential part of Poiseuille. It is one of few analytical
    solutions of the Navier-Stokes equation and it likes the equation


    ```

    $$\langle u_y\rangle(r) = \frac{dP}{4\eta l}(R^2 - r^2)$$

    ```


    where $dP$ is a pressure drop on a part of pipe with length $l$, $\eta$ is fluid
    viscosity, $R$ is the pipe radius (in a two-dimensional case it is a spacing interval
    between the planes).


    The amount of iterations, after which one average is spent, $T = 2000$. The averaging
    radius is $r=15$ cells. According to the constraints imposed on (12) and (13),
    the averaged values cannot be obtained in the cells which are at a distance from
    the walls less than $r=15$ cells. Therefore, idealized and experimental curves
    over the range, shown in the picture, are not declined to the zero point.'
