  md: '# Mapping Data Processing Neural Networks ... 3


    +   1. They need a precise description of the algorithm (the computer is oriented
    to character processing).


    +   2. The data must be exact. The equipment is easily damaged. A destruction
    of the main elements of memory makes the system faulty.


    +   3. Each object to be processed must be explicitly specified in the memory.


    +   4. It is difficult to build a good algorithm for pattern recognition and associative
    sampling.


    In neurocomputers (neural networks):


    +   1. The method of data processing is more similar to signal processing. Instead
    of the program there is a set of neuron weights; instead of programming there
    is a training of neurons (adjustment of neuron weights).


    +   2. The neural network is tolerant to noise; data distribution does not substantially
    affect the result (including the failure of individual neurons).


    +   3. Processed objects are represented implicitly by neuron weights. As a result,
    the network can work with the objects not previously come across and is capable
    of training results generalization.


    +   4. The neural network is good for solving the problems of perception and associative
    sampling.


    Real time image and signal processing requires the creation of a highly parallel
    data processing means. Autonomous means of a computer image and signal processing
    require not only high performance of computing facilities, but also their reliability
    and the ability to learn and generalize the training outcomes in relation to new
    situations that arise in the process of information processing. Artificial neural
    networks to be implemented in hardware have all these qualities.


    The enormous number of global interneuron connections (synapses) complicates the
    neural network implementation as a VLSI layout because their connection is inevitably
    increased, which makes it necessary to reduce the clock of operation of the digital
    devices. On the other hand, increasing the degree of VLSI integration requires
    a larger amount of clock generators on the chip, i.e., leads to the distributed
    processing of the information that means the information processing by multiple
    cooperating processors (elementary computers).


    A system of interacting elementary computers (ECs) is a subject scalable to its
    homogeneity (ECs are all the same). Scaling is possible only if means of communications
    between processors are distributed, for a given topology of VLSI production, leads
    to the interprocessor network network representation in the form of a regular
    graph with a vertex of a bounded degree.


    Due to the rapid development of VLSI manufacturing technologies, a question of
    combining the components in large systems is a chorus. The most common approach,
    using the principle of a bus, shows a lack of scalability and a decrease in throughput
    with increasing number of connected elements. One of the methods to eliminate
    such deficiencies may be the use of network technology to exchange the data between
    subsystems of the VLSI chip. The concept of combining cores in the network – NoC
    (Network-on-Chip) is originated. The essence of this approach is to combine the
    kernels,'
  merge: -1
