    # 4.4. Time Analysis of Semigroup Operation Execution on Torus


    Let $t_w$ be the time for moving the data element between adjacent computers,
    $t_o$ – the time of the semigroup operation over two arguments, $T_C$ – the time
    of parallel execution of complete semigroup operation on a torus with the use
    of cyclic data shifts, and $T_{HT}$ – the time of the same operation execution
    on the hypercube mapped onto a torus.


    # Theorem 2. $T_C > T_{HT}$.


    Proof.


    For arbitrary $k$, $\sum_{i=1}^k d_i = d$, the time of parallel execution of complete
    semigroup operation on the torus with the use of cyclic data shifts


    ```

    $T_C = \sum_{i=1}^k (2^{d_i}-1)t_w + t_o$.

    ```


    The time for execution of the semigroup operation on the hypercube mapped onto
    the torus


    ```

    $T_{HT} = (Dt_w + t_o)d$.

    ```


    Taking into account equation (2) for $D$ we have


    ```

    $T_{HT} = (\sum_{i=1}^k 3 \cdot 2^{d_i-2} - k)t_w + dt_o$.

    ```


    Then


    ```

    $T_C - T_{HT} = (\sum_{i=1}^k (2^{d_i}-1) - \sum_{i=1}^k 3 \cdot 2^{d_i-2} + k)t_w
    + [\sum_{i=1}^k (2^{d_i}-1) - d]t_o = t_w \cdot \sum_{i=1}^k \frac{3}{4} 2^{d_i}
    + t_o \cdot \sum_{i=1}^k (2^{d_i}-d_i-1) > 0$.

    ```


    because $2^{d_i}-d_i-1 \ge 0$ for $d_i \ge 1$. Theorem 2 is proved.'
