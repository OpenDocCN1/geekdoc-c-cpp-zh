  md: '# XPU: A C++ Metaprogramming Approach to Ease Parallelism Expression


    # 1.2. Structured Parallel Programming


    Skeleton-based programming, often referred to as “structured parallel programming”
    [14, 15], is a promising high-level approach that satisfies most of these requirements
    and attempts to replace the traditional-level thread lock model with better abstraction
    and an easier way to express parallelism through a collection of recurrent parallel
    patterns [10, 13]. It aims to provide a good trade-off between programmability,
    portability, reusability and performance enhancement in order to improve programmer
    productivity by letting him focus on algorithms instead of hardware architectures.


    In previous work [11] we introduced the pattern-based parallel programming model
    named MHMP (Multiscale Hybrid Programming Model) that allows execution of sequential
    execution and various types of parallelism, including task, data and temporal
    parallelism at any granularity inside a single homogeneous programming model.


    XPU [38] is a C++ framework which exploits C++ metaprogramming techniques to implement
    the MHMP, and tries to develop the structured parallel programming approach toward
    better productivity and higher performances. The philosophy behind XPU is “Easing
    parallelism without sacrificing execution efficiency.” In this Chapter, we describe
    XPU parallelism methodology, its programming interface and its different parallel
    execution patterns. In order to show how XPU c++ meta-programming to promote reuse
    of sequential code and to offer a light weight programming interface. In order
    to illustrate the potential of the XPU programming model, we describe the progressive
    parallelism process of a signal processing application which implements the Quadrature
    Mirror Filter Bank technique and evaluate both programmability and performances
    of our approach.


    # 2. Related Works


    Structured parallel programming with deterministic patterns [10] is a high-level
    approach mainly based on a collection of recurrent parallel execution patterns,
    often referred to as algorithmic skeletons [13-15] or parallel constructs, which
    abstract program description and hide low-level multithreading details and many
    complexities inherent in parallelism from the programmers [20, 23]. These reusable
    patterns automate any parallel paradigm-related routines such as synchronization,
    data partitioning or task scheduling and handle them entirely. For instance, task-based
    structured programming models such as Thread Building Blocks [11] and Cilk+[12]
    offer a set of execution patterns that transparently handle task scheduling, partitioning
    and load-balancing. Unified Parallel C (UPC) Task Library HotSLAW [9] abstracts
    concurrent task management and provides transparent data communication and dynamic
    load balancing [9, 22]. Sequoia [24] is another task-based programming model which
    offers transparent data management in deep processor’s memory hierarchy including
    data allocation and communication through the memory tree [22]. By decoupling
    the programming model from the underlying architecture, a pattern-based approach
    also offers a good hardware abstraction accommodating architecture heterogeneity,
    opening the path to more hardware support and allowing the programmer to focus
    on algorithms instead of hardware architecture.'
