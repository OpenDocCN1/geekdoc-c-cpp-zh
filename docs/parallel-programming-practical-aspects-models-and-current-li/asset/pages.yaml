    # Chapter 2


    # # MAPPING PARALLEL PROGRAM GRAPHS

    # ONTO GRAPHS OF DISTRIBUTED COMPUTER

    # SYSTEMS BY NEURAL NETWORK ALGORITHMS


    **Mikhail S. Tarkov***

    Institute of Semiconductor Physics SB RAS, Novosibirsk, Russia


    # ## Abstract


    The problem of mapping a parallel program with weighted vertices (processes) and
    edges (interprocess exchanges) onto a weighted graph of the distributed computer
    system is considered. An algorithm for solving this problem based on the use of
    Hopfield networks is proposed. The algorithm is tested on mapping a number of
    parallel programs onto a multicore computer. Experiments have shown that the proposed
    algorithm provides wellbalanced sub-optimal solutions. Optimal solutions are found
    for mapping a “line”-graph onto a two-dimensional torus. To enhance the probability
    of finding an optimal mapping, a method for splitting the mapping is proposed.
    The method’s essence is reducing the solution matrix to a block-diagonal form.
    The Wang recurrent neural network is used to exclude solutions of the problem
    of mapping the line-graph onto a three-dimensional torus. An algorithm based on
    a recurrent neural network and the WTA (“Winner takes all”) principle is proposed
    for the construction of Hamiltonian cycles in graphs of distributed computer systems.


    **Keywords:** mapping, graphs of parallel programs, multicore systems, load balancing,
    neuron, Hopfield networks


