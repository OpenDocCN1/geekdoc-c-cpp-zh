    Also, up to 8 Gb of the main memory were available for each realization of the
    avalanche. But the value of the computational cost for the stochastic simulation
    is still quite large: the simulation of each realization takes plenty of time
    (up to several hours, in some cases) [33].


    A possible way to reduce the computational cost is to use a higher degree of parallelism
    in the course of the simulation of the particle trees. Namely, assume that sufficient
    number of computational cores are available for simulation of each realization.
    We start of the realization on some core and do it till the moment when necessary
    number of particles is simulated (this number is greater or equal to the number
    of free cores). Then the conditionally independent branches which take from these
    particles may be simulated independently of different cores.


    When the simulation of the avalanche starts on CPU, it is advisable to generate
    generations of particles sequentially (the generation of all particles at the
    specific time $t_j$). Simulation on each core uses the "lexographical scheme"
    to simulate the particle trees, as described above.


    Here, the technology of distributive random numbers described above may also be
    used for the simulation of new branches. This parallelization technique is suitable
    for implementation on computers with many-core coprocessors, such as GPUs or Intel
    Xeon Phi accelerators.


    In order to get much effect in comparison with the coarse-grained parallelism,
    on hybrid supercomputers, it is possible to combine the above-mentioned techniques
    and it is reasonable to use the cores of the CPU and the coprocessor simultaneously
    in the following way:


    +   - each node of the cluster, all the CPU''s cores (with the exception of the
    CPU''s cores "attached" to coprocessor) are loaded with simulation of the independent
    realizations of the avalanche using the coarse-grained parallelism;


    +   - the co-processor and the "attached" CPU''s core are loaded with simulation
    of a single realization of the avalanche using the higher degree of parallelism.


    In the last case it is possible to exchange "redundant" particles between the
    memory of the CPU''s core (main memory on the node) and the memory of the coprocessor.
    This technique enables one to use the computational resources effectively.


