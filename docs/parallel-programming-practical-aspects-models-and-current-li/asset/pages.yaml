    # 4.3. Mapping Hypercube onto a Torus


    The hypercube can be effectively mapped onto a torus. The method for mapping a
    hypercube onto a torus (XOR-embedding) is proposed in [12].


    Embedding graph G into graph H is an injection f from the nodes of G to the nodes
    of H. If graph G is not isomorphic to some subgraph of H, then dilations of G
    are inevitable. The dilation of an edge (a,b) of G is the distance between nodes
    f(a) and f(b).


    The XOR-embedding of a hypercube $H_d$ onto $k$-dimensional torus $E_k(2^d, ...,
    2^d)$ is


    ```

    $$\sum_{i=1}^k d_i = d$ is realized as follows. First, $K_j$ are defined:

    ```


    ```

    $K_1 = 0,

    K_j = \sum d_i, 1 < j \le k+1.$

    ```


    If $G$ is hypercube $H_d$ and $T$ is the torus, then node $v$ of $G$ is mapped
    onto node $(m_1, ..., m_k) = f_{XOR}(v)$ in $T$ as follows [12]:


    ```

    $m_j(i) = v(i + K_j), i \in \{0, d-1\}; i \neq d-2$,$\nm_j(d-2) = XOR(v(K_{j+1}),
    v(K_{j-1}))$.

    ```


    Here $x(i)$ is the $i$-th bit of the binary representation of $x$. It is shown
    [12] that hypercube


    $H_d$ can be embedded into torus $E_k(2^d, ..., 2^d)$, $\sum d_i = d$ with the
    average distance


    ```

    $D = \frac{\sum_{i=1}^k 3 \cdot 2^{d-2}}{d}$

    ```


