  md: 'Nevertheless, using parallel performance computers it is possible reduce the
    computational cost and get results of simulation in a reasonable time. A question
    is how to develop efficient parallel algorithms and implement them on modern parallel
    computers.


    In this chapter, we present an effective technology of the distributed stochastic
    simulation. We also describe the software library PARMONC intended for the distributed
    stochastic simulation. The PARMONC launches the stochastic simulation on supercomputers
    with different architectures: massive-parallel and hybrid ones. In the PARMONC,
    a special random generation technique is used which, in particular, enables one
    to get correlated results of different Monte Carlo computations. We also study
    a scalability of the distributed stochastic simulation based on the use of the
    PARMONC, namely, study estimation of its scalability up to forfeit supercomputers.


    As an example of application of the PARMONC to real-life problems, we consider
    solving an actual problem arising in the physics of plasma, namely, simulation
    of electron avalanches cases. We present a probabilistic model which is detailed
    and enables one to get adequate description of the electron avalanche evolution
    We consider a scenario where the number of transitions in the avalanche and the
    total number of electrons is rather great (up to several billions). To make the
    stochastic simulation of the avalanche evolution we use a supercomputer with massive
    parallel architecture. To enhance the efficiency of computations, we also used
    Intel Xeon coprocessors. For this goal, we modified the parallel Monte Carlo algorithm
    defining new levels of parallelism. This technique enables one to load both the
    CPU and coprocessor with burden in a balanced manner.


    The structure of the chapter is as follows. In Section 2 we describe main ideas
    of the distributed stochastic simulation including the question of the parallel
    random numbers generation. In Section 3 we present the software library PARMONC.
    In Section 4 we describe the Monte Carlo algorithm for the electron avalanche
    simulation and discuss ways of its implementation on supercomputers with different
    architectures.


    # 2. Parallelization of Stochastic Simulation


    # 2.1. Distributed Stochastic Simulation


    The stochastic simulation is numerical realization of probabilistic representation
    of a certain object in order to estimate its desired integral features by the
    law of large numbers [1], [5]. We assume that a functional of interest $\varphi
    \in R$ is represented as an expectation of some random variable $\zeta$


    $\varphi \approx E\zeta$,


    provided that its variance $\zeta$ is finite. In this case, one can evaluate the
    value of $E\zeta$ using a sample mean:


    $E\zeta \approx \zeta = L^{-1} \sum_{i=1}^{L} \zeta_i \quad (1)$


    where $\zeta_i$ are statistically independent realizations of the random variable
    $\zeta$. The value of $\tilde{\zeta}$ is called a stochastic estimator for $\varphi$.'
