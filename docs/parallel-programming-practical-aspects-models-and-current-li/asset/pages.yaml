  md: '# Numerical Modelling of Astrophysical Flow ... 73


    Within Eulerian approach the following codes were developed: NIRVANA [72], FLASH
    [35], ZEUS [25], ENZO [39], RAMSES [57], ART [28], Athena [55], Pencil Code [8],
    Heracles [21], Orion [29], Pluto [35], CASTRO [33], GAMER [47].


    Have been numerous comparisons SPH and AMR methods. The main disadvantages of
    the SPH method are incorrect simulation of high gradients and discontinuities
    [65], suppression of the physical instabilities [1], difficult choice of the smoothing
    kernel [5] and the necessity of the artificial viscosity [58, 12, 50]. Despite
    the large number of difficulties in the SPH method there is also a lot of work
    to overcome them [43]. A separate topic related to SPH is the local entropy decrease
    in SPH method [52].


    The same also arises in Eulerian methods of Godunov type with linearised discontinuities
    [44]. The reason for this entropy decrease is the presence of rarefaction shock
    waves, which is also possible in all methods employing the solution of linearised
    discontinuity [11, 45, 24, 13, 6, 63].


    However, even in the case of linearised shear it is possible to develop a numerical
    scheme with provided methods is the solution non-invariance with respect to rotation
    or Galilean invariance [71, 56]. But this bottleneck of the mesh-based methods
    can be easily passed using different approaches to noninvariance numerical scheme
    design [20, 66]. One of the main points of both Lagrangian and Eulerian approaches
    is the lack of scalability [15, 64].


    During the last decade the Lagrangian-Eulerian methods were used for solution
    of astrophysical problems. These methods utilize the advantages of both approaches.
    The most widely used built Lagrangian codes are the AREPO code [53], which is
    based on moving meshes. Large number of collaborators using this code for cosmological
    simulations made it possible to create a very complex numerical model [59], and
    also to introduce sophisticated finite-element solvers [37]. On the basis of classical
    arbitrary Lagrangian-Eulerian approach the code developed the Lagrangian-Eulerian
    approach on the basis of Fluids-Cells (FIC) method and Godunov method for several
    years [66-69, 30, 31]. The solver has two stages. During the first (Eulerian)
    stage, the system of equation is solved without advection terms. During the second
    (Lagrangian) stage the advective transport is taken into account. The separation
    of the method into two stages enables to eliminate the Galilean non-invariance
    [67], and the use of Godunov method at the Eulerian stage enables to simulate
    the discontinuities correctly. There is a number of state-of-the-art first-order
    Godunov scheme is used for the solution of astrophysical problems using high-order
    schemes, for example MUSCL [63], TVD [26], PPM [10].


    Nevertheless, as it was shown in [18] in the presence of discontinuities even
    the first order is lacking. The AstroPhi and GPUPEG codes are mainly used to simulate
    the collisions of galaxies and this process involves a lot of discontinuities
    including shock waves, there is no real sense to use high-order schemes in the
    code. Of high-order schemes can be introduced into AstroPhi, but in there it is
    not necessary.


    The main focus of the paper is how the numerical method is implemented on supercomputers
    with Intel Xeon Phi and GPU accelerators. This work is part of project ‘Hydrodynamical
    Modelling of Astrophysical Flow at the Peta- and Exascale’, developed by the present
    author at the Siberian Super Center, ICMMG SB RAS.'
