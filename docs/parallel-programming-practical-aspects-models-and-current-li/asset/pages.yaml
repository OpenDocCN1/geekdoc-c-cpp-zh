    # 4.2. Implementation of Parallel Monte Carlo Simulation on Different Supercomputer
    Architectures


    To simulate the electron avalanches with large number of particles, we implemented
    several parallelization techniques. For this goal, we used either supercomputers
    with massive parallel architecture (i.e. without any accelerators or processors)
    or hybrid supercomputers with the processors using Intel Xeon Phi.


    We call a coarse-grained parallelization the mentioned-technology of parallel
    Monte Carlo simulation (see Section 2.1). Most of computations based on the coarse-grained
    parallelization were made on the massive parallel cluster NKS-30T of the Siberian
    Supercomputer Center of the Siberian Branch of Russian Academy of Sciences [34].
    For distributed stochastic simulation, we used in parallel up to 1200 cores of
    the cluster.'
