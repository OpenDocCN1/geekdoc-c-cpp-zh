  md: '134


    Mikhail A. Marchenko


    Monte Carlo method is often used for simulation of electron avalanches in gases
    (see, e.g. [28] – [32]). Corresponding probabilistic models are detailed enough
    and enable to get adequate description of the avalanche evolution. Using the Monte
    Carlo simulation, one can also take into account fluctuations in the state of
    the avalanche to estimate physical characteristics (effect of runaway electrons,
    e.g.). The main problem of the Monte Carlo method is the value of its computational
    cost: the number of transitions and multiplications in the avalanche may be quite
    large and therefore the number of particles may be too great.


    In our research [33], a three-dimensional parallel algorithm of the Monte Carlo
    method (ELSHOW) is developed for simulation of electron avalanches in gases. The
    parallel implementation is performed with the use of PARMONC, which accelerates
    the calculations of such integral characteristics as the number of particles in
    an avalanche, the coefficient of impact ionization, the drift velocity, and the
    others, as well as to select an appropriate size of the time step using the technique
    of statistical tests.


    The PARMONC was used to run the ELSHOW in parallel on the cluster KNS-30T with
    the massive parallel architecture [34]. Nevertheless, the value of computational
    cost of the stochastic simulation forces us to see new ways to speed up computations.
    For this goal, we developed the new version of the ELSHOW code adapted for hybrid
    architecture, namely with Intel Xeon processors.


    # 4.1. Probabilistic Model of Electron Avalanche Evolution


    Our goal is simulation of the initial state of the breakdown when the total electric
    field of electrons and ions in the avalanche is negligible in comparison with
    the external electric field.


    Below, we briefly describe a mathematical model of the electron avalanche evolution.
    The model is based on the use of stochastic processes. We call a particle tree
    a realization of the branching process. To traverse the particle tree, the code
    called “lexico-graphical scheme” is used [35]. It helps to use the computer effectively.


    We consider a three-dimensional system with external electric field which strength
    E = (0, 0, −Ez) is considered to be. A gap between electrodes is filled with a
    gas with concentration C and pressure p. At the initial time t = 0, at the point
    $r = (x, y, z) = (0, 0, 0)$ on the cathode $n_0$ (or model particles) with zero
    energy are emitted.


    We simulate each electron path until the maximum time $t_{max}$. For this goal,
    time steps of equal $\Delta t$ are made. In a step, each electron with the energy
    from the point $r_{i-1} = (x_{i-1}, y_{i-1}, z_{i-1})$ to the point $r_i = (x_i,
    y_i, z_i)$, where $i$ is the number of the step. As a result, its position and
    velocity change in the following way:


    ```

    $r_i = r_{i-1} + V_{i-1}\Delta t - eE(\Delta t)^2/(2m_0), \quad V_i = V_{i-1}
    - eE\Delta t/m_0,$

    ```


    Where $V_i = (V_x, V_y, V_z)$, is the charge of the electron, $m_0$ is its mass.
    An acceleration of the electron is also taken into account this formula.


    At the end of its path, the electron may collide with a nucleus of'
  merge: -1
  pgno: 144
- img_proc: true
  md: '# Efficient Computational Approaches for Parallel Stochastic Simulation ...
    135


    the gas. Thus, a collision event is simulated which probability is as follows:


    > $P = 1 - \exp\left(-\sigma_{tot}(T_i)C|mathbf{r}_i - \mathbf{r}_{i-1}|\right)$


    where $\sigma_{tot} = \sigma_{tot}(T)$ is a full microscopic cross-section of
    interactions. Then, if the collision event occurs, we randomly choose a type of
    collision:


    +   * elastic collision (scattering) of the electron, or

    * inelastic collision of the electron (leads to excitation of the atom), or

    * ionization of the atom (leads to creation of a new electron).


    Here, probabilities of collision type depend on the energy of incoming electron
    and are defined in accordance with the corresponding values of the cross-sections
    which are taken from experimental databases or by theoretical formulas [27], [33].
    To simulate the random choice of collision type effectively, it is desirable to
    use the “majorant frequency” method [36] which is the most effective computational
    approach for such kind of problems.


    The elastic collision does not change the energy of the electron and its moving
    direction is defined by the special differential cross-sections [27], [37]. Inelastic
    collision with the molecules changes the energy of the electron and its moving
    direction is defined in the same way as the elastic collision. The ionization
    leads to the inception of a new second electron which gets its energy from the
    incoming electron (its energy is reduced after ionization), the moving directions
    of the two electrons are defined by analogy. Thereby, these interactions form
    a single avalanche realization, i.e. the realization of the particle tree.


    At the end, we are interested in evaluating some physical characteristics at given
    time moments $t_i, i=1, 2, \dots$:


    +   * the number of electrons $n(t_i)$,

    * the center of mass $r_c(t_i) = (< x >, < y >, < z >)$, where

    $< x > = \sum_{k=1}^{n} x_k(t_i)/n(t_i)$, $< y > = \sum_{k=1}^{n} y_k(t_i)/n(t_i)$,
    $< z > = \sum_{k=1}^{n} z_k(t_i)/n(t_i)$,

    * the velocity of the center of mass $V_c(t_i) = < z > /t_i,

    * the average velocity $< V_z > = \sum_{k=1}^{n} V_{z,k}(t_i)/n(t_i)$,

    * the average kinetic energy $\epsilon_{aver} = \sum_{k=1}^{n} T_k(t_i)/n(t_i)$,

    * coefficients of longitudinal and transverse diffusion $D_L$ and $D_T$,

    * coefficient of impact ionization $\alpha$,

    * collision frequency $\nu$.'
