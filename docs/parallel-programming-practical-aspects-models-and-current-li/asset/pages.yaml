  md: '# 164 Konstantin Kalgin


    are independent, and the application rate is the same for each cell. Parallelization
    of the ACA model is formed by domain decomposition: each process hosts its own
    domain of cells and the copies of boundary cells of neighboring processes. For
    correct simulation of Poisson process for every cell, every computing process
    controls its own time. The process local time is the time of transition rule to
    a newly selected cell from its domain. A process increments its own time by an
    exponentially distributed pseudorandom number after each transition rule application.


    In [4] an algorithm for shared memory computers is proposed. Each process follows
    the following steps while its local time is less than predefined Tmax: (1) selects
    a random cell from its domain, (2) waits for the synchronization when minimal
    time of neighboring processes is greater than its own time for the cells belonging
    to the domain boundary, (3) applies transition rule to the cell, and (4) increments
    its own time according to Poisson distribution. Independence and Fairness of the
    algorithm are provided by independence and fairness of random selection from the
    domain and the way of local time incrementing. Correctness is provided by the
    synchronization by domain''s local time briefly in step (2). Efficiency is provided
    by the property that boundary cells are selected infrequently in large domains.


    In [5] a modified Warp algorithm is presented. Time Warp [10] is an optimistic
    parallel algorithm for any discrete event model on distributed memory computers.
    The main idea of the parallel Warp algorithm is as follows. In contrast the previous
    algorithm works without waiting for neighboring processes (each process “hope”
    that neighboring processes will not change boundary states). If a process changes
    a boundary cell state, it sends a message to its neighbors called a positive message.
    When a process receives a positive message from the “future” (i.e., its local
    time is less than that of the sender) it saves it for the future processing. A
    situation when a process receives a positive message “from the past” is called
    causality error. This recovery mechanism must be initiated. Recovery from the
    prematurely executed results in two ways to be rolled back: the cellular array
    and the messages sent to the other processes. Rolling back the cellular array
    is accomplished by periodically updating cell states and restoring boundary cell
    states valid for the rolled back local time. Rolling back previously positive
    messages is accomplished by sending anti-messages. If a process receives an message
    that corresponds to an unprocessed message, these two messages annihilate each
    other and the process proceeds. If arrives an anti-message that corresponds to
    a positive message already processed, the process has an error and is to be rolled
    back. A consequence of the recovery mechanism is that more anti-messages can be
    sent in the same way as in the previous process. Correctness is provided by recovery
    mechanism from causality errors (for detail see [5]). In few words, Efficiency
    is provided by optimistic behavior of processes. However, there are some costs
    for saving the history of message sends and updates of boundary cell states. If
    the costs are large (with effective work), then efficiency of the algorithm decreases.
    Also efficiency significantly depends on the following two parameters of the transition
    rule [5]: amount of work to be performed for the rule computing and average number
    of actually changed cell states after application of the rule.'
