  md: '# # Introduction


    The movement of galaxies in dense clusters turn the collisions of galaxies into
    an important evolutionary factor, because during the Hubble time an ordinary galaxy
    may suffer up to collisions with the galaxies of its cluster [60, 61].


    The problem of gravitational collapse of astrophysical objects are widely studied
    due to significant growth of observational astronomical data. Gravitational collapse
    takes place on initial stage of star evolution and also at the final stage (supernova
    explosion with collapsing core) [2].


    Observational and theoretical studies of interacting galaxies and stellar objects
    are indispensable method to study their properties and evolution.


    Numerical simulations play the key role in studying these processes. The progress
    in modern astronomy should be taken into account during the preparation of mathematical
    model. For example the magnetic fields in galaxies should be taken into account
    its presence was found in the arms of the galaxy M51 [16]. This fields brings
    to the processes of stars formation and the formation of complex chemical elements
    [27]. It remains an open explanation of the mechanism of planetary systems with
    more than one planet [54]. There is a special place has the problem of planets
    around binary stars [23], which is approximately 20% of all planetary systems.


    There are several scenarios of planet formation in binary systems. For example,
    in a system of two stars where one is a red giant the other a white dwarf, red
    giant can strip part of substance absorbed by the white dwarf forming a protoplanetary
    disk.


    In addition the planet system can be formed during the evolution of close binary
    stars. Separately should consider a problem of the gas formation [48], solid planets
    and atmospheres of such planets around [49]. Professor of the Institute of Astronomy
    RAS A.V. Tututkov has made classification scenarios of planetary systems [62]
    which include all of the above scenarios.


    In galaxies formation problems dramatically difference are involved. The mass
    of the normal galaxy is $10^{13}$ of the mass of the stars and the size $10^p$
    kg, the size of a star is $10^8$ meters while the size of a collapsed star is
    $10^7$ meters. Which is orders of less than a small planet. The presence of very
    different spatial scales forces us to employ the most powerful supercomputers
    from Top 500. Two supercomputers of the Top 3 (four of the Top 10) supercomputers
    in November 2013 version of the Top 500 are built with either GPGPU or Intel Xeon
    Phi accelerators. Most probably, the first Exascale supercomputer performance
    be built by the hybrid approach.


    There are already some astrophysical numerical codes for GPUs and GPU-based supercomputers,
    for example, GAMER code [47]. The development of software for supercomputers based
    on Intel Xeon Phi, as well as for GPU-based supercomputers, is not just simple
    technical question, it is a complex problem requiring the design of special computational
    algorithms.


    In recent decades two approaches are mainly used for the solution of nonstationary3D
    astrophysical problems. They are the Lagrangian SPH method [17, 32] (Smoothed
    Particle Hydrodynamics) and the Eulerian methods within adaptive meshes, or AMR
    (Adaptive Mesh Refinement). Within the Lagrangian approach the following codes
    were developed Hydra [40], Gasoline [71], GrapeSP [33], GADGET [52].'
