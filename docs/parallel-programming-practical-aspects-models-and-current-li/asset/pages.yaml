    On Euler numerical method must drop the advective terms in the equations of continuity,
    motion and velocity dispersion tensor. As a result the equation in one-dimensional
    case should be written as:


    ```

    $$\frac{\partial \mathbf{n}}{\partial t} + \left[ \mathbf{u}_* + \frac{\partial
    \sigma^2}{\partial \mathbf{x}} \right] \mathbf{n}\frac{\partial \mathbf{u}}{\partial
    \mathbf{x}} = 0$

