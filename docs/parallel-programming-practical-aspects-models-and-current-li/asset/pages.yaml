  md: 'specified as follows. For computer systems, in processes that are executed
    in parallel, it is natural to consider all sorts of mistakes distorting, terminating
    with no results or hanging calculations destabilizing factors. Errors must be
    diagnosed and, if possible, neutralized. This should enable the users, developers
    of the system processes and hardware support service to take appropriate actions.
    The diagnosis should be targeted and undistorted information about the incident,
    and the neutralization should be minimizing losses from failures. However, this
    is very difficult to achieve, in particular, because of non-determinism of a parallel
    computer system, excluding the detection of all the errors by testing. The main
    problem is the recognition of the hidden errors, which do not always manifest
    themselves in situations that look identical. An increasing of the processes robustness
    possible by monitoring the effective processes implementation. Unfortunately,
    the use of this approach has its limitations.


    A very promising solution of the problems of parallel computer systems is considered
    modeling the distributed processes interactions. One of the main problems is to
    define the process interface, the satisfaction of which would prevent the system
    (network) from falling into unstable states: suspension, exceeding expectations,
    etc. When modeling, the processes are described as sending messages in a standard
    format, receiving them with detecting errors, performing actions to neutralize
    errors in terms of their functioning and the network computing stability. The
    existing network organizes processes interaction and allows users to carry out
    their tasks.


    It is often interpreted as an implementability of a formal process description.
    However, the undesirable conditions make time unproductive, and the management
    of processes is a complex task that is bordered with art. Considerable efforts
    to standardize protocols and methods that do not change the matter [2, 3].


    Thus, the existing methods of improving the reliability of network interactions
    are not sufficient to get the desired level of parallel systems robustness. Along
    with their development, we need other methods and approaches that would be able
    to correctly diagnose and neutralize the errors, and would prevent complex situations
    involving errors. It seems appropriate to use and adapt the experience gained
    in other areas to the subject of interacting processes. This problem is solved
    in the following sections.


    Section 2 deals with the motivation of the approach and presenting ideas of the
    method used in the following sections. The main content of the material is presented
    in the form of the analysis of several examples in Section 3. Recommendations
    are given on how or that method may be used in the systems development of interacting
    processes. To present the results of analysis, regardless of their motivation,
    these recommendations are highlighted in the text and numbered. In conclusion,
    the presented recommendations are discussed, and possible ways of the approach’s
    development are outlined.


    # 2 Communication between Processes: Good and Bad Cases


    When modeling networks, it is usually assumed that to describe relevant process
    interactions, it is sufficient: 1) operate with abstract messages and related
    concepts: sending, receiving, waiting for a message, reply, etc.; 2) use the messages
    to regulate the interaction of local pairs of processes: the source and recipient
    of messages.'
