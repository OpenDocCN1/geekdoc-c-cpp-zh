    # 6.3. Permutation Algorithm for the Uniform Mapping Problem


    In [3] we proposed the following approach (MB-algorithm) to the problem of mapping.
    Let us give the initial embedding of vertices in the program graph onto the vertices
    of the CS graph. For example, $f_p(x)=x$, i.e., the branch numbers of graph $G_p(V_p,
    P_p)$ coincide with the numbers of ECs containing these branches. Let $e_p(x)$
    is an environment (the set of neighbors) of vertex $x$ in graph $G_p$, and $e_s(x)$
    is its environment on graph $G_s$. For every vertex $x \in V_p$, we test permutation
    of vertices $i$ and $j$ satisfying the condition


    $i \in e_p(x) \& i \neq e_p(x) \& j \in e_s(x) \& state(j)=0$.'
