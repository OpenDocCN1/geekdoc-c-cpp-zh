    # 2.6. Averaged Values


    At flows, the cellular automaton microlevel parameters, such as mass m(w) and
    particles c(w) velocity in each cell w W, do not have practical significance.
    The averaged values of the velocities (u) and concentrations (n) over some averaging
    vicinity Av(w), including all cells wⱼ not placed from a cell with distance r
    called the averaging radius, are worth much more. An averaged velocity is the
    total of all particle velocity vectors in averaging vicinity Av(w), divided by
    the cardinal number of the averaging vicinity:


    ```

    $$(u)(w) = \frac{1}{Av(w)} \sum_{wⱼ∈Av(w)} \sum_{i=0}^{b} sᵢcᵢ$$$ (12)

    ```


    where Av(w) is an amount of the cells situated in Av(w), cᵢ is the unit vector
    corresponding to the i-th digit of state vector s(wⱼ), and sᵢ is the magnitude
    of the i-th digit of state vector s(wⱼ) of cell wⱼ∈ Av(w).


    An averaged concentration of particles ⟨n⟩ is evaluated in the same vicinity Av(w)
    as follows:


    ```

    $$(n)(w) = \frac{1}{Av(w)} \sum_{wⱼ∈Av(w)} \sum_{i=0}^{b} sᵢ$$$ (13)

    ```


    Averaged values of the particles velocity and concentration are called model velocity
    and model pressure, respectively. They correspond to the velocity and pressure
    values of a simulated fluid and macrolevel arguments.


    We note that the average model velocity and the model concentration values will
    match their physical analogs only when the averaging vicinity Av(w) consists exclusively
    of cellular cells w�∈ W, otherwise we will consider values ⟨u⟩ and ⟨n⟩ as indefinite.
    This requirement does not allow calculating ⟨u⟩ and ⟨n⟩ for the cells with a distance
    to walls and sources less than averaging radius r.'
