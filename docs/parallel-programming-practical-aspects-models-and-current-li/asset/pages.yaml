    In [8], the diffusion algorithm of balancing for the method of particles in cells
    PIC is considered. In particular, a program runtime is given for a different number
    of cores with and without balancing. The amount of particles used there is changed
    up to 800 thousand. We made the test in which 800 thousand cells were used, and
    compared the efficiencies. Unfortunately, in [8] there is no runtime on one core,
    the efficiency was computed in relation to the runtime on two cores: $eff_2 =
    2 \cdot t_2 / p \cdot t_p$, where $t_2$ is the program runtime on two cores, and
    $t_p$ is the program runtime on $p$ cores.'
