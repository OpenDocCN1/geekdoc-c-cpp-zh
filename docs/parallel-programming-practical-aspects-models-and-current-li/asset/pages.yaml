    # 2.4. Propagation Phase


    In the propagation phase in each cell $w \in W$, each particle specified by components
    $s(w)$, at $i = 1, \dots, 6$, propagates to the neighboring cell $N(w)$ corresponding
    to its velocity vector $\mathbf{e}_i$. The rest particles, remain in the cell
    $w$. Then, the i-th component $s(w)$ of the state vector $s(w)$ after propagation
    acquires the value


    ```

    $\delta_i^s(s_i(w)) = \begin{cases} s_i(N_{(i+2)mod 6+1}(w)), & \text{for } i
    = 1, 2, \dots, b; \ s_i(w), & \text{for } i = 0. \end{cases}$

    ```


    In spite of the fact that at propagation the mass and momentum in a single cell
    are changed; within the cellular automaton, they are maintained, i.e., the requirements
    (6) and (7) are fulfilled.


    # 2.5. Collision Phase


    In the collision phase there is a veering of particle velocity directions according
    to some collision rules which are not dependent on the states of the neighboring
    cells, i.e., $\delta_2$ depends only on the state of its own elementary FSM. The
    FHP-MP model, function $\delta_2$ is probabilistic. The collision rules for all
    types of cells described above (conventional cells, walls and sources) are as
    follows.


    Conventional cells. In conventional cells $w_c \in W_c$, function $\delta_2$ is
    selected from such ones that mass $m(w)$ and momentum $p(w)$ of particles in a
    cell were conserved:


    ```

    $\sum_{i=0}^b \dot{\delta}_2(s_i(w)) = \sum_{i=0}^b s_i(w_c), \forall w_c \in
    W,$

    ```


    ```

    $\sum_{i=0}^b \dot{\delta}_2(c_i(w)) = \sum_{i=0}^b s_i(w_c)c_i(w), \forall w_c
    \in W$

    ```


    One of the possible values obeying (9) and (10) should be chosen with an equal
    probability. A fulfillment of (9) and (10) implies a fulfillment of (6) and (7).


    Walls. In the cells $w_w \in W_w$ the walls, are \"mirrored\" backwards, violating,
    thus the momentum conservation


    ```

    $\delta_2^s(s_i(w)) = \begin{cases} s_{(i+2)mod 6+1}(w_w), & \text{for } i = 1,
    2, \dots, b; \ s_i(w_w), & \text{for } i = 0. \end{cases}$

    ```


    Since the number of particles in a cell is not changing, the requirements (9)
    and, therefore, (6) are satisfied. It is not so for (7), because the directions
    of particles velocity'
