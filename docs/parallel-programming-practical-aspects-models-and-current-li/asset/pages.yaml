    $$\frac{\partial \mathbf{u}_*}{\partial t} + \left[ \frac{\partial \mathbf{u}_*}{\partial
    \mathbf{x}} + \frac{1}{n}\frac{\partial \sigma^2}{\partial \mathbf{x}} \right]
    \mathbf{u}_* = 0$

