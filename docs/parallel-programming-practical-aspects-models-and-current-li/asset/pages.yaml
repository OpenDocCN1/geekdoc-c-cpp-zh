    ```

    $W = \sum_{p=1}^{n} X^p X^{pt}, \quad (32)$

    ```


    where $X^p$ is a reference vector, $p=1,...,n, n$ is a number of reference vectors.


    The components of vector $X^p$ are distributed to $m$ computers (processors) of
    the computer system. According to (32), each vector $X^p$ needs the pairwise multiplication
    of all its components. For parallel execution of this multiplication it is necessary
    to:


    +   1. Perform all-to-all exchange of the vector $X^p$ components among the computers
    to obtain the vector $X^p$ entirely in each processor.

    2. Multiply the corresponding share of $N/m$ components of the vector $X^p$ by
    all components of the same vector in each processor.


    As a result, we have $N/m$ rows of matrix $W$ in each computer.


    # 7.1.2. Training Hopfield Network According to Projection Method


    This is based on the formulas [2]:


    +   1. $W^0 = 0$.


    ```

    $\begin{cases} Y^p = (W^{p-1}-E)X^p, \ W^p = W^{p-1} + \frac{Y^p Y^{pt}}{Y^{pt}
    Y^p}, p=1,...,n, \end{cases}$

    ```


    where $E$ is the identity matrix.


    For each vector $X^p, p=1,...,n$ we need to perform the following steps:


    +   1)all-to-all exchange of the vector $X^p$ components among the computers to
    obtain the vector $X^p$ entirely in each processor;

    2) parallel multiplication of matrix $W^{p-1}-E$ bands by vector $X^p$ to obtain
    vector $Y^p$ fragments;

    3)all-to-all exchange of vector $Y^p$ components among the computers to obtain
    the vector $Y^p$ entirely in each computer;

    4) inner product $Y^p Y^{pt}$ computation: parallel multiplication, using the
    doubling scheme with mapping onto hypercube to calculate the sum of the products;

    5) outer product $Y^p Y^{pt}$ computation: parallel multiplication of column vector
    $Y^p$ fragments to row vector $Y^{pt}$;n6) parallel computation of matrix $W^p$
    bands.'
