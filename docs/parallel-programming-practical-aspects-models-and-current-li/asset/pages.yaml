    # Abstract


    The problems of distributed computing associated with the reliability of network
    interactions are discussed. Sequential solutions of some problems that are naturally
    interpreted as systems of interacted processes are considered. Descriptions of
    traditional problems solutions as systems of interacting processes are applicable
    for decomposition of computing task and increase the computations robustness.


    Keywords: Robustness, reliability, parallel systems, errors and their diagnostic,
    processes interactions, parallel and concurrent processes, good cases of solving
    error problems


    # 1. Introduction


    The notion of robustness means a condition wherein the characteristics of the
    technology, the process or processes are not sensitive to the destabilizing factors
    [1]. This concept is directly related to the quality features such as system reliability.
    If reliability is understood as the external characteristic of the system, describing
    the degree of satisfaction of expectations under the system, the robustness should
    be considered as a package of actions to achieve the required reliability. These
    actions are engaged and taken throughout the life cycle of the system development
    from its conception, design and construction, and then to a stop of using it.
    As applied to computer systems, general provisions on the robustness and reliability
    are


