  md: 'However, the methods of information use are different. The analysis of these
    methods from the perspective of their applicability in more general cases is represented
    below.


    # 3.1. Parsing


    The process description of an analyzer comes from the usual convention that string
    to be parsed from left to right, character by character. Each character of the
    string is checked for a match with a terminal symbol of the product and if the
    result is affirmative, then it is a signal for the line forward. This promotion
    is accompanied by a generator of the process responsible for the analysis of the
    line remainder. We can assume that the input string is multiplied: each activated
    process get your of the unread input string pointer (it is enough to store and
    transfer the copies of pointers to the next character and returns the copies after
    the completion of the production process).


    The analysis distinguish between two types of completion:


    +   - inglorious conclusion, it turns out that the process was activated at the
    time in vain, everything it did in the hope for a sequel, will be destroyed with
    the memories of it;

    - completion with the hope for a sequel, when there is an opportunity to find
    out that the completed process was carried out in vain: the product is a member
    of the restored sequence of productions (i.e., at the time it participated in
    the inference).


    The inglorious conclusion exactly corresponds to the metaphor of inglorious life
    of an individual who leaves a memory (on the absurd abstract disk, parents outline
    their children). Also, in accordance with the method, the hope for the continuation
    may be in vain: ingloriously terminated parent (grandparent) process makes all
    the children same (no matter, already completed or continue to exist).


    The scheme can generate an infinite number of processes: when the grammar is left-recursive,
    the process generation is cyclic. The situation is remedied if the generation
    is complicated, but for the purposes of parsing and processes interactions, the
    left-recursive grammar can be excluded from consideration.


    It is clear that the presentation of the scheme and its relationship with the
    processes of string generation is too high a price: avalanche of concurrent processes
    requires excessive resources.


    Therefore, in practice, this is rejected. Only the method of recursive descent
    clearly describes the idea of the string generation process. Here, from the outset,
    it is assumed the special case, where, at the first stage it can be solved for
    which of the productions was applied. This is true for LL(1) grammars [5] which
    are important in terms of the application but does not cover all relevant cases.


    It is instructive to note that, in the concept of object oriented design and programming,
    there is a trend of description of recursive descent as the interaction of objects
    (processes) which represent the tree nodes of parsing the string. The activity
    of these objects, i.e., feasibility of autonomous generation of the processes
    in the following: built as part of the syntactic structure (nonterminal), the
    object activates the processes that are responsible for the analysis of each of
    the string, generated by it, and finish building the structure.'
