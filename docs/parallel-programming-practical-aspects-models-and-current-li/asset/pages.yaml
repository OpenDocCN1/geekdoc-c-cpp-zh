  md: '# 8 Mikhail S. Tarkov


    In transformation (1) a rectangular window of size $(2M+1)\times(2M+1)$, $M \ll
    min(N_t, N_s)$ is commonly used; so, the calculation of values in a point of the
    image is associated with the processing of a small neighborhood of this point,
    i.e., filtering algorithms of form (1) are local. By the locality of transformation
    (1) it follows that it should be used as a geometric parallelism, i.e.,


    +   1) the neighborhood graph of processes in a parallel program must correspond
    to the neighborhood of image pixels;

    2) the mapping of data fragments processed by the algorithms (1) onto the processes
    must preserve fragments neighborhood;

    3) as a graph of parallel program, implementing image filtering, it is advisable
    to use the "mesh" (Figure 3a) or the "line" (Figure 3b).


    In the limit, with a maximum parallelization, each process is in the one-to-one
    correspondence to a pixel.

    The mesh and the line are well mapped ontocube and toroidal structures of computer
    systems. Further we always assume that the image components are uniformly distributed
    throughout the computers of the system so that the neighboring pixels are always
