  md: '# XPU: A C++ Metaprogramming Approach to Ease Parallelism Expression 193


    A pipeline is set of simultaneously active tasks called "stages" that communicate
    following a producer-consumer relationship; each stage is responsible of consuming
    and producing data. Thus, each pair of adjacent stages forms a producer-consumer
    pair [40]. At the opposite of the serial execution pattern where completely dependent
    sequences of tasks are executed sequentially, pipeline stages are activated at
    the same time. However, in order to recover data coherency, dependent activities
    or "folds" are serialized and parallelism is exploited only on independent activities.
    Figure 14 shows the difference between conventional sequential execution and pipeline
    execution.


    Pipeline parallelism can act as a great parallelism multiplier and can be very
    useful in real-time applications where the main algorithm must process a data
    stream such as in our signal processing application. Unfortunately, low-level
    parallel programming models exacerbate the difficulties of expressing pipeline
    parallelism and require restructuring of the code and complex scheduling techniques
    to perform efficient execution on modern multicore architectures, XPU provides
    a parallel construct named "pipeline" which aims to ease expression of pipeline
    parallelism [1-3]. As all the other XPU parallel construct, the pipeline. The
    "pipeline" construct handle internally synchronization between stages through
    and asynchronous event-based scheduling. Pipeline implementation details are discussed
    in previous publication [1, 3]. The XPU run-time system uses a cache-aware scheduling
    technique to perform efficient pipeline execution on multicore processor through
    efficient cache use and dynamic load balancing.


