    **Keywords:** Parallel programming model, structured parallelism, skeleton, execution
    patterns, parallel constructs, multicore


    # 1. Introduction


    # 1.1. Context


    With the rise of the Chip Multicore Processor (CMP), parallel computing hardware
    is becoming widely available on many scales: from personal computers to embedded
    systems to high performance supercomputers... [5-8]. While concurrent programming
    is still distant from the average sequential programmers, this proliferation of
    multicore architectures has placed mainstream developers under a great pressure
    to parallelize their applications as possible to take advantage of these platforms.
    Parallel programming using the traditional thread-and-locking programming remains
    a hard task for most of the programmers since it is time consuming, error prone
    and requires deep knowledge and skills.


    Moreover, parallel hardware is becoming increasingly heterogeneous: a modern stage
    may include two or more multicore processors with several manycore GPUs. In order
    to target such architectures, a programmer must have a deep understanding of the
    target hardware and should often use separate programming models making parallel
    programming harder and resulting in poor productivity.


    Exploiting software parallelism in these heterogeneous multicore architectures
    has become a great design challenge which outlines the need for new technologies
    to make multicore processors more accessible to a larger community [22].


    Due to this technological context, two major needs have emerged: on one hand,
    a *hardware abstraction* to hide details of the underlying platform providing
    portability, scalability and accommodating its heterogeneity.


    On the other hand, **programmability** improvement is in high-demand as it increases
    productivity and minimizes programming complexity. These needs should be satisfied
    without sacrificing **performance** and **forward scalability**. Programmability
    is achieved by minimizing development costs in term of time, complexity and required
    tools in order to remain as close as possible to traditional sequential development.


    Parallel development overheads are mainly generated by programming paradigm-related
    routines such as synchronization, communication, shared memory management, and
    workload scheduling. These routines introduce a significant amount of extra-code
    related to parallel programming paradigms and not to the user application itself.


    Additional effects such as hard debugging and difficult performance tuning are
    also induced.'
