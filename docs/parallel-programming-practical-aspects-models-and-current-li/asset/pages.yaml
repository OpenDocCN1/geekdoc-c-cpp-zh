    One also needs to evaluate a second moment $E\zeta^2$ of the random variable


    $E\zeta^2 \approx \xi = L^{-1} \sum_{i=1}^{L} \zeta_i^2$


    in order to estimate the variance and standard deviation of the random variable
    $\zeta$:


    $Var\zeta \approx \sigma^2 = \xi - \zeta^2, (Var\zeta)^{0.5} \approx \sigma$.


    In the Monte method, a complex random variable is represented as a function


    $\zeta = \zeta(\alpha_1, \alpha_2, \dots, \alpha_k),$ (2)


    where $\alpha_1, \alpha_2, \dots, \alpha_k$ are independent random variables which
    have uniform distribution on the interval $(0, 1]$ [5]. These variables are called
    base random numbers. A sequence of the base random numbers $\{\alpha_k\}$ is usually
    generated with the help of some deterministic algorithm called a random number
    generator (RNG). Usually, iterative formulas are used:


    $\alpha_{k+1} = f(\alpha_k), k = 0, 1, 2, \dots$


    where $\alpha_0$ is some fixed quantity.


    Thus, while calculating the $\zeta_i, i=1, 2, \dots, L$ the base random numbers
    are in produced by the RNG. We need a finite set of independent random numbers
    $R=\{\alpha_1, \alpha_2, \dots, \alpha_q\}$. We call a stochastic experiment process
    of calculating the sample mean $\zeta$ using a particular set of base random numbers.
    Usually, $R$ is a subsequence of general sequence $\{\alpha_k\}$ of base random
    numbers. Using some different $R''=\{\alpha_1, \alpha_2, \dots, \alpha_q\}$ (or
    a different subsequence) of the base numbers that are independent of the base
    random numbers from $R$, we finally obtain an independent value of the sample
    mean. In other words, we make the stochastic experiment which is independent of
    the first one.


    A $\lambda$ confidence interval for the expectation $E\zeta$ is defined by the
    formula


    $\lambda = P(|\zeta - E\zeta| \le \gamma(Var\zeta)^{0.5}L^{-0.5}) \approx P(|\zeta
    - E\zeta| \le \gamma)\sigma L^{-0.5}).$ (3)


    According to tables of a standard normal distribution, $\gamma(\lambda)=3$ for
    $\lambda=99.7\%$. A value of an absolute (stochastic) error $\tilde{\varepsilon}$
    of the stochastic estimator $\tilde{\zeta}$ is given by the formula


    $\tilde{\varepsilon} = 3(Var\zeta)^{0.5}L^{-0.5} \approx 3\sigma L^{-0.5}$


    and the value of a *relative* (stochastic) error is given by the formula


    $\tilde{\rho} = \varepsilon/\zeta.100\$.


