  md: '# An Approach to the Construction of Robust Systems of Interacting Processes


    The following example makes one doubt that the selected base is adequate to describe
    the network functioning.


    Suppose process A sends a message to process B, which, in turn, because of any
    external impacts and internal state, sends a message to process C. Let C detects
    an error, i.e., a mismatch of the received message to the expected. It is unlikely
    to interpret the situation differently as an error of B. However, the actual error
    can occur when transmitting a message from A to B, but it was (for whatever reason)
    unnoticed, and as a result, process B sends a message to C. Process of C, of course,
    can give a response message, which indicates the error, but C is unable to properly
    diagnose the error because there is no data for it.


    In turn, process B engaged with it, can never respond adequately to the bug report.
    To do this, it should at least expect the response message. This is not enough,
    the source of the error could not process A, but an earlier process or a hardware
    failure. The reaction to error propagation requires an analysis that goes beyond
    the limits of local interactions between processes A, B and C.


    There are more difficult cases with the expectation of messages that are capable
    of generating parades of suspension (deadlock) type as “pasta philosophers” [4].


    The consideration of “bad” cases is useful when they show the direction of increasingly
    complex regulations and agreements that do not provide a satisfactory solution
    for the problem. In this, it is useful to analyze the “good” situations when it
    is possible to overcome the avalanche of size of local information used for decision-making.
    On this base, we can get to an answer of how to overcome the difficulties useful
    in certain situations, when modeling networks. Good cases should be complex enough
    not to be in a situation of trivial solutions (like the “ban all sorts of interaction”).
    But, at the same time, it should be clear why, in the particular case, a solution
    is obtained. It does not matter what area good cases are taken. It is also important
    that the conditions are similar.


    The aim of this work is to analyze some problems, methods which could be useful
    for proper adaptation to describe robust network interactions. To do this, we
    consider the possibility of presenting the solutions as processes interaction,
    which implementation lends itself to a reasonable robust scheme to support the
    network reliability.


    # 3. Examples of Solutions by Processes


    The proposed idea is demonstrated in a number of examples of solving the known
    problems:


    +   - parsing as interaction of processes;

    - exhaustive search in finding the shortest path in the graph;

    - character transformations of structured strings and the model of computation
    in Refal.


    Conventional solutions for these problems are converted into a form that can be
    represented as processes interaction. This representation allows one to figure
    out how to solve the problems of programs improper behavior in these examples.
    Common to all the problems in their process-representation is the use of meaningful
    information pledged to the algorithm.'
