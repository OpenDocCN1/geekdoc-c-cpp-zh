  md: '# Lattice Gas Cellular Automata for a Flow Simulation


    The core with the number rank receives:


    from the core $rank$ the line $i_l(rank) - 1$, for $1 \leq rank < p$,

    from the core $rank + 1$ the line $i_b(rank)$, for $0 \leq rank < p - 1$.


    The received values are used at the third stage.


    +   3. Propagation. For boundary cells, a strip of its neighbors includes others,
    whose states are just received from adjacent cores.


    # 5. Load Balancing Algorithm


    From the variety of balancing algorithms [7], we selected the diffusion algorithm
    for the following reasons.


    The algorithm has high efficiency of parallel implementation on a cluster with
    the size of thousands of cores, as distinct from the centralized algorithms, where
    size brings significant overheads.


    The place of the cellular array section does not influence the amount of data
    sent for each iteration.


    The adjacent cores, as well, exchange their boundaries for each iteration.

    The load imbalance increases slowly (except for in the tasks with an explosive
    wave).


    # 5.1. Initial Balancing


    Before the simulator starts, one iteration is performed for every line $i$ ($0
    \leq i < L$). On this iteration, the collision runtime in the cells is computed
    as follows:


    ```

    $$t_0(i) = \sum_{j=0}^{L-1} t(i, j),$$

    ```


    where $t(i,j)$ is the collision runtime in cell $(i,j)$. The propagation stage
    requires less time than the collision one and is not taken into account; hence,
    the averaged core time is computed as follows:


    ```

    $$\bar{T} = \sum_{i=0}^{L-1} t_0(i) / p.$

    ```


    Now, for all cores ($0 \leq rank < p$), strip boundaries $i_a(rank)$ and $i_b(rank)$
    may be calculated. The lower boundary $i_A$ is selected so that the following
    conditions are satisfied:


    ```

    $$\sum_{i=0}^{i_a(rank)} t_0(i) \leq rank \cdot \bar{T} , \quad \sum_{i=0}^{i_a(rank)+1}
    t_0(i) > rank \cdot \bar{T} .$$

    ```'
