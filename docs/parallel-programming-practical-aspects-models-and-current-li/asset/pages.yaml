  md: "# 4 Mikhail S. Tarkov\n\ntypically processor cores with local memory and additional\
    \ devices by specialized routers. This approach to communication in VLSI has the\
    \ advantages of scalability (the increasing size of the network increases its\
    \ bandwidth) and parallelism (data in different network segments are segmented\
    \ simultaneously). The structures of these networks are regular and have a limited\
    \ degree of the node (hypercube, torus). The most common structures in such networks\
    \ are multi-dimensional tori.\n\nThe advantage of this concept over the classic\
    \ alone is that the point-to-point links between routers provide a high throughput\
    \ by the presence of intermediate registers in the signal path, and the data on\
    \ different network segments are transmitted and switched simultaneously. It provides\
    \ high performance, capacity and resource savings, making the research and development\
    \ of new network architectures on a chip top. A modern VLSI chip is no longer\
    \ a monolithic block of synchronous hardware where all transitions occur simultaneously.\
    \ Most of VLSI chips are now regarded as distributed systems of interacting systems\
    \ - System-on-Chip (SoC) and Network-on-Chip (NoC) [10, 11].\n\nIn this chapter,\
    \ algorithms for mapping neural networks of signal and image processing onto distributed\
    \ computer systems with a regular structure are proposed. The algorithms for mapping\
    \ neural networks onto hypercube and torus are investigated.\n\n# 2. Distributed\
    \ Computer System Topology\n\nA distributed computer system (DCS) [12–17] is a\
    \ set of elementary computers (ECs) connected by a network program-control by\
    \ these computers. Every elementary computer includes a computing unit (CU) and\
    \ a system device (SD) (a router). The system device works under control and has\
    \ input and output poles connected according to the output and input poles of\
    \ the neighboring ECs. The DCS structure is described by a graph $G_s(V_s, E_s)$\
    \ where $V_s$ is a set of ECs and $E_s \\subseteq V_s \times V_s$ is a set of\
    \ connections between ECs.\n\nFor a distributed computer system, a graph $G_p(V_p,\
    \ E_p)$ of a parallel program is usually defined as $V_p$ of the programs (virtual\
    \ elementary computers) communicating to each other by point-to-point interface,\
    \ i.e., transferring messages across logical (virtual) channels (one-to and two-directed)\
    \ of a set $E_p \\subseteq V_p \times V_p$. In a general case, nodes $x, y \\\
    in V_p$ and edges (arcs) $(x, y) \\in E_p$ are weighed by numbers characterizing\
    \ complexities of the bands and intensities of communications between them.\n\n\
    There are many factors that must be taken into consideration for a choice of the\
    \ DCS architecture to be used for image processing. The most popular types of\
    \ the DCS topology are hypercubes and torus [12–17].\n\nIn $d$-dimensional hypercube\
    \ $H_d$ with $2^d$ nodes $i$ and $j$ are connected if and only if the Hamming\
    \ distance $H(i, j)=1$ (Figure 1). For a given number of nodes the hypercube architecture\
    \ has the best communication possibilities, but the scalability of hypercube is\
    \ constrained by the fact that the interconnection cost per node (node degree)\
    \ increases with the total number of nodes. From the scalability of view, torus\
    \ is an interesting type of interconnection topology."
