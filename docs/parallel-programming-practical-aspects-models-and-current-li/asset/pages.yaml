  md: '# 178 Nader Khamassi and Jean-Christophe Le Lann


    For instance MIT-LL is developing the Parallel Vector Tile Optimization Library
    (PVOL) [18] in order to expand parallel programming constructs in the Parallel
    Vector Library (PVL) [26] and VSIPL++ [16] to support both homogeneous and heterogeneous
    multicore architectures [22].


    Despite their ability to express parallelism at the cost of a relatively small
    amount of programming effort, most task-based parallel programming models target
    specific application domains such as signal processing in the case of PVL, PVOL
    and VSIPL++ or offer limited collection of execution patterns to express specific
    type of parallelism: for instance Clk allow easy expression of single and nested
    task parallelism, which is much harder to express temporal parallelism as in the
    pipeline execution pattern, where restructuring of the code is required [31].
    Finally, in spite of their high hardware abstraction, most task-based programming
    models are not yet able to support heterogeneous multicore programming models:
    for example OpenCL [29] or CUDA [30] may be used to support GPGPU, with another
    task-based parallel programming model such as MPI to exploit CPU and SMP platforms
    and a third heterogeneous programming model which is hard to use and maintain
    and requires multiple skills and deep understanding of different hardware and
    software components. These constraints result in a productivity loss and can be
    discouraging the average sequential programmers.


    Main-stream applications and general-purpose programs may expose varying amount
    of parallelism and different parallel-sequential ratios: many scientific simulations
    and signal processing problems are massively parallelizable however many general-purpose
    applications are much more sequential execution constraints such as many video
    decoding algorithms [32] and compression algorithms [33].


    This outlines the need to express both parallel and sequential execution in a
    single homogeneous hybrid model able to provide a generic and non-domain specific
    programming model.


    In addition, a program may contain several types of parallelism which are all
    difficult to express using a single programming model so the programmer uses several
    disparate programming models inside the same application resulting in ineffective
    use of processor caches, poor load-balancing and potentially system overloading
    with many independent run-times.


