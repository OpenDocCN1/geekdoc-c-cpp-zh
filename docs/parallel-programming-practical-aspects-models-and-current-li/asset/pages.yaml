    Of particular note is the multiplicity coding. As we know, this technique becomes
    quite common for sequential processes, but it is not used in the case of parallelism.
    This issue needs further investigation.


    Outside the scope of this work, a significant number of cases of distributed computing,
    which experience is appropriate to be used, remained. In particular, we did not
    study the approaches to the description of distributed computing based on a dataflow
    model. As is pointed out in [23], it is very natural to consider the so-called
    data flowcharts as a representation of the network of computers interconnected
    by the data flows transmitted between them. The history of past continuations
    does not affect the behavior of each computer. Essentially, other networks are
    not considered. We can assume that the traditional data flow computing solves
    the network problems by fairly strong restrictions. Such restrictions are considered
    another example of overcoming difficulties, perhaps the most effective. But it
    is correct only if the scope of the systems applications is narrowed more than
    allowed.


    The materials presented here should not create the impression that all the existing
    network solutions are good. On the contrary, in many situations, they demonstrate
    acceptable robustness and plenty of good cases. For instance, this is true with
    respect to the protocols that have been criticized above. This criticism is not
    aimed at denying the past experience. Our purpose is different: we try to show
    that acceptable solutions can be found not only by correcting errors, but also
    by analyzing the existing solutions in areas that, at first, seem very far removed
    from the studied problems.'
