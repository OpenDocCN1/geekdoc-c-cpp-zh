    #  2.3. Behavior of the Cellular Automaton


    We introduce three types of cells $w \in W$. As conventional cells $w_c \in W_c$
    we will call the cells in which both the mass and momentum conservation laws are
    satisfied. Wall cells $w_w \in W_w$ are the cells in which the mass conservation
    law can be violated. And, at, source cells $w_s \in W_s$ are the cells in which
    both the mass conservation and the law of momentum can be violated. Sets of conventional
    cells $W_c \cap W_w = \varnothing, W_c \cap W_s = \varnothing, W_w \cap W_s =
    \varnothing$. These sets coincide with a set of all automaton cells $(W_c \cup
    W_w \cup W_s = W)$. The behavior of walls and sources specifies the boundary conditions
    of cellular automaton.


    In the FHP-model, the cellular automaton with a synchronous operation is used.
    On each cycle, there is a replacement of $s(t)$ in all cells by $s(t+1) = \delta(s(t))$,
    where $\delta s$ is the next-state function of elementary FSM A. The cellular
    automaton, then, changes its global state $\sigma(t)$ by a new global state $\sigma(t+1)$.


    Each cycle of the cellular automaton processing has two phases: propagation and
    collision. So, the next-state function of elementary FSM consists of a composition
    of functions $\delta_1$ and collision $\delta_2$:


    ```

    $\delta(s) = \delta_2(\delta_1(s)),$$

    ```


    Each of $\delta_1$ and $\delta_2$ satisfies the laws of mass conservation


    ```

    $$\sum_{w \in W} \sum_{i=1}^b \delta_j(s_i(w)) = \sum_{w \in W} \sum_{i=1}^b s_i(w),
    j \in {1, 2\},$$

    ```


    and momentum


    ```

    $$\sum_{w \in W} \sum_{i=1}^b \delta_j(s_i(w)c_i(w)) = \sum_{w \in W} \sum_{i=1}^b
    s_i(w)c_i(w), j \in {1, 2\},$$

    ```


    In accordance with the fluid flow dynamics, the presence of these two phases is
    interpreted as follows. Collisions implement diffusion in fluids, and propagation
    matters for the transport process in a flow. These two phases are featured explicitly.:'
