    pipeline parallelism can act as great parallelism multiplier.


    # 9. Pipeline Parallelism


    # 9.1. Pipeline Execution Pattern


    Pipeline execution pattern is a recurrent execution configuration in many application
    domains involving stream processing such as digital signal processing, video encoding
    or data compression. Pipeline execution pattern follows a consumer/producer scheme
    similar to a production assembly line.'
