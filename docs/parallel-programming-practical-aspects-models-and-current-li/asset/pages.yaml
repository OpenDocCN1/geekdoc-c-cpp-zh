    # 6. Mapping Neural Networks with Global Connections onto Toroidal Computer Systems


    In modern DCS the multidimensional torus [15, 16] is most commonly used as a graph
    of intercomputer connections.


    An all-to-all exchange in the $k$-dimensional torus is reduced to implementation
    of all-to-all exchanges in the torus, i.e., in the structures described by cyclic
    subgroups. In group the rings are performed as shown in Figure 5.


    Every computer $M_j, j=1,...,n_i, i=1,...,k$ transmits its pixel array to the
    computer $M_{(j-1)mod n_i}, j=1,...,n_i;$ and receives an array from the computer
    $M_{(j+1)mod n_i}, j=1,...,n_i.$ It is assumed that the links of the ring are
    operated simultaneously.


    These steps continue until each computer of the ring receives all pixels distributed
    over the computers. The exchanges are executed in parallel for all the rings of
    dimension $i$ and successively across dimensions $i=1,2,...,k$. For a two-dimensional
    torus (Fig. 2), the exchanges, for example, can be executed in parallel in all
    horizontal rings, and then in parallel all the vertical rings.


    Upon completion of the $l$-th step of an exchange, $l \in 1,2,...,k$, each computer
    produces $N_n^l \prod_{i=1}^l n_i$ data elements, and after $k$ steps, it connects
    $N$ elements, respectively, by


    \prod_{i=1}^k n_i = n$. The time of performing $l$ exchange steps is


    ```

    $T_i(l) = \frac{N}{n} [(n_i-1) + \sum_{i=2}^{l-1}(n_i-1)\prod_{j=1}^{i-1} t_w].
    \quad (28)$

    ```'
