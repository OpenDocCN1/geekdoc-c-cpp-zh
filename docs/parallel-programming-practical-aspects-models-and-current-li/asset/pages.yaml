    where $t(rank)$ is the total collision runtime at the cells where $i_s(rank) \le
    i < i_g(rank)$, $(0 \le rank < p-1)$. This efficiency indicates only the load
    imbalance, not including the communication overhead.


    Figure 7 shows the parallelization efficiency of the program with the communication
    overhead (averaged over 100 iterations): $eff = t_1 / t_p$, where $t_1$ is the
    executive time of the program on one core, $t_p$ is the executive time of the
    program on $p$ cores. Due to the fact that the array size $I$ is proportional
    to the number of cores $p$, factor $p$ in the denominator is missing.


    Analysis of Figure 6 and Figure 7 leads to the following conclusions:


    +   1. Without balancing the execution time is, greater than with balancing.

    2. The efficiency remains acceptable for a large number of cores.

    3. With balancing, the loss of dependency on the cores number is logarithmic.

    4. Communications between the cores bring an additional overhead of execution
    time, which is increased with increasing the number of cores.

    5. For a greater number of cores ($p > 2000$), the decrease of performance due
    to communications predominates the decrease generated by the load imbalance. This
    shows the applicability of the diffusion balancing algorithm to any number of
    cores. With the increase of the cores, the share of losses due to the imbalance
    is reduced and the share of communication losses is increased.


