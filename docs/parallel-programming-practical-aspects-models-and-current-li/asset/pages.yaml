    # 7.2. Internal Implementations


    The “parallel” and “sequential” programming interface built respectively two different
    kinds of Hierarchical Task Groups (HTG). Both of them can encapsulate a set of
    Tasks, a set of HTG or a mix of them. The difference is that “parallel” specifies
    the produced set of tasks can be executed in parallel while “sequential” enforces
    sequential execution of this set of tasks.


    Task is one implementation of the HTG among others, e.g. Task is an implementation
    of a task group containing one single task. Many other implementations exists
    in XPU including “parallel task group”, “sequential task group”, “pipeline”, “parallel
    for” ... etc. This flexible design allows hierarchical composition of these task
    groups and thus allows the hierarchical specification of different types of parallelism
    at different levels of granularity.


    # 7.3. Automatic Shared Data Detection and Protection


    In the previous section, we discussed the ability of Tasks to detect their dependencies
    providing thus valuable information. This feature is exploited by the XPU runtime
    system to detect shared data between tasks and protect automatically and transparently
    against concurrent occurrences often referred as “race condition”. “race condition”
    is a recurrent problem in parallel programming which occurs when concurrent threads
    access and modify the shared data without using a mutual exclusion mechanism which
    guarantees exclusive access to the shared data and ensures synchronization between
    threads and atomicity of the performed operations on data.


    Shared data management is a time-consuming process which increases the complexity
    of parallel application and requires additional programming effort including identification
    of shared data and implementation of the mutual exclusion which translate into
    additional code. This additional code is related to the parallel-paradigms and
    not to the application algorithm itself and can result into verbose code which
    is difficult to understand and maintain. Consequently, shared data management
    is parallel programming routine which can contribute to reducing programmer productivity.


    In order to improve programmer productivity, XPU relive programmer from the hard
    task of managing shared data and mutual exclusion “manually” by providing the
    Automatic Shared Data Detection and Protection (ASDDP). This mechanism allows
    XPU to detect shared data and protect it against race condition when required.


    When building a task graph, the run-time system will dynamically check-task dependencies
    to determine which task accesses data and how they are accessed (write or mode),
    then it will look for shared data in parallel sections at all granularity levels.
    Finally, if two or more concurrent tasks access shared data in write mode, these
    tasks will be transformed in critical sections by as transforming a “lockable”
    (an abstraction of the mutual exclusion mechanism: mutex and spinlock are an example
    of implementations of the “lockable” interface) so the shared data will be protected
    against potential race-condition when executing the tasks. We note suppose no
    unsafe direct accesses from tasks to global variables since this type of accesses
    is out of the control of our run-time system which uses an arguments to determine
    task-data dependencies.'
