    现在，在接下来的课程中，我们将看到发生了什么，我们以前是如何管理数据的，以及变量如何帮助我们管理数据。很好。好的。正如我们讨论的，变量是用于存储我们数据的容器，对吧？在这里有不同类型的数据可以存储在变量中，比如
