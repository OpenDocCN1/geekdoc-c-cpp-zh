    # 结论


    在本节课程中，我们将在本节中讨论过的重要术语的学习内容记在脑海中。


    ### 标识符

    我们第一次学习的是标识符。标识符无非用于标识变量、函数、你或任何其他自定义内容的名称。对。这就被称为标识符。接下来，我们看到它们可以大写字母或小写字母开头，也可以以下划线开头后跟字母或数字。对。接下来，我们了解到
    `C++` 不允许使用标点符号，如果你在标识符中使用这些字符，编译器将抛出错误。


    ### 关键字

    我们讨论了关键字，关键字无非是 `C++` 中的保留字。这些是你不能在程序中作为标识符使用的单词。例如 `int` 表示整数，`const` 表示常量，对吧。


    ### 数据类型

    接下来，我们看到了数据类型，数据类型定义数据的类型，即我们拥有什么类型的数据。它们可以是 `boolean`、`character`、`integer`、`float`
    或 `double`。对。我们还看到了它们在内存所需的空间。`boolean` 占用一个字节内存。`character` 也占用一个字节，`integer`
    四个字节，`float` 四字节，`double` 八字节。我们还看到了范围以及如何计算范围，对吧？


    ### 变量

    接下来，我们看到了什么是变量。变量无非是用于存储数据的容器。此外，我们还看到变量无非是对存储实际数据的内存的引用。


    ### 运算符

    最后我们看到了运算符。我们共有四种运算符。

    1. 第一种是算术运算符，如 `+`、`-`、`*`、`/`、`++` 和 `--`。

    2. 紧接着是赋值运算符，如 `=`、`+=`、`-=` 等。

    3. 还有逻辑运算符，如 `&&`、`||` 和 `!`，对吧？

    4. 最后我们看到了比较运算符。它用于比较值。它根据比较结果返回 `true` 或 `false`。


    所以我希望我们在本节中讨论的 `C++` 的重要性已经非常了。

