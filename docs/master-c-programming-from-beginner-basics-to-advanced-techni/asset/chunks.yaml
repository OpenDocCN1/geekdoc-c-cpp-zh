    # C++ 编程语言中的运算符


    在这节课程中，我们将学习运算符，为了理解运算符，让我给你举一个例子。在上一节课程中，我们已经看到变量是什么，本质上是内存位置的引用，实际数据以 0 和 1
    的形式存储在该位置中。没错。所以，如果我们想对存储在内存中的这些数据执行某些操作，我们就会使用运算符，以便更好地理解。让我给你举一个例子。在这里，我们存储了一门学科的成绩，标记为
    marks1，这个变量是整数类型，并被初始化为 90。


    同样地，我们创建了下一个变量 `Mark2` 来存储第二门学科的成绩。没错。这一个也是整数类型。而且这个变量现在被初始化为值 39。我们想对这些数据执行某些操作。该操作是计算百分比。现在计算百分比的公式非常简单。将
    marks1 除以总分 200，然后执行操作并存储结果。


    我们创建了另一个变量 `percentage`，因为在计算百分比时，我们可能会遇到小数值。因此，我们创建了一个浮点型变量 `percentage`。之后，我们计算
    `marks1 加上 marks2，除以总分 200`，并将结果存回 `percentage` 变量中。现在让我问你一个问题：在这个陈述中，使用了多少个运算符？你的选项是二、三和四。所以正确答案是一、二、三，即乘法，以及四。这一个也是运算符，即赋值运算符。


