    标准库。它包含了各种数据结构、算法和函数，可以节省你的时间和精力的。我们可以以排序举例；我们将在数据结构部分详细介绍所有这些内容。`STL` 框架。这是一个包含许多库的框架，可以帮助你开发
    GUI 应用程序。是的，在课程结束时，我们还会查看 `Qt`。


    现在让我们聊聊 `C++` 的其他优势。


    ### 教育基础

    学习 `C++` 将为编程概念、语法编写提供提供坚实的基础，并使以后学习其他编程语言变得容易。因此，通过学习 `C++`，你不会只局限于 `C++`；所有的基础知识在其他地方同样适用。


    ### 社区与资源

    `C++` 有一个庞大且活跃的社区可以帮助你的学习之旅。因此，每当你遇到任何错误或问题时，网上一定有充足的支持和资源可用。


    ### 可迁移技能

    通过学习 `C++` 获得的技能，例如解决问题和面向对象编程概念（我们将在 `OOP` 部分讨论的 `OOP` 概念），所有这些概念都可以迁移到其他编程语言中。通过学习
    `C++`，你学习其他编程语言的历程将变得非常非常简单。


    ### 高需求技能

    `C++` 的魅力永远不会消失。正如我们在系统编程中讨论的，它被广泛用于嵌入式系统中创建智能设备和 `IoT`。它被广泛且大量使用。此外，在游戏开发中，无论我们谈论
    `Unreal Engine` 还是 `Unity Engine`，`C++` 都在那里。此外，如果你想创建开发项目，仍然可以使用这些 `Unity` 和
    `Unreal` 游戏引擎，并在 `C++` 的帮助下创建这些产品。


    所以我希望通过这次讲座，让你 100% 清楚我们为什么要学习 `C++`。我希望你在整个讲座过程中保持热情，因为我们在旅程中将创建和开发各种项目。所以我希望这次讲座对你来说非常清楚。感谢观看。


    # 什么是编译器和 IDE


    现在在接这些节座中，我们将讨论什么是编译器、为什么我们需要编译器，以及编译器如何帮助 `C++` 编程？之后，我们将讨论 `IDE`，即集成开发环境。现在，让我们直接开始节座，不再多说废话。


    让我们通过一个例子来理解编译器。假设你正在前往一个非英语国家国家，比如中国或俄罗斯。当你到达这个国家的机场时，你会发现一个我们称为移民官员的人。现在，这个人向你问了一些问题，而你无法听懂。这是一个挑战，对吧？你可能会处于恐慌状态，但这时救星出现了：这位移民官员拿出一个设备，对着它说了一些话，然后展示给你看。基本上，他正在使用一种语言翻译器。


    工作原理：移民官员将用他的语言说话，假设是俄语。他提供输入，而这个翻译器生成英语输出。从这个例子中，我们了解到，如果没有这个语言翻译器，移民官员和旅行者都无法互相理解。同样，如果我们想给计算机发送某些指令，我们可以使用编译器。


    工作原理：假设你用你的母语言（比如英语）编写代码或指令，并将这些代码或指令交给编译器。现在，这个编译器会将代码或指令转换为机器码。我们知道机器理解 0 和
    1。


    ### 编译器的正式定义

    编译器的正式定义是：它是一个系统工具，将用 `C++` 编程语言编写的人类读代码转换为可以在计算机上直接执行的机器码。


    通过此，我希望编译器是什么以及我们为什么需要编译器对你来说已经清楚了。现在让我们聊 `IDE`（集成开发环境）。


    # 什么是 IDE？


    在深入研究 `IDE` 的确切含义之前，让我们来看一个非常简单的例子。我们一定在家里见过这种工具箱。它为我们的各种杂务家居活动提供了所有基本工具，比如拧螺丝或修理花园里坏掉的栅栏。工具箱里的所有工具都是随手可用的。同样，在编程中，我们也使用
    `IDE`，它是一个集成开发环境，提供了所有必要的工具，使我们的开发过程顺畅且高效。它提供了开发人员顺利、高效地创建软件所需的所有工具。


    ### IDE 中的工具

    1. **代码编辑器**：你有一个特殊的区域，可以在其中编写代码，就像你在写一个故事一样。

    2. **错误检查器**：当我们编写代码时，`IDE` 会检查错误并对可能不太对的地方画下划线。这就像有一个朋友在你写故事时帮助你发现拼写错误一样。

    3. **自动建议建议**：`IDE` 还会在你编写代码时通过建议各种关键词来帮助你。

    4. **构建与运行**：一旦你准备好代码，`IDE` 就可以神奇地将你的 `C++` 代码转换为计算机能理解的程序。我们知道这在编译器的帮助下发生；它也有一个编译器。

    5. **修复错误**：有时你的程序可能运行得并不完美。`IDE` 通过建议修复方法来帮助你找到问题可能所在。

    6. **输出**：当你的程序准备好后，`IDE` 向你展示你的程序的样子。


    如果这些事情现在听起来没意义请不要担心；这完全正常。我们将在接下来的节座中使用这些工具。我希望这次关于编译器和 `IDEs` 的讲座对你来说非常清楚。

