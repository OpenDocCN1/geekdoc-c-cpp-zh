    # RAM - 随机访问存储器


    如果你的内存不够用，那么它的内存地址就比 `16` 位的 `RAM` 少。现在在这些内存地址上，你可以像这个文件放入你的数据，然后加载到 `ram` 中的数据会被放入这些不同的内存块中。因此，根据文件的大小，可能会占用不同数量的内存块。`1
    MB`的文件占用的空间或内存块较少，而`20 MB`或更大的文件会占用更多。


    现在，接下来，假设你想运行一个位于硬盘上的程序，为了运行它，你需要双击它。于是，你将双击这个程序。然后该程序将加载到 `lab` 中。我们知道为什么需要将程序加载到
    `RAM` 中，因为这样处理器就可以更快地对其进行处理或计算。所以当程序被加载到 `RAM` 时，它就会被处理。这是你需要记住的最重要的一点：处于学习状态的程序在加载到
    `ram` 时，它就会变成一个进程。所以你的程序将加载到 `ram` 中。它看起来可能是这样。它会占用一些内存。


    假设它占用了从 `10` 到 `100` 的内存地址。不，你的控制单元会逐个将这些地址上的数据提取到 `ACLU` 进行处理，处理后，它会将数据返回 `red`。这样，控制单元就会提取内存中的数据块并交给
    `alien` 进行处理。它可以获取任何数据，意味着它可以访问任何内存地址块。这就是为什么它被称为 `random`（随机）。它可以随机访问任何内存块。假设正在运行的进程想要执行某个任务，比如它想与网络通信，想发送一些数据包。


    为了完成这项任务，假设内存地址 `72` 处存储有一个命令或指令。那么控制单元将访问该内存块，获取该数据并放入 `end use` 进行处理。处理后，它会将其放回。这样，控制单元就会访问或随机访问你的
    `land` 来执行计算。不，我认为你已经理解了这个概念，即需要 `random access memory`（随机访问存储器），这是我过的最重要的概念。


    很多学生在这方面很落后，所以我希望你理解它。好了，现在我们已经看到了为什么我们需要 `RAM` 以及为什么它被称为 `random access memory`。现在，让我们来看看关于
    `RAM` 的更多几个概念。


    ## RAM 的特性


    第一点用于存储当前正由 `C.P.U` 处理的数据，这是我们已经过的，它存储需要由 `CPU` 处理的数据。第二点是 `RAM` 具有易失性。这意味着什么？意味着
    `RAM` 不是数据的永久存储。


    当没有电源时，`RAM` 会丢失数据。这是因为 `RAM` 由 `-` 组成，它们需要持续的电来保持存储在其中的数据。这就是为什么 `crime` 是易失性的。如果你关闭笔记本电脑或台式电脑，你将无法访问之前运行的数据或程序。这是因为
    `crime` 是易失性的。它需要持续的电。否则，`RAM` 中的电容器将失去电荷，其数据也将丢失。


    ## RAM 的类型


    接下来，我们有两种类型的数据，即 `data`，让我们先看 `data`。`data` 是动态的，与计算机时钟是异步的。你的计算机或处理器按时钟周期运行，这意味着它会为运行在你计算机上的每个进程分配特定的时间。现在，这种异步意味着，如果处理器不能与
    `Iran` 良好协调，它就无法与 `rain` 协调。那么处理器在 `ramp` 上为了获取数据和存数据而进行的读写操作将会很慢。


    但在同步动态的情况下，它与计算机时钟同步。这意味着如果处理器与 `Iran` 良好工作，它将以良好的协调方式工作。那么读写操作将得到驱动并变得更快。所以它会更快。这就是为什么我们现在使用它作为
    `data`。


    ## 虚拟内存


    下一点是在硬盘上创建一个作为 `virtual memory`（虚拟内存）的 `webspace`。它的 `virtual memory` 是 `physical
    memory`（物理内存）的替代品。这个 `physical memory` 本身什么。但是，这句话的意思是什么？让我们通过这张图来理解，这句话意味着我们在
    `hard` 上创建了一些 `virtual memory`。这就是我们正在创建的 `virtual memory`。而这个 `virtual memory`
    充当了真实的 `physical memory` 的替代品。当我们这样做时，为什么要从 `days` 中留出一些可以供使用的空间呢？


    这是因为你的计算机有时会内存不足。假设你正在 `windows` 上运行 `Windows 10`，同时你还在运行一个浏览器。单是 `Windows 10`
    就能占用你朋友的照片。而这个浏览器，假设我们下载了你朋友中的一个。但你只有四个朋友。但是你怎么可能在 `FUJIMURA` 上运行大约 `5 GB` 的数据呢，你不觉得这里有猫端吗？猫端在于我们正在留出一些可以供使用的空间。


