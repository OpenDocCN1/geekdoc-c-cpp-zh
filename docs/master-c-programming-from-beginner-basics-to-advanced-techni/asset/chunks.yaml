    # 为什么选择 C++？


    假设我们想要开发软件。每当我们开发软件时，并不是像写文章那样连续地写完并开发。我们需要识别许多不同的特性，并将软件拆分为各种特性和功能点，例如 `feature
    one`、`feature two`、`feature three` 等。假设我们分配了 `feature one`；那么开发者 `D1` 将负责这个特性，开发者
    `D2` 将负责下一个，之后我们可以将它们合并为一个功能。


    通过这种方式，我们在软件中创建了各种功能。但挑战在于，起初将软件拆分为如 `feature one` 和 `feature two` 这样的特性，稍后再将这些特性结合在一起是非常困难的。在
    `C` 语言中很难做到。`C++` 的开发者识别出了这个问题，并在 `C++` 中引入了一个新概念，即 `OOP`。他们引入了一种全新的编程方式，一种基本上编写代码的新方法。


    在 `OOP` 的帮助下，开发这些特性并在以后将它们组合变得更容易了。我们将在 `OOP` 部分讨论 `OOP` 的细节。但目前，我们可以得出结论：在 `OOP`
    的帮助下，我们能够编写模块化的代码。我们可以一个模块模块地创建或编写代码，随后将这些模块组合成功能。


    # 第二个挑战：数据结构


    第二个挑战是，在 `C` 语言中我们必须从零开始编写一切。每当我们创建软件时，都会使用各种数据结构。数据结构无非我们存储数据的方式。根据我们的需求和要求，我们必须使用那些数据结构。但在
    `C` 语言中，我们没有这些东西；我们必须从零创建它们并为一切编写逻辑。


    在 `C++` 中，开发者添加了一个名为 `STL`（标准模板库）的丰富库，它包含了软件行业中高度使用的所有数据结构以及排序、搜索等算法。这类算法和数据结构已经被添加到
    `C++` 中，我们可以直接使用它们。这就像“即插即用”，它让开发者的生活变得简单得多。从这两点来看，我们可以得出结论：`C++` 的开发者试图让软件开发者的生活变得轻松。


    # C++ 的正式定义


    让我们来看看 `C++` 的正式定义以及它是谁开发的。`C++` 由 Bjarne Stroustrup 及其团队于 1980 年在贝尔实验室（Bell Labs）创建并开发。基本上，`C++`
    是对传统旧 `C` 编程语言的扩展，增加了各种高级特性，如面向对象编程 (`OOP`）和 `STL`（标准模板库），其中包含了各种让开发者生活变得超级简单的的数据结构和算法。


    接下来，`C++` 是一门高级语言，它是为了通用编程而开发的。正如我所说，它的开发是为了让开发者的生活变得简单。我们将在下一张幻灯片查看什么是高级语言。此外，`C++`
    是一种编译语言。我希望这段介绍能清晰地解释 `C++` 是什么以及它为什么出现。


    # 高级语言 vs 低级语言


    让我们看看为什么 `C++` 被称为高级语言。在此之前，我们需要了解低级语言，如果不理解低级语言，我们就无法理解为什么 `C++` 是一门高级语言。


    让我给你们展示一个低级语言的例子。我不确定你们有多少人做过微处理器编程，所以让我们举个简单的例子：假设我们想执行操作 `3 + 6 - 5`。为了通过低级语言完成这一操作，我将使用
    `assembly`（汇编）语言。


    在低级语言中我们需要做的第一件事是将数据存储到寄存器中。`R1` 和 `R2` 是寄存器，是我们可以存储数据的内存块。假设我将 `3` 存储在 `R1`，将
    `6` 存储在 `R2`。现在，我们要对 `R1` 和 `R2` 执行加法并将结果存储在 `R0` 中。它会执行 `3 + 6`并将结果存在 `R0`。接着，它会对
    `R0` 执行减法；它将减去 `5` 并再次将结果存在 `R0`。`9 - 5 = 4`。这就是我们进行低级编程的方式。


    你可以理解这有多困难。如果你想为这个简单的程序创建一个复杂的软件，我们已经写了七八行代码。你可以想象在低级语言中开发复杂软件会有多困难。然而，低级语言的优点是它可以给你完全的控制权，而且它是快速的，因为我们直接与内存和寄存器交互。与高级语言相比，它快得多。


    另一方面，高级语言如何执行这个操作呢？它会简单地创建一个变量。现在不用担心代码；我们只需要理解基本的区别。目前，我们只是简单地创建一个变量 `x`。变量只是我们存储数据的地方。我们正在执行一个像
    `3 + 6 - 5` 的简单操作并将结果存储到 `x` 中。你可以看到这有多简单。痛点在于我们无法控制想将其存储在哪里，但如果我们正在开发复杂软件，这完全没有问题。这就是高级语言的优势：它为开发者消除了复杂性。


