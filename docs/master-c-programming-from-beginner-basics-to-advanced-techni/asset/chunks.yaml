    \ other benefits that we will get after learning this popular `C++` programming\
    \ language. Let's start this lecture without any further ado.\n\n### 1. Versatility\n\
    The first advantage of learning `C++` is that it is a versatile programming language.\
    \ Versatile means that it can be used for a wide range of applications, such as:\n\
    - System programming\n- Game development\n- Embedded systems\n- Scientific computing\n\
    \n#### System Programming vs. Application Software\nBefore diving into system\
    \ programming, we need to understand there are two types of software:\n1. **System\
    \ Software**: Examples include drivers. When you plug in a pen drive or keyboard\
    \ into a `USB` port, these are hardware components. Whenever you insert them,\
    \ the computer detects them so you can use them. This happens due to the drivers.\
    \ Similarly, if you buy a printer or scanner, you need to install software to\
    \ help print or connect the device to your computer.\n2. **Application Software**:\
    \ Examples include `MySQL`, `MS PowerPoint`, and PDF readers.\n\nWith the help\
    \ of `C++`, we do system programming, meaning we develop system software. `C++`\
    \ has a major stake when it comes to system software development.\n\n#### Why\
    \ is C++ used for System Programming?\nThis is because `C++` is close to hardware.\
    \ Consider this hierarchy:\n- Hardware (Bottom)\n- Assembly language\n- Low-level\
    \ language\n- High-level language (Top)\n\nLanguages close to hardware, like assembly\
    \ language, are faster than high-level languages. While `C++` falls under the\
    \ high-level category, it sits at a lower position compared to languages like\
    \ `Python` or `Java`. Hence, it is faster than those languages. \n\n#### Game\
    \ Development\n`C++` is widely used in game development. We have two major engines:\n\
    - **Unity**: Uses `C-sharp` (similar to `C++`, developed by Microsoft).\n- **Unreal\
    \ Engine**: Uses `C++`.\nIf we learn `C++`, we can get our hands dirty in game\
    \ development.\n\n#### Embedded Systems\n`C++` is \"king\" here. When it comes\
    \ to embedded programming, there is no competition for `C++` because it is close\
    \ to hardware. In embedded systems, we purely work on hardware and need things\
    \ to work fast; `C++` is best for that.\n\n#### Scientific Computing\nWe also\
    \ use `C++` to solve complex mathematical problems in scientific computing.\n\n\
    ### 2. Performance\nAs discussed, `C++` is close to hardware, which allows low-level\
    \ memory manipulation and offers high performance. This makes it perfectly suitable\
    \ for resource-intensive tasks requiring intensive computation. \n\n**Summary**:\
    \ `C++` allows low-level memory manipulation and offers high performance due to\
    \ its closeness to hardware, making it suitable for resource-intensive tasks.\n\
    \n### 3. Object-Oriented Programming (OOP)\n`C++` supports `OOP` principles which\
    \ help you design modular, maintainable, and reusable code. \nIf you work in a\
    \ team using a language that does not support `OOP`, you cannot develop code in\
    \ a modular way (module by module). This makes it difficult to divide tasks among\
    \ team members who each work on different features that are later combined into\
    \ a single functionality.\n\n**Summary**: `C++` supports `OOP` principles that\
    \ help in designing modular, maintainable, and reusable code.\n\n### 4. Compatibility\n\
    `C++` is widely used and supports different platforms and operating systems. This\
    \ makes it a valuable skill for cross-platform development. We can create applications\
    \ for any operating system or platform.\n\n**Summary**: `C++` is widely used and\
    \ supports across different platforms and `OS`, making it a valuable skill for\
    \ cross-platform development.\n\n### 5. Standard Library\n`C++` provides a robust\
    \ standard library that includes a variety of data structures, algorithms, and\
    \ functions. \n- **Data Structure**: structuring data such that processing becomes\
    \ easier.\n- These libraries are already created by `C++` developers; we just\
    \ have to import them, saving time and effort. For example, if we need to sort\
    \ elements, we don't have to write the logic; we just use the existing function.\n\
    \n**Summary**: `C++` provides robust standard libraries.\n"
