    这是计算机基础课程的第一部分。在这一节中，我们将讨论计算机的基础知识，并尝试将从计算机基础到编程的各个联系起来。对于完全初学者来说，这一部分是必修的。因此，请务确保你充分理解这一部分，因为它将为你奠定坚实的计算机基础。现在，让我们来看看这一节的思维导图。这就是我们将遵循的计算机基础学习思维导图。


    我们将从什么是计算机开始。之后，我们将学习计算机架构。接下来，我们将看到硬件，它是计算机最重要的组件。然后是 `C.P.U`。之后是计算机语言，最后我们将看到操作系统或
    BIOS，所以有很多东西要学，并且要学会实践。让我们开始这一节吧。


    # 什么是计算机？


    在本节课程中，我们将学习计算机。现在让我问你们一个问题：什么是计算机？现在，当我问这个问题时，你们中的很多人可能在想计算机是一台纤薄、时尚的笔记本电脑或台式机，但事实并非如此。计算机是一种执行计算的设备。计算意味着运算。因此，计算机是一种存储和处理数据并执行计算的设备。


    现在，所有能够存储和处理数据的设备都称为计算机。无论我们谈论的是计算器、移动平板电脑、你的智能电视、你的智能手表等等……我们所有的计算机。我知道你们中很多人可能在想，我用笔记本电脑或旁边的电脑看电影、玩游戏或浏览网页，那么我是如何使用计算机的计算能力的呢？亲爱的学生们，这是因为我们计算机的计算能力已经内置在这些应用程序中了。


    这些应用程序通过在计算机上执行某种计算来运行，而这些计算是由处理组件完成的。这个处理器就是执行所有这些计算的。在这些计算的帮助下，所有的应用程序得以运行。所以我我希望这节课是相当清晰且有趣的。


    # 计算机架构


    在本节课程中，我们将学习计算机架构。让我们从定义开始。计算机架构的正式定义是：它是描述计算机系统功能、组织和实现的规则和方法的集合。现在，让我们通过一个例子来理解这个定义。让我们以房子为例。这就是一栋房子的架构。这栋房子有车库、客厅、卧室、休息室、厕所、厨房等许多。这些都是房子的各种组件。


    每个组件都有某些功能，并以某种方式组织在一起。我们不能把车库放在房子的顶上。你知道的，在二楼造车库是没有意义的。对吧。同样，在计算机系统中，我们有各种组件，如输入设备、输出设备、`CPU`、内存和硬盘。所有这些组件都有各种功能，并以某种方式实现，以便它们能够正常运行和协调以执行特定的任务。现在，让我们看到更多关于计算机架构的内容。


    让我们从输入设备开始。输入设备用于向计算机提供输入。用户控制着输入设备。像`键盘`和`鼠标`这样的输入设备用于由用户提供输入。你可以通过这个例子来理解，比如你想运行某个应用程序。这时你通过`鼠标`双击它，程序就会开始运行。现在，如果程序要求你输入某些登录凭据，你就通过`键盘`输入那些登录凭据。


    所以，你再次提供了输入。下一个组件是输出设备。用于向用户产生输出的设备被称为输出设备，如`显示器`和`打印机`。很简单，对吧？接下来的组件是内存，这里的内存指的是
    `ram`，`ram` 意味着随机存存储器。我们将在接后的课程中查看它的细节。目前，`RAM`是一种用于临时存储设备的内存，以便中央处理器或 `CPU` 能够轻松访问它来计算或处理这些文件。


    现在，这个 `RAM` 有各种尺寸，如 `4 GB`、`8 GB` 和 `16 GB`。尺寸越大，你在这个内存中存储的程序、进程或文件就越多。接下来是 `C.P.U`。即中央处理器。它处理数据。`RAM`
    中的可用数据被 `CPU` 处理器提取并进行处理。你可以参考 `CPU` 的例子，比如 `i3`、`i5` 和 `i7`。显然，`CPU` 有两个部分。`ALU`
    是一个算术逻辑单元，而另一个是控制单元。


    首先，让我们看看这里。`ALU` 用于执行算术或逻辑操作，如加、减、乘、除、小于、大于所有这些操作实际上都是由 `CPU` 中的 `ALU` 执行的。现在，我们系统中的第二个组件是控制单元，顾名思，它控制各种操作。它控制或引导进程的操作执行。这意味着它直接处理当前需要处理的指令。


    第二点是，它控制 `CPU` 和其他资源之间的数据流，这意味着它控制了进入 `CPU` 进行处理的数据流。以及已经处理过并需要放回内存的数据由控制单元控制。这意味着它也是一个资源管理器。所以我希望这个计算机架构的概念，以及各种组件如何运作对你来说是清晰的。在接后的课程中，我们将学习
    `CPU` 和 `RAM`。


    # RAM - 随机存存储器


    在本节课程中，我们将学习它们。即随机存存储器。当我们谈论计算机架构时，“内存”位于这里。它靠近中央处理器。现在问题出现了，它为什么要靠近中央处理器呢？情况是，假设你有一个文件在硬盘里。你知道的，这个硬盘是一个光驱器。像这样，它有一个从我们的磁盘读取数据的点。这种光驱器的问题在于它们非常慢，但你的处理器的速度远快于它的读取能力。


    所以问题在于，处理器能够非常快速地处理数据，但硬盘无法以那种速度提供数据。它无法匹配处理速度。因此，我们需要一种中间内存，一种离处理器更近的内存，并且以比硬盘快得多的速度为处理器提供数据。此时
    `RAM` 的出现就派了用场`Ram` 从硬盘中提取文件并加载到 `ram` 中，并在处理器需要处理该文件时告知它。


    这种从 `RAM` 提取文件的过程比我们直接从硬盘提取要快得多。这就是我们创建它们的原因。现在，让我们看看计算机的内存看起来是什么样子的。`ram` 看起来是这样的。这是
    `RAM` 的物理外观。但在内部或逻辑上，`RAM` 是这样的。它是一个可以让你存储数据的内存地址集合。所以这就是一个内存地址。这是另一个内存地址。以这种方式，取决于你“朋友”的大小，会有很多内存地址。


