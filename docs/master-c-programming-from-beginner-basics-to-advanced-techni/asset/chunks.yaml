    # What is a Computer?


    In this lecture, we are going to see computers. Now let me ask you a question:
    what is a computer? Now, when I ask you this question, many of you might be thinking
    that a computer is a slim, sleek laptop or desktop, but this is not the case.
    A computer is a device that is capable of performing computation. Computation
    means calculation. So a computer is a device that stores and processes data, but
    performs calculations.


    Now, all the devices that are capable of storing and processing the data are called
    computers. Whether we talk about calculators, mobile tablets, your smart television,
    your smartwatch, etc.. All our computers. I know many of you might be thinking
    that I use my laptop or next door to watch movies, play games or browse the Internet,
    then how I am using the computation ability of my computer. So my dear student,
    this is because the computation ability of our computer is baked into these applications.


    These applications are running by performing some kind of calculations onto the
    computer, and these calculations are done by a component that is processing. This
    processor is the one which is performing all these calculations. And with the
    help of these calculations, this all applications are running. So I hope this
    lecture is pretty clear and exciting.


    # Computer Architecture


    In this lecture, we are going to see computer architecture. So let''s start with
    the definition. The formal definition of computer architecture that sees it is
    a set of rules and methods that describe the functionality, organization and implementation
    of computer systems. Now, let''s understand this definition with the help of an
    example. So let''s take an example of this house. So this is the architecture
    of a house. This house has a garage, living room, bedroom, rest, restroom, kitchen
    and lots of things. So these are various components of the house.


    Each component has some functionality and they are organized in some manner. We
    can''t put this garage onto the top of the house. You know, there is no point
    in making a garage on the second floor. Right. So similarly, in computer systems,
    we have various components like input device, output device, `CPU`, memory, and
    hard disk. All these have various functionalities and they are implemented in
    some manner so that they can function and coordinate properly in order to perform
    a particular task. Right now, let''s see more about this computer architecture.


    Let''s start with the input device. Input device is used to provide input to the
    computer. The user is controlling the input device. The input devices like `keyboard`
    and `mouse` are used to provide input by the user. You can understand it with
    the help of this example, like you want to run some application. So with the help
    of a `mouse`, you double click on it and the program will start running. Now,
    if the program asks you to enter some login credentials, then you type those login
    credentials with the help of a `keyboard`.


    So again, you are providing input. Now the next component is output devices. The
    devices that are used to produce offshore output to the users are called output
    devices like `monitor` and `printer`. Simple, right? Now, the next component is
    memory here, the memory refers to the `ram` `ram` means random access memory.
    We will see details of it in upcoming lectures for now. `RAM` is a memory that
    is used to temporarily store a device so that it could be easily accessed by the
    central processor or the `CPU` in order to compute or to process these files.


    Now this `RAM` comes in various sizes like `4 GB`, `HGV` and `16 DB`. The larger
    the size, the more programs or processes of files you can store in this room right
    now. Next is `C.P.U`. That is the Central Processing Unit. It processes the data.
    The data that is available in the `RAM` is taken by the `CPU` processor and Redenbach.
    You can take the example of `CPU`s like `intelli three`, `five` and `seven`. Now,
    obviously, `Bill` is having to come in and see you. `Ayalew` is an automatic and
    logical unit and sees who is controlling it.


    So first, let''s see here. `Ayalew` is used to perform automatic or logical operations
    like `plus` `minus` `multiplication` `division`, `less than` `greater than` all
    these operations that are actually performed by `Ayalew` in the `C.p`. Now, the
    second component in our sleepout is the control unit, as the name suggests, it
    controls various operations. It controls or directs the operations of the process.
    It means it directly processes the `AC` that would need to be processed right
    now.


    The second thing is it controls the flow of data between the `CPU` and other resources,
    which means it controls the flow of data that is taken into the `CPU` for processing.
    And the data that has been processed and needs to be put back into the memory
    is controlled by the control unit. It means it is a resource manager also. So
    I hope this concept of computer architecture, that all the various things work
    and what are the various rules of various components is pretty clear to you in
    upcoming lectures, we are going to see `CPU` and `RAM` in reading. Till then,
    happy learning.


    # RAM - Random Access Memory


    In this lecture, we are going to see them. That is random access memory. If we
    talk about computer architecture, the `room` is located here. It is near the Central
    Processing Unit. Now the question arises why it is close to the central processing
    unit? The thing is, let''s say you are having some tile that is `F` into your
    hard disk. You know, this hard disk is an optical drive. Like this, it is having
    a point that is used to read data from our desk. The problem with such optical
    drives are they are very slow, but your processor process is much faster than
    the reading capacity of your hard disk.


    So the problem is a word processor is able to process the data very fast, but
    the hard disk is not able to provide that data at that speed. It is not able to
    match the speed of processing. So we need an intermediate memory, a memory which
    is much closer to the processor and can provide that data to the processor at
    much higher speed than the hard disk at that point of the time. `Ram`s coming
    to picture `Rand`, take that file from the hard disk and load into the `ram` and
    know when the processor needs that file in order to process it.


    The process that will take the file from the `RAM` at a much higher speed then
