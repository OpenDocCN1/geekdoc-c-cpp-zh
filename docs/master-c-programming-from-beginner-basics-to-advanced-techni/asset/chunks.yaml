    `marks1` 和 `marks2` 执行了操作。最后，我们在 `percentage` 变量中得到了结果。现在让我们总结一下这节课的收获是什么？收获就是运算符被用于对变量所引的值执行操作。


    在变量所引的值上，这些值的意义是什么？因此，通过变量我们知道变量是指向存储某些数据的内存位置。所以我们正在对变量所引的值（即这些数据）执行操作。没错。所以我希望运算符的概念对你来说是非常清晰的。


    # C++ 编程语言中的算术运算符


    在这节课程中，我们将学习运算符的分类，我们将看到各种类型的运算符。没错。首先，让我们从算术运算符开始。这些是最简单的运算符。让我们从这个开始。第一个是运算符
    `+`。它用于两个两个值。简单，对吧？同样，我们有减法运算符 `-` 或减去。它用于从一个值中减去另一个值。没错。接下来是乘法运算符 `*`。它用于求两个数的乘积，比如
    `X` 乘以 `Y`。同样地，我们有除法运算符 `/`。


    现在是模运算符 `%`。它用于寻找余数。例如如果我们做 `4 模 3`，意味着我们正在寻找 `4` 除以 `3` 的余数，这将得到 1 作为余数。现在我们下一个运算符是递增运算符。递增意味着加
    1，比如 `X 加 1`。现在有两种递增。第一个是前递增，第二个是后递增。现在让我们来看看。让我们先理解前递增。


    ### 前递增

    通过这个例子，正如其名所示，前递增意味着我们先递增，然后赋值。假设 `X` 中存储了 `3`，所以我们首先进行递增，没错。我们会先递增，然后 `X` 的值将变成
    4。没错。然后我们通过等等运算符 `=` 为其赋值。这将为 `Y` 赋值值。现在 `Y` 的值变成了 4。没错。


    ### 后递增

    但在后递增的情况下，情况非常不同。正如其名所示，后递增意味着我们在赋值之后进行递增。这就是为什么它被称为后递增。这意味着我们先给 `Y` 赋值，然后增加该值。所以我们首先赋值值
    `3`，然后将 `X` 的值增加到 `4`。你已经看到了两种情况。在第一种情况下，即三递增，`Y` 的值是 4。但在后递增的情况下，`Y` 的值是 `3`。没错。所以我希望你理解前递增和后递增的概念。


