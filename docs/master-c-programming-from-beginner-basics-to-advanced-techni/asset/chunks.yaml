    的速度比以往任何时候都快，如果在缓存中找到数据，我们就看到缓存命中（cache hit）。如果没找到数据，我们就看到缓存未命中（cache miss），对吧？接下来，我们看到了什么是计算机语言。计算机语言是计算机能理解的语言，比如二进制语言。


    我们可以通过操作系统、应用程序和编译器来与计算机进行通信。此外，在接下来的课程中，我们将看到如何通过编译器与计算机通信。最后，我们看到了操作系统。操作系统帮助我们在甚至不知道如何说那种语言的情况下与计算机通信。


