    # 什么是通用编程？


    现在在这一部分，我们将开始一个非常重要且显而易见的问题：什么是编程？为了理解这一点，我们将采用一个非常简单的例子。即我们如何泡咖啡。为了泡咖啡，我们肯定会遵循一些步骤、指令或程序。这些步骤是什么？第一步是煮牛奶。我们将加热牛奶直到变热。接下来，我们将通过向杯中加糖来准备杯子。


    之后，我们将在杯中加入 1 或 2 茶匙咖啡。接下来，我们将热牛奶倒入杯中。最后，我们将搅拌咖啡直到咖啡完全溶解。好，我们就可以享受咖啡了。这些就是我们准备咖啡时要执行的步骤或指令。现在，同样，假设我想执行另一个任务。我想加两个数字，2
    加 3，并且我想在计算机上执行这个任务。现在，假设这台是计算机。


    现在要执行加法，我必须向计算机提供指令。因此我将提供指令。这种向计算机提供指令的过程被称为编程。而这些指令是用某种语言编写的。可以是 C、C++、Java、Python。任何语言都可以。通过我们将要学习的各种语言，我们向计算机提供指令来执行任务。现在，让我们形式化这个定义。


    所以编程向计算机提供指令以执行特定任务的过程。这就是编程。所以我希望编程部分对你来说已经清晰了。现在下一个问题是为什么要编程？我们需要编程做什么？编程允许我们利用计算机的力量来解决问题。例如，假设我们有这台计算机。它只是坐在这里的硬件。现在，如果我们想要执行某项任务，执行某个任务。与其由我自己完成那个任务，我可以做的是将该任务分解为指令。


