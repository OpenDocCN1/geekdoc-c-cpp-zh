    在本讲座中，我们将讨论 `C++` 的优势，以及学习这门流行的 `C++` 编程语言后我们将获得的其他益处。让我们不再多言，直接开始本课程。


    ### 1. 多功能

    学习 `C++` 的第一个优势是它是一种多功能的编程语言。多功能意味着它可以用于广泛的领域，例如：

    - 系统编程

    - 游戏开发

    - 嵌入式系统

    - 科学计算


    #### 系统编程 vs 应用程序软件

    在深入系统编程之前，我们需要了解软件有两种类型：

    1. **系统软件**：示例包括驱动程序。当你将优盘盘或键盘插入 `USB` 端口时，这些都是硬件组件。每当你插入它们时，计算机都会检测到它们以便你使用。这是由于驱动程序的作用。同样，如果你购买了打印机或扫描仪，你需要安装软件来帮助打印或将设备连接到计算机。

    2. **应用程序软件**：示例包括 `MySQL`、`MS PowerPoint` 和 PDF 阅读器。


    通过 `C++`，我们进行系统编程，意味着我们开发系统软件。在系统软件开发方面，`C++` 占据着举足轻重的地位。


    #### 为什么 C++ 用于系统编程？

    这是因为 `C++` 接近硬件。考虑以下层次结构：

    - 硬件（底部）

    - 汇编语言

    - 低级语言

    - 高级语言（顶部）


    接近硬件的语言（如汇编语言）比高级语言更快。虽然 `C++` 属于高级语言类别，但与 `Python` 或 `Java` 等语言相比，它的位置较低。因此，它比这些语言更快。


    #### 游戏开发

    `C++` 被广泛游戏开发。我们有两个主要的引擎：

    - **Unity**：使用 `C-sharp`（与 `C++` 类似，由微软开发）。

    - **虚幻引擎 (Unreal Engine)**：使用 `C++`。

    学习了 `C++`，就可以上手游戏开发。


    #### 嵌入式系统

    `C++` 在这里是“王者”。涉及到嵌入式编程时，`C++` 没有竞争对手，因为它接近硬件。在嵌入式系统中，我们纯粹在硬件上工作并需要运行速度快；`C++`
    最适合这种工作。


    #### 科学计算

    我们还使用 `C++` 来解决科学计算中复杂的数学问题。


    ### 2. 性能

    如所述，`C++` 接近硬件，这允许底层的内存操作并提供高性能。这使得它非常适合需要密集计算的资源密集型任务。


    **总结**：由于接近硬件，`C++` 允许底层内存操作并提供高性能，使其适用于资源密集型任务。


    ### 3. 面对象编程 (OOP)

    `C++` 支持 `OOP` 原则，这有助于你设计模块化、可维护和可重用的代码。

    如果你在团队中使用不支持 `OOP` 的语言工作，你就无法以模块化的方式（逐模块地）开发代码。这使得在团队成员之间分配任务变得困难，每个人负责不同的功能，这些功能会被组合成单一的功能。


    **总结**：`C++` 支持 `OOP` 原则，有助于设计模块化、可维护和可重用的代码。


    ### 4. 兼容性

    `C++` 被广泛使用并支持不同的平台和操作系统。这使其成为跨平台开发的一项宝贵技能。我们可以为任何操作系统或平台创建应用程序。


    **总结**：`C++` 被广泛使用并支持不同的平台和 `OS`，使其成为跨平台开发的一项宝贵技能。


    ### 5. 标准库

    `C++` 提供了一个健壮的标准库，其中包含了各种数据结构、算法和函数。

    - **数据结构**：对数据进行结构化使处理变得更容易。

    - 这些库已经由 `C++` 开发者创建好了；我们只需要导入它们，从而节省了精力和。例如，如果我们需要排序元素，不需要编写逻辑；只需使用现有的函数即可。


    **总结**：`C++` 提供了健壮的标准库。


