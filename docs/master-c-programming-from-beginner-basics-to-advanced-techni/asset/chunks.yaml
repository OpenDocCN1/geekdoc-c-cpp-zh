    变量与值相关联。现在让我们它是它是运作的。这是一个非常重要的问题。让我们来看一个例子。这里我们有一个整数型变量 `age`，并将其初始化为 `45`。现在让我们看看这个值在后台实际上是如何存储在变量中的。这里我们有主内存，而这个
    `age` 变量指向这个内存地址。假设这个内存地址是 `2000`，其中存储了相应的值。正如我们所知，一个字节等于 8 位（byte）。所以每个内存地址占用一个字节。这就是为什么给这个变量分配了两个内存地址。


    一个字节在这里，另一个字节在那里。在每个内存地址上我们都有 8 位（bits）。对吧。8 位。通过这样，我们的 `45` 将以 0 和 1 的形式存储在这些内存地址中。现在，重要的是，这个名称将指向存储实际值的内存地址。现在，我再告诉你们一件事，过去是如何操作的，你们很多人可能知道，如果你处理过微处理器，假设这是微处理器的内存地址块，那么如果你想对两个值进行加法操作，你必须手动地以
    0 和 1 的形式将值存储到内存地址中，比如 `0110`。然后你还要告诉它，好的，执行加法操作并将结果存储到这个内存块中。现在请理解这些编程语言为你提供了什么。你不需要去每个内存地址存储值并执行各种计算。对吧。


    你只需要将值提供给变量，或者我们将在本课程后半部分讨论的任何数据结构即可。然后你就可以直接对这些值执行操作。这非常简单。你不需要担心在哪里需要存储，在哪里需要处理，以及在哪里需要将结果存回。在编程语言的帮助下，这些复杂性被了，而变量和数据结构就是这种特性的最佳例子。


    所以我希望你们能理解或感受到变量在任何编程语言中的重要性。酷酷。现在让我们看看变量的另一个重要点，即变量作用域（variable scope）。好的，基本上有两种作用域：局部（local）和全局（global）。在局部范围内，我们可以说，如果我们在一个块（block）内部创建一个变量，那么这个变量的作用域将仅在该块内部，这是一个非常重要的概念。如果你尝试在这个块之外的任何地方使用这个变量，你就无法访问它，因为它在块外部是不可知的。对吧。


    另一方面，如果我们不在任何块中创建变量，而是在我们包括头文件在的地方创建变量，那么该变量具有全局作用域，这意味着你可以在代码的任何地方使用该变量。现在，我再告诉你们一件事，在面向对象编程章节，我会告诉你们使用这种方法的缺点。


    现在你可能在想，好的，我可以创建越来越多的全局变量，然后我可以在任何地方使用它们。但我也会告诉你们它的局限性。基本上我们什么时候应该创建全局变量以及为什么我们应该尽量避免创建全局变量。所以，同学们，我希望这节课对你们来说非常清楚，如果你还没有评分的话，我请求你留下评价。这真的激励了我们为你们创造更有用的内容。谢谢。


    # C++ 程序中的用户输入与输出


    在本节课中，我们将学习用户输入，那么为什么我们需要用户输入呢？让我们通过一个例子来看这个问题。这是我们的程序。当我们的程序运行时，它有时需要来自用户的某些输入，就像你在网站上填写申请表，在上面填写你的姓名、ID
    等等。在，你正在为网站提供输入。同样，程序也需要你的输入。现在让我们看看提供用户输入的机制。假设你想从键盘获取输入，那么你将在对象中使用 `cin`。


    `cin` 对象负责获取输入。它会从键盘获取输入并将其放在右侧的变量中。即这个变量。所以它会从这个键盘获取输入并将其放在变量 `rate` 中。通过这个提取运算符（extraction
    operator），我们正在从这个键盘或输入设备提取输入。这就是为什么我们使用提取运算符并最终将值放在变量中。对吧。所以我希望这个获取用户输入的概念对你来说非常清晰。极了。类似地，让我们看看如何向控制台输出。


    假设在这个变量中存储了一些数据。之后，你将使用插入运算符（insertion operator）从这个变量将某些内容插入到流对象（stream object）中。这个对象是什么？这个对象无非连接到你计算机显示设备（显示器）的流（stream）。它将从这个变量中获取数据并显示在控制控制台中。所以这个对象会将变量的内容定向到右侧，即将该变量传递给左侧的对象。即这个对象
    `cout`。而这个 `cout` 对象是用于在屏幕或控制台上显示你的信息的路径。


    对吧。这就是在这种运算符和变量名中编写输出代码的语法。你已经看到了如何获取用户输入以及如何显示输出。让我们来看一个简单的例子来理解它。这是我们的 `main`
    函数，我们在这个块内部写了一些语句，现在我们正在创建一个整数类型的变量。我们将在后面的部分查看变量。但现在，考虑它将存储你的信息或数据。现在，我们将通过这个
    `cout` 打印一条消息：`enter your age`。


    在这里我们提示用户输入年龄。所以当用户输入他的年龄时，它将存储在这个变量中，即 `age`。在接下来的语句中它将显示输出 `age`。它将显示回控制台。现在让我们进入
    Visual Studio 查看实际演示。所以首先，我们将创建一个整数类型的变量来存储用户的年龄。现在，我们将要求用户 `enter your`，并通过 `cin`
    获取输入并将用户输入存储到 `age` 变量中。


    在控制台上显示这条消息后，用户将开始输入他们的年龄，因此 `cin` 将从那个控制台获取年龄并存储在内部。现在就非常了。之后，我们将打印年龄。`Your age
    is.` 我们刚刚存储在这个 `age` 变量中。现在让我们运行这个程序。在这里你可以看到它正在询问并是，所以我输入 `34` 并按下回车。然后 `cin`
    将获取数值并将其存储到这个 `age` 变量中，之后该语句被执行，`your age is thirty four`，`thirty four` 通过 `cout`
    的帮助打印在控制台上。


    现在，让我给你们解释几点。让我设置一些断点。对吧，通过这个断点的帮助，我们可以在任何点停止编译器的执行。现在让我们再次运行这个程序。所以你可以看到红圈内部有一个黄色箭头。这意味着你的编译器停留在这里。它由于这个断点而停在这里了。这里需要注意的是，`age`
    变量正在存储某些随机值，比如负八、五、八、九等等。这个随机值是什么？这无非是一个垃圾值（garbage value）。

