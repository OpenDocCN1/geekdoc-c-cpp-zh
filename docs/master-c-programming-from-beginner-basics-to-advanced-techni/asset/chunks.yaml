    # C++ 语言中的数据类型


    我们使用的关键字是 `char`。`char` 用于存储单个字符，比如小种子、小写字母和大写字母，它的大小就像台北的一口食物。它在内存中也会占用 8 位（bits），对吧？


    现在，第三种是 `int`，我们使用的关键字是 `int`，它用于存储整数值，如 `1056`，整数的大小是两个字节（bytes）。对。


    接下来是浮点数。我们使用的关键字是 `float`。如果我给你一个例子，比如 `10.6001`，它是用来存储小数值的。对吧。它本身在内存中占用四个字节。


    接下来，我们有双精度浮点数。关键字是 `double`。`double` 的示例可以是 `9.11119`。`double` 的大小是八字节。现在你可能在想，`float`
    和 `double` 之间有什么区别？`float` 是单精度，而 `double` 是双精度，这意味着我们的精度变成了两倍。所以为了获得准确的结果，我们使用
    `double` 双精度。如果你使用单精度浮点数，你的结果可能会出现偏差。


    如果我给你一个例子来展示 `float` 和 `double` 之间的区别，假设我想对两个小数 `0.0001` 进行加法。现在如果我通过这个浮点数进行加法，我得到的结果将是
    `0.00`。对吧。但如果我执行相同的操作，我会得到更精确的结果，即 `0.00002`。这就是 `double` 和 `float` 之间的区别。


    此外，在 `float` 中，我们也会使用 `F` 来表示浮点数，但在赋值时是不需要表示的。对吧。你需要记住所有数据类型及其大小，因为在编写程序时，你需要知道什么数据需要存储在什么类型中，比如工资会存储在浮点数中，年龄存储在
    `int` 中，名字存储在 `char` 中。对吧。所以我希望这节课对你来说非常清晰。


    在这节课中，我们将看到更多关于数据类型。在上一节课中，我们已经看了 `Boolean`、`char`、`float` 和 `double`，对吧，但我们还没有谈论这个。简单来说就是空值。当我们在某处写
    `void` 时，它仅仅意味着空。所以它不像其他数据类型那样占用内存中的任何空间，对吧。现在，让我们看看不同数据类型的范围。首先，从整数开始，我们已经知道
    `integer` 的大小是两个字节，整数的范围是从负 `32768` 到 `32767`。


    现在你可能在想，我们是如何得到这个范围的？让我给你一个例子，让我们知道 `integer` 占用两个字节。这是前 8 位，这是后 8 位，总共 16 位。对吧。这第一位被称为最高位（MSB），最后一位被称为最低位（LSB）。现在，这个“最高”和“最低”有效位的意义是什么？因为意味着我们留出第一位来表示相同的值。`1`
    表示负。


    如果在这个第一位上放置 `1`，则意味着这个数是负数。同样，如果在这个第一位上放置 `0`，那么意味着这个数是正数。对吧。那么在留出这个最高位后，还剩下 15
    位？对吧。在每个位置上我们都可以放置 `0` 或 `1`。对吧。那么我们用这 15 位可以生成的范围是多少？那就是 $2^{15}$，即 `32768`。这就是我的范围目标。从
    `-32768` 到 `32767`。


    对，类似的 `float` 也有一个范围，从负 $3.4 \times 10^{-38}$ 到 $3.4 \times 10^{38}$。谈到 `doubles`，我们有八字节。对吧。这就是为什么范围变成了从负
    $1.7 \times 10^{-308}$ 到 $1.7 \times 10^{308}$。你可以通过一个简单的技巧来记住它，即 `1.7`。如果你把它乘以
    `2`，它就会变成 `3.4`，`30` 变成 `308`。对吧。


    虽然没必要这样学习，但你必须理解正在发生什么以及是如何发生的。我们已经看了 `Integer`、`float`、`double`。接下来，让我们看看字符（characters）的范围。它的大小是一个字节，意味着
    8 位，其中一位留给符号。所以我们必须计算 $2⁷$，即 `128`。所以范围是从 `-128` 到 `127`。最后，`Boolean` 没有任何范围，因为只有两种可能：第一是
    `true`（真），第二是 `false`（假）。只有这两种可能。所以我希望数据类型的概念对你来说非常清晰。


