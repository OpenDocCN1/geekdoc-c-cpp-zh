    所以处理器是实际上执行计算的实体。这就是为什么我们的城市中至少需要一个处理器，以便我们进行计算。以前，我们通常有一个处理器，但现在我们有多个处理器。我们也可以看到它们，因为核心是
    CPU 的处理单元。你可以这样理解：CPU 是一间房子，而房子里面的人就是核心或处理器。所以，房子里的人越多，他们就越能管理好自己。


    同样，CPU 内部越多的或多个核心能够执行更多的计算。对。现在，下一项是带有双核的 CPU，因为因为它被称为双核（dual core），你一定听过这个词，双核意味着
    CPU 内部有两个核心。两个核心意味着 CPU 有两个处理单元，它们将并行计算任务并让我们的 CPU 运行更快。


    同样，我看到人们在手机通话时，这被称为四核 CPU，对吧？现在，接下来的项叫做核心（core），它是 CPU 内部的一个处理单元，实际上它在执行计算。现在，这个核心是一个物理组件，物理组件意味着我们可以触摸它。我们可以感觉到它。但是线程（thread）是在核心内部的，所以这是
    CPU 内部的核心，而这是核心内部的线程。这种逻辑组件意味着我们无法触摸它。这是一个假设性的概念。


    所以这个线程实际上是核心的一个逻辑部分，它执行每一条命令并产生输出。现在，你可能会想这可能需要什么。让我给你举个例子。假设你正在运行一个浏览器。这就是浏览器。我们知道处于运行状态的程序是一个进程（process）。所以这个浏览器正在运行，因此它就是一个进程。不，在这个浏览器内部，我们正在浏览
    YouTube。所以这就是 YouTube 视频播放。在这里你可以找到推荐视频。


    所以，一个线程有助于运行或播放这个视频，而另一个线程则能够显示推荐视频。因此，线程无非一个微处理器单元。它们被用于在处理中引入并行性，以便我们在单个进程中执行多个任务，这为了方便理解。让我给你一个生活中的例子，这样你就能理解
    CPU、核心和线程了。假设有一个工厂。这就是工厂。这个工厂无非 CPU。


    你可以将其与工厂内部的 CPU 联系起来。我们有不同的层级，这些层级就是核心，它们实际上在工厂里执行任务。杠杆的手被固定住，我们可以说它实际上在执行或执行当前给出的每一条命令。下一项是缓存（caches）。这些是
    CPU 中可用的小内存池。你知道为什么我们在你内部需要一些内存吗？我们已经拥有它们了。


    这是因为最频繁使用的数据存储在这些缓存中。所以这个 `L1 cache` 是最小的。请注意，内存越小，速度就越快，因为我们知道内存无非内存地址的集合。如果我们内存地址的数量较少，那么内存查找时间就会减少。但如果我们有更大的内存，比如
    `RAM`，那么查找时间可能会增加。而在硬盘的情况下，查找时间甚至更长。


    这就是为什么 CPU 有它自己的缓存，它们的尺寸较小，存储了最频繁使用的数据。现在我们看到 `L1` 更小，`L2` 比它大。所以目标应该是首先检查 `L1`，如果没找到，它就会检查
    `L2`，如果那里也没有找到，它就会去主内存（RAM）。这里有一个概念叫做 `cache`（缓存），意味着如果我们在 `cache` 中找到了正在查找的项，就称为“缓存命中”（cache
    hit），或者如果我们找不到正在查找的项目，就称为“缓存未命中”（cache miss）。对吧。所以我希望通过这些，计算机运行方式的整体图像对你来说就很清晰了。


