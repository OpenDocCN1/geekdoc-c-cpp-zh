  md: "# Chapter 10 Categorical Data\n\nWhat is the probability that this sample comes\
    \ from a distribution of blood groups found in the United States?\n\nOn the TESTP=\
    \ option, you can enter expected proportions either as numbers less than 1 (which\
    \ must add to 1), or as percentages (which must add to 100%). The TESTF= option\
    \ enables you to enter expected frequencies. In parentheses, and you can separate\
    \ them by spaces or commas. The following program analyzes your blood count data:\n\
    \n# Program 10.8: Computing Chi-Square for a One-Way Table\n\n```\ndata bloodtype;\n\
    \  input Type $ Count @@;\ndatalines;\n  0 88 A 76 B 24 B 12;\n  title \"Computing\
    \ Chi-Square for a One-Way Table\"\n  proc freq data bloodtype;\n  tables Type\
    \ / testp = (.40 .04 .11 .45);\n  weight Count;\nrun;\n```\n\nBecause the blood\
    \ counts are expressed as frequencies, you need to use the WEIGHT statement in\
    \ PROC FREQ to tell the program to use the frequencies in the variable Count.\
    \ Also (and this is very important), the order of the four theoretical proportions\
    \ on the TESTP= option are in the alphabetical order of the four blood types.\
    \ The TESTP= option could also have been written with percentages, like this:\n\
    \n```\ntables Type / testp = (.40 04 11 45);\n```"
