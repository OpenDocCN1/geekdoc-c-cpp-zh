    # Performing a Wilcoxon Signed Rank Test


    The UNIVARIATE Procedure

    Variable: Diff


    | Test | Statistic | p Value |

    |---|---|---||

    | Student''s t | t | 3.019386 | Pr > |t| 0.0194 |

    | Sign | M | 3 | Pr >= |M| 0.0703 |

