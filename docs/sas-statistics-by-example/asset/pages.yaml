  md: '# 198 SAS Statistics by Example


    ```

    oddsratio Gender;

    oddsratio Age_Group;

    run;

    quit;

    ods graphics off;

    ```


    This time, a PLOTS option was added to request a ROC curve and a plot showing
    odds ratios. A short-cut notation was used in the MODEL statement to request a
    factorial model. This notation is the same notation you used with PROC GLM. As
    a review, the two lines of code are equivalent:


    ```

    model A | B | C;

    model A B C A*B A*C A*B*C;

    ```


    To limit the model to interactions that are no higher than two-way interactions,
    you include @2 after the model specification.


    Also in this program, the MODEL option SELECTION= was set to BACKWARD and the
    significance levels for staying in the model (SLSTAY) was set to .1 (in PROC LOGISTIC,
    the default value for SLSTAY in the backward selection method is .05). Three ODDSRATIO
    statements were also added. When you have interactions in a model, PROC LOGISTIC
    does not automatically compute odds ratios. The ODDSRATIO statement also has options
    that specify that you want odds ratios of one variable at a specified level of
    another variable. See the online SAS/STAT User’s Guide for more information about
    the ODDSRATION statement.


