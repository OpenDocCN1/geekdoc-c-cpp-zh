- img_proc: true
  md: "example) to one or more values. To demonstrate, let's start by making a format\
    \ for Gender, SBP, DBP, and using these formats with PROC FREQ.\n\n# Program 3.5:\
    \ Writing a Format for Gender, SBP, and DBP\n\n```\nproc format;\n  value Gender\
    \ 'W' = 'Male'\n                    'F' = 'Female';\n\n  value sbpgroup low-140\
    \ = 'Normal'\n                 141-high = 'High';\n\n  value dbpgroup low-80 =\
    \ 'Normal'\n                 81-high = 'High';\nrun;\n\nproc freq data=example.Blood_Pressure;\n\
    \  tables Gender SBP DBP / nocum;\n  format Gender SBP sbpgroup DBP dbpgroup;\n\
    run;\n```\n\nYou use PROC FORMAT to create formats—labels associated with values.\
    \ If you are planning to create formats for character variables, the format names\
    \ must start with a dollar sign. In addition, format names cannot end with a number.\
    \ All format names are limited to a maximum of 32 characters, including the initial\
    \ dollar sign for character names. Finally, format names can contain letters,\
    \ digits, and the underscore character. You name each format on a VALUE statement.\
    \ This statement lets you specify unique, groups of values, or ranges of values\
    \ on the left side of the equal sign, and labels that you want to associate with\
    \ these values on the right side of the equal sign.\n\nThe first format in Program\
    \ 3.5 is Gender. This name is a good choice because the format will be used with\
    \ the variable Gender (a character variable). All the format names are, however,\
    \ arbitrary; you could have called this format $xyz if you wanted. The $Gender\
    \ format associates the text \"Male\" with M and \"Female\" with F. You can use\
    \ either single or double quotation marks when creating formats—just be sure you\
    \ are creating an apostrophe (which is regarded as a single quote mark).\n\nThe\
    \ next two formats are to be used with the two variables SBP and DBP. For SBPGROUP,\
    \ the range of values associated with the text \"Normal\" is from the lowest nonmissing\
    \ value to 190. You can use the keywords LOW and HIGH when you are defining range\
    \ formats."
  merge: -1
