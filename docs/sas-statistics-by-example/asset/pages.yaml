  md: '# 220 SAS Statistics Example


    Whether you decide to use an example (two-sample t-test, ANOVA, comparing proportions,
    etc.) or then specify your design let the program compute either the power or
    sample size. Whichever method you choose, you can specify multiple scenarios for
    various parameters, as a family of mean differences or a couple of standard deviations.
    You can also request output in graphical form. For example, you can plot sample
    size against power for a family of theoretical values for your parameters.


    This chapter starts by demonstrating how to use PROC POWER to compute the power
    and sample size for simple designs: a two-sample t-test, a one-way ANOVA, and
    the difference of two proportions. The remainder of the chapter will demonstrate
    how to run the interactive Power and Sample size application.


    # Computing the Sample Size for an Unpaired t-Test


    Let''s start with an example that computes the number of subjects per group for
    several scenarios. Two pairs of means, 20.0 30.0 and 22.0 are hypothesized. You
    want to see sample sizes for grouped standard deviations of 10 and 15. Next, you
    want to see the sample sizes for powers of 80% and 90%. These combinations yield
    2x2x2=8 combinations. Finally, you want to see a plot of power the number of subjects
    per group for all eight combinations. Here is the program:


    # Example 13.1: Computing Sample Size for an Unpaired t-Test


    ```

    "Sample Size Requirements for a T-Test"

    proc power;

    tososamplemeans=

    groupmeans = (20 30) (22 28)

    stddev = 10

    power = .80 .90

    pergroup = ;

    plot x = power min = .70 max = .90;

    run;

    ```


    You specify that you want calculations for a two sample t-test by using the keyword
    TWOSAMPLEMEAN. The two pairs of means you are placed in parentheses after the
    keyword GROUPMEANS=. In this program, one test will be conducted with a mean of
    20 30 and another with a mean of 22 28. You specify standard deviation with the
    STDDEV= keyword and the two standard deviations of interest. Next, you use .80
    and .90 after the keyword POWER. (Power is expressed as a proportion and not as
    a percentage.) The procedure can compute either power or sample size (or you specify
    the parameter you want to compute by entering a missing value for that). In this
    example, you are entering missing


