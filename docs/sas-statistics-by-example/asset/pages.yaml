  md: '# Chapter 2 Descriptive Statistics – Continuous Variables 29


    The remaining values in the section are less useful. Author believes that they
    were originally included so that you could use them in hand calculations of other
    statistics that were not computed by SAS. The sum of weights is useful if you
    use a WEIGHT statement with PROC UNIVARIATE; with a WEIGHT statement you select
    a variable that weights the SBP values. In this example, if you did not specify
    weights, the sum of weights is equal to the number of observations (all the weights
    are equal to 1). The corrected SS is the sum of squares of all the data values.
    To compute the corrected SS, you subtract the mean from each value before you
    square them, and then add them up. This is the same as the numerator of the sample
    variance.


    +   The values listed in this section are somewhat redundant. They are grouped
    here for convenience as measures of location (mean, median, and mode) and measures
    of variability (standard deviation, variance, range, and interquartile range).


    +   This section displays a number of statistical tests that determine whether
    various measures of center location are significantly different from a theoretical
    value (mu). The default value for mu is mu=0. You can change the default value
    to another value by using the procedure option MU=n, where n is the nonzero value
    of your choice.


    The tests listed in this section are a one-Student''s t-test, a sign test, and
    a signed-rank test (also with the Wilcox signed-rank test). These statistics are
    discussed in Chapter 5 (one-sample t-test) and Chapter 12 (the sign and Wilcox
    tests).


