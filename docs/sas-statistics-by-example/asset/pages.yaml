- img_proc: true
  md: 'is the variance inflation factor (VIF). To compute the VIF for any of the predictor
    variables, you run a regression of all the other predictor variables to predict
    the one in question. For example, if you have predictor variables X1, X2, and
    X3, you run the following three regressions:


    +   - X1 as a function of X2 and X3

    - X2 as a function of X1 and X3

    - X3 as a function of X1 and X3


    Then you compute a multiple R-square for each of these models and compute the
    VIF:


    VIF=1/(1-R²)


    To have SAS compute the VIF for each of your predictor variables, you simply need
    to include VIF as an option on the MODEL statement. As an example, let''s compute
    the VIF for each of the predictor variables in the exercise data set:


    # Program 9.9: Using the VIF to Detect Collinearity


    ```

    title "Using the VIF to Detect Collinearity";nproc reg Pushups = Age Rest_Pulse
    Max_Pulse Run_Pulse / VIF;

    quit;

    ```


    Here is the position of the output that shows the VIF:


    | Variable | DF | Estimate | Standard Error | Pr > |t| | Variance Inflation |

    |---|---|---|---|---|-|

    | Intercept | 1 | 93.56636 | 21.33252 | 4.39 | <0.001 | 0 |

    | Age | 1 | -0.31264 | 0.10918 | -2.86 | 0.0063 | 1.43496 |

    | Rest_Pulse | 1 | -0.02608 | 0.03165 | -0.08 | 0.9345 | 4.34454 |

    | Max_Pulse | 1 | -1.26238 | 0.54665 | -2.31 | 0.0216 | 11.59795 |

    | Run_Pulse | 1 | 0.84388 | 0.04504 | 1.87 | 0.0675 | 8.19934 |


    Values for VIF that are greater than 10 are considered large. You should also
    pay attention to VIF values between 5 and 10. In this example, you would see large
    VIFs for Max_Pulse and Run_Pulse. At this point, you might consider leaving only
    one of these variables in the model or, perhaps, creating a new variable that
    is a linear combination of these two variables.'
