    # Conclusions


    Hopefully, this chapter has demonstrated that it is quite easy to run nonparametric
    statistics using SAS. When you have doubts about whether the assumptions for a
    parametric test have met, try out one of the nonparametric routines demonstrated
    in this chapter. It is often instructive to perform both a parametric and a nonparametric
    test on your data, and see if you come to similar conclusions.


    The next chapter covers how to use SAS to compute power and sample size.'
