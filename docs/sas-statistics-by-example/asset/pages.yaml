  md: "# Chapter 11 Binary Logistic Regression 189\n\nnot, the pair is labeled discordant.\
    \ If the probabilities are computed to be the same (because this example has Gender\
    \ in the model, the probabilities will be the same if both subjects in the pair\
    \ are the same sex), the pair is called tied. In this simple example, the predicted\
    \ probability of a heart attack for men is higher than for women, which the man\
    \ had a heart attack and the women didn't concordant, but pairs in which the women\
    \ had a heart attack and the man did not discordant.\n\nThe four values in the\
    \ column are all measures of rank correlation and are computed from the concordant,\
    \ discordant, and tied pairs. Models with higher values of these measures of association\
    \ have better predictive value than models with lower values of these measures.\
    \ The c statistic estimate the probability that an observation with the outcome\
    \ will have a higher probability than an observation without the outcome. In this\
    \ example, the probability is 617 that a person who had a heart attack has a higher\
    \ predicted probability than a person who did not have a heart attack. The c statistic\
    \ also gives you the area under a Receiver Operating Characteristic (ROC) curve\
    \ (discussed at the end of this chapter).\n\n+   Because of the CLODDS-PL option\
    \ on the MODEL statement, you see the profile likelihood estimates here. In this\
    \ example, the point estimate is the same as the Wald estimate shown previously\
    \ in the output, but the confidence interval is slightly different.\n\n# Running\
    \ a Logistic Regression Model with One Continuous Predictor Variable\n\nYou can\
    \ include predictor variables in your logistic regression models. The MODEL statement\
    \ looks similar to the ones you used for multiple regression.\n\nIn this example,\
    \ you will use cholesterol level (Chol) as a predictor of heart attack. Here is\
    \ the program:\n\n# Program 11.2: Logistic Regression with One Continuous Predictor\
    \ Variable\n\n```\ntitle \"Logistic Regression with One Continuous Predictor Variable\"\
    ;\nproc logistic data=;\n  model Heart_Attack (event='Yes') = Chol / clodds =\
    \ pl;\n  units Chol = 10;\nrun;\nquit;\n```\n\nCody, Ron. SAS® Statistics by Example.\
    \ Copyright © 2011, SAS Institute Inc., Cary, North Carolina, USA. ALL RIGHTS\
    \ RESERVED. For additional SAS resources, visit support.sas.com/publishing."
