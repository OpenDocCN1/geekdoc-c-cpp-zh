    \ ONEWAYANOVA. For more complex ANOVA designs, you can use PROC GLMPOWER (this\
    \ procedure is not covered in this chapter, but it is included in the SAS/STAT\
    \ User's Guide).\n\nIn this example, you want to determine the sample size that\
    \ you need for a one-way ANOVA design with three groups. You hypothesize that\
    \ the means for each of three groups are 20, 25, and 30. You want to see the effect\
    \ of two standard deviations (8 and 10) for powers of 80% and 90%. Here is the\
    \ program:\n\n# ### Program 13.3: Computing the Power for an ANOVA Design\n\n\
    ```\ntitle \"Computing the Power for an ANOVA Model\";nproc power;\n onewayanova\n\
    groupmeans = 20 | 25 | 30\nstddev = 8 10\n power = .80 .90\n npergroup = -;\n\
    \ plot x = power min = .70 max = .90;\nrun;\n```\n\nBecause you want to compute\
    \ the sample size per group, you set NPERGROUP equal to a missing value. Additional\
    \ options for computing computing power for ANOVA designs let you analyze unbalanced\
    \ designs."
