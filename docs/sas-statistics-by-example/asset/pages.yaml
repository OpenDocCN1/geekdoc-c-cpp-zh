    # Producing Separate Plots Instead of a Panel


    Program 9.2 produced two panels, showing fit diagnostics and the other showing
    residuals by regressors. If you prefer each of the plots in both panels to be
    displayed on a separate plot, you need to add a PLOTS= option, specify the two
    panels you want, and use the UNPACK option, as follows:


    ```

    plots(unpack) = (diagnostics residualplot)

    ```


    DIAGNOSTICS AND RESIDUALPLOT are the names of the two default plots that are produced
    when you run PROC REG ODS Graphics turned on. You can obtain the names of these
    two plots from SAS Help (select SAS Products → SAS Procedures → PROC REG → ODS
    Graphics). You can also obtain the plot name from the Results window of the Display
    Manager. Place the cursor on one of the plots and right-click to see the plot
    properties.'
