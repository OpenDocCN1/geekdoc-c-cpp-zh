    # Descriptive Statistics Broken Down by a Classification Variable


    The data set Blood_Pressure also contains a variable called Drug. You might want
    to see the same statistics, but this time compute them for each level of Drug.
    One way to do this is to add a CLASS statement to PROC MEANS like:


    # Program 2.2: Statistics Broken Down by a Classification Variable


    ```

    title "Descriptive Statistics Broken Down by Drug";nproc means data=example.Blood_Pressure
    nmiss mean std median

    maxdec=3;

    class Drug;

    var SBP DBP;

    run;

    ```


    The CLASS statement tells the procedure to produce the selected statistics for
    each unique value of Drug. This is a good time to tell you when you have more
    than one statement in a PROC step (in this case, the CLASS and VAR statements),
    the order of these statements does not usually matter. The exceptions are certain
    statistical procedures in which you must specify your model before you ask for
    statistics.


