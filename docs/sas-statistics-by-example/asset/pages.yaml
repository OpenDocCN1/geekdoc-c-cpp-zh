    # Comparing Spread: The Ansari-Bradley Test


    The Ansari-Bradley test is a nonparametric alternative to the F-test for comparing
    variances. To demonstrate this test, the following program presents a short DATA
    step, which creates two groups of scores, followed by the Ansari-Bradley test.'
  merge: -1
  pgno: 227
- img_proc: true
  md: "# 212 SAS Statistics by Example\n\n# Program 12.6: Performing the Ansari-Bradley\
    \ Test for Spread\n\n```\ndata twogroups;\n  do Group = 'One*','Two*;\n  do Subj\
    \ = 1 to 15;\n    input Score @;\n    output;\nend;\ndatalines\n1 3 5 7 11 20\
    \ 25 30 40 45 55 66 77 88 90 100\n2 4 8 20 24 33 40 45 55 59 60 68 69 70 71\n\
    ```\n\n```\ntitle \"Performing the Ansari-Bradley Test for Spread\";\nproc nparway\
    \ data=twogroups ab;\nclass Group;\nvar Score;\nrun;\n```\n\nThis DATA creates\
    \ a data set with three variables: Group, Subj, and Score. All the values in the\
    \ first line of data belong to Group One and all the values in the second line\
    \ of data belong to Group Two.\n\nLet's look at how this DATA step works in more\
    \ detail. (If you are interested only in how to run statistical tests, and do\
    \ not need the details of this DATA step, free to skip this paragraph.) The outer\
    \ DO loop sets the value for Group to One. It is quite convenient that you use\
    \ SAS DO loops to loop through character values as well as numeric values. The\
    \ inner DO loop sets Subj values from 1 to 15. Inside this loop, you read the\
    \ 15 Score values. The single sign (@) on the INPUT statement is an instruction\
    \ to handle the line. You need this each time SAS executes an INPUT statement\
    \ in a DATA step, by the way) to read data from a new line. The @ (called a single\
    \ trailing at sign) prevents SAS from going to a new line when it executes more\
    \ than one INPUT statement in a DATA step. Following the INPUT statement is an\
    \ OUTPUT statement causes causes observation to be written to the resulting data\
    \ set. After the first 15 observations with Group=One have been written out, the\
    \ outer DO loop sets the value of Group to Two and the next 15 observations are\
    \ created.\n\nThe ab option on PROC NPARWAY requests the Ansari-Bradley test.\
    \ With the previous examples that used PROC NPARWAY, you have the option of including\
    \ an EXACT statement when you have small sample sizes and you do not want to use\
    \ a normal approximation to compute the p-value. PROC NPARWAY gives you the following\
    \ output:"
  merge: -1
