- img_proc: true
  md: "This plot shows Mallows' Cp for each of the models. Two lines that represent\
    \ Mallows' criteria and Hocking's criteria are also included. It is easy to see\
    \ that the model that best fulfills Mallows' and Hocking's criteria has four parameters\
    \ (which is a 3-variable model). In many cases, the model that you select using\
    \ Mallows' criterion will be the more parsimonious model, that is, the simpler\
    \ with fewer parameters.\n\nThe models that these two criteria suggest are just—suggestions.\
    \ You should use your subject-matter expertise to make final decisions on which\
    \ models you ultimately use.\n\nFor example, you could limit your output to three\
    \ models for each group of models by writing:\n\n```\nmodel Pushups = Age_Pulse\
    \ Max_Pulse Run_Pulse /\n      selection= rsquare adjrsq best=3;\n```\n\n# Forward,\
    \ Backward, and Stepwise Selection Methods\n\nWhen you have a large number of\
    \ possible predictor variables, the processing time to run all possible models\
    \ using the RSQUARE selection method can become excessive. In these situations,\
    \ you can use one of the automatic selection methods—forward, backward, or stepwise.\n\
    \nTo run any of these automatic selection methods, use the SELECTION= option on\
    \ the PROC REG statement. The forward method starts with the best variable (one\
    \ that yields the largest F statistic) and adds variables one at a time until\
    \ the p-value for the variable being entered is larger than a specified value.\
    \ The backward elimination method starts with all variables in the model and removes\
    \ them one at a time (one with the largest p-value first) until all variables\
    \ being considered for removal have p-values smaller than a given value. Finally,\
    \ the stepwise selection method is almost the same as the forward method except\
    \ that a variable that has already been added to the model may be removed later.\n\
    \nTwo options, SLENTRY=(significance level for entering) and SLSTAY=(significance\
    \ level for staying), have a default value for each of the three methods:"
  merge: -1
  pgno: 161
- img_proc: true
  md: "# 146 SAS Statistics by Example\n\n| Method | Default Value |\n| --- | ---\
    \ |\n| Forward | SLENTRY=.50 |\n| Backward | SLSTAY=.10 |\n| Stepwise | SLENTRY=.15,\
    \ SLSTAY=.15 |\n\nProgram 9.4 demonstrates all three methods.\n\n# Program 9.4:\
    \ Demonstrating Forward, Backward, and Stepwise Selection Methods\n\n```\ntitle\
    \ \"Forward, Backward, and Stepwise Selection\";\ntitle2 \"Using Default Values\
    \ for SLENTRY and SLSTAY\";\nproc reg data=exercise;\n Forward: model Pushups\
    \ = Age Rest_Pulse Max_Pulse Run_Pulse /\n  selection = forward;\n Backward: model\
