  md: '# 114 SAS Statistics Example


    to see more variables. To include more variables in your panel (up to a maximum
    of ten), you can use the NVAR=ALL or NVAR=n on the request, like this:


    ```

    proc corr data=exercise nosimple rank plots = matrix(nvar=all);

    ```


    In Chapter 4, learned that you can use PROC SGATTER to display a scatter plot
    matrix, with no limitation on the number of variables displayed (except for a
    practical limit, after which the plots become small).


    If you want to see each scatter plot on a separate page, you can include a PLOTS=option,
    like this:


    ```

    proc corr data=exercise nosimple rank plots(only)=scatter;

    ```


    The ONLY option says that you want only separate bivariate plots for each variable
    pair, rather than the scatter plot matrix that is produced by default. By default,
    the maximum number of individual scatter plots is also set at. You can use the
    same NVAR= option to request additional scatter plots as you used with the matrix
    plot. The maximum number of individual scatter plots is 10. (Again, you can use
