  md: 'You can even get a bit fancier and let SAS label the outliers:


    # Program 2.9: Labeling Outliers on a Box Plot


    ```

    title "Demonstrating How Outliers are Displayed with a Box Plot";nproc sgplot
    data=Blood_Pressure_Out;

    hbox SBP / datalabel=Subj;

    run;

    ```


    The option DATALABEL lets you select a variable to identify specific outliers.
    If you use the DATALABEL option without naming a label variable, SGPLOT uses the
    numerical value of the response variable (SBP in this example) to label the outliers.
    Here is the output:


    ![](img/c2dc351c113ce1bd13c1f82b8e9c388f_54_0.png)


    Notice that the outliers for subjects 5 and 55 are labeled.


