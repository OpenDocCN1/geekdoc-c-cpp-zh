  md: '# Creating Multiple Scatter Plots on a Single Page Using PROC SGSCATTER


    You can use PROC SGSCATTER to display multiple plots on a single page. A PLOT
    statement lets you produce scatter plots on a single page. A COMPARE statement
    creates plots of one variable versus several on a single page. Finally, a MATRIX
    statement generates a scatter plot matrix. This section contains an example of
    each of these plots.


    # The PLOT Statement: Generating More than One Plot on the Page


    The next program shows you how to use a PLOT statement to produce two scatter
    plots on a single page. One of the plots shows Book_Sales_by Music_Sales; the
    other shows Total_Sales_by Electronics_Sales. Here is the program:


    # Program 4.5: Demonstrating the PLOT Statement of PROC SGSCATTER


    ```

    title "Demonstrating the PLOT Statement of PROC SGSCATTER";

    proc sgscatter data=store;

    plot Book_Sales * Music_Sales Total_Sales * Electronics_Sales;

    run;

    ```


    Following the PLOT keyword, you can specify multiple plots using this form


    ```

    plot y-var1*x-var1 y-var2*x-var2 ... y-varn*x-varn;

    ```


    Each of these plots will be displayed on the same page, as shown in the following
    graph.'
  merge: -1
