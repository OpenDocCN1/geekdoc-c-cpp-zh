    Now that you have converted your Excel workbook into a temporary SAS data set,
    you can list the observations in the data set and inspect the descriptor portion
    of the data set. SAS provides you with several ways to do this.


    One way to see a listing of in SAS data set is to use a SAS procedure PROC PRINT.
    The following program demonstrates how to use PROC PRINT to list the observations
    in the SASData data set


    # Program 1.1: Using PROC PRINT to List the Observations in a SAS Data Set


    ```

    proc print data=SampleData;

    run;

    ```


    Amazingly enough, this is a complete SAS program. Notice that each statement in
    this two-line SAS program ends in a semicolon. When you write SAS programs, you
    can use as many lines as you want to write a statement; you can put more than
    one statement on a line (though this is not recommended for stylistic reasons).
    The semicolon is the logical end of a SAS statement. You are free to add extra
    spaces on a line or extra blank lines in your program to make it more readable.


    To run this program from Display Manager, click the Submit icon:


