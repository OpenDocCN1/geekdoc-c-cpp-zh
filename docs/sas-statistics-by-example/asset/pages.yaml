    # ## Introduction


    SAS has extensive programs for determining power and sample size for a wide variety
    of designs. You have a choice: you can run PROC POWER (or GLMPWER for more advanced
    GLM designs) and make your requests using appropriate statements or you can choose
    to run an interactive program called SAS Power and Sample Size that allows you
    to use a menu system to perform your calculations. The SAS Power and Sample Size
    program is included with SAS/STAT software.


