    # # Introduction


    SAS provides several nonparametric tests, such as the Wilcoxon rank-sum test,
    the Wilcoxon signed-rank test, and a Kruskal-Wallis analysis of variance. This
    chapter describes these tests, as well as a way to convert your data values to
    ranks, so that you can run parametric tests on the ranked data.'
