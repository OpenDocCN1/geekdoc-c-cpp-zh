    # Conclusions


    In this chapter, you learned how to run analysis of variance models, starting
    from simple one-way designs and ending with $n$-way factorial designs with interactions.
    You saw that using ODS Graphics you can quite easily test the assumptions for
    conducting these analyses. Finally, you learned to perform a variety of multiple
    comparison tests to investigate pairwise differences.


    In the next chapter, you will learn how to investigate relationships between two
    continuous variables and how to run simple linear regression.'
