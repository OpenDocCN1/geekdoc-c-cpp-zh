    The first section of the output contains some useful and not-so-useful values.
    For example, you see the number of nonvissing values that were used to compute
    the statistics (N), mean, and standard deviation.


    Also in this section, you see skewness and kurtosis, measures that show deviations
    from normality. positive skewness values indicate a right-skewed distribution,
    and negative values indicate a left-skewed distribution. The value -145 in listing
    is very close to 0 and shows that there are no pronounced tails in the distribution
    of SBP. Kurtosis values indicate whether the distribution is more peaked or flatter
    than a normal distribution. The value that SAS computes for kurtosis is scaled
    so that you get the value 0 for a normal distribution (also known as relative
    kurtosis*). Positive values for kurtosis indicate both that the distribution is
    too peaked (leptokurtic) and that the tails are too heavy. Negative values for
    kurtosis indicate that the distribution is too flat (platykurtic) and that the
    tails are too light. The kurtosis value for SBP (-535) indicates that the distribution
    of SBP is reasonably consistent with a normal distribution.


    The coefficient of variation (often abbreviated CV) expresses the standard deviation
    as a percent of the mean. This output shows that the standard deviation is about
    8.38% of the mean. Finally, the value at the right bottom of this section is the
    standard error of the mean (1.46), which gives you an estimate of how accurately
    this sample has estimated the population mean.


