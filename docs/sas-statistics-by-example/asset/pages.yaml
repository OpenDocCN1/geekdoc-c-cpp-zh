    # Conclusions


    Whether you write your program using PROC POWER (or PROC GLMPOWER) or use the
    SAS Power and Sample Size interactive program, you can quickly and easily compute
    power and sample size for many different statistical tests.


    As a personal note, during my 26 years as a researcher at the Robert Wood Johnson
    Medical School, the most common questions I asked involved power and sample size
    size. This was before SAS had developed its power and sample size programs. The
    ability to examine the relationship between power and sample size for several
    hypothesized scenarios and to see the results in graph and tabular form would
    be invaluable.


    The next, and last, chapter in this book describes how to select random samples
    from SAS data sets.'
