    # Introduction


    This chapter continues with methods of examining categorical variables. You will
    learn how to produce frequencies for single variables and then extend the process
    to create cross-tabulation tables. You will also learn graphical approaches that
    are used with categorical variables. Finally, you will learn how to use SAS to
    group continuous variables into categories using a variety of techniques. Let''s
    get started.


