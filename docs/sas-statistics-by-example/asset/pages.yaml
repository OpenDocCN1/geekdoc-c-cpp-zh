- img_proc: true
  md: "# SAS Statistics by Example\n\nBecause the UNPACK option is on the left-hand\
    \ side of the equal sign, it applies to all the plots that you requested. What\
    \ if you want some to be unpacked and others to be on a single panel? In this\
    \ case, you place the UNPACK option after each of the plot names that you want\
    \ unpacked. For example, to see each plot on the diagnostic panel separately and\
    \ the residual plots on a single panel, you would use:\n\n```\nplots = (diagnostics(unpack)\
    \ residualplot);\n```\n\n# Choosing the Best Model (C$_p$ and Hocking's Criteria)\n\
    \nYou can use Mallows' C$_p$ to help you which model is best. If your model has\
    \ too few variables, you might benefit from adding additional variables; if your\
    \ model has too many variables, you might have overspecified the model.\n\nBeginning\
    \ with the simplest model, Mallows suggested that you choose the first model which\
    \ C$_p$ is less than or equal to p, where p is the number of parameters (predictor\
    \ plus the intercept) in the model. Hocking proposed an additional selection criterion\
    \ for selecting models. He suggested that you use Mallows' criteria if you are\
    \ using the regression to make predictions and an alternative criterion if you\
    \ are using the regression to explain relationships between the predictors and\
    \ the dependent variable. For the second purpose, Hocking recommended that you\
    \ choose the first model where C$_p$ is less than or equal to 2pRFull+1, where\
    \ pFull is the number of parameters in a full model (a model that uses all of\
    \ the predictor variables). ODS Graphics includes plots that show you your best\
    \ model based on both of these two criteria.\n\nTo see plots of C$_p$ R-square,\
    \ and adjusted R-square, use a PLOTS= option on PROC REG, like\n\n```\nProgram\
    \ 9.3: Generating Plots of R-Square, Adjusted R-Square, and C$_p$\nods graphics\
    \ on;\n  title \"Generating Plots of R-Square, Adjusted R-Square, and C(p)\";\n\
    proc reg data=execute plots(only) = (rsquare adjsq cp);\n  model1 Pushups = Age\
    \ Rest_Pulse Max_Pulse Run_Pulse /\n  selection = rsquare cp adjrsq;\nquit;\n\
    ods graphics off;\n```\n\nThe keyword ONLY ON the PLOTS request is an instruction\
    \ to produce only the plots requested and not to include all the plots that are\
    \ produced by default."
  merge: -1
