  md: '# 36 SAS Statistics by Example


    Click your way through the Results window to see the following display:


    ![](img/c2dc351c113ce1bd13c1f82b8e9c388f_52_0.png)


    The left and right sides of the box represent the 1st and 3rd quartiles (sometimes
    abbreviated Q1 and Q3). The vertical bar inside the box is the median, and the
    diamond represents the mean. The lines extending from the left and right side
    of the box (called whiskers) represent data values that are less than 1.5 times
    the interquartile range from Q1 and Q3. If you prefer to see a vertical box plot,
    use the keyword VBOX instead of HBOX.


    To see the effect of outliers on a box plot, let modify two SBP values for subjects
    5 and 55 to be 200 and 180, respectively. This modified data set is called Blood_Pressure_Out
    and is stored in the Work library (making it a temporary SAS data set). You can
    see the program to create this data set, as well as the request for the box plot,
    in Program 2.8:'
