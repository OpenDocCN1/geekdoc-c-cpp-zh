  md: '# Chapter 7 Inferential Statistics – Comparing More than Two Means 101


    # Using ODS Graphics to Produce a Diffogram


    ODS Graphics can produce a diffogram (also known as a means-means plot) as a visual
    of exploring the pairwise differences. Program 7.3 shows how to request this plot:


    # Program 7.3: Using ODS Graphics to Produce a Diffogram


    ```

    ods graphics on;

    title "Requesting Multiple Comparison Tests";nproc glm data=storeplots(only) =
    diffplot;

    class Region;

    model Electronics_Sales = Region / ss3;

    means Region / snk;

    lsmeans Region / pdiff adjust=tukey;

    run;

    quit;\ods graphics off;

    ```


    If you want to see only the diffogram and not the other plots that PROC GLM produces
    by default, use the ONLY option on the plot request. The ONLY option instructs
    SAS to produce only the plots that you are requesting and not to produce the other
    default plots. The keyword DIFFPLOT requests the diffogram. The output from this
    program is identical to that produced by Program 7.2, so this discussion includes
    only the diffogram:


    ![](img/c2dc351c113ce1bd13c1f82b8e9c388f_117_0.png)


    Cody, Ron. SAS Statistics by Example. Copyright ©2011, SAS Institute Inc., Cary,
    North Carolina, USA. ALL RIGHTS RESERVED. For additional SAS resources, visit
    support.sas.com/publishing.'
  merge: -1
  pgno: 117
- img_proc: true
  md: 'The four regions are listed on the x- and y-axes to form a matrix. At the intersection
    of any two regions, see the difference between them. The solid or dashed diagonal
    lines at the intersection of any two regions represent the 95% CI on the difference
    score for those two regions. The main, positively sloping diagonal line on the
    diffogram represents a difference of zero. If any of the confidence intervals
    cross this main diagonal, those are not significantly different. To help you distinguish
    the outcomes, the lines that represent significant differences are solid and the
    lines that represent non-significant differences are displayed as dashes.


    # Two-way Factorial Designs


    To demonstrate a two-way factorial design, you can test for electronics sales
    by Region and Gender. To specify this design on the MODEL statement, you have
    two choices:


    ```

    model Electronics_Sales = Region Gender Region*Gender;

    ```


    ```

    model Electronics_Sales = Region | Gender;

    ```


    In the first method, the asterisk specifies an interaction between Region and
    Gender; in the second method, the vertical bar between Region and Gender specifies
    a factorial design. The second notation is convenient when your models have many
    factors and you do not want to write all the high-order interaction terms.


    If your model has several factors, you can place a limit on the interaction terms
    with a convenient notation. For example, if you specify a three-way factorial
    design (like Region, Gender, and Advertising) and you do not want any interactions
    higher than second order, you would write:


    ```

    model Electronics_Sales = Region | Advertising @2;

    ```


    The @2 at the end of the statement is an instruction to limit the interaction
    terms to second order.'
  merge: -1
