  md: '# Acknowledgments


    A tremendous amount of work went into bringing this book to the bookshelf, and
    all that work wasn''t done by me alone. Several factors combined to make the review
    process and the final production of this book a challenge.


    First and foremost, I would like to thank John West, my editor and friend, who
    was amazingly patient and calm, even when there were technical challenges to overcome.


    Next, we enlisted the help of more reviewers than usual. Four of these reviewers
    read the book from cover to cover and make excellent suggestions for improvements
    and found some subtle and obscure errors. So, kudos to Gerry Hobbs, Catherine
    Truquillo, Jeff Smith, and Marc Huber.


    Other readers read devices, particularly those where they had a particular expertise.
    Sincere thanks to Rob Agnelli, Paul Grant, Sanjay Matange, David Schotthauer,
    Jim Seibold, and We Walsh.


    Since the decision was made to use HTML output instead of simple list output,
    considerable effort was required. The production team needed to “touch” approximately
    161 image files so that they would look good both in print as well as the various
    eBook devices. The people involved in this process were: Jennifer Dilley, designer;
    Candy Ferrell, technical publishing specialist; Joan Celmer, copyeditor; and Mary
    Beth Steinbach, managing editor.


    No book would be successful without having people to market it. Thanks to Aimee
    Rodriguez and Stacey Hamilton for this essential task.


    Finally, I salute the artists who created the front and back covers of the book.
    Nice job Jennifer Dilley and Marcellina Waugh.


    Cody, Summer 2011'
