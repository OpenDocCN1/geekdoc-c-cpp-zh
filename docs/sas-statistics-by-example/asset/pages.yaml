  md: '# Other Sources of Data


    The bottom line is that SAS can read data from just anywhere. Using the Import
    Wizard, for example, you can read Excel, Access, CSV, tab-delimited, dBASE, JMP
    (SAS product), Lotus, SPSS, Stata, and Paradox files. In addition, SAS can read
    data from most of the major mainframe database systems such as Oracle and DB2.


    # Conclusions


    You now know how to use the Display Manager or other editor to write your SAS
    programs, and you know how to read your data from a variety of sources. Now you
    are ready to start using SAS procedures to analyze your data. In the remaining
    chapters of this book, you will learn how to create descriptive statistics and
    how to run most of the commonly used inferential statistical tasks.'
