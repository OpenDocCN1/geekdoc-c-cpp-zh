    # Computing Sample Sizes (or Power) for a Difference in Two Proportions


    In this example, you want to know how many subjects you need in each group to
    compare a base-line proportion against three possible values: .20, .225, and .25.
    You want to do this for powers of .80 and .90. Here is the program:


    Program 13.4: Computing Sample Size for a Difference in Two Proportions


    ```

    title "Computing Sample Size for a Difference in Two Proportions";

    proc power;

    twasampleref

    test = .pchi

    groupproportions = .15 | .20 .225 .25

    power = .80 .90

    pergroup = -;

    plot x = power min = .70 max = .90;

    run;

    ```


