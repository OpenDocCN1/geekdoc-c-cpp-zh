  md: "way to rearrange the rows and columns in a table is to format both variables\
    \ and to use the ORDER=FORMATTED option on PROC FREQ statement. The following\
    \ program uses this method to rearrange the rows and columns in the previous table:\n\
    \n# Program 10.2: Rearranging Rows and Columns in a Table and Computing Relative\
    \ Risk\n\n```\nproc format;\n    value $gen '*M' = '1:Male'\n                \
    \  '*F' = '2:Female';\n    value attack l = '1:Yes'\n                    0 = '2:No';\n\
    run;\n```\n\n```\ntitle Reordering Rows and Columns in a 2x2 Table;\nproc freq\
    \ data=risk orders-formatted / chisq Heart_Attack relrisk;\n    tables $gen. Heart_Attack\
    \ attack.\n    format $gen. Heart_Attack attack.\nrun;\n```\n\nYou start by creating\
    \ temporary formats, one for Gender and one for Heart-Attack. The trick used here\
    \ is to arrange the format variables so that they are in alphabetical order, which\
    \ corresponds to the order in which you want your table rows and columns.\n\n\
    Remember that the default ordering of tables in PROC FREQ is by the initial value\
    \ of the variables, and not by the formatted values. ORDER=FORMATTED option if\
    \ you want the rows and columns to be arranged by the formatted values. Making\
    \ just formats is not enough—you need to associate the two formats with the corresponding\
    \ variables in a FORMAT statement. In this program, the option RELRISK was added\
    \ so that SAS would compute relative risk and odds ratios.\n\nA cohort study typically\
    \ compares some outcome, such as having a heart attack, between two or more groups.\
    \ For example, you might compare heart attack rates between people with cholesterol\
    \ levels above 140 to heart attack rates of people with cholesterol levels below\
    \ 140. One way to report your results is to compare the incidence rates (the proportion\
    \ of people who have a heart attack) between the two groups. The ratio of incidence\
    \ rates is called the relative risk (also called a risk ratio).\n\nA case-control\
    \ study starts with a group of subjects that have a given outcome (cases) and\
    \ a group of people who do not have the outcome(controls). For example, suppose\
    \ you want to study possible causes for leukemia in children. This disease is\
    \ relatively rare, so a cohort study would be impractical (you would need to compare\
    \ very large groups of"
  merge: -1
  pgno: 183
- img_proc: true
  md: '# 168 SAS Statistics by Example


    subjects in order to have enough subjects who develop the disease). Instead, you
    would use a cancer registry to identify a group of children with leukemia. Next,
    you would identify a similar group of children who do not have leukemia. Finally,
    you would compare risk factors, such as exposure to toxic chemicals, between the
    two groups. One would report your odds of disease in the group that was exposed
    to toxic chemicals (the cases) to the odds of disease in the group that was not
    exposed to toxic chemicals (the controls). The ratio of these odds is called an
    odds ratio.


    In a case-control study, you can use the odds ratio as an estimate of the relative
    risk. This estimate is more accurate when the incidence rates are low (which is
    usually the reason for doing a case-control study in the first place). When you
    get SAS statistics for a 2x2 table, it computes both relative risk and odds ratios.
    Based on your study, decide which one to use.


