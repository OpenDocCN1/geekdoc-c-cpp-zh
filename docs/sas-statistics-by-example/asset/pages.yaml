  md: "# 174 SAS Statistics by Example\n\nProgram 10.5 contains the macro code:\n\n\
    # Program 10.5: A SAS Macro for Computing Chi-Square from Cell Frequencies\n\n\
    ```\n********************************************************************\nMacro\
    \ CHISQ\nPurpose: To compute chi-square (and any other valid\nPROC FREQ TABLES\
    \ options) from frequencies in a\n2 x 2 table.\nSample Calling Sequences:\n%CHISQ(10,20,30,40)\n\
    %CHISQ(10,20,30,40,OPTIONS=CMH)\n%CHISQ(10,20,30,40,OPTIONS=CHISQ CMH)\n********************************************************************/\n\
    %macro chisq(a,b,c,d,options=chisq);\n  data chisq;\n    array cells[2,2] _temporary_(a\
    \ &b c &d);\n    do row = 1 to 2;\n      do Col = 1 to 2;\n        Count = cells[Row,Col];\n\
    \        output;\n      end;\n  end;\nrun;\n proc freq=chisq;\n  tables Row* &options:\n\
    \    weight Count;\n  run;\n%end chisq;\n```\n\nTo demonstrate how to use this\
    \ macro, suppose you copy this program to a folder called C:\\SASPROGS\\MACROS\
    \ and rename the file CHISQ.SAS. You then have several choices. One is to open\
    \ the file in the editor of SAS Display Manager and submit it. Other is to use\
    \ the following command:\n\n```\n%include 'c:\\sasprogs\\macros\\chisq.sas';\n\
    ```\n\nAfter issue the command, click the Submit icon. Now the macro is ready\
    \ to be used. If the four cells of your table are 30, 10, 15, and 40 (in the order\
    \ top left, top right, bottom left, bottom right), you would submit the following\
    \ line:\n\n```\n%chisq(30,10,15,40)\n```\n\nSAS will produce the same output that\
    \ you saw in Program 10.4. This macro call (calling a macro is the SAS terminology\
    \ for running a macro) does not end in a\n\nCody, Ran. SAS® Statistics by Example.\
