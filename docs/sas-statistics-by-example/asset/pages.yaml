    Notice that the two subjects with missing values for Gender are now included in
    the body of the table. Even more important, the percentages for females and males
    have changed. When you use the MISSING option, SAS Institute treats missing values
    as a valid category and includes the missing values when it computes percentages.
    To summarize, without the MISSING option, percentages are computed as the percent
    of all nonmissing values; with the MISSING option, percentages are computed as
    the percent of all observations, missing and nonmissing.


