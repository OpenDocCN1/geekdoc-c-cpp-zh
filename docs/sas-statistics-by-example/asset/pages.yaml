    # Conducting a One-Sample t-test Using PROC UNIVARIATE


    PROC UNIVARIATE is not the most up-to-date way to conduct a one-sample t-test.
    The decision to include this method of conducting a one-sample t-test was two-fold:
    First, you might need to run or modify other programs that used this method to
    conduct one-sample t-tests. The other reason is that using PROC UNIVARIATE produces
    a set of values that you can test for normality.


    If you run PROC UNIVARIATE without any procedure options, part of your output
    contains several statistical tests that compare each variable in your VAR list
    against zero. The next program produces that kind of output.


