    # Introduction


    SAS/STAT software includes a procedure called SURVEYSELECT that you can use to
    select random samples from a SAS data set. You have a choice of a simple random
    sample (without replacement), an unrestricted random sample (with replacement),
    or more complicated samples that include stratification or probability-proportional-to-size
    (PPS) sampling. This chapter demonstrates how to select random samples with and
    without replacement. For details on more complicated schema, see the SAS/STAT
    User’s Guide (available on your SAS Help menu).'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# Taking a Simple Random Sample


    PROC SURVEYSELECT takes you a simple random sample from a SAS data set by specifying
    the sample size or by specifying the proportion of the input data set that you
    want to select. You also have control over how SAS chooses the seed value that
    it uses to create the random sequence. If you supply a fixed seed, then each time
    you run the procedure obtain the same sample. A fixed seed is useful if you need
    to create the exact random sample at another time. If you do not supply a seed,
    you obtain a different random sample each time you run the procedure.


    In the example that follows, you want to take a 10% random sample from the data
    set (which contains 500 observations), and you want to supply a fixed seed:


    # Program 14.1: Taking a Simple Random Sample


    ```

    title "Taking a Simple Random Sample";nproc surveyselect data=risk out=risk_sample

    method = srs

    samprate = .1

    seed = 1357924;

    ```


    You identify the input data set with DATA= and the output data set with OUT=.
    METHOD=SRS indicates that each observation in your input data set has an equal
    probability of being selected and that the same observation cannot be selected
    more than once (selection without replacement). To specify a 10% sample, you set
    the SAMPRATE equal to .1. To specify a sample size rather than a sampling rate,
    use the SAMSIZE= option instead. To specify a seed value, use the SEED= option
    and select any integer for this value (larger numbers, 7 to 9 digits in length,
    are preferred).'
  merge: -1
  pgno: 252
