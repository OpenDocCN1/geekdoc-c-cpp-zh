  md: '# 70 SAS Statistics by Example


    You will be using the exercise data set for the examples in this chapter. The
    following variables are in this data set:


    | Variable Name | Type | Description |

    | --- | --- | --- |

    | Subj | Numeric | Subject number |

    | Age | Numeric | Age years |

    | Pushups | Numeric | Number of pushups subject can do |

    | Rest_Pulse | Numeric | Resting pulse rate |

    | Max_Pulse | Numeric | Maximum pulse rate |

    | Run_Pulse | Numeric | Pulse rate while running |


    PROC TTEST can perform one-sample t-tests, two-unpaired t-tests, and two-sample
    paired t-tests. This procedure automatically tests the assumption of homogeneity
    of variance for two sample designs and computes t- and p-values for the assumptions
    of equal or unequal variances. If you use ODS Graphics, you can produce different
    types of diagnostic and summary plots.


    Because you might need to run or modify older SAS programs, you will see some
    of the older methods for performing a one-sample t-test in this chapter.


    # Conducting a One-Sample t-test Using PROC TTEST


    Suppose you want to test whether the age of your subjects in the exercise data
    set might reasonably assumed to come from a population with a mean of 50. You
    could write the following program:


    Program 5.1: Conducting a One-Sample t-test Using PROC TTEST


    ```

    title "Conducting a One-Sample t-test Using PROC TTEST";nproc ttest data=exercise
    h0=50 sides=2 alpha=.05;

    var Age;

    ```


    In this program, you specify the null hypothesis with the H0 option on the procedure
    statement. In this example, you have specified that this is a two-sided test (also
    known as a two-tailed test) with ALPHA=.05. Conducting a two-sided test and setting
    alpha to .05 are defaults for this procedure, so including these is optional.
    If you want to conduct a one-sided test or change the value of ALPHA, you can
    enter SIDES=U or SIDES=L if you want to conduct a one-sided test in the upper
    tail (U) or lower tail (L). You can also specify values for ALPHA such as ALPHA=10.'
  merge: -1
