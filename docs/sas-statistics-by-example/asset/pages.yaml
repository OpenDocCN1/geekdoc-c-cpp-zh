    # ## a Format to Create a Categorical Variable from a Continuous Variable


    There are times when you would prefer to create a continuous variable into groups.
    This arrangement would be especially important if you are experiencing a nonlinear
    response for this variable.


    You can use a DATA step to create this new categorical variable, or you can save
    some time and effort and use a format. CLASS variables in PROC LOGISTIC use formatted
    values, so all you have to do is provide a format for a continuous variable. In
