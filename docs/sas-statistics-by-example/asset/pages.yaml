    of the output shows the results of the Wilcoxon signed-rank test. Here the result
    is significant (p = .0234). In this example, you have used a t-test, but it was
    convenient to use a nonparametric paired comparison for this data set. Looking
    at the output, you can see that the p-value using a t-test (.0194), is not much
    different from the p-value that was obtained by using a nonparametric test.


    # Performing a Kruskal-Wallis One-Way ANOVA


    If the normality assumptions for a one-way analysis of variance (ANOVA) are not
    met, you might want to run the nonparametric equivalent test known as the Kruskal-Wallis
    ANOVA. The same statements that you used to run the Wilcoxon rank-sum test also
    run a Kruskal-Wallis ANOVA when your class has more than two levels.


    To demonstrate this, when you use the store data that contains, among other variables,
    a region (Region) and the amount of money spent on music (Music_Sales), here is
    the code:


    # Program 12.5: Performing a Kruskal-Wallis ANOVA


    ```

    title "Performing a Kruskal-Wallis ANOVA";

    proc nway data=store wilcoxon;

    class Region;

    var Music_Sales;

    run;

    ```


    Cody, Ron. SAS® Statistics by Example. Copyright © 2011, SAS Institute Inc., Cary,
    North Carolina, USA.

    ALL RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing.'
