  md: "# 194 SAS Statistics by Example\n\n### Program 11.4: Using a Combination of\
    \ Categorical and Continuous Variables\nods graphics on;\ntitle \"Using a Combination\
    \ of Categorical and Continuous Variables\";\nproc logistic data=risk;\nclass\
    \ Age_Group (ref='*1< 60') / param=ref;\nGender (ref='F') / param=ref; Gender\
    \ Age_Group Chol / clodds\nodel Heart_Attack(event='Yes') = \nunits Chol=10;\n\
    run;\nquit;\nods graphics off;\n\nYou name the two categorical variables on the\
    \ CLASS statement and indicate the reference levels for each. When you have several\
    \ CLASS variables and you want to use reference coding for all of them, you can\
    \ use PARAM=REF as an option on the class statement, as this program demonstrates.\
    \ In this example, a UNITS statement is used so that the odds ratio for cholesterol\
