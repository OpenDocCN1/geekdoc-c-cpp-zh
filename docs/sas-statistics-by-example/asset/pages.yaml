- img_proc: true
  md: "# Chapter 2 Descriptive Statistics – Continuous Variables 37\n\n# Program 2.8:\
    \ Displaying Outliers in a Box Plot\n\n```\n*Program to make a temporary SAS set\
    \ Blood_Pressure_Out that contains two outliers, one for Subj 5, one for Subj\
    \ 55:\ndata Blood_Pressure_Out;\n  set example.Blood_Pressure(keep=Subj SBP);\n\
    \  if Subj = 5 then SBP = 200;\n  else if Subj = 55 then SBP = 180;\nrun;\n\n\
    title \"Demonstrating How Outliers are Displayed with a Box Plot\";\nproc sgplot\
    \ data=Blood_Pressure_Out;\nhbox SBP;\nrun;\n```\n\nThe SET statement is an instruction\
    \ to read each of the observations from data set example.Blood_Pressure. In parentheses\
    \ following the data set name is a KEEP data option. This option tells the program\
    \ that you only want two of the variables (Subj and SBP) to be read from the input\
    \ data set. Finally, IF-THEN statement is true when the value of Subj is equal\
    \ to 5. The assignment statement following the THEN is executed and the SBP value\
    \ is set to 180. In a similar manner, the ELSE-IF statement sets the value of\
    \ SBP to 180 for subject 55.\n\nThe box plot of the modified data set shows the\
    \ two outliers as small circles:\n\n![](img/c2dc351c113ce1bd13c1f82b8e9c388f_53_0.png)\n\
    \nCody, Ron. SAS® Statistics by Example. Copyright © 2011, SAS Institute Inc.,\
    \ Cary, North Carolina, USA. ALL RIGHTS RESERVED. For additional SAS resources,\
