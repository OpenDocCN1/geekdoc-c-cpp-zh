    \ the WEIGHT statement:\n\n# Program 10.4: Computing Chi-Square from Frequency\
    \ Data\n\n```\ndata frequencies;\n  input Treatment $ Outcome $ Count;\ndatalines;\n\
    \  Placebo Sick 30\n  Placebo Well 10\n  Drug Sick 15\n  Drug Well 40\n;\ntitle\
    \ \"Computing Chi_Square from Frequency Data\";\nproc freq data=frequencies;\n\
