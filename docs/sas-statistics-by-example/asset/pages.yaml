    # Computing a 95% Confidence Interval and the Standard Error


    A 95% confidence interval for the mean (often abbreviated as 95% Cl) is useful
    in helping you decide how well your sample mean estimates the mean of the population.
    Another measure, the standard error, is also useful for the same reason. This
    program shows how to compute:


    Program 2.4: Computing a 95% Confidence Interval and the Standard Error";


    ```

    title "Computing a 95% Confidence Interval and the Standard Error"

    proc means data=example.BIood_Pressure n mean cl stderr

    maxdec=3;

    class Drug;

    var SBP DBP;

    run;

    ```


    In this example, some of the options that were used previously have been omitted
    to reduce the size of the output. This program also uses the CLM (confidence limit
    for the mean) to request the interval. SAS uses this option because the upper
    and lower bounds on a confidence interval are also referred to as confidence limits.
    The option STDERR requests that the standard error also be listed in the output,
    as follows:


