  md: '# Chapter 3 Descriptive Statistics – Categorical Variables 53


    Each box in the table contains four values; the meaning of these values is found
    in the key in the upper-left corner of the table. As you see, the top number in
    each box is the number of observations. For example, there are 22 females in the
    Eastern region. In this example, 11% of all observations are females in the Eastern
    region. The third number in each box is a row percentage—20% of the females were
    in the Eastern region. Finally, the fourth number in each box is a column percentage;
    61.11% of the observations from the Eastern region are female.


    Notice the order of the rows and columns in the output. By default, SAS orders
    the rows and columns in a table (or for a single variable) by the internal value
    of the variable—alphabetically for categorical variables and numerically for numeric
    variables. This is why the rows in the previous table were ordered Female→Male
    and the order of the columns was East→North→South→West.


    # Changing the Order of Values in a Frequency Table


    Whether you have a one-way or a two-way table, you might want to control the order
    that SAS uses for the rows, the columns, or both. In the previous example, maybe
    you want the regions to be ordered North→East→South→West. Or you might be computing
    an odds ratio in a 2x2 table and want the first column to be labeled Yes and No.


    You can accomplish these goals in several ways. One is to create a new variable
    from the existing variable, where the internal values are in the desired order.
    Another, easier, method is to associate formats that are in the target order and
    associate that format with your variable. You can then use a PROC FREQ option
    ORDER=FORMATTED to tell SAS to order the rows, columns, or both by their formatted
    values, rather than by their internal values.


    The example that follows this method to force the order of the regions to be North,
    East, South, and West. First the program, then the explanation.


    Cody, Ron. SAS® Statistics by Example. Copyright © 2011, SAS Institute Inc., Cary,
    North Carolina, USA. ALL RIGHTS RESERVED. For additional SAS resources, visit
    support.sas.com/publishing.'
  merge: -1
  pgno: 69
- img_proc: true
  md: "# 54 SAS Statistics by Example\n\n# Program 3.10: Changing the Order of Values\
    \ in a PROC FREQ Table By Using Formats\n\n```\nproc format;\n    value $region\
    \ = '1 North'\n                  'East' = '2 East'\n                  'South'\
    \ = '3 South'\n                  'West' = '4 West';\nrun;\n\ntitle \"Change the\
    \ Order in a PROC FREQ Output\";nproc freq data=store order=formatted;\n    tables\
    \ Gender * Region;\n    format Gender region.;\nrun;\n```\n\nThe four values created\
    \ by the $region format are in the desired order alphabetically. (Note that the\
    \ digits 1, 2, 3, and 4 are part of the format labels, and 1 comes before 2 alphabetically,\
    \ etc.) Including a FORMAT statement in PROC FREQ associates the Region format\
    \ with the variable Region. (Remember that the association is made by the FORMAT\
    \ statement, not because the name of the format is similar to the name of the\
    \ variable.) Finally, to tell SAS to order the table by the formatted values rather\
    \ than by the internal values, you must include the PROC FREQ option ORDER=FORMATTED."
  merge: -1
  pgno: 70
