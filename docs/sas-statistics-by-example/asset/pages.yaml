    # # Using ODS Statistical Graphics to Investigate Influential Observations


    SAS provides several measures to help you identify influential data points—points
    that have more than their fair share of influence on the line or surface. Almost
    all of these measures use the same concept: run the regression model with and
    without a given observation and see the effect on the predicted value or on the
    betas. Depending on the nature of your data, you need to decide what to do after
    you have identified influential observations. In general, you can''t remove them.
    Some of the influential points might be the result of data errors. If that is
    the case, you need to correct the errors and rerun the analysis. You might want
    to investigate why certain points are influential, and perhaps gain insight into
    your data. Finally, if you decide to remove data points, you need to indicate
    that you have done so and provide a rationale for this decision.


    Program 8.6 is the same as Program 8.5, with the INFLUENCE and R (residual) options
    added on the MODEL statement. These options allow SAS to produce some commonly
    used influence statistics. You can also add a Plots= option with PROC REG to obtain
    plots that show influential observations. (If you also add an ID statement and
    LABEL option for the plots, SAS identifies influential points on the plots, using
    values of the ID variable.)


    Cody, Ron. SAS Statistics by Example. Copyright ©2011, SAS Institute Inc., Cary,
    North Carolina, USA. ALL RIGHTS RESERVED. For additional SAS resources, visit
    support.sas.com/publishing.'
  merge: -1
