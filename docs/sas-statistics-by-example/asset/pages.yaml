    # Excel Files with Invalid SAS Variable Names


    What if your Excel file contains variable names in the first row that are not
    valid SAS names? Take a look at the spreadsheet:


    ![](img/c2dc351c113ce1bd13c1f82b8e9c388f_32_0.png)


    Three of the four names are not valid SAS variable names because they contain
    either blanks or invalid characters (percent sign and dashes). The Import Wizard
    to convert this spreadsheet into a SAS data set SAS substitutes an underscore
    character in place of each invalid character in the name. A SAS data set created
    from this spreadsheet would contain the variables ID, Ht_in_Inches, _Fat, and
    Wt_in_Lbs.


    It is possible to use SAS names that contain invalid characters. To include such
    variables, you need to set a system option called VALIDVARNAMES and refer to the
    variable names using a special notation. Using such variables is not recommended,
    however, because doing so creates added complications.'
