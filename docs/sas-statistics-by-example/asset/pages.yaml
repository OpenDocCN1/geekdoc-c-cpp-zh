  md: "# 192 SAS Statistics by Example\n\n# Program 11.3: Using a Format to Create\
    \ a Categorical Variable\n\n```\nproc format;\n  value cholgrp low-200 = 'Low\
    \ to Medium'\n                201-high = 'High';\nrun;\n\ntitle \"Using a Format\
    \ to Create a Categorical Variable\";\nproc logistic data=risk;\n  class Chol\
    \ (param=ref='Low to Medium');\n  model Heart_Attack (event='Yes') = Chol / clodds\
    \ = p1;\n  format cholgrp;\nrun;\nquit;\n```\n\nFirst we need to create a format\
    \ for the cholesterol groups. Next, because you are treating cholesterol groups\
    \ as categories, you need a CLASS statement. The Low to Medium group is chosen\
    \ as the reference level. Finally, and this is important, include a FORMAT statement\
