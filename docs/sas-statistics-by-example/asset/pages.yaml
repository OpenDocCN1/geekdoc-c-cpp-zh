  md: '# Chapter 5 Inferential Statistics – One-Sample Tests 75


    # Program 5.3: Conducting a One-Sample t-test


    ```

    title "Conducting a One-Sample t-test";nproc univariate data=exercise;

    var Age;

    id Subj;

    run;

    ```


    The following section shows the output of interest:


    | Test | Statistic | p Value |

    |---|---|---||

    | Student''s t | t | 22.49856 | Pr > |t| < .0001 |

    | Sign | M | 25 | Pr > |M| < .0001 |

    | Signed Rank | S | 637.5 | Pr > |S| < .0001 |


    By default, PROC UNIVATE tests the assumption that your sample came from a population
    with a mean of zero (labeled Mu0=0 in the output). The results of a one-sample
    t-test are displayed first. In this example, the t-value was about 22.5 and the
    p-value was <0001. The two other statistical tests shown on this output are a
    sign test and the Wilcoxon signed-rank test. You can read about these non-parametric
    tests in Chapter 12.


    To test a null hypothesis that the sample came from a population with a given
    mean, you need to include the procedure option MU=value. For example, to test
    that the sample came from a population with a mean of 50, you would write:


    # Program 5.4: Conducting a One-Sample Test with a Nonzero Null Hypothesis


    ```

    title "Conducting a One-Sample t-test with a Given Population Mean";nproc univariate
    data=exercise mu0=50;

    var Age;

    id Subj;

    run;

    ```'
