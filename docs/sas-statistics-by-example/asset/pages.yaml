  md: 'Because you did not include the UNPACK option for this plot, all four plots
    are shown on a single panel. Here you can see exactly which variables are contributing
    to a subject''s influence. For example, it seems the value of Age for subject
    8 and the values for Age, Max_Pulse, and Run_Pulse for subject 11 are the reasons
    why these two subjects are identified as influential.


    After you have identified influential observations, you need to decide on your
    next step. If possible, you should first try to determine whether any of the influential
    points are the result of data errors. If they are, you need to correct the errors
    and repeat the analysis. If the influential data points are not the result of
    data errors, you might want to investigate additional models that can account
    for these values (including, perhaps, some nonlinear terms).


    If possible, you might also want to collect more data in the same area as the
    influential observations to determine whether the results are similar for other
    subjects. If you decide to run your analysis with influential observations removed,
    you need to state clearly in your discussion that these data values were removed
    and give a rationale for removing them. It is common to run an analysis with and
    without questionable data points to determine whether the major conclusions of
    the study are altered by observations.


    # Conclusions


    In this chapter, you learned how to run multiple regression models. You also saw
    several selection methods that work with small or very large data sets. You learned
    how ODS Graphics can help you determine influential data points and to set the
    assumptions required for multiple regression. Finally, you saw the effect of collinearity
    on your multiple regression models and how to identify influential observations.


    The next chapter deals with statistical techniques that are appropriate to categorical
    data.'
