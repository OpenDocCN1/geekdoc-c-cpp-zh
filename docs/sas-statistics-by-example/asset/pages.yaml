  md: "# Influential Observations in Multiple Regression Models\n\nIn the previous\
    \ chapter, you saw the various ways that PROC REG helps you identify influential\
    \ observations. To see how you can identify such observations in a multiple regression\
    \ model, the next example will predict the number of push-ups using the model\
    \ Pushups=Max_Pulse Run_Pulse (one of the best models that satisfy Mallow's criteria),\
    \ and then it will look for influential observations. Besides using the INFLUENCE\
    \ option, ODS Graphics will be turned on.\n\n# Program 9.10: Detecting Influential\
    \ Observations in Multiple Regression\n\n```\nods graphics on;\ntitle \"Detecting\
    \ Influential Observations in Multiple Regression\";\nproc reg data=exercise\n\
    \ plots(label only) = (cooksd\nstudentbypredicted\ndffits\ndbfetas);\n\nid Subj;\n\
    model Pushups = Age_Max_Pulse Run_Pulse / influence;\nquit;\nods graphics off;\n\
    ```\n\nIn this program, you include a PLOTS= option that you can control exactly\
    \ which plots get created and whether they show individually or in a panel. Because\
    \ the options LABEL AND ONLY are on the left-hand side of the equal sign, they\
    \ apply to all the plots. The LABEL says to use the ID variable to label influential\
    \ points on the plots. The ONLY option indicates that you do not want to produce\
    \ any of the default plots. The following plots are selected:\n\n| Plot Name |\
    \ Description |\n|---|--|\n| Cooksd | Cook's statistic (the effect on the predicted\
    \ value) |\n| Rstudentpredicted | Externally Standardized residuals by predicted\
    \ value |\n| DFFITS | The difference in the overall effect on the beta |\n| DFBETAS\
    \ | The difference on each beta (computed for each variable) |"
  merge: -1
