    +   This next portion shows residuals in a graphical display. The information
    is displayed far in the ODS Statistical Graphics plots that you will see shortly.
    The column labeled Rstudent is a variation (and, in this author''s opinion, a
    great refinement) on the Standardized residuals that were included in the previous
    table. SAS computes the Rstudent value by computing the residual between each
    data point and a regression line that was computed with that data point removed,
    and then dividing by the standard error. Why is this computation necessary? If
    you have a very influential data point, it will pull the line (or surface) closer
    to the point. Then, when you compute the residual, you get a smaller value than
    if you had computed the regression with the data point omitted. Various texts
    refer to the Rstudent residuals as deleted residuals or externally standardized
    residuals.

    Cook''s D measures the effect of each data point on the predicted value. The ODS
    Graphics plot is a better way to see which Cook''s D measures the effect of each
    data point on the predicted value. The ODS Graphics plot is a better way to see
    which data points have large values for this statistic.


    +   Let''s look at the column labeled DFITS (difference in fit statistics). This
    value reflects an overall change in the beta (slopes) if you run the regression
    with and without each data point.


    +   The last columns of the output are of interest only when you are running regression
    models. The DFBETAS (difference in the betas) show the effect of the data point
    in question on each of the betas in your model. The DFBETAS are discussed in the
    next chapter.'
