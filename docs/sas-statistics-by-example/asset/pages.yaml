  md: "# 138 SAS Statistics by Example\n\nmethod runs all possible models with each\
    \ variable alone, then with all variables taken two at a time, three at a time,\
    \ etc. For n predictor variables, this process generates 2ⁿ1 possible models.\
    \ In the example that follows, four predictor variables result in 16-1=15 models.\n\
    \nThe next program demonstrates the RSQUARE selection method:\n\n# Program 9.2:\
    \ Using the RSQUARE Selection Method to Execute All Possible Models\n\n```\nods\
    \ graphics:\n  title \"Demonstrating the RSQUARE Selection Method\";n  proc reg\
    \ data=exercise;\n    model Pushups = Age Rest_Pulse Max_Pulse Run_Pulse /\n \
    \   selection cp adjrsq;\n  run;\n  quit;\nods graphics off;\n```\n\nYou USE THE\
    \ MODEL SELECTION=RSQUARE to instruct the procedure to run all possible regression\
    \ models. Two additional options, CP (Mallows' Cₚ), and ADJRSQ (adjusted R-square)\
    \ are included. The R-square value takes the number of predictor variables into\
    \ account and is useful in comparing models with different numbers of predictor\
    \ variables. Mallows' Cₚ helps you decide if you have too few or too many predictor\
    \ variables in your model. Two decision rules that use Cₚ are discussed later\
