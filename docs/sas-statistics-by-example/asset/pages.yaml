    # Conducting a Two-Sample t-test


    Let''s start with a simple two-sample, unpaired t-test. For this example, you
    will compare the systolic blood pressure (SBP) and diastolic blood pressure (DBP)
    between the males and females (Gender) in the blood_pressure data set.'
