    # Taking a Random Sample with Replacement


    To demonstrate how to select a random sample with replacement, let''s use the
    reading data set and create a sample of size 5. This data set has only eight observations
    so there is a high likelihood of selecting an observation from the input data
    set more than once. Here is the program:


    # Program 14.2: Taking a Random Sample with Replacement


    ```

    title "Taking a Random Sample with Replacement";

    proc surveyselect data=reading out=read_replace

    outuths

    method = urs

    samplesize = 5

    seed = 1324354;

    run;

    ```


    ```

    title "Listing of Data Set READ_REPLACE";

    proc print data=read_replace;

    run;

    ```


    The method URS (unrestricted sampling) is a sampling method that allows an observation
    from the input data set to be selected more than once. An option called OUTUTHS
    was included in this program. Without this option, any that is'
  merge: -1
