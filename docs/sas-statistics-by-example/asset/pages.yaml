  md: '# SAS Statistics by Example


    Here is the program:


    # Program 6.1: Conducting a Two-Sample t-test


    ```

    title "Conducting a Two-Sample T-test";nproc ttest data=example.blood_pressure;

    class Gender;

    var SBP DBP;

    ```


    You name your independent variable on a CLASS statement. Only one CLASS variable
    is allowed and this variable must have exactly two missing values. You name one
    or more dependent variables on a VAR statement. PROC GTEST separates a t-test
    for each variable that you list on the VAR statement. The order of the CLASS and
    VAR statements does not matter.


    Here is the output (for SBP only):


