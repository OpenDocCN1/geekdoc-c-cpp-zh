    # Tests for Other Distributions


    Whether you request probability plots or Q-Q plots (using a QQPLOT statement),
    you can specify several other distributions:


    +   * normal (default)

    * beta

    * exponential

    * gamma

    * lognormal

    * two-parameter Weibull

    * three-parameter Weibull


    For example, to test whether your distribution of ages comes from a three-parameter
    Weibull distribution, you would write your PROBPLOT (or QQPLOT) statement like
    this:


    ```

    probplot Age / weibull (c=est);

    ```


    Most of the distributions require you to specify values for the appropriate parameters.
    The SAS OnlineDoc for details concerning these parameters.


    # Conclusions


    In this first chapter on inferential statistics, you learned how to conduct a
    one-sample t-test using PROC TTEST and PROC UNIVARIATE. Invoking ODS Statistical
    Graphics prior to running PROC TTEST provides you with some useful plots that
    can help you decide whether normality assumptions required for a t-test have been
    met.


    In the next chapter, you will see how to run two-sample-tests, for both unpaired
    and paired data.'
