    # Creating Replicate Samples using PROC SURVEYSELECT


    You can include the REPS=option with PROC SURVEYSELECT to create a data set that
    includes replicates of your sample. This choice can be useful for bootstrap methods
    and Monte Carlo techniques.


    To see how this works, the following program creates three replicate random samples
    of size 5 from the risk data set.


    # Program 14.4: Requesting Replicate Samples


    ```

    title "Requesting Replicate Samples"

    proc surveyselect data=risk out=riskrep

    method = srs

    sampsize = 5

    reps = 3

    seed = 1357924;

    run;

    ```


    ```

    title "Listing of Data Set RISKREP"

    proc print data=riskrep;

    run;

    ```


    This example uses the SAMSIZE option instead of the SAMPRATE option that was used
    in Program 14.1. The REPS=3 option creates three replicate random samples. When
    you use the REPS=option, the resulting data set contains a variable called Replicate
    identifies which replicate a particular observation belongs to. Here is a listing
    of that data set:'
