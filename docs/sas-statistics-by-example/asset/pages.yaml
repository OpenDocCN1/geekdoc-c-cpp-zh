    # A Short-Cut Method for Requesting Multiple Tables


    There is a convenient way to request multiple tables using the TABLES statement.
    The statement:


    ```

    tables A * B;

    ```


    creates a single table of variable A (rows) by variable B (columns). The statement:


    ```

    tables A * (B C D);

    ```


    creates three tables—A by B, A by C, and A by D.


    The statement:


    ```

    tables (A B) * (C D);

    ```


    creates four tables—A by C, A by D, B by C and B by D (in other words, every variable
    in the first list by every variable in the second list).


    You can also request three-way tables (page by row by column) with the statement:


    ```

    tables A * B * C;

    ```


    This statement creates tables of B by C for each separate value of A. Each one
    of the tables will be on a separate page.


