    # Conclusions


    Descriptive statistics should be your first step in data analysis so that you
    can see a summary of the data and better understand their distribution. This chapter
    showed you how to produce numerical and graphical output for continuous variables,
    using a number of SAS procedures.


    The next two chapters will show you how to display descriptive statistics for
    categorical variables and how to investigate bivariate relationships.


