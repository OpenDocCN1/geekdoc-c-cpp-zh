  md: '# Chapter 6 Inferential Statistics – Two-Sample Tests 81


    Let''s examine the output. ① The first section gives you the mean, standard deviation,
    and several other statistics for the dependent variable, SBP. ② The difference
    in SBP between the males and females was -.9615 (female minus male). The standard
    error of the difference was 2.8861. ③ The second section shows the 95% confidence
    interval for each mean, as well as the 95% confidence interval for the standard.
    ④ The 95% confidence interval for the mean difference is computed two ways: one
    under the assumption of equal variance (labeled Pooled) and the other under the
    assumption of unequal variance (labeled Satterthwaite). ⑤ The third section displays
    the t-value and the associated probabilities. ⑥ The last portion of the t-test
    output is for test of equality of variances. If you find to reject the null hypothesis
    that the samples come from populations with equal variances (p=.7679).


    The decision to choose the Pooled or Satterthwaite values is somewhat controversial.
    Some statistians recommend that you look at the p-value for the test of variances
    to decide which t- and p-value to use. Others think that this is somewhat circular
    reasoning and you should decide ahead of time when such assumption is most reasonable.


    # Testing the Assumptions for a t-test


    The t-test automatically conducts the homogeneity of variance assumption for you.
    If you want to determine whether the residuals are normally distributed, you have
