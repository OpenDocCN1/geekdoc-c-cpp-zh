  md: "# Program 8.3: Creating HTML Output That Contains Data Tips\n\n```\nods graphics\
    \ / imagememap=on;\nods listing close;\n\nods html path='c:\\books\\statistics\
    \ by example'\n  path='c:\\books\\statistics by example'\nfile='scatter.html'\n\
    style=statistical;\ntitle Computing Pearson Correlation Coefficients\"\nproc corr\
    \ data=exercise nosimple\n  plots(only)=scatter(ellipse=none);\n  var Rest_Pulse\
    \ Max_Pulse Run_Pulse Age;\n    with Pushups;\n    id Subj;\nrun;\nods html close;\n\
    ods graphics off;\nods listing;\n```\n\nFirst, you need to use the IMAGEMAP=ON\
    \ on the ODS GRAPHICS statement. Next because you want only HTML output and not\
    \ the normal listing, close the listing output.\n\nThis statement sets up definitions\
    \ for the HTML and graphics output. Although you can supply the entire path for\
    \ the HTML output using the FILE= option, it is easier to use a separate PATH=\
    \ to identify the folder where you want the HTML files to go. When use PATH= you\
    \ only need to supply a filename (using the FILE= option) for your HTML file.\
    \ In this example, an HTML file called scatter_html is being put into a folder\
    \ SAS automatically names each of graphics output and those files will be placed\
    \ in the folder you named on GPATH=option.\n\nIn this program, a PLOTS= option\
    \ requests scatter plots (one for each of the VAR variables Pushups). An ID statement\
