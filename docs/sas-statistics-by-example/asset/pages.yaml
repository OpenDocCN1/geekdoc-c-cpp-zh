- img_proc: true
  md: '# Chapter 3 Descriptive Statistics – Categorical Variables 47


    PROC FORMAT creates formats, but it does not associate any of these formats with
    SAS variables (even if you are clever and name them so that it is clear which
    format will go with which variable). To associate a format with one or more SAS
    variables, you use a FORMAT statement. You can place this statement in either
    a DATA step or a PROC step. If you place a FORMAT statement in a PROC step (as
    in Program 3.5), the format will be associated with the variables only for the
    duration of that procedure. If you place a FORMAT statement in a DATA step, the
    formats will be permanently assigned to the variables.


    In a FORMAT statement, you use the keyword FORMAT, followed by one or more variables,
    followed by the format you want to associate with the variables you listed. On
    a FORMAT statement, you must follow each format name with a period. If you omit
    the period, SAS will think that you are writing a variable name and not a format.
    It is slightly confusing—when you create the format with a VALUE statement, you
    do not end the name with a period (SAS knows this is a format name). When you
    write a FORMAT statement, you must end the name with a period.


    Let’s see what happens when you run Program 3.5—here is the output:


