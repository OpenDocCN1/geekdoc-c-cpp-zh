    # Using a Chi-Square Macro


    SAS macros are pre-packaged pieces of SAS code or entire programs that enable
    you to perform tasks more easily. Although writing macros is considered an advanced
    topic, using them is really quite simple. So, with that in mind, you can copy
    the code for this macro from the SAS Web site and use it any time you need to
    compute chi-square for a 2x2 table, when you already have cell frequencies.'
