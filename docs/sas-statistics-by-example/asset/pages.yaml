    # Running a Simple Linear Regression Model


    Suppose you want to predict how many push-ups a person can do, based on his or
    her resting pulse (which is the variable that has the strongest correlation with
    Pushups). You can use PROC REG to run both simple and multiple regression models.
    This procedure also contains a variety of variable selection methods as well as
    a comprehensive set of diagnostic tools.


    You will see how to run multiple regression models in the next chapter. For now,
    let''s run a simple linear regression model:


    # Program 8.5: Running a Simple Linear Regression Model


    ```

    ods graphics on;

    title "Running a Simple Linear Regression Model";

    proc reg data=exercise;

    model Pushups = Rest_Pulse;

    run;

    quit;

    ods graphics off;

    ```


    Notice that this procedure uses QUIT statement. This procedure supports RUN-group
    processing, as does PROC GLM and several other procedures. Remember that RUN-group
    processing means the procedure remains in memory and enables you to'
