    and ID are stored as numeric types and Gender is stored as a character type.


    # Variable Types in SAS Data Sets


    SAS has only two data types: numeric and character. By default, all numeric values
    are stored in 8 bytes, allowing for approximately 15 significant figures, depending
    on your operating system. Character values are stored 1 byte per character and
    can be from 1 to 32,767 bytes in length.


    # Temporary Permanent SAS Data Sets


    SAS data sets can be either temporary or permanent. A temporary SAS data set is
    one that exists for the duration of your SAS session but is not saved when you
    exit SAS. Permanent data sets, as the names remain, when you exit SAS and can
    be accessed in future SAS sessions. The Import Wizard discussed previously uses
    the Work library. Choosing the Work library caused the SAS data set SAMPLEDATA
    to be a temporary data set.


    SAS identifiers are divided into two parts, separated by a period. The part before
    the period is called a library reference (lib for short) and identifies the folder
    where SAS has stored the data set. Both parts of this identifier must satisfy
    the naming conventions mentioned earlier.


    For example, if your data set is called SURVEY and is stored in a library called
    MYDATA, SAS uses the following notation to identify the file:


    ```

    mydata.survey

    ```


