- img_proc: true
  md: '# Program 1.3: Reading Data from a Text File That Uses Spaces as Delimiters


    ```

    data Sample2;

    infile c:\books\statistics by example\delim.txt'';

    length Gender $ 1;

    input ID Age Gender;

    run;

    ```


    The INFILE statement tells SAS to look for the text file. Following the keyword
    INFILE, you place the filename in single or double quotes. The LENGTH statement
    tells SAS that the variable Gender is character (the dollar sign indicates this)
    and that you want to store Gender in 1 byte (the 1 indicates this). The INPUT
    statement lists the variable names in the same order as the values in the text
    file. Because you already told SAS that Gender is a character variable, the dollar
    sign following the name Gender on the INPUT statement following Gender on the
    INPUT statement would have been necessary. If you had not included a LENGTH statement,
    the dollar sign following Gender on the INPUT statement would be necessary. SAS
    assumes variables are numeric unless you tell it otherwise.


    The RUN statement ends the program. Because this program starts with the keyword
    DATA, it is called a DATA step. The previous programs demonstrated PROC steps.
    SAS programs are typically made up of DATA and PROC steps. Each step ends with
    a RUN statement.


    As you did earlier, you can use PROC PRINT to list the observations in the Sample2
    set (as shown in Program 1.4):


    # Program 1.4: Using PROC PRINT to List the Observations in Data Set Sample2


    ```

    title "Listing of Data Set Sample2";

    proc print data=Sample2;

    run;

    ```'
