  md: '# Chapter 2 Descriptive Statistics – Continuous Variables 27


    The VAR statement works with PROC UNIVARIATE in the same way that it works with
    PROC MEANS—it enables you to list the variables that you want to analyze.


    TheOGRAM statement requests histograms. You can follow the HISTOGRAM statement
    with a list of variables. If you omit this list of variables, the procedure produces
    a histogram for every variable you listed on the VAR statement.


    Finally, the PROBPLOT statement requests a probability plot. This plot shows percentiles
    from the x-axis and data values on the y-axis. This example program selects the
    normal distribution using the NORMAL option after the forward slash. If your data
    values are normally distributed, the points on this plot form a straight line.
    To make it easier to see deviations from normality, the option NORMAL also produces
    a reference line where your data values would fall if they were from a normal
    distribution. When you use the NORMAL option, you also need to specify a mean
    and standard deviation. Specify these by using the keyword MU= to specify the
    mean and the keyword SIGMA= to specify a standard deviation. The keyword EST tells
    the procedure to use the data to estimate the mean and standard deviation, instead
    of some theoretical value.


    Notice the slash between the word PROBPLOT and NORMAL. Using a slash here follows
    standard SAS syntax: if you want to specify options for any statement in a PROC
    step, follow the statement with a slash. (Note: It took the author several years
    to figure this out for myself.)


    To save space, the following output shows only the results for the variable SBP.
    Each section is presented separately, with a discussion following each section.


