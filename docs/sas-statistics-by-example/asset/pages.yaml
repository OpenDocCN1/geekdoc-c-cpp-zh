    \ | Character | Gender of shopper (M or F) |\n| Book_Sales | Numeric | Amount\
    \ spent on books |\n| Music_Sales | Numeric | Amount spent on music |\n| Electronics_Sales\
    \ | Numeric | Amount spent on electronics |\n| Total_Sales | Numeric | Total sales\
    \ |\n\n# Producing a Simple Scatter Plot Using PROG GPLOT\n\nYou can produce a\
    \ scatter plot using either the GPLOT or SGPLOT procedure. Both are part of the\
    \ SAS/GRAPH package. The next section in this chapter shows how to produce scatter\
    \ plots using the newer SGPLOT procedure, which is the recommended method for\
    \ making scatter plots. This section is included so that you will understand programs\
    \ that were written before PROC GPLOT was available.\n\nBy supplying few graphics\
    \ options, you can control the appearance of the plot. The first program uses\
    \ PROC GPLOT to plot Book_Sales by Music_Sales.\n\n# Program 4.1: Creating a Scatter\
    \ Plot Using PROC GPLOT\n\n```\ntitle \"Creating a Scatter Plot Using PROC GPLOT\"\
    \nsymbol value=dot;\nproc gplot data=store;\n  plot Book_Sales * Music_Sales;\n\
    run;\nquit;\n```\n\nThe SYMBOL statement before the PROC GPLOT statement is a\
    \ global graphics instruction that tells the procedure to use dots as the plotting\
    \ symbol. Without this statement, the procedure uses the default plotting symbol,\
