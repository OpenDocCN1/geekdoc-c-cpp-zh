- img_proc: true
  md: "# Chapter 11 Binary Logistic Regression\n\nThe EVENT='Yes' option on the MODEL\
    \ statement says that you want to predict the probability of having a heart attack.\
    \ Because the variable Heart_Attack is formatted as Yes and No, you use EVENT='Yes'\
    \ if you wanted to predict the probability of having a heart attack. if you wanted\
    \ to predict the probability of not having a heart attack, you would use EVENT='No'.\n\
    \nIf you do not supply a value for the EVENT option, the procedure will, by default,\
    \ use the first value of the outcome as determined by the alphabetical or numerical\
    \ ordering of the outcome. In this example, omitting the EVENT option would result\
    \ in the model predicting the probability of not having a heart attack (because\
    \ No comes before Yes alphabetically). It is a good idea to use the EVENT= \n\n\
    If you have a numeric outcome variable that is not formatted, you still need to\
    \ place quotes around the event value. For example, if you have a variable Outcome\
    \ with values of 0 and 1 and you want to predict the probability of a 1, you would\
    \ use:\n\n```\nmodel Outcome (event = '1') = predictor variable(s);\n```\n\nThe\
    \ CLODDS=PL option indicates that you want SAS to compute confidence limits on\
    \ the odds ratio using the method of profile likelihood. The profile likelihood\
    \ ratios require much computation than the default Wald-based intervals are preferred\
    \ to the Wald intervals, especially for sample sizes that are less than 50 (Allison\
    \ 1999).\n\nNext, because Gender is a categorical variable, it is listed on a\
    \ CLASS statement. Extremely useful feature of PROC LOGISTIC is that it creates\
    \ dummy variables (also called design variables) for automatically. You can create\
    \ these dummy variables in several ways. The two most popular methods are effect\
    \ coding and reference coding. Effect coding uses the mean level of the predictor\
    \ variable as the reference level, and reference coding uses a single value of\
    \ the predictor variable as reference.\n\nThe option PARAM=REF says that you want\
    \ to use reference coding for your dummy variable. You also have the option of\
    \ choosing the reference level, which is accomplished in this example by setting\
    \ REF='F' (causing females to be the reference level). If your CLASS variable\
    \ is formatted, the formatted value when you enter the reference level. The order\
    \ of the categories of CLASS variables is determined by the formatted values of\
    \ these variables (if you have supplied a format). Also, if you do not supply\
    \ a reference level, the last value is used. In this example the values of Gender\
    \ are M and F, the last value is M because M comes after F in the collating sequence."
