    # Conclusions


    In this chapter, you learned how to compare proportions using PROC FREQ and how
    to compute relative risk and odds ratios. Because the order of the rows and columns
    in your table are important for many of the tests of association, you can use
    formats to control the order of the output. When one or both of your variables
    are ordinal, SAS provides several tests for trend. You learned to use the AGREE
    option on PROC FREQ TABLES statement to compute Kappa, a measure of inter-rater
    agreement. Finally, you learned that PROC FREQ can test frequencies in a one-way
    table against a theoretical distribution.


    When you have several categorical predictor variables or a combination of continuous
    numeric predictor variables, you can use logistic regression to help you predict
    the probability of a particular outcome. In addition, you can see how each predictor
    variable influences the outcome by examining the odds ratios. The next chapter
    covers these topics.


