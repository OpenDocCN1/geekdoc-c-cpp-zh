    # Using PROC RANK to Group Your Data Values


    Although this discussion is slightly off topic for this chapter, it is related
    to PROC

    RANK. Because you have learned how to use PROC RANK to convert raw data values

    into ranks, this seems a good opportunity to demonstrate another useful feature
    of

    PROC RANK—the ability to create ordered groups from your data.


    The PROC RANK option GROUPS=n divides your data values into n groups. Somewhat

    counterintuitively, the n groups are numbered from 0 to n-1. To see how this works,

    Program 12.9 creates a new variable Salary_Group from the Income data. Because

    you specify GROUPS=4, the Salary_Group variable has the values 0 to 3. Here is
    the

    program:


    # Program 12.9: Using PROC RANK to Create Groups


    ```

    "Using PROC RANK to Create Groups"

    proc rank data=salary out=new_salary groups=4;

    var Income;

    ranks Salary_Group;

    run;

    proc print data=new_salary(obs=10) noobs;

    run;

    ```


