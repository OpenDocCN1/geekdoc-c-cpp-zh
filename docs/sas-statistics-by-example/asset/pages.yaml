  md: '# SAS Statistics by Example


    with only one predictor variable, you reject the null hypothesis that the slope
    is zero (p < .0002).


    Further down, you see the root MSE, the R-square and adjusted R-square. The root
    MSE is the square root of the mean square error (124.79) from the ANOVA table.
    This number represents the variance in the system due to error (derived from the
    deviations of each data point to the regression line) in standard deviation units.
    R-square, also called the coefficient of determination, represents the proportion
    of variability in the dependent variable that can be explained by the regression
    model. The R-square adjusts for the number of predictor (independent) variables
    in the model and is of interest when you are running multiple regression models
    (a topic that is covered in the next chapter).


    In this same section, you see the dependent mean and the coefficient of variation.
    In this example, the mean of pushups is 25.3. Finally, the value labeled Coeff
    Var (often written as CV) is the coefficient of variation. This number (22.15)
    is the standard deviation of the error (root MSE) expressed as a percentage of
    the mean. Because this is a unitless a unitless measure, you can use this number
    to compare the error between models in which the units of the dependent variable
    are different.


    This section shows you parameter estimates, along with their standard errors and
    t- values. In this simple regression model, the value of the intercept is the
    value of the dependent variable when the resting pulse is zero. Because a pulse
    rate of zero for someone in this experiment would be unusual (and cause for great
    alarm), there is no valid interpretation of the intercept value. Also, testing
    this value against the null hypothesis that it is zero is not meaningful either.


    The parameter for Rest_Pulse is the coefficient of the resting pulse in the model
    (the beta). Interestingly, there is a small probability (p=.0002) that this value
    came from a population in which this parameter was zero (the baseline model).


    In this example, the least squares regression equation for this model is:


    ```

    Pushups = 69.48749 - .65077 * Rest_Pulse

    ```


