  md: '# Computing Frequency Counts and Percentages


    You can use PROC FREQ to count frequencies and calculate percentages for categorical
    variables. This procedure can count unique values for each character or numeric
    variables. Let''s start by computing frequencies for Gender and Drug in the Blood_Pressure
    data set used in the previous chapter.


    Program 3.1: Computing Frequencies and Percentages Using PROC FREQ


    ```

    title "Computing Frequencies and Percentages Using PROC FREQ";

    proc freq data=example.Blood_Pressure;

    tables Gender Drug;

    run;

    ```


    PROC FREQ uses a TABLES statement to identify variables you want to process. This
    program selects Gender and Drug. Here is the output:


    # Computing Frequencies and Percentages Using PROC FREQ


    The FREQ Procedure


    | Gender | Frequency | Percent | Cumulative Frequency | Cumulative Percent |

    |---|---|---|---||}{

    | F | 28 | 48.28 | 28 | 48.28 |

    | M | 30 | 51.72 | 58 | 100.00 |


    Frequency Missing = 2


    | Drug | Frequency | Percent | Cumulative Frequency | Cumulative Percent |

    |---|---|---|---||}{

    | Drug A: | 20 | 33.33 | 20 | 33.33 |

    | Drug B: | 20 | 33.33 | 40 | 46.67 |

    | Placebo | 20 | 33.33 | 60 | 100.00 |


    By default, PROC FREQ computes frequencies, percentages, cumulative frequencies,
    and cumulative percentages. In addition, it reports the frequency of missing values.
    If you do not want all of values, you can add options to the TABLES statement
    and specify what statistics you want or do not want. For example, if you want
    only frequencies and percentages, you can use the TABLES option NOCUM (no cumulative
    statistics) to remove them from the output, like this:


