    # Computing Descriptive Statistics Using PROC MEANS


    One way to compute means and standard deviations is to use PROC MEANS. Here is
    a program to compute some basic descriptive statistics on the two variables SBP
    and DBP:


    Program 2.1: Generating Descriptive Statistics with PROC MEANS


    ```

    libname example "c:\books\statistics by example*";


    title "Descriptive Statistics for SBP and DBP";

    proc means data=example.Blood_Pressure n miss mean std median

    maxdec=3;

    var SBP DBP;

    run;

    ```


    Because the Blood_Pressure data set is a permanent SAS data set (when it was created,
    it was placed in a folder disk instead of a temporary SAS folder that disappears
    when you end your SAS session), you need a LIBNAME statement to tell SAS where
    to find the data set. In this example, the data set is located in the c:\books\statistics
    by example folder. Remember that SAS data names contain parts: the part before
    the period is a library reference (libref for short) that tells SAS where to find
    the data set, and the part after the period is the actual data name (in this case,
    Blood_Pressure). If you were to use your operating system to list the contents
    of the c:\books\statistics by example folder, you would see a file called:


    ```

    Blood_Pressure.sas7dbat

    ```


    This is the actual SAS data set and contains the descriptor portion and the individual
    observations. The extension .sas7dat indicates that the data set is compatible
    with SAS 7 and later. This is not a text file, and you cannot view it using a
    word processor or Windows programs.


    The TITLE statement causes SAS to print the title at the top of every page of
    output you change the title or turn off all. In this program, the title is placed
    in double quotes. You can also use quotation marks (as long as there are no single
    quotation marks in the title) or, for that matter, no quotation marks at all (SAS
    is smart enough to realize that the text following a TITLE statement is the title
    text).'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# SAS Statistics by Example


    PROC MEANS is a popular SAS procedure that produces a number of useful statistics.
    In this program, the keyword DATA= tells the procedure that you want to produce
    descriptive statistics on the Blood_Pressure data set.


    You can control what statistics this procedure produces by using procedure options.
    These options are placed between the procedure name and the semicolon ending the
    statement, and you can place them in any order. If you omit these options, PROC
    MEANS will, by default, print the number of nonmissing observations, the mean,
    standard deviation, the minimum value, and the maximum value.


    The first two options in this program, N and NMISS, control the number of nonmissing
    and missing values for each variable to be reported. The next three options, MEAN,
    STD, and MEDIAN, request the mean, standard deviation, and the median to be computed.
    The last option, MAXDEC=n, specifies how many digits to the right of the decimal
    point you want in your report. In this program, you are requesting that all the
    statistics be reported to three decimal places.


    The following list describes some of the more useful options:


    | Option | Description |

    |---|---|

    | N | Number of nonmissing observations |

    | NMISS | Number of observations with missing values |

    | MEAN | Arithmetic mean |

    | STD | Standard deviation |

    | STDERR | Standard error |

    | MIN | Minimum value |

    | MAX | Maximum value |

    | MEDIAN | Median |

    | MAXDEC= | Maximum number of decimal places to display |

    | CLM | 95% confidence limit on the mean |

    | CV | Coefficient of variation |


    The VAR statement tells the procedure which variables you want to analyze. If
    you omit a VAR statement, PROC MEANS produces statistics on all of the numeric
    variables in the specified data set (usually not a good idea).'
