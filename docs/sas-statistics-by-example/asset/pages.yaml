  md: '# Displaying the Distribution of Incomes in the Salary Data Set


    ![](img/c2dc351c113ce1bd13c1f82b8e9c388f_223_0.png)


    After looking at these two plots, you decide that a t-test is not appropriate
    with distributions that are so positively skewed. You decide to use a Wilcoxon
    rank-sum test (equivalent to the Mann-Whitney U test), to compare incomes by gender.
    (An alternative would be to look for a transformation such as a log transform
    that would make the distribution closer to normal.) The following program demonstrates
    how to perform this test:


    # Program 12.2: Performing a Wilcoxon Rank-Sum Test (aka Mann-Whitney U Test)


    ```

    title "Performing a Wilcoxon Rank Sum Test";

    procpartway data=Salary wilcox;

    class Gender;

    var Income;

    ```


    PROC NPARIWAY runs a variety of nonparametric tests. The option WILCOX is a request
    to run the Wilcoxon rank-sum test. The remaining statements look identical to
    those used with PROC TTEST. You specify the independent variable with a CLASS
    statement and one or more dependent variables with a VAR statement. Here is the
    result:'
