  md: "# The MATRIX Statement: Creating a Scatter Plot Matrix\n\nIf you want to see\
    \ a matrix of scatter plots (every versus every other variable), you can use a\
    \ MATRIX statement with PROC SGSCATTER. As a simple example, the next program\
    \ produces a scatter matrix for the three store variables Book_Sales, Music_Sales,\
    \ and Electronics_Sales.\n\n# Program 4.8: Producing a Scatter Plot Matrix\n\n\
    ```\ntitle \"Producing a Scatter Plot Matrix\";nproc sgscatter data=store;\nmatrix\
    \ Book_Sales Music_Sales Electronics_Sales /\n    diagonal=(histogram);\nrun;\n\
    ```\n\nIn this program, the variable list follows the keyword MATRIX. If you include\
    \ too many variables in this list, the plots will be very small and not very useful.\
    \ You might want to limit the number of variables to 5 or fewer.\n\nBy default,\
    \ the plots on the diagonal show the variable names. Program 4.8 includes a DIAGONAL=\
    \ option, as well as the HISTOGRAM option. The plots on the diagonal contain a\
    \ histogram of each of your variables. You can include other diagonal options\
    \ in the parentheses, such as NORMAL (adds a normal curve to the histogram), or\
    \ KERNEL (adds a kernel density line to the histogram)."
