    # Creating a Cross-Tabulation Table


    You can PROC FREQ to create a cross-tabulation table. You start out with the keyword
    TABLES. Following this, you specify the two variables of interest, separated by
    an asterisk. For example, the store data set contains the variables Region and
    Gender. If you want to see the distribution of Gender across all values of Region,
    you proceed with


    # Program 3.9: Creating a Cross-Tabulation Table Using PROC FREQ


    ```

    title "Demonstrating a Cross-Tabulation Table using PROC FREQ";nproc freq data=store;

    tables Gender * Region;

    run;

    ```


    This program requests a table of Gender by Region. In this example, Gender will
    fill the rows of the table, and Region will fill the columns.


    The general form of a cross-tabulation request is:


    ```

    tables row-variable * column-variable;

    ```


