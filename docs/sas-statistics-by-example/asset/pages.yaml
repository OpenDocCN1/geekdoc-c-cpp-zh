    # Changing the Midpoint Values on the Histogram


    If you want to change the midpoint values displayed on the histogram, you can
    supply a MIDPOINTS option on the HISTOGRAM statement. For example, if you want
    midpoints to go from 100 to 170 with each bin representing 5 points, you would
    write:


    ```

    histogram / midpoints=100 to 170 by 5;

    ```


    The following histogram used the MIDPOINTS option set to 100 to 170 by 5:


    ![](img/c2dc351c113ce1bd13c1f82b8e9c388f_48_0.png)


    Finally, you could also see a theoretical normal curve superimposed on your histogram
    by including the NORMAL option on the HISTOGRAM statement like this:


    ```

    histogram / midpoints=100 to 170 by 5 normal;

    ```'
