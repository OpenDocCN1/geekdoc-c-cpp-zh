  md: '# Analyzing Factorial Models with Significant Interactions


    This section demonstrates how to analyze a two-way factorial design when there
    is a significant interaction. The store data set was created so that there is
    an interaction between Region and Gender for the variable Music_Sales. The program
    to analyze this model is identical to Program 7.4, by the variable Music_Sales
    is substituted for Electronics_Sales:


    # Program 7.5: Analyzing a Factorial Design with Significant Interactions


    ```

    title "Analyzing a Factorial Design with a Significant Interaction"

    gods graphics off;

    proc glm data=store;

    class Region Gender;

    model Music_Sales = Region | Gender / ss3;

    lsmeans Region | Gender / pdiff adjust=tukey;

    run;

    quit;

    gods graphics off;

    ```


    The following portion of the output shows the main effects and the interaction
    term:


    ![](img/c2dc351c113ce1bd13c1f82b8e9c388f_122_0.png)


    Cody, Ron. SAS® Statistics by Example. Copyright © 2011, SAS Institute Inc., Cary,
    North Carolina, USA. ALL RIGHTS RESERVED. For additional SAS resources, visit
    support.sas.com/publishing.'
  merge: -1
  pgno: 122
- img_proc: true
  md: '# Chapter 7 Inferential Statistics – Comparing More than Two Means 107


    Because the interaction of Region and Gender is significant (p < .0001) you cannot
    easily interpret the main effects. Before you embark on the next step, the interaction
    plot created by ODS Graphics will shed light on why the interaction is significant.


    ![](img/c2dc351c113ce1bd13c1f82b8e9c388f_123_0.png)


    In this plot, you see that the Region by Gender interaction is mostly the result
    of higher sales for males in the east and lower sales for females in the west.


    One way to make comparisons between specific regions and genders is to examine
    the LSMEANS matrix. SAS provides a powerful tool that you can use to compare Gender
    for each Region. You can make such a comparison by specifying a SLICE option on
    the LSMEANS statement. For this problem, you could use the following LSMEANS statement:


    ```

    Ismeans Region*Gender / slice=Region;

    ```'
