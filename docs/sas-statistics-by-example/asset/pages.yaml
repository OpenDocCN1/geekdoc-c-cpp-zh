    # Using the Regression Equation to Do Prediction


    Now that you have a least squares regression equation, you can use this equation
    to predict values of the dependent variable. You can use several approaches to
    accomplish this.


    Because you know the intercept and the betas from the model, you can simply compute
    the value of the dependent variable with a calculator (or with your phone if it
    has that capability). However, that method is not elegant. After all, you are
    using a computer, aren''t you?


    If you want SAS to do the calculations, the simplest way is to create a data set
    that contains the values of the independent variable which you want to predict
    the value of the dependent variable. If you create such a data set, you can add
    these observations to the original data set that you used to run the regression.
    Because the added observations missing values for the dependent variable, they
    will not affect the regression computation. The following program demonstrates
    this approach.


    Cody, Ron. SAS® Statistics by Example. Copyright © 2011, SAS Institute Inc., Cary,
    North Carolina, USA. ALL RIGHTS RESERVED. For additional SAS resources, visit
    support.sas.com/publishing.'
  merge: -1
  pgno: 145
