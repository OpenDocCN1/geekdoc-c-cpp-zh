  md: '# SAS Statistics by Example


    # Introduction


    If you are reading this book, you are probably familiar with various statistical
    techniques but might not have used SAS to analyze data. The primary purpose of
    this book is to show you how to use SAS to perform a variety of statistical tasks.
    To that end, this book provides examples of many of the commonly used statistical
    techniques. Following each example is a discussion of the output. Although this
    is not a book about SAS programming, many of the examples require some data manipulation
    tasks, which will be desired. If you need to gain more SAS programming skills,
    see Learning SAS by Example: A Programmer''s Guide, by this author and published
    by SAS Press.


    This book is divided into five sections: Introduction to SAS, Descriptive Statistics,
    Inferential Statistics, Power/Sample size calculations, and Selecting Random Samples.


    All of the programs and data files in this book are available from SAS Press.
    To download these programs and files, go to http://support.sas.com/authors.


    If you already have familiarity with SAS data sets and how to run SAS programs,
    you can skip this chapter and start right in Chapter 2.


    The remainder of this chapter describes what SAS is, the basic structure of SAS
    programs, how to access some simple data sets, and how to run a SAS program on
    Windows platform.


    # What is SAS


    SAS (pronounced sass) is a collection of programs that are used to read data from
    a variety of sources (text files, Excel workbooks, various databases, etc.), to
    manipulate data with a very powerful programming language, and to perform various
    reporting and data analysis tasks. To run all of the examples in this book, you
    will need access to Base SAS, SAS/STAT, and SAS/GRAPH software.


    SAS runs on many different platforms: PCs, UNIX and Linux systems, and mainframe
    computers. You can run the examples in this book on any of these platforms, although
    there are some small differences in how the data are accessed on the various systems.
    The examples in this book were all run on a PC, because this is by far the most
    popular platform on which SAS is run.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Chapter 1 An Introduction to SAS


    # Statistical Tasks Performed by SAS


    SAS, like many other statistical packages, has built-in procedures for analyzing
    data. These procedures (called PROCs for short) enable you to perform statistical
    texts and analyses. For example, if you want to perform a Student''s t-test, you
    use PROC TTEST, to run a regression, you use PROC REG. The list of statistical
    PROCS is extensive, and not all of them are covered in this book. Even so, this
    is a good place to get started, and many of the most popular statistical tasks
    are covered. The complete guide to all SAS/STAT procedures is available from SAS
    Institute. The documentation is available in more than five volumes (taking up
    about two feet of shelf) or free in HTML or PDF form from the SAS Web site: http://support.sas.com/documentation.
    Select SAS Books are also available on iPad, Kindle, Google eBooks, Mobipocket,
    Books24x7, netLibrary, and Safari Books online.


    # The Structure of SAS Programs


    SAS programs are divided into DATA and PROC steps. With DATA sets you can read
    text from files; create new variables from existing variables; perform logical
    operations on your data; merge, concatenate, and subset your data. PROC steps
    give you the ability to perform pre-defined tasks such as creating frequency distributions
    or performing a t-test. SAS stores data in data sets that are unique to SAS. Your
    data might already be in a SAS data set, in which case you might not need to write
    a DATA step at all. However, even if you are starting with data already in a SAS
    data set, you might want to write a DATA step to perform some manipulation of
    the data, such as performing a transformation, grouping values, subsetting your
    data, or combining data from several data sets.


    # SAS Data Sets


    SAS data sets consist of two parts: a descriptor portion, or metadata (information
    about your data set, such as the variable names and data types), and the data
    values themselves. SAS can create SAS data sets from almost any source. If you
    have raw data in a text file, you can use a DATA step to read the file and create
    your SAS data set. If you have an Excel workbook, or any one of several popular
    database formats, you can either use a SAS procedure to convert the data into
    a SAS data set or use the Import Wizard (part of SAS/ACCESS and available from
    SAS Institute) to point-and-click your way through conversion.'
  merge: -1
