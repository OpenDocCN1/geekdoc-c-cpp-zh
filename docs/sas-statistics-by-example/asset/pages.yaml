    | Outcome | Success | 8 | 8 | 10 | 15 |

    | | Failure | 12 | 12 | 10 | 5 |

    | | | 20 | 20 | 20 | 20 |


    Notice that the success rate appears to increase with increasing doses. You can
    run the following program to test this trend:'
