    # Histograms and Bar Charts


    Sometimes it is useful to show frequencies in a graphical display. With SAS, you
    have several options: First, there is an older SAS procedure called GCHART, which
    is part of the SAS/GRAPH collection of procedures. A newer procedure, PROC SGPLOT,
    can produce a wide variety of plots and charts.


    The first example of a bar chart uses PROC GCHART to display the frequencies of
    a variable called Region (region of the country) from a data set store. You can
    skip this section and go to the next one, which shows how to create a bar chart
    using PROC SGPLOT. However, at some point you might need to run or modify an older
    SAS program that uses PROC GCHART. Here is the code:


    # Program 3.6: Generating a Bar Chart Using PROC GCHART


    ```

    options reset=all;

    pattern value = solid color;

    title "Generating a Bar Chart - Using PROC GCHART";nproc gchart data=store;

    vbar Region;

    run;

    quit;

    ```


    The first statement (OPTIONS, which stands for graphic options), is not mandatory,
    but if you have been using any SAS/GRAPH procedures during your SAS session, it
    is a good idea to reset all options to their default values. Why? Because you
    set any graphic option such as color or plotting style, these options remain in
    effect until you change them. This behavior is similar to TITLE statements, which
    persist unless you change them or omit the titles completely.


    The PATTERN statement enables you to select the type of bar (SOLID in this case)
    and the color of the bars. A useful hint is to set VALUE=EMPTY if you are sending
    the output to a dot matrix printer. The EMPTY option displays only the output
    of the box and keeps you from running out to the office to buy more ink cartridges.


    The VBAR (vertical bar) statement lets you list the variables for you want to
    generate bar charts. If you prefer a horizontal bar chart, use the HBAR statement
    instead.


    Notice the QUIT statement in this program. Certain procedures in SAS such as PROC
    GCHART have having called RUN-group processing. This kind of processing'
