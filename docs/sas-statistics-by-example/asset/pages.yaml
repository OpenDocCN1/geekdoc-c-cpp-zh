    | Age_Group | Age category: 1=<60, 2=60-70, 3=71+ |

    Gender | Gender: M=Male, F=Female Age in years |

    Chol | Cholesterol level |

    Heart_Attack | Heart attack: 1=Yes, 0=No (formatted as Yes and No)


    # Running a Logistic Regression Model with One Categorical Predictor Variable


    This first example shows how to run a logistic regression model predicting heart
    attack as the outcome with Gender as a single predictor variable.


    # Program 11.1: Logistic Regression with One Categorical Predictor Variable


    ```

    title "Logistic Regression with One Categorical Predictor Variable";nproc logistic
    data=risk;

    class Gender (param=ref ref=''F'');

    model Heart_Attack (event=''Yes'')= Gender / clodds= p;

    run;

    quit;

    ```


    This MODEL statement is similar to the MODEL statement of PROC REG. On the left-hand
    side of the equal sign, you specify your outcome variable, and on the right-hand
    side, you list one or more predictor variables.'
