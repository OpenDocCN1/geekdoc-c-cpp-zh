    # Assumption Violations


    The final example in this chapter demonstrates how the diagnostics produced by
    ODS Graphics can help you decide when the assumptions for a t-test have not been
    met.


    In this example, you want to compare Income by Gender, using a SAS data set called
    salary. You might suspect that the distribution of Salary is not normal. The program
    and the Q-Q plots that follow make this clear.


    Here is the program:


    Program 6.5: Using ODS Plots to Test t-Test Assumptions


    ```

    ods graphics on;

    title "Comparing Income by Gender";nproc ttest data=salary;

    class Gender;

    var Income;

    run;

    ods graphics off;

    ```


    The two diagnostic plots, which are generated by default, clearly show that the
    distribution of Income is not normal.'
