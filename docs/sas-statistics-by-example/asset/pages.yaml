  md: '# Conducting Multiple Comparison Tests


    You should probably consider the ANOVA results and multiple comparison tests only
    after you are satisfied that your test assumptions have been met. However, you
    will probably find it more convenient to request multiple comparisons when you
    run PROC GLM the first time. Then, if your model fails to meet the model assumptions,
    or if you do not obtain a significant result, you can ignore the results.


    Some of the more popular multiple comparison tests are the Tukey and Student-Newman-Keuls
    (SNK) tests. You request either of these options on the MEANS statement. For example,
    to request an SNK test, you use:


    ```

    means Region / snk;

    ```


    You can also specify an alpha level higher than the default value of .05, like
    this:


    ```

    means Region / snk alpha=.10;

    ```


    Another way to adjust all pairwise comparisons is to specify the PDIFF option
    on the SMEANS statement. The SMEANS statement computes least square mean. With
    a one-way design, the adjusted SMEANS are the values produced by the MEANS statement
    (however, the PDIFF option is not available on the MEANS statement). When you
    use the PDIFF option, you can also choose what method of Type I error you want
    to use. If you do not specify an adjustment method, the comparisons are made using
    the Tukey method. Popular adjustment options are TUKEY, BON (Bonferroni), and
    DUNNETT (Dunnett''s test). You can get unadjusted pairwise tests by using the
    ADJUST=T option.


    Program 7.2 shows how to request multiple comparisons using both of these methods:


    # Program 7.2: Requesting Multiple Comparison Tests


    ```

    title "Requesting Multiple Comparison Tests";

    proc glm data=store;

    class Region;

    model Electronics_Sales = Region / ss3;

    means Region / snk;

    lsmeans Region / pdiff adjust=tukey;

    quit;

    ```


    Note that adjust=tukey was included as an option even though the Tukey adjustment
    is the default if you do not request an adjustment method. This option is'
