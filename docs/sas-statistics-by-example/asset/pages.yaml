  md: "# Chapter 11 Binary Logistic Regression 197\n\n# Running a PROC LOGISTIC with\
    \ Interactions\n\nWhen you use PROC LOGISTIC, you can specify main effects and\
    \ interactions in your model. In this example, you enter the same three variables\
    \ as in the previous model, along with all the possible two-way interactions.\
    \ In addition, you use a backward elimination technique to build the model.\n\n\
    With the backward elimination method, main effects cannot be removed from the\
    \ model if those effects are involved in an interaction that remains in the model.\
    \ This kind of model is referred to in the literature as a hierarchical model.\n\
    \nWith this program, you will also use ODS Graphics to produce plots of the odds\
    \ ratios and an ROC curve.\n\nAn ROC curve shows the relationship between a false-positive\
    \ rate and the sensitivity of the test. A false-positive rate is the proportion\
    \ of time an observation without the outcome is predicted by the model to have\
    \ the outcome (it is also equal to 1 minus the specificity). Sensitivity is the\
    \ proportion of observations that have the outcome that is predicted by the model\
    \ to have the outcome. Ideally, models have high sensitivity and low false-positive\
    \ rates. You can change the sensitivity of your model (and, therefore, the false-positive\
    \ rate) by choosing a lower probability as predictive of a positive outcome.\n\
    \nAn ROC curve gives you a visual representation of the relationship between the\
    \ false-positive rate and the sensitivity.\n\nAs you might expect, this program\
    \ will be a bit more complicated than any of the previous examples.\n\n# Program\
    \ 11.5: Running a Logistic Model with Interactions\n\n```\nods graphics on;\n\
    title \"Running a Logistic Model with Interactions\";\nproc logistic data=risk\
    \ plots(only)= (roc oddsratio);\nclass Gender (param=ref ref='F');\n  Age_Group\
    \ (param=ref ref='1< 60*');\nmodel Heart_Attack (event = 'Yes') = Gender | Age_Group\
    \ |\n  Chol @ 2 /\n  selection=backward slstay=.10 clodds=pl;\n  units Chol=10;\n\
    \  oddsratio Chol;\n```\n\n![](img/c2dc351c113ce1bd13c1f82b8e9c388f_213_0.png)\n\
    \nCody, Ron. SAS® Statistics by Example. Copyright © 2011, SAS Institute Inc.,\
    \ Cary, North Carolina, USA. ALL RIGHTS RESERVED. For additional SAS resources,\
    \ visit support.sas.com/publishing."
  merge: -1
