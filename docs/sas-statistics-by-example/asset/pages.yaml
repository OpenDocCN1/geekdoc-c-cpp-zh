  md: "# Summary of the Three Models\n\n| Selection Method | Variables in the Final\
    \ Model |\n| --- | --- |\n| Forward | Rest_Pulse, Age, Max_Pulse, Run_Pulse |\n\
    | Backward | Age, Max_Pulse, Run_Pulse |\n| Stepwise | Rest_Pulse, Age |\n\nThe\
    \ main differences in these three models probably results from the vastly different\
    \ entry or staying significance levels. To demonstrate this, the next program\
    \ shows how to set the SLENTRY= option to .15 for the forward selection method:\n\
    \n# Program 9.5: Setting the SLENTRY Variable to .15 Using the Forward Selection\
    \ Method\n\n```\ntitle \"Forward Selection Method\"\ntitle2 \"SLENTRY Set at .15\"\
    ;nproc reg data=exercise;\n  model Pushups = Rest_Pulse Max_Pulse Run_Pulse /\n\
    \  selection = forward slentry=.15;\nquit;\n```\n\nWhen you run this model, the\
    \ variables that are selected are the same as the one you using the stepwise method.\n\
    \n# Forcing Selected Variables into a Model\n\nSometimes you want to use an automatic\
    \ selection method like the stepwise method, but you also want to force one or\
    \ more variables into the model. You can do this with an INCLUDE=n on the MODEL\
    \ statement. As an example, suppose you want to run a stepwise model, and also\
    \ want to be sure that Max_Pulse is included in the model. You can do this by\
    \ placing Max_Pulse first in the list of predictor variables and adding INCLUDE=1\
    \ as a MODEL option. Here is the code:\n\n# Program 9.6: Forcing Variables into\
    \ a Stepwise Model\n\n```\ntitle \"Forcing Variables into a Stepwise Model\"\n\
    proc reg data=exercise;\n  model Pushups = Max_Pulse Rest_Pulse Run_Pulse /\n\
    \  selection = stepwise include=1;\nquit;\n```\n\nWhen you run this model, Max_Pulse\
    \ is forced to be entered first."
