    # Conclusions


    In this chapter, you learned how to display values of categorical variables, both
    in tabular and graphical form. Although you can use several methods to change
    the order of rows and columns in a table, using formats might be the simplest.


    You also learned how to use the built-in styles to create attractive output with
    a minimum of effort. And you saw how to use ODS to send this output to a variety
    of destinations, such as HTML, PDF, and RTF.


    The next chapter finishes up discussion of descriptive statistics by showing you
    how to produce numerical and graphical displays for bivariate relationships.'
