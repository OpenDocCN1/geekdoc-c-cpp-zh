    # A More Efficient Way to Compute Predicted Values


    The process just described might be OK for small data sets (especially when there
    are many independent variables), but highly inefficient. The efficient and elegant
    way to compute predicted values is to run the regression on the original data
    and write the model parameters to a data set. You can then use PROC SCORE to take
    these regression parameters and compute predicted values for new values of the
    independent variable:'
  merge: -1
  pgno: 148
- img_proc: true
  md: '# Chapter 8 Correlation and Regression


    # Program 8.9: Describing a More Efficient Way to Compute Predicted Values


    ```

    title "Describing a More Efficient Way to Compute Predicted Values";nproc reg
    data=exercise noprint outest=betas;

    model Pushups = Rest_Pulse;

    run;

    quit;

    proc print data=betas noobs;

    run;

    ```


    The NOOPRINT option tells the procedure that you do not want any printed output.
    The OUTEST=(output estimates) tells PROC REG that you want the regression parameters
    to be written to a data set (that is called betas). To see exactly what is happening,
    here is what the data betas like:


    # Describing a More Efficient Way to Compute Predicted Values


    | MODEL | TYPE | DEPAR | RMSE | Intercept | Rest Pulse | Pushups |

    |---|---|---|---|---|---||

    | MODEL1 | PARMS | Pushups | 11.1710 | 69.4875 | -0.6577 | -1 |


    This data set has only one observation (there would be more if you run several
    models). The variable Called is the y-intercept (beta 0) for the model, and the
    Rest_Pulse is the beta for slope. The _TYPE_ variable, which is equal to PARMS,
    will be important later when you use PROC SCORE to compute predicted values (this
    procedure can use several types of data to compute scores as factor scores, and
    it uses the _TYPE_ value to know what type of data it is dealing with)


    So, to finish the prediction, you need to run PROC SCORE, like this:


    # Program 8.10: Using PROC SCORE to Compute Predicted Values from a Regression
    Model


    ```

    proc score data=need_predictions score=betas

    out=predictions type=parms;

    var Rest_Pulse;

    run;


    tntitle "Using PROC SCORE to Compute Predicted Values";

    proc print data=predictions noobs;

    run;

    ```


    Cody, Ron. SAS® Statistics by Example. Copyright © 2011, SAS Institute Inc., Cary,
    North Carolina, USA.

    ALL RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing.'
