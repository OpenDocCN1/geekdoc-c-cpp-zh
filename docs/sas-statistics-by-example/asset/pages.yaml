    This is the first chapter in the Inferential Statistics section of the book. This
    chapter shows how to conduct a one-sample t-test using several methods. In addition,
    we will see how to test the assumption of normally distributed data.


    This chapter also demonstrates how to specify plots using ODS Statistical Graphics
    (referred to as ODS Graphics) and how to use the built-in SAS documentation to
    learn how to customize the plots that SAS produces.


