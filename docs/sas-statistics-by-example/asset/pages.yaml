  md: '# 166 SAS Statistics by Example


    +   The output starts with a 2x2 table with Gender as the rows and Heart_Attack
    as the columns. The box at the upper-left corner of the table is the key to the
    numbers in each cell of the table. The top number in each cell is the frequency.
    For example, there were 233 people who did not have a heart attack. The next number
    in each cell is a percentage. Of the 500 people in this, 46.60% of them were females
    who did not have a heart attack. The number in the cell is a row percentage. Of
    all the females, 93.20% did not have a heart attack. Finally, the last number
    in each cell is a column percentage. Of the 442 people who did not have a heart
    attack, 52.71% of them were female.


    In this case, you are probably most interested in the row percent. You can see
    that 6.8% of the females had heart attack, compared to 16.4% of the males.


    +   To determine whether this difference in proportions is statistically significant,
    you look at the value of chi-square (11.234). With 1 degree of freedom (DF), the
    probability of obtaining a chi-square this size or larger, by chance, and assuming
    the null hypothesis of no difference, is p=.0008. Therefore, if your chosen level
    of alpha is .05, you reject the null hypotheses and conclude that the heart attack
    prevalence rates for males and females are not equal.


    The following table describes commonly used options on the TABLES statement:


    | Option | Description |

    |---|---|

    | AGREE | Kappa coefficient of agreement |

    | ALL | A way to get CHISQ, MEASURES, and CMH |

    | CHISQ | Computes chi-square, Fisher''s exact (for 2x2), and several other tests
    |

    | CMH | Cochran-Mantel-Haenszel statistics |

    | FISHER | Fisher''s exact test (needed only for tables larger than 2x2) |

    | MEASURES | Various measures of association, such as Pearson and Spearman | |

    | RELRISK | Computes relative risk (also called risk ratio) |

    | TREND | Computes Cochran-Armitage test for trend |


