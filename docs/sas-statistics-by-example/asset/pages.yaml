    # Generating a Variety of Graphical Displays of Your Data


    SAS 9.2 introduced several important and useful statistical graphics procedures.
    Among the more useful of these are SGPLOT and SGSCATTER. You can use SGPLOT to
    produce histograms, box plots, scatter plots, and much more. SGSCATTER displays
    several plots on a single page (including a scatter plot matrix that is particularly
    useful). The SG procedures come with a number of built-in styles. You can select
    different styles for your output without having to do any programming.


    Let''s see how to produce a histogram and a box plot using SGPLOT.


    # Program 2.6: Using PROC SGPLOT to Produce a Histogram


    ```

    “Using SGPLOT to Produce a Histogram";nproc sgplot data=example.Blood_Pressure;

    histogram SBP;

    ```


    This HISTOGRAM statement produces a histogram, similar in appearance to the histogram
    you obtained with the HISTOGRAM statement in PROC UNIVARI. As you will learn later,
    you can change the appearance of the output when you select


    run;'
