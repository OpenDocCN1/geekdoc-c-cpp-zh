  md: "# 176 SAS Statistics by Example\n\nindividual diagnosis. For example, if the\
    \ probability of a positive diagnosis is 50%, they will agree 50% of the time,\
    \ by chance alone. Coefficient Kappa adjusts for the chance agreement.\n\nThe\
    \ following program shows how you can compute Kappa on data from two raters:\n\
    \n# Program 10.6: Computing Kappa Coefficient of Agreement\n\n```\ndata kappa;\n\
    \    input Rater1 $1. Rater2 $1. @;\ndatalines;\\NY Y N N Y N Y Y Y Y Y Y N N\
    \ N N N Y Y Y N Y N Y N\\NN N N N\nY Y Y N N Y N Y Y Y Y Y N N N N N N N N Y Y\
    \ Y N Y N\n\ntitle \"Computing Coefficient Kappa\";\nproc freq data=kappa;\n \
    \   tables Rater1 * Rater2 / agree;\nrun;\n```\n\nThe short DATA step creates\
    \ a set with two raters (Rater1 and Rater2) and 33 observations (the discussion\
    \ about Program 10.3 for an explanation of the double sign on the INPUT statement).\
    \ The colon in the INPUT statement also needs some explanation. When you use list\
    \ (appropriate for data values that are separated by delimiters), you can provide\
    \ a list of variables on the INPUT statement. If you want to create a character\
    \ variable, you follow the variable name with a dollar sign ($). When you do,\
    \ SAS needs to determine the storage length of that character variable. The default\
    \ length of a character variable when you are using list input is 8 bytes.\n\n\
    You can override this default in two ways: one is to follow the variable name\
    \ with a colon, by an informat. That method is used in Program 10.6. The other\
    \ method is to include an FORMAT statement before the INPUT statement, which associates\
    \ each of your variables with the informat that you want to use (very similar\
    \ to a FORMAT statement, in which you associate variables with formats).\n\nCody,\
    \ Ron. SAS® Statistics by Example. Copyright © 2011, SAS Institute, Inc., Cary,\
    \ North Carolina, USA. ALL RIGHTS RESERVED. For additional SAS resources, visit\
    \ support.sas.com/publishing."
