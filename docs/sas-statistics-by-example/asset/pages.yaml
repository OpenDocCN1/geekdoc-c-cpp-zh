  md: '# Chapter 1 An Introduction to SAS


    This program produces a SAS data set identical to the one created by Program 1.3.


    If your CSV file contains variable names in the first row, then the Import Wizard
    uses these variable names when it creates the SAS data set. Actually, you can
    use the Import Wizard even if the first row does not contain variable names. If
    you do, SAS will name the variables F1, F2, etc. This approach is not recommended.


    # Data Values in Fixed Columns


    You might have a text file in which the value for each variable is in a fixed
    column. SAS has two methods for reading this type of data: column input and formatted
    input. For column input, you follow each variable name on the INPUT statement
    with the starting and ending column for that. If you want to create a character
    variable, you place a dollar sign between the variable name and the column specifications.


    For example, if you have ID data in columns 1–3, Age in columns 4–6, and Gender
    in column 7 of your raw data file, your input statement might look like this:


    ```

    input ID 1-3 Age 4-6 Gender $ 7;

    ```


    ```

    input ID $ 1-3

    Age 4-6

    Gender $ 7;

    ```


    Stylistically, you might prefer to write this statement on three lines, like this
    (so that the variable names line up):


    For formatted input, you specify the column format for the variable using at a
    sign (@) (called a column pointer) followed by the starting column number. Next,
    you use your variable name, followed by a SAS informat—a specification of how
    to read and interpret the next columns. An equivalent statement to read the same
    data for ID, Age, and Gender using formatted input is:


    ```

    input @1 ID $3.

    @4 Age 3.

    @7 Gender $1;

    ```


    The informat tells SAS to read three columns of character data; the 3. format
    says to read three columns of numeric data; the $1 informat says to read one column
    of character data. The two informats n. and $$, are used to read n columns of
    numeric and character data, respectively.


    Cody, Ron. SAS® Statistics by Example. Copyright © 2011, SAS Institute Inc., Cary,
    North Carolina, USA.

    ALL RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/publishing.'
  merge: -1
