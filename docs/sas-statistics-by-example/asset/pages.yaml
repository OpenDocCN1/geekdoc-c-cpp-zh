    correlation matrix scatter plots. With this same facility, you can test assumptions
    that are required for linear and multiple regression. Let''s get started.


    # # Producing Pearson Correlations


    You can use PROC CORR to compute correlations between every variable in one list
    against every variable in another list or to create a correlation matrix. When
    teamed with ODS Graphics, PROC CORR can automatically produce individual scatter
    plots or a matrix of scatter plots.


    The data set contains the following variables:


    | Variable Name | Description |

    | --- | --- |

    | Subj | Subject number |

    | Age | Age of subject |

    | Pushups | Maximum number of push-ups |

    | Rest_Pulse | Resting pulse rate |

    | Max_Pulse | Maximum pulse rate |

    | Run_Pulse | Pulse rate while running |


    Suppose you want to see the correlations between Pushups and the variables Age,
    Rest_Pulse, Max_Pulse, and Run_Pulse. The following program computes these correlations
    and produces scatter plots that correspond to each of your pairs:


    # Program 8.1: Producing Correlations between Two Sets of Variables


    ```

    ods graphics on;

    title "Computing Pearson Correlation Coefficients";nproc corr data=exercise nosimple
    rank;

    var Rest_Pulse Max_Pulse Run_Pulse;

    with Pushups;

    run;

    ods graphics off;

    ```


    When you specify a VAR and a WITH statement, you generate Pearson correlations
    between every variable in the VAR list with every variable in the WITH list. Program
    8.1 uses two options, NOSIMPLE and RANK. The NOSIMPLE option tells that you do
    not want the default output of means and standard deviations for each of the variables
    in the VAR and WITH lists. The RANK option says to order the correlations from
    largest to smallest (by their absolute values). In this example, ODS Graphics
    is turned on. Here are the results:'
