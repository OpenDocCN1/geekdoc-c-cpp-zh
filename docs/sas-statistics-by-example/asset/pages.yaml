    # Tables with Expected Values Less Than 5 (Fisher''s Exact Test)


    If you have tables in more than 20% of the cells have expected values that are
    less than 5, computing chi-square might not be appropriate. For 2x2 tables, two
    options are to use Yates'' correction for continuity or Fisher''s exact test.
    SAS does both automatically. For larger tables, you can request Fisher''s exact
    test if the table is not too large (computation time can become excessive for
    larger tables), or you can collapse cells in the table so the cell frequencies
    are larger.


    To demonstrate how SAS deals with small frequencies for 2x2 tables, the next program
    creates a small data set and then runs PROC FREQ:'
