    # Creating a SAS Data Set from Raw Data


    If you have your data in a text file, SAS can read the text file and create a
    SAS data set. The text file can contain either data values separated by delimiters
    or data values in fixed columns.


    # Data Values Separated by Delimiters


    SAS can read values from a text file in which each value is separated from the
    next value by a delimiter. By default, SAS expects one or more spaces between
    data values. However, it is easy to specify other delimiters, such as commas.
    Let''s start reading a small text file in which spaces are used as delimiters.
    Here''s a listing of this:


    Raw Data with Blanks as Delimiters: File c\books\Statistics by Example\delim.txt


    | ID | Age | Gender |

    |---|---|---|

    | 1  | 23  | M |

    | 2  | 33  | F |

    | 3  | 18  | F |

    | 4  | 45  | M |

    | 5  | 41  | M |

    | 6  |     | F |


    In this file, the three data values on each line represent an ID number, Age,
    and Gender, respectively. Before you write a SAS program to read this text file,
    notice that ID = 6 has a missing value for her age. Because you have delimited
    data, you need a way to specify that the Age value is missing for that subject.
    You can use a period to specify that you have a missing value. In the next example,
    which uses a CSV file, you do not need to use periods for missing values.


    Program 1.3 will read this text file and create a SAS data set called Sample2:'
