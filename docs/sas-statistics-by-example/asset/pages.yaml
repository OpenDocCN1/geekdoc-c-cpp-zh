  md: '# A Simple One-way Design


    The data set store contains the following variables:


    | Variable Name | Type | Description |

    | --- | --- | --- |

    | Region | Character | Region of the country (North, East, South, West) |

    | Advertising | Character | Advertising (Yes or No) |

    | Gender | Character | Gender of shopper (M or F) |

    | Book_Sales | Numeric | Amount spent on books |

    | Music_Sales | Numeric | Amount spent on music |

    | Electronics_Sales | Numeric | Amount spent on electronics |

    | Total_Sales | Numeric | Total sales |


    Suppose you want to determine whether the mean of the Electronics_Sales varies
    by region of the country. You can use PROC GLM (general linear model) to conduct
    a one-way ANOVA. In addition, you can request summary and diagnostic plots using
    ODS Graphics. Here is the program:


    # Program 7.1: Running a One-Way ANOVA


    ```

    ods graphics;

    title "Running a One-Way ANOVA Using PROC GLM";

    proc glm data=store plots = diagnostics;

    class Region;

    model Electronics_Sales = Region / ss3;

    means Region / hotvest;

    run;

    quit;

    ods graphics off;

    ```


    You start running ODS Graphics. Next, you use PROC GLM that you want to use data
    from the store data (data=store). If you do not use a PLOTS option with PROC GLM
    and you run a one-way design, ODS Graphics produces a default box plot that shows
    the distribution of Electronics_Sales for each Region. The DIAGNOICS adds an additional
    panel of plots, as you will see in a moment.


    You specify the independent variable in a CLASS statement. You use a MODEL statement
    to specify your dependent variable as your design. Following the keyword MODEL,
    you specify one or more dependent variables, followed by an equal sign. (An analysis
    is performed on each dependent variable that you list.) Following the equal sign,
    you specify your model. Because this example is a one-way design, simply list
    the single independent variable.'
  merge: -1
  pgno: 108
- img_proc: true
  md: '# Chapter 7 Inferential Statistics – Comparing More than Two Means 93


    By default, PROC GLM produces both a Type I and Type III sum of squares (SS) as
    output. For one-way designs, these will always be the same. For factorial designs,
    the Type I SS shows the effect of each factor as it is entered into the design;
    the Type III SS shows the effect of each factor, controlling for all the other
    factors. You will probably want Type III sums of squares for your ANOVA designs.
    To avoid SAS print both both, you can specify SS3 as an option on the MODEL statement.
    As a general rule, if you specify options by entering them after a forward slash,
    as you do in Proc 7.1.


    The MEANS statement that follows the MODEL statement requests PROC GLM print mean
    and standard deviation for your dependent variable for each value of your independent
    variable. The HOVEST option on the MEANS statement requests that SAS performs
    Levene''s test for homogeneity of variance.


    The order of statements within a procedure usually does not matter. However, in
    PROC GLM, you must specify the CLASS statement before your MODEL statement and
    your MEANS statement (or before other statements such as least square means or
    contrasts).


    PROC GLM uses RUN-grouping processing. The procedure remains in memory so that
    you can submit additional models or modify previously executed models. The QUIT
    statement terminates the procedure. Don''t worry if you forget the QUIT statement.
    SAS closes the procedure if you submit another PROC or DATA step.


