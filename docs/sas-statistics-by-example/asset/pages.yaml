    # Conclusions


    In this chapter, you learned how to produce individual scatter plots as well as
    a scatter plot matrix. You learned that you can use PROC SGPLOT and PROC SGSCATTER
    to produce these plots, or you can use ODS Statistical Graphics with PROC COR
    to compute the correlations and generate plots at the same time.


    In addition to computing Pearson correlations, you learned that you can also compute
    Spearman nonparametric correlations using PROC CORR. Finally, you learned how
    to use PROC REG to run simple regression models, and how to interpret ODS Graphics
    associated with this procedure, to test the underlying assumptions required for
    this analysis.


    In the next chapter, you will use PROC REG to perform multiple regression. You
    will see several methods that you can use to select models for prediction or to
    explain relationships among your variables.


