- img_proc: true
  md: "# Creating Dummy (Design) Variables for Regression\n\nBecause regression models\
    \ can include categorical variables, you might need to create dummy variables\
    \ (also called design variables) that correspond to the values of a categorical\
    \ variable. For example, suppose you want to predict Music_Sales (from the store\
    \ data) given Total_Sales, Gender, and Region. Gender has the values Male and\
    \ Female, Region has the values North, East, South, and West. If a categorical\
    \ variable has k levels, you need k–1 dummy variables. If you choose Male as the\
    \ reference for Gender and West as the reference for Region, you could write the\
    \ following:\n\n# Program 9.7: Creating Dummy Variables for Regression\n\n```\n\
    data Dummy;\n  set Store;\n  create dummy variable for Gender;\nif Gender = 'Male'\
    \ then Male = 1;\nelse if Gender = 'Female' then Male = 0;\nif Region not in ('North'\
    \ 'East' 'South' 'West') then\n  call missing(North, East, South);\nelse if Region\
    \ = 'North' then North = 1;\nif Region = 'East' then East = 1;\nelse East = 0;\n\
    if Region = 'South' then South = 1;\nelse South = 0;\n```\n\n```\nrun;\ntitle\
    \ \"Creating and Using Dummy variables\";nproc print data=Dummy(obs=10) noobs;\n\
    var Region Male North East South;\nrun;\n```\n\nWith all SAS programs, you need\
    \ to be careful with missing or invalid values. In this program, if the value\
    \ of Gender is Male, the dummy variable is set to 1. If the value of Gender is\
    \ Female, the value of Male is set to 0. If Gender has a missing or invalid value,\
    \ Male will be a missing value.\n\nThe next section of code creates three dummy\
    \ variables for Region. You first test to ensure that Region has a valid, nonmissing\
    \ value by using the IN operator. If Region is not equal to one of the values\
    \ in the list that follows this operator, the CALL MISSING routine sets each of\
    \ the three dummy variables to a missing value."
  merge: -1
  pgno: 169
