    # Generating a Correlation Matrix


    If you list all of your variables in a VAR statement with PROC COR (omitting the

    WITH statement), SAS produces a correlation matrix—the correlation of every variable

    with every variable. If you also include an ODS GRAPHICS statement, the

    procedure produces a matrix of scatter plots—really cool. Here is an example,
    using all

    t variables from the exercise data set:


    # Program 8.2: Producing a Correlation Matrix


    ```

    ods graphics on;

    title "Computing Pearson Correlation Coefficients";

    proc corr data=exercise nosimple

    plots = matrix(histogram);

    var Pushups Rest_Pulse Max_Pulse Run_Pulse Age;

    ods graphics off;

    ```


    The PLOTS option is included so that you can use the HISTOGRAM option.

    Without this option, the diagonal of the scatter plot matrix would contain variable
    names.

