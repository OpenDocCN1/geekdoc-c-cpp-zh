    # Generating Spearman Nonparametric Correlations


    PROC CORR can also produce Spearman rank correlations. Just supply the option
    SPEARMAN on the PROC CORR statement, and the procedure computes Spearman coefficients.
    When you include this option, SAS does not produce Pearson coefficients. You need
    to specify both the SPEARMAN and PEARSON options. As an example, here is Program
    8.1, modified to compute Spearman correlations.


    # Program 8.4: Generating Spearman Rank Correlations


    ```

    "Computing Spearman Rank Correlations"

    proc corr=exercise simple spearman;

    var Rest_Pulse Max_Pulse Run_Pulse Age;

    with Pushups;

    run;

    ```


    Cody, Ron. SAS® Statistics by Example. Copyright © 2011, SAS Institute Inc., Cary,
