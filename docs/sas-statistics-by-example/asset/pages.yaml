- img_proc: true
  md: '# SAS Statistics by Example


    used with multiple regression models. When you have multiple predictor variables
    in a model, you will also need tests for collinearity.


    Multiple regression involves trying to predict a dependent variable by looking
    at multiple independent variables. This process is complex, both statistically
    and conceptually. It is almost always wise to develop a model of how you think
    the independent variables should be related to the dependent variables before
    going too far with any analysis. It is easy to be led astray by relying too much
    on the computer.


    # Fitting Multiple Regression Models


    Let''s start by using the same exercise data set from the previous chapter. As
    a reminder, here is the content of this data set:


    | Variable Name | Description |

    | --- | --- |

    | Subj | Subject number |

    | Age | Age of subject |

    | Pushups | Maximum number of push-ups |

    | Rest_Pulse | Resting pulse rate |

    | Max_Pulse | Maximum pulse rate |

    | Run_Pulse | Pulse rate while running |


    Program 9.1 is a fixed model that uses Age and Max_Pulse to predict how many push-ups
    a person can do (Pushups variable).


    # Program 9.1: Running a Multiple Regression Model


    ```

    title "Running a Multiple Regression Model";nproc reg data=exercise;

    model Pushups = Age Max_Pulse;

    run;

    quit;

    ```


    The syntax is straightforward—you name your dependent (outcome) variable, followed
    by an equal sign, followed by as many predictor (independent) variables as you
    want in your model. PROC REG computes an intercept and a coefficient (beta) for
    each of these predictor variables. Here is the output:'
