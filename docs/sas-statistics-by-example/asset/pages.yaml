  md: '# Excel Workbooks


    Because Excel workbooks (or comma-separated values [CSV] files) are so popular
    on PCs, let''s examine how to use the SAS Import Wizard to convert these files
    into SAS data sets.


    The following display shows an Excel workbook called SAMPLE.XLS:


    ![](img/c2dc351c113ce1bd13c1f82b8e9c388f_21_0.png)


    Each of the columns in this workbook contains information about each of our subjects
    (ID, Age, and Gender). The first row of the workbook contains variable names.
    In Excel, these can be anything. In SAS, variable names must conform to a stricter
    naming convention. The maximum length of a SAS variable name is 32 characters;
    the first character of a variable name must be a letter or an underscore, and
    the remaining characters of a variable name can contain letters (uppercase or
    lowercase), numbers, and the underscore character. For example, Income2010, and
    Home_Runs are valid variable names; 1year, Year Income, and Cost% are not SAS
    variable names. Later you will see what happens if the first row of your workbook
    contains variable names that are not valid SAS variable names.'
