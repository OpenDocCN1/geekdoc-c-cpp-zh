    # Performing a Wilcoxon Signed-Rank Test (for Paired Data)


    There is no need to run a nonparametric paired comparison—you first need to compute
    a variable that represents the difference of the two paired values, using a DATA
    step. You can then use PROC UNIVARIATE to perform the Wilcoxon-signed rank test.


    As an example, you can use the reading data set, which contains a subject number
    (Subj), and variable (Before) and (After) reading speed scores. Here is a program
    that creates the difference variable and runs the analysis:


    # Program 12.4: Performing a Wilcoxon Signed-Rank Test


    ```

    data difference;

    set reading;

    Diff = After - Before;

    run;

    select testsforlocation;

    title "Performing a Wilcoxon Signed Rank Test"

    proc univariate data=difference;

    var Diff;

    run;

    ```


    The short DATA step creates the difference variable (Diff). Because PROC UNIVARIATE
    creates so much output, this program uses ODS SELECT to restrict the output to
    the section called Tests For Location. This statement is strictly optional—if
    you omit it, you get the complete output listing from this procedure.


    Cody, Ron. SAS® Statistics by Example. Copyright © 2011, SAS Institute Inc., Cary,
    North Carolina, USA. ALL RIGHTS RESERVED. For additional SAS resources, visit
    support.sas.com/publishing.'
