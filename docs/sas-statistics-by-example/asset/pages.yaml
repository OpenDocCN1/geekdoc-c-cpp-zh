  md: "# Program 8.7: Predicting Values Using the Regression Equation\n\n```\ndata\
    \ need_predictions;\n    input Rest_Pulse @@;\ndatalines;\n    50 60 70 80 90\n\
    ;\ndata combined;\n    set exercise need_predictions;\nrun;\n```\n\nThe set need_predictions\
    \ contains five observations with values for Rest_Pulse. The double trailing signs\
    \ (@ @) on the INPUT statement will you create several observations from one line\
    \ of data. SAS usually goes to create a new line for each iteration of the DATA\
    \ step. The double trailing signs are an instruction to “hold the line” and not\
    \ skip to the next record when the DATA step iter.\n\nAlso notice the DATALINES\
    \ statement. When you use this statement you can place your data directly in the\
    \ program and avoid the trouble of creating a separate external file and writing\
    \ an INFILE statement to tell SAS where to find the data. For readers old enough\
    \ to remember, this statement was called CARDS (as in computer punch cards—if\
    \ you have no idea what this refers to, Google it and see how we did in the old\
    \ days).\n\nTo concatenate the observations from the original data set (exercise)\
    \ and the newly created data set (need_predictions), you use a SET statement.\
    \ This statement causes all the observations to be read from the exercise data\
