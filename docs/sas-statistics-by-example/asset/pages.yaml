    # Computing Tests for Trends


    If one or both of your variables are ordinal (as opposed to nominal), you might
    want to compute a chi-square test for trend. You have a choice here: you want
    to use a Cochran-Mantel-Haenszel chi-square or the Cochran-Armitage test for trend.


    The next example demonstrates both tests. Assume that you have frequencies of
    success and failure for four doses of a drug. Because the doses are in increasing
    order, you can add more “horsepower” by using tests rather than just using a simple
    chi-square statistic. The following table summarizes the results of a hypothetical
    test:


