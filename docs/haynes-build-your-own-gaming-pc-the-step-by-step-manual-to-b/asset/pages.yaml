  md: '# Gaming keyboards


    Gaming keyboards are much easier to pinpoint than mice. Where the latter needs
    to fit a very particular feel, the former is much more objectively measured. The
    primary choice is between a mechanical keyboard (so the keys are individual switches)
    and a membrane keyboard. There are pros and cons for both, though mechanical keyboards
    tend to win out in terms of reliability. Serious gamers should definitely consider
    a mechanical keyboard, but if you’re after a cheaper, more portable option (for
    LANs perhaps) there are still some great membrane keyboards on the market. Outside
    of that there isn’t really much to distinguish between many options besides their
    ergonomic design and the extra gadgets they might offer, such as additional, customisable
    keys.


    # What to look for


    **Mechanical versus Membrane** – Since this will be your big decision, it’s worth
    spending some time looking at the options. As already mentioned, mechanical keyboards
    use a system of separate switches so that each key you press is exactly that –
    there’s no confusion between multiple key presses, they’ll last you much longer
    and they feel more consistent in use. But it does take some getting used to a
    mechanical keyboard, they are heavier than their membrane counterparts and they
    are considerably more expensive. Mechanical will always be better in terms of
    gaming, but it might not be worth the cost.


    expensive. Mechanical will always be better in terms of gaming, but it might not
    be worth the cost.


    **Cherry MX** – If you are looking at mechanical keyboards then you may see the
    term ‘Cherry MX Switches’ of varying colours pop up. These are references to the
    types of mechanical switches being used in that keyboard with red, brown and blue
    being the most common. Red are unrestricted, linear switches preferred for gaming
    – their lack of restriction makes them much more


    ![](img/f51994701f272059dc108a0376ffceb8_100_0.png)'
  merge: -1
  img_proc: true
- pgno: 101
  md: '![](img/f51994701f272059dc108a0376ffceb8_101_0.png)


    responsive. Brown and blue offer a much more tactile response with a noticeable
    ‘bump’ to let you know a key has been pressed, with brown being a quieter key
    and blue still offering the louder click as you type. Your situation will affect
    which of these you want, though these days manufacturers are finding their own
    solutions to this situation.


    **Backlighting** – It might seem like a minor thing, but backlighting is quite
    an important feature to have. It can come in a variety of styles – sometimes just
    the spaces between the keys, other times just the lettering and sometimes both
    – and usually the colour and brightness can be customised. It’s a good feature
    to have, especially for LAN attenders – often the dark rooms will make it hard
    to see where your fingers are resting, and backlighting will fix that.


    **Macro/extra keys** – Some keyboards bring additional buttons along with them,
    ranging from a handful of macro keys on the far left to a whole new array often
    presented like another ten-key number pad. How useful these are will depend on
    the games you play: MMO and perhaps RTS players will get quite a lot from these
    extra key binding options, but most players won’t really


    have much use for them. When looking into this feature, try to evaluate how close
    those extra keys are either to the WASD or the directional buttons, since that
    will directly correlate to how easy they are to access mid-game.


    **Media keys** – Perhaps less important for gaming, media keys are a set of additional
    buttons that directly affect any videos or music you might be playing through
    media software – whether that’s skipping or pausing, or increasing and lowering
    the volume. It’s a handy extra to have, admittedly, but be warned that rarely
    are these buttons hardwired to correspond with the operating systems themselves,
    meaning you’ll likely need to install and run software just to set them up and
    use them and even then they’re not always reliable.


    **Wrist rests** – Though not entirely a necessary option to include since you
    can purchase gel wrist rests anyway, it’s worth thinking about the comfort of
    the keyboard you’re going to be buying. If you’re spending a lot of money, you’ll
    want to know that it can at least be used in a relaxed manner, and offer a rest
    specialised for the keyboard itself will feel better than an optional gel equivalent.
    If the keyboard has a longer section (beneath the spacebar) you may not need one
    anyway, so try to consider the shape of keyboard you’re after as well as the position
    it’ll be placed on your desk so you know 100% that it won’t cause any damage to
    your wrists.'
