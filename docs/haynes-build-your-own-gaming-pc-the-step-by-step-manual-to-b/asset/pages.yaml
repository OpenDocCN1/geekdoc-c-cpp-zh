  md: '# Maintaining the software


    It''s somewhat ironic that physically cleaning your PC is much less tiresome than
    doing so digitally. Through natural use of your computer it will, inevitably,
    become a little untidy. Whether you use it primarily for gaming or not, your PC''s
    software will become filled with redundant programs, duplicate files and folders
    and even leftover temporary installation files. It''s an inevitability, really,
    and all this excess can slow your PC down, not dramatically at first but if you
    don''t keep the spring cleaning up you''ll find it will eventually have a noticeable
    effect on your PC''s performance.


    What you need to do, then, is make a point of cleaning up your software whenever
    you can. It doesn''t have to be a strict, regular thing but you may find it becomes
    something of a habit to follow these few steps once a month or so, and in doing
    so you''ll make sure your PC never becomes bogged down with data. It could be
    worth taking this time to also back up any important data or files you might have


    installed on your hard drive; as sad as it is to say, hard drive failures can
    happen to even the most organised of PC users. Follow these few tips every so
    often, however, and your PC will remain as streamlined as the day you made it.


    If you''re never going to play a game again, you may as well uninstall it – even
    if the space it takes up is inconsequential.


    # Uninstall unwanted software


    Whether it''s games you no longer play, patchers you no longer need or even general
    PC programs


    ![](img/f51994701f272059dc108a0376ffceb8_147_0.png)'
  merge: -1
  img_proc: true
- pgno: 148
  md: '![](img/f51994701f272059dc108a0376ffceb8_148_0.png)


    you downloaded but found you never really needed, there are always programs lying
    around installed on your hard drive that you might not really have much use for.
    Head into the operating system''s software removal feature – in Windows it is
    termed ‘Add or Remove programs’ or ‘Programs and Features’ in the control panel
    – and scroll through the list of options. While it is beneficial to search by
    size, if you’re doing a spot of cleaning it might be better to search alphabetically,
    where you can take a better look at the programs themselves. Any you don’t use
    – or use very rarely – can be uninstalled, freeing up space and removing any would-be
    memory usage. Remember you can always locate the folder where the program’s files
    are installed and look for an executable that will remove the files for you.


    # Use a storage cleaning software


    It might seem somewhat counterproductive to download software to clean up your
    software, but there are some that help greatly in the battle against messy machines.
    Some you will have to pay for, while others – like CCleaner – are available almost
    entirely for free for a wide number of your software maintenance needs.


    The real benefit of these tools are their ‘Cleaner’ options, where you can easily
    – in one menu – remove any unwanted, temporary or duplicate files. It’s great
    for ease of use, and can even let you check the files you want cleaned away and
    the files you don’t. There are many other programs out there that will claim to
    ‘enhance the performance of your PC’, but in truth some of them are little more
    than glorified software removal programs or perhaps even malware. Stick with something
    you can see is reliable – such as CleanMyPC or CCleaner – which are popular for
    a reason and will do everything you need.


    # Clear caches, download folder and desktop


    While CCleaner can help with many of these functions, it’s worth drawing attention
    to the importance of it. Temporary files and cached data is the biggest threat
    to PC performance because it is information that is quite regularly referenced
    and re-referenced by software that you use often – in particular your internet


    CCleaner is your all-in-one software clean-up tool, and can help with every aspect
    of hard drive spring cleaning.'
