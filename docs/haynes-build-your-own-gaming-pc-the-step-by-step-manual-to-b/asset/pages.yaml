  md: '# Research your build


    It is pretty much impossible to pluck a price for a gaming PC from the air as
    there is such a huge variety of hardware. You can, however, say that £799 is a
    good starting point (for the tower, minus the monitor, mouse and keyboard), £999
    is a psychological landmark, £1,299 gets you plenty and £1,999 is ‘Ulp, how much?’
    If you go for the absolute maximum it is possible to spend £4,000, £6,000 or £8,000
    on a gaming PC. To put that in context, some of us take a week’s holiday in Cornwall
    or Spain while others head to the West Indies or safari in Kenya.


    The easiest way to start drafting the specification of your new gaming PC is to
    look at the website of one of the smaller PC builders. They will doubtless offer
    an array of PCs that you can customise using a series of drop-down menu options
    to select the components. While it won’t help with understanding precisely what
    you need, it will rapidly give you a clear idea about the current state of gaming
    hardware and the cost of the components.


    Let’s break down a £1,200 PC build to get an idea of where the money goes and
    give you a sort of checklist for parts you need to add on your own list. There
    is a range of prices for each component, but broadly speaking we can say:


    +   £400 on a 6GB graphics card

    +   £150 on an Intel i5 CPU

    +   £100-£150 on the motherboard

    +   £80 on the case

    +   £70 for a copy of Windows 10

    +   £60-£70 for 16GB of DDR4 memory

    +   £60 on a 500GB solid-state drive

    +   £50-£70 on a 2TB or 3TB hard drive

    +   £50-£60 on the power supply

    +   £40 for air cooler for your CPU

    +   £20 for a DVD drive

    +   Total – circa £1,200


    ![](img/f51994701f272059dc108a0376ffceb8_26_0.png)


    You could buy a custom-built PC from a number of online retailers, even going
    so far as to pick the parts you want, but you still won’t have full control.


    These prices are just guidelines to illustrate how you might break down the cost
    of a decent gaming PC, but in practice you can spend less on every component,
    or you can spend much more. The point here is to illustrate which components eat
    the bulk of the money, which is why the components are listed roughly in order
    of cost.


    One thing is for certain: if you take a £799, £999, £1,299 or £1,999 PC from any
    of the manufacturers and break it down, you won’t be able to build the same PC
    yourself for the same price. The fact you are paying retail prices means it will
    cost you more to build exactly the same PC and that’s without allowing for the
    time you will invest or the convenience of having an assembled PC delivered to
    your door complete with a warranty.


    That might make these prebuilt machines seem tempting, but that’s overlooking
    the whole point of building your own system: flexibility. Sure these machines
    are going to get you up and running quicker and easier and for a comparative price,
    but you won’t ever have exactly the PC you want, and if you shop around smartly
    you’ll find yourself able to find alternatives to the parts in these prebuilt
    rigs that are just as good and perhaps cheaper.


    Of course, the starting point to this comes down to knowledge; knowing what to
    look for with each part will give you the tools you need to make that final purchasing
    decision. Your needs and wants plays into this, and combined with an understanding
    of what each part is for and what technical details you need to pay attention
    to will help you to follow the checklist of necessary hardware and pick out the
    specific purchases one by one. You might have a different way of doing things,
    but methodically going through a list and finding potential options will make
    it seem like a much less overwhelming process. We’re going to cover each part
    in greater detail following on from this and in an order that will help with compatibility.'
