- pgno: 76
  md: '# PART 4 Windows versus Linux


    With a huge majority of the market share, Windows is by far and away the most
    popular operating system for PCs the world over. What this means is that we''re
    fairly confident that you''ll be able to pick up any model of Windows for your
    PC and have few problems adapting to it – even if you haven''t used a PC for five
    years or more! That''s going to take precedence if you''re not willing to learn
    more technical elements, and we''ll acknowledge that. However, we wouldn''t be
    doing our job if we didn''t at least give you the alternatives. Here''s a comparison
    between Windows and Linux, to find out which is for you.


    |  | Windows | Linux |

    |---|---|---|

    | Price | At a cost of around £100 for the basic licence, and up to £200 or more
    for more ''professional'' packages, the cost of Windows can add a lot to the already
    expensive cost of your PC. Don''t worry about shelling out for the seemingly enhanced
    ''Professional'' versions, however, it''s not likely to benefit you. | Since the
    majority of Linux distributions are completely free to download, the obvious winner
    when it comes to price is this operating system. Remember that this doesn''t need
    to be a permanent choice; if you find you don''t enjoy using your installed operating
    system then you can easily switch it out at a later date. |

    | Compatibility (Software) | This is the ultimate strength of Windows, at least
    when it comes to games. With its huge market share, it''s unsurprising that developers
    will first focus on a Windows version of the game, with Mac''s OS X coming next
    and Linux after that. If playing every game as and when they come out is important
    to you then Windows will likely have to be the choice of OS. | Once upon a time
    Linux struggled when it came to game releases; very few were released on the platform
    and it was a sore point for many gamers. Nowadays, however – as the popularity
    of Linux continues to rise – it is becoming a much more viable platform for games.
    It doesn''t hold a torch to Windows in this regard, but these days each new release
    is usually brought over to Linux – albeit not always simultaneously with Windows.
    |

    | Compatibility (Hardware) | We''ll be saying this a lot, but Windows is the most
    popular operating system and so, as a result, it is also more likely to receive
    driver support from hardware manufacturers. It''s unlikely you''ll have many problems
    with your hardware as a result of using Windows. | Manufacturers have made great
    strides in providing driver support for Linux, and since technical savvy gamers
    are – by a large margin – some of the more common users of Linux, the need to
    create compatible drivers for specialised PC gaming hardware means it''s increasingly
    less rare to find your support for the expensive parts in your machine. It''s
    still worth checking, though. |

    | Ease of use | Since Windows is by far and away the most popular platform when
    it comes to PCs, the ease of use of its software is something that Microsoft has
    tried to focus on. Most people will know how to use a Windows PC – even with the
    most basic tasks – and in that regard Windows wins out when it comes to intuitiveness.
    | The ease of use with Linux is dependent primarily on the distribution being
    used. The more popular distros like Ubuntu, Mint and Debian all offer a user interface
    that is very familiar to Windows users, but many of the options and settings are
    in different places. If you''re technically minded and don''t mind an initial
    learning phase, then it''s not like Linux is unintuitive by its very nature. |'
  merge: -1
  img_proc: true
- pgno: 77
  md: '|  | Windows | Linux |

    |---|---|---|

    | Software | Windows comes with a whole host of extra bits of software – and some
    would say far too much of it. In truth there is a lot of bloatware inside even
    the basic Windows install, though there are a number of accessibility and system
    options available that just have no equivalent in Linux. However, these days there’s
    often a free tool that can be downloaded for very specific needs. | Linux relies
    on a particular distribution to quantify just how many extra utilities and software
    packages come bundled with an install. Some are purposefully more svelte in this
    regard, while others bundle in as much as they can. It all comes down to preference,
    but the majority of ‘essential’ utilities are often all there. With Linux, however,
    it’s far easier to install additional utilities and software completely free.
    |

    | Performance | Windows is certainly a user-friendly operating system, but it’s
    not exactly quick. A fresh install on your brand-new PC might seem pretty nippy,
    but after numerous mandatory updates and behind-the-scenes software running at
    start-up, it can soon start to make the OS run slowly. There’s more manual maintenance
    needed to keep Windows running optimally. | Since Linux has a smaller CPU demand
    on the whole, the operating system itself isn’t intruding on your everyday use.
    It’s impossible to objectively compare the two since elements such as performance
    are affected as much by the software you install as anything else. But on average,
    Linux beats Windows when it comes to speed of use as it has a much lower demand
    on your system and less of an eagerness for bloatware. |

    | Security | While popularity does have something to do with the amount of potential
    attacks to a Windows computer, the real issue is the way Windows handles access
    to its files and folders. If you don’t make a concerted effort to protect yourself,
    you’ll be at a bigger risk. | On a foundational level, Linux distros tend to offer
    greater security than Windows. Part of this is because Linux isn’t nearly as popular,
    but the way that Linux handles administration rights (by default all users have
    restricted access) means that if a virus does manage to get through, the damage
    it can actually cause is lessened. |

    | OS flexibility | Since Windows is a product managed, maintained and sold by
    Microsoft, you won’t have much input over the form, function and control of the
    different parts of the OS. It’s not likely to be a concern to most people, admittedly,
    but some will want the flexibility of Linux. | With Linux you not only have myriad
    choices of which distribution you prefer and want to use, but you have much greater
    control over the functions of your machine. It requires a greater technical knowledge
    – or, at least, a willingness to learn – but if you like the idea of being able
    to control everything in your OS then Linux is the way to go. |


    ![](img/f51994701f272059dc108a0376ffceb8_77_0.png)


    Windows has DirectX 12 and Linux has Vulkan, but due to the popularity of the
