  md: '# Joysticks


    There’s been a resurgence of sorts in flight sims of late, with the likes of Elite:
    Dangerous and Star Citizen – among other non-spacefaring equivalents – really
    ramping up the need for a joystick. Of all the accessories and peripherals available,
    the joystick is perhaps the most antiquated, and as a result the most superfluous.
    But much like the effect racing wheels have on driving simulations, a good joystick
    can have a similar effect on flight simulations. It’s certainly a purchase worth
    considering if you want to get truly suckered into Elite: Dangerous et al.


    # What to look for


    Throttle control – This is a distinguishing feature between a good joystick and
    a bad one, giving you more incremental – and, importantly, tactile – control over
    your speed, and in the far reaches of space that counts for a lot in dogfights.
    You’re going to want to favour a separate throttle control over something incorporated
    into the stick itself, but if you’re after a budget option you likely won’t get
    that.


    Z-axis control – All joysticks will feature X- and Y-axis navigation, meaning
    left and right, forward and back. For the most part that will be enough, but if
    you want full control then you’ll want to look for Z-axis control that allows
    you to twist the joystick clockwise or anti-clockwise to alter your craft’s yaw,
    minimising the number of extra turns you’ll need to make to face the right direction.


    ![](img/f51994701f272059dc108a0376ffceb8_113_0.png)'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'HOTAS – This stands for ‘hands-on throttle and stick’, and essentially means
    that the product you’re buying comes with a dual-stick set-up – one for the throttle
    and one for navigational controls. You’ll obviously need to pay more for the extra,
    but for a more realistic simulation experience having this as a feature will be
    extremely important.


    Number of buttons – With the range of joysticks available on the market, it’s
    easy to go too extreme in this regard. Either you’ll have an excessive number
    of buttons – leading to over-complication and awkward use – or you’ll have too
    few, leaving you reliant on having your keyboard by your side. Think about the
    game(s) you’d like to play with your joystick, and how many additional buttons
    you might need.


    # Joystick suggestions


    # Saitek X56 HOTAS


    RRP: £219.99


    The X56 has a build quality well worth its admittedly high price, plus twin throttles
    for control of dual-engine crafts and the addition of the all-important Z-axis
    control. You can even adjust the springs controlling the tension of the stick
    itself, so you can get a pressure that suits your taste.


    # Thrustmaster HOTAS Warthog


    RRP: £349.99


    This is perhaps excessively priced and since the set-up doesn’t feature Z-axis
    control it feels like a bit of an unnecessary expense. But it is modelled on the
    real-world A-10C Thunderbolt II bomber, cased in metallic parts for a robust and
    realistic feel and features twin throttles and tons of extra buttons (that can
    be remapped to throttle control).


    # Thrustmaster T-Flight HOTAS X


    RRP: £49.99


    As an alternative to the Warthog, Thrustmaster has a great affordable option in
    the T-Flight HOTAS X set-up. It doesn’t feature quite as many bells and whistles
    as the expensive equivalents, but it does have Z-axis control, which, as we keep
    saying, is an important feature to include, especially at such a low price.


    # Logitech Extreme 3D Pro


    RRP: £44.99


    The Extreme 3D Pro tends to sell for a lot less than its recommended price, making
    it one of the cheapest joysticks out there. It’s also, for the money, one of the
    better low-end sticks, and though it does have a cheap feel to the buttons it
    is hard to knock what is an otherwise solid, budget-priced joystick. Perfect for
    smaller hands, too.


