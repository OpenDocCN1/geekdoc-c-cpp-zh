  md: '# Gaming controllers


    With the rising popularity of games consoles it has become increasingly common
    for their PC equivalents to come with built-in controller functions, often making
    these games better to play if you discard the keyboard and mouse entirely. Moreover,
    many recent games – in particular 2D indie games – are often much better when
    played with a pad in your hand than the claw-shaped hunch you might have traditionally.
    That might sound incredulous to some hard-core PC gamers, but the truth is that
    in this day and age having a good-quality gaming controller to hand is imperative
    for most PC gamers.


    # What to look for


    Games console design – Too often manufacturers try to add to the tried-and-tested
    official console designs, but for no reason. Look for something that tries to
    keep the simplicity of a console controller (otherwise you’re better just sticking
    with a keyboard), with four face buttons, two analogue sticks, a D-Pad and trigger
    buttons too. Anything else is an optional – and arguably unnecessary – extra.


    Heavyweight pads – The thing about controllers is, unlike a mouse and keyboard,
    you’re actually holding on to them. It might seem like an odd thing to suggest,
    but looking for a heavier controller could actually lead to a more comfortable
    experience; often lightweight controllers have cheaper quality builds, and a heavier
    weight just feels more compelling to use. That doesn’t mean it should be heavy,
    of course, your hands won’t want to take a break.


    ![](img/f51994701f272059dc108a0376ffceb8_109_0.png)'
  merge: -1
  img_proc: true
- pgno: 110
  md: '**Wired versus wireless --** It''s a question you might have asked about keyboards
    and mice, too, but here it''s more of a matter of personal taste. A wired controller
    will give you a much simpler set-up process, while a wireless one obviously gives
    you greater freedom of movement when playing – even if it does require new batteries
    or recharging from time to time.


    # Controller suggestions


    **Microsoft Xbox 360 controller for PC**


    *RRP: £29.99*

    This is the very same controller that was so well loved for the Xbox 360 but with
    a wire. As a Microsoft product, its drivers are built into Windows so in most
    cases it should be as simple as plugging it into a USB port and playing, without
    any real struggle. If you already have a wireless Xbox 360 or Xbox One controller,
    you can even buy a USB adapter and use that.


    **Razer Wolverine Tournament Edition Chroma**


    *RRP: £119.99*

    It''s much more expensive for what is, essentially, another Xbox One controller,
    but Razer brings a PC mindset to this pad. It''s got four sensibly placed, customisable
    buttons – if that''s something you need – an improved D-Pad, customisable lighting
    on the buttons and a unique ''Hair Trigger'' mode that allows for quicker firing
    in FPS games. It''s the option to go for if you really care about a gaming controller.


    **Sony DualShock 4**


    *RRP: £49.99*

    PlayStation and Xbox have always had a rivalry and nowhere is that more apparent
    than with their controllers, with devout users on either side. It''s a case of
    picking your poison, really, but the overall build quality of the DualShock 4
    edges it out, even if you will need to download some software to get it to function
    with your PC. There''s not much point getting the Xbox One equivalent if you can
    pick up a 360 one for less.


    **Logitech Gamepad F310**


    *RRP: £24.99*

    If you want to avoid using a controller as much as possible and only want a budget
    option for when you simply have to use a gamepad, then this will be the one for
    you. It uses the familiar parallel analogue stick design of the DualShock and
    is very easy to set up, but it is cheaper and feels it too. A great option to
    chuck in for the LAN events, however.


    ![](img/f51994701f272059dc108a0376ffceb8_110_0.png)


