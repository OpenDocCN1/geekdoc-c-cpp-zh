  md: '| Type of setting | What it affects | Details |

    |---|---|---|

    | Anti-aliasing (MLAA – Morphological) | Smooths hard edges of pixels for a more
    natural appearance. | A form of AA unique to AMD cards. This uses a unique algorithm
    to detect jagged edges in an entire frame/scene, and smooths it out. For any anti-aliasing,
    the higher number before this means more accuracy at a higher cost on your CPU
    and GPU. |

    | Anti-aliasing (SMAA – Enhanced Subpixel Morphological) | Smooths hard edges
    of pixels for a more natural appearance. | An enhanced version of MLAA that also
    utilises methods of MSAA. For any anti-aliasing, the higher number before this
    means more accuracy at a higher cost on your CPU and GPU. |

    | Anti-aliasing (TXAA – Temporal) | Smooths hard edges of pixels for a more natural
    appearance. | Utilises MSAA techniques with other filters, while using existing
    frame AA data to compute the next frame. For any anti-aliasing, the higher number
    before this means more accuracy at a higher cost on your CPU and GPU. |

    | Anti-aliasing (MFAA – Multi-frame) | Smooths hard edges of pixels for a more
    natural appearance. | Exclusively to NVIDIA''s new Maxwell range, MFAA allows
    more customisable patterns of anti-aliasing. For any anti-aliasing, the higher
    number before this means more accuracy at a higher cost on your CPU and GPU. |

    | Ambient occlusion (SSAO) | Attempts to display lighting in a more realistic
    fashion. | As a process-heavy option, SSAO can be one of the first you can disable.
    It can help to make lighting look more realistic since it attempts to calculate
    which parts of a scene should have less light than another. |

    | Bloom | Exaggerates lighting for a stronger visual appearance. | Bloom is more
    of an artistic element, and is most notable for having the light render more intensely,
    appearing to spill out over the edges of windows and the like. Sometimes it helps
    create a unique visual cue, but can often be disabled. |

    | Depth of field | Visual effect to make distant or peripheral vision blurred.
    | Depth of field is a post-processing effect that draws attention to centralised
    objects while additional details appear blurred. As a post-processing effect,
    this is often superfluous and can be disabled. |

    | Detail quality | Controls the quality of particular details. | This can often
    take any form, sometimes simply called ''Detail'' and other times with greater
    specificity, such as ''Grass/Foliage detail''. This is often referring to more
    minute elements of a game, however, and can be one of the first adjustments you
    need to make. |

    | HDR (High dymanic range) lighting | Improves the range of detail from light
    areas to darkened areas. | HDR is a very process-heavy feature that can be disabled
    first if your PC is beginning to age. A higher range allows for better detail
    in the darkest and lightest parts of a scene. |

    | Shadow quality | Controls the overall quality of shadows. | As a superfluous
    graphical option, shadows can often be controlled – as with textures – to better
    match your hardware. Lower quality provides better performance. |

    | Motion blur | Adds blurring to camera movements. | For a more cinematic feel,
    this post-processing effect replicates the way a camera processes movement – namely
    blurring pixels to give the impression of speed or movement. |

    | Particle effects | Controls the strength, quality or regularity of particle
    effects. | Particle effects are often superfluous extras that help make a scene
    feel more realistic, such as dust mites floating in a beam of light or dirt being
    kicked up off the ground during a fight. Some games give you the option to customise
    these elements in a number of ways. |

    | PhysX | Adds more realistic physics-based actions. | PhysX controls a game''s
    ability to render realistic physics-based reactions – such as debris flying away
    after a devastating blow. It is often a toggleable option. |'
