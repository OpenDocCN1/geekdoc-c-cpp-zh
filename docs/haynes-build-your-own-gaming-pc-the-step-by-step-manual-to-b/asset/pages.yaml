  md: '# PART 5 Monitors


    Buying a monitor for gaming is even more arduous than buying a new TV; while you’re
    looking at all the same tech details – such as contrast ratio – you now also want
    to pay more attention to refresh rate and response time. What this amounts to
    is a lot of confusing numbers and no real certainty that the one you’ll get is
    the best; hopefully we can dispel some of those concerns. Further questions are
    derived from how you want your set-up to look: do you want to run multiple screens?
    A single larger one? A wider screen with an unusual aspect ratio? There are too
    many options, too many variables to consider, so we’ve picked out the key facets
    you need to know about buying the best PC gaming monitor.


    # What to look for


    Aspect ratio – Gaming monitors come in all shapes and sizes, and aspect ratio
    – or the width of the screen versus the height – is a large reason for this. But
    as gaming dimensions have become a little more standardised over


    the years, 16:9 is the standard to aim for. This will be the same as your TV,
    most likely, and if you’re not too fussy about how much of your games you can
    see then it’s easier just to stick with this. If you want a wider viewpoint in-game,
    however, for a kind of vision more akin to our own human eyes then you might want
    to look into wider aspect ratios. Again


    ![](img/f51994701f272059dc108a0376ffceb8_103_0.png)'
  merge: -1
  img_proc: true
- pgno: 104
  md: '![](img/f51994701f272059dc108a0376ffceb8_104_0.png)


    these can be in a variety of sizes, but 21:9 is the more common option, meaning
    more games are likely to be compatible with this size.


    will still be limited by that. If you''re capable of 60 or more, however, then
    you''re going to want as fast a refresh rate as possible. 60Hz (or hertz) is the
    standard for most gaming monitors, but it''s not uncommon for 120Hz, 144Hz or
    240Hz to be built into modern monitors. If your PC is going to be a beast, then
    you want as high a refresh rate as possible – it''ll produce a smoother image,
    look much nicer during play and will be much more relaxing for your eyes.


    # Resolution versus size –


    It''s easy to say ''just go for the highest resolution'', but up to a certain
    point an increase in resolution is actually irrelevant. At around 21 inches you''re
    not really going to need to spend the extra to increase the resolution. If you
    start going over that, however, you''ll probably want to start looking at higher-res
    screens. This will be affected by the aspect ratio you''re going for too, naturally,
    but with bigger screens you''re going to want as high a resolution as possible
    since it will mean not only more detail in your games but also in every aspect
    of your PC usage. Remember though, boosting a game''s output resolution is one
    of the most significant impacts you''ll make to your overall performance, so if
    you''re aiming for 4K gaming then you''ll need a GPU (or two) to achieve that.


    # Refresh rates and hertz –


    This is often played up as an important feature for gaming monitors and that''s
    true, it is. However, what many overlook is the possible frame rate you''re capable
    of producing with your games. Your potential frame rate is affected by the graphics
    card you have installed; if you are only capable of producing 30 frames a second,
    then it doesn''t matter how fast your refresh rate is, it


    # Response time –


    Your monitor''s response time is essentially the speed at which it is capable
    of updating with a new input or image. This is measured in milliseconds, so the
    lower the better. Most monitors will have a response time of roughly 8ms or less,
    but the better gaming monitors will measure either 2ms or 5ms. Try not to go for
    anything worse than 16ms, however, since that''s when you''ll start noticing a
    difference.


    # Type of panels –


    One last thing to consider is the type of panel you''re choosing to use, with
    choices between the standard TN panels or the newer technology of IPS panels.
    TN panels are more common and generally offer good brightness and low power consumption,
    but cheaper monitors can have poor colour accuracy, especially at non-perfect
    viewing angles. IPS monitors are much better in this regard with practically perfect
    image clarity'
