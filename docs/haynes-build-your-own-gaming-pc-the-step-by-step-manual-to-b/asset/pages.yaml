- pgno: 145
  md: '# Maintaining your

    hardware


    When it comes to maintenance of your PC hardware there are, thankfully, only a
    couple of things you need to do. Frankly, providing everything’s installed properly,
    there are no reasons why your hardware should have shifted at all. If you move
    your PC regularly the wires might need poking back into out-of-the way places,
    but besides that the hardware you install doesn’t need much special treatment.


    With that said, however, there is one major threat: dust. It’s an unavoidable
    problem, sadly, and one that requires a great deal of effort in ensuring the build-up
    isn’t ever too much. Dust will increase the temperature that your parts run at,
    with your cooling fans struggling to move cool air around as effectively and hardware
    such as your graphics card insulating itself – thus running hotter the longer
    it is under load. You can use the following steps as often as you think necessary,
    but we’d recommend a poke around your machine perhaps once a month to keep an
    eye on any dust build-up, but leave it no more than six months. Any longer than
    that and the dust will become harder and harder to clean off.


    Then there is the thermal paste on your CPU, a process that can be quite intimidating
    for first-timers. If you find your CPU is becoming incredibly hot and perhaps
    even dramatically affecting the stability of your PC then it might be time to
    clean up the thermal paste between your air cooler and the CPU chip. Some recommend
    replacing the thermal paste about once a year – and there are benefits to that
    – but providing you’re not overclocking your machine you should be okay to leave
    the stock paste on there for a couple of years at least.


    # Necessary equipment


    # Compressed air


    A can of compressed air is easily bought from any hardware store and is the safest,
    most efficient way of cleaning dust off computer parts. Only use short bursts
    when using compressed air, since longer blasts could result in condensation. Alternatively
    you can use a powered air blower, which functions in the same way.


    You can buy cans of compressed air for next to nothing at practically any hardware
    store. It’s great for cleaning in between keyboard keys too.


    ![](img/f51994701f272059dc108a0376ffceb8_145_0.png)


    # Static-free cloth


    These special cloths are safe to use on computer parts since they won’t fry your
    hardware with any accidental static electricity. You won’t want to use this to
    clean every part of your machine but it can give you a more effective means of
    removal on flat surfaces – such as the casing on graphics cards – that can become
    more heavily caked in dust. Absolutely do not attempt to clean any part of your
    PC with a cloth if it isn’t static-free.


    # Vacuum


    You won’t want to use a full-powered vacuum on the inside of your PC – the static
    and power involved would be incredibly damaging for your PC. However, using the
    nozzle will be important for cleaning up all that dust later on, and if you can
    get a weaker hand-vacuum you’ll find it’s great for gathering that pesky dust.


    # Cleaning away dust


    +   - Start by unplugging all the cables from your PC, and place it on a flat
    surface – standing is fine in this case, since dust will simply fall back on to
    the motherboard if it is lying flat. Remove any side panels you have, both if
    your case has two.

    +   - At this point take note of any cables. Though they should already be tidied
    away, it’s good to check and make sure they won’t cause any accidents with your
    hardware. If they aren’t already, use cable ties to tidy away any loose cables.

    +   - Using a can of compressed air, blow on each of the parts to dislodge any
    dust. Do this at an angle but fairly close so as to ensure the dust flies out
    away from the case. Pay particular attention to each of your PC’s fans, the power
    supply unit.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '(this is imperative) and any extra cards installed into the PCI slots – such
    as your graphics card.


    +   If you haven''t much space in your case you can consider removing the power
    supply unit and its connected cables. This will free up a large chunk of space
    to get a better angle, and will make it easier to clear away any dust from parts
    blocked by the cables themselves. Remember to wipe the cables clean too using
    the static-free cloth.


    +   The motherboard itself should be relatively free of dust – providing it is
    positioned upright, as is the situation for most cases. All the same, give it
    a spray across the whole motherboard from about three or four inches away to knock
    off any dust.


    +   If you have a smaller nozzle to attach, do


    so and use that to blow away any dust in between the small crevices – such as
    between the memory bays or around the CPU area. Make sure you''re thorough with
    this nozzle, since it will focus the air a lot more intensely.


    +   Finally use your static-free cloth for very gentle strokes across flat surfaces
    and hard edges, such as the top of your graphics card, storage drives or the edges
    of your RAM and fans. The base of the case, now, will likely need dusting too,
    and if you removed the PSU it''ll be easier to clean. Be gentle here, only use
    a small portion of the cloth at a time and don''t use this to clean the motherboard
    or chips on parts like the graphics card; the cloth could easily get snagged on
    something and cause damage.


    # Replacing thermal paste


    +   If you find your CPU becoming unreasonably hot during use, it might be time
    to consider replacing the thermal paste between your CPU chip and the motherboard.
    Some recommend replacing this paste once every 12 months, but if you''re inexperienced
    it''s better to leave well alone until you find problems with your CPU unexpectedly
    affecting performance.


    +   You''ll need to remove any fans installed on to the CPU, whether that is the
    stock fan that comes with the chip or any aftermarket installation you''ve opted
    for. Leave the CPU installed, but first you''ll want to clean the heatsink on
    the fan.


    +   Clean away the existing thermal paste on the heatsink. Use a flat edge, such
    as an old credit card or a business card, to wipe the majority of the paste away
    and then use isopropyl alcohol and a cloth to wipe away the remaining paste. Make
    sure all of the paste has been removed.


    +   Now repeat the process for the CPU, again making sure you keep it installed
    in the motherboard. Use isopropyl alcohol to ensure the CPU is completely free
    of old thermal paste.


    +   Now apply new thermal paste, which can be bought in most hardware stores or
    online very easily. Squeeze roughly a pea-sized amount of thermal paste on to
    the centre of


    the CPU and then place and reattach the heatsink squarely on top to spread the
    paste evenly across the back of the chip. Don''t try to spread it yourself, since
    it needs to remain even.


    +   Some thermal pastes require specific methods of application, so simply refer
    to the instructions with your product to ensure you apply it correctly.


    Thermal paste comes in all shapes and sizes, but it''s not too complicated. The
    Arctic range is generally the most popular.


