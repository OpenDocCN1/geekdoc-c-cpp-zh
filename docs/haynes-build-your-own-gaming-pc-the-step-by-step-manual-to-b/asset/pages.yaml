  md: 'An empty case might look like it has plenty of space, but once you start jamming
    in dedicated coolers and dual-GPUs, this space can quickly evaporate.


    More than any other aspect of building a gaming PC, the case has the widest range
    of options open to you. And while it can be fairly straightforward if all you''re
    looking for is a non-descript box and follow the expectations of your motherboard''s
