  md: '# Troubleshooting


    Let''s assume you''ve built your PC, turned it on for the first time ... and nothing
    happens. You can''t get into BIOS, let alone install Windows. How and where do
    you begin to troubleshoot?


    In fact, identifying a problem at this stage is very much easier than down the
    road when you''ve got a printer, scanner, webcam and goodness knows what other
    hardware attached; not to mention 57 software programs doing their utmost to interfere
    with one another, a real risk of viruses and perhaps a utility suite that does
    more harm than good. Your computer will never be so easy to diagnose and cure
    as it is right now.


    # Check the cables


    The very first step is all too obvious but all too often overlooked: check that
    all external cables are securely connected in the correct places:


    +   - The computer''s PSU should be plugged into a mains wall socket (or power
    gangplank).

    +   - So should the monitor.

    +   - The mains electricity supply should be turned on at the wall.

    +   - The monitor should be connected to the video card''s VGA, DVI or HDMI output.

    +   - The keyboard should be connected to the computer''s PS/2-style keyboard
    port (not to a USB port, unless USB support has already been enabled in BIOS,
    and not to the mouse port).

    +   - The PSU should be set to the correct voltage and turned on.


    Now turn on the monitor. A power indication LED on the monitor housing should
    illuminate and, hopefully, you''ll see something on the screen. If not, re-read
    the monitor manual and double-check that you''ve correctly identified the on/off
    switch and are not busy fiddling with the brightness or contrast controls. It''s
    not always obvious which switch is which. If the power light still does not come
    on, it sounds like the monitor itself may be at fault. Try changing the fuse in
    the cable. Ideally, test the monitor with another PC.


    # Internal inspection


    Now turn on the PC itself. Press the large on/off switch on the front of the case,
    not the smaller reset switch. You should hear the whirring of internal fans and
    either a single beep or a sequence of beeps. But let''s assume that all seems
    lifeless. Again, check/change the fuse in the PSU power cable. If this doesn''t
    help, unplug all cables, including the monitor, take off the case covers and lay
    the computer on its side. Now systematically check every internal connection.
    Again, here''s a quick checklist to tick off:


    +   - The PSU should be connected to the motherboard with a large 24-pin plug
    and also, if appropriate, with ATX 12V and ATX Auxiliary cables.

    +   - The heatsink fan should be plugged into a power socket on the motherboard.

    +   - The case fans should be likewise connected.

    +   - All drives should be connected to the appropriate sockets on the motherboard
    with ribbon cables.

    +   - All drives should be connected to the PSU with power cables.

    +   - The graphics card should be securely sited in its AGP or PCI Express slot.

    +   - All other expansion cards should be likewise in place.

    +   - Look for loose screws inside the case, lest one should be causing a short
    circuit.

    +   - Check the front panel connections. If the case''s on/off switch is disconnected
    from the motherboard, you won''t be able to start the system.

    +   - Are any cables snagging on fans?

    +   - Are the retention clips on the memory DIMMs fully closed?

    +   - Does anything on the motherboard look obviously broken or damaged?'
