    system throws faults after the changes. It''s handy to write down the different
    changes you make, allowing you to better keep track of the numbers and readjust
    to a previous functioning setting in case of faults.


    # 6. Stress test


    After making a change in the BIOS and rebooting you then need to ensure the settings
    have stuck and that they are safe for your system. To begin with keep an eye on
    the system start-up for anything unusual: any errors will give you a sure sign
    the change caused a problem, as will forced reboots, but is the


    system taking especially long to start up? It shouldn''t and this might be a sign
    that there is a problem. Once at the Windows screen, boot up CPU-Z to ensure that
    the changed settings have been made, then start up your choice of stress-test
    software. Remember that gaming is one of the most taxing functions a PC can do
    – at least 3D games – so it might in fact be better to run a combination of stress-test
    software to make sure your system is safe at full load. Pairing up the likes of
    BurnInTest and FurMark is a good, and fairly quick, way of ensuring your CPU and
    GPU can handle the increase in power. Remember to run Real Temp too to ensure
    that your system isn''t reaching dangerous temperatures. Even with this stress-test
    software, you might want to consider running a high-end, graphically intensive
    game (we have some examples later in the chapter) to ensure that the upgrade is
    safe. If the game locks up, freezes, stutters, crashes or you find your system
    getting far too hot then you''ll know something needs to be done.


    # 7. In case of faults


    If there is any kind of fault during this process then before repeating the stage
    again you''ll need to find the reason for this fault and rectify it. The faults
    you come across could include forced restarts or shutdowns, failed stress-tests,
    unexpected error messages during start-up or failing or erratic running of games.
    This is likely caused by one of two things: either your increased strain is causing
    the processor to overheat, thus forcing your PC to shut down as a failsafe measure
    or it could be that the processor is not getting enough power to run the adjustment.
    It''s likely that early on in the overclocking process the lack of power will
    be the problem, in which case you''ll need to adjust the voltage going to your
    processor (next step). It could make sense to readjust the change you made to
    its previous figure to make sure that the fault was caused by this change; if
    it still occurs at this point, there may be a bigger problem with your PC or individual
    components.


