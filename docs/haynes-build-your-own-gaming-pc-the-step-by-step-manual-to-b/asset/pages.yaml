- pgno: 164
  md: '![](img/f51994701f272059dc108a0376ffceb8_164_0.png)


    Incompatible memory is the stuff of nightmares and can cause endless problems,
    including an apparently dead PC.


    # Searching for incompatibility


    Having tackled the problems of broken components, loose connections and a lack
    of power, we move on to the tricky stuff.

    Incompatible components can stop you in your tracks or, if you are particularly
    unfortunate, they can cause problems every once in a while at seemingly random
    moments. One giveaway is when you press the Power button and the fans rotate slightly
    in a sort of lurch and then immediately stop. It is obvious the PC is showing
    signs of life yet clearly it isn''t going to burst into action.

    PC technology runs on industry standards, which is why you can buy your case,
    PSU, motherboard, graphics card and cooling system from an array of vendors and
    have every confidence they will work together. Despite a colossal amount of hard
    work by the industry, you can run into problems, in particular with your CPU and
    memory. Your motherboard supports a particular type of processor, but it may well
    not support every CPU that will fit in the socket. As mentioned in the Anatomy
    chapter, some AMD AM3+ CPUs require more power than you get from the earlier AM3


    socket so if you put the later CPU in an earlier motherboard, it simply won''t
    work.

    A more common problem is to find that a motherboard built in, say, September 2014
    supports CPUs made up to that point but requires a BIOS update for a CPU that
    was released in December 2014. You buy motherboard and CPU in January 2015 and
    find the hardware is incompatible and, humorously, you cannot start the system
    to update the BIOS. Certain motherboards get round this problem in ingenious ways.
    Intel offered a number of different methods to update the BIOS on its Intel-branded
    motherboards including from CD and would allow you to boot into the BIOS to perform
    the necessary update. Asus has gone a step further with its Republic of Gamers
    models that support USB BIOS flashback where you can update the BIOS from a flash
    drive on a bare motherboard that doesn''t even have a CPU installed. Let''s hope
    this concept spreads to all manufacturers.

    Memory support should be as easy as easy can be. Your motherboard supports DDR3,
    the CPU memory controller supports DDR3-2,133MHz and you buy some DDR3-'
