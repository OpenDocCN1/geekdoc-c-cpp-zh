  md: '![](img/f51994701f272059dc108a0376ffceb8_119_0.png)


    There are some really great uses of VR, such as this co-operative bomb defusal
    game where only the one wearing the headset can see the device.


    robots have replaced the workforce; here you play as a human – or at least their
    disembodied hands – as you try to relearn what it was like to have a job.


    Then there’s more experiential games, too, that aren’t so much about the traditional
    ‘gameplay’ but rather about utilising the VR tech in immersive ways, whether that’s
    the likes of roller coaster simulator No Limits 2 or a digital recreation of the
    board game Catan with a 3D environment to sit around with friends as you play
    the resource trading game. Even Google Earth has a VR experience to make use of.


    It seems like such a simple use of VR, but digital recreations of board games
    means it’s possible to play with friends even when everyone can’t make it.


    # Being VR ready


    Being immersed in virtual reality doesn’t only happen with high-end, realistic
    graphics, but it can certainly help players feel more immersed in the worlds that
    are being rendered before their eyes. However, even outside of the hardware needed
    to render some of the visuals of these games, you’re also having to compute the
    motion detection of the headsets as well as the stereoscopic 3D. They’re not intensive
    additions, but you need to make sure you’re prepared – and that means ensuring
    you have the hardware inside your machine to cope.


    But the problem is that there’s no real consistency to what is recommended. Oculus
    – the developer of the big name in the VR industry, the Oculus Rift – has its
    own minimum recommendations, but there are games whose own requirements surpass
    these. Numerous manufacturers and PC retailers also recommend different specs,
    so who’s right? Well, the first thing to do is to follow the advice in our section
    about researching your build: if VR is important to you, then find out which games
    look interesting and build a system that will at least comfortably play those.
    However, there are still some expectations if you hope to play virtual reality
    games, including a certain number of ports that allow for all the cables. Luckily
    many GPUs – which are the powerhouses that will allow VR to work – will


