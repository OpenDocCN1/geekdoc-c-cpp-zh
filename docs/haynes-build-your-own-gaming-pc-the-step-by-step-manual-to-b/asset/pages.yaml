  md: '# Overclocking your graphics card


    While overclocking your processor is certain to help your PC handle more demanding
    tasks and is one of the first things you''ll think of when overclocking your PC,
    the graphics card should perhaps be the first target of overclocking for PC gamers.
    These days the GPU is the piece of hardware that handles the bulk of processing
    when it comes to 3D gaming, so if you want to make your games look as good or
    play as smoothly as possible – especially if you''ve gone for a cheaper option
    to save overall costs on your build – then you''ll want to follow these steps.
    Thankfully it''s a little easier to do than with a CPU, though the elements you''ll
    be changing are largely the same. It can be handled in Windows through dedicated
    GPU overclocking software, so it''s much less arduous when changing different
    factors. As with CPU overclocking, however, every GPU is different, even between
    otherwise identical makes and models, so you should make small changes at a time,
    testing them with benchmarking software as you do.


    # 1. Install the drivers


    Most GPU software these days will prompt you when a new, non-beta, version of
    your graphics card''s drivers are available, but even if they don''t then it''s
    often better to install the latest drivers before you start overclocking your
    GPU. You''ll find these on either the manufacturer''s website or the brand''s
    website, allowing you to download and install the most recent software available.
    In some cases you may be able to download beta drivers as soon as they''re available,
    which is something some gamers do to get the absolute most out of their GPUs –
    when it comes to overclocking, however, avoid doing this since these beta drivers
    can sometimes be unstable. Having the most recent, non-beta drivers will give
    your GPU the absolute best compatibility with your own system and the games you
    will play.


    # 2. Benchmark your GPU


    As with CPU overclocking, you want to start by finding out what your graphics
    card is capable of. There is a lot of potential benchmarking software to use so
    we''ve dedicated a section to it; if you don''t know which software to use, take
    a look at that to get a better idea of what you might want to download. As with
    stress-


    testing, this will push your graphics card to the maximum, testing its ability
    to render models, calculate lighting and even its control of physics. Different
    benchmarking software works in different ways, but the result is the same – to
    find out how well your GPU performs. Run the benchmarking software and take a
    note of your GPU''s default performance.


    # 3. Run MSI Afterburner


    Since GPU overclocking can be done with Windows software there are, as you might
    expect, a large number of options open to you. For the sake of ease, however,
    we''re going to suggest using MSI Afterburner, which is easy to use and provides
    a uniform experience for most graphics cards. You''re welcome to find and download
    your own preferred option, but this is the most robust and most widely used option
    available. AMD cards come with Catalyst Control Center, which enables a similar
    set of functions if you prefer a safer option, however MSI Afterburner also allows
    control over the voltage of your card for maximum overclocking potential.


    # 4. Adjust the clock speed


    Look for the clock speed setting in MSI Afterburner. It''ll be a slider bar with
    ''min'' on'
