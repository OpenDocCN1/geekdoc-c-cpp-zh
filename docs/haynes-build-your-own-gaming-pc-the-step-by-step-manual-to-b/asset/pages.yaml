  md: '# # In-game settings explained


    PC gaming is replete with often hundreds of little settings and tweaks that can
    be made to a game to make it run optimally on your machine. Since every PC is
    different – from the hardware installed to the active, running software – it’s
    impossible for developers to create games that can run exactly the same across
    all forms of PC hardware. It works on consoles because the hardware is always
    the same, it’s predictable; on PCs more work needs to be done to enable as wide
    a range of users as possible. That’s where the visual settings come in, letting
    you tweak a game’s options to make it run as smoothly as possible with as high
    a fidelity as possible on whatever tier of build your PC is.


    Now if you’d rather not get into the nitty-gritty of tailoring settings for your
    needs then more often than not there is a set of options to pick from, usually
    with ‘Ultra’ at the top end and ‘Low’ at the bottom. These are sets of generic
    changes to the settings, and will suffice for those who can’t be bothered tinkering
    with the settings. However, there’s also a wide range of options and though the
    ones that are available differ from game to game, their meanings never change.
    There is a


    lot of jargon involved here, so we’re going to bust that wide open and explain
    a little bit about what it is these different settings change and why they are
    important. Remember: not all of these will be in every game, and there may well
    be some game-specific options too – such as character model quality. Use your
    own judgement in this regard, but note that post-processing effects often have
    a greater impact on your processing than high polygon counts.


    Here’s an example of screen tearing, an often unavoidable problem that can be
    resolved by enabling VSync.


    ![](img/f51994701f272059dc108a0376ffceb8_154_0.png)'
