  md: '# PART 5 Webcams


    If you buy a laptop, you’re almost guaranteed a webcam these days. It’s something
    that most of us don’t even think about. But on PC, the ability to share a video
    of yourself online to others whether for something as simple as a Skype call or
    something more technical like sharing footage of yourself gaming is actually something
    you’ll need to put effort into thinking about. The webcam you choose comes down
    to the purpose you’ll have for it, because there’s certainly a wide variety to
    the extra features that can be bundled into these devices. Will you want a basic
    camera for conference calls, or do you want the best quality to appease your soon-to-be
    army of followers? Or do you even need one at all?


    # What to look for


    Resolution and camera quality – Rule number one when buying a webcam is the resolution
    that it offers. These days clarity is everything, and that begins first and foremost
    with the quality of your camera’s resolution. It’s not the only thing to consider,
    of course, but so long as you’re getting something with 1,080p or more then you’ll
    have a device with high enough quality that the viewer won’t have to strain to
    watch your video stream. In terms of quality of the camera itself, you’ll need
    to check out reviews – perhaps even YouTube examples – of how well the lens can
    capture the realistic colours and white/black balancing of your room.


    Field-of-view – The FOV of a camera changes from device to device, and some even
    have customisable ranges. This is important since this essentially dictates how
    much of you and


    ![](img/f51994701f272059dc108a0376ffceb8_115_0.png)


    your background can be seen, so a wider FOV means that groups can be seen in the
    same shot. That might not be a necessity for you, but remember that you can always
    artificially crop the unwanted bits out of a video stream, you can’t crop bits
    in. In that sense, an FOV of 60–75 is decent, but 90 is the one you want if you’re
    after something wider.


    Microphone – We’ve already mentioned in this section that a standalone microphone
    is necessary if you want to take gameplay streaming seriously, and in truth you’re
    not likely to get a webcam with the microphone quality to compete with a dedicated
    peripheral just for that function. However, if you’re starting out as a streamer
    or YouTuber and don’t want to wear a headset while gaming, then a decent webcam
    with great quality audio capture will be ideal for you. Dual-microphone options
    or anything with high fidelity will always be advertised, so it shouldn’t be hard
    to find.


    Extra features – This is one of those things that is quite impossible to be specific
    about, because the list of bonus features in webcams is as long as the number
    of products. Some might have auto-focusing, low-light functionality, HDR or colour
    correction. Others might be wireless or allow for video capture of 60FPS. There
    may also be technical features like facial tracking or background removal – specifically
    for streaming, pretty much – while on-board processing reduces the additional
    load that video capture puts on your PC. In each case you don’t only need to question
    how useful you’ll find these features (to'
