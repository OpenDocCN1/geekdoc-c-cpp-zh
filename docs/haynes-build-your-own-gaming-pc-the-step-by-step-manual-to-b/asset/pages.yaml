  md: 'also a matter of how quickly your RAM can work – measured in MHz – but as with
    the maximum number of modules and their capacity, your motherboard will dictate
    what is possible when it comes to this.


    In terms of the build, the RAM is perhaps the most flexible and the best way to
    add a little extra oomph at fairly low cost. For gaming, however, 8GB or 16GB
    will be enough; the question really comes down to what type of memory do you want?


    # Memory type


    DIMM, DRAM, DDR, SDRAM; there are all sorts of types of memory and it can get
    a little overwhelming. Some types even have their own specialised acronyms for
    specific models – and frankly it’s all a little much. DDR is the most common and
    easily the most reliable and compatible type to fit into a gaming PC. DDR itself
    has since evolved across a number of generations, with the current affordable
    standard being DDR4. Think of this like how new iPhones are released every year;
    there’s always going to be a newer, faster model. What’s important is picking
    the right one for you. Mercifully you won’t find too much out of the ordinary
    when it comes to shopping for memory, though you will need to check with your
    motherboard that it is compatible. DDR4 is more affordable than ever, but some
    AMD chipsets are still limited to DDR4 and that will restrict the speed of the
    memory. If budget isn’t a problem then it’s certainly worth picking up a set of
    DDR4 memory sticks, but so long as you get a high-end DDR3 set you won’t notice
    much difference – and your wallet will thank you too. On top of that, 2019 was
    the debut release of DDR5 and as such it’s still bound to the higher end of the
    scale for those with cash to burn; until its price lowers dramatically, it won’t
    yet be worth the advantages it offers.


    # Memory size


    This is perhaps the most significant number to look out for when buying RAM, if
    only because it directly correlates to the amount of data the RAM will handle.
    Remember that most processors will be limited to 64GB of RAM – so don’t worry
    too much about jamming 128GB in there – but in truth 32GB is way more than enough.
    If you’re looking to save money on your budget then 8GB will more than suffice,
    but for only a little extra cost you’ll be able to get 16GB instead and gain a
    significant advantage for doing so. There are plenty of options available, so
    make sure you shop around to find out what is best for you. Whatever you do, don’t
    confuse this with your RAM’s speed – memory size


    ![](img/f51994701f272059dc108a0376ffceb8_36_0.png)


    is simply the amount of data your RAM can handle at any one time. The higher that
    number the more it can do before the system begins to slow down.


    # Memory channel


    It’s imperative that you take note of the memory channel and make sure it matches
    up with that of your motherboard. The channel simply refers to the optimal setup
    for the number of individual memory sticks, and in most cases memory kits are
    sold as complete channel packages – often denoted by the description of the RAM
    itself, for example 2X8GB meaning there are two sticks of RAM in the kit. Dual
    channel is the most common and will likely be the one you need to pick for your
    motherboard, but kits can come in triple- and quad-channel too. It’s worth noting
    that you can remove individual memory sticks from a kit and still have it function
    well, but for the added expense it’s better to make sure you buy a channel that
    corresponds with your motherboard’s capabilities. Additionally, while you can
    install quad-channel kits into a dual-channel motherboard (where space allows),
    it’s important to know that this can lead to issues that can reduce functionality.
    Due to the way the motherboard may detect the memory, it may not detect the additional
    memory at all, its timings may be totally off (affecting system stability) and
    could even reduce the ‘visible’ memory total to a single memory unit. To avoid
    any problems, it’s better to buy matching memory channels.


    You may see memory like this that comes without any of the extras. It’s cheaper,
    yes, but without the heat sinks installed you’ll need to make efforts to reduce
    the running temperature of them.


    # Speed and latency


    The two biggest elements to affect how fast your memory works is speed (otherwise
    known as frequency or clock speed) and its latency. The frequency – measured in
    MHz and often in denominations of 1,600MHz, 1,800MHz, 2,133MHz, 2,400MHz and 3,000MHz
    – is a measurement of the RAM’s bandwidth, and affects how much data can be moved
    to and from it at a time. Latency, instead, affects how quickly data can be transferred
    from the RAM and this can be a very confusing statistic to look up. Often seen
    as CAS Latency (seen as a set of numbers,'
