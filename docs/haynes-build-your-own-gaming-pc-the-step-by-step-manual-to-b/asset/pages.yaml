- pgno: 29
  md: 'Outside of this there is the Micro ATX and Mini ITX, both of which are smaller.
    The Micro ATX is a good middle ground between less space but still offering a
    decent number of expansion slots. These are still good alternatives to the ATX
    and don''t necessarily come with much compromise. The Mini ITX, on the other hand,
    is the smallest of the three and naturally is more restrictive about what you
    can install, but so long as you''re not aiming for the highest end of gaming tech
    then it could be an option for those looking to build a PC that won''t take up
    too much space and is incredibly more portable. It''s worth adding that there
    are also the larger extremes of the E-ATX or XL-ATX, but if you''re considering
    a system that requires this amount of space then you''re already intending on
    a machine that is way beyond these initial, tentative steps into PC building.


    more general chipsets suitable for gamers. AMD is a little fairer with its longevity,
    and currently the Ryzen AM4 socket range of processors should last for some time.
    In that sense, chipsets X370 and X470 are on the enthusiast side, while a wider
    range of budget options means there are a greater range for gamers to choose from
    and won''t necessarily limit the options for future enhancements.


    Both Intel and AMD offer very high-end chipsets – X299 versus X399 respectively
    – for equally high-end processors, but these are certainly on the extreme end
    of the scale. It''s not that they aren''t going to give you the very best in gaming
    power, but in truth the technical boost here is hardly worth the exorbitant prices
    that these come with.


    # Chipset


    This is where the alphabet soup is at risk of confusing because you''ll need to
    make sure that the chipset on your processor matches that of your motherboard.
    They simply won''t work otherwise. It''s manufacturer specific, too, so if you
    choose an Intel CPU then you need a motherboard that corresponds. Frustratingly,
    the chipset you use does matter, and to make matters worse it''s an area that
    is updated on a regular basis. The core reason to focus on this is because the
    speed data transfer that a chipset is capable of ultimately affects how little
    bottlenecking there is between the processor and the processes of your system,
    and that includes the compatible speeds of your RAM.


    On the Intel side you have the enthusiast Z370 and Z390, while the H370 and B360
    are


    Picking a good quality manufacturer is the hardest challenge if you have no prior
    knowledge, but online reviews will help pick the wheat from the chaff.


    # Expansion slots


    To generalise somewhat, the expansion slot is the specific spaces created by the
    manufacturer of any given motherboard. There are a specific number of connections
    that are available with any high-level design of a motherboard (which is largely
    set by either Intel or AMD for that specific chipset). However, how those individual
    connections are divvied up is entirely down to the manufacturer: one board might
    have three PCIe 3.0 x16 slots, three PCIe 3.0 x1 slots and 1 M.2 slot, while another
    could have two PCIe 3.0 x16 slots, four PCIe 3.0 x1 slots and two M.2 slots. The
    number and type of expansion slots available will control the absolutely maximum
    configuration of installable parts, so if you want to run a dual-GPU setup then
    you''ll need to make sure you''ve got two PCIe 3.0 x16 slots available.


    It''s worth understanding that PCIe – meaning PCI Express – is the standard for
    expansion cards these days, with the number that follows (x1, x4, x8 or x16) referring
    to the size of each slot. This is how you can know what will fit where: a GPU
    will take up a x16 slot and won''t fit into a smaller PCIe x4 slot that is commonly
    used for cards like Wi-Fi adapters. However, even PCIe comes with its own versions
    within the category, and while it''s not likely to be such a crucial thing to
    consider, the evolving nature of computer hardware does mean that you should always
    double-check that the expansion cards you buy will actually function with your
    motherboard''s available expansion slots.


    We also mentioned there the M.2 slot, a connection type that is common in laptops
    but has become increasingly more popular in PC hardware thanks to the small form
    factor of these drives – most regularly used for solid-state drives. We''ll get
    on to that when we discuss storage options, but most modern motherboards will
    come with at least one slot.


    ![](img/f51994701f272059dc108a0376ffceb8_29_0.png)'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Memory


    On top of expansion slots, you''ll need to also take a look at the maximum memory
    capacity. This is typically presented with two sets of numbers, first the absolute
    maximum – say 64GB – and then a figure that explains how many individual memory
    bays there are. For instance, if a motherboard supports 4x16GB, then that means
    there are four individual memory bays, each with a maximum capacity of 16GB –
    giving you a figure that you can know is the absolute limit for your system. It''s
    also important to consider the potential speed available to you. Some motherboards
    – or rather, some chipsets – are limited to only DDR3 memory, which are slower
    than the increasingly standard DDR4. Even within those categories you may find
    the speed of the memory to be a restriction. If a chipset will only allow for
    memory speeds of up to 2,666MHz, then there''s no sense in doling out extra for
    high-end 3,200MHz memory. Much like a supercar sitting in traffic in the centre
    of town, that memory can achieve much faster but it''s being held in check and
    is essentially wasted money spent on potential it can''t ever achieve.


    # Input/Output


    Perhaps the area that is given the least amount of attention, the input/output
    (or I/O for short) specs of a motherboard details the types of connections that
    can be natively made with a motherboard. This essentially means that anything
    that can be plugged into the back of the computer that has a direct interaction
    with the motherboard. Once upon a time these were far more limited, but these
    days standardisation has allowed for a lot of the core requirements to be included:
    display and audio output, internet cable input, and connections for keyboards
    and mice are all made available as part of a motherboard.


    But that doesn''t mean there aren''t things to pay attention to. On-board Wi-Fi
    or Bluetooth might be crucial for some, and they aren''t common on gaming motherboards
    unless you pay a little extra for it. If it''s a necessity for you – and it may
    well be – then either opt for a motherboard with these features on board, or buy
    a Wi-Fi adapter to do the work for you.


    Elsewhere, connections like the USB 3.1 or Thunderbolt 3 will be useful at some
    point if not right away, while audiophiles might want to consider spending more
    to ensure the quality of a motherboard''s audio output capabilities. However,
    in these cases you''re probably better with a dedicated sound card to produce
    5.1 or greater surround sound. Ultimately, think about your immediate needs and
    the connections that


    ![](img/f51994701f272059dc108a0376ffceb8_30_0.png)


    might come with them, and then confirm that your would-be motherboard will allow
    for these.


    # Overclocking or Dual-GPU?


    We have a section dedicated to overclocking later in the manual, but for now we''ll
    say this: overclocking isn''t something that an amateur PC builder is going to
    want to busy themselves with at first. Despite that, both this and dual-GPU setups
    are something you do need to consider from the start of the build. Not all motherboards
    allow for these functions, so if you think it might be something you''d like to
    consider, then you''ll have to make greater efforts to look for boards that are
    designated as ready for this. When it comes to dual-GPU setups, you''ll need to
    look for either SLI-ready or CrossFire-ready motherboards. These types of builds
    are far more technical and require much more consideration, and often dual-GPUs
    aren''t actually more effective than a single GPU with equal power. It''s a specialist
    thing, really; something to think about for a future build, perhaps.


    The important thing to remember when buying a motherboard is to pair it with the
    right chipset of your processor.'
