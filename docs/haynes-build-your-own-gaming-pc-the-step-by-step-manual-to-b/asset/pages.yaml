- pgno: 41
  md: '![](img/f51994701f272059dc108a0376ffceb8_41_0.png)


    The GPU is undoubtedly the most important part of any gaming machine, but it doesn’t
    need to be a high-end beast to be worthwhile.


    and quieter as a result, but remember that demand is correlative to its power
    as a GPU, so you won’t get a high-performance card with an especially low consumption
    rate.


    # SLI/CrossFire


    Most dedicated gaming graphics cards offer SLI or CrossFire functionality these
    days, so you won’t need to worry about it all that much. They’re both terms for
    the ability to run two or more GPUs alongside one another, effectively doubling
    your potential graphical output (as well as the cost). It’s very much a high-end
    method and if you want the absolutely most powerful machine then this is an option
    you’ll want to consider – but as a result you’ll need to take into account your
    power supply, case size, motherboard, cooling systems and even a processor capable
    of running it without a bottleneck. Of course, you could add an additional card
    in SLI/CrossFire later on, but if you’re going to do it we’d recommend buying
    two of the same cards simultaneously to avoid any problems – technology changes
    all the time, and there’s no guarantee you’ll find a card matching yours when
    the time comes.


    # Connectivity and dimensions


    Perhaps this is only a small factor in the grand scope of your GPU, but it’s still
    important all the same. Dimensions, first and foremost, are integral since you’ll
    want to be sure your new card actually fits. This is both its physical size –
    so as to fit within your case without issue – as well as the number of slots it’ll
    take up on your motherboard. These slots will almost certainly be PCI Express
    (or PCIe) and for a typical gaming PC GPU it’ll likely take up the space of two
    slots. In most situations you’ll have no problems in this regard since there’s
    a fair degree of standardisation to sizes these


    days, but it’s worth checking to be certain all the same. Connectivity is important,
    too, since it tells you through what means your GPU will display images onto your
    monitor. This is good to know since one affects the purchase of the other, and
    you’ll want to know you can utilise that beast of a GPU to the very best by connecting
    through the best possible video cable.


    # Tips for picking the right GPU


    We can probably guess just how you feel at this point. Graphics cards are perhaps
    the most important part of any gaming PC, and with so many options available it
    can seem a little overwhelming – even when armed with the necessary info to make
    a good decision. For newcomers to PC building there’s always going to be a paranoid
    sensation that the GPU you’ve bought is, in some small way, inferior to another
    you had eyed. It’s safe to ignore that sensation; that’s not necessarily doubt
    that is talking but instead the confusion, wariness and apprehension over the
    cost. So long as you’ve come to a decision that is within your budget, provides
    for your gaming needs and perhaps even offers a little room for future-proofing
    then you should be satisfied. But we also know that confident words of assurance
    won’t help, so if you really need assistance prior to making that costly purchase
    then consider user reviews. Many websites include a rating system, while others
    even feature written reviews from customers, and while it’s not a definite reason
    to trust in a purchase it will likely ease some concerns (or answer them, even)
    in seeing other customers explain their experiences with the graphics card. If
    you select a handful of potential purchases then you can use the general consensus
    of opinion to make your ultimate decision. It helps to look at the number of reviews
    available, too; if one card has a much higher number of reviews placed than another,
    you can safely assume that the former is much more popular and the laws of commerce
    suggests that this may well be the better product. Alternatively, it’s also good
    to use benchmarks. Numerous tech websites offer benchmark comparisons between
    different GPUs, whether that’s a bespoke scoring system to rate and compare numerous
    different cards against one another or such results included as part of a professional
    review. Since so many different factors can alter the performance of a card, using
    these benchmarks can be a great way to find out which of your selected GPUs will
    provide the better gaming experience, and whether it might be worth altering that
    budget slightly for a significant gain in GPU power.'
