  md: '# PART 7

    # Upgrading existing parts


    There’s no avoiding the onset of age, and technology is no different. When it
    comes to your PC, the amount of time it can survive before it becomes obsolete
    is entirely dependent on the initial build. If you’ve spent over £1,000 to make
    sure your PC is a top-of-the-line piece of kit then you can be sure that – barring
    any unexpected faults with any given part – it’ll last you a good few years running
    games at their very best. Eventually it will come to a point when enough is enough,
    however, and you may not want to simply start all over again. That would be costly,
    more than anything else.


    At this point you’ll need to figure out what hardware it is you need to replace
    – and in all likelihood it’ll be the graphics card first – and then you’ll need
    to figure out what it is you can upgrade it with. This follows the same sorts
    of stipulations that you would’ve had when originally buying the hardware, which
    is to say ensuring they match certain criteria with the motherboard, case and
    other compatible parts. Providing you fulfil these criteria you’ll be okay to
    upgrade whichever part you want, following the same procedures listed in the ‘Build
    a gaming PC’ section. We don’t need to cover that again since the process is the
    same (except you’re removing the existing part first), so instead we’ll explain
    how to know which part to upgrade, and what to upgrade it with.


    # ## When to upgrade your graphics card


    For PC gamers the most integral part of their gaming experience is the graphics
    card. This is the piece of hardware that creates the visuals for your games, and
    if that is not able to perform as well as it used to it will leave your games
    stuttering under the weight of their graphical prowess. At what point you deem
    it important to upgrade your GPU comes down to entirely what standard you want
    to play your games at. You can gradually lower the


    Your system memory is the quickest, easiest and cheapest upgrade you can go for
    – but make sure you only buy RAM with the same channel setup as your motherboard.


    ![](img/f51994701f272059dc108a0376ffceb8_151_0.png)'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'Because of the standardised nature of PC hardware these days it''s often very
    simple upgrading different parts, even the likes of GPUs. Make sure the upgrades
    are compatible, however.


    ![](img/f51994701f272059dc108a0376ffceb8_152_0.png)


    settings in-game, for example, to extend the life of the GPU by playing games
    with inferior graphical options activated. It means you won''t be able to enjoy
    games at their absolute best, but you''ll get a good few months out of the card
    itself. Once it becomes a struggle to find a balance between a visual fidelity
    you''re happy with and a consistent, stable frame rate then you know it''s time
    to upgrade. Frame rate is the most important aspect, since making sure that is
    steady allows for a more enjoyable experience. With regards to what you should
    upgrade with, well that comes largely down to what is considered to be the ''best''
    at the time. Thankfully GPUs tend to follow a fairly familiar pattern, so if you
    spent £300 on a card initially then look to spend the same the second time around
    – you''ll roughly get something in the same ballpark, in terms of comparative
    power – that you had previously.


    # When to upgrade your memory


    RAM is often the easiest upgrade to go for. If you find your machine is taking
    a while to load or struggling when multitasking programs – such as switching between
    a fullscreen game and the Steam program – then it''s often easier to upgrade your
    RAM rather than anything else. It''s only a temporary fix since there are far
    more important parts – at least when it comes to the speed of your computer –
    than the memory, but it''s also a fairly low-cost upgrade too. You''ll likely
    be looking at a cost of around £100 to upgrade your memory rather than


    the £300-400 for any other more significant piece of hardware, so it''s an easy
    switch. Just make sure that if you do upgrade your RAM, do so with the exact same
    memory as before (if you''re adding to it) or, preferably, a completely new set.
    Be sure to follow our tips on buying memory at the front of the book to know how
    best to proceed when buying RAM.


    # When to upgrade your CPU


    It''s tougher to detect when a CPU is holding back your gaming performance, especially
    since modern games often rely more heavily on your graphics card''s capabilities.
    Finding out which part is causing the bottleneck is difficult, but since the CPU
    handles logical computation then testing it out with the latest strategy game
    (or anything with a lot of complex AI, really) will help; if it takes much longer
    than it should then, chances are, it''s your CPU. However, you don''t want to
    shell out another £300 for a ''chance'' that your CPU is the problem; in this
    case download and install HWMonitor, a piece of software that will calculate a
    percentage of your hardware''s capacities and how close it is to its maximum.
    When upgrading, however, you need to be very certain that the CPU you''re buying
    has the same socket as your motherboard, and in all likelihood you''ll need to
    buy a new motherboard too. If your PC is older than two years, then you''ll probably
    need to upgrade the motherboard, so be sure to check out the compatibility.


    # When to upgrade your storage


    This is probably the only upgrade situation that is guided more by your own personal
    preference'
