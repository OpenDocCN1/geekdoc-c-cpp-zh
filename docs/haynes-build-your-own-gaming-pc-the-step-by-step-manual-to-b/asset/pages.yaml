  md: '# Benchmarking and testing


    It’s important to remember that overclocking is a very gradual process, and even
    the most experienced overclockers must go through a regime of tweaking and testing
    to find the setting that they’re most comfortable with. While overclocking can
    initially be quite a daunting task, providing you’re vigilant about regular stress-tests
    and benchmarking then you’ll deal easily with problems as they arise, and know
    exactly what previous state to revert to in order to make it work again. When
    overclocking your GPU, however, you’ve a number of benchmarking options available,
    and we wanted to devote some space to talking about the different software and
    why you might favour one over another. You should also remember that while an
    overclock might be ‘benchmark stable’, it might not be suitable when it comes
    to gaming. This is especially the case with GPUs, where the extra variable from
    your own input can put more strain on its calculations and processing. We’ve included
    some good suggestions for you to test your overclocked GPU, should you need it.


    # Benchmarking software


    # Futuremark 3DMark


    3DMark is perhaps the most professional of the variants of benchmarking software,
    and as such it has made something of a name for itself as the go-to tool to test
    your system. 3DMark is designed specifically for 3D gaming, however, and will
    test everything from your GPU’s ability to render models to how well it computes
    physics, lighting, particle effects and even other modern gaming techniques like
    volumetric fog. It’s about as comprehensive as you can get, though lower-end cards
    will begin to struggle with frame rate towards the end. It’ll even give you a
    calculated 3DMark ‘score’ upon completion, showing where your current system ranks
    in the grand scheme of things.


    settled on an overclock you’re comfortable with just to ensure that you’re getting
    results you can be pleased with. Both test the same elements, so it’s really down
    to personal preference which you use when it comes to regular tests in between
    overclocking changes.


    # FRAPS


    There are two versions of FRAPS, free and paid-for. While the fairly cheap cost
    of the software brings with it some added benefits – especially if you hope to
    capture raw video footage – the free version is worth downloading for your own
    tests. It’s worth noting that this isn’t actually benchmarking software; instead
    it will display an up-to-date frame-rate counter over the games you play, making
    it imperative that you use this software while testing the capabilities of your
    GPU by playing the games themselves. Some players even get quite finicky about
    their frame rates and like to always keep it active while playing. It’s a low
    demand on the system, so there’s really no reason not to.


    # Unigine Heaven


    The second most common benchmarking software is Unigine’s Heaven, and it perhaps
    loses out to 3DMark due to the fact that its free, basic version isn’t quite as
    feature-packed as 3DMark. All the same, it’s probably best to run each of these
    individually once you think you’ve'
