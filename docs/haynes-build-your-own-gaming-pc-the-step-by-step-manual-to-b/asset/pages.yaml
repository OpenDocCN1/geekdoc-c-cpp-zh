  md: '# Gaming mice


    The problem with mice – especially for gamers – is that what makes the ‘best’
    mouse is, in a lot of ways, completely subjective and really comes down to what
    it is you want to get from the peripheral. Every PC needs one, obviously, but
    if you play a lot of MMOs over shooters then the features and benefits that you’re
    looking for from a mouse will vary quite dramatically. The shape of it, how it
    ‘fits’ in your hand and even the weight are a big deal when looking for the one
    that is right for you; it’s important to have a think about what it is you need
    from a mouse before even beginning to look for one to buy. On the plus side it’s
    not entirely mandatory that your choice has all the bells and whistles – a basic
    option will, for the most part, work just as well as its competition. And since
    the majority these days are USB-powered, plug-and-play mice, you don’t need to
    worry quite so much about compatibility.


    # What to look for


    DPI – This is the measurement that you’re going to encounter a lot when looking
    at purchasing a mouse. This stands for dots per inch, less often referred to as
    the more technically accurate CPI, or counts per inch. The higher the DPI the
    ‘quicker’ it will read your movements, essentially meaning that you’ll need to
    move the mouse less to get the same responses of a lower-DPI mouse. Thankfully
    most modern gaming mice will allow you to tweak the DPI settings, while others
    even feature activated precision modes


    – whereby a button on the mouse will drop the DPI to get that precision, allowing
    you to quickly un-toggle once more.


    Sensors – Ye olde trackball mice are something of an antiquity these days, with
    gaming mice instead using two types of sensors: optical and laser. The former
    uses an LED light and a sensor camera to track the movement and is better at maintaining
    response when lifting the mouse or using it on an uneven surface. Laser mice are
    more common for gaming, though, and enable


    ![](img/f51994701f272059dc108a0376ffceb8_98_0.png)'
  merge: -1
  img_proc: true
- pgno: 99
  md: '![](img/f51994701f272059dc108a0376ffceb8_99_0.png)


    speed and efficiency when playing. MOBAs like League of Legends, for example,
    rely on fast reactions and the quicker you can pull off that clutch manoeuvre
    the more of an advantage you will have. The games you play will affect how many
    buttons you might need – MMO players will likely want a higher number on their
    mouse – but it’s about finding a balance between comfort and usability and the
    advantage extra buttons bring.


    # Mouse suggestions


    # Logitech G502 Proteus Spectrum


    RRP: £79.99

    If you’re not looking for any specific needs and would rather have a great gaming
    mouse capable of doing it all, then the G502 is certainly one of the best options
    right now. Its 11 buttons are all programmable to give you full control of the
    device, it has a high 16,000 DPI sensor and even comes with five different weights
    for customisation of how heavy it is to lug around the mousepad.


    much better precision with much less jitter (or the misreading of a surface).
    Of the two you’ll likely want to go with laser.


    Acceleration – Most mice will have some form of acceleration, a feature whereby
    the cursor will move faster the faster you move the mouse itself. It can be beneficial
    in some circumstances, such as if you have a smaller mouse mat or desk space to
    enable smaller movements of the mouse itself. However, acceleration is generally
    disliked by many gamers since it means you’re not getting the exact one-for-one
    control over the cursor and there’s an element of unpredictability about cursor
    movement. It’s unlikely it’ll be too heavy-handed in gaming mice, and can usually
    be disabled.


    # Razer Naga Trinity


    RRP: £99.99

    Razer’s Naga range has long been considered the go-to option for MMOs thanks to
    the numerous extra buttons on the side. The Trinity model takes things further,
    though, with interchangeable side plates to allow for either 2, 7, or 12 additional
    buttons, making it the most versatile mouse on the market and capable of assisting
    you with normal use, MOBA play or MMO gaming.


    Extra buttons – Every mouse will have at least two buttons, and in all likelihood
    a clickable scroll wheel, too. When it comes to gaming you’re going to want at
    least a couple of extra buttons built into the mouse itself for that extra


    # Corsair M65 RGB Elite


    RRP: £49.99

    If FPS games are more your thing then you’ll definitely want to pick up the Corsair
    M65. Not only does it have a high 18,000 DPI range for great speed and accuracy
    but it features a toggle-able ‘sniper mode’, which switches to a low DPI for precision
    targeting – an important feature for FPS fans. It’s quite a heavy mouse too, which
    is as much a warning as praise – FPS gamers will need that for greater control.


    ![](img/f51994701f272059dc108a0376ffceb8_99_1.png)


    # Razer Deathadder Elite


    RRP: £69.99

    Mostly what makes the Razer Deathadder Elite such a good mouse is its carefully
    considered design. This is by far and away one of the best gaming mice in terms
    of fit, and while it only has two additional buttons for a large majority of games
    there isn’t really much more you need. It’s a luxury option but certainly one
    of the better ones out there.'
