  md: '![](img/f51994701f272059dc108a0376ffceb8_12_0.png)


    # The Indie Gamer


    These days PC gaming isn’t solely about bleeding-edge graphics. Over the past
    few years there’s been a boom in what’s known as ‘indie gaming’, which is to say
    games developed by small teams with no bigger than ten people. Naturally with
    the limited budgets of these developers, indie games are more constrained technically
    but typically produce much more innovative or experimental gameplay concepts that
    big budget developers just don’t have the freedom to create.


    And since the technical demands of these games are rarely intense (most indie
    games use 2D visuals rather than the more computing-intensive 3D graphics), the
    specs of a PC dedicated to these cool titles needn’t be too demanding either.
    As a result, the cost of such a PC is far more budget-friendly and flexible, and
    while you could spend way over £1,000 there’s no reason why you couldn’t spend
    as little as £600 for a gaming PC that’ll still last you a good few years.


    But what’s more, you’ll still be able to play some high-end games in this category,
    too, though you’ll need a savvy use of each game’s graphical settings menu to
    get many of them to work smoothly. The beauty of a custom build means that you
    can spend more on elements like the graphics card if you do want to dabble in
    high-end 3D gaming, but ultimately you’ll be looking at a system that’ll age much
    quicker than our other example builds here. Take a look at our example of a low-end
    PC built with indie gaming in mind:


    +   - Cooler Master K350 Mid-Tower Case

    +   - Asus H81M-Plus Intel H81 Chipset Motherboard

    +   - Intel Pentium G3240 3.1GHz Dual Core CPU

    +   - EVGA GTX 750 Ti 2GB GPU

    +   - Corsair Vengeance 1,600MHz 8GB RAM

    +   - Seagate 7,200rpm 1TB HDD

    +   - Corsair VS550 PSU


    Since the budgets of indie game developers are significantly smaller, there are
    greater opportunities for innovation and invention. This is why they’ve become
    so popular as a sub-genre.'
