- pgno: 175
  md: '# Build your own Gaming PC


    Get the performance you want on a budget you can afford. With the Build Your Own
    Gaming PC manual you’ll find advice on all the cutting-edge technology you need
    to make your perfect PC a reality, plus details of the important information to
    look for when buying your hardware and the skills you need to put your custom
    PC together.


    Offering so much more than just a guide to the construction of your gaming PC,
    this manual also includes an in-depth guide to overclocking to help you to unlock
    your machine’s maximum potential, explanation of the confusing world of streaming
    gameplay online, and tips on the software to download, accessories to buy and
    details of how to maintain your PC once it’s up and running.


    Whether you’re looking to upgrade your current computer, or building a new one
    from scratch, you’ll be able to play the latest games in style and will be ready
    to face the challenges of next year’s hottest titles.


    +   - Cut through jargon and demystify confusing marketing speak

    +   - Find the right processor and graphics card to suit your budget and needs,
    so your PC can handle the biggest games

    +   - Essential buying advice to save money on cutting-edge components

    +   - Step-by-step build advice with full-colour photography, tips and tricks

    +   - Overclock and fine-tune your hardware to find the perfect price-to-performance
    ratio

    +   - Customise your computer with the parts and accessories that fit your needs

    +   - Gain the information you need to get ready for virtual reality

    +   - Master cable management & airflow to keep your PC cool and quiet

    +   - Solve technical problems and troubleshoot performance bottlenecks


    ![](img/f51994701f272059dc108a0376ffceb8_175_0.png)


    ![](img/f51994701f272059dc108a0376ffceb8_175_1.png)'
