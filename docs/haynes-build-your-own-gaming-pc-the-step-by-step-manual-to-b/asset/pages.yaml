  md: '# PART 8  Testing and fault-finding


    +   Troubleshooting ........................................ 158

    +   Finding faulty hardware ............................ 161

    +   Beep and error codes ................................ 165


    So your new PC is dead. You’ve finished the build, closed the case, patted yourself
    on the back, turned on the power and … nothing. Not a peep.


    This is a terrible moment in anyone’s life and it is entirely natural to feel
    that heart-wrenching sinking feeling. We’re here to help you solve your problems,
    but first let’s lay down a couple of pointers. These aren’t exactly rules or directions,
    but do please think of them as well-intentioned advice.


    The first point is not to panic. Second, if in doubt wait it out. If you’re British,
    stop and make a cup of tea. You may well have a problem or even a number of problems,
    but you don’t want to make things worse, so take a step back and have a nice cup
    of tea (other beverages are available). Third, take nothing for granted. Make
    no assumptions. Always return to first principles. That sounds like three points,
    but it is actually the same thing said three ways. One of the fatal mistakes when
    you are fault-finding is to say: ‘I have confirmed that part A works and that
    part B works so it follows that part C is faulty.’ You need to be scientific.
    The truly cautious person will say: ‘I think I have confirmed that part A works
    and it appears that part B works so it follows that part C is possibly faulty.’
    Fourth, avoid tunnel vision and keep your eyes wide open. The following tale may
    be just that, but it happens. Many years ago, back when we had telephones with
    a dial in the middle, an office worker phoned an IT support line: ‘Hello, my computer
    is dead.’


    The support guy walked through their script and asked the office person to check
    a few things. ‘Can you look round the back of the computer and check the VGA cable
    is secure at both the PC and the monitor.’


    ‘No I cannot do that,’ came the reply, ‘I can’t see anything as the power cut
    has taken out the lights.’'
