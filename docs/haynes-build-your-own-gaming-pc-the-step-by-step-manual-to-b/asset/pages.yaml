    # Overclocking

    your CPU


    CPU overclocking is the most common form of enhancement, but when it comes to
    gaming you might actually want to overclock your graphics card instead since it
    handles a large portion of how the game actually looks. The CPU handles computational
    commands, however, so if you want to improve the speed with which processing is
    handled then it''s the CPU you want to upgrade. It''s worth remembering that not
    all hardware is the same, and that even the exact same components could differ
    in terms of theoretical maximum – even experienced overclockers need to follow
    the incremental process. Certain makes and models of hardware are better suited
    towards overclocking, too, though these days modern parts are a little more open
    in that regard. With so many variants in hardware, it''s impossible to give a
    definitive step-by-step process when it comes to overclocking. However, the changes
    you make are generally the same; just remember to be careful, methodical and incremental
    about the changes you do make. And always stress-test each subtle change.


    ![](img/f51994701f272059dc108a0376ffceb8_127_0.png)


    When overclocking your processor you''re going to be spending a large portion
    of time in your BIOS. It looks intimidating, so have a poke around – you can always
    exit without making changes.'
