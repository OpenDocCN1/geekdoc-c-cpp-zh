- pgno: 124
  md: '# ## Understanding overclocking


    Before you actually jump into the overclocking itself, it is important that you
    first understand the technical side of what it is you’re trying to achieve. Every
    piece of hardware is different; one part could be minutely different to another
    of the exact same make and model due to the manufacturing process, so it’s important
    to know what you’re changing and what effect that change has. To help we’re going
    to explain some of the terms you’ll need to understand when overclocking – that
    way you won’t have any problems when overclocking your own system. And since you
    can enhance the performance of parts such as your graphics card, processor and
    memory, we’ll try to keep this section as general as possible across all forms
    of overclocking.


    # ### Key terms to learn


    **Overclocking** – Let’s start with the phrase itself, which is fairly self-explanatory.
    Overclocking is the process of increasing the clock speed of a particular piece
    of PC hardware to run faster than its initial factory settings, unlocking performance
    gains. Additionally this can mean increasing the voltage that piece of hardware
    accepts to help it attain higher speeds.


    **BIOS** – This is the set-up screen where you’ll do your adjustments to the hardware
    – the actual process of overclocking itself. This is essentially the software
    hardwired into your motherboard, and lets you control the system’s hardware and
    how it performs. You may have seen the BIOS before or you may not have needed
    to, but either way it is always accessed immediately after starting the system
    up.


    **Clock** – With all this mention of ‘clocks’ you’re probably asking ‘What is
    a clock?’ Well, this is the microchip inside your computer that regulates timing,
    that vibrates when electricity is applied. It is measured in hertz, with a 2.0GHz
    processor capable of two billion cycles – or vibrations – a second. It is often
    represented in your BIOS as ‘BCLK’. This is your base clock speed, and is used
    to calculate your CPU’s overall speed: so if your system has a base clock of 100MHz
    (perhaps shown as slightly under that) with a CPU multiplier or ratio of 30 then
    your CPU will have a total speed of 3,000MHz, or 3.0GHz. Increasing the multiplier
    to 33 will make your CPU a 3.3GHz processor.


    **Data buses** – There are multiple buses inside your computer, but the most important
    is the main one connecting your CPU to the rest of the system. It is the communication
    interface that transfers data from your processor to the rest of your PC’s hardware,
    so essentially its speed affects how fast the other parts of your computer can
    be given commands from the CPU. These can come in various forms, but the function
    is always the same. Older processors call this the frontside bus (or FSB), while
    more recent terms include AMD’s EV6 or Intel’s QuickPath Interconnect. Though
    these don’t all work in exactly the same way, they do control the processing of
    information and so are pivotal to understand when overclocking.


    **Clock multiplier/ratio** – Otherwise known as CPU multiplier, bus/core ratio
    or internal multiplier, this is the number of times the processor’s own internal
    clock completes a cycle within every external clock count. This is used to calculate
    the total speed of your processor by multiplying the clock multiplier with the
    external clock’s speed. It is one of the first numbers you’ll want to try and
    adjust in the overclocking process.


    **Voltage** – This is an extra side to overclocking that is important to understand.
    While increasing the voltage supply to a particular piece of'
