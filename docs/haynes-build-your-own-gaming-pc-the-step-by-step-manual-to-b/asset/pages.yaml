  md: '# PART 5 Headsets and microphones


    To get the best audio from your PC gaming it might seem counter-intuitive to use
    a headset, but the personal audio space is a much more immersive experience than
    even the best PC-compatible stereo systems. Buying a headset isn’t quite as littered
    with jargon as most other accessories, but there are some features you’ll want
    to keep an eye out for. As ever it’s about asking the right questions. Do you
    want the most detailed sound quality? Do you want the clearest microphone and
    chat options? Are you planning on streaming? It’s a minefield of options, but
    the first step is to know what you’re after.


    ![](img/f51994701f272059dc108a0376ffceb8_106_0.png)'
  merge: -1
  img_proc: true
- pgno: 107
  md: '![](img/f51994701f272059dc108a0376ffceb8_107_0.png)


    that means external sounds will be blocked out with varying model-dependent levels
    of success. While this gives you much better sound while playing, often these
    headsets can ‘pinch’ a little – and some users might feel discomfort over extended
    periods of play, especially with cheaper models. On-ear, conversely, are much
    lighter and generally sit – as the name suggests – on your ear. External sounds
    will disrupt your in-game audio, naturally, but the lighter build and fit of these
    types generally make them more comfortable for longer play.


    # What to look for


    Ear covering – There are two types of headsets, over-ear and on-ear. The difference
    might not sound too great, but it basically affects how insulated your sound is.
    Over-ear headsets have much thicker padding that cover the entirety of the ear;
    this produces a noise-cancelling effect


    Microphone types – The quality of any given microphone is dependent on the make
    and model you’re going for, and as always the more you pay the more likely this
    particular feature will be improved. Noise-cancellation is something you’re going
    to want to look for in a headset microphone, and most will advertise this when
    it is included. It simply means the microphone will more likely pick up just your
    voice, rather than other external sounds such as game audio or other people in
    the same room as you. For a headset, look for a directional microphone, i.e. one
    that points at your mouth. However, streamers are known for using a desktop boom
    mic to free their head of the unwieldy peripheral.


    ![](img/f51994701f272059dc108a0376ffceb8_107_1.png)


    Surround sound – Like with any speaker system, looking for Dolby’s surround-sound
    options is a sure-fire way of spotting a good-quality audio option. This does
    translate into greater expense, obviously, but when it comes to gaming the added
    benefit of surround-sound audio can be an important addition. Consider a game
    like Call of Duty or Battlefield: being able to detect where an enemy is by listening
    to the sound of their footsteps or gunfire gives you a much more intuitive, natural
    advantage that they might not have. So surround sound isn’t just about the quality
    of the audio but the fact that it gives you a step-up in-game. Dolby 7.1 is the
    best you’ll get, but 5.1 and less is viable if you prefer cheaper options.


    In-line controls – It seems like such a mundane thing to mention, especially when
    a large number of headsets all come with controls built into the cable itself.
    But it’s important since these will usually let you alter the volume of both game
    audio and voice chat via the controls, as well as'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'mute your own microphone. They can come with varying options, so if possible
    try and take a look at the in-line controls available on any potential purchase
    so you know your needs are accounted for here.


    **Frequency response range** – Now this might sound like jargon, and to some extent
    it is, but these days with modern headsets it’s largely irrelevant and many don’t
    even bother to advertise the possible range. The frequency response range of any
    audio device is the measurement of its lowest bass and highest treble, and while
    the wider the range the better, there is obviously a limit to how much we as humans
    can hear anyway. Practically every headset these days offers the same range of
    20–20,000Hz.


    # Headset and microphone suggestions


    # HyperX Cloud


    *RRP: £99.99*


    HyperX has a solid name for producing high quality products, and its headsets
