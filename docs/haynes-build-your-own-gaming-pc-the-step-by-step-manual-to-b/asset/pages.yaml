- pgno: 69
  md: '# 5


    # Connect the case fans


    You should already have connected the CPU cooler to its corresponding connection
    on the motherboard, but if not then now is a good time to do so. It''s also a
    good time to connect your case fans – including any optional ones you might have
    installed – to the motherboard, which isn''t always easy depending on the motherboard.
    The cables for fans can be a little short, so smart balancing while ensuring all
    the wires aren''t obstructing anything is crucial.


    ![](img/f51994701f272059dc108a0376ffceb8_69_0.png)


    # 6


    # Connecting the graphics card power


    One of the final PSU-related tasks is to connect the graphics card with its specific
    power connectors. The power of your graphics card will dictate whether it needs
    one or two PCIe power cables fed through the bottom cable port. We''re using a
    pretty high-end card here so we''ll need both.


    ![](img/f51994701f272059dc108a0376ffceb8_69_1.png)'
  merge: -1
  img_proc: true
