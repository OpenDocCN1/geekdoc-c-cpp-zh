    # Cores


    This will likely confuse newcomers since many online stores advertise the number
    of cores as a primary feature of GPUs rather than, as we say, the size of the
    memory. There is some significance to it, and ultimately the number of cores tells
    you how speedy a particular GPU is. It’s not a strict comparison that needs making
    since some cards can use fewer cores more efficiently or to compute more complex
    tasks, but it’s a good value to compare all the same. The higher the number of
    cores the quicker that card will be able to run; of course, it’s not quite as
    clear cut as that, but these days the number of cores is often quite comparable
    to a GPU’s potential – so don’t worry yourself too much about this aspect. As
    with your card’s memory, instead shop within your budget rather than stressing
    too much about the number of cores.


    # Core/Boost Clock


    Tying into the total number of cores is the individual core speed, and is the
    way in which some cards with the same number of cores (or even fewer) can be more
    capable than others. Imagine cores as tiny engines for your graphics card; the
    Core Clock speed – measured in MHz – denotes just how fast that engine can work.
    That means a higher figure here will denote a card whose cores can work quicker
    than competitors, so it’s a good – albeit not imperative – measurement to consider.
    Boost Clock, however, is the speed that the GPU is capable of; as with all PC
    hardware, GPUs are sold at an underperforming rate to keep it safe for your system
    and for the card’s longevity. While you won’t need to increase that clock speed
    initially, it’s good to take note of this number all the same – it’ll help you
    understand its potential should you want to overclock it in the future.


    # Cooling


    Every GPU will come with its own on-board fan, a necessary method of keeping your
    card cool while it’s busy creating all those lovely on-screen graphics. It will
    be taking the brunt of the processing for 3D gaming, so keeping it cool is imperative.
    Manufacturers’ methods and preferences for cooling changes from card to card,
    and in truth great strides have been made in power


    consumption over the last few years so you may not need to worry too much about
    cooling. With that said, it’s always worth spending just a little bit extra to
    get a card that comes with at least two on-board fans – it’s just a little extra
    security on top of your own cooling systems to ensure your GPU is treated well.
    You can get cards with three fans, too, but these end up being smaller and have
    to work harder (and louder) as a result; and the benefits in cooling they provide
    aren’t all that noticeable.


    # Power supply


    Since the GPU in your PC is going to be the part that’s eating up well over half
    of your machine’s power – at least under load – you should be aware of the amount
    of juice you’re going to need to power it. This will directly affect what power
    supply unit you’ll need to buy, after all. Luckily the details on these cards
    often have both its demand and a suggested supply unit. The demand will depend
    entirely on the cards you’re looking at and how powerful they are, but you’ll
    be looking at the low end of 200W up to and even over 450W – though GPUs are becoming
    much more efficient (and therefore less power hungry). You’ll actually want a
    power demand that is lower since that means the card will run cooler


    ![](img/f51994701f272059dc108a0376ffceb8_40_0.png)


    The more fans that are on a card, naturally the cooler it will run. Depending
    on the ways in which you intend to cool your system, this might be important.'
