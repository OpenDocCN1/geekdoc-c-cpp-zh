  md: 'ignore. If you’re building a fairly typical computer – regardless of your budget
    – you’ll likely encounter the numbers 14nm, 22nm or 32nm when it comes to a CPU’s
    core size. If you’re getting into the minutiae of hardware purchasing then it’s
    worth knowing that a smaller core size will result in more efficient power consumption
    and computation speed, and in this regard Intel chips are currently ahead of the
    curve. But in truth the core size is a fairly insignificant factor to take into
    account when compared to some of the far more integral stats; don’t be afraid
    to overlook core size when hunting for processors.


    # Core name


    This is little more than the terminology given by the manufacturer – basically
    Intel or AMD – for the particular make and model of the cores installed on the
    processor. These are changing all the time, and even within particular families
    of chips the particular core model is often upgraded, changed or improved. Take,
    for example, Intel’s latest iSeries of processors, which began life named Sandy
    Bridge, became Ivy Bridge and have since moved onto the likes of Coffee Lake and
    Cascade Lake. The particular name of a model will forever be changing, and that’s
    not something we can really help with; you can usually spot the most up-to-date
    and recent chipset via the price (newer models will cost more), but don’t be afraid
    to search for the information if you’re at a loss. The name itself is irrelevant,
    but it’s an easy way to spot-check just how new the CPU you’re buying is, providing
    you research the most recent chipset of the series.


    > Unfortunately with PC hardware you’ll often encounter silly names like ‘Threadripper’,
    often having very little meaning beyond marketing spin.


    # Clock/Turbo speed


    Most CPUs will come with two measurements with regards to their speed: ‘Clock’
    and ‘Turbo’. The term clock is something you’ll come across a lot when tinkering
    with your PC, and essentially it refers to a measurement of speed when compared
    to the computer’s internal, mechanical clock – by which everything on the system
    is timed. A CPU’s clock speed, then, is its base speed, and is used to detail
    the speed at which the processor will run when it is not under load. This is an
    important stat, for sure, since the processor should never drop below this speed,
    but since you’ll be gaming on this PC – and therefore tasking your processor –
    you should also take note of the turbo speed. This is how fast the processor can
    run when it is under load – or, in other words, being used to compute intensive
    tasks like gaming – and will essentially denote its maximum capacity. This is
    actually one of the most important elements to look out for on your hardware purchasing
    travels, and should be a factor you take seriously when buying parts.


    # FSB/QPI/UPI/DMI/HT speed


    Are these acronyms really all that important? Well, yes and no. Each acronym refers
    to the type of ‘bus’ used in the processor. A computer’s ‘bus’ – as you might
    expect from its name – is the vehicle through which data is transferred from the
    CPU to the rest of the hardware. The speed of this part, then, will affect the
    speed with which other elements – such as your graphics card or memory – can receive
    and send back data to the central brain of your computer. As with a bus that you
    might travel on, the faster it travels the quicker it arrives at its destination.
    The acronyms, however, aren’t all that important in and of themselves. FSB is
    perhaps the most common, albeit increasingly outdated, while newer ones – such
    as DMI – can transfer up to 20 Gigatransfers a second (GT/s). You may also find
    this measured in MHz – or megahertz – and there is a distinction. MHz is a bus’s
    speed, while GT/s is the number of transfers it can make. While speed is important
    when it comes to your computer’s bus, modern architecture demands that the number
    of transfers capable of being made is equally important. In that regard a bus’s
    width is often more important than its speed; to use the transportation analogy
    again, if a bus can carry twice as many passengers at max capacity it is able
    to transport more passengers than a smaller yet slightly quicker bus. Thankfully
    you don’t really need to worry too much about the methodology of it all; just
    understand that the higher this number is – however it is measured – the better
    for your system’s overall performance.


