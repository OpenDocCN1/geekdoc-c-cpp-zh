  md: '![](img/f51994701f272059dc108a0376ffceb8_125_0.png)


    If you want to achieve the very best graphics from your games, overclocking can
    be a good option for achieving that with cheaper or mid-range parts.


    hardware won''t actually increase its performance – much like putting extra fuel
    into a car – it is often a necessity as you increase the speed of that component.
    The faster an overclocked part runs the more power it''s going to need to function
    at its best. As with the overclocking process, this should be done slowly and
    incrementally, to ensure the right voltage is set.


    # Benchmarking


    This is a process whereby you will monitor your PC – often under stress-test situations
    – to ensure that the upgrade you have made to a piece of hardware has both been
    successful and isn''t likely to cause any damage to your hardware. Even outside
    of overclocking, benchmarking is a useful way of discovering just how powerful
    your PC is. Since there is a risk of permanent damage to your components by overclocking,
    it''s imperative that you use benchmarking to ensure you haven''t exceeded any
    boundaries. We''ll talk in more depth about benchmarking and the software you
    can use later in this chapter.


    # DirectX


    When it comes to graphics cards, you''ll often see the term DirectX pop up –


    often seen as DX9 or DX11. This is an API that a lot of modern games rely on to
    function, and though it''s not a prerequisite for PC gaming a large portion of
    games do need a compatible graphics card to function well. Thankfully your only
    concern is whether or not you''re running a DX9 or a DX11 card. DX11 is a more
    recent, up-to-date and powerful version of DirectX, and enables a lot of fancy
    extras within games, and most recent GPUs are powerful enough to handle DX11.
    Make sure you know which yours is, however, before going about overclocking, as
    it''ll help you understand which games you''re best testing it with.


    # Preparation


    Before you actually start overclocking there are a few things you''ll want to
    consider first. This will mean downloading and installing some software to help
    monitor your changes – and stress-test those that you have made – as well as consider
    some of the hardware requirements for overclocking. This latter part might not
    be relevant to you, but it''s worth knowing about if it is something you want
    to do in the future.'
