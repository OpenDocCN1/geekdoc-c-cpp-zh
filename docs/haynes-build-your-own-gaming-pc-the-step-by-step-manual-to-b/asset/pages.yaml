- pgno: 15
  md: '# What type of

    gamer are you?


    So now you know, roughly speaking, the sort of PC you might want to build. But
    to really help guide yourself down the right path, you’ll need to consider the
    type of gamer you are. While console games typically end up on PC, there are those
    that are specifically designed solely for computers and in that sense knowing
    which games you’ll want to play will ultimately tell you what you’re looking for.
    Here’s a handy cheat sheet for figuring out the type of gamer you are.


    MMOs like *World Of Warcraft* are typically exclusive to the PC platform, often
    because their depth, technical requirements and number of possible actions at
    any one time really benefit from the advantages a computer has over a console.


    ![](img/f51994701f272059dc108a0376ffceb8_15_0.png)


    ![](img/f51994701f272059dc108a0376ffceb8_15_1.png)


    Strategy games are often better suited to PC due to the fact that they usually
    come with a lot of menus and buttons to click, so if you like games that get you
    thinking then PC gaming is for you.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '| FPS | Standing for first-person shooter, these games typically require high-end
    graphics and silky-smooth frame rates to be played at their best, especially if
    they''re played online. PC gamers will swear that this platform is the only way
    to play an FPS, not only for the clear visual fidelity but also the advantage
    and greater skill that comes from the keyboard and mouse combo. Of all the genres
    prevalent on PC, it''s perhaps the one that results in the largest number of pro
    gamers. | • You''ll need a high-end graphics card to ensure the quality of visuals
    necessary for this genre.

    • Single-player FPS games are often some of the most intensive PC games around,
    so if this is your preference then you''ll want a PC that can manage this.

    • When it comes to accessories, a monitor with a high refresh rate is important,
    as is a gaming mouse with a high DPI for fast-paced reactions. |

    | MMO | Massively multiplayer online games have been popular for decades now,
    typified by huge worlds to explore, large numbers of players to interact with
    and a great variety to the experiences. Whether it''s in space hunting for fortune
    or in a fantastical setting fighting wars against other factions, MMOs only really
    take place on PC. | • Since MMOs aren''t typically graphically intensive, the
    focus here would be the CPU since it''ll allow for the large number of objects
    and players to be loaded in quickly.

    • Storage options should be something to consider, too, since MMOs take up a lot
    of space. However, utilising an SSD will help load in the huge worlds much quicker.

    • The layout of your keyboard is important, too, since you''ll usually want to
    hotkey a large number of skills as shortcuts. |

    | MOBA | Almost exclusive to PC gaming, the MOBA is a hugely popular genre of
    game dominated largely by League Of Legends. This genre can vary between objectives
    and styles, but the most common is a 5v5 battle arena where player champions level
    up during a single multiplayer match in a bid to get an advantage over the opposing
    team. | • MOBAs just aren''t that challenging for a PC since they''re almost always
    played from a top-down perspective. Favouring speed with high amounts of memory
    and a snappy processor will get each match loading quickly.

    • A stable internet connection is also a boon, so if you can''t connect via Ethernet
    then be sure to pick a Wi-Fi adapter that''ll provide stable, high-speed transfers.

    • A high DPI gaming mouse is useful here, but one with additional buttons is a
    priority. |

    | Open World | While open world games aren''t exactly exclusive to PC, the advantage
    they have is that these games are empowered by systems that can quickly stream
    in data. It''s also a very popular genre for modders, a tangent of PC gaming that
    can open up whole new games and experiences that consoles just can''t. | • As
    a genre, open world games perhaps offer the widest range of settings, allowing
    for a broad spectrum of system specs. The more powerful that every key component
    of the machine is, the more you''ll notice the difference in this genre of game.

    • Open world games usually rely on streaming data into and out of the active memory,
    so RAM and CPU are your best options here. |

    | Strategy | Due to the menu-heavy gameplay of strategy games, PC gaming is better
    suited to the genre due to the mouse input. These can encompass turn-based, board
    game-like experiences such as Civilization, intensely fast-paced real-time strategy,
    or the huge subgenre of simulation games. The latter often focuses around building
    cities, running businesses or managing trade. | • While strategy games won''t
    ever beat out first-person titles for visual fidelity, they can sometimes be surprisingly
    intensive on a GPU, so something that can handle this is a must.

    • With that said, a lot of the technical demands will be affected by your preference.
    City-building games naturally benefit from better graphics, while turn-based strategy
    games will want computational power to more quickly deal with the AI enemy teams.
    |

    | Battle Royale | As the only genre here that can be considered ''new'', battle
    royales are typified as multiplayer experiences where a large group of players
    compete to become the last one standing. The idea is to scavenge the world for
    incrementally better but randomly located weapons and items, while the play space
    becomes increasingly smaller, therefore causing the tension to rise. This makes
    it a genre well-suited to streaming. | • Most will have heard the name Fortnite
    in some capacity, and it was this game with its accessible system specs and simplification
    of the core gameplay that popularised the genre. However, other contenders to
    its throne try to distinguish themselves with greater visual fidelity and so a
    focus on graphical power is essential.

    • One thing worth pointing out is just how new the genre is, so there''s unknown
    potential for these sorts of games to evolve in ways we can''t predict. |'
