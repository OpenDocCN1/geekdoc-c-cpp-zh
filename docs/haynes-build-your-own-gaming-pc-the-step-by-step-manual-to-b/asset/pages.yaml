  md: '# Drivers and GPU software


    If you''re new to the world of PC gaming hardware and haven''t done much tinkering
    around with any computer in your life, then it''s important to know about device
    drivers. These are pieces of software that are installed into your operating system
    to make sure that a particular piece of hardware is compatible with the OS and
    will function as it''s supposed to. They''re the crucial tools that convert the
    computer''s binary code of 1s and 0s into the corresponding output; for example,
    a device driver will ensure that your graphics card can properly pump out 3D visuals
    for gaming purposes. While the operating system will have a vast number of these
    pre-installed to assist with everyday use – think drivers for printers, mice and
    keyboards, the things that non-specialist users might need a PC for – when it
    comes to gaming hardware there are often very few cases where the OS will automatically
    detect and be able to operate an installed piece of hardware.


    That''s why one of the first things to do when setting up your PC is to download
    and install drivers for each of your hardware parts. In the case of your graphics
    card, in fact, you may even need to use the motherboard''s in-built display output
    with your monitor temporarily, just so that your GPU can even detect a video signal.
    In many cases you will be provided with discs of the drivers available within
    the packaging, but these most certainly won''t be the most up-to-date versions.
    It''s always better to head directly to the hardware manufacturer''s website and
    look for your hardware model to find the corresponding driver downloads. Start
    with your motherboard (there may be individual drivers for the chipset, audio,
    USB connections, etc.) and then install the GPU drivers. After that, install the
    drivers for peripherals like your mouse, keyboard or webcam if you''re using one
    and lastly any specialist hardware like a microphone for streaming, a gaming headset
    or a graphics tablet.


    One last point to remember about device drivers is that if you''re having any
    issues with a particular hardware, step number one should be to download the latest
    drivers. Typically you shouldn''t have any issues with your computer from one
    day to the next, so if you find a newly released game isn''t working, then updating
    your GPU driver will likely resolve that issue.


    On that note, there is software available from both AMD and NVIDIA that can be
    installed onto your computer to help with the smooth running of your graphics
    card. Both GeForce Experience (NVIDIA) and Radeon Software (AMD) provide the automatic
    updating of drivers as and when they''re released, which can be beneficial for
    keeping your system running smoothly if you''re into playing the latest video
    game releases. But on top of that, they each come with a selection of settings
    to tinker with your GPU, in-built overclocking functionality, gameplay video capture
    and can even detect performance during a game to suggest changes that can be made
    to improve optimisation of the settings. Many gamers will swear against installing
    what they call bloatware, but there''s no harm in installing these free tools
    to see if they might benefit you.


    Hardware manufacturers will always provide the latest drivers for a wide range
    of makes and models on their websites.


    ![](img/f51994701f272059dc108a0376ffceb8_87_0.png)'
  merge: -1
