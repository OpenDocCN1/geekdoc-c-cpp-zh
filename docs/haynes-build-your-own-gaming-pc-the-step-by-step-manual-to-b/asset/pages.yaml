    but if your stress-testing does raise problems then it''s likely that the upgraded
    CPU isn''t getting enough power to let the improvement function. To do this you''ll
    need to once again head into your BIOS and look for the voltage settings, often
    referred to as ''Vcore'' and usually in a different menu. As with before it will
    differ depending on your motherboard, but there will be a setting for CPU/Core
    voltage somewhere in there. You'
