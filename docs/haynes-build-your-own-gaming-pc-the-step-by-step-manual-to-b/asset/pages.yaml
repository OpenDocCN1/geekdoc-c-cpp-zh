  md: '# PART 2 Power, storage and cooling


    At this point we''ve covered pretty much the core hardware of any gaming PC, which
    is to say those parts that will have an effect on the actual gaming itself. But
    by no means can you count the job finished, since there are still other crucial
    parts of any computer that need to be considered. Luckily there''s not so many
    technical aspects to worry yourself with when it comes to these remaining needs.


    # Power supply units


    There are certain considerations that you''ll need to be aware of when it comes
    to buying a PSU, and the number one is that it will provide enough power to keep
    everything running smoothly. Your GPU will likely offer a suggested power supply
    guideline, so that''s your first port of call. Next is your CPU, which is perhaps
    the second biggest power demand in a gaming PC. All told you can expect a PSU
    of between 450W and 650W to be enough to keep your machine powered for a single-GPU
    build.


    But that''s not all, because a better-quality PSU can be the best insurance you
    can buy for your computer. Remember, this is the part of the machine that takes
    AC power and distributes it safely around all that expensive hardware; a fault
    here can be a costly catastrophe. A good quality PSU will not only last you longer
    and can be run at or around its limit without much fear of a fault, but if you
    buy one that''s 100W or so higher than your current need then you''ll be able
    to easily repurpose it for the next build. But what you really want is to buy
    an


    ![](img/f51994701f272059dc108a0376ffceb8_46_0.png)


    The power supply you choose will have a serious effect on the longevity of all
    of your computer''s parts.'
