    such as 15-17-17-35), the key here is to look for lower numbers rather than higher
    – the opposite of many of the parts you''ll be buying. This is the ''timing''
    of the RAM or how long between actions; the lower the time between actions, the
    faster that RAM will work. You''ll likely spend a bit more for a CAS Latency beginning
