    # Cancel launch start-up programs


    Having numerous programs that boot up at the same time as your operating system
    can slow down your PC; you''ve likely used an old PC before that needs a few minutes
    to ''settle'' before it can be properly used -- that''s the resultant effect of
    the menace of start-up software.


    Some you will want booting up alongside your PC – such as antivirus software –
    but in truth there are many times where it can be better to cancel many of the
    programs that do start up on launch. Again, there is software that can help with
    this but if you don''t fancy using such programs, then you can do it yourself
    with Windows. Open up Task Manager (type it into the Start Menu if you don''t
    know how to find it) and then select the ''Startup'' tab. Here you''ll see all
    the programs that are attempting to boot up alongside Windows, simply disable
    the ones you don''t need (or don''t want to start up until you need them) and
    the job is done.


    After a year or two, you may be surprised to find so many programs starting up
    alongside Windows. You won''t need all of them.


