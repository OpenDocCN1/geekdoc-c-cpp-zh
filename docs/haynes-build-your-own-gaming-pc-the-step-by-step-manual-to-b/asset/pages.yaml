- pgno: 126
  md: '# CPU-Z/GPU-Z


    This is a very handy piece of software that details your system''s various values,
    such as clock speed, voltage and so on. It''s good to run prior to any changes
    you make and then again after to first ensure that the changes have been maintained
    properly but also to check that the settings you''ve altered are working correctly.
    The equivalent software for when you come to overclock your graphics card is called
    GPU-Z.


    # Stress-test software


    There''s a wide variety of stress-test software available, and it differs with
    the type of hardware you''re overclocking. We''ll talk about them in closer detail
    in each specific section, but for CPU stress-testing you''re looking for the likes
    of Prime95, BurnInTest, FurMark or AIDA64. There are plenty more you can use,
    but if you''re concerned then by all means use a combination of different stress-test
    software – we can''t emphasise enough the importance of making sure your changes
    won''t damage your hardware. For GPU overclocking it''s a little simpler, but
    the easiest to recommend is FutureMark''s 3DMark.


    # Real Temp


    Since there''s a point to all this stress-testing, you''re going to need software
    to run alongside it. Real Temp will let you monitor the true temperature of all
    your hardware components to ensure that they aren''t overheating during the stress
    test.


    # Cooling


    If all you''re doing is making small upgrades through overclocking then you might
    not need to worry too much about cooling. As long as your system has enough ventilation
    and a cooling system suitable for the hardware you have, then smaller changes
    to the hardware will likely pass without having to change your cooling. In fact,
    the stock CPU fan should be enough to slightly bump up your processor''s power.
    That''s not to say you shouldn''t keep an eye on the heat of your system, because
    that''s the biggest threat when overclocking. If you want to make bigger changes
    then you''ll definitely need to make sure that the higher temperature of your
    computer and its parts are being rectified.


    # Power supply


    It''s highly unlikely that you''ll need to upgrade your power supply, but since
    you will be increasing the voltage your parts


    are using during the overclocking process then the overall power your machine
    will need will increase too. Chances are you''ll have a PSU installed that more
    than adequately supplies your machine, but if you''ve got a lower supply of power
    and find your machine isn''t running sufficiently after the overclocking process,
    it could be that you''ll need to upgrade the PSU.


    # Overclocking compatibility


    Not all motherboards, or indeed processors and graphics cards, are suitable for
    overclocking. Some manufacturers prefer to keep things locked down, while others
    unlock the potential of their hardware for enthusiasts by default. Thankfully,
    most high-end PC gaming components are built with overclocking in mind, though
    you do tend to pay a premium for them.


    CPU-Z and GPU-Z help you to monitor your system''s processor and graphics card
    respectively to ensure that your overclocking changes are functioning.


    ![](img/f51994701f272059dc108a0376ffceb8_126_0.png)'
