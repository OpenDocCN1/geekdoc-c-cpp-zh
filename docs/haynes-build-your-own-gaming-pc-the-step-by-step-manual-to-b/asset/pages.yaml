  md: 'of technology purchase, you should try to find user and professional reviews
    to give you a bit of confidence that your pick is perfect.


    # Form factor


    There are something like 40 different form factors that have been sorted out by
    the computer industry to ensure that a given motherboard will fit inside a particular
    case and work with a certain power supply, but happily we can safely ignore any
    obsolete, obscure or irrelevant form factors since a gaming machine is far more
    standard than a PC built for large-scale data storage, for instance.


    For gaming PCs, the mainstream form factor is ATX and will offer the most expansion
    slots – meaning spaces to install hardware like the graphics card. With this space
    it gives the manufacturer plenty of scope to design their motherboard to offer
    a fair amount of variety. A bigger board doesn’t mean you should fill it all,
    however, since the more space there is between hardware the better air can circulate
    inside the case and therefore avoid overheating. ATX is the standard for a reason
    but, of all the options available, it provides the most flexibility for installable
    parts while still allowing for decent cable management and air circulation.


    ![](img/f51994701f272059dc108a0376ffceb8_28_0.png)


    Some retailers sell motherboard sets with the RAM, processor and sometimes even
    a dedicated CPU cooler already installed.


    ![](img/f51994701f272059dc108a0376ffceb8_28_1.png)


    The size of your PC case will control the size of your motherboard. A smaller
    Mini ITX has more restrictions, of course, but it’s still possible to build a
    tiny powerhouse.'
