  md: '# 1. Test the machine


    First things first: you''re going to want to know what your machine is capable
    of unchanged. This will give you a solid base for knowing how your machine should
    be running once you''ve changed the settings. Using the software suggested previously,
    such as Prime95 alongside CPU-Z and Real Temp, stress-test the machine. Make a
    note of the figures you''re reaching, both unstressed and stressed. It might seem
    unimportant, but this will help you to know whether an overclocked part is functioning
    well.


    # 2. Access the BIOS


    After you''ve got the details for the machine in its default state, you''ll want
    to start the process of overclocking. Reboot your system and, as it starts up,
    press the correct key to initiate the BIOS screen. This differs between motherboards,
    often requiring you to press the ''delete'' key when prompted or one of the 12
    function keys at the top of the keyboard. A screen with the motherboard''s manufacturer''s
    name will appear, and it is often here that you''ll be told which button to press
    to load the BIOS system set-up screen. Failing that, take a look inside your motherboard''s
    manual – it''ll tell you in there.


    # 3. Find the CPU frequency settings


    What you''re looking for is the list of settings that control how the CPU functions.
    Again this differs between processors and motherboards, so you''ll need to search
    around the BIOS for these settings. Look for CPU frequencies, BCLK or base clock
    speeds, multipliers and ratios or some of the other terms detailed in the ''Key
    terms to learn'' section. You can also refer to your motherboard manual to find
    the section you need when overclocking. At this point don''t change anything,
    just take note of some of the default settings and confirm you''re looking at
    the right screen.


    so you''ll need to search around the BIOS for these settings. Look for CPU frequencies,
    BCLK or base clock speeds, multipliers and ratios or some of the other terms detailed
    in the ''Key terms to learn'' section. You can also refer to your motherboard
    manual to find the section you need when overclocking. At this point don''t change
    anything, just take note of some of the default settings and confirm you''re looking
    at the right screen.


    # 4. Adjust the CPU settings


    Once you''re feeling confident, you can begin by adjusting the settings of the
    CPU. This should be a very incremental process. While it''s good to search online
    for some example settings other users have achieved through overclocking – and
    in this regard you should always take an average, rather than a maximum – to give
    you a good idea of what you might be able to reach, remember that all parts are
    different. Even if you''re certain of the numbers you''ll be able to reach, you
    should still go through the process gradually to ensure that your hardware is
    overclocked safely.


    # 5. Increase the multiplier


    You should start by changing your CPU''s multiplier – though this might actually
    be termed clock ratio in your BIOS. This base setting could be anywhere between
    15 and 35, depending on the base clock speed (BCLK) of your system. By increasing
    the multiplier/ratio, you''re effectively increasing the number of cycles the
    processor


