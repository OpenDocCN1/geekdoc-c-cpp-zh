  md: '# Voltage, wattage and temperature


    The last thing you’re going to want to look out for is the power consumption of
    your CPU, though in truth it’s rare that this will ever impact (or even differ
    between) your purchasing decisions. As with all parts in your machine, the power
    that your CPU uses correlates to the temperature that it will run at – the more
    power, the higher the temperature. This is the single most important aspect of
    careful maintenance, because when your parts run too hot they are at a risk of
    becoming damaged. You may not get all of the information regarding these attributes,
    or you may only get its power consumption rather than the temperature (or vice
    versa), so try to use comparable parts as a reference point. It’s most important
    to take note of the CPU’s TDP (Thermal Design Power), which is the point at which
    the CPU is too hot to function. While this likely won’t ever be a problem under
    ordinary circumstances, if it does overheat it will likely throttle the performance
    of the processor, making your machine run incredibly slowly or, in worst-case
    scenarios, shut off the CPU altogether. If you overclock your machine (which we’ll
    talk about later), or find you are regularly stressing your CPU beyond its TDP,
    then you’ll need to take precautions to ensure the problem is resolved – either
    by adding more cooling systems to your PC, reducing any overclocking you have
    done, or even replacing the thermal paste of the CPU.


    ![](img/f51994701f272059dc108a0376ffceb8_34_0.png)


    to consider. As such it’s the iSeries that you’ll want to look into for a gaming
    PC, and though the cost is slightly increased over an AMD equivalent, it’s worth
    drawing attention to the company’s reputation – there’s no smoke without fire,
    as they say, and Intel is well known for producing high-quality processors that
    are well worth their cost.


    It always seems like AMD is playing catch-up to Intel, but thanks to its successes
    in the mobile space the company has begun to shorten the distance.


    AMD, on the other hand, has been struggling for years under the dominance of Intel.
    The difference is that Intel also manufactures its CPUs, so it is able to more
    easily implement new methods of production as it innovates on its designs. AMD’s
    answer to this is to provide its CPUs at a cheaper price, hoping to clean up the
    budget market. As with Intel it manages lines for low-end and server-focused CPUs,
    with its current Ryzen range being the one for gamers. The difference here – besides
    price – is AMD’s emphasis on extra cores, with an eight-core processor coming
    out at around the same price as a quad-core Intel equivalent. As discussed earlier,
    more cores don’t necessarily mean better gaming so this might not be a worthwhile
    option – however, if you’re looking to shave some of the costs off your system
    then switching from Intel to AMD will give you that opportunity.


    Intel CPUs tend to cost more for fewer cores, but the point is that those that
    are included run more efficiently and effectively than AMD equivalents.


    # Intel or AMD?


    This is a common question when it comes to CPUs, but in truth the answer is rather
    easy to provide. While there are a handful of other CPU designers on the market,
    most are aimed at specialised markets – mobile, low-power consumption and the
    like – rather than more general-purpose hardware. When it comes to PC gaming,
    the processor industry really is a two-horse race, and the current leader has
    been ahead in the race for years.


    Intel’s control of the CPU market – as it stands – is unwavering. Its most recent
    iSeries range – i3, i5, i7 and i9 – has proven very popular, a fine balance between
    efficiency and power and a stability that all hardware purchasers hope for. It
    maintains its Pentium and Celeron range for low-budget alternatives – not something
    we really need to concern ourselves with – as well as its Xeon range, which offers
    many more cores per CPU than the typical quad core. This range is more in line
    with large-scale servers for businesses and – again – not really something we
    need


