  md: 'personal wants from the machine itself – including how it looks. It will perhaps
    take longer than any other part to come to a final decision on this simply because
    of this breadth of variety.


    And like anything else, the cost of a case could be as little or as much as you
    want or can afford. Budget options are available, but you’ll lose many highly
    demanded functions and features as a result. Spending £40 wouldn’t get you anything
    exciting, and in truth you’re at greater risk of buying something with poor design
    that ultimately leads to limited air flow about the case. It’s a tricky balance
    when it comes to picking a budget for the case, so consider the following:


    # Case size


    If you’ve an idea of the sort of requirements that you’ll need your gaming PC
    to meet, then the size of the case is likely to be one of the key elements that
    enable that. As a result, this will affect which motherboard you can use and,
    from there, every other part that is connected to it. In truth, gaming PCs can
    easily take up a lot of physical space in a room, so if it’s necessary for you
    to minimise the size of the PC itself then you’ll need to pay particularly close
    attention to the dimensions. Remember to pick a motherboard that corresponds to
    the compatible space inside the PC – which are always in the specifications –
    and that while you can go incredibly small for a gaming PC, the build itself becomes
    much harder if you do since you’ll be far more limited with what will fit inside
    and the need to control heat output.


    # Sound dampening


    While the promise of a ‘silent gaming PC’ is a bit misleading, there are steps
    that can be taken to minimise the noise coming from your PC, which can be an important
    goal for your build if it’s to share space with others while you’re gaming. The
    case is by no means the only way to help with this, but by buying a case with
    sound dampening material installed onto the panels you’ll find that any of the
    sound that your hardware makes when under load will be reduced to a tolerable
    amount. Some case manufacturers specialise in ‘silent’ cases and others might
    produce a case within each of their generational releases that cater to this demand,
    but either way a case designed for ‘silent’ performance will be quite clearly
    advertised as such.


    ![](img/f51994701f272059dc108a0376ffceb8_44_0.png)


    # Fans and airflow


    Heat is the biggest threat to your hardware, and the more powerful you go the
    more you’ll need to concern yourself with what to do with the heat that builds
    up. The simplest defence is to choose a case with a huge amount of space inside;
    this will allow air to more easily move about the case and therefore allow heat
    to dissipate better. But to take control of the matter yourself you should use
    ventilation to draw in cool air and remove the hot air (typically from the front
    and bottom and out through the top and back). Outside of the budget cases, most
    manufacturers offer at least a couple of fans to help keep everything cool, but
    stock fans aren’t always enough. Knowing how much space there is for additional
    fans – or even water cooling if that’s the route you want to take – is a pretty
    significant thing to look for in a case.


    Mini-ITX size cases are the trickiest builds because the space is so limited,
    but so long as you’re smart about your purchases, then a PC this size can still
    pull its weight.


    # Ease of build


    These days PC building is becoming increasingly simple thanks in large part to
    the standardisation of ‘tool-less’ chassis. These benefits aren’t something that
    should control your purchasing decision, mostly because cases better suited to
    gaming are typically designed with these construction advantages in mind, but
    it can be enough to help you pick one option over another. While you do want to
    look for this benefit – essentially it means reduced risk of damaging the screws
    thanks to thumb screws or fasteners – there are other advantages that'
