  md: '# PART 7 Maintenance and settings


    +   Maintaining your hardware 144

    +   Maintaining the software 146

    +   Upgrading existing parts 150

    +   In-game settings explained 153


    Even if you built your brand new gaming PC yourself, just like any piece of hardware
    it will fall victim to the tests of time. What this means is that your components
    will age and eventually – hopefully many years down the line – they will finally
    give up the ghost. Mercifully there are things you can do to help maintain your
    new PC, and it''s highly recommended you do.


    There are many ways you can keep your PC running as well as the day it was put
    together, whether it''s clearing away the layers of dust from your PC''s parts
    or making sure your hard drive is free of clutter and unwanted files. There are
    things you can alter in the settings of your games, too, that will allow you to
    make the most of your hardware, even when it is beginning to age beyond advancements
    in computing technology. There''s an art to maintaining a PC and it does require
    a bit of willpower; none of this will be fun to do, but if you set aside just
    an hour or so a month to keep on top of potential problems then you''ll be able
    to keep your PC fit and healthy for much longer. And, of course, eventually a
    time will come when you''ll need to look for upgrades to your machine to help
    keep your gaming as high fidelity as possible. Luckily this section will help
    you through all that.'
