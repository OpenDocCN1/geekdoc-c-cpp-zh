- pgno: 8
  md: '# PART 1


    # BUILD YOUR OWN GAMING PC


    # Why build your own gaming PC?


    +   Advantages of PC gaming 8

    +   Understanding your needs 10

    +   What type of gamer are you? 14

    +   What to consider 16

    +   The tools of the trade 17


    With so many amazing options available to buy ready-made gaming PCs from brilliant
    makers like Chillblast.com and Overclockers.co.uk you may wonder why anyone would
    want to build their own gaming PC at all. After all, there’s bound to be a system
    that suits your needs among the hundreds available, and that shiny new PC could
    be on your doorstep within 48 hours.


    The answers are simple: choice, budget and upgradability. You have the opportunity
    to create an entirely custom PC designed specifically with your needs in mind
    and, regardless of what the marketing men would have you believe, you’re the only
    one that can deliver it.


    As you might already know, high-end gaming hardware tends to be more expensive
    than the average run-of-the-mill kit, so (like it or not) your available budget
    is going to play a very key role in the end result. But that’s perhaps the biggest
    advantage of doing everything yourself; you’re in control of absolutely everything
    and can dictate precisely where the money should go. Do you want a quick computer?
    The very best graphics from the top-end games? Or are you looking to multitask
    whenever you’re on the machine? Answer questions like these and you’ll find not
    only your needs, but the right budget to go with it.'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# BUILD YOUR OWN GAMING PC


    # PART 1


    # Advantages of PC gaming


    Perhaps the prevailing thought surrounding building a gaming PC is just how prohibitively
    expensive it is, but that''s only true if you''re not smart about your purchasing
    decisions. Sure, it''d be a simple task to pick out the most expensive parts and
    fit them all together, but while that could lead to issues of its own – compatibility
    being the biggest disaster you may encounter – it''s also a fruitless endeavour
    in terms of power and gains. Building a gaming PC is about picking the right parts,
    and rule numero uno here comes first down to budget: knowing what you can afford
    and trying to stick to it rigidly will make the decision-making process considerably
    less daunting.


    ![](img/f51994701f272059dc108a0376ffceb8_9_0.png)


    It might be scary to look at, but with the necessary information you''ll find
    you have no problem installing any part of a PC; it''s actually pretty simple
    these days.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '![](img/f51994701f272059dc108a0376ffceb8_10_0.png)


    Gaming PCs can come in all sorts of shapes and sizes, so it''s not really as simple
    as picking one from a shelf. Knowing what you want is the first step.


    And therein lies the first main advantage of PC gaming: its flexibility. Every
    PC owner is different and every gamer has their own tastes and wants. What those
    are will effectively control the requirements of your system, but because of this
    flexibility you can put together something that fulfils those needs as well as
    your budget. If you need a computationally powerful machine for faster processing,
    then that''s where you need to spend the money. If high-end graphics are what
    you''re hoping to achieve, then the GPU is the focus. Since the parts are chosen
    by you, there''s no concern that the machine you have won''t be in some way inferior
    to your particular needs. And in truth, buying an off-the-shelf gaming PC just
    won''t have that guarantee of efficiency in conjunction with value for money.


    On top of that, there''s a sense that a gaming PC can also be a future project,
    too. If you


    don''t have the funds to kit it out with the high-end gear you are dreaming of
    just yet, you can save on certain parts to build a functional and acceptable machine
    with the prospects of upgrading at a later date. And since you know the parts
    inside your computer, you''ll more easily be able to figure out how and what can
    be swapped out for better equipment when the time comes to do so.


    But the thing to know is that simply by choosing to self-build, you''ll automatically
    be saving money. Whether you''re buying a prebuilt gaming PC online or (shock
    horror!) in a physical store, there''s always an added cost that comes with that.
    Yes, there''s more manual effort involved this way, but that ultimately means
    you''ll reduce the initial outlay. The fact that you''re free to shop around for
    the cheapest price and buy when you find it at a price you''re willing to pay
    only adds to the potential for savings.'
