- pgno: 17
  md: '# # What to consider


    This is all well and good, but the list of components is vast and overwhelming.
    We’re confident that you could just pick the parts on each of our builds and fit
    them all together with no issues, but that’s not going to work for everyone. Needs
    differ and the flexibility of building a gaming PC yourself is why it’s even worth
    considering a self-build over a premade system bought online. As such, here’s
    the things you should think about when deciding what your needs are and what you’ll
    need.


    # ## Know the specs


    While we’ll go into closer detail about what to look for when buying hardware
    in later chapters, it’s important to know first what sorts of games you want to
    play and pick the parts that’ll match those needs. Knowing that you need a 4GB
    graphics card, for example, will automatically narrow down the options available
    to you.


    # ## Futureproofing


    As with any technology, there’s no such thing as a truly futureproof computer,
    least of all a gaming PC. However, if you’re eager to build a machine that will
    sustain your gaming at a fair comfortability for several years, then you’ll naturally
    need to spend a bit more on the hardware now to ensure it’ll go the distance.
    This doesn’t mean the most expensive parts, just those that are going to keep
    you going and have good recommendations for overclocking (discussed in a later
    chapter).


    # ## Form factor


    In the majority of situations, you’ll want a case that has a lot of space inside
    to allow for air to more effectively pass through the computer and therefore allow
    for better cooling. However, if portability or aesthetic appeal is important (perhaps
    the PC will be sitting in a very visible place), then consider a form factor to
    match; this means a motherboard to match and that ultimately necessitates which
    parts you can install, so this is a significant thing to think about.


    # ## Drives and ports


    One of the most flexible aspects of any PC build is the drives that are installed.
    Do you really need a DVD drive? Would you rather have the quick boot-up time provided
    by an SSD? Or do you intend to fill your disk drive with gigabytes of data? Answers
    to these will affect what parts you’ll need or want to include. Don’t forget the
    ports, either, since these days you’ll perhaps want to allow for USB Type-3 and
    Thunderbolt ports, particularly to allow for 4K monitors.


    # ## Connections


    Outside of the ports, knowing how you’re going to want to connect the PC to the
    world is important. In an ideal situation you’ll want to just connect via Ethernet
    to the internet and so a Wi-Fi adapter is essentially useless; you’ll almost always
    be downloading games, after all. And unless you’re insistent on 7.1 surround sound,
    you can overlook extras like suitable connections for such needs. You don’t need
    every extra that is advertised.


    # ## A beginner build


    One last thing to ponder is whether you really need the top-end PC right now.
    Remember, by building it yourself you can choose parts that’ll last well into
    the future and only upgrade certain parts as and when you need them. If you don’t
    feel the need for 32GBs of memory right now – and arguably you won’t – then go
    with your minimum need and add to it over time. The same can be true for all other
    parts: by buying cheaper, less impressive parts now you can splash the cash on
    a new upgrade in a couple of years as and when demand dictates.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# PART 1 The tools of the trade


    Since most modern computer components snap together more like elaborate LEGO for
    grown-ups than precision electronic components, you really don’t need to have
    anything particularly special to hand to help you build your gaming PC. That said,
    there are a handful of items and considerations to keep in mind.


    # Anti-static


    There are a few hurdles and stumbling blocks to bear in mind. The first of these
    is any electronic device’s nemesis: static electricity. Is it possible to kill
    a £450 graphics card simply by taking it out of its anti-static bag? Yes, absolutely,
    and it really can happen. Before you handle any of your gaming PC’s prized components
    you should ground yourself. The briefest touch of the nearest radiator or pipework
    will do the trick provided you’re not then scuffing your feet back along nylon
    carpet to your workbench. Another solution is to use an anti-static wristband.
    It’ll help stop the natural build-up of static electricity but is far from a requirement.


    ![](img/f51994701f272059dc108a0376ffceb8_18_0.png)


    # Cable ties


    Something you’ll hear quite a lot about as we guide you through the process of
    building your own PC in this book is airflow and the need to keep your computer
    as cool as possible. Heat is your enemy. It shortens the lives of your components
    and it makes for a noisier PC (more fans working harder to keep temperatures down).
    One of the easiest ways to help keep temperatures down inside your PC is to ensure
    that the flow of air through your case from the front, or top, to the rear ‘exhaust’
    of your PC is free from the jumble of cables inside your case. The easiest way
    to tame this tangle is with some carefully placed cable ties. They’re very cheap
    and disposable – you don’t have to use them sparingly.


    ![](img/f51994701f272059dc108a0376ffceb8_18_1.png)


    # Phillips screwdriver


    Last, but certainly not least, is the humble Phillips screwdriver. Believe it
    or not, this is the only tool you need (though it doesn’t hurt to have a small
    pair of long-nosed pliers to hand). The beauty of most modern gaming cases is
    the fact that they offer almost completely tool-less construction. Almost everything
    can be slotted or clipped or screwed (and even then most screws are thumbscrews,
    meaning they can be done by hand).


    ![](img/f51994701f272059dc108a0376ffceb8_18_2.png)


    # Installing software


    You may notice that we haven’t included a DVD (optical) drive in any of our builds.
    That’s largely because no one involved in the making of this book has touched
    a DVD or compact disc of any kind in the last five years. We appreciate that might
    not apply to everyone and some readers might wonder how they’re supposed to install
    Windows or a Linux distribution like Ubuntu or Steam OS. For Windows you simply
    need to download an official ISO (disk image) from Microsoft and their handy USB
    tool, which you can find at http://windows.microsoft.com/en-GB/windows-8/create-reset-refresh-media.
    All you need is an 8GB USB stick. Now that Steam OS, the Linux-based operating
    system powering Steam Machines, has over 1,000 supported games you might want
    to give that a try. For full instructions for installing it via a USB stick just
    visit http://store.steampowered.com/steamos.'
