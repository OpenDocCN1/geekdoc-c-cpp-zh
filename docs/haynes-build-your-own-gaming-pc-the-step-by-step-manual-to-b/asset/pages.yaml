  md: '# PART 2

    # Understanding the basics


    Let’s start at the beginning with a list of components. If you dismantle pretty
    much any PC you will end up with a motherboard, processor, memory, graphics, cooling,
    SSD/hard drive, case and power supply. While it is also common to find a DVD or
    Blu-Ray drive, this is not strictly necessary and these days networking and audio
    are likely to be features that are integrated as part of the motherboard where
    once they would have been separate expansion cards.


    The core of any computer is the motherboard, which houses and connects all of
    the hardware together.


    You will often hear a particular component called by different names, so a mainboard
    is the same thing as a motherboard, a graphics card is a VGA (Video Graphics Adapter),
    a case is an enclosure and RAM (Random Access Memory) is also called system memory.


    There is no escaping the fact that the computer industry loves acronyms. In addition
    to VGA and RAM, you will doubtless come across CPU (Central Processing Unit),
    PSU (Power Supply Unit), HDD (Hard Disk Drive), SSD (Solid State Drive) and many
    more. You do not necessarily need to understand what each and every acronym means,
    but once in a while you need to stop and double-check the alphabet soup isn’t
    leading you astray. It is all too easy to look at a graphics card with DVI-I and
    HDMI outputs (they are different types of connections for displays and TVs) and
    note that your intended 4K display also has HDMI to lead you to think: ‘Yes, that
    works, I just need an HDMI cable.’ But following that train of thought can lead
    you down a faulty path; technically speaking the connection will work, but is
    it the best option for your system?


    That’s why it’s so crucial to understand not only what your needs are, but what
    each of the parts do. We will be covering the specifics of each piece of hardware
    in close detail later in this chapter, but it’s still important to know the basics
    of how it all connects together and works. Initially it could well be overwhelming
    with the sheer amount of confusing technical details you’ll encounter, but take
    it a step at a time. First it’s important to just get a sense for some general
    numbers and, through that, an understanding of the system you’ll need to build.
    To be reductionist about it, and to help you overcome that initial first hurdle,
    we’ve selected what is widely considered to be the three most crucial parts to
    running a video game:


    ![](img/f51994701f272059dc108a0376ffceb8_21_0.png)'
  merge: -1
  img_proc: true
- pgno: 22
  md: '| | CPU | GPU | RAM |

    |---|---|---|---|

    | Purpose: | The Central Processing Unit, or simply processor, is commonly referred
    to as the ‘brain’ of any computer. It’s the part that doles out and controls every
    process of the machine, allotting computational power to their respective hardware
    as and when their demands increase or decrease. Within a game, it’s the CPU that
    is dedicated to logical calculations, meaning the AI of characters not controlled
    by the player, physics systems and anything that requires loading in data quickly.
    | As the name might suggest, the Graphics Processing Unit has the duty of producing
    the visuals for your games. While there is a misconception that it is exclusively
    dedicated to 3D graphics, this is only partially correct in that 2D games simply
    don’t challenge a GPU in the same way. It is designed to handle one specific job,
    pushing pixels and rendering shapes. Unlike the CPU, which is more of a multitasker,
    a GPU is specialised in its purpose. If high-end graphics are your goal, then
    a high-end GPU will ultimately be the means to this end. | The system memory or
    Random Access Memory is the piece of hardware that essentially controls how quickly
    your computer can think. It’s a cache of sorts, with data and processes loaded
    into its storage from the moment your computer is switched on to the moment it’s
    shut down. Active processes – and by that we might software being used or actions
    being undertaken in the background – all feed off the RAM. The CPU chooses what
    is loaded into the memory, but once it’s been loaded in the same process takes
    less time to complete. More RAM means better multitasking, quicker load times
    and more software active at once. |

    | What to look for: | The big number that is advertised with CPUs is its speed,
    measured in GHz. The bigger this is, the faster the processor can ‘think’. However,
    it’s also important to have a CPU that can multitask, so picking one with multiple
    cores (four is a minimum these days) is essential. | In truth, there are far more
    crucial things to know about a GPU purchase than any of the three here. With that
    said, the sheer amount of data it can process is usually the focus when it comes
    to system specifications. In this sense, looking for the number of gigabytes (GB)
    of memory on board the GPU is your starting point. | There are certain factors
    here that go beyond sheer numbers, especially when it comes to compatibility,
    but luckily with RAM it can often be as simple as picking the biggest number.
    This is measured gigabytes, though knowing how many individual sticks of memory
    you’re getting is important since your motherboard will have limited space. |


    Now, any gaming machine is the sum of its parts. If there is a bottleneck in one
    area, then it doesn’t matter how highly specced the rest of the computer is, it’s
    going to have issues overcoming that restriction. Having less system memory, for
    example, will ultimately limit how much you can have running on the machine before
    it begins to stutter, slow down or even crash. Don’t worry, this isn’t likely
    to happen with a sensibly considered gaming PC, but it’s certainly worth knowing
    that your build needs to be researched properly to ensure you’ll have what it
    takes to run the games you want to play.


    With that in mind, there is a handy means of figuring that out that doesn’t require
    too much in the way of technical knowledge of each piece of hardware. Minimum
    and recommended system requirements can be very useful in creating an initial
    guideline; these are the hardware expectations that the developers of the games
    themselves believe are necessary to enjoy the game at an acceptable level. Once
    upon a time you’d find these in a corner on the back of the DVD case, but since
    almost all PC games are delivered digitally these days, instead you’ll need to
    look either at the details within the digital store or simply search for the game’s
    name alongside ‘system requirements’.


    Remember, though, that while this can be a good guideline for what you need, it
    isn’t necessarily what you want. Even the recommended specs are by no means the
    tippy top of the possible scale. In fact, with so many graphics settings available
    to customise the visuals and many PC games designed to run on as broad a range
    of computers as possible (not to mention the inferior hardware found in games
    consoles), the recommended system requirements needs to be taken as a guideline
    and not a strict rule. Computer hardware can move at an incredible pace, so targeting
    today’s recommended specs will likely leave you with a machine that will age much
    sooner than one that has been properly built with a lasting appeal.


    With the knowledge that recommended specs should be a jumping-off point rather
    than a shopping list, let’s take a look at some of the guidelines for the different
    sorts of games you could be playing:'
