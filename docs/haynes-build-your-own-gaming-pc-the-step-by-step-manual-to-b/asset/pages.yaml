  md: '![](img/f51994701f272059dc108a0376ffceb8_161_0.png)


    If you haven''t got enough power heading to your graphics card(s), you can expect
    to hit problems.


    This EVGA Z87 Stinger is a prime example of a motherboard that sports a number
    of premium features such as micro buttons and a debug display.


    ![](img/f51994701f272059dc108a0376ffceb8_161_1.png)


    of starting. Ideally, if you are using a CPU or APU that contains a graphics core,
    you would temporarily remove your graphics card(s) to take them out of the equation.


    # Power On Self Test (POST)


    The photo of this EVGA Z87 Stinger Mini-ITX motherboard (opposite) shows three
    things of interest. At the bottom right we have the front panel header connections,
    at the top right there is the POST debug display and at the top there are Power
    and Reset buttons. These are premium features that you won''t find on mainstream
    and budget motherboards, but hopefully you have aimed high with your gaming PC
    build. The colour-coded front panel headers make life much easier when you connect
    the Power and Reset buttons along with the Power and Activity LEDs. These connections
    are all interchangeable and it is alarmingly easy to plug things together incorrectly
    or even to miss the header and only engage with one pin rather than two. If you
    make that mistake, you can press the Power button all you like and your perfectly
    functioning PC will refuse to respond. The same thing applies if the wiring to
    the front of the case is damaged or the button is faulty.


    Using the Power micro buttons bypasses this problem entirely. If you don''t have
    micro buttons on your motherboard, the time-honoured alternative is to use a plain
    screwdriver to short the two header pins. Under no circumstances short the pins
    with a jumper to make a permanent connection – this is a momentary connection
    that sends a signal to the PSU to get things started. As you probably know, if
    you press and hold the Power button for ten seconds when your PC is running you
    will actually force it to shut down.


    The other advantage of a premium motherboard is the POST code debug display. During
    POST (Power On Self Test) the display shows a series of two character codes that
    you can interpret to see the progress of your system start-up. We''ve posted the
    most popular codes later in this section.


    With a premium motherboard you can tell in moments whether or not you have power
    and whether the power button is attempting to boot your new PC into life. With
    a lesser motherboard you are pretty much in the dark between the time the fans
    start turning and when the reassuring Windows logo appears on your screen.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# PART 8 Finding faulty hardware


    Installing your new hardware in a case can introduce all sorts of unexpected problems,
    even if you use high-end hardware such as this Phanteks Enthoo Pro.


    If you still have a dead PC then the time has come to search for faulty hardware.
    Sadly if you''ve made sure every piece of hardware is properly installed, there
    are no faults with your power supply and that the PSU is correctly connected to
    every necessary part, well ... that means you''ve got a faulty piece of hardware
    somewhere. It could be as simple as a mistake in the installation, though, so
    don''t despair too much.


    ![](img/f51994701f272059dc108a0376ffceb8_162_0.png)'
  merge: -1
