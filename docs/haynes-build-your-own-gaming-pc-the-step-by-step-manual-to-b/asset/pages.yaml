    browser – even if that data is old and no longer needed. Clearing out your history,
    cached files and temporary files will improve performance since there won''t be
    quite as much information that your CPU and memory needs to take note of. Again,
    CCleaner is great for helping with this. Outside of that it''s worth checking
    any folders that might naturally accrue files that eventually become old and irrelevant,
    such as your Downloads, Documents and Pictures folders. Find these folders and
    go through the files inside to delete those you don''t need. Repeat the process
    for your desktop, which can – for many – become something of a dumping ground
    for shortcuts and downloaded files. And


    don''t forget to clear your recycling bin out once you''ve done all this.


    # Go through defragmentation


    Hard drives – by their very nature – can become a little confused. With so much
    data writing and rewriting going on in even a single session on your PC, months
    of use can cause your files to become fragmented, slowing your PC down as it has
    to search for information in a wider number of places. It''s a healthy process
    to go through defragmentation – called disk optimisation on Windows 10 – to analyse
    your hard drives and recalibrate the data so it can be more easily found. There
    are a number of software options


