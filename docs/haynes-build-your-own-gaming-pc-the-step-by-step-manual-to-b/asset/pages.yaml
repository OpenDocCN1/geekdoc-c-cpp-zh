    out for).


    However, usually when one of these figures improves it is at the expense of the
    other; your RAM may think faster, but as a result it will be able to handle less
    data. In truth the extra speed doesn''t actually offer much in the way of performance
    gains, which means it''s about finding that balance. If DDR4 is the RAM you''re
    going for then a CAS Latency of 14–16 with a frequency or speed of 2400–3000 will
    be the best option. What''s interesting, however, is that while DDR4 does have
    better storage density and power efficiency, it tends to have higher CAS Latency
    than DDR3. With everything taken into consideration, however, DDR4 still has better
    overall performance.


    # XMP and AMP


    You''ll never get a stick of RAM capable of XMP and AMP – because they''re both
    exactly the same, only AMP is the AMD version of the otherwise more common XMP.
    All memory as it is bought comes with its ''safe'' setting, a profile that is
    a little below the true potential of the RAM that adjusts the timings (latency)
    and frequency to settings lower than it is actually capable of. This is to ensure
    there are few problems – since hardware can be installed on a whole range of machines,
    and compatibility is a manufacturer''s prime concern. Nowadays many memory kits
    come with XM or AM profiles, in-built settings that can be manually activated
    to get the optimal performance out of your RAM without having to overclock it
    or adjust settings yourself. If this feature is present, don''t be afraid to use
    it.'
