  md: '# 8. Increase the memory clock speed


    Once you’ve found a safe overclock that you’re happy with, you can then repeat
    the process for the GPU’s memory clock speed. This is the exact same process as
    the GPU clock-speed increase, except you’re altering the memory clock-speed slider
    instead. As before a process of gradual alterations, GPU-Z checks and benchmark
    tests will be important to find the perfect maximum. It’s perhaps safer to take
    a note of your new GPU clock speed and voltage settings and reset them to the
    defaults before changing the GPU memory clock speed. Then, if all goes well, use
    the new settings for GPU clock speed, voltage and GPU memory clock speed to see
    how it all works together. As always only change one setting at a time so you
    can easily resolve a problem should you encounter one. You’re not going to notice
    quite as many gains from increasing the memory clock speed, but it’s still beneficial
    in order to get the most out of your GPU.


    # 9. Test it out


    Once you’ve found overclocked settings that you’re happy with, and benchmarking
    tells you they are safe, the important thing to do is to test it all out. Boot
    up some graphically intensive games to ensure that your settings are safe in a
    ‘real’ situation. While benchmarking is great for finding the potential maximum,
    the added dynamism of gaming can often cause greater stress that the predictability
    of benchmarking software fails to replicate. If you ever get any issues with your
    graphics card while playing games – such as regular GPU drivers crashing or black
    screens – then you should readjust your overclocked settings a little, lowering
    them and retesting to ensure everything is safe for your GPU. And, as always,
    keep an eye on those temperatures.


    You can use any other software that enables GPU overclocking functionality, but
    MSI Afterburner is particularly easy to use for practically any make and model
    of graphics card.


