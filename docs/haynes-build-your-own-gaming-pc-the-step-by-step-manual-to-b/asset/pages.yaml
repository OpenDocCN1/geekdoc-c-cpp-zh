  md: '# PART 5 **Virtual reality**


    One of the hot topics for gaming over the last few years has been that of virtual
    reality. Ever since Facebook bought out the leading VR developer, Oculus Rift,
    there’s been an insurgence not only in competing products, but also interest from
    gamers and game developers alike. Though there have been a handful of attempts
    to make virtual reality mainstream since as early as the 80s, the tech is only
    now managing to reach a point where there are fewer technical restrictions on
    the hardware. This means that with the current suite of headsets you’ll manage
    to achieve a believable VR experience to make your gaming more immersive and captivating
    than ever. But, what exactly is virtual reality?


    While it’s not exclusive to PC gaming, because of the high-end nature of the hardware
    it is something that is better suited to computers than the consoles, though Sony
    does have its own PlayStation-compatible headset. The current setup for VR (and
    this isn’t likely to change any time soon), is a base computing platform that
    syncs up with a separate headset that you strap over your eyes. These bulky devices
    can look a little awkward to wear, but they’re not so bad; they are essential
    to the experience, however, since they are built with motion detecting sensors
    that will track your head movements. These are then replicated in game, so if
    you look left for real then the character you’re controlling will also look left.


    This is typically combined with stereoscopic 3D, which means that the objects
    in the digital world will actually appear closer to you. That’s the basic idea.
    On top of this there are a handful of other things that complete the current state
    of the VR industry. Primary among these is the addition of controllers that track
    the movement of your hands, and typically this is considered to be almost mandatory
    for the true VR experience, although you could argue that a flight stick is going
    to be a better investment for something like *Elite: Dangerous*. With these motion-detecting
    controllers, however, you can feel yourself tactilely grab at objects or hold
    weapons, and since you’re physically moving to interact with the world, you’ll
    feel even more


    > “The Oculus Rift and its spin-offs are the headsets that kick-started the surge
    in VR popularity, and since they have backing from Facebook they are likely to
    be the ones on top for a while.”


    ![](img/f51994701f272059dc108a0376ffceb8_117_0.png)'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'immersed into the game. Other inputs include controller-free haptic controls
    – which work by detecting your movement in a given space – while there’s even
    work being developed on smell-producing devices, too, to add an extra sense to
    the sensory gaming. And remember, VR isn’t exclusive to gaming: given time (and
    Facebook’s interest), virtual reality could function as social spaces, live sports
    shows, education or even art and design.


    # What games are available?


    As you might expect for an experience about involving you directly into the game,
    virtual reality games are – for the largest part – first-person. Now there is
    a broad variety here since first-person viewpoints can fit into a number of genres,
    from shooters, racing games, platformers, puzzle games and even rhythm action
    games where you hit notes to the beat of the music. That last one, for example,
    includes a game called Beat Saber, which is essentially a game about swinging
    lightsabers to a funky beat; as you might expect, it’s pretty fun. Alternatively,
    there are shooters like Hover Junker or the truly inventive Superhot VR, which
    has the novel gameplay mechanic of time only moving when you do, making for some
    cool bullet-dodging moments.


    Racing games like Dirt Rally and flight simulators like Elite: Dangerous are particularly
    popular with VR due to the fact that you’re


    ![](img/f51994701f272059dc108a0376ffceb8_118_0.png)


    consigned to a cockpit, giving you the sense of speed and forward motion without
    the clumsiness of movement that can sometimes come from ‘living’ inside a VR world.
    There are naturally experiences that can only work in VR, too, and while we still
    haven’t seen the very best of what virtual reality is capable of, there are already
    some interesting concepts. Keep Talking and Nobody Explodes, for example, is a
    hilarious game that has the headset wearer trying to defuse a bomb that only they
    can see with instructions from onlookers outside the virtual world. Job Simulator
    is capable of endless laughs, too, set in the near-future where


    It might not tax your hardware very much, but Superhot is a must-play FPS – VR
    or not.


    Dirt Rally is already one of the best rally racing games available, so the fact
    that there’s a VR mode for cockpit view should really help to bring you into the
    tense races.


