  md: '![](img/f51994701f272059dc108a0376ffceb8_47_0.png)


    While SSD used to be prohibitively expensive, it has come down in price in recent
    years to mean that it’s worth the cost to take advantage of the speedier read
    times.


    efficient power supply. Without getting into the gritty details too much, an efficient
    PSU more effectively converts input AC into output DC for the computer’s hardware,
    meaning that there is less wasted energy. In the long run this results in lower
    energy bills for running your gaming rig, but in the short term it means that
    there’s less heat pumped out by the PSU into the case and therefore your system’s
    internal heat won’t be affected too dramatically—and heat reduction is crucial
    to the longevity of your hardware. With this in mind, only buy a PSU rated in
    the 80 Plus scheme. This guarantees an efficiency of at least 80%, with ratings
    covering Bronze, Silver, Gold, Platinum, and Titanium; the higher the grade the
    more pricey the PSU will be, but it’s a solid investment to spend a little extra
    here.


    The last thing to think about is what’s known as ‘modular cabling’, a means by
    which the power supply can have all unused cables removed to clear up space and
    clutter within the case. They’re a lovely bonus that you will pay a little more
    for, but it’s entirely optional and is only really worth considering if you’re
    particular about keeping the inside of the case clutter free.


    # Storage


    When it comes to storage, the industry is fairly consistent. There are always
    new innovations for faster and more secure storage options, and those are typically
    the most expensive purchases. Hard disk drives (HDD) have been around for decades,
    physically write data onto a storage medium and are the cheapest options available.
    Solid-state drives have been around for a while too, but are much quicker and
    are still going through evolution. On top of that there are M.2 SSD options, which
    are increasingly popular and are installed directly onto the motherboard with
    a much smaller form factor. While M.2 connections are quicker than their SATA
    SSD drive equivalents, the difference between load times aren’t so significant
    to be the primary reason to opt for this version, however the prices between the
    two aren’t often that different—in fact most manufacturers will offer either option
    as part of a particular model of SSD at pretty much the same price. While solid-state
    drives have become much more affordable in recent years, they’re still limited
    in terms of both size and price. Since installing a large number of games can
    easily chew through a terabyte of data, it’s unfeasible for most of us to kit
    out a machine entirely in


    Increasingly M.2 SSD drives are becoming more popular inside gaming PCs, which
    offer negligible read times over SATA SSD but are installed directly into the
    motherboard.


    ![](img/f51994701f272059dc108a0376ffceb8_47_1.png)'
  merge: -1
  img_proc: true
- pgno: 48
  md: '![](img/f51994701f272059dc108a0376ffceb8_48_0.png)


    SSD storage. So what most people tend to do is to equip the machine with both
    types: 250GB or 500GB of quicker SSD storage for the installation of the operating
    system and regularly accessed programs and games, and 2TB or 3TB of standard hard
    drive storage for all those games. You could probably spend a little less on just
    a single 1TB solid-state drive than this combo, but then you''re more likely to
    encounter situations of having to balance which games you want installed. It''s
    a preferential thing and you''ll easily find a balance that fits your needs, but
    the beauty of storage is that it''s one of those few parts of computer hardware
    that can be upgraded as and when you need to.


    Of course, since all your data will be stored on these drives, you''ll want to
    make sure the one you''re buying is trusted. We can''t entirely help with this,
    though purchasing a Samsung, Western Digital, Crucial or Seagate drive is more
    likely to offer a degree of security. As ever, user reviews will be your friend
    here.


    # Cooling


    When it comes to cooling your gaming PC, you have two options open to you: air
    ventilation with fans or an all-in-one liquid cooler. The difference is significant,
    since one draws the hot air through the middle of your case and out through exhaust
    fans at the back or top while the other transfers the produced heat directly to
    the radiator at the edge of the case where it is


    dissipated immediately into the cool air outside of the case. The latter naturally
    sounds much better, but the trickiness of installing an AIO cooler, the risk that
    comes with having water so close to your computer''s innards and the higher cost
    means it''s certainly worthwhile considering alternatives. For one, the radiators
    take up much more space than a couple of fans, and if you''re not overclocking
    any of your parts then actually it should be sufficient to add fans into the system
    to get the job done cheaply and just as effectively.


    The fact of the matter is, liquid cooling is often seen as the end goal for an
    enthusiast PC builder purely for its complicated and risky nature. Absolute beginners
    likely aren''t looking to reach this Holy Grail straight away, especially since
    the likes of dual-GPU setups and overclocking probably isn''t on their mind. There''s
    already a lot to think about when it comes to building your first gaming PC, so
    why make it more complex than it needs to be, especially when air cooling is more
    than enough for standard single-GPU systems?


    Regardless of your choice, there''s a certain amount of standardisation to help
    you make a decision, this tying into the available space of your case. Typically
    a PC case will have a certain allotment of space divided into 120mm, 140mm, 240mm,
    280mm and finally 360mm spaces for fans and radiators; how these are divvied up
    is entirely down to you.


    Ensuring your gaming PC runs coolly is extremely important, but liquid cooling
    isn''t automatically the best option for every system.'
