- pgno: 13
  md: '![](img/f51994701f272059dc108a0376ffceb8_13_0.png)


    Esports are becoming increasingly popular both at a competitive level and as entertainment
    for viewers. This is largely why high-skill games like Dota 2 or League Of Legends
    are so popular on Twitch.


    Fortnite is one of the most played games, and consistently one of the most streamed
    (and watched). The bubble doesn''t look set to burst just yet, either.


    # The Streamer


    Streaming gameplay onto Twitch or recording videos for YouTube is an incredibly
    popular way of gaming, some driven by the huge success of big-name video content
    creators while others just enjoy having people to interact with and learn from
    while they''re gaming. Since the big question first and foremost comes down to
    the sorts of games you''ll want to stream, this will dictate the kind of hardware
    you''ll need. It''s worth remembering that, since the intention is to share your
    gameplay with the world, there''s


    a certain expectation of visual quality that people will expect, if they can''t
    make out the game, why would they stay and watch?


    With that said, you can still build a fairly capable machine around the £1,300
    mark, which will allow for most games to be played at their near-best. You will
    likely want to grab accessories like a second monitor – which doesn''t need to
    be as high resolution as your primary screen – or a decent microphone and webcam,
    but these come down to personal preference and how seriously you want to take
    your streaming sessions.


    However, there are still some concessions you''ll need to consider. Multitasking
    will be important, especially if you want a dual-monitor setup, so a multi-core
    processor is essential as is a larger amount of RAM. The games you''ll play will
    dictate the graphics card you''ll need and therefore the final price, so take
    a look at the recommended system requirements of the games that you fancy and
    get something similar or greater. Here''s our recommendation for a mid-range PC
    designed for streaming:


    ![](img/f51994701f272059dc108a0376ffceb8_13_1.png)


    +   - Bitfenix Prodigy Case

    +   - Asus Z97I-Plus Motherboard

    +   - Intel Core i5 4690K

    +   - Arctic Cooling Freezer 7 Pro Rev 2 CPU cooler

    +   - NVIDIA GeForce GTX 960 2GB

    +   - Corsair 2000MHz DDR4 8GB RAM

    +   - 1TB Seagate SSHD Hybrid drive

    +   - Corsair CX600 PSU'
