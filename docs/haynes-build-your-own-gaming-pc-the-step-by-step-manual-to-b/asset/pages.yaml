  md: '# PART 4


    # Streaming and video capture


    If you’re getting into building a gaming PC because you’ve seen the fun that people
    can have on Twitch or YouTube as the community of gamers join in with you while
    you play, then there are some important facets of your hardware and software that
    you should consider. While not entirely necessary, you’ll want to consider some
    important, additional equipment alongside your computer, while having the right
    software to stream or record your gameplay footage and audio.


    Setting up a livestream is not a simple task, but OBS helps make the process that
    bit easier.


    ![](img/f51994701f272059dc108a0376ffceb8_88_0.png)


    Firstly, if you want to take video content seriously then you’ll need to consider
    a good quality microphone. Most fans of video gameplay won’t care about ‘raw’
    footage of you navigating a level, puzzle or menu; you’ll need to spice it up
    with commentary and the only worthwhile way of doing that is with a decent quality
    microphone. This could be included as part of a gaming headset or a separate tabletop
    standing mic, but it’s important all the same. This could also be said about a
    webcam, though in truth it’s not 100% necessary to show your face, though standard
    practice generally means that the more recognisable streamers tend to have a picture-in-picture
    of themselves playing the game. Lastly, if you really want to go the whole hog,
    then a second monitor could be a decent idea. This way you’ll have a separate
    screen on which you can have a browser open of your viewers’ comments, and that’ll
    be a huge boon in interacting and growing your community of fans.


    When it comes to software there are a large number of options available that people
    will recommend, such as XSplit and Streamlabs. However, the one that comes up
    the most and is by far the most effective and feature-packed is OBS, Open Broadcaster
    Software. This suite of streaming and video recording tools is open-source software,
    meaning it’s free for anyone to download and use. But that’s not why it’s so useful;
    its community of developers has created one of the most robust and complete streaming
    packages around and though it can be a bit finicky to set up at first, it’s all
    you’ll ever need to get your gameplay, camera feed and audio online at once.'
