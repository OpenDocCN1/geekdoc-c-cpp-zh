  md: 'Every BIOS will look different, from older blue screen styles like this to
    more modern, higher resolution options – often with black screens.


    Overclocking lets you access more power from your processor, graphics card and
    even memory by overriding their factory settings and tinkering with them to best
    optimise them for your own PC hardware and set-up. It can mean squeezing the very
    best performance out of your system, or enhancing older parts so that they last
    a little bit longer. Understanding overclocking means you can make the most out
    of your gaming PC, and it''s a helpful way of saving on upgrades or the initial
    budget.


    Since overclocking does mean you''re tampering with the base optimal settings,
    it will mean those parts will run hotter, and higher temperatures can lead to
    failing hardware – and not only the parts that you''ve overclocked. Yet remember
    that these factory settings are often set quite a bit lower than they need to
    be, making the out-of-the-box hardware you buy for your PC more likely to be compatible
    with a wide range of PCs and suffer fewer faults as a result. In the eyes of the
    manufacturer it''s better to be safe than sorry, so don''t let the potential issues
    put you off. That''s not to say you shouldn''t be careful, of course: it''s a
    gradual


    process of incremental upgrades, and if you are interested in attempting to supercharge
    your PC then you need to do so in small stages with regular tests. In that sense
    it can be a bit of a laborious task, but much like the thrill of putting together
    your first gaming PC the sensation of reaching new and better benchmarking tests
    can be enough of a thrill to get enthusiasts interested.


    To help you get your head around overclocking your hardware we''ve detailed everything
    you need to know to assist in your own overclocking adventures. Since every piece
    of hardware is different, there''s no sure-fire, step-by-step method to unlocking
    your PC''s full potential, but as long as you have the knowledge to follow the
    process without any concern then you''ll soon find it''s not nearly as scary as
    it first sounds. We''ll also document some of the best, most useful pieces of
    software you''ll need for benchmarking – the process of stress-testing your PC
    to ensure your changes are safe – and some of the most popular games and applications
    overclockers like to use to show off just how powerful their PCs really are.


