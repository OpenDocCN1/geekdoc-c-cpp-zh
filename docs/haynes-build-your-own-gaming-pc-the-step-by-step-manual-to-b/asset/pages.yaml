  md: '# PART 2 Anatomy of a gaming PC


    +   Understanding the basics 20

    +   Research your build 25

    +   Motherboards 26

    +   Central Processing Unit (CPU) 30

    +   System memory 34

    +   Graphics cards 37

    +   Cases 41

    +   Power, storage and cooling 45


    On the face of it, building your own gaming PC sounds like a difficult and complicated
    task that could turn into an engineering marathon. While it is certainly true
    that you could spend months building a modified case with a custom liquid-cooling
    system, it is also possible to slap the hardware together in less than an hour.


    Perhaps that sounds impossible, but think about it in the sum of its parts. With
    the case open, it’s just a matter of installing the power supply and the motherboard
    then adding in the CPU, memory, graphics card and any storage or media drives
    on top of that. Perhaps this sounds a little dismissive of what might seem like
    a complicated job to a newcomer, but in truth modern computer hardware has been
    standardised so much over the years that it’s pretty much a case of plug and play.
    So long as you’re methodical and follow your connections properly, the machine
    can be up and running with minimal fuss in less time than it takes to install
    Windows.


    However, as with so many things, a lot of the success of the work is in the planning
    stage. If you plan the job poorly, you may spend some time shopping for a power
    supply extension cable or a cooling fan that is essential to finish the job. We
    should also sound a note of caution: if you order incompatible parts (such as
    the wrong memory or processor), you may find yourself in the position where it
    is impossible to complete your PC build without ordering a replacement component.'
