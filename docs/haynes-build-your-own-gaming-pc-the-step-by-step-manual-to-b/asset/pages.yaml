  md: '# System memory


    System memory or RAM is a major part of your PC build since it generally affects
    how quick it is at loading programs or data, and the cost can be significant with
    128GB kits of DDR4 costing around £600. But that’s an absolute extreme and is
    completely unnecessary for any but the most obsessive of tech-heads. While the
    memory market is in a constant state of change – as with any tech industry – there’s
    mercifully a good bit of consistency when it comes to what works, compatibility
    and requirements for gaming.


    A lot of high-end RAM well suited to gaming comes with customisable RGB lighting,
    which is a nice extra for those who buy a PC case with a glass panel to see inside.


    There are three factors to consider: the number of modules, the capacity of the
    modules and the clock speed of the memory. There are hundreds of combinations
    of makes and models, but perhaps the starting point should be the heat spreaders.
    That may sound like a cosmetic point, but you need to be sure the memory will
    fit in your motherboard and won’t interfere with a high-end air cooler. On the
    other hand, if you are using liquid cooling then you can be confident the heat
    spreaders won’t pose a problem.


    How much memory do you need? Truthfully, you can literally run as much memory
    as you can afford, but you are unlikely to gain much benefit from installing more
    than 16GB. There is no harm in spending the extra cash on 32GB if you really feel
    the speed of your system is important, but anything beyond that is just frivolous.
    There’s


