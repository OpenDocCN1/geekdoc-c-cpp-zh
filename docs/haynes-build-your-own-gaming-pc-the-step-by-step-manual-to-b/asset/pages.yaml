  md: '# PART 4 Storage cleaning


    While not directly tied to gaming itself, there’s no denying that keeping your
    storage drive clean and optimised is a great way to keep your system running smoothly
    and effectively. Over the years, your computer’s storage can become crammed with
    unwanted, unnecessary or even unused data. The more data on your hard disk or
    SSD, the more there is to check and clarify at any one time. It’s not something
    you may notice happening, but eventually an overclogged storage drive can have
    an impact on your computer’s performance – especially if you’re running low on
    space. The problem is, manually rifling through all your folders and files periodically
    isn’t fun, and nor is it effective since you’ll almost always miss something.


    Keep on top of the junk data on your PC and it’ll go a long way to keeping your
    system running smoothly.


    As such, it might be worthwhile to consider installing software to do this for
    you. There are countless programs available that can scour your disk drives to
    find out what is worthless and can be removed. Many of them come with built-in
    tools to help in numerous other manners too, such as defragmentation or application
    removal, essentially making these suites more about general system optimisation
    rather than purely cleaning up your disk drives. Picking


    one from the many available packages can be tricky, especially since you’ll need
    to think about whether you want a free option, a per-licence payment or the choice
    of a subscription for regular updates to the software. The name CCleaner has remained
    a staple in the industry for years and provides most of the core features for
    free, so if you’re stuck with figuring out what your own personal needs are on
    this front then this is a safe option to go for.


