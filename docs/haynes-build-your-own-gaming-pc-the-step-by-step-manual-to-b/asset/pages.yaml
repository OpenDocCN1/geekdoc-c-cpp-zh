  md: '# PART 2

    Central Processing Unit (CPU)


    Let’s talk about processors. Specifically, let’s talk about the CPU (Central Processing
    Unit), as opposed to the GPU (Graphics Processing Unit) or even the APU (Accelerated
    Processing Unit). The CPU is often referred to as the brain of your computer,
    but silicon can’t really think for itself. In fact, the CPU is just a very clever
    calculator that performs mathematical calculations measured in billions per second.


    The problem with this analogy is that the CPU sends this torrent of numbers back
    and forth around the PC and in particular feeds a stream of data to your graphics
    card(s) where it is rendered as jaw-droppingly awesome pictures on your monitor(s).
    If you follow that way of thinking, the CPU is more like the heart of your PC
    than the brain, but no matter how you imagine it the CPU is hugely important.


    The elaborate packaging is one thing, but the i9 9900K is one of the top-end,
    mainstream processors at the moment.


    ![](img/f51994701f272059dc108a0376ffceb8_31_0.png)


    The first step is to select the family of CPU that you want to use. This will
    enable you to settle on a particular CPU socket and a narrow selection of motherboard
    chipsets, and when you combine that with your chosen form factor you will be in
    a better position to choose the motherboard for your new PC.


    There are only two mainstream contenders for the CPU market: AMD who has been
    playing the mouse to Intel’s rather intimidating cat.


    There are a number of features you need to consider when you compare one CPU with
    another, and we’re going to look at those individually in turn. It is undoubtedly
    one of the most important – and most expensive – purchases you’ll make for your
    gaming PC, but it does come with its own set of acronyms and jargon. Everything
    from the socket to the number of cores will likely confuse the layman. So rather
    than throw some examples into the mix and leave it at that, we’re first going
    to run down each of the elements you’ll come across when buying a CPU.


    # Socket


    What the term ‘socket’ denotes is simply the type of mechanical connection the
    processor chip has with the motherboard. Its purpose is to help you buy compatible
    parts and so long as you buy a motherboard that matches the socket type then,
    at least at a mechanical level, you’ll have parts that fit together. Ordinarily
    you’ll be looking at a socket 1151 for Intel CPUs and the AM4 for AMD chips, but
    these can change from one day to the next; so long as the sockets match up with
    your motherboard, there are few other reasons to worry about this element.'
