  md: '![](img/f51994701f272059dc108a0376ffceb8_102_0.png)


    # Keyboard suggestions


    **Razer Cynosa Chroma**


    _RRP: £64.99_


    This mechanical keyboard offers pretty much everything you might need from a great
    gaming keyboard: great design, backlighting, silent MX keys and non-intrusive
    software too. But it’s not incredibly expensive like so many keyboards; while
    you could certainly opt for a membrane keyboard for less, there aren’t many mechanical
    boards as good as this that you could get cheaper.


    **Logitech G Pro**


    _RRP: £99.99_


    As a better option for LAN events, the Logitech G Pro is lightweight and compactly
    designed while still maintaining a good ergonomic look and feel. Since it is all-purpose,
    it’s not as fancy as the higher-end models, but in terms of comfort to use when
    space available is at a premium, there are few that can beat this keyboard.


    **Corsair K70 RGB Mk.2**


    _RRP: £169.99_


    Corsair’s range ticks all the right boxes with Cherry MX Red switches, individual
    backlighting customisation for each key (so you can highlight WASD, for example)
    and a gripped wrist rest. Alternatives come in the FPS-focus keyboard that comes
    with contoured movement and weapon select keys, or the K95 – which is essentially
    the K70 but with a set of bindable keys and stored profiles for different games.


    **SteelSeries Apex Pro**


    _RRP: £199.99_


    While the price tag might be off-putting, this keyboard has solidified itself
    as the hardcore gamer’s dream. It has adjustable per-key mechanical switches in
    the keyboard, allowing you to control the sensitivity of each key individually
    and therefore allowing you to customise your gaming experience to your needs.
    An OLED screen provides info from certain games, too, adding that extra advantage.'
