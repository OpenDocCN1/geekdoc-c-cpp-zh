  md: '![](img/f51994701f272059dc108a0376ffceb8_160_0.png)


    The modular design of modern PSUs is superb but adds a load of extra connections
    that can cause problems.


    Disconnect each cable in turn and look for bent pins on the plugs and sockets.
    These can usually be straightened with small, pointy pliers and a steady hand.
    Reconnect everything, including the monitor and power cable, and turn the computer
    on once more. Leave the covers off to aid observation. Does it now burst into
    life as if by magic? Rather gallingly, unplugging and replacing a cable is sometimes
    all it takes to fix an elusive but strictly temporary glitch.


    # PSU problems


    Look for an LED on the motherboard (check the manual for its location). This should
    illuminate whenever the PSU is connected to the mains power and turned on, even
    when the computer itself is off. The LED confirms that the motherboard is receiving
    power; if it stays dark, the PSU itself may be at fault.


    When you turn on the computer, do the fans remain static? Does the CD drive disc
    tray refuse to open? Is all depressingly dead? This would confirm the PSU as the
    problem. Use an alternative power cable, perhaps borrowed from the monitor, just
    to be sure. If still nothing happens, remove and replace the PSU.


    NEVER TRY TO OPEN OR REPAIR A PSU. Nor should you try running it while it''s disconnected
    from the motherboard, as a PSU can only operate with a load.


    # Finding a connection fault


    By now you should be reasonably confident that you have mains power arriving at
    the input of your PSU. Until a few years ago, the fact that mains power arrived
    at the PSU pretty much


    guaranteed that 12V, 5V and 3.3V would flow to the motherboard, graphics card
    and SSD, and if it didn''t then you could be confident the PSU was faulty.


    The rise of the modular PSU changed all that. While the modular PSU with its detachable
    cables looks much neater than the messy old PSUs from the past, this change introduces
    a load of new connection points.


    The simple rule of thumb is that if a plug fits in a socket you are safe to use
    it, but it makes sense to read the legends printed on the cables and PSU just
    to make sure you have the right thing in the right place. There is a good chance
    that the cables will all appear to be properly connected, but you need to be sure
    you hear that satisfying click as you push them into place. If you have any doubts,
    give each cable a gentle tug to ensure it is secure.


    No doubt you have carefully routed the PSU cables inside your PC so that they
    feed around the back of the motherboard tray and, inevitably, make some twists
    and turns en route to their destination. If you have any doubt in your mind, it
    is best to make direct connections and simply feed the cables across the motherboard.
    You can always tidy it up once you have fixed your problems, but for the moment
    you simply need power and, of course, to ensure the cables are clear of any fans.


    Power supply to your graphics card is a slightly vexing issue. You don''t need
    much power to start Windows running and get the desktop displayed on your monitor,
    but every graphics card on the market insists that you connect those dratted 6-pin
    and 8-pin connectors before the system will even think'
