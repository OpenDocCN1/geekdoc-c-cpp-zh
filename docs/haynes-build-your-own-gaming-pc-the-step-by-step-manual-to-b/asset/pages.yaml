  md: '# Overclocking your memory


    With so many different types and grades of RAM, and even varying sizes and capabilities
    within each type, it can be something of a minefield trying to navigate the complications
    of overclocking your system’s memory. Add in the fact that some parts are considerably
    better suited to overclocking than others and the fact that the performance gains
    are comparatively small, and it can seem a somewhat fruitless task. All the same,
    if you are looking to squeeze every last ounce out of your PC then you may feel
    you want to manually reconfigure your RAM settings to get your money’s worth.
    But because of all these varying factors, it’s not suitable for a step-by-step
    guide to overclocking your RAM; instead we’ll presume you have at least tweaked
    your CPU settings (since you’ll want to do that first anyway), so you’ve already
    experienced your system’s BIOS. Here then we’re going to detail some of the things
    you need to look out for when overclocking your memory, and explain how you can
    go about doing it.


    # Key things to know


    Testing software – As with any form of overclocking, it’s always good to test
    the changes you’ve made. When it comes to RAM it’s a little trickier to test,
    of course, but there is software that can help. First you’ll want to make use
    of CPU-Z, as you have with overclocking the processor, while Prime95 is a good
    overall system stress-tester. Specifically for RAM, though, you can download testing
    software such as MaxMem or SiSoftware’s Sandra, which will check the memory for
    its new potential.


    encounter problems and will have to lower it slightly. As ever, the faster it
    will run the more strain you’ll be putting it under, so it’s better to find your
    maximum RAM frequency and drop it down a single setting to maintain reliable regular
    use from your memory. Also remember that your memory will be limited by what your
    FSB is capable of – and as we discussed in the CPU section, that can often be
    changed manually. If you want to know more, read the next point.


    Frequency – Most commonly referred to as the DRAM frequency, this is the speed
    at which your RAM is capable of running. It’ll say the speed your memory will
    be able to run at on the packaging, in the RAM’s product description, or even
    printed on the label on the RAM itself. It is measured in MHz from very low-end
    at 333MHz to 2,400MHz and over. It’s a large part of what affects how quickly
    your RAM can send and receive data. You’ll find this option in your BIOS and it
    can be adjusted to better match what your RAM is expected to achieve, but remember
    all hardware is different – even if you have increased your RAM frequency to the
    number it says on the label, you may still


    FSB:DRAM – In CPU-Z you’ll see this figure, which is the FSB to DRAM frequency
    ratio. Associated with the point on frequency above, it tells you how fast one
    part is running with regard to the other. Your RAM will always be limited by the
    speed of your FSB, so you want to try and have that ratio as close to 1:1 as possible
    – if the FSB is faster than your memory then you’re going to get a bottleneck,
    and the speed of your RAM will limit the FSB. Alternatively it is not necessarily
    worse to have the RAM running faster than the FSB, because while the latter will
    bottleneck the former the way your memory accesses data (and its purpose in a'
