    page or a trustworthy and reliable source, like CNET.


    While we’re talking about all this, however,


    it’s worth mentioning the importance of tidiness. You’ll be surprised how common
    it is for PC users to install something for a one time use and forget all about
    it – at best taking up a chunk of your hard drive space, at worst slowing your
    PC down by taking up CPU processing with behind-the-scenes tasks. Some tools will
    boot up alongside your PC’s start-up, too, and while this is sometimes unavoidable
    – most gaming keyboards and mice come with bespoke software, for example – an
