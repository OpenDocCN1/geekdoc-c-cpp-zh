    change and stress-test the machine again.


    # 9. Repeat the process


    This is the easiest way of overclocking your CPU, and providing your parts are
    open to overclocking you should have no problems following it from here. Repeat
    the process of slowly increasing the multiplier/clock ratio and the core voltage,
    stress-testing as you go until you have a setting you’re happy with. As you increase
    the voltage remember to keep an eye on the running temperature of your CPU. A
    maximum of 85°C is generally considered safe, but always search online for the
    right temperature for your processor. And remember that the higher the temperature
    and the harder you run your components the more likely you are to decrease their
    lifespan – like anything that gets excessive use, really. It’s not always better
    to overclock your machine until it is needed for this reason.


    # 10. Increasing the clock speed


    If you’ve got locked components then you won’t be able to adjust the multiplier/clock
    ratio through the BIOS, but that doesn’t mean you can’t still overclock. You may
    still be able to subtly increase the base clock to maximise your potential gains.
    This can cause a greater strain on your system as a whole, especially as adjusting
    the base clock can also have


    a knock-on effect with other components – such as the various data buses transferring
    information between each part – and these may not work well with increased speeds,
    so exercise a lot of caution when making these changes. To adjust the clock speed
    you need to once again enter the BIOS and look for the CPU frequencies menu –
    most likely in the same menu or submenu where you found the multiplier/clock ratio
    options. Look for the reference to your base clock speed: in Intel chips you’re
    probably looking for ‘BCLK’, but in AMD chips you may be adjusting the data bus
    instead, so look for ‘FSB’ or something similar. Your motherboard manual will
    have all the details you need. As with the multiplier you want to slowly increase
    the speed at which the base clock speed performs (measured in MHz), save the settings
    and then reboot the system into Windows to stress-test. The increments by which
    it can be increased won’t be too vast, and that’s for the best – as always, slow
    and steady is preferred here.


    # 11. Move on to GPU or RAM


    Once you’ve settled on a speed and running standard for your CPU, you may be hungry
    to adjust even more of your PC. Remember that you can always enable multi-core
    overclocking on some quad-core chips, and that will give you even greater control
    – especially when it comes to games, since rarely are all four cores of a chip
    used in computation for games. After that you’ll likely want to overclock your
    graphics card, which will, in most cases, be bearing the brunt of your PC’s computation
    when it comes to games. Even your RAM can be overclocked, enabling it to run at
    the speed it is intended to, since most memory is actually underclocked initially.


    ![](img/f51994701f272059dc108a0376ffceb8_130_0.png)


    There’s a wide range of stress-testing software available. Prime95 shown here
    is good for overall system tests, great for overclocking your CPU or RAM.'
