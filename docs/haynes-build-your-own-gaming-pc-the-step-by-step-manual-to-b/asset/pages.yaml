- pgno: 166
  md: '# PART 8 Beep and error codes


    The feared Windows ‘Blue Screen of Death’ is far less common than it used to be.


    If it all goes wrong and you still can’t get your PC up and running then fear
    not, because many motherboards have features that can help you decipher precisely
    what the problem is. These only really occur when the problem is serious enough
    to prevent it from even booting up, so there aren’t often too many to worry about.
    Here we’re reprinting the beep and error codes from AMI and Award, makers of two
    very commonly used BIOS programs. But worry not if your codes are just a little
    too complicated to decipher – such as those from Phoenix – because there’s always
    a resource online you can hunt down to discover the solution.


    ![](img/f51994701f272059dc108a0376ffceb8_166_0.png)'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# AMI BIOS beep codes


    | Number of Beeps | Problem | Action |

    |---|---|---|

    | 1 short | Memory refresh timer error. | Remove each memory module, clean the
    connecting edge that plugs into the motherboard socket, and replace. If that doesn’t
    work, try restarting with a single memory module and see if you can identify the
    culprit by a process of elimination. If you still get the error code, replace
    with known good modules. |

    | 2 short | Parity error. | As with 1 beep above. |

    | 3 short | Main memory read/write test error. | As with 1 beep above. |

    | 4 short | Motherboard timer not operational. | Either the motherboard is faulty
    or one of the expansion cards has a problem. Remove all cards except the video
    card and restart. If the motherboard still issues this beep code, it has a serious,
    probably fatal problem. If the beeps stop, replace the cards one at a time and
    restart each time. This should identify the guilty party. |

    | 5 short | Processor error. | As with 4 beeps above. |

    | 6 short | Keyboard controller BAT test error | As with 4 beeps above. |

    | 7 short | General exception error. | As with 4 beeps above. |

    | 8 short | Display memory error. | The video card is missing, faulty or incorrectly
    installed. Remove, clean the connecting contacts and replace. If that does not
    work, try using a different video card. If you are using integrated video instead
    of a video card, the motherboard may be faulty. |

    | 9 short | ROM checksum error. | As with 4 beeps above. |

    | 10 short | CMOS shutdown register read/write error. | As with 4 beeps above.
    |

    | 11 short | Cache memory bad. | As with 4 beeps above. |

    | 1 long, 2 short | Failure in video system. | A fault with the video BIOS ROM
    has occurred. Uninstall the graphics card and use the on-board graphics to find
    out if your GPU is the one causing the fault. |

    | 1 long, 3 short | Memory test failure. | There’s an issue with your system memory;
    reinstall the RAM. If it is still faulty, try running the PC on a single stick
    of RAM (alternating between different sticks if the fault still occurs). |

    | 1 long, 8 short | Display test failure. | A fault with your video card—either
    your own GPU or on-board graphics on the motherboard—or its memory. The system
    will boot without it, but it means there’s likely a hardware fault with your video
    card. |


    # AMI BIOS error codes


    Here are some examples of onscreen error messages:


    | Error | Action |

    |---|---|

    | Gate20 Error | The BIOS is unable to properly control the motherboard’s Gate
    A20 function, which controls access of memory over 1MB. This may indicate a problem
    with the motherboard. |

    | Multi-Bit ECC Error | This message will only occur on systems using ECC-enabled
    memory modules. ECC memory has the ability to correct single-bit errors that may
    occur from faulty memory modules. A multiple bit corruption of memory has occurred,
    and the ECC memory algorithm cannot correct it. This may indicate a defective
    memory module. |

    | Parity Error | Fatal! Memory Parity Error. System halts after displaying this
    message. |

    | Boot Failure | This is a generic message indicating the BIOS could not boot
    from a particular device. This message is usually followed by other information
    concerning the device. |

    | Invalid Boot Diskette | A diskette was found in the drive, but it is not configured
    as a bootable diskette. |'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# AMI BIOS error codes continued:


    | Error | Action |

    |---|---|

    | Drive Not Ready | The BIOS was unable to access the drive because it indicated
    it was not ready for data transfer. This is often reported by drives when no media
    is present. |

    | A: Drive Error | The BIOS attempted to configure the A: drive during POST, but
    was unable to properly configure the device. This may be because of a bad cable
    or faulty diskette drive. |

    | Insert BOOT diskette in A: | The BIOS attempted to boot from the A: drive, but
    could not find a proper boot diskette. |

    | Reboot and Select proper Boot device or Insert Boot Media in selected Boot device
    | BIOS could not find a bootable device in the system and/or removable media drive
    does not contain media. |

    | NO ROM BASIC | This message occurs on some systems when no bootable device can
    be detected. |

    | Primary Master Hard Disk Error | The IDE/ATAPI device configured as Primary
    Master could not be properly initialised by the BIOS. This message is typically
    displayed when the BIOS is trying to detect and configure IDE/ATAPI devices in
    POST. |

    | Primary Slave Hard Disk Error | The IDE/ATAPI device configured as Primary Slave
    could not be properly initialised by the BIOS. This message is typically displayed
    when the BIOS is trying to detect and configure IDE/ATAPI devices in POST. |

    | Secondary Master Hard Disk Error | The IDE/ATAPI device configured as Secondary
    Master could not be properly initialised by the BIOS. This message is typically
    displayed when the BIOS is trying to detect and configure IDE/ATAPI devices in
    POST. |

    | Secondary Slave Hard Disk Error | The IDE/ATAPI device configured as Secondary
    Slave could not be properly initialised by the BIOS. This message is typically
    displayed when the BIOS is trying to detect and configure IDE/ATAPI devices in
    POST. |

    | Primary Master Drive – ATAPI Incompatible | The IDE/ATAPI device configured
    as Primary Master failed an ATAPI compatibility test. This message is typically
    displayed when the BIOS is trying to detect and configure IDE/ATAPI devices in
    POST. |

    | Primary Slave Drive – ATAPI Incompatible | The IDE/ATAPI device configured as
    Primary Slave failed an ATAPI compatibility test. This message is typically displayed
    when the BIOS is trying to detect and configure IDE/ATAPI devices in POST. |

    | Secondary Master Drive – ATAPI Incompatible | The IDE/ATAPI device configured
    as Secondary Master failed an ATAPI compatibility test. This message is typically
    displayed when the BIOS is trying to detect and configure IDE/ATAPI devices in
    POST. |

    | Secondary Slave Drive – ATAPI Incompatible | The IDE/ATAPI device configured
    as Secondary Slave failed an ATAPI compatibility test. This message is typically
    displayed when the BIOS is trying to detect and configure IDE/ATAPI devices in
    POST. |

    | S.M.A.R.T. Capable but Command Failed | The BIOS tried to send a S.M.A.R.T.
    message to a hard disk, but the command transaction failed. This message can be
    reported by an ATAPI device using the S.M.A.R.T. error reporting standard. S.M.A.R.T.
    failure messages may indicate the need to replace the hard disk. |

    | S.M.A.R.T. Command Failed | The BIOS tried to send a S.M.A.R.T. message to a
    hard disk, but the command transaction failed. This message can be reported by
    an ATAPI device using the S.M.A.R.T. error reporting standard. S.M.A.R.T. failure
    messages may indicate the need to replace the hard disk. |

    | S.M.A.R.T. Status BAD, Backup and Replace | A S.M.A.R.T. capable hard disk sends
    this message when it detects an imminent failure. This message can be reported
    by an ATAPI device using the S.M.A.R.T. error reporting standard. S.M.A.R.T. failure
    messages may indicate the need to replace the hard disk. |

    | S.M.A.R.T. Capable and Status BAD | A S.M.A.R.T. capable hard disk sends this
    message when it detects an imminent failure. This message can be reported by an
    ATAPI device using the S.M.A.R.T. error reporting standard. S.M.A.R.T. failure
    messages may indicate the need to replace the hard disk. |'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# AMI BIOS error codes continued.


    | Error | Action |

    |---|---|

    | BootSector Write!! | The BIOS has detected software attempting to write to a
    drive''s boot sector. This is flagged as possible virus activity. This message
    will only be displayed if Virus Detection is enabled in AMIBIOS Setup. |

    | VIRUS: Continue (Y/N)? | If the BIOS detects possible virus activity, it will
    prompt the user. This message will only be displayed if Virus Detection is enabled
    in AMIBIOS Setup. |

    | DMA-2 Error | Error initialising secondary DMA controller. This is a fatal error,
    often indicating a problem with system hardware. |

    | DMA Controller Error | POST error while trying to initialise the DMA controller.
    This is a fatal error, often indicating a problem with system hardware. |

    | CMOS Date/Time Not Set | The CMOS Date and/or Time are invalid. This error can
    be resolved by readjusting the system time in AMIBIOS Setup. |

    | CMOS Battery Low | CMOS Battery is low. This message usually indicates that
    the CMOS battery needs to be replaced. It could also appear when the user intentionally
    discharges the CMOS battery. |

    | CMOS Settings Wrong | CMOS settings are invalid. This error can be resolved
    by using AMIBIOS Setup. |

    | CMOS Checksum Bad | CMOS contents failed the Checksum check. Indicates that
    the CMOS data has been changed by a program other than the BIOS or that the CMOS
    is not retaining its data due to malfunction. This error can typically be resolved
    by using AMIBIOS Setup. |

    | Keyboard Error | Keyboard is not present or the hardware is not responding when
    the keyboard controller is initialized. |

    | Keyboard/Interface Error | Keyboard Controller failure. This may indicate a
    problem with system hardware. |

    | System Halted | The system has been halted. A reset or power cycle is required
    to reboot the machine. This message appears after a fatal error has been detected.
    |

    | AMIBIOS8 Error Messages version 1.0. Copyright of American Megatrends, Inc.
    Reprinted with permission. All rights reserved. |


    # Award BIOS beep codes


    | Number of Beeps | Problem | Action |

    |---|---|---|

    | 1 long beep followed by 2 short beeps | Video card problem | Remove the card,
    clean the connecting edge that plugs into the motherboard socket, and replace.
    If that doesn''t work, try an alternative video card to establish whether the
    problem lies with the card or the AGP slot. If you are using integrated video
    instead of a video card, the motherboard may be faulty. |

    | Any other beeps | Memory problem | Remove each memory module, clean the connecting
    edge that plugs into the motherboard socket, and replace. If that doesn''t work,
    try restarting with a single memory module and see if you can identify the culprit
    by a process of elimination. If you still get the error code, replace with known
    good modules. |

    | 1 long, 3 short | No detectable video card, or bad video card memory. | Ensure
    video card is correctly installed and powered. If it still occurs, there is a
    fault with the video card''s memory. |

    | High frequency beeps while running | Overheating CPU. | A sign that your CPU
    is not being cooled properly. First check the cooling systems are powered and
    functioning. If problems persist, first replace thermal paste and – if still occurring
    – install more efficient cooling systems. |

    | Repeating high/low beeps | Fault with CPU. | Check that the CPU is seated properly
    in its socket. If it is, the CPU may be damaged. This may also occur if the CPU''s
    heat is too much, follow above resolutions. |

    | Copyright of Phoenix Technologies Ltd. Reprinted with permission. All rights
    reserved. | |'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# Award BIOS error codes

    Here are the standard Award onscreen error messages:


    | Error | Action |

    |---|---|

    | BIOS ROM checksum error – System halted | The checksum of the BIOS code in the
    BIOS chip is incorrect, indicating the BIOS code may have become corrupt. Contact
    your system dealer to replace the BIOS. |

    | CMOS battery failed | The CMOS battery is no longer functional. Contact your
    system dealer for a replacement battery. |

    | CMOS checksum error – Defaults loaded | Checksum of CMOS is incorrect, so the
    system loads the default equipment configuration. A checksum error may indicate
    that CMOS has become corrupt. This error may have been caused by a weak battery.
    Check the battery and replace if necessary. |

    | CPU at nnnn | Displays the running speed of the CPU. |

    | Display switch is set incorrectly | The display switch on the motherboard can
    be set to either monochrome or colour. This message indicates the switch is set
    to a different setting from that indicated in Setup. Determine which setting is
    correct, and then either turn off the system and change the jumper, or enter Setup
    and change the VIDEO selection. |

    | Press ESC to skip memory test | The user may press Esc to skip the full memory
    test. |

    | Floppy disk(s) fail | Cannot find or initialise the floppy drive controller
    or the drive. Make sure the controller is installed correctly. If no floppy drives
    are installed, be sure the Diskette Drive selection in Setup is set to NONE or
    AUTO. |

    | HARD DISK initializing. Please wait a moment. | Some hard drives require extra
    time to initialise. |

    | HARD DISK INSTALL FAILURE | Cannot find or initialise the hard drive controller
    or the drive. Make sure the controller is installed correctly. If no hard drives
    are installed, be sure the Hard Drive selection in Setup is set to NONE. |

    | Hard disk(s) diagnosis fail | The system may run specific disk diagnostic routines.
    This message appears if one or more hard disks return an error when the diagnostics
    run. |

    | Keyboard error or no keyboard present | Cannot initialise the keyboard. Make
    sure the keyboard is attached correctly and no keys are pressed during POST. To
    purposely configure the system without a keyboard, set the error halt condition
    in Setup to HALT ON ALL, BUT KEYBOARD. The BIOS then ignores the missing keyboard
    during POST. |

    | Keyboard is locked out – Unlock the key | This message usually indicates that
    one or more keys have been pressed during the keyboard tests. Be sure no objects
    are resting on the keyboard. |

    | Memory Test | This message displays during a full memory test, counting down
    the memory areas being tested. |

    | Memory test fail | If POST detects an error during memory testing, additional
    information appears giving specifics about the type and location of the memory
    error. |

    | Override enabled – Defaults loaded | If the system cannot boot using the current
    CMOS configuration, the BIOS can override the current configuration with a set
    of BIOS defaults designed for the most stable, minimal-performance system operations.
    |

    | Press TAB to show POST screen | System OEMs may replace the Phoenix Technologies’
    AwardBIOS POST display with their own proprietary display. Including this message
    in the OEM display permits the operator to switch between the OEM display and
    the default POST display. |

    | Primary master hard disk fail | POST detects an error in the primary master
    IDE hard drive. |

    | Primary slave hard disk fail | POST detects an error in the primary slave IDE
    hard drive. |

    | Secondary master hard disk fail | POST detects an error in the secondary master
    IDE hard drive. |

    | Secondary slave hard disk fail | POST detects an error in the secondary slave
    IDE hard drive. |'
  merge: -1
  img_proc: true
