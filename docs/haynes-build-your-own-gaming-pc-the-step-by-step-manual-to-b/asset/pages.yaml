  md: '![](img/f51994701f272059dc108a0376ffceb8_32_0.png)


    AMD''s Ryzen range is its current selection, cheaper than an Intel equivalent
    but a fair alternative all the same.


    # Cores


    If we do consider a CPU to be a computer''s brain, then the number of cores essentially
    denotes just how many brains it has. Back in the day a computer would have a single
    chip with which it could calculate computations, with the speed of that particular
    chip affecting how fast those processes would be. Nowadays CPUs can have multiple
    cores, giving them the ability to multi-task far more easily. This is especially
    important for video games, where computations in physics systems and light rendering
    need to be performed while data needs to be streamed to the graphics card and
    hard drive – the more cores you have the more capable your machine is. It''s worth
    familiarising yourself with the sorts of games you''re playing, though. Multi-core
    processors are so prevalent these days that games developers know they can pretty
    much guarantee that they''ll have the multi-processing capabilities of at least
    four cores. However, it might be tempting to think more cores equals more power,
    and that''s not quite true; unless a program, game or tool has been developed
    specifically to make use of more cores, there likely won''t be any advantage in
    spending over the odds to increase the number and speed of those cores.


    If you find you''re likely to take part in processor-intensive activities, however,
    such as 3D design or video editing and rendering, then you may want to consider
    aiming for more cores rather than more speed. Quad core is the most common you''ll
    come across, though cheaper CPUs can come with dual cores while six and eight
    cores are on the way to superseding the long-time standard four cores – even if
    their costs are still a little prohibitive at the moment. Ultimately it comes
    down to a choice: if you''re going to be regularly putting strain on your computer
    with computation-heavy processes and regularly multi-tasking in these situations,
    then you''ll want to get yourself a CPU with a larger number of cores. If gaming
    is all you''re aiming for, then a quad-core chip will more than satisfy your needs.


    # Number of threads


    In truth this is almost always correlative to the number of cores your CPU has.
    If there are four cores, it''s highly likely there are four threads. Unless specifically
    told otherwise, processors will always complete the first task they''re given
    before moving on to the next, and so the number of threads refers to the total
    number of applications able to be executed on the CPU at any one time. Four cores,
    four threads, four applications. However, some processors offer a feature known
    as simultaneous multi-threading – or hyperthreading for Intel processors – whereby
    the operating system is told there are in fact twice the number of logical cores.
    While this doesn''t actually increase the number of cores available, it allows
    for the processor to multi-task two applications per core and switch tasks far
    more easily. It''s not a key aspect in CPU buying, but it''s a nice added extra
    to look out for.


    # Core size


    Measured in nanometers (nm) and relative to a single core on the CPU, the core
    size measurement is a factor you can largely'
