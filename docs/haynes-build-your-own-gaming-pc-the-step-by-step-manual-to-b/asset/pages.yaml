  md: '# The Pro Gamer


    The definition of a ''pro gamer'' is a fairly loose one and while it increasingly
    refers primarily to professional gamers – i.e. those competing at a high level
    at esports tournaments – it can also mean those level of gamers that are dedicated
    to the medium as a serious hobby. In either case, the demands of such a gamer
    is for a gaming PC that provides smooth gameplay for the highest-end games played
    at their visual best. What this means is a machine that can pump out any game
    at its ''Ultra'' settings at a smooth 60FPS (or greater), ideally without much
    in the way of tweaking settings or being picky about the hardware.


    As you might expect, this means spending quite a bit on some of the best parts
    available to gamers. Typically a pro gamer''s PC will have a little more aesthetic
    flair to the case itself, various customisable LED lights, flashy fans or a case
    that is designed as much for its attractive looks as its raft of options for hardware.
    Of course, this all comes down to personal taste, but either way you''ll be spending
    a good chunk of cash on a PC that fulfils the needs of a pro gamer.


    But make no mistake, our suggested build here is by no means the top echelon of
    gaming PCs. In terms of horsepower it''ll still offers no-holds-barred, high-end
    gaming with a full range of extras like solid-state storage drives, water cooling
    and the capacity for Scalable Link Interface (SLI) graphics cards. That''s not
    the case here, but if you want the absolute best then aiming around a price range
    of £1,800-£2,000 will get you a gaming computer that''ll see you right for years
    to come. Here''s an example of a high-end gaming PC build:


    +   - NZXT Source 340 Mid-Tower Case

    +   - Gigabyte X99 Gaming 5 Motherboard

    +   - Intel Haswell-E 5820K 3.30GHz CPU

    +   - Corsair H100i water cooler

    +   - MSI GeForce GTX 970 4GB

    +   - G.Skill 2400MHz DDR4 16GB RAM

    +   - Samsung 840 EVO 2.5in 250GB SSD

    +   - Seagate 2TB SSHD 3.5in Hard Drive

    +   - Corsair CX750 PSU


    The term pro gamer is often synonymous with ''hardcore gamer'', essentially denoting
    someone who plays all the latest and greatest games, from blockbuster shooters
    to the most intriguing indie games.


    ![](img/f51994701f272059dc108a0376ffceb8_14_0.png)'
  merge: -1
