  md: 'don’t need to adjust the voltage settings by much at a time, and again it should
    always be a gradual upgrade – more voltage going into the component will increase
    its running temperature so you want to be very conservative with your changes.
    A voltage increase of 0.0500 at a time is often enough, but remember to keep an
