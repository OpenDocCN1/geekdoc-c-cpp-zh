    computer system anyway) will mean it being faster is not really a negative. Where
    possible try to make sure your FSB:DRAM ratio is either 1:1 or has the larger
    number on the right-hand side.


    # RAM timings –


    The second most important number for your memory is its set of timings, often
    advertised as ‘CAS’ (Column Address Strobe) or ‘CAS Latency’ even though the latter
    is technically inaccurate. There are a variety of different timings, but there
    are four key figures to look out for. These can be found on the label on the RAM
    itself, and are usually styled with four different digits separated by a dash,
    for example: 13-15-15-28. These timings represent the various delays that your
    RAM will be put under


    when handling data, so the lower the number the better. While it might be advertised
    at these timings, it might be capable of much shorter delays. Using CPU-Z and
    the RAM timings given earlier as a guide, the four figures you''re looking to
    change are:


    +   CAS Latency (CL), in this case 13

    +   RAS# to CAS# Delay (tRCD), in this case the first 15

    +   RAS# Precharge (tRP), in this case the second 15

    +   Cycle Time (tRAS), in this case 28


    # Lowering RAM timings –


    While we could explain what these timings do and what they affect, that in itself
    is not too important;


