    so graphics are a huge consideration.


    Happily, unless you are deeply involved in the finer points of overclocking, we
    don’t need to know a huge amount about the technology behind graphics cards. There
    are only two companies in the gaming graphics chip market, AMD (which bought ATI)
    and NVIDIA, who consistently leapfrog each other as they develop new graphics
    chips and come up with clever ideas to make gameplay better. The wonderful thing
    for gamers is that AMD and NVIDIA GPUs have to work with a number of important
    technologies and this means that modern graphics cards are interchangeable in
    a gaming PC, provided we install the correct driver software to allow the card
    to work properly. Both AMD and NVIDIA support PCI Express 3.0 and the same 6-pin
    and 8-pin power connectors that you find on any decent power supply, while


    the display connections for hooking up to your monitor(s) are all the same, too.
    This means we are able to treat these competing graphics cards as a simple lump
    of graphics power, and don''t need to worry quite so much about compatibility.


    At present NVIDIA’s technology trumps AMD’s for efficiency and low power draw
    while delivering high performance, and the nature of the graphics market means
    that AMD has been forced to drop their prices to make up for their technological
    deficit. But these two companies also sell their reference cards to a whole host
    of manufacturing partners, and it’s here that the range of GPU availability broadens
    out.


