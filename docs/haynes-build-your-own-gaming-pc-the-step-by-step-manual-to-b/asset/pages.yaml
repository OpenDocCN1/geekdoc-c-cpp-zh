  md: '| Type of setting | What it affects | Details |

    |---|---|---|

    | Resolution | The number of pixels – and therefore clarity of the image – that
    is rendered onto your monitor. | Resolution is important for the visual fidelity,
    and ideally you''ll render a game to match that of your monitor''s resolution
    (probably 1080p or 1440p). However, it is also possible to render higher than
    your monitor''s resolution, which will be downscaled to fit the screen and provide
    even greater detail. |

    | VSync | Locks the frame rate to either 30 or 60 frames per second. | Some games
    struggle rendering fast moving actions – such as camera control – and this can
    result in screen-tearing. Enabling Vertical Synchronisation prevents any erratic
    frame-rate fluctuations to eliminate this. |

    | Adaptive VSync | The same as VSync, but disables itself when dropping below
    60 frames per second. | With VSync, if a frame rate drops below 60FPS it will
    then switch to 30FPS – but if this happens often it can cause stuttering. NVIDIA''s
    Adaptive VSync stops this by switching VSync off if the frame rate drops below
    60FPS. |

    | View distance | Controls the distance that is rendered. | This might be obvious,
    but by controlling the distance at which the game world is rendered you can better
    control your PC''s performance. The game world is not completely rendered, and
    is instead only rendered when it comes into view – this option controls the distance
    that occurs at. |

    | Field of view | Controls the ''wideness'' of your character''s view. | Popular
    in first-person games, field of view lets you alter the angle at which the camera
    – or your character – is able to see. On wider monitors this can create a much
    more realistic viewpoint, and give you a greater vision while playing. Useful
    for multiplayer games. |

    | GSync/Freesync | With a compatible monitor this can alter the screen''s refresh
    rate to match the frame rate. | As relatively new technology (NVIDIA has GSync,
    AMD has Freesync) there aren''t all that many cases where this is possible, but
    if you have a compatible GPU and monitor, it will remove any screen tearing and
    input lag issues with VSync. |

    | Texture quality | Controls the resolution of in-game textures. | Though not
    always, you can sometimes control the quality of textures – naturally improving
    performance if opting for lower-quality textures. |

    | Bilinear/Trilinear Filtering | Affects the way 2D images – or textures – are
    displayed on a 3D model from different angles. | Filtering helps keep control
    of the way textures work on 3D models, and bilinear is the most basic method of
    this. Trilinear is better, but only in that it takes samples from nearby textures
    too. |

    | Anisotropic Filtering | Affects the way 2D images – or textures – are displayed
    on a 3D model from different angles. | This is a stronger form of filtering that
    takes into account many more factors. It requires more processing power, of course,
    but enables greater clarity at further ranges. Better for avoiding blurriness
    of textures at longer distances. |

    | Anti-aliasing (MSAA – Multisampling) | Smooths hard edges of pixels for a more
    natural appearance. | MSAA – or multisampling anti-aliasing – is the basic form
    of AA for videogames, offering decent results with good efficiency. For any anti-aliasing,
    the higher number before this means more accuracy at a higher cost on your CPU
    and GPU. |

    | Anti-aliasing (CSAA – Coverage sampling) | Smooths hard edges of pixels for
    a more natural appearance. | This is NVIDIA''s version of MSAA, and provides the
    same results with greater efficiency. For any anti-aliasing, the higher number
    before this means more accuracy at a higher cost on your CPU and GPU. |

    | Anti-aliasing (CFAA – Custom filter) | Smooths hard edges of pixels for a more
    natural appearance. | This is AMD''s version of MSAA, a more efficient version
    of the aliasing with similar results. For any anti-aliasing, the higher number
    before this means more accuracy at a higher cost on your CPU and GPU. |

    | Anti-aliasing (FXAA – Fast approximate) | Smooths hard edges of pixels for a
    more natural appearance. | As the name suggests, this anti-aliasing is a quick-action
    version. Rather than analyse different models, FXAA instead applies a post-processing
    filter to smooth the entire scene. For any anti-aliasing, the higher number before
    this means more accuracy at a higher cost on your CPU and GPU. |'
