- pgno: 73
  md: 'Congratulations! If you''ve followed our guide then at this point you should
    have your very own gaming PC put together and ready to go. Well done you. Before
    you start celebrating too much, however, it''s fair to say that much of the work
    is yet to come. Hopefully you''ve enjoyed the experience of putting the hardware
    together, but now the time has come to check the machine works and, if it does,
    start tinkering with the software side of things. And truth be told, as necessary
    as it is, that part isn''t nearly as fun.


    The initial start-up of your first ever gaming PC can be quite intimidating; it''s
    the reward for your patience and effort, and if it doesn''t boot up it''s hard
    not to feel like something of a failure. But it does happen to the best of us,
    with common problems such as putting power connections in the wrong place stifling
    many a would-be powerhouse PC. Fear not, crack open that panel and have a tinker
    – ensure that the power is taken out, of course – and look for any connections
    that aren''t in the right spot. If needs be, remove the PSU connections and repeat
    that process for each of the PC''s parts in turn, using your motherboard''s manual
    as a reference guide. Each motherboard and case is different, so it could be a
    simple problem you''ve overlooked. But since troubleshooting can be such a large
    undertaking – especially if it''s something greater than a misplaced power connection
    – we''ll focus on that in a separate section later on in the book. Instead this
    chapter will assume all is hunky dory with your PC build, and will talk you through
    some of the key facets of your gaming PC post-build. It''ll focus on things like
    installing an operating


    system, booting up your PC for the first time and some of the first actions you''ll
    want to take. It''s your PC, ultimately, so you should feel free to tailor the
    software to match your interests or personal desires – but we''ll guide you through
    some of the more important gaming software. The irony is, of course, to install
    an operating system you''ll first need access to another computer. If you can''t
    visit a friend or go to the library then there are ways around this, but we''ll
    talk about all that in this chapter. After everything is installed there''s a
    temptation to jump straight into playing games – and there''s certainly nothing
    stopping you doing that – but with just a little bit of extra work you can be
    completely set up without any concerns that might rear their head because you
    were overeager in rushing to play games. There are various settings you can tailor
    to make your gaming PC a truly carefree kit, so we''ll detail some of these, too.
    Simply put, everything that comes after the hardware installation will be discussed
    here and so, with only a little bit of extra work, you''ll be ready and raring
    to go before long.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# PART 4 Picking an operating system


    We have to admit, these days it can often feel like there aren’t many options
    when it comes to operating systems. So prevalent is Microsoft’s Windows OS that
    it’s rare many will even consider other alternatives – but they are there, with
    some that you might not have considered beforehand.


    Since the majority of games run on 64-bit architecture (don’t worry about that
    too much), you’ll need to opt for Windows 10 if you want to go the Microsoft route.


    Currently there are only really three major operating systems: Windows, OS X (exclusively
    for Apple Mac products) and the open-source Linux. Since you’ll be running a PC
    you won’t be able to consider OS X, reducing your core options down to only two.
    Windows is the simplest option of them all, not because it’s the best option or
    even the most stable but simply because it’s so commonplace. Microsoft’s operating
    system is stable, relatively hassle-free and will have the widest possible compatibility


    with games and software. But it will cost you more money, and a licence for the
    latest copy of Windows can add a good chunk on top of your overall budget. Windows
    10 is the most recent version, allows for the true hardware potential of your
    system to be available to the OS and is the only way to allow for the latest version
    of Microsoft’s API that allows for the very best of 3D graphics technology, DirectX
    12, to work smoothly on Windows. Linux is open source, meaning it is free


    ![](img/f51994701f272059dc108a0376ffceb8_74_0.png)'
  merge: -1
  img_proc: true
- pgno: 75
  md: '![](img/f51994701f272059dc108a0376ffceb8_75_0.png)


    Mint is perhaps the Linux distro that is closest to Windows in terms of functionality
    and design, and offers a nice, sleek interface.


    to download and install – a great option if you’re looking to save some pennies.
    But it is worth noting that Linux does come with some issues: for one thing it
    won’t be totally familiar to anyone who has used a PC in the last decade – this
    isn’t Windows and you will need to learn a few things. It also has a number of
    compatibility issues and while it isn’t quite as major an issue as it used to
    be, there could be concern that something – whether it’s specific software you
    want to use or hardware and their


    drivers – won’t work. It’s also worth noting that there are a wide range of Linux
    distributions or distros – a term used to describe the different ‘flavours’ of
    operating system. For each of these Linux remains the foundation, but the creator
    (or creators) have provided their own preference or spin on things. This can confuse
    matters for those looking for a new operating system, but sticking with the more
    popular distros – such as Ubuntu or Linux Mint – will minimise any of that hassle.'
  merge: -1
