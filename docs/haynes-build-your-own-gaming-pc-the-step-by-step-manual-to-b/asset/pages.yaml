  md: '![](img/f51994701f272059dc108a0376ffceb8_137_0.png)


    The four timing figures you need to change for overclocking your RAM are CAS Latency,
    tRCD, tRP and tRAS. That''s the order they will appear in, too.


    instead we''ll explain how to proceed to lower the timings. In the BIOS you want
    to look for the DRAM timing configuration, looking for the four different timings
    referenced in the point above. As always this should be a staged process as you
    discover the lowest delay you can apply to these settings, changing one setting
    at a time, saving and then testing your change once back in Windows. You can use
    the base timings as a guide for what kind of ratio each timing can be lowered
    to – so in our example the CL of 13 would end up at a lower number than the tRCD
    and tRP. The Cycle Time (or tRAS) will always be higher than the rest. There''s
    a lot more manipulation involved with memory overclocking than the likes of CPU
    or GPU overclocking, so be prepared for a lot of system restarts. If your PC fails
    to boot then the last setting you changed was too low.


    # Command Rate (CR)


    You''ll basically get two numbers for this, either 1T or 2T. 1T is always faster
    than 2T, but the increase in performance is marginal at best, so you may not feel
    the need to change it since running it at 2T is more stable. If you are looking
    to maximise every aspect of your PC, however, and providing your memory is capable
    of running 1T, then this can be a quick and easy change to make. You''ll find
    the option in your BIOS with the rest of the memory options.


    # Voltage


    As with all hardware, increasing the voltage will allow you to increase the frequency,
    or speed, at which it runs. And, as with all hardware, it''s important to remember
    that increasing the voltage will also increase the risk of damage to the component.
    The risk is greater for RAM, however, since there is no innate fail-safe to protect
    the component from damage,'
