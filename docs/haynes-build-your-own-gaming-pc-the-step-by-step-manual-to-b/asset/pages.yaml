    Overclocking is a bit of a scary-sounding phrase. To those who don’t know the
    rules of engagement it just sounds dangerous. Those who do know of overclocking,
    but have never done it, are likely put off by the stories and they’ve heard the
    seriousness with which the phrase is often used. Overclocking is seen as the reserve
    of elite PC enthusiasts, but in truth it’s not too difficult to do – and when
    done properly it’s not nearly as risky as you might imagine.'
