- pgno: 66
  md: '# 2

    Attach the GPU


    It should be fairly obvious which way around the GPU should go, but just to be
    sure: make sure that the output connections are facing out of the back of the
    case, since you''ll need access to this. Line up the GPU so that it is in the
    corresponding space, being sure to check that the PCIe connection – the row of
    pins that run along closest to the motherboard – will correctly and safely lock
    into place as you push on the GPU. As with the memory, a little locking mechanism
    should ''click'' into place.


    ![](img/f51994701f272059dc108a0376ffceb8_66_0.png)


    # 3

    Secure the GPU


    Take those screws that were holding the PCIe covers in place and reattach them
    to their original place, this time securing the graphics card into place. This
    is important because while the PCIe bay can hold onto the connector, the weight
    of a hefty GPU will put strain on the hardware and eventually lead to damage.
    Even motherboards that come with metal-bound PCIe slots to protect against this
    aren''t really doing much to actually avoid this issue from happening.


    ![](img/f51994701f272059dc108a0376ffceb8_66_1.png)'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# PART 3 Installing the power supply


    # 1 Fix backing plate


    Spin the case around to its rear edge. In some cases you’ll have an empty space
    ready for your power supply, in others you’ll have a backing plate that is designed
    to connect to the power supply itself before sliding back into the case. If that’s
    the case, remove the backing plate, unbox your PSU and connect the plate using
    the four screws. Otherwise, just slot the PSU into place.


    ![](img/f51994701f272059dc108a0376ffceb8_67_0.png)


    # 2 Secure the PSU into place


    If you don’t have one of these backing plates, then you’ll most certainly need
    to secure the PSU into its place with the screws provided. Since power supply
    manufacturers handle this in a range of ways, there are a number of potential
    holes to use to do this. Find the ones that work for your case and PSU combination,
    and tightly secure it into place.


    ![](img/f51994701f272059dc108a0376ffceb8_67_1.png)'
  merge: -1
  img_proc: true
- pgno: 68
  md: <!-- no content -->
  merge: -1
