  md: '# PART 3 Installing the CPU


    # 1

    Prepare the case


    The worst first move would be to screw your motherboard into the case without
    first installing the most important – not to mention delicate – components of
    the entire system. Start by taking the panels off the case of the PC, typically
    through two thumbscrews at the back of the case on either side. Then remove the
    motherboard from its packaging and rest it on a sturdy, well-lit table.


    ![](img/f51994701f272059dc108a0376ffceb8_54_0.png)


    # 2

    Unlock the CPU socket


    There are either one or two levers on either side of the CPU socket; push down
    and away from the socket on these one by one to release them. Pull them up and
    clear of the socket. This will release the load plate, which in turn can be lifted
    to free the CPU socket''s protective cover. Note the four alignment keys on the
    naked socket in all four corners and the triangular mark in one of the corners.


    ![](img/f51994701f272059dc108a0376ffceb8_54_1.png)'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# Install the processor


    The alignment keys and the triangular mark are mirrored on the processor. Orientate
    the processor so the triangular mark is in the same place and – without touching
    the metal contacts on either the processor or the motherboard – gently place the
    processor into the socket. It will fit very snugly, but if it doesn’t appear to
    be sat correctly, lift it to reposition it (don’t be tempted to simply wiggle
    it around where it lies).


    ![](img/f51994701f272059dc108a0376ffceb8_55_0.png)


    # Secure the socket


    Once you’re happy the processor is sat squarely on the socket, carefully lower
    the load plate, which is designed to ensure no one side or corner of the processor
    takes too much pressure when the cooler is installed later on. Next lower and
    secure the levers on both sides of the processor. It takes a reasonable amount
    of force so don’t be too shy.


    ![](img/f51994701f272059dc108a0376ffceb8_55_1.png)'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# PART 3 Installing a CPU cooler


    # 1

    Prepare the mounting plate


    Air coolers can come in countless shapes and sizes, but larger ones will always
    come with a mounting plate that is attached to the back of the motherboard. This
    balances the weight of the heavy cooler, which will be held horizontally in the
    machine. Start this by placing the holders into each of the holes at the corners
    of the CPU. You might need to do this and the next step four separate times.


    ![](img/f51994701f272059dc108a0376ffceb8_56_0.png)


    # 2

    Attach the mounting plate


    Position the plate into position on the back of the motherboard, using the notches
    in the corner to align the correct position. These plates are designed to fit
    multiple motherboards, but will only have a position where each of the holes align
    properly. Attach the nut to each of the holders, securing the mounting plate onto
    the back.


    ![](img/f51994701f272059dc108a0376ffceb8_56_1.png)'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# 3

    Tightening the nuts


    You’ll have to make sure that this mounting plate is very securely attached, since
    these cooling fans are pretty heavy. The methods can differ from model to model,
    but in most cases you’ll be provided with a cap that can be used to screw the
    nuts more tightly. You’ll then need to flip over the motherboard and line up the
    cross-shaped grip with the corresponding positions of the holders.


    ![](img/f51994701f272059dc108a0376ffceb8_57_0.png)


    # 4

    Attach the grip


    Don’t secure the grip in place just yet since there’s a crucial step that is needed
    beforehand. Try positioning the two in place with a dry run, then once you’ve
    found the right spot where everything aligns properly, attach the central screw
    of the grip onto the central point of the cooler’s base. This will be the part
    that holds the cooler tightly onto the fan.


    ![](img/f51994701f272059dc108a0376ffceb8_57_1.png)'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# 5


    # Apply the thermal paste


    Before attaching the cooler comes the scary part: the thermal paste. Wipe clean
    the top of the attached CPU; usually you''ll be provided with a wipe with your
    cooler, but if not then use isopropyl alcohol and a clean wipe to remove any dust
    and dirt from the top of the CPU. Then apply a very small amount of thermal paste
    to only the centre of the CPU; the idea is that the cooler will spread the paste
    for you. This is a step you may need to do again if you replace the fan, CPU or
    find the processor is overheating inexplicably.


    ![](img/f51994701f272059dc108a0376ffceb8_58_0.png)


    # 6


    # Secure the cooler


    Gently sit the cooler onto the CPU socket, lining up the screw holes on the mount
    with the screw holes on the cooler itself. Now securely fasten the cooler to the
    mount with a cross-headed screwdriver. Next fit the CPU fan connector to the top
    left of the CPU socket and then gently clip the fan mount to the flat side of
    the cooler, minding the blades as you go (they''re both sharp and delicate).


    ![](img/f51994701f272059dc108a0376ffceb8_58_1.png)'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# PART 3 Installing memory and M.2 storage


    # 1

    Locate the memory bays


    Though the long black and grey memory bays are often located to the immediate
    right of the CPU, in many cases there can be parallel bays on either side of the
    processor or they could even more rarely be located above or below. Either way,
    find them and push down the plastic nodes that stick up on either side of the
    bays.


    ![](img/f51994701f272059dc108a0376ffceb8_59_0.png)


    # 2

    Slot in each memory module


    Installing RAM is a very simple process: just line up the little notch in the
    middle of the RAM with the corresponding bump in the memory bay, then push down
    firmly on either side until you hear a satisfying ''click''. If you''re not filling
    all of your motherboard''s memory bays just yet, then the only tricky part comes
    down to knowing which bays you should use. For that, refer to your motherboard
    manual.


    ![](img/f51994701f272059dc108a0376ffceb8_59_1.png)'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# Locate the M.2 space


    Depending on your motherboard, you may have one or more M.2 storage and – if so
    – you may have decided to utilise this for the speedy SSD read times that comes
    from the storage type. These slots can be tricky to find because the actual connection
    itself is quite small (the drive lies flat, parallel to the motherboard). A screw
    will likely be installed in one of the nodes, which each have numbers corresponding
    to the different sizes of M.2 drive compatible with this particular slot and the
    motherboard in general.


    ![](img/f51994701f272059dc108a0376ffceb8_60_0.png)


    # Install the M.2 drive


    Unscrew the screw from the node and put it to one side. Push the M.2 drive into
    the connection at roughly a 30-degree angle. As with the RAM, there’s only one
    way that the drive will go in, so if it isn’t cooperating, don’t force it in but
    instead flip it around and try again. Once connected, push the drive down (it
    will want to spring up again by itself) and then replace the screw at the left-hand
    end of the drive into the node to hold it in place.


    ![](img/f51994701f272059dc108a0376ffceb8_60_1.png)'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# PART 3 Fitting the motherboard


    1

    Attach the I/O shield

    The first step of getting your motherboard in place is the easiest: simply take
    out the I/O shield that will protect all the connections at the back of your computer
    and slot it into place. There are little bumps on these shields that will grip
    onto the case, so it''s just a case of aligning it and slotting it into place.
    There may already be something in place with your case, which you may or may not
    need to use.


    ![](img/f51994701f272059dc108a0376ffceb8_61_0.png)


    2

    Install the metal studs

    Many modern cases have a small stud towards the centre of where the motherboard
    sits that allows you to hang it in place with the case stood upright. This is
    convenient, but not necessarily the case in all cases. If not, locate the small
    holes found on the back of the case and screw in each of the metal studs provided
    with the case.


    ![](img/f51994701f272059dc108a0376ffceb8_61_1.png)'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# Secure the motherboard


    These studs are what the motherboard will sit on, separating them from the metallic
    back of the case and preventing electrical shorting. You may not need all of these
    screws, since it depends on both your case and your motherboard. Either way, position
    the motherboard over the studs by finding the corresponding holes. Tightly fasten
    the motherboard onto these studs, which can be a challenge in corners.


    ![](img/f51994701f272059dc108a0376ffceb8_62_0.png)


    # Installing horizontally


    Securing the motherboard is one of the harder tasks just because it needs to be
    tightly secured (naturally it’ll be holding all those expensive parts in place).
    If you’re struggling to get those corner screws in properly because there isn’t
    much space at the top of the case with the huge CPU cooler installed, then consider
    carefully lifting the PC up. So long as the majority of the screws are in place,
    you should find it easier.


    ![](img/f51994701f272059dc108a0376ffceb8_62_1.png)


    # Optional fans


    If you’ve decided to go for some additional case fans to remove the hot air inside
    the machine, then now is probably the best time to install them. Some cases will
    come with covers for when the fan slots aren’t in use, but for the most part these
    things are fairly modular: just pick the place you want the fan, find the holes
    for the screws and attach it to the case.


    ![](img/f51994701f272059dc108a0376ffceb8_62_2.png)'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# PART 3 Installing both hard drives


    # 1 Locate the storage bays


    Perhaps the most flexible part of the design of a PC case is the storage bays.
    Not only can these be many in number, but they can appear in all sorts of weird
    and wonderful places. Often that can even be detached and installed elsewhere
    in the case, for true custom builders. In our case, the Define S, there are no
    traditional drive bays but rather cases that can be detached from the back panel
    to secure the storage drives you want. In any case, you''ll want to first find
    out where and how your case is utilising storage bays, and decide how you want
    to install your solid-state hard drives.


    ![](img/f51994701f272059dc108a0376ffceb8_63_0.png)'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Install the storage drive


    Regardless of the type of storage you want to install or the way your case would
    prefer you did it, all modern cases will have a fairly simple, singular screw
    or thumbscrew to first provide access to the drive bay and, later, to secure the
    drive into the slot. Remove the screw to loosen access, then slot the drive into
    place. With our build, we had to attach the drive onto the detached bay, but it’s
    fairly unique in this manner. If there’s any confusion, your case manual will
    have all the details on this.


    ![](img/f51994701f272059dc108a0376ffceb8_64_0.png)


    # Powering the motherboard


    In the majority of cases you’ll be connecting your storage drive via SATA. It’s
    a good idea to do this now, so find the part of the motherboard that says ‘SATA’,
    likely in a grid of connections. The number of these and where they are differ
    from motherboard to motherboard, but in most cases you’ll find it along the right-hand
    edge of the motherboard. The connections here are fairly easy to make and fool-proof
    in their design, so connect up each of your drives individually and that should
    be all you need to do.


    ![](img/f51994701f272059dc108a0376ffceb8_64_1.png)'
  merge: -1
  img_proc: true
