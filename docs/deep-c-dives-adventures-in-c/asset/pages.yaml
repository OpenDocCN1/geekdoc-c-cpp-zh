- pgno: 29
  md: 'For example, if we only have three bits and assign half of the range to negative
    numbers we have:


    | bits | unsigned | two’s complement |

    | :--- | :--- | :--- |

    | 000 | 0 | 0 |

    | 001 | 1 | 1 |

    | 010 | 2 | 2 |

    | 011 | 3 | 3 |

    | 100 | 4 | -4 |

    | 101 | 5 | -3 |

    | 110 | 6 | -2 |

    | 111 | 7 | -1 |


    Notice that there is no difference in how the bits are manipulated – it is purely
    a matter of how you interpret the bits. If you needed an example of how C programming
    is all about how you interpret the bits, there is none better! Also notice that
    the most significant bit can be used as a sign indicator – a zero indicates a
    positive number and a one a negative number.


    For example, add **011** to **100** and the answer is **111** and you don’t need
    to know if it is unsigned or two’s complement. If the numbers are regarded as
    signed we have 3 + 4 = 7. If the numbers are regarded as two’s complement then
    we have 3 + (-4) = -1. It makes sense and is correct and only the interpretation
    changes.


    Why is this representation of negative numbers called “two’s-complement”?


    In this system the definition of a negative of x is that x+(-x) = 0, but this
    only works because of rollover. In the case of the 3-bit example you can see that
    another representation of zero is **1000**, i.e. the rollover. So you can write
    x+(-x) = **1000**, or eight in decimal, which means that -x is 8-x, which if you
    check the table you will discover is correct. For example, -4 is represented by
    8-4 = 4. In general, if you have an n-bit representation the two’s-complement
    representation of -x is $2^{n}$-x and hence the name two’s-complement.


    There is a relationship between two’s-complement and the logical not, see dive
    5, or the one’s-complement. In words:


    ```

    two''s-complement = one''s-complement + 1

    ```


    or in terms of C operators:


    ```

    -x = $2^{n}$-x = -x+1

    ```


    as long as all operations are carried out using n-bits with rollover. This is
    useful as it can be used to compute the two’s-complement of any value.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'The reason that this works is because the largest value that can be represented
    by n bits is 2^n-1 so you cannot work out 2^n-x directly as 2^n is too large.
    So you have to perform the subtraction in two steps:


    ```

    2n - x = (2n - 1 - x) + 1

    ```


    but 2^n-1 is just n ones and you can subtract x from this by simply inverting
    x i.e. it changes all the zeros to ones and vice versa. This is a simple NOT of
    the value and so we have:


    ```

    2n - x = (2n - 1 - x) + 1 = -~x + 1

    ```


    It is clear that rollover of unsigned binary values is essential to making two''s-complement
    arithmetic work, but we now have some new behavior. A two''s-complement result
    can fall outside of the range that can be represented in the number of bits in
    use. This is usually called "signed overflow".


    For example a two''s-complement 3-bit value can represent values from 3 to -4
    and this is its valid range. Now consider 3 + 1, what value should this be mapped
    to in a 3-bit representation? You cannot represent 4 in a 3-bit two''s-complement
    and the bit pattern that you get corresponds to -4 which gives 3 + 1 = -4 which
    is strange to say the least, with two positive values adding to give a negative
    value.


    Back in the early days of C there was no standard for how negative numbers should
    be represented, but with C99 two''s-complement was adopted as the standard. This
    makes it very clear how two''s-complement overflow behaves and 3 + 1 is -4 even
    if this doesn''t make much sense. The problem is that C99 and C11 define such
    overflow to be "undefined behavior", which is a crazy decision - as it is clearly
    well-defined even if it is slightly strange. In the days when two''s-complement
    wasn''t standard this might have been reasonable, now it is just an unnecessary
    danger, see Dive 16 Undefined Behavior.


    Things are a little more complicated than this account suggests because of the
    use of automatic promotion in expressions which can increase the number of bits
    in use without the programmer being aware of it. This can cause results that you
    might not expect as rollover doesn''t happen where it should. More about this
    in Dive 4 Expressions. For now what matters is that the nature of the bit sequence
    and the arbitrary nature of its interpretation is clear.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# # These aren’t the types you’re looking for


    > > “These aren''t the droids you''re looking for.”

    > Ben Obi-Wan Kenobi


    Types, love them or hate them you cannot ignore them. Strongly typed languages
    currently rule the earth and anyone who suggests that strong static typing isn''t
    a good idea is swiftly stamped on. C is a strongly typed static language, but
    this does not necessarily mean what you think it does. C types aren''t the types
    you might want or expect. This said, the concept of type in C fits in perfectly
    with its low level intent.


    # ## The Origin of Type


    The concept of types in programming is both deep and shallow.


    It is shallow when you first meet it and gets increasingly elaborate as one abstraction
    is added on top of another. At its most advanced, types provide a theory of programming
    in the form of the Curry Howard correspondence which views programs and mathematical
    proofs as being one and the same. This leads us into areas of pure mathematics
    that are generally labeled as category theory and logic.


    The good news is that type in C is much more at the shallow end of the range but
    over time there have been efforts to make it deeper and hence more respectable
    and more like every other programming language. There is an argument that C needs
    a simple interpretation of type to be effective as a language that works at a
    lower level than most. Rather than abstracting type away from the way that the
    machine represents data, it is better to keep the association between data type
    and representation.


    The fundamental, but not the only, idea of type in C is simply how many bits are
    in use and how those bits are to be interpreted.


    This is a fairly rare interpretation of type these days and is another thing that
    makes C different.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# ## C Types


    There are only four fundamental types in C – integer types, floating-point types,
    pointers and structs. The first two types are all about how you interpret the
    bits – they are the scalar types. The third is about how you reference other types
    and the fourth is how you organize other types.

    You might want to add arrays to this list, but an array is such a simplistic organization
    of other types that it almost doesn’t count – it is basically a use of the pointer
    type, more of which later.


    # ## Word Size


    At the raw machine level there are bits – nothing but bits. These bits are generally
    organized into chunks called nibbles, bytes, words, double words and quad words.
    The nibble and the byte are generally 4 and 8 bits respectively. The size of a
    word varies according to the machine, but essentially a word is the default size
    of a group of bits that the machine works with, usually 16, 32 or 64 bits, but
    these aren’t the only possibilities. Machines in the past used word sizes of 18,
    36 and 48 bits – which are rare choices today, but serve to remind that word size
    is fairly arbitrary.


    Notice that word size is dependent on hardware. The electronics, the memory, the
    registers and the buses that connect them determine the word size. Machines generally
    aren’t restricted to working with a single word size, but there is usually one
    that fits their architecture better than any other and this is usually the fastest
    and most efficient.


    These groups of bytes are important because they are the units that the machine
    uses to process data. You can usually write instructions that work with bytes,
    words or double words and so on. For example, you could add two bytes together
    or you could add two words together and so on. At the machine level there would
    be distinct add instructions to add two bytes and two words and so on and you
    would have to work out which to use in any given situation.


    When writing in C the compiler does the job for you and it selects the instruction
    according to the type of the variables you are using. For example:


    ```

    ```text

    char a = 1, b = 2;

    char c = a + b;

    printf ("%d\n", c);

    ```

    ```


    In most systems char is an 8-bit data type and so the compiler creates the machine
    instructions to add two 8-bit bytes. If you had written:


    ```

    ```text

    int a = 1, b = 2;

    int c = a + b;

    printf ("%d\n", c);

    ```

    ```


    then the compiler would have selected the instructions needed to add two 32-bit
    words – assuming that int is a 32-bit type for the machine in question.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'That is, the fundamental reason for types in C is to determine the type of
    operation appropriate for the data.


    Type determines how operators act and this is always true, no matter how much
    we elaborate the idea of type.


    You could also add that, in C, type also determines how many bits are involved
    in the operation but this is more obvious – well it is to a C programmer...


    # Data Representation


    Data representation is a key emphasis of C as opposed to other languages which
    try to hide how they represent data. The trend in ever higher-level languages
    is to abstract away from the underlying bits and encourage the user to think in
    terms of objects that they can use without knowing how they work.


    We have seen that in C it is the bit sequence and what it represents that is important.
    In other languages bits, representations and their limitations are hidden. For
    example, JavaScript just implements a number object and handles the distinction
    between integers and floats under the covers. Python has integers with unlimited
    precision so you never need ask what is the range of a Python integer. C on the
    other hand insists that you know how the data is represented. It has different
    sizes of integers and even has unsigned integers and you are expected to know
    how these work and how they relate to one another. More accurately, if you don’t
    understand the data representation in use you will find it harder to write correct
    code.


    It is important to remember that, while the machine and C may offer a range of
    operations, which operations make sense is entirely dependent on what the bits
    are currently taken to represent.


    This leads on to the interesting question of why a byte in C is called “char”
    and not “byte”? The reason is that back in the early days a char was intended
    to hold enough bits to represent all of the text characters the machine needed
    to work with. As most machines worked with ASCII, a seven-bit code, most often
    char was defined as being eight-bit to allow for some additional characters. Notice
    that right from this starting point it is clear that C wants you to have an interpretation
    for the bits it stores. You can add two chars together, but in this case you are
    supposed to think of them as eight-bit integers. You can also set all of the bits
    to one and then you are better thinking of them as light states.


    In all cases we take a bunch of bits and combine them with another bunch of bits
    using an operator and the question is does the resulting bunch of bits make any
    sense.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# The Usual Types


    At this point you might hope that C defines types that are a fixed number of bits
    – not so. The problem back in the day was that different machines used different
    architectures and so you couldn''t be sure that there was support for an eight-bit
    byte. As a result the char type was defined to be the smallest bunch of bits a
    machine could work with, which today is usually eight bits.


    The next size up is “short”. You might think that this would be 16-bits and it
    usually is, but it might just be bigger. Then the only thing you can say about
    short is that it should be able to hold at least 16-bits.


    After short comes “int”, which is the type we tend to use by default. It is defined
    to be at least 16-bits, but it might be bigger.


    After int C becomes a little repetitive. We have “long” which is at least 32-bits
    and “long long” which is at least 64-bits.


    In terms of number of bits we have:


    ```

    char <= short <= int <= long <= long long

    ```


    and in the far distant future we might have “long long long” and so on, but for
    the moment the set stops at long long.


    Nowadays, a typical system has:


    +   - char=8 bits

    - short=16 bits

    - int=32 bits

    - long = 32 bits

    - long long = 64 bits


    In addition to these types you can also add “signed” or “unsigned” to the type
    to indicate if you want to store negative numbers or not. Originally C did not
    define how signed types were to be represented, but modern C insists on two''s-complement
    form – see Dive 1.


    If you choose signed then roughly half of the integer''s range is negative and
    half positive. If you choose unsigned then the entire range is positive. For example,
    signed int,or just int which has “signed” as its default, has a range of -32,767
    to +32,767 and unsigned int has a range of 0 to 65,535. You can see that if you
    were using a variable to count things, using unsigned int would let you count
    a lot more things than signed int. This is another example of it all being a question
    of how you interpret the bits.'
  merge: -1
  img_proc: true
- pgno: 35
  md: "# Floats\n\nAs well as the integers, there are also generally three types of\
    \ floating-point types. Of course a floating-point type is capable of storing\
    \ a fractional value as well as whole numbers. Again this is another example of\
    \ interpreting the bits. A float is a single precision floating-point number and\
    \ on most systems it is 32-bits. Notice that a `float` and an `int` are both just\
    \ 32-bit values. The difference is that for an `int` the bits are interpreted\
    \ as a simple binary number and for a float the bits are divided into two groups\
    \ – one giving the exponent and the other the fractional part. As well as `float`\
    \ there is also `double` which is almost always a 64-bit value. On some systems\
    \ there is also `long double` which can be anything from 80 bits to 128 bits but\
    \ this isn’t a common type.\n\nThere isn’t much to say about floating-point types\
    \ in C because they work just like floating-point types in any language – mainly\
    \ because nearly all of them use the IEEE 754 standard. This means that using\
    \ floating-point types in C has all of the problems of using them in any language\
    \ – loss of precision and not doing arithmetic the same way humans do.\n\nFor\
    \ example:\n\n```\n```c\nif(0.2+0.1==0.3){\n\tprintf(\"correct\\n\");\n}else{\n\
    \tprintf(\"incorrect!\\n\");\n}\n```\n```\n\ndisplays incorrect meaning that 0.2\
    \ plus 0.1 isn’t 0.3. This is a consequence of 0.3 not being exactly representable\
    \ in binary.\n\nFloating point is about numbers and not so much bit patterns –\
    \ if you are using nothing but floating-point in C then you might be using the\
    \ wrong language!\n\n# The Usual Literals\n\nA common requirement is to store\
    \ a given bit pattern in a variable of the appropriate type. This is achieved\
    \ using a numeric literal or constant. The compiler reads the constant and converts\
    \ it to a bit pattern, which is then stored in the variable. Many C programmers\
    \ don’t bother specifying the type of a constant, but it is often a good idea\
    \ and sometimes it is essential.\n\nThere is a set of suffixes that can be used\
    \ to indicate the constant’s type:\n\n+   - l or L for long\n- ll or LL for long\
    \ long\n- u or U for unsigned.\n\nThere is also the f suffix for floating-point.\n\
    \nIf there is no suffix the constant is taken to be an `int`."
