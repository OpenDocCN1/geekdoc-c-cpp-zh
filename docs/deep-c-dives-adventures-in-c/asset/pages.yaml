    the string has to accept the fact that a character is three bytes. You can see
    that you would need to modify the strlen and other character-oriented functions
    to take account of the UTF-8 representation. This isn’t difficult. Unfortunately,
    Unicode isn’t quite this simple. The simple-minded approach is to assume that
    each Unicode codepoint is a character – this isn’t the case. Multiple codepoints
    can be put together to make a single character and the same character can correspond
    to multiple codepoints. Unicode has made text processing very much more difficult
    because you can no longer assume a simple one-to-one correspondence between a
    bit pattern and a character. In fact, Unicode has made things so complex that
    it is difficult to write a program that handles all of the possibilities correctly.


    # ## Final Thoughts


    Other languages work towards complete data abstraction away from the hardware
    and the underlying bits that represent everything. C is one of the few languages
    that still maintains the connection between data and the bits that represent it.
    If you are working at that level and want maximum efficiency this is great. If
    not then data abstraction has its advantages. What is clear is that introducing
    more data abstraction into C is a bad idea. We are C programmers - we work with
    bits.


