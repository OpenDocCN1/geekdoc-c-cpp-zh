- pgno: 11
  md: '# The Prolog

    C


    > “C is quirky, flawed, and an enormous success.”

    Dennis Ritchie


    There are lots of languages you could use, but C occupies a special place in the
    ecosystem of languages. Most attempt to “grow up” and occupy the higher plane
    of computer languages that abstract away from the hardware and move you toward
    the concepts of the problem you are trying to solve. C, on the other hand, stays
    with the hardware and lets you use it as you see fit to solve the problem. Of
    all of the available popular languages, only C provides this low-level support.
    This said, most of the higher-level languages, C#, C++ and Java in particular,
    borrow heavily from C in their basic syntax and this makes C seem familiar to
    an existing programmer. However, it isn’t just one of these high-level languages
    written differently and it isn’t a failed high-level language that one day will
    add the extra abstractions needed to allow it to emerge as something more modern.
    C is already what it needs to be to fulfill its role as a modern, machine-independent
    assembly language.


    # Machine-Independent Assembler?


    So C is not Java, is not C#, is not Go, and so on. While it is a crowded market
    among the high-level languages, if you want to work with the hardware free from
    constraints there really is only C. It is far from perfect, but it is realistically
    your only choice if you are looking for a language that works down at the level
    of assembler.


    Not everyone thinks that this is so.


    Even the statement that C is a machine-independent assembly language is much disputed
    and there are senses in which today this is less true than it was. This may be
    so, but there are more reasons that make it true than not. The argument against
    is that C no longer captures the way a modern machine works. This is true, but
    the loss of accuracy is minor compared to the abstractions applied to create other
    languages. C is still close enough to the machine for you to hear it creak.'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'The computers of a few years ago were simple compared to what today''s hardware
    does. The basic computer of a few years ago would read instructions and obey them
    one after another until the program was complete – a single processor, in-order,
    execution.


    Today''s computers, on the other hand, use complex processing methods to try to
    speed things up. Pipelines process multiple instructions at the same time, caches
    keep the active part of the program close to the process and avoid having to go
    to slow main memory to read instructions and finally, yes, your instructions may
    not be obeyed in the order that you wrote them. A modern computer is a multi-core/threaded,
    pipelined, cache interfaced, out-of-order processor.


    This is not your father''s computer – but it doesn''t matter.


    The reason it doesn''t matter is that all of these innovations are supposed to
    be invisible to the programmer. For example, cache memory speeds up reading and
    writing the main memory, but for most of the time you can forget it is present.
    Only when you start to consider optimization does how you access memory to avoid
    a cache miss come into the picture – and we all know the saying about optimization:


    > "*We should forget about small efficiencies, say about 97% of the time: premature
    optimization is the root of all evil.*" Donald Knuth


    In the same way instruction reordering only becomes visible to a C programmer
    when the order affects the hardware in ways that are different. For example, when
    writing to two memory locations generally the order of the writes doesn''t matter,
    but if the memory locations correspond to hardware registers that control some
    device then the order can be important. Again, most of the time you can ignore
    reordering. When it comes to using multiple cores – yes, you do need to think
    about this more often, but we still tend to reason in terms of a single thread
    of execution. We control how these interact using locks or some other methods
    which are also part of programming with C but not part of the C language.


    What all this means is that while it is true that the execution model that C implies
    is not accurate for a modern computer it is good enough for most things. As a
    result C can be treated as a machine-independent assembler for a machine that
    actually uses other techniques to run the program faster. C is machine-independent
    only in its core features. To cope with the specifics of a particular machine
    it generally needs either additional libraries or compiler extensions. This is
    more or less how it should be and attempts to absorb these into the main language
    have mainly failed. For example, ISO threading was introduced in C11 as a language
    standard – however, the non-language standard pthreads library is still used more.'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'Similarly, C11 introduced memory models that take care of instruction order,
    but most processors still require you to use custom libraries to control such
    things.


    The core of C really uses a very simple, but appropriate, processor model.


    # The History


    The C language was created in the early 1970s by Dennis Ritchie at Bell Labs.
    The language was invented to allow himself and Ken Thompson to create the Unix
    operating system for a PDP 11 mini computer. You can see that right from its initial
    creation the purpose of C has been systems programming and interacting with the
    hardware.


    The C language didn’t appear out of nowhere – there were a number of languages
    in the same niche that predated it. One of the most successful was BCPL, Basic
    Combined Programming Language, invented at the University of Cambridge in 1967.
    The BCPL language was notable for two things – the first being the use of `{}
    to group blocks of code and the second, the way that the compiler itself was written
    in BCPL.


    BCPL was converted into the B programming language by Dennis Ritchie and Ken Thompson.
    This was a typeless language that basically used the native word size of the machine
    it was running on either as data or an address. This evolved into C mostly by
    the addition of a range of data types to cope with the way ASCII text was packed
    into multibyte words.


    ![](img/5f2ea21c2077d473344a0fdf144677b9_13_0.png)


    It wasn’t until 1978 that Kernighan and Ritchie published the first edition of
    *The C Programming Language*, a book which quickly became a classic and is usually
    just referred to as “K&R C”. The book’s simple presentation made the language
    seem even simpler and encouraged programmers to use it.


    The spread of C compilers also made C a language that was easy to get hold of
    and one that promised easy porting between machines. The PCC Portable C Compiler
    became the *de facto* standard and was only replaced by the GNU C compiler in
    1994. The compiler’s machine-dependent parts were concentrated into a small number
    of source files, making it possible to create a C compiler for a new machine very
    quickly.'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'C also spread, though not as fast as Basic, on the early microcomputers of
    the 1980s. This was mostly due to the publication of “A Small C Compiler for the
    8080s” in the then influential Dr. Dobb’s Journal. This provided a listing of
    an entire C compiler written in Small C – it was a self-compiler. As a result
    C became available on almost every machine and it was the language that was used
    to create systems programs that interfaced, or even modified, the operating system.
    All of the popular operating systems were, and still are, written in C – with
    the exception of Windows that mainly used C++.


    # ## Standards


    Even back at the start of the 1980s it became clear that C was an important language
    and needed standardizing. Until then the language as described in K&R served as
    the standard, but by 1982 it had grown apart from the language as actually used
    in the real world. Compilers had added features that weren’t in the original language
    – compiler “enhancements” are still a feature today and they tend to spoil the
    idea of a “standard” language.


    Both the American National Standards Institute, ANSI, and the International Organization
    for Standardization, ISO, were involved in defining the C programming language
    standard. In 1989 the ANSI C committee, formally called the ANSI X3J11 committee,
    produced the first standard and the same standard was ratified by the ISO in 1990.
    Thus we have ANSI C or C89 and ISO C or C90 which refer to the same language.


    The next important standard was C99, there is C95 in between, but this was mostly
    bug fixes to the previous one. Today we tend to think of C89/90 as “classic” C
    and C99 as modern C. Most programmers prefer C99 for two simple additions it introduced
    – the ability to use single line comments prefixed by // and the ability to declare
    variables in code especially in for loops. That is, before C99 you couldn’t write
    for(int i=0; as the int had to be defined outside of code.


    The next standard, C11, didn’t do much for the language. It introduced an inadequate
    attempt at Unicode support together with standard threading that so far hasn’t
    replaced pthreads and atomics. C17 was a bug fix that didn’t introduce anything
    new. At the time of writing, May 2024, C17 is the current standard, although it
    is soon to be replaced by C23.


    Currently most programmers prefer C99 as their standard as this is the best mix
    of classic features and modern extensions. The soon-to-be published C23 standard
    has some useful additions and looks to be the first refresh to have an impact
    on day-to-day C programming.'
