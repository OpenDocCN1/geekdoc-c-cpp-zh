- pgno: 38
  md: "The most common way to work with Unicode across different languages and applications\
    \ is to use UTF-8 which uses a variable number of bytes to represent a code point.\
    \ The good news is that ASCII code is identical to single byte UTF-8 for the usual\
    \ characters. The whole subject of how to work with Unicode in C is a difficult\
    \ one and for the moment it is simpler to focus on standard ASCII output.  \n\
    You may have a value stored in a variable:\n\n```\nint16_t a = 42;\n```\n\nThis\
    \ stores\n\n```\n0000 0000 0010 1010\n```\n\nin the variable – which is $32+8+2$,\
    \ a total of 42. To print this in a human readable form you have to convert this\
    \ bit pattern into a set of bytes or chars that represent the ASCII or UTF-8 characters\
    \ 4 and 2 which is $0\\times34$ and $0\\times32$ respectively. You can see that\
    \ to convert to ASCII digits all we have to do is to add $0\\times30$ to the binary\
    \ value of $0\\times04$ and $0\\times02$. If you tackle this as a programming\
    \ problem you would probably come up with something like:\n\n```\nint16_t a=42;\n\
    char first= a/10 | 0x30;\nchar second= a % 10| 0x30;\n```\n\nwhere char could\
    \ have equally well have been int8_t on this machine. Of course, if the value\
    \ has more digits then two you would need to continue in the same way, but this\
    \ is the general idea. Once you have the two digits as char you can print them:\n\
    \n```\nprintf(\"%c%c\\n\",first,second);\n```\n\nwhich displays 42.\nOf course,\
    \ you can achieve the same result more generally with:\n\n```\nprintf(\"%d\\n\"\
    ,a);\n```\n\nThe point of this example isn't so much to explain how printf formats\
    \ work their magic, more that printf and much of what happens in C is about converting\
    \ one representation into another. In this case the variable a was interpreted\
    \ as holding a binary value and this was transformed into two additional bit patterns\
    \ which represent the ASCII codes of the first two digits in the decimal representation."
