- pgno: 40
  md: '# Unicode


    For a final example of how types and bit patterns work, consider the difficult
    problem of C and Unicode. While C doesn''t have any standard Unicode features,
    C11 added the uchar.h header to provide some basic functionality, but it isn''t
    universally supported. A much simpler solution is to use UTF-8 encoding because
    this is almost universally adopted by web pages, editors and display software.


    UTF-8 is a variable length code that uses up to four bytes to represent a character.
    How many bytes are used to code a character is indicated by the most significant
    bits of the first byte.


    Byte 1

    0xxxxxxx  one byte

    110xxxxx  two bytes

    1110xxxx  three bytes

    11110xxx  four bytes


    All subsequent bytes have their most significant two bits set to 10. This means
    that you can always tell a follow-on byte from a first byte. The bits in the table
    shown as x carry the information about which character is represented. To get
    the character code you simply extract the bits and concatenate them to get a 7,
    11, 16 or 21-bit character code.


    For example, if you have the bytes:


    1110010 10001000 10010001 or E2 88 91 in hex


    The first byte has 111 as its start and so this is a three-byte encoding. The
    second and third bytes start 10 so these are indeed the follow-on bytes. Extracting
    the remaining bits gives the 11-bit value:


    ```

    00010 001000 010001

    ```


    which is 2211 in hex, 8721 in decimal, and this corresponds to the mathematical
    summation sign, i.e. a sigma, Σ.


    The first 128 characters of UTF-8 are the same as ASCII, so if you use a value
    less than 128 stored in a single byte then you have backward compatible ASCII
    text.


    You might think that using UTF-8 was difficult from C without a UTF-8 library,
    but you can go quite a way with just the “it''s all a bit pattern” approach. It
    is highly likely that the editor that you are using to create code is UTF-8 compliant,
    so if you know how to type extended characters into your program you can use Unicode
    literals.


    Under Windows entering Unicode depends on the application you are using. A good
    approach is to enter the character using any application that works and then copy
    and paste it into your program.


    Under Linux you have to press CTRL+SHIFT and while holding these down type a u.
    This will display u, a u with an underline. You can then type the'
