    \ <stdio.h>\n#include <stdlib.h>\n#include <stdint.h>\n\nint main(int argc, char\
    \ **argv)\n{\n    int_8_t a = 1, b = 2;\n    int_8_t c = a + b;\n    printf(\"\
    %d\\n\", c);\n}\n```\n```\n\nNotice the need for the additional header file.\n\
    \nTo provide even more flexibility C99 introduces `int_least_n_t` which has at\
    \ least *n* bits and `int_fastn_t` which is the fastest number of bits with at\
    \ least *n* bits. Notice that in both cases you may get storage allocated with\
    \ more bits than you specify and this alters when overflow occurs.\n\nNotice that:\n\
    \n+   - `char` = `int_least_8_t`\n- `short` = `int_least_16_t`\n- `int` = `int_least_16_t`\n\
    - `long` = `int_least_32_t`\n- `long long` = `int_least_64_t`\n\nThere are also\
    \ two additional types that are occasionally useful:\n\n+   - `int_max_t` the\
    \ largest integer type available\n- `intptr_t` gives enough bits to hold a pointer\n\
    \nThe only use of `intptr_t` is if you need to cast a pointer to an integer to\
    \ find out the address. In most cases you would be better off casting to `void*`\
    \ unless you want to perform arithmetic or logical operations, i.e. integer operations\
    \ on the address.\n\n# ## Char Type\n\nAll languages have to provide some way\
    \ of converting a bit pattern into something that can be printed or displayed\
    \ and C is no exception. However, C is, as you might expect, a little more low-level\
    \ than most. It sets aside the `char` type as the smallest collection of bits\
    \ that can represent the characters that can be displayed on the machine's peripherals.\
    \ This is conventionally just eight bits and in most cases we can regard a `char`\
    \ as a byte. By today's standards this is hopelessly out-dated because of the\
    \ now almost universal use of Unicode which needs 21 bits per character or code\
    \ point. To store raw Unicode you would need a `char` to be 32-bits, but this\
    \ never happens. There is a `wchar_t` type but this varies in size from 16-bits\
    \ to 32-bits and makes no mention of what encoding UTF-16 or UTF-32 should be\
    \ used. In practice it is better to avoid `wchar_t` if possible and use UTF-8\
    \ – see later."
