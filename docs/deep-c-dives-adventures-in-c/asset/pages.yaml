  md: "In this case, however, the use of an enumeration loop isn't really justified.\
    \ For a true enumeration loop you have to know the number of repeats before the\
    \ loop begins. In this case we only know the maximum number of repeats is the\
    \ number of elements in the array – the loop may finish earlier if the target\
    \ is found. This is not an enumeration loop. It is a conditional loop where we\
    \ know the maximum number of repeats and it can be written more expressively as:\n\
    \n```\ni = 0;\nwhile (array[i] != target && i<n) {\n    i++;\n}\n```\n\nYou can\
    \ even write this loop as a C for loop:\n\n```\nfor(i = 0; array[i]!= target &&\
    \ i<n; i++){\n}\nprintf(\"%d\\n\",i);\n```\n\nHowever, many programmers think\
    \ that having a compound condition to keep a loop running is less clear than a\
    \ misuse of a for loop at the cost of a break.\n\nFinally what is the continue\
    \ for?\n\nThe continue is for the “fix it” loop. If you need to scan through an\
    \ array and pick out elements that need to be “fixed” or processed in some way\
    \ you might use:\n\n```\nfor(i = 0; i < n; i++){\nif (array[i]!= fixFlag) continue;\n\
    fix (array[i]!;\n}\n```\n\nIf the array element needs fixing then it is fixed,\
    \ otherwise the continue skips the fix and moves the loop on to the next element\
    \ of the array.\n\nThis is an enumeration loop proper, as we know the number of\
    \ repeats before the loop begins. However, we don't really need the continue and\
    \ can write instead:\n\n```\nfor(i = 0; i < n; i++){\nif (array[i]== fixFlag)\
    \ fix(array[i];\n}\n```\n\nThe continue just gives you a way of skipping the last\
    \ part of a loop and you can always do this with an if statement."
