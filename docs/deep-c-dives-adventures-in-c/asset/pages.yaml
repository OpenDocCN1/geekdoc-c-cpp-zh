  img_proc: true
- pgno: 155
  md: 'To specify a variadic function you simply end the parameter list with three
    dots, ..., an ellipsis. The C standard states that the function has to have at
    least one explicit parameter and this rules out pure variadic functions. A variadic
    function has to be declared using `...` before you can use it. Calling a variadic
    function is just like calling any function but you can now use as many parameters
    of any type, apart from the first few normal parameters.

    For example:

    `int max(int n, ...);`

    declares a variadic function and:

    `int result=max(3,1,2,3);`

    calls it. In this case the first parameter is being used to specify the number
    of optional parameters. This isn''t essential, but it is common practice.

    To process the optional parameters you have to make use of some predefined macros
    in the `stdarg.h` file. The idea is that as parameters are passed on the stack
    there is no need to restrict the number of parameters that are pushed onto the
    stack when the function is called. The variadic function can use a macro to get
    a pointer to the stack and a macro to retrieve each argument in turn.

    The macro:

    `va_start(args, argN)`

    sets the variable `args` of type `va_list` to reference the first variable parameter
    and this is located on the stack after `argN`, the last fixed parameter. For example:

    `va_list args;`

    `va_start(args,n);`

    sets `args` to reference the first optional parameter which is located on the
    stack after the `n` parameter.

    The macro:

    `va_args(args,type);`

    retrieves the next argument from the stack. The `type` parameter is used to specify
    how far to move the reference on so that it references the next parameter. For
    example:

    `int a=va_args(args,int);`

    retrieves an `int` argument and moves `args` on to reference the next argument
    if there is one. Notice that you can read as many or as few arguments as you like.
    If you read beyond the number of arguments specified then whatever is in the memory
    is returned.'
  merge: -1
  img_proc: true
- pgno: 156
  md: "When you are finished with the reference to the stack you can call: \n`va_end(args);`\n\
    to free up the pointer, but in practice this usually is no operation.\n\nYou can\
    \ pass args on to another function if you want to. You can also obtain multiple\
    \ argument pointers and use each one independently to access the arguments. You\
    \ can also ignore all or some of the optional arguments. There is also a copy\
    \ function, added in C99, that you can use to make a copy of the pointer: \n`va_copy(dest,\
    \ src);`\nThis allows you to mark where you got to in the argument list and continue\
    \ at a later time. In versions before C99, you can generally make a copy by direct\
    \ assignment.\n\nNotice that the idea that the arguments are all stored on the\
    \ stack may be a simplification as many compilers will use registers for the first\
    \ few parameters in a function – but it is a useful abstraction.\n\nThe big problem\
    \ with using variadic functions is that the whole process is error-prone. You\
    \ can get the number of arguments wrong and you can get their types wrong and\
    \ the compiler will not inform you that there is a problem, but you will be working\
    \ with mangled data. You can use the usual two ways of fixing the number of parameters\
    \ – supply the number as the first fixed parameter or use a sentinel value.\n\n\
    For example, to find the maximum of a variable number of parameters:\n\n```\n\
    ```\n#include <stdio.h>\n#include <stdlib.h>\n#include <stdarg.h>\n\nint max(int\
    \ n, ...)\n{\n    va_list args;\n    va_start(args, n);\n    int maxvalue=va_arg(args,int);\n\
    \    int temp;\n    for(int i=1;i<n;i++){       \n        temp = va_arg(args,int);\n\
    \        if(maxvalue<temp) maxvalue = temp;\n    }\n    return maxvalue;\n}\n\
    ```\n```\n\nNotice that there is no check that n is sensible and if n is specified\
    \ incorrectly the function will read memory locations that it hasn't set. You\
    \ can call this function using something like:\n`printf (\"%d\\n\",max(4,3,4,2,9));`"
  merge: -1
  img_proc: true
- pgno: 157
  md: "You could use a sentinel value to mark the end of the parameters, but what\
    \ value should you use?\n\nAnother approach is typified by `printf`. The format\
    \ string specifies a parameter and a type. For example a format string `\"%d%d%d\"\
    ` specifies that three arguments, each an `int`, should be supplied:\n\n`printf(\"\
    %d %d %d\", a, b, c);`\n\nNotice that this implies that `printf` isn't entirely\
    \ safe in that you can supply a smaller number of arguments than the format string\
    \ specifies.\n\n# Return\n\nAs we have already discovered, a function can return\
    \ a value, again using the stack, and this is used as if it was the result of\
    \ evaluating an expression with the value being pushed onto the stack for the\
    \ calling program to use. This is \"call and return by value\". When you call\
    \ a function the parameters are copied onto the stack and the return value is\
    \ copied onto the stack.\n\nNotice that a function that doesn't return a value,\
    \ i.e. its return type is `void`, doesn't have to have a return statement. Equally,\
    \ if a function does return a value, the calling program can perfectly well ignore\
    \ it and essentially discard it. A function that doesn't return a value corresponds\
    \ to what would be called a \"procedure\" or a \"subroutine\".\n\nUsing pass by\
    \ value has implications for memory safety. For example:\n\n```\n```c\ntypedef\
    \ struct {\n  int myInt;\n} myStructType;\n\nmyStructType myFunction(void) {\n\
    \  myStructType myStruct = {42};\n  return myStruct;\n}\n```\n```\n\n```\n*main\
    \ program*\n\n```\n...\nmyStructType myReturnStruct = myFunction();\n```\n```\n\
    \nThis is perfectly fine as the `myStruct` is allocated on the stack as an auto\
    \ variable and when the function ends it is copied byte-by-byte to the newly created\
    \ `myReturnStruct`. However, make a small change to the program and things go\
    \ wrong:\n\n```\n```c\nmyStructType *myFunction(void)\n{\n  myStructType myStruct\
    \ = {42};\n  return &myStruct;\n}\n```\n```\n\n157"
  merge: -1
