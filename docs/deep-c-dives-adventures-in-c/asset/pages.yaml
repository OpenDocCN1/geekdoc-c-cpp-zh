- pgno: 118
  md: '# # Operator or Type?


    If you are anything like me you will be slightly perturbed that the dereference
    operator is also a type indicator. The two expressions `int *myVar;` and `int
    temp = *myVar;` seem like two different things but not if you look at the declaration
    in the right way and treat the `*` as the dereference operator.


    When you write: `int myVar;`


    this declares `myVar` to be an `int`. In the same way, when you write: `int *myVar;`


    this declares `*myVar` to be an `int`. So, if `*myVar` is an `int`, `myVar` (without
    the operator), has to be a pointer to an `int`. This is neat, but it doesn’t quite
    work. When you write the cast `(int*)`, which means cast to a pointer to `int`
    as now the `int*` seems to operate as a unit which says “pointer to int”.


    But as already pointed out, you can always regard `(int *)myVar` in the same way
    as the declaration i.e. if `myVar` is cast to an `int*` then `*myVar` has to be
    an `int`. It’s just not as neat.


    # ## Pointers, Arrays and Heaps


    It is reasonably true that pointers only come into their own when used in conjunction
    with the heap. However, we have already seen that pointers can be useful with
    a static variable and before we encounter the heap we need to understand how pointers
    give rise to arrays.'
