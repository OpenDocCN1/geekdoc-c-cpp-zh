- pgno: 163
  md: "# **Dive 14**\n\n# **Structs and Objects**\n\n> > “Object-oriented programming\
    \ is an exceptionally bad idea which could only have originated in California.”\
    \  \n> Edsger Dijkstra\n\nApart from the array, the struct is the only other sophisticated\
    \ data structure that C provides. As things turn out, the array and the struct\
    \ are enough for most things. At the most basic level, the struct is the C implementation\
    \ of the data record, but the data record is also where object-oriented programming\
    \ starts. This might seem surprising, but it is true that in most languages there\
    \ is little difference between an object and a record. To understand C’s approach,\
    \ the all purpose struct, let’s start with the basics.\n\n# **The Struct**\n\n\
    You were probably introduced to the struct, short for “structure”, as a sort of\
    \ array that allows different types as elements. For example:\n\n```\n```\nstruct{\n\
    int myfield1;\nfloat myfield2;\n} myStruct;\n```\n```\n\nThis creates a struct\
    \ with two fields – one an int and the other a float. These fields are grouped\
    \ into the structure in the same way as elements are in an array – except that\
    \ they are of different types. Of course, you access the fields using the familiar\
    \ dot notation:\n\n```\n```python\nmyStruct.myfield1 = 42;\nmyStruct.myfield2\
    \ = 4.2;\n```\n```\n\nThis declaration is of the standard form:\n\n```\n```python\n\
    type variable;\n```\n```\n\nwhere *type* is the complete struct definition and\
    \ the *variable* is the name at the end of the type."
