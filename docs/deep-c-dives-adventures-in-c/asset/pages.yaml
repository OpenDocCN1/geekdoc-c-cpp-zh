  md: "You can use variables, even ones that are being assigned, in the expression:\n\
    \n```\n```c\nint b = 3;\na = b = c = 2*b;\n```\n```\n\nas the expression is worked\
    \ out before the side effect is enacted. This sets all of the variables to **6**.\n\
    \nAnother use is to save a result while computing a conditional. For example:\n\
    \n```\n```c\nint a,b = 0;\nwhile( (a = 2*b) < 10) {\n    b = b+1;\n}\n```\n```\n\
    \nThe assignment within the while loop sets a to 2*b and evaluates to 2*b, which\
    \ is then compared to **10**. At the end of the loop you will find that a is **10**\
    \ and b is **5**. It is arguable that this is confusing, but it does avoid having\
    \ to compute the expression twice. In short, you can test an expression and save\
    \ its value.\n\nNotice that all of the assignment operators behave in this way.\
    \ For example:\n\n```\n```c\nint a = 0,b = 0;\nb = a+=1;\n```\n```\n\nsets a and\
    \ b to **1**.\n\nYou can even go as far as:\n\n```\n```c\nint a = 1,b = 2;\nb+=\
    \ a+=3;\n```\n```\n\nThis is evaluated as a is set to the contents of a plus 3\
    \ with the assignment returning **4** as its result. Then b is set to the contents\
    \ of b plus the expression to the right, i.e. **4**. As a result a is set to **4**\
    \ and b is set to **6**.\n\nYou can see that this is the same as:\n\n```\n```c\n\
    b = a+b = a+3;\n```\n```\n\nbut of course you can’t use this form as you cannot\
    \ assign a value to a+b. It is probably better not to use such confusing constructs.\n\
    \n# The comma\n\nThe comma operator is perhaps the most puzzling in C. The comma\
    \ is only treated as an operator if it is part of an expression:\n\n```\n```c\n\
    expression1, expression2;\n```\n```\n\nFirst expression1 is evaluated and the\
    \ result is thrown away. Then expression2 is evaluated and it is returned as the\
    \ result. This is very similar to the way assignment works but there are no side\
    \ effects."
