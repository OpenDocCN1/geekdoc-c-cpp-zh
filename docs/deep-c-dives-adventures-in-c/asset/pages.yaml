- pgno: 179
  md: 'We can now create a pointer to an instance of myUnion:

    ```

    union myUnion mytest;

    union myUnion *myPointer;

    myPointer=&mytest;

    ```

    How do we call:

    ```

    void myFunction(struct myStruct *myPointer)

    ```

    which, as originally written, expected a pointer to a myStruct? The only way is
    to cast the union pointer to a myStruct pointer:

    ```

    myFunction((struct myStruct) *myPointer);

    ```

    and thus we haven''t avoided using a cast. The only alternative is to rewrite
    the function to accept a union, or design it this way from the start. Lack of
    such forethought is exactly what the cast approach aims to make up for. The cast
    approach is extensible in a way that the union approach isn''t. However, having
    said this, there are many approaches to this problem and this is not the end of
    the story if you want to invent more solutions.


    # ### Tagged Union


    Although the main use of unions in low-level C programming is to perform type
    punning, this is not what more general programmers tend to think a union is for.
    Many programmers, and especially those more familiar with higher-level languages,
    see unions as ways of saving storage or creating flexible data structures often
    called variants or tagged unions.


    For example, suppose you have a name record which sometimes has a telephone number
    as a string and sometimes as an integer. You could store this as:

    ```c

    struct {

    int type;

    union {

    char numstring[10];

    int numint;

    } phone;

    } person;

    ```

    Notice that the phone fields are a union of char[10] and int. The type field is
    the tag indicating which type is to be used. For example:

    ```c

    person.type = 1;

    strcpy(person.phone.numstring,"1234");

    person.type = 0;

    person.phone.numint = 1234;

    ```

    When trying to access the fields you would test the type field first.'
