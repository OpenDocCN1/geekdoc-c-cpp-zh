- pgno: 54
  md: '# **Side Effects and Sequence Points**


    An expression should just return a result and change nothing else in your program.
    If an expression causes something else to happen then it is said to have a “side
    effect”. In other languages the only concern is whether or not a function has
    a side effect. For example, a function that prints something has a wanted side
    effect, printing something. Functions that produce no side effects are said to
    be “pure” and functions in C can be pure, but often they are not.


    What is surprising is that in C operators can have side effects and hence expressions
    can have side effects, even if they don''t contain a function. For example, the
    unitary increment operator ++ when used as a postfix operator in A++ returns current
    value of A. That is, it is the same as just writing A, but as a side effect it
    increments A. In other words, if A is 3 then after B = A++, B is set to 3 and
    A is set to 4. Notice that this is quite different from ++A, the corresponding
    unary prefix operator, the result of which is A+1 and which has the side effect
    of incrementing A. So, if A is 3 then, after B = ++A, B is set to 4 and so is
    A.


    Notice that the ++ postfix operator has the highest priority and associates from
    left to right, whereas as a prefix operator it has a priority of 2 and associates
    from right to left. Also notice that A++ has the same meaning as A+= 1.


    It is this amazing richness of operators that makes C so attractive to anyone
    who has taken the time to master it. After a while you can write an expression
    such as:


    ```

    C += A++ + B++ + (D=++E) == F

    ```


    What does this mean? Good question, so don''t write expressions like this one.


    Also notice that there are some problems with side effects. What does:


    ```

    i = i++;

    mean?

    ```


    It all depends on when the increment is performed relative to the assignment.
    The problem is that the value of i is changed twice by the side effects of the
    expression, once by assignment and once by the postfix increment, and the order
    the side effects occur in isn''t clear. To try to solve this problem C11 introduced
    the idea of a “sequence point”, a point in the expression where all side effects
    so far encountered are forced to be complete. This provides an order for the side
    effects relative to the operators.


    The end of any full expression obviously has to be a sequence point. The end of
    an initializer is also a sequence point and so is the comma operator and any function
    call in an expression. Notice, however, that the order in which the functions
    are called is not always specified and the order in which parameters are evaluated
    is never specified.'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'There is a sequence point after the evaluation of each format specifier in
    a `printf` to avoid any expressions you are evaluating interacting in undefined
    ways.


    Logical OR and AND operators, `||` and `&&` are sequence points because they are
    evaluated in a different way to other operators. For an OR, if the left-hand expression
    is true then the right-hand expression is not evaluated because the result is
    already known to be true. Similarly for an AND, if the left-hand expression is
    false then the right-hand expression is not evaluated because the result is already
    known to be false. This is called "short circuited", or "lazy" evaluation. In
    both cases, however, the left-hand expression is complete, including side effects,
    before the right-hand expression is evaluated. Notice that if the right-hand expression
    has any side effects, including throwing an error, these will not happen if the
    evaluation is short circuited.


    For example, in:


    ```

    ```c

    int result = a||b++;

    ```

    ```


    `b` will not be incremented if `a` is true and in:


    ```

    ```c

    int result = a|| b/0;

    ```

    ```


    no divide by zero error will occur if `a` is true.


    For similar reasons, a conditional expression is a sequence point. The first expression
    is fully evaluated, including side effects, before the second or third expression
    is evaluated. That is, the `?` in `a?b:c` is a sequence point.


    So far sequence points simply tell you when you can expect side effects to be
    complete, but they don''t help with the problem of:


    ```

    ```c

    i=i++;

    ```

    ```


    The sequence point is at the end of the expression and it still isn''t clear whether
    the side effects occurred as assignment then increment, or increment then assignment.
    To deal with this the C11 standard also introduced two conditions that have to
    be satisfied to make an expression legal:


    > > *Between the previous and next sequence point an object shall have its stored
    value modified at most once in the evaluation of an expression. Furthermore, the
    prior value shall be accessed only to determine the value to be stored.*


    These two rules make `i = i++` undefined as the variable has its value changed
    more than once.'
