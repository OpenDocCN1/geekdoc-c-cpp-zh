- pgno: 184
  md: '# ## Undefined Behavior


    The current concern is undefined behavior, UB – what it is, what it means and
    how to avoid it. However, as we have just seen, before undefined behavior hit
    the C headlines, we had unobservable behavior to cope with. In many ways the two
    are very similar, but undefined behavior takes on a more aggressive role.


    Undefined behavior is a term used to specify that a particular operation has no
    meaning or is unpredictable. The idea is that the language specification refuses
    to specify what is to happen, leaving it up to someone else to supply an interpretation.
    This seems innocent enough, but over time it has morphed into something of a monster.


    There is a great deal of argument about when the notion of undefined behavior
    first arose and much of it is about the placement and interpretation of commas
    in standards. Standards are not always particularly clear. What is clear is that,
    initially at least, undefined behavior was used to simply mean that the standard
    did not cover the situation. In this sense, if you wrote code that included undefined
    behavior then your program was not covered by the standard.


    Perhaps the high point of undefined behavior''s travel from reasonable to unreasonable
    was the famous “nasal demons” post in 1992 on a fairly “serious” newsgroup, comp.std.c:


    > “*Undefined behavior -- behavior, upon use of a nonportable or erroneous program
    construct, ... for which the standard imposes no requirements. Permissible undefined
    behavior ranges from ignoring the situation completely with unpredictable results,
    to having demons fly out of your nose.*”


    If you think that this humorous comment is extreme, a few posts earlier we have:


    > “*At this point, the compiler is at liberty to generate a program which formats
    your hard disk drive. In fact, it probably should.*”


    The idea that if a program contained undefined behavior then all bets were off
    grew and continues to grow from this point. It is the programmer''s equivalent
    of the principle of explosion. If you have two logical premises, P and !P, and
    you assume that they are both true, then anything can be proved true. The reasoning
    is:


    P is true so P or Q is true no matter what Q is. But as !P is true P or Q implies
    that Q is true. Hence any statement can be proved true if P and !P are assumed.


    So rejecting the law that only one of P or !P can be true, leads to a situation
    in which logical demons can fly out of your nose.'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'Of course, in practice, the existence of the principle of explosion is an argument
    for anything that invokes it is meaningless. So too with undefined behavior –
    its exploitation produces meaningless program semantics. And yet we still have
    the confusing idea that undefined behavior is at the same time somehow useful,
    and yet something that programmers need to identify and eliminate if they want
    to avoid nasal demons. It also gives you some idea of how out of touch compiler
    writers can be when they don''t appreciate the uses of the language they are trying
    to compile.


    There is a huge difference between stating that the standard does not define what
    happens in a particular case and thinking that this gives you carte blanche to
    do whatever you want. It seems that what happened was that the standards committee
    discovered it was easier to leave some behavior to the machine the program was
    running on to deal with, but instead of marking it as machine-dependent or implementation-dependent
    they chose to represent it as simply being outside of the standard and then the
    rest followed.


    # UB in Practice


    The reputation of undefined behavior, UB, has caused many programmers to focus
    on it and avoid anything that has been defined as such. This is an overreaction
    because many undefined behaviors are perfectly well-defined in practice and, in
    many cases, desirable rather than avoidable. The important thing to realize is
    that despite being threatened with nasal demons and reformatting of disks, this
    rarely happens.


    In practice undefined behavior is mostly a nuisance just like the optimizations
    that don''t take account of what might be observable. Indeed one of the examples
    given of dead code deletion could just as well be listed as undefined behavior
    as dividing by zero is listed as such. So when you write:


    ```

    int a;

    int b = 0;

    int c = a/b;

    ```


    you have already got undefined behavior, even if you then don''t make use of c
    and have deadcode. In practice, what happens is not nasal demons but something
    much worse – an exception.


    Of course, division by zero is something you need to protect against – even if
    it wasn''t undefined behavior. The usual way to do this is to use an if statement:


    ```

    if (b!=0) c = a/b;

    ```


    or make use of lazy evaluation:


    ```

    c = b & a/b;

    ```'
