- pgno: 189
  md: "For example:\n\n```\nint a = INT MAX;\nif ((signed)((unsigned)a+(unsigned)1)\
    \ < a)\n    printf(\"Integer overflow!\");\nelse\n    printf(\"%d\",a+1);\n```\n\
    \nIn this case the arithmetic is performed unsigned and overflow is fully defined.\
    \ Converting back to signed reveals that there has been an overflow and we see\
    \ the appropriate message, even with optimization.\n\nIn this case, it seems clear\
    \ that the optimization obtained by making signed overflow undefined behavior\
    \ isn't worth the trouble it causes.\n\n# ## Strict Aliasing\n\nThis is the undefined\
    \ behavior which causes the most trouble of all because it goes against the very\
    \ fundamentals of what C is designed to be good at. As in the case of signed overflow,\
    \ it is another example of undefined behavior in the service of a fairly unwanted\
    \ optimization.\n\nStrict aliasing simply means that if two pointers are of incompatible\
    \ types then they cannot be referencing the same data. Unfortunately, the rules\
    \ as to which types are compatible are difficult to interpret, but roughly they\
    \ come down to compatible types are any type that differ only by a qualifier or\
    \ signed/unsigned and a char type is compatible with everything. Structs are only\
    \ compatible if all of their fields are compatible.\n\nThis all sounds very abstract\
    \ – let's take a look at how this works in practice with a simple example. Consider\
    \ the function:\n\n```\nint alias(int *a, float *b)\n{\n    *a = 0;\n    *b =\
    \ 1.0;\n    return *a;\n}\n```\n\nIn this case the two pointers are to incompatible\
    \ types and so the compiler can assume that they do not reference the same thing.\
    \ As they do not reference the same data, the function can be optimized to:\n\n\
    ```\nint alias(int *a, float *b)\n{\n*a = 0;\n*b = 1.0;\nreturn 0;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 190
  md: "Now consider what happens if we break the strict aliasing rule:\n\n```\nint\
    \ main(int argc, char **argv)\n{\n    int a = 42;\n    printf(\"%d\\n\", alias(&a,\
    \ (float *)&a));\n    printf(\"%d\\n\", a);\n}\n```\n\nYou can see that we are\
    \ passing an int pointer and a float pointer to the function and hence a and b\
    \ in the function do reference the same data. But the fact that the compiler thinks\
    \ this doesn't happen results in the function returning 0 even though a in the\
    \ main program should be set to 1.0 by the function call.\n\nThere are lots of\
    \ examples where the assumption that pointers of two incompatible types cannot\
    \ refer to the same data, produce very similar results. You might think that aliasing\
    \ int to a float isn't useful and perhaps even outright wrong, but you get the\
    \ same effect with int and long which are also not compatible:\n\n```\nlong alias(long\
    \ *a, int *b)\n{\n    *a = 0;\n    *b = 1;\n    return *a;\n}\nint main(int argc,\
    \ char **argv)\n{\n    long a = 42;\n    printf(\"%d\\n\", alias(&a, (int *)&a));\n\
    \    printf(\"%d\\n\", a);\n}\n```\n\nThis should display 1 and 1 but with optimization\
    \ it displays 0 and 1 when compiled with GCC. This strange result is because as\
    \ it is assumed that *a and *b reference different things the return *a can be\
    \ converted into return 0;\n\nBoth assignments are carried out and hence a in\
    \ the main program is 1. This is all the more surprising when you learn that on\
    \ most modern systems int and long are both four bytes and therefore highly compatible\
    \ in general terms."
  merge: -1
  img_proc: true
- pgno: 191
  md: "The worst case is that two structs that have incompatible fields are incompatible.\
    \ For example:\n\n```\ntypedef struct {int x;} struct1;\ntypedef struct {short\
    \ y;short z;} struct2;\n\nlong alias(struct1 *a, struct2 *b)\n{\n    a->x=0;\n\
    \    b->y=1;\n    return a->x;\n}\n\nint main(int argc, char **argv)\n{\n    struct1\
    \ a;\n    a.x=42;\n    printf(\"%d\\n\", alias(&a, (struct2 *)&a));\n    printf(\"\
    %d\\n\", a.x);\n}\n```\n\nIn this case we have two structs which are compatible\
    \ from the point of view of padding, endianism and total size – but not by the\
    \ type of fields. Put simply struct2 treats the int in struct1 as two shorts.\
    \ If you try this out you will discover that once again the function has been\
    \ optimized and the function returns 0 and 1 because it is assumed that a and\
    \ b reference different things and so the return a->x can be optimized to return\
    \ 0. Notice that setting b->y to 1 also sets a->x to 1.\n\nWhat is to be done\
    \ about these erroneous optimizations?\n\nOne very prevalent attitude is to say\
    \ that the programmer should avoid undefined behavior and not doing so simply\
    \ results in the construction of an invalid program. This is to ignore the usefulness\
    \ of the idea of type punning, especially for structs. You could avoid some of\
    \ these problems by using suitable unions in place of type punning, but sometimes\
    \ this just isn't appropriate. Some even suggest that the correct way to do the\
    \ job is to use memcpy to create a bit copy of the original datatype to another\
    \ area of memory and treat that like the alternative type in the hope that the\
    \ compiler notices the idiom and optimizes it away! This just reveals how ludicrous\
    \ the situation of defining something, that makes C the language it is, as undefined\
    \ behavior.\n\nThe best solution, if using GCC, is to always compile your programs\
    \ with the -fno-strict-aliasing option. If you try this out with all of the previous\
    \ examples, you will discover that they work as the programmer intended rather\
    \ than as the compiler writer fantasized."
