- pgno: 98
  md: "The idea was simple. If a variable is declared within a function then the storage\
    \ for it is allocated on the stack. While the function is active the variable\
    \ is accessible and usable, we say it is “in scope”.\n\n```\n```\nresult=sum(1,2);\n\
    printf(\"%d\",result);\n\nint sum(int a, int b){\n    int c=a+b;\n    return c;\n\
    }\n```\n```\n\n![](img/5f2ea21c2077d473344a0fdf144677b9_98_0.png)\n\nWhen the\
    \ function ends the stack is popped back to the return address and this is used\
    \ as the target of the return. The variables that were created on the stack are\
    \ no longer accessible as the stack pointer has moved back to its starting position.\n\
    \n```\n```\nresult=sum(1,2);\nactive line \n\nint sum(int a, int b){\n    int\
    \ c=a+b;\n    return c;\n}\n```\n```\n\n![](img/5f2ea21c2077d473344a0fdf144677b9_98_1.png)\n\
    \nThis approach allows languages, C included, to have variables declared in functions\
    \ to be automatically local. Although you don’t see it used very often, basically\
    \ because it doesn’t actually change anything, C has the auto keyword which defines\
    \ a local variable. You can write:\n\n```\n```\nint sum(int a, int b){\n    auto\
    \ int c=a+b;\n    return c;\n}\n```\n```\n\nbut the use of auto changes nothing.\
    \ The variable c is an automatic local variable as it is defined within a function.\n\
    \nTo be more precise about the way that the stack is used, we need to introduce\
    \ some new jargon, “stack frame”. A stack frame is what is created on the stack\
    \ when you call a function. The exact format of a stack frame varies according\
    \ to the machine architecture and what optimizations the compiler is applying.\
    \ All that really matters is that the information used by the function is stored\
    \ in its stack frame on the stack and when the function ends the stack pointer\
    \ is adjusted to reference the previous function’s stack frame."
  merge: -1
  img_proc: true
- pgno: 99
  md: 'Most modern languages use the stack and the stack frame to store the return
    address, all the local variables and the functions'' parameters. That is, when
    you call a function, the arguments you supply are usually pushed onto the stack
    to be retrieved and used by the function you call. In the same way, it is usual
    for any of the function''s results to be pushed onto the stack as the function
    comes to an end so that the calling function can retrieve it.

    Function call and return really fit neatly into the way a stack operates.


    # ## Dead Data


    The operation of the stack during function calls and returns is fairly clear now,
    but there is a potential problem. For example, if function A calls function B
    then there are two stack frames on the stack. If function B then calls function
    C another frame is pushed onto the stack. If function C returns, using the return
    address stored in its stack frame then the stack pointer is set to the start of
    the stack frame for function B.


    ![](img/5f2ea21c2077d473344a0fdf144677b9_99_0.png)


    If you follow this idea you can see that it results in a perfectly natural way
    to implement functions, including their return addresses and automatic local variables.


    Notice that in the diagram the data that function C used is still stored on the
    stack because it isn''t accessible using standard stack operations. What this
    means is that it is possible to arrange to access a function''s local data after
    it has returned!'
  merge: -1
  img_proc: true
