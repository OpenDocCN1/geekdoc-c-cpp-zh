- pgno: 84
  md: 'For example:

    for(index = $startvalue$; index <= $endvalue$; index++){


    gives an enumeration loop that runs from $startvalue$ to, and including, $endvalue$,
    whereas:

    for(index = $startvalue$; index >= $endvalue$; index--){


    gives an enumeration loop that runs from $startvalue$ down to $endvalue$ assuming
    $startvalue > endvalue$ and so on.


    These idioms are what makes the C for loop usable for beginners and non-beginners
    alike. It is a for loop with direct mapping to the underlying assembly language
    that it is compiled to and as such it is brilliant. But it has its evil side –
    it is too flexible.


    # ## While and Until


    The for loop is very general, but it is limited to having its exit point at the
    start of the loop. This makes it a while loop.

    Loops differ in where they place their exit points, i.e. where the test for the
    end of the loop is. This is another distinguishing feature in the loop zoo – loops
    differ in both the number of exit points they have and where they are placed.

    While loops test at the start and until loops test at the end.

    It should be clear that the difference is that a while loop can exit without ever
    executing the body of the loop, but an until loop has to execute the body of the
    loop before making a test. You can summarize this as a while loop repeats 0 to
    $n$ times and an until loop repeats 1 to $n$ times. In other words, an until loop
    has to execute at least once.


    C has a while loop, but it is entirely equivalent to a particular form of the
    for loop. The while loop:

    while($condition$){

    }


    is exactly the same as:

    for(;$condition$;){

    }


    and, yes, you can leave out any part of the for loop as long as it makes sense.
    Indeed:

    for(;;)


    is an infinite loop, often used in IoT applications and in constructing more general
    loops. It never ends because there is no condition specified.'
  merge: -1
  img_proc: true
- pgno: 85
  md: "C also has an until loop and this is one that is more difficult to convert\
    \ into a for loop:\n\n```\ndo{\n  body of loop\n}while(condition)\n```\n\nIf this\
    \ is an until loop, why does it end with while?\n\nThe answer is that in a conventional\
    \ until loop the condition is for the loop to end. In a conventional while loop\
    \ the condition is for it to continue. You can see that until = !while in that\
    \ until ends the loop and while continues it.\n\nSo even though the C until loop\
    \ has its exit point at the end it uses a condition for it to continue – hence\
    \ the use of while. It’s a historical accident caused by the desire to reuse the\
    \ compiler’s handling of the while condition i.e. to avoid introducing an until(condition).\n\
    \nYou can convert this to a for loop, but only if you are prepared to repeat the\
    \ body of the loop:\n\n```\nbody of loop\nfor(condition){\n  body of loop;\n}\n\
    ```\n\n# Break and Continue\n\nWhat about loops that have their exit point not\
    \ at the end and not at the beginning?\n\nBefore languages like C, loops could\
    \ exit from any point in their body simply by using a jmp instruction to outside\
    \ the loop. This was not a good idea because it relied on the programmer to keep\
    \ things simple and clear. For a long time it was asserted that you only needed\
    \ a for loop, a while loop and an until loop – and this is true. Any program that\
    \ can be written, can be written using just these loops. This is the original\
    \ premise of “structured programming”, the first attempt to make programming better.\n\
    \nToday we tend not to be as hardline and the break and continue statements were\
    \ introduced in C90. The break statement is equivalent to a goto that jumps out\
    \ of the loop, i.e. to the first instruction following the loop. The continue\
    \ statement is equivalent to a goto that jumps to the start of the loop, i.e.\
    \ it skips any remaining statements in the body of the loop.\n\nBoth constructs\
    \ let you construct loops that complete a fractional number of repeats. For example:\n\
    \n```\nfor(i = 0; i < 10; i++){\n  print(\"before\\n\");\n  if(i == 5) break:\n\
    \  printf(\"after\\n\", i);\n}\n```\n\n85"
