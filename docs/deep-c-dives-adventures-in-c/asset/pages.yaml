- pgno: 131
  md: '# ## Dive 12


    # Heap, The Third Memory Allocation


    > "Facts are a heap of bricks and timber. It is only a successful theory that
    can convert the heap into a stately mansion"


    Isaac Asimov


    So far we have seen two different types of memory allocation, file-level and automatic.
    Now it is time to meet the heap, the most sophisticated and direct form of memory
    allocation available to the C programmer. In many ways advanced C programming
    only really starts when you use the heap and yet the heap solves so many problems,
    it makes things simpler. To make good use of the heap you have to have a good
    grasp of pointers and how to use them.


    # ## The Heap


    Usually, but not always, a computer''s memory is divided up such that the program
    and all of the file-level data are stored in the lowest portion. Then comes the
    stack which is allocated as needed and grows and shrinks as auto variables are
    created and destroyed. The heap is the remaining available memory usually organized
    as a single contiguous block starting at the top of available memory that can
    be allocated for use in blocks of a specified size.


    ![](img/5f2ea21c2077d473344a0fdf144677b9_131_0.png)'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'The growing and shrinking of the stack is extremely efficient in the sense
    that only the exact amount of memory needed at any given time is used and nothing
    special has to be done to release previously used stack memory. This isn''t the
    case for the heap, which quickly becomes a patchwork of allocated memory and released
    memory. This doesn''t matter as long as there is a free block of heap memory large
    enough to satisfy the current request for memory. To keep large areas of free
    memory available the heap has to be subject to some sort of garbage collection.
    This is the responsibility of the operating system and can be mostly ignored by
    the C programmer.


    In principle, if the heap has the amount of memory you have requested free, then
    it should be available as a contiguous block. However, there can be consequences
    of the operating system managing the heap such that occasionally it will need
    to make use of the CPU to rearrange the heap to coalesce separate free blocks
    which are too small on their own and this could introduce a slowdown in your program.
    This is less of a problem in a system with multiple CPUs.


    Notice that another big difference with the heap is that the programmer is responsible
    for allocating and deallocating memory. This is usually explained to be the most
    difficult part of using the heap. In fact allocating memory is generally easy
    and deallocating it is slightly trickier in complex situations where different
    parts of the program make use of the same block of memory. It can be difficult
    to be sure that an allocated block isn''t still in use by some other part of the
    program when you decide to deallocate it.


    Another big difference between file, auto and heap variables is that file and
    auto variables are allocated automatically – you simply declare them and they
    are created for you using the amount of memory necessary for the type. A heap
    variable on the other hand requires you to allocate a block of memory large enough
    to store its type and then associate that type with it so that can be easily used.


    All of this depends on the use of pointers and sometimes some quite sophisticated
    or clever use of pointers.


    # # Malloc and friends


    There are a set of C functions concerned with working with the heap. These make
    use of facilities provided by the operating system to manage the heap. The best
    known is malloc, standing for memory allocation. This simply returns a pointer
    to a block of memory of the required size:


    ```

    `void *malloc(size_t size);`

    ```


    size is in bytes and if it works it returns a pointer to void to the start of
    the block of memory allocated. It is important to know that the block of memory
    is not initialized in any way and this is the basis of many exploits as you can
    use it to discover data that a previous program stored in the memory.'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'If `malloc` allocates a block of memory `free` releases it back to the heap.
    There are some interesting details of `free` that if better understood could save
    us from memory errors. If you call `free` on a pointer to memory that has already
    been freed then the result is undefined behavior. However if you call `free` with
    a NULL pointer then no operation is performed. NULL is simply a stand-in for zero
    but most systems regard an address of zero as not being an address you can allocate
    using `malloc`. So if you always set a pointer to NULL after freeing the memory
    you can use this as a flag to indicate that the memory has been freed meaning
    that even if another part of the program tries to free it a second time there
    will be no problem – as long as it uses the same pointer.


    There is no doubt that you only need `malloc` and `free` to work with the heap,
    but there are three common useful extras that can make life easier.


    A common requirement is to create a block of memory large enough to store an array
    of identical elements. This is usually achieved using:


    ```

    p = malloc(sizeof(type)*N);

    ```


    where N is the number of elements, but it can be written:


    ```

    p = calloc(N, sizeof(type));

    ```


    The saving is tiny, but there is another, almost more important, difference between
    `calloc` and `malloc` – `calloc` zeros the block of memory returned and `malloc`
    doesn’t. If you need a zeroed block of memory then it might be worth using:


    ```

    p = calloc(1, sizeof(type));

    ```


    If you need to change the size of a block of heap memory, you can use:


    ```

    p = realloc(ptr, size);

    ```


    This changes the size of the block referenced by ptr to the size specified. The
    existing data isn’t changed and any new memory locations are not initialized.
    The block of memory can be increased or decreased in size. If ptr is NULL then
    a new block is allocated. If ptr is not NULL and size is 0, the block is released.
    If the block has to be moved to make the resize possible the original block that
    ptr referenced is freed and ptr is set to NULL. In practice always use p rather
    than ptr after `realloc`.


    There is also:


    ```

    p = reallocarray(ptr, N, sizeof(type));

    ```


    which works like `realloc`, but the size is specified in terms of the size of
    the element and number of elements. Apart from this it works in exactly the same
    way and in particular any additional memory is not initialized.'
  merge: -1
  img_proc: true
- pgno: 134
  md: "# ## Casting\n\nApart from the tricky problem of freeing memory in an organized\
    \ fashion and making sure that you don't try to use the memory after freeing it,\
    \ using the heap is easy.\n\nBut how do you turn the block of memory into something\
    \ useful?\n\nAll we have is a block of memory, a block of bits, but the repeating\
    \ message of using C is that everything is just a bit pattern. What tells the\
    \ compiler how to treat the bit pattern is its type. So all we have to do is cast\
    \ the pointer to the type we want to use. For example, if you want to allocate\
    \ an `int` on the heap you would use:\n\n```\nint *p = (int*) malloc(sizeof(int));\n\
    ```\n\nNow p points at the start of a block of memory, usually 4 bytes, and the\
    \ system will treat this as an int. That is you can write things like:\n\n```\n\
    *p = 42;\nint sum = *p + 42;\n```\n\nIn fact, as long as you remember to dereference\
    \ it, p behaves exactly like a standard `int` – you could almost tell a beginner\
    \ that *p was the variable name! There are of course differences and they are\
    \ important.\n\nThe first is that the lifetime of the variable, the block of heap\
    \ memory, is under your control. It exists from the moment the `malloc` is executed\
    \ until you explicitly call `free` to release the block. Notice that the lifetime\
    \ of the pointer that references the block follows the usual rules, which aren't\
    \ the same as for the lifetime of the block. If it is a file-level variable then\
    \ it lives for the entire program. If it is an auto variable then it lives for\
    \ the same time as the function it is declared in. What this means is that a block\
    \ of heap memory can become orphaned with no pointers referencing it. Consider\
    \ the following function:\n\n```\nvoid leak(){\n    int *p= (int*) malloc(sizeof(int));\n\
    };\n```\n\nCalling this function allocates a small block of heap memory, but when\
    \ it terminates the pointer is destroyed and the block has no references to it.\
    \ This is a memory leak as the block can never be freed as the program has no\
    \ references to it. Many other languages implement garbage collection algorithms\
    \ that look for blocks of memory that have been orphaned to automatically free\
    \ them. This is a very time-consuming thing to do and not foolproof.\n\nThe C\
    \ language prefers to let you manage the freeing of heap memory – you are C's\
    \ garbage collector."
