  md: "This idea raises the issue of what to do when a function is a procedure? Functions\
    \ always return a result. Functions that don't return a result are more properly\
    \ called \"procedures\" or \"subroutines\". Other languages sometimes provide\
    \ different syntax for a function, which returns a result, and procedures, which\
    \ don't. In the case of C, and many modern languages, we simply have functions\
    \ and we need a way to show that no result is returned. If you think about:\n\n\
    ```\nint sum(int a, int b){...\n```\n\nas being a contract that sum will return\
    \ something, which in this case is an int then you might think that a function\
    \ that didn't return anything broke its contract to be a function, i.e. the contract\
    \ was null and void. Well that's my theory and it helps to see why void might\
    \ be appropriate.\n\n# Void In C\n\nWe now appreciate the idea of\n\n```\nvoid\
    \ sum(int a, int b){...\n```\n\ndeclaring a function that doesn't return a result\
    \ – indeed that must not return a result. If sum did return a result then you\
    \ would see a compile error something like:\n\n```\n'void' function returning\
    \ a value\n```\n\nNotice that in C you can choose to ignore any return value.\
    \ What happens is that the value that is returned on the stack is simply thrown\
    \ away. For example in:\n\n```\nint sum(int a, int b){\n    return a+b;\n}\nsum(1,2);\n\
    ```\n\nyou are throwing away the result and you won't even see a warning in most\
    \ cases as this is perfectly valid C. Contrast this with a function that returns\
    \ void which has to be called in this way.\n\nYou might be familiar with void\
    \ being used to turn functions into procedures, but what about functions that\
    \ don't accept parameters? It is common to see:\n\n```\nint sum(){\n    return\
    \ 1+2;\n}\nprintf(\"%d\\n\",sum());\n```\n\nbut this is mostly wrong. It doesn't\
    \ declare a function with no parameters. It declares a function with a fixed,\
    \ but unknown, number of parameters."
