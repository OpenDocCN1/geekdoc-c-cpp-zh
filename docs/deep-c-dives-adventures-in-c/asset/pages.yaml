- pgno: 3
  md: '# # Preface


    C is a great language with a long past and probably a long future. The reason
    for this is that it occupies a unique niche in the ecosystem of languages. It
    is about as low as you can go without actually bumping into assembler. If you
    want to work with the machine that lies beneath all of the abstractions applied
    in other languages, C is the one to choose. The only problem is that most books
    and articles on the subject of C are written by programmers who would really rather
    be writing in one of those other languages. As a result you get a view of C that
    compares it unfavorably with modern, high-level, languages. There are exceptions,
    notably Harry Fairhead’s two books on how to understand and use C on its own terms.
    Rather than a follow-on from Harry’s work, this book can be regarded as a companion,
    an in-depth exploration of the essence of C and a statement of its distinctive
    traits.


    To emphasize the way in which chapters of this book focus on specific topics,
    they are referred to as “dives”, something that also implies a deep examination
    of the subject. Hopefully in each you will encounter some things that you already
    know but will come to see them differently. You will also read things that take
    you into the lesser-understood areas of the C language, which only make sense
    when you view C as a machine-independent assembly language. This is a good way
    to find out more about how the machine works and influences the way things are
    implemented. Other languages introduce abstractions to cover such inner workings
    and while this is usually a really good idea it isn’t so much if your intent is
    to understand the machine or make use of the machine’s hardware.


    To view C in this way requires a complete shift in the way you view data. As languages
    have developed they have increasingly added more sophisticated data structures.
    These allow you to use data structures without worrying about how they might be
    implemented or how different ways of using them might influence efficiency. When
    you program in C any sophisticated data structures are down to you to implement
    and to do this you need to understand the basic data types that C provides.


    For C the most important idea regarding data is that everything is a bit pattern
    and it is up to you how to interpret it. The options are wide ranging – a set
    of switch positions, positive integers, logical states, signed integers, text,
    hardware control lines, etc. This isn’t a viewpoint endorsed by users of high-level
    languages who tend to see C as lacking the facilities to do a complete job.'
  merge: -1
  img_proc: true
- pgno: 4
  md: 'What all this amounts to is that you can treat C as if it was a not quite up
    to the mark version of Java or Python or whatever high-level language you care
    to use, the result of which would be a deep disappointment in C. On the other
    hand, if you treat C as a language to solve the sort of problems it was designed
    to solve and stop comparing it to high-level languages then the result is not
    only efficiency but also elegance.


    If you know some C, read on to find out what more you need to know to see it as
    its creators intended it to be. This reveals that it has a very special place
    among the programming languages of today as a powerful and versatile option for
    low-level programming.


    Thanks to my tireless editors Sue Gee and Kay Ewbank. Programming is the art of
    great precision, but English doesn''t come with a built-in linter. Errors that
    remain, and I hope they are few, are mine.


    You can contact me at mike.james@i-programmer.info


    Mike James

    June, 2024'
