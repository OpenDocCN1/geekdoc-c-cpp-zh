- pgno: 77
  md: "Notice that you cannot have a pointer to a bit field, but you can have a pointer\
    \ to the struct that has the bit fields. This is often useful when you want to\
    \ map a bit field to a hardware port or register.\nBit fields seem like a great\
    \ idea, but their big disadvantage is that different compilers implement bit fields\
    \ in different ways. For these reasons many programmers recommend avoiding the\
    \ use of bit fields and implementing the bit operations using logic.\n\n# Some\
    \ Examples\n\n# Count the Bits\n\nBit manipulation has a fascination that will\
    \ keep many a programmer occupied for hours when they could be doing something\
    \ more useful. To see why it is addictive, consider the following simple problem\
    \ – count the number of bits set to one in a bit pattern. The direct way of doing\
    \ the job is to use shifting and test each bit that is shifted out.\n\n```\n```\n\
    unsigned value = 0x55;\nint count = 0;\nfor(int i = 0;i < 16;i++){\n    if(value\
    \ & 0x01) count++;\n    value >>= 1;\n}\n```\n```\n\nSimple and direct, but not\
    \ the only way. The best known solution is due to Brian Kernighan:\n\n```\n```\n\
    unsigned value = 0x55;\nint count = 0;\nwhile(value){\n    value &= value-1;\n\
    \    count++;\n}\n```\n```\n\nWhy does this works?\nThe reason it counts the one\
    \ bits can be understood by working out what happens the first time through the\
    \ loop. If `value` ends in a `1` subtracting one removes it, e.g `101 - 1 = 100`\
    \ ANDED with the original gives `100`. If `value` ends in a `0` then subtracting\
    \ one has to borrow from higher-order bits. In fact, it borrows from the first\
    \ high-order bit that is a `1`. For example, `100 - 1` has to borrow from the\
    \ third bit in the pattern and the result is `011`, which when ANDED with the\
    \ `100` gives `000` and the loop ends.\nYou can see that each time the subtraction\
    \ causes a borrow from the first `1` bit to the right and this removes it from\
    \ `value` and the AND removes the lower-order bits that result from the subtraction\
    \ – hence the loop repeats the number of times that there are one bits in the\
    \ bit pattern."
  merge: -1
  img_proc: true
- pgno: 78
  md: "If you don't follow, try it out for other bit patterns and marvel that anyone\
    \ noticed that this works in general and provides a way to count bits. This is\
    \ very typical of creative bit manipulation.\n\n# ## Largest Power of 2 that Divides\n\
    \nSometimes you need to know the largest power of 2 that can divide a value. This\
    \ is simply the number of zeros before the first one in the binary representation.\
    \ For example, 112 in decimal is 1110000 in binary and hence $2^4$ = 16 is the\
    \ largest power of 2 that divides it and $16\\times7$ = 112. Also notice that\
    \ 16 in decimal is 0010000 in binary. That is the power of two we want to find\
    \ is just the binary number with a single one in the position of the first one\
    \ in the original value i.e. 1110000 $\\rightarrow$ 0010000.\n\nYou might notice\
    \ that this is very similar to the counting the number of ones in a value only\
    \ now we want to count the number of zeros before the first one. A similar technique\
    \ to the Keringhaus bit counting method will work.\n\nIf we first find the one's\
    \ complement, see Bit 2, of the value, that is ~value we now have a value that\
    \ has ones where the original had zeros. Add one to this to form ~value+1 and\
    \ the carry will ripple through all of the one bits until it reaches the first\
    \ zero which it converts into a one.\n\nFor example:\n\n~0111 0000 + 1 = 1000\
    \ 1111 + 1 = 1001 0000\n\nIf we now AND the original value with the result value\
    \ & (~value+1) we get the largest power of 2 that divides value.\n\n1001 0000\
    \ & 0111 0000 = 0001 0000\n\nWe can simplify this expression as (~value+1) is\
    \ just the two's complement of value which is of course just -value for a signed\
    \ type. So we have:\n\nlargest power of 2 that divides value is value & -value.\n\
    \n# ## Parity\n\nParity is 1 if the number of 1 bits is odd and 0 if it is even.\
    \ There are direct methods of computing parity, but a modification of the bit\
    \ counting trick gives a good method:\n\n```\n```c\nunsigned int value = 4;\n\
    unsigned int parity = 1;\nwhile (value)\n{\n parity = !parity;\n value = value\
    \ & (value - 1);\n}\n```\n```\n\nIf you follow the bit counting example this should\
    \ be obvious."
  merge: -1
  img_proc: true
- pgno: 79
  md: '# Swapping Values


    Usually, if you want to swap two values, you need a third variable to hold the
    result while the swap occurs:


    ```

    int temp = a;

    a = b;

    b = temp;

    ```


    You can swap without a third variable using XOR:


    ```

    a = a^b;

    b = b^a;

    a = a^b;

    ```


    If you try it out you will find that a and b have swapped values. Seeing why it
    works takes a little longer!


    # Overflow-Free Average


    Consider finding the average of two integers. The simple straightforward way of
    doing the job is:


    ```

    int average = (a+b)/2;

    ```


    This has one problem – a+b can overflow even if the answer is representable in
    the number of bits available. At first it looks as if nothing can be done, but
    if a result can be represented then there is usually a bit-manipulation way of
    computing it without the threat of overflow.


    In this case we need to notice that addition is a simple logical operation. If
    you add the two values, a and b together then the sum bits are:


    ```

    a ^ b

    ```


    and the carry bits are:


    ```

    a & b

    ```


    this is how a half-adder is implemented.


    For example:



    | a | 1 | 0 | 1 |

    | b | 0 | 1 | 1 |

    | sum | 1 | 1 | 0 |

    | carry | 0 | 0 | 1 |'
  merge: -1
