  md: "For example, 2+3 evaluates to 5 and the plus operator + combines the 2 and\
    \ the 3 by addition.\n\nSo far so good, but what about an expression like:\n2+3×4\n\
    What does it mean?\n\nWe could interpret it as 2+3 gives 5 and then 5×4 is 20.\
    \ This left-to-right implementation of the expression is perfectly valid, even\
    \ if it is judged wrong by today's mathematical conventions in which multiplication\
    \ has a higher priority than addition.\n\nThe correct implementation is to do\
    \ the multiplication first i.e. 3×4 gives 12 and 2+12 gives the right result,\
    \ 14 not 20. In the unlikely event that you are unsure about this you need to\
    \ check up your arithmetic skills, not programming, as this comes from elementary\
    \ math not the C language.\n\nNotice that traditional mathematical notation is\
    \ sophisticated in that it demands operations to be performed not in the order\
    \ they are written.\n\nThis is what made it such a huge task initially to implement\
    \ expressions in Fortran and what makes it difficult for beginners to learn how\
    \ to work out even slightly complex arithmetic.\n\nTo make it easier for humans\
    \ we invent mnemonics such as BODMAS – Brackets, Orders, Division/Multiplication,\
    \ Addition/Subtraction, to give the priorities of the operations. Notice that\
    \ brackets are always the highest priority – you have to evaluate all brackets\
    \ before doing anything else. What this means is that even if you don't know the\
    \ priorities of operators you can always force the order using brackets.\n\nFor\
    \ example, \n2+(3×4)\nis the default order\nand\n(2+3)×4\nis the left-to-right\
    \ alternative order.\n\nYou don't have to know why we write arithmetic in this\
    \ way to make use of it but once you have noticed the way it works you can't help\
    \ but wonder why?\n\nThe answer is the distributive law.\nConsider an expression\
    \ like:\n3×2+3×4 = 6 + 12 = 18\nthis gives the same result as:\n3×(2+4) = 3×6\
    \ = 18"
