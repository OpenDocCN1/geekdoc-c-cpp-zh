- pgno: 56
  md: 'The second condition also makes expressions such as:

    `array[i]=i++;`

    undefined as, even though `i` is only modified once, its original value is used
    to determine where the result is stored and not just what the result is.


    Many programmers find the C sequence rules difficult to understand and apply,
    but this really isn''t the problem. If your code causes you to contemplate the
    role of a sequence point or the conditions that apply then you are probably writing
    expressions that should not be written.


    # ## Auto Promotion


    In an ideal world you would choose the types in an expression and expect the expression
    to be evaluated using them in the most efficient way possible. However, hardware
    isn''t sufficiently flexible to make this a realistic possibility. In all cases
    hardware has a favorite type to work with. The key factor is the width of registers
    in the ALU, Arithmetic Logic Unit. Even 64-bit computers tend to process 32-bit
    data more easily than 64-bit values. Being 64-bit is more about supporting 64-bit
    addressing than 64-bit data.


    In general, `int` is the type that should be the best for arithmetic operations
    on any given machine. On most modern machines it is 32 bits, but it''s not that
    long ago that 16 bits was the norm.


    What happens when you want to work with two data types that are smaller than `int`?
    To make things more efficient, they are auto-promoted to `int` following the usual
    casting rule – i.e. unsigned types are zero-extended and signed types are sign-extended.
    For example:


    ```

    ```c

    unsigned char myChar = 255;

    int myInt;

    myInt = myChar*255;

    printf("%d",myInt);

    ```

    ```


    In this case the result 65025 is printed because, although the arithmetic should
    overflow, both the values are converted to `int` before the calculation is performed.
    The expression is evaluated as if it was:

    `myInt = ( int ) myChar* ( int ) 255;`


    If there are types "larger" than `int` then casts are implicitly performed to
    promote everything to the largest size involved in the expression. The order is:

    `int < long<  long long < float < double < long double`

    and the unsigned types have the same rank as the corresponding signed type.


    56'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'The rules, known as "the usual arithmetic conversions" seem complicated. The
    C99 standard says:


    +   1.  *If both operands have the same type, then no further conversion is needed.*


    +   2.  *Otherwise, if both operands have signed integer types or both have unsigned
    integer types, the operand with the type of lesser integer conversion rank is
    converted to the type of the operand with greater rank.*


    +   3.  *Otherwise, if the operand that has unsigned integer type has rank greater
    or equal to the rank of the type of the other operand, then the operand with signed
    integer type is converted to the type of the operand with unsigned integer type.*


    +   4.  *Otherwise, if the type of the operand with signed integer type can represent
    all of the values of the type of the operand with unsigned integer type, then
    the operand with unsigned integer type is converted to the type of the operand
    with signed integer type.*


    +   5.  *Otherwise, both operands are converted to the unsigned integer type corresponding
    to the type of the operand with signed integer type.*


    The most worrying part of this specification is point 3 as converting a signed
    integer to an unsigned of the same rank seems to invalidate the arithmetic. You
    have to remember that two''s-complement arithmetic works even if you consider
    the value to be unsigned.


    For example:


    ```

    ```c

    unsigned int myUnsigned = 1;

    int myInt= = -1;

    myInt = myInt+myUnsigned;

    printf("%d \n",myInt);

    ```

    ```


    In this case the signed int is converted to unsigned and it looks as though we
    are going to get the answer 2 as the negative is lost. This is not how it works.
    The signed int is converted to an unsigned int with the same bit pattern. When
    added together, the rollover occurs and the result is the same in two''s-complement.
    That is, it prints 0 and we have the correct answer.


    This doesn''t mean that you cannot get the wrong answer. For example:


    ```

    ```c

    unsigned int myUnsigned=UINT_MAX;

    int myInt=1;

    myInt=myInt+myUnsigned;

    printf("%d \n",myInt);

    ```

    ```


    In this case you will still see zero printed, which in this case is probably the
    wrong answer. Again we have the same bit patterns. The UINT_MAX is -1 when regarded
    as a signed int and hence the final result is zero.'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'To get the correct answer we need to explicitly use a cast to `long long`:

    unsigned int myUnsigned = UINT_MAX;

    int myInt = 1;

    long long mylong = (long long)myInt+(long long)myUnsigned;

    printf("%lld \n",mylong);


    In fact, we don''t need to cast myInt to `long long` because the rules will promote
    it to the same type as myUnsigned.


    Notice that these casts are only performed in expressions, including comparison
    operators, and bitwise operators. They are not performed for assignment operators.
    In most cases the result of expressions involving mixed types give you the correct
    answer but if in doubt use explicit casts.


    A common idiom, however, is to rely on the rules to change integer arithmetic
    into floating-point arithmetic. For example:

    int myInt=1;

    float ans=myInt/100;


    gives the answer 0 as integer division is performed before the result is converted
    to a `float`. However:

    int myInt=1;

    float ans=myInt/100.0;


    gives the result 0.01 as the literal is now a `float` and hence myInt is automatically
    converted to a `float`.


    # Some Oddities


    The whole idea of an expression is so obvious that you almost certainly don''t
    need a conducted tour of all of C''s operators and how they interact. However,
    there are a few strange and almost unlikely things that you might not have noticed.
    None of them have the advantage of clarity of purpose, but you will encounter
    them in other people''s code.


    # Assignment is an operator


    When you write `a=b` this is an expression just like `a+b` and the result is the
    value stored in `b` or the value of the expression on the right hand side. That
    is, `a=b` takes `a` and `b` and produces the result `b`. As a side effect it also
    sets `a` to the value stored in `b`, which is what you usually assume assignment
    to do! Notice that this implies that `a` cannot be an expression in its own right.


    What advantage would this have?


    The most obvious is that you can use it to set more than one variable:

    a = b = c = 2*2;

    which sets `a`, `b` and `c` to 4.


    58'
  merge: -1
  img_proc: true
