- pgno: 186
  md: 'Most other undefined behaviors are treated in a similar way and as long as
    you write a good program that protects itself against the obvious, nasal demons
    will ignore you. For example, undefined behavior that falls into this category
    includes:


    +   - Accessing array outside of bounds

    - Modifying a string literal

    - Dereferencing/accessing a null pointer

    - Changing a variable twice between sequence points

    - Shifting by negative amounts

    - Accessing uninitialized data


    These and many others are very reasonable and easy-to-deal with, but some are
    more problematic, signed overflow and strict aliasing being the most important.


    # # Divide By Zero and Undefined Behavior


    It is worth explaining the crazy position of divide by zero in C99:


    > C99 6.5.5p5 - The result of the / operator is the quotient from the division
    of the first operand by the second; the result of the % operator is the remainder.
    In both operations, if the value of the second operand is zero, the behavior is
    undefined.


    If you need a clear demonstration that undefined behavior is completely mad and
    unacceptable, this is it.


    You will find some programmers arguing that x/0 is infinity because x/y with x
    and y positive gets bigger as y trends to 0. This is true, but mathematicians
    define x/y as undefined if y equals 0. The reason is that the operation makes
    no logical sense. For example: x.0 = 0 doesn''t have a unique solution and 0 is
    the only number that doesn''t have a multiplicative inverse.


    So it looks as if deciding that division by zero is undefined is justified – but
    that would be wrong. The idea that encountering y/0 is a permission to do anything
    the compiler writer can think of is nonsense. A program that includes y/0 may
    be an incorrect program, but the correct behavior is to indicate that the operation
    is illegal. The program has to report the error or throw an exception or at the
    most general perform some action which is machine dependent.


    Division by zero is a runtime error not undefined behavior.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# # Signed Overflow


    Even though the C23 standard defines signed integers as using two''s complement,
    it still defines signed overflow as undefined, even though it is fully defined
    by any reasonable interpretation of machine arithmetic using two''s complement.


    As already explained in Dive 1, signed overflow is well-defined in terms of bits,
    but not so much in terms of what it means. Signed overflow results in going from
    the largest positive value to the largest negative value by adding one. It breaks
    the laws of arithmetic as this is an example of where a + 1 < a, but is this enough
    to declare that it is undefined behavior? Treating signed overflow as undefined
    behavior is also an example that demonstrates the reason why making it undefined
    provides opportunities for optimization that otherwise would be difficult.


    Consider the following:


    ```

    int a = INT_MAX;

    if ((a + 1) < a)

    printf("Integer overflow!");

    ```


    This simply adds one to the maximum positive integer and hence forces an overflow,
    but you will never see the error message printed. The simple reason is that, as
    signed overflow is undefined behavior, no program conforming to the standard can
    exhibit it and so, by the laws of arithmetic, a + 1 is always bigger than a and
    so the whole if statement can be removed as dead code! This undoubtedly would
    make the program run faster, but if the if statement was intended to actually
    test for an overflow then it would also make the program incorrect. For example:


    ```

    if ((a + 1) < a)

    printf("Integer overflow!");

    else

    printf("%d",a+1);

    ```


    This program never catches the overflow error because the if statement is modified
    so that the else clause is always obeyed. Of course, "nasal demons" means that
    anything could happen, but in practice the undefined behavior isn''t used to punish
    the programmer – it is used to "optimize" the program. Notice that this optimization
    causes the very error condition, i.e. signed overflow, that the undefined behavior
    and the program was supposed to prevent. In this case "nasal demons" would be
    a better choice than simply deleting the test for overflow as it might alert you
    to the condition. So how do you detect signed overflow?


    The whole problem is that you have to detect it without causing it and this isn''t
    simple for a general signed integer expression.'
  merge: -1
  img_proc: true
- pgno: 188
  md: "For example, how do you check that:\nb*c + a*d\ndoesn’t cause a rollover before\
    \ you compute it? It is very difficult because you have to check that each stage\
    \ in the calculation doesn’t cause an overflow.\n\nThere are also compiler extensions\
    \ to make such tests easier. For example, GCC has the `_builtin_operation_overflow`\
    \ functions for operations of add, sub and mul for different integer types. The\
    \ function avoids signed overflow by performing infinite precision arithmetic\
    \ and then checks to see if the result can be stored in the third parameter without\
    \ loss of bits. If it can’t, overflow would occur if the calculation was done\
    \ in the specified type and the function returns true. Using these functions is\
    \ not easy and they are compiler-specific.\n\nYou can also ask GCC to generate\
    \ a SIGABRT signal when signed overflow occurs by using the -ftrapv option:\n\n\
    ```\n#include <signal.h>\n#include <stdio.h>\n#include <limits.h>\n\nvoid signalHandler(int\
    \ sig) {\n  printf(\"Overflow detected\\n\");\n}\n\nint main(int argc, char **argv)\n\
    {\n  signal(SIGABRT, &signalHandler);\n  int a=INT_MAX;\n  int b=a+1;\n```\n\n\
    As long as this is compiled with the -ftrapv option on GCC, then the overflow\
    \ will be detected and you will see the overflow message.\n\nAnother solution\
    \ is to avoid the problems of signed arithmetic and rollover by performing the\
    \ exactly identical unsigned arithmetic. Remember that the only difference between\
    \ signed and unsigned is how you interpret the bits. That is, if you have a set\
    \ of signed variables and you cast them all to unsigned, perform the calculation\
    \ and cast the result to signed, you will have the same result as if you had performed\
    \ the signed calculation. The only scope for a problem here is when you cast back\
    \ to signed the compiler could decide that assigning a positive value larger than\
    \ INT_MAX to a signed variable is overflow – no reasonable compiler does this."
