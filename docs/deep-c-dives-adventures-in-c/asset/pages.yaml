- pgno: 175
  md: "# # Dive 15\n\n# # The Union\n\n> \"*Form follows function - that has been\
    \ misunderstood. Form and function should be one, joined in a spiritual union.*\"\
    \n\nFrank Lloyd Wright\n\nThe union is a special type of struct that is more or\
    \ less dedicated to the idea of type punning. Its very existence in the C language\
    \ is a strong indication that type punning is not an accidental feature.\n\n#\
    \ ## Union Basics\n\nA union is declared in the same way as a struct, but memory\
    \ is only allocated for the largest of the union's fields. That is, all of the\
    \ fields of a union share the same memory. This sounds like a crazy thing to do\
    \ until you notice that it gives you a way of working with the same bit pattern\
    \ with different interpretations. You can treat the same area of memory as different\
    \ types simply by using the appropriate field name. That is, using unions allows\
    \ you to do reasonably well-defined type punning in C.\n\nThe syntax for a union\
    \ is the same as for a struct, but you replace struct with union. For example:\n\
    \n```\n```\nunion {\n    int I;\n    float F;\n} myUnion;\n```\n```\n\nThis allocates\
    \ four bytes – assuming sizeof(int) and sizeof(float) are both 4 – that can be\
    \ used to store an int or a float. Which is stored depends on the field name used\
    \ to access the union, I or F.\n\nNow you can store an int in the union using:\n\
    \n```\nmyUnion.I = 42;\n```\n\nor a float using:\n\n```\nmyUnion.F = 42.0;\n```\n\
    \nIn the first case, the bit pattern that represents 42 is stored in the four\
    \ bytes and in the second, the bit pattern that represents 42.0 is stored in the\
    \ same four bytes. Of course, there is nothing stopping you from storing an int\
    \ and reading back a float, or vice versa. This is how the type punning occurs\
    \ when you use a union."
  merge: -1
  img_proc: true
- pgno: 176
  md: 'In principle, you can pun any types, but there is a rule in C, but not C++,
    that it is legal to read a union member as long as it is not larger than the member
    most recently written. This is a perfectly reasonable restriction, but even so
    I can invent, admittedly unlikely, examples of reading a larger type when a smaller
    type has just been written, but they are all very machine-dependent. This means
    that, in most cases, you can use union type punning to avoid the compiler warning
    messages and potential undefined behavior.


    As with structs and type punning, you have to take padding into account. To revisit
    the example in the previous chapter:


    ```

    ```

    struct test1 {

    char c;

    int i;

    };


    struct test2{

    char c[4];

    char i[4];

    };


    union {

    struct test1 myStruct1;

    struct test2 myStruct2;

    } myUnion;

    ```

    ```


    In this case, for a 64-bit machine, struct test1 is padded so that int i is on
    a word boundary and this means there are three padding bytes between c and i.
    What this means is that union of the two structs, myUnion, has struct test1.c
    in struct test2.c[0] and struct test1.i in struct test2.i[0] to struct test2.i[3].


    # ## Color


    For a more realistic example of a union, consider the way most graphics hardware
    stores an ARGB (Alpha, Red, Green, Blue) value in a 32-bit unsigned int. If you
    want to access each of these bytes, and also treat all four bytes as a single
    value, then the best way is to define a union:


    ```

    ```

    union Pixel{

    struct {unsigned char b,g,r,a};

    uint32_t value;

    };

    ```

    ```


    The only complication is that the order has to be changed to allow for the way
    x86 stores multiple bytes in a 32-bit word. Notice the order is machine-dependent
    and for Intel and Arm processors corresponds to "little endian". You can see that
    the union is of a struct with four byte fields and a single 32-bit word. The four
    byte fields share the same memory block as the 32-bit word and on 64-bit machines
    no padding is needed.'
  merge: -1
  img_proc: true
- pgno: 177
  md: "Now you can declare a pixel and use it as follows:\n```c\nunion Pixel pixel;\n\
    pixel.r=1;\npixel.g=255;\npixel.b=128;\npixel.a=255;\nprintf(\"%d\\n\",pixel.value);\n\
    ```\nYou can see that how you access the union depends on the fields that you\
    \ specify. If you specify `pixel.r` then you simply work with the first byte of\
    \ the memory block. If you specify `pixel.value` you work with all four bytes\
    \ as a single int. There’s no need to cast, simply use the fields that make up\
    \ the union and you access the memory according to the type.\nThe type punning\
    \ version of the pixel union is:\n```c\nstruct Pixel{\n    unsigned char b,g,r,a;\n\
    };\nstruct Pixel pixel\npixel.r=1;\npixel.g=255;\npixel.b=128;\npixel.a=255;\n\
    printf(\"%d\\n\",(uint32_t)pixel);\n```\nA union can often be used in place of\
    \ type punning, but it often requires a little more pre-planning to alias the\
    \ fields of a suitable union. It is more difficult to use a union to extend structs\
    \ as shown earlier because of the way a union changes the way fields are named.\n\
    \n# Type Punning Unions\n\nIt is a little-used fact that you can cast a union\
    \ to a struct or to anything else for that matter. Why not? After all, a union\
    \ is just a block of memory associated with a number of different types. The block\
    \ of memory is big enough to hold the largest of the types taking into account\
    \ any padding that is needed. As a block of memory you can cast it to whatever\
    \ you want to – but it might not make much sense.\nFor example:\n```c\nunion Pixel{\n\
    \    struct {unsigned char b,g,r,a;};\n    int value;\n};\nunion Pixel pixel={1,255,128,255};\n\
    \nchar (*color)[4];\ncolor=(char *) &pixel;\n```\n```c"
  merge: -1
  img_proc: true
- pgno: 178
  md: "Assuming a four-byte int, the memory block is four bytes in size and we can\
    \ alias it to an array using an array pointer, color. Aliasing a union obeys the\
    \ same rules as aliasing a struct and if you try this example out you will find\
    \ that GCG give a warning that you are aliasing an incompatible type – the result\
    \ is undefined behavior, which is a shame because it makes perfect sense, see\
    \ Dive 16 for more information.\n\n# ## When Unions Don't Hack It\n\nThis said,\
    \ unions aren't always suitable alternatives to casting. For example, if you are\
    \ trying to implement an object-oriented approach to C, then aliasing a base class\
    \ with its derived class is much more natural to do with a cast than a union.\
    \ In fact you could argue that casting is the only way to do this job.\n\nConsider\
    \ the example given in Dive 14:\n\n```\n```\nstruct myStruct{\n  int a;\n  int\
    \ b;\n};\nvoid myFunction(struct myStruct *myPointer){\n  printf(\"%d\\n\", myPointer->a);\n\
    \  printf(\"%d\\n\", myPointer->b);\n}\n```\n\n```\n\nIf we decide to extend the\
    \ struct in the future to something larger:\n\n```\n```\nstruct myStructEx{\n\
    \  int a;\n  int b;\n  int c;\n}\n```\n\n```\n\nthen we can still use the original\
    \ function by casting myStructEx to myStruct, as they agree about the types of\
    \ the first part of each struct:\n\n```\n`myFunction((struct myStruct *) myPointer);`\n\
    ```\n\nwhere myPointer is now a pointer to myStructEx.\n\nNow consider how this\
    \ might be implemented using a union. You would first have to create a union of\
    \ both structs:\n\n```\n```\nunion myUnion{\n  struct myStruct{\n    int a;\n\
    \    int b;\n  };\n  struct myStructEx{\n    int a;\n    int b;\n    int c;\n\
    \  };\n};\n```\n\n```"
  merge: -1
