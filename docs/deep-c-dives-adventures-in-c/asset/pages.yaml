- pgno: 123
  md: '# ## Pointer to Array


    There is a subtle difference in C between a pointer to a type and a pointer to
    an array of the type. In the first case the pointer references the type and pointer
    arithmetic moves the reference on by the size of the type. This makes the pointer
    suitable for the implementation of an array of the type.


    Compare this to the idea of a pointer to an array of the type. This was introduced
    in C89. It is the array of the type that is the fundamental element that the pointer
    references. If you now add one to the pointer, then it moves on, not by the size
    of the type, but the size of the array – as the array is the element.


    If you write:


    ```

    int *myPointer;

    ```


    then myPointer references an integer and adding 1 to it moves it on by the sizeof
    int. This makes it a way of implementing an array of int.


    ![](img/5f2ea21c2077d473344a0fdf144677b9_123_0.png)


    Compare this to:


    ```

    int (*myPointer) [5];

    ```


    which declares a pointer to an array, each element of which is an array of five
    ints.


    ![](img/5f2ea21c2077d473344a0fdf144677b9_123_1.png)


    It is a strange notation and probably would be better if it was written:


    ```

    int[5] *myPointer:

    ```


    but it isn’t. The type “pointer to array of five ints” is written int (*) [5]
    which is the form you would use in a cast.


    The difference is that now when you add 1 to myPointer it moves on by five times
    the size of int, i.e. 20. Notice that this is the array equivalent of creating
    a pointer to a struct and it clearly has something to do with multidimensional
    arrays, see later and Dive 11.'
