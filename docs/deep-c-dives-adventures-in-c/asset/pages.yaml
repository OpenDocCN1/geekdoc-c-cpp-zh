- pgno: 147
  md: "Notice that any function that matches the type in terms of the number and type\
    \ of its parameters and return type can be considered to be of that type. You\
    \ can even define multiple identical, but differently-named, types and they will\
    \ all be treated as the same.\n\nYou cannot use a raw function pointer to define\
    \ a function. That is you cannot write:\n\n```\nint (*myFunction)(int a,int b)\n\
    {\n    return a+b;\n}\n```\n\nYou have to define a function and then assign it\
    \ to the function pointer.\n\n# # Function Parameters and Return Types\n\nYou\
    \ can use a function pointer as a parameter in a function so that you can pass\
    \ a function into another function as an argument.\n\nFor example:\n\n```\nvoid\
    \ myFunction(int (*myFuncParm)(int,int)){\n    printf(\"%d\\n\",myFuncParm(1,2));\n\
    }\n```\n\nand again notice that the name of the parameter, `myFuncParm`, is not\
    \ at the end of the type specification.\n\nThis can be made much easier to read\
    \ with the help of a `typedef`:\n\n```\ntypedef int (*myFuncType) (int,int);\n\
    \nvoid myFunction(myFuncType myFunction){\n    printf(\"%d\\n\",myFunction(1,2));\n\
    }\n```\n\nDefining the type of the return as a function pointer is messy, but\
    \ it is rarely needed as C functions are not dynamic. That is, a function cannot\
    \ create a function and return it. What this means is that a function that returns\
    \ a function can only return a function that already exists and is in scope.\n\
    \nTo define the return type of a function as a function you have to supply the\
    \ type in front of the function definition as usual but in this case the type\
    \ includes the name of the function.\n\n```\nreturn type (*name of function(parameters1))\
    \ (parameters2)\n```\n\nwhere the function returned has type:\n\n```\nreturn type\
    \ (*)(parameters2);\n```\n\nand the function being defined is:\n\n```\nname of\
    \ function(parameters1)\n```"
