- pgno: 61
  md: 'but notice that the if statement has to use a variable to assign the result
    to, that is the if statement is not an expression. This means you can use a ternary
    operator anywhere you can use a simple value. For example: `printf("%d\n", (ans>0)
    ? ans : -ans);` which prints ans as a positive quantity even if it is negative.
    You obviously cannot include any statements in a ternary operator, i.e. no loops
    or conditionals, but this is not a real restriction as you can always define a
    function which includes statements and use that in the expression. Used carefully,
    the ternary operator can make the logic of a program easier to follow. Used too
    much and it renders the logic impossible to follow.


    # ## The !! Operation


    The way that C treats logical operations is slightly strange. Any zero value is
    considered as False and any non-zero value is considered as True. This is reasonable,
    but if you use any logic operators the result is always 0 or 1. For example:


    ```

    int c = 42 || 43;

    ```


    sets c to 1. In many languages that use the same loose definition of True and
    False, c would be set to 42 – still a representation of True. The difference is
    that C “normalizes” general values to 0 and 1 as the result of logical operations
    where other languages don’t. The 0/1 representation of False/True was formalized
    in C99 with the introduction of the Bool data type. The header stdbool.h also
    provides bool as a user-friendly alias for _Bool and the macros true and false.
    If you want to use true and false in earlier versions of C you can define your
    own type and constants:


    ```

    typedef int bool;

    #define TRUE 1

    #define FALSE 0

    ```


    Notice that logical expressions also use auto promotion. For example: 42 || 43;
    can be thought of as: (int)((int)42 || (int)43); Now we can examine the !!myVar
    operation. This is just the application of the NOT operator twice. The first time
    it negates the variable which produces 0 if myVar is non-zero and 1 if it is zero.
    The second application negates this result and so we have !!myVar is 0 if myVar
    is zero and 1 otherwise. In other words, !! normalizes the value to 0 or 1, i.e.
    false or true and sometimes this matters.'
