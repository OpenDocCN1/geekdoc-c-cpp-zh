- pgno: 158
  md: 'Now we are returning a pointer to the struct, we are returning it by reference.
    If you try to make use of this:


    ```

    myStructType *myReturnStruct = myFunction();

    ```


    then we have a pointer to a struct that was created on the stack as a local variable
    and this now no longer exists as the function has exited. The result is usually
    a runtime error, but it may be slow in coming as the memory might be valid for
    some time.


    The key principle is:


    +   Never return a pointer to a local variable.


    Most compilers will warn you if you try to do this, but beginners often misunderstand
    that warning because everything seems to work – at least for a while.


    # Functions and Big Data


    If you can''t return a pointer to a local variable and passing by value isn''t
    efficient, how should a C function return a large data structure? There are two
    broad approaches – import it or export it.


    The “import it” approach relies on the calling function to provide the data structure.
    For example:


    ```

    void myFunction(int *array, int N){

    for(int i=0;i<N;i++){

    array[i]=i;

    }

    }

    ```


    ```

    int *myArray = (int*) malloc(sizeof(int)*10);

    myFunction(myArray,10);

    ```


    myFunction needs an array to work and the calling program provides this.


    The disadvantage of this method is that the calling program has to know the size
    of data structure needed – how is it to know that **N = 10** is appropriate if
    the array is being used as a buffer for data read in from the outside world? The
    huge advantage is that the calling program is responsible, and knows very clearly
    that it is responsible, for disposing of the memory allocated. If the data structure
    is an auto then this happens without any effort. If the data structure is allocated
    on the heap then it has to be freed when finished with.'
  merge: -1
  img_proc: true
- pgno: 159
  md: "The “export it” approach leaves the function to create the data structure and\
    \ return a pointer to it:\n\n```\nint *myFunction(void){\n   int *myArray = (int*)\
    \ malloc(sizeof(int)*10);\n   for(int i=0;i<10;i++){\n      myArray[i]=i;\n  \
    \ }\n   return myArray;\n}\nint *myArray = myFunction();\n```\n\nThe advantage\
    \ is that the function can decide how big a data structure is needed, but it has\
    \ to pass this back to the calling function. The disadvantage is that the user\
    \ of the function may not have any idea that it is responsible for freeing the\
    \ data structure. It might even be that the function returns the same data structure\
    \ on each call leaving multiple callees jointly responsible for the lifetime of\
    \ the structure. In most cases the best alternative is to provide a management\
    \ function to complement myFunction which will dispose of the structure and that\
    \ can be called multiple times without causing an error.\n\n# Returning More Than\
    \ One Result\n\nA C function can only return a single value and this can be a\
    \ problem. If you need to return multiple values, a single value return may not\
    \ seem up to the task – it is but it isn’t obvious.\n\nA very common approach\
    \ to the problem is to use parameters to return results. We have already seen\
    \ that passing a pointer is effectively pass by reference and as such the function\
    \ can change values in the calling program. Consider a function that needs to\
    \ return a max and a min value. We could implement this as a function with two\
    \ pointer parameters:\n\n```\nvoid maxmin(int *max, int *min){\n   *max = 100;\n\
    \   *min = 0;\n}\nint mymax;\nint mymin;\nmaxmin(&mymax,&mymin);\n```\n\nAs always,\
    \ the problem is to remember to pass in the address of the variables being used\
    \ for the results. Usually such functions are organized so that the “in” parameters\
    \ are listed before any “out” parameters."
  merge: -1
  img_proc: true
- pgno: 160
  md: "An alternative, and arguably a better way is to use a struct to package any\
    \ results:\n\n```\ntypedef struct {\n    int max;\n    int min;\n}tuple;\n\ntuple\
    \ maxmin2(void){\n    tuple result;\n    result.max=100;\n    result.min=0;\n\
    \    return result;\n}\n...\ntuple result2=maxmin2();\n```\n\nThe disadvantage\
    \ of this approach is that you have to declare a struct suitable for returning\
    \ the results and this is often difficult from the point of view of scope and\
    \ finding a reasonable name for it. The advantage is that the results are returned\
    \ as they should be by a return statement which makes the function easier to understand.\n\
    \nIn practice you will encounter the use of “out” parameters more often than structs.\
    \ The reason is probably that “out” parameters can be introduced in an ad-hoc\
    \ manner whereas using structs requires some forethought and planning.\n\n# Inline\
    \ Functions\n\nFunctions are the best way to organize your program – a function\
    \ for every identifiable task. Some programmers worry that having so many functions\
    \ is inefficient. The overhead is the time taken to call the function and the\
    \ time for the return. In practice, this overhead is usually well worth the improvement\
    \ in program maintainability. However, sometimes a function does so little that\
    \ it seems that it might be better to code it each time it is needed. Inline functions\
    \ give you the best of both worlds, but they were only introduced in C99.\n\n\
    Any function that is marked as inline has its call expanded as if its body had\
    \ been written in place of the call. However, things aren’t quite as simple as\
    \ this."
  merge: -1
  img_proc: true
- pgno: 161
  md: "The inline qualifier is only a hint to the compiler to inline the function.\
    \ If the compiler decides not to then you will get an error from the linker as\
    \ there is no non-inline version of the function defined. To avoid this you can\
    \ mark a function as static. For example:\n\n```\n```\nstatic inline int add(int\
    \ a, int b){\n    return a+b;\n}\nint main(int argc, char** argv) {\n    int c=\
    \ add(2,3);\n    printf(\"%d \\n\", c);\n    return (EXIT_SUCCESS);\n}\n```\n\
    ```\n\nIt is usually said that you don't need to use inline with modern compilers\
    \ as they will optimize your code without the help of your suggestions.\n\n# ##\
    \ C Functions Considered\n\nAs already repeatedly mentioned, C functions are fast,\
    \ efficient and simple and for a low-level language this is exactly what you need.\
    \ But this simplicity means that there are features that a programmer familiar\
    \ with other languages may find lacking.\n\nC functions are static in the sense\
    \ that they have to be fully defined at compile time and they cannot be changed\
    \ without the use of clever, platform-dependent tricks. The name of a function\
    \ is a pointer to the start of the function and it is a project-global variable\
    \ unless you restrict it to the current file using the static keyword. This implies\
    \ that the lifetime of a C function is the same as the entire program.\n\nC functions\
    \ only have positional parameters - no keyword parameters, optional parameters,\
    \ default values or optional parameters are possible. You can create functions\
    \ that accept a variable number of parameters, but determining how many parameters\
    \ are in use and their type is difficult.\n\nAs C functions cannot be defined\
    \ within other functions, i.e. local functions aren't supported, there is no support\
    \ for closure, partial application or currying."
