  md: "memory it occupied is reused by another program. This is very similar to the\
    \ variable **b**, which lives as long as the `main` function is active. In a single-threaded\
    \ program life and main function life are the same as the program ends when the\
    \ `main` function ends. In a multi-threaded program this isn't necessarily true.\n\
    \nA big difference between the two variables is that `a` is accessible, i.e. in\
    \ scope, everywhere in the file. That is, all of the code in the same file can\
    \ access `a`, whereas variable `b` can only be accessed from `main` even though\
