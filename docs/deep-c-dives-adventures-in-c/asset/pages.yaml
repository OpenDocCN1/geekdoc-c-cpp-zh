- pgno: 15
  md: '# # Compilers Today


    Today the dominant C compiler is part of GCC, the GNU Compiler Collection. GCC
    was first released in 1987 by Richard Stallman when it consisted of a single C
    compiler. Since then it has been extended to support C++, Go, Rust, Fortran, Ada
    and others. It has been ported to a very wide range of machines and it is generally
    regarded as the standard C compiler.


    What is surprising is that Windows lacks an official port of the GCC compilers.
    There is also no Microsoft C compiler as the compiler used to create Windows,
    Microsoft Visual C++ (MSVC), is first and foremost a C++ compiler. This can be
    used to compile C programs but it misses some details of the C11 standard and
    has only recently caught up with C99. You can either opt to live with MSVC or
    you can install one of the Windows ports of GCC.


    The only real competitor to GCC is Clang, which was developed by Apple as it could
    not accept the GCC licensing terms. Clang takes an interesting approach to implementing
    a compiler and some users prefer it. On balance, it doesn''t offer much over GCC
    in terms of compilation speed and the code it produces is often not as fast. The
    Linux Kernel is still compiled using GCC despite efforts to make it compatible
    with Clang.


    In most cases the compiler that you want to use is GCC or a version of GCC modified
    for the hardware you are using.


    It is worth saying that modern compilers, GCC in particular, are excellent at
    producing optimized code. I have often decided that some small piece of code needed
    to be written in assembler to gain maximum advantage of the machine only to discover
    that the code generated from a C program doing the same thing turned out to be
    faster. On examination of the generated assembler you generally find that the
    compiler knows all the tricks you do and usually a few that you don''t and occasionally
    one or two that are hard to fathom. However, optimization sometimes goes too far.
    See Dive 16 on undefined behavior for more details.


    # # C++


    Of course, whenever you discuss C the elephant in the room is C++. This isn''t
    the only object-oriented extension of C, Objective C is another. However, C++
    evolved from C in a gradual fashion and its implementation has only slowly separated
    from C. The derivative language was first released by Bjarne Stroustrup in 1985.
    At first it really was an extension to C in the sense that it used a pre-processor
    to convert the text of a C++ program into pure C that was then compiled using
    the usual C compiler.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'At the start C++ was no more than a text processor and hence highly compatible
    with C. Any C instruction was a valid C++ instruction and any C++ instruction
    was transformed into C.


    As time went on, C++ developed more features and eventually gained its own compiler.
    Over time C++ and C diverged and today there are many things that are valid in
    C and invalid in C++ and vice versa. C is no longer a subset of C++.


    The temptation when writing C is to think that it is only a small change to introduce
    some features of C++ to gain some of its advantages. The problem with this is
    that C++ has grown to such a point that there is generally more than one way of
    doing anything and some of these ways are confusing and potentially more dangerous
    than simple C. This is such a problem that to this day Linus Torvalds will not
    allow C++ into the Linux kernel.


    To quote:


    > *"C++ is a horrible language. It''s made more horrible by the fact that a lot
    of substandard programmers use it, to the point where it''s much much easier to
    generate total and utter crap with it. Quite frankly, even if the choice of C
    were to do \*nothing* but keep the C++ programmers out, that in itself would be
    a huge reason to use C."*


    I don''t completely agree with the "substandard programmers" part of the quote,
    but I think that C++ can turn a reasonably good programmer into something worse.
    The main problem with C++ is that it isn''t as suited to C to low-level tasks
    and it isn''t as good as countless other languages at high-level tasks. It is
    a confused mix of low- and high-level. Like Linus you would do well to concentrate
    on C if your requirements are low-level programming interacting with the hardware.


    # ## Being True to C


    C is just one level removed from assembler. It is easier to use and, given a good
    compiler, just as fast. So, despite what some programmers may claim, C is still
    a good more or less machine-independent assembler. The programmers who claim it
    is not are really not seeing the soul of C. They see the language as lacking the
    abstractions that other languages have and they think that C would be better with
    them rather than without them. There is an almost irresistible pressure to move
    all languages towards some pinnacle of theoretical abstraction. It is why modern
    languages tend to be very similar. As Dennis Ritchie once remarked:


    > *"When I read commentary about suggestions for where C should go, I often think
    back and give thanks that it wasn''t developed under the advice of a worldwide
    crowd."*


    16'
