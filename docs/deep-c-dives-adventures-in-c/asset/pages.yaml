- pgno: 201
  md: '# Restrictions


    There are some subtle points about using longjmp. The first is that on return
    to a setjmp the stack is restored to its state at the setjmp. What this means
    is that any changes to local variables after the setjmp are lost. This is perfectly
    reasonable and what you would expect. However, it is possible that a compiler
    could optimize the code so that local variables are placed in registers. In this
    case, the restore of the stack might not be exact. As a result, in principle,
    if not so much in practice, local variables modified after the call to setjmp
    and before the call to longjmp should be regarded as undefined. In principle you
    can make them defined by using the volatile keyword in their definition.


    A more important restriction in practice is that, because setjmp/longjmp are implemented
    in assembler, setjmp should only be used in a small number of circumstances:


    +   - As the test expression of a selection or iteration statement (such as if,
    switch, or while).


    +   - As one operand of an equality or comparison operator that appears as the
    test expression of a selection or iteration statement. The other operand must
    be an integer constant expression.


    +   - As the operand of a unary ! operator that appears as the test expression
    of a selection or iteration statement.


    +   - By itself as an expression statement.


    This means that


    ```

    state = setjmp(jumpBuffer);

    ```


    is safe but something like:


    ```

    state = setjmp(jumpBuffer[i++])+base;

    ```


    is not.


    Finally, it is important that the function that the current setjmp is in hasn''t
    returned before the longjmp is executed. The reason should be obvious – the stack
    cannot be restored to its state in the function if control is no longer in the
    function. As the documentation says:


    > “If you longjmp to a return point that was established in a function that has
    already returned, unpredictable and disastrous things are likely to happen.”


    This seems very reasonable.'
  merge: -1
  img_proc: true
- pgno: 202
  md: "# # Linux Signals\n\nSo far we have used longjmp to deal with errors that we\
    \ can detect using code. Some errors can't easily be checked out in this way and\
    \ the operating system deals with them. Ideally we would like to convert an operating\
    \ system-handled error into an exception-handled error. This complicates things\
    \ because you have to use a different method for Linux and Windows.\n\nLinux is\
    \ perhaps the easier to work with as it implements signals in a reasonably consistent\
    \ way as defined by the POSIX standard. If you need more information on how POSIX\
    \ implements software interrupts using signals, see Applying C For The IOT With\
    \ Linux, ISBN: 978-1871962611. Windows also implements signals, but only to be\
    \ compatible with POSIX.\n\nThere is one more complication. The standards do not\
    \ specify if the signal state should be stored as part of the environment. Under\
    \ some operating systems it is, and under others it isn't. The function:\n\n```\n\
    sigsetjmp(buffer,0);\n```\n\nwill save the environment without the signal state.\
    \ If the second parameter is non-zero then it will save the signal state.\n\n\
    If you use sigsetjmp then you have to use:\n\n```\nsiglongjmp(buffer,value);\n\
    ```\n\nto restart.\n\nConsider how to allow division functions to raise a signal.\
    \ If you use:\n\n```\nint myDiv(int a, int b) {\n    return a / b;\n}\n```\n\n\
    then, as the program stands, it would simply perform the default action and terminate\
    \ without any signal.\n\nIf we define a handler for SIGFPE then we can use the\
    \ siglongjmp to return to the program and continue:\n\n```\nvoid signalHandler(int\
    \ sig)\n{\n    printf(\"SIGFPE\\n\");\n    siglongjmp(jumpBuffer, 1);\n}\n```"
  merge: -1
  img_proc: true
- pgno: 203
  md: "Setting up the signal handler is the same as always and the complete program\
    \ is:\n\n```\n#define _POSIX_C_SOURCE 200809L\n#include <stdio.h>\n#include <stdlib.h>\n\
    #include <signal.h>\n#include <setjmp.h>\n\nstatic jmp_buf jumpBuffer;\n\nint\
    \ division(int a, int b)\n{\n    return a / b;\n}\n\nvoid signalHandler(int sig)\n\
    {\n    printf(\"SIGFPE\\n\");\n    siglongjmp(jumpBuffer, 1);\n}\n\nint main(int\
    \ argc, char **argv)\n{\n    sigset_t mask;\n    sigfillset(&mask);\n    struct\
    \ sigaction psa = {0};\n    psa.sa_handler = signalHandler;\n    psa.sa_mask =\
    \ mask;\n    sigaction(SIGFPE, &psa, NULL);\n\n    if (0 == sigsetjmp(jumpBuffer,\
    \ 0))\n    {\n        printf(\"answer %d\\n\", division(6, 2));\n        printf(\"\
    answer %d\\n\", division(6, 0));\n    }\n    else\n    {\n        printf(\"can't\
    \ do it\\n\");\n    }\n    printf(\"program continues\\n\");\n    return (EXIT_SUCCESS);\n\
    }\n```\n\nThe SIGFPE signal is raised for any arithmetic error. If you want to\
    \ see this program working then you have to run it without a debugger active.\
    \ The reason is that the debugger will generally automatically intercept any fatal\
    \ signals before the program has time to handle them. Try running it from the\
    \ command line."
  merge: -1
  img_proc: true
- pgno: 204
  md: '# goto versus longjmp


    C has a goto instruction and at first seems similar to the longjmp function, but
    it isn''t. The C goto can only be used to transfer control within a function to
    a label applied within that function. The longjmp can be used to transfer control
    between functions, which could even be in different source files. The goto should
    never be needed as modern C has enough control structures to make an uncontrolled
    jump to an arbitrary location unnecessary and, if used without a really good reason,
    it is confusing and obscure. There are occasions when a goto can be considered
    a reasonable choice and these are exactly the occasions when the longjmp is useful.
    If there is some exceptional occurrence, usually an error, then a goto might be
    acceptable as a way of continuing the flow of control, but even here there are
    usually better ways.


    The longjmp can also be a source of confusion. The fact that the target of the
    longjmp can be set multiple times means that if you use:


    ```

    longjmp (jumpBuffer)

    ```


    then where you end up depends on what is stored in jumpBuffer. One solution is
    to always use a different jumpBuffer so that they act like labels in a goto. For
    example:


    ```

    longjmp(startComputation)

    longjmp(getUserInput)

    ```


    where each jumpBuffer is set at the corresponding location. This seems like a
    very good approach to controlling longjmp.


    To summarize:


    +   * goto is rarely needed and always confusing

    * longjmp is sometimes needed, but still potentially confusing


    # Final Word


    C doesn''t have an exception mechanism, but longjmp provides a reasonable way
    to handle runtime errors. It isn''t perfect due to the difficulties of defining
    what should be stored by a setjmp and what should be restored by a longjmp. This
    makes using longjmp hardware-dependent. Even in an ideal world, using longjmp
    is potentially confusing. It is best used sparingly and reserved for when it solves
    a real problem, rather than trying to implement a general exception-handling mechanism
    that operates throughout the program.


    It is also worth reminding ourselves that one programmer''s exception is another
    programmer''s conditional. You can generally let an exception happen or you can
    write code that detects it before it happens.'
  merge: -1
  img_proc: true
