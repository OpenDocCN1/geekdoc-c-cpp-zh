- pgno: 110
  md: "Typically a static variable is used to store state data that persists between\
    \ function calls. For example:\n\n```\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\
    \nvoid myFunction(){\n    static int myVar = 0;\n    myVar++;\n    printf(\"%d\\\
    n\", myVar);\n}\n\nint main(int argc, char **argv)\n{\n    myFunction();\n   \
    \ myFunction();\n    myFunction();\n    myFunction();\n    return 0;\n}\n```\n\
    ```\n\nThe only subtle point here is that the line:\n\n```\n`static int myVar\
    \ = 0;`\n```\n\nis executed by the compiler in the sense that it reserves storage\
    \ for myVar as part of the program file and zeros it. In this way the creation\
    \ of the variable and its initialization occurs before the function is ever called\
    \ and the program displays 1,2,3,4 as its result. Notice that myVar isn't accessible\
    \ from any other part of the program.\n\nThis is slightly different from automatic\
    \ variables where lifetime and scope are related. In this case the compiler enforces\
    \ the restriction by refusing access from outside the function that declares the\
    \ static variable.\n\nWhat do you use static variables for? The simple answer\
    \ is that they are ideal for storing persistent state without using file-level\
    \ or true globals. The data can also be shared with other parts of the program\
    \ as it is safe to return a pointer to a static. For example, we can change the\
    \ previous function to:\n\n```\n```c\nint *myFunction(){\n    static int myVar\
    \ = 0;\n    myVar++;\n    return &myVar;\n}\n```\n```\n\nNotice that it now returns\
    \ a pointer to the static myVar."
