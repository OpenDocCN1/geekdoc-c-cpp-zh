- pgno: 51
  md: 'We have noticed that we are multiplying both the 2 and the 4 by 3 and we have
    opted to do the addition first and save ourselves a multiplication by “pulling
    the multiply out of the bracket”.


    That a×(b+c) is the same as a×b+a×c is called the distributive law of multiplication
    and it is the reason we prefer to think of multiplication as having a higher priority
    than addition. If this wasn’t the case and we evaluated 3×2+3×4 strictly left-to-right:


    ```

    3×2+3×4 = 6 + 3 × 4 = 9 × 4 = 36

    ```


    then the distributive law wouldn’t be true.


    In other words, if you want to think of:


    ```

    a×b + a×c = a×(b+c)

    ```


    as “pulling a out into a bracket” then you need to make multiplication a higher
    priority operation than addition. This idea generalizes to the way other operators
    behave and their assigned priorities.


    # ## C Expressions


    C has lots of operators that go well beyond the commonly encountered, standard
    ones. Once you start to extend the range of operators that a language has then
    you have to worry about associativity as well as precedence.


    Associativity is simply the order that operators of the same priority will be
    evaluated. If you restrict your attention to simple arithmetic operators then
    the associativity isn’t a problem because (A+B)+C is the same as A+(B+C).


    However, when you move on to consider more general operators it does matter. For
    example, in C the right shift operator A>>B shifts A right by B bits. (A>>B)>>C,
    which means shift A right by B+C isn’t the same as A>>(B>>C), which shifts A right
    by the result of the right shift of B by C bits.


    To make the result of such operations unambiguous, C defines each operator as
    associating left to right or right to left, i.e. right or left associative. The
    >> operator associates left to right because this means that A>>B>>C is (A>>B)>>C
    and this is the same as A>>(B+C).


    Every operator in C has a priority and an associativity and you need to know both
    to be able to figure out what an expression evaluates to. You can see all of the
    standard C operators in the table on the next page.'
