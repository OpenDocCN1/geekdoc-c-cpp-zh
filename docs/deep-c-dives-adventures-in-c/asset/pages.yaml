- pgno: 62
  md: "# The Downto `-->` Operation\n\nThe very first thing to say is that there is\
    \ no downto operator – it’s a strange and misleading use of two standard operators.\
    \ For example:\n\n```\n```\nint x = 10;\nwhile (x--> 0)\n{\n    printf(\"%d\\\
    n\", x);\n}\n```\n```\n\nThis is fancifully read as “while x goes to zero” and\
    \ it does print 0 to 9 but not because of the use of the downto operator. The\
    \ condition in the loop: x--> 0\n\nis actually (x--) > 0 and the value of x is\
    \ decremented and then tested against 0. The illusion is courtesy of C’s operator\
    \ precedence rules that allow you to avoid using brackets."
