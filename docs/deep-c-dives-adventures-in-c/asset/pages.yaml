- pgno: 108
  md: '# Global Variables


    Is a file-level variable a global variable? In a sense it is, but there is also
    an important restriction. A file-level variable is only accessible to code in
    the same file. If you have a multi-file C project then code in other files cannot
    access the file-level variables in a given file.


    This means that, for a single file C project, file-level variables are global
    variables.


    What about multi-file projects?


    Most non-trivial C projects use multiple .c and .h files. The compiler generally
    compiles each .c file, after combining it with any .h files included, in isolation
    to produce an intermediate .o file which the linker then puts together. Any file-level
    variables in a file are global within that file but inaccessible from other files.
    This is often a useful feature and can be used to provide a global variable without
    the risk that other files will use global variables that collide with it. If you
    want to share a global variable across files you need to use the extern keyword.


    You can see that, unlike many languages, the file structure of a C project controls
    what is shared between the code in each of them. They are the units of isolation
    that allow a large project to be manageable. They are C’s encapsulation in object-oriented
    terms. See Dive 14, Structs and Objects.


    # Declaring and Defining


    At this point it is helpful to draw a distinction between declaring a variable,
    i.e. informing the compiler that the variable exists, and defining a variable,
    i.e. getting the compiler to allocate storage for it.


    If you declare a file level variable using extern then the compiler allows its
    use in the file as a global variable, but it doesn’t allocate storage for it.
    The linker expects to find a single definition of the variable in one of the files
    it is linking and it fills in the missing address in all of the files that make
    use of it.


    The compiler converts each file or compilation unit into a possibly incomplete
    “object” file. Any variables that have been declared, but not defined, are included
    in the object file in a form that gives enough information for the linker to locate
    the variable in another file where it is defined. It is up to you to tell the
    linker which files to link together to create the complete program.'
  merge: -1
  img_proc: true
