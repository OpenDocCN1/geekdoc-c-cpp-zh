  md: 'point is that a two-dimensional array is a one-dimensional array where each
    element is a one-dimensional array. If you want to think in terms of the rows
    and columns of a matrix, then the C array is a one-dimensional array of rows.
    This is generally called row-major order as opposed to column-major order used
    by Fortran, Octave and so on.


    The syntax to create a two-dimensional array follows from this description:

    int myArray[5][6];

    which creates an array with 5 rows, each one consisting of an array of 6 ints
    – the columns.


    ![](img/5f2ea21c2077d473344a0fdf144677b9_125_0.png)


    You can think of this as creating a one-dimensional array where each element is
    in itself an array of 6 ints.


    ![](img/5f2ea21c2077d473344a0fdf144677b9_125_1.png)


    int myArray[5][6]; can be thought of as int[6] myArray [5], i.e. an array of five
    elements each of which is an int[6]. Of course, this isn’t valid C - it is just
    intended to give you some idea of why the syntax is as it is.


    Accessing an element of an array also follows the “double index” pattern:

    myArray[i][j]

    refers to the element in the ith row and the jth column. Again it takes the form
    of the jth element of the array that is the ith element.'
