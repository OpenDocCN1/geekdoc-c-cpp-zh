- pgno: 17
  md: 'C is about bit patterns and moving bits around. At its most abstract it is
    about integers. There is even an argument that if you are using floating-point
    types you probably shouldn''t be using C. If you don''t want to be close to the
    machine then choose another language.


    The important point is that you will read many definitive proclamations about
    how C should be used or written – usually by proscribing exactly what you should
    not be doing. Most of the time these pronouncements are misguided or motivated
    by considerations that are simply not true to the idea of C. Many of them originate
    with C++ programmers who have a different view point and a different level of
    abstraction. They often think that as C is almost a subset of C++ their opinions
    are appropriate but they are often really aimed at the needs of the C++ programmer.


    # ## How to Read this Book


    This isn''t a primer or a tutorial, it is a collection of deep dives into important
    topics that make C a unique language. There is no particular path through the
    book that you are expected to follow – just dive into topics that you want to
    know about. Some dives refer to topics that are covered more deeply in other dives.
    While I have tried to achieve an orderly presentation of topics in C, some forward
    and backward references are unavoidable, but this shouldn''t be problematic if
    you already know some C.


    The purpose of the book is to reveal the unique aspects of C and in doing so help
    you use C as it was always intended to be used – as a low-level language that
    excels in dealing with data at the level of the bit pattern.'
