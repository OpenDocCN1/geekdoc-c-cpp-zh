- pgno: 130
  md: 'NULL-terminated. In other words, strncpy limits the size of the scan, but doesn''t
    promise that the result is NULL-terminated. To be on the safe side, you can protect
    yourself by always storing a NULL in dest[size-1].


    In practice, you can protect against C strings that lack a terminating NULL by
    always limiting operations to the size of the arrays used to hold the strings.
    It is common to make the arrays one byte larger than they need to be and initializing
    them with a final NULL to act as a sentinel of last resort.


    C strings may be unsafe without due care and many adopt an alternative representation
    by creating a struct with a string and a len field. You can generally use the
    safe string functions with these by splitting out the parts of the struct. If
    you plan to do this it is worth finding and using an improved C string library,
    such as the SDS library or the ICU4C library with Unicode support.'
