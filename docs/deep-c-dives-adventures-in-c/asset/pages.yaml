  md: "With that definition you can still write:\n\n```\nprintf(\"%d\\n\",sum(1,2));\n\
    ```\n\nand generate no compiler or runtime errors. Of course, with this declaration\
    \ the function cannot access the parameters, but you can separate the declaration\
    \ and implementation of the function:\n\n```\nint sum();\nint main(int argc, char\
    \ **argv)\n{\n    printf(\"%d\\n\",sum(1,2));\n}\n```\n\n```\nint sum(int a, int\
    \ b){\n    return a+b;\n}\n```\n\nIn this case the function is defined after the\
    \ main program. So the first declaration is needed and it declares a function\
    \ with no parameters – only, of course, it doesn't. It declares a function with\
    \ any number of parameters which is why the program works – you might see a warning\
    \ message from a helpful IDE or compiler. This is so confusing that C99 outlawed\
    \ the use of $ function() $ at all and you have to use $ function(void) $.\n\n\
    If you replace int sum(); by int sum(void); in the previous program you will see\
    \ an error message as the definition of sum has parameters and its declaration\
    \ states that it doesn't have any.\n\nTo summarize:\n\n+   - Use void function(…)\
    \ to state that a function definitely doesn't return a result.\n- Use type function(void)\
    \ to state that a function definitely doesn't take any parameters.\n\nSee Dive\
    \ 13 for more.\n\n# Void Expressions\n\nA little known use of void is to create\
    \ a void expression. Expressions are like functions in that they return a result.\
    \ Usually, if you want to ignore the value of an expression then you can simply\
    \ do that, for example:\n\n```\n2+3;\n```\n\nSuch expressions are generally called\
    \ “statement expressions”. If you want to make it clear that an expression is\
    \ throwing away its result you can cast the result to void. That is, the previous\
    \ statement expression is equivalent to:\n\n```\n(void)(2+3);\n```"
