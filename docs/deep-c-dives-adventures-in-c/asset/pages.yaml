  md: "# Casting Pointers\n\nPointer arithmetic is all about implementing the storage\
    \ mapping function for the array using pointers and, in most cases, this is exactly\
    \ what you want. Just occasionally, however, you need to access parts of a data\
    \ type rather than the whole thing and to do this you need a pointer that points\
    \ “inside” the data, not just at the start.\n\nFor example, suppose you want to\
    \ access the individual bytes that make up an int. Getting a pointer to the int\
    \ is easy, but as it is an int pointer adding one to it moves it on by four bytes.\
    \ If you only want to move it on by a single byte you need to use a cast:\n\n\
    ```\n#include <stdio.h>\n#include <stdlib.h>\n\nint main(int argc, char **argv)\n\
    {\n    int myVar = 0x01020304;\n    char *myPointer = (char *)&myVar;\n    printf(\"\
    %d\\n\", *(myPointer+1));\n    return 0;\n}\n```\n\nBy casting the address to\
    \ a char pointer adding 1 really does only add 1 . You can do this on a temporary\
    \ basis by casting the pointer:\n\n```\nint *myPointer=&myVar;\nprintf(\"%d\\\
    n\", *(char *)myPointer+1));\n```\n\nOf course, what you actually see displayed\
    \ depends on the byte order – big or little endian. For more complex data structures,\
    \ the exact layout in memory makes a difference.\n\n# More Than One Dimension\n\
    \nIf you know about arrays then you will also know that they come in different\
    \ shapes. The sort of array that we have been looking at is usually called “one-dimensional”\
    \ or a “vector” because it has only a single index. You can have an array that\
    \ has more than one index. A two-dimensional array has two and it is generally\
    \ thought of as a table of rows and columns or as a matrix. For three dimensions\
    \ we have a cube and beyond this things become difficult, if not impossible, to\
    \ imagine.\n\nHigher-dimensional arrays are often called “tensors”, but this name\
    \ comes from physics and math. As far as programming is concerned, an n-dimensional\
    \ array is simply an array which accepts n indices to identify an element.\n\n\
    Some languages have special syntax for defining multi-dimensional arrays, but\
    \ C just reapplies the basic array principle as many times as required. The"
