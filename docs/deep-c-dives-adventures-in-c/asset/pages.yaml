- pgno: 115
  md: '# The Pointer


    We need a new data type.


    The clever part is that C doesn''t introduce a single new data type “the address”,
    but a modifier, \* the dereference operator, that can be applied to any data type
    to produce an address that references that type. This is called indirection and
    the resulting data type is a “pointer” or a “pointer to the type”. For example,
    `int myVar` is an `int` whereas `int *myPointer` is a pointer to an `int` and
    so on. Notice that this is more subtle than simply defining a type that holds
    an address.


    Both `float *myFloatPointer` and `int *myIntPointer` are going to be the same
    number of bits and essentially the same, but the compiler remembers that the first
    is an address of a `float`, typically 8 bytes, and the second is the address of
    an `int`, typically 4 bytes.


    That is, the pointer records not just the fact that it is an address, but also
    the nominal size and configuration of the entity it is pointing at. It is important
    to understand that this is only true at compile time. The compiler uses the information
    to work out how to treat the data that a pointer references. At runtime we only
    have the address of the entity.


    Notice that the \* binds to the variable name not the type. That is, the declaration
    is:


    ```

    int (*myIntPointer)

    ```


    because of this you can write things like:


    ```

    int *myIntPointer, myInt, *myIntPointer2

    ```


    and so on. Compare this to the way the type is written in cast:


    ```

    (int*) myPointer

    ```


    You can still write it as:


    ```

    (int *) myPointer

    ```


    and imagine that the \* still binds to the variable.


    # Dereferencing


    Now that we have a pointer type, we can make use of addresses derived using the
    address operator, for example:


    ```

    int myVar = 42;

    int *myIntPointer;

    myIntPointer = &myVar;

    ```


    Now we have the address of myVar stored in myIntPointer.'
