- pgno: 167
  md: "compilers have a facility that lets you decide if you want to pack the struct\
    \ for minimum space or include padding to ensure that fields are aligned correctly\
    \ for speed. What all this means is that you cannot simply assume that a struct\
    \ takes the amount of space suggested by how much space its fields take.\n\nFor\
    \ a 64-bit machine using a 64-bit word, a struct will take at least eight bytes.\n\
    \nFor example:\n\n```\n```c\nstruct test {\n    int i;\n    char c;\n};\ntest;\n\
    printf(\"%d \\n\", sizeof (int));\nprintf(\"%d \\n\", sizeof (char));\nprintf(\"\
    %d \\n\", sizeof (struct test));\n```\n```\n\nwill print 4, 1 and 8 on a 64-bit\
    \ Intel/Arm processor based machine. So although the struct should have taken\
    \ just five bytes it actually takes eight to pad it out to a full 64-bit word.\n\
    \nNotice that the padding is added at the end or in between fields. The C standard\
    \ ensures that no padding is added to the start of a struct and this means you\
    \ can rely on the fact that the address of the struct is the address of the first\
    \ field but, of course this first address will be on a word boundary.\n\nIf you\
    \ want to pack a struct to take the smallest amount of memory then a rule of thumb\
    \ is to allocate fields in the order of size starting with the largest.\n\nThe\
    \ fact that structs are packed makes many things that you might think easy more\
    \ difficult. For example, you cannot rely on pointer arithmetic to pick out fields\
    \ because apart from the first field padding may move the start of a field from\
    \ where you expect it to be.\n\n# ## Type Punning\n\nApart from the issue of padding,\
    \ you can treat a struct as just a block of memory in the sense that you can cast\
    \ it into other forms. This is an example of \"type punning\" where the bytes\
    \ of one type are interpreted as the bytes of another. This is a very standard\
    \ operation when C is used in a low-level system role and yet the whole subject\
    \ is fraught with confusion. Some programmers are so convinced that type punning\
    \ is a bad idea that they state that it should never be used. The fact of the\
    \ matter is that it is used a lot and if it really was to be removed, a lot of\
    \ code would have to be rewritten and some would be next to impossible to implement\
    \ in an efficient way."
  merge: -1
  img_proc: true
- pgno: 168
  md: "The simplest example is where a function accepts a struct as a parameter, but\
    \ the struct has been extended over the years of development. Suppose it started\
    \ out as:\n\n```\nstruct myStruct{\n    int a;\n    int b;\n};\n```\n\nand the\
    \ function is:\n\n```\nvoid myFunction(struct myStruct *myPointer){\n    printf(\
    \ \"%d\\n\", myPointer->a);\n    printf( \"%d\\n\", myPointer->b);\n}\n```\n\n\
    Now suppose that later on the struct is extended to include a new field essential\
    \ to the further development of the project:\n\n```\nstruct myStructEx{\n    int\
    \ a;\n    int b;\n    int c;\n};\n```\n\nThe good news is that new functions can\
    \ make use of the new struct and the old functions can carry on treating the new\
    \ struct like the old using a cast:\n\n```\nmyFunction((struct myStruct *) myPointer);\n\
    ```\n\nwhere myPointer is now a pointer to myStructEx. Obviously myFunction knows\
    \ nothing about the extended structure and so will only use the fields a and b.\
    \ This is the struct analog of subclassing – myStructEx derives from myStruct\
    \ in exactly the same way as a subclass derives from a base class. Cast to the\
    \ “base” struct is an example of type punning where a block of memory is treated\
    \ as different types.\n\nYou can take the “inheritance” idea a step further by\
    \ including the base struct in the derived struct:\n\n```\nstruct myStruct\n{\n\
    \        int a;\n        int b;\n};\nstruct myStructEx\n{\n        struct myStruct\
    \ base;\n        int c;\n};\n```"
  merge: -1
  img_proc: true
- pgno: 169
  md: "Now any new functions passed myStructEx have to refer to the base struct as\n\
    \n```\nmyPointer->base.a;\n```\n\nbut if you cast myStructEx to myStruct the original\
    \ still works:\n\n```\n(myStruct *)myPointer->a\n```\n\nIf you think that this\
    \ sort of thing is rare and not something you are likely to use or encounter,\
    \ it is worth pointing out that CPython is based on this way of implementing classes\
    \ and objects. However, it is important to know that nearly all type punning breaks\
    \ the strict aliasing rule. This basically states that a block of memory should\
    \ only be referenced by pointers to compatible types, see Dive 16. In other words,\
    \ one of the most used of the advanced features of C is usually illegal according\
    \ to the recent C standards. This is, of course, nonsense. Use type punning wherever\
    \ it makes sense and if necessary configure the compiler to swallow it without\
    \ demur, the alternatives are much worse.\n\nNotice that you do have to be careful\
    \ about padding being different if you change the type of a struct. For example,\
    \ if you have a struct like:\n\n```\nstruct test1 {\n    char c;\n    int i;\n\
    };\n```\n\nand you pun it with:\n\n```\nstruct test2{\n    char c[1];\n    char\
    \ i[4];\n};\n```\n\nthen you are making the assumption that the layout is one\
    \ byte for the char followed immediately by four bytes for the int. If you try\
    \ this out on a 64-bit machine you will find that c[0] is the same as c, but i[4]\
    \ doesn't represent the integer. The reason is for the problem is that the struct\
    \ is packed so that the int starts on a word boundary. So the layout is one byte\
    \ for the char and then three bytes of padding to make the four bytes of the int\
    \ start on a word boundary. A correct pun is:\n\n```\nstruct test2{\n    char\
    \ c[4];\n    char i[4];\n};\n```\n\nwith c corresponding to c[0] and the int corresponding\
    \ to i[0] to i[3]. Clearly this is machine-dependent and there is no way you can\
    \ gain access to the bytes that make up the int in a machine-independent way."
  merge: -1
