  md: 'For example:


    ```

    ```

    file1.c

    int globalvar = 42;

    int main(){...

    ```


    ```


    As globalvar is declared and defined, it can be used within file1.c. To use it
    in another file we need to use extern to just declare the variable:


    ```

    ```

    file2.c

    extern int globalvar;

    functions that use globalvar

    ```


    ```


    The extern informs the compiler that globalvar is defined in another file and
    that it should compile file2.c as if globalvar was an int but use a placeholder
    for its address. When the two files are linked to make the complete program, the
    placeholders for the address of globalvar are replaced by the actual address of
    globalvar as allocated in the compilation of file1.c.


    If you plan to use global variables across multiple files then best practice is
    to put the extern declaration in a header file and make sure that this is included
    in all of the files that need access to the globals.


    It is also worth knowing that extern can be used to make it clear that a function
    in one file is accessible from another. We tend not to use it because extern is
    the default for function declaration. If you want to make a function local to
    the compilation unit it is defined in then use the static modifier which we''ll
    look at next.


    # ## Static


    Closely related to the idea of a file-level variable, is a static variable. A
    static variable can be declared anywhere in a program and it has the same lifetime
    as a file-level variable.


    That is, a static variable lives for the entire duration of the program. The difference
    is that a static variable has the scope appropriate to where it has been declared.
    That is, if you create a static variable within a function, it exists before the
    function executes and continues to exist after the function has exited. This sounds
    like a global variable, but it is only accessible from within the function. This
    makes a static variable look like a local variable that lives for the life of
    the program.


    Notice that you can declare a static variable in the main function and this looks
    a lot like a global variable, but one that only the main program can use directly.
    You can also declare a static variable at file level and in this case you cannot
    use it as a true global variable as it is restricted to the current compilation
    unit, i.e. the file it is declared in.'
