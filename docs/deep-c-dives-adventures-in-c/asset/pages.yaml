- pgno: 180
  md: "In this example, it is obvious that you should parse the variations on the\
    \ telephone field into a standard format, but there are situations where this\
    \ doesn't make sense.\n\nIf the compiler supports anonyomous unions we can get\
    \ rid of the phone field which seems unnecessary:\n\n```\n```c\nstruct {\n   \
    \ int type;\n\n    union {\n      char numstring[10];\n      int numint;\n   \
    \ };\n} person;\n```\n```\n\nNow we can write:\n\n```\n```c\nperson.type = 1;\n\
    strcpy(person.numstring, \"1234\");\nperson.type = 0;\nperson.numint = 1234;\n\
    ```\n```\n\nGCC supports this use of an anonyomous union.\n\n# ## Final Thoughts\n\
    \nUnions are the preferred way of type punning mainly because they have to be\
    \ explicitly declared. If you want to alias two types then you have to create\
    \ a union that implements this. If you use casting then you don't have to prepare\
    \ in advance, you can simply cast as needed. This makes it harder for the compiler\
    \ to detect when you use an alias."
