    \ this is therefore an expression. Then b is assigned to a and the test of the\
    \ value of b is carried out.\n\nThere is no point in writing this in this way\
    \ as the printf might as well be in the body of the loop. Typically you will find\
    \ the comma operator used where a function has to be called to initialise something\
    \ before testing its current state. As before this is not a recommended construct,\
    \ but you will find it in use.\n\n# ## The Ternary Operator\n\nThe ternary operator\
    \ is often introduced as a shortcut to an if ... else construct. It is easy enough\
    \ to understand:\n\n```\n(condition) ? TrueExpression : FalseExpression\n```\n\
    \nIf the condition is true then the expression evaluates TrueExpression, otherwise\
    \ FalseExpression is evaluated. This can be thought of an expression equivalent\
    \ of:\n\n```\nif(condition){\n    variable = TrueExpression\n}else{\n    variable\
