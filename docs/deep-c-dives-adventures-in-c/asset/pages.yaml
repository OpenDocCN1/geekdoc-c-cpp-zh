- pgno: 39
  md: 'This sounds convoluted, but it corresponds to what is going on and is how you
    should think about it. Only beginners think that just “prints the contents of
    a”. It is also clear that we need to think about format specifications giving
    us two pieces of information – what the bit pattern in the variable represents
    and how it should be converted to an array of char. For example, the “%d” says
    that the bit pattern in a should be taken to represent a binary integer and it
    needs to be converted to an array of char that correspond to the ASCII characters
    of its digits.


    ```

    ```c

    printf("%d\n",a);

    ```

    ```


    The point is, when thinking about what C is doing you cannot ignore the way a
    bit pattern is modified and reinterpreted. This sort of analysis of behavior is
    very typical of C and hardly ever happens in other languages.


    # # Printf and Type


    As another example of how interpretations of bit patterns differ, consider the
    way format specifiers in `printf` and similar functions work. A little known and
    used feature of the `printf` specifier is the length sub-specifier which explicitly
    gives the size, i.e. the number of bits to be used:


    ```

    ```text

    hh    signed char

    h     short int

    l     long int

    ll    long long int

    ```

    ```


    So for example to get `printf` to treat a as an `unsigned short int` you would
    use:


    ```

    ```c

    unsigned short a = -1

    printf("%hhu\n",a);

    ```

    ```


    which displays `65535` as no promoting occurs. The only problem is that these
    lengths depend on the machine in use, i.e. `short int` might be bigger than 16
    bits. There are some macros that are supposed to supply the correct format for
    precise bit sizes, e.g. `int16_t`, but they tend not to work by simply supplying
    `d` or `u` as the format specifier, rather than `hd` or `hu`.


    You might be thinking that of course it displays `65535` as a is an `unsigned
    short` but this isn’t what is happening. The type of the variable doesn’t affect
    what is displayed. For example:


    ```

    ```c

    printf("%hhu\n", -1);

    ```

    ```


    also displays `65535`. You can argue that the -1 is by default taken to be a `signed
    int`, but even so the `hu` format takes the last two bytes and interprets them
    as an `unsigned short`.


    The situation with `printf` and the expressions that it converts is more complicated
    than it looks due to automatic promotion – see Type Casting.'
