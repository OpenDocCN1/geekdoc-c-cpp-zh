- pgno: 181
  md: '# **Dive 16**


    # Undefined Behavior


    > “The fact is, undefined compiler behavior is never a good idea.

    Not for serious projects.”


    Linus Torvalds


    Undefined behavior is something that every C programmer should be aware of and
    take steps to protect themselves against. It all stems from the way optimization
    has become something of a game for compiler writers. The real problem actually
    started well before undefined behavior emerged to make it worse.


    # ## An Optimization Too Far


    You might think that the highest consideration of a compiler writer is to compile
    a program in such a way that does not alter the meaning of a program. Sadly, this
    doesn’t seem to be the case any longer, the goal of optimization has now pushed
    compilers into the realms of inventing their own idea of what a program should
    do.


    For example, in many low-level programs there is a need to waste some time, which
    obviously conflicts with the goals of optimization as they are to save time not
    waste it. To produce a rough time delay, often the simplest thing to do introduce
    a no-op loop:

    `for(int i=0; i<1000; i++) {};`


    This is often needed if you are interacting with the hardware and need to pause
    while the hardware catches up. In theory this should never be necessary as there
    should always be a status bit that you can test to see if the hardware is ready
    but in practice this isn’t always the case. As a result a typical program might
    have multiple no-op loops which, at the time of writing, are all automatically
    removed by GCC, even using its lowest level of optimization.


    Is this reasonable?'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'I would argue that it isn''t, as no sane programmer would write a no-op loop
    of this sort by accident – it cannot be a mistake. In addition, its only purpose
    can be to waste time and for a compiler to eliminate it is working against the
    intention of the programmer.


    There are two solutions to this problem – switch off optimization or mark the
    loop variable as *volatile*:


    ```

    ```

    for(volatile int i=0; i<1000; i++){};

    ```

    ```


    This tells the compiler that the loop variable is special in that it could be
    modified by "external" influences. For example, you might mark a variable as *volatile*
    if it corresponds to a hardware register that is updated independently of the
    program – a timer or an input device.


    The *volatile* modifier has the desired effect and the compiler no longer removes
    the loop, but it has additional effects. The most important is that *volatile*
    stops the compiler from moving the variable into a register. A standard optimization
    is to move the loop index from a location in memory, into a register. The register
    is used for the duration of the loop and the final value is moved back into memory
    when the loop ends if the variable is still in scope. A more important issue,
    however, is that marking the index variable as *volatile* gives the wrong impression
    of the intent, unless other programmers also know that this is a "trick" to stop
    the compiler removing no-op loops.


    Removing no-op loops is an example of optimization by dead-code elimination. The
    problem is that one programmer''s dead-code is another''s essential behavior.
    In the standards, dead-code is loosely defined as code that has no observable
    effects, i.e. an operation that seems to do nothing and has no side effects.


    The problem is that it is very difficult to work out what has no observable effects.
    Assigning to a variable that you then don''t use has no observable effects as
    long as it isn''t a hardware-based register controlling something. Similarly a
    no-op loop has no observable effects unless you include the time it takes to run
    and time is not on the list of considerations of the standards writers. This clearly
    marks them out as having a very particular set of applications in mind when constructing
    a standard for C and isn''t one that fits particularly well with C being used
    in low-level, hardware-oriented, code.


    For many C programs time is important and should not be optimized away to nothing.


    Dead code removal can also have effects when the compiler just can''t anticipate
    the side effects of human intervention. Clearly any obvious interaction with the
    outside world is recognized as "observable" and it isn''t ever treated as dead
    code. However, when interrupts and traps come into the picture things aren''t
    so obvious. For example, many microprocessor systems'
  merge: -1
  img_proc: true
- pgno: 183
  md: "have additional controls via a JTAG probe. In this case sometimes it is a good\
    \ idea to halt the program at a position of interest using an infinite loop:\n\
    while(1);\n\nthe rest of the program follows and the idea is that the JTAG is\
    \ used as a hardware debugger to restart and trace the program. Of course, what\
    \ happens is that the optimizing compiler removes all of the code following the\
    \ while as it is clearly unreachable and hence clearly dead code.\n\nAnother example,\
    \ is when an exception is an observable effect, but the dead code is still eliminated.\
    \ For example:\n\n```\nint a; \nint b = 0; \na/b;\n```\n\nshould throw an exception,\
    \ but on GCC in default optimization mode it doesn't. The code is clearly dead\
    \ as the result of a/b is never used, but it does have a side effect in that division\
    \ by zero should always throw an exception. If you change the final line to:\n\
    \n```\nint c = a/b;\n```\n\nthen the exception occurs even though c is never used!\
    \ You could say such a stupid program doesn't deserve consideration, but if you\
    \ were writing a test to see if an exception was thrown you might want to disagree.\
    \ Even stupid programs sometimes have their uses. Interestingly, marking a and\
    \ b as volatile changes things, but only in that a and b are not optimized away,\
    \ only the operation of a/b is removed:\n\n```\nvolatile int a; \nvolatile int\
    \ b = 0; \na/b;\n```\n\nThere are many other examples, but the point here isn't\
    \ so much to complain about compilers and standards which go against what you\
    \ might want to do, but to expose the fact that compiler optimization isn't a\
    \ simple concept or process. In practice, there are generally well-known ways\
    \ around these problems – either turning off the offending optimization or making\
    \ sure that the code has observable effects. This is not to say that programmers\
    \ don't waste a great deal of time because of unwanted optimizations – far more\
    \ time than that due to compiler bugs and errors. For example if you haven't seen\
    \ it before trying to work out why a timing no op loop appears to take no time\
    \ at all can take a great deal of effort.\n\nIt is also important to realize that\
    \ optimizing compilers are a good thing, despite the occasional clash with the\
    \ programmer's intent. It is very rare that I have been able to improve on the\
    \ assembly language produced by GCC and reading it is often an education in itself."
