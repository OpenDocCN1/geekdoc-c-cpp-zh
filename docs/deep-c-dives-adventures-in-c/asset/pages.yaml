  md: '# ## Dive 10

    ## Pointers


    > With great power comes great responsibility.

    - Spider-Man


    C has pointers and you can use them as you like. This allows for a completely
    free and unrestrained use of the most powerful tool in computing. It is not surprising
    that C programmers love pointers and bemoan their loss if cast to a less freedom-loving
    language.


    You could say that the whole point of C is pointers.


    All this is true, but using pointers well is the difference between a beginner
    and a master. You can also say that pointers are the biggest reason for treating
    C as a dangerous language. Yet languages that are proposed to replace C generally
    have to provide something like pointers, usually confined to “unsafe” blocks to
    make it practical. Even languages that are considered safe, such as Rust, have
    to restrict the use of pointers to a limited range of data types to make them
    safe. In Rust you can only create tree-like data structures in safe mode and this
    means that if you want to create something that isn''t tree-like you have to move
    to unsafe code.


    Pointers are considered dangerous because they give you the power to access any
    part of the memory, possibly including areas you don''t own. They are complicated
    enough to make mistakes common and they are very easy to subvert.


    Pointers are all about addresses and as such are at the core of low-level programming.


    # ### The Address Operator


    There is a sense in which variables are already pointers. When you write:


    ```

    ```c

    int myVar = 42;

    ```

    ```


    myVar has a memory address associated with it and 42 is stored in that location.'
