- pgno: 135
  md: 'If the lifetime of the pointer corresponds to the lifetime of the heap block
    then there isn''t much point in using it as this is true of an auto variable.
    In practice it is common for functions that create a heap variable to pass the
    pointer back to the calling program for it to use and thus the lifetime of the
    heap variable is longer than that of the function.


    # Dynamic Allocation


    One of the big advantages of using the heap is that you can ask for as much memory
    as you need at the time that you need it. Auto variables allocate memory as the
    program runs, but the size of the allocation is fixed at compile time – there
    are exceptions, see later.


    For example, when you declare an array the compiler has to know how big the array
    is. That is, in C89:


    ```

    int myArray[10];

    ```


    is legal:


    ```

    int myArray[N];

    ```


    isn''t. C99 relaxes this so that N can be determined at runtime. This is a so-called
    “variable length array”, VLA, and compilers such as GCC will let you use a VLA,
    even if you ask to use C98. The VLA idea is so useful that it has spread beyond
    its original bounds, even if C11 marks it as optional. This said, it is worth
    noting that the Microsoft C compiler doesn''t support it and if you want to write
    portable code it is a good idea to avoid it. For this reason the Linux community
    spends a great deal of time removing VLAs from its code base.


    So how can you create a dynamic array without VLAs? The answer is you can use
    malloc:


    ```

    int N = 10;

    int *myArray = (int*) malloc(sizeof(int)*N);

    myArray[0] = 42;

    *(myArray+1) = 43;

    printf("%d\n", myArray[1]);

    ```


    This allocates a one-dimensional array of 10 ints which can be used with indexing
    or with pointer arithmetic. As always, the block of memory remains allocated until
    you free it and the lifetime of the pointer myArray is determined as usual.'
  merge: -1
