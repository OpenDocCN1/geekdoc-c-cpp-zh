- pgno: 165
  md: '# Value Semantics


    Structs, unlike arrays, apply value semantics. What this means is that the variable
    associated with the struct behaves as if the struct was its value. Contrast this
    to the variable associated with an array behaving as if it was a reference i.e.
    a pointer to the array. You cannot assign one array to another because the variables
    only hold references to arrays, but you can assign an array to a pointer:


    ```

    ```c

    int myArray1[10];

    ```

    ```


    ```

    ```c

    myArray1[0] = 42;

    int *myArray2 = myArray1;

    myArray2[0] = 43;

    ```

    ```


    In this case, changing myArray2[0] also changes myArray1[0] as there is only one
    array that both variables reference. This is reference semantics at work.


    Compare this to:


    ```

    ```c

    myStructType myStruct1;

    ```

    ```


    ```

    ```c

    myStruct1.myfield1=42;

    myStructType myStruct2=myStruct1;

    myStruct2.myfield1=43;

    ```

    ```


    In this case, the contents of myStruct1 are copied to the new myStruct2. If you
    now change myStruct2 it has no effect on myStruct1. This is value semantics at
    work.


    Put simply, unless you explicitly use a pointer, any operations involving a struct
    generally involve making a copy of all of the struct’s data. When you pass an
    array to a function then it is a pointer which is passed and the function works
    with the same copy of the array as the calling program. When you pass a struct
    to a function, a copy of the struct is made on the stack for the function to work
    with in isolation, i.e. it is passed by value.


    What is more a struct is returned by value. That is, if you create a struct within
    a function as an auto then it is created on the stack. If it is returned to the
    calling program then its value is copied to the calling program’s stack and it
    is safe to use, even though the original is destroyed. This is not the case with
    arrays. For more about functions, value and reference see Dive 13.


    It comes as a surprise to many programmers that structs are value types for the
    simple reason that a struct can be large and making copies of large amounts of
    data isn’t very efficient. The solution to this problem is to make use of a pointer
    to a struct and pass this instead. As a C program becomes more sophisticated,
    the tendency to use pointer to struct makes a struct look more like a reference
    type.'
  merge: -1
  img_proc: true
- pgno: 166
  md: "# It’s Just a Block of Memory\n\nAt this point it is worth starting to think\
    \ of the struct type as defining how a block of memory is divided up into subtypes.\
    \ For example, when you write:\n\n```\nstruct myStructType{\n    int myfield1;\n\
    \    float myfield2;\n};\n```\n\nyou are saying that any block of memory that\
    \ this struct is applied to will have sizeof(int) bytes as an int followed by\
    \ sizeof(float) bytes as a float. When you create such a struct, the compiler\
    \ allocates the correct amount of memory to store the field. This means that struct\
    \ has to have a known size at compile time. What this means in practice is that\
    \ you can't use a VLA in a struct and any types you use have to be fully defined\
    \ at compile time, although see later for how to include a dynamic array.\n\n\
    The memory for the struct is allocated according to where the declaration is.\
    \ If it is at file-level then the memory that the struct needs is compiled into\
    \ the program. If it is within a function, then it is allocated on the stack.\
    \ You can also create a struct on the heap by simply allocating the memory and\
    \ casting to the type:\n\n```\nstruct myStructType *myStruct=\n    (struct myStructType\
    \ *) malloc(sizeof(struct myStructType));\n```\n\nAll of the usual lifetime rules\
    \ apply to structs.\n\nNotice that a pointer to a struct can be used in the usual\
    \ way:\n\n```\n(*myStruct).myfield1 = 42;\n```\n\nbut you do need the parentheses\
    \ as the . operator has a higher priority than the * operator. To make this easier\
    \ you can also use the -> operator to dereference and access the field:\n\n```\n\
    myStruct->myfield1 = 42;\n```\n\nNo dereferencing or parentheses needed.\n\n#\
    \ Padding\n\nThe only tricky part is that a struct may actually use a larger block\
    \ of memory than you might expect. The reason is “padding” due to the need for\
    \ memory accesses to be aligned to word boundaries. For example in a 32-bit machine\
    \ the address of a 32-bit int would have to be a multiple of four because the\
    \ memory is divided into 4-byte words, accessible in a single read/write.\n\n\
    Some machines demand that memory accesses are aligned, others allow unaligned\
    \ access, but warn that it is slower. If alignment is optional, some"
