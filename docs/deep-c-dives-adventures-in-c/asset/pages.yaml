  md: '# # The Void Type


    Even in the days of Algol 68, the void keyword''s meaning had expanded beyond
    just stating that a function didn''t return a value – it had become a type. Rather
    than being a type that breaks the rules, as in “null and void”, void is a type
    that is anything. This is a little confusing for the beginner attempting to make
    sense of void used in a function – does it mean it returns a void type? Only if
    nothing is the void type and this isn''t a good conclusion to draw.


    What does void being any type actually mean?


    You can''t declare a variable of type “anything” because, in C at least, all variables
    have to have a known type so that the compiler can allocate storage for them.
    When you use:


    ```

    int myVar;

    ```


    the compiler usually allocates four bytes to the variable, although this is machine-dependent.
    What would the compiler allocate if you wrote:


    ```

    void myVar;

    ```


    The only sense that a void type can exist is if we can allocate a sensible amount
    of storage for it. The solution is to use void pointers. As explained in Dive
    10, a pointer is a variable that stores the address of another item of data. A
    pointer always takes the same amount of memory to store, even though it is system-dependent.
    Of course, what the pointer references can be anything, so:


    ```

    void *myPointer;

    ```


    creates a pointer that can reference anything.


    How best to think of a void pointer?


    At the lowest level you can think of a void pointer as referencing the start of
    a block of memory, but this view has a problem. To access parts of the block of
    memory you would need to do pointer arithmetic. For example, to access the $20^{\text{th}}$
    element of the block you might try:


    ```

    myValue=*(myVoidPointer+20);

    ```


    The idea is that the value stored at the address given by myVoidPointer plus 20
    is to be retrieved and stored in myValue. The problem here is we don''t know what
    the basic unit of allocation is. In other cases, pointer arithmetic works in units
    of the basic type being referenced.'
  merge: -1
  img_proc: true
- pgno: 93
  md: "For example:\nint *myIntPointer;\n\ni\nmyValue=*(myIntPointer+20);\n\nIn this\
    \ case the addition is equivalent to 20*sizeof(int) and we are retrieving the\
    \ 20\\u00b9 integer stored in the block of memory as if the block was an array.\n\
    \nSo what does myVoidPointer+20 mean?\n\nBy analogy it has to be: myVoidPointer+20\\\
    u00d7sizeof(void)\n\nand the only sensible value for sizeof(void) is 0.\n\nThis\
    \ doesn't work and from C99 onwards void pointer arithmetic is not allowed. Earlier\
    \ standards were confused on the issue. Some use:\n\nsizeof(void)=sizeof(char)\n\
    \nwhich sort of makes practical sense, but if this is what you want you could\
    \ simply cast the pointer to char:\n\n(char*)myVoidPointer+20\n\nSo don't do void\
    \ pointer arithmetic. It doesn't make any sense, even if your compiler allows\
    \ it.\n\nIf you can't use a void pointer to manipulate memory, what use is it?\n\
    \nIts only use is when you don't know what the type of the data will be or when\
    \ you need to change its type on the fly, as for example in:\n\n```\nvoid *get(void\
    \ *p, int type, int index)\n{\n    switch (type)\n    {\n    case 1:\n       \
    \ return (int *)p + index;\n    case 2:\n        return (char *)p + index;\n \
    \   }\n    return NULL;\n}\n```\n\nYou can see that the type of the pointer passed\
    \ is resolved at runtime using the type parameter. Without this approach you would\
    \ need a get function for each type."
