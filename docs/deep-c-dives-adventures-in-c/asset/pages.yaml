- pgno: 45
  md: '# Negative Problems


    So far it looks as if casting is trivial because all it does is add some zeros
    or chop off some bits but things are made slightly more complicated by the use
    of two''s-complement to represent negative values. This is so common that we have
    to consider what happens when we cast a signed value. So far every thing we have
    examined applies to unsigned variables or signed variables that have a positive
    value. Things only get interesting for signed variables that have negative values.


    Consider for example:


    ```

    signed char a = -1;

    int b = (int)a;

    ```


    The bit pattern for an eight bit -1 is

    1111 1111

    If this is promoted to 32 bits by adding zeros this becomes:

    0000 0000 0000 0000 0000 0000 1111 1111

    which is 255, i.e. a positive value. This is not good, as promoting an integer
    should not change its meaning - after all the 32 -bit value can certainly represent
    two''s-complement -1.


    The solution is to use a “sign extend” principle when promoting signed values.
    What happens is, if the cast is between signed values the top most bit of the
    smaller value is extended to fill the new bits in the larger value.


    So when you do:


    ```

    signed char a=-1;

    int b=(int)a;

    ```


    the bit pattern in a:

    is promoted by sign extension to:

    1111 1111 1111 1111 1111 1111 1111 1111

    which is -1 in 32-bit two''s-complement.


    The important point is that a cast to a bigger signed value extends the “sign
    bit”, i.e. the most significant bit, be it a zero or a one.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# # Static or Dynamic Casting


    Notice that now we have crossed a line. The original intent of casting was altering
    how we interpreted the bits with no changes to the bits. If you cast from signed
    to unsigned or vice versa with the same number of bits then no bits are changed
    in the cast.


    For example:


    ```

    signed char myVar1=-1;

    unsigned char myVar2= (unsigned char)myVar1;

    printf("%hu\n",myVar2);

    ```


    This stores 11111111 in myVar1 and this is interpreted as -1 in a two''s-complement
    representation. Assigning this with a cast to unsigned char stores the same unmodified
    bit pattern in myVar2 and this is interpreted as 255, a simple binary number.
    This example frequently crops up, but it demonstrates that a cast just changes
    the way you view the bit pattern.


    It’s only when we move to signed representations with different numbers of bits
    that we break the principle and modify the bits.


    For example:


    ```

    signed char myVar1=-1;

    unsigned int myVar2= (unsigned int)myVar1;

    printf("%u\n",myVar2);

    ```


    Now the bit pattern:

    11111111

    is expanded to:

    1111 1111 1111 1111 1111 1111 1111 1111

    because of sign extension.


    You could argue that, even for positive values, adding leading zeros is modifying
    the bits and you would not be wrong, but we now have the idea of manipulating
    the bits as part of a cast and this is strictly a process of dynamic type conversion,
    where the bit pattern is secondary to preserving its current meaning - which is
    arguably better handled by conversion functions.


    The best example of this is floating-point casts.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# ## Floating Point


    The bit patterns used for integer types and floating-point types are quite different
    and the idea of casting one to another is slightly crazy if a cast means reinterpreting
    the same bit pattern. For example, a float uses four bytes to represent a sign
    bit, exponent and mantissa:


    ![](img/5f2ea21c2077d473344a0fdf144677b9_47_0.png)


    Clearly interpreting this as a 4-byte int isn''t going to be a generally useful
    thing to do. If you try casting a float to an int you will discover what really
    happens:


    ```

    ```

    float myVar1=41.9;

    int myVar2=(int)myVar1;

    printf("%d\n",myVar2);

    ```

    ```


    The result is that 41 displays – the float has been converted to an integer and
    truncated, giving 41.


    If you try this with -41.9 you will discover that you get -41.


    This works the other way as well:


    ```

    ```

    myVar1=(float)42;

    printf("%f\n",myVar1);

    ```

    ```


    and myVar contains 42.0. Notice that it is possible to try to cast a float or
    a double to an int that cannot represent the value because it is too large. This
    is “undefined behavior”, but in practice the most common option is to assign the
    largest integer value.


    Finally, as a result of dynamic casting, there is no elementary way to gain access
    to the bytes that make up a float using casts. To find out how to do it we need
    to look at type punning and unions – see Dive 15.


    # ## Final Word


    The idea of a cast starts out as being a way to change the interpretation of a
    bit pattern, but it quickly has to give in to the temptation of actively converting
    the bit pattern so that it represents the same quantity in the new type. Other
    languages give in and create a set of type conversion functions to do the job.
    C does have what look like type conversion functions, but they are actually arithmetic
    functions. For example, round converts a float to a float while rounding it to
    an integer. If you also want it to convert to int then you need a cast – if only
    an implied cast.'
