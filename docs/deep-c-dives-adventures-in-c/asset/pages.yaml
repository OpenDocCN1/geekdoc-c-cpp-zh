- pgno: 81
  md: "# **Dive 6**\n\n# **The Brilliانت But Evil for**\n\n> *“We all know Linux is\
    \ great… it does infinite loops in 5 seconds.”*  \nLinus Torvalds\n\nIf you need\
    \ proof of that C is a machine independent assembler, look no further than the\
    \ for loop. It is closer to the metal than a for each or for in loop found in\
    \ other languages and yet it has been deeply influential. So much so that the\
    \ C for loop has made its way into Java, JavaScript, Go and many other higher-level\
    \ languages.\n\nThe C for loop is brilliant in that it allows many “creative”\
    \ uses of the construct and it is evil for exactly the same reason. More accurately\
    \ it fails to capture the fundamental idea of an enumeration.\n\n# ### Quick Guide\
    \ To The Loop Zoo\n\nIn the early days of programming we created loops to repeat\
    \ instructions. This was a largely ad-hoc affair and not many stepped back from\
    \ the code face to consider what was going on. Later we could consider the whole\
    \ idea of repeating something and how many different varieties of loop there actually\
    \ are and are actually needed.\n\nThe first big distinction is between the enumeration\
    \ and the conditional loop. An enumeration loop is simply doing something a given\
    \ number of times. Sometimes the number of times is implied by the number of things\
    \ to process, e.g. the number of items in a data structure that need examining.\
    \ Pure enumeration loops are often written as for loops of varying abstraction:\n\
    \n```\n```\nfor i=1 to 10\nfor each x in array\nfor each value in 1 to 10\n```\n\
    ```\n\nand so on.\n\nSome languages even have enumeration loops like:\n\n```\n\
    ```\nrepeat 10 times\n```\n```\n\nalthough this form isn’t particularly flexible."
  merge: -1
  img_proc: true
- pgno: 82
  md: "The alternative to an enumeration loop is the conditional loop which repeats\
    \ something until a condition is satisfied. You can tell the difference between\
    \ the two loops by asking the simple question \"do you know how many times the\
    \ loop will repeat before the loop starts?\". If you know that the loop will repeat\
    \ x times before it even starts then you have an enumeration loop. Even when you\
    \ do have an enumeration loop it is sometimes easier to write it as a conditional\
    \ loop.\n\n# ## Conditional Loops\n\nA conditional loop has one of a number of\
    \ possible forms but a common one is:\n\n```\n```\ninitial set up\ntest to see\
    \ if loop should continue\n\tbody of loop\nupdate test condition\nend of loop\n\
    ```\n```\n\nFor example using C to implement this sort of loop directly:\n\n```\n\
    ```c\nint i = 0;                \\u2190 initial set up\nloopStart:\n   if (i >=\
    \ 10)           \\u2190 test to see if loop should continue\n      goto loopEnd;\n\
    \   printf(\"%d\\n\", i);    \\u2190 body of loop\n   i++;                  \\\
    u2190 update test condition\n   goto loopStart;\nloopEnd:\n   printf(\"end of\
    \ loop\"); \\u2190 end of loop\n```\n```\n\nYou can clearly see the different\
    \ parts of the loop and the way that gotos are used to jump to the appropriate\
    \ points in the code. Not long ago all programming was like this and it mirrors\
    \ the way that a conditional loop is implemented in assembler. Today we prefer\
    \ to use high-level language constructs that bundle all of the sections up into\
    \ fixed parts of the construct so you don't have to waste time building your own\
    \ from scratch.\n\n# ## The C for Loop\n\nThe conditional loop in the previous\
    \ section is in fact an enumeration loop and could more easily be expressed in\
    \ Basic as:\n\n```\n```\nfor i = 0 to 9\n   print(i)\nnext i\n```\n```\n\nor in\
    \ Python\n\n```\n```python\nfor i in range(0,10):\n   print(i)\n```\n```"
  merge: -1
  img_proc: true
- pgno: 83
  md: "C takes the approach that it is better to package the parts of a general conditional\
    \ loop rather than invent a proper enumeration loop. The C for loop, and it would\
    \ be better called a conditional loop, is:\n\n```\n```c\nfor(initial set up; test\
    \ if loop should continue; update test condition){\n    body of loop\n}\n```\n\
    ```\n\nWhen you write a C for loop the compiler uses the expressions to construct\
    \ a conditional loop. For example:\n\n```\n```c\nfor(i = 0; i < 10; i++){\n  \
    \  printf(\"%d\\n\", i);\n}\n```\n```\n\nis equivalent to the previous conditional\
    \ loop:\n\n```\n```c\nint i = 0;\nloopStart:\n    if (i >= 10) goto loopEnd;\n\
    \    printf(\"%d\\n\", i);\n    i++;\n    goto loopStart;\nloopEnd:\n    printf(\"\
    end of loop\");\n```\n```\n\nThe i = 0 is performed before the loop starts, the\
    \ i < 10 is evaluated at the start of the loop and the body of the loop only executes\
    \ if it is true and the i++ is performed at the end of the loop before the next\
    \ potential repeat. Notice that the condition in the for loop has to be true for\
    \ the loop to continue. In the example conditional loop the condition has to be\
    \ true for the loop to end but this is a minor difference.\n\nIn this form the\
    \ C for loop is perfectly OK as an enumeration loop. All C programmers learn this\
    \ form as an idiom and read it as a loop that repeats for i from 0 to 9. It is\
    \ as if the C for loop is frozen in a restricted but useful form:\n\n```\n```c\n\
    for(index=startvalue; index=endvalue; index++){\n}\n```\n```\n\nand the only things\
    \ you ever change are the startvalue and endvalue and the loop repeats for index\
    \ from the startvalue to one less than the endvalue. In this form it really is\
    \ an easy to use enumeration loop. From here most C programmers learn to vary\
    \ it slightly to get different effects."
