- pgno: 164
  md: "For example:\n\n```\nstruct{\n    int myfield1;\n    float myfield2;\n}\n```\n\
    \nand the variable is myStruct. This form of struct type is called an \"anonymous\
    \ struct\" because the type itself lacks a name other than struct. You can take\
    \ this a little further by giving the type a name, a tag. This allows you to reuse\
    \ it. For example:\n\n```\nstruct myStructType{\n    int myfield1;\n    float\
    \ myfield2;\n};\nstruct myStructType myStruct;\n```\n\nYou can use struct myStructType\
    \ as often as you like to create as many structs of the type as you need.\n\n\
    The full name of the type is struct myStructType and you can get rid of the struct\
    \ part of the name by using a typedef\n\n```\ntypedef struct {\n    int myfield1;\n\
    \    float myfield2;\n}myStructType;\n\nmyStructType myStruct;\n```\n\nNow the\
    \ anonymous struct has been given the name myStructType and it can be used in\
    \ the standard way to declare as many variables as you like. Introduced like this,\
    \ the C struct declaration doesn't seem in the least bit illogical and it is quite\
    \ obvious why there are different ways of declaring a struct.\n\nThe main use\
    \ of the anonymous struct is to declare struct fields in other structs. For example:\n\
    \n```\nstruct{\n    struct {int a,b;} myStruct1;\n    float value;\n}myStruct2;\n\
    \nmyStruct2.value=4.2;\nmyStruct2.myStruct1.a=42;\n```\n\nThere are many other\
    \ struct idioms that make using structs more compact."
