- pgno: 152
  md: '# Calling Conventions


    So far we have taken the simplified view that arguments are pushed onto the stack
    for use by the function and the return value is also passed back on the stack.
    In practice, exactly how this happens is important and it gives rise to the idea
    of the calling convention, i.e. the rules for passing parameter values.


    The simple-minded view is that the calling convention doesn''t matter as your
    program will be compiled by a compiler using a single calling convention and,
    as this just works, the details hardly matter. In practice, however, your program
    is going to need to call functions provided in libraries that are already compiled.
    For example, under Windows you can call functions in pre-compiled DLLs, Dynamic
    Link Libraries. In Linux you can call functions defined in shared or `.so` libraries.
    Even if you are not using libraries, you most likely want to call functions provided
    by the operating system. In any of these cases it is important that both the calling
    code and the callee make use of the same calling convention.


    Calling conventions specify the order in which arguments are pushed onto the stack
    and, to improve performance, they may specify an order in which registers are
    used in place of the stack. For example, Microsoft defined the `fastcall` convention
    where the first two arguments are passed using the ECX and EDX registers and any
    additional ones are pushed onto the stack from right to left. Of course, many
    functions only have one or two parameters and so these will be faster as the stack
    isn''t used at all.


    Mostly you can ignore the calling convention as the compiler will use the one
    most appropriate for the system you are using, but sometimes foreign code requires
    a specific calling convention and then you need to tell the compiler what to use.
    For example, in 32-bit Windows systems, functions use the `stdcall` convention,
    but most C programs use the `cdecl` calling convention. Another reason for selecting
    a particular calling convention is to optimize the code. For example, Microsoft
    introduced the `vectorcall` convention which extended the `fastcall` convention
    to allow larger data structures to be passed in 128- and 256-bit registers, significantly
    speeding up graphics operations.


    The idea of a calling convention leads on to the bigger concept of an Application
    Binary Interface, ABI. This not only defines a calling convention, but also how
    data is laid out in memory so that pre-compiled binary code can use other pre-compiled
    binary code. If an ABI changes then generally all of the code that works together
    has to be recompiled.'
  merge: -1
  img_proc: true
- pgno: 153
  md: "# ## Ignoring Parameters\n\nAlthough mentioned in Dive 7 on `void`, it is worth\
    \ repeating that the declaration:\n\n```\n```c\nvoid function();\n```\n```\n\n\
    is not a function with no parameters. It is a function with an unknown number\
    \ of parameters. That is, following this declaration you can define a function\
    \ with any number of parameters including none:\n\n```\n```c\nvoid function(int\
    \ a, int b) {};\n```\n```\n\nTo specify that a function takes no parameters you\
    \ need to use:\n\n```\n```c\nvoid function(void);\n```\n```\n\nAfter this declaration\
    \ you can only define a function with no parameters - anything else generates\
    \ an error.\n\nIf you specify a given number of parameters, then you have no choice\
    \ but to supply them all when calling the function. This raises the question of\
    \ what to do when a particular call doesn’t need some of the parameters. In other\
    \ words, how do you implement optional parameters in C? The usual answer is that\
    \ you have to pass a value that indicates that the parameter is a dummy. The most\
    \ common choice of value is `NULL`, which seems sensible until you think about\
    \ what value is actually passed.\n\nFor example, if you have a function which\
    \ finds the maximum of three values:\n\n```\n```c\nint max(int a, int b, int c)\
    \ {\n    if(a>=b && a>=c) return a;\n    if(b>a && b>=c) return b;\n    return\
    \ c;\n}\n```\n```\n\nThen `max(-1, -2, -3)` will return `-1` as this is the largest\
    \ value. Now suppose you want to use `max` to find the maximum of just two values.\
    \ You might be tempted to use:\n\n```\n```c\nmax(-1, -2, NULL);\n```\n```\n\n\
    but this results in `max` being returned as `0` instead of `-1`. The reason is,\
    \ of course, that `NULL` is just a macro that expands to `0` and the call is:\n\
    \n```\n```c\nmax(-1, -2, 0)\n```\n```\n\nwhich results in `0` being the maximum.\n\
    \nYou might think that this can be fixed by testing for `c` being `NULL`:\n\n\
    ```\n```c\nif(c = NULL) ...\n```\n```\n\nbut this simply rules out setting `c`\
    \ to a valid zero value."
  merge: -1
  img_proc: true
- pgno: 154
  md: "In this case the only safe way of ignoring a parameter is to set it to the\
    \ same value as either a or b:\n\n```\nmax(-1,-2,-1);\n```\n\nreturns -1 as the\
    \ max and clearly setting c to the same value as a or b cannot change the result.\n\
    \nIgnoring a parameter is in general difficult as you need a value to use as a\
    \ sentinel that isn’t valid in normal use and zero disguised as NULL isn’t usually\
    \ a good choice.\n\nYou can usually avoid the problem by including a flag parameter\
    \ which indicates if the optional parameter is used:\n\n```\nint max(int a, int\
    \ b, int c, int number){\n    if (number == 2) c = a;\n    if (a >= b && a >=\
    \ c) return a;\n    if (b >= a && b >= c) return b;\n    return c;\n}\n```\n\n\
    and now it is safe to set c to NULL:\n\n```\nmax(-1,-2,NULL,2);\n```\n\nIn general,\
    \ arranging for an optional parameter is something that needs a lot of thought.\
    \ Perhaps the one exception is when the passed value is an address:\n\n```\nint\
    \ max(int *a, int *b, int *c){\n    if (*c == NULL){\n        if (*a >= *c) return\
    \ *a;\n        else return c;\n    }\n    if (*a >= *b && *a >= *c) return a;\n\
    \    if (*b >= *a && *b >= *c) return b;\n    return c;\n}\n```\n\nNow you can\
    \ call the function using NULL as an indicator that c isn’t used:\n\n```\nmax(&x,\
    \ &y, NULL);\n```\n\nas zero is almost never a valid address.\n\nIn short NULL\
    \ is useful when passing pointers, but not so much for other types.\n\n# Variadic\n\
    \nPerhaps the ultimate in ignoring parameters is the variadic function. “Variadic”\
    \ is derived from “vari”, variable, and “adic” meaning the number of parameters.\
    \ A variadic function can accept a variable number of parameters. This sounds\
    \ good, but C’s implementation is fairly primitive compared to what other languages\
    \ can do. You have already been using a variadic function for most of your C programming\
    \ career – the printf function is variadic."
