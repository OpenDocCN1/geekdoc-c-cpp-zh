    ErrorNo %d\\n\", ErrorNo);\n\t}\n\treturn 0;\n}\n```\n\nThe example main program\
    \ handles the expression and removes the entry in the array. If you choose to\
    \ re-raise the exception then the previous jmpbuf element is used and in this\
    \ case it takes the control back to InitializeException and so ends the program.\
    \ If there was another try-catch in a function next up in the call chain then\
    \ its catch clause would be executed with the same error number.\n\nIs this approach\
    \ a good idea? Probably not. Keeping an array of exceptions to return to is likely\
    \ to be a fragile construct. It works, but what about it being used in ways you\
    \ never thought of. It is difficult to make this sort of construct robust. This\
    \ doesn't mean that the setjmp and longjmp are a waste of time, but they are probably\
    \ best used where they do direct and obvious good and without any syntactic sugar."
