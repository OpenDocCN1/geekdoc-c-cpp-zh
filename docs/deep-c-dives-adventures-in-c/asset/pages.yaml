  md: "We can use this something like:\n\n```\n```\nint main(int argc, char **argv)\n\
    {\n    int *myLocalVar;\n    myLocalVar=myFunction();\n    printf(\"%d\\n\", *myLocalVar);\n\
    \    *myLocalVar=42;\n    myLocalVar=myFunction();\n    printf(\"%d\\n\", *myLocalVar);\n\
    \    return 0;\n}\n```\n```\n\nThis works and the static variable is changed by\
    \ the main program.\nIs this a good idea?\n\nIt is safe in the sense that the\
    \ variable is allocated at a fixed location and always exists. The only downside\
    \ is that the function is not re-entrant, i.e. if another thread calls it while\
    \ it is being used then the static variable is not reallocated. Compare this to\
    \ a function which only uses automatic local variables and allocates any other\
    \ memory on the heap. Such a function is by default re-entrant.\n\nIt may be safe,\
    \ but it is difficult to implement a scheme that can control the access to the\
    \ static variable. One possibility is to use access functions to hide the implementation\
    \ of the state representation from its clients.\n\nIt is also worth noting that\
    \ there is nothing to specify how static variables are to be implemented. However,\
    \ implementing them as file-level variables with restricted access is so easy,\
    \ it is difficult to think of a reason why a compiler would do anything else.\n\
    \n# ## Static v Heap\n\nIf you know about heap storage, see Dive 12, then you\
    \ might be thinking that as static is easier to use than heap storage, why not\
    \ use it in preference. The advantage of static storage is that no pointers are\
    \ involved in its creation or management. Its disadvantage is that it isn't possible\
    \ to manage it at all.\nHeap storage can be freed and resized whereas static storage\
    \ is fixed.\n\nUsing static storage can also add to the size of the program file.\
    \ Static storage and file-level storage is most easily implemented by being compiled\
    \ into the program and how efficiently this is encoded in the source file varies,\
    \ but it is possible that if you declare a 1MByte static array the size of your\
    \ executable increases by 1MByte. This also increases the time it takes to load\
    \ your program."
