- pgno: 136
  md: '# Dynamic Multidimensional Arrays in C89


    What about a multidimensionally dynamically allocated array? Here the problem
    is that before C99 there was no way to specify the size of the dimensions and
    these are needed to compute the SMF. In this case the only simple solution is
    to implement the SMF directly. As we will shortly discover, in C99 and later there
    is a better solution.


    For example, for an M rows by N columns array:


    ```

    int *myArray = (int *)malloc(sizeof(int) * N * M);

    int *p = myArray + (i * N + j);

    printf("%d\n", *p);

    ```


    This displays myArray[i][j], but notice that indexing doesn''t work in this case
    as the compiler has no idea of the “shape” of the array. You can''t use the array
    pointer cast that works with a fixed size array because until C99 there was no
    way to specify a pointer to an array of a given size – see later and see Dive
    11.


    The best you can do is to create a pointer to an array with all but one dimension
    fixed in size. The reason that this is so is that for a 2D array the compiler
    needs to know the size of each row, i.e. N, so that it can compute the SMF, but
    once we have selected the row the pointer arithmetic is in terms of sizeof(int)
    and you don''t need to know the number of rows to work out the SMF. You can see
    that this is true just by looking at the SMF for a 2D array:


    ```

    address = base + i *N *sizeof(int) +j*sizeof(int)

    ```


    where N*sizeof(int) is the size of a single row. The number of rows, M, isn''t
    referenced, which means you can implement the SMF without knowing it.


    For example, if the array is myArray[M,5] then myArray is a pointer to a one dimensional
    array of size 5 and *myArray is a pointer to int. Clearly we cannot do pointer
    arithmetic to work out the SMF but M isn''t used in the calculation. What this
    means is that we don''t have to specify the first dimension in the dynamic array:


    ```

    int M = 6;

    int (*myArray)[5] = (int (*)[5]) malloc(sizeof(int) * 5 * M);

    myArray[1][1] = 42;

    ```


    Notice that only the value of N is fixed at 5 in the declaration of the array
    and the type used is a pointer to arrays of size 5 (see Dive 11 for more on pointer
    to arrays). This has to be so to allow myArray[i][j] to be implemented as:


    ```

    *(*myArray+i)+j

    ```


    with my Array+i adding i*5*sizeof(int) to the pointer. This code allows you do
    dynamically allocate an array equivalent to:


    ```

    int myArray[M][5]

    ```'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'Notice that while you don''t have to fix the size of M, you do have to check
    that you don''t try to access myArray[i][j] for i>=M. If you do you will run off
    the end of the array and the allocated memory.


    # Reallocating


    If it turns out that the array that you are using should have been bigger, you
    can simply reallocate the block of memory to be bigger. The same technique works
    if you need to make the block smaller, but this is a less common action. The principle
    is to use:


    ```

    ```

    p = realloc(ptr, size);

    ```

    ```


    where ptr is to the existing block and p is the pointer to the resized block.
    The operating system will first see if there is enough free memory at the end
    of the block and if there is it is simply added to the existing block. If there
    isn''t, then the operating system searches for a free block big enough and copies
    the data from the old to the new block. The operating system may also attempt
    to defragment the heap to find a block large enough.


    The reallocation idea is simple as long as you are working with one-dimensional
    arrays. In this case the additional block of memory simply adds to the length
    of the array. If you are working with multi-dimensional arrays things are more
    complicated. Adding memory could well change the SMF you need to use and as a
    result elements that were in their correct place might well be in the wrong place,
    even though the reallocation hasn''t moved them.


    The one reallocation that is "safe" is adding rows because that dimension isn''t
    used in the SMF. For example, to reallocate a [M][N] array to [M+1][1] all you
    have to do is:


    ```

    ```

    int *myArray = malloc(sizeof(int) * M * N);

    myArray[1][0] = 42;

    myArray = realloc(myArray,sizeof(int)* (M+1) * N);

    printf("%d\n", myArray[1][0]);

    ```

    ```


    It just works - you see 42 displayed, and you have an additional row to work with.
    However, if you try:


    ```

    ```

    myArray=realloc(myArray, sizeof(int)*M*(N+1));

    ```

    ```


    then you still see 42 displayed, but you cannot correctly access the new column
    as the SMF is still working with M columns. To reform the array to its new structure,
    you need a different pointer type, assuming N is 5:


    ```

    ```

    int (*myArray2)[6] = realloc(myArray, sizeof(int)*M*(N+1));

    printf("%d\n", myArray2[1][0]);

    ```

    ```


    Now we have an array with 6 columns and you will not see 42 displayed because
    this is now stored in myArray2[0][5].


    Reforming arrays is easier when you make use of VLAs, see below, but you always
    have to move elements if you add additional columns.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# The Variable Length Array


    The Variable Length Array, VLA was introduced in C99 and it is optional in C11
    but mandatory in C23. Basically it is an automatic implementation of the dynamic
    array allocation using malloc, but you simply declare the array in the usual way
    and the compiler does the rest. For example, the dynamic array created in the
    previous section can be declared as:


    int myArray(M,N);


    The resulting array behaves just like a standard array and you can use index notation
    or pointer arithmetic to access it.


    There are some important differences, however. A VLA can only be declared as an
    auto and its lifetime is determined by this. When the variable goes out of scope,
    the VLA is destroyed. You don''t have to worry about using free and this is one
    of the claimed advantages of a VLA, but it also restricts its usefulness. Obviously
    you cannot initialize a VLA at compile time and it is re-created, optionally with
    a different size, each time the block of code that contains it is re-entered.
    If you use goto or switch to jump into the scope of a VLA then it might not be
    allocated and if you use longjmp, see Dive 17, – then data can be lost.


    # VLA Type and Dynamic Multidimensional Arrays


    As well as the VLA allowing variable dimensions, the pointer to an array type
    has been extended to allow runtime expressions. That is, in C99 and later, you
    can write things like:


    int (*myArray) [M]


    where M is an expression that is evaluated at runtime. Previously we had to specify
    a constant for M to allow the compiler to work out what to add in pointer arithmetic.
    In this case, myArray+j is equivalent to myArray+j*M*sizeof(int) .


    What this means is that we can now extend our dynamic array allocation using malloc
    to include multi-dimensional arrays that are defined at runtime. For example:


    ```

    int M = 6;

    int N = 5;

    int (*myArray) [N] = (int (*)[N]) malloc(sizeof(int) * N * M);

    myArray[1][1] = 42;

    ```


    Notice this is the same as the previous example but now the value of N is used,
    making the type of (*myArray) [N] only defined at runtime. Even though we are
    using a variable array type, this is not a VLA – it isn''t automatically deallocated
    and we have to remember to free the memory.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# Heap or Stack


    You may have noticed that VLAs have the same lifetime as an **auto** variable.
    This means that they are a natural for stack storage rather than the heap. Indeed,
    the majority of VLA implementations use the stack rather than the heap to store
    VLAs.


    You can even allocate memory on the stack manually using:

    void *p = alloca(size);

    which returns a **void** pointer to a block of memory on the stack. This function
    is part of the standard C library, but not part of a standard. It is compiler-
    and machine-dependent and these are reasons enough to avoid it. As with VLAs,
    it can only be used with an **auto** variable, but unlike VLAs the block of memory
    is released only when the function that created it terminates, not when the pointer
    variable goes out of scope. You should never attempt to release stack memory using
    `free()`.


    Which is better: stack or heap?


    This is a question that is so machine-dependent it is impossible to give a single
    answer. Stack memory is often in short supply in some architectures and in such
    cases heap is always preferable. The automatic releasing of stack memory is its
    one big advantage, but there are problems with jumping into scope using `goto`
    or `select`. It is generally more difficult to detect a memory allocation error
    on the stack than the heap and provoking a stack overflow generally results in
    your program being terminated. With all of this said, it is worth pointing out
    that these same problems occur if you create a fixed-size auto array within a
    block and this is common practice.


    At the end of the day it is simply the non-standard nature of the function that
    makes its use non-ideal.'
