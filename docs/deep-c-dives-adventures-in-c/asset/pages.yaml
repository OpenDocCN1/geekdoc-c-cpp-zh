- pgno: 44
  md: 'For a more concrete example:


    ```

    char a = 42;

    int b = (int)a;

    printf("%d\n",b);

    ```


    which displays 42 and it would be surprising if it didn’t. However obvious this
    might be there is a lot going on. When you store 42 in a, which is a byte variable,
    the bit pattern stored is:


    ```

    0010 1010

    ```


    when you cast it to int the bit pattern is


    ```

    0000 0000 0000 0000 0000 0000 0010 1010

    ```


    assuming that int is four bytes. This may seem a small change but it is a change.
    The original bit pattern is extended by padding it with zeros. When a smaller
    bit pattern is extended in this way it is called a “promotion” although the term
    upcast is also used.


    Of course, sometimes you want to go the other way and reduce the number of bits
    in a representation. In this case you are using a “demotion”, but this terminology
    isn’t much used and downcast is also encountered.


    For example:


    ```

    int a = 42;

    char b=(char)a;

    ```


    The bit pattern in a is:


    ```

    0000 0000 0000 0000 0000 0000 0010 1010

    ```


    and this is demoted to:


    ```

    0010 1010

    ```


    in b. Of course, all that happens is that the bits that cannot be stored in the
    smaller variable are ignored. This can result in loss of data, but exactly what
    this means depends on what the bits represented. For example, if the bits were
    being used to record the state of lights on or off then a demotion would potentially
    lose the state of 24 lights. This might be fine if you only wanted to work with
    the most important eight lights, say.


    When it comes to numbers, demotion has a simple and direct mathematical expression.
    The result of demotion to n bits is to take the original value mod $2^{n}$.  For
    example:


    ```

    (char) b = a % 256

    ```


    Another way of looking at this is that if you demote to n bits then the result
    is what you would have got if the calculation had rolled over at $2^{n}$ – this
    is sometimes useful.'
