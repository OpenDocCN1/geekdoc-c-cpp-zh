  md: '# ## Dive 4

    # Expressions


    > > *“I don’t know what the language of the year 2000 will look like,

    > but I know it will be called Fortran.”*

    >

    > CA Hoare, 1982


    One of the most important concepts in any programming language is the expression
    and C has expressions for most things and knowing how to use them is a big part
    of effective C programming. What might surprise you is that there was a time when
    expressions didn''t exist – they had to be invented. The generally accepted first
    implementation of expressions was in Fortran in 1957. John Backus and his team
    at IBM worked out how to compile expressions into machine code and the same algorithms
    are at work today, compiling C expressions into machine code. C A Hoare might
    have been wrong about what we call the language, but there is a little bit of
    Fortran in every modern language.


    # ## Expressions and Statements


    There are only two types of instruction in C – expressions and statements. The
    simple difference between them is that an expression evaluates to a result and
    a statement doesn''t. The distinction between the two is more subtle than this
    suggests, but if a result is returned then what you have is capable of being included
    in an expression, even if we don''t usually think of the construct as an expression.


    For example, a function call isn''t usually called an expression, but it is if
    it returns a result. Statements are things like for loops, if statements and so
    on, essentially the control structures of C. A statement doesn''t evaluate to
    anything in any situation and so isn''t ever an expression.


    So what is an expression?


    The idea is an old one, dating back to the slow invention of how to write down
    arithmetic. Simple arithmetic has just four operators +, -, x and ÷, corresponding
    to addition, subtraction, multiplication and division. There are a number of possible
    ways to write down an arithmetic procedure, but the most common is to use infix
    notation where the operator is placed between the values it is to operate on.'
