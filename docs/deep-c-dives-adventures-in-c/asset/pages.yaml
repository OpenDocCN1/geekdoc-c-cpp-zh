- pgno: 117
  md: 'In this case the function returns a pointer to an auto variable which is, of
    course, created on the stack and then destroyed as soon as the function returns.
    The pointer that the main program receives has the address of the memory location
    on the stack that the data once occupied. The result is use-after-free.


    This is exactly the problem discussed in Dive 8 where the blame was placed on
    the use of local variables – in fact the culprit is much more the use of a pointer
    to return a reference to something that possibly no longer exists. As explained
    in Dive 8 the worst part of the error is that the error often goes unnoticed because
    the data stored on the stack isn’t overwritten for a while and we seem to get
    the correct result. For example in this case the first printf is very likely to
    display the expected value of 42 but in the process of displaying the value it
    is very likely to overwrite it, causing the second printf to display a spurious
    value.


    Notice the problem goes away if myVar is declared as static, see Dive 9, as the
    variable exists even when the function has returned.


    The C programmer is free to do almost anything with a pointer and this is the
    power that demands the responsibility.


    In fact, you can even create a “use before allocate” error. For example:


    ```

    int *myPointer = 4796436;

    printf("%d\n",*myPointer);

    ```


    In this case we are attempting to access an arbitrary memory location by loading
    an int address into the pointer. This is unlikely to work as most modern hardware
    has protection against a program accessing a memory area it doesn’t own, but if
    you pick an address that is within the program’s address space it does work.


    This sort of code is used a lot in hardware applications where the program needs
    to access registers at fixed memory locations. The point is what appears at first
    to be something so silly that no programmer would ever or should ever do it, has
    a context in which it is perfectly reasonable and sane. A compiler writer who
    thinks that this is so serious an error as to disallow it would make many a C
    programmer unhappy.'
