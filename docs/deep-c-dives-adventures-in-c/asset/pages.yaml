    \ that myTemp refers to. So whether you regard myVar as storing 42 or the address\
    \ of 42 is a matter of how you look at it. There is a sense in which a variable\
    \ is a constant pointer.\nHowever, it is important to realize that myVar isn't\
    \ a pointer and in fact doesn't even exist as an obvious entity in the compiled\
    \ program – the address associated with myVar isn't stored anywhere. It is simply\
    \ a symbolic name for an address which is used to access the data whenever you\
    \ use it.\nThe semantics of value assignment covers up the role that the address\
    \ plays in the transaction and in most languages you cannot directly access the\
    \ address associated with myVar – but in C you can.\n\nThe address operator, &,\
    \ will return the address associated with any variable. The idea is simple, &myVar\
    \ returns the address associated with myVar, but here we hit a snag. An address\
    \ is just a bit pattern like any other item of data, but the format varies between\
    \ different machines. The number of bits used for an address changes and so do\
    \ addressing schemes. Some machines have a linear address space running from *addressmin*\
    \ to *addressmax*, others use multi-level addressing with page or segment number\
    \ followed by offset from the start, and so on. When programming in C, however,\
    \ you don't have to delve into the details. You can simply treat &myVar as a simple\
    \ address.\n\nIf you try something like:\n```c\nint main(int argc, char **argv)\n\
    {\n    int myVar;\n    int myAddress;\n    myAddress=&myVar;\n    printf(\"%d\\\
    n\",myAddress);\n    return 0;\n}\n```\n\nyou will see a value displayed which\
    \ is the address of myVar, but you will also probably see a warning that amounts\
    \ to assigning an address to an *int* isn't a good idea. An automatic cast from\
    \ an address to an *int* saves you from the problem, but in most cases it doesn't\
    \ really help. You take the address of something because you want to access it,\
    \ but when the address is stored in an *int*, all you can do with it is integer\
