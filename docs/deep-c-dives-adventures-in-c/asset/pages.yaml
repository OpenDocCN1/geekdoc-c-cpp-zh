- pgno: 122
  md: 'the array at compile time and adjusts sizeof accordingly. If you pass an array
    into a function then the array is treated as a pointer - it is said to “decay”
    to a pointer, but really all that happens is that the compiler loses track of
    the fact that it is an array and sizeof returns the size of a pointer. These idiosyncrasies
    are imposed as an attempt to make arrays behave more like you would expect them
    to.


    Some programmers are very firm in their opinion that an array is not a pointer
    and, as long as you can see that point of view, you are safe to understand that
    pointers and the SMF are the basis of the C array.


    # Pointer Arithmetic


    The fact that pointers are arrays and arrays pointers leads us to implement pointer
    arithmetic in a very particular way.


    Let’s ask, what is the pointer equivalent of:


    ```

    myPointer[5] = 42;

    ```


    If myPointer references the start of the array then, using the SMF idea, we can
    see that myPointer[5] is the same as:


    ```

    myPointer + 5*sizeof(int)

    ```


    To make this simpler pointer arithmetic is defined as:


    ```

    myPointer + 5 = myPointer + 5*sizeof(int)

    ```


    where the compiler takes care of multiplying by the size of the element type.
    That is, in general:


    ```

    myPointer + i = myPointer + i* sizeof(*myPointer)

    ```


    When you add or subtract from a pointer the arithmetic is done in units of the
    size of the type that is referenced.


    Notice that you can apply pointer arithmetic to an array name. For example:


    ```

    myArray + 5;

    ```


    is exactly the same as:


    ```

    myArray[5];

    ```


    but recall that myArray behaves more like a constant pointer and you cannot assign
    to it.'
