  md: "For example:\n\n```\nint ans = 1+2, 3+4;\n```\n\nthis evaluates 1+2 and ignores\
    \ the result and then evaluates 3+4 and stores this in ans.\n\nThe big problem\
    \ with the comma is not what it does, but working out what you need it for. The\
    \ obvious answer is that you want it when an expression has a side effect that\
    \ you are interested in more than its result.\n\nFor example:\n\n```\nint ans=\
