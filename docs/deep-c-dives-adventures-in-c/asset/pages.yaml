- pgno: 53
  md: '# Compile v Runtime Expressions


    The importance of expressions is that anywhere you can use a value in C you can
    use an expression to obtain that value. This is why you can write:


    ```

    int a = 2*2;

    ```


    or


    ```

    int a = 2*b;

    ```


    However, there is an important difference between the two. The first can be evaluated
    at compile time and the second cannot as we might well not know the value of b.
    This is an important distinction as sometimes a value needs to be known at compile
    time. For example, if you declare an array at file level then its size has to
    be known at compile time because it is allocated at compile time. What this means
    is that a declaration like:


    ```

    int myarray[2*b];

    ```


    will not compile unless it is within a function or a block. Notice that this is
    true even if the value of b can be deduced from the program, e.g. b = 4. A constant
    expression can''t contain variables, increment or decrement operators or function
    calls.


    All other expressions are evaluated at run time and their value isn''t known until
    then.


    # Lvalues and Rvalues


    Expressions produce results and results have to be stored somewhere. There are
    two sorts of objects involved in an assignment. The object on the left-hand side
    has to be something associated with an address where a result can be stored –
    this is generally called an lvalue. The object on the right of the assignment
    has to be a result, a value, i.e. something that can be stored in an rvalue. This
    is generally called an rvalue and so an assignment takes the form:


    ```

    lvalue = rvalue

    ```


    This is where the concept started, but over time it has evolved a little. Now
    an rvalue is something that has no obvious location in memory. For example, a+b
    is an expression the result of which isn''t stored anywhere in particular. Clearly
    an rvalue can occur on the right-hand side of an assignment. In this extended
    sense an lvalue is anything that does have a clear identifiable location. You
    can also draw the distinction between modifiable lvalues and constant lvalues.
    In this sense an lvalue can be on the right-hand side of an assignment, but what
    is on the left has to be a modifiable lvalue.


    The terms lvalue and rvalue are used generally, not just in assignment statements,
    and they often figure in error statements. For example, if you try:


    ```

    &a = b;

    ```


    you will often see the error reported as “&a is an rvalue”.'
