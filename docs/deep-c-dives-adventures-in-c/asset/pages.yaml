- pgno: 116
  md: "If you write:\n`temp = myIntPointer;`\nthen the address is copied into temp.\
    \ How then to retrieve the value that is stored at that address? The answer is\
    \ the dereference operator \\* which we have already met in the declaration of\
    \ a pointer. The dereference operator is the inverse of the address operator in\
    \ that it accesses the value that the address references. For example:\n`int myVar\
    \ = 42;`\n`int temp = *&myVar;`\nstores 42 in temp as & gives the address of myVar\
    \ and \\* then gives the value stored at that address. Of course this isn't actually\
    \ useful. You can use the dereference operator on the left of an assignment:\n\
    `int myVar = 42;`\n`int *myIntPointer;`\n`myIntPointer = &myVar;`\n`*myIntPointer\
    \ = 43;`\nThis stores 43 at the same location as referenced by myVar. We now have\
    \ reference semantics in C – almost.\n\n# # Lifetime Problems\n\nThe existence\
    \ of pointers in C brings with it a new problem – “use after free”. This refers\
    \ to the idea that now we can reference storage in a way that isn't controlled\
    \ by the system. When you use an automatic or static variable, its lifetime is\
    \ such that if you try to access it within its scope then it exists. Once you\
    \ have pointers you can make the mistake of using a reference after the variable\
    \ no longer exists – after it has been “freed”. This problem gets much worse once\
    \ we introduce the use of the heap – see Dive 11 – but it is still a problem in\
    \ this simpler situation.\n\nFor example:\n\n```\n```c\n#include <stdio.h>\n#include\
    \ <stdlib.h>\n\nint *myFunction(){\n\tint myVar=42;\n\treturn &myVar;\n}\n\nint\
    \ main(int argc, char **argv)\n{\n\tint *myPointer=myFunction();\n\n\tprintf(\"\
    %d\\n\",*myPointer);\n\tprintf(\"%d\\n\",*myPointer);\n\treturn 0;\n}\n```\n```"
