- pgno: 145
  md: 'If you want to restrict the function to be “local” and defined in the same
    file prefix the declaration with *static*:


    ```

    static int sum(int, int);

    ```


    this means that the *sum* function has to be defined in the same file and it is
    not available for use in other compilation units – it is internal to the file.
    Use *static* in a function declaration when you want to avoid name clashes with
    functions in any libraries you might be using.


    What about variables that are not function pointers, do you need to declare them?


    In most cases you can declare and define a variable in the usual way:


    ```

    int myInteger;

    ```


    This allocates the memory needed as well as telling the compiler the type of the
    variable. Of course, variables have to be declared before they are used, but where
    they are declared modifies where the memory needed is allocated from. The only
    example of declaring a variable without defining it is when you declare the variable
    as *extern*:


    ```

    extern int myInteger;

    ```


    This informs the compiler that *myInteger* is an *int*, but doesn’t allocate any
    storage for it as it is assumed that this is done in another compilation unit.
    That is *myInteger* is a variable in another compilation unit (file).


    You can declare a variable as many times as necessary, but you can only define
    it once.


    # ## Function Pointers and Type


    The concept of a “first-class function” is a relatively recent one and C’s functions
    were thought up well before it became an issue. The basic idea is that a first-class
    function is one that is treated the same as other objects in the language. Where
    “objects” can mean simple things like ints or floats or bigger things like class-derived
    instances of complex data structures. However, the key feature when a function
    is “first-class” is the ability to pass it as a parameter to another function
    and C has allowed this from the start.


    A function name is a pointer to the starting address of the function. If you write:


    ```

    printf("Address = %X",&myFunction);

    ```


    or


    ```

    printf("Address = %X",myFunction);

    ```


    you will see the address that *myFunction* starts at. In other words the *&* is
    optional when dealing with a function name.'
