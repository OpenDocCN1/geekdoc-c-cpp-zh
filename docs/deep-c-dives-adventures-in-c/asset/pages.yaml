- pgno: 105
  md: '# Dive 9

    Static Storage


    > "Up until the 1920s, everyone thought the universe was essentially static and
    unchanging in time."


    Stephen Hawking


    We all know what a variable is, but often we don''t. The simplest mental model
    of a variable is a memory location associated with a name – a label. You can think
    of the variable as a box that you can put a bit pattern into and retrieve by name.


    Consider a simple assignment:


    int a = 42;


    You can think of this as creating a box called a and storing the bit pattern for
    42 in it. Similarly, using a in an expression retrieves the bit pattern from the
    box. Of course, in practice the box is a memory location and the label is the
    location''s address.


    Sometimes it is important to know where the memory location is and how it is allocated.
    C supports two well-known ways of allocating memory. We have already met automatic
    variables, see Dive 8, which are allocated on the stack and are ideal for variables
    that have a block lifetime. Variables that are explicitly allocated on the heap,
    see Dive 11, are ideal for situations when you need the lifetime to be independent
    of any block. This is the stack versus heap distinction, but there are other ways
    that variables are implemented.


    One of the most important is strangely named "file level storage" also known as
    "static storage".'
  merge: -1
  img_proc: true
- pgno: 106
  md: "# # File Level Storage\n\nTo understand how file-level storage works, we have\
    \ to consider how a program is compiled and run. The compiler reads the C code\
    \ and for each C instruction it outputs a number of lower-level machine code instructions.\
    \ These instructions are simply bit patterns and only differ from data in that\
    \ they are examples of machine code instructions and the processor can read and\
    \ obey them.\n\nThat is, a program is just data you can execute.\n\nThe output\
    \ of the compiler is a binary file and to run the program the loader simply loads\
    \ the file into the correct location in memory and then makes the processor jump\
    \ to the address of the first instruction.\n\nThe fact that the program file is\
    \ just a binary file that is loaded into memory means that it is possible to include\
    \ data within it for the program to work with. That is, memory locations within\
    \ the program can be used to store data. Usually the compiler arranges to store\
    \ all of the data together in one area of the file and so we have the idea of\
    \ a data block and a code block. Depending on the system and the compiler there\
    \ can be multiples of both types of block in a single binary file.\n\nFile-level\
    \ variables are stored in the binary file that the compiler generates and are\
    \ stored within the program. Thus they are neither automatic variables stored\
    \ on the stack nor are they heap variables. A file-level variable is defined by\
    \ being declared outside of a block, i.e. outside of a function. This means that\
    \ the declaration is at the top of the file of code and hence a “file-level variable”.\
    \ For example:\n\n```\n```\n#include <stdio.h>\n#include <stdlib.h>\n\nint a =\
    \ 42;\n\nint main(int argc, char **argv)\n{\n\tint b = 314159;\n\tprintf(\"%d,%d\"\
    , a, b);\n\treturn 0;\n}\n```\n```\n\nThe variable **a** is declared at the file\
    \ level and variable **b** is an automatic local variable. Recall that in C the\
    \ main “program” is just another function and variables declared within it are\
    \ automatic and stored on the stack. Variable **a** is compiled into the data\
    \ area of the program and isn’t allocated space on the stack or the heap – it\
    \ is part of the program file. It is also initialized when the program file is\
    \ loaded. As it is part of the program, **a** has the maximum lifetime – it lives\
    \ until the program terminates and the\n\n106"
