- pgno: 146
  md: 'What this means is that you can pass a function, using its name, to another
    function and then call it from within that function. The only problem we have
    is, what type is a function? To define a parameter as accepting a particular function,
    we need to be able to define the type of a function. The type of a function is
    simply a pointer to a function.


    This is easy in principle, but slightly difficult to read:


    ```

    function return type (*function name)(parameter types);

    ```


    So, for example:


    ```

    int (*myFunction)(int,int);

    ```


    defines a function that returns an int and accepts two ints as parameters. Notice
    that this is similar to the usual function declaration:


    ```

    int myFunction(int a, int b);

    ```


    When you create a type for a function you can include parameter names if you want
    to. Notice that the parentheses around the function name are necessary as:


    ```

    int *myFunction(int a, int b)

    ```


    is a function that returns a pointer to int.


    To be clear:


    ```

    int (*myFunction)(int,int);

    ```


    defines the variable myFunction to be a pointer to a function that accepts two
    ints and returns an int. Notice that the name of the pointer isn’t at the end
    of the declaration as it usually is – this makes reading such declarations more
    difficult.


    For example:


    ```

    int (*myFunctionPointer) (int,int);

    myFunctionPointer=sum;

    int result=myFunctionPointer(1,2);

    ```


    The function pointer can be set to reference the function sum as it has the same
    signature. Once you have a function pointer, you can use it to call the function
    in the normal way.


    As function types are complicated to read, it is usually better to define a type
    using typedef. In this case the name supplied is used as the name of the type:


    ```

    typedef int (*myFnctype) (int,int) ;

    myFnctype myFunctionPointer;

    myFunctionPointer=sum;

    int result3=myFunctionPointer(1,2);

    ```


    Notice that the name of the type defined by the typedef isn’t at the end of the
    statement which is where you usually look for it. However the declaration of the
    function pointer is now more usual in that the name of the variable is at the
    end rather than in the middle.'
