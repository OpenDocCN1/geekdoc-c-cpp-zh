    \    int *result=funA();\n    printf(\"%d\\n\",*result);\n    return (EXIT_SUCCESS);\n\
    }\n```\n```\n\nIn this program funA creates a local variable c and stores 42 in\
    \ it. It then returns the address of c and the main program uses this to print\
    \ the value stored in c. In most cases this program will cause the compiler or\
    \ the IDE to flag the potential error:\n\n![](img/5f2ea21c2077d473344a0fdf144677b9_100_0.png)\n\
    \nThe warning message is perfectly correct in that c is a local variable and hence\
    \ only “lives” while the function is executing, and as such you should not return\
    \ its address. However, if you run the program there is a good chance you will\
    \ see 42 printed because the stack where the value of c was stored hasn’t changed.\
    \ On some systems you will see a runtime error because the stack has changed enough\
    \ to cause a memory fault. If another function is called after funA and before\
    \ the value of c is printed then the chances are that you will not see 42, but\
    \ some other value as stored on the stack by the other function.\n\nThis may seem\
    \ like a contrived example, it is, but it is a far more common error than you\
    \ might imagine as we will discover in Dive 13: First Class Functions.\n\nThe\
    \ important point is that once a function returns you have to regard all of its\
    \ local variables and everything it stored on the stack as being destroyed, even\
    \ though they may hang around for a while simply because some other function hasn’t\
    \ made use of the memory as yet."
