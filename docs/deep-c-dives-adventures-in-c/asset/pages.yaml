- pgno: 149
  md: '# # Parameters and Arguments


    We have looked at how functions can be used as parameters, but it is worth looking
    more generally at the way parameters behave.


    Parameters act like local variables initialized when the function is called. For
    example:


    ```

    ```

    void myFunction(int myParam1, char myParam2){

    ```

    ```


    called as:


    ```

    ```

    myFunction(42, ''H'');

    ```

    ```


    can be thought of as:


    ```

    ```

    void myFunction(int myParam1, char myParam2){

    myParam1 = 42;

    myParam2 = ''H'';

    }

    ```

    ```


    This is also quite close to what really happens. When you call a function the
    expressions that you specify for each parameter, the arguments, are evaluated
    and each value is pushed onto the stack along with the return address before the
    function is called – see Dive 8. When the function starts to execute, the parameters
    are on the stack along with any other local variables the function declares. This
    description is idealized in that many compilers attempt to optimize the program
    by placing the first few parameters into registers to speed things up. However,
    the stack idea is still a useful way of thinking about things.


    In this sentsa parameters behave like pre-initialized locals.


    If you want to pass something in by reference then you have to pass an address.
    We are all familiar with the difference. If you “pass by value” then any changes
    to the parameter do not affect the variable passed in:


    ```

    ```

    void myFunction3(int a){

    a = 42;

    }

    int a = 43;

    myFunction(a);

    ```

    ```


    After the function, a in the calling program still has 43 stored. The fact that
    the parameter has the same name is irrelevant. A “pass by value” doesn''t always
    need you to use a variable as the argument. For example:


    ```

    ```

    myFunction(21*2);

    ```

    ```


    is perfectly acceptable. It really is better to think of the argument as always
    being an expression which is evaluated and passed into the function.'
  merge: -1
  img_proc: true
- pgno: 150
  md: "Passing a reference works in exactly the same way. What changes is the way\
    \ you treat the parameter. For example:\n\n```\nvoid myFunction(int *a){\n   \
    \ *a = 42;\n}\n```\n\nNow we are passing a pointer to an int and using the dereference\
    \ operator in the assignment means that 42 is stored in whatever a references.\
    \ Now if you call the function:\n\n```\nmyFunction(&a);\n```\n\npassing the address\
    \ of a in the calling program, then the function changes the value stored in a\
    \ in the calling program. So C permits \"pass by reference\", but it is criticized\
    \ because it is such a manual operation that it invites errors. If a parameter\
    \ is to be passed by reference, it has to be a pointer, e.g. *a, and within the\
    \ function it has to be dereferenced, i.e. you need to use *a. What is more, you\
    \ need to remember to call the function with the address operator, e.g. &a. If\
    \ you accidentally forget a * or a & the function doesn't do what you think it\
    \ does.\n\nOther languages automate the process, for example C# uses:\n\n```\n\
    myFunction(byref a)\n```\n\nto define a reference parameter. When you call myFunction\
    \ it automatically takes the address of the variable and automatically dereferences\
    \ it within the function. This is more foolproof, but less flexible. The same\
    \ idea is the basis of the C++ extension to C, passing by reference. In this case,\
    \ if you add & in front of a parameter it is passed by reference and its address\
    \ is obtained and dereferenced automatically. In C++ our previous example can\
    \ be written:\n\n```\nvoid myFunction(int &a){\n    a=42;\n}\nmyFunction(a);\n\
    ```\n\nWhy pass by reference?\n\nThere are only two reasons for doing this. The\
    \ first is that you want to use a parameter as a way of getting a result out of\
    \ a function. For example:\n\n```\nvoid sum(int a, int b, int *c){\n    *c=a+b;\n\
    }\n```\n\nwhich returns the result of the sum in c:\n\n```\nint result;\nsum(3,4,&result);\n\
    ```\n\nIn this case you could have returned the result in the usual way, but if\
    \ you have multiple items to return then reference parameters can be used. However,\
    \ using a struct is arguably better, see later."
  merge: -1
  img_proc: true
- pgno: 151
  md: "The second is that you want to avoid having to make a copy of a large data\
    \ structure. This is the reason that arrays are automatically passed by reference\
    \ as an array name \"decays\" to a pointer when used in this way. For example:\n\
    \n```\n```c\nvoid myFunction(int *a)\n{\n    *(a + 2) = 42;\n    a[2] = 42;\n\
    }\nint myArray[5] = {0,1,2,3,4};\nmyFunction(myArray);\n```\n```\n\nand the assignment\
    \ to a[2] changes the array in the calling program. The only danger for the beginner\
    \ is not noticing that arrays are pointers and hence passed by reference.\n\n\
    What if you want to pass an array by value? There is no straightforward way of\
    \ doing this, but you can pass anything by value if you wrap it in a struct, for\
    \ example:\n\n```\n```c\ntypedef struct{\n    int myArray[5];\n} arrayType;\n\
    ```\n```\n\n```\n```c\nvoid myFunction(arrayType array){\n    array.myArray[2]=42;\n\
    }\narrayType myArray={{0,1,2,3,4}};\nmyFunction(myArray);\n```\n```\n\nIf you\
    \ try this out you will find that myArray in the calling program is unchanged\
    \ by the function. The cost of this transformation is the need to use arrayType\
    \ for the type of the array and the qualified name to access the myArray field.\
    \ You also have to set the size of the array in arrayType which makes it difficult\
    \ to reuse. You can simplify the code in the function by aliasing array.myArray\
    \ to a pointer:\n\n```\n```c\nint  *array2 = array.myArray;\narray2[3]=43;\n```\n\
    ```\n\nYou can alias array.myArray in the same way in the calling function to\
    \ make it look more like a standard array, but you have to pass the struct to\
    \ the function to invoke the pass by value mechanism."
