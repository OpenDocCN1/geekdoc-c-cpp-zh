- pgno: 101
  md: "# Blocks\n\nSo far we have focused on functions, but C is a block-structured\
    \ language and functions are just one example of a block. The basic idea is that\
    \ a block is a collection of instructions contained by curly brackets.\n\n{statement1;statement2;\
    \ …}.\n\nThis is often called a compound instruction to emphasize that it behaves\
    \ as if the list of instructions it contains acts like a single big instruction.\
    \ For example, the C flow of control statements like if are only defined for a\
    \ single instruction:\n\nif(condition) statement;\n\nand the statement is obeyed\
    \ only if the condition is true. If you want to execute multiple statements then\
    \ you need to use a block:\n\nif(condition) {statement1;statement2; ...}\n\nThis\
    \ much all C programmers know, but a block is more than just a compound statement.\
    \ A block acts like a function in the way it deals with the stack. That is, when\
    \ you enter a block, any new local variables are added to the stack frame and\
    \ when you leave the block they are lost. Another way to think of this is that\
    \ a block is like a function, but without parameters and a return. Or you could\
    \ say it the other way round - a function is a block with parameters and a return.\n\
    \nFor example:\n\n```\nint main(int argc, char **argv)\n{\n    int a = 42;\n \
    \   {\n        int c = 43;\n        printf(\"%d    %d\\n\", a, c);\n    }\n  \
    \  printf(\"%d\\n\", a);\n    return (EXIT_SUCCESS);\n}\n```\n\nIn this case the\
    \ block introduces the new variable c and this is only accessible within the block.\
    \ If you try to use c outside of the block then the compiler will signal an error\
    \ that you are trying to use an undefined variable. Before C99 all of the declarations\
    \ in a block had to be at the start of the block, but now they can be anywhere.\
    \ Notice that a is accessible inside the block this is usually called lexical\
    \ or static scope.\n\nIf you know JavaScript, also notice that C does not implement\
    \ hoisting for variable declarations. In JavaScript all declarations are moved\
    \ to the start of a block, but in C the variable only exists after it has been\
    \ declared."
  merge: -1
  img_proc: true
- pgno: 102
  md: "Things are a little more subtle than this. If the variable is already defined\
    \ outside of a block then any redefinition inside the block “shadows” the original\
    \ variable, which is unavailable until the block is exited.\nFor example:\n\n\
    ```\n```c\nint main(int argc, char **argv)\n{\n    int c = 42;\n    {\n      \
    \  int c = 43;\n        printf(\"%d\\n\", c);\n    }\n    printf(\"%d\\n\", c);\n\
    \    return (EXIT_SUCCESS);\n}\n```\n```\n\nYou will see 43 printed then 42 as\
    \ the two different incarnations of c come into scope. As C variables of the same\
    \ name but different type are regarded as the same variable it doesn't matter\
    \ if you declare the inner variable to be of a different type:\n\n```\n```c\n\
    int main(int argc, char **argv)\n{\n    int c = 42;\n    {\n        float c =\
    \ 43;\n        printf(\"%f\\n\", c);\n    }\n    printf(\"%d\\n\", c);\n    return\
    \ (EXIT_SUCCESS);\n}\n```\n```\n\nIn this case the inner block's c still shadows\
    \ the containing block's c even though they are different types.\nNotice that\
    \ you can nest one block inside another. When you do, the variables declared in\
    \ an inner block are local to that inner block, which can still access variables\
    \ declared in any containing block. Any variables that you declare within the\
    \ block that have the same name as variables in the containing block shadow the\
    \ containing block variables even if they differ in type.\nWhy might blocks be\
    \ useful? In fact you make use of them all of the time, perhaps without realizing.\
    \ For example, as already mentioned, all of the C control statements make use\
    \ of compound instructions and as such each is a block:\n\n```\n```c\nfor(int\
    \ i = 0; i < 10; i++){\n    int c = 0;\n    c = c+i;\n    printf(\"%d\\n\", c);\n\
    }\n```\n```"
  merge: -1
  img_proc: true
- pgno: 103
  md: 'In this case c is local to the block and cannot be accessed outside of the
    for loop. In addition if there is a c already defined before the for loop then
    it is unchanged after the for loop ends. Notice the i is also local to the block
    as C99 now allows declarations within code and the for is regarded as being within
    the block.


    The same behavior is the case for all of the control statements if, switch, while,
    for and do-while. Any variables declared between curly brackets are local to the
    block and go out of scope when the block is exited.


    Within control statements, the local scope of variables to the containing block
    is useful as it can allow the reuse of variable names. Occasionally it is useful
    to create a block that isn''t part of a control statement within a program for
    exactly that reason. For example, if you have a section of code that is giving
    problems you can run it with slight variations by copying it and pasting it back
    into the program and surrounding it with curly brackets to be sure that it has
    no effect on other variables already in the program.


    # Final Word


    The way that the stack works in exactly the way that fits with function call and
    return is pleasing. The way that it makes automatic local variables easy and natural
    is very surprising and not to make use of it would be to "look a gift horse in
    the mouth" – it is why local variables behave in the way that they do.


    C takes this idea one stage further and allows you to declare blocks that are
    not functions. This is such a natural part of C programming you quickly forget
    that it is special and yet knowing exactly what is going on means you can be creative.
    If you are creative with blocks, remember to include some comments explaining
    what you are up to – share the creativity.'
