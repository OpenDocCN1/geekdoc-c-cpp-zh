  md: '# **Dive 7**

    **Into the Void**


    > "I''ll get me to a place more void."

    William Shakespeare


    You can''t help having encountered the mysterious void data type. It sounds like
    something from a SciFi novel or film and, along with the semi-colon, accounts
    for a C program''s intimidating look to the beginner. As time ticks on, however,
    we get used to the void and eventually hardly notice it. But why "void" and what
    exactly does it mean?


    # **Why Void?**


    As far as I can determine the use of "void" as a type was introduced in Algol
    68 and its language designers also seem to have liked related terms like "voiding".
    The word is defined by wiktionary as:


    +   1. Containing nothing; empty; not occupied or filled.

    2. Having no incumbent; unoccupied; said of offices etc.

    3. Being without; destitute; devoid.

    4. Not producing any effect; ineffectual; vain.

    5. Of no legal force or effect, incapable of confirmation or ratification.

    6. Containing no immaterial quality; destitute of mind or soul.

    7. Of a function or method that does not return a value.


    My guess is that it is the first definition that comes into everyone''s mind when
    they read "void" in a program, but I actually think it is the fifth that explains
    why we use it.


    The original idea was that a C function should define, not only the types of its
    parameters, but the type of its return value. So you might write


    int sum(int a, int b){...


    to mean that sum returns an int. This allows the compiler to check that the function
    really does return an int at compile time.


    Essentially, if the function has a return c; instruction and c is confirmed to
    be an int then everything is fine.'
