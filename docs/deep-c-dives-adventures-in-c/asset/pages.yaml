    \ the comma to the assignment so as to set up the initial conditions for a conditional.\
    \ That is:\n\n```\nwhile (setup, (a = expression)<0);\n```\n\nwhere setup is some\
    \ action needed to evaluate the expression correctly. For a simple, if bizarre,\
    \ example:\n\n```\nint a = 1,b = 2;\nwhile (printf(\"%d\\n\",b), (a = b)<10){\n\
