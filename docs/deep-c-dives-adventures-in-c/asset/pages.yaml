- pgno: 193
  md: "# Dive 17\nExceptions and the Long Jump\n\n> *“The young man knows the rules,\
    \ but the old man knows the exceptions.”*\nOliver Wendell Holmes, Sr.\n\nExceptions\
    \ are a great idea, but they are generally associated with higher-level languages\
    \ than C. As a result many a C programmer thinks that C doesn't support exceptions,\
    \ even if they are familiar with the instructions that can be used to implement\
    \ an exception-like mechanism. First let's find out what an exception is and why\
    \ it is different from most other flow of control constructs. Then let's see how\
    \ C can do the job.\n\n# The Idea of an Exception\n\nA great example of what exception\
    \ handling is all about can be found in nearly all modern languages. For example,\
    \ Java, JavaScript and C# has try-catch and Python has try-except, which works\
    \ in much the same way. In many languages you can write something like:\n\n```\n\
    ```\ntry:\n    block of code\ncatch:\n    error handling code\n```\n```\nif error\
    \ then handle error\n```\n```\n\nIf any instructions in the block of code cannot\
    \ be completed for any reason, an exception is raised and the catch clause is\
    \ activated. Most modern languages have a similar construct, but perhaps with\
    \ the syntax changed slightly.\n\nThis seems nothing more sophisticated than:\n\
    if error then handle error\nbut it is much more. The block of code may call functions\
    \ and if an error occurs in one of the functions we have the problem of what to\
    \ do. A typical C approach is to terminate the program and return an error code.\
    \ This isn't particularly user-friendly and high-level languages implement exceptions\
    \ to provide a way to handle errors."
  merge: -1
  img_proc: true
- pgno: 194
  md: "Of course, the obvious thing to do is detect the error and attempt the operation\
    \ that caused it again with modifications in the hope that things work this time\
    \ around. Sometimes this is easy, but usually it isn't due to the need to get\
    \ back to the code that started the process that led up to the error. For example,\
    \ consider a simple C function:\n\n```\n```\nint divide(int a, int b){\n    return\
    \ a/b;\n}\n```\n```\n\nIf this is called with arguments that cause an error:\n\
    \n```\n```int result = divide(1,0);```\n```\n\nit will result in a divide by zero\
    \ error in the *divide* function. The error occurs in the function, but there\
    \ is no way that the function can handle the error – it has just been given a\
    \ and b with no way to know what to do if b is 0. To handle the error, the code\
    \ that called the function has to call it again, but with sensible arguments that\
    \ don't cause an error.\n\nThe general point is that an error will typically occur\
    \ within a function which is in no position to fix the error because the cause\
    \ of the error is in code which called the function, or the code which called\
    \ a function which then called the function and so on...\n\nEven when an error\
    \ can be handled locally, it may still be better to pass the problem back to a\
    \ much earlier calling function. For example, if a function tries to download\
    \ a file over the network and it times out, then the function doing the downloading\
    \ could just retry the download. However, if the timeout function passes the error\
    \ back up to a calling function, then it may have the logic to decide to try to\
    \ download a different file. In other words, where an error is best handled in\
    \ the call chain, is something that depends on the task and the type of error.\n\
    \nThe problem is that we need to return control to an earlier calling program\
    \ while wiping out anything that the functions that have been called may have\
    \ done. We need to return to the point in the code where the error is to be handled\
    \ in a state as if the action that resulted in the error had never been tried.\n\
    \nThis is what we mean by an \"exception\" - a piece of code that attempts to\
    \ do something, usually by calling a function and if an error occurs, perhaps\
    \ deep in a sequence of calls, then an exception is raised and control passes\
    \ back to the code that is to handle the exception so that it can try again. The\
    \ state of the system has to be restored as much as possible to what it was before\
    \ the functions were called and the error occurred."
  merge: -1
  img_proc: true
- pgno: 195
  md: 'The easiest and most logical way to implement the state change needed to implement
    an exception is to “unwind” the call stack back to the point where the code that
    is handling the error started the function calls.


    ![](img/5f2ea21c2077d473344a0fdf144677b9_195_0.png)


    As all of the function''s local variables are stored on the stack, this essentially
    obliterates all trace of the functions being called. Well not quite, because adjusting
    the call stack cannot do anything about any global side effects that the functions
    caused. For example, if the function printed something, opened a file or modified
    a global variable, then these things are not automatically undone by the exception.
    In the case of having printed something then it might not be possible to undo
    what has been done, but usually the catch portion of the exception handler can
    perform the final cleanup by adjusting global variables and closing files etc.

    Once everything is cleaned up as much as possible the code that is handling the
    error can have another go at the operation. Of course if this causes an exception
    then again we need to do something different and eventually we are going to have
    to give up and report an error. Ideally the code should ask for human assistance
    in working out what to do next but most code still just posts an error number
    and halts.'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'This outline gives you the basics of exceptions and exception handling. Modern
    languages usually allow the catch clause to define which errors they will handle
    and if they can''t handle the particular error the exception is passed up to the
    next function to see if it can handle it and so on. Code can also raise or throw
    an exception any time it is needed, generally using a command like:


    ```

    raise exception type

    ```


    Notice that an exception breaks the usual flow of control within a program. It
    is almost as if there were two flow of control graphs – one giving the path through
    the program when things go right and one giving an alternative path when things
    go wrong. Exceptions may break the usual flow of control, but they do it in a
    very specific way by slowly moving back up the function call stack. Mechanisms
    that work with the natural call and return of function are usually called “structured”
    as opposed to “unstructured”, which implies that anything can happen. So you could
    say that a goto is unstructured and exceptions are structured.


    # ## Setjmp Non-local Jumps


    The key to implementing an exception-like error handling mechanism in C is the
    non-local jump. This is like a goto on steroids, but it lends itself to structured
    use. The setjmp function stores the current state of the program in a buffer and
    returns a 0. The program can then carry on as normal until a longjmp function
    call occurs with the same buffer used in setjmp. When this happens, the stored
    environment is restored and control is transferred back to the setjmp function,
    but this time it returns the value of the second longjmp parameter so that you
    can use it to tell that this is a restart. That is:


    ```

    setjmp(buffer);

    ```


    stores the state in buffer, a jmp_buf, and returns 0.


    After this the program carries on as normal until it meets:


    ```

    longjmp(buffer, n);

    ```


    when the environment is restored and control is transferred back to the setjmp,
    which returns n. Notice that the restored environment wipes out any function calls,
    i.e. it unwinds the stack back to its state when the setjmp was first called.
    Notice that the jmp_buf is an array and its size depends on the system – it has
    to be large enough to store the status.'
  merge: -1
  img_proc: true
- pgno: 197
  md: "Using setjmp and longjmp is fairly easy:\n\n```\n```\n#include <stdio.h>\n\
    #include <stdlib.h>\n#include <setjmp.h>\n\nstatic jmp_buf jumpBuffer;\n\nint\
    \ division(int a,int b){\n    if(b==0){\n        longjmp(jumpBuffer,1);\n    }else{\n\
    \        return a/b;\n    }\n}\n\nint main(int argc, char *argv[])\n{\n    if(0==setjmp(jumpBuffer)){\n\
    \        int result=division(1,0);\n    }else{\n        printf(\"divide by zero\"\
    );\n    }\n    return 0;\n}\n```\n```\n\nYou can see that the division function\
    \ tests for the divide by zero error and performs a longjmp if it happens. The\
    \ main program simply tests the return value of setjmp. The first time it is called\
    \ it returns 0 and hence the if clause calls division. This in turn triggers the\
    \ longjmp with the result that control returns to the setjmp call which this time\
    \ returns 1 and so the else clause is called. You can think of the longjmp as\
    \ a “raise the exception” instruction and the if statement as a try-catch rather\
    \ than if-else.\n\n# ### Try Catch Macros\n\nYou can make this correspondence\
    \ explicit by defining some simple macros:\n\n```\n```\n#define InitializeException\
    \ static jmp_buf jumpBuffer\n#define raise(E)    longjmp(jumpBuffer,E)\n#define\
    \ try if(0==setjmp(jumpBuffer))\n#define catch else\n```\n```"
  merge: -1
  img_proc: true
- pgno: 198
  md: "With these definitions the original example can be written:\n\n```\nInitializeException;\n\
    \nint division(int a, int b) {\n    if (b==0) {\n        raise(1);\n    } else\
    \ {\n        return a / b;\n    }\n}\n\nint main(int argc, char *argv[]) {\n \
    \   try {\n        int result = division(1, 0);\n    } catch {\n        printf(\"\
    divide by zero\");\n    }\n    return 0;\n}\n```\n\nOf course, this is just “syntactic\
    \ sugar”, but it is all that other languages provide. It lacks some more sophisticated\
    \ features. For example, it doesn’t let you test for the exception type and it\
    \ doesn’t allow an exception to be re-raised if the try-catch can’t handle it.\n\
    \n# ## Handle or Reraise\n\nIt can be difficult to keep track of all of the setjmp\
    \ instructions in a program. As an alternative we can extend the macros given\
    \ above so that we can set multiple try-catch constructs and expect them to be\
    \ handled correctly. The only real cost of this exercise is that now the catch\
    \ clause has to signal that it has either handled the exception or re-raised the\
    \ exception.\n\nThe idea is to maintain an array of `jmp_bufs` and a current index\
    \ which indicates the very latest state as the result of a `setjmp`. Now when\
    \ a try occurs, the index is incremented and the state of the system is stored\
    \ in the array. When an exception is raised, the `longjmp` uses the current array\
    \ element as its buffer. If the catch clause handles the exception, the index\
    \ has to be decremented. If the catch clause re-raises the exception the index\
    \ is decremented and a `longjmp` performed, using it to take us to the previous\
    \ try-catch. To get things started we also need an initialization function which\
    \ sets up a top-level try-catch that aborts the program if no other try-catch\
    \ handles the exception. We also need a global `ErrorNo` variable to store the\
    \ current error number code."
  merge: -1
