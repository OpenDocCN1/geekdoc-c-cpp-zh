- pgno: 43
  md: '# ## Dive 3


    # # Type Casting


    > “We cast a shadow on something wherever we stand.”


    E. M. Forster


    Casting or type casting is another of those defining qualities of C. Other languages
    may use the term “cast” but they don’t quite mean what C means. The idea of a
    C cast stems directly from the way C views data as bit sequences. There are only
    two fundamental or scalar types in C, integer types and floating-point types.
    The only real difference between them is the number of bits each can work with.
    Casting comes about because sometimes we need to change the number of bits and
    this is more tricky than it sounds. The problem is we would like the resized bit
    sequence to have a meaning as close to the original as possible but of course,
    this all depends on what the original meaning is taken to be.


    # ## Casting


    In object-oriented languages casting has been extended to mean changing the type
    of an object, which generally involves no modification to the object. Casting
    in C seems to not modify anything, but then reality and convenience enter the
    picture and so does change. It also has to be said that modern C applies casts
    by default to help you get things done, but it is often better to explicitly write
    out a cast to make sure your intentions are clear.


    The cast operation is simply a type name between parentheses.


    For example:


    ```

    (int) a;

    ```


    In this example, whatever the type of a, it is cast to an int.'
  merge: -1
