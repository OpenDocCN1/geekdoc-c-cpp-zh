    #include <stdlib.h>\n\nint a = 42;\n\nvoid myFunction(){\n    printf(\"%d,%d\\\
    n\", a, b);\n}\n\nint main(int argc, char **argv)\n{\n    int b = 314159;\n  \
    \  printf(\"%d,%d\\n\", a, b);\n    myFunction();\n    return 0;\n}\n```\n```\n\
    \nThis works and `myFunction` prints the value of `a`, but it will not print the\
    \ value of `b`, even if you try to.\n\nAnother difference is the way file-level\
    \ variables are initialized. Consider the instruction:\n`int a = 42;`\n\nIn this\
    \ case, as it is a file-level variable, it is allocated in the program file and\
    \ that data is set to 42 in the file. When the program is loaded into memory the\
    \ variable already has 42 stored in it and no further action is taken. Compare\
    \ this to:\n`int b = 314159;`\n\nIn this case the variable is an auto and so it\
    \ is allocated on the stack when the function, `main`, is called, this means that\
    \ the stack then has to be set to 42 as the program runs.\n\nYou can see that\
    \ you get the initialization of the file-level variable for free as part of loading\
    \ the program. This sometimes is incorrectly interpreted as file-level variables\
    \ are more efficient, but this isn't the case as loading from a file is slower\
    \ than allocating and initializing variables."
