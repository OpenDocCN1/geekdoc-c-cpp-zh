- pgno: 213
  md: '![](img/5f2ea21c2077d473344a0fdf144677b9_213_0.png)


    # Fundamental C: Getting Closer To The Machine


    ISBN: 978-1871962604


    If you want to get your knowledge of C up to speed then this is the book for you.
    This book explores C from the point of view of the low-level programmer and keeps
    close to the hardware. It covers addresses, pointers, and how things are represented
    using binary and emphasizes the important idea that everything is a bit pattern
    and what it means can change.


    For beginners, the book covers installing an IDE and GCC before writing a Hello
    World program and then presents the fundamental building blocks of any program
    - variables, assignment and expressions, flow of control using conditionals and
    loops.


    When programming in C you need to think about the way data is represented, and
    this book emphasizes the idea of modifying how a bit pattern is treated using
    type punning and unions and tackles the topic of undefined behavior, which is
    ignored in many books on C.


    ![](img/5f2ea21c2077d473344a0fdf144677b9_213_1.png)


    # Applying C For The IoT With Linux


    ISBN: 978-1871962611


    If you are using C to write low-level code using small Single Board Computers
    (SBCs) that run Linux, or if you do any coding in C that interacts with the hardware,
    this book brings together low-level, hardware-oriented and often hardware-specific
    information.


    It starts by looking at how programs work with user-mode Linux. When working with
    hardware, arithmetic cannot be ignored, so separate chapters are devoted to integer,
    fixed-point and floating-point arithmetic. It goes on to the pseudo file system,
    memory-mapped files and sockets as a general-purpose way of communicating over
    networks and similar infrastructure. It continues by looking at multitasking,
    locking, using mutex and condition variables, and scheduling. It rounds out with
    a short look at how to mix assembler with C.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '![](img/5f2ea21c2077d473344a0fdf144677b9_214_0.png)


    # Programmer''s Python: Everything is an Object, Second Edition


    **ISBN: 978-1871962741**


    This is the first in the Something Completely Different series of books that look
    at what makes Python special and sets it apart from other programming languages.
    It explains the deeper logic in the approach that Python 3 takes to classes and
