  md: '# ## Dive 8

    ## Blocks, Stacks and Locals


    > *A whole stack of memories never equal one little hope.*


    Charles M. Schulz


    C is a block-structured language. It is also the language responsible for making
    nearly every other modern language block-structured and yet this idea is now so
    familiar that we miss exactly what this means. We also have almost forgotten why
    block-structured languages are so natural. The story all starts with the way functions,
    or originally subroutines, were implemented.


    # ### The Need To Return


    All programmers are familiar with the idea of a function, also called a subroutine
    or procedure, but there was a time when they didn''t exist. Early computers didn''t
    have the capacity for such frivolous stuff. You only had enough memory to hold
    a program as it was written as one continuous block of code. Then programs became
    larger and the need to break them into blocks that did particular tasks became
    obvious and the subroutine was born. The basic requirement of a subroutine was
    the need to return to where it came from.


    Today, in C, we call subroutines “functions”, but everything else is the same.
    That is, code can “call” a function, expect it to do a job and then return with
    the results. This notion of “return” is so obvious to any programmer today we
    forget that it had to be invented and, more to the point, implemented.'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'Once you have a subroutine that works out the sum of two numbers you can reuse
    it over and over again and each time it will "return" to a correct, but different
    place:


    ![](img/5f2ea21c2077d473344a0fdf144677b9_96_0.png)


    The function call to sum takes the flow of control to the same place, but the
    return takes it back to the instruction following the call. In the early days,
    subroutines sometimes used a simple array to store the return address of the instruction
    following the call. Then things became slightly more complicated.


    Functions can call other functions:


    ![](img/5f2ea21c2077d473344a0fdf144677b9_96_1.png)


    In this case the main program calls function A which calls function B. When B
    returns it goes back to A and then back to the main. That is, the functions are
    called in the order $\mathbf{m a i n \rightarrow A \rightarrow B}$ but the return
    addresses are in the order $\mathbf{B \rightarrow A \rightarrow m a i n}$. This
    reversal of order is typical of a Last In First Out (LIFO) stack.


    For example, consider when main calls function A, which calls function B which
    calls function C which calls function D. That is:


    $\mathbf{m a i n} \quad \longrightarrow \quad \mathbf{A} \quad \longrightarrow
    \quad \mathbf{B} \quad \longrightarrow \quad \mathbf{C} \quad \longrightarrow
    \quad \mathbf{D}$


    What happens is that each return address is pushed on the stack as the function
    is called:


    main  →  A  →  B  →  C  →  D


    push return main → push return A → push return B → push return C


    96'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'This leaves the stack storing:


    ```

    push  return C

    push  return B

    push  return A

    push  return main

    ```


    When function D finishes it pops the return address off the top of the stack,
    i.e. it returns C. When C finishes it pops its return address from the new top
    of the stack, i.e. it returns B


    ```

    push  return B

    push  return A

    push  return main

    ```


    and so on.


    You can see that if we follow the rule “push the return address on the stack when
    the function is called and pop the return address off the top of the stack when
    the function is finished” everything just works.


    A stack follows the natural call and return flow of the function.


    When this was noticed the stack became the standard way to implement functions.


    Today we use a stack to implement functions, but before this the return address
    was handled in an ad-hoc way. Often, a single location was used to store the return
    address and this resulted in the restriction that you could only call a function
    which in turn could not call a subsequent function. Function calls were restricted
    to a depth of one. Later additional return variables were added, but you were
    still restricted in the depth of function calls you could implement and it wasn’t
    particularly efficient.


    # Automatic Local Variables


    For some time, the stack was used just for the return address of functions. In
    those early days any variables that you created within a function had the same
    status as variables created in the “main” program. That is, when you used a variable
    in a function it became a top-level global variable which could be accessed from
    everywhere in the program. This made getting results out of a function easy, but
    it also made programming very error-prone because you couldn’t write a function
    in isolation – you had to avoid variable names that were used elsewhere in the
    program.


    Then someone noticed that the stack could be used to create variables that were
    automatically local to the function. This approach was made clear in the 1950s
    as part of the Algol language, but it took longer for other languages to adopt
    it.'
