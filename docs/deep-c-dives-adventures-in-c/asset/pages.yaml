- pgno: 63
  md: '# Dive 5


    # Bits and More Bits


    > *All of the books in the world contain no more information than is broadcast
    as video in a single large city in a single year.*

    *Not all bits have equal value.*


    Carl Sagan


    It really is all about bits and nothing matters more to the C programmer. When
    using other languages you can abstract away so far from reality that you can forget
    that bits exist at all. Of course, the fact that you choose C means that this
    isn''t what you want to do. If you are programming hardware or interacting with
    the operating system, individual bits are often the focus of your attention and
    working with them brings us to the subject of bit manipulation.


    # Addressing the Bit


    You might think that there would be a direct way of getting at bits, but there
    isn''t. The reason is simply that hardware generally accesses a group of bits
    at a time. The memory is divided into locations, each of which corresponds to
    a fixed number of bits at a specific address. That is, when you supply a memory
    address you specify a group of bits – an address rarely specifies a particular
    bit. You could build a single-bit-wide computer, but it would be very slow and
    not particularly practical. For reasons of history, the smallest addressable group
    of bits is generally a byte, i.e. 8 bits, but again there is no theoretical reason
    for this, it is just a reasonable number to work with. The most commonly encountered
    hardware, x86/64 and ARM, use byte addressing, but they may well actually work
    with the memory in larger chunks.  A commonly used nomenclature is:


    +   - byte = 8 bits

    - word = 2 bytes = 16 bits

    - double word = 4 bytes = 32 bits

    - quad word = 8 bytes = 64 bits


    but this use isn''t universal and isn''t the subject of a standard so you always
    need to check in any given situation.'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'The whole question of how addressing actually works and what is efficient is
    very dependent on the hardware in use. The implementation of a memory cache also
    complicates things in that typically 8-byte, double words, are read and written
    to memory irrespective of the addressing mode in operation. In other words, you
    might think you are reading or writing a byte, word or double word but the hardware
    will do what it does to be efficient and does its best to keep this hidden from
    you.


    What all this means is that you cannot reason in the abstract about what might
    be the most efficient way to read some bits. There may be no simple answer to
    which is faster – byte access, word access, double word access or quad word access
    – because the memory architecture of the machine may not be as important as the
    size and type of cache in use. For example, in most cases reading bytes sequentially
    will be faster than reading bytes that are separated in memory by eight or sixteen
    bytes. The reason is that sequential bytes generally can be read from the cache
    without having to reload, but well-spaced reads might trigger a cache reload on
    each operation. Even this isn’t certain because it depends on how full the cache
    is and how much free space there is.


    If you are concerned about speed of access to a group of bytes, the only way to
    find out is to run a benchmark. You cannot deduce the performance from simple
    consideration of the addressing mode. This said, there is often a need to align
    an address with a word or double word boundary. For example if the address starts
    at 0 then the next byte is at address 1, the next word is at 2, the next double
    word is at 4 and the next quad word is at 8 and in general words start on addresses
    divisible by 2, double words divisible by 4 and quad words divisible by 8.


    # ## The Bitwise Operators


    C has a number of operators designed to allow you to perform bit manipulation.
    There are four bitwise operators:


    | Operator | Symbol |

    | :--- | :--- |

    | AND | & |

    | OR | \\ |

    | XOR (exclusive or) | ^ |

    | NOT | ~ |


    As you would expect, the NOT operator has the highest priority.

    Notice that there are also corresponding Boolean operators, &&, || and ! which
    only work with Boolean values – with zero as false and anything non-zero as true
    - and not with bit patterns.'
  merge: -1
  img_proc: true
- pgno: 65
  md: "The bitwise operators work with integer types. For example:\n\n```\nint a =\
    \ 0xF0;  \nint b = 0xFF;  \nint c = ~a & b;  \nprintf(\"%X\\n\",c)\n```\n\nThis\
    \ first works out the bitwise NOT of a, i.e. 0F. This is then bitwise ANDed with\
    \ b, i.e. 0F & FF which is F. The %X format specifier prints the value in hex.\
    \ You can use %x for lower case and %d for decimal.\n\n# ## Signed v Unsigned\n\
    \nNow we come to a subtle and troublesome point. Bitwise operators are only uniquely\
    \ defined for unsigned values. The reason is that unsigned values have an unambiguous\
    \ representation in binary and hence the operations are well-defined in terms\
    \ of the values the bit patterns represent.\n\nThat is:\n\n```\nunsigned int value=5;\n\
    ```\n\nis always 0101 and hence:\n\n```\nvalue | 0x2\n```\n\nis not only always\
    \ 0111, but also always represents +7.\n\nThe same is not true for signed values\
    \ simply because the way in which negative numbers are represented isn’t fixed.\
    \ The most common representation is two’s complement, but this is not part of\
    \ the C language standard, before C23, and so logical operations on unsigned numbers\
    \ are implementation-dependent. The C23 standard changes this and makes two’s-\
    \ complement mandatory for negative values, but it will be some time before this\
    \ comes widely into effect. Notice that this does not mean logical operations\
    \ on signed values are undefined behavior – if this was the case most C programs\
    \ would stop working properly. In addition “implementation- dependent” has one\
    \ fairly consistent meaning:\n\n> > take the bit pattern that represents the value\
    \ and perform the specified logical operation as if everything involved was an\
    \ unsigned value.\n\nThis is the only sane way to deal with the problem and it\
    \ is exactly what you would expect."
  merge: -1
  img_proc: true
- pgno: 66
  md: 'For example:

    ```

    signed int value = -5;

    ```

    if the machine uses two''s-complement representation then the bit pattern is:

    ```

    11111111111111111111111111111011

    ```

    and:

    ```

    value | 0x4

    ```

    changes the third bit to 1, i.e. -1 in two''s-complement.


    As long as you assume a specific representation for the signed value then the
    logical operation is usually well defined as the bitwise application of the operator
    on the bit pattern. It is the representation that is implementation-dependent
    and not the operation.


    # ## Masks


    Bitwise operations are the key to accessing individual bits. We usually think
    of this as setting or unsetting a particular bit or testing its state. You can
    set and unset bits using another value, usually called a mask, that defines the
    bits to be changed. In this sense the bits in the mask act as the addresses of
    the bits that you want to work with. For example, if you only want to change the
    first (least significant) bit then the mask would be `0x01`. If you wanted to
    change the first and second bits the mask would be `0x03` and so on. That is,
    the mask has the bits you want to access set to one with all other bits zero.


    The mask gives the address of the bits you want to work with and what you do to
    those bits depends on the operation you use to combine the mask with the value.
    For example:

    ```

    value | mask;

    ```

    returns a bit pattern with the same bits set to one as in the mask. Notice that
    the bits that the mask doesn''t specify, i.e. are zero in the mask, are left at
    their original values.


    If you OR the mask you set the addressed bits to one and leave all of the others
    unchanged. For example:

    ```

    int mask = 0x03;

    int value = 0xFFF0;

    int result = value | mask;

    printf("%X\n",result);

    ```

    sets result to `0xFFF3`, i.e. it sets the first (least significant) two bits.'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'Similarly if you use:

    `value & ~mask;`


    then the bits specified in the mask are set to zero


    sets result to 0xFFFC, i.e. it unsets the first two bits.


    As well as setting and unsetting particular bits, you might also want to “flip”
    the specified bits, i.e. negate them so that if the bit was a one it is changed
    to a zero and vice versa. You can do this using the XOR, exclusive or, operator:

    `value ^ mask`


    which flips the bits specified by the mask. For example:

    `int mask = 0x03;`

    `int value = 0xFFFF;`

    `int result = value ^ mask;`

    `printf("%X\n",result);`


    sets result to 0xFFFC because it changes the lower two bits from ones to zeros.
    Again, bits not specified by mask are unaffected.


    If you want to update the flag rather than derive a new result, you can use:

    `&=`

    `|=`

    and:

    `^=`


    to perform the update directly. For example:

    `int value = 0xFFFF;`

    `int value ^= 0x03 ;`

    `printf("%X\n",value);`


    To summarize:


    +   - Create a mask that has 1 at the position of each bit you want to change.

    - To set the designated bits OR the mask with the value.

    - To unset the designated bits AND the NOT of the mask with the value.

    - To flip the designated bits XOR the mask with the value.


    Bits in the mask that are 0 are unaffected by any of the operations.'
  merge: -1
  img_proc: true
- pgno: 68
  md: "# A Single Function To Write Bits\n\nLet's combine these operations into a\
    \ single bitWrite operation that uses a mask to specify the bits to change and\
    \ a data value to specify what each bit should be set to. If you regard the mask\
    \ as the addresses of the bits to be changed then this writes the data to those\
    \ bits and only those bits.\n\nFor example:\n\n```\nint mask = 0x03; //011\n```\n\
    \nspecifies that the first two bits should be modified and:\n\n```\nint data =\
    \ 0x02; //010\n```\n\nspecifies that the first bit should be set to zero and the\
    \ second should be set to one.\n\nThe trick to working out how to do this is to\
    \ construct one mask to set the bits that need to be set and another to unset\
    \ the bits that need to be unset.\n\nThen if a bit is to be set, it needs a 1\
    \ in the mask and a 1 in the data and the mask to set bits is:\n\n```\nsetmask\
    \ = mask & data\n```\n\nIf a bit is to be unset it needs a 1 in the mask and 0\
    \ in the data, so the mask to reset bits is:\n\n```\nresetmask = mask & ~data\n\
    ```\n\nApplying both to the value gives the required result:\n\n```\n(value |\
    \ setmask) & ~(resetmask) =\n(value | (mask & data)) & ~(mask & ~ data)\nwhich,\
    \ after simplification, is:\nvalue & ~mask | mask & data\n```\n\nUsing this it\
    \ is easy to create a function to do the job:\n\n```\nint bitWrite(int value,\
    \ int mask, int data)\n{\n  value = value & ~mask | mask & data;\n  return value;\n\
    }\n```\n\nFor example:\n\n```\nprintf(\"%b\\n\", bitWrite(0xFF, 0x0F, 0x05));\n\
    ```\n\nThe mask means that only the first four bits are modified and the data\
    \ sets them to 0101 which is the result of 11110101.\n\nYou can use bitWrite to\
    \ set any group of bits to any value."
  merge: -1
  img_proc: true
- pgno: 69
  md: '# # Reading Bits


    So far we have focused on writing bits, but we also often want to read a bit pattern
    and the method is more or less the same and relies on masks. As before, if you
    create a mask with bits set corresponding to the bits you want to read, then:


    ```

    value & mask

    ```


    returns `0` if and only if all of the bits the `mask` specifies are `0`.


    Similarly:


    ```

    ~ value & mask

    ```


    returns `0` if and only if all of the bits the `mask` specifies are `1`.


    Usually, you only want to test for a single bit. For example:


    ```

    int value = 0x1F;

    int mask = 0x10;

    int result = ~value & mask;

    ```


    tests the fifth bit in `value` which is `1` and so `result` is `0`.


    If you test for the fifth bit to be a zero using:


    ```

    int value = 0x1F;

    int mask = 0x10;

    int result = value & mask;

    ```


    then the result is non-zero, `16` to be precise.


    If you want to convert the test results to Boolean values you can use the logical
    operator `!`. For example:


    ```

    !(~value & mask)

    ```


    is `true` if and only if all of the bits in `value` specified by `mask` are `1`
    and `false` otherwise.


    Similarly:


    ```

    !(value & mask)

    ```


    is `true` if and only if all of the bits in the `value` specified by `mask` are
    `0` and `false` otherwise.


    If you want to just read the bits specified by the mask, simply `AND` it with
    the value:


    ```

    value & mask

    ```


    For example, to read the bottom four bits you can use:


    ```

    result = value & 0x0F;

    ```'
