- pgno: 143
  md: 'You cannot do either partial application or currying in C because you cannot
    create a new function at runtime, you cannot create nested functions and closures
    are not supported. This is a problem if you want to do functional programming
    in C. You also cannot implement object-oriented programming as you cannot create
    a bound function, i.e. a method – see Dive 14: Structs and Objects. Put simply,
    you cannot take a function:


    ```

    `myFunction(self, other_parameters)`

    ```


    and use partial application to create a method:


    ```

    `myMethod(other_parameters)`

    ```


    by setting self to reference the current instance:


    ```

    `myMethod = myFunction(instance, other_parameters)`

    ```


    The key ideas are that C functions have file-level scope and are external by default,
    i.e. they are global variables. Functions also have a lifetime the same as the
    entire program and they can only be defined at compile time. Modifying a C function
    isn''t possible without going beyond C standards.


    # Functions First


    C’s functions are simple and hence efficient, but their simplicity has a cost.
    C is a one-pass language in that it can be compiled in a single reading of the
    program text. This in turn implies that if you want to make use of something,
    a function say, it has to be declared before it is used. The reason is simple.
    If you use a function before it is declared the compiler knows nothing about it
    and cannot check if your use makes sense. This means that in C you have to define
    your functions before you use them and this means that they have to come in a
    particular order and all before the main function. Some C compilers will cope
    if they encounter a function that you haven’t declared before use. They generally
    warn of “implicit” function declaration but this is not a good idea.


    Putting functions before main isn’t the natural way to read a program. You don’t
    generally want to have to scan through all of the functions before you get to
    the main program and then have to backtrack to find the functions that are used.
    The natural way to do things is to read the main program and look up any functions
    that are used.


    To provide a simpler program layout and organization, C allows you to declare
    variables, including functions, before they are defined.


    Declaring a variable just informs the compiler of its type, no memory allocations
    have to be made at this point.


    Defining a variable can be a separate step and it involves allocating memory and
    perhaps initializing it to a value.'
  merge: -1
  img_proc: true
- pgno: 144
  md: "We already know how to define a function:\n\n```\nreturnType FunctionName(type\
    \ parameter1, type parameter2 ...){\n        statements that define the function\n\
    }\n```\n\nTo declare a function we simply leave out the body, the block enclosed\
    \ in curly brackets:\n\n```\nreturnType FunctionName(type parameter1, type parameter2\
    \ ...)\n```\n\nNaming the parameters is pointless as the compiler doesn't make\
    \ use of them, so this can be simplified to:\n\n```\nreturnType FunctionName(type,\
    \ type ...)\n```\n\nSome programmers prefer the brevity of just listing the types,\
    \ some think that providing the parameter names informs the reader what the function\
    \ does, especially so if a comment is used. For example:\n\n```\nint sum(int,\
    \ int);\n```\n\ndefines the sum function as taking two integers and returning\
    \ an integer, but\n\n```\nint sum(int a, int b); // returns a+b\n```\n\nThis works\
    \ when the function is simple, but is less effective as the complexity and number\
    \ of parameters increases. In most cases it is better to include a brief declaration\
    \ and leave the comments for the definition.\n\nOnce you know about declaring\
    \ functions, a C program can have a standard form:\n\n```\nfunction declarations\n\
    main(){...}\nfunction definitions\n```\n\nand to make this even easier to read,\
    \ it is conventional to put the function declarations into a header file.\n\n\
    ```\n#include declarations.h\nmain(){...}\nfunction definitions\n```\n\nThings\
    \ are a little more subtle than this in that the function definitions don't have\
    \ to be in the same file/compilation unit. By default function declarations are\
    \ assumed to be extern, i.e. external. This means that if you declare a function\
    \ and do not define the function within the same file, the linker will look for\
    \ the function within the libraries that have been specified.\n\nWhat this means\
    \ is that by default any function you declare and define in a file can be used\
    \ from other files. In this sense every function is by default global to the entire\
    \ project."
