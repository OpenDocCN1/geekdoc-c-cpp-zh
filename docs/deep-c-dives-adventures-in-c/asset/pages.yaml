- pgno: 80
  md: 'To get the final result you have to add the carry bits to the next highest
    bit of the result. So a left shift and an addition:

    110 + (001 <<1)

    gives 1000

    That is:

    a+b = (a^b)+(a&b)<<1

    and so:

    (a+b)/2 = !(a^b)>>1 + (a&b)

    which can be computed with no risk of overflow.'
