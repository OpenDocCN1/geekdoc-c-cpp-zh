- pgno: 70
  md: '# # Shifting Values


    A very common requirement when reading bits is to move them to a suitable location
    within the group of bits. To do this you need the shift operators. The `<<` operator
    shifts the pattern of bits to the left, shifting zero into the low-order bit.
    So, for example:

    int data = 0x0F;

    int result = data << 4;


    shifts the bit pattern in data four places to the left and so result contains
    0xF0.


    Don''t try specifying a negative shift as this is undefined behavior.


    Similarly the `>>` operator shifts to the right, but there is a small complication
    concerning what is shifted into the new bit positions. What happens depends on
    whether the value being shifted is signed or unsigned. For an unsigned value 0
    is shifted into the highest-order bit. For a signed value the same bit is shifted
    in as the one moved. That is, if the highest-order bit was a 1 then a 1 is shifted
    into the vacant position and it if was a 0, a 0 is shifted in.


    You can see that in the signed case the motivation with a right shift is to maintain
    the sign. That is, a shift keeps a positive number positive and a negative number
    negative. This sort of shift is usually called an arithmetic shift as distinct
    from a logical shift that always shifts a 0 in. You can always force a logical
    shift by casting the value to an unsigned type.


    Notice that a left shift always shifts a 0 in, but this can change the sign of
    the value as a new bit becomes the sign bit. For example:

    int data = 0x0F;

    int result = data >>3;


    shifts the bit pattern in data three places to the right and so result contains
    1 since 1111 shifted three places right is 0001.


    For integers shifting one place to the left is the same as multiplying the value
    by two and shifting one place to the right is the same as integer division by
    two, but only for positive values. For example:

    int data = 1;

    int result = data <<1;


    stores 2 in result and:

    int data = 8;

    int result = data >>1;


    stores 4 in result.'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'Things are slightly more complicated for negative values. If you try:

    `int data = 7;

    int result = data >>1;`

    then `result` is 3 which is what you would get with integer division, i.e. 3.5
    is truncated or rounded down to 3. However, if you try:

    `int data = -7;

    int result = data >>1;`

    you will find that `result` is -4. This is not what you would get with integer
    division, which would give -3 after truncation. Right shift divides by two, but
    with rounding towards the next smallest negative integer. This is a subtle point
    that often causes errors.


    The reason for this behavior is the way the sign bit is extended. For example:

    `int data = -1;

    int result = data >>1;`

    stores -1 in `result`. The reason is that the initial bit pattern is all ones,
    i.e. 32 bits all set to one, and so shifting one place to the right shifts in
    another 1 as the high bit. That is, -1 is the same as 0xFFFFFFFF and the sign
    bit is 1 so a shift right moves a one into the high-order bit, giving -1 again.


    Compare this to:

    `unsigned int data = -1;

    int result = data >>1;`

    In this case a zero is shifted into the high bit and the value stored in `result`
    gives zero followed by 31 ones, which is a positive value equal to 2147483647.
    Notice that the -1 is stored in `data` as 0xFFFFFFFF, but this is interpreted
    as a positive value when stored in an `unsigned int`. The result of the shift
    is 0x7FFFFFFF, which is a positive number when assigned to a signed `int`. What
    this means is that you can use either right and left shifts or multiplication
    and division by two to do almost the same job with a little care over negative
    values. Shifts are much faster than multiplication and division because the hardware
    generally supports a direct shift operation in a register.


    If you want a logical right shift on a signed value then the simplest way of implementing
    it is to use a cast:

    `int data = -1;

    int result = (unsigned int) data >>1;`

    You can also use `<<=` and `>>=` to shift the value of a variable in place. For
    example:

    `int data = -1;

    data <<= 1`

    shifts the bit pattern in `data` one place to the left and stores the result in
    `data`, i.e. it shifts `data` one place to the left.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# **Significant Bits**


    When working with a group of bits as a bit pattern we still tend to refer to the
    most significant and least significant bits, even though these terms really only
    apply when you are interpreting the bit pattern as a number. The most significant
    bit is associated with the largest power of two in a place value system and the
    least significant with the smallest power. Conventionally we write the most significant
    bit on the far left, following the way we write place value numbers in decimal:


    ![](img/5f2ea21c2077d473344a0fdf144677b9_72_0.png)


    You can assign all of the bits in a bit pattern a number starting from the lowest-order
    bit. Can you use the bit position as an address? Yes, as it is trivial to generate
    a mask from a bit position p:


    ```

    mask = 1 << p

    ```


    and if you want a mask corresponding to more than one position you can use:


    ```

    mask = 1 << p1 | 1 << p2 | 1 << p3 ...

    ```


    This isn''t a common requirement, but it can be useful when creating code that
    works with hardware registers that are often defined in terms of bit position.


    # **Endianism**


    A problem that often arises in bit manipulation is endianism and it is closely
    connected to the ideas of bit position and byte addressing. When you design a
    computer there is a choice to be made. If parts of a word, say each byte, has
    a separate address do you store the low-order bits at low addresses, little-endian,
    or at high addresses, big-endian?


    ![](img/5f2ea21c2077d473344a0fdf144677b9_72_1.png)'
  merge: -1
  img_proc: true
- pgno: 73
  md: "Although this is expressed as a problem that has to do with integers, it applies\
    \ to any bit pattern that is broken up into bytes – what order do you reassemble\
    \ it in. It also applies to bytes that are sent over any communication link –\
    \ should the most significant byte be sent first or last?\n\nOften you can ignore\
    \ endianism as the machine takes care of it for you. If you save a 16-bit int\
    \ then it will be saved in the order the machine uses and when you retrieve it\
    \ the same order will be obeyed. Generally endianism only matters when the bytes\
    \ have been acquired one-by-one from an external source such as hardware, a file\
    \ or a communications link. Within a program, endianism only matters when you\
    \ are aliasing a pointer or using a union, see Dive 15.\n\nFor example, consider\
    \ a 2-byte int and alias it to a 2-byte array.\n\n```\n```\nunion endian{\n  \
    \  unsigned short myint;\n    unsigned char mychar[2];\n};\ntest.myint=0x00FF;\n\
    printf(\"%x \n\",test.mychar[0]);\nprintf(\"%x \n\",test.mychar[1]);\n```\n```\n\
    \nThe union aliases myint and mychar. We then set myint so that all eight of its\
    \ low-order bits are 1. If the machine is little-endian, as in the case of x86\
    \ and ARM, then the low-order bits are stored in mychar[0]. If the machine is\
    \ big-endian, e.g. Atmel AVR32, the low-order bits are stored in mychar[1].\n\n\
    For example, creating a union to access the separate color channels ARGB – Alpha,\
    \ Red, Green and Blue values in an unsigned 32-bit int is an example of something\
    \ that changes according to endianism. As A is the high-order byte and B the low-order\
    \ you might expect the union to be:\n\n```\n```\nunion Pixel{\n    struct {unsigned\
    \ char a,r,g,b};\n    uint32_t value;\n};\n```\n```\n\nand this works for big-endian\
    \ systems as b the least significant byte has the highest address in the union.\n\
    \nHowever the x86 and ARM are little-endian. So the ARGB bytes are stored in the\
    \ opposite order with a at the lowest address in the union:\n\n```\n```\nunion\
    \ Pixel{\n    struct {unsigned char b,g,r,a};\n    uint32_t value;\n};\n```\n\
    ```\n\nThis is also a problem when data is transmitted in big-endian format over\
    \ most Internet protocols – IPv4, IPv6, UDP, TCP etc. What this means is that\
    \ if you are using a machine with little-endian format you transmit mychar[1]\
    \ before mychar[0] to send a 16-bit integer when using almost any Internet protocol.\
    \ That is, it is the order that data is sent and received rather than addressing\
    \ that is variable."
  merge: -1
  img_proc: true
- pgno: 74
  md: 'Notice that some machines support both big- and little-endian and you can select
    which is used. It is also possible for different data formats, e.g. integer and
    floating point, to use different orders. You will also find issues of which byte
    goes first when you use memory-mapped devices. In this case, a careful reading
    of the data sheet usually solves the problem. If you are getting strange results
    and are sending data processed in bytes then you need to consider endianness.


    # ## Rotate


    There is another form of shift – the left or right rotate – and while most processors
    have an instruction that will perform this type of shift in a single operation,
    for reasons of history C doesn’t have a rotate operator.


    A right rotate shifts all of the bits to the right and uses the least significant
    bit that is shifted out as the new most significant bit. That is, the low-order
    bit is shifted into the high-order bit. You can see that this is rotation of the
    bits.


    Similarly a left rotate shifts all of the bits left and moves the high-order bit
    to become the new low-order bit. Again, you can see that this rotates the bits
    in the other direction. Rotations don’t correspond to simple multiplication or
    division and they aren’t useful in the same way as left and right shifts are in
    isolating bits. What they are used for is in cryptography and signal processing.


    C may not have a rotate operator, but it is easy to implement a rotate using left
    and right shifts and logical operators. For example, a right rotate is:


    ```

    ```c

    unsigned int data=0xF;

    data= data>>1 | data<<31;

    ```

    ```


    The idea is easy enough to understand. First we perform a right logical shift
    which leaves the most significant bit zeroed. Next we perform a left logical shift
    31 times to move the lowest significant bit to become the highest significant
    bit. The two are ORed together to give the result 0x80000007.


    You can see the general principle. If you want a right rotate of n bits of a 32-bit
    int then use:


    ```

    ```c

    data = data>>n | data<<32-n;

    ```

    ```


    Similarly, if you want a left rotate of n bits of a 32-bit value then use:


    ```

    ```c

    data = data<<n | data>>32-n;

    ```

    ```


    Notice that n cannot be negative or equal to 32, which would trigger undefined
    behavior. Also notice that data has to be unsigned so as to use logical shifts.'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'It is said that most compilers will detect the above idioms and convert the
    instructions into a machine code rotate instruction if possible. GCC does this
    optimization, but only if you make sure that the rotation is positive. That is:

    `unsigned int data=0x0F;`

    `data= data>> (unsigned) 1 | data<< (unsigned)31;`


    compiles to:

    `ror eax`


    where ror is a rotate right instruction. If you leave off the unsigned qualifiers
    the line compiles to the equivalent right shift and left shift ORed together.
    It would be better if C had a rotate operator.


    # ## Bit Fields


    There is an alternative to some bit manipulation – the bit field. A bit field
    is a way of breaking down the storage into even smaller units than bytes. You
    can define a bit field within a struct by following the field definition by a
    colon and the number of bits. For example:

    `struct Bits{`

    `int bit1:1;`

    `int bit2:1;`

    `};`


    creates an int, say four bytes, but only the first two bits are used. This is
    somewhat like a union, but in this case the bit fields share the int. For example:

    `struct Bits bits;`

    `bits.bit1=1;`

    `bits.bit2=1;`

    `printf("%d\n",bits);`


    If we make a small change to the struct then you can see that you can work with
    more than just single bits:

    `struct Bits{`

    `int byte:8;`

    `int bit1:1;`

    `int bit2:1;`

    `}bits;`


    This divides up the int so that the first eight bits are called byte, followed
    by two single-bit fields. Now we can write:

    `bits.bit1=1;`

    `bits.bit2=1;`

    `bits.byte=255;`

    `printf("%d\n",bits);`

    `printf("%d\n",bits.byte);`


    you will discover that bits is 1023 and bits.byte is -1.'
  merge: -1
  img_proc: true
- pgno: 76
  md: "As the int being shared is a signed int then so are all of the fields including\
    \ the single-bit fields:\n\n```\nprintf(\"%d\\n\",bits.bit1);\n```\n\nprints -1.\n\
    \nThe standards are unclear on whether a bit field int is to be interpreted as\
    \ signed or unsigned.\n\nYou can change the interpretation of a single field using:\n\
    \n```\nstruct Bits{ \nunsigned int byte:8;\nint bit1:1;\nint bit2:1;\n}bits;\n\
    ```\n\nbits.byte now prints 255, but bits.bit1 still prints -1.\n\nYou can often\
    \ use other types, not just int, but this goes beyond standard C. If you mix types\
    \ then usually the largest type is used. For example:\n\n```\nstruct Bits{ \n\
    unsigned char byte:8;\nchar bit1:1;\nchar bit2:1;\n}bits;\n```\n\nusually allocates\
    \ a char for the first eight bits and another char for the next two bits, giving\
    \ an overall size of two bytes for the struct. It is usually better to keep all\
    \ of the bit fields the same type within a struct.\n\nIn general no padding is\
    \ used in a bit field, but if you allocate more bits than an int can represent,\
    \ a second int is used. If you want to force a new allocation so that a bit field\
    \ is aligned to an address boundary you can include an unnamed bit field of size\
    \ zero. For example:\n\n```\nstruct Bits{ \nunsigned int byte:8;\nint :0;\nint\
    \ bit1:1;\nint bit2:1;\n}bits;\n```\n\nallocates two ints with bits.byte occupying\
    \ the first eight bits of the first int and bits.bit1 and bits.bit2 at the start\
    \ of the second byte.\n\nYou can form expressions with bit fields and any result\
    \ will not overflow into an adjacent bit field i.e. the bit fields are isolated.\
    \ For example:\n\n```\nbits.byte = 255;\nbits.byte++;\n```\n\nresults in bits.byte\
    \ overflowing and being set to zero, but bits.bit1 isn't changed."
