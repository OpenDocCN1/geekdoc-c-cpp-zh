  md: "This loop executes the before 5 times, but the after 4 times and you can see\
    \ that there is a sense in which it repeats the loop body four and a half times.\
    \ You can write a completely general loop with any number of exit points anywhere\
    \ in the loop using:\n\n```\n```c\nfor(;;){\n  first part of loop\n    if(condition)\
    \ break;\n  second part of loop\n    if(condition) break;\n  third part of loop\n\
    \  and so on\n}\n```\n```\n\n# Find It and Fix It\n\nIf you are wondering what\
    \ the break and continue statements are for, you have never encountered, or never\
    \ thought about, the find it or fix it algorithms.\n\nThe find it algorithm is\
    \ simply having to scan through an array to find a specified value. Many attempt\
    \ to implement this as an enumeration loop because you know the length of the\
    \ array n:\n\n```\n```c\nfor(i = 0; i < n; i++){\n    if(array[i] == target) hit\
    \ = i;\n}\nprintf(\"%d\\n\",hit);\n```\n```\n\nThe problem is that the loop repeats\
    \ n times, even if the target is in the first element. You can fix this inefficiency\
    \ using the break statement:\n\n```\n```c\nfor(i = 0; i < n; i++){\n    if(array[i]\
    \ == target) break;\n}\nprintf(\"%d\\n\",i);\n```\n```\n\nThis brings the loop\
    \ to an end when the target is found but notice that it relies on the value of\
    \ i not changing due to the operation of the break. This is the case unless you\
    \ use the C99 idiom of declaring the index in the for statement:\n\n```\n```c\n\
    for(int i = 0; i < n; i++){\n    if(array[i] == target) break;\n}\nprintf(\"%d\\\
    n\",i);\n```\n```\n\nThis doesn't work because i no longer exists at the end of\
    \ the loop. It is also worth reminding the reader that a for loop is a block and\
    \ as such variables declared within it only live for as long as the for loop is\
    \ executing, see Dive 8."
