    This section will explain why it is better to use an external dedicated matrix
    library project, such as Eigen.


    Writing our matrix libraries is likely to cause a few issues in a production environment:


    +   **Poor Performance** - Unless significant time is spent optimising a custom
    matrix library, it is often going to be slower than the corresponding dedicated
    community projects such as BLAS, Eigen, MTL or Blitz.


    +   **Buggy Code** - A large community surrounding an open-source project leads
    to a greater number of bug fixes as edge cases are discovered and corrected. With
    a custom matrix library, it is likely that it will be restricted solely for an
    individual use case and thus edge cases are unlikely to be checked.


    +   **Few Algorithms** - Once again, the benefit of a large community is that
    multiple algorithms can be generated for all aspects of numerical linear algebra.
    These in turn feed optimisations back to the core library and thus increase efficiency.


