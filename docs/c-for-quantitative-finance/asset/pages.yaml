    \nGiven that the SDE for the asset path is now dependent (in a temporal manner)\
    \ upon the solution of the second volatility SDE, it is necessary to simulate\
    \ the volatility process first and then utilise this \"volatility path\" to simulate\
    \ the asset path. In the case of the original Black Scholes SDE it is possible\
    \ to use Ito's Lemma to directly solve for $S_t$. However, we are unable to utilise\
    \ that procedure and must use a *numerical approximation* in order to obtain both\
    \ paths. The method utilised is known as Euler Discretisation.\n\nThe volatility\
    \ path will be discretised into constant-increment time steps of $\\Delta t$,\
    \ with the updated volatility, $\\nu_{t+1}$ given as an *explicit* function of\
    \ $\\nu_t$:\n\n```\n$\\nu_{t+1} = \\nu_t + \\kappa(\\theta - \\nu_t)\\Delta t\
    \ + \\xi\\sqrt{\\nu_t}\\Delta W_{t+1}^1$\n```\n\nHowever, since this is a finite\
