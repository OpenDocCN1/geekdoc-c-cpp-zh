  md: "# 9.4.1 Algorithm\n\nIn order to solve for the lower triangular matrix, we\
    \ will make use of the Cholesky-Banachwicz Algorithm. First, we calculate the\
    \ values for L on the main diagonal. Subsequently, we calculate the off-diagonals\
    \ for the elements below the diagonal:\n\n```\n$l_{kk} = \\sqrt{a_{kk} - \\sum_{j=1}^{k-1}\
    \ l_{kj}^2}$\nl_{ik} = \\frac{1}{l_{kk}} (a_{ik} - \\sum_{j=1}^{k-1} l_{ij}l_{kj}),\
    \ i > k$\n```\n\n# 9.4.2 Eigen Implementation\n\nAs with the LU Decomposition,\
    \ we will make use of the Eigen headers to calculate the Cholesky Decomposition.\
