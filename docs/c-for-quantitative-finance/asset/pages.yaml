  md: '# 4.3 Implementing The PayOff Base Class


    The first step implementation of a pay-off hierarchy in C++ classes is determining
    the interface to our base class, PayOff.


    We want to restrict the base class itself from being instantiated as there is
    no “default” behaviour for an option pay-off. This means that PayOff will become
    an *abstract base class*. An abstract class is a class that has at least one *pure
    virtual method*. A pure virtual method is a method that does not possess an implementation
    in the base class, but is implemented in an inherited subclass. The compiler restricts
    the client from instantiating an abstract base class if it detects a pure virtual
    method within its definition, so it is really just defining an interface.


    An inherited subclass of PayOff will provide a public method, which takes an underlying
    asset spot price as a parameter and provides the pay-off at expiry (European options).
    The most general interface we will support at this stage. It is up to each subclass
    to provide specific implementation details for their own pay-off functions.


