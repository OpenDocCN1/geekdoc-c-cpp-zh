    # 3.8 Passing By Reference Or Value


    Previously we have mentioned the concepts of passing by value and passing by reference.
    These concepts refer to how a parameter is passed to a function or method. When
    passing value, the type or object being passed is copied. Any modification or
    access to that object, within the function, occurs on the copy and not on the
    original passed object. If the type has a small memory footprint, such as an int
    or double this copying process is rapid.


    If the object being passed by value is a large matrix containing values, for instance,
    it can be extremely expensive to copy all values within the matrix need to be
    duplicated and stored. We would want to avoid situations like this. Following
    is an example of a function prototype passing a double precision value:


    ```

    double my_function(double strike_price);

    ```


    The following is an example of an object (in this case a Matrix) being passed
    by reference into a matrix norm. The method returns a double precision value:


    ```

    double norm(Matrix& mat);

    ```


    When an object is passed by reference, the function can modify the underlying
    object. We need to be careful that this is the intended behaviour, otherwise we
    can end up modifying an object in place. The compiler would not stop us from doing
    so, if we intended not to. This can lead to bugs:


    What if we want restrict copying for performance reasons (and hence pass by reference),
    but do not want the function to modify every passed object? We use the const keyword
    and pass-by-reference-to-const. The compiler will catch any attempts to modify
    our Matrix, mat, within the function. This is why getting the habit of using const
    liberally in your class definitions is so important. It not helps reduce bugs,
    but provides a “contract” with clients that lets them know functions/methods are
    able to do to their data. Following is an example of pass-by-reference-to-const:


    ```

    double norm(const Matrix& mat);

    ```


    We can also append the const keyword to the function prototype. This stops the
    function modifying any whatsoever. In this case, it might be data which resides
    in a larger scope'
