    # European Options with Monte Carlo


    In this chapter we will price a European vanilla option via the correct analytic
    solution of the Black-Scholes equation, as well as via the Monte Carlo method.
    We won''t be concentrating on an extremely efficient or optimised implementation
    at this stage. Right now I just want to show how the mathematical formulae correspond
