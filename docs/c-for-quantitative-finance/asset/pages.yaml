    # 4.1 Inheritance In Quantitative Finance


    Inheritance is a powerful concept in object-oriented programming (OOP). It allows
    us to model

    type of relationship between objects known as *is-a*. For instance, we know that
    an American

    Call Option is *a* Call Option. Hence an American Call Option should *inherit*
    all properties that

    Call Option possesses, such as a strike price and an underlying asset price.


    Inheritance is extremely useful in quantitative finance, as there are many is-a
    relationships

    we can model:


    +   - American, Bermudan and European Options are all Options


    +   - Parabolic, Elliptic and Hyperbolic PDE are all PDE


    +   - Dense, Sparse, Banded and Block-Banded Matrices are all Matrices


    The great benefit is that inheritance allow us to create interfaces that accept
    *superclasses* as

    parameters, but can also subsequently handle *subclasses*. As an example, we could
    create a

    matrix transpose function, which is able to accept dense, sparse, banded or block-banded
    matrix

    objects as parameters, when it has been defined as accepting base matrix objects.'
