  md: 'Now that we have correlated streams, we can also implement the Heston Model
    in Monte Carlo.


    Up until this point we have priced all of our options under the assumption that
    the volatility, $\sigma$, of the underlying asset has been constant over the lifetime
    of the option. In reality financial markets do not behave this way. Assets exist
    under market regimes where their volatility can vary significantly during different
    times. The 2007-2008 financial crisis and the May Flash Crash of 2010 are good
    periods of intense market volatility.


    Thus a natural extension of the Black Scholes model is to consider a non-constant
    volatility. Steven Heston formulated a model that not only considered a time-dependent
    volatility, but also introduced a stochastic (i.e. non-deterministic) component
    as well. This is the famous Heston model for stochastic volatility.


    In this chapter we will outline the mathematical model and use a discretisation
    technique known as Full Truncation Euler Discretisation, coupled with Monte Carlo
    simulation, in order to price a European vanilla call option with C++. As with
    the majority of the models implemented on QuantStart, the code is object-oriented,
    allowing us to "plug-in" other option types (such as Path-Dependent Asians) with
    minimal changes.


    # 16.5 Mathematical Model


    The Black Scholes model uses a stochastic differential equation with a geometric
    Brownian motion to model the dynamics of the asset path. This is given by:


    ```

    $dS_t = \mu S_t dt + \sigma S_t dW_t^S \quad (16.10)$

    ```


    $S_t$ is the price of the underlying asset at time $t_i$, $\mu$ is the (constant)
    drift of the asset, $\sigma$ is the (constant) volatility of the underlying and
    $dW_t^S$ is a Wiener process (i.e. a random walk).


    The Heston model extends this by introducing a second stochastic differential
    equation to represent the "path" of the volatility of the underlying over the
    lifetime of the option. The SDE for the variance is given by a Cox-Ingersoll-Ross
    process:


    ```

    $dS_t = \mu S_t dt + \sqrt{\nu_t} S_t dW_t^S \quad (16.11)$

    ```


    ```

    $d\nu_t = \kappa(\theta - \nu_t)dt + \xi \sqrt{\nu_t} dW_t^\nu \quad (16.12)$

    ```'
