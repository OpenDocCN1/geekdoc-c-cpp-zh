- img_proc: true
  md: '$\frac{\partial C}{\ t} = rS\frac{\partial C}{\ S} + \frac{1}{2}\sigma^2 S^2\frac{\partial^2
    C}{\ S^2} - rC$\n$C(0,t) = 0, C(S_{max},t) = S_{max}-Ke^{-r(T-t)}, \quad 0 \leq
    t \leq T$\n$C(S,T) = \max(S-K,0), \quad 0 \leq S \leq S_{max}$


    Let''s step through the problem. The first line describes the **boundary conditions**
    for the case of a European vanilla call option up to expiry. The left-hand boundary
    equation states that on the left-boundary, for all times up to expiry, the value
    of the call will equal 0. The right-hand equation for the right-boundary states
    that, for all times up to expiry, the value of the call will equal the payoff-function,
    albeit adjusted to take into account discounting by the risk-free rate, $r$. This
    is a consequence of Put-Call Parity. Both of these boundary conditions are of
    a Dirichlet type.


    The final line is the **initial condition**, which describes how the solution
    should behave at the start of the time-arching procedure. Since we are marching
    backwards, this is actually the final payoff of the option at expiry, which is
    the familiar expression for a vanilla call option pay-off.


    # 17.2 Finite Difference Discretisation


    Now that we have the continuous problem mathematically, we have to take this and
    create a finite set of discretised algebraic equations, which are able to be solved
    by the computer. We will make use of *forward differencing* for the time partial
    derivative, *centred differencing* for the first order spatial derivative and
    a *centred second difference* for the diffusion term:


    ```

    $\frac{C^{n+1}-C^n}{\Delta t} + \frac{1}{2}\sigma^2 S_j^2 \left(\frac{C_{j+1}^n-2C_j^n+C_{j-1}^n}{\Delta
    x^2}\right) + rS_j \left(\frac{C_{j+1}^n-C_{j-1}^n}{\2\Delta x}\right) - rC_j^n
    = 0$

    ```


    This can be rearranged so that the solution at time level $N+1$ is given in terms
    of the solution at level $N$. This is what gives it *explicit* name. The solution
