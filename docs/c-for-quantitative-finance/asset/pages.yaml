  md: '# # Chapter 9


    # # Numerical Linear Algebra


    Numerical Linear Algebra (NLA) is a branch of numerical analysis that concerns
    itself with the study of algorithms for performing linear algebra calculations.
    It is an extremely important area of computational finance as many quant methods
    rely on NLA techniques. In particular, the matrix computations carried out in
    NLA form the basis of the Finite Difference Method, which is often used to price
    certain path-dependent options via numerical solution of the Black-Scholes PDE.


    # ## 9.1 Overview


    While the Finite Difference Method motivates the use of NLA techniques, such as
    LU Decomposition and the Thomas Algorithm, the subject is applicable to a wide
    range of tasks within quantitative finance. The Cholesky Decomposition finds application
    among correlation matrices. QR Decomposition is an essential component of the
    linear least square, used in regression analysis. Singular Value Decomposition
    (SVD) and Eigenvalue Decomposition are two other techniques commonly used in finance
    for creating predictive models or carrying out exposiatory data analysis.


    In this section we will study the LU Decomposition, the Thomas Algorithm, the
    Cholesky Decomposition and the QR Decomposition. We will apply these algorithms
    to quantitative problems later in the book.'
