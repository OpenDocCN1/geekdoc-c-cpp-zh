    creating our random draws.


    # 14.2.1 Linear Congruential Generators


    Linear congruential generators (LCG) are a form of random number generator based
    on the

    following general recurrence relation:


    > $x_{k+1} = g \cdot x_k \pmod n$


    When $n$ is a prime number (or power of prime number), $g$ has high multiplicative
    order

    modulo $n$ and $x_0$ (the initial seed) is co-prime to $n$. Essentially, if $g$
    is chosen correctly, all

    integers from 1 to $n-1$ will eventually appear in a periodic fashion. This is
    why LCGs

    are pseudo-random. Although they possess "enough" randomness for our needs ($n$
    can be

    large), they are far from truly random. We won''t dell on the details of the mathematics
    behind

    LCGs, as we will not be making use of them going forward in our studies. However,

    most system-supplied RNGs make use of LCGs, so it is worth being aware of the
    algorithm.

    The listing below (lin_con_gen.cpp) contains the implementation of the algorithm.
    If you want

    learn more about how LCGs work, take a look at Numerical Recipes[20].'
