    provide our implementation of `operator()`. This is a special operator that allows
    us to call the class as if it were a function. Since the PayOff class and its
    subclasses are just “wrappers” for the pay-off function, it makes sense to specify
    the interface in this manner. It is clearer for clients and demonstrates the intent
    of the class hierarchy with more clarity. These types of classes are known as
    *function objects* or *functors*. We will have more to say about functors later
    in the book.


