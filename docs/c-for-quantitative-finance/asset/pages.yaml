    # ## Stochastic Volatility


    We have spent a good deal of time looking at vanilla and path-dependent options
    on QuantStart so far. We have created separate classes for random number generation
    and sampling from a standard normal distribution. We''re now going to build on
    this by generating correlated time paths.


    Correlated asset paths crop in many areas of quantitative finance and options
    pricing. In particular, the Heston Stochastic Volatility Model requires two correlated
    GBM asset paths as a basis for modelling volatility.


    # ### 16.1 Motivation


    Let''s motivate the generation of correlated asset paths via the Heston Model.
    The original Black-Scholes model assumes that volatility, $\sigma$, is constant
    over the lifetime of the option, leading to the stochastic differential equation
    (SDE) for GBM:


    ```

    $dS_t = \mu S_t dt + \sigma S_t dW_t \quad (16.1)$

    ```


    The basic Heston model now replaces the constant $\sigma$ coefficient with the
    square root of the instantaneous variance, $\sqrt{

    u_t}$. Thus the full model is given by:


    ```

    $dS_t = \mu S_t dt + \sqrt{

    u_t} S_t dW_t^S \quad (16.2)\nd\nu_t = \kappa(\theta - \nu_t)dt + \xi \sqrt{

    u_t} dW_t^{\nu} \quad (16.3)$

    ```'
