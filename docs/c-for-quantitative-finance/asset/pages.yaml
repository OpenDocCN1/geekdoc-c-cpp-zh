  md: 'This is possible because the boundary conditions generated by the pay-off function
    of the European vanilla option allow us to easily calculate a closed-form solution.
    Many option pay-off functions lead to boundary conditions which are much harder
    to solve analytically and are impossible to solve this way. In these situations
    we need to rely on numerical approximation.


    We will now price the same European vanilla option with a very basic Monte Carlo
    solver in C++ and then compare our numerical values to the analytical case. We
    won''t be concentrating on an extremely efficient or optimised implementation
    at this stage. Right now I just want to show you how to get up and running to
    give you an understanding of how risk pricing works numerically. We will also
    see how our values differ from generated analytically.


    # 10.3 Risk Neutral Pricing of a European Vanilla Option


    The first stage in implementation is to briefly discuss how risk neutral pricing
    works for a vanilla call or put option. We haven''t yet discussed on risk neutral
    pricing depth, so in the meantime, it might help to have a look at the article
    on Geometric Brownian Motion on QuantStart.com, which is the underlying model
    of stock price evolution that we will be using. It is given by the following stochastic
    differential equation:


    > $dS(t) = \mu S(t)dt + \sigma S(t)dB(t)$


    where $S$ is the asset price, $\mu$ is the drift of the stock, $\sigma$ is the
    volatility of the stock and $B$ is a Brownian motion (or Wiener process).


    You can think of $dB$ as being a normally distributed random variable with zero
    mean and variance $dt$. We are going to use the fact that the price of a European
    vanilla option is given as the discounted expectation of the option pay-off of
    the final spot price (at maturity $T$):


    > $e^{-rT}E(f(S(T)))$


    This expectation is taken under the appropriate risk-neutral measure, which sets
    the drift $\mu$ equal to the risk-free rate $r$:


    > $dS(t) = rS(t)dt + \sigma S(t)dB(t)$'
