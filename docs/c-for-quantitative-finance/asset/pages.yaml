  md: '# Chapter 1


    # # Introduction to the Book


    # ##1.1 Introduction to QuantStart


    QuantStart was founded by Michael Halls-Moore, in 2010, to help junior quantitative
    analysts (QAs) find jobs in the tough economic climate. It now includes book reviews,
    quant finance articles and programming tips. Since March 2010, QuantStart has
    helped over 20,000 visitors to become quantitative analysts. You can always contact
    QuantStart by sending an email to mike@quantstart.com.


    # ##1.2 What is this book?


    The C++ For Quantitative Finance book is designed to teach junior/prospective
    quants with some basic C++ skills to be a professional grade quantitative analyst
    with advanced C++ skills. The book describes advanced features of C++ such as
    templates, STL, inheritance, polymorphism and design patterns. In addition, the
    book applies these features to numerical methods used by quants, such as Finite
    Differences and Monte Carlo, to numerically determine the price of derivatives.
    The book is driven by examples and includes many projects to implement the principles
    and methods taught.


    # ##1.3 Who is this book for?


    The book has been written for prospective and junior quantitative analysts who
    have some exposure to programming with C++ and wish to learn how to program in
    a professional environment. It is designed for those who enjoy self-study and
    can learn by example. Much of the book is about'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'actual programming and implementation - you can''t be a good quant unless you
    implement your mathematical models!


    Senior quarts will also find the content useful. Alternative implementations of
    a particular model or tips to improve compiler efficiency and software project
    management come in useful, for seasoned financial engineers.


    # 1.4 What are the prerequisites?


    You should have a strong mathematical background. Calculus, linear algebra and
    stochastic calculus will be necessary for you to understand the methods such as
    Finite Differences and Monte Carlo that you will be implementing.


    You should be aware of elementary programming concepts such as variable declaration,
    control (for/while) and the basic compilation process for C++ programs. You should
    be familiar with an IDE or C++ compiler (see below).


    You should be familiar with basic quantitative finance concepts such as pricing
    by binomial trees, stochastic calculus and risk neutrality. You should be aware
    of the common types of financial derivatives and payoffs, such as vanilla calls
    and puts and exotic options such as Asian Barriers.


    If you are rusty on this material, or it is new to you, to have a look at the
    QuantStart reading list: http://www.quantstart.com/articles/Quant-Reading-List-Derivative-Pricing
    and look for “Mathematical Finance”.


    # 1.5 Software Requirements


    Quantitative finance applications in C++ can be developed in Windows, Mac OSX
    or Linux. This book is agnostic to the end software, so it is best to use whatever
    C++ environment you''re currently comfortable with.


    If you use Windows, you can download Microsoft Studio Express Edition 2012, which
    comes with Visual C++. There are some great tutorials on how to get started with
    it, but this book assumes you know how to use an Integrated Development Environment
    (IDE).


    If you use Mac OSX or Linux you can use a text editor as Vim or Emacs, along with
    the GCC compiler toolset. On Mac OSX specifically, you can download the Xcode
    Development Tools as an alternative IDE.'
  merge: -1
  pgno: 8
- img_proc: true
  md: '# 1.6 Book Structure


    The book is broken down into chapters, each of which will concentrate either on
    a feature of C++ or on a particular implementation of a pricing model. The first
    set of chapters concentrate on intermediate features of C++, along with implementation
    examples of basic quantitative finance concepts. These initial chapters will teach
    you about language features, which will be applied to the implementation of quantitative
    models later on in the book.


    You will cover the following topics:


    +   - Object Oriented Programming (OOP)


    +   - Option and PayOff Classes


    +   - Pass-by-Value/Pass-by-Reference


    +   - Const Keyword


    +   - Inheritance


    +   - Abstract Base Classes


    +   - Virtual Destructors


    +   - Function Objects


    +   - Operator Overloading


    +   - Generic/Template Programming


    +   - Standard Template Library (STL)


    Later chapters will discuss mathematics and statistics. You will look at how matrices
    in C++, how to solve matrix equations and how to generate random numbers and statistical
    classes. These will be essential tools in our C++ quant toolbox.


    Then we will discuss pricing techniques using Monte Carlo Methods (MCM) and Finite
    Difference Methods (FDM) in detail. We will create basic MCM and FDM solvers for
    some options and then to calculate the "Greeks" (option price sensitivities) and
    how to hedge. Beyond MCM and FDM, we will study advanced pricing engines. In particular,
    we will study Exotic/Path-dependent options, Jump-Diffusion Models and Stochastic
    Volatility Models.'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# 1.7 What the book does not cover


    This is not a beginner book on C++, programming or quantitative finance. It will
    not teach you about variable declaration, branching, looping or how to compile
    a program. If you need to brush up on these concepts, take a look at this article
    on the QuantStart website:


    http://www.quantstart.com/articles/Top-5-Essential-Beginner-C-Books-for-Financial-Engineers


    The book has not been designed to teach you what a Partial Differential Equation
    (PDE) is or what a derivative is (mathematical or financial!). It certainly is
    not an introduction to stochastic calculus. Make sure you come into this book
    with a good mathematical background (an undergraduate degree in Mathematics, Physics
    or Engineering is approximately the correct level).


    # 1.8 Where to get help


    The best place to look for help is the articles list, found at http://www.quantstart.com/articles
    or by contacting me at mike@quantstart.com. I''ve written many articles about
    basic quantitative finance, so you can brush up by reading some of them. Thanks
    for pre-ordering the book and helping to support me while I write more content
    - it is very much appreciated. Good luck with your quant career plans! Now onto
    some quant finance...'
  merge: -1
