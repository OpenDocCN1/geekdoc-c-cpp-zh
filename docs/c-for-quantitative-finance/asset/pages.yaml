  md: '# Chapter 12


    # Asian/Path-Dependent Options

    with Monte Carlo


    In this chapter I''m going to discuss how to price a certain type of *Exotic*
    option known as *Path-Dependent Asian* in C++ using Monte Carlo Methods. It is
    considered “exotic” in the sense that the pay-off of the underlying asset at multiple
    points throughout its lifetime, rather than just the value at expiry. It is an
    example of a *multi look option*. An Asian option utilises the mean of the underlying
    asset price sampled at appropriate intervals along its lifetime as the basis for
    its pay-off, which is where “path-dependency” of the asset comes from. The name
    actually arises because they were first devised in 1987 in Tokyo as options on
    crude oil futures.


    There are two types of Asian option that we will be pricing. are the *arithmetic
    Asian* and the *geometric Asian*. They differ only in how the mean of the underlying
    values is calculated. We will be studying Discrete Asian options in this chapter,
    as opposed to the theoretical continuous Asian options. The first step will be
    break down the components of the program and construct a set of classes that represent
    the various aspects of the pricing. Before however, I will brief explain how Asian
    options work (and are priced by Monte Carlo).


    # 12.1 Overview of Asian Options


    An Asian option is a type of *exotic* option. Unlike a vanilla European option
    where the price of the option is dependent on the price of the underlying asset
    at expiry, an Asian option pay-off is a function of multiple points up to and
    including the price at expiry. Thus it is *path-dependent*'
