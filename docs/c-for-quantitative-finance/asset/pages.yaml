  md: '#  Chapter 11


    # # Calculating the “Greeks”


    One of the core financial applications of derivatives pricing theory is to be
    able to manage risk via a liquid options market. Such a market provides the capability
    for firms and individuals to tailor their risk exposure depending upon their hedging
    or speculation requirements. In order to effectively assess such risks, it is
    necessary to calculate the sensitivity of options price to the factors that affect
    it, such as the underlying asset price, volatility and time to option expiry.


    If we assume the existence of an analytical formula for an option price (such
    as in the case of European vanilla call/put options on a single asset) then it
    is possible to differentiate the call price with respect to its parameters in
    order to generate these sensitivities. The common sensitivities of interest include:


    +   - Delta - Derivative of an option with respect to (w.r.t.) the spot price,
    $\frac{\partial C}{\partial S}$


    +   - Gamma - Second derivative of an option w.r.t. the spot price, $\frac{\partial^2
    C}{\partial S^2}$


    +   - Vega - Derivative of an option w.r.t. the underlying volatility, $\frac{\partial
    C}{\partial \sigma}$


    +   - Theta - (Negative) derivative of an option w.r.t. the time to expiry, $\frac{\partial
    C}{\partial t}$


    +   - Rho - Derivative of an option w.r.t. the interest rate, $\frac{\partial
    C}{\partial p}$


    Since all of the sensitivities are commonly denoted by letters of the Greek alphabet
    (except Vega!) they have come to be known colloquially as "the Greeks".


    In this chapter we will calculate the Greeks using three separate methods. In
    the first instance we will utilise formula derived directly from the analytic
    formulae for European vanilla call and put options on a single asset. This will
    provide us with a baseline to determine the accuracy of subsequent numerical methods.'
