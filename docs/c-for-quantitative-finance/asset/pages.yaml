    \ first order sensitivities (Vega, Rho and Theta) can be calculated in this manner\
    \ by simply incrementing the correct parameter dimension. Gamma on the other hand\
    \ is a second derivative and must be approximated in a different way. The usual\
    \ approach in FDM is to use a central difference approximation to produce the\
    \ formula:\n\n$$\\frac{\\partial^2 C}{\\partial S^2} \\approx \\frac{C(S+\\Delta\
    \ S, T, \\sigma, r, K) - 2C(S, T, \\sigma, r, K) + C(S-\\Delta S, T, \\sigma,\
    \ r, K)}{(\\Delta S)^2}$ (11.2)\n\nAt this stage we will keep the procedural as\
    \ we wish to emphasise the mathematical formulae. We are now able to implement\
