  md: '# 13.3.1 Interval Bisection with Function Templates


    So far we''ve made extensive use of object-orientation and, in particular, inheritance
    hierarchies as one of the main design patterns for solving quantitative finance
    problems. We''re going to use a very different set of tools, that of functors
    and function templates. We''ve discussed how functions work before and used them
    to create PayOff classes. We are now going to supplement their use by including
    function templates, which are a means of applying the template generic programming
    paradigm that we have previously applied to classes, to functions themselves.


    The motivation for using functors and function templates is that we wish to create
    our internal bisection code in a reusable fashion. Ideally, the bisection code
    should be able to cope with a generic function, including those with their own
    set of (fixed) parameters. This is the situation we are in, because the Black-Scholes
    formula requires not only the volatility, but the strike, spot price, maturity
    and interest rate.


    Creating the Black-Scholes call option as a function allows us to pass it to the
    interval bisection function with attached state, in which this case is the code
    of arguments representing the option parameters. In fact, the bisection method
    doesn''t even need to know about these parameters, as the only interface exposed
    to it is an option pricing operator() method, which accepts only a volatility.


    Another reason to use function templation over inheritance is that we would be
    at the mercy of virtual functions. Virtual functions are relatively slow, as each
    time a function is called the vtable must be queried, which is extra overhead.
    Further, virtual functions cannot be inclined, which is a major disadvantage.
    This leads to slower code. These problems also apply to function pointers as well,
    which is why we''re not making use of them.


    The approach we will follow is to make the interval.bisection function a template
    function, which in our case we will be the Black-Scholes call pricing method.
    We''ll now discuss the C++ implementation.


