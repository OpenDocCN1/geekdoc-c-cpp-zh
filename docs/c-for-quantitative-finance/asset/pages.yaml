  md: '# # Chapter 6


    # # Introduction to the Standard Template Mathematical Library


    The Standard Template Library (STL) is a cross-platform standard of efficient
    data structures and algorithms. It is one of the most important features of C++
    and will form the basis of all quantitative finance programs within this book.
    The STL is often confusing to novice programmers because it makes use of the *generic
    programming paradigm*, as opposed to the *object oriented paradigm*. In fact,
    it could be said that the STL is the opposite approach, in that rather than encapsulate
    the data and algorithms acting upon it, the STL actually separates these functions
    through a common *iterator* interface.


    The STL is extremely important in quantitative finance because many of the quant
    data structures and algorithms rely on more elementary concepts such as sorting,
    maxima/minimum, copying, mathematical function modelling and searching. Rather
    than reimplement these basic algorithms from scratch, C++ provides them “out of
    the box”. This allows you to spend more time testing your algorithms, rather than
    “reinventing the wheel”.


    The STL is a large library. It contains a wealth of data structures and algorithms.
    In this chapter I will attempt to give a broad overview of the STL and highlight
    aspects which are relevant to quantitative finance.


    # ## 6.1 Components of the STL


    The STL can be broadly split into four separate components:'
  merge: -1
