    # 8.2.4 Expression Templates


    One of the most attractive features of the Eigen library is that it includes expression
    objects and lazy evaluation. This means that any arithmetic operation actually
    returns such an expression object, which is actually a description of the final
    computation to be performed rather than the actual computation itself. The benefit
    of such an approach is that most compilers are able to optimise the expression
    such that additional loops are completely minimised. As an example, an expression
    such as:


    ```

    VectorXd p(10), q(10), r(10), s(10);

    ...

    p = 5*q + 11*r - 7*s;

    ```


    will compile into a single loop:


    ```

    for (unsigned i=0; i<10; ++i) {

    np[i] = 5*q[i] + 11*r[i] - 7*s[i];

    }

    ```


    This means that the underlying storage arrays are only looped over once. As such
    Eigen optimise relatively complicated arithmetic expressions.'
