  md: '# Reverse Iterators


    Reverse iterator adaptors essentially "swap" the increment (++) and decrement
    (--) operators so that any algorithms making use of these iterators will be carried
    out in reverse. Every STL container allows reverse iteration. It is possible to
    convert standard iterators to reverse iterators, although any converted iterator
    must support both increment and decrement (i.e. it must be bidirectional).


    # Insertion Iterators


    Insertion iterators adapt normal output iterators to perform insertion instead
    of overwriting. They only allow writing, as with normal output iterators. There
    are three insertion iterators in the STL: back, front and general. They all behave
    differently with regards to the position of the inserted element:


    +   **Back inserters** utilise the push.back method of the container is acting
    upon and will append values at the end. Hence they only work on a subset of containers
    that support the method (strings, lists, deques and vectors).


    +   **Front inserters** utilise the push.front method of the container and is
    only available for two containers in the STL - the deque and the list.


    +   **General inserters** utilise the insert method of the container being acted
    upon, which is supported by all STL containers.


    # Stream Iterators


    Stream iterators are adapted iterators that permit reading and writing to and
    from input and output streams. **stream** iterators are used to read elements
    from an input stream, making use of the >> operator. **ostream** iterators are
    the writing counterpart and can write to an output stream via the << operator.


    # 6.3.3 Const Iterators


    Containers allow both iterator and const_iterator types. const_iterators are returned
    by certain container methods (such as begin or end) when the container itself
    is **const**.


    One must be careful to distinguish between const_iterator and **const** iterator
    (notice the lack of underscore!). The former is a non-const object with iterator
    type, so that it returns objects'
