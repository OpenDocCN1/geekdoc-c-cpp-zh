  md: '# Chapter 5


    # Generic Programming andnTemplate Classes


    # 5.1 Why Generic Programming?


    In 1990 templates were added to C++. This enabled a new paradigm of programming
    known as generic programming.


    In order to explain how generic programming differs from object-oriented programming
    (OOP) we need to review how classes work. Recall that classes allow encapsulation
    of data. They provide a declaration of an interface, which determines how an external
    client accesses that data. Instance objects are created from these classes. You
    can think of classes as a “mould” or “pattern” for creating objects. Normal classes
    are bound to the data types specified for their member data. This means that if
    we want to store values or objects within that class, we must specify the type
    of data upfront.


    # 5.2 Template Classes


    Template classes behave in a different way. They allow us to define classes without
    the need to specify the types of data that the classes will utilise upfront. This
    is a very powerful feature as it allows us to create generic classes that are
    not restricted to a particular set of data types.


    This is quite a complicated abstract concept to grasp at first. So let''s consider
    an example, which is a common pattern within the C++ standard template library
    (STL).'
