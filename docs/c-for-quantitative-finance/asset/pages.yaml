  md: '* Containers - Data structures designed to efficiently store information across
    a variety of generic types.


    * Iterators - Methods by which to traverse/access the data within the containers.


    * Algorithms - Basic algorithmic capabilities, such as sort, find, max, min, replace.
    Makes use of iterators to allow "container independent" code.


    * Function Objects - a.k.a. functors. Used to make templates “callable” to allow
    modelling of mathematical functions.


    There are extra smaller components, but these are the four that will interest
    us for quantitative finance work.


    # 6.2 Containers


    Containers allow certain types of data to be grouped into logical structures.
    The STL provides generic containers so that the same data structure can handle
    multiple different types without any additional required coding. For instance,
    we could create a std::vector<double> or a std::vector<int>. The former would
    be a vector of double precision values, while the latter is a vector of integer
    precision values. Notice that we are not required to code anything to let the
    vector know we are using these types!


    # 6.2.1 Sequence Containers


    Sequence containers are extremely common within quantitative finance applications.
    They are often used to store numerical data sequentially. For instance we may
    want to store components of an element of a vector field or matrix of complex
    numbers. There are three main types of sequential containers that tend to be the
    most:


    +   * Lists - The two types of list are the singly-linked list and the doubly-linked
    list. A singly-linked list has only forward pointers to the next element, whereas
    a doubly-linked list has forward and backward pointers. They do not allow random
    access to elements, but do fast inserts and removals.


    +   * Vectors - Vectors allow fast random access to elements, but are slow for
    inserts and removals within the vector (as all elements need to be copied and
    moved). They allow fast appends and “pops” (i.e. removals from the end).'
