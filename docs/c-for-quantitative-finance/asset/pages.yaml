  md: 'Deques - i.e. double-ended queues. Deques are similar to vectors except that
    they allow fast appends/removals to both ends of the queue.


    There is also the valarray container, which is (supposedly) optimised for numerical
    work. However, in practice valarray is harder to use and modern compilers do not
    implement the optimisations well enough to warrant them as an alternative to vectors.


    # 6.2.2 Associative Containers


    Associative containers are different from sequential containers in that there
    is no direct linear sequence to the elements within the container. Instead, they
    are sorted based on a comparison criterion. This criterion is often determined
    via the context. In a std::set<int>, the comparison operator is the less than
    (<) operator. There are four main types of associative container, which differ
    in terms of duplicate elements and the key and value coincide


    +   - Set - A set provides a container that does not allow duplicate elements
    and where the data is itself the key and value. Sets can be sorted according to
    comparison functions. Here is an example of a set of integers: {1, 2, 3, 4}.


    +   - Multiset - A multiset is very similar to a set that it can possess multiple
    duplicate values. Here is an example of a multiset of integers: {1, 2, 3, 4}.
    Notice the duplicate 3s.


    +   - Map - A map contains pairs of elements, the two components which are known
    as the key and value. The key is used to "look up" the value data. Maps do not
    allow duplicate keys, but they provide a great deal of flexibility in what types
    of data can represent the keys and values. An example of a map would be a set
    of date keys, each of which possessed a price value, without duplicate dates.


    +   - Multimap - A multimap is similar to a map except that duplicate keys are
    allowed. This is possible because the values can be iterated over in a sorted
    fashion, using the aforementioned comparison function.


    Although it might initially seem that associative containers are less appropriate
    for handling numerical data within quantitative finance, this is not actually
    the case. A map is ideal for holding the values of sparse matrices (such as tridiagonal
    or banded), which crop up in finite difference methods, for instance.'
