  md: '# Chapter 15


    # Jump-Diffusion Models


    This chapter will deal with a particular assumption of the Black-Scholes model
    and how to refine it to produce more accurate pricing models. In the Black-Scholes
    model the stock price evolves as a geometric Brownian motion. Crucially, this
    allows continuous Delta hedging and thus a fixed no-arbitrage price for any option
    on the stock.


    If we relax the assumption of GBM and introduce the concept of discontinuous jumps
    in the stock price then it becomes impossible to perfectly hedge and leads to
    *market incompleteness*. This means that options prices are only bounded rather
    than fixed. In this article we consider the effect on options prices when such
    jumps occur and implement a semi-closed pricier in C++ based on the analytical
    formula derived by Merton[16].


    # 15.1 Modelling Jump-Diffusion Processes


    *This section closely follows the chapter on Jumpy Diffusions in Joshi[12], where
    more theoretical details are provided.*


    In order to model such “jumps” we require certain properties. Firstly, the jumps
    should occur in an instantaneous fashion, neglecting the possibility of a Delta
    hedge. Secondly, we require that the probability of any jump occurring in a particular
    interval of time should be approximately proportional to the length of that time
    interval. The statistical method that models such a situation is given by the
    Poisson process[12].


    A Poisson process states the probability of an event occurring in a given time
    interval $\Delta t$ is given by $\lambda\Delta t+\epsilon$, where $\lambda$ is
    the *intensity* of the process and $\epsilon$ is an error term. The integer-valued
    number of events that have occurred at time $t$ is given by $N(t)$. A necessary
    property is that the probability of a jump occurring is independent of the number
    of jumps already occurred, i.e. all'
