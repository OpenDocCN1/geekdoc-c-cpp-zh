  md: '# Chapter 14


    # Random Number Generation andnStatistical Distributions


    In this chapter we are going to construct classes to help encapsulate the generation
    of random numbers. Random number generators (RNG) are an essential tool in quantitative
    finance as they are necessary for Monte Carlo simulations that power numerical
    option pricing techniques. Other chapters have so far used RNGs in a procedural
    manner. In particular, we have utilised the Box-Muller technique to generate one
    or more random variables distributed as a standard Gaussian.


    # 14.1 Overview


    We will now show how to construct a random number generator class hierarchy. This
    allows us to separate the generation of random numbers from the Monte Carlo solvers
    that make use of them. It helps reduce the amount of code we need to write in
    the future, increases extensibility by allowing easy creation of additional random
    number generators and makes the code more maintainable.


    There are further reasons to write our own random number generators:


    +   * It allows us to make use of pseudo-random numbers. These are sequences of
    numbers that possess the correct statistical properties to `enumerate` random
    numbers in order to improve the convergence rates of Monte Carlo simulations.
    The interface for random numbers and pseudo-random numbers is identical and we
    can hide away the details in the specific classes. In particular we can implement
    low-discrepancy numbers and anti-hetic sampling'
  merge: -1
  pgno: 189
- img_proc: true
  md: 'in this manner.


    +   Relying on the rand function provided with the C++ standard is unreliable.
    Not only is rand implementation specific, because it varies across multiple vendor
    compilers, but we are unaware of the efficiency of each implementation. This leads
    to difficulties in cross-platform testing as we cannot guarantee reproducibility.


    +   We are able to provide multiple separate streams of random numbers for different
    parts of our running program. The seed for the rand function, srand, is a global
    variable and hence will affect all components of our program, which is usually
    unwanted behaviour. By implementing our own RNG we avoid this issue.


    # 14.2 Random Number Generator Class Hierarchy


    Our random number generators will be formed from an inheritance hierarchy. We
    have already used this method when constructing PayOff classes for pay-off functions.
    To form the hierarchy we will create an abstract base class that specifies the
    interface to the random number generator. All subsequent generators will inherit
    the interface from this class.


    The primary considerations of this interface are as follows:


    +   Quantity and dimension of the generator: Many of the options pricers we have
    already created more than a single random number in order to be accurately priced.
    This is the case for path-dependent options such as Asians, Barriers and Lookbacks.
    Thus our first consideration is to make sure that the generator provides a vector
    of random numbers, with the dimension specified at the creation of the instance.


    +   The supported statistical distributions from which to draw random variables:
    For options, the two main statistical distributions of interest will be the uniform
    distribution and the standard normal distribution (i.e. the "Gaussian" distribution).
    Gaussian random draws are calculated from uniform random draws. We can use the
    statistical classes in order to obtain random draws from any particular distribution
    we, without modifying the RNG.


    +   We will need methods to support obtaining and setting the random seed, so
    that we can control which random numbers are generated and to ensure reproducibility
    across separate runs and platforms.'
