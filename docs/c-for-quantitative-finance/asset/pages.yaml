  md: '# Chapter 17


    # # Single Factor Black-Scholes with Finite Difference Methods


    We''ve spent a lot of time in this book looking at Monte Carlo Methods for pricing
    of derivatives. However, we''ve so far neglected a deep theory of pricing that
    takes a different approach. In this chapter we are going to begin making use of
    Finite Difference Methods (FDM) in order to price European options, via the *Explicit
    Euler Method*.


    Finite Difference Methods are extremely common in fields such as fluid dynamics
    where stability are used to provide numerical solutions to partial differential
    equations (PDE), which often possess no analytical equivalent. Finite Difference
    Methods are relevant to us since the Black Sch equation, which represents the
    price of an option as a function of underlying asset spot price, is a partial
    differential equation. In particular, it is actually a *convection-diffusion equation*,
    type of second-order PDE.


    Finite Difference Methods make appropriate approximations to the derivative in
    a PDE, such that the problem is reduced from a continuous differential equation
    to a finite set of discrete algebraic equations. The solution of these equations,
    under certain conditions, approximates the continuous solution. By refining the
    number of discretisation points it is possible to more closely approximate the
    continuous solution to any accuracy desired, certain *stability conditions*.


    Finite Difference Methods use a *time-marching* approach to take a known approximate
    solution at time $N, C^N$, and calculate a new approximate solution at a stepped
    time $N+1, C^{N+1}$. However, the Black-Scholes equation is slightly different
    in that the known solution is actually the pay-off of the option at expiry time,
    $T$. Hence time is marched *backwards* from the expiry'
  merge: -1
  pgno: 237
- img_proc: true
  md: 'point to the initial time, $t = 0$. This is analogous to the diffusion of heat
    in the *heat equation*. In fact, the *Black-Scholes* can be transformed into the
    heat equation by a suitable coordinate change and solved analytically, although
    this is beyond the scope of this chapter!


    In order to obtain a solution to the Black-Scholes PDE for a European vanilla
    call option, we will carry out the following steps:


    +   Describe the PDE - Our first task is to outline the mathematical formalism
    by describing the Black-Scholes equation itself along with any initial and boundary
    conditions that apply as well as the domain over which the solution will be calculated.


    +   Discretisation - We will discretise the Black-Scholes PDE using suitable approximations
    to the derivative terms.


    +   Object Orientation - Once we have the discretisation in place we will decide
    how to define the objects representing our finite difference method in C++ code.


    +   Execution and Output - After we have created all of the C++ code for the implementation,
    and executed it, we will plot the resulting option pricing surface using Python
    and matplotlib.


    The formula for the Black-Scholes PDE is as follows:


    $$\frac{\partial C}{\partial t} + rS\frac{\partial C}{\partial S} + \frac{1}{2}\sigma^2
    S^2\frac{\partial^2 C}{\partial S^2} - rC = 0$$


    Our goal is to find a *stable* discretization for this formula that we can implement.
    It will produce an option pricing surface, $C(S, t)$ as a function of spot $S$
    and time $t$ that we can plot.


    # 17.1 Black-Scholes PDE for a European Call Option


    In this chapter we are going to start approximating the solution to a European
    vanilla call option. In fact an analytic solution exists for such an option. However,
    our task here is to outline the Finite Difference Method, not to solve the most
    exotic option we can find right away!


    In order to carry the procedure we must specify the Black-Scholes PDE, the domain
    on which the solution will exist and the constraints - namely the initial and
    boundary conditions that apply. Here is the full mathematical formalism of the
    problem:'
  merge: -1
