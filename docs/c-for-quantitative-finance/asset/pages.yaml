    directly or via a copy into another container range. Some algorithms classed as
    ''modifying'' algorithms can change the order of elements (in particular copy_backward()),
    but most do not.


    +   - Removal algorithms - Removal algorithms are, by definition, modifying algorithms,
    but they are designed to remove elements in a container or when copying into another
    container.


    +   - Mutating algorithms - Once again, mutating algorithms are modifying algorithms,
    but they are designed specifically to modify the order of elements (e.g. a random
    shuffle or rotation).


    +   - Sorting algorithms - Sorting algorithms are modifying algorithms specifically
    designed for efficient sorting of elements in a container (or into a range container).


    +   - Sorted range algorithms - Sorted range algorithms are special algorithms
    designed to function on a container which is already sorted according to a particular
    sorting criterion. This allows for greater efficiency.


    +   - Numeric algorithms - Numeric algorithms are designed to work on numerical
    data in some fashion. The principal algorithm in this category is accumulate(),
    which allows mathematical operators to be applied to all elements in a container.


