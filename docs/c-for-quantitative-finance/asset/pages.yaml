- img_proc: true
  md: 'future jumps should have no "memory" of past jumps. The probability of $j$
    jumps occurring by time $t$ is given by:


    ```

    $\mathbb{P}(N(t) = j) = \frac{(\lambda t)^j}{j!} e^{-\lambda t} \quad (15.1)$

    ```


    Thus, we simply need to modify our underlying GBM model for the stock via the
    addition of jumps. This is achieved by allowing the stock price to be multiplied
    by a random factor $J$:


    ```

    $dS_t = \mu S_t dt + \sigma S_t dW_t + (J-1)S_t dN(t) \quad (15.2)$

    ```


    Where $dN(t)$ is Poisson distributed with factor $\lambda dt$.


    # 15.2 Prices of European Options under Jump-Diffusions


    After an appropriate application of risk neutrality[12] we have log $S_T$, the
    log of the final price of the stock at option expiry, is given by:


    ```

    $$\log(S_T) = \log(S_0) + (\mu + \frac{1}{2}\sigma^2)T + \sigma\sqrt{T}N(0,1)
    + \sum_{j=1}^{N(T)} \log J_j \quad (15.3)$

    ```


    This is all we need to price European options under a Monte Carlo framework. To
    carry out this we simply generate multiple final spot prices by drawing from a
    normal distribution and a Poisson distribution, and then selecting the $J_j$ values
    to form the jumps. However, this is somewhat unsatisfactory as we are specifically
    choosing the $J_j$ values for the jumps. Shouldn''t they themselves be random
    variables distributed in some manner?


    In 1976, Robert Merton[16] was able to derive a semi-closed solution for the price
    of European options where the jump values are themselves normally distributed.
    If the price of an option priced under Black-Scholes is given by $BS(S_0, \sigma,
    r, T, K)$ with $S_0$ initial spot, $\sigma$ constant volatility, $r$ constant
    risk-free rate, $T$ to maturity and $K$ strike price, then in the jump-diffusion
    the price is given:


    ```

    $$\sum_{n=0}^{\infty} \frac{e^{-\lambda T}(\lambda T)^n}{n!} BS(S_0, \sigma_n,
    r_n, T, K) \quad (15.4)$

    ```'
