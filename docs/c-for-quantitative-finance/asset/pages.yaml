  md: 'Input - An input iterator is a single-pass read-only iterator. In order to
    traverse elements, the ++ increment operator is used. However, elements can only
    be read. Input iterators do not support the decrement operator, which is why they
    are termed single-pass. Crucially, an input iterator is unable to modify elements.
    To access an element, a pointer dereference operator is utilised.


    Output - An output iterator is very similar to an input iterator with the major
    exception that the iterator writes values instead of reading them. With input
    iterators, writes can only occur once and there there is no means of stepping
    backwards. Also, it is only possible to assign a value to any individual element.


    Forward - A forward iterator is a combination of an input and output iterator.
    As before the increment operator (++) allows forward stepping, but there is no
    decrement operator support. To read or write to an element the pointer dereference
    operator (*) must be used. However, unlike the previous iterator categories, an
    element can be read or written multiple times.


    Bidirectional - A bidirectional iterator is similar to a forward iterator except
    that it supports backwards stepping via the decrement operator (–).


    Random Access - A random access iterator is the most versatile iterator category
    and is much like a traditional C-style pointer. It possesses all the abilities
    of a bidirectional iterator, with the addition of being able to access any index
    via the [] subscript operator. Random access iterators also support pointer arithmetic
    so integer stepping is allowed.


    Iterators are divided into these categories mainly for performance reasons. Certain
    iterators are not supported by certain containers when C++ deems it iteration
    will lead to poor performance. For instance, random access iteration is not supported
    on the std::list as access to a random element would potentially require traversal
    of the entire linked-list used to store the data. This is in contrast to a std::vector
    where pointer arithmetic can be used to step directly to the desired item.


    # 6.3.2 Iterator Adaptors


    Iterator adaptors allow iterators to be modified to allow special functionality.
    In particular, iterators can be reversed, they can be modified to insert rather
    than overwrite and can be adapted to work with streams.'
