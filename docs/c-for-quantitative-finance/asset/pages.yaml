    returning the object itself. Thus a new matrix is being allocated when this method
    is called. The method requires a const reference to another matrix, which forms
    the "right hand side" (rhs) of the binary operation. It is a const reference because
    we don''t want the matrix to be modified when the operation is carried out (the
    const part) and is passed by reference (as opposed to value) as we do not to generate
    an expensive copy of this matrix when the function is called.


