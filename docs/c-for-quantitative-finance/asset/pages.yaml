  md: '# Chapter 2


    # Introduction to C++


    # 2.1 A Brief History Of C++


    C++ was created in 1979 by Bjarne Stroustrup. He provisionally called it “C with
    Classes”, as the C programming language did not possess any real object oriented
    features. *Although some think C++ was the first “official” object oriented language,
    Simula holds the distinction instead.*


    In 1983 the name changed to C++. This was a pun on the increment operator (“++”),
    hence it referred to an incremental improvement in C. New features were added
    as virtual functions and operator overloading. In 1989 version 2.0 was released
    with multiple inheritance, abstract classes, const members and protected members.
    Later revisions of C++ in 1990 added templates, exceptions, namespaces and new
    casts.


    In 2011 a fully-updated version (“C++11”) was released with extensive multi-threading
    and generic programming support. This is the version we will use. However, the
    reality is that many firms are not using C++11 compliant compilers at this stage.
    Hence we will not be making use of the new features.


    # 2.2 The Advantages Of C++


    As a language C++ is very “close to the hardware”. This means that one can allocate
    and deallocate memory in a custom-defined manner, as well as optimise iteration
    and looping to a significant degree. This can lead to extremely high performance
    assuming the programmer has the skills to take advantage of both the hardware
    and software optimisations available.


    C++ allows *multi-paradigm programming*. This means that it is extremely versatile
    with re-'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'gards as how one should program with it. C++ is often referred to as a "federation
    of languages". Procedural, object-oriented and functional styles are all supported
    in various guides.


    Generic programming and the Standard Template Library (STL) provide sophisticated
    type-independent classes and extensive, well-optimised code "out of the box".
    You can spend time implementing financial models and less time worrying about
    how to optimise loops or iteration. This is a fantastic time-saver.


    Further, C++ is an ISO standard, so it will be around for a long time. Becoming
    a very good C++ programmer is certainly a secure career path!


    # 2.3 The Disadvantages Of C++


    C++ is not a "beginner" language compared to modern programming options such as
    Python, Ruby, MatLab or R. It provides far more control than is often required
    and thus can be confusing.


    It is very easy to make a mistake, create bugs or write poorly optimised code
    in C++, especially when pointers are involved. Despite the fact it has a compilation
    process, many bugs will slip through at compile-time. Debugging C++ programs is
    not straightforward especially where memory allocation is concerned.


    Compared to languages like Python, MatLab or R, C++ will require more lines of
    code (LOC). This means greater maintenance overhead, more testing and thus more
    chances for bugs to appear. It is not a language to create model "prototypes"
    with.


    The language is so large and feature-heavy that two experienced C++ programmers
    are able to solve problems in vastly different ways - this leads to interoperability
    issues on large projects. Standards must be enforced from the outset for effective
    development.


    # 2.4 The Different Components Of C++


    As previously stated, C++ can be seen as a federation of many programming styles.
    Five fundamental components of C++ are listed here, although there are many more
    subcomponents, which we will be studying in depth:


    +   - Procedural, C-Style - Functions and Classes - Encapsulation of member data
    and access


    +   - Object-Orientation and Classes - Encapsulation


    +   - Generic Programming and Templates - Type-independent classes for code re-use'
  merge: -1
  pgno: 12
- img_proc: true
  md: '+   * Standard Template Library - Optimised code for containers, algorithms
    and I/O

    * Boost Libraries - Well-tested additional third-party utility libraries


    We will now look at each of these five components in turn.


    # 2.5 C-Style Procedural Programming


    C++ is a superset of the C language. Hence any C program will compile in a C++
    compiler (in almost cases!). In particular, this means that C libraries will still
    function in your C++ code. Be aware that interfaces are likely to differ substantially.
    C interfaces generally make heavy use of pointers and function pointers, whereas
    C++ interfaces will utilise an OOP approach, making use of templates, references
    and the STL. For reason, many popular C libraries have wrappers written for them
    that provide a C++ interface over older C libraries.


    It is possible to program procedurally in C++, without any reference to classes
    or templates. Functions are often grouped into modules of similar functionality.
    However, just remember that your interfaces will be constrained in the manner
    described above. It is often more practical, when programming procedurally in
    C++, to use more advanced libraries from the STL such as iostream, vector and
    string libraries.


    # 2.6 Object-Oriented Programming


    C++ provides extensive data encapsulation features. Objects can be created to
    represent entities, via the notion of a class. The job of a class is to encapsulate
    all functionality related to a particular entity, exposing the necessary parts
    as a public interface and hiding any implementation details via a private interface.
    C++ classes encapsulate data and data manipulation through the public, private
    and protected keywords. This allows detailed specification of interfaces to member
    data.


    C++ supports virtual functions, overloading, multiple inheritance and polymorphism.
    These concepts allow the modelling of the is-a relationship as well as the has-a
    relationship between objects. The latter is known as composition. These paradigms
    promote code-reuse, maintainability and extensibility. We will be making extensive
    use of these object-oriented techniques for our quantitative code.


    Best practice design patterns have emerged over the years to encourage students
    and implementation procedures for specific object-oriented design problems. Patterns
    are useful because'
  merge: -1
