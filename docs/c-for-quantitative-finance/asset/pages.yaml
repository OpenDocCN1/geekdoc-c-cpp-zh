  md: "```\n#include <vector>\n#include <cmath>\n\n// For random Gaussian generation\n\
    // Note that there are many ways of doing this, but we will\n// be using the Box-Muller\
    \ method for demonstration purposes\ndouble gaussian.box_muller() {\n    double\
    \ x = 0.0;\n    double y = 0.0;\n    double euclid_sq = 0.0;\n\n    do {\n   \
    \     x = 2.0 * rand() / static_cast<double>(RAND_MAX)-1;\n        y = 2.0 * rand()\
    \ / static_cast<double>(RAND_MAX)-1;\n        euclid_sq = x*x + y*y;\n    } while\
    \ (euclid_sq >= 1.0);\n\n    return sqrt(-2*log(euclid_sq))/euclid_sq);\n}\n```\n\
    \nThis provides a vector containing sampled points of a\n// Geometric Brownian\
    \ Motion stock price path\nvoid calc_path_spot_prices(const std::vector<double>&\
    \ spot_prices, // Asset path\n                            double r, // Risk free\
    \ interest rate\n                            double v, // Volatility of underlying\n\
    \                            double T) { // Expiry\n// Since the drift and volatility\
    \ of the asset are constant\n// we will precalculate as much as possible for maximum\
    \ efficiency\ndouble dt = T/static_cast<double>(spot_prices.size());\ndouble drift\
    \ = exp(dt*(r-0.5*v*v));\ndouble vol = sqrt(v*v*dt);\n\nfor (int i=1; i<spot_prices.size();\
    \ i++) {\n    double gauss.bm = gaussian.box_muller();\n    spot_prices[i] = spot_prices[i-1]\
    \ * exp(vol*gauss_bm);\n}"
