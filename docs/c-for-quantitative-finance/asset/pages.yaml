    # 11.2 Finite Difference Method


    FDM is widely used in derivatives pricing (as well as engineering/physics in general)
    to solve partial differential equations (PDE). In fact, we will see in a later
    chapter how to use FDM to solve the Black-Scholes equation in a numerical manner.
    In this section, we are going to apply the same technique, namely the discretisation
    of the partial derivatives, to create a simple approximation to the Greek sensitivities
    with which we can compare to the analytical solution.


    The essence of the method is that we will approximate the partial derivative representing
    the particular sensitivity of interest. To do this we make use of the analytical
    formulae for the Black-Scholes prices of the call and puts. These formulae are
    covered in the previous chapter on European Options pricing.


    As an example, let''s calculate the Delta of a call option. The Delta is given
    by $\frac{\partial C}{\partial S}(S,T,\sigma,r,K)$. If we calculate two calls
    prices, one at spot $S$ and the other at spot $S+\Delta S$, subtract the prices
    and divide by $\Delta S$, we have a *forward difference approximation* to the
    derivative:'
