  md: '# 6.2.3 Container Adaptors


    Although not strictly containers in themselves container adaptors are a very useful
    component of the STL. Container adaptors are designed to adapt the behaviour of
    the aforementioned containers above such that their behaviour is restricted or
    modified in some fashion. The three container adaptors that are of interest to
    us as follows:


    +   * **Stacks** - A stack is a common data structure within computer science
    as well in day-to-day life. It represents the Last-In-First-Out (LIFO) concept,
    where elements are placed upon each other and the first to be removed was the
    last one to be.


    +   * **Queues** -A queue differs from a stack in that it represents the First-In-First-Out
    (FIFO) concept, where the first element added to the queue becomes the first to
    be removed. Queues are often used to represent task lists of “background jobs”
    that might need to be carried out, as heavy-duty numerical processing.


    +   * **Priority Queues** -A priority queue is similar to a queue, except that
    elements are removed from it based on a priority comparison function. This is
    particularly common in operating system design where many tasks are constantly
    being added to a queue, but some are more essential than others and will be executed
    first, even if they were added at a later point.


    # 6.3 Iterators


    Now we''ve discussed STL Containers, it is time to turn our attention to iterators.
    Iterators are objects that can navigate or iterate elements in a container. They
    are essentially a generalisation of pointers and provide similar, but more advanced,
    behaviour. Their main benefit is that they allow the decoupling of the implementation
    of a container with an algorithm that can iterate over it.


    Iterators are often tricky for beginning C++ programmers to get with grips, as
    there are many different categories and adaptors that can be applied to modify
    their behaviour. We''re going to describe the taxonomy that exists to help you
    choose the correct iterator type for your quantitative finance algorithm implementations.


    # 6.3.1 Iterator Categories


    Iterators are grouped according to their category. There are five separate categories
    in C++: Input, Output, Forward, Bidirectional and Random Access:'
