    # 10.1 Black-Scholes Analytic Pricing Formula


    The first stage in implementation is to briefly discuss the Black-Scholes analytic
    solution for the price of a vanilla call or put option. Consider the price of
    a European Vanilla Call, $C(S,t)$. $S$ is the underlying asset price, $K$ is the
    strike price, $r$ is the interest rate (or the “risk-free rate”), $T$ is the time
    to maturity and $\sigma$ is the (constant) volatility of the underlying asset
    $S$. $N$ is a function which will be described in detail below. The analytical
    formula for $C(S,t)$ is given by:


    ```

    $C(S,t) = SN(d_1) - Ke^{-rT}N(d_2)$

    ```


    With $d_1$ and $d_2$ defined as follows:


    ```

    $d_1 = \frac{log(S/K) + (r + \frac{\sigma^2}{2})T}{\sigma\sqrt{T}}\$\nd_2 = d_1
    - \sigma\sqrt{T}$

    ```'
