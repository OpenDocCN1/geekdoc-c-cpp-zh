  md: 'discretisation errors $v_{i+1}$ can become negative. This is not a “physical”
    situation and so is a direct consequence of the numerical approximation. In order
    to handle negative values, we need to modify the above formula to include methods
    of eliminating negative values for subsequent iterations of the volatility path.
    Thus we introduce three new functions $f_1, f_2, f_3$, which lead to three separate
    “schemes” for how to handle the negative volatility values:


    ```

    $v_{i+1} = f_1(v_i) + \kappa(\theta - v_i)\Delta t + \xi\sqrt{f_3(v_i)}\Delta
    W_{i+1} \quad (16.16)$

    ```


    The three separate schemes are listed below:


    | Scheme | $f_1$ | $f_2$ | $f_3$ |

    |---|---|---||}{

    | Reflection | $|x|$ | $|x|$ | $x$ |

    | Partial Truncation | $x$ | $x$ | $x$ |

    | Full Truncation | $x$ | $x^+$ | $x^+$ |


    Where $x^+ = max(x,0)$.

    The literature tends to suggest that the Full Truncation method is the “best”
    and so is what we will utilise here. The Full Truncation scheme discretisation
    equation for the volatility path will be given by:


    ```

    $v_{i+1} = v_i + \kappa(\theta - v_i^*)\Delta t + \xi\sqrt{v_i^*}\Delta W_{i+1}
    \quad (16.17)$

    ```


    In order to simulate $W_{i+1}^r$, we can use of the fact that it is a Brownian
    motion, $W_{i+1}^r - W_i^r$ is normally distributed with variance $\Delta t$ and
    that the distribution of $W_{i+1}^r - W_i^r$ is independent of $i$. This means
    it can be replaced with $\sqrt{\Delta t}N(0,1)$, where $N(0,1)$ is a random draw
    from the standard normal distribution.


    We will return to the question of how to calculate the $W_i^r$ terms in the next
    section. Assuming we have the ability to do so, we are able to simulate the price
    of the asset path with the following discretization:


    ```

    $S_{i+1} = S_i \exp\left(\mu - \frac{1}{2}v_i^{*}\right)\Delta t + \sqrt{v_i^*}\Delta
    W_{i+1}^S \quad (16.18)$

    ```'
