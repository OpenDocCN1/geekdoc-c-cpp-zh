  md: '# 4.2 Option Pay-off Hierarchies


    Let us consider a problem: What if we wish to modify our VanillaOption class from
    the previous chapter to separate out pricing of the option class itself? Ideally
    we would like to create a second object "OptionSolver" or similar, which can accept
    an "Option" class and provide a price. This option solver would likely make use
    of Monte Carlo or Finite Difference methods (which we will describe in later).
    At the moment we only have analytical prices for calls and puts, but we would
    like to allow for additional option types such as digital options, double digital
    options, power options.


    This is not as straightforward as it seems, for the following reasons:


    +   - Other types of options may not have straightforward analytical pricing functions,
    so we need to use numerical methods.


    +   - We would need to create new, extra selector methods for calculation of these
    prices and thus modify our interface and inform our clients.


    +   - We must add extra parameters to the Option class constructor. For instance,
    a double digital option requires two barrier values, while a power option requires
    the value of the power as well as spot.


    +   - Every time we add a new pricing function we must re-edit and re-compile
    the header and source file for every modification, which could be an expensive
    operation in a large codebase.


    Is there a better way? Yes! It involves separating the pay-off for a type of option
    from the Option class itself. Our plan will be to create a new class, PayOff.
    We will then create subclasses, which inherit properties from the PayOff class.
    For instance, we could create PayOffCall, PayOffPut or PayOffDoubleDigital. All
    of inherited subclasses will contain the properties and interface of PayOff, but
    will be able to extend and override it in their specific cases. This is the essence
    of object-oriented inheritance. Further, our Option class can accept a base class
    PayOff as a constructor parameter and we are still able to provide a subclass
    as a parameter, since the expected interface will still be present. This means
    that Option will not actually know what type of PayOff it will receive, since
    as far as it is concerned it is dealing with the superclass interface.'
