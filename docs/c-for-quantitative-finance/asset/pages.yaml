  md: '# 13.4 Implied Volatility via Newton-Raphson


    In the above section we made use of interval bisection to numerically solve for
    the implied volatility. In this section we are going to modify our code to make
    use of the Newton-Raphson process, which is more optimal for this problem domain
    than interval bisection.


    For the previous calculation we made use of a function template (functor) of type
    T, g, which itself accepted a volatility parameter ($\sigma$) to carry an option
    price. The main design issue we have to contend with is that with Newton-Raphson,
    we require a second function to represent $g''$, the derivative of $g$ (the $vega$
    of the option). There are multiple approaches to deal with this issue:


    +   **Two functors** - We can create a separate function object to represent the
    derivative of the function stored in the first function. However, this method
    is not scalable if we wish to create (or higher order) derivatives, or partial
    derivatives for any other variables.

    A derivative is also fundamentally a component of the original function, rather
    than a separate entity. Then we won''t use this approach.


    +   **Derivative method** - It is possible to create a derivative method for the
    function object $g$. However, we still suffer from the same scaling issue that
    we would need to create derivative methods for all orders or variables. We could
    create a generalised derivative function, but this would be a substantial amount
    of work for very little initial gain.


    +   **Pointer to member function** - To avoid the ugliness of the previous method,
    we can make use of a *pointer to a member function*. This method allows us to
    specify which function is to be called at the point of compilation, using templates.
    It is the approach taken in Joshi and we will follow it here.


    Before considering the C++ implementation, we will briefly discuss how the Newton-Raphson
    root-finding algorithm works.


    # 13.4.1 Newton-Raphson Method


    Newton-Raphson is a more efficient algorithm for finding roots provided that some
    assumptions are met. In particular, $g$ must possess an easily calculated derivative.
    If the derivative is analytically calculable, then this aids even further. $g$
    must also be ''well behaved'', that it cannot vary too wildly, else the derivative
    approximation made use in the method becomes more inaccurate.'
