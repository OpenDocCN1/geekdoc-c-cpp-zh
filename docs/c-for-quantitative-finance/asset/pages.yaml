- img_proc: true
  md: 'The first step is to create the vector $\mathbf{x}$, which is the $k$-th column
    of the matrix $\mathbf{A}$, for step $k$.


    We define $\alpha = -sgn(\mathbf{x}_k)|\mathbf{x}|$. The norm $\|\cdot\|$ used
    here is the $Euclidean$ norm. Given the first column vector of the identity matrix,
    $I$ of equal size to $\mathbf{A}$, $A_1 = (1,0,\dots,0)^T$, we create the vector


    $\mathbf{u}$:


    $$$\mathbf{u} = \mathbf{x} + \alpha\mathbf{e}_1$$


    Once we have the vector $\mathbf{u}$, we need to convert it to a unit vector,
    which we denote as $\mathbf{v}$:


    $$$\mathbf{v} = \mathbf{u}/|\mathbf{u}\|$$


    Now we form the matrix $Q$ out of the identity matrix $I$ and the vector multiplication
    of $\mathbf{v}$:


    $$$Q = I - 2\mathbf{vv}^T$$


    $Q$ is now an $m \times m$ Householder matrix, with $Q\mathbf{x} = (\alpha, 0,
    \dots, 0)^T$. We will use $Q$ to transform $A$ to upper triangular form, giving
    us the matrix $R$. We denote $Q$ as $Q_k$ and, since $k=1$ in this first step,
    we have $Q_1$ as our first Householder matrix. We multiply this with $A$ to give
    us:


    $$$Q_1 A = \begin{bmatrix} \alpha_1 & * & \dots & * \ 0 & & \ \vdots & & A'' \
    0 & & \end{bmatrix}$$


    The whole process is repeated for the minor matrix $A''$, which will give a second
    Householder matrix $Q''_2$. Now we have to "pad out" this minor matrix with elements
    from the identity matrix such that we can consistently multiply the Householder
    matrices together. Hence, we define $Q_k$ as the block matrix:


    $$$Q_k = \begin{bmatrix} I_{k-1} & 0 \ 0 & Q''_k \end{bmatrix}$$'
