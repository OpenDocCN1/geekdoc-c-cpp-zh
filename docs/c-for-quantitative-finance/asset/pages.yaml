  md: "# 16.2 Process for Correlated Path Generation\n\nRather than considering the\
    \ case of two correlated assets, we will look at $N$ seperate assets and then\
    \ reduce the general procedure to $N=2$ for the case of our Heston motivating\
    \ example.\n\nAt each time step in the path generation we require $N$ random numbers,\
    \ $\rho_{ij}$ denotes the correlation coefficient between the $ith$ and $jth$\
    \ asset, $x_i$ will be the uncorrelated random number (which we will sample from\
    \ the standard normal distribution), $\\epsilon_i$ will be a correlated random\
    \ number, used in the asset path generation and $\\alpha_{ij}$ will be a coefficient\
    \ necessary for obtaining $\\epsilon_i$.\n\nTo calculate $\\epsilon_i$ we use\
    \ the following process *each of the* path generation time-steps:\n\n```\n$$\\\
    epsilon_i = \\sum_{k=1}^{i} \\alpha_{ik}x_k, 1 \\le i \\le N \\quad (16.4)$\n\
    ```\n\n```\n$$\\alpha_{ik}^2 = 1, 1 \\le i \\le N \\quad (16.5)$\n```\n\n```\n\
    $$\\sum_{k=1}^{i} \\alpha_{ik}\\alpha_{jk} = \\rho_{ij}, \\forall j < i \\quad\
    \ (16.6)$\n```\n\nThankfully, for our Heston model, we have $N=2$ and this reduces\
    \ the above equation set to the far simpler relations:\n\n```\n$$\\epsilon_1 =\
    \ x_1 \\quad (16.7)$\n```\n\n```\n$$\\epsilon_2 = \\rho x_1 + x_2\\sqrt{1-\\\r\
    ho^2} \\quad (16.8)$\n```\n\nThis motivates a potential C++ implementation. We\
    \ already have the capability to generate paths of standard normal distributions.\
    \ If we inherit a new class CorrelatedSND (SND for 'Standard Normal Distribution'),\
    \ we can provide it with a correlation coefficient and an original time series\
    \ of random standard normal variables to generate a new correlated asset path."
