    \   calculate_inner_domain();\n        for (int j=0; j<J; j++) {\n           \
    \ fdm_out << x.values[j] << \"-\" << prev_t << \"-\" << new_result[j] << std::endl;\n\
    \        }\n\n        old_result = new_result;\n        prev_t = cur_t;\n    }\n\
    \n    fdm_out.close();\n}\n```\n\n# 17.3.5 Main Implementation\n\nIt is now time\
    \ to tie all of the previous components together. The main implementation is actually\
