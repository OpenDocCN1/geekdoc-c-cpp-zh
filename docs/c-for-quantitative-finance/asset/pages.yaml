    \ value of $\\sigma$ such that:\n\n$B(S, K, r, T, \\sigma) = C_{M} \\quad (13.1)$\n\
    \n# # 13.2 Root-Finding Algorithms\n\nThe first place to start is to consider\
    \ whether an analytical inverse exists. Unfortunately, the Black-Scholes model\
    \ does not lend itself to an analytical inverse and thus we are forced to carry\
    \ out the computation using numerical methods. The common methods for achieving\
    \ these are known as *root finding algorithms*. In this chapter we will look at\
    \ two techniques: Interval Bisection and Newton-Raphson.\n\n# # 13.3 Interval\
    \ Bisection Method\n\nThe first numerical algorithm considered is Interval Bisection.\
    \ It makes use of a real analysis concept known as the **intermediate value theorem**.\
    \ It is the Black-Scholes formula is continuous (and \"well behaved\", for which\
    \ we means sufficiently smooth), we can make use of the theorem to help find a\
    \ volatility.\n\nThe theorem states, that, if $\\exists m, n \\in \\mathbb{R}$,\
    \ and $g(x) : \\mathbb{R} \to \\mathbb{R}$, continuous, such that $g(m) < y, g(n)\
    \ > y$, then $\\exists c \\in (m, n) \\subset \\mathbb{R}$ such that $g(y)=y$.\
    \ For us, $g$ is the Black-Scholes function, $y$ is the current market price and\
    \ $p$ is the volatility.\n\nHeuristically, the theorem states that if a function\
    \ is continuous and we know two (differing) values in the domain that generate\
    \ an image interval, then there must exist a value in the domain between these\
    \ two values that provides a mapped value lying within the image domain. This\
    \ is exactly what we need in order to determine the implied volatility from market\
    \ prices.\n\nInterval bisection is quite straightforward to understand. It is\
    \ \"trial and error\" algorithm. We pick the mid-point value, $c$, of an interval,\
    \ and then either $g(c)=y, g(c) < y$ or $g(c) > y$. In the first instance the\
    \ algorithm terminates. In the latter two cases, we subdivide the interval $(c,\
    \ n)$ (respectively $(m, c)$) and find the corresponding midpoints. At each level\
    \ of the recursion, the interval size is halved. In practice the algorithm is\
    \ terminated using a tolerance value, $\\epsilon$, once $|g(c) - y| < \\epsilon$.\n\
    \nInterval bisection is not an efficient method for root-finding, but it is straightforward\
    \ to implement, especially when we use of *functors* and *templates*."
