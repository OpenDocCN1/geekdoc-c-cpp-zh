  md: "# 16.3 Cholesky Decomposition\n\nIt can be seen that the process used to generate\
    \ $N$ correlated $\\epsilon_i$ values is in fact a matrix equation.\nIt turns\
    \ out that it is actually a Cholesky Decomposition, which we have discussed in\
    \ the chapter on Numerical Linear Algebra. Thus a far more efficient implementation\
    \ than I am constructing here would make use of an optimised matrix class and\
    \ a pre-computed Cholesky decomposition matrix.\n\nThe reason for this link is\
    \ that the correlation matrix, $\\Sigma$, is symmetric positive.\nThus it be decomposed\
    \ into $\\Sigma = RR^*$, although $R^*$, the conjugate-transpose matrix simply\
    \ reduces to the transpose in the case of real-valued entries, with $R$ a lower-triangular\
    \ matrix.\n\nHence it is possible to calculate the correlated random vector via:\n\
    \n$$$\\mathbf{\\epsilon} = R\\mathbf{x}$$\n\nWhere $\\mathbf{x}$ is the vector\
    \ of uncorrelated variables.\n\nWe will explore the Cholesky Decomposition as\
