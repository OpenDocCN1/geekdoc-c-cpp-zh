  md: 'The first numerical approach utilised be based on a Finite Difference Method
    (FDM) and the original analytical formulae. The second numerical method will use
    a combination of the FDM technique and Monte Carlo for pricing. The latter approach
    is readily applicable to a wider range of contingent claims as it is not dependent
    upon the existence of an analytic solution.


    # 11.1 Analytic Formulae


    The formulae of the Greeks for a European vanilla call and put option on a single
    asset are tabulated below:


    | Delta, $\frac{\partial C}{\partial S}$ | $N(d_1)$ | $N(d_1) - 1$ |

    | --- | --- | --- |

    | Gamma, $\frac{\partial^2 C}{\partial S^2}$ | $\frac{N''(d_1)}{S\sqrt{T}}$ |
    - |

    | Vega, $\frac{\partial C}{\partial \sigma}$ | $N''(d_1)\sqrt{T}$ | - |

    | Theta, $\frac{\partial C}{\partial t}$ | $\frac{-SN''(d_1)\sigma}{2\sqrt{T-t}}
    - rKe^{-r(T-t)}N(d_2)$ | $\frac{SN''(d_1)\sigma}{2\sqrt{T-t}} + rKe^{-r(T-t)}N(-d_2)$
    |

    | Rho, $\frac{\partial C}{\partial r}$ | $K(T-t)e^{-r(T-t)}N(d_2)$ | $-K(T-t)e^{-r(T-t)}N(-d_2)$
    |


    Where $N$ is the cumulative distribution function of the standard normal distribution,
    $N''$ is the probability density function of the standard normal distribution,
    $d_1 = (\log(S/K) + (r + \sigma^2/2)T)/(\sigma\sqrt{T})$ and $d_2 = d_1 - \sigma\sqrt{T}$.


