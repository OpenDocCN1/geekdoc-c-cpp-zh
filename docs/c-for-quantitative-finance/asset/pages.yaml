  md: '# # Chapter 13


    # # Implied Volatility


    In this chapter we will discuss a practical application of the Black-Scholes model,
    design patterns and function objects in C++. In particular, we are going to consider
    the concept of **Implied Volatility**. In derivatives pricing, the implied volatility
    of an option is the value of the understandings volatility (usually denoted by
    $\sigma$), when input into a derivatives pricing model (such as with the Black-Scholes
    equation) provides a pricing value for the option which is equal to the currently
    observed market price of that option.


    # ## 13.1 Motivation


    The use of implied volatility is motivated by the fact that it is often more useful
    as a measure of *relative value* between options than the actual price of such
    options. This is because the price is heavily dependent upon the price of the
    underlying asset. Options are often held in a *delta neutral portfolio*, which
    means that the portfolio is hedged for small moves in the price of the underlying
    asset. Given the need to continuously rebalance these portfolios, an option with
    a higher actual price can be *cheaper in terms of its volatility* if the underlying
    asset itself rises, as the underlying asset can be sold at a higher price.


    Implied volatilities in fact be considered a form of "prices", as their values
    have been determined by actual transactions in the marketplace, not on the basis
    of statistical estimates. Professional traders tend to quote values of options
    in terms of their "vol", rather than their actual market prices.


    Our task for this chapter is to attempt to calculate implied volatilities using
    the Black-Scholes equation. If we let the market price of an option be given by
    $C_M$ and the Black-Scholes function by $B(S,K,r,T,\sigma)$, where $S$ is the
    underlying price, $K$ is the option strike, $r$ is the risk-free'
