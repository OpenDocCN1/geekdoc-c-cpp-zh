  md: '# 9.2 LU Decomposition


    In this section we will discuss the LU Decomposition method, which is used in
    certain quantitative finance algorithms.


    One of the key methods for solving the Black-Scholes Partial Differential Equation
    (PDE) model of options pricing is using Finite Difference Methods (FDM) to discretise
    the PDE and evaluate it numerically. Certain implicit Finite Difference Methods
    eventually lead to a system of linear equations.


    This system of linear equations can be formulated as a matrix equation, involving
    the matrix $A$ and the vectors $x$ and $b$, of which $x$ is the solution to be
    determined. Often these matrices are banded (their non-zero elements are confined
    to a subset of diagonals) and specialist algorithms (such as the Thomas Algorithm,
    see below) are used to solve them. LU Decomposition will aid us in solving the
    following matrix equation, without the direct need to invert the matrix $A$.


    ```

    $Ax = b$$

    ```


    Although suboptimal from a performance point of view, we are eager to implement
    our version of the LU Decomposition in order to see how the algorithm is “translated”
    from the mathematical realm into C++.


    We will make use of the Doolittle’s LUP decomposition with partial pivoting to
    decompose our matrix $A$ into $PA = LU$, where $L$ is a lower triangular matrix,
    $U$ is an upper triangular matrix and $P$ is a permutation matrix. $P$ is needed
    to resolve certain singularity issues.


    # 9.2.1 Algorithm


    To calculate the upper triangular section we use the following formula for elements
    of $U$:


    ```

    $u_{ij} = a_{ij} - \sum_{k=1}^{i-1} u_{kj}l_{ik}$$

    ```


    The formula for elements of the lower triangular matrix $L$ is similar, except
    that we need to divide each term by the corresponding diagonal element of $U$.
    To ensure that the algorithm is numerically stable when $u_{jj} \ll 0$, a pivoting
    matrix $P$ is used to re-order $A$ so that the largest element of each column
    of $A$ gets shifted to the diagonal of $A$. The formula for elements of $L$ follows:'
