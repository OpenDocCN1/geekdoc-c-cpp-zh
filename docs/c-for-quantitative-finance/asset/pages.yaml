  md: '# 8.1 Custom Matrix Class Library


    # 8.1.1 C++ STL Storage Mechanisms


    C++ provides many container classes via the Standard Template Library (STL). The
    most appropriate choices are here std:: valarray and std:: vector. The std:: template
    class is most frequently used due to its generality; std::vector can handle many
    different types (including pointers and smart pointer objects), whereas std::
    valarray is designed solely for numerical values.

    In theory this would allow the compiler to make certain optimisations for such
    numerical work.

    However, at first glance std:: valarray would seem like a great choice to provide
    storage for our matrix values. In reality it turns out that compiler support does
    not really exist. Not only that the std:: valarray has a poorer application programming
    interface (API) and isn''t as flexible as a std:: vector. Thus it makes sense
    to use the std::vector template class for our underlying storage mechanism.


    Supposing that our matrix has rows and N columns, we could either create a single
    std:: vector of length N × M or create a “vector of vector”. The latter creates
    a single vector of length M, which takes a std::vector<T> of types as its type.
    The inner vectors will be each of length N. We will utilise the “vector of vector”
    approach. The primary reason to use such a mechanism is that we gain a good API,
    helpful in accessing elements of such a vector “for free”.We do not need to use
    a look-up formula to find the correct element as we would need to in the single
    large vector approach. The declaration for this type of storage mechanism is given
    by:


    ```

    std::vector<std::vector<T>>

    ```


    T is our placeholder. Note: For nearly all of the quantitative work we carry out,
    we will use the double precision type for numerical storage.


    Note the extra space between the last two delimiters: >>. This is to stop the
    compiler believing we are trying to access the bit shift >> operator.


    The interface to the matrix class will be such that we could reconfigure the underlying
    storage mechanism to be more efficient for a particular case, but the external
    client would remain identical and never need know of any changes. Thus we could
    entirely replace our std::vector storage with std::valarray and our client calling
    code would be none wiser than the wiser.

    This is one of the benefits of the object-oriented approach, and in particular
    encapsulation.'
