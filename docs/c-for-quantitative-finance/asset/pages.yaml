  md: 'We can make use of Ito''s Lemma to give us:


    ```

    $d \log S(t) = \left(r - \frac{1}{2}\sigma^2\right)dt + \sigma dB(t)$

    ```


    This is a constant coefficient SDE and therefore the solution is given by:


    ```

    $\log S(t) = \log S(0) + \left(r - \frac{1}{2}\sigma^2\right)t + \sigma\sqrt{t}N(0,1)$

    ```


    Here I''ve used the fact that $B(t)$ is a Brownian motion, it has the distribution
    of a normal distribution with variance $t$ and mean zero so it can be written
    as $B(t) = \sqrt{t}N(0,1)$.


    Rewriting the above equation in terms of $S(t)$ by taking the exponential gives:


    ```

    $S(t) = S(0)e^{(r-\frac{1}{2}\sigma^2)t+\sigma\sqrt{t}N(0,1)}$

    ```


    The risk-neutral pricing method above leads to an expression for the option price
    as follows:


    ```

    $e^{-rT}E(f(S(0)e^{(r-\frac{1}{2}\sigma^2)T+\sigma\sqrt{T}N(0,1)}))$

    ```


    The key to the Monte Carlo method is to make use of the law of large numbers in
    order to approximate the expectation. Thus the essence of the method is to compute
    many draws from the normal distribution $N(0,1)$, as the variable $x$, and then
    compute the pay-off via the following formula:


    ```

    $f(S(0)e^{(r-\frac{1}{2}\sigma^2)T+\sigma\sqrt{T}x})$

    ```


    In this case the value of $f$ is the pay-off for a call or put. By averaging the
    sum of these pay-offs and then taking the risk-free discount we obtain the approximate
    price for the option.'
