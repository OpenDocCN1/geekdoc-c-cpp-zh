    # 3.2 What Are Classes?


    We will now discuss what classes *really* are. A C++ class is designed to *encapsulate*
    data and methods (class functions) acting upon this data. A class hides details
    of its operations from other program components that do not need access to, or
    need to be aware of, those underlying details.


    A class in C++ consists of member data, which can possess three levels of access:


    +   *Private* member data can only be accessed by methods within the class


    +   *Public* member data can be accessed by any other aspect or component of the
    whole program


    +   *Protected* member data can only be accessed by inherited classes of this
    class (more on this later)


    Class methods are separated into four categories: *Constructors, destructor, selectors*
    and *modifiers*, which we will now proceed to describe.


    # 3.3 Constructors And Destructors


    A *constructor* is a special method on a C++ class. It is the first method to
    be called when a C++ class object is instantiated (created!). There are three
    types of constructor in C++: the *default* constructor, the *parameter* constructor
    and the *copy* constructor.


    A default constructor allows a class object to be instantiated without the need
    to specify any input data. Default constructors do not have to be implemented
    in a class. However, if you wish to use a class in a sequence container, for instance,
    such as a vector of VanillaOption classes (e.g. vector<VanillaOption>), then the
    class must provide a default constructor.


    A parameter constructor requires one or more parameters in order to be called.
    Usually the parameters are tied into the initialisation of member data. For instance,
    we may wish to store a strike price as member data and thus the parameter constructor
    would contain a strike value as a parameter. In some situations the member data
    can be initialised directly from the body of the constructor. In other instances
    a *member initialisation list* is necessary. The latter situation'
