    This section introduces, in a reference fashion, some of the new algorithms and
    containers that are now part of the C++11 STL. Highlights include a hash object
    (unordered_map), a singly-linked list (forward_list) and many algorithms which
    attempt to "fill in the missing pieces" left by C++03, which we have described
    above.


    # 6.5.1 Containers


    The new containers have essentially been introduced for performance reasons. C++
    now has a hash table, a singly-linked list and an array object as part of the
    STL standard.


    +   - unordered_set - As with a set, the unordered_set contains at most one of
    each value and allow fast retrieval of elements. Allows forward iterators.


    +   - unordered_multiset - As with a multiset, the unordered_multiset can contain
    multiple copies of the same value and allow fast retrieval of elements. Allows
    forward iterators.


    +   - unordered_map.map - A hash table! As with a map, the unordered_map can contain
    as most one of each key with fast retrieval. Allows forward iterators.


    +   - unordered_multimap - As with a multimap, the unordered_multimap can contain
    multiple copies of the same key. Allows forward iterators.


    +   - forward_list - This is a singly-linked list. It provides constant time inserts
    and erases, with no random access to elements.


    +   - array - C++11 now has an STL array. It stores n elements of type T contiguously
    in memory. It differs from a vector as it cannot be resized once.


