  md: '# 5.3 A Matrix Template Class


    Consider a mathematical matrix object that uses double precision types to store
    its values. This class could be implemented as a single array of double values
    or even an array of arrays of double values. Irrespective of how we implement
    this class our matrix implementation is likely to use of pointers to double values.


    Let''s imagine that our application now requires matrices to store complex numbers.
    This is a very common situation in computational physics, particularly in quantum
    mechanics. I realise I''m deviating from quantitative finance here, but bear with
    me! This brings up many questions:


    +   - How will we implement such a class? What effect will it have on our code
    duplication and external client code?


    +   - Will we replace our double precision code to make use of the C++ complex
    library? This would require modifying all of the implementation code to store
    complex types, instead of doubles. Further, any client code that makes use of
    this matrix class will need to be modified to handle complex numbers.


    +   - How would we store a real-numbered matrix? Would we set all imaginary parts
    of the complex component to zero? This would seem like an awful waste of memory!


    To create a new matrix object that stores complex numbers, the entire matrix code
    would need duplication and replacement with the complex type. This is poor practice.
    Perhaps there is a better way?


    Templates allow code to be written once and then parametr with a concrete type
    such as int, double or complex. This means we can write the code for our matrix
    object once and then supply various concrete types at the point we wish to use
    a matrix.


    Templates can be thought of as moulds or patterns for creating classes, in exactly
    the same way classes can be thought of as moulds or patterns for creating instance
    objects.


