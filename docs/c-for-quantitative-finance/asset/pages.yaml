    # 6.3.4 Iterator Traits


    A common requirement is to be able to use pointers in place of iterators when
    carrying out an algorithm. Since they have nearly identical behaviour, it makes
    sense to allow this. The way this is achieved through iterator traits. The iterators.traits
    class template provided by the STL is designed to allow a common interface for
    any type of iterator.


    When creating algorithms that iterate over a container it is possible to make
    use of the iterator traits to obtain the underlying type referred to by the presented
    iterator (or pointer), without the need to know whether an iterator or pointer
    is actually being presented. This makes the code more maintainable and versatile.


    # 6.4 Algorithms


    We''re now ready to discuss STL algorithms, which are operations that act on the
    containers via the aforementioned STL Iterators. STL algorithms are extremely
    useful because they reduce or eliminate the need to ''reinvent the wheel'' when
    implementing common algorithmic functionality. In quantitative finance they can
    save a significant amount of time.


    While some of the algorithms are designed to modify the individual values within
    ranges (certain STL containers or arrays of values), they do not modify the containers
    themselves - i.e. there is no reallocation or size modification to the containers.


    # 6.4.1 Algorithm Categories


    To use these algorithms it is necessary to include the <algorithm> header file.
    For the numeric algorithms, it is necessary to include the <numeric> header file.
    As with containers and iterators, algorithms are categorised according to their
    behaviour and application:


    +   - Nonmodifying algorithms - Nonmodifying algorithms do not change the value
    of any element, nor do they modify the order in which the elements appear. They
    can be called for all of the standard STL container objects, as they make use
    of the simpler iter iter.'
