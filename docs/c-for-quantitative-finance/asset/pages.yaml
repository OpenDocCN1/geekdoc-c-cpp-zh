    \ value* of $\nu_t$, i.e. the long run average price variance\n\n+   - $\\kappa$\
    \ is the rate of mean reversion of $\nu_t$ to the long run average $\theta$\n\n\
    +   - $\\xi$ is the \"vol of vol\",, i.e. the variance of $\nu_t$\n\nNote that\
    \ none of the parameters have any time-dependence. Extensions of the Heston model\
    \ generally allow the values to be piecewise constant.\nIn order for $\nu_t >\
