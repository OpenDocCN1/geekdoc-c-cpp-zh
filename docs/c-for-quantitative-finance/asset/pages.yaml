    # # 9.3 Thomas Tridiagonal Matrix Algorithm


    The Tridiagonal Matrix Algorithm, also known as the Algorithm (due to Llewellyn
    Thomas), is an application of gaussian elimination to a tri-banded matrix. The
    algorithm itself requires five parameters, each vectors. The first three parameters
    **a**, **b** and **c** represent the elements in the tridiagonal bands. Since
    **b** represents the diagonal elements it is one longer than **a** and **c**,
    represent the off-diagonal bands. The latter two parameters represent the solution
    vector **f** and **d**, the right-hand column vector.


    The original system is written as:


    ```

    $$\begin{bmatrix} b_1 & c_1 & 0 & ... & 0 \ a_2 & b_2 & c_2 & ... & 0 \ 0 & a_3
    & b_3 & c_3 & 0 \ \vdots & & \vdots & \ddots & \vdots \ 0 & 0 & 0 & a_{k-1} &
    b_k \end{bmatrix} \begin{bmatrix} f_1 \ f_2 \ f_3 \ \vdots \ f_k \end{bmatrix}
    = \begin{bmatrix} d_1 \ d_2 \ d_3 \ \vdots \ d_k \end{bmatrix}$

    ```


    The method begins by forming coefficients $c_i^*$ and $d_i^*$ in place of $a_i,
    b_i$ and $c_i$ as follows:


    ```

    $c_i^* = \frac{\frac{c_i}{b_i}}{b_i-c_{i-1}^*a_i}; \quad i = 2, 3, ..., k-1$\n\nd_i^*
    = \frac{\fracfrac{d_i}{b_i}}{b_i-c_{i-1}^*a_i}; \quad i = 2, 3, ..., k-1$

    ```


    With these new coefficients, the matrix equation be rewritten as:'
