  md: '# 14.3.1 Statistical Distribution Inheritance Hierarchy


    The inheritance hierarchy for modelling of statistical distributions is relatively
    simple. Each distribution of interest will share the same interface, so we will
    create an abstract base class, as carried out by the PayOff hierarchy. We are
    primarily interested in modelling continuous probability distributions for the
    time being.


    Each (continuous) statistical distribution contains the following properties to
    be modelled:


    +   - **Domain Interval** - The interval subset of ℝ with which the distribution
    is defined for


    +   - **Probability Density Function** - Describes the frequency for any particular
    value in our domain


    +   - **Cumulative Density Function** - The function describing the probability
    that a value is less than or equal to a particular value


    +   - **Expectation** - The expected value (the mean) of the distribution


    +   - **Variance** - Characterisation of the spread of values around the expected
    value


    +   - **Standard Deviation** - The square root of the variance, used because it
    possesses the same units as the expected value, unlike the variance


    We also wish to produce a sequence of random draws from this distribution, assuming
    a sequence of random numbers is available to provide the "randomness". We can
    achieve this in two ways. We can use either the inverse cumulative distribution
    function (also known as the quantile function), which is a property of the distribution,
    or we can use a custom method (such as Box-Muller). Some of the distributions
    do not possess an analytical inverse to the CDF and hence they will need to be
    approximated numerically, via an appropriate algorithm. This calculation will
    be encapsulated into the class of the relevant inherited distribution.


    Here is the partial header file for the StatisticalDistribution abstract base
    class (we will add extra distributions later):


    ```

    #ifndef _STATISTICS_H

    #define _STATISTICS_H


    #include <math>

    #include <vector>


    class StatisticalDistribution {

    ```'
