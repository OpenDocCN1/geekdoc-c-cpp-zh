- img_proc: true
  md: 'In the case of the Black-Scholes formula, the derivative we seek is the derivative
    of the option price with respect to the volatility. $\frac{\partial}{\partial\sigma}$
    is known as the vegas of the option model. For a call option an analytical function
    exists for the vegas, so we are in luck.


    The idea of Newton-Raphson is to use the analytical derivative to make a linear
    estimate of where the solution should occur, which is much more accurate than
    the mid-point approach taken by Interval Bisection. Thus the starting approximation
    to $g, g_0$, is given by (where $x_0$ is our initial guess):


    ```

    $g_0(x) = g(x_0) + (x - x_0)g''(x_0) \quad (13.2)

    ```


    This can be rearranged for $x$:


    ```

    $x = \frac{y - g(x_0)}{g''(x_0)} + x_0 \quad (13.3)

    ```


    This leads to a recurrence relation for more accurate values of $x$:


    ```

    $x_{n+1} = \frac{y - g(x_n)}{g''(x_n)} + x_n \quad (13.4)

    ```


    As with bisection, the algorithm is terminated when $|g(x) - y| < \epsilon$, for
    some specified tolerance $\epsilon$.


    Rewritten with our financial notation (where I have suppressed the other parameters
    for the Black-Scholes formula, $B$), the relation becomes:


    ```

    $$\sigma_{n+1} = \frac{C_M - B($\sigma_n)}{\partial B($\sigma_n)} + \sigma_n \quad
    (13.5)

    ```


    We can use this relation to find the implied volatility via a terminating criterion.


