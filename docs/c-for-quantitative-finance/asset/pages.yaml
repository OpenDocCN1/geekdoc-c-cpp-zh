    C++11 has introduced some new algorithms to "fill in the blanks" left by the previous
    C++03 standard. Other algorithms exist to simplify common programming tasks, either
    by using a simpler interface or better parameter lists. As of 2013, compiler support
    for these algorithms is relatively good, but you should consult the documentation
