  md: 'if the underlying mechanic is understood for a particular model implementation,
    it is more straightforward for additional quants/programmers to familiarise themselves
    with the codebase, saving extensive amounts of time.


    # 2.7 Generic Programming


    Generic programming is a strong feature of C++. It allows the creation of type-independent
    classes. They are a key component of the Standard Template Library (STL).


    The fundamental idea is that classes can be created with a set of type parameters,
    like a function or method. Upon instantiation of the class, types can be provided.
    For instance, a Matrix class can be made into a template class. It could be a
    Matrix of double precision values of a matrix of complex numbers. Code for each
    specific type implementation is generated at compile time if such an instantiation
    is required. Generic programming can save a lot of code duplication, at the expense
    of larger executable files.


    Generic programming is extremely useful in quantitative finance, particularly
    for sequence container classes. For instance, a template sequence container (such
    as a vector) could contain double precision numbers or Vanilla Options, with no
    additional code necessary to support extra objects.


    Generic programming also leads to an advanced paradigm known as Template Metaprogramming.
    This is a coding concept that allows compile-time execution and thus potential
    optimisation in certain circumstances. However we will not be looking at this,
    as it is quite an advanced concept and beyond the scope of this book!


    # 2.8 The Standard Template Library (STL)


    The STL is a collection of optimised template libraries for common data structures
