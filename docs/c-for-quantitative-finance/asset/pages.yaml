    we are redefining how the individual mathematical operators (such as +, -, *)
    behave when we apply them to other matrices as a binary operator. Let''s consider
    the syntax for the addition operator:


    ```

    QMatrix<T> operator+(const QMatrix<T>& rhs);

    ```


