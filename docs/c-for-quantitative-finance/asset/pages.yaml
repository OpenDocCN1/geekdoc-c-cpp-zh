  md: "119\n\nLL^T Matrix: \n6 3 4 8\n3 6 5 1\n4 5 10 7\n8 1 7 25\n\n# 9.5  QR Decomposition\n\
    \nQR Decomposition is widely used in quantitative finance as the basis for the\
    \ solution of the linear least squares problem, which itself is used for statistical\
    \ regression analysis.\n\nOne of the key benefits of using QR Decomposition over\
    \ other methods for solving linear squares is that it is more numerically stable,\
    \ albeit at the expense of being slower to execute. If you are performing a large\
    \ quantity of regressions as a basis of a trading backtest, for instance, you\
    \ will need to consider very extensively whether QR Decomposition is the best\
    \ fit (excuse the pun).\n\nFor a square matrix A the QR Decomposition converts\
    \ A into the product of an orthogonal matrix Q (i.e. $Q^TQ = I$) and an upper\
    \ triangular matrix R. Hence:\n\n> $A = QR$\n\nThere are a few algorithms for\
    \ calculating the matrices Q and R. We will outline the method of Householder\
    \ Reflections, which is known to be more numerically stable than the alternative\
    \ Gram-Schmidt method. I've outlined the Householder Reflection method below.\n\
    \nNote, the following explanation is an expansion of the extremely detailed article\
    \ on QR decomposition using Householder Reflections over at Wikipedia.\n\n# 9.5.1\
    \  Algorithm\n\nA Householder Reflection is a linear transformation that enables\
    \ a vector to be reflected through a plane or hyperplane. Essentially, we use\
    \ this method because we want to create an upper triangular matrix, R. The householder\
    \ reflection is able to carry out this vector reflection all but one of the coordinates\
    \ disappears. The matrix Q will be built up as a sequence of matrix multiplications\
    \ that eliminate each coordinate in turn, up to the rank of the matrix A."
