    # 14.3 Statistical Distributions


    Of the most common concepts in quantitative finance is that of a *statistical
    distribution*. Variables play a huge part in quantitative financial modelling.
    Derivatives pricing, cash-flow forecasting and quantitative trading make use of
    statistical methods in some fashion. Hence, modelling statistical distributions
    is extremely important in C++.


    Many of the chapters in this book have made use of random number generators in
    order to carry out pricing tasks. So far this has been carried out in a *procedural
    manner*. Functions have been called to provide random numbers without any encapsulation
    of those random generators. The goal of this chapter is to show you that it is
    beneficial to create a *class hierarchy* both for statistical distributions and
    random number generators, separating them out in order to gain the most leverage
    from code reuse.


    In a nutshell, we are splitting the generation of (uniform integer) random numbers
    from draws of specific statistical distributions, such that we can use the statistics
    classes elsewhere without bringing along the "heavy" random number generation
    functions. Equally useful is the fact that we will be "swap out" different random
    number generators for our statistics classes for reasons of reliability, extensibility
    and efficiency.'
