    # Chapter 8: Using Arrays


    An array is a collection of data of a similar type. Arrays can hold more than
    one item (also called element) at a time. Each of these items has an index representing
    it; for example, the index of the first item is 0 while the index of the second
    item is 1. Although you can use variables to hold data, arrays save time.


    Here is the syntax of an array:


    ```

    dataType[] arrayName;

    ```


    +   - dataType represents the type of data an array can hold. This can be int,
    string, char, etc.

    - The square brackets indicate that this is an array.

    - The arrayName is just an identifier.


    # Declaring and Initializing Arrays


    When initializing an array, you must use the new keyword. Here is an example:


    ```

    int[] num = new int[5];//This is how you declare a single-dimensional array

    ```


    The 5 in the square brackets indicates the number of values the array can hold.
    Such an array is said to be one-dimensional. Here is an example of a multi-dimensional
    array:


    ```

    string[,] couples = new string[3, 2];// Declaring a multi-dimensional array

    ```


    With multi-dimensional arrays, a comma goes inside the first square brackets.
    The second bracket, [3, 2], indicates that we have 3 pairs of couples. For a better
    understanding of this, let''s look at examples. We will start with the num array:


    ```

    int[] num = new int[5] { 1, 2, 3, 4, 5 };//declaration and initialization at once

    ```


    Or we can rewrite this:


    ```

    int[] num = new int[5]; //this declares the array

    ```


    ```

    //initializes the array

    num[0] = 1;//the 0 in the square brackets is the index

    num[1] = 2;

    num[2] = 3;

    num[3] = 4;

    num[4] = 5;

    ```'
