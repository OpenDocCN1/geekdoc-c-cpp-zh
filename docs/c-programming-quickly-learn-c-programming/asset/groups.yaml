    # 4. Relational Operators


    These operators are used to check if two operands involved in an expression are
    true or false. The table below shows the relational operators you can use in C#
    (a = 4, b = 10):


    | Operator | Explanation | Example |

    | --- | --- | --- |

    | == | This evaluates if the operands on either side of the operator are equal.
    If they are, it returns True. | a == b is false |

    | != | This means not equal to. It returns True if the operands on either side
    of the operator are not equal. | a != b is true |

    | < | This is less than. And it returns True if the operand on the left is less
    than that on the right. | a < b is true |

    | > | This is greater than. And it checks if the left operand is greater than
    that on the right. And if it is, it returns True. | b > a is true |

    | <= | This operator is called less or equal to. And it checks if the left operand
    is less than or equal to the right operand. If it is, it returns True. | a <=
    b is true |

    | >= | This is greater than or equal to. And it returns true if the left operand
    is greater or equal to the right operand. | b >= a is true |'
- md: "\n# Chapter 5: Conditional Statements\n\n## if Statement\n\nThis is one of\
    \ the most important statements when coding. It allows you to specify an action\
    \ program should take if a certain condition is met.\n\nThis means you need to\
    \ specify the condition first. Your program will check if this condition is true,\
    \ after which it will execute a specific action. But in case the condition is\
    \ false, the program will not execute the body of the if statement.\n\nHere is\
    \ the syntax of an if statement:\n\n```csharp\nif(boolean expression)\n{\n   \
    \ // execute this code block if expression is true\n}\n```\n\nHere is an example\
    \ to help you understand this:\n\n```csharp\nstatic void Main(string[] args)\n\
    {\n    int a = 5, b = 35;\n\n    if (a >= b)\n    {\n        Console.WriteLine(\"\
    a is greater than or equal to b\");\n        Console.ReadLine();\n    }\n\n  \
    \  if (a <= b)\n    {\n        Console.WriteLine(\"a is less than or equal to\
    \ b\");\n        Console.ReadLine();\n    }\n\n    if (a == b)\n    {\n      \
    \  Console.WriteLine(\"a is equal to b\");\n        Console.ReadLine();\n    }\n\
    }\n```\n\nIn the example above, a is equal to 5 and b is equal to 35. Needless\
    \ to say, a is less than b. This means the first if statement evaluates to False.\
    \ So the program will skip it (will not execute its code block) and move on to\
    \ the next if statement, which evaluates to True. The code block of the second\
    \ if statement will be executed, displaying \"a is less than or equal to b.\"\n\
    \nC# gives you a chance to use an else statement, which comes right after the\
    \ if statement. This tells the program what to do in the event that the if statement\
    \ evaluates to False (or is not executed). Here is an example:\n\n```csharp\n\
    static void Main(string[] args)\n{\n    int a = 5, b = 35;\n\n    if (a == b)\n\
    \    {\n        Console.WriteLine(\"a is equal to b\");\n        Console.ReadLine();\n\
    \    }\n\n    else\n    {\n        Console.WriteLine(\"a and b are not equal\"\
    );\n        Console.ReadLine();\n    }\n}\n```\n\nSince a and b are not equal,\
    \ the if statement will not be executed. The program will turn to the else statement\
    \ which it will execute. Here is another example:\n\n```csharp\nstatic void Main(string[]\
    \ args)\n{\n    int number;\n\n    Console.WriteLine(\"Input a number that is\
    \ between 50 and 70\");\n    number = int.Parse(Console.ReadLine());\n\n    if\
    \ (number > 70)\n    {\n        Console.WriteLine(\"Oops! The number can only\
    \ be between 50 and 70.\");\n    }\n    else if (number < 50)\n    {\n       \
    \ Console.WriteLine(\"Oops! That's less than 50.\");\n    }\n    else\n    {\n\
    \        Console.WriteLine(\"You got it. Yeah!!!\");\n    }\n\n    Console.ReadLine();\n\
    }\n```\n\n## The Switch Statement\n\nIf you have multiple conditions to check,\
    \ you are free to use multiple if statements. However, this makes your code hard\
    \ to read. And it's also an inefficient way to run programs. Your best bet is\
    \ to use the switch statement, which is similar to having multiple if statements.\
    \ With this, you will create one switch statement and pair it with cases. Here\
    \ is an example:\n\n```csharp\nstatic void Main(string[] args)\n{\n    Console.WriteLine(\"\
    Choose a color: blue, green, red, or orange.\");\n    string color = Console.ReadLine();\n\
    \    switch (color.ToLower())\n    {\n        case \"blue\":\n        case \"\
    green\":\n        case \"red\":\n            Console.WriteLine(\"We have this\
    \ in stock.\");\n            break;\n        case \"orange\":\n            Console.WriteLine(\"\
    We don't have this color in stock.\");\n            break;\n    }\n    Console.ReadLine();\n\
    }\n```\n\nExplanation of the above program: When creating switch statements, place\
    \ the identifier, which in this case is the variable color, in front of the keyword\
    \ switch. color can take any Value. In the above example, it can only take switches\
    \ which are to be entered by the user.\n\nIn the switch statement, ToLower() tells\
    \ our compiler to convert what the user inputs to lowercase. Remember, blue and\
    \ Blue are as far as C# is concerned. break is a keyword that's used to stop the\
    \ execution of a particular code block. switch statements allow you to add default\
    \ actions. This means that if user inputs something that's not case, the program\
    \ will execute the default action. Here is an example of that:\n\n```csharp\n\
    static void Main(string[] args)\n{\n    Console.WriteLine(\"Choose a color: blue,\
    \ green, red, or orange.\");\n    string color = Console.ReadLine();\n    switch\
    \ (color.ToLower())\n    {\n        case \"blue\":\n        case \"green\":\n\
    \        case \"red\":\n            Console.WriteLine(\"We have this in stock.\"\
    );\n            break;\n        case \"orange\":\n            Console.WriteLine(\"\
    We don't have this in stock.\");\n            break;\n        default:\n     \
    \       Console.WriteLine(\"Re-run the program and type the correct color.\");\n\
    \            break;\n    }\n    Console.ReadLine();\n}\n```\n\n# Chapter 6: Loops\n\
    \nYou may want to repeat a part of your code several times. However, you would\
    \ have to rewrite that code as many times as you want it is inefficient. You can\
    \ easily get around this problem with loops. Let's discuss the different types\
    \ you have at your disposal.\n\n## The Simplest of all loops\n\nThis is the simplest\
    \ of all loops. It executes your code as long as a condition you specified stays\
    \ true. This means that if the condition evaluates true, the code block of the\
    \ while statement will be executed. The program will recheck the condition, if\
    \ it is still true, it will go on to the next line in your code. This goes until\
    \ the condition evaluates to false. Here is an example:\n\n```csharp\nstatic void\
    \ Main(string[] args)\n{\n    int x = 0;\n\n    while (x < 5)\n    {\n       \
    \ Console.WriteLine(\"The value of x is {0}\", x);\n        x++;\n    }\n\n  \
    \  Console.ReadLine();\n}\n```\n\nOutput:\nValue of x is 0\nValue of x is 1\n\
    Value of x is 2\nValue of x is 3\nValue of x is 4\n\nIn the above example, the\
    \ while statement has been designed to check the value of x. If x is less than\
    \ 5, its value should be printed on screen. x++ tells our program to look at the\
    \ value of x at any given time and add 1 to it. You can alternatively write this\
    \ as x = x + 1. In the first instance the while statement is run, x is equal to\
    \ 0. Being less than 5, 0 is printed on screen. The program then returns to the\
    \ while statement and equals x. This time, x is 1. So it is printed on screen.\
    \ This goes until x becomes 5, which makes the while statement return False. So\
    \ the code block of the while statement is not executed and the program moves\
    \ to the next line (Console.ReadLine()). You might have noticed {0} inside the\
    \ statement that prints the value of x on screen. The zero is a placeholder. And\
    \ it represents the variable x, which is on position at the end of that statement.\n\
    \n## Do...While Loop\n\nThis is the same as while loop. The only difference is\
    \ that in Do...While loop, the code block is executed first and the condition\
    \ is checked later. So your code gets executed at least once. Here is an example:\n\
    \n```csharp\nstatic void Main(string[] args)\n{\n    int x = 0;\n\n    do\n  \
    \  {\n        Console.WriteLine(\"The value of x is {0}\", x);\n        x++;\n\
    \    } while (x < 6);\n    Console.ReadLine();\n}\n```\n\nTry changing the value\
    \ of x to 7 and observe what happens.\n\n## For Loop\n\nThis is one of the most\
    \ popular loops you can use. And it repeats your code for a specific number of\
    \ times. Here is its syntax:\n\n```csharp\nfor (initialize value; state condition;\
    \ state increment/decrement)\n{\n    statement(s);\n}\n```\n\nHere is an example\
    \ you can try:\n\n```csharp\nstatic void Main(string[] args)\n{\n    for (int\
    \ x = 0; x < 5; x++)\n    {\n        Console.WriteLine(\"Value of x: {0}\", x);\n\
    \    }\n    Console.ReadLine();\n}\n```\n\nOutput:\nValue of x is 0\nValue of\
    \ x is 1\nValue of x is 2\nValue of x is 3\nValue of x is 4\n\nIn the **for**\
    \ statement, we have 0 as the value of x. **x < 5** is a bool condition which\
    \ will evaluate to True or False. x++ adds 1 to the current value of x.\n\n##\
    \ Foreach\n\nThis works in the same way as **for** loop. **foreach** is best used\
    \ when you want to loop items in an array. **foreach** is easier to read and less\
    \ prone to errors than **for** loop. Here is an example:\n\n```csharp\nstatic\
    \ void Main(string[] args)\n{\n    string[] boyNames = new string[] {\n      \
    \  \"John\",\n        \"Emmanuel\",\n        \"Fred\",\n        \"Tom\",\n   \
    \     \"Mike\"\n    };\n\n    foreach (string Name in boyNames)\n    {\n     \
    \   Console.WriteLine(\"Boy Name: {0}\", Name);\n    }\n    Console.ReadLine();\n\
    }\n```\n"
  mdcn: "\n\n# 第 5 章：条件语句\n\n## if 语句\n\n这是编码时最重要的语句之一。它允许你指定在满足特定条件时程序应该采取的操作。\n\n\
    这意味着你需要先指定条件。你的程序将检查该条件是否为真（true），之后将执行特定的操作。但如果条件为假（false），程序将不会执行 if 语句体体。\n\
    \n以下是 if 语句的语法：\n\n```csharp\nif(boolean expression)\n{\n    // 如果表达式为真，则执行此代码块\n\
    }\n```\n\n这里有一个示例可以帮助你理解：\n\n```csharp\nstatic void Main(string[] args)\n{\n \
    \   int a = 5, b = 35;\n\n    if (a >= b)\n    {\n        Console.WriteLine(\"\
    a is greater than or equal to b\");\n        Console.ReadLine();\n    }\n\n  \
    \  if (a <= b)\n    {\n        Console.WriteLine(\"a is less than or equal to\
    \ b\");\n        Console.ReadLine();\n    }\n\n    if (a == b)\n    {\n      \
    \  Console.WriteLine(\"a is equal to b\");\n        Console.ReadLine();\n    }\n\
    }\n```\n\n在上面的示例中，a 等于 5，b 等于 35。不用说，a 小于 b。这意味着第一个 if 语句求结果为假。因此，程序将跳过它（不执行其代码块），并移动到下一个\
    \ if 语句，后者的求结果为真。第二个 if 语句的代码块将被执行，显示“a is less than or equal to b”。\n\nC# 给了你使用\
    \ `else` 语句的机会，它紧跟在 if 语句之后。这告诉程序在 if 语句求结果为假（或未执行）时该做什么。这里有一个示例：\n\n```csharp\n\
    static void Main(string[] args)\n{\n    int a = 5, b = 35;\n\n    if (a == b)\n\
    \    {\n        Console.WriteLine(\"a is equal to b\");\n        Console.ReadLine();\n\
    \    }\n\n    else\n    {\n        Console.WriteLine(\"a and b are not equal\"\
    );\n        Console.ReadLine();\n    }\n}\n```\n\n由于 a 和 b 不相等，if 语句将不会执行。程序将转向\
    \ `else` 语句并执行它。这里是另一个示例：\n\n```csharp\nstatic void Main(string[] args)\n{\n \
    \   int number;\n\n    Console.WriteLine(\"Input a number that is between 50 and\
    \ 70\");\n    number = int.Parse(Console.ReadLine());\n\n    if (number > 70)\n\
    \    {\n        Console.WriteLine(\"Oops! The number can only be between 50 and\
    \ 70.\");\n    }\n    else if (number < 50)\n    {\n        Console.WriteLine(\"\
    Oops! That's less than 50.\");\n    }\n    else\n    {\n        Console.WriteLine(\"\
    You got it. Yeah!!!\");\n    }\n\n    Console.ReadLine();\n}\n```\n\n## switch\
    \ 语句\n\n如果你有多个条件需要检查，你可以自由使用多个 if 语句。然而，这会让你的代码难以阅读。而且这运行运行程序的效率较低。最好的办法是使用 `switch`\
    \ 语句，它类似于拥有多个 if 语句。通过这种方式，你创建一个 switch 语句并与多个 `cases` 配对。这里有一个示例：\n\n```csharp\n\
    static void Main(string[] args)\n{\n    Console.WriteLine(\"Choose a color: blue,\
    \ green, red, or orange.\");\n    string color = Console.ReadLine();\n    switch\
    \ (color.ToLower())\n    {\n        case \"blue\":\n        case \"green\":\n\
    \        case \"red\":\n            Console.WriteLine(\"We have this in stock.\"\
    );\n            break;\n        case \"orange\":\n            Console.WriteLine(\"\
    We don't have this color in stock.\");\n            break;\n    }\n    Console.ReadLine();\n\
    }\n```\n\n上述程序的解释：在创建 switch 语句时，将标识符（在此例中是变量 `color`）放在关键字 `switch` 之前。`color`\
    \ 可以取任何值。在上面的示例中，它只能取用户输入的 switch 情况。\n\n在 switch 语句中，`ToLower()` 告诉我们的编译器将用户输入的内容转换为小写。记住，对于\
    \ C# 来说，blue 和 Blue 是不一样的。`break` 是一个关键字，用于停止执行特定代码块的执行。`switch` 语句允许你添加默认操作。这意味着如果用户输入不符合任何\
    \ case 的内容，程序将执行默认操作。这里是该功能的示例：\n\n```csharp\nstatic void Main(string[] args)\n\
    {\n    Console.WriteLine(\"Choose a color: blue, green, red, or orange.\");\n\
    \    string color = Console.ReadLine();\n    switch (color.ToLower())\n    {\n\
    \        case \"blue\":\n        case \"green\":\n        case \"red\":\n    \
    \        Console.WriteLine(\"We have this in stock.\");\n            break;\n\
    \        case \"orange\":\n            Console.WriteLine(\"We don't have this\
    \ color in stock.\");\n            break;\n        default:\n            Console.WriteLine(\"\
    Re-run the program and type the correct color.\");\n            break;\n    }\n\
    \    Console.ReadLine();\n}\n```\n\n# 第 6 章：循环\n\n你可能想要重复执行代码的某部分。然而，你必须根据需要的次数重写该代码，这是低效的。你可以通过循环轻松地解决这个问题。让我们讨论一下你可以使用的不同类型的循环。\n\
    \n## 最简单的循环\n\n这是所有循环中最简单的。只要你指定的条件保持为真，它就会执行你的代码。这意味着如果条件求结果为真，`while` 语句的代码块将被执行。程序将重新检查条件，如果它仍然为真，它将继续执行代码中的下一行。一直持续到条件求结果为假。这里有一个示例：\n\
    \n```csharp\nstatic void Main(string[] args)\n{\n    int x = 0;\n\n    while (x\
    \ < 5)\n    {\n        Console.WriteLine(\"The value of x is {0}\", x);\n    \
    \    x++;\n    }\n\n    Console.ReadLine();\n}\n```\n\n输出：\nValue of x is 0\n\
    Value of x is 1\nValue of x is 2\nValue of x is 3\nValue of x is 4\n\n在上面的示例中，`while`\
    \ 语句被设计为检查 x 的值。如果 x 小于 5，它的值将打印在屏幕上。`x++` 告诉我们的程序在任何时刻查看 x 的值并加1。你也可以写为 `x =\
    \ x + 1`。在第一次运行 `while` 语句时，x 等于 0。因为小于 5，0 被打印在屏幕上。程序随后返回 `while` 语句并等同于 x。这次，x\
    \ 是 1。所以它被打印在屏幕上。这种情况一直持续到 x 变成 5，使得 `while` 语句求结果为假。因此，`while` 语句的代码块不执行，程序移动到下一行（`Console.ReadLine()`）。你可能注意到在在屏幕上打印\
    \ x 值的语句内部有 `{0}`。零是一个占位符。它代表变量 x，该变量位于该语句末尾的位置。\n\n## Do...While 循环\n\n这与 `while`\
    \ 循环相同。唯一的区别是在 `Do...While` 循环中，代码块首先执行，稍后检查条件。因此你的代码至少会被执行一次。这里有一个示例：\n\n```csharp\n\
    static void Main(string[] args)\n{\n    int x = 0;\n\n    do\n    {\n        Console.WriteLine(\"\
    The value of x is {0}\", x);\n        x++;\n    } while (x < 6);\n    Console.ReadLine();\n\
    }\n```\n\n尝试将 x 的值改为7并观察发生了什么。\n\n## For 循环\n\n这是你可以使用的常用的循环之一。它按指定的次数重复你的代码。以下是它的语法：\n\
    \n```csharp\nfor (初始化值; 状态条件; 递增/递减)\n{\n    语句(s);\n}\n```\n\n这里有一个你可以尝试的示例：\n\
    \n```csharp\nstatic void Main(string[] args)\n{\n    for (int x = 0; x < 5; x++)\n\
    \    {\n        Console.WriteLine(\"Value of x: {0}\", x);\n    }\n    Console.ReadLine();\n\
    }\n```\n\n输出：\nValue of x is 0\nValue of x is 1\nValue of x is 2\nValue of x is\
    \ 3\nValue of x is 4\n\n在 `for` 语句中，我们有 x 的值为0。`x < 5` 是一个布尔条件，求结果为真或假。`x++` 给当前的\
    \ x 值加1。\n\n## Foreach\n\n它的工作方式与 `for` 循环相同。`foreach` 最适合用于循环数组中的项。`foreach`\
    \ 比 `for` 循环更容易阅读且不易出错。这里有一个示例：\n\n```csharp\nstatic void Main(string[] args)\n\
    {\n    string[] boyNames = new string[] {\n        \"John\",\n        \"Emmanuel\"\
    ,\n        \"Fred\",\n        \"Tom\",\n        \"Mike\"\n    };\n\n    foreach\
    \ (string Name in boyNames)\n    {\n        Console.WriteLine(\"Boy Name: {0}\"\
    , Name);\n    }\n    Console.ReadLine();\n}\n```\n"
