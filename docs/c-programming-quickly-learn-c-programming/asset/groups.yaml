  mdcn: "\n\n# 第3章：变量与数据类型\n\n变量在 C# 中非常重要，因为你使用它们来存储数据（值）。在给变量赋值时，你需要指定该变量的数据类型。C#\
    \ 是一种类型安全的语言，这意味着每个变量都持有相应类型的数据。\n\n以下是声明变量的方法：\n\ndata_type variable_name;\n\n\
    或者\n\ndata_type variable_name = value;\n\n=` 符号是赋值运算符。你将使用它来给变量赋值。以下是声明变量并赋值的方法：\n\
    \n```csharp\nstatic void Main(string[] args)\n{\n    string message;\n    // 在变量声明后赋值\n\
    \    message = \"Hello World!!\";\n\n    Console.WriteLine(message);\n    Console.ReadLine();\n\
    }\n```\n\n`string` 是数据类型，`message` 是变量。`message` 持有的值在注释后的行中被赋值，值为 `Hello World!!`。\n\
    \n但你也可以在同一行声明变量并为其赋值：\n\n```csharp\nstatic void Main(string[] args)\n{\n    string\
    \ message = \"Hello World!!\";\n\n    Console.WriteLine(message);\n    Console.ReadLine();\n\
    }\n```\n\nC# 还允许你像这样给多个变量赋值：\n\n`int a, b, c, d = 5;`\n\n你还可以通过这种方式进行多行变量声明：\n\
    \n```csharp\nint a, b,\n    c,\nd = 5;\n```\n\n编译器会将上述代码视为一行，直到找到分号。\n\n你可以通过将一个变量赋值另一个变量来很好地声明变量：\n\
    \n```csharp\nint r = 56;\nint y = r; // 结果 y 的值也将是 56\n```\n\n这里有一个你可以复制的程序。将它复制到\
    \ Visual C# 编辑器中运行：\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Text;\n\nnamespace ConsoleApplication1\n{\n \
    \   class Program\n    {\n        static void Main(string[] args)\n        {\n\
    \            string firstname, lastname;\n\n            Console.WriteLine(\"Enter\
    \ Your First Name:\");\n            firstname = Console.ReadLine();\n\n      \
    \      Console.WriteLine(\"Enter Your Last Name:\");\n            lastname = Console.ReadLine();\n\
    \n            Console.WriteLine(\"Your name is \" + firstname + \" \" + lastname);\n\
    \n            Console.ReadLine();\n        }\n    }\n}\n```\n\n记住 `Console.ReadLine()`\
    \ 用于从用户获取输入。用户输入的任何内容都将成为变量 `firstname` 和 `lastname` 的值。尝试更改代码并观察会发生什么；例如，删除你打印行中\
    \ `firstname` 和 `lastname` 之间的引号和一个一个加号。\n\n# 数据类型\n\n本章清楚地说明了在声明变量之前，你必须指定它的数据类型：\n\
    data_type variable_name;\n\n从上面的示例中，你可能已经了 `string` 和 `int`。但这些并不是唯一的数据类型。\n让我们详细查看最常用的类型：\n\
    \n- string：用于存储文本。以 `Hello World` 为例。在处理字符串时，务必将它们放在引号中。\n- char：单个 Unicode 字符。\n\
    - int：用于存储数字。因此，你可以用它来存储整数。示例有 5、10 和 1003。\n- float：这代表 32 位单精度浮点类型。其范围是 -3.402823e38\
    \ 到 3.402823e38。\n- double：这是 64 位双精度浮点类型。其范围是 -1.797693134862332e-308 到 1.797693134862332e-308。\n\
    - decimal：这代表 128 位小数值，有效数字为 28 到 29 位。\n- byte：这表示 8 位无符号整数。其范围是 0 到 255。\n-\
    \ byte：代表 8 位有符号整数。范围是 -128 到 127。\n- uint：代表 32 位无符号整数，范围为 0 到 4294967295。\n\
    - short：意味着 16 位有符号整数。范围是 -32,768 到 32,767。\n- long：代表 64 位有符号整数。\n- ulong：表示\
    \ 64 位无符号整数。\n- bool：C# 中简单的数据类型。它的范围包含两个值：`True` 和 `False`。你在编写逻辑表达式时会使用它。\n\
    - DateTime：用于指示日期和时间。\n\n如果变量的值与指定的数据类型不符，编译器将显示错误消息。尝试以下示例：\n\n```csharp\nint\
    \ x = 1;\nConsole.WriteLine(x);\nConsole.ReadLine();\n```\n\n现在尝试这个错误的示例：\n\n\
    ```csharp\nint x = \"Program\";\nConsole.WriteLine(x);\nConsole.ReadLine();\n\
    ```\n\n记住，`int` 只能接受整数；`\"Program\"` 是一个字符串。\n\n# 第4章：运算符\n\n运算符指示编译器执行特定操作。例如，在表达式\
    \ `5 – 3` 中，减号是运算符，而 `5` 和 `3` 是操作数。该表达式告诉编译器从 5 中减去 3。\n\n下面，我们将查看各种运算符。\n\n\
    # 1. 赋值运算符\n\n这是 C# 中可以使用的运算符列表：\n\n| 运算符 | 解释 | 示例 |\n| --- | --- | --- |\n|\
    \ = | 等于，将值赋予变量。 | a = b |\n| += | 加法赋值，将右侧加到左侧变量上。 | a += b |\n| -= | 减法赋值，从左侧变量减去右侧值。\
    \ | a -= b |\n| *= | 乘法赋值，将左侧变量乘以右侧值。 | a *= b |\n| /= | 除法赋值，将左侧变量除以右侧值。 | a\
    \ /= b |\n| %= | 取模赋值，对左侧变量对右侧取模。 | a %= b |\n| << | 左移。 | a << b |\n| >> | 右移。\
    \ | a >>= b |\n\n# 2. 算术运算符\n\n这些运算符用于创建数学表达式。以下是 C# 中可以使用的算术运算符：\n\n| 运算符 | 解释\
    \ | 示例 |\n| --- | --- | --- |\n| + | 加法，增加操作数。 | a + b |\n| - | 减法，从左侧操作数减去右侧操作数。\
    \ | a - b |\n| * | 乘法，乘以操作数。 | a * b |\n| / | 除法，将左侧操作数除以右侧操作数。 | a / b |\n| %\
    \ | 取模，返回左侧操作数除以右侧操作数的余数。 | a % b |\n\n你可以使用以下代码尝试这些运算符：\n\n```csharp\nint a =\
    \ 1;\nint b = 2;\n\nConsole.WriteLine(b * a);\n```\n\n更改 `Console.WriteLine(b\
    \ * a)` 中的运算符并观察发生什么。\n\n# 3. 逻辑运算符\n\n这些用于检查表达式是否为真或假。以下是逻辑运算符表：\n\n| 运算符 | 解释\
    \ | 示例 |\n| --- | --- | --- |\n| && | 逻辑与，检查两个操作数是否都为真。如果是，则返回真。如果其中一个或两个为假，则返回假。\
    \ | a && b 为假 |\n| || | 逻辑或，如果任何一个操作数为真，则返回真。 | a || b 为真 |\n| ! | 逻辑非，反转布尔表达式当前的值。\
    \ | !(a && b) 为真 |\n\n# 4. 关系运算符\n\n这些运算符用于检查表达式中的两个操作数是否为真或假。下表显示了 C# 中可以使用的关系运算符（a\
    \ = 4, b = 10）：\n\n| 运算符 | 解释 | 示例 |\n| --- | --- | --- |\n| == | 评估运算符两边的操作数是否相等。如果是，则返回真。\
    \ | a == b 为假 |\n| != | 不等于。如果运算符两边的操作数不相等，则返回真。 | a != b 为真 |\n| < | 小于。如果左侧操作数小于右侧操作数，则返回真。\
    \ | a < b 为真 |\n| > | 大于。检查左侧操作数是否大于右侧操作数。如果是，则返回真。 | b > a 为真 |\n| <= | 小于等于。检查左侧操作数是否小于或等于右侧操作数。如果是，则返回真。\
    \ | a <= b 为真 |\n| >= | 大于等于。如果左侧操作数大于或等于右侧操作数，则返回真。 | b >= a 为真 |\n\n"
