    \ MainBlock。\n\n# 用户定义异常\n\n在 C# 中，你可以创建自己的异常。这些被称为用户生成的异常或自定义异常。它们使用了我们已经讨论过的\
    \ throw 关键字。学习这个例子：\n\n```csharp\nnamespace userDefinedException\n{\nclass Program\n\
