- md: "\n## Chapter 7: Understanding Methods\n\nWe briefly looked at methods earlier\
    \ in the book. In this chapter, we will dive deeper into this topic as it's important.\n\
    \nSo far, the programs we have created have our code go into the Main() method.\
    \ There is no problem with this since most of them had single tasks to perform.\
    \ But as your code grows, you will find necessary to add other methods. Similar\
    \ functions will be grouped together, making your code easier to read and reusable.\
    \ You will also have a chance to hide some information and avoid duplication.\n\
    \nWhen creating a method, ensure that you contain it in a class. And do not get\
    \ carried away to include too many functions in the method—just one is enough.\n\
    \n## How to Define a Method\n\nHere is the syntax you can use when specifying\
    \ methods:\n\n```\nAccessLevel ReturnValueType MethodName(ParamList)\n{\n    Statements\n\
    }\n```\n\n**Access Level**: this uses access modifiers to specify the visibility\
    \ of a method. **private** means the method can only be seen by every other elements\
    \ in the class. **public** refers to methods freely visible to everyone and everything.\
    \ **protected** is for methods with their access restricted to the class and derived\
    \ classes.\n\n**Return Value Type**: a method can return a value. And you use\
    \ data types to indicate the value a method should return. **int**, for instance,\
    \ means the method will return an integer while **void** means it will return\
    \ nothing.\n\n**Method Name**: this is just an identifier. And you must follow\
    \ the rules used when making identifiers.\n\n**Parameter List**: this comes in\
    \ a pair of parentheses. If you have more than one parameter, separate them with\
    \ commas. Parameters pass and receive data to the method. If you have empty parentheses,\
    \ it means you have no parameters.\n\n**Statements**: this is the code to be executed,\
    \ and it's enclosed in curly brackets.\n\nHere is an example on this:\n\n```\n\
    public void sampleMethod()\n{\n    Console.WriteLine(\"My sample method has been\
    \ called.\");\n}\n```\n\n## Calling a Method\n\nThe above method (sampleMethod())\
    \ can be called from another method. Here is an example:\n```c\nusing System;\n\
    \nclass Program {\n    static void Main() {\n        Console.WriteLine(\"This\
    \ is the main method.\");\n        sampleMethod();\n        Console.ReadLine();\n\
    \    }\n\n    public static void sampleMethod() {\n        Console.WriteLine(\"\
    My sample method has been called.\");\n    }\n}\n```\n\nWhen the program executes\
    \ the Main method, it will first display \"This is the main method.\" The next\
    \ line, however, tells it to execute sampleMethod(). So the program will leave\
    \ Main() and go to sampleMethod(). After it is done with, it will go back to Main\
    \ to execute Console.ReadLine().\n\nYou might have noticed that I have added static\
    \ in the sampleMethod. That's because I cannot call a non-static Method into a\
    \ static one.\n\n## Popular Statements\n\n### The Return Statement\nMethods can\
    \ be coded to return values into other methods. Consider the below example:\n\n\
    ```c\nnamespace ConsoleApplication {\nclass Addition {\n    static void Main()\
    \ {\n        addInt(10, 30);\n    }\n\n    static void addInt(int a, int b) {\n\
    \        int c = a + b;\n        Console.WriteLine(\"Adding {0} and {1} brings\
    \ {2} as the answer.\", a, b, c);\n    }\n}\n```\n\nIn the above example, addInt\
    \ is being called in the Main. We can rewrite this code to only return the result\
    \ when addInt is called. Here is how our code will look like:\n\n```c\nnamespace\
    \ ConsoleApplication1\n{\n    class Addition\n    {\n        static void Main()\n\
    \        {\n            int result = addInt(10, 30);\n            Console.WriteLine(\"\
    The answer is {0}\", result);\n            Console.ReadLine();\n        }\n\n\
    \        static int addInt(int a, int b)\n        {\n            int c = a + b;\n\
    \            return c;\n        }\n    }\n}\n```\n\nThe addInt method had to have\
    \ its value changed from void to int, which stops it from returning to nothing.\
    \ return c also had to be added in the statements, replacing the code that printed\
    \ the answer on screen. Now we have addInt returning a value to the method it\
    \ is called from, we need to capture that return value in the Main method, which\
    \ is where addInt is being called. The line that has int result = addInt(10, 30)\
    \ accomplishes this.\n\n### The break Statement\nThis is one other important statement\
    \ in C#. When you have a break in a certain code block, the program will terminate\
    \ that code and move on to the next code block. Here is an example:\n\n```csharp\n\
    namespace breakExample\n{\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            int a = 5;\n            while (a < 15)\n     \
    \       {\n              Console.WriteLine(a);\n              if (a == 9)\n  \
    \            {\n                Console.WriteLine(\"Break statement encountered.\"\
    );\n                break;\n              }\n              a++;\n            }\n\
    \            Console.ReadLine();\n        }\n    }\n}\n```\n\nIn the above example,\
    \ the program cannot display any numbers greater than 9 because it has been instructed\
    \ to break once a becomes 9.\n\n## Chapter 8: Using Arrays\n\nAn array is a collection\
    \ of data of a similar type. An array is a collection of data of a similar type.\
    \ In this chapter, we will learn how to use arrays to store and manipulate data.\
    \ Arrays are very useful when you have multiple values of the same type, such\
    \ as a list of integers or a collection of strings. We will explore how to declare,\
    \ initialize, and access arrays, as well as how to iterate through them using\
    \ loops.\n\n### Declaring and Initializing Arrays\n\nTo declare an array, you\
    \ specify the type of elements it holds and the name of the array, followed by\
    \ square brackets.\n\n```c\nint[] numbers = new int[5];\n```\n\nYou can also initialize\
    \ an array at the time of declaration:\n\n```c\nint[] numbers = { 1, 2, 3, 4,\
    \ 5 };\n```\n\n### Accessing Modifying Arrays\n\nTo access an element in an array,\
    \ you use its index, which starts at 0.\n\n```csharp\nConsole.WriteLine(numbers[0]);\
    \ // Outputs 1\nnumbers[0] = 10; // Changes the first element\n```\n\n### Iterating\
    \ Through Arrays\n\nThe most common way to iterate through an array is using a\
    \ `for` loop or a `foreach` loop.\n\n```csharp\nfor (int i = 0; i < numbers.Length;\
    \ i++)\n{\n    Console.WriteLine(numbers[i]);\n}\n\nforeach (int number in numbers)\n\
    {\n    Console.WriteLine(number);\n}\n```\n"
  mdcn: "\n\n## 第7 章：理解方法\n\n我们在书前面的部分简要介绍了方法。在本章中，我们将深入探讨这个主题，因为它非常重要。\n\n到目前为止，我们创建的程序代码都写在\
    \ `Main()` 方法中。这没有问题，因为大多数程序只执行单一任务。但随着你代码的增长，你会发现有必要添加其他方法。相似的功能将被在一起，使得你的代码更易读且更具重用性。你还将有机会隐藏某些信息并避免重复。\n\
    \n在创建方法时，请确保将其包含在类中。不要试图在一个方法中包含过多的函数——一个就足够了。\n\n## 如何定义方法\n\n在指定方法时，可以使用以下语法：\n\
    \n```\nAccessLevel ReturnValueType MethodName(ParamList)\n{\n    Statements\n\
    }\n```\n\n**Access Level（访问级别）**：这使用访问修饰符来指定方法的可见性。**private**（私有）意味着该方法只能对类中的其他元素可见。**public**（公共）指的是对所有人一切都可见的方法。**protected**（保护）用于访问权限限制在类及其派生类的方法。\n\
    \n**Return Value Type（返回值类型）**：方法可以返回一个值。你使用数据类型来指示方法应该返回的值。例如，**int** 表示方法将返回一个整数，而\
    \ **void** 意味着它不返回任何内容。\n\n**Method Name（方法名）**：这就是一个标识符。你必须遵循创建标识符时的规则。\n\n**Parameter\
    \ List（参数列表）**：它位于一对括号中。如果你有多个参数，用逗号分隔它们。参数向方法传递和接收数据。如果你有空括号，意味着没有参数。\n\n**Statements（语句）**：这是要执行的代码，包含在大括号内。\n\
    \n这是一个关于此的示例：\n\n```\npublic void sampleMethod()\n{\n    Console.WriteLine(\"\
    My sample method has been called.\");\n}\n```\n\n## 调用方法\n\n上面的方法（sampleMethod()）可以从另一个方法调用。这是一个示例：\n\
    ```csharp\nusing System;\n\nclass Program {\n    static void Main() {\n      \
    \  Console.WriteLine(\"This is the main method.\");\n        sampleMethod();\n\
    \        Console.ReadLine();\n    }\n\n    public static void sampleMethod() {\n\
    \        Console.WriteLine(\"My sample method has been called.\");\n    }\n}\n\
    ```\n\n当程序执行 `Main` 方法时，它会先显示“This is the main method.”。然而，一行告诉它执行 `sampleMethod()`。因此，程序将离开\
    \ `Main()` 并进入 `sampleMethod()`。在完成后，它将返回 `Main` 执行 `Console.ReadLine()`。\n\n\
    你可能注意到我在 `sampleMethod` 中添加了 `static`。这是因为我不能在静态方法中调用非静态方法。\n\n## 常用语句\n\n###\
    \ Return 语句\n方法可以编写为将值返回到其他方法。考虑下面的示例：\n\n```c\nnamespace ConsoleApplication {\n\
    class Addition {\n    static void Main() {\n        addInt(10, 30);\n    }\n\n\
    \    static void addInt(int a, int b) {\n        int c = a + b;\n        Console.WriteLine(\"\
    Adding {0} and {1} brings {2} as the answer.\", a, b, c);\n    }\n}\n```\n\n在上面的示例中，`addInt`\
    \ 在 `Main` 中被调用。我们可以重写这段代码，仅在调用 `addInt` 时返回结果。我们的代码看起来像这样：\n\n```csharp\nnamespace\
    \ ConsoleApplication1\n{\n    class Addition\n    {\n        static void Main()\n\
    \        {\n            int result = addInt(10, 30);\n            Console.WriteLine(\"\
    The answer is {0}\", result);\n            Console.ReadLine();\n        }\n\n\
    \        static int addInt(int a, int b)\n        {\n            int c = a + b;\n\
    \            return c;\n        }\n    }\n}\n```\n\n`addInt` 方法必须将其值从 `void` 更改为\
    \ `int`，这阻止了它返回空。语句中还必须添加 `return c`，替换了原来在屏幕上打印答案的代码。现在我们让 `addInt` 向调用它的方法返回值，我们需要在\
    \ `Main` 方法中捕获该返回值，那里是 `addInt` 被调的地方。`int result = addInt(10, 30)` 这一行就完成了此操作。\n\
    \n### break 语句\n这是 C# 中的另一个重要语句。当特定代码块中使用 `break` 时，程序将终止该代码并移动到下一个代码块。这是一个示例：\n\
    \n```csharp\nnamespace breakExample\n{\n    class Program\n    {\n        static\
    \ void Main(string[] args)\n        {\n            int a = 5;\n            while\
    \ (a < 15)\n            {\n              Console.WriteLine(a);\n             \
    \ if (a == 9)\n              {\n                Console.WriteLine(\"Break statement\
    \ encountered.\");\n                break;\n              }\n              a++;\n\
    \            }\n            Console.ReadLine();\n        }\n    }\n}\n```\n\n\
    在上面的示例中，程序无法显示任何大于 9 的数字，因为它被指令在 `a` 变为 9 时 `break`。\n\n## 第8 章：使用数组\n\n数组是相同类型数据的集合。在本章中，我们将学习如何使用数组来存储和处理数据。当你有多个相同类型的值时（例如整数列表或字符串集合），数组非常有用。我们将探索如何声明、初始化和访问数组，以及如何使用循环遍历它们。\n\
    \n### 数组的声明和初始化\n\n声明数组时，你指定它包含的元素类型和数组名称，后跟方括号。\n\n```csharp\nint[] numbers =\
    \ new int[5];\n```\n\n你也可以在声明时初始化数组：\n\n```csharp\nint[] numbers = { 1, 2, 3,\
    \ 4, 5 };\n```\n\n### 访问和修改数组\n\n要访问数组中的元素，使用它的索引，索引从0开始。\n\n```csharp\nConsole.WriteLine(numbers[0]);\
    \ // 输出 1\nnumbers[0] = 10; // 修改第一个元素\n```\n\n### 遍历数组\n\n遍历数组的常用方法是使用 `for`\
    \ 循环或 `foreach` 循环。\n\n```csharp\nfor (int i = 0; i < numbers.Length; i++)\n{\n\
    \    Console.WriteLine(numbers[i]);\n}\n\nforeach (int number in numbers)\n{\n\
    \    Console.WriteLine(number);\n}\n```\n\n"
