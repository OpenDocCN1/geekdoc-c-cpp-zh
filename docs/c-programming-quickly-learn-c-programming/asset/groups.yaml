- md: "\n# Chapter 9: Exception Handling\n\nAn exception is an error that occurs at\
    \ runtime. Here is a popular example: assume you've created a program that returns\
    \ a result after dividing two numbers that have to be entered by the user. Now\
    \ imagine a situation where a user enters 0 as the other number. This will cause\
    \ an error and the program will crash. Exception handling comes in to keep this\
    \ from happening. If you employ it, the program will display a message about the\
    \ error and continue running.\n\nTo use exception handling, you need three important\
    \ blocks of code: **try, catch, and finally**. But you may also add a fourth called\
    \ **throw**:\n\n- try: this is a keyword. And it identifies a block of code which\
    \ may cause an exception.\n- catch: this is also another keyword. And it handles\
    \ the exception after try has raised it.\n- finally: this block of code is executed\
    \ whether there is an exception or not.\n- throw: another keyword used to add\
    \ user defined exception messages.\n\nLet's look at an example:\n\n```csharp\n\
    static void Main(string[] args)\n{\n  int num1,num2;\n  decimal result;\n\n  Console.WriteLine(\"\
    This program divides two numbers\");\n  Console.WriteLine(\"Enter the first Number:\
    \ \");\n  num1 = Convert.ToInt32(Console.ReadLine());\n  Console.WriteLine(\"\
    Enter the second Number: \");\n  num2 = Convert.ToInt32(Console.ReadLine());\n\
    }\n```\n\n```csharp\nresult = (decimal)num1 / (decimal)num2;\nConsole.WriteLine(\"\
    The answer is \" + result.ToString());\nConsole.ReadLine();\n```\n\nCopy this\
    \ code into the editor and run the program. On your first run, input 4 as the\
    \ first number and 2 as the second number. As you will see, you should have no\
    \ troubles. Close the console and run the program again. This, enter any number\
    \ and 0.\n\nThe program will crash, staining our coding abilities in the eyes\
    \ of our users. Frankly, we have exception handling. Here is a code that can save\
    \ us from the embarrassment:\n\n```csharp\nstatic void Main(string[] args)\n{\n\
    MainBlock:\n//This is the try block\ntry\n{\n    int num1, num2;\n    decimal\
    \ result;\n\n    Console.WriteLine(\"This program divides two numbers\");\n  \
    \  Console.WriteLine(\"Enter the first Number: \");\n    num1 = Convert.ToInt32(Console.ReadLine());\n\
    \    Console.WriteLine(\"Enter the second Number: \");\n    num2 = Convert.ToInt32(Console.ReadLine());\n\
    \n    result = (decimal)num1 / (decimal)num2;\n    Console.WriteLine(\"The answer\
    \ is \" + result.ToString());\n}\n```\n\n```csharp\n//This is the catch block\
    \ to handle exception\ncatch (DivideByZeroException dex)\n{\n    Console.WriteLine(\"\
    Entering 0 raises an exception!\");\n    Console.WriteLine(\"Details about Error:\
    \ \" + dex.ToString());\n    goto MainBlock;\n}\n```\n\n```csharp\n//This is the\
    \ finally block\nfinally\n{\n    Console.ReadLine();\n    Console.WriteLine(\"\
    Press Enter to close or reload the program\");\n    Console.ReadLine();\n}\n```\n\
    \nAfter running the program, input any number and 0. This program will not crash.\
    \ Rather, it will display an error and allow you to rerun it by pressing Enter.\n\
    \nKnow that goto is a keyword that instructs a program to jump to a certain label\
    \ in your code. In the above example, the label is MainBlock.\n\n# User-Defined\
    \ Exceptions\n\nIn C#, you can create your own exceptions. These are called user\
    \ generated exceptions or custom exceptions. And they use the throw keyword we\
    \ already talked about. Study this example:\n\n```csharp\nnamespace userDefinedException\n\
    {\nclass Program\n{\nstatic void Main(string[] args)\n{}\n```\n\n```csharp\nint\
    \ maxR;\nConsole.WriteLine(\"Please rate the last movie you just watched. The\
    \ rating goes from 1 (very\nbad) to 5 (very exciting).\\nmaxR = Convert.ToInt32(Console.ReadLine());\n\
    try\n{\n    if (maxR <= 5)\n    {\n        Console.WriteLine(\"You have given\
    \ a rating of {0}. Thank you for your input!\", maxR);\n        Console.ReadLine();\n\
    \    }\n    else\n    {\n        throw (new wrongR(\"Wrong Rating Exception: This\
    \ rating is not valid.\"));\n    }\n}\ncatch (wrongR oex)\n{\n    Console.WriteLine(oex.Message.ToString());\n\
    \    Console.ReadLine();\n}\n\n//This code creates a custom exception called wrongR\n\
    public class wrongR : Exception\n{\n    public wrongR(string message)\n    : base(message)\n\
    }\n```\n\nIf you enter 1 to 5 after running the program as it recommends, the\
    \ custom exception will not be\nexecuted. However, if you enter a rating that's\
    \ above 5, the program will bring an error.\n\n# Chapter 10: Inheritance\n\nThis\
    \ is one of the most important concepts in C#. And you can bet that you will be\
    \ using it a lot. With this, you can make a class inherit the properties of another\
    \ class. This will save you time you would have spent coding functions you already\
    \ have. Your code will be reusable and programs will be simple and efficient to\
    \ run.\n\nThe base class, which you can think of as the parent, defines the properties.\
    \ The derived class, also called the child class, borrows those properties.\n\n\
    Here is the syntax:\n\n```csharp\naccessSpecifier class baseClass\n{\n    Statements\n\
    }\n```\n\n```csharp\nclass derivedClass : baseClass\n{\n    Statements\n}\n```\n\
    \nIn the derived class, start with the keyword class. Then write the class name\
    \ followed by a colon and then the name of the base class. The colon tells the\
    \ program to inherit properties from the base class. Let's look at an example:\n\
    \n```csharp\nnamespace Inheritance_Example\n{\n    class Program\n    {\n    \
    \    static void Main(string[] args)\n        {\n            Eagle b1 = new Eagle();\n\
    \            b1.EagleInfo();\n\n            Owl b2 = new Owl();\n            b2.OwlInfo();\n\
    \n            Chicken b3 = new Chicken();\n            b3.ChickenInfo();\n\n \
    \           Console.ReadKey();\n        }\n    }\n}\n//This is the base class\n\
    ```\n\n```csharp\nclass Bird\n{\n    protected void BirdInfo()\n    {\n      \
    \  Console.WriteLine(\"It has a pair of wings and a pair of feet.\");\n      \
    \  Console.ReadLine();\n    }\n}\n```\n\n```csharp\n//This is the first derived\
    \ class\nclass Eagle : Bird\n{\n    public void EagleInfo()\n    {\n        Console.WriteLine(\"\
    This is an Eagle, a bird.\");\n        BirdInfo();\n    }\n}\n```\n\n```csharp\n\
    //This is the second derived class\nclass Owl : Bird\n{\n    public void OwlInfo()\n\
    \    {\n        Console.WriteLine(\"This is an Owl, a bird.\");\n        BirdInfo();\n\
    \    }\n}\n```\n\n```csharp\n//This is the third derived class\nclass Chicken\
    \ : Bird\n{\n    public void ChickenInfo()\n    {\n        Console.WriteLine(\"\
    This is a chicken, a bird.\");\n        BirdInfo();\n    }\n}\n```\n\nChicken,\
    \ owl, and eagle are all birds. And we know that they have wings and feet. So\
    \ of writing in each of the derived classes that each of these birds has wings\
    \ and feet, we can simply create a base class that contains these common features.\
    \ Each derived class will then inherit those common features and also add its\
    \ own, which in this case, is the line that tells us type of bird we are looking\
    \ at.\n\nKnow that any class can become a base: for example, if I want to make\
    \ chicken the base and owl the derived class, I can write the code this way:\n\
    \n```csharp\nclass Owl : Chicken\n```\n\n# Conclusion\n\nThank you for reading\
    \ the book, I hope it has helped you learn how to get started coding in C#. By\
    \ now, I'm sure you can create simple console programs.\n\nHowever, this is not\
    \ the end: you should keep practicing. Come up with program ideas you can code.\
    \ In addition, take time to study code written by other people. It also helps\
    \ to think of complex programs you already know and try to build them. Experimenting\
    \ is one of the best ways to improve your coding abilities.\n\nIf you stumble\
    \ on something, which will happen a lot as you are just getting started, let the\
    \ internet be your best friend. There are lots of forums that offer coding advice.\n\
    \nGetting good at coding takes time and hard work. I wish you good luck as you\
    \ develop as a programmer.\n"
  mdcn: "\n\n# 第 9 章：异常处理\n\n异常是发生在运行时的错误。这里有一个常见的例子：假设你创建了一个程序，它在对用户输入的两个数字进行除法后返回结果。现在想象一种情况，用户在另一个数字输入了\
    \ 0。这将导致错误导致程序崩溃。异常处理的作用就是防止这种情况的发生。如果你使用了它，程序将显示有关错误的消息并继续运行。\n\n要使用异常处理，你需要三个重要的代码块：**try,\
