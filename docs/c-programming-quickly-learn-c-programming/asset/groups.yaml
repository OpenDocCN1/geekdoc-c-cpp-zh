    string[], couples = new string[3, 2] {"John","Loyce"},{"James","Linda"},{"Vincent","Mary"};


    # Accessing Arrays


    To access an element in an array, use the index. For example, if I want to access
    the element at index 1, I

    need to put it in square brackets just after the array name. Here is an example:


    ```

    static void Main(string[]) args

