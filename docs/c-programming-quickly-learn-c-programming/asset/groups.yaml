    - catch：这是另一个关键字。它在 try 抛出异常后处理该异常。\n- finally：无论是否发生异常，此代码块都会执行。\n- throw：另一个关键字，用于添加用户定义的异常消息。\n\
    \n让我们来看一个例子：\n\n```csharp\nstatic void Main(string[] args)\n{\n  int num1,num2;\n\
