    \ void Main(string[]) args\n{\n    Console.WriteLine(\"Choose a color: blue, green,\
    \ red, or orange.\");\n    string color = Console.ReadLine();\n    switch (color.ToLower())\n\
    {\n        case \"blue\":\n        case \"green\":\n        case \"red\":\n  \
