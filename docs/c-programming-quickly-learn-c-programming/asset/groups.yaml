    \  Console.WriteLine(\"Enter the second Number: \");\n  num2 = Convert.ToInt32(Console.ReadLine());\n\
    }\n```\n\n```csharp\nresult = (decimal)num1 / (decimal)num2;\nConsole.WriteLine(\"\
    The answer is \" + result.ToString());\nConsole.ReadLine();\n```\n\n将这段代码复制到编辑器中运行程序。第一次运行时，输入\
    \ 4 作为第一个数字，输入 2 作为第二个数字。正如你所看到的，你应该没有遇到问题。关闭控制台再次运行程序。这次，输入任意数字和 0。\n\n程序将会崩溃，在用户眼中损害了我们的编码能力。坦率地说，我们有异常处理。这里有一段可以让我们免于尴尬的代码：\n\
    \n```csharp\nstatic void Main(string[] args)\n{\nMainBlock:\n//This is the try\
