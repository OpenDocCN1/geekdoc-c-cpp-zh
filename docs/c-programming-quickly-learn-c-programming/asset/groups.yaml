  - "[PAGE 22]\n\n# Chapter 6: Loops\n\nYou may want to repeat a part of your code\
    \ several times. This means you would have to rewrite that code as many times\
    \ as you want it repeated. However, that is inefficient. You can easily get around\
    \ this problem with loops. Let's discuss the different types you have at your\
    \ disposal.\n\n# The Simplest of all loops\n\nThis is the simplest of all loops.\
    \ It executes your code as long as a condition you have specified in the while\
    \ statement stays true. This means that if the condition evaluates true, the code\
    \ block of the while statement will be executed. The program will recheck the\
    \ condition, if it is still true, it will re-execute the code of the while statement.\
    \ This will go on until the condition evaluates to false. After this, the program\
    \ will move on to the next line in your code. Here is an example:\n\n```\nstatic\
    \ void Main(string[]) args\n{\n    int x = 0;\n\n    while (x < 5)\n    {\n  \
    \      Console.WriteLine(\"The value of x is {0}\", + x);\n        x++;\n    }\n\
    \n    Console.ReadLine();\n}\n```\n\nOutput:\n\nThe value of x is 0\nThe value\
    \ of x is 1\nThe value of x is 2\nThe value of x is 3\nThe value of x is 4\n\n\
    In the above example, the while statement has been designed to check the value\
    \ of x. If x is less than 5, its value should be printed on screen. x++ tells\
    \ our program to look at the value of x at any given time and add 1 to it. You\
    \ can alternatively write this as x = x + 1.\n\nIn the first instance the while\
    \ statement is run, x is equal to 0. Being less than 5, 0 is printed on screen.\
    \ The program then returns to the while statement and equals x. This time, x is\
    \ 1. So it is printed on"
  - "[PAGE 23]\n\nscreen. This goes until x becomes 5, which makes the while statement\
    \ return False. So the code block\nof the while statement is not executed and\
    \ the program moves to the next line (Console.ReadLine()).\n\nYou might have noticed\
    \ {0} inside the statement that prints the value of x on screen. The zero is a\n\
    placeholder. And it represents the variable x, which is on position zero at the\
    \ end of that statement.\n\n# Do...While Loop\n\nThis is the same as while loop.\
    \ The only difference is that in the Do...While loop, the code block is\nexecuted\
    \ first and the condition is checked later. So your code gets executed at least\
    \ once. Here is an\nexample:\n\n```\nstatic void Main(string[]) args\n{\n    int\
    \ x = 0;\n\ndo{\n        Console.WriteLine(\"The value of x is {0}\", x);\n  \
    \      x++;\n    }while (x < 6);\n    Console.ReadLine();\n}\n```\n\nTry changing\
    \ the value of x to 7 and observe what happens.\n\n# For Loop\n\nThis is one of\
    \ the most popular loops you can use. And it repeats your code for a specific\
    \ number of\ntimes. Here is its syntax:\n\n```\nfor (initialize value; state condition;\
    \ state increment/decrement)\n{\n    statement(s);\n}\n```\n\nHere is an example\
    \ you can try:\n\n```\nstatic void Main(string[]) args\n{\n    for (int x = 0;\
    \ x < 5; x++)\n    {\n        Console.WriteLine(\"Value of x: {0}\", x);\n   \
    \ }\n    Console.ReadLine();\n}\n```\n\nOutput:"
