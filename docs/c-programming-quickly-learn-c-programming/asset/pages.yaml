  md: '# Chapter 4: Operators


    Operators instruct a compiler to perform a specific operation. For example, in
    the expression 5 – 3, the minus sign is the operator while 5 and 3 are operands.
    This expression tells the compiler to subtract 3 from 5.


    Below, we will look at the different types of operators available in C#.


    # 1. Assignment Operators


    Here is a list of assignment operators you can use in C#:


    | Operator | Explanation | Example |

    | --- | --- | --- |

    | = | The equals assigns a value to a variable. | a = 7<br>b = x - y<br>c = "Chris"
    |

    | += | This is ADD AND. It adds the left operand to the right operand and makes
    the result of the left operand. | a += b means a = a + b |

    | -= | This is Subtract AND. And it subtracts the right operand from the left
    operand to make the result the left operand. | a -= b means a = a - b |

    | *= | Represents Multiply AND. It multiplies the left operand by the one on the
    right and places the result as the left operand. | a *= b means a = a * b |

    | /= | This represents DIVIDE AND. And it divides the left operand by the one
    on the right. The result becomes the left operand. | a /= b means a = a / b |

    | %= | This is Modulus AND. It performs the Modulo on the left and right operands
    and makes the result the left operand. | a %= b means a = a % b |

    | << | This is Left Shift AND. | a << b means a = a << b |

    | >>= | And this is Right Shift AND. | a >>= b means a = a >> b |'
  merge: -1
