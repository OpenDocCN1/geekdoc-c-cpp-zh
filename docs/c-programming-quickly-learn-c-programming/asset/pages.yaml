  md: '# Chapter 1: C# 101


    C#, pronounced as “C sharp,” is a general purpose object-oriented programming
    language. Some of its strengths are that it is easy to learn, creates efficient
    programs, and can be compiled on a number of systems. It is part of the .Net framework.
    And for this reason, some refer to it as the .Net language. C# was developed by
    Microsoft, thanks to one Anders Helsberg.


    With the name sounding like C and C++, you would expect C# to resemble those two
    aforementioned languages. And that is the case. But C# goes on to mimic most of
    what Java has to offer.


    If you already have an understanding of C or C++, C# will prove to be easy.

    With C#, you have freedom to create programs that C, C++, Java, and other high-level
    programming languages can produce. You can create games, Windows applications,
    web applications, and apps for iOS and Android.


    # Setting Up the Right Environment


    In order to create C# programs, you need to have the right tools. Your computer
    is the most important tool in this environment. But you will also need other things
    on the software side.


    .Net Framework

    I already said that C# is part of the .Net Framework. As such, your computer needs
    this in order to execute C# code. If you are on a Windows computer, then you probably
    already have the .Net Framework.


    Integrated Development Environment (IDE)


    Microsoft offers Visual Studio (VS) as the IDE for creating C# applications and
    other languages like C++. With VS, you can create just about any kind of application
    you can imagine. VS can be downloaded from the Microsoft website for free.


    C# on Mac OS and Linux'
