  md: "# Chapter 9: Exception Handling\n\nAn exception is an error that occurs at\
    \ runtime. Here is a popular example: assume you've created a program that returns\
    \ a result after dividing two numbers that have to be entered by the user. Now\
    \ imagine a situation where a user enters 0 as the other number. This will cause\
    \ an error and the program will crash. Exception handling comes in to keep this\
    \ from happening. If you employ it, the program will display a message about the\
    \ error and continue running.\n\nTo use exception handling, you need three important\
    \ blocks of code: **try, catch, and finally**. But you may also add a fourth called\
    \ **throw**:\n\n+   - try: this is a keyword. And it identifies a block of code\
    \ which may cause an exception.\n- catch: this is also another keyword. And it\
    \ handles the exception after try has raised it.\n- finally: this block of code\
    \ is executed whether there is an exception or not.\n- throw: another keyword\
    \ used to add user defined exception messages.\n\nLet's look at an example:\n\n\
    ```\nstatic void Main(string[] args)\n{\n  int num1,num2;\n  decimal result;\n\
    \n  Console.WriteLine(\"This program divides two numbers\");\n  Console.WriteLine(\"\
    Enter the first Number: \");\n  num1 = Convert.ToInt32(Console.ReadLine());\n\
    \  Console.WriteLine(\"Enter the second Number: \");\n  num2 = Convert.ToInt32(Console.ReadLine());\n\
    }\n```\n\n```\nresult = (decimal)num1 / (decimal)num2;\nConsole.WriteLine(\"The\
    \ answer is \" + result.ToString());\nConsole.ReadLine();\n```\n\nCopy this code\
    \ into the editor and run the program. On your first run, input 4 as the first\
    \ number and 2 as the second number. As you will see, you should have no troubles.\
    \ Close the console and run the program again. This, enter any number and 0.\n\
    \nThe program will crash, staining our coding abilities in the eyes of our users.\
    \ Frankly, we have exception handling. Here is a code that can save us from the\
    \ embarrassment:\n\n```\nstatic void Main(string[] args)\n{\nMainBlock:\n//This\
    \ is the try block\ntry\n```"
