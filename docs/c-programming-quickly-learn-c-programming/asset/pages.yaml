  md: "# Chapter 10: Inheritance\n\nThis is one of the most important concepts in\
    \ C#. And you can bet that you will be using it a lot. With this, you can make\
    \ a class inherit the properties of another class. This will save you time you\
    \ would have spent coding functions you already have. Your code will be reusable\
    \ and programs will be simple and efficient to run.\n\nThe base class, which you\
    \ can think of as the parent, defines the properties. The derived class, also\
    \ called the child class, borrows those properties.\n\nHere is the syntax:\n\n\
    ```\naccessSpecifier class baseClass\n{\n    Statements\n}\n```\n\n```\nclass\
    \ derivedClass : baseClass\n{\n    Statements\n}\n```\n\nIn the derived class,\
    \ start with the keyword class. Then write the class name followed by a colon\
    \ and then the name of the base class. The colon tells the program to inherit\
    \ properties from the base class. Let's look at an example:\n\n```\nnamespace\
    \ Inheritance_Example\n{\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            Eagle b1 = new Eagle();\n            b1.EagleInfo();\n\
    \n            Owl b2 = new Owl();\n            b2.OwlInfo();\n\n            Chicken\
    \ b3 = new Chicken();\n            b3.ChickenInfo();\n\n            Console.ReadKey();\n\
    \        }\n    }\n}\n//This is the base class\n```"
  merge: -1
  pgno: 38
- img_proc: true
  md: "```\nclass Bird\n{\n    protected void BirdInfo()\n    {\n        Console.WriteLine(\"\
    It has a pair of wings and a pair of feet.\");\n        Console.ReadLine();\n\
    \    }\n}\n```\n\n```\n//This is the first derived class\nclass Eagle : Bird\n\
    {\n    public void EagleInfo()\n    {\n        Console.WriteLine(\"This is an\
    \ Eagle, a bird.\");\n        BirdInfo();\n    }\n}\n```\n\n```\n//This is the\
    \ second derived class\nclass Owl : Bird\n{\n    public void OwlInfo()\n    {\n\
    \        Console.WriteLine(\"This is an Owl, a bird.\");\n        BirdInfo();\n\
    \    }\n}\n```\n\n```\n//This is the third derived class\nclass Chicken : Bird\n\
    {\n    public void ChickenInfo()\n    {\n        Console.WriteLine(\"This is a\
    \ chicken, a bird.\");\n        BirdInfo();\n    }\n}\n```\n\nChicken, owl, and\
    \ eagle are all birds. And we know that they have wings and feet. So of writing\
    \ in each of the derived classes that each of these birds has wings and feet,\
    \ we can simply create a base class that contains these common features. Each\
    \ derived class will then inherit those common features and also add its own,\
    \ which in this case, is the line that tells us the type of bird we are looking\
    \ at."
