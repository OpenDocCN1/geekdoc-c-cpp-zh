    # Explanation


    ```

    using System;

    using System.Collections.Generic;

    using System.Linq;

    using System.Text;

    ```


    **using** is a keyword employed to import a namespace. In this case, it imports
    the System namespace and other sub-namespaces of System.


    Now may you ask, what is a namespace? This refers to a construct that is used
    to organize code. Code that is similar in functionality is grouped together, ensuring
    that there is no conflict. The most important namespace is **System**.


    ```

    namespace ConsoleApplication1

    ```


    This line contains the namespace declaration, which in this case **ConsoleApplication1**.


    ```

    class Program

    ```


    **class** is another keyword that introduces the class declaration. After the
    class keyword, you can then write the class name, which in this case is **Program**.
    Every program in C# needs at least one class. A class contains data and methods
    for your program.


    Code contained in a class must be enclosed in curly brackets.


    ```

    static void Main(string[]) args

    ```


    This is the entry point of this program, meaning this is the first piece of code
    the program will execute.

    static means that the method can be accessed without an instance of the class.
    **Void** means what the method will return, which in this case is nothing. Every
    program must contain a method called **Main**; otherwise, the program will not
    run.


    ```

    // my first program in C#

    ```


    This is a comment. The compiler will ignore it. Comments can help you remember
    what your code does if you forget. And they will tell others what you intend to
    achieve with your code. The double slash at the beginning the comment is limited
    to one line. If you have a comment that takes several lines, write your comment
    inside the slashes (comments spanning several lines need to be formatted with
    star*/).


    ```

    Console.WriteLine("Hello, World!");

    ```'
