  md: 'This chapter made it clear before you declare a variable, you must specify
    its data type:

    data_type variable_name;


    From the examples above, you might have noticed string and int. But these are
    not the only data types.

    Let''s look at the most popular ones in detail:


    string: this is used for storing text. You can take Hello World as an example.
    When working with\strings, be sure to place them in quotes.


    char: single unicode character.


    int: for storing numbers. As such, you can use it to store whole numbers. Some
    examples are 5, 10, and 1003.

    float: this represents 32-bit single-precision floating point type. Its range
    is -3.402823e38 to

    3.402823e38.


    double: this is 64-bit double-precision floating point type. And its range is
    -1.797693134862332e-308 to

    1.797693134862332e-308


    decimal: this stands for 128-bit decimal values from 28 to 29 significant figures.

    byte: this indicates an 8-bit unsigned integer. Its range is 0 to 255.


    byte: this represents an 8-bit signed integer. The range is -128 to 127.

    uint: stands for a 32-bit signed integer and has a range of 0 to 4294967295.

    short: means a 16-bit signed integer. The range is -32,768 to 32,767.


    long: represents a 64-bit signed integer.

    ulong: indicates a 64-bit unsigned integer.

    bool: the simplest data type in C#. Its range consists of 2 values which are True
    and False. You will use

    it when writing logical expressions.

    DateTime: use to indicate date and time.


    If a value to a variable is not in accordance with the specified data type, the
    compiler will show

    an error message. Try the following example:


    ```

    int x = 1;

    Console.WriteLine(x);

    Console.ReadLine();

    ```


    Now try this wrong example:


    ```

    int x = "Program";

    Console.WriteLine(x);

    Console.ReadLine();

    ```


    Remember, int can only take whole numbers; Program is a string.'
