  md: "# Calling a Method\n\nThe above method (sampleMethod()) can be called from\
    \ another method. Here is an example:\nusing System;\n\n```\nclass Program {\n\
    \    static void Main() {\n        Console.WriteLine(\"This is the main method.\"\
    );\n        sampleMethod();\n        Console.ReadLine();\n    }\n\n    public\
    \ static void sampleMethod() {\n        Console.WriteLine(\"My sample method has\
    \ been called.\");\n    }\n```\n\nWhen the program executes the Main method, it\
    \ will first display \"This is the main method.\" The next line, however, tells\
    \ it to execute sampleMethod(). So the program will leave Main() and go to sampleMethod().\
    \ After it is done with, it will go back to Main to execute Console.ReadLine().\n\
    \nYou might have noticed that I have added static in the sampleMethod. That's\
    \ because I cannot call a non-static Method into a static one.\n\n# Popular Statements\n\
    \nThe Return Statement\nMethods can be coded to return values into other methods.\
    \ Consider the below example:\n\n```\nnamespace ConsoleApplication {\nclass Addition\
    \ {\n    static void Main() {\n        addInt(10, 30);\n    }\n\n    static void\
    \ addInt(int a, int b) {\n        int c = a + b;\n        Console.WriteLine(\"\
    Adding {0} and {1} brings {2} as the answer.\", a, b, c);\n    }\\}\n```"
