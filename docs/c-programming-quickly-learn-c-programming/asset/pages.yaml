  md: '# 4. Relational Operators


    These operators are used to check if two operands involved in an expression are
    true or false. The table below shows the relational operators you can use in C#
    (a = 4, b = 10):


    | Operator | Explanation | Example |

    | --- | --- | --- |

    | == | This evaluates if the operands on either side of the operator are equal.
    If they are, it returns True. | a == b is false |

    | != | This means not equal to. It returns True if the operands on either side
    of the operator are not equal. | a != b is true |

    | < | This is less than. And it returns True if the operand on the left is less
    than that on the right. | a < b is true |

    | > | This is greater than. And it checks if the left operand is greater than
    that on the right. And if it is, it returns True. | b > a is true |

    | <= | This operator is called less or equal to. And it checks if the left operand
    is less than or equal to the right operand. If it is, it returns True. | a <=
    b is true |

    | >= | This is greater than or equal to. And it returns true if the left operand
    is greater or equal to the right operand. | b >= a is true |'
