  md: '# Introduction


    It’s fascinating to see how numbers, letters, and symbols come together to power
    our computers. If you have always had an an idea for a computer program, now is
    your time to learn to code. With C#, your dreams of becoming a programmer can
    become true. And they can do so without frustration as C# is easy to understand.


    In this book, you will learn the basics of coding in C#. The book has been written
    in a way to be understood by even those with zero programming skills. If you have
    always thought that coding was difficult, this book will prove you wrong. Inside,
    there are lots of examples to deepen your understanding. And by the time you hit
    the last page, you should be able to create simple C# programs.


    With that, we can get started. If you haven’t already, fire up your computer.
    And if you don’t understand some things at the beginning of the book, just keep
    going—things will make sense the further you go.'
