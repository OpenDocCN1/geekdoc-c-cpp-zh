    ```c\n#include <stdio.h>\n\nmain (void)\n{\n    char a = 127, b = -128;\n\n  \
    \  printf(\"%5d %5d %5d\\n\", a, a + 1, @);\n    printf(\"%5d %5d %5d\\n\", a,\
    \ a += 1, b, a);\n    return 0;\n}\n```\n```\n\nOutput:\n127 128 -128\n127 -128\
    \ -128 -128\n\nC doesn't specify the order in which function parameters are processed.\
    \ So, some C compilers might look at the first parameter first and therefore change\
    \ the value of parameters that might reference a parameter. A good rule to follow\
    \ is to not have an expression in a parameter that might change the value of a\
    \ parameter.\n\n```\n```c\nvoid timeUpdate(int *hour, int *min, int *sec)\n{\n\
    \    *sec++;\n    if (*sec == 60) {\n        *sec = 0;\n        *min++;\n    \
    \    if (*min == 60) {\n            *min = 0;\n            *hour++;\n        \
    \    if (*hour == 24)\n                *hour = 0;\n        }\n    }\n}\n```\n\
