- pgno: 315
  md: "# Pointer Parameters in Functions\n\nExcept when passing arrays. C functions\
    \ are always called by passing the value of each argument (actual parameters)\
    \ to the function. Any change made to these arguments in the function (formal\
    \ parameters) are not reflected back to the calling environment. Therefore the\
    \ stored value of those arguments in the calling environment cannot be changed\
    \ by the function. This is referred to as pass by value. For example:\n\n```\n\
    // value.c\n#include <stdio.h>\nvoid modify(int x) {\n    x = 10;\n}\nint main()\
    \ {\n    int value = 5;\n    printf(\"Value = %d\\n\", value);\n    modify(value);\n\
    \    printf(\"Value = %d\\n\", value);\n    return 0;\n}\n```\n\nThe output of\
    \ this program is:\n\n```\nValue = 5\nValue = 5\n```\n\nThis indicates that pass\
    \ by value does not allow the actual parameter to be modified."
  merge: -1
  img_proc: true
- pgno: 316
  md: "To simulate pass by reference, we can use pointers to pass the address of any\
    \ data item to a function. When dealing with pointers sent to functions, the value\
    \ of the pointer (i.e., the address of the actual parameter) is copied into the\
    \ formal parameter when the function is called. By dereferencing the pointer within\
    \ the function, we can access and modify the data (actual parameter) that it points\
    \ to.\n\nFor example:\n\n```\n```c\n// swap.c\n#include <stdio.h>\n\nvoid swap(int\
    \ *x, int *y)\n{\n    int temp;\n    temp = *x;\n    *x = *y;\n    *y = temp;\n\
    }\n\nint main(void)\n{\n    int a = 5;\n    int b = 10;\n    printf(\"a = %d b\
    \ = %d\", a, b);\n    swap(&a, &b);\n    printf(\"a = %d b = %d\", a, b);\n}\n\
    ```\n```\n\nThe output to this program is:\n\n```\na = 5 b = 10\na = 5 b = 10\n\
    a = 10 b = 5\na = 10 b = 5\n```"
