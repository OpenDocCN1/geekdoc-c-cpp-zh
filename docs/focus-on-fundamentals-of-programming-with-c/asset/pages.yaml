    \ and third derivative of a polynomial.\n\n+   • Write a function that will multiply\
    \ a polynomial by a scalar.\n\n+   • Write a function that, given a polynomial\
    \ and an integer, evaluates the polynomial at that integer.\n\n+   • Write a function\
    \ that will print a polynomial as a sequence of coefficients and exponents, arranged\
    \ attractively."
