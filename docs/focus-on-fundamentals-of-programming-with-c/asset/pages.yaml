- pgno: 90
  md: '# Character Type Tests


    Character-type tests occur frequently enough in programming that they have been
    incorporated into the standard C library in a header file called ctype.h. Use
    of this file allows us to say:


    ```

    if (isdigit(c))

    ```


    instead of


    ```

    if (c >= ''0'' && c <= ''9'')

    ```


    or


    ```

    if (isupper(c))

    ```


    instead of


    ```

    if (c >= ''A'' && c <= ''Z'')

    ```


    To use the ctype.h header file that would allow us to access this library, we
    issue the following preprocessor command:


    ```

    #include <ctype.h>

    ```


    This line is a command to the C preprocessor to include some standard definitions
    into our compilation so that names such as isdigit() and isupper() will be recognized.'
  merge: -1
  img_proc: true
