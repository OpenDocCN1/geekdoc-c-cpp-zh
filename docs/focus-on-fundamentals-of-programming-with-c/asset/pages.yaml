  md: "# Parallel Arrays\n\nArrays are very useful as they allow us to group together\
    \ large amounts of data under a single name. However, one of the drawbacks of\
    \ arrays is that the elements of the array are homogeneous, that is, each element\
    \ of the array must be of the same data type, int, char, float, double, etc.\n\
    \nBut what if we need to group together large amounts of information composed\
    \ of different data types? For example, suppose we want to keep track of student\
    \ names, grade point averages, and years of graduation. While we are unable to\
    \ store all of this different information within a single array, we could declare\
    \ three separate arrays with each array holding the information of the same data\
    \ type (char * for name, double for grade point average, and int for year of graduation).\n\
    \nTo ensure that we can easily access the different data for a specific student,\
    \ each student's data will be stored within the arrays at the same index location.\
    \ For example, if we declare an array of char * called name to hold each student's\
    \ name, and an array of double called gpa to store each student's grade point\
    \ average, and an array of int called year to store each student's year of graduation,\
    \ then array locations name[2], gpa[2], and year[2] will each hold data for the\
    \ same student. These arrays are referred to as parallel arrays.\n\nThe code below\
    \ create three parallel arrays with the same location within each array referring\
    \ to the same student.\n\n```\n#include <stdio.h>\n\n#define MAX 5\n\nint main(void)\
    \ {\n   char *name[MAX] = {\"Bill\", \"Carol\", \"Sue\", \"Ted\", \"Jen\"};\n\
    \   double gpa[MAX] = { 3.75, 3.44, 3.95, 3.88, 2.95 };\n   int year[MAX] = {\
    \ 2014, 2016, 2015, 2014, 2018 };\n\n   printf(\"%-10s %-10s %-10s\\n\", \"Name\"\
    , \"GPA\", \"Year\");\n   printf(\"%-10s %-10s %-10s\\n\", \"----\", \"---\",\
    \ \"----\");\n\n   for (int i = 0; i < MAX; i++) {\n      printf(\"%-10s %-10.2f\
    \ %-10d\\n\", name[i], gpa[i], year[i]);\n   }\n\n   return 0;\n}\n```"
