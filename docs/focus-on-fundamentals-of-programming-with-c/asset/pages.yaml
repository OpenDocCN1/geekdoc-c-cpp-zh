- pgno: 66
  md: '# Program Errors


    There are three basic types of programming errors: syntax errors, semantic (logic)
    errors, and run-time errors.


    # Syntactic Errors


    Syntax errors are errors in the programming language syntax. They are errors made
    with the "grammatical rules" of C and are diagnosed by the compiler at compile
    time. For example, the following code fragment is not syntactically correct. Can
    you see what the problem is?


    ```

    printf ("Enter the distance traveled in miles > );

    ```


    The program will not compile successfully until all syntax errors have been corrected.
    The following code fragment has been corrected and is now syntactically correct.


    ```

    printf ("Enter the distance traveled in miles > ⊗);

    ```


    # Semantic (Logic) Errors


    Semantic or logic errors are errors in the meaning or implementation of the program.
    The program may compile and run successfully but the results may be incorrect.
    The following code fragment is not semantically correct as the formula for calculating
    kilometers is incorrect. Can you see why?


    ```

    kilometers = miles / 1.609;

    ```


    You should be multiplying miles by 1.609, not dividing. The following code fragment
    has been corrected and is now semantically correct.


    ```

    kilometers = miles ⊗ 1.609;

    ```'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'The only way you can locate errors such as these is to use carefully constructed
    tests to verify that the program is semantically correct. But you have to know
    what answers are expected for each test case, or you have no way of evaluating
    each test.


    # Run-Time Errors


    Run-time errors are errors that occur when the computer attempts to perform an
    illegal operation or instruction. The program may compile and run but, due to
    a run-time error, might stop unexpectedly or "crash."


    For example, if the user enters a value of 0 for milesPerGallon:


    ```

    gasolineUsed = miles / milesPerGallon;

    ```


    the resulting calculation would attempt to divide the number of miles traveled
    by 0. Dividing a number by zero is mathematically undefined and is an illegal
    operation on the computer. It will cause your program to terminate (we sometimes
    say "crash", or abort) with a run-time "divide by 0 error."


    # Program Testing


    Program testing can be used to verify that the program does not produce run-time
    errors. The goal is to test the program for several representative cases and ensure
    that the appropriate output is generated in each case.


    First calculate the results you expect the program to produce for each of the
    test cases. Then compare the results you expect to see with the actual results
    that the program produces to verify that the program is working correctly. If
    the results that the program produces do not match the results you expect to see,
    then you must "debug" the program to find where the program code is incorrect.


    You should always verify that you are using the proper variables in your formulas
    and output statements and that the variables you are using have the correct values
    when used in formulas and output statements. In particular, you always need to
    check to ensure you have entered correct values for a variable before trying to
    use the variable in a calculation. Also be sure you are using the correct units
    in your computations as well.'
