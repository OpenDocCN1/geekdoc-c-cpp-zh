  md: "If the `fileName` cannot be opened for any reason, then the pointer value NULL\
    \ will be returned. We can test this variable against the defined value NULL:\n\
    \n```\nFILE *fp;\n\nfp = fopen(\"infile.txt\", \"r\");\nif (fp == NULL) {\n  \
    \  printf(\"File could not be opened.\\n\");\n    exit(1);\n}\n```\n\nThis will\
    \ tell us if the open was successful or not. Note that `exit(1)` is a function\
    \ that requires the `#include <stdio.h>` header file and will cause the program\
    \ to abort.\n\nWe can actually combine the `fopen()` call, the assignment of the\
    \ returned FILE pointer variable, and the test against the NULL pointer, into\
    \ a single expression:\n\n```\nFILE *fp;\n\nif ((fp = fopen(\"infile.txt\", \"\
    r\")) == NULL) {\n    printf(\"File could not be opened.\\n\");\n    exit(1);\n\
    }\n```\n\nOr we can say even more concisely:\n\n```\nFILE *fp;\n\nif (!(fp = fopen(\"\
    infile.txt\", \"r\"))) {\n    printf(\"File could not be opened.\\n\");\n    exit(1);\n\
    }\n```\n\nThe `fclose()` command can be used to disconnect a file pointer from\
    \ a file. This is usually done so that the pointer can be used to access a different\
    \ file. Systems have a limit on the number of files that can be open simultaneously,\
    \ so it is a good idea to close a file when you have finished using it."
