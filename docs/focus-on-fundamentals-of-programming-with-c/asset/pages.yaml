- pgno: 308
  md: 'Consider what would happen if the leftmost bit were changed during transmission.
    The received codeword would be 00100000101 instead of 10100000101. The four parity
    bits will be checked by the receiving computer with the result:


    ```

    parity bit 1 incorrect: bits 1, 3, 5, 7, 9, and 11 contain three 1''s

    parity bit 2 correct: bits 2, 3, 6, 7, 10, and 11 contain two 1''s

    parity bit 4 correct: bits 4, 5, 6, and 7 contain no 1''s

    parity bit 8 correct: bits 8, 9, 10, 11 contain two 1''s

    ```


    The total number of 1''s in bits 1, 3, 5, 7, 9, and 11 should be an even number
    because even parity is being used. The incorrect bit must be one of the bits checked
    by parity bit 1, namely, bits 1, 3, 5, 7, 9, or 11. Because parity bit 2 is correct,
    we know that bits 2, 3, 6, 7, 10, and 11 are correct. So the error was not in
    bits 3, 7, or 11. That leaves bits 1, 5, and 9. Parity bit 4 is correct, meaning
    that bits 4, 5, 6, and 7 contain no errors. That narrows the choice down to 1
    or 9. Parity bit 8 is also correct, so bit 9 is correct. Consequently, the incorrect
    bit must be bit 1. Because it was received as a 1, it must have been transmitted
    as a 0. In this manner, errors can be both detected and corrected.


    A simple method for determining whether there was a transmission error and, if
    so, for finding the incorrect bit, is to first re-compute all the parity bits
    in the received character. If all are correct, there was no error (or possibly
    more than one error, a burst error). If, on the other hand, one or more of the
    parity bits are incorrect, a transmission error did occur and we must locate and
    invert the incorrect bit. To accomplish this, we add up all the incorrect parity
    bits, counting 1 for bit 1, 2 for bit 2, 4 for bit 4, etc. The resulting sum is
    the position of the incorrect bit. For example, if parity bits 1 and 8 are correct,
    but 2 and 4 are incorrect, then bit 6 (2 + 4) has been accidentally changed. We
    can then simply invert it back to the intended value.


    # A Simple Algorithm Follows


    When a codeword arrives, the receiver initializes a counter to zero. It then examines
    each check bit, K (K = 1, 2, 4, 8) to see if it has the correct parity. If not,
    it adds K to the counter. If the counter is zero after all the check bits have
    been examined (i.e., if they were all correct), the character is accepted as valid.
    If the counter is non-zero, it contains the number of the incorrect bit that should
    then be inverted. For example, if check bits 1, 2, and 8 are in error, the inverted
    bit is 11, because it is the only one checked by bits 1, 2, and 8.'
  merge: -1
  img_proc: true
- pgno: 309
  md: '# Burst Errors


    Hamming Codes can only correct single errors. However, there is a trick that can
    be used to permit Hamming Codes to correct burst errors. A sequence of R consecutive
    codewords are arranged as a matrix, one codeword per row. Below is the matrix
    format for the message "HELLO" before transmission with parity bits set for even
    parity.


    | H | 1 | 1 | 1 | 1 | 0 | 0 | 1 | 1 | 0 | 0 | 0 |

    |---|---|---|---|---|---|---|---|---|---|---|---|

    | E | 1 | 0 | 1 | 0 | 0 | 0 | 0 | 0 | 1 | 0 | 1 |

    | L | 1 | 0 | 1 | 1 | 0 | 0 | 1 | 1 | 1 | 0 | 0 |

    | L | 1 | 0 | 1 | 1 | 0 | 0 | 1 | 1 | 1 | 0 | 0 |

    | O | 0 | 0 | 1 | 1 | 0 | 0 | 1 | 1 | 1 | 1 | 1 |

    |   | p | a | r | i | t | y | b | i | t | s |   |


    Normally the data would be transmitted one codeword at a time, from left to right.
    However, to correct burst errors, the data is transmitted one column at a time,
    starting with the leftmost column. When all R bits in the first column have been
    sent, the second column is sent, etc. When the message arrives at the receiver,
    the matrix is reconstructed, one column at a time. If burst errors of length R
    occurs, 1 bit in each of the R codewords will have been affected. Below is the
    reconstructed matrix containing a 5-bit burst error. A '' B '' represents the
    location of the burst errors.


    | 1 | 1 | 1 | 1 | 0 | 0 | 1 | B | 0 | 0 | 0 |

    |---|---|---|---|---|---|---|---|---|---|---|

    | 1 | 0 | 1 | 0 | 0 | 0 | 0 | B | 1 | 0 | 1 |

    | 1 | 0 | 1 | 1 | 0 | 0 | B | 1 | 1 | 0 | 0 |

    | 1 | 0 | 1 | 1 | 0 | 0 | B | 1 | 1 | 0 | 0 |

    | 0 | 0 | 1 | 1 | 0 | 0 | B | 1 | 1 | 1 | 1 |

    |   | p | a | r | i | t | y | b | i | t | s |   |


    But, because the Hamming Code can correct one error per codeword, the entire matrix
    can be restored. The Hamming Code can thus locate and correct the single error
    that results in each of the corresponding rows. The entire R-bit burst error can
    therefore be detected and corrected. This method uses RK check bits to make blocks
    of RN data bits immune to a single burst error of length R or less.'
  merge: -1
  img_proc: true
