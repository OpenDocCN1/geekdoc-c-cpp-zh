  md: '# Body Mass Index Lab


    The BMI, or Body Mass Index, is a measure of one''s body fat based upon the individual''s
    height and weight. It can determine whether or not an individual is overweight
    or obese.


    The formula for calculating BMI is as follows:


    ```

    BMI = weightInPounds x 703

    heightInInches x heightInInches

    ```


    The the following table can be used to evaluate a BMI score:


    | BMI VALUES | |

    | :--- | :--- |

    | Less than 18.5 | Underweight |

    | Between 18.5 and less than 25.0 | Normal |

    | Between 25.0 and less than 30.0 | Overweight |

