- pgno: 405
  md: 'One annoying aspect of enum types is that they are not recognized by C input-output
    statements. For example:


    ```

    enum direction { north, south, east, west };

    direction d1 = south;

    printf("%d\n", south);

    ```


    The value 1 gets output.


    If it is desired to have a specific integer value associated with an enumerated
    value, then the integer can be assigned to the value when the data type is defined.
    Enumerated values that subsequently appear in the list will be assigned sequential
    values beginning with the specified integer value plus 1.


    For example:


    ```

    enum direction { up, down, left = 10, right };

    ```


    Each of the enumerated values will have the following numeric values:


    | up = 0 |

    | down = 1 |

    | left = 10 |

    | right = 11 |


    The name of the data type can be omitted when defining an enumerated data type.
    Variables can also be declared to be of the particular enumerated data type when
    the data type is defined:


    ```

    enum { east, west, south, north } location;

    ```


    Note that defining an enumerated data type within a function restricts the usage
    of that definition to variables defined within the function. Defining an enumerated
    data type at the beginning of the program, outside any function, makes the type
    definition global to the file.'
  merge: -1
  img_proc: true
- pgno: 406
  md: '# Typedef Statement


    The `typedef` statement enables a programmer to assign an alternate name to a
    data type. For example:


    ```

    typedef int COUNTER;

    ```


    defines the name COUNTER to be equivalent to the C data type `int`. Variables
    can now be declared to be of type COUNTER:


    ```

    COUNTER a, b, c;

    ```


    This provides added readability to the program. Here''s another example:


    ```

    typedef char *STRING_PTR;

    ```


    defines a name `STRING_PTR` to be a `char` pointer. We can now define variables
    to be of type `STRING_PTR`:


    ```

    STRING_PTR buffer;

    ```


    will be treated as a character pointer by the C compiler.


    Another example:


    ```

    typedef char STRING[81];

    ```


    defines a type called `STRING` which is an array of 81 characters. We can now
    define variables to be of type `STRING` as in:


    ```

    STRING text;

    ```'
