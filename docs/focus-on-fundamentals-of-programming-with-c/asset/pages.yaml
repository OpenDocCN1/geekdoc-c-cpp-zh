- pgno: 171
  md: '# While Loop


    A repetition statement allows you to specify that an action is to be repeated
    while some condition remains true. For example, the statement:


    ```

    while there are more items on my shopping list

    purchase next item and cross it off my list

    ```


    describes the repetition that occurs during a shopping trip. The condition:


    ```

    there are more items on my shopping list

    ```


    may be true or false. If it''s true, then the action:


    ```

    purchase next item and cross it off my list

    ```


    is performed. This action will be performed repeatedly while the condition remains
    true. Eventually, the condition will become false (when the last item on the shopping
    list has been purchased and crossed off the list). At this point, the repetition
    terminates, and the first statement after the repetition structure is executed.


    So loops provide a means of repeating a series of executable statements (the loop
    body) as long as the condition controlling the loop (usually found in the loop
    header) evaluates to true. The loop control condition is a logical expression
    that evaluates to either true or false. Often, this expression involves a single
    variable, called a loop control variable.


    The loop body is the block of code that contains the series of executable statements
    associated with the loop condition. Note that the loop body may be a single statement
    or a compound statement. The loop body will be repeated as long as the loop condition
    evaluates to true. When the loop condition evaluates to false, the loop will terminate.
    Each time the loop body is repeated, the loop is said to have gone through an
    iteration.'
  merge: -1
  img_proc: true
- pgno: 172
  md: "# The syntax of a while loop looks like this:\n\n```\n// Before the loop construct,\
    \ initialize any loop control variable,\n// i.e., the variable appearing in the\
    \ condition in the loop header.\nwhile (condition) { // loop header - test the\
    \ loop condition\n    statement;\n}\nor\nwhile (condition) { // loop header -\
    \ test the loop condition\n    statement;\n    statement;\n    ...\n}\n```\n\n\
    Keep in mind that the loop body must contain a statement that updates the loop\
    \ control variable used in the loop condition. The loop control variable is normally\
    \ found at the bottom of the loop body.\n\nNote that when a while loop construct\
    \ has only one statement then the curly braces { } are optional. However, it's\
    \ always a good idea to use the curly braces even though they're not required.\n\
    \n# Example: Powers of 2\n\nAs an example, consider a program segment designed\
    \ to find the first power of 2 larger than 100. We first initialize the integer\
    \ variable product to 2. When the following while repetition statement finishes\
    \ executing, product will contain the desired answer:\n\n```\nproduct = 2;\nwhile\
    \ (product <= 100) {\n    product = product * 2; // or we can say: product *=\
    \ 2;\n}\n```\n\nWhen the while statement is entered, the value of product is 2.\
    \ The variable, product, is repeatedly multiplied by 2, taking on the values 2,\
    \ 4, 8, 16, 32, 64 and 128 successively. When product becomes 128, the condition\
    \ in the while statement:"
