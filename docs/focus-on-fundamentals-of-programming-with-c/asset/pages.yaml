  md: '```

    *p = *q;

    printf("**p = %d   *q = %d\n", *p, *q);

    free(p);

    p = q;

    printf("**p = %d   *q = %d\n", *p, *q);

    free(p);

    printf("**p = %d   *q = %d\n", *p, *q);

    return 0;

    }

    ```


    The output to the above program is:


    ```

    *p = 3      *q = 5

    *p = 5      *q = 5

    *p = 7      *q = 7

    *p = 7      *q = 9

    *p = 9      *q = 9

    *p = 9      *q = 9

    ```


    Note that the last statement in the program is illegal although the C compiler
    will not complain about it! In the preceding statement, free(p), the dynamic variable
    that pointer p points to is disposed of. It is therefore illegal to dereference
    the pointer p. If you do, your program will become unstable. Although the C compiler
    will not find the error, you can be sure that the error will be found after you
    have shipped the 100,000th copy of your program!


    There is another reason that the last statement in the program is illegal. It
    is because pointer q is being dereferenced! You might be wondering why this would
    be illegal since we have not executed a free(q) statement. Well, at least not
    directly. At the time we execute the free(p) statement, both pointers p and q
    are pointing to the same memory location, to the same dynamic variable. Therefore,
    after executing free(p), pointer q is no longer pointing to a dynamic variable.
    Its storage has already been reclaimed. It is therefore illegal to dereference
    both pointers p and q at this point in the program.'
