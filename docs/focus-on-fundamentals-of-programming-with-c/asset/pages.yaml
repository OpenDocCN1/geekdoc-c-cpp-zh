- pgno: 411
  md: '# Introduction to Structures


    We have previously used arrays to store collections of data of the same type (and
    a specified size) using a single name:


    ```

    int num[10];

    ```


    ![](img/7f36c52b5170b89b142dbb7b1ea4666b_411_0.png)


    We learned to reference individual elements of an array using subscripts such
    as num[1] or num[1].


    ![](img/7f36c52b5170b89b142dbb7b1ea4666b_411_1.png)


    Often, we have a need to create collections of related data of different types.
    For example, if I wanted to collect information about students, I might be interested
    in the following information:


    +   - The student''s name (string of characters)

    +   - The student''s gpa (double)

    +   - The student''s expected graduation year (integer)


    We can model such a collection in C using the data type called a struct. A struct
    is an example of a user-defined data type, i.e., we can define our own struct
    to model whatever data we want.'
  merge: -1
  img_proc: true
- pgno: 412
  md: "For example:\n\n```\ntypedef struct {\n   char name[30];\n   double gpa;\n\
    \   int year;\n} Student;\n```\n\nThis serves as a blueprint or template for the\
    \ creation of a new data type called Student. This new user-defined data type,\
    \ Student, can be used to declare variables just like any built-in data type:\n\
    \n```\ntypedef struct {\n   char name[30];\n   double gpa;\n   int year;\n} Student;\n\
    \nint main(void) {\n   Student s1, s2, s3;\n   ...\n   return 0;\n}\n```\n\nOur\
    \ declarations above create three variables of type Student: s1, s2, and s3. Each\
    \ of these variables create now has storage in memory for a character string,\
    \ a double, and an int. Note that the name of our new data type begins with a\
    \ capital letter. While it's not required, it's a good rule to follow.\n\nAlso\
    \ note that the struct is declared outside of main() in the global scope. This\
    \ allows the struct to be visible to all parts of the program. If the struct were\
    \ only declared within main(), then it would be local to main() and only visible\
    \ within main().\n\nThe structure can be depicted as follows:\n\n| | name | gpa\
    \ | year |\n|---|---|---|---|\n| s1 | Sammie | 3.85 | 2016 |"
  merge: -1
  img_proc: true
- pgno: 413
  md: "# Referencing elements of a struct.\n\nWe now have the same problem with structs\
    \ as we had with arrays. How do we reference individual elements (called components\
    \ or fields) of a struct? With arrays we used subscripts. With structs we use\
    \ a period, also known as a direct component selection operator (or, more simply,\
    \ the selection operator, for short).\n\nFor example, we can give values to each\
    \ of the fields of the struct as follows:\n\n```\nsl.gpa = 3.85;\nsl.year = 2016;\n\
    strcpy(sl.name, \"Sammy\");\n```\n\n# Example: Date structure.\n\nSuppose that\
    \ we have a need to keep track of various dates. We can define a Date data type\
    \ as follows:\n\n```\ntypedef struct {\n    int month;\n    int day;\n    int\
    \ year;\n} Date;\n```\n\nOnce we have defined a Date data type, we can create\
    \ Date variables as follows:\n\n```\ntypedef struct {\n    int month;\n    int\
    \ day;\n    int year;\n} Date;\n\nint main(void) {\n    Date yesterday, today,\
    \ tomorrow, appointment, birthday;\n    ...\n    ...\n    return 0;\n}\n```"
  merge: -1
  img_proc: true
