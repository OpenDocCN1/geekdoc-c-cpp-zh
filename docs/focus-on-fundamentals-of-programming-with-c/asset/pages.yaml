  md: '# Structure Initialization


    Structure initialization is similar to array initialization, except that the data
    types being initialized may be different for each member. For example:


    ```

    Date birthday = { 8, 23, 96 };

    ```


    Note that the elements listed inside the brackets are separated by commas. If
    there are fewer initializers than members, the remaining members are initialized
    to zero.'
