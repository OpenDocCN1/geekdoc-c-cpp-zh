  md: "# Array Elements as Function Arguments\n\nElements of an array can be passed\
    \ as function arguments in the same manner as any other variable. The example\
    \ below passes two array elements by value. Note that the swap function attempts\
    \ to swap the value of the two array elements but because the array elements are\
    \ passed by value, the swapped values are not reflected back in main().\n\n```\n\
    #include <stdio.h>\n\n#define SIZE 5\n\nvoid swap(int x, int y);\n\nint main(void)\
    \ {\n    int i, num[SIZE];\n\n    for (i = 0; i < SIZE; ++i) {\n        num[i]\
    \ = i;\n    }\n\n    printf(\"Before swap: num[2] = %d num[3] = %d\\n\", num[2],\
    \ num[3]);\n    swap(num[2], num[3]);\n    printf(\"After swap: num[2] = %d num[3]\
    \ = %d\\n\", num[2], num[3]);\n\n    return 0;\n}\n\nvoid swap(int x, int y) {\n\
    \    int temp;\n\n    temp = x;\n    x = y;\n    y = temp;\n}\n```\n\nHere's the\
    \ output that's produced:\n\n```\nBefore swap: num[2] = 2 num[3] = 3\nAfter swap:\
    \ num[2] = 2 num[3] = 3\n```"
  merge: -1
  img_proc: true
- pgno: 261
  md: "By placing the address-of operator (&) in front of each of the array element\
    \ function parameters, we can pass the two array elements by reference. Of course,\
    \ we also have to modify the swap() function to accept addresses rather than int\
    \ values. Note that the swapped values are now reflected back in main().\n\n```\n\
    #include <stdio.h>\n\n#define SIZE 5\n\nvoid swap(int *x, int *y);\n\nint main(void)\
    \ {\n    int num[SIZE];\n    int i;\n\n    for (i = 0; i < SIZE; ++i) {\n    \
    \    num[i] = i;\n    }\n\n    printf(\"Before swap: num[2] = %d num[3] = %d\\\
    n\", num[2], num[3]);\n    swap(&num[2], &num[3]);\n    printf(\"After swap: num[2]\
    \ = %d num[3] = %d\\n\", num[2], num[3]);\n\n    return 0;\n}\n\nvoid swap(int\
    \ *x, int *y) {\n    int temp;\n\n    temp = *x;\n    *x = *y;\n    *y = temp;\n\
    }\n```\n\nHere's the output that's now produced:\n\n```\nBefore swap: num[2] =\
    \ 2 num[3] = 3\nAfter swap: num[2] = 3 num[3] = 2\n```"
