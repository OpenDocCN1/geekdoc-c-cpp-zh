  md: "# Function Prototypes Revisited\n\nIn general, C does not care in what order\
    \ you put your functions in the program, so long as a the function name is known\
    \ to the compiler before it is called. This is ensured through the use of function\
    \ prototypes. A function prototype declares the function name, its parameters,\
    \ and its return type to the rest of the program prior to the function's actual\
    \ declaration.\n\nFunction prototypes are placed at the beginning of a program\
    \ before the first function declaration, which is usually main(), and consists\
    \ of the function header with a semicolon after the closing brace. Here's an example:\n\
    \n```\n#include <stdio.h>\n\nint main(void);\nint add(int a, int b);\nint mult(int\
    \ a, int b);\n\nint main(void) {\n    int num1, num2;\n\n    printf(\"Enter two\
    \ integers: \");\n    scanf(\"%d%d\", &num1, &num2);\n    printf(\"The sum of\
    \ the two numbers is %d\\n\", add(num1, num2));\n    printf(\"The product of the\
    \ two numbers is %d\\n\", mult(num1, num2));\n    return 0;\n}\n\nint add(int\
    \ a, int b) {\n    return a + b;\n}\n\nint mult(int a, int b) {\n    return a\
    \ * b;\n}\n```\n\nHere's the output of the program:\n\n```\nEnter two integers:\
    \ 4 5\nThe sum of the two numbers is 9\nThe product of the two numbers is 20\n\
    ```\n\nNote that we even provide a function prototype for main()."
  merge: -1
  img_proc: true
- pgno: 229
  md: 'Did you notice the & in front of num1 and num2 in the scanf() function? When
    reading in an int, char, or float with scanf(), we must provide to scanf() not
    the variable name but the address of the variable in memory. & is referred to
    as the address of operator in C, and when placed in front of a variable, returns
    the address of the variable.


    # A Note on the Placement of main() and Function Prototypes...


    Technically main() can be placed anywhere in a program. However, it is typically
    placed as the first function in a program. As you''ll see, we generally do not
    place much detailed code in main(). When used correctly, it provides an abstraction
    to the rest of the program and its visibility as the first function in the program
    is useful.


    But there''s more to it than just style. Thinking that placing main() as the last
    function in a program will obviate the need for function prototypes is incorrect.
    Suppose your code was set up as follows:


    ```

    void foo1() {

    ...

    }


    void foo2() {

    ...

    }


    int main() {

    ...

    }

    ```


    If main() calls foo1() or foo2() there''s no problem. If foo2() calls foo1() there''s
    no problem. But what happens if foo1() calls foo2() ? The compiler will complain
    because it has not yet seen the declaration for foo2() . What kind of a function
    is it? How many parameters does it have? What are the data types of the parameters?
    Are their any return values? How can the compiler do error checking on the function
    call to foo2() if it cannot answer all these questions. The use of function prototypes
    allows the compiler to see the function declarations before any code is looked
    at so error checking can be performed properly.'
  merge: -1
  img_proc: true
- pgno: 230
  md: "Of course you might want to switch the order of foo1() and foo2() in your program\
    \ and all would be well. However, in a large program with dozens of functions,\
    \ it might not be so easy to order the functions properly. With the use of function\
    \ prototypes, we never have to worry about the order of our functions.\n\nOne\
    \ last reason for the use of function prototypes deals with the building of larger\
    \ programs and linking source codes together. This will be a topic for discussion\
    \ at a later time.\n\n# Function Return Values\n\nNote that even though a function\
    \ returns a value, a program need not make use of it:\n\n```\nwhile (...) {\n\
    \    :\n    getchar(); // get a character and do nothing with it\n    c = getchar();\
    \ // get another character and assign to c\n    :\n}\n```\n\n# void Return Values\
    \ and void Parameter List\n\nIf a function does not return any value, its return\
    \ type should be specified as void. The void specifier informs the compiler that\
    \ a function does not return a value. In a sense, the void data type is actually\
    \ defining the absence of a data type and a function declared to be of type void\
    \ has no return value and cannot be used in an expression as if it does.\n\n```\n\
    void printHeader(void) {\n    printf(\"Program Number 1\\n\");\n    printf(\"\
    by Richard Stegman\\n\");\n    printf(\"Version 1.0, released 2/12/14\\n\");\n\
    }\n```"
