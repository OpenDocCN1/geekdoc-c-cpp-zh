- pgno: 13
  md: '# An introduction to Algorithms


    An algorithm is a step-by-step process for solving a problem. For example, let''s
    explore an algorithm for driving a car. Here are the steps:


    +   Open the car door.

    +   Enter the car.

    +   Close the door.

    +   Put on your seat belt.

    +   Put the key in the ignition and turn on the ignition.

    +   Put the car in drive.

    +   Step on the gas.


    Did we omit any steps?


    # Greatest Common Divisor


    Sometimes an algorithm can be more mathematical in nature. Actually the oldest
    known arithmetic algorithm was reported around 300 B.C. by Euclid and is a method
    for computing the greatest common divisor of two whole numbers. The greatest common
    divisor is the largest whole number that divides both numbers without remainders.


    If the two numbers are A and B, Euclid''s algorithm is as follows:


    +   1. Compute the remainder of the division of A and B.

    +   2. Replace A by B.

    +   3. Replace B by the remainder computed in step 1.

    +   4. Repeat steps 1 ~ 3 until B is zero.

    +   5. The greatest common divisor is the final value of A.'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'For example, find the greatest common divisor of A = 24 and B = 9:


    ```

    1. The remainder of 24 / 9 = 6.

    2. A = 9.

    3. B = 6.

    4. Repeat steps 1 - 3.


    1. The remainder of 9 / 6 = 3.

    2. A = 6.

    3. B = 3.

    4. Repeat steps 1 - 3.


    1. The remainder of 6 / 3 = 0.

    2. A = 3.

    3. B = 0.

    5. The greatest common divisor is 3.

    ```


    There are typically three important features of an algorithm:


    +   1. The algorithm must have a finite number of instructions or steps.

    +   2. Each instruction in the algorithm is well defined (not ambiguous).

    +   3. The algorithm eventually halts.


    A computer program is also an example of an algorithm. In fact, here''s a program
    written in C to compute the greatest common divisor of two numbers following Euclid''s
    algorithm:'
  merge: -1
  img_proc: true
- pgno: 15
  md: "```\n// Program to calculate the greatest common divisor of two numbers\n\n\
    #include <stdio.h>\n\nint main(void) {\n    int A, B, remainder;\n\n    printf(\"\
    Enter two positive integers: \");\n    scanf(\"%d%d\", &A, &B);\n\n    while (B\
    \ != 0) {\n        remainder = A % B;\n        A = B;\n        B = remainder;\n\
    \    }\n\n    printf(\"The greatest common divisor = %d\\n\", A);\n\n    return\
    \ 0;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 16
  md: "# Stepwise Refinement – Part 1\n\nTo show you an example of top-down design\
    \ or stepwise refinement, we'll take the act of making scrambled eggs. Starting\
    \ from the top we have the task to:\n\n+   - Make scrambled eggs\n\nBut saying\
    \ that by itself isn't enough to actually make any scrambled eggs, so we need\
    \ to break the task down:\n\n+   - Make some scrambled eggs\n+     1. Organise\
    \ the kitchen\n+     2. Make scrambled eggs\n+     3. Serve the scrambled eggs\n\
    \nEach of these tasks can then be broken down further:\n\n+   1. Organize the\
    \ kitchen\n+      1. Clean surfaces\n+      2. Get out mixing bowl, whisk, spoon\n\
    +      3. Get out eggs, salt, milk, and butter\n+      4. Put on apron\n+   \n\
    +   2. Make scrambled eggs\n+      1. Break eggs into bowl\n+      2. Whisk the\
    \ eggs\n+      3. Add water and milk to the bowl\n+      4. Whisk\n+      5. Cook\
    \ the scrambled eggs\n+   \n+   3. Serve the scrambled eggs\n\nAnd each of these\
    \ tasks can be broken down further, let us take a look at the Cook the scrambled\
    \ eggs component:"
  merge: -1
  img_proc: true
