- pgno: 549
  md: '# OOP is a New Approach...


    The object-oriented approach is, in its simplest form, based on a seemingly elementary
    idea:


    Computing systems perform certain actions on certain objects. To obtain flexible
    and reusable systems, it is better to base the structure of software on the objects
    rather than on the actions.


    # OOP Questions


    Once we have said this, we have not really provided a definition, but rather posed
    a set of problems:


    +   - What precisely is an object?

    +   - How do you find and describe the objects?

    +   - How should programs manipulate objects?

    +   - What are the possible relations between objects?

    +   - How does one explore the commonalities that may exist between various kinds
    of objects?


    How do these ideas relate to classical software engineering concerns such as:


    +   - Correctness / Ease of use / Efficiency'
  merge: -1
  img_proc: true
