  md: '# Variable Length Argument List - Advanced


    It is possible to create functions that receive an unspecified number of arguments!
    In fact, printf() takes a variable number of arguments. As a minimum, printf()
    must receive a string as its first argument, but can receive any number of additional
    arguments. The actual function prototype for printf() is:


    ```

    int printf(char *fmt, ...);

    ```


    The declaration ... (ellipse) means that the number and types of these arguments
    may vary. The function may receive a variable number of arguments of any type.
    This declaration can only appear at the end of an argument list.


    Declaring a function with a variable number of arguments can provide us great
    flexibility. Consider a function average() that can find the average of a variable
    number of arguments. It might be invoked as follows:


    ```

    avg = average(a, b, c);

    avg = average(a, b, c, d);

    ```


    The secret to handling a variable number of arguments in C lies in the way arguments
    are passed to a function. Lets take a look at the contents of the stack at the
    moment a C function is entered. When a function is called, the arguments followed
    by the return address are placed on the stack:'
  merge: -1
  img_proc: true
- pgno: 354
  md: "```\nfoo(arg1, arg2);\n\nhigh addresses\n+-----------+\n|   arg2    |\n+-----------+\n\
    |   arg1    |\n+-----------+\n| return address |\nsp-> +-----------+\n     | \
    \          |\n     | stack     |\n     | grows     |\n     | downward  |\n   \
    \  |           |\n     +-----------+\nlow addresses\n```\n\nIn C, the arguments\
    \ of the functions are placed on the stack in the reverse order they appear in\
    \ the function call. The result is that the first argument is always at a fixed\
    \ offset from the stack pointer, sp. The offset is the number of bytes needed\
    \ to store the return address. So no matter how many arguments are passed to a\
    \ C function, the first argument is always easily reachable.\n\nSo upon entry\
    \ to the C function, the first argument appears on the stack just above the return\
    \ address, i.e., it has the next higher address. Additional arguments have successively\
    \ higher addresses. Therefore, if you could get to the first argument on the stack\
    \ and you know the size of all the other arguments, you could then retrieve the\
    \ arguments one by one!\n\nThere is a standard C header file <stdarg.h> that contains\
    \ a set of macros along with a newly defined data type that makes the task of\
    \ handling a variable number of arguments straightforward. The implementation\
    \ of this header file will vary from machine to machine, but the interface it\
    \ presents is uniform. The first thing that stdarg.h contains is the definition\
    \ of a new data type:\n\n```\nva_list\n```\n\nthat is used to declare a variable\
    \ that will refer to each argument in turn:"
