    pointer is name[1] and it points to the second string, etc. Note that each pointer
    points to the first character in each string:


    ```

    *name[0] ==> ''H'',

    *name[1] ==> ''S'',

    *name[2] ==> ''B'',

    *name[3] ==> ''I'',

    *name[4] ==> ''Z'',

    ```


    This array of pointers is sometimes known as a ragged array, because each row
    may be of a different size. The ragged array, therefore, doesn''t waste any storage
    space!


    Consider the following example that declares a ragged array which stores various
    error messages which might be needed by a program:


    ```

    char *errorMsg[5] = { "Memory allocation error",

    "Stack overflow.",

    "Cannot read sector.",

    "File not found.",

    "Division by zero."

    };

    ```


    To output an appropriate error message, it''s simply a matter of accessing the
    appropriate array element:


    ```

    puts(errorMsg[3]);

    ```


    If we wanted to output all error messages contained within the ragged array, it
    would simply be a matter of iterating through the array:


    ```

    for (i = 0; i < 5; i++) {

