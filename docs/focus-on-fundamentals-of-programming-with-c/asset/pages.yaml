- pgno: 26
  md: '# # Capturing Program Output


    When you submit your computer lab assignments, it will be necessary to include
    a file that contains the output generated by your program. While you might be
    tempted to simply copy and paste the output that appears on the screen into a
    file, often output generated from your program cannot all fit on the screen and
    usually gets scrolled off the screen. Please follow the instructions below to
    capture the output of you program into a file called `csis.txt`


    +   - Add the following declaration to your C program before `main()`.


    ```

    FILE *csis;

    ```


    In `main()`, after your variable declarations, add the following statement:


    ```

    csis = fopen("csis.txt", "w");

    ```


    This will open the `csis.txt` data file to capture your program output. Don''t
    worry about the syntax for now, as we''ll look at the details later.


    +   - Every `printf()` statement in your program that sends output to the terminal
    window should have a corresponding `fprintf()` statement that also sends the output
    to the `csis.txt` file. For example, if your program contains the following type
    of `printf()` statement:


    ```

    printf("Hello, world.\n");

