- pgno: 33
  md: "# # Compiler Directives and Comments\n\nCompiler directives are handled by\
    \ the C preprocessor as it makes its first pass through your program file. The\
    \ resulting preprocessed file is then compiled in the second pass by the C compiler\
    \ to generate the object file that is in the machine language code.\n\n# ## The\
    \ #include Directive\n\n#include includes the contents of another file, commonly\
    \ called a header file, into your source code file. The line of code where the\
    \ #include compiler directive occurs is replaced by the contents of the header\
    \ file.\n\nFor example, if the contents of a header file named myinclude.h were:\n\
    \n```\n```\n// This is an empty include file with nothing but comments.\n// There\
    \ is no meaningful code in this file.\n```\n```\n\nand the program file contained\
    \ the following lines of code:\n\n```\n```\n#include \"myinclude.h\"\nint main(void)\
    \ {\n    printf(\"This is a 1 line program.\\n\");\n}\n```\n```\n\nthen the preprocessing\
    \ step would produce the following lines of code:\n\n```\n```\n// This is an empty\
    \ include file with nothing but comments.\n// There is no meaningful code in this\
    \ file.\nint main(void) {\n    printf(\"This is a 1 line program.\\n\");\n}\n\
    ```\n```"
  merge: -1
  img_proc: true
- pgno: 34
  md: 'Sometimes a header file will include angle brackets, <>.


    ```

    #include <stdio.h>

    ```


    The angle brackets tell the C preprocessor that the included file is a C Standard
    Library header file (sometimes called a system file.) The standard input/output
    library file, stdio.h, contains the declarations (definitions) of all the standard
    names needed to do input and output in our programs. It must be included, for
    example, to use the printf() and scanf() standard input/output functions.


    Note that the C Standard Library (the header and implementation files) come with
    the C compiler software. There are about 18 such libraries, including stdio.h
    for input/output, library files for string manipulation functions, math functions,
    character manipulation functions, etc. Note that you don''t have to know where
    system header files are located, as the C pre-processor knows where to find them.


    # User-Defined Header Files


    User defined header files are header files that you create that may define information
    specific to your program.


    Assume the following statement:


    ```

    #include "myheader.h"

    ```


    The double quotes, "", tell the C preprocessor that the included file is a user-defined
    header file as opposed to a C Standard Library header file. The C preprocessor
    assumes that the file myheader.h is located in the same directory where the program
    is compiled. If the user defined header file is not located in the same directory
    where you compile the program, then the information inside the double quotes must
    contain the path information for the user defined header file. Otherwise, the
    C preprocessor will not know where to find user defined header files.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# The #define Directive


    #define defines a macro constant name and value whose name is automatically replaced
    by the macro constant value throughout the program file. For example, consider
    the following statement:


    ```

    #define KMS_PER_MILE 1.609

    ```


    The C preprocessor substitutes the macro constant name KMS_PER_MILE with the macro
    constant value, 1.609, throughout the program file. We would write the C line
    of code:


    ```

    kms = miles * KMS_PER_MILE;

    ```


    After the C pre-processor step, this line would look like this:


    ```

    kms = miles * 1.609;

    ```


    # C Comments


    Comments are statements that clarify the meaning and content of your program file.
    They are a means of documenting your program code so that people can better understand
    how the program works.


    Comments are removed by the C preprocessor before the resulting program code is
    compiled so the C compiler does not see them. However, the comments can be read
    by humans looking at the contents of your program file.


    Comments start with /* and end with */ and everything between /* and */ is removed
    by the C preprocessor.


    ```

    /* This is a single comment. */

    ...

    /* This is also a single comment.

    ...

    ```'
  merge: -1
  img_proc: true
