- pgno: 187
  md: "# Continue Statement\n\nThe break statement can be used to immediately take\
    \ you out of a loop.\nSometimes, however, you want to go back to the top of the\
    \ loop when something\nunexpected happens.\n\nFor example, we can use the continue\
    \ statement to avoid a division by zero\nerror:\n\n```\n// calculate reciprocals\
    \ for -5 to 5\n\nint main(void) {\n    int i;\n\n    for (i = -5.0; i <= 5.0;\
    \ i += 1.0) {\n        if (i == 0.0) {\n            printf(\"Divide by zero trap.\\\
    n\");\n            continue;\n        }\n        printf(\"%f\\n\", 1.0 / i);\n\
    \    }\n    return 0;\n}\n```\n\nNote that in the body of the for statement, the\
    \ continue statement jumps to\nthe loopExpression; the third expression of the\
    \ for statement. In the while\nand do while loops, it jumps to the test.\n\nLike\
    \ a break statement, you should always question the need for a continue\nstatement.\
    \ By simply restructuring the code you can often eliminate the need for\na continue\
    \ statement. You are very unlikely to use it.\n\n```\n-0.200000\n-0.250000\n-0.333333\n\
    -0.500000\n-1.000000\nDivide by zero trap.\n1.000000\n0.500000\n0.333333\n0.250000\n\
    0.200000\n```"
  merge: -1
  img_proc: true
