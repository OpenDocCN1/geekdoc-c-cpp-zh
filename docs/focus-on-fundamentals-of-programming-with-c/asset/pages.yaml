  md: "# Sorting an Array: qsort() Library Function\n\nThe standard C libraries include\
    \ an exceptionally powerful and generic sorting routine called qsort(). It is\
    \ an implementation of a particular sorting algorithm called quicksort. The qsort()\
    \ routine has four parameters:\n\n+   - the base address of an array of data\n\
    +   - the number of items in the array\n+   - the width (in bytes) of each item\n\
    +   - the address of a function that can compare two data items of the type contained\
    \ in the array and return a signed value as follows:\n\n```\n< 0 if p < q\n 0\
    \ if p = q\n> 0 if p > q\n```\n\nIf you're using one of C's primitive data types,\
    \ you can usually construct an appropriate comparison function in a few lines\
    \ of code. Here's an example:\n\n```\nint compare(const void *p, const void *q)\
    \ {\nif (*(int *)p < *(int *)q) {\n    return -1;\n}\nreturn *(int *)p > *(int\
    \ *)q;\n}\n```\n\nIn the compare() function:\n\n```\nif p < q returns -1\nif p\
    \ = q returns 0\nif p > q returns 1\n```"
