- pgno: 318
  md: '# Pointers and Arrays


    Pointers and arrays are used in almost the exact same way to access memory. The
    difference is that a pointer is a variable that takes addresses as values while
    an array name is an address, or pointer, that is fixed.


    When an array is declared, the compiler must allocate a base address and a sufficient
    amount of storage to contain all the elements of the array. The base address is
    the initial location in memory where the array is stored, i.e., the address of
    the first element(index 0) of the array. Therefore, an array name is also a pointer
    to the first element of the array. If we declare an integer array:


    ```

    int num[100];

    ```


    then the name of the array, num, is equivalent to the address of the first element
    of the array, &num[0]:


    ```

    num = &num[0]

    ```


    Both represent the memory address of that first element of the array and both
    are pointer constants because they remain fixed for the duration of the program.
    However, they can be assigned as values to a pointer variable and we can change
    the value of that pointer variable as we wish. For example:


    ```

    int num[100]; // reserve sizeof(int)*100 bytes of memory

    int *ptr; // pointer variable

    ```


    If ptr is assigned the address of the initial element of array num, we can then
    access the array storage using the pointer variable. So we can execute either


    ```

    ptr = num;

    or

    ptr = &num[0];

    ```


    The initial element of the array can now be accessed as *ptr, i.e., the thing
    pointed to by ptr.'
  merge: -1
  img_proc: true
- pgno: 319
  md: "# Pointer Arithmetic\n\nPointer arithmetic is one of the most powerful features\
    \ of C and provides an alternative to array indexing. The statements:\n\n```\n\
    ptr = &num[1];\nand\nptr = num + 1;\n```\n\nare equivalent and would assign the\
    \ address of the second element of the array to ptr. What's interesting is that\
    \ if the pointer variable ptr is a pointer to any particular type, then the expression\
    \ ptr + 1 yields the correct memory address for storing or accessing the next\
    \ variable of that type. Each of the following statements are valid and would\
    \ take us to the next variable of that type, i.e., the next element in the array:\n\
    \n```\nptr = ptr + 1;\nptr += 1;\n++ptr;\nptr++;\n```\n\nHere is a program that\
    \ sums the elements of an array of 100 integers using pointer arithmetic.\n\n\
    ```\n#include <stdio.h>\n\nint main(void) {\n    int i, num[100], sum, *ptr;\n\
    \n    for (i = 0; i < 100; i++) {\n        num[i] = i;\n    }\n\n    for (sum\
    \ = 0, ptr = num; ptr < &num[99]; ptr++) {\n        sum += *ptr;\n    }\n\n  \
    \  printf(\"sum = %d\\n\", sum);\n    return 0;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 320
  md: "In this example, pointer variable ptr is first initialized to the base address\
    \ of array num. The successive values of ptr are equivalent to &num[0], &num[1],\
    \ ..., &num[99]. In each iteration we then dereference the pointer ptr to access\
    \ the contents of the array element that is added to the summation variable.\n\
    \nIn general, given the following declarations:\n\n```\nint i, num[100];\nint\
    \ *ptr;\n```\n\nwe can say that ptr + i is the i^th offset from the address ptr\
    \ and num + i is the i^th offset from the base address of array num. Here is another\
    \ way to sum the array.\n\n```\n// psum2.c\n#include <stdio.h>\nint main(void)\
    \ {\n    int i, num[100], sum;\n    for (i = 0; i < 100; i++) {\n        num[i]\
    \ = i;\n    }\n    for (sum = 0, i = 0; i < 100; ++i) {\n        sum += *(num\
    \ + i);\n    }\n    printf(\"sum = %d\\n\", sum);\n    return 0;\n}\n```\n\nNote\
    \ that because num is the name of an array, it is a constant pointer and the following\
    \ expressions are illegal because we cannot change the value of num:\n\n```\n\
    num = ptr;\n++num;\nnum++;\nnum += 2;\n```"
