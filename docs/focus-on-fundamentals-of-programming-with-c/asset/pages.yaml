  md: "# Part II\n\nThe second part of this lab is to write a text aligner program,\
    \ align.c. This is a program that attempts to fill the maximum number of words\
    \ on a line, where a line is 62 characters, without breaking up individual words.\n\
    \nThis program will use the while loop and character array, wbuf, defined in word.c,\
    \ as well as a line buffer, lbuf, also declared as a character array in main().\
    \ This time, as each word is read from the file into wbuf, wbuf and lbuf are sent\
    \ to output(), where wbuf is placed into lbuf, until the line buffer is full,\
    \ at which point the entire contents of lbuf is sent to standard output.\n\nHere's\
    \ a simple algorithm:\n\n```\nWhile there are more words to be read from the file\n\
    \    Read the next word into wbuf\n    Send wbuf and lbuf into the output() function\n\
    \    If EOF has been reached and there are words in lbuf that have not yet been\
    \ output\n        Output lbuf. End of program.\n    Otherwise\n        Determine\
    \ if the word in wbuf will fit into lbuf, being careful to allow room for the\
    \ blank separating words.\n        If there is room in lbuf,\n            copy\
    \ the contents of wbuf into lbuf\n        Otherwise\n            Output the contents\
