  md: "# Arithmetic Expressions as Arguments to Functions\n\nOne of the most useful\
    \ features of C is its ability to allow a function to take an arithmetic expression\
    \ as an argument. For example, we could have used an arithmetic expression as\
    \ an argument to the sqrt() function as follows:\n\n```\nroot1 = (-b + sqrt(b*b-4*a*c))\
    \ / (2 * a);\nroot2 = (-b - sqrt(b*b-4*a*c)) / (2 * a);\n```\n\nHowever, in this\
    \ example, it's probably better to calculate the discriminant, assign it to a\
    \ variable, disc, and then use disc in our code so we don't have to perform the\
    \ calculations for the discriminant twice.\n\nBut what if the discriminant is\
    \ < 0? Then there are no real roots to the quadratic equation. We can have out\
    \ program make the appropriate test and only perform the calculations for a discriminant\
    \ that's >= 0:\n\n```\n#include <stdio.h>\n#include <math.h>\nint main (void)\
    \ {\n    int a=1, b=3, c=-4, disc;\n    double root1, root2;\n    disc = b*b-4*a*c;\n\
    \    if (disc > 0) {\n        root1 = (-b + sqrt(disc)) / (2 * a);\n        root2\
    \ = (-b - sqrt(disc)) / (2 * a);\n        printf(\"root1 = %0.1lf\\n\", root1);\n\
    \        printf(\"root2 = %0.1lf\\n\", root2);\n    }\n    return 0;\n}\n```"
