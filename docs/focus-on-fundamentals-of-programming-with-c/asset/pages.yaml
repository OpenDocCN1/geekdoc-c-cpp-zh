- pgno: 607
  md: '# Polymorphism


    Polymorphism is the ability of two or more classes of objects to respond to the
    same message, each in its own way.


    This means that an object does not need to know to whom it is sending a message.
    It just needs to know that many different kinds of objects have been defined to
    respond to that particular message.


    Different objects respond in object-specific manner to the same general message.


    ![](img/7f36c52b5170b89b142dbb7b1ea4666b_607_0.png)'
  merge: -1
  img_proc: true
- pgno: 608
  md: "# Pseudo-Code Example\n\n```\n❖ Non-Polymorphic Code:\nfor each item x    \
    \         // loop over all items\n  if x is a car             // depending on\
    \ what x is\n    call stopCar            // call different function\n  else if\
    \ x is a bike\n    call stopBike           // for each different type\n  else\
    \ if x is a plane      // send a specific stop\n    call stopPlane          //\
    \ message\n```\n\n```\n❖ Polymorphic Code:\nfor each item x             // loop\
    \ over all items\n  x.stop()                  // send general message\n      \
    \                      // to x\n```\n\n❖ This polymorphic solution is more adaptable\
    \ to change and reuse."
  merge: -1
  img_proc: true
- pgno: 609
  md: '# Polymorphic Solution


    +   - What is the effect on each solution of a request to handle a new type of
    vehicle to stop?


    +   - In both solutions, we would provide the new vehicle with all of the operations
    provided by the other vehicles.


    +   - However, in the traditional solution, we must also modify all operations
    on vehicles since they all contain logic similar to the previous solution.


    +   - In every situation, a new else or case must be added.


    +   - In a large system, this kind of activity is extremely error-prone. Chances
    are that we will fail to make one or more of the necessary changes.


    +   - In the object-oriented system, the changes required are localized. We simply
    implement the necessary operations on vehicles without changing anything else.'
  merge: -1
  img_proc: true
- pgno: 610
  md: "# # Another Example\n\nIt's interesting to analyze how polymorphism is implemented\
    \ by an object-oriented language.\n\nConsider an application where various kinds\
    \ of geometric figures such as rectangles, triangles, squares, and circles are\
    \ to be displayed and manipulated.\n\nIn a non object-oriented language, we might\
    \ say something like this:\n\n```\nfor each figure x\n    if x is a rectangle\n\
    \        call displayRectangle\n    else if x is a triangle\n        call displayTriangle\n\
    \    else if x is a square\n        call displaySquare\n    else if x is a circle\n\
    \        call displayCircle\n```"
  merge: -1
  img_proc: true
- pgno: 611
  md: '# Static (Compile-Time) Binding


    +   Because the association between x and each figure-specific procedure must
    be made at compile time, the coupling between the two is known as early binding
    or static binding.


    +   In a similar fashion, we could define operations to move a given figure or
    compute its area.


    +   These procedures would share the same style logic as the display operation
    shown above.


    # Dynamic (Run-Time) Binding


    +   In an object-oriented language, this is not necessarily the case.


    +   Messages can be thought of as late-bound procedure calls, where the actual
    method or procedure to be invoked is not determined until the message is actually
    sent to a specific receiver.'
  merge: -1
  img_proc: true
- pgno: 612
  md: '# Dynamic (Run-Time) Binding


    ```

    for each figure x

    x.display()

