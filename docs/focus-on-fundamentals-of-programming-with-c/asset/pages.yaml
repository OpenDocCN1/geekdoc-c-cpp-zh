  md: '# Additional String Functions


    Here are additional string manipulation functions located in the string library:


    +   • strncpy(s1, s2, max)


    Copies up to max characters from string s2 into string s1, truncating or null-padding
    s1. The target string s1 might not be null-terminated if the length of s2 is max
    or more.


    ```

    Function prototype:

    char *strncpy(char *s1, char *s2, int max);

    ```


    +   • strncmp(s1, s2, max)


    Makes the same comparison as strcmp(), but looks at no more than max characters.
    It starts with the first character in each string and continues with subsequent
    characters until the corresponding characters differ or until it has examined
    max characters. Returns an int value based on the result of comparing string s1
    (or part of it) to string s2 (or part of it). The function returns a value that
    is:


    +   < 0 if s1 is less than s2

    +   == 0 if s1 is the same as s2

    +   > 0 if s1 is greater than s2


    ```

    Function prototype:

    int strncmp(char *s1, char *s2, int max);

    ```


    +   • strchr(s1, c)


    Scans string s1 for the first occurrence of character c. Returns a pointer to
    the first occurrence of the character c in s1. If c does not occur in s, strchr()
    returns null.


    ```

    Function prototype:

    char *strchr(char *s1, int c);

    ```'
