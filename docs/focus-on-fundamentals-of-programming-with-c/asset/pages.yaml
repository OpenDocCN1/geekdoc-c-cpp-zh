  md: "# Relational Operators\n\nA relational operator is a comparison symbol showing\
    \ a relationship between two expressions. Each relational operator takes two operands\
    \ and produces a numerical (not Boolean) result which is either 0 (false) or non-zero\
    \ (true). This is called semi-Boolean logic.\n\n| Operator | Description |\n|---|---|\n\
    | > | greater than |\n| >= | greater than or equal to |\n| < | less than |\n|\
    \ <= | less than or equal to |\n| == | equal to |\n| != | not equal to |\n\n#\
    \ Precedence of Relational Operators\n\n> >= < <=\n== !=\n\nThe precedence of\
    \ the relational operators is just below that of the arithmetic operators. Therefore,\n\
    \n```\na + b < c + d\n```\n\nwould be a valid C expression.\n\nWhat would be the\
    \ output of the program below?\n\n```\n#include <stdio.h>\nint main(void) {\n\
    \   int a, b;\n   a = 3;\n   b = a == 3;\n   printf(\"%d\\n\", b);\n   return\
    \ 0;\n}\n```\n\n+   * a) 1\n+   * b) 0\n+   * c) 3\n+   * d) syntax error\n+ \
    \  * e) true\n+   * f) false"
