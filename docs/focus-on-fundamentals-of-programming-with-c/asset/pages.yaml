- pgno: 81
  md: '# Logical Operators


    Quite often we express conditions based upon the truthhood and/or falsehood of
    more than one condition. For example:


    > You will receive an A in the class if you do well on the exams AND if you do
    well on the programming assignments.


    C provides logical operators that allow us to express such compound conditions.
    The three logical operators in C are:


    +   - && - and

    +   - || - or

    +   - ! - not (unary negation operator)


    Logical statement can be analyzed using a truth table that lists all possible
    values for the conditions (variables):


    # Truth Table: Logical And Operator (&&)


    | p | q | p && q |

    |---|---|---|

    | True | True | True |

    | True | False | False |

    | False | True | False |

    | False | False | False |


    # Truth Table: Logical Or Operator (||)


    | p | q | p || q |

    |---|---|---|

    | True | True | True |

    | True | False | True |

    | False | True | True |

    | False | False | False |'
  merge: -1
  img_proc: true
- pgno: 82
  md: "# Truth Table: Logical Negation Operator (!)\n\n| p | !p |\n|---|---|\n| True\
    \ | False |\n| False | True |\n\nIn C, logical operators are frequently used to\
    \ combine relational operators to build larger expressions:\n\n```\nif (x < 20\
    \ && x > 10)\n```\n\nExpressions using the logical operators are evaluated left\
    \ to right and evaluation stops as soon as the truth or falsehood of the result\
    \ is known. In other words, logical expressions evaluate their left hand operand,\
    \ and then only evaluate the right hand one if this is required.\n\nNote that\
    \ false && anything is always false; True || anything is always true.) In such\
    \ cases the second test is not even evaluated. This is referred to as a short-circuit.\
    \ Negation (!) operates on a single logical value and its effect is to reverse\
    \ its state. Here is an example of its use:\n\n```\nif (!acceptable) {\n    printf(\"\
    Not Acceptable!\\n\");\n}\n```\n\nThe precedence of logical operators is below\
    \ that of the relational operators. Therefore, we can write the following code\
    \ without parenthesis:\n\n```\na < b && c < d\n```\n\nThe result of any logical\
    \ expression is either:\n\n```\n0 - false\nnon-zero - true\n```"
  merge: -1
  img_proc: true
- pgno: 83
  md: 'The unary negation operator (!) produces a 1 when the operand is false (zero)
    and a zero when the operand is true (non-zero):


    ```

    !0 = 1

    !1 = 0

    ```


    Note that !a means the same as a==0. Rather than writing code like this:


    ```

    if (a == 0)

    ```


    C programmers like to write code like this:


    ```

    if (!a)

    ```


    Both statements have the same meaning.


    Note that the unary negation operator (!) is not the same as the mathematical
    not operator. In mathematics:


    ```

    not (not (s)) = s

    ```


    while in C:


    ```

    !15 = -1

    0

    ```


    Why?


    ```

    !15 = !(15) = !(0) = 1

    ```'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'As mentioned previously, in the evaluation of logical expressions, the evaluation
    process stops as soon as the outcome, true or false, is known (short circuit.)


    For example, if `expr1` is false (0), then in the statement:


    ```

    expr1 && expr2

    ```


    expr2 will not be evaluated because the value of the logical expression is already
    determined to be zero.


    Likewise, if `expr1` is true (non-zero), then in the statement:


    ```

    expr1 || expr2

    ```


    expr2 will not be evaluated because the value of the logical expression is already
    determined to be 1.


    # De Morgan''s Laws


    De Morgan''s Laws can sometimes make it more convenient for us to express a logical
    expression. De Morgan''s Laws can be expressed mathematically as follows:


    ```

    ~(P or Q) = ~P and ~Q

    ~(P and Q) = ~P or ~Q

    ```


    In C, these laws state that the expression:


    ```

    !(condition1 && condition2)

    ```


    is logically equivalent to the expression:


    ```

    (!condition1 || !condition2)

    ```'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'Also, the expression:


    ```

    !(condition1 || condition2)

    ```


    is logically equivalent to the expression:


    ```

    (!condition1 && !condition2)

    ```


    To summarize:


    ```

    !(condition1 && condition2) = (!condition1 || !condition2)

    !(condition1 || condition2) = (!condition1 && !condition2)

    ```


    See if you can apply DeMorgan''s Law to the following expression:


    ```

    !(x > 5) || !(y > 7)

    ```'
  merge: -1
  img_proc: true
