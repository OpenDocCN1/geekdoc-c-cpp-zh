- pgno: 125
  md: '# User-Defined Functions


    A function is a subprogram that carries out a particular task. Its purpose is
    to group together a related set of statements that performs some well-defined
    step in an algorithm.


    We have already seen examples of functions that are built into C such as:


    ```

    printf() . . . . . . . . fopen() . . . . . . . . isdigit()

    scanf() . . . . . . . . fclose() . . . . . . . . isupper()

    fprintf() . . . . . . . . islower()

    toupper()

    tolower()

    ```


    But C also gives us the ability to create our own functions. Suppose we wanted
    to write a program to display different geometric shapes. We could create our
    own function, drawRectangle(), to display a rectangle:


    ```

    // Displays a rectangle.

    void drawRectangle() {

    printf("*************\n");

    printf("**\n");

    printf("**\n");

    printf("**\n");

    printf("*************\n");

    }

    ```


    We could create our own function, drawTriangle(), to display a triangle:


    ```

    // Displays a triangle.

    void drawTriangle() {

    printf(" * \n");

    printf(" * * \n");

    printf(" * \n");

    printf(" * \n");

    printf("*********\n");

    }

    ```'
  merge: -1
  img_proc: true
- pgno: 126
  md: "We could create our own function, drawCircle(), to display a circle:\n\n```\n\
    ```c\n// Display a circle.\nvoid drawCircle() {\n    printf(\" ***** \\n\");\n\
    \    printf(\" *   * \\n\");\n    printf(\" *   * \\n\");\n    printf(\" *   *\
    \ \\n\");\n    printf(\" ***** \\n\");\n}\n```\n```\n\nThere are three things\
    \ we must do to create our own user-defined functions.\n\n# 1. Declare the Function.\n\
    \nWe do this with a function prototype, which declares the function so that the\
    \ compiler knows about it. This declaration provides a complete description of\
    \ the function interface. Function prototypes usually precede main() and they\
    \ tell the compiler, and us, what a function will do, but not how it will do it.\n\
    \n# 2. Write the Function Definition.\n\nThe function definition consists of comments,\
    \ a header and a body. The header is virtually a repeat of the prototype. The\
    \ body contains the executable statements for the function.\n\n# 3. Write the\
    \ Call(s) to the Function.\n\nThese calls cause the function to execute and return\
    \ values (if there are any values to be returned). While there is one prototype\
    \ and one definition per function, there may be many calls, with different arguments.\n\
    \nLet's look at an example of a function that calculates the area of a rectangle.\n\
    \n# 1. Declare the Function.\n\nFirst we declare a function prototype. The prototype\
    \ is the interface (sometimes called the signature) of the function and also declares\
    \ how the function must be used. It tells the compiler all it needs to know to\
    \ properly translate the calls to the function. (We will better understand why\
    \ this is important when we write functions with arguments)."
  merge: -1
  img_proc: true
- pgno: 127
  md: 'The function prototype specifies the function return type, the function name
    and the number and type of arguments (formal parameters). The general form of
    the function prototype is as follows:


    ```

    returnType functionName (formal-argument-list);

    ```


    The function prototype for the function to calculate the area of a rectangle would
    look like this:


    ```

    int calcRectArea(int length, int width);

    ```


    The function prototype provides the following information:


    +   * The function return value (i.e., the calculated area of the rectangle) will
    be of data type int.

    +   * The function name is calcRectArea().

    +   * The formal argument list contains two formal parameters, length and width,
    each of which is of data type int.


    Note that the formal parameter list of a function prototype can optionally omit
    the names of the formal parameters:


    ```

    int calcRectArea(int, int);

    ```


    The function prototype is placed in the code before function main() and has a
    semi-colon at the end of the line.


    Note that just as we are not allowed to use an identifier (a variable) without
    first declaring the variable to be of a particular data type, we are not allowed
    to use a function without first declaring a function prototype.'
  merge: -1
  img_proc: true
- pgno: 128
  md: "# 2. Write the Function Definition.\n\nThe second thing we must do in writing\
    \ our own function is to provide the function definition or implementation. The\
    \ function definition consists of comments, a header and a body. The general form\
    \ of the function body is as follows:\n\n```\n// Function comments\nreturnType\
    \ functionName (formal-argument-list) {\n    executable-statements;\n    return\
    \ (return-value);\n}\n```\n\nThe function definition to calculate the area of\
    \ a rectangle would look like this:\n\n```\n// Calculates area of a rectangle\
    \ given its length and width.\n// Returns the area of a rectangle.\nint calcRectArea(int\
    \ length, int width) {\n    int area;\n    area = length * width;\n    return\
    \ area;\n}\n```\n\n+   * The function comments describe what the function accomplishes\
    \ as well as what the return value (if any) represents. The comments inform us\
    \ that the function calculates the area of a rectangle given its length and width.\
    \ The comments also inform us that the function returns an int that represents\
    \ the area of the rectangle.\n+   * The function returns the calculated area of\
    \ the rectangle and the return value is of data type int.\n+   * The function\
    \ name is calcRectArea().\n+   * The function formal argument list consists of\
    \ an int type in the first position, length, and an int type in the second position,\
    \ width. This means that the function is expecting two input arguments with the\
    \ first of type int and the second of type int."
  merge: -1
  img_proc: true
- pgno: 129
  md: 'Note that even though the first argument is named `length` and the second argument
    is named `width`, there is no connection between these names and the names of
    the actual arguments passed in the call to the function itself! More on this soon.


    When the function is invoked, storage for the formal parameters, `length` and
    `width`, will be allocated and the storage will be initialized to the values that
    were passed into the function when the function was called.


    Note that the arguments, `length` and `width`, are local variables that are "visible"
    inside the function and can be used within the function but nowhere else in the
    program.


    Note that while the names of the formal parameters are optional in the function
    prototype, they must be included in the function header.


    The function body contains the statements that will be executed when the function
    is called or used. The function uses curly braces `{ }` to indicate the beginning
    and ending of the function body. Note that there is no semi-colon at the end of
    the function body!


    In our function, the executable statements include the declaration of an `int`
    variable called `area`. The function also performs a calculation of the area of
    the rectangle. The calculated value of the rectangle''s area is assigned to variable
    `area`.


    The return value is the value returned by the function to the calling program
    code. Our function returns an `int` to the calling program code.


    In summary, our function body declares a variable named `area`, calculates the
    area using the height and width passed in as arguments and returns the calculated
    area to the calling program code. Note that the function is placed in the program
    after the end of the `main()` function.'
  merge: -1
  img_proc: true
