  md: '# Streams


    The C language itself does not have any special statements for performing I/O
    operations. All I/O operations must be carried out through function calls to the
    standard I/O library.


    ```

    #include <stdio.h>

    ```


    contains declarations and macro definitions associated with the standard I/O library.


    Each program starts its execution with access to three file streams of data: one
    for input and two for output:


    +   - stdin (standard input) – the usual source of input characters (keyboard)

    +   - stdout (standard output) – the usual destination for output characters (screen)

    +   - stderr (standard error output) – where error messages are send (screen)


    ![](img/7f36c52b5170b89b142dbb7b1ea4666b_194_0.png)


