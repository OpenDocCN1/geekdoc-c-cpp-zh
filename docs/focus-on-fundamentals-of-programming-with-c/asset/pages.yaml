- pgno: 323
  md: '# Summary


    There is a very close connection between arrays and pointers. Keep in mind the
    following equalities:


    ```

    num + 2 == &num[2]    // same address.

    and

    *(num + 2) == num[2]    // same value

    ```


    We can therefore use a pointer to identify an individual element of an array and
    get its value.


    Be sure not to confuse:


    ```

    *(num + 2)

    ```


    which is the value of the third element of num with


    ```

    *num + 2 => ...

    ```


    which adds 2 to the value of the first element of num.


    Also keep the following in mind:


    ```

    *(++ptr) -> ...

    ```


    first increments ptr and then fetches the data it points to, while


    ```

    *ptr++ -> ...

    ```


    fetches the data pointed to by ptr before the pointer itself is incremented.'
