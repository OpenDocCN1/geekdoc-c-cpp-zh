- pgno: 415
  md: "# Manipulating Entire Structures\n\nEntire structures can be manipulated, but\
    \ only in limited ways.\n\n+   - A `struct` of one type may be assigned to a `struct`\
    \ of the same type.\n+   - A `struct` may be passed by value or by reference to\
    \ a function.\n+   - A `struct` may be returned from a function (using the return\
    \ statement).\n\nKeep in mind, however, that you cannot do things like displaying\
    \ an entire `struct` or read data into an entire `struct` without using a function\
    \ to do the work.\n\n# Assigning Structures\n\nStructures can be assigned in expressions\
    \ as follows:\n\n```\ntypedef struct {\n    int month;\n    int day;\n    int\
    \ year;\n} Date;\n\nint main(void) {\n    Date today, appt;\n\n    today.month\
    \ = 5;\n    today.day = 27;\n    today.year = 2013;\n\n    appt = today;\n\n \
    \   ...\n\n    return 0;\n}\n```\n\nThe statement:\n\n```\nappt = today;\n```"
  merge: -1
  img_proc: true
- pgno: 416
  md: "is equivalent to the following three statements:\n\n```\napt.month = today.month;\n\
    aptday = today.day;\naptyear = today.year;\n```\n\n# Passing a Structure to a\
    \ Function by Value\n\nStructures can also be passed as function arguments and\
    \ returned as function values. When structures are arguments to functions, they\
    \ are passed by value. A local value of the structure is made and all changes\
    \ are to the local copy. (Note that this implies that arrays can be passed by\
    \ value by making them a member of a structure.)\n\n```\n#include <stdio.h>\n\n\
    typedef struct {\n    int month;\n    int day;\n    int year;\n} Date;\n\nvoid\
    \ foo(Date now);\n\nint main(void) {\n    Date today = { 5, 27, 2013 };\n    foo(today);\n\
    \    return 0;\n}\n\nvoid foo(Date now) {\n    printf(\"month = %d day = %d year\
    \ = %d\\n\", now.month,\n           now.day, now.year);\n}\n```"
  merge: -1
  img_proc: true
- pgno: 417
  md: "# Passing a Structure to a Function by Reference\n\nStructures can also be\
    \ passed to a function by reference. Therefore any changes made to the structure\
    \ in the function that it was passed to will be reflected back to the calling\
    \ function.\n\n```\n#include <stdio.h>\n\ntypedef struct {\n    int month;\n \
    \   int day;\n    int year;\n} Date;\n\nvoid foo(Date *now);\n\nint main(void)\
    \ {\n    Date today = { 5, 27, 2013 };\n    printf(\"month = %d day = %d year\
    \ = %d\\n\", today.month,\n           today.day, today.year);\n    foo(&today);\n\
    \    printf(\"month = %d day = %d year = %d\\n\", today.month,\n           today.day,\
    \ today.year);\n\n    return 0;\n}\n\nvoid foo(Date *now) {\n    (*now).month\
    \ = 7;\n    (*now).day = 29;\n    (*now).year = 2014;\n}\n```\n\nHere's a look\
    \ at the output:\n\n```\nmonth = 5 day = 27 year = 2013\nmonth = 7 day = 29 year\
    \ = 2014\n```\n\nNote that if a `struct` is passed by reference, we must use the\
    \ dereference operator, *, to access the value in each of the fields. Because\
    \ the selection operator (period) has precedence over the dereference operator,\
    \ we must use parentheses around the name of the structure and the dereference\
    \ operator. However, the use of the selection operator (the period) with enclosing\
    \ parentheses becomes quite awkward and so a new, simpler operator has been added\
    \ to C for just this purpose. It's referred to as the arrow operator and is made\
    \ up of a hyphen and a greater than symbol."
  merge: -1
  img_proc: true
- pgno: 418
  md: "We can rewrite the function in the above example as follows:\n\n```\nvoid foo(Date\
    \ *now) {\n    now->month = 7;\n    now->day = 29;\n    now->year = 2014;\n}\n\
    ```\n\nSo the selection operator ( . ) is used to access a member of a struct,\
    \ while the arrow operator ( -> ) is used to access a member of a struct that\
    \ is referenced by a pointer."
  merge: -1
  img_proc: true
- pgno: 419
  md: "# Struct Example: Today's Date and Tomorrow's Date\n\nLet's construct a program\
    \ that accepts as input today's date and outputs tomorrow's date. We can develop\
    \ a general algorithm for the flow of control of the program as follows:\n\n```\n\
    Input todays date.\nCalculate tomorrow's date.\nOutput today's date.\nOutput tomorrow's\
    \ date.\n```\n\nAs our program will be working with dates, it seems natural to\
    \ model the concept of a date into our program by creating a new data type, Date,\
    \ which will allow us to create multiple Date structures.\n\n```\ntypedef struct\
    \ {\n    int month;\n    int day;\n    int year;\n} Date;\n```\n\nOur algorithm\
    \ above now becomes the code for our main() function:\n\n```\nint main(void) {\n\
    \    Date today, tomorrow;\n    getTodaysDate(&today);\n    getTomorrowsDate(today,\
    \ &tomorrow);\n    printf(\"Today: \");\n    outputDate(today);\n    printf(\"\
    Tomorrow: \");\n    outputDate(tomorrow);\n    return 0;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 420
  md: "Let's first work on our I/O functions. Note that we've created a Date struct\
    \ called today that will hold today's date. We must pass this struct by reference\
    \ to the getTodaysDate() function that will prompt the user for the current month,\
    \ day, and year.\n\n```\nvoid getTodaysDate(Date *today) {\n    printf(\"Enter\
    \ today's date mm/dd/yyyy: \");\n    scanf(\"%d/%d/%d\", &today->month, &today->day,\
    \ &today->year);\n}\n```\n\nSince today is defined as a pointer to a Date struct,\
    \ we must use the arrow operator to dereference the struct and access each of\
    \ the components of the struct. However, because each of the component variables\
    \ today->month, today->day, and today->year are being used within a scanf() statement,\
    \ we must use the address-of operator (&) with each of the variables as scanf()\
    \ requires the address of variables.\n\nNote the scanf() format string for reading\
    \ in data:\n\n```\n\"%d/%d/%d\"\n```\n\nSpecifying a non-format character such\
    \ as '/' signals to the scanf() function that the '/' is expected as input. This\
    \ is shown in the input prompt in the preceding printf() statement:\n\n```\nmm/dd/yyyy\n\
    ```\n\nOur output function is simpler as we can pass by value the Date struct\
    \ we wish to output.\n\n```\nvoid outputDate(Date d) {\n    printf(\"%d/%d/%d\\\
    n\", d.month, d.day, d.year);\n}\n```"
  merge: -1
  img_proc: true
- pgno: 421
  md: "Next is our function to calculate tomorrow's date. We'll have to be careful\
    \ when today's date falls at the end of a month or at the end of a year. We can\
    \ easily determine if today's date falls at the end of a month by setting up an\
    \ array of days in each month.\n\n```\nint daysPerMonth[] = { 31, 28, 31, 30,\
    \ 31, 30, 31, 31, 30, 31, 30, 31 };\n```\n\nA lookup inside the array for a particular\
    \ month will then give the number of days in that month. For each month i, the\
    \ value contained in daysPerMonth[i-1] corresponds to the number of days in that\
    \ particular month.\n\nIf it is determined that today's date falls at the end\
    \ of the month, then we can calculate tomorrow's date by adding 1 to the month\
    \ number and setting the value of the day to 1.\n\n```\nIncrement day.\nIf day\
    \ is greater than the number of days in the month\n    Set day to 1.\n    Increment\
    \ month.\n```\n\nWe also must solve the problem of a date occurring at the end\
    \ of the 12th month. If this is the case, not only must we set the value of the\
    \ day to 1, we must also set the value of the month to 1 and increment the year\
    \ by 1.\n\n```\nIncrement day.\nIf day is greater than the number of days in the\
    \ month\n    Set day to 1.\n    Increment month.\n    If month is now greater\
    \ than 12\n        Set month to 1.\n        Increment year.\n```"
