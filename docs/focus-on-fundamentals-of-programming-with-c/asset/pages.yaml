- pgno: 373
  md: '# # Grep Lab


    For more practice with command-line arguments, write a program, `grep.c`, which
    searches a file, or a group of files, for a pattern and outputs each line of the
    file that contains an instance of the pattern. Your program should prefix the
    filename to each line that matches, so you can tell in which file the match takes
    place.


    The syntax for the `grep` command is:


    ```

    grep [option] pattern file(s)

    ```


    where `option` consists of one or more single characters preceded by a hyphen,
    `pattern` consists of the text to search for, and `file(s)` tells `grep` which
    file or files to search.


    The following options should be recognized:


    +   -v **Non-match**: Only non-matching lines are printed. Only lines that do
    not contain the search string are considered to be non-matching lines.


    +   -i **Ignore case**: `grep` ignores upper/lowercase differences. `grep` treats
    all letters a-z as being identical to the corresponding letters A-Z in all situations.


    +   -n **Numbers**: Each matching line that `grep` prints is preceded by its relative
    line number in the file.


    +   -c **Count only**: Only a count of matching lines is printed. For each file
    that contains at least one matching line, `grep` prints the file name and a count
    of the number of matching lines. Matching lines are not printed.


    +   -l **List match files**: Only the name of each file containing a match is
    printed. After `grep` finds a match, it prints the filename and processing immediately
    moves on to the next file.


    Note that matches will not cross line boundaries (i.e., a match must be contained
    on a single line). Be sure to include appropriate error checking routines in case
    the requested files do not exist.'
  merge: -1
