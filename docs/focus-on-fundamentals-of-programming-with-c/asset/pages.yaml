- pgno: 507
  md: '# # Calculating Very Large Factorials Lab


    This assignment will focus on the manipulation of linear linked lists. You are
    to write a C program which queries the user for an integer, n, and returns the
    exact value of that integer''s factorial, n!. The limit to the size of n can be
    quite large (up to 9,999), producing factorials containing hundreds and thousands
    of digits. Needless to say, our methodology will circumvent the inherent representation
    limitations of integers and longs in our programming languages.


    # ## The Storage of n!


    Factorials will be stored in linear linked lists in which each node contains two
    fields. The first field, info, will hold an integer containing a value from 0
    through 999. The second field, next, holds a reference to the next node in the
    linear linked list. To be certain that the nature of this storage plan is correctly
    conceptualized, depicted below are the representations of 10! and 15!:


    ```

    10! = 3,628,800


    | 3 |=====>| 628 |=====>| 800 |=====>X


    15! = 1,307,674,368,000


    | 1 |=====>| 307 |=====>| 674 |=====>| 368 |=====>| 000 |=====>X

    ```


    Note that by storing only three digits per node, the placement of commas in the
    output is readily accomplished as just another action in stepping from one node
    to the next.


    # ## Multiplication


    Suppose that the value of 15! is to be multiplied by 6. The value of 15!, stored
    in a linked list, is the multiplicand. The 6, stored as an ordinary scalar, is
    the multiplier. The multiplicand is always held in a linked list, and the multiplier
    is always a numeral between 0 and 9. The action consists of a sequence of individual
    multiplications where the number from a nodes info field is multiplied by the
    fixed multiplier. There are as many individual multiplications as there are nodes
    in the list holding the multiplicand.'
