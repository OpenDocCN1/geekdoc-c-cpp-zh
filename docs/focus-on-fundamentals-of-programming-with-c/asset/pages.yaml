  md: "# Break Statement\n\nThe break statement is available within the while, do\
    \ while, for, and switch statements. It serves in each of these constructs as\
    \ a jump to the end of the statement. It causes an exit from a loop just as it\
    \ does from a switch statement. After the break is executed, program control jumps\
    \ to the statement following the loop. For example:\n\n```\nfor (i = 0; i < num;\
    \ ++i) {\n    if (i > 100) {\n        break;\n    }\n    sum += i;\n}\n```\n\n\
    Note that each time you code a break (with the exception of the switch statement),\
    \ you should question whether there is not a straightforward way to express the\
    \ same logic without the break. We can modify the code above without using a break\
    \ as follows:\n\n```\nfor (i = 0; i < num && i <= 100; ++i) {\n    sum += i;\n\
    }\n```\n\nHere's another example. Suppose we want to look for the first whitespace\
    \ character (blank, tab, or newline) in a string s:\n\n```\n// misuse of break\n\
    for (i = 0; i < max; ++i) {\n    if (s[i] == ' ') {\n        break;\n    } else\
    \ if (s[i] == '\\t') {\n        break;\n    } else if (s[i] == '\\n') {\n    \
    \    break;\n    }\n}\n```"
  merge: -1
  img_proc: true
