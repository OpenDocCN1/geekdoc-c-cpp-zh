  md: "# Linear Linked List Examples\n\n# Example 1\n\nSuppose we wanted to delete\
    \ all occurrences of the number 4 from a linear linked list. We would have to\
    \ traverse the list for nodes with 4 in the info field and delete that node. But\
    \ to delete a node, its predecessor must be known. Therefore we must use two pointers,\
    \ p and q, to traverse the list. p will be considered the lead pointer and q will\
    \ be considered the lag pointer; i.e., p will traverse the list and q will always\
    \ point to the predecessor of p. Note the practice of using two pointers, one\
    \ following the other, is very common when working with lists.\n\nTwo functions\
    \ will be used:\n\n+   - deleteFront() will be used to delete the node from the\
    \ front of the list.\n+   - deleteAfter() will be used to delete a node from the\
    \ middle of the list.\n\n```\np = list\nq = NULL\nwhile p != NULL\n  if info(p)\
    \ == 4\n    p = next(p)\n    if p == NULL\n      deleteFront(list)\n    else\n\
    \      deleteAfter(q)\n  else\n    q = p\n    p = next(p)\n```\n\nIt is left as\
    \ an exercise to work through the algorithm. Be sure to draw pictures as you work\
    \ through the algorithm line by line."
