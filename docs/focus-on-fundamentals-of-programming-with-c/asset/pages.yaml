  md: "# Function Parameters\n\nThe value that is being passed to a function is called\
    \ an *argument* or an *actual parameter*. The argument that appears in the function\
    \ header is referred to as the *formal parameter*. We say that the actual parameter\
    \ is passed to the formal parameter.\n\nFunction arguments are always passed *by\
    \ value* in C. Each argument is evaluated and its value is used locally in place\
    \ of the formal parameter in the function header. Therefore if an argument is\
    \ passed to a function, the stored value of that argument will not be changed\
    \ in the calling environment. For example:\n\n```\n```c\n#include <stdio.h>\n\n\
    int main(void);\nvoid Foo(int num);\n\nint main(void) {\n    int num = 5;\n  \
    \  printf(\"%d\\n\", num);\n    foo(num);\n    printf(\"%d\\n\", num);\n    return\
    \ 0;\n}\n\nint foo(int num) {\n    printf(\"%d\\n\", num);\n    num = num + 1;\n\
    \    printf(\"%d\\n\", num);\n}\n```\n```\n\nproduces the following output:\n\n\
    ```\n5\n6\n5\n5\n```\n\nIf we want to pass an argument *by reference* (i.e., change\
    \ the value of the argument in the function and have that new value be reflected\
    \ back in the calling function), we must pass the *address* of the argument to\
    \ the function, rather than the argument itself. Once the function has access\
    \ to the memory location that is"
  merge: -1
  img_proc: true
- pgno: 233
  md: "used to store the actual parameter, it can modify its contents, and thus modify\
    \ the actual parameter.\n\nFor example:\n\n```\n#include <stdio.h>\n\nint main(void):\n\
    void foo(int *num);\nint num = 5;\n\n    printf(\"%d\\n\", num);\n    foo(&num);\n\
    \    printf(\"%d\\n\", num);\n\n    return 0;\n}\n\nvoid foo(int *num) {\n   \
    \ printf(\"%d\\n\", *num);\n    *num = *num + 1;\n    printf(\"%d\\n\", *num);\n\
    }\n```\n\nproduces the following output:\n\n```\n5\n5\n6\n6\n```\n\nNote that\
    \ the value of the actual parameter has been changed by the call to foo().\n\n\
    In order to pass by reference, we must first pass the address of the actual parameter\
    \ to the function. This is accomplished by using the address of operator (&).\
    \ When & is placed in front of a variable, it returns the address of that variable.\n\
    \nSo in the call from main():\n\n```\nfoo(&num);\n```"
