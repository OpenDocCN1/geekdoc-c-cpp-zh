- pgno: 258
  md: "# Sieve of Eratosthenes 埃氏筛（简单预置算法表）\n\nThe Sieve of Eratosthenes algorithm\
    \ for generating prime numbers was developed by a Greek scholar, Eratosthenes,\
    \ who lived from about 275 B.C. to about 195 B.C. Around 240 B.C. Eratosthenes\
    \ became the head of the library at Alexandria, Egypt, the most advanced center\
    \ of learning that then existed in the world. He was widely known for his talents\
    \ in poetry, drama, literature, geography, philosophy, and astronomy. Eratosthenes\
    \ created accurate maps of the known world, calculated the circumference of the\
    \ Earth and the tilt of its axis, and determined the size and distance from the\
    \ Earth to the sun and the moon.\n\nThe sieve algorithm shown below generates\
    \ and counts prime numbers from 1 to 1000 by setting up an array of all numbers\
    \ up to 1000, and then filters out all numbers that are not prime. Knowing that\
    \ 1, 2, and 3 are prime numbers, it filters out all multiples of 2 and 3. The\
    \ next number in turn that is reached and not filtered out is considered prime\
    \ and its multiples are then filtered out. The algorithm continues until nothing\
    \ is left but prime numbers.\n\n```\n#include <stdio.h>\n#define SIZE 1000\nint\
    \ main(void) {\n    int i, mult, count;\n    int flag[SIZE+1];\n    count = 1;\n\
    \    // Initialize flag array\n    for (i = 1; i <= SIZE; ++i) {\n        flag[i]\
    \ = 1;\n    }\n    // Iterate through array\n    for (i = 2; i <= SIZE; ++i) {\n\
    \        if (flag[i] == 1) { // Found a prime\n            ++count; // Count new\
    \ prime\n            mult = i;\n            // loop deletes all multiples of new\
    \ prime\n            while (mult <= SIZE) {\n                flag[mult] = 0;\n\
    \                mult = mult + i;\n            }\n        }\n    }\n    printf(\"\
    There are %d primes.\\n\", count);\n    return 0;\n}\n```\n\n+   1. 筛选要筛取值范围，故取从1到1000\n\
    +   2. 用2去筛，留下2，剔除2倍数\n+   3. 用3去筛，留下3，剔除3倍数\n+   4. 用5筛，留下5，剔除5倍数"
