  md: "# Example 2: Power Function\n\nHere's an example of a function that raises\
    \ an int to the power of an unsigned int and returns the result as a long:\n\n\
    ```\nlong power(int base, unsigned expon) {\n    int i;\n    long num = 1;\n \
    \   for (i = 0; i < expon; ++i) {\n        num *= base;\n    }\n    return num;\n\
    }\n```\n\nThe function follows a simple algorithm, multiplying base by itself\
    \ expon times. A for loop is used to control the number of multiplications, and\
    \ variable num stores the value to be returned.\n\nThe function header:\n\n```\n\
    long power(int base, unsigned expon)\n```\n\ninforms us the type of the return\
    \ value, long, the name of the function, power, and a list of arguments used by\
    \ the function, int base, unsigned expon. The arguments and their types are enclosed\
    \ in parentheses, each pair separated by commas.\n\n+   • The body of the function\
    \ is bounded by a set of braces. Any variables declared here will be treated as\
    \ local.\n\n+   • Upon reaching a return statement, control of the program returns\
    \ to the calling function. num is the value which is returned from the function.\
    \ If the final closing brace is reached before any return value, then the function\
    \ will return automatically, any return value will then be meaningless.\n\n+ \
    \  • The return value of a function is always converted to the type given by the\
    \ type specifier of the function. In this case the solution to the function is\
    \ being held in a long variable, num."
  merge: -1
