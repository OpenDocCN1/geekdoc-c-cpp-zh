- pgno: 118
  md: 'We can convert decimal 431 into hexadecimal:


    ![](img/7f36c52b5170b89b142dbb7b1ea4666b_118_0.png)


    So 431 decimal is equivalent to 1AF hexadecimal.


    # Binary to Hexadecimal Conversion


    Conversion of a binary number into hexadecimal is simply a matter of converting
    each nibble (4 bits) of the binary number into its hex equivalent. For example,
    let''s convert the binary number 0011010111111100 into its hexadecimal equivalent:


    | Binary: | 0011 | 0101 | 1111 | 1100 |

    |---|---|---|---|---|

    | Hex Equivalent: | 3 | 5 | F | C |


    So 0011010111111100 binary is equivalent to 35FC hexadecimal.


    # Hexadecimal to Binary Conversion


    To convert a hexadecimal number into its binary equivalent, we simply convert
    each hex digit in the number into its decimal equivalent. For example, let''s
    convert hexadecimal B72E into binary:


    | Hexadecimal: | B | 7 | 2 | E |

    |---|---|---|---|---|

    | Binary Equivalent: | 1011 | 0111 | 0010 | 1110 |


    So B72E hexadecimal is equivalent to 1011011100101110 binary.


    Note that a single hexadecimal digit can be used to represent 4 bits in a binary
    number. As a result, it becomes more convenient to represent 16-, 32-, or 64-bit
    memory addresses in hex notation rather than binary!'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# # Negative Numbers


    So far, we''ve only explored how positive numbers are represented internally in
    the computer''s memory. It''s now time to explore how negative numbers can also
    be represented. For example, if the value 6 is represented in memory as:


    ```

    00000110

    ```


    then how is -6 represented? One common suggestion is to make the high-order bit
    1 and leave all other bits unchanged, producing:


    ```

    10000110

    ```


    Unfortunately, this is incorrect. This can be shown by adding the two numbers
    together (6 + -6) which should produce 0.


    | Expression | Result |

    | :--- | :--- |

    | 00000110 = 6 | |

    | 10000110 = -6 | |

    | 10001100 = -12 | |


    According to this scheme, the sum of 6 + -6 equals -12, and not 0! We must find
    another representation for negative numbers.


    # ## Two''s Complement Notation


    The technique that computers use to represent negative numbers is called two''s
    complement notation. Given any positive number, we can determine its negative
    internal representation by calculating or taking its two''s complement. We do
    this in two steps:


    +   - flip all bits

    +   - add 1'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'For example, we can determine the internal representation of -6 by taking the
    two''s complement of 6:


    ```

    00000110   = 6

    11111001   flip all bits

    +      1   add 1

    -----------

    11111010   = -6

    ```


    According to this scheme, -6 is represented as:


    ```

    11111010

    ```


    We can test this by adding 6 and -6:


    ```

    00000110   = 6

    11111010   = -6

    +-----------

    100000000  = 0

    ```


    Note that we are only doing (8-bit arithmetic, so any final carry can be ignored).
    As another example, let''s determine how -25 is represented:


    ```

    00011001   = 25

    11100110   flip all bits

    +      1   add 1

    -----------

    11100111   = -25

    ```'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'Once again we can test this by adding together 25 and -25 and see if it produces
    zero:


    ```

    00011001   =  25

    11100111   = -25

    00000000   =   0

    ```


    Suppose we were given the 8-bit binary number.


    ```

    11010001

    ```


    and were asked to determine its decimal equivalent. We would not be able to do
    so unless we were told whether the number represented a signed or an unsigned
    value. If the number represents an unsigned value, then we use our simple algorithm
    to convert from binary to decimal by adding each of the appropriate powers of
    two:


    ```

    1 + 16 + 64 + 128 = 209

    ```


    If the number is representing a signed value, then we look at the leftmost high-order
    bit. If it is a 0, then the number is a positive number and we use the algorithm
    just mentioned and add each of the appropriate powers of two:


    ```

    1 + 16 + 64 + 128 = 209

    ```


    However, if the number represents a signed value and the leftmost high-order bit
    is a 1, then the number is a negative number being represented in its two''s complement
    notation. To determine what the negative number is, we must take its two''s complement
    by flipping the bits and adding 1:'
  merge: -1
  img_proc: true
- pgno: 122
  md: '```

    10101001   Original Number

    01010110   flip all bits

    + 1        add 1

    01010111   two''s complement

    ```


    So, the two''s complement of 10101001 is 01010111 which equals 47:


    ```

    1 - 2 - 4 - 8 - ... - 128 = -1

    ```


    Therefore if the two''s complement of our original number is 47, then our original
    number must equal -47.'
  merge: -1
