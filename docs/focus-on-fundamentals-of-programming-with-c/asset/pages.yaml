- pgno: 161
  md: "# Switch Statement\n\nThe switch statement is another multiple choice control\
    \ structure.\n\n+   • It can only be used in certain cases where only one variable\
    \ is tested. All branches must depend on the value of that variable.\n\n+   •\
    \ The variable must be an integral type such as int, long, short, or char.\n\n\
    +   • Each possible value of the variable can control a single branch. A final,\
    \ catch all, default branch may optionally be used to trap all unspecified cases.\n\
    \nHere's a simple calculator program that uses a switch statement:\n\n```\n#include\
    \ <stdio.h>\nint calc(int operand1, int operand2, char operator);\nint main(void)\
    \ {\n    int a, b;\n    char op;\n    printf(\"Enter two integers and an operator:\
    \ \");\n    scanf(\"%d %d %c\", &a, &b, &op);\n    calc(a, b, op);\n    return\
    \ 0;\n}\nint calc(int operand1, int operand2, char operator) {\n    switch (operator)\
    \ {\n        case '+':\n            printf(\"%d\\n\", operand1 + operand2); break;\n\
    \        case '-':\n            printf(\"%d\\n\", operand1 - operand2); break;\n\
    \        case '*':\n            printf(\"%d\\n\", operand1 * operand2); break;\n\
    \        case '/':\n            printf(\"%d\\n\", operand1 / operand2); break;\n\
    \    }\n    return 0;\n}\n```\n\nNote that at the end of each alternative section\
    \ of code there should be a break statement. The break statement prevents any\
    \ further statements from being executed by leaving the switch. Control jumps\
    \ to the closing brace after the switch statement. Actually, the most common way\
    \ to leave a switch statement is with a break or a return statement."
  merge: -1
  img_proc: true
