- pgno: 529
  md: "# Bitwise Negate\n\nThe bitwise-negate operator is a unary operator. That means\
    \ the operator requires only one operand. Its effect is to flip the bit of the\
    \ operand.\n\n| b | ~b |\n|---|---|\n| 0 | 1 |\n| 1 | 0 |\n\nFor example:\n\n\
    ```\n```c\n// negate1.c\n#include <stdio.h>\nint main(void) {\n    int x = 0x1234;\
    \    // 0001 0010 0011 0100\n    int y;\n    y = ~x;            // 1110 1101 1100\
    \ 1011\n    printf(\"y = 0x%x\\n\", y);\n    return 0;\n}\n```\n```\n\nThe output\
    \ of this program is:\n\n```\ny = 0xEDCB\n```\n\nRemember not to confuse the bit-negate\
    \ (~) operator with the arithmetic minus (-) operator or with the logical negation\
    \ (!) operator. For example, if x is equal to 0:\n\n```\n-x = 0\n!x = 1   (true)\n\
    ~x = -1  (when treated as a signed value)\n```"
  merge: -1
  img_proc: true
- pgno: 530
  md: 'Note that the result of bitwise-and, bitwise-or, and bitwise-exclusive-or does
    not depend on the word size of the computer, but the result of bit-negate does.
    We can use this to our advantage.


    Suppose we want to write a binary value which consists of all 1-bits except for
    the low-order 3-bits. We should write the value not as:


    ```

    0xFFF8 (16-bit value)

    ```


    nor as:


    ```

    0xfffffff8 (32-bit value)

    ```


    but as:


    ```

    ~7

    ```


    which is appropriate for any word size!!!


    When a bitwise operation is performed between two values that are of different
    sizes (long and short), the system aligns the operands on the right. If the shorter
    of the two items is a signed quantity, and the value is negative, the sign is
    extended to the left to match the number of bits contained in the larger sized
    value.


    Finally, the precedence of the bitwise operators (&, |, ^) falls below that of
    == and !=. This implies that bit-testing expressions like:


    ```

    if ((x & mask) == 0)

    ```


    must be fully parenthesized to give proper results.'
  merge: -1
  img_proc: true
- pgno: 531
  md: "# Left Shift Operator\n\nWhen a left shift (<<) operation is performed on a\
    \ value, the bits contained within the value are literally shifted to the left.\
    \ Bits that are shifted out through the high-order bit are lost and 0's are always\
    \ shifted into the low-order bit.\n\nFor example:\n\n```\n// lshift.c\n#include\
    \ <stdio.h>\nint main(void) {\n    int num = 3;       // 0000 0000 0000 0010\n\
    \    num = num << 1;    // 0000 0000 0000 0100\n    printf(\"num = %d\\n\", num);\n\
    \    return 0;\n}\n```\n\nIn the program above, all bits of num are shifted by\
    \ one position to the left. The output produced is:\n\n```\nnum = 6\n```\n\nNotice\
    \ that left shifting a value by one results in multiplying the value that is shifted\
    \ by 2. The left shift operation could also have been written as:\n\n```\nnum\
    \ <<= 1;\n```\n\nBelow is a function that outputs the bit representation of a\
    \ 16-bit int value:"
  merge: -1
  img_proc: true
- pgno: 532
  md: "```\n```c\n// bitpntr1.c\n\nint bitpntr1(int num) {\n    int i, mask;\n\n \
    \   mask = 1;\n    mask <= 15;\n    for (i = 1; i <= 16; i++) {\n        printf(num\
    \ & mask ? \"1\" : \"0\");\n        num <<= 1;\n    }\n\n    return 0;\n}\n```\n\
    ```\n\nUnfortunately this function is not portable due to the fact that the sizeof(int)\
    \ will vary on different computers. We thus modify the program to make it portable\
    \ to different computers as follows:\n\n```\n```c\n// bitpntr2.c\n\nint bitpntr2(int\
    \ num) {\n    int i, mask;\n\n    mask = 1;\n    mask <== (sizeof(int)*8)-1;\n\
    \    for (i = 1; i <= sizeof(int)*8; i++) {\n        printf(num & mask ? \"1\"\
    \ : \"0\");\n        num <<= 1;\n    }\n\n    return 0;\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 533
  md: "# Right Shift Operator\n\nThe right shift (>>) operator shifts the bits of\
    \ a value to the right. Bits that are shifted out of the low-order bit are lost.\
    \ Right shifting an unsigned value will always result in 0's being shifted in\
    \ on the left.\n\nFor example:\n\n```\n// rshift.c\n#include <stdio.h>\nint main(void)\
    \ {\n    int num = 12;      // 0000 0000 0000 1100\n    num = num >> 1;    //\
    \ 0000 0000 0000 0110\n    printf(\"%d\\n\", num);\n    return 0;\n}\n```\n\n\
    In the program above, all bits of num are right shifted by one position to the\
    \ right. The output produced is:\n\n```\nnum = 6\n```\n\nNotice that right shifting\
    \ a value by one results in dividing the value that is shifted by 2. The right\
    \ shift operation could also have been written as:\n\n```\nnum >>= 1;\n```\n\n\
    What is shifted in on the left for signed values depends on the sign of the value\
    \ that is being shifted and also how this operation is implemented on your system.\
    \ If the sign bit is 0 (positive value), then 0's will be shifted in, no matter\
    \ what system we're on. If the sign bit is 1, some computers will shift in 1's\
    \ (arithmetic right-shift) and some will shift in 0's (logical right shift)."
