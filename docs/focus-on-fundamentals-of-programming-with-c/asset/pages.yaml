- pgno: 580
  md: '# Messages


    ![](img/7f36c52b5170b89b142dbb7b1ea4666b_580_0.png)


    +   * Sending a message to an object is the way of asking an object to carry out
    one of its operations (methods).

    +   * When an object receives a message, it determines whether it has an appropriate
    method to allow it to respond to the message.

    +   * If it does, it performs the requested operation in any manner it knows.

    +   * The request does not specify HOW an operation is to be performed. Such information
    is always hidden from the sender.'
  merge: -1
  img_proc: true
- pgno: 581
  md: '# Objects Send Messages


    +   * An object-oriented financial application might see CUSTOMER objects sending
    debit and credit messages to ACCOUNT objects.

    +   * The ACCOUNT objects might then cooperate to maintain cash-on-hand, accounts
    receivable, and accounts-payable objects.


    # Objects and Messages


    +   * Objects respond to messages

    +   * All activity is a result of messages

    +   * Different objects can respond in different ways to the same message.

    +   * The implementation of one object cannot depend on the internal details of
    another object, only on what messages can be sent to an object and on how the
    object responds to messages.'
  merge: -1
  img_proc: true
- pgno: 582
  md: '# Object-Oriented Programming


    +   - OOP is programming by simulation

    +   - OOP is programming with objects

    +   - OOP is programming with messages

    +   - OOP is programming with classes


    # OOP Classes


    +   - Sometimes a simulation involves only a single example of a particular kind
    of object. It is much more common, however, to need more than one object of each
    kind.

    +   - But it would be extremely inefficient to redefine the same methods in every
    single occurrence of that object.

    +   - In OOP, classes abstract out these commonalities: objects that share the
    same behavior are said to belong to the same class.'
  merge: -1
  img_proc: true
- pgno: 583
  md: '# Objects Can Share Behavior


    +   - Savings accounts and checking accounts are both types of bank accounts ...
    they have balances.

    +   - Lead, silver, and platinum are all metals ... they have atomic weights.

    +   - Elephants, tigers, bears, horses, and cows are all mammals. They are vertebrates,
    warm blooded, and have hair on their bodies.


    # Classes


    +   - Whereas an individual object is a concrete entity that performs some role
    in the overall system, the class captures the structure and behavior common to
    all related objects.

    +   - A class represents a set of objects that share a common structure and a
    common behavior.'
  merge: -1
  img_proc: true
- pgno: 584
  md: '# # Classes Define Objects


    +   - Classes serve as templates from which objects can be created.


    +   - Every object belongs to a class that defines the type of object it is.


    +   - An object is an instance of its class.


    +   - Objects of the same class behave the same way and may have different states
    (data).


    +   - A message to an object is a request that it execute a specific function
    or algorithm (method).


    +   - Messages an object responds to are methods for the entire class.'
  merge: -1
  img_proc: true
