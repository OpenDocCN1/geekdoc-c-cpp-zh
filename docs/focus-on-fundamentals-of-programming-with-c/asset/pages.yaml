  md: "we are passing the address of num to function foo().\n\nNow look at the declaration\
    \ of the formal parameter for foo() in the function header. The * that appears\
    \ in front of num is saying that the value being passed to foo() is actually a\
    \ memory address rather than a data value. Now if we have a memory address and\
    \ want to actually get to the data value stored in that memory location, we must\
    \ use the indirection operator (*) to fetch it. The * is placed before the formal\
    \ parameter name in every place we try and access the formal parameter in the\
    \ function.\n\nHere's a program that swaps the value of two integers passed by\
    \ reference:\n\n```\n#include <stdio.h>\n\nvoid swap(int *x, int *y);\n\nint main(void)\
    \ {\n    int a, b;\n\n    a = 5;\n    b = 9;\n\n    printf(\"Before swap: a =\
    \ %d   b = %d\\n\", a, b);\n    swap(&a, &b);\n\n    printf(\"After swap: a =\
    \ %d   b = %d\\n\", a, b);\n\n    return 0;\n}\n\nvoid swap(int *x, int *y) {\n\
    \    int temp;\n\n    temp = *x;\n    *x = *y;\n    *y = temp;\n}\n```\n\nOur\
    \ program output looks like this:\n\n```\nBefore swap: a = 5   b = 9\nAfter swap:\
    \ a = 9   b = 5\n```"
