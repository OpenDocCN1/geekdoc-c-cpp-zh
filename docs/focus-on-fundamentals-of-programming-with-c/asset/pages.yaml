    Construct a C program, change.c, which computes the minimum number of bills and
    coins needed to make change for a particular purchase. The cost of the item is
    $21.17 and the amount tendered is $100.00. These values should be built into your
    program using assignment statements rather than input into the program during
    program runtime. Your program should indicate how many bills and coins of each
    denomination are needed for the change. You should make use of the following denominations:


    +   - Bills: twenty, ten, five, one

    +   - Coins: quarter, dime, nickel, penny


    Your program should make use of integer division as well as the modulus operator
    (%). Do not use subtraction in place of the modulus operator! Note that it will
    be easier to convert the cost and amount tendered into pennies so you can work
    with integers rather than doubles.


    Use the following guidelines to develop your program:


    +   - Declare your variables with appropriate data types.

    +   - Assign values to your variables.

    +   - Perform your calculations.

    +   - Generate appropriate output.


    # Points to Remember:


    Make sure you are creating a C program and not a C++ program. The .c suffix to
    your source code will invoke the C compiler while the .cpp suffix will invoke
    the C++ compiler. As this is a class in C and not C++, please make sure your source
    code uses the .c suffix.


    You should not be using any global variables in your program. A global variable
    is a variable declared outside of main().'
