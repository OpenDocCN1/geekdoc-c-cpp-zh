- pgno: 573
  md: '# # State and Behavior of an Object


    So objects are characterized by their state and the operations that can be performed
    on that state.


    This fundamental concept distinguishes OOP from procedural programming.


    # # OOP Objects


    In traditional programming systems, data and procedures are separate entities.
    The programmer is responsible for applying active procedures to passive data structures,
    and frequently for ensuring that the procedure will work correctly on the data
    types to which it is applied.


    By contrast, an OO programming system doesn''t view an object just as passive
