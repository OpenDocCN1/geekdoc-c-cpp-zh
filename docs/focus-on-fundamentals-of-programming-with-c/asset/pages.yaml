- pgno: 178
  md: "# For Statement\n\nThe for statement works well where the number of iterations\
    \ of the loop is known before the loop is entered. The head of the loop consists\
    \ of three parts separated by semicolons: initialization, test, and update.\n\n\
    ```\nfor (i = 1; i <= 100; i++)\n```\n\nThe first part is run before the loop\
    \ is entered. This is usually the initialization of the loop control variable.\n\
    \nThe second part is a test of the loop control variable. The loop is exited when\
    \ this test is no longer true.\n\nThe third part is the update of the loop control\
    \ variable. This is typically a statement that is executed every time the loop\
    \ body is completed. Usually this is an increment or decrement of the loop control\
    \ variable.\n\nHere's a look at the syntax of the for statement:\n\n```\nfor (initialExpression;\
    \ loopCondition; loopExpression) {\n    statement;\n}\n```\n\n+   - initialExpression\
    \ sets an initial value before the loop begins.\n+   - loopCondition specifies\
    \ condition(s) necessary to continue the loop.\n+   - loopExpression executes\
    \ each time after the body of the loop executes.\n\n# Example: Sum the integers\
    \ from 1 - 100\n\n```\nint i, sum = 0;\nfor (i = 1; i <= 100; ++i) {\n    sum\
    \ += i;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 179
  md: "In our example, variable i is the loop control variable and is initialized\
    \ to 1. If the loopCondition is true, i <= 100, then the body of the loop will\
    \ execute once. After the last statement of the loop body executes, the loopExpression\
    \ is executed. In this case, the value of i is incremented by 1. If the loopCondition\
    \ is still true, the body of the for loop will execute once again, etc.\n\nNote\
    \ that any or all of the expressions in a for statement can be missing, but the\
    \ two semicolons must always remain. For example, if the initialExpression is\
    \ missing, then no initialization step is performed as part of the for loop:\n\
    \n```\n// Compute the sum of integers from 1 - 10.\nint i = 1, sum = 0;\nfor (\
    \ i = 1; i <= 10; ++i ) {\n    sum += i;\n}\n```\n\nWhen the loopCondition is\
    \ missing, the rule is that the test is always true. Therefore the for loop below\
    \ is an infinite loop:\n\n```\nint i = 1, sum = 0;\nfor ( ; ; ) {\n    sum +=\
    \ i++;\n    printf(\"%d \", sum);\n}\n```\n\n![](img/7f36c52b5170b89b142dbb7b1ea4666b_179_0.png)"
  merge: -1
  img_proc: true
- pgno: 180
  md: "Note that a for statement can always be translated into an equivalent while\
    \ statement, and vice versa:\n\n```\n// for loop\nfor (initialExpression; loopCondition;\
    \ loopExpression)\n    statement;\n}\n\n// while loop\ninitialExpression;\nwhile\
    \ (loopCondition) {\n    statement;\n    loopExpression;\n}\n```\n\nBe sure not\
    \ to place a semicolon at the end of the header of the for loop:\n\n```\nint i,\
    \ sum = 0;\nfor (i = 1; i <= 100; ++i)\n    sum += i;\n```\n\nThis will create\
    \ a problem as the for loop will no longer have a body. The controlling aspects\
    \ of the loop will execute 100 times, in this case, but nothing will be done because\
    \ the loop body is empty.\n\nNote that when a for loop construct has only one\
    \ statement then the curly braces { } are optional. However, it's always a good\
    \ idea to use the curly braces even though they're not required."
  merge: -1
  img_proc: true
