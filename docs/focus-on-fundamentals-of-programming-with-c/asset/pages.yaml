- pgno: 359
  md: '# # Data Compression - Advanced


    Data compression is the technique of reducing the number of bits needed to store
    or transmit data. Compression can be either lossless or lossy. Lossless and lossy
    compression are terms that describe whether or not all original data can be recovered
    when a file is uncompressed or a data transmission is received.


    With lossless compression, every single bit of data that was originally in the
    file remains after the file is uncompressed. All of the information is completely
    restored. This is generally the technique of choice for text or spreadsheet files,
    where losing words or financial data could pose a problem. The Graphics Interchange
    File (GIF) is an image format used on the Web that provides lossless compression.
    Additional lossless compression algorithms are:


    +   TIFF - Zip - RAR - FLAC - LZW - Huffman Code - PNG - Morse Code


    On the other hand, lossy compression reduces a file by permanently eliminating
    certain information, especially redundant information. When the file is uncompressed,
    only a part of the original information is still there (although the user may
    not notice it). Lossy compression is generally used for video and audio, where
    a certain amount of information loss will not be detected by most users. The JPEG
    image file, commonly used for photographs and other complex still images on the
    web, is an image that has lossy compression. Using JPEG compression, the creator
    can decide how much loss to introduce and make a trade-off between file size and
    image quality. Additional lossy compression algorithms are:


    +   MP3 - JPG - DivX


    # ## Dictionary Compression


    By examining the relationships between successive data items in a dictionary,
    one can derive an efficient coding scheme to achieve a high level of data compression.
    The compression technique takes advantage of the fact that words in a dictionary,
    being in alphabetical order, tend to start with the same letters as their neighboring
    entries. The compression algorithm works as follows: each word in the compressed
    dictionary starts with a digit that indicates how many characters should be copied
    from the preceding word in the dictionary. The rest of the letters for the word
    follow the digit.'
  merge: -1
  img_proc: true
- pgno: 360
  md: 'For example, if the original dictionary contained only five words:


    ```

    can<LF>

    canal<LF>

    cancel<LF>

    cancer<LF>

    candid<LF>

    ```


    it would be compressed as follows:


    ```

    0can<LF>

    3al<LF>

    3cel<LF>

    5r<LF>

    3did<LF>

    ```


    In the encoded version of the dictionary, only those letters appear which do not
    occur successively in the previous word. The number in front of the trailing end
    of each word represents the number of characters that are the same. Decoding demands
    sequential reading so that the preceding word is once again available. The count
    preceding the word to be decompressed provides the number of leading characters
    to be retained and the unencoded characters are then concatenated.


    In the preceding example, the original dictionary contains 31 characters and the
    compressed version contains 22, for a space savings of 29%. Additional compression
    can be realized by reducing the number of newline characters, <LF>, at the end
    of each line. This can be achieved by outputting the words on one line until a
    predefined right margin is reached:


    ```

    0can3al3cel5r3did<LF>

    ```


    The compressed dictionary now contains 18 characters for a space savings of 42%.
    In practice, though, entries in an actual dictionary will be much closer to each
    other, lexicographically speaking, than those in this example, and the savings
    greater. With a larger dictionary, the compression ratio exceeds 50%.'
  merge: -1
  img_proc: true
- pgno: 361
  md: 'A limitation of this dictionary compression scheme is that in order to decompress
    a word from the dictionary you have to know what the previous word is, whose decompression
    in turn depends on the next previous word, and so on. In practice, though, dictionary
    access is not limited to serial searches from the beginning, since the first word
    starting with a new letter copies no letters from its predecessor. Thus, with
    26 pointers into the file, one to the start of the a''s through one to the start
    of the z''s, the dictionary can be searched quite rapidly. The pointer scheme
    may be extended with an index into the start of each two-letter pair (aa, ab,
    through zy, zz) so that even less of the dictionary must be read to look up a
    given word.


    The function below, compress(), carries out this compression algorithm on alphabetically
    ordered ASCII text files with one word per line. The dictionary must be all lower
    case. The range of digits from 0 to 9 is extended in ASCII sequence with a colon
    (:) interpreted as 10, a semicolon (;) interpreted as 11, and so on.


    The complementary function expand(), performs the inverse function. It produces
    an ASCII text file with one word per line from a file that has been compressed
    by compress().'
  merge: -1
  img_proc: true
