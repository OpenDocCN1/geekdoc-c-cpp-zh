- pgno: 496
  md: "# Polynomial Representation\n\nNote the following three preconditions for representing\
    \ a polynomial as a linear linked list:\n\n+   - Terms must be stored in order\
    \ of decreasing exponent within the linear linked list.\n+   - No two terms may\
    \ have the same exponent.\n+   - No term may have a zero coefficient.\n\nEach\
    \ node of the linear linked list will represent one term of the polynomial and\
    \ is a `struct` containing the following information:\n\n+   - coefficient\n+\
    \   - exponent\n+   - pointer to the next term of the polynomial\n\n```\ntypedef\
    \ struct poly {\n    float coeff;\n    int expn;\n    struct poly *next;\n} *POLYPTR;\n\
    ```\n\n# Adding Two Polynomials\n\nTo add two polynomials together, we only must\
    \ scan through them once each:\n\n+   - If we find terms with the same exponent\
    \ in the two polynomials, then we add the coefficients and copy the new term to\
    \ the end of the sum polynomial; otherwise we copy the term with the larger exponent\
    \ into the sum polynomial and continue.\n+   - When we reach the end of one of\
    \ the polynomials, we copy the remaining part of the other to the sum polynomial."
  merge: -1
  img_proc: true
- pgno: 497
  md: "+   • We must be careful not to include terms with 0 coefficient in the sum.\
    \ For example:\n+   \n+   6X^5 + 2X^4 + 3X^3 + 2X\n+   +\n+   3X^5 - 2X^4 - 5X^2\
    \ - 8X + 7\n+   9X^5 + 3X^4 - 5X^2 - 6X + 7\n\n```\n// poly.c\n\n#include <stdio.h>\n\
    \ntypedef struct poly {\n    float coeff;\n    int expon;\n    struct poly *next;\n\
    } *POLYPTR;\n\nPOLYPTR sum(POLYPTR p, POLYPTR q) {\n    float coeff;\n    POLYPTR\
    \ add = NULL;\n    while (p != NULL && q != NULL) {\n        if (p->expon == q->expon)\
    \ {\n            coeff = p->coeff + q->coeff;\n            if (coeff) {\n    \
    \            makeTerm(&add, coeff, p->expon);\n                p = p->next;\n\
    \                q = q->next;\n            }\n        } else if (p->expon > q->expon)\
    \ {\n            makeTerm(&add, p->coeff, p->expon);\n            p = p->next;\n\
    \        } else {\n            makeTerm(&add, q->coeff, q->expon);\n         \
    \   q = q->next;\n        }\n    }\n    while (p) {\n        makeTerm(&add, p->coeff,\
    \ p->expon);\n        p = p->next;\n    }\n    while (q) {\n        makeTerm(&add,\
    \ q->coeff, q->expon);\n        q = q->next;\n    }\n    return add;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 498
  md: "At several places in the algorithm we must create a new term with given coefficient\
    \ and exponent and place it at the end of the sum polynomial, that is, after the\
    \ term pointed to by `last`. Note that pointer `add` will always point to the\
    \ first term created and pointer `last` will always point to the last term of\
    \ the sum polynomial.\n\n```\nvoid makeTerm(POLYTR *add, float coeff, int expon)\
    \ {\n    POLYTR t;\n    POLYTR last = NULL;\n\n    t = (POLYTR) malloc(sizeof(struct\
    \ poly));\n    t->coeff = coeff;\n    t->expon = expon;\n    t->next = NULL;\n\
    \    if (last == NULL) {\n        *add = t;\n    }\n    else {\n        last->next\
    \ = t;\n    }\n    last = t;\n}\n```\n\nOther operations on polynomials can be\
    \ programmed as functions of the same general nature as our function for addition.\
    \ For extra credit, see if you can do the following:\n\n+   • Write a method that\
    \ will input a sequence of coefficients and exponents and form them into a linked\
