  md: 'The ASCII Codes are ordered and can be compared to each other in the same way
    that other numeric values can be compared to each other.


    ```

    Character: ''A'' < ''B'' < ''C'' < ''D''

    ASCII Code: 65 < 66 < 67 < 68


    Character: ''a'' < ''b'' < ''c'' < ''d''

    ASCII Code: 97 < 98 < 99 < 100


    Character: ''1'' < ''2'' < ''3'' < ''4''

    ASCII Code: 49 < 50 < 51 < 52

    ```


    The ordering of the ASCII codes from lowest to highest is called a collating sequence
    and allows character comparisons for things like alphabetic ordering.'
