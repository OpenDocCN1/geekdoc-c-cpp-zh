  md: "+   • Why was it a good idea to write `(float)ctemp` in the above expression\
    \ rather than just `ctemp`?\n\n# Summation Variables\n\nSuppose that we wish to\
    \ find the sum of the numbers from 1-1000. Not only will we need a counter variable\
    \ to control the number of times the while loop executes, but we will also need\
    \ a summation variable to accumulate the sum of the numbers that we have seen\
    \ so far.\n\n```\n// summation.c\n\n#include <stdio.h>\n\nint main(void) {\n \
    \   int count = 1;\n    int sum = 0;\n\n    while (count <= 1000) {\n        sum\
    \ += count;\n        ++count;\n    }\n\n    printf(\"The sum = %d.\\n\", sum);\n\
    \    return 0;\n}\n```\n\nProgram output is as follows:\n\nThe sum = 500500.\n\
    \nNote that variable used to store summations, or totals, should normally be initialized\
    \ to zero before being used in a program; otherwise the summation variable would\
    \ include the previous value stored in the summation variable's memory location.\
    \ This is due to the fact that an uninitialized variable usually contains a \"\
    garbage value\", i.e., the value last stored in the memory location reserved for\
    \ that variable.\n\n# Sentinel Controlled Loops\n\nSometimes we do not know in\
    \ advance how many times we want a loop to iterate. For example, suppose we want\
    \ to output the square and cube of numbers entered into the program. How can the\
    \ program determine when to stop"
