    # Numeric Escape Codes


    Numeric escape codes allow any character to be expressed by writing that character
    as its octal (base 8) encoding in the target character set. From 1 – 3 octal digits
    may be used to express the value of the character.


    For example:


    ```

    ''a'' may be written as ''\141''

    ''?'' may be written as ''\77''

    ```


    The null character, which is used to terminate strings, is represented as: ''\0''


    Numeric escape codes enables characters that may not be directly available from
    the keyboard to be coded into a character string. For example, we can sound three
    bells and display a message with:


    ```

    printf("\7\07\007 Attention!\n");

    ```


    Note that the numeric escape characters are only considered a single character
    inside a string. The character string:


    ```

    "\007\Hello\n"

    ```


    actually consists of 9 characters.


    Finally, we must be cautious when using numeric escape codes as a numeric escape
    code terminates when either 3 octal digits have been used or when the first character
    that is not an octal digit is encountered.'
