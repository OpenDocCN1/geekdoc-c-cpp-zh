  md: '+   • next(p) = next(q)


    ![](img/7f36c52b5170b89b142dbb7b1ea4666b_468_0.png)


    +   • freeNode(q)


    ![](img/7f36c52b5170b89b142dbb7b1ea4666b_468_1.png)


    Again, we cannot just be given a pointer to the node we want to delete. This is
    because the next field of the node''s predecessor must be changed to point to
    the node''s successor and there is no direct way of reaching the predecessor of
    a given node.


    Here''s the algorithm from above:


    ```

    q = next(p)

