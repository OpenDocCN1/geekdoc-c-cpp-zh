  md: "# Nesting Structures\n\nC allows us to nest structures, i.e., to define structures\
    \ within other structures. For example, suppose we want to keep track of the dimensions\
    \ of various rooms in a house. We can first define a Distance struct as follows:\n\
    \n```\ntypedef struct {\n    int feet;\n    float inches;\n} Distance;\n```\n\n\
    We can now define a Room struct that contains Distance variables as its components:\n\
    \n```\ntypedef struct {\n    Distance length; width;\n} Room;\n```\n\nWe now initialize\
    \ each of the fields of the struct variables:\n\n```\nint main(void) {\n    Room\
    \ bedroom, kitchen;\n\n    bedroom.length.feet = 25;\n    bedroom.length.inches\
    \ = 6;\n    bedroom.width.feet = 20;\n    bedroom.width.inches = 8.5;\n\n    kitchen.length.feet\
    \ = 15;\n    kitchen.length.inches = 3.25;\n    kitchen.width.feet = 10;\n   \
    \ kitchen.width.inches = 6;\n\n    return 0;\n}\n```"
