    # Floating Date Types (Floats and Doubles)


    Real or floating point numbers can be designated as either `float` or `double`.

    Floats or doubles can represent numbers that have a fractional component such

    as 1.01, 10.1654, -35.7, 450.333, etc. Note that the fractional component can
    be

    zero such as 3.0. Floating point (float or double) variables should be used

    whenever a numeric value can have a fractional component such as in

    mathematical operations involving division, etc.


    For example, we create a float variable called myFloat which we set equal to

    7.2.


    ```

    float myFloat = 7.2f;

    ```


    Note the letter f after the number. Now it would actually work without the f but

    it''s a good rule of thumb that if we want to set a `float`, we use the little
    f to be

    explicit about what we''re doing.


    The `double` data type is also floating point, but uses double the storage. A

    `float` is 4 bytes, a `double` is 8 bytes. `double` is used whenever the accuracy

    provided by a `float` is not sufficient.


    ```

    double myDouble = 7.2;

    ```


    Doubles provides double precision versus the single precision of floats. As on

    any computer system, we can lose precision with floating-point operation simply

    because of the way the computer stores this information. The representation of

    floating point numbers is not as accurate as the representation of integers.'
