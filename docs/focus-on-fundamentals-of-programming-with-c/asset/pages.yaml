- pgno: 312
  md: '# # Introduction to Pointers


    A simple variable in a program is stored in a certain number of bytes at a particular
    memory location or address in the machine. For example, if v is a variable, then
    &v is the address in memory of its stored value. In this context, the &v is referred
    to as the address-of operator. When placed in front of any variable, it represents
    the address in memory of that variable. &v is therefore considered a constant.


    A pointer variable is a variable holds the address of another variable. All pointer
    variables are typically the same size on any machine. Pointer variables can be
    declared in programs and then used to take addresses as values. For example:


    | int num; | integer variable |

    | :--- | :--- |

    | int *ptr; | pointer to integer variable |

    | ptr = &num; | address of integer variable assigned to pointer variable |

    | *ptr = 20; | |


    The type specification identifies the type of the variable pointed to and the
    asterisk identifies the variable itself as a pointer. Thus, the declaration:


    ```

    int *ptr;

    or

    int* ptr;

    ```


    says that ptr is a pointer variable and that the thing it points to, *ptr, is
    of type int.


    As previously mentioned, the address of operator, &, when followed by a variable
    name, gives the address of that variable. &num is therefore the address in memory
    of the variable num. The indirection operator is sometimes called the dereference
    operator, when followed by a pointer variable, gives the value stored at the pointed
    to address. It represents the thing being pointed to.'
  merge: -1
  img_proc: true
- pgno: 313
  md: '# Let''s analyze the following program:


    ```

    // pointer.c


    #include <stdio.h>


    (1) int main(void) {

    (2)     int x, y;

    (3)     int *ptr;


    (4)     x = 5;

    (5)     ptr = &x;

    (6)     y = *ptr;

    (7)     printf("x = %d   y = %d\n", x, y);

    (8)     return 0;

    (9) }

    ```


    Line (3) declares `ptr` to be a pointer variable that will contain the address
    of some `int` variable. Line (5) uses the address of operator to assign the address
    of the `int` variable `x` to pointer variable `ptr`. Line (6) uses the indirection
    operator to take the thing that `ptr` points to (an `int` value) and assigns it
    to `y`. We say that the pointer variable `ptr` is dereferenced and gives us the
    thing pointed to, i.e., 5, to use in the assignment statement. The effect of statements
    (5) and (6) are the same as if we had made the assignment `y = x;`, i.e., to assign
    the value of 5 to `y`.


    # The output of the program is:


    x = 5   y = 5


    In order to print a memory address in a C program, you can use the %p format specifier
    and pass printf() the address value you''d like to print.'
