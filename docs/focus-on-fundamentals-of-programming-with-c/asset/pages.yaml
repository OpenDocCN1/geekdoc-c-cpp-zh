  md: "We access the `info` field of the node as:\n\n```\np->info\n```\n\nand we can\
    \ access the `next` field of the node as:\n\n```\np->next\n```\n\nAs before, we\
    \ can use the `free()` function to dispose of the dynamically created node:\n\n\
    ```\nfree(p);\n```\n\nWork through the following program to create a linked list\
    \ containing five dynamically created nodes:\n\n```\n// dynamic.c\n\n#include\
    \ <stdio.h>\n#include <stdlib.h>\n\ntypedef struct node {\n    int info;\n   \
    \ struct node *next;\n} *NODEPTR;\n\nvoid main(void) {\n    int i;\n    NODEPTR\
    \ list, p, q;\n\n    list = (NODEPTR) malloc(sizeof(struct node));\n    p = list;\n\
    \    p->info = 1;\n\n    for (i = 2; i <= 5; i++) {\n        q = (NODEPTR) malloc(sizeof(struct\
    \ node));\n        q->info = i;\n        p->next = q;\n        p = q;\n    }\n\
    \    p->next = NULL;\n}\n```"
