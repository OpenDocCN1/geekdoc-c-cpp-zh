  md: "# Subtracting Pointers\n\nWhen a pointer is subtracted from another pointer,\
    \ the difference is divided by the size of the indirect value and the result (when\
    \ dealing with arrays) is the number of elements contained between the two pointers.\
    \ For example:\n\n```\n// diff.c\n#include <stdio.h>\nint main(void) {\n    double\
    \ num[100];\n    double *pa, *pb;\n    pa = num;\n    pb = pa + 3;\n    printf(\"\
    difference = %d\", pb - pa);\n    return 0;\n}\n```\n\nproduces the output:\n\n\
    ```\ndifference = 3\n```\n\nIf `ptr` points to some element in array `num`, then:\n\
    \n```\ni = ptr - num;\n```\n\nassigns to variable `i` the index number of the\
    \ element inside `num` that `ptr` points to. Therefore if `ptr` had been set pointing\
    \ to the 100th element in `num` by:\n\n```\nptr = &num[99];\n```\n\nthen the value\
    \ of `i` after:\n\n```\ni = ptr - num;\n```\n\nwould be: 99"
