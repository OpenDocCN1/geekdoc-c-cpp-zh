- pgno: 197
  md: '# Getchar()


    I/O is not part of C proper but are basic extensions necessary for writing most
    programs.


    getchar() returns the next character from standard input (keyboard) and returns
    it as a function return value. If there is no more input then EOF (end of file)
    is returned instead. It is therefore usual to compare the value returned by getchar()
    against EOF before using it.


    At some point during program execution, the user may indicate “no more input”
    by entering ^z (control z) (or in some environments ^d) and EOF will be returned
    from getchar().


    getchar() and EOF are defined in a standard include file named stdio.h which we
    must include in all of our compilations:


    ```

    #include <stdio.h>

    ```


    Certain C expressions become part of our standard vocabulary such as:


    ```

    while ((c = getchar()) != EOF)

    ```


    This expression is used at the beginning of a loop that gets a character at a
    time from the standard input. Look closely at the expression and note the "extra"
    pair of parentheses. Can you figure out why are they needed?


    Next, think about the difference between:


    ```

    while (c = getchar())

    and

    while (c == getchar())

    ```


    It can take a long time to see the difference and sometimes even longer to decide
    which one you really want!'
  merge: -1
  img_proc: true
- pgno: 198
  md: "Here's a program to count the number of characters read from an input stream\
    \ until an EOF is encountered:\n\n```\n#include <stdio.h>\n\nint main(void) {\n\
    \    int c, count = 0;\n\n    while ((c = getchar()) != EOF) {\n        ++count;\n\
    \    }\n    printf(\"%d\\n\", count);\n    return 0;\n}\n```\n\nNote that c is\
    \ declared to be an int rather than a char. This is because EOF is given a defined\
    \ value of -1. On some machines a char can only be a positive value and therefore\
    \ to return a -1 we define c to be an int.\n\nWe can replace the while statement\
    \ above with a for statement:\n\n```\n#include <stdio.h>\n\nint main(void) {\n\
    \    int count;\n\n    for (count = 0; getchar() != EOF; ++count) {\n        ;\n\
    \    }\n    printf(\"%d\\n\", count);\n    return 0;\n}\n```"
