- pgno: 521
  md: '# WordStar


    WordStar is a word processor application that had a dominant market share during
    the early-to-mid 1980s. It used the high-order bit of an ASCII character for special
    formatting purposes.


    WordStar would set the high order bit on the last character of a word to flag
    the location it can insert spaces to justify the right margin. It also set the
    high order bit on the spaces it inserts to know which spaces it can remove when
    it justifies the text. For example, it wouldn''t want to remove the double space
    you put at the end of a sentence.


    If you were to use a simple text editor to output the characters in a file created
    by WordStar, it might look something like this:


    ```

    6E† Writā · functiō calleō find_strinā tō determinā īē onāt characterō ō strināt
    existōt insidā anotheōt stringōt Thā firōō argumenōt tōt thā ō functiō shoulō
    bā thā characterō stringō thaō 10 tō bā searcheō auk thā ō secondō argumenōt thā
    strinā wā āra interestekt 10t findingō īāt thā ō functiō findō thā specificō stringō
    y tōēō havā 10 returō tōa locatiō ō 10 thā sourcō strinā whēn thā strinā wāō foundōt
    12 thā functiō dēō ō Not find the string, then have it return -1. (25)

    ```


    In fact, this is a question from an exam that I wrote with WordStar in 1986. I
    recently came across the file and wanted to view its contents. The reason for
    all of the gobbledygook is due to the fact that WordStar has set the high order
    bit on many of the characters. Keep in mind that ASCII is actually a 7-bit code
    and never used the high-order bit to define a character. WordStar used this high
    order bit for it''s own purposes!


    So I created a program that reads the file one character at a time. The program
    creates a mask to turn off the high-order bit before outputting the character:


    ```

    putchar(c & 0x7f);

    ```


    This statement bit-ands the character with the mask 01111111, which effectively
    turns off the high-order bit.'
  merge: -1
  img_proc: true
