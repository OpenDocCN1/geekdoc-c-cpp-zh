- pgno: 518
  md: "# Masks\n\nBitwise ANDing is frequently used for masking operations. A mask\
    \ is a constant or variable that is used to extract desired bits in a variable\
    \ or expression. A mask can be used to set specific bits of a data item to 0.\
    \ In the example below, we'll preserve the rightmost two bits from x and zero\
    \ (mask) out all of the other bits:\n\n```\n// mask1.c\n#include <stdio.h>\n\n\
    int main(void) {\n    int x = 0x679;    // 0000 0110 0111 1001\n    int mask =\
    \ 0x0003; // 0000 0000 0000 0011\n\n    x = x & mask;      // 0000 0000 0000 0001\n\
    \    printf(\"x = %#x\\n\", x);\n    return 0;\n}\n```\n\nThe output produced\
    \ is:\n\n```\nx = 0x1\n```\n\nNote that we could have written:\n\n```\nx &= mask;\n\
    ```"
  merge: -1
  img_proc: true
