    \ 0011 0100 0110 1000\n    int z = 0x5248;    // 0101 0010 0100 1000\n\n    printf(\"\
    0%x\\n\\n\", x & x);   => 0x1234\n    printf(\"0%x\\n\\n\", x & y);   => 0x1020\n\
    \    printf(\"0%x\\n\\n\", x & y & z); => 0x1000\n    printf(\"0%x\\n\\n\", x\
