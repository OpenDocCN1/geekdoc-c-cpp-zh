- pgno: 58
  md: 'This converts the integer value of x to its corresponding float value and assigns
    that value to y. Note that the conversion does not change the value or the type
    of x. The conversion is held in temporary storage.


    We normally cast a variable to ensure that the arithmetic is carried out with
    the type of the left-hand side:


    ```

    a = (int) 17.7 * 2;

    ```


    The result is:


    ```

    a = 34;

    ```


    We can round a variable to an integer by first adding 0.5 and then casting to
    an int:


    ```

    a = (int) (val + 0.5);

    ```


    A typical use of cast is in forcing division to return a real number when both
    operands are integers:


    ```

    average = (float) sum / num;

    ```


    Without the cast, truncated integer division is performed, since both sum and
    num are integers.'
