  md: "# Defining Nodes in C\n\nWe've seen that pointers allow us to build and manipulate\
    \ linked lists of various types. By altering the values of pointers, nodes can\
    \ be attached, detached, and reassembled in patterns that grow and shrink as execution\
    \ of a program progresses.\n\nWe can create a chain of these nodes, and keep track\
    \ of the first one in the list and then store within each node a pointer to the\
    \ next node in the list. To accomplish this, each node will therefore be defined\
    \ as a `struct` with one field containing the information and another field containing\
    \ the address of the next node in the list.\n\nWe make the declarations as follows:\n\
    \n```\nstruct node {\n    int info;\n    struct node *next;\n};\ntypedef struct\
    \ node *NODEPTR;\n```\n\nor, we can combine the two declarations above as follows:\n\
    \n```\ntypedef struct node {\n    int info;\n    struct node *next;\n} *NODEPTR;\n\
    ```\n\nIn either case, we declare `NODEPTR` to be a pointer to a `node struct`.\
    \ Note that the `next` field in the `node struct` is a pointer that contains the\
    \ address of the next node in the list.\n\nWe can now declare a `NODEPTR p` and\
    \ dynamically create a new node:\n\n```\nNODEPTR p;\np = (NODEPTR) malloc(sizeof(struct\
    \ node));\n```"
  merge: -1
  img_proc: true
