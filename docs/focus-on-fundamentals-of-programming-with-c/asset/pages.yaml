  img_proc: true
- pgno: 173
  md: "```\nproduct <= 100\n```\n\nbecomes false. This terminates the repetition,\
    \ and the final value of product is 128. Program execution continues with the\
    \ next statement after the while loop.\n\nWe can generalize this example and write\
    \ a function, findMax(), that will return the first power of 2 greater than some\
    \ maximum value:\n\n```\n#include <stdio.h>\n\nint findMax(int value);\n\nint\
    \ main (void) {\n    int value, max;\n\n    value = 500;\n    max = findMax(value);\
    \ ...\n    printf(\"The first power of 2 larger than %d is %d.\", value, max);\n\
    \    return 0;\n}\n\nint findMax(int value) {\n    int product = 2;\n\n    while\
    \ (product <= value) {\n        product *= 2;\n    }\n    return product;\n}\n\
    ```\n\nHere's the output produced:\n\n```\nThe first power of 2 larger than 500\
    \ is 512.\n```\n\nWe can generalize this example even further to have the function,\
    \ findMax(), return the first power of num greater than some maximum value:"
