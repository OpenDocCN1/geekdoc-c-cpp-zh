    "/users/home/input.txt"

    ```


    If the path information is not specified, then the file location is assumed to
    be the directory where the program was run from, which is known as the working
    directory.


    # The file modes are:


    | Mode | Description |

    |---|---|

    | "r" | read - file to read in data |

    | "w" | write - write data to file |

    | "a" | append - append data to end of file that already contains some data |


    The "r" mode opens the named file for reading only from the beginning of the file.
    The named file must exist in order to be opened successfully. Note that the contents
    of the file cannot be changed.


    The "w" mode opens the named file for writing from the beginning of the file.
    The named file will be created if it doesn''t exist. If it does exist then the
    original contents of the file will be overwritten regardless of whether any file
    operations are performed or not.


    The "a" mode opens the named file for writing from the end of the file. The named
    file will be created if it doesn''t exist. If it does exist then the original
    contents of the file will not be changed. All write operations are appended to
    the end of the file.


    To open a file for reading, we might say:


    ```

    FILE *fp;

    fp = fopen("infile.txt", "r");

    ```'
