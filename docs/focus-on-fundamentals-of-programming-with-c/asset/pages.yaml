    \ main(void) {\n    int x = 0x2719;    // 0010 0111 0001 1001\n    int y = 0x85CD;\
    \    // 1000 0101 1100 1101\n    int z;\n\n    z = x | y;    // 1010 0111 1101\
    \ 1101\n    printf(\"z = 0x%x\\n\", z);    // A 7 P D\n    return 0;\n}\n```\n\
    \nThe output of this program is:\n\nz = 0xA7DD\n\nThe bitwise-or operator is used\
    \ to set specified bits of a word to 1 (i.e., to turn on bits). For example, suppose\
    \ we want to set the rightmost 3 bits of an int to 1, regardless of the state\
    \ of these bits before the operation was performed:"
