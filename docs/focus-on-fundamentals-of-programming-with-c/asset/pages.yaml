    \ // 0001 0010 0011 0100\n    int mask = 0x000F; // 0000 0000 0000 1111\n\n  \
    \  x &= mask; // 0000 0000 0000 0100\n    printf(\"x = 0x%x\\n\", x);\n\n    return\
