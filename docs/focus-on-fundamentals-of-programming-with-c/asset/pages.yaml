- pgno: 139
  md: "# Scope of Identifiers\n\nIdentifiers are variable or function names that are\
    \ referred to in the program code. The scope of an identifier determines where\
    \ that identifier can be referred to in the program code.\n\nFor example, consider\
    \ the following code.\n\n```\ndouble average (double, double);\n\nint globalVariable;\n\
    \nint main(void) {\n    int localVariable;\n    ...\n    ...\n}\n\ndouble average(double\
    \ grade1, double grade2) {\n    return (grade1 + grade2) / 2;\n}\n```\n\nHere,\
    \ the identifiers (the function and variable names) average, main, globalVariable,\
    \ localVariable, grade1, and grade2 all have a specific and well-defined scope.\
    \ We can understand that scope as follows:\n\n+   • Identifiers that are declared\
    \ before the main() function have a global scope and can be referred to anywhere\
    \ in the program code. Normally, constants, macros, and functions are declared\
    \ before the main() function so that they have a global scope and are \"visible\"\
    \ throughout the program code. Variables declared before the main() function are\
    \ referred to as global variables and are generally frowned upon when used in\
    \ a program.\n\n+   • Identifiers that are declared within a specific function\
    \ have a local scope and are \"visible\" only within that specific function. Function\
    \ parameters are considered local to the function and are not \"visible\" outside\
    \ that function. Typically, any variable used in a program should either be declared\
    \ within a function or passed to a function as a function parameter."
  merge: -1
  img_proc: true
- pgno: 140
  md: '# Math Functions


    The cmath header defines various mathematical functions in the math library. All
    the functions evaluate in this library take double as an argument and return double
    on the result. Be sure to include the cmath header file near the top of source
    file that will use math functions.


    # Power Functions


    pow(x, y) Returns x raised to the power of y.

    sqrt(x) Returns the square root of x.


    # Absolute Value Functions


    abs(x) Returns the absolute value of x.


    # Nearest Integer and Remainder Functions


    ceil(x) Returns the smallest integer value greater than or equal to x. Rounds
    up to the nearest integer.

    floor(x) Returns the largest integer value less than or equal to x. Rounds down
    to the nearest integer.

    fmod(x, y) Returns the remainder of x divided by y.


    # Exponential and Logarithmic Functions


    exp(x) Returns the value of e raised to power of x.

    log(x) Returns the natural logarithm (base-e) of x.

    log10(x) Returns the common logarithm (base-10) of x.


    # Trigonometric Functions


    cos(x) Returns the cosine of a radian angle x.

    sin(x) Returns the sine of a radian angle x.

    tan(x) Returns the tangent of a radian angle x.

    acos(x) Returns the arc cosine of x in radians.

    asin(x) Returns the arc sine of x in radians.

    atan(x) Returns the arc tangent of x in radians.'
