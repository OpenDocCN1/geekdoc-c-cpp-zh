  md: "the input of numbers? One way to solve this problem is to use a special value\
    \ called a sentinel value to indicate “end of data entry.”\n\nThe user types in\
    \ data values, whose squares and cubes will be output, until the sentinel value\
    \ is entered which indicates that the last data value has been entered. Note that\
    \ the sentinel value must be chosen so that it cannot be confused with an acceptable\
    \ input value.\n\n```\n// sentinel.c\n#include <stdio.h>\nint main(void) {\n \
    \   int num;\n    printf(\"Enter number, -999 to end: \");\n    scanf(\"%d\",\
    \ &num);\n    while (num != -999) {\n        printf(\"%5d %5d %5d\\n\", num, num\
    \ * num, num * num * num);\n        printf(\"Enter number: \");\n        scanf(\"\
    %d\", &num);\n    }\n    return 0;\n}\n```\n\nProgram output is as follows:\n\n\
    ```\nEnter number, -999 to end: 2\n2    4    8\nEnter number, -999 to end: 5\n\
    5   25  125\nEnter number, -999 to end: 8\n8   64  512\nEnter number, -999 to\
    \ end: -999\n```"
