  md: "# Pass by Reference and scanf() Function\n\nAs previously indicated, scanf()\
    \ needs to know the addresses of the items to be read. Therefore the names of\
    \ variables are preceded by the address-of operator, &. However, if a parameter\
    \ is passed by reference to a function and that variable is used in a scanf()\
    \ statement, there is no need to place the address-of operator in front of the\
    \ variable. This is because the variable already represents an address due to\
    \ the fact that it was passed by reference.\n\n```\n#include <stdio.h>\n\nvoid\
    \ getValue(int *num);\n\nint main(void) {\n    int num;\n\n    getValue(&num);\n\
    \    printf(\"The Value input = %d\\n\", num);\n    return 0;\n}\n\nvoid getValue(int\
    \ *num) {\n    printf(\"Enter a number: \");\n    scanf(\"%d\", num); // No address-of\
    \ (&) operator required\n}\n```\n\nHere's the output produced:\n\n```\nEnter a\
    \ number: 35\nThe value input = 35\n```"
  merge: -1
