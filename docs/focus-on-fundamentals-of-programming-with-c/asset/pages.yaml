    # Macros With Arguments: #define identifier(arg1, arg2, ...) string,


    Note that there can be no space between the identifier and the left parenthesis
    of the argument:


    ```

    #define SQ(x) ( (x) * (x) )

    ```


    So:


    ```

    SQ(7 + w)

    ```


    expands to:


    ```

    ((7+w) * (7+w))

    ```


    The use of parentheses is to protect against the macro expanding an expression
    that would then lead to an unanticipated order of evaluation. For example, if
    we defined the macro as:


    ```

    #define SQ(x) x * x

    ```'
