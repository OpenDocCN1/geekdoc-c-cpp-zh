- pgno: 588
  md: '# Conceptual View of Ball


    | State |

    | --- |

    | Position | Direction |

    | OPERATIONS |

    | Position? | Behind Wall? |

    | Direction? | Behind Paddle? |

    | Modify Position |


    # Information Hiding


    +   ✦ Objects and encapsulation adhere to an important fundamental principle for
    structuring software systems called information hiding


    +   ✦ The idea behind information hiding is that users of an object need not have
    access to either:

    +   - the representation, or

    +   - the implementation of the operations


    +   ✦ Encapsulation hides the details of the implementation of an object.'
  merge: -1
  img_proc: true
- pgno: 589
  md: '# Two Views of Objects


    +   - It is useful to think of objects as providing two views of themselves:

    +     - one to potential users or clients of the object

    +     - another to implementators of the object


    +   - Users of the object may modify its state but only indirectly by invoking
    the operations supported by the object.


    +   - The major advantage of this approach is that it allows an implementator
    to modify the implementation of an object in a manner that is transparent to users.


    +   - Users or clients of the object do not have to be notified of the change.


    +   - This separation of the object''s user interface from its implementation
    is essential for the production of maintainable and reusable software.'
  merge: -1
  img_proc: true
- pgno: 590
  md: '# Encapsulation


    +   - Localizes within an object both data and the operations that affect the
    data.

    +   - Public part - tells what objects can do

    +   - Private part - How it does these things

    +   - Concentrate on WHAT want done and not HOW it is done.

    +   - Objects handle implementation.

    +   - New objects to system don''t require source code changes.

    +   - Objects are protected against changes in other parts of the program.

    +   - Manages complexity inherent in real-world problems by apportioning that
    complexity to the individual, pertinent objects.'
  merge: -1
  img_proc: true
