  img_proc: true
- pgno: 508
  md: 'The sequence of individual multiplications yields a sequence of individual
    products that have to be synthesized into the actual product of the full multicand
    times the multiplier. Realize that the actual product is to be stored in another
    linked list, identical in form to that of the multiplicand. This is accomplished
    by treating the thousands digit of each individual product as a "carry out" which
    is added to the units digit of the individual product from the node to the immediate
    left. This is perhaps more clearly seen through a concrete example. A diagram
    of the multiplication of 15! times 6 is shown below:


    ![](img/7f36c52b5170b89b142dbb7b1ea4666b_508_0.png)'
