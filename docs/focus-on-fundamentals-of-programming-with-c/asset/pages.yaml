- pgno: 175
  md: "• The counting variables can be incremented (increased in value) by any amount\
    \ or decremented (decreased in value) by any amount.\n\n# Example: Celsius to\
    \ Fahrenheit Conversion Table\n\nOur conversion table will utilize a counter variable,\
    \ ctemp, to control the number of times the while loop executes. In this example,\
    \ repetition terminates when ctemp becomes < 0.\n\n```\n```c\n#include <stdio.h>\n\
    int main (void) {\n    int ctemp;\n    float ftemp;\n    printf(\"Celsius\\t\\\
    tFahrenheit\\n\");\n    ctemp = 100;\n    while (ctemp >= 0) {\n        ftemp\
    \ = (9.0/5.0) * (float)ctemp + 32.0;\n        printf (\"%7d%15.1f\\n\", ctemp,\
    \ ftemp);\n        ctemp = ctemp - 10;\n    }\n    return 0;\n}\n```\n```\n\n\
    Program output is as follows:\n\n| Celsius | Fahrenheit |\n|---|---|\n| 100 |\
    \ 212.0 |\n| 90 | 194.0 |\n| 80 | 176.0 |\n| 70 | 158.0 |\n| 60 | 140.0 |\n| 50\
    \ | 122.0 |\n| 40 | 104.0 |\n| 30 | 86.0 |\n| 20 | 68.0 |\n| 10 | 50.0 |\n| 0\
    \ | 32.0 |\n\n+   • What would have happened if we were to have written (9/5)\
    \ instead of (9.0/5.0)?\n+   • What would have happened if we left off the parentheses\
