  md: "# Char Data Type\n\nEach character is stored in 1 byte (8-bits) according to\
    \ its ASCII code and is considered to have the corresponding integer value (0\
    \ – 255). Characters are written between single quotes and can be:\n\n+   - uppercase\
    \ letters: ('A' ... 'Z')\n+   - lowercase letters: ('a' ... 'z')\n+   - digits:\
    \ ('0' ... '9')\n+   - punctuation: ('.', ',', '!', ':', ';', '?', etc.)\n+  \
    \ - special characters ('\\n', '\\t', '\\a')\n+   - white space characters (blank,\
    \ tab, newline)\n\nC is best described as a somewhat weakly-typed language and\
    \ thus can blur the distinction among data types. For example, we can add characters\
    \ as if they were integers:\n\n```\nprintf(\"%c %c %c\", 'A' + 'b' + 'c');\n```\n\
    \nThis outputs the sum of the ASCII values as 198.\n\nHere's some code to print\
    \ all the characters in a machine's character set, showing the decimal, hexadecimal,\
    \ and character values. Note that the character sequence '\\t' represents a tab.\
    \ Please enter this code into your C compiler and execute the program:\n\n```\n\
    #include <stdio.h>\nint main(void)\n{\n    for (int i = 0; i < 128; i++)\n   \
    \     printf(\"%3d %4x %c\\n\", i, i, i);\n    return 0;\n}\n```"
