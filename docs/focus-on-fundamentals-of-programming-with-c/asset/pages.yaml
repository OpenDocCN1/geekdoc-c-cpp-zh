  md: "# Searching an Array: Linear Search\n\nThe simplest search strategy is the\
    \ linear or sequential search. The linear search is usually performed on unordered\
    \ arrays. It starts at the beginning of the array, checks every element in order,\
    \ until it either finds the data item it is looking for or until it reaches the\
    \ end of the array, in which case the data item is not found in the array.\n\n\
    ```\n// linearSearch.c\n// returns the index in the array of data item found\n\
    // returns (-1) if data item not in array\n\nint linearSearch(int num[], int max,\
    \ int key) {\n    int i;\n\n    for (i = 0; i < max; ++i) {\n        if (num[i]\
    \ == key) {\n            return i;\n        }\n    }\n\n    return -1;\n}\n```\n\
    \nLet's examine how long it will take to find a data item matching a key in the\
    \ unsorted array. We can examine three different possibilities, average time,\
    \ worst-case time, or best possible time. However, we will generally be most concerned\
    \ with the worst-case time, as calculations based on worst-case times can lead\
    \ to guaranteed performance predictions. Conveniently, the worst-case times are\
    \ generally easier to calculate than average times.\n\nTo simplify analysis and\
    \ comparison of algorithms, we look for a dominant operation and count the number\
    \ of times that dominant operation has to be performed. In the case of searching,\
    \ the dominant operation is the comparison.\n\nIf there are max items in our array,\
    \ it is obvious that in the worst case when there is no item in the array with\
    \ the desired key, then max comparisons of the key with the data items in the\
    \ array will have to be made. In the best case we'll find our data item on the\
    \ first comparison. In the average case we'll find our data item in (1 + max)\
    \ / 2 comparisons or approximately max/2 comparisons.\n\nTherefore, an array of\
    \ 100 data items requires an average of 50 comparisons for a successful search.\
    \ If we were to double the number of data items we had to search through, the\
    \ number of comparisons would also double and therefore the"
