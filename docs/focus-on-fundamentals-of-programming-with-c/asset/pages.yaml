- pgno: 207
  md: 'The fclose() statement is defined as follows:


    ```

    int fclose(FILE *fp);

    ```


    and is called like this:


    ```

    fclose(fp);

    ```


    fclose() empties the buffer and breaks all connections to the indicated file.
    EOF is returned if fp is not associated with a file. Note that if you fail to
    close a file when the program exits, the system will close the file for you. However,
    it is usually better to close the files properly yourself to ensure that the data
    in the file is properly saved.


    # File I/O statements


    Having opened a file pointer, you will wish to use it for either input or output.
    C supplies a set of functions to allow you to do this. All are very similar to
    input and output functions that you have already seen.


    File input and output is performed using the equivalents of getchar() and putchar()
    which are called getc() and putc(). Each takes an extra argument, which identifies
    the file pointer to be used for input or output.


    ```

    c = getc(fp)

    ```


    A macro which retrieves the next character from the file pointed to by fp. The
    value of the character is returned as an int. It returns EOF if an end of file
    is encountered or if there is an error. Note that getchar() is actually a macro
    defined as: getc(stdin).


    # Function prototype:


    ```

    int getc(FILE *fp);

    ```'
