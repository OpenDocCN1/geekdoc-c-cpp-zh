- pgno: 97
  md: '# Increment and Decrement Operators


    The increment and decrement are unary operators (i.e., require only one operand):


    ```

    ++ adds one to its operand

    -- subtracts one from its operand

    ```


    The statements:


    ```

    ++num;

    num++;

    ```


    both increment the value of num by 1 and have the same effect as the statement:


    ```

    num = num + 1;

    ```


    The statements:


    ```

    --num;

    num--;

    ```


    both decrement the value of num by 1 and have the same effect as the statement:


    ```

    num = num - 1;

    ```


    Note that when the ++ or -- operator is used to the left of the operand:


    ```

    ++num;

    --num;

    ```'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'it is referred to as the *prefix* form of the operator. When the ++ or -- operator
    is used to the right of the operand, it is referred to as the *postfix* form of
    the operator.


    When the increment or decrement operators are simply used on an operand, There
    is no difference between the prefix and the postfix form of the expression. However,
    when the increment or decrement operator is used within the context of a larger
    expression, using the prefix or postfix form of the operator might very well give
    different results.


    For example, examine the use of the prefix increment operator:


    ```

    y = 10;

    x = ++y;

    => X = 11

    y = 11

    | x | y |

    |---|---|

    | 11 | 11 |

    x = ++y (y = 11)

    ```


    Initially, the variable y is initialized to 10. In the second statement we use
    the prefix form of the increment operator. First, the value of y is incremented
    to 11, and then that new value of y is used in the remaining portion of the expression,
    i.e., the new value of y (11) is then assigned to x. So after the two statements
    are executed, both x and y are equal to 11.


    Now let''s examine the use of the postfix increment operator:


    ```

    y = 10;

    y = y++;

    X = 10

    y = 11;

    | x | y |

    |---|---|

    | 10 | 10 |

    x = y++ (y = 11)

    ```


    Here, the initial value if y is also 10. But in the second statement, before y
    gets incremented, it''s current value (10) is used in the expression, i.e., x
    is assigned the value of 10. Then the value of y is incremented to 11. So after
    these two statements are executed, x has the value of 10, and y has the value
    of 11!'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'The example below:


    ```

    x = y * z++;

    ```


    is actually equivalent to:


    ```

    x = y + z;

    ++z;

    ```


    Note that increment and decrement operators can only be applied to variables and
    not to constants or expressions. So the statements:


    ```

    x = (y + z)++;

    ++5;

    ```


    would not be valid. These operators are used quite often as the step expression
    of a for loop:


    ```

    for (i = 0; i < 10; ++i)

    ```


    We must be careful using the auto increment and auto decrement operators. For
    example the expression below is very ambiguous and will probable not return the
    value you are looking for:


    ```

    a = ++num + num;

    ```


    num is incremented before it is used, but this changes the value of the other
    num in the expression. On the other hand, some compilers will take the current
    value of num and add it to the incremented value of num. Therefore, evaluation
    is machine dependent and is therefore very poor programming style. If the intent
    is to increment num before the addition, use the following code:


    ```

    a = 2 * (++num);

    ```'
  merge: -1
  img_proc: true
