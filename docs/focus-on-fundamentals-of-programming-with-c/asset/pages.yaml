    \n#include <stdio.h>\n#include <string.h>\n\nint main(void);\nchar * foo(void);\n\
    \nint main(void) {\n    char *buf;\n\n    buf = foo();\n    puts(buf);\n    return\
    \ 0;\n}\n\nchar* foo(void) {\n    char buf[32];\n\n    strcpy(buf, \"Hello, world.\"\
    );\n    puts(buf);\n    return buf;\n}\n```\n\nThe problem lies in the fact that\
    \ the storage for buf is allocated on the stack and is local to function foo().\
    \ When foo() is exited, the storage on the stack is reclaimed and a pointer is\
    \ returned that no longer points to any valid memory location. The solution to\
    \ this problem is to return a pointer to a valid storage location that persists\
    \ after foo() is exited."
