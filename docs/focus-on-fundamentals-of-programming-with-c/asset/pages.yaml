  md: "they are equal, we have found what we were looking for; the index is 2.\nOtherwise,\
    \ if key is greater then the item at this index, our new effective search\narray\
    \ has a low index value of 3 and the high index remains unchanged at 5. If\nkey\
    \ is less than the element, the new effective search array has a high index of\
    \ 1\nand the low index remains at 0. The process repeats until the item is found,\
    \ or\nthere are no elements in the effective search array. The terminating condition\
    \ is\nfound when the low index exceeds the high index.\n\nThe binary search algorithm\
    \ is implemented below:\n\n```\n// binarySearch.c\n\n// Assumes array is in sorted\
    \ order.\n// Returns index of the location of the key in the array.\n// Returns\
    \ -1 if not found.\n\nint binarySearch(int num[], int n, int key) {\n    int mid,\
    \ i, j;\n\n    i = 0;\n    j = n-1;\n    while (i <= j) {\n        mid = (i +\
    \ j) / 2;\n        if (num[mid] > key) {\n            j = mid - 1;\n        }\n\
    \        else if (num[mid] < key) {\n            i = mid + 1;\n        }\n   \
    \     else {\n            return mid;\n        }\n    }\n    return -1;\n}\n```\n\
    \n# Analysis of Binary Search\n\nWhy use a binary search when a linear search\
    \ is easier to code? The answer lies\nin the efficiency of the search. With a\
    \ linear search, if you double the size of an\narray, you could potentially take\
    \ twice as much time to find an item. With a binary\nsearch, doubling the size\
    \ of the array merely adds one more item to look at. Each\ntime you look with\
    \ a binary search, you eliminate half of the remaining array\nitems as possible\
    \ matches.\n\nFor example, suppose we're given a search space of 1,000,000 data\
    \ elements.\nSequential search would take about 500,000 searches or comparisons\
    \ on the"
