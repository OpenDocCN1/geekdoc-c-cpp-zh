    \ 'u', 't', 'e', 'r', '\\0' };\n```\n\nNote that this array will contain 9 elements,\
    \ one for each character plus one for the null character, '\\0'. An alternate,\
    \ and more widely used initialization, looks like this:\n\n```\nchar name[] =\
    \ \"Computer\";\n```\n\nTwo widely used string I/O functions are:\n\n+   * gets(s1)\n\
    +   \n+   Reads a string into string variable s1 from stdin. Characters are placed\
    \ into s1 until a newline character is read, at which time the newline character\
    \ is changed to a null character and is used to terminate s1. The value of s1\
    \ (pointer to char) is returned. Note, unlike scanf() this function allows Input\
    \ strings to contain white space characters.\n+   \n+   Function prototype:\n\
    +   char *gets(char *s1);\n\n+   * puts(s1)\n+   \n+   The null terminated string\
    \ s1 is copied to stdout, except that the terminating null character itself is\
    \ not copied. A newline character is appended.\n+   \n+   Function prototype:\n\
    +   int puts(char *s);"
