  md: "# Nested for Loops\n\nThere are times when we have a need to place a for loop\
    \ within the body of another for loop. This is referred to as a nested for loop.\
    \ Can you follow the flow of control of the nested for loop below:\n\n```\n#include\
    \ <stdio.h>\nint main(void) {\n    int i, j;\n    for (i = 1; i <= 4; ++i) {\n\
    \        for (j = 1; j <= 3; ++j) {\n            printf(\"%d %d\\n\", i, j);\n\
    \        }\n    }\n    return 0;\n}\n```\n\n![](img/7f36c52b5170b89b142dbb7b1ea4666b_181_0.png)\n\
