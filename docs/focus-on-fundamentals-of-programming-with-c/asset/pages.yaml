  md: '# Sorting an Array: Insertion Sort


    Sorting is the process of rearranging items so that they are in order and is one
    of the most common tasks performed by computers today. Sorting is used to arrange
    names and numbers in meaningful ways. For example, it is relatively easy to look
    up the phone number of a friend because the names in the phone book have been
    sorted into alphabetical order. This example clearly illustrates one of the main
    reasons that sorting large quantities of information is desirable. That is, sorting
    greatly improves the efficiency of searching. If we were to open a phone book,
    and find that the names were not presented in any logical order, it would take
    an incredibly long time to look up someone''s phone number!


    Insertion sort works the way many people sort a poker or a rummy hand. We start
    with an empty left hand and the cards face down on the table. We then remove one
    card at a time from the table and insert it into the correct position in the left
    hand. To find the correct position for a card, we compare it with each of the
    cards already in the hand, from right to left. When we find the correct insertion
    point, we place the card in the hand at that location.


    Insertion sort takes an item from an array and finds its correct position by comparing
    it with its predecessors. Given an array, num, of size max, we find the correct
    position for the i<sup>th</sup> element num[i] by comparing it with the elements
    num[1], num[2], ... num[i-1]. This ensures that at the i<sup>th</sup> stage of
    the algorithm, the first i elements in the array are sorted, such that by the
    n<sup>th</sup> stage, all n elements are in order.


    # Insertion Sort Example


    To sort an array of data items, we move through the array from left to right and
    insert one data item at a time into its proper position among the data items to
    its left. Shown below is the insertion sort in action. The number in this shade
    is the number we''re trying sort. The numbers in this shade are the sorted elements.
    The blank location in the array represent a possible insertion point. We begin
    with the assumption that the first element of the array is sorted.


    | 5 | 3 | 8 | 2 | 9 | 4 | 6 | 7 |

    |---|---|---|---|---|---|---|---|


    The next element of the array to be sorted is 3:


    | 5 | 3 | 8 | 2 | 9 | 4 | 6 | 7 |

    |---|---|---|---|---|---|---|---|'
