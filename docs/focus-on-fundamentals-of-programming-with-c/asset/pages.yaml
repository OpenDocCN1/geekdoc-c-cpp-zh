- pgno: 389
  md: '# Preprocessor


    The C preprocessor is a simple tool that processes the source code of a C program
    before the compiler parses the source code. Sometimes the preprocessor is actually
    a separate program that reads the original source file and writes a new "preprocessed"
    source file that can then be used as input to the C compiler. The C preprocessor
    provides facilities for defining macros, file inclusion, conditional compilation.


    # #include


    Lines that begin with a # in column 1 are called control lines which communicate
    with the preprocessor. The syntax for control lines is independent of the rest
    of the C language. A control line of the form:


    ```

    #include "filename"

    ```


    causes the preprocessor to replace the line with a copy of the contents of the
    named file. A search for the file is made first in the current directory and then
    in standard places. With the control line of the form:


    ```

    #include <filename>

    ```


    the preprocessor looks for the file only in the standard places and not in the
    current working directory.


    An include file can contain other control lines, which will be expanded by the
    preprocessor:


    # #define


    #define is used at the beginning of a program to define a symbolic name or symbolic
    constant to be a particular string of characters. The compiler will replace all
    unquoted occurrences of the name by the corresponding string. Use of #define makes
    program constants easier to read and allows a programmer to specify constants
    in a way to make it easier to change later.


    Control lines with #define are called macros and can occur in two forms, macros
    without arguments and macros with arguments.'
  merge: -1
  img_proc: true
- pgno: 390
  md: '# Macros Without Arguments: #define identifier string


    The preprocessor replaces every occurrence of identifier with string in the remainder
    of the file, except in quoted strings.


    ```

    #define MAXINT 2147483647

    ```


    Note that there are no semicolons at the end of the macro. Macros are not recognized
    within character constants, string constants, or comments.


    #define improves program readability and portability:


    ```

    #define PI 3.14159

    #define FALSE 0

    #define TRUE 1

    #define BUFSIZE 512

    #define FOREVER for(;;)

    ```


    By convention, capital letters are used for identifiers in simple #define constants
    to allow the reader of a program to readily identify text that will be expanded
    by the preprocessor.


    A collection of commonly used #define constants can be entered once into a file,
    local.h, and can be brought into a C source program using a #include:


    ```

    #include "local.h"

    ```


    Text inside a string or character constant does not get replaced by the preprocessor.


    For example:


    ```

    #define BLANK

    ```'
