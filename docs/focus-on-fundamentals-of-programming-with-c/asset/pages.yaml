    # Macros vs. Functions


    So we see similarities between macros with arguments and functions. Which should
    we use? Well, there is a tradeoff between time and space. A macro produces “in-line”
    code, i.e., you get a statement in your program. If you use the macro 20 times,
    then you get 20 lines of code inserted into your program.


    If you use a function 20 times, you have just one copy of the function statements
    in your program, so less space is used. But program control must shift to where
    the function is, then return back to the calling program, and this takes longer
    than executing in-line code. The general rule is to get your program working correctly
    first without defining any macros (i.e., macros with arguments). Then introduce
    them later, if you need the speed advantage.'
