- pgno: 132
  md: '# Function Call 2:


    Values are assigned to variables l and w and the variables are the arguments to
    the function calcRectArea(). The function returns a calculated value that is assigned
    to area, which is then output.


    Note that in this case the names of the arguments that are passed to the function
    (called the actual parameters) do not have the same name as the arguments that
    are received by the function (called the formal parameters). The names do not
    need to match! C simply passes the first actual parameter to the first formal
    parameter, the second actual parameter to the second formal parameter, etc.


    However, the number of actual parameters must equal the number of formal parameters
    (i.e., the number of parameters that are passed to a function must be the same
    as the number of parameters that the function is declared to receive). Additionally,
    the data type of the first actual parameter must match the data type of the first
    formal parameter, the data type of the second actual parameter must match the
    data type of the second formal parameter., etc.


    # Function Call 3:


    The function return value is not assigned to a variable for output as the function
    call is itself included within the printf() statement! Here the return int value
    is substituted into the printf() string for the %d format specifier and the return
    value of the function is immediately output.


    # Function Call 4:


    This function call, while technically correct, does not use the value returned
    by the function because we''re calling the function without assigning or using
    the return value in any way. The returned value is simply ignored! We''ll see
    other examples of function calls in which the returned value goes unused.


    # Function Advantages


    +   - Programs become more readable.


    +   - Function can be tested and debugged separately from the rest of the program.


    +   - By isolating a logic step in a function, the parts of a program are more
    independent and the likelihood of errors are reduced.


    +   - The same function can be invoked from different places in a program. Therefore,
    a commonly used chunk of logic needs to be written only once.'
  merge: -1
  img_proc: true
- pgno: 133
  md: "# Flow of Program Execution\n\nThe flow of execution of a program refers to\
    \ the order in which the C code is executed. Execution always begins at the first\
    \ statement in main() and statements are executed one after another, from first\
    \ to last.\n\nFor example, consider the following program that swaps the value\
    \ of two variables:\n\n```\n```c\nint main(void) {\n   int x, y, temp;   // Statement\
    \ 1\n   x = 5;            // Statement 2\n   y = 6;            // Statement 3\n\
    \   temp = x;         // Statement 4\n   x = y;            // Statement 5\n  \
    \ y = temp;         // Statement 6\n   return 0;         // Statement 7\n}\n```\n\
    ```\n\nThe statements in the program above are executed in the following order:\n\
    \n+   Statement 1\n+   Statement 2\n+   Statement 3\n+   Statement 4\n+   Statement\
    \ 5\n+   Statement 6\n+   Statement 7\n\nAdding function definitions to a program\
    \ does not alter the flow of execution of the program. However, the statements\
    \ within the function are not executed until the function is called.\n\nWhen a\
    \ function call is made, control of the program jumps to the first statement in\
    \ the program. All of the statements in the function are executed until either\
    \ a return statement is reached or a closing brace to the function is reached.\
    \ Control of the program returns to the location in the function where the function\
    \ call was made."
  merge: -1
  img_proc: true
