- pgno: 37
  md: '# # Variables and Data Types


    # ## Identifiers (Variable Names)


    A variable is an object that can assume different values during the execution
    of a program. Every variable has a name and a value. The name identifies the variable
    and the value stores data. There is a limitation on what these names can be. Every
    variable name in C must start with a letter or an underscore, the rest of the
    name can consist of letters, digits and underscore characters. C recognizes upper
    and lower case characters as being different. Finally, you cannot use any of C''s
    keywords like main, while, switch etc. as variable names.


    Examples of legal variable names include:


    | x | x1 | x2 | tempValue |

    |---|---|---|---|

    | result | num | value | outFile |


    A capital letters is often used as the first letter of the second word when two
    words are combined into a variable name. The rules governing variable names also
    apply to the names of functions.


    # ## Variables and Data Types


    In C, a variable must be declared before it can be used. Most variables are declared
    at the start of each function. These local variables are created when the function
    is called, and are destroyed on return from that function.


    A declaration begins with the type, followed by the name of one or more variables.
    For example:


    ```

    int test, min, max;

    ```


    Declarations can be spread out, allowing space for an explanatory comment. Variables
    can also be initialized when they are declared, this is done by adding an equals
    sign and the required value after the declaration:


    ```

    int test = 25;      // test value

    int min = 10;       // minimum value

    int max = 50;       // maximum value

    ```'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'C provides a wide range of types. The most common are:


    | Type | Description |

    | --- | --- |

    | int | represents a whole number |

    | float | represents a floating point (real) number |

    | double | represents a floating point (real) number |

    | char | represents a single byte of memory, enough to hold a character |


    There are also several variants on these types:


    | Type | Description |

    | --- | --- |

    | short | represents an integer, possibly of reduced range |

    | long | represents an integer, possible of increased range |

    | unsigned | an integer with no negative range |

    | unsigned long | like unsigned, possible of increased range |


    All of the integer types plus the char are called the integral types. float and
    double are called the real types.


    As said previously, all C program variables must be declared, or associated with
    a data type, before they are used in a program. This serves four purposes:


    +   - Data types define the amount of storage that must be allocated for each
    variable.

    +   - Data types define the interpretation given to each storage location.

    +   - Data types define the range of values a variable may take.

    +   - Data types define a set of operations that may be performed on the variable.


    # Integer Data Types


    Integers, or int in C, can represent whole numbers that do not have a fractional
    component such as 1, 10, -35, 450, 11232, etc. Commas or blanks are never used
    to represent integers. Integer variables should be used where the numeric value
    will not have a fractional component, such as in counting, etc.


    The table below indicates the number of bytes allocated for variables of each
    data type along with the range of values that can be held by a variable of each
    data type.'
  merge: -1
  img_proc: true
