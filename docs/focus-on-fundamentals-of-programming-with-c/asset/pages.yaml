    Description: Program generates a table of squares and cubes for the numbers 1\
    \ - 15\nInput Files: None\nOutput Files: None\n\n```\n#include <stdio.h>\n#define\
    \ MIN 1\n#define MAX 15\n\nint main(void) {\n    int i;\n\n    printf(\"%10s %10s\
    \ %10s\\n\", \"Value\", \"Square\", \"Cube\");\n    printf(\"%10s %10s %10s\\\
    n\", \"-----\", \"------\", \"-----\");\n\n    for (i = MIN; i <= MAX; ++i) {\n\
    \        printf(\"%10d %10d %10d\\n\", i, i * i, i * i * i);\n    }\n\n    return\
    \ 0;\n}\n```"
