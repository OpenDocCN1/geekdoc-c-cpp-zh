  md: "# Linear Linked List Operations\n\nHere are functions to manipulate a linear\
    \ linked list of integers. It is very important for you to work through each of\
    \ these functions to be sure that you understand how they work. Be sure to draw\
    \ pictures of linked lists to assist you in visualizing the algorithms. It is\
    \ extremely difficult to write code using linked lists without drawing pictures\
    \ of the lists and how the list changes as your algorithm executes.\n\n```\n//\
    \ returns the address of a newly created node\nNODEPTR getNode(void) {\n    NODEPTR\
    \ p;\n\n    p = (NODEPTR) malloc(sizeof(struct node));\n    if (p == NULL) {\n\
    \        error(\"List overflow.\");\n    }\n    return(p);\n}\n\n// frees the\
    \ node pointed to by p\nvoid freeNode(NODEPTR p) {\n    free(p);\n}\n\n// adds\
    \ a new node to the front of the list\nvoid addFront(NODEPTR *list, int num) {\n\
    \    NODEPTR p;\n\n    p = getNode();\n    p->info = num;\n    p->next = *list;\n\
    \    *list = p;\n}\n```"
