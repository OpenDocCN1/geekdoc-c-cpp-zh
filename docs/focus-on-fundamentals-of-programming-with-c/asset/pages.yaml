  md: '# Searching an Array: Binary Search


    As we saw earlier, the linear search algorithm is simple and convenient for small
    problems, but if the array is large and/or requires many repeated searches, it
    makes good sense to have a more efficient algorithm for searching an array.


    The binary search algorithm works on a sorted array. It selects the median (middle)
    element in the array and compares its value to that of the target value, key.
    Because the array is known to be sorted, if the target value is less than the
    middle value then the target must be in the first half of the array. Likewise
    if the value of the target item is greater than that of the middle value in the
    array, it is known that the target lies in the second half of the array. In either
    case we can, in effect, “throw out” one half of the search space with only one
    comparison.


    Now, knowing that the target must be in one half of the array or the other, the
    binary search examines the median value of the half in which the target must reside.
    The algorithm thus narrows the search area by half at each step until it has either
    found the target data or the search fails.


    The algorithm is easy to remember if you think about a child’s guessing game.
    Imagine I told you that I am. You would continue to refine your choice until you
    got the number correct.


    Given a sorted array of items, say:


    ![](img/7f36c52b5170b89b142dbb7b1ea4666b_287_0.png)


    Suppose we wish to search for the position of an element equal to key. We will
    search the array that begins at some low index and ends at some high index. In
    our case the low index of the effective array to be searched is 0 and the high
    index is 5. We can find the approximate midway index by integer division (low
    + high) / 2, i.e. 2. We compare our value, key with the element at index 2. If'
