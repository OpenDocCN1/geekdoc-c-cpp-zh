  md: "# Enumerations\n\nWhen a data type will hold one of a limited list of values,\
    \ you can choose to use an enumerated data type. A variable of an enumerated type\
    \ may be assigned any \"value\" within its type.\n\n```\nenum Day { Sat, Sun,\
    \ Mon, Tues, Wed, Thurs, Fri };\nenum Gender { male, female };\nint main (void)\
    \ {\nenum Day today = Wed;\nenum Day tomorrow = Thurs;\nenum Gender student =\
    \ female;\n```\n\nEnumerated values are treated as constants by C compilers and\
    \ each one is given an integer value, starting with 0. When we say today = Wed;\
    \ the value of 4 is assigned to today and not the name Wed.\n\nVariables with\
    \ enumerated types can also be used in Boolean expressions:\n\n```\nif (student\
    \ == female) {\n    printf(\"female\");\n}\n```\n\nThe other relational operators\
    \ can also be used. Note that enumerating a data type automatically establishes\
    \ order among the elements:\n\n```\n#include <stdio.h>\nenum Day { Sat, Sun, Mon,\
    \ Tues, Wed, Thurs, Fri };\nint main (void) {\nenum Day today;\n    for (today\
    \ = Sat; today <= Fri; ++today) {\n        if (today < Mon) {\n            printf(\"\
    Weekend\\n\");\n        } else {\n            printf(\"Weekday\\n\");\n      \
    \  }\n    }\n    return 0;\n}\n```"
