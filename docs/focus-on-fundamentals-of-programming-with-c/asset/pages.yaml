- pgno: 59
  md: '# scanf() Function


    scanf() is a function in the standard library which allows you to input values
    into a program from standard input (keyboard). It''s usually used to input numerical
    data using formats similar to the printf() statement.


    Like printf(), scanf() has a control string, followed by the list of items to
    be read. However scanf() wants to know the addresses of the items to be read,
    since it is a function which will change those values. Therefore the names of
    variables are preceded by the & sign. Note that character strings are an exception
    to this. Since a string is already a character pointer, we give the names of string
    variables unmodified by a leading & (more on strings later).


    In the expression:


    ```

    scanf("%d %d", &x, &y);

    ```


    the arguments &x and &y tell scanf() where to store the data that it reads. &
    is an operator in C which gives the address of its operand, i.e., &x gives the
    address of x. Note that the arguments to the scanf() function MUST be pointers
    to the locations in memory where the input is to be stored.


    Here are scanf() format codes:


    | Code | Meaning |

    | :--- | :--- |

    | %c | read a character |

    | %d | read a decimal integer |

    | %ld | read a long decimal integer |

    | %f | read a floating point number |

    | %lf | read a double |

    | %h | read a short integer |

    | %x | read a hexadecimal number |

    | %s | read a string |'
  merge: -1
  img_proc: true
- pgno: 60
  md: "Here's an example of the use of `scanf()`:\n\n```\n#include <stdio.h>\n\nint\
    \ main(void) {\n   int i;\n   float f;\n   char buf[32];\n\n   printf(\"Enter\
    \ an integer, float, and string: \");\n   scanf(\"%d %f %s\", &i, &f, buf);\n\
    \   return 0;\n}\n```\n\nInput line:\n\n```\n25 3.14159 Samantha\n```\n\nThe three\
    \ input fields may be separated by as many blanks, tabs, and newlines (whitespace\
    \ characters) as desired.\n\nNote that the argument `buf` did not need an `&`\
    \ before it. Why?\n\nWhen arrays are passed as arguments in functions, they are\
    \ always passed by reference and therefore a pointer to the array (or the first\
    \ address within the array) is actually being passed.\n\nAlso note that `scanf()`\
    \ skips any leading whitespace characters in the input (except when using the\
    \ `%c` format specifier).\n\nWhen the `%s` specifier is used, the value to be\
    \ read is a sequence of characters that begins with the first non-whitespace character\
    \ and is terminated by the first whitespace character. The corresponding argument\
    \ is a pointer to a character array, which must contain enough locations to contain\
    \ all the characters that are read plus the null character that is added to the\
    \ end of the string automatically by the function.\n\nThe `scanf()` function can\
    \ also take an optional modifier between the `%` and the format character that\
    \ determines the field-width number used to indicate the maximum number of positions\
    \ or digits to expect in an argument (or that a field occupies)."
  merge: -1
  img_proc: true
- pgno: 61
  md: '# For example:


    ```

    scanf("%4d %10s", &num, buf);


    1234string      1234      string

    123456string    1234      56string

    9999string      9999      string

    ```


    If a field-width modifier is supplied, the specified number of characters is read,
    unless a whitespace character is encountered first.


    Note that when scanf() reads in a particular value, reading of the value will
    terminate as soon as a character that is not valid for the value being read is
    encountered (or as soon as the number of characters specified by the field width
    is reached, if specified).


    Any non-format characters specified in the format string of scanf() is to be expected
    on the input. For example, to enter the current time from terminal we can use:


    ```

    scanf("%d:%d:%d", &hour, &min, &sec);

    ```


    The : specify that colons are expected as separators between the three integer
    values.


    White space characters inside a format string match an arbitrary number of whitespace
    characters on the input:


    ```

    scanf("%d%c", &i, &c);


    input:

    29 w


    assign:

    29 to i

    space to c

    ```'
