- pgno: 289
  md: 'average. If we were to double the search space to 2,000,000 data items, the
    number of comparisons would double to 1,000,000 and therefore our search time
    would effectively double. Binary search, on the other hand, would only require
    about 20 searches through a search space of 1,000,000 data items and doubling
    this data size to 2,000,000 would only increase the number of comparisons by 1.
    Binary search is indeed a powerful search algorithm!


    So we say that binary search on an array takes approximately log2n comparisons
    because at each test you can “throw out” one-half of the search space. We can
    divide a set of n items in half at most log2n times. Thus the running time of
    a binary search is proportional to log2n and we say this is a log n algorithm.


    It is noteworthy that for very small arrays a linear search can prove faster than
    a binary search. However as the size of the array to be searched increases, the
    binary search is the clear victor in terms of number of comparisons and therefore
    overall speed. Thus at large values of n, log n is much smaller than n, consequently
    a log n algorithm (binary search) is much faster than an algorithm whose time
    is proportional to n (linear search).


    ![](img/7f36c52b5170b89b142dbb7b1ea4666b_289_0.png)


    Still, the binary search has some drawbacks. First of all, it requires that the
    data to be searched be in sorted order. If there is even one element out of order
    in the data being searched it can throw off the entire process. When presented
    with a set of unsorted data the efficient programmer must decide whether to sort
    the'
