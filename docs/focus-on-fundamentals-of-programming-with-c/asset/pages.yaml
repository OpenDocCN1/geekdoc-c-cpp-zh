- pgno: 247
  md: '# Introduction to Arrays


    We have so far been looking at scalar data types:


    ```

    int

    long

    char

    float

    double

    ```


    C also provides structured data types that are complex higher-level data types
    built from collections of simple scalar data types such as:


    ```

    arrays

    structures

    files

    pointers

    ```


    Each one of these structured data types in C can also be defined in terms of other
    structured data types:


    ```

    arrays of arrays

    arrays of structures

    structures containing arrays

    files of structures

    ```


    An array in C is a collection of contiguous memory locations that have the same
    name and the same data type. The array below is declared to hold 10 integers:


    ```

    int num[10];

    ```


    Our declared array of 10 elements looks like this:


    ![](img/7f36c52b5170b89b142dbb7b1ea4666b_247_0.png)'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'The cells all contain some data, but we do not know what the values of the
    data in each cell are as each element of the array is uninitialized, i.e., has
    not yet been given a value. Here num is the name of the array and 10 is the size
    specifier. This specifier should be a positive integer constant such as 10, in
    this case.


    ```

    #define MAX = 10

    ```


    # Accessing Array Elements


    How do we access the individual elements of an array such as num, given that num
    now names 10 memory locations and not just one? Individual array elements are
    identified by an integer index or subscript, such as num[3] or num[5]. In C, the
    index begins at zero and is always written inside square brackets.


    ![](img/7f36c52b5170b89b142dbb7b1ea4666b_248_0.png)


    Because C uses zero-based indexing, elements of the array are stored in array
    locations num[0] through num[9]. Note that array location num[10] does not exist.
    However, the C compiler does no checking to determine if a subscript of an array
    is within the bounds of the array. Therefore, no error message is displayed if
    your program attempts to read or write to an element of the array that does not
    exist!


    # Initializing Array Elements


    We can initialize individual array elements such as:


    ```

    num[0] = -2;

    num[1] = -19;

    num[2] = -5;

    num[3] = 6;

    num[4] = -9;

    num[5] = -2;

    num[6] = 3;

    num[7] = 7;

    num[8] = -7;

    num[9] = 2;

    ```'
  merge: -1
  img_proc: true
