  md: '# Decode Lab


    Your assignment is to write a C program, `decode.c`, which will decode a secret
    message. The message will be 26 characters in length, and will be given to you
    as a series of numbers. These numbers must be sorted and compared against a translation
    set of characters in order to decode it. This method is based upon the decoder
    rings that used to be available in packages of cereal.


    Perhaps the easiest way to show how to decode a message is to first show how a
    message is encoded. First, the letters of the alphabet, the numbers, and any punctuation
    is scrambled into some sort of sequence.


    For example, the string below can be found in `codefile.txt`:


    ```

    CFL2AP(T9W,N!JEMB6NDOBZ7UKLY3VGXR)ISOQS, : -

    ```


    Notice that the above string contains 52 characters (including the nine blanks
    near the end). Now, let''s suppose that we want to encode the message:


    ```

    HELP ME!

    ```


    Looking up each of the letters in the above string we find that `H` is the 11th
    character (zero-based indexing), `E` is the 14th, `L` the 2nd, `P` the 5th, one
    of the blanks the 41st, `M` the 15th, `E` the 14th, and `!` the 12th. Therefore,
    our initial coding is:


    ```

    11 14 . 02 05 41 . 15 14 12

    ```


    Next, each number is assigned a three-digit sequence number, in ascending order,
    to precede it. These numbers indicate relative position and need not be consecutive.


    M A Y - T H E - F O R C E - B E

    15 4 -7 44 7 11 14 46 1 37 33 0 14 49 21 14

    W I T H -

    42 9 35 7 11 46

    Y C U !

    27 37 28 12'
