  md: '# Command-Line Arguments


    When a compiled program is executed, it''s useful to supply initial values for
    some variables at runtime. These values are called command-line arguments. We
    have previously defined the main() function as:


    ```

    int main(void);

    ```


    but it is more generally defined as:


    ```

    int main(int argc, char *argv[])

    ```


    The first argument, argc, stores the number of command-line arguments the program
    was invoked with (including the name of the program). The second argument, argv,
    is a pointer to ragged array of strings that stores the actual argument values
    passed to the program.


    The declaration of argv:


    ```

    char *argv[]

    ```


    indicates that the pointer is to the initial element of the array and can also
    be written as:


    ```

    char **argv

    ```


    That is, argv is a pointer to a pointer to a char. If we look at the storage pointed
    to by argv, we will find an array of character pointers, each one pointing to
    a null-terminated string:'
