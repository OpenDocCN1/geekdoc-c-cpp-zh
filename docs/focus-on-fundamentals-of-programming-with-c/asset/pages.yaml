- pgno: 509
  md: 'A complication to be contended with when implementing this scheme for multiplication
    is that the individual multiplications have to start at the right-hand end of
    the multiplicand, which is stored at the rear of the list. In fact, it is necessary
    to proceed through the list taking the nodes in the reversed order. There are
    several ways to deal with this. One is to make the multiplicand''s list doubly-linked,
    so that it is just as readily traversed from the rear to the front as from the
    front to the rear. Another approach is to store the 3-digit numbers in nodes,
    from front to rear, in the order in which they will need to be processed (instead
    of the order reflecting conventional representation):


    ```

    15! = 1, 307, 674, 368, 000


    | 000 |=====>| 368 |=====>| 674 |=====>| 307 |=====>| 001 |=====>X

    ```


    A further complication entails extending the multiplication scheme so that it
    can deal with multiplications like 15! times 16, which is to say multiplications
    in which a factorial is multiplied by a number with two or more digits. The extension
    is directly analogous to the paper and pencil multiplication taught in grade school
    in which the digits in the multiplier are treated one-by-one. Just as each successive
    digit in the multiplier (i.e., the unit''s digit, the ten''s digit, the hundred''s
    digit) requires another "round of multiplying" the multiplicand by a numeral (a
    number between 0 and 9) and another "intermediate product line", so it goes in
    the extension of the present multiplication scheme.


    In implementing the multiplication of 15! times 16, first 15! would be multiplied
    times 6 and the result stored in a new linked list. Then, 15! would be multiplied
    times 1 (the numeral in the multiplier''s tens place), and this result would be
    stored in a new linked list of its own. Next, the numerals in the linked list
    holding the product of 15! times 1 would be shifted one digit to the left, effecting
    a multiplication by ten to transform the 15! * 1 product to a 15! * 10 product.
    Lastly, the corresponding digits in the two "helping lists" would be added to
    give the final result. For example:'
