  md: "# Conditional Operator\n\nThe conditional operator ?: is the only ternary operator\
    \ in C, i.e. requires 3 operands:\n\n+   - the expression being tested\n+   -\
    \ the two alternative outcome expressions\n\nHere's what the syntax of the conditional\
    \ operator looks like:\n\n```\nexpr1 ? expr2 : expr3\n```\n\nThe condition is\
    \ a relational expression returning true or false (0 or non-zero). If true, then\
    \ expr1 is evaluated, otherwise expr2 is evaluated. In fact, the conditional operator\
    \ behaves very much like an if-else statement. The following code:\n\n```\nif\
    \ (x > y)\n    max = x;\nelse\n    max = y;\n```\n\ncan be rewritten using the\
    \ conditional operator:\n\n```\nmax = (x > y) ? x : y;\n```"
  merge: -1
