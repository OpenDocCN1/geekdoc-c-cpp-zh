- pgno: 436
  md: '# Dynamic Allocation of Variables


    Dynamic variables are variables that can be created and disposed of as a program
    executes. When a variable is needed, storage is reserved for it. When it is no
    longer needed, the storage is released. Therefore, the storage for these dynamic
    variables that are no longer in use is available for other purposes. There is
    no predefined limit to the number of dynamic variables that can be created.


    We reference a dynamic variable not by name but through a pointer. Remember a
    pointer is a variable that contains the address (location) in memory of the dynamic
    variable it references. Every new dynamic variable created has an associated pointer
    to reference it. So when we allocate storage for a dynamic variable, our method
    of accessing the variable is through a pointer.


    In order to create a dynamic variable of type integer, it is first necessary to
    declare a pointer variable that can hold its address. The declaration:


    ```

    int *p;

    ```


    declares the variable p to be a pointer variable whose values will be pointers
    to (contain the address of) dynamic variables of type int.


    But a pointer variable is of no use unless there is something for it to point
    to. In order to create a dynamic variable, we use the malloc() function as follows:


    ```

    int *p;

    p = (int *) malloc(sizeof(int));

    ```


    malloc() dynamically allocates variable-sized blocks of memory from the heap and
    allows a program to allocate memory explicitly as it''s needed. By definition,
    malloc() returns a void *, and therefore must be cast to the appropriate type
    of the pointer that will receive the address on the heap of the new dynamic variable,
    in this case int *. It is our responsibility to tell malloc() exactly how much
    storage to allocate for the dynamic variable, in this case sizeof(int) bytes.
    malloc() is prototyped in both the alloc.h and stdlib.h header files. If malloc()
    is successful, it returns a pointer to the newly allocated block of memory. Otherwise,
    if not enough space exists for the new block of storage, malloc() returns NULL,
    which is a special value that any pointer variable may have. The NULL pointer
    does not reference a storage location.'
  merge: -1
  img_proc: true
- pgno: 437
  md: "We say that malloc() creates a new dynamic variable of type int and gives the\
    \ address of the new dynamic variable to pointer p. This dynamic variable is then\
    \ referred to as “the thing pointed to by p” or *p.\n\n```\n*p = 5;\nprintf(\"\
    %d\\n\", *p);\n```\n\nIn fact, *p can be used anyplace that it is appropriate\
    \ to use a variable of type int. When a dynamic variable is no longer needed,\
    \ we can use the free() function to free the memory space allocated to the dynamic\
    \ variable:\n\n```\nfree(p);\n```\n\nfree() deallocates a block of memory allocated\
    \ by a previous call to malloc(). It destroys the dynamic variable referenced\
    \ by pointer p. The storage allocated to this variable is returned (recycled)\
    \ to be assigned to some other dynamic variable. Accordingly, any further reference\
    \ to *p is illegal. free() is also prototyped in alloc.h and stdlib.h. See if\
    \ you can follow the pointers in the following program.\n\n```\n// dynamic.c\n\
    #include <stdio.h>\n#include <alloc.h>\n\nint main(void) {\n    int *p, *q;\n\n\
    \    p = (int *) malloc(sizeof(int));\n    *p = 3;\n    q = (int *) malloc(sizeof(int));\n\
    \    *q = 5;\n    printf(\"*p = %d   *q = %d\\n\", *p, *q);\n    free(p);\n  \
    \  p = q;\n    printf(\"*p = %d   *q = %d\\n\", *p, *q);\n    *q = 7;\n    printf(\"\
    *p = %d   *q = %d\\n\", *p, *q);\n    q = (int *) malloc(sizeof(int));\n    *q\
    \ = 9;\n    printf(\"*p = %d   *q = %d\\n\", *p, *q);\n}\n```"
  merge: -1
  img_proc: true
