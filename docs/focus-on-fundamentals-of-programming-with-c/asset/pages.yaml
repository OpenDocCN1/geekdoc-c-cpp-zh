- pgno: 53
  md: '# Constants


    Constants are values that cannot be modified during the execution of a program.
    A constant can be a number, character, or character string.


    # Numeric Constants


    Decimal constants are written as a non-empty sequence of digits, the first of
    which is not zero.


    ```

    234

    9032

    ```


    Octal constants are written with a leading zero followed by digits 0-7:


    ```

    032

    0266

    ```


    Hexadecimal constants are written with a leading 0x followed by 0-9, A-F, a-f:


    ```

    0x42

    0x1AF

    0xAB9D

    ```


    # Character Constants


    Character constants are usually just the character enclosed in single quotes:


    ```

    ''A''

    ''a''

    ''$''

    ''5''

    ''\n''

    ''\t''

    ''\0''

    ```'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'Character constants have the type `int` whose values are the integer encodings
    of the characters in the target character set (ASCII – Unicode). For example:


    ```

    ''A'' = 65

    ''a'' = 97

    ''$'' = 36

    ''5'' = 53

    ''\n'' = 10

    ''\t'' = 9

    ''\0'' = 0

    ```


    # String Constants


    String constants are a (possibly empty) sequence of characters enclosed in double
    quotes:


    ```

    "Haley"

    "Samantha"

    "Mellow"

    ""

    ```


    Note that string constants, unlike other constants, actually have a location in
    memory. For each string constant of N characters, there will be at run-time a
    statically allocated block of N+1 characters whose first N characters are initialized
    with the characters from the string and whose last character is the null character,
    ''\0''. The null character is used so programs can conveniently find the end of
    a string.


    We can now see why the character ''a'' is not the same as the string "a". The
    character ''a'' represents a single ASCII character, while the string "a" contains
    an array of two characters that contains the ASCII character ''a'' along with
    the null character ''\0''.


    The shortest string is the null string and is represented as "". It is stored
    in memory as the single null character ''\0''.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# Mixing Data Types


    Numerical data types can be converted from one type to another. For example:


    +   - int can be converted to double or float

    +   - int can be converted to char (may cause some loss of information)

    +   - char can be converted to int

    +   - float can be converted to double

    +   - double can be converted to float (may cause some loss of accuracy)

    +   - double or float can be converted to int (but fractional values will be truncated)


    # Implicit (automatic) Conversions


    Whenever different data types are used in an assignment expression, the data type
    on the right side of the expression is converted to the data type on the left
    side. For example:


    ```

    int num;

    char c;

    num = c;

    ```


    Here, c is converted to an int and then assigned to num. Because a char data type
    needs fewer bits than an int, c is normally zero-filled on the left during conversion.


    However, when you make the assignment:


    ```

    c = num;

    ```


    the integer num is assigned to a char and any excess bits in num are discarded
    before assignment to c. In fact, the most significant bits are discarded so information
    will be lost!'
  merge: -1
  img_proc: true
- pgno: 56
  md: "# Performing Binary Operations on Mixed Data Types\n\nIf you perform binary\
    \ operation on two different data types, the compiler will convert the data type\
    \ that requires the fewer number of bits to the data type that requires the greatest\
    \ number of bits for internal storage.\n\nFor example, if an int and a double\
    \ are multiplied, the int is converted to a double before the multiplication because\
    \ the double requires a larger number of bits for its internal representation\
    \ than does an int. The result returned from the operation is converted to the\
    \ data type that requires the largest number of bits for its representation, in\
    \ this case a double.\n\nSee if you can figure out the output produced from the\
    \ following program:\n\n```\n#include <stdio.h>\n\nint main(void) {\n   float\
    \ f1 = 123.125, f2;\n   int i1, i2 = 150;\n   char c = 'a'; =99\n\n   // float\
    \ to int conversion\n   i1 = f1;\n   printf(\"%d\\n\", i1); 129\n\n   // int to\
    \ float conversion\n   f1 = i2;\n   printf(\"%f\\n\", f1); 150.000000\n\n   //\
    \ int divided by int\n   f1 = i2 / 100;\n   printf(\"%f\\n\", f1); 1.00\n\n  \
    \ // int divided by float\n   f2 = i2 / 100.0;\n   printf(\"%f\\n\", f2); 1.5\n\
    \   return 0;\n}\n```\n\nHere's the output:\n\n```\n123\n150.000000\n1.000000\n\
    1.500000\n```"
  merge: -1
  img_proc: true
- pgno: 57
  md: 'Can you see why?


    Note that integer division truncates towards zero:


    ```

    int a, b;

    :

    a = 1/3;   // produces 0

    b = 6/7;   // produces 0

    ```


    However, if either operand of the division is a float, both operands are converted
    to float:


    ```

    float w, x, y, z;

    :

    w = 1.0 / 3.0;   // 0.333333

    x = 1.0 / 3;     // 0.333333

    y = 6.0 / 7.0;   // 0.857143

    z = 6 / 7.0;     // 0.857143

    ```


    # Explicit (automatic) Conversions


    The cast operator converts (casts) the value of a variable into a type that is
    different from the original type of the variable. The cast is specified by giving
    the cast type in parentheses followed by the expression to be cast:


    ```

    (cast-type) expression

    ```


    For example::


    ```

    int x;

    float y;

    :

    y = (float) x;

    ```'
