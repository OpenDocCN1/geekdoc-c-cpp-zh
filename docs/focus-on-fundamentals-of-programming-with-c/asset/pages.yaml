- pgno: 75
  md: '# # Assignment Operator


    One reason for the power of C is its wide range of useful operators. An operator
    is a function that is applied to values to give a result. You should be familiar
    with operators such as =, +, -, *, /.


    Assignment and arithmetic operators are the most common. Other operators are used
    for comparison of values, combination of logical states, and manipulation of individual
    binary digits. The operators of C provide the programmer with really all the capabilities
    that are available in assembler language without limiting the program to one specific
    hardware.


    The assignment operator, =, assigns the value of the operand on the right hand
    side to the operator on the left hand side:


    ```

    num = 7;

    ```


    assigns the value of 7 to num. The value 7 becomes the value of the assignment
    expression as a whole, i.e., the assignment statement actually returns the assigned
    value.


    Another example:


    ```

    x = (y = 5) + (z = 7);

    ```


    Here, the value of 5 is assigned to y, and the value of 7 is assigned to z. But
    5 is returned from the first assignment statement is added to the 7 that is returned
    by the second assignment statement, and the value of 12 is assigned to x. The
    code below has the same effect:


    ```

    y = 5;

    z = 7;

    x = y + z;

    ```


    The assignment operator actually associates right to left so the following code:


    ```

    x = y = z = 0;

    ```'
  merge: -1
  img_proc: true
