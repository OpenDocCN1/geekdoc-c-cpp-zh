  md: "# Arrays as Function Arguments\n\nWhen passing arrays as parameters, the entire\
    \ contents of the array are not copied into the formal parameter array. Instead,\
    \ a pointer (an address) to the first element of the array is passed to the formal\
    \ parameter. Therefore, any changes made to the formal parameter array by the\
    \ function are actually made to the original array passed to the function and\
    \ not to a copy of the array. In other words, arrays are always passed by reference\
    \ in C.\n\nTo pass an entire array to a function, it is only necessary to list\
    \ the name of the array, without any subscripts, inside the call to the function.\
    \ Although the receiving function need not know the size of the array, it's usually\
    \ a good idea to pass the size of the array to the function.\n\n# Example: Passing\
    \ an array by reference.\n\nOur example will declare and initialize an array of\
    \ ten elements. The array will be passed to a function where the elements of the\
    \ array will be changed. The array is output both before and after the call to\
    \ the function that changes the array elements.\n\n```\n#include <stdio.h>\n\n\
    void updateArray(int num[], int size);\n\nint main(void) {\n    int x[10];\n\n\
    \    for (i = 0; i < 10; i++) {\n        x[i] = i * 10;\n    }\n\n    printf(\"\
    Before: \");\n    for (i = 0; i < 10; i++) {\n        printf(\"%5d\", x[i]);\n\
    \    }\n\n    printf(\"\\n\\n\");\n\n    updateArray(x, 10);\n\n    printf(\"\
    After: \");\n    for (i = 0; i < 10; i++) {\n        printf(\"%5d\", x[i]);\n\
    \    }\n\n    printf(\"\\n\\n\");\n    return 0;\n}\n```"
  merge: -1
  img_proc: true
