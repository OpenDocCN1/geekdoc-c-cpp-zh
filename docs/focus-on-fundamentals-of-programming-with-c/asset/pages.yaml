    #include <stdio.h>\n#include <ctype.h>\n#include <stdlib.h>\n\nint main(void)\
    \ {\n    FILE *fp;\n    int c, i;\n    static int letter[256];\n\n    if ((fp\
    \ = fopen(\"getty.txt\", \"r\")) == NULL) {\n        fprintf(\"File %s could not\
    \ be opened.\\n\", fileName);\n        exit(1);\n    }\n\n    while ((c = getc(fp))\
    \ != EOF) {\n        if (isupper(c) || islower(c)) {\n            letter[c] +=\
    \ 1;\n        }\n    }\n\n    for (i = 'A'; i < 'Z'; ++i) {\n        if (letter[i]\
    \ != 0) {\n            printf(\"%d %c %d\\n\", i, i, letter[i]);\n        }\n\
    \    }\n\n    puts(\"\\n\");\n\n    for (i = 'a'; i < 'z'; ++i) {\n        if\
    \ (letter[i] != 0) {\n            printf(\"%d %c %d\\n\", i, i, letter[i]);\n\
    \        }\n    }\n\n    fclose(fp);\n    return 0;\n}\n```\n\nNote that although\
    \ we are concerned with only upper or lower case characters, we declare an array\
    \ of 256 locations to cover all possible characters, both printable and non-printable,\
    \ that we might encounter in the file.\n\nSo each element of the array will be\
    \ used as a counter for the letter with the numeric code of the index. But where\
    \ do we initialize each element of the array, i.e., where do we initialize each\
    \ counter to zero?\n\nThe answer is that the letter array was declared as static\
    \ and an int array declared as static automatically initializes each element of\
    \ the array to zero!"
