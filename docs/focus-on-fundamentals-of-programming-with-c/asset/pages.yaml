  md: "# Function Examples\n\nFunctions let you chop up a long program into named\
    \ sections so that the sections can be reused throughout the program. A function\
    \ is considered to be an independent set of statements for performing some computation.\
    \ As we've seen, functions typically accept parameters and can also return a result.\n\
    \n# Example 1: Leap Year Function\n\nHere's an example of a function that returns\
    \ false (0) or true (1), depending upon whether or not a year is a leap year.\
    \ We define a leap year as any year that is evenly divisible by 4 but not 100,\
    \ except that years divisible by 400 are leap years:\n\n```\nint leapYear(int\
    \ year) {\n    int num;\n\n    if ((year % 4 == 0 && year % 100 != 0) || year\
    \ % 400 == 0) {\n        num = 1;\n    } else {\n        num = 0;\n    }\n   \
    \ return num;\n}\n```\n\nThis function contains one local variable, num, which\
    \ is declared after the opening brace of the function. The local variable of a\
    \ function vanishes as soon as the matching closing brace is reached in the function.\
    \ While they exist, local variables live on the system stack. Actually, C allows\
    \ you to declare variables after any opening brace, and they exist until the program\
    \ reaches the matching closing brace and then they disappear.\n\nNote that there\
    \ is no semicolon after the parentheses in the function header. If you accidentally\
    \ put one in, you would get a huge cascade of error messages from the compiler\
    \ that make no sense.\n\nThe type of the value that is returned from the function,\
    \ in this case int, is specified before the function name. The data value that\
    \ is passed to the function, the formal parameter, appears in the parentheses\
    \ after the function name. The data type of the parameter precedes the formal\
    \ parameter (int year).\n\nAs we've discussed, function definitions may be placed\
    \ in any order, but usually the main() function is placed first. The return expression\
    \ indicates the"
  merge: -1
  img_proc: true
- pgno: 222
  md: "function is to return the value of the expression back to the calling routine.\
    \ The function is immediately exited and control of the program returns to the\
    \ calling function. The return statement has the same effect as encountering the\
    \ last brace in a function.\n\nIf there is no return statement in the function,\
    \ control then passes back to the calling function when the closing brace of the\
    \ body of the function is encountered.\n\nNote that there can be more than one\
    \ return statement in a function:\n\n```\n```c\nint leapYear(int year) {\n   \
    \ if ((year % 4 == 0 && year % 100 != 0) || year % 400 == 0) {\n        return\
    \ 1;\n    } else {\n        return 0;\n    }\n}\n```\n```\n\nThe return statement\
    \ may even include an expression:\n\n```\n```c\nint leapYear(int year) {\n   \
    \ return (year % 4 == 0 && year % 100 != 0) || year % 400 == 0;\n}\n```\n```\n\
    \nRemember from our discussion of control structures, the statement:\n\n```\n\
    ```c\nif (a == 0)\n```\n```\n\ncould be written as\n\n```\n```c\nif (!a)\n```\n\
    ```"
