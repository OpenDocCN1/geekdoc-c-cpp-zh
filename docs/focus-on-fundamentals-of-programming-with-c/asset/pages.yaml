  md: "# A Note on Microsoft C Compilers (Again)\n\nIf you are using a Microsoft compiler,\
    \ the use of fopen() might produce a warning message during the build phase. Instead,\
    \ Microsoft offers a more secure form of fopen() called fopen_s() which returns\
    \ an error code of 0 if successful or non-zero if failure, rather than a file\
    \ pointer.\n\nHere's the usage:\n\n```\nerrorCode = fopen_s(&fp, \"infile.txt\"\
    , \"x\");\nif (errorCode != 0) {\n    printf(\"File could not be opened.\\n\"\
    );\n    exit(1);\n}\n```\n\nOnce again, we can combine the fopen_s() call, the\
    \ assignment of the returned error code, and the test against the NULL pointer,\
    \ into a single expression:\n\n```\nif ((fopen_s(&fp, \"infile.txt\", \"x\"))\
    \ == 0) {\n    printf(\"File could not be opened.\\n\");\n    exit(1);\n}\n```\n\
