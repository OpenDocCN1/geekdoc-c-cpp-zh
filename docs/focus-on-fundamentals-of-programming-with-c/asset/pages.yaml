- pgno: 201
  md: "# Putchar()\n\nputchar() outputs a single character to standard output (terminal\
    \ window). The arguments to putchar() should be one individual character, either\
    \ variable or constant:\n\n```\nputchar(c);\nputchar('a');\nputchar('\\n');\n\
    ```\n\nIf you just need to output a single character without format, use putchar()\
    \ instead of printf(). Here's a program, copy.c that copies its input to output:\n\
    \n```\n#include <stdio.h>\n\nint main(void) {\n    int c;\n\n    while ((c = getchar())\
    \ != EOF) {\n        putchar(c);\n    }\n    return 0;\n}\n```\n\nNote, if this\
    \ program is applied to a file of 100 bytes, it will call getchar() 101 times.\
    \ The first 100 calls will return a data byte. The 101st call will return the\
    \ EOF value. Therefore the test is evaluated 101 times and the loop body is executed\
    \ 100 times.\n\nWith this program we can write our own command line copy command\
    \ using I/O redirection:\n\n```\ncopy < infile.txt > outfile.txt\n```"
