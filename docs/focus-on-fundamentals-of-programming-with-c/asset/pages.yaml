- pgno: 182
  md: "# Comma Operator\n\nOnce in a while, you find yourself in a situation in which\
    \ C expects a single expression, but you have two things you want to say. The\
    \ most common (and in fact the only common) example is in a for loop, specifically\
    \ the first and third controlling expressions. What if (for example) you want\
    \ to have a loop in which i counts up from 0 to 10 at the same time that j is\
    \ counting down from 10 to 0? You could manipulate i in the loop header and j\
    \ “by hand”:\n\n```\nj = 10;\nfor (i = 0; i < 10; i++, )\n{\n    ... rest of loop\
    \ ...\n}\n```\n\nBut here it’s harder to see the parallel nature of i and j, and\
    \ it also turns out that this won’t work right if the loop contains a continue\
    \ statement. (A continue would jump back to the top of the loop, and i would be\
    \ incremented but j would not be decremented.) You could compute j in terms of\
    \ i:\n\n```\nfor (i = 0; i < 10; i++, )\n{\n    j = 10 - i;\n    ... rest of loop\
    \ ...\n}\n```\n\nbut this also makes j needlessly subservient. The usual way to\
    \ write this loop in C would be:\n\n```\nfor ( (1) i = 0, j = 10; (2) i < 10;\
    \ (3) i++, j-- )\n{\n    ... rest of loop ...\n}\n```\n\nHere, the first (initialization)\
    \ expression is:\n\n```\ni = 0, j = 10\n```"
  merge: -1
  img_proc: true
- pgno: 183
  md: 'The comma is the *comma operator*, which simply evaluates the first subexpression
    `i = 0`, then the second `j = 10`.


    The third controlling expression:


    ```

    i++, j--

    ```


    also contains a comma operator, and again, performs first `i++` and then `j--`.


    In this example we initialize both variable `i` and `j` to 0 in the `for` loop.


    ```

    for (i = 0, j = 0; i < 10; ++i)

    ```


    Precisely stated, the meaning of the comma operator in the general expression:


    ```

    e1 , e2

    ```


    is “evaluate the subexpression *e1* (then evaluate *e2*; the value of the expression
    is the value of *e2*.” Therefore, *e1* had better involve an assignment or an
    increment `++` or decrement `--` or function call or some other kind of *side
    effect*, because otherwise it would calculate a value that would be discarded.


    There’s hardly any reason to use a comma operator anywhere other than in the first
    and third controlling expressions of a `for` loop, and in fact most of the commas
    you see in C programs are *not* comma operators. In particular, the commas between
    the arguments in a function call are not *comma* operators; they are just punctuation
    which separate several argument expressions. It’s pretty easy to see that they
    cannot be *comma* operators, otherwise in a call like:


    ```

    printf("Hello, %s!\n", "world");

    ```


    the action would be “evaluate the string “Hello, %s!\n”, discard it, and pass
    only the string “world” to `printf()`. This is of course *not* what we want; we
    expect both strings to be passed to `printf()` as two separate arguments (which
    is, of course, what happens).'
  merge: -1
  img_proc: true
- pgno: 184
  md: "# # Do While Loop\n\nThe do-while loop is very similar to the while loop except\
    \ that the test occurs at the end of the loop body. This guarantees that the loop\
    \ is executed at least once before continuing. Such a setup is frequently used\
    \ where data is to be read. The test then verifies the data and loops back to\
    \ read again if the data was unacceptable.\n\nFor example, suppose you want to\
    \ read in a positive integer and you want to insist that the integer is positive:\n\
    \n```\ndo {\n    printf(\"Enter a positive value: \");\n    scanf(\"%d\", &num);\n\
    } while (num <= 0);\n```\n\nNote the following:\n\n+   - The condition num <=\
    \ 0 is tested after execution of the loop body.\n\n+   - The loop continues as\
    \ long as the evaluation expression, num <= 0, is true.\n\n+   - The loop terminates\
    \ when expression, num <= 0, becomes false.\n\n+   - The code always executes\
    \ the body of the loop at least once.\n\n+   - The semicolon is required after\
    \ the closing parenthesis at the end of the do-while loop construct.\n\n+   -\
    \ The variable(s) used in the loop condition normally should be initialized before\
    \ the loop is entered, and then updated (in the loop body) before the loop condition\
    \ is tested at the end of each repetition of the loop body.\n\nNote that when\
    \ a do-while loop construct has only one statement then the curly braces {} are\
    \ optional. However, it's always a good idea to use the curly braces even though\
    \ they're not required."
  merge: -1
  img_proc: true
