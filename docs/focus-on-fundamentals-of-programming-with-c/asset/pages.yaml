- pgno: 536
  md: '# Rotate Example


    Assembler language code typically contains two rotate instructions. The rotate
    right (ROR) instruction shifts bits to the right. Bits shifted out at the right
    are shifted back in at the left. For example, the assembler instructions:


    ```

    MOV AL, 10111011

    ROR AL, 1

    ```


    have the effect of shifting a single bit out of the right and back into the left:


    ![](img/7f36c52b5170b89b142dbb7b1ea4666b_536_0.png)


    Register AL now contains the value 11011101.


    The rotate left (RCL) instruction shifts bits to the left. Bits shifted out at
    the left are shifted back in at the right. For example, the assembler instructions:


    ```

    MOV AL, 10000000

    ROL AL, 1

    ```


    have the effect of shifting a single bit out of the left and back into the right:


    ![](img/7f36c52b5170b89b142dbb7b1ea4666b_536_1.png)


    Register AL now contains the value 00000001. Note that if you have 8 rotates,
    you end up with the original number!'
  merge: -1
  img_proc: true
- pgno: 537
  md: "Unfortunately, C does not have a left or a right rotate operator. So let's\
    \ develop a function to simulate the rotate left and rotate right statements.\
    \ The function will take two arguments:\n\n+   The value to be rotated (num)\n\
    +   \n+   The number of bits the value will be rotated by (x). If x is a positive\
    \ integer, we will perform a left rotate and if x is a negative integer, we will\
    \ perform a right rotate.\n\nIn order to compute the result of rotating num to\
    \ the left by x bits, we will utilize the following three-step algorithm:\n\n\
    +   Extract the leftmost x bits of num.\n+   \n+   Shift num to the left by x\
    \ bits.\n+   \n+   Put the extracted bits back into num at the right.\n\nWe will\
    \ use a similar algorithm to perform a rotate right.\n\n```\n// rotate.c\nunsigned\
    \ rotate(unsigned num, int x) {\n    unsigned bits, result;\n    if (x > 0) {\n\
    \        bits = num >> (sizeof(unsigned)*8 - x);\n        result = num << x |\
    \ bits;\n    } else {\n        x *= -x;\n        bits = num << (sizeof(unsigned)*8\
    \ - x);\n        result = num >> x | bits;\n    }\n    return result;\n}\n```"
  merge: -1
  img_proc: true
