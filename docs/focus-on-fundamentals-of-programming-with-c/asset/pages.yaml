  md: "```\n#include <stdio.h>\n\nint findMax(int product, int value);\n\nint main\
    \ (void) {\n    int num, value, max;\n\n    num = 5;\n    value = 1000;\n\n  \
    \  max = findMax(num, value);\n    printf(\"The first power of %d larger than\
    \ %d is %d.\", num,\n           value, max);\n\n    return 0;\n}\n\nint findMax(int\
    \ product, int value) {\n    while (product <= value) {\n        product *= 2;\n\
    \    }\n    return product;\n}\n```\n\nHere's the output produced:\n\n```\nThe\
    \ first power of 5 larger than 1000 is 1280.\n```\n\n# Counter Controlled Loops\n\
    \nA counter controlled loop repeats a series of executable statements a specified\
    \ number of times using a variable to count the number of loop iterations completed.\n\
    \n+   • The number of times that the loop body will be repeated must be known\
    \ before checking the loop condition the first time and must not be changed within\
    \ the loop body.\n\n+   • The counting variable must be initialized to a known\
    \ value before checking the loop condition the first time.\n\n+   • The counting\
    \ variable must be updated within the loop body or the loop condition will never\
    \ evaluate to false, creating an infinite loop that will never stop."
