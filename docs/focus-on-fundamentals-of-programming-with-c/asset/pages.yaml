  md: '# Escape Characters


    Some non-printing and hard to print characters require an escape sequence. The
    newline character, `\''n\''`, is a good example. Even though it is described by
    the two characters \\ and n, it represents a single ASCII character. The backslash,
    \\, is called the escape character and is used to escape the usual meaning of
    the character that follows it.


    Escape characters can be used in character and string constants to represent characters
    that would be awkward or impossible to enter in the source program directly. There
    are both character escapes and numeric escapes:


    +   - Character escapes can be used to represent some particular formatting as
    well as special characters.

    +   - Numeric escapes allow a character to be specified by its numeric coding.


    # Character Escape Codes


    Character escape codes are used to represent some common special characters in
