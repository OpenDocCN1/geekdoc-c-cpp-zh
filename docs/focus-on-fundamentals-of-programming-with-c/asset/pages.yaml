- pgno: 77
  md: '# Arithmetic Operators


    Operators and values are combined to form expressions. The values produced by
    these expressions can be stored in variables, or used as a part of even larger
    expressions.


    ```

    + addition

    - subtraction

    * multiplication

    / integer division

    % modulus (only defined for ints)

    - unary minus (negates the operand)

    ```


    Operators *, /, % will be performed before + or - in any expression. Brackets
    can be used to force a different order of evaluation to this. Where division is
    performed between two integers, the result will be an integer, with remainder
    discarded. For example:


    ```

    7 / 3 = 2

    8 / 4 = 2

    3 / 3 = 1

    4 / 7 = 0

    0 / 7 = 0

    7 / 0 = error

    ```


    Note that if a program is ever required to divide a number by zero, this will
    cause an error, usually causing the program to crash.


    The modulus operator: (%) is only meaningful between integers and returns the
    remainder of a division and ignores the quotient. For example:


    ```

    7 % 3 = 1

    8 % 3 = 2

    4 % 2 = 0

    2 % 5 = 2

    ```'
