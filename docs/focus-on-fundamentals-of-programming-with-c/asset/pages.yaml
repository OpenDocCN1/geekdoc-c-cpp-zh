- pgno: 145
  md: '# Techniques of Problem Solving


    We are now ready to examine problems that computers can solve. First we need to
    know how to solve a problem and then we need to learn how to use a programming
    language to implement our solution on the computer.


    Before looking at problem solving and writing programs for the computer, we should
    understand that programming can cause a significant amount of frustration because:


    +   1. Planning is a critical issue. First, you must plan to develop instructions
    to solve your problem and then you should plan to translate those instructions
    into code before you sit down at the keyboard. You should not attempt to type
    in code "off the top of your head."


    +   2. Time is a major problem. Writing programs is not like completing other
    assignments. You cannot expect to complete a programming assignment by staying
    up late the night before it is due. You must begin early and expect to make several
    revisions before your final version will be ready.


    +   3. Successful problem solving and programming require extreme precision. Generally,
    concepts in computer science are not difficult; however, implementation of these
    concepts allows no room for error. For example, one misplaced semicolon in a 1,000-line
    program could prevent the program from working.


    In other words, you must be prepared to plan well, start early, be patient, handle
    frustration, and work hard to succeed in computer science. If you cannot do this,
    you will probably neither enjoy computer science nor be successful at it.


    The key to writing a successful program is planning. Good programs do not just
    happen; they are the result of careful design and patience. Just as an artist
    commissioned to paint a portrait would not start out by shading in the lips and
    eyes, a good computer programmer would not attack a problem by immediately trying
    to write code for a program to solve the problem. Writing a program is like writing
    an essay: an overall theme is envisioned, an outline of major ideas is developed,
    each major idea is subdivided into several parts, and each part is developed using
    individual sentences.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# Six Steps to Good Programming Habits


    In developing a program to solve a problem, six steps should be followed: analyze
    the problem, develop an algorithm, write code for the program, run the program,
    test the results and document the program. These steps will help develop good
    problem-solving habits and, in turn, solve programming problems correctly. A brief
    discussion of each of these steps follows:


    # Step 1. Analyze the Problem.


    This is not a trivial task. Before you can do anything, you must know exactly
    what it is you are to do. You must be able to formulate a clear and precise statement
    of what is to be done. You should understand completely what data are available
    and what may be assumed. You should also know exactly what output is desired and
    the form it should take.


    # Step 2. Develop an Algorithm.


    An algorithm is a finite sequence of effective statements that, when applied to
    the problem, will solve it. An *effective statement* is a clear, unambiguous instruction
    that can be carried out. Each algorithm you develop should have a specific beginning;
    at the completion of one step, have the next step uniquely determined; and have
    an ending that is reached in a reasonable amount of time.


    # Step 3. Write Code for the Program.


    When the algorithm correctly solves the problem, you can think about translating
    your algorithm into a high-level language. An effective algorithm will significantly
    reduce the time you need to complete this step.


    # Step 4. Run the Program.


    After writing the code, you are ready to run the program. This means that, using
    an editor, you type the program code into the computer, compile the program, and
    run the program. At this point, you may discover errors that can be as simple
    as typing errors or that may require a reevaluation of all or parts of your algorithm.
    The probability of having to make some corrections or changes is quite high.


    # Step 5. Test the Results.


    After your program has run, you need to be sure that the results are correct,
    that they are in a form you like, and that your program produces the correct solution
    in all cases. To be sure the results are correct, you must look at them and compare
    them with what you expect. In the case of using a program with arithmetic operations,
    this means checking some results with pencil and paper. With complex programs,
    you will need to thoroughly test the program by running it many times using data
    that you have carefully selected. Often you will need to make revisions and return
    to Step 4.'
  merge: -1
  img_proc: true
- pgno: 147
  md: "# Step 6. Document the Program.\n\nIt is very important to completely document\
    \ a working program. The writer knows how the program works; if others are to\
    \ modify it, they must know the logic used. As you develop the ability to write\
    \ programs to solve more complex problems, you will find it helpful to include\
    \ documentation in Step 3 as you write the code.\n\n# Developing Algorithms\n\n\
    Algorithms for solving a problem can be developed by stating the problem and then\
    \ subdividing the problem into major subtasks. Each subtask can then be subdivided\
    \ into smaller tasks. Tasks identified at each stage of this process are called\
    \ modules. This process is repeated until each remaining task is one that is easily\
    \ solved and trivial to implement in C. This process is known as topdown design,\
    \ and each successive subdivision is referred to as a stepwise refinement. This\
    \ enables us to solve a large problem one step at a time, rather than provide\
    \ the entire solution at once.\n\nNot only is this technique of stepwise refinement\
    \ an efficient design method, it also produces a good algorithm in the sense that:\n\
    \n+   • the algorithm is easier to understand\n+   • subsequent modifications\
    \ are relatively easy to make\n\nThis technique lets you plan a program without\
    \ actually writing in C:\n\n+   • Its easier to think in English than computereze\n\
    +   • Tackling a problem from the top puts off the nitty-gritty of encoding for\
    \ as long as possible\n\n# Stepwise refinement of a problem:\n\n+   1. State the\
    \ problem simply, decomposing it into its logical subproblems.\n+   \n+   2. If\
    \ you can immediately figure out how to encode any of the subproblems, do so.\
    \ These will be the main functions of your program.\n+   \n+   3. If the subproblems\
    \ are too complex, refine them into smaller, more basic subproblems, etc."
  merge: -1
  img_proc: true
