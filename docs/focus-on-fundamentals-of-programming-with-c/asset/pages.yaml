- pgno: 255
  md: '# Calculating Letter Frequency


    Suppose that we wanted to calculate the number of times each letter (upper and
    lower case) appears in a text file. Looking at the ASCII (or Unicode) table we
    see that the numeric values for the capital letters range from 65 - 90 and the
    numeric values for the lower case letters range from 97 – 122.


    A simple technique for counting the frequency occurrence of each letter would
    be to use an array, `letter`, to store a count of each of the characters read
    from the file. We could use each character''s ASCII value as an index into the
    array where the count of that character would be kept.


    For example, each time we saw the letter `''A''` in a file, we could increment
    the counter in the `letter` array at index 65, as 65 is the numeric value for
    `''A''`:


    ```

    letter[65] = letter[65] + 1;

    or

    ++letter[65];

    or

    ++letter[''A''];

    ```


    Here, the character `''A''` would be cast into a numeric value (65), and that
    numeric value would be used as the index into the `letter` array.


    We can generalize this for each letter in the file as:


    ```

    ++letter[c];

    ```


    where c is a character read from the file.


    Our code to calculate the frequency of letters in a text file looks like this:'
