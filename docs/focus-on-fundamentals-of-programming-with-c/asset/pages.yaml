  md: '# Bitwise Operator Lab


    # Part 1


    Write a program, bitSet.c, which contains a function, bitSet(), that sets a specified
    number of bits in an int to a particular value and outputs the resultant int in
    hexadecimal notation. The function prototype follows:


    ```

    void bitSet(int *num, int value, int start, int size);

    ```


    The function arguments are defined as follows:


    | num | Pointer to an int in which the specified bits are to be set |

    | value | int containing the value that the bits are to be set to, right justified
    |

    | start | int specifying starting bit number, with the leftmost bit numbered 0
    |

    | size | int specifying the size of the field |


    So, for example, the call:


    ```

    bitSet(&num, 0, 2, 5);

    ```


    would have the effect of setting the five bits contained in num, beginning with
    the third bit from the left (bit number 2), to zero.


    Similarly, the call:


    ```

    bitSet(&num, 0X55, 0, 8);

    ```


    would set the eight leftmost bits of num to hexadecimal 55.'
