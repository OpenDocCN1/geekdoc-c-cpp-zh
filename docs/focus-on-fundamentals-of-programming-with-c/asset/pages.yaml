- pgno: 18
  md: '# Stepwise Refinement – Part 2


    # Finding the longest sub-sequence, a description of the problem.


    Our goal is to locate the largest adjacent sub-sequence of increasing numbers
    contained in a larger sequence of numbers. The sequence of numbers is ended with
    a zero. We don''t want to remember the sub-sequence itself, only the number of
    elements in the largest sub-sequence.


    For example, given the sequence of numbers:


    ```

    12, 22, 9, 8, 1, 4, 7, 2, 8, 9, 11, 12, 0

    ```


    The largest number of elements in an increasing sequence is 5.


    # Designing an algorithm by successive refinement.


    How do you start? Well, think of the problem as a series of smaller problems.
    You must break it down. Then you will break down the smaller problems into still
    smaller ones. You should continue this process until you have a series of precise
    steps, each one well defined, which will always yield a solution. This is called
    designing an algorithm by stepwise refinement.


    # The first try.


    At the top level, the algorithm looks like this:


    ```

    1. Find the longest increasing sub sequence.

    2. Print its length.

    ```


    # Try again.


    Obviously step 1 must be expanded somehow, but how? Well, now the question comes
    down to: how do we find the longest increasing sub-sequence? Must we find all
    the sub-sequences and them compare them?


    With a bit of ingenuity you will realize that you only have to remember the length
    of the longest sub-sequence that you have seen so far. You can compare the GREATEST_LENGTH_SO_FAR
    with the length of the next sub-sequence that you find and let the longest of
    the two be called the GREATEST_LENGTH_SO_FAR.'
  merge: -1
  img_proc: true
- pgno: 19
  md: "So the next attempt at the algorithm might look like this:\n\n```\n1. Find\
    \ the longest increasing sub sequence.\n   1.1. Find the next increasing sub sequence.\n\
    \   1.2. Compare the length of it to the GREATEST_LENGTH_SO_FAR.\n   1.3. Call\
    \ the longer of the two the GREATEST_LENGTH_SO_FAR.\n   1.4. Repeat step 1.1 through\
    \ 1.3 until finished.\n2. Print the GREATEST_LENGTH_SO_FAR.\n```\n\n# Some further\
    \ refinement.\n\nNow, this rather large problem is being described in a series\
    \ of smaller tasks. However, there is still a lot of room for refinement. Each\
    \ step is still not spelled out precisely enough. In fact, each step can be further\
    \ refined into a series of smaller steps. Let's see how to find the next increasing\
    \ sub-sequence:\n\n```\n1.1 Find the next increasing sub sequence.\n   1.1.1.\
    \ Examine the CURRENT_NUMBER.\n   1.1.2. Compare the CURRENT_NUMBER to the PREVIOUS_NUMBER.\n\
    \   1.1.3. If the CURRENT_NUMBER is greater than the PREVIOUS_NUMBER\n      then\n\
    \      1.1.3.1. Add 1 to the LENGTH_OF_CURRENT_SUB_SEQUENCE.\n   1.1.4. Let CURRENT_NUMBER\
    \ now be called PREVIOUS_NUMBER.\n   1.1.5. Let the next number now be the CURRENT_NUMBER.\n\
    \   1.1.6. Repeat steps 1.1.2 through 1.1.5 until CURRENT_NUMBER is not\n    \
    \  greater than PREVIOUS_NUMBER.\n```"
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Almost finished.


    We are almost finished refining our algorithm. Let''s put it all together and
    see how it looks.


    +   1. Find the length of the largest increasing sub sequence.

    +      1.1 Find the next increasing sub sequence.

    +         1.1.1. Examine the CURRENT_NUMBER.

    +         1.1.2. Compare the CURRENT_NUMBER to the PREVIOUS_NUMBER.

    +         1.1.3. If CURRENT_NUMBER is greater than the PREVIOUS_NUMBER then

    +            1.1.3.1. Add 1 to the LENGTH_OF_CURRENT_SUB_SEQUENCE.

    +         1.1.4. Let CURRENT_NUMBER now be called PREVIOUS_NUMBER.

    +         1.1.5. Let the next number now be the CURRENT_NUMBER.

    +         1.1.6. Repeat steps 1.1.2 through 1.1.5 until CURRENT_NUMBER is not
    greater than PREVIOUS_NUMBER.

    +      1.2. Compare the length of it to the GREATEST_LENGTH_SO_FAR.

    +      1.3. Call the longer of the two the GREATEST_LENGTH_SO_FAR.

    +      1.4. Repeat step 1.1 through 1.3 until finished.

    +   2. Print the GREATEST_LENGTH_SO_FAR.


    # A few words about variables, counting and initialization.


    Don''t be put off by unfamiliar names for some relatively simple concepts. A variable
    is no more than the name of something. It is a way of referring to some value
    that will vary over the course of an algorithm or program. For example, as we
    look at one number at a time in original sequence of numbers, whichever number
    we are looking at right now: we call CURRENT_NUMBER.

    CURRENT_NUMBER is the name of the variable that holds the value of the number
    we are currently looking at. This allows us to create an algorithm that will work
    for any sequence of numbers that meets the original description, not just one
    specific sequence of numbers.


    A counter is just a variable that counts. In this algorithm we use one counter.
    We use LENGTH_OF_CURRENT_SUB_SEQUENCE to hold the number of elements in the current
    sub-sequence. This counter starts out at zero and gets increased by'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'one or incremented every time the CURRENT_NUMBER is greater than the PREVIOUS_NUMBER.


    The term initialize means to set your counters and variables to the appropriate
    starting values. For example, what about remembering the GREATEST_LENGTH_SO_FAR?
    Well, when we begin we haven''t seen any sub-sequence, so we can say that at the
    beginning of execution of the program the GREATEST_LENGTH_SO_FAR is zero.


    Another example is the variable PREVIOUS_NUMBER. We can tell that we are looking
    at an increasing sequence when the CURRENT_NUMBER is greater than the PREVIOUS_NUMBER.
    What about the first time? There is no PREVIOUS_NUMBER. Well to get around that
    we initialize PREVIOUS_NUMBER to zero. How do we know what value to initialize
    different numbers to? By trying the algorithm. Remember, the algorithm should
    be a precise step-by-step description of the solution to the problem. You must
    test it by following it through by hand. When you do that you can adjust your
    algorithm where necessary.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Tying it all together.


    So, now let''s see what our complete algorithm looks like:


    +   1. Find the length of the largest increasing sub sequence.

    +      1.0.1. Initialize variables.

    +         1.0.1.1. Set GREATEST_LENGTH_SO_FAR to 0.

    +         1.0.1.2. Set the LENGTH_OF_THE_CURRENT_SEQUENCE to 0.

    +         1.0.1.3. Set the PREVIOUS_NUMBER to 0.

    +      1.1 Find the next increasing sub sequence.

    +         1.1.1. Examine the CURRENT_NUMBER.

    +         1.1.2. Compare the CURRENT_NUMBER to the PREVIOUS_NUMBER.

    +         1.1.3. If CURRENT_NUMBER is greater than the PREVIOUS_NUMBER then

    +            1.1.3.1. Add 1 to the LENGTH_OF_CURRENT_SUB SEQUENCE.

    +         1.1.4. Let CURRENT_NUMBER now be called PREVIOUS_NUMBER.

    +         1.1.5. Let the next number now be the CURRENT_NUMBER.

    +         1.1.6. Repeat steps 1.1.2 through 1.1.5 until CURRENT_NUMBER is not
    greater than PREVIOUS_NUMBER.

    +      1.2. Compare the length of it to the GREATEST_LENGTH_SO_FAR.

    +      1.3. Call the longer of the two the GREATEST_LENGTH_SO_FAR.

    +      1.4. Repeat step 1.1 through 1.3 until finished.

    +      1.5 Repeat step 1.1 through 1.4 until CURRENT_NUMBER is 0.

    +   2. Print the GREATEST_LENGTH_SO_FAR.'
  merge: -1
  img_proc: true
