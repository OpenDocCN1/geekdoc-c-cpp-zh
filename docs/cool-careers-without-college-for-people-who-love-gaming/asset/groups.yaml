  md: "\n## FOR MORE INFORMATION\n\n### BOOKS\n\n- Diver, Mike. *Indie Games: The\
    \ Complete Introduction to Indie Gaming.* Seattle, WA: Amazon Digital Services,\
    \ 2016.\n\n    Diver provides an introduction to the indie gaming field, including\
    \ insights on the differences between indie gaming companies and large commercial\
    \ gaming companies.\n\n- Dreskin, Joel. *A Practical Guide to Indie Game Marketing.*\
    \ Seattle, WA: Focal Press, 2015.\n\n    Dreskin gives practical advice about\
    \ marketing an indie game on a limited budget and with limited resources and staff.\n\
    \n- Hill-Whittall, Richard. *The Indie Game Developer Handbook.* Seattle, WA:\
    \ Focal Press, 2015.\n\n    Hill-Whittall provides tips and advice for running\
    \ an independent video game studio.\n\n### ORGANIZATIONS\n\nNational Association\
    \ for the Self-Employed (NASE)  \nP.O. Box 241  \nAnnapolis Junction, MD 20701-0241\
    \  \n\n(800) 649-6273  \nWebsite: http://www.nase.org  \n\nNASE provides guidance\
    \ and resources for self-employed people and small business owners.\n\nNational\
    \ Small Business Association (NSBA)  \nP.O. Box 5024  \nCarefree, AZ 85377  \n\
    \n(888) 800-3416  \nWebsite: http://www.nsba.net/contact-nsba  \n\nThe NSBA is\
    \ an organization dedicated to advocating for small business owners to succeed\
    \ on a state and national level.\n\n### VIDEOS\n\n- “Game Loading: The Rise of\
    \ the Indies” (http://www.gameloading.tv)\n\n    This video discusses the subculture\
    \ of independent game development.\n\n- *Indie Game: The Movie* (http://buy.indiegamethemovie.com)\n\
    \n    This film is a feature length documentary about the video game industry.\n\
    \n- *Minecraft: The Story of Mojang* (http://www.minecraftstoryofmojang.com)\n\
    \n    This film explores the rise of the independent video game Minecraft.\n\n\
    ### WEBSITES\n\nDue to the changing nature of internet links, Rosen Publishing\
    \ has developed an online list of websites related to the subject of this book.\
    \ This site is updated regularly. Please use this link to access the list:\n\n\
    http://www.rosenlinks.com/CCWC/game\n\n## CHAPTER 10: MAKE YOUR HOBBY GAME A REALITY\n\
    \nHobby games and family entertainment games have been a big business for generations.\
    \ An entrepreneur can make a lot of money developing the next big game that people\
    \ will want to play. Game companies such as Hasbro, Fantasy Flight Games, Paizo\
    \ Inc., and Wizkids produce millions of dollars’ worth of games each year. Sales\
    \ from toy stores such as Toys “R” Us are in the billions. In 2014 alone, US sales\
    \ revenues at Toys “R” Us reached $12.4 billion. A lot of this revenue comes from\
    \ the sales of traditional board games, card games, and role-playing games.\n\n\
    Many people have good ideas for games, but bringing those ideas to life as a successful\
    \ entrepreneur is another matter entirely. One of the most difficult challenges\
    \ that young entrepreneurs face is coming up with the money to produce and distribute\
    \ their game.\n\n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_127_0.png)\n\nTraditional\
    \ board and hobby games are also a large part of the gaming industry. Before video\
    \ games, card and board games were major ways in which the public engaged in competitive\
    \ and shared gameplay. Some board games have ancient origins, and others are dependent\
    \ on popular culture or clever mechanisms for engaging gameplay.\n\n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_128_0.png)\n\
    \n### HAVING WHAT IT TAKES\n\nBefore you produce your game, you will need to take\
    \ part in the following activities to be successful in your endeavor:\n\n- Write\
    \ a business plan that explains how many units you will produce, how much each\
    \ will cost to make, and how much you will charge.\n- Make a plan for distributing\
    \ your goods locally, nationally, or globally.\n- Create a plan to promote your\
    \ product.\n- Research funding your project, such as crowdsourcing or financial\
    \ backers.\n- Track all funds associated with the costs and profits of the business.\n\
    - Seek accounting help for the tax side of the business.\n\nEntrepreneurs must\
    \ be ready to deal with unexpected problems with the business, so a good attitude\
    \ and a personable outlook will go a long way when dealing with customers, financial\
    \ backers, or business partners.\n\n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_129_0.png)\n\
    \nCrowdsourcing is a great way to raise funds to help make your video game a reality.\
    \ Many projects that have trouble seeking traditional investors take their funding\
    \ into their own hands, bringing a crowdfunding campaign straight to the consumers\
    \ who would be interested. The campaigns provide rewards and special discounts\
    \ to those who buy into the project early to help secure funding.\n\n### CROWDSOURCING\n\
    \nCrowdsourcing is a popular way for independent game creators to obtain funding\
    \ for a game project from a large group of people. People funding a crowdsourced\
    \ project will often be compensated by being given the finished product when the\
    \ project is complete. With this method, the financial backers can support a project\
    \ they approve of or identify with, and the creator gets the money he or she needs\
    \ to make a product.\n\nThe most popular crowdsourcing website is Kickstarter.com.\
    \ One game created through crowdsourcing is the card game *Exploding Kittens*,\
    \ which raised $8,782,571 on Kickstarter and became one of the most funded game\
    \ campaigns of all time.\n\nBe sure to check out other crowdsourcing websites\
    \ such as indiegogo.com, crowdfunder.com, and rockethub.com, and follow the guidelines\
    \ for creating crowd-sourced game projects for each site.\n\nWhen getting funding\
    \ for personal gaming projects proves too difficult, there are other options.\
    \ For instance, board games and books for role-playing games need to be printed\
    \ out, and this can be costly. To save on production costs and keep the selling\
    \ price of your traditional game low, you can create a digital-only traditional\
    \ board, card, or RPG game. Then you can sell the digital files and have the gamer\
    \ print out the game elements at home. Keep an open mind, stay creative, and do\
    \ not get discouraged!\n\n### THE INFLUENCE OF DUNGEONS AND DRAGONS\n\nThe most\
    \ famous traditional indie game of all time, *Dungeons & Dragons*, is also known\
    \ as D&D. Gary Gygax and Dave Arneson formed the company Tactical Studies Rules\
    \ (TSR) in 1973 and first released their adventure game *Dungeons & Dragons* in\
    \ 1974. The first D&D print run was just one thousand box sets that contained\
    \ three game guides.\n\nIn the game, players create fictional characters on paper\
    \ sheets and a single player, the Dungeon Master (DM), describes the story adventure\
    \ as well as the many characters, monsters, and environments the players encounter.\n\
    \n*Dungeons & Dragons* quickly became very popular and by 1981, TSR had revenues\
    \ of $12.9 million. In 1997, the gaming company Wizards of the Coast purchased\
    \ TSR for $25 million. The success of *Dungeons & Dragons* continued, and in 1999\
    \ the toy company Hasbro purchased Wizards of the Coast for $325 million.\n\n\
    The popularity of D&D went on to have a huge impact on video games and role-playing\
    \ games alike. Video games from *Pokémon* to *Diablo* have all been influenced\
    \ by Gygax and Arneson's home-brewed pen and paper game. Today D&D is in its fifth\
    \ iteration.\n\n### PREPARING YOURSELF\n\nBeing an entrepreneur of any kind starts\
    \ with having a great idea that you think people will be interested in. Research\
    \ traditional games and read periodicals about traditional games. These are great\
    \ sources of inspiration. Also attend gaming conventions such as Gen Con. This\
    \ annual gaming convention is a great place for game makers and game buyers to\
    \ meet up, exchange ideas, and make some business deals.\n\n### FUTURE PROSPECTS\n\
    \nThe future for any entrepreneur can be bright. Depending on your particular\
    \ idea or project, the sky's the limit for what you can earn and the ideas you\
    \ can develop. The more patience and determination you have, the greater your\
    \ chances of success. This is not an endeavor, however, for someone who likes\
    \ to play it safe and collect a steady paycheck.\n\n### BOOKS\n\n- Boterman, Jack.\
    \ *The Book of Games: Strategy, Tactics and History.* New York, NY: Sterling Publishing,\
    \ 2008.\n\n    Boterman provides an overview of traditional gaming throughout\
    \ history and its impact on games we play today.\n\n- Orbanes, Philip E. *The\
    \ Game Makers: The Story of Parker Brothers, from Tiddlywinks to Trivial Pursuit.*\
    \ Boston, MA: Harvard Business Review Press, 2003.\n\n    Orbanes gives an overview\
    \ of the traditional game company, Parker Brothers, describing its challenges,\
    \ successes, and climb to international fame over the course of the twentieth\
    \ century and beyond.\n\n- Witwer, Michael. *Empire of Imagination: Gary Gygax\
    \ and the Birth of Dungeons & Dragons.* New York, NY: Bloomsbury Publishing, 2015.\n\
    \n    Witwer provides a history of independent game developer Gary Gygax and his\
    \ role in the game industry.\n"
  mdcn: "\n\n## 更多信息\n\n### 图书\n\n- 迪弗，麦克。*独立游戏：独立游戏完全入门。* 西雅图，华盛顿州：亚马逊数字服务，2016年。\n\
    \n    迪弗介绍了独立游戏领域，包括对独立游戏公司与大型商业游戏公司之间差异的见解。\n\n- 德雷斯金，乔尔。*独立游戏营销实用指南。* 西雅图，华盛顿州：焦点出版社，2015年。\n\
    \n    德雷斯金就如何在预算、资源和人员有限的情况下营销独立游戏提供了实用建议。\n\n- 希尔-惠特尔，理查德。*独立游戏开发者手册。* 西雅图，华盛顿州：焦点出版社，2015年。\n\
    \n    希尔-惠特尔为经营独立电子游戏工作室提供了技巧和建议。\n\n### 组织\n\n全国自雇经营者协会（NASE）  \n邮政信箱241  \n\
    安纳波利斯章克申，马里兰州 20701-0241  \n\n(800) 649-6273  \n网站：http://www.nase.org  \n\nNASE为自雇人士和小企业主提供指导与资源。\n\
    \n全国小企业协会（NSBA）  \n邮政信箱5024  \n凯尔弗里，亚利桑那州 85377  \n\n(888) 800-3416  \n网站：http://www.nsba.net/contact-nsba\
    \  \n\nNSBA是一个致力于倡导小企业主在州级和国家级层面取得成功的组织。\n\n### 视频\n\n- “游戏加载：独立游戏的崛起”（http://www.gameloading.tv）\n\
    \n    该视频探讨了独立游戏开发的亚文化。\n\n- *独立游戏：电影*（http://buy.indiegamethemovie.com）\n\n \
    \   这部电影是一部关于电子游戏行业的长篇纪录片。\n\n- *我的世界：Mojang的故事*（http://www.minecraftstoryofmojang.com）\n\
    \n    这部电影探讨了独立电子游戏《我的世界》的崛起。\n\n### 网站\n\n由于互联网链接的多变性，罗森出版公司开发了一个与本书主题相关的网站在线列表。该网站会定期更新。请使用此链接访问列表：\n\
    \nhttp://www.rosenlinks.com/CCWC/game\n\n## 第10章：让你的爱好游戏成为现实\n\n爱好游戏和家庭娱乐游戏几代以来一直是一项大生意。企业家可以通过开发下一款人们想要玩的热门游戏赚到很多钱。像孩之宝、Fantasy\
    \ Flight Games、Paizo公司和Wizkids等游戏公司每年生产价值数百万美元的游戏。玩具反斗城等玩具店的销售额达数十亿美元。仅在2014年，美国玩具反斗城的销售收入就达到了124亿美元。其中很大一部分收入来自传统棋盘游戏、卡牌游戏和角色扮演游戏的销售。\n\
    \n很多人对游戏都有好点子，但要将这些点子变为现实并成为一名成功的企业家则完全是另一回事。年轻企业家面临的最困难挑战之一是如何筹集资金来生产和分销他们的游戏。\n\
    \n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_127_0.png)\n\n传统棋盘游戏和爱好游戏也是游戏产业的重要组成部分。在电子游戏出现之前，卡牌和棋盘游戏是公众参与竞技和共享游戏体验的主要方式。有些棋盘游戏起源于古代，有些则依赖于流行文化或巧妙的机制来吸引玩家参与。\n\
    \n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_128_0.png)\n\n### 具备所需条件\n\n在制作游戏之前，你需要进行以下活动，以确保你的努力取得成功：\n\
    \n- 撰写一份商业计划书，说明你将生产多少单位、每单位制造成本以及你的定价。\n- 制定在本地、全国或全球分销产品的计划。\n- 创建推广产品的计划。\n\
    - 研究项目融资，例如众筹或资金支持者。\n- 跟踪与业务成本和利润相关的所有资金。\n- 寻求税务方面的会计帮助。\n\n企业家必须准备好应对业务中出现的意外问题，因此良好的态度和亲和的形象在与客户、资金支持者或商业伙伴打交道时会大有帮助。\n\
    \n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_129_0.png)\n\n众筹是筹集资金让你的电子游戏成为现实的好方法。许多在寻求传统投资者方面遇到困难的项目会自行掌控资金，直接将众筹活动带给可能感兴趣的消费者。这些活动会为早期支持项目以确保资金到位的人提供奖励和特别折扣。\n\
    \n### 众筹\n\n众筹是独立游戏创作者从一大群人那里获得游戏项目资金的一种流行方式。为众筹项目出资的人通常会在项目完成时获得成品作为回报。通过这种方式，资金支持者可以支持他们认可或有共鸣的项目，而创作者则获得制作产品所需的资金。\n\
    \n最受欢迎的众筹网站是Kickstarter.com。通过众筹创建的一款游戏是卡牌游戏*爆炸猫*，它在Kickstarter上筹集了8,782,571美元，成为有史以来资金最多的游戏众筹活动之一。\n\
    \n请务必查看其他众筹网站，如indiegogo.com、crowdfunder.com和rockethub.com，并遵循各网站关于创建众筹游戏项目的指南。\n\
    \n当为个人游戏项目获得资金过于困难时，还有其他选择。例如，棋盘游戏和角色扮演游戏书籍需要印刷，这可能会很昂贵。为了节省制作成本并保持传统游戏的低售价，你可以创建仅数字版的传统棋盘游戏、卡牌游戏或RPG游戏。然后，你可以出售数字文件，让玩家在家中打印游戏元素。保持开放的心态，保持创造力，不要气馁！\n\
    \n### 《龙与地下城》的影响\n\n有史以来最著名的传统独立游戏《龙与地下城》也被称为D&D。加里·吉盖克斯和戴夫·阿内森于1973年成立了战术研究规则公司（TSR），并于1974年首次发布了他们的冒险游戏《龙与地下城》。D&D的首次印刷只有一千套盒装，包含三本游戏指南。\n\
    \n在游戏中，玩家在纸上创建虚构角色，而一名玩家——地下城主（DM）——描述故事冒险以及玩家遇到的众多角色、怪物和环境。\n\n《龙与地下城》迅速变得非常受欢迎，到1981年，TSR的收入达到1290万美元。1997年，游戏公司威世智以2500万美元收购了TSR。《龙与地下城》的成功持续下去，1999年，玩具公司孩之宝以3.25亿美元收购了威世智。\n\
    \nD&D的流行对电子游戏和角色扮演游戏都产生了巨大影响。从《宝可梦》到《暗黑破坏神》，电子游戏都受到了吉盖克斯和阿内森自制的纸笔游戏的启发。如今，D&D已经进入第五版。\n\
    \n### 做好自我准备\n\n成为任何类型的企业家，首先要有一个你认为人们会感兴趣的伟大想法。研究传统游戏并阅读有关传统游戏的期刊。这些都是很好的灵感来源。还可以参加像Gen\
    \ Con这样的游戏大会。这个年度游戏大会是游戏制作者和游戏买家会面、交流想法以及达成一些商业交易的好地方。\n\n### 未来前景\n\n任何企业家的未来都可以是光明的。根据你的具体想法或项目，你能赚到的钱和你能发展的想法是无限的。你越有耐心和决心，成功的可能性就越大。然而，这并非适合那些喜欢安于现状、领取稳定薪水的人。\n\
    \n### 图书\n\n- 博特曼，杰克。*游戏之书：策略、战术与历史。* 纽约，纽约州：斯特林出版社，2008年。\n\n    博特曼概述了历史上的传统游戏及其对今天我们玩到的游戏的影响。\n\
    \n- 奥尔班内斯，菲利普·E。*游戏制造者：派克兄弟的故事，从挑圆片到常识问答。* 波士顿，马萨诸塞州：哈佛商业评论出版社，2003年。\n\n    奥尔班内斯概述了传统游戏公司派克兄弟，描述了它在二十世纪及以后的挑战、成功以及走向国际声誉的历程。\n\
    \n- 威特沃，迈克尔。*想象帝国：加里·吉盖克斯与《龙与地下城》的诞生。* 纽约，纽约州：布鲁姆斯伯里出版社，2015年。\n\n    威特沃讲述了独立游戏开发者加里·吉盖克斯的历史及其在游戏行业中的作用。\n\
    \n"
