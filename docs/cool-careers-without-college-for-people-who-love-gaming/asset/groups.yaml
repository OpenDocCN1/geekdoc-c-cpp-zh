    ![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_40_0.png)


    All games, even the most complex video games, start with brainstorming and writing
    down ideas. Much like writing a book, the action and characters must be mapped
    out before design can begin.


    Even someone who works in another aspect of the video game industry. If you are
    interested in writing articles or reviews, just give it a shot by pitching editors
    at your favorite gaming publication. The more experience you get, the better your
    chances of being published become. Different companies have different rules about
    submitting work. Quarterly and online magazines often accept submissions. Be sure
    to research submission guidelines before sending in writing to a company for consideration.
    Keep a résumé of articles you have written, even if they have not been published.
    Over time, your efforts may pay off.


    ## VIDEO GAME WRITING


    Game writers have a complex job. They should have incredibly active imaginations
    to help conceptualize original game stories and adventures. No idea for a game
    should be ignored. Keep a journal of any idea that comes into your head. Some
    of the tasks done by a person who writes video game or board game stories include:


    - Research the competition to know what other games exist in the field.

    - Communicate with game designers and programmers to make sure the story concepts
    are able to be realistically carried out.

    - Write an outline that is more in-depth than a flowchart.

    - Describe the settings and scenes with as much detail as possible.

    - Create dialogue for each character, including the narrator.

    - Also include the places where sound effects or music should be inserted.

    - Notes to game designers and programmers can also be included and give descriptions
    of different locations, outcomes, and items.


    A video game script should and could be even more in-depth than a movie screenplay
    because you are describing many interacting elements of the game at once.


    ![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_44_0.png)


    As your game ideas grow, you can begin to craft a more complex story by writing
    a script with more complex characters and dialogue.


    ## KEEP PLAYING


    Game writers should play games often and pay special attention to the stories
    in the games being played. If you want to write specific types of games, such
    as only role-playing board games or only console video games, then you should
    be playing those types of games regularly so you are familiar with what you want
    to write.


    Games are fluid, and, unlike a film or novel that operates according to typical
    linear storytelling with no choices for the viewer, games often have many choices
    and possible outcomes a player can make. A game writer needs to be able to write
    out all the varied possibilities that the player might experience. Playing an
    existing game several times and exploring the various choices is a great way to
    see how the writers of a game helped to construct the story. Each outcome must
    be conceptualized in advance and make sense within the construct of the entire
    game and its mechanics.


    ![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_43_0.png)


    ## WRITING FOR THE HOBBY GAME INDUSTRY


    If you are interested in writing for traditional hobby games such as role-playing
    and board games, you will need to stay focused on your writing and storytelling
    skills. The way traditional tabletop games are played is often just as important
    as the story or adventure being told while the game unfolds. In many games, players
    create their own imaginary characters using specific game rules before the game
    can start. Popular board games like *Star Wars: Imperial Assault* or the card
    game *Magic: The Gathering* require many game pieces, art elements, and graphically
    designed elements. It may help to get the assistance of an artistic friend in
    visualizing the art aspects while you write the story elements.


    A few popular role-playing games are *Dungeons & Dragons*, *Pathfinder*, *Star
    Wars*, and *Call of Cthulhu*. You may want to write new adventures for an existing
    game, or you can make up a new game setting that is entirely your own. Originality
    can help showcase your creative writing skills. Getting friends and family to
    playtest a game you created is a great way to see your hard work in action and
    can help you refine your writing going forward.


    ## NETWORK WITH WRITER GROUPS


    Spending time with other writers can be a good way to get feedback on what you
    are working on, whether it’s an article, game review, or even a game framework.
    Although writing is a solitary craft, sharing your work with others can be helpful
    and allow you to see your work in a critical light, which can help you to improve
    your writing overall. Even if you do not know other writers in the gaming field,
    spending time with other writers you know will keep you thinking about your craft.
    Share your work with gamers so they can give feedback as well. A player’s opinion
    can be just as valuable as another writer’s opinion. Getting other people’s opinions
    can help you to find flaws in your story. It can also help you realize things
    you may have overlooked or that others find confusing.


    ## COLLABORATE


    Writing a novel or article tends to be a solo creative endeavor. Video game writers
    usually work with a team. Even if you are the only writer on a small team there
    will still likely be a game designer and an artist. Communication and collaboration
    with other team members is essential for creating a cohesive video game that plays
    well and makes sense. Even if you are writing a traditional board game or role-playing
    game, there will likely be other writers working with you, and you will need to
    be able to work well with others, share ideas, and easily take criticism. Many
    existing role-playing games have rules that will need to be adhered to. The end
    result of the game is what is important, and keeping an open mind and listening
    to other ideas, even from team members who are not writers, can be very important
    in the writing process.


    > Sharing your ideas within your gaming group is a great springboard for getting
    feedback for your ideas. Making games is a collaborative process, whether it is
    a digital game or a more traditional card or board game.


    ![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_48_0.png)


    ## PREPARING YOURSELF


    Preparing to write for the gaming industry requires a lot of reading and game
    playing. Keep up on gaming magazines, and read reviews and industry news. Take
    writing and journalism courses at school. Check online gaming communities for
    people looking for help in creating a home-brewed game. It will help you get credit
    and experience for your résumé.


    ## FUTURE PROSPECTS


    The US Bureau of Labor Statistics does not collect data on the video game industry
    or board game industry. However, the organization suggests that workers in this
    field earn more than the median annual income in the United States.


    As the gaming industry grows, so will the need for support publications such as
    periodicals, books, standalone novels, and game guides. Writing is a growing field
    in the gaming industry. In addition to writing game narratives, consider journalism
    and blogging as possible jobs in the gaming industry. Instruction manuals and
    game guides that help gamers play through games are also other areas writers can
    get jobs in the gaming industry.


    ## FOR MORE INFORMATION


    ### BOOKS


    Bryant, Robert Denton, and Keith Giglio. *Slay the Dragon: Writing Great Video
    Games*. Studio City, CA: Michael Wiese Productions, 2015.


    Bryant and Giglio provide useful advice for people who want to create interactive
    narratives that can be used in gaming. The book provides discussions as well as
    self-paced writing exercises.


    Dille, Flint. *The Ultimate Guide to Video Game Writing and Design*. Los Angeles,
    CA: Lone Eagle Publishing, 2008.


