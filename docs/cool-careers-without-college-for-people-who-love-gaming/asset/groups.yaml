    video games, showing how the two processes overlap each other in many ways.


    Skolnick, Evan. *Video Game Storytelling: What Every Developer Needs to Know About
    Narrative Techniques*. New York, NY: Watson-Guptill, 2014.


    Skolnick provides a how-to guide for basic storytelling for every stage of the
