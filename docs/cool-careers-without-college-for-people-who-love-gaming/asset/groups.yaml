  - '[PAGE 55]


    animation is needed to help create game characters and virtual game environments.
    Three-dimensional modeling programs such as 3-D Studio Max, Maya, and ZBrush are
    some of the popular 3-D rendering programs that game artists could use to create
    game characters and elements.


    Some of the requirements of a video game artist include:


    +   - Making concept sketches of characters and backgrounds that will be used
    in a game

    +   - Creating detailed drawings of characters or backgrounds according to an
    agreed-upon style

    +   - Communicating with team members to create a look and feel consistent with
    the design of the project


    ![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_55_0.png)'
  - '[PAGE 56]


    ![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_56_0.png)


    Game artists need to be able to use traditional skills with modern computer rendering
    equipment. Usually there are large teams of people involved in creating a game,
    with each person tasked with distinct roles. All this work comes together in the
    final game, but there are thousands of smaller tasks involved, all of which are
    handed by specialists.'
  - '[PAGE 57]


    +   - Creating detailed art of characters in different positions to help with
    3-D rendering

    +   - Using computer programs employed by traditional artists or 3-D artists or
    animators

    +   - Using a solid knowledge base of color theory to put together good design


    The more you can communicate about your art and the game concepts you are working
    on, the better off you will be in the gaming art world. Visual communication is
    important for explaining game architecture for all members on a game team. Games
    like *Tomb Raider*, *The Legend of Zelda*, and *Halo* all revolve around characters.
    Many games take place in fantastic landscapes and futuristic worlds and are populated
    with imaginary species, creatures, futuristic vehicles, and fantastic-looking
    space ships. Artists are a very important part of creating these characters and
    their imaginative worlds.


    # ## IT STARTS WITH THE ART


    Anyone looking to get involved in creating any type of art for any type of game
    should have a very strong background in drawing. The human figure, animals, and
    scenic backgrounds are especially important to focus on. The importance of practicing
    your drawing and putting together a strong'
  - '[PAGE 58]


    portfolio cannot be overemphasized. Unless you are creating an independent game
    without the help of a company, a gaming company will want to see a portfolio of
    your work to be sure that you have the skills and experience to work for them.


    Sketch artists and painters are not the only kind of artists needed in the gaming
    world. Traditional sculptors are also needed to create figures for traditional
    game pieces and playable miniatures for tabletop games. Another area a sculptor
    can find work in the gaming industry is in the creation of toys for games such
    as Skylancers, Disney Infinity, or Nintendo Amiibo figures. Some artists and sculptors
    are traditionally trained at art colleges, but not all of them are. Even art courses
    not affiliated with an undergraduate degree can help someone get started in the
    field.


    # ### LEARN THE TRADE


    Game artists take game story ideas and help bring them to life. Concept art is
    the first step in the process, so everyone involved in game creation can begin
    to see what the game may wind up looking like. Concept art and illustrations produced
    by game artists will often undergo discussion and criticism. A game artist should
    be prepared to work with a team and generate multiple variations of the same idea,'
  - '[PAGE 59]


    character, creature, or landscape until the design team or lead game designer
    agrees upon a final concept.


    In addition to learning how to draw, a game artist will also need to be familiar
    with concepts such as perspective, color theory, depth, and various styles and
    mediums. Different games have different looks. A well-rounded game artist should
    be familiar with several painting mediums such as watercolor, colored pencils,
    acrylic, and oil. Different art styles such as painterly, comic book, detailed,
    loosely-rendered, and graphic will all be useful when determining the look of
    a game.


    Traditional hobby games use art in books,


    ![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_59_0.png)'
  - '[PAGE 60]


    ![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_60_0.png)


    To hone your artistic skills, practice drawing, sketching, and painting regularly.
    Even if your interest is in digital work, a good command of life drawing, observational
    drawing, and a familiarity with a variety of styles are all useful skills for
    a game design artist.'
  - '[PAGE 61]


    # “THE ART OF...”


    The many coffee table style “art of” books that often accompany the release of
    video games can be a valuable resource for any aspiring artist. Popular hobby
    video games such as the card game *Magic the Gathering*, the video game *Tomb
    Raider*, and the mobile game *Plants vs. Zombies* are just a few that have art
    of books.


    In many of these books, the artists who conceptualize elements for the games are
    showcased. Many variations of concept art are exhibited for fans of the final
    product. Are there certain types of video games you like? Do you also want to
    become an artist in the industry? Picking up one of the “art of” books for a game
    you love is a great way to see how concept art is generated for video games,


    on playing cards, and on game boards. Familiarize yourself with different games
    and try to imitate different styles you see. Having examples of a wide range of
    artistic styles will go a long way in creating a valuable portfolio and helping
    you become a working artist in the gaming industry.'
  - '[PAGE 62]


    # ## DIGITAL ART TOOLS


    Game artists should be able to sketch out concepts traditionally by hand. That
    skill will not likely go away for artists. Increasingly, however, many game artists
    work digitally with art programs such as Adobe Photoshop and Corel Painter to
    render artwork on the computer. Digital styluses and tablets are often used in
    place of traditional materials such as pencils or brushes and paints. Working
    digitally has lots of benefits as artists can switch mediums very easily. Finished
    artwork can be shared with team members and distributed quickly.


    # ## PREPARING YOURSELF


    Learning to draw is probably the most important skill needed for a career in video
    game art. Take art courses in school, and practice drawing frequently to improve
    your skills. Check out YouTube for online instruction videos to learn new artistic
    techniques and rules through art classes online, or watch tutorials. Keeping a
    sketchbook and drawing people in daily life is a great way to keep your drawing
    skills sharp.


    Check with your school to see if computer art programs are available. 3-D drawing
    or design programs are particularly useful. You don''t need to have every program
    on your home computer, but free limited trials or student discounts may be available
    for many popular programs.'
  - '[PAGE 63]


    # FUTURE PROSPECTS


    The future of gaming art is bright, but keeping up on changing computer programs
    and gaming trends is important. As new technologies like virtual reality (VR)
    headsets are introduced into the video game industry, it is important to be able
    to generate art that will help communicate concepts to design teams. A command
    of traditional art skills continues to be important, but in addition, artists
    will need to be well versed in the various new technologies entering the market.'
