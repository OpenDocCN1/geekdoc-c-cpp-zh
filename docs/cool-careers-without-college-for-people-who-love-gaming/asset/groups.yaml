    ![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_127_0.png)


    Traditional board and hobby games are also a large part of the gaming industry.
    Before video games, card and board games were major ways in which the public engaged
    in competitive and shared gameplay. Some board games have ancient origins, and
    others are dependent on popular culture or clever mechanisms for engaging gameplay.'
