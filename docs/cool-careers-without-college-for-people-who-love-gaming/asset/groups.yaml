    ## 更多信息


    ### 书籍


    Kennedy, Sam R. *如何成为电子游戏艺术家：进入游戏世界求职的内部指南*。New York, NY: Watson-Guptill, 2013.


    Kennedy 提供关于在电子游戏行业寻找和获得工作的建议和有用提示。


    Melissinos, Chris, and Patrick O’Rourke. *电子游戏艺术：从吃豆人到质量效应*。New York, NY: Welcome
    Books, 2012.


    Melissinos 和 O’Rourke 概述了从20世纪80年代到当今的电子游戏艺术。


    Solarski, Chris. *绘画基础与电子游戏艺术：从经典到前沿的获胜电子游戏设计艺术技巧*。New York, NY: Watson-Guptill,
    2012.


    Solarski 为热爱电子游戏并有兴趣追求自己作为电子游戏艺术家职业生涯的艺术家提供技巧和技术。


    ### 组织


    图形艺术家公会

    31 West 34th Street, 8th Floor

    New York, NY 10001

    (212) 791-3400

    网站：https://www.graphicartistsguild.org


    图形艺术家公会帮助其成员在艺术领域建立职业生涯，包括互动和多媒体游戏领域。


    插画家、艺术家和设计师协会（SIAD）

    207 Regent Street, 3rd Floor

    London W1B 3HH

    England


    SIAD 是一个非营利组织，致力于促进和保护所有视觉媒体中艺术家和设计师的工作。


    ### 网站


    由于互联网链接的性质不断变化，Rosen Publishing 开发了一个与本书主题相关的网站在线列表。该网站定期更新。请使用此链接访问列表：


    http://www.rosenlinks.com/CCWC/game


    ![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_68_0.png)


    平面设计师通常在团队中工作，以沟通想法并构建游戏元素。他们是游戏艺术家与编写代码以执行游戏的专家之间的桥梁。


    ![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_69_0.png)


    在学校参加平面设计课程，开始掌握在该领域工作所需的基本技能。这可能意味着使用一系列计算机程序，但也包括学习色彩理论、布局和设计概念。


    ![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_70_0.png)


    平面设计师将各种元素组合在一起，并通过艺术、色彩和布局进行传达，使游戏易于玩家理解。首席平面设计师可能会管理整个设计师团队并协调他们的工作。


    ### 应具备的技能


    电子游戏的平面设计师需要具有创造力，并擅长视觉沟通问题解决。强大的传统绘画技能以及计算机技能很重要。设计师还需要了解布局、排版和色彩理论。平面设计师使用的一些典型计算机程序是
    Adobe Photoshop、Illustrator、Flash 和 InDesign。平面设计师需要为印刷、网络和游戏平台创建图形。


    要学习各种平面设计概念和计算机程序，请使用互联网搜索在线教育资源。平面设计师使用的许多程序提供程序的试用下载。在试用下载期间使用程序是了解程序并看看它是否值得你花钱购买的好方法。学生通常可以获得行业标准计算机程序的折扣。询问你学校的美术或平面设计老师，看看他们是否能帮助你在学校获得这些程序。


    游戏行业的平面设计师通常需要与艺术总监和首席设计师合作，或者成为团队的一员，其中每个设计师负责电子游戏特定部分。许多游戏是现有授权财产的续集或延续。必须使用风格指南和艺术参数，以保持新游戏对玩家来说看起来相似且熟悉。授权电子游戏的平面设计师通常需要完成的一些任务包括：


    - 通常在设定参数下创建游戏背景和用户界面

    - 为各种游戏元素创建概念模型

    - 与艺术总监或游戏设计师沟通分配的任务

    - 从概念到完成制作游戏元素，同时进行评审和反馈


    ![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_71_0.png)


    ![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_72_0.png)


    制作网页或个人博客是学习平面设计技能的绝佳第一步。许多网站允许你使用 HTML 编码从头构建，或者应用其他设计师制作的各种主题，你可能能够修改这些主题。


    ### 入门


    结合摄影、艺术和排版是平面设计师工作的很大一部分。在从事印刷或电子游戏工作之前，你可以通过制作小型网页并可能建立个人博客来练习平面设计。就布局、颜色以及哪些元素放在哪里做出选择，将大大有助于你随着技能提高而进步。


    即使你无法使用计算机或互联网，你也可以用彩色铅笔或马克笔在速写本中构思一个简单的电子游戏。为你拥有的想法创建游戏角色、背景和不同的加载屏幕。具有创造力，即使是在纸上，通常也是任何电子游戏迈出的第一步。记住使用这个简单而有价值的资源。记录在纸上的想法将帮助你记住你的想法，并且如果你开始在计算机上创建游戏，还可以与他人交流。


    如果你想制作传统的棋盘游戏、卡牌游戏或角色扮演游戏，那么使用笔记本和速写本甚至比学习计算机设计程序更重要。传统游戏可以完全手工制作。插画板和水彩颜料可用于从头创建棋盘游戏。游戏棋子可以用纸板、彩绘石头或你能想到的任何其他东西制成。让你的想象力自由驰骋，不要让有限的资源阻碍你创造新鲜和新颖的游戏创意。潜在雇主会很高兴看到你创造的任何东西。记得将你最出色的作品加入作品集。


    ### 公司品牌


    平面设计师所做的一项工作是创建公司标志，以简单、有力且图形化的方式传达一个想法。公司标志有助于为公司打造品牌，并让人们在购买产品时记住它。一些最初的电子游戏公司，如
    Atari 和 Activision，仍然使用与其原始标志相似的标志，以便消费者能够快速识别和辨认它们。


    如今一个简单图形游戏公司标志的例子是 Rockstar，它只显示一个“R”和一颗星。另一个是 LucasArts，它显示一个人，其头部是眼睛的虹膜。当消费者看到这些标志时，视觉上会想起公司的声誉和以前的产品。


    ### 做好准备


    在高中学习计算机、绘画、艺术和平面设计课程将帮助你为平面设计师的职业生涯做好准备。在游戏公司实习也是非常宝贵的经历。整理一份强大的设计作品集对于寻找平面设计工作的人来说至关重要。在家通过计算机练习设计技能，或通过草图构思。为游戏、盒子设计和海报创建自己的图形元素将帮助你像平面设计师一样思考。参与学校年鉴工作也能给你一些宝贵的经验。


    ### 未来前景


    根据美国劳工统计局的数据，平面设计领域工作的总体前景良好。他们预测工作竞争激烈，但建议经过深思熟虑的作品集可以帮助候选人获得他们想要的工作。工资因州而异，但与其他工作相比总体保持平均水平。许多领域需要平面设计师的专业知识，虽然竞争激烈，但机会很多。


    ### 组织


    美国平面艺术协会（AIGA）

    233 Broadway, 17th floor

    New York, NY 10279

    (212) 807-1990

    网站：http://www.aiga.org


    AIGA 是面向专业和业余平面艺术家的历史最悠久、规模最大的组织，成立于1914年，至今仍服务于当今最前沿的平面设计师。


    自由职业者联盟

    20 Jay Street, Suite 700

    Brooklyn, NY 11201

    (800) 856-9981

    网站：http://www.freelancersunion.org


    自由职业者联盟支持独立承包商和自由职业者的工作，其中许多人担任平面艺术家。他们为会员提供医疗保健和专业发展机会等福利。


