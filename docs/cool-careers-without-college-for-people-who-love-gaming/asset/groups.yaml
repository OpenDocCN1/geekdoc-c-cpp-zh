    # # CHAPTER 9


    # # MAKE YOUR VIDEO GAME A REALITY


    Do you have a great idea for a video game, but without financial resources or
    the backing of a large company? It may seem that there is little one can do to
    create something entirely alone. But there are options. If you or a small group
    of friends have the multiple well-rounded skills needed to create a game, then
    you might want to consider making it yourself. Many advanced video games like
    *Call of Duty* and *Assassin’s Creed* require dozens or even hundreds of people
    to bring to completion. There have been some very fine examples of smaller, more
    intimate games created by individuals or small groups that have been successful.


    Making a video game without the financial backing of a large company is not an
    easy undertaking, but it is by no means impossible. Today “indie” games, or independent
    video games made by a single person or small group without a video game publisher,
    are a growing force in the market.


    Independent video game projects are being created, sold, and played all the time.
    Very large companies have'
  - '[PAGE 115]


    ![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_115_0.png)


    Virtual reality headsets are the next step in video games. Here, a gamer is wearing
    the popular Oculus Rift® headset to play a game. This places the player in an
    immersive visual and auditory environment, making him or her feel that they are
    truly "in" the game.'
  - '[PAGE 116]


    ![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_116_0.png)


    even bought indie games after they received much success and praise in the market.
    One example is the virtual reality headset Oculus Rift. The headset displays video
    games in high definition. The project received its funding online at first and
    was then purchased by Facebook in 2014 for $2 billion. Devel-opment continued
    and the headset was released in 2016.


    Indie games include games made for gaming consoles and also games for apps developed
    for Android or Apple phones. A college education is not required to make an indie
    game, but all of these features are needed'
