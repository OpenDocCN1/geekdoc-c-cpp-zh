    # # Hazard Analysis and Critical Control Point (HACCP)


    HACCP is a systematic approach to the identification, evaluation, and control
    of food safety hazards.


    It is a preventive system that aims to ensure the safety of food products.


    # Key Principles


    +   1. Conduct a hazard analysis.

    +   2. Determine the critical control points (CCPs).

    +   3. Establish critical limits.

    +   4. Establish monitoring procedures.

    +   5. Establish corrective actions.

    +   6. Establish verification procedures.

    +   7. Establish record-keeping and documentation procedures.


    Table 1: Summary of HACCP Principles


    | Principle Number | Description |

    | --- | --- |

    | 1 | Conduct a hazard analysis |

    | 2 | Determine the critical control points (CCPs) |

    | 3 | Establish critical limits |

    | 4 | Establish monitoring procedures |

    | 5 | Establish corrective actions |

    | 6 | Establish verification procedures |

    | 7 | Establish record-keeping and documentation procedures |'
