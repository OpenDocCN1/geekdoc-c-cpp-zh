  mdcn: "\n\n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_16_0.png)\n\n直接为游戏公司工作，可以获得在面向公众发布之前测试和展示新产品的机会。例如，这是一名虚拟现实（VR）头显测试员。这类产品在市场上正变得越来越普遍。\n\
    \n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_18_0.png)\n\n还具备最新技术方面的经验。许多在大型连锁店购物的顾客需要有人帮助他们找到所需商品。对各种游戏系统的深入了解可以让你在游戏部门获得一份工作，在那里你可以回答顾客问题并积累经验。\n\
    \n在零售业工作几年，同时在家学习并培养与游戏行业某一具体领域（如编程或游戏设计）直接相关的技能，是赚钱并了解行业内在创作和销售各方面最新动态的好方法，同时还能朝着更远大的目标迈进。\n\
    \n## 在公司工作\n\n除了面向公众销售之外，大型游戏公司还设有销售岗位，负责将游戏销售给分销商和零售商。游戏公司还有许多行政岗位，其职责包括：\n\n\
    - 安排产品发布\n- 分发宣传材料\n- 协助处理与商店及消费者相关的客户服务\n- 组织大会及其他行业活动\n\n这些公司的销售工作通常是入门级岗位，无需先前经验。如果你已经在一家小型游戏商店工作过，你的经验可能会帮助你获得一份更好的、确实需要一些先前经验的销售岗位。\n\
    \n当你探索其他游戏兴趣，并磨练自己作为作家、艺术家、音乐家、程序员或企业家的技能，以便未来在游戏行业工作时，这些不同的工作将为你提供稳定的收入来源。\n\n\
    ## 做好准备\n\n高中生可以通过在当地商店工作、与公众和商店经理互动来开始销售职业生涯，从而获得销售经验。有些公司可能在你年满十八岁之前不会雇用你。如果你想在十八岁之前做兼职，实习是值得考虑的选择。实习是一种通常与学校课程相关的项目，你在其中到公司工作。许多实习提供学校学分，但报酬很少或没有报酬。它们能让你在你渴望进入的行业中获得宝贵经验。查看当地游戏公司是否有实习项目以及需要什么条件。你学校的指导部门也可能帮你联系实习机会，或提供获得学校学分的可能性。\n\
    \n紧跟电子游戏和桌游的最新动态，有助于你了解相关商品和行业。对许多玩家来说，在普通消费者和职业从业者之间存在一个位置：你可以比普通居家玩家参与得更多，同时仍未受雇于该行业。参加当地游戏商店每周举办的行业认可的游戏小组，或参加大型展会锦标赛，都是紧跟潮流并参与其中的好方法，即使你尚未进入这个行业。\n\
    \n## 技术支持和客户支持\n\n电子游戏公司为需要帮助处理游戏主机和电子游戏问题的用户提供在线和电话支持。非常了解电子游戏的人可以在这一领域表现出色。这些职位通常至少要求高中文凭，并且在一定程度上熟悉\
    \ Windows 操作系统和 Microsoft Word 等基础程序。\n\n如果你已经在零售业工作过，你与顾客沟通的经验可以被视为一项宝贵技能。熟悉当前游戏和游戏系统及其内部菜单、设置和技术细节，在申请这类工作时都会派上用场。在网上搜索游戏技术支持方面的工作，看看有哪些机会。\n\
    \n## 未来前景\n\n随着数字内容在线下载销售的增长，实体店零售电子游戏销售方面的职业可能会比过去增长放缓。人们越来越倾向于在线购买游戏数字下载版。由于整个行业的整体增长，电子游戏公司的职业发展可能更有前景。传统桌游和角色扮演游戏（RPG）仍主要以盒装和实体书形式销售，因此销售这些游戏的零售岗位不会很快消失。\n\
    \n## 更多信息\n\n### 书籍\n\n- 多诺万，特里斯坦。*重玩：电子游戏史。* 英格兰东萨塞克斯：Yellow Ant，2010年。  \n \
    \ 多诺万全面讲述了从20世纪80年代至今的电子游戏史，并收录了对游戏设计师和开发者的140多次访谈。\n- 芬克，乔。*互动娱乐中的酷职业：电子游戏中的热门工作。*\
    \ 纽约州纽约：Scholastic，2010年。  \n  芬克通过介绍电子游戏领域广泛岗位的业内人士，向读者介绍电子游戏创作的世界。\n- 尼科尔斯，兰迪。*电子游戏产业。*\
    \ 英格兰伦敦：英国电影学院，2014年。  \n  尼科尔斯从历史、经济和文化角度概述了电子游戏产业，包括游戏受众的变化以及制作游戏所需的劳动力。\n\n\
