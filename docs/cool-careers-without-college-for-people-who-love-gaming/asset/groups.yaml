    ## FOR MORE INFORMATION


    ### BOOKS


    Kennedy, Sam R. *How to Become a Video Game Artist: The Insider’s Guide to Landing
    a Job in the Gaming World*. New York, NY: Watson-Guptill, 2013.


    Kennedy provides advice and helpful tips about searching for and landing a job
    in the video game industry.


    Melissinos, Chris, and Patrick O’Rourke. *The Art of Video Games: From Pac-Man
    to Mass Effect*. New York, NY: Welcome Books, 2012.


    Melissinos and O’Rourke give an overview of video game art from the 1980s to the
    current day.


    Solarski, Chris. *Drawing Basics and Video Game Art: Classic to Cutting-Edge Art
    Techniques for Winning Video Game Design*. New York, NY: Watson-Guptill, 2012.


    Solarski provides tips and techniques for artists who love video games and are
    interested in pursuing their own career as a video game artist.


    ### ORGANIZATIONS


    Graphic Artists Guild

    31 West 34th Street, 8th Floor

    New York, NY 10001

    (212) 791-3400

    Website: https://www.graphicartistsguild.org


    The Graphic Artists Guild helps its members build careers in the arts, including
    in the field of interactive and multimedia gaming.


    Society of Illustrators, Artists and Designers (SIAD)

    207 Regent Street, 3rd Floor

    London W1B 3HH

    England


    SIAD is a nonprofit organization dedicated to promoting and protecting the work
    of artists and designers in all visual media.


    ### WEBSITES


    Due to the changing nature of internet links, Rosen Publishing has developed an
    online list of websites related to the subject of this book. This site is updated
    regularly. Please use this link to access the list:


    http://www.rosenlinks.com/CCWC/game


    ![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_68_0.png)


    Graphic designers often work within a team to communicate ideas and build gaming
    elements. They are the bridge between the game artists and the specialists that
    build the code to execute the game.


    ![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_69_0.png)


    Take graphic design classes in school to get started with the basic skills you
    will need for working in the field. This can mean working with a selection of
    computer programs, but also studying color theory, layout and design concepts.


    ![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_70_0.png)


    Graphic designers combine various elements together and communicate with art,
    color, and layout so that games are easy for players to understand. Lead graphic
    designers may control a whole team of designers and coordinate their work.


    ### SKILLS TO HAVE


    A graphic designer for video games will need to be creative and good at visual
    communication problem solving. Strong traditional drawing skills alongside computer
    skills are important. Designers also need knowledge of layout, typography, and
    color theory. A few of the typical computer programs used by graphic designers
    are Adobe Photoshop, Illustrator, Flash, and InDesign. A graphic designer will
    need to create graphics for print, web, and gaming platforms.


    To learn various graphic design concepts and computer programs, use the internet
    to search for online educational resources. Many programs used by graphic designers
    offer trial downloads of programs. Using a program during a trial download period
    is a great way to get to know the program and see if it is something you want
    to invest money in buying. Students can often get discounts for industry-standard
    computer programs. Ask an art or graphic design teacher at your school to see
    if they can help you gain access to these programs at school.


    Game industry graphic designers will often need to work with art directors and
    lead designers or be part of a team where each designer works on a specific part
    of a video game. Many games are sequels or continuations of existing licensed
    properties. Style guides and art parameters must be used to keep new games looking
    similar and familiar to the player. A few tasks typically required of a graphic
    designer for a licensed video game are:


    - Creating game backgrounds and user interfaces, often under set parameters

    - Creating conceptual mockups for various game elements

    - Communicating with art directors or game designers for assigned tasks

    - Producing game elements from concept to completion alongside reviews and feedback


    ![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_71_0.png)


    ![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_72_0.png)


    Making a web page or personal blog is a great first step for learning graphic
    design skills. Many sites allow you to build from scratch using HTML coding, or
    to apply various themes by other designers that you may be able to modify.


    ### GETTING STARTED


    Combining photography, art, and typography are a big part of what a graphic designer
    does. Before working on print or video games you can practice graphic design by
    working on small web pages and perhaps building a personal blog. Making choices
    about layout, color, and what elements go where will go a long way to helping
    you as your skills advance.


    Even if you do not have access to a computer or the internet, you can conceptualize
    a simple video game in a sketchbook with colored pencils or markers. Create game
    characters, backgrounds, and different load screens for the ideas you have. Being
    creative, even on paper, is often the first step taken for any video game. Remember
    to use this simple and valuable resource. Ideas recorded on paper will help you
    remember your ideas and can communicate to others if you start creating a game
    on the computer.


    If you want to make a traditional board, card, or role-playing game then using
    notebooks and sketchpads is even more important than learning computer design
    programs. A traditional game can be created entirely by hand. Illustration board
    and watercolor paints can be used to create a board game from scratch. Game pieces
    can be made from cardboard, painted stones, or anything else you can come up with.
    Let your imagination run wild and do not let limited resources block you from
    creating fresh and new gaming ideas. Potential employers will be happy to see
    anything you created. Remember to add your strongest work to a portfolio.


    ### COMPANY BRANDING


    One job that graphic designers do is to create company logos that communicate
    an idea in a simple, strong, and graphic way. A company logo helps brand a company
    and make people remember it when they shop for products. Some of the original
    video game companies such as Atari and Activision still use logos similar to their
    original, so consumers can quickly recognize and identify them.


    One example of a simple graphic gaming company logo today is Rockstar, which simply
    shows an “R” and a star. Another is LucasArts, which shows a person with a head
    as the iris of an eye. When consumers see these logos they are visually reminded
    of the company’s reputation and previous products.


    ### PREPARING YOURSELF


    Taking computer, drawing, art, and graphic design courses in high school will
    help prepare you for a career as a graphic designer. Internships at gaming companies
    are also very valuable experiences. Putting together a strong portfolio of design
    work is essential for people looking for graphic design work. Practice design
    skills at home on a computer or by sketching out ideas. Creating your own graphic
    elements for games, box designs, and posters will help get you thinking like a
    graphic designer. Working on your school yearbook can also give you some valuable
    experience.


    ### FUTURE PROSPECTS


    According to the US Bureau of Labor Statistics, the outlook for jobs in the graphic
    design field in general is good. They predict strong competition for jobs but
    suggest that a well thought-out portfolio can help candidates get the job they
    want. Wages will vary by state, but remain average overall compared to other jobs.
    Many fields require the expertise of a graphic designer, and while competition
    is strong, there is a lot of opportunity.


    ### ORGANIZATIONS


    American Institute of Graphic Arts (AIGA)

    233 Broadway, 17th floor

