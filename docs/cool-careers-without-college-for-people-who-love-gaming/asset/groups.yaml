    \nhttp://www.rosenlinks.com/CCWC/game\n\n## 第2章：开始你的游戏之旅\n\n职业游戏，即电子竞技，正迅速成为一种完全成熟的竞技观赏性运动。电子竞技赛事也有现场电子游戏比赛，粉丝们会坐满大型体育场，就像传统体育项目一样。2015年北美电子竞技收入为1.34亿美元。\n\
    \n像*英雄联盟*和*DotA 2*（“DotA”代表*远古遗迹保卫战*）这样的成熟电子游戏拥有庞大的粉丝群体，他们经常观看，有时也参加现场锦标赛。2015年在纽约市麦迪逊广场花园举行的一场*英雄联盟*地区锦标赛有1.1万名粉丝到场。2015年，全球有超过1.34亿观众观看电子竞技。DotA\
    \ 2 每年举办一项名为 The International 的电子竞技锦标赛。2015年，The International 在华盛顿州西雅图的 KeyArena\
    \ 中心举行。奖金池超过1800万美元，是当时电子竞技历史上最大的奖金池。获胜队伍 Evil Geniuses 赢得了6,634,660美元，队中每位选手获得超过130万美元。\n\
    \n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_25_0.png)\n\n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_26_0.png)\n\
    \n2014年，竞技游戏战队 Newbee 的成员在华盛顿州西雅图举行的国际 DOTA 2 锦标赛舞台上合影。这些赛事将大批人群吸引到场馆，因为比赛会实时展示。\n\
    \n2013年，美国政府首次将前往美国参加*英雄联盟*锦标赛的国际电子游戏玩家认定为职业运动员。这使得为赴美参加职业比赛的选手签发特殊签证变得更加容易。根据*GameSpot*杂志对\
    \ Riot Games 电子竞技经理尼克·艾伦的采访：“这对电子竞技具有开创性意义；现在我们可以开始考虑国际选手来访。流程容易得多，因为他们实际上得到了政府的认可。”电子竞技如今是一项大生意，有许多找工作机会。\n\
    \n要将电子竞技作为职业，需要的一些技能包括：\n\n- 出色的游戏技能\n- 与队友良好的沟通能力\n- 报名参加比赛时注重细节\n- 在竞技赛事中保持职业行为\n\
    - 与赞助商或潜在赞助商交往时保持职业行为\n\n"
