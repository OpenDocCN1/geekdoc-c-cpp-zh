    # # THE INFLUENCE OF DUNGEONS AND DRAGONS


    The most famous traditional indie game of all time, *Dungeons & Dragons*, is also
    known as D&D. Gary Gygax and Dave Arneson formed the company Tactical Studies
    Rules (TSR) in 1973 and first released their adventure game *Dungeons & Dragons*
    in 1974. The first D&D print run was just one thousand box sets that contained
    three game guides.


    In the game, players create fictional characters on paper sheets and a single
    player, the Dungeon Master, (DM) describes the story adventure as well as the
    many characters, monsters, and environments the players encounter.


    *Dungeons & Dragons* quickly became very popular and by 1981, TSR had revenues
    of $12.9 million. In 1997, the gaming company Wizards of the Coast purchased TSR
    for $25 million. The success of *Dungeons & Dragons* continued, and in 1999 the
    toy company Hasbro purchased Wizards of the Coast for $325 million.


    The popularity of D&D went on to have a huge impact on video games and role-playing
    games alike. Video games from *Pokémon* to *Diablo* have all been influenced by
