    # CHAPTER 7


    # GET YOUR GAME DESIGN ON


    Game design is a creative job in which one invents, creates, or assists in the
    creation of a game. In addition to the design of video games, a game designer
    can also design elements for tabletop games such as board games, card games, and
    role-playing games.


    A video game designer tends to be a jack-of-all-trades and possesses working knowledge
    of all aspects of game creation, including programming, graphic design, art, writing,
    and managing. The lead game designer is usually the creative force behind a game’s
    initial concept and often manages others who have more specific focused skills.


    In larger teams, a game designer might work under a lead game designer and work
    on a more specific role in game creation. Smaller roles a game designer can have
    in a large team are:


    +   - Level designer

    +   - Writer and story development

    +   - Artist and content design'
