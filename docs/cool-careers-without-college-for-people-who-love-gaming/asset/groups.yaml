  mdcn: "\n## 期刊\n\n### HOW\n\n10151 Carver Road, Suite 200  \nBlue Ash, OH 45242\
    \  \n(513) 531-2690  \n网站：http://www.howdesign.com\n\n这本杂志对专业平面设计师和刚入行者来说是有用的资源和艺术灵感来源。它提供有关平面艺术领域的新闻和信息以及技术提示，并介绍该领域的专业人士。\n\
    \n### Digital Arts\n\n101 Euston Road  \nLondon, NW1 2RA  \n020 7756 2800  \n\
    网站：http://www.digitalartsonline.co.uk\n\n该出版物专注于面向数字艺术受众的新闻、评论和专题。该杂志全面报道平面设计、3D\
    \ 作品、动画和视频，以及网页和交互设计，所有这些内容\n\n## 第 6 章：各就各位，预备，编程！\n\n计算机或游戏系统上的所有应用程序、游戏和软件程序都需要特定指令才能运行。这些指令是特殊的计算机语言，通常称为代码。程序员编写代码，指示计算机、移动设备或游戏系统在用户玩游戏时做什么以及如何运行。所有计算机和视频游戏系统都使用编码语言来运行游戏并执行用户输入，以便与游戏元素交互。编程允许用户通过使用游戏控制器来控制游戏元素。许多不同的编程语言可用于为计算机、视频游戏主机或手持设备创建游戏。\n\
    \n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_81_0.png)\n\n游戏程序员对于将游戏的各个方面变为现实至关重要。他们负责把游戏从梦想变为现实。游戏的每个方面，从故事到视觉效果再到玩法，都必须由一串串代码构建出来，才能以用户可玩的格式呈现。\n\
    \n游戏程序员必须编写游戏过程中发生的所有活动——从玩家输入到非玩家元素。甚至由平面设计师和艺术家创建的图形图像和 3D 元素，也必须由程序员的游戏代码控制，视频游戏才能运行。\n\
    \n### 游戏编码语言\n\n要成为程序员，你需要熟悉用于创建视频游戏的各种计算机编程语言。当今业内最常见的是 JavaScript、Java（用于 Android/Google）、C++（用于\
    \ PC 和主机游戏）以及 Objective-C（用于 iOS/Apple）。\n\n学习一门计算机编程语言似乎是一项不可能完成的任务，但有许多在线资源可以帮助任何人——甚至儿童——学习编码。有些资源甚至允许你创建自己的视频游戏，并在家用电脑上运行。\n\
    \n与其一开始就试图处理一个雄心勃勃的大型游戏项目，不如从小处着手。\n\n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_83_0.png)\n\
    \n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_84_0.png)\n\n创建游戏需要各种工具和模拟环境，从编码到像\
    \ Godot 这样允许设计师构建和模拟游戏环境的程序。有些程序可以免费下载和使用，甚至对业余爱好者也是如此，并且可用于在正式培训之外培养编码和设计技能。\n\
    \n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_85_0.png)\n\n利用你所在学校提供的课程，例如计算机科学或编程。对于考虑从事游戏领域职业的人来说，这些课程提供了宝贵的技能。\n\
    \n一旦你迈出学习编码和创建简单操作的第一步，你就会发现学习编码并不像你曾经想象的那么复杂。编码可能不像看起来那么令人生畏的一个原因是，已有用于创建视频游戏代码的软件。这种现有的游戏创建软件被称为游戏引擎。游戏引擎有助于让程序员的工作更轻松。\n\
    \n游戏引擎作为框架存在，因此程序员可以轻松地将其适配到正在进行的项目。核心编程元素已经存在于游戏引擎中，这使游戏程序员可以只专注于创建正在设计的游戏所特有的特定游戏元素。游戏引擎还有助于管理运行游戏所需的所有资源，并将它们渲染到玩家的电视屏幕上。\n\
    \n当今程序员使用的一些较常见的游戏引擎有 Unity3D、Unreal Engine、CryEngine 3 和 HeroEngine。这些都可以在网上找到。如果你有兴趣学习编码，这些程序值得使用。\n\
    \n### 开始动手\n\n如果你发现学校不提供编码课程，不要放弃。在线教育网站可汗学院（Khan Academy）免费提供游戏编程和计算机语言课程；当地社区学院也可能提供编程课程或暑期课程。如果可能，尽量找一门能让你从头到尾编写完整游戏的课程。当你找工作时，这可以成为重要的作品集项目。即使你不打算成为计算机程序员，所有参与创建视频游戏的人都至少应该了解一点编程。理解编程对设计师和艺术家也很重要，这样他们才知道在创建游戏时可以实现什么。\n\
    \n计算机程序员的工作可能多种多样。以下是程序员在工作中可能要做的一些任务：\n\n- 将设计师的指令转化为计算机可以遵循的代码。\n- 编写代码，使特定游戏在指定的计算机平台上运行。\n\
    - 转换游戏代码，使其能跨游戏平台运行。（例如，将针对 Microsoft Xbox 编码的游戏转换为可在 Sony PlayStation 或 Nintendo\
    \ 系统上运行。）\n- 将游戏编码为移动设备应用。\n- 修复新设计或现有设计中出现的故障。\n\n### 做好准备\n\n如果你的学校提供任何计算机或编程课程，就选修它们。即使游戏不是课程的一部分，也可以参加在线课程或观看互联网上的教程。当你准备申请程序员工作时，通过研究该主题来熟悉面试官可能会问的问题。在面试中，程序员经常会被问到更困难的、考查解决问题能力的题目。未来的雇主也很可能会在面试中让你参加编码测试。\n\
    \n### 未来前景\n\n根据美国劳工统计局的数据，计算机程序员的前景略有下降。这项工作可以在世界任何地方完成，因此公司有时会从工资较低的国家招聘程序员。北美计算机程序员的薪资高于其他工作的薪资中位数。\n\
    \n## 更多信息\n\n### 书籍\n\n- Aziz, Adnan、Tsung-Hsien Lee 和 Amit Prakash。_编程面试要素：内部人士指南_。Seattle,\
    \ WA: CreateSpace Independent Publishing Platform, 2012。Aziz、Lee 和 Prakash 探讨了编程职位求职面试中给候选人的各类问题。\n\
    - Connor, Joseph。_编程：面向初学者的计算机编程：学习 Java、SQL 和 C++ 的基础知识_。Seattle, WA: CreateSpace\
    \ Independent Publishing, 2015。Connor 讨论了计算机编程的基础知识，并涵盖了 JavaScript、SQL 和 C++\
    \ 的使用。\n- Habgood, Jacob。_游戏创作者的学徒：面向初学者的游戏开发_。New York, NY: Apress, 2007。Habgood\
    \ 指导读者使用视频游戏创建工具 Game Maker 创建九款视频游戏。\n- McDowell, Gayle Laakmann。_破解编码面试：189\
    \ 道编程问题与解答_。Palo Alto, CA: CareerCup Publishing, 2015。McDowell 讨论了求职面试中向程序员提出的一些更独特、更困难的问题，并提供了在面试中随机应变的方法。\n\
    \n### 组织\n\n- Association of Information Technology Professionals  \n  1120 Route\
    \ 73, Ste. 200  \n  Mount Laurel, NJ 08054  \n  (800) 224-9371  \n  网站：http://www.aitp.org\
    \  \n  AITP 是一个通过支持教育和专业发展来推动 IT 行业发展的组织。\n- Women in Technology  \n  200 Little\
    \ Falls Street, Suite 205  \n  Falls Church, VA 22046  \n  (703) 349-1044  \n\
    \  Women in Technology 是一个致力于推动科技行业女性发展的组织。\n\n"
