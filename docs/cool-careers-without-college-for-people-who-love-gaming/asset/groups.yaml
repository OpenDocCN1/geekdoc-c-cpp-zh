    \nhttp://www.rosenlinks.com/CCWC/game\n\n## 第7章：开始你的游戏设计\n\n游戏设计是一项创造性工作，人们在其中发明、创造或协助创造游戏。除了电子游戏设计，游戏设计师还可以为桌面游戏设计元素，如棋盘游戏、卡牌游戏和角色扮演游戏。\n\
    \n电子游戏设计师往往是多面手，具备游戏创作各个方面的实用知识，包括编程、平面设计、美术、写作和管理。首席游戏设计师通常是游戏最初概念背后的创意力量，并且经常管理那些拥有更具体专项技能的人。\n\
    \n在较大的团队中，游戏设计师可能在首席游戏设计师手下工作，并在游戏创作中承担更具体的角色。在大型团队中，游戏设计师可以担任的更细分角色包括：\n\n- 关卡设计师\n\
    - 编剧与故事开发\n- 美术与内容设计\n\n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_95_0.png)\n\n\
    专业游戏夏令营面向高中生开放，是学习该行业各个领域宝贵技能的好地方。它们涵盖游戏设计师从概念到创作可能需要的各种技能。\n\n- 程序员\n- 系统设计师\n\
    - 世界设计师\n- 界面设计师\n\n游戏设计师可以专攻游戏创作的特定领域。拥有广泛游戏技能的人会很适合成为游戏设计师。除了技术技能，游戏设计师还必须能够看到游戏创作过程的整体图景。\n\
    \n程序员编写详细代码，而游戏设计师应对编码有总体理解，并能在一定程度上编码。这会使游戏设计师更有效地沟通游戏应如何成形。游戏设计师指导程序员和其他团队成员。他们沟通如何进行调整、提出创意批评，并处理日程和截止日期。这意味着游戏设计师可能还懂得如何设计或绘画。看清全局并知道如何执行项目，是游戏设计师的工作。\n\
    \n游戏设计师或首席游戏设计师的工作不是入门级职位。它需要具备制作游戏的经验。不过，这份工作不一定要求大学学位。展示你能胜任游戏设计师工作的最好方式，就是自己制作一个小规模游戏。\n\
    \n### 自我准备\n\n从零开始发明一款游戏，需要创造力、艺术技能和编程能力相结合。要成为游戏设计师，你应该写下并勾勒出你对电子游戏的想法。熟悉编程、游戏引擎以及你希望创作的电子游戏类型。绘画、美术、平面设计和编程都是你应该参与学习的课程或活动，以成为游戏设计师。利用可用的在线资源。尝试制作一个简单的电子游戏，然后与朋友一起转向更大、更有雄心的项目。\n\
    \n### 未来前景\n\n美国劳工统计局不收集电子游戏行业或桌游的数据\n\n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_97_0.png)\n\
    \n## 书籍\n\nBrathwaite, Brenda, and Ian Schreiber. *游戏设计师的挑战*. Newton Centre, MA:\
    \ Charles River Media, 2008.\n\nBrathwaite 和 Schreiber 提供了一些练习，读者可以照着创建自己的游戏设计。\n\
    \nRogers, Scott. *升级！伟大电子游戏设计指南*. New York, NY: Wiley, 2014.\n\nRogers 描述了电子游戏设计、如何推销你的电子游戏创意，以及如何为移动端和主机系统创作游戏。\n\
    \nSchell, Jesse. *游戏设计艺术：透镜之书*. Oxfordshire, England: AK Peters/CRC Press, 2014.\n\
    \n作为顶尖游戏设计师，Schell 通过许多从该领域之外看待游戏设计的人的“透镜”来解释游戏设计。\n\n## 组织\n\n交互艺术与科学学院（AIAS）\
    \  \n11175 Santa Monica Boulevard, 4th Floor  \nLos Angeles, CA 90025  \n(310)\
    \ 484-2560  \n网站：http://www.interactive.org  \nAIAS 是一个非营利组织，致力于推广交互艺术，包括电子游戏艺术。\n\
    \n娱乐软件协会（ESA）  \n575 7th Street NW, Suite 300  \nWashington, DC 20004  \n网站：http://www.theesa.com\
    \  \nESA 为数字媒体专业人士提供支持，包括电子游戏开发者。\n\n## 期刊\n\n*国际计算机游戏技术杂志*  \n315 Madison Avenue,\
    \ 3rd Floor, Suite 3070  \nNew York, NY 10017  \n网站：http://www.hindawi.com/journals/ijcgt\
    \  \n该期刊发表关于游戏技术和交互式数字媒体的原创研究和综述文章。\n\n## 网站\n\n由于互联网链接不断变化，Rosen Publishing 制作了一份与本书主题相关的网站在线列表。该网站定期更新。请使用以下链接访问列表：\n\
    \nhttp://www.rosenlinks.com/CCWC/game\n\n## 第8章：游戏之声\n\n在电子游戏行业中，声音和音乐作为职业道路有时会被忽视。然而，声音和音乐在游戏中与在电影中同样重要。我们喜爱的许多电子游戏都有标志性的原声带和音效。试着想象没有音效或原声带的经典游戏，如\
    \ *吃豆人* 或 *大金刚*。那种体验将完全不同。\n\n如今电子游戏更像电影，演员为游戏角色配音，著名作曲家创作游戏配乐并指挥管弦乐队。电子游戏音乐已变得如此流行，以至于原声带会与游戏同步以黑胶唱片形式发行。当一款新电子游戏发行时，有些会推出限量版，其中包含艺术设定集和原声带等别处无法获得的附加内容。\n\
    \n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_103_0.png)\n\n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_106_0.png)\n\
    \n音乐人可以通过为游戏原声带或配乐作出贡献，在电子游戏行业找到工作。调音台用于在录音棚中组合各种音轨和录音。\n\n### 用音乐赚钱\n\n可以在手机和平板电脑上购买功能强大的音乐和声音创作应用。这些应用可以成为开始为电子游戏创作声音和音乐的好方法，而无需投资购买更大型的乐器。\n\
    \n保留其音乐版权的作曲家可以通过 bandcamp.com 等网站在线销售其游戏原声带。在线销售你的音乐是赚钱的好方法。Soundcloud 是另一个分享音乐但不允许下载的网站。在网上结识其他音乐人并建立人脉，有助于带来自由职业工作和就业机会。人们经常在这些网站上寻找新艺术家和新声音，这些网站为想要相互建立人脉的音乐人提供了良好的曝光机会。\n\
    \n多年来，音乐创作和制作在电子游戏行业中一直稳步增长。许多在电影行业难以找到工作的音乐人和作曲家，由于正在制作的游戏数量庞大，更容易获得电子游戏方面的工作。\n\
    \n"
