    \ are options. If you or a small group of friends have the multiple well-rounded\
    \ skills needed to create a game, then you might want to consider making it yourself.\
    \ Many advanced video games like *Call of Duty* and *Assassin’s Creed* require\
    \ dozens or even hundreds of people to bring to completion. There have been some\
    \ very fine examples of smaller, more intimate games created by individuals or\
    \ small groups that have been successful.\n\nMaking a video game without the financial\
    \ backing of a large company is not an easy undertaking, but it is by no means\
    \ impossible. Today “indie” games, or independent video games made by a single\
    \ person or small group without a video game publisher, are a growing force in\
    \ the market.\n\nIndependent video game projects are being created, sold, and\
    \ played all the time. Very large companies have even bought indie games after\
    \ they received much success and praise in the market. One example is the virtual\
    \ reality headset Oculus Rift. The headset displays video games in high definition.\
    \ The project received its funding online at first and was then purchased by Facebook\
    \ in 2014 for $2 billion. Development continued and the headset was released in\
    \ 2016.\n\n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_115_0.png)\n\nVirtual reality\
    \ headsets are the next step in video games. Here, a gamer is wearing the popular\
    \ Oculus Rift® headset to play a game. This places the player in an immersive\
    \ visual and auditory environment, making him or her feel that they are truly\
    \ \"in\" the game.\n\nIndie games include games made for gaming consoles and also\
    \ games for apps developed for Android or Apple phones. A college education is\
    \ not required to make an indie game, but all of these features are needed\n\n\
    ![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_118_0.png)\n\nVideo game documentaries,\
    \ such as *Indie Game: The Movie*, are great resources for getting to know what\
    \ the independent gaming industry is like.\n\n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_119_0.png)\n\
    \nAttending game developer conferences such as this one in San Francisco, California,\
    \ is important for staying up-to-date on industry trends. Here, players and creators\
    \ can interact, as well as present their ideas and projects to industry professionals\
    \ and the media.\n\n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_120_0.png)\n\nJonathan\
    \ Blow created *Braid*, which is one of the all-time highest-rated games.\n\n\
    ### GOING IT ALONE\n\nA great way to stay involved in the gaming industry is to\
    \ attend the annual Game Developers Conference (GDC) and the Independent Games\
    \ Summit that is held there. This is the biggest annual gathering for gaming professionals.\
    \ Attending the GDC is a great way to see what is being created, as well as a\
    \ great opportunity to make connections in the gaming industry.\n\nAnother great\
    \ resource for indie game developers is Steam, a website where many games, small\
    \ and large, can get distributed for sale. While you may not get the in-store\
    \ visibility that larger gaming companies have for their games, Steam has had\
    \ sixty-five million users worldwide since 2014. Games on the website have a good\
    \ chance of being seen and played.\n\n## 深度学习在医学影像分析中的应用综述\n\n随着人工智能技术的飞速发展，深度学习已成为医学影像分析领域最具潜力的工具之一。本文综述了深度学习在医学影像分类、分割、检测和配准等任务中的最新进展，并探讨了面临的挑战与未来方向。\n\
    \n### 1. 引言\n\n医学影像是现代临床诊断的核心依据。传统的人工阅片方式不仅耗时费力，而且诊断结果易受医生经验与主观因素的影响。深度学习技术的引入，为医学影像的自动化和智能化分析带来了革命性的突破。\n\
    \n### 2. 深度学习方法概述\n\n深度学习通过多层神经网络自动学习数据的层次化特征表示。在医学影像分析中，常用的深度学习架构包括：\n\n- **卷积神经网络（CNN）**：擅长提取空间特征，广泛用于图像分类与分割。\n\
    - **循环神经网络（RNN）**：适合处理序列数据，常用于时序影像分析。\n- **U-Net及其变体**：编码器-解码器结构，在医学图像分割中表现卓越。\n\
    - **Transformer**：基于自注意力机制，在多项医学影像任务中已达到最先进水平。\n\n### 3. 主要应用场景\n\n表1总结了深度学习在不同医学影像任务中的典型应用：\n\
    \n| 任务 | 典型应用 | 常用架构 | 代表数据集 |\n|------|----------|----------|------------|\n\
    | 图像分类 | 肺炎检测、皮肤病变分类 | ResNet、EfficientNet | ChestX-ray14、ISIC |\n| 图像分割 | 肿瘤分割、器官勾画\
    \ | U-Net、DeepLabv3 | BraTS、LiTS |\n| 目标检测 | 肺结节检测、细胞检测 | Faster R-CNN、YOLO |\
    \ LUNA16、BBBC005 |\n| 图像配准 | 多模态配准、运动校正 | VoxelMorph、TransMorph | Learn2Reg |\n\
    \n### PREPARING YOURSELF\n\nRead trade publications and journals to keep informed\
    \ about new platforms and game ideas. This can give you a head start brainstorming\
    \ and creating content for what is to come. To create a video game independently\
    \ you will need to stay focused on all aspects of game creation. In addition to\
    \ the skills it takes to make and develop a game, you may want to take some business\
    \ courses to help you through the process of funding and marketing your work.\n\
    \n### FUTURE PROSPECTS\n\nThe US Bureau of Labor Statistics does not collect data\
    \ about video game entrepreneurs, but has done studies about the work of established\
    \ entrepreneurs in general. They have found that many get their start with entrepreneurship\
    \ as a second job. Some independent business ventures are successful, and some\
    \ are not. The more prepared you are before taking financial risks, the better\
    \ you will be in your business endeavors and future prospects. The area of independent\
    \ game development is a growing field and will likely continue that way for many\
    \ years.\n"
  mdcn: "\n几乎所有电子游戏都有音乐原声，音乐人可以从事作曲、制作音效或录制歌曲等工作。即使是一个简单的移动应用，也需要音效，而这些音效可以由有音乐天赋的人来制作。\n\
    \n配音表演和演唱也属于电子游戏声音的范畴。这些职位需要才华横溢的歌手和演员。一些名人已将自己的表演和声音才华借给电子游戏，但这并不意味着你必须是著名演员才能在电子游戏表演领域找到工作。尝试回应独立游戏开发者的招聘广告，他们正在制作电子游戏。他们可能需要配音人才，但可能没有很高的预算。你可以在这里积累简历，并开始进入这一领域工作。\n\
    \n### 做好准备\n\n学习如何作曲以及掌握一种乐器很重要。熟悉电子键盘和音乐程序等不同的数字设备，也是很好的准备。聆听各类电子游戏的音效和原声。即使是移动设备上的小游戏也需要音效和音乐。在电脑上创建数字音效库，并创作短小的器乐曲，可用于你的作品集。\n\
    \n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_109_0.png)\n\n知名电子游戏配音演员特洛伊·贝克曾主演*《最后生还者》*和*《中土世界：暗影魔多》*。配音表演是许多电子游戏不可或缺的一部分。许多配音演员在多个行业工作，电子游戏只是其中之一。\n\
    \n### 未来前景\n\n根据美国劳工统计局的数据，由于提供音频和视频功能的多媒体产品不断增长，音响工程师的就业前景预计在未来十年将有所增长。这包括所有平台上的电子游戏。该局并未针对音乐人和配音演员等艺术家收集数据，但可以预期会有类似的增长。\n\
    \n### 组织\n\n音频工程学会（AES）  \n551 Fifth Ave, Suite 1225  \nNew York, NY 10176  \n\
    (212) 661-8528  \n网站：http://www.aes.org  \nAES 是一个致力于音频技术的专业学会。它成立于1948年，服务于音频工程师、学生、艺术家以及对声音技术感兴趣的科学家。\n\
    \n音频出版商协会（APA）  \n100 North 20th Street, Suite 400  \nPhiladelphia, PA 19103 \
    \ \n(215) 564-2729  \n网站：http://audiopub.org  \nAPA 是一个非营利组织，致力于维护音频出版商以及与音频产品相关的产品的利益。\n\
    \n### 网站\n\n由于互联网链接不断变化，罗森出版公司制作了一份与本书主题相关的网站在线列表。该网站定期更新。请使用以下链接访问该列表：\n\nhttp://www.rosenlinks.com/CCWC/game\n\
    \n## 第9章\n\n## 让你的电子游戏成为现实\n\n你有一个很棒的电子游戏创意，但没有资金或大公司的支持吗？看起来，一个人几乎无法完全独自创造出什么东西。但仍有选择。如果你或一小群朋友具备制作游戏所需的多方面综合技能，那么你也许可以考虑自己动手制作。许多像*《使命召唤》*和*《刺客信条》*这样的高级电子游戏需要数十甚至数百人才能完成。也有一些非常优秀的例子，是由个人或小团队创作的更小、更私密的游戏，并取得了成功。\n\
    \n在没有大公司资金支持的情况下制作电子游戏并非易事，但绝非不可能。如今，“独立”游戏，即由单个人或小团队在没有电子游戏发行商的情况下制作的独立电子游戏，是市场中不断增长的力量。\n\
    \n独立电子游戏项目一直在被创作、销售和游玩。一些非常大的公司甚至在独立游戏于市场上获得巨大成功和赞誉后将其收购。一个例子是虚拟现实头显 Oculus Rift。该头显以高清画质显示电子游戏。该项目最初在网上获得融资，随后于2014年被\
    \ Facebook 以20亿美元收购。开发继续进行，该头显于2016年发布。\n\n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_115_0.png)\n\
    \n虚拟现实头显是电子游戏的下一步。图中，一名玩家戴着广受欢迎的 Oculus Rift® 头显玩游戏。这将玩家置于沉浸式的视觉和听觉环境中，让他或她感觉自己真正“身处”游戏之中。\n\
    \n独立游戏包括为游戏主机制作的游戏，也包括为安卓或苹果手机开发的应用程序游戏。制作独立游戏不需要大学教育，但所有这些特征都是必需的\n\n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_118_0.png)\n\
    \n诸如*《独立游戏大电影》*这样的电子游戏纪录片，是了解独立游戏行业状况的绝佳资源。\n\n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_119_0.png)\n\
    \n参加电子游戏开发者大会，例如在加利福尼亚州旧金山举行的这场大会，对于紧跟行业趋势很重要。在这里，玩家和创作者可以互动，也可以向行业专业人士和媒体展示他们的想法和项目。\n\
    \n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_120_0.png)\n\n乔纳森·布洛创作了*《时空幻境》*，这是有史以来评分最高的游戏之一。\n\
    \n### 单打独斗\n\n继续参与游戏行业的一个好方法是参加一年一度的游戏开发者大会（GDC）以及在那里举行的独立游戏峰会。这是游戏专业人士规模最大的年度聚会。参加\
    \ GDC 是了解正在创作什么的好方法，也是在游戏行业建立人脉的绝佳机会。\n\n独立游戏开发者的另一个绝佳资源是 Steam，这是一个可以分发许多大大小小的游戏以供销售的网站。虽然你可能无法获得大型游戏公司为其游戏所拥有的实体店曝光度，但\
    \ Steam 自2014年以来已在全球拥有6500万用户。该网站上的游戏很有可能被看到和游玩。\n\n## 深度学习在医学影像分析中的应用综述\n\n随着人工智能技术的飞速发展，深度学习已成为医学影像分析领域最具潜力的工具之一。本文综述了深度学习在医学影像分类、分割、检测和配准等任务中的最新进展，并探讨了面临的挑战与未来方向。\n\
    \n### 1. 引言\n\n医学影像是现代临床诊断的核心依据。传统的人工阅片方式不仅耗时费力，而且诊断结果易受医生经验与主观因素的影响。深度学习技术的引入，为医学影像的自动化和智能化分析带来了革命性的突破。\n\
    \n### 2. 深度学习方法概述\n\n深度学习通过多层神经网络自动学习数据的层次化特征表示。在医学影像分析中，常用的深度学习架构包括：\n\n- **卷积神经网络（CNN）**：擅长提取空间特征，广泛用于图像分类与分割。\n\
    - **循环神经网络（RNN）**：适合处理序列数据，常用于时序影像分析。\n- **U-Net及其变体**：编码器-解码器结构，在医学图像分割中表现卓越。\n\
    - **Transformer**：基于自注意力机制，在多项医学影像任务中已达到最先进水平。\n\n### 3. 主要应用场景\n\n表1总结了深度学习在不同医学影像任务中的典型应用：\n\
    \n| 任务 | 典型应用 | 常用架构 | 代表数据集 |\n|------|----------|----------|------------|\n\
    | 图像分类 | 肺炎检测、皮肤病变分类 | ResNet、EfficientNet | ChestX-ray14、ISIC |\n| 图像分割 | 肿瘤分割、器官勾画\
    \ | U-Net、DeepLabv3 | BraTS、LiTS |\n| 目标检测 | 肺结节检测、细胞检测 | Faster R-CNN、YOLO |\
    \ LUNA16、BBBC005 |\n| 图像配准 | 多模态配准、运动校正 | VoxelMorph、TransMorph | Learn2Reg |\n\
    \n### 做好准备\n\n阅读行业出版物和期刊，以了解新平台和游戏创意。这可以让你在头脑风暴和为未来内容创作方面抢占先机。要独立制作电子游戏，你需要持续关注游戏创作的各个方面。除了制作和开发游戏所需的技能外，你可能还想学习一些商业课程，以帮助你完成作品的融资和营销过程。\n\
    \n### 未来前景\n\n美国劳工统计局不收集关于电子游戏创业者的数据，但已对一般成熟创业者的工作进行了研究。他们发现，许多人最初是把创业作为第二职业起步的。一些独立商业项目会成功，一些则不会。在承担财务风险之前准备得越充分，你在商业努力和未来前景中就会表现得越好。独立游戏开发领域是一个不断增长的领域，并且很可能在许多年里继续保持这种势头。\n"
