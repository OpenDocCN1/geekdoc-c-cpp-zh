    # CHAPTER 8


    # THE SOUND OF GAMING


    Sound and music are sometimes overlooked as a career path in the video game industry.
    However, sound and music are just as important in games as they are in films.
    Many of the video games we love have iconic soundtracks and sound effects. Try
    and imagine classic games like *Pac-Man* or *Donkey Kong* without sound effects
    or a soundtrack. The experience would not be the same.


    Today video games are more like motion pictures, with actors voicing game characters
    and famous composers creating game scores and directing orchestras. Video game
    music has become so popular that soundtracks are released alongside the


    ![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_103_0.png)'
  - '[PAGE 104]


    <!-- no content -->'
  - '[PAGE 105]


    <!-- no content -->'
  - '[PAGE 106]


    ![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_106_0.png)


    Musicians can find work in the video game industry by contributing to a game soundtrack
    or score. Mixing boards are used to combine a variety of tracks and recordings
    in a studio.'
  - '[PAGE 107]


    # # MAKING MONEY WITH MUSIC


    Powerful music and sound creation apps can be purchased on mobile phones and tablets.
    These apps can be a good way to get started creating sounds and music for video
    games without having to invest in larger instruments.


    Composers who retain the rights to their music can sell their game soundtracks
    online through websites like bandcamp.com. Selling your music online is a great
    way to make money. Soundcloud is another website for sharing music without allowing
    it to be downloaded. Meeting other musicians online and networking can help lead
    to freelance work and employment opportunities. People often look for new artists
    and sounds on these sites, and they provide good exposure for musicians who want
    to network with one another.


    on vinyl. When a new video game is released, some have limited editions that contain
    extras such as art books and soundtracks that are not available elsewhere.


    Music composition and creation has been steadily growing in the video game industry
    for many years. Many musicians and composers who have had a hard time finding
    work in the film industry have an easier time getting work for video games because
    of the sheer number of games being produced.'
