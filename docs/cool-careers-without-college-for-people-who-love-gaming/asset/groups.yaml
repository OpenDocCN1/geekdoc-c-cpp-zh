  - '[PAGE 81]


    # # CHAPTER 6


    # # READY, SET, PROGRAM!


    All applications, games, and software programs on computers or gaming systems
    require specific instructions to make them run. These instructions are special
    computer languages, commonly called code. A programmer writes code that instructs
    the computer, mobile device, or game system what to do and how to run when a user
    plays a game. All computers and video game systems use coding languages to run
    games and execute user input to interact with gaming elements. The programming
    allows users to control the game elements by using game controllers. Many different
    programming languages can be used to create games for computers, video game consoles,
    or handheld devices.


    ![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_81_0.png)'
  - '[PAGE 82]


    Game programmers are essential for bringing all aspects of a game to life. They
    are responsible for building the game from dream to reality. Every aspect of the
    game, from story to visuals to play, has to be constructed out of strings of code
    for it to appear in a playable format for users.'
  - '[PAGE 83]


    Game programmers must write all of the activity that occurs during game play—from
    player input to nonplayer elements. Even the graphic images and 3-D elements that
    were created by graphic designers and artists must be controlled by a programmer’s
    game code before the video game can function.


    # GAMING CODE LANGUAGES


    In order to become a programmer, you will need to familiarize yourself with the
    various computer programming languages used to create video games. The most common
    in the industry today are JavaScript, Java (for Android/Google), C++ for PC and
    console games, and Objective-C (for iOS/Apple).


    Learning a computer programming language may seem like an impossible task, but
    there are many online resources to help anyone, even children, learn to code.
    Some resources even allow you to create your own video game to run on your home
    computer.


    Rather than starting off trying to tackle a big ambitious gaming project, it’s
    best to


    ![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_83_0.png)'
  - '[PAGE 84]


    ![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_84_0.png)


    Creating a game requires a variety of tools and simulations, from coding to programs
    like Godot that allows designers to build and simulate the environment of the
    game. Some programs are free to download and use, even for amateurs, and can be
    used to build coding and design skills outside of formal training.'
  - '[PAGE 85]


    ![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_85_0.png)


    Take advantage of courses offered at your school, such as computer science or
    programming. They provide valuable skills for someone considering a career in
    the gaming field.'
  - '[PAGE 86]


    start small. Once you take the first steps with learning coding and creating simple
    actions, you will see that learning coding is not as complex as you may have once
    thought. One reason that coding may not be as daunting as it looks is because
    software exists to create video game code. This existing game creation software
    is referred to as a game engine. Game engines help make the job of the programmer
    easier.


    Game engines exist as frameworks so that programmers can easily adapt them to
    the project they are working on. Core programming elements already exist in a
    game engine, and this allows game programmers to just focus on creating specific
    game elements unique to the game being designed. Game engines also help to manage
    all of the assets required to run a game and render them to the player’s TV screen.


    Some of the more common game engines that are used by programmers today are Unity3D,
    Unreal Engine, CryEngine 3, and HeroEngine. Each of these can be found online.
    If you are interested in learning to code, these programs are worth using.'
  - '[PAGE 87]


    # GET DOWN TO BUSINESS


    If you find that your school does not offer courses in coding, don''t give up.
    The Khan Academy, an online educational site, has game programming and computer
    language classes for free; local community colleges may also offer classes or
    summer courses in programming. If possible, try to find a class that will allow
    you to code an entire game from start to finish. This can become an important
    portfolio piece when you are looking for work. Even if you don''t plan on being
    a computer programmer, all people working on creating video games should know
    at least a little bit about programming. Understanding programming is important
    even for designers and artists, so that they know what is possible when creating
    a game.


    The job of a computer programmer can be varied. Here are some of the tasks a programmer
    can expect to do on the job:


    +   - Turn instructions from designers into codes that a computer can follow.

    +   - Write code to make a specific game work on a designated computer platform.

    +   - Convert the code of a game so that it works across gaming platforms. (For
    example, convert a game coded'
  - '[PAGE 88]


    for Microsoft Xbox to work on a Sony Playstation or Nintendo system.)


    +   - Code games into an app for mobile devices.

    +   - Correct glitches that occur in new or existing designs.


    # ## PREPARING YOURSELF


    If your school offers any computer or programming courses, take them. Even if
    gaming is not part of the curriculum, join an online course or watch tutorials
    on the internet. When you are ready to apply for jobs as a programmer, familiarize
    yourself with questions that interviewers may ask by researching the topic. Programmers
    are often asked more difficult, problem-solving questions in an interview. It’s
    also likely that a prospective employer will give you a coding test as part of
    the interview.


    # ## FUTURE PROSPECTS


    According to the US Bureau of Labor Statistics, the outlook for computer programmers
    has been slightly declined. The job can be done from anywhere in the world, so
    companies sometimes look to hire programmers from countries where wages are lower.
    The salary of a computer programmer in North America is higher than the median
    salary for other jobs.'
  - '[PAGE 89]


    # FOR MORE INFORMATION


    # BOOKS


    Aziz, Adnan, Tsung-Hsien Lee, and Amit Prakash. _Elements of Programming Interviews:
    The Insider’s Guide_. Seattle, WA: CreateSpace Independent Publishing Platform,
    2012. Aziz, Lee, and Prakash explore the types of problems candidates are given
    in job interviews for programming positions.


    Connor, Joseph. _Programming: Computer Programming for Beginners: Learn the Basis
    of Java, SQL & C++_. Seattle, WA: CreateSpace Independent Publishing, 2015. Connor
    discusses the basics of computer programming and covers the use of JavaScript,
    SQL, and C++.


    Habgood, Jacob. _The Game Maker’s Apprentice: Game Development for Beginners_.
    New York, NY: Apress, 2007. Habgood guides the reader through the creation of
    nine video games using the video game creation tool Game Maker.


    McDowell, Gayle Laakmann. _Cracking the Coding Interview: 189 Programming Questions
    and Solutions_. Palo Alto, CA: CareerCup Publishing, 2015.'
  - '[PAGE 90]


    McDowell discusses some of the more unique and difficult questions asked of programmers
    on job interviews and provides ways to think on your feet during an interview.


