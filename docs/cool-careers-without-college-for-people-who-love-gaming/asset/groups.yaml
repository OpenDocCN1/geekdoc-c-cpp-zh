    \n游戏测试也不只针对电子游戏。2012年，游戏公司威世智向公众发布了经典角色扮演游戏*龙与地下城*当前第五版的早期测试版，供玩家试玩测试。当地的*龙与地下城*游戏团体能够进行试玩，并直接向威世智提供反馈，以帮助塑造*龙与地下城*第五版。第五版入门套装于2014年7月15日发售。即使你只是自愿试玩一款游戏，这份宝贵的经历仍然可以在申请专业游戏测试工作时列入简历。\n\
    \n## 赚钱\n\n作为职业玩家赚钱并不容易，但确实可行，而且不需要大学教育。你需要成为一名出色的玩家，而且不能只是擅长随便哪款游戏。一些较受欢迎的职业比赛游戏包括：*英雄联盟*、*反恐精英：全球攻势*、*DotA\
    \ 2*、*炉石传说*、*神之浩劫*、*魔兽世界*、*风暴英雄*和*任天堂明星大乱斗*。如果你打算以职业游戏为职业，那么精通其中一款游戏将是必须的。尽管许多人可能会说这希望渺茫，但已经有人以此为生。这种新兴娱乐日益增长的人气所带来的关注只会越来越大。最成功的职业玩家仅凭比赛奖金就能获得六位数的收入，还不包括来自战队或赞助商的薪水。\n\
    \n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_29_0.png)\n\n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_30_0.png)\n\
    \n职业游戏战队的成员必须一起良好地比赛和合作，才能在电子竞技中取得成功。\n\n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_31_0.png)\n\
    \n职业玩家通常了解计算机的工作原理。这在为比赛速度进行定制和升级时很有用。玩家可能会参与甚至从零开始组装他们理想的计算机系统，以支持快速游戏和多种复杂功能。\n\
    \n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_32_0.png)\n\n职业玩家加入战队可以获得报酬，并且经常由赞助商支付报酬来代言产品或游戏公司，这增加了他们的收入。职业玩家也可以独自或在小团队中比赛，争夺奖金池中的奖金。\n\
    \n## 游戏电脑\n\n如果你想成为职业玩家，甚至只是在线玩竞技游戏，你都需要一台好的游戏电脑，以及高速互联网连接。职业玩家所玩的游戏通常不在Xbox或PlayStation等家用游戏主机上玩。许多竞技电子游戏可以购买或通过数字下载获得，适用于Microsoft\
    \ Windows，以及Apple Mac OS X和基于Linux的SteamOS PC电脑。一些公司专门为狂热游戏玩家制造电脑。这些电脑被称为游戏电脑或游戏装备，配备非常快的CPU（中央处理器）和GPU（图形处理器）或显卡，有助于非常高效地运行游戏。\n\
    \n## 职业角色扮演\n\n角色扮演（Cosplay，即costumed play）是一种独特现象，人们装扮成自己最喜欢的科幻、奇幻或漫画角色。角色扮演者通常出现在漫画展、科幻展和游戏展上。大多数参与角色扮演的人通常只是为了好玩而装扮。不过，有些人已经设法通过装扮成角色来谋生。有些人甚至通过装扮并将爱好变成职业，赚到了相当多的钱。\n\
    \n许多职业角色扮演者会缝制并从头制作自己的服装和道具。一些最精美的定制服装由专业人士穿着，他们通过展会亮相、游戏推广、拍照和模特工作获得报酬。在展会上或网上出售签名印刷品是角色扮演赚钱的另一种方式。参与Twitter和Instagram等许多社交媒体渠道，可以帮助一些角色扮演者获得数千名忠实粉丝。\n\
    \n*这些职业角色扮演者正在2014年东京国际电影节的世界角色扮演峰会上表演《塞尔达传说》。许多粉丝参与角色扮演，是为了在参加展会和其它游戏活动时参与其中并展示对某个系列作品的热爱。*\n\
    \n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_33_0.png)\n\n许多职业玩家通过购买和组装各种组件来定制自己的电脑，例如主板、显卡、散热风扇、硬盘和内存条。玩家定制的电脑通常以性能为设计目标，并需要在新组件上市时采用最新组件。拥有一台快速的电脑对于竞技游戏至关重要。\n\
    \n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_34_0.png)\n\n### 做好准备\n\n暂时不要辞掉你的日常工作。职业游戏适合那些热爱竞技比赛并且擅长一款流行且成熟的电子竞技游戏的人。重要的是要记住，竞争非常激烈，即使你很出色，也仍然不能保证有钱可赚或有收入。对这一领域感兴趣的人可以在业余时间参与，同时仍从更传统的来源赚钱。下载并玩流行的电子竞技游戏，随着时间推移提高你的技能。\n\
    \n除了观看现场职业比赛，还可以通过Major League Gaming（MLG）在线观看这个不断发展的行业。如果你热爱职业游戏，但水平还不够高，无法通过比赛赚钱，那么成为电子竞技网站和在线广播网络的体育解说员或撰稿人也是可以考虑的其他领域。\n\
    \n### 未来前景\n\n电子竞技行业仍处于起步阶段。这一领域的发展前景高于平均水平。即使你不能作为职业选手进入电子竞技领域，还有其他相关职位，例如管理和组织专业人员。\n\
    \n### 组织\n\n- 国际电子竞技联合会  \n  5F #501, 1-1  \n  Hangangno 3-ga  \n  Yongsan-gu\
    \  \n  Seoul, Korea  \n  +82-2-715-6661  \n  网站：http://ie-sf.com  \n  国际电子竞技联合会致力于将电子竞技推广为一项没有语言、种族或文化障碍的运动。\n\
    \n- Major League Gaming  \n  East 34th Street  \n  New York, NY 10016  \n  网站：http://www.majorleaguegaming.com\
    \  \n  Major League Gaming是美国电子竞技和竞技游戏赛事的主要赞助商及在线转播来源。\n\n### 网站\n\n由于互联网链接不断变化，Rosen\
    \ Publishing开发了一个与本书主题相关的网站在线列表。该网站会定期更新。请使用以下链接访问该列表：\n\nhttp://www.rosenlinks.com/CCWC/game\n\
    \n### 第3章\n\n## 书写游戏的未来\n\n任何叙事作品的良好基础都是一个写得好的故事。为你的游戏准备一个好故事，会让它对玩家更有吸引力。游戏行业的写作职业可以像现有的众多游戏和平台一样多种多样。撰写游戏只是作家在游戏领域可以从事的一种工作。优秀的作家可以参与与游戏领域相关的新闻工作和博客写作。游戏指南、游戏说明和“艺术设定”类书籍，以及为游戏行业制作的任何书籍所附带的任何文字，也需要作家。\n\
    \n公司的全职写作工作会在网上发布广告，或通过招聘公司处理。然而，许多作家以自由职业者的身份向杂志和网站投稿。任何人都可以这样做，\n\n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_39_0.png)\n"
