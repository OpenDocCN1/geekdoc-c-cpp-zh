    # HAVING WHAT IT TAKES


    Before you produce your game, you will need to take part in the following activities
    to be successful in your endeavor:


    +   - Write a business plan that explains how many units you will produce, how
    much each will cost to make, and how much you will charge.

    +   - Make a plan for distributing your goods locally, nationally, or globally.

    +   - Create a plan to promote your product.

    +   - Research funding your project, such as crowdsourcing or financial backers.

    +   - Track all funds associated with the costs and profits of the business.

    +   - Seek accounting help for the tax side of the business.


    Entrepreneurs must be ready to deal with unexpected problems with the business,
    so a good attitude and a personable outlook will go a long way when dealing with
    customers, financial backers, or business partners.'
