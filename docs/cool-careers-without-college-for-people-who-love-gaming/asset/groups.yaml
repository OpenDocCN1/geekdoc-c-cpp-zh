    \ 获取\n\n马来西亚制造\n\n## 目录\n\n- 引言 ... 6\n- 第1章\n  - 接触游戏客户 ... 10\n- 第2章\n  - 开始你的游戏\
    \ ... 22\n- 第3章\n  - 书写游戏的未来 ... 36\n- 第4章\n  - 艺术家的世界 ... 50\n- 第5章\n  - 用设计掌控外观\
    \ ... 64\n- 第6章\n  - 准备、设置、编程 ... 78\n- 第7章\n  - 开始你的游戏设计 ... 90\n- 第8章\n  - 游戏之声\
    \ ... 100\n- 第9章\n  - 让你的电子游戏成为现实 ... 111\n- 第10章\n  - 让你的爱好游戏成为现实 ... 123\n-\
    \ 术语表 ... 133\n- 参考书目 ... 136\n- 索引 ... 141\n\n## 引言\n\n电子游戏是交互式的、基于故事的场景或谜题，玩家在电脑显示器或电视屏幕上操控动态动作。从20世纪70年代凭借《吃豆人》等投币街机游戏而早期流行，到当代高清沉浸式家用主机游戏如*Destiny*、*Fallout\
    \ 4*和*Star Wars Battlefront*，电子游戏行业经历了大量变化和显著增长。\n\n如今，三大游戏系统主导家用主机市场：索尼 PlayStation\
    \ 4、微软 Xbox One 和任天堂 Wii U。2015年电子游戏行业总收入超过910亿美元，并将继续增长。2015年，在智能手机和平板电脑上使用的移动游戏超过了基于主机的游戏系统上的游戏销量。\n\
    \n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_9_0.png)\n\n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_10_0.png)\n\
    \n电子游戏行业已在世界各地流行起来，有许多面向专业人士和爱好者的大型博览会和会议。在那里，行业专业人士与业余玩家和竞技电子竞技明星交流，并会见让游戏引人入胜的创作者、设计师和演员。\n\
    \n与电子游戏行业并存的还有传统爱好游戏行业。这包括棋盘游戏、收藏类游戏、卡牌和骰子游戏、收藏微缩模型以及角色扮演游戏。截至2014年，传统爱好游戏的零售额增至8.8亿美元。玩游戏——无论是电子游戏还是传统游戏——是全球极其流行的消遣方式。\n\
    \n交互式电子游戏和传统爱好游戏当然是适合所有年龄段人群的有趣娱乐，但它们也是一项非常大的生意，并且年复一年地持续增长和演变。如果你已经热爱游戏，那么游戏行业中的某个职业可能正是你有兴趣追求的。但下一个合乎逻辑的步骤是什么？一个热爱游戏的人怎样才能进入一个日益多元化、复杂且技术性强的行业？而且，随着大学学费持续上涨，有没有可能在没有大学学历的情况下在游戏行业找到工作？\n\
    \n美国的学生贷款债务现在每秒增加2726美元，2016年总额超过1万亿美元。如今毕业的学院和大学学生中有三分之二将背负一定数额的学生债务。联邦债务接近17万亿美元，其中学生贷款占6%。17%的借款人拖欠学生贷款还款，只有27%的大学毕业生从事与大学专业相关的工作。\n\
    \n传统的大学专业往往不能提供进入游戏行业所需的教育。随着教育成本上升以及背负沉重学生贷款的令人生畏的前景，大学教育对许多学生来说正变得遥不可及。\n\n\
    然而，并非一切都完了。在游戏行业，无论是传统游戏还是电子游戏，都有许多职业道路可以让你不必先上大学就能追随。编程、写作、艺术、设计、音乐、配音、游戏设计、游戏初创企业以及销售和营销，只是你可能感兴趣的游戏相关领域中的一部分。由于大学毕业后的初级职位未必能把你直接带到理想的位置，你需要坚持、练习、勇气和决心来向前迈进、自我教育，并沉浸在你希望从事职业的游戏领域中。从长远来看，努力工作和坚持会有回报——而且即使没有大学教育也能做到。本书提供游戏行业不同方面职业的信息，并为深入了解每个方面提供有用资源。\n\
    \n## 第1章：接触游戏客户\n\n如果你正在阅读这份资料，那你很可能已经是一名游戏玩家——电子游戏或传统游戏玩家——并且你可能也想进入游戏行业某个创意或创业领域。也许你正考虑在没有大学学历的情况下做到这一点。虽然许多更光鲜的游戏工作——例如程序员、设计师和艺术家——是可以进入的，但让你迈进这个行业大门并开始赚钱最快、最容易的方式是零售业。\n\
    \n### 在商店工作\n\n大型游戏公司以及 GameStop 等零售门店需要销售人员、店员和经理来帮助向消费者销售游戏。任何销售游戏的地方，甚至二手游戏，都可能是开始积累经验的好地方。不需要大学学位。事实上，有些商店甚至可能在你满18岁之前就雇用你。申请前一定要查看当地商店。\n\
    \n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_13_0.png)\n\n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_14_0.png)\n\
    \n对游戏玩家来说，最容易进入的工作场所是电子游戏零售商。这有助于你及时了解最新游戏和趋势。它还让游戏爱好者能在玩游戏之外，以一种新方式与玩家和行业专业人士接触。\n\
    \n电子游戏商店、玩具店、书店和电子产品商店都销售电子游戏和传统游戏。如果你已经对游戏有所了解，这可以帮助你在商店找到工作。许多面向公众销售游戏的初级职位可供选择。以下职责可以帮助你推进职业生涯：\n\
    \n- 处理商店促销活动\n- 布置广告展示\n- 成为商店经理\n- 协助开设新店\n\n在游戏零售业工作可以让你与游戏玩家交流，接触游戏公司，并处理游戏促销、比赛和新产品发布。所有这些都是宝贵资产，能提供在简历上好看的经验，即使你的最终目标不是销售，而是游戏创作的其他方面。\n\
    \n你也可以考虑另一个密切相关的零售工作。例如，移动电话公司、电脑零售店或电子产品商店会雇用热爱游戏并且\n"
