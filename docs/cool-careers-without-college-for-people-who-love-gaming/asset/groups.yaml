    # CROWDSOURCING


    Crowdsourcing is a popular way for independent game creators to obtain funding
    for a game project from a large group of people. People funding a crowdsourced
    project will often be compensated by being given the finished product when the
    project is complete. With this method, the financial backers can support a project
    they approve of or identify with, and the creator gets the money he or she needs
    to make a product.


    The most popular crowdsourcing website is Kickstarter.com. One game created through
    crowdsourcing is the card game *Exploding Kittens*, which raised $8,782,571 on
    Kickstarter and became one of the most funded game campaigns of all time.


    Be sure to check out other crowdsourcing websites such as indiegogo.com, crowdfunder.com,
    and rockethub.com, and follow the guidelines for creating crowd-sourced game projects
    for each site.


    When getting funding for personal gaming projects proves too difficult, there
    are other options. For instance, board games and books for role-playing games
    need to be printed out, and this can be costly. To save on production costs and
    keep the selling price of your traditional game low, you can create a digital-only
    traditional board, card, or'
