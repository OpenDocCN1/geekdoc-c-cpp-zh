    \n- 美国编剧工会西部分会（WGAW）  \n  7000 West Third Street  \n  Los Angeles, CA 90048  \n\
    \  （323）951-4000  \n  网站：http://www.wga.org  \n  WGAW 是一个致力于帮助娱乐领域编剧（包括电子游戏编剧）发展事业的组织。\n\
    \n## 期刊\n\n- *《Game Informer》*  \n  724 North 1st Street, 3rd Floor  \n  Minneapolis,\
    \ MN 55401  \n  （612）486-6101  \n  网站：http://www.gameinformer.com\n\n动画是帮助创建游戏角色和虚拟游戏环境所必需的。3D\
    \ Studio Max、Maya 和 ZBrush 等三维建模程序，是游戏美术师用来创建游戏角色和元素的常用 3D 渲染程序之一。\n\n电子游戏美术师的一些职责包括：\n\
    \n-  绘制游戏中使用的角色和背景的概念草图\n-  按照商定的风格绘制详细的角色或背景图纸\n-  与团队成员沟通，打造与项目设计一致的视觉风格和氛围\n\
    -  绘制不同姿态下的角色细节图，以辅助 3D 渲染\n-  使用传统美术师或 3D 美术师/动画师常用的计算机程序\n-  运用扎实的色彩理论知识来构建出色的设计\n\
    \n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_55_0.png)\n\n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_56_0.png)\n\
    \n游戏美术师需要能够将传统技能与现代计算机渲染设备结合起来。通常，制作一款游戏需要大型团队协作，每个人承担不同的角色。所有这些工作最终汇聚到成品游戏中，但其中涉及成千上万项较小的任务，全部由专业人员分别处理。\n\
    \n你越能就自己的美术作品和正在参与的游戏概念进行沟通，就越能在游戏美术领域脱颖而出。视觉沟通对于向游戏团队所有成员解释游戏架构至关重要。像*《古墓丽影》*、*《塞尔达传说》*和*《光环》*这样的游戏都围绕着角色展开。许多游戏发生在奇幻景观和未来世界中，其中充满了虚构物种、生物、未来载具和外观酷炫的宇宙飞船。美术师在创造这些角色及其想象世界方面扮演着非常重要的角色。\n\
    \n## 一切始于美术\n\n任何想为任何类型的游戏创作任何形式美术的人，都应该具备非常扎实的绘画功底。人物、动物和风景背景尤其值得重点关注。练习绘画和制作一份过硬的作品集的重要性怎么强调都不为过。除非你是在没有公司帮助的情况下独立制作游戏，否则游戏公司会希望看到你的作品集，以确保你具备为他们工作的技能和经验。\n\
    \n草图画家和插画师并不是游戏领域唯一需要的美术人才。传统雕塑家同样不可或缺，他们需要为传统桌游棋子制作模型，以及为桌面游戏制作可玩的微缩模型。雕塑家在游戏行业中还可以从事的另一项工作是制作游戏玩具，比如《小龙斯派罗》、《迪士尼无限》或任天堂\
    \ amiibo 手办。有些美术师和雕塑家曾在艺术学院接受过传统训练，但并非所有人都是如此。即使是不与学位挂钩的美术课程，也能帮助初学者踏入这一领域。\n\n\
    ### 学习这一行\n\n游戏美术师将游戏故事创意付诸实现。概念艺术是这一过程的第一步，因此所有参与游戏创作的人都能开始看到游戏最终可能呈现的样子。游戏美术师创作的概念图和插画通常会经历讨论和批评。游戏美术师应当准备好与团队合作，对同一个创意、角色、生物或景观反复生成多种变体，直到设计团队或主设计师确定最终概念。\n\
    \n除了学习绘画，游戏美术师还需要熟悉透视、色彩理论、深度以及各种风格和媒介等概念。不同游戏有不同的视觉风格。一名全面的游戏美术师应当熟悉水彩、彩色铅笔、丙烯和油画等多种绘画媒介。\
    \ painterly（绘画感）、漫画风格、精细风格、松散渲染风格和平面风格等不同的美术风格，在确定游戏外观时都会派上用场。\n\n传统休闲游戏会在书籍、游戏卡牌和游戏棋盘上使用美术。多去熟悉不同的游戏，并尝试模仿你看到的各种风格。拥有多种美术风格的作品示例，将大大有助于打造一份有价值的作品集，帮助你成为游戏行业中的一名职业美术师。\n\
    \n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_59_0.png)\n\n![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_60_0.png)\n\
    \n要打磨你的美术技巧，请定期练习素描、速写和绘画。即使你的兴趣在于数字艺术，良好的写生能力、观察绘画能力以及对多种风格的熟悉程度，都是游戏设计美术师非常有用的技能。\n\
    \n## “艺术设定集”\n\n许多随电子游戏发售的咖啡桌风格的“艺术设定集”对任何有抱负的美术师来说都是宝贵的资源。卡牌游戏*《万智牌》*、电子游戏*《古墓丽影》*和手游*《植物大战僵尸》*等热门休闲游戏，只是少数几个拥有“艺术设定集”的例子。\n\
    \n在许多这类书籍中，为游戏构思元素的美术师们得以充分展示。最终产品的粉丝可以看到多种多样的概念艺术变体。你有特别喜欢的电子游戏类型吗？你是否也想成为这个行业中的美术师？为你喜爱的游戏购买一本“艺术设定集”，是了解电子游戏概念艺术是如何生成的绝佳方式。\n\
    \n## 数字艺术工具\n\n游戏美术师应当能够用传统手工方式画出概念草图。这项技能对美术师来说不太可能过时。然而，越来越多的游戏美术师转为使用 Adobe\
    \ Photoshop 和 Corel Painter 等艺术程序进行数字创作，在电脑上完成艺术作品。数字手写笔和数位板经常取代铅笔、画笔和颜料等传统工具。数字创作有很多好处，因为美术师可以非常轻松地切换媒介。完成的作品可以快速与团队成员分享并分发。\n\
    \n## 做好准备\n\n学习绘画可能是电子游戏美术职业生涯中最重要的一项技能。在学校选修美术课程，并经常练习绘画以提升技能。你也可以在 YouTube 上查找在线教学视频，通过在线艺术课程学习新的艺术技巧和规则，或观看教程。随身携带速写本，记录日常人物，是保持绘画技能敏锐的好方法。\n\
    \n向学校咨询是否提供计算机美术课程。3D 绘图或设计程序尤其有用。你不必在家里的电脑上安装每一个软件，但许多热门软件都提供免费试用版或学生折扣。\n\n\
    ## 未来前景\n\n游戏美术的未来一片光明，但跟上不断变化的计算机程序和游戏趋势非常重要。随着虚拟现实（VR）头显等新技术进入电子游戏行业，能够创作出有助于向设计团队传达概念的美术作品变得至关重要。掌握传统美术技能仍然重要，但除此之外，美术师还需要精通市场上出现的各种新技术。\n\
    \n"
