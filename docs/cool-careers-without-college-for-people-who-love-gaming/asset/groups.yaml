  - '[PAGE 95]


    ![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_95_0.png)


    Specialized gaming camps are available to high school students and are a great
    place to learn valuable skills in all areas of the industry. They cover a variety
    of the skills that a game designer may need from concept to creation.'
  - '[PAGE 96]


    +   - Programmer

    +   - System designer

    +   - World designer

    +   - Interface designer


    Game designers can specialize in specific areas of game creation. Someone with
    a wide variety of gaming skills would do well as a game designer. In addition
    to the technical skills, a game designer must be able to see the overall big picture
    of the game creation process.


    While programmers write detailed code, a game designer would have a general understanding
    of coding and be able to code to some extent. This would make the game designer
    a more effective communicator about how the game should be taking shape. Game
    designers direct the programmer and other team members. They communicate how to
    make adjustments, give creative criticisms, and handle schedules and deadlines.
    This means a game designer might also know how to design or draw. Seeing the big
    picture and knowing how to execute the project is the job of the game designer.'
  - '[PAGE 97]


    The job of a game designer or lead game designer is not an entry-level position.
    It requires experience with making games. The job does not necessarily require
    a college degree, however. The best way to show that you can master the job of
    a game designer is to do it by making a small-scale game yourself.


    # PREPARING YOURSELF


    Inventing a game from scratch requires creativity, artistic skills, and programming
    all together. To become a game designer you should write and sketch out your ideas
    for video games. Familiarize yourself with programming, game engines, and the
    types of video games you wish to create. Drawing, art, graphic design, and programming
    are all courses or activities you should involve yourself with to become a game
    designer. Use online resources that are available. Try and create a simple video
    game and then move on to larger, more ambitious projects with friends.


    # FUTURE PROSPECTS


    The US Bureau of Labor Statistics does not collect data on the video game industry
    or board game


