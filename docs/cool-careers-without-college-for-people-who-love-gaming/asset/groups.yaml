    Jonathan Blow created *Braid*, which is one of the all-time highest-rated games.


    # ## GOING IT ALONE


    A great way to stay involved in the gaming industry is to attend the annual Game
    Developers Conference (GDC) and the Independent Games Summit that is held there.
    This is the biggest annual gathering for gaming professionals. Attending the GDC
    is a great way to see what is being created, as well as a great opportunity to
    make connections in the gaming industry.


    Another great resource for indie game developers is Steam, a website where many
    games, small and large, can get distributed for sale. While you may not get the
    in-store visibility that larger gaming companies have for their games, Steam has
    had sixty-five million users worldwide since 2014. Games on the website have a
    good chance of being seen and played.'
  - '[PAGE 121]


    # # 深度学习在医学影像分析中的应用综述


    随着人工智能技术的飞速发展，深度学习已成为医学影像分析领域最具潜力的工具之一。本文综述了深度学习在医学影像分类、分割、检测和配准等任务中的最新进展，并探讨了面临的挑战与未来方向。


    # ## 1. 引言


    医学影像是现代临床诊断的核心依据。传统的人工阅片方式不仅耗时费力，而且诊断结果易受医生经验与主观因素的影响。深度学习技术的引入，为医学影像的自动化和智能化分析带来了革命性的突破。


    # ## 2. 深度学习方法概述


    深度学习通过多层神经网络自动学习数据的层次化特征表示。在医学影像分析中，常用的深度学习架构包括：


    +   - **卷积神经网络（CNN）**：擅长提取空间特征，广泛用于图像分类与分割。

    +   - **循环神经网络（RNN）**：适合处理序列数据，常用于时序影像分析。

    +   - **U-Net及其变体**：编码器-解码器结构，在医学图像分割中表现卓越。

    +   - **Transformer**：基于自注意力机制，在多项医学影像任务中已达到最先进水平。


    # ## 3. 主要应用场景


    表1总结了深度学习在不同医学影像任务中的典型应用：


    | 任务 | 典型应用 | 常用架构 | 代表数据集 |

    |------|----------|----------|------------|

    | 图像分类 | 肺炎检测、皮肤病变分类 | ResNet、EfficientNet | ChestX-ray14、ISIC |

    | 图像分割 | 肿瘤分割、器官勾画 | U-Net、DeepLabv3 | BraTS、LiTS |

    | 目标检测 | 肺结节检测、细胞检测 | Faster R-CNN、YOLO | LUNA16、BBBC005 |

    | 图像配准 | 多模态配准、运动校正 | VoxelMorph、TransMorph | Learn2Reg |'
  - '[PAGE 122]


    # ## PREPARING YOURSELF


    Read trade publications and journals to keep informed about new platforms and
    game ideas. This can give you a head start brainstorming and creating content
    for what is to come. To create a video game independently you will need to stay
    focused on all aspects of game creation. In addition to the skills it takes to
    make and develop a game, you may want to take some business courses to help you
    through the process of funding and marketing your work.


    # ## FUTURE PROSPECTS


    The US Bureau of Labor Statistics does not collect data about video game entrepreneurs,
    but has done studies about the work of established entrepreneurs in general. They
    have found that many get their start with entrepreneurship as a second job. Some
    independent business ventures are successful, and some are not. The more prepared
    you are before taking financial risks, the better you will be in your business
    endeavors and future prospects. The area of independent game development is a
    growing field and will likely continue that way for many years.'
