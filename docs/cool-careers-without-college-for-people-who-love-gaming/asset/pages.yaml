  md: '# **CHAPTER 2**


    # # GET YOUR GAME ON


    Professional gaming, or eSports, is fast becoming a full-fledged competitive spectator
    sport in its own right. ESport events also have live video game competitions with
    fans that fill large stadiums, just like traditional physical sports. ESports
    revenue for 2015 in North America was $134 million.


    Established video games like *League of Legends* and *DotA 2* (“DotA” stands for
    *Defense of the Ancients*) have large fan bases that often watch and sometimes
    participate in live tournaments. A 2015 *League of Legends* regional championship
    match at Madison Square Garden in New York City had eleven thousand fans in attendance.
    In 2015, more than 134 million viewers watched eSports around the world. DotA


    ![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_25_0.png)'
  merge: -1
  img_proc: true
- pgno: 26
  md: '![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_26_0.png)


    Members of the competitive gaming team, Newbee, pose on the stage of the International
    DOTA 2 Championships in Seattle Washington in 2014. These events draw huge crowds
    to the audience as the games are shown in real time'
  merge: -1
  img_proc: true
- pgno: 27
  md: '2 holds an annual eSports championship tournament called The International.
    In 2015, The International was held in the KeyArena Center in Seattle, Washington.
    The prize pool was over $18 million, the biggest prize pool in eSports history
    at the time. The winning team, Evil Geniuses, won $6,634,660, and each player
    in the team received over $1.3 million.


    In 2013, the United States government recognized international video game players
    travelling to the United States to compete in a *League of Legends* tournament
    as professional athletes for the very first time. This made it easier for special
    visas to be issued to players visiting the United States for professional play.
    According to a *GameSpot* magazine interview with Nick Allen, a Riot Games eSports
    manager, “This is groundbreaking for eSports; now we can start looking at international
    players when they come over. It’s a much easier process because they’re actually
    recognized by the government.” eSports is now a big business with many opportunities
    to find work.


    Some of the skills needed to make eSports a career include:


    +   - Exceptional gaming skills

    +   - Good communication skills with teammates

    +   - Attention to detail when signing up for competitions

    +   - Professional behavior at competitive events

    +   - Professional behavior with sponsors or potential sponsors'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# GAME TESTING


    Before companies can release video games for sale, they need to be thoroughly
    tested for bugs and glitches so that they work correctly upon release. The age
    range of game testers starts with very young children who test kids and youth
    games and goes all the way up to people getting paid for a living to test games.
    Younger testers often get their name listed in the credits of the game.


    Game testing is not just for video games, either. In 2012, the gaming company
    Wizards of the Coast released an early beta version of the current fifth iteration
    of the classic role-playing game *Dungeons & Dragons* to the general public for
    play testing. Local *Dungeons & Dragons* gaming groups were able to test play
    and provide feedback directly to Wizards of the Coast to help shape the fifth
    edition of *Dungeons & Dragons*. The fifth edition starter set was released for
    sale on July 15, 2014. Even if you only volunteer to test play a game, this valuable
    experience can still be listed on a résumé when applying for a professional game
    testing job.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# MAKING MONEY


    Making money as a professional gamer is not easy, but it can be done, and it does
    not require a college education. You need to be a fantastic gamer, and not just
    at any game, either. Some of the more popular games for professional play are:
    *League of Legends*, *Counter-Strike: Global Offensive*, *DotA 2*, *Hearthstone*,
    *Smite*, *World of Warcraft*, *Heroes of the Storm*, and *Super Smash Bros.* Getting
    great at one of these games will be a must if you are going to pursue professional
    gaming as a career. Although many people may say it is a long shot, there are
    people already doing this for a living. The attention the growing popularity is
    giving the emerging entertainment is only getting bigger. The most successful
    professionals can make six figure incomes from their winnings alone, not including
    salaries from teams or sponsors.


    ![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_29_0.png)'
  merge: -1
  img_proc: true
- pgno: 30
  md: '![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_30_0.png)


    Members of a professional gaming team must play and work well together to succeed
    in eSports.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_31_0.png)


    Professional gamers often have knowledge of how computers work. This comes in
    handy when customizing and upgrading for speed in competition. Gamers may have
    a hand in or even build from scratch their ideal computer system to support rapid
    gameplay and multiple complex features.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_32_0.png)


    Pro gamers are paid to be on teams, and often get paid by sponsors to endorse
    products or gaming companies, which adds to their incomes. Professional gamers
    can also compete alone or on small teams for prize pool money.


    # GAMING COMPUTERS


    If you want to be a professional gamer, or even just play competitive gaming online,
    you will need a good gaming computer, as well as a high speed internet connection.
    Games played by professional gamers are not typically played on home gaming consoles
    such as the Xbox or Playstation. Many competitive video games are available to
    buy or as digital downloads for Microsoft Windows, and for Apple Mac OS X and
    SteamOS, Linux-based PC computers. Some companies manufacture computers specifically
    for avid gamers. These are called gaming computers, or gaming rigs, and have very
    fast CPUs (central processing units) and GPUs (graphics processing units) or video
    cards that will help run the games very efficiently.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# PROFESSIONAL COSPLAY


    Cosplay (costumed play) is a unique phenomenon in which people dress up as their
    favorite science fiction, fantasy, or manga characters. Cosplayers can typically
    be found at comic, science fiction, and gaming conventions. Most people who engage
    in cosplay typically dress up just for fun. Some people, though, have managed
    to make a living dressing up as costumed characters. Some have even earned a considerable
    amount of money by dressing up and turning a hobby into a profession.


    Many professional cosplayers sew and create their own costumes and props from
    scratch. Some of the fanciest custom costumes are worn by professionals who get
    paid for convention appearances, game promotion, photo shoots, and modeling work.
    Selling signed prints at conventions or online is another way to make money at
    cosplay. Engaging in many social media outlets like Twitter and Instagram helps
    to get some cosplayers thousands of loyal fans.


    *These professional cosplayers are performing the Legend of Zelda during the World
    Cosplay Summit at the Tokyo International Film Festival in 2014. Many fans become
    involved with cosplay as a way to get involved and show their passion for a franchise
    while attending conventions and other gaming events.*


    ![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_33_0.png)'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'Many professional gamers customize their own computers by buying and assembling
    the various components, such as a motherboard, graphics cards, cooling fans, hard
    drives, and RAM chips. Computers customized by gamers are typically designed for
    performance and require the newest components as they become available. Having
    a fast computer is important for competitive game play.


    ![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_34_0.png)'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# ## PREPARING YOURSELF


    Don''t quit your day job yet. Pro gaming is for someone who loves to play competitively
    and is excellent at a popular established eSports game. It''s important to remember
    that the competition is fierce and even if you are great, there''s still no promise
    of money or income. People interested in this field can get involved in their
    spare time while still earning money from more traditional sources. Download and
    play popular eSports games to improve your skills over time.


    In addition to watching live professional games, the growing industry can also
    be watched online through Major League Gaming (MLG). Being a sportscaster or writer
    for eSports websites and online broadcast networks are other areas to consider
    if you love professional gaming but are not quite good enough to make money through
    competition.


    # ## FUTURE PROSPECTS


    The industry of eSports is still in its infancy. The growth prospects in this
    field are above average. Even if you cannot enter the eSports field as a professional
    player, there are other related positions, such as managerial and organizational
    professionals.'
  merge: -1
  img_proc: true
