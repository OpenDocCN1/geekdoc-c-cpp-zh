- pgno: 60
  md: '![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_60_0.png)


    To hone your artistic skills, practice drawing, sketching, and painting regularly.
    Even if your interest is in digital work, a good command of life drawing, observational
    drawing, and a familiarity with a variety of styles are all useful skills for
    a game design artist.'
