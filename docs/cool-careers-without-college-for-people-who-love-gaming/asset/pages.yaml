- pgno: 49
  md: '# PREPARING YOURSELF


    Preparing to write for the gaming industry requires a lot of reading and game
    playing. Keep up on gaming magazines, and read reviews and industry news. Take
    writing and journalism courses at school. Check online gaming communities for
    people looking for help in creating a home-brewed game. It will help you get credit
    and experience for your résumé.


    # FUTURE PROSPECTS


    The US Bureau of Labor Statistics does not collect data on the video game industry
    or board game industry. However, the organization suggests that workers in this
    field earn more than the median annual income in the United States.


    As the gaming industry grows, so will the need for support publications such as
    periodicals, books, stand alone novels, and game guides. Writing is a growing
    field in the gaming industry. In addition to writing game narratives, consider
    journalism and blogging as possible jobs in the gaming industry. Instruction manuals
    and game guides that help gamers play through games are also other areas writers
    can get jobs in the gaming industry.'
  merge: -1
  img_proc: true
- pgno: 50
