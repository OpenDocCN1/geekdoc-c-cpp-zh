  md: '![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_18_0.png)


    also has experience with the latest technologies. Many customers who shop in larger
    chain stores need help finding what they need. A strong knowledge of the various
    gaming systems can land you a job in the gaming department, where you can answer
    questions and gain experience.


    A few years working in retail while studying at home and building skills directly
    related to a specific aspect of the gaming industry like programming or game design
    is a great way to make money and stay current on all aspects of what is being
    created and sold in the industry while you move toward a greater goal.


    # ## WORKING AT A CORPORATION


    In addition to selling to the public, there are also sales'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'positions available in large game companies where games are sold to distributors
    and retailers. Game companies also have many administrative positions that include
    duties such as:


    +   - Arranging product launches

    +   - Distributing promotional material

    +   - Facilitating customer service with stores as well as consumers

    +   - Organizing conventions and other industry events


    Sales jobs at these companies are often entry-level positions, with no prior experience
    necessary. And if you have already worked at a small gaming store your experience
    might help you get a better sales position that does require some prior experience.


    These various jobs will provide a steady stream of income as you explore other
    gaming interests and hone your skills as a writer, artist, musician, programmer,
    or entrepreneur for future work in the game industry.


    # ## PREPARING YOURSELF


    High school students can begin a sales career working at local stores and interacting
    with the public and store managers to gain sales experience. Some companies may
    not hire you until you are eighteen. If you want a part-time job before'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# # TECH SUPPORT AND

    CUSTOMER SUPPORT


    Video game companies offer online and telephone support to users who need help
    with their consoles and video games. Someone who is very knowledgeable about video
    games can do well in this field. These positions often require a minimum of a
    high school diploma as well as some level of familiarity with basic programs such
    as Windows operating systems and Microsoft Word.


    If you have already worked in retail, your experience communicating with customers
    can be looked on as a valuable skill. Familiarity with current games and gaming
    systems, and their inner menus, settings, and technical details, will all come
    in handy when applying for a job like this. Search online for jobs in gaming technical
    support to see what is available.


    you are eighteen, an internship is something to consider. An internship is a program,
    often related to a school course, in which you work at a company. Many internships
    offer school credit but little or no pay. They offer valuable experience in the
    industry you aspire to work in. Check local gaming companies to see if they have
    internship programs'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'available and what is required. Your school guidance department may also be
    able to connect you with internship opportunities or the possibility of getting
    school credit.


    Staying current on video and board games will help you understand the merchandise
    and industry. For many gamers, there is a spot between a casual consumer and working
    professional where you can be more involved than the average at-home gamer while
    still not being employed in the industry. Playing in industry-sanctioned weekly
    gaming groups at local gaming stores or larger convention tournaments are both
    good ways to keep current and involved, even if you have not gotten into the industry
    yet.


    # FUTURE PROSPECTS


    With the increase in online download sales for digital content, careers in retail
    video gaming sales at brick and mortar stores may experience slower growth than
    in the past. People increasingly tend to buy their games online as digital downloads.
    Career growth at video game companies may be more promising because of the overall
    growth of the industry in general. Traditional board games and role-playing games
    (RPGs) are still mostly sold in boxes and as physical books, so retail jobs selling
    these games will not be going away any time soon.'
  merge: -1
  img_proc: true
