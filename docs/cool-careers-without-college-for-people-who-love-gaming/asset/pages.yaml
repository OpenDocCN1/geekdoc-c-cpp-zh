- pgno: 45
  md: '# WRITING FOR THE HOBBY GAME INDUSTRY


    If you are interested in writing for traditional hobby games such as role-playing
    and board games, you will need to stay focused on your writing and storytelling
    skills. The way traditional tabletop games are played is often just as important
    as the story or adventure being told while the game unfolds. In many games, players
    create their own imaginary characters using specific game rules before the game
    can start. Popular board games like *Star Wars Imperial Assault* or the card game
    *Magic the Gathering* require many game pieces, art elements, and graphically-designed
    elements. It may help to get the assistance of an artistic friend in visualizing
    the art aspects while you write the story elements.


    A few popular role-playing games are *Dungeons & Dragons*, *Pathfinder*, *Star
    Wars*, and *Call of Cthulhu*. You may want to write new adventures for an existing
    game, or you can make up a new game setting that is entirely your own. Originality
    can help showcase your creative writing skills. Getting friends and family to
    test play a game you created is a great way to see your hard work in action and
    can help you refine your writing going forward.'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'role-playing board games or only console video games, then you should be playing
    those types of games regularly so you are familiar with what you want to write.


    Games are fluid, and, unlike a film or novel that operates according to typical
    linear storytelling with no choices for the viewer, games often have many choices
    and possible outcomes a player can make. A game writer needs to be able to write
    out all the varied possibilities that the player might experience. Playing an
    existing game several times and exploring the various choices is a great way to
    see how the writers of a game helped to construct the story. Each outcome must
    be conceptualized in advance and make sense within the construct of the entire
    game and its mechanics.


    # NETWORK WITH WRITER GROUPS


    Spending time with other writers can be a good way to get feedback on what you
    are working on, whether it’s an article, game review, or even a game framework.
    Although writing is a solitary craft, sharing your work with others can be helpful
    and allow you to see your work in a critical light, which can help you to improve
    your writing overall. Even if you do not know other writers in the gaming field,
    spending time with other writers you know will keep you thinking about your craft.
    Share your work with gamers so they can give feedback'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'as well. A player’s opinion can be just as valuable as another writer’s opinion.
    Getting other people’s opinions can help you to find flaws in your story. It can
    also help you realize things you may have overlooked or that others find confusing.


    # COLLABORATE


    Writing a novel or article tends to be a solo creative endeavor. Video game writers
    usually work with a team. Even if you are the only writer on a small team there
    will still likely be a game designer and an artist. Communication and collaboration
    with other team members is essential for creating a cohesive video game that plays
    well and makes sense. Even if you are writing a traditional board game or role-playing
    game, there will likely be other writers working with you, and you will need to
    be able to work well with others, share ideas, and easily take criticism. Many
    existing role-playing games have rules that will need to be adhered to. The end
    result of the game is what is important, and keeping an open mind and listening
    to other ideas, even from team members who are not writers, can be very important
    in the writing process.


    > Sharing your ideas within your gaming group is a great springboard for getting
    feedback for your ideas. Making games is a collaborative process, whether it is
    a digital game or a more traditional card or board game.'
  merge: -1
