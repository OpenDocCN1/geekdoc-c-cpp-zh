- pgno: 96
  md: '+   - Programmer

    +   - System designer

    +   - World designer

    +   - Interface designer


    Game designers can specialize in specific areas of game creation. Someone with
    a wide variety of gaming skills would do well as a game designer. In addition
    to the technical skills, a game designer must be able to see the overall big picture
    of the game creation process.


    While programmers write detailed code, a game designer would have a general understanding
    of coding and be able to code to some extent. This would make the game designer
    a more effective communicator about how the game should be taking shape. Game
    designers direct the programmer and other team members. They communicate how to
    make adjustments, give creative criticisms, and handle schedules and deadlines.
    This means a game designer might also know how to design or draw. Seeing the big
    picture and knowing how to execute the project is the job of the game designer.'
