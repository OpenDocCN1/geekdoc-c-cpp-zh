- pgno: 83
  md: 'Game programmers must write all of the activity that occurs during game play—from
    player input to nonplayer elements. Even the graphic images and 3-D elements that
    were created by graphic designers and artists must be controlled by a programmer’s
    game code before the video game can function.


    # GAMING CODE LANGUAGES


    In order to become a programmer, you will need to familiarize yourself with the
    various computer programming languages used to create video games. The most common
    in the industry today are JavaScript, Java (for Android/Google), C++ for PC and
    console games, and Objective-C (for iOS/Apple).


    Learning a computer programming language may seem like an impossible task, but
    there are many online resources to help anyone, even children, learn to code.
    Some resources even allow you to create your own video game to run on your home
    computer.


    Rather than starting off trying to tackle a big ambitious gaming project, it’s
    best to


