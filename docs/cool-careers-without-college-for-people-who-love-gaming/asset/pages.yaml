- pgno: 9
  md: '# # INTRODUCTION


    Video games are interactive, story-based scenarios or puzzles in which players
    manipulate dynamic action on a computer monitor or a television screen. From its
    early popularity back in the 1970s with coin arcade games like Pac-Man, to the
    contemporary high-definition immersive home console games like *Destiny*, *Fallout
    4*, and *Star Wars Battlefront*, the video game industry has seen a lot of change
    and considerable growth.


    Today three gaming systems dominate the home console market: the Sony Playstation
    4, Microsoft Xbox One, and the Nintendo Wii U. Overall revenue in the video game
    industry for 2015 was over $91 billion and will continue to grow. In 2015, mobile
    games used on smart phones and computer tablets overtook game sales on console-based
    game sales.


    ![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_9_0.png)'
  merge: -1
  img_proc: true
- pgno: 10
  md: '![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_10_0.png)


    The video game industry has become popular around the world, with many large expos
    and conferences for professionals and enthusiasts. There, industry professionals
    mingle with amateur players and competitive esport stars, as well as meet the
    creators, designers, and actors who make games compelling.'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'Alongside the video game industry is the traditional hobby gaming industry.
    This includes board games, collectible games, card and dice games, collectible
    miniatures, and roleplaying games. Retail sales for traditional hobby gaming rose
    to $880 million as of 2014. Playing games both video and traditional are extremely
    popular pastimes globally.


    Interactive video games and traditional hobby gaming are certainly fun entertainment
    for people of all ages, but they are also a very big business that continues to
    grow and evolve year after year. If you already love gaming, then a career somewhere
    in the gaming industry might be what you are interested in pursuing. But what
    is the next logical step? How can a person who loves games find their way into
    an increasingly multifaceted, complex, and technical industry? And as college
    tuition continues to rise, is it possible to find a job in the gaming industry
    without a college education?


    America’s student-loan debt now grows $2,726 every second, totaling over $1 trillion
    in 2016. Two-thirds of college and university students graduating today will carry
    some amount of student debt. The federal debt is almost at $17 trillion and student
    loans account for 6 percent of that. Seventeen percent of borrowers are behind
    on their student loan payments, and only 27 percent of college graduates have
    a job related to their field of study in college.'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'Traditional college majors often do not provide the education needed to go
    into the gaming industry. With the rising cost of education and the daunting prospect
    of taking on heavy student loans, a college education is becoming out of reach
    for many students.


    All is not lost, however. Within the gaming industry, both traditional and video
    games, there are many career paths you can follow without having to go to college
    first. Programming, writing, art, design, music, voice acting, game design, gaming
    start-ups, and sales and marketing are just some of the areas you may be interested
    in related to gaming. Because entry-level positions after college may not lead
    you exactly where you want to be, you will need persistence, practice, grit, and
    determination to move forward; self-educate, and immerse yourself in the area
    of gaming you wish to have a career in. In the long run, hard work and persistence
    will pay off—and it can be done even without a college education. This book provides
    information about careers in different aspects of the gaming industry, with helpful
    resources for learning more about each.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# CHAPTER 1


    # REACHING THE GAMING

    CUSTOMER


    If you are reading this resource, odds are that you are already a gamer—video
    or traditional—and you likely also have a desire to move into some creative or
    entrepreneurial aspect of the gaming industry. Perhaps you’re thinking of doing
    it without a college education. While many of the more glamorous gaming jobs—such
    as programmer, designer, and artist—are accessible, the fastest and easiest way
    to get yourself through the door and start earning money in the gaming industry
    is in retail.


    # WORKING AT A STORE


    Big gaming companies as well as retail outlets like GameStop require sales


    ![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_13_0.png)'
  merge: -1
  img_proc: true
- pgno: 14
  md: '![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_14_0.png)


    The most accessible place for a gamer to work is at a video game retailer. This
    can help keep you up to date on the latest games and trends. It also allows game
    enthusiasts to interface with gamers and industry professionals in a new way,
    outside of playing the games.'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'people, store clerks, and managers to help sell games to consumers. Anywhere
    games are sold, even used games, can be a great place to start getting experience.
    No college degree is required. In fact, some stores may even hire you before you
    are eighteen years old. Be sure to check your local stores before applying.


    Video game stores, toy stores, bookstores, and electronics stores all sell video
    and traditional games. If you are already knowledgeable about games, this can
    help you land a job in a store. Many entry-level positions are available for selling
    games to the public. Advancing your career can come of the following responsibilities:


    +   - Handling store promotions

    +   - Setting up advertising displays

    +   - Becoming a store manager

    +   - Helping to open a new store


    Working in gaming retail will allow you to communicate with gamers, get exposure
    to game companies, and handle game promotions, contests, and new product launches.
    All are valuable assets that provide experience that looks good on a résumé, even
    if your ultimate goal is not in sales, but another aspect of game creation.


    You could also consider another closely related retail job. For example, a mobile
    phone company, computer retail store, or electronics store will hire someone who
    loves games and'
  merge: -1
  img_proc: true
- pgno: 16
  md: '![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_16_0.png)


    Working directly for a gaming company can provide opportunities to test and demonstrate
    new products before they are released to the public. For example, this is a tester
    of a virtual reality (VR) headset. These are becoming more prevalent in the marketplace.'
  merge: -1
  img_proc: true
