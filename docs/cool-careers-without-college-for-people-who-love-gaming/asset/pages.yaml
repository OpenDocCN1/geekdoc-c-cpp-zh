- pgno: 126
  md: '# CHAPTER 10


    # MAKE YOUR HOBBY GAME A REALITY


    Hobby games and family entertainment games have been a big business for generations.
    An entrepreneur can make a lot of money developing the next big game that people
    will want to play. Game companies such as Hasbro, Fantasy Flight Games, Paizo
    Inc., and Wizkids produce millions of dollars’ worth of games each year. Sales
    from toy stores such as Toys “R” Us are in the billions. In 2014 alone, US sales
    revenues at Toys “R” Us reached $12.4 billion. A lot of this revenue comes from
    the sales of traditional board games, card games, and role-playing games.


    Many people have good ideas for games, but bringing those ideas to life as a successful
    entrepreneur is another matter entirely. One of the most difficult challenges
    that young entrepreneurs face is coming up with the money to produce and distribute
    their game.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_127_0.png)


    Traditional board and hobby games are also a large part of the gaming industry.
    Before video games, card and board games were major ways in which the public engaged
    in competitive and shared gameplay. Some board games have ancient origins, and
    others are dependent on popular culture or clever mechanisms for engaging gameplay.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_128_0.png)


    # HAVING WHAT IT TAKES


    Before you produce your game, you will need to take part in the following activities
    to be successful in your endeavor:


    +   - Write a business plan that explains how many units you will produce, how
    much each will cost to make, and how much you will charge.

    +   - Make a plan for distributing your goods locally, nationally, or globally.

    +   - Create a plan to promote your product.

    +   - Research funding your project, such as crowdsourcing or financial backers.

    +   - Track all funds associated with the costs and profits of the business.

    +   - Seek accounting help for the tax side of the business.


    Entrepreneurs must be ready to deal with unexpected problems with the business,
    so a good attitude and a personable outlook will go a long way when dealing with
    customers, financial backers, or business partners.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '![](img/56b605d2cfd2b84d48a67bd3fe4d26ee_129_0.png)


    Crowdsourcing is a great way to raise funds to help make your video game a reality.
    Many projects that have trouble seeking traditional investors take their funding
    into their own hands, bringing a crowdfunding campaign straight to the consumers
    who would be interested. The campaigns provide rewards and special discounts to
    those who buy into the project early to help secure funding.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# CROWDSOURCING


    Crowdsourcing is a popular way for independent game creators to obtain funding
    for a game project from a large group of people. People funding a crowdsourced
    project will often be compensated by being given the finished product when the
    project is complete. With this method, the financial backers can support a project
    they approve of or identify with, and the creator gets the money he or she needs
    to make a product.


    The most popular crowdsourcing website is Kickstarter.com. One game created through
    crowdsourcing is the card game *Exploding Kittens*, which raised $8,782,571 on
    Kickstarter and became one of the most funded game campaigns of all time.


    Be sure to check out other crowdsourcing websites such as indiegogo.com, crowdfunder.com,
    and rockethub.com, and follow the guidelines for creating crowd-sourced game projects
    for each site.


    When getting funding for personal gaming projects proves too difficult, there
    are other options. For instance, board games and books for role-playing games
    need to be printed out, and this can be costly. To save on production costs and
    keep the selling price of your traditional game low, you can create a digital-only
    traditional board, card, or'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# # THE INFLUENCE OF DUNGEONS AND DRAGONS


    The most famous traditional indie game of all time, *Dungeons & Dragons*, is also
    known as D&D. Gary Gygax and Dave Arneson formed the company Tactical Studies
    Rules (TSR) in 1973 and first released their adventure game *Dungeons & Dragons*
    in 1974. The first D&D print run was just one thousand box sets that contained
    three game guides.


    In the game, players create fictional characters on paper sheets and a single
    player, the Dungeon Master, (DM) describes the story adventure as well as the
    many characters, monsters, and environments the players encounter.


    *Dungeons & Dragons* quickly became very popular and by 1981, TSR had revenues
    of $12.9 million. In 1997, the gaming company Wizards of the Coast purchased TSR
    for $25 million. The success of *Dungeons & Dragons* continued, and in 1999 the
    toy company Hasbro purchased Wizards of the Coast for $325 million.


    The popularity of D&D went on to have a huge impact on video games and role-playing
    games alike. Video games from *Pokémon* to *Diablo* have all been influenced by
    Gygax and Arneson''s home-brewed pen and paper game. Today D&D is in its fifth
    iteration.'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'RPG game. Then you can sell the digital files and have the gamer print out
    the game elements at home. Keep an open mind, stay creative, and do not get discouraged!


    # PREPARING YOURSELF


    Being an entrepreneur of any kind starts with having a great idea that you think
    people will be interested in. Research traditional games and read periodicals
    about traditional games. These are great sources of inspiration. Also attend gaming
    conventions such as Gen Con. This annual gaming convention is a great place for
    game makers and game buyers to meet up, exchange ideas, and make some business
    deals.


    # FUTURE PROSPECTS


    The future for any entrepreneur can be bright. Depending on your particular idea
    or project, the sky''s the limit for what you can earn and the ideas you can develop.
    The more patience and determination you have, the greater your chances of success.
    This is not an endeavor, however, for someone who likes to play it safe and collect
    a steady paycheck.'
  merge: -1
  img_proc: true
