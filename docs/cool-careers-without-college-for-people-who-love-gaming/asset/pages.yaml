- pgno: 41
  md: 'even someone who works in another aspect of the video game industry. If you
    are interested in writing articles or reviews, just give it a shot by pitching
    editors at your favorite gaming publication. The more experience you get, the
    better your chances of being published become. Different companies have different
    rules about submitting work. Quarterly and online magazines often accept submissions.
    Be sure to research submission guidelines before sending in writing to a company
    for consideration. Keep a résumé of articles you have written, even if they have
    not been published. Over time, your efforts may pay off.


    # ## VIDEO GAME WRITING


    Game writers have a complex job. They should have incredibly active imaginations
    to help conceptualize original game stories and adventures. No idea for a game
    should be ignored. Keep a journal of any idea that comes into your head. Some
    of the tasks done by a person who writes video game or board game stories include:


    +   - Research the competition to know what other games exist in the field.

    +   - Communicate with game designers and programmers to make sure the story concepts
    are able to be realistically carried out.'
