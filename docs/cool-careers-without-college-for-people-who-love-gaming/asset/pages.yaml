    video game companies such as Atari and Activision still use logos similar to their
    original, so consumers can quickly recognize and identify them.


    One example of a simple graphic gaming company logo today is Rockstar, which simply
    shows an “R” and a star. Another is LucasArts, which shows a person with a head
    as the iris of an eye. When consumers see these logos they are visually reminded
    of the company’s reputation and previous products.


