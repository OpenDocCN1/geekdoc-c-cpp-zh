- pgno: 39
  md: '# ### CHAPTER 3


    # # WRITING THE FUTURE OF GAMES


    A good foundation of any narrative is a well-written story. Having a good story
    for your game will make it more compelling for the player. Writing careers in
    the gaming industry can be as varied as the many games and platforms that exist.
    Writing games is just one job that a writer can have in the gaming field. A good
    writer can get involved in journalism and blogging related to the gaming field.
    Writers are also needed for game guides, game instructions, and “art of” books,
    as well as any text that accompanies any book produced for the gaming industry.


    Full-time writing jobs at companies will be advertised online or handled through
    recruiting companies. However, many writers submit articles to magazines and websites
    on a freelance basis. This can be done by anyone,


