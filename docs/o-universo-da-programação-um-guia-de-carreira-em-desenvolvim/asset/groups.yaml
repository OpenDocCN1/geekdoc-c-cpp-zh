  mdcn: '

    使用更简洁的语法编写代码，在日常工作中提供了更高的生产力，并减少了代码编写者的工作量。


    例如，我们有 Ruby 语言的案例，根据其创造者的说法，它的创建是为了让工作变得有趣且流畅。Python 也是一个有趣语言的例子，它拥有一种哲学，即代码应该对所有人都易读。


    如果我们回顾历史背景，会发现人们使用 C 语言或 Perl 语言开发网页页面，但随后 PHP 语言简化了这一过程，开发者们便迁移到了它。之后，其他语言出现了，或者在
    PHP 获得声誉的同时，其他语言也开始在市场上出现，它们具有相同的主张：改进我们编写软件的方式，或者改进我们软件的运行方式。这就是为什么存在多种语言和许多不同的方法来完成同一件事，即开发软件。


    编程语言的选择应该基于：


    -   我们的个人目标；

    -   我们的职业目标。


    我们是需要学习这门语言来开始工作，还是仅仅为了出于爱好或好奇心而想学习一门语言编程？


    如果我们想或有时间用一种更简单的语言学习编程，然后转向我们工作中要使用的语言，或者只是出于好奇心想学习编程，我是 JavaScript 语言的极大鼓励者。


    由于其易于学习性、互联网上丰富的材料、极其活跃的社区、数千家公司对该技术的投资，以及与市场上大多数编程语言的相似性（了解了 JavaScript，之后学习其他语言会更简单）。而且，我们可以在手头用任何浏览器和文本编辑器来学习它；这些都是我们计算机中标准拥有的简单工具。


    对于这种情况，我分析了一些侧重于编程学习以及整体工作的要点。决策是基于我们将开始工作的语言做出的，因此毫无疑问，我们需要从我们选择的平台上运行的技术开始，无论是
    Web、移动端、数据、游戏等，以缩短从学习到第一份工作的路程。


    即使我们已经确定了平台，对于同一个目标我们也会找到多个选项，因此我们应该利用市场智能来分析哪种语言在初阶段能带给我们工作。如果我们考虑到 Web 环境，在当前场景下将有很多
    Java、PHP、C#、JavaScript、Python 和 Ruby 语言的职位，而且并不是所有这些技术都在雇佣当地居民。我们应该搜索以了解哪种语言的空缺职位最多，并将其作为该语言的一个优点。


    市场智能就是利用我们的研究能力、数据范围和数据标准化来识别可能的机会、风险和需求。也就是说：尽可能地研究就业市场（如果是要在同一个城市/州工作，甚至是其他州），在手中掌握大量数据并将所有内容归类，以便我们拥有有助于做出决策的样本。我们手中的数据越多，就越能理解市场。我们能够知道公司真正在寻找什么，投入时间到某种特定技术中的风险，以及识别对新事物的可能投资机会。


    例如：如果我所在的城市最常用的语言是 Java，我学习 Rust 有意义吗？这取决于情况。取决于我是否想在我的城市工作，我是否想离开这个州，我是否想要一份远程工作，以及该技术是否显示出未来的增长潜力。


    另一个重要的因素，考虑到就业市场时，是我们想在哪里工作。我们目标进入的公司可能不使用 Ruby，例如，他们可能使用 Java，正如我们国家的大量公司一样。在这种情况下，短期学习
    Ruby 并不很有划算，最好学习 Java 并追求梦想中的工作。


    那么，取决于我们想要工作的领域，我们应该研究使用了哪些语言以及每种语言的优缺点，以帮助我们做出选择。让我们现在学习如何进行这项研究。


    ## 方便我们的决策


    为了方便决策，我们可以创建一个表格来帮助我们选择第一种语言，我们在初将列出：学习难度、互联网上可用材料的数量（免费或付费，取决于我们的财务状况）、活跃的社区和可用职位。为了找到这些数据，我们应该在互联网上对每个主题进行搜索。


    我们将使用 Web 开发的示例来说明如何填充此表格，因为这是目前我们选项最多的地方。这将有助于构建一个包含更多素材的表格，以便更好地理解这种研究方法。


    表格的初始状态如下：


    ### 清空表格


    | 语言 | 职位 | 难度 | 可用材料 |

    | :--- | :--- | :--- | :--- |


    我们可以开始搜索以填充表格，回答“用于 Web 开发的主要语言有哪些？”这个问题问题。然后我们获取这些语言并将它们放入列表。


    ### 主要 Web 语言


    | 语言 | 职位 | 难度 | 可用材料 |

    | :--- | :--- | :--- | :--- |

    | PHP | - | - | - |

    | Java | - | - | - |

    | Ruby | - | - | - |

    | Python | - | - | - |

