    # 编程世界


    软件开发职业指南


    ![](img/1980cd0900b9cb84feb62a3cc0d390f3_0_0.png)


    **Casa do Código**


    WILLIAM OLIVEIRA


    # 目录


    * ISBN

    * 献辞

    * 致谢

    * 关于作者

    * 前言

    * 引言

    * 1. 编程广阔宇宙的简介

    * 2. 为什么要投入编程

    * 3. 编写程序和发射火箭的人

    * 4. 选择一条道路

    * 5. 一个未解决问题的星系

    * 6. 编程世界的生存技能

    * 7. 在宇宙之外，人们需要我们的帮助

    * 8. 通过编程获得第一份工作

    * 9. 之后去向哪里

    * 10. 结语


    # ISBN


    印刷版和 PDF: 978-85-94188-90-8


    EPUB: 978-85-94188-91-5


    MOBI: 978-85-94188-92-2


    > 如果你想提交任何错误或建议，请访问 http://erratas.casadocodigo.com.br。


    # 献辞


    这本书献给我的母亲 Almerinda 和我的伴侣 Juliana。


    我的母亲是一位战士，她在一个极度财务困难的时期单身抚养了她的 4 个孩子。当时她已经因为是贫民窟居民、没受过教育且是女性而面临偏见，而由于她决定离婚、掌握自己生活并并且不再向我们这个男权社会中的任何人低头，情况变得更加糟糕。她从未在任何时候让我们感到孤立无援。这个女人是我生活的灵感源。


    Juliana 激励我学习，让我不要放弃从事编程工作的梦想，并直到今天让我保持在正轨上。如果没有她，我不会专注于学习，也不会从事我喜欢的工作。


    # 致谢


    特别感谢 Carlos Zamrana 和 Andréa Zamrana，在一次午餐聊天中，当我考虑停止在互联网上写作时，他们鼓励我继续分享关于职业和编程的知识。


    感谢 Vitor Mantovani，在我计划在这书中写什么主题时他为我理清了思路，鼓励我谈论职业。


    感谢 Paulo Silveira，感谢他通过 Caelum、Casa do Código、Alura 以及内部倡议对技术社区提供的所有支持，并帮助我找到了书的核心思想。


    感谢我的个人校对员：Fernanda Bernardo, Luiz Felipe Limeira, Mateus Malaquias 和 Leandro Bighetti。


    感谢 Wagner Alr 让我在科技公司 WL INFO（现 WL Solutions）获得了我的第一份技术工作；感谢 Humberto Oliveira
    让我我在 ResideWeb（现 Grupo Reside）获得了我的第一份程序员工作；感谢我在软件开发和金融领域的首位导师 Bruno Salgueiro。


    # 关于作者


    软件开发人员，从全栈开发开始职业生涯，使用 PHP 语言，当 JavaScript 在大规模应用中获得巨大职责时转向了前端，这让软件开发人员能够将 Web
    界面视为应用程序，而不仅仅是静态页面。


    热衷于开源、自由软件、开放知识、社区及相关领域，创立了 FEMUG-ABC（一个前端开发者聚会小组），参与了 ABCDev 活动的创立（这是位于大圣保罗州大
    ABC 地区的一个软件开发活动），并是 Training Center (http://trainingcenter.io) 的创始人，这是一个专注于帮助人们进入软件开发领域的包容性社区。


    作为一名来自巴西贫民窟的人，他非常理解少数群体的困难、他们所代表的群体，并寻求支持计算机编程领域的多样性和包容性。


    自 2014 年以来，他通过个人博客 woliveiras.com.br (https://woliveiveiras.com.br)、讲座、工作坊和参与社区来鼓励人们进入编程领域。他深信只有教育才能改变我们所处的社会，因此在互联网上分享思想和知识。


    # 前言


    当 William 邀请我为他的书写前言时，我感到非常激动。像我这样一个痴迷的读者知道，写前言是一项巨大的荣誉，特别是当作者还是你钦佩并视如兄弟的人时。


    在甚至还没意识到自己在做什么之前，我只是简单地接受了这个任务。我非常开心。我告诉了我的丈夫，他感到很自豪，评论了几分钟，然后我才意识到自己做了什么。显然，我陷入了恐慌。在我的脑海里回响着这样句话：“我到底做了什么？我没有能力写书的前言，写前言的人都是高素质的人才，他们知道自己在做什么，而你不行！”但我已经承诺了，所以我必须这样做。


    *(注：原文此处有重复段落，已按逻辑合并处理或保留结构)*


    祝阅读愉快！

    Andréa K. F. Zambrana


    '
