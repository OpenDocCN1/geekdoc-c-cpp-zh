    uma grande quantidade de usuários e ficar funcionamento por muitos anos. Mas quem
    está aprendendo, que acabou de começar a desenvolver ou quem só curiosidade com
    programação não precisa conseguir fazer isso desde o primeiro software escrito.


    Todo mundo passa pela fase inicial. Experiência é algo que se adquire com o tempo
    e prática, e não devemos desanimar achando que precisamos começar já sabendo de
    tudo.


    # 3.1 Quem são as pessoas que escrevem programas, onde vivem, de que se alimentam


    Descobriremos as respostas para essas perguntas neste capítulo!


    Energético, café, pizza, alimentos calóricos dentro do quarto, com a porta trancada
    para ninguém incomodar ou no escritório com o fone de ouvido para ninguém cutucar.
    Será que é essa a pessoa que tem o perfil para se tornar desenvolvedora de software?


    Como falei anteriormente, as pessoas que trabalham com programação são pessoas
    normais. Não possuem superpoderes, não se alimentam com uma dieta que lhes proporciona
    mais neurônios ou algo do tipo e muito vive somente de alimentos não saudáveis.
    Porém, existem algumas características pessoais que podem influenciar nossa vida
    rumo ao aprendizado e nós vamos fazer uma análise superficial sobre elas agora.
    Vale lembrar que toda característica citada aqui pode ser adquirida ou contornada
    com outra habilidade e/ou disposição pessoal.'
  - '[PAGE 51]


    Outro adendo importante: os pontos que vamos observar agora não são obrigatórios
    ou resultado de alguma pesquisa comportamental revolucionária, mas algo que acabamos
    observando em pessoas que trabalham com desenvolvimento ao nosso lado no dia a
    dia ou que encontramos em eventos da área. Portanto, é uma visão muito pessoal
    que estou transmitindo agora.


    # Curiosidade


    A curiosidade é uma característica bem comum em pessoas da nossa área. A maioria
    das pessoas se envolvem com programação pela vontade de entender como o computador
    e os softwares instalados nos sistemas operacionais funcionam.


    Isso pode ser útil para continuarmos sempre com vontade de entender algo novo,
    o que é outra característica importante de boas pessoas nessa área e que aprofundar
    mais à frente.


    No meu caso, eu desmont meus brinquedos, estragava eletrônicos e, posteriormente,
    quis entender como o computador e a internet funcionavam. Eu achava fantástico
    como diversos componentes eletrônicos eram conectados, se comunicavam e faziam
    a ponte entre eu e meus familiares de outra cidade através das redes sociais e
    comunicadores online.


    Caso você seja uma pessoa curiosa, que desde a infância desmontava coisas para
    entender elas funcionavam, programação pode ser uma boa área para você. Será um
    caminho "mais fácil". Mas, se você não sente tanta curiosidade assim, não tem
    problema. Com o tempo aprendemos como se manter em constante atualização profissional
    mesmo sem ter tanto interesse em algo.


    A curiosidade acaba sendo tornada pelo hábito de estudo constante. Quando lançam
    uma tecnologia nova, nós sabemos que teremos que estudá-la e por isso liberamos
    espaço na agenda, fazemos cursos, vemos palestras e coisas do tipo.'
  - '[PAGE 52]


    Esse aprendizado também pode vir por meio do convívio com pessoas da área. Portanto,
    se não temos essa característica, é legal começarmos a fazermos amizade com as
    pessoas que consideramos boas ou simplesmente as seguirmos nas redes sociais.


    # Gostar de aprender


    A nossa área é muito ampla e está sempre mudando, por isso é extremamente importante
    gostar de aprender. Todos os dias podem ser lançadas uma mais ferramentas novas
    que vão facilitar nosso trabalho, uma nova boa prática de programação ou uma outra
    convenção que vai facilitar a manutenção dos nossos softwares. O tempo todo precisamos
    de atualizar sobre o nosso universo.


    E quando gostar de aprender, não significa que devemos gostar de estar em uma
    sala de aula, ver videoulas ou mesmo ficar lendo horas de um livro técnico até
    decorar. Aprender pode ser mais orgânico na base da tentativa e erro. Isso depende
    do nosso perfil e de como aprendemos melhor.


    Se somos do tipo que gosta de cursos, escolas e relacionados, teremos espaço para
    aprender lá. Se não somos desse tipo, sem problema, a internet é um universo aberto
    e acessível cheio de conteúdo para aprendermos algo novo.


    Por isso, pessoas curiosas já têm uma habilidade auxiliar nessa área de atuação,
    pois elas estão sempre querendo aprender.


    # Gostar de resolver problemas


    Programação é resolver problemas utilizando o poder dos computadores, então nada
    mais justo que pessoas que gostem de programar problemas. Sejam problemas pessoais,
    problemas de economia, problemas de comunicação. Somos rodeados de problemas esperando
    para serem resolvidos por um software.'
  - '[PAGE 53]


    O que percebo é que a maioria das pessoas programadoras sentem uma vontade imensa
    de enfrentar um problema para encontrar uma boa solução para ele. Essa é uma característica
    importante no nosso meio, todos os dias temos problemas diferentes para resolver.


    Precisamos gostar de passar algumas horas imaginando como facilitar a vida das
    pessoas, como deixar um processo mais otimizado ou barato em uma indústria ou
    mesmo tirar dados de uma planilha e transformá-los em uma informação útil.


    Dessa característica não temos como fugir. O nosso dia a dia é cercado de bugs
    e novas funcionalidades solicitadas pela área de negócios da empresa ou por nossos
    clientes.


    # Gostar de tecnologia


    Seria difícil para alguém que não gosta de tecnologia (computadores, smartphones
    e aplicativos) gostar de programação, pois esse é nosso mundo. É o que nos move
    e é o que trabalhamos. Existe algo comum em pessoas desenvolvedoras deve ser o
    fato de elas quererem tecnologia para resolver tudo.


    Gostar de tecnologia não é o mesmo que ter um parente próximo que soube tudo sobre
    redes sociais ou estar antenado com o que está acontecendo nos blogs por aí. Isso
    é gostar de redes sociais de informação e é um risco pensar que alguém que domina
    o uso de algum programa, site ou aplicativo, possa vir a gostar de programar só
    por isso. Não nós vemos pessoas se tornando chef de cozinha só por comer spaghetti.


    Quem realmente gosta de tecnologia mais do que somente do que ela nos proporciona
    é aquela pessoa que quer entender como aquilo pode existir, como algo acontece
    por baixo dos panos, e, normalmente, vai ativar sua curiosidade e ir atrás de
    entender aquilo.'
  - '[PAGE 54]


    Alguém que domina o uso de um sistema operacional e quer sempre ir mais a fundo
    em como isso funciona pode tanto acabar na área de programação quanto vir a trabalhar
    com algo relacionado a sistemas operacionais, como eu no próximo capítulo, em
    que falo sobre as diferentes profissões da área de tecnologia.


    O mesmo se aplica para quem adora as redes sociais e outros sistemas que usamos
    no nosso dia a dia. A pessoa pode vir trabalhar com redes sociais, mas não diretamente
    relacionado com programação.


    Entretanto, citar estas características para nossa análise (curiosidade, vontade
    de aprender, gostar de resolver problemas e gostar de tecnologia) pode também
    ser uma forma de estereotipar ou de padronizar, mas não de limitar. Se você nunca
    tiver as características citadas aqui, mas tiver força de vontade, você vai aprender
    a programar, assim como qualquer outra pessoa.


    Essas características podem facilitar a nossa vida, mas nada pode nos impedir
    de aprender algo que realmente desejamos.


