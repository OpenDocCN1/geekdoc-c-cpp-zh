    nossa primeira linguagem onde vamos listar, inicialmente: dificuldade de aprendizagem,
    quantidade de material disponível na internet (gratuito ou pago, dependendo do
    nosso momento financeiro), comunidade ativa e vagas disponíveis. E, para encontrar
    esses dados, devemos pesquisar na internet sobre cada tópico.


