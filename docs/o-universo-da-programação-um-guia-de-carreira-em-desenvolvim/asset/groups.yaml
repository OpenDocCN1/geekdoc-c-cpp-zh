    # Porém, algo pode ter passado despercebido pela mídia, que é: **o que é, de fato,
    programação?**


    Sem os programas que o controlam, o computador não passa de uma máquina inanimada.
    Imaginemos nosso computador como um foguete. Programar é o ato de passar coordenadas
    para o foguete de como ele deverá se comportar para claro que você vá a milhares
    de lugares. De maneira bem simples, claro, isto é programação: escrever instruções
    para computadores executarem tarefas.


    Agora, imagine que ir de um planeta para outro no espaço seja um problema que
    uma pessoa precisa resolver. O ato de escrever instruções para o foguete seria
    o mesmo que resolver um problema, certo?


    > Programar é isso: resolver problemas por meio da escrita de instruções para
    um computador executar.


    Essas instruções podem ser escritas em uma linguagem de programação, que será
    compilada em linguagem de máquina e será, enfim, executada pelo nosso computador,
    smartphone, placa eletrônica etc.


