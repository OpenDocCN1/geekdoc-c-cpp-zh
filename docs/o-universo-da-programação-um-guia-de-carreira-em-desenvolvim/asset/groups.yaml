    \ diretamente para uma empresa como cliente fixo (conhecido como pessoa jurídica,\
    \ PJ), temos que emitir notas fiscais sobre o que fazemos e o que recebemos. Para\
    \ emitir as notas precisamos ter empresa aberta e conhecer as regras para emissão\
    \ da nossa localidade.\n\nAbrir uma empresa não será difícil, o trabalho maior\
    \ é procurar orientação na prefeitura local para saber sobre os encargos da nota\
    \ que vamos gerar. Podemos conseguir as orientações corretas para a nossa cidade\
    \ procurando pela Secretaria de Finanças na prefeitura ou no site da prefeitura\
    \ local.\n\nComo empreendedores individuais, podemos abrir o famoso MEI (Microempreendedor\
    \ Individual), que, em nosso país, podemos fazer direto pelo site do governo,\
    \ o Portal do Empreendedor (http://www.portaldoempreendedor.gov.br/).\n\nEu também\
    \ utilize os serviços de um contador quando preste serviços, para evitar qualquer\
    \ problema fiscal que eu poderia cair por falta de conhecimento, por isso recorri\
    \ aos serviços da Contabilizei (https://contabilizei.com.br/). Mas existem mais\
    \ contabilidades online ou físicas que podem facilitar a nossa vida. Um investimento\
    \ mínimo para não correr risco de errar e acabar tendo que pagar alguma multa\
    \ por isso.\n\n## 8.12 Conclusão\n\nDevemos criar uma boa imagem online, pensar\
    \ bem no nosso currículo, que é a nossa vitrine de marketing pessoal, criar currículos\
    \ com foco no que as pessoas de recrutamento realmente querem saber de nós e acreditar\
    \ que nós podemos e vamos conseguir nosso emprego na área que gostamos.\n\nO processo\
    \ até conseguir o primeiro emprego na área pode não ser nada fácil ou animador,\
    \ pois podemos/vamos receber vários não, mas isso é extremamente normal, acontece\
    \ com todo mundo e em cada processo podemos aprender mais e nos prepararmos para\
    \ o próximo.\n\nDe qualquer modo podemos contar com o apoio das comunidades e\
    \ dos amigos e amigas que trabalham na área, por isso devemos buscar ajuda sempre\
    \ que sentirmos medo ou tivermos dúvidas sobre um processo seletivo ou sobre o\
    \ que fizemos “de errado” para não passarmos na entrevista.\n\n## CAPÍTULO 9\n\
    Aonde ir depois daqui\n\nEste livro é basicamente sobre carreira em programação.\
    \ Nós aprendemos desde o que é um software, como os programas são criados, como\
    \ são desenvolvidos os sites e aplicativos de celular, quais as áreas em podemos\
    \ podemos até chegar como conseguir nosso primeiro emprego ou trabalhar como freelancer.\
    \ Mas não aprendemos, de fato, a programar, somente como praticar programação\
    \ e como criar um portfólio.\n\nAgora vem a parte mais legal de tudo isso que\
    \ é realmente buscar conhecimento e aprender a programar para usar todas as dicas\
    \ que recebemos neste livro.\n\nReforço que isso tudo não é obrigatório. Podemos\
    \ seguir nosso próprio caminho e buscar conhecimento em programação, praticar\
    \ e aprender sem necessariamente seguir este fluxo ou aproveitando todos os tópicos.\
    \ Tem alguns dos tópicos listados aqui em que eu só fui focar depois de algum\
    \ tempo trabalhando na área, como Design Patterns ou Testes de Software.\n\nDurante\
    \ nossos estudos temos alguns assuntos que são muito importantes, mas não são\
    \ muito divertidos. Precisamos conhecer a importância destes tópicos desde já\
    \ para não acabar deixando de lado pela sua \"complexidade\".\n\nPor isso vamos\
    \ conhecer quais são esses tópicos e por que eles são tão importantes no universo\
    \ da programação. Desde sua teoria até onde serão importantes.\n\n## 9.1 Algoritmos\
    \ e estruturas de dados\n\nNós aprendemos o que é um algoritmo. Sabemos que é\
    \ aquele fluxo de instruções (regras, receita) que criamos para resolver um problema,\
    \ mas realmente é tão importante aprender a criar algoritmos primeiro e não partir\
    \ direto para uma linguagem de programação?\n\nSim, eu considero muito importante.\
    \ Os algoritmos são a base de tudo ao nosso redor, e se não entendemos, estudamos\
    \ ou praticamos isso, criar programas será muito mais difícil. Nós acabarmos decorando\
    \ instruções das linguagens e como criar programas que vimos na internet, porém\
    \ não saberemos criar um programa do zero.\n\nExistem comandos nas linguagens\
    \ que fazem algumas rotinas que teríamos que criar algoritmos para tal. Como o\
    \ comando reduce , de JavaScript, funciona da seguinte maneira:\n\n```javascript\n\
    const nossoArray = [1, 2, 3, 4, 5]\n```\n\n```javascript\nconst valorTotal = nossoArray.reduce((acumulador,\
    \ itemAtual) => {\n  return acumulador + itemAtual\n}, 0)\n```\n\n```javascript\n\
    alert(valorTotal)\n```\n\nMas, nem tudo isso existe e algumas vezes precisamos\
    \ implementar/criar algo do zero. Se não existisse o reduce , teríamos que saber\
    \ criar um algoritmo para fazer o que ele faz, que seria algo como:\n\n```javascript\n\
    const nossoArray = [1, 2, 3, 4, 5]\nconst tamanhoDoArray = nossoArray.length\n\
    let valorTotal = 0\n\nfor (let i = 0; i < tamanhoDoArray; i++) {\n  valorTotal\
    \ = valorTotal + nossoArray[i]\n}\n\nalert(valorTotal)\n```\n\nAqui temos nossa\
    \ coleção de valores, em vez de usar reduce , usamos o comando for , de JavaScript\
    \ e outras linguagens de programação, para chegar ao mesmo resultado.\n\nUm comando\
    \ não existir em nossa linguagem de programação e ser necessário implementar essa\
    \ rotina do zero pode ser considerado o último motivo qual devemos aprender algoritmos.\
    \ É só um exemplo para que entendemos que precisamos aprender a pensar em algoritmos,\
    \ pensar em lógica de programação.\n\nAs estruturas de dados fazem parte deste\
    \ mesmo patamar de importância, pois sabendo isso conseguiremos um melhor desempenho\
    \ (velocidade) em nossos programas assim como facilitar a vida quando trabalhamos\
    \ com dados.\n\nEstruturas de dados são o modo como organizamos e armazenamos\
    \ os dados em nossos programas. Quando temos tudo bem organizado e disposto em\
    \ nossos algoritmos conseguimos acessar esses dados de uma maneira mais fácil,\
    \ assim como pesquisar por um registro importante em uma grande quantidade de\
    \ dados.\n\nO nosso array , em JavaScript, é um exemplo clássico de como podemos\
    \ usar estruturas de dados para organizar nosso código. Queremos representar diversos\
    \ valores em um programa precisamos criar um identificador para cada, por exemplo:\
    \ imaginemos que vamos ter, em nosso software, 4 notas de alunos da escola, podemos\
    \ fazer:\n"
  mdcn: "\n我们的工作，也请理解我们的立场。我们必须证明自己是专业人士，并且从合同签署的那一刻起，我们就对期限做出了承诺；这份合同，以及首付款，仅仅仅仅是双方的一种保障。\n\
    \n在任何情况下，我们都不能不签一份合同，最好是在公证处进行公证，并且在开始开发之前将所有事情都定义清楚。\n\n一种极其常见的做法是使用自由职业者平台服务来获取客户。我个人非常讨厌这些服务，因为它们实际上是对我们劳动力的一场廉价拍卖。我们给出价值\
    \ X（即我们的工作时薪），另一个人出价 X - 1，另一个人出价 X - 2，以此类推，直到客户与报价最低的人成交，而完全不在乎我们工作的质量。\n\n\
    如果客户愿意支付金额是我们收取的费用的 2 倍或 3 倍，这是一个好信号，说明这个客户未来不会给我们带来麻烦。我与这类客户的经历是：他们付得非常低，却要求\
    \ 5 星级的服务，并尽可能快地交付，而不在乎其他客户支付了更多来获得独家服务和更快的交付。\n\n有些服务与这些自由职业者拍卖网站的模式不同，平台会根据客户的需求为其推荐最合适的专业人士，例如\
    \ [Crowd](https://crowd.br.com/) 和 [Toptal](https://toptal.com/)。\n\n## 税务注意事项\n\
    \n作为服务提供者，无论是作为自由职业者还是直接为公司作为固定客户工作（即法人，PJ），我们必须根据所做的工作和收到的费用开具发票。为了开具发票，我们需要注册公司，并了解我们所在地区的开票规则。\n\
    \n开公司并不困难，主要工作是向当地市政府寻求指导，以了解我们开具的发票将涉及的税费。我们可以通过查询市政府的财务部门或访问当地市政府网站来获取我们所在城市的正确指导。\n\
    \n作为个人创业者，我们可以开设著名的 MEI（个人微型企业），在我们的国家，我们可以直接通过政府网站——创业门户网站 ([Portal do Empreendedor](http://www.portaldoempreendedor.gov.br/))来办理。\n\
    \n在提供服务时，我也利用了会计师的服务，以避免由于知识不足而可能陷入任何税务问题，因此我聘请了 [Contabilizei](https://contabilizei.com.br/)\
    \ 的服务。但还有其他在线或线下的会计公司可以方便我们的生活。这是一项极小的投资，以避免出错并最终不得不支付罚款的风险。\n\n## 8.12 结论\n\n\
    我们应该建立良好的在线形象，仔细考虑我们的简历（简历是我们的个人营销的橱窗），创建侧重于招聘人员真正想了解我们的信息的简历，并相信我们能够并且将在我们喜欢的领域获得工作。\n\
    \n获得该领域第一份工作的过程可能并不容易或令人兴奋，因为我们可能会/将会收到很多次“不”，但这是完全正常的现象，会发生在每个人身上，而且在每一个过程中我们都能学到更多，并为下一次做做好准备。\n\
    \n无论如何，我们都可以获得社区以及在相关领域工作的朋友们的支持，因此，当我们感到恐惧，或者对选拔过程产生疑问，或者对我们在某些方面做出的“错”导致没通过面试时，应该随时寻求帮助。\n\
    \n## 第 9 章\n此后去向何方\n\n这本书基本上是关于编程职业的。我们学习了什么是软件、程序是如何创建的、网站和手机应用程序是如何开发的、我们可以进入的哪些领域，以及如何获得第一份工作或作为自由职业者工作。但我们实际上并没有学会如何编程，只是学会了如何练习编程以及如何创建作品集。\n\
    \n现在是这一切中最酷的部分即将到来，即真正去寻求知识并学习编程，以使用我们在书中收到的所有建议。\n\n我强调一下，这一切并不是强制性的。我们可以遵循自己的道路并寻求编程知识，进行实践和学习，而不一定非遵循这个流程或利用所有的主题。这里列出的主题中，有些我是在在该领域工作一段时间后才开始关注的，比如设计模式（Design\
    \ Patterns）或软件测试。\n\n在我们学习期间，有一些主题非常重要，但并不有趣。我们需要从现在起了解这些主题的重要性，以免最后因为它们的“复杂性”而将其置之脑后。\n\
    \n因此，我们将了解这些主题是什么以及为什么它们在编程世界中如此重要。从它们的理论到它们变得重要之处。\n\n## 9.1 算法与数据结构\n\n我们学习了什么是算法。我们知道它是我们为了解决问题而创建的指令流（规则、配方），但先学习创建算法而不是直接开始学习编程语言真的那么重要吗？\n\
    \n是的，我认为这非常重要。算法是我们我们周围一切的基础，如果我们不理解、学习或练习这些，创建程序将变得困难得多。我们可能会背下语言的指令以及我们在互联网上看到的程序创建方法，但将不知道如何从零创建一个程序。\n\
    \n语言中有些命令可以完成一些我们可能需要创建算法才能完成的任务。例如，JavaScript 中的 `reduce` 命令工作如下：\n\n```javascript\n\
    const nossoArray = [1, 2, 3, 4, 5]\n```\n\n```javascript\nconst valorTotal = nossoArray.reduce((acumulador,\
    \ itemAtual) => {\n  return acumulador + itemAtual\n}, 0)\n```\n\n```javascript\n\
    alert(valorTotal)\n```\n\n但是，并不是这一切都存在，有时我们需要实现/创建。如果不存在 `reduce`，我们必须学会创建一个算法来完成同样的功能，可能如下：\n\
    \n```javascript\nconst nossoArray = [1, 2, 3, 4, 5]\nconst tamanhoDoArray = nossoArray.length\n\
    let valorTotal = 0\n\nfor (let i = 0; i < tamanhoDoArray; i++) {\n  valorTotal\
    \ = valorTotal + nossoArray[i]\n}\n\nalert(valorTotal)\n```\n\n在这里我们有一组值集合，我们没有使用\
    \ `reduce`，而是使用了 JavaScript 以及其他编程语言中的 `for` 命令来获得相同的结果。\n\n语言中不存在某个命令而我们需要从零实现该例程，这可以被认为是我们学习算法的最后一个理由。这只是一个例子，让我们明白需要学习思考算法，思考编程逻辑。\n\
    \n数据结构属于同一重要性水平，因为了解了这些，我们可以让我们的程序获得更好的性能（速度），并在处理数据时让生活更方便。\n\n数据结构是我们在程序中组织和存储数据的方式。当我们算法中对数据进行良好的组织和布置时，我们可以更轻松地访问这些数据，比如在大量数据中搜索一个重要记录。\n\
    \nJavaScript 中的 `array` 是我们如何使用数据结构来组织代码的经典示例。我们想在程序中表示多个值，我们需要为每个值创建一个标识符，例如：假设我们将拥有学校\
    \ 4 个学生的成绩，我们可以这样做：\n\n"
