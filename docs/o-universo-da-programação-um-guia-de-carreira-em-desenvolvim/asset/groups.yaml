    +   - trabalho-de-matematica-agora-vai-2.docx;

    - trabalho-de-matematica-nao-aguento-mais.doc;


    Isso é uma garantia de que não percamos a última versão do nosso trabalho caso
    tenhamos qualquer problema conseguimos resgatar a versão anterior. Essa ideia
    serve também para o versionamento de código-fonte. Criamos nosso código, temos
    a primeira versão, alteramos algo, então temos outra versão e assim vai. E para
    cuidar disso utilizamos alguns sistemas de versionamento de código, que são softwares
    capazes de facilitar a vida na criação de versões do nosso programa (melhor do
    que ficar criando cópias e colocando nomes com final 1, 2, 3).


    # Qualidade de software


    Nós seguimos padrões e convenções para que nosso código seja legado e de fácil
    manutenção por outras pessoas que vão trabalhar em nossos programas para garantir
    a segurança do código, garantir que um módulo criado agora não atrapalhe outro
    já existente. Podemos adicionar testes de software dentro do espectro da qualidade
    de software, porém não são somente os testes que garantem isso, é o conjunto dos
    testes com boas práticas e convenções que precisamos conhecer.


    # Protocolo HTTP


    Quando estamos em rede (internet ou rede local), nossos dispositivos (computadores,
    impressoras, celulares) se comunicam. Para que eles consigam entender existe um
    protocolo a seguir para trafegar dados na rede, esse é o protocolo HTTP. Existem
    outros protocolos de rede, mas o mínimo que todo mundo deve conhecer é o HTTP.


    # Gerenciamento de dependências


    Enquanto trabalhamos com programação, na maioria das vezes, não precisamos escrever
