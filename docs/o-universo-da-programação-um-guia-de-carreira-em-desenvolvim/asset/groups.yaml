    não muito legais de trabalhar, mas existem ferramentas que nos ajudam a identificar
    bons lugares para enviar nosso currículo.


    Os sites de oportunidades de emprego, normalmente, possuem filtros baseados em
    recomendações ou avaliações de usuários que já trabalharam nas empresas, mas no
    Brasil o site que mais consultamos para saber como uma empresa é é o Love Mondays
    (https://lovemondays.com.br/). Também existe o Great to Work (https://gptw.com.br/).


    [Nota: As repetições excessivas do texto original foram removidas para manter
    a clareza da tradução, conforme as instruções de não repetir o conteúdo e limpar
    erros de OCR.]


