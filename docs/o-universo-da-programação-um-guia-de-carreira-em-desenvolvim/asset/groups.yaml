    这是非常古老的计算机连接和通信方式。计算机早已已经在局域网（在我们家里、公司等）中使用客户端-服务器模型进行通信，以共享打印机和传真机等资源。


    在 Web 应用的背景下，客户端-服务器动态的工作方式如下：用户访问网站的地址，例如 Casa do Code 网站：


    ![](img/1980cd0900b9cb84feb62a3cc0d390f3_29_0.png)


    用户一旦按下回车键，浏览器就会执行多项任务，然后与 Casa do Code 服务器建立通信。如图像所示，该服务器当时的网络地址为 23.227.38.32：


    ![](img/1980cd0900b9cb84feb62a3cc0d390f3_30_0.png)


    图 1.9：casadocodigo.com.br 的 IP 地址。


    如果你不知道什么是网络地址或互联网是如何工作的，请担心，我们稍后会介绍这些内容。


    一旦服务器接收到我们发送的消息，它就会进行处理并发送响应，该响应可能是一个网页。我们可以在浏览器开发者工具的“网络”（network）标签页中看到服务器的响应（我们在**什么是计算机程序**章节中介绍过如何访问开发者工具）。在这个示例中，我们看到了服务器正在向我们发送的文件：


    ## Ember.js


