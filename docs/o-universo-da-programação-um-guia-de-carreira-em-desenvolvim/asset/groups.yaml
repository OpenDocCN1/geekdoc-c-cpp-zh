  - '[PAGE 167]


    Estes exercícios por só nos preparam somente para testes de lógica e muitas empresas
    fazem testes práticos em formas de projetos inteiros, como "criar uma interface
    de loja virtual", "criar uma aplicação back-end que se comunique com parceiros",
    "criar um aplicativo para listar os últimos jogos do seu time", "criar um modelo
    para analisar os dados da base xyz", "criar um jogo da forca". Então é ideal que
    realmente pratiquemos muito criando coisas novas, que coloquemos nossas ideias
    em prática e desenvolvemos softwares.


    Casos bem form nos testes de perfil e teste prático, normalmente existem entrevistas
    com as pessoas do time e até mesmo com a diretoria da empresa para confirmar o
    alinhamento com as expectativas da empresa como um todo.


    # 8.10 Toda entrevista é uma oportunidade de aprender mais


    Por que mais nos esforçarmos bastante, colocarmos nossa energia em praticar, gastar
    muito tempo estudando e fazendo diversos desafios práticos para nos prepararmos
    para as entrevistas de emprego, não será sempre que passaremos nos testes de emprego.


    Seja pelo teste prático, por não se encaixar na cultura da empresa ou mesmo pelo
    nosso nervosismo na hora de falarmos sobre nós, algo pode não ser interessante
    para os recrutadores ou para a equipe que nos entrevistou.


    A entrevista serve somente para avaliar nosso conhecimento técnico, capacidade
    de resolver problemas e extrair informações que não foram passadas pelo nosso
    currículo, mas também para que a empresa conheça o nosso momento de carreira,
    pretensão salarial e outras competências que cada empresa pode precisar particularmente.'
  - '[PAGE 168]


    São milhares de variáveis possíveis e pontos que nós não conseguimos prever, por
    serem peculares a cada empresa, e por isso é bem normal não passarmos em várias
    entrevistas no começo da carreira. O importante é extrair alguma experiência de
    cada uma.


    Pode ser que façamos 100 entrevistas até conseguir algo primeiro emprego na área.
    Também pode ser que façamos 5 e consigamos rapidamente. Não existe uma fórmula
    mágica para passar em entrevistas, pois é uma troca de interesses que deve ser
    muito bem feita.


    Não passar em uma entrevista é algo ruim. Em cada processo seletivo temos uma
    oportunidade de conhecer pessoas novas, empresas diferentes, culturas de times
    e tipos de testes diferentes. Se não der certo em uma oportunidade, estaremos
    preparados(as) para a próxima e sempre diante.


    Sempre que possível é ideal que busquemos por feedback a respeito do motivo por
    que não passamos em um processo, assim conseguimos identificar onde podemos melhorar.
    Se devemosmos deixar claro que estamos procurando saber por que não passamos,
    por desejarmos aperfeiçoar, do contrário fica parecendo que não concordamos com
    a decisão da empresa/time e isso não está dentro da nossa alçada. Quem decide
    se nos contrata ou não é a empresa de acordo com a nossa necessidade e de negociação
    que fizeram conosco no processo, achar que devemos passar baseado em nosso próprio
    ego é no mínimo arrogante e não devemos alimentar esse tipo de achismo em nossas
    vidas.


    Podemos retornar um e-mail para a pessoa de recrutamento ou do time que nos avaliou
    solicitando um feedback e pontos a melhorar. Nem todas as empresas respondem isso,
    na verdade raramente elas respondem. O padrão é a pessoa do recrutamento sumir
    sem nos dar notícias, mas tudo bem, alguma empresa vai nos responder e vai contribuir
    muito para o nosso crescimento profissional.'
- md: '

    Uma estratégia quando não recebemos feedback sobre uma oportunidade em que não
    passamos é contar para a nossa rede de contatos sobre o processo seletivo, sobre
    como foi o teste e todos os processos para que as pessoas nos orientem onde podemos
    melhorar.


    Talvez, contando para alguém que fizemos e mostrando nosso teste prático para
    alguém mais experiente tenhamos de feedback da empresa.


    Tendo esses feedbacks em mãos podemos ir muito mais longe em nossa carreira, ainda
    devemos buscar a melhoria contínua. Sabendo quais são os pontos a melhorar teremos
    mais foco.


    ## 8.11 Conseguindo nossos primeiros freelas


    Freelance é uma ótima oportunidade de trabalho. Muita gente não vê nessa modalidade
    porque acredita que trabalho mesmo é aquele que fazemos com carteira assinada
    e com patrão/patroa, mas a realidade não é essa. O trabalho como freela é muito
    valioso e existem pessoas que levam a vida somente nessa modalidade.


    Trabalhar como freelancer não é bagunçado. Nós temos que nos responsabilizar pelos
    nossos horários, pelos nossos impostos, por geração de nota fiscal, por captação
    e retenção de clientes, além dos cuidados legais (ter um contrato) para a nossa
    empresa. Afinal, freelancer é um(a) profissional que possui uma empresa aberta,
    porém trabalha a sós.


    Existem pegadinhas na profissão freelancer e dicas que podemos ajudar a ir mais
    longe como profissionais individuais sobre como conseguir um cliente ou tomar
    cuidado para não tomar um golpe. Vamos aprender mais sobre isso.


    ## Como procurar freelas


    Quando decidimos nos tornar freelancers profissionais precisamos aprender diversas
    minúcias de administração de empresas com que não nos importaríamos tanto trabalhando
    para uma empresa. E conseguir clientes a uma delas. Ao pensarmos em pessoa começando
    agora na área de programação parece mais complicado ainda, porém não é tão difícil
    assim.


    Como já citei anteriormente, o trabalho para conhecidos ou para microempreendedores
    locais pode ser a nossa entrada na área de programação. Também podem ser nossos
    primeiros clientes freelas, além de possíveis clientes de longa data, caso façamos
    um bom trabalho e conquistirmos essas pessoas. Empresários de qualquer tamanho,
    sempre precisam de um(a) programador.


    Para conquistar nossos clientes, devemos mostrar para eles o quanto nosso trabalho
    pode melhorar as suas vidas. Mostrar o quanto somos um sistema, um aplicativo
    etc. pode contribuir com o crescimento do seu negócio.


    Se temos uma ideia de aplicação que poderia melhorar como a empresa funciona,
    então estamos imaginando uma solução para um problema que pode o(a) dono(a) da
    empresa nunca ter imaginado que poderia ser resolvido. Devemos levantar o máximo
    de informação sobre esse problema, o quanto a empresa perde por causa dele e então
    mostrar como a nossa solução transformaria o negócio de nosso possível cliente.


    Um exemplo bem simples pode ser a redução de custo em um minimercado devido à
    quantidade de produtos que vencem no estoque por causa da reposição em excesso,
    feito "no olho", aquela reposição em que alguém observa o estoque e chuta uma
    quantidade para comprar sem nenhuma estatística. Um sistema com controle de reposição
    de estoque somente quando realmente precisa, baseado em épocas de vendas, já ajudaria
    na redução de custo e ainda por cima auxilia ao não desperdício, criando uma empresa
    sustentável.


    É isso que deveria ser falado para nosso possível cliente. Porém, com números,
    claro.


    Em um cenário fictício o dono do mercado sofre perda de 15 mil mês somente com
    produtos vencidos no estoque. Um sistema que ajuda a trazer o lote com data de
    vencimento mais próxima para as prateleiras ajudaria a reduzir 50% desse desperdício,
    sendo assim o lucro do estabelecimento subiria R$ 7.500,00, por exemplo.


    E para todos os casos devemos fazer o mesmo: analisar o cenário, descobrir suas
    falhas, criar soluções, provar nossas soluções matematicamente (com estatísticas)
    e levar isso para o possível cliente.


    Claro que isso nem sempre vai funcionar de primeira, pois existem pessoas que
    simplesmente não desejam mudar a forma como seu negócio funciona; e tudo bem.
    Podemos criar essa solução, vender para outro cliente e a vida segue.


    ## Como calcular o valor de um freela


    Conseguindo o primeiro cliente vem uma das partes mais difíceis de se trabalhar
    por conta que é precificar nosso trabalho.


    Existem riscos ao calcular nosso valor como:


    - perder o cliente por conta de o preço estar alto;

    - perder dinheiro por cobrar barato por um trabalho muito alto;

    - perder dinheiro e tempo com um cliente que desiste do produto enquanto estamos
    desenvolvendo.


    E também existem diversas maneiras de dar preço a um software, site itc. Antes
    de passar um preço é ideal que façamos uma pesquisa de mercado para saber o quanto
    outras pessoas estão cobrando, fazer uma bela pesquisa de mercado.


    Essa pesquisa pode ser embasada pelo preço que encontramos em sites de empresas,
    outros softwares que encontramos com proposta parecida com a nossa ou mesmo entrando
    em contato com as empresas de desenvolvimento ou agências fazendo um orçamento.


    Com esse preço em mãos podemos praticar um valor mais alto ou mais baixo, dependendo
    da nossa capacidade, da complexidade do produto que vamos criar ou mesmo da nossa
    necessidade de carreira.


    Uma das maneiras de precificar o desenvolvimento é pelo tempo que vamos gastar
    para criar o produto e o valor da hora de trabalho. O valor da hora varia muito
    pela nossa experiência na área, quanto mais experiência maior o valor hora.


    Existe um site que pode nos ajudar a precificar a hora, que é “minha hora, entre
    outros” com ferramenta quanto custa minha hora (http://minhahora.entreoutros.com/).
    No site nós colocamos quanto queremos ganhar por mês, em quantos dias vamos trabalhar,
    área de atuação, ambiente de trabalho, dentro outras informações e ele traz um
    equivalente que podemos praticar ou não, dependendo da confiança.


    Mesmo que não utilizemos o valor informado pelo site, ele é uma excelente ferramenta
    para entendermos o que analisar ao precificar o nosso trabalho.


    ## Como escapar de freelancers cilada


    Em tudo o que formos fazer é extremamente importante que façamos um contrato especificando
    valores, tempo de desenvolvimento e também o que será feito previamente acordado
    com nosso cliente (ou futuro cliente). O contrato é a nossa única garantia legal
    de que ambas as partes vão agir de boa fé e se não agirem teremos resguarda da
    lei para conseguos receber nossos honorários pelo trabalho prestado.


    Mesmo com um contrato em mãos, as pessoas que fazem muito costumam praticar um
    esquema de pagamento onde recebem apenas uma parte do valor em calote, que é dividir
    o pagamento em duas ou mais partes. Uma parte do valor nós recebemos no começo
    do desenvolvimento e a outra parte quando entregamos o produto quebrado em várias
    partes e recebemos por entrega.


    Eu indico dividir em partes e trabalhar com pequenas entregas mensuráveis. Ou
    seja, entregar o produto em partes que nosso cliente pode sair usando e para cada
    parte dessa paga uma parcela do produto final. Isso é bom para ambas as partes,
    pois o usuário já começa a usufruir dos recursos que inventamos para ajudar e
    nós já recebemos algum valor pelo trabalho que estamos desempenhando.


    Outro problema recorrente no mundo do freelancer é o caso do cliente que participa
    de uma reunião conosco, fazemos todo o levantamento de requisitos, planejamos
    todo o projeto e até dizemos como vamos fazer e esse cliente, depois dessa reunião,
    nunca aparece e, quando menos esperamos, o projeto que nós planejamos no ar.


    Isso acontece porque, a pessoa pega tudo o que planejamos, leva para um amigo
    ou amiga (ou o famoso sobrinho) que está aprendendo a programar e passa o nosso
    trabalho para essa pessoa fazer de graça.


    Uma cilada dessas só é evitada cobrando um valor pelo início do trabalho. Ou seja:
    fechando contrato desde o começo. Claro que, nem todo cliente quer pagar antes
    de ter algo concreto e por isso temos que usar nossos argumentos para que a pessoa
    confie.

