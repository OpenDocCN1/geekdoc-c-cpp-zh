    5 páginas e com informações pouco relevantes ao recrutamento não será nada efetivo.


    Quando alguém analisa nosso perfil, está procurando por palavras-chave e termos
    relacionados a uma posição específica na empresa ou em um cliente, e ao se deparar
    com um currículo imenso com informações vagas, sem valor para a área, dificilmente
