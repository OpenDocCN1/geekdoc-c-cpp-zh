    # Introdução


    Este livro é uma coletânea de informações adquiridas através do tempo, tendo buscado
    trabalhar com desenvolvimento de software e depois participado de diversas iniciativas
    focadas em inserir pessoas na área de programação, além das experiências vividas
    em minha carreira.


    Eu conto aqui todas as estratégias que aprendi e utilizei a partir de "uma pessoa
    com pouco estudo e sem profissão" até me tornar desenvolvedor de software (sem
    faculdade), uma profissão muito reconhecida no mercado de trabalho atual e futuro.


    Aqui encontramos as dicas necessárias para que uma pessoa saia do zero... (segue
