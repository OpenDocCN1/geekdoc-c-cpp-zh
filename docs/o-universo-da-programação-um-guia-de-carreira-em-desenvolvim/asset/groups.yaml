  mdcn: '


    社区是指由于共同兴趣、群体文化、有时是因为相似的经历或仅仅为了共同目标而聚集在一起（无论是在线还是线下）的人群。有些社区围绕技术诞生，例如编程语言、开发工具，而另一些则是为了一个核心目标，例如共享知识。


    我们有一些由于共同兴趣而诞生的巴西社区示例，如 Python Brasil、PHP Brasil、JavaScript Brasil、Ruby Brasil
    和 Java Brasil。这些社区的存在是因为人们对这些语言感兴趣，并希望交流经验、相关链接、展示自己的成果并帮助彼此学习更多这些语言的知识。


    其他社区并非围绕某项技术，而是围绕一个目标建立，例如不分领域或技术的知识共享，如 Garoa Hacker Clube 的 Training Center、Things
    Hacker Team 或 Code Club，这些都是促进经验交流、甚至为儿童教授编程的群体。


    还有一些具有强大社会号召力的群体，它们将知识带给代表性不足的群体，例如贫困人群、女性、黑人、残障人士、原住民、移民等，诸如 Codamos、Django Girls、Rails
    Girls、Afro Python 或 WoMakersCode。


    如果我们在互联网上寻找，会发现各种类型的社区，它们拥有各种哲学和目标。只要有我们认认同的东西并加入它们即可。在职业生涯早期加入社区可能会非常有帮助，因为他人的经验可以极大简化我们的生活，并对我们的职业发展做出贡献。


    讨论论坛是这些社区用于交换知识的工具，当有人发布问题时，另一个人会尝试帮助解决问题。


    这些论坛可以以多种形式存在，如社交网络上的小组或自己的平台。


    而黑客松（hackathons）是大型编程竞赛，通常具有一个良好的目标，例如解决社会问题、帮助某个社区或技术成长。此外，它们还有奖金。在黑客松中，人们组成跨学科团队竞争以提供最佳解决方案，这些将由一个符合竞赛目标和既定标准的评审小组进行评估。


    无论如何，我们参与的群体越多，学到的就越多。但重要的是，我们要分享并尝试帮助那里的人们。只有这样，社区才能继续存在。


    尽管我们可能刚开始，觉得自己无力帮助，但我们总能以某种方式对社区做出贡献。例如在论坛中，我们可以说，如果不理解一个问题，可以为了让问题表述更清楚而给出建议，或者尝试在自己所知的范围内进行回答。不需要超出我们目前的知识范围，但我们已经根据已有的知识提供帮助，并且随着参与的增加，我们在专业领域会不断进步，并以其他方式做出贡献。


    ## 7.2 为互联网生成内容


    如今，接触最多人的最佳方式是利用互联网。当我们需要学习新东西时，即使是像“如何做米饭”这样的事情，我们也会去互联网上。软件开发也是同样的过程，特别是对于年轻人来说，因为我们是在互联网搜索环境中长大的，所以已经更习惯了这一点。


    互联网力量的一个例子是，根据调查咨询公司 TNS Research International 的调查，超过 90% 的人在购买产品前会在互联网上搜索。


    因此，贡献社区的一种极佳方式是生成内容，无论是文本（如博客）、视频（如 YouTube 等平台上的频道客音频）。


    我们可以贡献现有的项目（如门户网站），也可以创建自己的。这更多取决于我们的个人目标（推广自己或为某个小组做贡献），或者我们是否符合可用小组的哲学。


    内容创作是非常个人的，因为我们可以讨论任何我们认为重要或与市场相关的话题，例如最新的技术或我们的编程语言。


    在 2018 年，有很多人在讨论 JavaScript，因为它是一门上升中的语言，正如 Java、PHP 一样，很快我们又会有另一种语言处于浪潮尖端；但许多人在讨论市场需要但可能被遗忘的东西，比如软技能（soft
    skills），即不同于技术技能的能力，如沟通、同理心等。


    但初学者如何贡献内容呢？


    无论是新手还是老手，分享我们正在学习的内容都可以成为加强知识的绝佳方式，因为为了就我们要说的话题创建良好的示例，将需要更多的研究和努力。


    此外，我们还可以收到关于我们所传达内容的反馈，以进一步加强我们对任何主题的理解。


    市场很大一部分由职业生涯初期的人员组成，正如我们在 2018 年对软件开发问答网站 Stack Overflow 的调查中确认的那样，我们发现 30.1%
    的人从事编程的时间在 0 到 2 年之间，27.4% 在 3 到 5 年之间（http://bit.ly/stackoverflow-survey-2018）。


    ### 职业编程年限


    | 年限 | 百比 |

    | :--- | :--- |

    | 0-2 年 | 30.1% |

    | 3-5 年 | 27.4% |

    | 6-8 年 | 14.6% |

    | 9-11 年 | 9.7% |

    | 12-14 年 | 5.5% |

    | 15-17 年 | 3.9% |

    | 18-20 年 | 3.6% |

    | 21-23 年 | 1.8% |

    | 24-26 年 | 1.1% |

    | 27-29 年 | 0.6% |

    | 30 年以上 | 1.7% |


