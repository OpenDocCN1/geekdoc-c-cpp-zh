    # 4.1 Conhecimento comum entre todas as áreas de desenvolvimento de software'
- md: '

    Sempre que pensamos em pessoas que trabalham com código, mesmo com as divisões
    por especialidades (front, back, full-stack, mobile, jogos, dados etc.), temos
    alguns conhecimentos técnicos que são “comuns”, são obrigatórios para todas as
    pessoas, e extremamente necessários para trabalharmos nessa área.


    Esses conhecimentos são importantes para todas as pessoas porque, apesar das peculiaridades
    das especializações, no final das contas todos fazemos o mesmo: desenvolvemos
    software. E desenvolvimento de software sempre segue algumas regras e padrões
    preestabelecidos.


    Por agora vamos conhecer os tópicos que são comuns a todas as pessoas que trabalham
    com programação e um breve resumo do que significam, eu separarei um capítulo
    com dicas e recursos para aprofundarmos mais sobre cada assunto mais à frente
    no livro.


    ## Lógica e alguma linguagem de programação


    Lógica de programação é o tópico mais importante de tudo o que precisamos aprender.
    Lógica é uma maneira de pensar e por isso precisa ser muito prática, pois quase
    uma mudança em como nós fazemos algo, como tomamos decisões. A lógica de programação
    é a técnica de escrever os programas para que o computador tenha uma lista de
    tarefas para executar e realizar uma ação. Uma linguagem de programação pode ou
    não entrar nesse ponto de aprendizagem, podemos aprender raciocínio lógico sem
    depender de uma linguagem, como aconselho a já estudar com a linguagem que vamos
    trabalhar. Também é importante conhecer outras linguagens de programação depois
    de já possuírmos alguma experiência para aprendermos também outros paradigmas
    de programação (as maneiras como nós estruturamos o nosso programa para resolver
    os problemas).


    ## Estruturas de dados e algoritmos


    Algumas áreas de desenvolvimento de software cobram mais este conhecimento do
    que outras, mas estruturas de dados e algoritmos são armas poderosas para alcançarmos
    o melhor desempenho do nosso programa.


    Algoritmos nada mais são do que os passos que criamos para a execução do programa.
    Estudar como algumas pessoas resolveram os mesmos problemas pelos quais passamos
    ou como alguns algoritmos famosos (que encontramos em livros acadêmicos) podem
    nos preparar para enfrentar alguns problemas que vão aparecer no dia a dia.


    Estruturas de dados são, muitas vezes, intercaladas com o estudo de algoritmos,
    pois é o estudo das melhores maneiras de planejar como os dados vão fluir em nosso
    programa e como são estruturados (armazenados e organizados).


    ## Padrões de projeto


    Alguns problemas que enfrentaremos no desenvolvimento de software são recorrentes
    e existem pessoas que já passaram por eles e catalogaram boas formas de resolver
    problemas anos atrás. Esses modelos catalogados foram chamados de padrões de projeto.


    ## Versionamento de código


    Quando trabalhamos com escrita de um texto, por exemplo, normalmente, passamos
    por algumas versões dele. Um exemplo é a escrita de um livro: nós escrevemos um
    capítulo, escrevemos outro capítulo, então temos outra versão do livro com dois
    capítulos e assim por diante.


    Também é comum versionar aqueles trabalhos de escola/universidade:


    - trabalho-de-matematica-1.doc, trabalho-de-matematica-2.docx;

    - trabalho-de-matematica-agora-vai.doc;

    - trabalho-de-matematica-agora-vai-2.docx;

    - trabalho-de-matematica-nao-aguento-mais.doc;


    Isso é uma garantia de que não percamos a última versão do nosso trabalho caso
    tenhamos qualquer problema conseguimos resgatar a versão anterior. Essa ideia
    serve também para o versionamento de código-fonte. Criamos nosso código, temos
    a primeira versão, alteramos algo, então temos outra versão e assim vai. E para
    cuidar disso utilizamos alguns sistemas de versionamento de código, que são softwares
    capazes de facilitar a vida na criação de versões do nosso programa (melhor do
    que ficar criando cópias e colocando nomes com final 1, 2, 3).


    ## Qualidade de software


    Nós seguimos padrões e convenções para que nosso código seja legado e de fácil
    manutenção por outras pessoas que vão trabalhar em nossos programas para garantir
    a segurança do código, garantir que um módulo criado agora não atrapalhe outro
    já existente. Podemos adicionar testes de software dentro do espectro da qualidade
    de software, porém não são somente os testes que garantem isso, é o conjunto dos
    testes com boas práticas e convenções que precisamos conhecer.


    ## Protocolo HTTP


    Quando estamos em rede (internet ou rede local), nossos dispositivos (computadores,
    impressoras, celulares) se comunicam. Para que eles consigam entender existe um
    protocolo a seguir para trafegar dados na rede, esse é o protocolo HTTP. Existem
    outros protocolos de rede, mas o mínimo que todo mundo deve conhecer é o HTTP.


    ## Gerenciamento de dependências


    Enquanto trabalhamos com programação, na maioria das vezes, não precisamos escrever
    todo o nosso programa, algumas partes comuns já existem, como a comunicação com
    servidores, um modelo para trabalhar com bancos de dados ou coisas do tipo, podemos
    importar esses programas preexistentes para dentro dos nossos sistemas. Isso é
    chamado de dependência. Esses pacotes de programas externos a nossa equipe recebem
    o nome de dependência porque, uma vez que nós adicionamos aos nossos códigos,
    eles se tornam parte do resultado final e se os removermos, então o programa pode
    parar de funcionar.


    ## Testes de software e testes automatizados


    Enquanto desenvolvemos nosso código precisamos testá-lo. Será que isso está funcionando
    conforme foi planejado? Se eu passar valor diferente para o meu programa (como
    colocar um nome no lugar de uma data) ele vai dar erro? Será que o programa aguenta
    uma quantidade elevada de usuários simultâneos?


    Basicamente escrevemos o código e colocamos para rodar em nosso ambiente local
    e vemos que tudo está OK. Por, só não é garantia para as questões que citei, é
    necessário conhecer algumas práticas que vão garantir a segurança do código. São
    os testes de software, técnicas que utilizamos para garantir a segurança do código,
    e os testes de software automatizados, que são executados automaticamente por
    softwares especialistas em testar nosso código e todo o funcionamento de programa.


    ## Manutenção de software


    Nós sempre precisamos modificar e continuar cuidando de um software existente.
    Para que façamos tudo correto, precisamos estudar sobre manutenção de software,
    que é o conhecimento de como monitorar o programa, como testar o código e como
    trocar partes de maneira que não pare de funcionar, pois na grande maioria das
    vezes o programa está rodando


    Existem também alguns conceitos opcionais, mas que podem dar um plus em nosso
    conhecimento e produtividade, que são:


    ### O próprio sistema operacional


    Conhecer muito bem o nosso sistema operacional vai nos trazer certo desempenho
    no trabalho. Se nos conheermos os atalhos para executar uma funcionalidade ou
    os comandos para executarmos no terminal que automatizam o que fazemos no sistema
    operacional (como configurar coisas, rodar programas etc.) conseguiremos produtividade
    no dia a dia.


    ### Terminal


    Sabe aquela tela preta que aparece nos filmes de hacker? Então, aquilo é o terminal.
    O terminal é o programa que utilizamos para rodar comandos em nosso sistema operacional.
    Utilizamos isso porque, muitas vezes, é mais rápido rodar diversos comandos de
    uma só vez do que abrir uma janela e clicar em diversos botões para executar a
    mesma tarefa. Precisamos conhecer bem essa ferramenta porque existem sistemas
    operacionais que não tem a interface gráfica (aquela parte visual que enxergamos
    no PC), principalmente servidores em que temos somente a tela preta do terminal
    e os comandos a serem executados.


    ### Diferentes ambientes de execução: local, produção e testes


    Podemos resumir ambientes como: o local onde nosso programa está sendo executado,
    que pode ser em nossa máquina, no servidor ou na máquina/celular/etc. do nosso
    usuário final. Enquanto criamos o software em nossa máquina, chamamos de ambiente
    de desenvolvimento local. O ambiente onde o usuário final utiliza o

