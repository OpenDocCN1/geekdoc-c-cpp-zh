    ![](img/1980cd0900b9cb84feb62a3cc0d390f3_0_0.png)


    **Casa do Código**


    WILLIAM OLIVEIRA


    # Sumário


    * ISBN

    * Dedicatória

    * Agradecimentos

    * Sobre o autor

    * Prefácio

    * Introdução

    * 1. Uma introdução ao vasto universo da programação

    * 2. Por que se envolver com programação

    * 3. Pessoas que escrevem programas e lançam foguetes

    * 4. Escolhendo um caminho

    * 5. Uma galáxia de questões mal resolvidas

    * 6. Habilidades de sobrevivência no universo da programação

    * 7. No universo afora as pessoas precisam da nossa ajuda

    * 8. Conquistando o primeiro emprego com programação

    * 9. Aonde ir depois daqui

    * 10. Considerações finais


    # ISBN


    Impresso e PDF: 978-85-94188-90-8


    EPUB: 978-85-94188-91-5


    MOBI: 978-85-94188-92-2


    > Caso você deseja submeter alguma errata ou sugestão, acesse http://erratas.casadocodigo.com.br.


    # Dedicatória


    Esta obra é dedicada à minha mãe, Almerinda, e à minha companheira, Juliana.


    Minha mãe, uma guerreira, solteira criou seus 4 filhos em uma época de extrema
    dificuldade financeira. Já enfrentava preconceitos por ser moradora de favela,
    sem estudos e mulher, e só piorou por sua decisão de divorciar, assumir as rédeas
    de sua vida e não continuar abaixando a cabeça para ninguém de nossa sociedade
    machista. Ela nunca nos deixou desamparados em nenhum momento. Essa mulher é a
    minha inspiração de vida.


    Juliana me motivou a estudar, a não desistir do meu sonho de trabalhar com programação
    e me mantém nos trilhos até hoje. Se não fosse por ela eu não teria focado em
    meus estudos e não trabalharia com o que eu gosto.


    # Agradecimentos


    Agradeço, principalmente, ao Carlos Zamrana e à Andréa Zamrana que, em uma conversa
    de almoço, me incentivaram a continuar compartilhando conhecimento sobre carreira
    e programação em uma das vezes que pensei em parar de escrever na internet.


    Ao Vitor Mantovani, por clarear as minhas ideias quando eu planejava qual assunto
    escrever neste livro, me incentivando a falar sobre carreira.


    Ao Paulo Silveira, por todo o apoio que dá às comunidades de tecnologia junto
    à Caelum, Casa do Código, Alura e iniciativas internas e por também me ajudar
    a encontrar a ideia central para o meu livro.


    Aos meus revisores e revisoras pessoais: Fernanda Bernardo, Luiz Felipe Limeira,
    Mateus Malaquias e Leandro Bighetti.


    Ao Wagner Alr, pelo meu primeiro emprego em uma empresa de tecnologia, na WL INFO
    (agora WL Solutions), ao Humberto Oliveira, pelo meu primeiro emprego como programador,
    na ResideWeb (agora Grupo Reside) e ao meu primeiro mentor em desenvolvimento
    de software e finanças, Bruno Salgueiro.


    # Sobre o autor


    Desenvolvedor de software, começou carreira em programação como full-stack, atuando
    com a linguagem PHP e migrando para front-end quando JavaScript ganhou grandes
    responsabilidades em aplicações de larga escala, dando a pessoa desenvolvedora
    de software a possibilidade de pensar em interfaces Web como aplicações, não mais
    que páginas estáticas.


    Apaixonado por open source, software livre, conhecimento aberto, comunidades e
    afins, fundou o FEMUG-ABC, um grupo de meetups de desenvolvedores front-end, participou
    da fundação do evento ABCDev, um evento de desenvolvimento de software na região
    do Grande ABC Paulista e é criador do Training Center (http://trainingcenter.io),
    uma comunidade inclusiva focada em ajudar pessoas a entrarem na área de desenvolvimento
    de software.


    Como uma pessoa que veio da favela brasileira, entende bem a dificuldade das pessoas
    menos privilegiadas, os grupos representados, e busca apoiar a diversidade e inclusão
    de minorias na área de programação de computadores.


    Desde 2014 contribui com a vida das pessoas incentivando a entrarem na área de
    programação através do blog pessoal woliveiras.com.br (https://woliveiveiras.com.br),
    palestras, workshops e participação em comunidades. Acredita cegamente que somente
    a educação pode mudar a sociedade em que vivemos, e por isso compartilha pensamentos
    e conhecimento pela internet afora.


    # Prefácio


    Quando William me pediu para escrever o prefácio do livro dele eu fiquei extremamente
    emocionada. Uma leitora viciada como eu sabe que é uma honra enorme escrever um
    prefácio, ainda mais se o autor é alguém que você admira e considera como um irmão.


    Antes de perceber sequer que estava estava fazendo eu simplesmente aceitei a encomenda.
    Fiquei muito feliz. Contei para o meu marido, ele ficou orgulhoso, comentários
    durante alguns minutos e só ai percebi o que tinha feito. Obviamente entrei em
    pânico. No interior da minha cabeça ressonava a seguinte frase: “O que foi que
    eu fiz? eu não tenho condições de escrever prefácio de um livro, pessoas que escrevem
    prefácio são pessoas bem qualificadas, sabem o que estão fazendo, você não!”.
    Mas eu já tinha me comprometido, então tinha que.


