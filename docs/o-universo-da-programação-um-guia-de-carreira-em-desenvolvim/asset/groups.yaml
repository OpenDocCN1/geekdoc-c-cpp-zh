    ## 9.4 Testes


    Muitas pessoas pensam que testes são uma perda de tempo, mas a verdade é que eles
    garantem que o seu código funciona como deveria. Testar é fundamental encontrar
    erros antes que eles cheguem ao cliente final.


    Existem diversos tipos de testes, mas os mais comuns são:


    - Testes Unitários: Testam pequenas partes do código de forma isolada.

    - Testes de Integração: Testam se diferentes partes do sistema funcionam juntas.

    - Testes de Ponta a Ponta (E2E): Testam o sistema completo da perspectiva do usuário
    final.


    ## 9.5 Arquitetura de sistemas


    A arquitetura de sistemas define a estrutura de alto nível de um software. Ela
    determina como os componentes são organizados e como se comunicam entre si. Algumas
    das arquiteturas mais comuns são:


    - Monolítica: Todo o sistema é construído como uma única unidade.

    - Microserverviços: O sistema é dividido em pequenos serviços independentes que
    se comunicam via rede.

    - Serverless: O desenvolvedor foca no código, sem gerenciar a infraestrutura de
    servidores.


    ## 9.6 Versionamento de código


    Hoje em dia o versionador de código mais utilizado, sem sombra de dúvidas, é o
    Git. Criado por Lin Torvalds, também criador do Linux, foi rapidamente adotado
    pelo mercado por possuir muitos pontos positivos se comparado a outros, como o
    fato de funcionar de modo distribuído e offline.


    Existem diversas plataformas de hospedagem de código baseadas em Git e a mais
    famosa é o GitHub. O GitHub possui um recurso bem legal para aprendermos Git,
    que é o try.github.io (https://try.github.io/).


    ## 9.7 Inglês


    Alguns dos conteúdos mais atualizados, mais completos e bibliografias antigas
    (ainda muito boas e recomendadas) estão em inglês. É primordial que tiremos um
    tempo para aprendermos este idioma, pois vamos utilizá-lo para tudo em nossa carreira.


    Desde estudo até uma reunião com um time estrangeiro ou uma entrevista de emprego,
    o inglês abre muitas portas em nossa vida profissional.


    Existe um projeto muito bonito que ajuda as pessoas que têm condições de estudar
    o idioma imediatamente a se manterem atualizadas e continuarem estudando programação
    mais e mais, que é o devtranslate (https://medium.com/devtranslate/). Mas, mesmo
    assim, é ideal priorizarmos o inglês em algum momento de nossas vidas.


    Alguns aplicativos e plataformas podem nos ajudar a aprender o idioma, seja no
    caminho para o trabalho (no transporte público ou não), assim como para praticar
    mais, para aprendermos mais rápido:


    - Duolingo (https://duolingo.com/)

    - italki (https://italki.com/)

    - Tandem (https://tandem.net/)

