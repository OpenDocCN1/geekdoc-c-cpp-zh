    ## 例如，我们可以识别出服务器通过网络发送的图像


    ![](img/1980cd0900b9cb84feb62a3cc0d390f3_31_2.png)


    图 1.11：由浏览器下载的图像示例


    ## 此外，服务器还向我们发送了许多 JavaScript 文件，这些文件将在我们的浏览器中执行，以创建丰富的 Web 体验：


    ![](img/1980cd0900b9cb84feb62a3cc0d390f3_32_0.png)


    图 1.12：由浏览器下载的 JavaScript 示例


    网站无非一个或多个 HTML 页面（一种文本语言），它们被发送到我们的计算机并由浏览器解释。通过这些页面还可以完成很多事情，如页面的视觉样式（CSS 文件）、图像、视频、音乐、JavaScript
    文件以及对网站运行可能重要的其他文件。


    系统将 Web 分为若干几类，因为 Web 系统具有更高的复杂性。我们与访问系统的人有多种交互，通过前端应用收集数据并发送到服务器，服务器运行负责处理这些数据的程序（后端），并将处理结果传回给客户端，这种交互持续为用户执行某些操作，例如在
    Web 上发送消息、管理财务状况、查看联系人照片、分享信息等。


    而相比之下，网站通常与用户的交互并不多。它们存在那里是为了展示内容，仅此而已。有些网站甚至具有很高的代码复杂度，但由于其展示信息的独特本质，它们仍然被视为网站。


    说 Web 系统比网站更复杂可能是错误的，因为可能存在网站具有极高的交互性、动画和动作，以为用户提供良好的体验，这归结底可能比维护一个 Web 系统还要复杂。然而，在这里我们关注的是数字产品的本质及其源代码的复杂性。


    我们记得系统和软件之间的区别。网站是一个软件，而 Web 系统在底层是一系列协同工作的软件，用以在浏览器中为我们提供服务。


    例如，大型电子商务网站在不同系统之间有许多集成，以便我们的购买能够顺利完成。它们与其他银行的支付系统、运费计算软件、账单生成软件以及许多其他系统集成了。


    因此，Web 系统和网站的发布可以通过两种方式实现：如果我们考虑发送给用户的内容（前端应用），该代码托管在服务器上，当用户进入网站时，服务器将其发送给用户；如果是直接在服务器上运行的应用代码（后端应用），则有人负责将代码托管在服务器上，并在操作系统中配置应用程序。如今，这一切都已高度自动化，以便我们快速分发软件。


    当我们使用互联网时，后台发生了很多事情。如果你想了解更多关于互联网如何工作的知识、学习网络、了解浏览器和服务器如何工作，还有另一本非常棒的书解释了所有底层原理，那就是《解构
    Web》（Deconstructing the Web）。


