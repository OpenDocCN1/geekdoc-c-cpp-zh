    (como eu) de esperar o lançamento em todos os países e baixaram arquivos .apk,
    que é o executável para sistemas Android, diretamente de websites não confiáveis.
    Isso expõe o usuário a um risco de segurança muito grande, pois não houve verificação
    de permissões do app, análise profunda do mesmo ou coisas do tipo central de apps.


    Contudo, algumas empresas utilizam a estratégia de enviar diretamente os .apk
    para seus usuários a modo de fazer atualizações mais rápidas, sem passar pelo
    período de espera de uma central de apps. O que não é muito legal, mas acontece.


    # 1.6 Conclusão


    Entendemos, até aqui, que existem diversas maneiras de enviar softwares para o
    nosso usuário final. Alguns softwares precisam ser compilados e enviados direto
    para o computador do usuário e outros rodam em servidores na internet trocando
    mensagens através de protocolos de rede com nossos navegadores.'
  - '[PAGE 39]


    Sistemas Web e websites utilizam o modelo cliente-servidor, no qual trocas de
    dados entre ambos e temos softwares rodando no navegador do usuário (cliente)
    e no servidor.


    Softwares Desktop precisam ser compilados e ser executáveis são baixados por meio
    de um website diretamente para o sistema operacional do usuário, podemos podemos
    os executáveis de um computador para o outro via pen drives ou pastas de rede,
    por exemplo.


    Aplicativos de celular têm a têm dinâmica parecida com softwares desktop com a
    diferença de que precisam ser enviados para uma loja de aplicativos com certa
    regulamentação e também conseguimos compartilhar entre celulares ou alguma outra
    maneira de enviar seus executávis para os dispositivos.


    Com todo esse conhecimento, já demos nosso primeiro mergulho fantástico universo
    da programação, pois entendemos o que é um programa, o que são linguagens de programação
    e como são escritos os programas e até mesmo como enviar os programas para as
    máquinas de nossos usuários.


    Vamos continuar nossa viagem universo analisando no próximo capítulo alguns motivos
    pelos quais é interessante envolver nesta área de atuação.'
  - '[PAGE 40]


    # CAPÍTULO 2


    # Por se envolver com programação


    Com o passar dos tempos, a humanidade vivenciou algumas revoluções industriais
    e tecnológicas que transformaram a vida e a sociedade com a automação, inovação
    e com maquinários poderosos que substituem o ser humano em diversas posições de
    trabalho. Hoje vivemos uma revolução… Agora, a **revolução digital.**


    Todos os dias uma empresa ou lança alguma ideia fantástica de automação para agilizar
    processos, diminuir mão de obra ou somente para mostrar que dá para fazer algo
    com inteligência artificial e algumas placas eletrônicas.


    E a área de inteligência artificial nem é algo novo. Ela existe desde 1956, logo
    depois da Segunda Guerra Mundial. Essa área só ganhou visibilidade agora porque
    a evolução do hardware possibilitou seu uso em vários locais.


    Temos empresas automatizando suas colheitas para economizar água, saber a hora
    exata de colher os produtos, controlar seus tratores de arado. Outras ciclo estoque
    é todo automatizado e seu setor de logística é incrivelmente funcional e eficaz.
    Existem as que já estão investindo em nanrorobôs para matar células de câncer
    e também não podemos deixar de pensar em automação residencial e cidades inteligentes,
    podemos utilizar Al (*artificial intelligence*) para os mais variados finos.


    Graças a toda essa revolução algumas profissões vão desaparecer, outras vão surgir
    e acredito fortemente que **programação** será para todas as pessoas que hoje
    é o inglês ou uma faculdade: um requisito básico no currículo.


    Toda essa mudança é muito comum e previsível em uma sociedade que busca a evolução.
    A tecnologia faz parte da mudança e auxilia a'
  - '[PAGE 41]


    inovação, programação faz parte de tecnologia.


    Se o nosso emprego for muito repetitivo e não demandar certo trabalho cognitivo
    ou criativo, que só um ser humano conseguiria inventar, então corremos o risco
    de sermos substituídos por máquinas em um futuro não muito distante.


    Acredito que utilizaremos em breve softwares que recebem linhas de comandos ou
    onde inserimos comandos lógicos para aumentar nossa capacidade de fazer o que
    queremos. Já temos há muito essa possibilidade com macros do Excel, por exemplo,
    que é um código gerado através da gravação de ações do usuário para automação
    de processos.


    A grande questão é: onde puder ter um computador, poderá ter uma pessoa para programar
    seus softwares. Digo "pode", porque quem sabe, no futuro os próprios softwares
    não vão se multiplicar onde houver necessidade em partes triviais dos dos sistemas
    por meio de inteligência artificial?


    Essa mudança global, por si só, seria uma boa motivação para que comecemos a observar
    a área de software com mais atenção, mas vamos nos aprofundar no assunto e conhecer
    outros bons argumentos para mergulharmos de vez neste universo fantástico.


    # 2.1 Programação como treinamento para resolver problemas rapidamente


    Quando estamos aprendendo programação, precisamos aprender a abstrair ações, fluxos,
    problemas, assim como acontece enquanto estudamos ou trabalhamos com matemática.


    Isso porque precisamos entender um problema, traduzir para uma linguagem de programação
    e então criar uma solução'
  - '[PAGE 42]


    computacional para isso. Na matemática transformamos os problemas em fórmulas
    para conseguir o mesmo.


    Enquanto estudamos programação, somos ensinados a pensar de maneira lógica. Pegar
    um problema, quebrar em pequenas partes, tratar cada dessas partes a fim de conseguir
    avanço na solução e então juntamos tudo e obtemos uma resolução.


    O raciocínio lógico pode servir em diversas partes da nossa vida, tanto para trabalhar
    com computadores quanto para analisarmos melhor os pontos em uma discussão, pois
    isso não é algo novo. Aristóteles estabelece a lógica como disciplina em sua obra
    Organon e depois disso o trabalho do filósofo foi usado para criar diversos tipos
    de lógica no Ocidente e na Europa.


    Ao programar, adquirimos o pensamento sistêmico, que é uma forma de analisarmos
    e descrevermos como solucionar problemas. É a capacidade de analisar diversos
    cenários, eventos e “prever” algo que possa acontecer e se adiantar enfrentar
    isso.


    Imagine que, com o passar do tempo, isso se torna tão natural para nossa mente
    que agimos de modo sistêmico usando lógica para resolver a maioria dos problemas
    cotidianos!


    # 2.2 Programação como negócio


    Não é de hoje que empresas ganham dinheiro com código. Existem empresas que desenvolvem
    sistemas para outras empresas há mais de 100 anos, como é o caso da IBM, que existe
    desde 1888, tem quase 500 mil empregados e vale mais de 202,5 bilhões de dólares.


    Existem diversas maneiras de se explorar o mercado de software, seja criando uma
    consultoria que desenvolve sistemas para outras, criando um software e dando manutenção
    a ele como produto principal ou mesmo fazendo os dois, como no caso da Amazon,
    que'
- md: '

    possui seu e-commerce de varejo e também sua área de Cloud Computing e prestação
    de serviços, a AWS (Amazon Web Services).


    De longe este dever deveria ser o motivo menos importante para nos envolvermos
    com códigos, pois pode ser uma mudança grande em nossas vidas. Seria melhor entrar
    na área por paixão do que somente pela parte financeira, mas vamos analisar um
    pouco as opções quando pensamos em ganhar dinheiro com código.


    ## 2.3 Freelance


    A possibilidade de nunca ter um padrão ou patroa, poder fazer nosso próprio horário,
    trabalhar de casa ou de um café e outros benefícios desse tipo, atrai muita gente
    para empregos freelance, uma modalidade bem legal e importante de trabalho na
    qual nos colocamos disponíveis para pessoas e empresas que buscam alguém para
    fazer um projeto esporádico ou até um longo contrato.


    O mais legal é poder passar por diversos projetos de empresas grandes, médias,
    pequenas, para clientes comuns também (pessoa física) e conhecer diversos modelos
    de negócio, projetos fantásticos e muitas vezes ajudamos alguém a sair do zero
    ao produto de suas vidas sem precisarmos estar presos a alguém depois que o projeto
    acaba.


    Hoje existem diversos sites que indexam perfis de pessoas que buscam freelancers,
    seja para produzir um site, aplicativo, um sistema completo ou para arrumar algum
    bug, fazer algum ajuste em algo já existente. Veremos um pouco mais sobre trabalhar
    como freelancer nos próximos capítulos.


    ## 2.4 Criação de um produto digital


    Além das várias possibilidades de criarmos uma empresa especialista na criação
    de softwares para as empresas ou trabalhar como freelancer, também podemos criar
    um software ou sistema de sucesso baseado em um problema que nós queremos resolver.


    Alguns produtos digitais famosos exploram as mais diversas necessidades da sociedade
    e resolvem com maestria a maioria dos problemas, como o aplicativo 99 (https://99app.com)
    para a mobilidade pública, dr.consulta (https://drconsulta.com) para a área da
    saúde, Nubank (https://nubank.br) para serviços financeiros.


    Existem sites onde encontramos o melhor imóvel de uma região baseado em nossas
    preferências, pesquisas, como o VivaReal (https://vivareal.com.br), aplicativos
    de gestão financeira que ajudam a controlar nossos gastos e fazer com que o salário
    dure até o final do mês, como o GuiaBolso (https://guiabolso.com.br).


    E a forma de monetização de um produto digital pode variar muito e isso deve ser
    aprendido de acordo com o uso do produto. Existem diversos cursos e livros a respeito
    da criação de um produto digital, dentre os quais recomendo fortemente a leitura
    sobre startups, como A Startup Enxuta, de Eric Ries e outros livros sobre empreendedorismo
    no geral.


    Se você tiver o sonho de resolver algum problema social, criar um produto digital
    pode ser a grande chance.


    ## 2.5 Entender como as coisas funcionam por baixo do motor


    Dificilmente levamos nosso carro em um serviço de mecânica por falta de água ou
    óleo no motor. O mesmo acontece quando precisamos trocar o pneu de uma bicicleta
    ou fazer a manutenção da nossa geladeira.


    É comum nós mesmos resolvermos um problema desses porque parece algo mais palpável
    para a maioria das realidades, mas será que não poderíamos resolver algum problema
    de um sistema que utilizamos no navegador?


    Mesmo que não tenhamos acesso ao código-fonte de um sistema, saber que algo acontece
    pode nos poupar muito tempo, como saber que um site não está carregando porque
    um script pesado na página, no que poderíamos desativá-lo e finalmente acessar
    o conteúdo.


    Até mesmo um aplicativo de celular pode ser analisado utilizando as ferramentas
    de desenvolvedor que podemos ativar nas configurações do sistema operacional mobile.


    Saber programar ou saber como funcionam as coisas por baixo dos panos nos dá o
    poder de resolver algo e seguir nossa vida, assim como podemos parar num posto
    de gasolina e colocar água no reservatório do carro e seguir nossa viagem.


    ## 2.6 Para nós mantermos em segurança


    Nossos dados/nossa informação são muito importantes e precisamos buscar nossa
    privacidade e segurança na internet.


    Como sabemos se um sistema está coletando dados invasivos à nossa privacidade
    se não conhecemos como as coisas funcionam por baixo do capô, como citado anteriormente?


    Quando entramos em um site e ele é lento, demora alguns segundos para que algo
    aconteça ou comportamento similar, muitas vezes é por conta da coleta de dados.


    Isso não é ruim, nem ilegal (ainda), as empresas coletam nossos dados para melhorarem
    seus serviços e nos entregarem uma experiência melhor em seus produtos. Porém,
    algum sistema pode, sim, estar coletando algo que não queremos que seja coletado,
    como nossa localização, gravando o que falamos próximo aos nossos smartphones
    etc.


    Saber desenvolvimento de software pode garantir conhecimento suficiente para nos
    protegermos na internet ou ao menos nos mantermos mais atualizados(as) sobre o
    mundo dos aplicativos e sistemas que usamos, o que traz uma segurança básica.


    ## 2.7 Programação como exercício para o cérebro


