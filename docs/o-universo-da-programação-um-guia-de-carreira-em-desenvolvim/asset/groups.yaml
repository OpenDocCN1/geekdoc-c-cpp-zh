    **译文：**


    [content]

    这种在某个领域的专业化是自然发生的，因为要精通所有领域几乎在人类体范围内是不可能的，无法一次性达到卓越。由于人们对某些职位更有亲和力或更喜欢某个功能，他们往往会专注于该功能，但作为全栈（fullstack），他们又了解所需的知识以便能够在所有其他领域中工作。


    无论如何，全栈开发者是指那些能够从零开始并完全独立地创建整个系统的人。并不是说其他人就不知道，但在公司里，那些承担全栈职责的人决定在日常工作中不进行专精，而是解决任何出现的问题。他们会处理数据库建模、配置并准备服务器、创建服务端和客户端应用程序，总之，我们
    Web 系统甚至移动端（mobile）领域所需的一切。


    正如想象的，一个全栈开发者需要基础设施、前端、后端以及任何其他必要的技术知识。如果你想在移动端成为全栈，例如，你将需要关于基础设施、后端和移动端的所有知识。如果你想从事游戏，就需要了解基础设施、后端和游戏……以此类推。


    很多人认为全栈是其他领域的自然演变。他们相信我们从前端、后端或其他专精开始，并随着时间的推移变得越来越通用，但这并不是事实。人们可以一辈子都做前端、后端、移动端等，而永远不想参与系统的其他部分（尽管知道系统是如何运作的）。


    我们并不是从一个领域开始并作为专业人士演进，例如从初级前端、中级前端、高级前端，最后变成全栈。这并不是现实。一个人可以从第一天工作就开始以全栈身份工作，因为这并不是一个知识水平（如初级、中级、高级），而是一个工作领域。


    另一个错误是认为全栈人员是所有领域中知识最渊的。正如我之前提到的，全栈开发者可能拥有通才知识并精通某个主题，但专家对另一个他们并不熟悉的领域的了解可能比另一个该领域的人更多。例如：一个像全栈一样非常精通后端的人，对移动端的了解可能不如一个移动端专精的人士。


    ## 4.6 移动端 Android 和 iOS


    移动端，正如我们之前学过的，涵盖了手机、智能手机和平板板电脑。在该领域工作的人将负责开发和维护移动设备的应用程序。


    此人需要了解他们在设备上使用的操作系统，无论是 Android 还是 iOS（iPhone）。需要记住的是，手机操作系统和电脑操作系统一样，控制着我们的整个设备。它们负责从按钮的功能到已安装的应用程序的所有事务。


    现在我们购买智能手机时，可以在 Android 或 iOS 之间进行选择，Android适用于大多数设备，如 Galaxy、ZenFono、Moto E/G/X/Z、Xperia，而
    iOS适用于 Apple 设备，iPhone 和 iPad。


    不建议在 Apple 设备上安装 Android 系统，例如，尽管操作系统与硬件的集成使得这是可以的。Android 设备具有与 Android 兼容的硬件，而
    Apple 设备与 iOS 兼容。


    旧版本系统（版本 1, 2, 3 等）与较新系统版本之间存在显著的差异，这增加了熟练了解操作系统并跟进其演化的重要性。此外，公司可能会更改其设备上的 Android，使其具有针对设备的特定特性。我们还面临设备硬件问题，如内部存储空间、内存、内存卡，甚至我们从事移动端工作的地方。


    如今，应用程序的功能如此多且如此复杂，以至于我们可以比几个专业人士多得多来维护一个应用程序。这无论在技术公司还是在拥有该应用程序作为收入来源的其他行业公司都是如此。可能性是巨大的。


    但在这里，我们在 Android 和 iOS 之间存在划分，这是因为每个系统都有一个与另一个完全不同的生态系统供人学习，例如 Java 和 Kotlin（Android
    的编程语言），以及 Objective-C 和 Swift（iOS 的编程语言）。对于一个人来说，掌握这些内容太多了，因此这是一个在两个阵线之间划分的市场。


    仅供了解，目前还有其他手机操作系统，但对于目前想进入移动端领域的人来说，Android 和 iOS 是最“重要的”。


    从事移动端工作的人需要了解：


    - 一种编程语言：编程语言的选择取决于开发时所选的环境（操作系统和设备）。如果我们想为 Android 编程，我们需要学习 Java 和 Kotlin；如果为了
    iOS，那么就是 Objective-C 和 Swift。过去使用一种语言进行开发，但后来创建了两种新的且功能更强大的语言来方便移动端开发：Kotlin 和
    Swift，某些模块由于版本原因或维护/重写的困难，仍需要用“旧”语言进行维护。

    - **移动端操作系统：**有必要精通操作系统以规避或修复版本问题（旧版本的 Android/iOS 可能不接受我们使用的某些内容，因此我们必须为此寻找替代方案）。

    - **屏幕尺寸：**屏幕尺寸变化很大，因此了解它们非常重要。

    - **部署流程（发布）：** 应用程序的部署过程也与其他不同，因为它们被发送到应用程序商店，因此移动端开发者需要了解其规格和局限性。

    - **与后端的集成和同步：**一些重要信息在互联网上，如用户数据、产品价格等，位于应用程序的后端，因此需要人能够使用 Web 协议请求这些数据。

    - **移动设备资源（硬件）：**如 GPS、蓝牙、屏幕等是人必须掌握的设备资源。应用程序可能需要用户的位置来执行特定操作，或者可能需要闪烁屏幕、使用摄像头或其他资源。


    ## 4.7 游戏开发


    很多人是因为游戏才接触编程领域的。人们想创建一个游戏，或者甚至使用通过解释脚本来“方便”游戏的程序，即著名的机器人或外挂，这些是在玩游戏中作弊的手段。


    这是编程工作中非常有趣的一部分：我们可以处理我们非常喜欢的东西，或者在日常生活中使用它。那些非常喜欢游戏的人将来在创作游戏时也会快乐。


    负责游戏编程的人员将创建游戏物理引擎、渲染引擎（让事物显示在屏幕上的代码）、实现游戏机制、角色移动、物体碰撞以及其他功能。


    这在巴西是一个非常有吸引力的市场，但也可以获得远程工作的机会、搬到另一个国家，甚至作为自由职业者工作。这是因为最大的游戏开发公司不在巴西（这里没有开发部门），遗憾的是。


    但这并不意味着该职业是稀缺的。游戏作为一个整体以及巴西的游戏开发是世界上增长最快的领域之一！人们愿意购买游戏，而且买得很多。在这种游戏销量巨大的背景下，可以想象创作的

