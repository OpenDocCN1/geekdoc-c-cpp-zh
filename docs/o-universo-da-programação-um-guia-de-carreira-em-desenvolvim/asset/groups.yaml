    (sem contar finais de semana), teremos 10 horas de estudos muito utilizados.


    Existem excelentes aplicativos que podem nos ajudar a fazermos nossos pomodoros.
    Eu costumo utilizar o Brain Focus (https://brainfocus.io).


    Muita gente não consegue utilizar a Técnica de Pomodoro porque acredita que precisam
    desde o primeiro dia sendo 100% produtivas, mas isso não é uma realidade. Para
    cultivarmos o hábito de utilizar o pomodoro, podemos começar de modo mais deslexado,
    fazendo pomodoros não tão focados ou então pausas mais longas.


