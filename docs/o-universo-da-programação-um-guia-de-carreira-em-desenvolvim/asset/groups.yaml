    # Comunidades generalistas


    Comunidades focadas em ajudar pessoas de qualquer área de atuação ou tecnologia:


    +   - **Training Center**: focada em ajudar pessoas a entrarem na área de desenvolvimento.
    (https://trainingcenter.io/)

    - **WoMakersCode**: focada em ajudar mulheres a entrarem na área de desenvolvimento.
    (http://womakerscode.org/)

    - **devbeers**: comunidade descontraída de desenvolvimento de software. (https://devbeers.io/)

    - **freeCodeCamp**: comunidade internacional focada em inserir pessoas na área
    de desenvolvimento. (https://freecodecamp.org/)'
- md: '

    ## Comunidades por áreas de atuação


    Comunidades focadas em discussão sobre alguma área de atuação específica:


    - Front-end Brasil: comunidade brasileira da área de front-end. (https://frontendbr.com.br/)

    - Back-end Brasil: comunidade brasileira da área de back-end. (http://backendbrasil.com.br/)

    - Android Dev Brasil: comunidade brasileira da área de desenvolvimento Android.
    (https://github.com/androiddevbr/)

    - CocoaHeads: comunidade internacional de desenvolvimento iOS. (http://cocoaheads.com.br/)

    - Data Hackers Brasil: comunidade brasileira da área de big data, engenharia de
    dados e ciência de dados. (https://datahackers.com.br/)

    - GameDev Brasil: comunidade brasileira de desenvolvimento de jogos. (http://gamedev.com.br/)


    Essas são comunidades que eu indico para qualquer pessoa iniciante. A partir daí,
    é ideal seguir para comunidades específicas para conversar com mais gente ou sobre
    alguma tecnologia que linguagens de programação desejamos em aprender, como procurar
    por PHP Brasil, Python Brasil, Node Brasil, BrasilJS etc. Uma grande parte dessas
    comunidades nas redes sociais ou no GitHub.


    No site do Codamos (https://codamos.club/) encontramos mais comunidades, eventos
    e, o principal, lugares seguros para pessoas de todos os níveis de conhecimento
    e sem preconceito com idade, classe social, mulheres, pessoas LGBTQ+, pessoas
    negras, pessoas com deficiência. Também temos o portal iMasters que agrega em
    sua agenda os eventos mais legais de desenvolvimento de software no geral (https://imasters.com.br/).


    ## 7.5 Conclusão


    Compartilhar conhecimento é extremamente importante, quando pensamos no contexto
    social, e pode ainda nos render uma grande evolução profissional se participarmos
    ativamente das comunidades, eventos e fóruns.


    Podemos criar um blog para compartilhar conhecimento, assim como canais de vídeos,
    podcasts ou qualquer iniciativa que chegue a um grande número de pessoas que precisam
    de informação.


    Devemos buscar um lugar onde nos sentimos bem em compartilhar e ajudar pessoas
    e então podemos nos unir para fortalecer o movimento além de aprendermos muito
    mais rápido quando em grupo.


    ## CAPÍTULO 8

    ### Conquistando o primeiro emprego com programação


    Grande dificuldade de conseguir o nosso primeiro emprego programação é a mesma
    que em todas as áreas: damos passo inicial em direção às vagas de trabalho. É
    muito difícil acreditar que estamos preparados(as) para enviar um currículo ou
    clicar naquele botão de se candidatar que encontramos nos sites de empregos quando
    vemos os requisitos das vagas cheios de palavras que não conhecemos.


    Mas, se não tentarmos, nunca vamos saber se estamos prontos(as) para o mercado
    e também não saberemos se aquela oportunidade se encaixava em nosso nível de conhecimento
    atual.


    Enviar o currículo ou se candidatar a uma vaga para nossa área de atuação e não
    passar é “queimar” uma oportunidade. Se não estivermos aptos(as) a entrar no emprego
    agora, a pessoa do recrutamento simplesmente não nos chamará para a oportunidade
    agora. O que não podemos fazer, de modo algum, deixar de tentar.


    Se não entrarmos dessa vez, então devem continuar nos especializando e tentando
    novamente depois que adquirirmos mais conhecimento ou a experiência exigida pela
    empresa. Isso é o nosso grande desejo de realizar trabalho naquela empresa.


    Ficamos com medo porque não sabemos onde procurar emprego, o que as empresas realmente
    querem de um(a) candidato(a) ou como conseguir a tal experiência que as empresas
    pedem para o primeiro emprego, às vezes para estagiários(as). Neste capítulo,
    vamos entender melhor sobre esses tópicos e um pouco mais.


    Vamos entender como conquistar o emprego e não somente o primeiro emprego na área,
    mas como nos mantermos com boa empregabilidade, isto é, com mais chances de negociação
    futura em nossa carreira. Afinal, trabalhar, para uma empresa ou não, é negociar
    o valor do nosso tempo pela nossa exclusividade com alguém.


    ## 8.1 Onde procurar emprego


    Existem várias formas de se conseguir um emprego e, em desenvolvimento, uma das
    mais efetivas é ter uma presença online ou pessoalmente nas comunidades de programação.
    Isso porque o elemento mais poderoso que pode nos ajudar a fechar uma contratação
    rapidamente é uma boa **indicação**.


    Se tivermos uma presença online, ou, participarmos de fóruns online, gerarmos
    conteúdo para a internet e participarmos das comunidades (eventos, conferências
    e outros modos que vimos no capítulo anterior), quando surgir uma oportunidade
    nas empresas as pessoas vão se lembrar de nós e podem nos indicar pelo conhecimento
    que demonstram ter ou mesmo pelas características pessoais que elas enxergam em
    nosso comportamento por aí.


    Mas, quem não deseja participar tanto das comunidades de programação consegue
    uma boa presença online. Hoje em dia o maior expansão de contratação, utilizado
    pelas empresas, de tecnologia ou não, é o LinkedIn (https://www.linkedin.com/).


    O LinkedIn é uma rede social profissional onde colocamos nosso currículo à mostra,
    e outras pessoas, recrutadoras ou nossas conexões pessoais (alguém que nos conhece
