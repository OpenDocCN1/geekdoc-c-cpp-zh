    Quanto mais dados tivermos em mãos conseguimos entender o mercado. Conseguimos
    saber que as empresas estão realmente buscando, os riscos de investirmos nosso
    tempo em uma determinada tecnologia, assim como identificar possíveis oportunidades
    de investimento em algo novo.


    Por exemplo: se a linguagem mais utilizada na minha cidade é Java, faz sentido
    eu estudar Rust? Depende. Depende se eu quero trabalhar na minha cidade, se eu
    quero sair do estado, se quero um emprego remoto e se a tecnologia demonstra algum
    potencial de crescimento futuro.


    Outro fator importante, pensando em mercado de trabalho, onde queremos trabalhar.
    A empresa em que almej trabalhar pode não usar Ruby, por exemplo, podem usar Java,
    como uma grande quantidade de empresas em nosso país. Nesse caso não seria muito
    vantajoso, ao curto prazo, estudar Ruby, seria melhor estudar Java e de ir atrás
    do sonhado emprego.


    Então, dependendo da área na qual desejamos trabalhar devemos pesquisar quais
    as linguagens utilizadas e os prós e contras de cada uma para nós auxiliar na
    escolha. Vamos aprender a fazer essa pesquisa agora.


    ## Facilitando nossa decisão


