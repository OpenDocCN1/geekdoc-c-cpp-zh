    Observando as imagens do Android Studio, percebemos que o mesmo parece complicado
    por ter muitos botões na tela. Porém, isso é uma "meia verdade". O que as IDEs
    têm de'
  - '[PAGE 25]


    complicadas elas têm recursos para tornar o desenvolvimento mais ágil.


    Muitas pessoas entram na briga hoje IDE vs. editores de texto justamente porque
    os editores também possuem quase tudo que precisamos para performar bem, mas isso
    é uma escolha muito pessoal. Devemos testar cada opção e ver qual delas saímos
    melhor de acordo com o nosso contexto. A ser que a linguagem de programação com
    que formos trabalhar necessite de IDEs por da daidade de escrita de código e sejamos
    obrigados(as) a utilizá-la sem a opção de testar os editores.


    Então, para escrever um programa, tudo o que precisamos é de uma pessoa com conhecimento
    em programação, uma ideia ou problema, um computador e um editor de textos ou
    IDE. A pessoa vai escrever o código-fonte e distribuir este código de alguma maneira.


    De acordo com nos aprofundamos neste universo vamos percebendo que programação
    de computadores não é algo tão complicado como é pintado por aí.


    # 1.5 Como um programa é distribuído


    Como já vimos, existem diversos ambientes/plataformas de execução de programas.
    Podemos rodar um programa em um sistema operacional no nosso computador pessoal,
    em um servidor na internet, em um supercomputador, em placas eletrônicas, em televisores,
    em smartphones e em locais que nem sequ poderíamos imaginar que roda um software.


    Cada plataforma tem suas peculiaridades e a forma como um programa é enviado para
    cada uma difere um pouco ou muito de acordo com elas.'
  - '[PAGE 26]


    Vamos explorar agora como um programa é empacotado e enviado para vários lugares.
    Como um programa é distribuído para nós, usuários, instalarmos ou usarmos.


    Visando não fazer um compilado muito grande e acabarmos viajando por muito conteúdo,
    vamos separar por partes: primeiro veremos sistemas Web e websites, em seguida
    sobre desktop e mobile (apps Android e iOS), que são as áreas mais palpáveis para
    nós, pessoas comuns.


    Porém, antes disso, vamos entender qual a diferença de sistema, software ou aplicativo,
    não são a mesma coisa.


    # Sistema, software ou aplicativo


    Nosso editor de textos favorito é nada mais, nada menos, que um software. Ele
    é chamado de software porque sua função é limitada a edição de texto. Ele faz
    somente uma coisa.


    Não é o que o software faz define que ele é um software, mas o fato de possuir
    apenas uma função. Um software pode fazer algo bem simples ou algo muito complexo.
    Se é um programa de gerenciamento de estoque de uma loja e gerencia entradas e
    saídas pode ser chamado de software e se for um programa que roda na máquina uma
    sala de cirurgia para analisar cada vértebra fazer uma incisão, também é um software.


    Um sistema, por sua vez, é um conjunto de softwares. O nosso Android/iOS ou nosso
    Windows/Linux/Mac são sistemas. Sistemas operacionais que controlam o computador.
    No exemplo de um sistema operacional, o mesmo controla milhares de outros softwares,
    pois gerencia o som, o display, o teclado, as entradas e saídas, o que é exibido
    no display, a navegação na internet, a conexão com outros sistemas etc.


    Imagine um sistema completo que gerencia toda uma empresa, um ERP (Enterprise
    Resource Planning), sistemas completos de gestão empresarial). Ele possui controle
    de estoque, controle financeiro,'
  - '[PAGE 27]


    gerenciamento de pessoas, controle de caixa etc. Cada parte deste sistema é um
    software, um módulo do sistema, e que poderia até existir sozinho, porém faz parte
    de um todo e esse todo é o sistema.


    O autor André Luis também explica a sutil diferença entre software e sistema da
    seguinte maneira no portal Profissionais TI:


    > "Escrevemos linhas de código na nossa ferramenta de desenvolvimento e compilamos
    os arquivos para gerar um executável, certo? Esse executável (também conhecido
    como artefato) é o que chamamos de software. Em outras palavras, o programa que
    será instalado no computador do usuário e disponibilizado para uso. Mas não é
    só isso! O termo “software” ainda engloba os arquivos que serão distribuídos com
    o executável, como bibliotecas, banco de dados, demais arquivos de configuração
    e, claro, a documentação do programa. O sistema, por uma vez, é um conjunto de
    softwares que interagem para atingir um objetivo em comum. Portanto, quando mencionamos
    “sistema”, estamos referindo a uma solução abrangente que envolve várias partes
    interligadas, oferecendo um composto de funcionalidades para atender as necessidades
    do usuário." (http://bit.ly/software-e-sistema)


    Executável, que é falado no texto do André, significa que o arquivo foi compilado
    e pode rodar no nosso sistema operacional. Ou seja, um executável é um programa
    para funcionar.


    Já o termo aplicativo ganhou fama como sendo algo específico para celulares, porém
    não é bem assim. Aplicativo ou aplicação é um software com uma função. Ou seja,
    um aplicativo é um software. Se falarmos aplicativo de celular, então estamos
    nos referindo a um programa com especialidade única que roda em um sistema operacional
    de celular.


    Não é errado falar aplicativo de celular ou aplicação web, o mercado adotou esses
    termos e todo mundo entende quando os utilizamos.'
  - '[PAGE 28]


    Basicamente os termos vêm sempre de afunilando até chegar a raiz que é software
    e sistema. Independente da forma como as pessoas chamam o programa ou sistema
    que estão desenvolvendo, você agora sabe que tudo, no fim das contas, ou é um
    software ou um sistema.


    # Sistemas Web e websites


    A internet é uma plataforma imensa. A maioria das coisas, hoje em dia, se conecta
    na internet e com isso executam as mais diversas tarefas possíveis. Podemos coletar
    dados de uso do automóvel para pensar em como melhorar a engenharia por trás do
    veículo ou estradas ou executar bloqueio de aparelhos celulares em caso de furto.
    Mas a maior aplicação do uso da internet é para sistemas Web e websites, vamos
    entender como eles funcionam.


    Programas escritos para rodar na internet podem ser enviados para o usuário por
    meio do navegador ou para servidores na internet. O que é executado no navegador
    é chamado pelo mercado de aplicação Web front-end, e o que é executado no servidor
    é chamado de aplicação Web back-end.


    Navegador é o software que utilizamos para navegar na internet, como o Google
    Chrome ou Mozilla Firefox.


    Já o servidor é um computador conectado na internet com tarefas específicas, como
    servir páginas web, enviar dados para o usuário, para outro servidor ou executar
    uma tarefa sem comando do usuário.


    Esse modelo de funcionamento com um servidor e uma aplicação que consome os recursos
    deste servidor é conhecido como arquitetura cliente-servidor e serve para distribuir
    tarefas entre computadores. O cliente, neste contexto é nossa aplicação front-end,
    executa algumas tarefas no computador do usuário e o servidor é responsável por
    executar outras tarefas.


    O modelo cliente-servidor para aplicações Web não é específico da internet, a
    nossa rede mundial de computadores, mas é um modelo'
