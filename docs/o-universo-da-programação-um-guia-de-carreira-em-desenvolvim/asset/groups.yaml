    ## 8.5 Usando empregos ruins como propulsores


    O primeiro emprego ou os nossos empregos atuais não serão os últimos de carreira,
    provavelmente. Empregos ruins farão parte da nossa vida, afinal nem sempre vamos
    acertar ou nem sempre teremos as habilidades necessárias para o melhor emprego
    em um momento.


    Conseguir um emprego legal pode variar dependendo da nossa capacitação assim do
    nosso momento de vida. Às vezes passamos por momentos de vida em que precisamos
    recorrer a uma oportunidade não muito boa para mantermos, afinal todos pagamos
    boletos, mas como extrair coisas boas de empregos ruins?


    Em toda oportunidade podemos aprender algo novo. Em toda empresa existem pessoas
    que podem nos ensinar alguma coisa, nem que seja sem querer. Às vezes aprendemos
    por osmose, só por estar perto de alguém que trabalha bem. Por isso existe uma
    premissa que é constantemente disseminada nas palestras sobre: “não seja a melhor
    pessoa de uma equipe”. Quando somos iniciantes ou somos melhores em algo podemos
    aprender muito com as pessoas de qualquer empresa!

