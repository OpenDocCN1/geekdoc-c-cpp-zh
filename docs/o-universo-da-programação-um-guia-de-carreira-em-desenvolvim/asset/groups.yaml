    conheceremos de acordo com que nos envolvem mais com comunidades.


    Isso tudo não passam de estereótipos replicados pela mídia ou por pessoas que
    acham que esse comportamento é legal, mas a realidade é que nem toda pessoa desenvolvedora
    de software precisa sofrer com esses comportamentos, muito pelo contrário. Uma
    pessoa que não dorme, se mal ou vive às custas de cafeína não será a melhor pessoa
    desenvolvedora de softwares, somente uma pessoa com problemas de saúde que trabalha
    com programação.


    O mesmo podemos afirmar sobre linguagens de alto ou baixo nível, uso do sistema
    operacional mais complicado de usar. Isso não nos define como bons profissionais
    ou como pessoas inteligentes do que a maioria das pessoas. É só uma decisão pessoal,
    de mercado ou necessidade especial dependendo da plataforma na qual trabalhamos.
    Então, não. Ninguém que deseja aprender a programar ou trabalhar com desenvolvimento
    de software precisa sofrer todo dia para ser o(a) melhor profissional que existe.


    ## 5.6 Conclusão


    Ainda surgir outras questões durante nossa carreira, mas temos que analisar tirar
    com muita criticidade, levar em conta o nosso contexto pessoal e até história
    de vida para tomar as decisões.


    Sempre que encontrarmos alguém dizendo que precisamos fazer exatamente uma coisa,
    devemos tomar cuidado. Não existem verdades absolutas, de pontos de vista diferentes
    relacionados com cada pessoa. Devemos utilizar do nosso senso analítico e sempre
    pesquisar de várias fontes para conseguir bons insumos para nossas tomadas de
    decisão.


    Neste capítulo focamos em tirar do caminho as dúvidas técnicas. Para o próximo
    capítulo vamos aprender mais e tirar dúvidas não técnicas, como: como saber se
    uma informação é boa, como controlar nossa ansiedade para manter o foco, como
    se proteger de verdades absolutas e até como fazer boas perguntas internet para
    que nossa inserção no universo da programação seja ainda mais fácil.


    ## CAPÍTULO 6

    ### Habilidades de sobrevivência no universo da programação


    Em nossa vida, precisamos adquirir certas habilidades especiais para resistir
    a alguns acontecimentos, como buscamos a resiliência para aqueles momentos de
    adversidade, ou habilidades de comunicação para conseguirmos uma boa convivência
    em sociedade.


    Na área de tecnologia existem algumas habilidades especiais que acredito que precisamos
    adquirir para que coisas assim não nos atrapalhem, como a ansiedade, o medo de
    arriscar algo novo ou simplesmente para que aprendamos mais rápido e consigamos
    acompanhar o mercado. Também acho importante que busquemos ter mais criticidade
    com o conteúdo que consumimos e existem algumas técnicas para conquistarmos essa
    produtividade da qual tanto corremos atrás.


    Essas técnicas e conselhos podem nos ajudar para o resto da vida, tanto no aspecto
    profissional quanto em outras áreas da nossa vida e eu as aprendi durante minha
    busca pelo equilíbrio profissional e pessoal por meio de palestras que assisti,
    livros e cursos. Acho muito importante compartilhar essa informação para que todos
    tenhamos a mesma oportunidade de crescer na área de desenvolvimento de maneira
    menos “atribulada.


    ## 6.1 Sobrevivendo a uma chuva de informações


    A carreira de uma pessoa desenvolvedora de software é cercada por pesquisa e estudo
    constante. Durante nossas pesquisas vamos encontrar muito conteúdo repetido, muito
    texto pouco explicativo e muita informação espalhada em diversas fontes. Podem
    ser livros, artigos, vídeos, e-books, posts em redes sociais etc. e podem não
    ser boas fontes de conteúdo.


    Uma pessoa pode escrever um artigo dizendo que a tecnologia X é a melhor tecnologia
    do universo, enquanto outra pessoa pode dizer que isso não presta. O mesmo acontece
    com os livros, no mesmo assunto pode ser ensinado de diversas maneiras e podemos
    nos confundir. Qual pessoa está falando o modo correto de se trabalhar, de programar,
    de pensar na nossa carreira?


    Talvez a resposta seja: todas elas. Todas as pessoas estão falando o modo certo
    **para elas**. Elas estão falando da perspectiva delas, com a história que elas
    carregam, seu contexto social, suas práticas familiares, com o que aprenderam
    na escola, em curso, em faculdade. Estão falando com base no seu próprio contexto
    e o contexto de outras pessoas e muitas vezes não levam em consideração o por
    isso pode acontecer nos nossos atrapalharmos do crescermos seguindo certos conselhos
    que recebemos nos artigos ou via redes sociais de alguns profissionais influencers
    do mercado de programação.


    Cada pessoa aprende de um jeito e, na grande maioria das vezes, desse mesmo jeito
    ela transmite o conhecimento para o próximo. Pode não ser o melhor modo de aprender
    ou de ensinar, mas para que ela serviu e **ela acredita que esse é o correto**.


    Para que esse monte de conteúdo repetido e espalhado não nos atrapalhe, devemos
    procurar o conteúdo mais relevante. A pessoa que compartilha a informação demonstra
    domínio daquilo que está ensinando? O conteúdo está bem estruturado de maneira
    que uma pessoa no nosso nível de conhecimento atual consiga entender? são perguntas
    essenciais para que possamos confiar no que estamos consumindo.


    ## **Como saber se um conteúdo está bem estruturado**


    Quando estamos começando a estudar algo comum que não entendamos todos os termos
