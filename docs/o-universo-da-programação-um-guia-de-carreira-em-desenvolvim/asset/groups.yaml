    我在这里收集了我为我的导师对象提供的建议，因此这些建议适用于任何背景，也适用于编程领域内的任何方向，如前端、后端、全栈、移动端、游戏、工程和数据分析等（如果你不熟悉这些术语，不用担心，我会为你解释这一切）。


    ## 概述


    我们从一个初始点出发，假设读者甚至不知道什么是编程，内容将涵盖不同的职业领域、获取第一份工作的建议，一直到学习如何成为一名全才全备的专业人士。


    ## 第 1 章


    我们将了解编程世界的基础知识，即：什么是编程、软件开发人员是做什么的、程序是如何创建的，以及这些程序是如何传达给我们最终用户的。


    ## 第 2 章


    我们将理解到，编程不仅是一份职业，当我们学习到这一点时，我们还有许多其他选择，既可以在公司工作，也可以创建我们自己的业务。


    ## 第 3 章


    我们将通过打破一些刻板印象来揭开软件开发领域的神秘面纱，真正理解专业从事编程的人具有什么样的特质，以及他们的日常生活是怎样的。


    ## 第 4 章


    这是本书最重要的章节之一，在这里我们认识软件开发中不同的发展领域。我们还学习了所有领域的共同点，并获得了关于如何选择编程作为我们未来方向的建议。


    ## 第 5 章


    到这里，读者已经在脑海中产生了许多其他问题，并且进行了大量的搜索（如果遵循了我的建议），他们可能变得比开始阅读时更加迷茫，因此我们回来回答一些在互联网上遇到的未完全解决的问题。


    ## 第 6 章


    在本章中，我们将学习如何通过良好的时间管理和情绪智能，来学习我们正在发现的、未来需要放入简历中的所有内容。


    ## 第 7 章


    我们将认识软件开发社区，并学习如何与这些小组互动以更快地学习，此外理解向这些空间贡献的必要性以及如何进行贡献。


    ## 第 8 章


    在本章中，我们总结了目前所学的一切，并可以开始规划我们的职业。为此，我们学习了如何破解招聘职位的神秘感、识别良好的工作机会、如何在从未正式在公司工作过的情况下获得工作经验，甚至了解编程领域的薪资以防掉入陷阱。


    ## 第 9 章


    在书的倒数第二章中，我们将了解为了成为更优秀的专业人士并在我们的职业生涯中走得更远，需要学习的内容。


    ## 第 10 章


    最后一章旨在为那些即将开启编程宇宙之旅的人提供我的个人建议。


    ## 第 1 章

    广大的编程宇宙导论


    软件开发不再仅仅是一个工作领域，而是一个真正的宇宙。有如此多的领域选择、如此多不同的技术和平台供选择，以至于很容易在信息的洪流中迷失方向。最有趣的是，这是一个不断扩张的宇宙，总是有在变化，而且变化之快，以至于我们似乎永远无法理解所听到的关于该领域的所有内容。这确保了总有新东西让我们学习。


    本章是对软件开发领域总括的介绍。在这里我们甚至还不知道计算机编程的本质，因为我们将在本章中学习每一项内容的含义。我们将发现软件究竟是什么，它们是如何开发的，以及它们是如何分发到我们的计算机和手持设备的。


    在接下来的章节中，我们将深入探讨由于技术进步与人类未来的话题。我们将揭开程序员这一职业的神秘面纱，认识作为程序员选择发展领域的不同路径，并获得所需的技能和知识，以便在职业生涯中走得更远。


    ### 1.1 一切始于计算机之前


    为了能够在这个宇宙中旅行，我们的入门训练部分内容包括了解这一知识领域最基础的背景，它始于第一台计算机出现很久以前。没错：编程存在于计算机之前。


    基于编程就是编写软件，而软件是机器读取的指令这一假设，那么我们首先一种机器能听懂的语言（我们将在书的后部分讨论这个）。这种“语言”就是所谓的编程语言。而这些语言出现于
    1842 年至 1843 年之间，正如我们在维基百科的“编程语言历史”中所看到的：


    > “编程语言早于第一台现代计算机的出现。最初，语言仅仅是代码。在 1842-1843 年间的九个月里，艾达·洛芙莱斯（Ada Lovelace）翻译了意大利数学家路易吉·梅纳布雷亚（Luigi
    Menabrea）关于查尔斯·巴贝（Charles Babbage）提出的新机器——分析机的记忆。在文中，她附了一系列注释，详细说明了使用该机器计算伯努利数的方法，这被一些历史学家认为是世界上第一个计算机程序。”


    而第一台名为 Z1 的计算机直到 1936 年才出现，它由德国工程师康拉德·泽泽（Konrad Zuse）建造，他通过继电器执行计算并从磁带读取数据来组装计算机。因此，在开始，编程语言用于编写打孔卡，借此能够在更短的时间内解决复杂的计算，这对于人类未来来说是一件强大的武器。


    从那时起，编程领域发展如此迅速，出现了如此多的编程语言，以至于在它们之间迷失方向是非常常见的，以及那些正在出生的职业。


    ### 1.2 什么是编程


    我们是否曾在电视、广播、互联网上的文章或不同主题的书籍中听或读过这些术语：


    - 编程

    - 程序员

    - 黑客

    - 软件

    - 系统

    - 应用程序


    技术越来越受到关注，媒体也明确表达了编程是一个未来会有巨大需求的领域——实际上，现在（2018年）就有巨大的需求了。


    正如我们从 Google Trends 图表中确认的，“编程”一词从 2004 年开始增长，并在媒体上发生与主题相关的事件时引起人们的关注，例如在电影《社交网络》上映期间，2010
    年，图表正在上升，开始下降，紧接着 2010 年 12 月电影上映后，再次上升。


    ![](img/1980cd0900b9cb84feb62a3cc0d390f3_15_0.png)


    图 1.1：编程搜索 Google Trends


    当然，将互联网上特定术词的搜索量归于某部电影上映是我方面的推测。但有些人们在看了这部电影后想要创建一个社交网络，为此他们必须研究该主题，从而增加了搜索量。


    当我们关注人们对“计算机编程”的兴趣时，情况也是如此。


    ![](img/1980cd0900b9cb84feb62a3cc0d390f3_15_1.png)


    图 1.2：计算机编程搜索 Google Trends


    以及当我们搜索人们对“创建应用程序”的兴趣时：


