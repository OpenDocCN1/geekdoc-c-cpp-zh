    ## 3.6 O dia a dia de quem escreve programas: rotina de trabalho


    Outro estereótipo extremamente disseminado é a figura da pessoa programadora do
    Google. No filme Os estagiários, vemos um pouco da realidade da empresa que é
    sonho de muitas pessoas. Mas, será que toda empresa de tecnologia é igual ao Google
    com tudo colorido, melhores computadores para trabalhar e metodologias de RH superinovadoras?


    Quando as pessoas veem algo desse tipo começam a mistificar a área. Acham que
    uma pessoa desenvolvedora não tem horário a cumprir, não tem carteira assinada
    firmando compromisso com a empresa, mas é muito pelo contrário.


    Temos, sim, carga horária de trabalho, porém as empresas já perceberam que o horário
    flexível é mais produtivo, então a maioria (não todas) permite que os funcionários
    entrem e saiam em horários alternativos.


    Também temos carteira assinada, como qualquer profissão, a não ser que seja uma
    pessoa que trabalha no modelo PJ (pessoa jurídica), no qual teremos prestador
    ou prestadora de serviço e um contrato diferente com cada empresa.


    E como será que chegam as demandas de serviço para o pessoal de desenvolvimento?


    Cada empresa ou até mesmo equipe dentro de uma mesma empresa pode ter um modelo
    de trabalho diferente. Algumas possuem um sistema de chamados, no que alguém cadastra
    o que precisa ser feito ou corrigido e as pessoas são marcadas para resolver.
    Outras possuem modelos ágeis de trabalho e utilizam algum software onde lista
    tudo o que precisa ser feito e a pessoa vai procurar uma tarefa.


    Uma tarefa pode ser algo como "criar a tela de cadastro de usuários do sistema
    x", "adicionar os dados de estorno do cartão de crédito no retorno do sistema",
    "criar um relatório xyz" ou "corrigir erro 0x000yz que aparece quando o usuário
    executa tal função", "corrigir tela de login que está desalinhada". Mas tudo isso
    pode variar muito de empresa para empresa.


    Em todo caso, somos pessoas normais, que têm trabalhos comuns e responsabilidades
    que todo mundo tem. Precisamos cumprir carga horária, levamos atestado médico
    (quando a empresa solicita), precisamos avisar que estamos doentes, saímos de
    férias, temos chefes (às vezes legais, às vezes não) etc. assim como qualquer
    outro trabalho formal.


    ## 3.7 Conclusão


    Vimos até aqui que, para **aprender**, não são necessárias muitas habilidades,
    nem nada de tão especial como é pintado nos estereótipos, o principal será a nossa
    força de vontade, um tempo disponível para estudo e, acima de tudo, não desistir
    de continuar aprendendo.


    Não há idade certa, ou requisito obrigatório e não existe habilidade ou elemento
    especial que somente pessoas programadoras possuem.


    É claro, com o tempo precisaremos aprofundar em assuntos que não cobrimos no começo
    dos estudos, como o inglês ou matemática, mas isso não nos impede de começar a
    aprender.


    Também percebemos que trabalhar com tecnologia não significa que seja diferente
    de tudo e que teremos nossas responsabilidades com as empresas, e as empresas,
    conosco.


    Espero que com essas respostas você esteja sentindo mais confortável para se envolver
    com o universo da programação, pois os próximos capítulos servirão para deixá-lo
    com mais vontade ainda.


    # CAPÍTULO 4


    ## Escolhendo um caminho


    A área de programação é recheada de oportunidades. Quando conhecemos as profissões
    em que podemos nos encaixar, é uma verdadeira enxurrada de caminhos diferentes.
    São tantas opções que é bem comum nós perdermos entre elas.


    Alguns caminhos são totalmente diferentes uns dos outros, pois existem áreas de
    atuação que são bem peculares, outros muito parecidos. Que podemos tomar em carreira
    possui uma gama de conhecimentos e habilidades específicas para conseguirmos performar
    nessas.

