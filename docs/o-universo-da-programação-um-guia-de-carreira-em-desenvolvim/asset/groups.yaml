    migrar de área.


    Quando somos mais jovens é uma decisão "mais fácil". Podemos largar nosso salário,
    emprego atual, às vezes até nossa cidade, e nos aventurarmos tudo de novo em outra
    área, mas quando temos muitas responsabilidades é um pouco mais complicado.


    Por isso é necessário pensar antes. Só não podemos nos deixar sempre acorrentados(as)
    a algo que não estivermos trazendo felicidade.


    Algo que sempre vai acontecer em nossa vida profissional: começamos com uma linguagem
    de programação e depois de um tempo precisamos mudar por motivo. Seja por causa
    do produto que trabalhamos, de uma mudança de empresa ou porque a nova linguagem
    é melhor para resolver um problema específico. As mudanças fazem parte da vida
    e precisamos estar preparados(as) para elas.


    Devemos sempre buscar ter resiliência, a habilidade de nos adaptarmos às mudanças.
    Essa será uma habilidade essencial para nossa carreira e até no contexto pessoal.


    ## 4.12 Conclusão


    Não existe uma profissão melhor que a outra, pois o que é bom para uma pessoa
    pode não ser legal para as demais. O que devemos levar em consideração na hora
    de escolher uma profissão é o quanto nos empolgamos ao pensar trabalhar com aquilo.
    É a afinidade e compatibilidade com a profissão.


    Será que sentiríamos orgulho de dizer, em um bate papo qualquer, que fazemos o
    que fazemos?


    Devemos analisar bem o que cada profissão faz. Podemos perguntar em fóruns, devemos
    perguntar para conhecidos(as). Temos que buscar o máximo de dados antes de cada
    decisão a se tomar quando se trata da nossa carreira.


    E mesmo depois de tanta pesquisa, podemos passar alguns anos em uma profissão
    e decidir que ela não faz mais sentido para nossa vida. Nesse caso, devemos voltar
    às pesquisas e procurar algo que nos anime novamente.


    O mais importante é: faça algo que você gosta de fazer.


    # CAPÍTULO 5

    Uma galáxia de questões mal resolvidas


    Quanto mais nos envolvemos com o mercado de trabalho em programação de computadores,
    mais dúvidas vão surgindo. Já possuímos as respostas para algumas questões, como:
    o que é um programa de computador, como é criado um programa, diferença entre
    software, sistemas e aplicações e algumas profissões em desenvolvimento de software.
    Entretanto surgiram outras, como: qual linguagem de programação aprender, qual
    faculdade fazer (se fizmos), dentre outras.


    Essas questões fazem parte da carreira de qualquer iniciante, as encontramos repetidas
    vezes em fóruns de desenvolvimento de software. Não devemos sentir mal por tal,
    as respostas exatas para todas as perguntas dependem do contexto. Porém existe
    uma maneira de saber qual a resposta certa: aprendendo a pesquisar. Vamos fazer
    isso.


    Neste capítulo, vamos aprender a pesquisar e descobrir qual linguagem de programação
    aprender, qual o melhor sistema operacional para trabalhar, qual a melhor IDE
    e todo o resto que é realmente importante entender nesse momento de nossa carreira
    como pessoas desenvolvedoras de software.


    ## 5.1 Muitas linguagens de programação, qual aprender?


    PHP, Python, Java, C#, Ruby, Elixir, Clojure, JavaScript... Essas são algumas
    das linguagens que podemos usar para programar para Web. Java, Kotlin, C e C++
    para Mobile. Python, R, F# para trabalhar com dados. Java, C, C++ e JavaScript
    para Games... São muitas opções!


    Quando damos uma pesquisa no Google por "qual linguagem de programação aprender?",
    não chegamos a nenhuma conclusão significativa que realmente norteie nossas decisões.
    Isso acontece pelo motivo cite anteriormente, o contexto. Cada pessoa vai responder
    de acordo com sua experiência de vida, pelo que passou, pela região onde mora
    e outros fatores que a levaram a tomar uma decisão.


    As linguagens são somente ferramentas para criarmos softwares para as plataformas
    onde elas podem ser executadas.


    Porque, então, existem tantas linguagens de programação? Não poderia existir somente
    uma linguagem para trabalhar em todas as áreas de desenvolvimento de software?


    De acordo com a evolução dos computadores nós ganhamos mais recursos, como mais
    memória, maior capacidade de processamento, mais armazenamento interno, mais conectividade
    e as pessoas desenvolvedoras buscam alternativas para melhor aproveit-las. As
    linguagens de programação podem ser uma ferramenta importantíssima para explorar
    mais ainda cada recurso, assim como os paradigmas de programação, que comente
    no capítulo anterior. Isso porque algumas linguagens funcionam bem para trabalhar
    com menor quantidade de memória - pois o seu código é compilado e muito otimizado
    para alcançar um baixo consumo de recursos -, enquanto outras são linguagens com
    outro foco, que consomem mais recursos, mas dão mais velocidade de.

