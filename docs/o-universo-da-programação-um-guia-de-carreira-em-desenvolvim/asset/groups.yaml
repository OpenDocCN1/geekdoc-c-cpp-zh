  mdcn: '


    旨在让你拥有高效生产工具的 IDE。


    ## 文本编辑器


    文本编辑器是简单的程序，例如 Windows 的记事本（是的，你可以用记事本编程）或 Gedit（它是 Linux 中等同于记事本的工具）。但是，为了让我们专业编程更加轻松，我们通常选择具有额外功能的编辑器，例如通过高亮编程语言使代码呈现彩色以便阅读、自动补全我们正在编写的内容，以及其他提高我们生产力的酷炫功能。


    这类文本编辑器的例子是 Atom，它是一个免费的开源编辑器，拥有许多插件，可以让它变得更强大（如果你的电脑性能不够强，它也会占用较多内存）。


    ![](img/1980cd0900b9cb84feb62a3cc0d390f3_23_0.png)


    ## IDE


    IDE 是完整的开发环境。在这些工具中，我们不仅集成了专业文本编辑器的所有优点，还拥有直接从界面连接数据库的选项、生成显示所有代码组织结构的图形模型、在 IDE
    内部显示程序行为的运行环境模拟器、开发期间的代码分析、通过命令重写文件以及更多实用工具。


    IDE 的例子是 Android Studio，它用于 Android 应用程序开发。


    ![](img/1980cd0900b9cb84feb62a3cc0d390f3_24_0.png)


    图 1.7：Android Studio 图像（摘自官网）


    观察 Android Studio 的图像，我们会发现它看起来很复杂，因为屏幕上有很多按钮。然而，这是一个“半事实”。IDE 之所以复杂，是因为它们拥有让开发更敏捷的资源。


    如今许多人陷入“IDE vs 文本编辑器”的争论，正是因为编辑器也几乎拥有我们良好运行所需的所有功能，但这是一个非常个人化的选择。我们应该测试每个选项，并根据自己的情况查看哪一个更适合我们。除非我们要使用的编程语言为了方便编写代码而必须使用
    IDE，导致我们被迫使用它而没有测试编辑器的机会。


    因此，要写一个程序，我们只需要一个具有编程知识的人、一个想法或问题、一台计算机以及一个文本编辑器或 IDE。这个人将编写源代码并以某种方式分发这些代码。


    随着我们深入这个领域，会发现计算机编程并没有像人们描绘的那样复杂。


    ## 1.5 程序是如何分发的


    正如我们所看到的，存在多种程序运行环境/运行方式。我们可以在个人电脑的操作系统上运行程序、在互联网服务器上、超级计算机上、电子板上、电视机、智能手机以及我们甚至无法想象的场所上运行软件。


    每个平台都有其特殊之处，程序发送到每个平台的方式根据这些特性会有很大或很小的差异。


    现在让我们探索程序是如何被打包并发送到各个地方的。程序是如何分发给我们这些用户，以便我们安装或使用的。


    为了不让内容过于庞大导致陷入过多的信息中，我们将分部分进行：首先我们将看 Web 系统和网站，然后是桌面端和移动端（Android 和 iOS 应用），这些是对我们普通人来说是最直观的领域。


    在此之前，让我们理解系统、软件或应用程序之间的区别，它们并不是一回事的。


    ## 系统、软件或应用程序


    我们最喜欢的文本编辑器无非就是软件。它之所以被称为软件，是因为它的功能局限于文本编辑。它只做一件事。


    定义它为软件的并不是软件做了什么，而是它仅拥有一个功能的这一。软件可以做非常简单的事情，也可以做非常复杂的事情。如果它是一个商店的库存管理程序并管理入库出库，它可以被称为软件并……


