    Como exemplo, temos o caso da linguagem Ruby que, segundo seu criador, foi criada
    para ser divertida e fluida de trabalhar. Python também é exemplo de linguagem
    interessante que possui uma filosofia de que o código deve ser fácil de ler para
    todas as pessoas.


    Se pegarmos o contexto histórico, veremos que as pessoas desenvolviam páginas
    Web utilizando a linguagem C ou Perl, mas depois a linguagem PHP facilitou o processo,
    então os desenvolvedores migraram para ela. Posteriormente vieram outras, ou ao
    mesmo tempo em que PHP ganhava fama outras linguagens começavam a aparecer no
    mercado, com a mesma proposta: melhorar a maneira como nós escrevemos nossos softwares
    ou melhorar como nosso software funciona. É por isso que existem várias linguagens
    e várias abordagens diferentes para fazer a mesma coisa, que é desenvolver software.


    A escolha da linguagem de programação deve ser pautada em:


    - nosso objetivo pessoal;

    - nosso objetivo profissional.


    Precisamos aprender a linguagem para começar a trabalhar ou queremos uma linguagem
    somente para aprender programação por hobby ou curiosidade?


