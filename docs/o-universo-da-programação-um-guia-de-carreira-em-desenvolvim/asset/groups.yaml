    ou somente por objetivos iguais. Algumas comunidades nascem em volta de tecnologias,
    como linguagens de programação, ferramentas de desenvolvimento, e outras vezes
    por um objetivo foco, como compartilhar conhecimento.


    Temos alguns exemplos de comunidades brasileiras que nasceram por um interesse
    em comum, como Python Brasil, PHP Brasil, JavaScript Brasil, Ruby Brasil, Java
    Brasil. Essas comunidades existem porque as pessoas se interessam por essas linguagens
    e querem trocar experiências, links relevantes, mostrar o que fazem e se ajudar
