    # Softwares desktop


    Desktop, quando falamos “softwares desktop”, nada mais é que o nosso computador.
    Softwares que serão executados pelo nosso sistema operacional, Windows, Linux,
    MacOS etc.


    Diferente de aplicações web, estes softwares precisam que seus códigos sejam enviados,
    instalados e executados diretamente em nossas máquinas e podem até usar dados
    compartilhados por um servidor Web ou não.


    Estes códigos são armazenados em alguma pasta do sistema operacional ou cada sistema
    operacional pode tratar de uma maneira distinta. No Windows teríamos os programas
    instalados na pasta C:\Arquivos de Programas\WindowsApps e em sistemas baseados
    em UNIX, como Linux e MacOS, temos os programas espalhados de acordo com a sua
    especialização.


    Vamos analisar um exemplo: nosso editor de textos Atom.


    As pessoas escrevem seu código-fonte e em seguida esse este código é compilado
    e transformado em um executável. Este executável é enviado para o nosso sistema
    operacional e nosso sistema pode, então, instalar e rodar o editor de acordo com
    suas especificações.


    Se acessarmos o site do Atom (http://bit.ly/atom-editor), veremos que ele é um
    software de código aberto. Isso significa que o código-'
