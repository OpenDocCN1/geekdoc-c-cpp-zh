    o conteúdo e formular perguntas sobre isso fará com que nosso cérebro trabalhe
    em dobro em vez de estamos aprendendo.


    Colocar em prática o que aprendemos também é extremamente importante, principalmente
    quando falamos de programação. Claro que não dá para colocar tudo em prática...
    Não é todo mundo que pode colocar o foguete em órbita ou possui peças para criar
    um robô. Quando estudamos programação podemos sempre acrescentar a prática em
    nossa rotina de estudos.


    Tal criar um sistema, um aplicativo ou qualquer coisa com a linguagem de programação
    que acabou de aprender?


    Colocar em prática nos ajuda a ir além do material básico de estudos, aquele que
    você planeja e criou um caminho perfeito para ser seguido, que eu chamo de caminho
    do arco-íris, que nos leva diretamente ao pote de ouro, mas que não apresenta
    desafio algum ou que os desafios são previsíveis. Quando praticamos aparecem problemas
    que nunca imaginaríamos encontrar e o esforço para solucionar estes problemas
    aumenta muito nosso conhecimento.


    ## 4. Técnicas de estudos


    Cada pessoa usa um modo de produtividade diferente. Algumas são produtivas de
    manhã, outras à tarde, outras não. Algumas pessoas consegu estudar no ônibus em
    movimento, outras não. Outras conseguem aprender tudo rápido até com vídeos em
    velocidade 5x, outras precisam ver repetir várias vezes.


    Existem técnicas de estudos que podem nos auxiliar a aprender, mas também é importante
    identificar qual é o horário em que cada um de nós aproveitamos melhor os estudos.
    Precisamos pesquisar e testar o máximo de técnicas e horários de estudos possíveis
    para conseguirmos algo que seja eficaz em nosso contexto.


    Algumas técnicas conhecidas que podemos pesquisar e testar são:


    - 1. Mapa mental;

    - 2. Fichamento ou resumo;

    - 3. Gravação de áudios;

    - 4. Resolver o máximo de exercícios possíveis;

    - 5. Estudo em grupos;

    - 6. Autoexplicação;

    - 7. Estudo intercalado;

    - 8. Repetição espaçada;

    - 9. Prática distribuída.


    Vale lembrar que essas técnicas são modelos de aprendizado ativo. O que é excelente.


    No meu caso, testei diversas técnicas e o que mais funcionou pra mim foi: fazer
    resumos, estudo em grupo, estudo intercalado, repetição espaçada e prática distribuída.
    Ou é o seguinte:


    - **Resumos:** escrevo artigos sobre o que eu estudo, que podem ser publicados
    em meu blog (https://woliveiras.com.br) ou não.

    - **Grupos de estudo:** sempre que for possível eu participo de grupos de estudos
    para trocar experiência com as pessoas e aprender mais.

    - **Estudo intercalado e prática distribuída:** normalmente estudo mais de uma
    coisa ao mesmo tempo (na mesma hora ou dia), sendo que seleciono dois dias da
    semana para um assunto (2 horas por dia seguindo os pomodoros) e dois dias de
    outro assunto. Um dia da semana eu deixo para descansar, sem contar finais de
    semana.

    - **Repetição espaçada:** de tempos em tempos eu tento revisar algo que aprendi.
    Eu não costumo escolher um tempo específico para voltar a ver, sempre que tenho
    um tempo livre eu costume revisar as coisas que escrevi ou pesquisar de novo sobre
    algo.


    Isso é o que funcionou para mim, mas o ideal é que cada pessoa exercite e aprenda
    técnicas de estudos para que consiga o melhor para o seu ritmo e estilo de vida.


    ## 5. Descansar é importante


    Sobrecargar nunca é bom. Um carro sobrecarregado não sai do lugar, um cérebro
    sobrecarregado não vai guardar as informações por muito tempo, assim como começará
    a evitar períodos de estudos, deixando-nos desconfortáveis com isso e, muito possível,
    pode começar a apresentar problemas graves.


    É importante que tenhamos hobby, pratiemos um tempo para simplesmente não fazer
    nada. De preferência que procuremos a prática de esportes para fortalecer nosso
    corpo e mente.


    O descanso e o movimento do corpo vão garantir a saúde e disposição de que precisamos
    para continuar aprendendo mais. Somente estudar ou fazer qualquer coisa sem um
    limite tirar um tempo para nós mesmos não é saudável e logo termos a fadiga de
    estar fazendo o mesmo todos os dias e do desânimo dessa rotina.


    Se por possível somando um ambiente organizado, foco, técnicas e aprendizado ativo
    com o descanso e a prática de esportes, conseguiremos uma absorção muito maior
    do que estivermos estudando. Assim que aprendemos mais em menos tempo: otimizando
    nosso tempo e cuidando da nossa saúde.


    ## 6.4 Gerenciando melhor o tempo de estudo e trabalho


    Algo nos aflige diariamente é a vontade/necessidade de estudar algo e não ter
    tempo graças à rotina de trabalho, que ocupa mais da metade do nosso tempo de
    vida. Isso atinge a grande maioria das pessoas, ainda precisamos trabalhar para
    nos manter. Felizmente nós podemos encontrar um equilíbrio entre trabalho e estudos
    se tivermos um bom planejamento da nossa rotina.


    Rotina, aqui, é a palavra-chave. Muita gente vê a palavra rotina associa a algo
    chato, ruim, monótono, porém não é isso. A rotina nos ajuda a conquistar a produtividade.
    Se tivermos tudo bem planejado e seguirmos esse plano, conseguiremos equilibrar
    nossa vida a fim de conseguirmos executar tarefas do viver sem planejamento. No
    final, vai parecer até que temos mais tempo do que as outras pessoas, mas na realidade
    só estamos usando melhor nosso tempo.


    É extremamente importante que saamos o que nos atrapalha quando pensamos em ter
    mais tempo para estudar. Será que não temos tempo útil porque o trabalho está
    ocupando todo o nosso dia ou que passamos mais tempo nas redes sociais de fazendo
    o que realmente importa para nossa vida?


    Uma maneira de acompanhar isso é fazendo listas de tarefas e, sempre que uma tarefa
    não foi cumprida na hora certa, anotar ou o porquê da falha no planejamento. Uma
    reflexão no final da noite vai nos ajudar. Lembrar o que fizemos durante o dia
    e o que tirou a nossa produtividade nos ajudará a encontrar o que realmente suga
    nosso tempo e a nos conhecermos melhor.


    Existem aplicativos que podem nos ajudar a acompanhar nosso dia a dia e descobrir
    exatamente onde gastamos nosso tempo. Eu recomendo o QualityTime e SmarterTime,
    porém podemos pesquisar na loja de aplicativos o que tem mais informações úteis
    para o nosso caso pessoal, basta procurar por time tracker.


    Utilizando o aplicativo QualityTime (http://qualitytimeapp.com) eu acompanho minha
    utilização do celular e o resultado é bem assustador quando observamos onde foi
    gasto meu tempo durante uma certa semana.


    | Weekly Usage | Tempo |

    | :--- | :--- |

    | Twitter | 59m |

    | Telegram | 51m |

    | Instagram | 31m |

