    # CAPÍTULO 1

    Uma introdução ao vasto universo da programação


    Desenvolvimento de software não é mais somente uma área de trabalho, mas um verdadeiro
    universo. São tantas opções de áreas de atuação, tantas tecnologias distintas
    e plataformas para se trabalhar, que é muito fácil se perder em meio a uma chuva
    de informação. E o mais legal é que é um universo em constante expansão, algo
    está sempre mudando e de maneira tão rápida que parece que não conseguiremos nunca
    entender tudo o que ouvimos falar sobre esta área. Isso garante que há sempre
    algo novo para aprendermos.


    Este capítulo é uma introdução à área de desenvolvimento de software no geral.
    Podemos aqui nem mesmo saber sobre natureza programação de computadores, pois
    vamos aprender neste o que é cada coisa. Vamos descobrir o que realmente é um
    software, como eles são desenvolvidos e como são distribuídos para nossos computadores
    e dispositivos portáteis.


    Nos próximos capítulos também aprofundaremos nos assuntos relacionados ao futuro
    da humanidade graças aos avanços na área de tecnologia. Vamos desmistificar a
    profissão programador(a), conhecer os diferentes caminhos para escolher nossa
    área de atuação como programador(a) e vamos adquirir habilidades e conhecimento
    para irmos mais longe em nossa carreira.


    # 1.1 Tudo começou antes do computador


    Parte do nosso treinamento introdutório para conseguirmos viajar por este universo
    consiste em conhecermos o mínimo da história'
  - '[PAGE 13]


    desta área de conhecimento, que começa muito antes do primeiro computador. Isso
    mesmo: programação existe antes do computador.


    Partindo do pressuposto de programar é escrever um software, e um software são
    instruções que são lidas pela máquina, precisamos, então, de uma linguagem que
    esta máquina entenda (vamos ver sobre isso mais à frente no livro). Este "idioma"
    são as tais linguagens de programação. E essas apareceram entre 1842 e 1843, conforme
    podemos ver na "História das linguagens de programação" na Wikipédiaédia, que
    diz:


    > "As linguagens de programação são anteriores ao advento do primeiro computador
    moderno. De início, as linguagens eram, apenas, códigos. Durante um período de
    nove meses entre 1842-1843, Ada Lovelace traduziu as memórias do matemático italiano
    Luigi Menabrea sobre a sua nova máquina proposta por Charles Babbage, a sua analítica.
    Com o artigo, ela anexou uma série de anotações que especificavam detalhe um método
    para calcular números de Bernoulli com a máquina, reconhecido por alguns historiadores
    como o primeiro programa de computador do mundo."


    E o primeiro computador, chamado Z1, veio somente em 1936, construído por Konrad
    Zuse, um engenheiro alemão que montou o computador através de relés que executavam
    os cálculos e dados lidos a partir de fitas perfuradas.


    Então, no começo, as linguagens de programação eram usadas para programar essas
    máquinas de perfurar cartões e com isso conseguiam resolver cálculos complexos
    em menor tempo do que o cérebro humano, o que seria uma potente arma de guerra
    mais para a frente na história da humanidade.


    Desde aquela época, a área de programação de computadores cresceu tão rápido e
    surgiram tantas linguagens de programação'
