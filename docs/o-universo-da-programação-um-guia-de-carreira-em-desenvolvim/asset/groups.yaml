    ## Protocolos de comunicação em rede: além do HTTP, existem diversos outros protocolos
    de comunicação em rede e o back-end de nossa aplicação tem muita responsabilidade
    nisso, pois pode precisar enviar arquivos, e-mail ou outras mensagens de outras
    maneiras por meio de protocolos específicos, como o SMTP ou FTP, que são os protocolos
    de comunicação via e-mail e transferência de arquivos respectivamente.


    ## 4.4 Infraestrutura (DevOps)


    Temos, em Tecnologia da Informação, alguns tipos de infraestrutura, como infraestrutura
    de TI, que engloba a rede física de uma empresa (os computadores, os sistemas
    e softwares instalados nessas máquinas, os equipamentos e cabos de rede), e a
    infraestrutura de aplicações, que evoluiu muito nos últimos tempos com o avanço
    da computação em nuvem e provê o sistema operacional, hardware e softwares para
    rodarmos nossa aplicação em instâncias provisionadas por alguma empresa externa,
    como a Amazon AWS ou Microsoft com o serviço Azure.


    Quando digo provisionamento, estou falando que uma empresa entrega alguns serviços
    prontos. Antigamente teríamos que uma máquina ou várias máquinas, o servidor,
    fisicamente em nossa empresa. Teríamos que instalar o sistema operacional, configurar
    os serviços, programas e instalar os servidores Web/bancos de dados/nossa aplicação,
    configurar a rede para comunicação externa a empresa. Hoje em dia não precisamos
    mais disso, basta contratarmos esse serviço com alguma empresa especializada e
    pronto! Já temos tudo pronto, com toda a segurança já planejada e a infraestrutura
    de TI em responsabilidade da provedora. Nós só precisaremos adaptar nossos sistemas
    para que trabalhem com esse modelo.


    Durante a evolução do desenvolvimento e da tecnologia, apareceu uma nova palavra
    para nosso dicionário, a palavra DevOps. DevOps não é uma profissão, mas é bem
    comum encontrarmos vagas com esse nome na descrição, até por isso coloquei esse
    nome no subtítulo desta seção. DevOps é, na realidade, um movimento/uma cultura
    que nasceu para deixar o desenvolvimento de software mais ágil juntando desenvolvimento
    (development) com operações (operations, que é a parte de cuidar da infraestrutura
    das aplicações), pois anteriormente eram coisas separadas: uma pessoa desenvolvia,
    enviava um pacote para pessoa de infra e essa seria responsável por configurar
    o servidor, instalar a versão do sistema etc., todo aquele que comentei anteriormente.


    Com a filosofia DevOps o time deve ser responsável pela infraestrutura da aplicação,
    mas em tempos onde alguém responsável pela infra, essa pessoa deverá saber muito
    sobre:


    **Automação de processos**: automação faz parte da agilidade que a cultura DevOps
    provê, pois devemos automatizar a entrega do software (enviar o nosso código para
    produção, deixar o sistema disponível para o usuário final), os processos que
    são executados antes de criar o pacote que será enviado para produção e todo o
    resto que será automatizar.


    **Cloud services**: serviços de Cloud (computação em nuvem, que é a utilização
    de recursos como memória, armazenamento, processamento externos, computadores
    conectados a internet que nos fornecem sua capacidade) que são serviços disponibilizados
    pelas empresas que atuam provisionando a infraestrutura para nossas aplicações,
    como a Amazon AWS, Microsoft Azure, Google Cloud, Heroku, IBM Cloud, etc. A pessoa
    deve conhecer bien esses provedores e os seus serviços para buscar o produto correto
    para cada necessidade de nossa aplicação, provendo economia e segurança ao nosso
    sistema.


    **Sistemas operacionais**: essa pessoa será responsável por configurar todo o
    sistema para funcionar na nuvem com seus pacotes planejados para não deixar a
    aplicação lenta, segurança e tudo para ele não pare de funcionar. Principalmente
    conhecimento em Linux, que é o sistema operacional mais utilizado em servidores.


    **Redes (configuração, funcionamento etc.)**: redes de computadores ou um conjunto
    de máquinas, computadores ou não, conectados através de meios de comunicação,
    como cabos, wireless (Wi-Fi) ou similares, essa pessoa possui essa atribuição,
    pois configurar serviços que se comunicam entre rede os sistemas e aplicações
    conectadas na nuvem.


    **Segurança da informação**: segurança é parte do processo de configuração de
    ambientes, redes, bancos de dados etc. e todo conjunto de outras funcionalidades
    dos nossos sistemas e aplicações, porém a pessoa de infraestrutura consegue aumentar
    a segurança configurando muito bem um sistema operacional e monitorando nossas
    aplicações contra ataques ou tentativas de invasão.


    **Programação**: também é necessário saber programar, afinal essa pessoa desenvolve
    e cuida da infraestrutura e a automação de processos é feita por meio de programação.


    **Integração contínua**: ferramentas de integração contínua nos auxiliam a integrar
    (juntar) o nosso código a base central de códigos para garantir que o código adicionado
    não vá “quebrar” a aplicação depois de unido com o código que já está em produção.


    **Deploy contínuo**: ferramentas de deploy contínuo são utilizadas para automatizar
    o deploy (disponibilizar nosso programa para nossos usuários, seja um site ou
    aplicativo de celular), depois de certas regras (que nós configuramos) forem satisfatórias,
    então a ferramenta trata de colocar o código em produção para a equipe.


    **Configuração de ambientes**: o ambiente, como já comentado, é onde nosso programa
    está rodando. Configuração de ambientes (local, de produção ou de testes) tem
    diferenças consideráveis de configuração e uso, pois o ambiente de produção não
    pode apresentar problemas, se não usuário ficar frustrado. O ambiente de testes
    deve ser o mais similar possível ao de produção, porém com algumas peculiaridades,
    como um hardware com menos recursos (menos memória, um processador mais fraco),
    pois tem menos acesso que o de produção. O ambiente local é não ambiente pessoal
    (nosso computador) e a pessoa responsável pela infraestrutura deve garantir que
    tudo esteja corretamente da melhor maneira possível.


    **Monitoramento de aplicações**: é uma parte importante do trabalho de infraestrutura,
    afinal essa pessoa cuida dos ambientes, ela consegue aumentar a quantidade de
    memória ou processador, se for preciso, existem diversas ferramentas e modos de
    se monitorar uma aplicação em produção ou testes, a pessoa de infra deve dominar
    elas.


    ## 4.5 Full-stack


    Alguém desempenhando o papel de full-stack consegue executar as funções de várias
    outras áreas, como front-end e back-end e infra de uma só vez. Ou seja, a pessoa
    full-stack é um(a) profissional verdadeiramente multidisciplinar.


    Enquanto front-end e back-end buscam se especializar em somente uma função ou
    área de trabalho, apesar de ter de conhecimento superficial das demais, a pessoa
    desenvolvedvolvedora full-stack busca saber sobre tudo o que envolve desenvolvimento
    de software, apesar de continuar sendo especialista em alguma área.

