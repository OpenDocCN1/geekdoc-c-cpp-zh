    então o escritor ou escritora não vai se importar tanto com linguagem mais técnica
    e exemplos quase nada de se entender para um ser humano.


    ## 6.2 Onde encontrar tudo o que preciso aprender


    Aprendemos desde muito cedo que o conhecimento é adquirido indo uma instituição
    de ensino, uma escola, ouvindo uma pessoa que

