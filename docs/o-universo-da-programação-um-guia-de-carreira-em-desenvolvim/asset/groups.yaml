    ## 4.10 Como testar cada área antes de escolher uma profissão


    Apesar de agora sabermos o que cada profissional faz e quais os conhecimentos
    necessários para cada pessoa, ainda ficam dúvidas sobre o que escolher, pois não
    temos realmente saber se gostamos de algo sem provar. certo?


    A única maneira de testar se vamos gostar de uma profissão é realmente nos envolvendo
    com ela. Devemos procurar pessoas que trabalham na área e lhes questionar sobre
    seu dia a dia, devemos começar a estudar o assunto, podemos participar de projetos
    que precisam de gente para ajudar em algo que desejamos testar (o software open
    source pode ser um excelente local para testar se iremos gostar de uma profissão),
    precisamos participar de eventos da área. E participar de comunidades já vão nos
    mostrar muito sobre a profissão que estamos pensando em nos envolver, então é
    importante tentar participar.


    Existem também competições de programação específicas por especialidade. Existem
    hackathons, que são campeonatos de um dia e muitas vezes de até mais dias. Podemos
    cair de cabeça nesses eventos e sentir na pele como criar um projeto do zero.


    Fora os hackathons presenciais, temos os recursos online, como:


    - Para **front-end** podemos olhar os projetos no Codepen (https://codepen.io/),
