    Exemplo de descrição com explicação:


    Imagine que eu tenha colocado no meu perfil (como profissional front-end) que
    trabalho/trabalhei em um e-commerce, a empresa x. Na descrição dessa citação,
    eu teria colocado algo como:


    > A empresa x é líder de vendas no Brasil e possui mais de 1 milhão de usuários
    ativos que acessam o site 24 horas por dia. Sua filosofia é baseada na cultura
    ágil e no foco em inovação, utilizando as tecnologias mais atuais para trazer
    o melhor produto ao usuário final. Eu trabalho/trabalhei na equipe de recomendações,
    na qual desenvolvo as interfaces de representação de dados e também os scripts
    para inserir os produtos recomendados na home page e nos detalhes de produtos
    do site. Meu principal desafio neste produto é criar scripts performáticos, dada
    a imensa quantidade de dados que preciso exibir na tela e o risco de travar o
    navegador com esse processamento. Minha equipe recebe as demandas vindas da área
    de negócios e trabalho em conjunto com a pessoa de design da minha equipe para
    entregarmos valor.


    Este tipo de descrição vai me ajudar em: a pessoa de recrutamento conhecerá que
    tipo de produto trabalhamos, neste caso um e-commerce com grande volume de acessos
    e líder de mercado, passando a sensação de que sabemos o peso de uma mudança brusca
    no sistema ou uma queda da plataforma; assim saberá também como era o trabalho
    em equipe nessa empresa, já que já comentamos como as demandas chegam e como é
    a interação no time. Também conhecerá um pouco mais sobre o que dominamos tecnicamente,
    já que já colocamos qual a dificuldade técnica temos no dia a dia.


    Claro que nesse exemplo coloquei muito texto, mas é para demonstrar que podemos
    explicar melhor o que fazemos em uma determinada posição de trabalho. Devemos
    tentar ser o mais direto possível.


    Exemplo da mesma descrição, porém com menos texto:


    A empresa x é um e-commerce líder de mercado, com cultura ágil e foco em produtos
    inovadores. Eu trabalho/trabalhei na equipe de recomendações, onde desenvolvo
    interfaces de representação de dados e scripts de inserção de recomendações na
    home e nos detalhes de produtos, com demandas dos times de design e negócios.


    Uma descrição dessas, além de facilitar o trabalho de reconhecimento das nossas
    habilidades, ainda ajuda as pessoas a entenderem melhor o que realmente fazemos
    no desenvolvimento de software.


    ## 8.3 Desmistificando vagas de emprego e escapando de ciladas


    As vagas de emprego na área de desenvolvimento podem assustar muito, no início
    da carreira, pois, além de a maioria dizer que procura pessoas com experiência,
    ainda temos os requisitos técnicos em forma de listas imensas.


    Já adianto que não devemos assustar com isso. Não precisamos ter todos os requisitos
    de uma descrição para nos candidatarmos a uma vaga. É a crença de que é necessário
    preencher 100% dos requisitos que nos limita e faz com que não enviemos o currículo
    para uma vaga com a qual sonamos.


    Quando a pessoa de recrutamento entrar em contato conosco, ela confirmará o que
    sabemos e o que não sabemos. Se não cumprimos todos os requisitos, o importante
    nesse contato é demonstrar que temos interesse em aprender o que não dominamos
    daquela lista de requisitos e a empresa, se tiver uma boa cultura e estiver em
    um bom momento de contratação (quando não estiverem desesperados por profissionais
    nível sênior para apagar incêndios nos softwares), pode acabar nos contratando
    e ajudando a desenvolver o que falta.


    O grande risco das vagas de programação, que podemos identificar diretamente nas
    próprias descrições, são as vagas para uma determinada função que pedem habilidades
    de outra, nada parecida com o que fazemos.


    Exemplo: existe uma vaga para o perfil front-end, mas quando analisamos os requisitos,
    vemos que, na realidade, o que a empresa procura é alguém full-stack. Sabemos,
    pelos capítulos anteriores, que front-end tem uma atribuição e full-stack tem
    outra.


    ![](img/1980cd0900b9cb84feb62a3cc0d390f3_154_0.png)


    Na imagem vemos que o título é front-end, mas na descrição fala especificamente
    de full-stack e tem como requisitos bancos de dados e tecnologias de back-end.
    Habilidades que não deveriam ser cobradas de uma pessoa que iria trabalhar apenas
    com front-end.


    Esse título não condizer com a descrição da vaga pode ser um erro da área de recursos
    humanos da empresa ou uma vaga "cilada", aquela que recebemos 1x por termos registro
    em carteira com uma profissão, mas deveríamos receber 3x, pois desempenhamos outra
    função.


    Não tem como adivinhar qual é a real intenção de quem escreveu a vaga e partirmos
    do pressuposto de que alguém errou no cadastro, mas é muito importante questionar
    qual a real atribuição de quem irá desempenhar isso dentro da empresa. Quando
    a pessoa de recrutamento entrar em contato conosco, devemos questionar bastante
    para descobrir isso; se for uma vaga cilada, decimos que não estamos interessados
    no momento.


