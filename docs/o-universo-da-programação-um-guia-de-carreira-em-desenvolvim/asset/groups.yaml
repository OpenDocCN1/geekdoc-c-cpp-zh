    tempo para aprendermos este idioma, pois vamos vamos utilizá-lo para tudo em nossa
    carreira.


    Desde estudo até uma reunião com um time estrangeiro ou uma entrevista de emprego,
    o inglês abre muitas portas em nossa vida profissional.


    Existe um projeto muito bonito que ajuda as pessoas que têm condições de estudar
    o idioma imediatamente a se manterem atualizadas e continuarem estudando programação
    mais e mais, que é o devtranslate (https://medium.com/devtranslate/). Mas, mesmo
    assim, é ideal priorizarmos o inglês em algum momento de nossas vidas.


    Alguns aplicativos e plataformas podem nos ajudar a aprender o idioma, seja no
    caminho para o trabalho (no transporte público ou não), assim como para praticar
    mais, para aprendermos mais rápido.


    +   - Duolingo (https://duolingo.com/)

    - italki (https://italki.com/)

    - Tandem (https://tandem.net/)

    - OpenTalk (https://getopentalk.com/)


    # 9.8 Livros cuja leitura deveria ser lei


    Fora os livros técnicos e conteúdo extremamente direcionado ao código nós somos
    pessoas e, como pessoas, temos nossos problemas que não são resolvidos com mais
    leitura sobre programação.'
- md: '

    Sempre que alguém me diz que estuda programação há dois anos e não se sente confortável
    para aplicar em uma vaga ou que se sente em posição desigual a outras pessoas
    que estudam ao mesmo tempo eu questiono sobre a prática.


    - Você tem praticado bastante?


    Quando a resposta é sim, logo percebemos que o problema da pessoa não está em
    programação, mas em sua própria autoestima ou insegurança. Para isso não existem
    cursos técnicos ou livros sobre códigos que vão nos ajudar, precisamos aprender
    a nos entender e nos avaliar.


    Existem obras perfeitas para isso e que servem para todo tipo de problema que
    vamos passar nas carreiras. Vamos conhecer alguns.


    1. O programador apaixonado, por Chad Fowler (https://www.casadocodigo.com.br/products/livro-programador-apaixonado/)

    2. O guia do mestre programador, por Carlos Bueno (https://www.casadocodigo.com.br/products/livro-guia-mestre-programador)

    3. Foco, por Daniel Goleman (https://www.amazon.com.br/8539005352/)

    4. Inteligência emocional, por Daniel Goleman (https://www.amazon.com.br/Inteligência-Emocional-Daniel-Goleman/dp/8573020806/)

    5. O poder do hábito, por Charles Duhigg (https://www.amazon.com.br/Poder-do-Habito-Charles-Duhigg/dp/8539004119/)

    6. O poder da ação, por Paulo Vieira (https://www.amazon.com.br/Poder-Ação-Ph-D-Paulo-Vieira/dp/85452033X/)

    7. Rápido e devagar, duas formas de pensar, por Daniel Kahneman (https://www.amazon.com.br/Rápido-Devagar-Daniel-Kahneman/dp/853900383X/)

    8. Atenção plena: Mindfulness, por Mark Williams (https://www.amazon.com.br/Atenção-Plena-Mindfulness-Mark-Williams/dp/8543101875/)

    9. Por que fazemos o que fazemos?, por Mario Sergio Cortella (https://www.amazon.com.br/Por-que-Fazemos/dp/8542207416/)

    10. O cérebro de alta performance, por Fernando Garcia (https://www.amazon.com.br/cérebro-alta-performance-Fernando-Garcia/dp/8573129085/)

    11. Produtividade para quem quer tempo, por Geronimo Theml (https://www.amazon.com.br/Produtividade-para-quem-quer-tempo/dp/8545200978/)

    12. Ansiedade, por Augusto Cury (https://www.amazon.com.br/Ansiedade-Augusto-Cury/dp/8502218484/)

    13. O Princípio 80/20. Os segredos para conseguir mais com menos, por Richard
    Koch (https://www.amazon.com.br/Principio-Segredos-Para-Conseguir-Menos/dp/858235259X/)

    14. A Mente Organizada. Como pensar com clareza na Era da sobrecarga de informação,
    por Daniel J. Levin (https://www.amazon.com.br/Organizada-Pensar-Clareza-Sobrecarga-Informação/dp/8539006995/)

    15. A arte da meditação, por Daniel Goleman (https://www.amazon.com.br/Arte-Meditação-Autoestima-CD/dp/8575421867/)


    Parecem muitos títulos para lermos de uma só vez, porém importantes para aprendermos
    a equilibrar as nossas vidas, quando entendemos cada vez mais e conquistarmos
    uma qualidade de vida maior. Podemos aproveitar as dicas de produtividade que
    apresentei até aqui para consumirmos o conteúdo desses livros.


    Deles, os mais importantes para a nossa área, são: O programador apaixonado e
    O guia do melhor programador. Então, se você não quiser ler os demais, leia pelo
    menos esses dois em complemento a ao que aprendemos até aqui.


    Tendo nos preparado melhor psicologicamente, podemos agora buscar entender um
    pouco mais de desenvolvimento com livros técnicos avançados:


    1. Refactoring: Improving the Design of Existing Code, por Martin Fowler, Kent
    Beck e John Brant (https://www.amazon.com.br/Refactoring-Improving-Design-Existing-Code/dp/0201485672/)

    2. Domain Driven Design, por Eric Evans (https://www.amazon.com.br/Domain-Driven-Design-Tackling-Complexity-Software/dp/0321125251/)

    3. Padrões de Arquitetura de Aplicações Corporativas, por Martin Fowler (https://www.amazon.com.br/Padr%C3%B5es-Arquitetura-Aplica%C3%A7%C3%B5es-Corporativas-Martin/dp/853630638/)

    4. Refatoração para Padrões, por Joshua Kievsky (https://www.amazon.com.br/Refatoracao-Padroes-Portuguesse-Joshua-Kievsky-ebook/dp/B019HiOO22C/)

    5. Clean Code: A Handbook of Agile Software Craftsmanship, por Robert C. Martin,
    Michael C. Feathers e Timothy R.Ottinger (https://www.amazon.com.br/Clean-Code-Handbook-Software-Craftsmanship/dp/0132350882/)


    ## 9.9 Conclusão


    Aprendemos muito durante a leitura deste livro e agora recebemos materiais e dicas
    para aprender mais ainda e irmos mais longe em nossa jornada pelo universo da
    programação.


    Devemos evitar negligenciar os temas que vimos que são importantes, por mais que,
    vezes, estudar estes temas seja meio maçante. Todo esse trabalho vai auxiliar
    a nos tornarmos profissionais melhores e para que tenhamos habilidades para ir
    mais longe em nossa carreira.


    ## CAPÍTULO 10

    ### Considerações finais


    Nossa jornada nesta área fantástica, que é o universo da programação, somente
    começou com os conhecimentos que adquirimos até aqui.


    Nós temos em mãos, agora, o conhecimento básico e a inspiração para entrarmos
    na área de desenvolvimento de uma vez por todas, aprender o máximo e conseguir
    nosso emprego (ou mesmo trabalhar por conta).


    Nenhum grande sonho é alcançado facilmente, mas não será tão difícil alcançar
    a maestria em programação. A grande dificuldade daqui está em removermos os limites
    que nós mesmos colocamos em nossa vida, que é a falta de disciplina, falta de
    confiança e até aquela preguiça de estudar.


    Outra grande barreira é a social. Sabemos que nem todo mundo possui recursos financeiros
    para comprar um bom curso de programação, como os da Caelum ou Alura, ou os livros
    da nossa área que eu indiquei no capítulo anterior e que, muitas vezes, passam
    da casa dos 80 reais.


    Mas não desista e desanime por isso! Busque conteúdo gratuito na internet, procure
    se apoiar em comunidades de programação, procure. Em todo caso, podemos contar
    com as comunidades de desenvolvimento de software para ajudarem quando estivermos
    em apuros ou com medo de continuar investindo nosso tempo em programação.


    Caso você entenda algo que foi ensinado no livro ou discorde do que eu penso/falei,
    fique à vontade para entrar em contato comigo. Ficarei muito feliz de ouvir seu
    feedback e melhorar esta obra.


    Quero finalizar este livro com um desafio: se você conseguir seguir as dicas que
    foram dadas e conquistar seu primeiro emprego em menos de um ano, me envie um
    e-mail com o assunto eu conquistei o universo da programação contando como foi
    seu processo.


    Adoro saber quando as pessoas conquistam seus objetivos/sonhos e vou ficar muito
    feliz de celebrar junto contigo esta vitória. Meus contatos estão logo adiante.


    - Twitter: w_oliveiras (https://twitter.com/w_oliveiras/) (onde sou mais ativo)

    - LinkedIn: william-oliveira (https://linkedin.com/in/william-oliveira/)

    - Website: woliveiras (https://woliveiras.com.br/)


    Caso algum canto mude, estará em meu website


    Tenha uma excelente experiência de carreira e divirta-se conhecendo mais e mais
    do fantástico universo da programação.

