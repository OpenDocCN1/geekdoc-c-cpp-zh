    Websites são nada mais que uma ou várias páginas em HTML, uma linguagem de texto,
    que é enviada para o nosso computador e interpretada pelo navegador. Através dessa
    página mais um monte de coisa é feita, como os estilos visuais da página, que
    são arquivos CSS, imagens, vídeos, músicas, arquivos JavaScript e outros arquivos
    que podem ser importantes para o funcionamento do site.


    Sistemas definem web em algumas categorias, pois sistemas Web possuem uma complexidade
    maior. Temos diversas interações com a pessoa que está acessando o sistema, coletamos
    dados pela aplicação front-end e enviamos para o servidor, o servidor rodará o
    programa responsável por processar esses dados (o back-end) e enviar o resultado
    do processo de volta para o cliente e essa interação continua a executar executar
    algo para o usuário, como enviar mensagens na web, controlar suas finanças, ver
    fotos de seus contatos, compartilhar informações etc.


    Já websites, normalmente, não possuem tanta interação com o usuário. Existem eles
    ali para exibir conteúdo e somente isso. Alguns websites até possuem alta complexidade
    de código, porém continuam sendo websites devido a sua natureza única: exibir
    informações.


    Dizer que um sistema Web é mais complexo do que um website pode ser errado, pois
    pode existir um site com tanta interatividade, animações, ações, para proporcionar
    uma experiência legal para o usuário que no fim das contas é mais complexo de
    que manter de um sistema web. Porém, aqui estamos focando na natureza do produto
    digital e na complexidade de seu código-fonte.


    Lembramos da diferença entre sistemas e softwares. Um website é um software e
    um sistema Web é, por baixo dos panos, um monte de softwares trabalhando em conjunto
    para nos servir algo no navegador.


    Grandes e-commerces, por exemplo, possuem muitas integrações entre diversos sistemas
    para que a nossa compra seja executada. São integrados com sistemas de pagamentos
    de outros bancos, com softwares de cálculo de frete, softwares de geração de boleto
    e vários outros.


    Então a distribuição de sistemas Web e websites pode acontecer de duas maneiras:
    se estivermos pensando no que é enviado para o usuário (a aplicação front-end),
    esse código é hospedado em um servidor que o envia para o usuário quando ele entra
    no site; é o código da aplicação que executa direto no servidor (a aplicação back-end),
    alguém será responsável por hospedar o código no servidor e configurar a aplicação
    dentro do sistema operacional. Hoje em dia isso tudo é muito bem automatizado
    para distribuirmos os softwares rapidamente.


    Muita coisa acontece por debaixo dos panos quando utilizamos a internet. Se você
    quiser saber mais sobre como a internet funciona, aprender sobre redes, saber
    como um navegador e um servidor funcion, existe um outro livro fantástico que
    explica tudo por baixo dos panos que é o livro Desconstruindo a Web.


