  - '[PAGE 77]


    Uma linguagem de programação para back-end: pode ser uma entre as várias que são
    utilizadas para criar sistemas back-end, como Java, PHP, JavaScript, Golang, Ruby,
    C#. As linguagens possuem suas diferenças e a escolha pode influenciar muito em
    nossos sistemas. Abordarei melhor a escolha da linguagem de programação no próximo
    capítulo.


    # Sistemas operacionais: a pessoa de back-end precisa entender o que acontece
    “por baixo dos panos”, conhecer como os sistemas operacionais funcionam a fundo,
    não somente utilizá-los. Será necessário profundo estudo sobre esses processos,
    memória, armazenamento de dados dos etc.


    # Bancos de dados: bancos de dados são coleções de dados organizados de maneira
    organizada para que possamos consultá-los, alterá-los ou deletá-los com segurança.
    Será necessário conhecer sobre isso, pois serão salv os dados tratados pela aplicação.
    Também é importante aprender a linguagem de consulta SQL, assim como o modelo
    não relacional de armazenamento de dados, um modo diferente de guardar dados que
    ganhou força graças a sua facilidade de desenvolvimento, performance e escalabilidade,
    o NoSQL.


    # Arquitetura de comunicação Web: precisaremos conhecer modelos de comunicação
    (front-end com back-end ou mesmo back-end com back-end), como o REST ou SOAP que
    são arquiteturas de comunicação Web, modos de se trafegar dados entre as aplicações,
    pois nós trocamos dados entre sistemas o tempo todo em nossos sistemas mais complexos.


    # Servidores Web: são os programas que fazem a ponte de comunicação entre nosso
    back-end e o front-end da aplicação, eles são instalados no sistema operacional
    e fazem o papel de enviar o que foi pedido pelo client-side para a aplicação server-side
    por meio de protocolos de rede.'
  - '[PAGE 78]


    Protocolos de comunicação em rede: além do HTTP, existem diversos outros protocolos
    de comunicação em rede e o back-end de nossa aplicação tem muita responsabilidade
    nisso, pois pode precisar enviar arquivos, e-mail ou outras mensagens de outras
    maneiras por meio de protocolos específicos, como o SMTP ou FTP, que são os protocolos
    de comunicação via e-mail e transferência de arquivos respectivamente.


    # 4.4 Infraestrutura (DevOps)


    Temos, em Tecnologia da Informação, alguns tipos de infraestrutura, como infraestrutura
    de TI, que engloba a rede física de uma empresa (os computadores, os sistemas
    e softwares instalados nessas máquinas, os equipamentos e cabos de rede), e a
    infraestrutura de aplicações, que evoluiu muito nos últimos tempos com o avanço
    da computação em nuvem e provê o sistema operacional, hardware e softwares para
    rodarmos nossa aplicação em instâncias provisionadas por alguma empresa externa,
    como a Amazon AWS ou Microsoft com o serviço Azure.


    Quando digo provisionamento, estou falando que uma empresa entrega alguns serviços
    prontos. Antigamente teríamos que uma máquina ou várias máquinas, o servidor,
    fisicamente em nossa empresa. Teríamos que instalar o sistema operacional, configurar
    os serviços, programas e instalar os servidores Web/bancos de dados/nossa aplicação,
    configurar a rede para comunicação externa a empresa. Hoje em dia não precisamos
    mais disso, basta contratarmos esse serviço com alguma empresa especializada e
    pronto! Já temos tudo pronto, com toda a segurança já planejada e a infraestrutura
    de TI em responsabilidade da provedora. Nós só precisaremos adaptar nossos sistemas
    para que trabalhem com esse modelo.'
  - '[PAGE 79]


    Durante a evolução do desenvolvimento e da tecnologia, apareceu uma nova palavra
    para nosso dicionário, a palavra DevOps. DevOps não é uma profissão, mas é bem
    comum encontrarmos vagas com esse nome na descrição, até por isso coloquei esse
    nome no subtítulo desta seção. DevOps é, na realidade, um movimento/uma cultura
    que nasceu para deixar o desenvolvimento de software mais ágil juntando desenvolvimento
    (development) com operações (operations, que é a parte de cuidar da infraestrutura
    das aplicações), pois anteriormente eram coisas separadas: uma pessoa desenvolvia,
    enviava um pacote para pessoa de infra e essa seria responsável por configurar
    o servidor, instalar a versão do sistema etc., todo aquele que comentei anteriormente.


    Com a filosofia DevOps o time deve ser responsável pela infraestrutura da aplicação,
    mas em tempos onde alguém responsável pela infra, essa pessoa deverá saber muito
    sobre:


    **Automação de processos**: automação faz parte da agilidade que a cultura DevOps
    provê, pois devemos automatizar a entrega do software (enviar o nosso código para
    produção, deixar o sistema disponível para o usuário final), os processos que
    são executados antes de criar o pacote que será enviado para produção e todo o
    resto que será automatizar.


    **Cloud services**: serviços de Cloud (computação em nuvem, que é a utilização
    de recursos como memória, armazenamento, processamento externos, computadores
    conectados a internet que nos fornecem sua capacidade) que são serviços disponibilizados
    pelas empresas que atuam provisionando a infraestrutura para nossas aplicações,
    como a Amazon AWS, Microsoft Azure, Google Cloud, Heroku, IBM Cloud, etc. A pessoa
    deve conhecer bem esses provedores e os seus serviços para buscar o produto correto
    para cada necessidade de nossa aplicação, provendo economia e segurança ao nosso
    sistema.'
  - '[PAGE 80]


    Sistemas operacionais: essa pessoa será responsável por configurar todo o sistema
    para funcionar na nuvem com seus pacotes planejados para não deixar a aplicação
    lenta, segurança e tudo para ele não pare de funcionar. Principalmente conhecimento
    em Linux, que é o sistema operacional mais utilizado em servidores.


    Redes (configuração, funcionamento etc.): redes de computadores ou um conjunto
    de máquinas, computadores ou não, conectados através de meios de comunicação,
    como cabos, wireless (Wi-Fi) ou similares, essa pessoa possui essa atribuição,
    pois configurar serviços que se comunicam entre rede os sistemas e aplicações
    conectadas na nuvem.


    Segurança da informação: segurança é parte do processo de configuração de ambientes,
    redes, bancos de dados etc. e todo conjunto de outras funcionalidades dos nossos
    sistemas e aplicações, porém a pessoa de infraestrutura consegue aumentar a segurança
    configurando muito bem um sistema operacional e monitorando nossas aplicações
    contra ataques ou tentativas de invasão.


    Programação: também é necessário saber programar, afinal essa pessoa desenvolve
    e cuida da infraestrutura e a automação de processos é feita por meio de programação.


    Integração contínua: ferramentas de integração contínua nos auxiliam a integrar
    (juntar) o nosso código a base central de códigos para garantir que o código adicionado
    não vá “quebrar” a aplicação depois de unido com o código que já está em produção.


    Deploy contínuo: ferramentas de deploy contínuo são utilizadas para automatizar
    o deploy (disponibilizar nosso programa para nossos usuários, seja um site ou
    aplicativo de celular), depois de certas regras (que nós configuramos) forem satisfatórias,
    então a ferramenta trata de colocar o código em produção para a equipe.'
  - '[PAGE 81]


    Configuração de ambientes: o ambiente, como já comentado, é onde nosso programa
    está rodando. Configuração de ambientes (local, de produção ou de testes) tem
    diferenças consideráveis de configuração e uso, pois o ambiente de produção não
    pode apresentar problemas, se não usuário ficará frustrado. O ambiente de testes
    deve ser o mais similar possível ao de produção, porém com algumas peculiaridades,
    como um hardware com menos recursos (menos memória, um processador mais fraco),
    pois tem menos acesso que o de produção. O ambiente local é não ambiente pessoal
    (nosso computador) e a pessoa responsável pela infraestrutura deve garantir que
    tudo esteja corretamente e da melhor maneira possível.


    Monitoramento de aplicações: é uma parte importante do trabalho de infraestrutura,
    afinal essa pessoa cuida dos ambientes, ela consegue aumentar a quantidade de
    memória ou processador, se for preciso, existem diversas ferramentas e modos de
    se monitorar uma aplicação em produção ou testes, a pessoa de infra deve dominar
    elas.


    # 4.5 Full-stack


    Alguém desempenhando o papel de full-stack consegue executar as funções de várias
    outras áreas, como front-end e back-end e infra de uma só vez. Ou seja, a pessoa
    full-stack é um(a) profissional verdadeiramente multidisciplinar.


    Enquanto front-end e back-end buscam se especializar em somente uma função ou
    área de trabalho, apesar de ter de conhecimento superficial das demais, a pessoa
    desenvolvedvolvedora full-stack busca saber sobre tudo o que envolve desenvolvimento
    de software, apesar de continuar sendo especialista em alguma área.'
- md: '

    Essa especialização em alguma área acontece naturalmente, pois muitos tópicos
    para dominar seria quase humanamente impossível alcançar a excelência em todas
    as áreas de uma só vez. Como as pessoas têm afinidade ou gostam mais de uma função,
    elas acabam se especializando nessa função, porém, como fullstack, conhece o necessário
    para conseguir atuar em todas as outras.


    Em todo caso, full-stack é alguém que sabe criar um sistema inteiro, do zero e
    até sozinho. Não que as outras pessoas também não saibam, mas quem se responsabiliza
    em full-stack em uma empresa decidiu que no seu dia a dia não teria uma especialização,
    mas resolveria qualquer problema que aparece. Ela vai tratar de modelar o banco
    de dados, configurar e provisionar o servidor, criar a aplicação server e client-side,
    enfim, tudo o que precisamos de sistemas Web ou mesmo em áreas, como mobile.


    Como é de imaginar, uma pessoa desenvolvedora full-stack precisa do conhecimento
    técnico de infraestrutura, front-end, back-end e o que mais ela precisar de necessário.
    Se quiser ser full-stack em mobile, por exemplo, precisará saber tudo sobre infraestrutura,
    back-end e mobile. Se quiser atuar em games, infraestrutura, back-end e games...
    E assim por diante.


    Muita gente acha que full-stack é uma evolução natural de outras áreas. Acreditam
    que começamos como front-end, back-end ou outra especialização e vamos nos tornando
    mais generalistas com o tempo, porém isso não é uma verdade. As pessoas podem
    trabalhar a vida inteira como front-end, back-end, mobile etc. e nunca querer
    se envolver com outras partes do sistema (apesar de saber como o sistema funciona).


    Nós também não começamos em uma área e vamos evoluindo de profissional, como front-end
    junior, front-end pleno, front-end sênior e finalmente nos tornamos full-stack.
    Isso não é uma realidade. A pessoa pode começar, desde seu primeiro dia de trabalho,
    já atuando como full-stack, pois isso não é um nível de conhecimento, como iniciante,
    intermediário, avançado, mas uma área de atuação.


    Outro erro é achar que uma pessoa full-stack é a mais sabichona de todas as áreas.
    Como eu disse anteriormente, a pessoa desenvolvedora full-stack pode possuir conhecimento
    generalista e dominar um assunto, mas uma especialista pode saber mais que de
    outra área que ela não domina tanto. Um exemplo: alguém que domina muito back-end,
    como full-stack, pode saber menos de mobile do que alguém com especialização em
    mobile.


    ## 4.6 Mobile Android e iOS


    Mobile, como já aprendemos anteriormente, engloba os celulares, smartphones e
    tablets. A pessoa que atua nessa área será responsável por desenvolver e manter
    aplicativos para dispositivos mobile.


    Essa pessoa precisará conhecer o sistema operacional com o qual vai trabalhar
    no dispositivo, seja Android ou iOS (iPhone). Vale lembrar que os sistemas operacionais
    de celulares, assim como de computadores, controlam todo o nosso aparelho. São
    responsáveis por desde o funcionamento de um botão até os aplicativos que estão
    instalados.


    Quando compramos um smartphone, hoje em dia, temos a escolha entre Android ou
    iOS, Android para a maioria dos aparelhos, como Galaxy, ZenFono, Moto E/G/X/Z,
    Xperia e iOS para os aparelhos da Apple, iPhones e iPads.


    Não é recomendado instalar um sistema Android em um aparelho da Apple, por exemplo,
    apesar de ser possível, pelas integrações do sistema operacional com o hardware.
    Os aparelhos com Android possuem hardware compatível com Android e os Apple com
    o iOS.


    Existem diferenças significativas de versão entre sistemas antigos (versão 1,
    2, 3 etc.) e versões mais atuais dos sistemas e isso aumenta a importância de
    conhecer muito bem os sistemas operacionais e acompanhar sua evolução. Além disso,
    as empresas podem alterar o Android que vai em seus dispositivos para que possua
    características específicas para os aparelhos. Também enfrentamos problemas de
    hardware do aparelho, como espaço de armazenamento interno, memória, cartão de
    memória ou até mesmo onde trabalhamos com mobile.


    Hoje em dia os aplicativos fazem tanta coisa e são tão complexos que podemos ter
    muito mais do que alguns profissionais cuidando de um só aplicativo. Isso tanto
    em uma empresa de tecnologia quanto em uma empresa de outro setor que possua o
    aplicativo como fonte de renda. As possibilidades são imensas.


    Mas, aqui, temos uma divisão entre Android e iOS, isso acontece porque cada sistema
    possui todo um ecossistema diferente do outro para a pessoa aprender, como Java
    e Kotlin, linguagens de programação para Android, e Objective-C e Swift, as linguagens
    de programação para iOS. Seria muita coisa para uma pessoa sozinha dominar, por
    isso é um mercado dividido entre essas duas frentes.


    Somente para conhecimento, existem outros sistemas operacionais de celular, porém
    mais "importantes" para quem quer entrar na área de mobile são Android e iOS atualmente.


    Uma pessoa que trabalha com mobile precisará conhecer:


    - Uma linguagem de programação: a escolha da linguagem de programação vai variar
    de acordo com o ambiente (sistema operacional e aparelhos) escolhido para desenvolver.
    Se quismos programar para Android vamos precisar aprender Java e Kotlin, se para
    iOS, então é Objective-C e Swift. Antigamente se utilizava uma linguagem para
    o desenvolvimento, porém foram criadas duas linguagens novas e com mais poderes
    para facilitar o desenvolvimento mobile, Kotlin e Swift, e alguns módulos ainda
    precisam ser mantidos com as linguagens "antigas" por motivos de versão ou dificuldade
    de manutenção/reescrita.

    - **Sistemas operacionais mobile:** é necessário dominar os sistemas operacionais
    para contornar ou corrigir os problemas de versão (uma versão antiga de Android/iOS
    pode não aceitar alguma coisa que utilizamos e então temos que buscar alternativas
    para isso).

    - **Tamanhos de telas:** os tamanhos de tela variam muito e é por isso é importante
    conhecê-los.

    - **Processos de deploy (publicação):** o processo de deploy de aplicativos também
    é diferente dos demais, pois eles são enviados para as lojas de aplicativos, por
    isso é necessário que a pessoa desenvolvedora mobile conheça suas especificações
    e limitações.

    - **Integração e sincronização com back-end:** algumas informações importantes
    estão na internet, como dados dos usuários, preços de produtos etc., estão no
    back-end da aplicação, então necessário que a pessoa consiga solicitar esses dados
    utilizando troca de mensagens nos protocolos de Web.

    - **Recursos dos dispositivos mobile (hardware):** itens como GPS, Bluetooth,
    Tela, são os recursos do aparelho que a pessoa deve dominar. Um aplicativo pode
    precisar da localização de um usuário para executar determinada ação, ou pode
    precisar piscar a tela, utilizar a câmera ou algum outro recurso de hardware.


    ## 4.7 Desenvolvimento de jogos


    Uma boa quantidade de gente conhece a área de programação graças aos games. As
    pessoas querem criar um jogo ou mesmo utilizam programas que "facilitam" os games
    por meio de scripts interpretados, os famosos bots ou hacks, que são meios para
    roubar nos jogos.


    Isso é uma das partes legais de trabalhar com programação: podemos trabalhar com
    algo que gostamos muito ou utilizamos o tempo no dia a dia. As pessoas que se
    divertem bastante com jogos com certeza vão divertir criando jogos.


    Alguém responsável pela programação de um game vai criar a física do jogo, o motor
    de renderização (o código que faz as coisas aparecerem na tela), implementar a
    mecânica dos jogos, movimentação de personagens, colisão de objetos e mais algumas
    funções.


    É um mercado muito atrativo no Brasil, porém é possível conseguir uma oportunidade
    para um emprego remoto, para mudar de país ou mesmo conseguir trabalhar como freelancer.
    Isso acontece porque as maiores empresas de desenvolvimento de jogos não estão
    no Brasil (não possuem setor de desenvolvimento por aqui), infelizmente.


    Mas isso não significa que a profissão está escassa. O mercado de games como um
    todo e desenvolvimento de jogos no Brasil é um dos que crescem no mundo! As pessoas
    estão dispostas a comprar os jogos e compram bastante. Nesse cenário de muita
