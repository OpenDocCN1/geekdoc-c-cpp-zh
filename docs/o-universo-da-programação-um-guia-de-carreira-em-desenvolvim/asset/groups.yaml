  mdcn: '


    每当有人告诉我他们已经学习了两年编程，但对于申请职位感到不从心，或者觉得自己与同时期开始学习的人相比处于劣势地位时，我都会询问他们的实践情况。


    -   你一直在大量实践吗？


    当答案是“是”时，我们很快就能发现人的问题不在于编程，而在于他们自己的自尊心或不安全感。对于这一点，没有任何技术课程或关于代码的书可以帮助我们，我们需要学会理解和评估自己。


    有一些完美的著作可以做到这一点，并且适用于我们在职业生涯中遇到的任何类型的问题。让我们来了解一些。


    1. [充满激情的程序员](O programador apaixonado)，作者 Chad Fowler (https://www.casadocodigo.com.br/products/livro-programador-apaixonado/)

    2. [大师程序员指南](O guia do mestre programador)，作者 Carlos Bueno (https://www.casadocodigo.com.br/products/livro-guia-mestre-programador)

    3. [专注](Foco)，作者 Daniel Goleman (https://www.amazon.com.br/8539005352/)

    4. [情绪智能](Inteligência emocional)，作者 Daniel Goleman (https://www.amazon.com.br/Inteligência-Emocional-Daniel-Goleman/dp/8573020806/)

    5. [习惯的力量](O poder do hábito)，作者 Charles Duhigg (https://www.amazon.com.br/Poder-do-Habito-Charles-Duhigg/dp/8539004119/)

    6. [行动的力量](O poder da ação)，作者 Paulo Vieira (https://www.amazon.com.br/Poder-Ação-Ph-D-Paulo-Vieira/dp/85452033X/)

    7. [快速与慢：思考的两种两种](Rápido e devagar, duas formas de pensar)，作者 Daniel Kahneman
    (https://www.amazon.com.br/Rápido-Devagar-Daniel-Kahneman/dp/853900383X/)

    8. [正念](Atenção plena: Mindfulness)，作者 Mark Williams (https://www.amazon.com.br/Atenção-Plena-Mindfulness-Mark-Williams/dp/8543101875/)

    9. [我们为什么这么做？](Por que fazemos o que fazemos?)作者 Mario Sergio Cortella (https://www.amazon.com.br/Por-que-Fazemos/dp/8542207416/)

    10. [高性能大脑](O cérebro de alta performance)，作者 Fernando Garcia (https://www.amazon.com.br/cérebro-alta-performance-Fernando-Garcia/dp/8573129085/)

    11. [想要时间的人生产力](Produtividade para quem quer tempo)，作者 Geronimo Theml (https://www.amazon.com.br/Produtividade-para-quem-quer-tempo/dp/8545200978/)

    12. [焦虑](Ansiedade)，作者 Augusto Cury (https://www.amazon.com.br/Ansiedade-Augusto-Cury/dp/8502218484/)

    13. [80/20法则：少即是多的秘密](O Princípio 80/20)，作者 Richard Koch (https://www.amazon.com.br/Principio-Segredos-Para-Conseguir-Menos/dp/858235259X/)

    14. [有序的大脑：在信息过载时代如何清晰思考](A Mente Organizada)，作者 Daniel J. Levin (https://www.amazon.com.br/Organizada-Pensar-Clareza-Sobrecarga-Informação/dp/8539006995/)

    15. [冥想的艺术](A arte da meditação)，作者 Daniel Goleman (https://www.amazon.com.br/Arte-Meditação-Autoestima-CD/dp/8575421867/)


    这些书看起来一次性读不完很多，但当我们越来越理解自己并渴望获得更高的生活质量时，它们对于我们平衡生活至关重要。我们可以利用目前为止介绍的生产力建议来消化这些书籍的内容。


    在这些书中，对我们领域最重要的是《充满激情的程序员》和《大师程序员指南》。那么，如果你不想读其他的，请至少在学习目前所学知识的基础上额外读读这两本。


    在心理上做好了更好的准备后，我们现在可以通过高级技术书籍来寻求更深入的开发：


    1. [Refactoring: Improving the Design of Existing Code]，作者 Martin Fowler, Kent
    Beck 和 John Brant (https://www.amazon.com.br/Refactoring-Improving-Design-Existing-Code/dp/0201485672/)

    2. [Domain Driven Design]，作者 Eric Evans (https://www.amazon.com.br/Domain-Driven-Design-Tackling-Complexity-Software/dp/0321125251/)

    3. [Padrões de Arquitetura de Aplicações Corporativas]，作者 Martin Fowler (https://www.amazon.com.br/Padr%C3%B5es-Arquitetura-Aplica%C3%A7%C3%B5es-Corporativas-Martin/dp/853630638/)

    4. [Refatoração para Padrões]，作者 Joshua Kievsky (https://www.amazon.com.br/Refatoracao-Padroes-Portuguesse-Joshua-Kievsky-ebook/dp/B019HiOO22C/)

    5. [Clean Code: A Handbook of Agile Software Craftsmanship]，作者 Robert C. Martin,
    Michael C. Feathers 和 Timothy R.Ottinger (https://www.amazon.com.br/Clean-Code-Handbook-Software-Craftsmanship/dp/0132350882/)


    ## 9.9 结论


    在阅读这本书的过程中我们学到了很多，现在我们收到了更多材料和建议，帮助我们学习更多，并在编程宇宙的旅程中走得更远。


    我们应该避免忽视我们认为重要的主题，尽管有时学习这些主题可能会有些枯燥。所有这些努力都将帮助我们成为更优秀的专业人士，并让我们拥有在职业生涯中走得更远的技能。


    ## 第 10 章

    ### 结语


    我们在编程宇宙这一奇妙领域的旅程，仅仅随着我们目前为止所积累的知识刚刚开始。


    现在，我们掌握了基础知识和灵感，可以彻底进入开发领域，学习尽可能多的知识并获得工作（甚至是自由职业）。


    没有任何伟大的梦想是容易实现的，但精通编程并不难。


