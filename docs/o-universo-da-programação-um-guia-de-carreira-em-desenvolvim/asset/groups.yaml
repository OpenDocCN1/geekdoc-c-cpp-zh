    ## 1.4 Como é desenvolvido um programa de computador


    Já sabemos o que é programação, o que é um programa e o que são linguagens de
    programação, mas, então, como escrevemos software?


    Existem diversas maneiras de escrever um programa de computador e isso vai variar
    conforme a linguagem de programação e ambiente de execução deste programa, mas
    tudo começa a partir de uma ideia ou problema que precisamos resolver e uma pessoa
    com habilidades em programação com um computador em mãos.


    Se a pessoa estiver escrevendo um código-fonte para rodar no navegador, como JavaScript,
    ela pode usar qualquer editor de texto comum e depois só colocar para rodar em
    uma página web, pois o navegador faz depois o resto do trabalho de compilar e
    interpretar a linguagem.


    E se a pessoa estiver desenvolvendo para smartphones com o sistema operacional
    Android e a linguagem Java ou Kotlin?


    Ai é um pouco diferente. Normalmente, a pessoa vai usar uma IDE, ferramentas de
    escrita de código muito poderosas e um pouco mais complicadas que simples editores
    de textos para escrever o código e compilar. Isso para tornar o trabalho mais
    produtivo, pois, como veremos, IDEs possuem muitos recursos para facilitar a vida
    de quem está desenvolvendo a utilizando.


    A escolha entre editor de texto e IDE é bom, mas em alguns casos (para algumas
    linguagens) é quase obrigatório o uso de uma

