    estudos. Se desejamos aprender algo rapidamente, precisamos ter em mente que não
    vamos aprender tudo de uma só vez, mas que podemos aproveitar muito o nosso tempo
    e aprender de maneira produtiva. É muito melhor estudar um pouco todo dia do que
    pegar um final de semana inteiro para estudar algo e na segunda-feira esquecido
    tudo.


    Existem algumas técnicas que nos ajudam a aprender mais rápido. Eu estudei diversos
    modelos, sigo algumas dicas e acabei aprendendo e adaptando algumas coisas enquanto
    ajudava pessoas a aprender algumas programação.


    A maneira que faço é: montar um ambiente de estudos, utilizar uma técnica para
    manter o foco, buscar sempre estudar de maneira ativa, seguir algumas técnicas
    de estudos e sempre tirar um tempo para descompressão/relaxamento.


    Vamos entender cada ponto.


    ## 1. Preparar um ambiente de estudos


    Nós não somos como os computadores que possuem um processador com vários núcleos
    e separar uma tarefa em cada núcleo para processar tudo paralelamente, por isso
    é importante que no nosso ambiente de estudos tenha o mínimo de distrações possível.


    De preferência um lugar que esteja organizado, como uma mesa de estudos. Não precisa
    ser uma mesa especial, inicialmente. Eu uso a mesa da cozinha enquanto escrevo
    este livro, pois é o lugar onde eu não escuto nenhum barulho além da música no
    meu fone de ouvido e quebra da geladeira por perto para fazer um lanchinho nas
    pausas. Ali, colocar uma música legal também pode ser um bom estímulo para espantar
    a preguiça.


    Um ambiente organizado e sem distrações vai facilitar para que não percamos em
    meio a outras tarefas, como ouvir o que a pessoa que apresenta o telejoral está
    falando, olhar uma imagem bonita que aparece na tela do celular.


    Falando em celular, afaste-o ou desabilite as notificações. Os celulares megconectados
    de hoje são uma armadilha para nossa produtividade. Deixe na mesa somente o que
    é importante para a tarefa que será executada.


    Enquanto eu estudo, normalmente, deixo somente o notebook, se estiver lendo um
    livro, deixo o livro, um copo d''água e um caderno para anotar para depois as
    ideias mirabolantes que aparecem enquanto estamos estudando e que tiram totalmente
    nosso foco.


    ## 2. Mantendo o foco


    Com o ambiente organizado conseguimos manter o foco nos estudos, porém nem sempre
    o que acontece externamente é o único problema. Existem também aqueles momentos
    em que começamos a estudar algo importante e, de repente, vamos fazendo pesquisas
    inúteis na internet. Eu sempre caía na armadilha de entrar nas redes sociais para
    dar uma uma olhadinha e quando já tinha passado 30/40 minutos, esgotava minha
    energia e eu não queria continuar estudando.


    Precisamos manter o foco e para isso podemos estipular um horário em que não vamos
    fazer nada de focar 100% nos estudos e horários para uma pequena pausa. Se aparecer
    aquela vontade de pesquisar algo que não vai agregar em nossos estudos, podemos
    anotar isso para pesquisar/fazer depois e somente o tempo da pausa para redes
    sociais ou outras distrações.


    Existe uma técnica muito boa que pode ajudar a manter o foco, a Técnica de Pomodoro,
    uma técnica inventada por Francesco Cirillo, por volta de 1980. Essa técnica maximiza
    a eficiência, reservando 25 minutos de foco ininterrupto, tomando pausas de 5/10
    minutos.


    O passo a passo para utilizarmos Pomodoro é:


    - 1. Escolher e listar as tarefas;

    - 2. Ajustar um cronômetro para o tempo de 25 minutos;

    - 3. Escolher a tarefa inicial;

    - 4. Trabalhar na tarefa escolhida até que o alarme toque. Se alguma distração
    importante surgir, anotá-la e voltar a tarefa;

    - 5. Quando o alarme tocar, marcar um "x" na lista de tarefas;

    - 6. A cada pomodoro tomar uma pausa de 5 minutos;

    - 7. Quando finalizarmos quatro pomodoros, fazer uma pausa mais longa (15-30 minutos),
    zerando a contagem e retornando ao passo 1.


    Se somarmos os 4 pomodoros (25 min) + pausas de 5/15 minutos, teremos 2 horas
