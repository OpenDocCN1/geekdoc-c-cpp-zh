    que entrou em contato conosco pode não estar listada no Love Mondays nunca recebeu
    nenhuma avaliação, mas ser uma boa empresa.


    O melhor modo de saber se a empresa é realmente legal de trabalhar é entrando
    em contato com alguém que conhecemos e que trabalha lá e questionando o essa pessoa
    da local. Caso não tenhamos nenhum conhecido na empresa pode não ser legal entrar
    em contato com alguém direto pelo LinkedIn, pois pode ser invasivo. — Eu sei que
