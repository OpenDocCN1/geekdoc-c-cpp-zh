    ## 2.3 Freelance


    A possibilidade de nunca ter um padrão ou chefe, poder fazer nosso próprio horário,
    trabalhar de casa ou de um café e outros benefícios desse tipo, atrai muitas pessoas
    para empregos freelance, uma modalidade muito legal e importante de trabalho na
    qual nos colocamos disponíveis para pessoas e empresas que buscam alguém para
    fazer um projeto esporádico ou até um contrato de longa duração.


    O mais legal é poder passar por diversos projetos de empresas grandes, médias,
    pequenas, também para clientes comuns (pessoas físicas) e conhecer diversos modelos
    de negócio, projetos fantásticos e muitas vezes ajudamos alguém a sair do zero
    para o produto de sua vida sem precisar estar presos a ninguém depois que o projeto
    acabar.


    Hoje existem diversos sites que indexam perfis de pessoas que buscam freelancers,
    seja para produzir um site, aplicativo, um sistema completo ou para corrigir algum
    bug, fazer algum ajuste em algo já existente. Veremos um pouco mais sobre trabalhar
    como freelancer nos próximos capítulos.


    ## 2.4 Criação de um produto digital


    Além das várias possibilidades de criarmos uma empresa especializada na criação
    de softwares para as empresas ou trabalhar como freelancer, também podemos criar
    um software ou sistema de sucesso baseado em um problema que queamos resolver.


    Alguns produtos digitais famosos exploram as mais diversas necessidades da sociedade
    e resolvem com maestria a maioria dos problemas, como o aplicativo 99 (https://99app.com)
    para a mobilidade pública, o dr.consulta (https://drconsulta.com) para a área
    da saúde, o Nubank (https://nubank.br) para serviços financeiros.


    Existem sites onde encontramos o melhor imóvel de uma região baseados em nossas
    preferências e pesquisas, como o VivaReal (https://vivareal.com.br), [além de
    aplicativos de gestão financeira que ajudam a controlar nossos gastos e a fazer
    com que o salário dure até o final do mês, como o GuiaBolso (https://guiabolso.com.br).


    E a forma de monetização de um produto digital pode variar muito e isso deve ser
    aprendido de acordo com o uzo do produto. Existem diversos cursos e livros sobre
    a criação de um produto digital, entre os quais recomendo fortemente a leitura
    sobre startups, como *A Startup Enxuta*, de Eric Ries e outros livros sobre empreendedorismo
    em geral.


    Se você tem o sonho de resolver algum problema social, criar um produto digital
    pode ser a grande chance.


    ## 2.5 Entender como as coisas funcionam por baixo do motor


    Dificilmente levamos nosso carro a uma mecânica por falta de água ou óleo no motor.
    O mesmo acontece quando precisamos trocar o pneu de uma bicicleta ou fazer a manutenção
    da nossa geladeira.


    É comum nós mesmos resolvermos um problema desses porque parece algo mais palpável
    para a maioria das realidades, mas será que não poder resolver algum problema
    de um sistema que utilizamos no navegador?


    Mesmo que não tenamos acesso ao código-fonte de um sistema, saber que algo acontece
    pode nos poupar muito tempo, como saber que um site não está carregando devido
    a um script pesado na página, no qual poderíamos desativá-lo e finalmente acessar
    o conteúdo.


    Até mesmo um aplicativo de celular pode ser analisado utilizando as ferramentas
    de desenvolvedor que podemos ativar nas configurações do sistema operacional móvel.


    Saber programar ou saber como as coisas funcionam por baixo dos panos nos dá o
    poder de resolver algo e seguir nossa vida, assim como podemos parar em um posto
    de gasolina, colocar água no reservatório do carro e seguir viagem.


