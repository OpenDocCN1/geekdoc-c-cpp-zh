    para sempre boa comparação.


    Em todo caso, o salário é negociável e devemos discutir a oferta com a pessoa
    que nos entrevista. O ponto principal é: pesquise muito em sites especializados,
    com conhecidos(as) e nas comunidades de programação para conhecer bem o mercado.


    ## 8.8 Como é um processo seletivo para programadores(as)


    O processo seletivo para pessoas desenvolvedoras de software é o mesmo de outras
    profissões: alguém vai pesquisar nosso perfil, vai entrar em contato conosco para
    perguntar se queremos participar da seleção e então inicia-se o processo.


    A grande diferença está neste teste prático, que pode vir antes ou depois da primeira
    parte ou mesmo ser dividido em vários testes práticos, ser somente uma prova na
    empresa ou em algum site de desafios de programação.


    As entrevistas pessoais, assim como em outras profissões, servem para analisar
    nosso perfil e o fit cultural com a empresa, ou seja, se nos adaptamos à filosofia,
    aos valores e à missão da empresa.


    Já o teste prático serve para analisar nosso nível de conhecimento técnico e tomamos
    decisões de engenharia de software, arquitetura e boas práticas de programação.
    Tudo isso aprendemos com o tempo, então, para vagas de iniciantes, a cobrança
    maior é em saber se conseguimos entregar a solução o problema proposto e se temos
    disposição para aprender.


    Como dito anteriormente, não precisamos cumprir todos os requisitos técnicos para
    nos candidatarmos em uma oportunidade de emprego justamente agora que ficará visível
    o que sabemos ou não.


    O mais importante no teste prático é não querer fazer algo muito a do que já sabemos,
    visto que a maioria dos testes são feitos em casa e com um prazo de no mínimo
    4 dias para entregar. Não é legal pesquisar de última hora, fazer aquele lindo,
    sendo que realmente não sabemos/não dominamos aquilo que adicionamos no teste,
    pois depois teremos que explicar porque tomamos cada decisão e ficará claro que
    não sabemos realmente o que estávamos fazendo.


    Melhor um teste bem-feito com o que realmente conhecemos do que um teste mal feito
    com algo que adicionamos somente para parecer que sabemos.


    Claro que temos pessoas que aprendem tudo de última hora para fazer o teste prático
    de uma seleção e acaba se dando bem, mas fica a nosso cargo se queremos arriscar
    ou não.


    ## 8.9 Como se preparar para testes práticos de programação


    O exercício para conseguirmos fazer testes de programação, muito sofrimento além
    da ansiedade da oportunidade de emprego, é criar projetos. É realmente programarmos.
    Quanto linhas de códigos escrevermos em nossa vida para projetos diferentes, estaremos
    preparados(as) para os testes práticos das empresas.


    Não adia decorar diversas páginas de um livro técnico, ler milhares de artigos
    todos os meses e não praticar nada daquilo, pois esquecemos tudo na hora do nervosismo
    do teste. A prática é a única aliada na preparação para as entrevistas técnicas.


    Existem sites especializados em praticar programação, como:


    - hackerrank (https://hackerrank.com/)

    - codewars (https://codewars.com/)

    - exercism (https://exercism.org/)

    - urionlinejudge (https://beonlinejudge.com/)


    Vale lembrar que esses sites são ótimos ferramentas, mas não substituem a prática
    de projetos reais.

    '
  mdcn: '

    结果。基本上，我进入了 lovemondays.com.br/salarios/cargo 并收集了数据来填充我们的表格。对于每个领域，我获取了职业生涯初期的薪资（初级）、具有良好经验的中级（pleno），以及最后的“最高”职位——高级职位（sênior）。让我们来看看结果。


    | 职位 | 薪资 |

    |---|---|

    | 前端初级 | R$ 2.743 |

    | 前端中级 | R$ 4.569 |

    | 前端高级 | R$ 6.239 |

    | 后端初级 | R$ 3.029 |

    | 后端中级 | R$ 4.942 |

    | 后端高级 | R$ 7.641 |

    | Android 开发初级 | R$ 3.307 |

    | Android 开发中级 | R$ 5.626 |

    | Android 开发高级 | R$ 9.035 |

    | iOS 开发初级 | R$ 2.834 |

    | iOS 开发中级 | R$ 5.586 |

    | iOS 开发高级 | R$ 8.978 |


    对于其他职业（工程和数据科学、游戏、基础设施），我没有找到足够的数据，但我找到了“软件开发者”（Software Developer）这一职位，它可以被视为该职业的全栈开发：


    | 职位 | 薪资 |

    |---|---|

    | 软件开发初级 | R$ 4.424 |

    | 软件开发中级 | R$ 6.476 |

    | 软件开发高级 | R$ 9.571 |


    需要注意的是，该表格仅供基础比较的示例，没有考虑到我们居住的地区、工作的技术、经验年或其他可能增加或降低我们在职场中价值的细节。


    如果我们添加特定的技术，例如，在 Love Mondays 上搜索“Java 开发人员”，表格将如下所示：


    | 职位 | 薪资 |

    |---|---|

    | Java 开发初级 | R$ 3.020 |

    | Java 开发中级 | R$ 5.198 |

    | Java 开发高级 | R$ 8.614 |


    我们发现会有所不同。但这是用于什么的 Java？Android？后端？这仍然很模糊，因此我们应该始终进行更广泛的调研，获取更多数据，以便始终进行良好的比较。


    无论如何，薪资是可以商议的，我们应该与面试我们的人讨论提约。要点是：在专业网站上、通过朋友以及编程社区进行大量研究，以充分了解市场。


    ## 8.8 程序员的选拔流程是怎样的


    软件开发人员的选拔流程与其他职业相同：有人研究我们的简历，与我们联系询问是否想参加选拔，然后流程就开始了。


    区别在于这个实战测试，它可能出现在第一部分之前或之后，或者被分为几项实战测试，可能只在公司内部进行，也可以在某个编程挑战网站上进行。


    个人面试与其他职业一样，用于分析我们的个人特征以及与文化的契合度，即我们是否适应公司的哲学、价值观和使命。


    而实战测试则用于分析我们的技术知识水平以及我们在软件工程、架构和编程良好实践方面的决策能力。这一切都是随着时间学习的，因此，对于初级职位，主要的要求在于我们是否能够交付所提问题的解决方案，以及是否有学习的意愿。


    如前所述，在申请目前的机会时，我们不需要满足所有的技术要求，正因为现在我们知道或不知道什么将变得可见。


    在实战测试中最重要的一点是不要尝试做超出我们知识范围的事情，因为大多数测试都是在家完成的，并且有至少 4 天的交付期限。在最后时刻才搜索并做一个看起来很棒的作品，但实际上我们并不了解/不掌握所添加到测试中的内容，这并不明智，因为之后我们需要解释为什么要做出每项决策，而他们会一眼看出我们并不真的在做什么。


    与其为了显得自己懂而添加一些东西做一个糟糕的测试，不如用我们真正熟悉的知识完成一个完成良好的测试。


    当然，我们确实有人会在最后时刻学会一切来完成选拔的实战测试并取得良好结果，但这取决于我们是否愿意冒险。


    ## 8.9 如何准备编程实战测试


    为了能够完成编程测试，除了就业机会带来的焦虑外，最痛苦的练习是创建项目。这才是真正的编程。我们在生命中为不同的项目编写了多少行代码，我们就为公司的实战测试准备得越充分。


    不要只记得背诵技术书籍的很多页内容、每月阅读成千上万的文章却不练习其中任何东西，因为在测试的紧张时刻，我们会忘光所有。练习是准备技术面试的唯一盟友。


    有一些专门练习编程的网站，例如：


    - hackerrank (https://hackerrank.com/)

    - codewars (https://codewars.com/)

    - exercism (https://exercism.org/)

    - urionlinejudge (https://beonlinejudge.com/)


    需要记住，这些网站是很好的工具，但它们不能替代真实项目的实践。

    '
