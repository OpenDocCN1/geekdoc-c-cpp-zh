    | TED Talks | March |

    | Produtividade para quem quer tempo | March |

    | Um apelo a consciência: os melhores discursos de Martin Luther King | March
    |

    | Por que fazemos os que fazemos | March |


    Figura 6.3: Livros depois de abandonar o celular no transporte coletivo


    Essa é uma maneira de conseguir mais tempo para estudar: **descobrir onde nosso
    ônibus está sendo queimado durante o dia.**


    A leitura no ônibus/metrô é outro modo de conseguirmos fazer mais, com “menos
    tempo”. Nos colocamos na ponta do lápis o tempo que gastamos em transporte coletivo
    perceberemos que estamos perdendo muito tempo útil da nossa vida. Gastamos 1 hora
    e meia para ir para o trabalho e 1 hora e meia para voltar para casa, estamos
    perdendo 3 horas do dia e colocando isso na semana (5 dias úteis) estamos perdendo
    15 horas da nossa vida semanalmente.


    Para pessoas que não se sentem bem ao ler no veículo em movimento, existem livros
    em áudio, vídeos de palestras e até cursos que podemos baixar e ir ouvindo no
    percurso. Podemos utilizar tudo isso como ferramentas para não perder nosso tempo
    na locomoção, mas o utilizar de maneira produtiva.


    Se unirmos isso com uma hora de estudos em casa todos os dias conseguimos 20 horas
    de estudo por semana. Sinal de que o tempo está ali, mas só não estamos priorizando
    as coisas certas.


    Nem todo mundo consegue esse tempo disponível, isso é fato, a rotina diária é
    muito diferente de uma pessoa para outra, por isso é importante acompanhar **onde
    estamos queimando nosso tempo**, com aplicativos ou não, para identificarmos o
    que está sugando nossa vida e é só saber exatamente o que não é útil que planejemos
    os estudos no tempo que vai “sobrar” sem o desperdício.


    Pessoalmente recomendo acompanharmos nossa rotina natural durante 1 mês anotando
    tudo o que fazemos e depois criarmos uma rotina produtiva e começar seguir-la.


    ## 6.5 Como se ajudar a receber ajuda (como fazer boas perguntas)


    Durante nossa carreira sempre vamos precisar de ajuda, seja buscando apoio de
    alguém ou procurando conteúdo e não importa o nosso nível profissional. O difícil
    é saber exatamente o que pesquisar quando estamos no começo da carreira. Quando
    estamos aprendendo aparecem erros de programação que raramente vamos saber resolver
    de primeira e é que começa o desafio de saber fazer a pergunta certa na internet
    ou para a pessoa ao lado.


    Saber formular uma boa pergunta pode nos receber ajuda mais rápido, afinal a outra
    pessoa vai saber exatamente do que precisamos e até as pesquisas na internet serão
    facilitadas com a questão correta em mãos. Então, como fazer boas perguntas sobre
    programação?


    Alguém que quer ter em mente é: a outra pessoa não sabe de que estamos passando
    só porque ela é mais experiente ou porque está se dispondo a ajudar, nós precisamos
    contextualizar a pessoa e dizer exatamente o que estamos enfrentando.


    A contextualização virá a partir do momento em que conseguirmos responder essas
    perguntas:


    - O que eu estava fazendo? (ou o que eu já tentei fazer resolver)

    - O que eu esperava que acontecesse?

    - O que aconteceu?


    Vale lembrar que, se for uma pesquisa na internet, basta procurarmos por "o que
    aconteceu" e recebermos um resultado melhor sobre o nosso problema, porém, nos
    fóruns ou para nossos companheiros e companiras de trabalho, devemos utilizar
    os recursos disponíveis, como mostrar uma imagem do erro que apareceu na nossa
    tela e compartilhar a parte de código que não está funcionando como desejamos.


    Alguns recursos úteis para compartilhamento nos fóruns é o uso do imgur (https://imgur.com),
    para compartilhamento de imagens, e do Gist (https://gist.github.com) para compartilhar
    trechos do nosso código-fonte.


    Essa dica é muito boa para quando estivermos recebendo um erro, e quando desejamos
    criar um log e não sabemos nem como começar?


    Basta pensarmos nas seguintes questões e para formular a melhor pergunta:


    - O que eu quero fazer?

    - O que eu sei fazer?

    - Eu já fiz isso alguma vez?

    - Existe alguma referência na qual estou baseando?


    Essas questões nos ajudam a contextualizar a outra pessoa sobre qual o nosso nível
    de conhecimento e facilita até mesmo a colocação das palavras por parte dela para
    que tenamos melhor entendimento do que ela vai nos dizer.


    Sempre que formarmos uma pergunta na internet devemos levar em consideração essas
    questões e utilizá-las para facilitar a nossa comunicação. O uso das imagens e
    compartilhamento do código é extremamente útil, uma vez que a pessoa pode analisar
    exatamente o que aconteceu e o que estávamos fazendo.


    ## 6.6 Conclusão


    Não existe uma fórmula mágica da produtividade ou da aprendizagem ágil, como dizem
    por aí, pois tudo depende do nosso contexto e nem tudo se aplica para todas as
    pessoas. Por isso é extremamente importante que busquemos nos conhecer melhor
    e entender as nossas dificuldades, adaptando toda a nossa vida a...

