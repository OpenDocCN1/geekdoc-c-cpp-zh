    Estamos procurando por pessoas para uma vaga de front-end, vamos procurar por:
    HTML, CSS, JavaScript, React, Angular, Vue.js, tecnologias que estamos utilizando
    em nosso software. Se é para vagas de back-end, DevOps, engenheiros(as) ou analistas
    de dados, Mobile ou outras oportunidades, funcionaria do mesmo jeito: pesquisamos
    no currículo ou perfil pelas tecnologias e habilidades que achamos necessário
    para aquela oportunidade em questão.


    Ao montar nosso currículo devemos nele como uma vitrine que servirá para vender
    nosso produto, que é o nosso trabalho, então devemos colocar exatamente o que
    queremos que a pessoa saiba de nós e o que se encaixa naquela empresa. Por exemplo:
    se é uma empresa de publicidade online, será muito importante ressaltarmos que
    temos conhecimento em SEO (otimização para motores de busca), pois eles precisam
    aparecer no Google e outros buscadores, se é uma empresa de robótica, inteligência
    artificial, eletrônica, e por aí vai. Saber o conhecimento em conhecimento.


    Uma boa estratégia é montar vários currículos de acordo com as empresas que se
    deseja entrar. Não compensa enviar o mesmo currículo ressaltando nosso conhecimento
    em redes e administração de servidores, ou o desenho artístico e publicitário,
    para uma empresa de varejo, pois isso não será muito útil para a empresa.


    Já quando falamos do perfil em sites de emprego, normalmente, só conseguimos criar
    um perfil. Nesse caso é extremamente importante que deixemos claro qual o nosso
    objetivo e quais são as nossas habilidades.


    ## O que colocar e o que não colocar em um currículo para programador(a)


    Estamos montando nossa vitrine então é normal querermos mostrar tudo o que sabemos
    fazer, mas já sabemos que isso não será relevante para o recrutamento. Devemos
    enxugar o currículo e colocar o que é necessário, mas como vamos adivinhar esse
    "o que é necessário?"


    Para saber o que colocar no perfil é importante analisar cada situação e também
    os nossos objetivos profissionais. E a maneira mais prática de se fazer isso é
    olhando várias vagas de emprego antes de preencher o nosso currículo.


    Com essa pesquisa pelas vagas, vamos identificar as habilidades que as empresas
    estão procurando e, se realmente as possuírmos, vamos colocando-as em nosso currículo.


    Pessoalmente já descobri que algo que eu não achava tão importante destacar no
    currículo era muito procurado pelas empresas nesse tipo de análise de perfil que
    era a questão de participações em comunidades de programação.


    Em um currículo é importante colocar os nossos projetos para que ganhemos destaque
    pela nossa experiência. Como projetos open source, os que fizemos para amigos(as)
    ou as iniciativas de que participamos. Isso ajuda a pessoa de recrutamento e seleção
    a identificar a nossa experiência e temos interesses individuais.


    Colocar as comunidades de que participamos de maneira ativa e quais projetos contribuímos
    é muito bom, visto que isso vai demonstrar mais da nossa experiência com trabalho
    em equipe ou mesmo habilidades técnicas dependendo de como contribuímos com as
    comunidades.


    O que não devemos colocar, a não ser que seja solicitado, são informações ambíguas
    como porcentagem de algo que dominamos, foto de perfil ou redes sociais que não
    demonstram nada do nosso perfil profissional (como um Snapchat, que é somente
    para compartilhar momentos legais de nossa vida com nossos amigos e amigas).


    Vamos pensar nesse exemplo de porcentagem: uma pessoa procurando emprego como
    back-end coloca que domina 75% de JavaScript.


    O que seria 75% de JavaScript ou qualquer outra linguagem de programação? Seria
    ter lido 75% das bibliotecas que existem, dominar 75% de lógica de programação
    com essa linguagem?


    Percebemos que algo desse tipo, ao vez de gerar confiança no nosso perfil, só
    gera dúvidas.


    Colocar que conhecemos uma linguagem de programação X ou uma tecnologia já é suficiente
    para despertar interesse no recrutamento para um contato por telefone ou por e-mail
    que seja questionado o que realmente dominamos sobre aquilo.


    Também não é interessante encher o nosso currículo de cursos que não têm relação
    nenhuma da vaga que estamos concorrendo. Eu já fiz curso de desenho artístico
    e publicitário e também já dei aulas de patinação e isso não é nada importante
    para alguém que quer saber o que realmente sobre programação.


    Algo que pode ser interessante adicionar em nosso currículo, que o próprio LinkedIn
    recomenda, é um resumo do nosso conhecimento logo no início. Esse resumo pode
