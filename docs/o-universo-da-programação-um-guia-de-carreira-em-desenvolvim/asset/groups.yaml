    ## 4.2 Front-end


    Quando dividimos os sistemas Web, no primeiro capítulo, conhecemos o modelo de
    funcionamento de sistemas, em que temos o front-end ou client-side, que é o que
    vemos no navegador, e back-end ou server-side, que é o programa rodando no servidor,
    mas não foi informado, até agora, que uma pessoa que trabalha com front-end faz
    no seu dia a dia, certo?


    Uma pessoa desenvolvedora front-end é responsável por programar e fazer manutenção
    de componentes visuais da aplicação Web, assim como encaixá-los na tela e fazer
    que esses componentes funcionem com integração com o servidor. Tudo o que vemos
    no navegador deve ter sido escrito por uma pessoa de frontend. Entendemos como
    componentes os itens que aparecem na interface com os botões, as caixas de texto,
    caixas de diálogo, alertas. Enfim, tudo o que está na tela.


    No dia a dia, a pessoa desenvolvedora front-end recebe interfaces/páginas ou componentes
    que algum responsável pela área de design do produto ou da empresa criou e reproduz
    isso em código-fonte que vai rodar no navegador.


    Fora transformar a arte desenhada em código para o navegador apresentar na tela,
    também faz a integração com o back-end, animações, interoperabilidade entre navegadores
    (pois entre Internet Explorer, Google Chrome e Firefox pode acontecer de um mesmo
    código funcionar de maneira diferente, ainda quando os usuários utilizam versões
    antigas dos navegadores), cuida da acessibilidade de um site, que é deixar a interface
    usável por pessoas com deficiência (visual, motora, cognitiva etc.), fora do trabalho
    de estruturar o código de um modo que o search engines (motores de busca, como
    o Google, Bing ou DuckDuckGo) possam encontrar nosso site.


    Essa pessoa também será responsável por desenvolver uma interface que funcione
    em um navegador de celular, tablet ou desktop - chamamos isso de responsividade
    -, e programar testes para que tenamos garantia do correto funcionamento da interface.


    Alguns conhecimentos técnicos que um(a) desenvolvedor(a) front-end precisa possuir:


    - **HTML:** é a linguagem de marcação, a linguagem que estrutura o conteúdo da
    página Web de um modo que o navegador e outros leitores de código entendam o que
    cada frase ou item na tela é um título, um parágrafo, uma seção da página, uma
    imagem etc.).

    - **CSS:** é a linguagem que dita o estilo visual da nossa página (as cores, os
    formatos, o layout, as animações). Utilizando CSS nós transformamos o HTML que
    o navegador está mostrando na tela de uma coisa sem vida para o desenho que a
    pessoa de design criou.

    - **JavaScript:** é uma linguagem de programação que traz interatividade para
    o client-side. Faz a comunicação com servidores e executa ações que o usuário
    ativa na página.

    - **Node.js:** além da linguagem JavaScript, hoje em dia pessoas desenvolvedoras
    front-end precisam conhecer Node.js, uma plataforma de desenvolvimento de softwares
    que executa JavaScript, pois utilizamos essa tecnologia para muitas coisas no
    nosso dia a dia, como automatizar tarefas repetitivas de front-end ou mesmo servir
    nossa aplicação client-side para o usuário final.

    - **Performance Web:** a performance (ou desempenho) de uma aplicação Web é a
    velocidade com uma página carrega, a quantidade de dados que essa página baixa
    para a máquina do usuário, dentre outras preocupações. Performance é uma responsabilidade
    imensa da pessoa de front-end, pois o client-side é responsável por 80 a 90% da
    velocidade de carregamento de um site e ninguém quer permanecer em um site que
    fica travando ou demora muito para carregar, muito menos um site que consome toda
    a banda que contratamos com nossa operadora de celular.

    - **Semântica:** a linguagem HTML possui elementos específicos para cada item
    que está aparecendo na tela. Se é um botão, existe o elemento correto para isso,
    se é um parágrafo, também. Semântica, em front-end, é o uso correto da linguagem
    HTML de marcação do conteúdo. Isso é muito importante, pois com técnicas de SEO,
    melhora o conteúdo para os buscadores localizarem nosso site e também ajuda a
    acessibilidade, para os leitores de tela, softwares que leem a tela para usuários
    com deficiência visual, encontram e entendem mais facilmente o conteúdo e componentes
    na aplicação.

    - **SEO:** o marketing foi algo importante para qualquer empresa. SEO, hoje, faz
    parte do marketing da maioria dos produtos digitais, pois o nosso site precisa
    aparecer nas primeiras páginas do buscador se a empresa não tem vendas, ou se
    não tem acessos, o conteúdo não é encontrado. SEO (Search Engine Optimization)
    é otimizar o nosso site para os search engines que encontrem mais facilmente baseado
    em otimizações que esses mesmos sites nos orientam a fazer em nossas páginas.

    - **Acessibilidade:** é tornar a interface usável para pessoas com deficiência
    visual, motora, cognitiva ou outro tipo. A internet é algo que deve ser de livre
    acesso a todas as pessoas, inclusive pessoas com alguma deficiência. É nossa responsabilidade
    criar interfaces e sites que essas pessoas consigam utilizar.

    - **Testes a interface:** trata-se de técnicas para confirmar nada par de funcionar
    depois que mexemos em alguma parte da tela/página/interface ou em algum código
    front-end, assim como os testes de software e testes automatizados, que comentei
    anteriormente.

    - **User experience (UX):** como diz a tradução, é a experiência do usuário, é
    cuidar para a a tenha agradável. Uma pessoa de front-end não precisa dominar UX,
    mas ter o conhecimento básico vai ajudar a garantir a qualidade.

    - **Integração com back-end:** é nossa responsabilidade criar interfaces e sites
    que essas pessoas consigam utilizar. É importante a pessoa de front-end domine
    as técnicas, modos de guardar dados no back-end.


    ## 4.3 Back-end


    O conhecimento de uma pessoa que trabalha com back-end é voltado para aquilo que
    “não enxergamos” nos sistemas (ou aplicações com a internet) mas que estão ali!
    Essa é a pessoa responsável por criar a parte do sistema que armazena os dados
    no banco de dados, que interage com outros sistemas e processa dados para transformar
    em informação e devolver resultados organizados para o client-side. É onde fica
    a regra de negócio.


    Enquanto no front-end temos as regras de visualização (o que deve aparecer na
    tela em determinada interação do usuário), no back-end temos os modelos de negócio
    de uma empresa, como taxas, valores, recomendações para o usuário etc. São coisas
    do núcleo dos sistemas e que devem ficar seguras guardadas em nossos servidores.


    Regras de negócio no client-side poderiam ser facilmente encontradas, pois bastaria
    pegar o código-fonte, que já está carregado no nosso navegador, e utilizar alguma
    técnica de análise de códigos para exibir o seu conteúdo e entendermos como tudo
    funciona no software. Isso só não acontece com certa frequência porque as regras
    mais importantes estão protegidas no back-end de nossas aplicações.


    Como, normalmente, são tratadas grandes quantidades de dados, é importante que
    uma pessoa possua um bom conhecimento em estruturas de dados, algoritmos de busca
    e ordenação, que são os algoritmos utilizados para organizar e encontrar dados
    nas estruturas de dados, para criar rotinas performáticas, códigos que respondem
    rápido às ações de nossos usuários dos softwares, e devolver uma resposta otimizada
    quando o front-end solicitar informações.


    Quando devolver a resposta otimizada é porque, durante a comunicação entre front-end
    e back-end, serão trocadas mensagens (com o uso do protocolo HTTP, por exemplo).
    O sistema buscará dados do banco e devolverá esses dados para o front-end exibir
    na tela. Esse trâmite de pegar os dados do banco é um dos mais custosos para uma
    aplicação.

