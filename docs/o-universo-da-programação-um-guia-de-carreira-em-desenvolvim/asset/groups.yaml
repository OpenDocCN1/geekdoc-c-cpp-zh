    # CAPÍTULO 3

    Pessoas que escrevem programas e lançam foguetes


    Muita gente que sente vontade de entrar na área de programação fica com medo do
    desafio porque algumas pessoas que falam dessa área pela internet ou em jornais
    na TV (que trabalham com programação ou não) exageram um pouco sobre a dificuldade
