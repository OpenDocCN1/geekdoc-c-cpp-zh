    ## 8.3 Desmistificando vagas de emprego e escapando de ciladas


    As vagas de emprego da área de desenvolvimento podem assustar, e muito, no início
    de carreira, pois, além da maioria dizer que procura pessoas com experiência,
    ainda temos os requisitos técnicos em forma de listas imensas.


    Já adianto que não devemos assustar com isso. Nós não precisamos ter todos os
    requisitos de uma descrição para nos candidatarmos à vaga. É a crença de que é
    necessário 100% dos requisitos preenchidos que nos limita e faz com que não enviemos
    o currículo para uma vaga com que tanto sonamos.


    Quando a pessoa de recrutamento entrar em contato conosco, ela vai confirmar o
    que sabemos e o que não sabemos. Se não cumprimos todos os requisitos, o importante
    neste contato é demonstrar que temos interesse em aprender, o que não dominamos
    daquela lista de requisitos e a empresa, se tiver boa cultura e estiver em um
    bom momento de contratação (quando não estão desesperados por profissionais em
    nível sênior para apagar incêndios nos softwares), por acabar nos contratando
    e ajudando a desenvolver o que faltar.


    O grande risco de vagas de programação e podemos identificar direto nas próprias
    descrições são as vagas para determinada função e que pedem habilidades de outra
    nada parecida com o que fazemos.


    Exemplo: existe uma vaga para o perfil front-end, mas quando analisamos os requisitos
    que vemos, na realidade, o que a empresa procura é alguém full-stack. Sabemos,
    visto os capítulos anteriores, que front-end tem uma atribuição e full-stack tem
    outra.


    ![](img/1980cd0900b9cb84feb62a3cc0d390f3_154_0.png)


    Na imagem vemos que o título é front-end, mas na descrição está falando especificamente
    full-stack e tem como requisitos bancos de dados e tecnologias de back-end. Habilidades
    que não deveriam ser cobradas de uma pessoa que iria trabalhar somente com front-end.


    Esse título não condiz com a descrição da vaga pode ser um erro da área de recursos
    humanos da empresa quanto uma vaga cilada, aquele que recebemos 1x por termos
    registro em carteira com uma profissão, mas deveríamos receber 3x, pois desempenpenhamos
    outra função.


    Não tem como adivinhar qual é a real intenção de quem escreveu a vaga e por partirmos
    do pressuposto que alguém errou no cadastro, mas é muito importante questionar
    qual a real atribuição de quem vai desempenhar essa dentro da empresa. Quando
    a pessoa de recrutamento entrar em contato conosco, devemos questionar bastante
    para descobrir isso, se for uma vaga cilada, dizemos que não estamos interessados(as)
    no momento.


