    ## 9.2 Paradigmas de programação


    Ao trabalharmos com programação, temos diferentes maneiras de estruturar o nosso
    algoritmo, de escrever uma nova lógica. Não é somente colocando as reginhas embaixo
    da outra. Existem diferentes modos de implementar essas regras. Existem diferentes
    maneiras de estruturar nosso programa serão chamadas de paradigmas de programação.


    Conhecer muito bem os paradigmas vai nos ajudar a entender a melhor maneira de
    resolver cada problema. Quando um paradigma não nos atender, podemos utilizar
    outro (se a nossa linguagem permitir o uso de múltiplos paradigmas).


    Os paradigmas mais conhecidos, hoje em dia, são: Orientação a Objetos, Programação
    Funcional e Programação Imperativa. Mas existem paradigmas em Ciência da Computação
    e podemos aprender mais sobre eles por estes recursos:


    - Análise e Design Orientados a Objetos, por Hélio Engholm (https://www.amazon.com.br/Análise-Design-Orientados-Objetos-Engholm-ebook/dp/B07199C5LH/)

    - Orientação a Objetos: Aprenda seus conceitos e suas aplicabilidades de forma
    efetiva, por Thiago Leite e Carvalho (https://www.casadocodigo.com.br/products/livro-oo-conceitos/)

    - Haskell: Uma introdução à programação funcional, por Alexandre Garcia de Oliveira
    (https://www.casadocodigo.com.br/products/livro-haskell/)


    E Programação Imperativa é o modelo clássico que aprendemos quando estamos programação
    em qualquer linguagem, por isso basta estudar programação e algoritmos, com os
    recursos citados anteriormente, que conhecemos o Paradigma Imperativo de programação.


    ## 9.3 Design Patterns


    Assim como os paradigmas e estruturas de dados, existem algumas “regras” que podemos
    seguir para facilitar e melhorar a nossa vida como pessoas desenvolvedoras de
    software. Essas regras são os padrões de projeto.


    Para programar só é necessário entender lógica de programação e aprender uma linguagem
    para criar um bom software, um sistema que seja fácil de manter, atualizar e escalar
    (crescer), é muito importante queremos os design patterns (padrões de projeto).


    Os padrões de projeto nada mais são que práticas de desenvolvimento de software
    que algumas pessoas criaram há tempo para que a criação de grandes aplicações
    fosse menos dolorida, pois antigamente as pessoas desenvolvedoras passavam por
    certos apertos na hora de escrever programas e dar manutenção neles.


    Esses padrões foram extensivamente adotados e são estimulados até hoje. O melhor
    local para aprender sobre esse tema é o livro Padrões de Projetos, de Erich Gamma
    (https://www.amazon.com.br/Padrões-Projetos-Erich-Gama/dp/8573076100/).


