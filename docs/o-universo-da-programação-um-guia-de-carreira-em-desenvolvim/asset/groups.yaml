    # ## 4.3 Back-end


    O conhecimento de uma pessoa que trabalha com desenvolvimento back-end é voltado
    para aquilo que nós “não enxergamos” nos sistemas Web (ou aplicações com integração
    com a internet) mas que estão ali!


    Essa é a pessoa responsável por criar a parte do sistema que armazena os dados
    no banco de dados, que interage com outros sistemas e processa dados para transformar
    em informação e devolver resultados otimizados ou organizados para o client-side.
    É no back-end que fica toda a regra de negócio de um'
  - '[PAGE 76]


    produto/site/aplicativo. É onde fica o modo como um produto funciona.


    Enquanto no front-end temos as regras de visualização (o que deve aparecer na
    tela em determinada interação do usuário), no back-end temos os modelos de negócio
    de uma empresa, como taxas, valores, recomendações para o usuário etc. São coisas
    do núcleo dos sistemas e que devem ficar seguras guardadas em nossos servidores.


    Regras de negócio no client-side poderiam ser facilmente encontradas, pois bastaria
    pegar o código-fonte, que já está carregado no nosso navegador, e utilizar alguma
    técnica de análise de códigos para exibir o seu conteúdo e entendermos como tudo
    funciona no software. Isso só não acontece com certa frequência porque as regras
    mais importantes estão protegidas no back-end de nossas aplicações e a dificuldade
    de invadir um servidor é muito maior.


    Como, normalmente, são tratadas grandes quantidades de dados, é importante que
    uma pessoa possua um bom conhecimento em estruturas de dados, algoritmos de busca
    e ordenação, que são os algoritmos utilizados para organizar e encontrar dados
    nas estruturas de dados, para criar rotinas performáticas, códigos que respondem
    rápido às ações de nossos usuários dos softwares, e devolver uma resposta otimizada
    quando o front-end solicitar informações.


    Quando devolver a resposta otimizada é porque, durante a comunicação entre front-end
    e back-end, serão trocadas mensagens (com o uso do protocolo HTTP, por exemplo).
    O sistema buscará dados no banco e devolverá esses dados para o front-end exibir
    na tela. Esse trâmite de pegar os dados do banco é um dos mais custosos para uma
    aplicação.


