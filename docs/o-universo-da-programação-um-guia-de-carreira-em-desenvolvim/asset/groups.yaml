    instalada diretamente pela loja de aplicativos do sistema operacional, seja Android
    ou iOS, por exemplo.


    Em distribuições Linux mais atuais também possuímos lojas de aplicativos bem parecidas
    com as dos aplicativos mobile. Isso facilita muito a vida de usuários mais leigos
    em tecnologia. Recentemente, a Microsoft também começou a seguir esta linha para
    seus sistemas operacionais mais modernos (a partir do Windows 8).


    Também podemos compartilhar arquivos executáveis de um celular para o outro, como
    acontece com os programas de computador.


    Vamos analisar um fantástico jogo de Dungeon Crawl Stone Soup, pois, além de ser
    um game de código aberto, funciona e está disponível na maioria das plataformas
    mobile.


    ![](img/1980cd0900b9cb84feb62a3cc0d390f3_37_0.png)


    Figura 1.15: Jogo DCSS


    Este jogo é escrito na linguagem de programação C++, como podemos ver no seu repositório
    no GitHub. Mas a grande maioria de aplicativos de celular é escrita em Java e
    Kotlin, para Android, ou Objective-C e Swift, para iOS. Normalmente se utiliza
    a linguagem C


    ou C++ quando a aplicação demanda muita performance e recursos mais complexos
    do sistema operacional, principalmente em games.


    Quando olhamos o código-fonte do jogo, reparamos que é um amontoado de arquivos
    que precisa ser compilado para só depois ser enviado para uma loja de aplicativos
    para que o usuário possa baixar.


    Não é tão simples subir um aplicativo para uma loja ou central de programas. As
    centrais de programas possuem suas regulamentações que a pessoa que desenvolveu
    o software precisa seguir. Tanto para o usuário de uma plataforma (Android, iOS)
    possa ter uma boa experiência de quanto para analisar a segurança do app.


    Quando lançado o jogo Pokémon Go, em 2016, pessoas não conseguiram segurar a ansiedade
    (como eu) de esperar o lançamento em todos os países e baixaram arquivos .apk,
    que é o executável para sistemas Android, diretamente de websites não confiáveis.
    Isso expõe o usuário a um risco de segurança muito grande, pois não houve verificação
    de permissões do app, análise profunda do mesmo ou coisas do tipo central de apps.


    Contudo, algumas empresas utilizam a estratégia de enviar diretamente os .apk
    para seus usuários a modo de fazer atualizações mais rápidas, sem passar pelo
    período de espera de uma central de apps. O que não é muito legal, mas acontece.


    ## 1.6 Conclusão


    Entendemos, até aqui, que existem diversas maneiras de enviar softwares para o
    nosso usuário final. Alguns softwares precisam ser compilados e enviados direto
    para o computador do usuário e outros rodam em servidores na internet trocando
    mensagens através de protocolos de rede com nossos navegadores.


    Sistemas Web e websites utilizam o modelo cliente-servidor, no qual trocas de
    dados entre ambos e temos softwares rodando no navegador do usuário (cliente)
    e no servidor.


    Softwares Desktop precisam ser compilados e ser executáveis são baixados por meio
    de um website diretamente para o sistema operacional do usuário, podemos podemos
    os executáveis de um computador para o outro via pen drives ou pastas de rede,
    por exemplo.


    Aplicativos de celular têm a dinâmica parecida com softwares desktop com a diferença
    de que precisam ser enviados para uma loja de aplicativos com certa regulamentação
    e também conseguimos compartilhar entre celulares ou alguma outra maneira de enviar
    seus executáveis para os dispositivos.


    Com todo esse conhecimento, já demos nosso primeiro mergulho fantástico universo
    da programação, pois entendemos o que é um programa, o que são linguagens de programação
    e como são escritos os programas e até mesmo como enviar os programas para as
    máquinas de nossos usuários.


    Vamos continuar nossa viagem universo analisando no próximo capítulo alguns motivos
    pelos quais é interessante envolver nesta área de atuação.


    ## CAPÍTULO 2


    ## Por se envolver com programação


    Com o passar dos tempos, a humanidade vivenciou algumas revoluções industriais
    e tecnológicas que transformaram a vida e a sociedade com a automação, inovação
    e com maquinários poderosos que substituem o ser humano em diversas posições de
    trabalho. Hoje vivemos uma revolução… Agora, a **revolução digital.**


    Todos os dias uma empresa ou lança alguma ideia fantástica de automação para agilizar
    processos, diminuir mão de obra ou somente para mostrar que dá para fazer algo
    com inteligência artificial e algumas placas eletrônicas.


    E a área de inteligência artificial nem é algo novo. Ela existe desde 1956, logo
    depois da Segunda Guerra Mundial. Essa área só ganhou visibilidade agora porque
    a evolução do hardware possibilitou seu uso em vários locais.


    Temos empresas automatizando suas colheitas para economizar água, saber a hora
    exata de colher os produtos, controlar seus tratores de arado. Outras ciclo estoque
    é todo automatizado e seu setor de logística é incrivelmente funcional e eficaz.
    Existem as que já estão investindo em nanrorobôs para matar células de câncer
    e também não podemos deixar de pensar em automação residencial e cidades inteligentes,
    podemos utilizar AI (*artificial intelligence*) para os mais variados finos.


    Graças a toda essa revolução algumas profissões vão desaparecer, outras vão surgir
    e acredito fortemente que **programação** será para todas as pessoas que hoje
    é o inglês ou uma faculdade: um requisito básico no currículo.


    Toda essa mudança é muito comum e previsível em uma sociedade que busca a evolução.
    A tecnologia faz parte da mudança e auxilia a inovação, programação faz parte
    de tecnologia.


    Se o nosso emprego for muito repetitivo e não demandar certo trabalho cognitivo
    ou criativo, que só um ser humano conseguiria inventar, então corremos o risco
    de sermos substituídos por máquinas em um futuro não muito distante.


    Acredito que, ao programar, adquirimos o pensamento sistêmico, que é uma forma
    de analisarmos e descrevermos como solucionar problemas. É a capacidade de analisar
    diversos cenários, eventos e “prever” algo que possa acontecer e se adantar enfrentar
    isso.


    Imagine que, com o passar do tempo, isso se torna tão natural para nossa mente
    que agimos de modo sistêmico usando lógica para resolver a maioria dos problemas
    cotidianos!


    ### 2.1 Programação como treinamento para resolver problemas


    Quando estamos aprendendo programação, precisamos aprender a abstrair ações, fluxos,
    problemas, assim como acontece enquanto estudamos ou trabalhamos com matemática.


    Isso porque precisamos entender um problema, traduzir para uma linguagem de programação
    e então criar uma solução computacional para isso. Na matemática transformamos
    os problemas em fórmulas para conseguir o mesmo.


    O raciocínio lógico pode servir em diversas partes da nossa vida, tanto para trabalhar
    com computadores quanto para analisarmos melhor os pontos em uma discussão, pois
    isso não é algo novo. Aristóteles estabelece a lógica como disciplina em sua obra
    Organon e depois disso o trabalho do filósofo foi usado para criar diversos tipos
    de lógica no Ocidente e na Europa.


    ### 2.2 Programação como negócio


    Não é de hoje que empresas ganham dinheiro com código. Existem empresas que desenvolvem
    sistemas para outras empresas há mais de 100 anos, como é o caso da IBM, que existe
    desde 1888, tem quase 500 mil empregados e vale mais de 202,5 bilhões de dólares.


    Existem diversas maneiras de se explorar o mercado de software, seja criando uma
    consultoria que desenvolve sistemas para outras, criando um software e dando manutenção
    a ele como produto principal ou mesmo fazendo os dois, como no caso da Amazon,
    que

    '
  mdcn: '

    直接从操作系统的应用商店（例如 Android 或 iOS）进行安装。


    在较新的 Linux 发行版中，我们也拥有与移动端应用商店非常相似的商店。这极大地方便了技术不太纯熟的用户的生活。最近，微软也开始在其更现代的操作系统（从
    Windows 8 开始）中遵循这一路线。


    我们还可以像电脑程序一样，在手机之间分享可执行文件。


    让我们分析一款非常有趣的《地下城石石汤》（Dungeon Crawl Stone Soup），因为它是一个开源游戏，而且在大多数移动平台上都可以运行并可用。


    ![](img/1980cd0900b9cb84feb62a3cc0d390f3_37_0.png)


    图 1.15：DCSS 游戏


    这个游戏是用 C++ 编程语言编写的，正如我们在 GitHub 仓库中看到的。但大多数手机应用是使用 Java 和 Kotlin 编写 Android 应用，或者使用
    Objective-C 和 Swift 编写 iOS 应用。通常，当应用需要高性能和更复杂的系统资源时（特别是在游戏领域），会使用 C 语言或 C++。


    当我们查看游戏的源代码时，发现它是一堆文件，这些文件需要经过编译，然后才能发送到应用商店供用户下载。


    将应用程序上传到商店或程序中心并不是那么简单。程序中心有其软件开发人员需要遵循的规章。这既是为了让平台（Android、iOS）的用户获得良好的体验，也是为了分析应用的安全性。


    当 2016 年《宝可梦 Go》（Pokémon Go）发布时，人们无法抑制（像我一样）等待在所有国家发布的焦虑情绪，直接从不可信的网站下载了 `.apk`
    文件（这是 Android 系统的可执行文件）。这让用户面临巨大的安全风险，因为没有对应用进行权限检查、深度分析或类似应用商店那那的中心化审查。


    然而，一些公司采用直接向用户发送 `.apk` 文件的策略，以便更快速地进行更新，而无需经过应用商店的等待期。这虽然不太理想，但确实在发生。


    ## 1.6 结论


    到为止，我们了解到有多种方式向我们的最终用户发送软件。某些软件需要编译并直接发送到用户的计算机，而另一些运行在互联网服务器上，通过网络协议与我们的浏览器交换信息。


    Web 系统和网站使用客户端-服务器模型，其中之间进行数据交换，我们在用户的浏览器（客户端）和服务器上都有运行的软件。


    桌面软件需要编译并且是可执行的，它们通过网站直接下载到用户的操作系统，我们可以通过 U 盘或网络文件夹将一台电脑的可执行文件传输到另一台电脑上。


    手机应用程序的动态与桌面软件相似，不同在于它们需要发送到具有特定规定的应用商店中，而且我们也可以在手机之间或通过其他方式将其可执行文件发送到设备中。


    有了这些知识，我们已经对编程世界进行了第一次奇妙的深潜，因为我们理解了什么是程序、什么是编程语言、程序是如何编写的，甚至如何将程序发送到用户的机器上。


    让我们在下一章继续我们的宇宙之旅，分析一下为什么加入这一领域是有趣的。


    ## 第 2 章


    ## 为什么要参与编程


    随着时间的推移，人类经历了一些工业和技术革命，这些革命通过自动化、创新以及在许多工作岗位上取代人类的强大机械，改变了生活和社会。今天，我们生活在一场革命中……现在，**数字革命**。


    每天都有公司发布出各种奇妙的自动化想法，以加速流程、减少劳动力，或者仅仅是为了展示利用人工智能和一些电子板可以实现某些事情。


    人工智能领域并不是新事物。它自 1956 年（二战后不久）就已经存在了。这个领域现在之所以获得关注，是因为硬件的演进使其能够在许多地方被使用。


    我们看到公司正在自动化收割以节水、准确准确的收获时间、控制他们的拖拉机。有些公司的循环库存是全自动化的，其物流部门极其高效且有效。有些公司已经在投资纳米机器人来杀死癌症细胞，我们还不能忽视家居自动化和智能城市，我们可以利用
    AI（*artificial intelligence*）处理各种细微的任务。


    多亏这一切革命，一些职业将会消失，另一些将会出现，我深信**编程**对于现在所有人来说，就像现在的英语或大学学位一样：是简历中的基本要求。


    这种变化在追求进化的社会中非常常见且可预见。技术是变化的一部分并辅助创新，而编程是技术的一部分。


    如果我们的工作非常重复，并且不需要某些只有人类才能发明的认知性或创造性工作，那么我们面临着在不不遥的未来被机器取代的风险。


    我相信，通过编程，我们获得了系统性思维，这是我们分析和描述解决问题的方法。它是分析多种场景、事件并“预测”可能发生的事情且提前应对它们的能力。


    想象一下，随着时间的推移，这对我们的大脑来说变得如此自然，以至于我们以系统的方式使用逻辑来解决大多数日常生活的问题！


    ### 2.1 编程作为解决问题的训练


    当我们学习编程时，我们需要学习如何抽象动作、流程、问题，就像我们在学习或处理数学问题时一样。


    这是因为我们需要理解一个问题，将其翻译成编程语言，然后为此创建一个计算解决方案。在数学中，我们将问题转化为公式以实现同样的效果。


    逻辑推理可以用于我们生活的许多部分，无论是操作计算机工作，还是为了更好地分析讨论中的论点，因为这并不是新事物。亚里士多德在他的著作《工具论》（Organon）中将逻辑确立为门学科，之后这位哲学家的工作被用于在西方和欧洲创造各种类型的逻辑。


    ### 2.2 编程作为业务


    公司通过代码赚钱并不是今天才开始的。有些为其他公司开发公司的已经超过 100 年了，IBM 就是这样一个例子，它自 1888 年以来就存在了，拥有近 50
    万员工，价值超过 2025 亿美元。


    有多种方法可以开发软件市场，无论是创建一个为其他公司开发系统的咨询公司，创建一个软件并将其作为主要产品进行维护，或者两者兼顾，正如亚马逊的情况，它

