    # CAPÍTULO 7

    No universo afora as pessoas precisam da nossa ajuda


    Algo extremamente importante, e que mais me anima no universo da programação,
    é o modo como as pessoas se importam em compartilhar conhecimento, seja algo de
    autoria ou até divulgando o conteúdo de outras pessoas. Foi graças a esse tipo
    de movimento que foi incluído no desenvolvimento de software e eu não poderia
    deixar de comentar sobre isso.


    Existem muitos eventos, comunidades, blogs, canais e iniciativas para que a informação
    chegue ao maior número de pessoas no mundo inteiro.


    Existem muitos motivos para contribuirmos com essas iniciativas. A democratização
    do acesso à informação por si só já é relevante suficiente para que olhemos com
    bons olhos para o movimento das comunidades de programação.


    Muita gente não possui recursos financeiros para adquirir um livro, os melhores
    cursos ou para estar em algum lugar em data específica de um evento. Uma convenção
    que aconteça em São Paulo, por exemplo, pode não ser acessível para pessoas de
    outro estado que não consegu viajar e custear a hospedagem e alimentação no período
    do evento.


    Podemos pensar: "Mas um e-book da Casa do Código custa 30 reais, atualmente!",
    mas esse pode ser o valor que uma pessoa utiliza para custear os recursos básicos
    e não dispensáveis de sua vida, como uma conta de energia, a despesa de casa,
    conta de água etc.


    No mundo agora, as pessoas mais carentes não têm a escolha de gastar dinheiro
    em um curso, pois seu objetivo de vida é um:'
  - '[PAGE 134]


    sobreviver. Realmente não tem como priorizar um curso quando se passa fome, mesmo
    que a longo prazo seja muito melhor.


    Claro que existem exceções e exemplos de pessoas que passam pelas mais diversas
    situações para investir em sua carreira, às vezes deixando de comer para tal,
    porém não podemos tratar todo mundo como sendo iguais. Cada pessoa possui uma
    história e necessidades diferentes. O grande ponto é: as pessoas precisam de ajuda
    nós podemos ajudar.


    À vezes, nós não achamos capazes de ajudar o mundo, mas a internet nos empoderou
    e hoje podemos ajudar a vida de milhares de pessoas através de uma postagem nas
    redes sociais. Temos comunidades e pessoas utilizando esse recurso para chegar
    ao maior número de gente possível.


    Mas que é uma comunidade, afinal de contas? Vamos entender melhor o que são e
    quais são as comunidades de tecnologia que podemos começar a nos envolvermos desde
    o início da carreira e aprender maneiras de contribuir com elas e ajudar a mudar
    a vida das pessoas por aí.


    # 7.1 Comunidades, eventos, fóruns e hackathons


    Uma das maneiras mais legais de se aprender programação é em grupo. É quando nos
    juntamos para fazer um grupo de estudos sobre uma linguagem de programação, sobre
    uma tecnologia nova, compartilhar desafios e soluções ou ler um livro em conjunto.


    A troca de experiência proporcionada pelos grupos de estudos é muito boa para
    nossa evolução profissional e também para que aprendamos mais em menos tempo.
    Isso pode acontecer de diversos modos, dentre os quais está a nossa organização
    em comunidades e fóruns.'
- md: '

    As comunidades são grupos de pessoas que se unem, seja online ou presencial, por
    um interesse em comum, pela cultura do grupo, às vezes por histórias parecidas
    ou somente por objetivos iguais. Algumas comunidades nascem em volta de tecnologias,
    como linguagens de programação, ferramentas de desenvolvimento, e outras vezes
    por um objetivo foco, como compartilhar conhecimento.


    Temos alguns exemplos de comunidades brasileiras que nasceram por um interesse
    em comum, como Python Brasil, PHP Brasil, JavaScript Brasil, Ruby Brasil, Java
    Brasil. Essas comunidades existem porque as pessoas se interessam por essas linguagens
    e querem trocar experiências, links relevantes, mostrar o que fazem e se ajudar
    a aprender mais sobre elas.


    Outras comunidades não nasceram em volta de uma tecnologia, mas em volta de um
    objetivo, como compartilhar conhecimento independente da área ou tecnologia, como
    o Training Center, de Garoa Hacker Clube, Things Hacker Team ou o Code Club que
    são grupos que estimulam a troca de experiências e até o ensino de programação
    para crianças.


    Existem grupos com forte apelo social, que levam conhecimento para grupos sub-representados,
    como pessoas carentes, mulheres, pessoas negras, pessoas com deficiência, indígenas,
    imigrantes etc., como o Codamos, Django Girls, Rails Girls, Afro Python ou WoMakersCode.


    Se procurarmos na internet encontramos comunidades de todos os tipos, com as mais
    variadas filosofias e objetivos. Bastar algo com que nós identifiquemos e nos
    unirmos a elas. Entrar em comunidades logo no início da nossa carreira pode ser
    de grande ajuda, pois a experiência dos outros pode facilitar demais a nossa vida
    e contribuir para nossa ascensão profissional.


    Os fóruns de discussão são ferramentas utilizadas por essas comunidades para troca
    de conhecimento quando alguém posta uma pergunta e outra pessoa tenta ajudar a
    resolver seu problema.


    Esses fóruns podem existir dos mais diversos modos, como grupos em redes sociais
    ou plataformas próprias.


    Já os hackathons são grandes competições de programação que acontecem, normalmente,
    com um objetivo legal, como resolver um problema social, ajudar uma comunidade
    ou tecnologia a crescer. Além disso, eles possuem premiação. Em hackathons, as
    pessoas formam times multidisciplinares que competem para trazer a melhor solução,
    que será avaliada por uma bancada alinhada com os objetivos da competição e com
    os critérios definidos.


    Em todo caso, quanto mais participamos de grupos mais aprendemos. Mas é importante,
    compartilhemos e tentemos ajudar as pessoas que estão ali. Só assim as comunidades
    podem continuar existindo.


    Por mais que, não começo, nós sentimos incapazes de ajudar, sempre conseguimos
    contribuir com as comunidades de alguma forma. Em questões de fóruns, por exemplo,
    podemos dizer que se não entendemos uma pergunta, para que ela seja mais bem formulada,
    ou podemos tentar responder até onde nós sabemos. Não é preciso ir além do nosso
    conhecimento atual, mas já podemos ajudar com o que temos e, de acordo com o que
    vamos participando mais vamos evoluindo profissionalmente e conseguindo contribuir
    de outras formas.


    ## 7.2 Gerando conteúdo para a internet


    O melhor modo de atingirmos a maior quantidade de pessoas, hoje em dia, é utilizando
    a internet. Sempre que precisamos aprender algo novo, nem que seja algo como “como
    fazer arroz”, iremos para a internet. Em desenvolvimento de software é o mesmo
    processo, principalmente para pessoas mais jovens, pois já crescemos no ambiente
    de pesquisa no internet, então já estamos mais acostumados com isso.


    Um exemplo da força da internet é que mais de 90% das pessoas pesquisam na internet
    antes de comprar um produto, segundo um levantamento da TNS Research International,
    uma consultoria de pesquisasas.


    Por isso, um excelente modo de contribuir com as comunidades é gerando conteúdo,
    seja em texto, como blogs, ou vídeos, como os canais em plataformas como o YouTube,
    assim como em áudio, em podcasts.


    Podemos contribuir com uma iniciativa existente, como um portal, ou criar nossa
    própria. Isso depende mais do nosso objetivo pessoal (divulgar nosso nome ou contribuir
    com um grupo) ou se nos encaixamos em alguma filosofia dos grupos disponíveis.


    A criação de conteúdo é bem pessoal, pois podemos falar sobre qualquer assunto
    que achamos importante ou que seja relevante para mercado, como a tecnologia mais
    atual ou sobre nossas linguagens de programação.


    Em 2018, temos muita gente falando sobre JavaScript, pois é uma linguagem em ascensão,
    assim como feito com Java, PHP e logo temos outra linguagem na crista da onda,
    mas também muita gente que fala sobre algo que o mercado precisa e que pode até
    sendo esquecido, como soft skills, que são as habilidades diferentes das habilidades
    técnicas, como comunicação, empatia etc.


    Mas como uma pessoa iniciante pode contribuir com conteúdo?


    Como iniciantes ou não, compartilhar sobre o que estamos aprendendo pode ser uma
    excelente maneira de reforçarmos o nosso conhecimento, pois vai demandar mais
    pesquisa e mais esforço para criarmos bons exemplos sobre algo que vamos falar.


    Além disso, podemos receber feedbacks sobre o que estamos transmitindo para melhorar
    ainda mais nosso entendimento sobre qualquer assunto.


    A grande parte do mercado é formada de pessoas em início de carreira, conforme
    podemos confirmar na pesquisa de Stack Overflow, um site de perguntas e respostas
    sobre desenvolvimento de software, de 2018, em que constatamos que 30.1% das pessoas
    trabalham com programação entre 0 e 2 anos e 27.4% entre 3 e 5 anos (http://bit.ly/stackoverflow-survey-2018).


    ### Years Coding Professionally


    | Years | Percentage |

    | :--- | :--- |

    | 0-2 years | 30.1% |

    | 3-5 years | 27.4% |

