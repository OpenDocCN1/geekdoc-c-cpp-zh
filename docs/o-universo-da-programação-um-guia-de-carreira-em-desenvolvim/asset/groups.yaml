    # 5.2 Nós devemos utilizar Linux para alcançar a maestria


    Existe uma premissa em algumas comunidades de programação, que diz: Windows não
    presta para pessoas programadoras. E, dependendo da tecnologia que escolhemos
    para trabalhar, vamos receber essa resposta em algum momento de vida profissional.
    Será mesmo que o sistema operacional de computadores pessoais mais utilizado no
    mundo não serve para trabalhar com programação?


    Já vou logo adiando que eu vou defender o Windows aqui, mas não vou defender 100%.
    Se eu falar para alguém "Pode continuar sempre utilizando Windows", estaria sendo
    hipócrita, uma vez que larguei o sistema operacional muito tempo antes, antes
    de aprender programar e nunca mais voltar.


    Mas eu não deixei o Windows porque ele travava ou porque ele tinha um monte de
    vírus: isso nunca foi um problema para mim vez que eu estudei como melhor utilizá-lo,
    fazia configurações de desempenho e possuía políticas de segurança bem definidas.
    deixei o S.O. (sistema operacional) porque optei por utilizar outro de código-fonte
    aberto e que segue a filosofia do software livre, que é'
  - '[PAGE 103]


    algo que me inspira desde quando conheci computação e vou comentar mais à frente
    no livro, o Kurumin Linux.


    O Kurumin era uma distribuição de Linux com o objetivo de ser fácil de usar, pois
    naquela época as distribuições Linux não eram tão fáceis quanto hoje. Uma pena
    é que ele foi descontinuado pouco tempo depois de eu o conhecer, em 2009.


    O verdadeiro problema do Windows, para mim, é que dependendo da tecnologia que
    vamos trabalhar, realmente não é a **melhor ferramenta**, pois as configurações
    da linguagem podem ser complicadas no S.O. e isso pode virar uma pedra no nosso
    sapato. Repare que eu comento que ele pode não ser a melhor ferramenta, não que
    ele **não deve** ser usado ou que **não presta** para trabalhar.


    A linguagem Ruby, de Node.js e a linguagem Golang, por exemplo não possuem melhor
    ecossistema para trabalhar no Windows devido às peculiaridades do sistema.


    Isso acontece porque o Windows tem peculiaridades como o trabalho mais complicado
    de configurar variáveis (configurações que fazemos no S.O. para utilizar em nossas
    linguagens) ou o padrão de acesso a pastas (em sistemas Unix, como o Linux ou
    OS X o padrão de acesso a diretórios é com a barra / e em Windows com a barra
    invertida \ ), comandos diferentes na linha de comando (como o comando de listagem
    de pastas que é `ls` em todos os sistemas e `dir` no Windows).


    Toda essa diferença do Windows para Linux ou OS X existe porque, como qualquer
    outro S.O., o sistema foi pensado para uma finalidade e a finalidade dele é funcionar
    bem para o **usuário final** e para **pessoas que usam tecnologias Microsoft**,
    como o C# e SQL Server.


    Em sistemas Linux nós não teremos algumas de cabeça que o sistema Microsoft não
    traz de vez em quando, com alguns comandos já tenho tudo instalado, configurado
    e pronto para trabalharmos. Já no Windows são vários cliques e reiniciar diversas'
- md: '

    vezes até tudo esteja OK. Mas isso não é um problema para todo mundo, somente
    para quem quer algo mais produtivo.


    A própria comunidade ao redor das tecnologias produz alternativas e faz com que
    as coisas que usamos em Linux passem a funcionar no Windows com menos dores de
    cabeça. Temos artigos na internet que podemos ajudar a configurar as ferramentas
    e não passarmos por nenhuma dor de cabeça com o uso desse S.O.


    Hoje em dia a história tem mudado, uma vez que o Windows 10 possui até mesmo um
    modo de utilização de subsistemas Linux dentro dele, um modo de rodar o Linux
    ao mesmo tempo que usamos os Windows. Podemos utilizar o melhor da compatibilidade
    com hardware do Windows, que não é a melhor em sistemas Linux, com o melhor do
    mundo de desenvolvimento dos sistemas Unix.


    Temos também outro ponto: para uma pessoa iniciante em programação, tanto faz
    o sistema operacional utilizado. Sua maior dor de cabeça será entender lógica
    de programação e aprender a programar, não o quão rápido o sistema operacional
    inicia.


    Devemos usar o que deixa confortáveis e que não nos atrapalha em nada. Se for
    Windows, que continuemos com Windows até o dia em que o o sistema começar a nos
    atrapalhar, se isso acontecer. Se por Linux, devemos seguir a mesma filosofia
    e continuar utilizando até quando não fizer mais sentido. O importante mesmo será
    aproveitarmos do sistema operacional que mais nos traz produtividade no dia a
    dia.


    ## 5.3 Faculdade na área de TI, fazer ou não fazer?


    O processo padrão de algumas profissões é fazermos o ensino fundamental, ensino
    médio, talvez um curso técnico, então uma faculdade e podemos, finalmente, conseguir
    um emprego na área.


    Em desenvolvimento de software podemos esquecer de padrões.

    Porém, mais uma vez, nosso contexto importa muito.


    Uma grande parte das pessoas desenvolvedoras de software que eu conheço não possuem
    formação padrão (uma graduação) e são adeptas de dizer para todo mundo que não
    devemos fazer faculdade para trabalhar com programação.


    Eu concordo. Não precisamos obrigatoriamente de faculdade para trabalhar com programação,
    mas, dependendo de onde moramos, as vagas de emprego podem nos cobrar essa formação
    padrão.


    Mais uma vez, assim como acontece com as linguagens de programação, devemos utilizar
    a inteligência de mercado e pesquisas para entender se devemos ou não fazer uma
    graduação. Em cidades como São Paulo e Rio de Janeiro, em contato com amigos da
    área, percebi que não é cobrado graduação na maioria das empresas, mas não acontece
    no nordeste do país, por exemplo.


    A grande maioria das empresas não vai nos cobrar a formação, porém vão nos pedir
    um portfólio, uma participação ativa em comunidades de desenvolvimento de software
    ou algum outro diferencial de mercado.


    A faculdade pode ser o meio mais fácil de entrar no mercado de trabalho, afinal
    conseguir um estágio é mais fácil do que conseguir o primeiro emprego como júnior
    em uma empresa devido à procura que elas têm por esses profissionais.


    Existe outro ponto importante quando falamos faculdade, que é a possibilidade
    financeira de se fazer um curso superior. Quem não possui recursos financeiros
    para fazer um curso não deveria ficar de fora da nossa área e, graças a internet,
    essas pessoas não vão ficar sem oportunidade, assim como eu não fiquei.


    Todo conhecimento que precisamos para trabalhar com programação está na internet,
    está em livros como este, em artigos, em vídeos no YouTube. Não precisamos gastar
    muito dinheiro para começar e, se necessário, não precisamos gastar nada além
    do nosso tempo.


