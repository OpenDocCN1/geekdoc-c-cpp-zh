    - Para todas as profissões podemos olhar os projetos no GitHub (https://github.com/),
    um site de hospedagem de projetos open source e também uma "rede social" para
    pessoas desenvolvedoras de software.

    - Para pessoas da área de **dados**, temos também o (https://www.kaggle.com/),
