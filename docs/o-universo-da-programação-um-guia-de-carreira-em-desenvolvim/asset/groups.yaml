    ## 1.3 O que é um programa de computador


    Sabendo que programar é escrever instruções e estas instruções podem ser escritas
    em linguagens de programação, então o que realmente é um programa?


    Ao nosso redor temos temos programas funcionando o tempo todo e às vezes não percebemos.
    Um programa de computador nada mais é que a junção das instruções que nós escrevemos
    (a programação propri dita) em uma linguagem de programação que pode ser compilada
    ou executada em computadores, smartphones, placas eletrônicas. Ao código escrito
    por quem desenvolve o software damos o nome de código-fonte.


    Compilação, que citei anteriormente, é o processo de pegar um código-fonte escrito
    em uma linguagem de programação que, normalmente, se aproxima bastante da linguagem
    humana (se isso, faça aquilo; em isso, faça aquele) e transformar em linguagem
    de máquina que o computador vai entender e fazer o que mandamos (01010011 01011111
    01100110 01110100 01110111 01100001 01110100 01100101).


    Isso significa que: algumas linguagens podem ser escritas e executadas da maneira
    como estão e outras precisam passar por um processo que se transforma em outra
    coisa de rodar no computador. Este processo de transformação é feito por um programa
    chamado compilador e o processo de leitura do código é feito pelo interpretador
    da linguagem da programação.


    Se a linguagem é interpretada, ou seja, executada como escrita, então o interpretador
    precisará ser instalado onde o programa funcionará, seja em um sistema operacional,
    em um smartphone, uma geladeira etc.


    Se for uma linguagem compilada, quando nós escrevemos o programa em uma linguagem,
    esse programa passa por outro software (o compilador) que o transforma em código
    de máquina e então podemos executar no computador. O compilador só precisa estar
    instalado onde for acontecer o processo de compilação; normalmente em um servidor,
    que é responsável por isso, e somente o código gerado é enviado para o ambiente
    de execução ou plataforma (nosso computador ou um servidor, por exemplo).


    Você já deve ter rodado um programa .exe no Windows. Este foi um software que
    foi compilado para a plataforma Windows.


    Para esclarecer a visão, vamos dar uma olhada neste exemplo de código-fonte escrito
    em uma linguagem de programação de alto nível, o JavaScript:


    ```

    alert(''Hello, world!'');

    ```


    Para executar o código, bastaria utilizar nosso navegador, pois ele possui um
    interpretador de JavaScript embutido.


    Para tal, bastaria abrirmos as ferramentas de desenvolvedor do navegador, que,
    na maioria dos casos, são acessadas clicando em menu, mais ferramentas e em seguida
    em ferramentas de desenvolvedor.


    ![](img/1980cd0900b9cb84feb62a3cc0d390f3_19_0.png)


    Figura 1.4: Acessando as ferramentas de desenvolvedor


    Então colar o código na aba console da caixa de ferramentas que apareceu e o navegador
    iria exibir uma mensagem de "Hello, world".


    ![](img/1980cd0900b9cb84feb62a3cc0d390f3_19_1.png)


    Figura 1.5: Enviando nosso hello world


    O nosso ambiente de execução (o navegador) vai se encarregar de transformar as
    instruções em código de máquina e executar em tempo real.


    O comando da linguagem JavaScript alert fará um pop-up pular na tela com a mensagem
    que colocamos entre aspas. O legal é percebermos que linguagens de alto nível
    são escritas quase de modo natural para nós. Se traduzirmos “alert” do inglês
    teremos a palavra “alerta” e é justamente o que acontece no navegador, ele envia
    um alerta para nosso usuário (o pop-up).


    Outro exemplo de linguagem de programação de alto nível é a Lua, que é muito utilizada
    por jogadores de game de MMORPG (jogos RPG de múltiplos jogadores online) Tibia
    para configurar programas que automatizam tarefas chatas e roubar no game, os
    bots. Sua sintaxe (disposição das palavras na frase e das frases) é muito inteligível
    mesmo sem termos muito conhecimento em programação.


    ```

    if itemcount("mana potion") < 20 then

    gotolabel("refiller")

    end

    ```


    Se traduzirmos do inglês, temos algo como:


    Se a contagem de itens de “mana potion” for menor do que 20, então vai o identificador
    “refiller”


    Sendo que itemcount, “mana potion” e “refiller” são palavras inventadas pelas
    pessoas que programaram este bot, não específicas da linguagem, e executam algo
    específico que o programador ou programadora especificou. Perceba que as instruções
    não passam de conexões lógicas entre as palavras “se” (if), sinal matemático de
    menor (<), “então” (then), “vá para o identificador” (gotolabel), “fim” (end).
    É compreensível para um humano com conhecimento de inglês,


    Agora um exemplo em uma linguagem que se aproxima da linguagem de máquina, uma
    linguagem de baixo nível, o Assembly:


    ```

    section .text

    global _start:


    mov edx,len

    mov ecx,msg

    mov eax,4

    int 80


    section .data

    msg db ''Hello, world!'',0

    len equ $ - msg

    ```


    Exemplo de Introdução to assembly programming (http://bit.ly/asm-hello-world).


    Ambos os exemplos de JavaScript e Assembly são um programa de computador que exibe
    uma mensagem na tela, percebemos que a diferença de escrita/leitura entre alto
    e baixo nível são nitidas. Ainda mais quando lemos o programa escrito em Lua.


    Até aqui você aprenderá que um programa nada mais é que instruções escritas em
    uma linguagem de programação em um arquivo (código-fonte) e que existem linguagens
    que “se aproximam do metal”, que são de baixo nível, e linguagens que se aproximam
    de nossa maneira de comunicarmos, as de alto nível.


    Neste momento você deve estar pensando “então como onde eu escrevo um código-fonte?”,
    “preciso de um supercomputador para programar?”, “o que mais preciso antes antes
    escrever código pela primeira vez”.


    O objetivo deste capítulo até aqui é este mesmo: gerar questionamentos. Vamos
