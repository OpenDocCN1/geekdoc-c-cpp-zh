    ## 4.8 Área de Big Data


    No mundo moderno possuímos um novo termo na nossa galáxia de letrinhas, o Big
    Data. Isso é: uma grande quantidade de dados gerados todos os dias por dispositivos
    de todos os tipos como mobile, carros, geladeiras, televisores, computadores.
    Tudo que está conectado na internet pode estar gerando dados e alimentando uma
    base de dados que será utilizada depois para gerar informação útil.


    Para que isso seja possível, é necessário ter uma plataforma e aplicações para
    coleta de dados muito bem planejadas e essa massa de dados precisa ser tratada
    e disponibilizada de modo que possa ser utilizada como informação pelas pessoas
    da área de negócios das empresas ou mesmo para nós, usuários finais. Os responsáveis
    por essa área são os profissionais de dados, como cientistas e engenheiros(as)
    de dados.


    Entre essas duas profissões temos alguns pontos em comum, assim como os pontos
    que qualquer pessoa que trabalha com programação possui, são que:


    - **Linguagens de programação:** como toda profissão envolvida com programação,
    será necessário dominar uma ou mais linguagens de programação, sendo a mais utilizada
    atualmente a linguagem Python, mas também pode ser necessário conhecer Java, Julia
    e existe uma linguagem especial para tratamento de dados e estatística, que é
    a linguagem R.


    - **Matemática e estatística:** a matemática far parte do dia a dia e por isso
    é necessário profundo conhecimento na arte dos números, principalmente em estatística.


    - **Bancos de dados:** bancos e linguagem de consultas SQL e NoSQL também serão
