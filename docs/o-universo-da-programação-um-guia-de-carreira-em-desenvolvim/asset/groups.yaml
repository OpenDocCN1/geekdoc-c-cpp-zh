    | 12-14 years | 5.5% |

    | 15-17 years | 3.9% |

    | 18-20 years | 3.6% |

    | 21-23 years | 1.8% |

    | 24-26 years | 1.1% |

    | 27-29 years | 0.6% |

    | 30+ years | 1.7% |


