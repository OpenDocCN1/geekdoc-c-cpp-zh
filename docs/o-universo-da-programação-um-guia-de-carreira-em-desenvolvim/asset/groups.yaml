    Conseguir um emprego legal pode variar dependendo da nossa capacitação assim como
    do nosso momento de vida. Às vezes passamos por momentos de vida em que precisamos
    recorrer a uma oportunidade não muito boa para mantermos, afinal todos pagamos
    boletos, mas como extrair coisas boas de empregos ruins?


    Em toda oportunidade podemos aprender algo novo. Em toda empresa existem pessoas
    que podem nos ensinar alguma coisa, nem que seja sem querer. Às vezes aprendemos
    por osmose, só por estar perto de alguém que trabalha bem. Até por isso existe
    uma premissa que é constantemente disseminada nas palestras sobre: “não seja a
    melhor pessoa de uma equipe”. Quando somos iniciantes ou somos melhores em algo
    podemos aprender muito com as pessoas de qualquer empresa!


    Precisamos exercitar a nossa resiliência e buscar tirar algo de qualquer oportunidade
    que tivermos. Isso vai nos garantir grandes qualificações para nosso futuro profissional.


    Na área de programação, muitas vezes, achamos um emprego ruim porque não temos
    oportunidade de usar a última tecnologia de mercado ou porque não podemos “matar”
    um software antigo que é ruim de manutenção. Por que não encarar isso como desafios
    para melhorarmos profissionalmente?


    Já deixamos claro: nem sempre vamos trabalhar com a melhor tecnologia de mercado
    ou a mais atual que todo mundo diz a melhor nem com softwares muito bem escritos,
    onde temos prazer de alterar algo nele. A maioria das oportunidades de emprego
    são para trabalharmos com um software já existente e darmos manutenção nele e
    esse pode ter sido muito bem escrito ou não.'
- md: '

    O que podemos fazer é: propor soluções e trazer dados do real valor de se utilizar
    ferramentas novas, aprender a traçar planos de reescrita de softwares legados
    (os softwares antigos que continuam essenciais para um negócio) ou mesmo aprender
    a criar novos softwares que vão suprindo as necessidades com o tempo até que não
    precisemos mais do legado. Ou seja, quase sempre conseguimos extrair boa experiência
    de empregos ''ruins''.


    Claro, nem toda empresa vai nos ouvir ou no dar parecer suficiente de reescrever
    um software ou que mudemos as ferramentas internas, frameworks ou libs que utilizamos
    para trabalhar ou algo do tipo, mas sempre vale a pena tentar fazer isso antes
    de sair de um emprego.


    ## 8.6 Como conseguir experiência sem nunca trabalhado em uma empresa


    Como requisito das vagas de emprego sabemos que sempre vem a palavra experiência
    em tecnologia xyz, mas como conseguir experiência para o primeiro emprego se não
    conseguimos entrar em neste primeiro emprego sem experiência? Nós acabamos de
    cair no loop de inconsistência do time de recursos humanos.


    A resposta está em: projetos pessoais, projetos open source ou projetos gratuitos.


    Muita gente sente uma no coração quando falamos em trabalhar de graça, mas, sim,
    em determinadas circunstâncias podemos trabalhar de graça para conseguir tal experiência,
    ainda mais dependendo do produto a ser desenvolvido.


    A experiência de criar um software de gestão para uma microempresa local (do nosso
    bairro) é muito boa para o nosso currículo, mas muitas vezes essas empresas (normalmente
    mercinhos, vendas, cabeleireiros) não possuem a renda para pagar por um software
    ou mesmo não veem valor em instalar um software visto trabalhar com agendas e
    papel tem funcionado para eles durante anos.


    Então o modo de convencer esses(as) microempresários(as) a aceitarem nosso trabalho
    (primeiro trabalho, ainda por cima) é se propor a fazer algo gratuito. Se tivermos
    a sorte de local ter um bom faturamento até podemos cobrar um valor abaixo do
    mercado, afinal é nosso primeiro projeto.


    Neste caso, vale lembrar que nosso objetivo com esse trabalho não vai ganhar dinheiro,
    mas conseguir tal experiência que o mercado tanto pede para conquistarmos nosso
    primeiro emprego, onde, sim, vamos ganhar dinheiro e depois vamos crescer e ganhar
    mais ainda. Pensemos nisso em “ganhar dinheiro”, e de curto prazo é o lucro por
    esse trabalho gratuito para conseguirmos o primeiro emprego.


    Não somente fazer um projeto, para uma microempresa, mas podemos ir de comércio
    a comércio, bazar a bazar etc., depois de fazer nosso primeiro projeto, para tentar
    fazer mais softwares ainda e conseguir mais experiência. Com isso, estaremos montando
    nosso portfólio sem ter formalmente em uma empresa.


    Pensando em cada contexto:


    - Para a área de web, podemos criar sistemas web, sites institucionais.

    - Para a área de mobile, podemos criar o aplicativo para a empresa.

    - Para a área de dados, podemos criar projetos que melorem o faturamento da empresa.

    - Para a área de desktop, podemos criar os softwares PDV (aqueles de caixa de
    mercado).


    Para construção desses projetos podemos utilizar o que já sabemos ou mesmo arriscar
    algo novo para aprender. Se queremos entrar em área x, então pegamos um projeto
    em que vamosmos precisar dessas habilidades para desenvolver o produto.


    As comunidades de programação também podem nos ajudar nessa primeira experiência
    e ainda nos ajudar a formar a nossa rede de contatos, afinal trabalhamos em time
    e conhecemos muita gente através do suporte. Podemos pegar projetos na internet,
    no GitHub, GitLab ou BitBucket e começar a ajudar eles, resolvendo os problemas
    que estiverem relatados contribuindo com um projeto já existente ou criando um
    do zero para a comunidade.


    Nos projetos abertos (open source) entramos no mesmo contexto: procurar e encaixar
    na nossa capacidade ou então arriscar algo novo. Existem muitas comunidades com
    projetos legais que poderiam se tornar aplicativos ou mesmo que não têm nenhum
    dado para se direcionar e ser um bom caso para análise de dados, assim como a
    necessidade de apoio em seus sites.


    Assim como open source, temos diversas ONGs precisando de ajuda na internet. Quando
    estamos nos sites de ajuda ONGs sentimos até uma tristeza de quem depende daquele
    site para ajuda alguma coisa, encontramos sites com uma experiência de navegação
    ou visual muito ruins, sites muito pesados, aplicativos lentos ou mesmo entidades
    sem nada disso e que se beneficiariam bastante nos ajudarmos. Nesse caso, além
    de ganhar experiência e ter um grande projeto para mostrar em uma entrevista/em
    nosso currículo, ainda ajudamos uma instituição que dá um retorno para a sociedade.


    Alguns sites onde podemos encontrar ONGs para entrarmos em contato:


    - ongsbrasil (http://ongsbrasil.com.br/)

    - voluntariado (http://voluntariado.org.br/LP/)

    - e-solidario (https://e-solidario.com.br/)


    E a última, mas não menos importante, maneira de conseguir a experiência sem ter
    um emprego formal é criar projetos pessoais. Nós temos muitas ideias de criação
    de softwares quando começamos a entender eles funcionam e como são criados. Podemos
    usar essas ideias para praticar desenvolvimento.


    Para quem faz controle financeiro, recorrentemente passamos tempos e tempos adaptar
    uma planilha a nossa necessidade de preenchimento e isso pode acontecer porque
    a planilha já não é mais o que precisamos, queremos algo mais personalizado para
    o nosso estilo de uso. Esse seria um bom caso para aplicarmos nosso conhecimento:
    quando algum software já não atende mais.


    Quando os softwares não nos atendem é um excelente caso para praticar, podemos
    indicar o nosso desenvolvimento partindo do ponto que já existente, ou seja, das
    telas, do fluxo lógico, de toda a parte que funciona bem para o nosso caso no
    software.


    Desses modos de praticar, somente fazer um projeto, para uma microempresa, mas
    podemos ir de comércio a comércio, bazar a bazar etc., depois de fazer nosso primeiro
    projeto, para tentar fazer mais softwares ainda e conseguir mais experiência.
    Com isso, estaremos montando nosso portfólio sem ter formalmente em uma empresa.


