    # **Performance Web:** a performance (ou desempenho) de uma aplicação Web é a
    velocidade com uma página carrega, a quantidade de dados que essa página baixa
    para a máquina do usuário, dentre outras preocupações. Performance é uma responsabilidade
    imensa da pessoa de front-end, pois o client-side é responsável por 80 a 90% da
    velocidade de carregamento de um site e ninguém quer permanecer em um site que
    fica travando ou demora muito para carregar, muito menos um site que consome toda
    a banda que contratamos com nossa operadora de celular.


    **Semântica:** a linguagem HTML possui elementos específicos para cada item que
    está aparecendo na tela. Se é um botão, existe o elemento correto para isso, se
    é um parágrafo, também. Semântica, em front-end, é o uso correto da linguagem
    HTML de marcação do conteúdo. Isso é muito importante, pois com técnicas de SEO,
    melhora o conteúdo para os buscadores localizarem nosso site e também ajuda na
    acessibilidade, para os leitores de tela, softwares que leem a tela para usuários
    com deficiência visual, encontram e entendem mais facilmente o conteúdo e componentes
    na aplicação.


    SEO: o marketing foi algo importante para qualquer empresa. SEO, hoje, faz parte
    do marketing da maioria dos produtos digitais, pois o nosso site precisa aparecer
    nas primeiras páginas do buscador se a empresa não tem vendas, ou se não tem acessos,
    o conteúdo não é encontrado. SEO (Search Engine Optimization) é otimizar o nosso
    site para os search engines que encontrem mais facilmente baseado em otimizações
    que esses mesmos sites nos orientam a fazer em nossas páginas.


    **Acessibilidade:** é tornar a interface usável para pessoas com deficiência visual,
    motora, cognitiva ou outro tipo. A internet é algo que deve ser de livre acesso
    a todas as pessoas, inclusive pessoas com alguma deficiência. É nossa responsabilidade
    criar interfaces e sites que essas pessoas consigam utilizar.'
