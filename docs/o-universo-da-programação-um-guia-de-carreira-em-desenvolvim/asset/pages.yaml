- img_proc: true
  md: 'questão correta em mãos. Então, como fazer boas perguntas sobre programação?


    Alguém que quer ter em mente é: a outra pessoa não sabe de que estamos passando
    só porque ela é mais experiente ou porque está está se dispondo a ajudar, nós
    precisamos contextualizar a pessoa e dizer exatamente o que estamos enfrentando.


    A contextualização virá a partir do momento em que conseguirmos responder essas
    perguntas:


    +   - O que eu estava fazendo? (ou o que eu já tentei fazer resolver)

    - O que eu esperava que acontecesse?

    - O que aconteceu?


    Vale lembrar que, se for uma pesquisa na internet, basta procurarmos por "o que
    aconteceu" e recebermosmos um resultado melhor sobre o nosso problema, porém,
    nos fóruns ou para nossos companheiros e companiras de trabalho, devemos utilizar
    os recursos disponíveis, como mostrar uma imagem do erro que apareceu na nossa
    tela e compartilhar a parte de código que não está funcionando como desejamos.


    Alguns recursos úteis para compartilhamento nos fóruns é o uso do imgur (https://imgur.com),
    para compartilhamento de imagens, e do Gist (https://gist.github.com) para compartilhar
    trechos do nosso código-fonte.


    Essa dica é muito boa para quando estivermos recebendo um erro, e quando desejamos
    criar um log e não sabemos nem como começar?


    Basta pensarmos nas seguintes questões e para formular a melhor pergunta:


    +   - O que eu quero fazer?

    - O que eu sei fazer?'
  merge: -1
