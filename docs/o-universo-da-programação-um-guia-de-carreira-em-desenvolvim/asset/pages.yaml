    # Engenharia de dados


    A pessoa que trabalha na área de engenharia de dados é responsável por provisionar
    a infraestrutura necessária para o trabalho do(a) cientista de dados. É quem planeja
    os dados armazenados, escala os sistemas (faz o sistema suportar maiores quantidades
    de dados/tráfego/acesso).


    Como a pessoa de engenharia de dados é mais focada em sistemas, a grande diferença
    em conhecimento é provisionar aplicações, conhecer mais sobre infraestrutura e
    programação de aplicações no geral. Seu maior foco é em Big Data, machine learning,
    bancos de dados e programação, não tanto em matemática e estatística (parte analítica).


    Os conhecimentos de uma pessoa engenheira de dados são parecidos com a de ciência
    de dados, com a diferença de que uma trabalha mais com sistemas, o(a) engenheiro(a),
    e a outra trabalha mais com estatística e visualização dos dados, o(a) cientista.


