- img_proc: true
  md: 'acordado com nosso cliente (ou futuro cliente). O contrato é a nossa única
    garantia legal de que ambas as partes vão agir de boa fé e se não agirem teremos
    resguarda da lei para conseguirmos receber nossos honorários pelo trabalho prestado.


    Mesmo com um contrato em mãos, as pessoas que fazem muito costumam praticar um
    esquema de pagamento onde recebem apenas uma parte do valor em de calote, que
    é dividir o pagamento em duas ou mais partes. Uma parte do valor nós recebemos
    no começo do desenvolvimento e a outra parte quando entregamos o produto ou quebrado
    em várias partes e recebemos por entrega.


    Eu indico dividir em partes e trabalhar com pequenas entregas mensuráveis. Ou
    seja, entregar o produto em partes que nosso cliente pode sair usando e para cada
    parte dessa paga uma parcela do produto final. Isso é bom para ambas as partes,
    pois o usuário já começa a usufruir dos recursos que inventamos para lhe ajudar
    e nós já recebemos algum valor pelo trabalho que estamos desempenhando.


    Outro problema recorrente no mundo do freelancer é o caso do cliente que participa
    de uma reunião conosco, fazemos todo o levantamento de requisitos, planejamos
    todo o projeto e até dizemos como vamos fazer e esse cliente, depois dessa reunião,
    nunca aparece e, quando menos esperamos, o projeto que nós planejamos no ar.


    Isso acontece porque, a pessoa pega tudo o que planejamos, leva para um amigo
    ou amiga (ou o famoso sobrinho) que está aprendendo a programar e passa o nosso
    trabalho para essa pessoa fazer de graça.


    Uma cilada dessas só é evitada cobrando um valor pelo início do trabalho. Ou seja:
    fechando contrato desde o começo. Claro que, nem todo cliente quer pagar antes
    de ter algo concreto concreto e por isso temos que usar nossos argumentos para
    que a pessoa confie em'
  merge: -1
  pgno: 173
- img_proc: true
  md: 'nosso trabalho, assim como entenda nosso lado. Devemos demonstrar que somos
    profissionais e que desde a hora em que o contrato está assinado estamos nos comprometendo
    com o prazo e que esse contrato, assim como a entrada, nada mais é do que uma
    segurança para ambas as partes.


    Em todo caso, não podemos deixar de fazer um contrato, de preferência com reconhecimento
    de firma no cartório e com tudo bem definido antes de começar a desenvolver.


    Algo extremamente comum é utilizarmos serviços de freelancers para conseguir clientes.
    Eu, pessoalmente, detesto esses serviços, pois são um verdadeiro leilão da nossa
    força de trabalho. Damos nós de valor X, que é o valor da nossa hora de trabalho,
    outra pessoa joga o valor X - 1, outra lança X - 2 e assim por diante, até que
    o cliente fecha com quem cobra o menor valor, não se importando com a qualidade
    do nosso trabalho.


    Se o cliente quer pagar 2, 3 vezes do que nós cobramos, é um bom sinal de que
    esse cliente não nos dá uma dor de cabeça no futuro. Minhas experiências com clientes
    assim foram de pessoas que pagam muito baixo e cobram por um serviço 5 estrelas,
    com a entrega o mais rápido possível, não importando que outro cliente pagou mais
    pela exclusividade e entrega mais rápida.


    Existem serviços que vem com uma proposta diferente desses sites de leilão freelancer,
    que a plataforma indica para o cliente melhor profissional baseado em suas necessidades,
    como a Crowd (https://crowd.br.com/) e a Toptal (https://toptal.com/).


    # Cuidados fiscais


    Como prestadores de serviços, quando freelancer ou quando trabalhando diretamente
    para uma empresa como cliente fixo (conhecido como pessoa jurídica, PJ), temos
    que emitir notas fiscais sobre o que fazemos e o que recebemos. Para emitir as'
  merge: -1
  pgno: 174
- img_proc: true
  md: 'notas precisamos ter empresa aberta e conhecer as regras para emissão da nossa
    localidade.


    Abrir uma empresa não será difícil, o trabalho maior é procurar orientação na
    prefeitura local para saber sobre os encargos da nota que vamos gerar. Podemos
    conseguir as orientações corretas para a nossa cidade procurando pela Secretaria
    de Finanças na prefeitura ou no site da prefeitura local.


    Como empreendedores individuais, podemos abrir o famoso MEI (Microempreendedor
    Individual), que, em nosso país, podemos fazer direto pelo site do governo, o
    Portal do Empreendedor (http://www.portaldoempreendedor.gov.br/).


    Eu também utilize os serviços de um contador quando preste serviços, para evitar
    qualquer problema fiscal que eu poderia cair por falta de conhecimento, por isso
    recorri aos serviços da Contabilizei (https://contabilizei.com.br/). Mas existem
    mais contabilidades online ou físicas que podem facilitar a nossa vida. Um um
    investimento mínimo para não correr risco de errar e acabar tendo que pagar alguma
    multa por isso.


    # 8.12 Conclusão


    Devemos criar uma boa imagem online, pensar bem no nosso currículo, que é a nossa
    vitrine de marketing pessoal, criar currículos com foco no que as pessoas de recrutamento
    realmente querem saber de nós e acreditar que nós podemos e vamos conseguir nosso
    emprego na área que gostamos.


    O processo até conseguir o primeiro emprego na área pode não ser nada fácil ou
    animador, pois podemos/vamos receber vários não, mas isso é extremamente normal,
    acontece com todo mundo e em cada processo podemos aprender mais e nos prepararmos
    para o próximo.'
