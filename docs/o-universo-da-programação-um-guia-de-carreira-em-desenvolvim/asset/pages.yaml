    que precisa ser compilado para só depois ser enviado para uma loja de aplicativos
    para que o usuário possa baixar.


    Não é tão simples subir um aplicativo para uma loja ou central de programas. As
    centrais de programas possuem suas regulamentações que a pessoa que desenvolveu
    o software precisa seguir. Tanto para o usuário de uma plataforma (Android, iOS)
    possa ter uma boa experiência de quanto para analisar a segurança do app.


    Quando lançado o jogo Pokémon Go, em 2016, pessoas não conseguiram segurar a ansiedade
    (como eu) de esperar o lançamento em todos os países e baixaram arquivos .apk,
    que é o executável para sistemas Android, diretamente de websites não confiáveis.
    Isso expõe o usuário a um risco de segurança muito grande, pois não houve verificação
    de permissões do app, análise profunda do mesmo ou coisas do tipo central de apps.


    Contudo, algumas empresas utilizam a estratégia de enviar diretamente os .apk
    para seus usuários a modo de fazer atualizações mais rápidas, sem passar pelo
    período de espera de uma central de apps. O que não é muito legal, mas acontece.


    # 1.6 Conclusão


    Entendemos, até aqui, que existem diversas maneiras de enviar softwares para o
    nosso usuário final. Alguns softwares precisam ser compilados e enviados direto
    para o computador do usuário e outros rodam em servidores na internet trocando
    mensagens através de protocolos de rede com nossos navegadores.'
