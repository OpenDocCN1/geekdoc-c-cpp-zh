  md: 'e testar o máximo de técnicas e horários de estudos possíveis para conseguirmos
    algo que seja eficaz em nosso contexto.


    Algumas técnicas conhecidas que podemos pesquisar e testar são:


    +   1. Mapa mental;

    2. Fichamento ou resumo;

    3. Gravação de áudios;

    4. Resolver o máximo de exercícios possíveis;

