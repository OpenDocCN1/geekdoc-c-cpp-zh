  md: 'sobre um tema do que somente ver que existe e deixar passar a fim de ver/receber
    mais informações em menos tempo.


    Uma maneira de estudar ativamente é formular questões enquanto estudamos. Consumir
    o conteúdo e formular perguntas sobre isso fará com que nosso cérebro trabalhe
    em dobro em vez de estamos aprendendo.


    Colocar em prática o que aprendemos também é extremamente importante, principalmente
