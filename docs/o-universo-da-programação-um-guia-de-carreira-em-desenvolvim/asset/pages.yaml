    Para cultivarmos o hábito de utilizar o pomodoro, podemos começar de modo mais
    deslexado, fazendo pomodoros não tão focados ou então pausas mais longas.


    # 3. Aprendizado ativo


    Existem duas maneiras de aprender: a maneira passiva e a maneira ativa.


    O aprendizado passivo é aquele em que nós somente deixamos o conteúdo passar pela
    nossa mente e ir embora, como a leitura de um livro, assistir a uma aula ou um
    curso de maneira corrida, sem nenhuma hora para pensar sobre o que vimos. Somente
    consumir um conteúdo, sem colocar nosso cérebro para trabalhar faz com que, em
    poucos dias, esquecemos tudo o que foi lido.


    Quando lemos uma fábula é comum que alguns detalhes, aqueles momentos que fizeram
    nossa mente viajar ficam marcados em nossas mentes e são eles que retornam quando
    lembramos da leitura ou quando vamos indicar o livro para alguém.


    Já o aprendizado ativo é aquele onde anotamos, fazemos resumos, grifamos pedaços
    dos livros, fazemos exercícios práticos e também compartilhamos o que aprendemos.
    É um modo de pensar mais'
  merge: -1
