  md: '# 6.4 Gerenciando melhor o tempo de estudo e trabalho


    Algo nos aflige diariamentemente é a vontade/necessidade de estudar algo e não
    ter tempo graças à rotina de trabalho, que ocupa mais da metade do nosso tempo
    de vida. Isso atinge a grande maioria das pessoas, ainda precisamos trabalhar
    para nos mander. Felizmente nós podemos encontrar um equilíbrio entre trabalho
    e estudos se tivermos um bom planejamento da nossa rotina.


    Rotina, aqui, é a palavra-chave. Muita gente vê a palavra rotina associa a algo
    chato, ruim, monótono, porém não é isso. A rotina nos ajuda a conquistar a produtividade.
    Se tivermos tudo bem planejado e seguirmos esse plano, conseguiremos equilibrar
    nossa vida a fim de conseguirmos executar tarefas do que viver sem planejamento.
    No final, vai parecer até que temos mais tempo do que as outras pessoas, mas na
    realidade só estamos usando melhor nosso tempo.


    É extremamente importante queçamos o que nos atrapalha quando pensamos em ter
    mais tempo para estudar. Será que não temos tempo útil porque o trabalho está
    ocupando todo o nosso dia ou que passamos mais tempo nas redes sociais de fazendo
    o que realmente importa para nossa vida?


    Uma maneira de acompanhar isso é fazendo listas de tarefas e, sempre que uma tarefa
    não foi cumprida na hora certa, anotar ou o porquê da falha no planejamento. Uma
    reflexão no final da noite vai nos ajudar. Lembrar o que fizemos durante o dia
    e o que tirou a nossa produtividade nos ajudará a encontrar o que realmente suga
    nosso tempo e a nos conhecermos melhor.


    Existem aplicativos que podem nos ajudar a acompanhar nosso dia a dia e descobrir
    exatamente onde gastamos nosso tempo. Eu recomendo o QualityTime e SmarterTime,
    porém podemos'
