  md: '# CAPÍTULO 1

    Uma introdução ao vasto universo da programação


    Desenvolvimento de software não é mais somente uma área de trabalho, mas um verdadeiro
    universo. São tantas opções de áreas de atuação, tantas tecnologias distintas
    e plataformas para se trabalhar, que é muito fácil se perder em meio a uma chuva
    de informação. E o mais legal é que é um universo em constante expansão, algo
    está sempre mudando e de maneira tão rápida que parece que não conseguiremos nunca
    entender tudo o que ouvimos falar sobre esta área. Isso garante que há sempre
    algo novo para aprendermos.


    Este capítulo é uma introdução à área de desenvolvimento de software no geral.
    Podemos aqui nem mesmo saber sobre natureza programação de computadores, pois
    vamos aprender neste o que é cada coisa. Vamos descobrir o que realmente é um
    software, como eles são desenvolvidos e como são distribuídos para nossos computadores
    e dispositivos portáteis.


    Nos próximos capítulos também aprofundaremos nos assuntos relacionados ao futuro
    da humanidade graças aos avanços na área de tecnologia. Vamos desmistificar a
    profissão programador(a), conhecer os diferentes caminhos para escolher nossa
    área de atuação como programador(a) e vamos adquirir habilidades e conhecimento
    para irmos mais longe em nossa carreira.


    # 1.1 Tudo começou antes do computador


    Parte do nosso treinamento introdutório para conseguirmos viajar por este universo
    consiste em conhecermos o mínimo da história'
  merge: -1
