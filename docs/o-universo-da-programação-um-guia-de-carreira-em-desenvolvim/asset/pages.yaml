    Este livro, por exemplo, explica os conceitos que acreditamos serem desconhecidos
    para a maioria das pessoas, pois seu conteúdo deve ser universal. Ou seja, deve
    servir de orientador para uma pessoa iniciante ou uma pessoa com algum tempo de
    carreira.


    Alguns conteúdos na internet seguem essa mesma linha de pensamento e nos orientam
    bem quando iniciantes. Só precisamos procurar uma boa fonte de conhecimento e
