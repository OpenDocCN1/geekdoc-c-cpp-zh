    de programas externos a nossa equipe recebem o nome de dependência porque, uma
    vez que nós adicionamos aos nossos códigos, eles se tornam parte do resultado
    final e se os removermos, então o programa pode parar de funcionar.


    # Testes de software e testes automatizados


    Enquanto desenvolvemos nosso código precisamos testá-lo. Será que isso está funcionando
    conforme foi planejado? Se eu passar valor diferente para o meu programa (como
    colocar um nome no lugar de uma data) ele vai dar erro? Será que o programa aguenta
    uma quantidade elevada de usuários simultâneos?


    Basicamente escrevemos o código e colocamos para rodar em nosso ambiente local
    e vemos que tudo está OK. Por, só não é garantia para as questões que citei, é
    necessário conhecer algumas práticas que vão garantir a segurança do nosso código-fonte.
    São os testes de software, técnicas que utilizamos para garantir a segurança do
    código, e os testes de software automatizados, que são executados automaticamente
    por softwares especialistas em testar nosso código-fonte e todo o funcionamento
    de nosso programa, assegurando algumas partes que nós, como seres humanos, podemos
    acabar esquecendo de testar.


    # Manutenção de software


    Nós sempre precisamos modificar e continuar cuidando de um software existente.
    Para que façamos tudo correto, precisamos estudar sobre manutenção de software,
    que é o conhecimento de como monitorar o programa, como testar o código-fonte
    e como trocar partes do programa de maneira que ele não pare de funcionar, pois,
    na grande maioria das vezes, o programa está'
