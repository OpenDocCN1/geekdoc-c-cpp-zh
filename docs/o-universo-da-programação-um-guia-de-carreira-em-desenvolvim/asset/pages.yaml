    # 8.7 Qual o salário de programadores(as)


    Antes de aceitar um emprego, devemos analisar os prós e contras da empresa e da
    vaga. O salário está entre os prós, é claro. O trabalho assalariado é uma troca:
    produzimos e a empresa paga pela produção. É uma troca simples e deve ser justa.


    O salário de desenvolvedores(as) de software não é o mais alto que existe, porém
    longe de ser o mais baixo. É um bom salário e é bem alto do que a média salarial
    da população brasileira. Por menos em grandes centros e boas empresas conseguimos
    salários imagináveis por algumas pessoas - por mim mesmo comecei na área.


    Isso pode variar muito de região e muitas vezes até de cidade para cidade em um
    mesmo estado e por isso é importante uma pesquisa profunda antes de aceitar uma
    proposta salarial ou mesmo de dizer qual a nossa proposta.


    Para saber qual o salário que as empresas estão oferecendo devemos fazer uma grande
    pesquisa e obter o máximo de valores para entender realmente o cenário em que
    estamos atualmente.


    Podemos abrir uma discussão em um fórum, perguntar para amigos(as) que trabalham
    na área ou pesquisar em sites de vagas, que são especializados no assunto e sempre
    têm uma base de dados legal para comparação baseado na oferta das empresas ou
    na declaração dos próprios funcionários.


    Eu montei uma tabela com a média salarial baseada nos resultados da Love Mondays,
    em março de 2018. Para cada profissão que comente, eu fiz uma pesquisa pelos salários
    e agrupei os'
