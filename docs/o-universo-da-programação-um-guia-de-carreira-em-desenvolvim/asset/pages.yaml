    Para conquistar nossos clientes, devemos mostrar para eles o quanto nosso trabalho
    pode melhorar as suas vidas. Mostrar o quanto somos um sistema, um aplicativo
    etc. pode contribuir com o crescimento do seu negócio.


    Se temos uma ideia de aplicação que poderia melhorar como a empresa funciona,
