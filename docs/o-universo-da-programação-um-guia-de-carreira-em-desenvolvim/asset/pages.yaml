    # # 8.9 Como se preparar para testes práticos de programação


    O exercício para conseguirmos fazer testes de programação, muito sofrimento além
    da ansiedade da oportunidade de emprego, é criar projetos. É realmente programarmos.
    Quanto linhas de códigos escrevermos em nossa vida para projetos diferentes, estaremos
    preparados(as) para os testes práticos das empresas.


    Não adia decorar diversas páginas de um livro técnico, ler milhares de artigos
    todos os meses e não praticar nada daquilo, pois esquecemos tudo na hora do nervosismo
    do teste. A prática é a única aliada na preparação para as entrevistas técnicas.


    Existem sites especializados em praticar programação, como:


    +   - hackerrank (https://hackerrank.com/)

    - codewars (https://codewars.com/)

    - exercism (http://exercism.io/)

    - urionlinejudge (https://urionlinejudge.com.br/)


    Vale saltar que esses sites, além de servir para pessoas que já sabem programação
    e procuram melhorar suas habilidades e/ou se preparar para testes de empresas,
    também possuem guias para aprendermos programação do zero através da prática dos
    exercícios.


    Caso o inglês seja uma barreira, o urionlinejudge.com.br possui versão em português.'
