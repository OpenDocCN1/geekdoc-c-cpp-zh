  md: 'O objetivo deste capítulo até aqui é este mesmo: gerar questionamentos. Vamos
    partir para o próximo nível e entender como é desenvolvido um programa de computador.


    # 1.4 Como é desenvolvido um programa de computador


    Já sabemos o que é programação, o que é um programa e o que são linguagens de
    programação, mas, então, como escrevemos software?


    Existem diversas maneiras de escrever um programa de computador e isso vai variar
    conforme a linguagem de programação e ambiente de execução deste programa, mas
    tudo começa a partir de uma ideia ou problema que precisamos resolver e uma pessoa
    com habilidades em programação com um computador em mãos.


    Se a pessoa estiver escrevendo um código-fonte para rodar no navegador, como JavaScript,
    ela pode usar qualquer editor de texto comum e depois só colocar para rodar em
    uma página web, pois o navegador faz depois o resto do trabalho de compilar e
    interpretar a linguagem.


    E se a pessoa estiver desenvolvendo para smartphones com o sistema operacional
    Android e a linguagem Java ou Kotlin?


    Ai é um pouco diferente. Normalmente, a pessoa vai usar uma IDE, ferramentas de
    escrita de código muito poderosas e um pouco mais complicadas que simples editores
    de textos para escrever o código e compilar. Isso para tornar o trabalho mais
    produtivo, pois, como veremos, IDEs possuem muitos recursos para facilitar a vida
    de quem está desenvolvendo a utilizando.


    A escolha entre editor de texto e IDE é bom, mas em alguns casos (para algumas
    linguagens) é quase obrigatório o uso de uma'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'IDE para você tenha coisas legais de produtividade.


    # Editores de texto


    Editores de texto são programas simples, como o bloco de notas de Windows (sim,
    dá pra programar usando o bloco de notas) ou o Gedit, ferramenta equivalente ao
    bloco de notas para Linux. Mas, para facilitar a nossa vida codificando de maneira
    profissional, optamos por editores de texto com poderes extras, como destacar
    a linguagem de programação deixandoa colorido para facilitar a leitura do código,
    opção de autocompletar o que estamos escrevendo e mais algumas coisas legais que
    aumentam a nossa produtividade.


    Um exemplo de editor de textos desse tipo é o Atom, um editor gratuito e código
    aberto com diversos complementos que podem deixá-lo ainda mais potente (e pesado
    na memória do seu computador, como sua máquina não seja muito potente).


    ![](img/1980cd0900b9cb84feb62a3cc0d390f3_23_0.png)'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# IDEs


    Jás as IDEs são ambientes de desenvolvimento completos. Nestas ferramentas temos,
    além de conectar todos os benefícios dos editores de texto profissionais, opcao
    de conectar em bancos de dados direto de sua interface, geração de modelos gráficos
    que mostram como todo o nosso código está organizado, emuladores do ambiente de
    execução que mostram dentro da IDE como o programa vai se comportar, análise do
    código em tempo de desenvolvimento, reescrita de arquivos com um comando e mais
    utilitários ainda.


    Um exemplo de IDE é o Android Studio, que é utilizado no desenvolvimento de aplicativos
    para Android.


    ![](img/1980cd0900b9cb84feb62a3cc0d390f3_24_0.png)


    Figura 1.7: Imagem do Android Studio (extraida do site oficial)


    Observando as imagens do Android Studio, percebemos que o mesmo parece complicado
    por ter muitos botões na tela. Porém, isso é uma "meia verdade". O que as IDEs
    têm de'
  merge: -1
