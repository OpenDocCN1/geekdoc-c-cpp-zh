    Um exemplo bem simples pode ser a redução de custo em um minimercado devido à
    quantidade de produtos que vencem no estoque por causa da reposição em excesso,
    feito "no olho", aquela reposição em que alguém observa o estoque e chuta uma
    quantidade para comprar sem nenhuma estatística. Um sistema com controle de reposição
    de estoque somente quando realmente precisa, baseado em épocas de vendas, já ajudaria
    na redução de custo e ainda por cima auxilia ao não desperdício, criando uma empresa
