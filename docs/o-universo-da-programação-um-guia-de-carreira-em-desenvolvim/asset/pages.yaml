    isso!


    Palestrar pode ser um desafio imenso para algumas pessoas, pois apresentação em
    público não é algo que todo mundo gosta de fazer, porém pode ser extremamente
    recompensador pessoalmente, pois é onde estamos o retorno mais rápido do que fazemos.


    Enquanto palestrando, vemos no olhar das pessoas quanto estamos mudando suas vidas
    com o conteúdo que apresentamos. É muito rápido do que esperar um comentário em
    nossos artigos ou vídeos.


    A melhor maneira de aprender a palestra é seguindo um livro muito bom e conhecendo
    os vídeos do TED. O TED é uma conferência que nasceu para compartilhar ideias
    e ganhou o mundo com suas palestras incríveis. No livro TED Talks - O guia oficial
    do TED para falar em público aprendemos as melhores técnicas para palestrar. No
    canal do YouTube podemos conferir as melhores palestras do TED.


    Com isso e nossas ideias, teremos tudo o que é necessário para começarmos a palestrar.
