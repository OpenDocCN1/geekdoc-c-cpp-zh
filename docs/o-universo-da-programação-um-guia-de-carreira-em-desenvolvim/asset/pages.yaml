    # 6.3 Aprendendo tudo na velocidade da luz


    Ao iniciar nossos estudos algo vai nos afetar bastante a ansiedade. Nós queremos
    aprender tudo rapidamente e, pior ainda, tudo ao mesmo tempo. O maior desejo é
    aprender tudo num dia só e já sair criando o próximo programa rotina diária revolucionário
    que vai a história da humanidade. Mas calma. Não é assim que funciona.


    Cada pessoa possui um ritmo de aprendizado, um tempo específico disponível para
    os estudos, além de diversas responsabilidades pessoais de nossa rotina diária.
    O conteúdo que precisamos aprender para nós nos tornarmos bons/mais programadores(as)
    também não é pouco, não dá para absorvermos tudo de uma vez.


    Antes de começar a acelerar as coisas, é necessário preparar o terreno para os
    estudos. Se desejamos aprender algo rapidamente, precisamos ter em mente que não
    vamos aprender tudo de uma só vez, mas que podemos aproveitar muito o nosso tempo
    e aprender de maneira produtiva. É muito melhor estudar um pouco todo dia do que
    pegar um final de semana inteiro para estudar algo e na segunda-feira esquecido
    tudo.


    Existem algumas técnicas que nos ajudam a aprender mais rápido. Eu estudei diversos
    modelos, sigo algumas dicas e acabei aprendendo e adaptando algumas coisas enquanto
    ajudava pessoas a aprender algumas programação.


    A maneira que faço é: montar um ambiente de estudos, utilizar uma técnica para
    manter o foco, buscar sempre estudar de maneira'
  merge: -1
