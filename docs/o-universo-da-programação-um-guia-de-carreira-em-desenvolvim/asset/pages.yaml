    # 9.4 Testes de software


    Como dito anteriormente, garantir a qualidade de nosso software é responsabilidade
    nossa. E uma das maneiras de se garantir certa qualidade é fazendo testes automatizados.


    Existem diversos tipos de testes, para cada tipo de software e para cada parte
    do nosso programa e precisamos utilizar estes testes para conseguirmos assegurar
    a segurança da aplicação.


    É garantir que nada vai parar do nada por conta da alteração de uma linha de código
    ou porque alguém mudou a resposta de uma aplicação back-end.


    Uma maneira de aprender sobre esse tema é com o livro de Mauricio Aniche, *Testes
    automatizados de software*(https://www.casadocodigo.com.br/products/livro-testes-de-software/).


