    # Lógica e alguma linguagem de programação


    Lógica de programação é o tópico mais importante de tudo o que precisamos aprender.
    Lógica é uma maneira de pensar e por isso precisa ser muito pratica, pois quase
    uma mudança em como nós fazemos algo, como tomamos decisões. A lógica de programação
    é a técnica de escrever os programas para que computador tenha uma lista de tarefas
    para executar e realizar uma ação. Uma linguagem de programação pode ou não entrar
    nesse ponto de aprendizagem, podemos aprender raciocínio lógico sem depender de
    uma linguagem, como aconselho a já estudar com a linguagem que vamos trabalhar.
    Também é importante conhecer outras linguagens de programação depois de já possuírmos
    alguma experiência para aprendermos também outros


    paradigmas de programação (as maneiras como nós estruturamos o nosso programa
    para resolver os problemas).


    # Estruturas de dados e algoritmos'
