    # 5. Descansar é importante


    Sobrecargar nunca é bom. Um carro sobrecarregado não sai do lugar, um cérebro
    sobrecarregado não vai guardar as informações por muito tempo, assim como começará
    a evitar períodos de estudos, deixando-nos desconfortáveis com isso e, muito possível,
    pode começar a apresentar problemas graves.


    É importante que tenhamos hobby, pratiemos um tempo para simplesmente não fazer
    nada. De preferência que procuremos a prática de esportes para fortalecer nosso
    corpo e mente.


    O descanso e o movimento do corpo vão garantir a saúde e disposição de que precisamos
    para continuar aprendendo mais. Somente estudar ou fazer qualquer coisa sem um
    limite tirarmos um tempo para nós mesmos não é saudável e logo termos a fadiga
    de estar fazendo o mesmo todos os dias e do desânimo dessa rotina.


    Se por possível


    Somando um ambiente organizado, foco, técnicas e aprendizado ativo com o descanso
    e a prática de esportes, conseguiremos uma absorção muito maior do que estivermos
    estudando. Assim que aprendemos mais em menos tempo: otimizando nosso tempo e
    cuidando da nossa saúde.'
