    um conteúdo para o público alvo.


    Se o público alvo é mais iniciante a pessoa vai utilizar linguagem que alguém
    em nível básico entende. Se não, o público é formado por profissionais experientes,
    então o escritor ou escritora não vai se importar tanto com linguagem mais técnica
