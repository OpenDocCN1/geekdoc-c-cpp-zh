  \ 方法描边路径，它使用 `strokeStyle`。最后一个选项是调用 `clip()`，它根据路径创建一个新的裁剪区域。\n\n作为一个示例，考虑以下用于绘制没有数字的时钟面的代码：\n\
  \n![image](img/logo1.gif)\n\n```\nvar drawing = document.getElementById(\"drawing\"\
  );\n\n//make sure <canvas> is completely supported\nif (drawing.getContext){\n\n\
  \    var context = drawing.getContext(\"2d\");\n\n    //开始路径\n    context.beginPath();\n\
  \n    //绘制外圆\n    context.arc(100, 100, 99, 0, 2 * Math.PI, false);\n\n    //绘制内圆\n\
  \    context.moveTo(194, 100);\n    context.arc(100, 100, 94, 0, 2 * Math.PI, false);\n\
  \n    //绘制分钟针\n    context.moveTo(100, 100);\n\n    //绘制小时针\n    context.moveTo(100,\
  \ 15);\n\n    //描边路径\n    context.stroke();\n}\n```\n\n2DPathExample01.htm\n\n###\
  \ 绘制文本\n\n由于经常需要混合文本和图形，2D 绘图上下文提供了绘制文本的方法。有两种绘制文本的方法，`fillText()` 和 `strokeText()`，每个都接受四个参数：要绘制的字符串、x\
  \ 坐标、y 坐标以及可选的像素宽度。两种方法都基于以下三个属性进行绘制：\n\n*   `font` — 以 CSS 中指定的方式指示字体样式、大小和族，例如\
  \ \"10px Arial\"。\n*   `textAlign` — 指明文本如何对齐。可能值有 \"start\", \"end\", \"left\"\
  , \"right\" 和 \"center\"。建议使用 \"start\" 和 \"end\" 代替 \"left\" 和 \"right\"，因为这些更符合从左到右语言和从右到左语言的渲染。\n\
  *   `textBaseline` — 指明文本的基线。可能值有 \"top\", \"hanging\", \"middle\", \"alphabetic\"\
  , \"ideographic\", 和 \"bottom\"。\n\n这些属性有默认值，因此每次想绘制文本时不需要设置它们。`fillText()` 方法使用\
  \ `fillStyle` 属性绘制文本，而 `strokeText()` 方法使用 `strokeStyle` 属性。你可能大部分时间使用 `fillText()`，因为它模拟了网页上的正常文本渲染。例如，以下代码在上一节创建的时钟顶部绘制了一个\
  \ 12：\n\n```javascript\ncontext.font = \"bold 14px Arial\";\ncontext.textAlign =\
  \ \"center\";\ncontext.textBaseline = \"middle\";\ncontext.fillText(\"12\", 100,\
  \ 20);\n```\n\n2DTextExample01.htm\n\n结果图像显示在图 15-5。\n\nFIGURE 15-5\n\n![image](img/f558-01.jpg)\n\
  \n\n\n由于 `textAlign` 被设置为 `\"center\"` 且 `textBaseline` 被设置为 `\"middle\"`，坐标 `(100,80)`\
  \ 表示文本的水平和垂直中心点以及顶部坐标。如果 `textAlign` 设置为 `\"start\"`，则 x 坐标将代表在从左到右语言中文本的左侧坐标；而设置为\
  \ `\"end\"` 则使 x 坐标代表在从左到右语言中的右侧坐标。例如：\n\n```\n//normal\ncontext.font = \"bold 14px\
  \ Arial\";\ncontext.textAlign = \"center\";\ncontext.textBaseline = \"middle\";\n\
  context.fillText(\"12\", 100, 20);\n\n//start-aligned\ncontext.textAlign = \"start\"\
  ;\ncontext.fillText(\"12\", 100, 40);\n\n//end-aligned\ncontext.textAlign = \"end\"\
  ;\ncontext.fillText(\"12\", 100, 60);\n```\n\n### 2DTextExample02.htm\n\n字符串 `\"\
  12\"` 被绘制了三次，每次使用相同的 x 坐标，但使用了三个不同的 `textAlign` 值。y 坐标值也进行了递增，使得字符串不会重叠渲染。生成的图像如图\
  \ 15-6 所示。\n\nFIGURE 15-6\n\n![image](img/f559-01.jpg)\n\n时钟的垂直线直接位于中心，因此文本的对齐变得显而易见。你同样可以通过更改\
  \ `textBaseline` 来调整文本的垂直对齐方式。设置为 `\"top\"` 意味着 y 坐标是文本的顶部，`\"bottom\"` 意味着底部，而\
  \ `\"hanging\"`、`\"alphabetic\"` 和 `\"ideographic\"` 则指的是字体特定的基线坐标。\n\n由于绘制文本相当复杂，尤其是当你想要文本在特定区域内渲染时，2D\
  \ 上下文提供了一点额外帮助，通过 `measureText()` 方法来确定文本的尺寸。该方法接受一个参数（即要绘制的文本），并返回一个 `TextMetrics`\
  \ 对象。返回的对象目前只有一个属性 `width`，但意图是在未来提供更多指标。\n\n`measureText()` 方法使用 `font`、`textAlign`\
  \ 和 `textBaseline` 的当前值来计算指定文本的大小。例如，假设你想将文本 `Hello world!` 适应在一个宽度为 140 像素的矩形内。以下代码从\
  \ 100 像素的字体大小开始递减，直到文本适应为止：\n\n![image](img/logo1.gif)\n\n```\nvar fontSize = 100;\n\
  context.font = fontSize + \"px Arial\";\n\nwhile(context.measureText(\"Hello world!\"\
  ).width > 140){\n    fontSize--;\n    context.font = fontSize + \"px Arial\";\n\
  }\n\ncontext.fillText(\"Hello world!\", 10, 10);\ncontext.fillText(\"Font size is\
  \ \" + fontSize + \"px\", 10, 50); \n```\n\n### 2DTextExample03.htm\n\n`fillText()`\
  \ 和 `strokeText()` 都有第四个参数，即文本的最大宽度。该参数是可选的，且尚未在所有浏览器中实现（Firefox 4 是第一个实现它的浏览器）。当提供该参数时，使用\
  \ `fillText()` 或 `strokeText()` 调用一个无法适应最大宽度的字符串，会导致文本以正确的字符高度绘制，但字符会被水平缩放以适应宽度。图\
  \ 15-7 显示了这种效果。\n\nFIGURE 15-7\n\n![image](img/f559-02.jpg)\n\n文本绘制是复杂的绘制操作之一，因此，API\
  \ 的所有部分在支持 `<canvas>` 元素的浏览器中都得到了实现。\n\n## 变换\n\n`Context` 变换允许对绘制在画布上的图像进行操作。2D\
  \ 绘制上下文支持所有的基础绘制变换。当创建绘图上下文时，变换矩阵初始化为默认值，导致所有绘制操作都按照其描述直接应用。对绘图上下文应用变换会导致操作使用不同的\
  \ `transformaton matrix`（变换矩阵），从而产生不同的结果。\n\n可以使用以下任何方法扩展变换矩阵：\n\n*   `rotate(angle)`——围绕原点按\
  \ `angle` 弧度旋转图像。\n*   `scale(scaleX, scaleY)`——在 x 维度上按 `scaleX` 倍、在 y 维度上按 `scaleY`\
  \ 倍缩放图像。`scaleX` 和 `scaleY` 的默认值均为 1.0。\n*   `translate(x, y)`——将原点移动到点 `(x, y)`。执行此操作后，坐标\
  \ `(0, 0)` 位于之前描述的点 `(x, y)`。\n*   `transform(m1_1, m1_2, m2_1, m2_2, dx, dy)`——通过乘以如下描述的矩阵直接更改变换矩阵：\n\
  \n```\nm1_1 m1_2 dx\nm2_1 m2_2 dy\n0    0    1\n```\n*   `setTransform(m1_1, m1_2,\
  \ m2_1, m2_2, dx, dy)`——将变换矩阵重置为默认状态并调用 `transform()`。\n\n变换可以根据需要变得简单或复杂。例如，通过将原点移动到中心，绘制之前示例中的时钟指针可能会变得更容易。\n\
  \n### 2DTransformExample01.htm\n\n将原点移动到表盘中心后，只需进行简单的计算即可。考虑以下内容：\n\n![image](img/logo1.gif)\n\
  \n```\nvar canvas = document.getElementById(\"myCanvas\");\nvar context = canvas.getContext(\"\
  2d\");\n\ncontext.translate(100, 100);\ncontext.beginPath();\ncontext.arc(0, 0,\
  \ 50, 0, 2 * Math.PI);\ncontext.stroke();\n\ncontext.rotate(Math.PI / 4);\ncontext.beginPath();\n\
  context.moveTo(0, 0);\ncontext.lineTo(0, -50);\ncontext.stroke();\n```\n\n### 2DTransformExample01.htm\n\
  \n由于原点已经移动到中心，旋转从该点开始应用。这意味着指针锚定在中心并向右旋转。结果如图 15-8 所示。\n\nFIGURE 15-8\n\n![image](img/f562-01.jpg)\n\
  \n所有这些变换以及如 `fillStyle` 和 `strokeStyle` 等属性，在显式更改之前都会一直设置在上下文中。虽然没有显式将所有内容重置为默认值的方法，但有两个方法可以帮助跟踪更改。每当你想返回到一组特定的属性和变换时，调用\
  \ `save()` 方法。一旦调用，该方法会将此时此刻刻的所有设置推送到栈中以备保存。然后你可以继续对上下文进行其他更改。当你想要返回之前的设置时，调用 `restore()`\
  \ 方法，它会弹出设置栈并恢复所有设置。你可以继续调用 `save()` 在栈中存储更多设置，然后系统地使用 `restore()` 返回它们。\n\n\n\n\
  \n\n```javascript\ncontext.fillStyle = \"#ff0000\";\ncontext.save();\n\ncontext.fillStyle\
  \ = \"#00ff00\";\ncontext.translate(100, 100);\ncontext.save();\n\ncontext.fillStyle\
  \ = \"#0000ff\";\ncontext.fillRect(0, 0, 100, 200);   //在 (100, 100)绘制蓝色矩形\n\ncontext.restore();\n\
  context.fillRect(10, 10, 100, 200);   //在 (110, 110)绘制绿色矩形\n\ncontext.restore();\n\
  context.fillRect(0, 0, 100, 200);    //在 (0,0)绘制红色矩形\n```\n\n2DSaveRestoreExample01.htm\n\
  \n在此代码中，`fillStyle` 被设置为红色然后调用了 `save()`。接下来，将 `fillStyle` 改为绿色并将坐标平移到 `(100,100)`。再次调用\
  \ `save()` 来保存这些设置。然后将 `fillStyle` 属性设置为蓝色并绘制一个矩形。因为坐标被平移了，矩形实际上被绘制在 `(100,100)`。当调用\
  \ `restore()` 时，`fillStyle` 被恢复为绿色，因此绘制的下一个矩形是绿色的。由于平移仍然有效，这个矩形被绘制在 `(110,110)`。当再次调用\
  \ `restore()` 时，平移被移除且 `fillStyle` 恢复为红色。最后一个矩形绘制在 `(0,0)`。\n\n请注意，`save()` 仅保存应用于绘图上下文的设置和变换，而不会保存绘图上下文的内容。\n\
  \n# 绘制图像\n\n2D 绘图上下文对图像操作具有内置支持。如果你有一张要在画布上绘制的现有图像，可以使用 `drawImage()` 方法来实现。根据所需的结果，可以传递三组不同的参数来调用此方法。最简单的调用是传递一个\
  \ HTML `<img>` 元素以及目标 `x-` 和 `y-` 坐标，这会直接在指定位置绘制图像。以下是一个示例：\n\n![image](img/logo1.gif)\n\
  \n```javascript\nvar image = document.images[0];\ncontext.drawImage(image, 10, 10);\n\
  ```\n\n2DDrawImageExample01.htm\n\n此代码获取文档中的第一个图像并将其绘制在位置 `(10,10)` 的上下文中。图像以与原图相同的比例绘制。你可以通过添加两个参数（目标宽度和目标高度）来更改图像的绘制方式。这将缩放绘制内容而不影响上下文的变换矩阵。以下是一个示例：\n\
  \n```javascript\ncontext.drawImage(image, 50, 10, 20, 30);\n```\n\n2DDrawImageExample01.htm\n\
  \n当执行此代码时，图像将被缩放为 20 像素宽、30 像素高。\n\n你还可以只选择图像的某个区域绘制到上下文中。这是通过向 `drawImage()` 提供九个参数实现的：要绘制的图像、源\
  \ `x-` 坐标、源 `y-` 坐标、源宽度、源高度、目标 `x-` 坐标、目标 `y-` 坐标、目标宽度和目标高度。使用 `drawImage()` 的重载方法可以让你获得最大的控制权。考虑这个示例：\n\
  \n```javascript\ncontext.drawImage(image, 0, 10, 50, 50, 0, 100, 40, 60);\n```\n\
  \n2DDrawImageExample01.htm\n\n在这里，画布上只绘制了图像的一部分。图像的这部分从点 `(0,10)` 开始，宽 50 像素，高 50\
  \ 像素。图像绘制到上下文的 `(0,100)` 点，并缩放到适应 `40×60` 的区域。\n\n这些绘制操作允许你创建有趣的效果，如 图 15-9 所示。\n\
  \n图 15-9\n\n![image](img/f563-01.jpg)\n\n除了第一个参数传递 HTML `<img>` 元素外，你还可以传递另一个 `<canvas>`\
  \ 元素将一个画布的内容绘制到另一个画布上。\n\n`drawImage()` 方法与其他方法结合，可以轻松执行基本的图像处理，其结果可以使用 `toDataURL()`\
  \ 获取。然而，有一种情况下这不起作用：如果从不同页面源的图像被绘制到上下。在这种情况下，调用 `toDataURL()` 会抛出错误。例如，如果托管在 [www.example.com](http://www.example.com)\
  \ 的页面绘制了托管在 [www.wrox.com](http://www.wrox.com) 的图像，上下文将被视为“已污染”并抛出错误。\n\n# 阴影\n\
  \n2D 上下文将根据几个属性的值自动沿形状或路径绘制阴影：\n\n*   `shadowColor` — 绘制阴影的 CSS 颜色。默认为黑色。\n*   `shadowOffsetX`\
  \ — 距离形状或路径 `x-coordinate` 的 `x-coordinate` 偏移量。默认为 0。\n*   `shadowOffsetY` — 距离形状或路径\
  \ `y-coordinate` 的 `y-coordinate` 偏移量。默认为 0。\n*   `shadowBlur` — 阴影的像素数。默认为 0。\n\
  \n这些属性都可以读取和写入上下文。例如：\n\n![image](img/logo.gif)\n\n```javascript\nvar context =\
  \ canvas.getContext(\"2d\");\n\ncontext.shadowColor = \"rgba(0,0,0,0.5)\";\ncontext.shadowOffsetX\
  \ = 5;\ncontext.shadowOffsetY = 5;\ncontext.shadowBlur = 5;\n\n//绘制红色矩形\ncontext.fillStyle\
  \ = \"#ff0000\";\ncontext.fillRect(10, 10, 50, 50);\n\n//绘制绿色矩形\ncontext.fillStyle\
  \ = \"#00ff00\";\ncontext.fillRect(30, 30, 50, 50);\n\n//绘制蓝色矩形\ncontext.fillStyle\
  \ = \"#0000ff\";\ncontext.fillRect(50, 50, 50, 50);\n```\n\n2DSaveRestoreExample01.htm\n\
  \n阴影使用如 图 15-10 所示的样式绘制。\n\n图 15-10\n\n![image](img/f564-01.jpg)\n\n阴影支持存在一些问题。Internet\
  \ Explorer 9、Firefox 4 和 Opera 11 表现正常。Chrome（版本 10）会错误地应用阴影。Safari（版本 5）也是。\n\n\
  # 渐变\n\n渐变由 `CanvasGradient` 实例表示，使用 2D 上下文可以很容易创建和修改。要创建线性渐变，调用 `createLinearGradient()`\
  \ 方法。此方法接受四个参数：起始 `x-coordinate`、起始 `y-coordinate`、结束 `x-coordinate` 和结束 `y-coordinate`。调用后，该方法创建一个指定大小的新\
  \ `CanvasGradient` 对象并返回该实例。\n\n一旦拥有渐变对象，下一步是使用 `addColorStop()` 方法分配颜色停止点。此方法接受两个参数：停止点的位置和\
  \ CSS 颜色。停止点的位置是 0（第一种颜色）到 1（最后一种颜色）之间的数字。例如：\n\n![image](img/logo.gif)\n\n```javascript\n\
  var gradient = context.createLinearGradient(30, 30, 70, 70);\n\ngradient.addColorStop(0,\
  \ \"white\");\ngradient.addColorStop(1, \"black\");\n```\n\n2DFillGradientExample01.htm\n\
  \n现在渐变对象代表从画布上的点 `(30,30)` 到点 `(70,70)` 的渐变。起始颜色是白色，停止颜色是黑色。你现在可以将 `fillStyle` 或\
  \ `strokeStyle` 属性设置为此值，以便使用渐变绘制形状：\n\n```javascript\n//绘制红色矩形\ncontext.fillStyle\
  \ = \"#ff0000\";\ncontext.fillRect(10, 10, 50, 50);\n\n//绘制渐变矩形\ncontext.fillStyle\
  \ = gradient;\ncontext.fillRect(30, 30, 50, 50);\n```\n\n2DFillGradientExample01.htm\n\
  \n为了让渐变覆盖整个矩形而不仅仅是部分，坐标需要匹配。此代码产生 图 15-11 所示的图形。\n\n图 15-11\n\n![image](img/f565-01.jpg)\n\
  \n如果矩形没有恰好绘制在这一位置，则只会显示渐变的一部分。例如：\n\n\n\n\n```\ncontext.fillStyle = gradient;\n\
  context.fillRect(50, 50, 50, 50);\n```\n\n### 2DFillRectGradientExample02.htm\n\n\
  这段代码创建了一个左上角只有极少量白色的矩形。这是因为矩形是在渐变的中点绘制的，那里的颜色过渡几乎完全完成。因此，由于渐变不会重复，矩形大部分是黑色的。保持渐变与你的形状对齐非常重要，有时使用函数来计算合适的坐标是有帮助的。例如：\n\
  \n![image](img/logo1.gif)\n\n```javascript\nfunction createRectLinearGradient(context,\
  \ x, y, width, height){\n    return context.createLinearGradient(x, y, x+width,\
  \ y+height);\n}\n```\n\n### 2DFillRectGradientExample03.htm\n\n此函数根据起始的 x 和 y 坐标以及宽度和高度创建一个渐变，以便相同的数字可以用于\
  \ `fillRect()`：\n\n```javascript\nvar gradient = createRectLinearGradient(context,\
  \ 30, 30, 50, 50);\n\ngradient.addColorStop(0, \"white\");\ngradient.addColorStop(1,\
  \ \"black\");\n\n//绘制渐变矩形\ncontext.fillStyle = gradient;\ncontext.fillRect(30, 30,\
  \ 50, 50);\n```\n\n### 2DFillRectGradientExample03.htm\n\n跟踪坐标是使用 canvas 一个重要且棘手的方面。如\
  \ `createRectLinearGradient()` 等辅助函数可以减轻管理坐标的痛苦。\n\n径向渐变是通过 `createRadialGradient()`\
  \ 方法创建的。该方法接受六个参数，对应圆的中心及其半径。前三个参数定义起始圆的中心（`x` 和 `y`）和半径，而后三个参数定义结束圆的相同内容。在考虑径向渐变时，你会发现将其想象成一个长圆柱，你在定义两端圆的大小。通过让一个圆变小而另一个变大，你实际上创建了一个锥体，并通过移动每个圆的中心来旋转该锥体。\n\
  \n要创建一个从形状中心开始并向外延伸的径向渐变，你需要将两个圆的中心设置为同一个原点。例如，为了在上一个示例的矩形中心创建径向渐变，两个圆都必须以 (55,55)\
  \ 为中心。这是因为矩形是从点 (30,30) 绘制到点 (80,80) 的。代码如下：\n\n```javascript\nvar gradient = context.createRadialGradient(55,\
  \ 55, 10, 55, 55, 30);\n\ngradient.addColorStop(0, \"white\");\ngradient.addColorStop(1,\
  \ \"black\");\n\n//绘制一个红色矩形\ncontext.fillStyle = \"#ff0000\";\ncontext.fillRect(10,\
  \ 10, 50, 50);\n\n//绘制渐变矩形\ncontext.fillStyle = gradient;\ncontext.fillRect(30,\
  \ 30, 50, 50);\n```\n\n### 2DFillRectGradientExample04.htm\n\n运行此代码将得到如图 15-12 所示的图形。\n\
  \nFIGURE 15-12\n\n![image](img/f567-01.jpg)\n\n径向渐变由于其创建的复杂性处理起来稍微困难一点，但通常你会对起始圆和结束圆使用相同的中心，只需通过改变圆的半径来实现大多数基本效果。\n\
  \n### 模式 (Patterns)\n\n模式简单来说重复的图像，用于填充或描边形状。要创建一个新模式，调用 `createPattern()` 方法并传递两个参数：一个\
  \ HTML `<img>` 元素和一个指示图像应如何重复的字符串。第二个参数与 CSS `background-repeat` 属性的值相同：\"repeat\"\
  、repeat-x\"、repeat-y\" 和 \"no-repeat\"。例如：\n\n![image](img/logo1.gif)\n\n```javascript\n\
  var image = document.images[0],\n    pattern = context.createPattern(image, \"repeat\"\
  );\n\n//绘制一个矩形\ncontext.fillStyle = pattern;\ncontext.fillRect(10, 10, 150, 150);\n\
  ```\n\n### 2DFillRectPatternExample01.htm\n\n请记住，和渐变一样，模式实际上从画布 上的点 (0,0) 开始。将填充样式设置为模式意味着在指定位置显示模式，而不是在该位置开始绘制。这段代码生成的页面看起来像图\
  \ 15-13。\n\nFIGURE 15-13\n\n![image](img/f567-02.jpg)\n\n`createPattern()` 的第一个参数也可以是\
  \ `<video>` 元素或另一个 `<canvas>` 元素。\n\n### 处理图像数据 (Working with Image Data)\n\n2D\
  \ 上下文更强大的方面之一是可以使用 `getImageData()` 方法获取原始图像数据。该方法接受四个参数：要获取数据的第一个像素的左侧和顶部位置，以及要获取的像素宽度和高度。例如，要获取从\
  \ (10,5) 开始的 50x50 区域的图像数据，请使用：\n\n```javascript\nvar imageData = context.getImageData(10,\
  \ 5, 50, 50);\n```\n\n返回的对象是 `ImageData` 实例。每个 `ImageData` 包含三个属性：`width`、`height`\
  \ 和 `data`。`data` 属性是一个包含像素信息的数组。每个像素表示为四个项：red、green、blue 和 alpha。因此，data 数组包含\
  \ red、green、blue、alpha。数组中的每个值都是 0 到 255 之间的数字。访问数据允许你以多种方式处理图像。例如，通过更改以下内容创建一个简单的灰度滤镜：\n\
  \n![image](img/pen.gif)\n\n### 2DImageDataExample01.htm\n\n此示例首先将图像绘制到画布上，然后获取其图像数据。`for`\
  \ 循环遍历图像数据中的每个像素。注意，每次循环 `i` 的值都会加 4。一旦获取了红、绿、蓝值，就会对它们取平均值以得到新值。然后将每个值都设回该平均值，有效地消除颜色，只留下亮度相似的灰色。然后将\
  \ data 数组赋值回 `imageData` 对象。\n\n```javascript\nvar drawing = document.getElementById(\"\
  drawing\");\n\n//确保支持 <canvas>\nif (drawing.getContext){\n\n    var context = drawing.getContext(\"\
  2d\"),\n        image = document.images[0],\n        imageData, data,\n        i,\
  \ len, average,\n        red, green, blue, alpha;\n\n    //绘制原始大小\n    context.drawImage(image,\
  \ 0, 0);    \n\n    //获取图像数据\n    imageData = context.getImageData(0, 0, image.width,\
  \ image.height);\n    data = imageData.data;\n\n    for (i=0, len=data.length; i+=4){\n\
  \n        red = data[i];\n        green = data[i+1];\n        blue = data[i+2];\n\
  \        alpha = data[i+3];\n\n        //获取 rgb 的平均值\n        average = Math.floor((red\
  \ + green + blue) / 3);\n\n        // 设置颜色，保持 alpha 不变\n        data[i] = average;\n\
  \        data[i+1] = average;\n        data[i+2] = average;\n\n    }\n\n    // 赋值回图像数据并显示\n\
  \    imageData.data = data;                \n    context.putImageData(imageData,\
  \ 0, 0);\n}\n```\n\n\n\n\n有两个属性适用于 2D 上下文中的所有绘制操作：`globalAlpha` 和 `globalCompositionOperation`。`globalAlpha`\
  \ 属性是一个 0 到 1（包含边界）之间的数字，用于指定所有绘制的透明度值。默认值为 0。如果后续的所有绘制都应该使用相同的透明度，请将 `globalAlpha`\
  \ 设置为适当的值，执行绘制，然后将 `globalAlpha` 设置回 0。例如：\n\n![image](img/logo1.gif)\n\n```\n//画一个红色矩形\n\
  context.fillStyle = \"#ff0000\";\ncontext.fillRect(10, 10, 50, 50);\n\n//改变全局透明度\n\
  context.globalAlpha = 0.5;\n\n//画一个蓝色矩形\ncontext.fillStyle = \"rgba(0,0,255,1)\"\
  ;\ncontext.fillRect(30, 30, 50, 50);\n\n//重置\ncontext.globalAlpha = 0;\n```\n\n\
  2DGlobalAlphaExample01.htm\n\n在这个示例中，一个蓝色矩形画在红色矩形之上。由于在绘制蓝色矩形之前将 `globalAlpha` 设置为\
  \ 0.5，它变得部分透明，使得透过蓝色矩形可以看到红色矩形。\n\n`globalCompositionOperation` 属性指示新绘制的形状应如何与上下文中已有的图像合并。该属性是以下字符串之一的数值：\n\
  \n*   `source-over`（默认值）— 新绘制的内容画在现有图像之上。\n*   `source-in` — 新绘制的内容仅在与现有图像重叠的地方绘制。其他部分均变为透明。\n\
  *   `source-out` — 新绘制的内容仅在与现有图像不重叠的地方绘制。其他部分均变为透明。\n*   `source-atop` — 新绘制的内容仅在与现有图像重叠的地方绘制。现有图像不受影响。\n\
  *   `destination-over` — 新绘制的内容画在现有图像下方，仅通过之前透明的像素可见。\n*   `destination-in` — 新绘制的内容画在现有图像下方，两个图像不重叠的所有地方都变为透明。\n\
  *   `destination-out` — 新绘制的内容会擦除现有图像中重叠的部分。\n*   `destination-atop` — 新绘制的内容画在现有图像后面。现有图像在与新绘制不重叠的地方变为透明。\n\
  *   `lighter` — 通过将新绘制的值与现有图像的值结合来绘制出更亮的图像。\n*   `copy` — 新绘制的内容擦除现有图像并完全替换它。\n\
  *   `xor` — 通过将图像数据与现有图像进行异或（XOR）运算来绘制新内容。\n\n这些组合操作的描述很难用语言或黑白图像来表示。为了更好地演示每种操作，请访问\
  \ [`developer.mozilla.org/samples/canvas-tutorial/6_1_canvas_composite.html`](https://developer.mozilla.org/samples/canvas-tutorial/6_1_canvas_composite.html)。建议在\
  \ Internet Explorer 9+ 或 Firefox 4+ 中访问此网站，因为它们拥有最完整的 canvas 实现。这里是一个简单的示例：\n\n\
  ![image](img/logo1.gif)\n\n```\n//画一个红色矩形\ncontext.fillStyle = \"#ff0000\";\ncontext.fillRect(10,\
  \ 10, 50, 50);\n\n//设置组合操作\ncontext.globalCompositeOperation = \"destination-over\"\
  ;\n\n//画一个蓝色矩形\ncontext.fillStyle = \"rgba(0,0,255,1)\";\ncontext.fillRect(30, 30,\
  \ 50, 50);\n```\n\n2DGlobalCompositeOperationExample01.htm\n\n尽管蓝色矩形通常会画在红色矩形上面，但将\
  \ `globalCompositeOperation` 改为 `\"destination-over\"` 意味着红色矩形实际上位于蓝色矩形之上。\n\n使用\
  \ `globalCompositionOperation` 时，请确保在多种浏览器中进行测试。这些操作在跨浏览器实现上仍然存在显著差异。Safari 和 Chrome\
  \ 在这些操作上仍存在几个问题，可以通过访问上述的 URL 并将其渲染效果与 Internet Explorer 或 Firefox 进行对比来观察。\n\n\
  # WEBGL\n\nWebGL 是用于 canvas 的 3D 上下文。与其他 Web 技术不同，WebGL 并不是由 W3C 指定。相反，Khronos Group\
  \ 正在开发该规范。根据其网站，“Khronos Group 是一个非营利的、由成员资助的联盟，致力于为各种平台和设备上的并行计算、图形和动态媒体创建免版税的开放标准。”Khronos\
  \ Group 还参与了其他图形 API 的工作，例如 OpenGL ES 2.0，它是浏览器中 WebGL 的基础。\n\nOpenGL 等 3D 图形语言是复杂的课题，涵盖所有概念超本书的范围。建议在用\
  \ WebGL 时熟悉 OpenGL ES 2.0，因为许多概念是直接映射的。\n\n本节假设你已具备 OpenGL ES 2.0 概念的知识，并仅尝试描述 OpenGL\
  \ ES 2.0 的某些部分在 WebGL 中是如何实现的。有关 OpenGL 的更多信息，请访问 [www.opengl.org](http://www.opengl.org)；欲需系列优秀的\
  \ WebGL 教程，请访问 [www.learningwebgl.com](http://www.learningwebgl.com)。\n\n## 类型数组\
  \ (Typed Arrays)\n\n由于 WebGL 处理的是需要可预测精度的复杂计算，标准的 JavaScript 数字无法工作。相反，WebGL 引入了类型数组（typed\
  \ arrays）的概念，这种数组的项被设置为特定类型。类型数组的核心是 `ArrayBuffer`，它是一个项被设置为特定类型的数组。`ArrayBuffer`\
  \ 代表一个固定长度的二进制数据缓冲区。`ArrayBuffer` 允许你在内存中分配字节数，但不能直接读取或写入。例如：\n\n```javascript\n\
  var buffer = new ArrayBuffer(20);\n```\n\n一旦创建了 `ArrayBuffer`，可以通过 `byteLength`\
  \ 属性获取其包含的字节数：\n\n```javascript\nvar bytes = buffer.byteLength;\n```\n\n## 视图 (Views)\n\
  \n视图是使用 `ArrayBuffer` 内部字节的一种方式。最通用的视图是 `DataView`，它允许选择 `ArrayBuffer` 的子集。这样做需要传入\
  \ `ArrayBuffer`、一个可选的字节偏移量以及可选的字节数。例如：\n\n```\n//对整个 buffer 创建视图\nvar view = new\
  \ DataView(buffer);\n\n//从字节 9 开始创建视图\nvar view = new DataView(buffer, 9);\n\n//从字节\
  \ 9 到 18 创建视图\nvar view = new DataView(buffer, 9, 10);\n```\n\n一旦实例化，`DataView`\
  \ 将偏移和长度信息分别保留在 `byteOffset` 和 `byteLength` 属性中：\n\n```javascript\nalert(view.byteOffset);\n\
  alert(view.byteLength);\n```\n\n这些属性让你稍后轻松检查视图。你也可以通过 `buffer` 属性检索数组缓冲区。\n\n对 `DataView`\
  \ 的读取和写入是根据你处理的数据类型通过一系列 getter 和 setter 完成的。下列出了支持的数据类型及其关联方法：\n\n| 数据类型 | getter\
  \ | setter |\n| --- | --- | --- |\n| 有符号 8 位整数 | `getInt8(byteOffset)` | `setInt8(byteOffset,\
  \ value)` |\n| 无符号 8 位整数 | `getUint8(byteOffset)` | `setUint8(byteOffset, value)`\
  \ |\n| 有符号 16 位整数 | `getInt16(byteOffset, littleEndian)` | `setInt16(byteOffset,\
  \ value, littleEndian)` |\n| 无符号 16 位整数 | `getUint16(byteOffset, littleEndian)`\
  \ | `setUint16(byteOffset, value, littleEndian)` |\n| 有符号 32 位整数 | `getInt32(byteOffset,\
  \ littleEndian)` | `setInt32(byteOffset, value, littleEndian)` |\n| 无符号 32 位整数 |\
  \ `getUint32(byteOffset, littleEndian)` | `setUint32(byteOffset, value, littleEndian)`\
  \ |\n| 32 位浮点数 | `getFloat32(byteOffset, littleEndian)` | `setFloat32(byteOffset,\
  \ value, littleEndian)` |\n| 64 位浮点数 | `getFloat64(byteOffset, littleEndian)` |\
  \ `setFloat64(byteOffset, value, littleEndian)` |\n\n\n\n\n每个方法都期望第一个参数是用于读取或写入的字节偏移量。请记住，根据数据类型的不同，数据可能需要比一个字节更多的存储空间。一个\
  \ 8 位无符号整数占用一个字节，而 32 位浮点数占用四个字节。使用 `DataView` 时，你需要自己管理这一点，确保你确切知道你的数据需要多少字节字节，并使用正确的方法。例如：\n\
  \n![image](img/logo1.gif)\n\n```\nvar buffer = new ArrayBuffer(20),\n    view =\
  \ new DataView(buffer),\n    value;\n\nview.setUint16(0, 25);\nview.setUint16(2,\
  \ 50);   //不要从 1 开始，16 位整数占用两个字节\nvalue = view.getUint16(0);\n```\n\nDataViewExample01.htm\n\
  \n这段代码将两个无符号的 16 位整数保存到数组缓冲区（array buffer）。由于每个 16 位整数占用两个字节，第一个数字存储在字节偏移量 0 处，而第二个存储在字节偏移量\
  \ 2 处。\n\n每个处理 16 位或更大数字的方法都有一个名为 `littleEndian` 的可选参数。这是一个布尔值，指示该值应该以小端序（最低有效字节是第一个字节）而不是大端序（最低有效字节是最后一个字节）读取或写入。如果你不确定使用哪一个，请省略此选项以使用默认的大端序存储模式。\n\
  \n由于你处理的是字节偏移量而不是项目索引，可能可以通过不同的方式访问相同的字节。例如：\n\n![image](img/logo1.gif)\n\n```\n\
  var buffer = new ArrayBuffer(20),\n    view = new DataView(buffer),\n    value;\n\
  \nview.setUint16(0, 25);\nvalue = view.getInt8(0);\n\nalert(value);    //0\n```\n\
  \nDataViewExample02.htm\n\n在这个示例中，数字 25 被写入一个从字节偏移量 0 开始的 16 位无符号整数中。 尝试将该值作为 8\
  \ 位有符号整数读取会导致返回值为 0。这是因为 25 的二进制形式在第一个字节中全为 0（参见图 15-14）。\n\nFIGURE 15-14\n\n![image](img/f573-01.jpg)\n\
  \n因此，虽然 `DataView` 让你能够访问缓冲区中的字节级数据，但你需要跟踪数据存储的位置以及它需要多少字节。这可能是一项大量工作，因此也提供了类型视图（typed\
  \ views）。\n\n## 类型视图\n\n类型视图通常被称为类型数组（typed arrays），因为它们的作用类似于普通数组，不同之处在于它们的元素必须是特定数据类型。有几种类型视图，并且它们都继承自\
  \ `DataView`：\n\n*   `Int8Array` —— 用 8 位补码表示整数表示数字。\n*   `Uint8Array` —— 用 8 位无符号整数表示数字。\n\
  *   `Int16Array` —— 用 16 位补码表示整数表示数字。\n*   `Uint16Array` —— 用 16 位无符号整数表示数字。\n*\
  \   `Int32Array` —— 用 32 位补码表示整数表示数字。\n*   `Uint32Array` —— 用 32 位无符号整数表示数字。\n*\
  \   `Float32Array` —— 用 32 位 IEEE 浮点值表示数字。\n*   `Float64Array` —— 用 64 位 IEEE 浮点值表示数字。\n\
  \n每个视图以不同的方式表示数据，并且每条数据可能需要一个或多个字节来表示。例如，一个 20 字节的 `ArrayBuffer` 在 `Int8Array` 或\
  \ `Uint8Array` 中包含 20 个值；在 `Int16Array` 或 `Uint16Array` 中包含 10 个值；在 `Int32Array`、`Uint32Array`\
  \ 或 `Float32Array` 中包含 5 个值；或者在 `Float64Array` 中包含两个值。\n\n由于这些每类型都继承自 `DataView`，你可以使用相同的构造函数参数实例化它们：使用的\
  \ `ArrayBuffer` 对象、起始字节偏移量（默认为 0）以及要包含的字节数。只有第一个参数是必须的。示例：\n\n```\n//创建一个使用整个缓冲器的数组\n\
  var int8s = new Int8Array(buffer);\n\n//仅使用从字节 9 开始的字节\nvar int16s = new Int16Array(buffer,\
  \ 9);\n\n//仅使用从 9 到 18 的字节\nvar uint16s = new Uint16Array(buffer, 9, 10);\n```\n\
  \n能够指定缓冲区的子集意味着你可以在同一个缓冲区内存储不同的数值类型。例如，以下允许在缓冲区开头存储 8 位整数，并在剩余部分存储 16 位整数：\n\n```\n\
  //使用缓冲区的一部分存储 8 位整数，另一部分存储 16 位整数\nvar int8s = new Int8Array(buffer, 0, 10);\nvar\
  \ uint16s = new Uint16Array(buffer, 11, 10);\n```\n\n每个视图构造函数都有一个名为 `BYTES_PER_ELEMENT`\
  \ 的属性，指示类型数组中每个元素所需的字节数。因此，`Uint8Array.BYTES_PER_ELEMENT` 为 1，而 `Float32Array.BYTES_PER_ELEMENT`\
  \ 为 4。你可以利用此来帮助初始化视图：\n\n```\n//需要 10 个项目的空间\nvar int8s = new Int8Array(buffer,\
  \ 0, 10 * Int8Array.BYTES_PER_ELEMENT);\n\n//需要 5 个项目的空间\nvar uint16s = new Uint16Array(buffer,\
  \ int8s.byteOffset + int8s.byteLength, \n                              5 * Uint16Array.BYTES_PER_ELEMENT);\n\
  ```\n\n此示例创建了数组缓冲区的两个视图。前 10 个字节用于存储 8 位整数，而剩余部分用于存储无符号 16 位整数。`Uint16Array` 使用\
  \ `Int8Array` 的 `byteOffset` 和 `byteLength` 属性来确保视图从 8 位数据之后开始。\n\n由于类型视图的目的是让处理二进制数据变得更容易，你也可以在不先创建\
  \ `ArrayBuffer` 的情况下创建一个新的类型视图。只需传入你希望数组包含的项目数量，就会创建一个 `ArrayBuffer`。例如：\n\n```\n\
  //为 10 个 8 位整数创建一个缓冲区\nvar int8s = new Int8Array(10);\n\n//为 16 位整数创建一个缓冲区\nvar\
  \ uint16s = new Uint16Array(10);\n```\n\n普通数组也可以通过传递给类型视图构造函数转换为类型视图：\n\n```javascript\n\
  // 5 个 8 位整数\nvar int8s = new Int8Array([10, 20, 30, 40, 50]);\n```\n\n以这种方式使用类型视图使其更像数组对象，并确保在读取或写入时使用正确的数据类型。在使用类型视图时，你可以使用下标法访问数据，并使用\
  \ `length` 属性确定存在多少项目。这使得遍历类型视图与遍历数组完全相同：\n\n```javascript\nfor (var i=0, len=int8s.length;\
  \ i < len; i++){\n    console.log(\"位置 \" + i + \" 的值为 \" + int8s[i]);\n}\n```\n\
  \n也可以使用下标法为类型视图中的位置赋值。如果值不在项目指定的字节数范围内，则将作为最大值的模进行存储。例如，无符号 16 位整数表示的最大数字是 65535。如果你尝试存储\
  \ 65536，它将变为 0；尝试存储 65537 将得到 1，依此类推：\n\n```javascript\nvar uint16s = new Uint16Array(10);\n\
  uint16s[0] = 65537;\nalert(uint16s[0]);  //1\n```\n\n当数据类型不匹配时不会抛出错误，因此你必须确定数字符合字节限制。\n\
  \n类型视图还有一个额外的方法 `subarray()`，它允许你在底层数组缓冲区的子集创建一个新视图。该方法接受两个参数：起始的项目索引和一个可选的结束项目索引。返回的类型与调用它的类型相同。例如：\n\
  \n```javascript\nvar uint16s = new Uint16Array(10),\n    sub = uint16s.subarray(2,\
  \ 5);\n```\n\n在代码中，`sub` 也是 `Uint16Array` 的实例，并且是对与 `uint16s` 相同的 `ArrayBuffer`对象的视图。子数组的优势在于允许访问数组中较少的项目而不用担心无意修改其他项目。\n\
  \n类型数组是执行 WebGL 操作的重要部分。\n\n## WebGL 上下文\n\n\n\n\n\n在支持的浏览器中，WebGL 上下文名称目前为 \"experimental-webgl\"\
  ，因为 WebGL 规范仍在开发中。一旦开发完成，上下文名称将简单变为 \"webgl\"。如果浏览器不支持 WebGL，则尝试获取 WebGL 上下文将返回\
  \ `null`。在尝试使用上下文之前，你应该始终检查返回的值：\n\n```\nvar drawing = document.getElementById(\"\
  drawing\");\n\n//make sure <canvas> is completely supported\nif (drawing.getContext){\n\
  \n    var gl = drawing.getContext(\"experimental-webgl\");\n    if (gl){\n     \
  \   //proceed with WebGL\n    }\n}\n```\n\nWebGLExample01.htm\n\n### WebGL 上下文\n\
  \nWebGL 上下文对象通常命名为 `gl`。大多数 WebGL 应用和示例使用这种命名约定，因为 OpenGL ES 2.0 的方法和值通常以 \"gl\"\
  \ 开头。这样做意味着 JavaScript 代码读起来更像 OpenGL 程序。\n\n一旦建立了 WebGL 上下文，你就可以开始 3D 绘图了。正如之前提到的，由于\
  \ WebGL 是 OpenGL ES 2.0 的 Web 版本，本节中讨论的概念实际上是在 JavaScript 中实现的 OpenGL 概念。\n\n你可以通过向\
  \ `getContext()` 传递第二个参数来指定 WebGL 上下文的选项。该参数是一个包含一个或多个属性的对象：\n\n*   `alpha` — 当设置为\
  \ `true` 时，为上下文创建一个 alpha 通道缓冲区。默认值为 `true`。\n*   `depth` — 设置为 `true` 时，提供一个 16\
  \ 位深度缓冲区。默认值为 `true`。\n*   `stencil` — 设置为 `true` 时，提供一个 8 位模板缓冲区（stenc buffer）。默认值为\
  \ `false`。\n*   `antialias` — 设置为 `true` 时，将使用默认机制进行抗锯齿处理。默认值为 `true`。\n*   `premultipliedAlpha`\
  \ — 设置为 `true` 时，假设绘制缓冲区具有预乘法 alpha 值。默认值为 `true`。\n*   `preserveDrawingBuffer`\
  \ — 设置为 `true` 时，在绘制完成后保留绘制缓冲区。默认值为 `false`。建议仅在你确切知道其作用时才更改，因为可能会对性能的影响。\n\n选项对象的传递方式如下：\n\
  \n```\nvar drawing = document.getElementById(\"drawing\");\n\n//make sure <canvas>\
  \ is completely supported\nif (drawing.getContext){\n\n    var gl = drawing.getContext(\"\
  experimental-webgl\", { alpha: false});\n    if (gl){\n        //proceed with WebGL\n\
  \    }\n}\n```\n\nWebGLExample01.htm\n\n大多数上下文选项用于高级用法。在许多情况下，默认值就能满足你的需求。\n\n如果无法通过\
  \ `getContext()` 创建 WebGL 上下文，某些浏览器可能会出错误。因此，最好将调用封装在 `try-catch` 块中：\n\n```\nInsert\
  \ IconMargin [download]var drawing = document.getElementById(\"drawing\"),\n   \
  \ gl;\n\n//make sure <canvas> is completely supported\nif (drawing.getContext){\n\
  \    try {\n        gl = drawing.getContext(\"experimental-webgl\");\n    } catch\
  \ (ex) {\n        //noop\n    }\n\n    if (gl){\n        //proceed with WebGL\n\
  \    } else {\n        alert(\"WebGL context could not be created.\");\n    }\n\
  }\n```\n\nWebGLExample01.htm\n\n### 常量\n\n如果你熟悉 OpenGL，那么你就熟悉操作中使用的大量常量。这些常量在 OpenGL\
  \ 中带有 `GL_` 前缀命名。在 WebGL 中，每个常量都可以直接在 WebGL 上下文对象可用，没有 `GL_` 前缀。例如，`GL_COLOR_BUFFER_BIT`\
  \ 常量作为 `gl.COLOR_BUFFER_BIT` 使用。WebGL 以这种方式支持大多数 OpenGL 常量（某些常量不可用）。\n\n### 方法命名\n\
  \nOpenGL 中的许多方法名，在 Web 中也是如此，往往包含有关与方法一起的数据类型的信息。如果一个方法可以接受不同类型和数量的参数，则会带有后缀以指示预期输入。该方法将指示参数的数量（1\
  \ 到 4），后跟一个数据类型（`f` 表示浮点数，`i` 表示整数）。例如，`gl.uniform4f()` 期望传入四个浮点数，而 `gl.uniform3i()`\
  \ 期望传入三个整数。\n\n许多方法还允许传递数组而不是单个参数。这通过字母 `v` 表示，它是 vector（向量）的缩写。因此，`gl.uniform3iv()`\
  \ 接受一个包含三个值的整数数组。在整个 WebGL 的讨论过程中，请记住这一约定。\n\n### 准备绘图\n\n处理 WebGL 上下文的要步骤之一是用纯色清除\
  \ `<canvas>` 为绘图做准备。要做到这一点，你首先必须通过 `clearColor()` 方法指定要使用的颜色。该方法接受四个参数：红、绿、蓝和 alpha。每个参数必须是\
  \ 0 到 1 之间的数字，定义作为最终颜色部分的强度值。考虑以下示例：\n\n```\ngl.clearColor(0,0,0,1);    //black\n\
  gl.clear(gl.COLOR_BUFFER_BIT);\n```\n\nWebGLExample01.htm\n\n这段代码将清除颜色缓冲区值设置为黑色，然后调用\
  \ `clear()` 方法，这等同于 OpenGL 中的 `glClear()`。提供参数 `gl.COLOR_BUFFER_BIT` 告诉 WebGL 清除区域。\n\
  \n### 视口与坐标\n\n在开始 WebGL 上下文工作时，好主是定义视口（viewport）。默认情况下，视口设置为整个 `<canvas>`。要更改视口，调用\
  \ `viewport()` 方法并传入 `x`、`y`、`width` 和 `height`。例如，此调用使用了整个 `<canvas>`：\n\n```\n\
  gl.viewport(0, 0, drawing.width, drawing.height);\n```\n\n视口使用的是与网页页面不同的坐标系。x 坐标和\
  \ y 坐标从左下角的 `(0,0)` 开始，并向顶部和右侧增加，这可以定义为 `(-1,-1)`（见图 15-15）。\n\n图 15-15\n\n知道如何定义视口允许你使用\
  \ `<canvas>` 的部分进行绘图。考虑以下示例：\n\n```\n//视口是左下角的 canvas 的分之一\ngl.viewport(0, 0, drawing.width/2,\
  \ drawing.height/2);\n\n//视口是左上角的 canvas 的分之一\ngl.viewport(0, drawing.height/2,\
  \ drawing.width/2, drawing.height/2);\n\n//视口是右下角的 canvas 的分之一\ngl.viewport(drawing.width/2,\
  \ 0, drawing.width/2, drawing.height/2);\n```\n\n视口内部的坐标系与定义视口的坐标系不同。在视口内部，坐标从视口的中心\
  \ `(0,0)` 开始。左下角是 `(-1,-1)`，而右上角是 `(1,1)`（见图 15-16）。\n\n图 15-16\n\n如果在绘图操作中使用视口之外的坐标，则绘制将沿视口进行裁剪。例如，尝试绘制一个顶点在\
  \ `(1,2)` 的形状将导致该形状在视口右侧被截断。\n\n### 缓冲区\n\n顶点信息存储在 JavaScript 的类型数组中，并且必须转换为 WebGL\
  \ 缓冲区才能使用。缓冲区通过调用 `gl.createBuffer()` 创建，然后通过 `gl.bindBuffer()` 绑定到 WebGL 上下文。一旦发生这种情况，你就可以填充缓冲区数据。例如：\n\
  \n```\nvar buffer = gl.createBuffer();\ngl.bindBuffer(gl.ARRAY_BUFFER, buffer);\n\
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0.5, 1]), gl.STATIC_DRAW);\n\
  ```\n\n\n\n\n\n调用 `gl.bindBuffer()` 将 `buffer` 设置为该上下文的当前缓冲区。从那时起，所有的缓冲区操作将直接在 `buffer`\
  \ 上执行。因此，`gl.bufferData()` 的调用并不包含对 `buffer` 的直接引用，但仍然会对其进行操作。最后一行使用来自 `Float32Array`\
  \ 的信息初始化 `buffer`（你通常会使用 `Float32Array` 来处理所有顶点信息）。如果你打算使用 `drawElements()` 输出缓冲区内容，你也可以使用\
  \ `gl.ELEMENT_ARRAY_BUFFER`。\n\n`gl.bufferData()` 的最后一个参数指示了缓冲区将如何被使用。它是以下常量之一之一：\n\
  \n- `gl.STATIC_DRAW` — 数据将被加载一次，并用于绘制多次。\n- `gl.STREAM_DRAW` — 数据将被加载一次，仅用于绘制几次。\n\
  - `gl.DYNAMIC_DRAW` — 数据将被反复修改，并用于绘制多次。\n\n除非你是一个经验丰富的 OpenGL 程序员，否则你可能会对大多数缓冲区使用\
  \ `gl.STATIC_DRAW`。\n\n缓冲区会一直保存在内存中，直到包含它的页面被卸载。如果你不再需要某个缓冲区，最好通过调用 `gl.deleteBuffer()`\
  \ 来释放其内存：\n\n```\ngl.deleteBuffer(buffer);\n```\n\n### 错误\n\n大多数 JavaScript 与 WebGL\
  \ 之间的区别之一是，WebGL 操作通常不会抛出错误。相反，你必须在调用一个可能失败的方法后，调用 `gl.getError()` 方法。该方法返回一个常量值，指示发生的错误类型。常量如下：\n\
  \n- `gl.NO_ERROR` — 上次操作期间没有发生错误（值为 0）。\n- `gl.INVALID_ENUM` — 向期望其中一个 WebGL 常量的方法传递了错误的参数。\n\
  - `gl.INVALID_VALUE` — 在只接受无符号数的地方传递了负数。\n- `gl.INVALID_OPERATION` — 当前状态无法完成该操作。\n\
  - `gl.OUT_OF_MEMORY` — 没有足够的内存来完成操作。\n- `gl.CONTEXT_LOST_WEBGL` — 由于外部事件（如设备掉电）导致\
  \ WebGL 上上下文丢失。\n\n每次调用 `gl.getError()` 返回一个错误值。在初始调用之后，下一次调用 `gl.getError()` 可能会返回另一个错误值。如果存在多个错误，此过程将一直持续直到\
  \ `gl.getError()` 返回 `gl.NO_ERROR` 为止。如果你执行了多次操作，你可能想在循环中调用 `getError()`，例如：\n\n\
  ```\nvar errorCode = gl.getError();\nwhile(errorCode){\n    console.log(\"Error\
  \ occurred: \" + errorCode);\n    errorCode = gl.getError();\n}\n```\n\n如果你的 WebGL\
  \ 脚本没有产生正确的输出，那么在脚本中加入几次 `gl.getError()` 调用可能有助于调试问题。\n\n### 着色器\n\n着色器是 OpenGL\
  \ 的另一个概念。WebGL 中有两种着色器：顶点着色器和片元着色器。顶点着色器用于将 3D 顶点转换为渲染所需的 2D 点。片元着色器用于计算绘制单个像素的正确颜色。WebGL\
  \ 着色器独特且挑战性的方面在于它们不是用 JavaScript 编写的。着色器使用 OpenGL 着色语言 (GLSL) 编写，这是一种与 C 或 JavaScript\
  \ 完全不同的语言。\n\n#### 编写着色器\n\nGLSL 是一种类 C 语言，专门用于定义 OpenGL 着色器。由于 WebGL 是 OpenGL ES\
  \ 2 的实现，在 OpenGL 中使用的着色器可以直接用于 WebGL，从而可以将桌面图形轻松地移植到 Web 端。\n\n每个着色器都有一个名为 `main()`\
  \ 的方法，在绘制期间反复执行。将数据传递到着色器有两种方法：属性（attributes）和统一变量（uniforms）。属性用于将顶点传递给顶点着色器，而统一变量用于将常量传递给任何类型的着色器。属性和统一变量通过使用关键字\
  \ `attribute` 或 `uniform` 定义在 `main()` 之外。在值类型关键字之后，指定数据类型，然后跟上名称。这是一个简单的顶点着色器示例：\n\
  \n![image](img/logo1.gif)\n\n```\n//OpenGL Shading Language\n//Shader by Bartek\
  \ Drozdz in his article at\n//http://www.netmagazine.com/tutorials/get-started-webgl-draw-square\n\
  attribute vec2 aVertexPosition;\n\nvoid main() {\n        gl_Position = vec4(aVertexPosition,\
  \ 0.0, 1.0);\n}\n```\n\nWebGLExample02.htm\n\n此顶点着色器定义了一个名为 `aVertexPosition` 的单一属性。该属性是一个包含两个项目的数组（`vec2`\
  \ 数据类型），代表 x 坐标和 y 坐标。顶点着色器必须始终导致一个四部分的顶点被赋值给特殊变量 `gl_Position`，即使只传递了两个坐标。此着色器创建了一个新的四项数组（`vec4`）并填充了缺失的坐标，有效地将\
  \ 2D 坐标转换为 3D 坐标。\n\n片元着色器与顶点着色器类似，但你只能通过统一变量传递数据。这里是一个片元着色器的示例：\n\n```\n//OpenGL\
  \ Shading Language\n//Shader by Bartek Drozdz in his article at\n//http://www.netmagazine.com/tutorials/get-started-webgl-draw-square\n\
  uniform vec4 uColor;\n\nvoid main() {\n        gl_FragColor = uColor;\n}\n```\n\n\
  WebGLExample02.htm\n\n片元着色器的结果是将值赋值给 `gl_FragColor`，这指示了绘制时使用的颜色。该着色器定义了一个名为 `uColor`\
  \ 的四部分 (`vec4`) 颜色。\n\n![image](img/pen.gif)\n\n#### 创建着色器程序\n\nGLSL 无法被浏览器原生理解，因此你必须准备好用于编译和链接到着色程序的字符串。为了方便使用，着色器通常使用自定义类型的\
  \ `<script>` 元素包含在页面中。使用类型属性防止浏览器尝试解释 `<script>` 内容，同时允许方便访问。例如：\n\n![image](img/logo1.gif)\n\
  \n```\n<script type=\"x-webgl/x-vertex-shader\" id=\"vertexShader\">\nattribute\
  \ vec2 aVertexPosition;\n\nvoid main() {\n        gl_Position = vec4(aVertexPosition,\
  \ 0.0, 1.0);\n}\n</script>\n<script type=\"x-webgl/x-fragment-shader\" id=\"fragmentShader\"\
  >\nuniform vec4 uColor;\n\nvoid main() {\n        gl_FragColor = uColor;\n}\n</script>\n\
  ```\n\nWebGLExample02.htm\n\n你可以通过 `text` 属性提取 `<script>` 元素的内容：\n\n```\nvar vertexGlsl\
  \ = document.getElementById(\"vertexShader\").text,\n    fragmentGlsl = document.getElementById(\"\
  fragmentShader\").text;\n```\n\n更复杂的 WebGL 可能会选择使用 Ajax 动态下载着色器（第 21 章讨论）。关键在于你需要一个\
  \ GLSL 字符串来使用着色器。\n\n一旦有了 GLSL 字符串，下一步是创建着色器对象。这是通过调用 `gl.createShader()` 方法并传入要创建的着色器类型（`gl.VERTEX_SHADER`\
  \ 或 `gl.FRAGMENT_SHADER`）完成的。之后，使用 `gl.shaderSource()` 应用着色器源码并使用 `gl.compileShader()`\
  \ 编译着色器。示例如下：\n\n```\nvar vertexShader = gl.createShader(gl.VERTEX_SHADER);\ngl.shaderSource(vertexShader,\
  \ vertexGlsl);\ngl.compileShader(vertexShader);\n\nvar fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);\n\
  gl.shaderSource(fragmentShader, fragmentGlsl);\ngl.compileShader(fragmentShader);\n\
  ```\n\nWebGLExample02.htm\n\n此代码创建了两个着色器并将存储在 `vertexShader` 和 `fragmentShader`\
  \ 中。然后可以使用以下代码将这两个对象链接到着色器程序中：\n\n\n\n\n\n```\nvar program = gl.createProgram();\n\
  gl.attachShader(program, vertexShader);\ngl.attachShader(program, fragmentShader);\n\
  gl.linkProgram(program);\n```\n\n### WebGLExample02.htm\n\n第一行创建一个程序，然后使用 `attachShader()`\
  \ 包含两个着色器。调用 `gl.linkProgram()` 将两个着色器一起封装到变量 `program` 中。程序链接完成后，你可以通过 `gl.useProgram()`\
  \ 方法指示 WebGL 上下文使用该程序：\n\n```\ngl.useProgram(program);\n```\n\n在调用 `gl.useProgram()`\
  \ 后，所有的后续绘制操作都将使用指定的程序。\n\n## 向着色器传递值\n\n之前定义的每个着色器都有一个必须传入的值以完成着色器的工作。要将值传递到着色器，你必须先找到需要填充值的变量。对于均匀变量（uniform\
  \ variables），这是通过 `gl.getUniformLocation()` 完成的，它返回一个表示均匀变量在内存中位置的对象。然后你可以使用该位置来分配数据。例如：\n\
  \n![image](img/logo1.gif)\n\n```\nvar uColor = gl.getUniformLocation(program, \"\
  uColor\");\ngl.uniform4fv(uColor, [0, 0, 0, 1]);\n```\n\n### WebGLExample02.htm\n\
  \n此示例在 `program` 中定位均匀变量 `uColor` 并返回其内存位置。第二行使用 `gl.uniform4fv()` 将一个值赋值给 `uColor`。\n\
  \n顶点着色器中的属性变量（attribute variables）也遵循类似的过程。要获取属性变量的位置，使用 `gl.getAttribLocation()`。一旦获取了位置，就可以像示例这样使用：\n\
  \n```\nvar aVertexPosition = gl.getAttribLocation(program, \"aVertexPosition\");\n\
  gl.enableVertexAttribArray(aVertexPosition);\ngl.vertexAttribPointer(aVertexPosition,\
  \ itemSize, gl.FLOAT, false, 0, 0);\n```\n\n### WebGLExample02.htm\n\n在这里，获取了 `aVertexPosition`\
  \ 的位置，以便通过 `gl.enableVertexAttribArray()` 启用其使用。最后一行为使用 `gl.bindBuffer()` 指定最后一个缓冲区创建了一个指针，并将其存储在\
  \ `aVertexPosition` 中，以便顶点着色器可以使用。\n\n## 调试着色器和程序\n\n与 WebGL 中的其他操作一样，着色器操作可能会失败且会静默失败。如果你认为发生了错误，需要手动向\
  \ WebGL 上下文查询着色器或程序的信息。\n\n对于着色器，在尝试编译后调用 `gl.getShaderParameter()` 来获取着色器的编译状态：\n\
  \n![image](img/logo1.gif)\n\n```\nif (!gl.getShaderParameter(vertexShader, gl.COMPILE_STATUS)){\n\
  \    alert(gl.getShaderInfoLog(vertexShader));\n}\n```\n\n### WebGLExample02.htm\n\
  \n此示例检查 `vertexShader` 的编译状态。如果着色器编译成功，则调用 `gl.getShaderParameter()` 返回 true。如果调用返回\
  \ false，则在编译期间发生了错误，你可以使用 `gl.getShaderInfoLog()` 并传入着色器来获取错误。该方法返回一个指示问题的字符串消息。`gl.getShaderParameter()`\
  \ 和 `gl.getShaderInfoLog()` 都可以用于顶点着色器和片段着色器。\n\n程序也可能失败，并有一个类似的方法 `gl.getProgramParameter()`\
  \ 来检查状态。最常见的程序失败发生在链接过程中，你可以使用以下代码进行检查：\n\n```\nif (!gl.getProgramParameter(program,\
  \ gl.LINK_STATUS)){\n    alert(gl.getProgramInfoLog(program));\n}\n```\n\n### WebGLExample02.htm\n\
  \n与 `gl.getShaderParameter()` 一样，`gl.getProgramParameter()` 返回 true（表示链接成功）或 false（表示失败）。还有\
  \ `gl.getProgramInfoLog()`，它用于在失败期间获取有关程序的信息。\n\n这些方法主要用于开发期间以辅助调试。只要没有外部依赖，在生产环境中移除它们是安全的。\n\
  \n## 绘制\n\nWebGL 只能绘制三种形状：点、线和三角形。所有其他形状都必须通过在三维空间中绘制的这三种基本形状组合而成。绘制通过使用 `drawArrays()`\
  \ 或 `drawElements()` 方法执行；前者作用数组缓冲区（array buffers），后者作用于元素数组缓冲区（element array buffers）。\n\
  \n`gl.drawArrays()` 和 `drawElements()` 的第一个参数都是指示要绘制形状类型的常量。常量如下：\n\n* `gl.POINTS`\
  \ — 将每个顶点视为要绘制的单个点。\n* `gl.LINES` — 将数组视为一系列顶点，在顶点之间绘制线。每组顶点是一个起点点和一个终点，因此数组中的顶点数必须是偶数才能完成所有绘制。\n\
  * `gl.LINE_LOOP` — 将数组视为一系列顶点，在顶点之间绘制线。线从第一个顶点画到第二个，从第二个画到第三个，以此此类推，直到到达最后一个顶点。然后从最后一个顶点画到第一个顶点画一条线。这在实际上创建了一个形状的轮廓。\n\
  * `gl.LINE_STRIP` — 与 `gl.LINE_LOOP` 相同，但不会从最后一个顶点返回到第一个顶点画线。\n* `gl.TRIANGLES`\
  \ — 将数组视为一系列顶点，在其中绘制三角形。每个三角形都是独立绘制的，除非显式指定共享顶点。\n* `gl.TRIANGLES_STRIP` — 与 `gl.TRIANGLES`\
  \ 相同，但前三个顶点之后的顶点被视为第一个顶点。\n\n`gl.drawArrays()` 方法接受这些值之一作为第一个参数，数组缓冲区中的起始索引作为第二个参数，数组中包含的集合数量作为第三个参数。以下代码使用\
  \ `drawArrays()` 绘制一个三角形：\n\n![image](img/logo1.gif)\n\n```\n//假设视口已使用着色器清除\nvar\
  \ vertices = new Float32Array([ 0, 1, 1, -1, -1, -1 ]),\n    buffer = gl.createBuffer(),\n\
  \    vertexSetSize = 2,\n    vertexSetCount = vertices.length/vertexSetSize,\n \
  \   uColor, aVertexPosition;\n\n//将数据放入缓冲区\ngl.bindBuffer(gl.ARRAY_BUFFER, buffer);\n\
  gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);\n\n//将颜色传递给片段着色器\nuColor\
  \ = gl.getUniformLocation(program, \"uColor\");\ngl.uniform4fv(uColor, [ 0, 0, 0,\
  \ 1 ]);\n\n//将顶点信息传递给着色器\naVertexPosition = gl.getAttribLocation(program, \"aVertexPosition\"\
  );\ngl.enableVertexAttribArray(aVertexPosition);\ngl.vertexAttribPointer(aVertexPosition,\
  \ vertexSetSize, gl.FLOAT, false, 0, 0);\n\n//绘制三角形\ngl.drawArrays(gl.TRIANGLES,\
  \ 0, vertexSetCount);\n```\n\n### WebGLExample02.htm\n\n此示例定义了一个包含三组双点顶点的 `Float32Array`。跟踪大小和顶点集合数量以便后续计算是非常重要的。`vertexSetSize`\
  \ 设置为 2，而 `vertexSetCount` 通过计算得出。\n\n\n\n\n\n最后一步是使用 `gl.drawArrays()` 绘制三角形。通过将第一个参数指定为\
  \ `gl.TRIANGLES`，将绘制从 (0,1) 到 (1,–1) 再到 (–1,–1) 的三角形，并用传递给片段着器的颜色进行填充。第二个参数是缓冲区中的起始偏移，最后一个参数是要读取的顶点集总数。此绘制操作的结果显示在图\
  \ 15-17 中。\n\n图 15-17\n\n![image](img/f586-01.jpg)\n\n通过更改 `gl.drawArrays()` 的第一个参数，你可以改变三角形的绘制方式。图\
  \ 15-18 显示了更改第一个参数后其他可能的输出。\n\n图 15-18\n\n![image](img/f586-02.jpg)\n\n## 纹理\n\n\
  WebGL 纹理与 DOM 中的图像协同工作。你使用 `gl.createTexture()` 创建新纹理，然后将图像绑定到该纹理上。如果图像尚未加载，则你可能创建一个\
  \ `Image` 的新实例来动态加载它。在图像完全加载之前，纹理不会被初始化，因此纹理设置步骤必须在加载事件触发后完成。例如：\n\n```\nvar image\
  \ = new Image(),\n    texture;\nimage.src = \"smile.gif\";\nimage.onload = function(){\n\
  \    texture = gl.createTexture();\n    gl.bindTexture(gl.TEXTURE_2D, texture);\n\
  \    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);\n\n    gl.texImage2D(gl.TEXTURE_2D,\
  \ 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);\n    gl.texParameteri(gl.TEXTURE_2D,\
  \ gl.TEXTURE_MAG_FILTER, gl.NEAREST);\n    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER,\
  \ gl.NEAREST);\n\n    //clear current texture\n    gl.bindTexture(gl.TEXTURE_2D,\
  \ null);\n}\n```\n\n除了使用 DOM 图像外，在 OpenGL 中创建纹理的步骤是相同的。最大的区别在于使用 `gl.pixel-storei()`\
  \ 设置像素存储格式。常量 `gl.UNPACK_FLIP_Y_WEBGL` 是 WebGL 特有的，在加载基于 Web 的图像时，大多数情况下必须使用。这是因为\
  \ GIF、JPEG 和 PNG 图像使用的坐标系与 WebGL 内部坐标系不同。如果没有此标志，图像将被倒置解释。\n\n用于纹理的图像必须与包含页面同源，否则必须存在于启用了跨源资源共享\
  \ (CORS) 的图像服务器上。CORS 在第 21 章中讨论。\n\n![image](img/pen.gif)\n\n纹理源可以是图像、加载到 `<video>`\
  \ 元素中的视频，甚至是另一个 `<canvas>` 元素。关于跨源资源的限制也适用于视频。\n\n## 读取像素\n\n与 2D 上文一样，可以从 WebGL\
  \ 上文中读取像素。`readPixels()` 方法的参数与 OpenGL 中的相同，不同之处最后一个参数必须是一个类型数组。像素信息从帧缓冲区读取并存放在类型数组中。`readPixels()`\
  \ 的参数为 `x`、`y`、`width`、`height`、图像格式、`type` 和类型数组。前四个参数指定了要读取像素的位置。图像格式参数几乎总是 `gl.RGBA`。`type`\
  \ 参数是要存储在类型数组中的数据类型，并具有以下限制：\n\n*   如果 `type` 为 `gl.UNSIGNED_BYTE`，则类型数组必须是 `Uint8Array`。\n\
  *   如果 `type` 为 `gl.UNSIGNED_SHORT_5_6_5`、`gl.UNSIGNED_SHORT_4_4_4_4` 或 `gl.UNSIGNED_SHORT_5_5_5_1`，则类型数组必须是\
  \ `Uint16Array`。\n\n这是一个简单的示例：\n\n```\nvar pixels = new Uint8Array(25*25);\ngl.readPixels(0,\
  \ 0, 25, 25, gl.RGBA, gl.UNSIGNED_BYTE, pixels);\n```\n\n这段代码读取帧缓冲器的 25 × 25 区域，并将像素信息存储在\
  \ `pixels` 数组中。每个像素颜色表示为四个数组项，分别对应红、绿、蓝和 alpha 通道。值是 0 到 255 之间的整数。不要忘记根据预期的返回数据量初始化类型数组。\n\
  \n在浏览器绘制更新后的 WebGL 图像之前调用 `readPixels()` 将按预期工作。在绘制操作发生后，帧缓冲区将恢复到原始的清除状态，此时调用 `readPixels()`\
  \ 将得到与清除状态匹配的像素数据。如果你想在绘制后读取像素，则必须使用之前讨论过的 `preserveDrawingBuffer` 选项初始化 WebGL 上文：\n\
  \n```\nvar gl = drawing.getContext(\"experimental-webgl\", { preserveDrawingBuffer:\
  \ true; });\n```\n\n设置此标志会强制帧缓冲区保持在最后一种状态，直到下一次绘制发生。该选项确实产生一些性能开销，因此尽量避免使用。\n\n\
  ## 支持\n\nWebGL API 已经在 Firefox 4+ 和 Chrome 中实现。Safari 5.1 已经实现了 WebGL，但默认禁用了它。Web\
  \ 的独特之处在于，拥有特定的浏览器版本并不意味着获得支持。浏览器要支持 WebGL 必须满足两个条件：首先，浏览器本身必须具备该 API。其次，计算机必须拥有更新过的显卡。旧计算机（例如运行\
  \ Windows XP 的计算机）通常具有过时的驱动程序，因此 WebGL 在浏览器中会被禁用。因此，专门检查对 WebGL 的支持情况比检查特定的浏览器版本更为重要。\n\
  \n\n\n\n\nXDM 的核心是 `postMessage()` 方法。该方法名除了 XDM 之外，还用于 HTML5 的许多部分，且始终用于同一个目的：将数据传递到另一个位置。在\
  \ XDM 的情况下，该另一个位置是页面拥有的 `<iframe>` 元素或弹出窗口。\n\n`postMessage()` 方法接受两个参数：一条消息（message）和一个指示预期接收方源的字符串（origin）。出于安全考虑，第二个参数非常重要，它限制了浏览器传递消息的位置。考虑以下示例：\n\
  \n```\n//note: 所有支持 XDM 的浏览器也支持 iframe contentWindow \nvar iframeWindow = document.getElementById(\"\
  myframe\").contentWindow;\niframeWindow.postMessage(\"A secret\", \"http://www.wrox.com\"\
  );\n```\n\n最后一行尝试向 iframe 发送消息，并指定源必须是 `http://www.wrox.com`。如果源匹配，则消息将投递到 iframe\
  \ 中；否则 `postMessage()` 将静默地什么都不做。这种限制保护了你的信息，防止在窗口位置在你不不知情的情况下发生变化导致信息泄露。通过向 `postMessage()`\
  \ 的第二个参数传递 `*` 可以允许向任何源发送消息，但这并不被推荐。\n\n当接收到 XDM 消息时，窗口会触发消息事件（message event）。该消息是异步触发的，因此发送消息的时间与接收窗口触发消息事件的时间之间存在延迟。传递给\
  \ `onmessage` 事件处理程序的事件对象包含三个重要信息：\n\n* `data` — 作为第一个参数传递给 `postMessage()` 的字符串类型数据。\n\
  * `origin` — 发送消息的文档的源，例如 `http://www.wrox.com`。\n* `source` — 发送消息文档窗口对象的代理。该代理对象主要用于在发送最后一条消息的窗口上执行\
  \ `postMessage()` 方法。如果发送窗口具有相同的源，则这可能是实际的窗口对象。\n\n接收消息时，验证发送窗口的源（origin）是非常重要的。正如通过指定\
  \ `postMessage()` 的第二个参数来确保数据不会无意中传递给未知页面一样，在 `onmessage` 期间检查源可以确保正在传递的数据源自正确的地方。基本模式如下：\n\
  \n```\nEventUtil.addHandler(window, \"message\", function(event){\n\n    //确保发送者是预期的\n\
  \    if (event.origin == \"http://www.wrox.com\"){\n\n        //对数据进行处理\n      \
  \  processMessage(event.data);\n\n        //可选：向原始窗口发送回消息\n        event.source.postMessage(\"\
  Received!\", \"http://p2p.wrox.com\");\n    }\n});\n```\n\n请记住，在大多数情况下 `event.source`\
  \ 是窗口的代理，而不是实际的窗口对象，因此你无法访问所有的窗口信息。最好的做法是直接使用 `postMessage()`，它是始终存在且始终可调用的。\n\n\
  XDM 有一些怪异。首先，`postMessage()` 的第一个参数最初被实现为始终是字符串。该第一个参数的定义已更改，允许传递任何结构化数据；然而，并不是所有的浏览器都实现了这一更改。出于此原因，最好始终使用\
  \ `postMessage()` 传递字符串。如果你需要传递结构化数据，最佳方法是对数据调用 `JSON.stringify()`，将生成的字符串传递给 `postMessage()`，然后在\
  \ `onmessage` 事件处理程序中调用 `JSON.parse()`。\n\n当尝试使用不同域的 `iframe` 对内容进行沙箱化时，XDM 非常有用。这种方法经常用于杂烩（mashups）和社交网络应用程序。包含页面能够仅通过\
  \ XDM 与嵌入的 iframe 通信，从而保护自己不受恶意内容的侵害。XDM 也可以用于同域的页面。\n\nInternet Explorer 8+、Firefox\
  \ 3.5+、Safari 4+、Opera、Chrome、iOS  Safari 和 Android  WebKit 都支持 XDM。XDM 已分离成自己的规范，现在被称为\
  \ Web Messaging，可以在 `http://dev.w3.org/html5/postmsg/` 找到。\n\n# 原生拖放\n\nInternet\
  \ Explorer 4 首次引入了对网页拖放功能的 JavaScript 支持。当时，网页上只有两个项目可以启动系统拖放：图像或某些文本。在拖拽图像时，你只需按住鼠标按钮然后移动它；对于文本，你首先高亮一些文本，然后就可以像拖拽图像一样拖拽它。在\
  \ Internet Explorer 4 中，唯一的有效投放目标是文本框。在第 5 版本中，Internet Explorer 通过添加新事件扩展了其拖放能力，并允许网页上的几乎任何元素成为投放目标。5.5\
  \ 版本更进了一步，允许几乎任何元素都变得可拖拽。（Internet Explorer 6 也支持此功能）。HTML5 使用 Internet Explorer\
  \ 的拖放实现作为其拖放规范的依据。Firefox 3.5、Safari 3+ 和 Chrome 也根据 HTML5 规范实现了原生拖放。\n\n也许拖放支持最有趣的一点是，元素可以跨框架、浏览器窗口，有时甚至是跨应用程序进行拖拽。浏览器中的拖放支持允许你利用该功能。\n\
  \n## 拖放事件\n\n为拖放提供的事件允许你控制拖放操作的几乎每一个方面。棘之处在于确定每个事件在何处触发：某些事件在被拖拽的项目上触发；另一些在投放目标上触发。当项目被拖拽时，按以下顺序触发事件：\n\
  \n1. `dragstart`\n2. `drag`\n3. `dragend`\n\n当你按住鼠标按钮并开始移动时，`dragstart` 事件在被拖拽的元素上触发。光标变为不可投放符号（带斜线的圆），表示该项目无法投放到自身。你可以使用\
  \ `ondragstart` 事件处理器在拖拽开始时运行 JavaScript 代码。\n\n在 `dragstart` 事件触发后，`drag` 事件被触发，只要对象仍在被拖拽，它就会持续触发。这与\
  \ `mousemove` 类似，后者在鼠标移动时也会反复触发。当拖拽停止（因为你将项目投放到有效或无效的投放目标）时，触发 `dragend` 事件。\n\n\
  这三个事件的目标都是被拖拽的元素。默认情况下，浏览器在拖放期间不会更改被拖拽元素的外观，因此由你来更改外观。然而，大多数浏览器会创建一个拖拽元素的半透明克隆，该副本始终位于光标下方。\n\
  \n当项目拖到有效投放目标上方时，会发生以下事件序列：\n\n1. `dragenter`\n2. `dragover`\n3. `dragleave` 或 `drop`\n\
  \n`dragenter` 事件（类似于 `mouseover` 事件）在项目拖过投放目标时立即触发。在 `dragenter` 事件触发后，`dragover`\
  \ 事件被触发，只要项目在投放目标的边界内拖拽，它就会持续触发。当项目拖到投放目标之外时，`dragover` 停止触发并触发 `dragleave` 事件。如果拖拽的项目实际上被放置在目标上，则触发\
  \ `drop` 事件而不是 `dragleave`。\n\n\n\n\n\n当你尝试将某些内容拖动到无效的放置目标时，你会看到一个特殊的光标（一个带斜线的圆圈），表示你无法放置。尽管所有元素都支持放置事件（drop\
  \ target events），但默认是不允许放置的。如果你将一个元素拖动到不允许放置的地方，无论用户如何操作，放置事件（drop event）永远不会触发。然而，你可以通过重写\
  \ `dragenter` 和 `dragover` 事件的默认行为，将任何元素转换为有效的放置目标。例如，如果你有一个 ID 为 \"droptarget\"\
  \ 的 `<div>` 元素，可以使用以下代码将其转换为放置目标：\n\n```\nvar droptarget = document.getElementById(\"\
  droptarget\");\n\nEventUtil.addHandler(droptarget, \"dragover\", function(event){\n\
  \    EventUtil.preventDefault(event);\n});\n\nEventUtil.addHandler(droptarget, \"\
  dragenter\", function(event){\n    EventUtil.preventDefault(event);\n});\n```\n\n\
  在做出这些更改后，你会发现，当拖动元素时，光标现在表示可以在放置目标上进行放置。此外，放置事件将会触发。\n\n在 Firefox 3.5+ 中，放置事件的默认行为是导航到放置在目标上的\
  \ URL。这意味着将图像放置到放置目标上将导致页面导航到图像文件，而放置在目标上的文本则会导致无效的 URL 错误。为了支持 Firefox，你还必须取消放置事件的默认行为，以防止这种导航发生：\n\
  \n```\nEventUtil.addHandler(droptarget, \"drop\", function(event){\n    EventUtil.preventDefault(event);\n\
  });\n```\n\n### dataTransfer 对象\n\n除非数据实际上受了影响，否则简单的拖放是没有任何用处的。为了帮助通过拖放操作传输数据，Internet\
  \ Explorer 5 引入了 `dataTransfer` 对象，它作为 `event` 的属性存在，并用于将字符串数据从被拖动的项目传输到放置目标。由于它是\
  \ `event` 的属性，因此在拖放事件的事件处理程序作用范围之外，否则，`dataTransfer` 对象是不存在的`。在事件处理程序中，你可以使用该对象的属性和方法来处理你的拖放功能。`dataTransfer`\
  \ 对象现在是 HTML5 工作草案的一部分。\n\n`datadataTransfer` 对象有两个主要方法：`getData()` 和 `setData()`。正如你预期的那样，`getData()`\
  \ 能够检索由 `setData()` 存储的值。`setData()` 的第一个参数以及 `getData()` 的唯一参数是一个表示正在设置的数据类型的字符串：要么是\
  \ \"text\"，要么是 \"URL\"，所示：\n\n```\n//处理文本\nevent.dataTransfer.setData(\"text\",\
  \ \"some text\");\nvar text = event.dataTransfer.getData(\"text\");\n\n//处理 URL\n\
  event.dataTransfer.setData(\"URL\", \"http://www.wrox.com/\");\nvar url = event.dataTransfer.getData(\"\
  URL\");\n```\n\n尽管 Internet Explorer 起初只引入了 \"text\" 和 \"URL\" 作为有效数据类型，但 HTML5\
  \ 扩展了这一点，允许指定任何 MIME 类型。为了向后兼容，HTML5 将支持 \"text\" 和 \"URL\"，但它们被映射到 \"text/plain\"\
  \ 和 \"text/uri-list\"。\n\n`dataTransfer` 对象可以恰好包含每种 MIME 类型恰好一个值，这意味着你可以同时存储文本和\
  \ URL，而不会覆盖其中任何一个。存储在 `dataTransfer` 对象中的数据仅可用到放置事件发生为止。如果你没有在 `ondrop` 事件处理程序中检索数据，`dataTransfer`\
  \ 对象将被销毁，数据也将丢失。\n\n当你从文本框中拖动文本时，浏览器会调用 `setData()` 并将拖动的文本存储为 \"text\" 格式。同样，当拖动链接或图像时，会调用\
  \ `setData()` 并存储 URL。当数据被放置在目标上时，可以使用 `getData()` 检索这些值。你还可以在 `dragstart` 事件期间手动调用\
  \ `setData()`，以存储你以后可能想要检索的自定义数据。\n\n被视为文本的数据与被视为 URL 的数据之间存在区别。当你指定将数据存储为文本时，它完全没有受到任何特殊处理。然而，当你指定将数据存储为\
  \ URL 时，它的处理方式就像网页上的链接一样，这意味着如果你将其放置到另一个浏览器窗口，浏览器将导航到该 URL。\n\n版本 5 之前的 Firefox\
  \ 没有正确地将 \"url\" 别名为 \"text/uri-list\" 或将 \"text\" 别名为 \"text/plain\"。然而，它确实将 \"\
  Text\"（大写 T）别名为 \"text/plain\"。为了确保从 `dataTransfer` 获取数据具有最佳的跨浏览器兼容性，你需要对 URL 检查两个值，并对纯文本使用\
  \ \"Text\"：\n\n![image](img/logo1.gif)\n\n```\nvar dataTransfer = event.dataTransfer;\n\
  \n//读取 URL\nvar url = dataTransfer.getData(\"url\") ||dataTransfer.getData(\"text/uri-list\"\
  );\n\n//读取文本\nvar text = dataTransfer.getData(\"Text\");\n```\n\nDataTransferExample01.htm\n\
  \n先尝试简短的数据名称是重要的，因为直到版本 10 的 Internet Explorer 都不支持扩展名称，并且当数据名称未被识别时会抛出错误。\n\n###\
  \ dropEffect 和 effectAllowed\n\n`dataTransfer` 对象不仅可以简单地往返传输数据；它还可以用于确定对拖动项目可以执行哪些类型的操作。通过使用两个属性：`dropEffect`\
  \ 和 `effectAllowed` 来实现这一点。`dropEffect` 属性用于告诉浏览器允许哪些类型的放置行为。该属性具有以下可能值：\n\n- \"\
  none\": 不能在此放置。这是除文本框以外的所有内容的默认值。\n- \"move\": 拖动项目应移动到放置目标。\n- \"copy\": 拖动项目应复制到放置目标。\n\
  - \"link\": 表示放置目标将导航到拖动项目（但仅当它是 URL 时）。\n\n这些值中的每一个都会在项目拖过放置目标时显示不同的光标。然而，实际引起光标所示指示的操作取决于你。也就是说，如果没有你的干预，没有任何内容会自动移动、复制或链接。你免费获得的是光标的变化。为了使用\
  \ `dropEffect` 属性，你必须在放置目标的 `dragenter` 事件处理程序中设置它。\n\n除非你也设置了 `effectAllowed`，否则\
  \ `dropEffect` 属性是没用的。该属性指示拖动项目的 `dropEffect`。可能的值如下：\n\n- \"uninitialized\": 未为拖动项目设置操作。\n\
  - \"none\": 不允许对拖动项目进行操作。\n- \"copy\": 仅允许 `dropEffect` \"copy\"。\n- \"link\": 仅允许\
  \ `dropEffect` \"link\"。\n- \"move\": 仅允许 `dropEffect` \"move\"。\n- \"copyLink\"\
  : 允许 `dropEffect` \"copy\" 和 \"link\"。\n- \"copyMove\": 允许 `dropEffect` \"copy\"\
  \ 和 \"move\"。\n- \"linkMove\": 允许 `dropEffect` \"link\" 和 \"move\"。\n- \"all\":\
  \ 允许所有的 `dropEffect` 值。\n\n此属性必须在 `dragstart` 事件处理程序内部设置。\n\n假设你想允许用户将文本从文本框移动到\
  \ `<div>` 中。要实现这一点，你必须将 `dropEffect` 和 `effectAllowed` 都设置为 \"move\"。文本不会自动移动，因为\
  \ `<div>` 上放置事件的默认行为是什么都不做。如果你重写了默认行为，文本会自动从文本框中移除。然后由你将其插入 `<div>` 中以完成操作。如果你将\
  \ `dropEffect` 和 `effectAllowed` 改为 \"copy\"，文本框中的文本将不会自动移除。\n\n![image](img/pen.gif)\n\
  \n版本 5 之前的 Firefox 在 `effectAllowed` 上存在一个问题，当在代码中设置此值时，放置事件可能不会触发。\n\n\n\n\n\n\
  默认情况下，图像、链接和文本都是可拖拽的，这意味着不需要额外的代码即可允许用户开始拖拽它们。文本只有在部分被高亮后才可以拖拽，而图像和链接可以在任何时间进行拖拽。\n\
  \n可以将其他元素也设置为可拖拽。HTML5 在所有 HTML 元素上指定了 `draggable` 属性，用于指示该元素是否可以被拖拽。图像和链接的 `draggable`\
  \ 属性自动设置为 `true`，而其他所有内容的默认值为 `false`。可以通过设置此属性来允许其他元素可拖拽，或确保图像或链接不可被拖拽。例如：\n\n\
  ```\n<!-- 关闭此图像的拖拽 -->\n<img src=\"smile.gif\" draggable=\"false\" alt=\"Smiley\
  \ face\">\n\n<!-- 开启此元素的拖拽 -->\n<div draggable=\"true\">...</div></div>\n```\n\n\
  `draggable` 属性支持 Internet Explorer 10+、Firefox 4+、Safari 5+ 和 Chrome。Opera 从 11.5\
  \ 版本开始不支持 HTML5 拖放。为了让 Firefox 启动拖拽，你还添加一个 `ondragstart` 事件处理器，在 `dataTransfer`\
  \ 对象上设置一些信息。\n\n![image](img/pen.gif)\n\nInternet Explorer 9 及早期版本允许你在 `mousedown`\
  \ 事件期间通过调用 `dragDrop()` 方法来使任何元素变为可拖拽。Safari 4 及早期版本则需要添加 CSS 样式 -`khtml-user-drag:\
  \ element` 来使元素变为可拖拽。\n\n## 附加成员\n\nHTML5 规范在 `dataTransfer` 对象上指定了以下附加方法：\n\n*\
  \   `addElement(element)` — 向拖拽操作中添加一个元素。这纯用于数据目的，不会影响拖拽操作的外观。截至本文编写时，还没有浏览器实现此方法。\n\
  *   `clearData(format)` — 清除使用特定格式存储的数据。这已在 Internet Explorer、Firefox 3.5+、Chrome\
  \ 和 Safari 4+ 中实现。\n*   `setDragImage(element, x, y)` — 允许你在拖拽发生时指定一个在光标下方显示的图像。该方法接受三个参数：一个要显示的\
  \ HTML 元素，以及图像上光标应该放置的 `x` 和 `y` 坐标。该 HTML 元素可以是图像（在这种情况下显示图像），也可以任何其他元素（在这种情况下显示该元素的渲染图）。Firefox\
  \ 3.5+、Safari 4+ 和 Chrome 均支持此方法。\n*   `types` — 当前正在存储的数据类型列表。该集合像数组一样，并将数据类型存储为如\
  \ `\"text\"` 之类的字符串。Internet Explorer 10+、Firefox 3.5+ 和 Chrome 实现此属性。\n\n## 媒体元素\n\
  \n随着嵌入式音频和视频在 Web 上爆炸式的流行，大多数内容生产者被迫使用 Flash 以获得最佳的跨浏览器兼容性。HTML5 引入了两个媒体相关的元素，以便在无需任何插件的情况下实现跨浏览音频和视频嵌入：`<audio>`\
  \ 和 `<video>`。\n\n这两个元素都允许 Web 开发人员轻松地将媒体文件嵌入页面中，并为常用功能提供 JavaScript 钩子，从而为媒体创建自定义控件。这些元素的使用如下：\n\
  \n```\n<!-- 嵌入视频 -->\n<video src=\"conference.mpg\" id=\"myVideo\">视频播放器不可。</video>\n\
  \n<!-- 嵌入音频文件 -->\n<audio src=\"song.mp3\" id=\"myAudio\">音频播放器不可。</audio>\n```\n\
  \n这些元素中的每个元素至少都需要 `src` 属性来指示要加载的媒体文件。你还可以指定 `width` 和 `height` 属性来指示视频播放器的预期尺寸，以及一个\
  \ `poster` 属性，它是在视频内容加载期间显示的图像 URI。如果存在 `controls` 属性，则浏览器应该显示一个允许用户直接与媒体交互的 UI。起始标签和结束标签之间的任何内容都被视为在媒体播放器不可用时显示的替代内容。\n\
  \n你可以选择性指定多个不同的媒体源，因为并非所有浏览器都支持所有的格式。要这样做，请省略元素中的 `src` 属性，取而包含一个或多个 `<source>`\
  \ 元素，例如所示：\n\n```\n<!-- 嵌入视频 -->\n<video id=\"myVideo\">\n  <source src=\"conference.webm\"\
  \ type=\"video/webm; codecs='vp8, vorbis'\">\n  <source src=\"conference.ogv\" type=\"\
  video/ogg; codecs='theora, vorbis'\">\n  <source src=\"conference.mpg\">\n  视频播放器不可。\n\
  </video>\n\n<!-- 嵌入音频文件 -->\n<audio id=\"myAudio\">\n  <source src=\"song.ogg\"\
  \ type=\"audio/ogg\">\n  <source src=\"song.mp3\" type=\"audio/mpeg\">\n  音频播放器不可。\n\
  </audio>\n```\n\n讨论用于视频和音频的各种编码器超本书的范围，但只需说明浏览器支持的编码器范围不同，因此通常需要多个源文件。媒体元素支持 Internet\
  \ Explorer 9+、Firefox 3.5+、Safari 4+、Opera 10.5+、Chrome、Safari for iOS 以及 WebKit\
  \ for Android。\n\n## 属性\n\n`<video>` 和 `<audio>` 元素提供了强大的 JavaScript 接口。这两个元素共享许多属性，可以通过评估它们来确定媒体当前的状态，如下所示。\n\
  \n| 属性名称 | 数据类型 | 说明 |\n| --- | --- | --- |\n| autoplay | Boolean | 获取或设置自动播放标志。\
  \ |\n| buffered | TimeRanges | 表示已下载缓冲时间范围的对象。 |\n| bufferedBytes | ByteRanges |\
  \ 表示已下载缓冲字节范围的对象。 |\n| bufferingRate | Integer | 每秒从下载的平均比特数。 |\n| bufferingThrottled\
  \ | Boolean | 缓冲是否受到限制。 |\n| controls | Boolean | 获取或设置控件属性，显示或隐藏浏览器的控件。 |\n| currentLoop\
  \ | Integer | 媒体循环的次数。 |\n| currentSrc | String | 当前播放媒体的 URL。 |\n| currentTime\
  \ | Float | 已播放的秒数。 |\n| defaultPlaybackRate | Float | 获取或设置默认播放速率。默认为 1.0 秒。 |\n\
  | duration | Float | 媒体的总秒数。 |\n| ended | Boolean | 媒体是否已播放完毕。 |\n| loop | Boolean\
  \ | 获取或设置媒体在完成后是否循环回到开头。 |\n| muted | Boolean | 获取或设置媒体是否静音。 |\n| networkState |\
  \ Integer | 指示媒体的网络连接状态：0 为空，1 为加载中，2 为加载元数据，3 为加载第一帧，4 为加载。 |\n| paused | Boolean\
  \ | 指示播放器是否暂停。 |\n| playbackRate | Float | 获取或设置当前播放速率。这可能会受到用户影响导致媒体播放变快或变慢，而 defaultPlaybackRate\
  \ 除非开发者更改否则保持不变。 |\n| played | TimeRanges | 直到目前播放的时间范围。 |\n| readyState | Integer\
  \ | 指示媒体是否准备好播放。值为 0 表示数据不可用，1 表示当前帧可以显示，2 表示媒体可以开始播放，3 表示媒体可以从头到尾播放。 |\n| seekable\
  \ | TimeRanges | 可查找的时间范围。 |\n| seeking | Boolean | 指示播放器正在移动到媒体文件的新位置。 |\n| src\
  \ | String | 媒体文件源。可以任何时间重写。 |\n| start | Float | 获取或设置媒体文件中应开始播放的位置（秒为单位）。 |\n\
  | totalBytes | Integer | 资源所需的总字节数（如果已知）。 |\n| videoHeight | Integer | 返回视频的高度（不一定是元素的高度）。仅用于\
  \ <video>。 |\n\n\n\n\n\n| `videoWidth` | `Integer` | 返回视频宽度（不一定等于元素的宽度）。仅用于 `<video>`。\
  \ |\n| `volume` | `Float` | 获取或设置当前音量，范围在 `0.0` 到 `1.0` 之间。 |\n\n许多属性也可以作为属性指定在\
  \ `<audio>` 或 `<video>` 元素上。\n\n## 事件\n\n除了许多属性外，还有许多在这些媒体元素上触发的事件。这些事件监控由于媒体播放和用户与播放器交互而改变的所有不同属性。这些事件列在下表中。\n\
  \n| 事件名称 | 触发条件 |\n| --- | --- |\n| `abort` | 下载已中止。 |\n| `canplay` | 播放可以开始；`readyState`\
  \ 为 `2`。 |\n| `canplaythrough` | 播放可以继续且不应中断；`readyState` 为 `3`。 |\n| `canshowcurrentframe`\
  \ | 当前帧已下载；`readyState` 为 `1`。 |\n| `dataunavailable` | 因为没有数据，无法播放；`readyState`\
  \ 为 `0`。 |\n| `durationchange` | `duration` 属性值已改变。 |\n| `emptied` | 网络连接已关闭。 |\n\
  | `empty` | 发生防止媒体下载的错误。 |\n| `ended` | 媒体已完全播放并停止。 |\n| `error` | 下载过程中发生了网络错误。\
  \ |\n| `load` | 所有媒体已加载。此事件已被弃用；请用 `canplaythrough` 代替。 |\n| `loadeddata` | 媒体的第一帧已加载。\
  \ |\n| `loadedmetadata` | 媒体的元数据已加载。 |\n| `loadstart` | 下载开始。 |\n| `pause` | 播放已暂停。\
  \ |\n| `play` | 请求媒体开始播放。 |\n| `playing` | 媒体已实际开始播放。 |\n| `progress` | 正在下载中。 |\n\
  | `ratechange` | 媒体播放速度已改变。 |\n| `seeked` | 进度调整结束。 |\n| `seeking` | 播放正在移动到新位置。\
  \ |\n| `stalled` | 浏览器尝试下载，但没有接收到任何数据。 |\n| `timeupdate` | `currentTime` 以不规则或意外的方式更新。\
  \ |\n| `volumechange` | `volume` 属性值或 `muted` 属性值已改变。 |\n| `waiting` | 播放暂停以下载更多数据。\
  \ |\n\n这些事件的设计尽可能具体，以便 Web 开发人员仅使用 HTML 和 JavaScript 创建自定义的音频/视频播放器（而不是创建一个新的 Flash\
  \ Movie）。\n\n## 自定义媒体播放器\n\n你可以使用 `<audio>` 和 `<video>` 元素上提供的 `play()` 和 `pause()`\
  \ 方法手动控制媒体文件的播放。通过将属性、事件和这些方法结合，可以轻松创建一个自定义媒体播放器，如示例所示：\n\n![image](img/logo1.gif)\n\
  \n```\n<div class=\"mediaplayer\">\n    <div class=\"video\">\n        <video id=\"\
  player\" src=\"movie.mov\" poster=\"mymovie.jpg\" \n               width=\"300\"\
  \ height=\"200\">\n            Video player not available.\n        </video>\n \
  \   </div>\n    <div class=\"controls\">\n        <input type=\"button\" value=\"\
  Play\" id=\"video-btn\">\n        <span id=\"curtime\">0</span>/<span id=\"duration\"\
  >0</span>\n    </div>\n</div>\n```\n\n### VideoPlayer `VideoPlayerExample01.htm`\n\
  \n随后，可以使用 `JavaScript` 创建一个简单的视频播放器来让这个基础 HTML 活起来，如下所示：\n\n```javascript\n// 获取元素的引用\n\
  var player = document.getElementById(\"player\"),\n    btn = document.getElementById(\"\
  video-btn\"),\n    curtime = document.getElementById(\"curtime\"),\n    duration\
  \ = document.getElementById(\"duration\");\n\n// 更新时长\nduration.innerHTML = player.duration;\n\
  \n//为按钮附加事件处理器\nEventUtil.addHandler(btn, \"click\", function(){\n    if (player.paused){\n\
  \        player.play();\n    } else {\n        player.pause();\n    }\n});\n\n//\
  \ 更新时长\nEventUtil.addHandler(player, \"timeupdate\", function(){\n    curtime.innerHTML\
  \ = player.currentTime;\n    duration.innerHTML = player.duration;\n});\n```\n\n\
  ## 编码器支持\n\n注意，编码器列表必须始终在引号内才能工作。以下是支持的音频列表：\n\n| 名称 | 字符串 | 支持的浏览器 |\n| --- | ---\
  \ | --- |\n| `AAC` | `audio/mp4; codecs=\"mp4a.40.2\"` | Internet Explorer 9+, Safari\
  \ 4 |\n| `MP3` | `audio/mpeg` | Internet Explorer 9+, Chrome |\n| `Vorbis` | `audio/ogg;\
  \ codecs=\"vorbis\"` | Firefox 3.5+, Opera 10.5+, Chrome |\n| `WAV` | `audio/wav`\
  \ | Firefox 3.5+, Opera 10.5+, Chrome |\n\n你也可以使用 `canPlayType()` 检测视频格式。以下是支持的视频格式列表：\n\
  \n| 名称 | 字符串 | 支持的浏览器 |\n| --- | --- | --- |\n| `H.264` | `video/mp4; codecs=\"\
  avc1.42E, mp4a.40.2\"` | Internet Explorer 9+, Safari 4+, Safari for iOS, Chrome\
  \ for Android |\n| `Theora` | `video/ogg; codecs=\"theora\"` | Firefox 3.5+, Opera\
  \ 10.5+, Chrome |\n| `WebM` | `video/webm; codecs=\"vp8, vorbis\"` | Firefox 4+,\
  \ Opera 10.6+, Chrome |\n\n## Audio 类型\n\n`<audio>` 元素有一个原生的 `Audio` 构造函数，允许在任何时间播放音频：\n\
  \n```javascript\nvar audio = new Audio(\"sound.mp3\");\nEventUtil.addHandler(audio,\
  \ \"canplaythrough\", function(event){\n    audio.play();\n});\n```\n\n\n\n\n\n\
  # 简介\n\n现代 应用程序编程中最困难的方面之一是历史记录管理。每个操作让用户跳转到完全新页面的时代已经过去了，这意味着“后退”和“前进”按钮已不再是用户用来熟悉的“带我进入不同状态”的一种方式。解决这一问题的第一步是\
  \ `hashchange` 事件（在第 13 章中讨论）。HTML5 更新了 `history` 对象以提供方便的状态管理。\n\n`hashchange`\
  \ 事件只是简单地让你知道 URL 哈希发生了变化并要求你采取相应的行动，而状态管理 API 实际上允许你在不加载新页的情况下更改浏览器 URL。要实现这一点，请使用\
  \ `history.pushState()` 方法。该方法接受三个参数：数据对象、新状态的标题以及一个可选的相对 URL。例如：\n\n```\nhistory.pushState({name:\"\
  Nicholas\"}, \"Nicholas' page\", \"nicholas.html\");\n```\n\n一旦 `pushState()` 执行，状态信息就会被推送到历史栈中，浏览器地址栏也会随之改变以反映新的相对\
  \ URL。尽管发生了这种变化，浏览器并不会向服务器发送请求，即使查询 `location.href` 返回的内容与地址栏中的内容完全一致。第二个参数目前没有被任何实现版本使用，因此将其留为空字符串或提供一个短标题是安全的。第一个参数应该包含在必要时正确初始化此页面状态所需的所有信息。\n\
  \n由于 `pushState()` 创建了一个新的历史记录，你会发现“后退”按钮被激活了。当点击后退按钮时，`window` 对象上会触发 `popstate`\
  \ 事件。`popstate` 的事件对象有一个名为 `state` 的属性，它包含了作为第一个参数传递给 `pushState()` 的对象：\n\n```\n\
  EventUtil.addHandler(window, \"popstate\", function(event){\n    var state = event.state;\n\
  \    if (state){   //首次加载页面时 state 为 null\n        processState(state);\n    }\n\
  });\n```\n\n使用此状态，你需要将页面重置为状态对象中数据所代表的状态（因为浏览器不会自动为你完成这一点）。请记住，当页面首次加载时没有状态，因此一直点击后退按钮直到回到原始页面状态将导致\
  \ `event.state` 为 `null`。\n\n你可以通过使用 `replaceState()` 并传递与 `pushState()` 相同的前两个参数来更新当前状态信息。这样做不会在历史记录中创建新条目，而只是覆盖当前状态：\n\
  \n```\nhistory.replaceState({name:\"Greg\"}, \"Greg's page\");\n```\n\nHTML5 历史状态管理支持\
  \ Firefox 4+、Safari 5+、Opera 11.5+ 以及 Chrome。在 Safari 和 Chrome 中，传递给 `pushState()`\
  \ 或 `replaceState()` 的状态对象不能包含任何 DOM 元素。Firefox 正支持将 DOM 元素放入状态对象。Opera 也支持 `history.state`\
  \ 属性，它返回当前状态的状态对象。\n\n![image](img/pen.gif)\n\n使用 HTML5 历史状态管理时，确保你使用 `pushState()`\
  \ 创建的任何“伪”URL 都有服务器上真实的 URL 支持。否则，点击刷新按钮将导致 404 错误。\n\n# 总结\n\nHTML5 除了定义新的标记规则外，还定义了几个\
  \ JavaScript API。这些 API 旨在实现更好的 Web 界面，能够媲美桌面应用程序的功能。本章涵盖的 API 如下：\n\n*   跨文档消息提供了跨不同源文档之间发送消息的能力，同时保持了同源策略的安全性。\n\
  *   原生拖放允许你轻松指示一个元素是可拖动的，并像操作系统一样对放置操作做出响应。你可以创建自定义的可拖动元素和放置目标。\n*   新的媒体元素 `<audio>`\
  \ 和 `<video>` 有它们自己用于交互音频和视频的 API。并非所有浏览器都支持所有媒体格式，因此请利用 `canPlayType()` 方法正确检测浏览器支持情况。\n\
  *   历史状态管理允许你在不卸载当前页的情况下更改浏览器历史栈。这允许使用“后退”和“前进”按钮的用户在由 JavaScript 处理的页面状态之间移动。\n\
  \n# 第 17 章\n\n## 错误处理与调试\n\n## 本章内容概览\n\n*   理解浏览器错误报告\n*   处理错误\n*   调试 JavaScript\
  \ 代码\n\n由于其动态性质以及多年缺乏适当的开发工具，JavaScript Tradition 上被认为是最难调试的编程语言之一。错误通常会导致令人困惑的浏览器消息，例如“object\
  \ expected”，这些信息提供的上下文内容很少或完全不提供。ECMAScript 的第三版旨在改善这种情况，引入了 `try-catch` 和 `throw`\
  \ 语句以及各种错误类型，以帮助开发者在错误发生时进行处理。几年后，针对浏览器的 JavaScript 调试器和调试工具开始出现。到 2008 年，大多数网络浏览器已支持某些\
  \ JavaScript 调试功能。\n\n有了适当的语言支持和开发工具，Web 开发者现在能够实现正确的错误处理流程并找出问题原因。\n\n## 浏览器错误报告\n\
  \n所有主流浏览器——Internet Explorer、Firefox、Safari、Chrome 和 Opera 都有某种方式向用户报告 JavaScript\
  \ 错误。默认情况下，所有浏览器都会隐藏这些信息，因为这对开发者以外的人几乎没用。在开发基于浏览器的 JavaScript 解决方案时，务必启用 JavaScript\
  \ 错误报告，以便在发生错误时收到通知。\n\n### Internet Explorer\n\nInternet Explorer 是唯一默认在浏览器界面（chrome）中显示\
  \ JavaScript 错误指示器的浏览器。当发生 JavaScript 错误时，浏览器左下角的“Error on page”文字旁边会出现一个小黄色图标。如果你没有预料到它，很容易忽视它。双击图标会显示一个对话框，包含错误消息并允许查看其他相关信息，如行号、字符数、错误代码和文件名（始终是你正在查看的\
  \ URL）（见 `图 17-1`）。\n\n![图 17-1](img/f608-01.jpg)\n*图 17-1: 错误指示器*\n\n这种默认行为对普通用户很好，但对于\
  \ Web 开发来说是不够。可以更改设置，使得每次发生错误都显示错误对话框。要进行此更改，点击“工具”菜单，然后选择“Internet ”。对话框出现后，点击“高级”选项卡并勾选“对每个错误显示通知”（见\
  \ `图 17-2`）。点击“确定”保存此设置。\n\n![图 17-2](img/f608-02.jpg)\n*图 17-2: Internet 选项*\n\n\
  更新此设置后，当发生错误时，通常双击黄色图标显示的对话框将默认显示。\n\n如果启用了脚本调试（默认禁用），并且你将浏览器设置为始终显示错误通知，那么你可能会看到另一个可选对话框，询问你是否想要调试该错误（见\
  \ `图 17-3`）。\n\n![图 17-3](img/f608-03.jpg)\n*图 17-3: 调试提示*\n\n要启用脚本调试，你必须先安装与 Internet\
  \ Explorer 兼容的脚本调试器。（版本 8 和 9 自带调试器。）调试器将在本章稍后部分讨论。\n\n\n\n\n\n在 Internet Explorer\
  \ 7 及之前的版本中，当错误是由外部文件中的脚本引起时，错误消息中的行号通常会偏移一位。内联脚本引起的错误行号准确准确。Internet Explorer 8\
  \ 及更高版本修复了此问题，使得所有行号都是准确的。\n\n## Firefox\n\n默认情况下，Firefox 在发生 JavaScript 错误时不会对界面进行任何更改。相反，它会将错误静默记录到错误控制台中。点击“工具”（Tools）菜单然后选择“错误控制台”（Error\
  \ Console）即可显示控制台（参见图 17-4）。注意，错误控制台还包含关于 JavaScript、CSS 和 HTML 的警告和信息，因此过滤结果可能会有用。\n\
  \nFIGURE 17-4\n\n![image](img/f609-01.jpg)\n\n当发生 JavaScript 错误时，它会被记录为一个错误，包含错误消息、发生错误的\
  \ URL 以及行号。点击文件名将打开出错脚本的只读视图，并高亮显示出错行。\n\nFirebug 可能是 Web 开发者最流行的浏览器扩展，它增强了 Firefox\
  \ 默认的 JavaScript 错误行为。Firebug 可于 [www.getfirebug.com](http://www.getfirebug.com)，它在\
  \ Firefox 状态栏底部添加了一个显示 JavaScript 信息的区域。默认情况下，此处显示绿色复选标记图标。当发生 JavaScript 错误时，图标会变为红色\
  \ X 并显示错误数量。点击红色 X 会打开 Firebug 控制台，其中显示错误消息、导致错误的代码行（脱离上下文）、发生错误的 URL 以及行号（参见图 17-5）。\n\
  \nFIGURE 17-5\n\n![image](img/f610-01.jpg)\n\n当在 Firebug 中点击导致错误的行时，它会打开一个新的 Firebug\
  \ 视图，在整个脚本文件的上下文中高亮显示该行。\n\n![image](img/pen.gif)\n\nFirebug 的用途除了显示错误消息之外还有还有许多。它是\
  \ Firefox 的一个全功能调试环境，提供了调试 JavaScript、CSS、DOM 和网络信息的方法。\n\n## Safari\n\nWindows\
  \ 和 Mac OS 上的 Safari 默认隐藏所有 JavaScript 错误信息。为了访问这些信息，必须启用“开发”（Develop）菜单。选择“编辑”（Edit）⇒“偏好”（Preferences），然后点击“高级”（Advanced）选项卡。有一个标题为“在菜单栏中开发”的复选框需要勾选。一旦启用该设置，Safari\
  \ 菜单栏中会出现一个名为“开发”的菜单（参见图 17-6）。\n\nFIGURE 17-6\n\n![image](img/f611-01.jpg)\n\n\
  “开发”菜单为调试以及其他处理当前加载页面的操作提供了多个选项。你可以点击“显示错误控制台”（Show Error Console）来显示 JavaScript\
  \ 及其他错误的列表。控制台显示错误消息、错误的 URL 以及错误的行号（参见图 17-7）。\n\nFIGURE 17-7\n\n![image](img/f611-02.jpg)\n\
  \n当你点击错误消息时，将带带到导致错误的源代码。除了输出到控制台外，JavaScript 错误不会导致 Safari 窗口发生任何变化。\n\n## Opera\n\
  \nOpera 默认也隐藏 JavaScript 错误。所有错误都记录在错误控制台中，可以通过选择“页面”（Page）菜单，然后“页面 ⇒ 开发者工具（Developer\
  \ Tools） ⇒ 错误控制台（Error Console）来显示。与 Firefox 类似，Opera 错误控制台不仅包含 JavaScript 错误，还包含\
  \ HTML、CSS、XML、XSLT 以及其他来源的错误或警告。你可以使用左下角的下拉框过滤你想要查看的消息类型（参见图 17-8）。\n\nFIGURE 17-8\n\
  \n![image](img/f612-01.jpg)\n\n错误消息出现时包含导致错误的 URL 和发生错误的线程信息。在某些情况下，还会提供堆栈跟踪。除了错误控制台中显示的详细信息外，没有其他方法获取有关错误的额外数据。\n\
  \n可以设置为每次发生 JavaScript 错误时弹出错误控制台。要此操作，进入“设置”（Settings）菜单并点击“偏好”（Preferences）。点击“高级”（Advanced）选项卡，然后从左侧菜单选择“内容”（Content）。点击“JavaScript\
  \ 选项”（JavaScript Options）按钮打开 JavaScript 选项对话框（见图 17-9）。\n\nFIGURE 17-9\n\n![image](img/f612-02.jpg)\n\
  \n确保勾选“错误时打开控制台”（Open console on error）旁边的复选框，然后点击确定。现在每当有 JavaScript 错误时，错误控制都会弹出。也可以针对每个网站进行，通过选择“工具”（Tools）⇒\
  \ 快速偏好（Quick Preferences） ⇒ 编辑网站偏好（Edit Site Preferences），选择“脚本”（Scripting）选项卡并勾选“错误时打开控制台”复选框。\n\
  \n## Chrome\n\n与 Safari 和 Opera 一样，Chrome 默认隐藏 JavaScript 错误。所有错误都记录在错误控制台中，可以通过选择“页面”（Page）菜单，然后“页面\
  \ ⇒ 开发者工具（Developer Tools） ⇒ 错误控制台（Error Console）来显示。与 Firefox 类似，Opera 错误控制台不仅包含\
  \ JavaScript 错误，还包含 HTML、CSS、XML、XSLT 以及其他来源的错误或警告。\n\n## 错误处理\n\n没有人怀疑编程中错误处理的重要性。每个主要的\
  \ Web 应用程序都需要一个良好的错误处理协议，大多数优秀的程序都做到了，尽管这通常是在服务器端。事实上，服务器端团队通常会花精力定义一种错误日志机制，按类型、频率和任何可能重要的指标对错误进行分类。结果是可以通过简单的数据库查询或报告生成脚本来了解应用程序在公开环境中的运行情况。\n\
  \n尽管错误处理同样重要，但它逐渐被应用于 Web 应用程序的浏览器端。需要理解的重要事实是，大多数使用 Web 的人技术上并不精通——大多数人甚至不完全理解什么是浏览器，更不用说他们在使用哪一个了。正如本章之前描述，当发生\
  \ JavaScript 错误时，每个器的行为略有不同。从浏览器角落出现小图标到完全什么都没有发生，JavaScript 错误的默认浏览器体验对终端用户来说是非常糟糕的。良好的错误处理策略可以让你的用户了解发生的情况，而不会让他们感到恐慌。\n\
  \n### try-catch 语句\n\nECMA-262 第三版引入了 `try-catch` 语句作为处理 JavaScript 异常的方法。基本语法如下，与\
  \ Java 中的 `try-catch` 语句相同：\n\n```\ntry {\n    //可能导致错误的代码\n} catch (error) {\n\
  \    // 发生错误时要执行的操作\n}\n```\n\n任何可能抛出错误的代码都应该放在语句的 `try` 部分，而处理错误的代码放置在 `catch`\
  \ 部分，如下例所示：\n\n\n\n\n\n```javascript\ntry {\n    window.someNonexistentFunction();\n\
  } catch (error){\n    alert(\"An error happened!\");\n}\n```\n\n如果在语句的 `try` 部分在任何点发生错误，代码执行将立即退出并在\
  \ `catch` 部分继续执行。语句的 `catch` 部分将接收一个包含所发生错误信息的对象。与其他语言不同，即使你不打算使用错误对象，也必须为错误对象定义一个名称。此对象上可用的具体信息随浏览器而异，但至少包含一个持有错误消息的\
  \ `message` 属性。`ECMA-262` 还规定了用于定义错误类型的 `message` 属性；该属性在所有当前浏览器中都是可用的。因此，在必要时你可以显示实际的浏览器消息，如下例所示：\n\
  \n![image](img/logo1.gif)\n\n```javascript\ntry {\n    window.someNonexistentFunction();\n\
  } catch (error){\n    alert(error.message);\n}\n```\n\n### TryCatchExample01.htm\n\
  \n此示例展示了在向用户显示错误消息时使用了 `message` 属性。尽管每个浏览器都添加了其他信息，但 `message` 属性是保证在 Internet\
  \ Explorer、Firefox、Safari、Chrome 和 Opera 中都存在的属性。Internet Explorer 添加了一个 `description`\
  \ 属性，其值始终等于 `message`，以及一个提供内部错误代码的 `number` 属性。Firefox 添加了 `fileName`、`lineNumber`\
  \ 和 `stack`（包含堆栈跟踪）。Safari 添加了 `line`（行号）、`sourceId`（内部错误代码）和 `sourceURL`。再次，为了跨浏览器兼容性，最好仅依赖\
  \ `message` 属性。\n\n### finally 子句 (The finally Clause)\n\n`try-catch` 语句中可选的 `finally`\
  \ 子句无论发生什么都会执行其代码。如果 `try` 部分的代码完全运行，则执行 `finally` 子句；如果发生错误并执行 `catch` 部分，`finally`\
  \ 部分仍然执行。在语句的 `try` 或 `catch` 部分中，没有任何操作可以防止 `finally` 中的代码被执行，这包括使用 `return` 语句。请考虑以下函数：\n\
  \n![image](img/logo1.gif)\n\n```javascript\nfunction testFinally(){\n    try {\n\
  \        return 2;\n    } catch (error){\n        return 1;\n    } finally {\n \
  \       return 0;\n    }\n}\n```\n\n### TryCatchExample02.htm\n\n此函数简单地在 `try-catch`\
  \ 语句的每个部分放置了一个 `return` 语句。看起来函数应该返回 `2`，因为这是在 `try` 部分且不会引起错误。然而，`finally` 子句的存在导致该返回被忽略；无论如何调用，该函数都会返回\
  \ `0`。如果删除了 `finally` 子句，函数将返回 `2`。\n\n如果提供了 `finally`，则 `catch` 是可选的（只需其一）。Internet\
  \ Explorer 7 及之前的版本有一个 Bug，否则 `finally` 中的代码永远执行。如果你仍在处理早期版本的 Internet Explorer，那么通变方法是即使\
  \ `catch` 是空的，也提供一个 `catch` 子句。这在版本 8 中已修复。\n\n![image](img/pen.gif)\n\n非常重要的一点是，如果代码中包含了\
  \ `finally` 子句，那么 `try` 或 `catch` 部分中的任何 `return` 语句都将被忽略。在使用 `finally` 时，请务必双重检查代码的预期行为。\n\
  \n### 错误类型 (Error Types)\n\n在代码执行过程中可能会发生几种不同类型的错误。每种错误类型都有一个在发生错误时对应的对象类型。`ECMA-262`\
  \ 定义了以下七种错误类型：\n\n* `Error`\n* `EvalError`\n* `RangeError`\n* `ReferenceError`\n\
  * `SyntaxError`\n* `TypeError`\n* `URIError`\n\n`Error` 类型是所有其他错误类型继承的基类型。由于由于，所有错误类型共享相同的属性（错误对象上的唯一方法是默认对象方法）。浏览器很少甚至从未抛出类型为\
  \ `Error` 的错误；它主要供开发者抛出自定义错误。\n\n`EvalError` 类型在使用 `eval()` 函数时发生异常时抛出。`ECMA-262`\
  \ 规定，“如果 `eval` 属性的值被用于直接调用以外的任何方式（即不是通过显式使用其名称作为 `Identifier`，即 `CallExpression`\
  \ 中的 `MemberExpression`），或者如果 `eval` 属性被赋值，则抛出此错误。”这基本上意味着将 `eval()` 用于函数调用以外的任何形式，例如：\n\
  \n```javascript\nnew eval();     //抛出 EvalError\neval = foo;     //抛出 EvalError\n\
  ```\n\n在实践中，浏览器并不总是会在应该抛出 `EvalError` 时这样做。例如，Firefox 4+ 和 Internet Explorer 8 在第一情况下抛出\
  \ `TypeError`，但第二种情况成功且不报错。由于这种情况以及这些模式被使用的可能性较低，你很难遇到这种错误类型。\n\n当数字超出其范围边界时会发生\
  \ `RangeError`。例如，当尝试定义一个具有不支持数量项目的数组时，可能会发生此错误，例如 `-20` 或 `Number.MAX_VALUE`，如下所示：\n\
  \n```javascript\nvar items1 = new Array(-20);                //抛出 RangeError\nvar\
  \ items2 = new Array(Number.MAX_VALUE); //抛出 RangeError\n```\n\n范围错误在 JavaScript\
  \ 中发生的频率较低。\n\n`ReferenceError` 类型在预期对象时使用（这正是著名的“预期对象”错误的原因）。这种类型的错误通常发生在访问不存在的变量时，如下所示：\n\
  \n```javascript\nvar obj = x;    // x 未定义时抛出 ReferenceError\n```\n\n`SyntaxError`\
  \ 对象最常在传递 `eval()` 的 JavaScript 字符串存在语法错误时抛出，如下：\n\n```javascript\neval(\"a ++ b\"\
  );     //抛出 SyntaxError\n```\n\n在使用 `eval()` 之外，`SyntaxError` 类型很少使用，因为 JavaScript\
  \ 代码中的语法错误会立即停止执行。\n\n`TypeError` 类型在 JavaScript 中使用最多，当变量类型不符合或尝试访问不存在的方法时发生。这可能由于任何原因引起，通常是当对错误的类型使用了特定类型的操作。是一些示例：\n\
  \n```javascript\nvar o = new 10;                  //抛出 TypeError\nalert(\"name\"\
  \ in true);           //抛出 TypeError \nFunction.prototype.toString.call(\"name\"\
  );   //抛出 TypeError \n```\n\n类型错误经常发生在未先验证类型的函数参数上。\n\n最后一种错误类型是 `URIError`，它在使用\
  \ `encodeURI()` 或 `decodeURI()` 处理格式错误的 URI 时发生。这种错误可能是 JavaScript 中最少观察到的，因为这些函数非常健壮。\n\
  \n不同的错误类型可以提供更多关于异常的信息，允许进行适当的错误处理。你可以通过 `instanceof` 运算符确定 `try-catch` 语句中 `catch`\
  \ 部分抛出的错误类型，如下所示：\n\n```javascript\ntry {\n    someFunction();\n} catch (error){\n\
  \    if (error instanceof TypeError){\n        // 处理类型错误\n    } else if (error instanceof\
  \ ReferenceError){\n        // 处理引用错误\n    } else {\n        // 处理所有其他错误类型\n   \
  \ }\n}\n```\n\n检查错误类型是跨浏览器确定适当行动方案的最简单方法，因为 `message` 属性包含的错误消息随浏览器而异。\n\n### try-catch\
  \ 的用法\n\n\n\n\n当 `try-catch` 语句内部发生错误时，浏览器认为该错误已通过处理，因此它不会使用本章之前讨论的机制来报告该错误。对于那些技术上不敏感、无法理解错误何时发生的用户的\
  \ Web 应用程序来说，这是理想的。`try-catch` 语句允许你针对特定的错误类型实现自己的错误处理机制。\n\n`try-catch` 语句的最佳用例是可能会发生你无法控制的错误。例如，如果你正在使用某个大型\
  \ JavaScript 库中的的函数，该函数可能会故意或无意地抛出错误。由于你无法修改该库的代码，将该调用封装在 `try-catch` 语句中是合适的，以防发生错误并随后对错误进行适当的处理。\n\
  \n如果你明确知道代码会发生特定的错误，那么使用 `try-catch` 语句是不恰当的。例如，如果函数在传入字符串而不是数字时会失败，你应该检查参数的数据类型并采取相应的行动；在这种情况下，没有必要使用\
  \ `try-catch` 语句。\n\n## 抛出错误 (Throwing Errors)\n\n`try-catch` 语句的伴侣工具是 `throw` 操作符，它可以用于在任何时间抛出自定义错误。`throw`\
  \ 操作符必须配合一个值使用，但对值的类型没有限制。以下所有行都是合法的：\n\n```\nthrow 12345;\nthrow \"Hello world!\"\
  ;\nthrow true;\nthrow { name: \"JavaScript\"};\n```\n\n当使用 `throw` 操作符时，代码执行会立即停止，只有当\
  \ `try-catch` 语句捕获了抛出的值时，执行才会继续。\n\n使用内置错误类型之一可以更准确地模拟浏览器错误。每个错误类型的构造函数都接受一个参数，即精确的错误消息。这里是一个示例：\n\
  \n```\nthrow new Error(\"Something bad happened.\");\n```\n\n这段代码抛出了带有自定义错误消息的通用错误。浏览器处理该错误就像是由浏览器本身生成一样，这意味着它将以通常的方式报告，并显示你的自定义错误消息。你可以使用其他错误类型实现相同的结果，如示例所示：\n\
  \n```\nthrow new SyntaxError(\"I don't like your syntax.\");\nthrow new TypeError(\"\
  What type of variable do you take me for?\");\nthrow new RangeError(\"Sorry, you\
  \ just don't have the range.\");\nthrow new EvalError(\"That doesn't evaluate.\"\
  );\nthrow new URIError(\"Uri, is that you?\");\nthrow new ReferenceError(\"You didn't\
  \ cite your references properly.\");\n```\n\n最常用的自定义错误消息的错误类型是 `Error`、`RangeError`、`ReferenceError`\
  \ 和 `TypeError`。\n\n你还可以通过原型链（第 6 节讨论）继承 `Error` 来创建自定义错误类型。你应该在错误类型上同时提供 `name`\
  \ 属性和 `message` 属性。这里是一个示例：\n\n![image](img/logo1.gif)\n\n```\nfunction CustomError(message){\n\
  \    this.name = \"CustomError\";\n    this.message = message;\n}\n\nCustomError.prototype\
  \ = new Error();\n\nthrow new CustomError(\"My message\");\n```\n\n`ThrowingErrorsExample01.htm`\n\
  \n继承自 `Error` 的自定义错误类型被浏览器视为与任何其他错误相同。当你需要捕获自己抛出的错误并需要将它们与浏览器生成的错误区分来来，创建自定义错误类型是有帮助的。\n\
  \n![image](img/pen.gif)\n\nInternet Explorer 仅在抛出 `Error` 对象时显示自定义错误消息。对于所有其他类型，它仅显示“exception\
  \ thrown and not caught”。\n\n## 何时抛出错误 (When to Throw Errors)\n\n抛出自定义错误是提供关于函数失败原因更多信息的极佳方法。当存在特定的已知错误条件且导致函数无法正常执行时，应该抛出错误。也就是说，在给定条件下，浏览器在执行此函数时将抛出错误。例如，如果参数不是数组，以下函数将失败：\n\
  \n![image](img/logo1.gif)\n\n```\nfunction process(values){\n    values.sort();\n\
  \n    for (var i=0, len=values.length; i < len; i++){\n        if (values[i] > 100){\n\
  \            return values[i];\n        }\n    }\n\n    return -1;\n}\n```\n\n`ThrowingErrorsExample02.htm`\n\
  \n如果使用字符串作为参数运行此函数，则 `sort()` 调用将失败。每个浏览器都会给出一个不同的（尽管有些晦涩的）错误消息，列如下：\n\n* Internet\
  \ Explorer — Property or method doesn’t exist.\n* Firefox — `values.sort()` is not\
  \ a function.\n* Safari — Value undefined (result of expression `values.sort`) is\
  \ not an object.\n* Chrome — Object name has no method 'sort'.\n* Opera — Type mismatch\
  \ (usually a non-object value used where an object is required).\n\n尽管 Firefox、Chrome\
  \ 和 Safari 至少指出了导致错误的代码部分，但没有任何一个错误消息能特别清楚地说明发生了什么或该如何修复。在处理单个函数时（如上一个示例所示），通过这些错误消息进行调试是足够容易的。然而，当你正在开发一个具有成数千行\
  \ JavaScript 代码的复杂 Web 应用程序时，寻找错误源将变得困难得多。此时，带有适当信息的自定义错误将显著有助于代码的可维护性。考虑以下示例：\n\
  \n![image](img/logo1.gif)\n\n```\nfunction process(values){\n\n    if (!(values\
  \ instanceof Array)){\n        throw new Error(\"process(): Argument must be an\
  \ array.\");\n    }\n\n    values.sort();\n\n    for (var i=0, len=values.length;\
  \ i < len; i++){\n        if (values[i] > 100){\n            return values[i];\n\
  \        }\n    }\n\n    return -1;\n}\n```\n\n`ThrowingErrorsExample02.htm`\n\n\
  在这个重写的函数版本中，如果 `values` 参数不是数组，则抛出一个错误。错误消息提供了函数名称以及发生错误的清晰描述。如果此错误发生在复杂的 Web 应用程序中，你将对问题所在有更清晰的判断。\n\
  \n当你开发 JavaScript 代码时，要对每个函数及其可能失败的情况持有审慎的眼光。良好的错误处理机制可以确保发生的错误都是你抛出的那些。\n\n![image](img/pen.gif)\n\
  \n在跨框架环境中使用 `instanceof` 识别数组会有一些问题。详情请参阅第 22 节的类型类型检测。\n\n## 抛出错误与 try-catch (Throwing\
  \ Errors versus try-catch)\n\n\n\n\n\n任何未被 `try-catch` 处理的错误都会在 `window` 对象上触发错误事件。该事件是\
  \ 浏览器最早支持的事件之一，其格式为了保持 Internet Explorer、Firefox 和 Chrome 的向后兼容性一直保持不变。（Opera 或\
  \ Safari 不支持该错误事件。）`onerror` 事件处理程序在任何浏览器中都不会创建事件对象，相反，它接收三个参数：错误消息、发生错误的 URL 以及行号。在大多数情况下，只有错误消息是相关的（relevant）的，因为\
  \ URL 与文档的位置相同，而行号可能指向内联 JavaScript 或外部文件中的代码。`onerror` 事件处理程序需要使用此处所示的 DOM Level\
  \ 0 技术进行赋值，因为它没有遵循 DOM Level 2 事件的标准格式：\n\n```\nwindow.onerror = function(message,\
  \ url, line){\n    alert(message);\n};\n```\n\n当发生任何错误时（无论是浏览器生成的还是其他来源的），错误事件就会触发，并执行该事件处理程序。随后，浏览器的默认行为将接管并像正常一样显示错误消息。你可以通过返回\
  \ `false` 来防止浏览器的默认错误报告，如下所示：\n\n![image](img/logo1.gif)\n\n```\nwindow.onerror\
  \ = function(message, url, line){\n    alert(message);\n    return false;\n};\n\
  ```\n\n`OnErrorExample01.htm`\n\n通过返回 `false`，此函数实际上变成了整个文档的 `try-catch` 语句，捕捉所有未处理的运行时错误。该事件处理程序是防止浏览器报告错误的最后防线，理想情况下，它永远不应该被使用。正确使用\
  \ `try-catch` 语句意味着错误不会到达浏览器层，因此不应触发错误事件。\n\n![image](img/pen.gif)\n\n浏览器使用此事件处理错误的方式存在显著差异。当\
  \ Internet Explorer 中发生错误事件时，正常代码执行会继续；所有变量和数据都会被保留，并可以在 `onerror` 事件处理程序内部访问。然而，在\
  \ Firefox 中，正常代码执行会结束，错误发生之前的所有变量和数据都会被销毁，这使得难以真正评估错误。\n\n图像也支持错误事件。每当图像 `src` 属性中的\
  \ URL 未返回可识别的图像格式时，错误事件就会触发。该事件遵循 DOM 格式，返回一个以图像为目标的事件对象。这是一个示例：\n\n![image](img/logo1.gif)\n\
  \n```\nvar image = new Image();\nEventUtil.addHandler(image, \"load\", function(event){\n\
  \    alert(\"Image loaded!\");\n});\nEventUtil.addHandler(image, \"error\", function(event){\n\
  \    alert(\"Image not loaded!\");\n});\nimage.src = \"smilex.gif\";  //不存在\n```\n\
  \n`OnErrorExample02.htm`\n\n在此示例中，当图像加载失败时会显示一个警框。重要的一是，一旦错误事件触发，图像下载过程已经结束且不会恢复。\n\
  \n# 错误处理策略\n\n传统上，Web 应用程序的错误处理策略局限于服务器。对于错误和错误处理通常会投入大量的思考，包括日志和监控系统。此类工具的目的是分析错误模式，希望追踪根源并理解错误影响了多少用户。\n\
  \n对于 Web 应用程序的 JavaScript 层，拥有错误处理策略同样重要。由于任何 JavaScript 错误都可能导致网页无法使用，因此理解错误何时以及为何发生至关重要。大多数\
  \ Web 应用用户并非技术人员，当某些功能不符合预期时，他们很容易感到困惑。他们可能会尝试通过刷新页面来解决问题，或者可能直接停止尝试。作为开发者，你应该深入了解代码可能何时以及如何失败，并有一套系统来跟踪此类问题。\n\
  \n## 识别可能出现错误的地方\n\n错误处理最重要的部分是首先识别代码中可能出现错误的地方。由于 JavaScript 是弱类型的，且函数参数不经过验证，许多错误只有在代码执行时才会显现。通常，有三类错误需要注意：\n\
  \n*   类型转换错误\n*   数据类型错误\n*   通信错误\n\n这些错误每一种在使用特定模式或未应用足够的值检查时都会发生。\n\n## 类型转换错误\n\
  \n类型转换错误是由于使用了会自动更改值之数据类型的运算符或其他语言结构导致的。两种最常见的类型转换错误是由于使用了相等 (`==`) 或不相等 (`!=`)\
  \ 运算符，以及在流控制语句（如 `if`、`for` 和 `while`）中使用非布尔值导致的。\n\n第 3 章中讨论的相等和不相等运算符在执行比较之前会自动转换不同类型的值。由于在非动态语言中，相同的符号通常执行直接比较，开发者经常错误地在\
  \ JavaScript 中以相同的方式使用它们。在大多数情况下，最好使用全等 (`===`) 和全不等 (`!==`) 运算符来避免类型转换。这是一个示例：\n\
  \n```javascript\nalert(5 == \"5\");           //true\nalert(5 === \"5\");      \
  \    //false\nalert(1 == true);          //true\nalert(1 === true);         //false\n\
  ```\n\n在这段代码中，数字 `5` 和字符串 `\"5\"` 使用相等运算符和全等运算符进行比较。相等运算符首先将字符串 `\"5\"` 转换为数字 `5`，然后与另一个数字\
  \ `5` 进行比较，结果为 true。全等运算符注意到两个数据类型不同，并直接返回 false。值 `1` 和 `true` 也发生了相同的情况：它们被相等运算符认为相等，但使用全等运算符则认为不相等。使用全等和全不等运算符可以防止比较过程中发生类型转换错误，强烈建议代替相等和不相等运算符。\n\
  \n### 流控制语句\n\n类型转换错误发生的第二个地方是流控制语句。诸如 `if` 的语句在确定下一步之前会自动将任何值转换为布尔值。特别是 `if` 语句，经常以容易出错的方式使用。考虑以下示例：\n\
  \n```javascript\nfunction concat(str1, str2, str3){\n    var result = str1 + str2;\n\
  \    if (str3){  //避免！！！\n        result += str3;\n    }\n    return result;\n}\n\
  ```\n\n该函数的预期目的是拼接两个三个字符串并返回结果。第三个字符串是一个可选参数，因此必须进行检查。如第 3 章所述，未使用的命名变量会被赋值为 `undefined`。值\
  \ `undefined` 会转换为布尔值 false，因此该函数中 `if` 语句的意图仅在提供第三个参数时才拼接。问题是 `undefined` 不是转换为\
  \ false 的唯一值，字符串也不是转换为 true 的唯一值。例如，如果第三个参数是数字 `0`，则 `if` 条件失败，而值 `1` 则会导致条件通过。\n\
  \n流控制语句中使用非布尔值作为条件是导致错误的非常常见的原因。为了避免此类错误，请始终确保传递布尔值作为条件。这通常通过进行某种比较来实现。例如，之前的函数可以重写为如下所示：\n\
  \n```javascript\nfunction concat(str1, str2, str3){\n    var result = str1 + str2;\n\
  \    if (typeof str3 == \"string\"){  //正确的比较\n        result += str3;\n    }\n\
  \    return result;\n}\n```\n\n在函数的这个更新版本中，`if` 语句条件根据比较返回一个布尔值。这个函数要安全得多，受错误值的影响也较小。\n\
  \n\n\n\n\n# 数据类型错误\n\n由于 JavaScript 是弱类型的，因此变量和函数参数之间不会通过比较来确保使用了正确的数据类型。作为开发者，需要你来进行适当的数据类型检查，以确保不会发生错误。数据类型错误通常是由于向函数传递了意外的值而导致的。\n\
  \n在上一个示例中，检查了第三个参数的数据类型以确保它是一个字符串，但对另外两个参数完全没有进行检查。如果函数必须返回字符串，那么传入两个数字并省略第三个参数很容易导致其崩溃。以下函数中也存在类似的情况：\n\
  \n```\n//不函数，任何非字符串值都会导致错误\nfunction getQueryString(url){\n    var pos = url.indexOf(\"\
  ?\");\n    if (pos > -1){\n        return url.substring(pos +1);\n    }\n    return\
  \ \"\";\n} \n```\n\n该函数的作用返回给定 URL 的查询字符串。为了实现这一点，它首先使用 `indexOf()` 在字符串中查找问号，如果找到，则使用\
  \ `substring()` 方法返回问号之后的所有内容。此示例中使用的两个方法是针对字符串的，因此传递任何其他数据类型都会导致错误。以下简单的类型检查使得该函数更不容易出错：\n\
  \n```\nfunction getQueryString(url){\n    if (typeof url == \"string\"){      //带有类型检查更安全\n\
  \        var pos = url.indexOf(\"?\");\n        if (pos > -1){\n            return\
  \ url.substring(pos +1);\n        } \n    }\n    return \"\";\n} \n```\n\n在函数的这个重写版本中，第一步检查传递的值是否实际上是字符串。这确保了函数永远不会因为非字符串值而报错。\n\
  \n正如在前节中讨论的，将非布尔值作为流程控制语句的条件是一个坏主意，因为存在类型转换。这也是一种会导致数据类型错误的坏做法。考虑以下函数：\n\n```\n\
  //不安全的函数，非数组值会导致错误\nfunction reverseSort(values){\n    if (values){  //避免！！！\n \
  \       values.sort();\n        values.reverse();\n    }\n}\n```\n\n`reverseSort()`\
  \ 函数使用 `sort()` 和 `reverse()` 方法按反向顺序对数组。由于 `if` 语句中的控制条件，任何转换为 `true` 的非数组值都会导致错误。另一个常见错误是将参数与\
  \ `null` 进行比较，如下例所示：\n\n```\n//仍然不安全，非数组值会导致错误\nfunction reverseSort(values){\n\
  \    if (values != null){  //避免！！！\n        values.sort();\n        values.reverse();\n\
  \    }\n}\n```\n\n将值与 `null` 进行比较只能保护代码免受两个值的影响：`null` 和 `undefined`（等同于使用相等和不等于运算符）。`null`\
  \ 比较不足以确保该值是合适的；因此，应该避免这种技术。出于同样的原因，还建议不要将值与 `undefined` 进行比较。\n\n另一个糟糕的选择是仅对使用的功能中的一个进行特性检测。这是一个示例：\n\
  \n```\n//仍然不安全，非数组值会导致错误\nfunction reverseSort(values){\n    if (typeof values.sort\
  \ == \"function\"){  //避免！！！\n        values.sort();\n        values.reverse();\n\
  \    }\n}\n```\n\n在此示例中，代码检查了参数上是否存在 `sort()` 方法。这留下了这种可能性：可能会传入一个带有 `sort()` 函数但不是数组的对象，在这种情况下，调用\
  \ `reverse()` 将导致错误。当你确切预期的对象的类型类型时，最好使用 `instanceof`（如下例所示）来确定该值是否为正确的类型：\n\n```\n\
  //安全的，非数组值会被忽略\nfunction reverseSort(values){\n    if (values instanceof Array){\
  \  //修复\n        values.sort();\n        values.reverse();\n    }\n}\n```\n\n`reverseSort()`\
  \ 的最后一个版本是安全的——它测试了 `values` 参数以检查它是否是 `Array` 的实例。通过这种方式，函数确保任何非数组值都会被忽略。\n\n通常情况下，应该是原始类型的值应该使用\
  \ `typeof` 进行检查，而应该是对象的值应该使用 `instanceof` 进行检查。取决于函数如何被使用，可能没有必要检查每个参数的数据类型，但任何面向公共的\
  \ API 绝对应该执行类型检查以确保正确执行。\n\n# 通信错误\n\n自从 Ajax 编程出现（在第 21 节讨论）以来，Web 应用在整个生命周期内动态加载信息或功能已变得非常普遍。JavaScript\
  \ 与服务器之间的任何通信都是可能错误的错误。\n\n第一类通信错误涉及格式不正确的 URL 或 POST 数据。这通常发生在数据发送到服务器之前没有使用 `encodeURIComponent()`\
  \ 进行编码时。例如，下面的 URL 格式不正确：\n\n```\nhttp://www.yourdomain.com/?redir=http://www.someotherdomain.com?a=b&c=d\n\
  ```\n\n该 URL 可以通过对 `\"redir=\"` 后的所有内容使用 `encodeURIComponent()` 来修复，产生如下结果：\n\n\
  ```\nhttp://www.example.com/?redir=http%3A%2F%2Fwww.someotherdomain.com%3Fa%3Db%26c%3Dd\n\
  ```\n\n查询参数应始终使用 `encodeURIComponent()` 方法。为了确保这一点发生，有时发现定义一个处理查询字符串的函数是有帮助的，如下：\n\
  \n```\nfunction addQueryStringArg(url, name, value){\n    if (url.indexOf(\"?\"\
  ) == -1){\n        url += \"?\";\n    } else {\n        url += \"&\";\n    }\n\n\
  \    url += encodeURIComponent(name) + \"=\" + encodeURIComponent(value);\n    return\
  \ url;\n}\n```\n\n该函数接受三个参数：要追加查询字符串参数的 URL、参数名称和参数值。该函数的使用如下例所示：\n\n```\nvar url\
  \ = \"http://www.somedomain.com\";\nvar newUrl = addQueryStringArg(url, \"redir\"\
  , \"http://www.someotherdomain.com?a=b&c=d\");\nalert(newUrl);\n```\n\n使用此函数而不是手动构建\
  \ URL 可以确保正确编码并避免相关错误。\n\n当服务器响应不符合预期时，也会发生通信错误。在使用动态脚本加载或动态样式加载（在第 10 节讨论）时，请求的资源可能用。Firefox、Chrome\
  \ 和 Safari 在未返回资源时会失败，而 Internet Explorer 和 Opera 都会报错。遗憾的是，在使用这些技术判断错误是否发生时，你无能为。在某些情况下，使用\
  \ Ajax 通信可以提供有关错误状况的附加信息。\n\n![image](img/pen.gif)\n\n在使用 Ajax 通信时也会发生通信错误。围绕 Ajax\
  \ 的问题和错误将在第 21 节讨论。\n\n## 区分致命和非致命错误\n\n错误处理策略最重要的部分之一是判断错误是否致命。一个或多个特征可以识别非致命错误：\n\
  \n*   它不会干扰用户的主要任务。\n*   它只影响页面的一部分。\n*   是可以恢复的。\n*   重复操作可能会成功。\n\n\n\n\n\n从本质上说，非致命错误并不令人担心。例如，Yahoo!\
  \ Mail ([`mail.yahoo.com`](http://mail.yahoo.com)) 有一个功能，允许用户从界面发送短信。如果由于某种原因短信无法工作，这只是一个非致命错误，因为这并不是应用程序的主要功能。Yahoo!\
  \ Mail 的主要用例是读写电子邮件邮件，只要用户可以执行该操作，就没有理由中断用户的体验。非致命错误不需要你向用户发送显式消息——你可能可以使用一条指示该功能不可用的消息来替换受影响的页面区域，但没有必要中断用户。\n\
  \n另一方面，致命错误（Fatal errors）通过以下一个或多个特征被识别出来：\n\n* 应用程序绝对无法继续运行。\n* 错误严重干扰了用户的主要目标。\n\
  * 导致了其他错误的发生。\n\n了解 `JavaScript` 中何时发生致命错误至关重要，以便采取适当的措施。当发生致命错误时，你应该立即向用户发送消息，让他们知道他们无法继续之前的操作。如果必须重新加载页面才能运行应用程序，那么你应该告诉用户这一点，并提供一个可以自动刷新页面的按钮。\n\
  \n你还必须确保你的代码不要规定什么是致命错误、什么不是致命错误。非致命错误和致命错误主要通过它们对用户的影响来指示。良好的代码设计意味着应用程序某部分的错误不应无必要地影响另一个实际上完全不相关的相关的部分。例如，考虑一个个性化主页，如\
  \ My Yahoo! ([`my.yahoo.com`](http://my.yahoo.com))，页面上有多个独立的模块。如果每个模块都必须通过 `JavaScript`\
  \ 调用来初始化，你可能会看到类似下面的代码：\n\n```\nfor (var i=0, len=mods.length; i < len; i++){\n\
  \    mods[i].init();    //可能发生致命错误\n}\n```\n\n从表面上看，这段代码看起来很好：在每个模块上调用了 `init()`\
  \ 方法。问题是，任何模块的 `init()` 方法中的错误都会导致数组中排在其之后的所有模块永远无法初始化。如果错误在第一个模块上发生，那么页面上的所有模块都将无法初始化。从逻辑上讲，这是不通的，因为每个模块都是独立的实体，其功能不依赖于任何其他模块。是代码的结构导致这种错误变成了致命的。幸运的是，可以将代码重写为如下形式，使任何模块中的错误都变为非致命的：\n\
  \n```\nfor (var i=0, len=mods.length; i < len; i++){\n    try {\n        mods[i].init();\n\
  \    } catch (ex){\n        //在此处处理错误\n    }\n}\n```\n\n通过在 `for` 循环中添加 `try-catch`\
  \ 语句，模块初始化时的任何错误都不会阻止其他模块的初始化。当此代码发生错误时，可以独立进行处理，且方式不会干扰用户体验。\n\n## 将错误记录到服务器\n\n\
  Web 应用程序的一种做法是设置一个集中错误日志，为了跟踪目的将重要错误写入。数据库和服务器错误会定期写入日志，并通过某些通用 API 进行分类。对于复杂的 Web\
  \ 应用程序，建议你也将 `JavaScript` 错误记录回服务器。其意图是将错误记录在与服务器端错误相同的系统中，并将其分类为来自前端。使用相同的系统允许无论错误来源如何，都能对数据进行相同的分析。\n\
  \n要建立 `JavaScript` 错误日志系统，你首先需要在服务器上准备一个可以处理错误数据的页面或入口。该页面只需要从查询字符串中获取数据并将其保存到错误日志中。该页面随后配合如下代码使用：\n\
  \n```\nfunction logError(sev, msg){\n    var img = new Image();\n    img.src = \"\
  log.php?sev=\" + encodeURIComponent(sev) + \"&msg=\" + \n              encodeURIComponent(msg);\n\
  }\n```\n\n`logError()` 函数接受两个参数：严重程度（severity）和错误消息。严重可以是数字可以是字符串，取决于你使用的系统。使用 `Image`\
  \ 对象来发送请求是因为它的灵活性，正如此处所述：\n\n* `Image` 对象在所有浏览器中可用，即使是那些不支持 `XMLHttpRequest` 对象的浏览器。\n\
  * 不存在跨域限制。通常有一个服务器负责处理来自多个服务器的错误日志，在这种情况下 `XMLHttpRequest` 将无法工作。\n* 在记录错误的过程中发生错误的概率较小。大多数\
  \ Ajax 通信通过 `JavaScript` 库提供的功能封装来处理。如果该库的代码失败，而你又尝试用它来记录错误，消息可能永远无法被记录。\n\n每当使用\
  \ `try-catch` 语句时，错误可能应该被记录。这是一个示例：\n\n```\nfor (var i=0, len=mods.length; i < len;\
  \ i++){\n    try {\n        mods[i].init();\n    } catch (ex){\n        logError(\"\
  nonfatal\", \"Module init failed: \" + ex.message);\n    }\n}\n```\n\n在此代码中，当模块初始化失败时会调用\
  \ `logError()`。第一个参数是 `\"nonfatal\"`，表示错误的严重程度，而消息提供了真实的错误消息。记录到服务器的错误消息应尽可能提供上下文信息，以帮助识别错误原因。\n\
  \n## 调试技术\n\n在 `JavaScript` 调试器广泛可用之前，开发者必须使用创意方法来调试代码。这导致了在代码中放置专门用于输出调试信息的代码。常见的调试技术是在代码中插入\
  \ `alert`，这既繁琐（因为调试后需要清理），如果遗留在生产环境的代码中，又很令人困扰。`alert` 不再推荐用于调试，因为有了其他更优雅的解决方案。\n\
  \n### 将消息记录到控制台\n\nInternet Explorer 8+、Firefox、Opera、Chrome 和 Safari 都有用于查看 `JavaScript`\
  \ 错误的控制台。这三者还允许从代码直接向控制台写入。为了在 Firefox 3.6 或更早版本中实现此功能，你需要安装 Firebug ([www.getfirebug.com](http://www.getfirebug.com))，因为\
  \ Firefox 使用的是 Firebug 控制台。Internet Explorer 8+、Firefox、Chrome、Safari 和 Opera 10.5\
  \ 允许通过 `console` 对象写入 `JavaScript` 控制台，该对象具有以下方法：\n\n* `error(message)` —— 向控制台记录错误消息\n\
  * `info(message)` —— 向控制台记录信息消息\n* `log(message)` —— 向控制台记录普通消息\n* `warn(message)`\
  \ —— 向控制台记录警告\n\n在 Internet Explorer 8、Firebug、Chrome、Safari 和 Opera 中，错误控制台上的消息显示取决于用于记录该消息的方法。错误消息包含红色图标，而警告包含黄色图标。可以使用控制台消息，如如下函数所示：\n\
  \n```\nfunction sum(num1, num2){\n    console.log(\"Entering sum(), arguments are\
  \ \" + num1 + \",\" + num2);\n\n    console.log(\"Before calculation\");\n    var\
  \ result = num1 + num2;\n    console.log(\"After calculation\");\n\n    console.log(\"\
  Exiting sum()\");\n    return result;\n}\n```\n\n\n\n\n当 `sum()` 函数被调用时，会有几条消息输出到\
  \ JavaScript 控制台以帮助调试。Safari JavaScript 控制台可以通过“开发”菜单（之前讨论过）打开；Chrome JavaScript\
  \ 控制台通过点击“控制此页”按钮并选择“开发者 JavaScript 控制台”来打开（之前也讨论过）；Firebug 控制台则通过点击 Firefox 状态栏右下角的图标访问。Internet\
  \ Explorer 8 控制台是“开发者工具”扩展的一部分，在“工具”菜单下可用；控制台位于“脚本（Script）”选项卡中。\n\n在 10.5 版本之前，Opera\
  \ 的 JavaScript 控制台只能通过使用 `opera.postError()` 方法访问。该方法接受一个参数，即要写入控制台的消息，其用法如下：\n\n\
  ```\nfunction sum(num1, num2){\n    opera.postError(\"Entering sum(), arguments\
  \ are \" + num1 + \",\" + num2);\n\n    opera.postError(\"Before calculation\");\n\
  \    var result = num1 + num2;\n    opera.postError(\"After calculation\");\n\n\
  \    opera.postError(\"Exiting sum()\");\n    return result;\n}\n```\n\n尽管 `opera.postError()`\
  \ 方法的名字如此，但它仍可以用于向 JavaScript 控制台写入任何类型的信息。\n\n另一个选项是使用 LiveConnect，即从 JavaScript\
  \ 运行 Java 代码的能力。Firefox、Safari 和 Opera 都支持 LiveConnect 并可能与 Java 控制台交互。可以使用以下代码通过\
  \ JavaScript 向 Java 控制台写入消息：\n\n```\njava.lang.System.out.println(\"Your message\"\
  );\n```\n\n它可以替代 `console.log()` 或 `opera.postError()`，如下例所示：\n\n```\nfunction sum(num1,\
  \ num2){\n    java.lang.System.out.println(\"Entering sum(), arguments are \" +\
  \ num1 +                                  \n                                   \
  \                                 num2);\n\n    java.lang.System.out.println(\"\
  Before calculation\");\n    var result = num1 + num2;\n    java.lang.System.out.println(\"\
  After calculation\");\n\n    java.lang.System.out.println(\"Exiting sum()\");\n\
  \    return result;\n}\n```\n\n根据系统设置，一旦进行 LiveConnect 调用，Java 控制台可能会立即显示。在 Firefox\
  \ 中可以在“工具”菜单下找到 Java 控制台，在 Opera 中可以在“工具 ⇒ 高级”菜单下找到。Safari 没有内置打开 Java 控制台的支持；你必须单独运行它。\n\
  \n由于目前没有真正的跨浏览器支持向 JavaScript 控制台写入内容，以下函数统一了接口：\n\n![image](img/logo1.gif)\n\n\
  ```\nfunction log(message){\n    if (typeof console == \"object\"){\n        console.log(message);\n\
  \    } else if (typeof opera == \"object\"){\n        opera.postError(message);\n\
  \    } else if (typeof java == \"object\" && typeof java.lang == \"object\"){\n\
  \        java.lang.System.out.println(message);\n    }\n}\n```\n\nConsoleLoggingExample01.htm\n\
  \n`log()` 函数检测哪个可用的 JavaScript 控制台接口并使用相应的接口。该函数可以安全地在所有浏览器中使用而不会引起任何错误，如下例所示：\n\
  \n```\nfunction sum(num1, num2){\n    log(\"Entering sum(), arguments are \" + num1\
  \ + \",\" + num2);\n\n    log(\"Before calculation\");\n    var result = num1 +\
  \ num2;\n    log(\"After calculation\");\n\n    log(\"Exiting sum()\");\n    return\
  \ result;\n}\n```\n\nConsoleLoggingExample01.htm\n\n将消息记录到 JavaScript 控制台对调试代码很有帮助，但在代码进入生产环境时应移除所有消息。这可以通过部署中的代码处理步骤自动完成，也可以手动完成。\n\
  \n![image](img/pen.gif)\n\n记录消息被认为比使用 `alerts` 更好的调试方法，因为 `alerts` 会中断程序的执行，这可能会影响代码的结果，因为异步过程的时机会受到影响。\n\
  \n## 向页面记录消息\n\n记录调试消息的另一种常见方法是指定页面上一个写入消息的区域。这可能是一个始终包含但仅用于调试目的元素，也是一个仅在需要时创建的元素。例如，可以将\
  \ `log()` 函数更改为：\n\n![image](img/logo1.gif)\n\n```\nfunction log(message){     \
  \               \n    var console = document.getElementById(\"debuginfo\");\n  \
  \  if (console === null){\n        console = document.createElement(\"div\");\n\
  \        console.id = \"debuginfo\";\n        console.style.background = \"#dedede\"\
  ;\n        console.style.border = \"1px solid silver\";\n        console.style.padding\
  \ = \"5px\";\n        console.style.width = \"400px\";\n        console.style.position\
  \ = \"absolute\";\n        console.style.right = \"0px\";\n        console.style.top\
  \ = \"0px\";\n        document.body.appendChild(console);\n    }\n    console.innerHTML\
  \ += \"<p>\" + message + \"</p>\";\n}\n```\n\nPageLoggingExample01.htm\n\n在这个新版本的\
  \ `log()` 中，代码首先检查调试元素是否已存在。如果没有，则创建一个新的 `<div>` 元素并分配样式信息以与页面其他部分分开。之后，使用 `innerHTML`\
  \ 将消息写入 `<div>` 中。结果是页面上一个显示日志信息的小区域。当在 Internet Explorer 7 及之前的版本或其他不支持 JavaScript\
  \ 控制台的浏览器中调试代码时，这种方法可能有用。\n\n![image](img/pen.gif)\n\n与控制台记录一样，页面记录代码在生产环境之前应移除。\n\
  \n## 抛出异常\n\n如之前提到的，抛出异常是调试代码的一种极方法。如果错误消息足够具体，只需看到错误可能就足够了。良好的错误消息的关键在于它们提供关于原因的准确信息，从而减少调试工作。考虑以下函数：\n\
  \n```\nfunction divide(num1, num2){\n    return num1 + num2;\n}\n```\n\n这个简单的函数除两个数字，但如果其中一个参数不是数字，它将返回\
  \ `NaN`。简单计算在 Web 应用中返回 `NaN` 时会导致问题。你可以在尝试计算之前检查每个参数的类型。考虑以下示例：\n\n```\nfunction\
  \ divide(num1, num2){\n    if (typeof num1 != \"number\" || typeof num2 != \"number\"\
  ){\n        throw new Error(\"divide(): Both arguments must be numbers.\");\n  \
  \  }\n    return num1 + num2;\n}\n```\n\n在这里，如果两个参数不是数字，就会抛出异常。错误消息提供了函数名称和错误的准确原因。当浏览器报告此错误消息时，它立即提供了问题的起点以及问题的概述。这比处理模糊的浏览器错误容易得多。\n\
  \n在大型应用程序中，通常使用 `assert()` 函数抛出自定义异常。此类函数接收一个应该为真的条件，如果条件为假，则抛出异常。以下是一个非常基本的 `assert()`\
  \ 函数：\n\n![image](img/logo1.gif)\n\n```javascript\nfunction assert(condition, message){\n\
  \    if (!condition){\n        throw new Error(message);\n    }\n}\n```\n\nAssertExample01.htm\n\
  \n`assert()` 函数可以替代函数中的多个 `if` 语句，并可以作为错误记录的良好位置。该函数的用法如下：\n\n```\nfunction divide(num1,\
  \ num2){\n    assert(typeof num1 == \"number\" && typeof num2 == \"number\", \n\
  \           \"divide(): Both arguments must be numbers.\");\n    return num1 + num2;\n\
  }\n```\n\nAssertExample01.htm\n\n使用 `assert()` 函数减少了抛出自定义异常所需的代码量，与之前的示例相比，它更具可读性。\n\
  \n## 常见 INTERNET EXPLORER 错误\n\n\n\n\nInternet Explorer 传统上一直是最难调试 JavaScript 错误的浏览器之一。该浏览器的错误信息通常非常短且令人困惑，提供的上下文极少或没有。由于\
  \ Internet Explorer 是最流行的网络浏览器，它的错误往往会受到最多的关注。以下章节列出了可能发生的常见且难以调试的 JavaScript 错误列表。\n\
  \n# 操作中止 (Operation Aborted)\n\n在 8 之前的 Internet Explorer 版本中，可能有所有浏览器中最令人困惑、最恼人且最难调试的错误之一：操作中止错误。当页面尚未完全加载的某部分正在被修改时，就会发生操作中止错误。结果是弹出一个显示“Operation\
  \ aborted”（操作中止）的模态对话框。点击 OK 按钮后，整个网页将被卸载并被空白屏幕替换，这使得调试变得非常困难。以下示例页面会导致操作中止错误：\n\
  \n```\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Operation Aborted Example</title>\n\
  </head>\n<body>\n    <p>以下代码在 8 之前的 IE 版本中应该导致 Operation Aborted 错误。</p>\n    <div>\n\
  \        <script type=\"text/javascript\">        \n            document.body.appendChild(document.createElement(\"\
  div\"));    \n        </script>\n    </div>\n</body>\n</html>\n```\n\n`OperationAbortedExample01.htm`\n\
  \n此示例中的问题是 JavaScript 代码试图在 `document.body` 完全加载之前对其进行修改，并且 `<script>` 元素不是 `<body>`\
  \ 元素的直接子元素。具体来说，当 `<script>` 节点包含在一个元素内部，且 JavaScript 代码尝试使用 `appendChild()`、`innerHTML`\
  \ 或任何其他假设元素已完全加载的 DOM 方法修改该元素的父元素或祖元素时，就会发生此错误。\n\n你可以通过两种方式来解决这个问题：要么在尝试操作元素之前等待其完全加载，要么使用不同的操作方法。例如，在\
  \ `document.body` 上添加在页面上绝对定位的覆盖层是常见的做法。这些额外元素通常是通过使用 `appendChild()` 添加的，但可以很容易更改为使用\
  \ `insertBefore()`。之前的示例可以通过更改一行代码来重写以避免操作中止错误，如下：\n\n![image](img/logo1.gif)\n\n\
  ```\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Operation Aborted Example</title>\n\
  </head>\n<body>\n    <p>以下代码在 8 之前的 IE 版本中不应该导致 Operation Aborted 错误。</p>\n    <div>\n\
  \        <script type=\"text/javascript\">        \n            document.body.insertBefore(document.createElement(\"\
  div\"),\n                                       document.body.firstChild);    \n\
  \        </script>\n    </div>\n</body>\n</html>\n```\n\n`OperationAbortedExample02.htm`\n\
  \n在此示例中，新的 `<div>` 元素被添加到 `document.body` 的开头而不是结尾。这不会导致错误，因为在脚本运行时，完成操作操作所需信息都是可用的。\n\
  \n另一个选项是移动 `<script>` 元素，使其成为 `<body>` 的直接子元素。考虑以下示例：\n\n![image](img/logo1.gif)\n\
  \n```\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Operation Aborted Example</title>\n\
  </head>\n<body>\n    <p>以下代码在 8 之前的 IE 版本中不应该导致 Operation Aborted 错误。</p>\n    <div>\n\
  \    </div>\n    <script type=\"text/javascript\">        \n        document.body.appendChild(document.createElement(\"\
  div\"));    \n    </script>\n</body>\n</html>\n```\n\n`OperationAbortedExample03.htm`\n\
  \n在这里，没有发生操作中止错误，因为脚本正在修改它的直接父元素而不是祖元素。\n\nInternet Explorer 8 及更高版本不再抛出操作中止错误，而是抛出带有以下消息的常规\
  \ JavaScript 错误：\n\n```\nHTML Parsing Error: Unable to modify the parent container\
  \ element before the child element is closed (KB927917).\n```\n\n尽管浏览器的反应不同，但解决问题的方法相同的。\n\
  \n# 无效字符 (Invalid Character)\n\nJavaScript 文件的语法必须由某些字符组成。当 JavaScript 文件中检测到无效字符时，IE\
  \ 会抛出“invalid character”（无效字符）错误。无效字符是任何未定义为 JavaScript 语法部分的字符。例如，有一个字符看起来像减号，但由\
  \ Unicode 值 8211 (`\\u2013`）表示。该字符不能代替普通的减号（ASCII 码为 45），因为它不是 JavaScript 语法的一部分。这种特殊字符经常会被自动插入\
  \ Microsoft Word 文档中，因此如果你将在 Word 中编写的代码复制到文本编辑器并在 Internet Explorer 中运行，你将获得非法字符错误。其他浏览器的反应类似：Firefox\
  \ 抛出“illegal character”错误，Safari 报告语法错误，而 Opera 则报告 `ReferenceError`，因为它将该字符解释为未定义的标识符。\n\
  \n# 成员未找到 (Member Not Found)\n\n如前所述，Internet Explorer 中的所有 DOM 对象都实现为 COM 对象，而不是原生\
  \ JavaScript。这在涉及垃圾回收时可能会导致非常奇怪的行为。“member not found”（成员未找到）错误是 Internet Explorer\
  \ 中不匹配的垃圾回收例的直接结果。\n\n此错误通常发生在你尝试在对象已被销毁后给对象属性赋值时。该对象必须是 COM 对象才会得到此特定的错误消息。这种情况最好的例子是使用事件对象时。Internet\
  \ Explorer 事件对象作为 `window` 的属性存在，并在事件发生时创建，在事件处理程序执行完毕后销毁。如果你在稍后执行的闭包中使用事件对象，任何对属性的赋值都会导致此错误，如下：\n\
  \n```\ndocument.onclick = function(){\n    var event = window.event;\n    setTimeout(function(){\n\
  \        event.returnValue = false;    // 找到错误\n    }, 1000);\n};\n```\n\n在此代码中，为\
  \ document 分配了一个点击处理程序。它将 `window.event` 存储在局部变量 `event` 中。该事件变量随后被 `setTimeout`\
  \ 中的闭包引用。当 onclick 事件处理程序退出时，事件对象被销毁，因此闭包中的引用指向一个不存在的对象。对 `returnValue` 赋值会导致“member\
  \ not found”错误，因为你无法向已销毁成员的 COM 对象写入。\n\n# 未知运行时错误 (Unknown Runtime Error)\n\n当通过以下方式使用\
  \ `innerHTML` 或 `outerHTML` 属性赋值 HTML 时，如果块元素被插入到内联元素中，或者你正在访问表格的任何部分（`<table>`、`<tbody>`\
  \ 等）。例如，`<p>` 标签在技术上不能包含块级元素（如 `<div>`），因此以下代码会导致未知运行时错误：\n\n```\np.innerHTML =\
  \ \"<div>Hi</div>\";   //其中 p 包含一个 <p> 元素\n```\n\n其他浏览器在错误位置插入块元素时尝试纠错以防止发生错误，但\
  \ Internet Explorer 在这方面严格得多。\n\n# 语法错误 (Syntax Error)\n\n当 Internet Explorer 报告语法错误时，原因通常显而易见。你通常可以将错误追溯到缺失的分号或多余的大括号。然而，还有另一种情况会发生语法错误，但这种错误可能并不显而易见。\n\
  \n\n\n\n如果你引用的外部 JavaScript 文件由于某种原因返回了非 JavaScript 代码，Internet Explorer 会抛出语法错误。例如，如果你将\
  \ `<script>` 标签的 `src` 属性指向一个 HTML 文件，就会发生语法错误。该语法错误通常被报告为脚本的第一行和第一个字符。Opera 和 Safari\
  \ 也会报告语法错误，但它们还会报告导致问题的被引文件。Internet Explorer 不提供此类信息，因此你需要双检每个外部引用的 JavaScript\
  \ 文件。Firefox 则简单地忽略了作为 JavaScript 包含的非 JavaScript 文件中的任何解析错误。\n\n这种类型的错误通常发生在服务器端组件动态生成\
  \ JavaScript 的时候。许多服务器端语言在发生运行时错误时会自动将 HTML 插入到输出中，而这种输出会明显破坏 JavaScript 语法。如果你在追踪语法错误时遇到困难，请双检每个外部\
  \ JavaScript 文件，以确保其中不包含服务器因错误插入的 HTML。\n\n## 系统无法找到指定的资源\n\n“系统无法找到指定的资源”可能是没用的错误消息之一。当使用\
  \ JavaScript 通过 URL 请求资源，且 URL 超过了 Internet Explorer 2083 个字符的最大 URL 长度时，就会发生此错误。此\
  \ URL 长度限制不仅适用于 JavaScript，也适用于整个 Internet Explorer。（其他浏览器对 URL 长度的限制并不紧）。此外 2048\
  \ 字符的 URL 路径限制。以下示例会导致此错误：\n\n![image](img/logo1.gif)\n\n```\nfunction createLongUrl(url){\n\
  \    var s = \"?\";\n    for (var i=0, len=2500; i < len; i++){\n        s += \"\
  a\";\n    }\n\n    return url + s;\n}\n\nvar x = new XMLHttpRequest();\nx.open(\"\
  get\", createLongUrl(\"http://www.somedomain.com/\"), true);\nx.send(null);\n```\n\
  \nLongURLErrorExample01.htm\n\n在这段代码中，`XMLHttpRequest` 对象尝试对超过最大 URL 限制的 URL 发请求。错误在调用\
  \ `open()` 时发生。此类错误的变通方法是缩短请求成功所需的查询字符串，可以通过减少命名查询参数的大小或消除不必要的数据来实现。另一种解决方法是将请求更改为\
  \ POST，并将数据作为请求体发送，而不是放在查询字符串中。`Ajax`、`XMLHttpRequest` 对象以及此类问题将在第 21 章中详细讨论。\n\n\
  # 总结\n\nJavaScript 中的错误处理对于当今复杂的 Web 应用至关重要。未能预判错误可能发生的位置以及如何从中恢复会导致糟糕的用户体验，并可能让用户感到沮丧。大多数浏览器默认不会向用户报告\
  \ JavaScript 错误，因此在开发和调试时你需要启用错误报告。然而，在生产环境中，不应以这种方式报告任何错误。\n\n可以使用以下方法防止浏览器对 JavaScript\
  \ 错误做出反应：\n\n* 可以在可能发生错误的地方使用 `try-catch` 语句，让你有机会以适当的方式响应错误，而不是让浏览器来处理错误。\n* 另一个选项是使用\
  \ `window.onerror` 事件处理程序，它可以接收所有未被 `try-catch` 处理的错误（仅限 Internet Explorer、Firefox\
  \ 和 Chrome）。\n\n每个 Web 应用程序都应该经过检查，以确定错误可能发生的位置以及如何处理这些错误：\n\n*   需要预先确定什么是致命错误或非致命错误。\n\
  *   之后，可以评估代码以确定最可能发生错误的地方。JavaScript 中的错误通常由于由于以下因素引起：\n    *   类型转换\n    *   数据类型检查不足\n\
  \    *   发送到服务器或从服务器接收了错误的数据\n\nInternet Explorer、Firefox、Chrome、Opera 和 Safari\
  \ 各都有一个自带或可作为插件下载的 JavaScript 调试器。每个调试器都提供了设置断点、控制代码执行以及在运行时检查变量值的能力。\n\n## 第 18\
  \ 章\n\n### JavaScript 中的 XML\n\n### 本章内容？\n\n*   检查浏览器对 XML DOM 的支持\n*   理解 JavaScript\
  \ 中的 XPath\n*   使用 XSLT 处理器\n\n在过去的某时期，XML 是互联网上结构化数据存储和传输的标准。XML 的演进紧密反映了 Web 技术的演进，因为\
  \ DOM 的开发不仅用于 Web 浏览器，还用于桌面和服务器应用程序，以处理 XML 数据结构。由于缺乏内置解决方案，许多开发者开始在 JavaScript\
  \ 中编写自己的 XML 解析器。从那时起，所有浏览器都引入了对 XML、XML DOM 及其许多相关技术的原生支持。\n\n### 浏览器对 XML DOM\
  \ 的支持\n\n由于浏览器厂商在正式标准创建之前就开始实现 XML 解决方案，每家厂商不仅提供了不同程度的支持，还提供了不同的实现。DOM Level 2 是第一个引入动态\
  \ XML DOM 创建概念的规范。这一功能在 DOM Level 3 中得到了扩展，包含了解析和序列化。然而，到 DOM Level 3 定稿时，大多数浏览器已经实现了自己的解决方案。\n\
  \n#### DOM Level 2 \n\n如第 12 章所示，DOM Level 2 引入了 `document.implementation` 的 `createDocument()`\
  \ 方法。Internet Explorer 9+、Firefox、Opera、Chrome 和 Safari 都支持此方法。你可能记得可以使用语法创建一个空白\
  \ XML 文档：\n\n```\nvar xmldom = document.implementation.createDocument(namespaceUri,\
  \ root, doctype); \n```\n\n在 JavaScript 中处理 XML 时，`root` 参数通常是唯一使用的参数，因为它定义了 XML\
  \ DOM 文档元素的标签名称。`namespaceUri` 参数使用较少，因为命名空间很难管理。`doctype` 参数很少甚至从不使用。\n\n要创建一个具有\
  \ `<root>` 元素的新 XML 文档，可以使用以下代码：\n\n![image](img/logo1.gif)\n\n```\nvar xmldom =\
  \ document.implementation.createDocument(\"\", \"root\", null);\n\nalert(xmldom.documentElement.tagName);\
  \  //\"root\"\n\nvar child = xmldom.createElement(\"child\");\nxmldom.documentElement.appendChild(child);\n\
  ```\n\nDOMLevel2CoreExample01.htm\n\n此示例创建了一个没有默认命名空间和 doctype 的 XML 文档。注意，即使不需要命名空间和\
  \ doctype，也必须传递参数。`xmldom` 变量包含一个 DOM Level 2 Document 实例，包含了第 12 章讨论的所有 DOM 方法和属性。在此示例中，显示了元素元素的名称，然后创建并添加了一个新的子元素。\n\
  \n可以使用以下代码行检查浏览器是否启用了 DOM Level 2 XML 支持：\n\n```\nvar hasXmlDom = document.implementation.hasFeature(\"\
  XML\", \"2.0\");\n```\n\n在实践中，很少从零开始创建一个 XML 文档然后使用 DOM 方法系统地构建它。更有可能的情况是将 XML 文档解析为\
  \ DOM 结构，或者反之。由于 DOM Level 2 没有提供此类功能，出现了一些事实上的标准。\n\nDOMParser 类型\n\n\n\n\nFirefox\
  \ 引入了 `DOMParser` 类型，专门用于将 XML 解析为 DOM 文档，随后被 Internet Explorer 9、Safari、Chrome\
  \ 和 Opera 采用。要使用它，你必须先创建一个 `DOMParser` 实例，然后调用 `parseFromString()` 方法。该方法接受两个参数：要解析的\
  \ XML 字符串和一个内容类型，内容类型应始终为 `\"text/xml\"`。返回值是一个 `Document` 实例。请考虑以下示例：\n\n```\n\
  var parser = new DOMParser();\nvar xmldom = parser.parseFromString(\"<root><child/></root>\"\
  , \"text/xml\");\n\nalert(xmldom.documentElement.tagName);  //\"root\"\nalert(xmldom.documentElement.firstChild.tagName);\
  \ //\"child\"\n\nvar anotherChild = xmldom.createElement(\"child\");\nxmldom.documentElement.appendChild(anotherChild);\n\
  \nvar children = xmldom.getElementsByTagName(\"child\");\nalert(children.length);\
  \   //2\n```\n\n`DOMParserExample01.htm`\n\n在此示例中，一个简单的 XML 字符串被解析为 DOM 文档。DOM 结构以\
  \ `<root>` 作为文档元素，并有一个 `<child>` 元素作为其子元素。然后你可以使用 DOM 方法与返回的文档进行交互。\n\n`DOMParser`\
  \ 只能解析格式良好的 XML，因此无法将 HTML 解析为 HTML 文档。遗憾的是，浏览器在发生解析错误时的行为各。。当 Firefox、Opera、Safari\
  \ 和 Chrome 发生解析错误时，`parseFromString()` 仍然返回一个 `Document` 对象，但其文档元素是 `<parsererror>`，该元素的内容是对解析错误的描述。以下是一个示例：\n\
  \n```\n<parsererror xmlns=\"http://www.mozilla.org/newlayout/xml/parsererror.xml\"\
  >XML Parsing Error: no element found Location: file:///I:/My%20Writing/My%20Books/Professional%20JavaScript/Second%20Edition/Examples/Ch15/DOMParserExample2.htm\
  \ Line Number 1, Column 7:<sourcetext>&lt;root&gt; ------^</sourcetext></parsererror>\n\
  ```\n\nFirefox 和 Opera 都返回这种格式的文档。Safari 和 Chrome 返回的文档在解析错误发生的地方嵌入了 `<parsererror>`\
  \ 元素。Internet Explorer 9 在调用 `parseFromString()` 的位置抛出解析错误。由于这些差异，确定是否发生解析错误的最佳方法是使用\
  \ `try-catch` 块，如果没有错误，通过 `getElementsByTagName()` 在文档的任何地方查找 `<parsererror>` 元素，如下：\n\
  \n![image](img/logo1.gif)\n\n```\nvar parser = new DOMParser(),\n    xmldom, \n\
  \    errors;\ntry {\n    xmldom = parser.parseFromString(\"<root>\", \"text/xml\"\
  );\n    errors = xmldom.getElementsByTagName(\"parsererror\");\n    if (errors.length\
  \ > 0){\n        throw new Error(\"Parsing error!\");\n    }\n} catch (ex) {\n \
  \   alert(\"Parsing error!\");\n}\n```\n\n`DOMParserExample02.htm`\n\n在此示例中，要解析的字符串缺少闭合的\
  \ `</root>` 标签，这导致了解析错误。在 Internet Explorer 9+ 中，这会抛出一个错误。在 Firefox 和 Opera 中，`<parsererror>`\
  \ 元素是文档元素，而在 Chrome 和 Safari 中，它是第一个子元素 `<root>`。调用 `getElementsByTagName(\"parsererror\"\
  )` 涵盖了两种情况。如果此方法调用返回了任何元素，则表示发生了错误并显示警报。你还可以进一步，从该元素中提取错误信息。\n\n## XMLSerializer\
  \ 类型\n\n作为 `DOMParser` 的伴侣，Firefox 还引入了 `XMLSerializer` 类型以提供反向功能：将 DOM 文档序列化为 XML\
  \ 字符串。从那时起，`XMLSerializer` 被 Internet Explorer 9+、Opera、Chrome 和 Safari 采用。\n\n\
  要序列化 DOM 文档，你必须创建一个新的 `XMLSerializer` 实例，然后将文档传递给 `serializeToString()` 方法，如下：\n\
  \n![image](img/logo1.gif)\n\n```\nvar serializer = new XMLSerializer();\nvar xml\
  \ = serializer.serializeToString(xmldom);\nalert(xml);\n```\n\n`XMLSerializerExample01.htm`\n\
  \n`serializeToString()` 返回的值是一个未经过格式打印的字符串，因此肉眼阅读可能困难。\n\n`XMLSerializer` 能够序列化任何有效的\
  \ DOM 对象，包括单个节点和 HTML 文档。当将 HTML 文档传递给 `serializeToString()` 时，会被视为 XML 文档，因此生成的代码是格式良好的。\n\
  \n![image](img/pen.gif)\n\n如果向 `serializeToString()` 方法传递了非 DOM 对象，则会抛出错误。\n\n##\
  \ Internet Explorer 8 及更早版本中的 XML\n\nInternet Explorer 实际上是第一个实现原生 XML 处理支持的浏览器，它是通过使用\
  \ ActiveX 对象实现的。微软创建了 `MSXML` 库来为桌面应用程序开发者提供 XML 处理能力，并没有为 JavaScript 创建不同的对象，而是通过浏览器启用对相同对象的访问。\n\
  \n在第 8 章中，你接触了 `ActiveXObject` 类型，它用于在 JavaScript 中实例化 ActiveX 对象。使用 `ActiveXObject`\
  \ 构造函数并传入 XML 文档版本的字符串标识符可以创建 XML 文档实例。有六种不同的 XML 文档对象，如下：\n\n*   `Microsoft.XmlDom`\
  \ — IE 初始版本；不应使用。\n*   `MSXML2.DOMDocument` 用于脚本的更新版本但仅作为应急备用。\n*   `MSXML2.DOMDocument.3.0`\
  \ —— JavaScript 使用的最低推荐版本。\n*   `MSXML2.DOMDocument.4.0` —— 不安全脚本。\n*   `MSXML2.DOMDocument.5.0`\
  \ —— 同样不安全脚本。\n*   `MSXML2.DOMDocument.6.0` —— 最新且最稳定的版本。\n\n你可以通过尝试创建每个版本来确定哪个版本可用。例如：\n\
  \n![image](img/logo1.gif)\n\n```\nfunction createDocument(){\n    if (typeof arguments.callee.activeXString\
  \ != \"string\"){\n        var versions = [\"MSXML2.DOMDocument.6.0\", \"MSXML2.DOMDocument.3.0\"\
  ,\n                        \"MSXML2.DOMDocument\"],\n            i, len;\n\n   \
  \     for (i=0,len=versions.length; i < len; i++){\n            try {\n        \
  \        new ActiveXObject(versions[i]);\n                arguments.callee.activeXString\
  \ = versions[i];\n                break;\n            } catch (ex){\n          \
  \      //跳过\n            }\n        }\n    }\n\n    return new ActiveXObject(arguments.callee.activeXString);\n\
  }\n```\n\n`IEXmlDomExample01.htm`\n\n在此函数中，使用 for 循环遍历可能的 ActiveX 版本。如果版本不可用，创建\
  \ `new ActiveXObject` 的调用将抛出错误，此时 `catch` 语句捕获错误并继续循环。如果没有发生错误，则将版本存储在函数的 `activeXString`\
  \ 属性中，这样每次调用函数时就不需要重复此过程，并返回创建的对象。\n\n要解析 XML 字符串，你必须先创建一个 DOM 文档，然后调用 `loadXML()`\
  \ 方法。当文档首次创建时，它是完全空的，因此无法进行交互。将 XML 字符串传递给 `loadXML()` 将 XML 解析到 DOM 文档中。\n\n\n\n\
  \n一旦 DOM 文档填充了 XML 内容，就可以像其他任何 DOM 文档一样对其进行交互，包括所有的方法和属性。\n\n解析错误由 `parseError`\
  \ 属性表示，该属性是一个包含多个与解析问题相关属性的对象。这些属性如下：\n\n- `errorCode`: 表示发生错误类型的数字代码，如果没有错误，则为\
  \ 0。\n- `filePos`: 错误发生在文件中的位置。\n- `line`: 错误发生的行数。\n- `linepos`: 错误所在行内的字符位置。\n\
  - `reason`: 错误的纯文本说明。\n- `srcText`: 导致错误的代码。\n- `url`: 引起错误的文件 URL（如果可用）。\n\n`parseError`\
  \ 的 `valueOf()` 方法返回 `errorCode` 的值，因此你可以使用以下代码来检查是否发生了解析错误：\n\n```\nif (xmldom.parseError\
  \ != 0){\n    alert(\"Parsing error occurred.\");\n}\n```\n\n错误代码可能是正数也可能是负数，因此你只需要检查它是否不等于\
  \ 0。解析错误的详细信息可以轻松获取，并用于指示更有用的错误信息，如下例所示：\n\n![image](img/logo1.gif)\n\n```\nif (xmldom.parseError\
  \ != 0){\n    alert(\"An error occurred:\\nError Code: \"\n          + xmldom.parseError.errorCode\
  \ + \"\\n\"\n          + \"Line: \" + xmldom.parseError.line + \"\\n\"\n       \
  \   + \"Line Pos: \" + xmldom.parseError.linepos + \"\\n\"\n          + \"Reason:\
  \ \" + xmldom.parseError.reason);\n}\n```\n\n### IEXmlDomExample02.htm\n\n在调用 `loadXML()`\
  \ 之后以及在尝试查询 XML 文档获取更多信息之前，你应该立即检查解析错误。\n\n## XML 序列化\n\nXML 序列化是内置在 Internet Explorer\
  \ 的 DOM 文档中的。每个节点都有一个 `xml` 属性，可以用于表示该节点的 XML 字符串，例如所示：\n\n```\nalert(xmldom.xml);\n\
  ```\n\n这种简单的序列化方法适用于文档中的每个节点，允许你序列化整个文档或特定的子树。\n\n## 加载 XML 文件\n\nInternet Explorer\
  \ 中的 XML 文档对象也可以从服务器加载文件。与 DOM Level 3 功能一样，XML 文档必须位于与运行 JavaScript 代码的页面相同的服务器上。与\
  \ DOM Level 3 类似，文档可以同步或异步加载。要确定使用哪种方法，请将 `async` 属性设置为 true 或 false（默认认为 true）。示例如下：\n\
  \n```\nvar xmldom = createDocument();\nxmldom.async = false;\n```\n\n一旦你确定了加载 XML\
  \ 文档的模式，调用 `load()` 就会启动下载过程。该方法接受一个参数，即要加载的 XML 文件的 URL。在同步模式下运行时，调用 `load()` 之后可以紧接着检查解析错误和其他\
  \ XML 处理，如下所示：\n\n![image](img/logo1.gif)\n\n```\nvar xmldom = createDocument();\n\
  xmldom.async = false;\nxmldom.load(\"example.xml\");\n\nif (xmldom.parseError !=\
  \ 0){\n    //handle error\n} else {\n    alert(xmldom.documentElement.tagName);\
  \  //\"root\"\n    alert(xmldom.documentElement.firstChild.tagName); //\"child\"\
  \n\n    var anotherChild = xmldom.createElement(\"child\");\n    xmldom.documentElement.appendChild(anotherChild);\n\
  \n    var children = xmldom.getElementsByTagName(\"child\");\n    alert(children.length);\
  \   //2        \n\n    alert(xmldom.xml);        \n}\n```\n\n### IEXmlDomExample03.htm\n\
  \n由于 XML 文件是同步处理的，代码执行将停止直到解析完成，这允许了简单的编码过程。虽然这可能很方便，但如果下载时间超过预期，也可能导致长时间延迟。XML\
  \ 文档通常异步加载以避免此类问题。\n\n当异步加载 XML 文件时，你需要为 XML DOM 文档分配一个 `onreadystatechange` 事件处理器。共有四种就绪状态：\n\
  \n- 1: DOM 正在加载数据。\n- 2: DOM 已完成数据加载。\n- 3: DOM 可能可以使用，尽管某些部分可能不可用。\n- 4: DOM 完全加载并准备好使用。\n\
  \n实际上，唯一感兴趣的就绪状态是 4，它表示 XML 文件已完全下载并解析为 DOM。你可以通过 `readyState` 属性获取 XML 文档的就绪状态。异步加载\
  \ XML 文件通常使用以下模式：\n\n![image](img/logo1.gif)\n\n```\nvar xmldom = createDocument();\n\
  xmldom.async = true;\n\nxmldom.onreadystatechange = function(){\n    if (xmldom.readyState\
  \ == 4){\n        if (xmldom.parseError != 0){\n            alert(\"An error occurred:\\\
  nError Code: \"\n                  + xmldom.parseError.errorCode + \"\\n\"\n   \
  \               + \"Line: \" + xmldom.parseError.line + \"\\n\"\n              \
  \    + \"Line Pos: \" + xmldom.parseError.linepos + \"\\n\"\n                  +\
  \ \"Reason: \" + xmldom.parseError.reason);\n        } else {\n            alert(xmldom.documentElement.tagName);\
  \  //\"root\"\n            alert(xmldom.documentElement.firstChild.tagName); //\"\
  child\"\n\n            var anotherChild = xmldom.createElement(\"child\");\n   \
  \         xmldom.documentElement.appendChild(anotherChild);\n\n            var children\
  \ = xmldom.getElementsByTagName(\"child\");\n            alert(children.length);\
  \   //2        \n\n            alert(xmldom.xml);        \n        }\n    }\n};\n\
  \nxmldom.load(\"example.xml\");\n```\n\n### IEXmlDomExample04.htm\n\n注意，`onreadystatechange`\
  \ 事件处理器的赋值必须在调用 `load()` 之前发生，以确保它能被调用。此外，在事件处理器内部，必须使用 XML 文档变量 `xmldom` 而不是此（ActiveX\
  \ 控制出于安全考虑不允许）。一旦文档状态变为 4，你就可以安全地检查是否存在解析错误。\n\n![image](img/pen.gif)\n\n虽然可以通过\
  \ DOM 文档加载 XML 文件，但通常接受使用 `XMLHttpRequest`。`XMLHttpRequest` 对象和通 Ajax 将在第 21 章讨论。\n\
  \n## 跨浏览器 XML 处理\n\n由于很少有开发者能够为单一浏览器开发，因此经常需要创建跨浏览器的函数。对于 XML 解析，以下函数适用于所有主流浏览器：\n\
  \n![image](img/logo1.gif)\n\n```\nfunction parseXml(xml){\n    var xmldom = null;\n\
  \n    if (typeof DOMParser != \"undefined\"){\n        xmldom = (new DOMParser()).parseFromString(xml,\
  \ \"text/xml\");\n        var errors = xmldom.getElementsByTagName(\"parsererror\"\
  );\n        if (errors.length){\n            throw new Error(\"XML parsing error:\"\
  \ + errors[0].textContent);\n        }                   \n\n    } else if (typeof\
  \ ActiveXObject != \"undefined\"){\n        xmldom = createDocument();\n       \
  \ xmldom.loadXML(xml);\n        if (xmldom.parseError != 0){\n            throw\
  \ new Error(\"XML parsing error: \" + xmldom.parseError.reason);\n        }\n\n\
  \    } else {\n        throw new Error(\"No XML parser available.\");\n    }\n\n\
  \    return xmldom;\n}\n```\n\n### CrossBrowserXmlExample01.htm\n\n`parseXml()`\
  \ 函数接受一个参数（要解析的 XML 字符串），然后使用功能检测来确定使用哪种 XML 解析模式。由于 `DOMParser` 类型是最流行的解决方案，函数首先测试其是否可用。如果是，将创建一个新的\
  \ `DOMParser` 对象并将 XML 字符串解析到 `xmldom` 变量中。由于 `DOMParser` 在 Internet Explorer 9+\
  \ 不会为解析错误抛出异常，因此需要对返回的文档进行检查，如果发现错误，则抛出一个异常。\n\n\n\n函数的最后一部分检查对 ActiveX 的支持，并使用之前定义的\
  \ `createDocument()` 函数使用正确的签名创建一个 XML 文档。与 `DOMParser` 一样，会对结果进行检查以判断解析错误。如果发现错误，将抛出一个指示所报告描述的错误。\n\
  \n如果没有可用的 XML 解析器，该函数将简单抛出一个错误，指示无法继续。\n\n此函数可用于解析任何 XML 字符串，并且应该始终封装在 `try-catch`\
  \ 语句中，以防发生解析错误。这是一个示例：\n\n![image](img/logo1.gif)\n\n```\nvar xmldom = null;\n\n\
  try {\n    xmldom = parseXml(\"<root><child/></root>\");\n} catch (ex){\n    alert(ex.message);\n\
  }\n\n//further processing\n```\n\nCrossBrowserXmlExample01.htm\n\n对于 XML 序列化，可以按照相同的过程编写一个可在四个主要浏览器中运行的函数。例如：\n\
  \n```javascript\nfunction serializeXml(xmldom){\n\n    if (typeof XMLSerializer\
  \ != \"undefined\"){\n        return (new XMLSerializer()).serializeToString(xmldom);\n\
  \n    } else if (typeof xmldom.xml != \"undefined\"){\n        return xmldom.xml;\n\
  \n    } else {\n        throw new Error(\"Could not serialize XML DOM.\");\n   \
  \ }\n}\n```\n\nCrossBrowserXmlExample02.htm\n\n`serializeXml()` 函数接受一个参数，即要序列化的\
  \ XML DOM 文档。与 `parseXml()` 函数一样，第一步是检查最广泛支持的解决方案，即 `XMLSerializer`。如果该类型可用，则使用它来返回文档的\
  \ XML 字符串。由于 ActiveX 方法只是简单地使用 `xml` 属性，该函数会专门检查该属性。如果这三次尝试均失败，则该方法将抛出一个错误，指示无法进行序列化。通常情况下，如果你为浏览器使用了适当的\
  \ XML DOM 对象，序列化尝试不应该失败，因此没有必要将 `serializeXml()` 的调用封装在 `try-catch` 中。相反，你只需要这样使用：\n\
  \n```javascript\nvar xml = serializeXml(xmldom);\n```\n\n请注意，由于序列化逻辑的差异，不同浏览器之间的序列化结果可能并不完全相同。\n\
  \n# 浏览器中的 XPath 支持\n\nXPath 的创建是为了在 DOM 文档中定位特定节点的方法，因此对 XML 处理至关重要。直到 DOM Level\
  \ 3 之前，XPath 的 API 并不是规范的一部分，它引入了 DOM Level 3 XPath 推荐。许多浏览器选择实现此规范，但 Internet Explorer\
  \ 决定以自己的方式实现支持。\n\n## DOM Level 3 XPath\n\nDOM Level 3 XPath 规范定义了在 DOM 中评估 XPath\
  \ 表达式的接口。要判断浏览器是否支持 DOM Level 3 XPath，请使用以下 JavaScript 代码：\n\n```javascript\nvar\
  \ supportsXPath = document.implementation.hasFeature(\"XPath\", \"3.0\");\n```\n\
  \n尽管规范中定义了多种类型，但最重要的两个是 `XPathEvaluator` 和 `XPathResult`。`XPathEvaluator` 用于在特定上下文中评估\
  \ XPath 表达式。该类型具有以下三个方法：\n\n* `createExpression(expression, nsresolver)` — 将 XPath\
  \ 表达式及随的命名空间信息计算为 `XPathExpression`，这是查询的编译版本。如果同一个查询将运行多次，则这非常有用。\n* `createNSResolver(node)`\
  \ — 根据节点的命名空间信息创建一个新的 `XPathNSResolver` 对象。在对使用命名空间的 XML 文档进行评估时，需要一个 `XPathNSResolver`\
  \ 对象。\n* `evaluate(expression, context, nsresolver, type, result)` — 在给定的上下文和特定的命名空间信息下评估\
  \ XPath 表达式。附加参数指示了如何返回结果。\n\n在 Firefox、Safari、Chrome 和 Opera 中，`Document` 类型通常使用\
  \ `XPathEvaluator` 接口实现。因此，你可以创建 `XPathEvaluator` 的新实例，也可以使用位于 `Document` 实例上的方法（同时适用于\
  \ XML 和 HTML 文档）。\n\n三个方法中，`evaluate()` 是最常用的。该方法接受五个参数：XPath 表达式、上下文节点、命名空间解析器、要返回的结果类型，以及用于填充结果的\
  \ `XPathResult` 对象（通常为 null，因为结果也会作为函数的返回值返回）。第三个参数命名空间解析器仅在 XML 代码使用 XML 命名空间时才是必需的。如果没有使用命名空间，则应将其设置为\
  \ `null`。第四个参数（要返回的结果类型）是以下 10 个常量值之一：\n\n* `XPathResult.ANY_TYPE` — 返回适用于 XPath\
  \ 表达式的数据类型。\n* `XPathResult.NUMBER_TYPE` — 返回数字值。\n* `XPathResult.STRING_TYPE` —\
  \ 返回字符串值。\n* `XPathResult.BOOLEAN_TYPE` — 返回布尔值。\n* `XPathResult.UNORDERED_NODE_ITERATOR_TYPE`\
  \ — 返回匹配节点的节点集，尽管顺序可能与文档内节点的顺序不一致。\n* `XPathResult.ORDERED_NODE_ITERATOR_TYPE` —\
  \ 按照节点在文档中出现的顺序返回匹配节点的节点集。这是最常用的结果类型。\n* `XPathResult.UNORDERED_NODE_SNAPSHOT_TYPE`\
  \ — 返回节点集快照，捕获文档外的节点，以便任何后续的文档修改都不会影响该节点集。节点集中的节点并不一定与其在文档中出现的顺序相同。\n* `XPathResult.ORDERED_NODE_SNAPSHOT_TYPE`\
  \ — 返回节点集快照，捕获文档外的节点，以便任何后续的文档修改都不会影响该节点集。节点集中的节点与其在文档中出现的顺序一致。\n* `XPathResult.ANY_TYPE`\
  \ — 返回匹配节点的节点集，尽管顺序可能与文档内节点的顺序不一致。\n* `XPathResult.FIRST_ORDERED_NODE_TYPE` — 返回包含节点的节点集，即文档中的第一个匹配节点。\n\
  \n你指定的结果类型决定了如何获取结果。这是一个典型的示例：\n\n![image](img/logo1.gif)\n\n```javascript\nvar\
  \ result = xmldom.evaluate(\"employee/name\", xmldom.documentElement, null, \n \
  \                                 XPathResult.ORDERED_NODE_ITERATOR_TYPE, null);\n\
  \nif (result !== null) {\n    var element = result.iterateNext();\n    while(element)\
  \ {\n        alert(element.tagName);\n        element = result.iterateNext();\n\
  \    }\n}\n```\n\nDomXPathExample01.htm\n\n\n\n\n`XPathResult.FIRST_ORDERED_NODE_TYPE`\
  \ 结果返回第一个匹配的节点，可以通过结果的 `singleNodeValue` 属性访问。例如：\n\n![image](img/logo1.gif)\n\n\
  ```javascript\nvar result = xmldom.evaluate(\"employee/name\", xmldom.documentElement,\
  \ null, \n                                  XPathResult.FIRST_ORDERED_NODE_TYPE,\
  \ null);\n\nif (result !== null) {\n    alert(result.singleNodeValue.tagName);\n\
  }\n```\n\nDomXPathExample03.htm\n\n与其他查询一样，当没有匹配的节点时，`evaluate()` 返回 `null`。如果返回了节点，则使用\
  \ `singleNodeValue` 属性进行访问。对于 `XPathResult.FIRST_ORDERED_NODE_TYPE` 也是如此。\n\n##\
  \ 简单类型结果\n\n也可以使用 `XPathResult` 的 `Boolean`、`number` 和 `string` 类型从 XPath 检索简单的非节点数据类型。这些结果类型分别通过\
  \ `booleanValue`、`numberValue` 和 `stringValue` 属性返回单个值。对于 `Boolean` 类型，如果至少有一个节点匹配\
  \ XPath 表达式，评估通常返回 `true`，否则返回 `false`。考虑以下内容：\n\n```javascript\nvar result = xmldom.evaluate(\"\
  employee/name\", xmldom.documentElement, null, \n                              \
  \    XPathResult.BOOLEAN_TYPE, null);\nalert(result.booleanValue);\n```\n\nDomXPathExample04.htm\n\
  \n在此示例中，如果任何节点匹配 \"employee/name\"，则 `booleanValue` 属性将等于 `true`。\n\n对于 `number`\
  \ 类型，XPath 表达式必须使用返回数字的 XPath 函数，例如 `count()`，它会统计匹配给定模式的所有节点。这里有一个示例：\n\n```javascript\n\
  var result = xmldom.evaluate(\"count(employee/name)\", xmldom.documentElement, \n\
  \                                  null, XPathResult.NUMBER_TYPE, null);\nalert(result.numberValue);\n\
  ```\n\nDomXPathExample05.htm\n\n此代码输出匹配 \"employee/name\" 的节点数量（结果为 2）。如果你尝试在不使用特殊\
  \ XPath 函数的情况下使用此方法，`numberValue` 将等于 `NaN`。\n\n对于 `string` 类型，`evaluate()` 方法会找到匹配\
  \ XPath 表达式的第一个节点，然后返回第一个子节点的值，假设第一个子节点是文本节点。如果不是，则结果为空字符串。\n\n![image](img/logo1.gif)\n\
  \n```javascript\nvar result = xmldom.evaluate(\"employee/name\", xmldom.documentElement,\
  \ null, \n                                  XPathResult.STRING_TYPE, null);\nalert(result.stringValue);\n\
  ```\n\nDomXPathExample06.htm\n\n在此示例中，代码输出匹配 \"element/name\" 的第一个元素下的第一个文本节点所包含的字符串。\n\
  \n## 默认类型结果\n\n所有的 XPath 表达式都会映射到特定的结果类型。设置特定的结果类型会限制表达式的输出。然而，你可以使用 `XPathResult.ANY_TYPE`\
  \ 常量来允许返回自动结果类型。通常，结果类型是 `Boolean` 值、`number` 值、`string` 值或无序节点迭代器。要确定返回了哪种结果类型，请使用评估结果上的\
  \ `resultType` 属性，例所示：\n\n```javascript\nvar result = xmldom.evaluate(\"employee/name\"\
  , xmldom.documentElement, null, \n                                  XPathResult.ANY_TYPE,\
  \ null);\n\nif (result !== null) {\n    switch(result.resultType) {\n        case\
  \ XPathResult.STRING_TYPE:\n            //处理字符串类型\n            break;\n\n      \
  \  case XPathResult.NUMBER_TYPE:\n            //处理数字类型\n            break;\n\n \
  \       case XPathResult.BOOLEAN_TYPE:\n            //处理布尔类型\n            break;\n\
  \n        case XPathResult.UNORDERED_NODE_ITERATOR_TYPE:\n            //处理无序节点迭代器类型\n\
  \            break;\n\n        default:\n            //处理其他可能的结果类型\n\n    }\n}\n\
  ```\n\n使用 `XPathResult.ANY_TYPE` 常量可以让 XPath 的使用更加自然，但可能在结果返回后需要额外的处理代码。\n\n## 命名空间支持\n\
  \n对于使用命名空间的 XML 文档，必须告知 `XPathEvaluator` 命名空间信息以便进行正确的评估。有多种方法可以实现。考虑以下 XML 代码：\n\
  \n```xml\n<?xml version=\"1.0\" ?>\n<wrox:books xmlns:wrox=\"http://www.wrox.com/\"\
  >\n    <wrox:book>\n        <wrox:title>Professional JavaScript for Web Developers</wrox:title>\n\
  \        <wrox:author>Nicholas C. Zakas</wrox:author>\n    </wrox:book>\n    <wrox:book>\n\
  \        <wrox:title>Professional Ajax</wrox:title>\n        <wrox:author>Nicholas\
  \ C. Zakas</wrox:author>\n        <wrox:author>Jeremy McPeak</wrox:author>\n   \
  \     <wrox:author>Joe Fawcett</wrox:author>\n    </wrox:book>\n</wrox:books>\n\
  ```\n\n在此 XML 文档中，所有元素都是 `http://www.wrox.com/` 命名空间的一部分，由 `wrox` 前缀标识。如果你想在该文档中使用\
  \ XPath，需要定义正在使用的命名空间；否则评估将失败。\n\n处理命名空间的第一种方法是通过 `createNSResolver()` 方法创建一个 `XPathResolver`\
  \ 对象。该方法接受单个参数，即包含命名空间定义的节点。在之前的示例中，该节点是具有 `xmlns` 属性的 `<books>`。该节点可以传递给 `createNSResolver()`，然后如下在\
  \ `evaluate()` 中中使用：\n\n![image](img/logo1.gif)\n\n```javascript\nvar nsresolver\
  \ = xmldom.createNSResolver(xmldom.documentElement);\n\nvar result = xmldom.evaluate(\"\
  wrox:book/wrox:author\", \n                             xmldom.documentElement,\
  \ nsresolver,\n                             XPathResult.ORDERED_NODE_SNAPSHOT_TYPE,\
  \ null);\n\nalert(result.snapshotLength);\n```\n\nDomXPathExample07.htm\n\n当 `nsresolver`\
  \ 对象传递给 `evaluate()` 时，可以确保 XPath 表达式中的 `wrox` 前缀能被正确理解。尝试在不使用此表达式会导致错误。\n\n处理命名空间的第二种方法是定义一个接受命名空间前缀并返回关联\
  \ URI 的函数，如下：\n\n```javascript\nvar nsresolver = function(prefix){\n    switch(prefix){\n\
  \        case \"wrox\": return \"http://www.wrox.com/\";\n        //其他\n    }\n\
  };\n\nvar result = xmldom.evaluate(\"count(wrox:book/wrox:author)\", \n        \
  \        xmldom.documentElement, nsresolver, XPathResult.NUMBER_TYPE, null);\n\n\
  alert(result.numberValue);\n```\n\nDomXPathExample08.htm\n\n定义命名空间解析函数对于不确定文档哪个节点包含命名空间定义很有帮助。只要知道前缀和\
  \ URI，就可以定义一个函数返回这些信息，并将其作为第三个参数传递给 `evaluate()`。\n\n## Internet Explorer 中的 XPath\n\
  \nInternet Explorer 的 ActiveX XML 对象支持 XPath，但 `DOMParser` 返回的 DOM 对象不支持。要在 Internet\
  \ Explorer 9 中使用 XPath，必须使用 ActiveX 实现。接口在每个节点上定义了两个额外方法：`selectSingleNode()` 和\
  \ `selectNodes()`。`selectSingleNode()` 方法接受 XPath 模式，如果找到则返回第一个匹配的节点，如果没有则返回 `null`。例如：\n\
  \n![image](img/logo1.gif)\n\n```javascript\nvar element = xmldom.documentElement.selectSingleNode(\"\
  employee/name\");\n\nif (element !== null) {\n    alert(element.xml);\n}\n```\n\n\
  IEXPathExample01.htm\n\n在这里，返回匹配 \"employee/name\" 的第一个节点。上下文节点是调用 `selectSingleNode()`\
  \ 的节点 `xmldom.documentElement`。由于该方法可能会返回 `null` 值，因此在尝试使用节点方法之前，应始终检查该值是否为 null。\n\
  \n`selectNodes()` 方法也接受 XPath 模式作为参数，但它返回所有匹配模式的节点的 `NodeList`（如果没有节点匹配，则返回一个项目数量为零的\
  \ `NodeList`）。\n\n\n\n\n\n```\nvar elements = xmldom.documentElement.selectNodes(\"\
  employee/name\");\nalert(elements.length);\n```\n\n### IEXPathExample02.htm\n\n\
  在此示例中，所有匹配 `\"employee/name\"` 的元素都以 `NodeList` 的形式返回。由于不存在返回 `null` 值可能，你可以安全地开始使用结果。请记住，由于结果是一个\
  \ `NodeList`，它是一个动态集合，每次被访问时都会不断更新。\n\nInternet Explorer 对 XPath 的支持非常基础。无法获取节点或\
  \ `NodeList` 以外的结果类型。\n\n#### Internet Explorer 中的命名空间支持\n\n为了在 Internet Explorer\
  \ 中处理包含命名空间的 XPath 表达式，你需要知道你正在使用哪些命名空间，并按照以下格式创建一个字符串：\n\n```\n\"xmlns:prefix1='uri1'\
  \ xmlns:prefix2='uri2' xmlns:prefix3='uri3'\"\n```\n\n然后，必须将此字符串传递给 Internet Explorer\
  \ 中 XML DOM 对象的特殊方法 `setProperty()`，该方法接受两个参数：要设置的属性名称和属性值。在这种情况下，属性名称是 `\"SelectionNamespaces\"\
  `，值是之前述格式的字符串。因此，可以使用以下代码来评估 DOM XPath 命名空间示例中 XML 文档：\n\n![image](img/logo1.gif)\n\
  \n```\nxmldom.setProperty(\"SelectionNamespaces\", \"xmlns:wrox='http://www.wrox.com/'\"\
  );\n\nvar result = xmldom.documentElement.selectNodes(\"wrox:book/wrox:author\"\
  );            \nalert(result.length); \n```\n\n### IEXPathExample03.htm\n\n与 DOM\
  \ XPath 示例一样，未提供命名空间解析信息会导致评估表达式时出现错误。\n\n#### 跨浏览器 XPath\n\n由于 Internet Explorer\
  \ 中的 XPath 功能非常有限，跨浏览器 XPath 使用必须限制在 Internet Explorer 可以执行的评估上。这基本上意味着要使用 DOM Level\
  \ 3 XPath 对象在其他浏览器中重新创建 `selectSingleNode()` 和 `selectNodes()` 方法。第一个函数是 `selectSingleNode()`，它接受三个参数：上下文节点、XPath\
  \ 表达式以及可选的命名空间对象。命名空间对象应该是如下形式的字面量：\n\n```\n{\n    prefix1: \"uri1\",\n    prefix2:\
  \ \"uri2\",\n    prefix3: \"uri3\"\n}\n```\n\n通过这种方式提供命名空间信息可以易于转换为特定浏览器的命名空间解析格式。`selectSingleNode()`\
  \ 的完整代码如下：\n\n```\nfunction selectSingleNode(context, expression, namespaces){\n\
  \    var doc = (context.nodeType != 9 ? context.ownerDocument : context);\n\n  \
  \  if (typeof doc.evaluate != \"undefined\"){\n        var nsresolver = null;\n\
  \        if (namespaces instanceof Object){\n            nsresolver = function(prefix){\n\
  \                return namespaces[prefix];\n            };\n        }\n\n     \
  \   var result = doc.evaluate(expression, context, nsresolver, \n              \
  \                    XPathResult.FIRST_ORDERED_NODE_TYPE, null);\n        return\
  \ (result !== null ? result.singleNodeValue : null);\n\n    } else if (typeof context.selectSingleNode\
  \ != \"undefined\"){\n\n        //创建命名空间字符串\n        if (namespaces instanceof Object){\n\
  \            var ns = \"\";\n            for (var prefix in namespaces){\n     \
  \           if (namespaces.hasOwnProperty(prefix)){\n                    ns += \"\
  xmlns:\" + prefix + \"='\" + namespaces[prefix] + \"' \";\n                }\n \
  \           }\n            doc.setProperty(\"SelectionNamespaces\", ns);\n     \
  \   }\n        return context.selectSingleNode(expression);\n    } else {\n    \
  \    throw new Error(\"No XPath engine found.\");\n    }\n}\n```\n\n### CrossBrowserXPathExample01.htm\n\
  \n该函数的的第一步是确定评估表达式的 XML 文档。由于上下文节点可以是文档，有有检查 `nodeType` 属性。变量 `doc` 在执行此检查后持有指向\
  \ XML 文档的引用。此时，你可以检查文档查看是否存在 `evaluate()` 方法，这表示支持 DOM Level 3 XPath。如果支持，下一步是检查是否传递了命名空间对象。这是通过使用\
  \ `instanceof` 运算符来完成的，因为 `typeof` 对空值和对象返回 `\"object\"`。变量 `nsresolver` 被初始化为 `null`，然后如果可用命名空间信息，则用一个函数覆盖它。该函数是一个闭包，使用传入的命名空间对象来返回命名空间\
  \ URI。之后，调用 `evaluate()` 方法并检查结果，以在返回值之前确定是否返回了节点。\n\n该函数的 Internet Explorer 分支检查上下文节点上是否存在\
  \ `selectSingleNode()` 方法。与 DOM 分支一样，第一步是为选择构建命名空间信息。如果传递了命名空间对象，则遍历其属性以创建适当格式的字符串。注意使用\
  \ `hasOwnProperty()` 方法，以确保对 `Object.prototype` 的任何修改都不会被此函数获取。然后调用原生的 `selectSingleNode()`\
  \ 方法并返回结果。\n\n如果两种方法都不支持，则函数将抛出错误，指示没有可用的 XPath 引擎。`selectSingleNode()` 函数的使用如下：\n\
  \n![image](img/logo1.gif)\n\n```\nvar result = selectSingleNode(xmldom.documentElement,\
  \ \"wrox:book/wrox:author\", \n                              { wrox: \"http://www.wrox.com/\"\
  \ });            \nalert(serializeXml(result)); \n```\n\n### CrossBrowserExample01.htm\n\
  \n跨浏览器 `selectNodes()` 函数是以非常的方式创建的。该函数接受与 `selectSingleNode()` 函数相同的三个参数，大部分逻辑相似。为了方便阅读，以下显示了函数之间的差异：\n\
  \n```\nfunction selectNodes(context, expression, namespaces){\n    var doc = (context.nodeType\
  \ != 9 ? context.ownerDocument : context);\n\n    if (typeof doc.evaluate != \"\
  undefined\"){\n        var nsresolver = null;\n        if (namespaces instanceof\
  \ Object){\n            nsresolver = function(prefix){\n                return namespaces[prefix];\n\
  \            };\n        }\n\n        var result = doc.evaluate(expression, context,\
  \ nsresolver, \n                                  XPathResult.ORDERED_NODE_SNAPSHOT_TYPE,\
  \ null);\n        var nodes = new Array();\n\n        if (result !== null){\n  \
  \          for (var i=0, len=result.snapshotLength; i < len; i++){\n           \
  \     nodes.push(result.snapshotItem(i));\n            }\n        }\n\n        return\
  \ nodes;\n    } else if (typeof context.selectNodes != \"undefined\"){\n\n     \
  \   //创建命名空间字符串\n        if (namespaces instanceof Object){\n            var ns\
  \ = \"\";\n            for (var prefix in namespaces){\n                if (namespaces.hasOwnProperty(prefix)){\n\
  \                    ns += \"xmlns:\" + prefix + \"='\" + namespaces[prefix] + \"\
  ' \";\n                }\n            }\n            doc.setProperty(\"SelectionNamespaces\"\
  , ns);\n        }\n        var result = context.selectNodes(expression);\n     \
  \   var nodes = new Array();\n\n        for (var i=0,len=result.length; i < len;\
  \ i++){\n            nodes.push(result[i]);\n        }\n\n        return nodes;\n\
  \    } else {\n        throw new Error(\"No XPath engine found.\");\n    }\n}\n\
  ```\n\n\n\n\n如你所见，许多逻辑是从 `selectSingleNode()` 复用的。在代码的 DOM 部分，使用了一个有序快照结果类型并将其存储在数组中。为了匹配\
  \ Internet Explorer 的实现，该函数在没有找到结果时也应返回一个数组，因此始终会返回节点数组。在代码的 Internet Explorer 分支中，调用了\
  \ `selectNodes()` 方法，然后结果复制到数组中。由于 Internet Explorer 返回的是 `NodeList`，最好将节点复制到数组中，这样无论使用哪种浏览器，函数返回的类型都是相同的。该函数可以如下所示使用：\n\
  \n![image](img/logo1.gif)\n\n```\nvar result = selectNodes(xmldom.documentElement,\
  \ \"wrox:book/wrox:author\", \n                              { wrox: \"http://www.wrox.com/\"\
  \ });            \nalert(result.length); \n```\n\nCrossBrowserXPathExample02.htm\n\
  \n为了获得最佳跨浏览器兼容性，最好在 JavaScript 中专门使用这两种方法进行 XPath 处理。\n\n## 浏览器中的 XSLT 支持\n\nXSLT\
  \ 是 XML 的伴随技术，它利用 XPath 将一个文档表示转换为另一个。与 XML 和 XPath 不同，XSLT 没有与之关联的正式 API，而且完全没有体现在正式\
  \ DOM 中。这使得浏览器厂商以自己的方式来实现支持。第一个在 JavaScript 中添加 XSLT 处理的浏览器是 Internet Explorer。\n\
  \n### Internet Explorer 中的 XSLT\n\n与 Internet Explorer 中的其他 XML 功能一样，XSLT 支持是通过使用\
  \ ActiveX 对象提供的。从 `MSXML 3.0`（随 Internet Explorer 6 发布）开始，可以通过 JavaScript 使用完整的\
  \ XSLT 1.0 支持。在 Internet Explorer 9 中，使用 `DOMParser` 创建的 DOM 文档不支持 XSLT。\n\n###\
  \ 简单的 XSLT 转换\n\n使用 XSLT 样式表转换 XML 文档简单的方法是将它们分别加载到 DOM 文档中，然后使用 `transformNode()`\
  \ 方法。该方法存在于中的每个节点上，并接受一个参数，即包含 XSLT 样式表的文档。`transformNode()` 方法返回一个包含转换结果的字符串。这里是一个示例：\n\
  \n![image](img/logo1.gif)\n\n```\n//load the XML and XSLT (IE-specific)\nxmldom.load(\"\
  employees.xml\");\nxsltdom.load(\"employees.xslt\");\n\n//transform\nvar result\
  \ = xmldom.transformNode(xsltdom);\n```\n\nIEXsltExample01.htm\n\n此示例加载了一个带有 XML\
  \ 的 DOM 文档和一个带有 XSLT 样式表的 DOM 文档。然后并在 XML 文档节点上调用 `transformNode()` 并传入 XSLT。变量\
  \ `result` 然后被填充转换产生的字符串。注意，转换是从文档节点级别开始的，因为那是调用 `transformNode()` 的地方。XSLT 转换也可以在文档的任何地方进行，通过在你想开始转换的节点上调用\
  \ `transformNode()` 实现。这是一个示例：\n\n```\nresult = xmldom.documentElement.transformNode(xsltdom);\n\
  result = xmldom.documentElement.childNodes[1].transformNode(xsltdom);\nresult =\
  \ xmldom.getElementsByTagName(\"name\")[0].transformNode(xsltdom);\nresult = xmldom.documentElement.firstChild.lastChild.transformNode(xsltdom);\n\
  ```\n\n如果你在文档元素之外任何地方调用 `transformNode()`，转换将从该处开始。然而，XSLT 样式表仍然可以访问来自该节点的完整 XML\
  \ 文档。\n\n### 复杂的 XSLT 转换\n\n`transformNode()` 方法提供了基础的 XSLT 转换能力，但还有更复杂的使用该语言的方法。要做到这一点，必须使用\
  \ XSL 模板和 XSL 处理器。第一步是将 XSLT 样式表加载到线程安全的 XML 文档版本。这是通过使用 `MSXML2.FreeThreadedDOMDocument`\
  \ ActiveX 对象实现的，它支持与 Internet Explorer 中普通 DOM 文档相同的接口。该对象也需要使用最新版本创建。例如：\n\n```\n\
  function createThreadSafeDocument(){\n    if (typeof arguments.callee.activeXString\
  \ != \"string\"){\n        var versions = [\"MSXML2.FreeThreadedDOMDocument.6.0\"\
  , \n                        \"MSXML2.FreeThreadedDOMDocument.3.0\",\n          \
  \              \"MSXML2.FreeThreadedDOMDocument\"],\n            i, len;\n\n   \
  \     for (i=0,len=versions.length; i < len; i++){\n            try {\n        \
  \        new ActiveXObject(versions[i]);\n                arguments.callee.activeXString\
  \ = versions[i];\n                break;\n            } catch (ex){\n          \
  \      //skip\n            }\n        }\n    }\n\n    return new ActiveXObject(arguments.callee.activeXString);\n\
  }\n```\n\nIEXsltExample02.htm\n\n除了签名不同，使用线程安全的 XML DOM 文档与使用普通类型相同，所示：\n\n```\n\
  var xsltdom = createThreadSafeDocument();\nxsltdom.async = false;\nxsltdom.load(\"\
  employees.xslt\");\n```\n\n在创建并加载自由 DOM 文档后，必须将其赋值给 XSL 模板，这是另一个 ActiveX 对象。模板用于创建\
  \ XSL 处理器对象，然后该对象可以用于转换 XML 文档。再次，必须创建最合适的版本，如下：\n\n![image](img/logo1.gif)\n\n\
  ```\nfunction createXSLTemplate(){\n    if (typeof arguments.callee.activeXString\
  \ != \"string\"){\n        var versions = [\"MSXML2.XSLTemplate.6.0\", \n      \
  \                  \"MSXML2.XSLTemplate.3.0\",\n                        \"MSXML2.XSLTemplate\"\
  ],\n            i, len;\n\n        for (i=0,len=versions.length; i < len; i++){\n\
  \            try {\n                new ActiveXObject(versions[i]);\n          \
  \      arguments.callee.activeXString = versions[i];\n                break;\n \
  \           } catch (ex){\n                //skip\n            }\n        }\n  \
  \  }\n\n    return new ActiveXObject(arguments.callee.activeXString);\n}\n```\n\n\
  [content]:\n\nIEXsltExample02.htm\n\n你可以使用 `createXSLTemplate()` 函数来创建最新版本的对象，如示例所示：\n\
  \n```\nvar template = createXSLTemplate();\ntemplate.stylesheet = xsltdom;\n\nvar\
  \ processor = template.createProcessor();\nprocessor.input = xmldom;\nprocessor.transform();\n\
  \nvar result = processor.output;\n```\n\nIEXsltExample02.htm\n\n当创建 XSL 处理器时，必须将转换节点赋值给\
  \ `input` 属性。该值可以是文档，也可以是文档中的任何节点。调用 `transform()` 执行转换并将结果作为字符串存储在 `output` 属性中。此代码复制了使用\
  \ `transformNode()` 可的功能。\n\n![image](img/pen.gif)\n\nXSL 模板对象的 3.0 和 6.0 版本之间存在显著。在\
  \ 3.0 中，`input` 属性必须是完整的文档；使用节点会报错。在 6.0 中，你可以使用文档中的任何节点。\n\n使用 XSL 处理器允许对转换进行额外的控制，并支持更高级的\
  \ XSLT 功能。例如，XSLT 样式表接受传入的参数并作为局部变量使用。考虑以下样式表：\n\n```xml\n<?xml version=\"1.0\"\
  ?>\n<xsl:stylesheet version=\"1.0\" xmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\"\
  >\n\n    <xsl:output method=\"html\" />\n\n    <xsl:param name=\"message\" />\n\n\
  \    <xsl:template match=\"/\">\n       <ul>\n           <xsl:apply-templates select=\"\
  *\" />\n       </ul>\n       <p>Message: <xsl:value-of select=\"$message\" /></p>\n\
  \    </xsl:template>\n\n    <xsl:template match=\"employee\">\n        <li><xsl:value-of\
  \ select=\"name\" />, <em><xsl:value-of select=\"@title\" /></em></li>\n    </xsl:template>\n\
  \n</xsl:stylesheet>\n```\n\nemployees.xslt\n\n\n\n\n\n此样式表定义了一个名为 `message` 的参数，并将该参数输出到转换结果中。要设置\
  \ `message` 的值，你需要在调用 `transform()` 之前使用 `addParameter()` 方法。`addParameter()` 方法接受两个参数：要设置的参数名称（如\
  \ `<xsl:param>` 的 `name` 属性所指定的）以及要分配的值（通常是字符串，但也可以是数字或 `Boolean`）。以下是一个示例：\n\n\
  ![image](img/logo1.gif)\n\n```\nprocessor.input = xmldom.documentElement;\nprocessor.addParameter(\"\
  message\", \"Hello World!\");\nprocessor.transform();\n```\n\nIEXsltExample03.htm\n\
  \n当你为参数设置值时，输出将反映该值。\n\n## 运行模式\n\nXSL 处理器的另一个高级功能是设置运行模式的模式。在 XSLT 中，可以使用 `mode`\
  \ 属性为模板定义一种模式。当定义了模式后，除非在使用 `<xsl:apply-templates>` 时指定了匹配的 `mode` 属性，否则该模板将不会执行。考虑以下示例：\n\
  \n```\n<xsl:stylesheet version=\"1.0\" xmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\"\
  >\n\n    <xsl:output method=\"html\" />\n\n    <xsl:param name=\"message\" />\n\n\
  \    <xsl:template match=\"/\">\n       <ul>\n           <xsl:apply-templates select=\"\
  *\" />\n       </ul>\n       <p>Message: <xsl:value-of select=\"$message\" /></p>\n\
  \    </xsl:template>\n\n    <xsl:template match=\"employee\">\n        <li><xsl:value-of\
  \ select=\"name\" />, <em><xsl:value-of select=\"@title\" /></em></li>\n    </xsl:template>\n\
  \n    <xsl:template match=\"employee\" mode=\"title-first\">\n        <li><em><xsl:value-of\
  \ select=\"@title\" /></em>, <xsl:value-of select=\"name\" /></li>\n    </xsl:template>\n\
  \n</xsl:stylesheet>\n```\n\nemployees3.xslt\n\n此样式表定义了一个模板，其 `mode` 属性被设置为 `\"title-first\"\
  `。在该模板内部，首先输出员工的职称，然后输出员工姓名。为了使用此模板，`<xsl:apply-templates>` 元素的 `mode` 属性也必须设置为\
  \ `\"title-first\"`。如果你使用此样式表，默认情况下它的输出与上一个相同，先显示员工姓名，后显示职位。然而，如果你使用此样式表并使用 JavaScript\
  \ 将 `mode` 设置为 `\"title-first\"`，它将先输出员工的职称。这可以在 JavaScript 中使用此处所示的 `setStartMode()`\
  \ 方法来实现：\n\n![image](img/logo1.gif)\n\n```\nprocessor.input = xmldom;\nprocessor.addParameter(\"\
  message\", \"Hello World!\");  \nprocessor.setStartMode(\"title-first\");      \
  \        \nprocessor.transform(); \n```\n\nIEXsltExample05.htm\n\n`setStartMode()`\
  \ 方法仅接受一个参数，即要设置的处理器的模式。与 `addParameter()` 一样，这必须在调用 `transform()` 之前调用。\n\n如果你打算使用同一个样式表进行多次转换，可以在每次转换后重置处理器。当你调用\
  \ `reset()` 方法时，输入和输出属性会被清除，起始模式以及任何指定的参数也会被清除。该方法的语法如下：\n\n```\nprocessor.reset();\
  \   //为下一次使用做准备\n```\n\n由于处理器已经编译了 XSLT 样式表，因此进行重复转换比使用 `transformNode()` 更快。\n\n\
  ![image](img/pen.gif)\n\nMSXML 只支持 XSLT 1.0。由于微软的重心已转向 .NET Framework，MSXML 的开发已经停止。预计在未来的某个时刻，JavaScript\
  \ 将访问 `XML` 和 `XSLT` NET 对象。\n\n## XSLTProcessor 类型\n\nMozilla 在 Firefox 中通过创建一个新类型，实现了对\
  \ XSLT 的 JavaScript 支持。`XSLTProcessor` 类型允许开发者以类似于 Internet Explorer 中 XSL 处理器的方式使用\
  \ XSLT 转换 XML 文档。自首次实现以来，Chrome、Safari 和 Opera 都复制了该实现，使 `XSLTProcessor` 成为 JavaScript\
  \ 支持 XSLT 转换的事实标准。\n\n与 Internet Explorer 的实现一样，第一步是加载两个 DOM 文，一个包含 XML，另一个包含 XSLT。之后，创建一个新的\
  \ `XSLTProcessor` 并使用 `importStylesheet()` 方法将 XSLT 分配给它，如示例所示：\n\n```\nvar processor\
  \ = new XSLTProcessor()\nprocessor.importStylesheet(xsltdom);\n```\n\nXsltProcessorExample01.htm\n\
  \n最后一步是执行转换。这可以通过两种方式完成。如果你想返回一个完整的 DOM 文档作为结果，调用 `transformToDocument()`。你也可以通过调用\
  \ `transformToFragment()` 获取文档片段对象作为结果。通常情况下，使用 `transformToFragment()` 的唯一理由是你打算将结果添加到另一个\
  \ DOM 文档中。\n\n使用 `transformToDocument()` 时，只需传入 XML DOM 并将结果作为另一个完全不同的 DOM 使用。这是一个示例：\n\
  \n![image](img/logo1.gif)\n\n```\nvar result = processor.transformToDocument(xmldom);\n\
  alert(serializeXml(result));\n```\n\nXsltProcessorExample01.htm\n\n`transformToFragment()`\
  \ 方法接受两个参数：要转换的 XML DOM 以及拥有结果片段的文档。这确保了片段是有效的。因此，你可以通过传入 `document` 创建片段并将其添加到页面。考虑以下示例：\n\
  \n```\nvar fragment = processor.transformToFragment(xmldom, document);\nvar div\
  \ = document.getElementById(\"div\");\ndiv.appendChild(fragment);\n```\n\nXsltProcessorExample02.htm\n\
  \n在这里，处理器创建了一个由文档对象拥有的片段。\n\n当 XSLT 样式表的输出格式为 `\"xml\"` 或 `\"html\"` 时，创建文档或片段是有意义的。然而，当输出格式为\
  \ `\"text\"` 时，你通常只需要文本。遗憾的是，没有直接返回文本的方法。当输出为 `\"text\"` 时调用 `transformToDocument()`\
  \ 会返回完整的 XML 文，但该文档的内容在浏览器之间有所不同。例如，Safari 返回整个 HTML 文，而 Opera 和 Firefox 返回一个带有文本元素的文档。\n\
  \n解决方案是调用 `transformToFragment()`，它返回一个包含结果文本的文档片段。因此，可以使用以下代码获取文本：\n\n```\nvar\
  \ fragment = processor.transformToFragment(xmldom, document);\nvar text = fragment.firstChild.nodeValue;\n\
  alert(text);\n```\n\n这段代码在每个支持的浏览器中工作方式相同，并能正确返回转换的文本输出。\n\n## 使用参数\n\n`XSLTProcessor`\
  \ 还允许使用 `setParameter()` 方法设置 XSLT 参数，该方法接受三个参数：命名空间 URI、参数本地名称以及要设置的值。通常命名空间 URI\
  \ 为 `null`，本地名称即为参数名称。此方法必须在调用 `transformToDocument()` 或 `transformToFragment()`\
  \ 之前调用。这是一个示例：\n\n```\nvar processor = new XSLTProcessor()\nprocessor.importStylesheet(xsltdom);\n\
  processor.setParameter(null, \"message\", \"Hello World!\");\nvar result = processor.transformToDocument(xmldom);\n\
  ```\n\nXsltProcessorExample03.htm\n\n还有两个与参数相关的方法 `getParameter()` 和 `removeParameter()`分别用于获取参数的当前值和移除参数值。每个方法都接受命名空间\
  \ URI（再次通常为 `null`）和参数的本地名称。例如：\n\n\n\n\n\n```\nvar processor = new XSLTProcessor()\n\
  processor.importStylesheet(xsltdom);\nprocessor.setParameter(null, \"message\",\
  \ \"Hello World!\");\n\nalert(processor.getParameter(null, \"message\"));    //outputs\
  \ \"Hello World!\"\nprocessor.removeParameter(null, \"message\");\n\nvar result\
  \ = processor.transformToDocument(xmldom);\n```\n\n这些方法并不经常使用，主要是为了方便起而提供的。\n\n\
  ### 重置处理器\n\n每个 `XSLTProcessor` 实例都可以多次重用，用于对不同 XSLT 样式表的多次转换。`reset()` 方法会移除处理器中的所有参数和样式表，允许你再次调用\
  \ `importStylesheet()` 来加载不同的 XSLT 样式表，如下例所示：\n\n```\nvar processor = new XSLTProcessor()\n\
  processor.importStylesheet(xsltdom);\n\n//执行一些转换\n\nprocessor.reset();\nprocessor.importStylesheet(xsltdom2);\n\
  \n//执行更多转换\n```\n\n在使用多个样式表进行转换时，重用同一个 `XSLTProcessor` 可以节省内存。\n\n### 跨浏览器 XSLT\n\
  \nInternet Explorer 的 XSLT 转换与 `XSLTProcessor` 的方法非常不同，因此重建每个方法中提供的所有功能是不现实的。XSLT\
  \ 转换最简单的跨浏览器技术是返回字符串结果。对于 Internet Explorer，这意味着简单地在上下文节点上调用 `transformNode()`，而其他浏览器需要对\
  \ `transformToDocument()` 操作的结果进行序列化。以下函数可以在 Internet Explorer、Firefox、Chrome、Safari\
  \ 和 Opera 中使用：\n\n![image](img/logo1.gif)\n\n```\nfunction transform(context, xslt){\n\
  \    if (typeof XSLTProcessor != \"undefined\"){\n        var processor = new XSLTProcessor();\n\
  \        processor.importStylesheet(xslt);\n\n        var result = processor.transformToDocument(context);\n\
  \        return (new XMLSerializer()).serializeToString(result);\n\n    } else if\
  \ (typeof context.transformNode != \"undefined\") {\n        return context.transformNode(xslt);\n\
  \    } else {\n        throw new Error(\"No XSLT processor available.\");\n    }\n\
  }\n```\n\n`CrossBrowserXsltExample01.htm`\n\n`transform()` 函数接受两个参数：执行转换的上下文节点和\
  \ XSLT 文档对象。首先，代码检查 `XSLTProcessor` 类型是否定义，如果是，则使用它来处理转换。调用 `transformToDocument()`\
  \ 方法并将结果序列化为字符串后返回。如果上下文节点具有 `transformNode()` 方法，则使用该方法返回结果。与本章中的其他跨浏览器函数一样，如果没有可用的\
  \ XSLT 处理器，`transform()` 将抛出错误。该函数的使用方法如下所示：\n\n```\nvar result = transform(xmldom,\
  \ xsltdom);\n```\n\n使用 Internet Explorer 的 `transformNode()` 方法可以确保你不需要为转换使用线程安全的\
  \ DOM 文档。\n\n![image](img/pen.gif)\n\n请注意，由于不同浏览器中使用了不同的 XSLT 引擎，你从转换中获得的结果在不同浏览器之间可能会细微或巨大的差异。你永远不要依赖在\
  \ JavaScript 中使用 XSLT 获得绝对转换结果。\n\n# 总结\n\nJavaScript 对 XML 及相关技术有大量的支持。遗憾的是，由于早期缺乏规范，常见功能有多种不同的实现。DOM\
  \ Level 2 提供了用于创建空 XML 文档的 API，但没有提供解析或序列化的 API。由于缺乏这些功能，浏览器厂商开始创建自己的方法。\n\nInternet\
  \ Explorer 采取了以下方法：\n\n*   Internet Explorer 通过 ActiveX 对象引入了 XML 支持，这些对象同样可以用于构建桌面应用程序。\n\
  *   `MSXML` 库随 Windows 一起发布，并可以通过 JavaScript 访问。\n*   该库包含了对基础 XML 解析、序列化的支持，以及对\
  \ XPath 和 XSLT 等补充技术的支持。\n\n另一方面，Firefox 实现了以下两种新类型来处理 XML 解析和序列化：\n\n*   `DOMParser`\
  \ 类型是一个简单的对象，它能将 XML 字符串解析为 DOM 文档。\n*   `XMLSerializer` 类型执行相反的操作，将 DOM 文档序列化为\
  \ XML 字符串。\n\n由于这些对象的简单性和流行，Internet Explorer 9、Opera、Chrome 和 Safari 复制了这些功能，这些类型已成为\
  \ Web 开发中的事实标准。\n\nDOM Level 3 引入了 XPath API 的规范，该规范已由 Firefox、Safari、Chrome 和 Opera\
  \ 实现。该 API 允许 JavaScript 对任何 DOM 文档运行任何 XPath 查询，并无论数据类型如何都能检索结果。Internet Explorer\
  \ 以两种方法的形式实现了自己的 XPath 支持：`selectSingleNode()` 和 `selectNodes()`。尽管比 DOM Level 3\
  \ API 限制得多，但这些方法提供了基本的 XPath 功能，用于在 DOM 文档中定位节点或一组节点。\n\n最后的相关技术是 XSLT，它没有定义其用法\
  \ API 的公共规范。Firefox 创建了 `XSLTProcessor` 类型来通过 JavaScript 处理转换，并很快被 Safari、Chrome\
  \ 和 Opera 效。Internet Explorer 实现了了自己的解决方案，既有简单的 `transformNode()` 方法，也通过更复杂的模板/处理器方法。\n\
  \nXML 现在在 Internet Explorer、Firefox、Chrome、Safari 和 Opera 中都得到了良好的支持。尽管 Internet\
  \ Explorer 和其他浏览器之间的实现差异巨大，但有足够的共性来创建合理的跨浏览器功能。\n\n# 第 19 章：用于 XML 的 ECMAScript\n\
  \n### 本章包含内容？\n\n*   E4X 引入的额外类型\n*   使用 E4X 进行 XML 操作\n*   语法变化\n\n2002 年，一个以 BEA\
  \ Systems 为头的团体建议对 ECMAScript 进行扩展以添加原生 XML 支持。2004 年 6 月，ECMAS for XML (E4X) 发布为\
  \ ECMA-357，该标准在 2005 年 12 月进行了修订。E4X 并不是一种独立的语言；它是 ECMAScript 的一个可选扩展。作为扩展，E4X 引入了处理\
  \ XML 的新语法，以及针对 XML 的特定对象。\n\n尽管浏览器采用速度缓慢，Firefox 1.5 及更高版本几乎支持整个 E4X 标准。本章重点关注\
  \ Firefox 的实现。\n\n### E4X 类型\n\n作为 ECMAScript 的扩展，E4X 引入了以下全局类型：\n\n*   `XML` —\
  \ XML 结构的任何单个部分\n*   `XMLList` — XML 对象集合\n*   `Namespace` — 命名空间前缀与命名空间 URI 之间的映射\n\
  *   `QName` — 由本地名称和命名空间 URI 组成的限定名称\n\n通过这四种类型，E4X 能够通过将每个类型（特别是 XML 和 XMLList）映射到多个\
  \ DOM 类型来表示 XML 文档的所有部分。\n\n### XML 类型\n\n`XML` 类型是 E4X 引入最重要的类型，因为它可以表示 XML 结构的任何单个部分。`XML`\
  \ 实例可以是元素、属性、注释、处理指令或文本节点。`XML` 类型继承自 `Object` 类型，因此它继承了对象的所有默认属性和方法。创建新的 XML 对象有几种方法，第一种是像这样调用构造函数：\n\
  \n```\nvar x = new XML();\n```\n\n此行创建一个可以填充数据的空 XML 对象。你也可以向构造函数传递 XML 字符串，如下例所示：\n\
  \n```\nvar x = new XML(\"<employee position=\\\"Software Engineer\\\"><name>Nicholas\
  \ Zakas</name></employee>\");\n```\n\n传入构造函数的 XML 字符串将被解析为 XML 对象层次结构。此外，你可以按照如下方式将\
  \ DOM 文档或节点传递给构造函数，并用 E4X 表示其数据：\n\n```\nvar x = new XML(xmldom);\n```\n\n\n\n\n\
  尽管这些构造方法很有用，但最强大且最有趣的方法是通过 XML 字面量直接将 XML 数据赋值给变量。XML 字面量无非是嵌入到 JavaScript 代码中的\
  \ XML 代码。这里有一个示例如：\n\n![image](img/logo1.gif)\n\n```\nvar employee = <employee position=\"\
  Software Engineer\">\n                    <name>Nicholas C. Zakas</name>\n     \
  \          </employee>;\n```\n\n`XMLTypeExample01.htm`\n\n在这里，一个 XML 数据结构被直接赋值给变量。这种增强语法创建了一个\
  \ XML 对象并将其赋值给 `employee` 变量。\n\n![image](img/pen.gif)\n\nFirefox 对 E4X 的实现不支持解析\
  \ XML 引导（prologs）。如果 `<?xml version=\"1.0\"?>` 出现在传递给 XML 构造函数的文本中，或作为 XML 字面量的一部分，就会发生语法错误。\n\
  \n`toXMLString()` 方法返回一个表示对象及其子节点的 XML 字符串。相比之下，`toString()` 方法的行为根据 XML 节点的内容而不同。如果内容简单（纯文本），则返回文本；否则\
  \ `toString()` 的行为与 `toXMLString()` 相同。考虑以下示例：\n\n```\nvar data = <name>Nicholas\
  \ C. Zakas</name>;\nalert(data.toString());     //\"Nicholas C. Zakas\"\nalert(data.toXMLString());\
  \  //\"<name>Nicholas C. Zakas</name>\"\n```\n\n在这两个方法之间，可以满足大多数 XML 序列化需求。\n\n\
  ### XMLList 类型\n\n`XMLList` 类型表示 XML 对象的有序集合。`XMLList` 的 DOM 等价物是 `NodeList`，尽管与\
  \ `Node` 和 `NodeList` 差异相比，`XML` 和 `XMLList` 差异故意非常小。要显式创建一个新的 `XMLList` 对象，可以使用以下\
  \ `XMLList` 构造函数：\n\n```\nvar list = new XMLList();\n```\n\n与 XML 构造函数一样，你可以传递一个\
  \ XML 字符串进行解析。该字符串不需要包含单个文档元素，如下面代码所示：\n\n```\nvar list = new XMLList(\"<item/><item/>\"\
  );\n```\n\n`XMLListTypeExample01.htm`\n\n在这里，`list` 变量填充了一个包含两个 XML 对象的 `XMLList`，每个对象对应一个\
  \ `<item>` 元素。\n\n一个 `XMLList` 对象也可以通过 `+` 运算符组合两个或多个 XML 对象来创建。该运算符在 E4X 中被重载以执行\
  \ `XMLList` 的创建，在此示例中：\n\n```\nvar list = <item/> + <item/>;\n```\n\n此示例使用加号运算符将两个\
  \ XML 字面量合并为一个 `XMLList`。通过使用特殊的 `<>` 和 `</>` 语法并省略加号运算符也可以实现同样的效果，如下：\n\n```\n\
  var list = <><item/><item/></>;\n```\n\n虽然可以创建独立的 `XMLList` 对象，但它们通常作为解析较大 XML 结构的一部分创建的。考虑以下：\n\
  \n![image](img/logo1.gif)\n\n```\nvar employees = <employees>\n    <employee position=\"\
  Software Engineer\">\n        <name>Nicholas C. Zakas</name>\n    </employee>\n\
  \    <employee position=\"Salesperson\">\n        <name>Jim Smith</name>\n    </employee>\n\
  </employees>;\n```\n\n`XMLListTypeExample02.htm`\n\n此代码定义了一个 `employees` 变量，它成为一个代表\
  \ `<employees>` 元素的 XML 对象。由于有两个子元素 `<employee>`，因此创建了一个 `XMLList` 对象并将其存储在 `employees.employee`\
  \ 中。然后可以使用括号符号和其位置来访问每个元素，如下：\n\n```\nvar firstEmployee = employees.employee[0];\
  \ \nvar secondEmployee = employees.employee[1];\n```\n\n每个 `XMLList` 对象还有一个 `length()`\
  \ 方法，它返回包含包含的项数。例如：\n\n```\nalert(employees.employee.length());   //2\n```\n\n注意\
  \ `length()` 是一个方法，而不是属性。这与数组和 `NodeLists` 故意不同。\n\nE4X 的一个有趣部分是故意模糊了 `XML` 和 `XMLList`\
  \ 类型之间的界限。事实上，XML 对象与包含单个 XML 对象的 `XMLList` 之间没有明显的区别。为了尽地减少这些差异，每个 XML 对象也有一个 `length()`\
  \ 方法和一个通过 `[0]` 引用的属性（该属性返回 XML 对象本身）。\n\n`XML` 和 `XMLList` 之间的兼容性使得 E4X 的用法更加简单，因为某些方法可能会返回其中一种类型。\n\
  \n`XMLList` 对象的 `toString()` 和 `toXMLString()` 方法返回相同的字符串值，即其包含的所有 XML 对象的连接序列化结果。\n\
  \n### 命名空间类型\n\n命名空间在 E4X 中通过 `Namespace` 对象表示。`Namespace` 对象通常用于将命名空间前缀映射到命名空间\
  \ URI，尽管并不总是需要前缀。你可以如下使用 `Namespace` 构造函数创建 `Namespace` 对象：\n\n```\nvar ns = new\
  \ Namespace();\n```\n\n你也可以使用 URI 或前缀和 URI 来初始化 `Namespace` 对象，如下所示：\n\n![image](img/logo1.gif)\n\
  \n```\nvar ns = new Namespace(\"http://www.wrox.com/\");    //无前缀的命名空间\nvar wrox\
  \ = new Namespace(\"wrox\", \"http://www.wrox.com/\");  //wrox 命名空间\n```\n\n`NamespaceTypeExample01.htm`\n\
  \n可以通过 `prefix` 和 `uri` 属性如下所示获取 `Namespace` 对象中的信息：\n\n```\nalert(ns.uri);    \
  \            //\"http://www.wrox.com/\"\nalert(ns.prefix);             undefined\n\
  alert(wrox.uri);              //\"http://www.wrox.com/\"\nalert(wrox.prefix);  \
  \         //\"wrox\"\n```\n\n`NamespaceTypeExample01.htm`\n\n只要没有缀没有赋值为 `Namespace`\
  \ 对象的一部分，其前缀属性被设置为 undefined。要创建默认命名空间，应将前缀为空字符串。\n\n如果 XML 字面量包含命名空间，或通过 XML 构造函数解析包含命名空间的\
  \ XML 字符串，会自动创建一个 `Namespace` 对象。然后可以使用 `namespace()` 方法并指定前缀来获取 `Namespace` 对象的引用。考虑以下示例：\n\
  \n![image](img/logo1.gif)\n\n```\nvar xml = <wrox:root xmlns:wrox=\"http://www.wrox.com/\"\
  >\n            <wrox:message>Hello World!</wrox:message>\n          </wrox:root>;\n\
  \nvar wrox = xml.namespace(\"wrox\");\nalert(wrox.uri);\nalert(wrox.prefix);\n```\n\
  \n`NamespaceTypeExample02.htm`\n\n在此示例中，包含命名空间的 XML 片段作为 XML 字面量创建。通过 `namespace(\"\
  wrox\")` 可以获取来自 `wrox` 命名空间的 `Namespace` 对象，之后你可以访问其 uri 和 prefix 属性。\n\n`Namespace`\
  \ 对象的 `toString()` 方法返回命名空间 URI。\n\n### QName 类型\n\n`QName` 类型表示 XML 对象的限定名，即命名空间和局部名的组合。你可以使用\
  \ `QName` 构造函数手动创建一个新的 `QName` 对象，并传入名称或 `Namespace` 对象和名称，如下所示：\n\n```\nvar wrox\
  \ = new Namespace(\"wrox\", \"http://www.wrox.com/\");\nvar wroxMessage = new QName(wrox,\
  \ \"message\");    //代表 \"wrox:message\"\n```\n\n`QNameTypeExample01.htm`\n\n对象创建后，有两个可以访问的属性：`uri`\
  \ 和 `localName`。`uri` 属性返回创建对象时指定的命名空间（如果没有指定命名空间则返回空字符串），`localName` 属性返回限定名中的局部名部分，如下示例所示：\n\
  \n```\nalert(wroxMessage.uri);        //\"http://www.wrox.com/\"\nalert(wroxMessage.localName);\
  \  //\"message\"\n```\n\n`QNameTypeExample01.htm`\n\n这些属性是只读的，尝试更改它们的值会产生错误。`QName`\
  \ 对象重写了 `toString()` 对象以返回 `uri::localName` 格式的字符串，例如例中的“http://www.wrox.com/::message”。\n\
  \n在解析 XML 结构时，代表元素或属性的 XML 对象会自动创建 `QName` 对象。你可以使用 XML 对象的 `name()` 方法返回与该 XML\
  \ 对象关联的 `QName` 对象的引用，在此所示：\n\n\n\n\n\n![image](img/logo1.gif)\n\n```\nvar xml =\
  \ <wrox:root xmlns:wrox=\"http://www.wrox.com/\">\n            <wrox:message>Hello\
  \ World!</wrox:message>\n          </wrox:root>;\n\nvar wroxRoot = xml.name();\n\
  alert(wroxRoot.uri);           //\"http://www.wrox.com/\"\nalert(wroxRoot.localName);\
  \     //\"root\"\n```\n\n### QNameTypeExample02.htm\n\n即使没有指定命名空间信息，XML 结构中的每个元素和属性都会创建一个\
  \ `QName` 对象。\n\n你可以通过使用 `setName()` 方法并传递一个新的 `QName` 对象来更改 XML 对象的限定名称（qualified\
  \ name），如下所示：\n\n```\nxml.setName(new QName(\"newroot\"));\n```\n\n该方法通常用于更改元素的标签名，或者作为命名空间一部分的属性名。如果名称不属于命名空间，你可以简单地使用\
  \ `setLocalName()` 方法来更改本地名称（local name），如下所示：\n\n```\nxml.setLocalName(\"newtagname\"\
  );\n```\n\n### 通用用法\n\n当一个 XML 对象、元素、属性和文本组合成一个对象层次结构时，你可以使用点符号（dot notation）结合属性和标签名称来导航该结构。每个子元素都表示为其父元素的一个属性，属性名等于子元素的本地名称。如果该子元素仅包含文本，则每当访问该属性时都会返回该文本，例所示：\n\
  \n```\nvar employee = <employee position=\"Software Engineer\">\n              \
  \      <name>Nicholas C. Zakas</name>\n               </employee>;\nalert(employee.name);\
  \  //\"Nicholas C. Zakas\"\n```\n\n此代码中的 `<name/>` 元素仅包含文本。该文本通过 `employee.name`\
  \ 获取，它会导航到 `<name/>` 元素并返回它。由于在传递给 `alert` 时会隐式调用 `toString()` 方法，因此 `<name/>` 中包含的文本会被显示。这种能力使得访问\
  \ XML 文档中的文本数据变得非常简单。如果存在多个具有相同标签名的元素，则返回一个 `XMLList`。考虑以下示例：\n\n```\nvar employees\
  \ = <employees>\n    <employee position=\"Software Engineer\">\n        <name>Nicholas\
  \ C. Zakas</name>\n    </employee>\n    <employee position=\"Salesperson\">\n  \
  \      <name>Jim Smith</name>\n    </employee>\n</employees>;\n\nalert(employees.employee[0].name);\
  \    //\"Nicholas C. Zakas\"\nalert(employees.employee[1].name);    //\"Jim Smith\"\
  \n```\n\n此示例访问了每个 `<employee/>` 元素并输出它们的 `<name/>` 元素值。如果你不确定子元素的本地名称，或者你想无论名称如何都获取所有子元素，可以使用星号（`*`），如下所示：\n\
  \n![image](img/logo1.gif)\n\n```\nvar allChildren = employees.*;      //忽略本地名称返回所有子元素\n\
  alert(employees.*[0].name);         //\"Nicholas C. Zakas\"\n```\n\n### UsageExample01.htm\n\
  \n与其他属性一样，星号可能会返回单个 XML 对象或一个 `XMLList` 对象，取决于 XML 结构。\n\n`child()` 方法的行为与属性访问完全相同。可以将任何属性名或索引传递给\
  \ `child()` 方法，它将返回相同的值。考虑这个示例：\n\n```\nvar firstChild = employees.child(0);   \
  \        //相当于 employees.*[0]\nvar employeeList = employees.child(\"employee\");\
  \  //相当于 employees.employee\nvar allChildren = employees.child(\"*\");         \
  \ //相当于 employees.*\n```\n\n为了方便起见，提供了一个 `children()` 方法，它始终返回所有子元素。示例所示：\n\n```\n\
  var allChildren = employees.children(); //相当于 employees.*\n```\n\n还有一个 `elements()`\
  \ 方法，它的行为与 `child()` 类似，不同之处它只返回代表元素的 XML 对象。例如：\n\n```\nvar employeeList = employees.elements(\"\
  employee\");  //相当于 employees.employee\nvar allChildren = employees.elements(\"\
  *\");          //相当于 employees.*\n```\n\n这些方法为 JavaScript 开发者提供了一种更熟悉的语法来访问 XML\
  \ 数据。\n\n可以使用 `delete` 运算符删除子元素，如下所示：\n\n```\ndelete employees.employee[0];\nalert(employees.employee.length());\
  \   //1\n```\n\n这是将子节点视为属性的要优势之一。\n\n### 访问属性\n\n属性也可以使用点符号进行访问，尽管语法稍有扩展。为了区分属性名和子元素标签名，你必须在名称前加上一个“at”字符（`@`）。这种语法借自\
  \ XPath，XPath 也使用 `@` 来区分属性和字符名称。结果产生了一种看起来有点奇怪的语法，如此示例所示：\n\n![image](img/logo1.gif)\n\
  \n```\nvar employees = <employees>\n    <employee position=\"Software Engineer\"\
  >\n        <name>Nicholas C. Zakas</name>\n    </employee>\n    <employee position=\"\
  Salesperson\">\n        <name>Jim Smith</name>\n    </employee>\n</employees>\n\n\
  alert(employees.employee[0].@position);  //\"Software Engineer\"\n```\n\n### AttributesExample01.htm\n\
  \n与元素一样，每个属性都表示为一个属性，可以使用这种简写符号进行访问。代表属性的 XML 对象会被返回，其 `toString()` 方法始终返回属性值。\n\
  \n你也可以使用 `child()` 方法通过在属性名称前加上 `@` 来访问属性，如下所示：\n\n```\nalert(employees.employee[0].@position\"\
  ));//\"Software Engineer\"\n```\n\n由于任何 XML 对象属性名都可以用于 `child()`，因此 `@` 字符对于区分标签名和属性名。\n\
  \n可以通过使用 `attribute()` 方法并传入属性名称来仅访问属性。与 `child()` 不同，不需要在属性名称前加上 `@`。示例所示：\n\n\
  ```\nalert(employees.employee[0].attribute(\"position\"));//\"Software Engineer\"\
  \n```\n\n这三种访问属性的方法适用于 `XML` 和 `XMLList` 类型。当用于 XML 对象时，返回代表属性的 XML 对象；当用于 `XMLList`\
  \ 对象时，返回一个 `XMLList`。例如在上例中，`employees.employee.@position` 将返回一个包含两个对象的 `XMLList`\
  \ —— 分别对应第一个和第二个 `<employee/>` 元素。\n\n要获取 XML 或 `XMLList` 对象中的所有属性，可以使用 `attributes()`\
  \ 方法。该方法返回一个代表所有属性的 `XMLList`。这与 `@*` 模式相同，如示例所示：\n\n```\n//两行均获取所有属性\nvar atts1\
  \ = employees.employee[0].@*;\nvar atts2 = employees.employee[0].attributes();\n\
  ```\n\n在 E4X 中更改属性值就像更改属性值一样。只需这样给属性赋值一个新值：\n\n```\nemployees.employee[0].@position\
  \ = \"Author\";//更改 position 属性\n```\n\n更改随后会反映在内部，因此当你序列化 XML 对象时，属性值会被更新。这种技术也可用于添加新属性，如下例所示：\n\
  \n```\nemployees.employee[0].@experience = \"8 years\";//添加 experience 属性\nemployees.employee[0].@manager\
  \ = \"Jim Smith\";//添加 manager 属性\n```\n\n由于属性类似于任何其他 ECMAScript 属性，你还可以使用 `delete`\
  \ 运算符删除属性：\n\n```\ndelete employees.employee[0].@position;      删除 position 属性\n\
  ```\n\n属性的属性访问允许与底层 XML 结构进行非常简单的交互。\n\n### 其他节点类型\n\n\n\n\n\nE4X 能够表示 XML 文档的所有部分，包括注释和处理指令。默认情况下，E4X\
  \ 不解析注释或处理指令，因此它们不会显示在对象层次结构中。要强制解析器识别它们，你必须在 `XML` 构造函数上设置以下两个属性：\n\n```\nXML.ignoreComments\
  \ = false;\nXML.ignoreProcessingInstructions = false;\n```\n\n设置这些标志后，E4X 将注释和处理指令解析到\
  \ XML 结构中。\n\n由于 `XML` 类型代表了所有的节点类型，因此需要一种方法来区分它们。`nodeKind()` 方法指示 XML 对象代表什么种类型的节点，并返回\
  \ \"text\"、\"element\"、\"comment\"、\"processing-instruction\" 或 \"attribute\"。考虑以下\
  \ XML 对象：\n\n![image](img/logo1.gif)\n\n```\nvar employees = <employees>\n    <?Dont\
  \ forget the donuts?>\n    <employee position=\"Software Engineer\">\n        <name>Nicholas\
  \ C. Zakas</name>\n    </employee>\n    <!-- just added -->\n    <employee position=\"\
  Salesperson\">\n        <name>Jim Smith</name>\n    </employee>\n</employees>;\n\
  ```\n\n给定此 XML，下表显示了根据作用范围内的节点 `nodeKind()` 返回的内容。\n\n| STATEMENT | RETURNS |\n\
  | --- | --- |\n| `employees.nodeKind()` | \"element\" |\n| `employees.*[0].nodeKind()`\
  \ | \"processing-instruction\" |\n| `employees.employee[0].@position.nodeKind()`\
  \ | \"attribute\" |\n| `employees.employee[0].nodeKind()` | \"element\" |\n| `employees.*[2].nodeKind()`\
  \ | \"comment\" |\n| `employees.employee[0].name.*[0].nodeKind()` | \"text\" |\n\
  \n`nodeKind()` 方法不能在包含多个 XML 对象的 `XMLList` 上调用；若这样做会抛出错误。\n\n可以使用以下方法之一仅检索特定类型的节点：\n\
  \n*   `attributes()` — 返回 `XML` 对象的所有属性。\n*   `comments()` — 返回 `XML` 对象的所有子级注释。\n\
  *   `elements(tagName)` — 返回 `XML` 对象的所有子元素。你可以通过提供想要返回的元素的 `tagName` 来过滤结果。\n*\
  \   `processingInstructions(name)` — 返回 `XML` 对象的所有子级处理指令。你可以通过提供要返回的处理指令的 `name`\
  \ 来过滤结果。\n*   `text()` — 返回 `XML` 对象的所有文本节点节点。\n\n这些方法每个都返回一个包含相应 XML 对象的 `XMLList`。\n\
  \n你可以使用 `hasSimpleContent()` 和 `hasComplexContent()` 方法来判断 `XML` 对象是仅包含文本还是更复杂的内容。如果子节点只有文本节点，则前者返回\
  \ `true`；如果存在任何非文本节点的子节点，则后者返回 `true`。这是一个示例：\n\n```\nalert(employees.employee[0].hasComplexContent());\
  \   //true\nalert(employees.employee[0].hasSimpleContent());    //false\nalert(employees.employee[0].name.hasComplexContent());\
  \   //false\nalert(employees.employee[0].name.hasSimpleContent());    //true\n```\n\
  \n这些方法与其他方法结合使用，可以帮助在 XML 结构中查询相关数据。\n\n### 查询\n\n事实上，E4X 提供的查询语法在许多方面与 XPath 相似。获取元素或属性值的简单操作就是一种基础类型的查询。代表\
  \ XML 结构各个部分的 XML 对象在进行查询时才会创建。实际上，`XML` 或 `XMLList` 对象的所有属性仅仅是查询的一部分。这意味着引用一个不代表\
  \ XML 结构部分的属性仍然会返回一个 `XMLList`，只是它是空的。例如，如果对之前的 XML 示例运行以下代码，将不会返回任何内容：\n\n![image](img/logo1.gif)\n\
  \n```\nvar cats = employees.cat;\nalert(cats.length());     //0 \n```\n\nQueryingExample01.htm\n\
  \n此查询在 `<employees/>` 下查找 `<cat/>` 元素。第一行返回一个没有任何内容的 `XMLList`。这种行为允许进行查询而无需担心可能发生异常。\n\
  \n之前的示例大部分部分涉及使用点符号表示法处理节点的直接子节点。你可以通过使用两个点将查询扩展到所有后代，如下所示：\n\n```\nvar allDescendants\
  \ = employees..*;     //获取 <employees/> 的所有后代\n```\n\n在这段代码中，返回了 `<employees/>`\
  \ 元素的所有后代。结果限制于元素、文本、注释和处理指令，后两者的包含仅取决于 `XML` 构造函数上指定的标志（在上一节中讨论过）；将不会包含属性。要仅检索特定标签名的元素，请将星号替换为实际标签名，如下：\n\
  \n```\nvar allNames = employees..name;       //获取 <employees/> 的所有 <name/> 后代\n\
  ```\n\n可以使用 `descendants()` 方法执行相同的查询。在不带任何参数使用时，该方法返回所有后代（这与使用 `..*` 相同），你也可以提供名称作为参数来限制结果。以下是两者的示例：\n\
  \n```\nvar allDescendants = employees.descendants();     //所有后代\nvar allNames =\
  \ employees.descendants(\"name\");     //所有 <name/> 后代\n```\n\n可以使用以下任一方法检索所有后代的属性：\n\
  \n```\nvar allAttributes = employees..*;             //获取后代的所有属性\nvar allAttributes2\
  \ = employees.descendants(\"@\"); //相同\n```\n\n就像元素一样，你可以通过提供完整名称而不是星号来限制结果。例如：\n\
  \n```\nvar allAttributes = employees..@position; //获取所有位置属性\nvar allAttributes2\
  \ = employees.descendants(\"@position\");//相同\n```\n\n除了访问后代，你还可以指定一个必须满足的条件。例如，为了返回位置属性为\
  \ \"salesperson\" 的 `<employee/>` 元素，可以使用以下查询：\n\n```\nvar salespeople = employees.employee.(@position\
  \ == \"Salesperson\");\n```\n\n这种语法也可用于更改 XML 结构的部分。例如，只需一行代码即可将第一个 salesperson\
  \ 的位置属性更改为 \"Senior Salesperson\"：\n\n```\nemployees.employee.(@position == \"Salesperson\"\
  )[0].@position= \"Senior Salesperson\";\n```\n\n注意括号中的表达式返回一个包含结果的 `XMLList`，因此括号返回用于写入属性的项。\n\
  \n你可以使用 `parent()` 方法返回 XML 结构，该方法返回 XML 对象父节点的 `XML` 对象。如果在 `XMLList` 上调用，`parent()`\
  \ 方法返回列表中所有对象的共同父节点。考虑这个示例：\n\n```\nvar employees2 = employees.employee.parent();\n\
  ```\n\n在这里，变量 `employees2` 内容与变量 `employees` 相同。`parent()` 方法在处理未知来源的 `XML` 对象时有用。\n\
  \n### XML 构造与操作\n\n将 XML 数据放入 `XML` 对象有多种方法。如前所述，你可以向 `XML` 构造函数传递 XML 字符串或使用 XML\
  \ 字面量。通过在花括号 `{}` 中嵌入 JavaScript 变量，可以让 XML 字面量变得更有用。变量可以在 XML 字面量的任何位置使用，如下所示：\n\
  \n![image](img/logo1.gif)\n\n```\nvar tagName = \"color\";\nvar color = \"red\"\
  ;\nvar xml = <{tagName}>{color}</{tagName}>;\n\nalert(xml.toXMLString());    //\"\
  <color>red</color>\"\n```\n\nXMLConstructionExample01.htm\n\n在这段代码中，使用插入的变量指定了 XML\
  \ 字面量的标签名和文本值。这种能力使得无需字符串拼接即可轻松构建 XML 结构。\n\n\n\n\n\n# 使用 E4X 构建 XML\n\nE4X 能够让你你使用标准的\
  \ JavaScript 语法轻松地构建整个 XML 结构。如前文提到的，大多数操作都是查询，即使元素或属性不存在，也不会抛出错误。更进一步，如果你给一个不存在的元素或属性赋值，E4X\
  \ 会先创建底层结构，然后执行赋值。这里有一个示例：\n\n```javascript\nvar employees = <employees/>;\nemployees.employee.name\
  \ = \"Nicholas C. Zakas\";\nemployees.employee.@position = \"Software Engineer\"\
  ;\n```\n\n## XMLConstructionExample02.htm\n\n此示例从一个 `<employees/>` 元素开始并在此基础上进行构建。第二行创建了一个\
  \ `<employee/>` 元素并在内部创建一个 `<name/>` 元素，并分配了一个文本值。下一行添加了位置属性并为其分配了值。最终，结构如下：\n\n\
  ```xml\n<employees>\n    <employee position=\"Software Engineer\">\n        <name>Nicholas\
  \ C. Zakas</name>\n    </employee>\n</employees>\n```\n\n此时可以使用 `+` 运算符添加第二个 `<employee/>`\
  \ 元素，如下所示：\n\n![image](img/logo1.gif)\n\n```javascript\nemployees.employee += <employee\
  \ position=\"Salesperson\">\n                          <name>Jim Smith</name>\n\
  \                      </employee>;\n```\n\nXMLConstructionExample02.htm\n\n这产生了最终的\
  \ XML 结构：\n\n```xml\n<employees>\n    <employee position=\"Software Engineer\">\n\
  \        <name>Nicholas C. Zakas</name>\n    </employee>\n    <employee position=\"\
  Salesperson\">\n        <name>Jim Smith</name>\n    </employee>\n</employees>\n\
  ```\n\n## 类似 DOM 方法\n\n除了这种基本的 XML 构建语法外，还可以使用以下类似 DOM 方法：\n\n- `appendChild(child)`\
  \ — 将给定的子元素追加到表示节点子元素的 `XMLList` 的末尾。\n- `copy()` — 返回 XML 对象的副本。\n- `insertChildAfter(refNode,\
  \ child)` — 在表示节点子元素的 `XMLList` 中 `refNode` 之后插入子元素。\n- `insertChildBefore(refNode,\
  \ child)` — 在表示节点子元素的 `XMLList` 中 `refNode` 之前插入子元素。\n- `prependChild(child)` —\
  \ 将给定的子元素插入到表示节点子元素的 `XMLList` 的开头。\n- `replace(propertyName, value)` — 将名为 `propertyName`\
  \ 的属性（可能是元素或属性）替换为给定的值。\n- `setChildren(children)` — 将所有子元素替换为 `children`，`children`\
  \ 可以是一个 `XML` 对象或 `XMLList` 对象。\n\n这些方法非常有用且易于使用。以下代码说明了其中一些方法：\n\n![image](img/logo1.gif)\n\
  \n```javascript\nvar employees = <employees>\n    <employee position=\"Software\
  \ Engineer\">\n        <name>Nicholas C. Zakas</name>\n    </employee>\n    <employee\
  \ position=\"Salesperson\">\n        <name>Jim Smith</name>\n    </employee>\n</employees>;\n\
  \nemployees.appendChild(<employee position=\"Vice President\">\n               \
  \      <name>Benjamin Anderson</name>\n                 </employee>);\n\nemployees.prependChild(<employee\
  \ position=\"User Interface Designer\">\n                     <name>Michael Johnson</name>\n\
  \                  </employee>);\n\nemployees.insertChildBefore(employees.child(2),\
  \ \n                            <employee position=\"Human Resources Manager\">\n\
  \                                <name>Margaret Jones</name>\n                 \
  \           </employee>);\n\nemployees.setChildren(<employee position=\"President\"\
  >\n                         <name>Richard McMichael</name>\n                   \
  \   </employee> +\n                      <employee position=\"Vice President\">\n\
  \                          <name>Rebecca Smith</name>\n                      </employee>);\n\
  ```\n\nXMLConstructionExample03.htm\n\n首先，代码在员工列表的底部添加了一个名为 Benjamin Anderson 的副总裁。其次，将一个名为\
  \ Michael Johnson 的用户界面设计师添加到员工列表的顶端。第三，将一个名为 Margaret Jones 的人力资源经理添加到位置 2 的员工之前，在此时，位置\
  \ 2 的员工是 Jim Smith（因为 Michael Johnson 和 Nicholas C. Zakas 现在位于他排面了）。最后，所有子元素都被替换为总统\
  \ Richard McMichael 和新的副总裁 Rebecca Smith。生成的 XML 如下所示：\n\n```xml\n<employees>\n\
  \    <employee position=\"President\">\n        <name>Richard McMichael</name>\n\
  \    </employee>\n    <employee position=\"Vice President\">\n        <name>Rebecca\
  \ Smith</name>\n    </employee>\n</employees>\n```\n\n使用这些技术和方法，你可以使用 E4X 执行任何 DOM\
  \ 风格的操作。\n\n## 解析与序列化选项\n\nE4X 解析和序列化数据的方式由 XML 构造函数上的几个设置控制。以下三个设置与 XML 解析有关：\n\
  \n- `ignoreComments` — 表示解析器应该忽略标记中的注释。默认设置为 `true`。\n- `ignoreProcessingInstructions`\
  \ — 表示解析器应该忽略标记中的处理指令。默认设置为 `true`。\n- `ignoreWhitespace` — 表示解析器应该忽略元素之间的空白字符，而不是创建文本节点来表示它。默认设置为\
  \ `true`。\n\n这三个设置影响传入 XML 构造函数的 XML 字符串以及 XML 字面量的解析。\n\n此外，以下两个设置与 XML 数据的序列化有关：\n\
  \n- `prettyIndent` — 表示序列化 XML 时每个缩进使用的空格数。默认为 `2`。\n- `prettyPrinting` — 表示 XML\
  \ 应以人类可读的格式输出，每个元素换行并缩进。默认设置为 `true`。\n\n这些设置影响来自 `toString()` 和 `toXML()` 的输出。可以通过\
  \ `settings()` 方法获取包含这些设置的对象，如下所示：\n\n![image](img/logo1.gif)\n\n```javascript\n\
  var settings = XML.settings();\nalert(settings.ignoreWhitespace); //true\nalert(settings.ignoreComments);\
  \   //true\n```\n\nParsingAndSerialization01.htm\n\n可以通过向 `setSettings()` 方法传递对象来同时分配多个设置。当你临时更改设置时这非常有用，例如：\n\
  \n```javascript\nvar settings = XML.settings();\nprettyIndent = 8;\nignoreComments\
  \ = false;\n\n//进行一些处理\n\nXML.setSettings(settings); //恢复到之前的设置\n```\n\n你可以始终使用\
  \ `defaultSettings()` 获取包含默认设置的对象，因此可以使用以下行重置设置：\n\n```javascript\nXML.setSettings(XML.defaultSettings());\n\
  ```\n\n## 命名空间\n\nE4X 使用命名空间非常简单。如前，可以使用 `namespace()` 方法获取特定前的 `Namespace` 对象。你还可以通过\
  \ `setNamespace()` 方法并传入 `Namespace` 对象为给定的元素设置空间。这里有一个示例：\n\n```javascript\nvar\
  \ messages = <messages>\n    <message>Hello world!</message>\n</messages>;\nmessages.setNamespace(new\
  \ Namespace(\"wrox\", \"http://www.wrox.com/\"));\n```\n\n当调用 `setNamespace()` 时，命名空间会被应用到调用的元素上。序列化\
  \ `messages` 变量的结果如下：\n\n```xml\n<wrox:messages xmlns:wrox=\"http://www.wrox.com/\"\
  >\n    <message>Hello world!</message>\n</wrox:messages>\n```\n\n由于调用了 `setNamespace()`，`<messages/>`\
  \ 元素带有 wrox 命名空间，而 `<message/>` 元素保持不变。\n\n要仅添加命名空间声明而不更改元素，请使用 `addNamespace()`\
  \ 方法并传入 `Namespace` 对象，如下所示：\n\n```javascript\nmessages.addNamespace(new Namespace(\"\
  wrox\", \"http://www.wrox.com/\"));\n```\n\n当此代码应用于原始的 `messages` XML 时，将创建如下 XML\
  \ 结构：\n\n```xml\n<messages xmlns:wrox=\"http://www.wrox.com/\">\n    <message>Hello\
  \ world!</message>\n</messages>\n```\n\n\n\n\n\n通过调用 `removeNamespace()` 并传入一个 `Namespace`\
  \ 对象，可以移除指定命名空间前缀和 URI 的命名空间声明；无需传递代表该命名空间的精确 `Namespace` 对象。请考虑此示例：\n\n```\nmessages.removeNamespace(new\
  \ Namespace(\"wrox\", \"http://www.wrox.com/\"));\n```\n\n此代码移除了 `wrox` 命名空间。注意，引用该前缀的限定名不会受到影响。\n\
  \n有两种方法可以返回与节点相关的 `Namespace` 对象的数组。第一种方法是 `namespaceDeclarations()`，它返回在给定节点上声明的所有命名空间的数组。第二种方法是\
  \ `inScopeNamespaces()`，它返回所有在给定节点作用范围内的命名空间的数组，这意味着它们要么在节点本身上声明，要么在祖先节点上声明。请考虑此示例：\n\
  \n```javascript\nvar messages = <messages xmlns:wrox=\"http://www.wrox.com/\">\n\
  \    <message>Hello world!</message>\n</messages>;\n\nalert(messages.namespaceDeclarations());\
  \    //\"http://www.wrox.com\"\nalert(messages.inScopeNamespaces());        //\"\
  ,http://www.wrox.com\"\n\nalert(messages.message.namespaceDeclarations());    //\"\
  \"\nalert(messages.message.inScopeNamespaces());        //\",http://www.wrox.com\"\
  \n```\n\n在这里，当调用 `namespaceDeclarations()` 时，`<message/>` 元素返回包含一个命名空间的数组；当调用 `inScopeNamespaces()`\
  \ 时，返回包含两个命名空间的数组。这两个作用范围内的命名空间是默认命名空间（用空字符串表示）和 `wrox` 命名空间。在`<message/>` 元素上调用这些方法时，`namespaceDeclarations()`\
  \ 返回空数组，而 `inScopeNamespaces()` 返回相同的结果。\n\n`Namespace` 对象还可以通过双冒号 (`::`) 查询 XML\
  \ 结构中的特定命名空间的元素。例如，要检索 `wrox` 命名空间中的所有 `<message/>` 元素，可以使用以下代码：\n\n```javascript\n\
  var messages = <messages xmlns:wrox=\"http://www.wrox.com/\">\n    <wrox:message>Hello\
  \ world!</wrox:message>\n</messages>;\nvar wroxNS = new Namespace(\"wrox\", \"http://www.wrox.com/\"\
  );\nvar wroxMessages = messages.wroxNS::message;\n```\n\n双冒号表示要返回的元素所在的命名空间。注意，使用的是\
  \ JavaScript 变量名，而不是命名空间前缀。\n\n你还可以为给定作用范围内创建的所有 XML 对象设置默认命名空间。要这样做，请使用默认 xml namespace\
  \ 语句并分配 `Namespace` 对象或简单的命名空间 URI。这里有一个示例：\n\n```javascript\ndefault xml namespace\
  \ = \"http://www.wrox.com/\";\n\nfunction doSomething(){\n\n    // 仅为此函数设置默认命名空间\n\
  \    default xml namespace = new Namespace(\"your\", \"http://www.yourdomain.com\"\
  );\n}\n```\n\n全局作用范围的默认 XML 命名空间未设置。当给定作用范围内的所有 XML 数据都使用特定命名空间时，此语句非常有用，可以避免频繁引用命名空间本身。\n\
  \n## 其他更改\n\n为了与标准的 ECMAScript 无缝协作，E4X 对基础语言进行更改。一个变化是引入了 `for-each-in` 循环。与遍历每个属性并返回属性名的\
  \ `for-in` 循环相比，`for-each-in` 循环遍历每个属性并返回属性的值，如下例所示：\n\n![image](img/logo1.gif)\n\
  \n```javascript\nvar employees =  <employees>\n                    <employee position=\"\
  Software Engineer\">\n                        <name>Nicholas C. Zakas</name>\n \
  \                   </employee>\n                    <employee position=\"Salesperson\"\
  >\n                        <name>Jim Smith</name>\n                    </employee>\n\
  \                </employees>;\n\nfor each (var child in employees){\n    alert(child.toXMLString());\n\
  }\n```\n\nForEachInExample01.htm\n\n此示例中的 `for-each-in` 循环将 `child` 变量填充为 `<employees/>`\
  \ 的每个子节点，这些节点可能包括注释、处理指令和/或文本节点。除非你使用属性的 `XMLList`（如下所示），否则循环中不会返回属性：\n\n```javascript\n\
  for each (var attribute in employees.@*){ // 遍历属性\n    alert(attribute);\n}\n```\n\
  \n尽管 `for-each-in` 循环被定义为 E4X 的一部分，但它也可以像这里用在普通数组和对象上：\n\n```javascript\nvar colors\
  \ = [\"red\",\"green\",\"blue\"];\nfor each(var color in colors){\n    alert(color);\n\
  }\n```\n\nForEachInExample01.htm\n\n对于数组，`for-each-in` 循环返回每个数组项。对于非 XML 对象，它返回每个属性的值。\n\
  \nE4X 还增加了一个名为 `isXMLName()` 的全局函数，它接受一个字符串，如果该名称是元素或属性的有效本地名（local name），则返回 true。这是为了给开发者提供便利，他们可能使用未知字符串数据来构建\
  \ XML 数据结构。这里有一个示例：\n\n```javascript\nalert(isXMLName(\"color\"));        //true\n\
  alert(isXMLName(\"hello world\"));  //false\n```\n\n如果你不确定应作为本地名的字符串的来源，最好先使用 `isXMLName()`\
  \ 来确定该字符串是否有效。\n\n由于 E4X 与 JavaScript 在很多方面都不同，Firefox 仅开启了在与其他代码混合时效果最佳的部分。要完全启用\
  \ E4X，你需要将 `<script>` 标签的 `type` 属性设置为 `text/javascript;e4x=1`如下所示：\n\n```html\n\
  <script type=\"text/javascript;e4x=1\" src=\"e4x_file.js\"></script>\n```\n\n当此开关打开时，将启用\
  \ E4X 支持，包括对嵌入注释和 CData 部分的正确解析。在未启用 E4X 时使用注释和/或 CData 部分会导致语法错误。\n\n# 总结\n\nECMAScript\
  \ for XML (E4X) 是 ECMA-357 规范的一种扩展。E4X 的目的是提供一种类似于 ECMAScript 的 XML 操作语法。E4X 具有以下特点：\n\
  \n*   与 DOM 不同，只有一种类型可以表示 XML 中存在的所有不同类型。\n*   `XML` 对象封装了所有节点所需的数据和行为。为了表示节点集合，规范定义了\
  \ `XMLList`。\n*   另外两个类型 `Namespace` 和 `QName` 分别表示命名空间和限定名。\n\nE4X 对标准 ECMAScript\
  \ 进行了如下更改，以便更容易查询 XML 结构：\n\n*   使用双点 (`..`) 表示匹配所有后代，而使用 `@` 字符表示返回一个或多个属性。\n*\
  \   星号字符 (`*`) 代表通配符，可以匹配任意类型的节点。\n*   所有这些查询也可以通过一组执行相同操作的方法来实现。\n\n在大多数情况下，没有必要区分\
  \ XML 和 XMLList。由于这两个类型在 E4X 中都被视为基本类型，因此无法使用 `instanceof` 运算符。如下：\n\n```javascript\n\
  var xml = new XML();\nvar list = new XMLList();\nvar object = {};\n\nalert(typeof\
  \ xml);     //\"xml\"\nalert(typeof list);    //\"xml\"\nalert(typeof object);//object\"\
  \n```\n\n\n\n\n\n`XML` 曾是互联网上传输结构化数据的默认标准。网络服务的首次迭代很大程度上是 `XML` 的，这凸显了其服务器到服务器通信的目标。然而，`XML`\
  \ 并非没有反对者。有些人认为这种语言过于冗长且重复。虽然出现了几种解决方案来应对这些问题，但 Web 领域已经开始向一个新的方向发展了。\n\nDouglas\
  \ Crockford 在 2006 年首次将 JavaScript 对象表示法（`JSON`）规范化为 IETF `RFC4627`，尽管它早在 2001 年就已经被使用了。`JSON`\
  \ 是 `JavaScript` 的严格子集，利用了 `JavaScript` 中使用的许多模式来表示结构化数据。Crockford 将 `JSON` 提出作为\
  \ `JavaScript` 中访问结构化数据的更好替代方案，因为它可以直接传递给 `eval()` 且不需要创建 `DOM`。\n\n理解 `JSON` 最重要的一点是它是一种数据格式，而不是一种编程语言。尽管它们共用一套语法，但\
  \ `JSON` 并不是 `JavaScript` 的一部分。`JSON` 也不仅供 `JavaScript` 使用，因为它是一种数据格式。许多编程语言中都有相应的解析器和序列化器。\n\
  \n## 语法\n\n`JSON` 语法允许表示三种类型的值：\n\n*   简单值 — `Strings`（字符串）、数字、`Booleans`（布尔值）和\
  \ `null` 都可以用 `JavaScript` 相同的语法在 `JSON` 中表示。不支持特殊值 `undefined`。\n*   对象 — 第一种复杂数据类型，对象表示有序的键值对。每个值可以是原始类型，也可以是复杂类型。\n\
  *   数组 — 第二种复杂数据类型，数组表示一个可以通过数字索引访问的有序值列表。值可以是任何类型，包括简单值、对象甚至其他数组。\n\n`JSON` 中没有变量、函数或对象实例。`JSON`\
  \ 的一切核心在于表示结构化数据，尽管它与 `JavaScript` 共享语法，但不应将其与 `JavaScript` 范式混淆。\n\n### 简单值\n\n\
  在最简单的形式下，`JSON` 表示极少数的简单值。例如，以下是有效的 `JSON`：\n\n```\n5\n```\n\n这是表示数字 5 的 `JSON`。同样，以下也是表示字符串的有效\
  \ `JSON`：\n\n```\n\"Hello world!\"\n```\n\n`JavaScript` 字符串与 `JSON` 字符串的主要区别在于，`JSON`\
  \ 字符串必须使用双引号才能有效（单引号会导致语法错误）。\n\n`Boolean` 值和 `null` 在独立 `JSON` 中与其原始形式完全有效。但在实践中，`JSON`\
  \ 最常用于表示更复杂的数据结构，简单值仅代表了整体信息的一部分。\n\n### 对象\n\n对象使用略微修改的对象字面量表示法来表示。`JavaScript`\
  \ 中的对象字面量看起来如下：\n\n```\nvar person = {\n    name: \"Nicholas\",\n    age: 29\n};\n\
  ```\n\n虽然这是开发者创建对象字面量的标准方式，但 `JSON` 中使用的是带引号的属性格式。以下与之前的示例完全相同：\n\n```\nvar object\
  \ = {\n    \"name\": \"Nicholas\",\n    \"age\": 29\n};\n```\n\n该相同对象的 `JSON` 表示法为：\n\
  \n```\n{\n    \"name\": \"Nicholas\",\n    \"age\": 29\n}\n```\n\n与 `JavaScript`\
  \ 示例有几点不同。首先，没有变量声明（`JSON` 中不存在变量）。其次，没有尾随分号（因为这不是 `JavaScript` 语句，不需要）。再次强调，属性名周围的引号对于有效的\
  \ `JSON` 是必须的。值可以是任何简单或复杂值，允许你将对象嵌入对象中，例如：\n\n```\n{\n    \"name\": \"Nicholas\"\
  ,\n    \"age\": 29,\n    \"school\": \"Merrimack College\",\n        \"location\"\
  : \"North Andover, MA\"\n    }\n```\n\n该相同对象的 `JSON` 表示法是上述的。与 `JavaScript` 示例有几点不同。首先，没有变量声明（`JSON`\
  \ 中不存在变量）。其次，没有尾随分号（因为这不是 `JavaScript` 语句，不需要）。再次强调，属性名周围的引号对于有效的 `JSON` 是必须的。值可以是任何简单或复杂值，允许你将对象嵌入对象中，例如：\n\
  \n该相同对象的 `JSON` 表示法是上述的。与 `JavaScript` 示例有几点不同。首先，没有变量声明（`JSON` 中不存在变量）。其次，没有尾随分号（因为这不是\
  \ `JavaScript` 语句，不需要）。再次强调，属性名周围的引号对于有效的 `JSON` 是必须的。值可以是任何简单或复杂值，允许你将对象嵌入对象中，例如：\n\
  \n该相同对象的 `JSON` 表示法是上述的。与 `JavaScript` 示例有几点不同。首先，没有变量声明（`JSON` 中不存在变量）。其次，没有尾随分号（因为这不是\
  \ `JavaScript` 语句，不需要）。再次强调，属性名周围的引号对于有效的 `JSON` 是必须的。\n\n 数组 — 第二种复杂数据类型，数组表示一个可以通过数字索引访问的有序值列表。值可以是任何类型，包括简单值、对象甚至其他数组。\n\
  \n`JSON` 中没有变量、函数或对象实例。`JSON` 的一切核心在于表示结构化数据，尽管它与 `JavaScript` 共享语法，但不应将其与 `JavaScript`\
  \ 范式混淆。\n\n### 简单值\n\n在最简单的形式下，`JSON` 表示极少数的简单值。例如，以下是有效的 `JSON`：\n\n```\n5\n```\n\
  \n这是表示数字 5 的 `JSON`。同样，以下也是表示字符串的有效 `JSON`：\n\n```\n\"Hello world!\"\n```\n\n`JavaScript`\
  \ 字符串与 `JSON` 字符串的主要区别在于，`JSON` 字符串必须使用双引号才能有效（单引号会导致语法错误）。\n\n`Boolean` 值和 `null`\
  \ 在独立 `JSON` 中与其原始形式完全有效。但在实践中，`JSON` 最常用于表示更复杂的数据结构，简单值仅代表了整体信息的一部分。\n\n### 对象\n\
  \n对象使用略微修改的对象字面量表示法来表示。`JavaScript` 中的对象字面量看起来如下：\n\n```\nvar person = {\n    name:\
  \ \"Nicholas\",\n    age: 29\n};\n```\n\n虽然这是开发者创建对象字面量的标准方式，但 `JSON` 中使用的是带引号的属性格式。以下与之前的示例完全相同：\n\
  \n```\nvar object = {\n    \"name\": \"Nicholas\",\n    \"age\": 29\n};\n```\n\n\
  该相同对象的 `JSON` 表示法为：\n\n```\n{\n    \"name\": \"Nicholas\",\n    \"age\": 29\n}\n\
  ```\n\n与 `JavaScript` 示例有几点不同。首先，没有变量声明（`JSON` 中不存在变量）。其次，没有尾随分号（因为这不是 `JavaScript`\
  \ 语句，不需要）。再次强调，属性名周围的引号对于有效的 `JSON` 是必须的。值可以是任何简单或复杂值，允许你将对象嵌入对象中，例如：\n\n```\n{\n\
  \    \"name\": \"Nicholas\",\n    \"age\": 29,\n    \"school\": \"Merrimack College\"\
  ,\n        \"location\": \"North Andover, MA\"\n    }\n}\n```\n\n该相同对象的 `JSON` 表示法是上述的。与\
  \ `JavaScript` 示例有几点不同。首先，没有变量声明（`JSON` 中不存在变量）。其次，没有尾随分号（因为这不是 `JavaScript` 语句，不需要）。再次强调，属性名周围的引号对于有效的\
  \ `JSON` 是必须的。\n\n## 解析与序列化\n\n`JSON` 的崛起并不一定是因为它使用了熟悉的语法。更多是因为数据可以被解析为可用对象。这与 `XML`\
  \ 解析为 `DOM` 文档形成了鲜明对比，使得 JavaScript 开发者提取数据是一项苦差。例如，上一节中的 `JSON` 代码包含书籍列表，你可以轻松地获取第三本书的标题：\n\
  \n```\nbooks[2].title\n```\n\n这假设数据结构存储在名为 `books` 的变量中。将其与典型的 `DOM` 结构进行比较：\n\n\
  ```\ndoc.getElementsByTagName(\"book\")[2].getAttribute(\"title\")\n```\n\n有了所有额外的方法调用，难怪\
  \ `JSON` 在 JavaScript 开发者中变得异常流行。之后，`JSON` 成为网络服务的默认标准。\n\n### JSON 对象\n\n早期的 `JSON`\
  \ 解析器仅仅是使用了 JavaScript 的 `eval()` 函数。由于 `JSON` 是 JavaScript 语法的子集，`eval()` 可以解析、解释并返回\
  \ JavaScript 对象和数组。ECMAScript 5 将 `JSON` 解析形式化到原生全局对象 `JSON` 下。该对象在 Internet Explorer\
  \ 8+、Firefox 3.5+、Safari 4+、Chrome 和 Opera 10.5+ 中支持。旧浏览器的 shim 可以在 [`github.com/douglascrockford/JSON-js`](https://github.com/douglascrockford/JSON-js)\
  \ 找到。在旧浏览器中评估 JSON 时，不要单独使用 `eval()`，因为存在执行代码的风险。`JSON` shim 是没有原生 JSON 解析的浏览器的最佳选择。\n\
  \n`JSON` 对象有两个方法：`stringify()` 和 `parse()`。在简单用法中，这些方法分别将 JavaScript 对象序列化为 JSON\
  \ 字符串，并将 JSON 解析为原生 JavaScript 值。例如：\n\n![image](img/logo1.gif)\n\n\n\n\n\n```\n\
  var book = {\n               title: \"Professional JavaScript\",\n             \
  \   authors: [\n                    \"Nicholas C. Zakas\"\n                ],\n\
  \                edition: 3,\n                year: 2011\n           };\n\nvar jsonText\
  \ = JSON.stringify(book);\n```\n\n### JSONStringifyExample01.htm\n\n此示例使用 `JSON.stringify()`\
  \ 将 JavaScript 对象序列化为 JSON 字符串并将其存储在 `jsonText` 中。默认情况下，`JSON.stringify()` 输出的 JSON\
  \ 字符串不包含任何额外的空格或缩进，因此存储在 `jsonText` 中的值为：\n\n```\n{\"title\":\"Professional JavaScript\"\
  ,\"authors\":[\"Nicholas C. Zakas\"],\"edition\":3,\n\"year\":2011}\n```\n\n在序列化\
  \ JavaScript 对象时，所有的函数和原型成员都会被刻意地从结果中排除。此外，任何值为 `undefined` 的属性也会被跳过。你最终留下的仅是属于\
  \ JSON 数据类型之一的实例属性的表示。\n\nJSON 字符串可以直接传递给 `JSON.parse()`，它会创建一个相应的 JavaScript 值。例如，你可以使用以下代码创建一个与\
  \ `book` 对象相似的对象：\n\n```\nvar bookCopy = JSON.parse(jsonText);\n```\n\n注意，`book`\
  \ 和 `bookCopy` 是两个独立的对象，尽管它们共享相同的属性，但之间没有任何关系。\n\n如果传递给 `JSON.parse()` 的文本不是有效的\
  \ JSON，则会抛出错误。\n\n### 序列化选项\n\n`JSON.stringify()` 方法除了要序列化的对象外，实际上接受两个参数。这些参数允许你指定序列化\
  \ JavaScript 对象的其他方式。第一个参数是过滤器，可以是数组或函数；第二个参数是用于缩进生成的 JSON 字符串的选项。当单独或一起使用时，它为控制\
  \ JSON 序列化提供了一些非常实用的功能。\n\n#### 过滤结果\n\n如果参数是一个数组，那么 `JSON.stringify()` 只包含数组中列出的对象属性。考虑以下情况：\n\
  \n![image](img/logo1.gif)\n\n```\nvar book = {\n               \"title\": \"Professional\
  \ JavaScript\",\n                \"authors\": [\n                    \"Nicholas\
  \ C. Zakas\"\n                ],\n                edition: 3,\n                year:\
  \ 2011\n           };\n\nvar jsonText = JSON.stringify(book, [\"title\", \"edition\"\
  ]);\n```\n\n### JSONStringifyExample01.htm\n\n`JSON.stringify()` 的第二个参数是一个包含两个字符串的数组：`\"\
  title\"` 和 `\"edition\"`。这些对应于被序列化对象的属性，因此只有这些属性会出现在生成的 JSON 字符串中：\n\n```\n{\"title\"\
  :\"Professional JavaScript\",\"edition\":3}\n```\n\n当第二个参数是函数时，行为略有不同。提供的函数接收两个参数：属性键名（key）和属性值。你可以查看\
  \ `key` 来决定如何处理该属性。`key` 始终是一个字符串，但如果某个值不属于键值对的一部分，它可能是一个空字符串。\n\n为了更改对象的序列化结果，请返回该\
  \ `key` 应该包含的值。请记住，返回 `undefined` 将导致该属性从结果中排除。这是一个示例：\n\n![image](img/logo1.gif)\n\
  \n```\nvar book = {\n               \"title\": \"Professional JavaScript\",\n  \
  \              \"authors\": [\n                    \"Nicholas C. Zakas\"\n     \
  \           ],\n                edition: 3,\n                year: 2011\n      \
  \     };\n\nvar jsonText = JSON.stringify(book, function(key, value){\n    switch(key){\n\
  \        case \"authors\":\n            return value.join(\",\")\n\n        case\
  \ \"year\":\n            return 5000;\n\n        case \"edition\":\n           \
  \ return undefined;\n\n        default:\n            return value;\n    }\n});\n\
  ```\n\n### JSONStringifyExample02.htm\n\n该函数根据 `key` 进行过滤。`\"authors\"` 键从数组转换为字符串，`\"\
  year\"` 键被设置为 `5000`，而 `\"edition\"` 键通过返回 `undefined` 被完全移除。提供一个返回传入值的默认行为是关重要的，这样所有其他值都能传递到结果中。对此函数的第一次调用实际上中，`key`\
  \ 等于空字符串，且值被设置为 `book` 对象。生成的 JSON 字符串为：\n\n```\n{\"title\":\"Professional JavaScript\"\
  ,\"authors\":\"Nicholas C. Zakas\",\"year\":5000}\n```\n\n请记住，过滤器适用于待序列化对象中包含的所有对象，因此，一个包含这些属性的多个对象的数组将导致每个对象都仅包含\
  \ `\"title\"` 和 `\"edition\"` 属性。\n\nFirefox 3.5–3.6 在使用函数作为第二个参数时，其 `JSON.stringify()`\
  \ 的实现存在一个 bug。函数只能充当过滤器：返回 `undefined` 意味着跳过该属性，而返回其他任何内容会导致该属性被包含。此行为在 Firefox\
  \ 4 中已修复。\n\n#### 字符串缩进\n\n`JSON.stringify()` 的第三个参数控制缩进和空格。当此参数为数字时，它代表每层缩进的空格数。例如，要每层缩进四个空格，请使用以下代码：\n\
  \n![image](img/logo1.gif)\n\n```\nvar book = {\n               \"title\": \"Professional\
  \ JavaScript\",\n                \"authors\": [\n                    \"Nicholas\
  \ C. Zakas\"\n                ],\n                edition: 3,\n                year:\
  \ 2011\n           };\n\nvar jsonText = JSON.stringify(book, null, 4);\n```\n\n\
  ### JSONStringifyExample03.htm\n\n`jsonText` 存储的字符串为：\n\n```\n{\n    \"title\":\
  \ \"Professional JavaScript\",\n    \"authors\": [\n        \"Nicholas C. Zakas\"\
  \n    ],\n    \"edition\": 3,\n    \"year\": 2011\n}\n```\n\n你可能注意到 `JSON.stringify()`\
  \ 也会在字符串中插入换行以便阅读。这对于所有有效的缩进值都会发生。（没有换行的缩进并不有用。）数值缩进的最大值为 10；传递大于 10 的值会自动设置为 10。\n\
  \n如果缩进参数是字符串而不是数字，则使用该字符串作为缩进字符而不是空格。使用字符串，可以将缩进字符设置为任意内容，例如两个连字符：\n\n```\nvar jsonText\
  \ = JSON.stringify(book, null, \" -\");\n```\n\n此时 `jsonText` 的值变为：\n\n```\n{\n\
  --\"title\": \"Professional JavaScript\",\n--\"authors\": [\n----Nicholas C. Zakas\"\
  \n--],\n（省略）\n```\n\n使用的缩进字符串有十个字符的限制。如果使用了超过十个字符的字符串，它将被截断为前十个字符。\n\n#### toJSON()\
  \ 方法\n\n有时对象需要超出 `JSON.stringify()` 能力的自定义 序列化。在这种情况下，你可以为对象添加 `toJSON()` 方法，并让它返回自身的正确表示。事实上，原生的\
  \ `Date` 对象具有 `toJSON()` 方法，可以自动将 JavaScript `Date` 对象转换为 ISO 8601 日期字符串（本质等同于对\
  \ `Date` 对象调用 `toISOString()`）。\n\n任何对象都可以添加 `toJSON()` 方法，例如：\n\n![image](img/logo1.gif)\n\
  \n```\nvar book = {\n               \"title\": \"Professional JavaScript\",\n  \
  \              \"authors\": [\n                    \"Nicholas C. Zakas\"\n     \
  \           ],\n                edition: 3,\n                year: 2011,\n     \
  \           toJSON: function(){\n                    return this.title;\n      \
  \          }\n           };\n\nvar jsonText = JSON.stringify(book);\n```\n\n###\
  \ JSONStringifyExample05.htm\n\n此代码在 `book` 对象上定义了一个 `toJSON()` 方法，简单返回书籍标题。与 `Date`\
  \ 对象类似，该对象被序列化为简单的字符串而不是对象。你可以从 `toJSON()` 返回任何序列化值，它都能正常工作。如果对象嵌入在另一个对象中，返回 `undefined`\
  \ 会导致该值变为 `null`；如果对象是顶层的，则直接为 `undefined`。\n\n\n\n\n\n`toJSON()` 方法可以在过滤函数之外使用，因此理解序列化过程中各个部分执行的顺序至关重要。当一个对象被传递给\
  \ `JSON.stringify()` 时，会执行以下步骤：\n\n1. 如果可用，则调用 `toJSON()` 方法以获取实际值。否则，使用默认的序列化方法。\n\
  2. 如果提供了第二个参数，则应用过滤器。传递给过滤函数的值将是第 1 步返回的值。\n3. 步骤 2 中的每个值都将进行适当的序列化。\n4. 如果提供了第三个参数，则进行适当的格式化。\n\
  \n在决定是创建 `toJSON()` 方法、使用过滤函数还是两者都用时，理解这个顺序是非常重要的。\n\n## 解析选项\n\n`JSON.parse()`\
  \ 方法还接受一个额外的参数，该参数是一个在每个键值对上调用的函数。该函数被称为“还原器函数”（reviver function），以区别于 `JSON.stringify()`\
  \ 接受的替换函数（replacer/filter 函数），尽管后者的格式完全相同：该函数接收两个参数，即 `key` 和 `value`，并需要返回一个值。\n\
  \n如果还原器函数返回 `undefined`，则该键将从结果中移除；如果它返回其他值，则该值将插入结果中。还原器函数的一个非常常用的用法日期字符串转换为 `Date`\
  \ 对象。例如：\n\n![image](img/logo1.gif)\n\n```javascript\nvar book = {\n           \
  \    \"title\": \"Professional JavaScript\",\n                \"authors\": [\n \
  \                   \"Nicholas C. Zakas\"\n                ],\n                edition:\
  \ 3,\n                year: 2011,\n                releaseDate: new Date(2011, 11,\
  \ 1)\n           };\n\nvar jsonText = JSON.stringify(book);\n\nvar bookCopy = JSON.parse(jsonText,\
  \ function(key, value){\n    if (key == \"releaseDate\"){\n        return new Date(value);\n\
  \    } else {\n        return value;\n    }\n});\n\nalert(bookCopy.releaseDate.getFullYear());\n\
  ```\n\n### JSONParseExample02.htm\n\n这段代码从向 `book` 对象添加 `releaseDate` 属性开始，该属性是一个\
  \ `Date` 类型。该对象被序列化以获取有效的 JSON 字符串，然后被解析回对象 `bookCopy`。还原器函数寻找 `\"releaseDate\"\
  ` 键，并在找到时根据该字符串创建一个新的 `Date` 对象。结果生成的 `bookCopy.releaseDate` 属性随后是一个 `Date` 对象，因此可以调用\
  \ `getFullYear()` 方法。\n\n# 总结\n\nJSON 是一种轻量级数据格式，旨在轻松地表示复杂的数据结构。该格式使用 JavaScript\
  \ 语法的子集表示对象、数组、字符串、数字、`Booleans` 和 `null`。尽管 XML 也可以胜任工作，但 JSON 更加简洁，并且在 JavaScript\
  \ 中有更好的支持。\n\nECMAScript 5 定义了一个原生的 `JSON` 对象，用于将对象序列化为 JSON 格式以及将 JSON 数据解析为 JavaScript\
  \ 对象。`JSON.stringify()` 和 `JSON.parse()` 方法分别用于这两种操作。这两个方法都有许多选项，允许你更改默认行为以过滤或其他修改处理过程。\n\
  \n原生 `JSON` 对象在所有浏览器中都得到了良好支持，包括 Internet Explorer 8+、Firefox 3.5+、Safari 4+、Opera\
  \ 10.5 和 Chrome。\n\n## 第 21 章\n\n### Ajax 和 Comet\n\n## 本章内容\n\n### 使用 `XMLHttpRequest`\
  \ 对象\n* 与处理 `XMLHttpRequest` 事件\n* 跨域 Ajax 限制\n\n2005 年，Jesse James Garrett 写了一篇题为“Ajax：Web\
  \ 应用的新方法”的在线文章（[www.adaptivepath.com/ideas/essays/archives/000385.php](http://www.adaptivepath.com/ideas/essays/archives/000385.php)）。这篇文章概述了一种他称为\
  \ Ajax 的技术，Asynchronous JavaScript+XML 的缩写。该技术包括在不卸载 Web 页面的情况下向服务器请求额外数据，从而提供更好的用户体验。Garrett\
  \ 解释了如何使用这种技术来改变 Web 自诞生以来一直陷其中的传统“点击并等待”范式。\n\n推动 Ajax 进展的关键技术是 `XMLHttpRequest`\
  \ (XHR) 对象，它最早由微软发明，然后被其他浏览器厂商复制。在引入 `XHR` 之前，Ajax 风格的通信必须通过许多黑客手段来实现，主要是使用隐藏的帧或\
  \ iframes。`XHR` 引入了一个精简的接口用于创建服务器请求和评估响应。这允许从服务器异步获取额外信息，意味着用户的点击不需要刷新页面即可获取更多数据。相反，可以使用\
  \ `XHR` 对象来获取数据，然后使用 `DOM` 将数据插入页面中。尽管名称中提到了 XML，但 Ajax 通信是格式无关的；该技术的核心在于在不刷新页面的情况下从服务器获取数据，而不一定关于\
  \ XML。\n\nGarrett 所指的 Ajax 技术实际上已经存在了一段时间。在 Garrett 文章之前，这种浏览器-服务器通信通常被称为“远程脚本”（remote\
  \ scripting），自 1998 年以来，通过不同的技术，这种通信一直是可能的。在早阶段，可以通过 JavaScript 通过中间件（如 Java applet\
  \ 或 Flash 电影）发起的服务器请求。`XHR` 对象为开发者带来了原生的浏览器通信能力，减少了实现结果所需的工作量。\n\n更名为 Ajax 后，浏览器-服务器通信的流行在\
  \ 2005 年底和 2006 年初爆发式增长。对 JavaScript 以及整个 Web 的重新关注带来了使用这些能力的新技术和模式。因此，`XHR` 对象现在是每个\
  \ Web 开发者必不可少的工具。\n\n## XMLHttpRequest 对象\n\nInternet Explorer 5 是第一个引入 XHR 对象的浏览器。它是通过使用作为\
  \ MSXML 库一部分的 ActiveX 对象实现的。因此，浏览器可以使用三个版本的 XHR 对象：`MSXML2.XMLHttp`、`MSXML2.XMLHttp.3.0`\
  \ 和 `MSXML2.XMLHttp.6.0`。使用 MSXML 库使用 XHR 需要一个与第 18 章创建文档类似的函数，如下所示：\n\n![image](img/logo1.gif)\n\
  \n```javascript\n//适用于 7 之前的版本的函数\nfunction createXHR(){\n    if (typeof arguments.callee.activeXString\
  \ != \"string\"){\n        var versions = [\"MSXML2.XMLHttp.6.0\", \"MSXML2.XMLHttp.3.0\"\
  ,\n                        \"MSXML2.XMLHttp\"],\n            i, len;\n\n       \
  \ for (i=0,len=versions.length; i < len; i++){\n            try {\n            \
  \    new ActiveXObject(versions[i]);\n                arguments.callee.activeXString\
  \ = versions[i];\n                break;\n            } catch (ex){\n          \
  \      //跳过\n            }\n        }\n    }\n\n    return new ActiveXObject(arguments.callee.activeXString);\n\
  }\n```\n\n此函数尝试在 Internet Explorer 上创建可最新版本的 XHR 对象。\n\nInternet Explorer 7+、Firefox、Opera、Chrome\
  \ 和 Safari 都支持原生的 XHR 对象，可以使用 `XMLHttpRequest` 构造函数如下创建：\n\n```javascript\nvar xhr\
  \ = new XMLHttpRequest();\n```\n\n\n\n\n\n```javascript\nfunction createXHR(){\n\
  \    if (typeof XMLHttpRequest != \"undefined\"){\n        return new XMLHttpRequest();\n\
  \    } else if (typeof ActiveXObject != \"undefined\"){\n        if (typeof arguments.callee.activeXString\
  \ != \"string\"){\n            var versions = [\"MSXML2.XMLHttp.6.0\", \"MSXML2.XMLHttp.3.0\"\
  ,\n                            \"MSXML2.XMLHttp\"],\n                i, len;\n\n\
  \            for (i=0,len=versions.length; i < len; i++){\n                try {\n\
  \                    new ActiveXObject(versions[i]);\n                    arguments.callee.activeXString\
  \ = versions[i];\n                    break;\n                } catch (ex){\n  \
  \                  //skip\n                }\n            }\n        }\n\n     \
  \   return new ActiveXObject(arguments.callee.activeXString);\n    } else {\n  \
  \      throw new Error(\"No XHR object available.\");\n    }}}\n```\n\n`XHRExample01.htm`\n\
  \n此函数中的新代码首先检查原生的 `XHR` 对象，如果找到则返回一个新实例。如果没有找到原生对象，则会检查对 ActiveX 的支持。如果两种选项都不可用，则会抛出错误。然后可以使用以下代码在所有浏览器中创建一个\
  \ `XHR` 对象：\n\n```\nvar xhr = createXHR();\n```\n\n由于每个浏览器中的 `XHR` 实现都与原始的 Internet\
  \ Explorer 版本兼容，因此你可以在所有浏览器中使用相同的方式使用创建的 `xhr` 对象。\n\n## XHR 使用\n\n要开始使用 `XHR` 对象，你首先需要调用\
  \ `open()` 方法，该方法接受三个参数：要发送的请求类型（`\"get\"`、`\"post\"` 等）、请求的 URL 以及一个指示请求是否应异步发送的布尔值。这里是一个示例：\n\
  \n```\nxhr.open(\"get\", \"example.php\", false);\n```\n\n这一行代码为 `example.php` 开启了一个同步\
  \ GET 请求。关于这段代码有几点需要注意。首先，URL 是相对于调用代码的页面的路径，尽管也可以提供绝对路径。其次，调用 `open()` 并没有实际发送请求；它只是准备好一个要发送的请求。\n\
  \n![image](img/pen.gif)\n\n你只能访问存在同源上的 URL，这意味着相同的域名、相同的端口以及相同的协议。如果 URL 指定的这些内容任何一个与发送请求的页面不同，则会抛出安全错误。\n\
  \n要发送指定的请求，你必须如下调用 `send()` 方法：\n\n![image](img/logo1.gif)\n\n```\nxhr.open(\"get\"\
  , \"example.txt\", false);\nxhr.send(null);\n```\n\n`XHRExample01.htm`\n\n`send()`\
  \ 方法接受一个参数，即作为请求体发送的数据。如果不需要发送体数据，你必须传递 `null`，因为某些浏览器需要此参数。一旦调用 `send()`，请求就会被派发到服务器。\n\
  \n由于此请求是同步的，JavaScript 代码将等待响应返回后继续执行。当收到响应时，`XHR` 对象的属性将填充数据。相关属性如下：\n\n- `responseText`\
  \ — 作为响应体返回的文本。\n- `responseXML` — 如果响应的内容类型（content-type）为 `\"text/xml\"` 或 `\"\
  application/xml\"`，则包含一个带有响应数据的 XML DOM 文档。\n- `status` — 响应的 HTTP 状态。\n- `statusText`\
  \ — HTTP 状态的描述。\n\n当收到响应时，第一步是检查 `status` 属性以确保响应成功返回。通常情况下，200 的 HTTP 状态码被认为是成功的，并且\
  \ `responseText` 中会有一些内容，如果内容类型正确，可能在 `responseXML` 中也会有内容。此外，状态码 304 表示资源未被修改并正在从浏览器缓存中提供，这也意味着响应是可用的。为了确保收到了正确的响应，你应该检查所有这些状态，如下所示：\n\
  \n```\nxhr.open(\"get\", \"example.txt\", false);\nxhr.send(null);\n\nif ((xhr.status\
  \ >= 200 && xhr.status < 300) || xhr.status == 304){\n    alert(xhr.responseText);\n\
  } else {\n    alert(\"Request was unsuccessful: \" + xhr.status);\n}\n```\n\n`XHRExample01.htm`\n\
  \n此代码根据返回的状态码显示从服务器返回的内容或错误消息。建议始终检查 `status` 属性以确定最佳行动方案，并避免为此此目的使用 `statusText`，因为后者在不同浏览器中已被证明是不可靠的。无论内容类型如何，`responseText`\
  \ 属性始终被填充响应体，而 `responseXML` 对于非 XML 数据将为 `null`。\n\n![image](img/pen.gif)\n\n某些浏览器错误地报告了\
  \ 204 状态码。Internet Explorer 中 ActiveX 版本的 `XHR` 在获取 204 时会将 `status` 设置为 1223，而\
  \ Internet Explorer 中的原生 `XHR` 对象会将 204 规范化为 200。Opera 在获取 204 时报告状态为 0。\n\n虽然可以像这样进行同步请求，但大多数情况下最好使用异步请求，以便\
  \ JavaScript 代码继续执行而无需等待响应。`XHR` 对象有一个 `readyState` 属性，指示当前请求/响应循环的阶段。可能的 `readyState`\
  \ 值为：\n\n- 0 — 未初始化。尚未调用 `open()` 方法。\n- 1 — 已打开。已调用 `open()` 但尚未调用 `send()`。\n\
  - 2 — 已发送。已调用 `send()` 但尚未收到响应。\n- 3 — 接收中。部分响应数据已获取。\n- 4 — 完成。所有响应数据已获取。\n\n每当\
  \ `readyState` 从一个值变为另一个值时，都会触发 `change` 事件。你可以利用此机会检查 `readyState`。通常情况下，感兴趣的 `readyState`\
  \ 是 4，它表示数据已就绪。考虑以下示例：\n\n![image](img/logo1.gif)\n\n```javascript\nvar xhr = createXHR();\n\
  xhr.onreadystatechange = function(){\n    if (xhr.readyState == 4){\n        if\
  \ ((xhr.status >= 200 && xhr.status < 300) || xhr.status == 304){\n            alert(xhr.responseText);\n\
  \        } else {\n            alert(\"Request was unsuccessful: \" + xhr.status);\n\
  \        }\n    }\n};\nxhr.open(\"get\", \"example.txt\", true);\nxhr.send(null);\n\
  ```\n\n`XAsyncExample01.htm`\n\n## HTTP 头部\n\n每个 HTTP 请求和响应都会带上一组头部信息，这些信息可能对开发者感兴趣。`XHR`\
  \ 对象通过多个方法暴露两种类型的头部——请求头部和响应头部。\n\n当发送 `XHR` 请求时，默认会发送以下头部：\n\n\n\n\n\n*   `Accept`\
  \ — 浏览器可以处理的内容类型。\n*   `Accept-Charset` — 浏览器可以显示的字符集。\n*   `Accept-Encoding` —\
  \ 浏览器处理的压缩编码。\n*   `Accept-Language` — 浏览器运行的语言。\n*   `Connection` — 浏览器与服务器建立的连接类型。\n\
  *   `Cookie` — 页面设置设置任何 cookie。\n*   `Host` — 发起请求的页面域名。\n*   `Referer` — 发起请求的页面\
  \ URI。注意该头部在 HTTP 规范中的拼写是错误的，为了兼容性，必须保持错误的拼写。（该词正确的拼写是“referrer”。）\n*   `User-Agent`\
  \ — 浏览器的用户代理字符串。\n\n虽然不同浏览器发送的精确请求头有所不同，但这些是通常会发送的头。你可以通过 `setRequestHeader()` 方法设置额外的请求头。该方法接受两个参数：头部的名称和头部的值。为了发送请求头，必须在调用\
  \ `open()` 之后但在 `send()` 之前调用 `setRequestHeader()`，如下例所示：\n\n![image](img/logo1.gif)\n\
  \n```\nvar xhr = createXHR();        \nxhr.onreadystatechange = function(){\n  \
  \  if (xhr.readyState == 4){\n        if ((xhr.status >= 200 && xhr.status < 300)\
  \ || xhr.status == 304){\n            alert(xhr.responseText);\n        } else {\n\
  \            alert(\"Request was unsuccessful: \" + xhr.status);\n        }\n  \
  \  }\n};\nxhr.open(\"get\", \"example.php\", true);\nxhr.setRequestHeader(\"MyHeader\"\
  , \"MyValue\");\nxhr.send(null);\n```\n\nXHRRequestHeadersExample01.htm\n\n服务器可以读取这些自定义请求头以决定适当的行动。建议始终使用自定义头部名称，而不是浏览器通常发送的名称，因为使用默认名称可能会影响服务器响应。某些浏览器允许重写默认头部，但另一些则不允许。\n\
  \n你可以通过使用 `getResponseHeader()` 方法并传入要获取的头部名称从 XHR 对象中检索响应头。还可以使用 `getAllResponseHeaders()`\
  \ 方法将所有头部作为一个长字符串进行检索。以下是这两种方法的示例：\n\n```\nvar myHeader = xhr.getResponseHeader(\"\
  MyHeader\");\nvar allHeaders  xhr.getAllResponseHeaders();\n```\n\n头部可以用于从服务器向浏览器传递额外的结构化数据。`getAllResponseHeaders()`\
  \ 方法通常返回类似以下的内容：\n\n```\nDate: Sun, 14 Nov 2004 18:04:03 GMT\nServer: Apache/1.3.29\
  \ (Unix)\nVary: Accept\nX-Powered-By: PHP/4.3.8\nConnection: close\nContent-Type:\
  \ text/html; charset=iso-8859-1\n```\n\n此输出允许你解析响应头以找到所有已发送的头部名称，而不是逐个检查每一个是否存在。\n\
  \n## GET 请求\n\n最常见的请求类型是 GET，它通常在查询服务器某些信息时发出。如果必要，可以在 URL 末尾附加查询字符串（query-string）参数以将信息传递给服务器。对于\
  \ XHR，此查询字符串必须在传入 `open()` 方法的 URL 中存在并经过正确编码。\n\n执行 GET 请求时常见的错误之一是查询字符串格式不正确。每个查询字符串名称和值在附加到\
  \ URL 之前必须使用 `encodeURIComponent()` 进行编码，并且所有的键值对必须用 ampersand（&）分隔，如示例所示：\n\n```\n\
  xhr.open(\"get\", \"example.php?name1=value1&name2=value2\", true);\n```\n\n以下函数帮助向现有\
  \ URL 末尾添加查询字符串参数：\n\n```\nfunction addURLParam(url, name, value) {\n    url +=\
  \ (url.indexOf(\"?\") == -1 ? \"?\" : \"&\");\n    url += encodeURIComponent(name)\
  \ + \"=\" + encodeURIComponent(value);\n    return url;   \n}\n```\n\n`addURLParam()`\
  \ 函数接受三个参数：要添加参数的 URL、参数名称和参数值。首先，函数检查 URL 是否已经包含问号（以判断是否已其他参数）。如果不包含，函数将追加一个问号；否则则添加一个\
  \ ampersand。接下来，对名称和值进行编码并附加到 URL 末尾。最后一步是返回更新后的 URL。\n\n此函数可以用于构建请求的 URL，如下例所示：\n\
  \n```\nvar url = \"example.php\";\n\n//add the arguments\nurl = addURLParam(url,\
  \ \"name\", \"Nicholas\");\nurl = addURLParam(url, \"book\", \"Professional JavaScript\"\
  );\n\n//initiate request\nxhr.open(\"get\", url, false);\n```\n\n在这里使用 `addURLParam()`\
  \ 函数确保了查询字符串格式正确，可供 XHR 对象使用。\n\n## POST 请求\n\n第二种常见的请求类型是 POST，它通常用于向服务器发送应该保存的数据。每个\
  \ POST 请求都预期以请求正文提交数据，而 GET 请求传统上并不这样做。POST 请求的正文可以包含非常量的数据，且这些数据可以是任何格式。你可以通过指定\
  \ post 作为 `open()` 方法的第一个参数来启动 POST 请求。例如：\n\n```\nxhr.open(\"post\", \"example.php\"\
  , true);\n```\n\n第二部分是将数据传递给 `send()` 方法。由于 XHR 最初主要设计用于处理 XML，你可以传入任何序列化并作为正文提交的字符串。默认情况下，POST\
  \ 请求在服务器看来与表单提交相同。但你可以使用 XHR 模拟表单提交。第一步是设置 `Content-Type` 头部。然后使用第 14 章的 `serialize()`\
  \ 函数创建字符串，如下所示：\n\n![image](img/logo1.gif)\n\n```\nfunction submitData(){\n    var\
  \ xhr = createXHR();        \n    xhr.onreadystatechange = function(){\n       \
  \ if (xhr.readyState == 4){\n            if ((xhr.status >= 200 && xhr.status <\
  \ 300) || xhr.status == 304){\n                alert(xhr.responseText);\n      \
  \      } else {\n                alert(\"Request was unsuccessful: \" + xhr.status);\n\
  \            }\n        }\n    };\n\n    xhr.open(\"post\", \"example.php\", true);\n\
  \    xhr.setRequestHeader(\"Content-Type\", \"application/x-form-urlencoded\");\n\
  \    var form = document.getElementById(\"user-info\");            \n    xhr.send(serialize(form));\n\
  }\n```\n\nXHRPostExample01.htm\n\n在此函数中，来自 ID 为 \"user-info\" 的表单数据被序列化并发送到服务器。PHP\
  \ 文件 `example.php` 随后可以通过 `$_POST` 获取提交的数据。考虑此示例：\n\n```php\n<?php\n    header(\"\
  Content-Type: text/plain\");   \n    echo <<<EOF\nName: {$_POST['user-name']}\n\
  Email: {$_POST['user-email']}\nEOF;\n?>\n```\n\npostexample.php\n\n如果不包含 `Content-Type`\
  \ 头部，数据将不会出现在 `$_POST` 全局变量中——你需要使用 `$HTTP_RAW_POST_DATA` 来访问它。\n\nPOST 请求比 GET\
  \ 请求有更多的开销。在性能方面，发送相同数据量，GET 请求可以比 POST 请求快两倍。\n\n\n\n\n\n`XHR` 对象作为事实上的标准的流行，导致了\
  \ W3C 制定了官方规范来管理其行为。`XMLHttpRequest` Level 1 仅定义了 `XHR` 对象已有的实现细节。`XMLHttpRequest`\
  \ Level 2 则进一步演进了 `XHR` 对象。并不是所有浏览器都实现了 Level 2 规范的所有部分，但所有浏览器都实现了一些部分功能。\n\n##\
  \ FormData 类型\n\n现代 Web 应用程序经常需要对表单数据进行序列化，因此 `XMLHttpRequest` Level 2 规范引入了 `FormData`\
  \ 类型。`FormData` 类型可以轻松地对现有表单进行序列化，并创建与表单格式相同的数据以便通过 `XHR` 传输。以下代码创建了一个 `FormData`\
  \ 对象并为其填充了一些数据：\n\n```\nvar data = new FormData();\ndata.append(\"name\", \"Nicholas\"\
  );\n```\n\n`append()` 方法接受两个参数：键（key）和值（value），本质上是表单字段的以及该字段包含的值。你可以根据需要添加任意数量的键值对。通过将表单元素传递给\
  \ `FormData` 构造函数，也可以用表单元素中存在的数据预填充键值对：\n\n```\nvar data = new FormData(document.forms[0]);\n\
  ```\n\n一旦你拥有 `FormData` 实例，就可以将其直接传递给 `XHR` 的 `send()` 方法，如下例所示：\n\n![image](img/logo1.gif)\n\
  \n```\nvar xhr = createXHR();        \nxhr.onreadystatechange = function(){\n  \
  \  if (xhr.readyState == 4){\n        if ((xhr.status >= 200 && xhr.status < 300)\
  \ || xhr.status == 304){\n            alert(xhr.responseText);\n        } else {\n\
  \            alert(\"Request was unsuccessful: \" + xhr.status);\n        }\n  \
  \  }\n};\n\nxhr.open(\"post\", \"postexample.php\", true);\nvar form = document.getElementById(\"\
  user-info\");            \nxhr.send(new FormData(form));\n```\n\nXHRFormDataExample01.htm\n\
  \n`FormData` 类型的便利之处是，你不需要在 `XHR` 对象上显式地设置任何请求头。`XHR` 对象会识别传入的数据类型为 `FormData` 实例，并相应地配置头部。\n\
  \n`FormData` 类型在 Firefox 4+、Safari 5+、Chrome 以及 Android Web 3+ 中支持。\n\n## 超时 (Timeouts)\n\
  \n在 Internet Explorer 8 中，`XHR` 对象被增强了一个 `timeout` 属性，该属性表示请求在中止前应等待响应的毫秒数。当 `timeout`\
  \ 属性被设置为一个数字且在指定的毫秒内没有收到响应时，会触发超时事件并调用 `ontimeout` 事件处理程序。此功能后来被添加到 `XMLHttpRequest`\
  \ Level 2 规范中。这里有一个示例：\n\n![image](img/logo1.gif)\n\n```\nvar xhr = createXHR();\n\
  xhr.onreadystatechange = function(){\n    if (xhr.readyState == 4){\n        try\
  \ {\n            if ((xhr.status >= 200 && xhr.status < 300) || xhr.status == 304){\n\
  \                alert(xhr.responseText);\n            } else {\n              \
  \  alert(\"Request was unsuccessful: \" + xhr.status);\n            }\n        }\
  \ catch (ex){\n            //假设由 ontimeout 处理\n        }\n    }\n};\n\nxhr.open(\"\
  get\", \"timeout.php\", true);\nxhr.timeout = 1000;  //设置 1 秒超时（仅限 IE 8+）\nxhr.ontimeout\
  \ = function(){\n    alert(\"Request did not return in a second.\");\n};\nxhr.send(null);\
  \ \n```\n\nXHRTimeoutExample01.htm\n\n此示例说明了 `timeout` 属性的使用。将其设置为 1000 毫秒意味着如果请求在\
  \ 1 秒或更短时间内没有返回，请求将被中止。当发生这种情况时，会调用 `ontimeout` 事件处理程序。`readyState` 仍然变为 4，这意味着会调用\
  \ `onreadystatechange` 事件处理程序。但是如果你在超时后尝试访问 `status` 属性，将会发生错误。为了防止这种情况，请将检查 `status`\
  \ 属性的代码封装在 `try-catch` 语句中。\n\n截至本文写作，Internet Explorer 8+ 仍然是支持超时的浏览器。\n\n## overrideMimeType()\
  \ 方法\n\nFirefox 首次引入 `overrideMimeType()` 作为覆盖 `XHR` 响应的 MIME 类型的方法。这后来被添加到 `XMLHttpRequest`\
  \ Level 2 中。由于响应返回的 MIME 类型决定了 `XHR` 对象如何处理响应，因此拥有一种覆盖服务器返回类型的方法是一个非常有用的补充。\n\n\
  考虑服务器发送了 `text/plain` MIME 类型，但实际上包含 XML 的情况。这将导致 `responseXML` 属性为空，尽管数据实际上是 XML。通过调用\
  \ `overrideMimeType()`，你可以确保响应被视为 XML 而不是纯文本：\n\n```\nvar xhr = createXHR();\nxhr.open(\"\
  get\", \"text.php\", true);\nxhr.overrideMimeType(\"text/xml\");\nxhr.send(null);\n\
  ```\n\n此示例强制 `XHR` 对象将响应视为 XML 而不是纯文本。对 `overrideMimeType()` 的调用必须在调用 `send()` 之前发生，以便正确覆盖响应类型。\n\
  \n`overrideMimeType()` 方法在 Firefox、Safari 4+ 和 Chrome 中支持。\n\n## 进度事件 (PROGRESS\
  \ EVENTS)\n\n进度事件规范是定义客户端与服务器通信的 W3C 工作草案。这些事件最初针对 XHR，但现在已进入其他 API。共有六种进度事件：\n\n\
  * `loadstart` —— 当接收到第一个字节的响应时触发。\n* `progress` —— 在正在接收响应时反复触发。\n* `error` —— 当尝试出错时触发。\n\
  * `abort` —— 当通过 `abort()` 终止连接时触发。\n* `load` —— 当完全接收响应时触发。\n* `loadend` —— 在触发\
  \ `error`、`abort` 或 `load` 后触发。\n\n每个请求都从触发 `loadstart` 事件开始；随后是一个或多个 `progress`\
  \ 事件；然后是 `error`、`abort` 或 `load` 之一；最后以 `loadend` 结束。\n\n前五个事件在 Firefox 3.5+、Safari\
  \ 4+、Chrome、iOS Safari 以及 Android Web 中支持。Opera 11 以及 Internet Explorer 8+ 仅支持 `load`。目前没有浏览器支持\
  \ `loadend` 事件。\n\n大多数事件都是直观的，但有两个需要注意的微妙之处。\n\n### load 事件\n\n当 Firefox 首次实现 `XHR`\
  \ 版本时，旨在简化交互模型。为此，`load` 事件被引入作为 `readyStatechange` 事件的替代品。`load` 事件在完全接收响应时就会触发，消除了检查\
  \ `readyState` 属性的需要。`onload` 事件处理程序接收一个事件对象，其 `target` 属性设置为 `XHR` 实例，所有的 `XHR`\
  \ 对象属性和方法在内部均可用。然而，并不是所有浏览器都正确实现了该事件的事件对象，因此需要使用 `XHR` 对象变量本身，如下所示：\n\n![image](img/logo1.gif)\n\
  \n```\nvar xhr = createXHR();\nxhr.onload = function(){\n    if ((xhr.status >=\
  \ 200 && xhr.status < 300) || xhr.status == 304){\n        alert(xhr.responseText);\n\
  \    } else {\n        alert(\"Request was unsuccessful: \" + xhr.status);\n   \
  \ }\n};\nxhr.open(\"get\", \"altevents.php\", true);\nxhr.send(null);\n```\n\nXHRProgressEvent01.htm\n\
  \n无论状态如何，只要从服务器收到响应，`load` 事件就会触发。这意味着你必须检查 `status` 属性来确定是否有可用数据。`load` 事件在 Firefox、Opera、Chrome\
  \ 和 Safari 中支持。\n\n### progress 事件\n\n\n\n\nMozilla 的另一项 XHR 创新是进度事件（progress event），它会在浏览器接收到新数据时定期触发。`onprogress`\
  \ 事件监听器接收一个事件对象，其 `target` 是 `XHR` 对象，并包含三个额外的属性：`lengthComputable`，一个指示是否有可用进度信息的\
  \ `Boolean` 值；`position`，表示已接收的字节数；以及 `totalSize`，由 `Content-Length` 响应头定义的预期总字节数。通过这些信息，你可以为用户提供进度指示器。以下代码包含了如何操作的示例：\n\
  \n```\nvar xhr = createXHR();        \nxhr.onload = function(event){\n    if ((xhr.status\
  \ >= 200 && xhr.status < 300) || \n            xhr.status == 304){\n        alert(xhr.responseText);\n\
  \    } else {\n        alert(\"Request was unsuccessful: \" + xhr.status);\n   \
  \ }\n};\nxhr.onprogress = function(event){\n    var divStatus = document.getElementById(\"\
  status\");\n    if (event.lengthComputable){\n        divStatus.innerHTML = \"Received\
  \ \" + event.position + \" of \" + \n            event.totalSize +\n\" bytes\";\n\
  \    }\n};\n\nxhr.open(\"get\", \"altevents.php\", true);\nxhr.send(null);\n```\n\
  \n`XHRProgressEventExample01.htm`\n\n为了正确执行，必须在调用 `open()` 之前绑定 `onprogress` 事件处理器。在前面的示例中，每当进度事件触发时，HTML\
  \ 元素都会填充状态信息。假设响应具有 `Content-Length` 头部，你还可以使用此信息来计算已接收响应的百分比。\n\n# 跨域资源共享 (CROSS-ORIGIN\
  \ RESOURCE SHARING)\n\n通过 `XHR` 进行 Ajax 通的主要限制之一是跨源安全策略。默认情况下，`XHR` 对象只能访问源网页所在域的资源。这一安全特性防止了某些恶意行为。然而，由于合法的跨域访问需求巨大，解决方案开始在浏览器中出现。\n\
  \n跨跨源资源共享（`CORS`）是一个 W3C 工作草案，定义了浏览器和服务器在访问跨源资源时必须如何通信。`CORS` 的基本思想是使用自定义 HTTP 头部，让浏览器和服务器都能获取足够的相互信息，以判断请求或响应应该成功还是失败。\n\
  \n对于简单的请求（即使用 `GET` 或 `POST` 且没有自定义头部、正体为 `text/plain` 的请求），发送时会带有一个名为 `Origin`\
  \ 的额外头部。`Origin` 头部包含请求页的源（协议、域名和端口），以便服务器可以轻松地判断是否应该提供响应。一个 `Origin` 头部示例可能如下：\n\
  \n```\nOrigin: http://www.nczonline.net\n```\n\n如果服务器决定允许该请求，它会发送一个 `Access-Control-Allow-Origin`\
  \ 头部，回显发送的相同源，或者如果是公共资源，则发送 `\"*\"`。例如：\n\n```\nAccess-Control-Allow-Origin: http://www.nczonline.net\n\
  ```\n\n如果缺少此头部，或者源不匹配，浏览器将拒绝该请求。如果一切正常，浏览器将处理该请求。注意，请求和响应都不包含 cookie 信息。\n\n## Internet\
  \ Explorer 中的 CORS\n\n微软在 Internet Explorer 8 中引入了 `XDomainRequest` (`XDR`）类型。该对象的工作方式与\
  \ `XHR` 类似，但对于跨域通信是安全可靠的。`XDR` 对象实现了 `CORS` 规范的一部分。以下是 `XDR` 与 `XHR` 的某些不同之处：\n\n\
  - Cookie 既不随请求发送，也不随响应接收。\n- 除了 `Content-Type` 之外，无法设置请求头部。\n- 无法访问响应头部。\n- 仅支持\
  \ `GET` 和 `POST` 请求。\n\n这些缓解了与跨站请求伪造 (`CSRF`) 和跨站脚本 (`XSS`) 攻击相关的问题。被请求的资源可以根据其认为合适的任何数据（用户代理、引用页等）动态决定是否设置\
  \ `Access-Control-Allow-Origin` 头部。作为请求的一部分，会发送一个带有请求源域值的 `Origin` 头部，允许远程资源显式识别\
  \ `XDR` 请求。\n\n`XDR` 对象的使用看起来与 `XHR` 对象非常相似。你创建一个新的 `XDomainRequest` ，调用 `open()`\
  \ 方法，然后调用 `send()` 方法。与 HR 对象的 `open()` 方法不同，XDR 对象上的方法只接受两个参数：请求类型和 URL。\n\n所有的\
  \ `XDR` 请求都是异步执行的，没有办法创建同步请求。当请求返回时，会触发 `load` 事件，`responseText` 属性将填充响应内容，如下：\n\
  \n![image](img/logo1.gif)\n\n```\nvar xdr = new XDomainRequest();\nxdr.onload =\
  \ function(){\n    alert(xdr.responseText);\n};\nxdr.open(\"get\", \"http://www.somewhere-else.com/page/\"\
  );\nxdr.send(null);\n```\n\n`XDomainRequestExample01.htm`\n\n当接收响应时，你只能访问响应的原始文本；无法确定响应的状态码。所有有效响应都会触发\
  \ `load` 事件，所有失败情况都会触发 `error` 事件，包括响应中缺少 `Access-Control-Allow-Origin` 头部。遗憾的是，你无法获得关于发生错误的额外信息，因此仅仅知道请求失败应该足够了。要检测错误，请分配一个\
  \ `onerror` 事件处理器，如示例所示：\n\n```\nvar xdr = new XDomainRequest();\nxdr.onload = function(){\n\
  \    alert(xdr.responseText);\n};\nxdr.onerror = function(){\n    alert(\"An error\
  \ occurred.\");\n};\nxdr.open(\"get\", \"http://www.somewhere-else.com/page/\");\n\
  xdr.send(null);\n```\n\n`XDomainRequestExample01.htm`\n\n![image](img/pen.gif)\n\
  \n由于 `XDR` 请求失败的方式有很多，你应该始终使用 `onerror` 事件处理器来捕捉发生的情况；否则它将静默失败。\n\n你可以通过如下调用 `abort()`\
  \ 在请求返回之前停止它：\n\n```\nxdr.abort();  //停止请求\n```\n\n同样与 `XHR` 类似，`XDR` 对象支持 `timeout`\
  \ 属性和 `ontimeout` 事件处理器。示例如下：\n\n```\nvar xdr = new XDomainRequest();\nxdr.onload\
  \ = function(){\n    alert(xdr.responseText);\n};\nxdr.onerror = function(){\n \
  \   alert(\"An error occurred.\");\n};\nxdr.timeout = 1000;\nxdr.ontimeout = function(){\n\
  \    alert(\"Request took too long.\");\n};\nxdr.open(\"get\", \"http://www.somewhere-else.com/page/\"\
  );\nxdr.send(null);\n```\n\n此示例在一秒后超时，此时会调用 `ontimeout` 事件处理器。\n\n为了允许 `POST` 请求，`XDR`\
  \ 对象暴露了 `contentType` 属性，用于指示发布数据的格式，如示例所示：\n\n```\nvar xdr = new XDomainRequest();\n\
  xdr.onload = function(){\n    alert(xdr.responseText);\n};\nxdr.onerror = function(){\n\
  \    alert(\"An error occurred.\");\n};\nxdr.open(\"post\", \"http://www.somewhere-else.com/page/\"\
  );\nxdr.contentType = \"application/x-www-form-urlencoded\";\nxdr.send(\"name1=value1&name2=value2\"\
  );\n```\n\n该属性是通过 `XDR` 对象访问头部信息的唯一方式。\n\n## 其他浏览器中的 CORS\n\nFirefox 3.5+、Safari\
  \ 4+、Chrome、iOS 版 Safari 以及 Android 版 WebKit 都通过 `XMLHttpRequest` 对象原生支持 `CORS`。当尝试打开不同源的资源时，这种行为会自动触发，无需额外代码。要向另一个域的资源发送请求，可以使用标准的\
  \ `XHR` 对象并在 `open()` 中指定绝对 URL，例如：\n\n\n\n\n\n```javascript\nvar xhr = createXHR();\n\
  xhr.onreadystatechange = function(){\n    if (xhr.readyState == 4){\n        if\
  \ ((xhr.status >= 200 && xhr.status < 300) || xhr.status == 304){\n            alert(xhr.responseText);\n\
  \        } else {\n            alert(\"Request was unsuccessful: \" + xhr.status);\n\
  \        }\n    }\n};\nxhr.open(\"get\", \"http://www.somewhere-else.com/page/\"\
  , true);\nxhr.send(null);\n```\n\n与 Internet Explorer 中的 `XDR` 对象不同，跨域 `XHR` 对象允许访问\
  \ `status` 和 `statusText` 属性，并允许同步请求。出于安全考虑，跨域 `XHR` 对象还有一些额外的限制。具体限制如下：\n\n*  \
  \ 无法使用 `setRequestHeader()` 设置自定义请求头（headers）。\n*   既不发送也不接收 Cookie。\n*   `getAllResponseHeaders()`\
  \ 方法始终返回空字符串。\n\n由于同域和跨域请求都使用相同的接口，因此在访问本地资源时最好始终使用相对 URL，在访问远程资源时使用绝对 URL。这可以区分用场景，并防止诸如限制本地资源访问头部和/或\
  \ Cookie 信息等问题。\n\n### 预检请求（Preflighted Requests）\n\nCORS 通过一种名为“预检请求”的透明服务器验证机制允许使用自定义头部、`GET`\
  \ 或 `POST`get 的方法以及不同的正文内容类型。当你尝试使用高级选项发送请求时，会向服务器发送“预检”请求。该请求使用 `OPTIONS` 方法并发送以下头部：\n\
  \n*   `Origin` — 与简单请求中的相同。\n*   `Access-Control-Request-Method` — 请求想要使用的方法。\n\
  *   `Access-Control-Request-Headers` — （可选）所使用的自定义头的逗号分隔列表。\n\n假设有一个带有名为 `NCZ` 的自定义头部的\
  \ `POST` 请求，示例如下：\n\n```\nOrigin: http://www.nczonline.net\nAccess-Control-Request-Method:\
  \ POST\nAccess-Control-Request-Headers: NCZ\n```\n\n在请求请求期间，服务器可以确定是否允许此类类型的请求。服务器通过在响应中发送以下头部来向浏览器传达：\n\
  \n*   `Access-Control-Allow-Origin` — 与简单请求中的相同。\n*   `Access-Control-Allow-Methods`\
  \ — 允许方法的逗号分隔列表。\n*   `Access-Control-Allow-Headers` — 服务器允许的头部逗号分隔列表。\n*   `Access-Control-Max-Age`\
  \ — 预检请求的缓存时间（秒）。\n\n例如：\n\n```\nAccess-Control-Allow-Origin: http://www.nczonline.net\n\
  Access-Control-Allow-Methods: POST, GET\nAccess-Control-Allow-Headers: NCZ\nAccess-Control-Max-Age:\
  \ 1728000\n```\n\n一旦发送了预检请求，其结果将在响应指定的时间内被缓存；你只有在第一次发送此类请求时才会产生额外的 HTTP 请求开销。\n\n\
  Firefox 3.5+、Safari 4+ 和 Chrome 均支持预检请求；Internet Explorer 10 及以下版本不支持。\n\n### 带凭据的请求（Credentialed\
  \ Requests）\n\n默认情况下，跨源请求不提供凭据（Cookie、HTTP 身份验证和客户端 SSL 证书）。你可以通过将 `withCredentials`\
  \ 属性设置为 `true` 来指定请求应发送凭据。如果服务器允许带凭据的请求，它将响应以下 HTTP 头部：\n\n```\nAccess-Control-Allow-Credentials:\
  \ true\n```\n\n如果发送了带凭据的请求且响应中没有包含此头部，则浏览器不会将响应传递给 JavaScript（`responseText` 为空字符串，`status`\
  \ 为 0，并且会调用 `onerror()`）。注意，服务器也可以将此 HTTP 头部作为预检响应的一部分发送，以指示源允许发送带凭据的请求。\n\nFirefox\
  \ 3.5+、Safari 4+ 和 Chrome 均支持 `withCredentials` 属性。Internet Explorer 10 及以下版本仍然不支持。\n\
  \n### 跨浏览器 CORS\n\n并不是所有浏览器都原生支持相同级别的 CORS，但所有支持 CORS 的浏览器都支持简单（非预检、非凭据）请求，因此拥有跨浏览器解决方案是有意义的。判断\
  \ `XHR` 对象是否支持 CORS 的简单方法是检查 `withCredentials` 属性是否存在。你可以结合 `XDomainRequest` 对象是否存在来覆盖所有浏览器：\n\
  \n![image](img/logo1.gif)\n\n```javascript\nfunction createCORSRequest(method, url){\n\
  \    var xhr = new XMLHttpRequest();\n    if (\"withCredentials\" in xhr){\n   \
  \     xhr.open(method, url, true);\n    } else if (typeof XDomainRequest != \"undefined\"\
  ){\n        xhr = new XDomainRequest();\n        xhr.open(method, url);\n    } else\
  \ {\n        xhr = null;\n    }\n    return xhr;\n}\n\nvar request = createCORSRequest(\"\
  get\", \"http://www.somewhere-else.com/page/\");\nif (request){\n    request.onload\
  \ = function(){\n        //对 request.responseText 进行处理\n    };\n    request.send();\n\
  }\n```\n\n`CrossBrowserCORSRequestExample01.htm`\n\n### 替代跨域技术\n\n在 CORS 出现之前，实现跨域\
  \ Ajax 要困难得多。开发者依赖于可以在不使用 XHR 对象的情况下执行跨域请求的 DOM 部分。\n\n#### 图片像素（Image Pings）\n\n\
  跨域通信的早期技术之一是通过使用 `<img>` 标签。任何页面都可以跨域加载图像而无需担心限制。这是在线广告跟踪浏览的主要方式。正如第 13 节所，你也可以动态创建图像，并使用它们的\
  \ `onload` 和 `onerror` 事件处理程序来告知何时接收响应。\n\n动态创建图像通常用于图片像素。图片像素是与服务器之间的简单跨域、单向通信。数据通过查询字符串参数发送，响应可以是任何内容，但通常是一个像素图像或\
  \ 204 响应。浏览器无法从图片像素中获取任何数据，但可以通过监听加载和错误事件来判断何时接收了响应。这是一个简单的示例：\n\n```javascript\n\
  var img = new Image();\nimg.onload = img.onerror = function(){\n    alert(\"完成!\"\
  );\n};\nimg.src = \"http://www.example.com/test?name=Nicholas\";\n```\n\n`ImagePingExample01.htm`\n\
  \n\n\n\n\nJSONP 是 “JSON with padding”（带填充的 JSON）的缩写，是一种在 Web 服务中流行的 JSON 特殊变体。JSONP\
  \ 看起来 JSON，不同在于数据被包裹在一个看起来像函数调的内容。例如：\n\n```\ncallback({ \"name\": \"Nicholas\"\
  \ });\n```\n\nJSONP 格式由两部分组成：回调（callback）和数据。回调是在接收响应后在页面上调用的函数。通常回调名称是作为请求的一部分指定的。数据则是要传递给函数的\
  \ JSON 数据。一个典型的 JSONP 请求如下：\n\n```\nhttp://freegeoip.net/json/?callback=handleResponse\n\
  ```\n\n此 URL 指向一个 JSONP 地理位置服务。在 JSONP 服务中，将 `callback` 参数作为查询字符串参数是非常常见的，在这种情况下，我指定的回调函数名称为\
  \ `handleResponse()`。\n\nJSONP 通过动态 `script` 元素使用（详情请见第 13 章），将 `src` 赋值为跨域 URL。`script`\
  \ 元素类似于 `img`，能够无限制地从其他域加载资源。由于 JSONP 是有效的 JavaScript，因此 JSONP 响应在完成后会立即被拉入页面并执行。这是一个示例：\n\
  \nlogo1.gif\n\n```\nfunction handleResponse(response){\n    alert(\"You're at IP\
  \ address \" + response.ip + \", which is in \" + \n          response.city + \"\
  , \" + response.region);\n}\n\nvar script = document.createElement(\"script\");\n\
  script.src = \"http://freegeoip.net/json/?callback=handleResponse\";\ndocument.body.insertBefore(script,\
  \ document.firstChild);\n```\n\n01.htm\n\n此示例显示了你来自地理位置服务的 IP 地址和位置信息。JSONP 因为其简单易用而在\
  \ Web 开发者中非常受欢迎。它相对于 ping（ping）的优势在于你可以直接访问响应，允许浏览器和服务器之间的双向通信。然而，使用 JSONP 也有一些缺点。\n\
  \n首先，你正在从另一个域向你的页面中拉取可执行的代码。如果该域不可信，它可以很容易地将响应替换为恶意内容，你除了完全移除 JSONP 调用外将无计可施。使用\
  \ Web 服务时，请确保它来自可靠源。\n\n第二个缺点是没有简单的方法来判断 JSONP 请求是否失败。尽管 HTML5 为 `script` 元素指定了\
  \ `onerror` 事件处理程序，但目前没有任何浏览器实现它。开发者经常使用计时器来查看是否在规定时间内收到了响应，但即使这样也很棘手，因为并不是每个用户都有相同的连接速度和带宽。\n\
  \n## Comet\n\nComet 是 Alex Russell 创造的一个术语，用于描述一种更高级的技术，有时被称为服务器推送（server push）。如果说\
  \ Ajax 被描述为页面从服务器请求数据，那么 Comet 被描述为服务器将数据推送到页面。这种方法允许信息以更接近实时的方式进入页面，使其非常适用于体育比分或股票价格等信息。\n\
  \nComet 有两种流行的方法：长轮（long polling）和流式（streaming）。长轮是传统轮询（也称为短轮）的变体，浏览器定期向服务器发送请求以检查是否有任何数据。图\
  \ 21-1 显示了短轮的工作时间线。\n\nf721-01.jpg\n\n长轮将短轮反转过来。页面向服务器发起请求，服务器保持该连接开启，直到有数据要发送。一旦发送了数据，浏览器会关闭连接，并立即向服务器开启一个新连接。只要页面在浏览器中打开，这个过程就会持续进行。图\
  \ 21-2 显示了长轮的工作时间线。\n\nf722-01.jpg\n\n在短轮和长轮中，浏览器都需要在接收数据之前发起与服务器的连接。主要的区别在于服务器如何处理返回的数据。短轮无论数据是否可用都会立即发送响应，而长轮则等待发送响应。轮询技术的优势是所有浏览器都通过\
  \ `XMLHttpRequest` 对象和使用 `setTimeout()` 支持这种技术。你只需要管理请求发送的时机即可。\n\nComet 的另一种流行方法是\
  \ HTTP 流。流式与任何轮询技术都不同，因为它在整个页面生命周期内使用单个 HTTP 连接。浏览器向服务器发送请求，服务器保持该连接开启，并通过连接定期发送数据。例如，一个\
  \ PHP 服务器可能会有如下所示所示：\n\n```php\n<?php\n    $i = 0;\n    while(true){\n\n       \
  \ //输出一些数据然后立即刷新输出缓冲区\n        echo \"Number is $i\";\n        flush();\n\n    \
  \    //等待几秒\n        sleep(10);\n\n        $i++;\n    }\n```\n\n所有服务端语言都支持打印到输出缓冲区然后刷新（将内容发送给客户端）的概念。这是\
  \ HTTP 流的核心。在 Firefox、Safari、Opera 和 Chrome 中，可以使用 `XMLHttpRequest` 对象通过监听 `onreadystatechange`\
  \ 事件并关注 `readyState` 3 来实现 HTTP 流。当数据从服务器接收时，`readyState` 为 3 会在所有这些浏览器中定期触发。在那个点上，`responseText`\
  \ 属性包含了所有收到的数据，这意味着你需要通过跟踪之前已发送的内容来切掉最新的部分。使用 `XMLHttpRequest` 实现的 HTTP 流所示：\n\n\
  logo1.gif\n\n```\nfunction createStreamingClient(url, progress, finished){     \
  \   \n\n    var xhr = new XMLHttpRequest(),\n        received = 0;\n\n    xhr.open(\"\
  get\", url, true);\n    xhr.onreadystatechange = function(){\n        var result;\n\
  \n        if (xhr.readyState == 3){\n\n            //仅获取新数据并调整计数\n            result\
  \ = xhr.responseText.substring(received);\n            received += result.length;\n\
  \n            //调用进度回调\n            progress(result);\n\n        } else if (xhr.readyState\
  \ == 4){\n            finished(xhr.responseText);\n        }\n    };\n    xhr.send(null);\n\
  \    return xhr;\n}\n\nvar client = createStreamingClient(\"streaming.php\", function(data){\n\
  \                alert(\"Received: \" + data);\n             }, function(data){\n\
  \                alert(\"Done!\");\n             });\n```\n\n\n\n\n\n尽管这个示例相对简单并且在大多数浏览器中都能运行（Internet\
  \ Explorer 除外），但 Comet 模式的连接管理很容易出错，并且需要时间来完善。浏览器社区认为 Comet 是 Web 未来的一个重要部分，因此创建了两个新接口来让\
  \ Comet 变得更加简单。\n\n## 跨服务器发送事件 (Server-Sent Events)\n\n服务器发送事件 (SSE) 是一种用于只读 Comet\
  \ 交互的 API 和模式。`SSE` API 创建了一个到服务器的单向 HTTP 连接，服务器可以通过该连接传递尽可能或尽可能少的信息。服务器响应的 MIME\
  \ 类型必须为 `text/event-stream`，并以特定格式输出信息，由浏览器 API 解析并通过 JavaScript 提供。SSE 支持短轮询、长轮询和\
  \ HTTP 流，因此它在连接断开时会自动确定何时重新连接到服务器。结果是一个极其简单且实用的 API，让 Comet 变得简单。\n\nFirefox 6+、Safari\
  \ 5+、Opera 11+、Chrome 以及 iOS Safari 4+ 支持服务器发送事件。\n\n### API\n\n`SSE` 的 JavaScript\
  \ API 与其他最近的 JavaScript 消息 API 。要订阅新的事件流，首先创建一个新的 `EventSource` 对象并传入入口点：\n\n```\n\
  var source = new EventSource(\"myevents.php\");\n```\n\n注意，引用的 URL 必须与创建对象的页面处于同源（方案、域名和端口）。`EventSource`\
  \ 实例有一个 `readyState` 属性，其设置为 `0` 表示正在连接到服务器，`1` 表示连接已打开，`2` 表示连接已关闭。\n\n还有三个事件：\n\
  \n*   `open`：在建立连接时触发\n*   `message`：在从服务器接收到新事件时触发\n*   `error`：在无法建立连接时触发\n\n\
  在常规用法中，`onmessage` 事件处理器可能是你用得最多的一个：\n\n```\nsource.onmessage = function(event){\n\
  \    var data = event.data;\n    //对数据进行一些操作\n};\n```\n\n从服务器传回的信息将通过 `event.data`\
  \ 以字符串形式返回。\n\n默认情况下，`EventSource` 对象会尝试保持服务器的连接活跃。如果连接关闭，将会尝试重新连接。这意味着服务器发送事件可以长轮询和\
  \ HTTP 流配合。你可以通过调用 `close()` 方法强制对象立即断开连接并停止尝试重新连接：\n\n```\nsource.close();\n```\n\
  \n### 事件流\n\n服务器事件通过带有 MIME 类型为 `text/event-stream` 的持久 HTTP 响应发送。响应的格式为纯文本，在最简单的形式下，由前缀\
  \ `data:` 后跟文本组成，例如：\n\n```\ndata: foo\n\ndata: bar\n\ndata: foo\ndata: bar\n```\n\
  \n流的第一部分触发一个消息事件，并将 `event.data` 设置为“foo”；第二部分触发一个消息事件，并将 `event.data` 设置为“bar”；第三部分触发一个消息事件，并将\
  \ `event.data` 设置为“foo\\nbar”（注意中间的换行符）。当两或更多连续行以 `data:` 开头时，它被解释为多行数据，值将用换行符连接在一起。在包含\
  \ `data:` 的行之后遇到空行之前，消息事件永远不会触发，因此在服务器上生成事件流时，务必包含那个额外的换行符。\n\n你也可以通过在 `data:` 行之前或包含\
  \ `id:` 行来为特定事件关联 ID：\n\n```\ndata: foo\nid: 1\n```\n\n通过设置 ID，`EventSource` 对象会跟踪最后一个触发的事件。如果连接掉落，请求将将带一个名为\
  \ `Last-Event-ID` 的特殊 HTTP 头部，以便服务器可以确定下一个触发哪个事件合适。这对于在多个连接上保持顺序数据片段的正确顺序至关重要。\n\
  \n## Web Socket\n\nWeb Socket 是最受关注的新浏览器 API 之一。Web Socket 的目标是通过单个长连接与服务器之间提供全双工、双向的通信。当在\
  \ JavaScript 中创建 Web Socket 时，会向服务器发送一个 HTTP 请求以初始化连接。当服务器响应时，该连接将使用 HTTP 升级（upgrade）从\
  \ HTTP 切换到 Web Socket 协议。这意味着 Web Socket 无法通过标准的 HTTP 服务器实现，必须使用支持该协议的专用服务器才能正常工作。\n\
  \n由于 Web Socket 使用自定义协议，URL 方案略有不同。不再使用 `http://` 或 `https://` 方案，而是用于不安全连接的 `ws://`\
  \ 和用于安全连接的 `wss://`。在指定 Web Socket URL 时，你必须包含方案，因为未来可能支持其他方案。\n\n与 HTTP 相比，使用自定义协议的优势是可以在客户端和服务器之间发送极少量的数据，不受\
  \ HTTP 字节开销的限制。使用较小的数据包使得 Web Socket 成为带宽和延迟问题移动应用的理想选择。使用自定义协议的劣势是定义协议比定义 JavaScript\
  \ API 花了更长时间。由于人们在一致性和安全性方面发现了问题，Web Socket 曾多次阻塞。Firefox 4 和 Opera 11 最初都默认启用了\
  \ Web Socket，但由于安全考虑，在发布前禁用了它。现在 Firefox 6+、Safari 5+、Chrome 以及 iOS Safari 4+ 都支持\
  \ Web Socket。\n\n### API\n\n要创建一个新的 Web Socket，请实例化 `WebSocket` 对象并传入提供连接的 URL：\n\
  \n```\nvar socket = new WebSocket(\"ws://www.example.com/server.php\");\n```\n\n\
  注意，你必须向 `WebSocket` 构造函数传递一个绝对 URL。同源策略不适用于 Web Socket，因此你可以向任何站点打开连接。是否与来自特定源的页面进行通信完全取决于服务器。（服务器可以使用握手中的信息判断请求源自哪里。）\n\
  \n一旦 `WebSocket` 对象被实例化，浏览器就会尝试创建连接。与 XHR 类似，`WebSocket` 有一个指示当前状态的 `readyState`\
  \ 属性。然而，这些值与 XHR 不同，如下：\n\n*   `WebSocket.OPENING` (0)：正在建立连接。\n*   `WebSocket.OPEN`\
  \ (1)：连接已建立。\n*   `WebSocket.CLOSING` (2)：连接正在开始关闭。\n*   `WebSocket.CLOSE` (3)：连接已关闭。\n\
  \n`WebSocket` 没有 `readyStatechange` 事件；但是有其他对应各种状态的事件。`readyState` 始终从 0 开始。\n\n\
  你可以随时使用 `close()` 方法关闭 Web Socket 连接：\n\n```\nsocket.close();\n```\n\n调用 `close()`\
  \ 后，`readyState` 立即变为 2 (正在关闭)，并在完成后转换为 3。\n\n### 发送/接收数据\n\n一旦 Web Socket 打开，你就可以通过连接发送数据并接收数据。要向服务器发送数据，使用\
  \ `send()` 方法并传入任何字符串，例如：\n\n```\nvar socket = new WebSocket(\"ws://www.example.com/server.php\"\
  );\nsocket.send(\"Hello world!\");\n```\n\n由于 Web Socket 只能在连接上发送纯文本，因此在通过连接发送更复杂的数据结构之前，你需要对其进行序列化。以下代码将数据序列化为\
  \ JSON 字符串，然后将字符串发送到服务器：\n\n```\nvar message = {\n    time: new Date(),\n    text:\
  \ \"Hello world!\",\n    clientId: \"asdfp8734rew\"\n};\n\nsocket.send(JSON.stringify(message));\n\
  ```\n\n服务器随后需要解析返回的 JSON 以访问数据。\n\n\n\n\n当服务器向客户端发送消息时，`WebSocket` 对象上会触发消息事件（message\
  \ event）。消息事件与其他消息协议类似，可以通过 `event.data` 属性获取有效负载：\n\n```\nsocket.onmessage = function(event){\n\
  \    var data = event.data;\n\n    //do something with data\n};\n```\n\n与通过 `send()`\
  \ 发送到服务器的数据一样，`event.data` 中返回的数据始终是字符串。如果你期望的是其他数据格式，则必须手动解析数据。\n\n### 其他事件\n\n\
  `WebSocket` 对象在连接的生命周期内还有三个触发事件：\n\n- `open` — 在连接成功建立时触发。\n- `error` — 在发生错误时触发。连接无法持续维持。\n\
  - `close` — 在连接关闭时触发。\n\n`WebSocket` 对象不支持 DOM Level 2 事件监听器，因此你需要为每个事件使用 DOM Level\
  \ 0 风格的事件处理器：\n\n```javascript\nvar socket = new WebSocket(\"ws://www.example.com/server.php\"\
  );\n\nsocket.onopen = function(){\n    alert(\"Connection established.\");\n};\n\
  \nsocket.onerror = function(){\n    alert(\"Connection error.\");\n};\n\nsocket.onclose\
  \ = function(){\n    alert(\"Connection closed.\");\n};\n```\n\n在这三个事件中，只有 `close`\
  \ 事件在事件对象上包含额外信息。事件对象上还有三个额外属性：`wasClean`，一个指示连接是否正常关闭的布尔值；`code`，从服务器发送的数值状态码；以及\
  \ `reason`，一个包含服务器发送的消息的字符串。你可能想使用这些信息将其显示给用户或记录下来用于分析：\n\n```javascript\nsocket.onclose\
  \ = function(event){\n    console.log(\"Was clean? \" + event.wasClean + \" Code=\"\
  \ + event.code + \" Reason=\" \n                + event.reason);\n};\n```\n\n###\
  \ SSE 与 Web Sockets\n\n在决定针对特定用例使用 SSE 还是 Web Sockets 时，你可以考虑几个因素。首先，你是否有灵活性来搭建\
  \ WebSocket 服务器？由于 WebSocket 协议不是 HTTP，你现有的 Web 服务器可能不支持 WebSocket 通信。SSE 运行在普通的\
  \ HTTP 上，因此你可能可以使用现有的 Web 服务器来执行此类通信。\n\n第二个问的问题是你是否需要双向通信。如果用例只需要对服务器数据进行只读访问（例如体育得分），那么\
  \ SSE 可能更容易实现。如果用例需要完全的双向支持（例如聊天室），那么 Web Sockets 可能是更好的选择。请记住，如果 Web Sockets 对你不可行，你仍然可以通过\
  \ `XHR` 和 SSE 结合来实现双向通信。\n\n### 安全性\n\n关于 Ajax 和 Comet 的安全性有很多报道；事实上，有整本书都专门探讨这个主题。大规模\
  \ Ajax 应用的安全考量是海量的，但对于通用的 Ajax 安全性，有一些基础知识是需要的。\n\n首先，任何可以通过 `XHR` 访问的 URL 也可以被浏览器或服务器访问。例如，考虑以下\
  \ URL：\n\n```\n/getuserinfo.php?id=23\n```\n\n如果对此 URL 发起请求，它预计会返回关于 ID 为 23 的用户的数据。没有什么能阻止人们将\
  \ URL 修改为用户 ID 24、56 或任何其他值。`getuserinfo.php` 文件必须知道请求者是否真的有权访问所请求的数据；否则，你将让服务器处于完全开放状态，中继任何人的数据。\n\
  \n当一个未经授权的系统能够访问资源时，被视为跨站请求伪造（CSRF）攻击。未经授权的系统使自己在处理请求的服务器看来看起来是合法的。无论大小，Ajax 应用都受到过\
  \ CSRF 攻击的影响，攻击范围从无意的漏洞证明攻击到恶意的数据窃取或数据破坏攻击。\n\n关于保护通过 `XHR` 访问的 URL 的主流理论是验证发送者是否有权访问该资源。可以通过以下方式实现：\n\
  \n- 要求访问可以通过 `XHR` 请求的资源使用 SSL。\n- 要求在每个请求时发送一个计算后的令牌（token）。\n\n请注意，以下方法对 CSRF\
  \ 攻击无效的：\n\n- 要求使用 `POST` 代替 `GET` — 这很容易被更改。\n- 使用 `referrer` 作为来源判断依据 — Referrers\
  \ 很容易被伪造。\n- 基于 `cookie` 信息进行验证 — 同样很容易被伪造。\n\n`XHR` 对象提供了一个初看起来安全但实际上非常不安全的功能。`open()`\
  \ 方法实际上还有两个参数：`username` 和 `password`，它们应该随请求一起发送。这可以用于向服务器上通过 SSL 的页面发送请求，如下例所示：\n\
  \n```javascript\nxhr.open(\"get\", \"example.php\", true, \"username\", \"password\"\
  ); //AVOID!!!!!\n```\n\n![image](img/pen.gif)\n\n尽管这种用户名/密码功能是可能的，但你应该避免使用该功能。在\
  \ JavaScript 中存储用户名和密码是非常不安全的，因为任何拥有 JavaScript 调试器的人都可以查看存储在变量的内容，从而以明文形式暴露你的用户名和密码。\n\
  \n# 总结\n\nAjax 是一种在不刷新当前页面的情况下从服务器检索数据的方法。Ajax 具有以下特征：\n\n- 负责 Ajax 成的核心对象是 `XMLHttpRequest`\
  \ (`XHR`) 对象。\n- 该对象由微软创建，并首次在 Internet Explorer 5 中引入，作为 JavaScript 从服务器获取 XML\
  \ 数据的方法。\n- 之后，Firefox、Safari、Chrome 和 Opera 都复制了该实现，W3C 也编写了一份定义 `XHR` 的规范。\n-\
  \ 尽管实现存在差异，但 `XHR` 的基本用法在所有浏览器中都是标准化的，并且可以安全使用。\n\n\n\n\nJavaScript 是一种极其灵活的语言，可以以多种风格使用。通常情况下，JavaScript\
  \ 以过程化或面向对象的方式使用。然而，由于其动态性质，该语言能够实现许多复杂且有趣的模式。这些技术利用了 ECMAScript 语言特性、BOM 扩展和 DOM\
  \ 功能来实现强大的效果。\n\n# 高级函数\n\n函数是 JavaScript 最有趣的部分之一。它们在本质上可以非常简单且是过程化的，也可以非常复杂且动态。通过使用闭包可以实现额外的功能。此外，由于所有函数都是对象，函数指针非常容易使用。所有这一切使得\
  \ JavaScript 函数既有趣又强大。接下来的章节概述了在 JavaScript 中使用函数的一些高级方法。\n\n## 安全类型检测\n\nJavaScript\
  \ 内置的类型检测机制并非万无可击，事实上，它们有时会产生误报或漏报。例如，`typeof` 运算符有几个异常，这使得它在检测某些类型的数据时变得不可靠。由于\
  \ Safari（在 4 版本之前）在将 `typeof` 应用于正则表达式时会返回 \"function\"，因此很难确定判断一个值是否为函数。\n\n`instanceof`\
  \ 运算符也存在问题，因为当存在多个全局作用域（例如存在多个帧 frames）时，它很难使用。第 5 章中提到的该问题的经典示例是尝试使用以下代码将一个对象识别为数组：\n\
  \n```javascript\nvar isArray = value instanceof Array;\n```\n\n只有当 `value` 是数组且在与\
  \ `Array` 构造函数相同的全局作用域中创建时，此代码才会返回 true。（记住，`Array` 是 `window` 的一个属性）。如果 `value`\
  \ 来自另一个帧的数组，此代码将返回 false。\n\n类型检测的另一个问题出现在尝试确定一个对象是原生实现还是开发者定义的实现时。当浏览器开始原生实现 `JSON`\
  \ 对象时，这个问题凸显了出来。由于许多人已经在使用 Douglas Crockford 的 `JSON` 库（该库定义了一个全局 `JSON` 对象），开发者很难确定页面上存在的是哪一个对象。\n\
  \n所有这些问题的解决方案是相同的。可以使用任何值调用 `Object` 的原生 `toString()` 方法，返回格式为 `[object NativeConstructorName]`\
  \ 的字符串。每个对象都有一个内部属性 `[[Class]]`，它指定了作为该字符串部分返回的构造函数名称。例如：\n\n```javascript\nalert(Object.prototype.toString.call(value));\
  \   //\"[object Array]\"\n```\n\n由于数组的原生构造函数名称无论其创建时的全局上下文如何都是相同的，使用 `toString()`\
  \ 可以返回一个一致的值。这允许你创建一个这样的函数：\n\n```javascript\nfunction isArray(value){\n    return\
  \ Object.prototype.toString.call(value) == \"[object Array]\";\n}\n```\n\n同样的方法可以用于判断一个值是否为原生函数或正则表达式：\n\
  \n```javascript\nfunction isFunction(value){\n    return Object.prototype.toString.call(value)\
  \ == \"[object Function]\";\n}\nfunction isRegExp(value){\n    return Object.prototype.toString.call(value)\
  \ == \"[object RegExp]\";\n}\n```\n\n注意，在 Internet Explorer 中，对于任何实现为 COM 对象而非原生\
  \ JavaScript 函数，`isFunction()` 将返回 false（更多细节请参阅第 10 章）。\n\n这种技术也广泛用于识别原生 `JSON`\
  \ 对象。`Object` 的 `toString()` 方法无法确定非原生构造函数的构造函数名称，因此任何开发者定义构造函数的实例对象都会返回 `[object\
  \ Object]`。一些 JavaScript 库包含类似下面的代码：\n\n![image](img/logo1.gif)\n\n```javascript\n\
  var isNativeJSON = window.JSON && Object.prototype.toString.call(JSON) == \n\"[object\
  \ JSON]\";\n```\n\n在 Web 开发中，区分原生和非原生 JavaScript 对象非常重要，以确保你了解一个对象的可用功能。这种技术可以用于任何对象，以确定地做出这种判断。\n\
  \n![image](img/cross.gif)\n\n请记住，可以将 `Object.prototype.toString()` 赋值为不同的值。本节讨论的技术假设\
  \ `Object.prototype.toString()` 是原生版本且未被开发者覆盖。\n\n## 作用域构造函数\n\n第 6 章涵盖了定义自定义对象的构造函数的定义和用法。你可能记得构造函数仅仅是一个使用\
  \ `new` 运算符调用的函数。当这样使用时，构造函数内部使用的 `this` 对象指向新创建的对象实例，如下例所示：\n\n![image](img/logo1.gif)\n\
  \n```javascript\nfunction Person(name, age, job){\n    this.name = name;\n    this.age\
  \ = age;\n    this.job = job;\n}\n\nvar person = new Person(\"Nicholas\", 29, \"\
  Software Engineer\");\n```\n\nScopeSafeConstructorsExample01.htm\n\n在这个示例中，`Person`\
  \ 构造函数使用 `this` 对象分配了三个属性：`name`、`age` 和 `job`。当配合 `new` 运算符使用时，会创建一个新的 `Person`\
  \ 对象并将属性赋值到上面。问题发生在没有使用 `new` 运算符调用构造函数时。由于 `this` 对象是在运行时绑定的，直接调用 `Person()` 将其映射到全局对象（`window`），导致意外地增强了错误的对象。例如：\n\
  \n```javascript\nvar person = Person(\"Nicholas\", 29, \"Software Engineer\");\n\
  alert(window.name);     //\"Nicholas\"\nalert(window.age);      29\nalert(window.job);\
  \      //\"Software Engineer\"\n```\n\nScopeSafeConstructorsExample01.htm\n\n在这里，`window`\
  \ 对象被增加了用于 `Person` 实例的三个属性，因为构造是作为普通函数调用的。这个问题由于 `this` 对象的后期绑定引起，在这种情况下它解析为 `window`。由于\
  \ `window` 的 `name` 属性用于识别目标和帧，这种对属性的意外覆盖会导致页面上的其他错误。解决方案是创建一个作用域安全的构造函数。\n\n作用域安全的构造函数首先检查\
  \ `this` 对象是否是该类型的实例，然后再应用任何更改。如果不是，则创建并返回一个新的实例。考虑这个示例：\n\n![image](img/logo1.gif)\n\
  \n```javascript\nfunction Person(name, age, job){\n    if (this instanceof Person){\n\
  \        this.name = name;\n        this.age = age;\n        this.job = job;\n \
  \   } else {\n        return new Person(name, age, job);\n    }\n}\n\nvar person1\
  \ = Person(\"Nicholas\", 29, \"Software Engineer\");\nalert(window.name);   //\"\
  \"\nalert(person1.name);  //\"Nicholas\"\n\nvar person2 = new Person(\"Shelby\"\
  , 34, \"Ergonomist\");\nalert(person2.name);  //\"Shelby\"\n```\n\nScopeSafeConstructorsExample02.htm\n\
  \n代码中的 `Person` 构造函数添加了一个 `if` 语句，用于确保 `this` 对象是 `Person` 的实例，这意味着使用了 `new` 运算符或者在\
  \ `Person` 实例的上下文中调用了构造函数。在任何情况下，对象初始化都会照常进行。如果不是 `Person` 的实例，则使用 `new` 运算符再次调用构造函数并返回该值。结果是，无论带不\
  \ `new` 调用 `Person` 构造函数都会返回 `Person` 的新实例，避免在全局对象上意外设置属性。\n\n作用域构造函数有一个注意事项。通过实现这种模式，你锁定了构造函数可以调用的上下文。如果你在继承中使用构造函数窃取模式，而没有同时使用原型链，你的继承可能会破坏。这是一个示例：\n\
  \n\n\n\n\n```\nfunction Polygon(sides){\n    if (this instanceof Polygon) {\n  \
  \      this.sides = sides;\n        this.getArea = function(){\n            return\
  \ 0;\n        };\n    } else {\n        return new Polygon(sides);\n    }\n}\n\n\
  function Rectangle(width, height){\n    Polygon.call(this, 2);\n    this.width =\
  \ width;\n    this.height = height;\n    this.getArea = function(){\n        return\
  \ this.width * this.height;\n    };\n}\n\nvar rect = new Rectangle(5, 10);\nalert(rect.sides);\
  \   //undefined\n```\n\n### ScopeSafeConstructorsExample03.htm\n\n在此代码中，`Polygon`\
  \ 构造函数是作用安全的（scope-safe），而 `Rectangle` 构造函数则不是。当创建一个 `Rectangle` 的实例时，它本应该通过 `Polygon.call()`\
  \ 从 `Polygon` 继承 `sides` 属性。然而，由于 `Polygon` 构造函数是作用安全的，`this` 对象并不是 `Polygon` 的实例，因此会创建并返回一个新的\
  \ `Polygon` 对象。`Rectangle` 构造函数中的 `this` 对象没有被扩展，且 `Polygon.call()` 返回的值未被使用，因此\
  \ `Rectangle` 实例上没有 `sides` 属性。\n\n如果在使用构造函数窃取（constructor stealing）的同时使用了原型链或寄生组合，这个问题就会解决。考虑以下示例：\n\
  \n![image](img/logo1.gif)\n\n```javascript\nfunction Polygon(sides){\n    if (this\
  \ instanceof Polygon) {\n        this.sides = sides;\n        this.getArea = function(){\n\
  \            return 0;\n        };\n    } else {\n        return new Polygon(sides);\n\
  \    }\n}\n\nfunction Rectangle(width, height){\n    Polygon.call(this, 2);\n  \
  \  this.width = width;\n    this.height = height;\n    this.getArea = function(){\n\
  \        return this.width * this.height;\n    };\n}\n\nRectangle.prototype = new\
  \ Polygon();\n\nvar rect = new Rectangle(5, 10);\nalert(rect.sides);   //2\n```\n\
  \n### ScopeSafeConstructorsExample04.htm\n\n在重写后的代码中，`Rectangle` 的实例也是 `Polygon`\
  \ 的实例，因此 `Polygon.call()` 按照预期方式工作，最终为 `Rectangle` 实例添加了 `sides` 属性。\n\n作用安全的构造函数在多个开发者编写运行在同一页面上的\
  \ JavaScript 代码的环境中非常有帮助。在这种情况下，对全局对象的意外更改可能会导致往往难以追踪的错误。除非你仅仅是为了实现完全基于构造函数窃取的继承，否则建议将作用安全的构造函数作为一种最佳实践。\n\
  \n## 懒加载函数 (Lazy Loading Functions)\n\n由于浏览器行为的差异，大多数 JavaScript 代码包含大量的 `if` 语句，用于将执行流分流到应该成功的代码。考虑上一章节中的\
  \ `createXHR()` 函数：\n\n```javascript\nfunction createXHR(){\n    if (typeof XMLHttpRequest\
  \ != \"undefined\"){\n        return new XMLHttpRequest();\n    } else if (typeof\
  \ ActiveXObject != \"undefined\"){\n        if (typeof arguments.callee.activeXString\
  \ != \"string\"){\n            var versions = [\"MSXML2.XMLHttp.6.0\", \"MSXML2.XMLHttp.3.0\"\
  ,\n                            \"MSXML2.XMLHttp\"], \n                i, len;\n\n\
  \            for (i=0,len=versions.length; i < len; i++){\n                try {\n\
  \                    new ActiveXObject(versions[i]);\n                    arguments.callee.activeXString\
  \ = versions[i];\n                    break;\n                } catch (ex){\n  \
  \                  //skip\n                }\n            }\n        }\n\n     \
  \   return new ActiveXObject(arguments.callee.activeXString);\n    } else {\n  \
  \      throw new Error(\"No XHR object available.\");\n    }\n}\n```\n\n每次调用 `createXHR()`\
  \ 时，它都会遍历并检查浏览器支持哪些能力。首先它检查原生的 `XHR`，然后测试基于 `ActiveX` 的 `XHR`，最后如果两者都未找到，则抛出错误。这在每次调用函数时都会发生，尽管这种分支的结果在不同调用之间不会改变：如果浏览器支持原生\
  \ `XHR`，它将永远支持原生 `XHR`，因此该测试是不必要的。通过即使通过一个 `if` 语句的代码也比没有 `if` 语句的代码运行慢，因此如果 `if`\
  \ 语句不需要每次都执行，代码运行速度会更快。这种技术被称为“懒加载”（lazy loading）。\n\n懒加载意味着函数执行的分支只发生一次。实现懒加载有两种方法，第一种是在第一次调用函数时对其进行处理。在第一次调用期间，函数会被重写为另一个以适当方式执行的函数，这样对该函数的后续调用就不需要再经过执行分支。例如，`createXHR()`\
  \ 函数可以这样重写以使用懒加载：\n\n![image](img/logo1.gif)\n\n```javascript\nfunction createXHR(){\n\
  \    if (typeof XMLHttpRequest != \"undefined\"){\n        createXHR = function(){\n\
  \            return new XMLHttpRequest();\n        };\n    } else if (typeof ActiveXObject\
  \ != \"undefined\"){\n        createXHR = function(){                    \n    \
  \        if (typeof arguments.callee.activeXString != \"string\"){\n           \
  \     var versions = [\"MSXML2.XMLHttp.6.0\", \"MSXML2.XMLHttp.3.0\",\n        \
  \                        \"MSXML2.XMLHttp\"],\n                    i, len;\n\n \
  \               for (i=0,len=versions.length; i < len; i++){\n                 \
  \   try {\n                        new ActiveXObject(versions[i]);\n           \
  \             arguments.callee.activeXString = versions[i];\n                  \
  \      break;\n                    } catch (ex){\n                        //skip\n\
  \                    }\n                }\n            }\n\n            return new\
  \ ActiveXObject(arguments.callee.activeXString);\n    } else {\n        createXHR\
  \ = function(){\n            throw new Error(\"No XHR object available.\");\n  \
  \      };\n    }\n\n    return createXHR();\n}\n```\n\n### LazyLoadingExample01.htm\n\
  \n在 `createXHR()` 的懒加载版本中，`if` 语句的每个分支都会将不同的函数赋值给变量 `createXHR`，从而覆盖原始函数。最后一步是调用新分配的函数。下次调用\
  \ `createXHR()` 时，它将调用分配的函数，因此 `if` 语句不再会被求值。\n\n另一种懒加载模式是在函数声明时立即分配相应的函数。因此，不是在第一次调用函数时产生微小的性能损失，而是在代码首次加载时产生损失。以下是使用此模式编写的之前的示例：\n\
  \n![image](img/logo1.gif)\n\n```javascript\nvar createXHR = (function(){\n    if\
  \ (typeof XMLHttpRequest != \"undefined\"){\n        return function(){\n      \
  \      return new XMLHttpRequest();\n        };\n    } else if (typeof ActiveXObject\
  \ != \"undefined\"){\n        return function(){\n            if (typeof arguments.callee.activeXString\
  \ != \"string\"){\n                var versions = [\"MSXML2.XMLHttp.6.0\", \"MSXML2.XMLHttp.3.0\"\
  ,\n                                \"MSXML2.XMLHttp\"],\n                    i,\
  \ len;\n\n                for (i=0,len=versions.length; i < len; i++){\n       \
  \             try {\n                        new ActiveXObject(versions[i]);\n \
  \                       arguments.callee.activeXString = versions[i];\n        \
  \                break;\n                    } catch (ex){\n                   \
  \     //skip\n                    }\n                }\n            }\n\n      \
  \      return new ActiveXObject(arguments.callee.activeXString);\n        };\n \
  \   } else {\n        return function(){\n            throw new Error(\"No XHR object\
  \ available.\");\n        };\n    }\n})();\n```\n\n### LazyLoadingExample02.htm\n\
  \n\n\n\n\n本示例中使用的方法是创建一个匿名自执行函数，用以确定应该使用哪种不同的函数实现。请注意，其逻辑是完全相同的。唯一变化的地方是第一行（使用 `var`\
  \ 定义函数）、增加了自执行匿名函数，并且每个分支现在都返回正确的函数定义，以便其能立即赋值给 `createXHR()`。\n\n懒加载函数的一个优势在于，你只需要在分叉代码时支付一次性能开销。哪种模式适合你取决于你的独特需求，但这两种模式都具有确保不是一直执行不必要代码的优势。\n\
  \n## 函数绑定 (Function Binding)\n\n一种变得日益受欢迎的高级技术是函数绑定。函数绑定涉及创建一个函数，该函数使用特定的 `this`\
  \ 值和特定的参数来调用另一个函数。这种技术通常与回调函数和事件处理程序结合使用，以便在将函数作为变量传递时保留代码的执行上下文。考虑以下示例：\n\n```javascript\n\
  var handler = {\n    message: \"Event handled\",\n\n    handleClick: function(event){\n\
  \        alert(this.message);\n    }\n};\n\nvar btn = document.getElementById(\"\
  my-btn\");\nEventUtil.addHandler(btn, \"click\", handler.handleClick);\n```\n\n\
  在这个示例中，创建了一个名为 `handler` 的对象。`handler.handleClick()` 方法被赋值为 DOM 按钮的事件处理程序。当按钮被点击时，该函数被调用并显示警框。尽管看起来警框应该显示\
  \ \"Event handled\"，但它实际上显示的是 \"undefined\"。问题在于 `handler.handleClick()` 的上下文没有被保存，因此在大多数浏览器中，`this`\
  \ 对象最终指向 DOM 按钮而不是而不是 `handler`。（在版本 8 及以前的 Internet Explorer 中，它指向 `window`）。你可以使用闭包来解决这个问题，如下面的示例所示：\n\
  \n```javascript\nvar handler = {\n    message: \"Event handled\",\n\n    handleClick:\
  \ function(event){\n        alert(this.message);\n    }\n};\n\nvar btn = document.getElementById(\"\
  my-btn\");\nEventUtil.addHandler(btn, \"click\", function(event){\n    handler.handleClick(event);\n\
  });\n```\n\n该解决方案使用闭包在 `onclick` 事件处理程序内部直接调用了 `handler.handleClick()`。当然，这是针对这段特定代码的非常具体的解决方案。创建多个闭包会导致代码难以理解和调试。因此，许多\
  \ JavaScript 库都实现了一个可以将函数绑定到特定上下文的函数。通常，这个函数被称为 `bind()`。\n\n一个简单的 `bind()` 函数接收一个函数和一个上下文，返回一个函数，该函数会在给定的上下调用指定的函数，并保持所有参数完整。语法如下：\n\
  \n![image](img/logo1.gif)\n\n```javascript\nfunction bind(fn, context){\n    return\
  \ function(){\n        return fn.apply(context, arguments);\n    };\n}\n```\n\n\
  FunctionBindingExample01.htm\n\n这个函数看起来非常简单，但实际上非常强大。`bind()` 内部创建了一个闭包，它通过使用 `apply()`\
  \ 并传入上下文对象和参数来调用传入的函数。注意，这里使用的 `arguments` 对象是用于内部函数的，而不是 `bind()` 的。当返回的函数被调用时，它会在给定的上下执行传入的函数并传递所有参数。`bind()`\
  \ 函数的用法如下：\n\n```javascript\nvar handler = {\n    message: \"Event handled\",\n\n\
  \    handleClick: function(event){\n        alert(this.message);\n    }\n};\n\n\
  var btn = document.getElementById(\"my-btn\");\nEventUtil.addHandler(btn, \"click\"\
  , bind(handler.handleClick, handler));\n```\n\nFunctionBindingExample01.htm\n\n\
  在这个示例中，`bind()` 函数被用于创建一个可以传递给 `EventUtil.addHandler()` 的函数，同时保持了上下文。事件对象也被传递给了函数，如下所示：\n\
  \n![image](img/logo1.gif)\n\n```javascript\nvar handler = {\n    message: \"Event\
  \ handled\",\n\n    handleClick: function(event){\n        alert(this.message +\
  \ \":\" + event.type);\n    }\n};\n\nvar btn = document.getElementById(\"my-btn\"\
  );\nEventUtil.addHandler(btn, \"click\", bind(handler.handleClick, handler));\n\
  ```\n\nFunctionBindingExample01.htm\n\n`handler.handleClick()` 方法像往常一样接收事件对象，因为所有参数都通过绑定后的函数直接传递给了它。\n\
  \nECMAScript 5 在所有函数上引入了原生的 `bind()` 方法，以使这个过程更加简单。你不需要定义自己的 `bind()` 函数，可以直接在函数本身上调用该方法。例如：\n\
  \n```javascript\nvar handler = {\n    message: \"Event handled\",\n\n    handleClick:\
  \ function(event){\n        alert(this.message + \":\" + event.type);\n    }\n};\n\
  \nvar btn = document.getElementById(\"my-btn\");\nEventUtil.addHandler(btn, \"click\"\
  , handler.handleClick.bind(handler));\n```\n\nFunctionBindingExample02.htm\n\n原生\
  \ `bind()` 方法的工作原理与之前描述的类似，你传入应该作为 `this` 值的对象。原生 bind() 方法在 Internet Explorer 9+、Firefox\
  \ 4+ 和 Chrome 中可用。\n\n当函数指针必须作为值传递且该函数需要在特定上下文中执行时，绑定函数非常有用。它们最常用于事件处理程序以及 `setTimeout()`\
  \ 和 `setInterval()`。然而，绑定函数的开销比普通函数大——它们需要更多的内存，并且由于多次函数调用而速度稍慢——因此最好在需要时使用它们。\n\
  \n## 函数柯化 (Function Currying)\n\n与函数绑定密切相关的课题是函数柯化，它创建具有一个或多个已参数的函数（也称为部分应用）。基本方法与函数绑定相同：使用闭包返回一个新函数。柯化的区别在于，这个新函数在被调用时还会设置一些参数。考虑以下示例：\n\
  \n```javascript\nfunction add(num1, num2){\n    return num1 + num2;\n}\n\nfunction\
  \ curriedAdd(num2){\n    return add(5, num2);\n}\n\nalert(add(2, 3));      //5\n\
  alert(curriedAdd(3));  //8\n```\n\n这段代码定义两个函数：`add()` 和 `curriedAdd()`。后者本质上是 `add()`\
  \ 的一个版本，在所有情况下将第一个参数设置为 5。尽管 `curriedAdd()` 技术上不是柯化函数，但它很好地演示了这一概念。\n\n柯化函数通常通过调用另一个函数并传入要柯化的函数以及要提供的参数来动态创建。以下函数是创建柯化函数的通用方法：\n\
  \n![image](img/logo1.gif)\n\n```javascript\nfunction curry(fn){\n    var args =\
  \ Array.prototype.slice.call(arguments, 1);\n    return function(){\n        var\
  \ innerArgs = Array.prototype.slice.call(arguments),\n            finalArgs = args.concat(innerArgs);\n\
  \        return fn.apply(null, finalArgs);\n    };\n}\n```\n\nFunctionCurryingExample01.htm\n\
  \n\n\n\n\n`curry()` 函数的主要工作是让返回函数的参数按照适当顺序排列。`curry()` 的第一个参数是需要被柯里化的函数；所有其他参数都是要传入的值。为了获取从第一个参数之后的所有参数，在\
  \ `arguments` 对象上调用了 `slice()` 方法，并传入参数 `1`，这表示返回的数组的第一个项应该是第二个参数。随后，`args` 数组包含了外层函数的参数。对于内部函数，创建了\
  \ `innerArgs` 数组来包含所有传入的参数（再次使用了 `slice()`）。当来自外层函数和内部函数的参数现在都存储在数组中时，你可以使用 `concat()`\
  \ 方法将它们合并为 `finalArgs`，然后使用 `apply()` 将结果传递给函数。注意，此函数没有考虑上下文（context），因此对 `apply()`\
  \ 的调用将 `null` 作为第一个参数。`curry()` 函数可以如下所示使用：\n\n![image](img/logo1.gif)\n\n```javascript\n\
  function add(num1, num2){\n    return num1 + num2;\n}\n\nvar curriedAdd = curry(add,\
  \ 5);\nalert(curriedAdd(3));   //8\n```\n\nFunctionCurryingExample01.htm\n\n在这个示例中，创建了\
  \ `add()` 的柯里版本，其第一个参数被绑定为 `5`。当调用 `curriedAdd()` 并传入 `3` 时，`3` 变成了 `add()` 的第二个参数，而第一个参数仍然是\
  \ `5`，结果和为 `8`。你也可以提供所有的函数参数，如示例所示：\n\n```javascript\nfunction add(num1, num2){\n\
  \    return num1 + num2;\n}\n\nvar curriedAdd = curry(add, 5, 12);\nalert(curriedAdd());\
  \   //17\n```\n\nFunctionCurryingExample01.htm\n\n在这里，柯里化的 `add()` 函数提供了两个参数，因此以后不需要传入。\n\
  \n函数柯里化通常作为函数绑定的一部分，创建了一个更复杂的 `bind()` 函数。例如：\n\n```javascript\nfunction bind(fn,\
  \ context){\n    var args = Array.prototype.slice.call(arguments, 2);\n    return\
  \ function(){\n        var innerArgs = Array.prototype.slice.call(arguments),\n\
  \            finalArgs = args.concat(innerArgs);\n        return fn.apply(context,\
  \ finalArgs);\n    };\n}\n```\n\nFunctionCurryingExample02.htm\n\n与 `curry()` 函数的主要区别在于传入函数的参数数量以及该数量如何影响代码的结果。`curry()`\
  \ 仅仅接受一个需要封装的函数，而 `bind()` 接受一个函数和一个上下文对象。这意味着绑定函数的参数从第三个参数开始，而不是第二个，这改变了第一次对 `slice()`\
  \ 的调用。另一个变化是在倒数第三行向 `apply()` 传入了上下文对象。当使用 `bind()` 时，它返回一个绑定到给定上下文的函数，并且可能已经设置了其中一些参数。当你想要除了事件对象之外还向事件处理器传递传递参数时，这种方法非常有用，例如所示：\n\
  \n![image](img/logo1.gif)\n\n```javascript\nvar handler = {\n    message: \"Event\
  \ handled\",\n\n    handleClick: function(name, event){\n        alert(this.message\
  \ + \":\" + name + \":\" + event.type);\n    }\n};\n\nvar btn = document.getElementById(\"\
  my-btn\");\nEventUtil.addHandler(btn, \"click\", bind(handler.handleClick, handler,\
  \ \"my-btn\"));\n```\n\nFunctionCurryingExample02.htm\n\n在这个更新的示例中，`handler.handleClick()`\
  \ 方法接受两个参数：你正在操作元素名称和事件对象。名称作为第三个参数传入 `bind()` 函数，然后被传递给 `handler.handleClick()`，该函数也接收了事件对象。\n\
  \nECMAScript 5 的 `bind()` 方法也实现了函数柯里化。只需在该值之后传入额外的参数即可：\n\n```javascript\nvar handler\
  \ = {\n    message: \"Event handled\",\n\n    handleClick: function(name, event){\n\
  \        alert(this.message + \":\" + name + \":\" + event.type);\n    }\n};\n\n\
  var btn = document.getElementById(\"my-btn\");\nEventUtil.addHandler(btn, \"click\"\
  , handler.handleClick.bind(handler, \"my-btn\"));\n```\n\nFunctionCurryingExample03.htm\n\
  \n柯里化函数和绑定函数为 JavaScript 提供了强大的动态函数创建功能。使用 `bind()` 还是 `curry()` 取决于对上下文对象的需求或缺失。它们都可以用于创建复杂的算法和功能，尽管两者都不应该过度使用，因为每个函数都会产生额外的开销。\n\
  \n# 防篡对象\n\nJavaScript 广受诟病的缺点之一是它的共享共享性：每个对象都可以被相同上下文中运行的任何代码修改。这可能导致开发者意外覆盖彼此的代码，或者更糟糕，用不兼容的更改覆盖原生对象。ECMAScript\
  \ 5 试图通过允许创建防篡对象来解决这个问题。\n\n第 6 章讨论了对象上属性的性质，以及你如何手动设置每个属性的 `Configurable`、`Writable`、`Enumerable`、`Value`、`Get`\
  \ 和 `Set` 属性来改变属性的行为。类似，ECMAScript 5 增加了几个方法，允许你指定整个对象的行为。\n\n需要注意的是：一旦对象被变为防篡，该操作是不可撤销的。\n\
  \n## 不扩展对象\n\n默认情况下，JavaScript 中的所有对象都是可扩展的，这意味着你可以随时对象添加属性和方法。例如，我可以定义一个对象并在稍后添加另一个属性：\n\
  \n```javascript\nvar person = { name: \"Nicholas\" };\nperson.age = 29;\n```\n\n\
  `Object.preventExtensions()` 方法改变这种行为，使得无法添加新属性。例如：\n\n```javascript\nvar person\
  \ = { name: \"Nicholas\" };\nObject.preventExtensions(person);\n\nperson.age = 29;\n\
  alert(person.age);   //undefined\n```\n\nNonExtensibleObjects01.htm\n\n在调用 `Object.preventExtensions()`\
  \ 后，person 对象不能再添加新的属性或方法。在非严格模式下，添加新对象的尝试会被忽略，因此 `person.age` 的结果是 `undefined`。在严格模式下，尝试添加对象成员会抛出错误。\n\
  \n尽管对象不能添加新成员，所有现有成员不受影响。你仍然可以修改和删除已存在的成员。还可以通过 `Object.isExtensible()` 方法确定对象是否可以扩展：\n\
  \n![image](img/logo1.gif)\n\n```javascript\nvar person = { name: \"Nicholas\" };\n\
  alert(Object.isExtensible(person));   //true\n\nObject.preventExtensions(person);\n\
  alert(Object.isExtensible(person));   //false\n```\n\nNonExtensibleObjects02.htm\n\
  \n## 密封对象\n\nECMAScript 5 中对象的下一级保护是密封对象。密封对象是不可扩展的，且现有对象成员的 `Configurable` 属性被设置为\
  \ `false`。这意味着属性和方法不能被删除，因为数据属性无法通过 `Object.defineProperty()` 更改为访问器属性反相反。属性值仍然可以更改。\n\
  \n你可以通过使用 `Object.seal()` 方法密封一个对象：\n\n![image](img/logo1.gif)\n\n```javascript\n\
  var person = { name: \"Nicholas\" };\nObject.seal(person);\n\nperson.age = 29;\n\
  alert(person.age);      //undefined\n\ndelete person.name;\nalert(person.name);\
  \     //\"Nicholas\"\n```\n\nSealedObjectsExample01.htm\n\n在这个示例中，添加 age 属性的尝试被忽略。删除\
  \ name 属性的尝试同样被忽略，因此值保持完好。这是非严格模式下的行为。在严格模式下，尝试添加或删除对象成员会抛出错误。\n\n\n\n\n\n你可以使用\
  \ `Object.isSealed()` 来判断一个对象是否是密封的。由于密封对象也是不可扩展的，因此密封对象在调用 `Object.isExtensible()`\
  \ 时也会返回 `false`：\n\n```javascript\nvar person = { name: \"Nicholas\" };\nalert(Object.isExtensible(person));\
  \   //true\nalert(Object.isSealed(person));       //false\n\nObject.seal(person);\n\
  alert(Object.isExtensible(person));   //false\nalert(Object.isSealed(person)); \
  \      //true\n```\n\n`SealedObjectsExample02.htm`\n\n# 冻结对象\n\n最严格的防篡对象类型是冻结对象。冻结对象既不可扩展也是被密封的，而且其数据属性的\
  \ `Writable` 属性被设置为 `false`。访问器属性仍然可以被写入，但前提是已经定义了 `Set` 函数。ECMAScript 5 定义了 `Object.freeze()`\
  \ 允许对对象冻结：\n\n```javascript\nvar person = { name: \"Nicholas\" };\nObject.freeze(person);\n\
  \nperson.age = 29;\nalert(person.age);      //undefined\n\ndelete person.name;\n\
  alert(person.name);     //\"Nicholas\"\n\nperson.name = \"Greg\";\nalert(person.name);\
  \     //\"Nicholas\"\n```\n\n`FrozenObjectsExample01.htm`\n\n与防止扩展和密封一样，在冻结对象上尝试执行不允许的操作，在非严格模式下会被忽略，而在严格模式下会抛出错误。\n\
  \n还有一个 `Object.isFrozen()` 方法用于检测冻结对象。由于冻结对象既是密封的不可扩展的，它们在调用 `Object.isExtensible()`\
  \ 时返回 `false`，在调用 `Object.isSealed()` 时返回 `true`：\n\n![image](img/logo1.gif)\n\n\
  ```javascript\nvar person = { name: \"Nicholas\" };\nalert(Object.isExtensible(person));\
  \   //true\nalert(Object.isSealed(person));       //false\nalert(Object.isFrozen(person));\
  \       //false\n\nObject.freeze(person);\nalert(Object.isExtensible(person)); \
  \  //false\nalert(Object.isSealed(person));       //true\nalert(Object.isFrozen(person));\
  \       //true\n```\n\n`FrozenObjectsExample02.htm`\n\n冻结对象对库作者特别有用。JavaScript 库的一个常见问题是人们无意（或故意）更改了主库对象。冻结主库对象（或密封）有助于防止这些错误。\n\
  \n# 高级定时器\n\n使用 `setTimeout()` 或 `setInterval()` 创建的定时器可以实现有趣且有用的功能。尽管人们误认为 JavaScript\
  \ 中的定时器实际上是线程，但 JavaScript 运行在单线程环境中。因此，定时器仅仅是安排代码在未来的某个点执行。执行的时机是无法保证的，因为其他代码可能会页面生命周期的不同时间控制\
  \ JavaScript 进程。页面下载时运行的代码、事件处理器和 Ajax 回调都必须使用同一个线程进行执行。确定在什么时间点哪些代码具有优先级是浏览器的工作。\n\
  \n将 JavaScript 想象成运行在时间轴上是有帮助的。当页面加载时，第一个执行的代码是任何通过 `<script>` 元素包含的代码。这通常只是为了以后在页面生命周期期间使用的函数和变量声明，但有时也可以包含初始数据处理。从那时起，JavaScript\
  \ 进程会等待更多代码执行。当进程不忙时，下一个触发的代码将立即执行。例如，当按钮被点击时，`onclick` 事件处理器会立即执行，只要 JavaScript\
  \ 进程没有执行任何其他代码。此类页面的时间轴可能如图 22-1 所示。\n\n图 22-1\n\n![image](img/f746-01.jpg)\n\n\
  除了主 JavaScript 执行进程外，还有一个代码队列，这些代码将在进程下次空闲时执行。随着页面经历其生命周期，代码按照其应该执行的顺序添加到队列中。例如，当点击按钮时，其事件处理器代码会被添加到队列中，并在下一个可能的时刻执行。当收到\
  \ Ajax 响应时，回调函数代码会被添加到队列中。JavaScript 中没有代码是立即执行的；它会在进程空闲时立即执行。\n\n定时器通过在经过特定时间后插入代码与该队列工作。请注意，将代码添加到队列并不意味着它会立即执行；它意味着它将尽快执行。设置在\
  \ 150 毫秒后执行的定时器并不意味着代码将在 150 毫秒内执行；它意味着代码将在 150 毫秒后被添加到队列中。如果在那个点队列中没有其他代码，定时器代码将执行，从而产生代码完全按指定时间执行的假象。在其他时间，代码执行可能需要更长的时间。\n\
  \n考虑以下代码：\n\n```javascript\nvar btn = document.getElementById(\"my-btn\");\nbtn.onclick\
  \ = function(){\n    setTimeout(function(){\n        document.getElementById(\"\
  message\").style.visibility = \"visible\";\n    }, 250);\n\n    //other code\n};\n\
  ```\n\n在这里，为按钮设置了一个事件处理器。该事件处理器设置了一个定时器，在 250 毫秒后调用。当按钮被点击时，`onclick` 事件处理器首先被添加到队列中。当它执行时，设置了定时器，250\
  \ 毫秒后，指定的代码被添加到队列中执行。\n\n关于定时器最重要记忆的一点是，指定的间隔表示代码何时被添加到队列，而不是它何时实际执行。如果上一个示例中的事件处理器花费了\
  \ 300 毫秒来执行，那么定时器代码至少会在定时器设置 300 毫秒后才执行。正如从图 22-2 所示，无论它是如何添加的，都必须等待直到 JavaScript\
  \ 进程空闲。\n\n![image](img/f747-01.jpg)\n\n正如从图 22-2](#Chapter22.html_figure22-2)所示，尽管定时器代码是在\
  \ 255 毫秒处添加的，但它不能在那时执行，因为事件处理器仍在运行。定时器代码执行的第一个机会是在 300 毫秒处，即事件处理器完成之后。\n\nFirefox\
  \ 对定时器的实现实际上允许你确定定时器偏后了多少。它通过传入执行时间与指定间隔之间的差值来实现。这里有一个示例：\n\n```javascript\n// 仅适用于\
  \ Firefox\nsetTimeout(function(diff){\n    if (diff > 0) {\n        // 调用延迟了\n \
  \   } else if (diff < 0){\n        // 调用提前了\n    } else {\n        // 调用准时\n   \
  \ }\n}, 250);\n```\n\n当一组代码的执行完成后，JavaScript 进程会释放很短的时间，以便页面上的其他进程可以执行。由于 JavaScript\
  \ 进程会阻塞页面进程，这些小的中断是必要的，以防止用户界面锁定（这在长时间运行期间可能会发生）。设置定时器可以确保在执行定时器代码之前至少有一个进程中断。\n\
  \n### 重复定时器\n\n使用 `setInterval()` 创建的定时器确保定时器代码定期注入队列中。这种方法的问题是，在代码再次添加到队列之前，可能尚未完成执行。结果将定时器代码连续运行多次，之间没有任何时间间隔。幸运的是，JavaScript\
  \ 引擎足够智能避免这个问题。使用 `setInterval()` 时，只有当队列中没有其他该定时器代码的实例时，才会将其添加到队列中。这确保了定时器代码添加到队列之间的时间间隔至少为指定的间隔。\n\
  \n\n\n\n\n这种对重复定时器的调节具有两方面的缺点：(1) 间隔可能会被跳过，以及 (2) 在多次定时器-代码执行之间，间隔可能会比预期的短。假设有这样的情况：一个\
  \ `onclick` 事件处理器使用 `setInterval()` 设置了一个每隔 200 毫秒执行一次的定时器。如果事件处理器的完成时间略多于 300 毫秒，而定时器代码所需的时间也差不多，那么你将面临间隔被跳过以及定时器代码接连续运行的情况（请参见图\
  \ 22-3）。\n\n图 22-3\n\n![image](img/f749-01.jpg)\n\n此示例中的第一个定时器在 205 毫秒时被添加到队列，但直到\
  \ 300 毫秒标记之后才能执行。在定时器代码执行期间，另一个副本在 405 毫秒时被添加到队列。在下一个间隔 605 毫秒处，第一个定时器代码仍在执行，且队列中已经有一个定时器代码实例。结果是在该点不会向队列中添加定时器代码。405\
  \ 毫秒时添加的定时器代码将在 5 毫秒时添加的定时器代码之后立即执行。\n\n为了避免 `setInterval()` 重复定时器的两个缺陷，可以使用以下模式中的链式\
  \ `setTimeout()` 调用：\n\n```\nsetTimeout(function(){\n\n    //处理逻辑\n\n   setTimeout(arguments.callee,\
  \ interval);\n\n}, interval);\n```\n\n这种模式链化了 `setTimeout()` 的调用，在每次执行函数时都会创建一个新的定时器。第二次\
  \ `setTimeout()` 调用使用 `arguments.callee` 获取当前执行函数的引用，并为它设置另一个定时器。其优点是，在上一个定时器代码执行之前，新的定时器代码不会被插入队列，从而确保不会有间隔被跳过。此外，你还可以保证下一次执行定时器代码时，它的执行间隔至少是指定的间隔，从而避免了接连续运行。这种模式最常用于重复定时器，例所示：\n\
  \n![image](img/logo1.gif)\n\n```\nsetTimeout(function(){\n\n   var div = document.getElementById(\"\
  myDiv\"),\n       left = parseInt(div.style.left) + 5;\n   div.style.left = left\
  \ + \"px\";\n\n   if (left < 200){\n       setTimeout(arguments.callee, 50);\n \
  \  }\n\n}, 50);\n```\n\nRepeatingTimersExample.htm\n\n这段代码每当定时器代码执行时都会将 `<div>`\
  \ 元素向右移动，当左坐标达到 200 像素时停止。将这种模式用于 JavaScript 动画是非常常见的。\n\n![image](img/pen.gif)\n\
  \n每个浏览器窗口、标签页或帧都有其自己的代码执行队列。这意味着当同步执行代码时，跨帧或跨窗口的 JavaScript 调用时机可能会导致竞态条件。每当需要这种通信时，在接收端帧或窗口上创建一个定时器来执行代码是一个好主意。\n\
  \n## 产出进程 (Yielding Processes)\n\n在浏览器中运行的 JavaScript 分配到的资源是的。与桌面应用程序不同（桌面应用通常对其可以支配的内存和处理器时间有完全控制），JavaScript\
  \ 受到严格限制，以确保恶意的网页程序员无法破坏用户的计算机。这些限制之一是长时间运行脚本限制，它在代码运行时间超过特定长度或执行语句超过特定数量时会阻止其运行。如果你达到了该限制，用户将看到浏览器错误对话框，指示脚本执行时间过长，并询问用户是否允许其继续处理或停止。所有\
  \ JavaScript 开发者的目标都是确保用户永远不会看到来自浏览器的这种困惑信息。定时器是回避这一限制的一种方法。\n\n长时间运行脚本的问题通常源于两个问题之一：长时间深度嵌套的函数调用，或者是正在大量处理的循环。在这两者中，后者更容易解决。长时间运行的循环通常遵循这种模式：\n\
  \n```\nfor(var i=0, len=data.length; i < len; i++){\n    process(data[i]);\n}\n\
  ```\n\n这种模式的问题在于，在运行时之前待处理的项目数量是未知的。如果 `process()` 完成需要 100 毫秒，一个包含两个元素的数组可能不需要担心，但一个十个元素的数组会导致脚本运行一秒钟完成。完全执行此循环所需的时间与数组中的项目数量直接相关。由于\
  \ JavaScript 执行是阻塞操作，脚本运行时间越长，用户就无法与页面交互的时间就越长。\n\n在展开循环之前，你需要回答以下两个重要问题：\n\n1.\
  \ 处理过程必须同步完成吗？如果对这些数据的处理阻塞了其他任务的完成，那么你可能不想触碰它。但是，如果你能对这个问题给出肯定的“否”，那么它就是将某些处理推迟到后来的良好候选。\n\
  2. 数据必须按顺序处理吗？通常情况下，值数组只是分组和迭代项的一种方便方式，无论顺序如何。如果项目的顺序没有意义，那么很可能可以将某些处理推迟到以后。\n\n\
  当你发现循环执行需要大量时间，且你对上述两个问题都能回答“否”时，就可以使用定时器来分批处理。基本思路是创建一个处理项队列，分小块处理数组。这种基本模式如下：\n\
  \n```\nsetTimeout(function(){\n\n    //获取下一个项并处理\n    var item = array.shift();\n\
  \    process(item);\n\n    // 如果还有项，设置另一个定时器\n    if(array.length > 0){\n      \
  \  setTimeout(arguments.callee, 100);\n    }\n}, 100);\n```\n\n在数组分割模式中，`array`\
  \ 变量本质上是待处理项目的“待办列表”。使用 `shift()` 方法，你可以获取队列中的下一个项并传递给函数。如果队列中还有项，则设置另一个定时器。可以使用以下函数轻松完成数组分割：\n\
  \n```javascript\nfunction chunk(array, process, context){\n    setTimeout(function(){\n\
  \        var item = array.shift();\n        process.call(context, item);\n\n   \
  \     if (array.length > 0){\n            setTimeout(arguments.callee, 100);   \
  \      \n        }\n    }, 100);        \n}\n```\n\nChunkingExample.htm\n\n`chunk()`\
  \ 方法接受三个参数：待处理的项目数组、用于处理项目的的函数、以及运行该函数的可选上下文。函数内部是之前描述的基本模式的复制，通过 `call()` 调用 `process()`\
  \ 函数以便设置正确的上下文。定时器的间隔被设置为 100 毫秒，这为 JavaScript 进程在处理项目之间提供了空闲时间。该间隔可以根据需要进行更改，尽管大多数情况下\
  \ 100 毫秒效果良好。该函数可以如下使用：\n\n![image](img/logo1.gif)\n\n```javascript\nvar data =\
  \ [12,123,1234,453,436,23,23,5,4123,45,346,5634,2234,345,342];\n\nfunction printValue(item){\n\
  \    var div = document.getElementById(\"myDiv\");\n    div.innerHTML += item +\
  \ \"<br>\";        \n}\n\nchunk(data, printValue);\n```\n\nArrayChunkingExample.htm\n\
  \n此示例通过 `printValue()` 函数将 `data` 数组中的每个值输出到 `<div>` 元素中。由于该函数存在全局作用域，因此不需要向 `chunk()`\
  \ 传递上下文对象。\n\n\n\n\n\n需要注意的是，传递给 `chunk()` 的数组被用作队列，因此数组中的项会随着数据的处理而发生变化。如果你想保持原始数组完整，应该向\
  \ `chunk()` 传递数组的克隆，例如例所示：\n\n```\nchunk(data.concat(), printValue);\n```\n\n当在不带任何参数的数组上调用\
  \ `concat()` 方法时，它会返回一个与原始数组项相同的数组。通过这种方式，你可以确保原始数组不会被函数修改。\n\n数组分块（array chunking）的重要性在于，它将多个项目的处理拆分为执行队列上的多个独立代码。在处理完每个项目后，其他浏览器进程将获得运行的机会，从而避免长时间运行脚本导致的错误。\n\
  \n![image](img/pen.gif)\n\n每当你有一个完成需要耗时超过 50 毫秒的函数时，最好检查是否可以将该任务拆分成若干个可以使用定时器的多个较小任务。\n\
  \n## 函数节流 (Function Throttling)\n\n在浏览器中，某些计算和处理比其他处理更耗资源。例如，DOM 操作比非 DOM 交互需要更多的内存和\
  \ CPU 时间。尝试顺序执行过多的 DOM 相关操作会导致浏览器挂起，有时会导致崩溃。这在 Internet Explorer 中使用 `onresize`\
  \ 事件处理器时经常发生，因为当浏览器调整大大时，该处理器会反复触发。在 `onresize` 事件处理器中尝试 DOM 操作可能会因为计算更改的频率过高导致浏览器崩溃。为了解决这个问题，可以使用定时器对函数调用进行节流（throttle）。\n\
  \n函数节流背后的原理是，某些代码不应该在没有中断的情况下重复执行。当函数第一次被调用时，会创建一个定时器，在指定的间隔后运行代码。当函数第二次被调用时，它会清除之前的定时器并设置另一个。如果之前的定时器已经执行，则没有关系。但是，如果之前的定时器还没有执行，它本质上会被更新的定时器所取代。目标是在执行该函数的请求停止一段时间后，才执行该函数。以下是该模式的基本表示形式：\n\
  \n```\nvar processor = {\n    timeoutId: null,\n\n    // 实际执行处理的方法    \n    performProcessing:\
  \ function(){\n        // 实际处理代码\n    },\n\n    // 调用以启动处理的方法\n    process: function(){\n\
  \        clearTimeout(this.timeoutId);\n\n        var that = this;\n        this.timeoutId\
  \  = setTimeout(function(){\n            that.performProcessing();\n        }, 100);\n\
  \    }\n};\n\n// 尝试开始处理\nprocessor.process();\n```\n\n在此代码中，创建了一个名为 `processor`\
  \ 的对象。该对象上有两个方法：`process()` 和 `performProcessing()`。前者应该是被调用以启动任何处理的方法，而后者实际执行要完成的处理。当调用\
  \ `process()` 时，第一步是清除存储的 `timeoutId`，以防止任何之前的调用被执行。然后，创建一个新的定时器来调用 `performProcessing()`。由于在\
  \ `setTimeout()` 中使用的函数上下文始终是 `window`，因此有存储该上下文的引用以便稍后使用。\n\n间隔被设置为 100 毫秒，这意味着在最后一次调用\
  \ `process()` 至少 100 毫秒后，才会调用 `performProcessing()`。因此，如果在这 100 毫秒内调用了 20 次 `process()`，`performProcessing()`\
  \ 仍然只会被调用一次。\n\n可以使用 `throttle()` 函数来简化这种模式，该函数会自动设置定时器的设置/清除功能，如下例所示：\n\n![image](img/logo1.gif)\n\
  \n```\nfunction throttle(method, context) {\n    clearTimeout(method.tId);\n   \
  \ method.tId= setTimeout(function(){\n        method.call(context);\n    }, 100);\n\
  }\n```\n\n### ThrottlingExample.htm\n\n`throttle()` 函数接受两个参数：要执行的函数和执行该函数范围。函数首先清除之前设置的任何定时器。定时器\
  \ ID 存储在方法的 `tId` 属性上，在第一次将方法传递给 `throttle()` 时该属性可能不存在。接下来，创建一个新的定时器，并将其 ID 存储在方法的\
  \ `tId` 属性中。如果这是第一次使用该方法调用 `throttle()`，代码将创建该属性。定时器代码使用 `call()` 来确保方法在适当的范围内执行。如果没有提供第二个参数，则方法将在全局作用域中执行。\n\
  \n如前所述，节流最常用于调整大小（resize）事件。如果你根据此事件更改页面布局，最好对处理进行节流，以确保浏览器在短时间内不会进行过多的计算。例如，考虑有一个\
  \ `<div>` 元素，其高度应该被更改，使其始终等于宽度。实现此更改的 JavaScript 代码可能如下：\n\n```\nwindow.onresize\
  \ = function(){\n    var div = document.getElementById(\"myDiv\");\n    div.style.height\
  \ = div.offsetWidth + \"px\";\n};\n```\n\n这个非常简单的示例展示了可能会降低浏览器速度的因素。首先，正在计算 `offsetWidth`\
  \ 属性，当元素和页面的其余应用了足够的 CSS 样式时，可能是一个复杂的计算。其次，设置元素的高度需要页面重流（reflow）以考虑这些更改。再次，如果页面有许多元素并应用了适量的\
  \ CSS，可能需要多次计算。`throttle()` 函数可以提供帮助，如下例：\n\n![image](img/logo1.gif)\n\n```\nfunction\
  \ resizeDiv(){\n    var div = document.getElementById(\"myDiv\");\n    div.style.height\
  \ = div.offsetWidth + \"px\";\n}\n\nwindow.onresize = function(){\n    throttle(resizeDiv);\n\
  };\n```\nThrottlingExample.htm\n\n## 自定义事件 (CUSTOM EVENTS)\n\n在本书前面，你学习了事件是 JavaScript\
  \ 与浏览器交互的主要方式。事件是一种被称为观察者（observer）的设计模式，这是一种创建松耦合代码的技术。其核心思想是对象可以发布事件，指示对象生命周期中发生了有趣的时刻。其他对象就可以观察该对象，等待这些有趣时刻的发生，并通过运行代码来做出响应。\n\
  \n观察者模式由两种类型的对象组成：主体（subject）和观察者（observer）。主体负责发布事件，而观察者仅通过订阅这些事件来观察主体。该模式的关键概念是主体对观察者一无所知，这意味着即使观察者不存在，它可以存在并正常运行。相反，观察者知道主体，并为主体的事件注册回调函数（事件处理器）。\n\
  \n\n\n\n\n# 事件\n\n事件是与 DOM 交互的一种非常常见的方式，但也可以通过实现自定义事件在非 DOM 代码中使用。自定义事件背后的理念是创建一个管理事件的对象，允许其他对象监听这些事件。实现此功能的\
  \ Basic 类型可以定义如下：\n\n![image](img/logo1.gif)\n\n```\nfunction EventTarget(){\n \
  \   this.handlers = {};    \n}\n\nEventTarget.prototype = {\n    constructor: EventTarget,\n\
  \n    addHandler: function(type, handler){\n        if (typeof this.handlers[type]\
  \ == \"undefined\"){\n            this.handlers[type] = [];\n        }\n\n     \
  \   this.handlers[type].push(handler);\n    },\n\n    fire: function(event){\n \
  \       if (!event.target){\n            event.target = this;\n        }\n     \
  \   if (this.handlers[event.type] instanceof Array){\n            var handlers =\
  \ this.handlers[event.type];\n            for (var i=0, len=handlers.length; i <\
  \ len; i++){\n                handlersi;\n            }\n        }            \n\
  \    },\n\n    removeHandler: function(type, handler){\n        if (this.handlers[type]\
  \ instanceof Array){\n            var handlers = this.handlers[type];\n        \
  \    for (var i=0, len=handlers.length; i < len; i++){\n                if (handlers[i]\
  \ === handler){\n                    break;\n                }\n            }\n\n\
  \            handlers.splice(i, 1);\n        }            \n    }\n};\n```\n\n##\
  \ EventTarget.js\n\n`EventTarget` 类型有一个属性 `handlers`，用于存储事件处理器。它还有三个方法：`addHandler()`，用于为特定类型的事件注册事件处理器；`fire()`，用于触发事件；以及\
  \ `removeHandler()`，用于注销某个事件类型的事件处理器。\n\n`addHandler()` 方法接受两个参数：事件类型和用于处理该事件的函数。当调用此方法方法时，程序会检查\
  \ `handlers` 属性上是否已经存在该事件类型的数组。如果没有，则会创建一个。然后使用 `push()` 将处理器添加到数组的末尾。\n\n当必须触发事件时，会调用\
  \ `fire()` 方法。该方法接受一个参数，该参数是一个至少包含 `type` 属性的对象。`fire()` 方法首先会在事件对象上设置 `target`\
  \ 属性（如果尚未指定的话）。然后它简单地查找该事件类型的处理器数组，并调用每个函数，传入事件对象。由于这些是自定义事件，事件对象上应该包含哪些额外信息由你来决定。\n\
  \n`removeHandler()` 方法是 `addHandler()` 的辅助方法，接受相同的参数：事件的 `type` 和事件处理器。该方法通过遍历事件处理器数组来找到要删除的处理器的位置。当找到后，使用\
  \ `break` 运算符退出 `for` 循环。然后使用 `splice()` 方法从数组中删除该项。\n\n使用 `EventTarget` 类型的自定义事件可以如下所示：\n\
  \n![image](img/logo1.gif)\n\n```\nfunction handleMessage(event){\n    alert(\"Message\
  \ received: \" + event.message);\n}\n\n//创建一个新对象\nvar target = new EventTarget();\n\
  \n//添加一个事件处理器\ntarget.addHandler(\"message\", handleMessage);\n\n// 触发事件\ntarget.fire({\
  \ type: \"message\", message: \"Hello world!\"});\n\n// 移除处理器\ntarget.removeHandler(\"\
  message\", handleMessage);\n\n// 再次尝试 - 不应该有处理器了\ntarget.fire({ type: \"message\"\
  , message: \"Hello world!\"});\n```\n\n## EventTargetExample01.htm\n\n在此代码中，定义了\
  \ `handleMessage()` 函数来处理消息事件。它接受事件对象并输出 `message` 属性。调用了 `target` 对象的 `addHandler()`\
  \ 方法，传入了 `\"message\"` 和 `handleMessage()` 函数。在下一行，调用了 `fire()` 并传入一个包含两个属性（`type`\
  \ 和 `message`）的字面量对象。这会调用消息事件的处理器，因此会显示警告（来自 `handleMessage()`）。随后移除了事件处理器，因此当再次触发事件时，将不会显示警告。\n\
  \n由于此功能被封装在一个自定义类型中，其他对象可以通过继承 `EventTarget` 来继承这种行为，例如例所示：\n\n![image](img/logo1.gif)\n\
  \n```\nfunction Person(name, age){\n    EventTarget.call(this);\n    this.name =\
  \ name;\n    this.age = age;\n}\n\ninheritPrototype(Person,EventTarget);\n\nPerson.prototype.say\
  \ = function(message){\n    this.fire({type: \"message\", message: message});\n\
  };\n```\n\n## EventTargetExample02.htm\n\n`Person` 类型使用寄生组合继承（参见第 6 章）继承自 `EventTarget`。每当调用\
  \ `say()` 方法时，就会触发一个带有消息详情的事件。在类型的其他方法中调用 `fire()` 方法是很常见的，而在公开范围内调用它非常罕见。此代码可以如下所示使用：\n\
  \n```\nfunction handleMessage(event){\n    alert(event.target.name + \" says: \"\
  \ + event.message);\n}\n\n//创建新人物\nvar person = new Person(\"Nicholas\", 29);\n\n\
  //添加一个事件处理器\nperson.addHandler(\"message\", handleMessage);\n\n//调用对象的方法，触发消息事件\n\
  person.say(\"Hi there.\");\n```\n\n此示例中的 `handleMessage()` 函数显示包含 `event.target.name`\
  \ 和消息的警告。当调用 `say()` 方法并传入消息时，事件就会被触发。\n\n## 拖放\n\n计算机上流行的用户界面模式之一是拖放。其原理简单：在项目上点击并按住鼠标键，将其移动到另一个区域，然后释放鼠标键将其“放置”在那里。拖放界面的流行已延伸到\
  \ Web，在它已成为传统配置界面的流行替代方案。\n\n拖放的基本原理简单：创建一个可以随鼠标移动的绝对定位元素。这种技术源于一种被称为“光标追踪”的经典 Web\
  \ 技巧。光标追踪曾是跟随鼠标移动的图像或多幅图像。单项光标追踪的基本代码是在 `document` 上设置一个 `mousemove` 事件处理器，将给定元素移动到光标位置，如例所示：\n\
  \n![image](img/logo1.gif)\n\n```\nEventUtil.addHandler(document, \"mousemove\",\
  \ function(event){\n    var myDiv = document.getElementById(\"myDiv\");\n    myDiv.style.left\
  \ = event.clientX + \"px\";\n    myDiv.style.top = event.clientY + \"px\";\n});\n\
  ```\n\n## DragAndDropExample01.htm\n\n在此示例中，元素的 `left` 和 `top` 坐标设置为事件对象的 `clientX`\
  \ 和 `clientY` 属性，这使得元素位于视口中的光标位置。其效果是元素在页面移动时跟随光标。要实现拖放，你只需要在正确的时间点（按下鼠标键时）实现此功能，并在之后将其移除（释放鼠标键时）。一个非常简单的拖放界面可以使用以下代码实现：\n\
  \n\n\n\n\n```javascript\nvar DragDrop = function(){\n\n    var dragging = null;\n\
  \n    function handleEvent(event){\n\n        //get event and target\n        event\
  \ = EventUtil.getEvent(event);\n        var target = EventUtil.getTarget(event);\
  \            \n\n        //determine the type of event\n        switch(event.type){\n\
  \            case \"mousedown\":\n                if (target.className.indexOf(\"\
  draggable\") > -1){\n                    dragging = target;\n                } \
  \                    \n                break;\n\n            case \"mousemove\"\
  :\n                if (dragging !== null){\n\n                    //assign location\n\
  \                    dragging.style.left = event.clientX + \"px\";\n           \
  \         dragging.style.top = event.clientY + \"px\";                    \n   \
  \             }                    \n                break;\n\n            case\
  \ \"mouseup\":\n                dragging = null;\n                break;\n     \
  \   }\n    };\n\n    //public interface\n    return {            \n        enable:\
  \ function(){\n            EventUtil.addHandler(document, \"mousedown\", handleEvent);\n\
  \            EventUtil.addHandler(document, \"mousemove\", handleEvent);\n     \
  \       EventUtil.addHandler(document, \"mouseup\", handleEvent);\n        },\n\n\
  \        disable: function(){\n            EventUtil.removeHandler(document, \"\
  mousedown\", handleEvent);\n            EventUtil.removeHandler(document, \"mousemove\"\
  , handleEvent);\n            EventUtil.removeHandler(document, \"mouseup\", handleEvent);\n\
  \        }\n    }\n}();\n```\n\n### DragAndDropExample02.htm\n\n`DragDrop` 对象封装了所有的基础拖放功能。它是一个单例对象，使用模块模式来隐藏部分实现细节。`dragging`\
  \ 变量初始为 `null`，之后会被填充为正在拖拽的元素，因此当该变量不为 `null` 时，你就知道有元素正在被拖拽。`handleEvent()` 函数处理拖放功能的所有三个鼠标事件。它首先获取事件对象和事件目标\
  \ get 引用。之后，通过 `switch` 语句确定触发了哪种类型的事件。当发生 `mousedown` 事件时，会检查 `target` 的类名，以确定它是否包含\
  \ `\"draggable\"` 类，如果是，则将 `target` 赋值给 `dragging`。这种技术允许通过标记而不是 JavaScript 轻松地指示可拖拽元素。\n\
  \n`handleEvent()` 的 `mousemove` 分支与之前的代码相同，区别在于会检查 `dragging` 是否为 `null`。当它不为 `null`时，已知\
  \ `dragging` 是正在被拖拽的元素，因此对其进行适当的定位。`mouseup` 分支简单地将 `dragging` 重置为 `null`，这有效地抵消了\
  \ `mousemove` 事件。\n\n`DragDrop` 有两个公共方法：`enable()` 和 `disable()`，它们分别负责绑定和解绑所有事件处理器。这些方法为拖放功能提供了额外的控制手段。\n\
  \n若要使用 `DragDrop` 对象，只需在页面中引入它并调用 `enable()` 即可。拖放功能将对所有包含 `\"draggable\"` 类的元素启用，如下例所示：\n\
  \n```html\n<div class=\"draggable\" style=\"position:absolute; background:red\"\
  ></div>\n```\n\n注意，要让某个元素支持拖放功能，该元素必须是绝对定位的。\n\n### 修复拖拽功能\n\n当你尝试这个示例时，你会发现元素的左上角始终与光标对齐。其结果对用户来说有些突兀，因为当鼠标开始移动时，元素似乎发生了跳变。理想情况下，操作看起来应该像元素被光标“拾起”了一样，这意味着用户点击的位置应该是元素在拖拽期间光标保持停留的位置（参见图\
  \ 22-4）。\n\n图 22-4\n\n![image](img/f760-01.jpg)\n\n为了达到理想的效果，还需要一些额外的计算。为此，你需要计算元素左上角与光标位置之间的差异。该差异需要在\
  \ `mousedown` 事件发生时确定，并一直持续到 `mouseup` 事件发生。通过比较 `event` 的 `clientX` 和 `clientY`\
  \ 属性与元素的 `offsetLeft` 和 `offsetTop` 属性，你可以算出在水平和垂直方向上还需要多少空间（参见图 22-5）。\n\n图 22-5\n\
  \n![image](img/f760-02.jpg)\n\n为了存储 x 轴和 y 轴位置的差异，你还需要两个变量。这些变量 `diffX` 和 `diffY`\
  \ 需要在 `onmousemove` 事件处理器中使用，以正确定位元素，如下例所示：\n\n![image](img/logo1.gif)\n\n```javascript\n\
  var DragDrop = function(){\n\n    var dragging = null,\n        diffX = 0,\n   \
  \     diffY = 0;\n\n    function handleEvent(event){\n\n        //get event and\
  \ target\n        event = EventUtil.getEvent(event);\n        var target = EventUtil.getTarget(event);\
  \            \n\n        //determine the type of event\n        switch(event.type){\n\
  \            case \"mousedown\":\n                if (target.className.indexOf(\"\
  draggable\") > -1){\n                    dragging = target;\n                  \
  \  diffX = event.clientX - target.offsetLeft;\n                    diffY = event.clientY\
  \ - target.offsetTop;\n                }                     \n                break;\n\
  \n            case \"mousemove\":\n                if (dragging !== null){\n\n \
  \                   //assign location\n                    dragging.style.left =\
  \ (event.clientX - diffX) + \"px\";\n                    dragging.style.top = (event.clientY\
  \ - diffY) + \"px\";\n\n                }                    \n                break;\n\
  \n            case \"mouseup\":\n                dragging = null;\n            \
  \    break;\n        }\n    };\n\n    //public interface\n    return {         \
  \   \n        enable: function(){\n            EventUtil.addHandler(document, \"\
  mousedown\", handleEvent);\n            EventUtil.addHandler(document, \"mousemove\"\
  , handleEvent);\n            EventUtil.addHandler(document, \"mouseup\", handleEvent);\n\
  \        },\n\n        disable: function(){\n            EventUtil.removeHandler(document,\
  \ \"mousedown\", handleEvent);\n            EventUtil.removeHandler(document, \"\
  mousemove\", handleEvent);\n            EventUtil.removeHandler(document, \"mouseup\"\
  , handleEvent);\n        }\n    }\n}();\n```\n\n### DragAndDropExample03.htm\n\n\
  `diffX` 和 `diffY` 变量是私有的，因为它们仅供 `handleEvent()` 函数。当 `mousedown` 事件发生时，通过从 `target`\
  \ 的 `clientX` 减去 `offsetLeft` 以及从 `clientY` 减去 `offsetTop` 来计算这些值。这些值确定了在 `mousemove`\
  \ 事件触发时需要减去的量。结果是更平滑的拖拽体验，其行为更符合用户的预期。\n\n### 添加自定义事件\n\n除非知道拖拽何时发生，否则拖放功能无法在应用程序中实际应用。到目前为止，代码没有提供任何指示拖拽开始、进行中或结束的方法。可以使用自定义事件来指示这些情况的发生，从而允许应用程序的其他部分与拖放功能进行交互。\n\
  \n由于 `DragDrop` 对象是使用模块模式的单例，为了使用 `EventTarget` 类型需要一些更改。首先，创建一个新的 `EventTarget`\
  \ 对象，然后添加 `enable()` 和 `disable()` 方法，最后返回该对象。考虑以下内容：\n\n![image](img/logo1.gif)\n\
  \n\n\n\n\n```javascript\nvar DragDrop = function(){\n\n    var dragdrop = new EventTarget(),\n\
  \        dragging = null,\n        diffX = 0,\n        diffY = 0;\n\n    function\
  \ handleEvent(event){\n\n        //获取事件和目标\n        event = EventUtil.getEvent(event);\n\
  \        var target = EventUtil.getTarget(event);            \n\n        // 确定事件的类型\n\
  \        switch(event.type){\n            case \"mousedown\":\n                if\
  \ (target.className.indexOf(\"draggable\") > -1){\n                    dragging\
  \ = target;\n                    diffX = event.clientX - target.offsetLeft;\n  \
  \                  diffY = event.clientY - target.offsetTop;\n                 \
  \   dragdrop.fire({type:\"dragstart\", target: dragging, \n                    \
  \               x: event.clientX, y: event.clientY});\n                }       \
  \              \n                break;\n\n            case \"mousemove\":\n   \
  \             if (dragging !== null){\n\n                    //赋值位置\n          \
  \          dragging.style.left = (event.clientX - diffX) + \"px\";\n           \
  \         dragging.style.top = (event.clientY - diffY) + \"px\";   \n\n        \
  \            // 触发自定义事件\n                    dragdrop.fire({type:\"drag\", target:\
  \ dragging, \n                                   x: event.clientX, y: event.clientY});\n\
  \                }                    \n                break;\n\n            case\
  \ \"mouseup\":\n                dragdrop.fire({type:\"dragend\", target: dragging,\
  \ \n                               x: event.clientX, y: event.clientY});\n     \
  \           dragging = null;\n                break;\n        }\n    };\n\n    //\
  \ 公有接口\n    dragdrop.enable = function(){\n        EventUtil.addHandler(document,\
  \ \"mousedown\", handleEvent);\n        EventUtil.addHandler(document, \"mousemove\"\
  , handleEvent);\n        EventUtil.addHandler(document, \"mouseup\", handleEvent);\n\
  \    };\n\n    dragdrop.disable = function(){\n        EventUtil.removeHandler(document,\
  \ \"mousedown\", handleEvent);\n        EventUtil.removeHandler(document, \"mousemove\"\
  , handleEvent);\n        EventUtil.removeHandler(document, \"mouseup\", handleEvent);\n\
  \    };\n\n    return dragdrop;\n}();\n```\n\n`DragAndDropExample04.htm`\n\n这段代码定义了三个事件：`dragstart`、`drag`\
  \ 和 `dragend`。这些事件每个会将被拖动的元素设置为目标，并提供 `x` 和 `y` 属性来指示其当前位置。这些事件在 `dragdrop` 对象上触发，该对象在返回之前被增加了\
  \ `enable()` 和 `disable()` 方法。这种模块模式的细微变化允许 `DragDrop` 对象支持如下事件：\n\n![image](img/logo1.gif)\n\
  \n```javascript\nDragDrop.addHandler(\"dragstart\", function(event){\n    var status\
  \ = document.getElementById(\"status\");\n    status.innerHTML = \"Started dragging\
  \ \" + event.target.id;\n});\n\nDragDrop.addHandler(\"drag\", function(event){\n\
  \    var status = document.getElementById(\"status\");\n    status.innerHTML +=\
  \ \"<br>Dragged \" + event.target.id + \" to (\" + event.x + \n                \
  \        \",\" + event.y + \")\";\n});\n\nDragDrop.addHandler(\"dragend\", function(event){\n\
  \    var status = document.getElementById(\"status\");\n    status.innerHTML +=\
  \ \"<br>Dropped \" + event.target.id + \" at (\" + event.x + \n                \
  \        \",\" + event.y + \")\";\n});\n```\n\n`DragAndDropExample04.htm`\n\n在这里，为\
  \ `DragDrop` 对象的每个事件添加了事件处理程序。使用一个元素来显示被拖动元素的当前状态和位置。一旦元素被释放，你将获得它从最初被拖动以来经历的所有中间步骤列表。\n\
  \n为 `DragDrop` 添加自定义事件使其成为一个更健壮的对象，可以用于管理 Web 应用程序中复杂的拖放功能。\n\n# 总结\n\nJavaScript\
  \ 中的函数是非常强大的，因为它们是一等对象。通过闭包和函数上下文切换，你可以以许多强大的方式使用函数。例如：\n\n*   可以创建作用域安全的构造函数，确保在没有使用\
  \ `new` 运算符的情况下调用构造函数不会改变错误的上下文对象。\n*   你可以通过延迟任何代码分叉直到函数第一次被调用时执行，来使用懒加载函数（lazy\
  \ loading functions）。\n*   函数绑定（Function binding）允许你创建始终在特定上下运行的函数，而函数里化（function\
  \ currying）允许你创建某些参数已经填充完毕的函数。\n*   结合绑定和里化可以为你提供一种在任何上下文、使用任何参数执行任何函数的方法。\n\nECMAScript\
  \ 5 允许你通过多种不同的方式创建防篡改对象：\n\n*   不可扩展对象（Nonextensible objects）不允许向对象添加新的属性或方法。\n\
  *   密封对象（Sealed objects）是不可扩展的，且不允许删除现有的属性和方法。\n*   冻结对象（Frozen objects）是密封的，并且不允许覆盖对象的成员。\n\
  \n在 JavaScript 中可以使用 `setTimeout()` 或 `setInterval()` 创建定时器，如下：\n\n*   定时器代码被放置在一个等待区域，直到达到间隔时间，此时代码被添加到\
  \ JavaScript 进程队列中，并在下一次 JavaScript 进程空闲时执行。\n*   每当一段代码完全执行完毕时，会有短暂的空闲时间允许其他浏览器进程完成。\n\
  *   这种行为意味着可以使用定时器将长时间运行的脚本拆分为较小的块，并在以后执行。这有助于 Web 应用程序对用户交互做出快速响应。\n\n观察者模式在 JavaScript\
  \ 中经常以事件的形式被使用。虽然事件经常与 DOM 使用，但你也可以通过实现自定义事件在自己的代码中使用它们。拖放是桌面和 Web 应用程序中流行的用户界面范式，允许用户以直观的方式轻松调整或配置内容。这种功能可以使用\
  \ JavaScript 使用鼠标事件和简单的计算创建。将拖放行为与自定义事件相结合可以创建一个可以应用于多种方式的可复用框架。\n\n# 第 23 章离线应用与客户端存储\n\
  \n## 本章内容\n\n*   设置离线检测\n*   使用离线缓存\n*   在浏览器中存储数据\n\nHTML5 的关注领域之一是启用离线 Web 应用程序。离线\
  \ Web 应用程序在没有 Internet 连接的情况下仍然运行。对于 Web 应用程序，创建离线体验需要几个步骤。第一步是确保应用程序知道是否有 Internet\
  \ 连接，以便执行正确的操作。然后，应用程序仍然需要访问部分资源（图像、JavaScript、CSS 等）以便继续正常工作。最后一部分是无论 Internet\
  \ 是否可用都可以进行读写的的本地数据存储区域。HTML5 和其他相关的 JavaScript API 使离线应用成为现实。\n\n## 离线检测\n\n由于离线应用的第一步是知道设备是否离线，HTML5\
  \ 定义了 `navigator.onLine` 属性，当 Internet 连接可用时为 true，当不可用时为 false。其想法是浏览器应该感知网络是否可用并返回相应的指示。在实践中，`navigator.onLine`\
  \ 在不同浏览器中有些怪异：\n\n\n\n\n\n* `Firefox 3+` 和 `Opera 10.6+` 支持 `navigator.onLine`，但你必须通过“文件\
  \ ⇒ 离线工作”菜单项手动将浏览器设置为离线模式。\n* `Chrome` 直到第 `11` 版本将 `navigator.onLine` 永久设置为 `true`。目前有一个待修复的\
  \ bug 正在解决此问题。\n\n由于这些兼容性问题，`navigator.onLine` 无法作为网络连接的唯一判断标准。尽管如此，它在请求过程中发生错误时仍然很有用。你可以按照以下方式检查状态：\n\
  \n![image](img/logo1.gif)\n\n```\nif (navigator.onLine){\n    //正常正常工作\n} else {\n\
  \    //执行离线行为\n}\n```\n\n`OnLineExample01.htm`\n\n除了 `navigator.onLine` 之外，`HTML5`\
  \ 定义了两个事件来更好地跟踪网络是否可用：`online` 和 `offline`。当网络状态从 `online` 变为 `offline` 或反之变化时，会分别触发相应的事件。这些事件在\
  \ `window` 对象上触发：\n\n```\nEventUtil.addHandler(window, \"online\", function(){\n\
  \    alert(\"Online\");\n});\nEventUtil.addHandler(window, \"offline\", function(){\n\
  \    alert(\"Offline\");\n});\n```\n\n`OnlineEventsExample01.htm`\n\n要判断应用程序是否离线状态，最好的方法是先查看\
  \ `navigator.onLine` 以获取页面加载时的初始状态。之后，最好使用事件来确定网络连接的变化。`navigator.onLine` 属性也会随着事件的触发而改变，但你需要手动轮询该属性的更改来检测网络变化。\n\
  \nInternet Explorer 6+（仅支持 `navigator.onLine`）、`Firefox 3`、`Safari 4`、`Opera 10.6`、`Chrome`、`Safari\
  \ for iOS 3.2` 以及 `WebKit for Android` 支持离线检测。\n\n# 应用缓存 (APPLICATION CACHE)\n\n\
  `HTML5` 应用缓存（简称 `appcache`）专门为离线 Web 应用设计。`appcache` 是一个独立于普通浏览器缓存的缓存区域。你通过提供一个列出需要下载和缓存的资源的清单文件来指定应该存储在页面的\
  \ `appcache` 中的内容。这里是一个简单的清单文件：\n\n```\nCACHE MANIFEST\n#Comment\n\nfile.js\nfile.css\n\
  ```\n\n在最简单的形式下，清单文件列出了需要下载的资源，以便它们在离线时可用。\n\n![image](img/pen.gif)\n\n设置此文件有很多选项，这些内容超出了本书的范围。请参\
  \ [`html5doctor.com/go-offline-with-application-cache/`](http://html5doctor.com/go-offline-with-application-cache/)\
  \ 获取所有选项的完整描述。\n\n通过在 `<html>` 标签的 `manifest` 属性中指定路径将清单文件与页面关联，例如：\n\n```html\n\
  <html manifest=\"/offline.manifest\">\n```\n\n此代码表示 `/offline.manifest` 包含了清单文件。该文件必须以\
  \ `text/cache-manifest` 内容类型才能使用。\n\n虽然 `appcache` 主要用于缓存指定的资源以供离线使用，但它确实有一个 JavaScript\
  \ API，允许你确定 `appcache` 正在执行的操作。主要的对象是 `applicationCache`。该对象有一个属性 `status`，它用以下常量之一指示\
  \ `appcache` 的当前状态：\n\n* `0` 表示未缓存，意味着页面没有关联的 `appcache`。\n* `1` 表示空闲，意味着 `appcache`\
  \ 暂未进行更新。\n* `2` 表示检查中，意味着正在下载 `appcache` 清单文件并检查是否有更新。\n* `3` 表示下载中，意味着 `appcache`\
  \ 正在下载清单文件中指定的资源。\n* `4` 表示更新就绪，意味着 `appcache` 已用新资源更新，且所有资源均已下载，可以通过 `swapCache()`\
  \ 使用。\n* `5` 表示已过期，意味着 `appcache` 清单文件不再可用，因此 `appcache` 对该页面已失效。\n\n还有许多与 `appcache`\
  \ 相关的事件，用于指示其状态何时发生变化。这些事件包括：\n\n* `checking` — 当浏览器开始寻找 `appcache` 的更新时触发。\n* `error`\
  \ — 如果在检查或下载序列的任何一点发生错误则触发。\n* `noupdate` — 在检查发现 `appcache` 清单文件没有变化后触发。\n* `downloading`\
  \ — 当 `appcache` 资源开始下载时触发。\n* `progress` — 当文件正在下载到 `appcache` 时反复触发。\n* `updateready`\
  \ — 当页面的新版本 `appcache` 已下载并准备好通过 `swapCache()` 使用时触发。\n* `cached` — 当 `appcache`\
  \ 完成并准备就绪可用时触发。\n\n这些事件在页面加载时通常按此顺序触发。你也可以通过调用 `update()` 再次触发 `appcache` 经历这一系列更新检查序列：\n\
  \n```\napplicationCache.update();\n```\n\n一旦调用 `update()`，`appcache` 就会检查清单文件是否已更新（触发\
  \ `checking`），然后像页面刚刚加载一样继续进行。如果触发 `cached` 事件，意味着新的 `appcache` 内容已准备就绪可以使用。如果 `updateready`\
  \ 事件触发，意味着新的 `appcache` 可通过 `swapCache()` 使用，如下：\n\n```\nEventUtil.addHandler(applicationCache,\
  \ \"updateready\", function(){\n    applicationCache.swapCache();\n});\n``` `Chrome`\
  \ 直到第 `11` 版本在调用 `swapCache()` 时才会抛出错误。\n\n# 数据存储 (DATA STORAGE)\n\n随着 Web 应用的出现，产生了在客户端直接存储信息的需求。这种想法是逻辑：有关特定用户的信息应该存储在该用户的机器上。无论是登录信息、偏好设置还是数据，Web\
  \ 开发者一直在寻找在客户端存储数据的方法。这个问题的第一个解决方案是以 Cookie 的形式出现的，它是 Netscape Communications Corporation\
  \ 的创作，并在《Persistent Client State: HTTP Cookies》规范中描述（可在 [`curl.haxx.se/rfc/cookie_spec.html`](http://curl.haxx.se/rfc/cookie_spec.html)\
  \ 查看）。如今 Cookie 存储数据的一种选择。\n\n## Cookie\n\nHTTP Cookie（通常称为 Cookie）最初旨在客户端存储会话信息。规范要求服务器在任何\
  \ HTTP 请求的响应中发送包含会话信息的 `Set-Cookie` 头部。例如，服务器响应的头部可能如下：\n\n```\nHTTP/1.1 200 OK\n\
  Content-type: text/html\nSet-Cookie: name=value\nOther-header: other-header-value\n\
  ```\n\n此 HTTP 响应设置名为 `name` 值为 `value` 的 Cookie。名称和值在发送时都会经过 URL 编码。浏览器存储此类会话信息，并在后的每次请求中通过\
  \ `Cookie` 头部传回服务器，如下：\n\n```\nGET /index.html HTTP/1.1\nCookie: name=value\nOther-header:\
  \ other-header-value\n```\n\n传回服务器的额外信息可用于唯一标识请求的客户端。\n\n## 限制 (Restrictions)\n\n\
  Cookie 本质上绑定到特定的域名。当设置 Cookie 时，它会与指向创建它的相同域名的请求一起发送。这种限制确保存储在 Cookie 中的信息仅对授权的接收者可用，无法被其他域名访问。\n\
  \n由于 Cookie 存储在客户端计算机上，因此实施了一些限制以确保 Cookie 不会被恶意使用，并且不会占用过多磁盘空间。每个域名的 Cookie 总数有限制，但不同浏览器有所不同。例如：\n\
  \n* Internet Explorer 6 及以下版本限制每个域名最多 20 个 Cookie。\n\n\n\n\n\n- `Internet Explorer\
  \ 7` 及更高版本限制每个域名最多存储 50 个 cookie。`Internet Explorer 7` 初始出厂时每个域名最多支持 20 个 cookie，但后来通过微软的补丁进行了更新。\n\
  - `Firefox` 每个域名的 cookie 限制为 50 个。\n- `Opera` 每个域名的 cookie 限制为 30 个。\n- `Safari`\
  \ 和 `Chrome` 对每个域名的 cookie 数量没有硬限制。\n\n当设置的 cookie 超过每个域名限制时，浏览器将开始删除之前设置的 cookie。`Internet\
  \ Explorer` 和 `Opera` 首先删除最久未使用（`LRU`）的 cookie，为新设置的 cookie 留出空间。`Firefox` 似乎是随机决定删除哪些\
  \ cookie，因此注意 cookie 限制以避免产生意外的后果非常重要。\n\n浏览器对 cookie 的大小也有限制。大多数浏览器的字节数限制在 4096\
  \ 字节左右，正或或少 1 字节。为了获得最佳的跨浏览器兼容性，最好将所有 cookie 总大小保持在 4095 字节或更少。大小限制适用于一个域名的所有 cookie，而不是每个单独\
  \ cookie。\n\n如果你尝试创建一个超过最大 cookie 大小的 cookie，该 cookie 将被静默丢弃。注意，通常一个字符占用一个字节，除非你正在使用多字节字符。\n\
  \n## Cookie 的组成部分\n\nCookie 由浏览器存储的以下信息组成：\n\n- **名称（Name）** — 用于识别 cookie 的唯一名称。Cookie\
  \ 名称不区分大小写，因此 `myCookie` 和 `MyCookie` 被视为相同。但在实践中，最好始终将 cookie 名称视为是区分大小写的，因为某些服务器软件可能会对它们进行区分大小写处理。cookie\
  \ 名称必须经过 URL 编码。\n- **值（Value）** — 存储在 cookie 中的字符串值。此值也必须经过 URL 编码。\n- **域名（Domain）**\
  \ — cookie 有效的域名。从该域名资源发送的所有请求将包含 cookie 信息。此值可以包含子域名（如 `www.wrox.com`），也可以排除子域名（如\
  \ `.wrox.com`，它对 `wrox.com` 的所有子域名有效）。如果没有显式设置，则假设域名为设置 cookie 的域名。\n- **路径（Path）**\
  \ — 在指定域名内，cookie 应该发送到服务器的路径。例如，你可以指定 cookie 仅从 `http://www.wrox.com/books/` 访问，这样\
  \ `http://www.wrox.com` 的页面将不会发送 cookie 信息，即使请求来自同一个域名。\n- **过期时间（Expiration）**\
  \ — 指明 cookie 何时被删除的时间戳（即何时停止发送服务器发送）。在默认情况下，所有 cookie 会在浏览器会话结束时被删除；但是，也可以设置另一个删除时间。此值设置为\
  \ GMT 格式的日期（`Wdy, DD-Mon-YYYY HH:MM:SS GMT`），并指定 cookie 删除的精确时间。由于由于，即使在浏览器关闭后，cookie\
  \ 也可能留在用户的机器上。通过设置一个已经过去的过期日期可以立即删除 cookie。\n- **安全标志位（Secure flag）** — 如果指定，只有在使用\
  \ SSL 连接时才会将 cookie 信息发送到服务器。例如，对 `https://www.wrox.com` 的请求应该发送 cookie 信息，而对 `http://www.wrox.com`\
  \ 的请求不应发送。\n\n每部分信息都作为 `Set-Cookie` 头部的一部分指定，使用分号加空格的组合来分隔每个部分，如下所示：\n\n```\nHTTP/1.1\
  \ 200 OK\nContent-type: text/html\nSet-Cookie: name=value; expires=Mon, 22-Jan-07\
  \ 07:10:24 GMT; domain=.wrox.com\nOther-header: other-header-value\n```\n\n此头部指定了一个名为\
  \ `\"name\"` 的 cookie，它于 2007 年 1 月 22 日周一 GMT 07:10:24 过期，并对 `www.wrox.com` 以及\
  \ `wrox.com` 的任何其他子域名（如 `p2p.wrox.com`）有效。\n\n`secure` 标志是 cookie 中不是键值对的部分；它仅包含了\
  \ `\"secure\"` 单词。考虑以下示例：\n\n```\nHTTP/1.1 200 OK\nContent-type: text/html\nSet-Cookie:\
  \ name=value; domain=.wrox.com; path=/; secure\nOther-header: other-header-value\n\
  ```\n\n在这里，创建了一个 cookie，对于 `wrox.com` 的所有子域名以及该域名上的所有页面（由 `path` 参数指定）有效。由于包含了 `secure`\
  \ 标志，此 cookie 只能通过 SSL 连接传输。\n\n需要注意的是，`domain`、`path`、`expiration date` 和 `secure\
  \ flag` 是对浏览器的指示，说明在何时应随请求发送 cookie。这些参数实际上不会作为 cookie 信息的一部分发送到服务器；只发送键值对。\n\n\
  ## JavaScript 中的 Cookie\n\n在 JavaScript 中处理 cookie 有些点复杂，因为有一个臭名昭著的接口：BOM 的 `document.cookie`\
  \ 属性。该属性的独特之处在于，它的行为根据使用方式会有很大不同。当用于获取属性值时，`document.cookie` 返回一个包含页面所有可用 cookie\
  \ 的字符串（基于 cookie 的域名、路径、过期和安全设置），表现为一系列由分号分隔的键值对，如下：\n\n```\nname1=value1;name2=value2;name3=value3\n\
  ```\n\n所有的值都经过了 URL 编码，因此需要通过 `decodeURIComponent()` 解析。\n\n当用于设置值时，可以将 `document.cookie`\
  \ 设置为一个 cookie 字符串。该字符串会被解析并添加到现有的 cookie 集合中。设置 `document.cookie` 不会覆盖任何 cookie，除非设置的\
  \ cookie 名称已在使用。设置 cookie 的格式如下，与 `Set-Cookie` 头部格式相同：\n\n```\nname=value; expires=expiration_time;\
  \ path=domain_path; domain=domain_name; secure\n```\n\n在这些参数中，只有 cookie 的名称和值是必须。这是一个简单的示例：\n\
  \n```\ndocument.cookie = \"name=Nicholas\";\n```\n\n这段代码创建了一个名为 `\"name\"` 的会话 cookie，其值为\
  \ `\"Nicholas\"`。客户端每次向服务器发送请求时都会发送此 cookie。虽然这样做可行（因为名称或值中没有需要编码的字符），但在设置 cookie\
  \ 时始终使用 `encodeURIComponent()` 是最佳实践，如下所示：\n\n```\ndocument.cookie = encodeURIComponent(\"\
  name\") + \"=\" +  \n                  encodeURIComponent(\"Nicholas\");\n```\n\n\
  为创建的 cookie 指定附加信息，只需按照 `Set-Cookie` 头部格式将其附加到字符串末尾即可：\n\n```\ndocument.cookie =\
  \ encodeURIComponent(\"name\") + \"=\" +  \n                  encodeURIComponent(\"\
  Nicholas\") + \"; domain=.wrox.com; path=/\";\n```\n\n由于 JavaScript 中读取和写入 cookie\
  \ 并不直观，通常会使用函数来简化 cookie 功能。有三种基本的 cookie 操作：读取、写入和删除。这些操作在 `CookieUtil` 对象中表示如下：\n\
  \n![image](img/logo1.gif)\n\n\n\n\n\n```javascript\nvar CookieUtil = {\n\n    get:\
  \ function (name){\n        var cookieName = encodeURIComponent(name) + \"=\",\n\
  \            cookieStart = document.cookie.indexOf(cookieName),\n            cookieValue\
  \ = null;\n\n        if (cookieStart > -1){\n            var cookieEnd = document.cookie.indexOf(\"\
  ;\", cookieStart);\n            if (cookieEnd == -1){\n                cookieEnd\
  \ = document.cookie.length;\n            }\n            cookieValue = decodeURIComponent(document.cookie.substring(cookieStart\
  \ \n                          + cookieName.length, cookieEnd));\n        } \n\n\
  \        return cookieValue;\n    },\n\n    set: function (name, value, expires,\
  \ path, domain, secure) {\n        var cookieText = encodeURIComponent(name) + \"\
  =\" + \n                         encodeURIComponent(value);\n\n        if (expires\
  \ instanceof Date) {\n            cookieText += \"; expires=\" + expires.toGMTString();\n\
  \        }\n\n        if (path) {\n            cookieText += \"; path=\" + path;\n\
  \        }\n\n        if (domain) {\n            cookieText += \"; domain=\" + domain;\n\
  \        }\n\n        if (secure) {\n            cookieText += \"; secure\";\n \
  \       }\n\n        document.cookie = cookieText;\n    },\n\n    unset: function\
  \ (name, path, domain, secure){\n        this.set(name, \"\", new Date(0), path,\
  \ domain, secure);\n    }\n\n};\n```\n\n### CookieUtil.js\n\n`CookieUtil.get()`\
  \ 方法根据指定的名称获取 cookie 的值。为了实现这一点，它会在 `document.cookie` 中查找 cookie 名称后跟一个等号的出现情况。如果找到了该模式，将使用\
  \ `indexOf()` 找到该位置之后的下一个分号（这表示 cookie 的结束）。如果没有找到分号，则说明该 cookie 是字符串中的最后一个，因此字符串的剩余部分都应被视为\
  \ cookie 的值。该值将使用 `decodeURIComponent()` 进行解码并返回。如果未找到 cookie，则返回 `null`。\n\n`CookieUtil.set()`\
  \ 方法在页面上设置 cookie，并接受多个参数：cookie 的名称、cookie 的值、一个指示 cookie 何时应被删除的可选 `Date` 对象、一个\
  \ cookie 的可选 URL 路径、一个 cookie 的可选域名，以及一个指示是否应添加安全标志的可选 `Boolean` 值。这些参数按照使用频率的顺序排列，只有前两个是必须的。在方法内部，名称和值使用\
  \ `encodeURIComponent()` 进行 URL 编码，然后检查其他选项。如果 `expires` 参数是一个 `Date` 对象，则使用该 `Date`\
  \ 对象的 `toGMTString()` 方法添加 `expires` 选项，以正确格式化日期。该方法的其余部分只是在构建 cookie 字符串并将其设置为\
  \ `document.cookie`。\n\n目前没有直接删除现有 cookie 的方法。相反，你需要重新设置该 cookie——使用相同的路径、域名和安全选项——并将其过期日期设置为过去的某个时间。`CookieUtil.unset()`\
  \ 方法处理了这种情况。它接受四个参数：要删除的 cookie 名称、一个可选的 `path` 参数、一个可选的 `domain` 参数以及一个可选的 `secure`\
  \ 参数。\n\n这些参数被传递给 `CookieUtil.set()`，其中值被设置为空字符串，过期日期被设置为 1970 年 1 月 1 日（初始化为 `0`\
  \ 毫秒的 `Date` 对象的值）。这样做可以确保 cookie 被移除。\n\n这些方法可以如下所示使用：\n\n![image](img/logo1.gif)\n\
  \n```javascript\n//set cookies\nCookieUtil.set(\"name\", \"Nicholas\");\nCookieUtil.set(\"\
  book\", \"Professional JavaScript\");\n\n//read the values\nalert(CookieUtil.get(\"\
  name\"));  //\"Nicholas\"\nalert(CookieUtil.get(\"book\"));  //\"Professional JavaScript\"\
  \n\n//remove the cookies\nCookieUtil.unset(\"name\");\nCookieUtil.unset(\"book\"\
  );\n\n//set a cookie with path, domain, and expiration date\nCookieUtil.set(\"name\"\
  , \"Nicholas\", \"/books/projs/\", \"www.wrox.com\",\n               new Date(\"\
  January 1, 2010\"));\n\n//delete that same cookie\nCookieUtil.unset(\"name\", \"\
  /books/projs/\", \"www.wrox.com\");\n\n//set a secure cookie\nCookieUtil.set(\"\
  name\", \"Nicholas\", null, null, null, true);\n```\n\n### CookieExample01.htm\n\
  \n这些方法通过处理解析和 cookie 字符串构建任务，使得使用 cookie 在客户端上存储数据变得更加简单。\n\n字体 子 cookie (Subcookies)\n\
  \n为了绕过浏览器实施的每个域名的 cookie 限制，一些开发者使用了一种称为子 cookie（subcookies）的概念。子 cookie 是存储在单个\
  \ cookie 内部的较小数据单元。其思想是利用 cookie 的值在单个 cookie 中存储多个键-值对。子 cookie 最常见的格式如下：\n\n```\n\
  name=name1=value1&name2=value2&name3=value3&name4=value4&name5=value5\n```\n\n子\
  \ cookie 倾向于采用查询字符串格式格式化。这些值可以使用单个 cookie 进行存储和访问，而不是为每个键-值对使用不同的 cookie。结果是，网站或\
  \ Web 应用可以存储更多结构化数据，而不会达到每个域名的 cookie 限制。\n\n要处理子 cookie，你需要一组新的方法。由于预期的子 cookie\
  \ 用法，子 cookie 的解析和序列化略有不同且稍微复杂。要获取子 cookie，例如，你需要按照相同的步骤获取 cookie，但在解码值之前，需要如下查找子\
  \ cookie 信息：\n\n![image](img/logo1.gif)\n\n```javascript\nvar SubCookieUtil = {\n\
  \n    get: function (name, subName){\n        var subCookies = this.getAll(name);\n\
  \        if (subCookies){\n            return subCookies[subName];\n        } else\
  \ {\n            return null;\n        }\n    },\n\n    getAll: function(name){\n\
  \        var cookieName = encodeURIComponent(name) + \"=\",\n            cookieStart\
  \ = document.cookie.indexOf(cookieName),\n            cookieValue = null,\n    \
  \        cookieEnd,\n            subcookies,\n            i,\n            parts,\n\
  \            result = {};\n\n        if (cookieStart > -1){\n            cookieEnd\
  \ = document.cookie.indexOf(\";\", cookieStart);\n            if (cookieEnd == -1){\n\
  \                cookieEnd = document.cookie.length;\n            }\n          \
  \  cookieValue = document.cookie.substring(cookieStart \n                      \
  \    + cookieName.length, cookieEnd);\n\n            if (cookieValue.length > 0){\n\
  \                subcookies = cookieValue.split(\"&\");\n\n                for (i=0,\
  \ len=subcookies.length; i < len; i++){\n                    parts = subcookies[i].split(\"\
  =\");\n                    result[decodeURIComponent(parts[0])] = \n           \
  \              decodeURIComponent(parts[1]);\n                }\n\n            \
  \    return result;\n            }\n        } \n\n        return null;\n    },\n\
  \n    //more code here\n};\n```\n\n### SubCookieUtil.js\n\n有两个方法用于获取子 cookie：`get()`\
  \ 和 `getAll()`。其中 `get()` 获取单个子 cookie 值，而 `getAll()` 获取所有子 cookie 并将其返回到一个对象，其属性等于子\
  \ cookie 名称，值等于子 cookie 值。`get()` 方法接受两个参数：cookie 的名称和子 cookie 的名称。它简单调用 `getAll()`\
  \ 获取所有子 cookie，然后返回感兴趣的那个（如果 cookie 不存在则返回 `null`）。\n\n\n\n\n\n```\n//assume document.cookie=data=name=Nicholas&book=Professional%20JavaScript\n\
  \n//get all subcookies\nvar data = SubCookieUtil.getAll(\"data\");\nalert(data.name);\
  \  //\"Nicholas\"\nalert(data.book);  //\"Professional JavaScript\"\n\n//get subcookies\
  \ individually\nalert(SubCookieUtil.get(\"data\", \"name\"));  //\"Nicholas\"\n\
  alert(SubCookieUtil.get(\"data\", \"book\"));  //\"Professional JavaScript\"\n```\n\
  \n### SubCookiesExample01.htm\n\n要写入子 cookie（subcookies），可以使用两种方法：`set()` 和 `setAll()`。以下代码展示了它们的结构：\n\
  \n```javascript\nvar SubCookieUtil = {\n\n    set: function (name, subName, value,\
  \ expires, path, domain, secure) {\n        var subcookies = this.getAll(name) ||\
  \ {};\n        subcookies[subName] = value;\n        this.setAll(name, subcookies,\
  \ expires, path, domain, secure);\n    },\n\n    setAll: function(name, subcookies,\
  \ expires, path, domain, secure){\n\n        var cookieText = encodeURIComponent(name)\
  \ + \"=\",\n            subcookieParts = new Array(),\n            subName;\n\n\
  \        for (subName in subcookies){\n            if (subName.length > 0 && subcookies.hasOwnProperty(subName)){\n\
  \                subcookieParts.push(encodeURIComponent(subName) + \"=\" + \n  \
  \                  encodeURIComponent(subcookies[subName]));\n            }\n  \
  \      }\n\n        if (cookieParts.length > 0){\n            cookieText += subcookieParts.join(\"\
  &\");\n\n            if (expires instanceof Date) {\n                cookieText\
  \ += \"; expires=\" + expires.toGMTString();\n            }\n\n            if (path)\
  \ {\n            cookieText += \"; path=\" + path;\n            }\n\n          \
  \  if (domain) {\n                cookieText += \"; domain=\" + domain;\n      \
  \      }\n\n            if (secure) {\n                cookieText += \"; secure\"\
  ;\n            }\n        } else {\n            cookieText += \"; expires=\" + (new\
  \ Date(0)).toGMTString();\n        }\n\n        document.cookie = cookieText;  \
  \      \n\n    },\n\n    //more code here\n};\n```\n\n### SubCookieUtil.js\n\n`set()`\
  \ 方法接受七个参数：cookie 名称、子 cookie 名称、子 cookie 值、一个用于 cookie 过期日期/时间的可选 `Date` 对象、一个可选的\
  \ cookie 路径、一个可选的 cookie 域名以及一个可选的 `Boolean` 安全标志。所有可选参数都指向 cookie 本身，而不是子 cookie。为了在同一个\
  \ cookie 中存储多个子 cookie，路径、`domain` 和 `secure` 标志必须相同；过期日期针对整个 cookie，并且可以在写入任何单个子\
  \ cookie 时设置。在方法内部，第一步是获取给定 cookie 名称的所有子 cookie。如果 `getAll()` 返回 `null`，则使用逻辑或（logical\
  \ OR）运算符将子 cookie 设置为一个新对象。之后，将子 cookie 的值设置在 `subcookies` 对象上，然后传递给 `setAll()`。\n\
  \n`setAll()` 方法接受六个参数：cookie 名称、一个包含所有子 cookie 的对象，以及 `set()` 中使用的其余可选参数。该方法使用 `for-in`\
  \ 循环遍历第二个参数的属性。为了确保保存了正确的数据，请使用 `hasOwnProperty()` 方法来确保只有实例属性被序列化为子 cookie。由于属性名可能为空字符串，因此在将其添加到结果之前还会检查属性名的长度。每个子\
  \ cookie 的键值对被添加到 `subcookieParts` 数组中，以便稍后使用 `join()` 方法通过 `&` 符号轻松连接。方法的其余部分与\
  \ `CookieUtil.set()` 相同。\n\n这些方法可以使用如下方式：\n\n![image](img/logo1.gif)\n\n```javascript\n\
  //assume document.cookie=data=name=Nicholas&book=Professional%20JavaScript\n\n//设置两个子\
  \ cookie\nSubCookieUtil.set(\"data\", \"name\", \"Nicholas\");\nSubCookieUtil.set(\"\
  data\", \"book\", \"Professional JavaScript\");\n\n//带有过期日期设置所有子 cookie\nSubCookieUtil.setAll(\"\
  data\", { name: \"Nicholas\", book: \"Professional JavaScript\" },\n    new Date(\"\
  January 1, 2010\"));\n\n//更改 name 的值并更改 cookie 的过期日期\nSubCookieUtil.set(\"data\"\
  , \"name\", \"Michael\", new Date(\"February 1, 2010\"));\n```\n\n### SubCookiesExample01.htm\n\
  \n最后一组子 cookie 方法用于删除子 cookie。普通 cookie 通过将过期日期设置为过去的某个时间来删除，但子 cookie 并不能那么容易删除。要删除一个子\
  \ cookie，你需要获取 cookie 中包含的所有子 cookie，仅删除要移除的那一个，然后用剩余的子 cookie 值将 cookie 的值写回。考虑以下：\n\
  \n```javascript\nvar SubCookieUtil = {\n\n    //more code here\n\n    unset: function\
  \ (name, subName, path, domain, secure){\n        var subcookies = this.getAll(name);\n\
  \        if (subcookies){\n            delete subcookies[subName];\n           \
  \ this.setAll(name, subcookies, null, path, domain, secure);\n        }\n    },\n\
  \n    unsetAll: function(name, path, domain, secure){\n        this.setAll(name,\
  \ null, new Date(0), path, domain, secure);\n    }\n\n};\n```\n\n### SubCookieUtil.js\n\
  \n定义的这两个方法有两个用途。`unset()` 方法用于从 cookie 中删除单个子 cookie 同时保持其他部分完整；而 `unsetAll()` 方法相当于\
  \ `CookieUtil.unset()`，用于删除整个 cookie。与 `set()` 和 `setAll()` 一样，`path`、`domain` 和\
  \ `secure` 标志必须与创建 cookie 时的选项匹配。这些方法可以使用如下：\n\n```javascript\n//删除 \"name\" 子 cookie\n\
  SubCookieUtil.unset(\"data\", \"name\");\n\n//删除整个 cookie\nSubCookieUtil.unsetAll(\"\
  data\");\n```\n\n如果你担心达到域名 cookie 限制，子 cookie 是一个极具吸引力的替代方案。还有一种名为 HTTP-only 的 cookie。HTTP-only\
  \ cookie 可以从浏览器或服务器设置，但只能从服务器读取，因为 JavaScript 无法获取其值。\n\n由于所有 cookie 都通过请求头从浏览器发送，在\
  \ cookie 中存储大量信息会影响性能。cookie 信息越大，完成请求所需的时间就越长。尽管浏览器对 cookie 有大小限制，但尽可能在 cookie\
  \ 中存储少量信息是一个好习惯，以避免性能影响。\n\n![image](img/pen.gif)\n\n强烈建议不要在 cookie 中存储重要或敏感数据。Cookie\
  \ 数据未存储在安全环境中，因此其中包含任何数据都可能被访问。你不应该在 cookie 中存储信用卡号或个人地址等数据。\n\n### Internet Explorer\
  \ User Data\n\n在 Internet Explorer 5 中，微软通过自定义行为（behavior）引入了持久化用户数据的概念。用户数据允许每个文档存储高达\
  \ 128KB 的数据，每个域名存储高达 1MB 的数据。要使用持久化用户数据，首先必须像下文所示在元素上指定 userData 行为：\n\n```html\n\
  <div style=\"behavior:url(#default#userData)\" id=\"dataStore\"></div>\n```\n\n\
  一旦元素使用了 userData 行为，你就可以使用 `setAttribute()` 方法将其保存数据。为了将数据提交到浏览器缓存，你随后必须调用 `save()`\
  \ 并传入要保存的数据存储名称。数据存储名称是完全任意的，用于区分不同的数据集。考虑以下示例：\n\n\n\n\n\n```\nvar dataStore =\
  \ document.getElementById(\"dataStore\");\ndataStore.setAttribute(\"name\", \"Nicholas\"\
  );\ndataStore.setAttribute(\"book\", \"Professional JavaScript\");\ndataStore.save(\"\
  BookInfo\");\n```\n\n`UserDataExample01.htm`\n\n在此段代码中，两个信息被保存在`<div>`元素上。在使用 `setAttribute()`\
  \ 存储这些数据后，调用了数据存储名称 `\"BookInfo\"` 的 `save()` 方法。下次加载页面时，你可以使用数据存储名称调用 `load()`\
  \ 方法来检索数据，如下：\n\n```\ndataStore.load(\"BookInfo\");\nalert(dataStore.getAttribute(\"\
  name\"));    //\"Nicholas\"\nalert(dataStore.getAttribute(\"book\"));    //\"Professional\
  \ JavaScript\"\n```\n\n`UserDataExample01.htm`\n\n`load()` 的调用会从 `\"BookInfo\"`\
  \ 数据存储中检索所有信息并使其在元素可用；在显式加载之前，这些信息是不可用的。如果为 `getAttribute()` 调用一个不存在或尚未加载的名称，则会返回\
  \ `null`。\n\n你可以通过使用 `removeAttribute()` 方法并传递属性名称显式从元素中移除数据。移除后必须再次调用 `save()`\
  \ 来提交更改，如下所示：\n\n```\ndataStore.removeAttribute(\"name\");\ndataStore.removeAttribute(\"\
  book\");\ndataStore.save(\"BookInfo\");\n```\n\n`UserDataExample01.htm`\n\n此代码移除了两个数据属性，并将这些更改保存到缓存中。\n\
  \nInternet Explorer 用户数据的访问限制与 cookie 的限制。为了访问数据存储，运行脚本的页面必须来自相同的域、位于相同的目录路径，并使用与保存数据到存储器的脚本相同的协议。与\
  \ cookie 不同，你无法将用户数据的访问限制扩大到更广泛的消费者。此外，与 cookie 不同的是，用户数据默认跨会话持久且不会过期；需要使用 `removeAttribute()`\
  \ 具体移除数据以释放空间。\n\n![image](img/pen.gif)\n\n与 cookie 一样，Internet Explorer 用户数据是不安全的，不应用于存储敏感信息。\n\
  \n## Web Storage\n\nWeb Storage 首次在 Web 超文本应用程序技术工作组 (WHAT-WG) 的 Web Applications\
  \ 1.0 规范中描述。该规范的初始工作最终成为 HTML5 的一部分，然后被拆分为自己的规范。它的意图是解决当严格需要在客户端数据而无需持续向服务器发送数据时，cookie\
  \ 带来的某些局限性。Web Storage 的两个主要目标是：\n\n* 提供一种在 cookie 之外存储会话数据的方法。\n* 提供存储跨会话持久的大量数据的机制。\n\
  \n原始的 Web Storage 规范包含了两个对象的定义：`localStorage` 和 `globalStorage`。这些对象作为 Internet\
  \ Explorer 8+、Firefox 3.5+、Safari 3.1+、Chrome 4+ 和 Opera 10.5+ 中的 `window` 属性可用。\n\
  \n![image](img/pen.gif)\n\nFirefox 2 和 3 拥有 Web Storage 的部分实现，这些基于较早的工作，其中实现了一个名为\
  \ `globalStorage` 的对象而不是 `localStorage`。\n\n## 存储类型\n\n`Storage` 类型设计用于存储具有最大 own（由浏览器决定）的键值对。`Storage`\
  \ 实例像任何其他对象一样工作，并具有以下额外方法：\n\n* `clear()` — 移除所有值；在 Firefox 中未实现。\n* `getItem(name)`\
  \ — 检索给定名称的值。\n* `key(index)` — 检索给定数字位置的名称。\n* `removeItem(name)` — 根据名称移除键值对。\n\
  * `setItem(name, value)` — 设置给定名称的值。\n\n`getItem()`、`removeItem()` 和 `setItem()`\
  \ 方法可以通过操作 `Storage` 对象直接或间接地进行调用。由于每个项目都作为属性存储在对象上，你可以简单地通过点表示法或括号表示法访问属性来读取值，通过相同方式设置值，或通过使用\
  \ `delete` 操作符将其移除。尽管如此，通常建议使用这些方法而不是属性访问，以确保你不会用一个键覆盖掉一个已有的对象成员。\n\n你可以通过 `length`\
  \ 属性来确定 `Storage` 对象中有多少个键值对。虽然无法确定对象中所有数据的大小，但 Internet Explorer 8 提供了一个 `remainingSpace`\
  \ 属性，用于检索以字节（bytes）为单位的仍可用存储空间量。\n\n![image](img/pen.gif)\n\n`Storage` 类型仅能够存储字符串。非字符串数据在存储之前会被转换为字符串。\n\
  \n## sessionStorage 对象\n\n`sessionStorage` 对象仅为单个会话存储数据，这意味着数据将一直存储到浏览器关闭。这等同于浏览器关闭时消失的会话\
  \ cookie。存储在 `sessionStorage` 上的数据在页面刷新后仍然存在，并且取决于浏览器供应商，在浏览器崩溃并重启后也可能可用。（Firefox\
  \ 和 WebKit 支持此，但 Internet Explorer 不。）\n\n由于 `sessionStorage` 对象与服务器会话绑定，因此在本地运行文件时它是不可用的。存储在\
  \ `sessionStorage` 上的数据仅从最初将数据放入该对象的页面访问，这使其对于多页应用程序的用途有限。\n\n由于 `sessionStorage`\
  \ 对象是 `Storage` 的实例，你可以通过 `setItem()` 或直接分配新属性向其分配数据。以下是使用这些方法的示例：\n\n![image](img/pen.gif)\n\
  \n```\n// 使用方法存储数据\nsessionStorage.setItem(\"name\", \"Nicholas\");\n\n// 使用属性存储数据\n\
  sessionStorage.book = \"Professional JavaScript\";\n```\n\n`SessionStorageExample01.htm`\n\
  \n写入存储器的行为存在浏览器差异。Firefox 和 WebKit 同步写入，因此添加到存储器的数据立即提交。Internet Explorer 实现为异步写入，因此在分配数据与写入磁盘之间可能存在延迟。对于少量数据，这种差异可以忽略不计。对于大量数据，你会发现\
  \ Internet Explorer 的执行速度比其他浏览器更快，因为它将实际的写入过程分到了后台。\n\n你可以通过在分配任何新数据之前使用 `begin()`\
  \ 方法，并在完成所有分配后使用 `commit()` 方法来强制 Internet Explorer 进行磁盘写入。考虑以下示例：\n\n```\n// 仅限\
  \ IE8\nsessionStorage.begin();\nsessionStorage.name = \"Nicholas\";\nsessionStorage.book\
  \ = \"Professional JavaScript\";\nsessionStorage.commit();\n```\n\n此代码确保在调用 `commit()`\
  \ 时写入 `\"name\"` 和 `\"book\"` 的值。调用 `begin()` 确保在代码执行时不发生磁盘写入。对于少量数据，这种过程并非必要；但对于文档等大量数据，你可能希望这种事务方法。\n\
  \n当数据存在 `sessionStorage` 时，可以使用 `getItem()` 或直接访问属性名称来检索。以下是使用这些方法的示例：\n\n```\n\
  // 使用方法获取数据\nvar name = sessionStorage.getItem(\"name\");\n\n// 使用属性获取数据\nvar book\
  \ = sessionStorage.book;\n```\n\n`SessionStorageExample01.htm`\n\n\n\n\n\n`sessionStorage`\
  \ 中的键值对可以通过以下顺序进行访问：首先通过 `key()` 获取指定位置的数据名称，然后使用该名称通过 `getItem()` 获取对应的值。\n\n也可以使用\
  \ `for-in` 循环遍历 `sessionStorage` 中的值：\n\n```\nfor (var key in sessionStorage){\n\
  \    var value = sessionStorage.getItem(key);\n    alert(key + \"=\" + value);\n\
  }\n```\n\n在每次循环中，`key` 都会被 `sessionStorage` 中的另一个名称填充；内置方法或 `length` 属性不会被包含在内。\n\
  \n若要从 `sessionStorage` 中删除数据，可以在对象属性上使用 `delete` 标识符，也可以使用 `removeItem()` 方法。以下是这两种方法的示例：\n\
  \n```\n//使用 delete 移除一个值 - 在 WebKit 中无效\ndelete sessionStorage.name;\n\n//使用方法移除一个值\n\
  sessionStorage.removeItem(\"book\");\n```\n\n`SessionStorageExample01.htm`\n\n值得注意的是，截至本文写作时，`delete`\
  \ 运算符不会在 WebKit 中删除数据，而 `removeItem()` 在所有支持的浏览器中都能正常工作。\n\n`sessionStorage` 对象应主要用于仅在当前会话中有效的小段数据。如果你需要跨会话持久化数据，那么\
  \ `globalStorage` 或 `localStorage` 更为合适。\n\n## globalStorage 对象\n\n`globalStorage`\
  \ 对象在 Firefox 2 中实现。作为原始 Web Storage 规范的一部分，它的目的是跨会话之间持久化数据，并带有特定的访问限制。为了使用 `globalStorage`，你需要指定数据可用的域名。这是通过使用方括号表示法的属性来实现的，如下例所示：\n\
  \n![image](img/logo1.gif)\n\n```\n//保存值\nglobalStorage[\"wrox.com\"].name = \"Nicholas\"\
  ;\n\n//获取值\nvar name = globalStorage[\"wrox.com\"].name;\n```\n\n`GlobalStorageExample01.htm`\n\
  \n在此处访问了域名 [wrox.com](http://wrox.com) 的存储区域。虽然 `globalStorage` 对象本身不是 `Storage`\
  \ 的实例，但 `globalStorage[\"wrox.com\"]` 规范是一个实例，并可以相应地使用。该存储区域可以从 [wrox.com](http://wrox.com)\
  \ 及所有子域名访问。你可以通过如下方式指定限制子域名：\n\n```\n//保存值\nglobalStorage[\"www.wrox.com\"].name\
  \ = \"Nicholas\";\n\n//获取值\nvar name = globalStorage[\"www.wrox.com\"].name;\n```\n\
  \n`GlobalStorageExample01.htm`\n\n此处指定的存储区域仅可以从 [www.wrox.com](http://www.wrox.com)\
  \ 页面访问，排除其他子域名。\n\n某些浏览器允许更通用的访问限制，例如仅受顶级域名（TLDs）限制，或允许全局访问，如下例所示：\n\n```\n//存储所有人都可以访问的数据\
  \ - 避免使用！\nglobalStorage[\"\"].name = \"Nicholas\";\n\n//存储仅对以 .net 结尾的域名可见的数据 -\
  \ 避免使用！\nglobalStorage[\"net\"].name = \"Nicholas\";\n```\n\n尽管这些功能被支持，但建议避免使用通用访问的数据存储，以防止潜在的安全问题。由于可能存在安全考虑，这种能力在未来可能会被移除或受到严重限制，因此应用程序不应依赖此类功能。使用\
  \ `globalStorage` 时请务必指定域名。\n\n对 `globalStorage` 区域的访问受发起请求页面的域名、协议和端口限制。例如，如果使用\
  \ HTTPS 协议为 [wrox.com](http://wrox.com) 存储数据，则通过 HTTP 访问的 [wrox.com](http://wrox.com)\
  \ 页面无法访问该信息。同样，通过端口 `80` 访问的页面无法与相同域名、相同协议但在端口 `8080` 上访问的页面共享数据。这与 `Ajax` 请求的同源策略相似。\n\
  \n`globalStorage` 的每个属性都是 `Storage` 的实例。因此，它可以像示例那样使用：\n\n![image](img/logo1.gif)\n\
  \n```\nglobalStorage[\"www.wrox.com\"].name = \"Nicholas\";\nglobalStorage[\"www.wrox.com\"\
  ].book = \"Professional JavaScript\";\n\nglobalStorage[\"www.wrox.com\"].removeItem(\"\
  name\");\n\nvar book = globalStorage[\"www.wrox.com\"].getItem(\"book\");\n```\n\
  \n`GlobalStorageExample01.htm`\n\n如果你事先不确定要使用的域名，使用 `location.host` 作为属性名可能更安全。例如：\n\
  \n```\nglobalStorage[location.host].name = \"Nicholas\";\nvar book = globalStorage[location.host].getItem(\"\
  book\");\n```\n\n`GlobalStorageExample01.htm`\n\n存储在 `globalStorage` 属性中的数据保留在磁盘上，直到通过\
  \ `removeItem()` 或 `delete` 删除，或者用户清除浏览器缓存。这使得 `globalStorage` 成为存储客户端文档或持久化用户设置的理想选择。\n\
  \n## localStorage 对象\n\n在修订后的 HTML5 规范中，`localStorage` 对象取代了存储持久化客户端数据的方法。与 `globalStorage`\
  \ 不同，你无法在 `localStorage` 上指定任何访问规则；规则已经设定。为了访问同一个 `localStorage` 对象，页面必须来自相同的域名（子域名无效）、使用相同的协议并在相同的端口。这在效果上等同于\
  \ `globalStorage[location.host]`。\n\n由于 `localStorage` 是 `Storage` 的实例，它可以像 `sessionStorage`\
  \ 一样被使用。以下是一些示例：\n\n```\n//使用方法存储数据\nlocalStorage.setItem(\"name\", \"Nicholas\"\
  );\n\n//使用属性存储数据\nlocalStorage.book = \"Professional JavaScript\";\n\n//使用方法获取数据\n\
  var name = localStorage.getItem(\"name\");\n\n//使用属性获取数据\nvar book = localStorage.book;\n\
  ```\n\n`LocalStorageExample01.htm`\n\n存储在 `localStorage` 中的数据遵循与存储在 `globalStorage`\
  \ 中数据相同的规则，因为数据会持久化，直到通过 JavaScript 特别删除或用户清除浏览器缓存。\n\n为了兼容仅支持 `globalStorage` 的浏览器，可以使用以下函数：\n\
  \n![image](img/logo1.gif)\n\n```\nfunction getLocalStorage(){\n    if (typeof localStorage\
  \ == \"object\"){\n        return localStorage;\n    } else if (typeof globalStorage\
  \ == \"object\"){\n        return globalStorage[location.host];\n    } else {\n\
  \        throw new Error(\"Local storage not available.\");\n    }\n}\n```\n\n`GlobalAndLocalStorage01.htm`\n\
  \n然后，对函数进行初始调用即可确定正确的位置：\n\n```\nvar storage = getLocalStorage();\n```\n\n`GlobalAndLocalStorage01.htm`\n\
  \n在确定使用哪个 Storage 对象后，你可以在所有支持 Web Storage 的浏览器中轻松地存储和检索数据。\n\n## storage 事件\n\n\
  每当 `Storage` 对象发生变化时，文档上都会触发 `storage` 事件。这发生在每次使用属性或 `setItem()` 设置值、每次使用 `delete`\
  \ 或 `removeItem()` 值以及每次调用 `clear()` 时。事件对象具有以下四个属性：\n\n*   `domain` — 存储发生变化的域名。\n\
  *   `key` — 被设置或移除的键。\n*   `newValue` — 键设置的新值，如果键被移除则为 `null`。\n*   `oldValue`\
  \ — 改变之前的值。\n\n在这四个属性中，Internet Explorer 8 和 Firefox 仅实现了 `domain` 属性。截至本文写作日期，WebKit\
  \ 不支持 storage 事件。\n\n可以使用以下代码监听 storage 事件：\n\n![image](img/logo1.gif)\n\n```\n\
  EventUtil.addHandler(document, \"storage\", function(event){\n    alert(\"Storage\
  \ changed for \" + event.domain);\n});\n```\n\n`StorageEventExample01.htm`\n\n`storage`\
  \ 事件在 `sessionStorage` 和 `localStorage` 发生变化时都会触发，但不会区分它们。\n\n\n\n\n与其他客户端数据存储解决方案一样，Web\
  \ Storage 也有其局限性。这些局限性取决于浏览器。通常情况下，客户端数据的大小限制是基于每个源（协议、域名和端口）设置的，因此每个源都有固定的空间来存储其数据。通过分析存储数据的页面的源来强制执行这一限制。\n\
  \n大多数桌面浏览器对 `localStorage` 的每个源限制为 5MB。`Chrome` 和 `Safari` 的每个源限制为 2.5MB。iOS 版 `Safari`\
  \ 和 Android 版 `WebKit` 也有 2.5MB 的限制。\n\n`sessionStorage` 的限制在不同浏览器之间有所异。许多浏览器对 `sessionStorage`\
  \ 数据没有限制，而 `Chrome`、`Safari`、iOS 版 `Safari` 和 Android 版 `WebKit` 的限制为 2.5MB。`Internet\
  \ Explorer 8+` 和 `Opera` 的 `sessionStorage` 限制为 5MB。\n\n有关关于 Web Storage 限制的更多信息，请参阅\
  \ [Web Storage 支持测试 (http://dev-test.nemikor.com/web-storage/support-test/)](http://dev-test.nemikor.com/web-storage/support-test/)。\n\
  \n# IndexedDB\n\nIndexed Database API，简称 `IndexedDB`，是浏览器中的一种结构化数据存储。`IndexedDB`\
  \ 的出现是现在已弃用的 Web SQL Database API 的替代方案（由于其已废弃，本书未涵盖该内容）。`IndexedDB` 的设计理念是创建一个\
  \ API，使其能够方便地存储和检索 JavaScript 对象，同时允许查询和搜索。\n\n`IndexedDB` 设计为几乎完全异步。因此，大多数操作都是作为请求执行的，这些请求将稍后执行并产生成功的结果或错误。几乎每个\
  \ `IndexedDB` 操作都需要你附加 `onerror` 和 `onssuccess` 事件处理器来确定结果。\n\n一旦完全支持，将有一个全局的 `indexedDB`\
  \ 对象作为 API 宿主。由于 API 仍在变动中，浏览器使用了厂商前缀，因此在 `Internet Explorer 10` 中对象被称为 `msIndexedDB`，在\
  \ `Firefox 4` 中被称为 `mozIndexedDB`，在 `Chrome` 中被称为 `webkitIndexedDB`。为了清晰起见，本节示例中使用\
  \ `indexedDB`，因此你可能需要在每个示例之前包含以下代码：\n\n```\nvar indexedDB = window.indexedDB ||\
  \ window.msIndexedDB || window.mozIndexedDB || window.webkitIndexedDB;\n```\n\n\
  ### IndexedDBExample01.htm\n\n## 数据库\n\n`IndexedDB` 是一种类似于你以前可能用过的数据库，如 `MySQL`\
  \ 或 `Web SQL Database`。主要的区别在于 `IndexedDB` 使用对象存储（object stores）而不是表格（tables）来跟踪数据。一个\
  \ `IndexedDB` 数据库仅仅是分组在共同名称下的对象存储集合。\n\n使用数据库的第一步是使用 `indexedDB.open()` 打开它，并传入要打开的数据库名称。如果已存在名为名的数据库，则会发送请求打开它；如果数据库不存在，则会发送请求创建并打开它。`indexDB.open()`\
  \ 的调用返回一个 `IDBRequest` 实例，你可以在上面附加 `onerror` 和 `onssuccess` 事件处理器。这里有一个示例：\n\n![image](img/logo1.gif)\n\
  \n```\nvar request, database;\n\nrequest = indexedDB.open(\"admin\");\nrequest.onerror\
  \ = function(event){\n    alert(\"尝试打开时发生了错误：\" + \n          event.target.errorCode);\n\
  };\nrequest.onsuccess = function(event){\n    database = event.target.result;\n\
  };\n```\n\nIndexedDBExample01.htm\n\n在两个事件处理器中，`event.target` 都指向 `request`，因此它们可以互换使用。如果调用了\
  \ `onssuccess` 事件处理器，则数据库实例对象（`IDBDatabase`）可以在 `event.target.result` 中可用并存储在 `database`\
  \ 变量中。从现在开始，所有对数据库的操作请求都通过 `database` 对象本身进行。如果发生错误，存储在 `event.target.errorCode`\
  \ 中的错误代码将指示问题的性质，其如下所示（这些错误代码适用于所有操作）：\n\n* `IDBDatabaseException.UNKNOWN_ERR (1)`\
  \ — 错误是意外的，且不属于任何可用类别。\n* `IDBDatabaseException.NON_TRANSIENT_ERR (2)` — 不允许该操作。\n\
  * `IDBDatabaseException.NOT_FOUND_ERR (3)` — 未找到要执行操作的数据库。\n* `IDBDatabaseException.CONSTRAINT_ERR\
  \ (4)` — 违反了数据库约束。\n* `IDBDatabaseException.DATA_ERR (5)` — 为事务提供的数据不满足要求。\n* `IDBDatabaseException.NOT_ALLOWED_ERR\
  \ (6)` — 不允许该操作。\n* `IDBDatabaseException.TRANSACTION_INACTIVE_ERR (7)` — 尝试重用已完成的事务。\n\
  * `IDBDatabaseException.ABORT_ERR (8)` — 请求已中止，未成功。\n* `IDBDatabaseException.READ_ONLY_ERR\
  \ (9)` — 在只读模式下尝试写入或更改数据。\n* `IDBDatabaseException.TIMEOUT_ERR (10)` — 操作无法在可用时间内完成。\n\
  * `IDBDatabaseException.QUOTA_ERR (11)` — 剩余磁盘空间不足。\n\n在默认情况下，数据库没有关联的版本，因此在开始时设置初始版本是一个好主意。要这样做，调用\
  \ `setVersion()` 方法并将版本作为字符串传入。再次，这会创建一个请求对象，你需要在其上分配事件处理器：\n\n![image](img/logo1.gif)\n\
  \n```\nif (database.version != \"1.0\"){\n    request = database.setVersion(\"1.0\"\
  );\n    request.onerror = function(event){\n        alert(\"尝试设置版本时发生了错误：\" + \n\
  \              event.target.errorCode);\n    };\n    request.onsuccess = function(event){\n\
  \        alert(\"数据库初始化完成。\");\n    };\n} else {\n    alert(\"数据库已初始化。\");\n}\n\
  ```\n\nIndexedDBExample01.htm\n\n此示例尝试设置数据库。\n\n## 对象存储\n\n一旦建立了数据库连接，下一步是与对象存储交互。如果数据库版本与你预期的不符，你可能需要创建一个对象存储。然而，在创建对象存储之前，考虑你想存储的数据类型是非常重要的。\n\
  \n假设你想存储包含用户名、密码等的用户记录。存储单个记录的对象可能如下：\n\n```\nvar user = {\n    username: \"007\"\
  ,\n    firstName: \"James\",\n    lastName: \"Bond\",\n    password: \"foo\"\n};\n\
  ```\n\n观察此对象，你可以很容易地看到该对象存储的合适键是 `username` 属性。用户名必须是全局唯一的，而且它可能是你经常访问数据的方式。这很重要，因为在创建对象存储时必须指定键。以下是为这些用户创建对象存储的方法：\n\
  \n```\nvar store = db.createObjectStore(\"users\", { keyPath: \"username\" });\n\
  ```\n\nIndexedDBExample02.htm\n\n第二个参数的 `keyPath` 属性指明了应作为键的存储对象的属性名称。\n\n\n\n由于你现在已经有了对象存储（object\
  \ store）的引用，现在可以使用 `add()` 或 `put()` 向其填充数据。这两个方法都接受一个单一参数，即要存储的对象，并将该对象保存到对象存储中。这两种方法之间的区别仅出现在对象存储中已存在具有相同键的对象时。在这种情况下，`add()`\
  \ 会导致一个错误，而 `put()` 则会简单地覆盖该对象。更简单地说，将 `add()` 用于插入新值，而将 `put()` 用于更新值。因此，为了首次初始化对象存储，你可能想执行类似下面的操作：\n\
  \n![image](img/logo1.gif)\n\n```javascript\n//其中 users 是一个新用户数组\nvar i=0,\n    len\
  \ = users.length;\n\nwhile(i < len){\n    store.add(users[i++]);\n}\n```\n\nIndexedDBExample02.htm\n\
  \n每次调用 `add()` 或 `put()` 都会为对象存储创建一个新的更新请求。如果你想验证请求是否成功完成，可以将请求对象存储在变量中，并分配 `onerror`\
  \ 和 `onsuccess` 事件处理器：\n\n```javascript\n//其中 users 是一个新用户数组\nvar i=0,\n    request,\n\
  \    requests = [],\n    len = users.length;\n\nwhile(i < len){\n    request = store.add(users[i++]);\n\
  \    request.onerror = function(){\n        //处理错误\n    };\n    request.onsuccess\
  \ = function(){\n        //处理成功\n    };\n    requests.push(request);\n}\n```\n\n\
  一旦创建了对象存储并填充了数据，就可以开始查询了。\n\n## 事务 (Transactions)\n\n在对象存储的创建步骤之后，所有后续操作都通过事务完成。事务使用数据库对象上的\
  \ `transaction()` 方法创建。每当你读取或更改数据时，都会使用事务将所有更改组合在一起。在最简单的形式中，你如下创建一个新事务：\n\n```javascript\n\
  var transaction = db.transaction();\n```\n\n如果不指定任何参数，你对数据库中的所有对象存储具有只读访问权限。为了优化，你可以指定想要访问的一个或多个对象存储名称：\n\
  \n```javascript\nvar transaction = db.transaction(\"users\");\n```\n\n这确保了在事务期间只加载有关用户对象存储的信息。如果你需要访问多个对象存储，第一个参数也可以是字符串数组：\n\
  \n```javascript\nvar transaction = db.transaction([\"users\", \"anotherStore\"]);\n\
  ```\n\n如之前所述，这些事务中的每一个都以只读方式访问数据。要更改这一点，你必须传递第二个参数来指示访问模式。这些常量可以在 `IDBTransaction`\
  \ 上访问，分别为 `READ_ONLY` (0)、`READ_WRITE` (1) 和 `VERSION_CHANGE` (2)。虽然 Internet Explorer\
  \ 10+ 和 Firefox 4+ 实现了 `IDBTransaction`，但 Chrome 通过 `webkitIDBTransaction` 支持它，因此需要以下代码来规范化接口：\n\
  \n![image](img/logo1.gif)\n\n```javascript\nvar IDBTransaction = window.IDBTransaction\
  \ || window.webkitIDBTransaction;\n```\n\nIndexedDBExample03.htm\n\n在完成该设置后，你可以指定\
  \ `transaction()` 的第二个参数：\n\n```javascript\nvar transaction = db.transaction(\"\
  users\", IDBTransaction.READ_WRITE);\n```\n\nIndexedDBExample03.htm\n\n此事务能够对用户对象存储进行读取和写入。\n\
  \n一旦你获得了事务的引用，就可以使用 `objectStore()` 方法并传入你想要操作的存储名称来访问特定的对象存储。然后你可以像以前一样使用 `add()`\
  \ 和 `put()`，以及使用 `get()` 获取值、使用 `delete()` 对象以及 `clear()` 移除所有对象。`get()` 和 `delete()`\
  \ 方法均接受一个对象键作为参数，并且这五个方法中的每一个都会创建一个新的请求对象。例如：\n\n![image](img/logo1.gif)\n\n```javascript\n\
  var request = db.transaction(\"users\").objectStore(\"users\").get(\"007\");\nrequest.onerror\
  \ = function(event){\n    alert(\"未获取到对象!\");\n};\nrequest.onsuccess = function(event){\n\
  \    var result = event.target.result;\n    alert(result.firstName);    //\"James\"\
  \n};\n```\n\nIndexedDBExample02.htm\n\n由于任何数量的请求都可以作为单个事务的一部分完成，事务对象本身也有事件处理器：`onerror`\
  \ 和 `oncomplete`。这些被用于提供事务级别的状态信息：\n\n```javascript\ntransaction.onerror = function(event){\n\
  \    //整个事务被取消了\n};\n\ntransaction.oncomplete = function(event){\n    //整个事务成功完成\n\
  };\n```\n\n请记住，`oncomplete` 的事件对象不会让你访问 `get()` 请求返回的任何数据，因此你仍然需要为这些请求准备 `onsuccess`\
  \ 事件处理器。\n\n## 使用游标查询 (Querying with Cursors)\n\n事务可以直接检索已知键的单个项目。当你想要检索多个项目时，需要在事务内部创建一个游标。游标是结果集中的指针。与传统的数据库查询不同，游标不会预先收集所有的结果集。相反，游标指向第一个结果，在接到指令之前它不会尝试寻找下一个。\n\
  \n游标使用对象存储上的 `openCursor()` 方法创建。与 IndexedDB 的其他操作一样，`openCursor()` 的返回值是一个请求，因此你必须分配\
  \ `onsuccess` 和 `onerror` 事件处理器。例如：\n\n```javascript\nvar store = db.transaction(\"\
  users\").objectStore(\"users\"),\n    request = store.openCursor();\n\nrequest.onsuccess\
  \ = function(event){\n    //处理成功\n};\n\nrequest.onfailure = function(event){\n \
  \   //处理失败\n};\n```\n\nIndexedDBExample04.htm\n\n当 `onsuccess` 事件处理器被调用时，对象存储中的下一个项目可以通过\
  \ `event.target.result` ，它持有一个 `IDBCursor`。`IDBCursor` 实例有几个属性：\n\n- `direction`:\
  \ 指游标移动方向的数值。默认是 `IDBCursor.NEXT` (0) 表示下一个。其他值包括 `IDBCursor.NEXT_NO_DUPLICATE`\
  \ (1) 表示不重复的下一个、IDBCursor.PREV` (2) 表示上一个、IDBCursor.PREV_NO_DUPLICATE` (3) 表示不重复的上一个。\n\
  - `key`: 对象的键。\n- `value`: 实际的对象。\n- `primaryKey`: 游标使用的键。可以是键或索引键（稍后讨论）。\n\n可以使用以下代码获取单个结果的信息：\n\
  \n```javascript\nrequest.onsuccess = function(event){\n    var cursor = event.target.result;\n\
  \    if (cursor){  //始终检查\n        console.log(\"Key: \" + cursor.key + \", Value:\
  \ \" + \n                    JSON.stringify(cursor.value));\n    }\n};\n```\n\n\
  请记住，此示例中的 `cursor.value` 是一个对象，因此在显示之前对其进行了 JSON 编码。\n\n游标可用于更新单个记录。`update()` 方法使用指定的对象更新当前游标值。与此类此类操作一样，调用\
  \ `update()` 会创建一个新的请求，因此如果你想知道结果，就需要分配 `onsuccess` 和 `onerror`：\n\n```javascript\n\
  request.onsuccess = function(event){\n    var cursor = event.target.result,\n  \
  \      value,\n        updateRequest;\n\n    if (cursor){   //始终检查\n        if (cursor.key\
  \ == \"foo\"){\n            value = cursor.value;                   //获取当前值\n  \
  \          value.password = \"magic!\";              //更新密码\n\n            updateRequest\
  \ = cursor.update(value);   //请求保存更新\n            updateRequest.onsuccess = function(){\n\
  \                //处理成功\n            };\n            updateRequest.onfailure = function(){\n\
  \                //处理失败\n            };\n        }\n    }\n};\n```\n\n你也可以通过调用 `delete()`\
  \ 删除该位置的项目。与 `update()` 一样，这也会创建一个请求：\n\n\n\n\n\n```javascript\nrequest.onsuccess\
  \ = function(event){\n    var cursor = event.target.result,\n        value,\n  \
  \      deleteRequest;\n\n    if (cursor){   //always check\n        if (cursor.key\
  \ == \"foo\"){\n            deleteRequest = cursor.delete();       //request the\
  \ value be deleted\n            deleteRequest.onsuccess = function(){\n        \
  \        //handle success;\n            };\n            deleteRequest.onfailure\
  \ = function(){\n                //handle failure\n            };\n        }\n \
  \   }\n};\n```\n\n如果事务没有修改对象 store 的权限，`update()` 和 `delete()` 都会抛出错误。\n\n默认情况下，每个游标只发送一个请求。要发送另一个请求，你必须调用以下方法之一：\n\
  \n* `continue(key)` — 移动到结果集中的下一个项目。参数 `key` 是可选的。如果不指定，游标将仅移动到下一个项目；如果提供，游标将移动到指定的\
  \ `key`。\n\n* `advance(count)` — 将游标向后移动 `count` 个项目。\n\n这些方法中的每一个都会使游标重用同一个请求，因此在不再需要之前，会重用相同的\
  \ `onsuccess` 和 `onfailure` 事件处理器。例如，以下代码遍历了对象 store 中的所有项目：\n\n```javascript\n\
  request.onsuccess = function(event){\n    var cursor = event.target.result;\n  \
  \  if (cursor){  //always check\n        console.log(\"Key: \" + cursor.key + \"\
  , Value: \" + \n                    JSON.stringify(cursor.value));\n        cursor.continue();\
  \   //go to the next one\n    } else {\n        console.log(\"Done!\");\n    }\n\
  };\n```\n\n对 `continue()` 的调用会触发另一个请求并再次调用 `onsuccess`。当没有更多项目可以遍历时，`onsuccess`\
  \ 将最后调用一次，此时 `event.target.result` 等于 `null`。\n\n# 键范围 (Key Ranges)\n\n使用游标看起来并不是最优的，因为你检索数据的方式受到了限制。键范围（Key\
  \ ranges）用于使游标的操作更易管理。键范围由 `IDBKeyRange` 的实例表示。标准版本是 `IDBKeyRange`，它被 Internet Explorer\
  \ 10+ 和 Firefox 4+ 支持，而 Chrome 则通过 `webkitIDBKeyRange` 支持这种类型。与 IndexedDB 相关的其他类型一样，你首先需要创建一个本地副本，并考虑这些差异：\n\
  \n```javascript\nvar IDBKeyRange = window.IDBKeyRange || window.webkitIDBKeyRange;\n\
  ```\n\n指定键范围有四种方法。第一种是使用 `only()` 方法并传入你想要检索的键：\n\n```javascript\nvar onlyRange\
  \  = IDBKeyRange.only(\"007\");\n```\n\n此范围确保了只有键为 `\"007\"` 的值会被检索。使用此范围创建的游标类似于直接访问对象\
  \ store 并调用 `get(\"007\")`。\n\n第二种类型的范围为结果集定义了下界。下界指示了游标应该开始开始的项目。例如，以下键范围确保游标从键\
  \ `\"007\"` 开始并持续到结束：\n\n```javascript\n//start at item \"007\", go to the end\n\
  var lowerRange  = IDBKeyRange.lowerBound(\"007\");\n```\n\n如果你想从 `\"007\"` 值之后的紧邻项目开始，可以传递第二个参数\
  \ `true`：\n\n```javascript\n//start at item after \"007\", go to the end\nvar lowerRange\
  \  = IDBKeyRange.lowerBound(\"007\", true);\n```\n\n第三种类型的范围是上界，使用 `upperBound()`\
  \ 方法指示你不想越过的键。以下键范围确保游标从开始处运行，并在到达键为 `\"ace\"` 的值时停止：\n\n```javascript\n//start\
  \ at beginning, go to \"ace\"\nvar upperRange  = IDBKeyRange.upperBound(\"ace\"\
  );\n```\n\n如果你不想包含给定的键，则在第二个参数中传递 `true`：\n\n```javascript\n//start at beginning,\
  \ go to the item just before \"ace\"\nvar upperRange  = IDBKeyRange.upperBound(\"\
  ace\", true);\n```\n\n要同时指定下界和上界，请使用 `bound()` 方法。该方法接受四个参数：下界键、上界键、一个指示跳过下界的可选布尔值，以及一个指示跳过上界的可选布尔值。以下是一些示例：\n\
  \n```javascript\n//start at \"007\", go to \"ace\"\nvar boundRange  = IDBKeyRange.bound(\"\
  007\", \"ace\");\n\n//start at item after \"007\", go to \"ace\"\nvar boundRange\
  \  = IDBKeyRange.bound(\"007\", \"ace\", true);\n\n//start at item after \"007\"\
  , to before before \"ace\"\nvar boundRange  = IDBKeyRange.bound(\"007\", \"ace\"\
  , true, true);\n\n//start at \"007\", go to item before \"ace\"\nvar boundRange\
  \  = IDBKeyRange.bound(\"007\", \"ace\", false, true);\n```\n\n一旦你定义了范围，将其传递 `openCursor()`\
  \ 方法，你就会创建一个保持在约束范围内的游标：\n\n```javascript\nvar store = db.transaction(\"users\"\
  ).objectStore(\"users\"),\n    range = IDBKeyRange.bound(\"007\", \"ace\");\n  \
  \  request = store.openCursor(range);\n\nrequest.onsuccess = function(event){\n\
  \    var cursor = event.target.result;\n    if (cursor){  //always check\n     \
  \   console.log(\"Key: \" + cursor.key + \", Value: \" + \n                    JSON.stringify(cursor.value));\n\
  \        cursor.continue();\n    } else {\n        console.log(\"Done!\");\n   \
  \ }\n};\n```\n\n# 设置游标方向 (Setting Cursor Direction)\n\n`openCursor()` 实际上有两个参数。第一个是\
  \ `IDBKeyRange` 的实例，第二个是指示方向的数值值。这些常量在查询部分讨论过，通过 `IDBCursor` 指定。Firefox 4+ 和 Chrome\
  \ 再次具有不同的实现，因此第一步是规范化这些差异：\n\n通常，游标从对象 store 的第一个项目开始，并在每次调用 `continue()` 时向最后一个项目移动。这些游标的默认方向是\
  \ `NEXT`。如果对象 store 中有重复项，你可能希望游标能跳过重复项。你可以通过向 `openCursor()` 传递 `NEXT_DUPLICATE`来实现：\n\
  \n```javascript\nvar store = db.transaction(\"users\").objectStore(\"users\"),\n\
  \    request = store.openCursor(null, NEXT_DUPLICATE);\n```\n\n注意 `openCursor()`\
  \ 的第一个参数是 `null`，表示使用所有值的默认键范围。该游标将从第一个项目开始向最后一个项目遍历对象 store，同时跳过任何重复项。\n\n你也可以创建一个反向遍历对象\
  \ store 的游标，从最后一个项目开始向第一个项目移动，只需传递 `PREV` 或 `PREV_DUPLICATE`（当然后者是为了避免重复项）。例如：\n\
  \n![image](img/logo1.gif)\n\n```javascript\nvar store = db.transaction(\"users\"\
  ).objectStore(\"users\"),\n    request = store.openCursor(null, PREV);\n```\n\n\
  当你使用 `PREV` 或 `PREV_DUPLICATE` 打开游标时，每次调用 `continue()` 或 `advance()` 都会让游标反向遍历对象\
  \ store。\n\n# 索引 (Indexes)\n\n对于某些数据集，你可能希望为对象 store 指定多个键。例如，如果你通过用户 ID 和用户名来跟踪用户，你可能希望使用这些数据中的任何一个进行访问。为此，你可能会将用户\
  \ ID 作为主键，并在用户名上创建索引。\n\n要创建新索引，首先获取对象 store 的引用，然后调用 `createIndex()`，如示例所示：\n\n\
  ```javascript\nvar store = db.transaction(\"users\").objectStore(\"users\"),\n \
  \   index = store.createIndex(\"username\", \"username\", { unique: true });\n```\n\
  \n\n\n\n`createIndex()` 的第一个参数是索引的名称，第二个参数是要索引的属性名称，第三个参数是一个包含 `unique` 键的选项对象。应该始终指定此选项，用以指示该键在所有记录中是否唯一。由于\
  \ `username` 可能不会重复，因此此索引不是唯一的。\n\n`createIndex()` 的返回值是 `IDBIndex` 实例。你也可以通过对象存储上的\
  \ `index()` 方法获取同一个实例。例如，要使用一个已经存在的名为 `\"username\"` 的索引，代码如下：\n\n```javascript\n\
  var store = db.transaction(\"users\").objectStore(\"users\"),\n    index = store.index(\"\
  username\");\n```\n\n索引的作用非常像对象存储。你可以使用 `openCursor()` 方法在索引上创建新的游标，该方法工作方式与在对象存储上使用\
  \ `openCursor()` 完全相同，不同在于 `result.key` 属性填充的是索引键而不是主键。这里有一个示例：\n\n```javascript\n\
  var store = db.transaction(\"users\").objectStore(\"users\"),\n    index = store.index(\"\
  username\"),\n    request = index.openCursor();\n\nrequest.onsuccess = function(event){\n\
  \    //处理成功回调\n};\n```\n\n索引还可以通过 `openKeyCursor()` 方法创建一个特殊的游标，它仅返回每条记录的主键，该方法接受与\
  \ `openCursor()` 相同的参数。主要的区别在于 `event.result.key` 是索引键，而 `event.result.value` 是主键而不是整条记录。\n\
  \n```javascript\nvar store = db.transaction(\"users\").objectStore(\"users\"),\n\
  \    index = store.index(\"username\"),\n    request = index.openKeyCursor();\n\n\
  request.onsuccess = function(event){\n    //处理成功回调\n    //event.result.key 是索引键，event.result.value\
  \ 是主键\n};\n```\n\n你还可以通过使用 `get()` 并传递索引键从索引中检索单个值，这会创建一个新的请求：\n\n```javascript\n\
  var store = db.transaction(\"users\").objectStore(\"users\"),\n    index = store.index(\"\
  username\"),\n    request = index.get(\"007\");\n\nrequest.onsuccess = function(event){\n\
  \    //处理成功回调\n};\n\nrequest.onfailure = function(event){\n    //处理失败回调\n};\n```\n\
  \n要仅检索给定索引键的主键，请使用 `getKey()` 方法。这也会创建一个新的请求，但 `result.value` 等于主键值而不是整条记录：\n\n\
  ```javascript\nvar store = db.transaction(\"users\").objectStore(\"users\"),\n \
  \   index = store.index(\"username\"),\n    request = index.getKey(\"007\");\n\n\
  request.onsuccess = function(event){\n    //处理成功回调\n    //event.result.key 是索引键，event.result.value\
  \ 是主键\n};\n```\n\n在此示例的 `onssuccess` 事件处理器中，`event.result.value` 将是用户 ID。\n\n在任何时刻，你都可以通过\
  \ `IDBIndex` 对象的属性来获取有关索引的信息：\n\n*   `name` — 索引的名称。\n*   `keyPath` — 传递给 `createIndex()`\
  \ 的属性路径。\n*   `objectStore` — 该索引作用的对象存储。\n*   `unique` — 一个布尔值，指示索引键是否唯一。\n\n对象存储本身还通过\
  \ `indexNames` 属性按名称跟踪索引。这使得通过以下代码轻松判断对象上已经存在哪些索引变得简单：\n\n```javascript\nvar store\
  \ = db.transaction(\"users\").objectStore(\"users\"),\n    indexNames = store.indexNames,\n\
  \    index,\n    i = 0,\n    len = indexNames.length;\n\nwhile(i < len){\n    index\
  \ = store.index(indexNames[i++]);\n    console.log(\"Index name: \" + index.name\
  \ + \", KeyPath: \" + index.keyPath + \n        \", Unique: \" + index.unique);\n\
  }\n```\n\n此代码遍历每个索引并将其信息输出到控制台。\n\n可以通过调用对象存储上的 `deleteIndex()` 方法并传递索引名称来删除索引：\n\
  \n```javascript\nvar store = db.transaction(\"users\").objectStore(\"users\");\n\
  store.deleteIndex(\"username\");\n```\n\n由于删除索引不会触及对象存储中的数据，该操作会在没有任何回调的情况下发生。\n\
  \n### 并发问题\n\n虽然 IndexedDB 是网页内部的异步 API，但仍然存在并发问题。如果同一个网页同时在两个不同的浏览器标签页中打开，可能会导致其中一个在另一个准备好之前尝试升级数据库。出现问题的操作是将数据库设置为新版本，因此\
  \ `setVersion()` 的调用只有当浏览器中只有一个标签页正在使用该数据库时才能完成。\n\n当你首次打开数据库时，分配一个 `onversionchange`\
  \ 事件处理器是非常重要的。当同一源的另一个标签页调用 `setVersion()` 时，会执行此回调。对此事件的最佳响应是立即关闭数据库，以便能够完成版本升级。例如：\n\
  \n```javascript\nvar request, database;\n\nrequest = indexedDB.open(\"admin\");\n\
  request.onsuccess = function(event){\n    database = event.target.result;\n\n  \
  \  database.onversionchange = function(){\n        database.close();\n    };\n};\n\
  ```\n\n你应该在成功打开数据库后分配 `onversionchange` 事件处理器。\n\n当你调用 `setVersion()` 时，为请求分配 `onblocked`\
  \ 事件处理器也很重要的。当另一个标签页打开数据库时，该事件处理器将执行。在这种情况下，你可能需要通知用户关闭标签后再重试。例如：\n\n```javascript\n\
  var request = database.setVersion(\"2.0\");\nrequest.onblocked = function(){\n \
  \   alert(\"请关闭其他标签页\");\n};\n\nrequest.onsuccess = function(){\n    //处理成功回调\n\
  };\n```\n\n记住，`onversionchange` 在其他标签页中也会被调用。\n\n### 限制与约束\n\nIndexedDB 的许多限制与 Web\
  \ Storage 完全相同。首先，IndexedDB 数据库绑定到页面的源（协议、域名和端口），因此信息无法跨域共享。\n\n其次，每个源存储的数据量存在限制。Firefox\
  \ 4+ 的限制是每个源 50MB，而 Chrome 的限制为 5MB。移动版 Firefox 的限制为 5MB，如果超过容量将请求用户许可存储更多。\n\n\
  Firefox 实施了额外的限制，即本地文件无法访问 IndexedDB 数据库。Chrome 没有此限制。在本地运行本书中的示例时，请确保使用 Chrome。\n\
  \n# 总结\n\n离线 Web 应用程序和客户端数据存储是 Web 未来的重要部分。浏览器现在能够检测用户何时离线并触发 JavaScript 事件，以便你的应用程序做出响应。应用程序缓存允许你指定哪些文件应该离线。可以使用一个\
  \ JavaScript API 来确定应用程序缓存的状态以及可能发生的变化。\n\n本章还涵盖了客户端存储的以下方面：\n\n*   传统上，这种存储局限于使用\
  \ Cookie，即可以从客户端或服务器设置的小型信息，并随每次请求传输。\n*   JavaScript 通过 `document.cookie` 访问 Cookie。\n\
  *   对 Cookie 的限制使其它们适用于存储小量数据，但对于存储大量数据来说效率低下。\n\nInternet Explorer 提供了一种名为用户数据的行为，可以如下方式应用于页面上的元素：\n\
  \n*   一旦应用，元素就可以从命名的数据存储中加载数据，并通过 `getAttribute()`、`setAttribute()` 和 `removeAttribute()`\
  \ 方法访问这些信息。\n\n\n\n\n*   数据必须使用 `save()` 方法明确保存到命名的数据存储中，才能在会话之间持久化。\n\nWeb Storage\
  \ 定义了两个对象来保存数据：`sessionStorage` 和 `localStorage`。前者专门用于在浏览器会话内保存数据，因为一旦关闭浏览器，数据就会删除。后者则用于跨会话持久化数据，并基于跨域安全策略。\n\
  \n`IndexedDB` 是一种结构化数据存储机制，类似于 SQL 数据库。它不是数据存储在表中，而是存储在对象存储（object stores）中。对象存储通过定义键并添加数据来创建。使用光标（Cursors）来查询对象存储中的特定数据，并可以为特定属性创建索引以便更快速查找。\n\
  \n有了所有这些选项，可以使用 JavaScript 在客户端机器上存储大量数据。你应该谨慎，不要存储敏感信息，因为数据缓存是不经过加密的。\n\n# 第 24\
  \ 章：最佳实践\n\n## 本章内容概览\n\n* 编写可维护的代码\n* 确保代码性能\n* 将代码部署到生产环境\n\n自 2000 年以来，Web 开发领域以惊人的速度增长。曾经那个几乎任何做法都可以接受的“虚拟荒西部”，已经演变成一门拥有研究和既定最佳实践的完整学科。随着简单的网站成长为复杂的\
  \ Web 应用程序，Web 爱好者变成了有薪的专业人士，Web 开发世界充满了关于最新技术和开发方法的信息。特别是 JavaScript，它是许多研究和推测的受益者。JavaScript\
  \ 的最佳实践分为几类，并并在开发过程的不同阶段进行处理。\n\n## 可维护性\n\n在早期的网站中，JavaScript 主要用于小型特效或表单验证。如今的\
  \ Web 应用程序充满了成千万行的 JavaScript 代码，执行着各种复杂的进程。这种演变要求开发者考虑可维护性。与传统学科的软件工程师一样，JavaScript\
  \ 开发者被聘佣是为了为公司创造价值，他们不仅通过按时交付产品，还通过开发在长期之后仍持续持续价值的知识产权。\n\n编写可维护的代码非常重要，因为大多数开发者花费大量时间维护他人的代码。从零开始开发新代码是非常罕见的情况；通常你必须在他人完成的基础上进行构建。确保你的代码是可维护的，可以确保其他开发者能够尽可能地完成工作。\n\
  \n![image](img/pen.gif)\n\n注意，可维护代码的概念并不是 JavaScript 特有的。其中一些概念广泛适用于任何编程语言，尽管也有一些\
  \ JavaScript 特有的概念。\n\n### 什么是可维护的代码？\n\n可维护的代码具有几个特征。通常情况下，如果代码满足以下所有条件，则认为它是可维护的：\n\
  \n*   **易于理解的** —— 别人可以接手代码，并在没有原开发者讲解的情况下推断出其目的和通用方法。\n*   **直观的** —— 代码中的事情看起来总是很有道理，无论操作有多复杂。\n\
  *   **可适应的** —— 代码的编写方式使得数据变化不需要完全重写。\n*   **可扩展的** —— 代码架构设计时留了心，允许未来对核心功能进行扩展。\n\
  *   **可调试的** —— 当出现问题时，代码能提供足够的信息，让你尽可能直接地识别问题。\n\n能够编写可维护的 JavaScript 代码是专业人士的一项重要技能。这是在周末胡凑出一个网站的爱好者与真正精通手艺的专业开发者之间的区别。\n\
  \n### 代码规范\n\n开始编写可维护代码的最简单方法之一是为你编写的 JavaScript 制定代码规范。大多数编程语言都制定了代码规范，在互联网上快速搜索可能会找到成千上万份文档。专业机构长期以来一直为开发者制定代码规范，试图让代码对所有人来说更具维护性。运行最好的开源项目都有严格的代码规范要求，允许社区中的每个人都能轻松理解代码是如何组织的。\n\
  \n代码规范对 JavaScript 来说非常重要，因为该语言具有适应性。与大多数面向对象的语言不同，JavaScript 不会强制开发者将一切定义为对象。该语言可以支持许多种编程风格，从传统的面向对象方法到声明式方法再到函数式方法。快速查看几个开源\
  \ JavaScript 库，就可以轻松获得创建对象、定义方法和管理环境的多种方法。\n\n接下来的章节将讨论开发代码规范的通用方法。这些主题需要处理，尽管根据你的个人需求，处理方式可能会有所不同。\n\
  \n#### 可读性\n\n为了使代码具有可维护性，它首先必须是可读的。可读性与代码作为文本文件的格式有关。可读性很大程度上取决于代码的缩进。当所有人都使用相同的缩进方案时，整个项目的代码将变得更容易阅读。缩进通常通过使用数量空格而不是\
  \ tab 键来实现，因为不同的文本编辑器对 tab 键的显示不同。一个良好的通用缩进大小是四个空格，尽管你可能决定使用更多或少。\n\n可读性的另一部分是注释。在大多数编程语言中，为每个方法添加注释是一种被接受的做法。由于\
  \ JavaScript 可以在代码的任何位置创建函数，这往往被忽视了。正因如此，在 JavaScript 中记录每个函数可能更为重要。总的来说，你代码中应该注释的地方如下：\n\
  \n*   **函数和方法** —— 每个函数或方法都应该包含一条注释，描述其目的以及可能用于完成任务的算法。说明所做的的假设也是同样重要的，还需说明参数代表什么，以及函数是否返回值（因为这从函数定义中无法看出）。\n\
  *   **大段代码** —— 所有用于完成单一任务的多行代码之前，应该带有一条描述该任务的注释。\n*   **复杂算法** —— 如果你使用独特的方法来解决问题，请通过注释解释你是如何做的。\n\
  *   **黑客手段（Hacks）** —— 由于浏览器差异，JavaScript 代码通常包含一些黑客手段。不要假设查看代码的其他人会理解此类黑客手段正在解决的浏览器问题。如果你因为某个浏览器无法使用正常方式而需要采取不同的处理方法，请将其写入注释中。这可以减少某人看到你的黑客手段并试图“修复”它，从而无意中引入你已经解决过的\
  \ bug。\n\n缩进和注释可以创建更具可读性的代码，使未来更容易维护。\n\n变量和函数命名\n\n\n\n\n\n代码中变量和函数的正确命名对于使其代码具有可读性和可维护性至关重要。由于许多\
  \ JavaScript 开发者最初是从爱好者开始的，因此他们倾向于使用无意义的名字，如作为变量的 \"foo\" 和 \"bar\"，以及使用 \"doSomething\"\
  \ 作为函数名。一个专业的 JavaScript 开发者必须克服这些旧习惯，以创建可维护的代码。命名的通用规则如下：\n\n*   变量名应当是名词，例如 `car`\
  \ 或 `person`。\n*   函数名应当以动词开头，例如 `getName()`。返回布尔值的函数通常以 `is` 开头，例如 `isEnabled()`。\n\
  *   对变量和函数都应使用逻辑化的名称，无必担心长度。长度可以通过后处理和压缩（在本章稍后的部分进行讨论）来缓解。\n\n避免使用无法指示其包含数据类型的无用变量名是关重要的。通过合理的命名，代码读起来就像对发生过程的叙述，使其更容易理解。\n\
  \n## 变量类型透明度\n\n由于 JavaScript 是弱类型的，很容易丢失对变量应该包含的数据类型的追踪。合理的命名在某种程度上可以缓解这个问题，但在所有情况下可能都不够。有三种方法可以指示变量的数据类型。\n\
  \n第一种是通过初始化。当定义一个变量时，应该将其初始化为一个指示其未来将如何被使用的值。例如，存储布尔值的变量应该初始化为 `true` 或 `false`，存储数字的变量应该初始化为一个数字，如下例所示：\n\
  \n```\n//通过初始化指示变量类型\nvar found = false;              //Boolean\nvar count  = -1;\
  \                //number     \nvar name = \"\";                  //string\nvar\
  \ person = null;              //object\n```\n\n初始化为特定的数据类型是变量类型的良好指。。初始化的缺点是，它无法在函数声明中作为函数参数使用。\n\
  \n第二种指示变量类型的方法是使用匈牙利命名法（Hungarian notation）。匈牙利命名法在变量开头添加一个或多个字符来指示数据类型。这种命名法在脚本语言中很流行，而且在很长一段时间内，它是\
  \ JavaScript 的首选格式。JavaScript 最传统的匈牙利命名法为基本类型添加单个字符：\"o\" 代表对象，\"s\" 代表字符串，\"i\"\
  \ 代表整数，\"f\" 代表浮点数，“b\" 代表布尔值。这是一个例子：\n\n```\n//使用匈牙利命名法指示数据类型\nvar bFound;    \
  \  //Boolean\nvar iCount;      //integer\nvar sName;       //string\nvar oPerson;\
  \     //object\n```\n\nJavaScript 匈牙利命名法的优势在于它可以同样很好地用于函数参数。匈牙利命名法的缺点是它会让代码的可读性稍微降低，中断了不使用它时就能实现的直观、像句子一样的代码特性由于由于原因，匈牙利命名法开始不再部分开发者的青睐。\n\
  \n指示变量类型的最后方法是使用类型注释（type comments）。类型注释放置在变量名之后、任何初始化之前。其核心思想是在变量旁放置一个指示数据类型的注释，如下例所示：\n\
  \n```\n//使用类型注释指示类型\nvar found  /*:Boolean*/ = false;\nvar count  /*:int*/     =\
  \ 10;\nvar name   /*:String*/  = \"Nicholas\";\nvar person /*:Object*/  = null;\n\
  ```\n\n类型注释在注入类型信息的同时保持了代码整体的可读性。类型注释的缺点是，你无法使用多行注释注释掉大块代码，因为类型注释本身也是多行注释，会产生干扰，如下例所示：\n\
  \n```\n//以下代码无法正常工作\n/*\nvar found  /*:Boolean*/ = false;\nvar count  /*:int*/ \
  \    = 10;\nvar name   /*:String*/  = \"Nicholas\";\nvar person /*:Object*/  = null;\n\
  */\n```\n\n在这里，意图是使用多行注释注释掉所有变量。类型注释干扰了这一点，因为第一个 `/*` 实例（第二行）与第一个 `*/` 实例（第三行）相匹配，这将导致语法错误。如果你想使用类型注释注释掉代码行，最好在每行上使用单行注释（许多编辑器会自动为你完成这一点）。\n\
  \n这些是指示变量数据类型的三种常见方法。在决定使用其中一种之前，你需要对每种方法的优缺点进行评估。重要的是决定哪种最适合你的项目并保持一致地使用它。\n\n\
  ## 松耦合\n\n当应用程序的部分相互依赖过于紧密时，代码就会变得过度耦合且难以维护。典型问题发生在对象以这种方式直接相互引用，导致其中一个的变化总是需要另一个的变化。紧耦合的软件难以维护，并且不可避免地必须频繁重写。\n\
  \n由于涉及的技术，Web 应用程序有几种方式可能会变得过度耦合。意识到这一点并尽可能维护松耦合的代码是非常重要的。\n\n### 解耦 HTML/JavaScript\n\
  \n常见的耦合类型之一是 HTML/JavaScript 耦合。在 Web 上，HTML 和 JavaScript 分别代表解决方案的两个层级：HTML 是数据，JavaScript\
  \ 是行为。因为它们旨在相互作用，所以有许多不同的方法可以将这两种技术结合在一起。遗憾的是，某些方法将 HTML 和 JavaScript 过度耦合。\n\n\
  内联出现在 HTML 中的 JavaScript（通过使用带有内联代码的 `<script>` 元素或使用 HTML 属性分配事件处理程序）是过度耦合的。考虑以下代码示例：\n\
  \n```\n<!--使用 <script> 的紧耦合 HTML/JavaScript -->\n<script type=\"text/javascript\"\
  >\n  document.write(\"Hello world!\");\n</script>\n\n<!--使用事件处理程序属性的紧耦合 HTML/JavaScript\
  \ -->\n<input type=\"button\" value=\"Click Me\" onclick=\"doSomething()\" />\n\
  ```\n\n尽管在技术上都是正确的，但在实践中，它们将代表数据的 HTML 与定义行为的 JavaScript 紧密耦合。理想情况下，HTML 和 JavaScript\
  \ 应该是完全分离的，通过外部文件引入 JavaScript 并使用 DOM 附加行为。\n\n当 HTML 和 JavaScript 过度耦合时，JavaScript\
  \ 错误意味着首先要确定错误是发生在解决方案的 HTML 部分还是 JavaScript 文件中。它还引入了与代码可用性相关的新类型错误。在示例中，按钮可能在\
  \ `doSomething()` 函数可用之前被点击，导致 JavaScript 错误。可维护性受到了影响，因为对按钮行为的任何更改都需要触动 HTML 和\
  \ JavaScript，而它本只需要触动后者。\n\n当反过来发生时，HTML 和 JavaScript 也可能过度耦合的：HTML 被包含在 JavaScript\
  \ 中。这通常发生在使用 `innerHTML` 将 HTML 文本块插入页面中时，如下例所示：\n\n```\n//HTML 到 JavaScript 的紧耦合\n\
  function insertMessage(msg){\n    var container = document.getElementById(\"container\"\
  );\n    container.innerHTML = \"<div class=\\\"msg\\\"><p class=\\\"post\\\">\"\
  \ + msg + \"</p>\" +\n        \"<p><em>Latest message above.</em></p></div>\";\n\
  }\n```\n\n\n\n\n通常情况下，你应该避免在 JavaScript 中创建大量的 HTML。这再次与保持层级分离以及能够轻松地识别错误来源有关。当使用此示例代码时，页面布局问题可能与格式不当的动态创建\
  \ HTML 有关。然而，定位错误可能困难，因为你通常会先查看页面源代码以寻找问题的 HTML，但你会在那里找不到它，因为它是动态生成的。对数据或布局的更改也需要修改\
  \ JavaScript，这表明这两个层级之间的耦合过于紧密。\n\nHTML 渲染应该尽可能与 JavaScript 保持分离。当使用 JavaScript\
  \ 插入数据时，应尽可能在插入时不包含任何标记（markup）。通常可以在渲染整个页面时包含并隐藏标记，这样就可以使用 JavaScript 在之后显示标记，而不是在生成时创建它。另一种方法是发送\
  \ Ajax 请求来获取要显示的额外 HTML；这种方法允许相同的渲染层（`PHP`、`JSP`、`Ruby` 等）输出标记，而不是将其嵌入到 JavaScript\
  \ 中。\n\n解耦 HTML 和 JavaScript 可以通过更容易识别错误来源来节省调试期间的时间，而且还能够提高可维护性：行为的变化只发生在 JavaScript\
  \ 文件中，而标记的变化只发生在渲染文件中。\n\n## 解耦 CSS/JavaScript\n\nWeb 层的另一层是 CSS，它主要负责页面的显示。JavaScript\
  \ 和 CSS 密切相关：它们都是 HTML 之上的层，因此经常被一起使用。然而，与 HTML 和 JavaScript 一样，CSS 和 JavaScript\
  \ 也可能耦合得紧密。紧耦合最常见的例子是使用 JavaScript 更改单个样式，如下：\n\n```javascript\n//CSS 与 JavaScript\
  \ 的紧耦合\nelement.style.color = \"red\";\nelement.style.backgroundColor = \"blue\"\
  ;\n```\n\n由于 CSS 负责页面的显示，任何显示上的问题都应该通过查看 CSS 文件来解决。然而，当使用 JavaScript 更改单个样式（如颜色）时，它增加了一个必须检查并可能更改的第二个。结果是\
  \ JavaScript 在某种程度上负责页面的显示并与 CSS 存在紧密耦合。如果未来需要更改样式，则 CSS 和 JavaScript 文件可能都需要进行更改。这为开发人员造成了维护噩梦。层与层之间需要更清晰的划分。\n\
  \n现代 Web 应用频繁使用 JavaScript 更改样式，因此无法完全解耦 CSS 和 JavaScript，但可以使耦合变得松散。这是通过动态更改类而不是单个样式来实现的，如下例所示：\n\
  \n```javascript\n//CSS 与 JavaScript 的松耦合\nelement.className = \"edit\";\n```\n\n\
  通过仅更改元素的 CSS 类，你允许大多数样式信息严格地保留在 CSS 中。可以使用 JavaScript 来更改类，但它没有直接影响元素的样式。只要应用了正确的类，任何显示问题都可以直接追踪到\
  \ CSS 而不是 JavaScript。\n\n第二种紧耦合仅在 Internet Explorer 中有效（但在以标准模式运行的 Internet Explorer\
  \ 8+ 中无效），在那种情况下可以通过表达式（expressions）将 JavaScript 嵌入 CSS 中，如下例所示：\n\n```css\n/* JavaScript\
  \ 与 CSS 的紧耦合 */\ndiv {\n    width: expression(document.body.offsetWidth - 10 + \"\
  px\");\n}\n```\n\n通常会避免使用表达式，因为它们不具备跨浏览器兼容性。由于它们引入了 JavaScript 和 CSS 之间紧密耦合，也应该避免使用它们。当你使用表达式时，CSS\
  \ 中可能会发生 JavaScript 错误。尝试过由于 CSS 表达式而追踪 JavaScript 错误的开发人员可以告诉你，在他们甚至考虑查看 CSS 寻找错误源之前，已经耗花了多长时间。\n\
  \n再次强调，保持良好的层级分离至关重要。显示问题的唯一源应该是 CSS，而行为问题的唯一源应该是 JavaScript。保持这些层级之间的松散耦合会让你的整个应用程序更具维护性。\n\
  \n## 解耦应用逻辑/事件处理程序\n\n每个 Web 应用通常充满了许多监听众多不同事件的事件处理程序。然而，很少有程序会注意将应用逻辑与事件处理程序分离。考虑以下示例：\n\
  \n```javascript\nfunction handleKeyPress(event){\n    event = EventUtil.getEvent(event);\n\
  \    if (event.keyCode == 13){\n        var target = EventUtil.getTarget(event);\n\
  \        var value = 5 * parseInt(target.value);\n        if (value > 10){\n   \
  \         document.getElementById(\"error-msg\").style.display = \"block\";\n  \
  \      }\n    }\n}\n```\n\n此事件处理程序在处理事件之外还包含了应用逻辑。这种方法的问题有两个：首先，除了通过事件之外，没有方法可以触发应用逻辑，这使得调试变得困难。如果预期的结果没有发生怎么办？这意味着事件处理程序没有被调用，还是应用逻辑失败了？其次，如果后续事件导致相同的应用逻辑发生，你需要复制该功能，否则将其提取到单独的函数中。无论哪种方式，所做的更改都比实际需要的更多。\n\
  \n更好的方法是将应用逻辑与事件处理程序分离，使每个部分只处理它们应该处理的内容。事件处理程序应该查询事件对象以获取相关信息，然后将这些信息传递给处理应用逻辑的方法。例如，之前的代码可以重写为：\n\
  \n```javascript\nfunction validateValue(value){\n    value = 5 * parseInt(value);\n\
  \    if (value > 10){\n        document.getElementById(\"error-msg\").style.display\
  \ = \"block\";\n    }    \n}\n\nfunction handleKeyPress(event){\n    event = EventUtil.getEvent(event);\n\
  \    if (event.keyCode == 13){\n        var target = EventUtil.getTarget(event);\n\
  \        validateValue(target.value);\n    }\n}\n```\n\n更新后的代码正确地将应用逻辑从事件处理程序分离离开。`handleKeyPress()`\
  \ 函数检查是否按了回车键（`event.keyCode` 为 `13`），然后获取事件的目标并将值属性传递给 `validateValue()` 函数，该函数包含应用逻辑。请注意，`validateValue()`\
  \ 中没有任何依赖于任何事件处理程序的逻辑；它只是接收一个值并根据该值执行所有其他操作。\n\n将应用逻辑与事件处理程序分离有许多好处。首先，它允许你以极小的努力更改触发特定过程的事件。最初是鼠标点击触发了处理，但现在按键也应该这样做，这种更改非常容易。其次，你可以在不附加事件的情况下测试代码，这使得创建单元测试或自动化应用程序流变得更容易。\n\
  \n在应用逻辑与业务逻辑松耦合方面，请记住以下规则：\n\n*   不要将事件对象传递给其他方法；只传递从事件对象中需要的数据。\n*   事件处理程序应该处理事件，然后将处理工作交给应用逻辑。\n\
  \n\n\n编写可维护的 JavaScript 代码不仅关乎代码的格式，还关乎代码的功能。在企业环境中创建的 Web 应用通常由很多人同时开发。在这些情况下，目标是确保所有人工作的浏览器环境具有一致且不变的规则。为了实现这一目标，开发者应该遵循某些编程实践。\n\
  \n## 尊重对象所有权\n\nJavaScript 的动态特性意味着几乎任何内容在任何时候都可以被修改。人们说 JavaScript 中没有东西是神圣不可侵的，因为你无法将某些内容标记为最终或常量。随着\
  \ `ECMAScript 5` 引入了防篡对象（在第 22 章中讨论），这种情况发生了一些变化，但默认情况下，所有对象都是可以修改的。在其他语言中，当你没有实际源代码时，对象和类是不可变的。JavaScript\
  \ 允许你在任何时间修改任何对象，这使得以意想不到的方式覆盖默认行为成为可能。由于语言没有施加限制，因此开发者这样做是既重要又必要的。\n\n在企业环境中，最重要的编程实践或许就是尊重对象所有权，这意味着你不修改不属于你的对象。简单来说：如果你不负责某个对象、其构造函数或方法的创建或维护，就不应该对其进行更改。更具体地说：\n\
  \n* 不要向实例或原型上添加属性。\n* 不要向实例或原型上添加方法。\n* 不要重新定义已存在的方法。\n\n问题在于，开发者假设浏览器环境按某种方式运行。对被多人使用的对象进行更改会导致错误的发生。如果有人期望调用\
  \ `stopEvent()` 函数来取消事件的默认行为，而你更改了它使其执行该操作并附加了其他事件处理程序，那么问题将随之而来。其他开发者假设该函数只执行它最初执行的操作，因此他们的用法将是错误的且可能是有害的，因为他们不知道副作用。\n\
  \n这些规则不仅适用于自定义类型和对象，还适用于原生类型和对象，例如 `Object`、`String`、`document`、`window` 等。这里的潜在问题更加危险，因为浏览器厂商可能会以预先通知且意想不到的方式更改这些对象。这种情况在流行的\
  \ Prototype JavaScript 库中发生过，该库在 `document` 对象上实现了 `getElementsByClassName()` 方法，返回一个\
  \ `Array` 实例，而该实例也被扩展以包含一个名为 `each()` 的方法。John Resig 在他的博客上概述了导致该问题的事件序列。在篇文章（[`ejohn.org/blog/getelementsbyclassname-pre-prototype-16/`](http://ejohn.org/blog/getelementsbyclassname-pre-prototype-16/)）中，他指出当浏览器开始原生实现\
  \ `getElementsByClassName()` 时问题发生了，该方法返回的不是 `Array` 而是一个没有 `each()` 方法的 `NodeList`。使用\
  \ Prototype 库的开发者习惯了编写这样的代码：\n\n```\ndocument.getElementsByClassName(\"selected\"\
  ).each(Element.hide);\n```\n\n尽管这段代码在没有原生实现 `getElementsByClassName()` 的浏览器中运行良好，但由于返回值的差异，它在已实现的浏览器中导致了错误。你无法预测浏览器厂商未来将如何更改原生对象，因此以任何方式修改它们都可能在以后你的实现与它们的实现冲突时导致问题。\n\
  \n因此，最好的方法是永远不要修改你不拥有的对象。只有当你自己创建对象时（例如自定义类型或对象字面量），你才拥有它。你不拥有 `Array`、`document`\
  \ 等，因为它们在你的代码执行之前就已经存在了。你仍然可以通过以下方式为对象创建新功能：\n\n* 创建一个具有你需要的功能的新对象，并让它与目标对象交互。\n\
  * 创建一个继承自你想要修改的类型的自定义类型。然后你可以用额外的功能修改该自定义类型。\n\n许多 JavaScript 库现在都遵循这种开发理论，使它们在浏览器不断变化的情况下能够成长和适应。\n\
  \n## 避免全局变量\n\n与尊重对象所有权密切相关的是尽可能避免全局变量和函数。再次，这与创建一个用于执行脚本的一致且可维护的环境有关。最多应该创建一个创建一个全局变量，让其他对象和函数存在于其上。考虑以下内容：\n\
  \n```javascript\n//两个全局变量 - 避免！！！\nvar name = \"Nicholas\";\nfunction sayName(){\n\
  \    alert(name);\n}\n```\n\n这段代码包含两个全局变量：变量 `name` 和函数 `sayName()`。它们很容易在包含两者的对象上创建，如示例所示：\n\
  \n```javascript\n//一个全局变量 - 优先\nvar MyApplication = {\n    name: \"Nicholas\",\n\
  \    sayName: function(){\n        alert(this.name);\n    }\n};\n```\n\n这段重写的代码引入了单一的全局对象\
  \ `MyApplication`，`name` 和 `sayName()` 都挂载在其上面。这样做消除了之前代码中存在的几个问题。首先，变量 `name` 覆盖了\
  \ `window.name` 属性，这可能干扰其他功能。其次，它有助于消除对功能所在位置的混乱。调用 `MyApplication.sayName()` 是逻辑提示，代码中的任何问题都可以通过查看定义\
  \ `MyApplication` 的代码来识别。单一全局方法的扩展是命名空间（namespacing）概念，该概念由 Yahoo! User Interface\
  \ (YUI) 库普及。命名空间涉及创建一个对象来存放功能。在 YUI 的 2.x 版本中，有多个挂载了功能的命名空间。这里是一些示例：\n\n* `YAHOO.util.Dom`\
  \ —— 用于操作 DOM 的方法。\n* `YAHOO.util.Event` —— 与事件交互的方法。\n* `YAHOO.lang` —— 帮助处理底层语言特征的方法。\n\
  \n对于 YUI 来说，单一全局对象 `YAHOO` 作为一个容器，其他对象定义在其上面。每当对象仅用于这种方式的功能分组时，它们就被称为命名空间。整个 YUI\
  \ 库都是基于这一概念构建的，允许它与同一个页面上的任何 JavaScript 库共存。\n\n命名空间的重要部分是决定一个大家同意并的全局对象名称，并且该名称足够独特，使得其他人不太可能也使用它。在大多数情况下，这可以是你开发代码的公司名称，例如\
  \ `YAHOO` 或 `Wrox`。然后你就可以开始创建命名空间来对你的功能分组，如下所示：\n\n```javascript\n//创建全局对象\nvar\
  \ Wrox = {};\n\n//为 Professional JavaScript 创建命名空间\nWrox.ProJS = {};\n\n//挂载书书中使用的其他对象\n\
  Wrox.ProJS.EventUtil = { ... };\nWrox.ProJS.CookieUtil = { ... };\n```\n\n在这个示例中，`Wrox`\
  \ 是创建命名空间的全局对象。如果书中的所有代码都放在 `Wrox.ProJS` 命名空间下，就让其他作者在 `Wrox` 对象上添加他们的代码。只要每个人都遵循这种模式，就不必担心其他人写一个名为\
  \ `EventUtil` 或 `CookieUtil` 的对象，因为它将存在于不同的命名空间中。考虑这个示例：\n\n```javascript\n//为 Professional\
  \ Ajax 创建命名空间\nWrox.ProAjax = {};\n\n//挂载书书中使用的其他对象\nWrox.ProAjax.EventUtil = {\
  \ ... };\nWrox.ProAjax.CookieUtil = { ... };\n\n//你仍然可以访问 ProJS 的\nWrox.ProJS.EventUtil.addHandler(\
  \ ... );\n\n//并单独访问 ProAjax 的\nWrox.ProAjax.EventUtil.addHandler( ... );\n```\n\n\
  \n\n\n虽然命名空间需要更多的代码，但为了维护性的考虑，这种权衡是值得的。命名空间有助于确保你的代码能够以无害的方式与页面上的其他代码共同工作。\n\n##\
  \ 避免 null 比较\n\n由于 JavaScript 不进行任何自动类型检查，这就变成了开发者的责任。结果是 JavaScript 代码中实际执行的类型检查很少。最常见的类型检查是检查一个值是否为\
  \ `null`。遗憾的是，对 `null` 的检查被过度使用，并且经常由于类型检查不足而导致错误。考虑以下代码：\n\n```javascript\nfunction\
  \ sortArray(values){\n    if (values != null){             // 避免！！\n        values.sort(comparator);\
  \ \n    }\n}\n```\n\n该函数的作用是使用给定的比较器对数组进行排序。`values` 参数必须是一个数组函数才能正确执行，但 `if` 语句仅仅检查\
  \ `values` 是否为 `null`。有几个值可以可以通过这个 `if` 语句，包括任何字符串或任何数字，这将会导致函数抛出错误。\n\n从实际上，`null`\
  \ 比较很少能足够使用。应该根据值预期的类型进行检查，而不是根据它不是预期的类型进行检查。例如，在之前的代码中，`values` 参数预期是一个数组，因此你应该检查它是否为数组，而不是检查它是否不是\
  \ `null`。该函数可以更合适地重写如下：\n\n```javascript\nfunction sortArray(values){\n    if (values\
  \ instanceof Array){  // 优先\n        values.sort(comparator); \n    }\n}\n```\n\n\
  这个版本的函数防止了所有无效值，并且完全不需要使用 `null`。\n\n![image](img/pen.gif)\n\n这种识别数组的技术在多框架 Web\
  \ 中无法正常工作，因为每个框架都有自己的全局对象，因此也有它们自己的 `Array` 构造函数。如果你正在将数组从一个框架传递到另一个框架，你可能想要测试 `sort()`\
  \ 方法是否存在。\n\n如果你在代码中看到 `null` 比较，尝试使用以下技术之一来替换它：\n\n*   如果该值应该是引用类型，使用 `instanceof`\
  \ 运算符检查它的构造函数。\n*   如果该值应该是原始数据类型，使用 `typeof` 运算符检查它的类型。\n*   如果你期望一个具有特定方法名的对象，使用\
  \ `typeof` 运算符确保对象上存在具有给定名称的方法。\n\n代码中的 `null` 比较越少，越容易确定代码的目的并消除不必要的错误。\n\n## 使用常量\n\
  \n尽管 JavaScript 没有正式的常量概念，但它们仍然很有用。其思想是将数据与应用程序逻辑隔离开，以便在不产生引入错误风险的情况下对数据进行更改。考虑以下代码：\n\
  \n```javascript\nfunction validate(value){\n    if (!value){\n        alert(\"Invalid\
  \ value!\");\n        location.href = \"/errors/invalid.php\";\n    }\n} \n```\n\
  \n此函数中有两部分数据：显示给用户看的消息和 URL。在用户界面中显示的字符串应该始终被提取出来，以便于国际化。URL 也应该被提取，因为随着应用程序的增长，它们倾向于发生变化。基本上，这些中的每项都可能由于某种或其他原因发生变化，而变化意味着需要进入函数并修改那里的代码。每当你更改应用程序逻辑代码时，你就打开了创建错误的可能性。通过将数据提取到单独定义的常量中，你可以将应用程序逻辑与数据变化隔离开。考虑以下示例：\n\
  \n```javascript\nvar Constants = {\n    INVALID_VALUE_MSG: \"Invalid value!\",\n\
  \    INVALID_VALUE_URL: \"/errors/invalid.php\"\n};\n\nfunction validate(value){\n\
  \    if (!value){\n        alert(Constants.INVALID_VALUE_MSG);\n        location.href\
  \ = Constants.INVALID_VALUE_URL;\n    }\n}\n```\n\n在这个重写的代码版本中，消息和 URL 都定义在一个 `Constants`\
  \ 对象上；函数然后引用这些值。这种设置允许数据发生变化，而你永远不需要碰使用它的函数。`Constants` 对象甚至可以定义在完全不同的文件中，而该文件可以由某些过程生成，并根据国际化设置包含正确的值。\n\
  \n关键是将数据与使用它的逻辑隔离开来。要查找的值的类型如下：\n\n*   重复值 — 任何在多个地方被使用的值都应该提取为常量。这限制了当一个值被改变而其他值未改变时发生错误的概率。这包括\
  \ CSS 类名。\n*   用户界面字符串 — 任何要显示给用户的字符串都应该提取出来，以便更容易国际化。\n*   URL — 资源位置在 应用程序中往往频繁变化，因此建议在一个公共的地方存储所有\
  \ URL。\n*   任何可能更改的值 — 每当你在代码中使用字面量值时，问自己这个值在未来可能会更改。如果是，则该值应该提取为常量。\n\n使用常量是企业级\
  \ JavaScript 开发的一重要技术，因为它使代码更具维护性并防止数据变化。\n\n## 性能\n\n自从该语言引入以来，每个 页面编写的 JavaScript\
  \ 数量急剧增加。这种增长带来了对 JavaScript 代码运行时执行的担忧。JavaScript 最初是一种解释型语言，因此其执行速度远慢于编译语言。Chrome\
  \ 是第一个引入编译 JavaScript 为原生代码引擎的浏览器。从那时起，所有其他主流浏览器都这样做并实现了 JavaScript 编译。\n\n即使转向编译\
  \ JavaScript，编写慢代码仍然可能的。但是遵循某些基本模式可以确保最快的执行。\n\n### 注意作用域\n\n第 4 章讨论了 JavaScript\
  \ 中的作用域概念以及作用链是如何工作的。随着作用链中作用域数量的增加，访问范围外变量的时间也会增加。访问全局变量总是比访问局部变量慢，因为必须遍历作用链。你任何可以减少遍历作用链花费的操作都会提高脚本的整体性能。\n\
  \n### 避免全局查找\n\n提高脚本性能可能最重要的事情之一就是警惕全局查找。全局变量和函数的使用总是比局部的昂贵，因为它们涉及作用链查找。考虑以下函数：\n\
  \n```javascript\nfunction updateUI(){\n    var imgs = document.getElementsByTagName(\"\
  img\");\n    for (var i=0, len=imgs.length; i < len; i++){\n        imgs[i].title\
  \ = document.title + \" image \" + i;\n    }\n\n    var msg = document.getElementById(\"\
  msg\");\n    msg.innerHTML = \"Update complete.\"; \n}\n```\n\n这个函数看起来完全没问题，但它对全局\
  \ `document` 对象有三次引用。如果页面上有多个图片，循环循环中的 `document` 引用可能会执行几十或数百次，每次都需要作用链查找。通过创建一个指向\
  \ `document` 对象的局部变量，你可以通过将全局查找次数限制为一次来提高此函数的性能：\n\n\n\n\n\n```javascript\nfunction\
  \ updateUI(){\n    var doc = document;\n    var imgs = doc.getElementsByTagName(\"\
  img\");\n    for (var i=0, len=imgs.length; i < len; i++){\n        imgs[i].title\
  \ = doc.title + \" image \" + i;\n    }\n\n    var msg = doc.getElementById(\"msg\"\
  );\n    msg.innerHTML = \"Update complete.\"; \n}\n```\n\n在这里，`document` 对象首先存储在本地变量\
  \ `doc` 中。随后在代码的剩余部分，`doc` 变量被用来替代 `document`。与之前的版本相比，此函数中只有一次全局查找，确保了它的运行速度更快。\n\
  \n一个好的经验法则是：在函数中使用次数超过一次的任何全局对象都将其存储为局部变量。\n\n## 避免使用 `with` 语句\n\n在对性能要求的情况下，应避免使用\
  \ `with` 语句。与函数类似，`with` 语句会创建自己的作用域，从而增加了在其内部执行的代码的作用域链长度。由于作用域链查找中存在额外的步骤，在 `with`\
  \ 语句内执行的代码保证运行得比外部执行的代码慢。\n\n使用 `with` 语句的情况非常罕见，因为它主要用于消除多余字符。在大多数情况下，可以使用局部变量来实现相同的功能，而不会引入新的作用域。这里有一个示例：\n\
  \n```javascript\nfunction updateBody(){\n    with(document.body){\n        alert(tagName);\n\
  \        innerHTML = \"Hello world!\";\n    }\n}\n```\n\n这段代码中的 `with` 语句让你能够更方便地使用\
  \ `document.body`。通过使用局部变量也可以相同的效果，如下：\n\n```javascript\nfunction updateBody(){\n\
  \    var body = document.body;\n    alert(body.tagName);\n    body.innerHTML = \"\
  Hello world!\";\n}\n```\n\n虽然这段代码稍微长一点，但它的可读性比 `with` 语句更好，确保了你清楚 `tagName` 和 `innerHTML`\
  \ 属于哪个对象。这段代码还通过将 `document.body` 存储在局部变量中节省了全局查找。\n\n## 选择正确的方法\n\n与其他语言一样，性能等式的一部分与解决问题所使用的算法或方法有关。熟练的开发者根据经验知道哪些方法可能获得更好的性能结果。在其他编程语言中常用的许多技术和方法也可以用于\
  \ JavaScript 中。\n\n## 避免不必要的属性查找\n\n在计算机科学中，算法的复杂度使用 `O` 表示法表示。最简单、最快的算法是常量值或 `O(1)`。此之后，算法变得更加复杂，执行时间也更长。下表列出了\
  \ JavaScript 中常见的算法类型。\n\n| 表示法 | 名称 | 描述 |\n| --- | --- | --- |\n| O(1) | 常数级 |\
  \ 无论值的数量有多少，执行所需的时间保持不变。表示简单值和存储在变量中的值。 |\n| O(log n) | 对数级 | 执行时间与值的数量有关，但算法完成时不需要检索每个值。例如：二分查找。\
  \ |\n| O(n) | 线性级 | 执行时间与值的数量直接相关。例如：遍历数组中的所有项。 |\n| O(n2) | 平方级 | 执行时间与值的数量相关，使得每个值必须至少被检索\
  \ n 次。例如：插入排序。 |\n\n常量值或 `O(1)` 既指字面量，也指存储在变量中的值。`O(1)` 表示法表示无论值的数量有多少，检索常量值所需的时间保持不变。检索常量值是一个极其高效的过程，因此也非常快。考虑以下内容：\n\
  \n```javascript\nvar value = 5;\nvar sum = 10 + value;\nalert(sum);\n```\n\n常量值或\
  \ `O(1)` 同时指字面量和存储在变量中的值。`O(1)` 表示法表示无论值的数量有多少，检索常量值所需的时间保持不变。检索常量值是一个极其高效的过程，因此也非常快。考虑以下内容：\n\
  \n```javascript\nvar value = 5;\nvar sum = 10 + value;\nalert(sum);\n```\n\n这段代码执行了四次查找：`value`\
  \ 的赋值、`sum` 的计算、`value` 的读取以及 `sum` 的打印。考虑到 `value`、`10` 和 `sum`，这四次查找是 `value`、`10`、`value`\
  \ 和 `sum`。\n\n通常情况下，迭代迭代器 ` `，，， ` `局部。。。。。。， ` ` ` ` ```` `value`。考虑以下内容：\n\n```javascript\n\
  var i=0; i < values.length; i++){\n    process(values[i]);\n}\n```\n\n这段代码执行了四次查找：`i`\
