  \n## for 语句\n\n`for` 语句也是一种预测试循环，但额外具备在进入循环前进行变量初始化以及定义循环后执行执行代码的功能。其语法如下：\n\n```for\n\
  for (initialization; expression; post-loop-expression) statement\n```\n\n这是它的用法示例：\n\
  \n![image](img/logo1.gif)\n\n```javascript\nvar count = 10;\nfor (var i=0; i < count;\
  \ i++){\n    alert(i);\n}\n```\n\n`ForStatementExample01.htm`\n\n这段代码定义了一个初始值为 `0`\
  \ 的变量 `i`。只有当条件表达式 `(i < count)` 评估为 `true` 时，才会进入 `for` 循环，使得代码体可能不会执行。如果执行了体，也会执行循环后表达式，迭代变量\
  \ `i`。这个 `for` 循环与以下代码相同：\n\n```javascript\nvar count = 10;\nvar i = 0;\nwhile (i\
  \ < count);\n```\n\n初始化、控制表达式和循环后表达式都是可选的。你可以通过省略这三项来创建一个无限循环，如下：\n\n```javascript\n\
  for (;;) {              //无限循环\n    doSomething();\n}\n```\n\n仅包含控制表达式有效地将 `for`\
  \ 循环转换为 `while` 循环，如下：\n\n![image](img/logo1.gif)\n\n```javascript\nvar count =\
  \ 10;\nvar i = 0;\nfor (; i < count; ){\n    alert(i);\n    i++;\n}\n```\n\n## for-in\
  \ 语句\n\n`for-in` 语句是一种严格的迭代语句。它用于枚举对象的属性。其语法如下：\n\n```javascript\nfor (property\
  \ in expression) statement\n```\n\n这是它的用法示例：\n\n```javascript\nfor (var propName\
  \ in window) {\n     document.write(propName);\n}\n```\n\n`ForInStatementExample01.htm`\n\
  \n\n\n\n在 Safari 3 之前的版本中，`for-in` 语句存在一个 bug，导致某些属性被返回两次。\n\n## 标签语句\n\n可以使用以下语法对语句进行标记以便以后使用：\n\
  \n```\nlabel: statement\n```\n\n这里有一个示例：\n\n```\nstart: for (var i=0; i < count;\
  \ i++) {\n    alert(i);\n}\n```\n\n在这个示例中，可以通过 `break` 或 `continue` 语句在稍后引用标签 `start`。标签语句通常与嵌套循环配合使用。\n\
  \n## break 和 continue \n\n`break` 和 `continue` 语句对循环中代码执行提供了更严格的控制。`break` 语句会立即退出循环，强制继续执行循环后的下一个语句。相比之下，`continue`\
  \ 语句也会立即退出循环，但执行将从循环的顶部继续。这里有一个示例：\n\n![image](img/logo1.gif)\n\n```\nvar num =\
  \ 0;\n\nfor (var i=1; i < 10; i++) {\n    if (i % 5 == 0) {\n        break;\n  \
  \  }\n    num++;\n}\n\nalert(num);    //4\n```\n\nBreakStatementExample01.htm\n\n\
  在这段代码中，`for` 循环将变量 `i` 从 `1` 增加到 `10`。在循环体内，`if` 语句检查 `i` 的值是否能被 `5` 整除（使用模运算符 `%`）。如果是，则执行\
  \ `break` 语句并退出循环。变量 `num` 初始值为 `0`，表示循环执行的次数。在触发 `break` 语句后，执行的下一行代码是 `alert`，它显示\
  \ `4`。因此，循环执行了四次，因为当 `i` 等于 `5` 时，`break` 语句在 `num` 增加之前导致循环退出。如果将 `break` 替换为 `continue`，可以看到不同的效果：\n\
  \n![image](img/logo1.gif)\n\n```\nvar num = 0;\n\nfor (var i=1; i < 10; i++) {\n\
  \    if (i % 5 == 0) {\n        continue;\n    }\n    num++;\n}\n\nalert(num); \
  \   //8\n```\n\nContinueStatementExample01.htm\n\n在这里，`alert` 显示 `8`，即循环执行的次数。当\
  \ `i` 达到值 `5` 时，循环在 `num` 增加之前退出，但执行从下一次迭代（即值为 `6` 时）继续。循环一直持续直到自然完成（即 `i` 等于 `10`）。`num`\
  \ 的最终值为 `8` 而不是 `9`，是因为由于 `continue` 语句缺少了一次增加。\n\n`break` 和 `continue` 语句都可以与标签语句结合使用，返回代码中的特定位置。这通常用于循环嵌套循环的情况，如下例所示：\n\
  \n```\nvar num = 0;\n\noutermost:\nfor (var i=0; i < 10; i++) {\n     for (var j=0;\
  \ j < 10; j++) {\n        if (i == 5 && j == 5) {\n            break outermost;\n\
  \        }\n        num++;\n    }\n}\n\nalert(num);    //55\n```\n\nBreakStatementExample02.htm\n\
  \n在这个示例中，`outermost` 标签指示第一个 `for` 语句。每个循环通常执行 10 次，这意味着 `num++` 语句通常执行 100 次，因此在执行完成时，`num`\
  \ 应该等于 `100`。这里的 `break` 语句接收一个参数：要跳出的标签。添加标签允许 `break` 语句不仅可以跳出内部的 `for` 语句（使用变量\
  \ `j`），还可以跳出外层的 `for` 语句（使用变量 `i`）。正因如此，`num` 的最终值为 `55`，因为当 `i` 和 `j` 都等于 `5` 时执行停止了。`continue`\
  \ 语句可以同样的方式使用，如下例所示：\n\n![image](img/logo1.gif)\n\n```\nvar num = 0;\n\noutermost:\n\
  for (var i=0; i < 10; i++) {\n     for (var j=0; j < 10; j++) {\n        if (i ==\
  \ 5 && j == 5) {\n            continue outermost;\n        }\n        num++;\n \
  \   }\n}\n\nalert(num);    //95\n```\n\nContinueStatementExample02.htm\n\n在这种情况下，`continue`\
  \ 语句强制执行继续——不是在内部循环中，而是在外部循环中。当 `j` 等于 `5` 时，执行 `continue`，这意味着内部循环跳过了五次迭代，导致 `num`\
  \ 等于 `95`。\n\n结合 `break` 和 `continue` 使用标签语句非常强大，但过度使用可能会导致调试问题。务必使用具有描述性的标签，并尝试不要嵌套超过几个循环。\n\
  \n## with 语句\n\n`with` 语句设置了特定对象内代码的作用域。语法如下：\n\n```\nwith (expression) statement;\n\
  ```\n\n`with` 语句的创建是为了在反复对同一个对象进行编码时提供方便，例如：\n\n```\nvar qs = location.search.substring(1);\n\
  var hostName = location.hostname;\nvar url = location.href;\n```\n\n在这里，每行代码都使用了\
  \ `location` 对象。这段代码可以使用 `with` 语句重写为如下：\n\n```\nwith(location){\n    var qs = search.substring(1);\n\
  \    var hostName = hostname;\n}\n```\n\nWithStatementExample01.htm\n\n在此代码中，每行都使用了\
  \ `location` 对象。这段代码可以使用 `with` 语句重写为如下：\n\n```\nwith(location){\n    var qs = search.substring(1);\n\
  \    var hostName = hostname;\n}\n```\n在严格模式下，`with` 语句是不允许的。\n\n![image](img/cross)\n\
  \n在生产环境中使用 `with` 语句被认为是不良实践，因为它具有负面影响且难以调试。\n\n## switch 语句\n\n与 `if` 语句密切相关的是\
  \ `switch` 语句，另一种从其他语言引入的控制语句。ECMAScript 中 `switch` 语句的语法如下所示：\n\n```\nswitch (expression)\
  \ {\n  case value: statement\n    break;\n  case value: statement\n    break;\n\
  \  case value: statement\n    break;\n  default: statement\n}\n```\n\n`switch` 语句中的每个\
  \ `case` 表示：“如果表达式等于值，则执行语句。”`break` 关键字导致执行跳出 `switch` 语句。如果没有 `break` 关键字，执行将穿透到下一个\
  \ `case`。\n\n`default` 关键字指示当表达式不匹配任何 `case` 时要执行的操作（本质上，它是一个 `else` 语句）。\n\n本质上，`switch`\
  \ 语句避免了开发者编写如下代码：\n\n```\nif (i == 25){\n  alert(\"25\");\n} else if (i == 35) {\n\
  \  alert(\"35\");\n} else if (i == 45) {\n  alert(\"45\");\n} else {\n  alert(\"\
  Other\");\n}\n```\n\n等等的 `switch` 语句如下：\n\n![image](img/logo1.gif)\n\n```\nswitch\
  \ (i) {\n    case 25: \n        alert(\"25\");\n        break;\n    case 35: \n\
  \        alert(\"35\");\n        break;\n    case 45: \n        alert(\"45\");\n\
  \        break;\n    default: \n        alert(\"Other\");\n}\n```\n\nSwitchStatementExample01.htm\n\
  \n最好的做法是在每个 `case` 之后放置一个 `break` 语句，以避免 穿透到下一个。如果你需要某个 `case` 语句穿透，请包含注释说明省略 `break`\
  \ 语句是故意的，如下所示：\n\n```\nswitch (i) {\n    case 25: \n        /* 穿透 */\n    case 35:\
  \ \n        alert(\"25 or 35\");\n        break;\n    case 45: \n        alert(\"\
  45\");\n        break;\n    default: \n        alert(\"Other\");\n}\n```\n\nSwitchStatementExample02.htm\n\
  \n虽然 `switch` 语句借用自其他语言，但它在 ECMAScript 中有些特性。首先，`switch` 语句支持所有数据类型（在许多语言中只支持数字），因此它可以用于字符串甚至对象。其次，`case`\
  \ 值不需要是常量；它们可以是变量甚至是表达式。请考虑下面的示例：\n\n\n\n\n\n```javascript\nswitch (\"hello world\"\
  ) {\n    case \"hello\" + \" world\": \n        alert(\"Greeting was found.\");\n\
  \        break;\n    case \"goodbye\": \n        alert(\"Closing was found.\");\n\
  \        break;\n    default: \n        alert(\"Unexpected message was found.\"\
  );\n}\n```\n\n`SwitchStatementExample03.htm`\n\n在示例中，switch 语句中使用了一个字符串值。第一个 `case`\
  \ 实际上是一个评估字符串拼接的表达式。由于该拼接的结果等于 `switch` 的参数，`alert` 显示“Greeting was found.”使用 `case`\
  \ 表达式的能力还允许你执行如下操作：\n\n![image](img/logo1.gif)\n\n```javascript\nvar num = 25;\n\
  switch (true) {\n    case num < 0: \n        alert(\"Less than 0.\");\n        break;\n\
  \    case num >= 0 && num <= 10: \n        alert(\"Between 0 and 10.\");\n     \
  \   break;\n    case num > 10 && num <= 20: \n        alert(\"Between 10 and 20.\"\
  );\n        break;\n    default: \n        alert(\"More than 20.\");\n}\n```\n\n\
  `SwitchStatementExample04.htm`\n\n在这里，在 `switch` 语句外部定义了一个变量 `num`。传入 `switch` 语句的表达式是\
  \ `true`，因为每个 `case` 都是一个返回 `Boolean` 值的条件。按顺序评估每个 `case`，直到找到匹配项或遇到 `default` 语句（在本例中如此）。\n\
  \n![image](img/pen.gif)\n\n`switch` 语句使用全等运算符来比较值，因此不会发生类型转换（例如，字符串 \"10\" 不等于数字\
  \ 10）。\n\n# 函数 (FUNCTIONS)\n\n函数是任何语言的核心，因为它们允许封装可以在任何地方、任何时间运行的语句。ECMAScript 中的函数使用\
  \ `function` 关键字声明，后面跟着一组参数，然后是函数体。基本语法如下：\n\n```javascript\nfunction functionName(arg0,\
  \ arg1,...,argN) {\n    statements\n}\n```\n\n这是一个示例：\n\n```javascript\nfunction\
  \ sayHi(name, message) {\n    alert(\"Hello \" + name + \", \" + message);\n}\n\
  ```\n\n`FunctionExample01.htm`\n\n该函数可以通过使用函数名调用，后面跟括号括的函数参数（如果有多个参数，则用逗号分隔）。调用\
  \ `sayHi()` 函数的代码如下：\n\n```javascript\nsayHi(\"Nicholas\", \"how are you today?\"\
  );\n```\n\n此函数调用的输出是“Hello Nicholas, how are you today?”。命名参数 `name` 和 `message`\
  \ 被用字符串拼接的一部分，最终显示在 `alert` 中。\n\nECMAScript 中的函数不需要指定是否返回数值。任何函数都可以通过使用 `return`\
  \ 语句后跟要返回的值随时返回一个值。考虑这个示例：\n\n![image](img/logo1.gif)\n\n```javascript\nfunction\
  \ sum(num1, num2) {\n    return num1 + num2;\n}\n```\n\n`FunctionExample02.htm`\n\
  \n`sum()` 函数将两个值相加并返回结果。注意，除了 `return` 语句外，没有特殊的声明指示函数返回数值。可以使用以下方式调用此函数：\n\n```javascript\n\
  var result = sum(5, 10);\n```\n\n请记住，函数在遇到 `return` 语句时会停止执行并立即退出。因此，任何在 `return`\
  \ 语句之后的代码永远不会执行。例如：\n\n```javascript\nfunction sum(num1, num2) {\n    return num1\
  \ + num2;\n    alert(\"Hello world\");    //永远不会执行\n}\n```\n\n在这个示例中，`alert` 永远不会显示，因为它们出现在\
  \ `return` 语句之后。\n\n函数中也可以包含多个 `return` 语句，如下所示：\n\n```javascript\nfunction diff(num1,\
  \ num2) {\n    if (num1 < num2) {\n        return num2 - num1;\n    } else {\n \
  \       return num1 - num2;\n    }\n}\n```\n\n`FunctionExample03.htm`\n\n在这里，`diff()`\
  \ 函数确定两个数字之间的差。如果第一个数字小于第二个，则用第二个减去第一个；否则，用第一个减去第二个。代码的每个分支都有自己的 `return` 语句来执行正确的计算。\n\
  \n`return` 语句也可以在不指定返回值的情况下使用。这样用时，函数会立即停止执行并返回 `undefined` 作为其值。这通常用于不返回值的函数中及早停止函数执行，如下例所示，`alert`\
  \ 将不会显示：\n\n![image](img/logo1.gif)\n\n```javascript\nfunction sayHi(name, message)\
  \ {\n    return;\n    alert(\"Hello \" + name + \", \" + message);    //永远不会调用\n\
  }\n```\n\n`FunctionExample04.htm`\n\n![image](img/pen.gif)\n\n建议函数要么始终返回值，要么从不返回值。编写一个有时返回值的函数会引起困惑，特别是在调试期间。\n\
  \n严格模式对函数有几项限制：\n\n- 任何函数不能命名为 `eval` 或 `arguments`。\n- 任何命名参数不能命名为 `eval` 或 `arguments`。\n\
  \n## 理解参数 (Understanding Arguments)\n\nECMAScript 中的参数行为与大多数语言相同。ECMAScript 并不关心传入了多少个参数。你定义一个函数接受两个参数并不意味着你只能传入两个。传入一个或三个，解释器都不会报错。ECMAScript\
  \ 中的参数内部表示为数组。`arguments` 对象像数组（尽管它不是 `Array` 的实例），你可以通过括号符号访问每个参数（第一个参数是 `arguments[0]`，第二个参数是\
  \ `arguments[1]`，依此类推），并使用 `length` 属性确定传入了多少参数。在之前的示例中，`sayHi()` 函数的第一个参数命名为 `name`。可以通过引用\
  \ `arguments[0]` 相同的值。因此，可以在不命名参数的情况下重写函数，如下：\n\n![image](img/logo1.gif)\n\n```javascript\n\
  function sayHi() {\n    alert(\"Hello \" + arguments[0] + \", \" + arguments[1]);\n\
  }\n```\n\n`FunctionExample05.htm`\n\n在这个函数的重写版本中，没有命名参数。删除了 `name` 和 `message` 参数，但函数运行正常。这说明了\
  \ ECMAScript 函数的一点：命名参数是方便的，而不是必须的。与其他语言不同，在 ECMAScript 中命名参数不会创建一个以后必须匹配的函数签名；不对命名参数进行验证。\n\
  \n`arguments` 对象还可以通过 `length` 属性检查传入函数的参数数量。以下示例在每次调用函数时都会输出传入的参数个数：\n\n```javascript\n\
  function howManyArgs() {\n    alert(arguments.length);\n}\n\nhowManyArgs(\"string\"\
  , 45);    //2\nhowManyArgs();                //0\nhowManyArgs(12);             \
  \ //1\n```\n\n`FunctionExample06.htm`\n\n此示例显示了 2、0 和 1（按顺序）。通过这种方式，开发者可以自由让函数接受任意数量的参数并适当运行。考虑以下：\n\
  \n```javascript\nfunction doAdd() {\n    if(arguments.length == 1) {\n        alert(arguments[0]\
  \ + 10);\n    } else if (arguments.length == 2) {\n        alert(arguments[0] +\
  \ arguments[1]);\n    }\n}\n\ndoAdd(10);        //20\ndoAdd(30, 20);    //50\n```\n\
  \n`FunctionExample07.htm`\n\n\n\n\n`doAdd()` 函数在仅传入一个参数时会对该数字加 10；如果有两个参数，它们会被简单地相加并返回。因此，`doAdd(10)`\
  \ 返回 20，而 `doAdd(30,20)` 返回 50。这虽然不如函数重载（overloading）完美，但它是解决这一 `ECMAScript` 限制性的足够替代方案。\n\
  \n关于参数需要理解的另一个重要点是，`arguments` 对象可以与命名参数结合使用，如下：\n\n![image](img/logo1.gif)\n\n\
  ```\nfunction doAdd(num1, num2) {\n    if(arguments.length == 1) {\n        alert(num1\
  \ + 10);\n    } else if (arguments.length == 2) {\n        alert(arguments[0] +\
  \ num2);\n    }\n}\n```\n\n`FunctionExample08.htm`\n\n在对 `doAdd()` 函数的重写中，两个命名参数与\
  \ `arguments` 对象结合使用。命名参数 `num1` 持有的值与 `arguments[0]` 相同，因此它们可以互换使用（`num2` 和 `arguments[1]`\
  \ 亦然）。\n\n`arguments` 的另一个有趣特性是，它的值始终会与对应命名参数的值保持同步。例如：\n\n```\nfunction doAdd(num1,\
  \ num2) {\n    arguments[1] = 10;\n    alert(arguments[0] + num2);\n}\n```\n\n`FunctionExample09.htm`\n\
  \n此版本的 `doAdd()` 总是会将第二个参数覆盖为值 10。由于 `arguments` 对象中的值会自动反映在对应的命名参数上，因此对 `arguments[1]`\
  \ 的修改也会改变 `num2` 的值，使得两者的值都是 10。不过，这并不意味着它们访问的是同一个内存空间；它们的内存空间是独立的，但恰好保持了同步。这种效应是单向的：改变命名参数不会导致\
  \ `arguments` 中对应值发生变化。另一个需要记住的是：如果只传入了一个参数，那么将 `arguments[1]` 设置为值将不会反映在命名参数上。这是因为\
  \ `arguments` 对象的长度是根据传入参数的数量设置的，而不是函数列出的命名参数的数量。\n\n任何未传入函数的命名参数都会被自动赋值为 `undefined`。这类似于定义一个变量但未对其初始化。例如，如果只向\
  \ `doAdd()` 函数传入一个参数，那么 `num2` 的值就是 `undefined`。\n\n严格模式（Strict mode）对 `arguments`\
  \ 对象的使用方式进行了若干更改。首先，如上例所示的赋值不再有效。即使 `arguments[1]` 已赋值为 10，`num2` 的值仍然是 `undefined`。其次，尝试覆盖\
  \ `arguments` 的值会导致语法错误（代码不会执行）。\n\n![image](img/pen.gif)\n\n`ECMAScript` 中的所有参数都是通过值传递的。无法通过引用传递参数。\n\
  \n### 不支持重载\n\n`ECMAScript` 函数无法在传统意义上进行重载。在 `Java` 等其他语言中，可以编写两个同函数的定义，只要它们的签名（接受的参数类型和数量）是不同的即可。正如所介绍的，`ECMAScript`\
  \ 中的函数没有签名，因为参数被表示为包含零个或多个值的数组。由于缺少函数签名，真正的重载是不可能的。\n\n如果在 `ECMAScript` 中定义了两个同名的函数，那么最后一个函数将成为该名的所有者。考虑以下示例：\n\
  \n![image](img/logo1.gif)\n\n```\nfunction addSomeNumber(num){\n    return num +\
  \ 100;\n}\n\nfunction addSomeNumber(num) {\n    return num + 200;\n}\n\nvar result\
  \ = addSomeNumber(100);    //300\n```\n\n`FunctionExample10.htm`\n\n在这里，函数 `addSomeNumber()`\
  \ 被定义了两次。第一个版本在参数上加 100，第二个版本则加 200。当调用最后一行时，它返回 300，因为第二个函数覆盖了第一个。\n\n正如之前提到的，可以通过检查传入函数的参数类型和数量，然后做出相应的反应，来模拟方法的重载。\n\
  \n# 总结\n\nJavaScript 的核心语言语言特性在 `ECMA-262` 中被定义为名为 `ECMAScript` 的伪语言。`ECMAScript`\
  \ 包含了完成基础计算任务所需的所有基本语法、操作符、数据类型和对象，尽管它没有获取输入或产生输出的方法。理解 `ECMAScript` 及其复杂性对于完整理解在\
  \ Web 浏览器中实现的 JavaScript 至关重要。目前最广泛实现的 `ECMAScript` 版本是 `ECMA-262` 第三版，尽管许多人开始实现第五版。以下是\
  \ `ECMAScript` 的一些基本元素：\n\n*   `ECMAScript` 中的基本数据类型有 `Undefined`、`Null`、`Boolean`、`Number`\
  \ 和 `String`。\n*   与其他语言不同，它没有区分整数和浮点数的独立数据类型；`Number` 类型代表所有数字。\n*   它还有一种复杂数据类型\
  \ `Object`，它是语言中所有对象的基类型。\n*   严格模式对某些错误处理方式施加了限制。\n*   `ECMAScript` 中的所有参数都通过值传递。无法通过引用传递参数。\n\
  \n\n\n\n\n原始值和引用值的定义方式相似：创建一个变量并为其赋值一个值。然而，一旦这些值存储在变量中，你对这些值可以进行的操作是完全不同的。当你处理引用值时，可以随时添加、更改或删除属性和方法。考虑这个示例：\n\
  \n![image](img/logo1.gif)\n\n```\nvar person = new Object();\nperson.name = \"Nicholas\"\
  ;\nalert(person.name);    //\"Nicholas\"\n```\n\nDynamicPropertiesExample01.htm\n\
  \n在这里，创建了一个对象并将其存储在变量 `person` 中。接下来，添加了一个名为 `name` 的属性并为其赋值了字符串值 `\"Nicholas\"\
  `。从那时起，该属性是可以被访问的，直到对象被销毁或属性被显式删除。\n\n原始值无法为它们添加属性，尽管尝试这样做不会引起错误。这是一个示例：\n\n```\n\
  var name = \"Nicholas\";\nname.age = 27;\nalert(name.age);    //undefined\n```\n\
  \nDynamicPropertiesExample02.htm\n\n在这里，在字符串 `name` 上定义了一个名为 `age` 的属性并赋值了值 `27`。然而，在下一行，该属性就消失了。只有引用值可以动态定义属性以供以后使用。\n\
  \n### 值的拷贝\n\n除了存储方式的不同外，原始值和引用值在从一个变量拷贝到另一个变量时的行为也不同。当原始值从一个变量赋值给另一个变量时，存储在变量对象上的值会被创建并复制到新变量的位置。考虑以下示例：\n\
  \n```\nvar num1 = 5;\nvar num2 = num1;\n```\n\n在这里，`num1` 包含值 `5`。当 `num2` 初始化为\
  \ `num1` 时，它也获得了值 `5`。这个值与存储在 `num1` 中的值是完全独立的，因为它是该值的拷贝。现在这些每个现在都可以单独使用而不会产生侧影响。这个过程在图\
  \ 4-1 中有图示。\n\n图 4-1\n\n![image](img/f087-01.jpg)\n\n当引用值从一个变量赋值给另一个变量时，存储在变量对象上的值也会被复制到新变量的位置。区别在于，这个值实际上是指存储在堆上的对象的指针。一旦操作完成，两个变量指向完全相同的对象，因此对其中一个的更改会反映在另一个上，如下例：\n\
  \n```\nvar obj1 = new Object();\nvar obj2 = obj1;\nobj1.name = \"Nicholas\";\nalert(obj2.name);\
  \    //\"Nicholas\"\n```\n\n在这个示例中，变量 `obj1` 被填充了一个新的对象实例。该值随后被拷贝到 `obj2` 中，这意味着两个变量现在都指向同一个对象。当在\
  \ `obj1` 上设置属性 `name` 时，以后可以从 `obj2` 访问它，因为它们都指向同一个对象。图 4-2 显示了变量对象上的变量与堆上对象之间的关系。\n\
  \n图 4-2\n\n![image](img/f087-02.jpg)\n\n### 参数传递\n\nECMAScript 中所有的函数参数都是**按值传递**的。这意味着函数外部的值被拷贝到函数内部的参数中，其方式与值从一个变量拷贝到另一个变量相同。如果该值是原始值，那么它的行为就像原始变量拷贝；如果该值是引用，它的行为就像引用变量拷贝。这通常是开发者感到困惑的一，因为变量既可以通过值访问，也可以通过引用访问，但参数仅按值传递。\n\
  \n当参数按值传递时，该值被拷贝到一个局部变量中（一个具名的参数，在 ECMAScript 中是 `arguments` 对象中的一个槽位）。当参数按引用传递时，值在内存中的位置被存储在局部变量中，这意味着对局部变量的更改将反映在函数外部。（这在\
  \ ECMAScript 中是不可能的。）考虑以下示例：\n\n![image](img/logo1.gif)\n\n```\nfunction addTen(num)\
  \ {\n    num += 10;\n    return num;\n}\n\nvar count = 20;\nvar result = addTen(count);\n\
  alert(count);    //20 - 没变化\nalert(result);   //30\n```\n\nFunctionArgumentsExample01.htm\n\
  \n在这里，函数 `addTen()` 有一个参数 `num`，它本质上是一个局部变量。当调用时，变量 `count` 作为参数传入。该变量的值为 `20`，它被拷贝到参数\
  \ `num` 中供 `addTen()` 内部使用。在函数内部，参数 `num` 的值通过加 `10` 被改变，但这并没有改变函数外部存在的原始变量 `count`。参数\
  \ `num` 和变量 `count` 并不识别彼此；它们只是恰好具有相同的值。如果 `num` 是按引用传递的，那么 `count` 的值将变为 `30` 以反映函数内部的更改。当使用数字等原始值时，这一点显而易见，但在使用对象时情况就没那么清晰了。例如：\n\
  \n```\nfunction setName(obj) {\n    obj.name = \"Nicholas\";\n}\n\nvar person =\
  \ new Object();\nsetName(person);\nalert(person.name);    //\"Nicholas\"\n```\n\n\
  FunctionArgumentsExample02.htm\n\n在这段代码中，创建了一个对象并存储在变量 `person` 中。然后这个对象被传递给 `setName()`，并在那里被拷贝到\
  \ `obj`。在函数内部，`obj` 和 `person` 都指向同一个对象。当在函数内部的 `obj` 上设置 `name` 属性时，这一更改全局反映在堆上。许多开发者错误地假设，当对象的局部更改反映到全局时，意味着参数是按引用传递的。为了证明对象是按值传递的，考虑以下修改后的代码：\n\
  \n```\nfunction setName(obj) {\n    obj.name = \"Nicholas\";\n    obj = new Object();\n\
  \    obj.name = \"Greg\";\n}\n\nvar person = new Object();\nsetName(person);\nalert(person.name);\
  \    //\"Nicholas\"\n```\n\n这个示例与上一个唯一的区别是 `setName()` 中添加了两个行，这两行将 `obj` 重新定义为具有不同名称的新对象。当\
  \ `person` 被传递到 `setName()` 时，它的 `name` 属性被设置为 `\"Nicholas\"`。如果 `person` 是按引用传递的，那么\
  \ `person` 将自动指向名为 `\"Greg\"` 的对象。然而，当再次访问 `person.name` 时，它的值是 `\"Nicholas\"`，这表明即使参数的值发生了，原始引用仍然保持完好。当\
  \ `obj` 在函数内部被重写时，它变成了指向局部对象的指针。该局部对象在函数执行完毕后就会被销毁。\n\n![image](img/pen.gif)\n\n\
  将 ECMAScript 中的函数参数仅仅看作局部变量即可。\n\n### 确定类型\n\n上一章引入的 `typeof` 运算符是判断变量是否为原始类型的最佳方法。更具体地说，它是判断变量是字符串、数字、布尔值还是\
  \ undefined 的最佳方法。如果值是对象或 `null`，则 `typeof` 返回 `\"object\"`，例如此所示：\n\n![image](img/logo1.gif)\n\
  \n```\nvar s = \"Nicholas\";\nvar b = true;\nvar i = 22;\nvar u;\nvar n = null;\n\
  var o = new Object();\n\nalert(typeof s);   //string\nalert(typeof i);   //number\n\
  alert(typeof b);   //boolean\nalert(typeof u);   //undefined\nalert(typeof n); \
  \  //object\nalert(typeof o);   //object\n```\n\nDeterminingTypeExample01.htm\n\n\
  \n\n\n\n虽然 `typeof` 处理原始值时效果良好，但对于引用值来说它的作用很小。通常情况下，你并不关心一个值是否是对象——你真正想知道的是它是什么类型的对象。为了帮助这种识别，ECMAScript\
  \ 提供了 `instanceof` 运算符，其语法如下：\n\n```\nresult = variable instanceof constructor\n\
  ```\n\n如果 `variable` 是给定引用类型的实例（通过其原型链进行识别，如第 6 节中所示），则 `instanceof` 运算符返回 `true`。考虑此用例：\n\
  \n```\nalert(person instanceof Object);   // 变量 person 是一个 Object 吗？\nalert(colors\
  \ instanceof Array);    // 变量 colors 是一个 Array 吗？\nalert(pattern instanceof RegExp);\
  \  // 变量 pattern 是一个 RegExp 吗？\n```\n\n根据定义，所有引用值都是 `Object` 的实例，因此当 `instanceof`\
  \ 与引用值和 `Object` 构造函数一起使用时，它始终返回 `true`。同样，如果将 `instanceof` 用于原始值，它将始终返回 `false`，因为原始值不是对象。\n\
  \n![image](img/pen.gif)\n\n`typeof` 运算符在用于函数时也会返回“function”。在 Safari（第 5 版本之前）和\
  \ Chrome（第 7 版本之前）中，用于正则表达式时，`typeof` 返回“function”是由于一个实现细节。ECMA-262 规定，任何实现内部 `[[Call]]`\
  \ 方法的对象通过 `typeof` 都应该返回“function”。由于正则表达式在这些浏览器中实现了该方法，因此 `typeof` 返回“function”。在\
  \ Internet Explorer 和 Firefox 中，`typeof` 对正则表达式返回“object”。\n\n## 执行上下文与作用域 \n\n\
  执行上下文（execution context）的概念，简单地称为 `context`，在 JavaScript 中至关重要。变量或函数的执行上下文定义了它可以访问哪些其他数据，以及它应该如何表现。每个执行上下文都有关联的变量对象（variable\
  \ object），所有定义的变量和函数都存在于该对象中。代码无法访问该对象，但在后台用于处理数据。\n\n全局执行上下文是最外层的上下文。取决于 ECMAScript\
  \ 实现的宿主环境，代表此上下文的对象可能有所不同。在 Web 浏览器中，全局上下文认为是 `window` 对象（第 8 节讨论），因此所有全局变量和函数都是作为\
  \ `window` 对象的属性和方法创建的。当一个执行上下文执行完所有代码后，它就会被销毁，并带走其中定义的所有变量和函数（全局上下文直到应用程序退出——例如关闭网页或关闭网络浏览器——才会被销毁）。\n\
  \n每次函数调用都有自己的执行上下文。每当代码执行进入函数时，函数的上下文就会被推到上下文栈（context stack）上。在函数执行完毕后，栈会被弹出，将控制权交给之前执行的上下文。这种机制控制着整个\
  \ ECMAScript 程序的执行流。\n\n当代码在上下文中执行时，会创建一个由变量对象组成的作用域链（scope chain）。作用域链的作用为执行上下文可以访问的所有变量和函数提供有序访问。作用域链的头部始终是正在执行代码的上下文的变量对象。如果上下文是函数，则使用激活对象（activation\
  \ object）作为变量对象。激活对象始于一个名为 `arguments` 的单一定义变量（全局上下文不存在该变量）。链中的下一个变量对象来自包含它的上下文，再下一个则来自下一个包含它的上下文。这种模式一直持续到到达全局上下文；全局上下文的变量对象始终作用域链的最后一个。\n\
  \n标识符通过在作用域链中搜索标识符名称来解析。搜索始终从链的头部开始，并向后移动，直到找到标识符。（如果没有找到标识符，通常会发生错误）。\n\n考虑以下代码：\n\
  \n![image](img/logo1.gif)\n\n```\nvar color = \"blue\";\n\nfunction changeColor(){\n\
  \    if (color === \"blue\"){\n        color = \"red\";\n    } else {\n        color\
  \ = \"blue\";\n    }\n}\n\nchangeColor();\n```\n\nExecutionContextExample01.htm\n\
  \n在这个简单的示例中，函数 `changeColor()` 拥有一个包含两个对象的作用域链：它自己的变量对象（在其定义了 `arguments` 对象）以及全局上下文的变量对象。因此，变量\
  \ `color` 在函数内部是可以访问的，因为可以在作用域链中找到它。\n\n此外，局部定义的变量在局部上下文中可以与全局变量互换使用。这是一个例子：\n\n\
  ```\nvar color = \"blue\";\n\nfunction changeColor(){\n    var anotherColor = \"\
  red\";\n\n    function swapColors(){\n        var tempColor = anotherColor;\n  \
  \      anotherColor = color;\n        color = tempColor;\n\n        // color, anotherColor,\
  \ 和 tempColor 在这里都是可访问的\n    }\n\n    // color 和 anotherColor 在这里是可以访问的，但 tempColor\
  \ 不行\n    swapColors();\n}\n\n// 只有 color 在是可以访问的\nchangeColor();\n```\n\n这段代码中有三个执行上下文：全局上下文、`changeColor()`\
  \ 的局部上下文以及 `swapColors()` 的局部上下文。全局上下文有一个变量 `color` 和一个函数 `changeColor()`。`changeColor()`\
  \ 的局部上下文有一个名为 `anotherColor` 的变量和一个名为 `swapColors()` 的函数，但也可以访问全局上下文的变量 `color`。`swapColors()`\
  \ 的局部上下文有一个名为 `tempColor` 的变量，它仅在该上下文中可访问。全局上下文和 `swapColors()` 的局部上下文无法访问 `tempColor`。尽管在\
  \ `swapColors()` 内部，另外两个上下文的变量是可以完全访问的，因为它们是父执行上下文。图 4-3 表示了上一个示例的作用域链。\n\nFIGURE\
  \ 4-3\n\n![image](img/f092-01.jpg)\n\n在此图中，矩形代表特定的执行上下文。内部上下文可以通过作用域链访问所有外部上下文的所有内容，但外部上下文无法访问内部上下文中的任何内容。上下文之间的连接是线性的且有序的。每个上下文都可以沿着作用域链向上搜索变量和函数，但没有上下文可以沿着作用域链向下搜索另一个执行上下文。`swapColors()`\
  \ 局部上下文的作用域链中有三个对象：`swapColors()` 变量对象、来自 `changeColor()` 的变量对象以及全局变量对象。`changeColor()`\
  \ 上下文的作用域链只有两个对象：它自己的变量对象和全局变量对象。这意味着它无法访问 `swapColors()` 的上下文。\n\n![image](img/pen.gif)\n\
  \n函数参数被视为变量，并遵循与执行环境中任何其他变量相同的访问规则。\n\n## 作用域扩展\n\n尽管只有两种主要的执行上下文类型（全局和函数，第三种存在于\
  \ `eval()` 调用内部），但还有其他扩展作用域的方法。某些语句会导致作用域链头部临时添加内容，这些内容在代码执行后会被移除。这种情况发生两次，具体是在执行进入以下任一处时：\n\
  \n*   `try-catch` 语句中的 `catch` 块\n\n*   `with` 语句\n\n\n\n\n\n这两条语句都会将一个变量对象添加到作用域链的前端。对于\
  \ `with` 语句，指定的对象会被添加到作用域链；对于 `catch` 语句，会创建一个新的变量对象，并在其中包含对抛出的错误对象的声明。考虑以下内容：\n\
  \n![image](img/logo1.gif)\n\n```javascript\nfunction buildUrl() {\n    var qs =\
  \ \"?debug=true\";\n\n    with(location){\n        var url = href + qs;        \n\
  \    }\n\n    return url;\n}\n```\n\nExecutionContextExample03.htm\n\n在这个示例中，`with`\
  \ 语句作用于 `location` 对象，因此 `location` 本身被添加到作用域链的前端。在 `buildUrl()` 函数中定义了一个变量 `qs`。当引用变量\
  \ `href` 时，它实际上引用的是 `location.href`，它位于它自己的变量对象中。当引用变量 `qs` 时，它引用的是 `buildUrl()`\
  \ 中定义的变量，该变量位于函数上下文的变量对象中。在 `with` 语句内部有一个 `url` 的变量声明，它变成了函数上下文的一部分，因此可以作为函数的返回值返回。\n\
  \n![image](img/pen.gif)\n\n在 Internet Explorer 8 之前的 JavaScript 实现中存在偏差，`catch`\
  \ 语句中捕获的错误会被添加到执行上下文的变量对象中，而不是 `catch` 语句的变量对象，使其即使在 `catch` 块之外也能被访问。这在 Internet\
  \ Explorer 9 中得到了修复。\n\n## 无块级作用域\n\nJavaScript 缺乏块级作用域是一个常见的困惑来源。在其他类 C 语言中，用括号括起来的代码块拥有自己的作用域（更准确的描述是\
  \ ECMAScript 中它们自己的执行上下文），允许对变量进行条件定义。例如，以下代码的行为可能不符合预期：\n\n```javascript\nif (true)\
  \ {\n    var color = \"blue\";\n}\n\nalert(color);    //\"blue\"\n```\n\n在这里，变量\
  \ `color` 定义在 `if` 语句内部。在 `C`、`C++` 和 `Java` 等语言中，该变量会在 `if` 语句执行后被销毁。但在 JavaScript\
  \ 中，变量声明会将变量添加到当前的执行上下文中（在本例中为全局上下文）。在处理 `for` 语句时记住这一点很重要，它通常写如下所示：\n\n```javascript\n\
  for (var i=0; i < 10; i++){\n    doSomething(i);\n}\n\nalert(i);    //10\n```\n\n\
  在具有块级作用域的语言中，`for` 语句的初始化部分定义的变量仅存在于循环上下文中。在 JavaScript 中，变量 `i` 是 `for` 语句创建的，并在语句执行后继续存在于循环之外。\n\
  \n## 变量声明\n\n使用 `var` 声明变量时，它会被添加到可用的最直接上下文中。在函数中，最直接的是该函数的本地上下文；在 `with` 语句中，最直接的是函数上下文。如果变量在没有先声明的情况下被初始化，它会被自动添加到全局上下文，如例所示：\n\
  \n![image](img/logo1.gif)\n\n```javascript\nfunction add(num1, num2) {\n    var\
  \ sum = num1 + num2;\n    return sum;\n}\n\nvar result = add(10, 20);  //30\nalert(sum);\
  \                //报错，因为 sum 不是有效变量\n```\n\nExecutionContextExample04.htm\n\n在这里，函数\
  \ `add()` 定义了一个名为 `sum` 的本地变量，包含加法操作的结果。该值作为函数的返回值返回，但变量 `sum` 在函数外部是不可的。如果在此示例中省略了\
  \ `var` 关键字，则 `sum` 在 `add()` 被调用后变得可访问，如下所示：\n\n```javascript\nfunction add(num1,\
  \ num2) {\n    sum = num1 + num2;\n    return sum;\n}\n\nvar result = add(10, 20);\
  \  //30\nalert(sum);                //30\n```\n\nExecutionContextExample05.htm\n\
  \n在这里，变量 `sum` 被初始化为一个值，而从未使用 `var` 声明过。当调用 `add()` 时，`sum` 在全局上下文中创建，并在函数完成后继续存在，从而允许你稍后访问它。\n\
  \n![image](img/pen.gif)\n\n在不声明变量的情况下初始化变量是 JavaScript 编程中非常常见的错误，可能会导致错误。建议在初始化变量之前始终声明变量，以避免此类问题。在严格模式下，不声明而初始化变量会导致错误。\n\
  \n## 标识符查找\n\n当在特定上下文中为了读取或写入引用标识符时，必须进行搜索以确定该标识符代表什么。搜索从作用域链的前端开始，寻找具有给定名称的标识符。如果在本地上下文中找到了该标识符名称，则停止搜索并设置变量；如果搜索没有找到变量名，它将沿作用域链继续（注意作用域链中的对象也具有原型链，因此搜索可能包括每个对象的原型链）。此过程一直持续，直到搜索到达全局上下文的变量对象。如果在那里没有找到该标识符，说明它未被声明。\n\
  \n为了更好地说明标识符查找是如何发生的，请考虑以下示例：\n\n![image](img/logo1.gif)\n\n```javascript\nvar color\
  \ = \"blue\";\n\nfunction getColor(){\n    return color;\n}\n\nalert(getColor());\
  \  //\"blue\"\n```\n\nExecutionContextExample06.htm\n\n当调用示例中的 `getColor()` 时，引用了变量\
  \ `color`。此时，开始了双步搜索。首先搜索 `getColor()` 的变量对象中名为 `color` 的标识符。如果没有找到，进入下一个变量对象（全局上下文），然后查找名为\
  \ `color` 的标识符。因为该变量对象是定义变量的地方，搜索结束。图 4-4\n\n图 4-4\n\n![image](img/f095-01.jpg)\n\
  \n由于这种查找过程，引用本地变量会自动停止向其他变量对象的搜索。这意味着如果本地环境中存在同名标识符，则无法引用父环境中的标识符，如例所示：\n\n```javascript\n\
  var color = \"blue\";\n\nfunction getColor(){\n    var color = \"red\";\n    return\
  \ color;\n}\n\nalert(getColor());  //\"red\"\n```\n\nExecutionContextExample07.htm\n\
  \n在修改后的代码中，`getColor()` 函数内部声明了一个名为 `color` 的本地变量。调用函数时，该变量被声明。当执行函数的第二行时，它知道必须使用名为\
  \ `color` 的变量。搜索从本地上下文开始，在其中找到了值为 \"red\" 的名为 `color` 的变量。因为找到了变量，搜索停止并使用了本地变量，这意味着函数返回\
  \ \"red\"。在声明 `color` 为本地变量之后的任何代码行，如果不限定为 `window.color`，都无法访问全局 `color` 变量。\n\n\
  变量查找并不是没有代价的。访问本地变量比访问全局变量更快，因为不需要沿作用域链搜索。不过，JavaScript 引擎正在优化标识符查找，因此这种差异在未来可能变得微不足道。\n\
  \n垃圾回收\n\n\n\n\n\nJavaScript 是一种垃圾回收的语言，这意味着执行环境负责管理代码执行期间所需的内存。在 `C` 和 `C++` 这样的语言中，追踪内存使用是一个核心关注的问题，也是开发者面临的许多问题的根源。JavaScript\
  \ 通过自动分配所需的内存并回收不再使用的内存，让开发者告别了内存管理的烦恼。其基本思想非常简单：找出哪些变量将不再被使用，并释放与它们相关的内存。这个过程是周期性的，垃圾回收器会在指定的间隔内（或在代码执行中预定义的收集时机）运行。\n\
  \n考虑函数内部局部变量的正常生命周期。变量在函数执行期间产生。此时，系统会在栈上（也可能在堆上）分配内存以为该值提供存储空间。变量在函数内部被使用，然后函数结束。此时，该变量已不再被需要，因此它的内存可以被回收供以后使用。在这种情况下，变量不再被需要是显而易见的，但并非所有情况都如此显而易见。垃圾回收器必须跟踪哪些变量可以使用哪些可以使用，以便识别出可能的内存回收候选对象。识别未使用变量的策略可能会根据实现方式而不同，尽管浏览器传统上使用了两种策略。\n\
  \n### 标记-清除法 (Mark-and-Sweep)\n\nJavaScript 最常用的垃圾回收形式被称为“标记-清除法”。当一个变量进入上下文时（例如在函数内部声明变量时），它会被标记为“处于上下文中”。从逻辑上讲，处于上下文中的变量其内存永远不应该被释放，因为只要该上下文继续执行，它们就可能被使用。当一个变量离开上下文时，它也会被标记为“离开上下文”。\n\
  \n变量可以通过多种方式进行标记。当变量处于上下文中时，可能会翻转某个特定的位，也可能存在“上下文内”变量列表和一个“上下文外”变量列表，变量在这些列表之间移动。标记机制的实现方式并不重要；关键在于理论本身。\n\
  \n当垃圾回收器运行时，它会标记存储在内存中的所有变量（再次，通过任何方式）。然后，它会清除处于上下文中的变量以及被这些内变量引用的变量的标记。之后被标记的变量被认为已准备好删除，因为它们无法被任何上下文中的变量访问。垃圾回收器随后执行内存扫描，销毁每个标记的值并回收与它们相关的内存。\n\
  \n截至 2008 年，Internet Explorer、Firefox、Opera、Chrome 和 Safari 在其 JavaScript 实现中都使用了标记-清除法垃圾回收（或其变体），尽管垃圾回收的时机各不相同。\n\
  \n### 引用计数法 (Reference Counting)\n\n第二种不那么流行的垃圾回收类型是引用计数法。其核心思想是每个值都记录指向它的引用次数。当声明一个变量并分配一个引用值时，引用计数为\
  \ 1。如果将另一个变量赋值为该值，引用计数就会加 1。同样，如果一个指向该值的变量被另一个值覆盖，引用计数就会减 1。当一个值的引用计数达到零时，就没有方法可以访问到该值，回收相关内存是安全的。垃圾回收器在下次运行时会释放引用计数为零的值的内存。\n\
  \n引用计数法最初用于 Netscape Navigator 3.0，并立即遇到了一个严重问题：循环引用。当对象 A 有指向对象 B 的指针，而对象 B 又引用对象\
  \ A 时，就会发生循环引用，例如所示：\n\n```javascript\nfunction problem(){\n    var objectA = new\
  \ Object();\n    var objectB = new Object();\n\n    objectA.someOtherObject = objectB;\n\
  \    objectB.anotherObject = objectA;\n}\n```\n\n在这个示例中，`objectA` 和 `objectB` 通过它们的属性互相引用，这意味着每个对象的引用计数均为\
  \ 2。在标记-清除系统中，这并不是问题，因为在函数完成后，两个对象都离开了作用域。然而在引用计数系统中，`objectA` 和 `objectB` 在函数退出后仍将继续存在，因为它们的引用计数永远不会达到零。如果反复调用此函数，将导致大量内存永远无法被回收。由于这个原因，Netscape\
  \ 在 4.0 版本中放弃了引用计数垃圾回收例程，转而采用标记-清除法的实现。遗憾的是，引用计数问题并未到此结束。\n\nInternet Explorer 8\
  \ 及更早版本中的对象并非所有对象都是原生 JavaScript 对象。浏览器对象模型 (`BOM`）和文档对象模型 (`DOM`）中的对象在 `C++` 中实现为\
  \ `COM`（组件对象模型）对象，而 `COM` 对象使用引用计数进行垃圾回收。因此，即使 Internet Explorer JavaScript 引擎使用了标记-清除实现，在\
  \ JavaScript 中访问的任何 `COM` 对象仍然使用引用计数，这意味着当涉及 `COM` 对象时，循环引用仍然是一个问题。下面的简单示例演示了带有\
  \ `COM` 对象的循环引用：\n\n```javascript\nvar element = document.getElementById(\"some_element\"\
  );\nvar myObject = new Object();\nmyObject.element = element;\nelement.someObject\
  \ = myObject;\n```\n\n这个示例在 DOM 元素 (`element`) 和原生 JavaScript 对象 (`myObject`) 之间建立了一个循环引用。`myObject`\
  \ 变量有一个名为 `element` 的属性指向 `element`，而 `element` 变量有一个名为 `someObject` 的属性指向 `myObject`。由于这种循环引用，即使\
  \ DOM 元素从页面中移除，其内存也永远不会被回收。\n\n为了避免这种循环引用问题，在使用原生 JavaScript 对象和 DOM 元素后，你应该断开它们连接。例如，以下代码清理了之前示例中的循环引用：\n\
  \n```javascript\nmyObject.element = null;\nelement.someObject = null;\n```\n\n将变量设置为\
  \ `null` 可以有效地切断变量与其所引用值之间的连接。当下次垃圾回收器运行时，这些值将被删除，内存也将被回收。\n\nInternet Explorer\
  \ 9 通过将 BOM 和 DOM 对象转换为真正的 JavaScript 对象，解决了这些部分问题，从而避免了存在两种垃圾回收算法的问题，并消除了常见的内存泄漏问题。\n\
  \n![image](img/pen.gif)\n\n还有其他可能导致循环引用的模式，将在本书书中进行讨论。\n\n### 性能 (Performance)\n\
  \n垃圾回收器定期运行，如果内存中存在大量的变量分配，可能会是一个昂贵的过程，因此垃圾回收过程的时机非常重要。Internet Explorer 以垃圾回收运行频率相关的性能问题而闻名——它根据分配的数量来运行，具体为\
  \ 256 个变量分配、4096 个对象/数组字面量和数组槽，或 64kb 的字符串。一旦达到任何阈值，垃圾回收器就会运行。这种实现的问题在于，拥有这么多变量的脚本在其生命周期内可能一直拥有这么多变量，这意味着垃圾回收器运行得非常频繁。这个问题导致了严重的性能问题，并引发了\
  \ Internet Explorer 7 中垃圾回收例程的变更。\n\n\n\n\n随着 Internet Explorer 7 的发布，JavaScript\
  \ 引擎的垃圾回收程序经过调整，可以动态更改变量、字面量和/或数组槽触发垃圾回收的分配阈值。Internet Explorer 7 的初始阈值与 Internet\
  \ Explorer 6 相同。如果垃圾回收程序回收的分配内存少于 15%，则变量、字面量和/或数组槽的阈值将翻倍。如果该程序回收了高达 85% 的分配内存，则阈值将重置为默认值。这一简单的改变极大提高了浏览器在处理\
  \ JavaScript 密集型网页时的性能。\n\n![image](img/pen.gif)\n\n虽然不建议这样做，但在某些浏览器中是可以触发垃圾回收过程的。在\
  \ Internet Explorer 中，`window.CollectGarbage()` 方法会立即触发垃圾回收。在 Opera 7 及更高版本中，调用\
  \ `window.opera.collect()` 会启动垃圾回收过程。\n\n# 管理内存\n\n在具有垃圾回收机制的编程环境中，开发者不需要担心内存管理。然而，JavaScript\
  \ 运行的环境在内存管理和垃圾回收方面是独特的。Web 浏览器可用的内存通常远少于桌面应用程序。这更多的是一种安全特性，确保运行 JavaScript 的网页不会因为耗尽所有系统内存而导致操作系统崩溃。内存限制不仅影响变量分配，还会影响调用栈以及单线程中可以执行的语句数量。\n\
  \n将已用内存保持在最低可以获得更好的页面性能。优化内存使用的最佳方法是确保你只保留执行代码运行所必需的数据。当数据不再需要时，最好的做法是将值设置为 `null`\
  \ 以释放引用——这被称为对值进行取消引用（dereferencing）。这一建议主要适用于全局值和全局对象的属性。局部变量在离开作用域时会自动被取消引用，如下例所示：\n\
  \n```\nfunction createPerson(name){\n    var localPerson = new Object();\n    localPerson.name\
  \ = name;\n    return localPerson;\n}\n\nvar globalPerson = createPerson(\"Nicholas\"\
  );\n\n//对 globalPerson 进行某些操作\n\nglobalPerson = null;\n```\n\n在这段代码中，变量 `globalPerson`\
  \ 被填充了 `createPerson()` 函数返回的值。在 `createPerson()` 内部，`localPerson` 创建了一个对象并为其添加了\
  \ name 属性。变量 `localPerson` 作为函数的返回值返回并赋值给 `globalPerson`。由于 `localPerson` 在 `createPerson()`\
  \ 执行完毕后离开了作用域，因此它不需要显式地取消引用。因为 `globalPerson` 是一个全局变量，当它不再被需要时应该被取消引用，这正是最后一行所做的。\n\
  \n请记住，取消引用并不会自动回收与之相关的内存。取消引用的目的是确保该值已离开作用域，并在下次发生垃圾回收时被回收。\n\n# 总结\n\nJavaScript\
  \ 变量可以存储两种类型的值：原始值和引用值。原始值具有五种原始数据类型之一：Undefined（未）、Null（空）、Boolean（布尔）、Number（数字）和\
  \ String（字符串）。原始值和引用值具有以下特征：\n\n*   原始值的大小是固定的，因此存储在内存的栈（stack）中。\n*   将原始值从一个变量复制到另一个变量会创建值的副本。\n\
  *   引用值是对象，存储在内存堆中。\n*   包含引用值的变量实际上只包含指向对象的指针，而不是对象本身。\n*   将引用值复制到另一个变量只是复制了指针，因此两个变量最终都引用同一个对象。\n\
  *   `typeof` 运算符确定值的原始类型，而 `instanceof` 运算符用于确定值的引用类型。\n\n所有变量（原始和引用）都存在于执行上下文（也称为作用域）中，它决定了变量的生命周期以及代码哪些部分可以访问它。执行上下文可以总结如下：\n\
  \n*   执行上下文存在于全局（称为全局上下文）中和函数内部。\n*   每当进入一个新的执行上下文时，它都会创建一个作用域链来查找变量和函数。\n*   函数的局部上下文不仅可以访问该作用域内的变量，还可以访问任何包含它的上下文以及全局上下文中的变量。\n\
  *   全局上下文只能访问全局上下文中的变量和函数，不能直接访问局部上下文中的任何数据。\n*   变量的执行上下文有助于确定内存何时被释放。\n\nJavaScript\
  \ 是一个带有垃圾回收的编程环境，开发者无需担心内存分配或回收。JavaScript 的垃圾回收程序可以总结如下：\n\n*   离开作用域的值将被自动标记待回收，并在垃圾回收过程中被删除。\n\
  *   主要的垃圾回收算法被称为“标记-清除”（mark-and-sweep），它会标记当前未使用的值，然后去回收这些内存。\n*   另一种算法是引用计数（reference\
  \ counting），它跟踪指向特定值的引用次数。JavaScript 引擎不再使用这种算法，但由于 JavaScript 中访问了非原生 JavaScript\
  \ 对象（如 DOM 元素），它仍然影响 Internet Explorer。\n*   当代码中存在循环引用时，引用计数会导致问题。\n*   取消引用不仅有助于处理循环引用，也有助于垃圾回收。为了辅助内存回收，全局对象、全局对象上的属性以及循环引用在不再需要时都应该被取消引用。\n\
  \n# 第 5 章：引用类型\n\n## 本章内容：\n\n*   操作对象\n*   创建和操作数组\n*   理解基础 JavaScript 数据类型\n\
  *   处理原始值和原始包装器\n\n引用值（对象）是特定引用类型的实例。在 ECMAScript 中，引用类型是用于组合数据和功能结构的结构，通常被错误地称为类。尽管技术上是面向对象的语言，但\
  \ ECMAScript 缺乏一些与面向对象编程相关的构造，包括类和接口。引用类型有时称为对象定义，因为它们描述了对象应该拥有的属性和方法。\n\n![image](img/pen.gif)\n\
  \n尽管引用类型与类相似，但这两个概念并不等同。为了避免混淆，本书的其余部分将不再使用“类”（class）一词。\n\n再次，对象被视为特定引用类型的实例。通过使用\
  \ `new` 运算符加上构造函数来创建新对象。构造函数本质上是一个创建新对象的函数。考虑以下代码：\n\n```\nvar person = new Object();\n\
  ```\n\n此行代码创建了 Object 类型的新实例并存储在变量 person 中。使用的构造函数是 `Object()`，它创建一个仅具有默认属性和方法的简单对象。ECMAScript\
  \ 提供了许多原生引用类型（如 Object），帮助开发者处理常见的计算任务。\n\n## 对象类型\n\n\n\n\n到目前为止，大多数引用值示例都使用了 `Object`\
  \ 类型，它是 ECMAScript 中最常用的类型之一。虽然 `Object` 实例并没有多少功能，但它们非常适合在应用程序中存储和传输数据。\n\n有两种方法可以显式创建\
  \ `Object` 实例。第一种是使用 `new` 符配合 `Object` 构造函数如下：\n\n![image](img/logo1.gif)\n\n```\n\
  var person = new Object();\nperson.name = \"Nicholas\";\nperson.age = 29;\n```\n\
  \n`ObjectTypeExample01.htm`\n\n另一种方法是使用对象字面量符号（object literal notation）。对象字面量是对象定义的简写形式，旨在简化具有许多属性的对象创建。例如，下面的代码使用对象字面量定义了与上一个示例相同的\
  \ `person` 对象：\n\n```\nvar person = {\n    name : \"Nicholas\",\n    age : 29\n\
  };\n```\n\n`ObjectTypeExample02.htm`\n\n在这个示例中，左大括号（`{`）表示对象字面量的开始，因为它出现在表达式环境中。ECMAScript\
  \ 中的表达式环境是指期望某个值（表达式）的环境。赋值运算符表示接下来期望一个值，因此左大括号表示表达式的开始。同样的大括号当它出现在语句环境中（例如跟在 `if`\
  \ 语句条件之后）时，则表示块语句的开始。\n\n接下来，指定了 `name` 属性，后面跟着冒号，然后是属性的值。逗号用于分隔对象字面量中的属性，因此在字符串\
  \ `\"Nicholas\"` 之后有一个逗号，但在值 `29` 之后没有逗号，因为 `age` 是对象中的最后一个属性。在最后一个属性后包含逗号会导致 Internet\
  \ Explorer 7 及更早版本以及 Opera 产生错误。\n\n在使用对象字面量符号时，属性名也可以作为字符串或数字指定，在此示例中：\n\n```\n\
  var person = {\n    \"name\" : \"Nicholas\",\n    \"age\" : 29,\n    5: true\n};\n\
  ```\n\n此示例产生一个具有 `name` 属性、`age` 属性和属性 `\"5\"` 的对象。注意，数字型属性名会自动转换为字符串。\n\n还可以使用对象字面量符号创建一个仅包含默认属性和方法的对象，只需在大括号之间留空即可，如下：\n\
  \n```\nvar person = {};                    //同于 new Object()\nperson.name = \"Nicholas\"\
  ;\nperson.age = 29;\n```\n\n此示例与本节中的第一个等效，尽管它看起来有点奇怪。建议仅在需要指定属性以提高可读性时使用对象字面量符号。\n\
  \n![image](img/pen.gif)\n\n通过对象字面量符号定义对象时，实际上从未调用 `Object` 构造函数（Firefox 2 及更早版本调用过\
  \ `Object` 构造函数；这在 Firefox 3 中被更改了）。\n\n虽然使用两种创建 `Object` 实例的方法都可以，但开发者倾向于使用对象字面量符号，因为它需要的代码更少，视觉上封装了所有相关数据。事实上，对象字面量已成为向函数传递大量可选参数的首选方式，如下例：\n\
  \n![image](img/logo1.gif)\n\n```\nfunction displayInfo(args) {\n    var output =\
  \ \"\";\n\n    if (typeof args.name == \"string\"){\n        output += \"Name: \"\
  \ + args.name + \"\\n\";\n    }\n\n    if (typeof args.age == \"number\") {\n  \
  \      output += \"Age: \" + args.age + \"\\n\";\n    }\n\n    alert(output);\n\
  }\n\ndisplayInfo({ \n    name: \"Nicholas\", \n    age: 29\n});\n\ndisplayInfo({\n\
  \    name: \"Greg\"\n});\n```\n\n`ObjectTypeExample04.htm`\n\n在这里，函数 `displayInfo()`\
  \ 接受一个名为 `args` 的单个参数。该参数可能带有 `name` 或 `age` 属性，或者两者都有，或者两个都没有。该函数的设计是通过 `typeof`\
  \ 操作符测试每个属性是否存在，然后根据可用性构建要显示的消息。然后该函数被调用两次，每次都在对象字面量中指定不同的数据。该函数在两种情况下都能正常工作。\n\n\
  ![image](img/pen.gif)\n\n当有大量可以传递到函数的可选参数时，这种参数传递模式是最好的。总的来说，命名参数更容易处理，但当有许多可选参数时，它们可能会变得臃肿。最好的方法是对于必需的参数使用命名参数，并使用对象字面量来包含多个可选参数。\n\
  \n虽然对象属性通常使用点符号表示（dot notation）访问，这是许多面向对象语言的共同特征，但也可以通过括号符号（bracket notation）访问属性。当你使用括号符号时，将一个包含属性名的字符串放在括号之间，如下例所示：\n\
  \n```\nalert(person[\"name\"]);    //\"Nicholas\"\nalert(person.name);       //\"\
  Nicholas\"\n```\n\n从功能上讲，这两种方法之间没有区别。括号符号的主要优势在于它允许你使用变量进行属性访问，如下例所示：\n\n```\nvar\
  \ propertyName = \"name\";\nalert(person[propertyName]);    //\"Nicholas\"\n```\n\
  \n当属性名包含可能导致语法错误或关键字/保留字的字符时，你也可以使用括号符号。例如：\n\n```\nperson[\"first name\"] = \"\
  Nicholas\";\n```\n\n由于名称 `\"first name\"` 包含空格，你不能使用点符号来访问它。属性名可以包含非字母数字字符，只需要使用括号符号来访问它们。\n\
  \n总的来说，除非使用变量访问属性，否则推荐点符号。\n\n## 数组类型\n\n在 `Object` 类型之后，`Array` 类型可能是 ECMAScript\
  \ 中最常用的类型。ECMAScript 数组与大多数语言中的数组非常不同。与其他语言一样，ECMAScript 数组是数据的有序列表，但它们可以在每个位置中持有任何类型的数据。这意味着可以创建一个第一个位置是字符串、第二个是数字、第三个是对象的数组，以此此类推。ECMAScript\
  \ 数组还是动态大小的，会自动适应添加的任何数据。\n\n数组可以通过两种基本方式创建。第一种是使用 `Array` 构造函数，如下：\n\n```\nvar\
  \ colors = new Array();\n```\n\n如果你知道数组中将有多少项，可以将计数传递给构造函数，并将创建一个具有该值的 `length`\
  \ 属性。例如，下面的代码创建一个初始长度值为 20 的数组：\n\n```\nvar colors = new Array(20);\n```\n\n`Array`\
  \ 构造函数也可以传递应该包含在数组中的项。下面创建一个包含三个字符串值的数组：\n\n```\nvar colors = new Array(\"red\"\
  , \"blue\", \"green\");\n```\n\n可以通过向构造函数传递单个值来创建一个单值数组。这变得有点复杂，因为提供单个数字参数总是创建一个具有给定数量项的数组，而任何其他类型的参数都会创建一个包含指定值的单项数组。这是一个示例：\n\
  \n```\nvar colors = new Array(3);      //创建一个包含三项的数组\nvar names = new Array(\"Greg\"\
  );  //创建一个包含单项（字符串\"Greg”）的数组\n```\n\n`ArrayTypeExample01.htm`\n\n在使用 `Array` 构造函数时，可以省略\
  \ `new` 操作符。结果相同，如下所示：\n\n```\nvar colors = Array(3);      //创建一个包含三项的数组\nvar names\
  \ = Array(\"Greg\");  //创建一个包含单项（字符串\"Greg”）的数组\n```\n\n创建数组的第二种方法是使用数组字面量符号。数组字面量通过使用方括号并在它们之间放置逗号分隔的项列表来指定，如下例所示：\n\
  \n\n\n\n\n```javascript\nvar colors = [\"red\", \"blue\", \"green\"]; //creates\
  \ an array with three strings\nvar names = [];                        //creates\
  \ an empty array\nvar values = [1,2,];                   //AVOID! Creates an array\
  \ with 2 or 3 items\nvar options = [,,,,,];                 //AVOID! creates an\
  \ array with 5 or 6 items\n```\n\n## ArrayTypeExample02.htm\n\n在此代码中，第一行创建了一个包含三个字符串值的数组。第二行通过空方括号\
  \ `[]` 创建了一个空数组。第三行展示了在数组字面量的最后一个值后遗留逗号的影响：在 Internet Explorer 8 及更早版本中，`values`\
  \ 变成一个包含值 `1`、`2` 和 `undefined` 的三元素数组；在所有其他浏览器中，`values` 是一个包含值 `1` 和 `2` 的二元素数组。这是由于\
  \ Internet Explorer 在实现浏览器第 8 版本的 ECMAScript 时，关于数组字面量的一个 bug 导致的。该 bug 的另一个示例在最后一行中，它创建了一个包含\
  \ 5 个（在 Internet Explorer 9+、Firefox、Opera、Safari 和 Chrome 中）或 6 个（在 Internet Explorer\
  \ 8 及更早版本中）元素的数组。通过省略逗号之间的值，每个元素都会获得 `undefined` 值，这在逻辑上等同于调用 `Array` 构造函数并传入项目数量。然而，由于早期版本\
  \ Internet Explorer 实现的不一致，强烈建议不要使用这种语法。\n\n![image](img/pen.gif)\n\n与对象一样，当使用数组字面量符号创建数组时，不会调用\
  \ `Array` 构造函数（Firefox 3 之前的除外）。\n\n要获取和设置数组值，可以使用方括号并提供值的从 0 开始的数字索引，如下：\n\n```javascript\n\
  var colors = [\"red\", \"blue\", \"green\"];           //define an array of strings\n\
  alert(colors[0]);                                //display the first item\ncolors[2]\
  \ = \"black\";                             //change the third item\ncolors[3] =\
  \ \"brown\";                             //add a fourth item\n```\n\n方括号内提供的索引指示要访问的值。如果索引小于数组的项目数量，它将返回存储在对应项目中的值，例如示例中\
  \ `colors[0]` 显示 `\"red\"`。设置值的工作方式相同，会替换指定位置的值。如果将值设置到数组末尾之后的索引（例如示例中的 `colors[3]`），数组长度将自动扩展为该索引加\
  \ 1（因此在示例中长度变为 4，因为使用的索引是 3）。\n\n数组中的项目数量存储在 `length` 属性中，它始终返回 0 或正整数，如下例所示：\n\n\
  ```javascript\nvar colors = [\"red\", \"blue\", \"green\"];    //creates an array\
  \ with three strings\nvar names = [];                           //creates an empty\
  \ array\n\nalert(colors.length);    //3\nalert(names.length);     //0\n```\n\n`length`\
  \ 的一个特性特性是非只读的。通过设置 `length` 属性，你可以轻松地从数组删除项目或向末尾添加项目。考虑这个示例：\n\n![image](img/logo1.gif)\n\
  \n```javascript\nvar colors = [\"red\", \"blue\", \"green\"];    //creates an array\
  \ with three strings\ncolors.length = 2;\nalert(colors[2]);        //undefined\n\
  ```\n\n## ArrayFilterExample03.htm\n\n在这里，数组 `colors` 初始有三个值。将长度设置为 2 会移除最后一个项目（位置\
  \ 2），使其无法再通过 `colors[2]` 访问。如果将长度设置为大于数组项目数量的数字，则新项目每个将被填充为 `undefined` 值，如本例所示：\n\
  \n![image](img/logo1.gif)\n\n```javascript\nvar colors = [\"red\", \"blue\", \"\
  green\"];    //creates an array with three strings\ncolors.length = 4;\nalert(colors[3]);\
  \        //undefined\n```\n\n## ArrayFilterExample04.htm\n\n此代码将 `colors` 数组的长度设置为\
  \ 4，尽管它只包含三个项目。数组中位置 3，因此尝试访问其值会导致返回特殊值 `undefined`。\n\n`length` 属性在向数组末尾添加项目时也有帮助，如下例所示：\n\
  \n```javascript\nvar colors = [\"red\", \"blue\", \"green\"];    //creates an array\
  \ with three strings\ncolors[colors.length] = \"black\";          //add a color\
  \ (position 3)\ncolors[colors.length] = \"brown\";          //add another color\
  \ (position 4)\n```\n\n## ArrayFilterExample05.htm\n\n数组中的最后一个项目始终位于 `length - 1`\
  \ 位置，因此下一个可用空槽位于 `length` 位置。每当在数组最后一个项目之后添加项目时，`length` 属性就会自动更新以反映变化。这意味着 `colors[colors.length]`\
  \ 在示例的第二行中为位置 3 赋值，在最后一行中为位置 4 赋值。当项目放置在当前数组大小之外时，新长度会自动计算，通过对位置加 1 实现，如示例所示：\n\n\
  ```javascript\nvar colors = [\"red\", \"blue\", \"green\"];    //creates an array\
  \ with three strings\ncolors[99] = \"black\";                     //add a color\
  \ (position 99)\nalert(colors.length);  //100\n```\n\n## ArrayFilterExample06.htm\n\
  \n在此代码中，`colors` 数组在位置 99 插入了一个值，导致长度为 100 (99 + 1)。其他每个项目（3 到 98 之间都不存在，因此访问时会返回\
  \ `undefined`。\n\n![image](img/pen.gif)\n\n数组最多可以包含 4,294,967,295 个项目，这对于所有的编程需求都足够了。如果你尝试添加更多，会发生异常。\n\
  \n## 检测数组\n\n自从 ECMAScript 3 定义以来，经典问题之一就是真正确定一个给定对象是否为数组。在处理单个网页（因此是单个全局作用域）时，`instanceof`\
  \ 运算符运行良好：\n\n```javascript\nif (value instanceof Array){\n    //do something on\
  \ the array\n}\n```\n\n`instanceof` 的唯一问题是它假设了单一的全局上下文。如果你在处理网页中的多个帧（frames），你实际上是在处理两个不同的全局上下文，因此有两个版本的\
  \ `Array` 构造函数。如果你将数组从一个帧传递到第二个帧，该数组与第二个帧中原生创建的数组构造不同。\n\n为了解决这个问题，ECMAScript 5\
  \ 引入了 `Array.isArray()` 方法。该方法的目的是无论在哪个全局执行上下创建，都能确定判断给定值是否为数组。用法示例：\n\n```javascript\n\
  if (Array.isArray(value)){\n    //do something on the array\n}\n```\n\nInternet\
  \ Explorer 9+、Firefox 4+、Safari 5+、Opera 10.5+ 和 Chrome 都实现了 `Array.isArray()`。对于尚未实现此方法的浏览器进行确定数组检测，请参见第\
  \ 22 章中的“安全类型检测”章节。\n\n## ArrayFilterExample07.htm\n\n\n\n\n\n在此段代码中，首先显式地调用 `toString()`\
  \ 和 `valueOf()` 方法来返回数组的字符串表示，该表示会将字符串组合，并用逗号分隔。最后一行将数组直接传递给 `alert()`。由于 `alert()`\
  \ 期望一个字符串，它会在后台调用 `toString()`，以获得与直接调用 `toString()` 相同的结果。\n\n`toLocaleString()`\
  \ 方法返回可能与 `toString()` 和 `valueOf()` 相同，但并不总是如此。当在数组上调用 `toLocaleString()` 时，它会创建一个由逗号分隔的数组值字符串。这与其他两个方法的唯一区别在于，`toLocaleString()`\
  \ 调用每个项的 `toLocaleString()` 而不是 `toString()` 来获取其字符串值。考虑以下示例：\n\n![image](img/logo1.gif)\n\
  \n```javascript\nvar person1 = {\n    toLocaleString : function () {\n        return\
  \ \"Nikolaos\";\n    },\n\n    toString : function() {\n        return \"Nicholas\"\
  ;\n    }\n};\n\nvar person2 = {\n    toLocaleString : function () {\n        return\
  \ \"Grigorios\";\n    },\n\n    toString : function() {\n        return \"Greg\"\
  ;\n    }\n};\n\nvar people = [person1, person2];\nalert(people);               \
  \       //Nicholas,Greg\nalert(people.toString());           //Nicholas,Greg\nalert(people.toLocaleString());\
  \     //Nikolaos,Grigorios\n```\n\nArrayTypeExample08.htm\n\n在这里定义了两个对象，`person1`\
  \ 和 `person2`。每个对象都定义了 `toString()` 方法和 `toLocaleString()` 方法，它们返回不同的值。创建了一个数组 `people`\
  \ 来包含这两个对象。当将其传递给 `alert()` 时，输出是 \"Nicholas,Greg\"，因为对数组中的每个项都调用了 `toString()`\
  \ 方法（这与下一行显式调用 `toString()` 相同）。当在数组上调用 `toLocaleString()` 时，结果是 \"Nikolaos,Grigorios\"\
  ，因为这在数组的每个项上调用了 `toLocaleString()`。\n\n继承的方法 `toLocaleString()`、`toString()` 和 `valueOf()`\
  \ 分别都将数组项作为逗号分隔的字符串返回。可以使用 `join()` 方法构造一个具有不同分隔符的字符串。`join()` 方法接受一个参数，即要使用的字符串分隔符，并返回一个包含所有项的字符串。考虑这个示例：\n\
  \n```javascript\nvar colors = [\"red\", \"green\", \"blue\"];\nalert(colors.join(\"\
  ,\"));      //red,green,blue\nalert(colors.join(\"||\"));     //red||green||blue\n\
  ```\n\nArrayTypeJoinExample01.htm\n\n在这里，在 `colors` 数组上使用 `join()` 方法来复制 `toString()`\
  \ 的输出。通过传递一个逗号，结果是逗号分隔的值列表。在最后一行，传递了双竖线，导致字符串 \"red||green||blue\"。 如果没有向 `join()`\
  \ 方法传递任何值或 `undefined`，则使用逗号作为分隔符。Internet Explorer 7 及更早版本错误地使用字符串 \"undefined\"\
  \ 作为分隔符。\n\n![image](img/pen.gif)\n\n如果数组中的某项是 `null` 或 `undefined`，它在 `join()`、`toLocaleString()`、`toString()`\
  \ 和 `valueOf()` 的结果中将表示为空字符串。\n\n## 栈方法 (Stack Methods)\n\nECMAScript 数组的有趣之处之一是它们提供了一种方法让数组的行为像其他数据结构。数组对象可以像栈一样，栈是一组限制项的插入和删除的数据结构之一。栈被称为后进先出\
  \ (LIFO) 结构，意味着最近添加的项是第一个被移除的项。栈中项插入（称为 `push`）和移除（称为 `pop`）仅发生在一个点：栈顶。ECMAScript\
  \ 数组专门提供了 `push()` 和 `pop()` 方法来允许类似栈的行为。\n\n`push()` 方法接受任意数量的参数，并将它们添加到数组的末尾，返回数组的新长度。另一方面，`pop()`\
  \ 方法移除数组的最后一个项，减少数组的长度并返回该项。考虑这个示例：\n\n![image](img/logo1.gif)\n\n```javascript\n\
  var colors = new Array();                      //创建一个数组\nvar count = colors.push(\"\
  red\", \"green\");       //推入两个项\nalert(count);  //2\n\ncount = colors.push(\"black\"\
  );                  //再推入一项\nalert(count);  //3\n\nvar item = colors.pop();    \
  \                   //获取最后一个项\nalert(item);   //\"black\"\nalert(colors.length);\
  \  //2\n```\n\nArrayTypeExample09.htm\n\n在此段代码中，创建了一个数组用作栈（注意，不需要特殊代码来实现此功能；`push()`\
  \ 和 `pop()` 是数组的默认方法）。首先，使用 `push()` 将两个字符串推送到数组末尾，结果存储在变量 `count` 中（其值为 2）。然后，推送了另一个值，结果再次存储在\
  \ `count` 中。由于数组现在有三个项，`push()` 返回 3。当调用 `pop()` 时，它返回数组中的最后一个项，即字符串 \"black\"。然后数组就剩下两个项了。\n\
  \n栈方法也可以与所有其他数组方法结合使用，如示例所示：\n\n![image](img/logo1.gif)\n\n```javascript\nvar colors\
  \ = [\"red\", \"green\", \"blue\"];\ncolors.push(\"brown\");              //推入一项\n\
  colors[3] = \"black\";               //添加一项\nalert(colors.length);  //4\n\nvar item\
  \ = colors.pop();           //获取最后一个项\nalert(item);  //\"black\"\n```\n\nArrayTypeExample10.htm\n\
  \n在这里，初始化了两个值。通过 `push()` 添加了第三个值。`pop()` 返回最后一个项。\n\n## 队列方法 (Queue Methods)\n\n\
  正如栈在 LIFO 数据结构中限制访问一样，队列在先进先出 (FIFO) 数据结构中限制访问。队列向列表末尾添加项并从前端获取项。`push()` 方法向数组末尾添加项，模拟队列需要一个获取数组中第一个项的方法。该方法是\
  \ `shift()`，它移除数组的第一个项并返回它，减少数组长度。将 `shift()` 与 `push()` 结合可以将数组用作队列：\n\n```javascript\n\
  var colors = new Array();                      //创建一个数组\nvar count = colors.push(\"\
  red\", \"green\");       //推入两个项\nalert(count);  //2\n\ncount = colors.push(\"black\"\
  );                  //推入一项\nalert(count);  //3\n\nvar item = colors.shift();   \
  \                  //获取第一个项\nalert(item);   //\"red\"\nalert(colors.length);  //2\n\
  ```\n\nArrayTypeExample11.htm\n\n此示例使用 `push()` 方法创建了一个包含三种颜色的数组。高亮行显示使用 `shift()`\
  \ 方法获取数组中的第一个项，即 \"red\"。移除该项后，“green\" 移到第一个位置，“black\" 移到第二个位置，留下了两个项。\n\nECMAScript\
  \ 还为数组提供了 `unshift()` 方法。正如名称所示，`unshift()` 是 `shift()` 的相反操作：它将任意数量的项添加到数组前端并返回数组的新长度。通过将\
  \ `unshift()` 与 `pop()` 结合，可以模拟相反方向的队列，即新值添加到数组前端而从末尾获取值，如示例所示：\n\n```javascript\n\
  var colors = new Array();                      //创建一个数组\nvar count = colors.unshift(\"\
  red\", \"green\");    //推入两个项\nalert(count);  //2\n\ncount = colors.unshift(\"black\"\
  );               //推入一项\nalert(count);  //3\n\nvar item = colors.pop();        \
  \             //获取第一个项\nalert(item);   //\"green\"\nalert(colors.length);  //2\n\
  ```\n\nArrayTypeExample12.htm\n\n在此段代码中，创建了一个数组并使用 `unshift()` 进行填充。首先将 \"red\"\
  \ 和 \"green\" 添加到数组中，然后添加 \"black\"，导致顺序为 \"black\", \"red\", \"green\"。当调用 `pop()`\
  \ 时，它移除最后一个项 \"green\" 并返回它。\n\n\n\n\n\n![image](img/pen.gif)\n\nInternet Explorer\
  \ 7 及更早版本对于 `unshift()` 总是返回 `undefined`，而不是数组的新长度。Internet Explorer 8 在不处于兼容模式时会正确返回长度。\n\
  \n## 排序方法\n\n有两种方法可以直接处理数组中已有项的重新排序：`reverse()` 和 `sort()`。正如预期的那样，`reverse()` 方法简单地反转数组中元素的顺序。参考以下代码：\n\
  \n![image](img/logo1.gif)\n\n```\nvar values = [1, 2, 3, 4, 5];\nvalues.reverse();\n\
  alert(values);       //5,4,3,2,1\n```\n\nArrayTypeExample13.htm\n\n在这里，数组的值最初被设置为\
  \ 1, 2, 3, 4 和 5。对数组调用 `reverse()` 会将顺序反转为 5, 4, 3, 2, 1。这种方法非常直接，但没有提供多少灵活性，这就是\
  \ `sort()` 方法派上用场的地方。\n\n默认情况下，`sort()` 方法将项按升序排列——最小值在前，最大值在后。为了实现这一点，`sort()`\
  \ 方法会对每个项调用 `String()` 转换函数，然后比较这些字符串以确定正确的顺序。即使数组中的所有项都是数字，在本例所示：\n\n```\nvar values\
  \ = [0, 1, 5, 10, 15];\nvalues.sort();\nalert(values);    //0,1,10,15,5\n```\n\n\
  ArrayTypeExample14.htm\n\n尽管此示例中的值是从正确的数字顺序开始的，但 `sort()` 方法会根据它们的字符串等效值更改该顺序。因此，即使\
  \ 5 小于 10，在进行字符串比较时，字符串 \"10\" 会在 \"5\" 之前，所以数组会相应更新。显然，这在很多情况下并不是最优解决方案，因此 `sort()`\
  \ 方法允许你传递一个比较函数，用指示哪个值应该在哪个值之前。\n\n比较函数接受两个参数，如果第一个参数应该在第二个参数之前，则返回负数；如果参数相等，则返回零；如果第一个参数应该在第二个参数之后，则返回正数。这是一个简单的比较函数的示例：\n\
  \n![image](img/logo1.gif)\n\n```\nfunction compare(value1, value2) {\n    if (value1\
  \ < value2) {\n        return -1;\n    } else if (value1 > value2) {\n        return\
  \ 1;\n    } else {\n        return 0;\n    }\n}\n```\n\nArrayTypeExample15.htm\n\
  \n此比较函数适用于大多数数据类型，并可以通过将其作为参数传递给 `sort()` 方法来使用，如下例所示：\n\n```\nvar values = [0,\
  \ 1, 5, 10, 15];\nvalues.sort(compare);\nalert(values);    //0,1,5,10,15\n```\n\n\
  当比较函数传递给 `sort()` 方法时，数字将保持正确的顺序。当然，如果你只是像这样简单交换返回值，比较函数也可以产生倒序的结果：\n\n```javascript\n\
  function compare(value1, value2) {\n    if (value1 < value2) {\n        return 1;\n\
  \    } else if (value1 > value2) {\n        return -1;\n    } else {\n        return\
  \ 0;\n    }\n}\n\nvar values = [0, 1, 5, 10, 15];\nvalues.sort(compare);\nalert(values);\
  \    //15,10,5,1,0\n```\n\nArrayTypeExample16.htm\n\n在这个修改后的示例中，如果第一个值应该在第二个值之后，比较函数返回\
  \ 1；如果第一个值应该在第二个值之前，则返回 -1。交换这些意味着较大的值将在前，数组将按倒序排序。当然，如果你只是想反转数组中元素的顺序，`reverse()`\
  \ 是比排序快得多的替代方案。\n\n![image](img/pen.gif)\n\n`reverse()` 和 `sort()` 都会返回所作用数组的引用。\n\
  \n一个更简单版本的比较函数可以用于数值类型，以及 `valueOf()` 方法返回数值的对象（例如 `Date` 对象）。在任何情况下，你都可以像这里所示从第一个值中减去第二个值：\n\
  \n```javascript\nfunction compare(value1, value2){\n    return value2 - value1;\n\
  }\n```\n\n由于比较函数通过返回小于零、零或大于零的数字来工作，因此减法操作可以恰当地处理所有情况。\n\n## 操作方法\n\n有多种方法可以处理数组已包含的项。例如，`concat()`\
  \ 方法允许根据当前数组中的所有项创建一个新数组。该方法首先创建一个数组的副本，然后将方法参数附加到末尾并返回新构建的数组。当不传递参数时，`concat()`\
  \ 简单地克隆数组并返回它。如果传递了一个或多个数组，`concat()` 将这些数组中的每个项附加到结果的末尾。如果值不是数组，它们将被简单的附加到结果数组的末尾。考虑这个示例：\n\
  \n![image](img/logo1.gif)\n\n```\nvar colors = [\"red\", \"green\", \"blue\"];\n\
  var colors2 = colors.concat(\"yellow\", [\"black\", \"brown\"]);\n\nalert(colors);\
  \     //red,green,blue\nalert(colors2);    //red,green,blue,yellow,black,brown\n\
  ```\n\nArrayTypeConcat01.htm\n\n在此示例中，colors 数组包含三个值。对 colors 调用 concat 方法传递了 \"\
  yellow\" 和一个包含 \"black\" 和 \"brown\" 的数组。结果 `colors2` 包含 \"red\", \"green\", \"\
  blue\", \"yellow\", \"black\", \"brown\"。原始的 colors 数组保持不变。\n\n下一个方法是 `slice()`，它创建一个包含一个或多个项的数组。如果只有一个参数，该方法返回从位置到数组结束的所有项。如果有两个参数，该方法返回起始和结束位置之间的项。请记住以下操作：\n\
  \n![image](img/logo1.gif)\n\n```\nvar colors = [\"red\", \"green\", \"blue\", \"\
  yellow\", \"purple\"];\nvar colors2 = colors.slice(1);\nvar colors3 = colors.slice(1,4);\n\
  \nalert(colors2); //green,blue,yellow,purple\nalert(colors3); //green,blue,yellow\n\
  ```\n\nArrayTypeSlice01.htm\n\n在此示例中，colors 数组最初有五个项。调用 slice 并传递 1 会产生一个包含四个项的数组，省略了\
  \ \"red\"，因为操作是从位置 1 开始的。`colors2` 包含 \"green\", \"blue\", \"yellow\", \"purple\"\
  。`colors3` 通过调用 slice 并传递 1 和 4 构建，这意味着方法将从位置 1 的项开始复制，并在位置 3 的项处停止。结果是 colors3\
  \ 包含 \"green\", \"blue\" 和 \"yellow\"。\n\n如果 slice() 的起始或结束位置是负数，则从数组长度中减去该数来确定相应的位置。例如，在五个项的数组上调用\
  \ slice(-2, -1) 等同于调用 slice(3, 4)。如果结束位置小于起始位置，则返回空数组。\n\n也许最强大的数组方法是 `splice()`，它可以有多种方式。`splice()`\
  \ 的主要目的是向数组中间插入项，但该方法有三种不同的使用方式。如下：\n\n- **删除** —— 通过指定两个参数（要删除的第一个项的位置和要删除的项数）从数组中删除任意数量的项。例如，`splice(0,2)`\
  \ 删除两个项。\n- **插入** —— 通过提供三个或更多参数在特定位置插入项：起始位置、0（要删除的项数）以及要插入的项。可选，你可以指定第四个参数、第五个参数或任何数量的其他参数来插入。例如，`splice(2,\
  \ 0, \"red\", \"green\")` 在位置 2 处插入字符串 \"red\" 和 \"green\"。\n\n\n\n\n\n## 替换 — 如果你指定三个参数，可以在删除项的同时在特定位置插入项：起始位置、要删除的项数以及任意数量的插入项。插入的项数不需要与删除的项数匹配。例如，`splice(2,\
  \ 1, \"red\", \"green\")` 会删除位置 2 处的一个项，然后在位置 2 处向数组插入字符串 `\"red\"` 和 `\"green\"\
  `。\n\n`splice()` 方法始终返回一个数组，其中包含从数组中移除的任何项（如果没有删除任何项，则返回空数组）。下面的代码演示了这三 用法：\n\n\
  ![image](img/logo1.gif)\n\n```javascript\nvar colors = [\"red\", \"green\", \"blue\"\
  ];\nvar removed = colors.splice(0,1);                  //移除第一个项\nalert(colors);\
  \     //green,blue\nalert(removed);    //red - 单元素数组\n\nremoved = colors.splice(1,\
  \ 0, \"yellow\", \"orange\"); //在位置 1 插入两个项\nalert(colors);     //green,yellow,orange,blue\n\
  alert(removed);    //空数组\n\nremoved = colors.splice(1, 1, \"red\", \"purple\");\
  \    //插入两个值，移除一个\nalert(colors);     //green,red,purple,orange,blue\nalert(removed);\
  \    //yellow - 单元素数组\n```\n\nArrayTypeSpliceExample01.htm\n\n此示例从包含三个项的 `colors`\
  \ 数组开始。第一次调用 `splice` 时，它简单地移除了第一个项，使得 `colors` 剩下 `\"green\"` 和 `\"blue\"`。第二次调用\
  \ `splice()` 时，它在位置 1 处插入两个项，导致 `colors` 包含 `\"green\"`、`\"yellow\"`、`\"orange\"\
  ` 和 `\"blue\"`。此时没有项被移除，因此返回空数组。最后一次调用 `splice()` 时，它从位置 1 开始移除一个项，并插入 `\"red\"\
  ` 和 `\"purple\"`。在执行完所有代码后，`colors` 数组包含 `\"green\"`、`\"red\"`、`\"purple\"`、`\"\
  orange\"` 和 `\"blue\"`。\n\n## 位置方法\n\nECMAScript 5 为数组实例增加了两个定位方法：`indexOf()` 和\
  \ `lastIndexOf()`。这两个方法每个都接受两个参数：要查找的项以及一个可选的起始查找索引。`indexOf()` 方法从数组开头（项 0）开始搜索并持续到末尾，而\
  \ `lastIndexOf()` 则从数组的最后一个项开始持续到开头。\n\n这些方法都返回该项在数组中的位置，如果该项不在数组中，则返回 `-1`。在将第一个参数与数组中的每个项进行比较时，使用的是身份比较，这意味着项之间必须严格相等，就如同使用\
  \ `===` 进行比较一样。以下是这种用法的一些示例：\n\n```javascript\nvar numbers = [1,2,3,4,5,4,3,2,1];\n\
  \nalert(numbers.indexOf(4));        //3\nalert(numbers.lastIndexOf(4));    //5\n\
  \nalert(numbers.indexOf(4, 4));     //5\nalert(numbers.lastIndexOf(4, 4)); //3\n\
  \nvar person = { name: \"Nicholas\" };\nvar people = [{ name: \"Nicholas\" }];\n\
  var morePeople = [person];\n\nalert(people.indexOf(person));     //-1\nalert(morePeople.indexOf(person));\
  \ //0\n```\n\nArrayIndexOfExample01.htm\n\n`indexOf()` 和 `lastIndexOf()` 方法使得定位数组内的特定项变得轻而易举，并且支持\
  \ Internet Explorer 9+、Firefox 2+、Safari 3+、Opera 9.5+ 以及 Chrome。\n\n## 迭代方法\n\n\
  ECMAScript 5 为数组定义了五个迭代方法。每个方法都接受两个参数：一个在每个项上运行的函数，以及一个用于运行该函数的可选作用域对象（这会影响 `this`\
  \ 的值）。传递给其中一个方法的函数将接收三个参数：数组项的值、该项在数组中的位置以及数组对象本身。根据方法的不同，该函数的执行结果可能会、也可能不会影响方法的返回值。迭代方法如下：\n\
  \n*   `every()` — 在数组的每个项上运行给定的函数，如果该函数对每个项都返回 `true`，则返回 `true`。\n*   `filter()`\
  \ — 在数组的每个项上运行给定的函数，并返回一个包含所有函数返回 `true` 项的数组。\n*   `forEach()` — 在数组的每个项上运行给定的函数。此方法没有返回值。\n\
  *   `map()` — 在数组的每个项上运行给定的函数，并将每次函数调用的结果在一个数组中。\n*   `some()` — 在数组的每个项上运行给定的函数，如果该函数对任意一个项返回\
  \ `true`，则返回 `true`。\n\n这些方法不会改变数组中所包含的值。\n\n在这些方法中，最相似的是 `every()` 和 `some()`，它们都查询数组中符合某些标准的项。对于\
  \ `every()`，传递的函数必须对每个项都返回 `true`，方法才能返回 `true`；否则它返回 `false`。相反，`some()` 方法只要有一个一个项导致传递的函数返回\
  \ `true`，它就会返回 `true`。以下是一个示例：\n\n![image](img/logo1.gif)\n\n```javascript\nvar\
  \ numbers = [1,2,3,4,5,4,3,2,1];\n\nvar everyResult = numbers.every(function(item,\
  \ index, array){\n    return (item > 2);\n});\n\nalert(everyResult);       //false\n\
  \nvar someResult = numbers.some(function(item, index, array){\n    return (item\
  \ > 2);\n});\n\nalert(someResult);       //true\n```\n\nArrayAndSomeExample01.htm\n\
  \n此代码同时调用了 `every()` 和 `some()`，其使用的函数在项大于 2 时返回 true。对于 `every()`，结果是 false，因为只有部分项符合条件。对于\
  \ `some()`，结果是 true，因为至少有一个项是大于 2 的。\n\n下一个方法是 `filter()`，它使用给定的函数来确定某项是否应该包含在数组中。例如，要返回所有大于\
  \ 2 的数字的数组，可以使用以下代码：\n\n![image](img/logo1.gif)\n\n```javascript\nvar numbers =\
  \ [1,2,3,4,5,4,3,2,1];\n\nvar filterResult = numbers.filter(function(item, index,\
  \ array){\n    return (item > 2);\n});\n\nalert(filterResult);   //[3,4,5,4,3]\n\
  ```\n\nArrayFilterExample01.htm\n\n在这里，包含 3, 4, 5, 4 和 3 的数组是由 `filter()` 创建并返回的，因为传递的函数对这些每一个项都返回了\
  \ true。\n\n`map()` 方法也返回一个数组。数组中的每个项都是在数组项上运行传递的函数的结果。例如，你可以将数组中的每个数字乘以 2，并返回这些数字的数组，如下所示：\n\
  \n```javascript\nvar numbers = [1,2,3,4,5,4,3,2,1];\n\nvar mapResult = numbers.map(function(item,\
  \ index, array){\n    return item * 2;\n});\n\nalert(mapResult);   [2,4,6,8,10,8,6,4,2]\n\
  ```\n\nArrayMapExample01.htm\n\n此示例代码返回一个将每个数字乘以 2 的数组。该方法对于创建项之间相互对应的数组非常有帮助。\n\
  \n最后一个方法是 `forEach()`，它简单地在数组的每个项上运行给定的函数。它没有返回值，并且与使用 for 循环遍历数组相同。这里有一个示例：\n\n\
  ```javascript\nvar numbers = [1,2,3,4,5,4,3,2,1];\n\nnumbers.forEach(function(item,\
  \ index, array){\n    //在此处执行某些操作\n});\n```\n\n## 归约方法\n\nECMAScript 5 还为数组引入两个归约方法：`reduce()`\
  \ 和 `reduceRight()`。这两个方法都会遍历数组中的所有项，并构建出一个最终返回的值。`reduce()` 方法从第一个项开始并到最后一个项执行此操作，而\
  \ `reduceRight()` 则从最后一个项开始并到第一个项执行。\n\n\n\n\n这两个方法都接受两个参数：一个用于在每个项上调用的函数，以及一个作为还原基础的可选初始值。传递给\
  \ `reduce()` 或 `reduceRight()` 的函数接受四个参数：上一个值、当前值、项目的索引以及数组对象。函数返回的任何值都将自动作为下一个项目的第一个参数传递。第一次迭代发生在数组的第二个项上，因此第一个参数是数组中的第一个项，第二个参数是数组中的第二个项。\n\
  \n你可以使用 `reduce()` 方法来执行诸如对数组中所有数字求和的操作。示例：\n\n![image](img/logo1.gif)\n\n```\n\
  var values = [1,2,3,4,5];\nvar sum = values.reduce(function(prev, cur, index, array){\n\
  \    return prev + cur;\n});\nalert(sum); //15\n```\n\nArrayReductionExample01.htm\n\
  \n第一次执行回调函数时，`prev` 是 1，`cur` 是 2。第二次，`prev` 是 3（1 和 2 相加的结果），`cur` 是 3（数组中的第三个项）。这种序列会持续下去，直到访问所有项并返回结果。\n\
  \n`reduceRight()` 方法的工作方式相同，只是方向相反。考虑以下示例：\n\n```\nvar values = [1,2,3,4,5];\nvar\
  \ sum = values.reduceRight(function(prev, cur, index, array){\n    return prev +\
  \ cur;\n});\nalert(sum); //15\n```\n\n在这一版本的代码中，第一次执行回调函数时，`prev` 是 5，`cur` 是 4。当然，结果是相同的，因为操作是简单的加法。\n\
  \n使用 `reduce()` 还是 `reduceRight()` 的决定完全取决于访问数组项的方向。在其他所有方面，它们都是相等的。\n\n还原方法支持 Internet\
  \ Explorer 9+、Firefox 3+、Safari 4+、Opera 10.5 和 Chrome。\n\n# 日期类型\n\nECMAScript\
  \ Date 类型基于 Java 早期版本的 `java.util.Date`。因此，Date 类型将日期存储为自 UTC 1970 年 1 月 1 日（通用时间码）午夜以来经过的毫秒数。使用这种数据存储格式，Date\
  \ 类型可以准确表示 1970 年 1 月 1 日之前或之后 285,616 年的日期。\n\n要创建一个日期对象，使用 `new` 运算符配合 `Date`\
  \ 构造函数，如下：\n\n![image](img/logo1.gif)\n\n```\nvar now = new Date();\n```\n\nDateTypeExample01.htm\n\
  \n当不带参数使用 `Date` 构造函数时，创建的对象将被分配当前的日期和时间。要根据另一个日期或时间创建日期，必须传入日期的毫秒表示（UTC 1970 年\
  \ 1 月 1 日午夜后的毫秒数）。为了辅助这一过程，ECMAScript 提供了两个方法：`Date.parse()` 和 `Date.UTC()`。\n\n\
  `Date.parse()` 方法接受一个表示日期的字符串参数。它尝试将字符串转换为日期的毫秒表示。ECMA-262 第五版定义了 `Date.parse()`\
  \ 应该支持的日期格式，填补了第三版留下的空白。所有实现现在必须支持以下日期格式：\n\n* 月/日/年（例如 6/13/2004）\n* 月份名称 日，年（例如\
  \ January 12, 2004）\n* 星期 月份名称 日 年 时:分:秒 时区（例如 Tue May 25 2004 00:00:00 GMT-0700）\n\
  * ISO 8601 扩展格式 YYYY-MM-DDTHH:mm:ss.sssZ（例如 2004-05-25T00:00:00）。这仅在符合 ECMAScript\
  \ 5 的实现中有效。\n\n例如，为 2004 年 5 月 25 日创建一个日期对象，可以使用以下代码：\n\n```\nvar someDate = new\
  \ Date(Date.parse(\"May 25, 2004\"));\n```\n\nDateTypeExample01.htm\n\n如果传递 `Date.parse()`\
  \ 的字符串不是日期，则返回 `NaN`。如果直接传递字符串，`Date` 构造函数将在后台调用 `Date.parse()`，这意味着以下代码与之前的示例相同：\n\
  \n```\nvar someDate = new Date(\"May 25, 2004\");\n```\n\n这段代码产生的结果与之前的示例相同。\n\n\
  ![image](img/pen.gif)\n\nDate 类型及其在各种浏览器中的实现存在许多怪癖。它倾向于将超出范围的值替换为当前值以产生输出，因此当尝试解析\
  \ \"January 32, 2007\" 时，某些浏览器会将其解释为 \"February 1, 2007\"，而 Opera 则倾向于插入当前月份的当前日期，返回\
  \ \"January current_day, 2007\"。这意味着在 9 月 21 日运行代码会返回 \"January 21, 2007\"。\n\n\
  `Date.UTC()` 方法也返回日期的毫秒表示，但它使用与 `Date.parse()`不同的信息来构建该值。`Date.UTC()` 的参数是年、从 0\
  \ 开始的月份、日、时、分、秒和毫秒。如果省略日，则默认为 1；如果省略时，则默认为 0；如果省略分，则默认为 0；如果省略秒，则默认为 0。\n\n（此处省略原文中重复的段落，已按要求清理）\n\
  \n在这一版本的代码中，第一次执行回调函数时，`prev` 是 5，`cur` 是 4。结果是相同的，因为操作是简单的加法。（注：输入文本包含重复部分，已清理）。\n\
  \n使用 `reduce()` 还是 `reduceRight()` 的决定完全取决于访问数组项的方向。在其他所有方面，它们都是相等的。\n\n还原方法支持 Internet\
  \ Explorer 9+、Firefox 3+、Safari 4+、Opera 10.5 和 Chrome。\n\n# 日期类型\n\nECMAScript\
  \ Date 类型基于 Java 早期版本的 `java.util.Date`。因此，Date 类型将日期存储为自 UTC 1970 年 1 月 1 日（通用时间码）午夜以来经过的毫秒数。使用这种数据存储格式，Date\
  \ 类型可以准确表示 1970 年 1 月 1 日之前或之后 285,616 年的日期。\n\n要创建一个日期对象，使用 `new` 运算符配合 `Date`\
  \ 构造函数，如下：\n\n![image](img/logo1.gif)\n\n```\nvar now = new Date();\n```\n\nDateTypeExample01.htm\n\
  \n当不带参数使用 `Date` 构造函数时，创建的对象将被分配当前的日期和时间。要根据另一个日期或时间创建日期，必须传入日期的毫秒表示（UTC 1970 年\
  \ 1 月 1 日午夜后的毫秒数）。为了辅助这一过程，ECMAScript 提供了两个方法：`Date.parse()` 和 `Date.UTC()`。\n\n\
  `Date.parse()` 方法接受一个表示日期的字符串参数。它尝试将字符串转换为日期的毫秒表示。ECMA-262 第五版定义了 `Date.parse()`\
  \ 应该支持的日期格式，填补了第三版留下的空白。所有实现现在必须支持以下日期格式：\n\n* 月/日/年（例如 6/13/2004）\n* 月份名称 日，年（例如\
  \ January 12, 2004）\n* 星期 月份名称 日 年 时:分:秒 时区（例如 Tue May 25 2004 00:00:00 GMT-0700）\n\
  * ISO 8601 扩展格式 YYYY-MM-DDTHH:mm:ss.sssZ（例如 2004-05-25T00:00:00）。这仅在符合 ECMAScript\
  \ 5 的实现中有效。\n\n例如，为 2004 年 5 月 25 日创建一个日期对象，可以使用以下代码：\n\n```\nvar someDate = new\
  \ Date(Date.parse(\"May 25, 2004\"));\n```\n\nDateTypeExample01.htm\n\n如果传递 `Date.parse()`\
  \ 的字符串不是日期，则返回 `NaN`。如果直接传递字符串，`Date` 构造函数将在后台调用 `Date.parse()`，这意味着以下代码与之前的示例相同：\n\
  \n```\nvar someDate = new Date(\"May 25, 2004\");\n```\n\n这段代码产生的结果与之前的示例相同。\n\n\
  ![image](img/pen.gif)\n\nDate 类型及其在各种浏览器中的实现存在许多怪癖。它倾向于将超出范围的值替换为当前值以产生输出，因此当尝试解析\
  \ \"January 32, 2007\" 时，某些浏览器会将其解释为 \"February 1, 2007\"，而 Opera 则倾向于插入当前月份的当前日期，返回\
  \ \"January current_day, 2007\"。这意味着在 9 月 21 日运行代码会返回 \"January 21, 2007\"。\n\n\
  `Date.UTC()` 方法也返回日期的毫秒表示，但它使用与 `Date.parse()`不同的信息来构建该值。`Date.UTC()` 的参数是年、从 0\
  \ 开始的月份、日、时、分、秒和毫秒。如果省略日，则默认为 1；如果省略时，则默认为 0；如果省略分，则默认为 0；如果省略秒，则默认为 0。\n\n（此处省略原文中重复的段落，已按要求清理）\n\
  \n\n\n\n与其他引用类型类型一样，`Date` 类型也重写了 `toLocaleString()`、`toString()` 和 `valueOf()`，但与之前的类型不同，每个方法返回的内容都是不同的。\n\
  \n`Date` 类型的 `toLocaleString()` 方法返回与浏览器运行区域语言格式匹配的日期和时间。这通常意味着格式中包含时间的 AM 或 PM\
  \ 标记，且不包含任何时区信息（具体格式随浏览器而异）。`toString()` 方法通常返回带有时区信息的日期和时间，且时间通常以 24 小时制表示（小时范围为\
  \ 0 到 23）。以下列表显示了各种浏览器在“en-US”语言区域下，表示 2007 年 2 月 1 日午夜 PST（太平洋标准时间）的日期/时间时，为 `toLocaleString()`\
  \ 和 `toString()` 使用的格式：\n\n### Internet Explorer 8\n- `toLocaleString()` – Thursday,\
  \ February 01, 2007 12:00:00 AM\n- `toString()` – Thu Feb 1 00:00:00 PST 2007\n\n\
  ### Firefox 3.5\n- `toLocaleString()` – Thursday, February 01, 2007 12:00:00 AM\n\
  - `toString()` – Thu Feb 01 2007 00:00:00 GMT-0800 (Pacific Standard Time)\n\n###\
  \ Safari 4\n- `toLocaleString()` – Thursday, February 01, 2007 00:00:00\n- `toString()`\
  \ – Thu Feb 01 2007 00:00:00 GMT-0800 (Pacific Standard Time)\n\n### Chrome 4\n\
  - `toLocaleString()` – Thu Feb 01 2007 00:00:00 GMT-0800 (Pacific Standard Time)\n\
  - `toString()` – Thu Feb 01 2007 00:00:00 GMT-0800 (Pacific Standard Time)\n\n###\
  \ Opera 10\n- `toLocaleString()` – 2/1/2007 12:00:00 AM\n- `toString()` – Thu, 01\
  \ Feb 2007 00:00:00 GMT-0800\n\n如你所示，浏览器为每个方法返回的格式之间存在一些显著差异。这些差异意味着 `toLocaleString()`\
  \ 和 `toString()` 仅对调试有用，而不用于显示。\n\n`Date` 类型的 `valueOf()` 方法完全不返回字符串，因为它被重写为返回日期的毫秒表示，以便运算符（如小于和大于）能够对日期值正常工作。请考虑此示例：\n\
  \n![image](img/logo1.gif)\n\n```\nvar date1 = new Date(2007, 0, 1);          //\"\
  January 1, 2007\"\nvar date2 = new Date(2007, 1, 1);          //\"February 1, 2007\"\
  \n\nalert(date1 < date2);  //true\nalert(date1 > date2);  //false\n```\n\n`DateTypeValueOfExample01.htm`\n\
  \n2007 年 1 月 1 日在 2007 年 2 月 1 日之前，因此说前者小于后者是有合理的。因为 2007 年 1 月 1 日的毫秒表示小于 2007\
  \ 年 2 月 1 日的毫秒表示，当比较这些日期时，小于运算符返回 true，这提供了一种确定日期顺序的简单方法。\n\n## 日期格式化方法\n\n有几种 `Date`\
  \ 类型方法专门用于将日期格式化为字符串。如下：\n\n- `toDateString()` — 以特定实现的格式显示日期的星期几、月份、日期和年份。\n- `toTimeString()`\
  \ — 以特定实现的格式显示日期的小时、分钟、秒和时区。\n- `toLocaleDateString()` — 以特定实现和区域特定的格式显示日期的星期几、月份、日期和年份。\n\
  - `toLocaleTimeString()` — 以特定实现的格式显示日期的小时、分钟和秒。\n- `toUTCString()` — 以特定实现的格式显示完整的\
  \ UTC 日期。\n\n这些方法的输出与 `toLocaleString()` 和 `toString()` 一样，在不同浏览器之间差异很大，因此不能在用户界面中一致地显示日期。\n\
  \n![image](img/pen.gif)\n\n还有一个名为 `toGMTString()` 的方法，它等同于 `toUTCString()` 并为了向后兼容而提供。然而，规范建议新代码专门使用\
  \ `toUTCString()`。\n\n## 日期/时间组件方法\n\n`Date` 类型的其余方法（列如下表所示）直接处理获取和设置日期值的特定部分。注意对\
  \ UTC 日期的引用是指在不考虑时区偏移的情况下解释的日期值（转换为 GMT 时的日期）。\n\n| 方法 | 描述 |\n| --- | --- |\n|\
  \ `getTime()` | 返回日期的毫秒表示；同于 `valueOf()`。 |\n| `setTime(milliseconds)` | 设置日期的毫秒表示，从而更改整个日期。\
  \ |\n| `getFullYear()` | 返回四位年份（2007 而不仅仅是 07）。 |\n| `getUTCFullYear()` | 返回四位年份。\
  \ |\n| `setFullYear(year)` | 设置四位年份。 |\n| `getMonth()` | 返回月份（0-11）。 |\n| `setMonth(month)`\
  \ | 设置月份（0-11）。 |\n| `getDate()` | 返回日期（1-31）。 |\n| `setDate(day)` | 设置日期（1-31）。\
  \ |\n| `getHours()` | 返回小时（0-23）。 |\n| `setHours(hours)` | 设置小时（0-23）。 |\n| `getMinutes()`\
  \ | 返回分钟（0-59）。 |\n| `setMinutes(minutes)` | 设置分钟（0-59）。 |\n| `getSeconds()` | 返回秒（0-59）。\
  \ |\n| `setSeconds(seconds)` | 设置秒（0-59）。 |\n| `getDay()` | 返回星期几（0-6）。 |\n| `getUTCFullYear()`\
  \ | 返回 UTC 日期的四位年份。 |\n| `getUTCMth()` | 返回 UTC 日期的月份。 |\n| `getUTCDate()` | 返回\
  \ UTC 日期的日期。 |\n| `getUTCHours()` | 返回 UTC 日期的小时。 |\n| `getUTCMinutes()` | 返回 UTC\
  \ 日期的分钟。 |\n| `getUTCSeconds()` | 返回 UTC 日期的秒。 |\n| `getUTCDay()` | 返回 UTC 日期的星期几。\
  \ |\n\n## REGEXP 类型\n\nECMAScript 通过 `RegExp` 类型支持正则表达式。可以使用类似于 Perl 的语法轻松创建正则表达式，如下所示：\n\
  \n```\nvar expression = /pattern/flags;\n```\n\n\n\n\n表达式的模式部分可以是任何简单或复杂的正则表达式，包括字符类、量词、分组、正向先行断言和反引用。每个表达式都可以有零或多个标志，用于指示表达式的运行行为。支持的三个标志表示匹配模式，如下：\n\
  \n- `g` — 表示全局模式，意味着模式将应用于整个字符串，而不是在找到第一个匹配项后停止。\n- `i` — 表示不区分大小写模式，意味着在确定匹配项时会忽略模式和字符串的大小写。\n\
  - `m` — 表示多行模式，意味着在到达某一行文本的末尾后，模式将继续查找匹配项。\n\n正则表达式是通过模式和这些标志的组合创建的，以产生不同的结果，如下例所示：\n\
  \n```\n/*\n * 匹配字符串中所有的 \"at\" 实例。\n */\nvar pattern1 = /at/g;\n\n/*\n * 匹配第一个 \"\
  bat\" 或 \"cat\" 实例，不区分大小写。\n */\nvar pattern2 = /\\[bc]at/i;\n\n/*\n * 匹配所有以 \"\
  at\" 结尾的三字符组合，不区分大小写。\n */\nvar pattern3 = /.at/gi;\n```\n\n与其他语言中的正则表达式一样，当所有元字符作为模式的一部分使用时，必须对其进行转义。这些元字符如下：\n\
  \n```\n( [ { \\ ^ $ | ) ] } ? * + .\n```\n\n每个元字符在正则表达式语法中都有一个或多个用途，因此当您想要匹配字符串中的该字符时，必须使用反斜杠进行转义。以下是一些示例：\n\
  \n```\n/*\n * 匹配第一个 \"bat\" 或 \"cat\" 实例，不区分大小写。\n */\nvar pattern1 = /[bc]at/i;\n\
  \n/*\n * 匹配第一个 \"[bc]at\" 实例，不区分大小写。\n */\nvar pattern2 = /\\[bc]at/i;\n\n/*\n *\
  \ 匹配所有以 \"at\" 结尾的三字符组合，不区分大小写。\n */\nvar pattern3 = /.at/gi;\n\n/*\n * 匹配所有的 \"\
  .at\" 实例，不区分大小写。\n */\nvar pattern4 = /\\.at/gi;\n```\n\n在这段代码中，`pattern1` 匹配所有\
  \ \"bat\" 或 \"cat\" 的实例，不区分大小写。要直接匹配 `[bc]at`，两个方括号都需要用反斜杠进行转义，如 `pattern2` 所示。在\
  \ `pattern3` 中，点表示任何字符都可以出现在 \"at\" 之前以形成匹配。如果您想匹配 `.at`，则点需要被转义，如 `pattern4` 所示。\n\
  \n前面的示例都是使用字面量形式定义正则表达式的。正则表达式也可以通过 `RegExp` 构造函数创建，该函数接受两个参数：用于匹配的字符串模式和一个可选的标志字符串。任何可以使用字面量语法定义的正则表达式也可以使用构造函数进行定义，如例所示：\n\
  \n```\n/*\n * 匹配第一个 \"bat\" 或 \"cat\" 实例，不区分大小写。\n */\nvar pattern1 = /[bc]at/i;\n\
  \n/*\n * 与 pattern1 相同，只是使用了构造函数。\n */\nvar pattern2 = new RegExp(\"[bc]at\", \"\
  i\");\n```\n\n在这里，`pattern1` 和 `pattern2` 定义了等效的正则表达式。注意，`RegExp` 构造函数的两个参数都是字符串（不应将正则表达式字面量传递给\
  \ `RegExp` 构造函数）。由于 `RegExp` 构造函数的模式参数是一个字符串，在某些情况下您需要对字符进行双重转义。所有元字符都必须双重转义，已经转义的字符也是如此，例如\
  \ `\\n`（在字符串中通常转义的字符在正则表达式字符串中使用会变为 `\\\\`）。下表显示了一些字面量形式的模式以及使用 `RegExp` 构造函数所需的等效字符串。\n\
  \n| 字面量模式 (LITERAL PATTERN) | 字符串等效值 (STRING EQUIVALENT) |\n| :--- | :--- |\n| ---\
  \ | --- |\n| `/\\[bc\\]at/` | `\\[bc\\]at` |\n| `/.at/` | `\\\\.at` |\n| `/name\\\
  /age/` | `name\\\\age` |\n| `/\\d.\\d{1,2}/` | `\\\\d.\\\\d{1,2}` |\n| `/\\w\\\\\
  hello\\\\123/` | `\\\\w\\\\\\\\hello\\\\\\\\123` |\n\n请记住，使用字面量创建正则表达式与使用 `RegExp`\
  \ 构造函数创建正则表达式并不完全相同。在 ECMAScript 3 中，正则表达式字面量始终共享同一个实例，而通过构造函数创建新的 `RegExp` 总是产生一个新实例。考虑以下情况：\n\
  \n```\nvar re = null, i;\nfor (i=0; i<3; i++) {\n    re = /cat/g;\n    console.log(re.test(\"\
  catastrophe\"));\n}\n// 输出: true, false, false\n\nvar re2 = null;\nfor (i=0; i<3;\
  \ i++) {\n    re2 = new RegExp(\"cat\", \"g\");\n    console.log(re2.test(\"catastrophe\"\
  ));\n}\n// 输出: true, false, false\n```\n*(注：由于原文未提供完整代码块，此处基于逻辑补全以说明差异)*\n\n前面的示例都是使用字面量形式定义正则表达式。正则表达式也可以通过\
  \ `RegExp` 构造函数创建，该函数接受两个参数：用于匹配的字符串模式和一个可选的标志字符串。任何可以使用字面量语法定义的正则表达式也可以使用构造函数进行定义，如例所示：\n\
  \n```\n/*\n * 匹配第一个 \"bat\" 或 \"cat\" 实例，不区分大小写。\n */\nvar pattern1 = /[bc]at/i;\n\
  \n/*\n * 与 pattern1 相同，只是使用了构造函数。\n */\nvar pattern2 = new RegExp(\"[bc]at\", \"\
  i\");\n```\n\n在这里，`pattern1` 和 `pattern2` 定义了等效的正则表达式。注意，`RegExp` 构造函数的两个参数都是字符串（不应将正则表达式字面量传递给\
  \ `RegExp` 构造函数）。由于 `RegExp` 构造函数的模式参数是一个字符串，在某些情况下您需要对字符进行双重转义。所有元字符都必须双重转义，已经转义的字符也是如此，例如\
  \ `\\n`（在字符串中通常转义的字符在正则表达式字符串中使用会变为 `\\\\`）。下表显示了一些字面量形式的模式以及使用 `RegExp` 构造函数所需的等效字符串。\n\
  \n| 字面量模式 (LITERAL PATTERN) | 字符串等效值 (STRING EQUIVALENT) |\n| :--- | :--- |\n| ---\
  \ | --- |\n| `/\\[bc\\]at/` | `\\[bc\\]at` |\n| `/.at/` | `\\\\.at` |\n| `/name\\\
  /age/` | `name\\\\age` |\n| `/\\d.\\d{1,2}/` | `\\\\d.\\\\d{1,2}` |\n| `/\\w\\\\\
  hello\\\\123/` | `\\\\w\\\\\\\\hello\\\\\\\\123` |\n\n请记住，使用字面量创建正则表达式与使用 `RegExp`\
  \ 构造函数创建正则表达式并不完全相同。在 ECMAScript 3 中，正则表达式字面量始终共享同一个实例，而通过构造函数创建新的 `RegExp` 总是产生一个新实例。考虑以下情况：\n\
  \n```\nvar re = null, i;\n// ... (此处省略原文未提供的完整逻辑部分)\n```\n*(注：原文提供的文本后续部分存在乱码重复或不完整，已根据翻译指令进行清理和对齐)*\n\
  \n前面的示例都是使用字面量形式定义正则表达式。正则表达式也可以通过 `RegExp` 构造函数创建...（此处根据原文逻辑翻译，并跳过原文中重复的乱码段）。\n\
  \n在 Internet Explorer 9+, Firefox 4+, 以及 Chrome。\n\nECMAScript 5 明确了正则表达式字面量的行为。\n\
  \n### 实例属性 (Instance Properties)\n\n每个 `RegExp` 实例具有以下属性，允许获取模式的信息：\n\n- `global`:\
  \ 布尔值，表示是否设置了 `g` 。\n- `ignoreCase`: 布尔值，表示是否设置了 `i` 。\n- `lastIndex`: 整数，表示下次尝试匹配的字符位置。该值始终为\
  \ 0。\n- `multiline`: 布尔值，表示是否设置了 `m` 。\n- `source`: 正则表达式的字符串源。它以字面量形式返回（不带斜杠），而不是传递给构造函数的字符串。\n\
  \n这些属性对于识别正则表达式的方面非常有帮助；但它们通常用不大，因为这些信息在模式声明中已经可用。这是一个示例：\n\n![image](img/logo1.gif)\n\
  \n```\nvar pattern1 = /[bc]at/i;\n\nalert(pattern1.global);     //false\nalert(pattern1.ignoreCase);\
  \ //true\nalert(pattern1.multiline);  //false\nalert(pattern1.lastIndex);  //0\n\
  alert(pattern1.source);     //\"[bc]at\"\n\nvar pattern2 = new RegExp(\"[bc]at\"\
  , \"i\");\n\nalert(pattern2.global);     //false\nalert(pattern2.ignoreCase); //true\n\
  alert(pattern2.multiline);  //false\nalert(pattern2.lastIndex);  //0\nalert(pattern2.source);\
  \     //\"[bc]at\"\n```\nRegExpInstancePropertiesExample01.htm\n\n注意，每个模式的 `source`\
  \ 属性是等效的，尽管第一个是字面量形式，另一个使用了构造函数。`source` 属性会将字符串规范化为字面量使用的形式。\n\n### 实例方法 (Instance\
  \ Methods)\n\n`RegExp` 对象的主要方法是 `exec()`，它旨在用于捕分组。该方法接受单个参数，即应用于模式的字符串，并返回一个关于第一个匹配项的数组；如果没有找到匹配项，则返回\
  \ `null`。返回的数组虽然是 `Array` 的实例，但包含两个额外属性：`index` 是匹配在字符串中的位置，`input` 是运行该表达式的字符串。\n\
  \n\n\n\n```\nvar text = \"mom and dad and baby\";\nvar pattern = /mom( and dad(\
  \ and baby)?)?/gi;\n\nvar matches = pattern.exec(text);\nalert(matches.index); \
  \   //0\nalert(matches.input);    //\"mom and dad and baby\"\nalert(matches[0]);\
  \       //\"mom and dad and baby\"\nalert(matches[1]);       //\" and dad and baby\"\
  \nalert(matches[2]);       //\" and baby\"\n```\n\n### RegExpExecExample01.htm\n\
  \n在这个示例中，`pattern` 有两个捕获组。最内层的一个匹配 `\" and baby\"`，其包含它的组匹配 `\" and dad\"` 或 `\"\
  \ and dad and baby\"`。当在字符串上调用 `exec()` 时，找到了一个匹配项。由于整个字符串都匹配 `pattern`，`matches`\
  \ 数组上的 `index` 属性被设置为 0。数组中的第一个元素是整个匹配字符串，第二个元素包含第一个捕获组的内容，第三个包含第三个捕获组的内容。\n\n`exec()`\
  \ 方法每次只返回一个匹配的信息，即使 `pattern` 是全局的。当没有指定全局标志时，多次在同一个字符串上调用 `exec()` 将始终返回第一个匹配的信息。当\
  \ `pattern` 上设置了 `g` 标志时，每次调用 `exec()` 都会向字符串深处移动寻找匹配项，如例所示：\n\n```\nvar text =\
  \ \"cat, bat, sat, fat\";        \nvar pattern1 = /.at/;\n\nvar matches = pattern1.exec(text);\
  \        \nalert(matches.index);        //0\nalert(matches[0]);           //cat\n\
  alert(pattern1.lastIndex);   //0\n\nmatches = pattern1.exec(text);        \nalert(matches.index);\
  \        //0\nalert(matches[0]);           //cat\nalert(pattern1.lastIndex);   //0\n\
  \nvar pattern2 = /.at/g;\n\nvar matches = pattern2.exec(text);        \nalert(matches.index);\
  \        //0\nalert(matches[0]);           //cat\nalert(pattern2.lastIndex);   //0\n\
  \nmatches = pattern2.exec(text);        \nalert(matches.index);        //5\nalert(matches[0]);\
  \           //bat\nalert(pattern2.lastIndex);   //8\n```\n\n### RegExpExecExample02.htm\n\
  \n此示例中的第一个模式 `pattern1` 不是全局的，因此每次调用 `exec()` 只返回第一个匹配项（`\"cat\"`）。第二个模式 `pattern2`\
  \ 是全局的，因此每次调用 `exec()` 都会返回字符串中的下一个匹配项，直到到达字符串末。还要注意 `pattern` 的 `lastIndex` 属性是如何受到影响的。在全局匹配模式下，`lastIndex`\
  \ 在每次调用 `exec()` 后都会增加，但在非全局模式下它保持不变。\n\n![image](img/pen.gif)\n\nInternet Explorer\
  \ 对 JavaScript 的实现偏差导致 `lastIndex` 始终被更新，即使在非全局模式下也是。\n\n正则表达式的另一种方法是 `test()`，它接受一个字符串参数，如果\
  \ `pattern` 匹配该参数则返回 `true`，否则返回 `false`。当你只想知道 `pattern` 是否被匹配，但不需要实际的匹配文本时，这个方法非常有用。`test()`\
  \ 方法经常用于 `if` 语句，如下：\n\n```\nvar text = \"000-00-0000\";        \nvar pattern =\
  \ /\\d{3}-\\d{2}-\\d{4}/;\n\nif (pattern.test(text)){\n    alert(\"The pattern was\
  \ matched.\");\n}\n```\n\n在这个示例中，正则表达式测试了一个特定的数字序列。如果输入文本匹配 `pattern`，则会显示消息。此功能通常用于验证用户输入，此时你只关心输入是否有效，而不一定关心它为什么无效。\n\
  \n继承的方法 `toLocaleString()` 和 `toString()` 分别返回返回正则表达式的字面表示，无论它是如何被创建的。考虑这个示例：\n\n\
  ![image](img/logo1.gif)\n\n```\nvar pattern = new RegExp(\"\\\\[bc\\\\]at\", \"\
  gi\");\nalert(pattern.toString());          // /\\[bc]at/gi\nalert(pattern.toLocaleString());\
  \    // /\\[bc]at/gi\n```\n\n### RegExpToStringExample01.htm\n\n尽管此示例中的 `pattern`\
  \ 是使用 `RegExp` 构造函数创建的，但 `toLocaleString()` 和 `toString()` 方法返回模式的方式就像是用字面量格式指定的一样。\n\
  \n![image](img/pen.gif)\n\n正则表达式的 `valueOf()` 方法返回正则表达式本身。\n\n### RegExp Constructor\
  \ Properties\n\n`RegExp` 构造函数有几个属性。（这些在其他语言中会被视为静态属性。）这些属性适用于作用范围内的所有正则表达式，并且会根据执行的最后一次正则表达式操作而改变。这些属性的另一个独特之处是它们可以通过两种不同的方式进行访问。每个属性都有一个详细的属性名称和一个简写名称（Opera\
  \ 除外，它不支持简写名称）。`RegExp` 构造函数属性列于下表。\n\n| VERBOSE NAME | SHORT NAME | DESCRIPTION\
  \ |\n| --- | --- | --- |\n| input | $_ | 上一次匹配的字符串。这在 Opera 中未实现。 |\n| lastMatch\
  \ | $& | 上一次匹配的文本。这在 Opera 中未实现。 |\n| lastParen | $+ | 上一次匹配的捕获组。这在 Opera 中未实现。\
  \ |\n| leftContext | $` | 输入字符串中最后一次匹配之前的文本。 |\n| multiline | $* | 指定表达式是否使用多行模式的布尔值。这在\
  \ IE 或 Opera 中未实现。 |\n| rightContext | $' | 输入字符串中最后一次匹配之后的文本。 |\n\n这些属性可以用于提取 `exec()`\
  \ 或 `test()` 执行的特定特定信息。考虑这个示例：\n\n![image](img/logo1.gif)\n\n```\nvar text = \"\
  this has been a short summer\";\nvar pattern = /(.)hort/g;\n\n/*\n Note: Opera 不支持\
  \ input, lastMatch, lastParen 或 multiline。\n * Internet Explorer 不支持 multiline。\n\
  \ */\nif (pattern.test(text)){\n    alert(RegExp.input);               //this has\
  \ been a short summer\n    alert(RegExp.leftContext);         //this has been a\n\
  \    alert(RegExp.rightContext);        //summer\n    alert(RegExp.lastMatch); \
  \          //short\n    alert(RegExp.lastParen);           //s\n    alert(RegExp.multiline);\
  \           //false\n}\n```\n\n### RegExpPropertiesExample01.htm\n\n该代码创建一个在第一个字母周围的捕获组。各种属性的使用如下：\n\
  \n* `input` 属性包含原始字符串。\n* `leftContext` 属性包含单词 `\"short\"` 之前的字符，`rightContext`\
  \ 属性包含单词 `\"short\"` 之后的字符。\n* `lastMatch` 属性包含匹配整个正则表达式的最后一次字符串，即 `\"short\"`。\n\
  * `lastParen` 属性包含最后一个捕获组，在本例中为 `\"s\"`。\n\n这些详细属性名称可以替换为简写属性名称，尽管你必须使用括号表示法访问它们，如下例所示，因为大多数在\
  \ ECMAScript 中是非法标识符：\n\n![image](img/logo1.gif)\n\n```\nvar text = \"this has been\
  \ a short summer\";\nvar pattern = /(.)hort/g;\n\n/*\n Note: Opera 不支持简写名称。\n *\
  \ Internet Explorer 不支持 multiline。\n */        \nif (pattern.test(text)){\n    alert(RegExp.$_);\
  \               //this has been a short summer\n    alert(RegExp[\"$`\"]);     \
  \       //this has been a\n    alert(RegExp[\"$'\"]);            //summer\n    alert(RegExp[\"\
  $&\"]);            //short\n    alert(RegExp[\"$+\"]);            //s\n    alert(RegExp[\"\
  $*\"]);            //false\n}\n```\n\n### RegExpPropertiesExample02.htm\n\n还有构造器属性可以存储多达九个捕获组匹配。这些属性通过\
  \ `RegExp.$1` 访问，它包含第一个捕获组匹配，直到 `RegExp.$9`，它包含第九个捕获组匹配。这些属性在调用 `exec()` 或 `test()`\
  \ 时被填充，允许你执行这样的操作：\n\n![image](img/logo1.gif)\n\n```\nvar text = \"this has been\
  \ a short summer\";\nvar pattern = /(..)or(.)/g;\n\nif (pattern.test(text)){\n \
  \   alert(RegExp.$1);       //sh\n    alert(RegExp.$2);       //t\n}\n```\n\n\n\n\
  \n\n## RegExpConstructorPropertiesExample03.htm\n\n在本示例中，创建了一个带有两个匹配组的模式并对其对字符串进行测试。尽管\
  \ `test()` 仅返回一个布尔值，但 `RegExp` 构造函数的属性 `$1` 和 `$2` 会被填充。\n\n## 模式的限制\n\n尽管 ECMAScript\
  \ 的正则表达式支持已经非常完善，但它确实缺乏 Perl 等语言中可用的一些高级正则表达式功能。ECMAScript 正则表达式不支持以下功能（更多信息请参见\
  \ [www.regular-expressions.info](http://www.regular-expressions.info)）：\n\n- `\\\
  A` 和 `\\Z` 锚定（分别匹配字符串的开始或结束）\n- 后行断言（Lookbehinds）\n- 并集和交集类（Union and intersection\
  \ classes）\n- 原子分组（Atomic grouping）\n- Unicode 支持（一次匹配单个字符除外）\n- 命名捕获组（Named capturing\
  \ groups）\n- `s`（单行模式）和 `x`（自由模式）匹配模式\n- 条件语句（Conditionals）\n- 正则表达式注释\n\n尽管有这些限制，ECMAScript\
  \ 的正则表达式支持对于执行大多数模式匹配任务已经足够强大。\n\n## 函数类型\n\nECMAScript 最有趣的部分之一是它的函数，主要因为函数实际上实际上是对象。每个函数都是\
  \ `Function` 类型的实例，像任何其他引用类型一样拥有属性和方法。由于函数是对象，函数名只是指向函数对象的指针，并不一定与函数本身绑定。函数通常使用函数声明语法定义，如示例所示：\n\
  \n```\nfunction sum (num1, num2) {\n    return num1 + num2;\n}\n```\n\n这几乎完全等同于使用函数表达式，如下：\n\
  \n```javascript\nvar sum = function(num1, num2){\n    return num1 + num2;\n};\n\
  ```\n\n在这段代码中，定义并初始化了一个变量 `sum` 为一个函数。注意，`function` 关键字后面没有包含名称，因为这不是必需的——可以通过变量\
  \ `sum` 引用该函数。同样注意，函数结束之后有一个分号，就像任何变量初始化之后的一样。\n\n定义函数的最后一种方法是通过 `Function` 构造函数，它可以接受任意数量的参数。最后一个参数始终被视为函数体，之前的参数则列出了新函数的参数。\n\
  \n例如：\n\n```javascript\nvar sum = new Function(\"num1\", \"num2\", \"return num1\
  \ + num2\");   //不建议\n```\n\n这种语法是不被推荐的，因为它会导致代码的双重解释（一次针对常规 ECMAScript 代码，一次针对传递构造函数的字符串），从而可能影响性能。然而，将函数视为对象并将将函数名视为指针是非常重要的——这种语法非常很好地体现了这一概念。\n\
  \n由于函数名仅仅是指向函数的指针，它们的行为就像任何其他包含对象指针的变量一样。这意味着一个函数可以有多个名称，如下例所示：\n\n![image](img/logo1.gif)\n\
  \n```javascript\nfunction sum(num1, num2){\n    return num1 + num2;\n}        \n\
  alert(sum(10,10));    //20\n\nvar anotherSum = sum;        \nalert(anotherSum(10,10));\
  \  //20\n\nsum = null;        \nalert(anotherSum(10,10));  //20\n```\n\n## FunctionTypeExample01.htm\n\
  \n这段代码定义了一个名为 `sum()` 的函数，用于将两个数字相加。声明了一个变量 `anotherSum` 并将其赋值为 `sum`。注意，不带括号地使用函数名访问的是函数指针，而不是执行函数。此时，`anotherSum`\
  \ 和 `sum` 都指向同一个函数，这意味着 `anotherSum()` 可以被调用并返回结果。当 `sum` 被设置为 `null` 时，它切断了与函数的关系，尽管\
  \ `anotherSum()` 仍然可以无问题地调用。\n\n## 无重载（重温）\n\n将函数名视为指针也解释了为什么 ECMAScript 中没有函数重载。回顾第\
  \ 3 章中的以下示例：\n\n```javascript\nfunction addSomeNumber(num){\n    return num + 100;\n\
  }\n\nfunction addSomeNumber(num) {\n    return num + 200;\n}\n\nvar result = addSomeNumber(100);\
  \    //300\n```\n\n在这个示例中，很明显，声明两个同名的函数始终会导致最后一个函数覆盖上一个。这段代码几乎完全等同于以下：\n\n```javascript\n\
  var addSomeNumber = function (num){\n    return num + 100;\n};\n\naddSomeNumber\
  \ = function (num) {\n    return num + 200;\n};\n\nvar result = addSomeNumber(100);\
  \    //300\n```\n\n在重写后的代码中，更容易看到到底发生了什么。当创建第二个函数时，变量 `addSomeNumber` 仅仅是被覆盖了。\n\
  \n## 函数声明与函数表达式\n\n在本节中，函数声明和函数表达式被认为是几乎等同的。这种谨慎的说法是因为 JavaScript 引擎将数据加载到执行上下文的一种主要区别。函数声明在任何代码执行之前就会在执行上下文中读取并可用，而函数表达式在执行到达该行代码之前是不完成的。考虑以下：\n\
  \n![image](img/logo1.gif)\n\n```javascript\nalert(sum(10,10));\nfunction sum(num1,\
  \ num2){\n    return num1 + num2;\n}\n```\n\n## FunctionDeclarationExample01.htm\n\
  \n这段代码运行完美完美，因为函数声明通过一个称为“函数提升”（function hoisting）的过程被读取并添加到执行中。在求值代码时，JavaScript\
  \ 引擎会对函数声明进行第一次扫描并将它们提升到顶部。因此，即使函数声明在实际源代码中出现在其使用之后，引擎也会将其更改并将函数声明提升到顶部。将函数声明更改为等效的函数表达式（如下所示）会导致错误：\n\
  \n![image](img/logo1.gif)\n\n```javascript\nalert(sum(10,10));\nvar sum = function(num1,\
  \ num2){\n    return num1 + num2;\n};\n```\n\n## FunctionInitializationExample01.htm\n\
  \n这段更新后的代码会导致错误，因为函数是初始化语句的一部分，而不是函数声明的一部分。这意味着在执行高亮行之前，变量 `sum` 中尚没有该函数，而这不会发生，因为第一行会导致“意外的标识符”错误。\n\
  \n除了函数通过给定名称可用的时间存在差异外，这两种语法是等价的。\n\n![image](img/pen.gif)\n\n可以拥有看起来像声明的命名函数表达式，例如\
  \ `var sum = function sum() {}`。关于函数表达式的讨论，请参见第 7 章。\n\n## 函数作为值\n\n由于 ECMAScript\
  \ 中的函数名仅仅是变量，因此函数可以使用任何其他值可以使用的地方。这意味着不仅可以将函数作为参数传递给另一个函数，还可以将函数作为另一个函数的返回结果。考虑以下函数：\n\
  \n```javascript\nfunction callSomeFunction(someFunction, someArgument){\n    return\
  \ someFunction(someArgument);\n}\n```\n\n该函数接受两个参数。第一个参数应该是函数，第二个参数应该是传递给该函数的值。任何函数都可以如下所示传递入：\n\
  \n```javascript\nfunction add10(num){\n    return num + 10;\n}\n\nvar result1 =\
  \ callSomeFunction(add10, 10);\nalert(result1);   //20\n\nfunction getGreeting(name){\n\
  \    return \"Hello, \" + name;\n}\n\nvar result2 = callSomeFunction(getGreeting,\
  \ \"Nicholas\");\nalert(result2);   //\"Hello, Nicholas\"\n```\n\n## FunctionAsAnArgumentExample01.htm\n\
  \n\n\n\n`callSomeFunction()` 函数是泛型的，因此传递作为第一个参数的函数是什么并不重要——结果将始终从执行的第一个参数返回。请记住，要访问函数指针而不是执行函数，必须省略括号，因此变量\
  \ `add10` 和 `getGreeting` 被传递到 `callSomeFunction()` 中，而不是将它们的结果传递进去。\n\n从函数中返回另一个函数也是可能的，并且非常有用。例如，假设你有一个对象数组，并想要根据任意对象属性对数组进行排序。数组的\
  \ `sort()` 方法的比较函数只接受两个参数（即要比较的值），但实际上你需要一种方法来指示按哪个属性进行排序。这个问题可以通过定义一个函数，根据属性名创建一个比较函数来解决，如下例所示：\n\
  \n![image](img/logo1.gif)\n\n```javascript\nfunction createComparisonFunction(propertyName)\
  \ {\n\n    return function(object1, object2){\n        var value1 = object1[propertyName];\n\
  \        var value2 = object2[propertyName];\n\n        if (value1 < value2){\n\
  \            return -1;\n        } else if (value1 > value2){\n            return\
  \ 1;\n        } else {\n            return 0;\n        }\n    };\n}\n```\n\nFunctionReturningFunctionExample01.htm\n\
  \n该函数的语法看起来可能复杂，但本质上它只是函数内部的一个函数，前面跟有 `return` 操作符。`propertyName` 参数可以在内部函数中访问，并使用括号表示法检索给定属性的值。一旦获取了属性值，就可以进行简单的比较。该函数的使用方式如下所示：\n\
  \n```javascript\nvar data = [{name: \"Zachary\", age: 28}, {name: \"Nicholas\",\
  \ age: 29}];\n\ndata.sort(createComparisonFunction(\"name\"));\nalert(data[0].name);\
  \  //Nicholas\n\ndata.sort(createComparisonFunction(\"age\"));\nalert(data[0].name);\
  \  //Zachary\n```\n\n在这段代码中，创建了一个名为 `data` 的数组，包含两个对象。每个对象都有一个 `name` 属性和一个 `age`\
  \ 属性。默认情况下，`sort()` 方法会对每个对象调用 `toString()` 来确定排序顺序，这在这种情况下不会产生逻辑上的结果。调用 `createComparisonFunction\
  \ (\"name\")` 会创建一个根据 `name` 属性排序的比较函数，这意味着第一个项的名称为 \"Nicholas\" 年龄为 29。当调用 `createComparisonFunction\
  \ (\"age\")` 时，它会创建一个根据 `age` 属性排序的比较函数，这意味着第一个项将是名称为 \"Zachary\" 且年龄为 28 的。\n\n\
  ## 函数内部\n\n函数内部存在两个特殊对象：`arguments` 和 `this`。正如第 3 章所讨论，`arguments` 对象是一个类数组对象，包含了传递给函数的所有参数。尽管它的主要用途是表示函数参数，但\
  \ `arguments` 对象还有一个名为 `callee` 的属性，它是一个指向拥有 `arguments` 对象的函数的指针。考虑以下经典的阶乘函数：\n\
  \n```javascript\nfunction factorial(num){\n    if (num <= 1) {\n        return 1;\n\
  \    } else {\n        return num * factorial(num-1)\n    }\n}\n```\n\n\n\n\n```\n\
  function sayName(name){\n    alert(name);\n}      \n\nfunction sum(num1, num2){\n\
  \    return num1 + num2;\n}\n\nfunction sayHi(){\n    alert(\"hi\");\n}\n\nalert(sayName.length);\
  \  //1\nalert(sum.length);      //2\nalert(sayHi.length);    //0\n```\n\n### `FunctionTypeLengthPropertyExample01.htm`\n\
  \n这段代码定义了三个函数，每个函数都有不同数量的命名参数。`sayName()` 函数指定了一个参数，因此其 `length` 属性被设置为 1。同样，`sum()`\
  \ 函数指定了两个参数，因此其 `length` 属性为 2，而 `sayHi()` 没有命名参数，所以它的长度为 0。\n\n`prototype` 属性可能是\
  \ ECMAScript 核心中最有意思的部分。`prototype` 是所有引用类型实例方法的的实际位置，这意味着诸像 `toString()` 和 `valueOf()`\
  \ 等方法实际上存在于 `prototype` 上，然后通过对象实例进行访问。该属性在定义你自己的引用类型和继承时非常重要。（这些主题将在第 6 章介绍。）在\
  \ ECMAScript 5 中，`prototype` 属性是不可枚举的，因此无法使用 `for-in` 找到。\n\n函数还有两个额外的方法：`apply()`\
  \ 和 `call()`。这两个方法都会带特定的 `this` 值调用函数，从而有效地设置函数体内部的 `this` 对象的值。`apply()` 方法接受两个参数：函数内部的\
  \ `this` 值以及一个参数数组。第二个参数可以是 `Array` 的一个实例，但也可以是 `arguments` 对象。考虑以下内容：\n\n![image](img/logo1.gif)\n\
  \n```\nfunction sum(num1, num2){\n    return num1 + num2;\n}\n\nfunction callSum1(num1,\
  \ num2){\n    return sum.apply(this, arguments);    //传入 arguments 对象\n}\n\nfunction\
  \ callSum2(num1, num2){\n    return sum.apply(this, [num1, num2]); //传入数组\n}\n\n\
  alert(callSum1(10,10));   //20\nalert(callSum2(10,10));   //20\n```\n\n### `FunctionTypeApplyMethodExample01.htm`\n\
  \n在这个示例中，`callSum1()` 执行了 `sum()` 方法，将 `this` 作为 `this` 值传入（由于是在全局作用范围内调用的，所以它等于\
  \ `window`），同时也传入了 `arguments` 对象。`callSum2()` 方法也调用了 `sum()`，但它传入的是参数数组。两个函数都会执行并返回正确的结果。\n\
  \n![image](img/pen.gif)\n\n在严格模式下，不带上下文对象调用的函数其 `this` 值不会被强制转换为 `window`。相反，除非通过将函数附加到对象或使用\
  \ `apply()` 或 `call()` 来显式设置，否则它将变为 `undefined`。\n\n`call()` 方法的行为与 `apply()` 相同，但传递参数的方式不同。第一个参数是\
  \ `this` 值，但其余参数直接传递给函数。使用 `call()` 时，必须具体列出参数，如例所示：\n\n![image](img/logo1.gif)\n\
  \n```\nfunction sum(num1, num2){\n    return num1 + num2;\n}\n\nfunction callSum(num1,\
  \ num2){\n    return sum.call(this, num1, num2);\n}\n\nalert(callSum(10,10));  \
  \ //20\n```\n\n### `FunctionTypeCallMethodExample01.htm`\n\n使用 `call()` 方法时，`callSum()`\
  \ 必须显式地传入它的每一个参数。结果与使用 `apply()` 相同。决定使用 `apply()` 还是 `call()` 完全取决于你向函数传递参数的最简便方法。如果你打算直接传入\
  \ `arguments` 对象，或者你已经有一个要传递的数据数组，那么 `apply()` 是更好的选择；否则，`call()` 可能是更合适的选择。（如果没有参数需要传递，这些方法是等价的。）\n\
  \n`apply()` 和 `call()` 的真正威力不在于它们传递参数的能力，而在于它们增强函数内部 `this` 值的能力。考虑以下示例：\n\n```\n\
  window.color = \"red\";\nvar o = { color: \"blue\" };\n\nfunction sayColor(){\n\
  \    alert(this.color);\n}\n\nsayColor();            //red\n\nsayColor.call(this);\
  \   //red\nsayColor.call(window); //red\nsayColor.call(o);      //blue\n```\n\n\
  ### `FunctionTypeCallExample01.htm`\n\n这个示例是用于说明 `this` 对象的示例的修改版本。再次，`sayColor()`\
  \ 被定义为全局函数，当它在全局作用范围内调用时，它会显示 \"red\"，因为 `this.color` 解析为 `window.color`。然后你可以通过\
  \ `sayColor.call(this)` 和 `sayColor.call(window)` 在全局作用范围内显式调用函数，它们都会显示 \"red\"\
  。运行 `sayColor.call(o)` 则切换了函数的上下文，使得 `this` 指向 `o`，导致显示 \"blue\"。\n\n使用 `call()`（或\
  \ `apply()`）增强作用域的优势是对象不需要知道关于方法的任何信息。在示例的第一个版本中，`sayColor()` 函数被直接放在对象上；在更新后的示例中，这一步不再需要。\n\
  \nECMAScript 5 定义了一个名为 `bind()` 的附加方法。`bind()` 方法创建一个新函数，其 `this` 值绑定到传入的值上。例如：\n\
  \n![image](img/logo1.gif)\n\n```\nwindow.color = \"red\";\nvar o = { color: \"blue\"\
  \ };\n\nfunction sayColor(){\n    alert(this.color);\n}\n\nvar objectColor = sayColor.bind(o);\n\
  objectColor(); //blue\n```\n\n### `FunctionTypeBindMethodExample01.htm`\n\n在这里，通过传入对象\
  \ `o` 从 `sayColor()` 创建了新函数 `objectColor()`。\n\n#### 原始包装类型\n\n三种引用类型用于与原始值交互：`Boolean`\
  \ 类型、`Number` 类型和 `String` 类型。这些类型可以像本章描述的引用类型一样工作，但它们与其原始类型对应有特殊行为。每当读取原始值时，后台都会创建一个相应的原始包装类型对象，从而允许访问任意的操作数据的方法。考虑以下示例：\n\
  \n```\nvar s1 = \"some text\";\nvar s2 = s1.substring(2);\n```\n\n\n\n\n这种行为允许原始字符串值像对象一样工作。对于\
  \ `Boolean` 和数值值，也会分别使用 `Boolean` 和 `Number` 类型重复这相同的三个步骤。\n\n引用类型与原始包装类型（primitive\
  \ wrapper types）之间的主要区别在于对象的寿命。当你使用 `new` 运算符实例化引用类型时，它会一直留在内存中直到超出作用范围；而自动创建的原始包装对象只存在一行代码中就会被销毁。这意味着无法在运行时添加属性和方法。来看这个例子：\n\
  \n```\nvar s1 = \"some text\";\ns1.color = \"red\";\nalert(s1.color);   //undefined\n\
  ```\n\n在这里，第二行代码试图给字符串 `s1` 添加一个 `color` 属性。然而，当第三行访问 `s1` 时，`color` 属性已经消失了。这是因为在第二行中创建的\
  \ `String` 对象在执行到第三行时已经被销毁了。第三行创建了它自己的 `String` 对象，而该对象没有 `color` 属性。\n\n可以使用 `Boolean`、`Number`\
  \ 和 `String` 构造函数显式地创建包装对象。这应该只在必要时进行，因为这通常会让开发者感到困惑，不确定自己处理的是原始值还是引用值。在原始包装类型的实例上调用\
  \ `typeof` 返回的是 `\"object\"`，而不是原始值。\n\n`Object` 构造函数也充当工厂方法，并能够根据传入构造函数的数值类型返回原始包装的实例。例如：\n\
  \n```\nvar obj = new Object(\"some text\");\nalert(obj instanceof String);   //true\n\
  ```\n\n当将字符串传递给 `Object` 构造函数时，会创建一个 `String` 实例；数字参数会产生一个 `Number` 实例，而布尔参数则返回\
  \ `Boolean`。请记住，使用 `new` 调用原始包装构造函数与调用同名的强制转换函数是不等等的。例如：\n\n```\nvar value = \"\
  25\";\nvar number = Number(value);   //casting\nalert(typeof number);   //\"number\"\
  \n\nvar obj = new Number(value);    //constructor\nalert(typeof obj);          \
  \    //\"object\"\n```\n\n在这个例子中，变量 `number` 被填充为原始值 `25`，而变量 `obj` 被填充为 `Number`\
  \ 的实例。关于强制转换函数的更多信息，请参阅第 3 章。尽管不建议显式创建包装对象，但它们的功能在操作原始值时是非常重要的。\n\n### Boolean 类型\n\
  \n`Boolean` 类型是对应于布尔值的引用类型。要创建一个 `Boolean` 对象，请使用 `Boolean` 构造函数并传入 `true` 或 `false`，如下例所示：\n\
  \n```\nvar booleanObject = new Boolean(true);\n```\n\n`Boolean` 实例重写了 `valueOf()`\
  \ 方法以返回原始值 `true` 或 `false`。`toString()` 方法也被重写了，以便在调用时返回字符串 `\"true\"` 或 `\"false\"\
  `。遗憾的是，`Boolean` 对象在 ECMAScript 中不仅用途不大，而且实际上可能会引起困惑。问题发生在尝试在表达式中使用 `Boolean` 对象时，如下例所示：\n\
  \n![image](img/logo1.gif)\n\n```\nvar booleanObject = new Boolean(false);\nvar result\
  \ = booleanObject;\nalert(result);//true\n\nvar falseValue = false;\nresult = falseValue;\n\
  alert(result);//false\n```\n\n`BooleanTypeExample01.htm` 在这段代码中，创建了一个值为 `false`\
  \ 的 `Boolean` 对象。该对象随后被与原始值一起使用。在 `Boolean` 数学中，`true` 等于 `false`。然而，在这行代码中，被求的是\
  \ `booleanObject`，而不是它的值（`false`）。正如之前讨论的，所有对象在表达式中会自动转换为 `true`，因此 `booleanObject`\
  \ 实际上被赋予了值 `true`。原始类型和引用类型之间还有其他差异。`typeof` 运算符对原始值返回 `\"boolean\"`，对引用类型返回 `\"\
  object\"`。此外，`Boolean` 对象是 `Boolean` 类型的实例，当使用 `instanceof` 运算符时会返回 `true`，而原始值则返回\
  \ `false`，如下所示：\n\n```\nalert(typeof booleanObject);//object\nalert(typeof falseValue);\
  \    //boolean\nalert(booleanObject instanceof Boolean);//true\nalert(falseValue\
  \ instanceof Boolean);//false\n```\n\n理解原始 `Boolean` 值与 `Boolean` 对象之间的区别是非常重要的——建议永远不要使用后者。\n\
  \n### Number 类型\n\n`Number` 类型是数值的引用类型。要创建一个 `Number` 对象，请使用 `Number` 构造函数并传入任何数字。这里有一个例子：\n\
  \n![image](img/logo1.gif)\n\n```\nvar numberObject = Number(10);\n```\n\n`NumberTypeExample01.htm`\
  \ 与 `Boolean` 类型一样，`Number` 类型重写了 `valueOf()`、`toLocaleString()` 和 `toString()`。`valueOf()`\
  \ 方法返回表示对象的原始数值，而另外两个方法将数字以字符串形式返回。正如第 3 章提到的，`toString()` 方法可选地接受一个参数，用于表示数字的基数（radix），如下例所示：\n\
  \n```\nvar num = 10;\nalert(num.toString());       //\"10\"\nalert(num.toString(2));\
  \      //\"1010\"\nalert(num.toString(8));      //\"12\"\nalert(num.toString(10));\
  \     //\"10\"\nalert(num.toString(16));     //\"a\"\n```\n\n`NumberTypeExample01.htm`\
  \ 除了继承的方法，`Number` 类型还有几个额外方法用于将数字格式化为字符串。`toFixed()` 方法返回指定小数位数的数字字符串表示，如下例所示：\n\
  \n```\nvar num = 10;\nalert(num.toFixed(2));    //\"10.00\"\n```\n\n`NumberTypeExample01.htm`\
  \ 在这里，`toFixed()` 方法接收的参数为 `2`，指示显示多少位小数。结果是，方法返回字符串 `\"10.00\"`，用零填充空的小位数。如果数字的小数位多于给定的，结果将舍入到最近的小位数，如下所示：\n\
  \n```\nvar num = 10.005;\nalert(num.toFixed(2));//\"10.01\"\n```\n\n`toFixed()`\
  \ 的舍入特性可能有助于处理货币的应用程序，但由于不同浏览器之间使用该方法存在差异。Internet Explorer 在向 `toFixed()` 传递零时，错误地舍入了范围\
  \ `{(−.94,−0.5], 0.5,0.94)}`。这些情况下，Internet Explorer 返回 `0`，而它应该返回 `-1` 或 `1`（取决于符号）；其他浏览器的行为符合预期，Internet\
  \ Explorer 9 修复了这个问题。\n\n![image `toFixed()` 方法可以表示具有 0 到 20 位小数的数字。某些浏览器可能支持更大的范围，但这是典型的范围。另一个与格式化数字相关的方法是\
  \ `toExponential()` 方法，它返回以指数计数法（也称为科学计数法）格式化的数字字符串。与 `toFixed()`一样，`toExponential()`接受一个参数，即输出的小位数。考虑这个例子：\n\
  \n```\nvar num = 10;\nalert(num.toExponential(1));    //\"1.0e+1\"\n```\n\n这段代码输出的结果为\
  \ `\"1.0e+1\"`。通常，这个小数字不会使用指数计数法表示。如果你想获得数字最合适的形式，应该使用 `toPrecision()` 方法。\n\n\n\
  \n\n`toPrecision()` 方法返回数字的固定表示法或指数表示法，取决于哪种方式最合理。该方法接受一个参数，即表示数字所需的总数字位数（不包括指数）。这里有一个示例：\n\
  \n![image](img/logo1.gif)\n\n```\nvar num = 99;\nalert(num.toPrecision(1));    //\"\
  1e+2\"\nalert(num.toPrecision(2));    //\"99\"\nalert(num.toPrecision(3));    //\"\
  99.0\"\n```\n\n`NumberTypeExample01.htm`\n\n在这个示例中，第一个任务是用单个数字来表示数字 99，结果是 \"1e+2\"\
  ，即数字 100。由于 99 无法仅用一个数字精确表示，该方法将其四舍入到 100，而 100 可以用一个数字表示。用两个数字表示 99 得到 \"99\"，三个数字则返回\
  \ \"99.0\"。`toPrecision()` 方法本质上根据你正在处理的数值来决定调用 `toFixed()` 还是 `toExponential()`；这三种方法都会进行四舍五入，以用正确的位数精确表示一个数字。\n\
  \n![image](img/pen.gif)\n\n`toPrecision()` 方法可以表示具有 1 到 21 位小数的数字。某些浏览器可能支持更大的范围，但这通常是标准实现的范围。\n\
  \n与 `Boolean` 对象类似，`Number` 对象为数值提供了重要的功能，但由于存在相似的潜在问题，真的不应该直接实例化。`typeof` 和 `instanceof`\
  \ 运算符在处理原始类型数字和引用类型数字时的工作方式不同，如下所示：\n\n```\nvar numberObject = new Number(10);\n\
  var numberValue = 10;\nalert(typeof numberObject);   //\"object\"\nalert(typeof\
  \ numberValue);    //\"number\"\nalert(numberObject instanceof Number);  //true\n\
  alert(numberValue instanceof Number);   //false\n```\n\n对原始类型数字调用 `typeof` 时，始终返回\
  \ \"number\"，而 `Number` 对象返回 \"object\"。同样，一个 `Number` 对象是 `Number` 的实例，但原始类型数字不是。\n\
  \n# String 类型\n\n`String` 类型是字符串的对象的表示，使用 `String` 构造函数创建如下：\n\n![image](img/logo1.gif)\n\
  \n```\nvar stringObject = new String(\"hello world\");\n```\n\n`StringTypeExample01.htm`\n\
  \n`String` 对象的方法在所有字符串原始类型上都是可用的。三个继承的方法 — `valueOf()`、`toLocaleString()` 和 `toString()`\
  \ 都返回对象的原始字符串值。\n\n每个 `String` 实例都包含一个属性 `length`，它表示字符串中的字符数。考虑以下示例：\n\n```\nvar\
  \ stringValue = \"hello world\";\nalert(stringValue.length);   //\"11\"\n```\n\n\
  此示例输出 \"11\"，即 \"hello world\" 中字符的数量。请注意，即使字符串包含双字节字符（与仅使用一个字节的 ASCII 字符相比），每个字符仍被计为一个。\n\
  \n`String` 类型有许多方法，用于帮助在 ECMAScript 中拆分和处理字符串。\n\n## 字符方法\n\n有两个方法可以访问字符串中的特定字符：`charAt()`\
  \ 和 `charCodeAt()`。这些方法各接受一个参数，即该字符从 0 开始的索引。`charAt()` 方法简单地返回给定位置的字符作为单字符字符串。（ECMAScript\
  \ 中没有字符类型。）例如：\n\n```\nvar stringValue = \"hello world\";\nalert(stringValue.charAt(1));\
  \   //\"e\"\n```\n\n\"hello world\" 中位置 1 的字符是 \"e\"，所以调用 `charAt(1)` 返回 \"e\"。如果你想要字符的编码而不是实际字符，那么调用\
  \ `charCodeAt()` 是合适的选择，如下例：\n\n```\nvar stringValue = \"hello world\";\nalert(stringValue.charCodeAt(1));\
  \   //outputs \"101\"\n```\n\n此示例输出 \"101\"，这是小写字母 \"e\" 的字符编码。\n\nECMAScript 5\
  \ 定义了另一种访问单个字符的方法。支持的浏览器允许使用带有数字索引的括号表示来访问字符串中的特定字符，例如：\n\n```\nvar stringValue\
  \ = \"hello world\";\nalert(stringValue[1]);   //\"e\"\n```\n\n使用括号表示访问单个字符在 Internet\
  \ Explorer 8 以及所有当前版本的 Firefox、Safari、Chrome 和 Opera 中支持。如果在 Internet Explorer 7\
  \ 或更早版本中使用此语法，结果将是 `undefined`（而不是特殊值 `undefined`）。\n\n## 字符串处理方法\n\n有几个方法可以操作字符串的值。这些方法中的第一个是\
  \ `concat()`，用于将一个或多个字符串连接到另一个字符串，并将连接后的字符串作为结果。考虑以下示例：\n\n```\nvar stringValue\
  \ = \"hello \";\nvar result = stringValue.concat(\"world\");\nalert(result);   \
  \         //\"hello world\"\nalert(stringValue);       //\"hello\"\n```\n\n在此示例中，在\
  \ `stringValue` 上调用 `concat()` 方法的结果是 \"hello world\" — `stringValue` 的值保持不变。`concat()`\
  \ 方法接受任意数量的参数，因此它可以从任意数量的其他字符串创建字符串，如下：\n\n```\nvar stringValue = \"hello \";\n\
  var result = stringValue.concat(\"world\", \"!\");\nalert(result);            //\"\
  hello world!\"\nalert(stringValue);       //\"hello\"\n```\n\n此修改后的示例将 \"world\"\
  \ 和 \"!\" 连接到 \"hello \" 之后。虽然 `concat()` 方法用于字符串连接，但在连接时更常用加法运算符 (+)。\n\nECMAScript\
  \ 提供了三种从字符串创建值的方法：`slice()`、`substr()` 和 `substring()`。这三种方法都返回操作字符串的子字符串，并接受一个或两个参数。第一个参数是开始提取的位置；如果使用了第二个参数，则指示操作停止的位置。对于\
  \ `slice()` 和 `substring()`，这个第二个参数是停止提取的位置（包含该点之前的所有字符）。对于 `substr()`，第二个参数是要返回的字符数。如果在任何情况下省略了第二个参数，则假设结束位置是字符串的长度。正如\
  \ `concat()` 方法一样，`slice()`、`substr()` 和 `substring()` 不会改变字符串的值 — 只是返回一个原始字符串值。考虑这个示例：\n\
  \n![image](img/logo1.gif)\n\n```\nvar stringValue = \"hello world\";\nalert(stringValue.slice(3));\
  \        //\"lo world\"\nalert(stringValue.substring(3));    //\"lo world\"\nalert(stringValue.substr(3));\
  \       //\"lo world\"\nalert(stringValue.slice(3, 7));     //\"lo w\"\nalert(stringValue.substring(3,7));\
  \  //\"lo w\"\nalert(stringValue.substr(3, 7));    //\"lo worl\"\n```\n\n`StringTypeManipulationMethodsExample01.htm`\n\
  \n在这个示例中，`slice()`、`substr()` 和 `substring()` 的用法相同，在大多数情况下返回相同的值。当只给一个参数 3 时，这三种方法都返回\
  \ \"lo world\"，因为 \"hello\" 中的第二个 \"l\" 在位置 3 处。当给出两个参数 3 和 7 时，`slice()` 和 `substring()`\
  \ 返回 \"lo w\"（\"world\" 中的 \"o\" 在位置 7，所以它不包含在内），而 `substr()` 返回 \"lo worl\"，因为第二个参数指定了要返回的字符数。\n\
  \n当参数为负数时，这些方法有不同的行为。对于 `slice()` 方法，负参数被视为字符串长度加上该负参数。对于 `substr()` 方法，负第一个参数被视为字符串长度加上该数字，而负的第二个数字会被转换为\
  \ 0。对于 `substring()` 方法，所有负数都会转换为 0。\n\n\n\n\n\n```javascript\nvar stringValue =\
  \ \"hello world\";\nalert(stringValue.slice(-3));         //\"rld\"\nalert(stringValue.substring(-3));\
  \     //\"hello world\"\nalert(stringValue.substr(-3));        //\"rld\"\nalert(stringValue.slice(3,\
  \ -4));      //\"lo w\"\nalert(stringValue.substring(3, -4));  //\"hel\"\nalert(stringValue.substr(3,\
  \ -4));     //\"\" (empty string)\n```\n\n`StringTypeManipulationMethodsExample01.htm`\n\
  \n此示例清楚地展示了这三种方法之间的区别。当为 `slice()` 和 `substr()` 调用单个负数参数时，它们的行为是相同的。这是因为 `-3` 被转换成了\
  \ `7`（字符串长度加上参数值），实际上使得调用等同于 `slice(7)` 和 `substr(7)`。相比之下，`substring()` 方法返回整个字符串，因为\
  \ `-3` 被转换成了 `0`。\n\n![image](img/pen.gif)\n\n由于 Internet Explorer 在 JavaScript\
  \ 的实现上存在偏差，向 `substr()` 传递负数会导致返回原始字符串。Internet Explorer 9 修复了此问题。\n\n当第二个参数为负数时，这三种方法的各不相同。`slice()`\
  \ 方法将第二个参数转换为 `7`，使得调用等同于 `slice(3, 7)`，因此返回 \"lo w\"。对于 `substring()` 方法，第二个参数被转换为\
  \ `0`，使得调用等同于 `substring(3, 0)`，这实际上等同于 `substring(0,3)`，因为该方法期望较小的数字是起始位置，较大的数字是结束位置。对于\
  \ `substr()` 方法，第二个参数也被转换为 `0`，这意味着返回的字符串中应该有零字符，导致返回值为空字符串。\n\n## 字符串定位方法\n\n有两种方法可以在另一个字符串中定位子字符串：`indexOf()`\
  \ 和 `lastIndexOf()`。这两个方法都会在字符串中搜索指定的子字符串并返回其位置（如果未找到子字符串则返回 `-1`）。它们之间的区别在于，`indexOf()`\
  \ 方法从字符串开头开始查找子字符串，而 `lastIndexOf()` 方法从字符串末尾开始查找。考虑以下示例：\n\n![image](img/logo1.gif)\n\
  \n```javascript\nvar stringValue = \"hello world\";\nalert(stringValue.indexOf(\"\
  o\"));         //4\nalert(stringValue.lastIndexOf(\"o\"));     //7\n```\n\n`StringTypeLocationMethodsExample01.htm`\n\
  \n在这里，字符串 \"o\" 第一次出现的位置是 4，即 \"hello\" 中的 \"o\"。字符串 \"o\" 最后一次出现在单词 \"world\" 中，位置是\
  \ 7。如果字符串只出现一次 \"o\"，那么 `indexOf()` 和 `lastIndexOf()` 返回的位置相同。\n\n每个方法都接受一个可选的第二个参数，指示从字符串内部开始搜索的位置。这意味着\
  \ `indexOf()` 方法将从该位置开始并向字符串末尾搜索，忽略起始位置之前的所有内容；而 `lastIndexOf()` 从给定位置开始搜索并继续向字符串开头搜索，忽略给定位置到字符串结尾之间的所有内容。这是一个示例：\n\
  \n```javascript\nvar stringValue = \"hello world\";\nalert(stringValue.indexOf(\"\
  o\", 6));         //7\nalert(stringValue.lastIndexOf(\"o\", 6));     //4\n```\n\n\
  当将 `6` 作为第二个参数传递给每个方法时，结果与上一个示例相反。这次，`indexOf()` 返回 `7`，因为它从位置 `6`（字母 \"w\"）开始搜索字符串，并继续到位置\
  \ `7`，在那里发现了 \"o\"。`lastIndexOf()` 方法返回 `4`，是因为搜索从位置 `6` 开始并向字符串开头回溯，在那里遇到了 \"hello\"\
  \ 中的 \"o\"。使用这个第二个参数允许你通过循环调用 `indexOf()` 或 `lastIndexOf()` 来定位子字符串的所有实例，如下所示：\n\
  \n![image](img/logo1.gif)\n\n```javascript\nvar stringValue = \"Lorem ipsum dolor\
  \ sit amet, consectetur adipisicing elit\";\nvar positions = new Array();\nvar pos\
  \ = stringValue.indexOf(\"e\");\n\nwhile(pos > -1){\n    positions.push(pos);\n\
  \    pos = stringValue.indexOf(\"e\", pos + 1);\n}\n\nalert(positions);    //\"\
  3,24,32,35,52\"\n```\n\n`StringTypeLocationMethodsExample02.htm`\n\n此示例通过不断增加 `indexOf()`\
  \ 应该开始的位置来遍历字符串。它首先获取 \"e\" 在字符串中的初始位置，然后进入一个循环，不断地将上一个位置加一传递给 `indexOf()`，确保搜索在上一个子字符串实例之后继续。每个位置都存储在\
  \ `positions` 数组中，以便稍后使用。\n\n## trim() 方法\n\nECMAScript 5 在所有字符串上引入了 `trim()` 方法。`trim()`\
  \ 方法创建字符串的副本，移除所有开头和结尾的空白，然后返回结果。例如：\n\n```javascript\nvar stringValue = \"    hello\
  \ world    \";\nvar trimmedStringValue = stringValue.trim();\nalert(stringValue);\
  \            //\"    hello world    \"\nalert(trimmedStringValue);     //\"hello\
  \ world\"\n```\n\n注意，由于 `trim()` 返回的是字符串的副本，原始字符串保持不变，保留开头和结尾的空白。该方法已在 Internet\
  \ Explorer 9+、Firefox 3.5+、Safari 5+ 和 Opera 10+ 中实现。Firefox 3.5+、Safari 5+ 和 Chrome\
  \ 还支持非标准的 `trimLeft()` 和 `trimRight()` 方法，用于移除一端的空白。\n\n## 字符串大小写方法\n\n下一组方法涉及大小写转换。四个方法执行大小写转换：`toLowerCase()`、`toLocaleLowerCase()`、`toUpperCase()`\
  \ 和 `toLocaleUpperCase()`。`toLowerCase()` 和 `toUpperCase()` 是原始方法，参考了 `java.lang.String`\
  \ 中的相同方法。`toLocaleLowerCase()` 和 `toLocaleUpperCase()` 方法旨在根据特定的区域（locale）进行实现。在许多区域，特定区域的方法与通用方法是相同的；但少数语言（如土耳其语）对\
  \ Unicode 大小写转换有特殊规则，这需要使用特定区域的方法。以下是一些示例：\n\n![image](img/logo1.gif)\n\n```javascript\n\
  var stringValue = \"hello world\";\nalert(stringValue.toLocaleUpperCase());  //\"\
  HELLO WORLD\"\nalert(stringValue.toUpperCase());        //\"HELLO WORLD\"\nalert(stringValue.toLocaleLowerCase());\
  \  //\"hello world\"\nalert(stringValue.toLowerCase());        //\"hello world\"\
  \n```\n\n`StringTypeCaseMethodExample01.htm`\n\n此代码为 `toLocaleUpperCase()` 和 `toUpperCase()`\
  \ 输出 \"HELLO WORLD\"，对于 `toLocaleLowerCase()` 和 `toLowerCase()` 输出。通常情况下，如果你不知道代码将在什么语言环境下运行，使用特定区域的方法更安全。\n\
  \n## 字符串模式匹配方法\n\n`String` 类型有多种在字符串内进行模式匹配的方法。这些方法中的第一个是 `match()`，它实际上相当于调用 `RegExp`\
  \ 对象的 `exec()` 方法。`match()` 方法接受单个参数，该参数可以是正则表达式字符串或 `RegExp` 对象。考虑以下示例：\n\n```javascript\n\
  var text = \"cat, bat, sat, fat\";        \nvar pattern = /.at/;\n\n//same as pattern.exec(text)\n\
  var matches = text.match(pattern);\nalert(matches.index);        //0\nalert(matches[0]);\
  \           //\"cat\"\nalert(pattern.lastIndex);   //0\n```\n\n`StringTypePatternMatchingExample01.htm`\n\
  \n`match()` 返回的数组与字符串字符串参数调用 `RegExp` 对象的 `exec()` 方法返回的数组相同：第一个项目是匹配整个模式的字符串，每个其他项目（如果适用）代表表达式中的捕获组。\n\
  \n\n\n\n另一种查找模式的方法是 `search()`。该方法的唯一参数与 `match()` 的参数相同：一个由字符串或 `RegExp` 对象指定的正则表达式。`search()`\
  \ 方法返回模式在字符串中首次出现的的索引，如果未找到则返回 -1。`search()` 总是从字符串的开头开始查找模式。考虑一下这个示例：\n\n![image](img/logo1.gif)\n\
  \n```\nvar text = \"cat, bat, sat, fat\";        \nvar pos = text.search(/at/);\n\
  alert(pos);   //1\n```\n\nStringTypePatternMatchingExample01.htm\n\n在这里，`search(/at/)`\
  \ 返回 1，这是 \"at\" 在字符串中的第一个位置。\n\n为了简化子字符串替换，ECMAScript 提供了 `replace()` 方法。该方法接受两个参数。第一个参数可以是\
  \ `RegExp` 对象或字符串（字符串不会转换为正则表达式），第二个参数可以是字符串或函数。如果第一个参数是字符串，则只会替换子字符串的第一次出现。替换所有子字符串实例的唯一方法是提供一个指定了全局标志（global\
  \ flag）的正则表达式，如例所示：\n\n```\nvar text = \"cat, bat, sat, fat\";        \nvar result\
  \ = text.replace(\"at\", \"ond\");\nalert(result);    //\"cond, bat, sat, fat\"\n\
  \nresult = text.replace(/at/g, \"ond\");\nalert(result);    //\"cond, bond, sond,\
  \ fond\"\n```\n\nStringTypePatternMatchingExample01.htm\n\n在此示例中，字符串 \"at\" 首先被传入\
  \ `replace()`，替换文本为 \"ond\"。操作结果是将 \"cat\" 变为 \"cond\"，但字符串的其余部分保持不变。通过将第一个参数改为带有全局标志的正则表达式，每个\
  \ \"at\" 实例都会被替换为 \"ond\"。\n\n当第二个参数是字符串时，有几个特殊字符序列可以用于插入正则表达式操作的值。ECMA-262 规定了以下值表。\n\
  \n| 序列 | 替换文本 |\n| --- | --- |\n| $$ | $ |\n| $& | 匹配整个模式的子字符串。等同于 `RegExp.lastMatch`。\
  \ |\n| $' | 匹配子字符串之前的字符串部分。等同于 `RegExp.rightContext`。 |\n| $` | 匹配子字符串之后的字符串部分。等同于\
  \ `RegExp.leftContext`。 |\n| $n | 第 n 个捕获，其中 n 的值为 0−9。例如，$1 是第一个捕获，$2 是第二个，以此此类推。如果没有捕获，则使用空字符串。\
  \ |\n| $nn | 第 nn 个捕获，其中 nn 的值为 01−99。例如，$01 是第一个捕获，$02 是第二个，以此此类推。如果没有捕获，则使用空字符串。\
  \ |\n\n使用这些特殊序列允许最后一次匹配的信息进行替换，如本例所示：\n\n![image](img/logo1.gif)\n\n```\nvar text\
  \ = \"cat, bat, sat, fat\";        \nresult = text.replace(/(.at)/g, \"word ($1)\"\
  );\nalert(result);    //word (cat), word (bat), word (sat), word (fat)\n```\n\n\
  StringTypePatternMatchingExample01.htm\n\n在这里，每个以 \"at\" 结尾的单词都被替换为 \"word\"，后面跟着括号，并使用\
  \ $1 序列显示它被替换的内容。\n\n`replace()` 的第二个参数也可以是一个函数。当存在单个匹配时，函数将接收三个参数：匹配字符串、匹配在字符串中的位置以及整个字符串。当存在多个捕获组时，每个匹配的字符串都将作为参数传入，最后两个参数是模式匹配在字符串中的位置和原始字符串。函数应该返回一个字符串，指示匹配应该替换为什么。使用函数作为第二个参数允许对替换文本进行更细粒度的控制，如示例所示：\n\
  \n```\nfunction htmlEscape(text){\n    return text.replace(/[<>\"&]/g, function(match,\
  \ pos, originalText){\n        switch(match){\n            case \"<\":\n       \
  \         return \"&lt;\";\n            case \">\":\n                return \"&gt;\"\
  ;\n            case \"&\":\n                return \"&amp;\";\n            case\
  \ \"\\\"\":\n                return \"&quot;\";\n        }             \n    });\n\
  }\n\nalert(htmlEscape(\"<p class=\\\"greeting\\\">Hello world!</p>\")); \n//\"&lt;p\
  \ class=&quot;greeting&quot;&gt;Hello world!&lt;/p&gt\";\n```\n\nStringTypePatternMatchingExample01.htm\n\
  \n在这里，定义了函数 `htmlEscape()` 用于转义插入 HTML 的四个字符：小于、大于、和号和双引号都必须被转义。实现此目标的最简单方法是使用正则表达式查找这些字符，然后定义一个函数为每个匹配的字符返回特定的\
  \ HTML 实体。\n\n用于处理模式的最后一个字符串方法是 `split()`，它根据分隔符将字符串分割为子字符串数组。分隔符可以是字符串或 `RegExp`\
  \ 对象。（对于此方法，字符串不被视为正则表达式）。一个可选的第二个参数——数组限制，确保返回的数组不会大于特定大小。考虑一下这个示例：\n\n![image](img/logo1.gif)\n\
  \n```\nvar colorText = \"red,blue,green,yellow\";\nvar colors1 = colorText.split(\"\
  ,\");      [\"red\",\"blue\",\"green\",\"yellow\"]\nvar colors2 = colorText.split(\"\
  ,\", 2);   [\"red\", \"blue\"]\nvar colors3 = colorText.split(/,+/); //\"]\n```\n\
  \nStringTypePatternMatchingExample01.htm\n\n在此示例中，`colorText` 是一个用逗号分隔的颜色字符串。`split(\"\
  ,\")` 调用获取了用逗号分隔的颜色数组。为了将结果限制为两个，指定了第二个参数 2。最后，使用正则表达式可以获取逗号字符的数组。注意在最后一次调用中，返回的数组前后有一个空字符串。\n\
  \n浏览器对 `split()` 方法中正则表达式的支持存在差异。虽然简单模式运行相同，但未找到匹配的模式以及带有捕获组的模式表现完全不同。显著差异如下：\n\n\
  - Internet Explorer 到 8 忽略捕获组。ECMA-262 指出捕获组应插入结果数组。Internet Explorer 9 正确包含了捕获组。\n\
  - Firefox 到 3.6 在捕获组没有匹配时会在结果中包含空字符串；ECMA-262 规定未匹配的捕获组应表示为 undefined。\n\n在正则表达式中使用捕获组时还存在其他细微的差异。在使用此类正则表达式时，请确保在多种浏览器中进行彻底测试。\n\
  \n![image](img/pen.gif)\n\n关于 `split()` 和正则表达式中捕获组的跨浏览器问题的讨论，请参见 Steven Levithan\
  \ 写的“JavaScript split bugs: Fixed!”，地址为 [`blog.stelevithan.com/archives/cross-browser-split`](http://blog.stelevithan.com/archives/cross-browser-split)。\n\
  \n### localeCompare() 方法\n\n最后一个方法是 `localeCompare()`，它比较两个字符串并返回以下三个值之一：\n\n- 如果字符串在字母顺序上位于字符串参数之前，则返回一个负数（通常为\
  \ -1，但具体数值取决于实现）。\n- 如果字符串与字符串参数相等，返回 0。\n- 如果字符串在字母顺序上位于字符串参数之后，则返回一个正数（通常为 1，但再次强调，这取决于实现）。\n\
  \n\n\n\n```\nvar stringValue = \"yellow\";       \nalert(stringValue.localeCompare(\"\
  brick\"));  //1\nalert(stringValue.localeCompare(\"yellow\")); //0\nalert(stringValue.localeCompare(\"\
  zoo\"));    //-1\n```\n\nStringTypeLocaleCompareExample01.htm\n\n在这段代码中，字符串 \"yellow\"\
  \ 与三个值进行了比较：\"brick\",\"yellow\" 和 \"zoo\"。因为 \"brick\" 在字母顺序上优于 \"yellow\"，所以 `localeCompare()`\
  \ 返回 1；\"yellow\" 等于 \"yellow\"，因此该行的 `localeCompare()` 返回 0；\"zoo\" 在 \"yellow\"\
  \ 之后，因此该行的 `localeCompare()` 返回 -1。再次，由于这些值取决于实现，最好像示例中那样使用 `localeCompare()`：\n\
  \n```javascript\nfunction determineOrder(value) {\n    var result = stringValue.localeCompare(value);\n\
  \    if (result < 0){\n        alert(\"The string 'yellow' comes before the string\
  \ '\" + value + \"'.\");\n    } else if (result > 0) {\n        alert(\"The string\
  \ 'yellow' comes after the string '\" + value + \"'.\");\n    } else {\n       \
  \ alert(\"The string 'yellow' is equal to the string '\" + value + \"'.\");\n  \
  \  }\n}\n\ndetermineOrder(\"brick\");\ndetermineOrder(\"yellow\");\ndetermineOrder(\"\
  zoo\");\n```\n\nStringTypeLocaleCompareExample01.htm\n\n通过这种结构，你可以确保代码在所有实现中都能正常工作。\n\
  \n`localeCompare()` 的独特之处在于，实现的区域设置（国家和语言）精确地决定了该方法如何运行。在美国（英语是 ECMAScript 实现的标准语言），`localeCompare()`\
  \ 是区分大小写的，它判定大写字母在字母顺序上位于小写字母之后。然而，在其他区域设置中可能并非如此。\n\n### fromCharCode() 方法\n\n\
  `String` 构造函数上有一个方法：`fromCharCode()`。该方法的作用是接收一个或多个字符代码并将它们转换为字符串。本质上，这是 `charCodeAt()`\
  \ 实例方法的反向操作。考虑这个示例：\n\n![image](img/logo1.gif)\n\n```\nalert(String.fromCharCode(104,\
  \ 101, 108, 108, 111)); //\"hello\"\n```\n\nStringTypeFromCharCodeExample01.htm\n\
  \n在这段代码中，对单词 \"hello\" 中字母的一系列字符代码调用了 `fromCharCode()`。\n\n### HTML 方法\n\n浏览器厂商很早就意识到使用\
  \ JavaScript 动态格式化 HTML 的需求。因此，他们扩展了规范，包含了几个专门用于帮助常用 HTML 格式化任务的方法。下表列出了 HTML 方法。但请注意，通常这些方法不会被使用，因为它们倾向于创建非语义化的标记。\n\
  \n| 方法 | 输出 |\n| --- | --- |\n| anchor(name) | <a name=\"name\">string</a> |\n|\
  \ big() | <big>string</big> |\n| bold() | <b>string</b> |\n| fixed() | <tt>string</tt>\
  \ |\n| fontcolor(color) | <font color=\"color\">string</font> |\n| fontsize(size)\
  \ | <font size=\"size\">string</font> |\n| italics() | <i>string</i> |\n| link(url)\
  \ | <a href=\"url\">string</a> |\n| small() | <small>string</small> |\n| strike()\
  \ | <strike>string</strike> |\n| sub() | <sub>string</sub> |\n| sup() | <sup>string</sup>\
  \ |\n\n---\n\n### 单例内置对象\n\nECMA-262 定义内置对象为“任何由 ECMAScript 实现提供的对象，它不依赖于宿主环境，并在\
  \ ECMAScript 程序开始执行时就已经存在”。这意味着开发者不需要显式地实例化内置对象；它已经被实例化了。你已经学习了大部分的内置对象，例如 `Object`、`Array`\
  \ 和 `String`。ECMA-262 定义了两个单例内置对象：`Global` 和 `Math`。\n\n#### 全局对象 (Global Object)\n\
  \n`Global` 对象在 ECMAScript 中是最独特的，因为它无法被显式访问。ECMA-262 将 `Global` 对象指定为一种没有其他所有对象的属性和方法的“大杂烩”。事实上，不存在所谓的全局变量或全局函数；所有在全局定义的变量和函数都会成为\
  \ `Global` 对象的属性。本书之前介绍过的函数，如 `isNaN()`、`isFinite()`、`parseInt()` 和 `parseFloat()`\
  \ 实际上是 `Global` 对象的方法。除了这些之外，`Global` 对象上还有其他几个可用方法。\n\n#### URI 编码方法\n\n`encodeURI()`\
  \ 和 `encodeURIComponent()` 方法用于将 URI（统一资源标识符）编码以传递给浏览器。为了保持有效，URI 不能包含某些字符，例如空格。URI\
  \ 编码方法对 URI 进行编码，以便浏览器仍然接受并理解它们，将所有无效字符替换为特殊的 UTF-8 编码。\n\n`encodeURI()` 方法旨在处理整个\
  \ URI（例如 `www.wrox.com/illegal value.htm`），而 `encodeURIComponent()` 设计用于仅处理 URI\
  \ 的片段（例如上一个 URI 中的 `illegal value.htm`）。这两个方法之间的主要区别是 `encodeURI()` 不编码 URI 部分的特殊字符，如冒号、正斜杠、问号和井号，而\
  \ `encodeURIComponent()` 会编码找到的每一个非标准字符。考虑这个示例：\n\n![image](img/logo1.gif)\n\n```javascript\n\
  var uri = \"http://www.wrox.com/illegal value.htm#start\";\n\n//\"http://www.wrox.com/illegal%20value.htm#start\"\
  \nalert(encodeURI(uri));\n\n//\"http%3A%2F%2Fwww.wrox.com%Fillegal%20value.htm%23start\"\
  \nalert(encodeURIComponent(uri));\n```\n\nGlobalObjectURIEncodingExample01.htm\n\
  \n在这里，使用 `encodeURI()` 让值除了空格外完全完好，空格被替换为 `%20`。`encodeURIComponent()` 方法将所有非字母数字字符替换为它们的编码等效值。这就是为什么\
  \ `encodeURI()` 可以用于完整的 URI，而 `encodeURIComponent()` 只能用于附加在现有 URI 末尾的字符串。\n\n![image](img/pen.gif)\n\
  \n通常情况下，你使用 `encodeURIComponent()` 的频率会远高于 `encodeURI()`，因为通常需要单独编码查询字符串参数。\n\n\
  `encodeURI()` 和 `encodeURIComponent()` 的对应方法是 `decodeURI()` 和 `decodeURIComponent()`。`decodeURI()`\
  \ 方法仅解码 `encodeURI()` 会替换的字符。例如，`%20` 被替换为空格，但 `%23` 不会被替换，因为它代表井号 (#)，`encodeURI()`\
  \ 不处理。同样，`decodeURIComponent()` 解码 `encodeURIComponent()` 编码的所有字符，这意味着它解码了所有的特殊值。考虑这个示例：\n\
  \n![image](img/logo1.gif)\n\n```javascript\nvar uri = \"http%3A%2F%2Fwww.wrox.com%Fillegal%20value.htm%23start\"\
  ;\n\n//http%3A%2F%2Fwww.wrox.com%Fillegal value.htm%23start\nalert(decodeURI(uri));\n\
  \n//http://www.wrox.com/illegal value.htm#start\nalert(decodeURIComponent(uri));\n\
  ```\n\nGlobalObjectURecodingExample01.htm\n\n在这里，变量 `uri` 包含使用 `encodeURIComponent()`\
  \ 编码的字符串。第一个输出值是 `decodeURI()` 的结果，它只替换了 `%20`。第二个值是 `decodeURIComponent()` 的输出，它替换了所有特殊字符并输出没有任何转义的字符串。（这个字符串不是有效的\
  \ URI。）\n\n![image](img/pen.gif)\n\nURI 方法 `encodeURI()`、`encodeURIComponent()`、`decodeURI()`\
  \ 和 `decodeURIComponent()` 取代了 `escape()` 和 `unescape()`，后者在 ECMA-262 第三版中已弃用。URI\
  \ 方法总是更好的选择，因为它们编码所有 Unicode 字符，而原始方法仅正确编码 ASCII 字符。在生产代码中避免使用 `escape()` 和 `unescape()`。\n\
  \n#### eval 方法\n\n最后一个方法可能是整个 ECMAScript 语言中最强大的：`eval()` 方法。该方法运作就像一个整个 ECMAScript\
  \ 解释器，并接受一个参数，即要执行的 ECMAScript（或 JavaScript）字符串。这是一个示例：\n\n```javascript\neval(\"\
  alert('hi')\");\n```\n\n\n\n\n这一行在功能上等同于以下：\n\n```\nalert(\"hi\");\n```\n\n当解释器找到\
  \ `eval()` 调用时，它会将参数解释为实际的 ECMAScript 语句，然后将其插入到相应位置。由 `eval()` 执行的代码被视为调用时所在执行上下文的一部分，且执行的代码与该上下文具有相同的作用域链。这意味着在包含文中定义的变量可以在\
  \ `eval()` 调用内部被引用，例如例所示：\n\n```\nvar msg = \"hello world\";\neval(\"alert(msg)\"\
  );    //\"hello world\"\n```\n\n在这里，变量 `msg` 定义在 `eval()` 用的上下文之外，但 `alert()` 的调用仍然显示了文本\
  \ \"hello world\"，因为第二行被替换为了一行真实的代码。同样，你可以在 `eval()` 调用内部定义一个函数或变量，这些内容可以被外部代码引用，如下：\n\
  \n```\neval(\"function sayHi() { alert('hi'); }\");\nsayHi();\n```\n\n在这里，`sayHi()`\
  \ 函数定义在 `eval()` 调用内部。由于该调用被替换为实际的函数，因此可以在下一行调用 `sayHi()`。变量的情况也是如此：\n\n```\neval(\"\
  var msg = 'hello world';\");\nalert(msg);  //\"hello world\"\n```\n\n在 `eval()`\
  \ 内部创建任何变量或函数都不会被提升（hoisted），因为它们在代码解析时包含在字符串中。它们只在 `eval()` 执行时才创建。\n\n在严格模式下，`eval()`\
  \ 内部创建的变量和函数在外部无法访问，因此最后两个示例会导致错误。此外，在严格模式下，为 `eval` 赋值会导致错误：\n\n```\n\"use strict\"\
  ;\neval = \"hi\";  //导致错误\n```\n\n![image](img/pen.gif)\n\n解释代码字符串的能力非常强大，但也非常危险。使用\
  \ `eval()` 时要极端小心，尤其是当将用户输入的数据传递给它时。恶恶的用户可能会插入可能破坏你的网站或应用程序安全的值。（这被称为代码注入。）\n\n\
  # 全局对象属性\n\n`Global` 对象拥有许多属性，其中一些已经在书中提到过。`undefined`、`NaN` 和 `Infinity` 特殊值都是\
  \ `Global` 对象的属性。此外，所有原生引用类型构造函数（如 `Object` 和 `Function`）都是 `Global` 对象的属性。下表列出了所有属性。\n\
  \n| 属性 |  |\n| --- | --- |\n| undefined | 特殊值 undefined |\n| NaN | 特殊值 NaN |\n|\
  \ Infinity | 特殊值 Infinity |\n| Object | Object 的构造函数 |\n| Array | Array 的构造函数 |\n\
  | Function | Function 的构造函数 |\n| Boolean | Boolean 的构造函数 |\n| String | String 的构造函数\
  \ |\n| Number | Number 的构造函数 |\n| Date | Date 的构造函数 |\n| RegExp | RegExp 的构造函数 |\n\
  | Error | Error 的构造函数 |\n| EvalError | EvalError 的构造函数 |\n| RangeError | RangeError\
  \ 的构造函数 |\n| ReferenceError | ReferenceError 的构造函数 |\n| SyntaxError | SyntaxError\
  \ 的构造函数 |\n| TypeError | TypeError 的构造函数 |\n| URIError | URIError 的构造函数 |\n\n在 ECMAScript\
  \ 5 中，明确禁止给 `undefined`、`NaN` 和 `Infinity` 赋值。这样做即使在非严格模式下也会导致错误。\n\n# Window 对象\n\
  \n尽管 `Window` 对象，明确禁止给 `undefined`、`NaN` 和 `Infinity` 赋值。这样做即使在非严格模式下也会导致错误。（注：原文在此处有重复/片段，我保持了核心逻辑）。\n\
  \n`Window` 对象，尽管明确禁止给 `undefined`、`NaN` 和 `Infinity` 赋值。这样做即使在非严格模式下也会导致错误。\n\n\
