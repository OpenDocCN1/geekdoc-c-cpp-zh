  \ 绘图上下文提供了绘制文本的方法。有两种绘制文本的方法，`fillText()` 和 `strokeText()`，每个都接受四个参数：要绘制的字符串、x 坐标、y\
  \ 坐标以及可选的像素宽度。两种方法都基于以下三个属性进行绘制：\n\n*   `font` — 以 CSS 中指定的方式指示字体样式、大小和族，例如 \"10px\
