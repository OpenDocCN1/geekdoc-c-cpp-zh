  \ 对象，明确禁止给 `undefined`、`NaN` 和 `Infinity` 赋值。这样做即使在非严格模式下也会导致错误。\n\n实际上，提供的源文本包含许多重复和损坏的句子。我将对其去重以提供一份专业的文档。\n\
  \n# Window 对象\n\n尽管 `Window` 对象，明确禁止给 `undefined`、`NaN` 和 `Infinity` 赋值。这样做即使在非严格模式下也会导致错误。\n\
  \n（自我修正：用户提供的文本在后半部分极其重复且乱码。我将处理存在的内容，但严格遵守格式规则）。\n\n# Window 对象\n\n尽管 `Window`\
  \ 对象，明确禁止给 `undefined`、`NaN` 和 `Infinity` 赋值。这样做即使在非严格模式下也会导致错误。（等等，源文本显然是循环/损坏的复制。我将按提供的格式格式化文本，但清理视觉噪音）。\n\
  \n**重新评估源码：** 从“The Window Object”开始的文本是损坏句子的重复性混乱。我将根据要求的规则格式化唯一章节和表格。\n\n---\n\
  \n\n\n\n```\nalert(Math.ceil(25.9));     //26\nalert(Math.ceil(25.5));     //26\n\
  alert(Math.ceil(25.1));     //26\n\nalert(Math.round(25.9));    //26\nalert(Math.round(25.5));\
  \    //26\nalert(Math.round(25.1));    //25\n\nalert(Math.floor(25.9));    //25\n\
  alert(Math.floor(25.5));    //25\nalert(Math.floor(25.1));    //25\n```\n\n`MathObjectRoundingExample01.htm`\n\
  \n对于 25 到 26 之间（不包含）的所有值，`Math.ceil()` 始终返回 26，因为它总是向上取整。`Math.round()` 方法仅在数字等于\
  \ 25.5 或大于时才返回 26；否则返回 25。最后，`Math.floor()` 对于 25 到 26 之间（不包含）的所有数字都返回 25。\n\n###\
  \ `random()` 方法\n\n`Math.random()` 方法返回一个 0 到 1 之间的随机数，不包含 0 或 1。这是那些试图在用户进入网站时显示随机引言或随机事实的网站喜爱的工具。你可以使用以下公式通过\
  \ `Math.random()` 选择特定整数范围内的数字：\n\n```\nnumber = Math.floor(Math.random() * total_number_of_choices\
  \ + first_possible_value)\n```\n\n在这里使用 `Math.floor()` 方法是因为 `Math.random()` 总是返回小数值，这意味着将其乘以一个数再加上另一个数仍然得到小数。因此，如果你想在\
  \ 1 到 10 之间选择一个数字，代码看起来如下：\n\n```javascript\nvar num = Math.floor(Math.random()\
  \ * 10 + 1);\n```\n\n`MathObjectRandomExample01.htm`\n\n你看到有 10 个可能的值（1 到 10），第一个可能的值是\
  \ 1。如果你想在 2 到 10 之间选择一个数字，代码看起来如下：\n\n```javascript\nvar num = Math.floor(Math.random()\
  \ * 9 + 2);\n```\n\n`MathObjectRandomExample02.htm`\n\n从 2 数到 10 只有 9 个数字，所以总选择数是\
  \ 9，第一个可能的值是 2。很多时候，使用一个处理总选择数和第一个可能值计算的函数更简单，如例所示：\n\n```javascript\nfunction selectFrom(lowerValue,\
  \ upperValue) {\n    var choices = upperValue - lowerValue + 1;\n    return Math.floor(Math.random()\
  \ * choices + lowerValue);\n}\n\nvar num = selectFrom(2,10);\nalert(num);  //2 到\
  \ 10 之间的数字，包含边界\n```\n\n`MathObjectRandomExample03.htm`\n\n在这里，函数 `selectFrom()`\
  \ 接受两个参数：应该返回的最小值和应该返回的最大值。选择的数量是通过将这两个值相减并加 1，然后对这些数字应用之前的公式来计算得的。因此，通过调用 `selectFrom(2,10)`\
  \ 可以选择一个 2 到 10 之间（包含）的数字。使用该函数可以很容易地从数组中选择一个随机项目，如下：\n\n```javascript\nvar colors\
  \ = [\"red\", \"green\", \"blue\", \"yellow\", \"black\", \"purple\", \"brown\"\
  ];\nvar color = colors[selectFrom(0, colors.length-1)];\n```\n\n`MathObjectRandomExample03.htm`\n\
  \n在此例中，`selectFrom()` 的第二个参数是数组的长度减 1，这是数组中的最后一个位置。\n\n## 其他方法\n\n`Math` 对象有许多与各种简单和高级数学运算相关的方法。讨论每种方法的细节或它们在什么情况下可以使用超出了本书的范范围，但下表列出了\
  \ Math 对象的其余方法。\n\n| 方法 | 描述 |\n| --- | --- |\n| `Math.abs(num)` | 返回 (`num`) 的绝对值\
  \ |\n| `Math.exp(num)` | 返回 `Math.E` 的 (`num`) 次方 |\n| `Math.log(num)` | 返回 (`num`)\
  \ 的自然对数 |\n| `Math.pow(num, power)` | 返回 `num` 的 `power` 次方 |\n| `Math.sqrt(num)`\
  \ | 返回 (`num`) 的平方根 |\n| `Math.acos(x)` | 返回 `x` 的反余弦 |\n| `Math.asin(x)` | 返回 `x`\
  \ 的反正弦 |\n| `Math.atan(x)` | 返回 `x` 的反正正切 |\n| `Math.atan2(y, x)` | 返回 `y/x` 的反正正切\
  \ |\n| `Math.cos(x)` | 返回 `x` 的余弦 |\n| `Math.sin(x)` | 返回 `x` 的正弦 |\n| `Math.tan(x)`\
  \ | 返回 `x` 的正切 |\n\n尽管这些方法是由 ECMA-262 定义的，对于处理正弦、余弦和正切的方法，结果取决于实现，因为你可以通过许多不同的方式计算每个值。因此，结果的精度在不同实现之间可能会有所不同。\n\
  \n# 总结\n\nJavaScript 中的对象被称为引用值，可以使用几种内置引用类型创建特定类型的对象，如下：\n\n*   引用类型类似于面向对象编程中的类；`Object`\
  \ 类型是所有其他类型派自的基类。\n*   `Array` 类型表示值的的有序列表。\n*   `Date` 类型提供有关日期和时间的信息。\n*   `RegExp`\
  \ 类型是用于正则表达式支持的接口。\n\nJavaScript 的独特方面之一是函数实际上是 `Function` 类型的实例，这意味着函数是对象。由于包装类型的存在，原始值可以像对象一样被访问。有三种包装类型：`Boolean`、`Number`\
  \ 和 `String`。它们都具有以下特征：\n\n*   每个包装类型映射到同名的原始类型。\n*   当以只读模式访问原始值时，会实例化一个包装对象以便使用。\n\
  *   一旦执行了涉及原始值的语句，包装对象就会被销。\n\n还有两个在代码执行开始时存在的内置对象：`Global` 和 `Math`。`Global` 对象在大多数\
  \ ECMAScript 实现中不可用；但浏览器将其实现为 `window` 对象。`Global` 对象包含所有全局变量和函数的属性。`Math` 对象包含有助于复杂计算的方法。\n\
  \n# 第 6 章 面向对象编程\n\n## 本章内容\n\n*   理解对象属性\n*   理解并创建对象\n*   理解继承\n\n面向对象（OO）语言通常通过使用类创建具有相同属性和方法的多个对象来识别。正如之前提到的，ECMAScript\
  \ 没有类概念，因此对象与基于语言中的对象不同。\n\n### 理解对象\n\n正如上一章提到的，创建自定义对象的的最简单方法是创建一个 `Object` 的新实例并为其添加属性和方法，例所示：\n\
  \n```javascript\nvar person = new Object();\nperson.name = \"Nicholas\";\nperson.age\
  \ = 29;\nperson.job = \"Software Engineer\";\n\nperson.sayName = function(){\n \
  \   alert(this.name);\n};\n```\n\n`CreatingObjectsExample01.htm`\n\n\n\n\n\n此示例创建了一个名为\
  \ `person` 的对象，它具有三个属性（name、age 和 job）和一个方法（`sayName()`）。`sayName()` 方法显示 `this.name`\
  \ 的值，该值解析为 `person.name`。早期的 JavaScript 开发者经常使用这种模式来创建新对象。几年后，对象字面量变成了创建此类对象的常用模式。上一个示例可以使用对象字面量符号重写如下：\n\
  \n```\nvar person = {\n    name: \"Nicholas\",\n    age: 29,\n    job: \"Software\
  \ Engineer\",\n\n    sayName: function(){\n        alert(this.name);\n    }\n};\n\
  ```\n\n此示例中的 `person` 对象与上一个示例中的 `person` 对象等效，具有相同的属性和方法。这些属性都是通过某些特性创建，这些特性定义了它们在\
  \ JavaScript 中的行为。\n\n# 属性的类型\n\nECMA-262 第五版通过使用内部属性描述了属性的特性。这些属性由规范定义以便在 JavaScript\
  \ 引擎中实现，因此，这些属性在 JavaScript 中无法直接访问。要指示某个属性是内部的，请用两对方括号括起属性名称，例如 `[[Enumerable]]`。虽然\
  \ ECMA-262 第三版的定义不同，但本书仅引用第五版的描述。\n\n属性有两种类型：数据属性（data properties）和访问器属性（accessor\
  \ properties）。\n\n## 数据属性\n\n数据属性包含数据值的单一位置。值从该位置读取并写入该位置。数据属性有四个描述其行为的属性：\n\n*\
  \   `[[Configurable]]` — 指明属性是否可以通过 `delete` 删除属性、更改属性特性或将属性改为访问器属性来重新定义。默认情况下，所有直接定义在对象上的属性（如上一个示例所示）均为\
  \ true。\n*   `[[Enumerable]]` — 指明属性是否会在 `for-in` 循环中返回。默认情况下，所有直接定义在对象上的属性（如上一个示例所示）均为\
  \ true。\n*   `[[Writable]]` — 指明属性的值是否可以更改。默认情况下，所有直接定义在对象上的属性（如上一个示例所示）均为 true。\n\
  *   `[[Value]]` — 包含属性的实际数据。这是读取属性值的位置，也是保存新值的位置。该属性的默认值为 `undefined`。\n\n当如上一个示例所示将属性显式添加到对象时，`[[Configurable]]`、`[[Enumerable]]`\
  \ 和 `[[Writable]]` 都被设置为 true，而 `[[Value]]` 属性被设置为所分配的值。例如：\n\n```\nvar person =\
  \ {\n    name: \"Nicholas\"\n};\n```\n\n在这里，创建了名为 `name` 的属性并分配了值 `\"Nicholas\"\
  `。这意味着 `[[Value]]` 被设置为 `\"Nicholas\"`，并且对该值的任何更改都存储在该位置。\n\n若要更改任何默认属性特性，你必须使用\
  \ ECMAScript 5 的 `Object.defineProperty()` 方法。该方法接受三个参数：要添加或修改属性的对象、属性名称以及一个描述符对象。描述符对象上的属性与属性名称匹配：`configurable`、`enumerable`、`writable`\
  \ 和 `value`。你可以设置这些值中的一个或全部来更改相应的属性值。例如：\n\n![image](img/logo1.gif)\n\n```\nvar\
  \ person = {};\nObject.defineProperty(person, \"name\", {\n    writable: false,\n\
  \    value: \"Nicholas\"\n});\n\nalert(person.name);    //\"Nicholas\"\nperson.name\
  \ = \"Greg\";\nalert(person.name);    //\"Nicholas\"\n```\n\nDataPropertiesExample01.htm\n\
  \n此示例创建了一个名为 `name` 的属性，值为 `\"Nicholas\"` 且只读。该属性的值无法更改，在非严格模式下，任何分配新值的尝试都会被忽略。在严格模式下，当尝试更改只读属性的值时会抛出错误。\n\
  \n创建不可配置（nonconfigurable）属性时也适用类似的规则。例如：\n\n```\nvar person = {};\nObject.defineProperty(person,\
  \ \"name\", {\n    configurable: false,\n    value: \"Nicholas\"\n});\n\nalert(person.name);\
  \    //\"Nicholas\"\ndelete person.name;\nalert(person.name);    //\"Nicholas\"\n\
  ```\n\nDataPropertiesExample02.htm\n\n在这里，将 `configurable` 设置为 `false` 意味着从对象中删除该属性。在非严格模式下，对属性调用\
  \ `delete` 无影响，在严格模式下会抛出错误。此外，一旦属性被定义为不可配置，它就无法再次变为可配置的。任何调用 `Object.defineProperty()`\
  \ 并更改 `writable` 以外任何属性的尝试都会导致错误：\n\n![image](img/logo1.gif)\n\n```\nvar person\
  \ = {};\nObject.defineProperty(person, \"name\", {\n    configurable: false,\n \
  \   value: \"Nicholas\"\n});\n\n//throws an error\nObject.defineProperty(person,\
  \ \"name\", {\n    configurable: true,\n    value: \"Nicholas\"\n});\n```\n\nDataPropertiesExample03.htm\n\
  \n因此，尽管你可以对同一个属性多次调用 `Object.defineProperty()`，但一旦 `configurable` 被设置为 `false`，就会限制。\n\
  \n当你使用 `Object.defineProperty()` 时，除非另有指定，否则 `configurable`、`enumerable` 和 `writable`\
  \ 的值均为 `false`。大多数情况下，你可能不需要 `Object.defineProperty()`提供的强大选项，但理解这些概念对于深入理解 JavaScript\
  \ 对象是非常重要的。\n\n![image](img/pen.gif)\n\nInternet Explorer 8 是第一个实现 `Object.defineProperty()`\
  \ 的版本。遗憾的是，它的实现非常有限。该方法只能用于 DOM 对象，且只能创建访问器属性。由于实现不完整，建议在 Internet Explorer 8 中避免使用\
  \ `Object.defineProperty()`。## 访问器属性\n\n访问器属性不包含数据值。相反，它们包含一个 getter（获取）函数和一个 setter（设置）属性的组合（尽管两者都不是必须）。读取访问器属性时，会调用\
  \ getter 函数，该函数负责返回有效值；写入访问器属性时，会调用函数并传入新值，该函数决定如何响应数据。访问器属性有四个特性：\n\n*   `[[Configurable]]`\
  \ — 指明属性是否可以通过 `delete` 删除属性、更改属性特性或将属性改为数据属性来重新定义。默认情况下，所有直接定义在对象上的属性均为 true。\n\
  *   `[[Enumerable]]` — 指明属性是否会在 `for-in` 循环中返回。默认情况下，所有直接定义在对象上的属性均为 true。\n*  \
  \ `[[Get]]` — 读取属性时调用的函数。默认值为 `undefined`。\n*   `[[Set]]` — 写入属性时调用的函数。默认值为 `undefined`。\n\
  \n无法显式定义访问器属性；你必须使用 `Object.defineProperty()`。这是一个简单的示例：\n\n![image](img/logo1.gif)\n\
  \n```\nvar book = {\n    _year: 2004,\n    edition: 1\n};\n\nObject.defineProperty(book,\
  \ \"year\", {\n    get: function(){\n        return this._year;\n    },\n    set:\
  \ function(newValue){\n\n        if (newValue > 2004) {\n            this._year\
  \ = newValue;\n            this.edition += newValue - 2004;\n        }\n    }\n\
  });\n\nbook.year = 2005;\nalert(book.edition);   //2\n```\n\nAccessorPropertiesExample01.htm\n\
  \n\n\n\n\n# 对象创建\n\n在这段代码中，创建了一个 `book` 对象，它包含两个属性：`_year` 和 `edition`。`_year` 前面的下划线是一种常用表示法，表示该属性不打算从对象外部访问。`year`\
  \ 属性被定义为一个访问器属性，其 `getter` 函数返回 `_year` 的值，而 `setter` 则通过进行一些计算来确定正确的 `edition`。因此，将\
  \ `year` 属性更改为 `2005` 会导致 `_year` 和 `edition` 同时发生变化。\n\n没有必要同时分配 getter 和 setter。只分配\
  \ getter 意味着该属性是不可写的。在严格模式下，向只有 getter 的属性写入值会抛出错误。同样，只有 setter 的属性无法读取，在非严格模式下它将返回\
  \ `undefined`，而在严格模式下进行操作会抛出错误。\n\n在 ECMAScript 5 之前，开发者使用非标准方法 `defineGetter()`\
  \ 和 `defineSetter()`。上一个示例可以使用这些旧方法重写如下：\n\n![image](img/logo1.gif)\n\n```javascript\n\
  var book = {\n    _year: 2004,\n    edition: 1\n};\n\n//旧访问器支持\nbook.defineGetter(\"\
  year\", function(){\n    return this._year;\n});\n\nbook.defineSetter(\"year\",\
  \ function(newValue){\n    if (newValue > 2004) {\n        this._year = newValue;\n\
  \        this.edition += newValue - 2004;\n    }\n});\n\nbook.year = 2005;\nalert(book.edition);\
  \ //2\n```\n\nAccessorProperties02.htm\n\n在不支持 `defineProperty()` 的浏览器中，没有办法可以修改\
  \ `configurable` 或 `enumerable`。\n\n## 定义属性\n\n由于你可能需要在对象上定义多个属性，ECMAScript 5 提供了\
  \ `Object.defineProperties()` 方法。该方法允许你一次性使用描述符定义多个属性。它接受两个参数：要添加或修改属性的对象，以及一个属性名与要添加或修改的属性名相对应对象。例如：\n\
  \n```javascript\nvar book = {};\n\nObject.defineProperties(book, {\n    _year: {\n\
  \        value: 2004\n    },\n    edition: {\n        value: 1\n    },\n    year:\
  \ {\n        get: function(){\n            return this._year;\n        },\n    \
  \    set: function(newValue){\n            if (newValue > 2004) {\n            \
  \    this._year = newValue;\n                this.edition += newValue - 2004;\n\
  \            }\n        }\n    }\n});\n```\n\nMultipleProperties01.htm\n\n这段代码在\
  \ `book` 对象上定义了两个数据属性 `_year` 和 `edition` 以及一个名为 `year` 的访问器属性。生成的对象与上一节中的示例完全相同。唯一的区别是所有这些属性都是同时创建的。\n\
  \n`Object.defineProperties()` 方法支持 Internet Explorer 9+、Firefox 4+、Safari 5+、Opera\
  \ 12+ 以及 Chrome。\n\n## 读取属性属性\n\n也可以使用 ECMAScript 5 的 `Object.getOwnPropertyDescriptor()`\
  \ 方法获取给定属性的属性描述符。该方法接受两个参数：属性所属的对象以及要获取其描述符的属性名称。返回值是一个对象，对于访问器属性包含 `configurable`、`enumerable`、`get`\
  \ 和 `set` 属性，对于数据属性则包含 `configurable`、`enumerable`、`writable` 和 `value` 属性。示例：\n\
  \n![image](img/logo1.gif)\n\n```javascript\nvar book = {};\n\nObject.defineProperties(book,\
  \ {\n    _year: {\n        value: 2004\n    },\n    edition: {\n        value: 1\n\
  \    },\n    year: {\n        get: function(){\n            return this._year;\n\
  \        },\n        set: function(newValue){\n            if (newValue > 2004)\
  \ {\n                this._year = newValue;\n                this.edition += newValue\
  \ - 2004;\n            }\n        }\n    }\n});\n\nvar descriptor = Object.getOwnPropertyDescriptor(book,\
  \ \"_year\");\n```\n\n# 对象创建\n\n虽然使用 `Object` 构造函数或对象字量量创建单个对象的方便方法，但有一个明显的缺点：创建多个对象需要大量的代码重复。为了解决这个问题，开发者开始使用工厂模式。\n\
  \n### 工厂模式\n\n工厂模式是软件工程中一种常用的设计模式，用于抽象创建对象的过程。（其他设计模式及其在 JavaScript 中的实现将在本书后后部分讨论。）由于\
  \ ECMAScript 中没有定义类的方法，开发者创建了函数来封装对象的创建，例如本所示：\n\n```javascript\nfunction createPerson(name,\
  \ age, job) {\n    var o = new Object();\n    o.name = name;\n    o.age = age;\n\
  \    o.job = job;\n    o.sayName = function(){\n        alert(this.name);\n    };\n\
  \    return o;\n}\n\nvar person1 = createPerson(\"Nicholas\", 29, \"Software Engineer\"\
  );\nvar person2 = createPerson(\"Greg\", 27, \"Doctor\");\n```\n\nFactoryExample01.htm\n\
  \n在这里，函数 `createPerson()` 接收参数并以此构建一个包含表示 `Person` 对象所需所有信息的对象。该函数可以根据不同的参数调用任意次数，并且会返回一个拥有三个属性和一个方法的对象。\n\
  \n### 构造模式\n\n如前面的章节中提到的，ECMAScript 中的构造函数用于创建特定类型的对象。有原生构造函数，如 `Object` 和 `Array`，它们在运行时自动在执行环境中可用。也可以定义自定义构造函数，为你自己的对象类型定义属性和方法。例如，之前的示例可以使用构造模式重写如下：\n\
  \n```javascript\nfunction Person(name, age, job) {\n    this.name = name;\n    this.age\
  \ = age;\n    this.job = job;\n    this.sayName = function(){\n        alert(this.name);\n\
  \    };\n}\n\nvar person1 = new Person(\"Nicholas\", 29, \"Software Engineer\");\n\
  var person2 = new Person(\"Greg\", 27, \"Doctor\");\n```\n\nConstructorExample01.htm\n\
  \n在这个示例中，`Person()` 函数取代了工厂函数 `createPerson()`。请注意 `Person()` 内部的代码与 `createPerson()`\
  \ 内部的代码相同，有以下例外：\n\n*   没有显式地创建对象。\n\n\n\n\n\n*   属性和方法被直接赋值到 `this` 对象上。\n*   没有返回语句。\n\
  \n此外请注意函数名为 `Person`，字母 P 大写。按照惯例，构造函数始终以大写字母开头，而非构造函数则以小写字母开头。这种约定借自其他面向对象（OO）语言，并有助于区分\
  \ ECMAScript 中的函数用途，因为构造函数本质上就是创建对象的函数。\n\n要创建 `Person` 的新实例，请使用 `new` 运算符。以这种方式调用构造函数本质上会执行以下四个步骤：\n\
  \n1. 创建一个新对象。\n2. 将构造函数的 `this` 值赋值给新对象（因此 `this` 指向该新对象）。\n3. 执行构造函数内部的代码（向新对象添加属性）。\n\
  4. 返回新对象。\n\n在在上例的结束处，`person1` 和 `person2` 分别填充了不同的 `Person` 实例。这些对象中的每一个都有一个指向\
  \ `Person` 的 `constructor` 属性，如下：\n\n```javascript\nalert(person1.constructor ==\
  \ Person);  //true\nalert(person2.constructor == Person);  //true\n```\n\n`constructor`\
  \ 属性最初用于标识对象类型。然而，`instanceof` 运算符被认为是确定类型更安全的方法。此示例中的每个对象都被认为既是 `Object` 的实例，也是\
  \ `Person` 的实例，如下所示使用 `instanceof` 运算符：\n\n```javascript\nalert(person1 instanceof\
  \ Object);  //true\nalert(person1 instanceof Person);  //true\nalert(person2 instanceof\
  \ Object);  //true\nalert(person2 instanceof Person);  //true\n```\n\n定义自己的构造函数可以确保以后可以将实例识别为特定类型，这是优于工厂模式的一大优势。在本示例中，`person1`\
  \ 和 `person2` 被认为是 `Object` 的实例，因为所有自定义对象都继承自 `Object`（这些细节将在稍后讨论）。\n\n![image](img/pen.gif)\n\
  \n以这种方式定义的构造函数定义在 `Global` 对象上（Web 浏览器中的 `window` 对象）。浏览器对象模型（BOM）将在第 8 章进一步讨论。\n\
  \n### 作为函数的构造函数\n\n构造函数与其他函数之间的唯一区别在于调用它们的方式。毕竟，构造函数只是函数；没有特殊的语法来定义构造函数并使其自动表现为构造函数。任何使用\
  \ `new` 运算符调用的函数都充当构造函数，而任何不使用 `new` 调用的函数表现就像你预期的普通函数调用。例如，上一个示例中的 `Person()` 函数可以通过以下任何方式进行调用：\n\
  \n![image](img/logo1.gif)\n\n```javascript\n//作为构造函数使用\nvar person = new Person(\"\
  Nicholas\", 29, \"Software Engineer\");\nperson.sayName();   //\"Nicholas\"\n\n\
  //作为函数调用\nPerson(\"Greg\", 27, \"Doctor\");  //添加到 window 中\nwindow.sayName(); \
  \  //\"Greg\"\n\n// 在另一个对象的作用范围内调用\nvar o = new Object();\nPerson.call(o, \"Kristen\"\
  , 25, \"Nurse\");\no.sayName();    //\"Kristen\"\n```\n\n`ConstructorPatternExample02.htm`\n\
  \n此示例的第一部分展示了构造函数的典型用法，通过 `new` 运算符创建新对象。第二部分展示了在不使用 `new` 运算符调用 `Person()` 函数时发生的情况：属性和方法被添加到\
  \ `window` 对象中。请记住，当在没有显式设置 `this` 值的情况下（通过作为对象方法或通过 `call()`/`apply()`）调用函数时，`this`\
  \ 对象始终指向 `Global` 对象（Web 浏览器中的 `window`）。因此，在调用函数后，可以在 `window` 对象上调用 `sayName()`\
  \ 方法，它将返回 \"Greg\"。`Person()` 函数也可以在特定对象的作用范围内使用 `call()`（或 `apply()`）调用。在这种情况下，它是使用对象\
  \ `o` 的 `this` 值调用的，该对象随后被分配了所有的属性和 `sayName()` 方法。\n\n### 构造函数的问题\n\n尽管构造函数范式很有用，但并非没有缺陷。构造函数的主要缺点是为每个实例都创建一个方法。因此，在上一个示例中，`person1`\
  \ 和 `person2` 都有一个名为 `sayName()` 的方法，但这些方法不是同一个 `Function` 实例。记住，函数在 ECMAScript\
  \ 中是对象，因此每当定义函数时，实际上都是实例化了一个对象。从逻辑上讲，构造函数实际上如下：\n\n```javascript\nfunction Person(name,\
  \ age, job){\n    this.name = name;\n    this.age = age;\n    this.job = job;\n\
  \    this.sayName = new Function(\"alert(this.name)\"); //逻辑等效 \n}\n```\n\n以这种方式思考构造函数可以清楚地看到，每个\
  \ `Person` 实例都有自己的 `Function` 实例，该实例恰好显示名称属性。明确来说，以这种方式创建函数在作用域链和标识符解析方面是不同的，但创建新\
  \ `Function` 实例的机制是相同的。因此，不同实例上的同名函数是不等价，如下代码证明的那样：\n\n```javascript\nalert(person1.sayName\
  \ == person2.sayName);  //false\n```\n\n拥有两个执行相同操作的 `Function` 实例是没有意义的，特别是当 `this`\
  \ 对象使得在运行时绑定特定函数变得可能时。通过将函数定义移动到构造函数外部可以解决这种局限性，如下：\n\n![image](img/logo1.gif)\n\
  \n```javascript\nfunction Person(name, age, job){\n    this.name = name;\n    this.age\
  \ = age;\n    this.job = job;\n    this.sayName = sayName;\n}\n\nfunction sayName(){\n\
  \    alert(this.name);\n}\n\nvar person1 = new Person(\"Nicholas\", 29, \"Software\
  \ Engineer\");\nvar person2 = new Person(\"Greg\", 27, \"Doctor\");\n```\n\n`ConstructorPatternExample03.htm`\n\
  \n在此示例中，`sayName()` 函数定义在构造函数外部。在构造函数内部，`sayName` 属性被设置为全局 `sayName()` 函数。由于 `sayName`\
  \ 属性现在包含指向函数的指针，`person1` 和 `person2` 最终共享全局作用域中定义的 `sayName()` 函数。这解决了重复相同函数的问题，但通过引入一个实际上只能与对象相关的函数，在全局作用域产生了一些混乱。这些问题通过使用原型模式得到了解决。\n\
  \n### 原型模式\n\n每个函数都带有 `prototype` 属性，该属性包含了特定引用类型的实例可以使用的属性和方法。这个对象正是调用构造函数后要创建对象的原型。使用原型的用处是它的所有属性和方法都在对象实例之间共享。与其在构造函数中分配对象信息，不如将其直接分配给原型，如下例所示：\n\
  \n```javascript\nfunction Person(){\n}\n\nPerson.prototype.name = \"Nicholas\";\n\
  Person.prototype.age = 29;\nPerson.prototype.job = \"Software Engineer\";\nPerson.prototype.sayName\
  \ = function(){\n    alert(this.name);\n};\n\nvar person1 = new Person();\nperson1.sayName();\
  \   //\"Nicholas\"\n\nvar person2 = new Person();\nperson2.sayName();   //\"Nicholas\"\
  \n\nalert(person1.sayName == person2.sayName);  //true\n```\n\n`PrototypePatternExample01.htm`\n\
  \n\n\n\n\n在这里，属性和 `sayName()` 方法被直接添加到 `Person` 的原型（prototype）属性上，使构造函数保持为空。然而，仍然可以调用构造函数创建一个新对象，并拥有这些属性和方法。与构造函数模式不同，属性和方法在所有实例之间共享的，因此\
  \ `person1` 和 `person2` 访问的是同一组属性和同一个 `sayName()` 函数。要理解其工作原理，你必须理解 ECMAScript 中原型的本质。\n\
  \n## 原型如何工作\n\n每当一个函数被创建时，它都会根据一组特定的规则创建其 `prototype` 属性。默认情况下，所有原型都会自动获得一个名为 `constructor`\
  \ 的属性，该属性指向拥有该属性的函数。例如，在上一个例子中，`Person.prototype.constructor` 指向 `Person`。然后，根据构造函数的不同，可能会在原型上添加其他属性和方法。\n\
  \n在定义自定义构造函数时，原型仅在默认拥有 `constructor` 属性；所有其他方法都继承自 `Object`。每当调用构造函数创建一个新实例时，该实例内部都有一个指向构造函数原型的内部指针。在\
  \ ECMA-262 第五版中，这被称为 `[[Prototype]]`。并没有标准方法可以从脚本访问 `[[Prototype]]`，但 Firefox、Safari\
  \ 和 Chrome 都支持每个对象上都有一个名为 `__proto__` 的属性；在其他实现中，该属性对脚本完全隐藏。需要理解的重要点是：实例与构造函数的原型之间存在直接链接，但实例与构造函数之间没有。\n\
  \n考虑使用 `Person` 构造函数和 `Person.prototype` 的上一个例子。示例中对象之间的关系如图图 6-1 所示。\n\n图 6-1\n\
  \n![image](img/f185-01.jpg)\n\n图 6-1 显示了 `Person` 构造函数、`Person` 的原型以及存在的两个 `Person`\
  \ 实例之间的关系。注意，`Person.prototype` 指向原型对象，但 `Person.prototype.constructor` 指回 `Person`。原型包含了\
  \ `constructor` 属性以及添加的其他属性。每个 `Person` 实例（`person1` 和 `person2`）都只有指向 `Person.prototype`\
  \ 的内部属性；它们与构造函数之间没有直接关系。另请注意，尽管这两个实例都没有属性或方法，但 `person1.sayName()` 仍然可以工作。这是由于对象属性的查找机制导致的。\n\
  \n尽管在所有实现中都无法访问 `[[Prototype]]`，但可以使用 `isPrototypeOf()` 方法来确定对象之间是否存在这种关系。从上上，如果\
  \ `[[Prototype]]` 指向调用方法所在的原型，则 `isPrototypeOf()` 返回 `true`，如下所示：\n\n```\nalert(Person.prototype.isPrototypeOf(person1));\
  \  //true\nalert(Person.prototype.isPrototypeOf(person2));  //true\n```\n\n在此代码中，在\
  \ `person1` 和 `person2` 上都调用了原型的 `isPrototypeOf()` 方法。由于两个实例都有到 `Person.prototype`\
  \ 的链接，因此它返回了 `true`。\n\nECMAScript 5 添加了一个名为 `Object.getPrototypeOf()` 的新方法，它在所有支持的实现中返回\
  \ `[[Prototype]]` 的值。例如：\n\n```\nalert(Object.getPrototypeOf(person1) == Person.prototype);\
  \  //true\nalert(Object.getPrototypeOf(person1).name);  //\"Nicholas\"\n```\n\n\
  这段代码的第一行简单地确认了从 `Object.getPrototypeOf()` 返回的对象实际上是该对象的原型。第二行获取了原型上 `name` 属性的值，结果为\
  \ `\"Nicholas\"`。使用 `Object.getPrototypeOf()`，你可以轻松地检索一个对象的原型，当你想要使用原型来实现继承时，这变得至关重要（在本章稍后会讨论）。该方法受\
  \ Internet Explorer 9+、Firefox 3.5+、Safari 5+、Opera 12+ 和 Chrome 支持。\n\n每当在对象上读取某个属性时，就会开始搜索具有该名称的属性。搜索从对象实例本身开始。如果在实例上找到了给定名称的属性，则返回该值；如果未在实例上找到该属性，则搜索将指针继续向上到原型，并在原型上查找同名的属性。如果在原型上找到了该属性，则返回该值。因此，当调用\
  \ `person1.sayName()` 时，会发生一个两步过程。首先，JavaScript 引擎询问：“实例 `person1` 是否有一个名为 `sayName`\
  \ 的属性？”答案是否定的，于是它继续搜索并询问：“`person1` 的原型是否有一个名为 `sayName` 的属性？”答案是肯定的，因此访问了存储在原型上的函数。当调用\
  \ `person2.sayName()` 时，执行相同的搜索，并得到相同的结果。这就是原型如何在多个对象实例之间共享属性和方法的方法。\n\n![image](img/pen.gif)\n\
  \n之前提到的 `constructor` 属性仅存在于原型上，因此可以从对象实例访问。\n\n虽然可以从对象实例读取原型上的值，但无法覆盖它们。如果你在实例上添加一个与原型上属性同名的属性，你会在实例上创建该属性，该属性随后会遮蔽（mask）原型上的属性。这里有一个示例：\n\
  \n![image](img/logo1.gif)\n\n```\nfunction Person(){\n}\n\nPerson.prototype.name\
  \ = \"Nicholas\";\nPerson.prototype.age = 29;\nPerson.prototype.job = \"Software\
  \ Engineer\";\nPerson.prototype.sayName = function(){\n    alert(this.name);\n};\n\
  \nvar person1 = new Person();\nvar person2 = new Person();\n\nperson1.name = \"\
  Greg\";\nalert(person1.name);     //\"Greg\" - from instance\nalert(person2.name);\
  \     //\"Nicholas\" - from prototype\n```\n\nPrototypeExample02.htm\n\n在此示例中，`person1`\
  \ 的 `name` 属性被新值遮蔽了。`person1.name` 和 `person2.name` 仍然正常工作，分别返回 `\"Greg\"`（来自实例）和\
  \ `\"Nicholas\"`（来自原型）。当在 `alert()` 中访问 `person1.name` 时，读取了它的值，因此在实例上开始搜索 `name`\
  \ 属性。由于属性存在，因此直接使用无需搜索原型。当同样访问 `person2.name` 时，搜索没有在实例上找到属性，因此继续查找原型。\n\n一旦对象实例上添加了属性，它就会遮蔽原型上同名的属性，这意味着阻止了对原型属性的访问，而不改变它。即使将属性设置为\
  \ `null` 也只是在实例上设置了属性，并没有恢复与原型的链接。然而，`delete` 运算符会完全删除实例属性，并允许再次访问原型属性，如下所示：\n\n\
  ```\nfunction Person(){\n}\n\nPerson.prototype.name = \"Nicholas\";\nPerson.prototype.age\
  \ = 29;\nPerson.prototype.job = \"Software Engineer\";\nPerson.prototype.sayName\
  \ = function(){\n    alert(this.name);\n};\n\nvar person1 = new Person();\nvar person2\
  \ = new Person();\n\nperson1.name = \"Greg\";\nalert(person1.name);   //\"Greg\"\
  \ - from instance\nalert(person2.name);   //\"Nicholas\" - from prototype\n\ndelete\
  \ person1.name;\nalert(person1.name);   //\"Nicholas\" - from the prototype\n```\n\
  \nPrototypeExample03.htm\n\n在修改后的示例中，对 `person1.name` 调用了 `delete`，该属性之前被用 `\"Greg\"\
  ` 遮蔽。这恢复了与原型 `name` 属性的链接，因此下次访问 `person1.name` 时，返回的是原型属性的值。\n\n\n\n\n\n`hasOwnProperty()`\
  \ 方法用于确定属性是存在于实例上还是原型上。该方法继承自 `Object`，只有当给定名称的属性存在于对象实例上时才会返回 `true`如下例所示：\n\n\
  ```javascript\nfunction Person(){\n}\n\nPerson.prototype.name = \"Nicholas\";\n\
  Person.prototype.age = 29;\nPerson.prototype.job = \"Software Engineer\";\nPerson.prototype.sayName\
  \ = function(){\n    alert(this.name);\n};\n\nvar person1 = new Person();\nvar person2\
  \ = new Person();\n\nalert(person1.hasOwnProperty(\"name\"));  //false\n\nperson1.name\
  \ = \"Greg\";\nalert(person1.name);   //\"Greg\" - 来自实例\nalert(person1.hasOwnProperty(\"\
  name\"));  //true\n\nalert(person2.name);   //\"Nicholas\" - 来自原型\nalert(person2.hasOwnProperty(\"\
  name\"));  //false\n\ndelete person1.name;\nalert(person1.name);   //\"Nicholas\"\
  \ - 来自原型\nalert(person1.hasOwnProperty(\"name\"));  //false\n```\n\n通过在此示例中注入 `hasOwnProperty()`\
  \ 的调用，可以清晰地看出何时访问了实例属性，何时访问了原型属性。只有在 `person1` 上的 name 被覆盖后，调用 `person1.hasOwnProperty(\"\
  name\")` 才会返回 `true`，这表明它现在拥有实例属性而不是原型属性。图 6-2 展示了此示例中所采取的各个步骤。（为了简单起见，省略了与 `Person`\
  \ 构造函数的关系。）\n\n图 6-2\n\n![image](img/f189-01.jpg)![image](img/pen.gif)\n\nECMAScript\
  \ 5 的 `Object.getOwnPropertyDescriptor()` 方法仅对实例属性有效；要检索原型属性的描述符，必须直接在原型对象上调用 `Object.getOwnPropertyDescriptor()`。\n\
  \n### 原型与 `in` 运算符\n\n`in` 运算符有两种用法：单独单独使用或作为 `for-in` 循环使用。当单独使用时，如果对象可以访问给定名称的属性，则\
  \ `in` 运算符将返回 `true`，这意味着该属性可能存在于实例上，也可能存在于原型上。考虑以下示例：\n\n![image](img/logo1.gif)\n\
  \n```javascript\nfunction Person(){\n}\n\nPerson.prototype.name = \"Nicholas\";\n\
  Person.prototype.age = 29;\nPerson.prototype.job = \"Software Engineer\";\nPerson.prototype.sayName\
  \ = function(){\n    alert(this.name);\n};\n\nvar person1 = new Person();\nvar person2\
  \ = new Person();\n\nalert(person1.hasOwnProperty(\"name\"));  //false\nalert(\"\
  name\" in person1);  //true\n\nperson1.name = \"Greg\";\nalert(person1.name);  \
  \ //\"Greg\" - 来自实例\nalert(person1.hasOwnProperty(\"name\"));  //true\nalert(\"\
  name\" in person1);  //true\n\nalert(person2.name);   //\"Nicholas\" - 来自原型\nalert(person2.hasOwnProperty(\"\
  name\"));  //false\nalert(\"name\" in person2);  //true\n\ndelete person1.name;\n\
  alert(person1.name);   //\"Nicholas\" - 来自原型\nalert(person1.hasOwnProperty(\"name\"\
  ));  //false\nalert(\"name\" in person1);  //true\n```\n\nPrototypePatternExample04.htm\n\
  \n在这段代码的执行过程中，属性名在每个对象上都是直接可用或从原型可用。因此，无论属性是否存在于实例上，调用 `\"name\" in person1` 始终返回\
  \ `true`。可以通过将 `hasOwnProperty()` 的调用与 `in` 运算符结合使用，来确定对象的属性是否存在于原型上：\n\n![image](img/logo1.gif)\n\
  \n```javascript\nfunction hasPrototypeProperty(object, name){\n    return !object.hasOwnProperty(name)\
  \ && (name in object);\n}\n```\n\n由于 `in` 运算符只要对象可以访问属性就始终返回 `true`，而 `hasOwnProperty()`\
  \ 仅在属性存在于实例上时返回 `true`，因此，如果 `in` 运算符返回 `true` 但 `hasOwnProperty()` 返回 `false`，就可以确定为原型属性。考虑以下示例：\n\
  \n```javascript\nfunction Person(){\n}\n\nPerson.prototype.name = \"Nicholas\";\n\
  Person.prototype.age = 29;\nPerson.prototype.job = \"Software Engineer\";\nPerson.prototype.sayName\
  \ = function(){\n    alert(this.name);\n};\n\nvar person = new Person();       \
  \ \nalert(hasPrototypeProperty(person, \"name\"));  //true\n\nperson.name = \"Greg\"\
  ;\nalert(hasPrototypeProperty(person, \"name\"));  //false \n```\n\nPrototypePatternExample05.htm\n\
  \n在代码中，`name` 属性首先存在于原型上，因此 `hasPrototypeProperty()` 返回 `true`。一旦 `name` 属性被覆盖，它就存在于实例上，因此\
  \ `hasPrototypeProperty()` 返回 `false`。即使 `name` 属性仍然存在于原型上，由于现在有了实例属性，它不再被使用。\n\n\
  当使用 `for-in` 循环时，所有对象可以访问且可以枚举的属性都将被返回，这包括实例和原型上的属性。隐藏不可枚举原型属性（`[[Enumerable]]`\
  \ 设置为 `false` 的属性）的实例属性将在 `for-in` 循环中返回，因为根据规则，所有用户定义的属性都是可枚举的，Internet Explorer\
  \ 8 除外。\n\n在 Internet Explorer 8 及之前的版本中，存在一个 bug，它会跳过可枚举属性。这里有一个示例：\n\n![image](img/logo1.gif)\n\
  \n```javascript\nvar o = {\n    toString : function(){\n        return \"My Object\"\
  ;\n    }\n};\n\nfor (var prop in o){\n    if (prop == \"toString\"){\n        alert(\"\
  Found toString\");\n    }\n}\n```\nPrototypePatternExample06.htm\n\n运行此代码时，应该显示一条提示找到了\
  \ `toString()` 方法。对象 `o` 拥有一个隐藏了原型实例属性。同样的 bug 影响所有默认不可枚举的属性：`hasOwnProperty()`、`propertyIsEnumerable()`、`toString()`\
  \ 和 `valueOf()`。ECMAScript 5 将原型属性的 `[[Enumerable]]` 设置为 `false`。\n\n要检索对象上所有的可枚举属性，可以使用\
  \ ECMAScript 5 的 `Object.keys()` 方法，它接受对象作为参数，并返回包含所有属性名称的数组。例如：\n\n![image](img/logo1.gif)\n\
  \n```javascript\nfunction Person(){\n}\n\nPerson.prototype.name = \"Nicholas\";\n\
  Person.prototype.age = 29;\nPerson.prototype.job = \"Software Engineer\";\nPerson.prototype.sayName\
  \ = function(){\n    alert(this.name);\n};\n\nvar keys = Object.keys(Person.prototype);\n\
  alert(keys);       //\"name,age,job,sayName\"\n\nvar p1 = new Person();\np1.name\
  \ = \"Rob\";\np1.age = 31;\nvar p1keys = Object.keys(p1);\nalert(p1keys);    //\"\
  name,age\"\n```\n\nObjectKeysExample01.htm\n\n在这里，`keys` 变量填充了包含 \"name\"、age\"\
  、job\" 和 \"sayName\" 的数组。这是它们在使用 `for-in` 时出现的顺序。当在 `Person` 的实例上调用时，`Object.keys()`\
  \ 返回 `name` 和 `age`，这是唯一的两个实例属性。\n\n如果你想要所有实例属性列表（无论是否可枚举），可以用相同的方式使用 `Object.getOwnPropertyNames()`：\n\
  \n```javascript\nvar keys = Object.getOwnPropertyNames(Person.prototype);\nalert(keys);\
  \   //\"constructor,name,age,job,sayName\"\n```\n\nObjectPropertyNamesExample01.htm\n\
  \n注意结果列表中包含了不可枚举的 `constructor` 属性。`Object.keys()` 和 `Object.getOwnPropertyNames()`\
  \ 都可以作为 `for-in` 的合适替代方案。这些方法支持 Internet Explorer 9+、Firefox 4+、Safari 5+、Opera\
  \ 12+ 和 Chrome。\n\n\n\n\n你可能已经在上一个示例中注意到，每个属性和方法都必须显式地写出 `Person.prototype`。为了减少这种冗余并在视觉上更好地封装原型上的功能，现在更常见的做法是使用一个包含所有属性和方法的对象字面量直接覆盖原型，如下例所示：\n\
  \n![image](img/logo1.gif)\n\n```javascript\nfunction Person(){\n}\n\nPerson.prototype\
  \ = {\n    name : \"Nicholas\",\n    age : 29,\n    job : \"Software Engineer\"\
  ,\n    sayName : function () {\n        alert(this.name);\n    }\n};\n```\n\n`PrototypePatternExample07.htm`\n\
  \n在这个重写的示例中，`Person.prototype` 属性被赋值为一个用对象字面量创建的新对象。结果是相同的，唯一的例外是：`constructor`\
  \ 属性不再指向 `Person`。当创建一个函数时，系统会创建它的原型对象并自动分配 `constructor`。本质上，这种语法完全覆盖了默认的原型对象，这意味着\
  \ `constructor` 属性等于一个完全新对象（`Object` 构造函数），而不是函数本身。尽管 `instanceof` 运算符仍然可以可靠地工作，但你不能依赖\
  \ `constructor` 来指示对象的类型，如示例所示：\n\n```javascript\nvar friend = new Person();\nalert(friend\
  \ instanceof Object);      //true\nalert(friend instanceof Person);      //true\n\
  alert(friend.constructor == Person);  //false\nalert(friend.constructor == Object);\
  \  //true\n```\n\n`PrototypePatternExample07.htm`\n\n在这里，`instanceof` 对 `Object`\
  \ 和 `Person` 仍然返回 `true`，但 `constructor` 属性现在等于 `Object` 而不是 `Person`。如果 `constructor`\
  \ 的值很重要，你可以将其专门地设置回适当的值，如下所示：\n\n```javascript\nfunction Person(){\n}\n\nPerson.prototype\
  \ = {\n    constructor: Person,\n    name : \"Nicholas\",\n    age : 29,\n    job\
  \ : \"Software Engineer\",\n    sayName : function () {\n        alert(this.name);\n\
  \    }\n};\n```\n\n`PrototypePatternExample08.htm`\n\n这段代码专门包含了一个 `constructor`\
  \ 属性并将其赋值为 `Person`，确保该属性包含适当的值。\n\n请记住，以这种方式恢复 `constructor` 会创建一个 `[[Enumerable]]`\
  \ 属性为 `true` 的属性。原生构造函数属性默认不是可枚举的，因此如果你在使用符合 ECMAScript 5 标准的 JavaScript 引擎，你可能希望使用\
  \ `Object.defineProperty()`：\n\n```javascript\nfunction Person(){\n}\n\nPerson.prototype\
  \ = {\n    name : \"Nicholas\",\n    age : 29,\n    job : \"Software Engineer\"\
  ,\n    sayName : function () {\n        alert(this.name);\n    }\n};\n\n//ECMAScript\
  \ 5 only - restore the constructor\nObject.defineProperty(Person.prototype, \"constructor\"\
  , {\n    enumerable: false,\n    value: Person\n});\n```\n\n### 原型的动态性质\n\n由于在原型上查找值的过程是一个搜索过程，在任何时间对原型进行的更改都会立即反映在实例上，即使是那些在更改之前就已经存在的实例也是如此。这是一个示例：\n\
  \n![image](img/logo1.gif)\n\n```javascript\nvar friend= new Person();\n\nPerson.prototype.sayHi\
  \ = function(){\n    alert(\"hi\");\n};\n\nfriend.sayHi();   //\"hi\" - 正常工作！\n\
  ```\n\n`PrototypePatternExample09.htm`\n\n在这段代码中，创建了一个 `Person` 实例并存储在 `friend`\
  \ 中。下一条语句向 `Person.prototype` 添加了一个名为 `sayHi()` 的方法。尽管 `friend` 实例是在此更改之前创建的，但它仍然可以访问新方法。这是由于实例和原型之间松散的链接。当调用\
  \ `friend.sayHi()` 时，系统首先在实例中查找名为 `sayHi` 的属性；当未找到，搜索将继续到原型。由于实例和原型之间的链接仅仅是指针而不是拷贝，因此搜索在原型上找到了新的\
  \ `sayHi` 属性并返回存储在存储处的函数。\n\n虽然可以任何时候向原型上添加属性和方法，并且它们会立即反映在所有对象实例中，但你不能覆盖整个原型并期望相同的行为。`[[Prototype]]`\
  \ 指针是在调用构造函数时分配的，因此将原型更改为不同的对象会切断构造函数与原始原型之间的联系。记住：实例只指向原型，而不指向构造函数。考虑以下情况：\n\n\
  ![image](img/logo1.gif)\n\n```javascript\nfunction Person(){\n}\n\nvar friend =\
  \ new Person();\n\nPerson.prototype = {\n    constructor: Person,\n    name : \"\
  Nicholas\",\n    age : 29,\n    job : \"Software Engineer\",\n    sayName : function\
  \ () {\n        alert(this.name);\n    }\n};\n\nfriend.sayName();   //error\n```\n\
  \n`PrototypePatternExample10.htm`\n\n在这个示例中，在覆盖原型对象之前创建了一个新的 `Person` 实例。当调用 `friend.sayName()`\
  \ 时，会导致一个错误，因为 `friend` 指向的原型并不包含该名称的属性。图 6-3 解释了为什么会发生这种情况。\n\n图 6-3\n\n![image](img/f195-01.jpg)\n\
  \n覆盖原型意味着新实例将引用新原型，而之前存在的实例仍然引用旧原型。\n\n### 原生原型\n\n原型模式不仅对于自定义类型很重要，而且它是实现所有引用类型的方法。每个类型（包括\
  \ Object、Array 等）的构造函数的原型上定义了方法。例如，`sort()` 方法可以在 `Array.prototype` 上找到，而 `substring()`\
  \ 可以在 `String.prototype` 上找到，如下所示：\n\n![image](img/logo1.gif)\n\n```javascript\n\
  alert(typeof Array.prototype.sort);         //\"function\"\nalert(typeof String.prototype.substring);\
  \   //\"function\"\n```\n\n通过原生原型，可以获取默认方法的引用并定义新方法。原生原型可以像自定义原型一样被修改，因此可以任何时候添加方法。例如，以下代码为字符串包装器添加了一个名为\
  \ `startsWith()` 的方法：\n\n```javascript\nString.prototype.startsWith = function (text)\
  \ {\n    return this.indexOf(text) == 0;\n};\n\nvar msg = \"Hello world!\";\nalert(msg.startsWith(\"\
  Hello\")); //true\n```\n\n`PrototypePatternExample11.htm`\n\n示例中的 `startsWith()`\
  \ 方法在给定文本出现在字符串开头时返回 true。该方法被分配给 `String.prototype`，使其环境中可用。由于 `msg` 是字符串，后台会创建字符串包装器，使得\
  \ `startsWith()` 可用。\n\n![image](img/pen.gif)\n\n### 原型的问题\n\n原型模式并非没有缺点。首先，它抵消了向构造函数传递初始化参数的能力，这意味着所有实例默认获得相同的属性值。虽然这是一个不便，但它并不是原型最大的问题。主要问题源于它们的共享性质。\n\
  \n原型上的所有属性在实例间共享，这对于函数来说是理想的。包含原始值的属性通常也运行良好，如上一个示例所示，通过在实例上分配同名属性可以隐藏原型属性。真正问题发生在属性包含引用值时。考虑以下示例：\n\
  \n![image](img/logo1.gif)\n\n\n\n\n```\nfunction Person(){\n}\n\nPerson.prototype\
  \ = {\n    constructor: Person,\n    name : \"Nicholas\",\n    age : 29,\n    job\
  \ : \"Software Engineer\",\n    friends : [\"Shelby\", \"Court\"],\n    sayName\
  \ : function () {\n        alert(this.name);\n    }\n};\n\nvar person1 = new Person();\n\
  var person2 = new Person();\n\nperson1.friends.push(\"Van\");\n\nalert(person1.friends);\
  \    //\"Shelby,Court,Van\"\nalert(person2.friends);    //\"Shelby,Court,Van\"\n\
  alert(person1.friends === person2.friends);  //true\n```\n\n### PrototypePatternExample12.htm\n\
  \n在这里，`Person.prototype` 对象拥有一个名为 `friends` 的属性，包含一个字符串数组。随后创建了两个 `Person` 实例。通过添加另一个字符串修改了\
  \ `person1.friends` 数组。由于 `friends` 数组存在于 `Person.prototype` 上而不是 `person1` 上，因此所所的更改也会反映在\
  \ `person2.friends` 上（它指向同一个数组）。如果目标是让所有实例共享一个数组，那么这个结果是可以接受的。但通常情况下，实例希望拥有所有属性的副本。这就是为什么原型模式很少单独使用的原因。\n\
  \n### 构造函数/原型组合模式（Combination Constructor/Prototype Pattern）\n\n定义自定义类型常用的方法是将构造函数模式和原型模式结合。构造模式定义实例属性，而原型模式定义方法和共享属性。通过这种方法，每个实例最终都拥有自己的实例属性拷贝，但它们共享方法的引用，从而节省了内存。这种模式还允许将参数传递给构造函数，有效地结合了每种模式的优点。之前的示例现在可以重写如下：\n\
  \n```\nfunction Person(name, age, job){\n    this.name = name;\n    this.age = age;\n\
  \    this.job = job;\n    this.friends = [\"Shelby\", \"Court\"];\n}\n\nPerson.prototype\
  \ = {\n    constructor: Person,\n    sayName : function () {\n        alert(this.name);\n\
  \    }\n};\n\nvar person1 = new Person(\"Nicholas\", 29, \"Software Engineer\");\n\
  var person2 = new Person(\"Greg\", 27, \"Doctor\");\n\nperson1.friends.push(\"Van\"\
  );\n\nalert(person1.friends);    //\"Shelby,Court,Van\"\nalert(person2.friends);\
  \    //\"Shelby,Court\"\nalert(person1.friends === person2.friends);  //false\n\
  alert(person1.sayName === person2.sayName);  //true\n```\n\n### HybridPatternExample01.htm\n\
  \n注意，现在实例属性完全定义在构造函数中，而共享属性构造函数和方法 `sayName()` 则定义在原型上。当通过添加新字符串来扩充 `person1.friends`\
  \ 时，`person2.friends` 不会受到影响，因为它们各自拥有独立的数组。\n\n混合构造函数/原型模式是 ECMAScript 中定义自定义引用类型最广泛使用和被接受的做法。通俗来说，这是定义引用类型时的默认使用模式。\n\
  \n### 动态原型模式（Dynamic Prototype Pattern）\n\n来自其他面向对象（OO）语言的开发者可能会发现构造函数与原型之间的视觉化分离令人困惑。动态原型模式试图通过在构造函数内部封装所有信息来解决这个问题，同时通过在构造函数内部初始化原型（仅在需要时）来保持使用构造函数和原型的优势。你可以通过检查本应可用的方法是否存在来确定是否需要初始化原型。考虑这个示例：\n\
  \n![image](img/logo1.gif)\n\n```\nfunction Person(name, age, job){\n\n    //properties\n\
  \    this.name = name;\n    this.age = age;\n    this.job = job;\n\n    //methods\n\
  \    if (typeof this.sayName != \"function\"){\n\n        Person.prototype.sayName\
  \ = function(){\n            alert(this.name);\n        };\n\n    }\n}\n\nvar friend\
  \ = new Person(\"Nicholas\", 29, \"Software Engineer\");\nfriend.sayName();\n```\n\
  \n### DynamicPrototypeExample01.htm\n\n构造函数内部被高亮的代码段在 `sayName()` 方法尚不存在时会添加该方法。此块代码仅在第一次调用构造函数时执行。此后，原型已经初始化，不再需要任何进一步修改。记住，对原型的更改会立即反映在所有实例中，因此这种方法非常完美。`if`\
  \ 语句可以检查初始化后将存在的任何属性或方法——不需要多个 `if` 语句来检查每个属性或方法；检查其中任何一个即可。这种模式保留了使用 `instanceof`\
  \ 来确定创建了什么类型对象的功能。\n\n![image](img/pen.gif)\n\n在使用动态原型模式时，无法使用对象字面量重写原型。如前所述，当实例已存在时重写原型会实际上切断该实例与新原型之间的联系。\n\
  \n### 寄生构造函数模式（Parasitic Constructor Pattern）\n\n寄生构造函数模式通常是其他模式失败时的备选方案。该模式的基本思想是创建一个构造函数，它仅仅封装了另一个对象的创建和返回，同时看起来像一个典型的构造函数。这是一个示例：\n\
  \n![image](img/logo1.gif)\n\n```\nfunction Person(name, age, job){\n    var o =\
  \ new Object();\n    o.name = name;\n    o.age = age;\n    o.job = job;\n    o.sayName\
  \ = function(){\n        alert(this.name);\n    };    \n    return o;\n}\n\nvar\
  \ friend = new Person(\"Nicholas\", 29, \"Software Engineer\");\nfriend.sayName();\
  \  //\"Nicholas\"\n```\n\n\n\n\n\nDouglas Crockford 在 JavaScript 中创造了 `durable objects`（持久对象）这一术语，指那些没有公共属性且其方法不引用\
  \ `this` 对象的对象。持久对象最适用于安全环境（即禁止使用 `this` 和 `new` 的环境）或保护数据免受应用程序其他部分的影响（例如混合应用 mashups\
  \ 中）。持久构造函数（durable constructor）是一种类似于寄生构造函数模式的构造函数，但有两个不同点：被创建的对象上的实例方法不引用 `this`，且构造函数永远不会使用\
  \ `new` 运算符进行调用。上一节中的 `Person` 构造函数可以重写为如下持久构造函数：\n\n```\nfunction Person(name,\
  \ age, job){\n\n    //创建要返回的对象\n    var o = new Object();\n\n    //可选项：在这里定义私有变量/函数\n\
  \    // 附加方法\n    o.sayName = function(){\n        alert(name);\n    };    \n\n\
  \    //返回对象\n    return o;\n}\n```\n\n注意，无法从返回的对象访问 `name` 的值。`sayName()` 方法可以访问它，但其他任何地方都无法访问。`Person`\
  \ 持久构造函数的用法如下：\n\n```\nvar friend = Person(\"Nicholas\", 29, \"Software Engineer\"\
  );\nfriend.sayName();  //\"Nicholas\"\n```\n\n`person` 变量是一个持久对象，在不调用方法的情况下，无法访问其任何数据成员。即使其他代码向对象添加了方法或数据成员，也无法访问传递给构造函数的原始数据。这种安全性使得持久构造函数模式在处理安全执行环境时非常有用，例如由\
  \ ADsafe ([www.adsafe.org](http://www.adsafe.org)) 或 Caja ([`code.google.com/p/google-caja/`](http://code.google.com/p/google-caja/))\
  \ 提供的环境。\n\n![image](img/pen.gif)\n\n与寄生构造函数模式一样，构造函数与对象实例之间没有[直接]关系，因此 `instanceof`\
  \ 将无法工作。\n\n## 继承\n\n在面向对象（OO）编程中，讨论最多的概念是继承。许多面向对象语言支持两种类型的继承：接口继承（仅继承方法签名）和实现继承（继承实际的方法）。ECMAScript\
  \ 中无法实现接口继承，因为如前所述，函数没有签名。实现继承是 ECMAScript 支持的唯一继承类型，这主要是通过使用原型链（prototype chaining）实现的。\n\
  \n### 原型链\n\nECMA-262 将原型链描述为 ECMAScript 中的主要继承方法。基本思想是利用原型概念在两个引用类型之间继承属性和方法。回想构造函数、原型和实例之间的关系：每个构造函数都有一个指向回构造函数的原型对象，而实例有一个指向该原型的内部指针。如果原型实际上是另一个类型的实例呢？这意味着原型本身将拥有一个指向不同原型的指针，而该原型又有一个指向另一个构造函数的指针。如果该原型也是另一个类型的实例，那么这种模式就会持续下去，在实例和原型之间形成一条链。这就是原型链背的基本思想。\n\
  \n实现原型链涉及以下代码模式：\n\n![image](img/logo1.gif)\n\n```\nfunction SuperType(){\n    this.property\
  \ = true;\n}\n\nSuperType.prototype.getSuperValue = function(){\n    return this.property;\n\
  };\n\nfunction SubType(){\n    this.subproperty = false;\n}\n\n//继承自 SuperType\n\
  SubType.prototype = new SuperType();\n\nSubType.prototype.getSubValue = function\
  \ (){\n    return this.subproperty;\n};\n\nvar instance = new SubType();\nalert(instance.getSuperValue());\
  \   //true\n```\n\nPrototypeChainingExample01.htm\n\n这段代码定义了两个类型：`SuperType` 和 `SubType`。每个类型都有一个属性和一个方法。两者之间的主要区别在于，`SubType`\
  \ 通过创建 `SuperType` 的新实例并将其赋值给 `SubType.prototype` 来继承自 `SuperType`。这覆盖了原始原型并将其替换为新对象，这意味着通常存在于\
  \ `SuperType` 实例上的所有属性和方法现在也存在于 `SubType.prototype` 上。在继承发生后，将一个方法被分配给 `SubType.prototype`，在从\
  \ `SuperType` 继承的基础之上添加了一个新方法。实例与两个构造函数及原型之间的关系如图 6-4 所示。\n\n图 6-4\n\n![image](img/f203-01.jpg)\n\
  \n与其使用 `SubType` 的默认原型，不如分配一个新原型。该新原型恰好是 `SuperType` 的实例，因此它不仅获得了 `SuperType` 实例的属性和方法，还指向了\
  \ `SuperType` 的原型。因此 `instance` 指向 `SubType.prototype`，而 `SubType.prototype` 指向\
  \ `SuperType.prototype`。注意，`getSuperValue()` 方法留在 `SuperType.prototype` 对象上，但属性最终位于\
  \ `SubType.prototype` 上。这是因为 `getSuperValue()` 是原型方法，而 `property` 是实例属性。`SubType.prototype`\
  \ 现在是 `SuperType` 的实例，因此 `property` 存储在该处。同样注意，`instance.constructor` 指向 `SuperType`，因为\
  \ `SubType.prototype` 上的 `constructor` 属性被覆盖了。\n\n原型链延伸到了早之前描述的原型搜索机制。你可能还记得，当在实例上访问属性时，首先会在实例上搜索该属性。如果未找到，搜索将继续进行。\n\
  \n### 默认原型\n\n在现实，原型链中还有另一个步骤。所有引用类型默认继承自 `Object`，这是通过原型链实现的。任何函数的默认原型都是 `Object`\
  \ 的实例，这意味着其内部原型指向 `Object.prototype`。这就是自定义类型如何继承如 `toString()` 和 `valueOf()` 等默认方法。因此该示例包含一个额外的继承层。图\
  \ 6-5 显示了完整的原型链。\n\n图 6-5\n\n![image](img/f204-01.jpg)\n\n`SubType` 继承自 `SuperType`，而\
  \ `SuperType` 继承自 `Object`。当调用 `instance.toString()` 时，调用的方法实际上位于 `Object.prototype`\
  \ 上。\n\n### 原型与实例的关系\n\n原型与实例之间的关系可以通过两种方式识别。第一种是使用 `instanceof` 运算符，当实例与出现在原型链中的构造函数一起使用时，它返回\
  \ true，如下例：\n\n![image](img/logo1.gif)\n\n```\nalert(instance instanceof Object);\
  \      //true\nalert(instance instanceof SuperType);   //true\nalert(instance instanceof\
  \ SubType);     //true\n```\n\nPrototypeChainingExample01.htm\n\n在这里，由于原型链关系，`instance`\
  \ 对象在技术上是 `Object`、`SuperType` 和 `SubType` 的实例。结果是 `instanceof` 对于所有这些构造函数都返回 true。\n\
  \n确定这种关系的第二种方法是使用 `isPrototypeOf()` 方法。链中的每个原型都可以访问此方法，该方法对于链中的实例返回 true，如下例：\n\n\
  \n\n\n\n```\nalert(Object.prototype.isPrototypeOf(instance));    //true\nalert(SuperType.prototype.isPrototypeOf(instance));\
  \ //true\nalert(SubType.prototype.isPrototypeOf(instance));   //true\n```\n\n###\
  \ PrototypeChainingExample01.htm\n\n#### 使用方法\n\n通常，子类需要重写父类方法，或者引入父类中不存在的新方法。为了实现这一点，必须在原型赋值后将方法添加到原型中。请考虑这个示例：\n\
  \n![image](img/logo1.gif)\n\n```\nfunction SuperType(){\n    this.property = true;\n\
  }\n\nSuperType.prototype.getSuperValue = function(){\n    return this.property;\n\
  };\n\nfunction SubType(){\n    this.subproperty = false;\n}\n\n//继承自 SuperType\n\
  SubType.prototype = new SuperType();\n\n//新方法\nSubType.prototype.getSubValue = function\
  \ (){\n    return this.subproperty;\n};\n\n//重写现有方法\nSubType.prototype.getSuperValue\
  \ = function (){\n    return false;\n};\n\nvar instance = new SubType();\nalert(instance.getSuperValue());\
  \   //false\n```\n\n### PrototypeChainingExample02.htm\n\n在这段代码中，高亮区域显示了两个方法。第一个是\
  \ `getSubValue()`，它是 `SubType` 的一个新方法。第二个是 `getSuperValue()`，它已经存在于原型链中，但在此处被遮蔽（shadowed）。在\
  \ `SubType` 的实例上调用 `getSuperValue()` 时，它将调用这一个，但 `SuperType` 的实例仍然会调用原始方法。需要注意的是，这两个方法都在原型被赋值为\
  \ `SuperType` 实例之后定义的。\n\n另一个需要理解的重要点是，使用对象字面量的方法创建原型方法无法用于原型链，因为你最终会重写整个原型链。这里有一个示例：\n\
  \n![image](img/logo1.gif)\n\n```\nfunction SuperType(){\n    this.property = true;\n\
  }\n\nSuperType.prototype.getSuperValue = function(){\n    return this.property;\n\
  };\n\nfunction SubType(){\n    this.subproperty = false;\n}\n\n//继承自 SuperType\n\
  SubType.prototype = new SuperType();\n\n//尝试添加新方法 - 这会使上一行代码失效\nSubType.prototype\
  \ = {\n    getSubValue : function (){\n        return this.subproperty;\n    },\n\
  \n    someOtherMethod : function (){\n        return false;\n    }\n};\n\nvar instance\
  \ = new SubType();\nalert(instance.getSuperValue());   //error!\n```\n\n### PrototypeChainingExample03.htm\n\
  \n在这段代码中，原型在被赋值为 `SuperType` 实例后，又被重新赋值为一个对象字面量。原型现在包含一个 `Object` 的新实例，而不是 `SuperType`\
  \ 的实例，因此原型链被破坏了——`SubType` 和 `SuperType` 之间没有任何关系。\n\n#### 原型链的问题\n\n尽管原型链是继承的强大工具，但它并非没有问题。主要问题在于包含引用值的原型。回想之前，包含引用值的原型属性是所有实例共享的；这就是为什么属性通常定义在构造函数内部而不是原型上。当使用原型实现继承时，原型实际上变成了其他类型的实例，这意味着原本是实例属性的内容现在变成了原型属性。以下示例强调了这个问题：\n\
  \n![image](img/logo1.gif)\n\n```\nfunction SuperType(){\n    this.colors = [\"red\"\
  , \"blue\", \"green\"];\n}\n\nfunction SubType(){            \n}\n\n//继承自 SuperType\n\
  SubType.prototype = new SuperType();\n\nvar instance1 = new SubType();\ninstance1.colors.push(\"\
  black\");\nalert(instance1.colors);    //\"red,blue,green,black\"\n\nvar instance2\
  \ = new SubType();\nalert(instance2.colors);    //\"red,blue,green,black\"\n```\n\
  \n### PrototypeChainingExample04.htm\n\n在这个示例中，`SuperType` 构造函数定义了一个包含数组（引用值）的属性\
  \ `colors`。每个 `SuperType` 实例都有自己的 `colors` 属性，包含自己的数组。当 `SubType` 通过原型链继承自 `SuperType`\
  \ 时，`SubType.prototype` 变成了 `SuperType` 的实例，因此它获得了自己的 `colors` 属性，这类似于专门创建了 `SubType.prototype.colors`。最终结果是：所有\
  \ `SubType` 实例共享同一个 `colors` 属性。这一点可以通过对 `instance1.colors` 的修改反映在 `instance2.colors`\
  \ 上看出。\n\n原型链的第二个问题是，在创建子类实例时，无法向父类构造函数传递参数。事实上，没有办法在不影响所有对象实例的情况下向父类构造函数传递参数。由于这个问题以及上述原型上引用值存在的问题，原型链很少被单独使用。\n\
  \n#### 构造函数窃取 (Constructor Stealing)\n\n为了解决原型上引用值的继承问题，开发者开始使用一种名为 `构造函数窃取`（有时也称为对象伪装或经典继承）的技术。基本思想非常简单：在子类构造函数内部调用父类构造函数。记住函数只是在特定上下文中执行代码的对象，可以使用\
  \ `apply()` 和 `call()` 方法在新创建的对象上执行构造函数，如下例所示：\n\n```\nfunction SuperType(){\n \
  \   this.colors = [\"red\", \"blue\", \"green\"];\n}\n\nfunction SubType(){  \n\
  \    //继承自 SuperType\n    SuperType.call(this);\n}\n\nvar instance1 = new SubType();\n\
  instance1.colors.push(\"black\");\nalert(instance1.colors);    //\"red,blue,green,black\"\
  \n\nvar instance2 = new SubType();\nalert(instance2.colors);    //\"red,blue,green\"\
  \n```\n\n### ConstructorStealingExample01.htm\n\n示例中的高亮行显示了构造函数窃取中使用的调用。通过使用 `call()`\
  \ 方法（或者使用 `apply()`），在新创建的实例上下文中调用 `SuperType` 构造函数。这样做实际上是在新的 `SubType` 对象上运行 `SuperType()`\
  \ 函数的所有初始化代码。结果是每个实例都拥有 `colors` 属性的副本。\n\n#### 传递参数\n\n构造函数窃取相对于原型链的一个优势是可以在子类构造函数内部向父类构造函数传递参数。考虑以下内容：\n\
  \n![image](img/logo1.gif)\n\n```\nfunction SuperType(name){\n    this.name = name;\n\
  }\n\nfunction SubType(){  \n    //继承自 SuperType 并传递参数\n    SuperType.call(this,\
  \ \"Nicholas\");\n\n    // 实例属性\n    this.age = 29;\n}\n\nvar instance = new SubType();\n\
  alert(instance.name);    //\"Nicholas\";\nalert(instance.age);     29\n```\n\n###\
  \ ConstructorStealingExample02.htm\n\n在这段代码中，`SuperType` 构造函数接受一个参数 `name`，该参数被简单地赋值给属性。从\
  \ `SubType` 构造函数内部调用时，可以将值传递给 `SuperType` 构造函数，为 `SubType` 实例设置 `name` 属性。为了确保 `SuperType`\
  \ 构造函数不会覆盖这些属性，可以在调用父类构造函数之后在子类上定义额外的属性。\n\n组合继承\n\n\n\n\n\n组合继承\n组合继承（有时也称为伪类继承）结合了原型链（prototype\
  \ chaining）和构造函数窃取（constructor stealing），以获得两者的优点。其基本思想是使用原型链来继承原型上的属性和方法，并使用构造函数窃取来继承实例属性。这允许通过在原型上定义方法来实现函数复用，并允许每个实例拥有自己的属性。考虑以下代码：\n\
  \n![image](img/logo1.gif)\n\n```\nfunction SuperType(name){\n    this.name = name;\n\
  \    this.colors = [\"red\", \"blue\", \"green\"];\n}\n\nSuperType.prototype.sayName\
  \ = function(){\n    alert(this.name);\n};\n\nfunction SubType(name, age){  \n\n\
  \    //继承属性\n    SuperType.call(this, name);\n\n    this.age = age;\n}\n\n//继承方法\n\
  SubType.prototype = new SuperType();\n\nSubType.prototype.sayAge = function(){\n\
  \    alert(this.age);\n};\n\nvar instance1 = new SubType(\"Nicholas\", 29);\ninstance1.colors.push(\"\
  black\");\nalert(instance1.colors);  //\"red,blue,green,black\"\ninstance1.sayName();\
  \      //\"Nicholas\";\ninstance1.sayAge();       //29\n\nvar instance2 = new SubType(\"\
  Greg\", 27);\nalert(instance2.colors);  //\"red,blue,green\"\ninstance2.sayName();\
  \      //\"Greg\";\ninstance2.sayAge();       //27\n```\n\n`CombinationInheritanceExample01.htm`\n\
  \n在这个示例中，`SuperType` 构造函数定义了两个属性 `name` 和 `colors`，而 `SuperType` 原型有一个名为 `sayName()`\
  \ 的方法。`SubType` 构造函数调用了 `SuperType` 构造函数并传递了参数 `name`，同时定义了自己的属性 `age`。此外，`SubType`\
  \ 的原型被赋值为 `SuperType` 的一个实例，然后定义了一个名为 `sayAge()` 的新方法。通过这段代码，可以创建两个独立的 `SubType`\
  \ 实例，它们拥有自己的属性（包括 `colors` 属性），但都使用相同的方法。\n\n组合继承解决了原型链和构造函数窃取的缺点，是 JavaScript 中最常用的继承模式。它还保留了\
  \ `instanceof` 和 `isPrototypeOf()` 的行为，用于识别对象的组合情况。\n\n原型继承\n\n2006 年，Douglas Crockford\
  \ 编写了一篇名为《JavaScript 中的原型继承》的文章，在文中引入了一种不涉及使用严格定义的构造函数的继承方法。他的前提是，原型允许你根据现有对象创建新对象，而无需定义自定义类型。他为此目的引入的函数如下：\n\
  \n![image](img/logo1.gif)\n\n```\nfunction object(o){\n    function F(){}\n    F.prototype\
  \ = o;\n    return new F();\n}\n```\n\n`object()` 函数创建一个临时构造函数，将给定的对象赋值为构造函数的原型，并返回该临时类型的新实例。本质上，`object()`\
  \ 对传入的任何对象执行了影子拷贝。考虑以下代码：\n\n```\nvar person = {\n    name: \"Nicholas\",\n    friends:\
  \ [\"Shelby\", \"Court\", \"Van\"]\n};\n\nvar anotherPerson = object(person);\n\
  anotherPerson.name = \"Greg\";\nanotherPerson.friends.push(\"Rob\");\n\nvar yetAnotherPerson\
  \ = object(person);\nyetAnotherPerson.name = \"Linda\";\nyetAnotherPerson.friends.push(\"\
  Barbie\");\n\nalert(person.friends);   //\"Shelby,Court,Van,Rob,Barbie\"\n```\n\n\
  `PrototypalInheritanceExample01.htm`\n\n这就是 Crockford 提倡使用原型继承的方式：你有一个想要作为另一个对象基础的对象。该对象应该被传递给\
  \ `object()`，并对生成的对象进行相应的修改。在这个示例中，`person` 对象包含了应该在另一个对象上可用的信息，因此它被传入 `object()`\
  \ 函数，该函数返回一个新对象。新对象以 `person` 为原型，这意味着它在原型上既有一个原始值属性和一个引用值属性。这意味着 `person.friends`\
  \ 不仅被 `person` 共享，也被 `anotherPerson` 和 `yetAnotherPerson` 共享。实际上，这段代码创建了 `person`\
  \ 的两个克隆。\n\nECMAScript 5 通过添加 `Object.create()` 方法正式化了原型继承的概念。该方法接受两个参数：一个作为新对象原型的对象，以及一个定义了应用于新对象的额外属性的可选对象。当使用一个参数时，`Object.create()`\
  \ 的行为与 `object()` 方法相同：\n\n![image](img/logo1.gif)\n\n```\nvar person = {\n    name:\
  \ \"Nicholas\",\n    friends: [\"Shelby\", \"Court\", \"Van\"]\n};\n\nvar anotherPerson\
  \ = Object.create(person);\nanotherPerson.name = \"Greg\";\nanotherPerson.friends.push(\"\
  Rob\");\n\nvar yetAnotherPerson = Object.create(person);\nyetAnotherPerson.name\
  \ = \"Linda\";\nyetAnotherPerson.friends.push(\"Barbie\");\n\nalert(person.friends);\
  \   //\"Shelby,Court,Van,Rob,Barbie\"\n```\n\n`PrototypalInheritanceExample02.htm`\n\
  \n`Object.create()` 的第二个参数与 `Object.defineProperties()` 的第二个参数格式相同：每个要定义的额外属性都与其其描述符一起指定。以这种方式指定的任何属性将遮蔽原型对象上同名的属性。例如：\n\
  \n```\nvar person = {\n    name: \"Nicholas\",\n    friends: [\"Shelby\", \"Court\"\
  , \"Van\"]\n};\n\nvar anotherPerson = Object.create(person, {\n    name: {\n   \
  \     value: \"Greg\"\n    }\n});\n\nalert(anotherPerson.name);  //\"Greg\"\n```\n\
  \n`PrototypalInheritanceExample03.htm`\n\n`Object.create()` 方法支持 Internet Explorer\
  \ 9+、Firefox 4+、Safari 5+、Opera 12+ 以及 Chrome。当不需要创建单独构造函数的开销，但需要一个对象类似于另一个对象时，原型继承非常有用。记住，包含引用值的属性将始终共享这些值。\n\
  \n寄生继承\n\n与原型继承密切相关的是寄生继承概念，这是另一种由 Crockford 推广的模式。寄生继承的思想与寄生构造和工厂模式相似：创建一个函数来执行继承，以某种方式增强对象，然后返回该对象。基础寄生继承模式如下：\n\
  \n```\nfunction createAnother(original){\n    var clone = object(original);    \
  \ //通过调用函数创建新对象\n    clone.sayHi = function(){         //以某种方式增强对象\n        alert(\"\
  hi\");\n    };\n    return clone;                     //返回对象\n}\n```\n\n在代码中，`createAnother()`\
  \ 函数接受一个参数，即新对象的基础对象。该对象 `original` 被传入 `object()` 函数，结果赋值给 `clone`。接下来，修改 `clone`\
  \ 对象以拥有名为 `sayHi()` 的新方法。最后一步是返回对象。`createAnother()` 函数可以如下方式使用：\n\n```\nvar person\
  \ = {\n    name: \"Nicholas\",\n    friends: [\"Shelby\", \"Court\", \"Van\"]\n\
  };\n\nvar anotherPerson = createAnother(person);\nanotherPerson.sayHi();  //\"hi\"\
  \n```\n\n此示例代码返回了一个基于 `person` 的新对象。`anotherPerson` 对象拥有 `person` 的所有属性和方法，但增加了一个名为\
  \ `sayHi()` 的新方法。\n\n当你主要关注对象而不是自定义类型和构造函数时，寄生继承是另一种使用的模式。寄生继承不需要 `object()` 方法；任何返回新对象的函数都符合该模式。\n\
  \n![image](img/pen.gif)\n\n\n\n\n组合继承是 JavaScript 中最常用的继承模式，尽管它并非没有低效之处。该模式最低效的部分是超类型的构造函数总是被调用两次：一次用于创建子类型的原型，另一次是在子类型的构造函数内部调用。本质上说，子类型原型最终包含了超类型对象的所有实例属性，但当子类型构造函数执行时，这些属性又被覆盖了。再次考虑组合继承的示例：\n\
  \n```javascript\nfunction SuperType(name){\n    this.name = name;\n    this.colors\
  \ = [\"red\", \"blue\", \"green\"];\n}\n\nSuperType.prototype.sayName = function(){\n\
  \    alert(this.name);\n};\n\nfunction SubType(name, age){  \n    SuperType.call(this,\
  \ name);          //第二次调用 SuperType()\n\n    this.age = age;\n}\n\nSubType.prototype\
  \ = new SuperType();     //第一次调用 SuperType()\nSubType.prototype.constructor = SubType;\
  \                   \nSubType.prototype.sayAge = function(){\n    alert(this.age);\n\
  };\n```\n\n代码中高亮出的行表示了 `SuperType` 构造函数的执行时机。当这段代码执行时，`SubType.prototype` 最终拥有两个属性：`name`\
  \ 和 `colors`。这些是 `SuperType` 的实例属性，但现在它们位于 `SubType` 的原型上。当调用 `SubType` 构造函数时，`SuperType`\
  \ 构造函数也会被调用，这在新对象上创建了属性 `name` 和 `colors`，从而掩盖了原型上的属性。图 6-6 描述了这个过程。\n\n图 6-6\n\n\
  ![image](img/f213-01.jpg)\n\n你可以看到存在两组 `name` 和 `colors` 属性：一组在实例上，一组在 `SubType`\
  \ 原型上。这就是调用两次 `SuperType` 构造函数的结果。幸运的是，有一种解决方法。\n\n寄生组合继承利用构造窃来继承属性，但使用原型链的混合形式来继承方法。其基本思想是：不再调用超类型构造函数来分配子类型的原型，你只需要超类型原型的拷贝。本质上，使用寄生继承从超类型原型中继承，然后将结果分配给子类型的原型。寄生组合继承的基本模式如下：\n\
  \n```javascript\nfunction inheritPrototype(subType, superType){\n    var prototype\
  \ = object(superType.prototype);   //创建对象\n    prototype.constructor = subType;\
  \               //增强对象\n    subType.prototype = prototype;                 //分配对象\n\
  }\n```\n\n`inheritPrototype()` 函数实现了非常基础的寄生组合继承。该函数接受两个参数：子类型构造函数和超类型构造函数。在函数内部，第一步是创建一个超类型原型的克隆。接下来，将\
  \ `constructor` 属性赋值给 `prototype`，以解决原型被覆盖时丢失默认构造函数属性的问题。最后，将子类型的原型分配给新创建的对象。调用\
  \ `inheritPrototype()` 可以替换之前示例中的子类型原型赋值，所示：\n\n![image](img/logo1.gif)\n\n```javascript\n\
  function SuperType(name){\n    this.name = name;\n    this.colors = [\"red\", \"\
  blue\", \"green\"];\n}\n\nSuperType.prototype.sayName = function(){\n    alert(this.name);\n\
  };\n\nfunction SubType(name, age){  \n    SuperType.call(this, name);\n\n    this.age\
  \ = age;\n}\n\ninheritPrototype(SubType, SuperType);\n\nSubType.prototype.sayAge\
  \ = function(){\n    alert(this.age);\n};\n```\n\nParasiticCombinationInheritanceExample01.htm\n\
  \n这个示例更加高效，因为 `SuperType` 构造函数只被调用一次，避免了在 `SubType.prototype` 上产生不必要且未使用的属性。此外，原型链保持完整，因此\
  \ `instanceof` 和 `isPrototypeOf()` 的行为表现正常。寄生组合继承被认为是引用类型最优的继承范式。\n\n![image](img/pen.gif)\n\
  \nYahoo! 用户界面 (YUI) 库首次通过 `Y.extend()` 方法在广泛发布的 JavaScript 库中包含了寄生组合继承。有关 YUI 的更多信息，请访问\
  \ [`yuilibrary.com/`](http://yuilibrary.com/)。\n\n# 总结\n\nECMAScript 支持在没有类或接口的情况下面向对象\
  \ (OO) 编程。对象在代码执行的任何点都可以创建和增强，使对象成为动态的而非严格定义的实体。在类出现之前，使用了以下模式来创建对象：\n\n*   工厂模式使用一个简单的函数来创建对象、分配属性和方法，然后返回该对象。随着构造函数模式出现，这种模式不再受到青睐。\n\
  *   使用构造函数模式可以定义自定义引用类型，并像创建内置对象实例一样使用 `new` 运算符创建它们。然而，构造函数模式确实有一个缺点，即它的成员（包括函数）都没有被重用。由于函数可以以松类型的方式编写，因此没有理由它们不能被多个对象实例共享。\n\
  *   原型模式考虑了这一点，使用构造函数的 `prototype` 属性来分配应该共享的属性和方法。组合构造函数/原型模式使用构造函数定义实例属性，使用原型模式定义共享的属性和方法。\n\
  \nJavaScript 中的继承主要通过原型链的概念来实现。原型链涉及将构造函数的原型赋值为另一个类型的实例。通过这样做，子类型假设了超类型的所有属性和方法。原型链的问题是所有继承的属性和方法都在实例间共享，这使其单独使用并不理想。构造窃模式避免了这些问题，在子类型的构造函数内部调用超类型的构造函数。这允许每个实例拥有自己的属性，但强制使用构造模式定义类型。最流行的继承模式是组合继承，它使用原型链继承共享属性和方法，并使用构造窃来继承实例属性。\n\
  \n还有以下继承模式：\n\n*   原型继承在不需要预定义构造函数的情况下实现，本质上是对给定对象进行浅克隆操作。操作的结果随后可以被增强。\n*   与之密切的是寄生继承，它是一种根据另一个对象或某些信息创建、增强并返回对象的模式。这种模式也被重新用于组合继承，以消除超类型构造函数调用次数相关的低效。\n\
  *   寄生组合继承被认为是实现类型继承的最有效方法。\n\n# 第 7 章：函数表达式\n\n## 本章内容\n\n*   函数表达式的特性\n*   函数的递归\n\
  *   使用闭包私有变量\n\nJavaScript 中比较强大且经常令人困惑的部分是函数表达式。正如第 5 章提到的，定义函数有两种方法：通过函数声明和函数表达式。第一种函数声明，其格式如下：\n\
  \n```javascript\nfunction functionName(arg0, arg1, arg2) {\n    //函数体\n}\n```\n\n\
  \n\n\n函数名跟在 `function` 关键字之后，这就是函数名赋值的方式。Firefox、Safari、Chrome 和 Opera 都在函数上提供了一个非标准的\
  \ `name` 属性，用于暴露赋值的名称。该值始终等于紧随在 `function` 关键字之后的标识符：\n\n![image](img/logo1.gif)\n\
  \n```\n//仅在 Firefox, Safari, Chrome 和 Opera 中有效\nalert(functionName.name);    //\"\
  functionName\"\n```\n\nFunctionNameExample01.htm\n\n函数声明的一个关键特性是函数声明提升，即函数声明在代码执行之前就会被读取。这意味着函数声明可以出现在调用它的代码之后，并且仍然能够工作：\n\
  \n![image](img/logo1.gif)\n\n```\nsayHi();\nfunction sayHi(){\n    alert(\"Hi!\"\
  );\n}\n```\n\nFunctionDeclarationHoisting01.htm\n\n这个示例不会报错，因为函数声明在代码开始执行之前被首先读取。\n\
  \n创建函数的另一种方法是使用函数表达式。函数表达式有多种形式。最常见的形式如下：\n\n```\nvar functionName = function(arg0,\
  \ arg1, arg2){\n    //函数体\n};\n```\n\n这种函数表达式模式看起来像普通的变量赋值。一个函数被创建并赋值给变量 `functionName`。创建的函数被认为是一个匿名函数，因为在\
  \ `function` 关键字之后没有标识符。（匿名函数有时也被称为 lambda 函数）。这意味着 `name` 属性是空字符串。\n\n函数表达式的作用与其他表达式类似，因此在在使用之前必须进行赋值。以下代码会导致错误：\n\
  \n```\nsayHi();    //错误 - 函数尚不存在\nvar sayHi = function(){\n    alert(\"Hi!\");\n\
  };\n```\n\n理解函数提升是理解函数声明和函数表达式之间区别的关键。例如，以下代码的结果可能会出乎意料：\n\n```\n//永远不要这么做！\nif(condition){\n\
  \    function sayHi(){\n        alert(\"Hi!\");\n    }\n} else {\n    function sayHi(){\n\
  \        alert(\"Yo!\");\n    }\n}\n```\n\nFunctionDeclarationsErrorExample01.htm\n\
  \n代码似乎表明，如果 `condition` 为真，则对 `sayHi()` 使用一种定义；否则，使用另一个不同的定义。事实上，这在 ECMAScript 中并不是合法的语法，因此\
  \ JavaScript 引擎会尝试纠错到适当的状态。问题是，浏览器在这种情况下不会一致地进行纠错。大多数浏览器无论 `condition` 如何，都会返回第二个声明；而\
  \ Firefox 在 `condition` 为真时返回第一个。这种模式是危险的，不应该使用。然而，以这种方式使用函数表达式是完全可以的：\n\n```\n\
  //这是可以\nvar sayHi;\n\nif(condition){\n    sayHi = function(){\n        alert(\"\
  Hi!\");\n    };\n} else {\n    sayHi = function(){\n        alert(\"Yo!\");\n  \
  \  };\n}\n```\n\n这个示例的行为正如你预期的那样，根据 `condition` 将正确的函数表达式赋值给变量 `sayHi`。\n\n创建函数并赋值给变量的能力还允许你将函数作为其他函数的返回值。回想第\
  \ 5 章中的以下 `createComparisonFunction()` 示例：\n\n```\nfunction createComparisonFunction(propertyName)\
  \ {\n\n    return function(object1, object2){\n        var value1 = object1[propertyName];\n\
  \        var value2 = object2[propertyName];\n\n        if (value1 < value2){\n\
  \            return -1;\n        } else if (value1 > value2){\n            return\
  \ 1;\n        } else {\n            return 0;\n        }\n    };\n}\n```\n\n`createComparisonFunction()`\
  \ 返回一个匿名函数。返回的函数可能会被赋值给变量或被调用，但在 `createComparisonFunction()` 内部它是匿名的。每当函数被用作值时，它就是一个函数表达式。然而，这些并不是函数表达式的唯一用途，正如本章其余部分将所示。\n\
  \n## 递归\n\n递归函数通常在函数通过名称调用自身时形成，如下例：\n\n![image](img/logo1.gif)\n\n```\nfunction\
  \ factorial(num){\n    if (num <= 1){\n        return 1;\n    } else {\n       \
  \ return num * factorial(num-1);\n    }\n}\n```\n\nRecursionExample01.htm\n\n这是一个经典的递归阶乘函数。虽然它最初可以工作，但通过在其之后立即运行以下代码可以阻止其运行：\n\
  \n```\nvar anotherFactorial = factorial;\nfactorial = null;\nalert(anotherFactorial(4));\
  \  //错误！\n```\n\nRecursionExample01.htm\n\n在这里，`factorial()` 函数被存储在一个名为 `anotherFactorial`\
  \ 的变量中。然后 `factorial` 变量被设置为 `null`，因此只剩下一个对原始函数的引用。当调用 `anotherFactorial()` 时，将会导致错误，因为它会尝试执行\
  \ `factorial()`，而它不再是一个函数了。使用 `arguments.callee` 可以缓解这个问题。\n\n请记住 `arguments.callee`\
  \ 是指向正在执行的函数的指针，因此可以被用于递归地调用函数，如下所示：\n\n```\nfunction factorial(num){\n    if (num\
  \ <= 1){\n        return 1;\n    } else {\n        return num * arguments.callee(num-1);\n\
  \    }\n}\n```\n\nRecursionExample02.htm\n\n将高亮行改为使用 `arguments.callee` 而不是函数名，可以确保此函数无论如何访问都能工作。当你编写递归函数时，建议始终使用函数的\
  \ `arguments.callee`。\n\n`arguments.callee` 的值在严格模式下运行的脚本中是不可见的，并在尝试读取时会导致错误。相反，你可以使用命名函数表达式来实现相同的的结果。例如：\n\
  \n```\nvar factorial = (function f(num){\n    if (num <= 1){\n        return 1;\n\
  \    } else {\n        return num * f(num-1);\n    }\n});\n```\n\n在此代码中，一个命名函数表达式\
  \ `f()` 被创建并赋值给变量 `factorial`。即使函数被赋值给另一个变量，名称 `f` 也保持不变，因此递归调用将始终正确执行。这种模式在非严格和严格模式下均有效。\n\
  \n## 闭包\n\n匿名函数和闭包这两个术经常被混用。闭包是可以访问另一个函数作用域变量的函数。这通常通过在函数内部创建函数来实现，如之前 `createComparisonFunction()`\
  \ 示例中的高亮行：\n\n```\nfunction createComparisonFunction(propertyName) {\n\n    return\
  \ function(object1, object2){\n        var value1 = object1[propertyName];\n   \
  \     var value2 = object2[propertyName];\n\n        if (value1 < value2){\n   \
  \         return -1;\n        } else if (value1 > value2){\n            return 1;\n\
  \        } else {\n            return 0;\n        }\n    };\n}\n```\n\n此示例中的高亮行是内部函数（匿名函数）的一部分，它正在访问来自外部函数的变量（`propertyName`）。即使内部函数已经返回并在别处使用，它仍然可以访问该变量。这种发生是因为内部函数的作用域链包含了\
  \ `createComparisonFunction()` 的作用域。为了理解为什么这是可能的，请考虑函数首次被调用时发生了什么。\n\n第 4 章引入了作用域链的概念。作用域链如何创建和使用的细节对于良好理解闭包很重要。当函数被调用时，会创建一个执行上下文并创建其作用域链。函数的激活对象用参数和任何命名参数的值进行初始化。外部函数的激活对象是作用域链中的第二个对象。\n\
  \n\n\n\n[content]\n当函数执行时，会在作用域链中查找变量以进行值的读写。考虑以下内容：\n\n```javascript\nfunction\
  \ compare(value1, value2){\n    if (value1 < value2){\n        return -1;\n    }\
  \ else if (value1 > value2){\n        return 1;\n    } else {\n        return 0;\n\
  \    }\n}\n\nvar result = compare(5, 10);\n```\n\n这段代码定义了一个名为 `compare()` 的函数，并在全局执行上下文中调用。当第一次调用\
  \ `compare()` 时，会创建一个新的激活对象（activation object），其中包含参数 `value1` 和 `value2`。全局执行上下文的变量对象位于\
  \ `compare()` 执行上下文作用域链的后续，其中包含了 `result` 和 `compare`。图 7-1 阐释了这种关系。\n\n图 7-1\n\n\
  ![image](img/f222-01.jpg)\n\n在底层，一个对象代表每个执行上下文中的变量。全局上下文的变量对象始终存在，而局部上下文变量对象（如 `compare()`\
  \ 的对象）仅在函数执行期间存在。当 `compare()` 被定义时，它的作用域链被创建，并预加载了全局变量对象，然后保存到内部的 `[[Scope]]` 属性中。当函数被调用时，会创建一个执行上下文，并通过复制函数\
  \ `[[Scope]]` 属性中的对象来构建其作用域链。之后，会创建一个激活对象（它同时也作为变量对象）并推到上下文作用域链的前端。在这个示例中，这意味着 `compare()`\
  \ 函数的执行上下文在其作用域链中有两个变量对象：局部激活对象和全局变量对象。注意，作用域链本质上是一个指向变量对象的指针列表，并不物理上包含这些对象。\n\n\
  每当在函数内部访问变量时，会在作用域链中搜索具有给定名称变量。一旦函数完成，局部激活对象就会销毁，内存中只留下全局作用域。然而，闭包（Closures）的行为则不同。\n\
  \n定义在另一个函数内部的函数会将包含函数的激活对象添加到其作用域链中。因此，在 `createComparisonFunction()` 中，匿名函数的作用域链实际上包含了对\
  \ `createComparisonFunction()` 激活对象的引用。图 7-2 阐释了在执行以下代码时发生的这种关系：\n\n图 7-2\n\n![image](img/f223-01.jpg)\n\
  \n```javascript\nvar compare = createComparisonFunction(\"name\");\nvar result =\
  \ compare({ name: \"Nicholas\" }, { name: \"Greg\" });\n```\n\n当匿名函数从 `createComparisonFunction()`\
  \ 返回时，它的作用域链已初始化为包含来自 `createComparisonFunction()` 的激活对象和全局变量对象。这使得匿名函数可以访问 `createComparisonFunction()`\
  \ 的所有变量。另一个有趣的副作用是，一旦函数执行完毕，`createComparisonFunction()` 的激活对象无法被销毁，因为匿名函数的作用域链中仍然存在引用。在\
  \ `createComparisonFunction()` 完成后，其执行上下文的作用域链销毁，但它的激活对象将保留在内存中，直到匿名函数被销毁，如下所示：\n\
  \n```javascript\n//创建函数\nvar compareNames = createComparisonFunction(\"name\");\n\
  \n//调用函数\nvar result = compareNames({ name: \"Nicholas\" }, { name: \"Greg\"});\n\
  \n//取消函数引用 - 现在可以回收内存了\ncompareNames = null;\n```\n\n在这里，比较函数被创建并存储在变量 `compareNames`\
  \ 中。将 `compareNames` 设置为 `null` 会取消对函数的引用，并允许垃圾回收程序对其进行清理。随后作用域链将被销毁，所有的作用域（全局作用域除外）都可以被安全地销毁。图\
  \ 7-2 显示了在此示例中调用 `compare()` 时发生的作用域链关系。\n\n![image](img/pen.gif)\n\n由于闭包随身携带包含函数的作用域，它们占用的内存比其他函数更多。过度使用闭包会导致内存消耗过度，因此建议仅在绝对必要时才使用它们。优化\
  \ JavaScript 引擎（如 `V8`）会尝试回收因闭包而被“捕获”的内存，但在使用闭包时仍建议保持小心。\n\n### 闭包与变量\n\n这种作用域链配置有一个显著的副作用。闭包总是获取包含函数中任何变量的最后一个值。记住，闭包存储的是整个变量对象的引用，而不仅仅是某个特定的变量。这个问题在下面的示例中被清楚地说明了：\n\
  \n![image](img/logo1.gif)\n\n```javascript\nfunction createFunctions(){\n    var\
  \ result = new Array();\n\n    for (var i=0; i < 10; i++){\n        result[i] =\
  \ function(){\n            return i;\n        };\n    }\n\n    return result;\n\
  }\n```\nClosureExample01.htm\n\n该函数返回一个函数数组。似乎每个函数应该返回其索引的值，所以位置 0 的函数返回 0，位置 1\
  \ 的函数返回 1，依此类推。实际上，每个函数都返回 10。由于每个函数的作用域链中都有 `createFunctions()` 的激活对象，它们都指向同一个变量\
  \ `i`。当 `createFunctions()` 执行结束时，`i` 的值为 10，由于每个函数都引用存在 `i` 的变量对象，因此每个函数内部 `i`\
  \ 的值都是 10。然而，你可以通过创建另一个函数来强制闭包按预期工作：\n\n```javascript\nfunction createFunctions(){\n\
  \    var result = new Array();\n\n    for (var i=0; i < 10; i++){\n        result[i]\
  \ = function(num){\n            return function(){\n                return num;\n\
  \            };\n        }(i);\n    }\n\n    return result;\n}\n```\nClosureExample02.htm\n\
  \n在这个版本的 `createFunctions()` 中，每个函数返回不同的数字。我们没有直接将闭包赋值给数组，而是定义并立即调用了一个匿名函数。匿名函数有一个参数\
  \ `num`，即结果函数应该返回的。变量 `i` 作为参数传递给匿名函数。由于函数参数按值传递，`i` 的当前值被复制到参数 `num` 中。在匿名函数内部，创建一个访问\
  \ `num` 的闭包并返回。现在结果数组中的每个函数都有 `num` 的副本，因此可以返回不同的数字。\n\n### this 对象\n\n在闭包中使用 `this`\
  \ 对象引入了一些复杂的行为。`this` 对象根据函数执行时的上下文在运行时绑定：在全局函数中使用时，非严格模式下等等于 `window`，严格模式下等于 `undefined`；而当作为对象方法调用时，`this`\
  \ 等于该对象。匿名函数在此上下文中没有绑定到对象，这意味着 `this` 对象指向 `window`，除非在严格模式下执行（此时 `this` 为 `undefined`）。然而，由于闭包编写方式，这一事实并不显而易见。考虑以下内容：\n\
  \n![image](img/logo1.gif)\n\n```javascript\nvar name = \"The Window\";\n\nvar object\
  \ = {\n    name : \"My Object\",\n\n    getNameFunc : function(){\n        return\
  \ function(){\n            return this.name;\n        };\n    }\n};\n\nalert(object.getNameFunc()());\
  \  //\"The Window\" (非严格模式下)\n```\nThisObjectExample01.htm\n\n\n\n在这里，创建了一个名为 `name`\
  \ 的全局变量，以及一个包含名为 `name` 属性的对象。该对象包含一个方法 `getNameFunc()`，该方法返回一个匿名函数，该匿名函数又返回 `this.name`。由于\
  \ `getNameFunc()` 返回的是一个函数，调用 `object.getNameFunc()()` 会立即调用返回的那个函数，该函数返回一个字符串。在这种情况下，它返回的是\
  \ `\"The Window\"`，这是全局变量 `name` 的值。为什么匿名函数没有获取包含作用域的 `this` 对象呢？\n\n请记住，每个函数在被调用时都会自动获得两个特殊变量：`this`\
  \ 和 `arguments`。内部函数永远无法从外部函数直接访问这些变量。可以通过将 `this` 存储在闭包可以访问的另一个变量中，允许闭包访问不同的 `this`\
  \ 对象，例如本例：\n\n![image](img/logo1.gif)\n\n```\nvar name = \"The Window\";\n\nvar\
  \ object = {\n    name : \"My Object\",\n\n    getNameFunc : function(){\n     \
  \   var that = this;\n        return function(){\n            return that.name;\n\
  \        };\n    }\n};\n\nalert(object.getNameFunc()());  //\"My Object\"\n```\n\
  \n### ThisObjectExample02.htm\n\n高亮的两行显示了此示例与上一个示例的区别。在定义匿名函数之前，一个名为 `that` 的变量被赋值为\
  \ `this` 对象。当闭包定义时，它可以访问 `that`，因为它是包含函数中一个唯一命名的变量。即使在函数返回后，`that` 仍然绑定到 `object`\
  \ 上，因此调用 `object.getNameFunc()()` 返回 `\"My Object\"`。\n\n![image](img/pen.gif)\n\
  \n`this` 和 `arguments` 的行为都是如此。如果你想访问包含作用域的 `arguments` 对象，你需要将该引用保存到闭包可以访问的另一个变量中。\n\
  \n在某些特殊情况下，`this` 的值最终可能不是你预期的值。考虑对上一个示例的以下修改：\n\n```\nvar name = \"The Window\"\
  ;\n\nvar object = {\n    name : \"My Object\",\n\n    getName: function(){\n   \
  \     return this.name;\n    }\n};\n```\n\n`getName()` 方法简单地返回 `this.name` 的值。以下是调用\
  \ `object.getName()` 的各种方式及其结果：\n\n```\nobject.getName();     //\"My Object\"\n\
  (object.getName)();   //\"My Object\"\n(object.getName = object.getName)();   //\"\
  The Window\" 在非严格模式\n```\n\n### ThisObjectExample03.htm\n\n第一行以你通常会的方式调用 `object.getName()`，因此返回\
  \ `\"My Object\"`，因为 `this.name` 与 `object.name` 相同。第二行在调用 `object.getName` 之前在其周围加上了括号。虽然这看起来只是对函数的引用，但\
  \ `this` 值被保留了，因为 `object.getName` 和 `(object.getName)` 被定义为等价的。第三行执行了赋值，然后调用了结果。由于此赋值表达式的值是函数本身，`this`\
  \ 值没有被保留，因此返回了 `\"The Window\"`。\n\n你不太可能刻意使用第二行或第三行中的模式，但了解当语法发生细微变化时，`this` 的值可能会以意想不到的方式变化是有帮助的。\n\
  \n## 内存泄漏\n\n闭包的工作方式在第 9 版本之前的 Internet Explorer 中导致了特定问题，这是因为 JScript 对象和 COM 对象使用了不同的垃圾回收机制（在第\
  \ 4 章中讨论）。存储一个包含 HTML 元素的作用域实际上确保了该元素无法被销毁。考虑以下代码：\n\n```javascript\nfunction assignHandler(){\n\
  \    var element = document.getElementById(\"someElement\");\n    element.onclick\
  \ = function(){\n        alert(element.id);\n    };\n}\n```\n\n这段代码在 `element` 上作为事件处理器创建了一个闭包，这反过来创建了一个循环引用（事件在第\
  \ 13 章中讨论）。匿名函数保留了 `assignHandler()` 函数激活对象的引用，这防止了 `element` 的引用计数递减。只要匿名函数存在，`element`\
  \ 的引用计数将至少为 1，这意味着内存永远不会被回收。这种情况可以通过稍微修改代码来解决，如下：\n\n```javascript\nfunction assignHandler(){\n\
  \    var element = document.getElementById(\"someElement\");\n    var id = element.id;\n\
  \n    element.onclick = function(){\n        alert(id);\n    };\n\n    element =\
  \ null;\n}\n```\n\n在这一版本的代码中，`element` 的 ID 副本被存储在闭包中使用的变量中，消除了循环引用。然而，仅此一步还不足以防止内存问题。记住：闭包拥有对包含函数的整个激活对象的引用，该激活对象包含了\
  \ `element`。即使闭包没有直接引用 `element`，引用仍然存储在包含函数的激活对象中。因此，有必要将 `element` 变量设置为 `null`。这取消了\
  \ COM 对象的引用并递减了它的引用计数，确保在适当的时候回收内存。\n\n## 模拟块作用域\n\n如之前所述，JavaScript 没有块级作用域的概念，这意味着在块语句内部定义的变量实际上创建在包含函数中，而不是语句内部。考虑以下内容：\n\
  \n![image](img/logo1.gif)\n\n```javascript\nfunction outputNumbers(count){\n   \
  \ for (var i=0; i < count; i++){\n        alert(i);\n    }\n\n    alert(i);\n}\n\
  ```\n\n### BlockScopeExample01.htm\n\n在这个函数中，定义了一个 `for` 循环，变量 `i` 初始化为 0。对于 Java\
  \ 和 C++ 等语言，变量 `i` 只定义在块语句中，因此在循环完成后该变量就会被销毁。然而在 JavaScript 中，变量 `i` 是作为 `outputNumbers()`\
  \ 激活对象定义的，这意味着从该点开始它是可见的。即使对变量进行错误的重复声明也不会清除它的值：\n\n```javascript\nfunction outputNumbers(count){\n\
  \    for (var i=0; i < count; i++){\n        alert(i);\n    }\n\n    var i;  //变量重声明\n\
  \    alert(i);   //count\n}\n```\n\n### BlockScopeExample02.htm\n\nJavaScript 不会告诉你重复声明了同一个变量；它只是忽略后续的所有声明（尽管它会尊重初始化）。可以使用匿名函数来模拟块作用域并避免此类问题。\n\
  \n作为块作用域（通常称为私有作用域）使用的匿名函数的的基本语法如下：\n\n```javascript\n(function(){\n    //块代码\n\
  })();\n```\n\n这种语法定义了一个立即调匿名函数，也称为立即执行函数。看起来像函数定义的部分括起来表示它实际上是一个函数表达式。该函数通过最后的组括号被调用。如果这种语法让你感到困惑，请考虑以下示例：\n\
  \n```javascript\nvar count = 5;\noutputNumbers(count);\n```\n\n在这个示例中，变量 `count`\
  \ 初始化为值 5。当然，这个变量是不必要的，因为值被直接传递给函数。为了让代码更简洁，在调用函数时可以用值 5 替换变量 `count`：\n\n```javascript\n\
  outputNumbers(5);\n```\n\n这与上一个示例的工作原理相同，因为变量只是另一个值的表示，所以变量可以被实际值替换，且代码运行良好。现在考虑以下内容：\n\
  \n```javascript\nvar someFunction = function(){\n    //块代码\n};\nsomeFunction();\n\
  ```\n\n\n\n在本示例中，定义了一个函数并立即调用了它。创建了一个匿名函数并将其赋值给变量 `someFunction`。然后通过在函数名后加上括号来调用该函数，即变为\
  \ `someFunction()`。记得上一个示例中变量 `count` 可以被替换为它的实际值；在这里也可以进行相同的操作。然而，以下代码无法运行：\n\n\
  ```\nfunction(){\n    //此处是块级代码\n}();   //错误！\n```\n\n这段代码会导致语法错误，因为 JavaScript\
  \ 将 `function` 关键字视为函数声明的开始，而函数声明后面不能跟接括号。然而，函数表达式（Function expressions）后面可以跟接括号。要将函数声明转换为函数表达式，你只需要像这样用括号将其括起来即可：\n\
  \n```\n(function(){\n    //此处是块级代码\n})();\n```\n\n这些私有作用域可以用任何需要临时变量的地方，如下例所示：\n\
  \n![image](img/logo1.gif)\n\n```\nfunction outputNumbers(count){\n    (function\
  \ () {\n        for (var i=0; i < count; i++){\n            alert(i);\n        }\n\
  \    })();\n\n    alert(i);   //会导致错误\n}\n```\n\n`BlockScopeExample03.htm`\n\n在\
  \ `outputNumbers()` 函数的这个重写版本中，`for` 循环周围插入了一个私有作用域。匿名函数内部定义的任何变量在执行完成后都会被销毁，因此变量\
  \ `i` 在循环中使用后就会被销毁。`count` 变量可以在私有作用域内访问，因为匿名函数是一个闭包，可以完全访问包含其作用域的变量。\n\n这种技术通常用于函数外的全局作用域，以限制添加到全局作用域的变量和函数的数量。通常你希望避免向全局作用域添加变量和函数，特别是在有多个开发者的大型应用中，以避免命名冲突。私有作用域允许每个开发者使用自己的变量，而不必污染全局作用域。考虑这个示例：\n\
  \n```\n(function(){\n\n    var now = new Date();\n    if (now.getMonth() == 0 &&\
  \ now.getDate() == 1){\n        alert(\"新年快乐!\");\n    }\n\n})();\n```\n\n将此代码放在全局作用域中，提供了判断当天是否为\
  \ 1 月 1 日的功能，如果是，则向用户显示消息。变量 `now` 变成了一个匿名函数的局部变量，而不是在全局作用域中创建。\n\n![image](img/pen.gif)\n\
  \n这种模式限制了闭包内存问题，因为没有对匿名函数的引用。因此，在函数完成后，作用域链可以立即被销毁。\n\n## 私有变量\n\n严格来说，JavaScript\
  \ 没有私有成员的概念；所有对象属性都是公共的。然而，存在私有变量的概念。任何定义在函数内部的变量都被认为是私有的，因为它们在函数外部是不可访问的。这包括函数参数、局部变量以及定义在其他函数内部的函数。考虑以下：\n\
  \n```\nfunction add(num1, num2){\n    var sum = num1 + num2;\n    return sum;\n\
  } \n```\n\n在这个函数中有三个私有变量：`num1`、`num2` 和 `sum`。这些变量在函数内部可以访问，但在函数外部无法访问。如果在这个函数内部创建一个闭包，它将通过其作用域链访问这些变量。利用这一知识，你可以创建可以访问私有变量的公共方法。\n\
  \n特权方法（Privileged method）是一种可以访问私有变量和/或私有函数的公共方法。在对象上创建特权方法有两种方法。第一种是在构造函数内部执行，如下例所示：\n\
  \n```\nfunction MyObject(){\n\n    //私有变量和函数\n    var privateVariable = 10;\n\n\
  \    function privateFunction(){\n        return false;\n    }\n\n    //特权方法\n \
  \   this.publicMethod = function (){\n        privateVariable++;\n        return\
  \ privateFunction();\n    };\n}\n```\n\n这种模式在构造函数内部定义了所有私有变量和函数。然后可以创建特权方法来访问这些私有成员。这之所以有效，是因为特权方法在构造函数中定义时变成了闭包，可以完全访问构造函数作用域内定义的所有变量和函数。在这个示例中，变量\
  \ `privateVariable` 和函数 `privateFunction()` 仅由 `publicMethod()` 访问。一旦创建了 `MyObject`\
  \ 的实例，就没有办法直接访问 `privateVariable` 和 `privateFunction()`；你可以通过 `publicMethod()` 来。\n\
  \n你可以定义私有和特权成员来隐藏不应被直接修改的数据，如下例所示：\n\n![image](img/logo1.gif)\n\n```\nfunction Person(name){\n\
  \n    this.getName = function(){\n        return name;\n    };\n\n    this.setName\
  \ = function (value) {\n        name = value;\n    };\n}\n\nvar person = new Person(\"\
  Nicholas\");\nalert(person.getName());   //\"Nicholas\"\nperson.setName(\"Greg\"\
  );\nalert(person.getName());   //\"Greg\"\n```\n\n`PrivilegedMethodExample01.htm`\n\
  \n代码中的构造函数定义了两个特权方法：`getName()` 和 `setName()`。每个方法在构造函数外部都是可的，并访问私有变量 `name`。在 `Person`\
  \ 构造函数外部，没有办法访问 `name`。由于两个方法都定义在构造函数内部，它们是闭包，并通过作用域链访问 `name`。私有变量 `name` 对于每个\
  \ `Person` 实例来说都是唯一的，因为每次调用构造函数时方法都会重新创建。然而，一个缺点是，你必须使用构造函数模式来实现这一结果。正如第 6 章所讨论的，构造函数模式是有缺陷的，因为它为每个实例创建了方法。使用静态私有变量来实现特权方法可以避免这个问题。\n\
  \n## 静态私有变量\n\n也可以通过使用私有作用域定义私有变量或函数来创建特权方法。模式如下：\n\n```\n(function(){\n\n    //私有变量和函数\n\
  \    var privateVariable = 10;\n\n    function privateFunction(){\n        return\
  \ false;\n    }\n\n    //构造函数\n    MyObject = function(){\n    };\n\n    //公共方法和特权方法\n\
  \    MyObject.prototype.publicMethod = function(){\n        privateVariable++;\n\
  \        return privateFunction();\n    };\n\n})();\n```\n\n\n\n\n```javascript\n\
  (function(){\n\n    var name = \"\";\n\n    Person = function(value){          \
  \      \n        name = value;                \n    };\n\n    Person.prototype.getName\
  \ = function(){\n        return name;\n    };\n\n    Person.prototype.setName =\
  \ function (value){\n        name = value;\n    };\n})();\n\nvar person1 = new Person(\"\
  Nicholas\");\nalert(person1.getName());   //\"Nicholas\"\nperson1.setName(\"Greg\"\
  );\nalert(person1.getName());   //\"Greg\"\n\nvar person2 = new Person(\"Michael\"\
  );\nalert(person1.getName());   //\"Michael\"\nalert(person2.getName());   //\"\
  Michael\"\n```\n\n### PrivilegedMethodExample02.htm\n\n示例中的 `Person` 构造函数可以访问私有变量\
  \ `name`，`getName()` 和 `setName()` 方法也是如此。使用这种模式，`name` 变量变成了静态的，并将在所有实例之间共享。这意味着在其中一个实例上调用\
  \ `setName()` 会影响所有其他实例。调用 `setName()` 或创建一个新的 `Person` 实例都会将 `name` 变量设置为新值。这导致所有实例都返回相同的值。\n\
  \n通过这种方式创建静态私有变量可以通过原型实现更好的代码复用，尽管每个实例并没有自己的私有变量。最终，使用实例私有变量还是静态私有变量的决定取决于个人需求。\n\
  \n![image](img/pen.gif)\n\n变量查找在作用域链中越高，由于使用了闭包和私有变量，查找速度就越慢。\n\n## 模块模式 (The Module\
  \ Pattern)\n\n之前的模式为自定义类型创建了私有变量和特权方法（privileged methods）。Douglas Crockford 描述的模块模式对单例（singletons）执行相同的操作。单例是指只有一个实例的对象。传统上，单例在\
  \ JavaScript 中使用对象字面量表示法创建，如下所示：\n\n```javascript\nvar singleton = {\n    name :\
  \ value,\n    method : function () {\n        //在此处编写方法代码\n    }\n};\n```\n\n模块模式增强了基础单例，允许使用私有变量和特权方法，格式如下：\n\
  \n```javascript\nvar singleton = function(){\n\n    // 私有变量和函数\n    var privateVariable\
  \ = 10;\n\n    function privateFunction(){\n        return false;\n    }\n\n   \
  \ // 特权/公共方法和属性\n    return {\n\n        publicProperty: true,\n\n        publicMethod\
  \ : function(){\n            privateVariable++;\n            return privateFunction();\n\
  \        }\n\n    };\n}();\n```\n\n模块模式使用一个返回对象的匿名函数。在匿名函数内部，首先定义私有变量和函数。之后，返回一个对象字面量作为返回值。该对象字面量仅包含应该是公共的属性和方法。由于对象定义在匿名函数内部，因此所有公共方法都可以访问私有变量和函数。本质上，该对象字面量定义了单例的公共接口。当单例需要某种初始化并访问私有变量时（如示例所示），这非常有用：\n\
  \n![image](img/logo1.gif)\n\n```javascript\nvar application = function(){\n\n  \
  \  // 私有变量和函数\n    var components = new Array();\n\n    // 初始化\n    components.push(new\
  \ BaseComponent());\n\n    // 公共接口\n    return {\n        getComponentCount : function(){\n\
  \            return components.length;\n        },\n\n        registerComponent\
  \ : function(component){\n            if (typeof component == \"object\"){\n   \
  \             components.push(component);\n            }\n        }\n    };\n}();\n\
  ```\n\n### ModulePatternExample01.htm\n\n在 Web 应用程序中，拥有一个管理应用级信息的单例是非常常见的。这个简单的示例创建了一个管理组件的应用程序对象。当对象第一次被创建时，会创建一个私有的\
  \ `components` 数组，并将 `BaseComponent` 的新实例添加到列表中。（`BaseComponent` 的代码并不重要；它仅用于在示例中展示初始化。）`getComponentCount()`\
  \ 和 `registerComponent()` 方法是具有访问 `components` 数组权限的特权方法。前者简单返回已注册组件的数量，后者则注册新组件。\n\
  \n模块模式适用于此类情况：必须创建一个对象，并用某些数据对其进行初始化，并暴露可以访问私有数据的公共方法。以这种方式创建的每个单例都是 `Object` 的实例，因为根结底一个对象字面量代表了它。这并不重要，因为单例通常是全局访问的，而不是作为参数传递给函数，这消除了使用\
  \ `instanceof` 运算符来确定对象类型的需求。\n\n## 模块增强模式 (The Module-Augmentation Pattern)\n\n\
  对模块模式的另一种处理方法是在返回对象之前对其进行增强。当单例对象需要是特定类型的实例，但必须通过额外的属性和/方法进行增强时，这种模式非常有用。考虑以下示例：\n\
  \n```javascript\nvar singleton = function(){\n\n    // 私有变量和函数\n    var privateVariable\
  \ = 10;\n\n    function privateFunction(){\n        return false;\n    }\n\n   \
  \ // 创建对象\n    var object = new CustomType();\n\n    // 添加特权/公共属性和方法\n    object.publicProperty\
  \ = true;\n\n    object.publicMethod = function(){\n        privateVariable++;\n\
  \        return privateFunction();\n    };\n\n    // 返回对象\n    return object;\n\
  }();\n```\n\n如果模块模式示例中的 `application` 对象必须是 `BaseComponent` 的实例，则可以使用以下代码：\n\n![image](img/logo1.gif)\n\
  \n```javascript\nvar application = function(){\n\n    // 私有变量和函数\n    var components\
  \ = new Array();\n\n    // 初始化\n    components.push(new BaseComponent());\n\n  \
  \  // 创建 application 的本地副本\n    var app = new BaseComponent();\n\n    // 公共接口\n\
  \    app.getComponentCount = function(){\n        return components.length;\n  \
  \  };\n\n    app.registerComponent = function(component){\n        if (typeof component\
  \ == \"object\"){\n            components.push(component);\n        }\n    };\n\n\
  \    // 返回它\n    return app;\n}();\n```\n\n### ModuleAugmentationExample01.htm\n\
  \n在这个重写的应用程序单例中，首先定义私有变量，与上一个示例相同。区别在于创建一个名为 `app` 的变量，它是 `BaseComponent` 的新实例。然后向\
  \ `app` 对象添加了公共方法以访问私有变量。最后一步是返回 `app` 对象，将其赋值给 `application`。\n\n## 总结 (SUMMARY)\n\
  \n函数表达式是 JavaScript 编程中有用的工具。它们允许进行不需要命名的动态编程。这些匿名函数也称为 lambda 函数是使用 JavaScript\
  \ 函数的一种强大方式。以下是函数表达式的总结：\n\n*   函数表达式与函数声明不同。函数声明需要名称，而函数表达式不需要。没有名的函数表达式称为匿名函数。\n\
  *   由于没有确定引用函数的方法，递归函数变得更加复杂。\n*   在非严格模式下运行的递归函数可以使用 `arguments.callee` 来递归调用自身，而不是使用函数名称，而名称可能会改变。\n\
  \n闭包在函数定义在另一个函数内部时创建，允许闭包访问包含函数内部的所有变量，如下：\n\n*   在后台，闭包的作用域链包含一个自身的变量对象、包含函数的对象以及全局上下文。\n\
  *   通常情况下，当函数执行完毕，其作用域及其所有变量都会被销毁。\n\n\n\n\n当闭包从该函数返回时，它的作用域将保留在内存中，直到该闭包不再存在。\n\
  \n通过闭包，可以在 JavaScript 中模拟并不存在的块级作用域（block scoping），如下所示：\n\n- 可以创建并立即调用一个函数，执行其内部代码，但永远不会留下对该函数的引用。\n\
  - 这导致函数内部的所有变量都会被销毁，除非它们被显式地赋值给包含作用域中的变量。\n\n闭包还可以用于在对象中创建私有变量，如下：\n\n- 尽管 JavaScript\
  \ 没有正式的对象私有属性概念，但可以使用闭包来实现公共方法，这些方法可以访问包含作用域内定义的变量。\n- 访问私有变量的公共方法被称为特权方法（privileged\
  \ methods）。\n- 使用构造函数或原型模式可以在自定义类型上实现特权方法，使用模块或模块扩展模式可以在单例上实现特权方法。\n\n函数表达式和闭包在\
  \ JavaScript 中极其强大，可以很多任务。请记住，闭包会在内存中维护额外的作用域，因此过度使用它们可能会导致内存消耗增加。\n\n# 第 8 章：浏览器对象模型\
  \ (BOM)\n\n## 本章内容\n\n- 理解 BOM 的核心 `window` 对象\n- 控制窗口、框架（frames）和弹出窗口\n- 来自 `location`\
  \ 对象的页面信息\n- 使用 `navigator` 对象了解浏览器\n\n尽管 ECMAScript 将其描述为 JavaScript 的核心，但浏览器对象模型（BOM）实际上是在\
  \ Web 上使用 JavaScript 的核心。BOM 提供了独立于任何网页内容的、暴露浏览器功能的对象。多年来，由于缺乏任何真实的规范，使得 BOM 既有趣又存在问题，因为浏览器厂商可以根据自己的意愿对其进行扩展。浏览器之间的共性变成了事实上的标准，它们主要为了互操作性而在浏览器开发过程中生存了下来。HTML5\
  \ 规范现在已涵盖了 BOM 的主要方面，因为 W3C 正在试图将浏览器中 JavaScript 最基础的部分之一标准化。\n\n## window 对象\n\n\
  BOM 的核心是 `window` 对象，它代表浏览器的实例。`window` 对象在浏览器中起着双重作用：既是浏览器窗口的 JavaScript 接口，又是\
  \ ECMAScript 的全局对象。这意味着在网页中定义的每个对象、变量和函数都使用 `window` 作为其全局对象，并可以访问如 `parseInt()`\
  \ 等方法。\n\n### 全局作用域\n\n由于 `window` 对象兼任 ECMAScript 全局对象，所有全局声明的变量和函数都会成为 `window`\
  \ 对象的属性和方法。考虑这个示例：\n\n```javascript\nvar age = 29;\nfunction sayAge(){\nalert(this.age);\n\
  }\nalert(window.age); //29\nsayAge(); //29\nwindow.sayAge(); //29\n```\n\n在这里，全局作用域中定义了一个名为\
  \ `age` 的变量和一个名为 `sayAge()` 的函数，这自动将它们放置在 `window` 对象上。因此，变量 `age` 可以通过 `window.age`\
  \ ，函数 `sayAge()` 也可以通过 `window.sayAge()`()`。由于 `sayAge()` 存在于全局作用域，`this.age` 映射到\
  \ `window.age`，并显示正确的的结果。\n\n尽管全局变量变成了 `window` 对象的属性，但定义全局变量与直接在 `window` 上定义属性之间存在细微差别：全局变量无法使用\
  \ `delete` 操作符删除，而直接在 `window` 上定义的属性可以删除。例如：\n\n![image](img/logo1.gif)\n\n```javascript\n\
  var age = 29;\nwindow.color = \"red\";\n// 在 IE < 9 中报错，在所有其他浏览器中返回 false\ndelete\
  \ window.age;\n// 在 IE < 9 中报错，在所有其他浏览器中返回 true\ndelete window.color; //returns\
  \ true\nalert(window.age); //29\nalert(window.color); //undefined\n```\n\n`DeleteOperatorExample01.htm`\n\
  \n通过 `var` 语句添加的 `window` 属性的 `Configurable` 属性被设置为 `false`，因此可能无法 `delete` 操作符删除。Internet\
  \ Explorer 8 及更早版本通过在对 `window` 属性使用 `delete` 操作符时抛出错误来强制这一点，无论它们最初是如何创建的。Internet\
  \ Explorer 9 及更高版本不会报错。\n\n另外：尝试访问未声明的变量会抛出错误，但可以通过查看 `window` 对象来检查可能未声明变量是否存在。例如：\n\
  \n```javascript\n// 这会报错，因为 oldValue 未声明\nvar newValue = oldValue;\n// 这不会报错，因为它是属性查找\n\
  // newValue 被设置为 undefined\nvar newValue = window.oldValue;\n```\n\n记住这一点，JavaScript\
  \ 中有很多被认为是全局的对象，例如 `location` 和 `navigator`（本章稍后会讨论），但它们实际上是 `window` 对象的属性。\n\n\
  ![image](img/pen.gif)\n\nWindows Mobile 版 Internet Explorer 不允许通过 `window.property\
  \ = value` 直接在 `window` 对象上创建新属性或方法。然而，所有全局声明的变量和函数仍然成为 `window` 的成员。\n\n## 窗口关系与框架\n\
  \n如果页面包含框架（frames），每个框架都有自己的 `window` 对象并存储在 `frames` 集合中。在 `frames` 集合中，`window`\
  \ 对象通过数字（从 0 开始，从左到右，然后按行逐行）和框架的名称进行索引。每个 `window` 对象都有一个 `name` 属性，包含框架的名称。考虑以下：\n\
  \n![image](img/logo1.gif)\n\n```html\n<html>\n<head>\n<title>Frameset Example</title>\n\
  </head>\n<frameset rows=\"160,*\">\n<frame src=\"frame.htm\" name=\"topFrame\">\n\
  <frameset cols=\"50%,50%\">\n<frame src=\"anotherframe.htm\" name=\"leftFrame\"\
  >\n<frame src=\"anotherframe.htm\" name=\"rightFrame\">\n</frameset>\n</frameset>\n\
  </html>\n```\n\n`FramesetExample01.htm`\n\n此代码创建了一个顶部有一个框架、下方有两个框架的框架集。在这里，可以通过\
  \ `window.frames[0]` 或 `window.frames[\"topFrame\"]` 引用框架；但可能会使用 `top` 对象来引用这些框架（即\
  \ `top.frames[0]`）。\n\n`top` 对象始终指向最顶层（外部）框架，即浏览器窗口。这确保你指向的是正确的框架。框架内编写的任何引用 `window`\
  \ 对象的代码都是指向该框架的实例，而不是顶层的。图 8-1 显示了从顶层窗口访问示例中框架的各种方式。\n\n图 8-1\n\n![image](img/f242-01.jpg)\n\
  \n另一个窗口对象被称为 `parent`。`parent` 对象始终指向当前框架的直接父框架。在某些情况下，`parent` 可能等于 `top`，当没有框架时，`parent`\
  \ 等于 `top`（且两者都等于 `window`）。考虑以下示例：\n\n![image](img/logo1.gif)\n\n```html\n<html>\n\
  <head>\n<title>Frameset Example</title>\n</head>\n<frameset rows=\"100,*\">\n<frame\
  \ src=\"frame.htm\" name=\"topFrame\">\n<frameset cols=\"50%,50%\">\n<frame src=\"\
  anotherframe.htm\" name=\"leftFrame\">\n<frame src=\"anotherframeset.htm\" name=\"\
  rightFrame\">\n</frameset>\n</frameset>\n</html>\n```\n\n`frameset1.htm`\n\n这个框架集包含一个另一个框架集的框架，其代码如下：\n\
  \n```html\n<html>\n<head>\n<title>Frameset Example</title>\n</head>\n<frameset cols=\"\
  50%,50%\">\n<frame src=\"red.htm\" name=\"redFrame\">\n<frame src=\"blue.htm\" name=\"\
  blueFrame\">\n</frameset>\n</html>\n```\n\n`anotherframeset.htm`\n\n\n\n\n当第一个 frameset\
  \ 加载到浏览器时，它会将另一个 frameset 加载到 `rightFrame` 中。如果向 `redFrame`（或 `blueFrame`）中编写代码，则父对象指向\
  \ `rightFrame`。然而，如果代码写在 `topFrame` 中，那么 `parent` 指向 `top`，因为它的直接父级是最外层的框架。图 8-2\
  \ 显示了当此示例加载到 Web 浏览器时，各种窗口对象的值。\n\n图 8-2\n\n![image](img/f243-01.jpg)\n\n请注意，除非像本章稍后讨论的那样使用\
  \ `window.open()` 打开窗口，否则最顶层的窗口永远不会为 `name` 属性设置值。\n\n还有一个窗口对象，叫做 `self`，它始终指向 `window`。事实上，这两者可以互换使用。尽管\
  \ `self` 没有独立的值，但为了与 `top` 和 `parent` 对象保持一致，它也被包含在内。\n\n这些对象中的每一个实际上都是 `window`\
  \ 对象的属性，可以通过 `window.parent`、`window.top` 等进行访问。这意味着可以将窗口对象链式起来，例如 `window.parent.parent.frames[0]`。\n\
  \n![image](img/pen.gif)\n\n每当使用框架时，浏览器中就会存在多个 `Global` 对象。在每个框架中定义的全局变量被定义为该框架的\
  \ `window` 对象的属性。由于每个窗口对象都包含原生类型构造函数，因此每个框架都有自己的版本的构造函数，且这些版本是不相等的。例如，`top.Object`\
  \ 不等于 `top.frames[0].Object`，这会影响跨框架传递对象时对 `instanceof` 的使用。\n\n## 窗口位置\n\n窗口对象的位置可以使用各种属性和方法来确定和更改。Internet\
  \ Explorer、Safari、Opera 和 Chrome 都提供了 `screenLeft` 和 `screenTop` 属性，分别指示窗口相对于屏幕左侧和顶部的位置。Firefox\
  \ 通过 `screenX` 和 `screenY` 属性提供此功能，这两个属性在 Safari 和 Chrome 中也受到支持。Opera 支持 `screenX`\
  \ 和 `screenY`，你应该避免在 Opera 中使用它们，因为它们与 `screenLeft` 和 `screenTop` 不对应。以下代码确定了跨浏览器的窗口左侧和顶部位置：\n\
  \n![image](img/logo1.gif)\n\n```\nvar leftPos = (typeof window.screenLeft == \"\
  number\") ?\nwindow.screenLeft : window.screenX;\nvar topPos = (typeof window.screenTop\
  \ == \"number\") ?\nwindow.screenTop : window.screenY;\n```\n\n`WindowPositionExample01.htm`\n\
  \n此示例使用三元运算符来确定 `screenLeft` 和 `screenTop` 属性是否存在。如果它们存在（在 Internet Explorer、Safari、Opera\
  \ 和 Chrome 中如此），则使用它们。如果它们不存在（如在 Firefox 中），则使用 `screenX` 和 `screenY`。\n\n使用这些值有一些特殊。在\
  \ Internet Explorer、Opera 和 Chrome 中，`screenLeft` 和 `screenTop` 指的是从屏幕左侧和顶部到 `window`\
  \ 所代表的页面视图区域的空间。如果窗口对象是最层对象，且浏览器窗口位于屏幕的最顶部（y 坐标为 0），则 `screenTop` 值将是出现在页面视图区域上方浏览器工具栏的像素高度。Firefox\
  \ 和 Safari 将这些坐标视为与整个浏览器窗口相关，因此将窗口放在屏幕 y 坐标 0 处返回的顶部位置为 0。\n\n为了进一步增加复杂性，Firefox、Safari\
  \ 和 Chrome 始终对页面上的每个框架返回 `top.screenX` 和 `top.screenY` 的值。即使页面由于某些边距而偏移，每当相对于窗口对象使用\
  \ `screenX` 和 `screenY` 时，都会返回这些相同的值。Internet Explorer 和 Opera 提供了框架相对于屏幕边缘位置的准确坐标。\n\
  \n最终结果是，你无法跨所有浏览器准确确定浏览器窗口的左侧和顶部坐标。然而，可以使用 `moveTo()` 和 `moveBy()` 方法准确地将窗口移动到新位置。每个方法接受两个参数。`moveTo()`\
  \ 期望移动到的 x 和 y 坐标，而 `moveBy()` 期望每个方向移动的像素数。考虑此示例：\n\n```\n//将窗口移动到左上坐标\nwindow.moveTo(0,0);\n\
  //将窗口向下移动 100 像素\nwindow.moveBy(0, 100);\n//将窗口移动到位置 (200, 300)\nwindow.moveTo(200,\
  \ 300);\n//将窗口向左移动 50 像素\nwindow.moveBy(-50, 0);\n```\n\n这些方法可能被浏览器禁用，并且在 Internet\
  \ Explorer 7+、Chrome 和 Opera 的主浏览器窗口中默认是禁用的。这些方法对框架无效；它们仅适用于最顶层窗口对象。\n\n## 窗口大小\n\
  \n跨浏览器确定窗口大小并不是易的。Internet Explorer 9+、Firefox、Safari、Opera 和 Chrome 都提供了四个属性：`innerWidth`、`innerHeight`、`outerWidth`\
  \ 和 `outerHeight`。在 Internet Explorer 9+、Safari、Firefox 和 Chrome 中，`outerWidth`\
  \ 和 `outerHeight` 返回浏览器本身的尺寸（无论它是用于最顶层窗口对象还是框架）。在 Opera 中，这些值是视口的大小。`innerWidth`\
  \ 和 `innerHeight` 属性指示浏览器窗口内部（减去边框和工具栏）。Internet Explorer 8 及更早版本没有获取当前窗口尺寸的方法；但它们通过\
  \ DOM 提供页面可视区域的信息。\n\n`document.documentElement.clientWidth` 和 `document.documentElement.clientHeight`\
  \ 属性在 Internet Explorer、Firefox、Safari、Opera 和 Chrome 中提供了视口的宽度和高度。在 Internet Explorer\
  \ 6 中，必须处于标准模式这些属性才可用；在兼容模式下，通过 `document.body.clientWidth` 和 `document.body.clientHeight`\
  \ 获取信息。当 Chrome 处于兼容模式时，`document.documentElement` 和 `document.body` 上的 `clientWidth`\
  \ 和 `clientHeight` 值都包含视口尺寸。\n\n最终结果是，没有准确的方法确定浏览器本身的大小，但可以获取视口的尺寸，如下所示：\n\n![image](img/logo1.gif)\n\
  \n```\nvar pageWidth = window.innerWidth,\npageHeight = window.innerHeight;\nif\
  \ (typeof pageWidth != \"number\"){\nif (document.compatMode == \"CSS1Compat\"){\n\
  pageWidth = document.documentElement.clientWidth;\npageHeight = document.documentElement.clientHeight;\n\
  } else {\npageWidth = document.body.clientWidth;\npageHeight = document.body.clientHeight;\n\
  }\n}\n```\n\n`WindowSizeExample01.htm`\n\n在此代码中，`pageWidth` 和 `pageHeight` 分别赋值为\
  \ `window.innerWidth` 和 `window.innerHeight` 的值。然后检查 `pageWidth` 的值是否为数字；如果不是，则通过使用\
  \ `document.compatMode` 页面是否处于标准模式。（该属性在第 11 章中详细讨论。）如果是，则使用 `document.documentElement.clientWidth`\
  \ 和 `document.documentElement.clientHeight`；否则，使用 `document.body.clientWidth` 和\
  \ `document.body.clientHeight`。\n\n对于移动设备，`window.innerWidth` 和 `window.innerHeight`\
  \ 是视觉视口的尺寸，即页面在屏幕上的可见区域。移动 Internet Explorer 不支持这些属性，但在 `document.documentElement.clientWidth`\
  \ 和 `document.documentElement.clientHeight` 上提供相同的信息。这些值会随着你放大或缩小页面而变化。\n\n\n\n\n\
  在其他移动浏览器中，`document.documentElement` 的测量提供了布局视口（layout viewport）的测量，这是渲染页面的实际尺寸（与视觉视口不同，后者只是整个页面的一小部分）。移动版\
  \ Internet Explorer 将此信息存储在 `document.body.clientWidth` 和 `document.body.clientHeight`\
  \ 中。这些值在放大或缩小时不会改变。\n\n由于这些与桌面浏览器的这些差异，在决定使用和遵循哪些测量值之前，你可能需要先判断用户是否使用移动设备。\n\n![image](img/pen.gif)\n\
  \n移动视口是一个复杂的话，有各种异常和注意事项。移动端开发顾问 Peter-Paul Koch 在 [`quirksmode.org/mobile/viewports2.html`](http://quirksmode.org/mobile/viewports2.html)\
  \ 中概述了他所有的研究。如果你正在为移动设备开发程序，这是推荐的阅读材料。\n\n可以使用 `resizeTo()` 和 `resizeBy()` 方法调整浏览器窗口大小。每个方法都接受两个参数：`resizeTo()`\
  \ 期望一个新的宽度和高度，而 `resizeBy()` 期望每个维度上的差异。这是一个示例：\n\n```\n//调整大小为 100 x 100\nwindow.resizeTo(100,\
  \ 100);\n//调整大小为 200 x 150\nwindow.resizeBy(100, 50);\n//调整大小为 300 x 300\nwindow.resizeTo(300,\
  \ 300);\n```\n\n与移动方法一样，调整大小方法可能会被浏览器禁用，并且在 Internet Explorer 7+、Chrome 和 Opera\
  \ 中默认是禁用的。同样，移动方法，这些方法仅适用于最顶层的窗口对象。\n\n## 导航和打开窗口\n\n`window.open()` 方法既可以导航到特定的\
  \ URL，也可用于打开新的浏览器窗口。该方法接受四个参数：要加载的 URL、窗口目标（target）、一个特性字符串，以及一个指示新页面应替换浏览器历史记录中当前加载页面的布尔值。通常只使用前三个参数；最后一个参数在不打开新窗口时有效。\n\
  \n如果传递给 `window.open()` 的第二个参数是已存在的窗口或帧的名称，则 URL 将加载到具有该名称的窗口或帧中。这是一个示例：\n\n```\n\
  //相当于 <a href=\"http://www.wrox.com\" target=\"topFrame\"></a>\nwindow.open(\"http://www.wrox.com/\"\
  , \"topFrame\");\n```\n\n这行代码的作用相当于用户点击了一个 `href` 属性设置为“[[`www.wrox.com`](http://www.wrox.com)”\
  \ 且 `target` 属性设置为 \"topFrame\" 的链接。如果存在名为 \"topFrame\" 的窗口或帧，则 URL 将加载到那里；否则将创建一个新窗口并命名为\
  \ \"topFrame\"。第二个参数也可以是任何特殊窗口名称：`_self`、`_parent`、`_top` 或 `_blank`。\n\n## 弹出窗口\n\
  \n当第二个参数没有标识已存在的窗口或帧时，将根据作为第三参数传递的字符串创建一个新窗口或标签页。如果缺少第三个参数，将打开一个具有默认浏览器窗口设置的新窗口（根据浏览器设置可能是标签页）（工具栏、地址栏和状态栏均根据浏览器的默认设置设置）。在不打开新窗口时，第三个参数会被忽略。\n\
  \n第三个参数是一个逗号分隔的设置字符串，用于指示新窗口的显示信息。下表描述了各种选项。\n\n| Setting | Value(s) | Description\
  \ |\n| --- | --- | --- |\n| fullscreen | \"yes\" 或 \"no\" | 表示创建时浏览器窗口是否应最大化。仅限\
  \ Internet Explorer。 |\n| height | Number | 新窗口的初始高度。此值不能小于 100。 |\n| left | Number\
  \ | 新窗口的初始左坐标。不能为负数。 |\n| location | \"yes\" 或 \"no\" | 表示是否显示地址栏。默认值随浏览器而异。当设置为\
  \ \"no\" 时，地址栏可能会被隐藏或禁用（取决于浏览器）。 |\n| menubar | \"yes\" 或 \"no\" | 表示是否显示菜单栏。默认为\
  \ \"no\"。 |\n| resizable | \"yes\" 或 \"no\" | 表示新窗口是否可以通过拖动边框调整大小。默认为 \"no\"。 |\n\
  | scrollbars | \"yes\" 或 \"no\" | 表示如果内容无法容于视口内，新窗口是否允许滚动。默认为 \"no\"。 |\n| status\
  \ | \"yes\" 或 \"no\" | 表示是否显示状态栏。默认值随浏览器而异。 |\n| toolbar | \"yes\" 或 \"no\" | 表示是否显示工具栏。默认为\
  \ \"no\"。 |\n| top | Number | 新窗口的初始顶部坐标。不能为负数。 |\n| width | Number | 新窗口的初始宽度。此值不能小于\
  \ 100。 |\n\n这些设置中的任何或全部都可以以逗号分隔的键值对集合进行指定。键值对由等号表示（特性字符串中不允许有空格）。请考虑以下示例：\n\n```\n\
  window.open(\"http://www.wrox.com/\",\"wroxWindow\",\n\"height=400,width=400,top=10,\n\
  ```\n\n这行代码的作用相当于用户点击了一个 `href` 属性设置为“[`www.wrox.com`](http://www.wrox.com)” 且 `target`\
  \ 属性设置为 \"topFrame\" 的链接。如果存在名为 \"topFrame\" 的窗口或帧，则 URL 将加载到那里；否则将创建一个新窗口并命名为 \"\
  topFrame\"。第二个参数也可以是任何特殊窗口名称：`_self`、`_parent`、`_top` 或 `_blank`。\n\n`window.open()`\
  \ 方法返回新创建窗口的引用。该对象与其他任何对象相同，如下：\n\n```\nwindow.open(\"http://www.wrox.com/\",\"\
  wroxWindow\",\n\"height=400,width=400,top=10,\n```\n\n新创建的窗口对象通过 `opener` 属性引用回打开它的窗口。该属性仅定义在弹出窗口的最顶层窗口对象（top）上，并指向调用\
  \ `window.open()` 的窗口的指针。例如：\n\n```\nvar wroxWin =window.open(\"http://www.wrox.com/\"\
  ,\"wroxWindow\",\n\"height=400,width=400,top=10,left=10,resizable=yes\");\nalert(wroxWin.opener\
  \ == window); //true\n```\n\n尽管从弹出窗口指向打开它的窗口，但没有反向关系。窗口不会跟踪它们生成的弹出窗口，因此需要由你来跟踪。\n\
  \n某些浏览器（例如 Internet Explorer 8+ 和 Google Chrome）尝试将浏览器中的每个标签页作为单独进程运行。当一个标签页打开另一个标签页时，窗口对象需要能够相互通信，因此标签页不能在单独进程中运行。Chrome\
  \ 允许通过将 `opener` 属性设置为 `null` 来指示新创建的标签页应在单独进程中运行，如下：\n\n```javascript\nvar wroxWin\
  \ =window.open(\"http://www.wrox.com/\",\"wroxWindow\",\n\"height=400,width=400,top=10,left=10,resizable=yes\"\
  );\nwroxWin.opener = null;\n```\n\n\n\n\n\n将 `opener` 设置为 `null` 表示浏览器新创建的标签页不需要与打开它的标签页进行通信，因此它可以在单独进程中运行。一旦这种连接断开，就无法恢复。\n\
  \n## 安全限制\n\n在线广告商曾经历过一段过度使用弹出窗口的时期。弹出窗口通常被伪装成系统对话框，以引导用户点击广告。由于这些弹出网页的样式看起来像系统对话框，用户无法判断该对话框是否合法。为了帮助进行这种判断，浏览器开始对弹出窗口的配置进行限制。\n\
  \nWindows XP Service Pack 2 上的 Internet Explorer 6 对弹出窗口实施了多项安全功能，包括不允许创建弹出窗口或将其移动到屏幕外，并确保状态栏无法关闭。从\
  \ Internet Explorer 7 开始，地址栏无法关闭，且默认情况下弹出窗口不能移动或调整大小。Firefox 1 取消了抑制状态栏的功能，因此无论传递给\
  \ `window.open()` 的特征字符串是什么，所有弹出窗口都必须显示状态栏。Firefox 3 强制在弹出窗口上始终显示地址栏。Opera 仅在其主浏览器窗口内打开弹出窗口，但不允许这些窗口出现在可能与系统对话框混淆的位置。\n\
  \n此外，浏览器只有在用户操作后才允许创建弹出窗口。例如，在页面仍在加载时调用 `window.open()` 将不会执行，并可能向用户显示错误。弹出窗口可能仅根据点击或按键打开。\n\
  \nChrome 使用了不同的方法来处理非用户发起的弹出窗口。它不是阻塞它们，而是只显示弹出窗口的标题栏并将其放在浏览器窗口的右下角。\n\n![image](img/pen.gif)\n\
  \nInternet Explorer 在显示存储在计算机硬盘上的网页时会解除对弹出窗口的一些限制。相同的代码在服务器上运行时，将触发弹出限制。\n\n## 弹出窗口拦截器\n\
  \n大多数浏览器都内置了弹出窗口拦截软件，对于没有内置的浏览器，像 Yahoo! Toolbar 等工具也内置了拦截器。结果是大多数意外的弹出窗口都会被拦截。当弹出窗口被拦截时，会发生两种情况之一。如果浏览器的内置拦截器停止了弹出窗口，那么\
  \ `window.open()` 可能会返回 `null`。在这种情况下，你可以通过检查返回值判断弹出窗口是否被拦截，如下例所示：\n\n```\nvar wroxWin\
  \ = window.open(\"http://www.wrox.com\", \"_blank\");\nif (wroxWin == null){\nalert(\"\
  The popup was blocked!\");\n}\n```\n\n当浏览器插件或其他程序拦截弹出窗口时，`window.open()` 通常会抛出一个错误。因此，为了准确检测弹出窗口何时被拦截，你必须检查返回值并将\
  \ `window.open()` 的调用封装在 `try-catch` 块中，如例所示：\n\n![image](img/logo1.gif)\n\n```\n\
  var blocked = false;\ntry {\nvar wroxWin = window.open(\"http://www.wrox.com\",\
  \ \"_blank\");\nif (wroxWin == null){\nblocked = true;\n}\n} catch (ex){\nblocked\
  \ = true;\n}\nif (blocked){\nalert(\"The popup was blocked!\");\n}\n```\n\nPopupBlockerExample01.htm\n\
  \n此代码可以准确检测弹出窗口拦截器是否拦截了 `window.open()` 的调用，无论使用何种方法。请注意，检测弹出窗口是否被拦截并阻止浏览器显示关于弹出窗口被拦截自身的消息。\n\
  \n## 定时器与超时\n\n浏览器中的 JavaScript 执行是单线程的，但允许通过超时和定时器在特定时间点调度代码运行。超时（Timeout）在指定时间后执行某些代码，而定时器（Intervals）则重复执行代码，并在每次执行之间等待特定的时间。\n\
  \n你使用窗口的 `setTimeout()` 方法设置超时，它接受两个参数：要执行的代码以及在尝试执行该代码之前等待的时间（毫秒计）。第一个参数可以是包含 JavaScript\
  \ 代码的字符串（如在 `eval()` 中那样使用），也可以是一个函数。例如，以下两种方式都会在 1 秒后显示警报：\n\n![image](img/logo1.gif)\n\
  \n```\n//应避免！\nsetTimeout(\"alert('Hello world!') \", 1000);\n//推荐做法\nsetTimeout(function()\
  \ {\nalert(\"Hello world!\");\n}, 1000);\n```\n\nTimeoutExample01.htm\n\n尽管这两个语句都有效，但将字符串作为第一个参数被认为是不良实践，因为它带来了性能开销。\n\
  \n第二个参数（等待的毫秒数）并不意味着指定代码执行的时间。JavaScript 是单线程的，因此一次只能执行一段代码。为了管理执行，有一个 JavaScript\
  \ 任务待执行队列。任务按照它们添加到队列的顺序执行。`setTimeout()` 的第二个参数告诉 JavaScript 引擎在指定的毫秒后将此任务添加到队列中。如果队列为空，则立即执行该代码；如果队列不为空，代码必须轮候。\n\
  \n调用 `setTimeout()` 时，它会返回一个超时的数字 ID。超时 ID 是调度代码的唯一标识符，用于取消超时。要取消挂起的超时，请使用 `clearTimeout()`\
  \ 方法并传入超时 ID，如下例：\n\n```\n//设置超时\nvar timeoutId = setTimeout(function() {\nalert(\"\
  Hello world!\");\n}, 1000);\n//不用了 - 取消\nclearTimeout(timeoutId);\n```\n\nTimeoutExample02.htm\n\
  \n只要在指定时间通过之前调用 `clearTimeout()`，就可以完全超时。在代码执行后调用 `clearTimeout()` 没有效果。\n\n![image](img/pen.gif)\n\
  \n由超时执行的所有代码都在全局作用域运行，因此函数内部的 `this` 值将始终指向 `window`。\n\n定时器的工作方式与超时相同，但它们会在特定间隔重复执行代码，直到被取消。`setInterval()`\
  \ 方法允许你设置定时器，它接受与 `setTimeout()` 相同的参数：要执行的代码（字符串或函数）以及两次执行之间的等待毫秒数。这是一个示例：\n\n\
  ![image](img/logo1.gif)\n\n```\n//应避免！\nsetInterval(\"alert('Hello world!') \",\
  \ 10000);\n//推荐做法\nsetInterval(function() {\nalert(\"Hello world!\");\n}, 10000);\n\
  ```\n\nIntervalExample01.htm\n\n`setInterval()` 方法也返回一个定时器 ID，可以在未来的某个时刻取消定时器。`clearInterval()`\
  \ 方法可以使用此 ID 取消所有挂起的定时器。这种能力对于定时器来说比超时更重要，因为如果不检查，它们将一直执行到页面卸载。这里是一个常见的定时器用法示例：\n\
  \n```\nvar num = 0;\nvar max = 10;\nvar intervalId = null;\nfunction incrementNumber()\
  \ {\nnum++;\n// 如果达到最大值，取消所有挂起的执行\nif (num == max) {\nclearInterval(intervalId);\n\
  alert(\"Done\");\n}\n}\nintervalId = setInterval(incrementNumber, 500);\n```\n\n\
  IntervalExample02.htm\n\n在这个示例中，变量 `num` 每半秒增加一次，直到最终达到最大值，此时取消定时器。这种模式也可以使用超时来实现，如下所示：\n\
  \n```\nvar num = 0;\nvar max = 10;\nfunction incrementNumber() {\nnum++;\n// 如果还没有达到最大值，则设置另一个超时\n\
  if (num < max) {\nsetTimeout(incrementNumber, 500);\n} else {\nalert(\"Done\");\n\
  }\n}\nsetTimeout(incrementNumber, 500);\n```\n\nTimeoutExample03.htm\n\n\n\n\n\n\
  ## 定时 (Timeouts)\n注意，当你使用超时器时，不需要跟踪超时 ID，因为执行会自动停止，只有在设置了另一个超时器时才会继续。这种模式被认为是在不实际使用间隔函数（intervals）的情况下设置间隔的最佳实践。在生产环境中很少使用真正的间隔，因为一个间隔结束与下一个间隔开始之间的时间并不一定保证，且某些间隔可能会被跳过。如前面的示例所示，使用超时器可以确保这种情况不会发生。通常情况下，最好避免使用间隔。\n\
  \n## 系统对话框 (System Dialogs)\n浏览器能够通过 `alert()`、`confirm()` 和 `prompt()` 方法调用系统对话框向用户显示内容。这些对话框与在浏览器中显示的网页无关，且不包含\
  \ HTML。它们的显示由操作系统和/或浏览器设置决定，而不是 CSS。此外，这些对话框每一个都是同步且模态的，这意味着当显示对话框时代码执行会停止，并在其被关闭后恢复。\n\
  \n### alert\n`alert()` 方法在书中一直被使用。它仅接受一个字符串显示给用户。当调用 `alert()` 时，系统消息框会向用户显示指定的文本，随后显示一个\
  \ OK 按钮。例如，在 Windows XP 上使用 Internet Explorer 时，`alert(\"Hello world!\")` 会渲染出图\
  \ 8-3 所示的对话框。\n\nFIGURE 8-3\n\n![image](img/f253-01.jpg)\n\nAlert 对话框通常用于用户必须意识到某些他们无法控制的事情时，例如错误。用户唯一的选择是在阅读消息后关闭对话框。\n\
  \n### confirm\n第二种对话框通过调用 `confirm()` 触发。确认对话框看起来与 alert 对话框相似，因为它向用户显示消息。两者之间的主要区别在于除了\
  \ OK 按钮外还有一个取消按钮，这允许用户指示是否应执行特定操作。例如，`confirm(\"Are you sure?\")` 会显示图 8-4 所示的确认对话框。\n\
  \nFIGURE 8-4\n\n![image](img/f254-01.jpg)\n\n为了确定用户点击的是 OK 还是取消，`confirm()` 方法返回一个布尔值：如果点击\
  \ OK 则返回 `true`，如果点击取消或点击右上角的 X 关闭对话框则返回 `false`。确认对话框的典型用法如下：\n\n```\nif (confirm(\"\
  Are you sure?\")) {\nalert(\"I'm so glad you're sure! \");\n} else {\nalert(\"I'm\
  \ sorry to hear you're not sure. \");\n}\n```\n\n在这个示例中，确认对话框在第一行显示给用户，这是 `if` 语句的条件。如果用户点击\
  \ OK，将显示一个 alert 说：“I'm so glad you're sure!”。然而，如果点击取消按钮，将显示一个 alert 说：“I'm sorry\
  \ to hear you're not sure.” 这种模式通常在用户尝试删除某些内容时（例如电子邮件）采用。\n\n### prompt\n最后一种类型的对话框通过调用\
  \ `prompt()` 显示，它会提示用户输入。除了 OK 和取消按钮外，该对话框还有一个文本框，用户可以在其中输入一些数据。`prompt()` 方法接受两个参数：显示给用户的文本以及文本框的默认值（可以是空字符串）。调用\
  \ `prompt(\"What's your name?\", \"Michael\")` 会导致显示图 8-5 所示的对话框。\n\nFIGURE 8-5\n\
  \n![image](img/f254-02.jpg)\n\n如果点击 OK 按钮，`prompt()` 返回文本框中的值；如果点击取消或在未点击 OK 的情况下关闭对话框，函数将返回\
  \ `null`。这是一个示例：\n\n```\nvar result = prompt(\"What is your name? \", \"\");\nif\
  \ (result !== null) {\nalert(\"Welcome, \" + result);\n}\n```\n\n这些系统对话框对于向用户显示信息和请求确认决策很有帮助。由于它们不需要加载\
  \ HTML、CSS 或 JavaScript，它们是增强 Web 应用程序的快速方便的方法。\n\n## 浏览器特定特性\nChrome 和 Opera 针对这些系统对话框引入了一个特殊功能。如果正在运行的脚本在执行期间产生了两个或多个系统对话框，则从第一个之后的后续对话框都会显示一个复选框，允许用户在页面刷新之前禁用任何后续对话框（参见图\
  \ 8-6）。\n\nFIGURE 8-6\n\n![image](img/f255-01.jpg)\n\n当勾选复选框并关闭对话框后，所有后续系统对话框（alerts、confirms\
  \ 和 prompts）将被阻塞，直到页面刷新。Chrome 没有向开发者指示对话框是否已显示。对话框计数器在浏览器空闲时都会重置，因此如果两个独立的用户操作产生了\
  \ alert，则其中一个都不会显示复选框；如果单个用户操作连续产生两个 alert，第二个将包含该复选框。自从引入以来，此功能已进入了 Internet Explorer\
  \ 9 和 Firefox 4。\n\n另外两种类型的对话框可以通过 JavaScript 显示：find 和 print。这两个对话框都是异步的，会将控制权返回给脚本。\n\
  \n```\n//显示打印对话框\nwindow.print();\n//显示查找对话框\nwindow.find();\n```\n\n这两个方法无法指示用户是否进行了任何操作，因此很难有效利用。此外，由于它们是异步的，它们不会增加\
  \ Chrome 的对话框计数，也不会受用户禁用对话框的影响。\n\n## location 对象\n最常用的 BOM 对象之一是 `location`，它提供了关于当前加载文档的信息以及通用的导航功能。`location`\
  \ 对象的独特之处在于它是 window 和 document 的属性；`window.location` 和 `document.location` 指向同一个对象。`location`\
  \ 不仅了解当前加载的文档，还将 URL 解析为离散部分，可以通过一系列属性进行访问。这些属性列在下表中（假设带有 location 前缀）。\n\n| 属性名称\
  \ | 示例 | 描述 |\n| --- | --- | --- |\n| `hash` | `#contents` | URL 哈希（井号后跟零或多个字符），如果\
  \ URL 没有哈希则返回空字符串。 |\n| `host` | `www.wrox.com:80` | 服务器名称和端口号（如果存在）。 |\n| `hostname`\
  \ | `www.wrox.com` | 不带端口的服务器名称。 |\n| `href` | `http://www.wrox.com` | 当前加载页面的完整\
  \ URL。`location` 的 `toString()` 方法返回此值。 |\n| `pathname` | `/WileyCDA/` | URL 的目录和/文件名。\
  \ |\n| `port` | `8080` | URL 中指定的请求端口号。如果 URL 不包含端口，则该属性返回空字符串。 |\n| `protocol`\
  \ | `http:` | 页面使用的协议。通常为 \"http:\" 或 \"https:\"。 |\n| `search` | `?q=javascript`\
  \ | URL 的查询字符串。它返回一个以问号开头的字符串。 |\n\n\n\n\n\n`location` 中的大部分信息都可以通过这些属性轻松获取。URL\
  \ 中未提供的唯一部分是易于使用的查询字符串。虽然 `location.search` 返回从问号到 URL 末尾的所有内容，但无法直接逐个地访问查询字符串参数。以下函数\
  \ `getQueryStringArgs()` 解析查询字符串并返回一个包含每个参数条目的对象：\n\n![image](img/logo1.gif)\n\n\
  ```\nfunction getQueryStringArgs(){\n//获取不带初始 ? 的查询字符串\nvar qs = (location.search.length\
  \ > 0 ? location.search.substring(1) : \"\"),\n//用于存储数据的对象\nargs = {},\n//获取单个条目\n\
  items = qs.length ? qs.split(\"&\") : [],\nitem = null,\nname = null,\nvalue = null,\n\
  //用于 for 循环\ni = 0,\nlen = items.length;\n//将每个项分配到 args 对象中\nfor (i=0; i < len;\
  \ i++){\nitem = items[i].split(\"=\");\nname = decodeURIComponent(item[0]);\nvalue\
  \ = decodeURIComponent(item[1]);\nif (name.length) {\nargs[name] = value;\n}\n}\n\
  return args;\n}\n```\n\nLocationExample01.htm\n\n该函数的第一步是删除查询字符串开头的问号。这仅在 `location.search`\
  \ 包含一个或多个字符时发生。参数将存储在使用对象字面量格式创建的 `args` 对象中。接下来，使用 `&` 字符分割查询字符串，返回一个格式为 `name=value`\
  \ 的字符串数组。`for` 循环遍历此数组，然后根据等号分割每个项，返回一个数组，其中第一个项是参数的名称，第二个项是值。名称和值均使用 `decodeURIComponent()`\
  \ 进行解码（因为查询字符串参数应该是经过编码的）。最后，将名称分配为 `args` 对象上的一个属性，并将其值设置为 `value`。该函数的用法如下：\n\n\
  ```\n//假设查询字符串为 ?q=javascript&num=10\nvar args = getQueryStringArgs();\nalert(args[\"\
  q\"]); //\"javascript\"\nalert(args[\"num\"]); //\"10\"\n```\n\n现在，每个查询字符串参数都是返回对象上的一个属性，这提供了快速访问每个参数的途径。\n\
  \n## 操作 Location\n\n可以使用 `location` 对象以多种方式更改浏览器位置。第一种最常用的方法是使用 `assign()` 方法并传入\
  \ URL，如下例所示：\n\n```\nlocation.assign(\"http://www.wrox.com\");\n```\n\n这会立即开始导航到新\
  \ URL 的过程，并在浏览器历史栈中创建一个记录。如果将 `location.href` 或 `window.location` 设置为 URL，则使用该值调用\
  \ `assign()`。例如，以下两种操作与显式调用 `assign()`的效果相同：\n\n```\nwindow.location = \"http://www.wrox.com\"\
  ;\nlocation.href = \"http://www.wrox.com\";\n```\n\n在更改浏览器位置的三种方法，设置 `location.href`\
  \ 在代码中最常见。\n\n更改 `location` 对象上的各种属性也可以修改当前加载的页面。`hash`、`search`、`hostname`、`pathname`\
  \ 和 `port` 属性可以设置为新值以更改当前 URL，如下例：\n\n```\n//假设起始于 http://www.wrox.com/WileyCDA/\n\
  //将 URL 改为 \"http://www.wrox.com/WileyCDA/#section1\"\nlocation.hash = \"#section1\"\
  ;\n//将 URL 改为 \"http://www.wrox.com/WileyCDA/?q=javascript\"\nlocation.search =\
  \ \"?q=javascript\";\n//将 URL 改为 \"http://www.yahoo.com/WileyCDA/\"\nlocation.hostname\
  \ = \"www.yahoo.com\";\n//将 URL 改为 \"http://www.yahoo.com/mydir/\"\nlocation.pathname\
  \ = \"mydir\";\n//将 URL 改为 \"http://www.yahoo.com:8080/WileyCDA/\n```\n\n每当更改 `location`\
  \ 上的属性时（`hash` 除外），页面都会使用新 URL 重新加载。\n\n![image](img/pen.gif)\n\n更改 `hash` 的值会导致\
  \ Internet Explorer 8+、Firefox 2+、Safari 2+、Opera 9+ 和 Chrome 在浏览器历史中记录新条目。在较早的\
  \ Internet Explorer 版本中，`hash` 属性并不是在点击“后退”或“前进”时更新，只有在点击包含哈希 URL 的链接时才会更新。\n\n\
  当使用上述任一方法更改 URL 时，浏览器历史栈中会创建一个条目，使用户可以点击“后退”按钮返回上一个页面。可以使用 `replace()` 方法禁止这种行为。该方法接受一个参数（即要导航到的\
  \ URL），但不会在历史栈中创建条目。调用 `replace()` 后，用户无法返回上一个页面。考虑此示例：\n\n![image](img/logo1.gif)\n\
  \n```\n<!DOCTYPE html>\n<html>\n<head>\n<title>你将无法回到这里了</title>\n</head>\n<body>\n\
  <p>请享受这个页面一秒钟，因为你再也回不去这里了。</p>\n<script type=\"text/javascript\">\nsetTimeout(function\
  \ () {\nlocation.replace(\"http://www.google.com/\");\n}, 1000);\n</script>\n</body>\n\
  </html>\n```\nLocationReplace01.\n\n如果加载此页面，它将无法后退。`location` 的最后一个方法是 `reload()`，它会重新加载当前页面。当无参数调用\
  \ `reload()` 时，它以最有效的方式重新加载。要从服务器重新加载，请传入 `true` 参数，如下所示：\n\n```\nlocation.reload();\
  \ // 可能来自缓存\nlocation.reload(true); // 来自服务器\n```\n\n## navigator 对象\n\n最初于 Netscape\
  \ Navigator 2 的 `navigator` 对象是客户端浏览器识别的标准。虽然某些浏览器提供了相同或类似的替代方法（例如 Internet Explorer\
  \ 中的 `window.clientInformation` 和 Opera 中的 `window.opera`），但 `navigator` 对象在所有启用\
  \ JavaScript 的浏览器中都是通用。与其他 BOM 对象一样，每个浏览器支持自己的属性集。下表列出了每个属性和方法以及对应的浏览器。\n\n![image](img/f259-01.jpg)\n\
  \n![image](img/f260-01.jpg)\n\n![image](img/f261-01.jpg)\n\n`navigator` 对象的属性通常用于确定运行页面的类型。\n\
  \n## 检测插件\n\n常见的检测程序之一是确定浏览器是否安装了特定的插件。对于 Internet Explorer 以外的浏览器，可以使用 `plugins`\
  \ 数组确定。数组中的每个项包含以下属性：\n\n*   `name` — 插件的名称\n*   `description` — 插件的描述\n*   `filename`\
  \ — 插件的文件名\n*   `length` — 由该插件处理的 MIME 类型数量\n\n通常，名称包含了标识插件所需的所有信息，尽管这并不是一门精确的科学。插件检测通过遍历可用插件并将插件的名称与给定的名称进行比较来实现，如下例所示：\n\
  \n![image](img/logo1.gif)\n\n```\n//插件检测 - 在 Internet Explorer 中不起\nfunction hasPlugin(name){\n\
  name = name.toLowerCase();\nfor (var i=0; i < navigator.plugins.length; i++){\n\
  if (navigator.plugins[i].name.toLowerCase().indexOf(name) > -1){\nreturn true;\n\
  }\n}\nreturn false;\n}\n//检测 flash\nalert(hasPlugin(\"Flash\"));\n//检测 quicktime\n\
  alert(hasPlugin(\"QuickTime\"));\n```\n\n\n\n\n`hasPlugin()` 示例接受一个参数：要检测的插件名称。第一步是将该名称转换为小写，以便于比较。接下来，遍历\
  \ `plugins` 数组，并通过 `indexOf()` 检查每个 `name` 属性，以查看传入的名称是否出现在该字符串的某个位置。此比较在全小写状态下进行，以避免大小写错误。参数应尽可能具体，以避免混淆。诸如\
  \ \"Flash\" 和 \"QuickTime\" 这样的字符串足够独特，应该产生什么混淆。此方法适用于检测 Firefox、Safari、Opera 和\
  \ Chrome 中的插件。\n\n![image](img/pen.gif)\n\n每个插件对象也是一个 `MimeType` 对象的数组，可以使用括号符号访问。每个\
  \ `MimeType` 对象有四个属性：`description`，对 MIME 类型的描述；`enabledPlugin`，指向回插件对象的指针；`suffixes`，该\
  \ MIME 类型文件扩展名的用逗号分隔的字符串；以及 `type`，完整的 MIME 类型字符串。\n\n在 Internet Explorer 中检测插件要棘手得多，因为它不支持\
  \ Netscape 风格的插件。在 Internet Explorer 中检测插件的唯一方法是使用专有的 `ActiveXObject` 类型并尝试实例化特定的插件。插件在\
  \ Internet Explorer 中使用 `COM` 对象实现，这些对象通过唯一字符串标识。因此，要检查特定插件，你必须知道它的 COM 标识符。例如，Flash\
  \ 的标识符是 \"ShockwaveFlash.ShockwaveFlash\"。有了这些信息，你可以编写一个函数来判断 Internet Explorer\
  \ 是否安装了该插件，如下：\n\n![image](img/logo1.gif)\n\n```javascript\n//plugin detection for\
  \ Internet Explorer\nfunction hasIEPlugin(name){\ntry {\nnew ActiveXObject(name);\n\
  return true;\n} catch (ex){\nreturn false;\n}\n}\n//detect flash\nalert(hasIEPlugin(\"\
  ShockwaveFlash.ShockwaveFlash\"));\n//detect quicktime\nalert(hasIEPlugin(\"QuickTime.QuickTime\"\
  ));\n```\n\n### PluginDetectionExample02.htm\n\n在此示例中，`hasIEPlugin()` 函数接受 COM 标识符作为唯一参数。在函数内部，尝试创建一个新的\
  \ `ActiveXObject` 实例。这封装在一个 `try-catch` 语句中，因为尝试创建未知 COM 对象将抛出错误。因此，如果尝试成功，函数返回\
  \ `true`。如果发生错误，则执行 `catch` 块并返回 `false`。该代码随后检查 Internet Explorer 中是否有可用 Flash\
  \ 和 QuickTime 插件。\n\n由于这两种插件检测方法如此不同，通常会创建测试特定插件的函数，而不是使用之前描述的通用方法。考虑这个示例：\n\n```javascript\n\
  //detect flash for all browsers\nfunction hasFlash(){\nvar result = hasPlugin(\"\
  Flash\");\nif (!result){\nresult = hasIEPlugin(\"ShockwaveFlash.ShockwaveFlash\"\
  );\n}\nreturn result;\n}\n//detect quicktime for all browsers\nfunction hasQuickTime(){\n\
  var result = hasPlugin(\"QuickTime\");\nif (!result){\nresult = hasIEPlugin(\"QuickTime.QuickTime\"\
  );\n}\nreturn result;\n}\n//detect flash\nalert(hasFlash());\n//detect quicktime\n\
  alert(hasQuickTime());\n```\n\n### PluginDetectionExample03.htm\n\n此代码定义了两个函数：`hasFlash()`\
  \ 和 `hasQuickTime()`。每个函数首先尝试使用非 Internet Explorer 的插件检测代码。如果该方法返回 `false`（对于 Internet\
  \ Explorer 来说确实如此），则会调用 Internet Explorer 插件检测方法。如果 Internet Explorer 插件检测方法也返回\
  \ `false`，则整个方法的结果为 `false`。如果任一插件检测函数返回 `true`，则整个方法返回 `true`。\n\n![image](img/pen.gif)\n\
  \n`plugins` 集合有一个名为 `refresh()` 的方法，它可以刷新插件以反映任何新安装的插件。该方法接受一个参数：一个指示是否应重新加载的 `Boolean`\
  \ 值。当设置为 `true` 时，所有包含插件的页面都将重新加载；否则，更新 `plugins` 集合，但页面不会重新加载。\n\n## 注册处理器\n\n\
  Firefox 2 在 `navigator` 对象中引入了 `registerContentHandler()` 和 `registerProtocolHandler()`\
  \ 方法。（这些方法现在正式定义在 HTML 5 中。）这些方法允许网站表明其能够处理特定类型的信息。随着在线 RSS 阅读器和在线电子邮件应用程序的兴起，这是这些应用程序被默认使用的方式，就像桌面应用程序被使用一样。\n\
  \n`registerContentHandler()` 方法接受三个参数：要处理的 MIME 类型、处理该 MIME 类型的页面 URL 以及应用程序名称。例如，要将一个站点注册为\
  \ RSS 馈的处理器，可以使用以下代码：\n\n```javascript\nnavigator.registerContentHandler(\"application/rss+xml\"\
  ,\n\"http://www.somereader.com?feed=%s\", \"Some Reader\");\n```\n\n第一个参数是 RSS 馈的\
  \ MIME 类型。第二个参数是应该接收 RSS 馈 URL 的 URL。在第二个参数中，`%s` 代表 RSS 馈的 URL，由浏览器自动插入。当下一次请求\
  \ RSS 馈时，浏览器将导航到指定的 URL，Web 应用程序可以以适当的方式处理请求。\n\n![image](img/pen.gif)\n\nFirefox\
  \ 直到第 4 版本仅允许在 `registerContentHandler()` 使用三种 MIME 类型：\"application/rss+xml\"、\"\
  application/atom+xml\" 和 \"application/.feed\"。它们的作用相同：为所有 RSS 馈注册处理器。\n\n可以使用 `registerProtocolHandler()`\
  \ 进行类似的调用，它也接受三个参数：要处理的协议（例如 \"mailto\" 或 \"ftp\"）、处理该协议的页面 URL 以及应用程序名称。例如，为了将\
  \ Web 注册为默认邮件客户端，可以使用：\n\n```javascript\nnavigator.registerProtocolHandler(\"mailto\"\
  ,\n\"http://www.somemailclient.com?cmd=%s\", \"Some Mail Client\");\n```\n\n在此示例中，为\
  \ `mailto` 协议注册了一个处理器，它现在将指向 Web 电子邮件客户端。再次，第二个参数是应该处理请求的 URL，而 `%s` 代表原始请求。\n\n\
  ![image](img/pen.gif)\n\n在 Firefox 2 中，`registerProtocolHandler()` 已实现但不起作用。Firefox\
  \ 3 完整实现了该方法。\n\n## screen 对象\n\n`screen` 对象（也是 `window` 的属性）是少数几乎没有程序化用途的 JavaScript\
  \ 对象之一；它纯粹作为客户端能力的指示。此对象提供了浏览器窗口之外显示的信息，包括像素宽度和高度等信息。每个浏览器为 `screen` 对象提供不同的属性。下表指示了属性以及哪些浏览器支持它们。\n\
  \n![image](img/f266-01.jpg)\n\n这些信息通常由测量能力的站点跟踪工具聚合，但通常不会用于影响功能。这些信息有时用于调整浏览器以占据屏幕上的可用空间，如下：\n\
  \n```javascript\nwindow.resizeTo(screen.availWidth, screen.availHeight);\n```\n\n\
  如所述，许多浏览器禁用了调整浏览器窗口的功能，因此此代码在所有情况下可能无法工作。\n\n移动设备在屏幕维度方面的行为略有不同。运行 iOS 的设备将始终返回由于设备处于竖持模式的维度（1024\
  \ × 768）。相反，Android 设备会正确调整 `screen.width` 和 `screen.height` 的值。\n\nThe history\
  \ 对象\n\n\n\n\n\n`history` 对象表示自给定的窗口首次使用以来用户的导航历史。由于 `history` 是 `window` 的一个属性，因此每个浏览器窗口、标签页和框架（frame）都有它们自己的\
  \ `history` 对象，该对象专门与该窗口对象相关。出于安全考虑，无法确定用户访问过的 URL。但是，可以在不确定具体 URL 的情况下，在用户访问过的列表中向后或向后导航。\n\
  \n`go()` 方法可以在两个方向（后或向前）在用户的历史中进行导航。该方法接受单个参数，该参数是一个表示向后或向前移动的页数。负数在历史中向后移动（类似于点击浏览器的“后退”按钮），正数则向后移动（类似于点击浏览器的“前进”按钮）。以下是一个示例：\n\
  \n```\n//go back one page\nhistory.go(-1);\n//go forward one page\nhistory.go(1);\n\
  //go forward two pages\nhistory.go(2);\n```\n\n`go()` 方法的参数也可以是字符串，在这种情况下，浏览器将导航到历史中包含给定字符串的第一个位置。最近的位置可能是向后，也可能是向前。如果历史中没有匹配字符串的记录，则该方法将不执行任何操作，例如：\n\
  \n```\n//go to nearest wrox.com page\nhistory.go(\"wrox.com\");\n//go to nearest\
  \ nczonline.net page\nhistory.go(\"nczonline.net\");\n```\n\n可以使用两个快捷方法 `back()`\
  \ 和 `forward()` 来代替 `go()`。正如你预期的那样，它们模拟了浏览器的“后退”和“前进”按钮，如下：\n\n```\n//go back one\
  \ page\nhistory.back();\n//go forward one page\nhistory.forward();\n```\n\n`history`\
  \ 对象还有一个属性 `length`，指示历史栈中有多少个项目。该属性反映了历史栈中的所有项目，包括向后和向前的项目。对于首次加载到窗口、标签页或框架的第一个页面，`history.length`\
  \ 等于 `0`。通过像这里这样测试此值，可以确定用户的起点是否是你的页面：\n\n```\nif (history.length == 0){\n//this\
  \ is the first page in the user's window\n}\n```\n\n虽然并不经常使用，但历史对象通常用于创建自定义的“后退”和“前进”按钮，并判断该页面是否是用户历史中的第一个。HTML5\
  \ 进一步增强了历史对象。更多信息请参见第 16 章。\n\n![image](img/pen.gif)\n\n每当页面 URL 发生时，历史栈就会记录。对于\
  \ Internet Explorer 8+、Opera、Firefox、Safari 3+ 以及 Chrome，这包括 URL 哈 的更改（因此，设置 `location.hash`\
  \ 会导致这些浏览器在历史栈中插入新记录）。\n\n# 总结\n\n浏览器对象模型 (BOM) 基于 `window` 对象，该对象表示浏览器窗口和可见页面区域。`window`\
  \ 对象兼作 ECMAScript 全局对象，因此所有全局变量和函数都成为它的属性，并且所有原生构造函数和函数最初都存在于。本章讨论了 BOM 的以下元素：\n\
  \n*   使用框架时，每个框架都有它自己的 `window` 对象以及所有原生构造函数和函数的副本。每个框架都存储在 `frames` 集合中，同时通过位置和名称进行索引。\n\
  *   要引用其他框架（包括父框架），有几个 `window` 指针。\n*   `top` 对象始终指向最外层的框架，它代表整个浏览器窗口。\n*   `parent`\
  \ 对象表示包含它的框架，而 `self` 指回 `window`。\n*   `location` 对象允许程序化访问浏览器的导航系统。通过设置属性，可以逐部分或一次性地更改浏览器的\
  \ URL。\n*   `replace()` 方法允许导航到新 URL，并替换浏览器历史中当前显示的页面。\n*   `navigator` 对象提供了有关浏览器的信息。提供的信息类型很大程度上取决于正在使用的浏览器，尽管某些常用属性（如\
  \ `userAgent`）在所有浏览器中都可用。\n\nBOM 中提供的其他两个对象的功能非常有限。`screen` 对象提供有关客户端显示的信息。这些信息通常用于网站的指标收集。`history`\
  \ 对象提供了对浏览器历史栈的有限窥视，允许开发者确定历史栈中有多少个网站，并赋予他们向后或向前移动到历史中任何页面的能力。\n\n# 第 9 章：客户端检测\n\
  \n## 本章包含什么？\n\n*   使用能力检测\n*   用户-agent 检测的历史\n*   何时使用每种检测类型\n\n尽管浏览器厂商已努力实现通用接口，但事实仍然是每个浏览器都呈现出自己的功能和缺陷。跨平台提供的浏览器通常会有不同的问题，即使它们在技术上版本相同。这些差异迫使\
  \ Web 开发人员要么为最低标准进行设计，或者更常见的是使用各种客户端检测方法来处理或绕过局限性。\n\n客户端检测仍然 Web 开发中最具争议的话题之一。浏览器应该支持一组通用功能的想法贯穿于关于该主题的大多数对话。在理想世界中，情况应该是这样的。但在现实中，浏览器的差异和异常之多使得客户端检测不仅是一个事后考虑的问题，而且是开发策略中至关重要部分。有多种方法可以确定所使用的\
  \ Web 客户端，每种方法都有优缺点。重要的是要理解，客户端检测应该是解决问题的最后一步；当有更通用的解决方案时，应使用该解决方案。\n\n## 能力检测 (Capability\
  \ Detection)\n\n最常用且广泛接受的客户端检测形式是能力检测。能力检测（也称为功能检测）的目的不是识别特定的浏览器，而是识别浏览器的能力。这种方法假设不需要特定的浏览器知识，通过确定问题的属性是否存在来找到解决方案。能力检测的基本模式如下：\n\
  \n```\nif (object.propertyInQuestion){\n//use object.propertyInQuestion\n}\n```\n\
  \n例如，在 Internet Explorer 5 之前，DOM 方法 `document.getElementById()` 并不存在。该方法在早期版本中不存在，尽管可以使用非标准的\
  \ `document.all` 属性实现相同的功能。这导致了如下能力检测分支：\n\n```\nfunction getElement(id){\n  if\
  \ (document.getElementById){\n    return document.getElementById(id);\n  } else\
  \ if (document.all){\n    return document.all[id];\n  } else {\n    throw new Error(\"\
  No way to retrieve element!\");\n  }\n}\n```\n\n`getElement()` 函数的目的是返回给定 ID 的元素。由于\
  \ `document.getElementById()` 是实现此目的的标准方法，因此对其进行测试。如果函数存在（未定义），则使用它。否则，检查 `document.all`\
  \ 是否可用，如果是则使用它。如果两种方法都不可用（这极罕见），则抛出异常以指示该函数无法工作。\n\n能力检测中需要理解两个重要的概念。正如刚才提到的，应该首先测试实现结果的最常见方法。之前的示例中，这意味着在测试\
  \ `document.all` 之前先测试 `document.getElementById()`。测试最常见的解决方案可以确保在常见情况下避免多次条件测试，从而获得最佳执行效率。\n\
  \n\n\n\n\n第二个重要的概念是，你必须针对你想要使用的精确功能进行测试。仅仅因为某个功能存在，并不意味着另一个功能也存在。考虑以下示例：\n\n```javascript\n\
  function getWindowWidth(){\nif (document.all){ //假设为 IE\nreturn document.documentElement.clientWidth;\
  \ //错误用法!!!\n} else {\nreturn window.innerWidth;\n}\n}\n```\n\n这个示例展示了能力检测的错误用法。`getWindowWidth()`\
  \ 函数首先检查 `document.all` 是否存在。它确实存在，因此函数返回了 `document.documentElement.clientWidth`。正如第\
  \ 8 章所讨论，Internet Explorer 8 及更早版本不支持 `window.innerWidth` 属性。这段代码中的问题在于，对 `document.all`\
  \ 的测试并不一定意味着浏览器是 Internet Explorer。事实上，它可能是 Opera 的早期版本，该版本支持 `document.all` 和 `window.innerWidth`。\n\
  \n### 更安全的能力检测\n\n当你不仅验证功能是否存在，还验证该功能是否可能以适当的方式行为时，能力检测最为有效。前一节中的示例依赖于对被测试对象的成员进行类型转换，以判断其是否存在。虽然这可以告诉你该对象的成员是否存在，但无法表明该成员是否是你预期的那一个。考虑以下函数，它尝试判断一个对象是否可排序的：\n\
  \n```javascript\n// 避免！错误的能力检测 - 仅检查是否存在\nfunction isSortable(object){\nreturn !!object.sort;\n\
  }\n```\n\n该函数尝试通过检查 `sort()` 方法是否存在来判断一个对象是否可以被排序。问题是，任何带有 `sort` 属性的对象都会返回 `true`：\n\
  \n```javascript\nvar result = isSortable({ sort: true });\n```\n\n仅仅测试属性是否存在并不能确定性地表明该对象是可排序的。更好的方法是检查\
  \ `sort` 实际上是一个函数：\n\n```javascript\n// 更好 - 检查 sort 是否为函数\nfunction isSortable(object){\n\
  \ return typeof object.sort == \"function\";\n}\n```\n\n这段代码中使用了 `typeof` 运算符来确定\
  \ `sort` 确实是一个函数，因此可以调用它来对包含的数据进行排序。\n\n尽可能优先使用 `typeof` 进行能力检测，但它并不是万无一的。特别是宿主对象（host\
  \ objects），并没有义务为 `typeof` 返回合理的值。最极端的例子发生在 Internet Explorer 中。在大多数浏览器中，如果 `document.createElement()`\
  \ 存在，以下代码将返回 `true`：\n\n```javascript\n// 在 Internet Explorer <= 8 中无法正常工作\nfunction\
  \ hasCreateElement(){\nreturn typeof document.createElement == \"function\";\n}\n\
  ```\n\n在 Internet Explorer 8 及更早版本中，该函数返回 `false`，因为 `typeof document.createElement`\
  \ 返回 \"object\" 而不是 \"function\"。如之前提到的，DOM 对象是宿主对象，而在 Internet Explorer 8 及更早版本中，宿主对象是通过\
  \ COM 而不是 JScript 实现的。因此，实际函数 `document.createElement()` 被实现为一个 COM 对象，此时 `typeof`\
  \ 返回 \"object\"。Internet Explorer 9 为 DOM 方法正确地返回了 \"function\"。\n\nInternet Explorer\
  \ 还有其他一些使用 `typeof` 行为不符合预期的例子。ActiveX 对象（仅在 Internet Explorer 中支持）与其他与其他完全不同。例如，在不使用\
  \ `typeof` 的情况下测试属性可能会导致错误，如这段代码所示：\n\n```javascript\n// 在 Internet Explorer 中会导致错误\n\
  var xhr = new ActiveXObject(\"Microsoft.XMLHttp\");\nif (xhr.open){ //此处发生错误\n//执行某些操作\n\
  }\n```\n\n仅仅将函数作为属性访问（如此示例所示）会导致 JavaScript 错误。使用 `typeof` 会更安全；然而，Internet Explorer\
  \ 对 `typeof xhr.open` 返回 \"unknown\"。这意味着在浏览器环境中测试任何对象上函数存在的最完整方法是类似于此函数的：\n\n```javascript\n\
  // 归功：Peter Michaux\nfunction isHostMethod(object, property) {\nvar t = typeof object[property];\n\
  return t=='function' ||\n(!!(t=='object' && object[property])) ||\nt=='unknown';\n\
  }\n```\n\n你可以如下如下使用该函数：\n\n```javascript\nresult = isHostMethod(xhr, \"open\");\
  \ //true\nresult = isHostMethod(xhr, \"foo\"); //false\n```\n\n在了解浏览器特殊性的前提下，`isHostMethod()`\
  \ 函数是目前最安全的用法。请注意，宿主对象没有义务维护其当前的实现细节，或模拟已有的宿主对象行为。由于由于，如果实现发生变化，无法保证此函数或任何其他函数将保持准确。作为开发者，你必须根据尝试实现的功能来评估你的风险承受能力。\n\
  \n![image](img/pen.gif)\n\n有关 JavaScript 能力检测细节的详细讨论，请参阅 Peter Michaux 的文章“Feature\
  \ Detection: State of the Art Browser Scripting”，位于 [`peter.michaux.ca/articles/feature-detection-state-of-the-art-browser-scripting`](http://peter.michaux.ca/articles/feature-detection-state-of-the-art-browser-scripting)。\n\
  \n### 能力检测不是浏览器检测\n\n检测特定的能力或一组能力并不一定意味着正在使用的浏览器。在许多网站上可以找到以下“浏览器检测”代码或类似代码，它们是不当能力检测的示例：\n\
  \n```javascript\n// 避免！不够具体\nvar isFirefox = !!(navigator.vendor && navigator.vendorSub);\n\
  // 避免！假设过多\nvar isIE = !!(document.all && document.uniqueID);\n```\n\n这段代码代表了能力检测的典型误用。过去，可以通过检查\
  \ `navigator.vendor` 和 `navigator.vendorSub` 来判断 Firefox，但随后 Safari 的出现并实现了相同的属性，这意味着这段代码会产生假阳性。为了检测\
  \ Internet Explorer，代码检查了 `document.all` 和 `document.uniqueID` 是否存在。这假设这两个属性在 IE\
  \ 的未来版本中继续存在，并且永远不会被其他浏览器实现。这两个检查都使用了双非运算符来产生布尔结果（这在存储和访问时更优）。\n\n然而，将能力归类为浏览器类是合适的。如果你的应用程序需要特定的浏览器功能，一次性对所有能力检测可能比重复检测更有用。考虑以下示例：\n\
  \n![image](img/logo1.gif)\n\n```javascript\n// 判断浏览器是否具有 Netscape 风格的插件\nvar hasNSPlugins\
  \ = !!(navigator.plugins && navigator.plugins.length);\n// 判断浏览器是否具备基础 DOM Level\
  \ 1 能力\nvar hasDOM1 = !!(document.getElementById && document.createElement &&\n\
  document.getElementsByTagName);\n```\n\nCapabilitiesDetectionExample01.htm\n\n能力检测应仅用于确定解决方案的下一步，而不是作为指示特定浏览器的标记。\n\
  \n### 兼容模式检测\n\n\n\n\n\n与能力检测（capability detection）类似，特性检测（quirks detection）旨在识别浏览器的特定行为。然而，特性检测并不是寻找被支持的功能，而是尝试找出哪些功能没有正常工作（“quirk”实际上的意思是“bug”）。这通常涉及运行一段短代码来确定某个功能未正常运行。例如，Internet\
  \ Explorer 8 及更早版本中的一个 bug 会导致与 `Enumerable` 属性设置为 `false` 的原型属性具有同名的实例属性不会在 `for-in`\
  \ 循环中出现。这种特性可以使用以下代码进行测试：\n\n![image](img/logo1.gif)\n\n```\nvar hasDontEnumQuirk\
  \ = function(){\nvar o = { toString : function(){} };\nfor (var prop in o){\nif\
  \ (prop == \"toString\"){\nreturn false;\n}\n}\nreturn true;\n}();\n```\n\n`QuirksDetectionExample01.htm`\n\
  \n这段代码使用匿名函数来测试该特性。创建了一个定义了 `toString()` 方法的对象。在适当的 ECMAScript 实现中，`toString` 应该作为一个属性在\
  \ `for-in` 循环中返回。\n\n另一个常用的测试特性是 Safari 3 之前的版本会对阴影属性（shadowed properties）进行枚举。可以通过以下方式测试：\n\
  \n```\nvar hasEnumShadowsQuirk = function(){\nvar o = { toString : function(){}\
  \ };\nvar count = 0;\nfor (var prop in o){\nif (prop == \"toString\"){\ncount++;\n\
  }\n}\nreturn (count > 1);\n}();\n```\n\n`QuirksDetectionExample01.htm`\n\n如果浏览器具有此特性，则带有自定义\
  \ `toString()` 方法的对象将导致 `for-in` 循环中出现两个 `toString` 实例。\n\n特性通常是浏览器特有的，并且通常被视为在后续版本中可能修复也可能不的\
  \ bug。由于特性检测需要运行代码，建议只测试对你直接影响的特性，并在脚本开始时进行测试以尽早完成工作。\n\n## User-Agent 检测\n\n第三种也是最有争议的客户端检测方法称为\
  \ user-agent 检测（用户代理代理检测）。user-agent 检测使用浏览器的 user-agent 字符串来确定正在使用的精确浏览器。user-agent\
  \ 字符串作为每个 HTTP 请求的响应头发送，并通过 `navigator.userAgent` 在 JavaScript 中访问。在服务器端，查看 user-agent\
  \ 字符串以确定使用的浏览器并采取相应行动是一种常见且被接受的做法。然而，在客户端，user-agent 检测通常被认为是当能力检测和/或特性检测无法使用时的最后手段。\n\
  \nuser-agent 字符串的争议性方面之一是其悠久的伪造历史，即浏览器试图通过在其 user-agent 字符串中包含错误或误导性信息来欺骗服务器。为了理解这个问题，有必要回溯\
  \ Web 首次出现以来 user-agent 字符串是如何演变的。\n\n## 历史\n\nHTTP 规范（1.0 和 1.1 版本）均指出浏览器应该发送指定浏览器名称和版本的简短\
  \ user-agent 字符串。`RFC 2616`（HTTP 1.1 协议规范）是这样描述 user-agent 字符串：\n\n产品令牌（Product\
  \ tokens）用于允许通信应用程序通过软件名称和版本来识别其自身。大多数使用产品令牌的字段还允许列出构成应用程序重要组成部分的子产品，并用空格分隔。按照惯例，产品按照它们对识别应用程序的重要性顺序进行列出。\n\
  \n规范进一步规定，user-agent 字符串应以 `token/product version` 的形式作为产品列表指定。然而，实际上，user-agent\
  \ 字符串从未那么简单。\n\n## 早期浏览器\n\n第一个网络浏览器 `Mosaic` 于 1993 年由国家超级计算机应用中心（NCSA）发布。它的 user-agent\
  \ 字符串相当简单，格式如下：\n\n```\nMosaic/0.9\n```\n\n虽然这会根据操作系统和平台而异，但基本格式是简单直接的。斜杠之前的文本表示产品名称（有时显示为\
  \ NCSA Mosaic 或其他衍生版本），斜杠后的文本是产品版本。\n\n当 Netscape Communications 开始开发其网络浏览器时，其代号为\
  \ `Mozilla`（“Mosaic 杀手”的缩写）。Netscape Navigator 2 是第一个公开版本，其 user-agent 字符串格式如下：\n\
  \n```\nMozilla/Version [Language] (Platform; Encryption)\n```\n\nNetscape 延续了将产品名称和版本作为\
  \ user-agent 字符串第一部分的传统，之后添加了以下信息：\n\n*   Language（语言）——指示应用程序预期用途的语言代码。\n*   Platform（平台）——运行应用程序的操作系统和/或平台。\n\
  *   Encryption（加密）——包含的安全加密类型。可能的值有 `U`（128 位加密）、`I`（40 位加密）和 `N`（无加密）。\n\nNetscape\
  \ Navigator 2 的典型 user-agent 字符串如下：\n\n```\nMozilla/2.02 [fr] (WinNT; I)\n```\n\n\
  该字符串表示正在使用 Netscape Navigator 2.02，它是为法语国家编译的，并在带有 40 位加密的 Windows NT 上运行。在当时，通过查看\
  \ user-agent 字符串中的产品名称来确定使用的浏览器是非常容易。\n\n### Netscape Navigator 3 和 Internet Explorer\
  \ 3\n\n1996 年，Netscape Navigator 3 发布并成为最流行的浏览器，超越了 Mosaic。user-agent 字符串只经历了微小的变化，删除了语言令牌并允许包含有关操作系统或\
  \ CPU 的可选信息。格式变为：\n\n```\nMozilla/Version (Platform; Encryption [ OS OSor-CPU description])\n\
  ```\n\n在 Windows 系统上运行的 Netscape Navigator 3 的典型 user-agent 字符串如下：\n\n```\nMozilla/3.0\
  \ (Win95; U)\n```\n\n该字符串表示 Netscape Navigator 3 运行在 Windows 95 上，并带有 128 位加密。注意，在\
  \ Windows 上运行时省略了 OS 描述。\n\n当微软发布其第一个可用网络浏览器 Internet Explorer 时，由于 Netscape 是当时的领先浏览器，许多人专门检查它是否能提供页面。在\
  \ Internet Explorer 中访问页面将阻碍这种新兴浏览器的采用，因此决定创建一个与 Netscape user-agent 字符串兼容的 user-agent\
  \ 字符串。其结果是以下格式：\n\n```\nMozilla/2.0 (compatible; MSIE Version; Operating System)\n\
  ```\n\n例如，运行在 Windows 95  Internet Explorer 3.02 具有此 user-agent 字符串：\n\n```\nMozilla/2.0\
  \ (compatible; MSIE 3.02; Windows 95)\n```\n\n由于大多数浏览器嗅探只查看 user-agent 字符串的产品名称部分，Internet\
  \ Explorer 成功地识别自己为 Mozilla，与 Netscape Navigator 相同。此举引发了一些争议，因为它打破了浏览器识别的惯例。此外，真实的浏览器版本埋在字符串中间。\n\
  \n该字符串的另一个有趣部分是识别为 Mozilla 2.0 而不是 3.0。由于 3.0 是当时的主流浏览器，使用 3.0 会更有意义。实际原因仍然是一个谜——它更有可能是一个疏忽而非其他原因。\n\
  \n### Netscape Communicator 4 和 Internet Explorer 4–8\n\n1997 年 8 月，Netscape Communicator\
  \ 4 发布（名称在该版本起从 Navigator 改为 Communicator）。Netscape 选择保留来自版本 3 的以下 user-agent 字符串格式：\n\
  \n```\nMozilla/Version (Platform; Encryption [; OS-or-CPU description])\n```\n\n\
  在 Windows 98 机器上的版本 4，user-agent 字符串如下：\n\n```\nMozilla/4.0 (Win98; I)\n```\n\n\n\
  \n\n\n当 Netscape 为其浏览器发布补丁和修复时，版本号会相应增加，如下所示 4.79 版本的 user-agent 字符串所示：\n\n```\n\
  Mozilla/4.79 (Win98; I)\n```\n\n当微软发布 Internet Explorer 4 时，user-agent 字符串包含了更新后的版本，采用以下格式：\n\
  \n```\nMozilla/4.0 (compatible; MSIE Version; Operating System)\n```\n\n例如，运行在 Windows\
  \ 98 上的 Internet Explorer 4 返回以下 user-agent 字符串：\n\n```\nMozilla/4.0 (compatible;\
  \ MSIE 4.0; Windows 98)\n```\n\n通过这一变化，报告的 Mozilla 版本与 Internet Explorer 的实际版本同步了，使得能够轻松识别这些第四代浏览器。遗憾的是，同步到此为止。当\
  \ Internet Explorer 4.5（仅针对 Mac 发布）问世时，Mozilla 版本保持为 4，而 Internet Explorer 版本发生了变化：\n\
  \n```\nMozilla/4.0 (compatible; MSIE 4.5; Mac_PowerPC)\n```\n\n在从 4 到 7 的 Internet\
  \ Explorer 版本中，保持着以下模式：\n\n```\nMozilla/4.0 (compatible; MSIE 7.0; Windows NT 5.1)\n\
  ```\n\nInternet Explorer 8 引入了一个名为 `Trident` 的额外标记，它是渲染引擎的名称。格式变为：\n\n```\nMozilla/4.0\
  \ (compatible; MSIE Version; Operating System; Trident/TridentVersion)\n```\n\n\
  例如：\n\n```\nMozilla/4.0 (compatible; MSIE 8.0; Windows NT 5.1; Trident/4.0)\n```\n\
  \n额外的 `Trident` 标记旨在帮助开发者判断 Internet Explorer 8 是否在兼容模式下运行。在这种情况下，MSIE 版本变为 7，但\
  \ Trident 版本仍然保留在 user-agent 字符串中：\n\n```\nMozilla/4.0 (compatible; MSIE 7.0; Windows\
  \ NT 5.1; Trident/4.0)\n```\n\n添加此额外标记使得判断浏览器是 Internet Explorer 7（这种情况下没有 Trident\
  \ 标记）还是在兼容模式下运行的 Internet Explorer 8 成为可能。\n\nInternet Explorer 9 稍微改变了这一格式。Mozilla\
  \ 版本增加到 5.0，Trident 版本也增加到 5.0。Internet Explorer 9 的默认 user-agent 字符串如下：\n\n```\n\
  Mozilla/5.0 (compatible; MSIE 9.0; Windows NT 6.1; Trident/5.0)\n```\n\n当 Internet\
  \ Explorer 9 在兼容模式下运行时，旧的 Mozilla 版本和 MSIE 版本会恢复，而 Trident 版本保持为 5.0。例如，以下 user-agent\
  \ 字符串是运行在 Internet Explorer 7 兼容模式下的 Internet Explorer 9：\n\n```\nMozilla/4.0 (compatible;\
  \ MSIE 7.0; Windows NT 6.1; Trident/5.0)\n```\n\n所有这些改动都是为了确保过去的 user-agent 检测脚本能够继续正常工作，同时让新脚本能够获取额外信息。\n\
  \n## Gecko\n\nGecko 渲染引擎是 Firefox 的核心。当 Gecko 最初开发时，它是作为即将成为 Netscape 6 的通用 Mozilla\
  \ 浏览器的一部分存在的。为 Netscape 6 编写了一份规范，规定了未来所有版本中 user-agent 字符串应该如何构建。新格式与其在 4.x 版本之前使用的相对简单的\
  \ user-agent 字符串相比，是一个相当巨大的偏离。该格式如下：\n\n```\nMozilla/MozillaVersion (Platform; Encryption;\
  \ OS-or-CPU; Language;\nPrereleaseVersion)Gecko/GeckoVersion\nApplicationProduct/ApplicationProductVersion\n\
  ```\n\n这个极其复杂的 user-agent 字符串花费了大量精力。下表列出了每个部分的含义。\n\n| 字符串 | 是否必须 | 描述 |\n| ---\
  \ | --- | --- |\n| MozillaVersion | 是 | Mozilla 版本。 |\n| Platform | 是 | 浏览器运行的平台。可能的值包括\
  \ Windows、Mac 和 X11（用于 Unix X-windows 系统）。 |\n| Encryption | 是 | 加密能力：U 表示 128 位，I\
  \ 表示 40 位，或 N 表示无加密。 |\n| OS-or-CPU | 是 | 浏览器运行的操作系统或运行浏览器的计算机处理器类型。如果平台是 Windows，则为\
  \ Windows 版本（如 WinNT、Win95 等）。如果平台是 Macintosh，则为 CPU（68k、PowerPC 的 PPC 或 MacIntel）。如果平台是\
  \ X11，则为通过 Unix 命令 `uname -sm` 获取的 Unix 操作系统名称。 |\n| Language | 是 | 浏览器创建时使用的语言。\
  \ |\n| Prerelease Version | 否 | 原意作为 Mozilla 的预发布版本号，现在表示 Gecko 渲染引擎的版本号。 |\n| GeckoVersion\
  \ | 是 | 以 yyyymmdd 格式表示的 Gecko 渲染引擎版本。 |\n| ApplicationProduct | 否 | 使用 Gecko 的产品名称。可能是\
  \ Netscape、Firefox 等。 |\n| ApplicationProductVersion | 否 | ApplicationProduct 的版本；这与\
  \ MozillaVersion 和 GeckoVersion 独立。 |\n\n为了更好地理解 Gecko user-agent 字符串格式，请考虑来自各种基于\
  \ Gecko 的浏览器的 user-agent 字符串。\n\nWindows XP 上的 Netscape 6.21：\n\n```\nMozilla/5.0\
  \ (Windows; U; Windows NT 5.1) Gecko/2001128 Netscape/6.21\n```\n\nLinux 上的 SeaMonkey\
  \ 1.1：\n\n```\nMozilla/5.0 (X11; U; en) Gecko/20060823 SeaMonkey/1.1\n```\n\nWindows\
  \ XP 上的 Firefox 2.0.1：\n\n```\nMozilla/5.0 (Windows NT 5.1; rv:2.0.1) Gecko/2007127\
  \ Firefox/2.0.1\n```\n\nMac OS X 上的 Camino 1.5：\n\n```\nMozilla/5.0 (Macintosh;\
  \ U; Mac OS X; en; rv:1.8.1) Gecko/20070809 Camino/1.5\n```\n\n## Web\n\n2003 年，Apple\
  \ 宣布将推出自己的浏览器 Safari。Safari 的渲染引擎被称为 WebKit，最初是基于 Linux 下 Konqueror 浏览器的 KHTML 渲染引擎。几年后，WebKit\
  \ 分离成为独立的开源项目，专注于渲染引擎的开发。\n\n新浏览器和渲染引擎的开发者面临着与 Internet Explorer 3 类似的问题：如何确保浏览器不被排除在热门之外之外答案是在\
  \ user-agent 字符串中放入足够的信息，以说服网站该浏览器与其他流行的浏览器兼容。这导致了以下格式的 user-agent 字符串：\n\n```\n\
  Mozilla/5.0 (Platform; Encryption; OS-or-CPU; Language)\nAppleWebKit/AppleWebKitVersion\
  \ (KHTML, like Gecko) Safari/SafariVersion\n```\n\n这是一个示例：\n\n```\nMozilla/5.0 (Macintosh;\
  \ U; Mac OS X; en) AppleWebKit/124 (KHTML, like Gecko) Safari/125.1\n```\n\n\n\n\
  \n如你所见，这是另一个长 user-agent 字符串。它不仅考虑了 Apple WebKit 的版本，还考虑了 Safari 的版本。关于是否将浏览器标识为\
  \ `Mozilla` 的争议由于兼容性考虑很快就得到了解决。现在，所有基于 WebKit 的浏览器都将自己标识为 `Mozilla 5.0`，与所有基于 Gecko\
  \ 的浏览器相同。Safari 版本通常是浏览器的构建号，而不一定代表发布版本号。因此，尽管 Safari `1.25` 在 user-agent 字符串中包含\
  \ `125.1` 数字，但它们并不总是是一一对应的关系。\n\n这串 user-agent 字符串中最有趣且最具争议的部分是在 Safari 1.0 之前的版本中添加了\
  \ `(KHTML, like Gecko)` 字符串。Apple 遭到了开发者的反对，他们认为这是在公然欺骗客户端和服务器，让他们认为 Safari 实际上是\
  \ Gecko（仿佛仅仅添加 `Mozilla/5.0` 还不够够似的）。Apple 的回应与 Internet Explorer user-agent 字符串受到攻击时微软的反应类似：Safari\
  \ 兼容 `Mozilla`，网站不应该因为 Safari 用户看起来在使用不支持的浏览器而屏蔽他们。\n\n当版本 3 发布时，Safari 的 user-agent\
  \ 字符串略有扩展。现在使用以下版本标记来标识正在使用的 Safari 实际版本：\n\n```\nMozilla/5.0 (Macintosh; U; PPC\
  \ Mac OS X; en) AppleWebKit/522.15.5\n(KHTML, like Gecko) Version/3.0.3 Safari/522.15.5\n\
  ```\n\n注意，此更改仅针对 Safari 而未针对 WebKit，因此其他基于 WebKit 的浏览器可能没有此更改。通常情况下，与 Gecko 一样，判断浏览器是基于\
  \ WebKit 的而不是尝试专门识别 Safari 是典型的做法。\n\n### Konqueror\n\nKonqueror 是 KDE Linux 桌面环境自带的浏览器，它基于\
  \ `KHTML` 开源渲染引擎。尽管仅在 Linux 上可用，但 Konqueror 拥有活跃的用户群。为了获得最佳的兼容性，Konqueror 选择在 Internet\
  \ Explorer 之后按照如下格式化其 user-agent 字符串：\n\n```\nMozilla/5.0 (compatible; Konqueror/Version;\
  \ OS-or-CPU)\n```\n\n然而，Konqueror 3.2 引入了变化以配合 WebKit user-agent 字符串的更改，如下如下标识自己为\
  \ `KHTML`：\n\n```\nMozilla/5.0 (compatible; Konqueror/Version; OS-or-CPU) KHTML/KHTMLVersion\n\
  (like Gecko)\n```\n\n这是一个示例：\n\n```\nMozilla/5.0 (compatible; Konqueror/3.5; SunOS)\
  \ KHTML/3.5.0 (like Gecko)\n```\n\nKonqueror 和 KHTML 的版本号往往一致，或差在小数点后一位，例如 Konqueror\
  \ `3.5` 使用了 KHTML `3.5.1`。\n\n### Chrome\n\n谷歌的 Chrome 浏览器使用 WebKit 作为其渲染引擎，但使用了不同的\
  \ JavaScript 引擎。Chrome 的 user-agent 字符串携带了来自 WebKit 的所有信息以及一个关于 Chrome 版本的额外部分。格式如下：\n\
  \n```\nMozilla/5.0 (Platform; Encryption; OS-or-CPU; Language)\nAppleWebKit/AppleWebKitVersion\
  \ (KHTML, like Gecko)\nChrome/ChromeVersion Safari/SafariVersion\n```\n\nChrome\
  \ `7` 的完整 user-agent 字符串如下：\n\n```\nMozilla/5.0 (Windows; U; Windows NT 5.1; en-US)\
  \ AppleWebKit/534.7\n(KHTML, like Gecko) Chrome/7.0.517.44 Safari/534.7\n```\n\n\
  此后 WebKit 版本和 Safari 版本可能会始终保持同步，尽管这无法保证。\n\n### Opera\n\n就 user-agent 字符串而言，Opera\
  \ 是最具争议的 浏览器之一。Opera 的默认 user-agent 字符串是所有现代浏览器中最符合逻辑的，它正确地标识了自己及其版本。在版本 8 之前，Opera\
  \ 的 user-agent 字符串采用以下格式：\n\n```\nOpera/Version (OS-or-CPU; Encryption) [Language]\n\
  ```\n\n在 Windows XP 电脑上使用 Opera `7.54` 时，user-agent 字符串如下：\n\n```\nOpera/7.54 (Windows\
  \ NT 5.1; U) [en]\n```\n\n随着 Opera 8 的发布，user-agent 字符串的语言部分移动到了括号内部，以更好地匹配其他浏览器，如下：\n\
  \n```\nOpera/Version (OS-or-CPU; Encryption; Language)\n```\n\nWindows XP  Opera\
  \ 8 产生以下 user-agent 字符串：\n\n```\nOpera/8.0 (Windows NT 5.1; U; en)\n```\n\n默认情况下，Opera\
  \ 返回这种简单格式的 user-agent 字符串。目前它是主流浏览器中唯一一个使用产品名称和版本来完全标识自己的浏览器。然而，与其他浏览器一样，Opera\
  \ 也发现在使用自己的 user-agent 字符串时存在问题。尽管它在技术上是正确的，但互联网上有大量的浏览器嗅探（browser-sniffing）代码是针对报告\
  \ `Mozilla` 产品名称的 user-agent 字符串的。还有大量代码专门寻找 Internet Explorer 或 Gecko。Opera 并没有通过更改自己的\
  \ user-agent 字符串来混淆嗅探器，而是通过完全更改自己的 user-agent 字符串将自己标识为完全不同的浏览器。\n\n从 Opera 9 开始，有两种更改\
  \ user-agent 字符串的方法。一种方法将其标识为另一种浏览器（Firefox 或 Internet Explorer）。使用这种方法时，user-agent\
  \ 字符串会变得与相应的 Firefox 或 Internet Explorer ，但在结尾增加了 `Opera` 字符串和 Opera 的版本号。这是一个示例：\n\
  \n```\nMozilla/5.0 (Windows NT 5.1; U; en; rv:1.8.1) Gecko/20061208 Firefox/2.0.0\n\
  Opera 9.50\nMozilla/4.0 (compatible; MSIE 6.0; Windows NT 5.1; en) Opera 9.50\n\
  ```\n\n第一个字符串将 Opera `9.5` 标识为 Firefox 2，同时保留了 Opera 版本信息。第二个字符串将 Opera `9.5` 标识为\
  \ Internet Explorer 6 并包含了 Opera 版本信息。虽然这些 user-agent 字符串可以通过识别 Opera，但在屏蔽浏览器身份时，user-agent\
  \ 字符串与其它浏览器返回的完全相同——`Opera` 字符串没有出现，也没有任何 Opera 版本信息。在使用身份屏蔽时，完全没有办法将 Opera 与其他浏览器区分开。进一步增加问题的是\
  \ Opera 倾向于在不通知用户的情况下设置特定站点的 user-agent。例如，导航到 My Yahoo! 网站（`http://my.yahoo.com`）会导致\
  \ Opera 伪装成 Firefox。这使得通过 user-agent 字符串识别 Opera 变得非常困难。\n\n![image](img/pen.gif)\n\
  \n### iOS 和 Android\n\niOS 和 Android 移动操作系统的默认 Web 浏览器都基于 WebKit，因此与它们的桌面版本共享相同的\
  \ Basic user-agent 字符串格式。iOS 设备遵循这一基础格式：\n\n\n\n\n\n```\nMozilla/5.0 (Platform;\
  \ Encryption; OS-or-CPU like Mac OS X; Language)\nAppleWebKit/AppleWebKitVersion\
  \ (KHTML, like Gecko) Version/BrowserVersion\nMobile/MobileVersion Safari/SafariVersion\n\
  ```\n\n注意添加了 \"like Mac OS X\" 用于检测 Mac 操作系统，并添加了 Mobile 令牌（token）。Mobile 令牌的版本号通常没有用，主要用于区分移动端\
  \ WebKit 和桌面端 WebKit。根据设备的不同，platform 将 \"iPhone\"、iPod\" 或 \"iPad\"。例如：\n\n```\n\
  Mozilla/5.0 (iPhone; U; CPU iPhone OS 3_0 like Mac OS X; en-us)\nAppleWebKit/528.18\
  \ (KHTML, like Gecko) Version/4.0 Mobile/7A341 Safari/528.16\n```\n\n注意，在 iOS 3\
  \ 之前，操作系统的版本号没有出现在 user-agent 字符串中。\n\n默认 Android 浏览器通常遵循 iOS 上设置的格式，但没有 Mobile\
  \ 版本（Mobile 令牌仍然存在）。例如：\n\n```\nMozilla/5.0 (Linux; U; Android 2.2; en-us; Nexus\
  \ One Build/FRF91)\nAppleWebKit/533.1 (KHTML, like Gecko) Version/4.0 Mobile Safari/533.1\n\
  ```\n\n此 user-agent 字符串来自来自 Google Nexus One 手机，但其他 Android 设备遵循相同的模式。\n\n## 使用\
  \ User-Agent 检测\n\n使用 user-agent 字符串来检测特定浏览器可能会变得非常复杂，因为现代浏览器中 user-agent 字符串的历史和用法如此。通常首先需要确定你对浏览器信息的精确需求达到什么程度。通常情况下，知道渲染引擎和最低版本就足够确定正确的执行方案。例如，不建议采用以下方法：\n\
  \n```\nif (isIE6 || isIE7) { //避免！！！\n//code\n}\n```\n\n在这个示例中，如果浏览器是 Internet Explorer\
  \ 版本 6 或 7，则执行代码。这段代码非常脆弱，因为它依赖于特定的浏览器版本来决定执行什么。版本 8 应该发生什么？每当 Internet Explorer\
  \ 发布新版本时，这段代码都必须更新。然而，使用如下示例所示的相对版本号可以避免这个问题：\n\n```javascript\nif (ieVer >= 6){\n\
  //code\n}\n```\n\n这个重写后的示例检查 Internet Explorer 版本是否至少为 6 以确定正确的执行方案。这样做确保了该代码在未来将继续正常运行。浏览器检测脚本侧重于这种识别浏览器的方法。\n\
  \n## 识别渲染引擎\n\n如前所述，浏览器的确切名称和版本并没有使用的渲染引擎重要。如果 Firefox、Camino 和 Netscape 都使用相同版本的\
  \ Gecko，它们的功能将是相同的。同样，任何使用与 Safari 3 相同版本 WebKit 的浏览器可能相同相同。因此，此脚本侧重于检测五大渲染引擎：Internet\
  \ Explorer、Gecko、WebKit、KHTML 和 Opera。\n\n此脚本使用模块增强（module-augmentation）模式来封装检测脚本，并避免添加必要的全局变量。基础代码结构如下：\n\
  \n```\nvar client = function(){\nvar engine = {\n//渲染引擎\nie: 0,\ngecko: 0,\nwebkit:\
  \ 0,\nkhtml: 0,\nopera: 0,\n//特定版本\nver: null\n};\n//在此处检测渲染引擎/平台/设备\nreturn {\n\
  engine: engine\n};\n}();\n```\n\n在这段代码中，声明了一个名为 `client` 的全局变量来存储信息。匿名函数内部是一个名为\
  \ `engine` 的局部变量，它包含一个带有默认设置的字面量对象。每个渲染引擎都由一个设置为 0 的属性表示。如果检测到特定引擎，该引擎的版本将以浮点数值放入相应的属性中。渲染引擎的完整版本（字符串）被放入\
  \ `ver` 属性中。这种设置允许类似下面的代码：\n\n```javascript\nif (client.engine.ie) { // 如果是 IE，client.engine.ie\
  \ 大于 0\n//IE 特有代码\n} else if (client.engine.gecko > 1.5){\nif (client.engine.ver\
  \ == \"1.8.1\"){\n//执行针对该版本的特定操作\n}\n}\n```\n\n每当检测到渲染引擎时，它在 `client.engine` 上的属性会被设置为大于\
  \ 0 的数字，这 true 布尔值 true。这允许在 `if` 语句中使用属性来确定正在使用的渲染引擎，即使不需要特定版本。由于每个属性都包含一个浮点值，可能会丢失某些版本信息。例如，字符串\
  \ \"1.8.1\" 在传递给 `parseFloat()` 时变为数字 1.8。`ver` 属性确保了在需要时可以使用完整版本。\n\n要识别正确的渲染引擎，你需要按照正确的顺序进行测试。由于\
  \ user-agent 的不一致，无序测试可能会导致错误。由于由于原因，第一步是识别 Opera，因为它的 user-agent 字符串可能完全模拟其他浏览器。Opera\
  \ 的 user-agent 字符串是不可的，因为它在所有情况下都不会将自己标识为 Opera。\n\n要识别 Opera，你需要查找 `window.opera`\
  \ 对象。该对象存在于 Opera 5 及之后的所有版本中，用于识别有关浏览器的信息并直接与浏览器交互。在 7.6 之后的版本中，使用以下方式识别版本号：\n\n\
  ```javascript\nif (window.opera){\nengine.ver = window.opera.version();\n}\n}\n\
  ```\n\n下一个要检测的引擎是 WebKit。由于 WebKit 的 user-agent 字符串包含 \"WebKit\"，检查它是最有可能的。以下是执行此操作的示例：\n\
  \n```javascript\nvar ua = navigator.userAgent;\nif (window.opera){\nengine.ver =\
  \ window.opera.version();\nengine.opera = parseFloat(engine.ver);\n} else if (/AppleWebKit\\\
  /(\\S+)/.test(ua)){\n engine.ver = ua[\"1\"];\n engine.webkit = parseFloat(engine.ver);\n\
  }\n```\n\n这段代码将 user-agent 字符串存储在变量 `ua` 中。正则表达式测试 user-agent 字符串中是否存在 \"WebKit\"\
  ，并对版本号使用捕获组。由于实际版本号可能包含数字、小数点和字母，使用了非空白字符 `\\S`。版本号与 user-agent 字符串其他部分之间的分隔符是空格，因此此模式可以捕获所有版本。`test()`\
  \ 方法对 user-agent 字符串运行正则表达式。如果返回 true，则将捕获的版本存储在 `engine.ver` 中，并将浮点表示存储在 `engine.webkit`\
  \ 中。WebKit 版本与 Safari 版本对应，详下表。\n\n| Safari 版本 | 最低 WebKit 版本 |\n| --- | --- |\n\
  | 1.0 到 1.0.2 | 85.7 |\n| 1.0.3 | 85.8.2 |\n| 1.1 到 1.1.1 | 100 |\n| 1.2.2 | 125.2\
  \ |\n| 1.2.3 | 125.4 |\n| 1.2.4 | 125.5.5 |\n| 1.3 | 312.1 |\n| 1.3.1 | 312.5 |\n\
  | 1.3.2 | 312.8 |\n| 2.0 | 412 |\n| 2.0.1 | 412.7 |\n| 2.0.2 | 416.11 |\n| 2.0.3\
  \ | 417.9 |\n| 2.0.4 | 418.8 |\n| 3.0.4 | 523.10 |\n| 3.1 | 525 |\n\n\n\n\n有时 Safari\
  \ 的版本与 WebKit 版本并不完全对应，可能在次版本上有所差异。上表指示了最可能的 WebKit 版本，但并非精确对应。\n\n下一个要测试的渲染引擎是\
  \ `KHTML`。再次，此用户-agent 字符串包含了 `\"Gecko\"`，因此在首先排除 `KHTML` 之前，你无法准确检测出基于 Gecko 的浏览器。`KHTML`\
  \ 版本以类似于 WebKit 的格式包含用户-agent 字符串中，因此使用了类似的正则表达式。此外，由于 `Konqueror` `3.1` 及更早版本没有包含特定的\
  \ `KHTML` 版本，因此使用了 `Konqueror` 版本。这是一个示例：\n\n```javascript\nvar ua = navigator.userAgent;\n\
  if (window.opera){\nengine.ver = window.opera.version();\nengine.opera = parseFloat(engine.ver);\n\
  } else if (/AppleWebKit\\/(\\S+)/.test(ua)){\nengine.ver = RegExp[\"$1\"];\nengine.webkit\
  \ = parseFloat(engine.ver);\n} else if (/KHTML\\/(\\S+)/.test(ua) || /Konqueror\\\
  /([^;]+)/.test(ua)){\n engine.ver = RegExp[\"$1\"];\n engine.khtml = parseFloat(engine.ver);\n\
  }\n```\n\n再次，由于 `KHTML` 版本号与下一个标记之间用空格分隔，因此使用非空白字符来获取版本中的所有字符。然后将字符串版本存储在 `engine.ver`\
  \ 中，并将浮点版本存储在 `engine.khtml` 中。如果用户-agent 字符串中没有 `KHTML`，则匹配 `Konqueror`，其后跟着一个斜杠，然后是所有非分号的字符。\n\
  \n如果 WebKit 和 `KHTML` 都已被排除，就可以安全地检查 `Gecko`。实际的 Gecko 版本并没有出现在用户-agent 字符串 `\"\
  Gecko\"` 之后，而是出现在字符串 `\"rv:\"` 之后。如接示例所示，这比之前的测试需要更复杂的正则表达式：\n\n```javascript\n\
  var ua = navigator.userAgent;\nif (window.opera){\nengine.ver = window.opera.version();\n\
  engine.opera = parseFloat(engine.ver);\n} else if (/AppleWebKit\\/(\\S+)/.test(ua)){\n\
  engine.ver = RegExp[\"$1\"];\nengine.webkit = parseFloat(engine.ver);\n} else if\
  \ (/KHTML\\/(\\S+)/.test(ua)){\nengine.ver = RegExp[\"$1\"];\nengine.khtml = parseFloat(engine.ver);\n\
  } else if (/rv:([^\\)]+)\\) Gecko\\/\\d{8}/.test(ua)){\n engine.ver = RegExp[\"\
  $1\"];\n engine.gecko = parseFloat(engine.ver);\n}\n```\n\nGecko 版本号出现在 `\"rv:\"\
  ` 和右括号之间，因此为了提取版本号，正则表达式查找所有非右括号的字符。该正则表达式还查找字符串 `\"Gecko/\"` 后后跟八个数字。如果模式匹配，则提取版本号并将其存储在适当的属性中。Gecko\
  \ 版本号与 Firefox 版本相关，详见下表。\n\n| Firefox 版本 | 最低 Gecko 版本 |\n| --- | --- |\n| 1.0\
  \ | 1.7.5 |\n| 1.5 | 1.8.0 |\n| 2.0 | 1.8.1 |\n| 3.0 | 1.9.0 |\n| 3.5 | 1.9.1 |\n\
  | 3.6 | 1.9.2 |\n| 4.0 | 2.0.0 |\n\n![image](img/pen.gif)\n\n与 Safari 和 WebKit 一样，Firefox\
  \ 和 Gecko 版本号之间的匹配并不精确。\n\nInternet Explorer 是最后一个要检测的渲染引擎。版本号位于 `\"MSIE\"` 之后且分号之前，因此正则表达式非常简单，如下例所示：\n\
  \n```javascript\nvar ua = navigator.userAgent;\nif (window.opera){\nengine.ver =\
  \ window.opera.version();\nengine.opera = parseFloat(engine.ver);\n} else if (/AppleWebKit\\\
  /(\\S+)/.test(ua)){\nengine.ver = RegExp[\"$1\"];\nengine.webkit = parseFloat(engine.ver);\n\
  } else if (/KHTML\\/(\\S+)/.test(ua)){\nengine.ver = RegExp[\"$1\"];\nengine.khtml\
  \ = parseFloat(engine.ver);\n} else if (/rv:([^\\)]+)\\) Gecko\\/\\d{8}/.test(ua)){\n\
  engine.ver = RegExp[\"$1\"];\nengine.gecko = parseFloat(engine.ver);\n} else if\
  \ (/MSIE ([^;]+)/.test(ua)){\n engine.ver = RegExp[\"$1\"];\n engine.ie = parseFloat(engine.ver);\n\
  }\n```\n\n该渲染引擎检测脚本的最后部分在正则表达式中使用否定字符类来获取所有非分号的字符。尽管 Internet Explorer 通常将版本号保持为标准的浮点值，但并不一定总是如此。使用否定字符类\
  \ `[^;]` 是为了允许多个小数点以及可能存在的字母。\n\n## 识别浏览器\n\n在大多数情况下，识别浏览器的渲染引擎已具体到足以确定正确的行动方案。然而，仅凭渲染引擎并不能表明存在\
  \ JavaScript 功能。苹果的 Safari 浏览器和谷歌的 Chrome 浏览器都使用 WebKit 作为它们的渲染引擎，但使用不同的 JavaScript\
  \ 引擎。这两个浏览器都会为 `client.engine.webkit` 返回一个值，但这并不表示在使用哪种 JavaScript 引擎。要找出结果，请使用以下代码：\n\
  \n```javascript\nvar ua = navigator.userAgent;\nif (window.opera){\nengine.ver =\
  \ window.opera.version();\nengine.opera = parseFloat(engine.ver);\n} else if (/AppleWebKit\\\
  /(\\S+)/.test(ua)){\nengine.ver = RegExp[\"$1\"];\nengine.webkit = parseFloat(engine.ver);\n\
  \ //判断别是 Chrome 还是 Safari\n if (/Chrome\\/(\\S+)/.test(ua)){\n browser.ver = RegExp[\"\
  $1\"];\n browser.chrome = parseFloat(browser.ver);\n } else if (/Version\\/(\\S+)/.test(ua)){\n\
  \ browser.ver = RegExp[\"$1\"];\n browser.safari = parseFloat(browser.ver);\n }\
  \ else {\n //近似估算版本\n var safariVersion = 1;\n if (engine.webkit < 100){\nsafariVersion\
  \ = 1;\n } else if (engine.webkit < 312){\nsafariVersion = 1.2;\n } else if (engine.webkit\
  \ < 412){\nsafariVersion = 1.3;\n } else {\nsafariVersion = 2;\n }\n browser.safari\
  \ = safariVersion;\n }\n} else if (/KHTML\\/(\\S+)/.test(ua) || /Konqueror\\/([^;]+)/.test(ua)){\n\
  engine.ver = RegExp[\"$1\"];\nengine.khtml = parseFloat(engine.ver);\n} else if\
  \ (/rv:([^\\)]+)\\) Gecko\\/\\d{8}/.test(ua)){\nengine.ver = RegExp[\"$1\"];\nengine.gecko\
  \ = parseFloat(engine.ver);\n //判断是否是 Firefox\n if (/Firefox\\/(\\S+)/.test(ua)){\n\
  \ browser.ver = RegExp[\"$1\"];\n browser.firefox = parseFloat(browser.ver);\n }\n\
  } else if (/MSIE ([^;]+)/.test(ua)){\nengine.ver = RegExp[\"$1\"];\nengine.ie =\
  \ parseFloat(engine.ver);\n}\nreturn browser;\n```\n\n对于 Opera 和 Internet Explorer，浏览器对象中的值等于引擎对象中的值。对于\
  \ Konqueror，`browser.konq` 和 `browser.ver` 属性分别等于 `engine.khtml` 和 `engine.ver`\
  \ 属性。\n\n\n\n\n对于 Firefox 版本，会找到字符串 `\"Firefox/\"` 并提取其后的数字并提取为版本号。这仅在检测到的渲染引擎为\
  \ `Gecko` 时才会发生。\n\n使用这段代码，你现在可以编写如下的逻辑：\n\n```\nif (client.engine.webkit) { //如果是\
  \ WebKit\nif (client.browser.chrome){\n//为 Chrome 执行某些操作\n} else if (client.browser.safari){\n\
  //为 Safari 执行某些操作\n}\n} else if (client.engine.gecko){\nif (client.browser.firefox){\n\
  //为 Firefox 执行某些操作\n} else {\n//为其他 Gecko 浏览器执行某些操作\n}\n}\n```\n\n### 识别平台\n\n在很多情况下，仅仅知道渲染引擎就足够让你的代码运行。但在某些情况下，平台具有特别关注价值。跨平台的浏览器（如\
  \ Safari、Firefox 和 Opera）在不同平台上的可能会有不同的问题。三大平台是 Windows、Mac 和 Unix（包括 Linux 变体）。为了允许检测这些平台，请如下所示向\
  \ `client` 添加一个新对象：\n\n```\nvar client = function(){\nvar engine = {\n//渲染引擎\nie:\
  \ 0,\ngecko: 0,\nwebkit: 0,\nkhtml: 0,\nopera: 0,\n//特定版本\nver: null\n};\nvar browser\
  \ = {\n//浏览器\nie: 0,\nfirefox: 0,\nsafari: 0,\nkonq: 0,\nopera: 0,\nchrome: 0,\n\
  //特定版本\nver: null\n};\n var system = {\n win: false,\n mac: false,\n x11: false\n\
  \ };\n//在此处检测渲染引擎/平台/设备\nreturn {\nengine: engine,\nbrowser: browser,\n system:\
  \ system\n};\n}();\n```\n\n这段代码引入了一个具有三个属性的新 `system` 变量。`win` 属性表示平台是否为 Windows，`mac`\
  \ 表示 Mac，而 `x11` 表示 Unix。与渲染引擎不同，平台信息通常非常有限，无法访问操作系统或版本号。在这三个平台中，浏览器通常仅报告 Windows\
  \ 版本。因此，这些属性中的每个最初都用布尔值 `false` 表示，而不是数字（如渲染引擎属性那样）。\n\n要确定平台，查看 `navigator.platform`\
  \ 比查看用户-agent 字符串要容易得多，因为后者在不同浏览器中表示平台信息的方式不同。`navigator.platform` 的可能值为 `\"Win32\"\
  `、`Win64\"`、`MacPPC\"`、`MacIntel\"`、`X11\"` 和 `\"Linux i686\"`，这些值在浏览器中是一致的。平台检测代码非常直接，如下例所示：\n\
  \n```\nvar p = navigator.platform;\nsystem.win = p.indexOf(\"Win\") == 0;\nsystem.mac\
  \ = p.indexOf(\"Mac\") == 0;\nsystem.x11 = (p.indexOf(\"X11\") == 0) || (p.indexOf(\"\
  Linux\") == 0);\n```\n\n这段代码使用 `indexOf()` 方法查看平台字符串的开头。要检测 Windows，平台检测代码只需在平台字符串开头查找字符串\
  \ `\"Win\"`（涵盖了 `\"Win32\"` 和 `\"Win64\"`）。对 Mac 平台的测试以相同的方式进行，以兼容 `\"MacPPC\"`\
  \ 和 `\"MacIntel\"`。对 Unix 的测试则在平台字符串开头同时查找 `\"X11\"` 和 `\"Linux\"`，以确保此代码能够应对其他变体。\n\
  \n![image](img/pen.gif)\n\n早期的 `Gecko` 版本为所有 Windows 平台返回 `\"Windows\"`，为所有 Mac\
  \ 平台返回 `\"Macintosh\"`。这发生在 Firefox 1 发布之前，该版本稳定了 `navigator.platform` 的值。\n\n###\
  \ 识别 Windows 操作系统\n\n如果平台是 Windows，可以从用户-agent 字符串获取特定的操作系统信息。在 Windows XP 之前，有两个版本的\
  \ Windows：一个用于家庭使用，一个用于业务使用。家庭版简单地称为 Windows，并有 95、98 和 ME 等特定版本。业务版被称为 Windows\
  \ NT，最终作为 Windows 2000 营销。Windows XP 代表了这两个产品线合并到一个从 Windows NT 演变来的通用代码库中。Windows\
  \ Vista 然后构建在 Windows XP 之上。\n\n这些信息很重要，是因为 Windows 操作系统在用户-agent 字符串中的表示方式。下表显示了不同浏览器中表示各种\
  \ Windows 操作系统的不同字符串。\n\n![image](img/f296-01.jpg)\n\n由于 Windows 操作系统在用户-agent 字符串中的表示方式多种，检测并不完全直接。好消息是，自\
  \ Windows 2000 以来，字符串表示基本保持不变，只有版本号发生了变化。要检测不同的 Windows 操作系统，你需要一个正则表达式。请记住，7 之前的\
  \ Opera 版本已不再被广泛使用，因此不需要为它们做准备。\n\n第一步是匹配 Windows 95 和 Windows 98 的字符串。`Gecko`与其他浏览器返回的字符串之间的唯一区别在于缺少\
  \ `\"dows\"` 以及 `\"Win\"` 与版本号之间的空格。这是一个相当简单的正则表达式，如此处所示：\n\n```\n/Win(?:dows )?([^do]{2})/\n\
  ```\n\n使用这个正则表达式，捕获组返回操作系统的版本。由于这可能是任何不包含 `\"d\"` 或 `\"o\"` 的两个字符的代码（例如 95, 98），\n\
  \n\n\n\n在 2006–2007 年间，移动设备上网络浏览器的使用爆发式增长。所有主流浏览器都有移动版本，也有运行在其他设备上的版本，因此识别这些情况至关重要。第一步是为所有移动设备添加需要检测的属性，如下例所示：\n\
  \n```\nvar client = function(){\nvar engine = {\n//rendering engines\nie: 0,\ngecko:\
  \ 0,\nwebkit: 0,\nkhtml: 0,\nopera: 0,\n//specific version\nver: null\n};\nvar browser\
  \ = {\n//browsers\nie: 0,\nfirefox: 0,\nsafari: 0,\nkonq: 0,\nopera: 0,\nchrome:\
  \ 0,\n//specific version\nver: null\n};\nvar system = {\nwin: false,\nmac: false,\n\
  x11: false,\n //mobile devices\n iphone: false,\n ipod: false,\n ipad: false,\n\
  \ ios: false,\n android: false,\n nokiaN: false,\n winMobile: false };\n//detection\
  \ of rendering engines/platforms/devices here\nreturn {\nengine: engine,\nbrowser:\
  \ browser,\nsystem: system\n};\n}();\n```\n\n检测 iOS 设备非常简单，只需搜索字符串 \"iPhone\"、\"\
  iPod\" 和 \"iPad\"：\n\n```\nsystem.iphone = ua.indexOf(\"iPhone\") > -1;\nsystem.ipod\
  \ = ua.indexOf(\"iPod\") > -1;\nsystem.ipad = ua.indexOf(\"iPad\") > -1;\n```\n\n\
  除了知道 iOS 设备，知道 iOS 的版本也有帮助。在 iOS 3 之前，用户代理字符串简单地显示为 \"CPU like Mac OS X\"，而后来 iPhone\
  \ 更改为 \"CPU iPhone OS 3_0 like Mac OS X\"，iPad 更改为 \"CPU OS 3_2 like Mac OS X\"\
  。这意味着检测 iOS 需要一个正则表达式来考虑这些变化：\n\n```\n//determine iOS version\nif (system.mac &&\
  \ ua.indexOf(\"Mobile\") > -1){\nif (/CPU (?:iPhone )?OS (\\d+_\\d+)/.test(ua)){\n\
  system.ios = parseFloat(RegExp.$1.replace(\"_\", \".\"));\n} else {\nsystem.ios\
  \ = 2; //can't really detect - so guess\n}\n}\n```\n\n检查系统是否为 Mac OS 以及字符串中是否存在\
  \ \"Mobile\"，这确保了无论版本如何，`system.ios` 都将不为零。之后，使用正则表达式来确定用户代理字符串中是否存在 iOS 版本。如果是，则将\
  \ `system.ios` 设置为该版本的浮点值；否则，将版本硬编码为 `2`。（由于没有办法确定实际版本，因此选择上一个版本对于使该值有用来说是安全的。）\n\
  \n检测 Android 操作系统只需简单地搜索字符串 \"Android\" 并紧接着获取其后的版本号：\n\n```\n//determine Android\
  \ version\nif (/Android (\\d+.\\d+)/.test(ua)){\nsystem.android = parseFloat(RegExp.$1);\n\
  }\n```\n\n由于所有的 Android 版本都包含版本号，该正则表达式可以准确检测所有版本并将 `system.android` 设置为正确的值。\n\n\
  诺基亚 N 系列手机也使用 WebKit。其用户代理字符串与其他基于 WebKit 的手机非常相似，例如：\n\n```\nMozilla/5.0 (SymbianOS/9.2;\
  \ U; Series60/3.1 NokiaN95/11.0.026;\nProfile MIDP-2.0 Configuration/CLDC-1.1) AppleWebKit/413\
  \ (KHTML, like Gecko)\nSafari/413\n```\n\n注意，尽管诺基亚 N 系列手机在用户代理字符串中报告为 \"Safari\"\
  ，但浏览器实际上并不是 Safari，尽管它是基于 WebKit 的。如所示，在用户代理字符串中检查 \"NokiaN\" 即可检测此系列的手机：\n\n```\n\
  system.nokiaN = ua.indexOf(\"NokiaN\") > -1;\n```\n\n有了这些设备信息，可以使用如下代码来判断用户是如何通过\
  \ WebKit 页面的：\n\n```\nif (client.engine.webkit){\nif (client.system.ios){\n//iOS\
  \ stuff\n} else if (client.system.android){\n//android stuff\n} else if (client.system.nokiaN){\n\
  //nokia stuff\n}\n}\n```\n\n最后一个主要的移动设备平台是 Windows Mobile（以前称为 Windows CE），它可以在\
  \ Pocket PC 和智能手机上运行。由于这些设备技术上属于 Windows 平台，因此 Windows 平台和操作系统将返回正确的值。对于 Windows\
  \ Mobile 5.0 及早期版本，这两种设备的用户代理字符串非常相似，如下：\n\n```\nMozilla/4.0 (compatible; MSIE 4.01;\
  \ Windows CE; PPC; 240x320)\nMozilla/4.0 (compatible; MSIE 4.01; Windows CE; Smartphone;\
  \ 176x220)\n```\n\n其中第一个是 Pocket PC 上的移动版 Internet Explorer 4.01，第二个是手机上的相同浏览器。当对任一个字符串运行\
  \ Windows 操作系统检测脚本时，`client.system.win` 将被填充为 \"CE\"，因此可以使用此值对早期的 Windows Mobile\
  \ 设备进行检测。对于 Windows Mobile 5.0 及早期版本，这两个设备的用户代理字符串非常相似，如下：\n\n```\nMozilla/4.0 (compatible;\
  \ MSIE 4.01; Windows CE; PPC; 240x320)\nMozilla/4.0 (compatible; MSIE 4.01; Windows\
  \ CE; Smartphone; 176x220)\n```\n\n其中第一个是 Pocket PC 上的移动版 Internet Explorer 4.01，第二个是手机上的相同浏览器。当对任一个字符串运行\
  \ Windows 操作系统检测脚本时，`client.system.win` 将被填充为 \"CE\"，因此可以使用此值对早期的 Windows Mobile\
  \ 设备进行检测。对于 Windows Mobile 5.0 及早期版本，这两个设备的用户代理字符串非常相似，如下：\n\n```\nMozilla/4.0 (compatible;\
  \ MSIE 4.01; Windows CE; PPC; 240x320)\nMozilla/4.0 (compatible; MSIE 4.01; Windows\
  \ CE; Smartphone; 176x220)\n```\n\n其中第一个是 Pocket PC 上的移动版 Internet Explorer 4.01，第二个是手机上的相同浏览器。当对任一个字符串运行\
  \ Windows 操作系统检测脚本时，`client.system.win` 将被填充为 \"CE\"，因此可以使用此值对早期的 Windows Mobile\
  \ 设备进行检测。（注：原文此处存在大量重复，已按逻辑翻译）\n\n（注：原文此处存在大量重复，已按逻辑翻译）\n\n### 游戏系统\n\n网络浏览器变得流行的另一个新领域是游戏系统。Nintendo\
  \ Wii 和 PlayStation 3 都有内置或可用的浏览器。这些浏览器的用户代理字符串如下：\n\n```\nOpera/9.10 (Nintendo\
  \ Wii;U; 1621; en)\nMozilla/5.0 (PLAYSTATION 3; 2.0)\n```\n\n第一个用户代理字符串是运行在 Wii\
  \ 上的 Opera。它符合 Opera 用户代理。第二个来自 PlayStation 3，它报告为 Mozilla 5.0 但没有提供太多信息。在检测这些设备之前，你必须按照如下方式为\
  \ `client.system` 对象添加相应的属性：\n\n```javascript\nvar client = function(){\nvar engine\
  \ = {\n//rendering engines\nie: 0,\ngecko: 0,\nwebkit: 0,\nkhtml: 0,\nopera: 0,\n\
  //specific version\nver: null\n};\nvar browser = {\n//browsers\nie: 0,\nfirefox:\
  \ 0,\nsafari: 0,\nkonq: 0,\nopera: 0,\nchrome: 0,\n//specific version\nver: null\n\
  };\nvar system = {\nwin: false,\nmac: false,\nx11: false,\n //mobile devices\n iphone:\
  \ false,\n ipod: false,\n ipad: false,\n ios: false,\n android: false,\n nokiaN:\
  \ false,\n winMobile: false,\n //game systems\n wii: false,\n ps: false\n};\n//detection\
  \ of rendering engines/platforms/devices here\nreturn {\nengine: engine,\nbrowser:\
  \ browser,\nsystem: system\n};\n}();\n```\n\n以下代码可以检测每种游戏系统：\n\n```javascript\n\
  system.wii = ua.indexOf(\"Wii\") > -1;\nsystem.ps = /playstation/i.test(ua);\n```\n\
  \n## 完整脚本\n\n\n\n\n完整的 user-agent 检测脚本（包括渲染引擎、平台、Windows 操作系统、移动设备和游戏系统）如下：\n\n\
  ![image](img/logo1.gif)\n\n```\nvar client = function(){\n//rendering engines\n\
  var engine = {\nie: 0,\ngecko: 0,\nwebkit: 0,\nkhtml: 0,\nopera: 0,\n//complete\
  \ version\nver: null\n};\n//browsers\nvar browser = {\n//browsers\nie: 0,\nfirefox:\
  \ 0,\nsafari: 0,\nkonq: 0,\nopera: 0,\nchrome: 0,\n//specific version\nver: null\n\
  };\n//platform/device/OS\nvar system = {\nwin: false,\nmac: false,\nx11: false,\n\
  //mobile devices\niphone: false,\nipod: false,\nipad: false,\nios: false,\nandroid:\
  \ false,\nnokiaN: false,\nwinMobile: false,\n//game systems\nwii: false,\nps: false\n\
  };\n//detect rendering engines/browsers\nvar ua = navigator.userAgent;\nif (window.opera){\n\
  engine.ver = browser.ver = window.opera.version();\nengine.opera = browser.opera\
  \ = parseFloat(engine.ver);\n} else if (/AppleWebKit\\/(\\S+)/.test(ua)){\nengine.ver\
  \ = RegExp[\"$1\"];\nengine.webkit = parseFloat(engine.ver);\n//figure out if it's\
  \ Chrome or Safari\nif (/Chrome\\/(\\S+)/.test(ua)){\nbrowser.ver = RegExp[\"$1\"\
  ];\nbrowser.chrome = parseFloat(browser.ver);\n} else if (/Version\\/(\\S+)/.test(ua)){\n\
  browser.ver = RegExp[\"$1\"];\nbrowser.safari = parseFloat(browser.ver);\n} else\
  \ {\n//approximate version\nvar safariVersion = 1;\nif (engine.webkit < 100){\n\
  safariVersion = 1;\n} else if (engine.webkit < 312){\nsafariVersion = 1.2;\n} else\
  \ if (engine.webkit < 412){\nsafariVersion = 1.3;\n} else {\nsafariVersion = 2;\n\
  }\nbrowser.safari = browser.ver = safariVersion;\n}\n} else if (/KHTML\\/(\\S+)/.test(ua)\
  \ || /Konqueror\\/([^;]+)/.test(ua)){\nengine.ver = browser.ver = RegExp[\"$1\"\
  ];\nengine.khtml = browser.konq = parseFloat(engine.ver);\n} else if (/rv:([^\\\
  )]+)\\) Gecko\\/\\d{8}/.test(ua)){\nengine.ver = RegExp[\"$1\"];\nengine.gecko =\
  \ parseFloat(engine.ver);\n//determine if it's Firefox\nif (/Firefox\\/(\\S+)/.test(ua)){\n\
  browser.ver = RegExp[\"$1\"];\nbrowser.firefox = parseFloat(browser.ver);\n}\n}\
  \ else if (/MSIE ([^;]+)/.test(ua)){\nengine.ver = browser.ver = RegExp[\"$1\"];\n\
  engine.ie = browser.ie = parseFloat(engine.ver);\n}\n//detect browsers\nbrowser.ie\
  \ = engine.ie;\nbrowser.opera = engine.opera;\n//detect platform\nvar p = navigator.platform;\n\
  system.win = p.indexOf(\"Win\") == 0;\nsystem.mac = p.indexOf(\"Mac\") == 0;\nsystem.x11\
  \ = (p == \"X11\") || (p.indexOf(\"Linux\") == 0);\n//detect windows operating systems\n\
  if (system.win){\nif (/Win(?:dows )?([^do]{2})\\s?(\\d+.\\d+)?/.test(ua)){\nif (RegExp[\"\
  $1\"] == \"NT\"){\nswitch(RegExp[\"$2\"]){\ncase \"5.0\":\nsystem.win = \"2000\"\
  ;\nbreak;\ncase \"5.1\":\nsystem.win = \"XP\";\nbreak;\ncase \"6.0\":\nsystem.win\
  \ = \"Vista\";\nbreak;\ncase \"6.1\":\nsystem.win = \"7\";\nbreak;\ndefault:\nsystem.win\
  \ = \"NT\";\nbreak;\n}\n} else if (RegExp[\"$1\"] == \"9x\"){\nsystem.win = \"ME\"\
  ;\n} else {\nsystem.win = RegExp[\"$1\"];\n}\n}\n}\n//mobile devices\nsystem.iphone\
  \ = ua.indexOf(\"iPhone\") > -1;\nsystem.ipod = ua.indexOf(\"iPod\") > -1;\nsystem.ipad\
  \ = ua.indexOf(\"iPad\") > -1;\nsystem.nokiaN = ua.indexOf(\"NokiaN\") > -1;\n//windows\
  \ mobile\nif (system.win == \"CE\"){\nsystem.winMobile = system.win;\n} else if\
  \ (system.win == \"Ph\"){\nif(/Windows Phone OS (\\d+.\\d+)/.test(ua)){;\nsystem.win\
  \ = \"Phone\";\nsystem.winMobile = parseFloat(RegExp[\"$1\"]);\n}\n}\n//determine\
  \ iOS version\nif (system.mac && ua.indexOf(\"Mobile\") > -1){\nif (/CPU (?:iPhone\
  \ )?OS (\\d+_\\d+)/.test(ua)){\nsystem.ios = parseFloat(RegExp.$1.replace(\"_\"\
  , \".\"));\n} else {\nsystem.ios = 2;\n}\n}\n}\n```\n\n\n\n\n任何 HTML 或 XML 文档都可以使用\
  \ DOM 表示为节点的层次结构。有几种节点类型，每种类型都代表文档中不同的信息和/或标记。每种节点类型具有不同的特征、数据和方法，并且每个节点都可能与其他节点存在关系。这些关系形成了一个层级结构，允许标记被表示为以特定节点为根的树。例如，考虑以下\
  \ HTML：\n\n```html\n<html>\n    <head>\n        <title>Sample Page</title>\n   \
  \ </head>\n    <body>\n        <p>Hello World!</p>\n    </body>\n</html>\n```\n\n\
  这个简单的 HTML 文档可以以层次结构的形式表示，如图 10-1 所示。\n\n图 10-1\n\n![image](img/f310-01.jpg)\n\n\
  文档节点（document node）代表每个文档的根。在这个示例中，文档节点的唯一节点是 `html` 元素，被称为文档元素（document element）。文档元素是文档中最外层的元素，所有其他元素都存在于其中。每个文档只能有一个文档元素。在\
  \ HTML 页面中，文档元素始终是 `html` 元素。在 XML 中，由于没有预定义的元素，任何元素都可以作为文档元素。\n\n每一段标记都可以由树中的节点表示：HTML\
  \ 元素由元素节点（element nodes）表示，属性由属性节点（attribute nodes）表示，文档类型由文档类型节点（document type\
  \ node）表示，注释由注释节点（comment nodes）表示。共有 12 种节点类型，它们都继承自一个基类型。\n\n## 节点类型\n\nDOM Level\
  \ 1 定义了一个名为 `Node` 的接口，DOM 中所有的节点类型都应该实现它。`Node` 接口在 JavaScript 中实现为 `Node` 类型，在\
  \ Internet Explorer 之外的所有浏览器中都可以访问。所有的节点类型在 JavaScript 中都继承自 `Node`，因此所有节点类型共享相同的基本属性和方法。\n\
  \n每个节点都有一个 `nodeType` 属性，指示它是什么节点类型。节点类型由 `Node` 类型上的以下 12 个数字常量之一表示：\n\n- `Node.ELEMENT_NODE`\
  \ (1)\n- `Node.ATTRIBUTE_NODE` (2)\n- `Node.TEXT_NODE` (3)\n- `Node.CDATA_SECTION_NODE`\
  \ (4)\n- `Node.ENTITY_REFERENCE_NODE` (5)\n- `Node.ENTITY_NODE` (6)\n- `Node.PROCESSING_INSTRUCTION_NODE`\
  \ (7)\n- `Node.COMMENT_NODE` (8)\n- `Node.DOCUMENT_NODE` (9)\n- `Node.DOCUMENT_TYPE_NODE`\
  \ (10)\n- `Node.DOCUMENT_FRAGMENT_NODE` (11)\n- `Node.NOTATION_NODE` (12)\n\n通过与这些常量进行比较，很容易确定节点的类型，如下所示：\n\
  \n```javascript\nif (someNode.nodeType == Node.ELEMENT_NODE){   //在 IE < 9 中不起作用\n\
  \    alert(\"Node is an element.\");\n}\n```\n\n此示例将 `someNode.nodeType` 与 `Node.ELEMENT_NODE`\
  \ 常量进行比较。如果它们相等，意味着 `someNode` 实际上是一个元素。遗憾的是，由于 Internet Explorer 8 及之前的版本没有暴露 `Node`\
  \ 类型构造函数，这段代码会导致错误。为了跨浏览器兼容性，最好将 `nodeType` 属性与数值进行比较，如下所示：\n\n```javascript\nif\
  \ (someNode.nodeType == 1){   //在所有浏览器中有效\n    alert(\"Node is an element.\");\n\
  }\n```\n\n并不是所有的节点类型都受浏览器支持。开发者经常处理元素节点和文本节点。每种节点类型的支持程度和用法将在章节后部分讨论。\n\n## nodeName\
  \ 和 nodeValue 属性\n\n`nodeName` 和 `nodeValue` 两个属性提供了有关节点的特定信息。这些属性的值完全取决于节点类型。在使用这些值之一之前，先测试节点类型总是最好的做法，如下面代码所示：\n\
  \n```javascript\nif (someNode.nodeType == 1){\n    value = someNode.nodeName;  \
  \ //将是元素的标签名\n}\n```\n\n在这个示例中，检查了节点类型以判断该节点是否为元素。如果是，则将 `nodeName` 值赋值给变量。对于元素，`nodeName`\
  \ 始终等于元素的标签名，而 `nodeValue` 始终为 `null`。\n\n## 节点关系\n\n文档中的所有节点与其他节点之间都存在关系。这些关系用传统的家庭关系来描述，仿佛文档树是一棵家族树一样。在\
  \ HTML 中，`body` 元素被视为 `html` 元素的子；同样地，`html` 元素被视为 `body` 元素的父。`head` 元素被视为 `body`\
  \ 元素的兄弟，因为它们共享同一个直接父节点即 `html` 元素。\n\n每个节点都有一个 `childNodes` 属性，包含一个 `NodeList`。`NodeList`\
  \ 是一个类数组对象，用于存储一个可以通过位置访问的有序节点列表。请记住，尽管可以使用中括号法访问其值且存在存在 `length` 属性，但 `NodeList`\
  \ 并不是 `Array` 的实例。`NodeList` 对象的独特之处在于它们实际上是针对 DOM 结构运行的查询，因此更改会自动反映在 `NodeList`\
  \ 对象中。下面的示例显示了存储在 `NodeList` 中的节点可以通过括号法或 `item()` 方法访问：\n\n```javascript\nvar firstChild\
  \ = someNode.childNodes[0];\nvar secondChild = someNode.childNodes.item(1);\nvar\
  \ count = someNode.childNodes.length;\n```\n\n注意，可以使用 `Array.prototype.slice` 将\
  \ `NodeList` 转换为数组，如前所述。考虑以下示例：\n\n```javascript\n//在 IE8 中无效\narrayOfNodes = Array.prototype.slice.call(someNode.childNodes,0);\n\
  ```\n\n这种方法在除了 Internet Explorer 8 都会报错，因为它实现为 COM 对象，因此在需要 JScript 对象的地方无法使用。要在\
  \ Internet Explorer 中将 `NodeList` 转换为数组，必须手动遍历成员。以下函数在所有浏览器中有效：\n\n```javascript\n\
  function convertToArray(nodes){\n    var array = null;\n    try {\n        array\
  \ = Array.prototype.slice.call(nodes, 0); //IE 及以上版本\n    } catch (ex) {\n     \
  \   array = new Array();\n        for (var i=0, len=nodes.length; i < len; i++){\n\
  \            array.push(nodes[i]);\n        }\n    }\n    return array;\n}\n```\n\
  \n`convertToArray()` 函数首先尝试最简单的创建数组的方法。如果抛出异常（在 Internet Explorer 中会这样），异常会被 `try-catch`\
  \ 块捕获并手动创建数组。这是另一种兼容性检测形式。\n\n每个节点都有一个 `parentNode` 属性，指向其在文档树中的父节点。`childNodes`\
  \ 列表中的所有节点具有相同的父节点，因此它们的每个 `parentNode` 属性指向同一个节点。此外，`childNodes` 列表中的每个节点都被视为同一列表中其他节点的兄弟。可以通过\
  \ `previousSibling` 和 `nextSibling` 属性从列表中的一个节点导航到另一个节点。列表中的第一个节点的 `previousSibling`\
  \ 属性值为 `null`，而列表中的最后一个节点的 `nextSibling` 属性值为 `null`，如下例所示：\n\n```javascript\nif\
  \ (someNode.nextSibling === null){\n    alert(\"该节点是父级 childNodes 列表中的最后一个。\");\n\
  } else if (someNode.previousSibling === null){\n    alert(\"该节点是父级 childNodes 列表中的第一个。\"\
  );\n}\n```\n\n请注意，如果只有一个子节点，`nextSibling` 和 `previousSibling` 都将为 `null`。\n\n\n\n\
  \n\n父节点与其第一个和最后一个子节点之间存在另一种关系。`firstChild` 和 `lastChild` 属性分别指向 `childNodes` 列表中的第一个和最后一个节点。`someNode.firstChild`\
  \ 的值始终等于 `someNode.childNodes[0]`，而 `someNode.lastChild` 的值始终等于 `someNode.childNodes[someNode.childNodes.length-1]`。如果只有一个子节点，`firstChild`\
  \ 和 `lastChild` 指向同一个节点；如果没有子节点，则 `firstChild` 和 `lastChild` 均为 `null`。所有这些关系都有助于在文档结构中的节点之间进行轻松的导航。图\
  \ 10-2 阐了这些关系。\n\n图 10-2\n\n![image](img/f313-01.jpg)\n\n有了了这些关系，`childNodes` 属性与其说是一种必要，不如说是一种便利，因为通过简单地使用关系指针就可以到达文档树中的任何节点。另一个方便的方法是\
  \ `hasChildNodes()`，如果节点具有一个或多个子节点，它返回 `true`，并且比查询 `childNodes` 列表的长度更高效。\n\n最后一个关系是每个节点共有的。`ownerDocument`\
  \ 属性是一个指向代表整个文档的节点的指针。节点被认为由它们创建的文档所有（通常与它们所在的文档相同），因为节点不能同时存在于两个或多个文档中。该属性提供了一种快速访问节点的方法，而无需向上回溯节点层级到顶端。\n\
  \n![image](img/pen.gif)\n\n尽管所有节点类型都继承自 `Node`，但并不是所有节点类型都可以拥有子节点。节点类型之间的差异将在本章稍后部分讨论。\n\
  \n## 操作节点\n\n由于所有关系指针都是只读的，因此有几种方法可以操作节点。最常用的方法是 `appendChild()`，它将一个节点添加到 `childNodes`\
  \ 列表的末尾。这样做会更新新添加的节点、父节点以及 `childNodes` 列表中上一个末尾节点的所有关系指针。完成后，`appendChild()` 返回新添加的节点。以下是一个示例：\n\
  \n```\nvar returnedNode = someNode.appendChild(newNode);\nalert(returnedNode ==\
  \ newNode);         //true\nalert(someNode.lastChild == newNode);   //true\n```\n\
  \n如果传递到 `appendChild()` 的节点已经是文档的一部分，它将从其之前的位置被移除并放置在新位置。尽管 DOM 树是由一系列指针连接的，但任何\
  \ DOM 节点不能存在于文档中的多个一个位置。因此，如果你调用 `appendChild()` 并传递一个父节点的第一个子节点（如下例所示），它最终将成为最后一个子节点：\n\
  \n```\n// 假设 someNode 有多个子节点\nvar returnedNode = someNode.appendChild(someNode.firstChild);\n\
  alert(returnedNode == someNode.firstChild);  //false\nalert(returnedNode == someNode.lastChild);\
  \   //true\n```\n\n当需要将节点放置在 `childNodes` 列表中的特定位置（而不仅仅是末尾）时，可以使用 `insertBefore()`\
  \ 方法。`insertBefore()` 方法接受两个参数：要要插入的节点和一个引用节点。要插入的节点将成为引用节点的前一个兄弟，并最终由该方法返回。如果引用节点为\
  \ `null`，则 `insertBefore()` 的作用与 `appendChild()` 相同，如下例所示：\n\n```\n//作为最后一个子节点插入\n\
  returnedNode = someNode.insertBefore(newNode, null);\nalert(newNode == someNode.lastChild);\
  \  //true\n\n//作为第一个子节点插入\nreturnedNode = someNode.insertBefore(newNode, someNode.firstChild);\n\
  alert(returnedNode == newNode);         //true\nalert(newNode == someNode.firstChild);\
  \  //true\n\n//在最后一个子节点之前插入\nreturnedNode = someNode.insertBefore(newNode, someNode.lastChild);\n\
  alert(newNode == someNode.childNodes[someNode.childNodes.length-2]);  //true\n```\n\
  \n`appendChild()` 和 `insertBefore()` 都在插入节点时都不会移除任何节点。`replaceChild()` 方法接受两个参数：要插入的节点和要替换的节点。被替换的节点由函数返回，并从文档树中完全移除，而插入的节点占据其位置。以下是一个示例：\n\
  \n```\n// 替换第一个子节点\nvar returnedNode = someNode.replaceChild(newNode, someNode.firstChild);\n\
  \n// 替换最后一个子节点\nreturnedNode = someNode.replaceChild(newNode, someNode.lastChild);\n\
  ```\n\n当使用 `replaceChild()` 插入节点时，它所有的关系指针都从它所替换的节点复制而来。尽管被替换的节点技术上仍由同一个文档所有，但它不再在文档中具有特定位置。\n\
  \n要在不替换节点的情况下移除节点，你可以使用 `removeChild()` 方法。该方法接受单个参数，即要移除的节点。被移除的节点将作为函数的返回值，如下例所示：\n\
  \n```\n// 移除第一个子节点\nvar formerFirstChild = someNode.removeChild(someNode.firstChild);\n\
  \n// 移除最后一个子节点\nvar formerLastChild = someNode.removeChild(someNode.lastChild);\n\
  ```\n\n与 `replaceChild()` 类似，通过 `removeChild()` 移除的节点仍然由文档所有，但在文档中没有特定位置。\n\n这四种方法都作用于特定节点的直接子节点，这意味着要使用它们，你必须知道直接父节点（可以通过之前提到的\
  \ `parentNode` 属性访问）。并不是所有节点类型都有子节点，如果你对不支持的节点使用这些方法将会报错。\n\n## 其他方法\n\n所有节点类型共有两个方法。第一个是\
  \ `cloneNode()`，它创建被调用节点的精确克隆。`cloneNode()` 方法接受一个布尔参数，指示是否进行深拷贝。当参数为 `true` 时，会进行深拷贝，克隆节点及其整个子树；当为\
  \ `false` 时，仅克隆初始节点。返回的克隆节点由文档所有，但没有父节点。因此，克隆节点是一个孤儿，在通过 `appendChild()`、`insertBefore()`\
  \ 或 `replaceChild()` 添加之前并不存在于文档中。例如，考虑以下 HTML：\n\n```\n<ul>\n    <li>item 1</li>\n\
  \    <li>item 2</li>\n    <li>item 3</li>\n</ul>\n```\n\n如果将此 <ul> 元素的引用存储在变量 `myList`\
  \ 中，以下代码显示了 `cloneNode()` 方法的两种模式：\n\n```\nvar deepList = myList.cloneNode(true);\n\
  alert(deepList.childNodes.length);     //3 (IE < 9) 或 7 (其他)\n\nvar shallowList\
  \ = myList.cloneNode(false);\nalert(shallowList.childNodes.length);  //0\n```\n\n\
  在这个示例中，`deepList` 填充了 `myList` 的深拷贝，这意味着 `deepList` 有三个列表项目，每个项目都包含文本。`shallowList`\
  \ 是 `myList` 的浅拷贝，因此它没有子节点。`deepList.childNodes.length` 的差异由于 Internet Explorer\
  \ 8 及更早版本与其他浏览器处理空白的方式不同而导致。9 版本之前的 Internet Explorer 不会为空白创建节点。\n\n`cloneNode()`\
  \ 方法不会复制你添加到 DOM 节点上的 JavaScript 属性，例如事件处理程序。该方法只复制属性以及可选的子节点。其他所有内容都会丢失。Internet\
  \ Explorer 有一个 Bug，事件处理器也会被克隆，因此建议在克隆之前移除事件处理器。\n\n\n\n\n最后一种方法是 `normalize()`。它的唯一作用是处理文档子树中的文本节点。由于解析器的实现或\
  \ DOM 操作，可能会出现不包含任何文本的文本节点，或者互为相邻的文本节点。当在节点上调用 `normalize()` 时，会搜索该节点的后代中是否存在这两种情况。如果发现空文本节点，则将其删除；如果文本节点是紧相邻的兄弟节点，则将其合并为了单个文本节点。该方法将在本章稍后部分进一步讨论。\n\
  \n## 文档类型 (Document Type)\n\nJavaScript 通过 `Document` 类型表示文档节点。在浏览器中，文档对象是 `HTMLDocument`\
  \ 的实例（它继承自 `Document`），并代表整个 HTML 页面。文档对象是 `window` 的属性，因此可以全局访问。一个 `Document` 节点具有以下特征：\n\
  \n* `nodeType` 为 9。\n* `nodeName` 为 `\"#document\"`。\n* `nodeValue` 为 `null`。\n\
  * `parentNode` 为 `null`。\n* `ownerDocument` 为 `null`。\n* 子节点可以是 `DocumentType`（最多一个）、`Element`（最多一个）、`ProcessingInstruction`（处理指令）或\
  \ `Comment`（注释）。\n\n`Document` 类型可以表示 HTML 页面或其他基于 XML 的文档，尽管最常见的用法是通过文档对象使用 `HTMLDocument`\
  \ 实例。文档对象可用于获取有关页的信息，并操作其外观和底层结构。\n\n![image](img/pen.gif)\n\n`Document` 类型的构造函数和原型在\
  \ Firefox、Safari、Chrome 和 Opera 的脚本中是可以访问的。版本 9 的 Internet Explorer 仍然不支持 `Document`。`HTMLDocument`\
  \ 类型构造函数和原型在所有浏览器中都可以访问，包括从版本 8 开始的 Internet Explorer。\n\n## 文档子节点 (Document Children)\n\
  \n尽管 DOM 规范规定 `Document` 节点的节点可以是 `DocumentType`、`Element`、`ProcessingInstruction`\
  \ 或 `Comment`，但子节点有两种内置的快捷方式。第一个是 `documentElement` 属性，它始终指向 HTML 页面中的 `<html>`\
  \ 元素。文档元素也始终出现在 `childNodes` 列表中，但 `documentElement` 属性提供了对该元素更快、更直接的访问。考虑以下简单页面：\n\
  \n```html\n<html>\n    <body>\n\n    </body>\n</html>\n```\n\n当此页面被浏览器解析时，文档只有一个子节点，即\
  \ `<html>` 元素。该元素可以通过 `documentElement` 和 `childNodes` 列表访问，如下所示：\n\n```javascript\n\
  var html = document.documentElement;      //获取 <html> 的引用\nalert(html === document.childNodes[0]);\
  \   //true\nalert(html === document.firstChild);      //true\n```\n\n此示例显示 `document.documentElement`、`document.firstChild`\
  \ 和 `document.childNodes[0]` 的值都是相同的——三者都指向 `<html>` 元素。\n\n作为 `HTMLDocument` 的实例，文档对象还有一个\
  \ `body` 属性，直接指向 `<body>` 元素。由于该属性的存在，文档对象可以用于获取页面信息并操作其外观和底层结构。由于文档对象还有一个 `body`\
