  \ \"center\"。建议使用 \"start\" 和 \"end\" 代替 \"left\" 和 \"right\"，因为这些更符合从左到右语言和从右到左语言的渲染。\n\
  *   `textBaseline` — 指明文本的基线。可能值有 \"top\"\"hanging\"\"middle\"\"alphalphabetic\"\
