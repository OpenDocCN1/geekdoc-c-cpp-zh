  \ Explorer。\n\n## 文档子节点 (Document Children)\n\n（此处省略重复段落翻译，直接提供后续逻辑译文）\n\n\n\n\n\
  在这三个属性中，只有 `domain` 属性是允许设置的。由于安全问题，对 `domain` 的取值范围有一些限制。如果 URL 包含子域名，例如 [p2p.wrox.com](http://p2p.wrox.com)，则\
  \ `domain` 只能设置为 `wrox.com`（当 URL 包含“www,”时也是如此，例如 [www.wrox.com](http://www.wrox.com)）。该属性永远不能被设置为\
  \ URL 中不包含的域名，如下例所示：\n\n```\n//来自 p2p.wrox.com 的页面\n\ndocument.domain = \"wrox.com\"\
  ;        //成功\n\ndocument.domain = \"nczonline.net\";   //错误！\n```\n\n当页面上存在来自不同子域的帧或\
  \ `iframe` 时，设置 `document.domain` 非常有用。由于跨域安全限制，来自不同子域的页面无法通过 JavaScript 相互通信。通过将每个页面中的\
  \ `document.domain` 设置为相同的值，页面就可以互相访问对方的 JavaScript 对象。例如，如果页面是从 [www.wrox.com](http://www.wrox.com)\
  \ 加载的，并且它包含一个来自 [p2p.wrox.com](http://p2p.wrox.com) 的 `iframe`，则每个页面的 `document.domain`\
  \ 字符串将不同，外部页面和内部页面限制访问彼此的 JavaScript 对象。如果每个页面中的 `document.domain` 值都设置为 `wrox.com`，页面就可以进行通信。\n\
  \n浏览器的进一步限制允许 `domain` 属性一旦宽松，就不允许再收紧。这意味着你不能先将 `document.domain` 设置为 `wrox.com`，然后尝试将其改回\
  \ `p2p.wrox.com`，因为后者会导致错误，如下：\n\n```\n//来自 p2p.wrox.com 的页面\n\ndocument.domain\
  \ = \"wrox.com\";        //宽松 - 成功\n\ndocument.domain = \"p2p.wrox.com\";    //收紧\
  \ - 错误！\n```\n\n此限制存在于所有浏览器中，但从 Internet Explorer 8 版本开始实现。\n\n## 定位元素\n\n也许最常见的\
  \ DOM 活动是获取特定元素或一组元素的引用，以执行某些操作。这种功能通过 `document` 对象上的多个方法提供。`Document` 类型提供了两种方法来实现此目的：`getElementById()`\
  \ 和 `getElementsByTagName()`。\n\n`getElementById()` 方法接受单个参数——要检索的元素的 `ID` —— 如果找到，则返回该元素；如果不存在具有该\
  \ ID 的元素，则返回 `null`。`ID` 必须与页面上元素的 `id` 属性完全匹配，包括字符大小写。考虑以下元素：\n\n```\n<div id=\"\
  myDiv\">一些文本</div>\n```\n\n可以使用以下代码获取该元素：\n\n```\nvar div = document.getElementById(\"\
  myDiv\");    //获取对 <div> 的引用\n```\n\n然而，以下代码在除 Internet Explorer 7 及更早版本之外的所有浏览器中都将返回\
  \ `null`：\n\n```\nvar div = document.getElementById(\"mydiv\");    //无法工作（在 IE <=\
  \ 7 中除外）\n```\n\n第 8 版之前的 Internet Explorer 将 ID 视为不区分大小写的，因此 \"myDiv\" 和 \"mydiv\"\
  \ 被视为同一个元素 ID。\n\n如果页面中有多个具有相同 ID 的元素，`getElementById()` 返回文档中首先出现的元素。Internet Explorer\
  \ 7 及更早版本对此增加了一个有趣的特性，还会返回 `name` 属性匹配给定 `ID` 的表单元素（`<input>`、`<textarea>`,`<button>`\
  \ 和`<select>`）。如果这些表单元素之一的 `name` 属性等于指定的 `ID`，并且它在文档中出现在给定 ID 元素之前，Internet Explorer\
  \ 将返回该表单元素。例如：\n\n```\n<input type=\"text\" name=\"myElement\" value=\"文本字段\">\n\
  <div id=\"myElement\">一个 div</div>\n```\n\n使用此 HTML，在 Internet Explorer 7 中调用 `document.getElementById()`\
  \ 会返回 `<input>` 元素的引用，而在所有其他浏览器中，相同的调用返回 `<div>` 元素的引用。为了避免在 Internet Explorer 中出现这个问题，你应该确保表单字段没有等于其他元素\
  \ ID 的 `name` 属性。\n\n`getElementsByTagName()` 是另一个常用的获取元素引用的方法。它接受单个参数——要检索的元素的标签名称——并返回一个包含零或多个元素的\
  \ `NodeList`。在 HTML 文档中，此方法返回一个 `HTMLCollection` 对象，它与 `NodeList` 非常相似，因为它被认为是一个“活动”（live）集合。例如，以下代码检索页面中所有的\
  \ `<img>` 元素并返回一个 `HTMLCollection`：\n\n```\nvar images = document.getElementsByTagName(\"\
  img\");\n```\n\n此代码将 `HTMLCollection` 对象存储在 `images` 变量中。与 `NodeList` 对象一样，`HTMLCollection`\
  \ 对象中的项可以使用括号表示法或 `item()` 方法访问。可以通过 `length` 属性获取对象中的元素数量，如下例所示：\n\n```\nalert(images.length);\
  \        //输出图片数量\nalert(images[0].src);        //输出第一张图片的 src 属性\nalert(images.item(0).src);\
  \   //输出第一张图片的 src 属性\n```\n\n`HTMLCollection` 对象还有一个额外方法 `namedItem()`，它允许你通过名称引用集合中的项。例如，假设页面中有如下\
  \ `<img >` 元素：\n\n```\n<img src=\"myimage.gif\" name=\"myImage\">\n```（注：此处修正为 `<img>`）\n\
  \n可以从 `images` 变量中按如下方式获取该 `<img>` 元素的引用：\n\n```\nvar myImage = images.namedItem(\"\
  myImage\");\n```\n\n通过这种方式，`HTMLCollection` 除了提供索引项外，还让你访问命名项，这使得更容易获取确切需要的元素。你也可以使用括号表示法访问命名项，如下所示：\n\
  \n```\nvar myImage = images[\"myImage\"];\n```\n\n要检索文档中的所有元素，请向 `getElementsByTagName()`\
  \ 传递 `*`。星号在 JavaScript 和层叠样式表（CSS）中通常被视为“所有”。例如：\n\n```\nvar allElements = document.getElementsByTagName(\"\
  *\");\n```\n\n此行代码返回一个包含所有元素的 `HTMLCollection`，按它们出现的顺序排列。因此，第一个项是 `<html>` 元素，第二个是\
  \ `<head>` 元素，依此类推。Internet Explorer 8 及更早版本的实现实际上将注释转换为元素，因此调用 `getElementsByTagName(\"\
  *\")` 时浏览器将返回注释节点。Internet Explorer 9 不将注释视为元素，因此不返回它们。\n\n![image](img/pen.gif)\n\
  \n尽管规范规定标签名是区分大小写的，但为了与现有 HTML 页面最大兼容，`getElementsByTagName()` 方法是不区分大小写的。在 XML\
  \ 页面（包括 XHTML）中使用，`getElementsByTagName()` 将切换到区分大小写的模式。\n\n第三种方法仅定义在 `HTMLDocument`\
  \ 类型上，即 `getElementsByName()`。顾其名，该方法返回所有具有给定 `name` 属性的元素。`getElementsByName()`\
  \ 方法通常用于单选按钮，它们必须具有相同的 `name` 以确保将正确的值发送到服务器，如下例所示：\n\n```\n<fieldset>\n    <legend>你更喜欢什么颜色？</legend>\n\
  \    <ul>\n        <li><input type=\"radio\" value=\"red\" name=\"color\" id=\"\
  colorRed\">\n            <label for=\"colorRed\">红色</label></li>\n        <li><input\
  \ type=\"radio\" value=\"green\" name=\"color\" id=\"colorGreen\">\n           \
  \ <label for=\"colorGreen\">绿色</label></li>\n        <li><input type=\"radio\" value=\"\
  blue\" name=\"color\" id=\"colorBlue\">\n            <label for=\"colorBlue\">蓝色</label></li>\n\
  \    </ul>\n</fieldset>\n```\n\n\n\n\n在此代码中，所有单选按钮的 `name` 属性均为 `\"color\"`，尽管它们的\
  \ ID 是不同的。ID 允许 `<label>` 元素应用到单选按钮上，而 `name` 属性确保了三个值中只有一个会被发送到服务器。随后，可以使用以下代码获取所有这些单选按钮：\n\
  \n```\nvar radios = document.getElementsByName(\"color\");\n```\n\n与 `getElementsByTagName()`\
  \ 一样，`getElementsByName()` 方法返回一个 `HTMLCollection`。但在这种上下文中，`namedItem()` 方法始终检索第一个项目（因为所有项目具有相同的名称）。\n\
  \n## 特殊集合\n\n文档对象有几个特殊的集合。这些集合都是 `HTMLCollection` 对象，并提供了更快速访问文档常用部分的方法，如下：\n\n\
  - `document.anchors` — 包含文档中所有带有 `name` 属性的 `<a>` 元素。\n- `document.applets` — 包含文档中所有的\
  \ `<applet>` 元素。该集合已弃用，因为不再推荐使用 `<applet>` 元素。\n- `document.forms` — 包含文档中所有的 `<form>`\
  \ 元素。与 `document.getElementsByTagName(\"form\")` 相同。\n- `document.images` — 包含文档中所有的\
  \ `<img>` 元素。与 `document.getElementsByTagName(\"img\")` 相同。\n- `document.links`\
  \ — 包含文档中所有带有 `href` 属性的 `<a>` 元素。\n\n这些特殊集合在 `HTMLDocument` 对象上始终可用，并且像所有的 `HTMLCollection`\
  \ 对象一样，不断更新以匹配当前文档的内容。\n\n## DOM 符合性检测\n\n由于 DOM 有多个层级和多个部分，因此确定浏览器究竟实现了 DOM 的哪些部分是非常必要的。`document.implementation`\
  \ 属性是一个对象，包含了与浏览器实现 DOM 直接相关的信息和功能。DOM Level 1 只在 `document.implementation` 上指定了一个方法，即\
  \ `hasFeature()`。`hasFeature()` 方法接受两个参数：要检查的 DOM 特性的名称和版本。如果浏览器支持命名的特性和版本，该方法将返回\
  \ true，例如所示：\n\n```\nvar hasXmlDom = document.implementation.hasFeature(\"XML\"\
  , \"1.0\");\n```\n\n可以测试的各种值列在表所示。\n\n| 特性 | 支持的版本 | 描述 |\n| --- | --- | --- |\n\
  | Core | 1.0, 2.0, 3.0 | 基础 DOM，规定了使用层级树来表示文档 |\n| XML | 1.0, 2.0, 3.0 | Core 的\
  \ XML 扩展，增加了对 CDATA 节、处理指令和实体的支持 |\n| HTML | 1.0, 2.0 | XML 的 HTML 扩展，增加了对 HTML\
  \ 特有元素和实体的支持 |\n| Views | 2.0 | 根据某些样式完成文档格式化 |\n| StyleSheets | 2.0 | 将样式表与文档关联\
  \ |\n| CSS | 2.0 | 对层级样式表 Level 1 支持 |\n| CSS2 | 2.0 | 对层级样式表 Level 2 支持 |\n| Events\
  \ | 2.0, 3.0 | 通用 DOM 事件 |\n| UIEvents | 2.0, 3.0 | 用户界面事件 |\n| MouseEvents | 2.0,\
  \ 3.0 | 由鼠标引起的事件（点击、悬停等） |\n| MutationEvents | 2.0, 3.0 | DOM 树改变时触发的事件 |\n| HTMLEvents\
  \ | 2.0 | HTML 4.01 事件 |\n| Range | 2.0 | 用于操作 DOM 树中范围的对象和方法 |\n| Traversal | 2.0\
  \ | 遍历 DOM 树的方法 |\n| LS | 3.0 | 文件与 DOM 树之间的同步加载和保存 |\n| LS-Async | 3.0 | 文件与 DOM\
  \ 树之间的异步加载和保存 |\n| Validation | 3.0 | 修改 DOM 树并保持其有效的方法 |\n\n尽管这是一个很方便的功能，但使用 `hasFeature()`\
  \ 的缺点是实现者可以决定实现是否确实符合 DOM 规范的各个部分。很容易让此方法对任何所有值都返回 true，但这并不意味着该实现符合它所声称的所有规范。例如，Safari\
  \ 2.x 及更早版本对某些未完全实现的特性返回 true。在大多数情况下，在使用 DOM 的特定部分之前，除了 `hasFeature()` 之外，结合使用能力检测是一个好主意。\n\
  \n## 文档写入\n\n文档对象较旧的功能之一是向网页的输出流写入内容。这种能力以四种方法的形式存在：`write()`、`writeln()`、`open()`\
  \ 和 `close()`。`write()` 和 `writeln()` 方法各接受一个字符串参数以写入输出流。`write()` 只是将文本原样添加，而 `writeln()`\
  \ 在字符串末尾附加一个换行符（`\\n`）。这两种方法可以在页面加载时动态地向页面添加内容，如下例：\n\n![image](img/logo1.gif)\n\
  \n```\n<html\n<head>\n    <title>document.write() 示例</title>\n</head>\n<body>\n\
  \    <p>当前日期和时间是：\n    <script type=\"text/javascript\">\n        document.write(\"\
  <strong>\" + (new Date()).toString() + \"</strong>\");\n    </script>\n    </p>\n\
  </body>\n</html>\n```\n\n### DocumentWriteExample1.htm\n\n此示例在页面加载时输出当前日期和时间。日期被封装在\
  \ `<strong>` 元素中，处理方式就像它是动态包含的。`write()` 和 `writeln()` 方法通常用于包含外部资源，如 JavaScript\
  \ 文件。在包含 JavaScript 文件时，你必须确保不要直接包含字符串 `</script>`，如下例所示，因为会被将其解释为脚本块的结束：\n\n```\n\
  <html>\n<head>\n    <title>document.write() 示例</title>\n</head>\n<body>\n    <script\
  \ type=\"text/javascript\">\n        document.write(\"<script type=\\\"text/javascript\\\
  \">\");\n    </script>\n</body>\n</html>\n```\n\n### DocumentWriteExample2.htm\n\
  \n尽管此文件看起来是正确的，但 `</script>` 字符串会被解释为匹配外层的 `<script>` 标签，这意味着页面上会出现额外的内容。为了避免这种情况，你只需要更改字符串，如第\
  \ 2 章所述：\n\n```\n<html>\n<head>\n    <title>document.write() 示例</title>\n</head>\n\
  <body>\n    <script type=\"text/javascript\">\n        document.write(\"<script\
  \ type=\\\"text/javascript\\\" src=\\\"file.js\\\">\" + \"</script>\");\n    </script>\n\
  </body>\n</html>\n```\n\n### DocumentWriteExample3.htm\n\n`</script>` 不再注册为外层 `<script>`\
  \ 标签的结束标签，因此页面没有额外的输出。之前的示例使用 `document.write()` 在页面渲染时直接向页面输出内容。如果在页面完全加载后调用 `document.write()`，它将覆盖整个页面，如下所示：\n\
  \n```\n<html>\n<head>\n    <title>document.write() 示例</title>\n</head>\n<body>\n\
  \    <p>这是一些你无法看到的内容，因为它们会被覆盖。</p>\n    <script type=\"text/javascript\">\n    \
  \    window.onload = function(){\n            document.write(\"Hello world!\");\n\
  \        };\n    </script>\n</body>\n</html>\n```\n\n### DocumentWriteExample04.htm\n\
  \n在此示例中，使用 `window.onload` 事件处理器来推迟函数的执行，直到页面完全加载（事件在第 13 章中讨论）。当这种情况发生时，字符串 \"\
  Hello world!\" 将覆盖整个页面内容。\n\n`open()` 和 `close()` 方法分别用于打开和关闭网页输出流。在页面加载过程中使用 `write()`\
  \ 或 `writeln()` 时，不需要使用任何一个方法。\n\n![image](img/pen.gif)\n\n\n\n\n严格的 XHTML 文档不支持文档写入。对于使用\
  \ `application/xml+xhtml` 内容类型提供的页面，这些方法将无法工作。\n\n## 元素类型 (The Element Type)\n\n\
  在文档类型（Document）之外，`Element` 类型在 Web 编程中使用得最多。`Element` 类型表示 XML 或 HTML 元素，提供了访问其标签名、子节点和属性等信息的能力。`Element`\
  \ 节点具有以下特征：\n\n- `nodeType` 为 `1`。\n- `nodeName` 是元素的标签名。\n- `nodeValue` 为 `null`。\n\
  - `parentNode` 可能是 `Document` 或 `Element`。\n- 子节点可能是 `Element`、`Text`、`Comment`、`ProcessingInstruction`、`CDATASection`\
  \ 或 `EntityReference`。\n\n元素的标签名可以通过 `nodeName` 属性或通过使用 `tagName` 属性来访问；这两个属性都返回相同的值（后者通常用于提高代码可读性）。考虑以下元素：\n\
  \n```\n<div id=\"myDiv\"></div>\n```\n\n可以通过以下方式获取此元素并访问其标签名：\n\n```\nvar div =\
  \ document.getElementById(\"myDiv\");\nalert(div.tagName);    //\"DIV\"\nalert(div.tagName\
  \ == div.nodeName);   //true\n```\n\n所讨论的元素标签名为 `div`，ID 为 \"myDiv\"。但注意，`div.tagName`\
  \ 实际上输出的是 \"DIV\" 而不是 \"div\"。当用于 HTML 时，标签名始终以全大写形式表示；当用于 XML（包括 XHTML）时，标签名始终与源代码的大小写一致。如果你不确定脚本将运行在\
  \ HTML 还是 XML 文档上，最好在比较之前将标签名转换为统一的大小写，如下示例所示：\n\n```\nif (element.tagName == \"\
  div\"){  //应避免！容易出错！\n    //在此处执行某些操作\n}\n\nif (element.tagName.toLowerCase() ==\
  \ \"div\"){ //推荐 - 适用于所有文档\n    //在此处执行某些操作\n}\n```\n\n此示例显示了对 `tagName` 属性的两种比较。第一种方法很容易出错，因为它在\
  \ HTML 文档中无法工作。第二种方法（将标签名转换为全小写）是优的，因为它同时适用于 HTML 和 XML 文档。\n\n![image](img/pen.gif)\n\
  \n`Element` 类型构造函数和原型在所有现代浏览器中都可以脚本访问，包括版本 8 的 Internet Explorer。较旧的浏览器，如版本 2 之前的\
  \ Safari 和版本 8 之前的 Opera，不支持 `Element` 类型构造函数。\n\n## HTML 元素 (HTML Elements)\n\n\
  所有 HTML 元素都由 `HTMLElement` 类型表示，直接表示或通过子类型表示。`HTMLElement` 直接继承自 `Element` 并添加了几个属性。每个属性代表了每个\
  \ HTML 元素上可用的以下标准属性之一：\n\n- `id` — 元素在文档中的唯一标识符。\n- `title` — 关于元素的附加信息，通常以工具提示的形式表示。\n\
  - `lang` — 元素内容的语言代码（较很少使用）。\n- `dir` — 语言方向，“ltr\"（从左到右）或 \"rtl\"（从右到左）；也较少使用。\n\
  - `className` — `class` 属性的等价项，用于指定元素上的 CSS 类。该属性不能命名为 `class`，因为 `class` 是 ECMAScript\
  \ 的保留字（有关保留字的信息请参见第 1 章）。\n\n这些属性每一个都可以用于获取相应的属性值，也可以用于更改该值。考虑以下 HTML 元素：\n\n![image](img/logo1.gif)\n\
  \n```\n<div id=\"myDiv\" class=\"bd\" title=\"Body text\" lang=\"en\" dir=\"ltr\"\
  ></div>\n```\n\nHTMLElementsExample01.htm\n\n可以使用以下 JavaScript 代码获取此元素指定的所有信息：\n\
  \n```\nvar div = document.getElementById(\"myDiv\");\nalert(div.id);         //\"\
  myDiv\"\nalert(div.className);  //\"bd\"\nalert(div.title);      //\"Body text\"\
  \nalert(div.lang);       //\"en\"\nalert(div.dir);        //\"ltr\"\n```\n\n还可以使用以下代码通过给属性分配新值来更改每个属性：\n\
  \n```\ndiv.id = \"someOtherId\";\ndiv.className = \"ft\";\ndiv.title = \"Some other\
  \ text\";\ndiv.lang = \"fr\";\ndiv.dir =\"rtl\";\n```\n\nHTMLElementsExample01.htm\n\
  \n并不是所有属性在被重写时都会对页面产生变化。对 `id` 或 `lang` 的更改对用户来说是透明的（假设没有基于这些值的 CSS 样式），而对 `title`\
  \ 的更改只有在鼠标移动到元素上时可见。对 `dir` 的更改会在属性写入后立即导致页面上的文本对齐到左侧或右侧。如果 `className` 的更改对应的类与之前的具有不同的\
  \ CSS 样式信息，可能会立即显示。\n\n如前所述，所有 HTML 元素都由 `HTMLElement` 实例或更具体的子类型表示。下表列出了每个 HTML\
  \ 元素及其关联类型（斜体元素为已弃用）。注意，这些类型可以在 Opera、Safari、Chrome 和 Firefox 中通过 JavaScript 访问，但在版本\
  \ 8 之前的 Internet Explorer 中无法访问。\n\n![image](img/f328-01.jpg) ![image](img/f329-01.jpg)\
  \ ![image](img/f330-01.jpg)\n\n这些类型中的每一个都有与其关联的属性和方法。这些类型在书中会有很多讨论。\n\n## 获取属性 (Getting\
  \ Attributes)\n\n每个元素可以有零或多个属性，这些属性通常用于提供有关元素或内容的额外信息。处理属性的三个主要 DOM 方法是 `getAttribute()`、`setAttribute()`\
  \ 和 `removeAttribute()`。这些方法适用于任何属性，包括定义在 `HTMLElement` 类型上的那些属性。这里有一个示例：\n\n```\n\
  var div = document.getElementById(\"myDiv\");\nalert(div.getAttribute(\"id\"));\
  \         //\"myDiv\"\nalert(div.getAttribute(\"class\"));      //\"bd\"\nalert(div.getAttribute(\"\
  title\"));      //\"Body text\"\nalert(div.getAttribute(\"lang\"));       //\"en\"\
  \nalert(div.getAttribute(\"dir\"));        //\"ltr\"\n```\n\n注意传入 `getAttribute()`\
  \ 的属性名与实际属性名完全相同（当作为对象属性访问时，需要使用 `className`）。如果不存在指定的属性，`getAttribute()` 始终返回 `null`。\n\
  \n`getAttribute()` 方法还可以检索并非正式 HTML 语言部分的自定义属性值。考虑以下元素：\n\n```\n<div id=\"myDiv\"\
  \ my_special_attribute=\"hello!\"></div>\n```\n\n在此元素中，定义了一个名为 `my_special_attribute`\
  \ 的自定义属性，其值为 \"hello!\"。可以像获取其他属性一样使用 `getAttribute()` 获取该值，如下所示：\n\n```\nvar value\
  \ = div.getAttribute(\"my_special_attribute\");\n```\n\n注意属性名是不区分大小写的，因此 \"ID\"\
  \ 和 \"id\" 被视为同一个属性。此外注意，根据 HTML5 的标准，自定义属性应该以 `data-` 开头以便验证。\n\n元素上的属性也可以作为 DOM\
  \ 元素对象的属性进行访问。当然，`HTMLElement` 上定义的五个属性直接映射到相应的属性，但所有识别（非自定义）属性都会作为属性添加到对象中。考虑以下元素：\n\
  \n```\n<div id=\"myDiv\" align=\"left\" my_special_attribute=\"hello\"></div>\n\
  ```\n\n由于 `id` 和 `align` 是 HTML 中 `<div>` 元素的识别属性，它们将作为元素的属性表示。`my_special_attribute`\
  \ 属性是自定义的，因此在 Safari、Opera、Chrome 或 Firefox 中不会显示为元素的属性。直到版本 8 的 Internet Explorer\
  \ 也会为属性创建属性，正如此示例所示：\n\n![image](img/logo1.gif)\n\n```\nalert(div.id);         \
  \           //\"myDiv\"\nalert(div.my_special_attribute);  //undefined（在 IE 中除外）\n\
  alert(div.align);                 //\"left\"\n```\n\nElementAttributesExample02.htm\n\
  \n\n\n\n\n有两种属性的属性名与 `getAttribute()` 返回的相同值不直接对应。第一种属性是 `style`，它用于使用 CSS 指定元素的样式信息。当通过\
  \ `getAttribute()` 访问时，`style` 属性包含 CSS 文本，而通过返回对象的属性访问它时，则返回一个对象。`style` 属性用于通过编程方式访问元素的样式（在第\
  \ 12 章中讨论），因此它不直接映射到 `style` 属性。\n\n第二类行为不同的属性是事件处理程序属性，例如 `onclick`。当在元素上使用时，`onclick`\
  \ 属性包含 JavaScript 代码，使用 `getAttribute()` 时会返回该代码字符串。然而，当访问 `onclick` 属性时，它返回一个 JavaScript\
  \ 函数（如果未指定该属性则返回 `null`）。这是因为 `onclick` 和其他事件处理属性的提供方式是允许向它们赋值函数的。\n\n由于这些差异，开发者在用\
  \ JavaScript 编写 DOM 时往往倾向于放弃 `getAttribute()`，转而完全使用对象属性。`getAttribute()` 方法主要用于获取自定义属性的值。\n\
  \n![image](img/pen.gif)\n\n在 Internet Explorer 7 及之前的版本中，针对 `style` 属性和 `onclick`\
  \ 等事件处理属性的 `getAttribute()` 方法始终返回与通过属性访问时相同的值。因此，`getAttribute(\"style\")` 返回一个对象，而\
  \ `getAttribute(\"onclick\")` 返回一个函数。尽管这在 Internet Explorer 8 中得到了修复，但这种不一致性是避免对\
  \ HTML 属性使用 `getAttribute()` 的另一个原因。\n\n### 设置属性\n\n`getAttribute()` 的对应方法是 `setAttribute()`，它接受两个参数：要设置的属性名及其值。如果属性已存在，`setAttribute()`\
  \ 将其值替换为指定的值；如果属性不存在，`setAttribute()` 将创建它并设置其值。这里有一个示例：\n\n![image](img/logo1.gif)\n\
  \n```\ndiv.setAttribute(\"id\", \"someOtherId\");\ndiv.setAttribute(\"class\", \"\
  ft\");\ndiv.setAttribute(\"title\", \"Some other text\");\ndiv.setAttribute(\"lang\"\
  ,\"fr\");\ndiv.setAttribute(\"dir\", \"rtl\");\n```\nElementAttributesExample01.htm\n\
  \n`setAttribute()` 方法对 HTML 属性和自定义属性的处理相同。使用此方法设置属性时，属性名会被归一化为小写，因此 \"ID\" 最终变为\
  \ \"id\"。\n\n由于所有属性都是属性，直接给属性赋值可以设置属性值，如下所示：\n\n```\ndiv.id = \"someOtherId\";\n\
  div.align = \"left\";\n```\n\n注意，如下例示例所示，向 DOM 元素添加自定义属性并自动使其成为该元素的属性：\n\n```\n\
  div.mycolor = \"red\";\nalert(div.getAttribute(\"mycolor\"));   //null（在 Internet\
  \ Explorer 中除外）\n```\n此示例添加了一个名为 `mycolor` 的自定义属性并将其值设置为 `\"red\"`。在大多数浏览器中，该属性不会自动成为元素的属性，因此调用\
  \ `getAttribute()` 获取同名属性会返回 `null`。然而，在 Internet Explorer 中，自定义属性被视为元素的属性，反之亦然。\n\
  \n![image](img/pen.gif)\n\nInternet Explorer 7 及之前的版本在 `setAttribute()` 方面存在一些异常行为。尝试设置\
  \ `class` 或 `style` 属性没有效果，类似于使用 `setAttribute()` 设置事件处理属性。尽管这些问题在 Internet Explorer\
  \ 8 中已得到解决，但最好的方法始终使用属性来设置这些属性。\n\n最后一个方法是 `removeAttribute()`，它从元素中完全移除属性。这不仅仅是清除属性值；它会从元素中完全删除该属性，如下所示：\n\
  \n```\ndiv.removeAttribute(\"class\");\n```\n此方法并不频繁使用，但在序列化 DOM 元素时指定具体要包含哪些属性时可能非常有用。\n\
  \n![image](img/pen.gif)\n\nInternet Explorer 6 及之前的版本不支持 `removeAttribute()`。\n\n\
  ### attributes 属性\n\n`Element` 类型是唯一使用 `attributes` 属性的 DOM 节点类型。`attributes` 属性包含一个\
  \ `NamedNodeMap`，这是一个类似于 `NodeList` 的“动态”集合。元素上的每个属性由一个 `Attr` 节点表示，每个节点都存储在 `NamedNodeMap`\
  \ 对象中。`NamedNodeMap` 对象具有以下方法：\n\n* `getNamedItem(name)` — 返回 `nodeName` 属性等于 `name`\
  \ 的节点。\n* `removeNamedItem(name)` — 从列表中移除 `nodeName` 属性等于 `name` 的节点。\n* `setNamedItem(node)`\
  \ — 将节点添加到列表中，并用其 `nodeName` 属性进行索引。\n* `item(pos)` — 返回数值位置 `pos` 节点。\n\n`attributes`\
  \ 属性中的每个节点都是一个 `nodeName` 为属性名且 `nodeValue` 为属性值的节点。要获取元素的 `id` 属性，可以使用以下代码：\n\n\
  ```\nvar id = element.attributes.getNamedItem(\"id\").nodeValue;\n```\n以下是使用方括号符号通过名称访问属性的简写符号：\n\
  \n```\nvar id = element.attributes[\"id\"].nodeValue;\n```\n也可以使用这种表示法来设置属性值，获取属性节点然后将\
  \ `nodeValue` 设置为新值，如示例所示：\n\n```\nelement.attributes[\"id\"].nodeValue = \"someOtherId\"\
  ;\n```\n`removeNamedItem()` 方法的功能与元素上的 `removeAttribute()` 方法相同——它简单地移除指定名称的属性。以下示例显示了\
  \ `removeNamedItem()` 返回表示该属性的 `Attr` 节点：\n\n```\nvar oldAttr = element.attributes.removeNamedItem(\"\
  id\");\n```\n`setNamedItem()` 是一个很少使用的方法，通过传递属性节点向元素添加新属性，如所示：\n\n```\nelement.attributes.setNamedItem(newAttr);\n\
  ```\n通常情况下，由于其简单性，`getAttribute()`、`removeAttribute()` 和 `setAttribute()` 方法优于之前的任何属性方法。\n\
  \n`attributes` 属性的一个有用区域是遍历属性。这通常在序列化 DOM 结构时完成。以下代码遍历元素的每个属性并构造格式为 name=“value”\
  \ name=“value”的字符串：\n\n![image](img/logo1.gif)\n\n```\nfunction outputAttributes(element){\n\
  \    var pairs = new Array(),\n        attrName,\n        attrValue,\n        i,\n\
  \        len;\n\n    for (i=0, len=element.attributes.length; i < len; i++){\n \
  \       attrName = element.attributes[i].nodeName;\n        attrValue = element.attributes[i].nodeValue;\n\
  \        pairs.push(attrName + \"=\\\"\" + attrValue + \"\\\"\");\n    }\n    return\
  \ pairs.join(\" \");\n}\n```\nElementAttributesExample03.htm\n\n关于此代码的工作方式有几点需要注意：\n\
  \n* 浏览器在 `attributes` 对象中返回属性的顺序存在差异。属性在 HTML 或 XML 代码中出现的顺序并不一定是它们在 `attributes`\
  \ 对象中出现的顺序。\n* Internet Explorer 7 及之前的版本会返回 HTML 元素所有可能的属性，即使这些属性未被指定。这意味着通常会返回\
  \ 100 多个属性。\n\n\n\n\n之前的函数可以进行扩展，以确保只包含指定的属性，从而解决 Internet Explorer 7 及更早版本的问题。每个属性节点都有一个名为\
  \ `specified` 的属性，当属性作为 HTML 属性或通过 `setAttribute()` 方法指定时，该属性被设置为 `true`。对于 Internet\
  \ Explorer，这些额外属性的该值为 `false`，而在其他浏览器中不存在这些额外属性（因此，任何任何属性节点的 `specified` 始终为 `true`）。代码可以扩展如下：\n\
  \n![image](img/logo1.gif)\n\n```javascript\nfunction outputAttributes(element){\n\
  \    var pairs = new Array(),\n        attrName,\n        attrValue,\n        i,\n\
  \        len;\n\n    for (i=0, len=element.attributes.length; i < len; i++){\n \
  \       attrName = element.attributes[i].nodeName;\n        attrValue = element.attributes[i].nodeValue;\n\
  \        if (element.attributes[i].specified){\n            pairs.push(attrName\
  \ + \"=\\\"\" + attrValue + \"\\\"\");\n        }\n    }\n    return pairs.join(\"\
  \ \");\n}\n```\n\nElementAttributesExample04.htm\n\n修订后的函数确保了对于 Internet Explorer\
  \ 7 及更早版本仅返回指定的属性。\n\n## 创建元素\n\n可以使用 `document.createElement()` 方法创建新元素。该方法接受一个参数，即要创建的元素的标签名。在\
  \ HTML 文档中，标签名是不区分大小写的，而在 XML 文档（包括 XHTML）中，它是区分大小写的。要创建一个 `<div>` 元素，可以使用以下代码：\n\
  \n```javascript\nvar div = document.createElement(\"div\");\n```\n\n使用 `createElement()`\
  \ 方法会创建一个新元素并设置其 `ownerDocument` 属性。此时，你可以操作元素的属性、为它添加更多子元素等。考虑以下示例：\n\n```javascript\n\
  div.id = \"myNewDiv\";\ndiv.className = \"box\";\n```\n\n在新元素上设置这些属性仅分配了信息。由于该元素不属于文档树的一部分，因此它不会影响浏览器的显示。可以使用\
  \ `appendChild()`、`insertBefore()` 或 `replaceChild()` 将元素添加到文档树。以下代码将新创建的元素添加到文档的\
  \ `<body>` 元素中：\n\n```javascript\ndocument.body.appendChild(div);\n```\n\nCreateElementExample01.htm\n\
  \n一旦元素被添加到文档树，浏览器会立即渲染它。在此之后对元素进行的任何更改都会被浏览器立即反映。\n\nInternet Explorer 允许 `createElement()`\
  \ 的另一种用法，允许你指定一个完整的元素（包括属性），如此示例所示：\n\n```javascript\nvar div = document.createElement(\"\
  <div id=\\\"myNewDiv\\\" class=\\\"box\\\"></div>\");\n```\n\n这种用法有助于解决 Internet\
  \ Explorer 7 及更早版本中关于动态创建元素的一些问题。已知问题如下：\n\n*   动态创建的 `<iframe>` 元素无法设置 `name` 属性。\n\
  *   动态创建的 `<input>` 元素不会通过表单的 `reset()` 方法重置（第 14 章讨论过）。\n*   类型为 \"reset\" 的动态创建的\
  \ `<button>` 元素不会重置表单。\n*   具有相同名称的动态创建的单选按钮之间没有任何关系。相同名称的单选按钮应该是同一个选项的不同值，但动态创建的单选按钮会丢失这种关系。\n\
  \n这些问题中的每一个都可以在 `createElement()` 中指定标签的完整 HTML 来解决，如下所示：\n\n```javascript\nif (client.browser.ie\
  \ && client.browser.ie <= 7){\n\n    // 创建带有名称的 iframe\n    var iframe = document.createElement(\"\
  <iframe name=\\\"myframe\\\"></iframe>\");\n\n    // 创建 input 元素\n    var input\
  \ = document.createElement(\"<input type=\\\"checkbox\\\">\");\n\n    // 创建按钮\n\
  \    var button = document.createElement(\"<button type=\\\"reset\\\"></button>\"\
  );\n\n    // 创建单选按钮\n    var radio1 = document.createElement(\"<input type=\\\"\
  radio\\\" name=\\\"choice\\\"\" +\n        \" value=\\\"1\\\">\");\n    var radio2\
  \ = document.createElement(\"<input type=\\\"radio\\\" name=\\\"choice\\\"\" + \n\
  \        \" value=\\\"2\\\">\");\n\n}\n```\n\n与使用 `createElement()` 的传统方式一样，这样使用它会返回一个\
  \ DOM 元素引用，该引用可以添加到文档中进行其他扩展。只有在处理 Internet Explorer 7 及更早版本中的这些特定问题之一时，才推荐这种用法，因为需要检测浏览器。注意，没有其他浏览器支持这种用法。\n\
  \n## 元素节点\n\n元素可以有任意数量的子元素和后代，因为元素可以是元素的子元素。`childNodes` 属性包含元素的所有直接子节点，这些节点可能是其他元素、文本节点、注释或处理指令。浏览器在识别这些节点方面存在显著差异。例如，考虑以下代码：\n\
  \n```html\n<ul id=\"myList\">\n    <li>Item 1</li>\n    <li>Item 2</li>\n    <li>Item\
  \ 3</li>\n</ul>\n```\n\n当这段代码在 Internet Explorer 8 及更早版本中解析时，`<ul>` 元素有三个子节点，每个\
  \ `<li>` 元素对应一个节点。在所有其他浏览器中，`<ul>` 元素有七个元素：三个 `<li>` 元素和四个表示 `<li>` 元素之间空白字符的文本节点。如果删除了元素之间的空白字符（如后续示例所示），所有浏览器都将返回相同数量的子节点：\n\
  \n```html\n<ul id=\"myList\"><li>Item 1</li><li>Item 2</li><li>Item 3</li></ul>\n\
  ```\n\n使用此代码，所有浏览器都为 `<ul>` 元素返回三个子节点。在使用 `childNodes` 属性导航节点时，请记住这些浏览器差异。通常在执行操作之前需要检查\
  \ `nodeType`，如下示例所示：\n\n```javascript\nfor (var i=0, len=element.childNodes.length;\
  \ i < len; i++){\n    if (element.childNodes[i].nodeType == 1){\n        // 处理\n\
  \    }\n}\n```\n\n这段代码遍历特定元素的子节点，仅当 nodeType 为 1（元素节点）时执行操作。\n\n要获取特定标签名的子节点和其他后代，元素也支持\
  \ `getElementsByTagName()` 方法。在元素上使用该方法与文档版本完全相同，但搜索是基于该元素的，因此返回的是该元素的后代。在本节之前的\
  \ `<ul>` 代码中，可以使用以下代码获取 `<li>` 元素：\n\n```javascript\nvar ul = document.getElementById(\"\
  myList\");\nvar items = ul.getElementsByTagName(\"li\");\n```\n\n请记住，这样做是因为 `<ul>`\
  \ 元素只有一层后代。如果有更多层次，所有层级的 `<li>` 元素都将被返回。\n\n## 文本类型\n\n文本节点由 Text 类型表示并包含纯文本，这些文本会被字面解释，可能包含转义的\
  \ HTML 字符但不包含 HTML 代码。文本节点具有以下特征：\n\n*   `nodeType` 为 3。\n*   `nodeName` 为 `\"#text\"\
  `。\n*   `nodeValue` 为节点包含的文本。\n*   `parentNode` 为元素。\n*   不支持子节点。\n\n文本节点包含的文本可以通过\
  \ `nodeValue` 属性或 `data` 属性访问，两者都包含相同的值。对 `nodeValue` 或 `data` 的更改也会反映在另一个上。以下方法允许对节点文本进行操作：\n\
  \n*   `appendData(text)` —— 在节点末尾追加文本。\n*   `deleteData(offset, count)` —— 从位置 `offset`\
  \ 开始删除 `count` 个字符。\n*   `insertData(offset, text)` —— 在位置 `offset` 处插入文本。\n*  \
  \ `replaceData(offset, count, text)` —— 将从 `offset` 到 `offset + count` 的文本替换为 `text`。\n\
  *   `splitText(offset)` —— 将文本节点分为两个文本节点，在位置 `offset` 处分开。\n\n\n\n\n*   `substringData(offset,\
  \ count)` — 从文本中从位置 `offset` 开始提取字符串，一直持续到 `offset + count`。\n\n除了这些方法外，`length`\
  \ 属性返回节点中的字符数。此值与使用 `nodeValue.length` 或 `data.length` 相同。\n\n默认情况下，每个可能包含内容的元素在有内容时，最多有一个文本节点。这里有一个示例：\n\
  \n```html\n<!-- 没有内容，所以没有文本节点 -->\n<div></div>     \n\n<!-- 有空白内容，所以有一个文本节点 -->\n\
  <div> </div>     \n\n<!-- 有内容，所以有一个文本节点 -->\n<div>Hello World!</div>\n```\n\n此此代码中的第一个\
  \ `<div>` 元素没有内容，因此没有文本节点。起始标签和结束标签之间的任何内容都意味着必须创建一个文本节点，因此第二个 `<div>` 元素即使其内容是空白字符，也只有一个文本节点作为子节点。该文本节点的\
  \ `nodeValue` 是单个空格。第三个 `<div>` 也有一个文本节点，其 `nodeValue` 为 `\"Hello World!\"`。以下代码允许您访问此节点：\n\
  \n```javascriptvar textNode = div.firstChild;  //或 div.childNodes[0]\n```\n\n一旦获取到文本节点的引用，就可以像这样进行更改：\n\
  \n![image](img/logo1.gif)\n\n```javascriptdiv.firstChild.nodeValue = \"Some other\
  \ message\";\n```\n\nTextNodeExample01.htm\n\n只要节点当前在文档树中，对文本节点的更改将立即反映。关于更改文本节点值的另一个注意点是，字符串经过了\
  \ HTML 或 XML 编码（取决于文档类型），这意味着任何小于、大于符号或引号都会被转义，如示例所示：\n\n![image](img/logo1.gif)\n\
  \n```javascript\n//输出为 \"Some &lt;strong&gt;other&lt;/strong&gt; message\"\ndiv.firstChild.nodeValue\
  \ = \"Some <strong>other</strong> message\";\n```\n\nTextNodeExample02.htm\n\n这是在将字符串插入到\
  \ DOM 文档之前，对字符串进行 HTML 编码的有效方法。\n\n![image](img/pen.gif)\n\n`Text` 类型的构造函数和原型在 Internet\
  \ Explorer 8、Firefox、Safari、Chrome 和 Opera 的脚本中是可以访问。\n\n## 创建文本节点\n\n可以使用 `document.createTextNode()`\
  \ 方法创建新的文本节点，该方法接受单个参数 —— 即要插入节点中的文本。与设置现有文本节点的值一样，文本将经过 HTML 或 XML 编码，如示例所示：\n\n\
  ```javascriptvar textNode = document.createTextNode(\"<strong>Hello</strong> world!\"\
  );\n```\n\n当创建新的文本节点时，它的 `ownerDocument` 属性会被设置，但在它被添加到文档树中的节点之前，它不会显示在浏览器窗口中。以下代码创建一个新的\
  \ `<div>` 元素并向其添加了一条消息：\n\n```javascriptvar element = document.createElement(\"\
  div\");\nelement.className = \"message\";\n\nvar textNode = document.createTextNode(\"\
  Hello world!\");\nelement.appendChild(textNode);\n\ndocument.body.appendChild(element);\n\
  ```\n\nTextNodeExample03.htm\n\n此示例创建了一个新的 `<div>` 元素并为其分配了类 `\"message\"`。然后创建了一个文本节点并添加到该元素中。最后一步是将该元素添加到文档的体（body）中，这使得元素和文本节点都出现在浏览器中。\n\
  \n通常情况下元素只有一个文本节点作为子节点。然而，可能会有多个文本节点作为子节点，如此示例所示：\n\n![image](img/logo1.gif)\n\n\
  ```javascriptvar element = document.createElement(\"div\");\nelement.className =\
  \ \"message\";\n\nvar textNode = document.createTextNode(\"Hello world!\");\nelement.appendChild(textNode);\n\
  \nvar anotherTextNode = document.createTextNode(\"Yippee!\");\nelement.appendChild(anotherTextNode);\n\
  \ndocument.body.appendChild(element);\n```\n\nTextNodeExample04.htm\n\n当文本节点作为另一个文本节点的兄弟节点添加时，这些节点中的文本将显示在一起，它们之间没有任何空格。\n\
  \n### 标准化文本节点\n\nDOM 文档中的兄弟文本节点可能会令人困惑，因为没有无法用单个文本节点表示的字符串。尽管如此，在 DOM 文档中遇到兄弟文本节点并不常见，因此有一种方法可以将兄弟文本节点合并。此方法称为\
  \ `normalize()`，它存在于 `Node` 类型上（因此对所有节点类型可用）。当在两个或多个文本节点的父节点上调用 `normalize()` 时，这些节点将合并为一个文本节点，其\
  \ `nodeValue` 等于每个文本节点的 `nodeValue` 属性的连接字符串。这里有一个示例：\n\n```javascriptvar element\
  \ = document.createElement(\"div\");\nelement.className = \"message\";\n\nvar textNode\
  \ = document.createTextNode(\"Hello world!\");\nelement.appendChild(textNode);\n\
  \nvar anotherTextNode = document.createTextNode(\"Yippee!\");\nelement.appendChild(anotherTextNode);\n\
  \ndocument.body.appendChild(element);\n\nalert(element.childNodes.length);  //2\n\
  \nelement.normalize();\nalert(element.childNodes.length);  //1\nalert(element.firstChild.nodeValue);\
  \  //\"Hello world!Yippee!\"\n```\n\nTextNodeExample05.htm\n\n当浏览器解析文档时，它永远不会创建兄弟文本节点。兄弟文本节点只能通过程序的\
  \ DOM 操作出现。\n\n![image](img/pen.gif)\n\n`normalize()` 方法在某些情况下会导致 Internet Explorer\
  \ 6 崩溃，尽管已证实，这在 Internet Explorer 7 或更高版本中已修复。\n\n### 分割文本节点\n\n`Text` 类型有一个与 `normalize()`\
  \ 相的方法：`splitText()` 将文本节点拆分为两个文本节点，原始文本节点包含偏移量之前的文本，新文本节点包含剩余文本。该方法返回新文本节点，它与原始具有相同的\
  \ `parentNode`。考虑以下示例：\n\n![image](img/logo1.gif)\n\n```javascriptvar element =\
  \ document.createElement(\"div\");\nelement.className = \"message\";\n\nvar textNode\
  \ = document.createTextNode(\"Hello world!\");\nelement.appendChild(textNode);\n\
  \ndocument.body.appendChild(element);\n\nvar newNode = element.firstChild.splitText(5);\n\
  alert(element.firstChild.nodeValue);  //\"Hello\"\nalert(newNode.nodeValue);   \
  \          //\" world!\"\nalert(element.childNodes.length);     //2\n```\n\nTextNodeExample06.htm\n\
  \n在此示例中，包含 \"Hello world!\" 的文本节点在位置 5 处拆分为两个文本节点。位置 5 包含 \"Hello\" 和 \"world!\"\
  \ 之间的空格，因此原始文本节点拥有 \"Hello\"，新节点拥有 \" world!\"（包括空格）。分割文本节点通常用于从文本节点提取数据。\n\n##\
  \ 注释类型\n\n注释在 DOM 中由 `Comment` 类型表示。`Comment`节点具有以下特性：\n\n*   `nodeType` 为 8。\n\
  *   `nodeName` 为 `\"#comment\"`。\n*   `nodeValue` 是注释的内容。\n*   `parentNode` 是 `Document`\
  \ 或 `Element`。\n*   不支持子节点。\n\n`Comment` 类型继承自与 `Text` 类型相同的基类，因此它具有所有的字符串处理方法，但\
  \ `splitText()`。同样与 `Text` 类型类似，可以使用 `nodeValue` 或 `data` 属性检索注释的实际内容。\n\n注释节点可以从父节点作为子节点访问。考虑以下\
  \ HTML 代码：\n\n![image](img/logo1.gif)\n\n```html\n<div id=\"myDiv\"><!-- A comment\
  \ --></div>\n```\n\n在这种情况下，注释是 `<div>` 元素的子节点，这意味着可以这样访问它：\n\n```javascriptvar div\
  \ = document.getElementById(\"myDiv\");\nvar comment = div.firstChild;\nalert(comment.data);\
  \    //\"A comment\"\n```\n\nCommentNodeExample01.htm\n\n注释也可以使用 `document.createComment()`\
  \ 方法并传入注释文本来创建，如下代码所示：\n\n```javascriptvar comment = document.createComment(\"A\
  \ comment\");\n```\n\n\n\n\n\n不出意料的是，注释节点很少被访问或创建，因为它们在算法上几乎没有作用。此外，浏览器不会识别存在闭合标签\
  \ `</html>` 之后的注释。如果你需要访问注释节点，请确保它们作为 `<html>` 元素的后代出现。\n\n![image](img/pen.gif)\n\
  \n`Comment` 类型的构造函数和原型在 Firefox、Safari、Chrome 和 Opera 中都是可访问的。Internet Explorer\
  \ 8 的注释节点被视为标签名为 `\"!\"` 的元素。这意味着注释节点可以通过 `getElementsByTagName()` 返回。Internet Explorer\
  \ 9 通过一个名为 `HTMLCommentElement` 的自定义构造函数来表示注释，尽管它并不将注释视为元素。\n\n# CDATASection 类型\n\
  \nCDATASection 节点是基于 XML 的文档特有的，并由 `CDATASection` 类型表示。与 `Comment` 类似，`CDATASection`\
  \ 类型继承自基类 `Text` 类型，因此它除了 `splitText()` 之外，拥有了所有相同的字符串处理方法。一个 `CDATASection` 节点具有以下特征：\n\
  \n*   `nodeType` 为 4。\n*   `nodeName` 为 `\"#cdata-section\"`。\n*   `nodeValue` 为\
  \ CDATA 节的内容。\n*   `parentNode` 是 `Document` 或 `Element`。\n*   不支持子节点。\n\nCDATA\
  \ 节仅在 XML 文档中有效，因此大多数浏览器会错误地将 CDATA 节解析为 `Comment` 或 `Element`。考虑以下情况：\n\n```html\n\
  <div id=\"myDiv\"><![CDATA[This is some content.]]></div\n```\n\n在这个示例中，`CDATASection`\
  \ 节点本应该作为 `<div>` 的第一个子节点存在；然而，四大浏览器中没有一个将其解释为此处。即使在有效的 XHTML 页面中，浏览器也无法支持嵌入的 CDATA\
  \ 节。\n\n真正的 XML 文档允许使用 `document.createCDataSection()` 创建 CDATA 节并传入节点的内容。\n\n![image](img/pen.gif)\n\
  \n`CDATASection` 类型的构造函数和原型在 Firefox、Safari、Chrome 和 Opera 中均可访问。Internet Explorer\
  \ 直版本 9 仍然不支持这种类型。\n\n# DocumentType 类型\n\n`DocumentType` 类型在网页浏览器中并不常用，且仅在 Firefox、Safari\
  \ 和 Opera 中支持。`DocumentType` 对象包含有关文档 doctype（文档类型定义）的所有信息并具有以下特征：\n\n*   `nodeType`\
  \ 为 10。\n*   `nodeName` 为 doctype 的名称。\n*   `nodeValue` 为 `null`。\n*   `parentNode`\
  \ 是 `Document`。\n*   不支持子节点。\n\n`DocumentType` 对象在 DOM Level 1 中无法动态创建；它们只在解析文档时被创建。对于支持它的浏览器，`DocumentType`\
  \ 对象存储在 `document.doctype` 中。DOM Level 1 为 `DocumentType` 对象描述了三个属性：`name` 是 doctype\
  \ 的名称；`entities` 是 doctype 描述的实体的 `NamedNodeMap`；`notations` 是 doctype 描述的符号的 `NamedNodeMap`。由于浏览器中的文档通常使用\
  \ HTML 或 XHTML doctype，因此实体和符号列表通常是空的（它们仅在内联 doctype 中被填充）。从任何意义上说，`name` 属性是唯一用的。该属性填充了\
  \ doctype 的名称，即紧跟在 `<!DOCTYPE` 之后的文本。考虑以下 HTML 4.01 严格模式 doctype：\n\n```html\n<!DOCTYPE\
  \ HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\" \n  \"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n```\n\n对于这个 doctype，`name` 属性为 `\"HTML\"`：\n\n```javascript\nalert(document.doctype.name);\
  \ //\"HTML\"\n```\n\nInternet Explorer 8 及之前的版本不支持这种类型，尽管它在 `document.doctype` 中表示。（此处抱歉，原文原文逻辑重复重复，重新翻译如下）：\n\
  \n`DocumentType` 类型在网页浏览器中并不常用，且仅在 Firefox、Safari 和 Opera 中支持。`DocumentType` 对象包含有关文档\
  \ doctype 的所有信息并具有以下特征：\n\n*   `nodeType` 为 10。\n*   `nodeName` 为 doctype 的名称。\n\
  *   `nodeValue` 为 `null`。\n*   `parentNode` 是 `Document`。\n*   不支持子节点。\n\n`DocumentType`\
  \ 对象在 DOM Level 1 中无法动态创建；它们只在解析文档时被创建。对于支持它的浏览器，`DocumentType` 对象存储在 `document.doctype`\
  \ 中。DOM Level 1 为 `DocumentType` 对象描述了三个属性：`name` 是 doctype 的名称；`entities` 是 doctype\
  \ 描述的实体的 `NamedNodeMap`；`notations` 是 doctype 描述的符号的 `NamedNodeMap`。由于浏览器中的文档通常使用\
  \ HTML 或 XHTML doctype，因此实体和符号列表通常是空的（它们仅在内联 doctype 中被填充）。从任何意义上说，`name` 属性是唯一用的。该属性填充了\
  \ doctype 的名称，即紧跟在 `<!DOCTYPE` 之后的文本。\n\nInternet Explorer 8 及之前的版本不支持这种类型，尽管它在\
  \ `document.doctype` 中表示。（注：此处原文存在表述重复，已按逻辑理顺）。\n\n（修正后）：\n\n`DocumentType` 类型在网页浏览器中并不常用，且仅在\
  \ Firefox、Safari 和 Opera 中支持。`DocumentType` 对象包含有关文档 doctype 的所有信息并具有以下特征：\n\n*\
  \   `nodeType` 为 10。\n*   `nodeName` 为 doctype 的名称。\n*   `nodeValue` 为 `null`。\n\
  *   `parentNode` 是 `Document`。\n*   不支持子节点。\n\n`DocumentType` 对象在 DOM Level 1 中无法动态创建；它们只在解析文档时被创建。对于支持它的浏览器，`DocumentType`\
  \ 对象存储在 `document.doctype` 中。DOM Level 1 为 `DocumentType` 对象描述了三个属性：`name` 是 doctype\
  \ 的名称；`entities` 是 doctype 描述的实体的 `NamedNodeMap`；`notations` 是 doctype 描述的符号的 `NamedNodeMap`。由于浏览器中的文档通常使用\
  \ HTML 或 XHTML doctype，因此实体和符号列表通常是空的（它们仅在内联 doctype 中被填充）。从任何意义上说，`name` 属性是唯一用的。该属性填充了\
  \ doctype 的名称，即紧跟在 `<!DOCTYPE` 之后的文本。\n\n考虑以下 HTML 4.01 严格模式 doctype：\n\n```html\n\
  <!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\" \n  \"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n```\n\n对于这个 doctype，`name` 属性为 `\"HTML\"`：\n\n```javascript\nalert(document.doctype.name);\
  \ //\"HTML\"\n```\n\nInternet Explorer 8 及之前的版本不支持这种类型，尽管它在 `document.doctype` 中表示。（注：此处原文存在表述重复，已按逻辑理顺）。\n\
  \n# DocumentFragment 类型\n\n在所有节点中，`DocumentFragment` 是唯一可以包含多个节点且不会引起页面重绘的类型。DocumentFragment\
  \ 节点具有以下特征：\n\n*   `nodeType` 为 11。\n*   `nodeName` 为 `\"#document-fragment\"`。\n\
  *   `nodeValue` 为 `null`。\n*   `parentNode` 为 `null`。\n*   子节点可以是 `Element`、`ProcessingInstruction`、`Comment`、`Text`、`CDATASection`\
  \ 或 `EntityReference`。\n\nDocumentFragment 通过 `document.createDocumentFragment()`\
  \ 方法创建，并用于添加到 DOM。为了避免多次重绘，以下代码示例使用了文档片段：\n\n```javascript\nvar fragment = document.createFragment();\n\
  ```\n\nDocumentFragment 继承 `Node` 的所有方法，并可以通过 `appendChild()` 或 `insertBefore()`\
  \ 添加到文档中。当片段被添加到文档时，其子节点会被移动到文档中。例如，考虑以下 HTML：\n\n```html\n<ul id=\"myList\"></ul>\n\
  ```\n\n假设你想向 `<ul>` 元素添加列表项。直接将项添加到元素会导致浏览器重绘。为了避免这种情况，以下代码使用了文档片段来创建列表项：\n\n![image](img/pen.gif)\n\
  \n```javascript\nvar fragment = document.createDocumentFragment();\nvar ul = document.getElementById(\"\
  myList\");\nvar li = null;\n\nfor (var i=0; i < 3; i++){\n    li = document.createElement(\"\
  li\");\n    li.appendChild(document.createTextNode(\"Item \" + (i+1)));\n    fragment.appendChild(li);\n\
  }\n\nul.appendChild(fragment);\n```\n\n`DocumentFragmentExample01.htm`\n\n此示例创建一个文档片段并获取\
  \ `<ul>` 元素的引用。for 循环创建三个列表项目，每个项目都有说明其内容的文本。为了这样做，创建一个 `<li>` 元素，然后向该元素添加文本节点。随后通过\
  \ `appendChild()` 将 `<li>` 元素添加到文档片段中。循环结束后，通过调用 `appendChild()` 并传入片段，将所有项目添加到\
  \ `<ul>` 元素中。\n\n# Attr 类型\n\n元素属性在 DOM 中由 `Attr` 类型表示。`Attr` 类型的构造函数和原型在包括 Internet\
  \ Explorer 8 在内的所有浏览器中都是可用的。技术上，属性是存在于元素 `attributes` 属性中的节点。属性节点具有以下特征：\n\n*  \
  \ `nodeType` 为 2。\n*   `nodeName` 为属性名称。\n*   `nodeValue` 为属性值。\n*   `parentNode`\
  \ 为 `null`。\n*   HTML 中的子节点。XML 中的子节点可以是 `Text` 或 `EntityReference`。\n\n尽管属性是节点，但不被视为\
  \ DOM 文档树的一部分。属性节点很少直接引用，大多数开发者倾向于使用 `getAttribute()`、`setAttribute()` 和 `removeAttribute()`。\n\
  \n`Attr` 对象有三个属性：`name` 是属性名称（同 `nodeName`）；`value` 是属性值（同 `nodeValue`）；以及 `specified`\
  \ 是一个布尔值，指示该属性是在代码中指定的还是默认值。\n\n\n\n\n\n可以使用 `document.createAttribute()` 并传入属性名称来创建新的属性节点。例如，要给元素添加\
  \ `align` 属性，可以使用以下代码：\n\n![image](img/logo1.gif)\n\n```javascript\nvar attr = document.createAttribute(\"\
  align\");\nattr.value = \"left\";\nelement.setAttributeNode(attr);\n\nalert(element.attributes[\"\
  align\"].value);       //\"left\"\nalert(element.getAttributeNode(\"align\").value);\
  \ //\"left\"\nalert(element.getAttribute(\"align\"));           //\"left\"\n```\n\
  \n## AttrExample01.htm\n\n在这个示例中，创建了一个新的属性节点。`name` 属性通过调用 `createAttribute()` 被赋值，因此随后不需要再次对其赋值。然后将\
  \ `value` 属性赋值为 `\"left\"`。要将新创建的属性添加到元素中，可以使用元素的 `setAttributeNode()` 方法。一旦添加了属性，可以通过多种方式访问它：通过\
  \ `attributes` 属性、使用 `getAttributeNode()` 或使用 `getAttribute()`。`attributes` 和 `getAttributeNode()`\
  \ 都会返回属性的实际 `Attr` 节点，而 `getAttribute()` 只返回属性值。\n\n![image](img/pen.gif)\n\n实际上没有好的理由直接访问属性节点。`getAttribute()`、`setAttribute()`\
  \ 和 `removeAttribute()` 方法比直接操作属性节点更优。\n\n# 操作 DOM\n\n在许多情况下，操作 DOM 相当简单，这使得使用 JavaScript\
  \ 重新创建通常使用 HTML 代码创建的内容变得。然而，某些时候使用 DOM 并不像看起来那么简单。浏览器中充满了隐藏的陷阱和不兼容性，这使得编写 DOM 部分的代码比编写其他部分更为复杂。\n\
  \n## 动态脚本\n\n`<script>` 元素用于将 JavaScript 代码插入页面中，既可以通过 `src` 属性包含外部文件，也可以在元素内部包含文本。动态脚本是指在页面加载时不存在但在稍后通过\
  \ DOM 包含的脚本。与 HTML 元素一样，实现此操作有两种方法：引入外部文件或直接插入文本。\n\n动态加载外部 JavaScript 文件的工作方式正如你预期的那样。考虑以下\
  \ `<script>` 元素：\n\n```html\n<script type=\"text/javascript\" src=\"client.js\"\
  ></script>\n```\n\n此 `<script>` 元素包含了第 9 章客户端检测脚本的文本。创建此节点的 DOM 代码如下：\n\n```javascript\n\
  var script = document.createElement(\"script\");\nscript.type = \"text/javascript\"\
  ;\nscript.src = \"client.js\";\ndocument.body.appendChild(script);\n```\n\n如你所见，DOM\
  \ 代码完全镜像了它所代表的 HTML 代码。注意，在最后一行将 `<script>` 元素添加到页面之前，外部文件不会被下载。该元素也可以被添加到 `<head>`\
  \ 元素中，尽管效果相同。这一过程可以通变为以下函数：\n\n```javascript\nfunction loadScript(url){\n    var\
  \ script = document.createElement(\"script\");\n    script.type = \"text/javascript\"\
  ;\n    script.src = url;\n    document.body.appendChild(script);\n}\n```\n\n现在可以通过以下调用使用该函数加载外部\
  \ JavaScript 文件：\n\n```javascript\nloadScript(\"client.js\");\n```\n\n一旦加载，脚本对页面的其他部分完全可用。这只留下了一个问题：你如何知道脚本已完全加载？遗憾的是，没有标准方法来处理这一点。取决于所使用的浏览器，可以使用某些事件，正如第\
  \ 13 章所讨论。\n\n指定 JavaScript 代码的另一种方法是内联的，如示例所示：\n\n```html\n<script type=\"text/javascript\"\
  >\n    function sayHi(){\n        alert(\"hi\");\n    }\n</script>\n```\n\n使用 DOM\
  \ 时，以下逻辑应该是生效的：\n\n```javascript\nvar script = document.createElement(\"script\"\
  );\nscript.type = \"text/javascript\";\nscript.appendChild(document.createTextNode(\"\
  function sayHi(){alert('hi');}\"));\ndocument.body.appendChild(script);\n```\n\n\
  这在 Firefox、Safari、Chrome 和 Opera 中可以工作。但在 Internet Explorer 中，这会导致错误。Internet Explorer\
  \ 将 `<script>` 元素视为特殊的，并且不允许通过常规 DOM 访问子节点。所有 `<script>` 元素上存在一个名为 `text` 的属性，可以专门用于为\
  \ JavaScript 代码赋值，如下例所示：\n\n![image](img/logo1.gif)\n\n```javascript\nvar script\
  \ = document.createElement(\"script\");\nscript.type = \"text/javascript\";\nscript.text\
  \ = \"function sayHi(){alert('hi');}\";\ndocument.body.appendChild(script);\n```\n\
  \n### DynamicScriptExample01.htm\n\n更新后的代码在 Internet Explorer、Firefox、Opera 和 Safari\
  \ 3 及更高版本中有效。Safari 3 之前的版本无法支持 `text` 属性；然而，它允许使用文本节点技术赋值代码。如果你需要在较早版本的 Safari\
  \ 中执行此操作，可以使用以下代码：\n\n```javascript\nvar script = document.createElement(\"script\"\
  );\nscript.type = \"text/javascript\";\nvar code = \"function sayHi(){alert('hi');}\"\
  ;\ntry {\n    script.appendChild(document.createTextNode(\"code\"));\n} catch (ex){\n\
  \    script.text = \"code\";\n}\ndocument.body.appendChild(script);\n```\n\n在这里，首先尝试标准的\
  \ DOM 文本节点方法，因为它在 Internet Explorer 之外的所有地方都有效，而 IE 会抛出错误。如果该行导致错误，说明是 Internet\
  \ Explorer，必须使用 `text` 属性。这可以通变为以下函数：\n\n![image](img/logo1.gif)\n\n```javascript\n\
  function loadScript(code){\n    var script = document.createElement(\"script\");\n\
  \    script.type = \"text/javascript\";\n    try {\n        script.appendChild(document.createTextNode(code));\n\
  \    } catch (ex){\n        script.text = code;\n    }\n    document.body.appendChild(script);\n\
  }\n```\n\n该函数的调用方式如下：\n\n```javascript\nloadScript(\"function sayHi(){alert('hi');}\"\
  );\n```\n\n### DynamicScriptExample02.htm\n\n以这种方式加载的代码在全局作用域中执行，并在脚本完成后立即可用。这本质上与将字符串传递给\
  \ `eval()` 相同。\n\n# （操作 DOM 续）\n\n## 动态样式\n\nCSS 样式使用两个元素之一包含在 HTML 页面中`<link>`\
  \ 元素用于从外部文件包含 CSS，而 `<style>` 元素用于指定内联样式。与动态脚本类似，动态样式在页面加载时并不；它们是在页面加载后添加的。\n\n\
  考虑典型的 `<link>` 元素：\n\n```html\n<link rel=\"stylesheet\" type=\"text/css\" href=\"\
  styles.css\">\n```\n\n该元素可以同样地使用以下 DOM 代码创建：\n\n```javascript\nvar link = document.createElement(\"\
  link\");\nlink.rel = \"stylesheet\";\nlink.type = \"text/css\";\nlink.href = \"\
  styles.css\";\nvar head = document.getElementsByTagName(\"head\")[0];\nhead.appendChild(link);\n\
  ```\n\n此代码在所有主流浏览器中无问题地工作。注意，为了正常工作，`<link>` 元素应该添加到 `<head>` 而不是 `body`。该技术可以通变为以下函数：\n\
  \n```javascript\nfunction loadStyles(url){\n    var link = document.createElement(\"\
  link\");\n    link.rel = \"stylesheet\";\n    link.type = \"text/css\";\n    link.href\
  \ = url;\n    var head = document.getElementsByTagName(\"head\")[0];\n    head.appendChild(link);\
  \    \n}\n```\n\n然后这样调用 `loadStyles()` 函数：\n\n```javascript\nloadStyles(\"styles.css\"\
  );\n```\n\n通过外部文件加载样式是异步的，因此样式的加载顺序可能于 JavaScript 代码执行。通常不需要知道样式何时完全加载；然而，可以使用某些技术（第\
  \ 13 章讨论）来完成这一点。\n\n定义样式的另一种方法是使用 `<style>` 元素并包含内联 CSS，如下：\n\n```html\n<style type=\"\
  text/css\">\nbody {\n    background-color: red;\n}\n</style>\n```\n\n\n\n\n从逻辑上讲，以下\
  \ DOM 代码应该有效：\n\n![image](img/logo1.gif)\n\n```\nvar style = document.createElement(\"\
  style\");\nstyle.type = \"text/css\";\nstyle.appendChild(document.createTextNode(\"\
  body{background-color:red}\"));\nvar head = document.getElementsByTagName(\"head\"\
  )[0];\nhead.appendChild(style);\n```\n\n### DynamicStyleExample01.htm\n\n这段代码在 Firefox、Safari、Chrome\
  \ 和 Opera 中可以运行，但在 Internet Explorer 中不起用。Internet Explorer 将 `<style>` 节点视为特殊节点，类似于\
  \ `<script>` 节点，因此不允许访问其子节点。事实上，Internet Explorer 抛出的错误与尝试向 `<script>` 元素添加子节点时抛出的错误相同。针对\
  \ Internet Explorer 的解决方法是访问元素的 `styleSheet` 属性，该属性又有一个名为 `cssText` 的属性，可以被设置为 CSS\
  \ 代码（这两个属性将在第 12 章中进一步讨论），如下代码示例所示：\n\n```\nvar style = document.createElement(\"\
  style\");\nstyle.type = \"text/css\";\ntry{\n    style.appendChild(document.createTextNode(\"\
  body{background-color:red}\"));\n} catch (ex){\n    style.styleSheet.cssText = \"\
  body{background-color:red}\";\n}\nvar head = document.getElementsByTagName(\"head\"\
  )[0];\nhead.appendChild(style);\n```\n\n与动态添加内联脚本的代码类似，这段新代码使用 `try-catch` 语句来捕获\
  \ Internet Explorer 抛出的错误，然后通过 Internet Explorer 特有的设置样式的方式进行响应。通用的解决方案如下：\n\n![image](img/logo1.gif)\n\
  \n```\nfunction loadStyleString(css){\n    var style = document.createElement(\"\
  style\");\n    style.type = \"text/css\";\n    try{\n        style.appendChild(document.createTextNode(css));\n\
  \    } catch (ex){\n        style.styleSheet.cssText = css;\n    }\n    var head\
  \ = document.getElementsByTagName(\"head\")[0];\n    head.appendChild(style);\n\
  }\n```\n\n### DynamicStyleExample02.htm\n\n可以如下调用该函数：\n\n```\nloadStyleString(\"\
  body{background-color:red}\");\n```\n\n以这种方式指定的样式会立即添加到页面中，因此应该能立即看到变化。\n\n![image](img/pen.gif)\n\
  \n如果你专门为 Internet Explorer 编写代码，请小心使用 `styleSheet.cssText`。如果你重用同一个 `<style>` 元素并尝试多次设置此属性，可能会导致浏览器崩溃。此外，将\
  \ `cssText` 设置为空字符串也有导致浏览器崩溃的可能性。这是浏览器中的一个 bug，希望未来能够修复。\n\n## 操作表格\n\nHTML 中最复杂的结构之一是\
  \ `<table>` 元素。创建新表格通常意味着大量的表格行、表格单元格、表头等标签。由于这种复杂性，使用核心 DOM 方法来创建和更改表格可能需要大量的代码。假设你想使用\
  \ DOM 创建以下 HTML 表格：\n\n```html\n<table border=\"1\" width=\"100%\">\n    <tbody>\n\
  \        <tr>\n            <td>Cell 1,1</td>\n            <td>Cell 2,1</td>\n  \
  \      </tr>\n        <tr>\n            <td>Cell 1,2</td>\n            <td>Cell\
  \ 2,2</td>\n        </tr>\n    </tbody>\n</table>\n```\n\n要使用核心 DOM 方法实现这一点，代码看起来可能像这样：\n\
  \n```javascript\n//创建表格\nvar table = document.createElement(\"table\");\ntable.border\
  \ = 1;\ntable.width = \"100%\";\n\n//创建 tbody\nvar tbody = document.createElement(\"\
  tbody\");\ntable.appendChild(tbody);\n\n//创建第一行\nvar row1 = document.createElement(\"\
  tr\");\ntbody.appendChild(row1);\nvar cell1_1 = document.createElement(\"td\");\n\
  cell1_1.appendChild(document.createTextNode(\"Cell 1,1\"));\nrow1.appendChild(cell1_1);\n\
  var cell2_1 = document.createElement(\"td\");\ncell2_1.appendChild(document.createTextNode(\"\
  Cell 2,1\"));\nrow1.appendChild(cell2_1);\n\n//创建第二行\nvar row2 = document.createElement(\"\
  tr\");\ntbody.appendChild(row2);\nvar cell1_2 = document.createElement(\"td\");\n\
  cell1_2.appendChild(document.createTextNode(\"Cell 1,2\"));\nrow2.appendChild(cell1_2);\n\
  var cell2_2= document.createElement(\"td\");\ncell2_2.appendChild(document.createTextNode(\"\
  Cell 2,2\"));\nrow2.appendChild(cell2_2);\n\n//将表格添加到文档正文\ndocument.body.appendChild(table);\n\
  ```\n\n这段代码非常冗长且略难以理解。为了方便构建表格，HTML DOM 为 `<table>`、`<tbody>` 和 `<tr>` 元素添加了几个属性和方法。\n\
  \n`<table>` 元素增加了：\n\n*   `caption` — 指向 `<caption>` 元素的指针（如果存在）。\n*   `tBodies`\
  \ — `<tbody>` 元素的 `HTMLCollection`。\n*   `tFoot` — 指向 `<tfoot>` 元素的指针（如果存在）。\n*\
  \   `tHead` — 指向 `<thead>` 元素的指针（如果存在）。\n*   `rows` — 表格中所有行的 `HTMLCollection`。\n\
  *   `createTHead()` — 创建 `<thead>` 元素。\n*   `createTFoot()` — 创建 `<tfoot>` 元素。\n\
  *   `createCaption()` — 创建 `<caption>` 元素。\n*   `deleteRow(index)` — 删除指定指定的行。\n\
  *   `insertRow(index)` — 在索引处插入行。\n*   `insertBeforeRow(index)` — 在索引之前插入行。\n\n\
  *   `deleteCell(index)` — 删除指定的单元格。\n*   `insertCell(index)` — 在索引处插入单元格。\n*   `insertBeforeCell(index)`\
  \ — 在索引之前插入单元格。\n\n`<tbody>` 元素增加了：\n\n*   `rows` — `<tbody>` 中所有行的 `HTMLCollection`。\n\
  *   `deleteRow(index)` — 删除指定的行。\n*   `insertRow(index)` — 在索引处插入行。\n*   `insertBeforeRow(index)`\
  \ — 在索引之前插入行。\n\n`<tr>` 元素增加了：\n\n*   `cells` — 行中所有单元格的 `HTMLCollection`。\n*  \
  \ `deleteCell(index)` — 删除指定的单元格。\n*   `insertCell(index)` — 在索引处插入单元格。\n*   `insertBeforeCell(index)`\
  \ — 在索引之前插入单元格。\n\n这些属性和方法可以大大减少创建表格所需的代码。例如，之前的代码可以使用这些方法重写（高亮代码已更新）：\n\n```javascript\n\
  //创建表格\nvar table = document.createElement(\"table\");\ntable.border = 1;\ntable.width\
  \ = \"100%\";\n\n//创建 tbody\nvar tbody = document.createElement(\"tbody\");\ntable.appendChild(tbody);\n\
  \n//创建第一行\ntbody.insertRow(0);\ntbody.rows[0].insertCell(0).appendChild(document.createTextNode(\"\
  Cell 1,1\"));\ntbody.rows[0].insertCell(1).appendChild(document.createTextNode(\"\
  Cell 2,1\"));\n\n//创建第二行\ntbody.insertRow(1);\ntbody.rows[1].insertCell(0).appendChild(document.createTextNode(\"\
  Cell 1,2\"));\ntbody.rows[1].insertCell(1).appendChild(document.createTextNode(\"\
  Cell 2,2\"));\n\n//将表格添加到文档正文\ndocument.body.appendChild(table);\n```\n\n在这段代码中，`<table>`\
  \ 和 `<tbody>` 元素的创建保持不变。改变的是创建两行的部分，它现在利用了 HTML DOM 表格属性和方法。\n\n使用这些属性和方法创建表格会使代码更加逻辑化且易读，尽管从技术上讲两组代码都是正确的。\n\
  \n## 使用 NodeLists\n\n\n\n\n\n# 理解 `NodeList` 对象及其相关对象——`NamedNodeMap` 和 `HTMLCollection`，对于深入理解整个\
  \ `DOM` 至关重要。这些集合中的每一个都被认为是“活的”（live），也就是说，当文档结构发生变化时，它们会进行更新，从而始终保持最准确的信息。实际上，所有的\
  \ `NodeList` 对象都是在每次被访问时针对 `DOM` 文档运行的查询。例如，以下代码将导致无限循环：\n\n```javascript\nvar divs\
  \ = document.getElementsByTagName(\"div\"),\n    i,\n    div;\n\nfor (i=0; i < divs.length;\
  \ i++){\n    div = document.createElement(\"div\");\n    document.body.appendChild(div);\n\
  }\n```\n\n这段代码的第一部分获取文档中所有 `<div>` 元素的 `HTMLCollection`。由于该集合是“活的”，每当页面上添加一个新的 `<div>`\
  \ 元素时，它就会被添加到集合中。由于浏览器不希望保留所有已创建集合的列表，因此集合仅在再次被访问时才会更新。这在像示例中的循环中产生了一个有趣的问题。循环每执行一次，都会评估条件\
  \ `i < divs.length`。这意味着获取所有 `<div>` 元素的查询正在运行。因为循环体创建了一个新的 `<div>` 元素并将其添加到文档中，`divs.length`\
  \ 的值在每次循环中都会增加 1；因此，`i` 永远不会等于 `divs.length`，因为两者都在递增。\n\n当你想要遍历 `NodeList` 时，最好的方法是初始化第二个变量来存储其长度，然后将迭代器与该变量进行比较，如下例所示：\n\
  \n```javascript\nvar divs = document.getElementsByTagName(\"div\"),\n    i,\n  \
  \  len,\n    div;\n\nfor (i=0, len=divs.length; i < len; i++){\n    div = document.createElement(\"\
  div\");\n    document.body.appendChild(div);\n}\n```\n\n在这个示例中，初始化了第二个变量 `len`。由于\
  \ `len` 包含了循环开始时 `divs.length` 的快照，它防止了上一个示例中出现的无限循环。这种技术在本章中一直被用于演示遍历 `NodeList`\
  \ 对象的优方法。\n\n总的来说，最好限制与 `NodeList` 交互的次数。由于每次访问都会对文档运行查询，请尝试缓存从 `NodeList` 中检索的频繁使用的值。\n\
  \n# 总结\n\n文档对象模型 (`DOM`) 是一种用于访问和操作 HTML 和 XML 文档的语言无关的 API。`DOM` 1 级处理将 HTML 和\
  \ XML 文档表示为节点层次结构，可以通过 `JavaScript` 进行操作以更改底层文档的外观和结构。\n\n`DOM` 由一系列节点类型组成，描述如下：\n\
  \n- 基础节点类型是 `Node`，它是文档各个部分的抽象表示；所有其他类型都继承自 `Node`。\n- `Document` 类型代表整个文档，是层次结构的根节点。在\
  \ `JavaScript` 中，`document` 对象是 `Document` 的实例，允许以多种不同方式查询和检索节点。\n- `Element` 节点代表文档中所有的\
  \ HTML 或 XML 元素，可用于操作它们的内容和属性。\n- 还存在其他节点类型用于文本内容、注释、文档类型、`CDATA` 段和文档片段。\n\n`DOM`\
  \ 访问在大多数情况下都能按预期工作，但在处理 `<script>` 和 `<style>` 元素时通常会有复杂性。由于这些元素分别包含脚本和样式信息，浏览器在处理它们时通常与其他元素区别对待。\n\
  \n关于 `DOM` 可能最重要的理解是它是如何影响整体性能的。`DOM` 操作是 `JavaScript` 中执行的最昂贵的操作之一，其中 `NodeList`\
  \ 对象尤为棘手。`NodeList` 对象是“活的”，这意味着每次访问该对象时都会运行查询。由于这些问题，最好减少 `DOM` 操作的次数。\n\n## 第\
  \ 11 章：DOM 扩展\n\n## 本章内容概览\n\n- 理解 `Selectors API`\n- 使用 `HTML5 DOM` 扩展\n- 使用专有的\
  \ `DOM` 扩展\n\n尽管 `DOM` 是一个定义相当良好的 API，但它经常通过基于标准和专有的扩展进行增强以提供额外功能。在 2008 年之前，浏览器中发现几乎所有的\
  \ `DOM` 扩展都是专有的。此之后，`W3C` 开始将一些已成为事实标准的专有扩展规范化为正式的规范。\n\n指定 `DOM` 扩展的两个主要标准是 `Selectors\
  \ API` 和 `HTML5`。它们都源于开发社区的需求以及对某些方法和 API 标准化的愿望。还有一个较小的 `Element Traversal`（元素遍历）规范，带有额外的\
  \ `DOM` 属性。尽管这两个规范（尤其是 `HTML5`）涵盖了大量的 `DOM` 扩展，但专有扩展仍然存在。本章也将涵盖这些专有扩展。\n\n## SELECTORS\
  \ API\n\nJavaScript 库最流行的功能之一是根据 CSS 选择器指定的模式检索多个 DOM 元素。事实上，`jQuery` 库 ([www.jquery.com](http://www.jquery.com))\
  \ 完全围绕着 DOM 文档的 CSS 选择器查询构建，以便获取元素的引用，而不是使用 `getElementById()` 和 `getElementsByTagName()`。\n\
  \n`Selectors API` ([www.w3.org/TR/selectors-api](http://www.w3.org/TR/selectors-api))\
  \ 由 `W3C` 启动，用于指定浏览器对 CSS 查询的原生支持。所有实现此功能的 `JavaScript` 库都必须通过编写一个基础的 CSS 解析器，然后使用现有的\
  \ `DOM` 方法导航文档并识别匹配的节点。尽管库开发者一直在努力以提高此类处理的性能，但在代码在 `JavaScript` 中运行时，所能做的是有限的。通过将其变为原生\
  \ API，解析和树导航可以在浏览器层面的编译语言中完成，从而极大地提高功能的性能。\n\n`Selectors API` 1 级的核心有两个方法：`querySelector()`\
  \ 和 `querySelectorAll()`。在符合标准的浏览器中，这些方法在 `Document` 类型和 `Element` 类型上可用。`Selectors\
  \ API` 1 级在 Internet Explorer 8+、Firefox 3.5+、Safari 3.1+、Chrome 和 Opera 10+ 中完全实现。\n\
  \n### querySelector() 方法\n\n`querySelector()` 方法接受 CSS 查询并返回第一个匹配模式的后代元素，如果没有匹配的元素则返回\
  \ `null`。示例如所示：\n\n![image](img/logo1.gif)\n\n```javascript\n// 获取 body 元素\nvar\
  \ body = document.querySelector(\"body\");\n// 获取 ID 为 \"myDiv\" 的元素\nvar myDiv\
  \ = document.querySelector(\"#myDiv\");\n// 获取类名为 \"selected\" 的第一个元素\nvar selected\
  \ = document.querySelector(\".selected\");\n// 获取类名为 \"button\" 的第一个图像\nvar img\
  \ = document.body.querySelector(\"img.button\");\n```\n\nSelectorsAPIExample01.htm\n\
  \n当在 `Document` 类型上使用 `querySelector()` 方法时，它将从文档元素开始尝试匹配模式；当在 `Element` 类型上使用时，查询仅从该元素的后代中尝试匹配。\n\
  \n### querySelectorAll 方法\n\n`querySelectorAll()` 方法接受与 `querySelector()` 相同的单个参数——\
  \ CSS 查询，但它返回所有匹配的节点而不是一个。该方法返回 `NodeList` 的静态实例。\n\n\n\n\n\n需要澄清的是，返回值实际上是一个包含所有预期属性和方法的\
  \ `NodeList`，但其底层实现是元素的快照，而不是一个针对文档不断重新执行的动态查询。这种实现消除了与使用 `NodeList` 对象相关联的大部分性能开销。\n\
  \n任何带有有效 CSS 查询的 `querySelectorAll()` 调用都会返回一个 `NodeList` 对象，无论匹配的元素数量多少；如果没有匹配项，则\
  \ `NodeList` 为空。与 `querySelector()` 一样，`querySelectorAll()` 方法适用于 `Document`、`DocumentFragment`\
  \ 和 `Element` 类型。以下是一些示例：\n\n![image](img/logo1.gif)\n\n```javascript\n//在 <div>\
  \ 中获取所有的 <em> 元素（类似于 getElementsByTagName(\"em\")）\nvar ems = document.getElementById(\"\
  myDiv\").querySelectorAll(\"em\");\n//获取所有类名为 \"selected\" 的元素\nvar selecteds =\
  \ document.querySelectorAll(\".selected\");\n//获取 <p> 元素内部所有的 <strong> 元素\nvar strongs\
  \ = document.querySelectorAll(\"p strong\");\n```\n\n`SelectorsAPIExample02.htm`\n\
  \n生成的 `NodeList` 对象可以使用 `item()` 或括号表示法进行迭代以检索单个元素。这是一个示例：\n\n```javascript\nvar\
  \ i, len, strong;\nfor (i=0, len=strongs.length; i < len; i++){\nstrong = strongs[i];\
  \ //或 strongs.item(i)\nstrong.className = \"important\";\n}\n```\n\n与 `querySelector()`\
  \ 一样，当 CSS 选择器不受浏览器支持或选择器中存在语法错误时，`querySelectorAll()` 会抛出错误。\n\n## matchesSelector()\
  \ 方法\n\nSelectors API Level 2 规范在 `Element` 类型上引入另一个名为 `matchesSelector()` 的方法。该方法接受单个参数（即\
  \ CSS 选择器），如果给定元素匹配该选择器则返回 true，否则返回 false。例如：\n\n```javascript\nif (document.body.matchesSelector(\"\
  body.page1\")){\n//true\n}\n```\n\n当你已经拥有元素引用时，此方法允许你轻松检查该元素是否会被 `querySelector()`\
  \ 或 `querySelectorAll()` 返回。\n\n截至 2011 年年中，还没有浏览器支持 `matchesSelector()`；但是有几个浏览器支持实验性实现。Internet\
  \ Explorer 9+ 通过 `msMatchesSelector()` 支持该方法，Firefox 3.6+ 通过 `mozMatchesSelector()`\
  \ 支持它，Safari 5+ 和 Chrome 通过 `webkitMatchesSelector()` 支持它。为了现在使用此方法，你可能想要创建一个封装函数，例如：\n\
  \n```javascript\nfunction matchesSelector(element, selector){\nif (element.matchesSelector){\n\
  return element.matchesSelector(selector);\n} else if (element.msMatchesSelector){\n\
  return element.msMatchesSelector(selector);\n} else if (element.mozMatchesSelector){\n\
  return element.mozMatchesSelector(selector);\n} else if (element.webkitMatchesSelector){\n\
  return element.webkitMatchesSelector(selector);\n} else {\nthrow new Error(\"Not\
  \ supported.\");\n}\n}\nif (matchesSelector(document.body, \"body.page1\")){\n//do\
  \ something\n}\n```\n\n`SelectorsAPIExample03.htm`\n\n## 元素遍历 (ELEMENT TRAVERSAL)\n\
  \n在 9 版本之前，Internet Explorer 不返回元素之间的空白文本节点，而所有其他浏览器都会返回。这导致了在使用 `childNodes` 和\
  \ `firstChild` 等属性时行为上的差异。为了在消除差异的同时保持对 DOM 规范的忠实，在元素遍历 ([[www.w3.org/TR/ElementTraversal/`](http://www.w3.org/TR/ElementTraversal/))\
  \ 中定义了一组新属性。\n\n元素遍历 API 为 DOM 元素添加了五个新属性：\n\n- `childElementCount` — 返回子元素数量（排除文本节点和注释）。\n\
  - `firstElementChild` — 指向第一个是元素的元素。`firstChild` 的仅元素版本。\n- `lastElementChild` —\
  \ 指向最后一个是元素。`lastChild` 的仅元素版本。\n- `previousElementSibling` — 指向上一个是元素的兄弟元素。`previousSibling`\
  \ 的仅元素版本。\n- `nextElementSibling` — 指向下一个是元素的兄弟元素。`nextSibling` 的仅元素版本。\n\n支持的浏览器将这些属性添加到所有\
  \ DOM 元素中，以便方便地遍历 DOM 元素，而无需担心空白文本节点。\n\n例如，以传统的跨浏览器方式遍历特定元素的所有子元素所示：\n\n```javascript\n\
  var i,\nlen,\nchild = element.firstChild;\nwhile(child != element.lastChild){\n\
  if (child.nodeType == 1){ //检查是否为元素\nprocessChild(child);\n}\nchild = child.nextSibling;\n\
  }\n```\n\n使用元素遍历属性允许简化代码：\n\n```javascript\nvar i,\nlen,\nchild = element.firstElementChild;\n\
  while(child != element.lastElementChild){\nprocessChild(child); //已经知道它是一个元素\nchild\
  \ = child.nextElementSibling;\n}\n```\n\n元素遍历在 Internet Explorer 9+、Firefox 3.5+、Safari\
  \ 4+、Chrome 和 Opera 10+ 中实现。\n\n## HTML5\n\nHTML5 代表了对 HTML 传统的彻底背离。在所有之前的 HTML\
  \ 规范中，描述仅止于对任何 JavaScript 接口的描述，而是纯粹关注语言的标记，并将 JavaScript 绑定推迟到 DOM 规范。\n\n相反，HTML5\
  \ 规范包含了大量设计用于与标记配合 JavaScript API。这些 API 部分与 DOM 重叠，并定义了浏览器应该提供的扩展。\n\n![image](img/pen.gif)\n\
  \n由于 HTML5 的范围非常广，本节仅关注影响 DOM 节点的部分。HTML5 的其他部分将在相关主题中讨论。\n\n### 类相关的添加\n\n自 HTML4\
  \ 采用以来，Web 开发的一个主要变化是增加了类属性来指示样式和语义信息。这导致了大量与类的交互，包括类的动态更改以及查询文档查找元素。为了适应开发者对类属性的新青睐，HTML5\
  \ 引入了一些更改以方便类的使用。\n\n### getElementsByClassName() 方法\n\nHTML5 最受欢迎的添加之一是 `getElementsByClassName()`，它适用于对象和所有\
  \ HTML 元素。该方法源于使用现有 DOM 功能实现的 JavaScript 库，出于性能原因提供了原生实现。\n\n`getElementsByClassName()`\
  \ 方法接受单个参数，即包含一个或多个类名的字符串，并返回一个包含所有应用指定类的 `NodeList`。如果指定了多个类名，则顺序是不重要的。以下是一些示例：\n\
  \n```javascript\n//获取所有包含 \"username\" 和 \"current\" 类的元素，尽管先声明其中一个并不重要\nvar allCurrentUsernames\
  \ = document.getElementsByClassName(\"username current\");\n//获取 myDiv 子树中所有类名为\
  \ \"selected\" 的元素\nvar selected = document.getElementById(\"myDiv\").getElementsByClassName(\"\
  selected\");\n```\n\n当调用此方法时，它将仅返回调用根子树内的元素。在文档上调用 `getElementsByClassName()` 总是返回所有匹配类名的元素，而在元素上调用它将仅返回后代元素。\n\
  \n此方法适用于向类元素绑定事件，而不是使用 ID 或标签名。请记住，由于返回值是 `NodeList`，因此与使用 `getElementsByTagName()`\
  \ 和其他返回 `NodeList` 对象的 DOM 方法时存在相同的性能问题。\n\n`getElementsByClassName()` 方法在 Internet\
  \ Explorer 9+、Firefox 3+、Safari 3.1+、Chrome 和 Opera 9.5+ 中实现。\n\n## classList 属性\n\
  \n\n\n\n\n在类名（class）操作中，`className` 属性用于添加、删除和替换类名。由于 `className` 包含一个单一字符串，因此在每次需要更改时，都必须设置它的值，即使字符串中的某些部分不受影响。例如，考虑以下\
  \ HTML 代码：\n\n```html\n<div class=\"bd user disabled\">...</div>\n```\n\n该 `div`\
  \ 元素被分配了三个类。要移除其中一个类名，你需要将 `class` 属性拆分为单独的类名，移除不需要的类名，然后创建一个包含剩余类的字符串。以下是一个示例：\n\
  \n```javascript\n//移除 \"user\" 类\n//首先，获取类名列表\nvar classNames = div.className.split(/\\\
  s+/);\n// 找到要删除的类名\nvar pos = -1,\ni,\nlen;\nfor (i=0, len=classNames.length; i\
  \ < len; i++){\nif (classNames[i] == \"user\"){\npos = i;\nbreak;\n}\n}\n//移除类名\n\
  classNames.splice(i,1);\n//设置回类名\ndiv.className = classNames.join(\" \");\n```\n\
  \n所有这些代码都是为了从 `div` 元素的 `class` 属性中移除 \"user\" 类。替换类名以及检测类名是否应用到元素上时，必须使用类似的算法。添加类名可以通过字符串拼接来完成，但必须进行检查以确保你没有多次应用同一个类。许多\
  \ JavaScript 库实现了这些方法来辅助这些行为。\n\nHTML5 通过为所有元素添加 `classList` 属性，以一种更简单、更安全的方式操作类名。`classList`\
  \ 属性是一个名为 `DOMTokenList` 的新类型集合的实例。与其他 DOM 集合一样，`DOMTokenList` 有一个 `length` 属性来指示它包含多少个项目，单个项目可以通过\
  \ `item()` 方法或使用括号表示法检索。它还具有以下额外方法：\n\n* `add(value)` — 将给定的字符串值添加到列表中。如果该值已存在，则不会添加。\n\
  * `contains(value)` — 表示给定的值是否存在于列表中（如果存在则为 true；否则为 false）。\n* `remove(value)`\
  \ — 从列表中移除给定的字符串值。\n* `toggle(value)` — 如果该值已于列表中，则将其移除。如果该值不存在，则将其添加。\n\n上一个示例中的整个代码块可以简单地替换为以下代码：\n\
  \n```javascript\ndiv.classList.remove(\"user\");\n```\n\n使用此代码可以确保其他类名不受更改的影响。其他方法也极大地减少了基本操作的复杂性，如下示例所示：\n\
  \n```javascript\n//移除 \"disabled\" 类\ndiv.classList.remove(\"disabled\");\n//添加\
  \ \"current\" 类\ndiv.classList.add(\"current\");\n//切换 \"user\" 类\ndiv.classList.toggle(\"\
  user\");\n// 检查元素上现在有什么\nif (div.classList.contains(\"bd\") && !div.classList.contains(\"\
  disabled\")){\n//执行某些操作\n}\n// 遍历类名\nfor (var i=0, len=div.classList.length; i <\
  \ len; i++){\ndoSomething(div.classList[i]);\n}\n```\n\n`classList` 属性的添加使得没有必要访问\
  \ `className` 属性，除非你打算完全移除或完全覆盖元素的 `class` 属性。`classList` 属性在 Firefox 3.6+ 和 Chrome\
  \ 中实现。\n\n## 焦点管理\n\nHTML5 增加了辅助 DOM 焦点管理的功能。其中第一个是 `document.activeElement`，它始终包含一个指向当前获取焦点的\
  \ DOM 元素的指针。元素可以在页面加载时自动获取焦点、通过用户输入（通常使用 Tab 键）或通过程序使用 `focus()` 方法获取焦点。例如：\n\n\
  ```javascript\nvar button = document.getElementById(\"myButton\");\nbutton.focus();\n\
  alert(document.activeElement === button); //true\n```\n\n默认情况下，当文档首次加载时，`document.activeElement`\
  \ 设置为 `document.body`。在文档完全加载之前，`document.activeElement` 为 `null`。第二个新增的是 `document.hasFocus()`，它返回一个布尔值，表示文档是否具有焦点：\n\
  \n```javascript\nvar button = document.getElementById(\"myButton\");\nbutton.focus();\n\
  alert(document.hasFocus()); //true\n```\n\n确定文档是否具有焦点允许你判断用户正在与页面交互。这种能够查询文档以确定哪个元素具有焦点，并且能够询问文档是否具有焦点的组合，对于\
  \ Web 应用的可访问性至关重要。可访问 Web 应用的关键组件之一是适当的焦点管理，而能够确定哪些元素当前具有焦点是比过去猜测一个巨大的改进。\n\n这些属性在\
  \ Internet Explorer 4+、Firefox 3+、Safari 4+、Chrome 和 Opera 8+ 中实现。\n\n## HTMLDocument\
  \ 的更改\n\nHTML5 扩展了 `HTMLDocument` 类型以包含更多功能。与 HTML5 中指定的其他 DOM 扩展一样，这些更改基于在浏览器中得到良好支持的专用扩展。因此，尽管扩展的标准化相对较新，但某些浏览器已经支持这些功能一段时间了。\n\
  \n### readyState 属性\n\nInternet Explorer 4 是第一个在 `document` 对象上引入 `readyState` 属性的浏览器。其他浏览器随后效仿，该属性最终在\
  \ HTML5 中正式化。`document` 的 `readyState` 属性有两个可能的值：\n\n* `loading` — 文档正在加载。\n* `complete`\
  \ — 文档已完全加载。\n\n使用 `readyState` 属性的最佳方法是作为文档已加载的指示。在该属性广泛可用之前，你需要添加 `onload` 事件处理器来设置文档已加载。基本用法：\n\
  \n```javascript\nif (document.readyState == \"complete\"){\n//执行某些操作\n}\n```\n\n\
  `readyState` 属性在 Internet Explorer 4+、Firefox 3.6+、Safari、Chrome 和 Opera 9+ 中实现。\n\
  \n### 兼容模式\n\n随着 Internet Explorer 6 的引入以及以标准或怪异模式渲染文档的能力，确定浏览器以何种模式渲染变得必要。Internet\
  \ Explorer 在文档上添加了 `compatMode` 属性，其唯一作用是指示浏览器的渲染模式。如下例所示，在标准模式下，`document.compatMode`\
  \ 等于 `\"CSS1Compat\"`；在怪异模式下，`document.compatMode` 为 `\"BackCompat\"`：\n\n```javascript\n\
  if (document.compatMode == \"CSS1Compat\"){\nalert(\"标准模式\");\n} else {\nalert(\"\
  怪异模式\");\n}\n```\n\n该属性后来由 Firefox、Safari 3.1+、Opera 和 Chrome 实现。因此，该属性被添加到 HTML5\
  \ 中使其正式化。\n\n## head 属性\n\nHTML5 引入了 `document.head` 来指向文档的 `<head>` 元素，以补充指向文档元素的\
  \ `document.body`。你可以使用此属性或回退方法获取 `<head>` 元素的引用：\n\n```javascript\nvar head = document.head\
  \ || document.getElementsByTagName(\"head\")[0];\n```\n\n此代码使用 `document.head`（如果可用），否则回退到使用\
  \ `getElementsByTagName()` 的旧方法。`document.head` 属性在 Chrome 和 Safari 5 中实现。\n\n##\
  \ 字符集属性\n\nHTML5 描述了几个与文档字符集相关的属性。`charset` 属性指示文档实际使用的字符集，也可以用于指定新的字符集。默认情况下，该值为\
  \ `\"UTF-16\"`，尽管可以通过使用 `<meta>` 元素、响应头或直接设置 `charset` 属性来更改。这是一个示例：\n\n```javascript\n\
  alert(document.charset); //\"UTF-16\"\ndocument.charset = \"UTF-8\";\n```\n\n\n\n\
  \n\n`defaultCharset` 属性根据默认浏览器和系统设置指示文档应该使用的默认字符集。如果文档没有使用默认字符集，`charset` 和 `defaultCharset`\
  \ 的值可能会不同，如下例所示：\n\n```\nif (document.charset != document.defaultCharset){\nalert(\"\
  Custom character set being used.\");\n}\n```\n\n这些属性允许对文档上使用的字符编码进行更深入的了解和控制。如果使用得当，这可以让\
  \ Web 开发者确保他们的页面或应用程序能够正常显示。\n\n`document.charset` 属性受 Internet Explorer、`Firefox`、`Safari`、`Opera`\
  \ 和 `Chrome` 支持。`document.defaultCharset` 属性受 Internet Explorer、`Safari` 和 `Chrome`\
  \ 支持。\n\n## 自数据属性\n\nHTML5 允许元素指定带有 `data-` 前缀的非标准属性，以便提供对元素的渲染或语义价值并非必需的信息。可以根据需要添加这些属性，并命名为任何名称，只要名称以\
  \ `data-` 开头。以下是一个示例：\n\n```\n<div id=\"myDiv\" data-appId=\"12345\" data-myname=\"\
  Nicholas\"></div>\n```\n\n当定义自定义数据属性时，可以通过元素的 `dataset` 属性进行访问。`dataset` 属性包含一个\
  \ `DOMStringMap` 实例，它是键值对的映射。每个格式为 `data-name` 的属性都由一个与属性名等同但不带 `data-` 前缀的属性表示（例如，属性\
  \ `data-myname` 由名为 `myname` 的属性表示）。用法示例：\n\n```javascript\n//此示例中使用的方法仅用于说明目的\n\
  var div = document.getElementById(\"myDiv\");\n//获取值\nvar appId = div.dataset.appId;\n\
  var myName = div.dataset.myname;\n//设置值\ndiv.dataset.appId = 23456;\ndiv.dataset.myname\
  \ = \"Michael\";\n// 存在 \"myname\" 值吗？\nif (div.dataset.myname){\nalert(\"Hello,\
  \ \" + div.dataset.myname);\n}\n```\n\n当需要将非视觉数据绑定到元素上以进行其他形式的处理时，自定义数据属性非常有用。这是用于链接追踪和页面聚合（mashups）的常用技术，以便更好地识别页面的部分。\n\
  \n截至本文写作时，只有 `Firefox` 6+ 和 `Chrome` 实现了此功能。\n\n## 标记插入\n\n虽然 DOM 为文档中的节点提供了细粒度的控制，但在尝试向文档中注入大量新\
  \ HTML 时，可能会变得繁琐。与其创建一系列 DOM 节点并按正确的顺序将它们连接，不如使用标记插入功能之一来注入 HTML 字符串要简单得多（且速度更快）。以下\
  \ DOM 扩展在 HTML5 中已为此目的进行了标准化。\n\n### innerHTML 属性\n\n在读模式下使用时，`innerHTML` 返回表示所有子节点的\
  \ HTML，包括元素、注释和文本节点。在写模式下使用时，`innerHTML` 将根据指定的值完全替换元素中的所有子节点为新的 DOM 子树。考虑以下 HTML\
  \ 代码：\n\n```html\n<div id=\"content\">\n<p>This is a <strong>paragraph</strong>\
  \ with a list following it.</p>\n<ul>\n<li>Item 1</li>\n<li>Item 2</li>\n<li>Item\
  \ 3</li>\n</ul>\n</div>\n```\n\n对于示例中的 `<div>` 元素，`innerHTML` 属性返回以下字符串：\n\n```html\n\
  <p>This is a <strong>paragraph</strong> with a list following it.</p>\n<ul>\n<li>Item\
  \ 1</li>\n<li>Item 2</li>\n<li>Item 3</li>\n</ul>\n```\n\n`innerHTML` 返回的准确文本因浏览器而异。`Internet\
  \ Explorer` 和 `Opera` 倾向于将所有标签转换为大写，而 `Safari`、`Chrome` 和 `Firefox` 则按照文档指定的方式返回\
  \ HTML，包括空格和缩进。你不能依赖 `innerHTML` 的返回值在不同浏览器之间是完全相同的。\n\n在写模式下使用时，`innerHTML` 将给定字符串解析为\
  \ DOM 子树，并用它替换所有现有子节点。由于字符串被视为 HTML，所有标签都会按照浏览器处理 HTML 的标准方式转换为元素（再次，这因浏览器而异）。此处所示设置带任何\
  \ HTML 标签的简单文本将设置纯文本：\n\n```javascript\ndiv.innerHTML = \"Hello world!\";\n```\n\
  \n将 `innerHTML` 设置为包含 HTML 的字符串行为完全不同，因为 `innerHTML` 会解析它们。考虑以下示例：\n\n```javascript\n\
  div.innerHTML = \"Hello & welcome, <b\\\"reader\\\"!\";\n```\n\n该操作的结果如下：\n\n```html\n\
  <div id=\"content\">Hello &amp; welcome, <b>&quot;reader&quot;!</b></div>\n```\n\
  \n在设置 `innerHTML` 后，你可以像访问文档中的任何其他节点一样访问新创建的节点。\n\n![image](img/pen.gif)\n\n设置 `innerHTML`\
  \ 会导致 HTML 将 HTML 解析为适当的 DOM 树。这意味着设置 `innerHTML` 然后读取它通常会导致返回不同的字符串。这是因为返回的字符串是为原始\
  \ HTML 字符串创建的 DOM 子树序列化的结果。\n\n`innerHTML` 有一些局限性。例如，在大多数浏览器中，通过 `innerHTML` 插入的\
  \ `<script>` 元素无法执行。`Internet Explorer` 8 及早期版本是唯一允许此点的浏览器，但仅当指定了 `defer` 属性且 `<script>`\
  \ 元素之前有一个微软所谓的范围元素（scoped element）时。`<script>` 元素被视为 `NoScope` 元素，这意味着它在页面上没有视觉表示，就像\
  \ `<style>` 元素或注释一样。`Internet Explorer` 会从通过 `innerHTML` 插入的字符串开头删除所有 `NoScope`\
  \ 元素，这意味着以下代码无效：\n\n```javascript\ndiv.innerHTML = \"<script defer>alert('hi');<\\\
  /script>\"; //不起作用\n```\n\n在这种情况下，`innerHTML` 字符串以 `NoScope` 元素开头，因此整个字符串变为空。为了让此脚本正常工作，你必须在它之前放在范围元素，例如文本节点或没有闭合标签的元素（如\
  \ `<input>`）。以下行都将有效：\n\n```javascript\ndiv.innerHTML = \"_<script defer>alert('hi');<\\\
  /script>\";\ndiv.innerHTML = \"<div> </div><script defer>alert('hi');<\\/script>\"\
  ;\ndiv.innerHTML = \"<input type=\\\"hidden\\\"><script defer>alert('hi');<\\/script>\"\
  ;\n```\n\n\n\n\n\nFirefox 对于使用 `application/xhtml+xml` 内容类型传输的 XHTML 文档，对 `innerHTML`\
  \ 的支持更为严格。在 XHTML 文档中使用 `innerHTML` 时，你必须指定良好的 XHTML 代码。如果代码不符合规范，设置 `innerHTML`\
  \ 将静默失败。\n\n每当你使用 `innerHTML` 从代码外部源插入 HTML 时，在将其传递给 `innerHTML` 之前对 HTML 进行清理（sanitize）是非常重要的。Internet\
  \ Explorer 8 为此目的添加了 `window.toStaticHTML()` 方法。该方法接受一个参数（即 HTML 字符串），并返回一个清理后的版本，该版本已从源中删除了所有的脚本节点和脚本事件处理程序属性。以下是一个示例：\n\
  \n```\nvar text = \"<a href=\\\"#\\\" onclick=\\\"alert('hi')\\\">Click Me</a>\"\
  ;\nvar sanitized = window.toStaticHTML(text); //仅限 Internet Explorer 8\nalert(sanitized);\
  \ //\"<a href=\\\"#\\\">Click Me</a>\"\n```\n\n此示例通过 `toStaticHTML()` 运行了一个 HTML\
  \ 链接字符串。处理后的文本不再包含 `onclick` 属性。尽管 Internet Explorer 8 是唯一具有此原生功能的浏览器，但在使用 `innerHTML`\
  \ 时，仍建议谨慎操作，并在可能的情况下在插入之前手动检查文本。\n\n## outerHTML 属性\n\n当在读模式下调用 `outerHTML` 时，它会返回调用它的元素的\
  \ HTML 及其子节点。当在写模式下调用它时，`outerHTML` 会将调用它的节点替换为从解析给定的 HTML 字符串创建的 DOM 子树。考虑以下 HTML\
  \ 代码：\n\n![image](img/logo1.gif)\n\n```\n<div id=\"content\">\n<p>这是一个后面跟着列表的<strong>段落</strong></p>\n\
  <ul>\n<li>Item 1</li>\n<li>Item 2</li>\n<li>Item 3</li>\n</ul>\n</div>\n```\n\n\
  OuterHTMLExample01.htm\n\n在示例示例中，当在 `<div>` 上调用 `outerHTML` 时，将返回相同的代码，包括 `<div>`\
  \ 本身的代码。请注意，根据浏览器解析和解释 HTML 代码的方式，可能会存在差异。（这些差异与你在使用 `innerHTML` 时注意到的差异类型相同。）\n\
  \n可以通过以下方式使用 `outerHTML` 设置值：\n\n```\ndiv.outerHTML = \"<p>这是一个段落。</p>\";\n```\n\
  \n此代码执行的操作与以下 DOM 代码相同：\n\n```\nvar p = document.createElement(\"p\");\np.appendChild(document.createTextNode(\"\
  This is a paragraph.\"));\ndiv.parentNode.replaceChild(p, div);\n```\n\n新的 `<p>`\
  \ 元素替换了 DOM 树中的原始 `<div>` 元素。\n\n`outerHTML` 属性受 Internet Explorer 4+、Safari 4+、Chrome\
  \ 和 Opera 8+ 支持。Firefox 从 7 版本开始仍然不支持 `outerHTML`。\n\n## insertAdjacentHTML() 方法\n\
  \n标记插入的最后一个新增功能是 `insertAdjacentHTML()` 方法。该方法同样源于 Internet Explorer，接受两个参数：插入的位置和要插入的\
  \ HTML 文本。第一个参数必须是以下值之一：\n\n*   `\"beforebegin\"` — 在元素之前作为前一个兄弟节点插入。\n*   `\"afterbegin\"\
  ` — 在元素内部，作为第一个子节点之前的新节点或一系列子节点插入。\n*   `\"beforeend\"` — 在元素内部，作为最后一个子节点之后的新节点或一系列子节点插入。\n\
  *   `\"afterend\"` — 在元素之后作为下一个兄弟节点插入。\n\n注意，这些值均不区分大小写。第二个参数被解析为 HTML 字符串（与 `innerHTML`/`outerHTML`\
  \ 相同），如果该值无法正确解析，将抛出错误。基本用法如下：\n\n```\n//作为前一个兄弟节点插入\nelement.insertAdjacentHTML(\"\
  beforebegin\", \"<p>Hello world!</p>\");\n//作为第一个子节点插入\nelement.insertAdjacentHTML(\"\
  afterbegin\", \"<p>Hello world!</p>\");\n//作为最后一个子节点插入\nelement.insertAdjacentHTML(\"\
  beforeend\", \"<p>Hello world!</p>\");\n//作为下一个兄弟节点插入\nelement.insertAdjacentHTML(\"\
  afterend\", \"<p>Hello world!</p>\");\n```\n\nInternet Explorer、Firefox 8+、Safari、Opera\
  \ 和 Chrome 支持 `insertAdjacentHTML()` 方法。\n\n## 内存与性能问题\n\n使用本节中的方法替换子节点可能会导致浏览器内存问题，内存问题。当事件处理程序或其他\
  \ JavaScript 对象被分配给被移除的子树元素时，就会出现问题。如果一个元素具有事件处理程序（或作为属性的 JavaScript 对象），并且其中一个属性的使用方式导致该元素从文档树中移除，那么元素与事件处理程序之间的绑定将保留在内存中。如果频繁发生这种情况，页面的内存占用将会增加。在使用\
  \ `innerHTML`、`outerHTML` 和 `insertAdjacentHTML()` 时，最好手动移除即将删除的元素上的所有事件处理程序和 JavaScript\
  \ 对象属性。（事件处理程序将在第 13 章进一步讨论。）\n\n使用这些属性确实有优点，特别是在使用 `innerHTML` 时。通常情况下，通过 `innerHTML`\
  \ 插入大量新 HTML 比通过多次 DOM 操作创建节点并建立它们之间的关系更有效率。这是因为每当给 `innerHTML`（或 `outerHTML`）设置值时，都会创建一个\
  \ HTML 解析器。该解析器运行在浏览器级代码中（通常用 C++ 编写），其速度比 JavaScript 快得多。尽管如此，HTML 解析器的创建和销毁确实会有一些开销，因此最好限制设置\
  \ `innerHTML` 或 `outerHTML` 的次数。例如，使用 `innerHTML` 创建若干列表项的方法：\n\n```\nfor (var i=0,\
  \ len=values.length; i++){\nul.innerHTML += \"<li>\" + values[i] + \"</li>\";\n\
  }\n```\n\n上述代码效率很，因为它每次循环都会设置一次 `innerHTML`。此外，此代码在每次循环中都会读取 `innerHTML`，这意味着每次循环都会访问两次\
  \ `innerHTML`。最好是单独构建字符串并在最后只使用 `innerHTML` 赋值一次，如下：\n\n```\nvar itemsHtml = \"\"\
  ;\nfor (var i=0, len=values.length; i < len; i++){\nitemsHtml += \"<li>\" + values[i]\
  \ + \"</li>\";\n}\nul.innerHTML = itemsHtml;\n```\n\n此示例更有效，将 `innerHTML` 的使用限制为赋值。\n\
  \n## scrollIntoView 方法\n\nDOM 规范未解决的问题之一是如何滚动页面区域。为了填补这一空白，浏览器实现了多种控制滚动的方法。在各种私有方法中，只有\
  \ `scrollIntoView()` 被选中纳入 HTML5。\n\n`scrollIntoView()` 方法存在于所有 HTML 元素上，并滚动浏览器窗口或容器元素以使元素出现在视口内。如果提供了参数\
  \ `true` 或省略参数，窗口将滚动，使元素的顶部位于视口的顶部（如果可能的话）；否则，元素将滚动使其完全出现在视口内，但可能未对齐顶部。例如：\n\n```\n\
  //确保此元素可见\ndocument.forms[0].scrollIntoView();\n```\n\n该方法在页面发生某些情况需要引起用户注意力时非常有用。注意，为元素设置焦点也会导致浏览器将其滚动到视图中，以便正确显示焦点。\n\
  \n`scrollIntoView()` 方法受 Internet Explorer、Firefox、Safari、Opera 和 Chrome 支持。\n\n\
  ## 私有扩展\n\n尽管所有浏览器厂商都理解遵循标准的重要性，但它们都有向 DOM 中添加私有扩展的历史，以填补其认为的功能空白。尽管这在表面上看起来似乎是件坏事，但私有扩展为\
  \ Web 开发社区提供了许多重要的功能，这些功能后来被编码到 HTML5 等标准中。\n\n\n\n\n\n仍有大量的 DOM 扩展具有私有属性，尚未被纳入标准。这并不意味着它们以后不会被采纳为标准，在写作此时，它们仍然是私有的，并且仅被部分浏览器采用。\n\
  \n## 文档模式 (Document Mode)\n\nInternet Explorer 8 引入了一个名为 `document mode`（文档模式）的新概念。页面的文档模式决定它可以访问哪些功能。这意味着具有特定级别的\
  \ CSS 支持、可以通过 JavaScript 脚本的特定数量的功能以及处理 doctype 的特定方式。从 Internet Explorer 9 开始，共有四种不同的文档模式：\n\
  \n- `Internet Explorer 5` — 以兼容模式（quirks mode）渲染页面（Internet Explorer 5 的默认模式）。Internet\
  \ Explorer 8 及更高版本的新功能不可用。\n- `Internet Explorer 7` — 以 Internet Explorer 7 标准模式渲染页面。Internet\
  \ Explorer 8 及更高版本的新功能不可用。\n- `Internet Explorer 8` — 以 Internet Explorer 8 标准模式渲染页面。可以使用\
  \ Internet Explorer 8 的新功能，你可以访问 `Selectors API`、更多 CSS 2 选择器、某些 CSS3 特性以及某些 HTML\
  \ 5 特性。Internet Explorer 9 的功能不可用。\n- `Internet Explorer 9` — 以 Internet Explorer\
  \ 9 标准模式渲染页面。可以使用 Internet Explorer 9 的新功能，例如 `ECMAScript 5`、完整的 CSS3 支持和更多 HTML5\
  \ 特性。这种文档模式被认为是最先进的。\n\n文档模式的概念对于理解 Internet Explorer 8 及更高版本的工作原理非常重要。\n\n你可以通过使用\
  \ `X-UA-Compatible` HTTP 请求头或使用相应的 `<meta>` 标签来强制指定文档模式：\n\n```\n<meta http-equiv=\"\
  X-UA-Compatible\" content=\"IE=IEVersion\">\n```\n\n该字段中的 Internet Explorer 版本有几个不同的可能值，它们并不一定映射到这四种文档模式：\n\
  \n- `Edge` — 始终将文档放入可用最新文档模式中。忽略 Doctype。对于 Internet Explorer 8，这会将文档模式始终置为 Internet\
  \ Explorer 8 标准；对于 Internet Explorer 9，文档模式被强制置为 Internet Explorer 9 标准模式。\n- `EmulateIE9`\
  \ — 如果存在 doctype，将文档模式设置为 Internet Explorer 9 标准，否则将文档模式设置为 Internet Explorer 5。\n\
  - `EmulateIE8` — 如果存在 doctype，将文档模式设置为 Internet Explorer 8 标准，否则将文档模式设置为 Internet\
  \ Explorer 5。\n- `EmulateIE7` — 如果存在 doctype，将文档模式设置为 Internet Explorer 7 标准，否则将文档模式设置为\
  \ Internet Explorer 5。\n- `9` — 强制文档模式为 Internet Explorer 9 标准。忽略 Doctype。\n- `8`\
  \ — 强制文档模式为 Internet Explorer 8 标准。忽略 Doctype。\n- `7` — 强制文档模式为 Internet Explorer\
  \ 7 标准。忽略 Doctype。\n- `5` — 强制文档模式为 Internet Explorer 5。忽略 Doctype。\n\n例如，为了使文档模式的行为与在\
  \ Internet Explorer 7 中一致，你可以使用以下代码：\n\n```\n<meta http-equiv=\"X-UA-Compatible\"\
  \ content=\"IE=EmulateIE7\">\n```\n\n而要无论 doctype 如何都强制使用 Internet Explorer 7 标准模式，请使用此项：\n\
  \n```\n<meta http-equiv=\"X-UA-Compatible\" content=\"IE=7\">\n```\n\n你并不要求在页面上设置\
  \ `X-UA-Compatible` 字段。默认情况下，浏览器使用 doctype 来判断文档模式应该是最佳可用标准模式还是兼容模式。\n\n你可以使用 `document.documentMode`\
  \ 属性确定给定页面的文档模式，这是 Internet Explorer 8 的一个新功能，它返回正在使用的文档模式版本（在版本 9 中，值可以是 5, 7,\
  \ 8 或 9）：\n\n```\nvar mode = document.documentMode;\n```\n\n使用此属性可以让你获得关于页面将如何行为的提示。该属性在所有文档模式均可用。\n\
  \n## children 属性 (The children Property)\n\n版本 9 之前的 Internet Explorer 与浏览器在解释文本节点中空白字符上的差异导致了\
  \ `children` 属性的产生。`children` 属性是一个 `HTMLCollection`，它只包含同样是元素的子节点。否则，`children`\
  \ 属性与 `childNodes` 相同，当一个元素只有元素子节点时，它们可能包含相同的项。`children` 属性的访问方式如下：\n\n```\nvar\
  \ childCount = element.children.length;\nvar firstChild = element.children[0];\n\
  ```\n\n`children` 集合在 Internet Explorer 5、Firefox 3.5、Safari 2（有 Bug）、Safari 3（完整）、Opera\
  \ 8 和 Chrome（所有版本）中受支持。Internet Explorer 8 及早期版本也会在 `children` 集合中返回注释（而 Internet\
  \ Explorer 9 及更高版本不会）。\n\n## contains() 方法 (The contains() Method)\n\n通常需要确定给定节点是否是另一个节点的后代。Internet\
  \ Explorer 首次引入 `contains()` 方法作为提供此类信息的一种，而无需向上遍历 DOM 文档树。`contains()` 方法在应开始搜索的祖先节点上调用，并接受一个参数，即被的后代节点。如果该节点作为根节点的后代存在，则该方法返回\
  \ `true`；否则返回 `false`。这是一个示例：\n\n```\nalert(document.contains(body)); //true\n```\n\
  \n此示例测试了 <body> 元素是否是 <html> 元素的后代，在格式良好的 HTML 页面中这将返回 `true`。`contains()` 方法在 Internet\
  \ Explorer、Firefox 9+、Safari、Opera 和 Chrome 中支持。\n\n另一种确定关系的方法是使用 DOM 3 `compareDocumentPosition()`\
  \ 方法，该方法在 Internet Explorer 9+、Firefox、Safari 9+ 和 Chrome 中支持。该方法确定两个节点之间的关系并返回位掩码。掩码的值如下表所示：\n\
  \n| 掩码 | 节点关系 |\n| --- | --- |\n| 1 | 断开（传入节点不在文档中） |\n| 2 | 在之前（传入节点在 DOM 树中位于参考节点之前）\
  \ |\n| 4 | 在之后（传入节点在在 DOM 树中位于参考节点之后） |\n| 8 | 包含（传入节点是参考节点的祖先） |\n| 16 | 被包含（传入节点是参考节点的后代）\
  \ |\n\n为了模拟 `contains()` 方法，你将对应 `16` 掩码。`compareDocumentPosition()` 的结果可以通过位与操作来确定参考节点是否包含给定节点。这里有一个示例：\n\
  \n```\nvar result = document.documentElement.compareDocumentPosition(document.body);\n\
  alert(!!(result & 16));\n```\n\n当执行此代码时，结果将变为 20（4，“在之后”加 16，“被包含”）。对结果应用 16 位掩码会返回一个非零数字，两个非（NOT）运算符会将该值转换为布尔值。\n\
  \n一个通用的 `contains` 函数可以通过简单的浏览器和能力检测来创建，如下所示：\n\n![image](img/logo1.gif)\n\n```\n\
  function contains(refNode, otherNode){\nif (typeof refNode.contains == \"function\"\
  \ &&\n(!client.engine.webkit || client.engine.webkit >= 522)){\n  return refNode.contains(otherNode);\n\
  } else if (typeof refNode.compareDocumentPosition == \"function\"){\n  return !!(refNode.compareDocumentPosition(otherNode)\
  \ & 16);\n} else {\n  var node = otherNode.parentNode;\n  do {\n    if (node ===\
  \ refNode){\n      return true;\n    } else {\n      node = node.parentNode;\n \
  \   }\n  } while (node !== null);\n  return false;\n}\n}\n```\n\nContainsExample02.htm\n\
  \n\n\n\n\n此函数结合了三种判断节点是否为另一个节点的后代的方法。第一个参数是引用节点，第二个参数是待检查的节点。在函数体中，第一个检查是 `refNode`\
  \ 上是否存在 `contains()` 方法（能力检测）。这部分代码还检查了所使用的 WebKit 版本。如果函数存在且不是 WebKit（`!client.engine.webkit`），则代码可以继续执行。同样，如果浏览器是\
  \ WebKit 且至少是 Safari 3（WebKit 522 及更高版本），代码也可以继续执行。低于 522 的 WebKit 虽然拥有一个 `contains()`\
  \ 方法，但无法正常工作。\n\n接下来检查是否存在 `compareDocumentPosition()` 方法，函数的最后部分从 `otherNode` 开始向上遍历\
  \ DOM 结构，递归地获取 `parentNode` 并检查它是否等于 `refNode`。在文档树的最顶端，`parentNode` 将为 `null`，循环将结束。这是针对旧版本\
  \ Safari 的备用策略。\n\n## 标记插入\n\n虽然 HTML5 从 Internet Explorer 採纳了 `innerHTML` 和 `outerHTML`\
  \ 标记插入属性，但还有两个属性没有被采纳。HTML5 中遗漏的两个属性是 `innerText` 和 `outerText`。\n\n### innerText\
  \ 属性\n\n`innerText` 属性作用于元素内包含的所有文本内容，无论这些文本在子树中的深度有多深。当用于读取值时，`innerText` 会按照深度优先的顺序拼接子树中所有文本节点的值。当用于写入值时，`innerText`\
  \ 会移除元素的所有子节点并插入一个包含给定值的文本节点。考虑以下 HTML 代码：\n\n![image](img/logo1.gif)\n\n```\n<div\
  \ id=\"content\">\n<p>This is a <strong>paragraph</strong> with a list following\
  \ it.</p>\n<<ul>\n<li>Item 1</li>\n<li>Item 2</li>\n<li>Item 3</li>\n</ul>\n</div>\n\
  ```\n\n`InnerTextExample01.htm`\n\n对于示例中的 `<div>` 元素，`innerText` 属性返回以下字符串：\n\n\
  ```\nThis is a paragraph with a list following it.\nItem 1\nItem 2\nItem 3\n```\n\
  \n注意不同的浏览器处理空格的方式不同，因此格式可能包含也可能不包含原始 HTML 代码中的缩进。\n\n使用 `innerText` 属性设置 `<div>`\
  \ 元素的内容只需要这一行代码：\n\n![image](img/logo1.gif)\n\n```\ndiv.innerText = \"Hello world!\"\
  ;\n```\n\n`InnerTextExample02.htm`\n\n执行此行代码后，页面的 HTML 实际上被更改为以下内容：\n\n```\n<div\
  \ id=\"content\">Hello world!</div>\n```\n\n设置 `innerText` 会移除之前的所有子节点，完全改变 DOM\
  \ 子树。此外，设置 `innerText` 会对文本中可能出现的所有 HTML 语法字符（小于号、大于号、引号和和符号）进行编码。以下是一个示例：\n\n```\n\
  div.innerText = \"Hello & welcome, b>\\\"reader\\\"!</b>\";\n```\n\n`InnerTextExample03.htm`\n\
  \n该操作的结果如下：\n\n```\n<div id=\"content\">Hello &amp; welcome, &lt;b&gt;&quot;reader&quot;!&lt;/b&gt;</div>\n\
  ```\n\n设置 `innerText` 永远不会产生除容器之外的单个文本节点，因此为了保持该单个文本节点，必须对文本进行 HTML 编码。`innerText`\
  \ 属性也适用于剥离 HTML 标签。通过将 `innerText` 设置为自身的 `innerText`（如下所示），所有的 HTML 标签都被移除了：\n\n\
  ```\ndiv.innerText = div.innerText;\n```\n\n执行此代码会将容器的内容替换为已有的文本。\n\n`innerText`\
  \ 属性受 Internet Explorer 4+、Safari 3+、Opera 8+ 以及 Chrome 支持。Firefox 支持 `innerText`，但它支持一个名为\
  \ `textContent` 的对应属性。`textContent` 属性在 DOM Level 3 中规范，并受 Internet Explorer 9+、Safari\
  \ 3+、Opera 10+ 以及 Chrome 支持。为了跨浏览器兼容，使用检查可用属性的函数非常有帮助，如下所示：\n\n```\nfunction getInnerText(element){\n\
  return (typeof element.textContent == \"string\") ?\nelement.textContent : element.innerText;\n\
  }\nfunction setInnerText(element, text){\nif (typeof element.textContent == \"string\"\
  ){\nelement.textContent = text;\n} else {\nelement.innerText = text;\n}\n}\n```\n\
  \n`InnerTextExample05.htm`\n\n这些方法都期望传入一个元素。然后检查该元素是否具有 `textContent` 属性。如果有，则 `typeof\
  \ element.textContent` 应该是 `\"string\"`。如果不可 `textContent`，每个函数都会使用 `innerText`。可以这样调用它们：\n\
  \n```\nsetInnerText(div, \"Hello world!\");\nalert(getInnerText(div)); //\"Hello\
  \ world!\"\n```\n\n使用这些函数可以确保根据浏览器中的可用内容使用正确的属性。\n\n![image](img/pen.gif)\n\n`innerText`\
  \ 返回的内容与 `textContent` 返回的内容有细微区别。`innerText` 会跳过内联样式和脚本块，而 `textContent` 会返回任何内联样式或脚本代码以及其他文本。避免浏览器差异的最佳方法是在浅层\
  \ DOM 子树上读取文本，或者在没有内联样式或内联脚本的 DOM 部分进行读取。\n\n### outerText 属性\n\n`outerText` 属性的工作方式与\
  \ `innerText` 相同，但它包含了调用它的节点本身。对于读取文本值，`outerText` 和 `innerText` 的行为基本上完全相同。但在写入模式下，`outerText`\
  \ 的行为非常不同。它不是只替换所用元素的子节点，`outerText` 实际上会替换整个元素，包括其子节点。考虑以下内容：\n\n```\ndiv.outerText\
  \ = \"Hello world!\";\n```\n\n这一行代码等同于以下两行：\n\n```\nvar text = document.createTextNode(\"\
  Hello world!\");\ndiv.parentNode.replaceChild(text, div);\n```\n\n本质上，新的文本节点完全替换了设置\
  \ `outerText` 的元素。从那时起，该元素不再存在于文档中，且无法被访问。\n\n`outerText` 属性受 Internet Explorer\
  \ 4+、Safari 3+、Opera 8+ 以及 Chrome 支持。该属性通常不被使用，因为它会修改访问它的元素。建议尽可能避免使用。\n\n## 滚动\n\
  \n如前所述，滚动是在 HTML5 之前没有规范区域。虽然 `scrollIntoView()` 在 HTML5 中标准化，但在不同的浏览器中仍有许多额外方法。以下每个方法作为\
  \ `HTMLElement` 类型的扩展，因此在所有元素上都可用：\n\n- `scrollIntoViewIfNeeded(alignCenter)`：滚动浏览器窗口或容器元素，使元素在不在视口时可见；如果元素已经在视口内，此方法将执行任何操作。可选的\
  \ `alignCenter` 参数如果设置为 `true`，将尝试将元素置于视口中心。此方法在 Safari 和 Chrome 中实现。\n- `scrollByLines(lineCount)`：根据给定行数的高度滚动元素的内容，行数正负均可。此方法在\
  \ Safari 和 Chrome 中实现。\n- `scrollByPages(pageCount)`：根据页面的高度滚动元素的内容，页面高度由元素的高度决定。此方法在\
  \ Safari 和 Chrome 中实现。\n\n请记住 `scrollIntoView()` 和 `scrollIntoViewIfNeeded()` 作用于元素的容器，而\
  \ `scrollByLines()` 和 `scrollByPages()` 影响元素本身。以下是使用这些方法的示例：\n\n```\n// 滚动五行\ndocument.body.scrollByLines(5);\n\
  // 确保此元素不在视口时可见\ndocument.images[0].scrollIntoViewIfNeeded();\n// 向上滚动一页\ndocument.body.scrollByPages(-1);\n\
  ```\n\n\n\n\n由于 `scrollIntoView()` 是所有浏览器都支持的方法，因此它通常是唯一被使用的。\n\n# 总结\n\n虽然 DOM\
  \ 定义了与 XML 和 HTML 文档交互的核心 API，但还有若干种规范为标准 DOM 提供了扩展。许多扩展是基于专有扩展的，随着其他浏览器开始模拟其功能，这些扩展后来变成了事实上的标准。本章涵盖的三个规范是：\n\
  \n*   `Selectors API`（选择器 API），它定义了两个基于 CSS 选择器检索 DOM 元素的方法：`querySelector()` 和\
  \ `querySelectorAll()`。\n*   `Element Traversal`（元素遍历），它在 DOM 元素上定义了额外的属性，允许轻松地遍历到下一个相关的\
  \ DOM 元素。这种需求的出现是因为 DOM 对空白字符的处理，这会在元素之间创建文本节点。\n*   `HTML5`，它为标准 DOM 提供了大量的扩展。这些包括对\
  \ `innerHTML` 等事实性标准的标准化，以及用于处理焦点管理、字符集、滚动等的额外功能。\n\n目前 DOM 扩展的数量较少，但随着 Web 技术的不断演进，其数量几乎会持续增长。浏览器仍在尝试专有扩展，这些扩展如果成功，最终可能会成为伪标准或被整合到未来版本的规范中。\n\
  \n# 第 12 章：DOM Level 2 和 3\n\n## 本章内容\n\n*   Level 2 和 3 中引入的 DOM 更改\n*   用于操作样式的\
  \ DOM API\n*   使用 DOM 遍历和范围（ranges）的工作\n\nDOM 的第一级关注于定义 HTML 和 XML 文档的底层结构。DOM Level\
  \ 2 和 3 在此结构的基础上引入了更多的交互性和对更高级 XML 特性的支持。因此，DOM Level 2 和 3 实际上由几个模块组成，这些模块虽然相关，但描述的是\
  \ DOM 的非常具体的子集。这些模块如下：\n\n*   `DOM Core` —— DOM 核心——基于 Level 1 核心，为节点添加方法和属性。\n\
  *   `DOM Views` —— DOM ——基于样式信息定义文档的不同视图。\n*   `DOM Events` —— DOM 事件——解释了如何使用事件将交互绑定到\
  \ DOM 文档。\n*   `DOM Style` —— DOM 样式——定义了如何通过程序访问和更改 CSS 样式信息。\n*   `DOM Traversal\
  \ and Range` —— DOM 遍历与范围——引入了遍历 DOM 文档并选择其特定部分的新接口。\n*   `DOM HTML` —— DOM HTML——基于\
  \ Level 1 HTML，添加了属性、方法和新接口。\n\n本章将探索这些模块中的每一个，DOM 事件 除外，后者将在第 13 章中详细介绍。\n\n![image](img/pen.gif)\n\
  \nDOM Level 3 还包含 `XPath` 模块以及 Load and Save（加载与保存）模块。这些将在第 18 章中讨论。\n\n## DOM 更改\n\
  \nDOM Level 2 和 3 Core 的目的是扩展 DOM API 以涵盖 XML 的所有需求，并提供更好的错误处理和特性检测。在大多数情况下，这意味着支持\
  \ XML 命名空间概念。DOM Level 2 Core 没有引入任何新类型；它只是简单地扩充了 DOM Level 1 中定义的类型，以包含新的方法和属性。DOM\
  \ Level 3 Core 进一步扩充了现有类型，并引入了几个新类型。\n\n同样，`DOM Views` 和 `HTML` 扩充了 DOM 接口，提供了新的属性和方法。这两个模块相当较小，因此与\
  \ Core 归类一起讨论对基础 JavaScript 对象的更改。你可以使用以下代码确定哪些浏览器支持 DOM 的这些部分：\n\n```\nvar supportsDOM2Core\
  \ = document.implementation.hasFeature(\"Core\", \"2.0\");\nvar supportsDOM3Core\
  \ = document.implementation.hasFeature(\"Core\", \"3.0\");\nvar supportsDOM2HTML\
  \ = document.implementation.hasFeature(\"HTML\", \"2.0\");\nvar supportsDOM2Views\
  \ = document.implementation.hasFeature(\"Views\", \"2.0\");\nvar supportsDOM2XML\
  \ = document.implementation.hasFeature(\"XML\", \"2.0\");\n```\n\n![image](img/pen.gif)\n\
  \n本章仅涵盖浏览器已实现的 DOM 部分；尚未被任何浏览器实现的部分未被提及。\n\n## XML 命名空间\n\nXML 命名空间允许来自不同 XML 语言的元素混合在单个良好的文档中，而无需担心元素名称冲突。从技术上讲，HTML\
