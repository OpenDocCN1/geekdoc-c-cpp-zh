  \nNICHOLAS C. ZAKAS 从事 Web 开发已多年。期间，他既参与了全球一些大公司使用的企业内部网应用开发，也参与了 My Yahoo! 和 Yahoo!\
  \ 首页等大型消费者网站。作为 Yahoo! 的演示架构师，Nicholas 指导了全球访问量最大的网站之一的前端开发和标准。Nicholas 是一位知名的演讲者，经常在公司、会议和聚会中就前端最佳实践和新技术进行演讲。\n\
  \n## 关于作者\n\n![image](img/fix-01.jpg)\n\nNICHOLAS C. ZAKAS 是一位拥有十多年经验的前端工程师。John\
  \ 在加州大学伯克利分校获得数学学士学位，目前在一家初创公司担任首席人员。当他不编程时，经常沉迷于数学、哲学或杂耍。\n\n## 制作人员\n\n执行编辑：Carol\
  \ Long\n\n高级项目编辑：Kevin Kent\n\n技术编辑：John Peloquin\n\n制作编辑：Kathleen Wisor\n\n拷贝编辑：Katherine\
  \ Burt\n\n编辑经理：Mary Beth Wakefield\n\n自由稿编辑经理：Rosemarie Graham\n\n市场总监：David Mayhew\n\
  \n市场经理：Ashley Zurcher\n\n业务经理：Amy Knies\n\n制作经理：Tim Tate\n\n副总裁兼执行出版：Neil Edde\n\
  \n助理出版：Jim Minatel\n\n项目协调（封面）：Katie Crocker\n\n校对：Nicole Hirschman\n\n索引：Robert\
  \ Swanson\n\n封面设计：Leandra Young\n\n封面图片：© iStock/Andrew Rich\n\n## 致谢\n\n尽管封面上写的是作者的名字，但没有书并不是一个人的成果，我想感谢参与其中的几位人士。\n\
  \n首先，最要感谢 John Wiley & Sons 继续提供我写作的机会。他们是愿意为第一版《专业级 JavaScript》对一个匿名作者承担风险的人，对此感激不尽。\n\
  \n感谢 John Wiley & Sons 的员工，特别是 Kevin Kent 和 John Peloquin，他们在确保我诚实以及处理我在写作过程中频繁更改内容方面表现得非常出色。\n\
  \n感谢所有对书籍初稿章节提供反馈的人：Rob Friesel, Sergey Ilinsky, Dan Kiel, Peter-Paul Koch, Jeremy\
  \ McPeak, Alex Petrescu, Dmitry Soshnikov 和 Juriy “Kangax” Zaytsev。你们的反馈让这本书成为了令我非常自豪的作品。\n\
  \n特别感谢 Brendan Eich 对第一章中关于 JavaScript 历史的修正。\n\n最后，但也同样，感谢 Rey Bango 为本书撰写序言。在多年的在线交流后，我有幸见到了\
  \ Rey。他是业内真正非常友善的人之一，我很荣幸他愿意为本书投入时间。\n\n\n\n\n回首我的职业生涯（现在已有 20 多多年），在意识到我的白发真的冒出来的出来的空隙，我反思了那些极大影响了我职业生活和决策的技术与人物。然而，如果我必须选择一种对我产生单一最大积极影响的技术，那将是\
  \ `JavaScript`。请注意，我并不总是 `JavaScript` 的信徒。像许多人一样，我曾将其看作一种被边缘化的娱乐语言，仅用于制作旋转轮幅图和在页面上点缀一些有趣的特效。我当时是一个服务器端开发人员，该死的，我们可不玩玩具语言！但随后发生了一了：`Ajax`。\n\
  \n我永远不会忘记听到随处都是 `Ajax` 这个流行词，并认为它是某种非常酷、新颖且创新的技术。我必须去查查它，当我读到相关内容时，我震惊了，因为我发现那个被我轻易贬弃的玩具语言，现在是每一位专业\
  \ Web 开发者都在谈论的技术。突然间，我的认知改变了。当我继续探索 `Ajax` 背后的本质时，我意识到 `JavaScript` 是极其强大的，我想要拥有它所提供的所有美好。于是，我全身心地拥抱了它，努力理解这门语言，加入\
  \ `jQuery` 项目团队，并专注于客户端开发。生活变得很好。\n\n我越深入地参与 `JavaScript`，我遇到的开发者就越多，其中一些人到今天我仍视其为巨星和导师。Nicholas\
  \ Zakas 就是这些开发者之一。我记得读这本书的第二版时，感觉尽管我经过了多年的钻研，我依然从中中学到了非常多的东西。而且这本书感觉非常真诚且深思熟虑，仿佛\
  \ Nicholas 明白他的读者的经验水平会有所不同，因此他需要据此调整语调。这在技术类书中非常引人注目。大多数作者试图通过深入的、晦涩难懂的技术术语来给人留深刻印象。而这本书不同，它立即成为了我的必读书籍，也是我推荐给任何想要实实掌握\
  \ `JavaScript` 的开发者的书籍。我希望每个人都有同样的感受，并意识到它是多么宝贵的资源。\n\n然后，在一次 `jQuery` 大会议上，我有极大的幸运实际上亲面见到了\
  \ Nicholas。他可是世界上顶尖的 `JavaScript` 开发者之一，正致力于世界上最重要的 Web 属性之一（雅虎!），而他是我见过的最友蔼的人之一。我承认；见到他时我有点被星迷了。而最棒的一点是，他只是一个极其务实的人，只想帮助开发者变得优秀。因此，不仅是他的书改变了我对\
  \ `JavaScript` 的想法，Nicholas 本人也是我想要继续合作并加加了解的人。\n\n当 Nicholas 邀请我写这篇序言时，我无法形容我是多么受宠若惊。我竟然为这位大师写开场白。这证明了他是一个多么酷酷的人。但最重要的是，它给了我一个机会与你们分享为什么我觉得这书如此重要。我读过很多\
  \ `JavaScript` 书，那里确实有很多出色的作品。然而，在我看来，这本书提供了全方位的保障，让你成为一个极其精通且能干的 `JavaScript` 开发者。从表达式和变量声明等入门级主题，到闭包和面向对象开发等高级主题，这种平滑且周全的过渡，使它与其它书籍区分开来——那些书籍要么过于入门，要么预认为你已经在用\
  \ `JavaScript` 构建导弹制导系统了。这是一本面向“普通人”的书，它将帮助你写出令你自豪的代码，构建出令人们兴奋和喜悦的网站。\n\n—Rey Bango\n\
  \n微软公司高级技术推广工程师\n`jQuery` 项目团队\n\n# 引言\n\n有人声称 `JAVASCRIPT` 现在是世界上最流行的编程语言，运行着无数复杂的\
  \ Web 应用，世界赖以它们来处理业务、购物、管理流程等。\n\n`JavaScript` 的基础非常松基于 `Java`，`Java` 是一种面向对象的编程语言，通过嵌入式\
  \ applet 在 Web 上流行。尽管 `JavaScript` 具有类似的语法和编程方法，但它并不是 `Java` 的“轻量级”版本。相反，`JavaScript`\
  \ 是它自己的动态语言，立足于全球的 浏览器，并增强了网站和 Web 应用程序的用户交互。\n\n在书中，`JavaScript` 涵盖了从最早的 Netscape\
  \ 浏览器到如今完全支持 `DOM` 和 `Ajax` 的演变。你将学习如何扩展这种语言以适应特定需求，以及如何在没有 `Java` 或隐藏帧等媒介的情况下，创建无缝的客户端-服务器通信。简而言之，你将学习如何将\
  \ `JavaScript` 解决方案应用于全球 Web 开发者面临的业务问题。\n\n## 这本书是给谁读的\n\n这本书针对三类读者：\n\n*   熟悉面向对象编程的经验丰富的开发者，他们希望学习与\
  \ `Java` 和 `C++` 等传统 OO 语言相关的 `JavaScript`。\n*   试图提高其网站和 Web 应用程序可用性的 Web 应用程序开发者。\n\
  *   旨在更好地理解这门语言的初级 `JavaScript` 开发者。\n\n此外，熟悉以下相关技术是该书适合你的强有力指标：\n\n*   `Java`\n\
  *   `PHP`\n*   `ASP.NET`\n*   `HTML`\n*   `CSS`\n*   `XML`\n\n这本书并不针对缺乏基础计算机科学背景的初学者，或只想为网站添加一些简单用户交互的读者。这些读者应该参考\
  \ Wrox 的《Beginning JavaScript, 4th Edition》(Wiley, 2009)。\n\n## 本书涵盖的内容\n\n《Professional\
  \ JavaScript for Web Developers, 3rd Edition》提供了开发者层面的介绍，以及 `JavaScript` 更高级且实用的功能。\n\
  \n从基础开始，本书探索了 `JavaScript` 如何起源并演变成如今的模样。随后详细讨论了构成 `JavaScript` 实现的组件，特别关注诸如 `ECMAScript`\
  \ 和文档对象模型 (`DOM`) 等标准。还讨论了不同浏览器中 `JavaScript` 实现的差异。\n\n在此基础之上，本书继续涵盖 `JavaScript`\
  \ 的核心概念，包括其面向对象编程、继承以及在 `HTML` 中的应用。对事件和事件处理的深度检查之后是对浏览器检测技术的探索。书中探索了新的 API，如 `HTML5`、Selectors\
  \ API 和 File API。\n\n书的最后一部分关注高级主题，包括性能/内存优化、最佳实践以及 `JavaScript` 的未来展望。\n\n## 本书结构\n\
  \n本书由以下章节组成：\n\n1\\.什么是 JavaScript? —— 解释 `JavaScript` 的起源：来源、演变以及现状。介绍的概念包括 `JavaScript`\
  \ 与 `ECMAScript` 的关系、文档对象模型 (`DOM`) 和浏览器对象模型 (`BOM`)。还包含了来自欧洲计算机协会 (`ECMA`) 和世界维网联盟\
  \ (`W3C`) 相关标准的讨论。\n\n2\\. HTML 中的 JavaScript —— 检查 `JavaScript` 如何与 `HTML` 协作创建动态网页。介绍了将\
  \ `JavaScript` 嵌入页面的各种方式，包括围绕 `JavaScript` 内容类型及其与 `<script>` 元素关系的讨论。\n\n3\\.语言基础\
  \ —— 介绍基础语言概念，包括语法和流程控制语句。解释了 `JavaScript` 与其他基于 C 的语言的语法相似之处并指出差异。介绍了与内建运算符相关的类型转换。\n\
  \n\n\n\n\n## 4. 变量、作用域与内存\n探索了 JavaScript 如何根据其弱类型特性来处理变量。书中包含了关于原始值和引用值之间差异的讨论，以及与变量相关的执行上下文信息。此外，对\
  \ JavaScript 垃圾回收的讨论解释了当变量超出作用域时内存是如何回收的。\n\n## 5. 引用类型\n详细介绍了 JavaScript 内置引用类型的所有细节，例如\
  \ `Object` 和 `Array`。书书中对 `ECMA-262` 中描述的每种引用类型都从理论以及它们与浏览器实现的关系两个方面进行了讨论。\n\n##\
  \ 6. 面向对象编程\n解释如何在 JavaScript 中使用面向对象编程。由于 JavaScript 没有类概念，书中探索了用于对象创建和继承的流行技术。本章还涵盖了函数原型的概念以及它如何与整体面向对象方法的关系。\n\
  \n## 7. 函数表达式\n探索了 JavaScript 最强大的特性之一：函数表达式。主题包括闭包、`this` 对象的工作原理、模块模式以及创建私有对象成员。\n\
  \n## 8. 浏览器对象模型\n引入了浏览器对象模型 (`BOM`)，它负责提供允许与浏览器本身进行交互的对象。书中涵盖了每个 BOM 对象，包括 `window`、`document`、`location`、`navigator`\
  \ 和 `screen`。\n\n## 9. 客户端检测\n解释了检测客户端及其能力的各种方法。不同的技术包括能力检测和用户代理（user-agent）字符串检测。书中讨论了每种方法的优缺点以及适用场景。\n\
  \n## 10. 文档对象模型\n引入了 `DOM Level 1` 中定义的 JavaScript 可用文档对象模型 (`DOM`) 对象。对 `XML` 及其与\
  \ `DOM` 关系的简要介绍，随后对整个 `DOM` 以及它如何允许开发者操作页面进行了深层探索。\n\n## 11. DOM 扩展\n解释了其他 API 以及浏览器本身如何通过更多功能来扩展\
  \ `DOM`。主题包括 `Selectors API`、`Element Traversal API` 以及 `HTML5` 扩展。\n\n## 12. DOM\
  \ 级别 2 和 3\n在前两章的基础上，解释了 `DOM Levels 2` 和 `3` 如何通过额外的属性、方法和对象增强 `DOM`。书中讨论了 `Internet\
  \ Explorer` 与其他浏览器之间的兼容性问题。\n\n## 13. 事件\n解释了 JavaScript 中事件的本质、它们的来源、遗留支持以及 `DOM`\
  \ 如何重新定义事件的工作方式。书中涵盖了多种设备，包括 `Wii` 和 `iPhone`。\n\n## 14. 脚本表单\n研究了使用 JavaScript\
  \ 增强表单交互并绕过浏览器局限性。讨论集中在单个表单元素（如文本框和选择框）以及数据验证和处理。\n\n## 15. Canvas 图形\n讨论了 `<canvas>`\
  \ 标签以及如何使用它创建即时图形。书中涵盖了 `2D context` 和 `WebGL` (3D) 上下文，为你创建动画和游戏提供了一个良好的起点。\n\n\
  ## 16. HTML5 脚本\n引入了 `HTML5` 中定义的 JavaScript API 变化。主题包括跨文档消息传递、`Drag-and-Drop API`、`<audio>`\
  \ 和 `<video>` 元素的脚本，以及历史状态管理。\n\n## 17. 错误处理与调试\n讨论了浏览器如何处理 JavaScript 代码中的错误，并提供了几种处理错误的方法。书中还讨论了每个浏览器的调试工具和技术，包括简化调试过程的建议。\n\
  \n## 18. JavaScript 中的 XML\n介绍了用于读取和操作 `eXtensible Markup Language` (`XML`) 数据的\
  \ JavaScript 特性。解释了不同网络浏览器在支持和对象上的差异，并为跨浏览器编码提供了建议。本章还涵盖了使用 `eXtensible Stylesheet\
  \ Language Transformations` (`XSLT`) 在客户端转换 `XML` 数据。\n\n## 19. 用于 XML 的 ECMAScript\n\
  讨论了 JavaScript 的扩展 `ECMAScript for XML` (`E4X`)，它旨在简化 `XML` 的工作。解释了 `E4X` 相比使用 `DOM`\
  \ 进行 `XML` 操作的优势。\n\n## 20. JSON\n引入 `JSON` 数据格式作为 `XML` 的替代。讨论了浏览器原生的 `JSON` 解析和序列化，以及使用\
  \ `JSON` 时的安全性考虑。\n\n## 21. Ajax 与 Comet\n研究了常见的 Ajax 技术，包括使用 `XMLHttpRequest` 对象和用于跨域\
  \ Ajax 的 `跨源资源共享` (`CORS`)。解释了不同浏览器实现和支持的差异，并提供了使用建议。\n\n## 22. 高级技术\n深入研究一些复杂的\
  \ JavaScript 模式，包括函数柯里化、部分函数应用和动态函数。还涵盖了创建自定义事件框架以为自定义对象提供简单的事件支持，以及使用 `ECMAScript\
  \ 5` 创建防篡改对象。\n\n## 23. 离线应用与客户端存储\n讨论了如何检测应用何时离线，并提供了在客户端机器存储数据的各种技术。从最常支持的特性 `cookies`\
  \ 开始，然后讨论了较新的功能，如 `Web Storage` 和 `IndexedDB`。\n\n## 24. 最佳实践\n探索了在企业环境中使用 JavaScript\
  \ 的方法。讨论了提高可维护性的技术，包括编码技巧、格式化和通用编程实践。讨论了执行性能，并引入了几种速度优化技术。最后，讨论了部署问题，包括如何创建构建过程。\n\
  \n## 25. 兴起的 API\n引入了正在创建以增强浏览器 JavaScript 的 API。尽管这些 API 尚未完成或完全实现，但它们已在展望中，且浏览器已开始部分实现其功能。涵盖了\
  \ `Web Timing`、`geolocation` 以及 `File API`。\n\n# 使用本书\n\n要运行书中的示例，您需要：\n\n*   `Windows\
  \ XP`、`Windows 7` 或 `Mac OS X`\n*   `Internet Explorer 6` 或更高、`Firefox 2` 或更高、`Opera\
  \ 9` 或更高、`Chrome` 或 `Safari 2` 或更高\n\n书中完整的源代码可以在 [www.wrox.com](http://www.wrox.com)\
