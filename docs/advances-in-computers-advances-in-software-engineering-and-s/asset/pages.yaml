    #  1. INTRODUCTION


    The Consumer Electronics Association estimated that over 15 million stand-alone
    global positioning systems (GPSs) were sold in 2009. This estimation did not include
    GPS units embedded in vehicles or mobile devices, such as phones and iPads. This
    increasing trend in technology has inspired a series of new services intended
    to address people’s social and societal needs.'
  merge: -1
  pgno: 114
- img_proc: true
  md: 'Acquiring real-time traffic information, providing the shortest detoured path,
    and finding the closest hospital or gas station are few examples of such services.


    Both economy and safety are primary motivators behind these services. At least
    35% of the working population in the United States commutes more than 30 min each
    day [1]. Additionally, Americans wasted approximately 4.2 billion hours in fuel
    while stuck in traffic in 2009 alone [2]. Less time wasted on the road results
    more time for productive activities and reduced travel spending. Furthermore,
    less spent in traffic implies a reduced chance of getting into an accident, which
    improves people''s safety. Thus, reducing commute time results in reduced monetary
    cost and improved safety.


    It is anticipated that future evolutions of ground transportation will ultimately
    transform into a cyber physical system (CPS). The CPS will be comprised of cyber
    infrastructure, communication links, and sensor as well as physical infrastructure
    consisting of roads and vehicles. The cyber infrastructure monitors, controls,
    and decision support for the physical infrastructure. A significant fraction of
    CPSs have components that are capable of intelligent communication and control.
    Added intelligence in the form of sensors, embedded systems, either short or long-range
    transceivers, and other computing or communication resources carries the promise
    of a less invasive operation flow, more robust infrastructure, increased autonomy,
    and improved safety.


    The ground transportation system, however, is considerably more complex than other
    CPSs such water distribution systems. The increased complexity is related to several
    factors, including:


    +   - the size and volatility of the underlying datasets,


    +   - the number of entities involved (each individual moving object (MO) needs
    to be accounted for), and


    +   - the human factor involved in the process.


    These characteristics are manifested in solutions that address both the frequent
    update of efficient access to data repositories and technical constraints of the
    cyber infrastructure. The latter is not within the scope of this chapter. This
    chapter discusses both the adaptation of previous techniques and the introduction
    of new techniques that alleviate the complexity in modeling ground transportation
    systems.


    Users access databases by means of queries. The location-based nature of user
    queries requires the database to answer position-related requests.'
