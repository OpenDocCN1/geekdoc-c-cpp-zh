    # 3.5 Data Error Mitigation


    Once the anomalous data has been detected it must be mitigated in order to prevent
    operational disruptions in the CPS. Therefore, it is important that the detection
    and mitigation process does not hinder normal operation. It is essential that
    data errors are detected and mitigated, while the data is still viable.


    Detected data errors or missing data can be mitigated in a number of ways. In
    some higher level data cleansing activities, multiple cleansing alternatives are
    available on a system. In this case, automatic data cleansing requires a set of
