    # 9.1 Integrated Complex Applications


    Perhaps, the most important issue we are now facing is the growing size and complexity
    of the large-scale programs we have adapted to serve most of society’s needs as
    well as the process that we have adopted to build them. In simple terms, most
    of today’s complex applications are not built, as much as they are “integrated”
    into highly complex modular arrangements that rival the most complex things built
    by man. To build so complex as a military weapons system, the components are normally
    integrated from the bottom up, to a top-down plan.


    This is not a new concept. Bottom-up integration has been the approach of choice
    since Cheops built his first pyramid. What is new the fact that the components
    that compose that stack are too complex and fundamentally invisible to be clearly
    understood and managed as individual entities in the product. Also the components
    come from a vast array of sources and are constructed, validated, and maintained
    with highly variable processes, practices, and capabilities. An acquirer has very
    little knowledge of the development practices used for a selected product, and
    at this time, no public certification of a supplier’s practices is available [71].
    One example of this variability was shown in the impact of a vulnerability in
    OpenSSL described in the Heartbleed incident [72].'
