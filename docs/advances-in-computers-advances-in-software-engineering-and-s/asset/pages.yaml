    # 3.3.2 Rule-Based Detection


    Rule-based statistical approaches are the simplest form of anomaly detection.
    An acceptable lower and upper limit for the data is set and any value outside
    of this range is an anomaly. This technique requires only the definition of an
    outlier to be set, making it inflexible and resulting in many false positives
