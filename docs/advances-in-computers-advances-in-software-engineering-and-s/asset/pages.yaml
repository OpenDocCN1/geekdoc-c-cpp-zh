    # Abstract


    In this chapter, the authors describe the evolution of software engineering (SE)
    and soft-ware assurance (SwA) from the days of punch cards until today. The authors
    create the backdrop for this development by describing the environment over the
    last 50 years. Technological advances during that period allowed the creation
    of programming languages, personal computers, the intranet, organized incident
    management, structured programming, and complex applications. Impacts of these
    advances, including the massive growth of the Internet and software-intensive
    products, transformed every-day lives.


    While these changes were happening, cyberattacks were also growing. Dating back
    to the late 1960s when phone systems were attacked, society has been affected
    by the “dark side” of computer technology. Computer viruses and malware are a
    common aspect of today’s landscape. To protect us and our data, laws that govern
    the protection of computer data were created and developed. Likewise, organizations
    and approaches for finding and addressing cyberattacks were established and grown.'
