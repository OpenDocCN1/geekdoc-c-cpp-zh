    # 3.2 Privacy Challenges in Cell Phone-Based mHealth Services


    In the context of using cell phone-based mHealth services, we generally identify
    three main security objectives, privacy, integrity, and availability. When considering
    the perspective of cell phone-based mHealth services, where users typically share
    personal and medical information in various support groups, preserving privacy
    is considered to be the most important objective.


    The protection of the user’s privacy is assumed to be the main objective for cell
    phone-based mHealth services. Privacy not only encompasses the protection of personal
    information, which users publish on their profiles, presumably accessible by their
    contacts only. Privacy is a fundamental human right and personal sensitive information
    is key factor of privacy. The privacy of sensitive information includes PII (any
    information that could be used to identify or locate an individual, eg, name,
    address, or information that can be correlated with other information to identify
    an individual, eg, credit card number, postal code, etc.) It also includes sensitive
    information related to race, health, sex, union membership, or other information
    that is considered private. This information also includes any type of medical
    condition or medical diagnosis information. When these types of information are
    stored and processed in the social networking platform, with user-identifiable
    data contained in the healthcare data, sensitive'
