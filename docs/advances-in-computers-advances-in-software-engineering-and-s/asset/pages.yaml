    The CERT/CC was designated to address Internet threats so that the community could
    coordinate a response [33]. The CERT/CC was tasked in its mission to focus on
    improving both the practices and survivability issues relating to critical information
    infrastructures.


    Its goal is to ensure that system developers and operators use appropriate technology
