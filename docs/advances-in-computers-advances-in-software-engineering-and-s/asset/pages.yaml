    # 5.2.3 Learning-Based Detection


    Like rule-based techniques, learning-based techniques detect anomalies in raw
    data. However, they require additional overhead that is not required of rule-based
    or estimation-based techniques. Learning-based techniques do not require predefined
    rules nor do they assume that the raw data will fit particular models. Instead,
    the model of normal data is learned, which leads to highly accurate identification
    of data anomalies.


    This accuracy comes at a cost. Algorithms for learning models can be computationally
    expensive, increasing processing time and storage while also increasing power
    consumption. In addition to the resources required to execute learning algorithms,
    it takes time for the learned model to become accurate enough to be usable. A
    node''s model can be adjusted as it receives new information from its sensors
    or neighbors. By including data from neighboring nodes in the learning process,
    a node may learn its data more quickly. It may also be possible to offload the
    learning process on more powerful hardware, but this comes at the cost of communication.


    Another way to reducing overhead is to build a partial model of normal data ahead
    of time using historically recorded data. However, building a model ahead of time
    requires making assumptions about data that will be collected. There may be a
    trade-off between building a flexible, highly accurate model from scratch and
    reducing the time required to build a useful model.


    Once a model is learned, using it to identify anomalies is fast. However, continuing
    to update the model with the learning algorithms requires additional processing
    time.


