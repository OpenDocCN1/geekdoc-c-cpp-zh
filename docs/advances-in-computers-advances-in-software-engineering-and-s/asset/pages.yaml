- img_proc: true
  md: 'In the popular media, the term "Worm" (1975) actually preceded the term "virus"
    (1983) [25,26]. The description of a program that propagates itself first appeared
    in the science fiction novel "Shockwave Rider" [26]. The author, John Brunner,
    coined the term as an homage to J.R.R. Tolkien’s "Great Worm."


    It was in 1984 that Frederick Cohen coined the term "" [27]. His term meant to
    describe any type of alien that replicates itself in the same manner as a "virus"
    would take place. The "virus" could install itself, or "infect," other programs
    [24]. By Cohen’s definition, a software "virus" can "contaminate" other programs
    by inserting copies of itself into, similar to the way a virus propagates [27].


    # 5.2 Viruses "In the Wild"


    So we see that the Morris Worm was not the first malicious exploit. Nonetheless,
    it differentiated itself from the other examples because it successfully operated
    on a networked system "in the wild."


    A virus is considered to be "in the wild" if it propagates uncontained in the
    realm of the general user community due to normal operation. "A virus being studied
    in a controlled environment for research purposes would not be considered ''in
    the wild.'' Also, a virus (or Trojan) that exists but is not actively spreading
    is not considered to be ''in the wild" [28].


    # 5.3 The Morris Worm


    The Morris Worm is NOT the first virus to live outside of a research facility.
    That distinction goes to the Elk Stoner virus, which was written 5 years earlier
    with the intention of exploiting an Apple II vulnerability [27] and was only propagated
    by floppy disk [28]. Nor is the Morris Worm the first personal computer (PC) virus.
    Brain Boot, which was written a year earlier as a deterrent to software piracy,
    carries that distinction [28]. What the Morris Worm DID accomplish was to popularize
    the fact that use of computers could be affected by uncontrollable external forces.


    The Morris Worm was released into networks that contained elements that would
    eventually come to be called the "Internet.\ That release took place on November
    2, 1988. The subsequent actions shut down internetworked components of SFSNET
    and only affected VAX’s running UNIX. The resultant fork-type attack led to a
    partitioning of SFSNET, as the component networks began to disconnect to preserve
    their own service capability [29]. In addition to a 3-day denial of service, the
    fragmentation of the existing network was perhaps the most disturbing aspect [29].'
