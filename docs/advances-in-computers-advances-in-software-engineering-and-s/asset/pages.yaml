    # 8.2.2 Security Requirements


    Federal information systems must meet the minimum security requirements. These
    requirements are defined in a mandatory security standard required by the FISMA
    legislation, FIPS 200 “Minimum Security Requirements for Federal Information and
    Information Systems” [67]. Organizations must meet the minimum security requirements
    by selecting the appropriate controls and assurance measures as described in NIST
    Special Publication 800–53, “Recommended Security Controls for Federal Information
    Systems” [68].


    The process of selecting the appropriate security controls and assurance requirements
    for organizational information systems to achieve adequate security is a multifaceted,
    risk-based assessment. It involves IT management and operational personnel within
    the organization. Agencies have flexibility in applying the baseline security
    controls in accordance with the tailored guidance provided in Special Publication
    800–53 [68]. This approach allows agencies to adjust the security controls to
    more closely fit their mission requirements and operational environments [68].'
