    # 6. SOFTWARE AS A COMMODITY AND THE RISE OF THE BEST PRACTICE APPROACH


    Throughout the 1980s, software and systems became products commercially for general
    use rather than exercises in specialized development. The term for software or
    a system that is purchased as a commodity, not developed internally, is *commercial
    off-the-shelf (COTS)*. COTS products can provide a number of important advantages,
    since only one organization must invest the development time and the costs of
    development are shared by all purchasers.


    # 6.1 Personal Computers


    The advent of software as a commodity can be traced to yet another massive change
    in the technology—the PC. Up to the late 1970s, computing was primarily a mainframe
    exercise. Large central processors and a network of dumb terminals and other peripherals
    were the state-of-the-art. The PC put into the hands of every person what had
    been, to a point, a rather arcane technology.


    Mainframe machines required a high degree of system management knowledge and the
    software running on them was massive as the computers they serviced. In addition,
    the software itself was often highly specialized for the mainframe operating systems
    it served and the cost of software was prohibitive to the normal buyer.


    Small, easy-to-operate personal machines and their attendant operating systems
    and application software opened up a market for conceivable consumer application
    from word processing to video games.


    The earliest version of a PC, at which the time was called a “microcomputer,”
    appeared in 1973 in the form of IBM’s SCAMP [34]. SCAMP led directly to the IBM
    51xx series in 1975 [34], which led to'
  merge: -1
