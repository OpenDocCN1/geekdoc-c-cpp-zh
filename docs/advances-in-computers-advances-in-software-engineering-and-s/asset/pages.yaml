  md: 'The GNNQ provides an aggregated answer to a set of KNNQs. For example, consider
    people in n companies/organizations who are trying to schedule a meeting. The
    best place for everyone to meet may be a site that reduces the total travel time.
    GNNQ would find a solution to this kind of situation. Thus, the GNNQ response
    reduces the collective cost metric (such as travel time) to provide an aggregated
    answer.


    Each aforementioned query type can be associated with a time parameter. In such
    cases, the queries aim to predict object positions at a specific future time stamp.
    For example, RQ extensions include predictive time slice queries, window queries,
    and moving queries. The predictive time slice query (also known as a future RQ
    or a predictive RQ) finds all of the MOs that will be inside the query range during
    the specified future period.


    The window query is a generalized form of the time-slice query with coinciding
    time stamps. The moving query specifies two ranges at different time stamps: the
    initial time and the end time. These two ranges could be different in size and/or
    location. The range at the initial time gradually evolves into the range at the
    end time. In general, these ranges can be considered to dynamically shaped moving
    range. The query answer contains all of the MOs that cross the moving range.


    Categories of queries under the frequency-based query taxonomy include both snapshot
    queries and continuous queries. If the query result is provided only once per
    request the query is identified as a snapshot query. This query expires when a
    result is produced. A continuous query processes a result continuously, informing
    the user of changes in the result set. Continuous queries do not expire with the
    first response. Instead, requesters revoke their query when they are no longer
    interested in the service for that particular query.


    The subcategories of these two taxonomies can be corelated as well, snapshot RQs,
    continuous RQs, snapshot KNNQs, continuous KNNQs, and so on. Queries discussed
    in the literature are typically snapshot queries.


    # 2.5 Performance Metrics and Challenges


    Users expect accuracy, short response times, and information privacy from an LDQ
    service provider. This chapter focuses on both response time and accuracy. Information
    privacy is beyond the scope of this work.'
