    # 5.1 Snapshot Query Algorithms


    Two recent algorithms that provide information about road traffic, ie query algorithm
    on R-TPR+-tree [21] and comprehensive algorithm on R^D-tree (also called R^DC-tree)
    [23] were compared in order to study the effects of individual performance. The
    experiments were conducted on MO data sets generated by the Brinkhoff generator
    [57]. Real road maps of United States were provided to the generator. Data sets
    were generated by varying three parameters: the predictive time length, and the
    road topology. Table 9 shows these parameters and their default values (in bold).
    The performance was measured in terms of I/O cost, execution time, and query accuracy.


    The execution time does not include initial bulk loading of the road map or objects,
    only the query processing time. The query accuracy was examined by comparing the
    number of objects in the predictive query results with the actual number of objects
    on the query road segment at the query time. I/O costs were measured as the number
    of disk-page accesses performed. Each test case was run for 250 queries and the
    average cost reported.


