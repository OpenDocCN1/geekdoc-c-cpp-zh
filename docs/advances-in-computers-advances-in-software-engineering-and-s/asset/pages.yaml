- img_proc: true
  md: 'One of the follow–on developments to structured programming and the associated
    mathematical proofs of correctness was the Cleanroom SE process [12] with its
    focus on defect prevention via rigorous software development methods. Much of
    the Cleanroom reality and prototype work were led by Rick Linger at IBM Federal
    Systems in collaboration with Harlan Mills. In addition to rigorous mathematical
    proofs and formal inspections, statistical testing was one of the methods used
    to develop zero-defect software.


    # 3.5 SE Education


    As the SE discipline reached new levels, so did the education required for its
    effective practice. In the late 1970s, master’s degree programs in SE began to
    emerge [1]. One of the very early programs was started at Wang Institute of Graduate
    Students. Other early programs appeared at Seattle University and Texas University.


    The workshop series that was so successful in IBM’s Federal Systems Division grew
    into a corporate-level commitment, and IBM’s Software Engineering Institute (SEI)
    was founded in New York City. (It was later moved to Westchester County.) The
    corporate model was slightly different, but many of the same courses were offered
    across the company, and at the corporate level, in-house instructors were certified
    to teach them via a formal instructor training program. Dick Farley wrote one
    of the first books on SE concepts [13] and went on to become a leader in SE education.


    +   4. COMPUTING MEETS REALITY: THE PROTECTION OF INFORMATION IN COMPUTERS


    The concept of transmitting data over predates the Internet by 150 years. Americans
    had been Samuel Morse’s simple little long before the Civil War. And in that War
    some of the techniques used by modern–day hackers, such as “man-in-the-middle,”
    first appeared. Nonetheless, the concepts that underlie the networked transmission
    of computer data were consolidated and popularized in a paper by Lickider [14].


    # 4.1 The SAGE and SABRE Networks


    What we eventually came to call commercial “networks” emerged in the early 1960s.
    There were military networks slightly earlier, primarily the SAGE network [15].
    The SAGE network actually led to a fortuitous conversation, held between a high-ranking
    American Airlines executive and'
  merge: -1
  pgno: 13
- img_proc: true
  md: '12 D. Shoemaker et al.


    Thomas J. Watson was the President of IBM. They happened to be sitting next to
    each other on the same airline flight.


    In that conversation, it was mentioned that American was developing its own reservation
    system, and it became clear that the SAGE system was perfectly suited to American
    Airlines'' booking needs [16]. That discussion in 1957 led to the joint American/IBM
    Semi-Automated Business Research Environment, or SABRE network, which was first
    fully operational on two IBM 7090 mainframes in 1960.


    American Airlines'' SABRE was the first everyday network operating in the United
    States. It handled 83,000 requests per day and far exceeded the capabilities of
    the manual systems used by the other airlines. At its inception, SABRE was a classic
    hardwired, physical network, dependent on copper wire to transmit its information.


    # 4.2 ARPANET


    About the same time SABRE was coming into use, the Defense Advanced Research Projects
    Administration (DARPA) began a project to interconnect its main computers across
    the United States (Cheyenne Mountain, SAC Headquarters, and the Pentagon). Lickerider
    was the leader of that effort [17]. Their product was rolled out in 1968 as the
    Advanced Research Projects Network (ARPANET). Numerous luminaries in the existing
    field were involved in the initial development, but Paul Baran''s packet-switching
    concepts were at the heart of the construction of ARPANET [18].


    Initially, ARPANET and other seminal packet-switching networks had a very minimal
    footprint in common use. ARPANET first joined two nodes (in October 1969) and
    then four nodes (in December 1969) [18]. Nevertheless, the genius of the commercial
    world was achieved by the early 1970s. All that required to get the foundation
    completed for the Internet was the creation of TCP/IP in 1975 [19].


