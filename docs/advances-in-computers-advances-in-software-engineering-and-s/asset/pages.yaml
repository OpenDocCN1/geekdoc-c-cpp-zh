    and database queries execute in the sensor database nodes. Energy efficiency is
    not really an issue for central traffic management aside from the cost associated
    with a higher energy bill.


    # 5.4 Mobile Elements of ITS Vehicle


    In this section the mobile elements of the example ITS system described in Section
    2 will be used to demonstrate where in a CPS resource constraints would dictate
    the cleansing technique (Table 9).


    # 5.4.1 Vehicle Operation


    Sensors for vehicle operation are typically embedded systems and are not as computationally
    sophisticated as other components of the vehicle. Although their processing power
    may be lower, these components should still be able to clean data items very quickly.
    Simpler data cleansing techniques, rule-based techniques, can cleanse data to
    some degree with short execution times without requiring more advanced CPUs. Communication
    for these elements is short distance, due to the proximity of the devices.'
