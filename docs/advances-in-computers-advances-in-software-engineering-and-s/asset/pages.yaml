    # 5.1 Types of System Constraints


    The hardware constraints of a networked system can be evaluated from two perspectives.
    The first perspective is from the hardware resources of the nodes. Nodes with
    limited computational resources, including mobile devices, not capable of executing
    the same algorithms as more powerful nodes. These nodes may lack the memory or
    disk space required to execute the algorithm, or they may lack the CPU speeds
    required to obtain a result in a reasonable amount of time. Additionally, some
    nodes may have constrained energy resources, which further limits computational
    ability. Computationally intensive algorithms increase energy consumption and
    may deplete energy resources at a faster rate.


