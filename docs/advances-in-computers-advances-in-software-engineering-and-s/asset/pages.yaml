- img_proc: true
  md: 'Advances in Software Engineering and Software Assurance


    FORTRAN was proposed as an alternative to assembly language (AL), which was the
    only programming utility available at the time. The AL had specifically designed
    to make the IBM 704 easier to use [6].


    Early programming was mostly limited to punched card input, and FORTRAN''s structure
    accommodated that by assigning fixed columns to certain required computer functions.
    Columns 1–5 were designated as operators [6]. Besides enabling a FORMAT, READ,
    or WRITE ability, those columns allowed a GOTO capability. GOTO was useful for
    jump purposes, should the programmer need to alter the execution sequence of a
    Von Neumann architecture machine [6], GOTO allowed for much more flexible and
    complex applications.


    # 3.2 ALGOL 60


    FORTRAN was followed by other compiler languages in the late 1950s, such as CODASYL''s
    COBOL (1959). But it was a refinement of compiler technology through the advent
    of ALGOL 60 that made the structured programming theorem practical. This new compiler
    language underwent the ability to develop structured code. ALGOL 60 is of considerable
    interest in a discussion of structured programming because it provided the facility
    for implementing the control structures suggested by the structured programming
    theorem.


    Specifically, it featured three innovative language features: code blocks and
    entry/exit delimiters, nested functions creating the capability for information
    hiding, and notational design languages [7]. The proposal for notational design
    languages was carried into ALGOL by John Backus, the father of FORTRAN.


    The approach he proposed permitted the complex description of programming syntax.
    He introduced the concept of notation for representation of complex programming
    design for control structure functioning at the international conference for the
    design of the ALGOL compiler at Eidgenische Technische Hochschule (ETH) Zürich
    in 1958 [4]. This notation was documented in the 1960 report on ALGOL as Backus–Naur
    Form (BNF) [8].


    BNF notation provided a context-free grammar for describing the “block structure”
    of the structured programming theorem [9]. Thus it is the root of the tree that
    has languages such as Pascal, C, C++, and Java. ALGOL was also the first language
    to implement BNF [10]. It also provided the facility for recursive calling of
    functions, which made block programming much more practical to implement [9].'
