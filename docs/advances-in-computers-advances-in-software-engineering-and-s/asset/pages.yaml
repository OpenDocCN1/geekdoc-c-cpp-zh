  md: '# 9.2 Component Complexity and Virtuality


    Component complexity and virtuality create the problem that the pieces that go
    into a technology cannot realistically monitored and controlled. So we are left
    with "trust" as the only alternative for assurance.


    It might be possible to trust a product that was built by a well-known and familiar
    partner. But due to the high cost of onshore development and the "faster-cheaper-better"
    mentality of just-in-time production, most of the work that goes into building
    a technology product is outsourced down a supply chain. It is well documented
    that we have lost all visibility into what is going on at the bottom of chain
    [73].


    # 9.3 The Technology Supply Chain


    The lack of ability to ensure the resilience and security of the technology supply
    chain has opened up a significant avenue of attack for any bad actor seeking to
    subvert everyday life in technologically advanced country. In the United States,
    we build critical infrastructure out of components that are derived from global
    sources. Thus, it would be an easy matter for a foreign nation state, terrorist
    group, or even an individual to compromise a purpose-secure critical system through
    a third- or fourth-tier supplier situated in a country that is out of sight and
    control of the prime contractor [73].


