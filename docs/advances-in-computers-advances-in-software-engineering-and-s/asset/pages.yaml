    # 4.2 Frequency-Based Queries


    # 4.2.1 Snapshot Queries


    A snapshot query provides a query result only once, and the query expires once
    the result is produced. The querying techniques discussed in the previous section
    fall under the snapshot query category.


    # 4.2.2 Continuous Queries


    The term continuous refers to the continuous monitoring of an issued query. This
    continuity can come in one of two forms: the continuous monitoring of a static
    query and the continuous monitoring of a dynamic query (often known as moving
    queries). Static queries have parameters that do not change over time (eg, the
    value of K or the issue''s position in KNNQs). However, the query result might
    be changed when the querying objects move. Dynamic queries refer to the queries
    whose parameters might change over time. In either case, frequent or large number
    of updates should be handled in an efficient manner to produce up-to-date query
    results.


    Regardless of the query category, a naive approach to answering a continuous query
    involves recalculating the same snapshot query at every timestamp until the query
    expires. This process may involve a great deal of wasted effort if the query results
    at consecutive timestamps do not change. The query results needs to be updated
    only when an object in the current result becomes invalid or a new object joins
    the result due to a change in previously considered information.


    Most approaches to continuous queries process queries in two main phases: an initial
    phase and a maintenance phase. The initial phase generates results for new queries.
    The maintenance phase maintains the results obtained in the initial phase while
    considering the influence of the mobility of objects on the query result.


    Evaluating each received update message is the simplest method to identify the
    influenced mobile objects. However, this evaluation could directly affect performance
    by increasing both processing and communication costs. Thus, the research has
    focused on efficient query processing techniques to reduce these costs.


    One technique commonly used to handle high-frequency update messages involves
    defining safe regions for MOs. Here the movement of objects within the safe region
    does not alter the result. The safe region could be'
