    FISMA defines a standard process-based framework for managing information security.
    The FISMA framework must be followed for all information systems used or operated
    by a US government agency or by a contractor or other organization on behalf of
    a federal agency. This framework is further defined by the standards and guidelines
    developed by NIST.


    According to FISMA requirements, the head of each agency shall develop and maintain
    an inventory of major information systems (including major national security systems)
    operated by or under the control of such an agency [66]. The identification ofinformation
