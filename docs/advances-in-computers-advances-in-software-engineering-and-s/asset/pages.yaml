    # Abstract


    Critical infrastructure cyber-physical systems heavily depend on accurate data
    in order to facilitate intelligent control and improve performance. Corruption
    of data in these systems is unavoidable, resulting from both intentional and unintentional
    means. The consequence of making control decisions based on erroneous or corrupted
    data can be severe including financial loss, injury, or death. This makes a mechanism
    to detect and mitigate corrupted data crucial. Many techniques have developed
    to detect and mitigate corrupted data. These techniques vary greatly in their
    capability to detect anomalies and required computing resources. This chapter
    presents a survey of data cleaning techniques and their applicability to various
    control levels in a critical infrastructure cyber-physical systems.


    ![](img/257e93db1726e97e2d89292b09ddfad7_66_0.png)


    # 1. INTRODUCTION


    Modern society is becoming more and more dependent on access to accurate real-time
    and stored information. Critical infrastructure systems are not different as they
    transition from purely physical systems to critical infrastructure cyber-physical
    systems (CPSs) to meet performance requirements and growing demands. In a CPS,
    a layer of infrastructure is added to the physical infrastructure to improve functionality.
    This cyber infrastructure consists of intelligent embedded systems, communication
    capabilities, distributed computing, and intelligent control [1]. The cyber infrastructures
    facilitate intelligent control to adapt to changes in demand and production. Smart
    power grids, intelligent water distribution networks, and smart transportation
    systems are all examples of modern CPSs.


    Intelligent controls in CPSs make decisions by processing realtime and previously
    stored data. The intelligent control systems calculate optimal control settings
    by processing data from the controllers immediate area as well as system-wide
    data. Processing data from system-wide sources prevents adverse consequences caused
