  md: 'This chapter discussed an indexing structure namely $R^D$-tree that supports
    predictive queries on objects moving under road-network constraints. The $R^D$-tree
    supports common types of spatial queries (eg, range and KNN) as well as predictive
    queries (eg, line query). Predictive queries were addressed under two versions:
    a snapshot query and a continuous query. Queries embed intelligence by customizing
    the query result for each user separately. Both the individual''s destination
    and his/her predicted paths are considered for customization. More specifically,
    a user will obtain only traffic information relevant to his/her route. As a result,
    the user can adjust the route in favor of either avoiding or moderating the effect
    of possible


    This chapter also discussed solutions for both of the aforementioned query versions.
    $R^{DB}$-tree, $R^{BE}$-tree, and $R^C$-tree. They are applied on multiple heuristics
    where power is in an increasing order. Due to the most powerful heuristics being
    applied to the $R^{DC}$-tree, it shows the best performance. The approaches for
    the continuous version were solo update (SU), solo object (SO), and batch object
    (BO). These three variations were compared together with a naive approach that
    repeatedly executed snapshot line queries. Among the three approaches, the BO
    algorithm reported the best performance, in terms of both page accesses and accuracy.


    The scope of this research is for further exploration and expansion. Some potential
    areas are listed below:


    +   * The query types addressed in this chapter were initiated queries. This means
    the user specifies the road segment that he/she is interested in. When the traffic
    is estimated for the road segment (for the future time), all the current reported
    object''s behavior is assumed to have remained valid. However, some dense road
    segments are possible which might disturb the current assumed moving patterns.
    This leads to developing methods to identify the mutually independent dense road
    segment, rather than estimating the traffic of user-defined road segments. Developing
    efficient techniques to search both time and spatial dimensions would be both
    an interesting and challenging task.

    * The approaches presented in this chapter comprised of a centralized server and
    a group of thin clients. However, with modern technology, mobile objects are computationally
    capable for a considerable amount of work. Thus, identifying possible workload
    distribution for mobile objects would generate promising performance improvement,
    especially in terms of scalability.'
