    # 4. SIGNIFICANCE OF PRIVACY IN mHealth


    mHealth applications may have various privacy and security issues. The site may
    maintain a vast repository of users profile information. Users are increasingly
    sharing their private details on such sites, and for some people, privacy takes
    a back seat to the hope that such exchange will help them find a better treatment,
    manage their condition, or improve overall health. Some people reveal their health
    data for the sake of the greater good.


    Medical professionals also post sensitive data about their patients, community,
    and organizations in order to share advice on clinical situations or practice
    management. Some professionals are even willing to provide personal data in exchange
    for the utility of the services and the occasional rewards by the site. However,
    once users share their health data with the site, they typically have no control
    over retention periods for the data or associated metadata that will be maintained
    in perpetuity. The content produced by users may be revealed to both intended
    and unintended audiences. Since, anybody can register on the website, anybody
    can view the content on the site. For example, any person or entity may create
    fake accounts to obtain data from unsuspecting users. Another related issue is
    that the website exchange data with third parties without explicit consent. For
    example, websites like checkMD (http://www.checkMD.com) disclose users'' personal
    information to their business partners and other parties. The site also allows
    its users to incorporate features created by third parties and let users log into
    third-party sites using their profile data, which implies that health data available
    within the protected site may be leaked to the web. Consequently, health data
    may be exposed to various data recipients without users'' knowledge [13].


    The accumulated health data can be misused and exploited for various nonmedical
    abuses. Some mHealth applications are commercial companies that have a business
    model based on harvesting health data for business and proprietary purposes. They
    may release health data to different recipients, including doctors, pharmaceutical
    and medical device companies,'
