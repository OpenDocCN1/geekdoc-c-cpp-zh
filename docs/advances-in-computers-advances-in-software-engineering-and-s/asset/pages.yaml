    # 2. GROUND TRANSPORTATION SYSTEM AS CPS


    As noted earlier, the ground transportation system is identified as a CPS. A visual
    representation of both the cyber and physical components of a typical transportation
    system is depicted in Fig. 1.


    # 2.1 GTS Infrastructure


    The physical components of a ground transportation system are MOs, static objects,
    and (in most cases) the road network itself (see Fig. 1) [8,9]. MOs are objects
    capable of movement. They are often referred to as either mobile hosts [10,11]
    or mobile clients [3,12]. MOs move on a fixed network bound by velocity constraints.
    Both a person carrying a cellular phone and a vehicle moving on the road are tangible
    examples of MOs. MOs are usually


    ![](img/257e93db1726e97e2d89292b09ddfad7_117_0.png)


    Fig. 1 Moving object infrastructure.'
  merge: -1
  pgno: 117
- img_proc: true
  md: 'equipped with some type of location-determining device such as a GPS device
    to sense and measure the speed and position of an MO. SOs are objects with stationary
    locations as buildings.


    # 2.2 Infrastructure Representation in CPS


    Information on the road network and the objects is stored at the base (BS). The
    road network is represented and stored as a graph G(E, V), where E is the set
    of edges and V is the set of vertices. Each edge $e \in E$ represents a segment
    in the network and $e=v1, v2$, where $v1, v2 \in V$; $v1$ and $v2$ are the starting
    and ending nodes of the road segment, respectively. An edge could be either a
    segment that has no intersection [9,13] or a segment that can be represented as
    a straight line [14]. A vertex on the network represents a point where two segments
    meet.


    Both vertices and edges (segments), are associated with a set of attributes, if
    available. The edge length and the maximum road speed are two common attributes.
    Information about MOs is stored with respect to the network. For example, a tuple
    that encapsulates object information would contain identification, current position
    coordinates, current road segment (ie, an edge in the graph $G$), next road segment,
    updated time stamp, and speed.


    # 2.3 Flow of Operations/Requests to Query System


    Communication between the BS and the MOs occur wirelessly. Intermittent message
    support stations, located between BSs and MOs, are used to improve the strength
    of the communication signal. The information exchanged between the BS and an MO
    includes the MO''s information (sensed by either the MO''s GPS or road-side sensors),
    query requests, and query responses. In a typical application, the user sends
    the query request to the BS, the BS retrieves the relevant information from a
    collection of databases, and the result is sent back to the user.


    # 2.4 Location-Dependent Query Taxonomy


    A location-dependent query (LDQ) is one of the most demanding query types on mobile
    object data. It can be classified into several subquery types according to the
    information it provides (Fig. 2A) or according to its response frequency (Fig.
    2B).


    Some common types of queries under the information-based query taxonomy include
    range query (RQ), K nearest neighbor query (KNNQ),'
