    defined process that is specifically designed to mitigate the event involving
    the routine development of [58];


    +   - policies and procedures that define and assign the appropriate roles and
    responsibilities for personnel involved in incident management activities;

    - equipment, infrastructure, tools, and supporting materials to protect systems,
    detect suspicious events and incidents, assist in recovery, and support the resort
    of operations;

    - qualified staff who are trained to perform consistent, reliable, and high-quality
    incident management functions.


    In essence, incident management is to be embedded as a formal exercise that is
    integral to the operation of the organization, much as any other routine part
    of the organization. Incident management became a routine part of conventional
    cybersecurity practice because the technology and its threat environment require
    it. The process itself earlier than 1988. But it was the astounding increase in
    Internet incidents during the 1990s that gave it the impetus to make it a staple
    in the cybersecurity profession.


