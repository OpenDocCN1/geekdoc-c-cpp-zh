  md: '# 6.3.2 Traffic Signals and Dynamic Lanes


    Traffic signals and dynamic lanes process the same data types as RSU with the
    addition of categorical data. The categorical data is the sequential control states
    of the controller and the controllers neighbors. Access to both numerical and
    categorical data facilitates more rigorous behavioral detection of the control
    system and its neighbors.


    # 6.3.3 Central Traffic Management


    Central traffic management process both controller state-based categorical and
    numerical data gathered from sensors. Autonomous and semiaonymous categorical
    traffic management will process this type of data to detect anomalies in the traffic
    signals and dynamic lanes system states utilizing the numerical data provided
    by RSU.


    # 6.4 Mobile Elements of ITS Vehicle


    A variety of the techniques presented in Section 3 can be employed to analyze
    and detect anomalies in each of these types of data. Table 12 contains a summary
    of the cleansing techniques classified by a detectable data type.


    # 6.4.1 Vehicle Operation


    Most sensor readings that facilitate vehicle operation are numerical. Various
    temperature and pressure sensors retrieve numerical values that can be scaled
    or otherwise modified. Categorical measurements do not apply to this area.


    # 6.4.2 Navigation


    Navigation equipment relies on numerical values as well. GPS data, such as time,
    longitude, and latitude, can be retrieved and cleaned. Congestion data may be
    retrieved from I12V or V2V communication and can be represented as a measurement
    of the amount of traffic flowing through a road segment. Categorical measurements
    do not apply to this area.


