    # 5. SOLVING PRIVACY PROBLEMS WITH VARIOUS METHODS


    Due to data privacy, it is essential for users to encrypt their sensitive private
    data before storing and processing them into the cloud or any other platform.
    Yet, there exist some shortcomings in the situation of traditional encryption.
    When a secret key owner wants to look for some data that are stored in the cloud
    storage, he/she needs to download all the data and decrypt them to perform any
    type of searching or processing with them. If the encrypted data are huge or the
    client is a mobile user, then it will be very inefficient and not feasible. Otherwise
    he/she must send a key to the server that is, in turn, to perform the decryption
    and search procedures. In "Provable Data Possession" model ensures the possession
    of data on untrusted storages. It uses a Rivest-Shamir-Adleman homomorphic linear
    authenticator for outsourcing data, but this model leaks the data to external
    auditors and hence, is not provably privacy-preserving. Jules et al. describe
    where spot-checking and error-correcting codes are used in order to ensure possession
    and retrievability. This scheme only works for encrypted files that requires the
    auditor to keep state and suffers from bounded usage, which potentially adds online
    burden to users when the keyed hashes are used.'
