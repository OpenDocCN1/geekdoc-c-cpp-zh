    # 5. SECURITY GETS SERIOUS: SOCIETAL RESPONS AND THE MORRIS WORM


    Internetworking technology continued to mature throughout the 1970s and 1980s.
    However, as we have seen, when technology evolves, history has shown that security
    issues will arise. With the convergence of networking capabilities comes the opportunity
    for attacks, or more specifically, the ability to perform remote, often distributed,
    malicious acts via a network. The initial attacks were by means of a virus.


    # 5.1 Computer Viruses


    A virus is simply a piece of malicious code inserted into a computer to perform
    undesirable acts. The first attributed virus was called Creeper and it was written
    by Robert Thomas as an experimental exercise in 1971 [25]. In the intervening
    17 years, more than 15 viruses appeared [25]. Among them were such influential
    exploits as Wabbit (1974), ANIMAL (1975), Elk Cloner (1982), Brain Boot (1986),
    Lehigh (1987), Jerusalem (1987), and Christmas Tree (1987) [25].'
