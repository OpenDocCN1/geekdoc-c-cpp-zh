    # 6. CONCLUSION AND FUTURE WORK


    Traffic-related queries can improve traveler driving experiences. Several research
    issues need to be addressed to provide a more effective, efficient service to
    users. One such issue involves the considered mobile environment from Euclidean
    space to road networks. Another issue includes introducing query types within
    road-network constraints (eg, traffic-related predictive queries).'
