    # 4.4 Strategies for Protecting Data


    Their pivotal paper was first presented at the Fourth ACM Symposium on Operating
    System Principles (October 1973) and then revised and published in the Publications
    of the ACM [20]. They proposed eight principles for the protection of information
    in computers. These eight principles have formed much of the basis for computer
    access control and overall mediation of computer security. Much of the literature
    of computer security starts from those fundamental principles [21].


    The principles of Saltzer and Schroeder indeed proved significant, and what most
    interests us here is their TIMING. When their paper was first presented (1973),
    it was already acknowledged that the information that was processed by computers
    was valuable and had to be protected [20]. At the same time, the technology had
    advanced to the point where interned machines were no longer a scientific experiment
    conducted at ivory tower places like MIT and Stanford. They had become an integral
    part of the industry and national security.


    # 4.5 Technology and Threats Converge


    By 1972, IBM had fully commercialized its airline reservation systems. In addition,
    public data networks based on the X.25 standard prevailed throughout the large
    business networks in Europe and the United States. What had not matured, however,
    was the protection of the information in those networks.


    There are no reliable statistics regarding incidents in that period, and law enforcement
    was focused more on phreaking than hacking. But the'
