  md: '# 7.3.3 Driver


    For autonomous vehicles, the human passenger has limited abilities to intervene
    with driving. Their ability to interact with a vehicle is strictly at a supervisor
    level. A vehicle may inform the user of diagnostic concerns, but control is ultimately
    left to the vehicle itself.


    Semiaonomous vehicles, on the other hand, permit humans to drive. Although some
    automated systems, such as collision avoidance, can momentarily intervene and
    take control, the driver is in control of the vehicle. In this case, the collision
    avoidance system acts at the controller level. Or autonomously acts to avoid dangerous
    situations. Otherwise, the driver acts as a supervisor. They are able to interpret
    results and take appropriate action behind the wheel.


    # 8. CONCLUSION


    Modern infrastructure cyber-physical systems are designed to meet very high performance
    standards. This is only achievable through sophisticated intelligent autonomous
    control systems which are extremely data dependent. Therefore, it is essential
    to provide accurate real-time data to the control system. When these systems are
    deployed in extremely unpredictable environments it is essential that data cleansing
    is used to minimize the potential failures that would result from control systems
    processing erroneous data.


    In this survey we discussed the sources of corrupted data and various purpose
    data cleansing techniques including detection and mitigation methods. We classify
    these techniques based on their applicability to CPSs specifically discussing
    the anomalies that can be detected, hardware constraints of various nodes within
    a CPS, type of data being processed, and hierarchical location within a CPS. Understanding
    the limitations of various data cleansing technique is essential to designing
    fault tolerant and surviving CPSs. We are working to model the extent to which
    data errors propagate within a system. Specifically looking at the effect of data
    cleansing within a system. This information will be essential to designing robust
    CPSs.


    # GLOSSARY


    +   - CPS Critical infrastructure cyber-physical systems

    - ESN Echo state network

    - I2V Infrastructure to vehicle communication

    - IDS Intrusion detection systems'
