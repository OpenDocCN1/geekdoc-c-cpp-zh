  md: 'The accuracy of a query response can be affected by several parameters including
    current information, the object''s mobility, delays in response, and network constraints.
    In order for the query response to be accurate it is important for information
    to be current. However, maintaining up-to-date information is challenging due
    to the mobility of objects. Each mobile object periodically sends messages to
    keep its information updated. Assuming an update interval of 120 s, a system with
    1 million MOs generates 30 million update messages per hour [18]. The update techniques
    should be efficient to provide current information at the next query.


    In addition to the impact discussed earlier, the object''s mobility also affects
    the pertinence of the response. Consider the scenario in Fig. 3. Fig. 3A and B
    shows the snapshots of objects at two time stamps: $t_0$ and $t_1$. Regardless
    an object that a KNNQ at point $A$ at time $t_1$ should receive the response $\{O_6,
    O_1, O_4\}$ (the solid circles in the figure). However, due to the user''s mobility
    the corresponding response might not be received until $t_1$, when the object
    has reached point $B$. At this point, the result is no longer relevant to the
    user according to his/her current position (see Fig. 3B). This effect will be
    worse when the response is further delayed. A greater delay will result in a greater
    deviation from the original position, which will eventually cause it to become
    obsolete.


    An intelligent service provider would consider the mobility of an object and predict
    its future position at time $t_1$. It might then generate the result for the issue
    at point $B$ accordingly: $\{O_5, O_7, O_8\}$. This information


