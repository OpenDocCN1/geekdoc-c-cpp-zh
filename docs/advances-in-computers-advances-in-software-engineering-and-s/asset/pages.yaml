  md: '# ABOUT THE AUTHORS


    ![](img/257e93db1726e97e2d89292b09ddfad7_171_0.png)


    Lasanthi Heendaliya received her PhD in Computer Science from Missouri University
    of Science and Technology in 2015. Her primary research interests are in Mobile
    databases, Big Data, Distributed Computing, and Parallel Computing. She received
    her MS in Computer Science from St. Cloud University in 2009 and her BE in Computer
    Engineering from the University of Peradeniya, Sri Lanka in 2006. She is currently
    working as an adjunct teaching professor at the University of Missouri-St. Louis.


    ![](img/257e93db1726e97e2d89292b09ddfad7_171_1.png)


    Michael Wisely received BS in Computer Science and Computer Engineering from the
    Missouri University of Science and Technology in 2012. He is currently a PhD candidate
    in Computer Science at Missouri S&T, where he is a GAANN Fellow and a Chancellor’s
    Fellow. His research interests include traffic modeling and distributed computing.
    He is a member of IEEE and ACM.


    ![](img/257e93db1726e97e2d89292b09ddfad7_171_2.png)


    Dan Lin is an associate professor and Director of Cybersecurity Lab at Missouri
    University of Science and Technology. She received the PhD degree in Computer
    Science from the National University of Singapore in 2007, and was a postdoctoral
    research associate at Purdue University for 2 years. Her main research interests
    cover many areas in the fields of database systems and information security.'
  merge: -1
  pgno: 171
- img_proc: true
  md: '170


    L. Heendaliya et al.


    ![](img/257e93db1726e97e2d89292b09ddfad7_172_0.png)


    **Dr. Sahra Sedigh Sarvestani** is an Associate Professor of Electrical and Computer
    Engineering and a Research Investigator with the Intelligent Systems Center at
    the Missouri University of Science and Technology. Her current research centers
    on development and modeling of dependable networks and systems, with focus on
    critical infrastructure. She received the BS degree from the Sharif University
    of Technology and the MS and PhD degrees from Purdue, all in electrical engineering.
    She is a Fellow of the National Academy of Engineering’s Frontiers of Engineering
    Education Program and held a Purdue Research Foundation Fellowship from 1996 to
    2000. She is a member of HKN and ACM and a senior member of the IEEE.


    ![](img/257e93db1726e97e2d89292b09ddfad7_172_1.png)


    **A.R. Huson** is a professor of departments of Computer Science, and Electrical
    and Computer Engineering at Missouri S&T. For the period of 2008–2012 he served
    as the computer science department chair. Before joining Missouri S&T, he was
    a professor of Computer Science and Engineering department at The Pennsylvania
    State University. His research for the past 33 years has been supported by NSF,
    DARPA, Department of Education, Transportation, Air Force, Office of Naval Research,
    NCR Corp., General Electric, IBM, Lockheed Martin, Penn State University, and
    Missouri S&T. He has published over 320 technical papers in areas including database
    systems, multidabases, global information processing, cyber-physical systems,
    application of mobile agent technology, object-oriented databases, Mobile and
    pervasive computing, computer architecture and cache memory, parallel and distributed
    processing, dataflow architectures, and VLSI algorithms.'
