    He has authored seven professional books in the fields of Software Engineering
    and Cybersecurity. His PhD is from the University of Michigan, in Ann Arbor.


    ![](img/257e93db1726e97e2d89292b09ddfad7_47_0.png)


    Dr. Carol Woody is the Technical Manager of the CERT Cyber Security Engineering
    team at the Software Engineering Institute (SEI). Her team addresses research
    for soft-ware security and survivability throughout the development and acquisition
    lifecycles of highly complex networked systems and systems of systems. Dr. Woody
    has been a senior member of the SEI technical staff since 2001. Her research focuses
    on building capabilities to address measurement, management, and acquisition for
    engineering


