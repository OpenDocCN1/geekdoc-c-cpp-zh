    reaching object $O_5$ from point $B$ might not be practical from point $B$ when
    the road network constraints (ie, one-way roads) are considered.


    The possible irrelevancy of a response is primarily due to the mobility of objects.
    Because of the mobility feature, both the information at the database (including
    both the MO''s location and the moving speed) and the query response could become
    outdated frequently. Efficient update techniques address the issues related to
    keeping the database up to date.


    Both enabling fast and accurate responses and taking future behavior of objects
    into account (supporting predictive information) could abate the issue of out-of-date
    query response. Providing a fast response is a matter of retrieving relevant information
    efficiently. Thus, the data collection should be organized and stored in a reference
    position that provides efficient access to relevant data. This leads to the need
    for efficient data manipulation.


    # 3. INDEXING MOs


    Indexing techniques for MO databases have been addressed under two primary categories:
    indexing objects moving in Euclidean space and indexing objects moving under road-network
    constraints.


    # 3.1 Indexing MOs in Euclidean Space


    Much work has been conducted on indexing MOs in Euclidean space [4,5,24,25]. Most
    of these approaches model the mobility of objects as a linear function of time,
    where the position at any given time $t$, denoted as $x(t)$, can be defined as
    (1). Here, $x_{ref}$ represents a reference position at time $t_{ref}$ ($t_{ref}
    < t$). The velocity is represented by $v$:


    ```

    $x(t) = x_{ref} + v(t - t_{ref})$

    ```


    The linear representation of MOs makes predicting an object''s future position
    both simple and constant in time. Hence, fewer update messages are expected from
    the mobile objects. Fewer update messages, in turn, reduce the update cost. However,
    the advantage comes at the expense of reduced accuracy.


    The indexing structures that utilize linear representation can be classified into
    several classes depending on their base indexing structure. Some'
  merge: -1
  pgno: 122
- img_proc: true
  md: '# Indexing and Querying Techniques for Mobile Objects


    commonly used base structures include the R-tree [26], the B⁺-tree, and the quadtree
    [27]. In addition to these structures, some hybrid approaches can also be found
    in the literature [28].


    # 3.1.1 R-Tree-Based Indexes


    R-tree is a height-balanced tree structure. A leaf node of the R-tree maintains
