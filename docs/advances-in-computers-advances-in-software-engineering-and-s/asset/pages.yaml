    as being in a specific state in the presence of a disruptive event based on the
    systems ability to provide its service. The terms used to describe the threats
    to system operation are error, and fault. A system failure is the state in which
    a system does not comply with system specifications. An error is a system state
    that may induce a failure. More specifically, a failure occurs when an error causes
    an alteration of the system services, a persistence, activity, and intent. Corrupted
    or erroneous data can be a failure, an error, or a fault depending on its location
    in the system. Producing corrupted data; processing corrupted data is a system
    error; accepting corrupted data as input is a system fault. Erroneous data can
    be created within a system with intentional and unintentional means.


    Intentionally erroneous data is the result of an attack. Attacks can be classified
    as purely cyber, purely physical, or combined cyber-physical depending on the
    source of the attack. Mo et al. [28] describe these types of attacks on critical
    infrastructure systems. An example of a cyber-physical attack on an intelligent
    water distribution system is provided by Amin et al. [29].


    Unintentionally erroneous data is the result of corruption during communication,
    processing, or storage in addition to inaccurate sensor readings. Cebula et al.
    [30] provide a very detailed taxonomy of cyber and physical risks to computer
