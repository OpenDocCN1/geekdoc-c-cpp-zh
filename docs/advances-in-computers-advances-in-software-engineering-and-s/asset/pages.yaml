    # 5.1.1 Hardware Resource Constraints


    Vyas et al. [60] discuss the constraints induced by various hardware architectures
    of control systems and sensor processing. Evaluating hardware architectures as
    it pertain to reading sensors, precision in executing a control algorithm, and
    the time to execute a control algorithm and perform an action with an actuator.


    The authors propose an architecture where sensor processing units (SPUs) are able
    to perform some computations autonomously and communicate data to a primary processor
    for more complex tasks. The SPUs are configured to continuously execute user-defined
    functions, which can read data from sensors and perform small computations. As
    required, the primary CPU on the sensor node can retrieve output from the SPU
    for use in other tasks. The abilities of SPUs are limited, with respect to the
    primary CPU. Simple tasks, like reading data and performing data fusion, can be
    accomplished by an SPU. However, more complicated tasks require the intervention
    of the primary CPU.


    For the benefit of devices with limited energy resources, CPUs support a low-power
    mode. When the primary CPU is not required, a sensor node could enter a low-power
    mode to conserve energy. When necessary, SPUs can issue an interrupt to the primary
    CPU, so that the CPU can perform computations that the sensor device cannot do
    alone.


    Low-power mode may reduce the energy consumption of a sensor node, leading to
    a longer battery life, but complex data cleansing algorithms running on the primary
    CPU of a node with or without the availability of a low-power mode, one may prefer
    less demanding data cleansing techniques to improve the battery life of sensor
    nodes. If the data cleansing technique is simple enough, it may be performed by
    the SPU, further allowing the primary CPU to remain in a low-power state.


