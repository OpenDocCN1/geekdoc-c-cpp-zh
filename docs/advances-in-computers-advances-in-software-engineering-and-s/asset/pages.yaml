    # 2. STRUCTURED PROGRAMMING: THE DAWN OF A NEW ERA


    Structured programming might arguably be considered the first example of a major
    change in SE that came as a result of advances in the technology. In fact, strictly
    speaking, the term “structured programming” predates the term “software engineering."


    The concept of structured programming was first introduced by Bohm and Jacopini
    in a paper published by the ACM in 1966 [2]. The term “software engineering” first
    appeared as the title of the conference sponsored by the North Atlantic Treaty
    Organization (NATO) Science Committee, which was held in Garnish-Partenkirchen
    Germany in 1968 [3].


    # 2.1 The GOTO Statement


    The structured programming theorem, as first proposed by Cohn and Jacopini, was
    based on the utilization of three standard control structures: “sequence,” “selection,”
    and “iteration.” In simple terms, the failure to properly document the jumps created
    by the GOTO statement led to overly complex and tangled code. This confusion had
    begun to'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'negatively impact the understandability, maintainability, and effectiveness
    of commercial programs [4].\That problem led Edsger Dijkstra to speculate that
    the GOTO statement in the procedural languages of the time led to poor programming
    practice. In essence, the overuse of jumps as a means of altering sequence led
    many commercial programs into a “rat’s nest” of unmaintainable applications and
    dead-ending process. Dijkstra’s initial idea was published as a letter in the
    Communications of the ACM in 1968 [4].


    # 2.2 Structured Programming as a Solution


    Dijkstra’s idea led to the evolution of the concept that the structured programming
    theorem was a solution to the “spaghetti code” problem. The controls posted by
    the structured programming theorem allowed programmers to write and execute subroutines
    much more easily and effectively create block programming constructions [2].nThe
    goal of structured programming was to improve understanding of the code structure
    by normalizing the actual programming into standard subroutines. The contention
    was that structured programming would both improve quality and cut down on the
    cost of development by simplifying program execution into subroutines that execute
    three types of control structures: sequence, selection, and iteration [2].


    # 2.3 IBM Training


    The advantages of structured programming were apparent to Harlan Mills of IBM.
    He convinced John Jackson, president of IBM Systems Division, to offer a series
    of courses titled “Structured Programming Workshop,” and eventually “Advanced
    Design Workshop,” fondly known as SPW, SDW, and ADW [1].nW and SDW included exams
    that determined whether or not attendees passed the course. SPW emphasized not
    only structured programming but formal correctness proofs. Every program in the
    division was to take SPW, which was a 2-week course preceded by a self-study and
    exam in logic. Lead programmers were to take SDW, which focused on the use of
    the state model to express abstractions, and the elite would eventually take ADW.
    ADW focused on issues of concurrency and timeliness, as represented by networks
    of state machines and associated operations. Eventually, these course offerings
    were supplemented by a'
