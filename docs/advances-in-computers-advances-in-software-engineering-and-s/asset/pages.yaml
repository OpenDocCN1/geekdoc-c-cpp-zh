    # 1. INTRODUCTION


    This chapter discusses significant software engineering (SE) advances that have
    occurred over the past 50 years in the light of the historical evolution of the
    technology. The thesis is that major advances in the way the profession goes about
    its business tend to appear in the form of specific responses to technological
    evolution.


    In essence, we are saying that new requirements for large-scale methods and practices
    are typically shaped by significant realities in the growth of the field of computing.
    Those practices will emerge as computer technology and its use evolves. The implication
    of that statement is that the field of computing has developed its standard methods
    and practices in response to new challenges as they appear, rather than as a consequence
    of a series of planned, logical evolutionary stages.'
  merge: -1
  pgno: 6
- img_proc: true
  md: 'That is not to say the evolution of the practices in the field is illogical
    or that breakthroughs cannot be predicted. It is just to suggest that tradition-ally
    important aspects of the field are more likely to emerge and institutionalized
    as advances in technology shine the spotlight on a new area of concern or need.


    Both proactive and reactive solutions will emerge in detail from recognition and
    seek to gain traction. Those solutions tend to be in the form of changes in the
    conduct of professional work, usually combined with some form of best SE practice.
    Once a general approach or practice gains the necessary, then it is used for leverage
    in tackling the next spotlight issue in a cascading evolutionary form.


    Hence, this chapter will trace the evolution of the field, looking at a set of
    advances that might, on the surface, seem to be unrelated. However, it will be
    shown that they are all tied by the natural proximity of the industry to develop
    effective, real-world solutions to emerging challenges. Critically, all of these
    center on the emergence of new technological advances and societal factors that
    have led to mass awareness. The shape and evolution of the resulting practice
    or process can be understood under the light of that pragmatic tendency.


    This broad rule will be discussed from a larger historical perspective. The evidence
    is equivocal, to some extent, in its particulars. But the general pattern throughout
    the history of the profession is clearly apparent. Major influences in computing
    processes, practices, and education will evolve with the technology rather than
    lead it.


    In presenting this idea, the orientation of this chapter will be practical and
    narrative, rather than theoretical. We will trace the historical course of events
    as they occurred and discuss the commonly accepted principles, practices, and
    educational advances that emerged from significant developments in the overall
    field of computer technology.


    The aim will to demonstrate the general assumption that practices will emerge
    and grow as technology advances have required. Fig. 1 shows a timeline of the
    associated educational events [1].


    Accordingly, the discussion will evolve and be driven by historical occurrences
    in the profession. For each occurrence, we will describe what happened in the
    context of the existing state of the art in the field. Then we will describe the
    response as it was developed and implemented. Finally, we will attempt to fit
    that response within the larger framework of our thesis, which is that the field
    evolves as the technology changes.'
