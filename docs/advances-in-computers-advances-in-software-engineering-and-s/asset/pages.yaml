    |

    | Storage constraints | Constraints on the storage resources and the size of database
    needed to store the relevant historical data required to execute the cleansing
    technique. |

    | Communication constraints | Constraints on the networking requirement. Specifically,
    these constraints refer to the availability of data from other system components
    as required by the cleansing technique. |

    | Energy constraints | Constraints on the energy that may be consumed by data
