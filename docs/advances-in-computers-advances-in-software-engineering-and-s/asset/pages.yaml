    # 2. TECHNOLOGIES USED IN mHealth


    Many types of mobile technologies can be utilized for mHealth interventions, ranging
    from smartphones (hardware and software), laptops, tablets, and mobile-enabled
    diagnostic, and monitoring devices to devices with mobile alert systems. Devices
    vary widely in capabilities, price, and strength of evidence that they may improve
    patient outcomes, workflow efficiencies, and access to health information.


    # 3. MAJOR PRIVACY CHALLENGES


    # 3.1 Privacy Challenges While Using Radio Frequency Identification in mHealth
    Application


    With the deployment and use of radio frequency identification (RFID) technology
    in the healthcare domain, there are increasing privacy concerns regarding the
    technical designs of RFID systems. Smart patient tracking, real-time smart asset
    tracking, improved efficiencies, and improved patient outcomes are only a few
    of the potential benefits of RFID-based mHealth solutions. However, these benefits
    are often accompanied by threats of privacy violations [11]. These threats pertain
    to the potential risks of unauthorized data access, misuse of patient data, and
    the capabilities of permanently saving and linking information about individuals
    through temporal and spatial extension of data collection activities. An unauthorized
    reader without the victim''s knowledge can read RFID tags, since it can'
  merge: -1
  pgno: 53
- img_proc: true
  md: 'be by radio frequency signal. While RFID technology can improve the overall
    quality of mHealth service delivery, the benefits must be balanced with the privacy
    and security concerns [18].


    The use of RFID introduces a new set of risks. Security risks are associated with
    the possible failure of the RFID system under various security attacks. For example,
    untracked tracking, eavesdropping, and denial of service activities introduce
    a security and privacy threat based on the ability to permanently save and access
    information about individuals through temporal and spatial extension of data collection
    activities. Although concerns about privacy are not unique to the healthcare domain,
    related information can be perceived as more personal and more sensitive. Due
    to the highly personal and sensitive nature of healthcare data, both healthcare
    providers and patients can be expected to resist further digitalization through
    use of RFID technology until security and privacy protections is in place.


    There are different kinds of RFID applications that allow healthcare professionals
    to avoid errors or risks that could endanger the patient safety. Usually, RFID-based
    sensing activities related to healthcare can be divided in two types:


    Direct sensing activity: These activities refer to various identification and
    monitoring systems. Some of the most promising RFID-based direct sensing activities
    have been successfully tested (or deployed) in a number of hospitals: hospital
    personnel, patient and newborn asset tracking, drug usage monitoring for patients,
    and smart asset tracking (including surgical instrument tracking and blood bag
    tracking) [12]. Inevitably, these activities seek to improve patient outcomes
    and improve the efficiency of the hospital''s day-to-day operations.


    Indirect inferred activity: These activities basically refer to those systems
    that use direct sensing data to infer important information. For example, detecting
    pharmaceutical counterfeit, avoiding theft of medical equipment, the tagging of
    medical plateaus to ensure that patients get proper diet according to their treatment,
    allergies, and tastes [12]. RFID-based mHealth services have received considerable
    attention within the healthcare, since early 2007. The technology’s promise to
    efficiently track hospital supplies, medical equipment, and patients is an attractive
    proposition to the healthcare industry [20]. Some major research'
