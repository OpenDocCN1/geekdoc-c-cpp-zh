  md: '# 3.3 Intersection of Languages and a New Paradigm


    Because “spaghetti code” is undesirable, it is likely that structured programming
    would have been adopted in some form and at some stage in the evolution of the
    profession. Nevertheless, it was the intersection of procedural programming compilers
    and,, specifically, the programming paradigm of the ALGOL language that allowed
    the practical implementation of the structured programming theorem’s control structures
    and ensured that the structured programming approach could be implemented at that
    particular point in the history of the profession.


    # 3.4 Software Engineering


    Since the use of the paradigm elements of a procedural language like ALGOL is
    a higher level design issue, it also made perfect sense that the follow-on thinking
    to structured programming approach would turn to the issue of construction, specifically
    the discipline of SE. So it does not seem the least bit strange that the list
    of participants in the 1960 conference on ALGOL would contain some of the same
    names as the participants at the 1968 conference on SE: Naur and Bauer were two
    of these.


    This is not to suggest that the ALGOL language shaped the discipline of SE; the
    LSP people [11], others, would be able to dispute. What it does suggest is that
    the thinking regarding the most for rational process of construction, from design
    down to code, was enabled by the presence of a real-world vehicle: the ALGOL language.


    Moreover, because that practical vehicle was available, it was possible to offer
    a correct solution to the issues of hoc programming. Finally, given the concepts
    of structure at the code level that ALGOL’s programming allowed, the logical next
    step would be to encapsulate the same kind of structure into the development of
    software grounded in the application of the rigorous practices of engineering
    [8].


    In effect, the development of third-generation procedural compilers and the language
    concepts of ALGOL provided the fertile ground for the growth of the discipline
    of SE. SE would have appeared as a discipline without third-generation technologies?
    The answer to that question is “probably,” since the techniques of SE have always
    been the most effective path to commercial programming in the language. Still,
    history demonstrates that whatever might have occurred made possible at the actual
    point in time where compiler languages met a specific programming paradigm:'
