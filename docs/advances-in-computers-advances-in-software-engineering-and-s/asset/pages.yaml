  md: '# 4. CLASSIFICATION OF TECHNIQUES BASED ON TYPE OF ANOMALY


    In this section we will classify the data cleansing techniques presented in Section
    3 based on the type of anomalies each technique is able to detect. Using this
    classification, we will then discuss in which an ITS each technique would be most
    appropriate. In order to classify these techniques, an understanding of various
    types of data anomalies must be presented.


    # 4.1 Types of Data Anomalies


    Jurdak et al. [59] classify data anomalies into three broad categories: temporal,
    spatial, and spatiotemporal. Table 2 contains a summary of these types of anomalies.


    Temporal anomalies are local to one sensor node and can be detected by observing
    sensor values over time and observing a number of attributes which indicate an
    error. These attributes include high variability or lack of variability in subsequent
    sensor readings, gradual reading skews, or out-of-bound and extreme readings.
    Examples of failures that result in this type of anomaly are as follows. A sensor
    may fail into a locked state or fail to obtain new samples making the sensor remain
    the same over long periods of time. Another example is a sensor loses calibration,
    its data values drift away from the true value resulting in a gradual skew of
    sensor readings. A major malfunction of the sensor could produce out-of-bound
    readings that are physically impossible. And lastly, high variability in sensor
    readings could arise from sensor voltage fluctuations. However, high variability
    can arise from many changes in the sensed environment.


    Table 2 Summary of Data Anomaly Types

    | Type of Data Anomaly | Description |

    |---|---|n| Temporal | Temporal anomalies in sensor readings exhibit high variability
    in subsequent sensor readings, lack of change in sensor readings, gradual reading
    skews, or out-of-bound readings. |

    | Spatial | Spatial anomalies in sensor readings are significantly different from
    surrounding nodes'' readings. |

    | Spatiotemporal | Spatiotemporal anomalies exhibit a combination of temporal
    and spatial anomaly attributes. These are rare but difficult to detect. |'
  merge: -1
  pgno: 84
- img_proc: true
  md: '# A Survey of Data Cleansing Techniques for Cyber-Physical Critical Infrastructure
    Systems


    detection of temporal data anomalies requires the data stream from a single-sensor
    node as well as stored historical data.


    Spatial data anomalies occur when one sensor’s data readings are significantly
    different from the readings of surrounding nodes at a time period. Detecting this
    type of anomaly requires a network-aware algorithm. Data redundancy between sensors
    is exploited to determine which sensors may have faulty readings. This type of
    detection is only possible for certain types of data with low spatial variation,
    such as air temperature or humidity. In this type of data, a change in one area
    will affect the readings of surrounding sensors. Networks with high spatial variation,
    especially video and audio data, are usually incapable of detecting such anomalies.


    Spatiotemporal anomalies combine attributes of both temporal and spatial anomalies.
    These anomalies are somewhat rare but more difficult to detect. For example, a
    storm progressively moving through an area causing sensor nodes to fail would
    be a spatiotemporal anomaly. Spatiotemporal anomaly detection requires both a
    network-wide detection algorithm and data streams from multiple sensors.


    # 4.2 Classification of Techniques


    A variety of the techniques presented in Section 3 can be employed to detect each
    of these types of anomalies. Table 3 contains a summary of the cleansing techniques
    classified by a detectable anomaly.


    Table 3 Classification of Cleansing Approach Based on Type of Anomaly


    | Cleansing Approaches | Detectable Anomaly |

    | --- | --- |

    | Rule based | Temporal anomalies, if the analysis is performed over a sliding
    window of recent values. Spatial anomalies, if the analysis is conducted using
    data from neighboring nodes. Spatiotemporal anomalies cannot be detected due to
    dimensionality of data. |

    | Estimation based | Temporal and spatial anomalies, if an appropriate probability
    distribution is used. Spatiotemporal anomalies cannot be detected due to dimensionality
    of data |

    | Learning based | Temporal, spatial, and spatiotemporal anomalies, depending
    on learning or clustering model used. |

    | Behavior based | Not applicable, behavioral detection uses the statistical techniques
    to analyze system logs or system models of the behavior. |'
  merge: -1
