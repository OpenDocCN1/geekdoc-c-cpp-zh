  md: '# CHAPTER TWO


    # Privacy Challenges and Goals

    in mHealth Systems


    F. Rahman*, I.D. Addo*, S.I. Ahamed*, J.-J. Yang†, Q. Wang†


    *Marquette University, Milwaukee, WI, United States

    †Research Institute of Information Technology, Tsinghua University, Beijing, PR
    China


    # Contents


    +   1. Introduction

    2. Technologies Used in mHealth

    3. Major Privacy Challenges

    3.1 Privacy Challenges While Using Radio Frequency Identification in mHealth Application

    3.2 Privacy Challenges in Cell-Based mHealth Services

    3.3 Privacy Challenges in Social Networking and Care Coordination Technologies

    4. Significance of Privacy in mHealth

    5. Solving Privacy Problems with Various Methods

    5.1 Encryption Methods

    5.2 Access Control Mechanisms

    5.3 Remote Data Checking Using Provable Data Possession

    5.4 Privacy-Preserving Data Integrity Checking

    5.5 Privacy-Preserving Public Auditability

    6. Conclusion

    References

    About the Authors


    # Abstract


    The global phenomena of mobile technology have encouraged collaborations between
    national governments and diverse international stakeholders in applying mobile-based
    health (mHealth) solutions as a powerful opportunity for improving health and
    development in rural and remote areas. A significant impact offered by ern technologies
    includes the potential to transform various aspects of healthcare, improving accessibility,
    quality, and affordability. Over the years, mHealth has become important in the
    field of healthcare information technology as patients begin to use mobile-based
    medical sensors to record their daily activities and vital signs. The rapid expansion
    of mobile information and communications technologies within health service and
    public health systems has created a range of new opportunities to deliver new
    of interactive health services to patients, clinicians, and'
  merge: -1
  pgno: 49
- img_proc: true
  md: 'caregivers alike. The scope and scale of mHealth interventions range from simple
    direct-to-individual consumer and interactive patient-provider communications
    to more com-nplex computer-based systems facilitating coordinated patient care
    and management.


    # ## ABBREVIATIONS


    +   - **EMRs** electronic medical records

    - **HIPAA** Health Insurance Portability and Accountability Act

    - **mHealth** mobile health

    - **PDP** packet data protocol


    # ## 1. INTRODUCTION


    More than not, the quality of accessible healthcare is an impor-tant aspect to
    determining the quality of life of people worldwide. Mobile health (mHealth) can
    be defined as the emerging mobile communications and network technologies for
    healthcare systems. One of the key issues with current-state mHealth applications
    is an immature understanding of how to effectively implement them. There are a
    number of rapidly expanding mHealth applications available today on smartphones.
    Invari-ably, the promotion of mHealth applications with minimal integration is
    not particularly helpful for patients or the general public. Contemporary mHealth
    practices that make use of mobile phones include various forms of telemedicine,
    electronic medical records (EMRs), health informatics, and evidence-based medicine
    [1]. Mobile devices are used to capture and analyze the information gathered from
    patients and to communicate this informa to practitioners. In some specific cases,
    physiological data is col-lected using sensors that may be attached to the patient’s
    body. Body area networks offer an emerging implementation of mHealth solutions.


    There are several challenges associated with introducing numerous sen-s in a system
    that is susceptible to security and privacy threats. In some types of systems,
    sensors are normally the initiates of the mHealth link where body-embedded parameters
    (eg, heart pulse, blood oxygen level, glucose level) are captured, digitized,
    and transmitted to mobile phones using one or more of the following network communication
    technologies (eg, Bluetooth, Bluetooth Low Energy (BT-LE), and “ZigBee”) [2].
    An inherent data collector is usually responsible for capturing and agg-gating
    the received data, performing analysis and characterization, and'
  merge: -1
  pgno: 50
- img_proc: true
  md: 'subsequently transmitting the information to the cloud through cellular technology
    (eg, using a third- or fourth-generation mobile network “3G” and “4G”) [1].


    In the scenario captured in Fig. 1 (below), a patients physical activity (in support
    of health and wellness treatment) is monitored via a multi-modal source consisting
    of a Wristband tracker and an eyewear device (eg, Google Glass). Both devices
    have multiple sensors that aid in the data collection process. The aggregate data
    are transmitted to the smartphone device through the Bluetooth technology. The
    smartphone, in turn, makes use of a 4G cellular network to transmit the data over
    the Internet to a remote cloud storage location for further analysis.


    The focus of this chapter is to study the challenges and goals in ensuring privacy
    when sensitive data is collected by sensors and transferred to a mobile device
    or a cloud hosting location for further processing.


    Continuous monitoring of biometrics-based health information using sensors can
    result in a collection of very detailed and frequent data over a long period of
    time. In addition to biometrics information, sensors are capable of collecting
    data about other private factors of a patients’ life, including environment, daily
    activities, and location. Furthermore, other nonmedical


    ![](img/257e93db1726e97e2d89292b09ddfad7_51_0.png)


    Fig. 1 Sample logical architecture for physical activity monitoring.'
  merge: -1
  pgno: 51
- img_proc: true
  md: 'applications on the mobile device can collect other types of information about
    a patient''s activities and interests, such as: financial, commerce, diet, and
    more. Moreover, mobile devices enable a broad range of applications which may
    gain access to the health data and are capable of sharing the data through third-party
    applications, such as: healthcare provider, insurance companies, drug manufacturers,
    and tool provider. Some of the powerful capabilities of smartphones, if not appropriately
    investigated and restricted, can be used to collect contextually rich data from
    sensors and applications, which may result in extracting personally identifiable
    information (PII). In some cases, this data can be used for other reasons without
    a patient''s consent. Hence, more comprehensive frameworks need to be developed
    to ensure medical information privacy at all levels and contexts. A high-quality
    mHealth system should protect privacy and data integrity, remain available, and
    be auditable.


    In 1996, the Health Insurance Portability and Accountability Act (HIPAA) [3] was
    enacted in the United States. One major regulation of this act is to increase
    the protection of patients'' medical records against unauthorized usage and disclosure.
    Hospitals, health insurance, publishing organizations, and other entities are
    asked to comply with the regulations mentioned by the HIPAA. Similar regulations
    have been proposed and enacted in many countries in the world. To be compliant
    with the HIPAA, all the mHealth applications, systems, and services need to ensure
    privacy for patients and end-users.


    Many approaches have been proposed over the years, to ensure end-user privacy
    and help medical institutions or participants comply with those privacy protection
    regulations. These approaches cover quite a lot of research areas. The implementation
    of privacy protection techniques during the data publishing phase is common and
    they often attempt to protect patient privacy by transforming the healthcare data
    before it is shared. Privacy-preserving data publishing models (including, k-anonymity
