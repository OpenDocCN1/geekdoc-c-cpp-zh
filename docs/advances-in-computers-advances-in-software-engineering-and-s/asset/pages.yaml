    query. Each object decides whether it is in the query''s monitoring region by
    examining the query information. If the object determines that it is in the monitoring
    region, the mobile object keeps that query information. This information will
    be discarded when the object moves out of the monitoring region. The mobile object
    estimates the query''s position according to the query information received (ie,
    velocity, time, and position). If this position differs from the one stored, a
    change in the query result is possible. The object''s latest information is passed
    over to the server. This approach''s selective communication with the server reduces
    the communication cost. However, it violates the issuer''s confidentiality as
    or her information is broadcast.


    Both SEA-CNN (shared execution algorithm) [54] and SCBA (cluster-based algorithm)
    [55] present scalable approaches for continuous querying. SEA-CNN focuses on KNN,
    whereas SCU focuses on RQ. SEA-CNN groups queries by their regions and locations.
    As a result, SCU groups both queries and mobile objects according to their common
    spatial relationships. Objects and queries could be included in the same group.
    The performance of each approach is improved when steady clusters are present.
    Steady clusters occur when the set members of a cluster do not change frequently.
    They are obtained when the object''s relative speeds are smaller. When relative
    speeds are significantly high, objects that were initially in the same group may
    not remain in the same group. In this case, both the cluster maintenance cost
    and the query execution cost increase as the number of clusters increases.


    Liu and Hua [56] proposed algorithms to process both the dynamic range and KNN
    queries under network consideration. The RQ process begins by performing a snapshot
    query at the server. Objects in the snapshot query result are notified with the
    query information (eg, the query position, the query range, and the issuer''s
    speed). Each object updates its information with the server when it moves out
    of the query range. Upon receiving the update message from an object, the server
    updates its query result accordingly, and then it updates the object''s query
    list at the server.'
