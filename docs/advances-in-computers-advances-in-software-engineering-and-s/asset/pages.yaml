    # 4.2.2.1 Continuous Monitoring on Static Queries


    Prabhakar et al. [45] proposed an approach that supports static range queries
    on mobile objects whose movements are relaxed for Euclidean space. This study
    did not consider object indexing. Instead, it used query indexing (QI). As a result,
    every query is indexed in an R-tree-based structure known as QI.


    The initial query response is obtained by searching overlapping regions (from
    the QI) against the position of each object. Once the initial result is obtained,
    the maintenance phase concerns only the object''s update messages with the QI.
    The QI indexes these objects according to their spatial closeness, so each object
    message is compared against the QI. This process scales up with the number of
    queries. However, it does not scale up to the higher number of objects.


    An individual object maintains its own safe region, calculated by the server,
    to reduce the number of update messages. The safe region is calculated as the
    shortest distance between the object and a query boundary. This calculation method
    has several drawbacks. First, the advantage of tracking a safe region decreases
    when the safe region is small (ie, a dense environment). Objects in smaller regions
    have a higher chance of crossing the safe region. This leads to sending frequent
    update messages. The safe regions must be reevaluated each time a query expires
    or a new query is received, which increases the safe-region maintenance cost.


