    When these principles were developed, “buffer overflow,” malicious code,” “cross-scripting,”
    and “zero-day vulnerabilities” were not part of the everyday vocabulary of operational
    support personnel. Patches were carefully tested and scheduled to minimize operational
    disruption instead of pushed into operation to minimize attack vectors.


    While these principles are still usable today in regards to security within an
    individual piece of technology, they are no longer sufficient to address the complexity
    and sophistication of the environment within which that operate. We must broaden
    our horizon to consider the large scale, highly networked, software-dependent
    systems uponfrom phones to power and water and our critical infrastructure such
    as banking, medicine, and retail.


    # 4.7 Software Assurance


    “Software assurance” (SwA) is the term that has come into common usage to describe
    this broader context. The Committee on National Security Systems (CNSS) defines
    SwA as follows:


    > Software assurance (SwA) is the level of confidence that security is free from
    vulnerabilities, intentionally designed into the software or accidentally inserted
    at any time during its life cycle, and that the functions in the intended manner.
    [23]


    Vast lists of practices and procedures that describe what should be done to address
    security and SwA have been published. By the end of 2014, National Institute of
    Standards and Technology (NIST) has released over 114 documents addressing various
    aspects of security and SwA controls.


    Organizations are overwhelmed by the volume of controls and the implementation
    costs of security, and have often failed to consider the organizational impact
    of a successful attack. Motivation to address SwA requires, at a minimum, an understanding
    of what to do, how to go about it, and why it is needed.'
