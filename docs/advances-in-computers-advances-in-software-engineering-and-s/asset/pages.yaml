    # 5.4.2 Navigation


    Navigation equipment tends to be more capable than the embedded devices responsible
    for sensing vehicle state. These devices must be capable of interacting with a
    human user, sometimes approaching a PC-level user experience. They are designed
    with a fair amount of disk space and reason-fast processors. In applications where
    V2V communication is required, communication may be heavy.


    Because of their access to more capable computational resources, navigation equipment
    may perform more sophisticated cleansing techniques. Learning-based techniques
    can be used to detect anomalies in GPS data [62], which can be performed by navigation
    equipment.


    # 5.4.3 Driver


    Control decisions that affect driving should be based on accurate information
    and action should happen quickly. To meet these goals, data anomalies should be
    identified quickly to permit a fast control response. Considering the safety implications
    of systems like collision avoidance, it makes sense that manufacturers would invest
    in more powerful equipment to process decisions. Higher performance processors
    and more storage enable more advanced cleansing techniques, like behavior based
    and learning based.


    For fully autonomous vehicles, communication may be heavy as well. The vehicle
    may consider information gathered from neighboring vehicles when preparing to
    make a control decision.


