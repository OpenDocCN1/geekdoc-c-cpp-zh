    # 3.3 Statistical Detection


    Data errors can be detected by locating data anomalies or statistical irregularities
    in the data. Faulty sensors typically report easily distinguishable extreme or
    unrealistic values, however, not all anomalies are the result of erroneous data.
    Extreme environmental variations can produce anomalies that should be distinguished
    from data errors. Statistical anomaly detection approaches anomalies by checking
    how well the data fits a statistical distribution model of the data. Anomalies
    are detected when data values fall outside an acceptable tolerance set by the
    user. Statistical anomaly uses statistical metrics such as mean, standard deviation,
    and range, to estimate normal data values and detects outliers if the data falls
    outside this expected range. The statistical model used to capture the distribution
    of the data can be assumed or estimated based on previously recorded data.


