  md: '# 4.2. Rule-Based Detection


    The detection capability of rule-based statistical approaches depends a great
    deal on the implementation. The simplest rule-based statistical approach rejects
    data if it falls outside of a specified range of acceptable values, determined
    by the mean and variance of the expected data, cannot detect temporal, spatial,
    or spatiotemporal. Simple rule-based anomaly detection can be very effective if
    the data is well behaved and the rules are appropriate. However, if the scope
    of analyzed data is expended this simple approach can detect temporal and spatial
    anomalies.


    Temporal anomalies can be detected using rule-based statistical approaches if
    the analysis is performed using a sliding window over a single data stream. The
    chi-square test performed over a sliding window, outlined by Ngai et al. [41],
    is able to detect temporal anomalies provided the length of the window and the
    user-specified acceptable chi-square test level are configured appropriately for
    the application and the volatility of data.


    Spatial anomalies can be detected using rule-based statistical approaches if the
    analysis is performed over multiple time-synchronized data streams. The statistical
    inference approach outlined by Panda et al. [42] uses a voting system based on
    the calculated mean and variance of a set of neighboring data streams to detect
    a spatial anomaly.


    Spatiotemporal anomalies cannot be detected using rule-based statistical approaches.
    This is due to the high dimensionality of data which prevents detection. Rule-based
    detection approaches are statistical inference techniques which cannot adapt to
    changing ranges, which are very common in long-term sensor network applications.


    # 4.2.2 Estimation-Based Detection


    Estimation-based statistical approaches, which utilize a probability models of
    the data to detect anomalous values, can detect temporal and spatial anomalies.
    An example is the detection technique utilizing the ARIMA model proposed by Fang
    et al. [39]. Temporal anomalies can be detected using the autoreg, integration,
    and the moving average terms from a single data stream. The new data from stream
    is compared with the ARIMA model to determine if the new data is anomalous. Spatial
    anomalies can be detected by maintaining multiple ARIMA model for all neighboring
    data streams. The new data is compared with the ARIMA'
  merge: -1
  pgno: 86
- img_proc: true
  md: 'models of neighboring nodes to detect spatial anomalies. Similarly, other detection
    techniques compare new data with a known pdf or kernel density estimate of a single
    or neighboring data streams. The limitations of these techniques is how well fits
    the probability distribution. Estimation-based detection, like the rule-based
    detection, cannot detect spatiotemporal anomalies due to the high dimensionality
    of data. Unlike rule-based detection approaches, estimation-based approaches can
    adapt to changing ranges of long-term sensor network applications.


    # 4.2.3 Learning-Based Detection


    Learning-based statistical approaches which utilize various data mining clustering
    and classification algorithms to group data for comparison have very high detection
    rates of all three types of anomalies [38]. For example, temporal and spatial
    anomalies can be detected using the neural network ESN technique described by
    Chang et al. [44] and the Bayesian space–time model proposed by Ni et al. [48].
    In both cases the network model predicts a data value which is used for comparison.
    The network model captures the varying and spatial variation of the data. Another
    example of more detailed temporal anomaly detection approach is the MSPCA presented
    by Xie et al. [51]. This technique can detect gradual temporal anomalies such
    as calibration drift and persistent anomalies with different time–frequency features.
    Spatiotemporal anomalies can be detected using the PCA detection approach proposed
    by Chitradevi et al. [50]. This technique uses PCA to reduce the dimensionality
    of a data through spectral decomposition. The decomposed data is used to determine
    the normal behavior in a data set.


    # 4.2.4 Behavioral Detection


    Many behavioral approaches utilize the statistical anomaly detection approaches
    classified above to analyze system behavior rather than sensor or data input.
    Modi et al. [54] and Bután et al. [4] describe techniques which use rule based,
    estimation based, and learning based to compare system states and detect normal
    and anomalous behavior. For example, the processor usage of various nodes over
    time can be compared with mean and variance rules or probability distributions
    of normal behavior to detect anomalies.'
