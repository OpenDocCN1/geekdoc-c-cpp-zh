  md: 'the IBM 5150 in 1981. The 5150 was the first architecture version and can be
    considered the progenitor of today''s ubiquitous PC.


    The open architecture concept encouraged original equipment manufacturers (OEMs)
    to produce peripherals and even software to run on the 5150. This peripheral and
    software flexibility gave IBM most of the market share that Apple had not already
    grabbed with the Apple II.


    # 6.2 Application Software


    Thus, along OEM peripheral manufacture, the various forms of application software
    to run on such computers became very big indeed. Ten years after the initial launch
    of a very rudimentary MS-DOS-based PC, IBM MS-DOS-based applications composed
    65% of the computer-game market, with the Commodore Amiga at 10%; all other computers,
    were below 10% and declining [35].


    The profits from the huge increase in sales of software as a product grew steadily
    as the decade of the 1980s rolled. A robust market for commercial software led
    to an increasing concern, as to market meant that a competitor could quickly render
    a product obsolete, limiting the seller''s ability to recapture investment. Of
    course, the downside to all of availability was the quality of the products.


    The tendency toward lower cost "buy" not "make" decisions created the commercial
    software market that we know today. Of course, the resultant commercialization
    of the code meant that the customer was completely dependent on the vendor for
    assurance of the quality and security of the product. Unfortunately, the vendor
    did not have the same assurance as the buyer, which proved to be a source of a
    number of problems by the early 1990s.


    Mainly, commercial software could not be trusted to function as planned. Currently,
    the commercial software business is a significant and highly profitable industry.
    According to Gartner, a leading industry research organization, its annual revenue
    was over $400 billion in 2013 [36]. Nonetheless, most information and communications
    technology (ICT) projects exceed their schedules or budgets in a way that would
    never be tolerated by customers in any other industry.


    # 6.3 Flawed Software Development


    For instance, a series of surveys conducted by the Standish Group found that 32%
