  md: '# 7.2 Computer Security and the Growing Internet


    By 1992, the number of annual incidents recorded at the CERT/CC had risen from
    less than 300 in 1989 to around 900 three years later. That baseline number could
    be contrasted with the almost 4000 incidents that were reported at the end of
    the 1990s. A rise of over 400% in the succeeding 8 years indicated that computer
    security was a major issue [57]. In the meantime, the Internet grew from a minute
    number of users in 1990 to an astounding 40 million consumers by the end of the
    decade [57].


    If you view the situation from the standpoint of the situation in 2000, you can
    see that overnight, the technology had practically outpaced anybody''s ability
    to secure it. We had 40,000,000 users and the same basic set of security processes
    and technologies that we had 5 years earlier, when the number of users was in
    the thousands.


    # 7.3 Organized Incident Response


    Given the exponentially rising number of exploits and the growing sophistication
    of the attackers, something had to be done. In response to the Morris Worm in
    the late 1980s, the federal government established the CERT/CC to “coordinate
    communication among experts during security measures and to help prevent future
    incidents” [58]. Thus, the CERT/CC might be considered the first organized response
    to the problem of Internet incidents, and it has continued to serve in that capacity.
    However, one of its contributions is the development of a formal disciplined process
    aimed at identifying and mitigating cyber-based incidents.


    An organized management security response was a logical outcome of the growth
    of the commercial Internet. In 1990 and for several years afterward, it might
    have been acceptable to treat incidents in an ad hoc reactive manner because there
    were so few of them, approximately 900 [57]. However, by 1995 the number of incidents
    had grown to over 2000 and was on its way up to nearly doubling by 1998 [57].
    As a consequence, an ad hoc response became impossible, and something more structured
    was needed.


    # 7.4 Incident Management


    The concept that was developed by the CERT/CC was in the form of a defined and
    fully documented strategy and a set of end-to-end measures. These measures were
    specifically designed to detect and mitigate incidents'
