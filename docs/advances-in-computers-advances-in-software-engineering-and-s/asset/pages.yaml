  md: 'Advances in Software Engineering and Software Assurance 19


    The CFAA further prohibits unauthorized or fraudulent access to computers. It
    specifically prohibits access with intent to defraud, and prohibits intentional
    trespassing, which is the legal term for “hacking.” The act is restricted to “federal
    interest computers,” which is not as narrow as it might seem [30].


    The act applies not only to computers that are owned by the government or used
    by the government. It specifically applies to computers used by federally insured
    financial institutions. It also applies to computers that access federal data
    or computers that are located in two or more states (eg, the Internet) which extends
    federal jurisdiction into every nook and cranny of the private sector. The act
    makes it a misdemeanor to post stolen passwords or obtain or even look at the
    data in a computer that fits that vision, such as bank data [30]. The law makes
    it a felony to alter or destroy information in a computer that falls under designation,
    if the loss is over $1000 [30].


    # 5.5 Punishment Under the Law


    In the 10 years before the advent of the commercial Internet, the CFAA was intended
    to strictly apply to computers containing national defense, banking, or financial
    information. Established criteria for what would be considered criminal acts that
    took place in the computers to which the Act applied, ranging from a fine of $5000
    or twice the value of the thing obtained by the illegal activity up to 5 years
    in jail for “criminal” offenses [30].


    Robert T. Morris was convicted and sentenced under this law for the first true
    cybercrime (1989). As a point of interest, his case serves as a very good illustration
    of the problem of trying to assign penalties for crimes involving acts like denial
    of service. Although his act was guilty of felony fraud and deceit, the sentencing
    judge departed from the stipulations of the law and gave him 3 years of probation,
    a $10,000 fine and 400 h of community service.


    The Supreme Court upheld his conviction a year later by deciding not to hear his
    case. It was their opinion that the ruling of PL 99–474 was sufficient to define
    the facts of unauthorized access. Their view was that the defendant had demonstrated
    sufficient intent to injure to justify his conviction under the Computer Fraud
    and Abuse Law’s “authorization to access"


    However, as it was, the PL 99–474 left no distinction between people who used
    computers for recreational hacking vs those who used it for crime or terrorism.
    A correction was made by the rather awkwardly titled'
