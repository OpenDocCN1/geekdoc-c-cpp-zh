    | Cleansing Approaches | Applicable Data Type |

    |---|---|

    | Rule & Estimation-Based | Ideal for purely numerical data. Unable to detect
    anomalies in categorical data beyond the simplest validity check of a rule-based
    approach. |

    | Learning based | Ideally suited for purely numerical data and combinations of
    categorical and numerical data. Unable to detect anomalies in purely categorical
