    # 5.6 The CERT/CC


    The issues raised by the news coverage were a significant factor in the creation
    of the CERT Coordination Center (CERT/CC), which included the original computer
    emergency response team (CERT) for Internet security incidents. In keeping with
    the general trend for the profession to respond to technological developments
