  md: '# 5.4 The Computer Fraud and Abuse Act


    The exploit is considered a landmark because it produced the first conviction
    under PL 99–474—“The Computer Fraud and Abuse Act,” which had been passed 2 years
    earlier (1986). Morris was prosecuted mainly because of the extent of the damage.
    Public-Law 99–474, the Computer Fraud and Abuse Act (CFAA, 1986), is the first
    real law that addressed crimes committed using a computer. The CFAA was enacted
    by Congress in 1986. It amended the Comprehensive Crime Control Act of 1984 (CCCA,
    18 U.S.C. Section 1030) [30].


    It was probably inevitable at that point in the development of the proto-Internet
    that a law of this type would be written. TCP/IP had the standard for internetworking
    by 1982 [31], and with the implementation of NSFNET in 1985, all the pieces were
    came to do the sort of broad-scale communication that we see today on the modern
    Internet [32]. In that respect, some form of regulation was required because the
    technology had approached the point where serious measures had to be taken to
    ensure that its users and the emerging infrastructure were protected from attack.


    The CFAA was written to clarify and increase the scope of the previous version
    of CCCA. The general aim was to legally apply federal sovereignty to cases “with
    a compelling federal interest, essentially electronic transmissions that cross
    state lines” [30]. In addition to clarifying a number of the provisions in the
    original section 1030, the CFAA also criminalized additional computer-related
    acts. Provisions addressed the distribution of malicious code and denial of service
    attacks. Congress also included a provision in the CFAA criminalizing trafficking
    in passwords and similar items [30].


    The government of interstate commerce is one of the exclusive powers given to
    the federal government in the U.S. constitution, the authority for this action
    goes back in time. The point for our discussion is that 1984 marks the point where
    wide-area network technologies were beginning to get serious traction in society
    at large and, more importantly, across state lines.


    This act establishes through federal mandate that a person is in criminal violation
    of the law who


    +   * knowingly accesses a computer without proper authorization;

    * exceeds his/her permitted access;

    * uses access to cause a loss greater than $1000; and

    * performs an act, such as launching a denial of service attack, that prevents
    other authorized users from using their computers.'
