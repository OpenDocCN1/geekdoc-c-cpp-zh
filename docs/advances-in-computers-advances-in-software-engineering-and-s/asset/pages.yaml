    # 8. CYBERSECURITY BECOMES A SOCIETAL ISSUE: LEGAL FRAMEWORKS


    The issues and concerns associated with security in cyberspace major societal
    issues by the mid-2000s. This is evidenced by the passage of two laws. The first
    of these is the E-Government Act of 2002 (Public Law 107–347, 44 U.S.C. § 101,
    H.R. 2458/S. 803) [65]; the second law is the Federal Information Security Management
    Act (FISMA), which was enacted as Title III of the E-Government Act.


    # 8.1 The E-Government Act of 2002


    This law was enacted on December 17, 2002 to “enhance the management and promotion
    of electronic Government services and processes by establishing a Federal Chief
    Information Officer within the Office of Management and Budget (OMB), and by establishing
    a broad framework of measures that require using Internet-based information technology
    to enhance citizen access to Government information and services, and for other
    purposes” [Introduction, 65].


    The E-Government act is a watershed in the discussion of responses to technological
    change since it did two important things. First and foremost it consolidated what
    had been, up to that point, ad hoc responses to threats as they arose into a single
    unified strategy. Second, it gave the force of to


