    # 7.2.1.1 Roadside Units


    RSUs function at the sensor level without direct influence over the sensed area.
    Data transmitted by RSU can influence the decisions of intelligent vehicles utilizing
    12V communication. However, this is not considered actuation in the environment
    because the vehicles are not directly controlled by the RSU.


    # 7.2.1.2 Traffic Signals and Dynamic Lanes


    In addition to capabilities for sensing in a local area, traffic signals and dynamic
    lanes have direct control over a lane or a traffic intersection. This means that
    the traffic signals and dynamic lanes operate at the sensor actuator level.


    # 7.2.1.3 Central Traffic Management


    Central traffic management units operate at the control level and the supervisor
    level. The intermediate autonomous traffic management units operate at the control
    level. The autonomous traffic management units have control over traffic signals
    and dynamic lanes without directly controlling the state. An example of this would
    be alleviating a traffic congestion in an area by directing dynamic lanes and
    traffic signals that feed the congested area in order to slow incoming traffic.
    This level of traffic management does not directly control the changing of a traffic
    light. It has a higher level of control.


    The highest level of control is the human-in-the-loop, semiautonomous traffic
    management units that operate at the supervisor level. This level of operation
    is more focused on long-term control and design cycle rather than immediate control
    decisions. However, in an emergency the supervisory control can directly take
    over lower level control systems to mitigate a failure.'
