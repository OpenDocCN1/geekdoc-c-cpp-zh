    of a neighboring system is in an acceptable state, eg, “blue” is not an state
    of a traffic light. Beyond this simple detection, anomalies in categorical data
    cannot be detected by rule- or estimation-based approaches. This is because both
    require relative distances for comparison of data values. The mean and variance
    of a system state is irrelevant. However, strictly categorical data without any
    order/ranking is not a realistic scenario for a CPS control system. Numerical
    data, however, is specifically what these detection techniques are designed for.


    # 6.2.2 Learning-Based Detection


    Learning-based detection approach suffers from the same limitation as rule- and
    estimation-based approaches in terms of detecting anomalies in purely categorical
    data. The statistical nature of learning-based detection makes them very powerful
    for numerical anomalies with capabilities beyond those of rule- and estimation-base
    approaches.


    Learning base detection has the added capability of detecting anomalies using
    a combination of categorical and numerical data. An example of this would be a
    data packet containing the state of a stop light, categorical data, and sensor
    measurements from traffic flow in the various directions around the light. Clustering
    approaches can be used to determine outlines based on this state and numerical
    data.


    # 6.2.3 Behavior-Based Detection


    Behavior-based detection approaches are ideally suited for numerical, categorical,
    and the combination of categorical and numerical data. Numerical data extracted
    from system events can be analyzed using the statistical detection approaches
    above to detect anomalies. System events may include any'
