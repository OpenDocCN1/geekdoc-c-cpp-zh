    type of logged activity such as network number and type of system calls, processor
    usage, and number of packets sent or received by a node.


    However, behavioral detection techniques are ideal for categorical and combined
    numerical and categorical data. For example, stateful protocol analysis described
    by Liao et al. [53]. In this approach, the present system state and the sequence
    of historical system states are compared to an expected system operation profile.
    Numerical data can be used in addition to the sequence of system states to compare
    against a system model. An anomaly is detected when the system deviates from the
    behavior of the model.


    # 6.3 Static Elements of ITS Infrastructure


    In this section the static elements of the example ITS system described in Section
    2 will be used to demonstrate where in a CPS each data type is encountered dict
    the cleansing technique (Table 11).


    # 6.3.1 Roadside Units


    The primary data type processed by RSUs is numerical. Examples of sensors used
    by RSU are loop detector counts, traffic video, acoustic, and in-road magnetic
    sensors. In all cases, numerical data is extracted to capture the state of traffic
    in the sensed area.


    Categorical data is also collected by RSU such as vehicle identification number
    or tag. These tags can be either transmitted to the RSU by the vehicle or gathered
    from the air such as Bluetooth packets transmitted by a cellular phone in passing
    vehicles. Numerical data is extracted from the categorical data though collaboration
    between RSU, eg. detecting speed by comparing timestamps of sequential RSU on
    a road segment. Numerical data is the primary data type collected and stored by
    an RSU.


