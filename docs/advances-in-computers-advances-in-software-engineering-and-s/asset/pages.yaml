  md: '# PREFACE


    Traditionally, Advances in Computers, the oldest series to chronicle the rapid
    evolution of computing, annually publishes several volumes, each typically comprised
    of four to eight chapters, describing new developments in the theory and applications
    of computing. The theme of this 102nd volume is inspired by the advances in information
    technology. This volume touches a variety of topics ranging from historical advances
    in software engineering, privacy challenges in mHealth systems, data cleansing
    techniques for cyber-physical systems, and indexing techniques for moving objects.
    The volume is a collection of four chapters that were solicited from authorities
    in the field, of whom whom bear a unique perspective on the topic.


    In Chapter 1, “Advances in Software Engineering and Software Assurance,” Shoemaker
    et al., survey the evolution of software engineering and software assurance from
    its inception to the present time. Technological advances in the areas of programming
    languages, personal computers, advances in inet and Internet, and complex software
    applications are traced. The chapter also articulates the growth of cyber-attacks
    and vulnerability of information as the by-product of the aforementioned advances.
    Finally, this chapter skillfully ties the advances on that surface to be unrelated.


    In Chapter 2, “Privacy Challenges and Goals in mHealth Systems,” Rahman et al.
    address the scope and scale of mobile-based health (mHealth) systems emphasizing
    the privacy issues. In an mHealth system, mobile devices, many sensors that may
    be attached to the patient''s body, are used to capture and analyze the information
    gathered from patients and to communicate this information to health practitioners.
    Protection of medical information from unauthorized accesses and ensuring privacy
    of sensitive medical data bring out several challenges that are the main focus
    of this chapter.


    In Chapter 3, “A Survey of Data Cleansing Techniques for CyberPhysical Critical
    Infrastructure Systems,” Woodard et al. articulate the dependence of critical
    cyber-physical systems on accurate data to facilitate intelligent control and
    improve performance. Corrupted data either intentionally or unintentionally have
    severe economical and safety consequences in a cyber-physical system. This chapter
    reviews techniques that are'
