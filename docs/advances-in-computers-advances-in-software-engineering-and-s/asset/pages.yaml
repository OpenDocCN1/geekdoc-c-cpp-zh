  md: 'the requirement to deal with threats originating from technological changes.
    It also formally recognized the importance of information security to the economic
    and national security interests of the United States.


    # 8.2 Federal Information Security Management Act (FISMA)


    Relevant to our discussion, 44 U.S.C. § 3541, the FISMA, was enacted as Title
    III of the E-Government Act. FISMA requires each federal agency to develop, document,
    and implement an agency-wide policy to provide information security for the information
    and information systems that support the operations and assets of the agency [66].
    FISMA coverage includes those systems provided or managed by another agency, contractor,
    or other source and emphasizes a “risk-based policy for cost-effective security.”


    Based on FISMA requirements, agency officials, chief information officers, and
    inspectors general (IGs) conduct annual reviews of a federal agency’s information
    security program and report the results to the OMB [63]. This information is evaluated
    by OMB as part of its oversight responsibilities and includes OMB’s annual report
    to Congress on agency compliance with the act.


    FISMA assigns specific responsibilities to federal agencies, the NIST, and the
    OMB to strengthen information system security [66]. In particular, FISMA requires
    the head of each agency to implement policies and procedures to cost reduce information
    technology security risks to an acceptable level [66].


    # 8.2.1 Standards, Guidelines, and Associated Methods and Techniques


    As documented in FISMA, the term information security means protecting information
    and information systems from unauthorized access, use, disclosure, disruption,
    modification, or destruction in order to provide integrity, confidentiality, and
    availability [66]. To provide adequate security for all agency operations in accordance
    with FISMA, NIST is assigned responsibility for developing [66] the following:


    +   - Standards

    - Guidelines

    - Associated methods and techniques


    NIST works closely with federal agencies to improve their understanding and implementation
    of FISMA. NIST publishes standards and guidelines that provide the foundation
    for strong information security programs at agencies. NIST performs its statutory
    responsibilities through the Computer Security Division of the Information Technology
    Laboratory and develops'
