    In CPSs, the mitigation technique is additionally dependent on the criticality
    and valid time of the data. Mitigation can be accomplished by correcting, replacing,
    or ignoring the data error. In many CPS applications, the useful life of a single
    piece of data is very short making some correction or replacement techniques inappropriate.
    Additionally, many correction and mitigation techniques require a great deal of
    computation making the energy consumption prohibitive. However, in other applications,
    missing and corrupted data minimizes the quality of information and ignoring these
    errors may cause a serious effect in data analysis.


    Gantay et al. [58] provide a review of research on missing or incomplete data.
    A variety of techniques are used to generate predicted values. Many of these approaches
    are very similar to the anomaly detection techniques. The following are the approaches
    for mitigating missing and corrupted data:


    +   * Imputation: This technique replaces missing data with estimation based off
    the data stream''s probabilistic model.

    * Predicted value imputation: This technique replaces missing data with estimated
    values based on the data set. The estimation methods vary in complexity from mean
    or mode values to more complex estimates from training data.

    * Distribution-based imputation: This technique replaces missing data using a
    classification algorithm. Each pseudo-instance are created when a missing value
    is encountered. Each pseudo-instance is tested. The replacement value is selected
    using a weighted comparison.

    * Unique value imputation: This technique replaces the missing value using simple
    substitution from historic information.

    * Replacing missing data: This technique replaces the missing data with a value
    from a test case that resembles the current data set.

    * Rough sets: This technique uses lower and upper approximations to determine
    a replacement value. The benefit of this technique is that there is no need for
    preliminary or additional information about the data. A number of extensions to
    rough set have been proposed including tolerance relation, nonsymmetric relation,
    and valued tolerance relation.

    * Similarity relation: This technique replaces the missing data after making a
    generalized decisions on the entire data set.


    These techniques can be employed to replace corrupted or missing data allowing
