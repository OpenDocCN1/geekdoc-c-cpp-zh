    # 5.3 Remote Data Checking Using Provable Data Possession


    Atenesie et al. [15] introduce a model for provable data possession that can be
    used for remote data checking. By having a sampling random set of blocks from
    the server, this model produces probabilistic proofs of possession that will significantly
    reduce input/output costs. In order to minimize network communication, the challenge/response
    protocol transmits a small and constant amount of data. The model incorporates
    several mechanisms for mitigating arbitrary amounts of data corruption and it
    is robust. It offers two efficient secure packet protocol (PDP) schemes and the
    overhead that the server is low. To add robustness to any remote data checking
    scheme based on spot-checking it proposes a generic transformation.


    # 5.4 Privacy-Preserving Data Integrity Checking


    A privacy-preserving remote data integrity checking protocol with data dynamics
    and public verifiability [16] makes use of a Remote Data Integrity Checking Protocol.
    The protocol provides public verifiability without the help of a third-party auditor.
    It does not leak any privacy information to third-party, which provides good performance
    without the support of the trusted third-party and provides a method for independent
