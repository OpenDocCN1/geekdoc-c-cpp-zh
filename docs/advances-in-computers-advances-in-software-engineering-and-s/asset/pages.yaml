    | ITS Element | Type of Data |

    | Road unit | Primarily numerical data and numerical data extracted from categorical
    data. |

    | Traffic control | Primarily numerical data with the addition of controller state
    categorical data of neighboring controllers. |

    | Central traffic management | Both numerical and categorical data collected from
    RSU and traffic signals and dynamic lanes. |'
