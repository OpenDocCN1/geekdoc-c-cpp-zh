    The approach proposed by Hu et al. [48] also considers safe regions to reduce
    communication costs. The primary difference between this approach and the aforementioned
    approaches is that this approach does not index an object''s actual position instead;
    it indexes the safe regions for each object.


    The query index and its results are maintained in a memory query index. The query
    index is constructed in a manner similar to that of the BP-tree [46,47]; the entire
    space is partitioned into a grid of disjoint areas. The cells (known as quarantine
    areas) are indexed in the query index. Each cell points to the information about
    query regions partially overlapped with the cell similar to the monitoring region
    in Refs. [46,47].


    An object''s safe region for specific query is either the quarantine area or its
    complement, depending on whether or not the object is in the quarantine area.
    An object''s overall safe region is the intersection of the individual query-safe
    regions.


    The experimental results suggest that the approach proposed in Ref. [48] is scalable
    to the number of registered queries. This scalability has been achieved since
    the pointer in a grid cell points to all of the queries whose quarantine areas
    overlap with the cell. Hence, only the relevant queries will be examined.


