  md: '# 7.3 Mobile Elements of ITS Vehicle


    In this section the mobile elements of the ITS system described in Section 2 will
    be used to demonstrate where in a CPS hierarchical location would dictate the
    cleansing technique (Table 14).


    # 7.3.1 Vehicle Operation


    Sensors that support vehicle operations are at the sensor level. Tire pressure
    sensors, for example, can report the status of tires, but are unable to perform
    any action based on the state. Rain sensors and light sensors, on the other hand,
    are able to sense conditions and perform an action as a result, namely starting
    windshield wipers or turning on head lamps.


    # 7.3.2 Navigation


    In an autonomous vehicle, the navigation system plays an important role in driving
    decisions made by the vehicle. For this type of vehicle, the navigation system
    plays the role of a sensor, in that it determines its current location. However,
    the navigation recommendations are used to control the routes driven. In a way,
    the navigation system also acts as a sensor actuator. Its recommendations can
    be viewed as commands for driving to a particular destination.


    Semiaautonomous vehicles may have collision avoidance or other driving control
    systems. In this case, the navigation system acts at the supervisor level. The
    driver makes the decision about changes to navigation based on the recommendations
    of the navigation system.


    | Table 14 Hierarchical Location for ITS Mobile Infrastructure |

    | ITS Element | Location of Component |

    | Vehicle operation | Takes place at the sensor or the sensor actuator level.
    Some devices gather data, while others are able to take action based on locally
    sensed information. |

    | Navigation | Takes place at the sensor or supervisor level. While autonomous
    vehicles use the navigation information to directly control driving behavior,
    other vehicles relay navigation data to a human driver, who ultimately decides
    on the chosen route. |

    | Driver | Takes place at the controller or supervisor level. Autonomous vehicles
    use sensor data to directly control the path of the vehicle, while other vehicles
    rely on a driver to interpret and act on sensed information. |'
