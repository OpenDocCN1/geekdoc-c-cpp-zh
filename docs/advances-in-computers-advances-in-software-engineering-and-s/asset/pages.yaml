    Another simple rule-based statistical approach to anomaly detection is statistical
    inference using the mean and variance of a data set. Ngai et al. [41] use a chi-square
    test performed over a sliding window. In this example, the system determines that
    at least one value in the sliding window is anomalous if the chi-square value
    falls outside of a range specified by the user. The acceptable level must be configured
    prior to operation. This node-local approach can detect anomalies in the data
    stream of a single sensor without imposing additional network overhead. Statistical
    inference techniques cannot adapt to changing ranges, which are very common in
    long-term wireless sensor installations. Panda et al. [42] propose another very
    simple rule-based anomaly detection method which calculates the mean and variance
    of a set of neighboring sensors to detect if a sensor is faulty. Rule-based statistical
    methods can be implemented on minimal hardware and detect anomalies quickly provided
    the data is well behaved and the rules are set appropriately. As such, other approaches
    have developed that do not run on user-set parameters.


    # 3.3.3 Learning-Based Detection


    Learning-based statistical approaches utilize data mining, clustering, and classification
    algorithms to group data based on data similarities [38]. An anomaly is detected
    when the data does not belong to a group. These techniques have high detection
    rates but require additional processing and storage hardware.


