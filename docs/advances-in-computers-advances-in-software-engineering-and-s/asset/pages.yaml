    # 6.4.3 Driver


    Numerical sensor readings from proximity sensors may facilitate decisions made
    by autonomous and semiautonomous vehicles. Additionally, categorical data may
    be available by inspecting messages received by other vehicles in the ITS. Consider
    a situation where a vehicle informs its neighbors of its intention to change lanes.
    However, the vehicle never executes the lane change. This ITS equivalent of leaving
    one blinker on could be detected as an anomaly, so that order other vehicles can
    resume normal traffic behavior.


    # 7. CLASSIFICATION OF TECHNIQUES BASED ON HIERARCHICAL LOCATION


    In this section we will classify the data cleansing techniques presented in Section
    3 based on the hierarchical nature of the system. Using this classification, we
    will then discuss in an ITS each cleansing technique would be most appropriate.


    # 7.1 Levels of System Hierarchy


    Elements of an ITS can be categorized based on their location within the overall
    ITS hierarchy. Sensors are at the base of the hierarchy. They are capable of acquiring
    data and may have limited access to resources. The sensor actuator level of the
    hierarchy is above the sensor level. Sensor actuators are able to make control
    decisions using data acquired from local sensors. Next, the control level uses
    data collected by sensors and sensor actuators to make control decisions at a
    wider scope. Finally, the supervisor level encompasses human operator or supervisors
    who make decisions on data retrieved from lower levels of the hierarchy. The retrieved
    data may be processed prior to use as the basis of decisions.


    The sensor level of the hierarchy is the base, as it provides a foundation for
    the autonomous control decisions made by other levels in the hierarchy. Members
    of this level, such as RSUs, are capable of collecting data from local sensors
    and disseminating values to others. Sensors are unable to make control decisions;
    they simply acquire and allow access to data items.


    Because their role is simple, sensor-level devices can use simplistic data cleansing
    techniques. Rule-based techniques, for example, are simple to apply and can remove
    obviously erroneous data items. Estimation-based techniques may be applicable,
    as well, depending on the data being sensed.'
