    # 3. LANGUAGE SUPPORT FOR STRUCTURED PROGRAMMING


    The structured programming control structures required two significant evolutionary
    changes in the technology to become relevant and possible.


    # 3.1 FORTRAN


    The first of these was the advent of compiler-based languages (1957) [6]. In the
    mid-1950s, IBM’s John Backus headed a team that defined the first high-level general
    purpose imperative language [6]. It was called FORTRAN (Formula Translator) and
    it was first operational in April of 1957 [6].'
