    For instance, find the five best restaurants in Chicago and find the best restaurants
    nearest to my current location are two LAQs. A closer inspection of the examples
    reveals a subtle, yet fundamental, difference between the two. The result set
    of the first query is independent of the location of the user. This is not true
    with the second query. In other words, the result of the first query will be the
    same for any user regardless of her/her location. For the second query, the result
    set will vary according to the geographic position of the user. The second query
    is an example of a location-dependent query (LDQ). LDQs are a subclass of LAQs.
    Due to dependence on the location of the query user, the efficient processing
    of LDQs is more challenging than other types of LAQs. It when the queried objects
    are considered to be moving (find the five closest taxis to my current location).


