    # 6. CONCLUSION


    The rapid evolution of mobile technology coupled with the rapid growth of various
    forms of mHealth poses both challenges and opportunities for the adoption and
    diffusion of mHealth. There are a number of issues that are particularly pertinent
    to how mHealth will be deployed in the coming years, and how rapidly it will become
    an integral part of the healthcare system. However, to ensure widespread adoption
    of mHealth-based services at all level of society, we need to address the privacy
    challenges posed by the underlying technology.


