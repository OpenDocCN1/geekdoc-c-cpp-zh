  md: '# A Survey of Data Cleansing Techniques for Cyber-Physical Critical Infrastructure
    Systems


    Using this classification, we will then discuss where in an ITS each cleansing
    technique would be most appropriate.


    # 6.1 Types of Data


    The types of data that will used for for classification are numerical and categorical
    data [63]. Statistical analysis, which data mining is rooted in, also recognizes
    additional data types including binary, ordinal, binomial, count, additive, and
    multiplicative. These statistical data types can be mapped to numerical or categorical
    data types because their distinguishing characteristics are not relevant to a
    control system in CPS.


    Numerical data types are any kind of quantitative data including any data that
    can have a number associated with it for ranking. Numerical data can be discrete
    or continuous values describing absolute or relative measurements. Discrete data
    represents items that can be counted as number of cars waiting at a stop light
    or the number of lanes that are open in a tunnel. A computer system would store
    this type of data as integer values. Continuous data represents measurement data
    such as the average speed of vehicles on a certain road. A computer system would
    store this type of data as floating-point values. Numerical data is the most common
    type of data in a control system.


    Categorical data types are qualitative in nature. Categorical data is data that
    represents characteristics such as the status of a road segment (open, closed)
    or an identification tag such as a license plate number. This type of data also
    includes binary or false data. System states are considered categorical data,
    for example, the status of a traffic light (green, red, yellow). In a computer
    system this type of data can be stored as strings or as enumerations.


    # 6.2 Classification of Techniques


    A variety of the techniques presented in Section 3 can be employed to analyze
    and detect anomalies in each of these types of data. Table 10 contains a summary
    of the cleansing techniques classified by a detectable data type.


    # 6.2.1 Rule- and Estimation-Based Detection


    Rule-based and estimation-based detection approaches are similar enough to consider
    them as a single class from the data type point of view. Only the simplest rule-base
    detection approach is relevant for categorical data. This detection may include
    checking incoming data describing the state'
