    # More than one Type of Event


    The design in the example above does only allow applications to register for one
    type of event (readevents). The event type is hardcoded in the Reactor and it
    is a simple solution sufficient for applications without any further event detection.
    The REACTOR pattern, however, is not limited to one type of event. The pattern
    scales to support different types of events.


    Pattern-Oriented Software Architecture [Schmidt al] describes two general strategies
    for dispatching notifications:


    +   * Single-method interface: In this case, event handler is notified of all
    events through one, single function. The type of event (typically in the form
    of an enum) is passed as a parameter to the function. The disadvantage of this
    approach is that it sets the stage for conditional logic, which could lead to
    maintain.


    +   * Multi-method interface: The event declares functions for each supported
    event (e.g. handleRead, handleWrite, setTimeout). As the Reactor has the knowledge
    of what event occurred, it invokes the corresponding function immediately, thus
    avoiding the burden on the event handler to re-create the event from a parameter.


