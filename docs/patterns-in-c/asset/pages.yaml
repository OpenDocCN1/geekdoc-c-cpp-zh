  md: '# Idiomatic Expressions


    ```

    const struct TemperatureNode zeroNode = {};nstruct TemperatureNode node = {};

    /* Perform some operations on the node. */

    /* Reset the node (equal to node = zeroNode); */

    memcpy(&node, &zeroNode, sizeof node);

    ```


    Using memcpy for copying struct out isn''t the simplest possible way. After all
    last line could be rewritten as node = zeroNode while preserving the same behavior.
    Instead the strength of this idiom is bought when applied to an array. It helps
    us avoid an explicit loop over all elements in the array as memcpy does and handles
    the admittedly tedious task of resetting the array.


    ```

    const double zeroArray[NO_OF_TEMPERATURES] = {};ndouble temperatures[NO_OF_TEMPERATURES]
    = {};

    /* Store some values in the temperatures array. */

    /* Reset the array. */

    memcpy(temperatures, zeroArray, sizeof temperatures);

    ```


    # ARRAY SIZE BY DIVISION


    # Problem Context


    The C language does not provide much support for built-in arrays. For example,
    when passing a array to a function, the array decays into a pointer to its first
    element. Without any specific convention and giving only the pointer, it isn''t
    simply possible to tell the size of the array. Most APIs allow this book-keeping
    task to the programmer. One example is the poll() function in the POSIX API. poll()
    is used as an event multiplex scanner arrays for events. These handles, which
    refer to platform resources like sockets, are stored in an array and passed to
    poll(). The array is followed by an argument specifying the number of elements.


    ```

    struct pollfd handles[NO_OF_HANDLES] = {};

    /* Fill the array with handles to poll, */

    code omitted... */

    result = poll(handles, NO_OF_HANDLES, NFTIM);

    ```


    The problem with this array is that there is tying the constant NO_OF_HANDLES
    to the possible number of elements except the name. Good naming does matter, but
    it only matters to human readers of the code; the compiler doesn''t care.


    # Applying the Idiom


    By calculating ARRAY SIZE BY DIVISION, we are guaranteed that the calculated size
    always matches the actual number of elements. The calculation is below at compile
    time by the compiler itself.


    ```

    struct pollfd handles[NO_OF_HANDLES] = {};

    const size_t noOfHandles = sizeof handles / handles[];

    ```


    This idiom builds upon taking the size of the compile array and dividing it with
    the size of one of its elements (sizeof handles[0]).'
