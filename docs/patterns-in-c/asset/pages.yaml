  md: '# Patterns in C


    # Patterns in software


    Software development is hard. It''s an act of balancing different forces while
    trying to close the gap between the problem domain and a solution model. Worse
    yet, we have to start at a point where our understanding of these models is still
    incomplete. We constantly have to juggle with tame complexity on multiple levels.
    And need to be extremely precise and correct in expressing our solutions. The
    computer is an unforgiving host.


    Given this view we consider patterns as a tool in software designers set. Patterns
    are valuable, they''re also one of the most misunderstood concepts within our
    profession. We receive blame and ridicule. Criticism is valid. Patterns have been
    used speculatively in many designs, perhaps most often within the Java community.
    The relating context is layers of abstractions far from the actual problem to
    solve. I mean, maintaining an AbstractFactorySingletonBuilderPrototypefly isn''t
    why I went programming.


    Other parts of the criticism may stem from the early years of patterns. Patterns
    sprung from the work of architect Alexander. Since the days of large-scale programming
    projects, the community has borrowed both terminology and design discipline of
    architecture. Sometimes the parallels have been stretched beyond the limits of
    both and reason. This was the case with much of the secondary literature on patterns
    rather than actual patterns that arose out of the excitement over this fascinating
    work. Working with patterns rather than actual programs we were writing. How do
    they actually solve any interesting problem? The result was viewed as something
    abstract. Nothing could be further from Alexander''s original intent.


    The patterns found in Alexander''s books are simple and elegant formulations on
    how to solve recurring problems in different contexts. Alexander''s patterns refer
    to the physical world. They are about the nature of towns and buildings. Alexander''s
    philosophy is about making buildings come alive. His work is a praise of collaborative
    construction guided by a shared language – a pattern language. Such a generative,
    non-mechanical construct. It''s a language with the power to evolve and grow.
    As such, patterns are more of a communication tool than technical solutions.


    # The cognitive view


    In his classic talk at the Turing awards 1972, Dijkstra remarked that computer
    programming is an "intellectual challenge which will without precedent in the
    cultural history of mankind" (Dijkstra, 1972). What is it that makes software
    development so hard, in Dijkstra''s terms, "without precedent" to anything we''ve
    constructed? Dijkstra himself gave the answer by saying that a competent programmer
    is fully aware of the strictly limited size of his own skill." It''s a matter
    to make the great cognitive challenges of software development. Programming stretches
    our cognitive abilities to a maximum and we need to counter with effective design
    strategies to handle all the complexity inherent in software.


    One of the main factors limiting the size of our skill is working memory. Working
    memory is a theoretical construct and understood as the system that allows us
    to hold information in our mind, integrate different parts, reason about them
    and manipulate them. Working memory is what we use when we try to decipher a pattern
    in Lisp, understand the relationship between two Java objects, or find a way to
    express a certain domain in Haskell. It the conscious workbench of the mind.


    Working memory is vital to our reasoning, problem solving, and decision making.
    It''s also strictly limited in its capacity. Back in 1956, George Miller made
    the first quantification of our working memory'
