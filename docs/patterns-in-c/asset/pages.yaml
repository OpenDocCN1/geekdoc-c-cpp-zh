  md: '# # The STRATEGY Pattern


    # ## Reflections on STRATEGY


    Of all the design patterns in this book, STRATEGY is the one I''ve been using
    the most. The pattern is fundamental. A free shift in mindset. Applying STRATEGY
    shifts the focus of an algorithm from how to what. Rather than trying to control
    how a function performs its task we parameterize it with a high-level behavior
    encapsulating what to do.


    Within a software design, excessive coupling is one of the most damaging properties
    of a program. And the worst form of coupling is control coupling. In the degenerate
    case of control coupling, a client passes a flag to some to control its behavior.
    It''s a common coding style that leads to conditional logic. Excessive conditional
    logic introduces complexity in itself. But it gets worse.


    Control coupling, as discussed in my original article, breaks the encapsulation.
    Suddenly, the function is torn down, modules melt together. Such code is hard
    to extend. It''s an invitation to bugs. The hardest bugs I''ve found are when
    different features interact. That precisely case with the control coupling approach.
    Instead, a good design separates features and variations. It lets them vary independently
    (features often have different change rates) without arguments.


    STRATEGY isn''t an object-oriented pattern. One of the main problems I have with
    the Gang of Four book is its prominent use of class diagrams. Open any pattern
    in the book. First thing we see is a class diagram. Often, a similar diagram is
    repeated in the "Structure" section. This has led many developers to confuse the
    diagram with the actual pattern. It''s not best, it''s one way to implement the
    pattern in a certain language. Nothing more. A pattern is a dynamic, generative
    entity. Depending on context, the applications of a pattern may look radically
    different each time. It''s my firm belief that much of the harm done to the design
    patterns movement could have been avoided had the Gang of Four excluded the section
    on structure.


    # ## Implementing STRATEGY


    Identifying and exploiting commonality is fundamental to software design. By encapsulating
    and re-using common functionality, the quality of the design rises above code
    duplication and dreaded anti-patterns like copy-paste. This chapter dives into
    a design pattern that adds flexibility to common software entities by letting
    clients customize and extend them without modifying existing code.


    # ## Control coupled customers


    To attract and keep customers, many companies offer some kind of bonus system.
    In our example, a customer is placed in one of three categories:


    +   * Bronze customers: Get 2 % reduction on every item bought.

    * Silver customers: Get 5 % reduction on every item bought.

    * Gold customers: Get 10 % off on all items and free shipping.


    A simple and straightforward way to implement a price calculation based upon this
    bonus system is through conditional logic.'
