  md: '# Consequences


    The main consequences of applying the STRATEGY pattern are:


    +   1. The benefits of the open-closed principle. The design pattern STRATEGY
    offers great flexibility that it allows clients to change and control the behavior
    of an existing module by implementing their own, concrete strategies. Thus, however
    is supported by adding new code instead of modifying code.

    2. Reduces complexity, conditional logic. Complex interactions may lead to monolithic
    modules littered with conditional logic, potentially in the form of control coupling.
    Such code tends to be hard to maintain and extend. By encapsulating each branch
    of the conditionals in a strategy, the STRATEGY pattern eliminates conditional
    logic.

    3. Allows different versions of the same algorithm. The non-functional requirements
    on a module may vary depending on its usage. The typical trade-off between speed
    versus memory usage is classic. Using the Strategy pattern, the choice of trade-offs
    may be delegated to the user (“Strategies can provide different implementations
    of the same behavior”) (Gamma, et al.).

    4. An extra level of indirection. The main issue with this consequence arises
    as data from the context has to be obtained in a strategy. As all functions used
    as strategies have to follow the same signature, simply adding potentially unrelated
    parameters lowers the cohesion. Implementing the context as a FIRST-CLASS AD may
    solve this as it reduces the parameters to a single handle. With the FIRST-CLASS
    ADT approach, the knowledge about the data of interest is encapsulated within
    each strategy and obtained through the handle to the FIRST-CLASS ADT. A careful
    design should strive to keep the module implemented as a FIRST-CLASS ADT highly
    cohesive and avoid it decaying into a repository of unrelated data needed by different
    strategies (such a design ill typically indicates that the wrong abstraction has
    been chosen). Similarly, in case the flexibility of the STRATEGY pattern isn''t
    needed and the problem may be solved by conditional logic that is easy to follow,
    the latter is probably a better choice.


    # Example of use


    STRATEGY may prove useful for specifying policies in framework design. Using STRATEGY,
    clients may parameter the implementation.


    For example, error-handling is typically delegated to the application. Such a
    design may be realized by letting the client provide a strategy to be invoked
    upon an error. By those means, the error may be handled in an application specific
    manner, which may stretch between simply ignoring the error to logging it or even
    reboot the system.'
