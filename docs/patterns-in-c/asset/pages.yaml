  md: 'Patterns in C


    3


    Instead, I looked to leverage the existing design elements of C into higher-level
    constructs. An important thing to realize about patterns is that they are neither
    a blueprint of a design, nor are they tied to any particular implementation. My
    starting point was that it would be possible to find mechanisms fitting the paradigm
    of C and thus letting C programmers benefit from the experience captured by patterns.


    Once the project was finished I took some time to document my findings. Through
    this book, I wish to share my findings with you I have gone through the original
    writings, corrected where necessary, but largely left the original content untouched.
    Instead, I provide a new reflection on each chapter. With the advantage of more
    years of studies and experiences I hope to shed some light on the patterns, the
    principles behind and their applicability.


    Let the chapters ahead be the starting point for discussing patterns in the context
    of the ever popular C language.


    # Scope of the book


    # What you will experience


    It is my belief that C programmers will benefit from the growing catalogue of
    patterns. This series will focus on the following areas:


    +   * Implementation techniques. I will present a number of patterns and demonstrate
    techniques for implementing them in the context of the C language. In case I''m
    aware of common variations in the implementation, they will be discussed as well.
    The implementations included should however not by any means be considered as
    a final specification. Depending on the problem at hand, the implementation trade-offs
    for every pattern has to be considered.

    * Problem solved. Patterns solves problems. Without any common problem, the “pattern”
    may simply qualify as a pattern. Therefore I will present the main problem solved
    by introducing the pattern and provide examples of problem domains where the pattern
    can be used.

    * Consequences on the design. Every solution implies a set of trade-offs. Therefore
    each pattern will discuss the consequences on the quality of the design in the
    resulting context.


    # ...and what you won''t


    +   * Object oriented feature emulation. The pattern implementations will not
    be based on techniques for emulating oriented features as inheritance or C++ virtual
    functions. In my experience, these features are better left to a compiler; manually
    emulating such features is obfuscating at best and a source of track bugs at worst.
    Instead, it is my intent to present patterns that utilizes the strengths of the
    abstraction mechanisms already included in the C language.

    * In depth discussion of patterns. As the focus in this book is on the implementation
    in C, each pattern should be seen as a complement to the original pattern descriptions.
    By those means, this series will **not include** exhaustive, in depth treatment
    of the patterns. Instead, I will provide a high-level description of the pattern
    and reference existing work, where a detailed examination of the pattern is found.


