    In the example above assert is a protective mechanism decorated with comments
    describing the rationale for the assertions. Always with comments, the best ones
    are the ones you don''t have to write because the code is already crystal clear.
    Specifying the intent of the code is a step towards clearness and assert itself
    proves to be an excellent construct for:


    The idiom ASSERTION CONTEXT increases the expressiveness of the code by merging
    the comment, describing the assertion context, what it refers to. This context
    is added as a string, which always evaluates to true in the assertion expression.
    The single-line assertion is now self describing in how it communicates its context:


    # Applying the Idiom


    +   1 assert(receiver) && "Is validated by the caller";


    Besides its primary purpose, communicating to a human reader of code that the
    receiver is valid, ASSERTION CONTEXT allows itself debugging. As an assertion
    fires, it writes information about the particular to the standard error file.
    The fact of this information is implementation-defined, but it will include the
    text of the argument. With carefully-chosen descriptive strings in the assertions
    it becomes, for the author of the code, to make a qualified guess about the failure
    without looking at the source. As it provides rapid feedback, I this feature particularly
    useful during short, incremental development cycles driven by unit-tests.


    A drawback of ASSERTION CONTEXT is the memory used for the strings. In small embedded
    applications it may have a noticeable impact on the size of the executable. However,
    it is important to notice that assert is pure debug functionality and do not affect
    a release build; compiling with NDEBUG will remove all assertions together with
    the context strings.


    # CONSTANTS TO THE LEFT


    # Problem Context


    The C language has a rich flora of operators. The language is also very liberal
    about usage. How liberating the slogan "Trust the programmer" feel, it also less
    protection against errors and some errors are more frequent than others. It wouldn''t
    be too wild a guess that virtually every C programmer in a moment of serious,
    ahead caffeine abstinence has erroneously written an assignment instead of a comparison.


    +   1 int x = 0;


    +   2


    +   3 if(x = 0)


    +   4 {


    +   5


    ```

    /* This will never be true! */

    ```


    +   6


    ```

    }

    ```


    So, why not simply ban assignments in comparisons? Well, if I personally avoid
    it, assignments in comparisons may sometimes actually make some sense.'
