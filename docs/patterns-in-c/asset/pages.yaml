  md: "# Implementation Mechanism\n\nWhich mechanism may be suitable for expressing\
    \ this, clearly oriented idea, in C? Returning to our example, we see that we\
    \ basically have to switch functions upon each state transition. Luckily, the\
    \ C language supplies one powerful feature, pointers to functions, that serves\
    \ needs perfectly by letting us change the behavior of an object at run-time.\
    \ Using this mechanism, the interface of the states would look as:\n\nListing\
    \ 1: The state interface in WatchState.h\n\n```\n/* An incomplete type for the\
    \ state representation itself. */\nttypedef struct WatchState WatchStatePtr;\n\
    /* Simplify the code by using typedefs for */\ntypef void (*EventStartFunc)(WatchStatePtr);\n\
    typef void (*EventStopFunc)(WatchStatePtr);\nstruct WatchState\n{\nEventStartFunc\
    \ start;\nEventStopFunc stop;\n};\n```\n\n# Breaking the Dependency Cycle\n\n\
    After getting used to the scary syntax of pointers to functions, the interface\
    \ above looks rather pleasant. However, with the interface as it is, a dependency\
    \ cycle will evolve.\n\nConsider the pointers in the WatchState structure. Every\
    \ concrete state has to define the functions to be pointed at. Each time an event\
    \ is added to the interface, all concrete states have to be updated. The resulting\
    \ code would be error-prone to maintain and not particularly flexible.\nThe good\
    \ news is that breaking this dependency cycle is simple and the solution has the\
    \ nice advantage of providing a potential error-handler. The trick is to provide\
    \ a default implementation, as illustrated in the listing below.\n\nListing 2:\
    \ Extend the interface as before.. */\n\n```\nvoid defaultImplementation(WatchStatePtr\
    \ state);\n{\n  /* We will get here if the stop event isn't supported\n  in the\
    \ concrete state. */\n}\nstatic void defaultStop(WatchStatePtr state);\n{\n  /*\
    \ We will get here if the start event isn't supported\n  in the concrete state.\
    \ */\n};\n```\n\nListing 3: Provide the default implementations in WatchState.c"
