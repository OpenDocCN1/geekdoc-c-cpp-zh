  md: "# The OBSERVER Pattern\n\n```\n#include \"TimeObserver.h\"\nvoid attach(const\
    \ TimeObserver* observer);\nvoid detach(const TimeObserver* observer);\n```\n\n\
    These are implemented by the concrete subject, the TimeSource, which has to keep\
