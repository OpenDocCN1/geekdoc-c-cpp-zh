  md: '4. Extra level of indirection. There is a slight performance cost involved.
    Using the FIRST-CLASS ADT pattern implies one extra level of indirection on all
    operations on the data structure.


    5. Increased dynamic memory usage. In problem domains where there be potentially
    many instances of a quantity unknown at compile-time, a static allocation strategy
    cannot be used. As a consequence, the usage of dynamic memory tends to increase
    when applying the FIRST-CLASS ADT pattern.


    # Examples of use


    The most prominent example comes from the C language itself or, to be more precise,
    the C Standard Library – FILE. True, FILE isn''t allowed by the standard to be
    an incomplete type and it may be possible to identify its structure, buried deep
    down in the standard library. However, the principle is the same since the internals
    of FILE are implementation specific and programs depending upon them are inherently
    nonportable.


    Sedgewick[Sedgewick] uses FIRST-CLASS ADT to implement many fundamental data structures
    such as linked-lists and queues.


    This pattern may prove useful for cross-platform development. For example, when
    developing applications for network communication, there are differences between
    Berkeley Sockets and the Winsock library. The FIRST-CLASS ADT pattern provides
    the tool for abstracting away those differences for clients.


    The trick is to provide two different implementations of the ADT, both sharing
    the same interface (i.e. include file).'
