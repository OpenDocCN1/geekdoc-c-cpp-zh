  md: '# The FIRST-CLASS ADT Pattern


    # Reflections on FIRST-CLASS ADT


    A common criticism of the book Design Patterns is that the patterns only apply
    to message-passing object oriented languages like C++ or Java. The patterns are
    seen as workarounds for absent language features. The need for patterns, the reasoning
    goes, is taken as an indication that the language is somehow less powerful.


    There is some indeed some truth to this statement. Design Patterns itself states
    it clearly: "the choice of programming language is important because it is one
    of view" (Gamma, et al). The book goes on to state that its pattern category assumes
    "Smalltalk/C++ level language features." If we go for a higher-level language
    than C++, like Common Lisp, we find that many design patterns don''t apply; Common
    Lisp has a completely different design space. Many patterns are internalized in
    the language itself (like first-class functions and VISITOR through the generic
    function model in Common Lisp''s object)


    But a language''s power depends on context. There are problems where Common Lisp,
    despite its power, isn''t necessarily the best fit. Likewise, there may be cases
    where C isn''t the best choice. The reasons may be technical, social, or cultural.


    For, the interesting part is considering patterns from C horizon. Design Patterns
    notes that a procedural language might typically include patterns like encapsulation.
    First-Class ADT is exactly such a pattern.


    To me, encapsulation is a tool for managing complexity. It''s a way to separate
    aspects of a problem. Depending on my role I can view the design from any of these
    perspectives: the external behavior and the internal details. In a successful
    design, these two views are orthogonal and may depend independently.


    Like other pattern, it is one to use with care and good taste. I wouldn''t design
    all my modules as First-Class ADT. Rather, I often find the pattern useful when
    enforcing boundaries between different layers in an application. The First-Class
    ADT may serve as a technical firewall between different development teams, allowing
    one of them to publish an interface while hiding the implementation details. Such
    a design encourages work on different, related, parts to proceed in parallel.


    # Implementing the First-Class ADT Pattern


    Our journey through the patterns will start with a language level pattern that
    decouples interface from implementation, improving encapsulation and reducing
    dependencies for many of the sub-patterns in this book.


    This pattern will lay the foundation


    # FIRST-CLASS ADT Pattern


    It''s getting close to the project deadline as the project manager rushes into
    the office. "They found some problem with your with a stressed voice. "According
    to the test-team, you cannot register more than 42 orders for a given customer.
    Sounds strange, doesn''t it?


    Darn. You know it. They hardened limits. "I''ll have a look at it," you reply
    in a soft voice. "Fine, I expect the problem to be solved tomorrow," the manager
    mumbles as he leaves office.


    "No problem," you reply, confident that the design of the customer routines are
    highly modular and clearly implemented (after all, you''ve implemented it yourself).


    You launch your favorite code-editor and open a file with the following content:'
