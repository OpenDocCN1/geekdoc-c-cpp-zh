    # Subject - Observer Dependencies


    The introduction of the OBSERVER pattern results in loose dependencies between
    the subject and its observers. no matter how loose, the dependencies cannot be
    ignored and an often unseen aspect of the OBSERVER pattern is to ensure correct
    behavior in case of changed registrations during a notification of the observers.
    The problem should be addressed in all OBSERVER implementations and is illustrated
    by investigating the notification code below:

