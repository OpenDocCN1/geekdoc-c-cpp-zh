  md: "# The STATE Pattern\n\n# Reflections on STATE\n\nOver the years, the STATE\
    \ pattern has been at the end of the road for several successful refactorings.\
    \ The main problem with the STATE pattern is its name. The name is ill-chosen.\
    \ After all, state is all imperative programming about them. With such a dominant\
    \ name, we run the risk of getting the emphasis on The State Pattern. It is quite\
    \ a complex pattern. I tend to balance the alternatives carefully. In most cases,\
    \ simpler alternatives will do. Other patterns, like Methods for States, are easier\
    \ to reason about. In simple cases, explicit conditional logic is often just fine;\
    \ we just have to watch out for duplications. As far as the name of the pattern\
    \ is concerned, Design Patterns suggests a better name: Objects For State The\
    \ alternative name is better fit. It expresses both the intent and structuring\
    \ in a much better way.\n\nMy adventures in functional programming languages have\
    \ taught me the value of minimizing state and side-effects. Introducing state\
    \ in our programs has implications for our ability to reason about them. Not only\
    \ do we have to consider the algorithm in the light of its input arguments; we\
    \ must also determine the current state and how it will impact the computation.\n\
    \nTo contemplate matters, most of these states are hidden. They're often implicit\
    \ in the design, expressed as combinations of variables in many cases, these states\
    \ are expressed as state machines in our code. By organizing and partitioning\
    \ the algorithms in explicit states we get a different view of the problem. A\
    \ simplification that allows us to assess the impact of potential changes. While\
    \ all good designs try to keep side-effects to a minimum, mutable state is a complicated\
    \ aspect inherent in imperative programming. We need conceptual tools to successfully\
    \ express it.\n\n# Implementing the STATE Pattern\n\nEvery non-trivial program\
    \ passes through a number of different states during its lifecycle. Describing\
    \ this lifecycle as a finite state machine is a simple and useful abstraction.\
    \ This chapter investigates different strategies for implementing state machines.\
    \ The goal is to identify mechanisms that let the code communicate the intent\
    \ of expressing the problem as a finite state machine.\n\nConsider a simple, digital\
    \ stop-watch. In its most basic version, it has two states: started and stopped.\
    \ A traditional and direct way to implement this in C is with conditional logic\
    \ in the shape of switch/case statements and/or if-else clauses.\n\nThe digital\
    \ stop-watch in this example is implemented as a First-Class ADT.\n\n```\ntypedef\
    \ enum\n{\n    stopped,\n    started\n} State;\n\nstruct DigitalStopWatch\n{\n\
    \    /* Let a variable hold the state of our object. */\n    State state;\n  \
    \  TimeSource source;\n}\n```"
