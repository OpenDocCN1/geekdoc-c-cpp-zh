    # # From a Performance Perspective


    Making things worse, the solution above fails to scale in terms of performance
    as well. As all events are scanned serially, even in case timeouts used, valuable
    time is wasted nothing.


    The potential performance problem may be derived from the failure of taking the
    concurrent nature of the problem into account. One approach to address this problem
    by introducing multiple threads. The diagnostics server keeps its event loop,
    the loop is now reduced to scan for requests. As a connection is requested, a
    new thread is allocated exclusively for handling messages on that new connection.


    The multithreaded approach fails to address the overall design issue as it violates
    both the single responsibility principle and the open-closed principle. Although
    the code for scanning and dispatching diagnostics is moved out of the event loop,
    adding a new server-port still requires modifications to existing code.


    From a design perspective threads doesn''t improve anything. In fact, even with
    respect to performance, this solution may due to context switches and synchronization
    actually perform worse than the initial single-threaded approach.


    The sheer complexity inherent in designing and implementing multithreaded applications
    is a further argument for discarding this solution.


    # # Problem Summary


    Summarizing the experience so far, the design fails as it assumes these three
    different responsibilities. The problem is bound to be worse as the design violates
    the open-closed principle, making modifications to existing code more costly.


    Summarizing the ideal solution, it would scale, encapsulate and decouple the different
    responsibilities, and be able to serve multiple clients simultaneously without
    introducing the liabilities of multithreading. The REACTOR pattern realizes this
    solution by encapsulating each service of the application logic in event handlers
    and separating out the code for event demultlexing.


    # # The REACTOR Pattern


    The intent of the REACTOR pattern is: "The architectural pattern allows event-driven
    requests to demultiplex and dispatch service requests that are delivered to an
    application from one or more clients" [Schmidt et al]


