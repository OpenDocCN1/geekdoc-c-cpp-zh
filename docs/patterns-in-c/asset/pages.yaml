  md: '# The OBSERVER Pattern


    # Reflections on OBSERVER


    As I wrote the original patterns articles I based the implementations on actual
    experience from several production code. Over the previous years I had collected
    notes and sample implementations of several well-known patterns. My initial plan
    was to publish five articles, starting with the more general patterns first. That
    left me in the position where I had to choose and prioritize between the patterns.
    The first three (First-Class ADT, STATE and STRATEGY) were all given. And I knew
    wanted to finish with a discussion of the REACTOR pattern. Clearly, some patterns
    had to


    I finally selected OBSERVER. In retrospect, other patterns would probably have
    made a better candidate. The FACADE (Gamma, et al), for example, is straightforward
    and natural in C. In the end I went with the OBSERVER for reasons: preparation
    and generality.


    First, the implementation mechanisms I used in the OBSERVER are similar to the
    ones I tend to use for the REACTOR. As, the OBSERVER implementation could serve
    as a gentle introduction to the more complex architectural REACTOR pattern.


    Second, event notification is a part of many applications. Decoupling the sender
    and receiver of a event notification is central. Today, many programming languages
    have come to include native support for OBSERVER. Cs, for example, provides a
    general version with its events mechanism. And of course Common Lisp has it through
    the before and after methods that make OBSERVER implementations both trivial and
    expressive. In C, we have to go through more challenges to arrive at an implementation
    that fits. Done right, observers can still be a viable solution.


    # Implementing OBSERVER


    Managing dependencies between entities in a system is crucial to a solid design.
    In the previous chapter we had a look at the head of the open-closed principle.
    Now we''ll turn to another principle for dependency management and illustrate
    how both of these may be realized using the OBSERVER pattern.


    # Dependencies arise


    Returning to the examples used for the STATE pattern, they described techniques
    for implementing the behavior of a simple stop-watch. Implementing such a watch
    typically involves the task of fetching the time from some kind of time-source.
    As the time-source would probably be tied to interactions with the operating system,
    it is a good idea to encapsulate it in an abstraction hiding the system specific
    parts in order to use testing and portability. Similarly, the internals of the
    digital stop-watch should be encapsulated in a module of its. As the digital stop-watch
    is responsible for fetching the time from the time-source (in order to present
    it on its digital display), it clears that there will be a dependency between
    the watch and the time-source. There are two obvious choices for the direction
    of this dependency.


    # Consider the Watch as a Client


    It may seem rather natural to consider the watch as a client of the time-source.
    That is, ... Unfortunately, implementing the dependency in this direction introduces
    one obvious problem: how does the watch know if the time changes? The quick answer
    is: it doesn''t. At least it doesn''t unless it introduces some kind of polling
    mechanism towards the time-source. Just as important as it is to avoid premature
    optimization, one should also strive to avoid premature pessimization:'
