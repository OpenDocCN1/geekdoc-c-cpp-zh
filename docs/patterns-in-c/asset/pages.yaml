  md: '# Idiomatic Expressions


    # Reflections on the Idioms


    After I finished the original patterns series I took some time off on a winter
    vacation to document some of the idioms I had applied in the implementations of
    the patterns. This was a response to some direct questions from my readers why
    I used certain code constructs or preferred a sensible style. These idioms that
    I had picked up over the years. By either reading other people or sometimes through
    discussions in the comp.lang.c frequent I encountered. Often, a change in style
    come about after I made a mistake. The idioms I applied were the results of a
    learning process. A painful bug due to an unintended assignment led me to adapt
    CONSTANTS TO THE LEFT. My experiences with maintaining a large legacy code base
    taught me to appreciate NAMED PARAMETERS AND MAGIC NUMBERS


    Patterns exist at all levels of scale in our designs. At their lowest level they
    are referred to as idioms. Idioms depend upon the implementation technology. Sometimes
    we find that the idioms we use in one language isn''t applicable in a higher-level
    language. It may be that the problem it intends to prevent is present in the new
    language. INITIALIZE COMPOUND TYPES WITH {} is such an example; many languages
    provide sensible defaults initialization for variables. CONSTANTS TO THE LEFT
    is a non-issue in functional programming languages with immutability as a guiding
    principle. It might also be the case that language has first-class support for
    the idea behind the idiom. NAMED PARAMETERS is one such example. It is supported
    naturally by languages such as Python and modern versions of C#. But these higher-level
    languages grow their own idioms too. One challenge of learning a new language
    is to get accustomed with its idiomatic curve for problem solving. By documenting
    the idioms we can provide guidance and ease the learning curve for our technologies.


    I have here the opportunity to write down the idioms I had collected during my
    decade as a programmer. My original idea was to write more patterns. But life
    had others. I switched jobs and found myself working with quite different technologies.
    The C implementations got abandoned. Writing them up without working experience
    didn''t feel right. I believe in fresh knowledge. Idiomatic expressions turned
    out to be my last writings on C. I hope to return some day. When do, I''ll pick
    up a copy of this final chapter as a starting point to guide my coding.


    # Idiomatic Expressions in C


    # The Evolution of Idioms


    As a language evolves, different patterns arise. These patterns get used with
    such a high frequency and naturalness that they almost grow together with the
    language and generate an idiomatic usage for the practitioner of the language.
    The resulting idiomatic expressions often seem peculiar to a newcomer using the
    language. This holds equally true for both natural and computer languages; even
    a programmer using the idioms has them in order to be reading at other people''
    code.


    The idioms at the lowest levels are useful in virtually every non-trivial C program.
    Unfortunately idioms at this level are seldom described in introductory programming
    books and more advanced literature expects the reader to be familiar with the
    idioms. The intention of this chapter is to capture some of these common idiomatic
    expressions.'
