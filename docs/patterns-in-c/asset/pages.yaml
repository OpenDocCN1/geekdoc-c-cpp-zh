  md: "# The FIRST-CLASS ADT Pattern\n\n# Listing 1 : Interface in Customer.h\n\n\
    ```\n/* Include guards and include files omitted. */\n#define MAX_NO_OF_ORDERS\
    \ 42\n\n/* Internal representation of a customer. */\ntypedef struct {\n    const\
    \ char* name;\n    Address address;\n    size_t noOfOrders;\n    Order orders[MAX_NO_OF_ORDERS];\n\
    } Customer;\n\nvoid initCustomer(Customer* customer,\n    const char* name,\n\
    \    Address* address);\n\nvoid placeOrder(Customer* customer,\n    const Order*\
    \ order);\n/* A lot of other related functions... */\n```\n\nA quick glance reveals\
    \ the problem. Simply increasing MAX_NO_OF_ORDERS would, wouldn't it? What's the\
    \ correct value for it? Is it 64, 128, maybe even 2048 or some other number? Customers\
    \ with, single order allocate space for, let's say, 2047 non-existing orders?\n\
    As you think about it, realize that the current solution doesn't scale well. Clearly,\
    \ we need another. Recall that a linked list exists in the code base's library.\
    \ A linked list might do the trick. However, this means changing the internal\
    \ structure of the customer.\nNo problem, it looks like you of everything; the\
    \ clients of the customer module simply use the provided functions for all access\
    \ of the customer structure. Updating those functions should be enough, shouldn't\
    \ it?\n\n# Information hiding\n\nWell, in an ideal world the guest would be isolated\
    \ to the, single module. Given the interface above, clients depend upon the internal\
    \ structure in at least one.\nAt worst, the clients of the data structure themselves\
    \ leading to costly changes of all clients.\nThis can be prevented by frequent\
    \ code-inspections and programmer discipline. In any case, we still have the the\
    \ compile-time dependencies and after changes, a re-compile of all clients is\
    \ required and the compilation time may be significant in large systems.\nThe\
    \ FIRST-CLASS ADT pattern will eliminate both dependency problems. The pattern\
    \ provides us with a method of separating interface from implementation, achieving\
    \ true information hiding.\n\n# Definition of a FIRST-CLASS ADT\n\nADT stands\
    \ for Abstract Data Type and it is basically a set of values and operations on\
    \ these values. The ADT is considered first-class if we can have many, unique\
    \ instances of it.\nSounds like the interface listed in the introductory example\
    \ above, doesn't it? However, the data type in the example is not abstract as\
    \ it fails to hide its implementation details. In order to make it truly abstract,\
    \ we have to utilize a powerful feature of C - the ability to specify incomplete\
    \ types."
