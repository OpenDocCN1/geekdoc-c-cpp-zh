  md: '# # The REACTOR Pattern


    # ## Reflections on REACTOR


    So far the patterns in this book have addressed general, recurring design problems.
    The kind of problems present in non-trivial programs. The REACTOR pattern is more
    limited in its scope. It''s a pattern that operates on the architectural level
    of design. The main reason I included it was due to the elegant separations of
    concerns in the REACTOR. As such, the pattern is a nice example of good design
    principles that have value in themselves.

    wait, principles that have value in themselves.


    Every design choice involves trade-offs. The REACTOR pattern is no exception.
    It is a non-trivial model. Yet, when used in the right context, a REACTOR provides
    an elegant programming model. Over the years I''ve worked on systems where the
    REACTOR proved to be a perfect fit. These were both systems running on hardware
    with limited capabilities. The systems received stimuli from multiple sources.
    The messages were distributed through a third-party message-middleware between
    independent Linux processes. At the same time, processes had to interface external
    systems over the network. By providing the REACTOR as a service library, a great
    deal of work could be accomplished in a relatively short amount of programming
    since the communication messages were solved. Much of the messaging, the type
    of receive would be encapsulated. When supporting, the application code could
    focus on the actual problem and rely on the SYNCHRONOUS I/O.


    The REACTOR is a pattern for SYNCHRONOUS I/O. Over the last years, asynchronous
    I/O has become much more common. In part because asynchronous I/O provides an
    opportunity for programs to take advantage of multi-core machines. If you happen
    to work in that context, I recommend you to have a look at a close relative to
    the REACTOR – the PROREACTOR pattern. A PROREACTOR specifically targets asynchronous
    read and write operations.


    # ## Implementing REACTOR


    In this chapter we will step outside the domain of standard C and investigate
    a pattern for eventriven applications. The REACTOR pattern decouples different
    responsibilities and allows applications to demultiplex and dispatch events from
    potentially many clients.


    # ## The case of many Clients


    In order to simplify maintenance of large systems, the diagnostics of the individual
    subsystems are gathered in one, central unit. Each subsystem connects to the server
    using TCP/IP. As TCP/IP is a connection-oriented protocol, the clients (the different
    subsystems) have to request a connection at the server. When a connection is established,
    a client may send diagnostics messages at any time.


    The brute-force approach is to scan connection requests and diagnostics messages
    from the clients one by one as illustrated in the activity diagram in illustration
    1.'
