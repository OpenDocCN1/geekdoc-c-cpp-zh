  md: '# MAGIC NUMBERS AS VARIABLES


    # Problem Context


    Experienced programmers avoid magic numbers. Magic numbers do not communicate
    the intent of the code very well and may confuse anyone trying to read or modify
    it. Traditionally, some numbers 0, 1, 34 and 42 are considered less magic than
    others. Consider a variable that is initialized to 0. A reader immediately expects
    this to be a default initialization and the variable will probably be assigned
    another value later. Similarly, acquainted know that 42 is the answer to the ultimate
    question of life, universe, and everything.


    The problem with these so-not magic numbers is that they build upon assumptions
    and expectations. These may be broken. One example is struct tm, which is used
    to represent the components of a calendar time in standard C. For historical reasons
    and in violation of the principle of least astonishment, assigning 0 to its tm_year
    member does not represent year 0; tm_year holds the years since 1900.


    Pure magic numbers are of even worse. Consider the code fragment below:


    ```

    startTimer(10, 0);

    ```


    Despite a good function name, it is from clear what''s going on. What''s the resolution
    - is 10 a value in seconds or milliseconds? It is a value at 0 or does it refer
    to some kind of id? And about what zero as second parameter?


    # Applying the Idiom


    A step towards self documenting code is to express MAGIC NUMBERS AS VARIABLES.
    By applying this idiom to the code above the questions do not ever arise; the
    code is not perfectly clear about its intent.


    ```

    const size_t timeoutSeconds = 10;

    const size_t doNotRescheduleTimer = 0;

    ```


    ```

    startTimer(timeoutSeconds, doNotRescheduleTimer);

    ```


    Of course the approach may be even further. By writing


    ```

    startTimer(tenSecondsTimeout, doNotRescheduleTimer);

    ```


    the code gets even more. Or does it really? The problem is that to compile the
    variable tenSecondsTimeout is just a name.


    There is no guarantee that it holds the value 10 as an evil maintenance programmer
    I may have changed the declaration:


    ```

    /* Original value was 10 */

    const size_t tenSecondsTimeout = 42;

    ```


    Such things happen and now debugging the program will be Pleasantly surprised
    about how long ten seconds really are. They may feel like, hmm, well, 42 actually.


    An idiom cannot be blindly applied and MAGIC NUMBERS AS VARIABLES is no exception.
    My recommendation is to use it extensively but avoiding coding any values or data
    types into the names of the variables. Values and types are just too likely to
    change over time and such code gets unnecessarily hard.'
