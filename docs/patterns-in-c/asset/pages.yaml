    as its raison d''être is to dispatch events to its registered handlers.


    # Consequences


    The main consequences of applying the single-responsibility pattern are:


    +   1. The benefits of the single-responsibility principle. Using the REACTOR
    pattern, each of the responsibilities is encapsulated and decoupled from each
    other. The design results in increased cohesion, which simplifies maintenance
    and minimizes the risk of feature interaction. The platform dependent code for
    event detection is decoupled from the application logic, unit testing is greatly
    simplified (it is straightforward to simulate events through the EventHandler
    interface).

    2. The benefits of the open-closed principle. New responsibilities, in the form
    of new event handlers, may be added without affecting the existing handlers.

    3. Unified mechanism for event handling. Even if the REACTOR pattern is centered
    on handles, it may be extended for other tasks. Pattern-Oriented Software Architecture
    [Schmidt et al] describes different strategies for integrating the multiplexer
    of 1/O with event handlers. The Reactor with timer threads is an alternative to
    typical simple software based on signals or threads. This extension adds the possibility
    to specify a timeout value specified with milliseconds. Although it will not suit
    a hard real-time system, a Reactor based timer mechanism is easier to implement
    and use a signal or thread-based solution as it to avoid re-entrance problems
    and race-conditions.

    4. Provides an alternative to multithreading. Using the REACTOR pattern, blocking
    operations in the event handlers are avoided and consequently also multithreading.
    As discussed, a multithreaded solution adds only significant complexity; it may
    also prove to be efficient in terms of run-time performance. However, the Reactor
    implies a pre-emptive multithasking model, each event handler must ensure that
    it does not perform operations that starve out other event handlers.

    5. Trades type-safety for flexibility. All event handlers are abstracted as "void".
    When converting a void-pointer to a pointer of a event handler type, the compiler
    doesn''t have any to detect an error conversion. This problem was faced in the
    implementation of the OBSERVER pattern and the solution is the same for the REACTOR:
    define unique notification functions for each different type of event handler
    and bind the functions and event handler together using an EventHandler structure
    as seen in Listing 1.


    # Summary


    The REACTOR pattern simplifies event-driven applications by decoupling the different
    responsibilities. The responsibilities are now encapsulated in separate modules.


    There is much more to the REACTOR pattern described in this one. Particularly
    several variations that all come with different benefits and trade-offs. For an
    excellent in-depth treatment of the REACTOR and other patterns in the domain,
    I recommend the book Pattern-Oriented Software Architecture, volume 2 [Schmidt
    et al].'
