  md: "# A Table-based Solution\n\nThe second traditional approach to implement finite\
    \ state machines is through transition tables. Using this technique, our original\
    \ example now reads as.\n\n```\ntypedef enum {\n  stopped,\n  started;\n} State;\n\
    type enum {\n  stopEvent,\n  startEvent\n} Event;\n#define NO_OF_STATES 2\n#define\
    \ NO_OF_EVENTS 2\nstatic State TransitionTable[NO_OF_STATES][NO_OF_EVENTS] = {\n\
    \  {stopped, started},\n  {stopped, started}\n};\n\nvoid startWatch(DigitalStopWatchPtr\
    \ instance) {\n  const State currentState = instance->state;\n  instance->state\
    \ = TransitionTable[currentState][startEvent];\n}\nvoid stopWatch(DigitalStopWatchPtr\
    \ instance) {\n  const State currentState = instance->state;\n  instance->state\
    \ = TransitionTable[currentState][stopEvent];\n}\n```\n\nThe choice of a transition\
    \ table over logical condition solved the previous problems:\n\n+   1. **Scales\
    \ well.** Independent of the size of the state machine, the code for a state transition\
    \ is just one simple table-lookup.\n2. **No duplication.** Without the burden\
    \ of repetitive switch/case statements, modification comes easily. When adding\
    \ a new state, the change is limited to the transition table; all code for the\
    \ state handling itself goes unchanged.\n3. **Easy to understand.** A well structured\
    \ transition table serves as a good overview of the complete lifecycle."
