    }\n```\n\nThis is a universally simple solution. While the coding construct may\
    \ be simple, the approach introduces several potential problems:\n\n+   1. It\
    \ doesn't scale. In large machines the code may stretch over page after page of\
    \ nested conditional logic. Imagine the true maintenance nightmare of changing\
    \ large, monolithic segments of statements.\n2. Duplication. The conditional logic\
    \ tends to be repeated, with small variations, in all functions that access the\
    \ state variable. As always, duplication leads to error-prone maintenance. For\
    \ example, simply adding a new state implies changing functions.\n3. No separation\
    \ of concerns. When using conditional logic for implementing state machines, there\
    \ is no clear separation between the code of the state machine itself and the\
    \ actions associated with the various events. This makes the code hide the original\
    \ intent (abstracting the behaviour as a finite state machine) and thus making\
    \ the code less readable."
