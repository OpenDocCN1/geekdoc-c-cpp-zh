    In the context, the Customer does not have any knowledge about the concrete categories
    anymore; the concrete strategy is typically assigned to the context by the application.
    All price calculations are delegated to the assigned strategy.


    Using this pattern, the interface for calculating price adheres to the open closed
    principle; it is possible to add or remove categories without modifying the existing
    calculation algorithms or the Customer'
