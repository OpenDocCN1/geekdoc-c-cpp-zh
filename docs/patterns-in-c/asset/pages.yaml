    # The Single Responsibility Principle


    The single responsibility principle states that “a class should have only one
    reason to change” [Martin]. The goal of this principle is close to that of the
    open-closed principle treated below: both strive to protect existing code from
    modifications. When violating the single responsibility principle, a module gets
    more reasons to change and modifications to become more likely. Worse, the different
    responsibilities absorbed by a single module may become coupled and interact with
    each other making modifications and testing of the module more complicated.


    The single responsibility principle is basically about cohesion. It is useful
    and valuable on many levels of abstraction, not least in a procedural context;
    simply replacing the word “class” with “function” enables us to analyze algorithms
    like the one above with respect to this principle.


    # Violation of the Open-Closed Principle


    By violating the single responsibility principle, the module in the example above
    will be hard to maintain; it is code that one never wants to dig into. Unfortunately,
    on collision course with that which is the fact that the event loop violates the
    open-closed principle; new functionality cannot be added without modifying existing
    code. Related to our example, a diagnostics server typically allows a technician
    to connect and query stored information. Introducing that functionality would
    double the'
