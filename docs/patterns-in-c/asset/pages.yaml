    \ the context doesn't have any state memory. For example, this which uses first-class\
    \ objects, the opposite is true and the natural abstraction is to associate the\
    \ customer with a price-strategy as illustrated above.\n\n# Comparison of STRATEGY\
    \ AND STATE\n\nWhen discussing the STRATEGY pattern, its relationship with the\
    \ pattern preceding in the Design Patterns [Gama, et al] book deserves special\
    \ mention. The design patterns STATE and STRATEGY are closely related. Robert\
    \ C. Martin puts it this: \"all instances of the State pattern are also instances\
    \ of Strategy pattern, but not all instances of Strategy are State\" [Martin].\n\
    \nThis observation leads us to a remark by John Vlissides, co-author of Design\
    \ Patterns, that \"Let the intents of the pattern be guided to their differences\
    \ and not the classes that implement them\" [Vlissides]. Indeed, even though STATE\
    \ and STRATEGY have a similar structure and similar mechanisms, they differ in\
    \ their intent. The STATE pattern focuses on managing well-defined transitions\
    \ between states, where the primary purpose of STRATEGY is to vary the implementation\
    \ of an algorithm.\n\nRelated to the example above, had the categories been based\
    \ on the sum of money spent by a customer, STATE would have been a better choice;\
    \ the categories would basically illustrate the lifecycle of a customer, as the\
    \ transitions between categories depend upon the history of the customer object.\
    \ The STATE pattern may be used to implement this as a finite state machine.\n\
    \nOn the other hand, if the placement in a category is the result of a membership\
    \ fee, STRATEGY is a better abstraction. It is possible for a customer to wander\
    \ between different categories, a transition to a new category doesn't depend\
    \ upon the history of that customer.\n\nAlthough not to be taken a universal truth,\
    \ a further observation relates to the usage of these patterns and relationships\
    \ towards the client: STATE tends to be an internal concern of the context and\
    \ the existence of STATE is usually encapsulated in the context. Contrasting this\
    \ with STRATEGY, the client usually binds a strategy to its context."
