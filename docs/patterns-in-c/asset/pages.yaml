  md: '# The STATE Pattern


    ```

    1 static void startWatch(DigitalStopWatchPtr context)

    2 {

    3 changeState(context, transitionToStarted());

    4 }

    ```


    A good quality of the stateless approach is that the point of state transitions
    is centralized in the context. One obvious drawback is the need to pass around
    a reference to a context. This reference functions as a memory allowing the new
    state to be mapped to the correct context.

    Another drawback is the care has to be taken with the initialization of the static
    variables that the states are going to live in a multithreaded thread.


    # Consequences


    The main consequences of applying the STATE pattern are:


    +   1. Reduces duplication by complex, state-altering conditional logic. As illustrated
    in the example above, solutions based upon large segments of conditional logic
    tend to contain duplicated code. The STATE pattern provides an appealing alternative
    to removing duplication and reducing the complexity.

    2. A clear expression of the intent. The context delegates all state dependent
    operations to the state interface. Similar to the table-based solution, the STATE
    pattern lets the code reflect the intent of abstracting the problem as a finite
    state machine. With complex, conditional logic, that intent is typically less.

    3. Encapsulates the behavior of each state. Each concrete state provides a good
    overview of its behavior including all events supported in that state. Encapsulation
    makes it both to identify and as updating the relevant code when changes to a
    certain state are to be done.

    4. Implicit error handling. The solutions based on conditional logic, as well
    as the table-based one, require explicit code to ensure that a given combination
    of state and event is valid. Using the technique described above of initializing
    with a default implementation, the controls are built into the solution.

    5. Increases the number of compilation units. The code typically becomes less
    with the STATE pattern. As Design Patterns say "distribution is actually good
    if there are many states". However, for a trivial machine with few, simple states,
    the STATE pattern may introduce an unnecessary complexity. In case, if it is not
    known that more complex behavior may be added, it is probably better to rely on
    conditional logic the logic will be easy to follow.


    # Summary


    The STATE pattern lets us express a finite state machine, making the intent of
    the code clear. The behavior is partitioned on a per-state-base and all state
    transitions are explicit.


    The STATE pattern may serve as a valuable tool when implementing complex state-dependent
    behavior. On the other hand, for simple problems with few states, conditional
    logic is just right.'
