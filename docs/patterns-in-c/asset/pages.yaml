  md: "The FIRST-CLASS ADT Pattern\n\n# Incomplete Types\n\nThe standard [C 1999]\
    \ allows us to declare objects of incomplete types in a context where there sizes\
    \ aren't needed. In our implementation, we are interested in one property of incomplete\
    \ types – the possibility to specify a pointer to an incomplete type (please note\
    \ that the pointer itself is not of an incomplete type).\n\nListing 2 : Pointer\
    \ to an incomplete type\n\n```\n/* A pointer to an incomplete type (hides the\
    \ implementation details). */\ntypedef struct Customer* CustomerPtr;\n```\n\n\
    Instances of this pointer will serve as a handler for the clients of a FIRST-CLASS\
    \ ADT. This mechanism enforces the constraint on clients using the provided interface\
    \ functions because there is no client can access a field in the Customer structure\
    \ (the C language does not allow an incomplete type to be de-referenced).\n\n\
    The type is considered complete as soon as the compiler detects a subsequent specifier,\
    \ with the same tag, and a declaration list containing the members.\n\nListing\
    \ 3 : Completion of an incomplete type\n\n```\n/* The struct Customer is an incomplete\
    \ type. */\ntyped struct Customer* CustomerPtr;\n\n/* Internal representation\
    \ of a customer. */\nstruct Customer {\n  const char* name;\n  Address* address;\n\
    \  size_t noOfOrders;\n  Order orders[42];\n};\\n/* At this point, struct Customer\
    \ is considered complete. */\n```\n\n# Object Lifetime\n\nBefore we dive into\
    \ the implementation of the ADT, we need to consider object creation and destruction.\
    \ As clients only get a handle to the object, the responsibility for creating\
    \ it rests the ADT. The straightforward approach is to write one function that\
    \ encapsulates the allocation of an object and initializes it. In a similar way,\
    \ we define a function for destructing the object.\n\nListing 4 : Interface to\
    \ the ADT, Customer.h\n\n```\n/* Includes and include guards as before... */\n\
    /* A pointer to an incomplete type (hides the implementation details). */\ntypedef\
    \ struct Customer* CustomerPtr;\n```\n\n```\n/* Create a Customer and return a\
    \ handle to it. */\nCustomerPtr createCustomer(const char* name,\n  const Address*\
    \ address);\n```"
