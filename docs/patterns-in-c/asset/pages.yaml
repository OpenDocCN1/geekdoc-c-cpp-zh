  md: "The FIRST-CLASS ADT Pattern\n\n10\n\n```\n#define MAX_NO_OF_CUSTOMERS 42\n\
    static struct Customer objectPool[MAX_NO_OF_CUSTOMERS];\nstatic size_t numberOfObjects\
    \ = 0;\n\nCustomerPtr createCustomer(const char* name,\n                     \
    \       const Address* adres)\n{\n    CustomerPtr customer = NULL;\n    if (numberOfObjects\
    \ < MAX_NO_OF_CUSTOMERS)\n    {\n        customer = objectPool[numberOfObjects++];\n\
    \        /* Initialize the object... */\n    }\n    return customer;\n}\n```\n\
    \nIn case of de-allocation, an array will still do, but a more sophisticated method\
    \ for keeping track of \"allocated\" objects will be needed. However, such an\
    \ algorithm is outside the scope of this book.\n\n# Copy Semantics\n\nAs clients\
    \ only use a handle, which we have declared as a pointer, the ADT, the issue of\
    \ copy semantics boils down to pointer assignment. Whilst efficient, in run-time\
    \ performance, copies of a handle have to be managed properly; the handles are\
    \ only valid as long as the real objects exist.\nWe want to copy the real object,\
    \ and create a new, unique instance of the ADT, we have to define an explicit\
    \ copy operation.\n\n# Dependencies managed\n\nWith the interface above, the C\
    \ language guarantees that the internals of the data structure are encapsulated\
    \ in the implementation with no possibility for clients to access the internals\
    \ of the data structure.\nUsing the FIRST-CLASS ADT, the compile-time dependencies\
    \ on internals are removed as well as changes of the implementation are limited\
    \ to we, the implementation, just as it should be. As long as no functions are\
    \ added or removed from the interface, the clients do not even have to be re-compiled.\n\
    \n# Consequences\n\nThe main consequences of applying the FIRST-CLASS ADT pattern\
    \ are:\n\n+   1. **Improved encapsulation.** The FIRST-CLASS ADT pattern we decouple\
    \ interface and implementation, following the recommended principle of programming\
    \ towards an interface, not an implementation.\n2. **Loose coupling.** As illustrated\
    \ above, all dependencies on the internals of the data structure are eliminated\
    \ from client code.\n3. **Controlled construction and destruction.** The FIRST-CLASS\
    \ ADT pattern gives us full control over the construction and destruction of objects,\
    \ providing us with the possibility to ensure that all objects are created in\
    \ a valid state. Similarly, we can ensure proper de-allocation of all elements\
    \ of the object, provided that client behaves correctly and calls the defined\
    \ destroy-function."
