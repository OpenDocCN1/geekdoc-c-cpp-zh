    \    }\n```\n列表 7：从以下中提取的：\n```\n\n观察者模式的引入导致了主体与观察者之间的松散依赖。无论这种关系如何松散，都无法忽视：在通知期间允许主体变化。解决方案通过在通知期间禁止主体变化来确保其正常工作。此外，可以使用断言在运行时检查约束。\n\
