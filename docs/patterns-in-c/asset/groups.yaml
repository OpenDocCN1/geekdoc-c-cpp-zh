    # # The Stable Dependencies Principle


    During software maintenance or incremental development changes to existing code
    are normally unavoidable; even when applying the open-closed principle the design
    is just closed against certain modifications based upon assumptions by the original
    designer (it is virtually impossible for a software entity to be completely closed
    against all kinds of changes). The stable dependencies principle tries to isolate
    the impact of changes to existing code by making the recommendation that software
    entities should "depend in the direction of stability"[Martin].


    In the initial approach, the watch fetched the direction from the time-source.
    With respect to the stable dependencies direction, this was a better choice. A
    time-source is typically a highly cohesive unit and the more stable entity; simply
    encapsulating it in a proper abstraction, which hides the system details, makes
    it a good candidate to be packed in a reusable lower-level domain layer.


    By having the timesource depend upon the higher-level digital watch, we violate
    the stable dependencies principle. This violation manifests itself by making the
    code for the watch to update.


    Combining the dependency direction of the first approach with the notification
    mechanism of the second would make it an ideal design and the design pattern OBS
    provides the extra level of independence necessary to achieve the benefits of
    both solutions without suffering from any of their drawbacks.


    # OBSERVER


    The OBSERVER pattern serves as a tool for making the open-closed principle work.
    Design Patterns [Gama, et] captures the intent of OBSERVER to "Define a one-to-many
    dependency between objects that when one object changes state, all its dependents
    are notified and updated automatically". Applying the OBSERVER pattern to our
    example, with a second type of watch, the "dependents" are the different watches.
    Design Patterns define the role played by TimeSource as a "concrete subject",
    the object whose state changes should trigger a notification and update of the
    observers, i.e. Observers.


    ![](img/36484cd32ea2e3eb1b027e721e2669a9_34_0.png)


    Illustration 1: The decoupler and receivesver through OBSERVER.


    # # Implementation Mechanism


    In order to decouple the subject from its concrete observers and still enable
    the subject to notify them, each observer must correspond to a unique instance.
    The FIRST-CLASS ADT pattern provides a way to realize this. However, as seen from
    the subject, all observers must be abstracted as one, general type sharing a common
    interface. In the C language, without language support for inheritance, generality
    is usually spelled \void*; any pointer to an object may be converted to \void*
    and back to its original type again without loss of information.


    Listing 2: Interface of the observers, TimeObserver.h'
- md: "\n## The OBSERVER Pattern\n\n```c\ntypedef void (*ChangeTimeNotification)(void*\
    \ instance,\n                           const SystemTime* newTime);\ntypedef struct\n\
    {\n    void* instance;\n    ChangeTimeNotification notification;\n} TimeObserver;\n\
    ```\n\nThe interface declares a pointer to a function, which proves to be an efficient\
    \ technique for implementing dynamic behavior: a concrete observer attaches itself,\
    \ together with a pointer to a function, at the subject. As the subject changes,\
    \ it notifies the observer through the attached function.\n\nBy using abstraction,\
    \ type-safety is basically traded for flexibility: the responsibility for the\
    \ conversion of the observer back to its original type lies on the programmer.\
    \ A conversion back to another type other than the original may have disastrous\
    \ consequences. Franz Kafka, although not very experienced in C programming, would\
    \ provide a good example of behavior: \"When Gregor Samsa woke up one morning\
    \ from unsettling dreams, he found himself in his bed into a monstrous vermin\"\
    \ [Kafka]. Obviously, Gregor Samsa wasn't type-safe. In order to guard against\
    \ such erroneous conversions, the TimeObserver has been introduced to maintain\
    \ the binding between the observer and the function pointer. The implicit type\
    \ conversion is encapsulated within the observer itself, as illustrated in the\
    \ code.\n\nListing 5: A concrete observer implemented as a FIRST-CLASS ADT\n\n\
    ```c\n/* Include files. */\nstruct DisplayStopWatch\n{\n    Display watchDisplay;\n\
    \    /* Other attributes of the watch, e.g.\n      digital display. */\n};\n\n\
    /* Implementation of the function required by the\nTimeObserver interface. */\n\
    static void changedTime(void* instance,\n                        const SystemTime*\
    \ newTime)\n{\n    DigitalStopWatchPtr digitalWatch = instance;\n    assert(NULL\
    \ != digitalWatch);\n\n    updateDisplay(digitalWatch, newTime);\n}\n```\n\nBefore\
    \ an observer can get any notifications, it has to register for them. Listing\
    \ 4 declares the interface required by the observers.\nListing 4: Interface to\
    \ the subject, Subject.h\n\n```c\n#include \"TimeObserver.h\"\nvoid attach(const\
    \ TimeObserver* observer);\nvoid detach(const TimeObserver* observer);\n```\n\n\
    These are implemented by the concrete subject, the TimeSource, which has to keep\
    \ track of all attached observers. The example below uses a linked-list for that\
    \ task. Attaching an observer corresponds to adding a copy of the given TimeObserver\
    \ representation to the list. Similarly, upon a call to detach, the node in the\
    \ list corresponding to the given TimeObserver shall be removed and that observer\
    \ will no longer receive any notifications from the subject. The code fragments\
    \ below illustrate this mechanism.\n\nListing 5: Implementation of the subject,\
    \ TimeSubject.c\n\n```c\n#include \"TimeSubject.h\"\nstruct ListNode {\n  TimeObserver\
    \ item;\n  struct ListNode* next;\n};\nstatic ListNode* observers;\nstatic SystemTime\
    \ currentTime;\n\n/* Local helper functions for managing the linked-list\n   (implementation\
    \ omitted) */\nstatic void appendToList(const TimeObserver* observer) {\n  /*\
    \ Append a copy of the observer to the linked-list. */\n}\nstatic void removeList(const\
    \ TimeObserver* observer) {\n  /* Identify the observer in the linked-list and\n\
    \   remove that node. */\n}\n\n/* Implementation of the TimeSubject interface.\
    \ */\nvoid attach(const TimeObserver* observer) {\n  assert(NULL != observer);\n\
    \  appendToList(observer);\n}\nvoid detach(const TimeObserver* observer) {\n \
    \ assert(NULL != observer);\n  removeList(observer);\n}\n```\n\n```c\n/* Implementation\
    \ of the original responsibility of the\nTimeSource(code for initialization, etc\
    \ omitted). */\nstatic void msTick()\n{\n    struct ListNode* node = observers.next;\n\
    \n\n    /* Invoke a function encapsulating the knowledge\n       about time representation.\
    \ */\n    currentTime = calculateNewTime();\n\n    /* Walk through the linked-list\
    \ and notify every\n       observer that another millisecond passed. */\n    while(NULL\
    \ != node)\n    {\n        TimeObserver* observer = &node->item;\n        observer->notification(observer->instance,\n\
    \                               currentTime);\n\n        node = node->next;\n\
    \    }\n}\n```\n\nThe code above solves our problems; new types of watches may\
    \ be added without any modification to the TimeSource, these watches, our observers,\
    \ are updated in an efficient way without the cost of expensive polling.\n\n##\
    \ Observer Registration\n\nAn additional benefit of implementing the OBSERVER\
    \ pattern as a FIRST-CLASS ADT is the combination of loose dependencies with information\
    \ hiding. The client neither knows nor depends upon a subject. In fact, the client\
    \ doesn't even know that the DigitalStopWatch acts as an observer because the\
    \ functions for creating and destroying the ADT encapsulate the registration handling.\
    \ The code below, which extends\n\n```c\nstatic void changedTime(void* instance,\n\
    \                                     const SystemTime* newTime)\n{\n    /* Implementation\
    \ as before (Listing 3). */\n}\n\nDigitalStopWatchPtr createDigitalWatch(void)\n\
    {\n\n    DigitalStopWatchPtr watch = malloc(sizeof *watch);\n    if(NULL != watch)\
    \ {\n        /* Successfully created -> attach to\n           the subject. */\n\
    \        TimeObserver observer = {0};\n```\n\nListing 6: Encapsulation of the\
    \ registration handling\n\n```c\nobserver.instance = watch;\nobserver.notification\
    \ = changedTime;\n\n    attach(&observer);\n}\n    return watch;\n}\n\nvoid destroyDigitalWatch(DigitalStopWatchPtr\
    \ watch)\n{\n    /* Before deleting the instance we have to detach\n     from\
    \ the observer. */\n    TimeObserver observer = {0};\nobserver.instance = watch;\n\
    observer.notification = changedTime;\n\n    detach(&observer);\n    free(watch);\n\
    }\n```\n\n## Subject - Observer Dependencies\n\nThe introduction of the OBSERVER\
    \ pattern results in loose dependencies between the subject and its observers.\
    \ no matter how loose, the dependencies cannot be ignored and an often unseen\
    \ aspect of the OBSERVER pattern is to ensure correct behavior in case of changed\
    \ registrations during a notification of the observers. The problem should be\
    \ addressed in all OBSERVER implementations and is illustrated by investigating\
    \ the notification code below:\nListing 7: Code extracted from\n\n```c\n/* Walk\
    \ through the linked-list and notify every\nobserver that another millisecond\
    \ passed. */\nwhile(NULL != node)\n{\n    TimeObserver* observer = &node->item;\n\
    observer->notification(observer->instance,\n    &currentTime);\n    node = node->next;\n\
    }\n```\n\nIn an observer decide to detach itself during a notification, the list\
    \ containing the nodes may become corrupted. The solutions span for forbidding\
    \ subject changes during notification and, and at the other extreme, allow the\
    \ subject to change and ensure it works.\nThe solution with forbidding subject\
    \ changes during notification calls for a well-documented Subject interface. Further,\
    \ the constraint may be checked at run-time using assertions.\nListing 8: Checking\
    \ Subject constraints with assertions\n\n```c\nstatic int isNotifying = 0;\n\n\
    void attach(const TimeObserver* observer)\n{\n    assert(0 == isNotifying);\n\
    \    /* Code as before. */\n}\n\nvoid detach(const TimeObserver* observer)\n{\n\
    \    assert(0 == isNotifying);\n    /* Code as before. */\n}\n\nstatic void msTick()\n\
    {\n    struct ListNode* node = observers.next;\n\n    /* Ensure that no changes\
    \ are done to the subject during notification. */\n    isNotifying = 1;\n\n  \
    \  while(NULL != node)\n    {\n        /* Loop through the observers as before.\
    \ */\n    }\n\n    /* All observers notified, allow changes again. */\n    isNotifying\
    \ = 0;\n}\n```\n\nThe solution at the other side of the spectrum depends upon\
    \ the data structure used to store the observers. The idea is to keep a pointer\
    \ to the next observer to notify at file-scope. Attaching or detaching an observer\
    \ involves the possible adjustment of that pointer. By excluding this pointer\
    \ in the notification loop, the problem with unregistrations is solved. By choosing\
    \ a strategy for new registrations, defining if the observers are to be notified\
    \ during the loop they attach or not, the solution is complete. The extra complexity\
    \ is rewarded with the flexibility of allowing observers to be added or removed\
    \ during notification.\n\n## One pattern, two models\n\nIn the example above,\
    \ the part of the subject that changed (in the example system time) was given\
    \ to the observers as an notification function. This technique is known as the\
    \ push-model. The advantage of this model is its simplicity and efficiency; the\
    \ data that is changed is immediately available to the observers. A potential\
    \ problem is the logical coupling between a subject and its observers; in order\
    \ to deliver the correct data, the subject has to know the needs of its observers.\n\
    \nThis potential problem is eliminated by the other model used in OBSERVER implementations.\
    \ This model, known as the pull-model, does not send any detailed information\
    \ about what changed at the subject; the observers have to fetch that data themselves\
    \ from the subject. In case the subject contains several large data structures,\
    \ the efficiency of the pull-model may be improved by introducing an update\n"
  mdcn: "\n\n## 观察者模式 (OBSERVER Pattern)\n\n```c\ntypedef void (*ChangeTimeNotification)(void*\
