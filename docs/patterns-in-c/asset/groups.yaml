    ## 后果


    应用单职责模式产生的主要后果有：


    - 1. 单一职责原则的优势。使用 REACTOR 模式，每种职责都被封装起来并彼此解耦。这种设计增加了内聚性，简化了维护并最大限度地减少了功能间干扰的风险。用于事件检测的平台相关代码与应用程序逻辑解耦，单元测试变得非常简单（通过
    EventHandler 接口模拟事件非常直观）。

    - 2. 开闭原则的优势。可以以新事件处理器的形式添加新职责，而不会影响现有的处理器。

    - 3. 统一的事件处理机制。即使 REACTOR 模式以处理为中心，它也可以扩展到其他任务。面向模式的软件架构 [Schmidt et al] 描述了将
    I/O 多路复用与事件处理器集的不同策略。带有定时器线程的 Reactor 是基于信号或线程的典型简单软件的替代方案。这种扩展增加了指定毫秒级超时值的值的可能。虽然它不适用于硬实时系统，但基于计时器的
    Reactor 比基于信号或线程的解决方案更容易实现和使用，因为它避免了重入问题和竞态条件。

    - 4. 提供多线程的替代方案。使用 REACTOR 模式可以避免事件处理器中的阻塞操作，从而也避免了多线程。讨论过的，多线程解决方案只会增加显著复杂性；在运行时性能方面也可能是高效的。然而，Reactor
    意味着抢占式多任务模型，每个事件处理器必须确保自己不执行可能导致其他事件处理器饥饿的操作。

    - 5. 用类型安全换取活性。所有事件处理器都被抽象为“void”。当将 void 指针转换为事件处理器类型的指针时，编译器没有任何机制来检测错误转换。这个问题在
    OBSERVER 模式的实现中遇到过，REACTOR 模式的解决方案也是相同的：为每种不同类型的事件处理器定义唯一的通知函数，并如列表 1 所示，使用 EventHandler
