    # Reactor Registration Strategy


    When implementing the concrete event handlers as a FIRST-CLASS AD, the functions
    for creating and destroying serve to encapsulate the registration handling. The
    advantage is the combination of loose dependencies with information hiding as
    a client does not have to know about the usage and interactions with the Reactor.


    Another reality is that the internals of the server, in our example the handles,
    is encapsulated within the getSqlServer function. Sure, by giving the Reactor
    a way to fetch it, but the Reactor is considered a well-trusted collaborator and
    we are actively getting it by registering our event handler. There is no way for
    any other module to mistakenly fetch the handler and corrupt the associated resource.


    # Reactor Implementation


    The details of the Reactor implementation are platform specific as they depend
    upon the available synchronous demultiplexers. In the case operating system provides
    more than one synchronous event demultiplexer (e.g. select() and poll()), a Reactor
    may be implemented for each one them and the linker used to choose one of them
    depending on the problem at hand. This technique is referred to as link-time polymorphism.


    Each implementation has to decide the number of reactors required by the surrounding
    environment. In the most case, the application can be structured around one, single
    Reactor. In this case, the interface in Listing 2 (Reactor.h) will serve. An application
    requiring more than one Reactor should consider making the Reactor itself a FIRST-CLASS
    ADT. This variant complicates the clients slightly as references to the Reactor
    ADT have to be maintained and passed around in the system.


    Independent of the system specific demultiplexing mechanism, a Reactor has to
    maintain a collection of registered, concrete event handlers. In its simplest
    form, this collection may simply be an array. This approach serves well in case
    the maximum number of clients is known in advance.'
