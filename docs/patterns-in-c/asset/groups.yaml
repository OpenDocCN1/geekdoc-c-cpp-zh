    ## 总结


    REACTOR 模式通过解耦不同的职责简化了事件驱动应用程序。职责现在被封装在单独的模块中。


    关于本文描述的 REACTOR 模式还有很多内容。特别是几种带有不同优势和权衡的变体。对于对 REACTOR 以及该领域其他模式的深度探讨，我推荐书籍《面向模式的软件架构》第
    2  [Schmidt et al]。


    ## 惯用表达式


    ## 对惯用语的反思


    在完成原始模式系列后，我在冬季休假期间花了一些时间记录了我在模式实现中应用的一些惯用语（idioms）。这是为了回答读者的一些直接问题，即我为什么使用某些代码结构或偏好某种合理的风格。这些是我多年来积累的惯用语，通过阅读他人的代码或有时通过
    comp.lang.c 组的讨论经常遇到。通常，风格的改变发生在我犯错之后。我应用的惯用语是学习过程的结果。一个由于无意赋值导致的痛苦 Bug 导致我学会了“常量置左侧”（CONSTANTS
    TO THE LEFT）。我维护大型遗留代码库的经验教会了我重视“命名参数和魔术数字”（NAMED PARAMETERS AND MAGIC NUMBERS）。


    模式存在于我们设计的各个规模层次。在最低层面，它们被称为惯用语。惯用语取决于实现技术。有时我们发现，在一种语言中使用的惯用语并不适用于更高层的语言。可能是因为它想要防止的问题在新语言中已经存在了。“使用
    {} 初始化复合类型”（INITIALIZE COMPOUND TYPES WITH {}）就是这样一个例子；许多语言为变量提供了合理的默认初始化。在以不可变性为指导原则的函数式编程语言中，“常量置左侧”并不是一个问题。也可能是因为语言本身对该惯用语背后的想法有一等公民级的支持。“命名参数”（NAMED
    PARAMETERS）就是这样一个例子。它被 Python 和现代版本的 C# 等语言自然支持。但这些高层语言也有它们自己的惯用语。学习一种新语言的挑战之一就是习惯它的惯用语。


    本章的意图是捕捉一些惯用语。这里提出的惯用语属于两个重叠的类别：


    - 健壮性惯用语：这一类别的惯用语避免了 C 语言中的常见陷阱。例如，“使用 {} 初始化复合类型”提供了一种紧凑且可移植的方法来初始化结构体和数组。

    - 表现力惯用语：编写良好传达意图的代码与健壮性并行不悖；使代码易于理解可以简化维护，从而有助于程序的长期健壮性。例如，“断言上下文”（ASSERTION
    CONTEXT）使断言具有自说明性。


    ## C 中的惯用表达式


    ## 惯用语的演变


    随着语言的演进，会出现不同的模式。这里提出的惯用语属于两个重叠的类别：


    ## 惯用语描述


    由于它们相对简单，为每一个惯用语专门写章会变得复杂。


    ## 将 sizeof 赋值给变量


    ## 问题背景


    在 C 语言中，通用性通常用 `void*` 表示。这反映在标准库中。例如，动态内存分配的函数（malloc, calloc 和 realloc）返回 `void*`
    指针，并且我们正在分配的类型一无所知。客户端必须向分配函数提供所需的尺寸。这里有一个 malloc 的示例：


    ```c

    HelloTelegram telegram = malloc(sizeof(HelloTelegram));

    ```


    这种代码维护起来很“狡猾”。只要 telegram 仍然是 `HelloTelegram`，一切都是好的。上述 malloc 用法的狡猾之处在于它包含一种特定的依赖关系；给定的尺寸必须与赋值左侧的类型匹配。考虑将
    telegram 类型更改为 `GoodTelegram`。使用上述代码意味着修改两个地方，这至少多了一个地方：


    ```c

    /* 我们更改了赋值两侧的类型！ */

    GoodTelegram telegram = malloc(sizeof(GoodTelegram));

    ```


    未能更新两处可能会导致致命后果，可能导致代码出现未定义行为。


    ## 应用惯用语


    ```c

    HelloTelegram telegram = malloc(sizeof(telegram));

    ```


