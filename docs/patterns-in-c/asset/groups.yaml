  mdcn: "\n\n## C语言中的模式\n\n3\n\n相反，我试图将 C 现有的设计元素转化为更高层次的结构。关于模式，需要意识到的一重要的一点是：它们既不是设计的蓝图，也不束缚于任何特定的实现。我的出发点是，可以找到符合\
    \ C 范式的机制，从而让 C 程序员能够从模式所捕捉的经验中获益。\n\n项目一旦完成，我花了一些时间来记录我的发现。通过这本书，我希望将我的发现与你们分享。我查阅了原始著作，在必要的地方进行了修正，但很大程度上保留了原始内容未变。相反，我对每一章都提供了了新的反思。凭借多年学习和经验的优势，我希望对模式、背后的原理及其适用性提供一些见解。\n\
    \n让接下来的章节成为在广受欢迎 C 语言背景下讨论模式的起点。\n\n## 本书范围\n\n## 你将体验到什么\n\n我相信，C 程序员将从日益丰富的模式库中获益。本系列将关注以下领域：\n\
    \n-   *实现技术。* 我将介绍许多模式，并演示在 C 语言背景下实现这些模式的技术。如果我发现了实现中的常见变体，也将进行讨论。然而，其中包含的实现绝不能被视为最终规范。根据当前处理的问题，必须考虑每个模式的实现权衡。\n\
    -   *解决的问题。* 模式用于解决问题。如果没有共同的问题，“模式”可能仅仅算作一个模式。因此，我将介绍引入该模式所解决的主要问题，并提供可以使用该模式的问题领域示例。\n\
    -   *对设计的影响。* 每一个解决方案都意味着一组权衡。因此，每个模式都将讨论其对结果语境下设计质量的影响。\n\n## ……以及你不会体验到的\n\n\
    -   *面向对象特征的仿真。* 模式的实现将不会基于模拟继承或 C++ 虚函数等面向对象特征的技术。根据我的经验，这些功能留给编译器更好；手动模拟此类特征充其量是混淆了代码，最坏的情况下是难以追踪的\
    \ bug 的根源。相反，我的意图是介绍利用 C 语言已包含的抽象机制优势的模式。\n-   *对模式的深入讨论。* 由于本书的重点是 C 中的实现，每个模式都应该被视为原始模式描述的补充。通过这种方式，本系列将**不包括**对模式的详尽深入的处理。相反，我将提供模式的高层描述，并引用可以找到模式详细检查的现有工作。\n\
    \n## 模式分类\n\n本书涵盖了以下模式：\n\n## C语言中的模式\n\n| 模式 | 分类 | 目的 |\n| --- | --- | --- |\n\
    | 第一类 ADT (First-Class ADT) | 惯用 | 改进封装，管理依赖。 |\n| 状态 (State) | 设计 | 模拟特定状态的行为。\
    \ |\n| 策略 (Strategy) | 设计 | 封装算法族，使设计符合开闭原则。 |\n| 观察者 (Observer) | 设计 | 松耦合实体之间的通知机制。\
    \ |\n| 反应器 (Reactor) | 架构 | 解耦事件驱动应用中的职责。 |\n| 表达式 (Expressions) | 惯用 | 用于增强表达力和健壮性的惯用集合。\
    \ |\n\n这些模式跨越了以下类别：\n\n-   **架构模式。** Frank Buschmann 将此类模式定义为“软件系统的基本组织方案。它提供了一组预定义的子系统，指定了它们的职责，并包含了组织它们之间关系的规则和准则”\
    \ [Buschmann, et al]。\n-   **设计模式。** 设计模式通常影响子系统或组件层级。书中描述的大多数模式属于这一类，包括源自经典《设计模式》（[Gamma,\
    \ et all book]）一书的模式。\n-   **语言级模式。** 这是模式分类中最低的层级，也称为惯用（idioms）。语言级模式正如其名所示，是特定编程语言所独有的。一个简单经典的例子是\
    \ Kernighan 和 Ritchie 提供的 strpy 版本 [Kernigh & Ritchie]。\n\n```c\nvoid strcpy(char\
    \ *s, char *t)\n{\n    while(*s++ = *t++);\n}\n```\n\n## 示例代码\n\n示例中包含的源代码可以在\
    \ GitHub 上获取：https://github.com/adamtornhill/PatternsInC\n\n## 关于 Adam Tornhill\n\
    \nAdam 是一位结合了工程和技术学位的程序员。他是《你的代码即犯罪现场》（Your Code as a Crime Scene）¹）的作者，曾出版过《Lisp\
    \ for the Web²》教程，并自出版了一本关于\n\n> ¹https://prag.com/book/atcrime/your-code-as-a-crime-scene\n\
    ²https://leanpub.com/lspweb\n\n《C语言中的模式》。Adam 还使用多种编程语言编写开源软件。他的其他兴趣包括现代史、音乐和武术。\n\
    \n## 致谢\n\n深表感谢我美丽的 Jenny Tornhill，感谢她所有的支持和鼓励。Jenny³ 也设计了这本书的封面。\nDrago Krznaric,\
    \ Andre Saitzkoff, Tord Andersson 和 Magnus Adamsson 都读过原始系列的草稿。感谢你们的反馈！我还要感谢 ACCU⁴\
    \ 在 2005 年发表了原始文章。\n最后，感谢多年来所有对原始著作发送鼓励性评论和反馈的人。这本书是送给你们的。\n\n> *http://www.jennyytornhill.se\n\
    ⁴http://accu.org/\n\n## 第一类 ADT 模式\n\n## 对第一类 ADT 的反思\n\n对《设计模式》一书的一种常见批评是，模式仅适用于像\
    \ C++ 或 Java 这样基于消息传递的面向对象的语言。模式被视为语言特性缺失的变通方案。这种逻辑认为，对模式的需求是该语言在某种方面不够强大的指示。\n\
    \n这种陈述确实有些事实可言。《设计模式》本身就明确地指出：“编程语言的选择很重要，因为它是观点视角之一” (Gamma, et al)。书中接着指出，其模式分类假设了“Smalltalk/C++\
    \ 级别的语言特性”。如果我们选择一种比 C++ 更高级的语言（如 Common Lisp），我们会发现许多设计模式并不适用；Common Lisp 有一个完全不同的设计空间。许多模式已经内化在语言本身中（例如\
    \ Common Lisp 对象通过泛型函数模型的第一类函数和 VISITOR 模式）。\n\n但语言的威力取决于语境。有些问题尽管 Common Lisp\
    \ 性能强大，但并不一定是最合适的选择。同样，也可能存在 C 不是最佳选择的情况。原因可能是技术性的、社会性的或文化性的。\n\n事实上，有趣的部分是从 C\
    \ 的视角来考虑模式。《设计模式》指出，过程化语言通常包含诸如封装之类的模式。第一类 ADT 正是这样一种模式。\n\n对我来说，封装是一种管理复杂性的工具。它是分离问题不同方面的方法。根据我的角色，我可以从这些任何一个视角来观察设计：外部行为和内部细节。在成功的设计中，这两个视图是正交的，可以独立依赖。\n\
    \n与其他模式一样，它需要谨慎且带有品味地使用。我不会将所有的模块都设计成第一类 ADT。相反，我经常发现在应用不同层之间划分边界时该模式非常有用。第一类\
    \ ADT 可以作为不同开发团队之间的技术防火墙，允许其中一个团队发布接口，同时隐藏实现细节。这种设计鼓励了不同相关部分的并行工作。\n\n## 实现第一类\
    \ ADT 模式\n\n我们的模式之旅将从一种语言级模式开始，该模式将接口与实现解耦，从而改进封装并减少书中许多子模式的依赖。\n\n"
