    \ table over logical condition solved the previous problems:\n\n+   1. **Scales\
    \ well.** Independent of the size of the state machine, the code for a state transition\
    \ is just one simple table-lookup.\n2. **No duplication.** Without the burden\
    \ of repetitive switch/case statements, modification comes easily. When adding\
    \ a new state, the change is limited to the transition table; all code for the\
    \ state handling itself goes unchanged.\n3. **Easy to understand.** A well structured\
    \ transition table serves as a good overview of the complete lifecycle."
  - '[PAGE 18]


    The STATE Pattern


    # Shortcomings of Tables


    As appealing as table-based state machines may seem at first, they have a major
    drawback: it is very hard to add actions to the transitions defined in the table.
    For example, the watch would typically invoke a function that starts to tick milliseconds
    upon a transition to started. The state transition isn''t explicit, conditional
    logic has to be added in order to ensure that the tick-function is invoked solely
    as the transition succeeds. In combination with conditional logic, the inherent
    benefits of the table-based solution decrease together with the quality of the
    design.


    Other approaches involve replacing the simple enumerations with pointers to functions
    specifying the entry actions. Unfortunately, the immediate hurdle of trying to
    make state transitions to actions in a table based solution is that the functions
    need different arguments. This problem is possible to solve, but the resulting
    design loses, in my opinion, both in readability as well in cohesion as it implies
    either giving up type safety or passing around unused parameters. None of these
    alternatives seem attractive.


    Transition tables have their use, but when actions are to be associated with state
    transitions, the STATE pattern provides a better alternative.


    # Enter State Pattern


    In its description of the STATE pattern, Design Patterns [Gamma, al def] defines
    the differences from the table-based approach as "the STATE pattern models state-specific
    behavior, whereas the table-driven approach focuses on defining state transitions".
    When applying the STATE pattern to our example, the structure in illustration
    1 emerges


    | DigitalStopWatch | WatchState |

    |---|--|

    | * startWatch(): void | * startWatch(): void |

    | * stopWatch(): void | * stopWatch(): void |


    | StoppedState | StartedState |

    |---|--|

    | * startWatch(): void | * stopWatch(): void |


    > Illustration 1: Canonical structure of the STATE pattern.


    This diagram looks like an object oriented solution. But please dont worry – we
    will not follow the temptation of the dark side and emulate inheritance in C.
    However, before developing a concrete implementation, let''s explain the involved
    participants.


    +   * DigitalStopWatch: Design Patterns define this as the context. The context
    has a reference to one of our states, without knowing exactly which. It is the
    context that specifies the interface to the clients.

    * WatchState: Defines the interface of the state machine, specifying all supported
    events.

    * StoppedState and StartedState: These are concrete states and each one of them
    encapsulates the behavior associated with the state it represents.


    The main idea captured in the STATE pattern is to represent each state as an object
    of its own. A state transition simply means changing the reference in the context
    (DigitalStopWatch) from one of the concrete states to the other.'
- md: "\n## Implementation Mechanism\n\nWhich mechanism may be suitable for expressing\
    \ this, clearly oriented idea, in C? Returning to our example, we see that we\
    \ basically have to switch functions upon each state transition. Luckily, the\
    \ C language supplies one powerful feature, pointers to functions, that serves\
    \ needs perfectly by letting us change the behavior of an object at run-time.\
    \ Using this mechanism, the interface of the states would look as:\n\nListing\
    \ 1: The state interface in WatchState.h\n\n```c\n/* An incomplete type for the\
    \ state representation itself. */\ntypedef struct WatchState WatchStatePtr;\n\
    /* Simplify the code by using typedefs for */\ntypedef void (*EventStartFunc)(WatchStatePtr);\n\
    typedef void (*EventStopFunc)(WatchStatePtr);\nstruct WatchState\n{\nEventStartFunc\
    \ start;\nEventStopFunc stop;\n};\n```\n\n## Breaking the Dependency Cycle\n\n\
    After getting used to the scary syntax of pointers to functions, the interface\
    \ above looks rather pleasant. However, with the interface as it is, a dependency\
    \ cycle will evolve.\n\nConsider the pointers in the WatchState structure. Every\
    \ concrete state has to define the functions to be pointed at. Each time an event\
    \ is added to the interface, all concrete states have to be updated. The resulting\
    \ code would be error-prone to maintain and not particularly flexible.\nThe good\
    \ news is that breaking this dependency cycle is simple and the solution has the\
    \ nice advantage of providing a potential error-handler. The trick is to provide\
    \ a default implementation, as illustrated in the listing below.\n\nListing 2:\
    \ Extend the interface as before..\n\n```c\nvoid defaultImplementation(WatchStatePtr\
    \ state)\n{\n  /* We will get here if the stop event isn't supported\n  in the\
    \ concrete state. */\n}\nstatic void defaultStop(WatchStatePtr state)\n{\n  /*\
    \ We will get here if the start event isn't supported\n  in the concrete state.\
    \ */\n};\n```\n\nListing 3: Provide the default implementations in WatchState.c\n\
    \n```c\n11 }\n12\n13 void defaultImplementation(WatchStatePtr state)\n14 {\n15\
    \     state->start = defaultStart;\n16     state->stop = defaultStop;\n17 }\n\
    ```\n\n## Concrete States\n\nThe default implementation completes the interface\
    \ of the states. The interface of each state itself is minimal; all there is to\
    \ do is an entry function for the state. Listing 4: Interface of a concrete state,\
    \ StoppedState.h\n\n```c\n1 #include \"WatchState.h\"\n2\n3 void transitionToStopped(WatchStatePtr\
    \ state);\n```\n\nListing 5: Interface of a concrete state, StoppedState.h\n\n\
    ```c\n1 #include \"WatchState.h\"\n2\n3 void transitionToStarted(WatchStatePtr\
    \ state);\n```\n\nThe responsibility of the entry functions is to set the pointers\
    \ in the passed WatchState structure to point to the functions specifying the\
    \ behavior of the particular state. We can utilize the default implementation,\
    \ the implementation of the concrete states is straightforward; each concrete\
    \ state specifies the events of interest in that state. Listing 6: StoppedState.c\n\
    \n```c\n1 #include \"StoppedState.h\"\n2 /* Possible transition to the following\
    \ state: */\n3 #include \"StartedState.h\"\n4\n5 static void startWatch(WatchStatePtr\
    \ state)\n6 {\n7 transitionToStarted(state);\n8 }\n9\n10 void transitionToStopped(WatchStatePtr\
    \ state)\n11 {\n12 /* Initialize with the default implementation before\n13 specifying\
    \ the events to be handled in the stopped\n14 state. */\n15 defaultImplementation(state);\n\
    16 state->start = startWatch;\n17 }\n```\n\nListing 7: StartedState.c\n\n```c\n\
    #include \"StartedState.h\"\n/* Possible transition to the following state: */\n\
    #include \"StoppedState.h\"\n\nstatic void stopWatch(WatchStatePtr state)\n{\n\
    \    transitionToStopped(state);\n}\nvoid transitionToStarted(WatchStatePtr state)\n\
    {\n    /* Initialize with the default implementation\n       specifying the events\
    \ to be handled in the started\n       state.* */\n    defaultImplementation(state);\n\
    \    state->stop = stopWatch;\n}\n```\n\n## Client Code\n\nThe reward for the\
    \ struggle so far comes when implementing the context, i.e. the client of the\
    \ state machine. All the client code has to do, the initial state has set, to\
    \ delegate the requests to the state.\n\n```c\nstruct DigitalStopWatch\n{\n  \
    \  struct WatchState state;\n    TimeSource source;\n    Display watchDisplay;\n\
    };\n\nDigitalStopWatchPtr createWatch(void)\n{\n    DigitalStopWatchPtr instance\
    \ = malloc(sizeof *instance);\n    if(NULL != instance){\n        /* Specify the\
    \ initial state. */\n        transitionToStopped(&instance->state);\n        /*\
    \ Initialize the other attributes here... */\n    }\n    return instance;\n}\n\
    \nvoid destroyWatch(DigitalStopWatchPtr instance)\n{\n    free(instance);\n}\n\
    ```\n\n```c\n27\n28 void startWatch(DigitalStopWatchPtr instance)\n29 {\n30  \
    \   instance->state.start(&instance->state);\n31 }\n32 \n33 void stopWatch(DigitalStopWatchPtr\
    \ instance)\n34 {\n35     instance->state.stop(&instance->state);\n36 }\n```\n\
    \n## A Debug Aid\n\nIn order to debug, the state machine may be extended with\
    \ a string holding the name of the actual state:\n\n```c\n1 void transitionStopped(WatchStatePtr\
    \ state)\n2 {\n3     defaultImplementation(state);\n4     state->name = \"Stopped\"\
    ;\n5 }\n```\n\nUtilizing this extension, it becomes possible to provide diagnostic\
    \ Returning to our implementation of WatchState.c, the code now looks like:\n\n\
    ```c\n1 static void defaultStop(WatchStatePtr state)\n2 {\n3 /* We will get here\
    \ if the stop event isn't supported\n4 in the concrete state. */\n5 logUnsupportedEvent(\"\
    Stop\", state);\n6 }\n```\n\n## Extending the State Machine\n\nOne of the strengths\
    \ of the STATE pattern is that it encapsulates all state-specific making the state\
    \ machine easy to extend.\n\n- Adding a new event. Supporting a new event implies\
    \ extending WatchState Using the mechanism described above, a new default implementation\
    \ is added to WatchState.c. states that intend to support it.\n- Adding a new\
    \ state. The new concrete state has to implement functions for all events the\
    \ only existing code that needs to be changed is the state in which we'll have\
    \ a transition to the new state. Please note that the STATE pattern preserves\
    \ one of the benefits of the table-based solution: client code, i.e. the context,\
    \ remains unchanged.\n\n## Stateless States\n\nThe states in the sample code are\
    \ stateless, i.e. the WatchState structure contains only pointers to re-entrant\
    \ functions. this is a special case of the State pattern [Gamma, et al]. \"If\
    \ State objects have instance variables then context can share a State object\"\
    . However, before sharing states, I would like to point to Joshua Kievsky's advice\
    \ that \"it's best to add state-sharing code after your user experience deploys\
    \ and pointers to the state-instantiation code as a prime bottleneck\" [Kievsky].\n\
    \nIn the C language, states may be shared by declaring a static variable representing\
    \ a certain state inside each function unless state transition. As the variables\
    \ have permanent storage, the signature of the transition functions is changed\
    \ to return a pointer to the variable representing the particular state.\n\nListing\
    \ 8: Stateless function entry, Stateless.c\n\n```c\nWatchStatePtr transitionToStarted(void)\n\
    {\n    static WatchState startedState;\n    static int initialized = 0;\n\n  \
    \  if(!initialized)\n    {\n        defaultImplementation(&startedState);\n  \
    \      startedState.stop = stopWatch;\n        initialized = 1;\n    }\n\n   \
    \ return &startedState;\n}\n```\n\nThe client has been changed from holding a\
    \ variable representing the state to holding a pointer to the variable representing\
    \ the shared state. Further, the context has to define a callback function to\
    \ be invoked as the concrete states request a state transition.\n\nListing 9:\
    \ Client code for changing state\n\n```c\nvoid change(DigitalStopWatchPtr instance,\n\
    WatchStatePtr newState)\n{\n    /* Provides a good place for controls and\n  \
    \     trace messages (all state transitions) have to\n       go through this function).\
    \ */\n    instance->state = newState;\n}\n```\n\nThe stateless state version comes\
    \ closer to the State described in Design Patterns as a state transition, in contrast\
    \ with the previous approach, implying changing the object pointed to by the context\
    \ instead of just swapping its behavior.\n\nListing 10: State transition in Stopped.c\n"
  mdcn: "\n\n## 实现机制\n\n在 C 语言中，哪种机制可能适用于这种清晰的面向思路？回到我们的示例，我们看到基本上在每次状态转换时都要切换函数。幸运的是，C\
    \ 语言提供了一个强大的特性——函数指针，它通过允许我们在运行时更改对象的行为，完美地满足了这一需求。使用这种机制，状态的接口看起来如下：\n\n列表 1：WatchState.h\
    \ 中的状态接口\n\n```c\n/* 状态表示本身的不完整类型。 */\ntypedef struct WatchState WatchStatePtr;\n\
    /* 使用 typedef 简化代码 */\ntypedef void (*EventStartFunc)(WatchStatePtr);\ntypedef\
    \ void (*EventStopFunc)(WatchStatePtr);\nstruct WatchState\n{\nEventStartFunc\
    \ start;\nEventStopFunc stop;\n};\n```\n\n## 打破依赖循环\n\n在习惯了函数指针这种令人生的语法后，上面的接口看起来相当不错。然而，按照现有的接口方式，将会产生一个依赖循环。\n\
    \n考虑 WatchState 结构体中的指针。每个具体的状态都必须定义要指向的函数。每当向接口添加一个事件时，所有的具体状态都必须更新。生成的代码在维护上容易出错，且不够灵活。\n\
    好消息是打破这种依赖循环是非常简单的，而且该解决方案具有提供潜在错误处理程序的良好优点。诀窍在于提供一个默认实现，如下面的列表所示。\n\n列表 2：像以前一样扩展接口..\n\
    \n```c\nvoid defaultImplementation(WatchStatePtr state)\n{\n  /* 如果具体状态不支持 stop\
    \ 事件，\n  我们将会到达这里。 */\n}\nstatic void defaultStop(WatchStatePtr state)\n{\n  /*\
    \ 如果具体状态不支持 start 事件，\n  我们也将到达这里。 */\n};\n```\n\n 列表 3：在 WatchState.c 中提供默认实现\n\
    \n```c\n11 }\n12\n13 void defaultImplementation(WatchStatePtr state)\n14 {\n15\
    \     state->start = defaultStart;\n16     state->stop = defaultStop;\n17 }\n\
    ```\n\n## 具体状态\n\n默认实现完成了状态的接口。每个状态本身的接口是极小的；要做的就是为状态的入口函数。列表 4：具体状态接口，StoppedState.h\n\
    \n```c\n1 #include \"WatchState.h\"\n2\n3 void transitionToStopped(WatchStatePtr\
    \ state);\n```\n\n列表 5：具体状态接口，StoppedState.h\n\n```c\n1 #include \"WatchState.h\"\
    \n2\n3 void transitionToStarted(WatchStatePtr state);\n```\n\n入口函数的职责是将传递的 WatchState\
    \ 结构体中的指针指向指定特定状态行为的函数。我们可以利用默认实现，具体状态的实现非常直观；每个具体状态指定该状态下感兴趣的事件。列表 6：StoppedState.c\n\
    \n```c\n1 #include \"StoppedState.h\"\n2 /* 可能转换到后续状态： */\n3 #include \"StartedState.h\"\
    \n4\n5 static void startWatch(WatchStatePtr state)\n6 {\n7 transitionToStarted(state);\n\
    8 }\n9\n10 void transitionToStopped(WatchStatePtr state)\n11 {\n12 /* 在指定 stopped\
    \ 状态下处理的\n13 事件之前，先用默认实现进行\n14 初始化。 */\n15 defaultImplementation(state);\n16 state->start\
    \ = startWatch;\n17 }\n```\n\n列表 7：StartedState.c\n\n```c\n#include \"StartedState.h\"\
    \n/* 可能转换到后续状态： */\n#include \"StoppedState.h\"\n\nstatic void stopWatch(WatchStatePtr\
    \ state)\n{\n    transitionToStopped(state);\n}\nvoid transitionToStarted(WatchStatePtr\
    \ state)\n{\n    /* 用默认实现进行初始化，\n       指定 started 状态下处理的事件。 */\n    defaultImplementation(state);\n\
    \    state->stop = stopWatch;\n}\n```\n\n## 客户端代码\n\n到目前为止奋斗的奖励现在实现上下文（即状态机的客户端）时得到了。所有的客户端代码需要做的就是在设置好初始状态后，将请求委托给状态。\n\
    \n```c\nstruct DigitalStopWatch\n{\n    struct WatchState state;\n    TimeSource\
    \ source;\n    Display watchDisplay;\n};\n\nDigitalStopWatchPtr createWatch(void)\n\
    {\n    DigitalStopWatchPtr instance = malloc(sizeof *instance);\n    if(NULL !=\
    \ instance){\n        /* 指定初始状态。 */\n        transitionToStopped(&instance->state);\n\
    \        /* 在此处初始化其他属性... */\n    }\n    return instance;\n}\n\nvoid destroyWatch(DigitalStopWatchPtr\
    \ instance)\n{\n    free(instance);\n}\n```\n\n```c\n27\n28 void startWatch(DigitalStopWatchPtr\
    \ instance)\n29 {\n30     instance->state.start(&instance->state);\n31 }\n32 \n\
    33 void stopWatch(DigitalStopWatchPtr instance)\n34 {\n35     instance->state.stop(&instance->state);\n\
    36 }\n```\n\n## 调试辅助\n\n为了调试，可以扩展状态机包含实际状态名称的字符串：\n\n```c\n1 void transitionStopped(WatchStatePtr\
    \ state)\n2 {\n3     defaultImplementation(state);\n4     state->name = \"Stopped\"\
    ;\n5 }\n```\n\n利用这个扩展，就可以提供诊断信息。回到我们的 WatchState.c 实现，代码现在如下：\n\n```c\n1 static\
    \ void defaultStop(WatchStatePtr state)\n2 {\n3 /* ... */\n4 logUnsupportedEvent(\"\
    Stop\", state);\n5 }\n```\n\n## 扩展状态机\n\n状态模式优点之一是它封装了状态，使得状态易于扩展。\n\n- 添加新事件。支持新事件意味着扩展\
    \ WatchState 使用上述机制，在 WatchState.c 中添加了新的默认实现。意图支持它的状态。\n- 添加新状态。新的具体状态必须实现所有事件，唯一需要更改的现有代码是转换到新状态的状态。请注意状态模式保留了基于表的解决方案的优点：客户端代码即上下文保持不变。\n\
    \n## 无状态状态\n\n示例代码中的状态是无状态的，即 WatchState 结构体仅包含重入函数的指针。这是状态模式的一种特例 [Gamma 等]。“如果状态对象拥有实例变量，上下文就可以共享一个状态对象”。然而，在共享状态之前，我想指出\
    \ Joshua Kievsky 的建议，“最好在用户体验部署后添加状态共享代码，状态实例化代码是主要的瓶颈” [Kievsky]。\n\n在 C 语言中，可以通过在每个函数内部声明表示某个状态的静态变量来共享状态。由于变量具有永久存储，转换函数的签名改为返回指向特定状态变量的指针。\n\
    \n列表 8：无状态函数入口，Stateless.c\n\n```c\nWatchStatePtr transitionToStarted(void)\n\
    {\n    static WatchState startedState;\n    static int initialized = 0;\n\n  \
    \  if(!initialized)\n    {\n        defaultImplementation(&startedState);\n  \
    \      startedState.stop = stopWatch;\n        initialized = 1;\n    }\n\n   \
    \ return &startedState;\n}\n```\n\n客户端已从持有状态的变量改为持有指向共享状态变量的指针。此外，上下文必须定义一个回调函数，以便具体状态请求状态转换时调用。\n\
    \n列表 9：更改状态的客户端代码\n\n```c\nvoid change(DigitalStopWatchPtr instance,\nWatchStatePtr\
    \ newState)\n{\n    /* 提供了一个良好的控制位置，\n       跟踪消息（所有状态转换）都必须\n       通过这个函数）。\
    \ */\n    instance->state = newState;\n}\n```"
