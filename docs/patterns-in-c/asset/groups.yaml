    # The Open-Closed Principle


    Although mainly seen in the context of object oriented literature, the open-closed
    principle defines properties attractive in the context of C too. The principle
    is summarized as *Software entities (classes, modules, functions, etc.) should
    be open for extension, but closed for modification*[Martin].


    According to the open-closed principle, extending the behavior of an ideal module
    is achieved by adding code instead of changing the existing. Following this principle
    only minimizes the risk of introducing bugs in testing but also raises the quality
    of the design by introducing loose coupling. It is virtually impossible to design
    a module in such a way that it is closed against all kinds of changes. When ever
    trying to design software in such a way would overcomplicate the design far beyond
    practicality. Identifying the modules to close, and the changes to make against
    them, requires experience and a good understanding of the problem domain.


    In the example used in this chapter, it would be suitable to close the customer
    module against changes by Identifying a pattern that lets redress the code in
    this respect seems like an attractive idea.


    # STRATEGY


    The design pattern STRATEGY provides a way to follow and reap the benefits of
    the open-closed principle. Design Patterns [Gamma, et al] defines “Define a family
    of algorithms, encapsulate each one, and make them interchangeable. Strategy lets
    the algorithm vary independently from clients that use it”. Related to the discussion
    above, the price calculations in the different customer categories are that “family
    of algorithms”. By applying the price calculations, each one of them gets fully
    encapsulated rendering the STRATEGY pattern, each one of them gets


    | Customer | CustomerPriceStrategy |

    | :--- | :--- |

    | + placeOrder(Order): void | + calculatePrice(Order): double |


    ![](img/36484cd32ea2e3eb1b027e721e2669a9_27_0.png)


    | GoldPriceStrategy | SilverPriceStrategy | BronzePriceStrategy |

    | :--- | :--- | :--- |

    | + calculatePrice(Order): double | + calculatePrice(Order): double | + calculatePrice(Order):
    double |


    Illustration 1: The customer bonus system as a canonical STRATEGY.


    In the context, the Customer does not have any knowledge about the concrete categories
    anymore; the concrete strategy is typically assigned to the context by the application.
    All price calculations are delegated to the assigned strategy.


    Using this pattern, the interface for calculating price adheres to the open closed
    principle; it is possible to add or remove categories without modifying the existing
    calculation algorithms or the Customer'
- md: "\n# Implementation Mechanism\n\nWhen implementing the STRATEGY pattern in C,\
    \ without language support for polymorphism and inheritance, an alternative to\
    \ the object oriented features has to be found for the abstraction. This problem\
    \ is almost identical to the one faced when implementing the STATE pattern in\
    \ C, indicating that the same mechanism may be used, namely pointers to functions.\
    \ The possibility to specify to pointers proves to be an efficient technique for\
    \ implementing dynamic behavior.\n\nIn a C-implementation, the basic structure\
    \ in the diagram remains, but the interface is expressed as a declaration of a\
    \ pointer to function.\nListing 2: Strategy interface in CustomerStrategy.h\n\n\
    ```c\ntypedef double (*CustomerPriceStrategy)(double amount,\n               \
    \                             double shipping);\n```\n\nThe different strategies\
    \ are realized by following the signature specified by the interface. The privileges\
    \ of each customer category, the context vary, are encapsulated within their concrete\
    \ strategy. Depending on the complexity and the cohesion of the concrete strategies,\
    \ the source code may be organized as either one strategy per customer or by gathering\
    \ all supported strategies in a single compilation unit. For the strategies used\
    \ in this example, the latter approach has been chosen.\nListing 3: Interface\
    \ to the concrete categories in CustomerCategories.c\n\n```c\ndouble bronzePriceStrategy(double\
    \ amount, double shipping);\ndouble silverPriceStrategy(double amount, double\
    \ shipping);\ndouble goldPriceStrategy(double amount, double shipping);\n```\n\
    \nListing 4: Implementation of the concrete customer strategies in CustomerCategories.c\n\
    \n```c\n/* In production, all input should be validated and\nthe calculations\
    \ secured upon entry of each function. */\ndouble bronzePriceStrategy(double amount,\
    \ double shipping)\n{\n    return amount * 0.98 + shipping;\n}\n\ndouble silverPriceStrategy(double\
    \ amount, double shipping)\n{\n    return amount * 0.95 + shipping;\n}\ndouble\
    \ goldPriceStrategy(double amount, double shipping)\n{\n    /* Free shipping for\
    \ gold customers. */\n    return amount * 0.90;\n}\n```\n\nUsing the strategies,\
    \ the context code now delegates the calculation to the strategy associated with\
    \ the customer.\nListing 5: Delegation to a strategy, Customer.c\n\n```c\n#include\
    \ \"CustomerStrategy.h\"\n/* Other include files omitted... */\nstruct Customer\
    \ {\n    const char* name;\n    Address address;\n    List orders;\n    /* Bind\
    \ the strategy to Customer: */\n    CustomerStrategy priceStrategy;\n}\nvoid placeOrder(struct\
    \ Customer* customer, const Order* order) {\n    double totalAmount = customer->priceStrategy(order->shipping);\n\
    \    /* More code to process the order... */\n}\n```\n\nThe code above selects\
    \ the design algorithm. As the customer now only depends on the strategy interface,\
    \ categories can be added or removed without changing the code of the customer\
    \ and without the risk of introducing bugs into existing strategies. The remaining\
    \ open issue with the implementation is to specify how a certain strategy gets\
    \ bound to the customer.\n\n# Binding the Strategy\n\nThe strategy may be supplied\
    \ by the client of the customer and bound to the customer during its creation,\
    \ or an initial strategy may be chosen by the customer itself. The former alternative\
    \ is clearly more flexible as it avoids the need for the customer to depend upon\
    \ a concrete strategy. The code below illustrates this approach, using a customer\
    \ implemented as a FIRST-CLASS ADT.\nListing 6: Binding strategy upon creation,\
    \ Customer.c\n\n```c\nCustomerPtr createCustomer(const char* name,\n    const\
    \ Address* address,\n    CustomerPriceStrategy priceStrategy)\n{\n    CustomerPtr\
    \ customer = malloc(sizeof(*customer));\n    if(NULL != customer)\n    {\n   \
    \     /* Bind the initial strategy supplied by\n        the client. */\n     \
    \   customer->priceStrategy = priceStrategy;\n        /* Initialize the other\
    \ attributes of the\n        customer here. */\n    }\n    return customer;\n\
    }\n```\n\nListing 7: Client code specifying the binding\n\n# The STRATEGY Pattern\n\
    \n```c\n#include \"Customer.h\"\n#include \"CustomerCategories.h\"\nstatic CustomerPtr\
    \ createBronzeCustomer(const char* name, \n    const Address* address)\n{\n  \
    \  return createCustomer(name, address, bronzePriceStrategy);\n}\n```\n\nDepending\
    \ on the problem at hand, it can be re-bound to strategy. For example, as a customer\
    \ gets promoted to the silver category, customer should get associated with the\
    \ silverPriceStrategy. Using the technique of pointers to functions, a run-time\
    \ change of strategy implies pointing to another function.\n\nListing 8: Rebinding\
    \ strategy, Customer.c\n\n```c\nvoid createPriceCategory(CustomerPtr customer,\
    \ \n    CustomerStrategy newPriceStrategy)\n{\n    assert(NULL == customer);\n\
    \    customer->priceStrategy = newPriceStrategy;\n}\n```\n\nAnother alternative\
    \ is to avoid the binding and let the client pass different strategies to the\
    \ context in each function invocation. This alternative may be suitable in case\
    \ the context doesn't have any state memory. For example, this which uses first-class\
    \ objects, the opposite is true and the natural abstraction is to associate the\
    \ customer with a price-strategy as illustrated above.\n\n# Comparison of STRATEGY\
    \ AND STATE\n\nWhen discussing the STRATEGY pattern, its relationship with the\
    \ pattern preceding in the Design Patterns [Gama, et al] book deserves special\
    \ mention. The design patterns STATE and STRATEGY are closely related. Robert\
    \ C. Martin puts it this: \"all instances of the State pattern are also instances\
    \ of Strategy pattern, but not all instances of Strategy are State\" [Martin].\n\
    \nThis observation leads us to a remark by John Vlissides, co-author of Design\
    \ Patterns, that \"Let the intents of the pattern be guided to their differences\
    \ and not the classes that implement them\" [Vlissides]. Indeed, even though STATE\
    \ and STRATEGY have a similar structure, they differ in their intent.\n\nRelated\
    \ to the example above, had the categories been based on transitions, STATE would\
    \ have been a better choice. However, if the result is a membership of categories,\
    \ STRATEGY is a better abstraction. Although not to be taken a universal truth,\
    \ a further observation relates to the usage of these patterns: STATE tends to\
    \ be an internal concern of the context. Contrasting this with STRATEGY, the client\
    \ usually binds a strategy to its context.\n\n# Consequences\n\nThe main consequences\
    \ of applying the STRATEGY pattern are:\n\n- The benefits of the open-closed principle.\
    \ The design pattern STRATEGY offers great flexibility that it allows clients\
    \ to change and control the behavior of an existing module by implementing their\
    \ own, concrete strategies. Thus, however is supported by adding new code instead\
    \ of modifying code.\n- Reduces complexity, conditional logic. Complex interactions\
    \ may lead to monolithic modules littered with conditional logic, potentially\
    \ in the form of control coupling. Such code tends to be hard to maintain and\
    \ extend. By encapsulating each branch of the conditionals in a strategy, the\
    \ STRATEGY pattern eliminates conditional logic.\n- Allows different versions\
    \ of the same algorithm. The non-functional requirements on a module may vary\
    \ depending on its usage. The typical trade-off between speed versus memory usage\
    \ is classic. Using the Strategy pattern, the choice of trade-offs may be delegated\
    \ to the user (“Strategies can provide different implementations of the same behavior”)\
    \ (Gamma, et al.).\n- An extra level of indirection. The main issue with this\
    \ consequence arises as data from the context has to be obtained in a strategy.\
    \ As all functions used as strategies have to follow the same signature, simply\
    \ adding unrelated parameters lowers the cohesion. Implementing the context as\
    \ a FIRST-CLASS AD may solve this as it reduces the parameters to a single handle.\
    \ With the FIRST-CLASS ADT approach, the knowledge about the data of interest\
    \ is encapsulated within each strategy and obtained through the handle to the\
    \ FIRST-CLASS ADT. A careful design should strive to keep the module implemented\
    \ as a FIRST-CLASS ADT highly cohesive and avoid it decaying into a repository\
    \ of unrelated data needed by different strategies (such a design typically indicates\
    \ that the wrong abstraction has been chosen).\n\n# Example of use\n\nSTRATEGY\
    \ may prove useful for specifying policies in framework design. Using STRATEGY,\
    \ clients may parameter the implementation.\n\nFor example, error-handling is\
    \ typically delegated to the application. Such a design may be realized by letting\
    \ the client provide a strategy to be invoked upon an error. By those means, the\
    \ error may be handled in an application specific manner, which may stretch between\
    \ simply ignoring the error to logging it or even reboot the system.\n"
  mdcn: "\n\n# 实现机制\n\n在 C 语言中实现 STRATEGY 模式时，由于缺乏对多态和继承的支持，必须找到一种面向对象特征的替代方案来实现抽象。这个问题与在\
    \ C 中实现 STATE 模式时面临的问题几乎相同，这表明可以使用相同的机制，即函数指针。通过指针指定具体的操作被证明是实现动态行为的一种高效技术。\n\n\
    在 C 语言实现中，图中的基本结构仍然保留，但接口被表示为函数指针的声明。\n列表 2：CustomerStrategy.h 中的策略接口\n\n```c\n\
    typedef double (*CustomerPriceStrategy)(double amount,\n                     \
    \                       double shipping);\n```\n\n不同的策略通过遵循接口指定的签名来实现。每个客户类别的权限（即上下文）各异，这些差异被封装在各自具体的策略中。根据具体策略的复杂性和内聚性，源代码可以组织为每个客户一个策略，也可以将所有支持的策略聚集在一个单一编译单元中。对于本示例中使用的策略，选择了后者方法。\n\
    列表 3：CustomerCategories.c 中指向具体类别的接口\n\n```c\ndouble bronzePriceStrategy(double\
    \ amount, double shipping);\ndouble silverPriceStrategy(double amount, double\
    \ shipping);\ndouble goldPriceStrategy(double amount, double shipping);\n```\n\
    \n列表 4：CustomerCategories.c 中具体客户策略的实现\n\n```c\n/* 在生产环境中，所有输入都应该在进入每个函数时\n进行验证，并确保计算的安全。\
    \ */\ndouble bronzePriceStrategy(double amount, double shipping)\n{\n    return\
    \ amount * 0.98 + shipping;\n}\n\ndouble silverPriceStrategy(double amount, double\
    \ shipping)\n{\n    return amount * 0.95 + shipping;\n}\ndouble goldPriceStrategy(double\
    \ amount, double shipping)\n{\n    /* 黄金客户免运费。 */\n    return amount * 0.90;\n\
    }\n```\n\n使用这些策略，上下文代码现在将计算委托给与客户相关的策略。\n列表 5：委托给策略，Customer.c\n\n```c\n#include\
    \ \"CustomerStrategy.h\"\n/* 省略其他包含文件... */\nstruct Customer {\n    const char*\
    \ name;\n    Address address;\n    List orders;\n    /* 将策略绑定到 Customer: */\n\
    \    CustomerStrategy priceStrategy;\n}\nvoid placeOrder(struct Customer* customer,\
    \ const Order* order) {\n    double totalAmount = customer->priceStrategy(order->shipping);\n\
    \    /* 更多处理订单的代码... */\n}\n```\n\n上述代码选择了设计算法。由于客户现在只依赖于策略接口，可以添加或删除类别，而无需更改客户代码，且不会有向现有策略中引入\
    \ Bug 的风险。实现中剩余的开放问题是指定如何将特定策略绑定到客户。\n\n# 绑定策略\n\n策略可以由客户的客户端提供并在创建客户期间绑定到客户，或者由客户本身选择一个初始策略。前者的方案显然更灵活，因为它避免了客户依赖于具体策略。以下代码说明了这种方法，使用了作为一类抽象数据类型（FIRST-CLASS\
    \ ADT）实现的客户。\n列表 6：创建时绑定策略，Customer.c\n\n```c\nCustomerPtr createCustomer(const\
    \ char* name,\n    const Address* address,\n    CustomerPriceStrategy priceStrategy)\n\
    {\n    CustomerPtr customer = malloc(sizeof(*customer));\n    if(NULL != customer)\n\
    \    {\n        /* 绑定客户端提供的\n        初始策略。 */\n        customer->priceStrategy\
    \ = priceStrategy;\n        /* 在这里初始化\n        客户的其他属性。 */\n    }\n    return\
    \ customer;\n}\n```\n\n列表 7：指定绑定的客户端代码\n\n# STRATEGY 模式\n\n```c\n#include \"Customer.h\"\
    \n#include \"CustomerCategories.h\"\nstatic CustomerPtr createBronzeCustomer(const\
    \ char* name, \n    const Address* address)\n{\n    return createCustomer(name,\
    \ address, bronzePriceStrategy);\n}\n```\n\n根据当前的问题，它可以被重新绑定到策略。例如，当客户升级为银牌级时，客户应该与\
    \ silverPriceStrategy 关联。使用函数指针技术，运行策略策略意味着指向另一个函数。\n\n列表 8：重新绑定策略，Customer.c\n\
    \n```c\nvoid createPriceCategory(CustomerPtr customer, \n    CustomerStrategy\
    \ newPriceStrategy)\n{\n    assert(NULL == customer);\n    customer->priceStrategy\
    \ = newPriceStrategy;\n}\n```\n\n另一种方案是避免绑定，让客户端在每次函数调用时将不同的策略传递给上下文。如果上下文没有任何状态内存，这种替代方案可能适用。例如，在这个使用了一类对象的例子中，情况恰恰相反，自然的抽象是如上所示将客户与价格策略关联。\n\
    \n# STRATEGY 与 STATE 的比较\n\n在讨论 STRATEGY 模式时，它与《设计模式》[Gama, et al] 书中前一个模式的关系值得特别提及。STATE\
    \ 和 STRATEGY 设计模式密切相关。Robert C. Martin 这样说道：“State 模式的所有实例都是 Strategy 模式的实例，但并非所有\
    \ Strategy 模式的实例都是 State 模式实例” [Martin]。\n\n这一观察让我们想起了《设计模式》合作者 John Vlissides\
    \ 的一段话：“让模式的意图来引导它们的差异，而不是实现它们的类” [Vlissides]。事实上，尽管 STATE 和 STRATEGY 具有相似的结构，但它们的意图是不同的。\n\
    \n与上述示例有关，如果类别是基于转换的，那么 STATE 将是更好的选择。然而，如果结果是类别的成员身份，STRATEGY 是一个更好的抽象。虽然这不能被视为普遍真理，但另一个观察涉及到这些模式的用法：STATE\
    \ 倾向于是上下文的内部关注。与 STRATEGY 相比，客户端通常将策略绑定到其上下文。\n\n# 后果\n\n应用 STRATEGY 模式的主要后果是：\n\
    \n- 开闭原则原则的好处。STRATEGY 设计模式提供了极大的灵活性，允许客户端通过实现他们自己的具体策略来更改和控制现有模块的行为。因此，通过添加新代码而不是修改代码来支持功能。\n\
    - 减少复杂性和条件逻辑。复杂的交互可能导致充斥着条件逻辑单体模块，可能以控制耦合的形式存在。此类代码往往难以维护和扩展。通过将条件分支的每个分支封装在策略中，STRATEGY\
    \ 模式消除了条件逻辑。\n- 允许相同算法的不同版本。模块的非功能性需求可能根据其用法而异。速度与内存使用之间的典型权衡是经典的。使用 Strategy\
    \ 模式，权衡的选择可以委托给用户（策略可以提供相同行为的不同实现）(Gamma, et al.)。\n- 额外的间接层。这种后果产生的主要问题是，策略需要从上下获取数据。由于所有作为策略的函数必须遵循相同的签名，简单地添加参数会降低内聚性。将上下文实现为一类数据类型（ADT）可能会解决这个问题，因为它将参数减少到单个句柄。通过一类\
    \ ADT 方法，关于感兴趣的数据的知识封装在每个策略中，并通过对一类 ADT 的句柄获取。仔细的设计应努力保持实现为一类 ADT 的模块具有高内聚性，避免其退化为不同策略所需的无关数据的仓库（这种设计通常表明选择了错误的抽象）。\n\
    \n# 使用示例\n\nSTRATEGY 在框架设计中指定策略时可能非常有用。使用 STRATEGY，客户端可以参数化实现。\n\n例如，错误处理通常委托给应用程序。这种设计可以通过让客户端提供一个在发生错误时调用的策略来实现。通过这种方式，可以以应用程序特定的方式处理错误，其范围从简单的忽略错误到记录日志甚至重启系统。\n\
    \n"
