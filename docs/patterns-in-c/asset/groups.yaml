    Even in this strongly simplified example, there are several potential problems.
    By intertwining the application logic with the networking and the code for event
    dispatching, several unrelated responsibilities have been built into one module.
    A such design is likely to lead to serious maintenance, testability, and scalability
    problems by violating a fundamental design principle.


    Illustration 1: An eternal loop to scan for events.

