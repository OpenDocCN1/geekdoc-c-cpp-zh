    # The OBSERVER Pattern


    # Reflections on OBSERVER


    As I wrote the original patterns articles I based the implementations on actual
    experience from several production code. Over the previous years I had collected
    notes and sample implementations of several well-known patterns. My initial plan
    was to publish five articles, starting with the more general patterns first. That
    left me in the position where I had to choose and prioritize between the patterns.
    The first three (First-Class ADT, STATE and STRATEGY) were all given. And I knew
    wanted to finish with a discussion of the REACTOR pattern. Clearly, some patterns
    had to


    I finally selected OBSERVER. In retrospect, other patterns would probably have
    made a better candidate. The FACADE (Gamma, et al), for example, is straightforward
    and natural in C. In the end I went with the OBSERVER for reasons: preparation
    and generality.


    First, the implementation mechanisms I used in the OBSERVER are similar to the
    ones I tend to use for the REACTOR. As, the OBSERVER implementation could serve
    as a gentle introduction to the more complex architectural REACTOR pattern.


    Second, event notification is a part of many applications. Decoupling the sender
    and receiver of a event notification is central. Today, many programming languages
    have come to include native support for OBSERVER. Cs, for example, provides a
    general version with its events mechanism. And of course Common Lisp has it through
    the before and after methods that make OBSERVER implementations both trivial and
    expressive. In C, we have to go through more challenges to arrive at an implementation
    that fits. Done right, observers can still be a viable solution.


