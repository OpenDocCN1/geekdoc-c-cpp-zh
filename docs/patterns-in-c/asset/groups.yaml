    The REACTOR Pattern


    this relationship is one to one – a detected event leads the Reactor to notify
    exactly one dependent (EventHandler).


    One typical of the OBSERVER pattern is that the cohesion of the subject is lowered;
    besides serving its central purpose, a subject also takes on the responsibility
    of managing and notifying observers. With this respect, a Reactor differs significantly
    as its raison d''être is to dispatch events to its registered handlers.


    ## Consequences


    The main consequences of applying the single-responsibility pattern are:


    - 1. The benefits of the single-responsibility principle. Using the REACTOR pattern,
    each of the responsibilities is encapsulated and decoupled from each other. The
    design results in increased cohesion, which simplifies maintenance and minimizes
    the risk of feature interaction. The platform dependent code for event detection
    is decoupled from the application logic, unit testing is greatly simplified (it
    is straightforward to simulate events through the EventHandler interface).

    - 2. The benefits of the open-closed principle. New responsibilities, in the form
    of new event handlers, may be added without affecting the existing handlers.

    - 3. Unified mechanism for event handling. Even if the REACTOR pattern is centered
    on handles, it may be extended for other tasks. Pattern-Oriented Software Architecture
    [Schmidt et al] describes different strategies for integrating the multiplexer
    of 1/O with event handlers. The Reactor with timer threads is an alternative to
    typical simple software based on signals or threads. This extension adds the possibility
    to specify a timeout value specified with milliseconds. Although it will not suit
    a hard real-time system, a Reactor based timer mechanism is easier to implement
    and use a signal or thread-based solution as it to avoid re-entrance problems
    and race-conditions.

    - 4. Provides an alternative to multithreading. Using the REACTOR pattern, blocking
    operations in the event handlers are avoided and consequently also multithreading.
    As discussed, a multithreaded solution adds only significant complexity; it may
    also prove to be efficient in terms of run-time performance. However, the Reactor
    implies a pre-emptive multithasking model, each event handler must ensure that
    it does not perform operations that starve out other event handlers.

    - 5. Trades type-safety for flexibility. All event handlers are abstracted as
    "void". When converting a void-pointer to a pointer of a event handler type, the
    compiler doesn''t have any to detect an error conversion. This problem was faced
    in the implementation of the OBSERVER pattern and the solution is the same for
    the REACTOR: define unique notification functions for each different type of event
    handler and bind the functions and event handler together using an EventHandler
    structure as seen in Listing 1.


    ## Summary


    The REACTOR pattern simplifies event-driven applications by decoupling the different
    responsibilities. The responsibilities are now encapsulated in separate modules.


    There is much more to the REACTOR pattern described in this one. Particularly
    several variations that all come with different benefits and trade-offs. For an
    excellent in-depth treatment of the REACTOR and other patterns in the domain,
    I recommend the book Pattern-Oriented Software Architecture, volume 2 [Schmidt
    et al].


    ## Idiomatic Expressions


    ## Reflections on the Idioms


    After I finished the original patterns series I took some time off on a winter
    vacation to document some of the idioms I had applied in the implementations of
    the patterns. This was a response to some direct questions from my readers why
    I used certain code constructs or preferred a sensible style. These idioms that
    I had picked up over the years. By either reading other people or sometimes through
    discussions in the comp.lang.c frequent I encountered. Often, a change in style
    come about after I made a mistake. The idioms I applied were the results of a
    learning process. A painful bug due to an unintended assignment led me to adapt
    CONSTANTS TO THE LEFT. My experiences with maintaining a large legacy code base
    taught me to appreciate NAMED PARAMETERS AND MAGIC NUMBERS


    Patterns exist at all levels of scale in our designs. At their lowest level they
    are referred to as idioms. Idioms depend upon the implementation technology. Sometimes
    we find that the idioms we use in one language isn''t applicable in a higher-level
    language. It may be that the problem it intends to prevent is present in the new
    language. INITIALIZE COMPOUND TYPES WITH {} is such an example; many languages
    provide sensible defaults initialization for variables. CONSTANTS TO THE LEFT
    is a non-issue in functional programming languages with immutability as a guiding
    principle. It might also be the case that language has first-class support for
    the idea behind the idiom. NAMED PARAMETERS is one such example. It is supported
    naturally by languages such as Python and modern versions of C#. But these higher-level
    languages grow their own idioms too. One challenge of learning a new language
    is to get accustomed with its idiomatic.


    The intention of this chapter is to capture some of the idioms. The idioms presented
    here are of two, overlapping categories:


    - Idioms for robustness: The idioms in this category avoid common pitfalls in
    the C language. For example, INITIALIZE COMPOUND TYPES WITH {} provides a tight
    and portable way to initialize structs and arrays.

    - Idioms for expressiveness: Writing code that communicates its intent well goes
    in hand with robustness; making the code easy to understand simplifies maintenance
    and thereby contributes to the long-term robustness of the program. For example,
    ASSERTION CONTEXT makes assertions self-descriptive.


    ## Idiomatic Expressions in C


    ## The Evolution of Idioms


    As a language evolves, different patterns arise. The idioms presented here are
    of two, overlapping categories:


    ## Idiom Description


    Because of their relative simplicity, devoting a chapter to single one of idioms
    would be complicated.


    ## SIZEOF TO VARIABLES


    ## Problem Context


    In the C language, generality is usually spelled void*. This is reflected in the
    standard library. For example, the functions for dynamic memory allocation (malloc,
    calloc, and realloc) return pointers to void* and do not know anything about the
    types we are allocating for. The client has to provide the required size information
    to the allocation functions. Here is an example with malloc:


    ```c

    HelloTelegram telegram = malloc(sizeof(HelloTelegram));

    ```


    Code like this is sneaky to maintain. As long as the telegram stays as a HelloTelegram
    everything is fine. The sneakiness in the fact that malloc usage above contains
    a certain subset of dependency; the size given must match the type on the left
    side of the assignment. Consider a change in telegram type to a GoodTelegram.
    With the code above means a change in two places, which is at least one change
    too much:


    ```c

    /* We change the type on both sides of the assignment! */

    GoodTelegram telegram = malloc(sizeof(GoodTelegram));

    ```


    A failure to update both may have fatal consequences, potentially leaving the
    code with undefined behavior.


    ## Applying the Idiom


    ```c

    HelloTelegram telegram = malloc(sizeof(telegram));

    ```

