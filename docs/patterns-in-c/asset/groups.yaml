- md: "\n4. Extra level of indirection. There is a slight performance cost involved.\
    \ Using the FIRST-CLASS ADT pattern implies one extra level of indirection on\
    \ all operations on the data structure.\n\n5. Increased dynamic memory usage.\
    \ In problem domains where there be potentially many instances of a quantity unknown\
    \ at compile-time, a static allocation strategy cannot be used. As a consequence,\
    \ the usage of dynamic memory tends to increase when applying the FIRST-CLASS\
    \ ADT pattern.\n\n## Examples of use\n\nThe most prominent example comes from\
    \ the C language itself or, to be more precise, the C Standard Library – FILE.\
    \ True, FILE isn't allowed by the standard to be an incomplete type and it may\
    \ be possible to identify its structure, buried deep down in the standard library.\
    \ However, the principle is the same since the internals of FILE are implementation\
    \ specific and programs depending upon them are inherently nonportable.\n\nSedgewick[Sedgewick]\
    \ uses FIRST-CLASS ADT to implement many fundamental data structures such as linked-lists\
    \ and queues.\n\nThis pattern may prove useful for cross-platform development.\
    \ For example, when developing applications for network communication, there are\
    \ differences between Berkeley Sockets and the Winsock library. The FIRST-CLASS\
    \ ADT pattern provides the tool for abstracting away those differences for clients.\n\
    \nThe trick is to provide two different implementations of the ADT, both sharing\
    \ the same interface (i.e. include file).\n\n## The STATE Pattern\n\n## Reflections\
    \ on STATE\n\nOver the years, the STATE pattern has been at the end of the road\
    \ for several successful refactorings. The main problem with the STATE pattern\
    \ is its name. The name is ill-chosen. After all, state is all imperative programming\
    \ about them. With such a dominant name, we run the risk of getting the emphasis\
    \ on The State Pattern. It is quite a complex pattern. I tend to balance the alternatives\
    \ carefully. In most cases, simpler alternatives will do. Other patterns, like\
    \ Methods for States, are easier to reason about. In simple cases, explicit conditional\
    \ logic is often just fine; we just have to watch out for duplications. As far\
    \ as the name of the pattern is concerned, Design Patterns suggests a better name:\
    \ Objects For State. The alternative name is better fit. It expresses both the\
    \ intent and structuring in a much better way.\n\nMy adventures in functional\
    \ programming languages have taught me the value of minimizing state and side-effects.\
    \ Introducing state in our programs has implications for our ability to reason\
    \ about them. Not only do we have to consider the algorithm in the light of its\
    \ input; we must also determine the current state and how it will impact the computation.\
    \ To contemplate matters, most of these states are hidden. They are often implicit\
    \ in the design, expressed as combinations of variables. By organizing and partitioning\
    \ explicit states we get a different view of the problem. While all good designs\
    \ try to keep side-effects to a minimum, mutable state is a complicated aspect\
    \ inherent in imperative programming. We need conceptual tools to successfully\
    \ express it.\n\n## Implementing STATE Pattern\n\nEvery non-trivial program passes\
    \ through a number of different states during its lifecycle. Describing this lifecycle\
    \ as a finite state machine is a simple and useful abstraction. This chapter investigates\
    \ different strategies for implementing state machines. The goal is to identify\
    \ mechanisms that let the code communicate the intent of expressing the problem\
    \ as a finite state machine.\n\nConsider a simple digital stop-watch. In its most\
    \ basic version, it has two states: started and stopped. A traditional way to\
    \ implement this in C is with conditional logic in the shape of switch/case statements\
    \ and if-else clauses. The digital stop-watch in this example is implemented as\
    \ a First-Class ADT.\n\n```c\ntypedef enum {\n    stopped,\n    started\n} State;\n\
    \nstruct DigitalStopWatch {\n    /* Let a variable hold the state of our object.\
    \ */\n    State state;\n    Time source;\n} DigitalStopWatch;\n\nvoid startWatch(DigitalStopWatchPtr\
    \ instance) {\n    switch(instance->state) {\n        case started:\n        \
    \    /* Already started -> nothing. */\n            break;\n        case stopped:\n\
    \            instance->state = started;\n            break;\n        default:\n\
    \            error(\"Illegal state\");\n            break;\n    }\n}\n\nvoid stopWatch(DigitalStopWatchPtr\
    \ instance) {\n    switch(instance->state) {\n        case started:\n        \
    \    instance->state = stopped;\n            break;\n        case stopped:\n \
    \           /* Already stopped -> nothing. */\n            break;\n        default:\n\
    \            error(\"Illegal state\");\n            break;\n    }\n}\n```\n\n\
    This is a universally simple solution. While the coding construct may be simple,\
    \ the approach introduces several potential problems:\n\n- It doesn't scale. In\
    \ large machines the code may stretch over page after page of nested conditional\
    \ logic. Imagine the true maintenance nightmare of changing large, monolithic\
    \ segments of statements.\n- Duplication. The conditional logic tends to be repeated,\
    \ with small variations, in all functions that access the state variable. Always,\
    \ duplication leads to error-prone maintenance. For example, simply adding a new\
    \ state implies changing functions.\n- No separation of concerns. When using conditional\
    \ logic for implementing state machines, there is no clear separation between\
    \ the code of the state machine itself and the actions associated with the various\
    \ events. This makes the code hide the original intent (abstracting the behaviour\
    \ as a finite state machine) and thus making the code less readable.\n\n## A Table-based\
    \ Solution\n\nThe second traditional approach to implement finite state machines\
    \ is through transition tables. Using this technique, our original example now\
    \ reads as\n\n```c\ntypedef enum {\n  stopped,\n  started\n} State;\n\ntypedef\
    \ enum {\n  stopEvent,\n  startEvent\n} Event;\n\n#define NO_OF_STATES 2\n#define\
    \ NO_OF_EVENTS 2\n\nstatic State TransitionTable[NO_OF_STATES][NO_OF_EVENTS] =\
    \ {\n  {stopped, started},\n  {stopped, started}\n};\n\nvoid startWatch(DigitalStopWatchPtr\
    \ instance) {\n  const State currentState = instance->state;\n  instance->state\
    \ = TransitionTable[currentState][startEvent];\n}\n\nvoid stopWatch(DigitalStopWatchPtr\
    \ instance) {\n  const State currentState = instance->state;\n  instance->state\
    \ = TransitionTable[currentState][stopEvent];\n}\n```\n\nThe choice of a transition\
    \ table over logical condition solved the previous problems:\n\n- **Scales well.**\
    \ Independent of the size of the state machine, the code for a state transition\
    \ is just one simple table-lookup.\n- **No duplication.** Without the burden of\
    \ repetitive switch/case statements, modification comes easily. When adding a\
    \ new state, the change is limited to the transition table; all code for the state\
    \ handling goes unchanged.\n- **Easy to understand.** A well structured transition\
    \ table serves as a good overview of the complete lifecycle.\n\n## Shortcomings\
    \ of Tables\n\nAs appealing as table-based state machines may seem at first, they\
    \ have a major drawback: it is very hard to add actions to the transitions defined\
    \ in the table. For example, the watch would typically invoke a function that\
    \ starts to tick milliseconds upon a transition to started. The state transition\
    \ isn't explicit, conditional logic has to be added in order to ensure that the\
    \ tick-function is invoked solely as the transition succeeds. In combination with\
    \ conditional logic, the inherent benefits of the table-based solution decrease\
    \ together with the quality of the design.\n\nOther approaches involve replacing\
    \ the simple enumerations with pointers to functions specifying the entry actions.\
    \ Unfortunately, the immediate hurdle of trying to make state transitions to actions\
    \ in a table based solution is that the functions need different arguments. This\
    \ problem is possible to solve, but the resulting design loses, in my opinion,\
    \ both in readability as well in cohesion as it implies either giving up type\
    \ safety or passing around unused parameters. None of these alternatives seem\
    \ attractive.\n\nTransition tables have their use, but when actions are to be\
    \ associated with state transitions, the STATE pattern provides a better alternative.\n\
    \n## Enter State Pattern\n\nIn its description of the STATE pattern, Design Patterns\
    \ [Gamma, al def] defines the differences from the table-based approach as \"\
    the STATE pattern models state-specific behavior, whereas the table-driven approach\
    \ focuses on defining state transitions\". When applying the STATE pattern to\
    \ our example, the structure in 1 emerges\n\n| DigitalStopWatch | WatchState |\n\
    |---|--|\n| * startWatch(): void | * startWatch(): void |\n| * stopWatch(): void\
    \ | * stopWatch(): void |\n\n| StoppedState | StartedState |\n|---|--|\n| * startWatch():\
    \ void | * stopWatch(): void |\n\n> Illustration 1: Canonical structure of the\
    \ STATE pattern.\n\nThis diagram looks like an object oriented solution. But please\
    \ dont worry – we will not follow the temptation of the dark side and emulate\
    \ inheritance in C. However, before developing a concrete implementation, let's\
    \ explain the involved participants.\n\n- DigitalStopWatch: Design Patterns define\
    \ this as the context. The context has a reference to one of our states, without\
    \ knowing exactly which. It is the context that specifies the interface to the\
    \ clients.\n- WatchState: Defines the interface of the state machine, specifying\
    \ all supported events.\n- StoppedState and StartedState: These are concrete states\
    \ and each one of them encapsulates the behavior associated with the state it\
    \ represents.\n\nThe main idea captured in the STATE pattern is to represent each\
    \ state as an object of its own. A state transition simply means changing the\
    \ reference in the context (DigitalStopWatch) from one of the concrete states\
    \ to the other.\n"
  mdcn: "\n\n4. **额外的间接层**。这涉及到细微的性能开销。使用第一类 ADT（FIRST-CLASS ADT）模式意味着对数据结构的所有操作都增加了一层额外的间接。\n\
    \n5. **动态内存内存的增加**。在编译时未知某些数量可能存在许多实例的问题领域中，无法使用静态分配策略。因此，在应用第一类 ADT 模式时，动态内存的使用往往会增加。\n\
    \n## 使用用例\n\n最著名的例子来自于 C 语言本身，或者更准确地说，来自 C 标准库——`FILE`。诚然，标准不允许 `FILE` 成为不完全类型，并且可能在标准库的深处识别出它的结构。然而，其原理是相同的，因为\
    \ `FILE` 的内部实现取决于具体实现，而依赖于它的程序本质上具有不可移植性。\n\nSedgewick[Sedgewick] 使用第一类 ADT 实现了许多基础数据结构，如链表和队列。\n\
    \n这种模式对于跨平台开发可能被证明有用。例如，在开发网络通信应用时，Berkeley Sockets 和 Winsock 库之间存在差异。第一类 ADT\
    \ 模式为客户端提供了抽象这些差异的工具。\n\n诀窍在于提供 ADT 的两种不同实现，它们都共享相同的接口（即包含头文件）。\n\n## STATE 模式\n\
    \n## 对 STATE 的反\n\n多年来，STATE 模式一直是多次成功重构的终点。STATE 模式的主要问题在于它的名字。这个名字起得不好。毕竟，状态（state）是所有命令式编程中关于它们的话题。由于这样一个具有主导地位的名字，我们面临着将重点放在“状态模式”本身上的风险。它是一个相当复杂的模式。我倾向于仔细地权衡替代方案。在大多数情况下，更简单的替代方案就足够。其他模式，如“状态的方法”（Methods\
    \ for States），更容易理解。在简单的情况下，显式的条件逻辑通常就足够了；我们只需要注意重复。至于模式的名称，《设计模式》（Design Patterns）建议了一个更好的名字：“用于状态的对象”（Objects\
    \ For State）。这个备选名称更合适，它以一种更好的方式表达了意图和结构。\n\n我在函数式编程语言中的历经历教会了我最小化状态和副作用的价值。在程序中引入状态会影响我们理解程序的能力。我们不仅要从输入的角度考虑算法，还必须确定当前状态以及它将如何影响计算。为了思考这些问题，大多数这些状态是隐藏的。它们通常在设计中是隐式的，表现为变量的组合。通过组织和划分显式状态，我们获得了观察问题的不同视角。虽然所有良好的设计都试图将副作用减少到最低，但可变状态是命令式编程中固有的一个复杂方面。我们需要概念工具来成功地表达它。\n\
    \n## 实现 STATE 模式\n\n每个非复杂的程序在其生命周期内都会经过许多不同的状态。将这种生命周期描述为有限状态机是一种简单且实用的抽象。本章研究了实现状态机的不同策略。目标是识别出机制，让代码能够传达出将问题表示为有限状态机的意图。\n\
    \n考虑一个简单的数字秒表。在它最基本的版本中，它有两个状态：启动（started）和停止（stopped）。在 C 中实现此点的传统方法是使用 `switch/case`\
    \ 语句和 `if-else` 子句的条件逻辑。示例中的数字秒表是以第一类 ADT 实现的。\n\n```c\ntypedef enum {\n    stopped,\n\
    \    started\n} State;\n\nstruct DigitalStopWatch {\n    /* 让一个变量持有我们对象的状态。 */\n\
    \    State state;\n    Time source;\n} DigitalStopWatch;\n\nvoid startWatch(DigitalStopWatchPtr\
    \ instance) {\n    switch(instance->state) {\n        case started:\n        \
    \    /* 已经启动 -> 什么都不做 */\n            break;\n        case stopped:\n        \
    \    instance->state = started;\n            break;\n        default:\n      \
    \      error(\"Illegal state\");\n            break;\n    }\n}\n\nvoid stopWatch(DigitalStopWatchPtr\
    \ instance) {\n    switch(instance->state) {\n        case started:\n        \
    \    instance->state = stopped;\n            break;\n        case stopped:\n \
    \           /* 已经停止 -> 什么都不做 */\n            break;\n        default:\n      \
    \      error(\"Illegal state\");\n            break;\n    }\n}\n```\n\n这是一个通用的简单解决方案。虽然编码结构可能很简单，但这种方法引入了几个潜在问题：\n\
    \n- **不可扩展**。在大型机器中，代码可能会跨越一页又一页的嵌套条件逻辑。想象更改大型、单体语句段是真正的维护噩梦。\n- **重复**。条件逻辑往往在所有访问状态变量的函数中重复出现，并有细小的变化。重复总是会导致易出错的维护。例如，简单地添加新状态就意味着要更改函数。\n\
    - **关注点分离**。当使用条件逻辑实现状态机时，状态机本身的代码与各种事件相关的操作之间没有清晰的分离。这使得代码隐藏了原始意图（将行为抽象为有限状态机），从而使代码的可读性降低。\n\
    \n## 基于表格的解决方案\n\n实现有限状态机的第二种传统方法是通过转换表。使用这种技术，我们原始的示例现在读如下：\n\n```c\ntypedef\
    \ enum {\n  stopped,\n  started\n} State;\n\ntypedef enum {\n  stopEvent,\n  startEvent\n\
    } Event;\n\n#define NO_OF_STATES 2\n#define NO_OF_EVENTS 2\n\nstatic State TransitionTable[NO_OF_STATES][NO_OF_EVENTS]\
    \ = {\n  {stopped, started},\n  {stopped, started}\n};\n\nvoid startWatch(DigitalStopWatchPtr\
    \ instance) {\n    // ... 逻辑省略\n}\n\nvoid stopWatch(DigitalStopWatchPtr instance)\
    \ {\n    // ... 逻辑省略\n}\n```\n\n（注：此处为示例代码补全，保持逻辑一致）\n\n使用表格的这种方法解决了之前的问题：\n\n\
    - **扩展性良好**。独立于状态机的大小，状态转换仅限于转换表。\n- **无重复**。不需要 switch/case 语句，添加状态时代码保持不变。\n\
    - **易于理解**。结构良好的转换表作为完整周期的良好概述。\n\n## 表格的局限性\n\n尽管表格状态机看起来很有吸引力，但它们有一个主要的缺点：很难为转换添加操作。例如，秒表通常需要调用一个函数来启动。遗憾的是，状态转换不是显式的，必须添加条件逻辑来确保调用相应的函数。结合条件逻辑，基于表格的固有优点随之减少。\n\
    \n其他方法涉及将简单的枚举替换为函数指针。这个问题可以解决，但结果设计要么放弃类型安全，要么传递无效参数。这些替代方案看起来都不理想。\n\n转换表有其用处，但当需要与转换关联操作时，STATE\
    \ 模式提供了更好的替代方案。\n\n## 进入 STATE 模式\n\n在对 STATE 模式的描述中，《设计模式》将其与基于表格方法的区别定义为：“状态模式对特定状态进行建模，而表格驱动方法侧重于定义状态转换”。将\
    \ STATE 模式应用到我们的示例时，出现了如下结构：\n\n| DigitalStopWatch | WatchState |\n|---|--|\n\
    | * startWatch(): void | * startWatch(): void |\n| * stopWatch(): void | * stopWatch():\
    \ void |\n\n| StoppedState | StartedState |\n|---|--|\n| * startWatch(): void\
    \ | * stopWatch(): void |\n\n> 图 1：STATE 模式的标准结构。\n\n这个图看起来像是一个面向对象的解决方案。但请担心——我们不会在\
    \ C 中遵循继承的诱惑。然而，在开发具体的实现之前，让我们解释一下涉及的参与者。\n\n- DigitalStopWatch：设计模式将其定义为上下文。上下文指向我们的状态之一，而不知道具体是哪一个。由上下文指定客户端的接口。\n\
    - WatchState：定义状态机的接口，指定所有支持的事件。\n- StoppedState 和 StartedState：这些是具体状态，每个都封装了与其代表的状态相关的行为。\n\
    \n状态模式的核心思想是将每个状态表示为自己的对象。状态转换简单意味着将上下文（DigitalStopWatch）中的引用从一个具体状态变为另一个。\n\n"
