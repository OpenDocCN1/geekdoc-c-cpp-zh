    Like other pattern, it is one to use with care and good taste. I wouldn''t design
    all my modules as First-Class ADT. Rather, I often find the pattern useful when
    enforcing boundaries between different layers in an application. The First-Class
    ADT may serve as a technical firewall between different development teams, allowing
    one of them to publish an interface while hiding the implementation details. Such
    a design encourages work on different, related, parts to proceed in parallel.


    # Implementing the First-Class ADT Pattern


    Our journey through the patterns will start with a language level pattern that
    decouples interface from implementation, improving encapsulation and reducing
    dependencies for many of the sub-patterns in this book.


    This pattern will lay the foundation


    # FIRST-CLASS ADT Pattern


    It''s getting close to the project deadline as the project manager rushes into
    the office. "They found some problem with your with a stressed voice. "According
    to the test-team, you cannot register more than 42 orders for a given customer.
    Sounds strange, doesn''t it?


    Darn. You know it. They hardened limits. "I''ll have a look at it," you reply
    in a soft voice. "Fine, I expect the problem to be solved tomorrow," the manager
    mumbles as he leaves office.


    "No problem," you reply, confident that the design of the customer routines are
    highly modular and clearly implemented (after all, you''ve implemented it yourself).


