    Idiomatic Expressions


    # Idiom Description Form


    Because of their relative simplicity, devoting a chapter using a full-blown pattern
    form to a single one of these idioms would be complicated it. On the other hand,
    simply listing the idioms would overemphasize the solution aspect. Therefore,
    each idiom will be introduced with a code sketch that illustrates a certain problem
    context, where the idiom is applied to the code in order to solve the problem.
    This before-after also identifies certain code constructs as candidates for refactoring
    towards the idiomatic construct.


    The idioms presented here are of two, overlapping categories:


    +   - Idioms for robustness: The idioms in this category avoid around common pitfalls
    in the C language. For example, the idiom INITIALIZE COMPOUND TYPES WITH [] provides
    a tight and portable way to initialize structs and arrays.

    - Idioms for expressiveness: Writing code that communicates its intent well goes
    in hand with robustness; making the code easy to understand simplifies maintenance
    and thereby contributes to the long-term robustness of the program. For example,
    the idiom ASSERTION CONTEXT makes assertions self-descriptive.


    # SIZEOF TO VARIABLES


    # Problem Context


    In the C language, generality is usually spelled void*. This is reflected in the
    standard library. For example, the functions for dynamic memory allocation (malloc,
    calloc, and realloc) return pointers to allocate void* and do not know anything
    about the types we are allocating for. The client has to provide the required
    size information to the allocation functions. Here is an example with malloc:


    ```

    HelloTelegram telegram = malloc(sizeof(HelloTelegram));

    ```


    Code like this is sneaky to maintain. As long as the telegram stays as a HelloTelegram
    everything is fine. The sneakiness in the fact that malloc usage above contains
    a certain subset of dependency; the size given must match the type on the left
    side of the assignment. Consider a change in telegram type to a GoodTelegram.
    With the code above means a change in two places, which is at least one change
    too much:


    ```

    /* We change the type on both sides of the assignment! */

    GoodTelegram telegram = malloc(sizeof(GoodTelegram));

    ```


    A failure to update both may have fatal consequences, potentially leaving the
    code with undefined behavior.


    # Applying the Idiom


    ```

    HelloTelegram telegram = malloc(sizeof(telegram));

    ```


    But wait! Is the code above dereferencing an invalid pointer? No, and the reason
    that it is that sizeof is an operator and not a function; sizeof doesn''t evaluate
    its argument and the statement sizeof *telegram is computed at compile time. Better
    yet, if the type of telegram is changed, say to a GoodTelegram, the compiler automatically
    calculates the correct size to allocate for this type.'
