    # Patterns in C


    capacity. Miller arrived at the now well-known heuristic of seven items, plus
    minus two.


    Given the seven items we can hold in working memory simultaneously, it''s no wonder
    that programming is hard; any interesting programming problem has a multitude
    of parameters, implications and possible alternatives. One around this limitation
    is a process known as chunking. Chunking is an encoding strategy where individual
    elements are grouped into higher-level groups, chunks. The limit on the number
    of units still apply, each unit now holds more information.


    Patterns are a sophisticated form of chunking. Instead of describing a design
    as "well, I have this function that takes another function as argument. The function
    as argument expresses the variability in the algorithm. Let me extend the behavior
    without modifying the algorithm itself. I just write a new function fulfilling
    the contract we could simply say "STRATEGY". Patterns serve as a handle to sophisticated
    knowledge stored in long-term memory. When it comes to software maintenance, a
    significant part of the benefit for any product, documented patterns are an advantage.


    Patterns have psychological value beyond chunking. Like Alexander intended, patterns
    allow us to build and share a common vocabulary. It simplifies the communication.
    It''s also a powerful tool. Instead of reasoning about individual design elements
    and coding constructs, patterns provide a way to group these concepts into a larger
    unit


    # Patterns go C


    The format has gained tremendous popularity for capturing experience. One of the
    reasons for this popularity is the unique success of the classic book Design Patterns
    by the Gang of Four. The Design Patterns served the community by spreading the
    word about patterns. But it was a double-edged sword. The unique success of Design
    Patterns led many developers to believe that patterns are limited to object-oriented.


    Todays in the software industry aren''t limited to design; there exists a broad
    range of patterns, covering analysis patterns, patterns for organizations, patterns
    for testing, etc.


    When it comes to the actual implementations of patterns, most are also described
    in the context of an object oriented design. By browsing a public bookstore, I
    noticed a lot of specific pattern literature: design patterns in Java, C#, Smalltalk
    and other object oriented languages. The C was sadly absent in the pattern literature.


    Given the popularity of C, where are the books targeting the unique implementation
    constraints and techniques for the language? Isn''t it possible to use patterns
    in the development of C programs or doesn''t it add any benefits?


    The purpose of this book is to answer those questions. It is my intent to convey
    an idea of how patterns may be applied naturally in C. I discuss the actual implementation
    techniques and trade-offs.


    # About this book


    This patterns in this book are based on an article I wrote back in 2005. Some
    years earlier I had returned to programming in C after some years spent with object-oriented
    languages. The relative simplicity of C language has always attracted me. What
    I lacked was the guiding principles in common object-oriented communities.


    I soon realized that lot of knowledge applied to programs in C as well. The problem
    was the papers and books they discussed them using completely different language
    contexts. To a programmer, inheritance and polymorphism aren''t necessary parts
    of the design vocabulary. C has different approaches to solving problems.


    As I started to apply design principles from my object-oriented background I was
    to balance the implementations with the way C worked. I wanted to avoid emulating
    object-oriented constructs.'
