    # Reflections on FIRST-CLASS ADT


    A common criticism of the book Design Patterns is that the patterns only apply
    to message-passing object oriented languages like C++ or Java. The patterns are
    seen as workarounds for absent language features. The need for patterns, the reasoning
    goes, is taken as an indication that the language is somehow less powerful.


