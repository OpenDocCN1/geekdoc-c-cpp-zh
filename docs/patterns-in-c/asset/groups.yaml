    \ . . . . . . . . . . . . . . 59\n\n# Patterns in software\n\nSoftware development\
    \ is hard. It's an act of balancing different forces while trying to close the\
    \ gap between problem and solution. Worse yet, we have to start at a point where\
    \ our understanding of these models is incomplete. We constantly have to juggle\
    \ with complexity on multiple levels and need to be extremely precise and correct\
    \ in expressing our solutions.\n\nGiven this view, we consider patterns as a tool\
    \ in software. Patterns are valuable, they're also one of the most misunderstood\
    \ concepts within our profession. Patterns have been used speculatively in many\
    \ designs, perhaps most often within the Java community. Since the days of large-scale\
    \ programming projects, the community has borrowed both terminology and design\
    \ discipline from architecture. Sometimes the parallels have been stretched beyond\
    \ the limits. This was the case with much of the secondary literature on patterns.\
    \ Nothing could be further from Alexander's original intent. The patterns found\
    \ in Alexander's books are simple and elegant formulations on how to solve recurring\
    \ problems in different contexts. Alexander's patterns refer to the physical world.\
    \ They are about the nature of towns and buildings. Alexander's philosophy is\
    \ about making buildings come alive. His work is praise of collaborative construction\
    \ guided by a shared language – a pattern language. Such a generative, non-mechanical\
    \ construct, it's a language with the power to evolve and grow. As such, patterns\
    \ are more of a communication tool than technical solutions.\n\n# The cognitive\
    \ view\n\nIn his classic talk at the Turing awards 1972, Dijkstra remarked that\
    \ computer programming is an \"intellectual challenge which is without precedent\
    \ in the cultural history of mankind\" (Dijkstra, 1972). What is it that makes\
    \ software development so hard, in Dijkstra's terms, \"without precedent\" to\
    \ anything we've constructed? Dijkstra himself gave the answer by saying that\
    \ a competent programmer is fully aware of the strictly limited size of his own\
    \ skill. It's a matter of making the great cognitive challenges of software development.\
    \ Programming stretches our cognitive abilities to a maximum and we need to counter\
    \ with effective design strategies to handle all the complexity inherent in software.\n\
    \nOne of the main factors limiting the size of our skill is working memory. Working\
    \ memory is a theoretical construct understood as the system that allows us to\
    \ hold information in our mind, integrate different parts, reason about them and\
    \ manipulate them. Working memory is what we use when we try to decipher a pattern\
    \ in Lisp, understand the relationship between two Java objects, or find a way\
    \ to express a certain domain in Haskell. It is the conscious workbench of the\
    \ mind.\n\nWorking memory is vital to our reasoning, problem solving, and decision\
    \ making. It's also strictly limited in its capacity. Back in 1956, George Miller\
    \ made the first quantification of our working memory capacity. Miller arrived\
    \ at the now well-known heuristic of seven items, plus minus two.\n\nGiven the\
    \ seven items we can hold in working memory simultaneously, it's no wonder that\
    \ programming is hard; any interesting programming problem has a multitude of\
    \ parameters, implications and possible alternatives. One around this limitation\
    \ is a process known as chunking. Chunking is an encoding strategy where individual\
    \ elements are grouped into higher-level groups, chunks. The limit on the number\
    \ of units still apply, each unit now holds more information.\n\nPatterns are\
    \ a sophisticated form of chunking. Instead of describing a design as \"well,\
    \ I have this function that takes another function as argument. The function as\
    \ argument expresses the variability in the algorithm. Let me extend the behavior\
    \ without modifying the algorithm itself. I just write a new function fulfilling\
    \ the contract\", we could simply say \"STRATEGY\". Patterns serve to handle knowledge\
    \ stored in long-term memory. When it comes to software maintenance, patterns\
    \ are an advantage.\n\n# Patterns go C\n\nThe format has gained tremendous popularity\
    \ for capturing experience. One of the reasons for this popularity is the unique\
    \ success of the book Design Patterns by the Gang of Four. But it was a double-edged\
    \ sword. The unique success of Design Patterns led many developers to believe\
    \ that patterns are limited to object oriented.\n\n Todays in the software industry\
    \ aren't limited to design; there exists a broad range of patterns, covering analysis\
    \ patterns, patterns for organizations, patterns for testing, etc. When it comes\
    \ to the actual implementations of patterns, most are also described in the context\
    \ of an object oriented design. C was sadly absent in the pattern literature.\n\
    \n# About this book\n\nThis patterns in this book are based on an article I wrote\
    \ back in 2005. Some years earlier I had returned to programming in C after some\
    \ years spent with object-oriented languages. The relative simplicity of C language\
    \ has always attracted me. What I lacked was the guiding principles in common\
    \ object-oriented communities.\n\nAs I started to apply design principles from\
    \ my object-oriented background I was to balance the implementations with the\
    \ way C worked. I wanted to avoid emulating object-oriented constructs.\n"
