    \ * is applied to it. The idiom itself is of course limited to pointers. To illustrate\
    \ this, consider functions as memset and memcpy. These functions achieve their\
    \ generality by using void for the pointer arguments. Given only the void pointer,\
    \ there is no choice for no way to know the size of the struct to operate on.\
    \ Exactly as with malloc, it is left to the client to provide the correct size.\n\
    \n```c\nuint32_t telegramSize = 0;\nmemcpy(&telegramSize, binaryDatastream, sizeof\
    \ telegramSize);\n```\n\nWith SOF variables above as size, the information automatically\
    \ matches the type given in first argument. For example, consider a representation\
    \ of the telegram size from 32-bits to 16-bits; the memcpy will be correct.\n\n\
    ## INITIALIZE COMPOUND TYPES WITH {0}\n\n## Problem Context\n\nVirtually every\
    \ coding standard stands unbiased variables and with very good reasons. Initializing\
    \ a basic type as int or char is straightforward, but what is the correct way\
    \ of initializing a compound type like an array or struct? A dangerous but unfortunately\
    \ common practice is shown:\n\n```c\nstruct TemperatureNode\n{\n  double todaysAverage;\n\
    \  struct TemperatureNode* nextTemperature;\n}\nstruct TemperatureNode node;\n\
    memset(&node, 0, sizeof node);\n```\n\nThe problem is that memset, as its name\
    \ indicates, sets the bits to the given value and it does without _any_ knowledge\
    \ of the underlying type. In C, all bits do not necessarily represent floating-point\
    \ zero or a NULL pointer constant. Initializations using memset as above result\
    \ in undefined behavior for such types.\n\nThe alternative of initializing the\
    \ struct by one by one is both cumbersome and risky. Due to its subtle duplication\
    \ with the declaration of the struct, this approach introduces a maintenance challenge\
    \ that initialization has to be updated every time a member is added or removed.\n\
    \n## Applying the Idiom\n\nLuckily, the portable solution provided by the INITIALIZE\
    \ COMPOUND TYPES WITH {0} does not only ensure correctness; it requires less typing.\
    \ The code guarantees to initialize all members (including fields and pointers)\
