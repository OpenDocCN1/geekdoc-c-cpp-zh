  mdcn: "\n\n## 惯用表达式\n\n由于电报（telegram）是指针类型，因此单目运算符 `*` 应用于它。该惯用表达式本身显然仅限于指针。为了说明这一点，考虑\
    \ `memset` 和 `memcpy` 函数。这些函数通过对指针参数使用 `void` 来实现其通用性。在仅给定 `void` 指针的情况下，没有办法知道要操作的结构体的大小。正如\
    \ `malloc` 一样，这由客户端提供正确的大小。\n\n```c\nuint32_t telegramSize = 0;\nmemcpy(&telegramSize,\
    \ binaryDatastream, sizeof telegramSize);\n```\n\n使用上述 `SOF` 变量作为大小时，信息会自动与第一个参数给出的类型匹配。例如，考虑将电报大小从\
    \ 32 位转换为 16 位的表示；`memcpy` 将是正确的。\n\n## 使用 {0} 初始化复合类型\n\n## 问题背景\n\n几乎所有的编码标准都反对未初始化的变量，并且有非常充分的理由。初始化\
    \ `int` 或 `char` 等基本类型轻而易举的，但初始化数组或结构体等复合类型的正确方法是什么？这里展示了一种危险但遗憾很常见的做法：\n\n```c\n\
    struct TemperatureNode\n{\n  double todaysAverage;\n  struct TemperatureNode*\
    \ nextTemperature;\n}\nstruct TemperatureNode node;\nmemset(&node, 0, sizeof node);\n\
    ```\n\n问题在于，`memset` 正如其名所示，将位设置为给定的值，并且对底层类型没有*任何*了解。在 C 语言中，所有位并不一定代表浮点数零或 `NULL`\
    \ 指针常量。使用上述使用 `memset` 进行的初始化会导致此类类型产生未定义行为。\n\n逐个初始化结构体的替代方案既繁琐又具有风险。由于它与结构体的声明之间存在细微的重复，这种方法引入了维护挑战：每当添加或删除成员时，必须更新初始化。\n\
    \n## 应用惯用表达式\n\n幸运的是，“使用 {0} 初始化复合类型”所提供的可移植解决方案不仅确保了正确性，还减少了输入量。该代码保证将结构体的所有成员（包括字段和指针）初始化为零。编译器保证以一种可移植的方式自动初始化为该平台的正确表示。\n\
    \n```c\nstruct TemperatureNode node = {0};\n```\n\n以创建一个已初始化结构体为代价，以后可以使用 `memcpy`\
    \ 来重置数组或结构体的成员。因为它通过复制整个字节（包括可能的填充）来工作，`memcpy` 不会遇到 `memset` 可能安全操作相同的问题。\n\n\
    ## 惯用表达式\n\n```c\nconst struct TemperatureNode zeroNode = {};\nstruct TemperatureNode\
    \ node = {};\n/* 对 node 执行一些操作。 */\n/* 重置 node (等于 node = zeroNode); */\nmemcpy(&node,\
    \ &zeroNode, sizeof node);\n```\n\n使用 `memcpy` 拷贝结构体并不是最简单的方法。毕竟，最后一行可以重写为 `node\
    \ = zeroNode` 同时保持相同的行为。相反，这种惯用表达式的优势在应用于数组时才体现出来。它帮助我们避免了像 `memcpy` 那样显式遍历数组中的所有元素，并处理了重置数组这一枯燥的任务。\n\
    \n```c\nconst double zeroArray[NO_OF_TEMPERATURES] = {};\ndouble temperatures[NO_OF_TEMPERATURES]\
    \ = {};\n/* 在 temperatures 数组中存储一些值。 */\n/* 重置数组。 */\nmemcpy(temperatures, zeroArray,\
    \ sizeof temperatures);\n```\n\n## 通过除法计算数组大小\n\n## 问题背景\n\nC 语言对内置数组的支持较少。例如，当将数组传递给函数时，数组退化为指向第一个元素的指针。在没有特定约定且仅给定指针的情况下，无法简单地知道数组的大小。大多数\
    \ API 允许程序员完成此记录工作。一个例子是 POSIX API 中的 `poll()` 函数。`poll()` 被用作事件多路复用扫描器。这些引用 socket\
    \ 等平台资源的句柄被存储在数组中并传递给 `poll()`。数组后面跟着一个指定元素数量的参数。\n\n```c\nstruct pollfd handles[NO_OF_HANDLES]\
    \ = {};\n/* 用用于 poll 的句柄填充数组， */\n/* 省略代码... */\nresult = poll(handles, NO_OF_HANDLES,\
    \ NFTIM);\n```\n\n这个数组的问题在于，除了名称之外，将常量 `NO_OF_HANDLES` 与可能的元素数量在了一起。良好的命名确实，但它只对代码的人类阅读者重要；编译器并不在乎。\n\
    \n## 应用惯用表达式\n\n通过“通过除法计算数组大小”，我们保证计算的大小始终与实际元素数量匹配。该计算由编译器本身在编译时完成。\n\n```c\n\
    struct pollfd handles[NO_OF_HANDLES] = {};\nconst size_t noOfHandles = sizeof\
    \ handles / sizeof(handles[]);\n```\n\n这种惯用表达式建立在获取编译数组的大小并除以其中一个元素的大小（`sizeof\
    \ handles[0]`）的基础上。\n\n## 作为变量的魔数\n\n## 问题背景\n\n经验丰富的程序员会避免魔数。魔数不能很好地表达代码的意图，并可能困扰试图阅读或修改它的人。传统上，某些数字\
    \ 0、1、34 和 42 被认为不像其他数字那样“魔幻”。考虑一个初始化为 0 的变量。读者会立即认为这是一个默认初始化，该变量稍后可能会赋予另一个值。同样，知情者知道\
    \ 42 是生命、宇宙和万物的终极问题的答案。\n\n这些“非魔数”数字的问题在于它们建立在假设和预期之上。这些预期可能会被打破。一个例子是 `struct\
    \ tm`，它用于表示……（等待，文本似乎中断或重复了）。\n\n这些非魔数的问题在于它们建立在假设和预期之上。这些预期可能会被打破。一个例子是 `struct\
