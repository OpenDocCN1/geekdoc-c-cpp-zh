- md: "\n# The FIRST-CLASS ADT Pattern\n\n## Listing 1 : Interface in Customer.h\n\
    \n```c\n/* Include guards and include files omitted. */\n#define MAX_NO_OF_ORDERS\
    \ 42\n\n/* Internal representation of a customer. */\ntypedef struct {\n    const\
    \ char* name;\n    Address address;\n    size_t noOfOrders;\n    Order orders[MAX_NO_OF_ORDERS];\n\
    } Customer;\n\nvoid initCustomer(Customer* customer,\n    const char* name,\n\
    \    Address* address);\n\nvoid placeOrder(Customer* customer,\n    const Order*\
    \ order);\n/* A lot of other related functions... */\n```\n\nA quick glance reveals\
    \ the problem. Simply increasing MAX_NO_OF_ORDERS would, wouldn't it? What's the\
    \ correct value for it? Is it 64, 128, maybe even 2048 or some other number? Customers\
    \ with a single order allocate space for, let's say, 2047 non-existing orders?\n\
    \nAs you think about it, realize that the current solution doesn't scale well.\
    \ Clearly, we need another. Recall that a linked list exists in the code base's\
    \ library. A linked list might do the trick. However, this means changing the\
    \ internal structure of the customer.\n\nNo problem, it looks like you are of\
    \ everything; the clients of the customer module simply use the provided functions\
    \ for all access of the customer structure. Updating those functions should be\
    \ enough, shouldn't it?\n\n## Information hiding\n\nWell, in an ideal world the\
    \ guest would be isolated to the single module. Given the interface above, clients\
    \ depend upon the internal structure in at least one way.\nAt worst, the clients\
    \ of the data structure themselves, leading to costly changes of all clients.\n\
    \nThis can be prevented by frequent code-inspections and programmer discipline.\
    \ In any case, we still have the compile-time dependencies and after changes,\
    \ a re-compile of all clients is required and the compilation time may be significant\
    \ in large systems.\n\nThe FIRST-CLASS ADT pattern will eliminate both dependency\
    \ problems. The pattern provides us with a method of separating interface from\
    \ implementation, achieving true information hiding.\n\n## Definition of a FIRST-CLASS\
    \ ADT\n\nADT stands for Abstract Data Type and it is basically a set of values\
    \ and operations on these values. The ADT is considered first-class if we can\
    \ have many, unique instances of it.\n\nSounds like the interface listed in the\
    \ introductory example above, doesn't it? However, the data type in the example\
    \ is not abstract as it fails to hide its implementation details. In order to\
    \ make it truly abstract, we have to utilize a powerful feature of C - the ability\
    \ to specify incomplete types.\n\n# The FIRST-CLASS ADT Pattern\n\n## Incomplete\
    \ Types\n\nThe standard [C 1999] allows us to declare objects of incomplete types\
    \ in a context where their sizes aren't needed. In our implementation, we are\
    \ interested in one property of incomplete types – the possibility to specify\
    \ a pointer to an incomplete type (please note that the pointer itself is not\
    \ of an incomplete type).\n\n## Listing 2 : Pointer to an incomplete type\n\n\
    ```c\n/* A pointer to an incomplete type (hides the implementation details). */\n\
    typedef struct Customer* CustomerPtr;\n```\n\nInstances of this pointer will serve\
    \ as a handler for the clients of a FIRST-CLASS ADT. This mechanism enforces the\
    \ constraint on clients using the provided interface functions because there is\
    \ no client that can access a field in the Customer structure (the C language\
    \ does not allow an incomplete type to be de-referenced).\n\nThe type is considered\
    \ complete as soon as the compiler detects a subsequent specifier, with the same\
    \ tag, and a declaration list containing the members.\n\n## Listing 3 : Completion\
    \ of an incomplete type\n\n```c\n/* The struct Customer is an incomplete type.\
    \ */\ntypedef struct Customer* CustomerPtr;\n\n/* Internal representation of a\
    \ customer. */\nstruct Customer {\n  const char* name;\n  Address* address;\n\
    \  size_t noOfOrders;\n  Order orders[42];\n};\n/* At this point, struct Customer\
    \ is considered complete. */\n```\n\n# Object Lifetime\n\nBefore we dive into\
    \ the implementation of the ADT, we need to consider object creation and destruction.\
    \ As clients only get a handle to the object, the responsibility for creating\
    \ it rests on the ADT. The straightforward approach is to write one function that\
    \ encapsulates the allocation of an object and initializes it. In a similar way,\
    \ we define a function for destructing the object.\n\n## Listing 4 : Interface\
    \ to the ADT, Customer.h\n\n```c\n/* Includes and include guards as before...\
    \ */\n/* A pointer to an incomplete type (hides the implementation details). */\n\
    typedef struct Customer* CustomerPtr;\n```\n\n```c\n/* Create a Customer and return\
    \ a handle to it. */\nCustomerPtr createCustomer(const char* name,\n  const Address*\
    \ address);\n```\n\n# The FIRST-CLASS ADT Pattern\n\n```c\n/* Destroy the given\
    \ Customer.\nAll handles to it will be invalidated. */\nvoid destroyCustomer(CustomerPtr\
    \ customer);\n```\n\n## Listing 5 : Implementation of the ADT in Customer.c\n\n\
    ```c\n#include <Customer.h>\n#include <stdlib.h>\n\nstruct Customer {\n    const\
    \ char* name;\n    Address address;\n    size_t noOfOrders;\n    Order orders[42];\n\
    };\n\nCustomerPtr createCustomer(const char* name,\n                         \
    \  const Address* address) {\n    CustomerPtr customer = malloc(sizeof * customer);\n\
    \    if(customer) {\n        /* Initialize each field in the customer... */\n\
    \    }\n    return customer;\n}\n\nvoid destroyCustomer(CustomerPtr customer)\
    \ {\n    /* Perform clean-up of the customer internals,\n    if necessary. */\n\
    \    free(customer);\n}\n```\n\nThe example above uses malloc to obtain memory.\
    \ In embedded applications, this may not be an option. However, as we have encapsulated\
    \ the memory allocation, we are free to choose another approach. In embedded programming,\
    \ where the maximum number of needed is typically known, the simplest being an\
    \ array.\n\n## Listing 6 : Example of static approach to memory allocation\n\n\
    ```c\n#define MAX_OF_CUSTOMERS 42\nstatic struct Customer objectPool[MAX_OF_CUSTOMERS];\n\
    static size_t numberOfObjects = 0;\n\nCustomerPtr createCustomer(const char* name,\n\
    \                            const Address* address)\n{\n    CustomerPtr customer\
    \ = NULL;\n    if (numberOfObjects < MAX_OF_CUSTOMERS)\n    {\n        customer\
    \ = &objectPool[numberOfObjects++];\n        /* Initialize the object... */\n\
    \    }\n    return customer;\n}\n```\n\nIn case of de-allocation, an array will\
    \ still do, but a more sophisticated method for keeping track of \"allocated\"\
    \ objects will be needed. However, such an algorithm is outside the scope of this\
    \ book.\n\n# Copy Semantics\n\nAs clients only use a handle, which we have declared\
    \ as a pointer, the ADT, the issue of copy semantics boils down to pointer assignment.\
    \ Whilst efficient, in run-time performance, copies of a handle have to be managed\
    \ properly; the handles are only valid as long as the real objects exist.\n\n\
    We want to copy the real object, and create a new, unique instance of the ADT,\
    \ we have to define an explicit copy operation.\n\n# Dependencies managed\n\n\
    With the interface above, the C language guarantees that the internals of the\
    \ data structure are encapsulated in the implementation with no possibility for\
    \ clients to access the internals.\n\nUsing the FIRST-CLASS ADT, the compile-time\
    \ dependencies on internals are removed as well as changes of the implementation\
    \ are limited to the implementation itself, just as it should be. As long as no\
    \ functions are added or removed from the interface, the clients do not even have\
    \ to be re-compiled.\n\n# Consequences\n\nThe main consequences of applying the\
    \ FIRST-CLASS ADT pattern are:\n\n- **Improved encapsulation.** The FIRST-CLASS\
    \ ADT pattern decouples interface and implementation, following the recommended\
    \ principle of programming towards an interface, not an implementation.\n- **Loose\
    \ coupling.** As illustrated above, all dependencies on the internals of the data\
    \ structure are eliminated from client code.\n- **Controlled construction and\
    \ destruction.** The FIRST-CLASS ADT pattern gives us full control over the construction\
    \ and destruction of objects, providing us with the possibility to ensure that\
    \ all objects are created in a valid state. Similarly, we can ensure proper de-allocation\
    \ of all elements of the object, provided that client behaves correctly and calls\
    \ the defined destroy-function.\n"
  mdcn: "\n\n# 第一类 ADT 模式\n\n## 列表 1：Customer.h 中的接口\n\n```c\n/* 略去了头文件保护和包含文件。 */\n\
    #define MAX_NO_OF_ORDERS 42\n\n/* 客户的内部表示。 */\ntypedef struct {\n    const char*\
    \ name;\n    Address address;\n    size_t noOfOrders;\n    Order orders[MAX_NO_OF_ORDERS];\n\
    } Customer;\n\nvoid initCustomer(Customer* customer,\n    const char* name,\n\
    \    Address* address);\n\nvoid placeOrder(Customer* customer,\n    const Order*\
    \ order);\n/* 许多其他相关函数... */\n```\n\n扫一眼代码就能看出问题所在。简单地增加 MAX_NO_OF_ORDERS 就能解决问题，对吧？但它的正确值应该是多少？是\
    \ 64、128，甚至可能是 2048 或其他数字？对于只有一个订单的客户，是否会为例如 2047 个不存在的订单分配空间？\n\n当你仔细思考这个问题时，会发现当前的解决方案扩展性并不良好。显然，我们需要另一种方案。回想一下代码库的库中存在链表。链表可能解决问题。然而，这意味着需要更改客户的内部结构。\n\
    \n没问题，看起来你已经考虑到了一切；客户模块的客户端只需要使用提供的函数来完成对客户结构的所有访问即可。更新这些函数应该足够了，不是吗？\n\n## 信息隐藏\n\
    \n嗯，在理想世界中，客户应该被隔离在单个模块中。给定上述接口，客户端至少以一种方式依赖于内部结构。\n最坏的情况下，客户端依赖数据结构本身，导致所有客户端都要进行昂贵的更改。\n\
    \n这可以通过频繁的代码检查和程序员的自律来避免。无论如何，我们仍然存在编译时的依赖关系，并且在更改后，需要重新编译所有客户端，在大型系统中，编译时间可能会非常长。\n\
    \n第一类 ADT 模式将消除这两种依赖问题。该模式为我们提供了一种分离接口与实现的方法，实现了真正的信息隐藏。\n\n## 第一类 ADT 的定义\n\n\
    ADT 代表抽象数据类型（Abstract Data Type），它基本上是一组值以及对这些值进行的操作。如果我们能够拥有它的许多、唯一的实例，那么该 ADT\
    \ 就被认为是第一类的。\n\n听起来很像上面介绍示例中列出的接口，不是吗？然而，示例中的数据类型并不是抽象的，因为它未能隐藏实现细节。为了让它真正抽象，我们必须利用\
    \ C 语言的一个强大特性——指定不完整类型的能力。\n\n# 第一类 ADT 模式\n\n## 不完整类型\n\n标准 [C 1999] 允许我们在不需要大小的上下文声明不完整类型的对象。在我们的实现中，我们对不完整类型的一个属性感兴趣——指向不完整类型指针的可能性（请注意，指针本身并不是不完整类型）。\n\
    \n## 列表 2：指向不完整类型的指针\n\n```c\n/* 指向不完整类型的指针（隐藏了实现细节）。 */\ntypedef struct Customer*\
    \ CustomerPtr;\n```\n\n该指针的实例将作为第一类 ADT 客户端的句柄。这种机制强制执行了使用提供的接口函数的客户端的约束，因为没有客户端可以访问\
    \ Customer 结构中的字段（C 语言不允许对不完整类型进行解引用）。\n\n一旦编译器检测到后续的具有相同标签的说明符，以及一个包含成员的声明列表，该类型就被认为是完整的。\n\
    \n## 列表 3：不完整类型的完成\n\n```c\n/* struct Customer 是一个不完整类型。 */\ntypedef struct Customer*\
    \ CustomerPtr;\n\n/* 客户的内部表示。 */\nstruct Customer {\n  const char* name;\n  Address*\
    \ address;\n  size_t noOfOrders;\n  Order orders[42];\n};\n/* 在此之后，struct Customer\
    \ 是完整的了。 */\n```\n\n# 对象 生命周期\n\n在我们深入 ADT 的实现之前，我们需要考虑对象的创建和销毁。由于客户端只获取句柄，创建和销毁的责任交给了\
    \ ADT。一种简单的方法是编写一个函数来销毁对象。\n\n## 列表 4：ADT 的接口，Customer.h\n\n```c\n/* 与之前相同的头文件保护和包含...\
    \ */\n/* 指向不完整类型的指针（隐藏了实现细节）。 */\ntypedef struct Customer* CustomerPtr;\n```\n\
    \n```c\n/* 创建 ADT 并返回其句柄。 */\nCustomerPtr createCustomer(const char* name,\n \
    \ const Address* address);\n```\n\n# 第一类 ADT 模式\n\n```c\n/* 销毁给定的客户。所有句柄将失效。 */\n\
    void destroyCustomer(CustomerPtr customer);\n```\n\n## 列表 5：Customer.c 中的 ADT\
    \ 实现\n\n```c\n#include \"Customer.h\"\n#include <stdlib.h>\n\nstruct Customer\
    \ {\n    const char* name;\n    Address address;\n    size_t noOfOrders;\n   \
    \ Order orders[42];\n};\n\nCustomerPtr createCustomer(const char* name,\n    \
    \                       const Address* address) {\n    CustomerPtr customer =\
    \ malloc(sizeof * customer);\n    if(customer) {\n        /* 初始化每个字段... */\n \
    \   }\n    return customer;\n}\n\nvoid destroyCustomer(CustomerPtr customer) {\n\
    \    /* 必要时清理客户内部。 */\n    free(customer);\n}\n```\n\n上面的示例使用 malloc 获取内存。在嵌入式应用中，这可能不是一个选项。然而，由于我们封装了内存分配，我们可以选择其他方法。在嵌入式编程中，所需的数量通常是已知的，最简单的是数组。\n\
    \n## 列表 6：静态内存分配的示例\n\n```c\n#define MAX_OF_CUSTOMERS 42\nstatic Customer objectPool[MAX_OF_CUSTOMERS];\n\
    static size_t numberOfObjects = 0;\n\nCustomerPtr createCustomer(const char* name,\n\
    \                            const Address* address)\n{\n    CustomerPtr customer\
    \ = NULL;\n    if (numberOfObjects < MAX_OF_CUSTOMERS)\n    {\n        customer\
    \ = &objectPool[numberOfObjects++];\n        /* 初始化对象... */\n    }\n    return\
    \ customer;\n}\n```\n\n在释放内存的情况下，数组仍然有效，但需要更复杂方法来跟踪“已分配”的对象。然而，这种算法超出了本书的讨论范围。\n\
    \n# 拷贝语义\n\n由于客户端只使用句柄（我们将其声明为指针的 ADT），拷贝语义问题简化为了指针赋值。虽然这在运行时性能上很高，但句柄必须被正确管理；它们在在对象存在时才有效。\n\
    \n如果我们想要复制对象并创建一个新的、唯一的 ADT 实例，我们必须定义一个显式的拷贝操作。\n\n"
