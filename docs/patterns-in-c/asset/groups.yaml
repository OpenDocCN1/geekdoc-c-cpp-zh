    with the name timeoutSeconds and have a hard time finding a name that helps me
    remember the purpose of the variable equally. Instead of going down the dark path
    of naming by introducing obstructive outcalls as timeout1 and timeout2, I try
    to use the existing variable by removing its qualification and re-assign it for
    the second timer.


    ```

    size_t timeoutSeconds = 10;

    size_t doNotRescheduleTimer = 0;

    ```


    ```

    notifyClosingDoor = startTimer(timeoutSeconds,

    doNotRescheduleTimer);

    timeoutSeconds = 12;

    closeDoor = startTimer(timeoutSeconds,

    doNotRescheduleTimer);

    ```


    This is a tiny example, yet it''s obvious that the code doesn''t read as well
    as the first. The first is part of the story, but there''s more to it. By re-using
    the timeoutSeconds variable, a reader of the code has to follow the switch of
    value. The right-hand side of the expressions starting the timers look identical,
    the reader has to span multiple lines in order to get the whole picture.


    # Applying the Idiom


    By naming parameters, it is possible to bind a certain value to a name at the
    ideal call site. C doesn''t have language support for this construct, but it is
    possible to emulate NAMED PARAMETERS.


    ```

    size_t timeoutSeconds = 10;

    size_t doNotRescheduleTimer = 0;

    ```


    ```

    notifyClosingDoor = startTimer(timeoutSeconds = 10,

    doNotRescheduleTimer = 0);

    timeoutSeconds = 12;

    closeDoor = startTimer(timeoutSeconds,

    doNotRescheduleTimer);

    ```


    The timeoutSeconds variable is re-used to start the timers, but this time directly
    in the function call. A reader of the code is free from remembering which variable
    currently has, because the expression now reads perfectly from left to right.


    As neat as this may seem, I hesitated to include it in a Java program. It first
    felt rather exciting as I realized it would be possible in C. Well not now using
    it would make my programs self-documenting; it would also bring me friends, money,
    and fame. After once the initial excitement had decreased, I looked for and possible
    uses of the idiom. I soon realized that the thing is, it looks like a good solution.
    However, often it''s just deodorant covering a code smell. Most of the examples
    of its applicability that I could come up with would be better by redesigning
    the code (surprisingly often by making a function more cohesive or simply'
- md: "\n## Idiomatic Expressions\n\n56\n\nre-renaming it. All this suggests that\
    \ NAMED PARAMETERS are more of a cool trick than a true idiomatic expression.\n\
    \nThat said, I still believe NAMED PARAMETERS have a use. There are cases where\
    \ a redesign isn't possible (third-party code, published API's, etc). As I believe\
    \ these cases are rare, my recommendation is to rethink the code and use NAMED\
    \ PARAMETERS as a last resort. Of course, comments would be used to achieve the\
    \ same.\n\n```c\ncloseDoor = startTime(/* Timeout in seconds */ / 12,\n    /*\
    \ Do not reschedule */ 0);\n```\n\nBecause I believe such a break flows the code\
    \ of obstructing its structure, I would recommend against it.\n\n## ASSERTION\
    \ CONTEXT\n\n### Problem Context\n\nAssertions are a powerful programming tool\
    \ that must not be confused with error handling. Instead they should primarily\
    \ be used to state something due to a surrounding context is known to be true.\
    \ I would assert this to protect the code from its worst enemy, the maintenance\
    \ programmer, which very often turns out to be well, exactly:\n\nValidating function\
    \ arguments is good programming practice and is so cohesion. To simplify functions\
    \ and increase their cohesion I often delegate to small, internal functions. When\
    \ passing pointers around, I validate them, once they pass on the state and I\
    \ know they are valid with an assertion (please note that callers prior to C99\
    \ have the macro argument to assert an integral constant, which requires programmers\
    \ to write assert(NULL!= myFunction); for well-defined behavior).\n\n```c\nvoid\
    \ sayHelloTo(const Address* aGoodFriend)\n{\n    if(aGoodFriend) {\n        Telegram\
    \ friendlyGreetings = {};\n        /* Add some kind words to the telegram,\n \
    \       omitted here... */\n        sendTelegram(&friendlyGreetings, aGoodFriend);\n\
    \    }\n    else {\n        error(\"Empty address not allowed\");\n    }\n}\n\
    static void sendTelegram(const Telegram* telegram,\n    const Address* receiver)\n\
    {\n/* At this point we know that telegram\n    points to a valid telegram... */\n\
    \    assert(telegram);\n    /* ...and the receiver points to a\n    valid address.\
    \ */\n    assert(receiver);\n```\n\n```c\n    /* Code to process the telegram\
    \ omitted... */\n```\n\n```c\n}\n```\n\nIn the example above assert is a protective\
    \ mechanism decorated with comments describing the rationale for the assertions.\
    \ Always with comments, the best ones are the ones you don't have to write because\
    \ the code is already crystal clear. Specifying the intent of the code is a step\
    \ towards clearness and assert itself proves to be an excellent construct for:\n\
    \nThe idiom ASSERTION CONTEXT increases the expressiveness of the code by merging\
    \ the comment, describing the assertion context, what it refers to. This context\
    \ is added as a string, which always evaluates to true in the assertion expression.\
    \ The single-line assertion is now self describing in how it communicates its\
    \ context:\n\n### Applying the Idiom\n\n- 1 assert(receiver) && \"Is validated\
    \ by the caller\";\n\nBesides its primary purpose, communicating to a human reader\
    \ of code that the receiver is valid, ASSERTION CONTEXT allows itself debugging.\
    \ As an assertion fires, it writes information about the particular to the standard\
    \ error file. The fact of this information is implementation-defined, but it will\
    \ include the text of the argument. With carefully-chosen descriptive strings\
    \ in the assertions it becomes, for the author of the code, to make a qualified\
    \ guess about the failure without looking at the source. As it provides rapid\
    \ feedback, I find this feature particularly useful during short, incremental\
    \ development cycles driven by unit-tests.\n\nA drawback of ASSERTION CONTEXT\
    \ is the memory used for the strings. In small embedded applications it may have\
    \ a noticeable impact on the size of the executable. However, it is important\
    \ to notice that assert is pure debug functionality and do not affect a release\
    \ build; compiling with NDEBUG will remove all assertions together with the context\
    \ strings.\n\n## CONSTANTS TO THE LEFT\n\n### Problem Context\n\nThe C language\
    \ has a rich flora of operators. The language is also very liberal about usage.\
    \ How liberating the slogan \"Trust the programmer\" feel, it also less protection\
    \ against errors and some errors are more frequent than others. It wouldn't be\
    \ too wild a guess that virtually every C programmer in a moment of serious, ahead\
    \ caffeine abstinence has erroneously written an assignment instead of a comparison.\n\
    \n- 1 int x = 0;\n- 2 \n- 3 if(x = 0)\n- 4 {\n- 5\n```c\n/* This will never be\
    \ true! */\n```\n- 6 \n```c\n}\n```\n\nSo, why not simply ban assignments in comparisons?\
    \ Well, if I personally avoid it, assignments in comparisons may sometimes actually\
    \ make some sense.\n\n```c\nFriend* aGoodFriend = NULL;\n...\nif(aGoodFriend =\
    \ findFriendAt(address))\n{\n    sayHelloTo(aGoodFriend);\n}\nelse\n{\n    printf(\"\
    I am not your friend\");\n}\n```\n\nHow is the compiler supposed to differentiate\
    \ between the first, erroneous case and the correct case?\n\n### Applying the\
    \ Idiom\n\nBy keeping CONSTANTS TO THE LEFT in comparisons the compiler will catch\
    \ an erroneous assignment. A statement such as:\n\n```c\nif(0 = x) { }\n/* We'll\
    \ get here if x is zero -- correct! */\n```\n\nis not valid C and the compiler\
    \ is forced to issue a diagnostic. After correcting the if-statement, the code\
    \ using this idiom looks like:\n\n```c\nif(0 == x)\n{\n    /* We'll get here if\
    \ x is zero -- correct! */\n}\n```\n\nThe idiom works equally well in assertions\
    \ involving pointers.\n\n```c\nassert(NULL == myPointer);\n```\n\nDespite its\
    \ obvious advantage, the CONSTANTS TO THE LEFT idiom is not completely agreed\
    \ upon. Many experienced programmers argue it makes the code harder to read and\
    \ the compiler will warn for potentially assignments anywhere. There is certain\
    \ truth to this. I would just like to add that it is important to notice that\
    \ compiler is not required to warn for such usage. As far as readability concerns,\
    \ this idiom has been used for years and a C programmer has to know anyway in\
    \ order to understand coding style by others.\n\n## Summary\n\nThe collection\
    \ of idiomatic expressions in this chapter is by means complete. There are many\
    \ idioms in C and each of them solves a different problem. Idiomatic expressions\
    \ at this level are really above language constructs. Thus, the learning curve\
    \ is flat. Changing coding style towards using them is a small step with, I believe,\
    \ immediate benefits.\n\n## References\n\n-mann, F., Meunier, R., Rohnert, H.,\
    \ Sommerlad, P., and Stal, M., \"POSA, A System of Patterns Volume 1\", Wiley\n\
    - Dijkstra (1972). The Humble Programmer\n- Gamma, E., Helm, R., Johnson, R.,\
    \ and Vlissides, J, \"Design Patterns\", Addison-Wesley\n- ISO/IEC 9899:1999,\
    \ The C standard\n- Kafka, F. \"The Metamorphosis\", Addison-Wesley\n- Kerievsky,\
    \ J. \"Refactoring to Patterns\", Addison-Wesley\n- Kernighan, B., and Ritchie,\
    \ D., \"The C Programming Language\", Prentice Hall\n- Martin, R. C. \"Agile Software\
    \ Development\", Prentice Hall\n- Page-Jones, A. \"The Practical Guide to Structured\
    \ Systems Design\", Prentice Hall\n- Petersen, A. _The complete REACTOR sample\
    \ code used in this article, _http://www.adampetersen.se/ReactorSample\n- Schmidt,\
    \ Stal, Rohnert, Buschmann: \"Pattern-Oriented Software Architecture, volume 2\"\
    , Wiley\n- Sedgewick, R., \"Algorithms in C, Parts 1-4\", Addison-Wesley\n- Vlissides,\
    \ J. \"Pattern Hatching\", Addison-Wesley\n"
  mdcn: "\n\n## 惯用表达式 (Idiomatic Expressions)\n\n56\n\n重新命名它。这一切表明，**命名参数**（NAMED\
    \ PARAMETERS）更像是一个酷技巧，而不是一种真正的惯用表达式。\n\n尽管如此，我仍然认为命名参数是有用途的。在某些情况下，无法重新设计（第三方代码、已发布的\
    \ API 等）。由于我认为这些情况很少见，我的建议是重新思考代码，并将命名参数作为最后的手段。当然，也可以使用注释来实现相同的效果。\n\n```c\n\
    closeDoor = startTime(/* Timeout in seconds */ / 12,\n    /* 不要重新调度 */ 0);\n```\n\
    \n因为我认为这种破坏会干扰代码结构的流流性，因此我不建议使用它。\n\n## 断言上下文 (ASSERTION CONTEXT)\n\n### 问题背景\n\
    \n断言（Assertions）是一种强大的编程工具，绝不能与错误处理混淆。相反，它们应该主要用于陈述某些由于周围上下文已知为真而成立的事实。我使用这种断言是为了保护代码免受其最大的敌人——维护程序员的侵害，而后者往往确实是这样的人：\n\
    \n验证函数参数是良好的编程实践，也是高内聚性的。为了简化函数并增加内聚性，我经常将任务委托给小的内部函数。在传递指针时，我会对它们进行验证，一旦通过验证就会传递状态，并且我通过断言知道它们是有效的（请注意，在\
    \ C99 之前的调用者具有宏参数来断言整数常量，这要求程序员编写 `assert(NULL!= myFunction);` 以获得定义良好的行为）。\n\n\
    ```c\nvoid sayHelloTo(const Address* aGoodFriend)\n{\n    if(aGoodFriend) {\n\
    \        Telegram friendlyGreetings = {};\n        /* 在电报中添加一些友善的话，\n        此处省略...\
    \ */\n        sendTelegram(&friendlyGreetings, aGoodFriend);\n    }\n    else\
    \ {\n        error(\"Empty address not allowed\");\n    }\n}\nstatic void sendTelegram(const\
    \ Telegram* telegram,\n    const Address* receiver)\n{\n/* 在此，我们知道 telegram\n\
    \    指向一个有效的电报... */\n    assert(telegram);\n    /* ...而且 receiver 指向一个\n    有效的地址。\
    \ */\n    assert(receiver);\n```\n\n```c\n    /* 省略处理电报的代码... */\n```\n\n```c\n\
    }\n```\n\n在上面的示例中，`assert` 是一种带有描述断言理由注释的保护机制。始终要带有注释，最好的注释是那些你不需要写的，因为代码已经足够清晰了。指定代码的意图是迈向清晰的一，而断言本身证明是一个极佳的构造，用于：\n\
    \n断言上下文惯用通过合并描述断言上下文的注释（即它所指的内容）增加了代码的可读性。这个上下文以字符串的形式添加，它在断言表达式中始终求值为真。单行断言现在在传达其上下文方面是自解释的：\n\
    \n### 应用惯用法\n\n- 1 `assert(receiver) && \"Is validated by the caller\";`\n\n除了主要目的之外，向代码的人类读者传达接收者是有效的，“断言上下文”还允许其进行自调试。当断言触发时，它会将关于特定部分的信息写入标准错误文件。这些信息的呈现方式取决于实现，但它将包含参数的文本。通过在断言中使用仔细选择的描述性字符串，代码作者可以在不看源码的情况下对失败做出有根据的推测。由于提供了快速的反馈，我发现这一特性在由单元测试驱动的短、增量开发周期中特别有用。\n\
    \n断言上下文的缺点是字符串占用的内存。在小型嵌入式应用中，它对可执行文件的大小可能有明显影响。然而，重要的是，`assert` 是纯调试功能，不会影响发布版本；使用\
    \ NNDEBUG 编译将移除所有断言以及上下文字符串。\n\n## 常量在左 (CONSTANTS TO THE LEFT)\n\n### 问题背景\n\n\
    C 语言拥有丰富的运算符。该语言在用法上也非常自由。尽管“信任程序员”这一口号感觉多么自由，但它对错误的保护也较少，某些错误比其他错误更频繁。这样推测也不过分：几乎每个\
    \ C 程序员在严重缺乏咖啡因的某个时刻，都可能曾错误地写了赋值而不是比较。\n\n- 1 `int x = 0;`\n- 2 \n- 3 `if(x =\
    \ 0)`\n- 4 `{`\n- 5\n```c\n/* 这永远不会为真！ */\n```\n- 6 \n```c\n}\n```\n\n那么，为什么不简单地在比较中禁止赋值呢？嗯，虽然我个人会避免它，但比较中的赋值有时实际上是有意义的。\n\
    \n```c\nFriend* aGoodFriend = NULL;\n...\nif(aGoodFriend = findFriendAt(address))\n\
    {\n    sayHelloTo(aGoodFriend);\n}\nelse\n{\n    printf(\"I am not your friend\"\
    );\n}\n```\n\n编译器应该如何区分第一个错误的情况和正确的情况呢？\n\n### 应用惯用法\n\n通过在比较中保持“常量在左”，编译器将捕获错误的赋值。像这样的语句：\n\
    \n```c\nif(0 = x) { }\n/* 如果 x 为零，我们就会到达这里——正确！ */\n```\n\n这不是有效的 C 语言，编译器将被强制发出诊断信息。在修正\
    \ if 语句后，使用这种惯用法的代码看起来如下：\n\n```c\nif(0 == x)\n{\n    /* 如果 x 为零，我们将到达这里——正确！\
    \ */\n}\n```\n\n这种惯用法在涉及指针的断言中同样有效。\n\n```c\nassert(NULL == myPointer);\n```\n\
    \n尽管具有显而易见的优势，“常量在左”的惯用法并没有完全共识。许多丰富的程序员认为它让代码更难读，并且编译器会对任何地方可能的赋值发出警告。这有一定道理。我只想补充一点，重要的是编译器并不要求对此类用法发出警告。从可读性方面来说，这种惯用法已经使用了多年，C\
    \ 程序员为了理解他人的编码风格也必须知道它。\n\n## 总结\n\n本章的惯用表达式集合几乎是完整的。C 语言中有许多惯用法，每一种都解决一个不同的问题。这一级别的惯用法实际上高于语言构造。因此，学习曲线是平缓的。将编码风格转变为使用它们是小小的一步，我相信会带来即时的益处。\n\
    \n## 参考文献\n\n-mann, F., Meunier, R., Rohnert, H., Sommerlad, P., and Stal, M.,\
    \ \"POSA, A System of Patterns Volume 1\", Wiley\n- Dijkstra (1972). The Humble\
    \ Programmer\n- Gamma, E., Helm, R., Johnson, R., and Vlissides, J, \"Design Patterns\"\
    , Addison-Wesley\n- ISO/IEC 9899:1999, The C standard\n- Kafka, F. \"The Metamorphosis\"\
    , Addison-Wesley\n- Kerievsky, J. \"Refactoring to Patterns\", Addison-Wesley\n\
    - Kernighan, B., and Ritchie, D., \"The C Programming Language\", Prentice Hall\n\
    - Martin, R. C. \"Agile Software Development\", Prentice Hall\n- Page-Jones, A.\
    \ \"The Practical Guide to Structured Systems Design\", Prentice Hall\n- Petersen,\
    \ A. _The complete REACTOR sample code used in this article, _http://www.adampetersen.se/ReactorSample\n\
    - Schmidt, Stal, Rohnert, Buschmann: \"Pattern-Oriented Software Architecture,\
    \ volume 2\", Wiley\n- Sedgewick, R., \"Algorithms in C, Parts 1-4\", Addison-Wesley\n\
    - Vlissides, J. \"Pattern Hatching\", Addison-Wesley\n\n"
