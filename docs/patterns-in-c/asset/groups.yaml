    \ the code expensive to modify.\n\n## From a Performance Perspective\n\nMaking\
    \ things worse, the solution above fails to scale in terms of performance as well.\
    \ As all events are scanned serially, even in case timeouts used, valuable time\
    \ is wasted nothing.\n\nThe potential performance problem may be derived from\
    \ the failure of taking the concurrent nature of the problem into account. One\
    \ approach to address this problem by introducing multiple threads. The diagnostics\
    \ server keeps its event loop, the loop is now reduced to scan for requests. As\
    \ a connection is requested, a new thread is allocated exclusively for handling\
    \ messages on that new connection.\n\nThe multithreaded approach fails to address\
    \ the overall design issue as it violates both the single responsibility principle\
    \ and the open-closed principle. Although the code for scanning and dispatching\
    \ diagnostics is moved out of the event loop, adding a new server-port still requires\
    \ modifications to existing code.\n\nFrom a design perspective threads doesn't\
    \ improve anything. In fact, even with respect to performance, this solution may\
    \ due to context switches and synchronization actually perform worse than the\
    \ initial single-threaded approach.\n\nThe sheer complexity inherent in designing\
    \ and implementing multithreaded applications is a further argument for discarding\
    \ this solution.\n\n## Problem Summary\n\nSummarizing the experience so far, the\
    \ design fails as it assumes these three different responsibilities. The problem\
    \ is bound to be worse as the design violates the open-closed principle, making\
    \ modifications to existing code more costly.\n\nSummarizing the ideal solution,\
    \ it would scale, encapsulate and decouple the different responsibilities, and\
    \ be able to serve multiple clients simultaneously without introducing the liabilities\
    \ of multithreading. The REACTOR pattern realizes this solution by encapsulating\
    \ each service of the application logic in event handlers and separating out the\
    \ code for event demultlexing.\n\n## The REACTOR Pattern\n\nThe intent of the\
    \ REACTOR pattern is: \"The architectural pattern allows event-driven requests\
    \ to demultiplex and dispatch service requests that are delivered to an application\
    \ from one or more clients\" [Schmidt et al]\n\n![](img/36484cd32ea2e3eb1b027e721e2669a9_44_0.png)\n\
    \nIllustration 2: Demultiplex to decoupled event handlers.\n\nThe roles of the\
    \ involved participants are:\n\n- EventHandler: An EventHandler defines an interface\
    \ to be implemented by modules reacting to events. Each EventHandler owns its\
    \ own Handle.\n- Handle: An efficient implementation of the REACTOR pattern requires\
    \ an OS that supports handles (examples of Handlers include system resources like\
    \ files, sockets, and timers).\n- DiagnosticsServer and Diagnostics: These are\
    \ two event handlers, in order to receive event notifications, the concrete event\
    \ handlers have reason to register themselves at the Reactor.\n- Reactor: The\
    \ Reactor maintains registrations of EventHandlers and fetches the associated\
    \ Handles. The Reactor waits on its set of registered Handles and invokes the\
    \ corresponding EventHandler as a Handle indicates an event.\n\n## Event Detection\n\
    \nIn its description of the Reactor, Pattern-Oriented Software Architecture [Schmidt\
    \ et al] defines a further collaborator, the Synchronous Event Demlexer. The Synchronous\
    \ Event Demlexer is called by the Reactor to wait for events to occur on the registered\
    \ handlers.\nA synchronous event demlexer is provided by the operating system.\
    \ This example will use poll(), select() and Win32WaitForMultipleObjects(or other\
    \ functions available on common operating systems), which works with any descriptor.\n\
    The code interacting with poll() will only be provided as a sketch, as the POSIX\
    \ specific details are outside the scope of this article. The complete sample\
    \ code, in this article, is available from my homepage [Petersen].\n\n## Implementation\
    \ Mechanism\n\nThe collaboration between an EventHandler and the Reactor is similar\
    \ to the interaction between an observer and its subject in the design pattern\
    \ OBSERVER [Gamma, et al]. This relationship between these two patterns indicates\
    \ that the techniques used to realize OBSERVER in C may serve well to implement\
    \ the REACTOR.\nIn order to decode the Reactor from its handlers and still enable\
    \ the Reactor to notify them, each concrete event handler must correspond to a\
    \ unique instance. In our OBSERVER implementation, the FIRST-CLASS AD pattern\
    \ is used to solve this problem. As all concrete event handlers have to be abstracted\
    \ as one, generic type realizing the EventHandler interface, void is chosen as\
    \ the \"general type\" to be registered at the Reactor (please refer to the previous\
    \ part in this series for the rationale and technical reasons behind the void\
    \ abstraction). These decisions enable a common interface for all event handlers:\n\
    \nListing 1 : Interface of the event handlers, EventHandler.h\n\n```c\n/* The\
    \ type of a handler is system specific - \n   this example uses UNIX I/O handlers,\
    \ which are \n   plain integer values. */\n\ntypedeftypedef int Handle;\n\n/*\
    \ All interaction from Reactor to an event\n   handler goes through function pointers\
    \ with the\n   following signatures: */\n\ntypedef Handle (*getHandleFunc)(void*\
    \ instance);\ntypedef void (*EventHandlerFunc)(void* instance);\n\ntypedef struct\n\
    {\n  void* instance;\n  getHandle getHandle;\n  handleEvent handleEvent;\n} EventHandler;\n\
    ```\n\nHaving this interface in place allows us to declare the registration functions\
    \ of the Reactor.\nListing 2 : Registration interface of the Reactor, Reactor.h\n\
    \n```c\n#include \"EventHandler.h\"\n\nvoid Register(EventHandler* handler);\n\
    void Unregister(EventHandler* handler);\n```\n\nThe application specific services\
    \ have to implement the EventHandler interface and register themselves using the\
    \ interface in order to be react to events.\nListing 3 : Implementation of a concrete\
    \ event handler, DiagnosticsServer.\n\n```c\n#include \"EventHandler.h\"\n\nstruct\
    \ DiagnosticsServer {\n  Handle listeningSocket;\n  EventHandler eventHandler;\n\
    \  /* Other attributes here... */\n};\n/* Implementation of the EventHandler interface.\
    \ */\nstatic Handle getServerSocket(void* instance) {\n  const DiagnosticsServerPtr\
    \ server = instance;\n  return server->listeningSocket;\n}\nstatic void handleConnectRequest(void*\
    \ instance) {\n  DiagnosticsServerPtr server = instance;\n  /* The server gets\
    \ notified as a new connection request arrives. Add code for accepting the new\
    \ connection and creating a client here... */\n}\nDiagnosticsServerPtr createServer(unsigned\
    \ int tcpPort) {\n  DiagnosticsServerPtr newServer = malloc(sizeof(*newServer));\n\
    \  if(NULL != newServer) {\n    /* Code for creating the server socket here.\n\
    \    /* The real code should look for a failure, etc. */\n    newServer->listeningSocket\
    \ = createSqlServer(tcpPort);\n    /* Successfully created -> register the\n \
    \   listening socket. */\n    newServer->eventHandler.instance = newServer;\n\
    \    newServer->eventHandler.handleEvent = getSqlServer();\n    newServer->eventHandler.handleEvent\
    \ = handleConnectRequest;\n    Register(&newServer->eventHandler);\n  }\n  return\
    \ newServer;\n}\nvoid destroyServer(DiagnosticsServerPtr server) {\n  /* Before\
    \ deleting the server we have to\n  unregister at the Reactor. */\n  Unregister(&server->eventHandler);\n\
    \  free(server);\n}\n```\n\n## Reactor Registration Strategy\n\nWhen implementing\
    \ the concrete event handlers as a FIRST-CLASS AD, the functions for creating\
    \ and destroying serve to encapsulate the registration handling. The advantage\
    \ is the combination of loose dependencies with information hiding as a client\
    \ does not have to know about the usage and interactions with the Reactor.\n\n\
    Another reality is that the internals of the server, in our example the handles,\
    \ is encapsulated within the getSqlServer function. Sure, by giving the Reactor\
    \ a way to fetch it, but the Reactor is considered a well-trusted collaborator\
    \ and we are actively getting it by registering our event handler.\n\n## Reactor\
    \ Implementation\n\nThe details of the Reactor implementation are platform specific\
    \ as they depend upon the available synchronous demultiplexers. In the case operating\
    \ system provides more than one synchronous demultiplexer (e.g. select() and poll()),\
    \ a Reactor may be implemented for each one them and the linker used to choose\
    \ one of them depending on the problem at hand. This technique is referred to\
    \ as link-time polymorphism.\n\nEach implementation has to decide the number of\
    \ reactors required by the surrounding environment. In the most case, the application\
    \ can be structured around one, single Reactor. In this case, the interface in\
    \ Listing 2 (Reactor.h) will serve. An application requiring more than one Reactor\
    \ should consider making the Reactor itself a FIRST-CLASS ADT. This variant complicates\
    \ the clients slightly as references to the Reactor ADT have to be maintained\
    \ and passed around in the system.\n\nIndependent of the system specific demultiplexing\
    \ mechanism, a Reactor has to maintain a collection of registered, concrete event\
    \ handlers. In its simplest form, this collection may simply be an array. This\
    \ approach serves well in case the maximum number of clients is known in advance.\n"
  mdcn: "\n\n## REACTOR 模式\n\n事件循环中的逻辑。显然，这种设计使得代码的修改代价很大。\n\n## 从性能角度来看\n\n更糟糕的是，上述解决方案在性能方面也无法扩展。由于所有事件都是串行扫描的，即使使用了超时机制，也白白浪费了宝贵的时间。\n\
    \n潜在的性能问题可能源于没有考虑到问题的并发性。解决这一问题的一种方法是引入多个线程。诊断服务器保留其事件循环，该循环现在被缩减为扫描请求。当请求连接连接时，会分配一个新线程专门用于处理该新连接上的消息。\n\
    \n多线程方法未能解决整体设计问题，因为它既违反了单职责原则，也违反了开闭原则。尽管扫描和分发诊断信息的代码已移出事件循环，但添加新的服务器端口仍然需要对现有代码进行修改。\n\
    \n从设计角度来看，线程并没有改善任何问题。事实上，即使在性能方面，这种解决方案可能由于上下文切换和同步机制，其实际表现比最初的单线程方法更差。\n\n设计和实现多线程应用程序固有的极其复杂性，是放弃这一解决方案的进一步理由。\n\
    \n## 问题总结\n\n总结目前为止的经验，该设计是失败的，因为它假设了这三个不同的职责。由于设计违反了开闭原则，问题将更加糟糕，使得对现有代码的修改代价更高。\n\
    \n总结理想的解决方案：它应该是可扩展、封装并解耦不同职责，并且能够同时为多个客户端服务而不引入多线程的副作用。REACTOR 模式通过将应用程序逻辑的每个服务封装在事件处理器中，并将事件复用的代码分离来实现这一解决方案。\n\
    \n## REACTOR 模式\n\nREACTOR 模式的意图是：“该体系模式允许事件驱动请求复用并分发从一个或多个客户端传递给应用程序的服务请求” [Schmidt等]\n\
    \n![](img/36484cd32ea2e3eb1b027e721e2669a9_44_0.png)\n\n图 2：复用到解耦的事件处理器。\n\n涉及参与者的角色如下：\n\
    \n- EventHandler：EventHandler 定义了一个供对事件响应的模块实现的接口。每个 EventHandler 拥有它自己的 Handle（句柄）。\n\
    - Handle：REACTOR 模式的高效实现需要支持句柄的操作系统（Handler 的示例包括系统资源，如文件、套接字和定时器）。\n- DiagnosticsServer\
    \ 和 Diagnostics：这些是两个事件处理器，为了接收事件通知，具体的事件处理器有理由在 Reactor 上注册自己。\n- Reactor：Reactor\
    \ 维护 EventHandlers 的注册并获取关联的 Handles。Reactor 等待其一组注册的 Handles，当 Handle 指示事件发生时，调用相应的\
    \ EventHandler。\n\n## 事件检测\n\n在对 Reactor 的描述中，《面向模式的软件体系》[Schmidt等] 定义了另一个协作者：同步事件多路复用（Synchronous\
    \ Event Demlexer）。Reactor 调用同步事件多路复用以等待在已注册的处理器上发生事件。\n同步事件多路复用由操作系统提供。本示例将使用\
    \ `poll()`、`select()` 和 Win32WaitForMultipleObjects（或其他常用操作系统上可用的函数），它可以与任何描述符配合。\n\
    与 `poll()` 交互的代码仅作为草图提供，因为 POSIX 特定的细节不在本文的范围内。本文中的完整示例代码可以从我的主页 [Petersen] 获取。\n\
    \n## 实现机制\n\nEventHandler 与 Reactor 之间的协作类似于设计模式 OBSERVER [Gamma，等] 中观察者与其主体之间的交互。这两种模式之间的关系表明，在\
    \ C 中中实现 OBSERVER 所用的技术可以很好地用于实现 REACTOR。\n为了将 Reactor 从其处理器中解耦并让 Reactor 通知它们，每个具体的事件处理器必须对应一个唯一的实例。在我们的\
    \ OBSERVER 实现中，使用了 FIRST-CLASS AD 模式来解决这个问题。由于所有具体的事件处理器都必须抽象为一个实现 EventHandler\
    \ 接口的单一通用类型，因此选择 `void` 作为在 Reactor 上注册的“通用类型”（请参阅本系列的上部分，以了解 `void` 抽象背后的原理和技术原因）。这些决策为所有事件处理器提供了一个通用接口：\n\
    \n列表 1：事件处理器的接口，EventHandler.h\n\n```c\n/* 处理器的类型是系统特定的 - \n   本示例使用 UNIX I/O\
    \ 处理器，它们\n   是普通的整数值。 */\n\ntypedeftypedef int Handle;\n\n/* 从 Reactor 到事件处理器的所有交互\n\
    \   都通过具有以下签名的函数指针进行： */\n\ntypedef Handle (*getHandleFunc)(void* instance);\n\
    typedef void (*EventHandlerFunc)(void* instance);\n\ntypedef struct\n{\n  void*\
    \ instance;\n  getHandle getHandle;\n  handleEvent handleEvent;\n} EventHandler;\n\
    ```\n\n拥有此接口允许我们声明 Reactor 的注册函数。\n列表 2：Reactor 的注册接口，Reactor.h\n\n```c\n#include\
    \ \"EventHandler.h\"\n\nvoid Register(EventHandler* handler);\nvoid Unregister(EventHandler*\
    \ handler);\n```\n\n应用程序特定的服务必须实现 EventHandler 接口并使用接口注册自己，以便对事件做出响应。\n列表 3：具体事件处理器的实现，DiagnosticsServer。\n\
    \n```c\n#include \"EventHandler.h\"\n\nstruct DiagnosticsServer {\n  Handle listeningSocket;\n\
    \  EventHandler eventHandler;\n  /* 其他属性在此... */\n};\n/* EventHandler 接口的实现。 */\n\
    static Handle getServerSocket(void* instance) {\n  const DiagnosticsServerPtr\
    \ server = instance;\n  return server->listeningSocket;\n}\nstatic void handleConnectRequest(void*\
    \ instance) {\n  DiagnosticsServerPtr server = instance;\n  /* 当新连接到达时服务器接收通知。在此处添加接受新连接的代码...\
    \ */\n}\nDiagnosticsServerPtr createServer(unsigned int tcpPort) {\n  DiagnosticsServerPtr\
    \ newServer = malloc(sizeof(*newServer));\n  if(NULL != newServer) {\n    /* 创建服务器套接字。在此处应检查失败等。\
    \ */\n    newServer->listeningSocket = createSqlServer(tcpPort);\n    /* 成功创建\
    \ -> 注册套接字。 */\n    newServer->eventHandler.instance = newServer;\n    newServer->eventHandler.handleEvent\
    \ = getSqlServer(); // 注意：此处原文可能存在逻辑或语法错误\n    Register(&newServer->eventHandler);\n\
    \  }\n  return newServer;\n}\nvoid destroyServer(DiagnosticsServerPtr server)\
    \ {\n  /* 在删除服务器之前，必须在 Reactor 上注销。 */\n  Unregister(&server->eventHandler);\n\
    \  free(server);\n}\n```\n\n## Reactor 注册策略\n\n当使用 FIRST-CLASS AD 实现具体的事件处理器时，创建和销毁函数封装了注册处理。优点是松耦合的信息隐藏，因为客户端不需要知道\
    \ Reactor 的用法和交互。\n\n另一个现实是服务器内部（在本例中为句柄）封装在 `getSqlServer` 函数中。当然，通过给 Reactor\
    \ 获取它的方法，但 Reactor 被认为是一个可靠的协作者，我们通过注册事件处理器来主动获取它。\n\n## Reactor 实现\n\nReactor\
    \ 实现的细节是平台特定的，因为它们取决于可用的同步多路复用器。如果操作系统提供多个同步多路复用器（例如 `select()` 和 `poll()`），可以为每一个一个实现一个\
    \ Reactor，并使用链接器根据当前的问题选择其中一个。这种技术被称为链接时多态。\n\n每个实现必须决定环境所需的 Reactor 数量。在大多数情况下，应用程序可以围绕一个单一\
    \ Reactor 构建。在这种情况下，列表 2 (Reactor.h) 中的接口就足够了。需要多个 Reactor 的应用程序应考虑将 Reactor 本身变为\
    \ FIRST-CLASS ADT。这种变体增加了客户端的复杂性，因为需要在系统中维护和传递 Reactor ADT 的引用。\n\n独立于系统特定的多路复用机制，Reactor\
    \ 必须维护一个已注册的具体事件处理器的集合。在最简单的形式下，这个集合可以是一个数组。这种方法在提前知道最大客户端数量的情况下非常好。\n\n"
