    \ as a finite state machine.\n\nOn the other hand, if the placement in a category\
    \ is the result of a membership fee, STRATEGY is a better abstraction. It is possible\
    \ for a customer to wander between different categories, a transition to a new\
    \ category doesn't depend upon the history of that customer.\n\nAlthough not to\
    \ be taken a universal truth, a further observation relates to the usage of these\
    \ patterns and relationships towards the client: STATE tends to be an internal\
    \ concern of the context and the existence of STATE is usually encapsulated in\
    \ the context. Contrasting this with STRATEGY, the client usually binds a strategy\
    \ to its context."
  - '[PAGE 31]


    # Consequences


    The main consequences of applying the STRATEGY pattern are:


    +   1. The benefits of the open-closed principle. The design pattern STRATEGY
    offers great flexibility that it allows clients to change and control the behavior
    of an existing module by implementing their own, concrete strategies. Thus, however
    is supported by adding new code instead of modifying code.

    2. Reduces complexity, conditional logic. Complex interactions may lead to monolithic
    modules littered with conditional logic, potentially in the form of control coupling.
    Such code tends to be hard to maintain and extend. By encapsulating each branch
    of the conditionals in a strategy, the STRATEGY pattern eliminates conditional
    logic.

    3. Allows different versions of the same algorithm. The non-functional requirements
    on a module may vary depending on its usage. The typical trade-off between speed
    versus memory usage is classic. Using the Strategy pattern, the choice of trade-offs
    may be delegated to the user (“Strategies can provide different implementations
    of the same behavior”) (Gamma, et al.).

    4. An extra level of indirection. The main issue with this consequence arises
    as data from the context has to be obtained in a strategy. As all functions used
    as strategies have to follow the same signature, simply adding potentially unrelated
    parameters lowers the cohesion. Implementing the context as a FIRST-CLASS AD may
    solve this as it reduces the parameters to a single handle. With the FIRST-CLASS
    ADT approach, the knowledge about the data of interest is encapsulated within
    each strategy and obtained through the handle to the FIRST-CLASS ADT. A careful
    design should strive to keep the module implemented as a FIRST-CLASS ADT highly
    cohesive and avoid it decaying into a repository of unrelated data needed by different
    strategies (such a design ill typically indicates that the wrong abstraction has
    been chosen). Similarly, in case the flexibility of the STRATEGY pattern isn''t
    needed and the problem may be solved by conditional logic that is easy to follow,
    the latter is probably a better choice.


    # Example of use


    STRATEGY may prove useful for specifying policies in framework design. Using STRATEGY,
    clients may parameter the implementation.


    For example, error-handling is typically delegated to the application. Such a
    design may be realized by letting the client provide a strategy to be invoked
    upon an error. By those means, the error may be handled in an application specific
    manner, which may stretch between simply ignoring the error to logging it or even
    reboot the system.'
- md: "\n# The OBSERVER Pattern\n\n## Reflections on OBSERVER\n\nAs I wrote the original\
    \ patterns articles I based the implementations on actual experience from several\
    \ production code. Over the previous years I had collected notes and sample implementations\
    \ of several well-known patterns. My initial plan was to publish five articles,\
    \ starting with the more general patterns first. That left me in the position\
    \ where I had to choose and prioritize between the patterns. The first three (First-Class\
    \ ADT, STATE and STRATEGY) were all given. And I knew I wanted to finish with\
    \ a discussion of the REACTOR pattern. Clearly, some patterns had to\n\nI finally\
    \ selected OBSERVER. In retrospect, other patterns would probably have made a\
    \ better candidate. The FACADE (Gamma, et al), for example, is straightforward\
    \ and natural in C. In the end I went with the OBSERVER for reasons: preparation\
    \ and generality.\n\nFirst, the implementation mechanisms I used in the OBSERVER\
    \ are similar to the ones I tend to use for the REACTOR. As, the OBSERVER implementation\
    \ could serve as a gentle introduction to the more complex architectural REACTOR\
    \ pattern.\n\nSecond, event notification is a part of many applications. Decoupling\
    \ the sender and receiver of a event notification is central. Today, many programming\
    \ languages have come to include native support for OBSERVER. C#, for example,\
    \ provides a general version with its events mechanism. And of course Common Lisp\
    \ has it through the before and after methods that make OBSERVER implementations\
    \ both trivial and expressive. In C, we have to go through more challenges to\
    \ arrive at an implementation that fits. Done right, observers can still be a\
    \ viable solution.\n\n## Implementing OBSERVER\n\nManaging dependencies between\
    \ entities in a system is crucial to a solid design. In the previous chapter we\
    \ had a look at the head of the open-closed principle. Now we'll turn to another\
    \ principle for dependency management and illustrate how both of these may be\
    \ realized using the OBSERVER pattern.\n\n## Dependencies arise\n\nReturning to\
    \ the examples used for the STATE pattern, they described techniques for implementing\
    \ the behavior of a simple stop-watch. Implementing such a watch typically involves\
    \ the task of fetching the time from some kind of time-source. As the time-source\
    \ would probably be tied to interactions with the operating system, it is a good\
    \ idea to encapsulate it in an abstraction hiding the system specific parts in\
    \ order to use testing and portability. Similarly, the internals of the digital\
    \ stop-watch should be encapsulated in a module of its. As the digital stop-watch\
    \ is responsible for fetching the time from the time-source (in order to present\
    \ it on its digital display), it clears that there will be a dependency between\
    \ the watch and the time-source. There are two obvious choices for the direction\
    \ of this dependency.\n\n## Consider the Watch as a Client\n\nIt may seem rather\
    \ natural to consider the watch as a client of the time-source. That is, ... Unfortunately,\
    \ implementing the dependency in this direction introduces one obvious problem:\
    \ how does the watch know if the time changes? The quick answer is: it doesn't.\
    \ At least it doesn't unless it introduces some kind of polling mechanism towards\
    \ the time-source. Just as important as it is to avoid premature optimization,\
    \ one should also strive to avoid premature pessimization:\n\n# The Observer Pattern\n\
    \neven if the direction of the dependency seems correct, this solution is very\
    \ likely to be extremely CPU consuming. In case the application needs to do more\
    \ than updating a display, the problem calls for another solution.\n\n## Let the\
    \ Time-Source update the Watch\n\nThe potential capacity described above may easily\
    \ be avoided by reversing the dependency. The time-source may simply notify the\
    \ watch as its time changes. This approach introduces a dependency from the time-source\
    \ upon the watch.\n\nListing 1: Code for the time-source\n\n```\n#include \"DigitalStopwatch.h\"\
    \n#include \"SystemTime.h\"\n\nstatic DigitalStopWatchPtr digitalWatch;\nstatic\
    \ SystemTime currentTime;\n\n/* Invoked by the application at start-up. */\nvoid\
    \ startTimeSource() {\n    digitalWatch = createWatch();\n\n    /* Code for setting\
    \ up handlers for interrupts, or\nthe like, in order to get notified each millisecond\n\
    from the operating system. */\n\n}\n\n/* This function is invoked through an\n\
    interaction with the operating system. */\nstatic void mTick() {\n    /* Invoke\
    \ a function encapsulating the knowledge of\n    time representation. */\n   \
    \ currentTime = calculateNewTime();\n\n    /* Inform the watch that another millisecond\
    \ passed. */\n    notifyChangedTime(digitalWatch, currentTime);\n}\n```\n\nThe\
    \ attractiveness of this solution lies in simplicity. However, if scalability\
    \ and flexibility are desired properties of the solution, the trade-offs are unacceptable.\
    \ The potential problems introduced are best described in terms of the principles\
    \ that this design violates.\n\n## The Open-Closed Principle\n\nHaving a recap\
    \ on the open-closed principle, it is summarized as \"Software entities (classes,\
    \ modules, functions, etc.) should be open for extension, but closed for modification\"\
    \ [Martin]. The code for the source clearly violates this. In its current shape\
    \ it supports only a single watch of one type. Imagine supporting other types\
    \ of watches, for example with an analog display. The code for the timesource,\
    \ due to its hard-coded notification, explode with dependencies in all directions\
    \ on all types of watches.\n\n## The Stable Dependencies Principle\n\nDuring software\
    \ maintenance or incremental development changes to existing code are normally\
    \ unavoidable; even when applying the open-closed principle the design is just\
    \ closed against certain modifications based upon assumptions by the original\
    \ designer (it is virtually impossible for a software entity to be completely\
    \ closed against all kinds of changes). the stable dependencies principle tries\
    \ to isolate the impact of changes to existing code by making the recommendation\
    \ that software entities should \"depend in the direction of stability\"[Martin].\n\
    \nIn the initial approach, the watch fetched the direction from the time-source.\
    \ With respect to the stable dependencies direction, this was a better choice.\
    \ A time-source is typically a highly cohesive unit and the more stable entity;\
    \ simply encapsulating it in a proper abstraction, which hides the system details,\
    \ makes it a good candidate to be packed in a reusable lower-level domain.\n\n\
    By having the timesource depend upon the higher-level digital watch, we violate\
    \ the stable dependencies principle. This violation manifests itself by making\
    \ the code for the watch to update.\n\nCombining the dependency direction of the\
    \ first approach with the notification mechanism of the second would make it an\
    \ ideal design and the design pattern OBS provides the extra level of independence\
    \ necessary to achieve the benefits of both solutions without suffering from any\
    \ of their.\n\n## OBSERVER\n\nThe OBSERVER pattern serves as a tool for making\
    \ the open-closed principle work. Design Patterns [Gama, et] captures the intent\
    \ of OBSERVER to \"Define a one-to-many dependency between objects that when one\
    \ object changes state, all its dependents are notified and updated automatically\"\
    . Applying the OBSERVER pattern to our example, with a second type of watch, the\
    \ \"dependents\" are the different watches. Design Patterns define the role played\
    \ by TimeSource as a \"concrete subject\", the object whose state changes should\
    \ trigger a notification and update of the observers, i.e. Observers.\n\n![](img/36484cd32ea2e3eb1b027e721e2669a9_34_0.png)\n\
    \nIllustration 1: The decoupler and receivesver through OBSERVER.\n\n## Implementation\
    \ Mechanism\n\nIn order to decouple the subject from its concrete observers and\
    \ still enable the subject to notify them, each observer must correspond to a\
    \ unique instance. The FIRST-CLASS ADT pattern provides a way to realize this.\
    \ However, as seen from the subject, all observers must be abstracted as one,\
    \ general type sharing a common interface. In the C language, without language\
    \ support for inheritance, generality is usually spelled \\void*; any pointer\
    \ to an object may be converted to \\void* and back to its original type again\
    \ without loss of information.\n\nListing 2: Interface of the observers, TimeObserver.h\n"
  mdcn: "\n\n# 观察者模式 (OBSERVER)\n\n## 对观察者模式的反思\n\n在我编写最初关于模式的文章时，我是基于几段生产代码的实际经验编写实现的。在过去的几年里，我收集了一些常用模式的笔记和示例实现。我最初的计划是发布五篇文章，从更通用的模式开始。这导致我必须在这些模式之间进行选择和排序。前三个（一类\
    \ ADT、状态模式 STATE 和策略模式 STRATEGY）都已给出。我知道我想通过对反应器模式 REACTOR 的讨论来结束全文。显然，某些模式必须被选出来。\n\
    \n我最终选择了观察者模式（OBSERVER）。回想起来，其他模式可能是更好的候选者。例如，门面模式 FACADE（Gamma 等人）在 C 语言中既直接又自然。最后，我选择观察者模式是出于：准备工作和通用性。\n\
    \n首先，我在观察者模式中使用的实现机制与我倾向于用于反应器模式的机制相似。观察者模式的实现可以作为引入更复杂的架构——反应器模式的入门。\n\n其次，事件通知是许多应用程序的一部分。解耦事件通知的发送者和接收者是核心。今天，许多编程语言已经包含了对观察者模式的原生支持。例如，C#\
    \ 通过其事件机制提供了一个通用版本。当然，Common Lisp 通过之前和之后的方法方法拥有它，这使得观察者模式的实现既简单又具有表现力。在 C 语言中，我们必须面对更多挑战才能获得合适的实现。如果做得好，观察者仍然是一个可行的解决方案。\n\
    \n## 实现观察者模式\n\n管理系统中实体之间的依赖关系对于健壮的设计至关重要。在上一章中，我们查看了开闭原则的核心。现在，我们将转向另一个依赖管理原则，并说明如何使用观察者模式来实现这两种原则。\n\
    \n## 依赖的产生\n\n回到用于状态模式的示例中，它们描述了实现简单秒表行为的技术。实现此类秒表通常涉及从某种时间源获取时间的任务。由于时间源可能与操作系统的交互绑定，因此将其封装在一个抽象中以隐藏系统特定的部分，是一个好主意，以便于测试和可移植性。同样，数字秒表的内部结构也应该封装在它自己的模块中。由于数字秒表负责从时间源获取时间（为了显示在它的数字显示屏上），显然秒表和时间源之间存在依赖关系。这种依赖的方向有两个显而易见的选择。\n\
    \n## 将秒视为视为\n\n将秒表视为时间源的客户端似乎相当自然。也就是说……遗憾的是，在这个方向上实现依赖引入了一个显而易见的问题：秒表如何知道时间变化了？快速回答是：它不知道。至少，除非它对时间源引入了某种轮询机制。正如避免过早优化同样重要，人们也努力避免过早悲观化：\n\
    \n# 观察者模式\n\n即使依赖的方向看起来是正确的，这种解决方案也很可能消耗大量的 CPU。如果应用程序需要执行除更新显示之外的更多操作，那么该问题就需要另一个解决方案。\n\
    \n## 让时间源更新秒表\n\n通过反转依赖关系，可以很容易避免上述的潜在问题。时间源可以在时间发生变化时只需通知秒表。这种方法引入了从时间源到秒表的依赖。\n\
    \n列表 1：时间源代码\n\n```\n#include \"DigitalStopwatch.h\"\n#include \"SystemTime.h\"\
    \n\nstatic DigitalStopWatchPtr digitalWatch;\nstatic SystemTime currentTime;\n\
    \n/* 由应用程序在启动时调用。 */\nvoid startTimeSource() {\n    digitalWatch = createWatch();\n\
    \n     /* 代码用于设置中断处理程序或\n    类似的程序，以便每毫秒从操作系统\n接收通知。 */\n\n}\n\n/* 此函数通过与操作系统的\
    \ \n交互被调用。 */\nstatic void mTick() {\n    /* 调用一个封装了时间\n    表示法知识的函数。 */\n   \
    \ currentTime = calculateNewTime();\n\n    /* 通知秒表又过去了一个毫秒。 */\n    notifyChangedTime(digitalWatch,\
    \ currentTime);\n}\n```\n\n这种解决方案的吸引力在于由于其简单性。然而，如果扩展性和灵活性是该解决方案所需要的属性，那么这种权衡是不可接受的。引入的潜在问题通过该设计所违反的原则来描述最为恰当。\n\
    \n## 开闭原则\n\n回顾一下开闭原则，它被总结为“软件实体（类、模块、函数等）应该对扩展开放，但对修改关闭” [Martin]。源代码清楚地违反了这一点。在它目前的形状下，它只支持一种类型的单个秒表。想象支持其他类型的秒表，例如带有模拟显示器的秒表。时间源代码由于其硬编码的通知，将在所有类型的秒表上产生全方向的依赖爆炸。\n\
    \n## 稳定依赖原则\n\n在软件维护或增量开发期间，现有代码的更改通常是不可避免的；即使应用了开闭原则，设计也只是根据原始设计者的假设关闭了某些修改（对于软件实体来说，完全关闭所有类型的更改几乎是不可能的）。稳定依赖原则试图通过以下建议来隔离现有代码更改的影响，即软件实体应该“向着稳定性的方向依赖”\
    \ [Martin]。\n\n在最初的这种方法中，秒表从时间源获取方向。从稳定依赖的方向来看，这是一个更好的选择。时间源通常是一个高内聚单元且更稳定的实体；只需将其封装在合适的抽象中（隐藏系统细节），就能使其成为封装在可用的低层领域的良好候选者。\n\
    \n通过让时间源依赖于高层的数字秒表，我们违反了稳定依赖原则。这种违反体现在让秒表更新的代码上。\n\n将第一种方法的依赖方向与第二种方法的通知机制相结合，将使其成为理想的设计，观察者模式提供了必要的额外独立性，以获得两种解决方案的优点，而不受任何一种的副作用。\n\
    \n## 观察者 (OBSERVER)\n\n观察者模式作为使开闭原则发挥作用的工具。设计 [Gama 等] 捕捉了观察者模式的意图：“在对象之间定义一对多的依赖，当一个对象的状态改变时，它的所有依赖者都会收到通知并更新”。将观察者模式应用于我们的示例中，带有第二种类型的秒表，“依赖者”是不同的秒表。设计模式定义了\
    \ TimeSource 扮演的角色为“具体主题”，状态改变的对象应该触发对观察者的通知和更新，即观察者。\n\n![](img/36484cd32ea2e3eb1b027e721e2669a9_34_0.png)\n\
    \n图 1：通过观察者的解耦器和接收器。\n\n## 实现机制\n\n为了将主体与其具体的观察者解耦并仍然使主体能够通知它们，每个观察者必须对应一个唯一的实例。一类\
    \ ADT 模式提供了实现这种目标的方法。然而，从主体来看，所有观察者必须抽象为一种共享通用接口的通用类型。在 C 语言中，由于缺乏继承的支持，通用性通常由\
    \ \\void* 表示；任何对象的指针都可以转换为 \\void* 并转换回其原始类型而不丢失信息。\n\n列表 2：观察者的接口，TimeObserver.h\n\
    \n"
