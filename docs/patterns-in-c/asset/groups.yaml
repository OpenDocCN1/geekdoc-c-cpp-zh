    # Consequences


    The main consequences of applying the OBSERVER pattern are:


    - 1. Introduce loose dependencies. As the subject only knows its observers through
    the Observer interface, the code conforms to the open-closed principle; by avoiding
    hard-coded notifications, any number and type of observers may be introduced as
    long as they support the Observer interface. Behavior, in the form of new type
    of observers, is added without modifying code. The loose dependencies provide
    a way to communicate between layers in a sub-system. Design Patterns [Gamma, et
    al] recognizes this: "Subject and Observer aren''t tightly coupled, they can belong
    to different layers of abstraction in a system. A lower-level subject can communicate
    with a higher-level observer, thereby keeping the system intact." This property
    may serve as a barrier against modifications by following the stable dependencies
    and enable a bidirectional communication between layers.

    - 2. Potentially complex management of object lifetimes. As illustrated above,
    the FIRST-CLASS AD pattern encapsulates the interaction with the subject. However,
    in case the subject is also implemented as a first-class object, the dependencies
    have to be resolved on a higher level and the client has to ensure that the subject
    exists as long there are observers attached to it.

    - 3. May complicate a design with cascades of notifications. If an observer plays
    a second role for other observers, a notification may result in further updates
    of these observers leading to overly complex interactions. Another problem may
    arise if an observer, during its update, modifies the resulting in a new cascade
    of notifications.

    - 4. Lowers the cohesion of the subject. Besides its central purpose (in being
    a subject also takes on the responsibility of managing and notifying observers.
    By merging two observers [note: likely error in OCR, possibly ''responsibilities'']
    in one module, the complexity of the subject is increased. This extra complexity
    is acceptable in case the loose dependencies, introduced by the OBSERVER pattern,
    provide significant benefits. Further, the subject may be simplified in cases,
    during the life of the subject, there isn''t any need to detach observers. In
    such a case, the detach function is simply omitted.

    - 5. True-safety for flexibility. The gist of the OBSERVER pattern is that the
    subject should be able to notify its dependents without any assumptions about
    what they are. I.e it is possible to have observers of different types. The solution
    here uses "void" as the abstraction of an observer. The potential problem arises
    when the subject notifies its observers and passes them as "void" to the notification
    functions. When converting a void-pointer back to a pointer of a concrete observer
    type, the compiler doesn''t have any way to detect an erroneous conversion. This
    problem may be prevented by defining a unique notification function for each different
    type of observer in using a binding such as the TimeObserver structure introduced
    above.


    # Summary


    This chapter illustrates how loose coupling with the OBSERVER pattern may serve
    as a way to implement modules following the open-closed principle. We can add
    new observers without modifying the subject. In fact, observers may even be replaced
    at runtime.


    Further, as OBSERVER reverses the dependencies it allows lower-level modules to
    notify modules at a higher abstraction without compromising layering. This property
    makes it possible to implement modules following the stable dependencies principle
    in cases where the lower layers in a system are the more stable and yet need to
    communicate with the higher layers.


    However, when hard-coded notifications are enough, by all means stick to them;
    in case the loose coupling and extra level of indirection isn''t needed, the OBSERVER
    pattern may just overcomplicate a design.


    # The REACTOR Pattern


    ## Reflections on REACTOR


    So far the patterns in this book have addressed general, recurring design problems.
    The kind of problems present in non-trivial programs. The REACTOR pattern is more
    limited in its scope. It''s a pattern that operates on the architectural level
    of design. The main reason I included it was due to the elegant separations of
    concerns in the REACTOR. As such, the pattern is a nice example of good design
    principles that have value in themselves. wait, principles that have value in
    themselves.


    Every design choice involves trade-offs. The REACTOR pattern is no exception.
    It is a non-trivial model. Yet, when used in the right context, a REACTOR provides
    an elegant programming model. Over the years I''ve worked on systems where the
    REACTOR proved to be a perfect fit. These were both systems running on hardware
    with limited capabilities. The systems received stimuli from multiple sources.
    The messages were distributed through a third-party message-middleware between
    independent Linux processes. At the same time, processes had to interface external
    systems over the network. By providing the REACTOR as a service library, a great
    deal of work could be accomplished in a relatively short amount of programming
    since the communication messages were solved. Much of the messaging, the type
    of receive would be encapsulated. When supporting, the application code could
    focus on the actual problem and rely on the SYNCHRONOUS I/O.


    The REACTOR is a pattern for SYNCHRONOUS I/O. Over the last years, asynchronous
    I/O has become much more common. In part because asynchronous I/O provides an
    opportunity for programs to take advantage of multi-core machines. If you happen
    to work in that context, I recommend you to have a look at a close relative to
    the REACTOR – the PROREACTOR pattern. A PROREACTOR specifically targets asynchronous
    read and write operations.


    ## Implementing REACTOR


    In this chapter we will step outside the domain of standard C and investigate
    a pattern for eventriven applications. The REACTOR pattern decouples different
    responsibilities and allows applications to demultiplex and dispatch events from
    potentially many clients.


    ## The case of many Clients


    In order to simplify maintenance of large systems, the diagnostics of the individual
    subsystems are gathered in one, central unit. Each subsystem connects to the server
    using TCP/IP. As TCP/IP is a connection-oriented protocol, the clients (the different
    subsystems) have to request a connection at the server. When a connection is established,
    a client may send diagnostics messages at any time.


    The brute-force approach is to scan connection requests and diagnostics messages
    from the clients by one as illustrated in the activity diagram in illustration
    1.


