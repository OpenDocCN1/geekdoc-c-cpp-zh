    despite its power, isn''t necessarily the best fit. Likewise, there may be cases
    where C isn''t the best choice. The reasons may be technical, social, or cultural.


    For, the interesting part is considering patterns from C horizon. Design Patterns
    notes that a procedural language might typically include patterns like encapsulation.
    First-Class ADT is exactly such a pattern.


