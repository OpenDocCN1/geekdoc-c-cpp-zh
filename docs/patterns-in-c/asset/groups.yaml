    \n通过使用抽象，类型安全性基本上是用灵活性换得的：将观察者转换回其原始类型的责任由程序员承担。将其转换为原始类型之外的其他类型可能会导致灾难性的后果。弗兰茨·卡夫卡虽然对\
    \ C 语言编程并不熟悉，但他提供了一个行为很好的示例：“当格里戈尔·萨姆某一天早上从不安的梦中醒来时，他发现自己躺床上变成了一只巨大的害虫” [Kafka]。显然，格里戈尔·萨姆并不是类型安全的。为了防止这种错误的转换，引入了\
    \ TimeObserver 来维护观察者与函数指针之间的绑定。隐式类型转换被封装在观察者内部，如代码所示。\n\n列表 5：实现为一类抽象数据类型（ADT）的具体观察者\n\
