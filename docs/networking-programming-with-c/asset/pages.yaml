    # ## 1.1 Overview of Computer Networks


    Computer networks are at the core of modern communication and digital infrastructure,
    established to facilitate the sharing of resources and the exchange of data among
    multiple devices. A comprehensive understanding of computer networks encompasses
    the analysis of their fundamental components, purpose, types, and operational
    methodologies.


    Computer networks are setups that connect multiple computing devices, known as
    nodes, to enable data exchange and resource sharing. These networks extend beyond
    personal computing devices to include more'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'intricate configurations, such as data centers and cloud infrastructures. The
    primary objective of constructing a network is to leverage the interaction between
    these modern computing devices to improve efficiency, collaboration, and communication
    on both small and expansive scales.


    A typical computer network comprises several components: physical media that carry
    data, hardware devices such as routers and switches that manage data flow, software
    protocols that govern data transmission and formatting, and network services that
    facilitate resource sharing and communication processes.


    # Types of Computer Networks


    Computer networks can be categorized based on their scale, functionality, and
    topology. The most common types include:


    +   1. Local Area Network (LAN): LANs are confined to a relatively small geographic
    area, such as a single building or campus. They are characterized by high data
    transfer rates and low latency. Devices within a LAN can communicate directly
    with each other, often using Ethernet cables or wireless technologies. A primary
    advantage of LANs is their ability to facilitate resource sharing, such as printers
    and local storage solutions, within a contained setting.


    +   2. Wide Area Network (WAN): WANs cover broader geographical areas, often implementing
    satellites, leased telecommunication lines, or international networks. WANs enable
    connectivity across cities, countries, or even continents. A typical example of'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'WAN is the Internet itself, which connects disparate networks across the globe.


    +   3. Metropolitan Area Network (MAN): MANs span a city or a large campus, often
    utilizing fiber optic connections to deliver high-speed Internet services within
    a metropolitan area. These networks are typically larger than LANs but smaller
    than WANs. A prevalent use case for MANs is providing broadband Internet services
    to a city where several buildings and homes are involved.


    +   4. Personal Area Network (PAN): PAN networks are used for very short-range
    communication, such as tethering mobile devices. Typically, Bluetooth and USB
    connections realize these networks, facilitating seamless and rapid data exchange
    between personal devices like smartphones, tablets, and laptops.


    +   5. Wireless Networks (WLANs and WWANs): These networks utilize wireless communication
    technologies such as Wi-Fi and cellular data networks. They align with various
    network sizes, including LANs and WWANs, delivering flexibility and mobility,
    essential in today’s mobile-first world.


    # Components of Computer Networks


    A functioning computer network comprises several critical components, each playing
    a pivotal role in ensuring efficient communication and data exchange. The core
    components include:


    +   - Network Interface Cards (NICs): These hardware components enable devices
    to connect to a network. The NIC interfaces a device’s motherboard with the'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'network medium, often offering both wired (Ethernet) and wireless (Wi-Fi) connection
    capabilities.


    +   **Switches and Hubs**: These devices facilitate data transfer within networks
    by connecting multiple devices. While hubs broadcast incoming data to all connected
    devices regardless of its destination, switches intelligently direct data to specific
    devices based on their MAC addresses.


    +   **Routers**: Routers connect multiple networks, guiding data packets between
    them while ensuring the best pathways are followed. They operate at the network
    layer, utilizing Internet Protocol (IP) addresses to determine data routes and
    manage traffic across the Internet.


    +   **Communication Media**: These include all forms of media through which data
    can be transmitted. Wired communication often relies on copper cables, fiber optics,
    or coaxial cables. Alternatively, wireless communication employs radio frequencies,
    microwaves, and infrared signals.


    +   **Communication Protocols**: Protocols are systematic sets of rules that facilitate
    data exchange between network devices. Notable protocols include the Transmission
    Control Protocol/Internet Protocol (TCP/IP), defining how data should be packetized,
    addressed, transmitted, routed, and received on the Internet.


    # Network Topologies


    Network topology denotes the layout and structure of network connections, depicting
    how various nodes are interconnected. The most prevalent topologies include:


    +   **Bus Topology**: A single central cable connects all network devices. However,
    this topology often results in'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'data collisions, which can degrade performance as more devices are added.


    +   * Star Topology: Each device in the network is connected directly to a central
    node (often a switch or hub). The failure of a single connection does not impact
    the rest of the network, making this a robust and scalable topology.


    +   * Ring Topology: Devices are arranged in a circular configuration, with each
    node connected to two others, forming a closed loop. This topology can efficiently
    handle data collisions but struggles with failures, as the entire network can
    be disrupted by a single point of failure.


    +   * Mesh Topology: Every network device is connected to multiple other devices.
    This comprehensive interconnectivity ensures high reliability and redundancy.


    +   * Hybrid Topology: By combining several topologies, hybrid structures seek
    to leverage the benefits of different configurations, addressing specific network
    requirements.


    # Network Protocols and Communication


    Protocols are crucial in computer networks to standardize communication, governing
    data formats, transmission processes, error detection, and correction. They operate
    across different layers of the OSI and TCP/IP models, ensuring that distinct applications
    and networks can interoperate efficiently.


    The OSI model characterizes layers as:


    +   * Physical Layer: Concerns with the transmission and reception of raw data
    streams over a physical medium.'
  merge: -1
  pgno: 11
