    # 2.2 The OSI Model


    The Open Systems Interconnection (OSI) model, established by the International
    Organization for Standardization (ISO), is a conceptual framework that standardizes
    the system into seven abstract layers. Each layer serves a specific role and communicates
    with directly adjacent layers to facilitate modular network architecture. Understanding
    the OSI model is essential for network designers and engineers to diagnose network
    issues and apply network protocols effectively. The OSI model consists of the
    following seven layers:


    +   - Physical Layer: This layer is the first and lowest layer in the OSI model.
    It deals with the physical connection between devices and the transmission and
    reception of raw bit streams over a physical medium. It defines the electrical,
    optical, and mechanical characteristics of the network’s hardware interfaces.
    Examples of standards at this layer include Ethernet, USB, and RS-232.'
