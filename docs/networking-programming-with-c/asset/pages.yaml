  md: '+   ClientHello: The client sends a hello message to the server, containing
    TLS version, cipher suite options, and a random number, vital for session initialization.


    +   ServerHello: On receiving the ClientHello, the server responds with a ServerHello
    message, selecting its preferred protocol version and cipher suite from those
    offered by the client, along with its provided random number.


    +   Server Certificate: The server provides its digital certificate, issued by
    a trusted Certificate Authority (CA), which the client uses to authenticate the
    server’s identity.


    +   Server Key Exchange: If necessary, the server sends a key exchange message,
    particularly in Diffie-Hellman Key Exchange scenarios.


    +   Client Key Exchange: The client generates a pre-master secret, encrypts it
    with the server’s public key, and transmits it to the server.


    +   Finished Messages: Both client and server compute a session key from the shared
    secrets and exchange encrypted Finished messages, verifying the handshake’s success.


    After this handshake, the client and the server utilize symmetric encryption with
    session keys for efficient and secure data exchange. A sample OpenSSL command
