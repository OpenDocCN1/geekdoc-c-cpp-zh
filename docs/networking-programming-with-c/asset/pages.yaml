    # ##1.2 Basics of Network Communication


    Network communication is essential in connecting diverse systems, enabling them
    to exchange data effectively across various types of networks. The principle of
    network communication involves a blend of protocols, devices, and mechanisms working
    in harmony to facilitate the transmission of information from one node to another.
    A comprehensive understanding of these fundamentals is crucial for developing
    efficient network applications and supporting seamless data flow across networks.


    At the heart of network communication lies the process of data transmission between
    sender and receiver nodes. Communication models, such as the OSI and TCP/IP models,
    provide structured approaches to understanding and implementing network communications.
    These models break down network functionalities into layers, each layer responsible
    for specific network operations that collectively enable data transmission.


    # ## Communication Models'
  merge: -1
  pgno: 14
- img_proc: true
  md: '1. OSI Model: The Open Systems Interconnection model is a conceptual framework
    used to understand network interactions in seven layers.


    +   **Physical Layer:** Handles the physical connection between devices, encompassing
    transmission and reception of raw binary data over a physical medium. This layer
    includes specifications for hardware elements such as cables, switches, and network
    interface cards.


    +   **Data Link Layer:** Facilitates reliable node-to-node transfer and manages
    error checking and frame synchronization. Protocols like Ethernet and PPP are
    governed by this layer.


    +   **Network Layer:** Manages packet forwarding through routing, addressing,
    and congestion control. It includes protocols like the Internet Protocol (IP).


    +   **Transport Layer:** Ensures end-to-end communication reliability and data
    integrity with flow control, segmentation, and error correction. Protocols like
    TCP and UDP operate at this layer.


    +   **Session Layer:** Manages sessions and synchronization between end-user applications,
    providing controls for dialog coordination.


    +   **Presentation Layer:** Concerns data translation, encryption, and compression,
    converting data from network formats to application formats.


    +   **Application Layer:** Interfaces directly with application software, facilitating
    network services like file transfers, email, and browsing.


    2. TCP/IP Model: The Transmission Control Protocol/Internet Protocol model is
    a streamlined model widely adopted for Internet-based communications. The TCP/IP
    model combines functionalities into four layers:'
  merge: -1
  pgno: 15
- img_proc: true
  md: '+   - Link Layer: Incorporates data link and physical layer responsibilities,
    managing data transfer between network interfaces.


    +   - Internet Layer: Similar to the OSI''s network layer, handling addressing
    and routing of packets across networks.


    +   - Transport Layer: Provides data transport services with reliability, error
    control, and flow control, mirroring the OSI''s transport layer.


    +   - Application Layer: Encompasses all higher-level protocols supporting Internet
    applications, analogous to the OSI''s application layer.


