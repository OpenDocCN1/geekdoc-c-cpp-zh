    # IP Addresses


    IP addresses are numerical labels assigned to each device connected to a computer
    network that uses the Internet Protocol for communication. They serve two main
    functions: identifying hosts or network interfaces, and providing the location
    of the host in the network. IP addresses are divided into two standards:


    +   1. **IPv4:** The most widely implemented version, IPv4, uses a 32-bit address
    scheme allowing for approximately 4.3 billion unique addresses. These addresses
    are typically represented in dot-decimal notation, divided into four octets, such
    as 192.168.1.1.


    +   2. **IPv6:** Due to the proliferation of internet-connected devices and a
    looming shortage of available IPv4 addresses, IPv6 was developed. This standard
    employs a 128-bit address scheme, supporting an exponentially larger number of
    unique addresses. IPv6 addresses are presented in hexadecimal, separated by colons,
    for example: 2001:0db8:85a3:0000:0000:8a2e:0370:7334.


    IP addresses also incorporate subnet masking, a technique used to divide the network
    into smaller subnets, increasing routing efficiency and address allocation.


