    # 2.3 TCP/IP Model and Protocols


    The TCP/IP model, also known as the Internet Protocol Suite, is a set of communication
    protocols that dictate how data should be packaged, transmitted, routed, and received
    in a network environment. It forms the core architecture of the Internet and many
    local networks. Unlike the OSI model with its seven layers, the TCP/IP model comprises
    four layers, each contributing to the seamless transfer of data across heterogeneous
    systems and networks. These layers are the Link layer, Internet layer, Transport
    layer, and Application layer.


    +   **Link Layer:** The Link layer, equivalent to a combination of the OSI’s Data
    Link and Physical layers, handles the intricacies of hardware addressing and the
    physical transmission of data within the same network. It encompasses protocols
    and hardware standards that facilitate communication over the network’s physical
    media. Protocols like Ethernet, Wi-Fi (IEEE 802.11), and Point-to-Point Protocol
    (PPP) are integral to this layer, ensuring that data packets are properly formatted
    for transmission over the defined medium.


    +   **Internet Layer:** Operating independently of the underlying network infrastructure,
    the Internet layer’s primary function is to control the routing of packets across
    different networks, essentially acting as the navigational component that interconnects
    vast arrays of networks into a cohesive whole known as the internet. The Internet
    Protocol (IP) serves as a cornerstone at this layer, tasked with addressing and
    forwarding packets without establishing end-to-end connections. IP operates in
    two versions: IPv4 and IPv6.'
