  md: '+   - **Data Link Layer**: This layer provides node-to-node data transfer and
    error correction through mechanisms like checksums and frame synchronization.
    It is divided into two sublayers: the Logical Link Control (LLC) sublayer that
    manages Frame Synchronization, error checking, and flow control, and the Media
    Access Control (MAC) sublayer that determines permission to access the transmission
    medium. Protocols such as Ethernet for LANs and PPP for point-to-point connections
    operate at this level.


    +   - **Network Layer**: The primary responsibility of this layer is routing the
    physical or logical paths for data transmission from source to destination across
    multiple networks. It handles packet forwarding, including routing through intermediary
    routers. Internet Protocol (IP) is the principal protocol used at this layer,
    ensuring data packets are transferred across networks.


    +   - **Transport Layer**: Providing end-to-end communication service for applications,
    the transport layer deals with error recovery, flow control, and ensures complete
    data transfer. It can provide a reliable connection-oriented service like TCP
    or a connectionless service like UDP. Error detection and correction, as well
    as data segmentation and reassembly, are key processes performed by the transport
    layer.


    +   - **Session Layer**: This layer establishes, manages, and terminates sessions
    between two communicating hosts. It controls the dialogues (connections) between
    computers, managing data exchange and providing checkpoint and recovery measures
    whenever needed. Protocols like RPC and SQL are associated with this layer.


    +   - **Presentation Layer**: Often called the syntax layer, it translates data
    between the application layer and the network format. It is responsible for data
    encryption,'
