  \n\n\n并购与收购（M&A）是许多公司增长战略中不可或缺的组成部分。并购与收购通常允许公司实现比通过内部或有机流程更快速的增长。然而，这种增长是需要代价的。\n\
  \n伴随并购收购而来的风险往往被理解不足和低估。很多时候，人们只考虑交易的潜在收益，而倾向于淡化风险。这导致公司高估了目标公司的价值，并支付了过高的溢价。\n\n\
  对于许多公司来说，并购收购是其成功的关键。例如，`Cisco` 和 `Johnson & Johnson` 如果没有他们的并购收购计划，就不会取得今天的巨大成就。此外，由于这些公司执行了许多交易，他们磨炼了识别价值目标以及在交易后将其整合到公司整体中的能力。然而，即使对于这些经验丰富的收购者，也存在重大的并购收购失败案例。\n\
  \n并购与收购是金融领域研究最充分的领域之一。大量高质量、务实的研究报告探索了并购收购的方方面面。例如，许多研究探讨了并购收购对收购方和目标公司的影响，并阐明了哪些类型的交易能够提升价值，而哪些是财富的毁灭者。另一大部分研究文献则探讨了公司治理与并购收购成功或失败相关的许多方面。这些仅仅是执从业人员可以利用丰富资源的几个例子。然而，令人惊讶的是，执从业者、交易决策者的企业世界与学术研究人员之间的桥梁尚未稳固地建立。这令人意外，因为在金融的其他领域（如投资），执从业者已经积极地利用相关研究来增强他们工作的价值。\n\
  \n虽然并购与收购已非常成功地促进了许多公司的增长，但重大并购收购失败的比例仍然高得令人担忧。令人惊讶的是，一些公司似乎无法从错误中吸取教训，并重复其并购收购的失败——有时规模还越来越大。一些董事会似乎缺乏区分能够提升价值的并购收购与会导致股东财富重大损失的并购收购的能力。\n\
  \n本书探索了并购收购成功帮助公司实现有益增长的各种方式。它寻求识别成功并购的关键，同时强调了某些陷阱，以及并购收购可能适得其反并阻碍增长的情况。通过这种方式，本书试图在执从业者与研究人员之间建立那座桥梁迈一步。它试图总结许多务实的研究，这些研究阐明了能够构建公司价值的并购收购类型，以及倾向于破坏价值的交易方面。\n\
  \n除了关注并购收购外，我们还分析了成本较低的替代方案（如合资企业和战略联盟）何时可以实现与并购收购相同的战略目标。对于没有成功的交易，我们探索了缩减规模对股东财富的积极影响。存在多种缩减规模的方案，包括剥离、股权拆分和分拆。研究显示，每种方案通常都会产生积极的股东财富影响，尽管它们在何种符合股东需求的环境上有所不同。\n\
  \n我们采取坦诚的态度来评估结果糟糕的交易。很多时候，`CEOs` 提议了导致股东损失股权价值的交易，但 `CEOs` 却能避免责备。在令人担忧的案例中，`CEOs`\
  \ 因执行交易而获得奖励，但当这些交易结果糟糕时却没有受到惩罚。董事会往往不愿指责 `CEO`，同时也拒绝为公司的并购收购失败自责。`Hewlett-Packard`\
  \ 的董事会就是一个完美的例子。我们探讨了公司治理系统的失败，同时也强调了能够导致并购收购增强增长而非破坏价值的治理类型。\n\n### 第一章\n## 合并增长战略\n\
  \n并购与收购（M&A）加速公司增长的可能可能超过其工具箱中的大多数其他手段。这对于大型交易尤为如此。然而，正如我们所讨论的，并购收购成功的记录充其间参差不齐。关键在于*先验地*确定哪些交易是成功的，哪些是需要避免的。问题的进一步复杂在于，管理层有时可能为了自己的个人利益而追求并购收购，这可能违背股东的利益。\n\
  \n正如我们在书中详细讨论的那样，关于并购收购的有效性以及它对股东财富的影响有大量的研究。事实上，并购收购是金融领域研究最广泛的话题之一。有大量高质量的务实研究审视了并购决策及其对股东的影响。这些研究人员（主要是学者）投入了大量的精力和精力，试图回答诸如“跨多元化交易或在公司既有专业领域之外进行并购收购对其股东财富产生积极还是负面影响？”等问题。这是一个重要问题的例子，如果并购决策者了解相关研究，他们本可以更好地回答这类问题。然而，并购收购领域一个令人惊讶的事实是，决策者、`CEOs`\
  \ 及其董事会通常对这些大量的高质量研究一无所知，也没有努力去进一步研究。正如我们在整本书中讨论的那样，答案有时在于他们有自己的议程，并且无兴趣发现那些不支持该议程的事实和证据。\n\
  \n我们探索了不同类型的并购收购，旨在确定哪些比其他效果更好。然而，并购收购的不幸之处在于，讽刺的是，大部分*策略*似乎并不非常具有战略性。大量的重大并购收购让你忍不住想要挠头，心想这些交易如何真的可能是基于一个深思熟虑的战略呢。遗憾的是，很显然，其中许多是基于促进股东财富以外的动机。事实上，其中一些交易，例如\
  \ 2000 年之前几年形成的 `Citigroup` 一站式金融超市，显然没有为消费者或股东服务。事实上，它主要服务于 `Citigroup` 的 `CEO`\
  \ `Sandy Weill` 的自尊和银行账户。\n\n## 战略与并购\n正如我们在第二章](#chapter02.xhtml)中强调的，公司需要制定增长战略。从历史来看，股权回报的大部分来自资本利得而非股息收入。要获得资本利得，公司的盈利能力需要提高。换句话说，应该有增长。因此，公司需要为他们如何实现这种增长制定一个战略计划。我们其次才询问并购收购是否可以促进该战略。有时会很明显，并购收购将在增长路径中发挥不可或缺的作用。在其他情况下，它可能只起微小作用或完全不起作用。\n\
  \n许多并购收购的问题的问题在于，有时它们显然不是深思熟虑的战略计划的一部分。有些看起来是随意的，例如当交易决策者（如`投资银行家`）向公司提出一个绝妙主意时，这个主意会让银行家赚钱，但对买方来说价值存疑。虽然这种非战略性的动机可能是许多并购收购失败的原因，但有理由相信，大多数并购收购确实某种战略基础，尽管这种基础可能是存疑的。例如，我们在接下来的案例研究中考虑了\
  \ `American Express` 极具争议的并购收购历史。\n\n\n\n\n\n并购（M&A）领域在过去的半个世纪里增长巨大。曾几何时并购主要是美国的一种现象，但从\
  \ 20 世纪 90 年代的第五次并购浪潮开始，欧洲的并购规模已与美国相争敌。当我们说美国多年来一直是并购领域的领导者时，这并不一定被认为是一件好事。虽然有些并购交易是非常出色的，但也有太多交易是极其糟糕的。\n\
  \n近年来，并购已成为全球公司常用的策略之一。到 21 世纪 00 年代，包括中国和印度在内的亚洲已加入并购主要参与者的行列。南美和澳大利亚的公司也随之加入了其中。事实上，并购确实是一个全球性现象。虽然我们一直在提到“合并”，但全球范围内的整体公司交易都在急剧增长。这包括收购，还包括剥离和分拆等重组。合资企业和战略联盟也随之相应的增长。\n\
  \n在本书中，我们分析了如何利用并购来促进公司的增长。我们还将看到，并购是一把双刃剑，有时能带来巨大的收益，有时却会产生高昂的成本且收益寥寥。可以说，诀窍在于发现哪些交易可以帮助公司增长，而哪些交易应该放弃。大量的并购失败案例证明了这并非易事。正因于此，我们在研究失败原因上花费的时间与研究成功交易几乎一样多。许多失败案例具有共同元素，这些元素本应让交易决策者提前识别出来，但他们往往往往没有意识到这些宝贵的知识。在开始此类讨论之前，讨论一下我们贯穿全文的一些通用背景和术语是有用的。\n\
  \n### 背景与术语\n\n合并是指两家公司的结合，其中只有一家能够存续。合并后的公司通常终止存在。收购方获得资产，但也必须承担其负债。有时我们会看到两家规模相似的公司合并，两家公司都存在，并创建了一个全新的公司。这种经典案例之一发生在\
  \ 1986 年，当时 UNISYS 通过 Burroughs 和 Sperry 的合并形成。但在大多数情况下，我们只有一个存续的企业实体，而另一家（我们通常称为目标公司）终止存在。出于统计目的，交易在记录时将较大的公司视为收购方，将较小的公司视为目标公司。\n\
  \n大多数并购是友好的交易，两家公司协商交易条款。根据交易规模，这通常涉及两家公司高级管理层之间的沟通，他们试图商定价格和其他条款。在此过程中，每家公司的董事会都会跟踪进度。对于上市公司，一旦条款达成一致，将提交给目标公司的股东批准。较大的交易可能需要两家公司的共同批准。一旦股东批准交易，流程将进入完成阶段。上市公司必须对重大公司事件进行公开披露，而出售公司显然是此类需要目标公司备案的事件之一。\n\
  \n### 敌意收购\n\n虽然大多数交易本质上是友好的，但有些是赤裸裸的敌意收购。敌意收购在 80 年代的第四次并购浪潮期间开始流行——这一时期以其精彩的交易以及发生的许多杠杆收购而闻名。虽然在第四次并购浪潮之前，美国就有敌意交易，但正是在那个时期，对大型公司的敌意收购变得更加常见。此外，大型公司作为进攻者发起此类报价也变得可以接受。今天，这类交易在世界各地都很常见。\n\
  \n敌意收购是指违背公司管理层和/或董事的意愿获得公司的控制。在没有管理层和董事支持的情况下收购公司，并不意味着违背了股东的意愿。根据收购流程运作，股东在收购战期间通常无法直接表达观点，而是依靠管理层代表他们表达。如果公司拥有某些大型激进股东（如对冲基金），情况可能会有所不同。这些大型投资者比小股东处于更有可能让管理层和董事会听取他们对交易的看法。甚至可能是对冲基金在推动交易进展——可能甚至是反对管理层。如果他们认为现任管理层没有优化公司的价值，且提高公司价值最快的方法是将其出售，他们就可能这样做。\n\
  \n竞标者追求敌意收购而非友好收购的主要原因是，该交易遭到了目标公司管理层和董事会的反对。竞标者通常希望进行友好交易，因为敌意交易的完成成本通常更高。开支的增加源于：竞标过程可能由于其他竞标者推高价格而产生更高的溢价。它可能意味着收购者不得不不断加价以克服目标公司的抵抗。敌意交易还可能增加投资银行的费用和法律成本。对于收购者来说，采取敌意手段意味着与友好交易相比，交易能否成功的保证较少，而友好交易的完成比例要高得多。\n\
  \n完成敌意收购的主要工具之一是要约收购。要约收购直接向股东发出的报价，绕过了管理层和董事会。如果一家公司正在寻求友好交易，逻辑上的起点应该是联系目标公司管理层。如果这种联系被拒绝，还有另外两种选择：(1)\
  \ 找董事会或 (2) 直接找股东。当竞标者直接向董事会报价时，这有时被称为“熊抱”（bear hug）。这主要是一种敌意战术，因为它带了隐含的（有时是明示的）威胁：如果报价未得到好评，收购者下一步将直接找股东。\n\
  \n\n\n然而，对于竞标者来说，这通常意味着他们要么为目标支付更高的价格，要么必须退出流程。精明的竞标者知道在哪里划分界限并退缩。而其他人有时会被傲慢所吞噬，继续竞标以试图“赢得”比赛。他们最终赢得往往是`赢家诅咒`（winner's\
  \ curse），即他们支付的价格超过了公司的价值。正如我们在第 11 章的案例中讨论的那样，1988 年就是如此：罗伯特·坎鲍（Robert Campeau）在收购了联合商店（Allied\
  \ Stores）后，对联邦零售（Federated）提出了报价，这将使他拥有全球最大的百货商店连锁。遗憾的是，梅西（Macy's）加入了竞标过程，首席执行官爱德华·芬克尔斯坦（Edward\
  \ Finkelstein）与罗伯特·坎鲍展开对决，不断推高溢价，直到坎鲍“胜出”。最终收购价为 81.7 亿美元（包括股权、债务和支付的所有费用），但这次收购使合并后的公司背了数十亿美元的新债。由于无法偿还债务，且在交易完成后并购市场急剧降温，无法以理想价格出售资产，坎鲍在成功完成收购后不久便被迫申请了第\
  \ 11 章破产。正如我们所看到的，这并非孤立事件。很多时候，激烈的竞标竞争会导致收购价格过高，从而消灭了从收购中实现净收益的机会。\n\n一个在战略上可能契合的交易，如果最终演变成敌意收购，其吸引力可能会下降。如果过程变得敌对，竞标者最终可能（并不总是）支付过高。这可能会导致一种局面：高价格抵消了最初感知的战略价值。如果是如此，竞标者需要撤退并调整策略。在某个价格下是“良好”的战略匹配，在另一个价格下可能是糟糕的。\n\
  \n报价的另一种替代方案是`代理斗争`（proxy fight）。这是竞标者试图利用公司民主程序获得足够的票数，以撤换现任董事会及其选出的经理。他们可能会在下一次公司选举中尝试，或者召开特别选举。在这种背景下，此类竞标者被称为“激进者”（insurgent），他们随后提交自己的提议和/或董事名单，以反对现有集团。在\
  \ 21 世纪，代理斗争成为对冲基金的一种流行方法，用于改变其持股的公司。此类对冲基金会寻找被低估的目标，他们认为这些目标可以从特定的变化中受益，例如更换管理层、使用现金支付更高额股息、出售资产等。对冲基金的目标通常不是收购目标公司，而是让他们能够实现投资的短期收益。\n\
  \n当使用代理斗争来促进收购时，竞标者往往发现这是一个昂贵且不确定的过程。它通常是不成功的，尽管再次强调，成功取决于你如何定义它。如果竞标者正试图改变目标公司的运营方式，这个过程通常能实现这一点。对于对冲基金来说，这种变化可能是出售资产，甚至是直接出售整个公司。然而，如果目标是让股东完全拒绝现任董事会，并进一步在违背管理层建议的情况下接受对公司的报价，那么这个过程通常不起作用。也就是说，竞标者也发现自己必须花费巨额资金换换一个往往对他们不利的结果——至少在短期内如此。不过，对冲基金在收购低值公司股权头方面取得了一些成功，随后通过推动变革来提升他们以及其他股东股权投资价值。事实上，在\
  \ 21 世纪，许多对冲基金专门从事此类活动。有时，这些对冲基金策略可能让发现自己困于溢价且不稳定的管理层的股东受益，因为这些管理层不愿意进行必要的变革来提高股东价值。\n\
  \n### 收购防御\n\n敌意收购过程在某种程度上像一场象棋赛，将目标公司与敌意竞标者对峙。在 20 世纪 80 年代的第四次并购潮中，使用的方法变得复杂得多，当时敌意收购突然变得司常见。目标公司最初对有效防御的反应缓慢，但最终开发出了某种有效的手段阻止某些竞标者，并从其他竞标者那里为股东争取更大的收益。现在距离那第四次并购潮已经过去了四分之一世纪，那期间开发的许多战术仍然接近顶尖水平。此外，法律（包括判例法）已经完善了哪些技术是合法的，哪些不是。许多监管防御性和进攻性敌意收购方法的法律，最初是在并购主要作为美国现象的时期在美国开发的，现在已复制并适应到世界各国的证券法中。\n\
  \n收购防御有两种。`预防性收购防御`（Preventive takeover defenses）在任何特定的收购报价之前就已建立。其目的是让竞标者不会尝试收购。`主动收购防御`（Active\
  \ takeover defenses）在收购战进行期间部署，此时竞标者已对公司提出了报价。尽管有多种类型的防御，但其中许多的有效性已不如最初创建时那样。\n\n\
  最有效的预防性收购防御是`毒丸计划`（poison pill）。毒丸也称为`股东权利计划`（shareholders' rights plans）。权利是权证的短期版本。与权证一样，它们允许者在特定价格和特定情况下购买证券。毒丸计划通常允许权利持有者以`半价`购买股票。这通常表述为持有可以用\
  \ 100 美元购买价值 200 美元的股票。\n\n毒丸是一种有效的防御，因为它们使收购成本变得非常昂贵。如果竞标者购买 100%的发行股，它仍然必须履行前股东持有的权证，该股东将能够以半价购买股票。由于这通常会导致收购成本高到无法负担，竞标者会寻求与目标公司谈判，使其拆除这种防御。有时，竞标者会向股东直接诉求，要求他们采取行动以享受其提供的溢价，而管理层和董事会可能会阻止他们获得。然而，目标公司的管理层和董事可能会利用毒丸计划提供的保护来从竞标者那里获取合适的溢价。一旦收到满意的报价，他们就可以拆除这种防御。这通常可以轻松完成，且对目标公司成本较低。\n\
  \n公司治理倡导者一直向公司施移除毒丸。他们担心公司利用这种强力防御来保护管理层免受收购市场的纠偏压力。这就是为什么在 21 世纪，许多公司选择不续签这些计划（计划通常有效期为\
  \ 10 年）。另一个原因是，这些公司也知道，如果需要，他们可以在非常短时间内实施新的计划。例如，Netflix 在 2012 年 11 月正是这样做，当时卡尔·伊凯恩（Carl\
  \ Icahn）作为 9.9%股东的身份成为了他们担忧的原因。\n\n\n\n其他类型的预防性收购防御涉及对公司章程的不同修订。其中一种防御措施是交替董事会制（staggered\
  \ board），它改变了董事的选举方式，使得每次只有有限数量的董事（例如三分之一）参加选举。如果每次只能选举三分之一的董事，那么新的控制股东就必须等待两次选举才能获得对董事会的控制权。这阻碍了那些对目标公司进行投资，但在一段时间内无法对公司进行变更的报价者。此类变更可能包括与收购公司合并或出售资产，这些可能被用于偿还报价者为资助收购目标股票而产生的债务。如今，这类董事比多年前少见了。\n\
  \n其他常见的公司章程修订是绝对多数表决条款（supermajority provisions），它要求在批准某些类型的变更之前，不仅需要简单多数通过，还需要更高比例的通过。如果一组股东不与收购者一起投票（例如担心自己岗位的管理人员和部分员工），那么报价者可能无法获得足够的股份来实施其全面控制公司所需的变更。\n\
  \n其他基于公司章程的防御措施包括双重资本结构（dual capitalizations）。其特点是具有不同类别的股票，为持股人提供不同的投票权和股利权利。它们通常涉及一类具有超级投票权的股票，这类股票的股息极低。这些股份通常分配给所有股东，但那些有意增加控制权的人（如管理人员）可能会保留它们，而其他人可能接受公司的后续报价，将这些股票换为具有普通投票权支付股息的股票。这种股票发售/股利分配的结果是，增加的控制权集中在通常对公司更忠诚的股东手中，这些人不太可能接受来自敌意报价者的报价。证券交易委员会（SEC）和证券交易所规则限制了公司发行和交易此类股票的程度。\n\
  \n当目标公司收到不请欢迎的报价时，可以采取若干步骤。借鉴多年来的防御措施，它可以提起诉讼，除非它有可以主张的重大法律问题，但通常情况下，这还不足以阻止收购。然而，它可能提供时间，使目标公司能够采取其他防御措施。这可能包括出售给更青睐的报价者——“白骑士”（white\
  \ knight）。也可能涉及将股份出售给更友好的第三方。这可以在报价提出之前进行，也可以作为主动防御进行。此类出售中的买家被称为“白矮士”（white squire）。\n\
  \n目标公司还可以重组公司以使其对报价者失去吸引力，或者采取与报价者建议的一些相同变更，从而剥夺报价者的这一建议权。重组公司可能涉及资产出售和购买。公司还可以重组其资本结构以增加债务，提高其杠杆率。资本结构的变化可能会产生一些影响，通过降低公司的吸引力，并减少报价者为资助目标公司自身收购而能募集的债务金额。\n\
  \n### 杠杆交易\n\n杠杆交易是指利用债务资助收购的交易。它们有时被称为高杠杆交易（HLTs）。HLT 的一个为人知的版本是杠杆收购（LBO）。LBO 是一种利用债务购买目标公司股票的收购。然而，当人们谈到\
  \ LBO 时，他们通常是指一种利用债务购买一家上市公司然后将其转为私有化的交易。多年来，历史上最大的 LBO 是 1988 年对 RJR Nabisco 的收购，金额为\
  \ 248 亿美元。使用 2.8% 的年通胀调整因子计算，这相当于 2013 年美元中略低于 500 亿美元的交易！\n\nRJR Nabisco 被著名的私募股权公司\
  \ Kohlberg Kravis and Roberts (KKR) 收购。尽管 KKR 的许多交易都是成功的，但这次收购并不属于那类著名的成功案例之列。这是出于许多原因，包括出价过高，以及未能预测经济气候的变化——尽管这些变化（例如经济扩张在一段时期后结束）是常态。尽管如此，这次收购仍然非常精彩，并成为了一本成功书籍和一部电影的主题。\n\
  \nLBO 总体而言面临的风险之一是买家承担了巨额债务，导致公司处于高程度的财务杠杆状态。这带来了高财务杠杆所产生的所有风险。这些风险表现为债务偿付增加而带来的固定费用。杠杆交易中公司的买家通常计划通过出售资产来降低这种杠杆，出售收益可用于偿还债务并减少债务偿付。在罗伯特·坎帕绍（Robert\
  \ Campeau）对 Federated Stores 的杠杆收购中，收购后市场状况恶化，他无法以反映其所支付价值的价格出售部门，因为他当时使用借入资金在收购整个公司时出价过高，而这些债务的债务已无法继续偿还。不出高价是收购成功的关键之一。与其相关的是，避免竞标竞争和过度敌意的交易（这通常会导致报价者陷入“获胜者诅咒”）也非常重要。\n\
  \n减轻 LBO 产生债务所带来的压力的其他方法之一是实施成本结构变更并提高效率，这将降低公司的总成本并使其能够偿还债务。即使在这里也可能存在问题。如果一家公司为了降低成本而牺牲必要的资本支出（例如坎帕绍不得不做的，以及\
  \ Sears/Kmart 在合并后所做的），这将使公司处于较弱的竞争地位。\n\nLBO 公司的买家通常有一个计划，在对公司进行各种变更的同时，在一段时间内减少债务。许多交易交易者计划在原始\
  \ LBO 之后的某个时间点进行反向 LBO（reverse LBO）。在反向 LBO 中，被 LBO 收购的私有公司再次上市。这可以一次性完成，也可以分阶段进行，正如\
  \ RJR Nabisco 的案例。在 RJR Nabisco 交易中，KKR 向公众出售了部分股份，并利用这些收益偿还了所承担的巨额债务。该交易未成功的原因之一与收购过程中发生的竞标竞争有关。RJR\
  \ 收到了一份来自当时首席执行官 Ross Johnson 领导小组的小报价。KKR 以自己的报价进入竞争，知道 Johnson 小组的报价很低。然而，随后发生了竞标竞争，KKR\
  \ 赢了，但它确实承受了“获胜者诅咒”。\n\nRJR Nabisco 带给其买家的获胜者诅咒，与历史上最大的 LBO 相比简直不上——2007 年 KKR 和\
  \ TPG Capital 对电力供应商 TXU 的 430 亿美元收购。这是一个基于大宗商品的业务，受天然气价格影响很大，而天然气价格又因为 LBO 之后进入美国市场的天然气过剩而大幅下降。令人惊讶的是，我们竟然有\
  \ KKR 这样非常著名的私募股权公司在追求这些巨型 LBO 惨败。同样令人惊讶的是，他们以及另一家著名的私募股权公司 TPG Capital 没有考虑到，可能受波动大宗商品价格影响巨大的公司可能并不是高杠杆的良好人选。\n\
  \n\n\n反向杠杆收购（Reverse LBOs）在私募股权 LBO 之后非常常见。私募股权买家收购他们认为价值被低估的目标。随后，他们寻求将其“转手”——但前提是在他们已经提取了可能获得的收益之后，例如通过所谓的**股息再资本化**（dividend\
  \ recapitalizations）。当这些买家出售其所收购的实体时，有时很难找到一个愿意支付比私募股权买家更高价格的买家——尤其是私募股权所有者可能给公司背了大量债务，并用债务资金向自己支付股息之后——这就是所谓的\
  \ `dividend recapitalizations`。当他们无法将这家如今债台累累的公司卖给某个买家时，他们通常会通过 IPO 将其抛售给市场。IPO\
  \ 买家往往比其他买家（如其他私募股权公司）更天真。任何不确定 IPO 买家是否天真的人，只需回想 Facebook 的 IPO 即可确认。\n\n### 重组\n\
  \n并购只是企业重组的一种形式。与并购相反的另一种重组形式是出售（sell-offs）。在 `sell-off` 中，公司将自身的一部分卖给另一个实体。这可以通过几种方式实现。最常见的方式是剥离（divestiture），公司简单地将自己的一部分卖给另一个实体。然而，缩减规模可以通过其他方式实现，例如通过分拆（spin-offs），将公司的部分从母公司中分离出来。分拆实体的股份被分给母公司的股东，他们随后成为两家（而非一家）公司的股东。我们将在\
  \ 第 10 章 中讨论这些类型的交易，因为它们可以作为 `reversing the error` 的一种方法。另一种让母公司的一个部门（可能是在某项现在被视为失败的交易中收购的部门）从母公司分离出来的方法是通过股权拆分上市（equity\
  \ carve-out）。在这种情况下，该部门的股份通过公开发售向市场提供。在 第 10 章 中，我们讨论了这些不同类型交易对股东财富的影响。然而，我们现在可以指出，通常情况下，这些各种形式缩规模对股东财富的影响往往是积极的。对研究的仔细审查有力地证明了，这在很长的时间跨度内是真实的。\n\
  \n书中没有关注的另一种企业重组形式，但它与并购世界有关，是破产重组。破产不仅是公司历史中标志公司终结的不利事件。破产有多种形式，其中某些形式更多是企业融资的工具，公司可以通过此改变其运营和财务结构，并变得更好的公司。此类重组可以通过提交\
  \ 第 11 章申请来实现。第 11 章申请指的是美国《破产法》中允许公司免受债权人保护的部分——即自动中止（automatic stay）。其他国家也有允许重组的破产法，但许多国家（如英国和加拿大）对债务人的限制比美国严格。\n\
  \n在破产法院的保护下运营时，提交 第 11 章申请的公司被称为“占有债务人”（debtor in possession），他们准备一份重组计划，该计划可能对债务公司产生重大变化。这些变化可能提供不同的资本结构，即债务更少、股权更多。它还可能规定资产出售，包括整个部门的出售，这提供了现金注入，并可能用于偿还导致破产的部分债务。\n\
  \n在 20 世纪 90 年代，许多在第四次并购潮中经历 LBO 的公司被迫申请 第 11 章 保护。回到我们的 Campeau 公司例子，它在从破产保护中恢复后，变成了一家非常不同的公司。与大多数\
  \ 第 11 章 重组一样，股权持有者（包括构思了这项高杠杆收购的交易制定者）由于市场对他们糟糕的财务规划进行惩罚而遭受了巨大损失。本书的重点之一是确定如何防止此类并购失败。对于那些做了糟糕交易的公司来说，可方案之一是主动进行一些必要的重组变更，而不必走破产之路。然而，有时情况是需要破产法院法律的压力，来迫使所有相关方（包括具有不同利益和动机的各种债权人团体）同意接受拟议变更。\n\
  \n破产提供了许多并购机会。精明的竞标者可以在破产过程中找到“绝佳买入”。如果公司总体状况稳健，但存在可以通过破产过程解决特定问题，情况尤为如此。例如，如果公司拥有有价值的产品和服务，仅仅是因为\
  \ LBO 大师们带来的过高杠杆而处于破产状态，那么在 第 11 章 中就可以被“修复”。第 11 章 Process 中的买家可能收购公司的价值部分，而无需承担其所有债务的负担。\n\
  \n### 并购趋势\n\n并购规模始终存在，但曾出现过几次高交易量之后紧随交易量较低的时期。这些并购密集的时期被称为 `merger waves`（并购潮）。美国发生过六次并购潮。第一波并购潮发生在\
  \ 1897 年到 1904 年间。其特点是许多横向并购。许多行业在时期初处于非集中的状态，有许多小型公司在运营。在时期末尾，许多行业变得更加集中，其中一些甚至接近垄断。这很讽刺，因为正如之前讨论过的，《谢曼法案》正是为了防止这种行业结构而通过的。第一波并购潮在经济和市场低迷时结束。在经济低迷时期，交易的压力较小。这种情况在\
  \ 20 世纪 20 年代发生了，当时经济开始繁荣。繁荣的经济状况导致了第二次并购潮，该潮集中在 1916 年到 1929 年间。这一波特点是许多横向交易，但也包含许多垂直交易。交易特别集中在特定行业。当股市市场在\
  \ 1929 年崩溃，经济在 20 世纪 30 年进入长期的深度衰退时，并购潮结束了。直到 20 世纪 60 年代末，我们没有经历过另一个主要的并购时期。20\
  \ 世纪 50 年代是一个经济起伏，有着激烈的、如果不是荒谬的反垄断执法。\n\n第三波并购潮是一个有趣的时期，由于该时期激烈的反垄断执法，它包含了许多集团并购。司法部对并购持激进反对态度，并将许多在今天会被立即批准的交易以反垄断为由予以反对。由于这一原因，有收购倾向的公司被迫在所属行业之外进行交易，以避免司法部和\
  \ FTC（美国的两个反垄断监管机构）的怒火。许多大型集团，如 ITT、LTV、Gulf & Western、Teledyne 和 Textron 都是在该时期建立的。虽然\
  \ 20 世纪 60 年代的大部分时间经济处于繁荣状态，但经济和市场在年代末都低迷了。与之前的并购潮一样，它在扩张压力消退时结束了。\n\n\n\n20 世纪\
  \ 70 年代的 `&As` 数量相对较少，但也存在许多其他形式的重组，这些公司可能在第三次并购潮中被收购，随后在公司适应放缓的经济状况时被出售。股东们对他们在经济繁荣时期所做的一些交易产生了怀疑。公司管理层的判断可能被那些从未实现的财富梦想所蒙蔽。随着公司在\
  \ 20 世纪 70 年代中期感受到深度衰退的经济压力，他们实施了管理层变动，其中一些变化促成了我们在该期间看到的各种重组和出售。\n\n事实证明，20 世纪\
  \ 80 年代是战后最长的经济扩张时期，直到我们进入下一个十年，那个十年拥有更长的增长期。20 世纪 80 年代带来了色彩多彩的第四次并购潮，它包含许多有趣的方面，包括超级合并（参见图\
  \ 1.1）。如前所述，其中一些交易是高杠杆的，而这些高杠杆交易的燃料是由垃圾债券市场提供的，该市场也因交易相关的对这种形式资本的需求而繁荣。第四次浪潮还出现了许多敌意收购，因为包括大型企业在内的公司发现自己成了不受欢迎的追随者的目标。敌意收购在此时期之前确实发生过，但主要是规模较小的公司对其他较小公司的报价。在该时期之前，听到对大公司进行敌意收购是不寻常的。而让声誉良好的大公司参与敌意收购更是不多见。这一切在\
  \ 20 世纪 70 年代后期发生了变化，为 20 世纪 80 年代第四次并购潮中发生的许多敌意收购奠定了基础。\n\n![img](img/n01f001.gif)\n\
  \n**图 1.1**](#chapter01.xhtml__back2) (a) 20 世纪 80 年代美国并购的数量和 (b) 价值\n\n*来源：* Thomson\
  \ Financial Securities Data.\n\n当经济在那个年代末放缓且垃圾债券市场崩溃时，第四次并购潮结束了，这部分是因为经济状况疲软，也是由于债券市场该部分的特定问题导致的，包括迈克尔·米尔肯（Michael\
  \ Milken）及其投资银行——德克斯尔伯纳姆的起诉。\n\n1990 年至 1991 年间，美国经济经历了轻微衰退，最初恢复缓慢，随后随着反弹变得势头强劲。与之前的许多扩张期一样，公司寻求增长，而扩张最快的方式是购买整个公司，而不是在公司内部建立此类业务。在某种程度上，这是合理的，因为经济扩张的状况创造了市场机会，公司可能需要迅速做出反应以充分利用这些机会。问题出现在对经济财富的梦想蒙蔽了管理层的判断时，导致他们无法做出最明智的决策。经济繁荣的另一个问题是，它们可能会掩盖糟糕的管理。需求的增加可以导致即使是管理得不好的公司也能获得更高的销售额和利润。当这种情况发生时，股东和董事会将那些并非由他们所创造的收益归功于管理层。这可能导致他们接受某些可能没有经过仔细审查的收购提议。管理层可能可以说被“放过一马”，直到对于一些没那么精明的经理来说，他们的收购计划在他们面前彻底崩塌。然而，对于那些做了深思熟虑交易的人来说，他们能够推动公司发展并利用市场上的竞争机会。\n\
  \n第五次并购潮在合并总额以及发生的交易规模方面具有开创性（参见图 1.2）。虽然第四次浪潮发生了许多超级合并，但第五次浪潮中的某些交易让第四次浪潮的交易显得平庸。在本书后面，我们将检查许多此类领先但彻底失败的交易——大失败。诸如\
  \ AOL 与 Time Warner 的*平等合并*是失败案例，让某些 Time Warner 的股东感到极其愤怒。其他交易，例如辉瑞对华纳-兰伯特的收购，或者埃克森与美孚的合并，则显然是巨大的成功。成功与失败交易之间的差异将在书的其余部分进行讨论。\n\
  \n![img](img/n01f002.gif)\n\n**图 1.2**](#chapter01.xhtml__back3) (a) 20 世纪 90 年代美国并购的数量和\
  \ (b) 价值\n\n*来源：* Thomson Financial Securities Data.\n\n第五次并购潮确实是国际性的，欧洲的并购规模与美国相争。。欧洲人喝了美国人的并购“毒鸡汤”，并加入了交易竞争。在许多方面，这是一种必要的改变，因为多年来，欧洲存在着一些非常低效的公司结构，而并购是这些经济体创造更高效企业的一种方式。\n\
  \n与之前的并购浪潮一样，第五次并购潮在经济转下降时结束了。互联网和电信等热点行业崩溃了。然而，与 1990 年至 1991 年的衰退一样，2001 年的衰退相对轻微，持续时间仅有八个月。恢复最初很缓慢，但低利率有助于推动某些行业（如房地产和建筑业），随后出现了房地产泡沫。联邦储备委员会（`Fed`）主席艾伦·格林斯潘（Alan\
  \ Greenspan）沉浸在那些从他维持的低利率中获益的人所给予的赞誉光环中。格林斯潘并不是那种相信自己作为`Fed`主席的职责之一是监管贷款的人，他几乎忽略了抵押贷款等主要的债务生产者。他还是银行去监管的大力支持者，因为他认为他们不会采取危及这些老牌机构的。然而，他不理解人性，没有意识到金融机构仅仅是人的集合体，而这些人都有自己的个人议程。这种议程是利用现有的各种短期激励来获取巨大的财富。而这些人这些人将他们的机构以及周围的所有人推向危险。在格林斯潘和`Fed`的默许支持下，建立了一个金融体系，某些员工如果用别人的钱进行大注就能大赢，如果以后赌注输了，他们不需要归还任何资金。^(2)\
  \ 实际上，机构变成了赌场——用的是房东钱。如果有人顾忌不参与这种行为，竞争机制会将他们挤出去，并被更不廉耻的人取代。这一切超出了格林斯潘的理解范围，他至今拒绝承认自己在次贷贷款危机中所承担的责任。(3)\
  \ 这种情况令人担忧的问题是，在次贷危机后的多年里，并没有发生太大变化。\n\n\n\n\n*来源：* Thomson Financial Securities\
  \ Data.\n\n## 注释\n\n### 第 2 章\n#### 通过并购实现增长\n\n公司面临着持续增长的压力。企业增长允许公司支付更多的股息，并让股东实现其股权投资的增值。公司的管理层很难告诉股东，他们的长期目标是维持现状而不增长。如果他们真的这样做，股东和董事会会要求更换能够实现增长的管理团队。因此，人们广泛认为增长是管理层战略中不可或缺的一部分。然而，尽管这一假设被广泛认同，但应对对其进行批判性的评估和重新审视。\n\
  \n对增长的追求导致许多公司偏离了正轨，采取了未能实现此类目标的策略，甚至可能导致公司遭受重大损失。证券市场的压力迫使管理层追求投资者所要求的增长。实现增长最快的方法之一是通过并购收购（`M&A`）。遗憾的是，`M&A`\
  \ 具有很高的风险。它往往会导致亏损。关键在于确定哪些交易将带来真正的增长，哪些应该被避免。`M&A` 成功与失败并存的长期且且不一的记录，凸显了这样一个事实：*先验*地识别哪些拟议交易将成功是一项巨大的挑战。\n\
  \n### 增长还是提高回报才是更合适的目标？惠尔-惠奇公司的案例\n\n公司管理层和董事会的一个主要目标实现增长，这几乎是不容置疑的。虽然这一目标的合理性通常不受到质疑，但经理们需要确保增长策略能够为股东带来良好的回报。很多时候，管理层可以通过保持公司在既定规模来产生接受的回报，但他们却选择了追求激进的增长，这可能会让这些稳定的回报面临风险。董事会需要批判性地审视增长带来的收入的预期盈利能力，并确定这种增长是否值得投入成本。考虑费奥里纳时代之后惠尔-惠奇（`HP`）的案例。在\
  \ 2002 年对康贝进行了一项极具争议的 190 亿美元巨额收购后，`HP` 发现自己管理着几个业务部门，其中它仅在一个领域处于领先地位——即打印机。该公司的收入超过了\
  \ 800 亿美元。如果例如，它的目标是每年增长 10%，那么它每年必须产生约 80 亿美元的新收入。事实上，它每年必须创造出另一家大型公司规模的收入才能满足管理层的增长目标。当我们考虑到其业务很大一部分来自竞争激烈的\
  \ PC 市场，且该市场利润率薄，并伴随着稳定的产品价格*通缩*，人们不禁疑惑增长将从何处来，以什么样的代价获得。公司缩减规模并拥有独立的、更易于管理且集中的业务是否会更好？离开\
  \ PC 业务是否会更好，正如该业务的创始人 `IBM` 在 2005 年年中将其 PC 部门卖给中国计算机制造商联想（Lenovo）所做的那样？收购康贝让 `HP`\
  \ 能够声称是全球最大的 PC 制造商。然而，它对这项业务的不满导致它在 2011 年宣布将摆脱 PC 业务，却在又更换一次首席执行官后撤回了这一声明。里奥·阿波西克尔（Leo\
  \ Apotheker）在经历了注失败的 2011 年以 80% 的溢价收购 117 亿美元的自动化公司（Autonomy）后，宣布他辞职！市场对 `HP` 愿意支付如此溢价感到震惊（卖家可能也是如此）。在第\
  \ 11 章中，我们将从尽职调查和估值分析不足的背景讨论这项收购。`HP` 分析非常糟糕的说法在它于 2011 年 11 月宣布计提 88 亿美元的损失时（很大归因于自动化公司的交易）得到了凸显。这笔交易的失败只是在销售额持平、低利润率和股东权益下降之外，给公司带来的又一次打击（见图\
  \ 2.1）。\n\n![img](img/n02f001.gif)\n\n**图 2.1**](#chapter02.xhtml__back1) `HP` (a)\
  \ 收入，(b) 净利润，(c) 股东权益\n\n*来源：* Value Line, 2013 年 1 月 4 日；WSJ Market Data, 2013\
  \ 年 3 月 8 日。\n\n多年来，`HP` 在 `M&A` 方面一直非常糟糕。然而，它仍然无法与 `AT&T` 竞争，获得历史上最糟糕 `M&A` 公司的头衔。`AT&T`\
  \ 在其历史经历了多次转型，这个头衔被它牢牢占据着。但给 `HP` 一面子，它一直在尝试，也许有一天它能从 `AT&T` 手中夺回这个吉祥的头衔。人们不禁怀疑马克·哈德（Mark\
  \ Hurd）是否会做出如此糟糕的财务决策。我们永远不会知道；在一名前员工提起诉讼向他索要资金后，他被董事会赶出。董事会最终发现他没有违反任何主要规则或法律，但还是将他赶走了。竞争对手\
  \ `Oracle` 首席执行官拉里·埃利森（Larry Ellison）对公司竟然因为这样一个微不足的问题就如此轻易地辞掉它曾拥有的最佳经理之一感到震惊。然而，作为一个不会放过任何良机的人，他迅速雇佣了当时失业的哈德。\n\
  \n我们并不是在说像 `HP` 以及过去的 `AT&T` 这样的公司没有创造伟大的 `M&A` 机会。它们确实创造了。它们为估值过高的目标提供了出售机会，让自己卖给一个不知情的且富有的买家。对于这类公司的卖方来说，在世界上有一个特殊的位置。对于\
  \ `HP` 的股东来说，他们应该对管理层和董事会感到愤怒，因为那里一直非常失职。\n\n### 并购必须符合战略——而不是反过来\n\n公司应该有一份如何为股东创造价值的战略。这一战略应该是清晰阐述的、并得到董事会的支持。每项拟议的合并或收购都需要符合该战略。战略计划是一个不断演变的文件，自然需要适应不断演变的市场和经济。近年来，世界经济和许多行业变得更加难以预测。然而，虽然公司的战略和相关计划需要一定的内在灵活性，但如果拟议的\
  \ `M&A` 交易要求收购者进行重大战略调整，人们就需要警惕。此类提议应该引起董事会的警觉。\n\n### 战略不应仅仅并购\n\n\n\n\n并购（M&A）可以在公司的战略中发挥作用，有时甚至是起主导作用。然而，一家公司的增长战略绝不能仅仅只有并购。尽管这似乎是显而易见的，但有很多著名的例子表明，某些公司对增长的唯一有意义的尝试就是其并购策略。其中最好的例子（但从股东的角度来看，这真的是最糟糕的例子之一）可能是世界公司（Worldcom）的丑闻（参见本章稍后出现的案例研究）。在该案例中，管理层——主要是首席执行官伯尼·埃伯斯（Bernie\
  \ Ebbers）非常擅长并购，却无法管理他通过交易创造出的这家巨型公司。泰科公司（Tyco）在丹尼斯·科兹洛夫斯基（Dennis Kozlowski）的领导下也发生了类似的情况。他也通过一项非常激进的并购计划建立了公司。事实上，他的许多交易规模都低于报告的阈值，这意味着随着公司的增长，他们可以进行更大规模的交易，而无需向市场进行重大报告。讽刺的是，这两家公司的首席执行官都被处了长期监禁。埃伯斯的违规行为是当时美国最大破产案的主要原因。而在科兹洛夫斯基的情况下，虽然他在提取薪酬和荒唐福利方面非常贪婪，但公司在他的任期内实际上运行良好。在安然公司（Enron）和世界公司事件之后，他遭到了政府的追捕。\n\
  \n### 有机增长或通过并购增长\n\n当公司寻求增长时，有两种互不排斥的替代方案。他们可以使用公司内部现有的资源进行内部增长。这最终可能是一个较慢的过程。而且，这种方式（并非总是如此）通常比通过并购进行外部增长成本更低。通过并购进行外部增长，公司通常必须支付交易成本并对目标公司支付溢价，然后还会产生巨额且往往难以衡量的收购后整合成本。这些后期的成本取决于公司追求并购的频率以及要求实施整合的程度，具有或多程度的可预测性。这是一种“熟能生巧”的情况。如果一家公司很少进行并购，其经理可能无法很好预判真实的整合成本是多少。这并不意味着解决方案是进行大量的并购，以便在需要进行交易时能够更好地预判整合成本。公司必须找到衡量此类成本的方法，而不必通过经历许多失败的交易来实现。讽刺的是，有些公司永远不吸取教训。剥离后的\
  \ AT&T 就是一个很好的例子。它利用并购进入了竞争激烈的计算机行业，在损失巨额资金后退出了该行业。它完全没有从昂贵的错误中吸取教训，后来又通过并购溢价进入了电缆行业，在遭受重大损失后最终也退出了该行业。\n\
  \n有时市场会迫使公司做出决定。一家公司可能倾向追求内部增长，以避免与并购相关的高成本。然而，如果市场变化迅速且竞争环境激烈，那么等待较慢的内部增长结结果可能并不是一个选项。市场变化的速度可能会迫使公司做出决定。它可能决定成为竞争者，或者尝试维持市场份额，或者冒着落后于竞争的风险，而竞争对手可能通过并购激进地追求增长。\n\
  \n思科（Cisco）首席执行官约翰·钱伯斯（John Chambers）对这一过程描述如下：\n\n> 在行业运行较慢、不同业务模式有效的时期，绝大部分的产品开发来自内部团队。随着市场开始加速，你无法跟上客户的需求；一切都进展得太快了……要成为领导者的公司将把重心完全转向收购，并将其作为核心竞争力。\n\
  \n思科是这一过程的绝佳例子，展示了公司如何在很长时间内处理这种困境并非常成功。它是一家可以将其大部分成功归功于对并购的妥善的公司。它处于一个快速变化的行业。该行业要求参与者不断开发新产品，以满足市场快速变化的需求。虽然思科从其非常成功的并购计划中获益巨大，但我们也看到它在此过程中遇到了一些主要的障碍。经验非常有帮助，但它并不是并购成功的保证。\n\
  \n### 收购与开发对比研发\n\n在快速变化的行业中（如高科技行业），公司往往很难跟上创新的步伐。大型官僚企业通常不是实现创新的最佳场所。正如我们所看到的，大公司可以做许多小企业做不到的事情。规模也是成功的副产品。然而，这种规模也有自己的代价，扼杀创新和创造力就是其中之一。\n\
  \n看起来有前景的技术很快会被更具创新能力的对手所掩盖。公司需要投资特定的技术，而且很难预测这些努力最终将有多成功。其他行业（如制药）也是如此。在这里，公司开发新型重磅药物（销售额超过\
  \ 10 亿美元的药物）的能力受到了限制。在美国，联邦药品管理局（`FDA`）批准的药物越来越少。部分问题在于，许多较易治疗的疾病已经通过药物治疗得到了解决。行业面临的是更加复杂且普遍的疾病，如阿尔尔海默症和几种棘手的癌症类型，这些疾病已被证明非常难以处理。这导致许多公司多年来在不同的研究领域投入巨额资金，但这些研究被证明是徒劳无功的。\n\
  \n制药面临的挑战在于，被批准但作为昂贵研究产物的药物通常要求制造商收取高价，试图收回其巨大的投资。美国制药公司现在发现保险公司不愿为最新的高成本药物报销。\n\
  \n制药公司的上述问题与计算机和网络行业具有某些共同点，这导致公司放弃了研发（`R&D`），转而追求收购与开发（`A&D`）。例如，思科侧重于那些目标公司已经开发并验证了技术，并且消费者已明确证明对其有需求的公司。它随后会支付必要的溢价通过收购获取此类技术。这种策略的益处之一是，它允许市场淘汰掉失败的技术开发者，并关注更成功的目标。这些目标可能会获得一个“无法拒绝的报价”，因为其中包含了补偿它们承担开发失败风险并取得成功的溢价。\n\
  \n\n\n\n思科在许多收购中成功使用的这一策略，在其他行业（如制药行业）实施起来要困难得多。A&D 确实用于对生物技术公司、甚至是大型制药公司的收购。然而，在制药行业，重磅炸药物的开发过程变得非常漫长（通常达\
  \ 10 年），且成本高昂（通常超过 10 亿美元），并且无法保证获得美国食品药品管理局（FDA）的批准或市场成功，因此并没有大量低成本开发重磅炸药物的小型公司。然而，多年来，思科的成功源于它拥有一种奢侈：在硅谷，绕着大量初创的高科技公司，这些公司拥有许多接近成功市场的前景技术。相比之下，制药公司通常必须专注于研发或收购，而后者的回报要遥得多，因此也更加不稳定。\n\
  \n### 并购是否能有效用于购买增长？\n\n那些在现有业务增长方面遇到困难的公司，通常会寻求收购其他快速增长的业务来启动自身的增长。其逻辑是，如果我们收购了一家快速增长的公司，至少其加权平均增长率应该更高——至少我们是希望是这样。这引发了一些显而易见的问题：为什么收购者的当前业务是增长缓慢的？然而，答案可能仅仅是因为它是一个低增长行业中的成熟低增长业务，这可能没有留下多少内生增长的选择。\n\
  \n一个显而易见的问题是：这种`购买增长`策略的效果到底如何？此类并购的记录满是失败。原因之一是，如果你正在购买一家可能已经出稳健增长的业务，那么这些快速增长现金流的现值应该包含在价格中。通常情况下，买方是在为这种增长`预付费`。如果事实确实如此，那么真正的价值将来自于协同效应，这种协同效应将产生比目标公司自身所享有的更大的增长。这在许多交易中确实可能如此，但正如我们在第\
  \ 3 章中讨论的那样，协同收益说起来比实现要容易得多。\n\n### 核心业务的成功并不总是意味着并购策略的成功：聚焦微软\n\n我们已经讨论过思科如何能够通过其极其成功的并购策略取得如此巨大的成功。考虑到其行业的性质，如果思科没有完成如此多次成功的并购，很难想象它如何获得类似的成功。然而，仅仅因为公司非常成功，并不意味着它在进行并购交易时也会成功。一个极好的例子是微软在\
  \ 2007 年以 63 亿美元的全现金价格收购了`aQuantive`。这是这家非常成功的公司在开发一个能够与谷歌竞争的互联网部门时的失败尝试的一部分。人们可能会认为微软对这项相关业务有深入了解，但其表现背离了这一观点。微软开发了出色的搜索引擎`Bing`，但它无法让这个产品产生巨大的利润。2012\
  \ 年 7 月，该公司宣布计了一项 62 亿美元的亏损，这基本上抹去了该公司上季度的所有利润。\n\n微软为`aQuantive` 支付了高昂的价格，并投入了数百万美元到其开发互联网部门的失败尝试中。似乎认为拥有这样的业务对于这家非常成功的软件公司来说并不遥不可及。然而，尽管此前取得了成功并拥有丰富的财务资源，微软在利用并购将其触角延伸到谷歌领域方面是失败的。\n\
  \n### 通过插件式收购实现增长\n\n`插件式`（Bolt-on）收购是指与公司现有业务线自然契合的收购。它们有时被称为`附加式`（add-on）或`嵌入式`（tuck-in）收购。一些私募股权专业人士经常认为这是他们发明的术语，但它已经存在很久了——甚至在他们将业务名称从杠杆收购（LBO）公司改为私募股权公司之前（为了避免与\
  \ 20 世纪 80 年代许多负债累累的破产相关的联想）。\n\n插件式收购目标可能是一家公司，其产品线与买方的现有产品线互补，并且可以通过相同的销售人员进行销售。在私募股权的背景下，私募股权公司可能会收购目标并将其合并到他们已经收购的公司中，以便在他们退出投资时使该公司更稳健、更具市场吸引力。这种更大的市场吸引力可能来自更广泛的产品线。实现这一目标的方法之一是让私募股权公司收购其他公司，从而扩大其整体规模和产品线。这可以使合并后的业务在首次公开募股或其他销售过程中更具吸引力，且更容易进行营销。从这个意义上说，私募买方可以创造实际价值。而很多时候，他们只是提取价值然后转手卖掉收购的对象。\n\
  \n`插件式`一词的含义模糊，取决于使用者的解释。然而，它确实意味着“螺丝”契合得很好，且公司之间是互补的。互补意味着可能存在从收购者到目标公司之间回流的协同效益。Fich、Nguyen\
  \ 和 Officer 发现，为收购者股东创造最大财富的交易一些是插件式交易，即目标公司相对于收购者来说很小。(3)\n\n在医疗产品和制药领域增长良好的公司之一是强生（Johnson\
  \ & Johnson）。我们在接下来的案例研究中讨论了其成功的收购策略。\n\n### 了解何时退出业务\n\n在第 10 章中，我们讨论了通过剥离和出售进行的`拆分`或规模缩减（downsizing）。然而，当我们讨论通过多次并购计划来实现增长时，注意出售在这一计划中扮演的角色是非常重要的。\n\
  \n当一家公司通过并购激进增长时，管理层和投资者必须理解，并不是所有交易都能赢。这是正常的，因为市场会不断变化，很难预测竞争对手的行为和表现。我们可以通过考虑强生（J&J）如何利用并购成为支架业务领域的领导者，以及它后来如何接受自己已变成一个`陪跑`（also\
  \ ran）并退出该业务，同时利用释放出的资源在更成功的领域进行交易，看到这一点。支架是用于撑开堵塞血管的微小金属设备。\n\n1996 年以 18 亿美元收购`Cordis`使强生能够成为极具前景且快速增长的支架业务的主要参与者。事实上，强生在让支架在医学中得到更多应用方面发挥了重要作用，从而创造了市场。强生在支架市场的份额在\
  \ 2100 年上半年增长得令人印象深刻。这扭转了此前波顿科学（Boston Scientific）、雅培实验室（Abbott Labs）和美敦（Medtronic）等竞争对手夺走强生份额的趋势。然而，在\
  \ 2005 年至 2010 年间，强生再次看到这些竞争对手蚕食了它的市场份额。此外，业务本身也开始下降。这是一个糟糕的组合。\n\n强生不得不意识到，虽然支架业务曾很有前景，但在\
  \ 1996 年收购 15 年后，许多情况已经发生了变化。某些医学研究表明，支架可能被过度使用。其他研究似乎暗示，心脏病的发病率以及处理此类医疗事件时相关的重大心脏手术的使用率已经下降。此外，当竞争对手在这一停滞市场中的增长实际上增加时，这项业务已不再具有前景。\n\
  \n\n\n\n与其因某个市场的衰退而感到气馁，强生（J&J）在 2011 年果断止损并退出了支架业务，并在同年积极追求了其规模最大的收购案——耗资 197 亿美元收购了强赛斯公司。退出一个无增长的业务可以释放资源来追求其他高增长领域。曾几何时，支架业务是一个高增长市场。然而，医疗研究的发展是难以预测的。早期，此类研究意味着支架有广阔的未来。十五年后，研究方向却发生了了转。强生适应了不断变化的市场，接受了它曾享有的收益，但当市场下滑时，它果断止损并将重心转移到更高增长的领域。\n\
  \n### 从并购驱动增长到通过有机扩张增长\n\n某些行业要求公司达到一定的规模，才能成为行业中有意义的`players`。电信业就是一个很好的例子。美国消费者希望使用一家电信公司，能够让他们以竞争性的价格拨打到全国任何地方。事实上，全球化已将这一范围扩大到了世界任何地方。缺乏自有网络的小电信公司可能无法提供具有竞争力的费率，而他们必须具备这一点才能从主要运营商手中吸引消费者。因此，中小型公司面临着利用内部现金流和在证券市场获取的资金来实现网络缓慢有机增长的困境。另一种替代方案是使用并购（M&A）来更快速地增长。\n\
  \n许多其他行业的公司也面临类似的困境。那些能够通过并购快速增长的公司可以向证券市场展示其由并购驱动的快速增长，并将其转化为额外的资本，用于进行更多的并购和内部投资。公司可能遇到的问题之一是，在某个时刻，管理层可能需要放慢或关闭并购的“水龙头”。对于主要通过并购成长的公司，某些管理技能尤为重要，而经营公司正常的日常运营以实现有机增长则需要其他的管理技能。有些公司在这两个方面都取得了成功。思科（Cisco）就是一个很好的例子。多年来，它能够成功地主要通过并购增长，同时也能够成功地利用收购的实体促进其自身的有机增长。直到最近，它因为并购目标选择不当才遇到了困难。\n\
  \n接下来的案例研究——世界通（Worldcom），是一个典型的例子，该公司由一位出色的交易高手但糟糕的全面管理者所领导的。当公司达到足够规模时，需要将权力移交给真正的管理者，但董事会没有尽到职责，剩下的就都是历史了。\n\
  \n# 管控失控的交易手型 CEO\n\n我们在世界通的案例研究中看到，交易型 CEO 对某些公司来说起着至关重要的作用，帮助公司达到必要的规模，以便在市场中获得成功的机会。当达到这一规模时，公司的控制权需要移交给其他能够优化公司业务的经理。交易型\
  \ CEO 并不一定是最好的日常管理者。在多年里，思科的情况正是如此。显然，在世界通，伯尼·埃伯斯（Bernie Ebbers）在公司灭亡之前就应该被解雇。此类决策必须由董事会做出。为了让董事会履行职责，他们自己必须具备胜任能力且独立于\
  \ CEO。在这两个方面，世界通都没有做到。\n\n企业历史上的一个极佳例子是，成功实现了从并购交易高手转变为成功管理者的公司是通用汽车（GM）——在其更具成型的时期。\n\
  \n### 在低增长行业中利用并购实现增长\n\n如所述，公司管理层面临着展示成功增长的持续压力。当公司和行业过去实现过增长时，这一点尤为真实。然而，当某行业产品和服务的需求放缓时，继续增长就变得越来越困难。当这种情况发生时，经理层往往将并购视为展示增长的一种方式。通常希望此类收购不仅能带来收入增长，还能通过协同效应提高盈利能力。遗憾的是，通过简单相加收购目标的收入来产生销售增长，比提高整个企业的盈利能力要容易得多。事实上，人们可以认为，尽管收购带来了协同效应的可能性，但它们对管理层提出了更高的要求，因为他们现在经营的是一家规模更大的企业。管理层需要确保收入规模的扩大为股东带来了相应的等的利润和回报。如果不是，那么整个“通过并购增长”的策略就没有改善股东的地位，如果管理层接受成为一家增长较慢的公司，投资者的情况反而会更好。回想强生近期的并购史。并购是强生成为全球领先医疗保健公司之一的关键。然而，它通过收购辉瑞（Pfizer）的消费品部门进一步扩张消费品领域，是给公司带来许多问题的开端。\n\
  \n### 利用多种选择在低增长行业中挤出增长\n\n鉴于证券市场不断寻找增长，并且对似乎处于低增长模式的公司缺乏耐心，公司即使在所属行业没有增长时，也经常感到产生增长的压力。在这种情况下，有几种选择。一种是尝试通过削减成本和提高效率从平稳的收入中挤出更多利润。美国公司在次贷危机后非常擅长这一点，当时他们被迫在收入增长疲软的情况下提高效率并增加利润。\n\
  \n当一个行业处于低增长模式一段时间后，可能出现效率收益已经实现的情况，导致产生增长的机会较少。有时，解决方案可能是扩展到其他高增长的地理市场。例如，一个在成熟且增长缓慢的大型美国和欧洲大型市场中已实现销售最大化的公司，可能会寻求扩张中国、印度和巴西等高增长市场。我们将在第\
  \ 7 章中详细讨论跨境交易。然而，另一种替代方案是尝试在本土市场使用并购。\n\n这方面的很好的例子是香精行业，该行业在 20 世纪 90 年代显著放缓。该行业的公司向其他产品的制造商和营销人员销售产品。当他们发现终端产品的需求放缓时，对香精等中间产品的需求也随之放缓。食品制造商依赖各种供应商（包括香精开发人员）来开发新或改进的产品。冷冻食品业务就是一个例子。\n\
  \n\n\n\n为了理解香精化工行业的增长困境，了解其与增长相关的历史至关重要。微波炉的出现推动了该行业的增长。这类似于 20 世纪 80 年代消费电子行业中\
  \ `VCR` 等产品的影响。然而，当微波炉的普及达到顶时，冷冻食品业务的增长也随之放缓。向冷冻食品制造商销售的公司感受到了这种需求放缓的影响，表现为对其产品的需求减少，并且制造商向其施加了压力，要求其让价，以便制造商提高自身的利润率。面对增长缓慢的前景，且无法从其所服务的成熟市场中榨取大量收入，作为该行业最大的公司之一，国际香化香料公司（`IFF`）收购了竞争对手\
  \ Bush Boake Allen，后者的规模大约是 `IFF` 的三分之一。但从表面上看，收购 Bush Boake Allen 使 `IFF` 的规模扩大了三分之一，至少在这一低增长行业中营造出一种“显著增长”的假象。\n\
  \n收购 Bush Boake Allen 为 `IFF` 带来了一些增长，而美国整个行业正在进行整合。然而，鉴于 `U.S.` 和欧洲市场已经成熟，在这些市场进一步进行并购（M&A）并不是解决增长问题的办法。因此，公司必须在其他地方寻找增长点。他们后来通过关注新兴市场实现了这一点。具体而言，该公司得以在亚洲和拉丁美洲获得真正的增长，这抵消了美国销售额持平的事实。\n\
  \n### 处理低增长业务和行业\n\n高管有时会因为不接受现实而陷入麻烦。有时存在强大的、主性力量，它们使一个行业变成低增长行业。`U.S.` 经济中的银业就是这样一个例子。银业的盈利能力受多种因素驱动，包括经济状况。如果经济处于低增长时期，那么对贷款和其他银行服务的需求也会缓慢。基本的银行业模式涉及吸收存款并向存款人支付利息，同时将大部分资金以足够高的利率贷款，以涵盖银行开支并为股东提供合理的回报。问题在于，银行经理往往不愿接受这种枯燥的业务，并试图扩展到更具吸引性的金融领域，如自营交易和投资银行。\n\
  \n在 `2008` 年至 `2009` 年大衰退后的几年里，`U.S.` 经济一直难以实现 2% 以上的增长。此外，次级贷款危机的余波让银行对非首级借款人的贷款非常谨慎。在这种情况下，管理层要么可以接受现状，也可以尝试将银行转向其他提供更高回报的领域。通常，高回报意味着高风险。此类管理失误的例子比比可见。\n\
  \n一个例子是 `2000` 年年代的 `Citigroup`（花旗银行）。当 `Robert Rubin` 将他的专业知识带来 `Citigroup` 董事会时，他敦促银行承担更多风险。他们确实这么做了，并投资了如次级贷款等高回报资产，剩下的就都是历史了。讽刺的是，当面对“他曾建议银行采取此类措施”的事实时，`Rubin`\
  \ 的辩护理由是，他实际上没有执行这些交易，因此他不应该承担责任。美国企业界完全可以找到更好的领导者。`Rubin` 在金融危机中的作用最好由《黑天鹅》和《被随机性欺骗》作者纳西姆·尼古拉斯·塔勒（Nassim\
  \ Nicholas Taleb）教授来总结，他评价 `Rubin` 说：“这个星球上没有人比他更能生动地代表银行业的骗局。”“他从 `Citibank` 赚了\
  \ 1.2 亿美元，而该银行在技术上已经破产。”\n\n另一个高管推动其机构进入更高风险活动的近期例子是 `MF Global Holding Ltd` 及其最近的首席执行官\
  \ `Jon Corzine`。`Corzine` 曾在 `Goldman Sachs`（高盛）下职，然后利用他在 `Goldman` 积累的大笔财富进入政界。他获得了一些成功，成为\
  \ `U.S.` 参议员和州长，但再次被赶出，这次是被新泽西州的选民赶出的。随后他接管了 `MF Global` 的权力，尽管当时他自称对公司知之甚少——这不是一个好信号。随后，他指示公司的投资经理承担更多风险，例如欧洲债务。随后此类证券的市场崩溃，这反过来导致了\
  \ `MF Global` 的倒闭。回想起来，`MF Global` 如果选择一位薪水较低、知名度较低的高管会更好，这种高管只愿意追求可以现实且安全实现的适度增长。`MF\
  \ Global` 的错误在于追求了这位名声显赫的经理，而这位经理已经有采取导致巨损的风险记录，正如他在 `Goldman Sachs`担任固定收益部门主管时发生过的情况。\n\
  \n也许 `Corzine` 觉得他作为一名刚从政治失败中重回职场的新任高知名度 CEO，需要大干一场以证明公司对他的信任是正确的。如果是这样，那么他的做法更多是为了自己，而不是为了公司的盈利性增长。此外，由于\
  \ `Corzine` 在追求最终失败的政治生涯期间一直远离证券行业，他可能并没有处于最佳状态。此外，他的领导地位基本上取代了公司的投资和风险管理职。然而，如果市场疲软且缺乏增长机会，公司董事会需要确保新任命的、近期重返战场的\
  \ CEO 不会押注于公司通过追求风险策略来实现目标。回想起来，公司在动荡的市场时期如果采取一种风险较低、不那么“全投入”的策略，并接受一段时间内增长将是缓慢的会更好。\n\
  \n还有许多其他公司追求高增长且不愿接受其业务是低增长（尽管稳健）业务的例子。一个是由扩张大师 `Jean Marie Meissier` 经营的 `Vivendi`（威旺）。我们将在\
  \ `第 4 章` 中详细讨论此案例。另一个具有启发性但几乎难以置信的案例是 `Montana Power`。这似乎令人难以置信，因为很难接受管理层会建议、且董事会会接受建议，基本上放弃\
  \ `Montana Power` 多年来从事的安全但低增长的主营业务，转而进入一个高风险且巨大的业务。尽管如此，这就是 `Montana Power` 那无所不知的管理层和董事会所做的。\n\
  \n### 通过并购进行地理扩张\n\n另一个利用并购促进增长的例子是公司想要扩张到另一个地理区域。可能是因为公司的市场位于国家的一个地区，但它想扩张到其他地区。或者，也许一家公司在其国家市场拥有很强的市场份额，但寻求开发其他国家市场，例如\
  \ `South America` 或 `Asia`。在许多情况下，通过收购进行地理扩张可能比通过内部开发更快、风险更小。这在国际扩张中可能尤为如此，因为在新的地理市场取得成功需要许多特征。公司需要了解新市场的所有重要细微差别。它需要招募新员工并克服语言和习惯障碍等许多其他障碍。内部扩张可能慢得多且困难得多。合并、收购、合资企业和战略联盟可能是最快且风险最低的替代方案。\n\
  \n\n\n\n### 国际增长与跨境收购\n\n在 20 世纪 90 年代，特别是在 21 世纪 00 年代，欧洲和美国公司日益意识到，其*本土*地理市场的增长机会变得越来越难以实现，而新兴市场的增长机会则提供了更大的潜力。在许多行业中，当市场成熟时，实现增长和增加市场份额是困难且成本高昂的。在这些行业中，可能只有几家大公司，获得额外的市场份额不仅昂贵而且需要付出巨大努力。然而，当一家公司的产品可以引入不断增长的国际市场时，其收益*可能*成本更低且更容易实现。\n\
  \n对于寻求进入这些市场的既有公司来说，新兴市场提供了巨大的机会。通常情况下，那些在本土市场取得巨大成功并拥有既有品牌的公司，可以利用其在本土市场确立地位时所投入的大部分工作。此类公司可能比新兴市场中的新公司更具优势，因为那些新公司可能试图利用其自身市场不断增长的需求。这类例子数比完完，但最好的例子就是英国酒业巨头帝怡得（Diageo）。我们在第\
  \ 7 章中探讨通过新兴市场并购寻求增长机会时，会讨论这家公司。\n\n### 利用汇率波动追求高增长并购\n\n汇率波动可以为成功的并购带来机会或障碍。对于货币贬值国家的公司来说，这可能会制造障碍；另一方面，对于货币升值的公司来说，这可能创造机会。2011\
  \ 年就是如此这种情况，当时日元升值。鉴于日本经济的出口导向性，这对许多日本公司来说通常不是好消息。然而，考虑到日本已经应对了多年的经济停滞，许多日本企业开始向其岛国经济之外扩张。^(6)\n\
  \n公司利用本国货币升值的一个主要例子发生在 2011 年 5 月，当时武田药品（Takeda Pharmaceutical）达成协议，以 96 亿欧元（137\
  \ 亿美元）收购瑞士的尼康德（Nycomed）。与全球许多其他制药并购一样，这部分动力源于制药公司在开发新型大型药物方面面临的困难，以及应对来自仿制药的竞争。通过收购尼康德，武田能够增加其针对胃部、呼吸道和炎症性疾病的治疗产品。然而，由于日元兑欧元的升值（参见图\
  \ 2.5），它能够以廉的价格完成交易。这笔交易是任何日本公司规模最大的海外收购之一。事实上，尼康德在 2008 年已经进行过一笔巨交易，当时以 88 亿美元收购了美国生物技术公司千禧年（Millenium）。\n\
  \n![img](img/n02f005.gif)\n\n**图 2.5**](#chapter02.xhtml__back11) 日元/欧元 2007–2012\n\
  \n*来源：* Oanda 外汇交易。\n\n与大多数主要制药公司一样，武田在开发新的重磅药物方面面临困难。仿制药一直是其销售的拖累，随后日元的升值使其在日本境外扩大销售变得更加困难。然而，武田并没有沉溺于其这种艰难的境地，而是转危为机，利用升值的日元大幅扩大了该公司在全球制药市场的地位。\n\
  \n其他日本公司利用日元升值的例子还包括：日本第四大化妆品制造商宝洁丽控股（Pola Orbis Holdings）于 2011 年以约 3 亿澳元收购了澳大利亚护肤品公司茱莉利克（Jurlique\
  \ International Pty Ltd）（该金额在 2011 年约同于美元）。对茱莉利克的收购让宝洁丽控股不仅进入了高增长的澳大利亚市场，还进入了茱莉利克拥有良好基础的香港和中国市场。\n\
  \n同样在 2011 年，日本啤酒制造巨头朝日集团控股（Asahi Group Holdings）以未披露金额收购了澳大利亚矿物水公司 Mountain H2O。这笔交易的公告是在朝日宣布其打算以\
  \ 13 亿美元收购新西兰的独立酒类公司（Independent Liquor）之后发布的。自 2011 年 4 月以来，日元对澳元总体呈上升趋势（参见图 2.6）。\n\
  \n![img](img/n02f006.gif)\n\n**图 2.6**](#chapter02.xhtml__back12) 日元对澳元：2007–2012\n\
  \n*来源：* Oanda 外汇交易。\n\n这些都是日本公司在其自身陷入困境的经济之外寻求增长的几个例子。然而，这些决策中的关键要素是相关货币汇值的有利波动，这降低了收购成本，并使公司能够在更高增长的市场中追求增长。\n\
  \n### 在高增长市场寻找增长\n\n正如讨论过的，当一个业务已经*耗尽*了某个市场的增长潜力，且许多竞争对手在同一市场中进行激进竞争时，实现真正的增长是一项挑战。通常，需要增加营销支出仅仅为了获得微弱的增长，甚至仅仅是为了维持公司目前的业务量。这在\
  \ 20 世纪 90 年代和 2000 年代的许多美国、欧洲以及日本公司都是如此。在美国汽车行业，情况更为糟糕。主要的美国汽车制造商在质量问题中挣扎，并由于必须承担由不灵活工会（美国汽车工人）施加的高昂成本负担而处于竞争劣势。在第\
  \ 7 章中关于通用汽车（GM）的案例研究描述了一家在全球最快市场——中国获得成功和增长的公司。\n\n\n\n从公司财务的角度来看，对如此多元化领域的收购是极具争议的。实际上，管理层正在追求一种昂贵的策略，试图让他们的经营结果看起来不那么波动。然而，当企业追求高昂的收购时，股东调整其投资组合的成本要比公司低得多。此外，每位投资者都可以在考虑其周期性波动特性的同时，选择自己的每种证券。这是否排除了并购（M&A）作为周期性问题的解决方案？答案显然是`no`。\n\
  \n全球化的许多益处之一是，我们拥有了一个全球经济体系，在这个体系中并非所有公司都面临相同的周期性。世界上最大的两个市场是美国和欧洲。曾几何时，，美国投资者可以通过投资欧洲获得显著的多元化收益。然而，部分通过并购，美国和欧洲公司的收益表现出大得多的程度的协方变性。事实上，当一个市场出现问题时，这些问题会迅速扩散到另一个市场。例如，美国抵押贷款市场和次贷危机，以及\
  \ 2010 年至 2012 年的欧洲债务危机。欧洲债务危机和经济衰退也减缓了中国的增长，对于出口导向型的中国经济而言，欧洲是一个巨大的市场。尽管如此，经理们仍然可以寻求其他市场，试图抵消他们的一些周期性波动。\n\
  \n虽然全球化意味着一个市场的低迷可能会在地理位置上远于自身市场的市场中被感受到，但影响的程度会有很大差异。例如，中国、印度和巴西的高增长市场无疑会有自己的`recessions`，并且受到世界其他地区增速放缓的影响。然而，这些经济体增长如此之快的事实对成熟市场的公司可能会产生巨大影响，因为这些公司在繁荣时期增长缓慢，在衰退期间增长为负。例如，多年来中国的增长一直保持在\
  \ 9%到 11%之间。人们可能认为中国 6%的增长率就是一种衰退。事实上，在 2010 年和 2011 年，中国人民银行上调了利率并将存款准备金率提高至 27.5%，以放缓一个表现出通胀压力的经济。讽刺的是，欧洲等中国出口市场的增速放缓减少了部分通胀压力，使中国央行能够部分放宽货币政策，因为主要问题变成了增长放缓，对通胀的担忧也减少了。\n\
  \n如果增长较慢市场的公司可以通过并购利用快速增长市场的购买力，它们就可以通过利用快速增长市场不同的周期性波动，让即使是高度周期性的公司也能享受显著更快的增长。\n\
  \n当美国和欧洲等市场的发达国家进入衰退期时，他们可能会放缓对中国等快速增长国家产品的购买。这将对中国经济产生负面反馈效应。然而，这些负面影响将通过中国经济固有的增长得到极大抵消。印度和巴西也是如此。当世界经济陷入停滞时，这些国家可能仍然保持令人印象目的增长。\n\
  \n即使增长稍微放缓，正如中国在 2012 年所做，与许多相对停滞的西方和日本经济相比，市场仍然增长得较快。低增长市场的公司可以寻求进入高增长市场，并分享它们截然不同的周期性波动，作为在自身经济`turns\
  \ south`时避免大幅减速的一种。\n\n重型设备制造商卡特彼勒（Caterpillar）的情况正是如此。2008 年至 2009 年的大大衰退对其业务造成了沉重打击。2009\
  \ 年的收入下降了惊人的 39%，这是其半个世纪以来最大的单次跌。然而，故事中真正令人印象深刻的是其 2010 年收入增长了 31%。反弹有很多原因，但其中一个原因是公司能够从美国境外产生超过二之三的收入。能够做到这一点的部分原因是其使用了并购，这使得卡特彼勒成为一家真正的全球性公司，并在全球推销其知名品牌和高质量产品。该公司公司不再与美国业务周期同步起伏。相反，它面临的是一种更广泛的周期性波动，这种波动与美国经济并不同步。在遥远彼岸的快速发展的市场中通过并购追求增长对于卡特彼勒来说并不顺利。正如我们将在书的后部分讨论的那样，卡特彼勒在收购亏损的思维（Siwei）时遭遇了巨大挫折。由于目标公司涉嫌欺诈，它最终不得不注销为该实体支付的\
  \ 7 亿美元中的大部分资金。这凸显了试图从远离公司总部的市场中榨取增长所伴的风险。\n\n## NOTES\n\n### 第 3 章\n\n## 协同效应\n\
  \n许多合并与收购（M&A）之所以以实现预期协同效应为理由是合理的。这听起来通常很棒。此外，这很难反驳，因为它指的是未来可能发生的利益——可能在多年之后。有时，这种现象的发生或不发生是在提出绝妙主意的\
  \ CEO 离开现场很久之后才发生的。鉴于许多此类预期的协同效应未能出现是常有的事，而且考虑到，在 CEO 及其董事会未能实现这些目标时要求他们承担财务责任的机制（例如通过追回补偿）几乎总是是不完善的，因此进行更严谨的`a\
  \ priori`（先验）分析至关重要，以便进行客观评估。交易决策者需要能够批判性地评估拟议协同效应，并确定它们发生的概率。幸运的是，有一些实用的研究可以为这类协同效应提供见解。遗憾的是，很少有交易决策者意识到这些研究。更糟糕的是，有些人不想知道这些研究，以防它暗示了拟议交易可能不会产生他们所言的利益。对于后者这一群体没什么可说的，但我们尝试在本章中为那些发现这些有用知识的人增加信息\n\
  \n### 并购背景下的协同效应是什么？\n\n在并购的背景下，协同效应是指两家公司的合并创造了一个比两个公司独立价值总和更高的实体。这个术语通常与物理科学相关，而不是与经济或金融相关。它指的是当物质或因素结合时，产生比它们独立运作时更佳的效果的反应类型。例如，在化学中，当两种化学品结合产生一种比它们分离效应之和更强效的总反应时，就会协同反应。\n\
  \n在并购中，协同交易是指 2 + 5。然而，正如每个初级小学级学生所知道的，2 + 4，所以对这种新数学的怀疑和疑虑应该放在脑中。\n\n\n\n\n预期的协同效应使得企业能够证明承担收购过程费用是合理的，并且有能力为目标股东支付股票溢价。协同效应可能使合并后的公司显示出正向的`净收购价值`\
  \ (NAV)。\n\n(3.1 ![equation](img/c03-mdis-0001.gif)\n\n其中：\n\n`V[AB]` = 两家公司的合并价值\n\
  `V[A]` = A 的价值\n`V[B]` = B 的价值\n`P` = 为 B 支付的溢价\n`E` = 收购过程的费用\n\n重组公式 3.1，我们得到：\n\
  \n**(3.2)** ![equation](img/c03-mdis-0002.gif)\n\n括号中的项为`协同效应`。该效应必须大于 `P + E` 之和，才能证明合并的合理。如果括号项项大于\
  \ `P + E` 之和，则竞价公司对目标公司支付过高。评估这个简单方程的问题之一在于，不仅协同效应的衡量难以把握，有时甚至费用 `E` 也难以估量。有时目标公司会带来一些隐藏的负债，这些负债在交易完成后很长时间才可能被发现。目前，我们的重点是协同效应。\n\
  \n这些协同效应是什么？当我们进行交易时，又如何知道它们会超过 `P + E` 呢？协同效应有时定义得很宽泛，包括某些变化，例如通过引入收购方更有能力的管理层来消除低效的管理。^(1)尽管我们可以采用这样宽泛的定义，但我们将选择一个更窄且更易量化的定义。这种方法与`协同效应`一词更常见的用法一致。^(2)\n\
  \n### 协同效应的实现：一种概率事件\n\n当我们听到管理层宣布另一项收购时的预测时，他们淡化了协同效应永远无法实现的可能性。协同效应往往无法实现这一事实，是市场对并购公告做出反应并降低竞标者价值的原因之一。\n\
  \n必须承认，实现重大协同效应是一个不确定的结果。对于经常进行并购的公司（如思科，不排除其近期的一些失败的并购案例），有更多数据点可以用于评估成功的概率。即使竞标者没有进行过多次并购，行业的成功率也可以提供一些信息。\n\
  \n评估者需要意识到，协同效应的实现是不确定的，而且对于某些公司和行业来说，这种不确定性比其他时候更大。如果一家公司收购其行业之外的目标公司，实现重大协同效应的概率通常会低于行业内的交易。正如我们在第\
  \ 4 章中看到的，关于多元化交易记录，有一些具有说服力的研究证据可以支持这一断言。\n\n### 协同效应的类型\n\n两种主要的协同效应类型是运营协同和财务协同。运营协同有两种形式：收入增强和成本削减。这些收入增强、效率提升或运营经济可能源于水平或垂直合并。财务协同可以以不同的形式出现，但最常见的形式之一是，通过合并一家或多家公司导致资本成本降低和/或资金可用性增加。\n\
  \n#### 收入增强型运营协同\n\n收入增强型运营协同通常比成本降低型协同更难实现。它可能源于两家合并公司结合产生的新机会。^(3)收入增强有很多潜在来源，它们可能随交易的不同而异异。它们可能源于交叉营销，即每个合并伙伴向对方伙伴的客户销售自己的产品和服务。也许它们可能源于拥有更广泛的产品线，这可以扩大销售机会，同时产生竞争优势并有助于确保客户留存。\n\
  \n交叉营销具有扩大每个合并伙伴收入基础的潜力，从而使每个伙伴能够快速实现更大的收入。也许较大的公司经营一个主要品牌并具有很高的市场认知度，这可以为被收购的小型公司增加信誉。有时，收购方拥有一个大名，例如宝华（Procter\
  \ & Gamble），但该名称本身并不是一个产品名称，因为它代表的是一系列其他品牌的集合。当这样的收购方收购另一家公司（如吉列 Gillette）时，它真的获益了吗？吉列本身在市场上已经作为市场领导者而广为人知，其名称与产品直接相关，而不是与宝华的名字。\n\
  \n真的有人会因为某个产品在宝华旗下而购买它吗？例如，有人会购买 Charmin 卫生纸是因为该品牌属于宝华吗，还是销售归功于 Charmin 的广告和产品质量？然而，处于宝华网络中还带来了其他协同效益。该公司实体拥有巨大的市场影响力，并可以获得诸如大型商店货架空间等优势，而这些是个人品牌难以获取的。另一方面，当像吉列这样在\
  \ 2005 年被宝华收购的公司在零售店中已经拥有了这样的地位时，协同效益又是什么呢？\n\n收入增强型协同效应`可能`实现的多种方式是简短描述无法能穷尽的。它可能源于一个拥有主要品牌名称的公司将其声誉提供给合并伙伴即将推出的产品线。或者，它也可能源于一家拥有强大分销网络的公司与一家拥有巨大潜力但在竞争对手反应并抢夺机会窗口之前无法将产品推向市场的公司合并。另一个例子可能是大公司提供了较小目标公司缺乏的更广泛的管理知识和财务资源。\n\
  \n尽管协同效应的来源可能是巨大的，但收入增强型协同有时难以实现。此类增强很难量化并建立到估值模型。这并不意味着交易推动者（如投资银行家）不愿意将这些潜在收益纳入他们的估值模型。只是这些收益有时可能很难证明——特别是根据对这类所谓收益的过去经验。\n\
  \n\n这是导致某些交易未能实现预期收益的原因之一。问题的根源可以追溯到糟糕的合并前规划，以及对拟议收入增长方案缺乏充分的关键研究。这种模糊且普遍性糟糕的合并规划，最具戏剧性的例子莫过于史上规模最大的交易之一——2002\
  \ 年 AOL 与时报华（Time Warner）那场灾难性的合并。在交易当时，AOL 和时报华两位首席执行官的论点是，这是内容（Time Warner）与通过互联网进行的新分发方式（AOL）的合并。至于如何运作才能增加收入非常模糊且未定义。这本应引起许多警报。意不的是，事实并没有出现收入增长，时报华最终将自己的公司送给了\
  \ AOL 股东，以换取暂时被高估的 AOL 股票。这恰恰证明了公司治理存在的问题：时报华首席执行官无需交回他为领导公司进行如此糟糕交易而从时报华获得的大部分报酬。相反，他带着口袋里大量的股东钱拍扬而而去。我们将在后续\
  \ AOL–时报华合并案例研究中进一步探讨这桩灾难性的交易。\n\n#### 降低成本的运营协同效应\n\n降低成本的协同效应通常比增强收入的协同效应更容易实现和预测。这些成本削减可能源于规模经济——由于公司运营规模或规模增加而导致单位成本降低。钢铁行业通过像拉克什希米·米塔尔（Lakshima\
  \ Mittal）策划的合并进行的整合，就是一个通过更大、更高效的工厂以及消除低效率工厂来获得更低单位成本收益的例子。当像米塔尔这样的交易决策者说他们可以实现某些成本削减时，这些话具有一定的信誉，因为他过去已经过许多基于成本效益的交易。\n\
  \n制造型企业，尤其是资本密集型企业，通常在低产出水平下高单位成本运行。这是因为运营其制造设施的固定成本被摊在了相对较低的产出水平上。随着产出水平的提高，单位成本会下降（参见图\
  \ 3.1）。这有时被称为分摊间接费用。这些收益的其他来源还源于劳动和管理专业化的提高，以及对资本设备更有效的利用，这在低产出水平下可能是不可能的。这种现象在一定的产出范围内持续存在，此后随着公司经历规模不经济，单位成本可能会上升。规模不经济的产生可能是因为公司在协调更大规模的运营时产生了更高的成本和其他问题。规模不经济存在的程度是许多经济学家之间争论的话题。一些经济学家引用大型跨国公司（如埃克森美孚和通用电气）的持续增长作为证据。这些公司在保持长期增长的同时，仍向股东支付可接受的股本回报率^(4)。另一些则认为，如果这些公司规模更小、更高效且更专注，将能够为股东提供更高的回报率。\n\
  \n![img](img/n03f001.gif)\n\n**图 3.1** 平均成本与规模经济及规模不经济\n\n如果首席执行官追求收入和规模增长以为自己创造个人财务和心理收益，就会产生冲突。在某个时刻，公司可能会变得大到无法有效，从而在规模不经济范围内的平均成本曲线上移动（参见图\
  \ 3.1）。在这一曲线上，那些不断增长的、大而不能倒的美国银行处于什么位置？\n\n### 行业对成本经济的追求\n\n对成本经济的追求有时是一种行业现象。有时它受到监管因素的启发，例如银行业发生的去监管化，这引发了持续二十年的并购热潮，且这种热潮持续到了今天。公司首席执行官虽然喜欢假装自己无无不知，并对自己的战略计划充满信心，但在模仿竞争对手策略时，往往会随大流。回想一下制药公司对药剂福利管理公司的收购，例如默克（Merck）对\
  \ Medco 的失败收购。罗氏（Roche）在以 53 亿美元收购辛特科技（Syntex Corp）时，也收购了一家药剂福利管理公司，而李施来（Eli Lilly）则以\
  \ 41 亿美元购买了 PCS 健康系统。这些交易并未经过周全考虑，表现并不理想。\n\n在某些行业中，我们看到公司进行并购的趋势是因为竞争对手正在进行并购。其他时候，它是广泛因素（如行业全球化）的产物。例如，啤酒行业的全球化是该行业努力在全球范围内销售啤酒品牌，并利用像英宝译达（Inbev）这样真正的全球性营销者能为百森威威（Anheuser-Busch）和\
  \ Modelo 等公司带来的益处的的产物。以美国为中心的百森威威在将其极成功的百威啤酒（Budweiser）和米舍乐（Michelob）品牌扩展到美国境外做得糟糕。英宝译达的巴西投资银行接管了合并后的时代啤酒（Interbrew）的控制权，该公司拥有时代培乐（Stella\
  \ Artois）和百洁（Becks）等品牌，以及在南美酿酒市场占据主导地位的安博维（AmBev）。在本章的后后部分，我们将讨论英宝译达通过收购百森威威对成本经济的追求。\n\
  \n其他时候，全行业的收益可能来自协同效应，例如成本经济以及范围经济。美国邮轮线行业就是这种情况。该行业曾一度相对分散，鉴于收购邮轮船的高昂资本成本以及国家和国际营销计划的昂贵成本，这并不寻常。我们将在随后的案例研究中详细讨论这一点。\n\
  \n### 并购中的运营经济研究\n\n鉴于协同效应（特别是成本相关的经济）经常被认为是追求各种并购的原因，研究此类协同效应是否发生是有用的。有哪些实证证据支持这些基础？\n\
  \n幸运的是，有跨越长时间的实证支持并购有时被有效用于实现运营经济。例如，利滕堡和西格尔（Siegel）检测到所有权变更后的工厂效率得到了提高^(5)事实上，他们发现表现最差的工厂最有可能发生所有权变更。还有一些较新的研究支持这些发现。Shahrur\
  \ 研究了 1987 年至 1999 年期间 463 起水平合并和要约期间产生的收益。他注意到正向的合并方/目标回报，并根据这些发现推断市场认为这些交易增强了效率^(6)这些结果与\
  \ Fee 和 Thomas 对 1980 年至 1997 年间 554 水平交易的分析中发现的市场反应（三日窗口内正收益为 3.06%）是一致的^(7)\n\n\
  然而，不应仅仅因为研究样本中的某些并购与运营经济有关，就得出并购是实现此类经济最佳方法的结论。这一命题并没有得到经济研究的支持。\n\n### 范围经济\n\n\
  \n\n\n另一个与规模经济密切相关且有时被混淆的概念是`范围经济`（economies of scope），它是企业利用一组投入来提供更广泛产品和服务的能力。范围经济的一个很好的例子出现在银行业。在银行业中，范围经济在解释并购（M&A）方面可能与规模经济同样重要。对这些经济的追求是因素之一，尽管可能排在规模经济之后，但它解释了\
  \ 20 世纪 90 年代第五次并购潮中发生的银行业整合。\n\n当金融机构合并时，它们可以共享投入以提供更广泛的服务，例如信托或财富管理部门、消费者投资产品部门或经济分析小组。财富管理业务大幅扩张的一个例子是金融超级市场\
  \ `Bank of America`（美国银行）于 2007 年以 33 亿美元收购了 `U.S. Trust`。其目标是通过收购该领域的领先公司之一——拥有\
  \ 104 年历史的盛誉财富管理公司 `U.S. Trust`，来极大地扩大 `Bank of America` 在这一业务中的地位。这家高端银行能否与 `Bank\
  \ of America` 的超市化文化良好融合是另一个问题。\n\n较小的银行可能负担不起大银行提供的某些各种能力的成本。在去监管时代之后，银行合并数量增加，增强这些能力是这种增加的真正原因还是充分理由，这是一个完全不同的问题。第四次并购潮期间发生的许多银行合并导致了行业中一种新型银行——超区域银行。对其他区域银行的收购在很大程度上解释了\
  \ 20 世纪 80 年代超区域银行的增长。这些超区域银行，如 `Bank One Corporation`、`Barnett Bank` 和 `NationsBank`，增长到在提供许多服务方面可以与规模较大的货币中心银行竞争的程度。其他银行，如\
  \ `Bank of New England`，通过收购扩张过快，遭遇了财务困难。\n\n在 20 世纪 90 年代，超区域银行 `NationsBank` 和\
  \ `First Union` 继续扩张，并成为美国最大的银行之一。然而，在第五波浪中，美国银行业继续整合，超区域银行被规模更大的银行合并或收购。首先，`First\
  \ Union Bank` 在 1996 年收购了 `First Fidelity`，当时它正在收购其他几家中型银行。1997 年到 1998 年间，`NationsBank`\
  \ 收购了 `Boatman's Bank`、`Signet Banking Corp.` 和 `Barnett Banks, Inc.`。随后在 1998 年，`NationsBank`\
  \ 本身与 `Bank of America` 合并，并采用了更为人知的 `Bank of America` 品牌。\n\n2001 年，`First Union`\
  \ 以一项 136 亿美元的交易与 `Wachovia` 合并。然而，并购证明是 `Wachovia` 的毁灭因素，因为它无法消化次贷贷款发行商 `Goldenwest\
  \ Financial`，后者是美国西部和西南部最大的发行商。\n\n`Wachovia` 最初将并购作为有价值的协同增长工具的成功在 `Washington\
  \ Mutual` 身上得到了镜像。通过并购，首席执行官 `Kerry Killinger` 将一家小型的西北储蓄银行建立了一家领先的全国性银行。像许多其他纯并购增长的故事一样，CEO\
  \ 并不知道如何关闭收购引擎并管理他所创建的巨大银行。管理不善和贪婪占据了主导地位，该机构在其贷款组合上遭受了巨大损失，导致了银行挤兑。当银行继续关注并购时，贷款控制被抛之脑后。当其贷款损失被市场得知时，发生了银行挤兑，监管不得不介入安排了一个可以接受的合并伙伴。机巧的\
  \ `JPMorgan Chase` 迅速吞并了该银行及其建立的分行网络。对于 `JPMorgan Chase` 来说，这是一个幸事，因为它最终在佛罗里达州等此前缺乏业务的大市场获得了分行网络。\n\
  \n在最大的储蓄银行 `Washington Mutual` 失败后，面临类似抵押贷款问题的 `Wachovia` 股价崩盘，并被迫于 2008 年 12 月以\
  \ 150 亿美元出售给 `Wells Fargo`。我们在随后的单独案例研究中讨论了 `Wachovia` 对并购的使用和误用。该案例包含许多教训，但主要讲述了公司及其\
  \ CEO 如何会如此痴迷并购，以至于无法识别何时该关闭并购的开关。如果你擅长并购并能通过交易获得快速增长，那么进行更多并购可能是最容易的事情。然而，停止并购增长过程并管理你拥有的公司通常困难得多。对自己的管理能力没有信心的经理将继续推动并购进程，直到他们毁掉公司。在管理中型公司方面称职的经理，在管理非常大的公司可能会超出能力。董事会需要意识到这些问题，并识别何时需要更换管理层。然而，如果\
  \ CEO 对董事会行使过大，这可能很难实现。\n\n银行不是唯一发生此类失败的行业。看看电信行业，`Worldcom` 就是这种情况。我们已经讨论过该公司的首席执行官\
  \ `Bernie Ebbers` 实际上只擅长并购，在 `Lehman Brothers` 的管理层摧毁那家历史性的投资银行并成为最大的投资银行之前，他就应该被要求下职了。\n\
  \n\n\n\n\n我们已经讨论过一家公司如何频繁追求失败的并购（M&A）策略，而竞争对手会盲目追随类似的、不加思虑的策略。在 20 世纪 90 年代到 2000\
  \ 年代，不仅是`花旗集团`(Citigroup）追求了这种失败的“一站式”金融服务策略。该策略的一个关键要素是银行与保险的结合。这种结合几乎毫无意义。想想看：如果你在某金融机构开有银行账户，如果它提供人寿险和财产意外险，你是否会仅仅因为你开户的银行拥有某家在该高度竞争市场中提供服务的保险公司，就更有可能购买此类保险？如果这家银行还拥有一家经纪公司呢？你是否更有可能在开有结算账户的银行所拥有的公司开设经纪账户？如果我们在问题中加上这样一个事实：这些业务并没有得到有效的整合，而交叉营销充其量只是个笑话，结果又如何？\n\
  \n1988 年，`瑞信银行`(Credit Suisse）收购了`波士顿第一`(First Boston）44%的股权，作为对美国领先投资银行之一进行“救助”的一部分。这家银行当时陷入了收购`俄亥俄床垫`(Ohio\
  \ Mattress，席来床垫的制造商）后无法对桥接贷款进行再融资的困境。这笔交易被称为“烧毁的床垫”。垃圾债券市场崩溃，而这家领先的并购“顾问”——`波士顿第一`似乎无法对自己的市场状况提供建议。`瑞信银行`以牺牲`波士顿第一`为代价获得了。它最终收购了`波士顿第一`的剩余股份，并随后取消了著名的`波士顿第一`品牌。然而，`瑞信银行`很快证明了它对自己的行业以及并购在其中可能产生的破坏性作用也并不了解。1997\
  \ 年，`瑞信银行`收购了`信义保险`(Winterthur Insurance)。随后它开始将自己营销为“多元化金融服务公司”无论这意味着什么意思。2006\
  \ 年，`瑞信银行`卖掉了`信义保险`。银行与保险的结合就此为止了。当这些知名银行自诩为并购专家，并通过营销此类服务赚取巨额利润时，这些并购失败案例显得相当滑稽。\n\
  \n`花旗集团`和`瑞信银行`并不是金融服务行业中唯一的无能收购者。为了不输给那些进军保险行业的强势银行，德国保险巨头、欧洲最大的保险公司`安联集团`(Allianz)在\
  \ 2001 年以 380 亿美元收购了德国第三大银行`德累斯登银行`(Dresdner)。这是一次昂贵的收购，但成功的`安联`能够负担得起——或者至少其股东负担得起——不是吗？正如我们讨论过的其他金融服务失误一样，`安联`拥有一种糟糕但昂贵的合并策略。它寄希望于能够交叉销售服务。结果相反，它收购了一家拥有巨额贷款相关负债的公司。这是并购成本难以提前衡量的另一个例子。2008\
  \ 年，`安联`宣布以 143 亿美元出售`德累斯登银行`——这不到其收购价格的一半。一如既往，这从不是管理层的过错。是无法预见的客观情况造成的。\n\n###\
  \ 银行合并中的成本效益：美国对比欧洲\n\n虽然我们花费了大量时间讨论并购失败，旨在制定避免此类昂贵失误的方法，但我们也需要关注许多并购成功案例。银行业在这方面有着悠久的成功历史。\n\
  \n### 成功的成本削减案例\n\n1991 年，`化学银行`(Chemical Bank)收购`制造商汉诺威信托银行`(Manufacturers Hanover\
  \ Trust)是一个成功的成本削减案例。当交易宣布时，两家公司预计将节省约 6.5 亿美元（按 2013 美元计算为 11 亿美元）。然而，通过关闭不必要的分行和消除冗余开支所获得的实际节省金额被证明多出约\
  \ 1 亿美元。这笔交易的成功是导致`化学银行`在 1995 年以 130 亿美元的交易价格与`大通曼哈顿`(Chase Manhattan)合并的因素之一（按\
  \ 2013 美元计算为 221 亿美元）。此家银行将继续与其他主要的金融机构合并，创建了全球最大的银行之一。2000 年 9 月，`摩根大通`(J. P. Morgan)与`大通曼哈顿`合并。仅仅四年后的\
  \ 2004 年，`摩根大通追随`(J. P. Morgan Chase)与`第一银行`(Bank One)合并，形成了我们现在所知的`摩根大通`(JPMorgan\
  \ Chase)银行机构。\n\n### 市场趋势与成本效益\n\n自行业放宽以来，过去 25 年里银行业经历了显著整合。问题出现了：当银行进行并购计划时，它们是否能实现成本效益？在进行若干次交易后，成本效益何时会消失——并可能出现规模不经济？\n\
  \n对第四轮合并潮银行合并的研究并未显示合并银行能带来显著收益。例如，`Houston`和`Ryngaert`分析了 1985 年至 1991 年间的 152\
  \ 宗银行合并，发现收购方的公告平均收益率为–2.25%，而目标公司的收益率为 14.77%。这两位作者随后的另一项研究利用了 1985 年至 1992 年间的\
  \ 184 宗合并，发现收购方和目标公司的收益率分别为–0.24%和 20.4%。虽然来自第四次合并潮的证据并不令人深刻，但有更近的证据表明，银行合并确实实现了协同收益，且该行业的合并并非仅仅是为了为首席执行官（CEO）建立帝国。例如，`Becher`分析了\
  \ 1980 年至 1997 年间的 558 宗美国银行合并。在整个时期，他发现收购方的收益与零没有显著差异，而目标银行股东获得了正收益。然而，在 1990 年代（第五次合并潮），情况有所改善，收购方和目标方的收益均为正。他得出结论，这些银行业交易为双方公司的股东带来了真正的利益，而不仅仅是\
  \ CEO。\n\n### 欧洲市场分析\n\n已有若干研究发现，欧洲银行在合并后实现成本效益方面可能比美国同行更为成功。通过事件研究法，`Cybo-Ottone`和`Murgia`发现欧洲银行合并带来了异常收益。这意味着市场看到了收益，而银行合并最显而见的收益就是成本效益。然而，更直接的是，`Vander\
  \ Vennett`在 1988 年至 1993 年间的 492 宗欧盟银行合并中发现了平均运营成本下降的证据。其他研究则关注特定的欧洲国家。例如，`Humphrey`和`Vale`发现挪威银行合并后运营成本降低了\
  \ 2%。`Resti`在意大利发现了类似的收益，而`Hayes`和`Thompson`在英国也得出了结论。有些研究发现西班牙银行合并的益处很小。虽然`Valverde`和`Humphrey`对\
  \ 1986 年至 2000 年间的 22 宗西班牙银行合并总体上发现了类似的中性结果，但他们确实在大交易以及银行拥有更多合并经验的交易中检测到了成本效益的存在。这意味着在该市场中，银行在实践中学习时会有更强的学习效应。`Valverde`和`Humphrey`的结果很有趣，因为考虑到许多对美国银行合并的研究发现\
  \ 1980 年代的收益较低，而 1990 年代的收益更大。这可能也意味着美国市场存在某种学习效应。\n\n\n\n\n\n对规模经济的追求无疑能为公司带来巨大收益。然而，在某个时刻，公司可能已经通过并购（M&A）使其产品线或服务范围达到了最优范围水平，此时就是时候结束并购流程，并利用公司现有的能力进行工作了。然而，公司管理层有时会忽视这一点，他们似乎在出于本能地继续进行并购。华信维亚银行（Wachovia）就是一个极佳的例子，该公司通过并购扩大了业务范围，然后持续进行并购，直到导致了整个公司的倒闭。\n\
  \n正如我们在第 9 章关于公司治理中讨论的那样，我们对并购计划的担忧之一是代理成本，以及首席执行官（CEO）为了追求个人利益而进行交易的风险。另一个风险是，当管理层能够实现增长（尽管是非有机增长）时，他们会屈从于在超出最佳期限后长期继续并购计划。如果他们最终创建了一个大到他们无法有效管理的庞大机构，就会使股东的利益面临风险。然而，由于金融体系的设计方式，存款人受到保险（如\
  \ FDIC 保险）的保护，最终纳税人将为管理层运行大到不能倒的机构的过度行为买单。遗憾的是，在银行业，管理层有动机为了自己的个人利益而继续并购计划。从他们的角度来看，他们几乎没有风险，因为事后没有人会要求他们交回不当收益，即使他们摧毁了机构和股东价值。幸运的是，这些管理人员是少数。然而，存在太多此类银行管理人员的典型案例，例如信旗集团（Citigroup）的\
  \ Weill 和华盛银行（Washington Mutual）的 Killinger。在接下来的案例研究中，我们将讨论另一个由于不受限制的并购导致企业失败的著名案例。\n\
  \n### 协同效应内部化理论与基于信息的资产\n\n协同内部化理论在微观经济学以及工业组织子领域已经讨论了多年。^(21)协同内部化理论认为，拥有基于信息的资产的公司通过收购其他公司来利用其拥有的这些资产。这可能导致他们收购不同领域的公司，并有时追求多元化战略，即收购看似处于无关领域的公司。然而，根据该理论，这种关联性来自于他们能够杠杆其基于信息的资产，以利用这些资产在其他领域中的潜力和竞争优势。\n\
  \n基于信息的资产包括独特的专业知识（know-how），公司可以用不同的方式应用它。该理论的两个支持者拉恩德·莫克（Randall Morck）和杨益强（Bernard\
  \ Yeung）以 3M 公司为例，该公司利用其将物质应用于胶带类材料的能力进入了多个领域。他们在胶带上涂抹胶水制造了著名的 3M 胶带（Scotch tape）。然而，他们还能营销其他胶带类产品，如\
  \ VCR 录像带，这在 CD 出现导致其消失之前非常流行。这是有道理的，但显然在此时 3M 已经是一个高度多元化的集团，其范围已远超了将其粘剂能力扩展到其他相关产品的程度。\n\
  \n莫克和杨对基于信息的资产的定义比人们想象的要广泛得多。它不仅仅是专业知识。他们还包含了市场能力和管理技能，以及品牌名称等知识产权。例如，他们引用了像 Calvin\
  \ Klein（小凯伦）这样的知名品牌，以及该公司将 Calvin Klein 品牌从牛仔裤扩展到内衣，甚至是珠宝的能力。买家通常认为他们将获得时尚的设计师品牌产品以及与该品牌相关的质量。从某种意义上说，他们购买的是某种水平的质量`保险`。这就是为什么此类品牌的所有者对生产中的质量控制非常保护，以确保任何贴上他们名字的产品都不会对其庞大的业务产生负面影响。\n\
  \n基于信息的资产甚至可以解释地理上的多元化。例如，美国、欧洲和日本等发达经济体的公司将他们的专业知识带入未开发的市场，以利用其相对于本土公司所拥有的竞争优势。当他们成功这样做时，他们能够实现在本土市场中难以实现的增长，因为本土市场可能增长缓慢，而且他们可能还要与拥有相当基于信息资产的当地竞争对手竞争。\n\
  \n对于拥有基于信息的资产的公司来说，收购目标可能比尝试营销其资产更有效。此类资产在未受保护时可能会被不当使用；因此，其他市场解决方案（如许可或战略联盟）可能无效。在在这种情况下，利用这些资产的最佳方法就是直接收购目标，然后让被收购的实体使用这些资产。也就是说，利用此类资产的最佳方法可能是在一个统一的企业保护伞下将它们内部化。\n\
  \n莫克和杨通过观察多元化的公司测试了这一假设。^(22) 他们发现，拥有大量基于信息的资产的公司在进行多元化时增加了其股东价值。然而，没有拥有此类资产的公司在追求多元化收购时，未能提升其股东价值。\n\
  \n莫克和杨的研究还了一些其他有趣的结果。与他们的理论一致，他们发现，追求地理多元化的公司在拥有基于信息的资产时价值会增加，但在没有这些资产时则不会增加。规模变大的公司除非拥有基于信息的资产，否则并不会增加股东价值。在基于信息的资产中，与研发相关的无形资产似乎对股东价值的影响最大。\n\
  \n他们还查看了潜在目标，并试图确定拥有基于信息的资产的公司与更有可能被收购的公司之间是否存在关系。他们发现，拥有此类资产但尚未进行多元化或参与地理扩张的公司，比其他公司更有可能成为收购目标。这是同样的协同效应的反向应用。在这里，潜在目标拥有价值的协同资产，潜在竞标者可能缺乏这些资产，但当能够更快速地将这些资产应用于其他领域或地理市场时，就能产生更大的价值。\n\
  \n内部化理论是一个非常有趣的解释，说明了为什么某些公司能够从并购中获得协同效益，而其他公司却不能。例如，莫克和杨指出了 20 世纪 70 年代后期非常多元化的公司。他们将曾经巨大的典型性集团\
  \ ITT 与 3M 进行了比较。1978 年，ITT 在 12 个不同行业经营，但其 Tobin Q 值为 0.57，而 3M 在 11 个不同行业经营，但\
  \ Tobin Q 值为 2.02。^(23) 当我们展望未来时，不应该惊讶于 ITT 经历了多次重组并几乎销声，而 3M 在这些多年和市场变化后继续蓬勃发展。\n\
  \n### 协同效应与收购溢价\n\n\n\n\n\n收购溢价通常（尽管并非总是）是在控制性股权收购中支付的。这种溢价是指超过公司市场价值的价值，用于获得控制该业务并按比例享受其利润的权利金。竞标者通常将预期的协同效应作为支付溢价的理由。鉴于某些收购并未如预期的记录，市场有时会对协同效应的合理性产生怀疑，特别是当它被用作异常高溢价的理由时。协同效应要求收购方获得收益（例如以业绩改进的形式），以抵消溢价^(24)。希望这些收益可以在交易后的几年内实现。为了使溢价支付（`P`）和真实的交易费用（`E`）合理，这些协同收益（`SG`）的现值必须超过该金额。这种关系表示如下：\n\
  \n**(3.3)** ![equation](img/c03-mdis-0003.gif)\n\n其中 `r` = 风险调整折现率，`n` = 周期数。\n\n\
  在合理化支付巨额溢价的复杂因素之一是，溢价通常是预付的，而不确定的收益随着时间的推移而产生。这些收益实现的时间越晚，其现值越低。此外，用于将协同收益转换为现值的折现率越高，证明高溢价就越困难。如果竞标者还预见到在收益显现之前会有很长的初始阶段（例如当竞标者试图合并两种公司文化时），这将收益的开始时间推向更远的未来。如果竞标者使用高折现率和/或不预期收益在长期内实现，那么很难证明高溢价是合理的。此外，溢价越高，合并后的公司在未来协同收益上实现高增长率的压力就越大。\n\
  \n最好的情况是业务能够同时实现收入增加和成本降低。当竞标者支付了巨额溢价时，它隐含地假设了更大的压力来获得更大的收入增长和更多的成本减少。溢价越高，对两者的需求就越大。\n\
  \n在整个过程中，竞标者需要意识到竞争对手的实际和预期反应。在市场没有扩张的情况下，收入的增加可能是以竞争对手的收入为代价的。假设他们将坐视不动观察竞争对手通过收购在损害其利益的情况下提高地位可能是不现实的。当一家公司能够通过并购证明了这种业绩改进时，竞争对手可能会通过自己的收购计划做出反应。我们已经讨论过这种模仿式的并购并不罕见。再次，无数不同的反应可能较难建模，但它们仍然需要被仔细考虑。尽管已经提到过，但它是如此重要，以至于再次提到建立一个可以显示任何想要看到的结果的财务模型是多么么容易。可以在第\
  \ 11 章中开发的估值模型中建立假设，以显示收入增加和成本减少。当合并后的业务采取步骤实现理论上的财务收益时，他们可能会发现财务模型的构建过程是最容易的部分，而完成实现实际收益的所有其他步骤被证明是最困难的任务。\n\
  \n### 财务协同效应\n\n*财务协同效应*是指企业合并或收购对收购方或合并伙伴资本成本的影响。企业合并中存在财务协同效应的程度意味着资本成本应当降低。然而，这种财务协同效应的收益是否真的合理，在公司金融理论学家之间存在争议。\n\
  \n正如所述，如果两家公司的现金流之间不是完全相关的，两家公司的合并可能会降低风险。如果收购或合并降低了现金流的波动性，资本提供者可能会认为该公司的风险较低。考虑到合并后公司现金流出现剧烈波动的可能性较低，破产风险预计会更小。\n\
  \nHiggins 和 Schall 从*债务共保险*（debt coinsurance）的角度解释了这种效应^(25)。如果两家公司收入流的相关性不是完全正相关，那么与由于两家公司合并相关的破产风险可能会降低。在某些情况下，其中一家公司可能会经历迫使其破产的情况。很难提前预知两家可能的公司中的哪一个会遭遇这种命运。如果其中一家公司失败，债权人可能会遭受损失。然而，如果两家公司在财务问题发生之前合并，那么有能力的公司超过其债务还所需的现金流将缓冲另一家公司现金流的下降。状况良好公司的抵消收益可能足以防止合并后的公司陷入破产并导致债权人遭受损失。\n\
  \n债务共保险效应的问题在于，其收益是以股权持有者的代价归于债权人的。债权人通过持有风险较低的公司的债务而获益。Higgins 和 Schall 观察到，这些收益是以股东为代价的，股东可能在收购中亏损。这些研究人员假设合并后公司可以提供的总回报是恒定的（`R[T]`）。如果将更多的回报提供给债券持有者（`R[B]`），那么它们必须是以股东（`R[S]`）为代价的：\n\
  \n**(3.4)** ![equation](img/c03-mdis-0004.gif)\n\n换句话之，Higgins 和 Schall 认为债务共保险效应没有创造任何新价值，而是在资本提供者之间重新分配了收益。对于这一结果并没有普遍认同。例如，Lewellen\
  \ 得出结论认为股东从此类合并中受益^(26)。然而，其他研究未能表明债务相关的动机在多元化收购中比非多元化收购更相关^(27)。研究显示银行合并中存在共保险效应。Penas\
  \ 和 Unal 研究了 66 次银行合并，并查看了这些交易对 282 份债券的影响^(28)。他们发现目标公司（4.3%）以及收购银行（1.2%）的债券回报均为正值。可能起作用的一个解释是，较大的银行可能*大不能倒*，因为监管机构不想让大银行直接倒闭，并将介入提供援助。\n\
  \nBillet、King 和 Mauer 研究了 1980 年代和 1990 年代目标和收购者回报的财富效应^(29)。他们发现，在交易前低于投资级的目标公司债券获得了显著的正公告期回报。相比之下，收购公司的债券获得了负的公告期回报。他们还发现，\
  \ 1990 年代的这些公告期回报比 1980 年代更大。这些结果支持了共保险效应。\n\n\n\n\n\nHiggins 和 Schall 显示，合并后可以通过发行新债务来抵消股东的损失。随后，股东可能会通过债务利息支付的税收优惠而获利。Galai\
  \ 和 Masulis 证明了这一结果。^(30)额外的债务将使合并后公司的债务权益比率提高到某一水平，这种水平股东在合并前可能认为是理想的，或至少是可以接受的。随着债务权益比率的提高，公司变成了一项高风险–高回报的投资。\n\
  \n正如之前提到的，公司可能通过收购实现规模经济。这些经济通常被认为源于生产成本的降低，这是通过提高产能水平运行，或者通过减少销售力量或共享分销系统来实现。由于收购，还可能以较低发行和交易成本的形式实现`financial`规模经济。^(31)\n\
  \n在金融市场中，大型公司具有某些优势，这使其与小型公司相比可能具有更低的资本成本。它们可能拥有更好的金融市场准入，并且往往具有较低的融资成本，这可能是因为它们被认为比小型公司风险小。因此，通过发行债券进行借贷的成本较低，因为大型公司可能能够发行利率比小型公司更低的债券。多年来，这是通用电气（GE）赋予其许多目标公司的利益之一。此外，证券发行中存在某些固定成本，例如证券交易委员会（SEC）的注册费用、法律费用和印刷费用。这些成本将分摊到更大金额的证券上，因为大型公司在每次发行债券时可能会借入更多资金。\n\
  \n股权证券的情况也是类似的。对于筹得的资金，大规模发行的每美元发行成本会比小规模发行低。此外，对于风险较高的发行，其所需的销售努力可能比对风险较低的大型公司更大。在本文讨论中，我们假设大型公司风险较低，破产和财务失败的概率也较低。然而，如果由几家其他公司合并而的大的大公司效率如此低下，以至于利润开始下降，那么这个较大的公司组合可能会面临更大的财务失败风险。Levy\
  \ 和 Sarnat 开发了一个模型，以展示当两个或多个相关性不完美的收入流结合时，所产生的多元化效应如何降低违约概率。这种较低的风险水平促使资本持有者以更低的成本向合并后的公司或集团提供资金，而低于他们为合并前的单个部分提供的成本。他们的分析将财务协同效益视为由于合并产生的经济收益。\n\
  \n### 财务协同与随后的剥离\n\n在第 10 章中，我们讨论了如 Kaplan 和 Weisbach 等的研究，这些研究显示很大比例的收购随后被剥离了。^(32)正如\
  \ Kaplan 和 Weisbach 指出的，并非所有被收购并随后剥离的收购都应该被视为失败。对于为什么公司可能想收购另一家公司然后在可能不到 10 年后将其出售，有一种解释。根据\
  \ Fluck 和 Lynch 的观点，一种解释可能是拥有强大资产负债表和融资能力的大公司可能会收购小型目标公司，这些目标公司拥有边缘成功的项目，但由于资产负债表薄弱和现金流不稳定而无法获得资金。^(33)大公司（可能是那些正苦于利用其丰富的融资能力寻找盈利项目的公司）可能会收购这些目标并为其边缘盈利的项目提供资金。由于有了大公司及其较低的资本成本，这些项目的净现值可能比规模较小且财务较弱的公司更高。\n\
  \n追求此类收购的大公司价值通常低于其他大公司。这可以解释为什么在大多数情况下，集团是折价出售的。它也可以解释为什么大公司将试图通过出售被收购的实体以及随之售出的现已实现但仍处于边缘盈利的项目来获得收益。\n\
  \n### 第 4 章\n\n#### 多元化\n\n多元化意味着在公司目前的行业类别之外增长。许多公司以不同程度追求多元化。在本章中，我们研究了兼并与收购（M&A）多元化策略的优缺点。在此过程中，我们查看了那些追求多元化收购的公司的表现。\n\
  \n在第 3 章中，我们讨论了协同效应以及公司从兼并中获取协同效益的努力。公司能从多元化收购中获得类似的协同效益吗？这是一个我们将探讨的问题。我们还将探讨多元化破坏价值的令人困扰的情况。这可能会让读者感到惊讶，因为我们将看到，发达和不发达国家建立创建非常多元化的公司有着悠久的历史。如果——如果我们想详细探讨，这是一个很大的`if`——多元化没有增加公司价值，而且它有时会破坏价值，那么它为什么会发生呢？我们将看到这是一个复杂的问题，需要长期的探索。\n\
  \n虽然我们经常看到公司进行多元化收购的案例，但美国 20 世纪 60 年代后期的一个时期提供了许多通过多元化收购建立的大公司案例。因此，从回顾`企业团时代`开始讨论此类交易是有意义的。\n\
  \n## 企业团时代的多元化兼并\n\n20 0 世纪 60 年代的美国为我们提供了许多大规模多元化的案例。20 世纪 50 年代和 60 年代的美国是反垄断执法严厉的时期。想要通过兼并扩张的公司发现，司法部和联邦贸易委员会挑战了许多横向甚至纵向的兼并收购。在此期间，许多在今天可以迅速获得早期批准的交易都遭到了挑战。想要扩张的公司被迫完全在自己的行业之外进行兼并。美国政府荒谬的反垄断监管政策（监管机构现在会对此嗤笑的政策）阻止了大型公司进行有意义的协同收购。讽刺的是，政府消除了在大范围内实现协同效应的可能性。此类政策的荒谬性令人发笑。虽然我们在全球范围内仍然存在糟糕的监管政策，但至少在美国不再有这样的政策了。\n\
  \n20 世纪 50 年代是一个经济起伏的时期，并伴随着一场大战（朝鲜战争），因此主要的兼并扩张计划问题并不存在。然而，60 年代的特点是长期的经济扩张，与许多扩张时期一样，公司寻求通过兼并实现快速增长，以利用日益增长的总需求，这通常比缓慢的有机增长要快。\n\
  \n\n\n\n因此，在 20 世纪 60 年代，唯一的替代方案是在公司主营业务之外进行并购。这催生了后来所谓的“多元化经营时代”。亨利·塞尔瓦斯（Henri\
  \ Servaes）对大量此类公司进行了研究，，尽管在 1961 年，他研究的公司中有 55%仅在一个业务部门运营，但到 1976 年，这一数字已下降到 28%。[¹]](#chapter04.xhtml_c04-note-0001)。在同一时期，经营四个或更多业务部门的公司比例从\
  \ 8%增加到 30%。\n\n公司通过跨多个不同行业类别的大量收购，形成了高度多元化的公司，被称为“多元化企业”。这些公司成为了美国最大的公司之一。例如`ITT`、`LTV`、`Litton\
  \ Industries`、`Gulf and Western`、`Tenneco`、`Teledyne`等许多公司。多元化企业是多元化的极端形式，因为公司包含了许多彼此之间几乎没有共同点的业务。\n\
  \n20 世纪 60 年代多元化企业的业绩记录并不令人深刻。市场在年代末发生了了转向，投资者对多元化企业产生了反感。此外，经济在 70 年代急剧减速并陷入了深度衰退。多元化企业通过出售资产做出反应，许多公司开始了“去多元化”（`deconglomerization`）的过程。\n\
  \n### 美国多元化企业\n\n虽然 60 年代的许多巨型多元化企业已经拆解，但我们现在仍有几家非常大且很大成功的多元化企业在运营。也许领先的例子是`GE`——以前的通用电气（General\
  \ Electric）。与其原始名称的含义相反，多年来`GE`已不再仅仅是一家面向电子产品的公司。通过一系列收购和剥离的模式，该公司已成为一家多元化企业，业务范围涵盖保险、金融服务、电视电站、塑料、医疗设备等。\n\
  \n在 20 世纪 80 年代和 90 年代，在公司收购和剥离各种公司期间，收益显著增长。市场顺着收益增长的态势，对这些多元化收购做出了积极反应。然而，这一切随着次贷危机而结束，这场危机导致公司在资本部门遭受了巨大损失。从那时起，公司一直试图在美国严重衰退和复苏缓慢的艰难困境中航行，同时还要应对陷入衰退的欧洲经济。结果，许多人质疑该公司的多元化模型以及处于如此多多元化行业中的好处。\n\
  \n尽管从大衰退中复苏缓慢，且欧洲陷入停滞，三个高增长的 BRIC 国家（即`中国`、印度和巴西）增长放缓，某些多元化企业仍继续扩张并变得更加多元化。一个例子是`United\
  \ Technologies`。正如图 4.1 所示，在 2011 年，没有任何一个业务领域占总收入的四分之一，`Pratt & Whitney`占总收入的 23%，`Otis\
  \ Elevator`占总收入的 21%。\n\n![img](img/n04f001.gif)\n\n**图 4.1** 各分部门 United Technologies\
  \ 销售额（单位：百万美元）\n\n*来源：*2011 年年度报告。\n\n` Technologies`的根源可以追溯到航空航天工业。它是通过拆分由威廉·波音（`William\
  \ Boeing`）于 1929 年创立的公司而创建的。当该实体在 1934 年被拆分时，`United Airlines`、`Boeing`和`United\
  \ Technologies`随成立。然而，公司在 20 世纪 70 年代通过收购`Otis Elevator`和`Carrier Refrigerator`扩展到了航空航天领域之外。\n\
  \n当我们观察图 4.1 时，我们不得不想，例如，`Otis Elevator`与`Pratt & Whitney`或`Sikorsky`之间会有什么样的协同效应？此外，`Carrier\
  \ Air Conditioning`如何与这些其他完全不同的公司相匹配呢？尽管如此，我们必须向每个表现良好部门的整体管理层表示感谢，他们在困难的经济环境中展示了体面的财务业绩，而大多数组分业务在收益模式上具有某种周期性。\n\
  \n市场已经（在大多数情况下是迟的）表达了对几家大型多元化企业的不赞同。一些公司被迫拆分为更小、更集中的部门。`Tyco`和`Sara Lee`就是一些例子。然而，`United\
  \ Technologies`却朝着相反的方向移动。当其他一些多元化企业承认部分部分价值可能大于整体并正在进行“去多元化”时，`UTI`采取了相反的方法，认为一个更大的多元化企业将能够更好地实现价值最大化。为了实现这一目标，公司在\
  \ 2012 年宣布以 164 亿美元现金收购了`Goodrich Corp.`。\n\n`UTI`的论点是，`Goodrich`将与其三个其他航空航天部门良好融合：`Pratt\
  \ & Whitney`（发动机）、`Hamilton Sundstrand`（飞机控制系统）和`Sikorsky`（直升机）。这笔交易扩大了航空航天在公司结构中的作用，公司超过一半的收入来自航空航天。它还可以允许`UTI`与航空航天领域的大型竞争对手如`Honeywell`和法国供应商`Safran\
  \ SA`更好地竞争。然而，这笔交易引发了关于这些部门与电梯或空调业务有什么共同点的问题。历史告诉我们，除非市场通过低迷的股价表达不赞同，否则那种多元化结构可能会继续存在。\n\
  \n`Goodrich`本身是一个企业转型的有趣故事。它长期以来被认为是美国主要的轮胎制造商之一，也是工业橡胶制品的主要制造商。这种情况一直持续到 1977 年。轮胎是一个周期性业务，与汽车行业密切相关。轮胎制造和消费的变化（包括向更耐用的子胎轮胎转变）意味着销售和收入的放缓。讽刺的是，与计算机行业的\
  \ PC 部门相似，技术进步和产品改进导致利润下降。随后的放缓使得这个周期性行业变得过度拥挤，成为整合的自然选择。\n\n那个时期的`Goodrich`管理不善，垂直整合以及自己生产某些原材料（聚氯乙烯）的决策效果并不理想。在第\
  \ 6 章中，我们看到通常情况下垂直整合的效果并不理想。`Goodrich`的情况也是如此。公司扩展到这一业务并为此负了大量债务。最终，在它最大的竞争对手之一`Uniroyal`被私有化后，它被迫完全退出轮胎业务。该私有实体随后于\
  \ 1986 年与`Goodrich`的轮胎业务合并，该交易使`Goodrich`拥有了这家合资企业的 50%股份。该业务仍然受到困扰，1988 年`Goodrich`出售了其在合资企业中的股权，从而成为一家不再生产轮胎的公司。它随后扩展到许多其他领域，包括航空航天。\n\
  \n### 公司组合\n\n\n\n\n\n在 20 世纪 60 年代的企业集团时代，大型公司拥有许多多元化的实体并将其管理得就像整个公司是由许多不同子部门组成的组合一样，这是很常见的。典型企业集团\
  \ `ITT` 前首席执行官哈罗德·吉尼（Harold Geneen）是这种艺术的大师。多年来，他是美国著名的首席执行官。随其之后的是 `GE` 的杰克·韦尔（Jack\
  \ Welch），他在 `GE` 管理其多元化部门取得了巨大成功。然而，人们不得不质疑，投资于一个本身由许多其他公司构成的企业实体，这些多元化实体的股东真的从中获益了吗？这引发了一个问题：既然股东可以以更具成本效益的方式自己进行多元化，为什么整个公司要为股东进行多元化呢？也就是说，股东可以选择只购买企业保护伞下部分而非全部公司的股份。既然如此，当管理层为投资者进行\
  \ `stock picking`（选股）时，他们到底为投资者提供了什么利益？\n\n另一个近期企业集团的例子（某种微型 GE）是 `Tyco`。`Tyco`\
  \ 由“每天交易交易”的首席执行官丹尼斯·科兹洛基（Dennis Kozlowski）运营，通过合并多次收购形成了一个非常大的企业集团，经营四个主要业务部门：(1)\
  \ 安全与电子；(2) 防火与流量控制；(3) 医疗保健与流量控制；(4) 金融服务。显然，金融服务与医疗保健或安防几乎没有关系。市场最初看好 `Tyco` 的收购计划，尽管会计问题（例如进行许多低于\
  \ 10% 重性性报告阈值的小额收购）可能会掩盖 `Tyco` 交易的真实规模。`Tyco` 在收购后不久就出售了 `CIT` 金融服务业务。到 2006 年\
  \ 1 月，该公司的市值为 620 亿美元，但股价表现低迷。它最终屈服于市场压力，宣布出售其电子和医疗保健业务，从而拆分了企业集团。正如我们之前提到的，科兹洛基因盗取公司财产被定罪并服了长期监禁，尽管他在\
  \ `Tyco` 任职期间公司经营相对良好——这与他时代其他被定罪首席执行官经营的公司不同，例如 `Worldcom` 的伯尼·埃伯斯（Bernie Ebbers），他将公司推向破产，导致股东损失巨额。事实上，`Tyco`\
  \ 继续表现良好，这引发了对他获得的类似于埃伯斯的判决的质疑。\n\n必须记住，当母公司收购目标（特别是大型目标）时，这通常是一项风险活动，而且实施成本高昂。收购者必须支付收购溢价，然后投入精金钱管理和整合目标。诚然，对于企业集团而言，并没有多少整合，整个公司可能会采取更中立的立场，仅仅监控目标的表现。目标最终可能成为整个公司组合中的一个组成部分。如果目标未能符合预期，可以将其出售，所得可用于收购另一家公司。\n\
  \n股东困境的终极答案在于企业集团为他们产生了什么回报。如果在风险调整的基础上，回报优于市场，那么整个公司结构是否合理其实就不值重要了。如果市场认可并使公司产生良好的股东回报，那么即使一些金融教授不满意，股东也应该是满意的。有时，市场非常青睐诸如\
  \ `GE` 这样的公司。然而，`GE` 和其他企业集团也面临一些质疑。这导致其中许多公司以 `diversification discount`（多元化折扣）交易。我们将在本章稍后部分详细讨论这一点。\n\
  \n### 多元化的理论基础\n\n多元化具有若干种潜在利益。其中包括规模经济效益。这可能发生在公司通过收购变大时。它们随后成为更大的企业，并可能由于规模的扩大而实现更低的平均成本。问题变成了：当公司收购不同业务领域的公司时，其在规模经济上获得的收益是否与其在主营业务内扩张所获得的收益一样？\n\
  \n其他利益可能来自 `M&A`（合并与收购）产生的规模经济。这些规模经济可能体现在向扩展的客户群体营销更广泛的产品上。\n\n多元化还可能通过收益平滑（earnings\
  \ smoothing）提供财务利益。这可能发生在收购了收益波动性不同的公司时。当一家公司具有波动的收益模式时（例如销售大宗商品的矿业或石油公司），其收益的起伏主要取决于商品市场价格，而非管理层的明智。管理层可能会通过收购具有不同波动性的公司来抵消其自然波动性。我们将在考虑\
  \ `M&A` 的 `coinsurance`（共保险）效应时进一步讨论这一点。\n\n多元化的另一个更具财务意义的原因是试图从 `internal capital\
  \ markets`（内部资本市场）中获益。通常，公司通过现金流进行内部融资扩张，或通过贷款或发行证券进行外部融资。然而，大型多元化公司（如 `GE`）拥有巨大的财务资源，可以将其提供给收购目标。这可以为被收购的公司提供潜在的竞争优势——或至少这是官方说法。这是否是这些财务资源的最佳用途通常是一个更复杂的问题。\n\
  \n### 将投资组合理论应用于企业集团？\n\n多元化的一个可能的可能的利益领域是 `coinsurance effect`（共保险效应）。这发生在收益相关性不完全的公司合并时，它们产生了一个比任何单一公司收益流都更波动的组合收益流。协方差是衡量两个变量之间线性相关性的统计量。如果两个潜在合并候选者的收益之间的协方差为负，那么可能通过此类公司的结合获得共保险收益。合并伙伴必须确定的是，这些共保险\
  \ `benefits`（利益）是否真的为股东带来了他们自己无法实现的额外收益。当他们购买相关公司的股份时，股东可能已经意识到了这些公司的收益模式。他们将这些收益模式以及这些证券提供的投资回报与其投资组合中的其他证券进行了比较。正如我们所指出的，合并候选者的经理是否真的为股东提供了他们自己无法以且更低成本实现的利益，是值得怀疑的。受财务多元化驱动的合并可能可能为管理层提供利益，管理层随后可能展示出波动较小的收益流。这对于股东来说是否真的是利益是另一个问题。\n\
  \n### 多元化与领先行业地位的收购\n\n\n\n\n\n通用电气（GE）成功多元化战略背后的部分原因在于其收购的公司类型。通用电气寻求在其所拥有业务的各个行业中获得领先地位。“领先”通常根据市场份额被解释为第一或第二名。像通用电气这样的收购者认为，第一或第二位置可以提供更具主导性的地位，从而获得比规模较小的竞争对手更大的优势。这些优势可以通过多种方式体现出来，包括在市场上获得更广泛的消费者认知，以及更优越的分销网络。处于次要地位的企业（如第四或第五名）有时可能处于处于劣势，以至于它们难以产生有意义的回报，难以获得更大的市场份额。那些在各自行业中不处于领先地位、且无法以具有成本效益的方式获得此类地位的公司下部门，将成为剥离的对象。通过此类剥离释放的资源随后可以重新投资到其他公司中，以利用其主导地位带来的利益，或用于收购其他行业的领先公司。\n\
  \n### 获得第一或第二名并非万能妙药\n\n仅仅在行业中获得第一或第二名并不足以保证成功。这在农用设备业务中得到了证明。1994 年，Case 公司发现自己在农用设备业务中处于遥远的第三，几乎没有希望赶上领先约翰迪尔公司（John\
  \ Deere Corp.）。像通用电气这样的公司在各个市场利用主导地位来超越规模较小竞争对手的成功，当 Case 管理层决定与该行业的第二名公司新荷兰（New\
  \ Holland）合并时，他们无疑没有忽视这一点。1999 年价值 46 亿美元（按 2013 年美元计算为 81 亿美元）的合并产生了 CNH Global——一家销售额接近\
  \ 110 亿美元的公司。这些销售额到 2011 年将增长到 190 亿美元以上。然而，仅仅处于第二名并没有阻止合并后的公司向约翰迪尔、国际收割机（International\
  \ Harvester）、卡特彼勒（Caterpillar）以及小松（Komatsu）等其他大公司失去份额。合并以来，CNH 在盈利方面一直困难，并继续尝试削减成本。这种结合并没有创造市场领导者——只是两个合并伙伴的放大版，它们在应对该行业的周期性特征时仍然面临困扰。\n\
  \n### 进入更有利润的行业进行多元化\n\n管理层可能选择多元化扩张的一个原因是，其希望进入比收购公司当前行业更有利润的行业。这可能是母公司所在的行业已达到成熟阶段，或者该行业内的竞争压力排除了将价格提高到可以获得超常利润水平的可能性。\n\
  \n某些公司在寻求通过进入提供更好利润机会的行业来扩张时，可能会遇到一个问题，即无法保证这些利润机会在未来能够长期持续。现在利润丰厚的行业在未来可能不再那么丰厚。我们在第\
  \ 2 章中介绍的蒙特拿电力公司（Montana Power）案例研究中看到了这一个极佳的例子。\n\n竞争压力促进了行业间回报率向长期均衡演变的趋势。显然，这并不意味着在任何时刻所有行业的回报率都是相等的。推动行业获得同等回报的竞争力量会被对立的力量（如工业发展）所抵消，这些力量导致不同行业产生不同的回报率。那些回报高于平均水平但没有高标准准入门槛的行业将经历回报下降，直到达到跨行业的平均水平。\n\
  \n经济理论意味着，从长远来看，只有难以进入的行业才会有高于平均水平的回报。这意味着进入更有利润行业的多元化计划从长远来看可能是不成功的。扩张中的公司可能由于阻止进入的障碍而无法进入那些持续呈现高于平均回报的行业，而只能进入低门槛的行业。在进入低门槛行业时，扩张公司可能被迫与那些被暂时高于平均的回和低门槛吸引的其他进入者竞争。竞争者数量的增加将降低回报并导致扩张策略失败。\n\
  \n### 关于多元化的实证证据\n\n虽然人们可以对集团企业的优缺点进行争论，但观察多元化公司的股东财富效应以及市场对多元化收购的反应可能更有用。这将使我们看到市场的评估，这种评估是通过全球许多买卖双方的客观互动做出的。这并不意味着反应总是正确的。然而，这是一项需要考虑的重要证据。\n\
  \n### 关于 20 世纪 60 年代收购计划的实证证据\n\n由于鉴于 20 世纪 60 年代发生的多元化交易规模巨大，加上当时建立的巨型集团，回顾关于这些交易及其产生的公司结构的股东财富效应的研究将很有帮助。Schipper\
  \ 和 Thompson 分析了宣布收购计划的公司的财富效应。[²]](#chapter04.xhtml_c04-note-0002) 具体而言，他们考虑了宣布收购计划对收购公司价值的影响。他们检查了\
  \ 1967 年至 1970 年之前的此类计划的公告，因为这些几年发生了诸如《威廉法案》（Williams Act）和《1969 年税法改革案》等监管变化。这些监管变化对\
  \ 20 世纪 60 年代发生的收购类型造成了某些障碍。研究发现，在此期间，收购计划被资本化为正净现值计划。这些结果表明，至少在 20 世纪 60 年代后期监管变化之前，市场对收购计划持有积极观点，其中许多计划涉及重大的多元化。市场对当时多元化收购的积极反应有助于解释为什么第三次收购潮是如此重大。Scherer\
  \ 和 Ravenscraft 的另一项研究也显示，在他们样本中的 13 家集团企业（其中包括许多著名公司，如`ITT`、`Gulf & West`、`Textron`和`Teledyne`），在集团泡沫开始前购买股票的表现优于市场，但在合并潮发生后买入的投资者回报低于市场。[³]](#chapter04.xhtml_c04-note-0003)\
  \ 有人通过这些结果暗示对这一时期显赫的集团持有良好看法。然而，另一种观点是，市场像公司本身一样，都在寻求增长，并在一段时间内接受了这种增长可以通过这些非常多元化且巨型的集团结构盈利地实现的观点。此外，司法部追求的奇特反垄断政策基本上阻止了真正的协同并购。当市场有了更多的时间和数据进行审查，以及经济出现下滑后，市场改变了这一评估。重要的是记住，考虑到当时异常严格的反垄断执法，公司被阻止进行更具协同性的交易，因此投资者没有这些投资选择。\n\
  \n\n\n\n\n其他研究也显示多元化企业对股东财富有积极影响。例如，Elger 和 Clark 发现，多元化收购的股东回报率高于非多元化收购。^⁴ 该项研究调查了\
  \ 1957 年至 1975 年间的 337 宗合并，表明多元化合并相比非多元化合并提供了更优的收益。研究人员报告了买方和卖方公司均获得了这些收益，其中卖方公司的股东获得了巨额收益，收购公司的股东则获得了中等收益。这一发现得到了后来\
  \ Wansley、Lane 和 Yang 研究的支持。他们关注了 52 宗非多元化合并和 151 宗多元化合并。然而，研究还发现，水平和垂直收购的股东回报大于多元化收购。^⁵\n\
  \n虽然我们引用的研究显示多元化企业对股东财富具有某些积极影响，但这些影响可能实际上反映了过于乐观的初始评估。随后许多此类交易的失败（有时通过拆分收购、剥离和剥离实现）证实了这种扩张策略的疑点。\n\
  \n### 多元化收购最终被出售掉的可能性有多大？\n\n在第 10 章中，我们讨论了 Kaplan 和 Weisbach 的研究。他们对 1971 年至 1982\
  \ 年期间发生的 271 宗大型收购进行了研究，并一直追踪到 20 世纪 80 年代。他们发现，到 1989 年，43.9% 的交易已被剥离。此外，他们确定多元化交易被出售的可能性是非多元化交易的四倍。此外，在他们的样本中，38%\
  \ 的多元化交易是失败的，而非多元化交易的失败率仅为 13%。\n\n其他研究（例如 Michael Porter 的研究）实际上发现了更高的比例。^⁶ Porter\
  \ 发现，超过一半将公司带入新领域的交易随后都被剥离了。他的研究也值得关注，因为他的样本包含了领先公司——即市场认为管理良好的公司。然而，一家公司在其核心业务方面可能管理良好，但却拥有设计不当的并购战略。\n\
  \n### 是否存在多元化折扣？\n\n当多元化公司通过多元化收购形成时，假设这些业务本身不合并，这种组合是否相对于单个业务的合并价值增加了价值？或者，这种组合是否会破坏价值？也就是说，多元化业务被整合在一个大型企业伞下的这一事实是否破坏了价值？换句话说，是否存在`多元化折扣`？\n\
  \n使用上述来自 20 世纪 60 年代的大型样本，Henry Servaes 比较了多元化企业与非多元化企业的 `Tobin's q`。^⁷ `Tobin's\
  \ q` 以来自耶鲁大学的诺贝尔奖得主经济学家的命名，它是公司市场价值（通过其股权和债务的市场价值衡量）与其资产重置成本的比率。如果一家公司的 `Tobin q`\
  \ 大于 1，则市场对公司的估值高于替换公司资产或`重组该公司`的成本。\n\nServaes 未发现任何多元化增加公司价值的证据。相反，他发现多元化企业的 `Tobin's\
  \ q` 显著低于多部门公司。其他研究发现，多元化折扣并不局限于多元化时代。Berger 和 Ofek 使用 1986 年至 1991 年期间的大型公司样本进行的一项研究发现，多元化导致公司价值平均损失\
  \ 13% 到 15% 之间。^⁸ 这项研究估计了多元化公司各部门的归因价值，假设它们是独立的公司。结果显示，公司价值的损失不受公司规模的影响，但在相关行业内进行多元化时，损失较小。公司价值损失的结论得到了这一事实的支持，即多元化部门的经营盈利能力低于单一业务部门。研究结果还显示，多元化企业对多元化部门的过度投资超过了单一业务公司。这意味着过度投资可能是导致多元化相关价值损失的部分原因。\n\
  \nLang 和 Stulz 探测到了多元化的减值效应。^⁹ 通过大型公司样本（超过 1,000 家），Lang 和 Stulz 发现 20 世纪 80 年代企业多元化程度与这些公司的\
  \ `Tobin's q` 呈反相关。这些发现与上述 Servaes 以及 Berger 和 Ofek 的研究非常一致。尽管有这些令人深刻的证据，这一结论并未得到财务研究人员的普遍接受。Villalonga\
  \ 认为多元化折扣仅仅是这些研究人员使用数据的产物。¹⁰ 他表示，这些研究人员使用的数据受到财务会计标准委员会对部门定义的人为限制，以及仅要求报告构成公司业务\
  \ 10% 或以上的部门的要求。通过使用不受此问题影响的数据，Villalonga 发现的是多元化溢价，而非折扣。此外，还有其他研究不仅没有发现多元化折扣，而且暗示不相关的交易有时可能优于相关的并购。我们将在几页后在比较相关与不相关并购时重新回到这一发现。\n\
  \n### 聚焦假设\n\n其他研究以不同的方式处理这一问题。Comment 和 Jarrell 分析了 1978 年至 1989 年的上市公司样本。他们发现，企业关注度的增加或专业化与股东财富最大化是一致的。¹¹\
  \ 此外，他们发现样本中回报最差的公司是那些降低关注度的公司。\n\nComment 和 Jarrell 得出的结论是，通常引用的多元化优势——规模经济——未能实现，而且获得更多内部资本似乎并没有影响多元化企业追求外部资本的倾向。他们发现的多元化优势之一是，多元化公司成为敌意收购目标的频率低于其多元化程度的公司。鉴于此类敌意收购通常会导致目标股东获得更高的溢价，有些人可能会认为这是一个可疑的收益。尽管如此，多元化公司在公司控制市场中作为买卖双方参与活跃。\n\
  \n### 聚焦增加的类型\n\nDasilas 和 Leventi 的一项研究分析了产生最大积极股东财富效应的聚焦增加型剥离。¹² 他们的研究比较了增加工业关注度的剥离与增加地理关注度的剥离。增加工业关注度的剥离产生了积极股东财富效应，而增加地理关注度的剥离没有。此外，市场对工业关注增加的积极反应在美国剥离中比欧洲交易更为显著。\n\
  \n### 聚焦增加的资产出售提高价值\n\n\n\n\n\n当公司发现其市场价值低于将其所有主要业务部门作为独立实体进行估算市场价值所得出的价值时，它们可能会通过资产出售来提高股价。John\
  \ 和 Ofek 使用了多种会计绩效衡量标准（如营业利润率和资产回报率）来确定公司在出售资产后性能是否有所提高。他们比较了 321 个导致业务更集中的剥离案例与未产生此类影响的案例。他们发现，在样本中，只有那些在资产出售后关注度更高的公司表现出性能提升。而那些出售了资产但关注度没有增加的公司未能表现出提升。因此，他们的结论是：剥离带来的增强关注度的效应，而非仅仅是剥离行为本身，才是价值增长的来源。这些价值随后可以抵消多元化折扣。\n\
  \n### 多元化折扣的解释\n\n从表面上看，我们可能会简单地得出结论：多元化本身会破坏价值。我们可以很容易为这种破坏过程想出一些非常合理的解释。也许是因为多元化且缺乏关注度的企业对管理的要求更高，限制了多元化公司的潜力。也许仅仅是由于资源浪费的管理者为了自身利益而追求多元化的并购。例如，规模较大的多元化公司可能会为其高级管理人员提供更好的补偿，让他们相信自己是伟大的`帝国建设者`。然而，是否也可能是此类企业对市场分析师提出了更高的分析要求，导致分析师倾向于给它们分配比更专注于业务更低的估值？\n\
  \n许多分析师专注于某一类业务。例如，在奥特瑞（Altria）全盛时期，烟草分析师跟踪其菲利·莫里斯（Philip Morris）业务，食品分析师则跟踪其佳士（Kraft）业务。投资者在评估整个实体的投资前景时，必须将两者结合。当奥特瑞拥有米勒（Miller）啤酒时，问题变得更加性，啤酒行业分析师必须对这一相对较弱的业务发表意见。\n\
  \nLamont 和 Polk 对 2,390 家多元化公司的大样本进行了一项有趣的研究，涵盖 1979 年至 1997 年的 19 年，这对于多元化公司价值破坏的简单解释提出了某些问题。在他们的各种发现中，带有折扣的公司后续回报率竟然`高于`溢价交易的公司！难道可能是市场错误地分配了折扣，而当这些多元化公司最终产生的收益高于折扣所暗示的水平时，这些折扣被证明是错误的吗？\n\
  \nLamont 和 Polk 的研究并没有消除多元化公司面临的挑战。他们的分析仅关注回报，还有许多其他衡量标准，如盈利能力、资本支出和其他基础指标，这些指标可能为多元化折扣的传统解释提供支持，例如非理性经理、生产力、公司浪费等。然而，对于行为金融学的追随者（其人数正在快速增长），多元化折扣的另一个额外解释可能是：市场不理性地低估了多元化公司。至少，Lamont\
  \ 和 Polk 的研究揭示了`多元化之谜`的复杂性。\n\n### 相关与不相关多元化的对比\n\n多元化并不意味着集团化。也就是说，可以多元化到与买方业务相关的领域。一个相关多元化的例子发生在\
  \ 1994 年，当时默克（Merck）收购了 Medco。默克是全球最大的制药公司之一，而 Medco 是美国最大的药品分销商之一。这两项业务的区别在于，一家公司是制造商，而另一家是分销商。尽管如此，两家公司都属于广义的制药行业，而且彼此对对方业务的了解都比外部公司更深。此外，在相关多元化中，规模经济和范围经济的预期可能更可靠，因为买方如果贴近其目前的业务活动，就能更好地利用其现有资源和专业知识。然而，尽管这两家公司在其各自的药物细分领域都是领导者，但它们的结合并没有产生协同效益。默克认为，随着医疗管理的出现，拥有像\
  \ Medco 这样的公司将为其提供竞争优势。正如我们在`第 3 章`中讨论的，在默克-Medco 合并后不久（1994 年），默克的一些竞争对手也这么想，当时罗氏（Roche）以\
  \ 53 亿美元收购了 Syntex 公司，而礼来（Eli Lilly）以 41 亿美元购买了 PCS Health Systems。遗憾的是，相关性不足以确保成功，默克和\
  \ Medco 在得出它们并不了解监管环境后（该环境不允许 Medco 影响医生和消费者对药物的使用），后来不得不撤销了这笔交易。这消除了某些协同效益。礼来收购\
  \ PCS 也是不吉的，在收购仅三年后，礼来就对其支付的 41 亿美元中注销了 24 亿美元，几乎是其收购金额的 60%。\n\n另一项业务何时相关并不总是明确的。我们在`第\
  \ 3 章`中讨论过的由 Young 和 Morck 提出的例子是 3M 公司。3M 以其斯得异品牌胶带而闻名。然而，该公司在很久以前就开始分支经营，将其专业知识扩展到其他相关产品的制造和营销中，例如便利贴（Post-it\
  \ Notes）和其他胶带产品如录像带。考虑到这些产品与胶水和胶带相关的方面，它们看起来是产品和专业知识的延伸。然而，现代 3M 与某些人仍然认为的胶带制造商已大相径庭。如`图\
  \ 4.3`所示，它是一家价值 300 亿美元的公司，拥有非常多元化的业务活动。\n\n```\n![img](img/n04f003.gif)\n```\n\n\
  **图 4.3** 3M 2011 年各业务部门收入（单位：百万美元）\n\n*来源：*3M 2011 年年度报告。\n\n\n\n\n有证据表明，相关收购的业绩显著优于非相关收购。Morck、Shleifer\
  \ 和 Vishny 发现，在他们的样本中，市场惩罚了参与非相关收购的公司的股东，而进行相关收购的公司的股东表现要好得多。他们对 1975 年至 1987 年间\
  \ 326 宗收购的研究，为这种类型的多元化呈现了一个更为乐观的图景。\n\n相反，一种特定形式的多元化——非相关多元化，其结果很糟糕。他们通过确定两家公司是否至少有一项前三大业务之一属于相同的标准工业分类代码（`SIC`）来衡量相关性。并非所有关于相关多元化的研究都得出相同的结论。例如，Agrawal、Jaffe\
  \ 和 Mandelker 发现的结果与 Morck、Shleifer 和 Vishny 的结果相反。他们的发现（显然使用了不同的数据集）显示非相关收购的业绩优于相关收购。此外，Aggarwal\
  \ 和 Baxamusa 的一项近期研究显示，非相关收购者在公告期间的收益率高于相关收购者。非相关收购者在交易后的表现也更好，这意味着这些交易提升了价值。\n\n\
  尽管非相关收购者的资本成本往往高于非相关竞标者，但非相关收购者仍产生了这些收益和并购后表现。Aggarwal 和 Baxamusa 假设，在内部资本市场，目标公司正在补贴收购者的投资。这导致了一个令人困惑的结论：非相关收购者在为自己的资本投资融资时可能遇到困难，但在收购方面却不会。作者的另一个发现支持了这一结论：非相关收购倾向于通过股票融资进行交易。也许市场高估了非相关收购者的股票，允许他们追求非相关目标，反过来，他们利用这些目标来补贴其其他业务部门的资金需求。\n\
  \n关键问题似乎是：这两家公司之间是否存在某种关联性，使得它们合并后比保持独立时能产生更大的利益？如果因为公司之间存在相关性就辩称并购可能产生收益，那么这种辩护是没有意义的。虽然研究显示相关并购的业绩可能优于非相关并购，但每笔交易都是独立的。交易决策者必须证明相关性（或其他因素）将导致成功的合并。也就是说，他们需要证明他们的关联方式将产生如协同效应之类的收益。\n\
  \n# 为什么允许*极其*多元化的公司进行合并？警惕帝国扩张者\n\n鉴于许多（但并非所有）多元化公司的业绩存疑，一个显而易见的问题产生了：它们最初为什么要成立？市场为什么允许建立这样的公司结构？似乎有几个答案。其中一个是公司首席执行官（CEO）热爱扩张帝国。在第\
  \ 9 章中，我们详细探讨了 CEO 建立帝国的动力。大帝国比小帝国支付更高的报酬。此外，大帝国比小帝国更能满足 CEO 的自我。而且，更加多元化的公司产生的收益波动性较低，这可能降低管理层在某些期间必须报告较低收益的概率，并可能因此被淘汰。\n\
  \n答案的另一个部分似乎是市场甚至媒体倾向于某种受骗和宽恕。例如，当桑迪·魏尔（Sandy Weill）建立他多元化且功能失调的花旗集团（Citigroup）金融集团时，市场和媒体非常接受。当他在某些年份为自己支付高达\
  \ 2 亿美元来组建一个功能失调的金融集团时，几乎没有反对意见，而这个集团与其他高度缺陷的金融服务公司共同导致了次贷危机。当其他荒谬的组合（例如莎莉 Sara\
  \ Lee 的案例）形成时，市场和媒体也一直非常接受。考虑在 Sara Lee 伞下合并的多元化业务是值得的。\n\n### 管理层议程驱动并购吗？\n\n经理有自己的个人议程，这些议程可能与公司的目标不同。对于经理，特别是\
  \ CEO 来说，目标可能是延长他们在职位上的停留，并继续获得在美国被称为丰厚的报酬和福利。这种金钱报酬是在他们作为“大人物”（The Big Cheese）所获得的心理收入之上的。\n\
  \nMorck、Shleifer 和 Vishny 分析了 1975 年至 1987 年间的 326 宗收购。他们发现，糟糕的交易是由执行交易经理的目标驱动的。他们发现三种类型的收购会导致较低且通常为负的公告期间收益。这些是：多元化并购、收购快速增长的目标，以及在经理在交易前的业绩表现不佳时收购公司。他们关于多元化的发现进一步证明了这种策略是有问题的的。然而，他们关于快速增长目标的结论可能反映了这样一个事实：购买增长是困难的，而当你这样做时，你可能会被迫支付过高价格。我们在第\
  \ 3 章中看到过这一点。\n\n他们关于管理业绩不佳的发现也相当直观。如果你不擅长经营现有的业务，那么增加业务并因此增加管理需求只会恶化管理表现。也许经理擅长管理某种特定类型的专注业务。让他们涉足其知识范围之外的领域可能是导致灾难的药方。另一方面，在历史上一直是多元化的公司（如通用电气\
  \ GE）的高层管理人员从事管理非常多元化企业的业务。这些管理能力是他们的技能组合。事实上，这就是他们所做的。\n\n## 注释\n\n### 第 5 章\n\n\
  ## 横向整合与并购\n\n横向整合是指竞争对手之间的合并，而不是具有买卖关系的人之间的合并。本质上，这意味着购买或与你的对手合并。公司可能追求横向交易的原因有很多，包括获得相对于对手的竞争优势和市场权力，以及寻求规模效应。在本章中，我们探讨了关于这些类型的并购（M&A）产生收益程度的证据。与其他类型的并购一样，我们看到它们有时会产生巨大的收益，而有时让参与者的处地没有改善，有时甚至更糟。考虑到横向交易并不具备其他类型并购（如多元化交易）的某些固有问题，后一种可能性稍微令人惊讶。在横向并购中，我们是在同一行业内合并两个业务。预计成功的概率应该高于其他类型的并购是合理的。事实确实如此，但横向交易仍然可能带来自己的挑战。\n\
  \n### 在行业中占据第一和第二名名的优势\n\n\n\n行业内两家大型公司之间的水平合并可能使合并后的实体获得该行业内第一或第二的地位。这种地位本身就可能带来相对于竞争对手的竞争优势。我们在第\
  \ 4 章中讨论过这一概念，在该章中我们考虑了高度多元化的公司（如集团），它们追求持有多元化行业业务部门的战略，而这些部门在各自的行业中占据第一或第二的地位。在本章中，我们将讨论专注于特定领域的公司如何通过水平并购（M&A）进入其行业前两名的地位，从而获得竞争优势。\n\
  \n我们在第 4 章中讨论过通用电气（GE）长期成功的首席执行官杰克·韦尔奇（Jack Welch）如何经常推崇收购行业内第一或第二地位的策略。韦尔奇的观点是，处于第一或第二地位能给这些公司带来如此优势，以至于规模较小的竞争对手很难进行有效竞争。要提出的适用于所有行业和所有地理市场的通用规则总是困难的。但直觉上，较大的公司应该拥有较小竞争对手所缺乏的资源和其他优势。\n\
  \n行业内第一或第二名的公司在与供应商交易时可能拥有更大的买方话语。他们还拥有更大的市场份额，通常这意味着在消费者中具有更高的知名度。此外，由于规模更大，他们可以拥有更大的营销预算，允许他们追求更广泛的营销策略，这可能极大地增强消费者的认知。另一方面，较小的竞争对手则必须苦苦于追赶。供应商对他们的态度可能没有对大型竞争对手那样随和。许多有吸引力的营销选择对较小公司来说可能在财务上无法触及。一个例子是美国邮轮行业，我们在第\
  \ 3 章中讨论过该行业。曾几何时，该行业拥有许多小型公司。这些公司无法负担全国性的电视广告活动，也无法从邮轮主要营销商的旅行社那里吸引足够的兴趣。当行业进行整合时，诸如嘉年邮轮（Carnival）、皇家加勒比（Royal\
  \ Caribbean）和挪威邮轮（Norwegian Cruise Line）等大型公司能够提供一系列不同价格的邮轮，以满足各种潜在邮游客的口味和预算。\n\n\
  在资本密集型行业中，例如我们在本章稍后讨论的移动电信行业，需要庞大的客户群来降低平均成本。覆盖全国并提供可靠服务且更少掉线的大型移动网络，其资本成本非常昂贵。此外，竞争压力迫使竞争对手开展昂贵的营销活动以维持市场份额。在扩大市场份额的过程中，还需要进一步的大支出，这是一个零和博弈，因为收益是以竞争对手的损失为代价的，而竞争对手也在激进支出以维持他们已有的份额。正如我们在下一节中看到的，这部分解释了为什么\
  \ Sprint/Nextel、T-Mobile 和 Metro PCS 未能获得 Verizon 和 AT&T 的成功。\n\n在第 2 章中，我们讨论了思科（Cisco）如何非常成功地利用并购来实现增长。该公司寻求在它进入的行业行业的任何子分领域中获得\
  \ 50% 的市场份额。虽然它考虑小型收购，但在过去，它避开了那些它无法立即获得 20% 市场份额的部门。¹¹除非有理由相信由于成为思科的一部分，目标公司将迅速扩张并成为其领域更主要的参与者，否则思科倾向于避免此类交易。随着公司增长如此巨大（现在已是一家价值\
  \ 460 亿美元的公司，截至 2012 年 7 月结束的财年），小型交易对它的影响较小。\n\n### 规模的优势：聚焦移动电信行业\n\n规模真正至关重要的行业之一是移动电信。考虑美国移动市场，AT&T\
  \ 和 Verizon 是最大的两家公司（见图 5.1）。在该行业中，移动运营商与硬件供应商进行谈判，以便提供最创新的产品。例如，AT&T 通过成为美国首个提供\
  \ iPhone 的公司，获得了相对于 Verizon 等竞争对手的巨大优势。使得 AT&T 能够从 Verizon 那里抢走客户，当时许多人声称 Verizon\
  \ 拥有更好的服务和覆盖。由于大量客户的涌入，AT&T 成功从 Verizon 手中赢得了客户。\n\n![img](img/n05f001.gif)\n\n\
  图 5.1 按用户数量划分美国无线市场\n\n电信行业的公司不仅为了提供最新创新的设备而竞争；它们还为了提供像 4G 网络这样的快速网络而竞争。4G 代表第四代，提供的速度与用户已经习惯的宽带服务相当。较小的竞争对手（如\
  \ Sprint）在提供此类昂贵服务方面落后于大型公司。该领域的竞争者必须投入巨资来建设网络。对于 AT&T 和 Verizon 等大公司来说，他们购买了所需的频谱。Sprint\
  \ 等公司必须更具创新性，并尝试通过联盟和合作伙伴来实现。例如，2008 年，Sprint 通过合作收购了 Clearwire 的股份，后者是一家拥有大量频谱的无线公司。利用这些资源，Sprint\
  \ 实际上成为了美国第一个提供 4G 服务的公司。它也是第一个提供 4G 智能手机的 la。2012 年，Sprint 利用向日本软银出售股份的现金收购了 Clearwire\
  \ 的剩余部分。\n\n这两个领先者的巨大资源允许他们超越 Sprint 成为第一大 4G 服务提供商。第四大玩家 T-Mobile（我们将单独讨论这家公司）基本上表达了其无法与其他三个主要玩家进行有效竞争的沮丧感，并尝试通过将其卖给\
  \ AT&T 来退出美国市场，但失败了。对 AT&T 和 T-Mobile 来说不幸，T-Mobile 从 AT&T 获得的巨额违约金极大减轻了其痛苦。\n\n\
  移动市场的挑战由于这些公司所提供的网络之间存在技术差异而变得复杂。Sprint 等运营商必须说服主要的设备制造商制造适应其网络的设备，否则 Sprint 必须投入大量的资金转向\
  \ Verizon 等竞争对手（其使用称为长期演进 LTE 的技术）所采用的技术。然而，通过收购 Clearwire，Sprint 解决了这个问题。\n\n\n\
  \n\n\nT-Mobile 美国在 2010 年和 2011 年流向竞争对手的客户日益增加。其母公司德国电信（Deutsche Telecom AG）将与 AT&T\
  \ 的合并——或者准确说是被 AT&T 收购——视为退出其深陷挣扎的美国移动市场的一种。德国电信于 2001 年通过花费 350 亿美元收购 Voice Stream\
  \ Wireless 和 240 亿美元收购 Powertel，进入了规模庞大且看似利润丰厚的美国移动电信市场。该公司于 2002 年更名为 T-Mobile。这些都是是对“陪跑者”的昂贵收购，但由于这些收购，德国电信有能力在竞争异常激烈的市场中与规模更大、根基更稳固的对手一战。但结果完全不理想。这也强化了这样一种观点：行业排名第一、二的公司（在本例中为\
  \ Verizon 和 AT&T）通常比规模较小的竞争对手具有巨大优势。这还表明，在资本密集型行业中，这些优势可能更加明显。\n\n正如我们将要讨论的，原本作为\
  \ T-Mobile 退出策略的 AT&T 与 T-Mobile 交易遭到了司法部的反对并被迫取消。T-Mobile 获得了 40 亿美元的拆分补偿金，但专注于与\
  \ AT&T 合并使其进一步落后于竞争对手。一旦它意识到将独自与 AT&T 和 Verizon 这样更强大的对手斗争，它就必须重新重点放在能够提供 4G LTE\
  \ 技术上——这是它本希望避免的一项巨额支出。虽然拆分补偿金是失败交易的一个美妙收益，但合并导致的竞争延迟又造成了另一项极其巨大的成本。\n\n在 AT&T–T-Mobile\
  \ 合并失败后，Sprint Nextel 考虑收购规模较小的竞争对手 MetroPCS。Sprint 正面临着扩张网络的昂贵负担，加之其价格昂贵的苹果公司 iPhone\
  \ 交易。最终，在 2012 年 2 月下旬，Sprint 董事会拒绝了对 MetroPCS 溢价 30%的收购要约。有多种原因可以解释这一交易的被拒绝：MetroPCS\
  \ 几乎使用了其所有的网络资源，因此无法缓解 Sprint 的网络容量限制，尽管 Sprint 的网络可能对 MetroPCS 的客户有所帮助。Sprint 对于其\
  \ 2005 年与 Nextel 那次痛苦的合并仍耿耿于心，那次合并在某种程度上是*不应该*做并购的指南。Sprint 董事会从那次失败交易中学的一个教训是：两家陷入困难的公司之间的并购可能不会产生一家不再困难的公司，除非这两个合并候选者的潜在问题可以通过并购来解决。\n\
  \n随着时间进入 2012 年后期，情况发生了变化。T-Mobile 在错失与 AT&T 结合的机会后，提出收购规模较小的竞争对手 MetroPCS Communications。MetroPCS\
  \ 专注于市场低端，其特点是拥有廉价手机和低价合同、甚至无合同数据套餐的用户。T-Mobile 倾向于提供更昂贵的套餐，但也提供能够满足高速用户的服务。然而，MetroPCS\
  \ 为大量预付费用户提供服务，从而让 T-Mobile 能够在其此前没有显著地位的市场细分领域扩张。\n\n当 T-Mobile 和 MetroPCS 计划合并时，Sprint\
  \ 被冷落在门外。直到日本软银（Softbank）提出收购 Sprint 70%股份的报价，这反过来帮助 Sprint 完成了对 Clearwire 的 100%收购。我们将在本章后面部分详细讨论\
  \ Sprint-软银的提议。\n\n### 扩大规模的动机\n\n移动电信只是一个规模大具有显著优势的行业示例。规模较大的公司拥有更多资源，能够比规模较小的竞争对手做更多事情。关键问题是：多大才够？在何种节点，变大会产生更多低效率和其他成本以至于这些成本超过了规模大实体带来的增量优势？正如我们在书中后部分讨论的，首席执行官（CEO）可能会寻求更大的规模，以获得作为大公司领导者所带来的心理收益。他们还寻求经营大型企业随之而来的更高薪酬和福利。这些激励措施要求董事会在批准交易时必须谨慎，以确保这些交易是出于正确的原因进行的。我们将在第\
  \ 9 章中详细讨论董事的责任。\n\n同样，规模较小的公司可能完成规模更大、更官僚化的企业无法完成的事情。较小公司通常能对市场变化反应更快，且通常可能更灵活。他们的管理层级通常较少，决策通常可以做得快得多。因此，规模较小也有一些优势；最佳选择取决于行业和具体情况。\n\
  \n### 竞争对手并购计划带来的竞争压力\n\n在并购领域，公司自然会对竞争对手的行为做出反应。如果他们的竞争对手正在收购行业内的其他公司，或变得更加纵向整合，这可能会导致其他公司考虑采取行动。在第\
  \ 3 章中，我们讨论了默克通过购买 Medco 来垂直整合的案例，这如何导致了礼来（Eli Lilly）和罗华（Roche）采取类似的交易。我们在水平交易中也看到了同样的现象。当两家竞争对手合并并因此变得更大时，他们的对手有时会担心在与现在更大的公司竞争时会处于劣势。这可能导致他们考虑寻找自己的合并伙伴。有时这会导致整个行业的整合。\n\
  \n水平交易是否真的能提供竞争优势，是一个特定行业和特定交易的问题。很难提供一个适用于所有水平交易的通用答案。然而，正如我们在本章后半部分所看到的，关于此问题的研究往往会对这些交易提供的收益产生怀疑。\n\
  \n### 水平交易：收购竞争对手及其竞争品牌\n\n当一个市场拥有多个竞争对手，且其中某些公司落后于领先者时，那些排名不是第一或第二的公司通常有合并并尝试提升排名的动力。这样做可以获得一些明显的收益。或许通过消除重复的设施和开销可以实现显著的成本效益？处于同一行业且了解竞争对手特性的公司应该能够对这些收益做出良好的估计。当这些本应更容易估量的收益完全没有实现，或者完成时间比预想的长得多时，人们总是会惊讶。Sprint–Nextel\
  \ 合并就是这种情况。这两家公司并没有积极采取措施消除冗余设施，而是在交易后多年里保持着独立的公司总部。这次合并是关于如何做好并购后整合的经典反面。\n\n交易计算中需要考虑的另一项成本是消除竞争对手的成本。当\
  \ AT&T 收购 Cingular 以及当 Sprint 和 Nextel 合并时，被收购的品牌 Cingular 和 Nextel 并没有保留。它们被消除了，这是一种真实的成本。在开发这些品牌的市场知名度上投入了大量资金。收购目标时支付的价格通常包含了品牌价值。然而，当品牌被消除时，这些价值基本上被丢弃了。竞标者还需要考虑，当青恋于被消除品牌的消费者不再留在合并公司时，将遭受的损失。对于在整合行业中进行多次交易的公司（例如银行），他们可能更好地衡量这些成本。在其他行业中，这一过程可能更具挑战性。\n\
  \n### SPRINT–NEXTEL 水平交易：并购史上最糟糕的案例之一\n\n\n\n\n\n2005 年 8 月 12 日，Sprint 与 Nextel\
  \ 合并，成立了 Sprint Nextel。这笔交易被誉为两之间价值 360 亿美元的“对等合并”，双方都是美国移动电信领域的领导者。然而，其结果却是一场彻底的并购乱局。当该公司在\
  \ 2007 年宣布了高达 297 亿美元的第四季度商誉减值时，这一点更加凸显。为了方便直观理解，该公司在 2011 年的总收入为 401 亿美元。\n\n在水平合并以及其他类型的合并中（但可能在水平交易中更为如此），风险因素之一是客户的留存。这在\
  \ Sprint–Nextel 的交易中被证明是一个巨大的问题。此外，其管理结构也像一个旋转门一样变动频繁。该公司是合并后混乱的典型案例。\n\n图 5.2 显示了合并后实体的盈利情况。利润持续走低，公司在合并后立即陷入了亏损。亏损的主要原因是客户大量流失。交易完成后，有数十万客户流向了其他运营商。\n\
  \n![img](img/n05f0002.gif)\n\n`图 5.2` Sprint Nextel 盈利能力：2005–2012（a) 净收入（百万美元）和（b)\
  \ 净损益（百万美元）\n\n*来源：*Sprint Nextel 年度报告。\n\n![img](img/n05f003.gif)\n\n**图 5.3` Sprint\
  \ Nextel 长期债务（百万美元）：2004–2012**\n\n*来源：*Sprint Nextel Value Line, 2012。\n\nNextel\
  \ 提供的技术与 Sprint 完全不同。这使得公司各自技术的整合变得困难。Nextel 的“按讲即说”（push to talk）技术帮助了公司的增长，并与品牌紧密相连。消费者直接将按讲即说及其这种类似对讲机的手机与\
  \ Nextel 联系在一起，而不是任何其他美国运营商。然而，消费者的口味发生了变化，这种功能的吸引力降低，从而降低了 Sprint 认为它在与 Nextel\
  \ 合并时所获得的价值。随后，Sprint 面临着挑战：既要让 Nextel 客户转用 Sprint 的手机，又要尝试（通常是失败）挽回那些离开的 Nextel\
  \ 客户。\n\n在合并前对 Nextel 进行估值时，Sprint 假设能够留住 Nextel 大部分的客户及其收入。这被证明是一个关键但极其错误的假设。\n\
  \nSprint 从未真正成功地利用 Nextel 网络取得巨大成就。事实上，在 2012 年中期，它宣布将关闭该网络。所谓的对行业深入了解所带来的优势也就仅此了，而你本指望通过水平并购获得成功。\n\
  \n在 T-Mobile 与 MetroPCS 合并（成为规模更大的第四大运营商）后，Sprint 面临的压力开始增大。然而，当 Sprint 收到日本软银（Softbank）收购其\
  \ 70%股份的报价时，其处境发生了变化。该收购结构设计为：80 亿美元的股票将直接从 Sprint 购买，从而为其注入现金，剩余的 120 亿美元将在市场上收购。这为\
  \ Sprint 带来了了一些财务协同效益，因为它本身债台累累——部分原因源于对 Nextel 那次糟糕的收购。\n\n从软银的角度来看，这笔交易将让这家已经负债累累的日本公司进入巨大的美国电信市场。然而，进入该市场并不意味着它能成为一个有效的竞争者。只需看看德国电信（Deutsche\
  \ Telecom）在德国获得巨大成功后，进入美国市场却遭遇了失败。这笔交易带给软银的是与两家大型且非常成功的运营商竞争的权利，而它们拥有巨大的规模足以让日本入场者过得很艰难。在行业中占据第一或第二位置可能带来巨大的益处，但作为遥遥遥的第三，Sprint\
  \ 的处境是一项挑战。Verizon 和 AT&T 占据了该行业总收入的三之二以及大部分的利润。\n\n对于由性格古怪的互联网亿万富翁孙正义（Masayoshi\
  \ Son）经营的软银来说，与美国更大的竞争对手搏斗，可能比试图在停滞不前的日本经济中挤压利润更好，因为日本经济已经停滞了如此久，以至于这种挑战可能都是一种现状的改善。*](#chapter05.xhtml_c05-note-00099)\n\
  \n### 行业需求下降迫使行业整合\n\n当一个行业的产品需求很高时，可能有许多竞争者来供应这些产品。当一个行业衰落时，我们可能会剩下过多的竞争者，可能需要进行一次洗牌。与其让竞争过程淘汰那些生存能力较弱的竞争者，有时行业内的公司经理会尝试通过合并来减少整体产能，同时可能让合并伙伴从各自的优势中获益，并避免受每家公司弱环节的负面影响。\n\
  \n这种整合的例子发生在冷战后的美国国防行业。²在冷战局势紧张时，该行业内的公司过得很好。当“邪恶之帝国”崩溃，苏联残余部分发现他们无法负担如此庞大的军事机构时，美国寻求减少国防开支，以便有更多资金用于权利福利计划。显然，我们不需要如此多的国防承包商。\n\
  \n该行业的解决方案是整合。例如，波音（Boeing）于 1996 年收购了罗威尔（Rockwell）的股权，同年它与麦道尼道拉斯（McDonnell Douglas）合并。由于市场规模大幅缩小，没有足够的需求支持所有的竞争者，这种并购是不可避免的。因此，这种行业的并购是对经营环境变化的反应。这不是为了扩张而进行的并购，而是为了生存而进行的并购。当一个行业发生像美国国防行业那样变化时，公司要么关门大闭，要么合并，要么尝试在行业中竞争。考虑到职位和薪资，风险回避经理倾向于选择并购路线。\n\
  \n当一个行业进行整合时，我们自然预期以成本降低的形式体验规模效应。然而，国防行业是一个使用纳税资金向政府供应产品的行业，并不是一个普通的买家。在私营部门，公司必须向市场报告利润，当利润低于预期时，会导致股价下跌。政府由政治家管理，他们通常只关心下一次选举，可能不会深夜为纳税人的钱发愁。这解释了为什么例如，在\
  \ 1990 年至 1998 年期间，固定翼军事承包商的数量减少了三分之二，但只有一半的武器系统经历了成本降低。³此外，亨塞尔·纳扬塔拉（Hensel Nayantara）发现，尽管国防行业承包商的并购活动大幅增加，但\
  \ 56 到 61%的武器系统单位成本不受并购影响。⁴这一结果并没有为并购产生规模效应的能力提供多少支持。然而，也必须记住，这是一个特殊的行业。成本最终转嫁给纳税人，而在一个竞争极小的市场中，政治家是最终的裁决者。\n\
  \n### 协同收益与水平并购\n\n\n\n\n在第三章中，我们讨论了并购（M&A）可能实现的——我是指的是*可能*——协同收益。在这一讨论中，重要的一点是要强调某些收益在理论化上比在实现上容易得多。我们在第三章中进一步讨论了规模经济通常如何比增强收入的协同效应更容易实现。因此，我们在这里不再重复那项讨论。然而，我们确实想强调，当我们分析并购提议时，需要意识到此类交易可能产生的所有潜在成本。某些成本比其他成本更容易估计和衡量。支付的价格以及其中包含的溢价只是交易成本之一。其他成本可能更难衡量，包括整合成本。也可能包括其他难以衡量的成本，例如诉讼成本。例如，当美国银行及其首席执行官肯·刘易斯（Ken\
  \ Lewis）匆匆批准 41 亿美元收购乡村抵押贷款（Countrywide Mortgage）时，他们无法很好地衡量从从乡村购买抵押支持证券的投资者那里面临的未来潜在负债。有人认为，考虑到抵押贷款市场出现问题时的已知情况，预见到他们可能面临巨额索赔并非夸张。相反，美国银行似乎主要关注潜在的增强收入的协同效应，而忽视了潜在的成本。这笔交易使美国银行成为了美国最动荡行业之一中最大的公司——这算不上什么令人瞩目的成就。\n\
  \n在交易当时，美国银行大肆宣传，合并两家公司的抵押贷款业务预计将获得约 6.7 亿美元的税后协同节省。然而，该银行交易后的炒作并未对巨额诉讼相关损失的真实可能性发表任何评论。银行遭受了数十亿美元的损失，其中一项与司法部就乡村出售出售给法尼麦美（Fannie\
  \ Mae）和房雷迪（Freddie Mac）的坏贷款提起的诉讼有关。美国银行支付了 6500 万美元结算安德鲁·马齐洛（Andrew Mazillo）的欺诈索赔；支付了\
  \ 25 亿美元回购出售给法尼麦美和房雷迪的抵押贷款；支付了 16 亿美元给保证担保公司（Assured Guarantee），该公司为向投资者出售的抵押贷款提供了保险；支付了\
  \ 85 亿美元结算投资者索赔；支付了 10 亿美元与联邦政府就向不合格借款人的贷款达成和解；投入了 118 亿美元用于结算大银行的止押滥用问题。肯·刘易斯在\
  \ 2008 年 1 月推进了这项交易，认为住房市场已经触底，情况将开始好转。一个人竟然能成为美国最大的银行之一的首席执行官，却对住房和抵押贷款市场如此无知，这令人令人惊讶。截至\
  \ 2012 年底，总结算金额为 290 亿美元。美国银行以 41 亿美元收购了乡村，并遭受了超过 290 亿美元的损失——这是对“协同”的新定义。\n\n仿佛乡村的损失还不够一样，2012\
  \ 年，美国银行同意支付 24.3 亿美元，解决由不满的股东发起的集体诉讼，这些股东发现美国银行高管隐瞒了美林林（Merrill Lynch）次贷危机损失规模的信息。美国银行于\
  \ 2008 年以 500 亿美元收购了美林林。然而，美林林在抵押贷款相关损失上亏了数十亿美元，当美国银行管理层开始感觉到损失规模时，他们还是继续了这笔交易。\n\
  \n这笔交易并不属于任何接近深思熟虑的并购策略的一部分。相反，它是财务陷入困境的美林林与一个热于收购的美国银行之间的一场“闪电婚礼”。美国银行是通过连环收购者国家银行（NationsBank）通过一系列的一系列看似无止境的并购建立起来的，国家银行最终收购了规模更大的美国银行，并沿用了其更广为人知的名称。休伯·麦卡卡尔（Hugh\
  \ McCall）领导国家银行走过了其惊人的并购增长之路，使其成为美国最大的银行之一。然而，他的继任者肯·刘易斯却带领美国银行陷入了两次巨额且几乎是灾难性的交易。\n\
  \n乡村和美林林收购的仓促性质使得很难进行周密计划。在小型交易中，风险通常较小。然而，这些都是巨交易。此类交易不应在没有仔细计划的情况下进行。在美国政府提供的极短时间窗口内，要进行周密计划是非常的。\n\
  \n虽然美国银行对乡村和美林林闪电婚礼的合并计划是其管理层的耻辱，也是股东的巨大成本，但埃克森（Exxon）与美孚（Mobil）之间高度成功且深思熟虑的合并恰恰相反。\n\
  \n### 水平交易的净收益 = 协同收益 –（易衡量的成本 + 难衡量的成本）\n\n交易的支持者会非常强调并购的益处，包括各种协同效应——一些是真实的，一些是想象的——然后他们通常会最小化交易成本。在这一努力中，他们可能会得到高薪投资银行家的帮助，因为这些银行家希望交易达成以获得巨额佣金。在收购中，易衡量的成本是支付给目标公司股东的资金（包括溢价）。其他易衡量的成本包括各种专业人员费、融资费等。然而，难衡量的成本往往意味着交易的失败。这些成本视情况而异，但包括在处理整合问题时分心导致的市场份额流失。目标越大，潜在的棘手整合成本就越高。\n\
  \n### 水平合并成功、目标规模及并购后整合成本\n\n并购交易各不相同，这就是为什么进行并购研究可能具有挑战性。然而，作为一条一般规律（尽管有例外），目标相对于收购方越大，整合挑战就越大。有些公司能够很好地将两个巨型实体合并为一个无缝的企业。正如我们所提到的，埃克森与美孚的合并就是一个很好的例子。\n\
  \n当目标相对于收购方较小时，收购方能够更好地将目标定位在自身内部，而不产生重大干扰。规模上的巨大差异可能会使整合道路上的坎坷不那么困难。思科在 2010 年之前策划的许多成功并购提供了许多例子。事实上，思科非常成功的并购计划使其在\
  \ 2000 年成为全球市值最大的公司之一，市值达 4310 亿美元！这一价值早已回归现实，到 2013 年初，它仅为该值的四分之一。\n\n当目标远小于收购方且整合证明存在问题时，该问题通常是一个较小的问题。然而，当目标很大时，收购方现在面临一个大问题。丹姆收购克莱勒就是一个很好的例子，尽管还有许多其他。AT&T\
  \ 在 1991 年收购 NCR 是另一个大公司收购另一家相对较小公司的例子，主要的文化差异大幅增加了 AT&T 的真实收购成本。六年后，这导致了 AT&T 的多次重重组之一，将公司分为三个部分：规模较小的\
  \ AT&T、光纤科技（老贝尔实验室）以及一家保留 NCR 名称的计算机公司。\n\n\n\n整合成本很难估计和量化——特别是在交易达成之前。自然地，这使得将此类成本纳入估值模型变得十分困难。然而，困难并不意味着不可能。也不意味着“由于我们无法掌握，所以对这项交易的估值为\
  \ 0 元”。另一种方案是承认风险并在折现率中加入风险溢价。通常，由于政治原因而非分析原因，这种做法往往很难实现。估值分析师可以对这些成本进行粗略估算，并使用`integration-risk-adjusted\
  \ discount rate`，这将降低目标公司或整个交易的价值。然而，从政治角度来看，交易发起者（如 `CEO` 及其聘佣的投资银行家）对此类风险的讨论，可能会使交易难以向必须批准交易的董事会推销。由于这些原因，泛泛而言的风险，特别是这些特定风险，往往被忽视，甚至不被讨论。相反，交易发起者强调的是交易将带来的巨大利益。如果交易在多年后被证明存在问题，那么\
  \ `CEO` 可能已经在退休路上，或即将前往下一个 `CEO` 职位。如果没有，`CEO` 可以声称自交易完成后业务或行业已经发生了变化，或者现在对目标公司进行重组或出售将为股东带来巨大收益。`CEO`\
  \ 承认一项昂贵的收购是一次让公司损失大量资金的大失误是非常罕见的。\n\n这种情况的一个极佳例子发生在 `Citigroup` 出售保险部门时，而 `Citigroup`\
  \ 那位扩张版国的 `CEO` `Sandy Weill` 浪费了数十亿美元收购这些部门，随后又投入巨额资金尝试整合但以失败。正如我们之前提到的，他试图建立一个消费者并不需要的金融超市或一站式商店。这些部门从未真正整合的事实，使得它们更容易被出售。真正遗憾的是，管理层和董事会没有勇气向市场及其股东承认，这些交易是极其糟糕的策略产物，而且管理层和董事会未能履行对股东的义务。在当今诉讼横行的世界里，这种承认虽然诚实，但很容易引发一系列诉讼。虽然这可以为管理层和董事会的不坦诚辩护，但不能免除金融媒体如此轻易地放过这家公司。\n\
  \n对于向 `CEO` 汇报的经理来说，告诉 `CEO` 拟议的合并构思糟糕且不会成功也很困难。在美国的企业界，我们经常发现管理层充满了唯唯诺诺（男女性），他们主要关心的是下一次升职、加薪和奖金。这些目标通常通过告诉\
  \ `CEO` 他想听的话最好来实现。当经理们采取相反做法时，他们往往会被扫地出门。当 `Jamie Dimon` 在 `King Weill` 构建他的帝国并牺牲股东利益为自己获取巨额财务收益提供抵抗时，情况就是如此。`Dimon`\
  \ 被迫离开，去经营规模较小的 `Bank One`。正如 `William Cohan` 用体育类比所说，这将成为银行业史上“最糟糕的交易”。当 `Bank\
  \ One` 被 `JPMorgan Chase` 收购时，收购方意识到 `Bank One` 的主要资产之一就是 `Dimon`。如果 `Weill` 或他装备不足的继任者\
  \ `Charles Prince` 被一个挑战其建立一站式金融商店之错误梦想的董事会从 `Citigroup` 赶出去，`Citigroup` 会像现在落得如此惨吗？`Dimon`\
  \ 会质疑承担额外风险以及银行在抵押支持证券上的巨额投资（这付出了惨痛代价）吗？当我们考虑到 `JPMorgan Chase` 在最近的“伦敦鲸”事件中遭受的数十亿损失时，`Dimon`\
  \ 开始失去他的一些光环。他最初坚持问题规模要小得多，也引发了人们的疑问：即使是优秀的经理是否也能真正管理如此巨大、大不能倒的金融机构。这同时也凸显了当公司变得大到无法有效管理时，水平合并如何无法产生实质性收益。\n\
  \n### 对等合并\n\n当合并合并创造了行业中规模最大的公司之一时，它并不意味着具有竞争优势。两家非常大且规模相似的公司结合可能不会为股东带来收益。以 2006\
  \ 年 `Alcatel` 和 `Lucent` 的合并为例。从表面上看，这两家知名竞争对手的结合似乎为协同效应和成本效益提供了巨大的机会。而实际上，它将两家存在多个问题的公司结合在一起，创造了一个大得多的巨兽，这个巨兽也深受更大规模问题的困扰。事实上，该公司在交易后报告了持续亏损，并对其商誉进行了巨额减值。合并并没有让这些问题消失。\n\
  \n当交易宣布时，人们谈论将产生巨大协同效益的成本效益和其他效率。现实截然不同。合并后的实体销售利用码分多址（`CDMA`）技术的网络设备，而该技术在北美（其最大的市场）的需求正在下降。\n\
  \n在合并当时，两家公司表示他们将通过合并来降低单位成本并实现规模经济。然而，他们未能预见到来自低成本全球竞争对手（如中国电信制造商）的扩张。正如我们在本章稍后将讨论的钢铁行业，中国公司极大地增加了全球产出，但其成本低于西方竞争对手。\n\
  \n在每一个领域，制定一套可以遵循的规则总是一件好事，以便实现最佳性能。遗憾的是，虽然这种规则制定在数学或物理科学中可能有效，但在经济学或金融领域的 `M&A`\
  \ 子领域中往往效果不佳。每笔交易都是不同的。此外，不同行业的 `M&A` 影响也不同。在某些交易中看起来显而易见的规则，对其他交易可能毫无意义。\n\n###\
  \ 对等合并与整合挑战\n\n将一家较小的公司整合进一家大公司，比整合两家大公司要容易得多。如果大公司通过先前的 `M&A` 增长，并熟练掌握了整合流程，那么整合工作可以变得更加容易。我们讨论过\
  \ `Cisco` 在多年来在这方面可以说拥有最好的成功记录。较小的交易不仅更容易进行，风险也更小。此类交易中投入的资源较少，如果失败了，成本也较低。此外，当一笔较小的交易失败时，管理层更容易将其掩盖并转移对这一失误的注意力。然而，当两家巨头合并时，产生的超级巨头可能比两家之前的公司更受公众和媒体的关注。\n\
  \n需要巨大整合努力的巨型合并可能会为没有受到此类挑战的竞争对手创造竞争优势。他们可以利用陷入整合斗争的公司来试图获得市场份额。有许多例子显示，当合并公司挣于应对对等合并带来的独特挑战时，其他公司取得了这样的成功。其中一个领先的例子是\
  \ `Daimler` 和 `Chrysler` 的合并。\n\n\n\n\n我们讨论了灾难性的戴姆勒-克莱勒对等合并。这可能是一个特例吗？也许大多数对等合并的结果都是良好的？并非如此。朱莉·沃尔夫（Julie\
  \ Wulf）分析了 1991 年至 1999 年间 17,730 次合并的大规模样本，其中 1,457 次为股票换股，273 次为要约收购。⁶ 她对该样本的分析结果证明与书中稍后讨论的某些并购（M&A）研究非常不同。从表面上看，她发现样本中合并后的方和目标公司的回报与非对等合并交易没有太大区别。然而，她的结果显示，收购方获得了更多收益，而目标公司股东获得的回报较低。收购方以牺牲目标股东为代价获得了利益。看来，广泛的谈判过程使收购方能够从目标股东那里榨取的收益，超过了在大型公司收购较小目标的传统公司合并中可能发生的收益。值得考虑为什么我们会得到这样的结果。答案可能非常基础——目标公司的经理可能正在牺牲其受托责任为代价来追求个人利益。\n\
  \n研究表明，目标公司的管理层和董事似乎愿意放弃为股东更高的回报，以换取在新公司中的职位。这引发了重大的公司治理问题，因为我们假设经理和董事是股东的受托人，应该只关注目标股东的收益，而不是他们的就业状况。此外，似乎当收购方能够为合并实体中的目标公司管理层和董事提供机会时，他们可能通过支付较低的溢价来节省股东的资金。鉴于这些目标董事和经理通常可以在以后被解雇，这些收益可能是以低廉的价格换来的。\n\
  \n### 水平交易的竞争优势：案例研究——百威（INBEV）与安豪瑟百世（ANHEUSER-BUSCH）\n\n现实中，水平收购者可能获得超出市场力量之外的竞争优势。这些优势可以来自除仅仅在边际成本以上定价之外的其他来源。也就是说，它们可能不仅仅是由于价格提高到较高水平并长期保持。随着行业整合，由于他们成为行业中（可能是最大的）买家，收购方可能通过增加购买力来获得竞争优势。这在百威/安豪瑟百世在\
  \ 2009 年合并后立即享有的成本效率和采购优势中显而易见。这些是在由于出货减少但价格上涨带来的收入增加之外的额外利益，反过来意味着成本的降低。\n\n百威收购安豪瑟百世的故事始于\
  \ 1999 年巴西酿酒厂布拉马（Brahma）与南极（Antarctica）的合并，形成了巴西最大的啤酒公司——美源（Ambev）。随后，它收购了乌拉圭等国的其他酿酒厂。它随后签署了合同在南美分销百事（PepsiCo）的软饮料品牌。\n\
  \n从这个角度来看，巴西银行家/酿酒商策划了 2004 年与比利时时时（Interbrew）的合并，后者拥有百力时代（Becks）和时代宫廷（Stella Artois）等全球品牌。时时啤酒的名字起得恰当，因为它是欧洲和亚洲\
  \ 30 多次收购的产物。⁷ 合并后的公司百威（InBev）为巴西人提供了全球品牌，并让他们实现了真正的全球化。\n\n安豪瑟百世（AB）在全球化方面步履后后。这家位于圣路易斯的公司的高级管理具有非常封闭的观点。它由布世家族的四代领导。据报道，奥吉·布世希三世（Augie\
  \ Busch III）实际上甚至没有去过全球——更不用说准备有效地将这家以美国为中心的公司转变为全球酿酒巨头了。为此，时事精明的巴西 CEO 卡洛斯·布里托（Carlos\
  \ Brito）与安豪瑟谈判了一项合资企业，最终由年轻的奥吉·布世希四世（Augie Busch IV）运营。奥吉四世可能因其派对的生活方式以及女性在他车内和家中去世的麻烦事件而闻名，他完成了这笔交易，这让吝啬的布里托和他的员工能够内部观察这家标志性的美国啤酒公司浪费的管理。布里托看出，他可以如何通过削减\
  \ AB 大量的浪费（包括其私人飞机和公司用车）来轻松地提高利润，同时为这一领先的美国啤酒品牌获得更高的价格。布里托是一个低调且高度职业的经理，而 AB 的运营方式就像在经营一个王国一样。⁸\
  \ 在被百威收购时，安豪瑟百世是一家上市公司，创始人布世家族持有的公司股份比例较小，因此几乎没有真正的投票权和控制权。布里托和百威的管理层并不困难说服安豪瑟的股东，他们比布世家族能更好地管理公司。\n\
  \n在百威完成对 AB 的敌意收购后，布里托和他的经理们开始尽一切办法降低成本。他们解雇了 1400 名员工，占其总劳动力的 6%。⁹ 这是一种通过成本规模经济来实现成本协同的简单尝试。然而，布里托关注每一个降低成本的机会。例如，他的经理告诉供应商，他们可以预计最晚\
  \ 120 天收到付款，并暗示他们应该为能卖给这个行业中的新巨头感到荣幸。对于那些合同规定 30 天内付款且通常在 60 天内收款的公司来说，这是交易中一个令人不快的副作用。对于百威/安豪瑟百世来说，这意味着他们能够增强合并公司的营运资金状况，这无疑是以他们的供应商为代价的，因为供应商实际上必须为这个大买家提供某种融资。对于百威规模的公司，将应付账款延长\
  \ 30 多天会对利润产生非常显著的影响。有人估计这相当于几亿美元。这些只是布里托如何用他敏锐的钢笔代替布世国王迟劣的画笔，从 AB 中榨取利润的少数例子。有时，公司会受到激进成本削减者的伤害，这些人人牺牲了对产品质量和营销领导力关键的元素。布里托被指控通过购买更便宜的啤酒花和其他成分等行为降低了啤酒质量。批评人士指出，例如在美国销售的百力（Becks）已不再德国制造，而是在美国制造。10)\
  \ 自然地，百威/AB 希望避免高昂的国际运输成本，并在美国使用原始配方生产产品。同样的批评者提到了质量下降；然而，至少最初，这些说法似乎并没有依据。批评者提到出货量有所下降，但也许这些批评者没有上过微观经济学基础，不知道价格与数量之间的反比关系。在\
  \ AB 的案例中，他们利用这种关系对自己有利，因为他们提高了价格，而这种做法在这种情况下恰好抵消了需求数量的下降，这就是为什么收入、更重要的是利润增长的原因。\n\
  \n### 并购整合中的监管关注\n\n\n\n\n\n水平交易可能会引发反垄断担忧。`Antitrust` 一词源于 19 世纪 90 年代，当时信托（trusts）——基本上是一种获取了各种公司控制权的控股公司结构——开始形成。这导致了相关法律的通过，而该法律至今仍是美国竞争政策的基石——`谢曼反垄断法`。在世界其他地区，更通用的术语是\
  \ `competition policy` 和 `competition laws`。\n\n讽刺的是，在美国反垄断历史上的某时期，执法力度是如此激烈（甚至可以说是怪异），以至于垂直交易、甚至是集团并购都成为反垄断强化执法的目标。这是\
  \ 20 世纪 60 年代的集团时代。20 世纪 50 年代 60 年代的美国，反垄断执法非常激烈，以至于当经济扩张、公司希望通过并购进行扩张时，只有集团交易更有可能通过反垄断监管障碍。我们在第\
  \ 3 章 中讨论过这些集团企业的业绩记录。与其说此类交易往往缺乏战略意义且应该被放行，不如说扩张扩张的 CEO 们选择了构建庞大且臃肿的企业结构。最终，从 20\
  \ 世纪 70 年代开始 80 年代，美国的反垄断执法变得更加“正常”，未引起重大竞争担忧的交易有较高的预期通过执法程序。从那时起，美国的执法放松过程一直在持续，目前的反垄断执法已较为温和。\n\
  \n尽管如此，水平交易带来了风险，即拟议形式的交易可能无法被反垄断机构接受。在这种情况下，竞标者必须决定改变交易，例如同意出售合并后公司的部分资产、放弃交易或尝试与监管机构斗争。后者增加了成本和不确定性，使结果变得困难且不可预测。这可能解释了为什么\
  \ AT&T 最终决定放弃其与 T-Mobile 的拟议合并，尽管这意味着要支付 40 亿美元的现金和频谱许可作为分手费。令人惊讶的是，考虑到该行业高度集中的结构，AT&T\
  \ 及其高薪顾问为何未能预测这一结果。\n\n随着我们进入 20 世纪 90 年代的第五次并购潮，并购成为真正的全球性现象，竞争政策审查过程变得更加复杂。曾几何时，美国交易者主要关注的问题是处理司法部或联邦贸易委员会的关系。当合并后的实体在美国以外的市场拥有重要地位时，非美国的竞争政策监管机构也必须给予批准。其中最活跃的机构是欧盟委员会（EU）监管机构。曾几何时，双方对交易的观点非常相似，例如，如果司法部认为两家大型以美国为中心的国际公司的合并在法律上是可以接受的，那么欧盟也很可能认为该交易是可以接受的。这种情况在\
  \ 2001 年发生了变化，当时司法部对通用电气（GE）收购霍尼韦尔 430 亿美元持支持态度，结果却意外发现欧盟对该交易有异议。欧盟提出的解决方案将使该交易对通用电气失去吸引力，于是通用电气退出了。欧盟对这笔交易的立场（以及它在其他高知名拟议交易中采取的立场）使得全球水平并购的格局变得不那么可预测，因此风险更大。风险更大实际上实际上意味着交易的潜在成本更高。\n\
  \n涉及具有广泛全球布局公司的交易需要更更多的监管尽职调查。事实上，真正的全球公司之间的合并可能涉及来自许多国家的最多 80 个监管机构的备案。\n\n我们在全球反垄断执法中看到的趋势是，某些国家的竞争机构利用此类执法并非为了促进竞争，而是为了保护当地公司受大型全球竞争对手的影响。这种情况在欧盟也曾出现。这实际上不是反垄断政策，而仅仅是保护主义。然而，并购参与者需要现实并理解游戏的新规则。某些交易实际上可能在某些国家市场促进竞争，但会被监管机构以反垄断理由反对。\n\
  \n### 水平并购与市场力量：经济视角\n\n经济学家通常将追求水平合并视为对市场的追求。在微观经济学中，市场力量是将价格提高到边际成本以上的能力。在竞争性市场结构中，许多提供同质产品或服务的竞争者防止了任何公司将价格提高到边际成本以上。因此，它们都是价格接受者，在长期来看，价格等于边际成本。随后，供应商获得微观经济学中所谓的`正常回报`，这补偿了他们处于行业的机会成本，但未能为他们提供任何`经济租`。这是转向更集中的市场结构的动机之一，因为它允许供应商以高于边际成本的价格出售，并根据单位利润（即价格与平均成本之差）来增加整体盈利能力（参见图\
  \ 5.4）。有时价格与边际成本之间的关系通过勒纳指数（Lerner Index）描述：\n\n```\n![equation](img/c05-mdis-001.gif)\n\
  ```\n\n其中 `L` 越高，市场力量越大\n\n![img](img/n05f004.gif)\n\n**图 5.4** 消费者从竞争性市场中获益更多。他们购买的产量（X[c]）比垄断市场（X[m]）多，且支付更少（P[c]\
  \ < P[m]）。\n\n当一个行业整合到只有一个供应商时，该公司就拥有将价格提高到边际成本以上的最大能力。然而，这并不能保证供应商盈利。它仅仅意味着，如果它能够在边际成本等于边际收益的点进行生产，其潜在盈利能力将是所能达到的最高。但仍然出现在该`利润最大点`（Xm）的平均成本过高，以至于它仍然无法盈利（参见图\
  \ 5.5）。\n\n```\n![img](img/n05f005.gif)\n```\n\n**图 5.5** 亏损的垄断者\n\n\n\n\n微观经济学拥有合理的模型来处理完全竞争和垄断这两种极端对立的行业结构。当我们远离极端情况时，例如当从垄断转向少数垄断（只有`few`\
  \ 家卖家，即 3 到 12 家，具体取决于背景）时，那么供应商所拥有的市场力量可能存在多种解释。在过去的 10 到 20 年里，随着市场日益全球化，这种情况已成为现实。即便一个国家是世界上最大的市场（美国），当美国供应商面临全球竞争时，其在本本土的市场份额可能并不重要，因为随着新兴市场参与者进入行业，竞争程度随着时间的推移而增加。即使供应商能够以高于其边际成本的价格生产，且目前的竞争程度看起来适中，它仍然可能需要考虑潜在进入者的行动。这种市场可以被视为一个`可竞争`市场。市场越吸引人，供应商在边际成本以上销售的能力越强，新进入者试图争夺的奖励就越大。因此，在这个瞬息万变的全球化世界中，市场力量可能是转瞬即逝的。21\
  \ 世纪的世界不是静态的，而是可以发生快速变化。市场力量看似强大，但其效力可能是短暂的。每个行业都是不同的，并将对市场力量施加其自身的限制。\n\n### 关于企业是否通过兼并购来实现市场力量的实证证据\n\
  \n很少有实证证据表明公司通过合并来增加其垄断力量。事实上，在过去的四个世纪里，这个问题一直是金融经济学研究的焦点。这些研究的发现相当一致。\n\n1983 年出现了两项研究——它们都是博士论文的产物。一个是芝加哥大学罗伯特·S·斯尔曼（Robert\
  \ S. Stillman）的一项小样本研究。他的研究显示，当同行业的其他公司宣布合并时，竞争对手的股价并未做出反应。该分析考虑了在增加行业合并概率的事件发生时，受影响行业的股票价值。它还考虑了水平合并后产品价格可能会上涨，从而有利于行业内的其他公司。由于行业集中度提高导致产品价格上涨，该行业公司的股权价值也随之上升。该研究调查了\
  \ 11 宗根据《克莱顿法案第 7 条》受到反垄断法挑战的合并小样本。在 11 宗合并中，9 宗未发现具有统计学意义的异常收益。在另外两宗中，一宗显示出正异常收益，另一宗的结果则不明确。这些结果未能支持公司合并是为了寻求垄断力量的观点。\n\
  \n另一项同样基于博士论文的研究由 B. 埃普森·埃克博（B. Epsen Eckbo）针对涵盖制造业和采矿业的 126 宗水平和垂直合并的大样本进行的。在埃克博的样本中，约一半是水平合并。每个行业类别平均有\
  \ 15 家竞争对手。如果此前界定的市场力量假设有效，那么对于宣布合并并受到反垄断挑战的行业公司，将观察到负异常收益。其逻辑是，当存在反垄断挑战时，合并的可能性较低。当挑战发生时，负异常收益应该与挑战的公告相关。\n\
  \n埃克博发现异常收益在统计学上并不显著。该研究还显示，在合并最初宣布时，公司最初显示出正且具有统计学意义的异常收益，但在诉讼后未能显示出负面反应。与斯尔曼的结果相似，埃克博的研究并不支持公司合并是为了享受市场力量增长的信念。奇怪的是，埃克博的结果揭示，“在受到挑战（水平）合并中，竞标者和目标公司的股东获得的异常收益比未受挑战合并中的相应公司更大。”埃克博得出结论，合并中发现的收益与市场力量的增加，而是由效率增益等因素驱动的。\n\
  \n埃克博对市场力量假设进行了另一项研究，他在其中检查了加拿大的竞争水平，直到 1985 年，该国执行的是较为宽松的反垄断执法政策。他反驳了这样一种假设，即合并反竞争的概率在加拿大大于美国。从这项研究中可以得出的结论是，美国有时追求的、以及近年来在欧洲追求的更严厉的反垄断执法是没必要的。然而，这是一个复杂的问题，不能根据几项研究做出决定。尽管\
  \ 20 世纪 80 年代初的斯尔曼和埃克博研究对将市场力量作为并购动机的支持较少，但其他近期研究表明，市场力量可能是某些交易的动机。具体而言，Kim 和 Singal\
  \ 发现，20 世纪 80 年代后期航空业的合并导致导致合并公司经营航线的价格高于未参与控制交易的航线控制组。\n\n最近的研究表明，在供应商集中的情况下，水平合并增加了合并公司的购买力。Snyder\
  \ 以及 Stole 和 Zwiebel 在理论上证明了这一点，他们理论化了合并后的买家可以降低他们从集中供应商行业购买的投入成本。这得到了其他实证工作的支持。Fee\
  \ 和 Thomas 分析了 1980 年到 1997 年期间 554 宗水平交易的样本。他们发现企业客户（相对于竞争对手）没有出现显著的市场反应，这意味着市场并未感知到由于交易导致的市场力量发生变化。然而，他们注意到供应商出现了负面的市场反应，这意味着合并后的公司相对于其供应商获得了一定的购买力。AB–Inbev\
  \ 的合并就是合并公司以供应商为代价获益的良好例子。\n\n在斯尔曼和埃克博最初的研究后的多年里，美国的反垄断监管机构采取了宽松的反垄断执法政策。有些人在想：随着公司受反垄断执法的阻碍减少，`通谋`假设在近年来是否变得更具相关性？\n\
  \nHusayn Shahrur 的研究未能发现这种观点的支持。他分析了 1987 年到 1999 年期间 463 宗水平合并和要约收购。他发现，效率考量是驱动水平交易的主要因素，而不是实现市场力量。他的结果支持了二十年前斯尔曼和埃克博的最初发现。他还发现证据表明，当竞争对手合并时，他们可能相对于其供应商获得收益。我们在本章稍后部分将在安赛乐与宝塔尔合并的背景下讨论这个问题。此类合并公司可能会实现其相对于供应商的购买力的增长。在这种情况下，合并公司可能以供应商为代价获益。如果这种影响足够显著，可能会导致供应商行业的整合。结果可能是买方和供应商行业变得更加集中。近年来采矿业和钢铁行业的情况便是如此。\n\
  \n\n\n\n### 反衡力量、行业集中度与并购\n\n虽然分析垄断行业结构和垄断力量是微观经济学教科书的主要内容，但双边垄断模型（即相互进行业务往的两家公司都享有垄断地位）也有所讨论，但通常关注程度较少。然而，从并购的角度来看，鉴于全球范围内的监管机构（尤其是美国和欧盟）均不愿让公司通过并购来实现垄断地位——甚至是接近垄断的地位——这些讨论的相关性较低。更具相关性的是那些存在买卖关系、且通过并购整合成为相对集中的少数人垄断的行业。在这种情况下，如果一个行业变得更加集中，而另一个行业仍处于碎片化状态，那么集中的行业可能会获得某些更碎片化、竞争激烈的行业所无法获得的利益。钢铁行业就是这种情况：由于某些作为铁矿石卖方的矿业公司合并并变得更加强大，而钢铁行业仍然保持着碎片化状态。这引发了钢铁行业通过并购提高集中度并进行垂直整合的动力。通过这种方式，买方——钢铁公司——将增加其`countervailing\
  \ power`（反衡力量），这一概念由约翰·肯尼斯·加尔布雷恩在 20 世纪 50 年代普及。\n\n反衡力量的概念认为，一个群体（如行业中的大型企业）的力量需要被其他群体（如大型工会）所平衡。在世界经济变得更加全球化之前，这种推理可能更具相关性。当一个特定国家的公司必须面对工会化程度很高的劳动力，但在其当地市场中又必须与非工会化的竞争对手竞争时，反衡力量的概念就变得不再恰当。美国汽车行业就是一个很好的例子。曾经，在美国汽车市场出现许多非美国竞争对手之前，美国汽车工会（United\
  \ Auto Workers）曾是美国“四大”汽车制造商的反衡力量（在克莱斯勒收购美国汽车公司后，变为“三强”）。随后，当主要的国际竞争对手更大规模地进入美国市场，甚至在美国建立了拥有非工会劳动力的大工厂时，工会变成了一种让这些公司失去竞争力的力量。曾经的反衡力量随着时间的推移可能变成致命的枷锁。\n\
  \n在我们讨论的语境下，一个公司群体（如卖方）的力量可能需要其交易对手——买方（或反之）的力量来平衡。如果不这样做，卖方可能会处于以牺牲买方利益来获取收益的位置。随着买方变得越来越强大，他们可能增强自己的谈判地位。即使只有一两个买方变得强大，情况也可能如此。事实上，有人理论化地认为，“买合并可能会增加所有买方的利润”，因为他们的谈判努力有助于设定市场价格。\n\
  \n接下来的关于铁矿矿业与钢铁制造商之间关系的案例研究是一个很好的例子，展示了由安赛钢铁（Arcelor–Mittal）领导的买方——钢铁制造商如何改善其市场地位并获得更多的反衡力量。\n\
  \n### 水平整合、整合与滚动式收购计划\n\n我们已经讨论过，许多水平交易是基于效率考量，而不是基于追求市场权力等其他因素。效率考量被誉为我们在 20 世纪\
  \ 90 年代许多“滚动式收购”（roll-ups）的基础。这些交易中的许多涉及大公司通过一系列收购购买较小的竞争对手。被收购的公司随后被合并成一家不断扩大的大型公司。此类交易有时被称为`roll-up\
  \ acquisitions`（滚动式收购）。\n\n20 世纪 90 年代的股市青睐滚动式收购，尽管程度不如对互联网公司的痴迷。对整合者而言，具有吸引力的典型市场是那些在碎片化且不集中的行业中拥有许多相对较小竞争对手的市场。这些行业中的许多目标公司（例如巴士运输或殡仪馆业务的公司）都是闭股持有的。这些所有者缺乏流动性，被大型上市公司收购使他们能够将其不流动、闭股持有的股份转化为更具流动性的资产。整合者能够说服市场，对这些较小目标的大规模收购将使合并后的公司实现规模经济，同时通过服务国家性客户的能力增强销售。规模经济本应有很多来源，包括购买力的增加，国家性公司与小型地区公司相比具有这种优势。在第五波浪中，美国形成了一系列滚动式公司，名称如`Coach\
  \ USA`、`Metals USA`和`Floral USA`。\n\n对于许多私有卖方来说，流动性的梦想结合具有吸引力的溢价被证明是一场噩梦。殡仪行业就是如此，像`Service\
  \ Corp`和`Leowen`这样的大型整合者遇到了财务问题，`Leowen`最终不得不申请了`Chapter 11`破产保护。许多整合者只擅长一件事——做交易。他们不是优秀的经理，令人惊讶的是，市场花了很长时间才意识到这一点。\n\
  \n90 年代的滚动式收购有时被称为`poof companies`（泡影公司/瞬间消失的公司）。这个名字源于交易制定者会合并许多小公司并瞬间创造出一家大公司。如果较小公司的运营效率较低，这种组合可以带来许多协同效应的机会。例如，较小的公司可能从规模较大的卖方处以低批量进行购买，因此无法获得最优惠的价格。\n\
  \n## 注释\n\n### 第 6 章\n\n垂直整合\n\n虽然`horizontal integration*`指的是竞争对手之间的合并，但垂直交易涉及具有买卖关系或上游-下游关系的公司。虽然它们可能没有水平交易那么常见，但仍有无数垂直整合合并与收购（M&A）案例。关键问题是，此类垂直交易的记录如何？遗憾的是，通常是令人怀疑的。在某些实例和情况下，这对涉及的公司来说是合理的。在这些情况下，垂直整合可能是解决如可靠供应源等问题的最佳解决方案。在其他情况下，它可能无法产生实际收益，并导致公司资源的浪费，而这些资源本可以更好地应用在其他地方。\n\
  \n\n\n\n\n垂直整合的益处因行业而异。当交易涉及（例如）制造商收购一家零售商时，该交易可能允许制造商能够更好地接触到其产品的最终消费者。同样，在石油石行业，许多大型公司已经实现了垂直整合多年。看到石油公司参与石油勘探、运输、管道建设和炼油，同时也拥有一个庞大的加油站网络，这并不罕见。当他们涉及所有这些领域时，我们称其为完全垂直整合。这是好是坏是一个备有争议的问题。\n\
  \n## 风险与垂直整合\n\n垂直整合的益处之一是它可以降低公司在市场中所面临的一些风险。收购供应商可以使公司在获取供应方面具有更大的确定性。它还允许这些供应能够以更具预测性的价格更可靠地获得。当获取关键供应是一个主要的风险因素时，公司可以通过垂直整合来降低这种风险。通过收购供应商，他们可能获得可靠的投入来源，同时还可能通过防止竞争对手获得这些供应来获得竞争优势。这种竞争优势可能会带来反垄断法方面的影响，但随着市场日益全球化，大多数交易（尤其是垂直整合交易）往往在没有太多反对意见的情况下通过反垄断审批流程。\n\
  \n### 作为全球增长的垂直整合\n\n当一家公司制造产品时，它显然必须将产品交付给最终消费者。即使公司拥有优质的产品，如果竞争对手锁定了分销渠道，公司可能处于无法逾越的劣势。有时，并购（M&A）可以成为这种困境的解决方案。\n\
  \n许多行业具有不同的层次或阶段，某些阶段比其他阶段更具竞争性。例如，石油行业有多个阶段，从勘探开采到运输炼油以及零售阶段。某些阶段比其他阶段更有利。我们将在本章后面讨论美国公司如何应对炼油业务盈利能力的变化，降低垂直整合程度并出售其炼油业务。然而，对于其他行业来说，垂直整合是确保你的产品有清晰的消费者路径，并且你不会受到竞争对手行动的不利影响的方法。公司可能想要尽可能控制产品的销售渠道，以确保他们能够维持允许其从产品中提取最大经济租的价格。通常，此类努力会受到监管者的阻碍。在美国以及全球范围内，这种做法在没有引起反垄断监管机构抵抗的情况下实施的一个显著例子是眼镜制造商和营销商奢侈时华集团（Luxottica）。我们将在接下来的案例研究中讨论该公司对垂直整合策略非常成功的使用。\n\
  \n### 拥有自己的供应商可能成为竞争劣势\n\n似乎显而易见，拥有自己的供应商应该带来益处——程度可能是一个问题，但看起来这将是积极的而非负面的。令人惊讶的是，情况并非如此。有时，拥有自己的供应商可能是一种劣势——而不是优势！\n\
  \n### 垂直整合作为业务的自然延伸\n\n在许多行业中，有效的分销对企业的增长起着关键作用。美国软饮料市场就是如此。利润的来源是与品牌相关的利润以及通过多年成功营销建立起来的信誉。对于某些公司来说，产品开发产生了消费者\
  \ true 的成功产品。未来的销售与其说取决于额外的产品开发，不如说取决于在一个投入巨额资金进行营销的行业中成功的营销。\n\n百事（Pepsi）是这样的制造商，知道利润的主要来源在于制造和营销产品——而不是分销产品。对于百事来说，拆分其供应商似乎合逻辑，或者他们是这样想的。人们会认为管理层了解自己的行业，因此对不控制自己供应商网络的影响进行了认真考虑。然而在短短几年内，这一决定就被证明是非常可疑的。\n\
  \n### 垂直整合：一种增长策略？\n\n成熟市场或面临激烈竞争的市场中的公司通常在其他地方寻找增长机会。有时这涉及向行业之外进行多元化发展。我们在第 4 章中讨论过多元化作为一种策略。然而，我们现在只需要指出，有充分的证据表明，多元化策略的益处往往是值得的。\n\
  \n收购下游业务的供应商意味着扩展到同一通用业务市场的不同方面。与向行业之外扩张相比，这是一种优势，因为推测收购者了解整个行业，并可能与被收购的公司做过生意。因此，他们可能比行业之外的公司更了解目标的优劣势。在所有其他因素保持不变的情况下，这使得垂直交易相比其他交易具有可能的优势。遗憾的是，这种优势并不是那么显著，并且可能会被许多其他因素所抵消。\n\
  \n对于挣扎于增长的公司经理来说，收购另一家公司提供了增长的`表象`。收入增加了，随之而来的是额外的利润（理想情况下）。快速查看该公司的收入和利润历史就会意味着增长。当然，这是一种非常浅浅的分析，因为收购者已经预先向目标股东支付了这些额外的利润。此外，为了给目标公司出售的激励，买家通常必须支付溢价。这给出标人带来了负担，要求其产生比卖方预期实现的更高的回报。这种支付可能会以现金损失和/或债务增加的形式出现在资产负债表上，并伴随着未来的利息和本金支付，或者发行股票，这会带来稀释问题。因此，关键在于必须有协同效应，使得公司的结合将产生超出收购者为目标支付成本的收入和/或利润。这对于所有收购都是如此。在垂直交易的背景下，必须有合理的理由相信此类收益将会体现。然而，通常情况并非如此。这在接下来的家得（Home\
  \ Depot）案例研究中得到了体现。\n\n### 持续重新评估垂直整合策略\n\n垂直整合的公司需要定期重新评估其结构，并检查来自垂直链不同部分的收益。需要经常问的问题是：整体公司在同一结构内拥有不同的垂直部门是否更好，还是如果将这些单元分开对股东会更好？\n\
  \n\n\n\n一个通过取消其垂直化结构来应对更波动市场的行业良好范例是美国石油工业。该行业一直处于垂直整合状态，这似乎是种自然的方式。然而，正如下方的案例研究所示，这种情况在\
  \ 21 世纪 00 年代发生了变化。\n\n### 垂直整合的监管\n\n虽然水平并购（M&A）在某些情况下可能会引起反垄断监管者的愤恨，但垂直交易通常不会受到反对。这部分归因于过去三十年对垂直交易监管视角的转变。在\
  \ 20 世纪 80 年代以前，垂直交易被某些人认为可能具有反竞争性，因为在某些情况下可能导致竞争对手被排除供应之外。当时的想法是，被收购的供应商现在可以选择不向收购方的竞争对手提供产品或服务。这些观点受到了经常与`芝加哥学派`相关的经济学家的挑战。`芝加哥学派`指的是由某些经济学家支持的观点，其中包括多位诺贝尔奖经济学家，如乔治·斯蒂格勒（George\
  \ Stigler）和米尔顿·弗里德曼（Milton Friedman），以及罗纳德·科斯（Ronald Coase）和加里·贝克尔（Gary Becker），他们都是芝加哥大学的教授。¹他们的开创性成就产生了一系列追随者，其中许多人任教于芝加哥大学以及许多其他大学。\n\
  \n其他观点外，这些`芝加哥学派`的观点通常强调自由市场和低监管的处。该学派的追随者经常认为，垂直交易可以带来效率的提高并且通常具有竞争中性。法院开始采纳这种观点，并在一段时间内并不反对垂直交易。随着法院开始考虑“后芝加哥”观点，这种情况发生了一定变化，这种观点采用了博弈论方法，考虑了垂直整合公司如何通过某些操作来获得相对于竞争对手的优势。\n\
  \n虽然拟议的垂直交易确实可能出于竞争考虑被反对，但与水平并购相比，垂直交易通常进展得顺畅得多。这使得从监管角度来看，垂直交易的不确定性和成本更低。虽然这是相对于水平并购的明显优势，但这些优势可能会被战略考虑所大大抵消。\n\
  \n### 模仿垂直整合\n\n当一个行业中的一家主要公司实现垂直整合时，其竞争对手可能会认为它已经获得了相对于自己的竞争优势，它们可能会追求自己的垂直整合策略。有时，这些反应仅仅是本能反应，而不是深思熟虑的产物。让我们回想默克（Merck）和美信（Medco）之间失败的合并，我们在第\
  \ 3 章中讨论过。默克与美信之间的原始交易考虑得不充分，默克没有预见到对于其可能获得的市场实力的反弹——这种力量源于默克可能给予其药物优于竞争对手的产品，而某些医生可能更青睐这些药物。最终，该交易不得不取消，美信在\
  \ 2003 年被拆分。尽管如此，制药行业的这一系列交易具有启示意义，因为它展示了竞争对手（在本例中为罗氏 Roche 和礼来 Eli Lilly）是如何对另一家公司的并购计划做出反应的。\n\
  \n有趣的是，2012 年，在默克失败的垂直整合策略早已成为过去式后，2011 年收入为 660 亿美元的美信被另一规模较小的竞争对手 Express Scripts\
  \ 通过水平交易收购，后者的 2011 年收入为 450 亿美元。在拆分后的几年里，美信已多元化到基因检测和临床研究等领域，并扩展到了欧洲。然而，Express\
  \ Scripts 专注于其核心业务。\n\n美信和 Express Scripts 的结合产生了药剂福利业务中规模最大的公司。这次合并随之给两个最大的竞争对手——CVS\
  \ Caremark 和联合健康集团（United Health Group）的 Optum Rx 带来了压力。该交易说明了先前的垂直策略在该行业并不行通，但这些公司认为水平合并是有益的。\n\
  \n有时，模仿性并购仅仅是对市场条件变化的反应。石油公司出售其利润较低的炼油厂就是这种情况，正如我们刚刚讨论的那样。这些销售的主要因果因素是市场条件的变化对垂直整合业务中炼油部门盈利能力的影响。不同的石油公司做出了类似的反应，它们寻求剥离这些业务部门，以防其降低整体业务的盈利能力。\n\
  \n## 注释\n\n### 第 7 章：通过新兴市场并购实现增长\n\n在本章中，我们将讨论发达市场公司在新兴市场中存在的并购收购（M&A）机会，以及新兴市场收购者的兴起。我们首先关注更发达经济体中寻求更快速增长的公司在这些市场进行的并购。然后，我们将重点关注新兴市场收购者。新兴市场收购者是来自新兴市场的一类较新的收购者，他们出于各种原因针对发达世界的公司。\n\
  \n对全球所有主要新兴市场并购机会的全面讨论远超本章的范畴。相反，我们关注在一些主要新兴市场中进行并购的机会，同时也关注其中的陷阱。与本书的其他部分一样，我们通过讨论实际的并购案例来证明许多观点——其中一些取得了成功，另一些则没有。通过这种方式，我们希望提出许多交易制定者和潜在收购者在进行交易之前必须意识到的问题。\n\
  \n公司通过在新兴市场进行并购，可以实现对其产品或服务的需求扩大而从中获益。它们还可以在新兴市场获得更好的供应源。此类交易并不新鲜，但已经持续很长时间。我们的初步讨论集中在发达国家追求增长以及对其产品或服务有更大需求的公司。发达市场公司转向新兴市场寻求增长的原因之一是所谓发达国家经济的疲软。\n\
  \n# 后次贷时代主要体的经济状况\n\n近年来，主要的发达市场增长缓慢或没有增长。图 7.1 显示了美国、欧洲联盟和日本经济的贫乏增长。美国受到次贷危机及随后的大衰退的冲击。美国经历了\
  \ 18 个月的衰退，随后是虚弱的恢复。直到 2012 年初，美国才显示出稳定增长的迹象，尽管这种增长相对适中并在 2%左右波动。经济历史告诉我们，由金融危机引发的衰退恢复往往需要更长时间。因哈特（Reinhart）和罗格夫（Rogoff）表明，平均而言，此类金融危机相关的衰退持续时间长于与金融危机无关衰退，后者在周期内失业率平均上升\
  \ 7 个百分点。^(1)\n\n```\n![img](img/n07f001.gif)\n```\n\n**图 7.1** 美国、欧盟和日本年度 GDP 增长率\n\
  \n*来源：* IMF，世界经济展望数据库，2012 年 10 月。\n\n\n\n\n\n席卷美国和欧洲的次贷危机之后是 2011 年至 2012 年的主权债务危机，这进一步削弱了欧洲经济。这些事件的共同作用导致欧洲增长微弱，其中南欧的经济状况差于北欧，而后者本身也并不算强劲（参见图\
  \ 7.1）。其影响是，许多寻求增长的跨不得不转向高增长市场，而不是试图从成熟市场、甚至更糟糕的、像欧洲这样停滞不前的市场中挤出增长增长。事实上，在在大衰退和欧洲主权债务危机之前，情况已经如此，但在此之后这种需求变得更加迫切。\n\
  \n在日本，前景一段时间以来一直不容乐观。尽管日本经济仍然疲软，但外汇市场有时会选择增加日元兑美元等货币的汇率。美国联储为了试图重启美国经济而实施的几轮量化宽松政策，对提升日元汇率的作用并不大。作为一个出口导向型经济体，日本公司与其美国和欧洲的竞争对手一样，不得不日益向境外寻求快速增长的并购机会。虽然在\
  \ 2010 年到 2011 年两年间，美国的境外并购规模相当稳定，但日本的境外并购规模在 2011 年大幅上升，反映了这种对停滞不前的日本经济之外增长的追求。那么明显的问题是，哪些市场提供了最大的增长机会？\n\
  \n### 低增长市场的收益递减\n\n在成熟或低增长市场中寻求增长的公司会发现，获得增长的收益非常困难且极其昂贵。这些增长通常不是基础经济和市场扩张的结果，而是往往以牺牲竞争对手为代价实现的。在通常有多个强有力竞争对手的成熟市场中，这些增长可能需要大量的成本投入，例如营销和广告。以美国啤酒市场为例。拥有成熟品牌的公司，如营销知名品牌百威（Budweiser）的英氏百森（Anheuser-Busch），已经获得了稳定的市场份额，但必须不断投入巨资来维持这一份额。米勒酿酒厂（Miller\
  \ Brewing）在彩色广告上投入了大量资金，但从未能取代百威和百威淡青啤（Budweiser Light）的主导地位。尽管在多年里，米勒由菲利普·莫里斯/雅特里（Philip\
  \ Morris/Atria）拥有，该公司从烟草销售中获得了大量且稳定的现金流。正如我们讨论过的，当英氏百森沉迷于在美国啤酒市场的主导地位时，该行业变得日益全球化，其他公司开始变得更加强大。\n\
  \n这些快速增长的啤酒公司之一是英宝（InBev）。这家公司通过一系列构思周全全球收购，成为了全球主要的啤酒营销商。然而，英氏百森由于其封闭的美国西部管理层，进入全球市场的动作太晚且投入太少，这使其容易受到收购。如果它管理得当，而不是像经营王国一样让王位连续传给四位百士（Busch）继承人，它本可以抓住全球化的机会并保持独立。^(2)相反，它成为了被更具全球视野的英宝管理层收购的有价值目标。英氏本有机会激进地将其领先品牌推向世界市场，但其软弱且迟缓的尝试付出了失去独立性的代价。然而，从股东的角度来看，这并不一定是一件坏事。归根结底，公司的资产被转移到一家拥有表现卓越的管理团队的公司。我们在第\
  \ 5 章中讨论了英宝对英氏百森的收购。\n\n新兴市场可以为来自发达市场的成熟公司提供巨大的机会。通常情况下，那些在本土市场取得巨大成功并拥有成熟品牌的公司，可以利用在开发产品和市场地位上投入的巨额投资。这些公司相比新兴市场中的新公司可能具有显著优势，因为它们拥有高度开发的产品和品牌，这些品牌可能是世界闻名的。产品质量和品牌名称对新兴市场的消费者来说可能非常有吸引力。新兴市场的公司很难比这些优势。这类例子比比胜有，但一个特别有趣的例子是英国蒸馏酒巨得亚（Diageo），我们将在本章稍后部分讨论它。此时，识别出高增长的地理区域和国家是有用的。\n\
  \n### 人口结构的作用\n\n当我们考虑哪些市场是值得并购策略的高增长市场时，我们必须识别影响此类决策的关键因素。其中一个关键因素必须是人口结构。人口极其庞大的市场必须是值得密切关注的。这种推理在中国的案例中确实证明是正确的。通常，对于高盛的姆·奥尼尔（Jim\
  \ ONeill）创造的术语 BRICS（指巴西、俄罗斯、印度和中国），这通常被证明是正确的。^(3) 在不同程度上，这四个国家已成为主要的增长市场。然而，单凭人口结构不能成为决定因素。虽然这四个国家都表现出增长，但俄罗斯和印度受到政府和监管体系的主要限制。因此，增长市场的选择需要一系列因素的驱动，其中人口结构必须是关键。\n\
  \n并购增长的巨大挑战之一是识别 BRICS 之后的增长市场。例如，拥有 2.4 亿人的印度尼西亚或 1.5 亿人的孟加拉会是下一个（参见表 7.1）吗？印度尼西亚是一个拥有稳定的增长和受控的通胀——这是一个良好的组合。它是人口最多的国家非常有潜力。\n\
  \n| 国家 | 人口（百万） | 人均 GDP（美元） |\n| :--- | :--- | :--- |\n| 中国 | 1344.1 | 5444.8 |\n\
  | 印度 | 1241.5 | 1488.5 |\n| 美国 | 311.6 | 48441.6 |\n| 印度尼西亚 | 242.3 | 3494.6 |\n\
  | 巴西 | 196.7 | 12593.9 |\n| 巴基斯坦 | 176.7 | 1194.3 |\n| 尼日利亚 | 162.5 | 1452.1 |\n\
  | 孟加拉 | 150.5 | 735.0 |\n| 俄罗斯 | 141.9 | 13089.3 |\n| 日本 | 127.8 | 45902.7 |\n|\
  \ 墨西哥 | 114.8 | 10064.3 |\n| 菲律宾 | 94.9 | 2369.5 |\n| 越南 | 87.8 | 1411.2 |\n| 埃塞俄比亚\
  \ | 84.7 | 374.2 |\n| 埃及 | 82.5 | 2780.9 |\n\n**表 7.1** 人口前 15 个国家及其人均 GDP^(4)\n\
  \n*来源：* 世界银行：`http://databank.worldbank.org/ddp/home.do`(`http://www.databank.worldbank.org/ddp/home.do`）。\n\
  \n# 下一个 11\n\n高盛的研究人员和姆·奥尼尔识别了他们所说的“下一个 11”（N-11）国家，这指的是以下国家：\n\n1.  孟加拉\n\n2. \
  \ 埃及\n\n3.  印度尼西亚\n\n4.  伊朗\n\n5.  韩国\n\n6.  墨西哥\n\n7.  尼日利亚\n\n8.  巴基斯坦\n\n9. \
  \ 菲律宾\n\n10. 土耳其\n\n11. 越南\n\n\n\n\nO'Neill 承认，尽管规模差异巨大，N-11 国家“可能没有产生‘类金砖国家’的影响力，但它们可以与\
  \ G7 相争上下”。G7 最初于 1975 年作为 G6 成立，包括法国、德国、意大利、日本、英国和美国。加拿大于次年加入。在 N-11 国家中，有四个国家——墨西哥、印度尼西亚、韩国和土耳其——占了整个\
  \ N-11 总 GDP 的四之三。\n\n许多公司的并购（M&A）策略受 CEO 及高层管理人员时间重点的驱动。考虑到一个平均 CEO 的任期约为七到八年，那么他们可能不会对那些在他们离职很久后才能结实的项目感兴趣。这是否符合股东的利益是另一个问题。我们现在关注的是现实，而不是企业界应该如何运作。美国企业界已变得如此短视，以至于大部分精力集中在下一个季度财报上——更不用说未来\
  \ 5 到 10 年的表现了。考虑到这一点，哪些市场能够从跨度可能达 5 到 10 年的并购策略中获得回报？如果是这个时间跨度，那么单凭人口结构显然不会是驱动因素。必须是人口结构结合基础设施和政府系统，且这些者在可预见的未来都能到位。这便缩小了范围。\n\
  \n### 并购并不总是进入高增长市场的最佳方式\n\n在详细讨论哪些国家值得采取并购策略之前，重要的是确定是否还有其他方式可以实现公司的目标。通常，这些方式（如合资企业和战略联盟）是成本更低的替代方案。我们将在第\
  \ 8 章中详细讨论这一点。然而，现在让我们考虑花旗银行的近期案例，该银行在 2012 年 3 月出售了其在上海浦东开发银行的剩余股权。这是西方银行放弃部分海外投资头目的整体趋势的一部分，因为监管机构要求银行持有更多此类投资相关的资本。这些更高的资本要求（被称为`巴塞尔协议\
  \ III`）不仅影响了花旗银行，还影响了摩根士丹——摩根士丹出售了其在中国国际资本集团和美国银行约三分之一的投资，并几乎清空了其在中国建设银行的全部股权，这改变了他们对待中国市场的方式。\n\
  \n当美国银行收购这些中国银行的股权时时，他们假设为了在中国开展业务，此类股票收购是必要的。这是中国政府在汽车等其他行业的要求。然而，近年来，中国政府已为美国银行在华提供丰利的银行服务（如信用卡）绿灯。花旗银行是第一家获得此类能力的银行。信用卡对于美国银行来说是一项非常有利的业务，与日本等其他大国家的银行相比，美国银行更偏向零售。在中国这样一个巨大的市场中，提供一些更丰厚的银行服务能力，而无需与中国合作伙伴建立股权关系（这也会带来更高的资本要求），这类似于于鱼熊掌兼得。在这里，美国银行能够不通过并购策略进入高增长的中国市场。从长远来看，这可能是有益的。\n\
  \n### 高增长地区和国家\n\n在本节中关注的快速增长市场各都有其独特的增长机会，但也面临挑战。我们的讨论从亚洲开始，因为两个增长最快的巨型经济体位于那里：中国和印度。\n\
  \n#### 亚洲\n\n显然，日本和韩国是两个巨大的亚洲国家，凭借其巨大的规模，它们拥有高水平的并购活动。2011 年，日本记录了 572 亿美元的并购，而韩国则完成了\
  \ 249 亿美元的交易（见图 7.2）。然而，这两个国家都已成熟，增长并不迅速。事实上，最近被中国取代成为世界第二大经济体的日本在过去的 15 年里一直处于停滞状态。它在\
  \ 20 世纪 90 年代陷入了为期十年的衰退，且从未完全恢复。当它似乎处于某种小幅复苏的过程中时，全球次贷危机中断了它以及大多数发达国家的复苏。然而，尽管这两个市场规模很大，且拥有惊人购买力的消费者，但它们都是低增长经济体。它们的市场虽然大，但已经成熟、增长缓慢，并且已经挤满了竞争者。\n\
  \n![img](img/n07f002.gif)\n\n**图 7.2** 1991–2012 年日本和韩国并购\n\n*来源：* Thomson Financial\
  \ Securities Data。\n\n韩国经济的前景比日本经济稍微乐观一些。韩国经济在全球衰退后已经稳定并恢复了增长。此外，韩国没有日本面临的人口结构问题。尽管如此，它仍然是一个成熟经济体，不能被视为主要的增长市场。\n\
  \n#### 日本\n\n我们曾作为主要经济体经济停滞的典型讨论过日本。然而，我们必须承认日本仍然是世界最大的经济体之一，并对拥有丰田、三菱和索尼等领先企业而自豪。\n\
  \n考虑到极低增长的日本与许多其他增长市场之间的增长差异，人们在想为什么近年来许多日本收购都发生在相当发达的市场。例如，在 2010 年至 2012 年间，许多日本公司像美国公司一样资金充裕。然而，日本公司似乎比其流动性相当的美国同行更急于使用现金资金资助并购计划。答案是，与全球其他替代方案相比，日本市场的长期增长前景黯淡。\n\
  \n2011 年至 2012 年完成的交易并非以往日本并购扩张中的那种“奖杯性交易”。事实上，过去某些日本并购的记录非常糟糕。当我们考虑到并购失败时，会立即回想起日本收购的惨败，如\
  \ 20 世纪 80 年代和 90 年代初对洛克菲勒中心和通用环球影城的交易。然而，近几年的日本交易并非为了收购奖杯，而是为了在本土市场停滞的情况下寻找可持续的增长。\n\
  \n我们看到，日本交易者清楚地意识到日本市场处于停滞状态，在那里实现增长是一项挑战。因此，他们向海外寻找增长机会。一个例子是软银在 2012 年收购 Sprint\
  \ Nextel 大量股权的报价。\n\n亚洲（如果不是全球范围内）最大的两个增长市场是中国和印度。它们的增长前景与日本和韩国截然不同。然而，对于寻求在大型成熟市场中利用这些市场增长的公司来说，中国和印度都带来了独特的挑战。\n\
  \n#### 中国：经济与人口结构\n\n\n\n\n\n如图 7.3 所示，中国在经济开放后取得了令人瞩目的增长。自由市场的概念对于这个神子国来说相对新颖。从\
  \ 20 世纪 70 年代末开始，中国开始农业去集体化。该国还为农业工人创造了各种激励，鼓励他们转向工业生产等更高附加值的活动。^(6) 随后，在 20 世纪\
  \ 80 年代末，该国开始将大部分国有工业私有化。坦率地说，私有化过程仍在进行，政府对国家工业仍保持着过度的控制。\n\n![img](img/n07f003.gif)\n\
  \n图 7.3 中国 (a) 实际 GDP 和 (b) 人均 GDP 的增长\n\n*来源：* 国际货币基金组织 (IMF)，《世界经济展望数据库》，2012\
  \ 年 10 月。\n\n按国际标准衡量，中国政府相对稳定。基本上，政府每 10 年更换一次，并在 2012 年底选出了了新的领导人。中国领导层的发展趋势是对经济和金融改革的开放程度日益增加。\n\
  \n中国拥有 13 亿的巨大人口，展现了巨大的潜力购买力。然而，“潜力”是一个关键词，因为中国的人均 GDP（印度更是如此）仍远低于美国和日本等成熟市场的领先国家。截至\
  \ 2011 年，中国的人均 GDP 为 8,466 美元，印度为 3,652 美元。相比之下，同年美国的人均 GDP 为 48,400 美元，日本为 34,394\
  \ 美元（均使用世界银行数据）。\n\n美国和中国经济之间存在重大差异。虽然对这些差异的详细讨论远超本书书的范围，但几点评论将大有裨益。其中一些差异通过观察图\
  \ 7.4 就能明显看出。中国投资占 GDP 的比例显著高于美国。此外，在大多数市场经济体中，投资往往是四个主要组成部分中波动性最大的，这会导致经济更具周期性。此外，中国较高的投资通过加速经济增长率带来了丰厚的回报。美国经济的情况恰恰相反。\n\
  \n![img](img/n07f004.gif)\n\n图 7.4 (a) 美国和 (b) 中国 GDP 的构成\n\n*来源：经济学人*（经济学人情报）。\n\
  \n消费占美国 GDP 的 70%以上，但仅是中国总出的三分之一。此外，出口占中国 GDP 的 44%，而仅占美国 GDP 的 13%。没有比这些数字更能总结这两个经济体巨大差异。。中国下一阶段经济发展面临的巨大挑战。中国需要减少对简单的出口导向型增长模式的依赖，这种模式在将中国变为世界第二大经济体方面非常有效。然而，出口增长的一部分是由受管理而非自由市场的汇率驱动的。中国需要继续增加公民的财富，随着他们收入和财富的提高，他们需要购买更多中国和其他国家的产出，而不是依赖单方面的国际贸易。此外，中国政府需要减少其在经济中的作用，减少其驱动力。政府在引导中国进入世界经济并取得瞩目地位方面发挥了非常重要且在很大程度上是有益的作用。现在是政府开始后退，让自由市场允许中国公司和人民掌握更多经济主导权了。当这种情况发生时，增长可能会加速。\n\
  \n将中国的人均收入（如图 7.3 所示）与美国和日本进行简单比较可能是很有误骗性的，可能无法完全反映中国消费者的潜力购买力。中国尚未从出口型经济向更由消费者驱动的经济实现重大转型。此外，虽然美国消费者可能通过当前收入和债务（未来收入）消费，但中国消费者拥有高平均储蓄率，并使用储蓄现金进行许多大额购买。任何访问北京、上海等中国大城市的游客都可以通过道路上大量的豪车等景观证实中国的购买力。然而，离开大城市后，这种购买力会有所下降。事实上，中国的经济发展模式引发了许多对收入不平等的担忧——但这并不是中国特有的问题，而似乎是大多数（但并非所有，考虑斯堪的维亚国家）主要经济体经济发展的副产品。\n\
  \n如果我们的目标是从高增长市场寻求增长，那么我们的目光应该从日本和韩国等大型且成熟的国家转移，不仅要关注中国和印度这样巨大的市场，还要关注亚洲其他高增长经济体。当我们这样做时，我们会关注印度尼西亚、泰国、马来西亚和菲律宾等国家。这些国家比中国和印度小得多，因此带来的并购（M&A）机会也小得多。尽管如此，其中一些（如印度尼西亚）展现了有趣的增长前景——特别是当我们考虑到其两亿人口的经济规模时。该国正在取得瞩目的增长，随之而来的是新兴中产阶级的崛起。\n\
  \n#### 在中国市场进行并购\n\n中国政府对进入中国的外国公司设置了障碍。他们试图限制外国公司购买中国公司的控制权。此外，他们迫使寻求在中国开展业务的外国公司与中国“伙伴”合作，并将在此类实体中的股权限制在控制线以下（51%）。例如，进入中国汽车市场的欧美公司就是如此。通用汽车与上海汽车工业总公司合作，成立了上海通用。虽然通用汽车为了进入中国市场付出了很多，但这项投资被证明是极其成功的，并在曾是陷入困境的汽车行业少数增长领域之一（参见本章后文案例研究“通用汽车在中国开展业务”）。\n\
  \n\n\n\n中国银行业的限制更为严格。在这里，市场由中国银行和中国工商银行为首的五大大型国有银行主导。银行在中国或任何其他市场扩张的方式是开设分机构并吸引存款。然而，中国政府对外资银行可以开设的分机构数量实施了限制。截至\
  \ 2012 年，这一数量少于 400 家，而中国五大国有银行拥有超过 65,000 家分机构。根据`IMF`的数据，外资银行所占的平均存款约占市场份额的一半。即使在美国，这一比例也几乎为\
  \ 20%。显然，中国政府干预了中国所有主要的市场，以一种其认为将有利于国家（或至少有利于其政治领导人及其家人）的方式来引导经济。它并没有考虑到外国公司的并购（M&A）计划。\n\
  \n#### 近年的监管变化\n\n在涉及外国投资和境外公司并购方面，中国有着相互冲突的目标。它希望保护国有企业和地方企业免受大型外部竞争对手的竞争。然而，它也希望从这些公司为中国市场带来的技术和其他能力中受益。通常，这些目标之间是不自洽的。\n\
  \n2003 年，中国法律进行了修订，允许外国公司更容易地收购中国公司。该法律在`2006`年和`2009`年进行了更新。这些规则涉及了投资资金和支付价格的公平性，并设定了大量的限制。政府在过程中无处不在，`财政部`特别关注确保“关键行业”得到保护，“国家经济安全”不受威胁，并确保中国的“老字号”不落入外控制。可以说，如果政府不想让通过，任何具有意义的交易都无法完成。因此，当中国公司或中国政府抱怨他们未被无限制地进入其他国家进行并购时，在考虑到中国政府对其进入市场的外国者施加的巨大限制之前，他们的确实是有道理的。但一旦考虑到这些限制，他们的抱怨就站不住脚了。事实上，与中国市场对发达国家及其企业的开放程度相比，发达市场对中国并购的开放程度是非常惊人的。\n\
  \n#### 技术转移与并购\n\n在某些情况下，技术转移是明确且公开的，外国公司会被提前告知这是追求并购的要求。因此，中国有能力在其他外国公司之间进行制衡，就像它对`GM`和`Ford`所的那样。在其他领域，存在由`U.S.`和欧洲公司提出的争议，他们声称其技术被盗窃，且知识产权没有得到中国法院的保护。例如，`U.S.`公司指控中国电信巨头`华为`公然偷取了`U.S.`技术。在`2012`年，当这家公司试图扩张利润丰厚的`U.S.`电信市场遭遇阻力时，这成为了这家中国公司的麻烦。美国的一些人会说，考虑到他们无需付出代价就享受的技术收益，这是他们必须付出的出的代价。\n\
  \n外国公司必须权衡技术流失（这可能是长期大量投资的成果）与在中国销售快速增长带来的收益。这种增长的大部分在未来可以实现，因为中国正在从出口导向型经济向更多基于消费支出的经济转型。非中国公司所担心的是，这些未来的收益将是由他们实现，还是由使用外国公司开发并付费技术的本地公司实现。\n\
  \n#### 实现中国市场的潜力\n\n虽然中国是一个具有巨大潜力的大市场，但实现这种潜力是一个巨大的挑战。中国政府对`50:50`合资企业的要求为新进入者的成功增加了重大的挑战。新市场进入者发现，在中国建立业务所需的时间比在其他地方长得多。此外，管理变成了一个涉及两个完全不同的实体（美国和中国企业伙伴）的复杂协调过程，这两个实体必须整合为了一个实体。与允许外国公司以单一实体身份进入市场，或通过将目标公司积极整合到收购者的并购方式进入市场相比，这会极大地减缓增长。\n\
  \n`GE`在中国的经验是一个经典的案例，说明了一个非常成功的全球公司在试图从中国市场榨取增长时可能面临的挫败感。讽刺的是，该公司在拥有`2300 万`人口的澳大利亚所产生的年收入与其在中国的`13\
  \ 亿`相当。虽然我们强调了人口统计力量的力量，但人口是增长的一个关键决定因素，但远非唯一因素。`GE`在中国和澳大利亚的经历形成了惊人的对比。在商品价格价格上涨的推动下，澳大利亚以及`Canada`和`巴西`等国已成为像`GE`这样的大型工业公司的绝佳市场。除了澳大利亚和中国之间人口的巨大差异外，澳大利亚还是高度发达的自由市场，其增长部分受到中国增长的推动。与高度监管的中国经济相比，市场进入者发现的是一个监管极少且反应积极的经济。虽然中国在经济发展的道路上做了很多正确的事，但政府和监管机构过度扩张的手有时会抑制进步。有一个充分的理由认为，如果没有中央政府的引导和支持之手，中国绝不会在如此短的时间内获得那样的增长和成功。然而，向具有更大消费者部门的更开放、自由经济的转型相当缓慢。政府很难找到这种转型的完美路径和时间表，无论它选择哪条路径，都将不可避免地招来批评。政府过度扩张的手也限制了外国公司在中国进行并购的机会。\n\
  \n在下一节中，我们将看到印度存在着相似但不同的障碍。\n\n#### 印度\n\n印度是人口第二大国，拥有超过`12 亿`人口，近年来增长也令人惊叹，年增长在`7%`到`10%`之间（参见`图\
  \ 7.5`）。虽然世界上许多经济重心比任何其他国家都关注中国，而且这是合理的，但印度也提供了吸引人的机会，但也带来了它自身的问题。\n\n\n\n印度一直受到政府的阻碍，该政府在基础设施建设方面没有像中国那样的投入。其政治体系也因为对贿赂和其他非法活动的打击力度不够，而阻碍了经济增长。当我们对比中国在\
  \ 2008 年奥运会上所取得的巨大公关成功，与仅仅两年后印度在英联邦运动会上所遭受的尴尬时，就能感受到这两种经济体之间的差异。\n\n从表面上看，印度是一个开放得多的经济。它是一个民主国家，而中国不是。遗憾的是，印度饱受腐败困扰，这导致其经济体系无法奖励最高效和最具创新的公司，而是奖励那些愿意向非市场方提供补偿的公司。此外，虽然中国多年前就决定投入巨资发展基础设施，但印度花了很长时间才做出类似的承诺。例如，在过去的\
  \ 20 年里，中国修建了许多英里的新公路和令人印象深刻的现代机场，这使得美国的公路和机场看起来非常古老（在某些情况下，确实如此）。\n\n如果从中国转来看印度，很难发现这个经济体能提供像中国一样多的并购（M&A）机会。即使考虑到孟买和新德里等印度主要城市，它们与北京和上海相比也毫无优势。由于基础设施投资过少且太晚，印度仍然落后。基础设施建设延迟使得印度落后于中国，但正在令人信服地追赶。印度似乎开始更认真地对待发展基础设施的挑战，但还有很长的路要走。\n\
  \n为了充分认识印度的潜力，我们需要考虑印度已经走了多远。印度直到 1947 年才实现国家独立。随后它专注于实现完全的经济独立，摆脱对曾奴役该国家的主要经济体的依赖。因此，印度并没有寻求在自己具有比较优势的领域进行专业化，而是试图在许多主要行业（尤其是重工业）脱颖而出。例如，政府决定不成为钢铁\
  \ `importer` 并出口其可以享受比较优势的产品，而是决定印度应该尝试成为主要的钢铁 `manufacturer`。事实上，钢铁行业似乎是许多政府都视为国家自豪的重点之一。印度在其他几个行业也这样做了，而这种在国家拥有比较优势的领域缺乏专业化（包括许多可以利用其廉价劳动力供应的领域），在经济增长方面让国家付出了巨大代价。这种用政府领导人的自豪感取代自由市场力量的做法阻碍了国家的经济发展。\n\
  \n印度的经济增长近年来明显放缓了。例如，`International Monetary Fund`估计印度 2012 年的增长率将达到 6.9%。这是一个良好的增长，但仍低于某些几年接近双数的增长率。然而，这正处于世界经济增长缓慢的时期——尤其是欧洲。\n\
  \n在评估印度市场的并购前景时，我们需要提醒自己，2011 年，印度的人均收入为 3,627 美元（落后于尼加拉瓜和刚果），而中国为 8,400 美元（落后于厄瓜多尔和突尼斯）。显然，中国市场拥有更大的购买力。中国的并购活动量也比印度大（参见图\
  \ 7.6）。然而，印度的准入障碍与中国不同。并不是没有障碍——而是障碍不同了。在印度，外国进入者可能不会面临与在中国面临的同类型的政府施加的障碍。印度政府没有制定一个像中国那样极大限制外国公司进入市场能力的开发计划。然而，没有正式这样做这一事实，并不意味着不存在某些类似的障碍。\n\
  \n![img](img/n07f006.gif)\n\n**图 7.6**](#chapter07.xhtml__back14) 中国和印度并购（单位：百万美元）\n\
  \n*来源：* Thomson Financial Securities Data.\n\n虽然从并购的角度来看，印度带来了许多机会，但它也带来了一种令人不安的不预测性。这在最近的沃达丰税收丑闻中得到了凸显。沃达丰收购了\
  \ Hutchinson Essar Ltd 67%的电信业务，但震惊地发现，印度税务机关要求作为收购方的沃达丰向卖方补偿其在卖方（即卖方）所获得收益时缴纳的资本利得税！最终，沃达丰通过印度最高法院的一项有利裁决避免了这笔付款。印度所得税部门仍试图通过事后更改法律来继续追缴沃达丰。\n\
  \n法律和监管过程的不预测性影响了印度的大部分经济。与发达国家的发病率和死亡率下降、预期寿命延长的不同，印度的贫困人口（因此也是许多患者）仍然处于令人不安的高水平。印度面临着一个困境：作为一个国家，它从从美国和欧洲制药业的成功中大获其益，这些行业开发出了许多治疗困扰不发达国家疾病的成功药物，但这些疾病在美国和欧洲已得到相对控制。问题是印度是一个贫穷国家，许多可以从这些奇迹药物中获益的患者付不起钱。微观经济学和发展经济学告诉我们，拥有更健康的人口可以是一种公共物品，使工人更有生产力，并减少传染疾病的人数。遗憾的是，印度政府的“解决方案”是拒绝某些西方制药公司对其开发成本极高的药物拥有专利权。例如，2012\
  \ 年，印度专利局命令德国拜耳公司（Bayer AG）向一家当地印度制药公司授权许可，使其能够仿制拜耳的癌症药物 Nexavar。事实上，印度正期望私人外国公司补贴印度的医疗保健。这是印度政府的工作。政府需要意识到药物价格必须反映药物研发的巨额成本，并需要理解成功的药物必须为药物研发过程中许多失败的尝试买单。这些讨论对并购的意义在于，印度政府是不可预测的，这使得印度作为长期外国投资的环境不够稳定。在金融学中，不预测性会降低任何资本投资（包括并购）的预期收益。不预测性越高，在计算交易预测现金流现值时使用的折率中需要嵌入的风险溢价就越大。预测性越高，并购投资回报的现值就越高。在其他条件不变的情况下，较高的投资回报通常会导致更多的并购投资。\n\
  \n\n\n\n#### 印度\n印度是一个不断增长的国家，而增长中的国家需要资本。西方国家的回报率一直处于历史低位，并维持了很长一段时间。印度需要对外资更具包容性，并提供一个稳定的环境，以便外国投资者预期其预测的现金流是稳定的。获得外资将有利于促进印度的增长，但外国投资者需要能够确保他们能够获得丰厚的回报。与中国一样，印度对其经济中的外资也感到不安。这两个国家（但印度尤为如此）正为其无法适应自由市场增长解决方案而付出代价。\n\
  \n印度政府非常清楚地意识到这个问题。2012 年，新德里政府宣布了多项改革，旨在允许更多外资进入，并削减对柴油等产品的低效补贴。这是该国自 1991 年以来实施的最重大的一系列经济改革。这些改革本该早就实施了。然而，这些改革是否有效仍有待观察。这些改革受到一些人的强烈反对，他们担心小微企业（尤其是零售行业企业）将受到如\
  \ `Walmart` 这样大型外国竞争对手的不面影响。尽管如此，这种反对可能只会延迟而非停止印度实现这一国家巨大潜力的道路。\n\n### 东南亚市场\n当我们把从中国和印度移开时，仍然可以发现许多增长良好的大市场。它们虽然比中国和印度小，但对未来蕴含巨大的希望。该地区的国家包括印度尼西亚、菲律宾、马来西亚、新加坡、越南、泰国、缅甸、老挝、柬埔寨和文莱。需要注意的是，整个东南亚经济几年来一直稳步增长，其总量比印度还要大。对该地区各种新兴经济体进行全面讨论超出了本书的关注范围。相反，我们将对几个领先国家作为该地区潜力的案例进行评论。\n\
  \n例如，印度尼西亚和菲律宾拥有庞大的人口，每个国家都带来了独特的机遇。印度尼西亚是一个资源丰富的国家，其真实资源的规模可能仍为人未知。其 25 亿的人口持续增长，使其在未来成为一个更加重要的市场。\n\
  \n印度尼西亚经济在 2011 年和 2012 年增长了 6%。该国正投入巨资建设基础设施项目，如现代高速公路、机场、海港和铁路。如 `GE` 这样的公司已经在享受这些基础设施投资的果实（参见图\
  \ 7.7）。菲律宾也是一个非常有吸引力的潜在并购（M&A）市场。它人口略低于 1 亿。其人民受教育程度高于许多其他新兴市场国家。此外，这对并购非常重要，其法律体系与西方法律体系可比拟。这在产权等问题上尤为如此。那里的人易于相处，并渴望经济发展。菲律宾经济在过去十年中增长良好，投资者对其前景似乎似乎非常乐观，正如其股市相对于\
  \ `S&P 500` 的表现所示（参见图 7.8）。\n\n![img](img/n07f007.gif)\n\n图 7.7 印度尼西亚股市 (JKSE) 对比\
  \ `S&P 500`\n\n*来源：* Yahoo! Finance。\n\n![img](img/n07f008.gif)\n\n图 7.8 菲律宾股市 (PSEI)\
  \ 对比 `S&P 500`\n\n*来源：* Yahoo! Finance。\n\n越南也是一个具有巨大潜力的市场。它拥有近 9000 万人口，尽管有着共产主义背景，政府一直致力于促进外资。事实上，这些努力在某种程度上取得了了成功，使越南能够从其大邻国——中国那里吸引业务。越南确实无法提供像中国那样的规模，但它确实提供了一些有趣的并购可能性。遗憾的是，像许多发展中市场一样，它也有相应的腐败问题，希望随着发展的持续，这些将会减少。（参见图\
  \ 7.9）。\n\n![img](img/n07f009.gif)\n\n图 7.9 越南股市 (VN-Index) 对比 `S&P 500`\n\n*来源：*\
  \ Yahoo! Finance。\n\n### 澳大利亚\n我们已经讨论了澳大利亚经济的一些积极特征。它只是世界上人口第 5 十的国家，有 2300 万人。因此，它的规模与我们讨论过的一些大型亚洲国家完全不同。然而，89%的人口住在城市地区，使其成为世界上城市化程度最高的国家之一。此外，经济极大受益于大宗商品出口，而这个规模较小的经济体资源丰富。这些出口中很大一部分是往中国的，中国对许多大宗商品有着似乎无尽的需求。有些人将澳大利亚经济描述为“从地里挖出东西并卖给中国”的经济。虽然这可能是幽默的（且部分真实），但它忽略了澳大利亚经济的许多积极特征。该国拥有高度发达的自由市场经济，这使得它对新进入者非常有吸引力。澳大利亚的自由排名排名\
  \ 2.5，位居世界第三，仅次于香港和新加坡，领先于邻国新西兰。\n\n正如我们提到的，`GE` 在巨大的中国市场投入了大量资金和时间以实现重大增长。到 2012\
  \ 年，公司意识到仅凭人口统计不足以确保良好的投资回报。对比的是，澳大利亚对大宗商品的巨大需求为 `GE` 提供了与中国经历相比相当且无苦恼的回报。`GE` 绝不会离开中国，但它对这个巨大的市场有现实的预期，并将公司的市场视为全球，包括非洲等许多较小但增长中的国家，这些国家在过去没有获得美国集团的这么多关注。\n\
  \n### 中美和南美\n该地区最大的两个经济体无疑是巴西和墨西哥（参见表 7.2）。巴西一直是全球领先增长市场之一。其丰富的自然资源使其能够很好地利用全球范围内高增长市场（如中国）对这些资源的需求。它是该地区远为领先的国家经济体。问题是：哪些其他国家可能为外国公司提供增长并购机会？\n\
  \n| 排名 | 国家 | 2012 年实际 GDP |\n| --- | --- | --- |\n| 1 | 巴西 | 1159 |\n| 2 | 墨西哥\
  \ | 1000 |\n| 3 | 阿根廷 | 284 |\n| 4 | 哥伦比亚 | 203 |\n| 5 | 委内瑞拉 | 186 |\n\n**表 7.2](#chapter07.xhtml__back19)**\
  \ 拉美最大的经济体（以 2005 年美元计）\n\n*来源：* 世界银行世界发展指标、国际货币基金国际金融统计以及 IHS Global Insight。\n\
  \n![img](img/table_image_001.gif)\n\n**表 7.3** 实际 GDP 年增长百分比对比。\n\n*来源：* 国际货币基金组织，《世界经济展望数据库》，2012\
  \ 年 10 月。\n\n\n\n\n\n墨西哥的并购（M&A）活动与巴西有所不同。在巴西，我们看到外国公司在交易活动方面与当地公司大致不上下。而在墨西哥，并购活动更多由当地公司主导。当我们关注重点从巴西和墨西哥转向其他地区时，并购活动会大幅下降。下一个大大的并购市场是智利，其次是哥伦比亚和阿根廷。\n\
  \n### 巴西\n\n经济增长为国内和外国公司提供了许多并购机会（除中国等刻意抑制此类机会的国家外）。巴西也也不例外。然而，为了妥善评估一个国家的并购前景，必须分析增长的来源，并判断这种增长会持续下去还是昙花一逝。尽管巴西曾是南美和中洲增长最快的主要国家，但这一纪录在\
  \ 2011 年被打破了。2011 年和 2012 年，墨西哥的增长超过了巴西。\n\n巴西的大部分增长可以追溯到大宗商品市场以及来自中国等快速增长国家对这些产品的衍生需求。当中国增长放缓时，巴西的增长也随之缓慢。巴西并不是一个坐以待毙的国家，它采取了积极的财政和货币政策，试图重回失去的动力。与中国相似，巴西政府在努力促进增长方面发挥了非常活跃的作用。然而，政府对经济的普遍参与也带来了相应的经济负担。这些负担表现为高税收和全球政府固有的低效，以及受保护行业中的低效问题，这使得它们在全球市场上的竞争力有所下降。\n\
  \n当巴西经济开始受到因欧洲债务危机加剧的全球增长放缓的影响时，政府实施了刺激计划，试图抵消全球需求的下降。然而，经济史的学习者会记得，巴西在 20 世纪 60\
  \ 年代末和 20 世纪 70 年代初也推行过类似的政策，但其效果是短暂的。\n\n1964 年，巴西民民政府被右翼将领推翻。为了安抚现在处于军事统治下的民众，政府开展了大型基础设施投资项目并提供了便利的贷款。这些政策与该国近期低迷时期遵循的政策十分相似。希望这不会与\
  \ 20 世纪 60 年代末和 70 年代初巴西经济繁荣产生相同的后果，那次繁荣在 1973 年油价快速飙升后崩溃了。正如许多人为诱导的扩张一样，这种扩张也是短暂的。该国留下了经济停滞和高通货膨胀——这是任何货币经济学学生都会预料到的结果。\n\
  \n巴西的并购市场及其整体经济受到其国家社会经济发展银行（National Bank for Social and Economic Development）的影响。这家总部位于里约热内卢的银行贷款额远超世界银行在全球的贷款。它资助了大型基础设施项目，还持有许多大型私人公司的少数股权，例如\
  \ `JBS`——全球最大的肉类供应商。在国家银行注资的支持下，巴西公司利用这些资本成为了全球巨头。此外，一些大型国有企业的养老基金也为巴西公司提供投资资金。这些政策得到了前总统路易斯·伊纳西奥·卢拉·达·席尔瓦（`Lula`）及其继任者迪尔马·罗塞夫（`Dilma\
  \ Rousseff`）的全力支持。这种贷款让巴西公司有财力击败缺乏此类政府支持的全球对手。然而，这些政策未能阻止经济放缓，其是否能够抵消全球经济的巨大力量仍待观察。\n\
  \n有几个理由相信，巴西“第二次经济奇迹”的终结将是短暂的。在过去的民选政府时期，恩里克里克·卡尔迪索（`Henrique Cardoso`，1995–2002）、路易斯·伊纳西奥·达·席尔瓦（`Lula`，2003–2010）和迪尔马·罗塞夫（`Dilma\
  \ Rousseff`，2011 至今），政府通过转移计划在分享国家日益增长的财富方面做得。此外，该国拥有日益增长的中产阶级，这为国内外进入者提供了极具吸引力的市场。\n\
  \n### 墨西哥\n\n对于位于北美的公司来说，墨西哥是一个非常有趣的经济体。墨西哥制造业极大促进了该国家的增长。墨西哥的增长并没有像大宗商品增长或来自中国的需求那样被人为膨胀。考虑到这些因素，墨西哥的前景是非常有趣的。我们用“有趣”而不是自动的“乐观”，是因为墨西哥仍然受到其令人困扰的犯罪问题的困扰——特别是登上美国新闻头条的毒品相关杀案。其他拉丁美洲经济体在控制这个问题上做得更好——或者至少压制了此类犯罪所造成的负面公众形象。我们并不是要暗示这个问题全是墨西哥的错，因为对非法药物的需求主要来自墨西哥的北方邻国——美国。\n\
  \n中国庞大的制造业得益于其庞大的劳动力，在过去，这些人愿意接受较低的工资，使中国能够将产品出口到欧洲和美国，并能轻松克服高昂的运输成本。例如，1978 年，中国的平均工资是美国制造业工人平均工资的\
  \ 3%。然而，近年来，中国的工资一直在快速增长。\n\n正如我们在经济学基础中学到的，随着中产阶级预期的提高，工资需求也随之增加。此外，中国经济的整体通胀（包括房价）推高了工资需求。中国出口导向型经济的问题为墨西哥等国家创造了机会。\n\
  \n到 2012 年，中国和墨西哥之间的工资差距缩小到中国工资是墨西哥工资的 85%。此外，中国工资每年增长 6%左右，而墨西哥则保持平稳甚至下降。考虑到墨西哥对美国、加拿大以及南美的出口具有显著的运输成本和交付时间优势，前景看起来是乐观的。此外，墨西哥还受益于《北美自由贸易协定》（`NAFTA`），为墨西哥带来了进一步的优势。\n\
  \n我们已经看到墨西哥汽车等特定行业的制造业和出口取得了巨大增长。半年前，墨西哥还不是汽车出口国十大之一。截至 2012 年，它位居日本和德国之后，排名第四，之后是韩国。大众（`Volkswagen`）、日产（`Nissan`）和本田（`Honda`）等制造商已经在墨西哥建立了大量的制造业务。事实上，墨西哥相对于其南美竞争对手具有巨大的成本优势，以至于某些国家如阿根廷（一个从未享受过任何自由贸易的国家）和巴西对来自墨西哥的汽车进口施加了限制。这很遗憾，因为对于那些模糊熟悉经济学基础课程知识的人来说，他们知道这种自由贸易对于墨西哥工人以及巴西和阿根廷的消费者来说都是双赢。\n\
  \n尽管墨西哥拥有所有吸引人的属性，但它在吸引外国投资方面并不成功。`图 7.10` 显示，不仅中国的外国投资金额（考虑到规模差异，这是预期之中的）远大于墨西哥，而且中国的趋势是急剧上升的，而墨西哥的趋势平平且有时下降。如果墨西哥及其并购市场要实现实质性增长，这种情况必须发生变化。\n\
  \n![img](img/n07f010.gif)\n\n**图 7.10**\n\n\n\n\n\n*来源:* INEGI（墨西哥 FDI）；商务部（中国 FDI）；《华尔街日报》，2012\
  \ 年 9 月 17 日。经《华尔街日报》许可转载。版权 © 2012 Dow Jones & company, Inc. 全球保留。许可号 3041501494032。\n\
  \n### 阿根廷\n\n阿根廷是一个引人的经济故事。这个国家多年一直陷入经济停滞。其政府体制阻碍了国家的增长。这确实令人遗憾，因为多年前阿根廷是增长最快的经济体之一——与今天的巴西相似。该国拥有巨大的潜力，但这些潜力持续未能实现。可能导致这一失败最大的因素是政府对经济的无能干预。\n\
  \n自 1980 年以来，阿根廷债务违约三次！考虑到该国在欧洲经济危机背景下的地位，阿根廷的经济故事非常迷人。1998 年至 2002 年间，`IMF`强烈压力该国实行财政紧缩并削减政府支出，它也确实做到了。经济急剧收缩。最后，在克里斯蒂娜和内斯托·基尔内尔的领导下，国家改变了方向，提高了进出口税（这通常不是一个好的经济主意），并利用收益资助基础设施投资和社会计划。这发生时，该国恰好获得了大宗商品泡沫的红利。结果是经济增长提高、失业率下降，但遗憾的是，政府支出占\
  \ GDP 的比重更高。\n\n阿根廷经济受到基尔内尔夫妇社会主义政策的阻碍。尽管如此，克里斯蒂娜·基尔内尔在 2011 年再次当选新的四年任期。人们很难相信任何官方经济数据，但似乎经济增长再次陷入停滞，通胀正在上升。一段时间内，大宗商品价格上涨（部分受联邦储备量化宽松政策的推动）帮助了经济。然而，如果大宗商品价格大幅走软，这种情况很容易发生变化。尽管如此，阿根廷政府的过度扩张使得这个国家在利用`M&A`追求增长时是一个具有一定风险的国家。该国对外国投资采取的不利立场进一步凸显了这一点。收购`Respol`的子公司`YPF`就是一个典型的例子。这种情况在随后的案例研究中得到了重点介绍。\n\
  \n### 中欧和东欧\n\n当我们想到中欧和东欧的增长机会时，逻辑上第一个想到的国家是`俄罗斯`。作为四个原始`BRICS`国家之一，这是逻辑性的。然而，该地区还有许多国家也可能提供有趣的增长机会。我们将简要介绍该地区的一些机会。\n\
  \n#### 俄罗斯\n\n到目前为止，该地区的主导国家是`俄罗斯`。俄罗斯联邦的`GDP`和其`M&A`规模远超该地区的其他地方。然而，与许多其他经济体一样，俄罗斯也面临着其独特的挑战。经济深受油价等商品成本的影响。高油价意味着更大的财富和对`M&A`的需求。当油价较低时，经济要弱得多，因此`M&A`规模较低。此外，俄罗斯石油的成分决定了它需要比其他国家的石油更高的价格才能在精炼中盈利。\n\
  \n至于`M&A`，曾有许多外国公司进入俄罗斯市场，却因为腐败和其他非法活动损失了投资。前`KGB`中校军的弗拉基米尔·普京对国家持续的直接和间接控制也阻碍了经济发展。外国公司可能会被市场和俄罗斯消费者的潜力所吸引，但往往因为该市场呈现的独特风险而害怕在该市场投资。这一点在近期投资者对俄罗斯巨大的政府控股石油公司`Rosneft`及其在\
  \ 2012 年收购`BP`的俄罗斯合资企业`TNK-BP`的反应中得到了强调。`BP`更优的管理使得`TNK`比效率较低且受克里姆林控制的`Rosneft`更高效。`Rosneft`追求`TNK`（俄罗斯第三大石油公司）的收购，部分是为了从`TNK`更好的管理中受益。人们担心的是`Rosneft`由于其与政府的关系而导致的低效，是否会污染`BP`所建立的管理实践。值得赞赏的是，当欧洲大部分地区处于应对主权债务危机的经济低迷时，俄罗斯经济在某种程度上免受这些麻烦的影响。这从该国在此期间相对低的失业率中看出（参见图\
  \ 7.11）。如果这个国家能为外部人士提供更多的政治和监管确定性，它对外国投资和`M&A`将显示出更多的前景。这也为该国家带来巨大的回报，因为它减少了对石油的依赖——从长远来看，是一种枯竭性资源。\n\
  \n![img](img/n07f011.gif)\n\n**图 7.11**](#chapter07.xhtml__back22) 2012 年 11 月失业率对比\n\
  \n*来源:* 美国劳工统计局 (BLS)、欧盟统计、英国国家统计局、[OECD.org](http://OECD.org)。\n\n#### 土耳其\n\n\
  土耳其一直是该地区的增长故事。土耳其市场比`俄罗斯`小得多，但增长更快，且不那么依赖大宗商品价格等波动因素。事实上，这导致土耳其成为全球市场流动的某些“热钱”的目标。这些热钱的流动部分归因于`美国联邦储备体系`等央行推行的量化宽松政策。有趣的是，`巴西`以及程度较小的`土耳其`都采取了限制此类资金流入的措施，以避免资金快速增加引发通胀压力。这些通胀压力产生是因为经济产出无法对这种突然的资金流入做出足够反应，从而导致需求性通胀。截至\
  \ 2011 年底，土耳其经济像世界上许多其他国家一样放缓了，并面临衰退风险，这部分是由于该国为放缓经济所采取的步骤。这对土耳其来说是一个更主要的问题，因为它没有`巴西`那样的深度商品出口需求。尽管如此，土耳其为外国投资特别是`M&A`提供了非常有趣的机遇。\n\
  \n### 非洲\n\n虽然对非洲市场潜力的全面讨论超出了本书的范围，但如果我们至少不对非洲市场的潜力发表一些简短评论——特别是撒撒哈拉以南非洲。这一区域包括除了通常与阿拉伯世界分组的北非洲以外大部分非洲。这个广大的地区由许多拥有大量人口的国家组成——其中一些似乎处于以比过去更有意义的方式追求经济增长的边缘。多年来，这些国家在贫困中挣扎，并由腐败无能的领导人统治。迹象表明这一切正在改变。几个非洲国家拥有未开发的资源。随着全球需求的增长，开发这些资源的压力将随之而来。这反过来又为这些资源丰富的非洲国家有效解决其巨大的基础设施和政治腐败问题创造了自然压力。这些问题的解决正在取得进展，尽管缓慢。^(10)\n\
  \n\n\n\n过去几年，撒哈拉以南非洲经济体的增长率大致维持在 5% 左右。我们在其他增长型新兴市场看到的许多趋势，如中产阶级的崛起和城市化进程的大幅加速，在该地区也在发生。\n\
  \n当几大型私募股权公司（如 `Carlyle Group`）建立专注于该地区的投资基金时，非洲的潜力得到了凸显。然而，从并购（M&A）的角度来看，现在关注该地区还为时过早，因为我们首先需要更快速的经济增长，然后关于并购方面会有更多讨论空间。尽管如此，如果在不遥的未来没有出现更大的并购机会，那将令人感到惊讶。\n\
  \n### 新兴市场的风险\n\n对于许多来自发达市场的成熟公司而言（即拥有非常成熟的品牌和高消费者知名度的公司），充分利用快速增长的新兴市场来跟上公司的增长速度是极有意义的。坦率地说，正如我们指出的，`新兴市场`这一名称不应适用于许多被持续使用该术语的关键市场。如中国，以及程度较小的印度和巴西等市场，与其被称为`快速增长市场`不如被称为新兴市场更准确。它们已经出现，而且是很久以前就出现了，但仍在快速增长，而它们较早开发的对应对手增长已显著放缓。\n\
  \n虽然新兴市场可以提供极具吸引力的增长可能，并帮助发达国家停滞的公司尝试重启增长，但这种增长伴随着一系列独特的风险，这些风险在母市场并不存在。例如，考虑许多通过反收购在美国上市的中国公司。当发现这些公司的良好业绩记录是伪造的，且会计标准有时不存在或纯粹是虚假的时，许多投资都泡汤了。在俄罗斯，一些投资者目睹非法活动破坏了其投资的价值。我们已经讨论过\
  \ `Vodafone` 对 `Hutchinson Essar Ltd` 67% 电信业务的收购，其中 `Vodafone` 被要求向卖方支付资本利得税。\n\
  \n发达国家的公司在过度关注新兴市场扩张时面临的风险之一，是它们可能会忽视其主要的本国市场。同时在多个新兴市场进行激进扩张通常需要巨大的管理努力。有时，公司会将自己在本国市场的强力地位视为理所当然。这可能为外国竞争对手打开大门。近年来，英国杂货公司\
  \ `Tesco` 正面临这种这种情况。该公司面临着停滞的英国市场，而该国在经济非常疲迷时（错误地）追求财政紧缩。它将增长路径视为向中国、中欧和土耳其等高增长市场扩张。事实上，这正是\
  \ `Tesco` 的主要竞争对手（如 `Walmart` 和 `Carrefour`）正在做的。`Tesco` 努力在这些其他市场实现增长，而其中一些相同的竞争对手（如\
  \ `Walmart` 以及 `J. Sainsbury`）开始在英国抢夺 `Tesco` 的销售额。到 2012 年底，该公司决定缩减在中国的扩张，离开日本和美国市场。2012\
  \ 年，它还宣布耗资 16 亿美元以复兴其英国业务。\n\n![img](img/n07f012.gif)\n\n**图 7.12** Tesco 英国同店销售额\n\
  \n*来源：* 改自 Paul Sonne 的《Tesco 丧失了增长意欲》，*《华尔街日报》*2012 年 11 月 10 日，B3 版。\n\n对于困于停滞母市场的公司来说，新兴市场可以提供巨大的机会。然而，当此类公司追求新兴市场扩张时，非常重要的是它们不要在失去对母市场关注的同时进行，因为母市场可能代表了公司业务的大部分。\n\
  \n### 进入大型低速增长市场，而非快速增长的新兴市场\n\n我们在上一节中讨论过的 `Tesco` 在试图从巨大但成熟的美国市场获得收益的挣扎，凸显了进入一个已有主要竞争对手的成熟市场的挑战。`T\
  \ Mobile` 在进入美国移动市场时面临着类似的挑战，无法与 `AT&T` 和 `Verizon` 竞争。考虑德国邮递公司 `Deutsche Post AG`\
  \ 的例子，它寻求进入美国——全球最大的经济体和最大的包裹交付市场。从表面上看，这似乎非常有道理。要在那里寻找增长机会，那么在全球最大的市场应该有更多这样的机会——对吧？未必一定。\n\
  \n1998 年，`Deutsche Post` 收购了 `DHL Worldwide Express` 的股权。随后在 2003 年，`DHL` 以 10.5\
  \ 亿美元收购了 `Airborne Express`。这些都是美国递送市场中的知名品牌。然而，`Deutsche Post` 从未在美国业务上取得成功。在某种程度上，它的失败凸显了处于第一或第二位置的优势。`United\
  \ Parcel Service` 和 `Federal Express` 占据了美国市场约 70% 的份额。像 `Airborne` 这样的公司在尝试成功方面做得很好，但从未进入过前二。然而，`DHL`\
  \ 和 `Airborne` 都是美国市场的主要参与者，收购经过证明的公司似乎是在在巨大的美国市场成功扩张的一种方式。遗憾的是，这些公司也证明了它们无法与前两名——`UPS`\
  \ 和 `FedEx` 有效竞争。`DHL` 在国际市场上拥有非常成功的地位，但在美国只是一个小玩家。\n\n前两名公司 `UPS` 和 `FedEx` 的激进努力证明对于这家德国邮递公司来说是难以负担的。2008\
  \ 年，它宣布将缩减其美国业务。\n\n这次并购失败有几点教训。第一，仅仅在你的本地市场强大并不意味着你可以在海外取得成功。第二，前两名公司通常拥有巨大的优势，收购一两个后追随者可能并不值收购价格。第三，进行失败的收购代价非常高，成本往往超过购买价格。收购方的管理层绝不想承认一项重大的战略努力和并购是一次巨大的失败。这就是为什么此类公司经常会向一个失败项目投入更多资金，希望它能扭转。`Daimler`\
  \ 对 `Chrysler` 的收购以及这次失败并购给 `Daimler` 带来的成本是另一个例子。\n\n### 降低国家并购风险：投资参与大规模新兴市场并购的本地公司\n\
  \n\n\n\n\n那些希望获得股东收益，并从增长较快的新兴市场中获得多元化收益的投资者，可能可以在不承担全部并购（M&A）风险的情况下实现部分此类收益。尝试“既要鱼又要网子”的一种方法，是让投资者投资于发达市场中积极寻求新兴市场并购的大公司。这可以显著降低风险。像美国这样发达市场的大公司必须遵守更严格的会计标准，并接受大量投资者和分析师的严密审查。新兴市场中知名度较低的公司则不必面对此类审查，因此在\
  \ `ceteris paribus`（在其他条件不变）的情况下，其风险更高。因此，当发达市场的大公司追求新兴市场并购时，它们能够加速增长并从而维护股东利益，但同时也可能帮助其股东实现低风险的国际投资组合多元化。卡特彼勒（Caterpillar）就是一个在这方面做得非常成功的公司案例。\n\
  \n### 在高增长市场中寻找增长\n\n正如我们讨论过的，当一个企业在某个市场耗尽了增长潜力，且许多竞争对手在同一市场中激烈争夺份额时，实现真正的增长是一项挑战。通常，增加增加营销支出仅仅为了获得一些增长，甚至只是为了维持公司的现状。20\
  \ 世纪 90 年代和 21 世纪，许多美国、欧洲以及日本公司面临的就是这种情况。在美国汽车行业，情况更为糟糕。美国主要的汽车制造商饱受质量问题的困扰，并由于必须承担僵化工会——美国汽车工会（`UAW`）施加的高昂人工成本负担而处于竞争劣势。以下关于通用汽车（GM）的案例研究描述了一家病态的公司如何在全球增长最快的市场——中国找到成功和增长。\n\
  \n### 新兴市场收购者\n\n新兴市场收购者的兴起是一个较新的现象，因为直到过去 10 到 15 年，我们才看到新兴市场公司对发达国家公司的大收购。然而，这种类型的并购已变得越来越常见。例如，我们看到某些印度大公司，如\
  \ `Tata Group`（塔塔集团）和 `Mittal`，进行了多次收购。`Tata Group` 在 2007 年以 107 亿美元收购了英国钢铁制造商\
  \ `Corus` 就是一个例子。具有印度裔背景可能会发现其中的讽刺意味：一家大型印度公司收购了一家大型英国公司，而大约半个世纪前，印度还处于英国的控制之下，且在二战结束后英国帝国崩溃之前，英国正推行帝国主义政策。这是一个殖民地收购殖民者的案例。\n\
  \n`Tata Group` 是一家全球性性集团，直到最近一直由 `Ratan Tata` 管理。这位以正直著称的人士监督了一项国际收购计划，将 `Tata Group`\
  \ 造成了一个国际化企业帝国。`表 7.4` 显示了 `Tata Group` 的一些重大收购。回顾这些交易清楚地显示了它们的多样性。\n\n![img](img/table_image_002.gif)\n\
  \n**表 7.4** 塔塔集团最大的收购。\n\n*来源：* `Tata Group`：`[www.tata.com/htm/Group_MnA_YearWise.htm](http://www.tata.com/htm/Group_MnA_YearWise.htm)`。\n\
  \n在 `第 4 章` 中，我们讨论了多元化策略，并对集团公司结构的有效性提出了质疑。人们不禁想，在卖茶叶（`Tetley` 品牌）与钢铁、汽车的制造和营销之间是否真的存在协同效应。在同一个企业集团伞下拥有如此多样化的业务，似乎有些牵强。虽然像\
  \ `Tata Group` 和 `Mittal` 这样的公司作为印度自豪的伟大象征脱颖而出，且这些巨型集团与世界领先公司匹配得非常有利，但至少在 `Tata\
  \ group` 的集团结构上，人们不得不怀疑这种多元化的并购计划是否合理。\n\n`Tata Group` 的集团化结构与 `Mittal` 更精简且具有战略性的重点形成了鲜明对比，正如我们在\
  \ `第 5 章` 中讨论过的，它现在是 `Arcelor–Mittal`。`Mittal` 是一家钢铁公司，其扩张是通过在公司核心关注领域进行并购完成的。该公司已跳出水平扩张，参与了一些纵向整合交易，这将使其获得更具可靠性的投入品数量和定价。然而，`Arcelor-Mittal`\
  \ 是一家非常专注的公司，而 `Tata Group` 是一个业务广泛的集团。\n\n`Tata` 和 `Mittal` 都是非常令人印象的新兴市场收购者，它们最初来自印度，但采取了完全不同的战略路径。只有时间才能证明\
  \ `Tata Group` 的集团化结构能持续多久。它的一大优势是，该公司公司受股票市场压力以及激进外部股东的影响小得多，这些股东可能会迫使公司维持回报或拆分公司。\n\
  \n`Tata Group` 的执权已从 `Ratan Tata` 移给了 `Cyrus Mistry`。他与 `Tata` 家族有亲戚关系，曾为其家族的建筑业务工作，并在其父亲（`Tata\
  \ Sons` 最大股东）那里工作。`Ratan Tata` 与钢铁大亨 `Lakshmi Mittal` 以高尚的正直闻名，而这种品质在瞬息万变的并购世界中有时是缺失的。`Mistry`\
  \ 是否能够在印度经济快速增长和世界经济日益全球化的背景下，有效管理拥有 100 多家公司的 `Tata Group`，仍有待观察。\n\n如果我们不再次评论\
  \ `Arcelor-Mittal` 在中国、尤其是印度市场无法增长的问题，那我们就失职了。`Lakshmi Mittal` 未能预见到中国钢铁产能增长之大、之快。当他利用并购来整合钢铁产能并获得市场份额以及随之购买力时，业务发生了变化，中国变成了巨大的钢铁生产国。随着钢铁产量的增长，`Arcelor-Mittal`\
  \ 所享有的市场份额变得不再那么重要。此外，他从未在母国印度实现过任何真正的增长。考虑到他是世界上最领先的首席执行官之一，我们可以理解在快速变化的全球经济中通过并购实现利润增长所面临的挑战。\n\
  \n\n\n\n\n### 中国企业的全球扩张\n\n中国公司由于各种原因开始了其全球扩张。其中之一是为了获取自然资源。中国的经济增长虽然放缓，但仍然超过了该国从内部获取驱动增长引擎所需资源的能力。例如，`中国石油化工`（也称为\
  \ `Sinopec`）收购了 `Conoco Phillips` 在加拿大 `Syncrude` 项目的股份。`中石`已经收购了 `Total` 在 `Northern\
  \ Lights` 项目中 50% 的股份，另一家中国巨型石油公司`中国石油`收购了 `Athabasca Oil Sands Corp`。`兖州煤业`收购了澳大利亚矿业公司\
  \ `Felix Resources`。这些只是中国公司走遍世界利用 `M&A` 获取更多资源的少数例子。这些以资源为导向的交易是所谓的第一波中国海外 `M&A`\
  \ 的典型特征。然而，尽管由于中国的资源需求巨大，此类交易仍在持续，但第二轮中国海外 `M&A` 的特征是更更广泛的 `M&A`——而不仅仅是以资源为导向的交易。\n\
  \n### 中国 M&A 的第二轮\n\n第二轮中国海外 `M&A` 交易的例子包括由大型集团 `复星` 完成的一些交易。该公司由上海 `复旦大学` 的四位毕业生创立。其最初的交易在国内进行，包括购买原国有钢铁和采矿公司的股份，但随后扩展到多种业务领域，如出版业和购物中心。今天，它是中国最大的私营公司之一。然而，它也扩展到了中国边界之外，一直在收购其他国家的公司。例如，它收购了法国旅游公司\
  \ `Club Med` 10% 的股份，或收购了希腊珠宝饰和时尚公司 `Folli Follie` 的股份。`复星` 的方法并不是寻求控制权，而是为了投资目的收购目标公司的股份。鉴于这些股权通常不是控制性股权，它们通常不会遇到像其他交易那样遭遇的当地政府阻力，例如\
  \ `华为技术` 所追求的交易所遭遇。\n\n随着中国经济的增长以及收入和消费支出的增加，对收入弹性更大的商品也将随之增加。中国消费者通常非常注重品牌，并要求高端欧洲和美国产品。这导致一些资金充裕的公司追求我们可能说的第三轮中国\
  \ `M&A`。这些公司生产的产品未来在中国可能有巨大的需求。一个例子是国有企业 `山东重工集团`，它在 2012 年收购了意大利豪华游艇建造商 `Ferretti\
  \ Yachts`。这是一个双赢的例子，因为它使 `山东` 能够为日益富有的中国消费者提供来自高质量制造商的豪华游艇。它也让意大利卖家在欧洲经济需求、特别是 `M&A`\
  \ 需求非常低迷时出售了公司。\n\n中国公司还在试图做西方经济体一直在中国试图做的事情——为它们的产品寻找新市场。一个例子是 `联想`，它收购了 `IBM`\
  \ 的 PC 业务。该公司随后能够利用其天然的成本优势，与 `HP` 等美国 PC 公司的高昂成本进行竞争。它还通过 `M&A` 扩展到全球。例如，在 2011\
  \ 年，它以略低于 10 亿美元的价格收购了德国电子制造商 `Medion`。\n\n## 挑战与阻力\n\n某些中国公司在美国扩张方面遭遇了比其他公司更多的阻力。特别是\
  \ `华为技术` 一家公司，由于其被指控与中国军和中国政府有关，引起了比任何其他中国公司都多的负面关注。例如，它在 2011 年对 `3 Leaf Systems`\
  \ 的收购并未获得 `美国外国投资委员会` (`CFIUS`) 的好评。`华为` 还因被指窃窃技术而遭受了反弹，许多人认为这种行为比其他中国公司极端得多。这损害了该公司在美国这一大型市场销售电信设备的努力。\n\
  \n然而，`华为` 的案例在某种程度上是一个例外。当我们考虑到 `美国` 经济增长缓慢，加之美国投资率不尽如人意，外国投资本应该比现在更受欢迎。在某种程度上，这是一个公关问题，潜在的中国收购者可以处理得更好。事实上，鉴于美国和欧洲疲软的劳动力市场，中国投资在这些增长缓慢但巨大的市场中创造就业的潜力尚未被中国收购者充分解释。事实上，这种对出售公司经济显而易见的利益被中国交易决策者所忽视了。人们会认为这在未来可能会改变。\n\
  \n## 未来展望\n\n中国 `M&A` 的动力不仅来自寻找资源，还来自寻找中国产品的新市场——特别是那些让中国公司利用较低劳动力成本的产品。消费部门在 GDP\
  \ 中的占比远小于美国等大多数发达国家的事实，使得中国公司必须在本土市场之外追求需求。然而，随着中国通胀压力上升和工人要求更高的工资，中国想要获得相对于西方公司的竞争优势将变得更加困难。我们说是更加困难，但这仍然是非常可以实现的。\n\
  \n### 第 8 章\n\n## 合资企业和战略联盟作为 M&A 的替代方案\n\n本书的重点一直是公司如何通过战略合并与收购 (`M&A`) 实现增长。当我们分析公司可能从\
  \ `M&A` 中获得的收益时，还必须考虑是否存在更低成本的替代方案可以实现相同的目标。正如我们将看到的，合资企业和战略联盟通常是 `M&A` 更廉的替代方案。然而，它们具有重大的局限性。在某些情况下，例如制药行业，它们可能比\
  \ `M&A` 效果更好。在其他情况下，它们的局限性太大，无法实现预期利益。因此，对这些 `M&A` 替代方案进行简要讨论是有用的。\n\n在合资企业中，两或多家公司结合资产并共同工作以实现特定的业务目标。与\
  \ `M&A` 的时间跨度无限不同，在合资企业中时间通常是定义且有限的。但在某些情况下，例如被私募股权公司收购，竞标者心中是希望在这一期限内退出交易并转手目标。\n\
  \n参与合资企业的公司保持各自独立的业务运营，并像在成立合资之前一样继续独立存在。该合资企业随后正式创建为一个业务实体，如独立的公司或合伙企业。参与者之间的正式协议规定了各自对合资企业活动的控制程度，以及参与实体利润或亏损的比例。据推，这将是每个人都可以遵循的评估合资企业实现目标进展的路线图。\n\
  \n\n\n\n\n另一个近期且高知名度的合资企业是米勒高斯（Miller Coors）。该合资企业由 SAB Miller 和莫森高斯酿酒公司（Molson\
  \ Coors Brewing Company）于 2007 年底成立。在成立时，这两家公司是仅次于百威（Anheuser-Busch）的美国第二、三大酿酒厂。成立合资企业的目的是共同营销这两家公司著名的啤酒品牌，其中包括\
  \ Miller、`Miller Lite`、`Coors`、`Coors Light`、`Molson` 和 `Blue Moon` 等其他品牌。SAB Miller\
  \ 和 Coors 仍保持独立运营，但能够从在美国对这些多种啤酒品牌的联合营销中获益。\n\n# 合同与合资企业\n\n考虑建立合资企业的公司需要确定其目标是否可以通过更简单的安排来实现。其中一种替代方案是仅仅签署一份合同协议。例如，与其建立一个合资企业来开发并向其中一个合资参与方供应特定产品，不如与对方签订合同，在产品开发成功后购买该产品。然而，尽管这看起来更简单，但可能无法执行。开发者可能没有资金来承担此类开发。如果另一方同意出资开发，它可能希望保留产品及其未来营销的所有权。它也可能不希望失去该产品带来的竞争优势，并且不希望其被卖给自己的竞争对手。当我们面临这一系列问题时，合资企业虽然相比简单的合同是一个更耗时且工作强度更大的过程，但可能更好地实现最终目标。\n\
  \n### 合资企业与战略联盟的潜在问题\n\n合资企业和战略联盟可能会产生许多潜在问题。它们绝不是解决并购（M&A）弊端的的良药，也无法实现许多并购的目标。从这一点可以显而易见：我们仍然在进行大量的并购，如果合资企业和战略联盟是解决方案，我们将会看到更多此类形式的交易，而不是并购。\n\
  \n合资企业的潜在问题与合资企业的类型各不相同。它们可能会失败，因为合资伙伴之间的合作并不愉快。参与者之间可能存在分歧，这些分歧可能会阻碍合资企业目标的实现。合资企业可能要求参与者共享知识产权或其他专有知识，而他们可能不愿这样做，或者一个合资伙伴使用此类信息并非另一个合资参与者的本意。参与者可能认为自己的投入程度不如如果合资活动是整体业务的一部分时那样充分。这种投入的缺失可能会防止合资企业实现其目标。其他问题可能是合资企业根本没有实现其设定的目标。我们将看到，许多这些相同的问题也出现在战略联盟中。\n\
  \n# 合资企业对股东财富的影响\n\n尽管合资企业可能会出现问题，但市场对其成立的反应通常是正面的。现在让我们来探讨合资企业的平均股东财富效应。\n\n研究文献表明，并购对收购方的股东财富的影响并不尽如人意。当公司宣布进行收购时，市场往往会做出负面反应。然而，正如我们在第\
  \ 10 章中看到的，当公司宣布出售时，市场反应往往是正面的。合资企业通常也是如此。此类交易往往受到市场的青睐。对合资企业股东财富效应的研究将这些交易描绘了积极的形象。\n\
  \nMcConnell 和 Nantell 对 1972 年至 1979 年期间涉及 210 家美国公司的 136 个合资企业进行了研究（(1)）。他们研究的合资企业来自不同的行业。代表性最高的是房地产开发（13%）和电视与电影业（10%）。他们的方法是典型的短期事件研究法，即观察市场对合资企业公告的经调整后反应。事件研究期集中在公告发布的三天窗口内。与并购的对比研究一样，这项研究试图捕捉市场对合资企业对股东长期影响的评估。\n\
  \nMcConnell 和 Nantell 的研究显示，进入合资企业的公司股东在公告期间获得了等同于 0.73% 的正面回报。当从样本中剔除某些占比过高的行业（如房地产）时，结果也是类似的。这一点很重要，因为作者想要确定结果是否真的由某一个主导行业驱动的，从而并不能反映合资企业普遍的效用。事实上，他们发现股东财富效应在合资参与者之间分布得相当均匀。当作者试图将那个看似很小的百分比收益转换为美元金额时，他们发现这对应于平均\
  \ 480 万美元的价值，对于上市公司来说，这听起来并不大，但必须记住，这一结果适用于 20 世纪 70 年代的合资企业。按 2013 年的美元计算，该金额相当于\
  \ 2100 万美元。\n\nMcConnell 和 Nantell 的研究表明，市场倾向于喜欢合资企业。当我们这些结果与我们过的并购研究相结合时，我们好奇如果公司采取的是合资而不是并购，某些收购方股票的负面反应是否会变成正面。我们有理由相信答案是——可能不是。\n\
  \nMcConnell 和 Nantell 的并不是并不是显示合资企业正面股东财富效应的研究。Woolridge 和 Snow 分析了一个涉及在 102 个行业运营的\
  \ 248 家公司的 767 个战略投资决策公告（(2)）。这些战略投资决策包括合资企业，还包括研发项目和大型资本投资。他们的方法特征是考察市场对这些决策公告的反应。总体而言，他们发现市场对这些各种公告有正面反应。当样本被分为不同类型公告的子样本时，他们确定合资企业公告的股东财富效应是正面的。这些结果与\
  \ McConnell 和 Nantell 的发现一致。\n\n# 按合资类型划分的股东财富效应\n\n我们区分了第 5 章中讨论的水平交易和第 6 章中涵盖的垂直并购。McConnell\
  \ 和 Nantell 的研究并未区分这两种合资企业。这引出了一个问题：垂直合资企业产生的股东财富效应与水平合资企业相当吗？在并购中，我们看到它们通常并非如此。\n\
  \n\n\n\nJohnson 和 Houston 对 1991 年至 1995 年间的 191 家合资企业进行了分析。他们将样本分为垂直合资企业（55%）和水平合资企业（45%）。`Vertical\
  \ joint ventures` 涉及买方与供应商之间的交易。在制药行业，如果一家生物技术药物研究人员与一家药品制造商和营销商建立合资企业，这被视为一种垂直交易。`Horizontal\
  \ joint ventures` 是指涉及同一业务领域的公司。例如，每家公司可以使用合资企业的产品卖给自己的客户，或者创建一个可以卖给同一群体的产出。在钢铁行业，如果两家钢铁制造商建立合资企业来开采铁矿并共同共享采矿作业的产出，这被视为垂直合资企业。\n\
  \nJohnson 和 Houston 的结果显示，合资企业的平均正收益为 1.67%。对于水平合资企业，收益似乎是由合资参与者共享的。垂直合资企业的平均回报率略高，为\
  \ 2.67%。然而，他们在观察垂直样本时，特别有趣的一点是收益并非由双方所有。供应商平均获得了 5%，其中 70% 的回报为正；而买方获得的平均回报仅为 0.32%，这在统计学上并不显著，且仅有\
  \ 53% 的回报为正。对于垂直合资企业，最大的赢家是供应商，他们获取了大部分收益，而市场并未给买方带来主要利益。\n\n我们已经讨论过，合资企业的替代方案不仅是并购（M&A），还有简单的合同安排。Johnson\
  \ 和 Houston 试图阐明合同与合资企业对股东财富的影响。他们分析了一组合同公告样本，发现此类公告具有正的股东财富效应。然而，他们发现，当交易成本较高时，公司会选择合资企业而非合同。他们将这些交易成本称为\
  \ `hold-up hazards`（敲劫风险）。这可能会发生，例如，如果供应商必须针对特定买方进行大量投资，例如为了生产买方的特定产品而投资某些机械和资本货物。虽然合同在期限内可能为供应商提供一些临时保护（因为有收入保证来抵消资本购买成本），但除非这些资本设备可以重新部署给其他买方，否则供应商可能处于脆弱状态。在制药行业，一家公司可能希望协助一家生物技术公司开发新药并提供帮助。然而，一旦药物开发完成，如果它可以被轻易卖给竞争对手，它就会变得脆弱。在这种情况下，正式的合资企业可能效果良好，而简单的合同可能不行。#\
  \ 关联性与规模\n\n当我们分析并购时，注意到多元化交易往往倾向于损害股东价值。此外，两家公司之间的关联性越高，股东财富效应为正的可能性也越大。因此，研究关联性是否在合资企业中也发挥重要作用是合资企业研究的自然延伸。\n\
  \n与并购研究一致（研究显示涉及相关公司的交易比涉及不相关公司的交易产生更高的回报），Koh 和 Venkatraman 发现，对于相互关联性更高的公司，合资企业公告带来的正向股东财富效应更大。此外，他们发现规模较小的合资伙伴比规模较大的伙伴获益更多。这是一个直观的结论，因为相对于其整体业务而言，合资企业对规模较小的伙伴可能意义得多。考虑到规模差异，即使合资成功，对规模较大的伙伴来说可能意义不大，因为其业务范围和量可能要广泛得多。#\
  \ 市场对合资企业风险的评估\n\nJohnson 和 Houston 认为，正向股东财富效应的来源可能是风险分担收益。然而，Denning、Hurlburt\
  \ 和 Ferris 发现，在 1988 年至 1997 年期间，其 271 家合资企业的样本中有 96% 经历了风险变化。虽然公司可能认为合资企业降低了其风险，但这通常不是市场的看法。在研究中，作者确实发现，当合资伙伴是外国公司且合资企业赋予公司在未来感知到收益增加时扩大合资的选择，市场往往会奖励风险的增加。他们发现，合资规模相对于母公司规模越大，合资公司在追求合资之前的利润越高，股东财富效应就越大\n\
  \n# 战略联盟\n\n战略联盟与合资企业的不同在于，与合资企业相比，它们通常反映了公司之间不正式正式的。在合资企业中，我们通常会创建一个新实体，但战略联盟通常并非如此。\n\
  \n战略联盟是两或更多公司之间的协作努力，每家公司都保持其独立。它们本质上是两个法律独立实体之间的合同协议，规定了共享某些互利业务活动的成本和收益。当形成此类联盟是为了促进公司战略目标的实现时，它们被视为战略联盟。\n\
  \n战略联盟在某些行业比其他行业更常见。例如，我们经常在航空、计算机和制药行业看到它们。希望提供比其飞机供应量能处理的更大地理网络航班的航空公司通常选择加入航空联盟。航空公司可以在共享路线的同时保持独立性，从而允许每家航空公司吸引想要旅行超出联盟伙伴限制的乘客。这使得航空公司在乘客看来比其真实规模更大。\n\
  \n在航空联盟协议下，联盟伙伴保持为独立的航空公司但共享航线。这使他们能够留住想要飞越特定航空公司航线范围的客户。每个航空联盟伙伴都可以负责营销整个航线，同一班航班可以在每个伙伴下以不同的航班号进行营销。这被称为\
  \ `code sharing`（代码共享）。通过此类联盟，各伙伴可能能够为客户提供全球网络。此外，当行业内的各种公司形成此类联盟时，这会迫使竞争对手采取行动，以免因网络较小而处于劣势。\n\
  \n\n\n通常，战略联盟是迈向更正式关联的中间步骤。例如，美联（United）和大陆航空（Continental）都是星际联盟的成员，但这种成员身份仅传达了他们寻求实现的部分收益。它允许他们扩大网络，但无法实现合并所带来的成本效益。例如，该联盟实际上并没有提供合并所能产生的那种规模经济潜力。控制成本是航空业盈利能力的关键。因此，尽管许多航空公司使用战略联盟，但趋势已倾向于通过并购与收购（M&A）进行整合，这使得航空公司能够尝试削成本。从美联和大陆航空的角度来看，它们双方都是联盟成员，在\
  \ 2011 年合并后，它们仍然保持了联盟带来的国际航线扩展优势，同时通过合并试图实现某些规模经济。\n\n如果我们不注意这一点，将是失职的：美联和大陆航空在合并后，对这两家巨大航空公司合并的真实成本有了更清晰的认识。公司在预订系统方面遇到了许多问题，随之而来的整合也带来了他们最终克服的挑战。\n\
  \n### 战略联盟流程\n开发战略联盟的过程首先从联盟伙伴对其想要实现的目标进行战略分析开始。如果根据该过程的结果，确定这些目标通过战略联盟可能最好，那么公司将开始寻找联盟伙伴。一旦确定了一个或多个伙伴，将进行初步沟通，随后是谈判。这一过程可能需要投入法律资源来制定所有条款，并在发生纠纷时建立补救措施。例如，伙伴可能会就如何仲裁纠纷达成一般条款，以避免更昂贵且耗时的诉讼。大多数联盟都会在某个时间点终止。因此，这将是特定联盟生命周期中的最后一步。\n\
  \n# 战略联盟对股东财富的影响\n关于战略联盟股东财富效应的研究描绘了一幅非常乐观的图景。Chan、Kensinger、Keown 和 Martin 研究了\
  \ 1983 年至 1992 年期间 345 个战略联盟的股东财富效应。在他们的样本中，近一半涉及营销和分销目的的联盟。对于整个小组，他们发现了等于 0.64%\
  \ 的正异常收益。这与 McConnell 和 Nantell 对合资企业的研究结果具有可比性。Chan、Kensinger、Keown 和 Martin 的研究还未发现联盟伙伴之间存在显著财富转移的证据。这意味着没有证据表明一个伙伴以牺牲另一个伙伴为代价获利。这一结果支持将战略联盟作为并购的替代方案——在合适的有限情况下如此。\n\
  \n# 按联盟类型划分的股东财富效应\nChan、Kensinger、Keown 和 Martin 研究了股东财富效应如何随联盟类型而变化。他们将样本分为水平联盟和非水平联盟。他们将水平联盟定义为涉及相同三位数字\
  \ SIC 代码的伙伴。他们发现，涉及技术转移的水平联盟提供了最高的累计异常收益——3.54%。这可能有助于解释为什么技术导向型公司之间经常发生战略联盟。为了进入新市场而进行的非水平联盟提供了正向但较低的收益——1.45%。其他非水平联盟未能显示出显著的收益。这一结果提醒我们，当公司利用并购扩展到核心业务之外时，其所寻求实现的收益是存疑的。\n\
  \n由 Das、Sen 和 Sengupta 进行的另一项研究还观察了可能成功的联盟类型，这体现在其最初公告的股东财富效应中。他们能够展示公告效应如何随联盟类型以及公司盈利能力和联盟参与者的相对规模而变化。他们发现，技术联盟比营销联盟具有更高的公告收益。这是两种较常见的联盟类型。Hagedoorn\
  \ 在对 4,192 个联盟的研究中此前表明，正如预期的那样，技术联盟在高增长行业中更常见，而营销联盟在成熟行业中更常见。Das、Sen 和 Sengupta\
  \ 还显示，异常收益与联盟伙伴的规模和盈利能力均呈负相关。我们看到市场得出的结论是，规模更大、利润更高的伙伴从联盟中获得的收益较少。换句话说，市场认为规模较小、利润较低的企业与规模更大、利润更高的公司合作具有更大的收益。规模较小且利润较低的公司似乎从战略联盟中获更多。这并不意味着伙伴关系对大公司没有好处。考虑到它们规模更大、利润更高，可以预计当此类公司与较小公司合作时，它们的收益较少，因为该联盟的影响对大公司整体业务的影响较小。那家大公司可能会建立若干此类联盟，所有这些联盟的叠加可能会可能会这种差异减小。\n\
  \n## 注释\n\n### 第 9 章\n## 公司治理在并购中的作用\n并购与收购（M&A）面临的真实挑战之一是做好优质交易并避免糟糕的交易。我们已经讨论过糟糕交易的数量高得令人担忧。诚然，凭借事后之明，那些构思不周并导致重大失败的糟糕并购数量是很难解释的。对于重大交易，即资产规模相对于竞标者具有重要意义的交易，这些交易通常有高层管理以及最重要的\
  \ `CEO` 的建议，然后获得董事会的批准。因此，对于重大交易，这两个利益方（`CEO` 办公室和`董事会`）对交易的成功或失败承担责任。因此，我们将讨论它们在通用的公司治理中所扮演的角色，也专门针对并购的角色。\n\
  \n# 代理成本问题\n\n\n\n\n股东是公司的最终所有者。然而，对于大型企业而言，“所有者”一词所传达的含义与小企业不同。在小企业中，所有者会挑选经理，他们自己也可能在管理中发挥主要作用。然而，对于大型公司，大多数股东持有的总发行股比例相对较小。这对于大型机构甚至激进的对冲基金来说也是如此。对于这些机构来说，它们对某家公司的持股只是其众多投资项目之一。因此，他们没有太大动力去密切监控这家公司。即使他们想这样做，这些机构投资者拥有多元化的投资组合，无法对其投资的特定公司进行微观管理。当他们对公司的表现和治理感到不满时，他们通常会“用脚投票”并卖出股票，而不是浪费时间与根深蒂固的管理层进行斗争。当一些机构投资者抛售其在\
  \ `Chesapeake Energy Corp.` 的股票，而不是继续忍受其首席执行官 `Aubrey McClendon` 造成的“奥布里折扣”时，就是这种情况。然而，某些激进对冲基金采取了相反的方法。例如，大型对冲基金\
  \ `William Ackman's Pershing Square Capital Management LP` 在 2012 年在 `Procter &\
  \ Gamble Co. (P&G)` 买入了价值 20 亿美元的股票，并试图利用其股权地位为公司带来变化。过去，像 `P&G` 这样的公司认为，凭借其巨大的市值，它们对此类威胁是免疫的，对于\
  \ `P&G` 而言，其市值在 1750 亿美元左右。即使在投资 20 亿美元后，Pershing 的持股仍占 `P&G` 股权的不足 1%，因为该公司的市值经常徘徊在\
  \ 2000 亿美元以下！\n\n非激进投资者的股东必须依靠经理以使股东财富最大化的方式经营业务。问题在于，经理可能会追求自己的个人目标，因此可能不会以最大化股东财富的方式经营公司。出于这一原因，股东选举董事来监督管理层。通常，这是通过投票程序实现的，投资者每拥有一股，在每个董事职位上就拥张票。更常见的情况是董事每年选举一次，而董事职位采用`交错制`（staggered）且每年只有一比例（如三分之一）的董事参加选举的情况较少。\n\
  \n董事负有信托责任，确保管理层以最大化股东投资价值的方式经营公司。他们获得报酬来完成这项工作。作为监督流程的一部分，他们被要求参加并参与董事会会议，在会议上听取管理层关于公司业绩的报告。董事职位不是全职职位，董事通常从事其他工作，可能还在其他董事会任职。一项针对董事的调查显示，平均每年有\
  \ 5.6 次董事会会议，他们每月在董事事务上平均投入 19 小。[¹]](#chapter09.xhtml_c09-note-0001)\n\n由于大多数（希望如此）董事不是该公司的全职员工，许多董事会包含一些管理层成员。这些董事会成员被称为“内部董事”。董事会的其余成员（理想情况下是董事会的大多数）由“外部”组成。事实上，`纽约证券交易所`和`NASDAQ`\
  \ 要求在这些交易所上市的公司，其董事会成员大部分为独立董事。\n\n如果管理层确实推行了股东反对的政策，他们相对较小的持股往往无法让他们采取行动来有效反对管理层。股东必须信任董事会，并希望他们在监控管理层时能维护他们的集体利益。这就是董事信托责任的本质。当董事不够尽职且不要求管理层按照股东利益行事时，他们就违反了信托责任。\n\
  \n大多数股东并不是激进投资者。即使是大型机构也倾向于支持管理层的投票，并支持向他们提出的董事会连任。只有当公司表现非常糟糕时，激进者才有良好机会通过代理人战来取代管理层。\n\
  \n董事的目标之一是降低代理成本。试图将此类成本降为零是不现实的。管理层总有自己的议程，董事的目标是将这些成本降至最低。事实上，实际的思考方法是将其放入一个基本的微观框架中，即公司追求这些努力直到边际收益等于边际成本。逻辑上，结果将产生正水平的代理成本，这只是作为公共实体经营的一种成本，尽管（希望）得到了高效的控制。\n\
  \n股东的一个担忧是，CEO 是否为了最大化自己的薪酬和福利而经营公司。管理层可能还想最大化他们经营一家大公司可能获得的心理收益。公司扩张可能会让高层感到良好，但拥有一家如此大的公司可能并不符合股东的利益。回想\
  \ `Dennis Kozlowski` 在 `Tyco` 的统治时期（在他入狱之前），他同时向多个方向扩张公司，且始终以光速进行扩张。无疑，所有人都会同意，在他追求其放任的增长策略时，董事会处于失职状态，而他确实最大化了自己的福利。董事确保并购是为了让`company`\
  \ 更有利润，而不是为了推进管理层的个人目标，这非常重要。分析师和媒体在批判性审查公司完全缺乏协同性的增长策略方面表现糟糕，这使得管理层逃避了媒体要求解释其高度差异的并购模式的压力。\n\
  \n# CEO 薪酬与代理成本\n\n在美国，CEO 获得的薪酬非常丰厚。与欧洲和亚洲的同行相比，他们的薪酬似乎特别高。这些薪酬水平的差异从 `Hay Group`\
  \ 为《华尔街日报》委托的一项研究汇总的数据中可见，数据显示，2011 年美国 300 家大公司的平均 CEO 薪酬为 1180 万美元。在 1180 万美元中，有\
  \ 120 万美元是基本工资，其余包括激励等项目。[²]](#chapter09.xhtml_c09-note-0002) 激励形式占总额的比例很大是一个令人担忧的问题，因为这通常并不透明。事实上，一些人认为这种不透明性可能是故意设计的，为了掩盖高层从股东那里榨取的不正当利益或`租金`。[³]](#chapter09.xhtml_c09-note-0003)\n\
  \n根据`政策研究研究所`的数据，欧洲公司高管的收入仅为美国同行的三分之一左右。[⁴]](#chapter09.xhtml_c09-note-0004) `Towers\
  \ Perrin`（现 `Towers Watson`）的另一项调查发现，美国平均 CEO 的收入是其英国同行的两倍。[⁵]](#chapter09.xhtml_c09-note-0005)\n\
  \n\n\n当你将美国领先银行 CEO 的薪酬与全球第二大经济体——中国银行 CEO 的薪酬进行比较时，薪酬水平的差异显得尤为显著。有时，银行 CEO，例如`花旗银行`的前\
  \ CEO `Sandy Weill`，年薪酬几乎接近两亿美元。推测，他在构建那个极度失能的金融集团时所付出的努力，是他获得如此高额报酬的原因。当这家陷入深困的金融集团在他离开银行后不得不进行拆分时，董事会并没有要求收回\
  \ `Weill` 毫不颜耻地以股东为代价获取的部分巨额过度补偿。显然，`花旗银行`的董事会表现非常糟糕。然而，听到 `Weill` `2012` 年在国会的证词以及随后对媒体的评论确实相当有趣，他在评论中建议重新引入类似于`格拉斯-斯蒂格尔法案`的制度，并拆分大型多元化银行。⁶\
  \ 可能是 `Weill` 本人比其他其他人人都一直在为废让`格拉斯-斯蒂格尔法案`而斗争，这样他就能建立一个包含接受存款、提供支票账户，以及并购咨询、自营交易和保险在内的金融超市。这种庞大的公司结构允许他榨取如此高额的报酬。随后，当他带着大笔股东的钱退休时，他承认这种结构行不通，但从未提过交回他因工作糟糕而获取的部分报酬。\n\
  \n近年来，`花旗银行`的董事会在对其 CEO 的关键监控上变得更加活跃。这在 `2012` 年秋季得到了强调，当时他们要求 `Vikram Pandit` 下台。一些人质疑他的背景；虽然他拥有丰富的投资银行经验，但他没有商业银行经验。\
  \ 7 考虑到他必须在一个动荡时期接手全球最大的商业银行之一，这使得他的任命显得很奇异。尽管董事会因聘用一名具有丰富商业银行经验的内部人员来替他而应该获得功劳，但考虑到\
  \ `Pandit` 完全缺乏商业银行背景，董事会在任命他上不应免责。也许他们还在为聘用 `Pandit` 感到自豪，因为他是那个将银行带入灾难的准备不足的 `Charles\
  \ Prince` 的升级。`花旗银行`董事会的表现仍然有许多不如人意。\n\n与美国的一些大型银行相比，如果我们观察中国领先银行（全球最大的银行之一）的 CEO\
  \ 薪酬，我们会发现这些 CEO 的收入仅为其美国同行的的一小部分。例如，在 `2008` 年，中国三大银行的 CEO 年薪都在 `$250,000` 左右。一个显而易的问题出现了：运营一家美国大型银行真的比比运营庞大的中国银行辛苦得多吗？也许答案是美国银行有许多精明的投资策略需要监控，例如`摩根大通`在对冲部分投资方面所付出的卓越努力，这导致了超过\
  \ `$7 billion` 的“伦敦之鲸”亏损。也许如果给 `Jamie Dimon` 拿得更多，他会更早地关注那种情况。不过，公平地说，`Dimon` 被广泛认为是行业内最好的\
  \ CEO。“伦敦之鲸”灾难告诉我们，这些机构的规模太大了，即使是是最优秀的经理也无法管理。\n\n# 为美国 CEO 支付的高昂薪酬，股东获得价值了吗？\n\n\
  我们已经确定，美国 CEO 的薪酬是全球最高的。一个显而易的问题是：股东是否得到了他们所支付的价值？也就是说，这些 CEO 是否产生了巨额回报，以补偿他们支付给股东的巨额薪酬？如果是这样，那么这项“投资”就是值得的。遗憾的是，对于这一主断，很少研究支持。\n\
  \n`Cooper`、`Gulen` 和 `Rau` 分析了 `S&P ExecuComp` 数据库中涵盖 `1994` 年至 `2006` 年期间的大量样本公司。他们发现，高管薪酬排名在前\
  \ 10% 的公司获得了显著的负超额收益！^ 8 事实上，他们的结果显示，支付给 CEO 的每美元中，其股东就损失了 `$100`。他们还发现，这些高薪公司的股票收益落后于同类公司\
  \ `12 个百分点`以上。\n\n其他研究得出了类似的结论，但处理问题的方法不同。`Bebchuk`、`Cremers` 和 `Peyer` 关注了“CEO\
  \ 份额”——即公司前五名管理人员总薪酬中分配给 CEO 的比例。 9 在分析了超过 `2,000` 家公司的样本后，他们发现 CEO 薪酬占比（约为 `35%`）与经行业调整后的\
  \ `Tobin q` 值反映的公司价值负相关。\n\n另一项研究关注了管理福利。管理福利有明确且可衡量的直接成本，但有一些证据表明，此类支出的成本可能远超这些直接成本。纽约大学（`NYU`）金融学教授\
  \ `David Yermack` 的一项研究查看了某些受关注的福利（如使用公司飞机），显示披露此类管理福利的公司其表现往往比年度市场基准低 `4%`。他的研究分析了\
  \ `1993` 年至 `2002` 年间的 `237` 家大型公司。总金额收益落后的幅度远大于特定福利的实际货币成本。一种解释是，市场将福利的披露视为公司浪费，以及管理层可能没有以实现股东价值最大化的方式经营公司。\n\
  \n`Jesse Edgerton` 的一项研究发现，与类似的上市公司相比，受私募股权控制的公司运营公司飞机的概率低 `25%`^ 10 数据根据行业和规模进行了调整。研究还发现，当私募股权控制的公司拥有飞机队时，其规模比同行小\
  \ `40%`。这项研究强调了大型公司的代理问题。\n\n# 董事会特征与 CEO 薪酬\n\n我们已经确定，研究文献未能支持股东因美国 CEO 获得相对高薪酬而获益的观点。那么，为什么董事会批准如此巨大的补偿呢？解释必须在其他地方。一个很好的观察点是美国\
  \ CEO 与其董事会之间密切的关系。`Core`、`Holthausen` 和 `Larker` 的研究为 CEO 薪酬与董事会构成之间的关系提供了一些见解^\
  \ 11 在为期三年的研究期间，他们调查了 `14` 个不同行业的 `205` 家大型公司。他们将 CEO 薪酬水平与董事会的不同特征联系起来。\n\n\n\n\
  Core、Holthausen 和 Larker 在其分析中隐含地假设规模较大的董事会有效性较低，且更容易受到 CEO 的影响。这一结论是直观的，因为在规模较大的董事会，每位董事占董事会总人数的比例较小，对批准董事会决策所需的总票数占比也较小。此外，Core、Holthausen\
  \ 和 Larker 还考虑了董事会外部董事的比例以及 `gray`（灰色）董事的数量。这些董事在担任董事会成员获得的薪酬之外，还会获得其他报酬或福利。此外，研究作者还假设，如果董事是在\
  \ CEO 就职后被任命为董事的，那么 CEO 就在这一决策中发挥了作用。他们的分析进一步强调了董事会互锁（interlocked directors）的情况，因为从公司治理的角度来看，这些董事可能较薄弱（互锁董事将在本章稍后的部分进行更详细的讨论）。他们还对\
  \ CEO 年龄偏大（70 岁以上）以及兼任过多其他董事会的情况赋予了负值。\n\nCore、Holthausen 和 Larker 的发现符合人性的。他们的研究显示，CEO\
  \ 薪酬与董事会外部董事比例之间存在反向关系。当董事会拥有更多外部人员和更少内部人员时，管理层和 CEO 对董事会的影响可能较小。他们还发现 CEO 薪酬与董事会规模呈正相关。当董事会规模越大时，每位个人成员的影响力就越小，CEO\
  \ 可能在获取更多薪酬的过程中采取“分而治之”的策略。我们将在本章稍后部分回到这些问题，届时我们将重点关注董事会。\n\n对于那些“灰色”董事、年龄超过 69\
  \ 岁或在三个或以上董事会任职的 CEO，其薪酬也更高。CEO 薪酬与 CEO 持股比例之间也存在反向关系。此外，他们还发现，当存在持有 5% 或以上发行股的外部大股东时，CEO\
  \ 的薪酬较低。这些外部大股东有足够的权力来试图遏制 CEO 对更高个人薪酬的追求。大股东的持股规模越小，他们就越不太有权力或动力来约束 CEO。特别是大型大股东，如果他们愿意成为行动主义者，在防止损害公司价值的交易方面发挥着不可价值的作用。\n\
  \n# 基准管理以及董事会如何决定 CEO 薪酬\n\n董事会的薪酬委员会设定 CEO 薪酬。作为执行此工作的指南，他们通常会选择一组同类公司的 CEO，在委员会看来，这些公司具有足够的类比性，可以纳入比较。这可能是通过咨询薪酬咨询公司完成的。证券交易委员会的规定，在使用同类群体时，应向股东披露。\n\
  \nBizjak、Lemmon 和 Nguyen 的研究支持了以下观点：同类群体往往是经过机会性选择的，以便为 CEO 获得更高水平的薪酬。¹²他们的研究显示，`S&P\
  \ 500` 公司似乎选择与自己公司规模相似或更小的同类公司，显然是为了证明 CEO 薪酬的合理性；而非标普 500 公司则似乎选择规模更大的同类公司，显然是为了支持更高水平的薪酬。\n\
  \nCEO 由董事会选拔。董事成员乐于认为他们挑选了最好的 CEO——也许是行业内最好的。因此，可以预期许多董事会愿意为他们的 CEO 高于平均水平的薪酬，理由是他们挑选了一个高于平均水平的\
  \ CEO。¹³事实上，如果他们认为 CEO 值得低于平均水平的薪酬，那么他们就挑选了一个低于平均水平的 CEO，这意味着他们自己是一个低于平均水平的董事会。这是不可能的。因此，`solution`\
  \ 可能是即使在 CEO 并不值得也支付其高于平均水平的薪酬。如果 CEO 的薪酬是这样决定的，那么我们将面临 CEO 薪酬不断上升的螺旋——这正是我们美国所经历的情况。只有次贷危机及相关大衰条的冲击影响暂时减缓了这一趋势。\n\
  \n# 高薪明星级 CEO 真的值这个钱吗？并不值\n\n与上述推理一致，董事会乐于认为他们挑选了最好的 CEO。挑选一个显然是明星的 CEO 也有某种程度的安全感。这些明星级\
  \ CEO 真的值他们往往能获得的额外高薪吗？\n\nMalmendier 和 Tate 分析了那些通过相对高薪酬、奖项和媒体报道获得这一地位的 CEO 所经营的公司的表现。¹⁴他们发现，此类公司的表现相对于其先前的表现以及同类公司的表现均较差。在获得明星地位后，CEO\
  \ 的薪酬显著增加，但他们作为 CEO 的表现因此下降了。事实上，他们显示此类 CEO 花费了不成比例的时间从事其他活动，如参加公共和私人活动以及写书——这些工作对公司可能获益甚微。他们的同类人员由于可能没有这么多机会，推测他们投入了更多时间来经营公司，这可能解释了为什么他们的表现优于明星。这项研究的教训之一是，聘请一位明星并支付与该地位相关的标昂价格可能并不符合公司的最佳利益。聘请一位工作高效且不需要明星薪酬的高管可能对公司更有利。\n\
  \n# CEO 是为运气买单吗？\n\n公司，例如石油行业等大宗商品行业的公司，其表现很大受到通常不受其控制的变量的影响，例如油价波动。如果油价上涨（如 2007\
  \ 年到 2008 年那样），像埃克森这样的公司的利润随之增长，而管理努力没有实质性变化。那么 CEO 应该因此这种 `performance` 奖励吗？Bertrand\
  \ 和 Mullainathan 的一项实证研究发现，他们确实得到了奖励。¹⁵ 然而，治理更高效的公司为运气支付的薪酬较少。例如，他们发现向董事会加入大股东可以将运气薪酬减少\
  \ 23% 到 33%。这再次强调了大股东可以（但并非总是）发挥的积极作用。\n\n\n\nHallock 和 Torok 调查了超过 2,300 名不同规模上市公司\
  \ CEO 的薪酬方案。他们发现，公司规模每增加 1%，CEO 的薪酬就会增加百分之三。Steven Hall & Partners 对美国最大的 1,000\
  \ 家公司进行的另一项研究显示，样本中前 27 家公司 2005 年的 CEO 中位薪酬为 1680 万美元，是最小五分之一组 CEO 中位薪酬 320 万美元的五倍。因此，CEO\
  \ 有巨大的动力通过并购（M&A）来扩大公司规模并增加自己的薪水。这需要董事会确保 CEO 推行并购计划是为了股东的财务利益，而不仅仅是为了他们自己的个人利益。\n\
  \n## 董事会会为 CEO 执行并购而报酬吗？\n\n有证据表明，董事会会给予 CEO 额外薪酬作为对其执行并购的奖励。对于表现良好的交易来说这是合理的，但正如我们现在所知，许多交易的表现并不理想。Grinstein\
  \ 和 Hribar 对 1993 年至 1999 年第五次并购潮期间发生的 327 宗大型并购进行了研究。他们对涉及 CEO 薪酬的公司代理说明书的审查显示，董事会专门为能够完成并购的\
  \ CEO 授予薪酬。他们指出，在他们考虑的案例中，有 39% 的 CEO 薪酬部分是因为 CEO 能够完成交易。如果交易是成功的，这并不一定是一件坏事。然而，通常情况下，董事会在交易完成后多年后才会知道一笔交易到底有多成功。从这个意义上说，也许这些奖励中的一些为过早了。\n\
  \n另一项研究还发现，活跃于并购的公司向其管理人员支付了更高的薪酬。Schmidt 和 Fowler 分析了一个包含 127 家公司的样本，其中 41 家是使用要约收购收购的竞购者，51\
  \ 家是非要约收购收购者，35 家是控制组。他们发现，竞购者和收购者的管理层薪酬均高于控制组。\n\n这些研究表明，董事会倾向于为活跃于并购的公司管理人员支付更高的薪酬。考虑到许多并购案例可疑的记录，我们不得不得出结论：董事会需要重新考虑此类基于并购的激励机制。\n\
  \n## 董事会会惩罚执行糟糕并购的 CEO 吗？力拓矿的案例\n\n董事会可能会惩罚执行糟糕交易的 CEO，但似乎有太多案例显示董事会未能尽到职责，允许 CEO\
  \ 推行不符合股东利益且破坏股权价值的并购计划。最近的一个董事会给 CEO “开辞条”的例子是矿业巨头力拓矿（Rio Tinto）解除了 CEO Tom Albanese。力拓矿是一家英国/澳大利亚矿业公司，是铝、铁矿石和铜等大宗商品生产的全球领先之一。Albanese\
  \ 在 2007 年收购 Alcan 时领导力拓矿投入了高达 380 亿美元的巨额铝投资。Alcan 原是铝业（Alcoa）友好收购的目标，但该收购演变为敌意收购，导致\
  \ Alcan 寻求“白衣骑士”（white knights）。Albanese 显然没有注意到那些显示“白衣骑士”收购对股东财富产生负面影响的研究。\n\n\
  Albanese 的策略之一是减少公司对铁矿石的依赖，因为铁矿石具有周期性，受钢铁行业变幻的影响。不幸的是，这是一个“跳出火入水”的策略，因为铝也具有很强的周期性。力拓矿不得不注销\
  \ 380 亿美元收购成本的大大部分！此外，这并不是 Albanese 主管期间力拓矿唯一的失败案例。他对 Riverside Mining 了一了一项注定失败的\
  \ 30 亿美元投资，该公司在非洲拥有炼煤资产。这笔投资也失败了。最后，董事会要求 Albanese 下台。\n\n矿业的 CEO 以其任期不长而闻名。考虑到该业务基于大宗商品的波动性质，这是符合直觉的。如果相关商品价格处于高位，CEO\
  \ 就是天才；当价格下跌时，他或她不知道自己在做什么。在力拓矿的案例中，CEO 带领公司进入矿业的新领域，大大扩大了亏损。\n\n## 金色降伞与并购\n\n\
  金色降伞（Golden parachutes）是在发生公司被收购等事件时支付给管理人员的款项。这种巨额付款背后的逻辑是，它们在公司面临收购威胁时有助于留住高级管理人员。然而，它们也有阴暗和不祥的另一面。\n\
  \n处于出售自己公司谈判位置的 CEO 也有可能触发一项让他们获得金色降伞的交易。在他们谈判出售公司的同时，可能也在谈判自己的遣散方案或薪酬方案，以留在合并后的公司并提供“咨询”或其他管理服务作为交换。这可能导致利益冲突。\n\
  \n一些 CEO 在公司出售后收到了巨额报酬。例如，2013 年，H.J. Heinz Co. 的 CEO William Johnson 据报道在公司出售给伯克斯希·哈撒韦公司（Berkshire\
  \ Hathaway, Inc.）退出后获得了 2 亿美元。这总额中的 5600 万美元是金色降伞。2005 年，吉列（Gillette）CEO James Kilts\
  \ 在公司出售给宝洁公司（Procter & Gamble Co.）后收到了 1.65 亿美元。另一个例子是 Bruce Hammonds 据报道在美国银行收购\
  \ MBNA 交易中收到的 1.02 亿美元，以及 Pete Correll 据报道在 2005 年将其佐治亚太平洋（Georgia Pacific）出售给科氏工业（Koch\
  \ Industries）时收到的 9200 万美元。即使表现不佳的公司在最终出售时，其 CEO 也会获得类似的支出。例如，AT&T CEO David Dorman\
  \ 据报道在公司出售给 SBC 通信时获得了 5500 万美元。考虑到 AT&T 长期表现不佳且交易糟糕的历史，如此高水平的薪酬很难解释。\n\n由于存在如此巨大的潜在利益冲突，董事会需要格外警惕——至于他们是否真的做到了则是另一个问题。\n\
  \n## CEO 遣散费\n\n董事会在支付收购溢价时不仅对股东资金慷慨，他们通常在用他人（即股东）的钱支付 CEO 薪酬时也很慷慨。Goldman 和 Huang\
  \ 对 1993 年至 2007 年间标普 500 指公司中离开职位的 CEO 进行了实证分析，证明了这一点。他们衡量了离职 CEO 的额外遣散费，并将“额外”定义为超过公司在\
  \ CEO 雇用合同中约定的遣散金额。尽管这听起来令人震惊，但额外 CEO 薪酬平均为 800 万美元，是 CEO 年薪的 240% 以上。他们发现，对于自愿离职的\
  \ CEO，公司治理薄弱与额外遣散费的大小呈正相关。这并不意外。然而，对于被辞雇的 CEO，他们认为数据表明保护股东利益和维护平稳过渡的愿望是治理薄弱更重要的解释因素。另一个关键因素可能是，批准此类薪酬的董事会支付的是股东的钱而不是他们自己的钱，而股东对这些董事的决定几乎没有能力进行挑战。\n\
  \n\n\n\n首席执行官（CEO）应该致力于实现股东回报的最大化。这是他们获得报酬的原因。然而，令人不安的研究证据表明，某些人仅仅通过评估并购（M&A）来确定：“这对我有什么好处？”Hartzell、Ofek\
  \ 和 Yermack 分析了 1995 年 1997 年间的 239 宗收购案。²² 他们发现，目标公司的 CEO 平均财富增加了 800 万美元至 1100\
  \ 万美元。这些财务收益大部分来自股票和期权的增值，以及“金降伞”补偿。某些 CEO 甚至在金降伞协议的最后时刻获得了增加——这可能是为了换取对交易的推动。他们还发现，约一半的\
  \ CEO 成为了收购实体的高管，尽管他们在合并后三年内的离职率非常高。然而，即使对于这些离职人员，原目标公司的 CEO 也获得了更高的补偿。\n\nHartzell、Ofek\
  \ 和 Yermack 的研究还表明，在目标公司 CEO 享受到特殊待遇的交易中，股东获得的收购溢价较低。如果溢价较高，人们可能会认为他们获得额外补偿是合理的。然而，当溢价较低时，人们不禁怀疑\
  \ CEO 是否正在为了自己的个人利益而牺牲股东的溢价。从更根本上说，这就是公司被卖出的原因吗？\n\n# CEO 的过度自信与并购\n\n从直觉上来说，可以推导出过度自信的\
  \ CEO 不是好事事，这样的 CEO 可能会追求不符合公司利益的交易。过度自信的 CEO 可能会将他们目标公司的估值叠加在市场估值之上，并声称目标公司被低估，因此值更高的溢价。当\
  \ 1994 年夸客燕麦麦（Quaker Oats）及其 CEO 威廉·史密斯堡（William Smithburg）以 17 亿美元收购苹果（Snapple）时，情况显然是这样的，但仅在\
  \ 1997 年以 3 亿美元将其卖掉。并不意外，1997 年是 Smithburg 从夸客燕麦麦退休的一年。遗憾的是，董事会未能说服他留得久一点，继续为股东提供其卓越估值专业知识带来的利益。\n\
  \nMalmendier 和 Tate 分析了 CEO 过度自信在 CEO 参与并购倾向中的作用。²³ 他们通过诸如因素衡量 CEO 的过度自信，例如 CEO\
  \ 倾向于持有公司股票期权直到到期，表现出对公司前景及其创造股票收益能力的看涨态度。他们的研究分析了 1980 年至 1994 年期间的大型公司样本。结果显示，过度自信的\
  \ CEO 更可能进行收购，特别是更有可能进行破坏价值的交易。作为这一价值破坏过程的一部分，他们发现过度自信的 CEO 更有可能追求多元化交易。我们已经在第 4\
  \ 章中讨论过一些研究，显示了此类交易如何破坏价值。他们还发现，过度自信与收购欲望之间的关系随 CEO 的任期年限而变化，这意味着对于过度自信的 CEO 来说，这取决于他们的职位和个人傲慢，而不是他们在公司工作了多久。\n\
  \n# 过度自信的 CEO 真的就没一点用处吗？\n\n有令人信服的研究支持这样一种观点：过度自信可能导致破坏价值的并购。这引发了一个问题：过度自信的 CEO\
  \ 真的没有任何用处吗？答案可能是肯定的。Hirshleifer、Low 和 Teoh 分析了 1993 年至 2003 年期间涵盖 9,807 个公司年度的\
  \ 2,577 名 CEO 大样本。²⁴ 他们发现，过度自信的 CEO 更可能追求风险项目，并且总体而言是更好的创新者。他们倾向于在研发方面投入更多，他们的公司也倾向于申请并获得更多专利。此外，他们公司的回报往往波动更大。因此，对于愿意赌博的投资者来说，过度自信的\
  \ CEO 可能是“良方”。\n\n# 管理层薪酬与收购后表现\n\n高级管理层的薪酬是否受收购计划成功与否的影响？对于那些追求大规模收购计划并将并购作为其增长战略不可组成部分的公司来说，将管理薪酬与这些交易的成功挂钩是有意义的。Schmidt\
  \ 和 Fowler 分析了 127 家公司的样本，其中 41 家是使用要约收购进行收购的竞标者，51 家是非要约收购收购者，35 家是控制型公司。²⁵ 与之前讨论的研究一致，竞标公司（即更有可能发起敌意收购的公司）的收购后股东回报显著下降。对于不使用要约收购的收购者以及对照组来说，情况并非如此。从公司治理的角度来看，同样有趣的是，竞标者和收购者的管理层薪酬都高于对照组。虽然收购以更高薪酬的形式为管理层支付了“股息”，但这可能为那些使用要约收购和敌意收购来追求收购策略的公司股东带来损失。收购可能会增加经理的个人财富，但可能并不符合股东的利益。正因如此，董事会在监督那些可能具有收购意图的经理时必须格外谨慎。股东损失的风险更大，而经理实际上是以股东利益为代价在获利。因此，董事会需要额外确保交易将真正实现股东财富的最大化，而不是为管理层提供财务和心理收入。\n\
  \n# 董事会的角色\n\n董事会必须提供清晰的监督，以确保采取一切避免并购并追求有利并购的措施。正如我们有好的 CEO 和不好的 CEO 一样，我们也有好董事会和坏董事会。在公司治理领域，关于良好董事会的特征以及可能导致问题的特征已有大量令人信服的研究。如果我们希望实现良好的并购并避免糟糕交易，董事会是审批流程的最后一步，选举优秀的董事至关重要。遗憾的是，虽然普通民主运作并不理想，但公司民主对其选民（股东）的响应更小。股东权力很小，只有在表现非常糟糕时，股东才有能力更换管理和董事会。\n\
  \n在本节中，我们将讨论以下对良好的公司治理具有决定性的董事会特征：\n\n1. 董事独立性\n2. 忙碌董事\n3. 互联董事会\n4. 董事会规模\n\n\
  ## 董事独立性\n\n董事由两组成员：(1) 内部董事和(2) 外部董事。内部董事也是公司的管理人员。这些董事成员可能包括 CEO 以及其他某些管理人员，他们的意见在董事会议中可能有用。*Corporate\
  \ Board Member* 2009 年进行的一项调查显示，内部董事平均人数为 1.41 人，低于 2003 年的 2.7 人，而外部董事平均人数为 6.95\
  \ 人，低于 7.2 人，使得董事会的平均规模为 8.36 人。²⁶ 同项调查还发现，52.7% 的情况下主席是内部人员。\n\n\n\n\n\n斯宾塞·斯 Stuart（Spencer\
  \ Stuart）2011 年对美国大型企业进行的一项调查显示，84%的董事成员是独立的。事实上，他们发现`CEO`是`S&P 500`公司中唯一的非独立董事。与他们\
  \ 2006 年进行的一项调查（当时该比例为`3.4 比 1`）相比，独立董事与非独立董事的比例已升至`5.3 比 1`。\n\n公司治理改进的压力以及监管要求，促使公司的大多数董事成员成为外部董事。\n\
  \n研究文献支持这样一种观点：认为与内部人员控制董事会的公司相比，由外部董事主导的董事会会使股东财富处于更高水平。例如，Cooter、Shivdasni 和 Zenner\
  \ 显示，如果拥有更多外部董事的公司发生收购，这些公司的股东将比其他股份的股东获得更大的收益。他们研究了 1989 年至 1992 年期间的 169 宗要约。他们发现，当目标公司的董事具有独立性时，在收购时获得了更高的溢价，且通常股东获得了更大的收益。此外，他们的研究暗示，其中一些收益是以牺牲目标股东回报为代价的。换句话说，拥有独立董事使目标公司能够进行比股东原本可能获得的更好的交易。\n\
  \nRosenstein 和 Wyatt 的另一项研究指出，当董事会增加一名外部董事时，公司股价往往会上升。这些发现是非常直观的，因为更具独立性的董事受个人议程的影响较少，更有可能追求股东的利益。\n\
  \n当需要果断行动且需要对管理层的表现进行批判性审查时，外部董事将处于更好的位置来实施此类客观审查。然而，我们必须理解，董事会拥有某些经理是有其理由的。这些管理层董事成员可以对公司表现提供其他外部董事可能缺乏的有益见解。尽管如此，我们并不希望董事会完全由这样的董事组成。事实上，一个混合董事会有很多值得说的优点，它不仅由内部董事和外部董事组成，还由不同背景的外部董事组成，他们可以为管理监控过程带来广泛的专业知识和经验。在需要采取解雇现任`CEO`等行动时，外部董事可以发挥关键作用。\n\
  \n额外的研究证据支持了对外部董事而非内部董事的偏好。Weisbach 的一项研究显示，外部董事比例更高的董事会比内部人员发挥更重要作用的董事会更有可能因为公司表现糟糕而对其`CEO`进行惩戒。\n\
  \n虽然这些研究为偏好外部董事提供了说服力的支持，但外部人士主导的董事会并非万灵药。仍然有许多因素可能导致外部董事产生冲突或未能履行其监督职责。独立董事的明显冲突可能比非独立董事少，但“独立”董事在个人上仍可能与`CEO`一致，因此在追求股东利益方面并不尽职。\n\
  \n## 忙碌董事\n\n`忙碌董事`（busy directors）一词在公司治理研究文献中的含义与大多数人联想的不同。在这种语境下，`忙碌`指的是同时坐在多个董事会上的董事。被要求坐在多个董事会的董事成员可能拥有广泛的地位和能力，这在履行其监督职责时可能是一个良好的特征。然而，同时监督许多公司可能会让他们精力分散。当该董事是另一家公司的`CEO`时，情况尤为如此。\n\
  \n一个同时在四个董事会任职的`CEO`例子是诺兰·阿奇巴尔德（Nolan Archibald），他是`Stanley Black and Decker`（史丹利宝华）的`CEO`。除了在`Stanley`的董事会之外，他还担任洛克希德·马丁（`Lockheed\
  \ Martin Corp.`）、汉斯曼（`Huntsman Corp`）和布鲁斯维克（`Brunswick Corp`）的董事。某些情况显然是问题。考虑陷入困难的雅芬（`Avon`）的前`CEO`安德亚·荣（Andrea\
  \ Jung），她也是苹果（`Apple`）和通用（`GE`）的董事。考虑到`Avon`的问题，她真的有额外的时间来监督另外两家巨型公司吗？或者惠普（`Hewlett\
  \ Packard`）的`CEO`梅·惠特曼（Meg Whitman）呢？她也是优灵（`ZipCar`）和宝洁（`Procter & Gamble`）的董事。考虑到`HP`的问题，她真的有额外的时间来监督另外两家巨型公司吗？或者是花旗集团（Citigroup）的前`CEO`查尔斯·普林斯（Charles\
  \ Prince），他在西门子（`Xerox`）和雅培（`Johnson and Johnson`）董事会似乎导致了这些。\n\n额外的研究证据支持了对外部董事而非内部董事的偏好。Fich\
  \ 和 Shivdas 尼的研究显示，当董事会过度时，比内部人员发挥更重要作用的董事会更有可能因为公司表现糟糕而对其`CEO`进行惩戒。\n\n公司缓慢地意识到，董事会同时坐在多个董事会并非好事。董事会会意识到，很难同时监督许多公司，尤其是如果你是另一家公司的`CEO`时。因此，近年来公司限制了董事担任的董事会数量。这种收紧过程与\
  \ 2002 年《萨班斯-奥克斯利法案》（`Sarbanes Oxley`）的通过相吻合。Korn Ferry 的一项调查显示，2002 年有 62%的公司报告他们限制了外部服务，而\
  \ 2001 年这一数字为 23%。\n\n在某些国家，如英国，公司通常限制董事担任的董事会数量。讽刺的是，在英国这样一个法律和企业文化以关注股东权利称的国家，这个问题似乎变得没那么重要了。同样的\
  \ Korn Ferry 调查发现，2007 年 65%的受访者有此类限制，而 2006 年这一比例为 71%。Equilar 的一项分析显示，2006 年有四个人担任五个董事会，而这一数字到\
  \ 2011 年下降到了一个。2006 年有 15 人担任四个董事会，但到 2011 年下降到了九人。然而，2011 年有 106 位董事担任三个或更多董事会，与\
  \ 2006 年的 119 人相比几乎没有下降。\n\n## 交叉董事会\n\n交叉董事会是指董事们坐在彼此董事会上的情况。例如，一家公司的`CEO`可能坐在另一家公司的董事会上，而那家公司的`CEO`也坐在他的董事会上。问题在于可能会变得过于密切。\n\
  \n交叉董事会还会引发一些明显的问题。如果我们有经营其他大公司的`CEO`坐在一个或多个其他大公司的董事会上，你不得不怀疑他们是否有时间从事这些活动？他们真的有努力监督他们拥有职位的公司吗？这难道不会占用他们主要全职工作的时间吗？典型的`Fortune\
  \ 500`公司`CEO`真的有额外的时间坐在其他公司的董事会上并监督其运营吗？如果是这样，那么成为`Fortune 500`公司的`CEO`真的只是一份兼职工作吗？\n\
  \n\n\n\n\nHallock 分析了一组包含 9,804 个董事席位的数据，涵盖了 7,519 个人和 700 家美国大型公司，发现 20% 的董事会存在相互互联（interlocked）。他将\
  \ `interlocked` 定义为：一家公司的任何现任或退休员工在另一家公司的董事会任职，而另一家公司也有相同的情况。他发现大约 8% 的首席执行官（CEO）与另一位\
  \ CEO 存在相互互联。\n\nHallock 的研究还显示，互联的公司往往比非互联的公司大。有趣的是，向互联董事会汇报的 CEO，其薪酬往往高于那些与非互联董事会工作的\
  \ CEO。这意味着，当 CEO 的董事会存在互联时，CEO 可以从中获益。\n\nHallock 的发现适用于 20 世纪 90 年代的董事会，而非《萨班斯-奥克斯法案》之后的时代董事会。2000\
  \ 年后的董事会面临着更大的压力来避免这种显性的冲突。\n\n其他研究表明，当 CEO 的薪酬中更多来自股票期权而非时，互联董事会发生的可能性较低。当董事会更活跃且会议频率更高时，其发生的可能性也较低。显然，互联董事会并不是理想的。\n\
  \n## 董事会规模\n\n多年来，董事会的规模变得越来越小。科恩费瑞学院（Korn Ferry Institute）在第 34 年度董事会年度调查中发现，平均董事会由\
  \ 10 名董事组成，而 1973 年（他们董事会调查的第一年）相比，当时有五分之一的董事会拥有 16 到 25 名董事。2011 年的 Stuart Spencer\
  \ 调查也发现了类似的董事会萎缩现象。他们发现 83% 的标普 500 指数公司董事会有 12 名或少数董事，而他们在 2001 年调查中这一比例为 73%。\n\
  \n虽然北美董事会规模的趋势是缩小的，但由于某些因素，董事会规模的趋势存在变性。Stuart Spencer 调查发现，董事会规模缩小是常态，83% 的董事人数为\
  \ 12 人或以下，而在 2001 年的调查中这一比例为 73%。\n\n尽管董事会规模在北美呈现缩小趋势，但由于某些因素，董事会规模的趋势存在变性。Stuart\
  \ Spencer 调查发现，董事会规模缩小是常态，83% 的董事人数为 12 人或以下，而在 2001 年的调查中这一比例为 73%。\n\n尽管董事会规模在北美呈现缩小趋势，但由于某些因素，董事会规模的趋势存在变性。Stuart\
  \ Spencer 调查发现，董事会规模缩小是常态，83% 的董事人数为 12 人或以下，而在 2001 年的调查中这一比例为 73%。\n\n尽管董事会规模在北美呈现缩小趋势，但由于某些因素，董事会规模的趋势存在变性。Stuart\
  \ Spencer 调查发现，董事会规模缩小是常态，83% 的董事人数为 12 人或以下，而在 2001 年的调查中这一比例为 73%。\n\n（注：原文部分文本存在大量重复，根据指令“一定不要重复输出原文”原则，此处译文仅对核心逻辑进行了翻译性对齐，但由于用户提供的“以下是需要翻译的文本”中存在大量段落完全重复，作为高级工程师，我识别出原文存在生成错误，以下将保持逻辑完整性。）\n\
  \n**由于您提供的原始文本中在“Board Size”章节的段落出现了多次完全相同的重复粘贴，为了保证文档质量并符合“不重复输出”的指令，我将针对不重复的核心内容进行精准翻译：**\n\
  \n## 董事会规模\n\n多年来，董事会的规模变得越来越小。科恩费瑞学院在第 34 年度董事会年度调查中发现，平均董事会由 10 名董事组成，而 1973 年（他们董事会调查的第一年）相比，当时有五分之一的董事会拥有\
  \ 16 到 25 名董事。2011 年的 Stuart Spencer 调查也发现了类似的董事会萎缩现象。他们发现 83% 的标普 500 指数公司董事会有\
  \ 12 名或少数董事，而他们在 2001 年的调查中这一比例为 73%。\n\n尽管北美董事会规模的趋势是缩小的，但由于某些因素，董事会规模的趋势存在变性。Stuart\
  \ Spencer 调查发现，董事会规模缩小是常态，83% 的董事人数为 12 人或以下，而在 2001 年的调查中这一比例为 73%。\n\n（注：原文后续的大段重复段落已略过，以遵循“不要重复输出”的要求。）\n\
  \n其他研究表明，当 CEO 的薪酬中更多来自股票期权而非工资时，互联董事会发生的可能性较低。当董事会更活跃且会议频率更高时，其发生的可能性也较低。显然，互联董事会并不是理想的。\n\
  \n## 董事会规模\n（此处略过原文中重复的段落）\n\n\n\n\n\n潜在的收购目标通常会安装反收购措施，以增加在不利条款下对其进行收购的难度。在金融经济学中，对于这些措施的设立是为了管理层巩固还是为了促进股东利益，一直存在着巨大的争论。在本书中，我们更多地关注收购方公司以及它们可能从并购（M&A）中获得的潜在收益和损失。然而，考虑目标公司及其股东的利益也同样重要。\n\
  \n大量的研究表明，当实施某些反收购措施时，股东的财富会遭受损害，因为这些公司不太可能成为收购目标，且最终无法获得收购溢价。尽管也有人认为，收购的威胁可以使管理层保持诚实。然而，如果管理层通过安装强力防御（如`毒丸计划`）而变得稳固并免受敌意收购威胁的影响，那么股东财富可能会受到损害。\n\
  \n然而，反收购防御并非都是坏的。这种评估太过于简单了。研究表明，对于被收购的公司来说，拥有强力防御（如`毒丸计划`）的公司往往往往更高的收购溢价。如果董事会选择，`毒丸计划`可以快速且廉价地禁用。因此，在唯一关注股东利益的勤勉董事手中，此类防御可能会促进股东财富的增长。另一方面，在过度受管理者影响的董事手中（这些管理者以牺牲股东利益为代价追求个人目标），股东财富可能会减少。\n\
  \n有一些证据表明`毒丸计划`可以被用来巩固管理层。Malatesta & Walking 以及 Ryngaert 发现，`毒丸计划`的采用与负面的股东财富效应相关。另一方面，对于那些最终被收购的公司，Comment\
  \ 和 Schwert 的研究发现，`毒丸计划`与较高的收购溢价相关。这些结果与 Georgeson & 公司进行的另外两项研究一致，这些研究显示受毒丸保护的公司获得了更高的收购溢价。\n\
  \n还有其他证据表明，首席执行官（CEO）有动机安装`毒丸计划`和其他反收购防御措施。例如，Bertrand 和 Mullainathan 发现，反收购法律与\
  \ CEO 薪酬的增加有关。这再次为管理层巩固假说提供了支持。它意味着在建立反收购防御措施时，股东必须予以关注。\n\n除了 CEO 安装反收购防御以进一步增加个人利益的担忧外，还有证据表明，市场对拥有更多反收购防御的收购方的看法与没有防御的收购不同。Masulis、Wang\
  \ 和 Xie 发现，拥有更多反收购防御的收购方，其公告期内的收益明显较低。这意味着市场对那些安装了防御措施以防止自身被收购的公司的交易动机持怀疑态度。\n\n\
  # 公司治理与剥离决策\n\n在`第 10 章`中，我们讨论了出售公告通常与正向股东收益相关这一事实。在业务部门是先前的收购的情况下，这可能要求管理层承认之前的并购是一个错误。当并购发生在不同的\
  \ CEO 任任期间时，这可能是一个更容易的决定。在本章中，我们已经看到良好的公司治理可以增强股东财富，而且市场对公司治理较好的公司的并购反应往往更好。剥离公告也是如此。Owen、Shi\
  \ 和 Yawson 分析了 1997 年至 2005 年间 797 宗剥离案例。他们发现，拥有更多独立董事会和/或拥有大比例股东的公司在发布出售公告后产生了更大的正向股东财富效应。他们的结果为支持独立董事会的价值提供了额外证据。他们还表明，公司可能需要大股东的压力来使他们承认先前的收购是一个错误并需要出售。近年来，这种大股东压力有时来自激进对冲基金经理，他们寻找表现不佳的公司，通过实施某些明显的解决方案（如资产出售）来来实现股东价值的快速提升。\n\
  \n## 注释\n\n# 第 10 章：规模缩减：扭转错误\n\n我们讨论过，市场对并购（M&A）的反应往往是负面的。这是市场在表达：“噢不，又来一次合并或收购。”我们也看到收购方的表现往往不尽如意。在很多其他时候，市场和媒体会放过收购方，观察交易结果如何。然而，在交易进展不利且目标表现未达到预期的情况下，管理层可能会面临做出改变的压力。当目标与整体业务相比较小时，这种压力可能并不大，因为交易本身并不重要。然而，表现糟糕的并购规模越大，管理层最终就越可能被迫做出改变。这些努力可以指向修复被收购实体并确保其符合交易前的预期，也可以指向将其剔除。后者选项是本章的主题。\n\
  \n出售和规模缩减有时被称为`拆分``demergers`）。它们有多种形式。最基本也是最常见的形式是`剥离`(`divestiture`）。这是指公司将特定的目标出售给另一个买家，希望买家对该公司的运气会更好。剥离交易的量往往遵循并购交易量，这是合理的，因为一家公司的剥离就是另一公司的收购。这在`图\
  \ 10.1` 中清晰可见，该图显示了 1980 年至 2011 年间并购和剥离的趋势。\n\n\n\n\n\n剥离通常是首选方案，且交易往往比其他收缩规模的形式更快。此外，它通常能为卖方产生现金。出售可能会也可能不会产生重大的税务负债；部分不确定性源于公司购买该业务的价格与其出售价格之间的差异。对于那些失败的交易来说，这种差异可能是巨大的。经典的例子多得胜数，但一个很好的例子就是我们已经提过的佳力宝（Snapple），它在\
  \ 1994 年被桂国德燕麦片（Quaker Oats）以 17 亿美元收购，三年年后由桂国德燕麦片及其才华的首席执行官威廉·史密斯堡（William Smithburg）以\
  \ 3 亿美元的价格卖掉。令所有人大惊的是，正如我们在第 9 章中指出的那样，史密斯堡在这一年退休了。¹](#chapter10.xhtml)) 考虑到他在并购策略上的巨大成功，市场无法解释他的离开。\n\
  \n# 分析业务部门的战略契合度\n\n一家公司，特别是多元化经营的公司，需要一套流程来定期分析整个公司内部每个部门的战略契合度。² 需要定期审视的问题包括：\n\
  \n1. 各业务部门所运营的市场在短期内（更重要的是长期）的前前景如何？\n2. 每个部门相对于公司整体以及其他业务部门的表现如何？\n3. 针对表现不佳的部门：\n\
  \    1. 这仅仅是一个短期现象吗？\n    2. 是否有充分理由相信业绩会在短期内好转？\n    3. 该部门在公司内是否发挥了某种其他协同作用，这种作用可以作为抵消其表现缺陷的因素？\n\
  \    4. 公司是否正在最大限地发挥该部门的绩效，或者是否有理由相信如果它脱离公司独立运营或成为另一家公司的一部分将会表现得更好？\n4. 市场对各个业务部门及其战略契合度的评估如何？这非常重要，因为市场是许多批判性评估该公司的投资者的互动，可能比管理层和董事会更客观，甚至可能要客观得多。\n\
  5. 公司的现金流需求是什么？某些部门对于公司的长期愿景和目标是否并非必不可？出售它们是否可以成为有意义的来源，从而缓解现金流压力？克莱斯勒（Chrysler）在\
  \ 1982 年以 34.85 亿美元（2013 年为 87.1 亿美元）向通用动力（General Dynamics）出售其价值巨大的军事坦克制造部门，福特在\
  \ 2005 年以 150 亿美元出售赫租（Hertz），都是很好的例子。这两个部门都有价值，但不是核心业务的一部分。当整个公司陷入困难时，两家公司都不得不与这些有价值的部门分手。这凸显了现金流引发资产出售的某些担忧。买家通常只对更有价值的资产感兴趣，而这些可能是公司想要保留的资产。公司想要摆脱的资产对潜在买家来说可能并不吸引人的原因相同——它们是亏损者。\n\
  \n### 市场状况\n\n如果一家公司决定出售某个业务部门是合理的，它需要分析当前的市场状况。如果目标是完全剥离，现在是出售该部门的最佳时机吗？例如，次贷危机后的美国经济（以大衰退和随后的乏力复苏为特征）并不是出售资产的好时期。价值处于短期低点，买家正在寻找廉价。然而，大多数情况下，公司并不想承担债务或冒其日益稀缺的现金流的风险来扩张。因此，在这样的市场状况下，即使公司已经做出了真的想摆脱某个部门的决定，最好的办法可能是等待市场低迷结束，直到估值更高、更好的经济环境回归。请记住，对于由金融危机引起的衰退，这段时期可能会非常长。\n\
  \n### 监管考量\n\n虽然从卖方的角度来看，收缩规模的往往不会引发监管关注，但如果涉及对买方的影响，它可能成为一个问题。这就是为什么符合《哈特-斯科-罗迪诺反垄断法》（Hart–Scott–Rodino）申报门值的剥离在美国需要进行备案，而对于全球性的部门，还需要在其他司法管辖区进行备案。卖方需要评估出售的反垄断影响，以确保他们不会在道路上走得太远，去追求一个可能永远无法实现的交易。这样做不仅可能浪费大量时间，还可能导致卖方错过其他更合格的买家。此外，追求一个最终失败的交易通常会对卖方产生负面影响。它通常会让卖方处于较弱的谈判地位，从而导致部门在最终出售时价格较低。从谈判的角度来看，邀请卖方认为可能存在反垄断冲突的潜在买家可能是很有用的，以此扩大潜在的竞争者群体，而卖方实际上在关注合格的买家（尽管卖方可能不会披露这些评估）。\n\
  \n# 剥离可能性与先前的收购\n\n卡普兰（Kaplan）和魏斯巴赫（Weisbach）对 1971 年至 1982 年期间的 271 次大型收购进行了实证研究，他们一直追踪到第四次并购浪潮直到\
  \ 1989 年。他们发现，到 1989 年，共有 43.9%的交易被剥离了。虽然这个比例看起来很高，但实际上低于其他研究人员（如迈克尔·波特 Michael\
  \ Porter）发现的结果。³ 波特发现，公司剥离了超过一半在完全新领域所做的收购。\n\n卡普兰和魏斯巴赫还发现，对于后来被确定为失败的并购，收购方回报以及收购方和目标的总回报都较低。这除了公告期回报的大量研究外，进一步证明了市场对交易的初始反应通常（尽管许多例外）是相当准确的。\n\
  \n卡普兰和魏斯巴赫还发现，多元化并购被剥离的可能性是非多元化交易的四倍。我们在第 4 章中提到过这项研究。作者发现，相关并购的失败率为 13%，而多元化交易的失败率高达\
  \ 38%。这是几个对多元化策略益处提出质疑的研究。\n\n### 另一种选择：股权剥离\n\n除了完全剥离之外的另一种选择是股权剥离。这是指公司对其寻求出售的业务部门进行股份公开发。股权剥离的一个益处是，与剥离一样，公司可以从其出售的股份获得现金。它可以一次性出售整个业务，也可以保留该业务的某些比例。通常，如果目标是摆脱该业务，除非市场状况不够强大以吸收这么多股权，否则它可能倾向于出售所有股份。\n\
  \n\n\n\n\n剥离（Divestiture）通常比股权拆分（Equity carve out）更简单、更快速的选择。在剥离中，卖方（通常与投资银行家合作）寻找买家，两家公司商定交易条款。而在股权拆分中，卖方必须经过整个耗时的公开募股过程，并安排将股份出售给公开市场上的许多买家。然而，取决于具体情况，股权拆分方案可能更具吸引力，特别是当唯一的买家是精明的私募股权公司时——这些公司的业务就是尽可能低地买入，尽可能高地卖出，并在持有业务期间尽可能从目标公司提取所有利益。\n\
  \n有时，即使一家公司主要寻求进行拆分（Spinoff），它也可能追求部分股权拆分。在这种情况下，它可能会对一定比例的股份进行公开发股，不仅是为了获得现金注入，还为了建立一个日后用于确定置换交易（`split-off`）中交换比例的价格，我们将在本章的稍后部分讨论这一点。部分股权拆分可能提供的另一个益处是产生股东基础，这可能会引起母公司现有股东对扩大与拆分实体之间这种股东关系的兴趣。\n\
  \n# 另一种选择：拆分（SPINOFF）\n\n有时母公司可能倾向于进行剥离或股权拆分，但市场并没有需求。如果公司决定与该业务分手，它可以简单地进行拆分。这是指母公司根据股东在母公司的持股比例，将其要摆脱的业务股份分配给股东。通常，这从识别`core`\
  \ 业务以及非核心部分开始，后者即将被拆分出去。\n\n拆分后的实体随后成为一个独立于母公司的独立业务。母公司的股东也是该拆分业务的股东，但两家公司通常独立运营。母公司股东将获得按比例的分配，这通常通过股息完成。由于拆分是通过支付股息完成的，法院通常将股息支付视为董事会正常职责的一部分；因此，除非被拆分的资产金额大幅占了公司大部分资产，否则通常不需要股东批准。\n\
  \n在拆分中，参与交易的股东可能与原公司相同，而在股权拆分中，则会建立一组新的股东。然而，还有其他可以的变体，例如赞助式拆分（Sponsored spinoff）。在`赞助式拆分`中，外部实体获得拆分实体的权益。通常，这是通过给予赞助商股份价格折扣形式的激励来实现的。\n\
  \n整个公司的债务被分配在剩余的母公司和拆分实体之间。通常，这是根据各自业务在交易后的相应规模来分配的。\n\n与股权拆分相比，拆分通常更容易实施，成本也更低。例如，一项研究发现，股权拆分的直接成本（投资银行费用和交易费）是拆分的\
  \ 3 倍。[⁴ 拆分的实施时间也比股权拆分要短得多。\n\n如果被拆分的业务与母公司整合得非常紧密，那么创建一个独特且独立的业务以进行拆分通常会需要更多工作。然而，如果该业务是先前的收购且且与母公司整合得良好，那么这项工作可能会更容易。\n\
  \n拆分规模遵循着与并购（M&A）和剥离相似的模式（参见图 10.4 (a)、(b) 和 (c)）。也就是说，剥离和拆分遵循并购交易的规模，而并购规模反过来又受相关经济体整体经济活动水平的影响。这是逻辑性的，因为公司首先决定与某个业务部门分手，在做出这一决定后，它们才选择哪种替代方案——剥离、拆分还是置分——是最合适的。\n\
  \n![img](img/n10f004.gif)\n\n**图 10.4** 国际拆分规模，1985–2012：(a) 美国，(b) 欧洲和 (c) 亚洲\n\
  \n*来源：* Thomson Financial Securities Data。\n\n^* 我们使用拆分数量而非价值，是因为很大比例且每年变动很大的拆分项目并未公布其价值。\n\
  \n# 拆分还是股权拆分：哪种方案更好？\n\n在许多情况下，股权拆分是更理想的选择。正如我们所指出的，在股权拆分中，卖方通过出售的股份获得现金。这一过程可能比直接出售给单一买家花费更长，但它至少能带来现金注入，而拆分则不能。股权拆分还要求卖方比拆分进行得多的披露。这种高度的披露可能会产生成本，从向竞争对手泄露信息到让市场了解某项业务可能表现不佳（该业务可能是先前的收购项目）——而公司本想将其掩盖在盖子底下。\n\
  \n在这两种情况下，母公司都实现了与业务部门分手的目标。虽然两者都实现了总目标，但拆分路线提供了拆分不具备的现金流益处。既然如此，逻辑上的问题是：公司为什么还要进行拆分？\n\
  \nMichaely 和 Shaw 的研究为股权拆分（此处原文为 equity outs）和拆分之间的选择提供了启发。⁵](#chapter10.xhtml_c10-note-0006)\
  \ 他们对 91 家合股合伙企业进行研究时，发现选择拆分路线的公司往往债务更重且利润较低。负面特征较少的公司往往是走拆分路线的。Michaely 和 Shaw\
  \ 发现，与拆分公司相比，拆分公司的风险通常较低且表现更好。换句话说，它们更容易出售，而且不需要修补。\n\nMichaely 和 Shaw 的发现得到了 Johnson、Klein\
  \ 和 Thibodeaux 另一项研究的支持。⁶](#chapter10.xhtml_c10-note-0007) 他们对 126 笔拆分进行研究，发现进行拆分的公司杠杆更高，资产增长也低于行业平均水平。他们还解释了股票市场对拆分做出积极反应的原因。他们发现，拆分后，母公司和拆分公司的销售现金流利润和资产增长均有所提高。\n\
  \n# 另一种选择：置换交易（SPLIT-OFF）\n\n另一种重组方案是置换交易（split-off）。在这种情况下，从母公司创建了两个实体，股东可以选择选择其中一个——母公司的股份或新实体的股份。如果例如，公司有一项价值业务和一个增长业务，这可能是有利的。某些股东可能偏好于其中一种。在这里，股东拥有选择权，而在拆分中，他们仍然是价值业务和增长业务的股东，尽管某些股东对其中一种有强烈的偏好。如果分离实体中存在母公司股东未认的`额外股份`，公司随后可以通过第二步拆分交易来处理这些额外股份。\n\
  \n### 税务影响\n\n\n\n\n\n在这些不同的交易中，母公司和不同股东集团的税务影响往往是决定交易最终能否成功的关键。分拆（Spinoff）和剥离（split-offs）通常是具有税务效益的，因为它们的结构可能不会为股东产生税负债。然而，当存在两个截然不同的业务时（例如非常不同的增长型业务和价值型业务），分拆后的股东可能会选择出售他们不看好的业务的股份，这可能会为他们产生税负债。因此，在这种特定情况下，剥离（split-offs）在税务上可能更有利。\n\
  \n对于剥离（divestitures），产生税负债的可能性大得多，特别是当所出售的部门是多年前以低得的价格收购时。然而，即使在剥离中，卖方也可以采取某些措施来减少或可能避免不利的税务影响。这就是为什么并购税务是一个如此重要的法律领域，以及为什么不仅是交易律师，甚至包括税务律师在法律并购法律团队中也起着关键作用。\n\
  \n# 剥离对股东财富的影响\n\n虽然直觉上认为取消表现不佳的并购是件好事，但确定是否有实证证据支持或反驳这一观点非常重要。幸运的是，大约四分之一世纪的研究提供了大量的实证支持，这极大地增强了这样一种观点：通常而言，无论实施剥离的具体机制是什么，通常对股东受益。\n\
  \n表 10.1 总结了关于剥离对股东财富影响的众多学术研究中的发现。研究清楚地表明，当公司宣布出售某个业务部门时，市场反应是积极的。其他关注股权拆分（equity\
  \ carve outs）和分拆的企业研究也显示了非常理想的结果。例如，摩根大通（J.P. Morgan）在 20 世纪 90 年代中期对股权拆分和分拆的好处进行了几项研究。不出意外，他们的发现是，母公司和被出售或分拆的子公司在第一年半内（即他们的研究期间）表现都很良好。\n\
  \n![img](img/table_image_001.gif)\n\nTABLE 10.1 自愿剥离对股东财富的影响。\n\n*来源：*Patrick A.\
  \ Gaughan, *Mergers, Acquisitions, and Corporate Restructurings,* 第 5 版. (Hoboken,\
  \ NJ: John Wiley & Sons, Inc., 2011)。\n\n市场对剥离公告的积极反应基本上是市场在说：“感谢天你终于清醒了，正在把那个烂业务卖掉。”这虽然有一点幽默的夸张（对狗类也很不公平），但在许多情况下确实如此。总的来说，可以得出结论：被出售的业务部门对整个公司没有做出有价值的贡献。如果有，你会认为母公司不会摆掉它们。该部门本身可能更有价值，或者作为另一家具有更好协同效应的公司的一部分而更有价值。\n\
  \n# 往返财富效应\n\n当一家公司宣布收购时，在很多情况下市场反应是负面的。我们刚刚回顾的研究表明，当公司宣布剥离（可能是剥离先前的收购项目）时，市场反应通常是积极的。Marquette\
  \ 和 Williams 在 1980 年至 1988 年期间分析了 79 次收购和 69 次分拆。他们研究了收购以及随后对被收购实体进行分拆对股东财富的影响。他们试图确定成对的收购和剥离（他们借用房地产术语称为“翻转”\
  \ flips）平均而言产生了正值还是负值。如果值为正，那么我们可以得出结论，即使被收购的实体随后被剥离，并购仍具有积极影响。然而，他们的结果并没有显示积极或负面影响——相反，他们主要显示出中性反应。虽然他们确实发现收购有负面影响而剥离有积极影响，但综合效应在统计学上并不显著。然而，其中存在一个有趣的例外。当目标是一个研发（R&D）密集型业务时，且有证据表明母公司可能提供了资金来满足该目标的研发需求时，净效应是积极的。从假设上讲，我们可以想象这种效应：当一个资金充足的大型联合集团（如通用电气\
  \ GE）收购一个不断增长的研发密集型业务。在这里，母公司可以加速目标的增长。如果该目标不符合母公司的长期计划，那么它可能会以更高的价值被剥离，这在部分基于母公司在其拥有目标期间的资本投入。在这里，我们可以为财务协同的好处提供一个更有说服力的论点。\n\
  \n# 分拆作为增加专注的手段\n\n当公司进行分拆时，就像进行剥离或股权拆分一样，结果是它通常会变成一个更明确或更集中的实体。具体增加多少取决于从母公司分离出的部门的大小，以及该部门是否与母公司属于不同的业务。当属于不同业务时，我们将此类分拆称为*跨行业分拆*（cross-industry\
  \ spinoffs）。当属于同一行业时，被称为*行业内分拆*（own-industry spinoffs）。明显的问题是哪种类型的分拆对股东财富的积极影响最大？\n\
  \nDaley、Mehrotan 和 Sivakumar 分析了 151 次分拆，他们在包括分拆前两年和后两年的五年窗口内对其进行了跟踪。他们的研究发现分拆公告周围存在显著的价值创造。他们将这种价值创造的源头指向跨行业分拆。事实上，他们现在行业内分拆的情况下没有价值创造。例如，他们发现从跨行业分拆的前一年到分拆后一年，资产收益率提升了\
  \ 3%。然而，行业内分拆的资产收益率没有变化。此外，性能提高主要发生在母公司或存续实体上——而不是分拆部门。他们得出的直观结论是收益是因为管理层能够运营一个更集中的实体，而不必将管理精力分散到更多化的业务部门中。\n\
  \n# 增加专注类型的差异\n\n之前讨论的 Dasilas 和 Leventi 的研究也阐明了哪种增加专注的分拆对股东财富的积极影响最大。他们比较了增加工业关注度的分拆与增加地理关注度的分拆。他们发现增加工业关注度的分拆产生了积极的股东财富影响，而增加地理关注度的分拆没有。此外，对于美国分拆，工业关注度增加带来的积极市场反应大于欧洲交易。\n\
  \n# 分拆对股东财富的影响：美国对比欧洲\n\n\n\n\n\n关于出售（尤其是拆分）对股东财富的影响，大部分研究文献都集中在美国公司和市场上。然而，Boreiko\
  \ 和 Murgia 分析了 97 家欧洲拆分公司。他们发现，在欧洲，拆分通常是由他们所谓的“治理地震”触发的，例如任命新首席执行官或面临收购威胁。事实上，Shimizu\
  \ 和 Hitt 分析了一组美国剥离业务案例，同样发现任命新首席执行官会增加业务部门被剥离的概率。\n\nDasilas 和 Leventi 的另一项研究对比了\
  \ 2000 年至 2009 年间 239 笔美国和欧洲拆分公司的股东财富影响。他们发现，股票市场对美国拆分的积极反应比对欧洲拆分的反应更强。从统计学上看，股票市场对美国拆分有平均正向反应为\
  \ 4.21%，而欧洲母公司的这一比例仅为 1.36%。市场对美国拆分的积极反应并不意味着其表现优于欧洲同类公司。美国母公司的经营表现低于欧洲母公司，而欧洲母公司在拆分后的几年里在资本支出上的投入也更多。\n\
  \n公司拆分在英国比在欧洲大陆更为常见，尽管在欧洲大陆也变得越来越频繁。欧洲的典型所有结构比英国或美国更集中。这使得欧洲大陆股东除了那些通常与家族相关的的大型控股股权持有者外，其影响力都比他们的英国同胞人要小。\n\
  \n与许多关于美国拆分业务的研究一样，Boreiko 和 Murgia 的欧洲样本也显示，拆分公告具有积极的股东财富影响。与美国的发现一致的是，他们发现“增强专注型”拆分的影响（5.7%）高于“非增强专注型”交易（3.3%）。他们没有发现母公司在拆分后经营性能有所提高，但确实发现被拆分出的实体存在这种影响。改进最显著的拆分公司通常是内部增长的部门，而不是那些让母公司能够更加专注于业务的部门。这与对美国拆分业务的研究形成对比，后者倾向于仅在增强专注型的交易中显示出性能提升。\n\
  \n# 公司治理与出售\n\n经理可能不愿出售某个业务部门——尤其是如果他们在收购该部门中发挥过作用。出售最终变成了对错误的承认，这是许多经理不愿做的事情。Owen、Shi\
  \ 和 Yawson 分析了 1997 年至 2005 年间的 797 笔剥离案例。与其他相关研究一致，他们发现剥离创造了财富。然而，他们对研究文献最主要的贡献是确定了公司治理在剥离决策中所起的作用，以及正向财富影响的程度。\n\
  \n他们发现，拥有更多独立董事会和大宗股东的公司具有更积极的股东财富影响。他们的研究表明，剥离决策所需的动力比显而易见地承认部门表现不佳或该部门与公司整体不匹配要大。看来，管理层通常需要来自独立董事和大额股权持有者的压力，才能有足够的动力去做正确的事。在美国，这种压力通常来自对冲基金，他们收购低值公司的大量股票，其目标是迫使进行增加价值的企业重组。然而，在许多欧洲大陆公司，控股股东对反对公司所采取的收购策略的小股东的关注可能反应不敏感，这些小股东因此希望通过出售来向股东释放价值。这种需求在日本可能更大，因为在那里，一些臃肿且低效的企业结构的经理对世界经济的现实状况反应缓慢。\n\
  \n# 经理人所有权与出售收益\n\n许多公司已采用各种激励试图解决代理问题并使管理层与股东的利益一致。主要的补偿工具之一是股票期，这让经理也成为了所有者。这并没有消除代理问题，因为经理可能仍然从非股权来源（如薪水和福利）获得大部分薪酬。Hansen\
  \ 和 Song 分析了一组 152 笔剥离案例。他们发现，卖方不仅享有积极的股东财富影响——这些影响与经理和董事的股权持有量正相关。这是一个直观的结果，因为它表明当经理和董事在使用自己的钱进行博弈时，他们不太可能留住亏损的资产。\n\
  \n# 行动主义者与出售\n\n近年来相对显著的一个趋势是行动主义者的激进性。这些通常是对冲基金，他们监控并分析公司（特别是多元化公司），旨在观察结构性变化是否能提高股东回报。例如，2011\
  \ 年，William Ackman 和他的 Pershing Square 基金收购了联合巨头 Fortune Brands 11% 的股份。Fortune\
  \ Brands 的业务组合非常奇特，包括世界第四大酒类公司、Titleist 品牌的高尔夫产品，以及一个包含 Moen、MasterLocks、Simonton\
  \ Windows、ThermaTru Doors 等知名品牌的家居和安全业务。酒类、高尔夫产品和家居产品的结合实在很难解释。在 Ackman 的压力下，Fortune\
  \ 将 Titleist 和 FootJoy 业务出售给了一组外国投资者。\n\n行动主义者分析多元化公司的公开文件，并会试图确定某些部门是否表现出低利润率。如果是这样，那么通过出售低利润业务可以提高公司的整体利润率。从行动主义者的角度来看，如果公司的整体表现并不算惊艳，可能也比较方便。其他不满的投资者可能非常乐于接受出售低利润业务的快速解决方案——这种“解决方案”如果他们不去追求，管理层在没有外部压力的情况下可能很难解释。\n\
  \n# 市场流动性与出售部门的决策\n\n各种因素都可以促使公司出售某个部门。最明显的一个是该业务表现不佳。人们会认为这是最根本、最明显的因素。然而惊讶，Schlingemann、Stulz\
  \ 和 Walking 的研究显示市场流动性实际上更为重要。在对 1979 年至 1994 年间 168 家剥离公司的分析中，他们发现处于流动性较高的行业的公司更容易被剥离。在流动性市场中，卖方比在流动性较低的市场中更有机会获得其资产的完整价值，甚至是更高的价值。Schlingemann、Stulz\
  \ 和 Walking 通过特定时期出售资产的量来衡量流动性。因此，当公司想要作为增强专注计划的一部分剥离不相关的部门时，那些能够在流动性市场中出售的公司更有可能这样做，而面临流动性较差的市场可能会保留该部门，直到市场流动性改善。\n\
  \n# 非自愿出售\n\n\n\n\n\n虽然市场倾向于欢迎抛售，但对非自愿性抛售的反应并不相同。非自愿性抛售（例如监管程序要求的抛售）通常被市场视为坏消息，这类交易并不具备自愿性抛售所享有的积极股东财富效应。\n\
  \n非自愿性抛售通常是某些不受欢迎的监管过程的结果，例如反垄断行动。反垄断监管机构可能要求公司处置某些业务部门，例如在 `M&A` 中收购的部门。在我们所处的全球商业环境中，可能会有多个竞争政策机构，如`美国司法部`、`Federal\
  \ Trade Commission` 联邦贸易委员会以及`欧洲委员会`，它们必须予以批准。当获得这些实体的批准意味着一个本应是合并业务中有价值的部门在 `M&A`\
  \ 之后必须被处置时，市场通常不会反应良好。研究表明，非自愿性抛售无法带来积极的股东财富效应，而且往往产生负面影响。对反垄断相关抛售的研究清楚显示了负面的股东财富效应。Ellert\
  \ 对反垄断并购诉讼中 205 名被告的审查显示，在提起诉讼的一个月内，这些公司的股权价值下降了 21.86%。\n\n# 自愿性/非自愿性抛售\n\n正如我们所提到的，即使公司知道两家公司的合并从反垄断或其他监管角度来看存在问题，他们也会完成交易。当他们这样做时，通常会有一套策略来处理交易中棘手的问题。当这些问题对市场普遍广为人知时，它不应该受到负面反应，这与交易面临意外监管挑战的情况不同。例如，2012\
  \ 年 3 月，`Kinder Morgan Energy Partners LP` 于 2012 年 8 月同意以约 18 亿美元的价格将其 `Rocky Mountain\
  \ Natural Gas` 加工和管道业务出售给 `Tallgrass Energy Partners`，以获得其对 `El Paso Corp` 210 亿美元收购案的批准（该收购于\
  \ 2012 年 5 月完成）。Kinder Morgan 同意进行这次出售是为了获得 `Federal Trade Commission` 的批准。Tallgrass\
  \ 由多个实体所有，包括 `Energy & Minerals Group`、`Kelso and Co` 以及管理层。\n\n公司通常在宣布交易的同时或近期宣布一个通用解决方案，或至少表达达成共识解决方案的意愿。通常，他们、市场和媒体都能察觉到是否会有问题。为了避免市场的负面反应，明智的做法是提前给市场提个，承认问题的存在，并告知通用或具体的解决方案是什么，以及为什么它可能防止监管的阻碍。如果解决方案是可信的，并反映了可能的行业影响，且表现出对监管机构权力的尊重，它可能会受到好评。由于这个原因，此类自愿性/非自愿性出售通常不会引起市场的负面反应。\n\
  \n如今，公司在完成交易后才发现存在反垄断问题已不再常见。事实上，这正是 1978 年通过的《Hart-Scott-Rodino 反垄断改进法案》的目的。通常，公司会提前制定出一份监管机构接受的资产出售计划。如果无法达成，交易通常会被取消。另一种方案是进行交易，然后在事后与监管机构进行长期且分散注意力的战斗。通常，竞标者会输掉这场监管战斗。例外是金融服务行业，金融机构的游说力量如此强大，以至于他们可以进行非法的交易并在事后改变法律！当\
  \ `Citicorp` 收购 `Travelers` 时就发生了这种情况，根据《Glass Steagall Act》，这笔交易是非法的。这笔交易受到了现在已退休（但由于使用了股东的钱而极其富有）的\
  \ Sandy Weill 以及无所不知的“拯救世界委员会”（`Robert Rubin`、`Laurence Summers` 和 `Alan Greenspan`\
  \ 的推动和/支持。回想起来，他们并非无所不知，但至少 Sandy Weill 和 Robert Rubin 部分是因为此类交易才变得更加富有。股东们则遭受了完全不同的结果。再次，股东永远不应期望对糟糕的工作获得道歉——只有借口，甚至是赤裸裸的谎言。\n\
  \n# 自愿性防御性抛售\n\n公司可以采取广泛的防御行动以防止其在敌意收购中被收购。在其他章节中，我们将其分为预防性措施和主动措施。预防性措施是指在特定的敌意威胁之前采取的行动，例如实施\
  \ `poison pill plan`（毒丸计划）或颁布某些 `antitakeover charter amendments`。研究表明，当抛售被用作反收购手段时，它们可能无法产生具有其他基本战略目标的抛售那样的积极股东财富效应。\n\
  \n在 1980 年至 1987 年的 59 家公司样本中（其中 13 家涉及收购投机），`Loh, Bezjak, and Toms` 发现，在抛售日期前的一日内，累积平均异常收益为\
  \ 1.5%。然而，当他们将样本分为两个子样本——具有收购投机和没有收购投机的公司时——那 13 家收购投机目标公司并未显示出股东财富的任何显著变化。这些结果表明，当公司通过抛售防止自己被收购时，市场会对这些交易进行不同的处理，且不将其视为积极的改变。\n\
  \n有时这些变化涉及出售昂的资产，使得卖方/目标公司现在对竞标者更有吸引力。这可能导致市场的负面反应，因为它也可能导致一个对股东价值较低的重组公司。此外，此类变化可能被市场视为管理层固化的信号，即经理为了维护自己的职位以及随之而来的薪酬福利，而不是为了改善整个公司。\n\
  \n# 跟踪股票\n\n公司可以创建一种新股票，这种股票没有所有权，但支付的股利取决于公司内部特定子部门的盈利。例如，`Loews Corporation` 创建了一种名为\
  \ `Carolina Group` 的跟踪股票，它跟踪 `Lorillard` 烟草公司的表现，该公司是 `Loews` 集团伞下的一个部门。美国烟草公司产生稳定的现金流，但伴随着诉讼相关的债务，会降低其股权价值。当母公司拥有烟草子公司时，该部门会降低整个公司股票的价值。创建跟踪股票是尝试向股东释放烟草部门的价值，同时也试图保护母股东免受该部门负面影响的影响。`AT&T`\
  \ 创建了此类股票以便释放其无线业务的部分价值。\n\n当公司确定其内部部门的价值未体现在母公司的市值中时，可能会发行跟踪股票。例如，一家大型多元化但增长缓慢的公司可能会创建跟踪股票，让市场从其某个部门可能发生的增长中获益。\n\
  \n\n\n\n\n对追踪股票的早期研究对这类股票描绘了有利的前景。例如，D'Souza 和 Jacob 发现，在宣布拟发行追踪股票后的三个交易窗口内，股价出现了统计学上显著的\
  \ 3.61% 的反应。他们试图确定创建追踪股票是否能实现公司作为完全独立实体时可以获得的某些益处。为了探索这一点，他们研究了追踪股票收益与公司整体之间的相关性，以及追踪股票收益与其所属行业相似公司收益之间的相关性。他们发现，母公司与追踪股票收益之间的相关性高于追踪股票与其行业同类公司之间的相关性。也就是说，他们发现`公司效应`\
  \ 大于`行业效应`。他们假设公司效应的存在是因为部门与母公司之间共享了资源和负债。\n\n虽然 D'Souza 和 Jacob 的研究发现了追踪股票具有积极的股东财富效应，但随后的研究结果并不那么乐观。Billett\
  \ 和 Vijh 研究了 1984 年至 1999 年间完成的 29 宗追踪股票重组。他们发现，追踪股票的股东在发行后经历了显著的财富`损失`。母公司的股东获得的收益不显著，尽管他们在追踪股票重组公告前的一年里遭受了负收益。这些公告前的负收益并不令人意外，因为发行追踪股票通常是尝试解决母公司表现不佳的一种部分性解决方案。虽然创建追踪股票似乎停止了负收益，但该事件并未表现出早期追踪股票财富效应研究中所示的积极股价反应，也没有表现出出售带来的积极股东财富效应。\n\
  \n回首过去，公司似乎试图将追踪股票作为一种处理业务部门问题的较不激进的解决方案，可能是某个与公司整体不匹配的先前的收购。最初，市场对这些尝试的解决方案反应积极。随后，市场开始将这些步骤视为仅仅试图将问题掩盖之的手段。因此，市场对追踪股票失去了兴趣。\n\
  \n创建追踪股票并解决公司契合度不佳的问题。解决方案是出售该部门并更有效地利用资源。\n\n# 激进的解决方案：自愿破产\n\n某些大型企业（也许是包含许多多元化业务的公司）可能会（在有许多例外的情况下）损害股东价值。在这种情况下，一种激进的解决方案可能是简单清算公司。在这种场景下，所有业务部门都被出售，负债得到偿还，净收益被用于向股东支付清算股息。与其他重组形式一样，我们参考研究来指导此类行动是否符合股东利益。与不激进的重组形式（如出售特定部门）一样，市场对比出售所有部门和清算公司持良好态度。这样做之后，资金将返回给股东，他们可以根据自己的最佳用途使用这些资金，而不是依赖公司经理释放为了让股东闭嘴而释放的极少资金。\n\
  \n关于自愿破产的一项早期研究由 Skantz 和 Marchesini 完成，他们分析了 1970 年至 1982 年间 37 家公司发布的清算公告，发现它们在公告当月期间产生了平均\
  \ 21.4% 的超额收益。Hite、Owers 和 Rogers 在其样本中的 49 家公司宣布自愿清算的当月（涵盖了 1966 年至 1975 年），也发现了类似的积极股东财富效应。他们显示，公告当月的异常收益为正，等于\
  \ 13.62%。他们样本中几乎一半的公司在清算计划公告后的两年内成为控制权收购的目标。这些收购包括广泛的行动，例如杠杆收购（`LBOs`）、要约收购和代理人战。此外，他们样本中超过\
  \ 80% 的公司显示出正异常收益。这表明股票市场认为，按照先前的运营政策继续运营公司将减少股东财富。\n\n积极的股市反应得到了另外两个研究的证实。Kim 和\
  \ Schatzberg 发现，73 家正在清算的公司在与清算公告相关的三天内获得了 14% 的积极收益。他们揭示了当股东确认交易时，收益又增加了 3%。Kim\
  \ 和 Schatzberg 未检测到收购公司股东存在任何显著的（无论是积极还是负面的）财富效应。在对 1970 年至 1991 年间完成自愿清算的 61 家上市公司的研究中，Erwin\
  \ 和 McConnell 发现，自愿清算与平均 20% 的更高平均超额股票收益相关。他们还证实了直觉预期：决定自愿清算的公司面临的增长前景有限。清算决定是理性的，因为它释放了财务资源以将其用于更高收益的替代方案。正如之前提到的，这些研究表明，股票市场往往认为，按照先前的运营政策继续运营公司将减少股东财富。这并不意外，因为大多数考虑清算的公司通常正面临严重问题。清算随后释放了公司的资产，让其他可能对这些资产实现更高回报的公司可以使用。\n\
  \n虽然对全面拆分的研究是非常积极的，但总存在着值得注意的例外。例如，1996 年，当英国联合企业集团 Hansen 宣布它将剥离几乎所有的业务，仅保留一小部分建筑材料业务时，市场表现出负面反应。对此的普遍解释是，市场倾向于该公司收购多元化业务并尝试改进它们的策略，而通过对其几乎所有部门进行激进剥离，它实际上从根本上退出了这种“待转类”业务领域。\n\
  \n# 近期出售积极股东财富效应的重大例外\n\n虽然对出售产生积极股市反应的研究通常非常积极，但仍有很多例外。此外，市场对某些近期发生的出售并未产生积极反应。例子包括\
  \ CBS–Viacom 分拆以及 Sara Lee 的首次拆分公告。\n\n\n\n\n\n虽然 CBS–Viacom 的交易是一次巨大的失败，但它仍然比 AOL–Time\
  \ Warner 的交易要好得多。这两者都证明了许多高薪的媒体和娱乐行业高级高管在涉及并购时，完全不知道自己在做什么。对于某些人来说，他们主要的技能是在损害股东利益的前提下，为自己争取尽可能多的报酬。当低迷的股价对\
  \ Viacom 及其首席执行官 `Sumner Redstone`（萨姆纳·雷德通）拆离 CBS 产生巨大压力时，市场并未给予该公司典型的积极股价回馈。其原因可能是，如果市场认为拖累股价的问题仍然存在，他们就不会改变对该只股票的评估（请阅图\
  \ 10.6）。在 CBS 分离后，Viacom 仍旧由其大股东 `Sumner Redstone` 运营的公司。因此，市场赋予了所谓的“大亨折扣”（`mogul\
  \ discount`）。这种折扣市场有时应用于那些没有表现出正常公司治理且对所有股东的利益不敏感，而是以非常专权的方式运营的公司。因此，这次拆分虽然在规模上是一次大交易，但并没有解决公司的根本问题。\n\
  \n![img](img/n10f006.gif)\n\n**图 10.6** Viacom 股价与市场对比\n\n*来源：* 雅虎财经（Yahoo! Finance）。\n\
  \n回顾 Viacom 首席执行官在两家媒体巨头进行 800 亿美元合并时说的话，以及他们在宣布拆分时说的话是非常有意义的。\n\n1999 年合并时，Viacom\
  \ 首席执行官 `Sumner Redstone` 表示：\n\n> *这次令人兴奋的合并创造了当今行业领先的媒体公司，以及一个在未来长期都能让股东受益的动态增长平台。我们的联合将是*王*[此处为强调]——不仅在内容上，而且在分销、营销和包装方面。我们将成为媒体和娱乐行业各个领域的全球领导者，从第一天起就财务强劲，并拥有一令人向往的全球品牌阵容。²⁸*\n\
  \n随后，在不到六年后，同一位首席执行官 `Sumner Redstone` 宣布了如下：\n\n> *我们相信，将业务拆分为独立且强大的运营实体将使我们能够优化资本结构，并创造对不同目标的投资者更具吸引力的独特投资……此外，这些新的上市实体可以各自追求能够最大化实现其长期潜力的战略路径。²⁹*\n\
  \n市场对这次拆分没有做出积极反应也并不奇怪。在不到六年前策划了那次失败合并策略的同一班管理层仍然在主导局面。市场如何能感到兴奋并提供通常此类拆分所能获得的积极股东财富效应呢？\n\
  \n`Sumner Redstone` 非常看重自己，考虑到他从经营一家区域性剧院连锁到成为一家巨型媒体集团首席执行官的历程，人们不得不承认他在长长的职业生涯中取得了巨大的成功。然而，这类大亨的一点特点是，他们似乎认为自己怎么做都是对的。他策划了与\
  \ CBS 的合并，在这项交易中，Viacom 不需要支付溢价（因为这是一次*合并*而非收购），而且当 Viacom（一家他保持投票控制权的公司）发行无投票股时，他也没有失去对公司的投票控制。他能够控制一个不断扩大的媒体帝国。遗憾的是，`Redstone`\
  \ 收购 CBS 存在一些重大的战略缺陷。CBS 对广告支出的变化非常敏感。广告具有很强的周期性，因此在景气良好的时期，像 CBS 这样很大比例收入来自广告的公司会表现良好。然而，如果我们经历了深度的经济衰退（如\
  \ 2008 年到 2009 年那样），且随后的复苏停滞不前，像 CBS 这样的企业就会拖累 Viacom 这样的公司。因此回想起来，这次媒体合并像许多其他交易一样，简直是一次大大的失败。³⁰\n\
  \n莎拉李（Sara Lee）的案例与 CBS–Viacom 相似之处在于，拆分证明并不是万灵药，但不同之处在于，莎拉李的问题并非源于一个受自我膨驱动的大亨在做出昂贵的并购决策。2005\
  \ 年宣布公司计划出售 40% 的资产，以及随后在 2006 年剥离汉内斯品牌（Hanesbrands）和欧洲肉类部门，是对一个没有任何协同效应的多元化资产功能失调组合进行的部分修复。2006\
  \ 年之前，这家公司是一个庞大的集团乱团，而 2006 年之后，它只是一个规模小小但同样同样混乱的乱团。因此，在经历了最初的碎片化重组尝试后，公司的内在问题仍然存在——只是规模小了。因此，市场选择不对比这些部分修复做出显著的股价增长。\n\
  \n这些示例以及其他案例，包括泰科（Tyco）、莎拉李（Sara Lee）和邓白氏（Dun and Bradstreet），表明，并非所有的出售剥离都会获得积极的股票反应。如果你是一家从根本上就有缺陷的公司，或者你的管理层在出售前后的表现都令人存疑，那么不要期望通过出售来获得回报，因为这种出售可能很久以前就该发生了，而且并没有解决公司的核心问题。另一方面，如果你通常上是一家管理良好的公司，并且决定某个业务部门（可能是某次失败的收购）不再适用且你希望集中精力，那么市场很可能会欢迎这一战略举措。\n\
  \n### 第 11 章 估值与合并策略\n\n准确确定目标价格的正确估值分析，是判断一项交易成功与否的关键因素。无疑，有很多公司在任何价格下都不是理想的收购对象。糟糕的收购（例如戴姆勒与克莱斯之间失败的巨案）会吸收大量的公司资源，对收购方的组织产生多种负面影响。然而，对于许多公司来说，存在一个能够让买家从交易中获益的价格。当买家支付超过这一*真实价值*时，除非他们采取某些异常措施来克服支付过高的问题，否则将会遭受损失。\n\
  \n\n\n\n对于财务买家（如私募股权公司），估值过程有些不同，这些公司有时仅仅是为了进行业务转手。尽管他们有时会谈论合并他们已购买的某些公司并实现协同收益，但这通常仅仅是空空中楼阁。私募股权买家通常试图收购一个估值过低的目标公司，在持有期间，他们尝试采取措施提高其盈利能力。这通常包括削减成本措施和短期调整，使他们能够在不不远的将来以更高的价格卖出目标公司。遗憾的是，这通常还涉及让被收购的公司背负大量债务，他们从中提取贷款资金自用，而不是将资金投资于改善公司。令人惊讶的是，贷款人如此热于资助这些所谓的`股息再融资`（参见图\
  \ 11.1），同样令人惊讶的是，这些负债实体的未来买家愿意比私募股权买家支付高得多的价格来购买这家当时风险更高的公司。有一点是很明确的：从估值的角度来看，非财务买家和卖家在与私募股权公司交易时需要非常谨慎，因为私募股权公司似乎往往在交易中占优。问题的部分似乎在于非财务方进行了不切实际且天真的估值分析。\n\
  \n![img](img/n11f001.gif)\n\n**图 11.1** 为私募股权股息而出售的债务量\n\n^*使用 2012 年 10 月 19 日的数据进行年化处理。\n\
  \n*来源：*Standard & Poor's Capital IQ LCD，《华尔街日报》，12/10/19\n\n在我们讨论非财务买家之前，如果我们留下一他们所做的只是为自己提取收益而几乎不产生价值的印象，那是对私募股权行业不公平的。这种情况确实发生得过于频繁。然而，他们也从事相反的事。一个极好的例子是由\
  \ `Cerberus Capital` 领导的私募股权集团在 2006 年收购多家 Albertson 商店时所做的投资，而另一家超市连锁 `Supervalu`\
  \ 收购了其他 Albertson 商店。这是一个极好的实验，证明了哪种类型的买家应该产生最大的价值。从表面上看，我们本应预期在该行业运营多年的 `Supervalu`\
  \ 管理层表现优于私募股权的“新手”。然而，私募股权买家聘请了一支经验丰富的管理团队，并根据需要为其提供投资资金。他们能够使业务盈利，而 `Supervalu`\
  \ 却无法让其旗下商店产生利润。此外，基于私募股权的集团在积极削减表现不佳的商店和削减劳动成本。`Supervalu` 集团似乎采用了他们传统的管理方法，没有以私募股权团队那种进取且开放的态度来对待业务。2013\
  \ 年，由 `Cerberus` 领导的集团收购了 `Supervalu` 持有的商店。这是 `Cerberus` 向潜在投资者讲述的一个绝佳故事，特别是对于那些记忆力短的投资者，他们可能不记得它在\
  \ `Chrysler` 上做过的那次非常糟糕的投资，在那次投资中所有的股权都被清除了。\n\n然而，非财务买家通常具有更长期的关注，并且往往希望实现更长期的收益。对于这些买家来说，我们在第\
  \ 3 章中讨论的可能导致协同收益的因素可能非常重要。对于财务卖家来说，这些因素更多只是在向非财务买家推销时用来讨论的话题。非财务买家需要有明确的战略重点。目标必须符合非财务买家的需求，或为其提供一个长期机会。因此，非财务买家的时间范围必然比财务买家长，因为后者寻找的是最佳时机（通常是最短的时间）来转手目标。\n\
  \n# 目标与竞价方估值效应\n\n在进行交易之前，交易者需要意识到并购（M&A）的估值效应，以及这些效应对于竞价方和目标何不同。好消息是，关于这些效应有大量的研究。坏消息是，大多数交易者以及相关公司的管理层和董事不知道这些研究。因此，我们拥有看似无穷无尽的糟糕交易和定价不合理的交易，并不意外。\n\
  \n许多研究都考虑了并购的估值效应。许多研究采用事件研究法，分析市场对交易公告的短期反应。\n\n许多经常被引用的估值效应研究是在 20 世纪 80 年代初完成的。然而，它们的结果也适用于随后的时期。一些较新的研究，例如考虑较长时间内收益规模的研究，以及研究交易媒介对收益影响的研究，在本章后面部分也会进行讨论。²\n\
  \n关于并购估值效应的研究有五个普遍结论：\n\n1. **1. 目标股东从合并协议中获得正收益**。多项研究表明，对于友好的协商报价，目标普通股股东获得了具有统计学意义的正向异常收益。³这种收益的来源可以追溯到目标股东收到的溢价。因此，这个结果非常直观，如果不是显而易见。\n\
  \n2. **2. 目标股东从要约收购中获得更高的显著正收益**。敌意要约收购的目标普通股股东也获得了具有统计学意义的正向异常收益。⁴敌意收购过程可能会创造一个竞争环境，这可能会提高收购公司的报价，并导致目标股东的收益比友好交易中的收益还要高。再次，这是一个直观的结果。这也是为什么美国法院鼓励待售公司的董事促进拍卖过程的根本原因，也是为什么他们惩罚那些采取措施阻止拍卖过程且未履行特拉华州法下所谓`Revlon\
  \ 义务`的人的原因。\n\n3. **3. 目标债券持有者和优先股从收购中获益**。优先股股东和优先债券持有者在收购时都获益。⁵考虑到收购方通常比目标公司大，收购方及其资产作为另一个保护来源应该降低优先股和债券的风险，使其更有价值。与目标普通股效应一样，这是一个直观的结论。\n\
  \n4. **4. 收购方股东从合并中往往获得零或负收益**。当公司进行收购时，收购方股东通常表现并不好。这些效应要么在统计上不显著，要么是轻微负的。可能这反映了市场对收购方是否能获得足以抵消其为目标支付溢价的协同收益持有怀疑。与其相比，收购方的股票反应较小，部分是因为收购方通常比目标公司大。\n\
  \n\n\n在本章的后半部分，我们将探讨收购方股东财富的影响，并将其视为收购方规模与其目标公司规模的函数。我们发现，较大的交易通常表现不佳。我们还将比较私有收购者与上市公司竞标者的表现。我们看到，私有收购者往往不会支付过溢价，且表现更好。我们还会看到，当收购方的股权分布中存在某些大股东，或者当董事会由外部人士主导时，收购方股东的财富影响可能较那么负面。这类公司支付过价的可能性小得多。\n\
  \n## 5. 收购公司股东从要约收购中获得的回报很少或没有回报。\n\n在恶意收购后，收购公司股东的回报非常不尽如意。有迹象表明，回报可能从轻微正值到零不等。再次，这些发现并不令人意外，尽管坦率地说，它们没有表现出更明显的负面影响这一事实可能有点意外。这是因为在恶意收购中，竞标者往往面临更大的压力去支付更高的溢价，以克服目标公司的抵抗。此外，拍卖中激进的报价者更容易陷入“获胜者诅咒”。\n\
  \n## 什么样的收购公司表现最差？\n\n鉴于收购公司在并购中通常表现不佳，问题随之产生：在追求并购时，哪些类型的公司表现差，哪些更好？Rau 和 Vermaelen\
  \ 分析了 1980 年至 1991 年间 3,169 宗合并和 348 宗要约收购的样本。6 他们将“魅力型公司”（`glamour firms`，市净率低且收益和现金流增长快的公司）与“价值型公司”（`value\
  \ firms`，市净率较高且前期表现较差的公司）进行了比较。他们的研究结果显示，魅力型公司的表现优于价值型公司。正如其低市净率所示的那样，市场更容易被魅力型公司吸引，这些公司可以夸耀其较高的收益和现金流增长。另一方面，价值型公司没有被市场评价得那么高，这从它们较高的市净率反映出来，可能是由于其财务表现相对较差。\n\
  \nRau 和 Vermaelen 将魅力型公司较差的并购表现归因于自大（hubris）等因素。他们还注意到，魅力型公司往往更倾向于用股票支付。这是可以理解的，因为他们的股票价值比所谓的价值型公司的价值更高。因为它们是魅力型公司，市场对其股权的估值很高——可能比系统性估值所指示的要高。因此，这些公司有动力使用这种估值较高的股权为报价提供资金，因为这使他们能够以“折扣”价格收购目标。\n\
  \n## 溢价\n\n当竞标者考虑对目标公司提出报价时，一个关键问题是为目标公司支付多少溢价。溢价随行业和市场状况而异。图 11.2 显示了美国公司在 1980\
  \ 年至 2011 年期间支付溢价的时间序列。\n\n![img](img/n11f002.gif)\n\n图 11.2 市场价格溢价：1980–2011\n\n\
  *来源*：*Mergerstat Review* 和 [Econstats.com](http://Econstats.com)。\n\n## 合并溢价的历史趋势\n\
  \n合并溢价随时间变化。当我们回顾最近的两次合并浪潮时，我们发现在两次浪潮的初期和中期，合并溢价实际上低于平均水平。有趣的是，当我们考虑到 Moeller、Schlingemann\
  \ 和 Stulz 的研究时（该研究显示在第五次合并浪潮后期，收购方遭受了巨大的股东损失），这两种现象是可以联系的。7 正如我们在下一节中讨论的，第四次和第五次合并浪潮后期的溢价都在上升（见图\
  \ 11.2）。虽然在第四次浪潮结束经济进入衰退时这些溢价有所下降，但在第五次浪潮结束后，合并溢价仍然急剧上升。事实上，2002 年和 2003 年的溢价分别达到了\
  \ 59.7% 和 62.3%，尽管在第五次浪潮结束的中断后合并浪潮才刚刚开始回升。\n\n## 股市活动与合并溢价\n\n股市的正常波动导致股价的涨跌超过了收益或股利变化所能解释的范围。8\
  \ 这会导致某些股票在某些时候被高估，而在另一些被低估。经理们知道在熊市中，他们的股价可能低于公司的长期价值。由于认为股价只是暂时被低估，经理们倾向于在熊市中拒绝出售，除非有高于平均水平的溢价。因此，卖方希望采取长期关注，而竞标者则想机会主义地关注目标公司股价的短期波动。同样，在牛市中（例如\
  \ 1994 年至 1997 年期间），竞标者不太愿意支付同样的平均溢价，因为他们知道市场已经高估了股权。在此期间，平均溢价下降，这正如我们预期的那样（见 11.2）。然而，随着市场在\
  \ 20 世纪 90 年后期继续上涨，溢价也随之上升。这意味着目标股价继续上涨，尽管这些公司的盈利能力理应没有增长。竞标者并没有像在 1994 年至 1997\
  \ 年那样收敛溢价，而是在通胀股价的基础上提供了更高的溢价！Moeller、Schlingemann 和 Stulz 的研究结果并不意外，在 1998 年至 2001\
  \ 年期间，收购公司股东总共损失了 2400 亿美元！\n\n当并购浪潮席卷而来时，特别是在并购浪潮赖以生存的经济繁荣环境中，经理们起初可能比较理性，但快速上涨的股权价值会让他们冲昏头脑。自大会迅速入侵他们的思维。潜在竞标者的经理很快开始认为，他们公司股票价值的增长是因为他们所付出的巨大努力。然而在大多数情况下，这只是非理性市场的提振作用，甚至是完全的泡沫。当\
  \ CEO 可以指出其执政期间公司股权表现优异时，董事会很难告诉他他的下一个伟大的并购想法主思得并不周。不幸的是，他们和他们的董事会开始相信 CEO 的新闻剪报。问题的部分原因在于媒体也相信这些胡说，而这种感知随后渗透到整个商业界。\n\
  \n## 股市驱动型收购\n\n当市场上涨时，竞标者在股换股交易中用于收购目标的“货币”价值随之上涨，这似乎合逻辑。然而，在这样的股票交易中，市场上涨时目标公司不是也被高估了吗？这些影响会相互抵消吗？答案是：取决于情况。\n\
  \n\n\n\nShleifer 和 Vishny 提出了一个基础模型，该模型在某种程度上有助于解释决定竞标者将使用股票还是现金报价的决策过程。一个关键因素是两家公司的\
  \ `relative valuations`（相对估值）。也就是说，如果收购者的股票价格比目标公司更高估，那么收购者更有动力进行股票融资的报价。因此，我们发现，不仅在市场上涨时，当估值差异变大（即某些公司比其他公司更被高估）时，也会看到更多股票融资的估值。此外，收购者所感知到的协同收益越高（无论正确与否），收购者支付溢价的可能性就越大。而且，这些条件越普遍（高市场估值且估值具有高度异质性），为并购浪潮提供了越肥沃的条件。\n\
  \n# 收购溢价的决定因素\n\n收购溢价的大小通常归因于收购者对收购收益的估计以及目标公司议价能力的强弱共同作用。收购收益可能来自多种来源，包括合并收购者和目标公司后预期的协同效益，或者目标公司的价值被低或管理不善。收购者的议价地位也可能受到几个因素的影响，包括其他竞标者的存在以及目标公司反收购防御的强度。Varaiya\
  \ 分析了 1975 年至 1980 年间 77 交易中这些各种因素在决定收购溢价方面的作用。他发现，竞争力量在拍卖过程中的作用以及反收购措施的存在对决定溢价有显著支持，但对于预期收益的作用，结果却不一。这是一个令人失望的结果，因为人们会认为在一个深思熟虑且理性的世界里，预期收益应该是报价溢价大小的关键决定因素。\n\
  \n# 战略并购的溢价\n\nRoach 调查了战略性并购的控制权溢价是否比缺乏此类战略重点的交易更高。非战略性收购被批评为对收购公司增加价值甚微的交易。从理论上讲，如果战略性交易更有价值，卖方应该处于更有优势的要求更高的溢价。在对\
  \ 1992 年至 1997 年间 1,446 交易的研究中，Roach 未能发现那些合并公司具有相同或不同 SIC 代码的交易中，其控制权溢价存在任何差异。这意味着战略重点并不是并购溢价的决定因素。\n\
  \n从表面上看，Roach 的发现似乎违背直觉——特别是考虑到我们之前对协同效应的讨论，以及对协同效应的希望如何为合并实体带来更高的利润。然而，当我们将 Roach\
  \ 的结果与 Varaiya 的发现结合起来时，它们描绘了一幅不安的画面。令人惊讶的是，当经理决定为目标公司支付多高的溢价时，协同效益并没有处于首位——尤其是在竞争激烈的拍卖中。有时，他们议程中更重要的事项似乎是与其他竞标者斗争并克服目标公司的抵抗。在这些错位的推理中，存在着过度的自大和傲慢。\n\
  \n# 傲慢与并购溢价\n\n许多年前，Richard Roll 提出了一个有趣的假设，解释了经理有时会寻求收购其他公司的原因。他关注了“自大”（hubris，即收购公司管理者的自豪感）在解释收购方面可能起的作用。自大假设意味着，经理寻求收购公司是为了自己的个人动机，而收购公司可以获得的纯经济收益并非收购的唯一动机，甚至不是首要动机。\n\
  \nRoll 及其其他人研究了这一假设，以观察是否有证据可以解释为什么经理可能会对一家市场可能已经正确估值的公司支付溢价。他们声称，经理将自己的估值叠加在客观确定的市场估值之上。他们的观点是，管理层的自豪让他们相信自己的估值优于市场。该理论隐含了一个深层信念：市场是有效的，并且可以提供公司价值的最佳指标。\n\
  \n涵盖四个世纪的大量研究支持了自大假设，将其作为许多收购和竞标者支付溢价的解释。早期研究试图观察交易公告是否会导致目标公司价格上涨而收购者价格下跌，从而使两者结合产生净负面影响。各种研究支持了这些效应的部分或全部。\n\
  \n# 早期研究\n\n许多研究表明，收购公司宣布收购会导致收购者股票价值下降。Dodd 发现，在计划收购公告后，收购者获得了具有统计学显著意义的负收益。其他研究也证明了类似的发现。然而，并非所有早期研究都支持这一结论。Paul\
  \ Asquith 未能发现收购公告后股价下跌的持续模式。\n\n对于被发现在收购后财富增长的目标股东来说，其价格的积极影响存在更广泛的共识。Bradley、Desai\
  \ 和 Kim 显示，要约收购会导致目标公司股东获得收益。诚然，要约收购的敌意性质应该比友好的收购要约产生更大的股价变化。然而，大多数研究显示，目标股东在友好和敌意报价后都能盈利。此外，正如我们已经讨论过的，Varaiya\
  \ 显示竞标者倾向于支付过高。\n\n在一项研究报价溢价与收购者和目标公司合并市场价值关系的研究中发现，竞标者支付的溢价相对于目标公司对收购者的价值来说太高。关于目标股票上涨和收购者股票下跌合并效应的研究似乎并未为自大假设提供强有支持。Malatesta\
  \ 研究了综合效应并发现，“证据表明，导致并购的长期事件序列对合并后的财富没有净影响。”然而，可以反驳的是，Malatesta 未能发现正收益恰恰支持了自大假设。\n\
  \n# 后期研究\n\n一些最近的研究通过不同的处理方式支持了自大假设。通过对 106 宗大型收购进行采样，Hayward 和 Hambrick 发现 CEO\
  \ 的自大与支付溢价的大小正相关。自大通过公司近期表现和 CEO 的自我重要感（通过媒体赞誉以及相对于公司第二高薪高管的薪酬来反映）等变量进行衡量。该研究还考虑了独立变量，如通过在该职位年限衡量的\
  \ CEO 经验，以及通过内部董事与外部董事人数对比衡量的董事会警惕性。\n\n\n\n\n其他研究为涉及外国公司收购美国公司的“傲慢假设”（hubris hypothesis）提供了支持。通过使用与\
  \ Roll 理论类似的股东财富效应反应，在 1981 年至 1990 年期间 100 笔跨国交易的样本中，Seth、Song 和 Pettit 发现，傲慢在这些交易中发挥了重要作用。其他因素，如协同效应和`管理主义`（managerialism）也发挥了作用。管理主义与傲慢在某些之处相似，两者都可能对目标公司支付过高。然而，在管理主义中，竞标者的管理层是有意支付高价以追求自己的利益，即使这样做是以股东的利益为代价——而他们对股东负有受托义务。\n\
  \nMalmendier 和 Tate 调查了过度自信在 394 家大公司交易中所起的作用。他们通过 CEO 倾向于过度投资自己公司的股票倾向来衡量过度自信，并根据他们在媒体上的言论判断哪些人是过度自信的。他们发现，样本中过度自信的\
  \ CEO 组组进行收购的可能性高出 65%。他们还确定，过度自信的 CEO 更可能进行低质量的、`破坏价值`的收购。Billet 和 Qian 通过研究 1980\
  \ 年至 2002 年间 2,487 位 CEO 和 3,795 笔交易的收购历史，进一步研究了过度自信的作用。拥有收购成功经验的 CEO 更可能追求其他收购。这些\
  \ CEO 在随后的交易前对公司股票的净买入量比第一笔交易前更大。他们将这一结果解释为这些 CEO 过度自信，并将原始交易的成功归功于自己的管理能力和卓越的洞察力。\n\
  \nAtkas、de Bodt 和 Roll 显示，过度自信且充满傲慢的 CEO 倾向于更快速地交易，交易之间的间隔时间更短。他们还注意到存在`学习效应`，即过去做过更多交易的\
  \ CEO 倾向于行动更快，且交易之间的时间更短。这种学习效应在这些相同作者的其他研究中得到了支持。显然，思科（Cisco）和甲骨文（Oracle）等公司已经了成功的并购学习过程。\n\
  \n# 收购中的赢家诅咒假设\n\n收购中的赢家诅咒（winner's curse）是一个讽刺性的假设，认为高估目标公司价值的竞标者最有可能赢得竞标比赛。这是由于他们更倾向于支付高价，并击败那些更准确评估目标价值的对手。这一结果并非收购特有，而是普通竞标竞争的自然结果。这种现象经常发生的较公开的论坛之一是棒球和篮球等职业体育的自由球员市场。事实上，在职业体育中，这类例子多得不在。一个著名的例子是针对游击手（后来的三垒手）亚历克斯·罗德里格兹（Alex\
  \ Rodriguez）的竞标。德克萨斯游骑队通过对这名内野手支付高价，击败了纽约大都会（New York Mets）等其他球队。这样做，他们限制了自己获得其他自由球员的能力。罗德里格兹从未能帮助德克萨斯赢得冠军，当游骑者队陷入困境时，他们将那份沉重合同的剩余部分甩给了纽约洋基队，而洋队的工资单已经膨胀。在纽约期间，罗德里格兹与其他许多优秀球员在一起，整支球队赢得了冠军。然而在随后的几年里，他们也受限于他的高额合同，因为他在季后赛中因表现极其糟糕而不得不被移出阵容。德克萨斯（以及随后间接的纽约洋基队）赢得了竞标比赛，但总体而言，他们因支付过高而在交易中赔了。通过这样做，他们获得了赢家诅咒。\n\
  \n体育自由球员竞标过程与某些并购拍卖之间有许多相似之处。参与竞标竞争的竞标者经常发现，当价格过高时很难退出。这的一个经典例子是加拿大房地产大亨罗伯特·康缪（Robert\
  \ Campeau）对联邦百货商店（Federated Stores）的竞标。康缪此前收购了规模非常大的盟军百货连锁店（Allied Stores）。我们将在接下来的案例研究中详细讨论这场竞标比赛。\n\
  \n# 康缪的巨型惨败\n\n罗伯特·康缪（Robert Campeau）是一位加拿大房地产大亨，尽管他在加拿大房地产市场取得了巨大成功，但他认为这使他具备了进入美国百货商店市场所需的专业知识。1986\
  \ 年，他收购了美国排名第六大的百货商店连锁——盟军百货（Allied stores）。这笔交易杠杆极高，并带来了通过削减成本和出售资产来偿还债务的需求。盟军百货是市场上的主要参与者，拥有\
  \ Ann Taylor、Brooks Brothers、Jordan Marsh 和 Sterns 等连锁店。百货零售与房地产之间的联系虽然有些牵强，但确实有一些共同元素。这些大型零售连锁店可以作为大型商场的锚石店，而大型商场本身就是房地产投资。康缪懂房地产，但他的业绩记录显示他不懂零售。\n\
  \n康缪并不满足于改进和充分利用盟军百货，他想成为世界上最大的百货商店集团 CEO。1988 年，他收购了…………商店品牌，如 Abraham & Straus、Bloomingdales、Bullocks、Filenes、I.\
  \ Magnin 和 Ralphs。虽然盟军百货可能需要改进，但联邦百货（Federated）由经验丰富的零售高管运营得较好，他们对这个行业的了解远胜于新手的康缪。\n\
  \n[content]\n1988 年 1 月，康缪出价每股 47 美元，溢价约为 42%。联邦百货不想落入这个行业入侵者之手，于是寻找了“白衣骑士”。梅西百货（May\
  \ Department Stores）和梅西百场（Macy's）加入战，并引发了竞标赛。如果我们要猜这三个竞标者中——经验丰富的零售商梅西或梅西，还是新晋零售商康缪——谁最可能支付高价，我们必须选择康缪。罗伯特·康缪得到了投资银行的协助，例如第一波士顿银行已故布鲁斯·沃特斯坦（Bruce\
  \ Wasserstein）以及他自己的公司 Wasserstein Perella。然而，并购的业绩记录提供了太多例子，银行家本应该且可能确实知道，为了换取丰厚的费用，他们支持了高杠杆且溢价的报价。\n\
  \n梅西百货在价格过高时是第一个退出的。梅西百场（Macy's）坚持了下来，但也决定放弃报价——在此之前，它成功让康缪以 11 亿美元的价格出售了 I. Magnin\
  \ 和 Bollock's，同时向梅西支付了 600 万美元以支付其费用和支出。\n\n\n\nCampeau 似乎并不在乎额外的支出。这些资金源于不断增加的债务，这些债务将用于资助一项溢价高达\
  \ 120% 的收购！投资银行和其他房地产巨头，例如爱德华·德巴巴托洛（Edward DeBartolo）以及奥林匹雅亚和约克的赖希曼家族，也提供了昂贵的融资。投资银行提供了过桥贷款，这些贷款必须在即将崩溃的垃圾债券市场中进行融资。Campeau\
  \ 最终支付的混合利率在 16% 到 17% 之间！\n\n与那个时期的许多失败的高杠杆交易一样，人们支付了高额溢价，并基于估值模型中过度乐观的假设签署了负担沉重的利息协议。人们不得不假设，诸如\
  \ `Wasserstein` 这样的投资银行已经意识到这些估值和债务偿还要求是不现实的，但他们仍然一味向前，以便为他们的建议和债务承诺获取高额费用。事实上，这并不是\
  \ `Wasserstein` 第一次与高杠杆破产联系在一起，而当时其估值模型及其假设受到了质疑。在 Interco 的杠杆收购中也发生过类似的情况。\n\n\
  零售业是周期性行业。它们并不是杠杆收购（LBO）的理想对象，因为它们的利润空间通常很薄，现金流也具有一定的波动性。Campeau 的房地产背景让他习惯了高杠杆交易，他不习惯这个行业的波动性，无法预测债务市场可能发生的变化，他那些本该明事的、高薪的投资银行家也是如此。\n\
  \nCampeau 无法偿还债务，在为整个公司及其包含的部门支付了高价后，他无法让买家为他寻求出售的连锁店支付相当的倍数。然而，他需要出售部门以筹集资金偿还债务并减轻偿债压力。围墙逐渐逼近，1990\
  \ 年 1 月，Campeau 申请了破产。这次破产非常复杂，涉及多个层级的债务提供者，其中许多人损失了大量资金。\n\n当这枚即将发生的定时炸弹最终爆炸时，`Campeau\
  \ Corp` 以及罗伯特·Campeau 本人也不得申请破产。虽然 Campeau 在联邦商店（Federated Stores）的竞标中获胜，但他实际上落得了“赢家诅咒”，剩下的就是历史了。\n\
  \n# 收购竞标中赢家诅咒的研究\n\n在对 1974 年至 1983 年间 800 起收购的研究中，`Varaiya` 显示，收购竞标中的获胜出价显著高估了资本市场对任何收购收益的估计，幅度高达\
  \ 67%。他将过度支付衡量为获胜出溢价与市场对要约产生负面反应之前可能的最高出价之间的差异。这项研究支持了赢家诅咒的存在，反过来也支持了自大假假设（hubris\
  \ hypothesis）。\n\n# 市场表现、估值与收购概率\n\n那些拥有价值资产，但选择以低于这些资产价值及其应产生的现金流的折扣价格在市场上进行交易的公司，为竞标者创造了购买机会。未能意识到市场认为可以实现的价值的经理将面临收购的纪律效应。从理论上讲，公司市场价值相对于潜在价值越低，该公司就越可能成为收购目标。`Edmans`、`Goldstein`\
  \ 和 `Jiang` 分析了 1980 年至 2007 年期间 6,555 笔交易的大样本。他们指出，虽然更高的折扣会增加收购概率，但市场将这种收购可能性纳入了市场估值中。这两种效应在某种程度上相互抵消，从而部分抵消了收购预期的纪律效应。具有产生更高利润潜力的管理不善的公司将进入潜在竞标者和对冲基金的法眼，但讽刺的是，糟糕的管理有时可能会提升公司的市场价值，因为投资者开始对这所管理不善的公司被收购的可能性进行下注。如果没有这种市场反应，相对于潜在价值的折扣将会更大。\n\
  \n# 交易规模与股东财富\n\n长期以来，研究人员一直认为，股东在大宗交易中的表现比在小额交易中差。`Loderer` 和 `Martin` 认为，这是因为竞标者为更大的目标支付了更多费用。其他人则假设，这是由于竞标公司经理的过度自信造成的。\n\
  \n有人理论化地认为这种效应可能是相反的。例如，大型竞标者负担得起聘佣更具声名的顾问，这些顾问可能可以给他们提供更好的建议并避免过度支付。然而，当我们观察一些巨型失败案例的记录时（此类案例如此之多，以至于提供样本列表都没有意义），我们发现它们所有的都配备了高薪顾问，而这些顾问的建议被认为是有问题的并受到冲突的污染。事实上，有大量的支持支持观点：更大的顾问会鼓励竞标者进行更大的交易，这将为他们带来更大的费用——即使这不符合竞标者的利益。\n\
  \n`Moeller`、`Schlingemann` 和 `Stulz` 分析了 1980 年至 2001 年期间 12,023 笔收购样本。他们发现，“大型公司进行大型收购，导致了巨额资金损失。”另一方面，他们发现小型公司进行了规模较小的收购并记录了正收益。具体而言，他们发现，“小型公司收购公告相关的异常收益超过了大型公司收购公告相关的异常收益\
  \ 2.24 个百分点。”两者的结合影响是，总的来说，无论大小的收购通常会导致财富萎缩，因为大型交易的负面影响超过抵消了小规模交易的积极影响。`Moeller`\
  \ 和同事指出，大型竞标者支付过高溢价的倾向是大型交易负收益的来源。然而，更最近的研究提供了指向另一个方向的证据。\n\n`Alexandridis`、`Fuller`、`Terhaar`\
  \ 和 `Travlos` 分析了 1990 年至 2007 年期间 3,691 笔美国上市公司的收购案例。他们发现，竞标者对收购大型目标支付的溢价较低。中位溢价在最高三分之一为\
  \ 38%，而最低三分之一为 54%。他们关于收购溢价的结果意味着大交易将为股东带来更大的收益。然而，事实并非如此。他们发现，收购大型目标的收购对其股东产生了负的长期回报，而较小的交易则产生了正的财富效应。\n\
  \n这些看似矛盾的结果确实有一个合理的解释。较低的溢价证明了大型交易中的竞标者并不一定对其目标支付过度。因此，收益差异的来源并非基于购买目标的价格，而是基于目标的选择。似乎收购大型公司（通常是其他大型公司）的竞标者没有进行充分的战略分析，他们的决策过程可能受到了自大等心理因素的干扰。当涉及到并购收购时，整个战略收购过程都有很大的改进空间。\n\
  \n# 估值分析与糟糕交易的缺陷来源\n\n\n\n\n估值过程似乎很复杂，而且它确实可能包含许多相互作用且难以预测的方面，但模型本身并不那么复杂。通常使用两种主要模型：(1)\
  \ 折现自由现金流或 `DCF` 和 (2) 可比倍数法。对于涉及清晰资产价值公司的交易，还会使用更偏资产导向的方法，例如调整后净值。`DCF` 估值的示例请见公式\
  \ (11.1：\n\n![equation](img/c11-mdis-001.gif)**(11.1)** ![equation](img/c11-mdis-002.gif)\n\
  \n其中：\n\n*`BV` = 业务价值\n* `FCF`[1] = 第 `i` 期间的自由现金流\n* `g` = 第五年之后未来现金流的增长率\n* `r`\
  \ = 风险调整后的折现率\n\n公式 11.1 包含了三个主要部分或参数：(1) 自由现金流，(2) 自由现金流的增长率 `g`，以及 (3) 风险调整后的折现率。该公式看起来简单，但这三个解释变量中嵌入了对许多在该公式中未看到的其他变量的假设。例如，自由现金流的预测值是初始值\
  \ `FCF`[0] 和增长率 `g` 的函数，包含了对收入和成本的假设，以及对潜在收入增强和成本降低协同效应的假设。我们在第 3 章中看到，这些收益在理论化上比实现要容易得多。也可以看出，业务的价值对增长率等关键主观输入值非常敏感。\n\
  \n在许多失败的高杠杆交易中，交易执行者使用此类模型对公司进行估值。当目标公司不接受报价价格时，且需要更多债务来资助更高的价格时，他们会简单地改变增长率，公司瞬间变得*更有价值*。在我们讨论过的许多交易中都是此类情况，包括\
  \ Campeau 案例研究以及著名的 Interco 失败的高杠杆交易 (HLT)，这是众多案例中的另一个。\n\n该过程的一个问题是，投资银行家通常不对他们的分析负责。如果交易失败了，他们可能会指责管理层并购未能实现他们预期的协同效应。然而，如果投资银行为他们的建议收取数百万美元，然后为融资又收取数百万美元，如果这些建议导致了业务失败，这些建议的价值何在？我们必须承认，在某些情况下，建议的价值归投资银行顾问所有，他们以牺牲股东的利益为代价，而这些股东本希望银行家根据其收取的费用提供价值。\n\
  \n分析一家公司及其行业的财务记录通常很容易，并对未来现金流的情况有一个相当可靠的判断。有时这可能更加困难，例如当存在巨大波动时。但通常这种巨大的波动只影响短期。另一方面，如果争论在于业务和行业波动大到无法进行可靠的预测，那么这本身就会对目标的可行性产生怀疑。有时，投资银行家能给客户最好的建议就是不要进行这笔交易。如果客户坚持，银行家可以离开。Campeau\
  \ 收购案就是这种情况，当时担任摩根士利并购负责人的 Eric Gleacher 在任务对他看来毫无意义时直接拒绝了这项任务。他当时知道自己将错失高额费用。然而，他也有信心即使没有那笔交易也能继续成功，而那笔交易注定是一场灾难。Gleacher\
  \ 随后在并购领域取得了巨大成功，并离开摩根士利创立了 Gleacher & Co。\n\n当像 Campeau 失败这样的情况发生时，可能会有两个方的责任——CEO\
  \ 和那些本该更清楚的高薪优厚“顾问”。在太多的情况下，这些顾问为了短期费用和年终奖金，忽视了高盛创始人西尼迪·温伯格（Sidney Weinberg）支持“长期贪婪”的睿言。正如演员迈克尔·道格拉斯在并购电影《华尔街》（Wall\
  \ Street）中所说：“贪婪是好的。”温伯格会说长期贪婪是好的，因为这正是投资银行帮助客户在财务上获得成功，并在此过程中也获得了巨大的*长期*财务收益。这种情况是双赢的。然而，如果客户在交易中遭受了重大损失，或者像\
  \ Campeau 案例那样破产，很难做到长期贪婪了。也许更大的责任在于出买方无能的经理，在许多并购失败案例中，他们显然不擅长估值分析。能够进行良好估值分析的经理需要被收购方聘用。更重要的是，高层管理人员，可能甚至是自尊心强的\
  \ CEO，需要听取他们的（希望是）客观分析。\n\n# 剩余价值的注释\n\n我们从公式 (11.1 中看到，公司价值的大大部分来自于第六年及以后预计发生的现金流的资本化价值。大多数\
  \ `DCF` 模型仅对初始阶段（如五年）进行特定预测。其想法是，很难对五年后提出具体的预测。由于剩余年份具有价值——事实上是巨大的价值——因此它们使用资本化法进行估值。让我们首先评论运营现金流预测，然后讨论折现率和资本化率的确定，以及这些因素如何导致估值错误，从而导致交易失败。\n\
  \n# 自由现金流\n\n收购者从业务中获得的价值来自实体产生的自由现金流。自由现金流定义为：\n\n**(11.2)** ![equation](img/c11-mdis-003.gif)\n\
  \n其中：\n\n`FCF` = 自由现金流\n`EBITDA` = 息税折旧摊销前利润\n`CE` = 资本支出\n`CWC` = 营运资本变化\n`CTP`\
  \ = 现金缴税\n\n\n\n关于衡量公式 (11.2)中元素的细节，有很多话可说。然而，让我们对极大影响估值或错误估值的问题进行一些基本评论。自由现金流预测从基准开始，该基准源于历史值；对于增长型企业，它甚至可以基于上一个完整年度的价值。然而如果预计未来与过去大不相同，未来实际发生的价值可能会有所差异。\n\
  \n此外，资本开支的年度投资通常根据过去支付的金额来判断。评估人员通常会取一段时间（如过去五年）的历史资本开支，对其取平均值，然后将其用作五年预测期内的年度金额。这看起来是合合理的，除非有特定理由说明未来的资本开支金额将会有所不同。一个经典的例子发生在\
  \ 1986 年已故电视节目人物梅夫·格里芬（Merv Griffin）与较晚期的电视节目人物、赌场大亨唐纳唐纳德·特朗普（Donald Trump）之间的敌意收购战中，他们两人都在争夺度假胜地赌场（Resorts\
  \ Casino）的控制权。这场战斗异常激烈，梅夫·格里芬甚至赢得了控制权，但显然落得了“赢家诅咒”。梅夫和他的顾问团队没有准确分析出翻新旧的度假胜地赌场所需的巨额资本开支，以使其与当时大西洋城正在建造的新型现代化赌场相竞争。³⁹\
  \ 度假胜地一直没有投入必要的资本改进，这导致新买家（在本例中为梅夫·格里芬）在交易后不得不投入巨额资金以追赶竞争对手和他们华丽的现代赌场。在这种情况下，使用历史资本开支并反映未来自由现金流的情况。\n\
  \n# 成本削减与历史自由现金流\n\n度假胜地收购战的教训是，买家在自动假设历史价值适用于未来之前，需要对目标进行仔细研究。对于那些被成本削减者收购并通过抵押未来来榨取更高利润的公司，买家需要考虑修复由于之前维护不足造成的损害的额外成本。这在许多行业中都是，包括一些并非资本密集型的行业。在营销密集型业务中，削减广告的企业可以根据前期营销的半衰期生存一段时间。这可能会导致利润暂时上升，但买家最终可能会以失去市场份额的形式付出代价，并可能需要投入异常的营销支出来修复市场上的品牌知名度。\n\
  \n如果我们不对比警惕管理层的成本削减者进行进一步评论，将是有失的。例子包括 20 世纪 80 年代的阿尔·邓普（Al Dunlop，前 Sunbeam 首席执行官）和近年的埃迪·兰伯特（Eddie\
  \ Lampert，涉及西尔和克玛特）。邓普被称为“链锯阿尔”和“条纹西装的兰波”。他以非常激进的削减成本而闻名，批评者会说他根本不知道如何创造价值。他于 1996\
  \ 年成为 Sunbeam 的首席执行官，削减成本如此激进，以公司在 1997 年报告了近 1.9 亿美元的记录利润。当他无法为这家新的高盈利公司找到买家时（因为买家并没有被利润的实现方式所迷惑），他随后开始了并购计划，而这并不是他被聘佣的理由。他收购了露营设备制造商\
  \ Coleman、咖啡公司 Signature Brands（Mr. Coffee）和烟雾检测器公司 First Alert 的控制权。然而，合并后的公司很快破产，调查暴露了各种会计违规行为。\n\
  \n讨论的重点在于，买家需要非常警惕那些由短期成本削减者运营的目标，这些人在为公司出售做准备时可以推高收益，同时可能破坏业务的长期竞争力。\n\n# 预测增长率\n\
  \n假设的增长率被应用于历史自由现金流基准，以预测特定预测期（通常为五年）的未来现金流。不一定是五年，但这是最常用的数字。\n\n增长率的一个来源可以是目标自由现金流的历史增长。在最近没有发生太大变化且预计未来也将保持类似稳定性的非常稳定的行业中，可以是一个合理的假设。在波动较大的行业中，过去可能是不完美的指南，可能必须利用更多行业和公司特定的信息，以更好地掌握增长率应该是多少。我们需要确保较高的增长不是来自对协同效应的过度乐观的假设。\n\
  \n公式 (11.1)所示的估值过程对增长率的选择非常敏感。即使 `g` 变化 1%，也可能业务价值产生非常显著的影响。因此，在选择此参数时需要非常小心。\n\n\
  # 资本化率与退出倍数\n\n观察现金流折现（DCF）中预测期末出现的资本化过程的另一种方法是关注由`退出倍数`（exit multiple）衡量的价值，该倍数应用于第\
  \ 6 年的现金流。该倍数应该反映第 6 年及以后现金流的风险调整后现值。它还应该与目标在第 6 年的市场价值一致。然而，在第 0 年到第 6 年之间会发生很多（而且可能不会发生——例如协同收益的情况），因此这些值通常与最初收购分析时的观点大不。记住，第\
  \ 6 年的预测自由现金流价值是通过对前一年应用增长率计算的。在此之前的每一年都使用类似的复合过程计算。错误假设在早期获得的收益会导致后续年份的估计过高，这对第\
  \ 6 年的资本化残值产生多重影响。如果我们使用退出倍数对该残值进行估值，我们将对过高的基数应用倍数。\n\n人们必须严格审视资本化率和退出倍数，并确保它们是现实的。在资本化率中的增长体现在折现率与假设增长率之间的差异（`k\
  \ - g`）。增长率越高，资本化率越低，价值越高。因此，假设的并使增长率更高的协同效应确实需要经过仔细审查。由于我们在第 3 章中讨论的所有原因，我们需要非常有信协同效应真的会发生，所有可能导致它们失败的因素都不会适用于给定的收购。如果协同效应的可疑记录引起了任何疑虑，那么评估人员需要回溯增长率或在折现率中增加额外的风险溢价。\n\
  \n# 折现率\n\n\n\n\n交易的风险已包含在折现率中。使用诸如累加法（build-up method）等方法，从无风险利率开始，然后加上各种因素的溢价，例如股权风险溢价、规模溢价以及各种其他针对特定目标的溢价。例如，如果某个行业正在经历重大变化，这可能需要额外的溢价。人们不禁想，当惠尔-帕奇（HP）收购康倍克时，公司是否充分考虑到了\
  \ PC 行业高度竞争的特性，并在其估值分析中纳入了准确的风险溢价？显然，那次交易的记录表明他们并没有这样做。此外，考虑到当时惠尔-帕奇内部对于该收购的可行性存在巨大的争论，交易的支持者（如首席执行官卡莉莉·菲奥里纳\
  \ Carly Fiorina）可能不想包含这样贴实际的风险溢价。然而，如果他们选择将其包含，也许公司今天在低利润、高竞争的 PC 行业中的足迹会更少。\n\n\
  公司的管理层随时间而变化，因此人们可能认为很难对某些公司不擅长并购进行概括。然而，如果情况确实如此，我们如何解释 AT&T 和 HP 糟糕的并购记录呢？这两家公司都经历过多次管理转型，特别是\
  \ AT&T，但两者似乎在并购方面都很糟糕。HP 最近由于灾难性的奥托美（Autonomy）收购案而导致的高达数十亿美元的巨额减值进一步凸显了这一点。这引发了一个问题：如果你在并购方面的记录非常糟糕，是否应该在折现率中加入一个额外的“无能”溢价？\n\
  \n风险溢价越高，折现率就越高。折现率越高，现金流和目标的现值就越低。鉴于如此许多公司糟糕的并购表现，很显然，在许多现在已被视为失败的交易中，增长假设和风险溢价是有缺陷的。\n\
  \n在并购的业务估值中，用于将未来自由现金流转换为现值术的折现率常用来源是加权平均资本成本（`WACC`）。我们将 `WACC` 定义为：\n\n**(11.3)**\
  \ ![equation](img/c11-mdis-004.gif)\n\n其中：\n\n`D` = 债务价值\n\n`E` = 股权价值——通常以股权的市场价值或总市值衡量\n\
  \n`TC` = 债务和股权资本的总价值 = `E + D`\n\n`D/TC` = 债务在总资本中的比例\n\n`E/TC` = 股权在总资本中的比例\n\n\
  `t`[`d*]` = 公司税率\n\n`r`[`d*]` = 债务资本成本\n\n`r`[`e*]` = 股权资本成本。当使用资本资产定价模型来评估股权成本时，可以用以下关系式表示：\n\
  \n**(11.4)** ![equation](img/c11-mdis-005.gif)\n\n其中：\n\n`r`[`f*]` = 收益的无风险利率。这通常使用长期国债收益率衡量。它没有违约风险，尽管并非完全无风险，因为仍然具有利率，而其短期对应物——国券（T\
  \ Bills）并不具备。\n\n`β` = 衡量系统风险的 Beta 值\n\n`r`[`M*]` = 市场收益，通常使用标普 500 指数的收益来衡量，而该指数可以从晨星（Morningstar，原\
  \ Ibbotson Associates）等来源获取\n\n(`r`[`M*]` − `r`[`f*]`) = 股权风险溢价或市场风险溢价\n\n# 我们在衡量谁的资本成本？\n\
  \n当买方执行上述 `WACC` 计算时，可能会将其作为`门槛率`（hurdle rate）来评估其从收购中可能获得的回报。可能出现的问题是，买方的风险远低于目标。使用买方的\
  \ `WACC`，得到的折现率可能会高估收购的价值。另一方面，如果通过成为更大、更安全的收购方的一部分，买方（可以为目标提供所需的资金）降低了目标的风险概况，那么这可能是一个合理的方法。\n\
  \n考虑一种情况：投标者正在进行多元化，并进入一个与自身业务非常不同的行业。这增加了风险，大量研究表明这种多元化收购中存在这种固有的风险。如果目标公司不仅处于一个非常不同的行业，而且处于一个众所周知的风险更高的行业，风险会更大。在这种情况下，处于一个收购方可能不具备专业知识的不同领域就是一个风险元素，如果这个新领域已知是高风险的，那么应该被视为一个独立的额外风险因素。这些因素难道不应该成为使用更高风险溢价来确定折现率的基础吗？\n\
  \n当目标公司位于国外时，问题会变得更加复杂。这是否会导致人们进一步倾向于使用目标的 `WACC`？这再次是一个需要考虑的问题，尽管在大多数情况下，投标者仍然继续使用自己的\
  \ `WACC`。^(40\n\n# 使用累加法\n\n`WACC` 的一种替代方案是累加法。该方法不依赖于资本资产定价模型。它从无风险利率（如长期国债收益率）开始，然后加上各种风险溢价，使所得折现率通常能反映被估值公司的风险。此类计算可能如下：\n\
  \n**(11.5)** ![equation](img/c11-mdis-005.gif)\n\n其中：\n\n`r`[`f*]` = 无风险利率\n\n`r`[`ep*]`\
  \ = 股权风险溢价\n\n`r`[`ip*]` = 行业风险溢价\n\n`r`[`sp*]` = 规模溢价\n\n还可以添加其他风险溢价以反映上述列表未完全涵盖的风险。关于股权风险溢价的大小有大量的文献研究。事实上，这个主题多年来一直是活跃讨论的话题。^(41\n\
  \n关于这些溢价的数据很容易获得。^(42 然而，与许多业务估值一样，选择过程中存在相当的主观性。用于计算的各种公式给人一种该过程非常科学且精确的印象。它的精确体现在推导出一个具体的数值。然而，该过程包含了许多主观判断，如果不是以明智的方式得出，就会导致错误。显然，我们必须得出结论，在我们讨论的许多并购失败中情况正是如此。\n\
  \n# 短期利率趋势\n\n# 使用可比法\n\n\n\n\n当分析师使用可比法（例如行业内之前交易的 `EBITDA/FCF` 或 `P/E` 倍数）时，估值的分析挑战同样存在。在这里，我们也可能存在很大的主观性。在最初寻找可比倍数时，我们可能会遇到许多可能的对比交易，并必须主观地决定剔除哪些。我们可能的理由是这些公司并非真的具有可比性，或者在某些过去交易发生时，市场处于不同的水平。然而，我们必须确保自己不是戴着有色眼镜进行选择过程的。如果我们不剔掉这么多潜在的可比公司，将得出的平均倍数应用于目标公司时，是否会得到一个非常不同的值？如果是，我们就必须回头重新审视过程，并确定我们是否真的保持了客观。许多潜在的可比公司根据进一步分析被拒绝，这是很常见的现象。然而，我们必须承认这一过程中存在着显著的主观性因素。\n\
  \n# 公有收购者与私人收购者\n\n许多上市公司和私有公司的收购是由私人竞标者完成的。这些竞标者有时是私募股权公司和私人运营公司。事件研究的研究方法（即检查较短窗口内的股票市场反应）通常不适用于私人买家，因为他们的股份不在市场中交易。Bargeron、Schlingemann、Zutter\
  \ 和 Stulz 分析了 1980 年至 2005 年期间私人买家完成的 453 收购和上市公司完成的 1,214 收购。他们发现，公有买家支付的平均收购溢价为\
  \ 46.5%，而私人运营公司买家支付为 40.9%。然而，私募股权公司支付的平均溢价仅为 28.5%！类似的趋势在 Mergerstat 的数据中也可见（见\
  \ `Table 11.1`），显示了公有和私人买家支付的平均 `P/E`。\n\n| 年份 | 公有 P/E | 私人 P/E |\n| --- | ---\
  \ | --- |\n| 1990 | 17.1 | 13.2 |\n| 1991 | 15.9 | 8.5 |\n| 1992 | 18.1 | 17.6 |\n\
  | 1993 | 19.7 | 22.0 |\n| 1994 | 19.8 | 22.0 |\n| 1995 | 19.4 | 15.5 |\n| 1996 |\
  \ 21.7 | 17.7 |\n| 1997 | 25.0 | 17.0 |\n| 1998 | 24.0 | 16.0 |\n| 1999 | 21.7 |\
  \ 18.4 |\n| 2000 | 18.0 | 16.0 |\n| 2001 | 16.7 | 15.3 |\n| 2002 | 19.7 | 16.6 |\n\
  | 2003 | 21.2 | 19.4 |\n| 2004 | 22.6 | 19.0 |\n| 2005 | 24.4 | 16.9 |\n| 2006 |\
  \ 23.7 | 21.4 |\n| 2007 | 24.9 | 21.6 |\n| 2008 | 22.1 | 10.6 |\n| 2009 | 18.1 |\
  \ 18.4 |\n| 2010 | 20.9 | 9.3 |\n| 2011 | 21.3 | 14.9 |\n| 2012 | 21.1 | 18.5 |\n\
  | 1990–1999 平均值 | 20.2 | 16.8 |\n| 2000–2009 平均值 | 21.1 | 17.5 |\n\n* 排除负的 `P/E`\
  \ 倍数和大于 100 的 `P/E` 倍数。\n\n**表 11.1** 报价中位 `P/E`：公有对比私人，1990–2012。\n\n*来源*：Mergerstat\
  \ Review。\n\n显然，私募股权竞标者是精明的买家。同样清楚，卖方在向私募股权公司出售时需要非常注意这一点。如果福特公司花更多时间有条理地对 Hertz\
  \ 进行拍卖，同时等待更好的价格，它们能为 Hertz 卖得更多钱吗？我们永远无法知道，但私募股权买家能够在市场上快速转手 Hertz 并赚取丰厚的利润。\n\n\
  Bargaron 及其同事研究的另一个有趣发现与议价行为有关。当拟议交易条款不符合其意时，私人买家更愿意直接放弃。他们发现，私人买家撤回报价的比例为 37.4%，而上市公司这一比例仅为\
  \ 16.9%。\n\n# 公有卖方与私人卖方\n\n（注：此处提供的文本存在大量重复段落，翻译已基于核心唯一内容进行。）\n\n\n\n\n### 2. 概述\n\
