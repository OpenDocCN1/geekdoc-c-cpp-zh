    # **19 Object-Oriented Design**


    One thing expert designers know not to do is solve every problem from first principles.


    — “Design Patterns: Elements of Reusable Object-Oriented Software,” E. G^(amma),
    R. H^(elm), R. E. J^(ohnson), ^(and) J. M. V^(lissides), 1994


    A class is an encapsulation of data and methods that operate on that data. Classes
    match the way we think about computation. They provide encapsulation, which reduces
    the conceptual burden of writing code, and enable code reuse, through the use
    of inheritance and polymorphism. However, naive use of object-oriented constructs
    can result in code that is hard to maintain.


    A design pattern is a general repeatable solution to a commonly occurring problem.
    It is not a complete design that can be coded up directly—rather, it is a description
    of how to solve a problem that arises in many different situations. In the context
    of object-oriented programming, design patterns address both reuse and maintainability.
    In essence, design patterns make some parts of a system vary independently from
    the other parts.


    Adnan’s Design Pattern course material, available freely online, contains lecture
    notes, homeworks, and labs that may serve as a good resource on the material in
    this chapter.


    19.1 Creational Patterns


    Explain what each of these creational patterns is: builder, static factory, factory
    method, and abstract factory.


    **Solution:** The idea behind the builder pattern is to build a complex object
    in phases. It avoids mutability and inconsistent state by using an mutable inner
    class that has a build method that returns the desired object. Its key benefits
    are that it breaks down the construction process, and can give names to steps.
    Compared to a constructor, it deals far better with optional parameters and when
    the parameter list is very long.


    A static factory is a function for construction of objects. Its key benefits are
    as follow: the function’s name can make what it’s doing much clearer compared
    to a call to a constructor. The function is not obliged to create a new object—in
    particular, it can return a flyweight. It can also return a subtype that’s more
    optimized, e.g., it can choose to construct an object that uses an integer in
    place of a Boolean array if the array size is not more than the integer word size.


    A factory method defines interface for creating an object, but lets subclasses
    decide which class to instantiate. The classic example is a maze game with two
    modes—one with regular rooms, and one with magic rooms.


    from abc import ABC , abstractmethod


    class Room(ABC):


    @abstractmethod


    def connect(self , room2): pass


    class MazeGame(ABC):


    @abstractmethod


    def make_room(self):


    print("abstract make_room")


    pass


    def addRoom(self , room): print("adding room")


    def __init__(self):


    room1 = self.make_room () room2 = self.make_room () room1.connect(room2) self.addRoom(room1)
    self.addRoom(room2)


    This snippet implements the regular rooms. This snippet implements the magic rooms.
    class MagicMazeGame(MazeGame):


    def make_room(self): return MagicRoom ()


    class MagicRoom(Room):


    def connect(self , room2):


    print("Connecting magic room")


    Here’s how you use the factory to create regular and magic games. ordinary_maze_game
    = ordinary_maze_game.OrdinaryMazeGame () magic_maze_game = magic_maze_game.MagicMazeGame
    ()


    A drawback of the factory method pattern is that it makes subclassing challenging.'
