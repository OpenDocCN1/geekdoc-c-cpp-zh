  trans: "\n现在我们将使用动态规划（DP）来解决这个问题。一种直观的想法是假设我们已经有了子数组 `A[0,n− 2]` 的解。然而，即使我们知道子数组\
    \ `A[0,n− 2]` 的最大和子数组，也没有帮助我们解决 `A[0,n− 1]` 的问题。相反，我们需要在所有子数组 `A[0,i]`（`i< n−\
    \ 1`）中找到和最小的一个。所需的值是 `S[n^− 1]` 减去该子数组的和。我们通过遍历数组来计算这个值。对于每个索引 `j`，以 `j` 结尾的最大子数组和等于\
    \ `S[j]^− min[k]≤[j] S[k]`。在迭代过程中，我们记录到为止见过的最小 `S[k]`，并计算每个索引的最大子数组和。每个索引花费的时间是常数，从而导致\
    \ `O(n)` 的时间复杂度和 `O(1)` 的空间复杂度。数组条目为负数或数组为空都是合法的，该算法可以正确处理这些输入情况。\n\n```python\n\
    def find_maximum_subarray(A):\n    min_sum = max_sum = 0\n    for running_sum\
    \ in itertools.accumulate(A):\n        min_sum = min(min_sum , running_sum)\n\
    \        max_sum = max(max_sum , running_sum - min_sum)\n    return max_sum\n\
    ```\n\n## **动态规划训练营**\n\n在介绍中给出的计算斐波纳契数字和最大子数组和的程序是 DP 的良好示例。\n\n### 13.1 计算遍历\
    \ [二维] 数组的方法数\n\n在这个问题中，你需要计算从二维数组的左上角到右下角的方法数。所有移动必须是向右或向下的。例如，我们在图 13.3 中展示了\
    \ `5^× 5` 二维数组中的三种走法。（正如我们将所见的，这个例子中总共有 70 种可能的方法。）\n\n**图 13.3：** 穿过二维数组的路径。\n\
    \n编写一个程序，计算在二维数组中从左上角到右下角的方法数。\n\n**提示：** 如果 `i> 0` 且 `j> 0`，你可以从 `(i− 1, j)`\
    \ 或 `(j− 1,i)` 到达 `(i, j)`。\n\n当你必须**做出选择**来获得解决方案时，请考虑使用 DP。具体来说，当你可以从同类型较小问题实例的解中构建出给定实例的解时，DP\
    \ 就适用。\n\n除了优化问题外，DP 也**适用于****计数和决策问题**——任何你可以用对较小实例的相同计算来递归地表示解决方案的问题。\n\n尽管\
    \ DP 在概念上涉及递归，但为了效率，缓存通常是**“自底向上”构建的**，即通过迭代构建。\n\n当使用递归实现 DP 时，缓存通常是一个动态数据结构，如哈希表或二叉搜索树（BST）；当使用迭代实现\
    \ DP 时，缓存通常是一个一维或多维数组。\n\n为了节省空间，一旦确定一组条目将不再被再次查询，**缓存空间**就可以被**回收**。\n\n解决 DP\
    \ 问题时一个常见的**错误**是试图通过将问题分成**两个相等的部分**（类似于快速排序）来思考递归情况，即解决子数组 `A[0,^n ]` 和 `A[n2\
    \ + 1,n]` 的子问题并结合结果。然而，在大多数情况下，这两个子问题不足以解决原始问题。\n\nDP 的基础是**结合子问题的解**以**产生原始问题的解****。然而，对于某些问题，DP\
    \ 将不起作用。例如，如果你需要计算从城市 1 到城市 2 的最长路径且不重复中间的城市，而这条最长路径经过了城市 3，那么从城市 1 到城市 3 的子路径和从城市\
    \ 3 到城市 2 的子路径，可能本身并不是不重复城市的最长路径。\n\n**表 13.1：** 动态规划顶级技巧\n\n**解：** 暴力法是枚举所有可能的路径。这可以使用递归完成。然而，路径数量会发生组合爆炸，导致巨大的时间复杂度。\n\
    \n问题陈述要求路径数，因此我们将注意力放在这里。一个关键的观察是，因为路径必须向下或向右移动，到达右下角格的方法数等于到达它上方格的方法数，加上到达它左侧格的方法数。让我们把原点\
    \ `(0,0)` 视为左上角的格。推广之，到达 `(i, j)` 的方法数是到达 `(i− 1, j)` 的方法数加上到达 `(i, j− 1)` 的方法数。（如果\
    \ `i = 0` 或 `j = 0`，从原点到达 `(i, j)` 只有一种方法。）这是计算路径数的递归算法的基础。如果简单地实现，该算法具有指数级时间复杂度——它反复在相同的位置上进行递归。解决方案是缓存结果。例如，上一页图\
    \ 13.3 配置到达 `(i, j)` 的方法数缓存在矩阵中，如对页页图 13.4 所示。\n\n```python\ndef number_of_ways(n,\
    \ m):\n    number_of_ways = [[0] * m for _ in range(n)]\n    for i in range(n):\n\
    \        for j in range(m):\n            if i == 0 and j == 0:\n             \
    \   number_of_ways[i][j] = 1\n            else:\n                ways_top = 0\
    \ if i == 0 else number_of_ways[i-1][j]\n                ways_left = 0 if j ==\
    \ 0 else number_of_ways[i][j-1]\n                number_of_ways[i][j] = ways_top\
    \ + ways_left\n    return number_of_ways[n-1][m-1]\n```\n"
- fmt: "\nSometimes, there are multiple greedy algorithms for a given problem, and\
    \ only some of them are optimum. For example, consider 2n cities on a line, half\
    \ of which are white, and the other half are black. Suppose we need to pair white\
    \ with black cities in a one-to-one fashion so that the total length of the road\
    \ sections required to connect paired cities is minimized. Multiple pairs of cities\
    \ may share a single section of road, e.g., if we have the pairing `(0,4)` and\
    \ `(1,2)` then the section of road between Cities `0` and `4` can be used by Cities\
    \ `1` and `2`.\n\nThe most straightforward greedy algorithm for this problem is\
    \ to scan through the white cities, and, for each white city, pair it with the\
    \ closest unpaired black city. This algorithm leads to suboptimum results. Consider\
    \ the case where white cities are at `0` and at `3` and black cities are at `2`\
    \ and at `5`. If the white city at `3` is processed first, it will be paired with\
    \ the black city at `2`, forcing the cities at `0` and `5` to pair up, leading\
    \ to a road length of `5`. In contrast, the pairing of cities at `0` and `2`,\
    \ and `3` and `5` leads to a road length of `4`.\n\nA slightly more sophisticated\
    \ greedy algorithm does lead to optimum results: iterate through all the cities\
    \ in left-to-right order, pairing each city with the nearest unpaired city of\
    \ opposite color. Note that the pairing for the first city must be optimum, since\
    \ if it were to be paired with any other city, we could always change its pairing\
    \ to be with the nearest black city without adding any road. This observation\
    \ can be used in an inductive proof of overall optimality.\n\n### Greedy algorithms\
    \ boot camp\n\nFor US currency, wherein coins take values `1`, `5`, `10`, `25`,\
    \ `50`, `100` cents, the greedy algorithm for making change results in the minimum\
    \ number of coins. Here is an implementation of this algorithm. Note that once\
    \ it selects the number of coins of a particular value, it never changes that\
    \ selection; this is the hallmark of a greedy algorithm.\n\n```python\ndef change_making(cents):\n\
    \    COINS = [100, 50, 25, 10, 5, 1]\n    num_coins = 0\n    for coin in COINS:\n\
    \        num_coins += cents / coin\n        cents %= coin\n    return num_coins\n\
    ```\n\nWe perform 6 iterations, and each iteration does a constant amount of computation,\
    \ so the time complexity is `O(1)`.\n\nA greedy algorithm is often the right choice\
    \ for an `optimization problem` where there’s a natural set of `choices to select\
    \ from`.\n\nIt’s often easier to conceptualize a greedy algorithm recursively,\
    \ and then `implement` it using iteration for higher performance.\n\nEven if the\
    \ greedy approach does not yield an optimum solution, it can give insights into\
    \ the optimum algorithm, or serve as a heuristic.\n\nSometimes the correct greedy\
    \ algorithm is `not obvious`. **Table 14.1: Top Tips for Greedy Algorithms**\n\
    \n### Invariants\n\nA common approach to designing an efficient algorithm is to\
    \ use invariants. Briefly, an invariant is a condition that is true during execution\
    \ of a program. This condition may be on the values of the variables of the program,\
    \ or on the control logic. A well-chosen invariant can be used to rule out potential\
    \ solutions that are suboptimal or dominated by other solutions.\n\nFor example,\
    \ binary search maintains the invariant that the space of candidate solutions\
    \ contains all possible solutions as the algorithm executes.\n\nSorting algorithms\
    \ nicely illustrate algorithm design using invariants. Intuitively, selection\
    \ sort is based on finding the smallest element, the next smallest element, etc.\
    \ and moving them to their right place. More precisely, we work with successively\
    \ larger subarrays beginning at index `0`, and preserve the invariant that these\
    \ subarrays are sorted, their elements are less than or equal to the remaining\
    \ elements, and the entire array remains a permutation of the original array.\n\
    \n### Invariants boot camp\n\nSuppose you were asked to write a program that takes\
    \ as input a sorted array and a given target value and determines if there are\
    \ two entries in the array that add up to that value. For example, if the array\
    \ is `−2, 1, 2, 4, 7, 11`, then there are entries adding to `6` and to `10`, but\
    \ not to `0` and `13`.\n\nThe brute-force algorithm for this problem consists\
    \ of a pair of nested `for` loops. Its complexity is `O(n²)`, where `n` is the\
    \ length of the input array. A faster approach is to add each element of the array\
    \ to a hash table, and test for each element `e` if `K−e`, where `K` is the target\
    \ value, is present in the hash table. While reducing time complexity to `O(n)`,\
    \ this approach requires `O(n)` additional storage for the hash.\n\nThe most efficient\
    \ approach uses invariants: maintain a subarray that is guaranteed to hold a solution,\
    \ if it exists. This subarray is initialized to the entire array, and iteratively\
    \ shrunk from one side or the other. The shrinking makes use of the sortedness\
    \ of the array. Specifically, if the sum of the leftmost and the rightmost elements\
    \ is less than the target, then the leftmost element can never be combined with\
    \ some element to obtain the target. A similar observation holds for the rightmost\
    \ element.\n\n```python\ndef has_two_sum(A, t):\n    i, j = 0, len(A) - 1\n  \
    \  while i <= j:\n        if A[i] + A[j] == t:\n            return True\n    \
    \    elif A[i] + A[j] < t:\n            i += 1\n        else:\n            # A[i]\
    \ + A[j] > t\n            j -= 1\n    return False\n```\n\nThe time complexity\
    \ is `O(n)`, where `n` is the length of the array. The space complexity is `O(1)`.\
    \ Identifying the right invariant is an art. The key strategy to determine whether\
    \ to use an invariant when designing an algorithm is to work on small examples.\
    \ **Table 14.2: Top Tips for Invariants**\n\nDesign an algorithm that takes as\
    \ input a sorted array and a given target value and determines if there are two\
    \ entries in the array that add up to that value. For example, if the array is\
    \ `−2, 1, 2, 4, 7, 11`, then there are entries adding to `6` and to `10`, but\
    \ not to `0` and `13`.\n\n**Hint:** How would you check if a given entry can be\
    \ added to two entries?\n\n**Solution:** First, we consider the problem of computing\
    \ a pair of entries which sum to K. Assume A is sorted. We start with the pair\
    \ consisting of the first element and the last element: `(A[0],A[n−1])`. Let `s\
    \ = A[0] + A[n−1]`. If `s = K`, we are done. If `s < K`, we increase the sum by\
    \ moving to `(A[1],A[n−1])`. We need never consider `A[0]`; since the array is\
    \ sorted, for all `i,A[0] + A[i]≤ A[0]+A[n−1] = K< s`. If `s > K`, we can decrease\
    \ the sum by considering the pair `(A[0],A[n−2])`; by analogous reasoning, we\
    \ need never consider `A[n−1]` again. We iteratively continue this process till\
    \ we have found a pair that sums up to K or the indices meet, in which case the\
    \ search ends. This solution works in `O(n)` time and `O(1)` space in addition\
    \ to the space needed to store A.\n\nNow we describe a solution to the problem\
    \ of finding three entries which sum to t. We sort A and for each `A[i]`, search\
    \ for indices `j` and `k` that `A[j] + A[k] = t− A[i]`. The additional space needed\
    \ is `O(1)`, and the time complexity is the sum of the time taken to sort, `O(nlogn)`,\
    \ and then to run the `O(n)` algorithm described in the previous paragraph n times\
    \ (one for each entry), which is `O(n²)` overall. The code for this approach is\
    \ shown below.\n\n```python\ndef has_three_sum(A, t):\n    A.sort()\n    # Finds\
    \ if the sum of two numbers in A equals to t - a.\n    return any(has_two_sum(A,\
    \ t - a) for a in A)\n```\n"
