    # **16 Parallel Computing**


    The activity of a computer must include the proper reacting to a possibly great
    variety of messages that can be sent to it at unpredictable moments, a situation
    which occurs in all information systems in which a number of computers are coupled
    to each other.


    — “Cooperating sequential processes,” E. W. D^(ijkstra), 1965


    Parallel computation has become increasingly common. For example, laptops and
    desktops come with multiple processors which communicate through shared memory.
    High-end computation is often done using clusters consisting of individual computers
    communicating through a network.


    Parallelism provides a number of benefits:


    • High performance—more processors working on a task (usually) means it is completed
    faster.


    • Better use of resources—a program can execute while another waits on the disk
    or network.


    • Fairness—letting different users or programs share a machine rather than have
    one program


    run at a time to completion.


    • Convenience—it is often conceptually more straightforward to do a task using
    a set of con


    current programs for the subtasks rather than have a single program manage all
    the subtasks.


    • Fault tolerance—if a machine fails in a cluster that is serving web pages, the
    others can take


    over.


    Concrete applications of parallel computing include graphical user interfaces
    (GUI) (a dedicated thread handles UI actions while other threads are, for example,
    busy doing network communication and passing results to the UI thread, resulting
    in increased responsiveness), Java virtual machines (a separate thread handles
    garbage collection which would otherwise lead to blocking, while another thread
    is busy running the user code), web servers (a single logical thread handles a
    single client request), scientific computing (a large matrix multiplication can
    be split across a cluster), and web search (multiple machines crawl, index, and
    retrieve web pages).


    The two primary models for parallel computation are the shared memory model, in
    which each processor can access any location in memory, and the distributed memory
    model, in which a processor must explicitly send a message to another processor
    to access its memory. The former is more appropriate in the multicore setting
    and the latter is more accurate for a cluster. The questions in this chapter are
    focused on the shared memory model.


    Writing correct parallel programs is challenging because of the subtle interactions
    between parallel components. One of the key challenges is races—two concurrent
    instruction sequences access the same address in memory and at least one of them
    writes to that address. Other challenges to correctness are


    • starvation (a processor needs a resource but never gets it),


    • deadlock (Thread A acquires Lock L1 and Thread B acquires Lock L2, following
    which A tries


    to acquire L2 and B tries to acquire L1), and


    • livelock (a processor keeps retrying an operation that always fails).


    Bugs caused by these issues are difficult to find using testing. Debugging them
    is also difficult because they may not be reproducible since they are usually
    load dependent. It is also often true that it is not possible to realize the performance
    implied by parallelism—sometimes a critical task cannot be parallelized, making
    it impossible to improve performance, regardless of the number of processors added.
    Similarly, the overhead of communicating intermediate results between processors
    can exceed the performance benefits.


    **Parallel computing boot camp**


    A semaphore is a very powerful synchronization construct. Conceptually, a semaphore
    maintains a set of permits. A thread calling acquire() on a semaphore waits, if
    necessary, until a permit is available, and then takes it. A thread calling release()
    on a semaphore adds a permit and notifies threads waiting on that semaphore, potentially
    releasing a blocking acquirer.


