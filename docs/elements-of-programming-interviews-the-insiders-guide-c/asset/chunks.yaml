  trans: "\n有时，对于一个问题存在多个贪心算法，但其中只有一部分是最优的。例如，考虑直线上的 $2n$ 个城市，其中一半是白色，另一半是黑色。假设我们需要将白色城市与黑色城市进行一对一配对，使得连接配对城市所需的路段总长度最小。多对城市可能会共享某段路段，例如，如果我们有配对\
    \ `(0,4)` 和 `(1,2)`，那么城市 `0` 和 `4` 之间的路段就可以被城市 `1` 和 `2` 使用。\n\n该问题最直观的贪心算法是扫描所有白色城市，并对于每个白色城市，将其与最近的未配对的黑色城市配对。该算法会导致次优结果。考虑白色城市位于\
    \ `0` 和 `3`，黑色城市位于 `2` 和 `5` 的情况。如果先处理 `3` 处的白色城市，它将与 `2` 处的黑色城市配对，迫使 `0` 和 `5`\
    \ 处的城市配对，导致道路长度为 `5`。相比之下，城市 `0` 与 `2` 以及 `3` 与 `5` 的配对得到的道路长度为 `4`。\n\n稍微复杂一点的贪心算法可以得到最优结果：从左到右遍历所有城市，将每个城市与其颜色相反的最近的未配对城市配对。注意，第一个城市的配对必须是最优的，因为如果它与任何其他城市配对，我们总是可以将其配对更改为与最近的黑色城市配对，而不会增加任何路段长度。这一观察结果可以用于整体最优性的归纳法证明。\n\
    \n### 贪心算法训练营\n\n对于美国货币，硬币面值为 `1`、`5`、`10`、`25`、`50`、`100` 分，找零的贪心算法可以产生最少硬币。以下是该算法的实现。注意，一旦它选择了某种面值的硬币数量，就不会改变该选择；这是贪心算法的特征。\n\
    \n```python\ndef change_making(cents):\n    COINS = [100, 50, 25, 10, 5, 1]\n\
    \    num_coins = 0\n    for coin in COINS:\n        num_coins += cents / coin\n\
    \        cents %= coin\n    return num_coins\n```\n\n我们执行 6 次迭代，每次迭代执行恒定量的计算，因此时间复杂度为\
    \ `O(1)`。\n\n对于一个具有自然`待选集合`的`优化问题`，贪心算法通常是正确的选择。\n\n通常用递归地概念化贪心算法更容易，然后使用迭代来`实现`\
    \ 它以获得更高的性能。\n\n即使贪心方法没有产生最优解，它也可以为最优算法提供见解，或者作为启发式方法。\n\n有时正确的贪心算法`并不显而易见`。**表\
    \ 14.1：贪心算法技巧**\n\n### 不变性\n\n设计高效算法的一种常用方法是使用不变性（invariants）。简单来说，不变性是在程序执行期间始终成立的条件。该条件可能关于程序变量的值，也可能关于控制逻辑。选择得良好的不变性可以用于排除潜在的次优解或被其他解支配的解。\n\
    \n例如，二分查找在算法执行过程中保持了这样一个不变性：即候选解空间包含所有可能的解。\n\n排序算法很好地说明了使用不变性的算法设计。直观上，选择排序是基于寻找最小元素、下一个最小元素等，并将它们移动到它们正确的位置。更精确地说，我们处理从索引\
    \ `0` 开始的逐渐变大的子数组，并保持这些不变性：这些子数组是有序的，它们的元素小于或等于剩余元素，且整个数组仍然是原数组的一个排列。\n\n### 不变性训练营\n\
    \n假设你被要求编写一个程序，输入一个排序数组和一个给定的目标值，并确定数组中是否存在两个项之和等于该值。例如，如果数组为 `−2, 1, 2, 4, 7,\
    \ 11`，则存在相和为 `6` 和 `10` 的项，但不存在相和为 `0` 和 `13` 的项。\n\n该问题的暴力算法由一对嵌套的 `for` 循环组成。其复杂度为\
    \ `O(n²)`，其中 `n` 是输入的长度。更快的方法是将数组的每个元素添加到哈希表中，并对每个元素 `e` 测试 `K−e`（其中 `K` 是目标值）是否存在于哈希表中。虽然这种方法将时间复杂度降低到\
    \ `O(n)`，但它需要哈希需要 `O(n)` 的额外存储。\n\n最有效的方法使用不变性：维护一个保证包含解（如果存在的话）的子数组。该子数组初始化为整个数组，并从一侧或另一侧迭代收缩。收缩利用了数组的有序性。具体来说，如果最左侧和最右侧元素的和小于目标值，那么最左侧元素永远无法与某个元素组合得到目标。类似的观察也适用于右侧元素。\n\
    \n```python\ndef has_two_sum(A, t):\n    i, j = 0, len(A) - 1\n    while i <=\
    \ j:\n        if A[i] + A[j] == t:\n            return True\n        elif A[i]\
    \ + A[j] < t:\n            i += 1\n        else:\n            # A[i] + A[j] >\
    \ t\n            j -= 1\n    return False\n```\n\n时间复杂度为 `O(n)`，其中 `n` 是数组的长度。空间复杂度为\
    \ `O(1)`。识别正确的不变性是一门艺术。在设计算法时确定是否使用不变性的关键策略是在小例子上进行研究。**表 14.2：不变性技巧**\n\n设计一个算法，输入一个排序数组和一个给定的目标值，并确定数组中是否存在两个项之和等于该值。例如，如果数组为\
    \ `−2, 1, 2, 4, 7, 11`，则存在相和为 `6` 和 `10` 的项，但不存在相和为 `0` 和 `13` 的项。\n\n**提示：**\
    \ 你如何检查一个给定的项是否可以与两个项相加？\n\n**解答：** 首先，我们考虑计算和为 K 的项对的问题。假设 A 是排序的。我们从由第一个元素和最后一个元素组成的对开始：`(A[0],A[n−1])`。令\
    \ `s = A[0] + A[n−1]`。如果 `s = K`，我们完成了。如果 `s < K`，我们通过移动到 `(A[1],A[n−1])` 来增加和。我们不再需要考虑\
    \ `A[0]`；因为数组是有序的，对于所有的 `i,A[0] + A[i] \\le A[0]+A[n−1] = K< s`。如果 `s > K`，我们通过考虑对\
    \ `(A[0],A[n−2])` 来减小和；通过推理，我们不再需要考虑 `A[n−1]`。我们迭代继续此过程，直到找到和为 K 的对或索引相遇，此时搜索结束。除了存储\
    \ A 所需的空间外，该解决方案在 `O(n)` 时间 `O(1)` 空间内运行。\n\n现在我们描述寻找三个和等于 t 的项的解决方案。我们排序 A，对于每个\
    \ `A[i]`，搜索索引 `j` 和 `k`使得 `A[j] + A[k] = t− A[i]`。额外空间为 `O(1)`，时间复杂度是排序时间 `O(nlogn)`\
    \ 以及运行上一段描述的 `O(n)` 算法 $n$ 次（每个项一次）之和，总共为 `O(n²)`。该方法的代码所示。\n\n```python\ndef\
    \ has_three_sum(A, t):\n    A.sort()\n    # 查找 A 中两个数之和是否等于 t - a。\n    return\
