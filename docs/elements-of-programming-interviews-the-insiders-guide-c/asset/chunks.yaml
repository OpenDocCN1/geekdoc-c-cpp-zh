    \ grouping of strings by iterating through all strings, and comparing each string\
    \ with all other remaining strings. If two strings are anagrams, we do not consider\
    \ the second string again. This leads to an `O(n²mlogm)` algorithm, where `n`\
    \ is the number of strings and `m` is the maximum string length.\n\nLooking more\
    \ carefully at the above computation, note that the key idea is to map strings\
