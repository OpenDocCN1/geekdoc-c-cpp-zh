    or connected components. **DFS** works particularly well for these applications.


    Some graph problems are related to **optimization**, e.g., find the shortest path
    from one vertex to another. **BFS, Dijkstra’s shortest path algorithm, and minimum
    spanning tree** are examples of graph algorithms appropriate for optimization
    problems.


    **Table 15.1:** Top Tips for Graphs


    **Graph search**


    Computing vertices which are reachable from other vertices is a fundamental operation
    which can be performed in one of two idiomatic ways, namely depth-first search
    (DFS) and breadth-first search (BFS). Both have linear time complexity—O(|V|+|E|)
    to be precise. In the worst-case there is a path from the initial vertex covering
    all vertices without any repeats, and the DFS edges selected correspond to this
    path, so the space complexity of DFS is^O(^|V^|) (this space is implicitly allocated
    on the function call stack). The space complexity of BFS is alsoO(|V|), since
    in a worst-case there is an edge from the initial vertex to all remaining vertices,
    implying that they will all be in the BFS queue simultaneously at some point.


    DFS and BFS di ffer from each other in terms of the additional information they
    provide, e.g., BFS can be used to compute distances from the start vertex and
    DFS can be used to check for the presence of cycles. Key notions in DFS include
    the concept of discovery time and finishing time for vertices.


