    # **2 Arrays**


    The machine can alter the scanned symbol and its behavior is in part determined
    by that symbol, but the symbols on the tape elsewhere do not affect the behavior
    of the machine.


    — “Intelligent Machinery,” A. M. T^(uring), 1948


    The simplest data structure is the array, which is a contiguous block of memory.
    It is usually used to represent sequences. Given an array A, A[i] denotes the
    (i + 1)th object stored in the array. Retrieving and updating A[i] takes^O(1)
    time. Insertion into a full array can be handled by resizing, i.e., allocating
    a new array with additional memory and copying over the entries from the original
    array. This increases the worst-case time of insertion, but if the new array has,
    for example, a constant factor larger than the original array, the average time
    for insertion is constant since resizing is infrequent. Deleting an element from
    an array entails moving all successive elements one over to the left to fill the
    vacated space. For example, if the array is 2,3,5,7,9,11,13,17 , then deleting
    the element at index 4 results in the array 2,3,5,7,11,13,17,0 . (We do not care
    about the last value.) The time complexity to delete the element at index i from
    an array of length n is^O(n^−i). The same is true for inserting a new element
    (as opposed to updating an existing entry).


    **Array boot camp**


    The following problem gives good insight into working with arrays: Your input
    is an array of integers, and you have to reorder its entries so that the even
    entries appear first. This is easy if you use^O(n) space, where n is the length
    of the array. However, you are required to solve it without allocating additional
    storage.


    When working with arrays you should take advantage of the fact that you can operate
    e fficiently on both ends. For this problem, we can partition the array into three
    subarrays: Even, Unclassified, and Odd, appearing in that order. Initially Even
    and Odd are empty, and Unclassified is the entire array. We iterate through Unclassified,
    moving its elements to the boundaries of the Even and Odd subarrays via swaps,
    thereby expanding Even and Odd, and shrinking Unclassified.


    def even_odd(A):


    next_even , next_odd = 0, len(A) - 1


    while next_even < next_odd:


    if A[next_even] % 2 == 0:


    next_even += 1


    else:


    A[next_even], A[next_odd] = A[next_odd], A[next_even]


    next_odd -= 1


    The additional space complexity is clearly^O(1)—a couple of variables that hold
    indices, and a temporary variable for performing the swap. We do a constant amount
    of processing per entry, so the time complexity isO(n).


    Array problems often have simple brute-force solutions that use^O(n) space, but
    there are subtler solutions that **use the array itself** to **reduce space**
    complexity to^O(1).


    Filling an array from the front is slow, so see if it’s possible to **write values
    from the back**.'
