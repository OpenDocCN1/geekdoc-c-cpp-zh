    \ and smallest keys at each node; this requires `O(n)` additional storage for\
    \ the cache.\n\nWe now present two approaches which have `O(n)` time complexity.\n\
    \nThe first approach is to check constraints on the values for each subtree. The\
    \ initial constraint comes from the root. Every node in its left (right) subtree\
    \ must have a key less than or equal (greater than or equal) to the key at the\
    \ root. This idea generalizes: if all nodes in a tree must have keys in a range\
    \ of `[l, u]`, then... (text continues logic)\n\n```python\ndef is_binary_tree_bst(tree,\
    \ low_range=float(’inf’), high_range=float(’inf’)):\n    if not tree:\n      \
    \  return True\n    elif not low_range <= tree.data <= high_range:\n        return\
    \ False\n    return (is_binary_tree_bst(tree.left, low_range, tree.data) and\n\
    \            is_binary_tree_bst(tree.right, tree.data, high_range))\n```\n"
