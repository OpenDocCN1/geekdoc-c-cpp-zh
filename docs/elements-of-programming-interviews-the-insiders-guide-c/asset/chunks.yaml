    \ `O(logn)` 删除最大元素。`extract-max` 操作被定义为删除并返回最大元素。参见图 7.1(b) 删除最大元素的示例。搜索任意键值的时间复杂度为\
    \ `O(n)`。\n\n堆有时被称为优先级队列，因为它的行为类似于队列，但有一个不同：每个元素都有一个关联的“优先级”，且删除操作会移除优先级最高的元素。\n\
    \n最小堆是该数据结构的一个完全对称版本，支持 `O(1)` 时间查找最小元素。\n\n图 7.1：最大堆以及在该最大堆上的删除操作。注意根节点持有最大键，(b)\
    \ 在删除 (a) 中堆中的最大值后。删除是通过将根节点的键值替换为最后一个叶子节点的键值，然后通过反复与子节点交换键值来恢复堆属性实现的。\n\n## 堆训练营\n\
    假设你被要求写一个程序，处理“流式”方式呈现的字符串序列：你无法回溯读取早早的值。你的程序必须计算序列中的 k 个长字符串。只需要这 k 个长字符串——不需要对这些字符串进行排序。\n\
    \n当我们处理输入时，我们想要跟踪到目前为止过的 k 个长字符串。在这些 k 个字符串中，当需要添加更长的字符串时，被剔除的字符串是最短的一个。最小堆（不是最大堆！）是该应用的正确数据结构，因为它支持高效的\
    \ `find-min`、`remove-min` 和 `insert`。在下面的程序中，我们使用带有自定义比较函数的堆，字符串按长度进行排序。\n\n```python\n\
    def top_k(k, stream):\n    # 条目根据其长度比较。\n    min_heap = [( len(s), s) for s in\
    \ itertools.islice(stream , k)]\n    heapq.heapify(min_heap)\n    for next_string\
    \ in stream:\n        # 推入 next_string 并弹出 min_heap 中最短的字符串。\n        heapq.heappushpop(min_heap\
    \ , (len(next_string), next_string)) \n    return [p[1] for p in heapq.nsmallest(k,\
    \ min_heap)]\n```\n\n每个字符串的处理耗时为 `O(logk)`，这是从堆中添加和移除最小元素所需的时间。因此，如果输入中有 n 个字符串，处理所有字符串的时间复杂度为\
    \ `O(nlogk)`。\n\n我们可以通过首先将新字符串的长度与堆顶字符串的长度进行比较（获取该字符串需要 `O(1)` 时间），如果新字符串太短而无法进入集合，则跳过插入，从而改进最好情况的时间复杂度。\n\
    \n当你**只关心的**是**最大**或**最小**元素，且你**不需要**支持对任意元素的快速查找、删除或搜索操作时，请使用堆。\n\n当你需要计算集合中\
    \ k 个最大元素或 k 个最小的元素时，堆是一个很好的选择。对于前者，使用最小堆；对于后者，使用最大堆。\n\n**表 7.1：** 堆使用技巧\n\n\
    ## 了解你的堆库\nPython 中的堆功能由 `heapq` 模块提供。我们将将使用的操作和函数包括：\n\n- `heapq.heapify(L)`，将\
    \ L 中的元素原地转换为堆，\n- `heapq.nlargest(k, L)` (`heapq.nsmallest(k, L)`) 返回 L 中 k 个最大（最小）的元素，\n\
    - `heapq.heappush(h, e)`，将新元素推入堆中，\n- `heapq.heappop(h)`，从堆中弹出最小元素，\n- `heapq.heappushpop(h,\
    \ a)`，将 `a` 推入堆然后返回最小元素，\n- `e = h[0]`，返回堆中的最小元素而不弹出它。\n\n非常重要的一点是，`heapq` 只提供最小堆功能。如果你需要构建整数上构建最大堆，请插入它们的负数以获取最大堆。对于对象，请恰当实现实现\
    \ `__lt__`。\n\n### 7.1 合并排序后的文件\n该问题源于以下场景：你被给了 500 个文件，每个文件包含一家标普 500 公司的交易信息。每笔交易都用以下格式的一行进行编码：`123211,AAPL,30,456`。第一个数字是自当天开始以来以毫秒表示的交易时间。每个文件内部的行按升序排列。其余值是股票代码、股数和价格。你需要创建一个包含这\
    \ 500 个文件中所有交易的单个文件，并按时间顺序排序。单个文件的大小在 5-100 兆字节之间；合并后的文件将在 5 兆字节左右。在抽象上，我们正试图解决以下问题：\n\
    \n编写一个程序，输入一组排序的序列，并计算这些序列的并集排序序列。例如，如果输入是 `3,5,7`、`0,6` 和 `0,6,28`，则输出为 `0,0,3,5,6,6,7,28`。\n\
    \n**提示：** 执行算法时每个序列的哪个部分是重要的？\n\n**解法：** 方法的方法是将这些序列合并成一个数组然后进行排序。假设总共有 n 个元素，时间复杂度为\
    \ `O(logn)`。暴力方法没有利用单个序列是排序的这一事实。我们可以通过关注每个序列剩余部分的第一个元素来利用这一事实。具体来说，我们反复从每个序列剩余部分的第一个元素中选择最小元素。\n\
    \n当我们需要添加任意值并提取最小元素时，最小堆是维护元素集合的理想选择。为了方便解释，我们展示如何合并排序数组而不是文件。作为一个具体示例，假设有三个排序数组需要合并：`3,5,7`、`0,6`\
    \ 和 `0,6,28`。\n\n"
- fmt: "\nThe min-heap is initialized to the first entry of each array, i.e., it is^{3,0,0^}.\
    \ We extract the smallest entry, `0`, and add it to the output which is `0`. Then\
    \ we add `6` to the min-heap which is^{3,0,6^} now. (We chose the `0` entry corresponding\
    \ to the third array arbitrarily, it would be a perfectly acceptable to choose\
    \ from the second array.) Next, extract `0`, and add it to the output which is\
    \ `0,0`; then add `6` to the min-heap which is^{3,6,6^}. Next, extract `3`, and\
    \ add it to the output which is `0,0,3`; then add `5` to the min-heap which is{5,6,6}.\
    \ Next, extract `5`, and add it to the output which is `0,0,3,5`; then add `7`\
    \ to the min-heap which is^{7,6,6^}. Next, extract `6`, and add it to the output\
    \ which is `0,0,3,5,6`; assuming `6` is selected from the second array, which\
    \ has no remaining elements, the min-heap is^{7,6^}. Next, extract `6`, and add\
    \ it to the output which is `0,0,3,5,6,6`; then add `28` to the min-heap which\
    \ is^{7,28^}. Next, extract `7`, and add it to the output which is `0,0,3,5,6,6,7`;\
    \ the min-heap is^{28^}. Next, extract `28`, and add it to the output which is\
    \ `0,0,3,5,6,6,7,28`; now, all elements are processed and the output stores the\
    \ sorted elements.\n\n```python\ndef merge_sorted_arrays(sorted_arrays):\n   \
    \ min_heap = []\n    # Builds a list of iterators for each sorted_arrays\n   \
    \ sorted_arrays_iters = [iter(x) for x in sorted_arrays]\n    # Puts first element\
    \ from each iterator in min_heap.\n    for i, it in enumerate(sorted_arrays_iters):\n\
    \        first_element = next(it, None)\n        if first_element is not None:\n\
    \            heapq.heappush(min_heap, (first_element, i))\n    result = []\n \
    \   while min_heap:\n        smallest_entry, smallest_array_i = heapq.heappop(min_heap)\n\
    \        smallest_array_iter = sorted_arrays_iters[smallest_array_i]\n       \
    \ result.append(smallest_entry)\n        next_element = next(smallest_array_iter,\
    \ None)\n        if next_element is not None:\n            heapq.heappush(min_heap,\
    \ (next_element, smallest_array_i))\n    return result\n\n# Pythonic solution,\
    \ uses the heapq.merge() method which takes multiple inputs.\ndef merge_sorted_arrays_pythonic(sorted_arrays):\n\
    \    return list(heapq.merge(*sorted_arrays))\n```\n\nLet `k` be the number of\
    \ input sequences. Then there are no more than `k` elements in the min-heap. Both\
    \ `extract-min` and `insert` take `O(logk)` time. Hence, we can do the merge in\
    \ `O(nlogk)` time. The space complexity is `O(k)` beyond the space needed to write\
    \ the final result. In particular, if the data comes from files and is written\
    \ to a file, instead of arrays, we would need only `O(k)` additional storage.\n\
    \nAlternatively, we could recursively merge the `k` files, two at a time using\
    \ the merge step from `merge sort`. We would go from `k` to `k/2` then `k/4`,\
    \ etc. files. There would be `logk` stages, and each has time complexity `O(n)`,\
    \ so the time complexity is the same as that of the heap-based approach, i.e.,`O(nlogk)`.\
    \ The space complexity of any reasonable implementation of `merge sort` would\
    \ end up being `O(n)`, which is considerably worse than the heap based approach\
    \ when `k << n`.\n\n# 8 Searching\n\n![](images/00001.gif) — “The Anatomy of A\
    \ Large-Scale Hypertextual Web Search Engine,” S. M. Brin and L. P. Page, 1998\n\
    \nSearch algorithms can be classified in a number of ways. Is the underlying collection\
    \ static or dynamic, i.e., inserts and deletes are interleaved with searching?\
    \ Is it worth spending the computational cost to preprocess the data so as to\
    \ speed up subsequent queries? Are there statistical properties of the data that\
    \ can be exploited? Should we operate directly on the data or transform it?\n\n\
    In this chapter, our focus is on static data stored in sorted order in an array.\
    \ Data structures appropriate for dynamic updates are the subject of Chapters\
    \ 7, 9, and 11.\n\nThe first collection of problems in this chapter are related\
    \ to binary search. The second collection pertains to general search.\n\n## Binary\
    \ search\n\nGiven an arbitrary collection of `n` keys, the only way to determine\
    \ if a search key is present is by examining each element. This has `O(n)` time\
    \ complexity. Fundamentally, binary search is a natural elimination-based strategy\
    \ for searching a sorted array. The idea is to eliminate half the keys from consideration\
    \ by keeping the keys in sorted order. If the search key is not equal to the middle\
    \ element of the array, one of the two sets of keys to the left and the right\
    \ of the middle element can be eliminated from further consideration.\n\nQuestions\
    \ based on binary search are ideal from the interviewers perspective: it is a\
    \ basic technique that every reasonable candidate is supposed to know and it can\
    \ be implemented in a few lines of code. On the other hand, binary search is trickier\
    \ to implement than it appears.\n\n```python\ndef bsearch(t, A):\n    L, U = 0,\
    \ len(A) - 1\n    while L <= U:\n        M = (L + U) // 2\n        if A[M] < t:\n\
    \            L = M + 1\n        elif A[M] == t:\n            return M\n      \
    \  else:\n            U = M - 1\n    return -1\n```\n\nThe time complexity of\
    \ binary search is given by `T(n) = T(n/2) + c`, where `c` is a constant. This\
    \ solves to `O(logn)`, which is far superior to `O(n)` approach needed when keys\
    \ are unsorted. A disadvantage of binary search is that it requires a sorted array\
    \ and sorting an array takes `O(nlogn)` time. However, if there are many searches\
    \ to perform, the time taken to sort is not an issue.\n\n## Searching boot camp\n\
    \nWhen objects are comparable, they can be sorted and searched for using library\
    \ search functions. Typically, the language knows how to compare built-in types,\
    \ e.g., integers, strings, library classes for date, URLs, SQL timestamps. However,\
    \ user-defined types used in sorted collections must implement comparison, and\
    \ ensure this comparison has basic properties such as transitivity. (If the comparison\
    \ is implemented incorrectly, you may find a lookup into a sorted collection fails,\
    \ even when the item is present.)\n\nSuppose we are given as input an array of\
    \ students, sorted by descending GPA, with ties broken on name. In the program\
    \ below, we show how to use the library binary search routine to perform fast\
    \ searches in this array. In particular, we pass binary search a custom comparator\
    \ which compares students on GPA (higher GPA comes first), with ties broken on\
    \ name.\n\n```python\nStudent = collections.namedtuple('Student', ('name', 'grade_point_average'))\n\
    \ndef comp_gpa(student):\n    return (-student.grade_point_average, student.name)\n\
    \ndef search_student(students, target, comp_gpa):\n    i = bisect.bisect_left([comp_gpa(s)\
    \ for s in students], comp_gpa(target))\n    return 0 <= i < len(students) and\
    \ students[i] == target\n```\n\nAssuming the `i`-th element in the sequence can\
    \ be accessed in `O(1)` time, the time complexity of the program is `O(logn)`.\n\
    \n**Binary search** is an effective search tool. It is applicable to more than\
    \ just searching in **sorted arrays**, e.g., it can be used to search an **interval\
    \ of real numbers or integers**.\n"
