    \ that the minimum can be in either subtree, since a general binary tree may not\
    \ satisfy the `BST` property.\n\nThe problem with this approach is that it will\
    \ repeatedly traverse subtrees. In the worst-case, when the tree is a `BST` and\
    \ each node’s left child is empty, the complexity is `O(n²)`, where `n` is the\
