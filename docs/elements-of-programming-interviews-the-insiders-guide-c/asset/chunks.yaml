- fmt: "\nSome graph problems entail **analyzing structure**, e.g., looking for cycles\
    \ or connected components. `DFS` works particularly well for these applications.\n\
    \nSome graph problems are related to **optimization**, e.g., find the shortest\
    \ path from one vertex to another. `BFS`, `Dijkstra’s shortest path algorithm`,\
    \ and `minimum spanning tree` are examples of graph algorithms appropriate for\
    \ optimization problems.\n\n**Table 15.1:** Top Tips for Graphs\n\n### Graph search\n\
    \nComputing vertices which are reachable from other vertices is a fundamental\
    \ operation which can be performed in one of two idiomatic ways, namely depth-first\
    \ search (`DFS`) and breadth-first search (`BFS`). Both have linear time complexity—$O(|V|+|E|)$\
    \ to be precise. In the worst-case there is a path from the initial vertex covering\
    \ all vertices without any repeats, and the `DFS` edges selected correspond to\
    \ this path, so the space complexity of `DFS` is $O(|V|)$ (this space is implicitly\
    \ allocated on the function call stack). The space complexity of `BFS` is also\
    \ $O(|V|)$, since in a worst-case there is an edge from the initial vertex to\
    \ all remaining vertices, implying that they will all be in the BFS queue simultaneously\
    \ at some point.\n\n`DFS` and `BFS` differ from each other in terms of the additional\
    \ information they provide, e.g., `BFS` can be used to compute distances from\
    \ the start vertex and `DFS` can be used to check for the presence of cycles.\
    \ Key notions in `DFS` include the concept of discovery time and finishing time\
    \ for vertices.\n\n#### [15.1 P] Paint a Boolean matrix\n\nLet `A` be a Boolean\
    \ 2D array encoding a black-and-white image. The entry `A(a,b)` can be viewed\
    \ as encoding the color at entry $(a,b)$. Call two entries adjacent if one is\
    \ to the left, right, above or below the other. Note that the definition implies\
    \ that an entry can be adjacent to at most four other entries, and that adjacency\
    \ is symmetric, i.e., if `e0` is adjacent to entry `e1`, then `e1` is adjacent\
    \ to entry `e0`.\n\nDefine a path from entry `e0` to entry `e1` to be a sequence\
    \ of adjacent entries, starting at `e0`, ending at `e1`, with successive entries\
    \ being adjacent. Define the region associated with a point $(i, j)$ to be all\
    \ points $(i, j')$ such that there exists a path from $(i, j)$ to $(i, j')$ in\
    \ which all entries are the same color. In particular this implies $(i, j)$ and\
    \ $(i, j')$ must be the same color.\n\nImplement a routine that takes an $n \\\
    times m$ Boolean array `A` together with an entry $(x, y)$ and flips the color\
    \ of the region associated with $(x, y)$. See Figure 15.5 for an example of flipping.\n\
    \n(a) (b) (c)\n\n**Figure 15.5:** The color of all squares associated with the\
    \ first square marked with $\\times$ in (a) have been recolored to yield the coloring\
    \ in (b). The same process yields the coloring in (c).\n\nHint: Solve this conceptually,\
    \ then think about implementation optimizations. **Solution:** [C]hapter\n\n#\
    \ 16 Parallel Computing\n\nThe activity of a computer must include the proper\
    \ reacting to a possibly great variety of messages that can be sent to it at unpredictable\
    \ moments, a situation which occurs in all information systems in which a number\
    \ of computers are coupled to each other.\n\n— “Cooperating sequential processes,”\
    \ E. W. Dijkstra, 1965\n\nParallel computation has become increasingly common.\
    \ For example, laptops and desktops come with multiple processors which communicate\
    \ through shared memory. High-end computation is often done using clusters consisting\
    \ of individual computers communicating through a network.\n\nParallelism provides\
    \ a number of benefits:\n\n- High performance—more processors working on a task\
    \ (usually) means it is completed faster.\n- Better use of resources—a program\
    \ can execute while another waits on the disk or network.\n- Fairness—letting\
    \ different users or programs share a machine rather than have one program run\
    \ at a time to completion.\n- Convenience—it is often conceptually more straightforward\
    \ to do a task using a set of concurrent programs for the subtasks rather than\
    \ have a single program manage all the subtasks.\n- Fault tolerance—if a machine\
    \ fails in a cluster that is serving web pages, the others can take over.\n\n\
    Concrete applications of parallel computing include graphical user interfaces\
    \ (GUI) (a dedicated thread handles UI actions while other threads are, for example,\
    \ busy doing network communication and passing results to the UI thread, resulting\
    \ in increased responsiveness), Java virtual machines (a separate thread handles\
    \ garbage collection which would otherwise lead to blocking, while another thread\
    \ is busy running the user code), web servers (a single logical thread handles\
    \ a single client request), scientific computing (a large matrix multiplication\
    \ can be split across a cluster), and web search (multiple machines crawl, index,\
    \ and retrieve web pages).\n\nThe two primary models for parallel computation\
    \ are the shared memory model, in which each processor can access any location\
    \ in memory, and the distributed memory model, in which a processor must explicitly\
    \ send a message to another processor to access its memory. The former is more\
    \ appropriate in the multicore setting and the latter is more accurate for a cluster.\
    \ The questions in this chapter are focused on the shared memory model.\n\nWriting\
    \ correct parallel programs is challenging because of the subtle interactions\
    \ between parallel components. One of the key challenges is races—two concurrent\
    \ instruction sequences access the same address in memory and at least one of\
    \ them writes to that address. Other challenges to correctness are:\n\n- starvation\
    \ (a processor needs a resource but never gets it),\n- deadlock (`Thread A` acquires\
    \ `Lock L1` and `Thread B` acquires `Lock L2`, following which `A` tries to acquire\
    \ `L2` and `B` tries to acquire `L1`),\n- livelock (a processor keeps retrying\
    \ an operation that always fails).\n\nBugs caused by these issues are difficult\
    \ to find using testing. Debugging them is also difficult because they may not\
    \ be reproducible since they are load dependent. It is also often true that it\
    \ is not possible to realize the performance implied by parallelism—sometimes\
    \ a critical task cannot be parallelized, making it impossible to improve performance,\
    \ regardless of the number of processors. Similarly, the overhead of communicating\
    \ intermediate results between processors can exceed the performance benefits.\n\
    \n### Parallel computing boot camp\n\nA semaphore is a very powerful synchronization\
    \ construct. Conceptually, a semaphore maintains a set of permits. A thread calling\
    \ `acquire()` on a semaphore waits, if necessary, until a permit is available,\
    \ and then takes it. A thread calling `release()` on a semaphore adds a permit\
