  trans: "\n在 `dict` 中，访问不存在的键关联的值会导致 `KeyError` 异常。然而，`collections.defaultdict` 会返回实例化集合时指定的类型的默认值，例如，如果\
    \ `d = collections.defaultdict(list)`，那么如果 `k` 不在 `d` 中，则 `d[k]` 为 `[]`。`collections.Counter`\
    \ 用于计数键出现的次数，并具有若干类似于集合的操作，如下所示。\n\n```python\nc = collections.Counter(a=3, b=1)\n\
    d = collections.Counter(a=1, b=2)\n# 相加两个计数器\nc + d\n# 减法（仅保留正计数）\nc[x] + d[x],\
    \ collections.Counter({'a': 4, 'b': 3})\ncollections.Counter({'a': 2}) c - d \n\
    # 交集: min(c[x], d[x]), collections.Counter({'a': 1, 'b': 1})\nc & d\n# 并集: max(c[x],\
    \ d[x]), collections.Counter({'a': 3, 'b': 2})\nc | d\n```\n\n集合最重要的操作是 `s.add(42)`、`s.remove(42)`、`s.discard(123)`、`x\
    \ in s`，以及 `<= t`（是 t 的子集）和 `s - t`（s 中不在 t 中的元素）。\n\n这三个关键键值对集合的基本操作与集合的操作相似。唯一的区别在于迭代器——对键值对集合进行迭代会产生键。要迭代键值对，请迭代\
    \ `items()`；要迭代值值，请使用 `values()`。`keys()` 方法返回一个指向键的迭代器。\n\n并不是所有类型都是“可哈希的”（hashable），即可以被添加到集合或用作\
    \ `dict` 的键。特别是，可变容器是不可哈希的——这是为了防止客户端在对象添加到容器后对其进行修改，因为如果修改后的对象哈希值对应的槽位发生变化，查找将无法找到它。\n\
    \n注意，内置的 `hash()` 函数可以极大地简化自定义类哈希函数的实现，即实现 `__hash__(self__)`。\n\n# 9.1 匿名信是可以构造的吗？\n\
    \n编写一个程序，获取匿名信的文本和杂志的文本，并判断是否可以使用该杂志写出这封匿名信。如果匿名信中的每个字符在信中出现的次数不少于它在杂志中出现的次数，则可以使用杂志写出这封匿名信。\n\
    \n**提示：** 统计信中出现的不同字符的数量。\n\n**解决方案：** 暴力破解法是统计字符集中每个字符在信和杂志中出现的次数。如果任何字符在信中出现的次数多于在杂志中出现的次数，我们返回\
    \ `false`，否则返回 `true`。这种方法可能很慢，因为它遍历了所有字符，包括那些未在信或杂志中出现的字符。它还对信和杂志都进行了多次遍历——遍历的次数等于字符集中的字符数量。\n\
    \n更好的方法是对信进行单次遍历，将信的字符计数存储在单个哈希表中——键是字符，值是该字符出现的次数。接下来，我们对杂志进行单次遍历。在处理一个字符 `c`\
    \ 时，如果 `c` 出现在哈希表中，我们将其计数减 1；当计数变为 0 时，我们将其从哈希表中删除。如果哈希表变空，我们返回 `true`。如果我们到达信的结尾且哈希表非空，则返回\
    \ `false`——哈希表中剩余每个字符在信中出现的次数都多于在杂志。\n\n```python\ndef is_letter_constructible_from_magazine(letter_text,\
    \ magazine_text):\n    # 计算 letter_text 中所有字符的频率。\n    char_frequency_for_letter\
    \ = collections.Counter(letter_text)\n    for c in magazine_text:\n        if\
    \ c in char_frequency_for_letter:\n            char_frequency_for_letter[c] -=\
    \ 1\n            if char_frequency_for_letter[c] == 0:\n                # 检查 magazine_text\
    \ 中的字符是否可以覆盖\n                # char_frequency_for_letter 中的字符。\n            \
    \    del char_frequency_for_letter[c]\n    if not char_frequency_for_letter:\n\
    \        # letter_text 的所有字符都匹配。\n        return True\n    # char_frequency_for_letter\
    \ 为意味着 letter_text 中的每个字符都能\n    # 被 magazine_text 中的一个字符覆盖。\n    return not char_frequency_for_letter\n\
    \n# Pythonic 解决方案利用了减法仅保留正数的 collections.Counter 特性。\n# 注意键的计数为正数。\ndef is_letter_constructible_from_magazine_pythonic(letter_text,\
    \ magazine_text):\n    return (not collections.Counter(letter_text) - collections.Counter(magazine_text))\n\
    ```\n\n在最坏的情况下，信是不可构造的，或者杂志的最后一个字符本质上是需要的。因此，时间复杂度为 `O(m+n)`，其中 `m` 和 `n` 分别是信和杂志中的字符数量。空间复杂度是遍历信时构建的哈希表的大小，即\
    \ `O(L)`，其中 `L` 是信中不同字符的数量。\n\n如果字符是用 ASCII 编码的，我们可以取消哈希表并使用一个 256 个元素的整数数组 `A`，将\
    \ `A[i]` 设置为字符 `i` 在信中出现的次数。\n\n# 10 排序\n\n问题 14（归并）。两个长度分别为 `n` 和 `m` 的序列 `S`\
    \ 和 `T` 分别存储在内存中。目标是找到 `S,T` 的一个单调排列 `R`。\n\n"
- fmt: "\nThe heap data structure is discussed in detail in Chapter 7. Briefly, a\
    \ `max-heap` (`min-heap`) stores keys drawn from an ordered set. It supports `O(logn)`\
    \ inserts and `O(1)` time lookup for the maximum (minimum) element; the maximum\
    \ (minimum) key can be deleted in `O(logn)` time. Heaps can be helpful in sorting\
    \ problems, as illustrated by Problem 7.1 on Page 35.\n\n### Sorting boot camp\n\
    \nIt’s important to know how to use effectively the sort functionality provided\
    \ by your language’s library. Let’s say we are given a `Student` class that implements\
    \ a `compare` method that compares students by name. Then by default, the array\
    \ sort library routine will sort by name. To sort an array of `students` by GPA,\
    \ we have to explicitly specify the `compare` function to the `sort` routine.\n\
    \n```python\nclass Student(object):\n    def __init__(self , name , grade_point_average):\n\
    \        self.name = name\n        self.grade_point_average = grade_point_average\n\
    \n    def __lt__(self , other):\n        return self.name < other.name\n\nstudents\
    \ = [\n    Student(’A’, 4.0), Student(’C’, 3.0), Student(’B’, 2.0), Student(’D’,\
    \ 3.2) ]\n\n# Sort according to __lt__ defined in Student. students remained unchanged\
    \ .\nstudents_sort_by_name = sorted(students)\n\n# Sort students in-place by grade_point_average\
    \ .\nstudents.sort(key=lambda student: student.grade_point_average)\n```\n\nThe\
    \ time complexity of any reasonable library sort is `O(nlogn)` for an array with\
    \ n entries. Most library sorting functions are based on `quicksort`, which has\
    \ `O(1)` space complexity.\n\nSorting problems come in two flavors:\n1. **use\
    \ sorting to make subsequent steps in an algorithm simpler**, and\n2. design a\
    \ **custom sorting routine**. For the former, it’s fine to use a library sort\
    \ function, possibly with a custom comparator. For the latter, use a data structure\
    \ like a `BST`, `heap`, or `array` indexed by values.\n\nCertain problems become\
    \ easier to understand, as well as solve, when the input is sorted. The most natural\
    \ reason to sort is if the inputs have a **natural ordering**, and sorting can\
    \ be used as a preprocessing step to **speed up searching**.\n\nFor **specialized\
    \ input**, e.g., a very small range of values, or a small number of values, it’s\
    \ possible to sort in `O(n)` time rather than `O(nlogn)` time.\n\nIt’s often the\
    \ case that sorting can be implemented in **less space** than required by a brute-force\
    \ approach.\n\nSometimes it is not obvious what to sort on, e.g., should a collection\
    \ of intervals be sorted on starting points or endpoints? (Problem 10.2 on Page\
    \ 51)\n\n### Table 10.1: Top Tips for Sorting\n\n#### Know your sorting libraries\n\
    \nTo sort a list in-place, use the `sort()` method; to sort an iterable, use the\
    \ `sorted()` function.\n\n* The `sort()` method implements a stable in-place sort\
    \ for `list` objects. It returns `None`— the calling list itself is updated. It\
    \ takes two arguments, both optional: `key=None`, and `reverse=False`. If `key`\
    \ is not `None`, it is assumed to be a function which takes list elements and\
    \ maps them to objects which are comparable—this function defines the sort order.\
    \ For example, if `a=[1, 2, 4, 3, 5, 0, 11, 21, 100]` then `a.sort(key=lambda\
    \ x: str(x))` maps integers to strings, and `a` is updated to `[0, 1, 100, 11,\
    \ 2, 21, 3, 4, 5]`, i.e., the entries are sorted according to the lexicographical\
    \ ordering of their string representation. If `reverse` is set to `True`, the\
    \ sort is in descending order; otherwise it is in ascending order.\n\n* The `sorted()`\
    \ function takes an iterable and return a new list containing all items from the\
    \ iterable in ascending order. The original list is unchanged. For example, `b\
    \ = sorted(a, key=lambda x: str(x))` leaves `a` unchanged, and assigns `b` to\
    \ `[0, 1, 100, 11, 2, 21, 3, 4, 5]`. The optional arguments `key` and `reverse`\
    \ work identically to `sort`.\n\n#### [10.1 C] Compute the intersection of two\
    \ sorted arrays\n\nA natural implementation for a search engine is to retrieve\
    \ documents that match the set of words in a query by maintaining an inverted\
    \ index. Each page is assigned an integer identifier, its `documentID`. An inverted\
    \ index is a mapping that takes a word `w` and returns a sorted array of `page-ids`\
    \ which contain `w`—the sort order could be, for example, the page rank in descending\
    \ order. When a query contains multiple words, the search engine finds the sorted\
    \ array for each word and then computes the intersection of these arrays—these\
    \ are the pages containing all the words in the query. The most computationally\
    \ intensive step of doing this is finding the intersection of the sorted arrays.\n\
    \nWrite a program which takes as input two sorted arrays, and returns a new array\
    \ containing elements that are present in both of the input arrays. The input\
    \ arrays may have duplicate entries, but the returned array should be free of\
    \ duplicates. For example, the input is `2,3,3,5,5,6,7,7,8,12` and `5,5,6,8,8,9,10,10`,\
    \ your output should be `5,6,8`.\n\n**Hint:** Solve the problem if the input array\
    \ lengths differ by orders of magnitude.\n\n**Solution:** The brute-force algorithm\
    \ has `O(mn)` time complexity. Since both arrays are sorted, we can make some\
    \ optimizations. First, we can iterate through the first array and use binary\
    \ search in the second array to test if the element is present. The time complexity\
    \ is `O(mlogn)`, where `m` is the length of the array being iterated over. We\
    \ can further improve our run time by choosing the shorter array for the outer\
    \ loop since `n` is much smaller than `m`, then `nlog(m)` is much smaller than\
    \ `ml(n)`.\n\nThis is the best solution if one set is much smaller than the other.\
    \ However, it is not the best when array lengths are similar because we are not\
    \ exploiting the fact that both are sorted. We can achieve linear runtime by simultaneously\
    \ advancing through the two arrays. At each iteration, if the array elements differ,\
    \ the smaller one can be eliminated. If they are equal, we add that value to the\
    \ intersection and advance both. (We handle duplicates by comparing the current\
    \ element with the previous one.) For example, if the arrays are `A = 2,3,3,5,7,11`\
    \ and `B = 3,3,7,15,31`, then we know by inspecting the first element of each\
    \ that 2 cannot belong to the intersection, so we advance to the second element\
    \ of A. Now we have a common element, 3, which we add to the result, and then\
    \ we advance in both arrays. Now we are at 3 in both arrays, but we know 3 has\
    \ already been added to the result since the previous element in A is also 3.\
    \ We advance in both again without adding to the intersection. Comparing 5 to\
    \ 7, we can eliminate 5 and advance to the fourth element in A, which is 7, and\
    \ equal to the element that B’s iterator holds, so it is added to the result.\
    \ We then eliminate 11, and since no elements remain in A, we return `3,7`.\n\n\
    ```python\ndef intersect_two_sorted_arrays(A, B):\n    i, j, intersection_A_B\
    \ = 0, 0, []\n    while i < len(A) and j < len(B):\n        if A[i] == B[j]:\n\
    \            if i == 0 or A[i] != A[i - 1]:\n                intersection_A_B.append(A[i])\n\
    \            i, j = i + 1, j + 1\n        elif A[i] < B[j]:\n            i +=\
    \ 1\n        else: # A[i] > B[j].\n            j += 1\n    return intersection_A_B\n\
    ```\n\nSince we spend `O(1)` time per input array element, the time complexity\
    \ for the entire algorithm is `O(m + n)`.\n"
