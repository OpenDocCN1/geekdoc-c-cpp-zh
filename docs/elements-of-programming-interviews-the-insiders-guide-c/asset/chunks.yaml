  raw: 'If your solution uses sorting, and the computation performed after sorting
    is faster than sorting, e.g.,^O(n) or^O(logn), **look for solutions that do not
    perform a complete sort**.


    Consider **time**/**space tradeo**ff**s**, such as making multiple passes through
    the data. **Table 8.1:** Top Tips for Searching


    **Know your searching libraries**


    Thebisect module provides binary search functions for sorted list. Specifically,
    assuminga is a sorted list.


    • To find the first element that is not less than a targeted value, usebisect.bisect_left(a,x).
    This call returns the index of the first entry that is greater than or equal to
    the targeted value. If all elements in the list are less thanx, the returned value
    islen(a).


    • To find the first element that is greater than a targeted value, usebisect.bisect_right(a,x).
    This call returns the index of the first entry that is greater than the targeted
    value. If all elements in the list are less than or equal tox, the returned value
    islen(a).


    In an interview, if it is allowed, use the above functions, instead of implementing
    your own binary search.


    [8.1 S]earch a sorted array for first occurrence of [k]


    Binary search commonly asks for the index of any element of a sorted array that
    is equal to a specified element. The following problem has a slight twist on this.


    **-14 -10 2 108 108 243 285 285 285 401**


    A[0] A[1] A[2] A[3] A[4] A[5] A[6] A[7] A[8] A[9]


    **Figure 8.1:** A sorted array with repeated elements.


    Write a method that takes a sorted array and a key and returns the index of the
    first occurrence of that key in the array. For example, when applied to the array
    in Figure 8.1 your algorithm should return 3 if the given key is 108; if it is
    285, your algorithm should return 6.


    Hint: What happens when every entry equals k? Don’t stop when you first see k.


    **Solution:** A naive approach is to use binary search to find the index of any
    element equal to the key, k. (If k is not present, we simply return^−1.) After
    finding such an element, we traverse backwards from it to find the first occurrence
    of that element. The binary search takes time^O(logn), where n is the number of
    entries in the array. Traversing backwards takes^O(n) time in the worst-case—consider
    the case where entries are equal to k.


    The fundamental idea of binary search is to maintain a set of candidate solutions.
    For the current problem, if we see the element at index i equals k, although we
    do not know whether i is the first element equal to k, we do know that no subsequent
    elements can be the first one. Therefore we remove all elements with index i +
    1 or more from the candidates.


    Let’s apply the above logic to the given example, with k = 108\. We start with
    all indices as candidates, i.e., with [0,9]. The midpoint index, 4 contains k.
    Therefore we can now update the candidate set to [0,3], and record 4 as an occurrence
    of k. The next midpoint is 1, and this index contains^−10\. We update the candidate
    set to [2,3]. The value at the midpoint 2 is 2, so we update the candidate set
    to [3,3]. Since the value at this midpoint is 108, we update the first seen occurrence
    of k to 3\. Now the interval is [3,2], which is empty, terminating the search—the
    result is 3.


    def search_first_of_k(A, k):


    left , right , result = 0, len(A) - 1, -1


    # A[left:right + 1] is the candidate set.


    while left <= right:


    mid = (left + right) // 2


    if A[mid] > k:


    right = mid - 1


    elif A[mid] == k:


    result = mid


    right = mid - 1 # Nothing to the right of mid can be solution.


    else: # A[mid] < k.


    left = mid + 1


    return result


    The complexity bound is still^O(logn)—this is because each iteration reduces the
    size of the candidate set by half.


    **Variant:** Design an efficient algorithm that takes a sorted array and a key,
    and finds the index of the first occurrence of an element greater than that key.
    For example, when applied to the array in Figure 8.1 your algorithm should return
    9 if the key is 285; if it is^−13, your algorithm should return 1.


    **Variant:** Let A be an unsorted array of n integers, with A[0]^≥ A[1] and A[n^−
    2]^≤ A[n^− 1]. Call an index i a local minimum if A[i] is less than or equal to
    its neighbors. How would you efficiently find a local minimum, if one exists?


    **Variant:** Write a program which takes a sorted array A of integers, and an
    integer k, and returns the interval enclosing k, i.e., the pair of integers L
    and U such that L is the first occurrence of k in A and U is the last occurrence
    of k in A. If k does not appear in A, return [^−1,^−1]. For example if A = 1,2,2,4,4,4,7,11,11,13
    and k = 11, you should return [7,8].


    **Variant:** Write a program which tests if p is a prefix of a string in an array
    of sorted strings. [C]hapter


    # **9 Hash Tables**


    The new methods are intended to reduce the amount of space required to contain
    the hash-coded information from that associated with conventional methods. The
    reduction in space is accomplished by exploiting the possibility that a small
    fraction of errors of commission may be tolerable in some applications.


    — “Space/time trade-offs in hash coding with allowable errors,” B. H. B^(loom),
    1970


    A hash table is a data structure used to store keys, optionally, with corresponding
    values. Inserts, deletes and lookups run inO(1) time on average.


    The underlying idea is is to store keys in an array. A key is stored in the array
    locations (“slots”) based on its “hash code”. The hash code is an integer computed
    from the key by a hash function. If the hash function is chosen well, the objects
    are distributed uniformly across the array locations.


    If two keys map to the same location, a “collision” is said to occur. The standard
    mechanism to deal with collisions is to maintain a linked list of objects at each
    array location. If the hash function does a good job of spreading objects across
    the underlying array and take^O(1) time to compute, on average, lookups, insertions,
    and deletions haveO(1+n/m) time complexity, where n is the number of objects and
    m is the length of the array. If the “load” n/m grows large, rehashing can be
    applied to the hash table. A new array with a larger number of locations is allocated,
    and the objects are moved to the new array. Rehashing is expensive (O(n + m) time)
    but if it is done infrequently (for example, whenever the number of entries doubles),
    its amortized cost is low.


    A hash table is qualitatively di fferent from a sorted array—keys do not have
    to appear in order, and randomization (specifically, the hash function) plays
    a central role. Compared to binary search trees (discussed in Chapter 11), inserting
    and deleting in a hash table is more efficient (assuming rehashing is infrequent).
    One disadvantage of hash tables is the need for a good hash function but this
    is rarely an issue in practice. Similarly, rehashing is not a problem outside
    of realtime systems and even for such systems, a separate thread can do the rehashing.


    A hash function has one hard requirement—equal keys should have equal hash codes.
    This may seem obvious, but is easy to get wrong, e.g., by writing a hash function
    that is based on address rather than contents, or by including profiling data.


    A softer requirement is that the hash function should “spread” keys, i.e., the
    hash codes for a subset of objects should be uniformly distributed across the
    underlying array. In addition, a hash function should be efficient to compute.


    A common mistake with hash tables is that a key that’s present in a hash table
    will be updated. The consequence is that a lookup for that key will now fail,
    even though it’s still in the hash table. If you have to update a key, first remove
    it, then update it, and finally, add it back—this ensures it’s moved the correct
    array location. As a rule, you should avoid using mutable objects as keys.'
