    # **3 Strings**


    String pattern matching is an important problem that occurs in many areas of science
    and information processing. In computing, it occurs naturally as part of data
    processing, text editing, term rewriting, lexical analysis, and information retrieval.


    — “Algorithms For Finding Patterns in Strings,” A. V. A^(ho), 1990


    Strings are ubiquitous in programming today—scripting, web development, and bioinformatics
    all make extensive use of strings.


    A string can be viewed as a special kind of array, namely one made out of characters.
    We treat strings separately from arrays because certain operations which are commonly
    applied to strings—for example, comparison, joining, splitting, searching for
    substrings, replacing one string by another, parsing, etc.—do not make sense for
    general arrays.


    You should know how strings are represented in memory, and understand basic operations
    on strings such as comparison, copying, joining, splitting, matching, etc. Advanced
    string processing algorithms often use hash tables (Chapter 9) and dynamic programming
    (Page 63). In this chapter we present problems on strings which can be solved
    using basic techniques.


    **Strings boot camp**


    A palindromic string is one which reads the same when it is reversed. The program
    below checks whether a string is palindromic. Rather than creating a new string
    for the reverse of the input string, it traverses the input string forwards and
    backwards, thereby saving space. Notice how it uniformly handles even and odd
    length strings.


    def is_palindromic(s):


    # Note that s[~i] for i in [0, len(s) - 1] is s[-(i + 1)].


    return all(s[i] == s[~i] for i in range(len(s) // 2))


    The time complexity is^O(n) and the space complexity is^O(1), where n is the length
    of the string. **Know your string libraries**


    The key operators and functions on all the other variants of slicing for strings
    are s[3], len(s), s + t, s[2:4] (and


    lists described on Page 9), s in t, s.strip(), s.startswith(prefix),s.endswith(suffix),’Euclid,Axiom
    5,Parallel Lines’.split(’,’), 3 * ’01’, ’,’.join((’Gauss’, ’Prince of Mathematicians’,
    ’1777-1855’)), s.tolower(), and’Name name, Rank rank’.format(name=’Archimedes’,
    rank=3).


    It’s important to remember that strings are immutable—operations like s = s[1:]
    or s += ’123’ imply creating a new array of characters that is then assigned back
    tos. This implies that concatenating a single character n times to a string in
    a for loop has^O(n²) time complexity. (Some Similar to arrays, string problems
    often have simple brute-force solutions that use^O(n) space solution, but subtler
    solutions that use the string itself to **reduce space complexity** to^O(1).


    Understand the **implications** of a string type which is **immutable**, e.g.,
    the need to allocate a new string when concatenating immutable strings. Know **alternatives**
    to immutable strings, e.g., alist in Python.


    Updating a mutable string from the front is slow, so see if it’s possible to **write
    values from the back**.


    **Table 3.1:** Top Tips for Strings


