    = max_available self.taken = 0


    def acquire(self):


    self.cv.acquire ()


    while (self.taken == self.MAX_AVAILABLE):


    self.cv.wait()


    self.taken += 1


    self.cv.release ()


    def release(self): self.cv.acquire () self.taken -= 1 self.cv.notify () self.cv.release
    ()


    Start with an algorithm that **locks aggressively** and is easily seen to be correct.
    Then **add back concurrency**, while ensuring the **critical** parts are locked.


    When analyzing parallel code, assume a worst-case thread scheduler. In particular,
    it may choose to schedule the same thread repeatedly, it may alternate between
    two threads, it may starve a thread, etc.


    Try to work at a **higher level of abstraction**. In particular, know the **concurrency
    libraries**— don’t implement your own **semaphores, thread pools, deferred execution**,
    etc. (You should know how these features are implemented, and implement them if
