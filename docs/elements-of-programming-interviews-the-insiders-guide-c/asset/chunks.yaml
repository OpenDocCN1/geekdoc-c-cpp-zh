    考虑一个基于 Web 的日历，其中托管日历的服务器必须在下一个日历事件发生时执行某项任务。（该任务可以是发送电子邮件或短信服务 (SMS)。）你的任务是设计一个管理此类任务执行的设施。


    开发一个 `timer` 类来管理延迟任务的执行。`timer` 构造函数接收一个对象作为参数，该对象包含一个 `run` 方法和一个字符串字段 `name`。该类必须支持：(1.)
    在未来的某个时间启动一个由 `name` 标识的线程；以及 (2.) 取消由 `name` 标识的线程（如果线程已经启动，则忽略取消请求）。


    提示：涉及两个方面——数据结构设计和并发。


    **解决方案:** 设计的两个方面是数据结构和锁机制。我们使用两个数据结构。第一个是 `min-heap`（最小堆），我们在其中插入键值对：键是运行时间，值是在该时间运行的线程。一个分发线程（dispatch
    thread）运行这些线程；它在每次调用之间保持睡眠，如果池中添加或删除了线程，它可能会被唤醒。如果被唤醒，它将根据 `min-heap` 顶部的元素推进或延迟其剩余的睡眠时间。唤醒后，它查找
    `min-heap` 顶部的线程——如果它的启动时间是当前时间，分发线程将其从 `min-heap` 中删除并执行它。然后它将睡眠直到 `min-heap`
    中下一个线程的启动时间。（由于删除操作，可能会出现分发线程唤醒后发现无事可。）


    第二个数据结构是 `hash table`（哈希表），以线程 ID 为键，`min-heap` 中的项值为值。如果我们需要取消一个线程，就去 `min-heap`
    删除它。每当添加一个线程时，我们就将其添加到 `min-heap` 中；如果插入到 `min-heap` 的顶部，我们就中断分发线程以便其调整唤醒时间。


    由于 `min-heap` 被更新方法和分发线程共享，我们需要对它加锁。最简单的解决方案是使用单一锁，用于对 `min-heap` 和 `hash table`
    的所有读写操作。


    ## 第二部分：领域特定问题


    # 17 设计问题


    不要被许多关于复杂性的书籍，或你在书中或其他地方发现的许多复杂且晦奥的算法所误导。虽然没有关于简单性的教科书，但简单的系统可以运行，而复杂的则不行。


    — “Transaction Processing: Concepts and Techniques,” J. G^(ray), 1992


    在面试中，你可能会被问及如何创建一个服务集或更大的系统，这可能是建立在你设计的算法之上的。这些问题是相当开放的，许多问题可以作为大型软件项目的起点。


    在面试环境中，当有人问此类问题时，你应该进行一次对话，在其中展示你具备创造性思考、理解设计权衡以及应对未知问题的能力。你应该勾画关键的数据结构和算法，以及你将用于解决该问题的技术栈（编程语言、库、操作系统、硬件和服务）。


    本章中的答案是在这种语境下呈现的——它们旨在作为面试中良好回答的示例，而不是全面的最先进解决方案。


    我们在表 17.1 中回顾了用于设计系统的模式。在设计系统时需要考虑的其他因素还有实现时间、可扩展性、可伸缩性、可测试性、安全性、国际化和 IP 问题。


    **表 17.1：系统设计模式。**


    | 设计原则 | 关键点 |

    | :--- | :--- |

    | **算法与数据结构** | 识别基础算法和数据结构。将功能、架构和代码拆分为可管理、可复用的组件。 |

    | **分解** | 将问题分解为可以在不同机器上相对独立解决的子问题。跨机器分片（Shard）数据以适应需求。将处理写的服务器与处理读的服务器解耦。在读服务器上使用复制以获得更多性能。考虑缓存计算并在稍后查找以节省工作。
    |


    **分解** 良好的分解对于成功解决系统级设计问题至关重要。功能、架构和代码都受益于分解。


    例如，在我们设计在线广告系统的解决方案中，我们根据利益相关者将目标分解为几类。我们将架构本身分解为前端和后端。前端又分为用户管理、网页设计、报告功能等。后端由中间件、存储、数据库、cron
    服务和用于广告排序的算法组成。


    代码分解是面向对象编程的标志。设计模式的主题是寻找实现代码复用的良好方法。广而言之，设计模式分为创建模式、结构模式和行为模式。许多特定的模式非常自然——策略对象、适配器、构建器等出现在我们代码库的许多地方。Freeman
    等人的《Head First Design Patterns》在我们看来是学习设计模式的正确读物。


    **可扩展性** 在面试题背景下，并行性在处理规模时非常有用，即当问题大到无法放入单台机器上，或者在单台机器上运行花费无法接受的时间时。你需要展示的关键洞察是，你知道如何分解问题以使得：

    - 每个子问题都可以相对独立地解决，并且

    - 原始问题的解决方案可以从子问题的解决方案高效构造。


    效率通常以中央处理器（`CPU`）时间、随机访问内存（`RAM`）、网络带宽等衡量。


    考虑排序 PB 整数数组。如果我们知道分布，最好的方法是定义等大小的整数范围，并将范围发送到一台机器进行排序。排序后的数字只需按顺序拼接即可。如果分布未知，可以将任意子集发送到每台机器，然后使用
    `min-heap` 等方法合并结果。


    每当计算重复时，缓存都是极佳的工具。例如，动态规划的核心思想是缓存中间计算的结果。在实现一个预期随时间推响应许多请求且许多请求是重复的服务时，缓存也极其有用。Web
    服务的负载具有这种特性。


    ## 17.1 设计一个检测侵权的系统


    YouTV.com 是一个成功的在线视频分享网站。好莱坞制片公司抱怨上传到网站的大部分材料侵犯版权。


    设计一个功能，允许制片公司输入其所属的视频集 `V`，并确定 YouTV.com 数据库中哪些视频与 `V` 匹配。


    提示：归一化视频格式并创建签名。


    **解决方案:**视频与文档的区别在于，相同的内容可能以不同的格式、分辨率和压缩水平进行编码。


    将重复视频问题转换为重复文档问题的一种方法是将所有视频重新编码为通格式、分辨率和压缩水平。这本身并不意味着两个相同内容的视频会变成完全相同的文件——初始设置会影响生成的视频。然而，我们现在可以对归一化后的视频进行“签名”。


