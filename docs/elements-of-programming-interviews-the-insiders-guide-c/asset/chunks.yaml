    parity of the XOR of b[63],b[62], . . . ,b[32] and b[31],b[30], . . . ,b[0] .
    The XOR of these two 32-bit values can be computed with a single shift and a single
    32-bit XOR instruction. We repeat the same operation on 32-, 16-, 8-, 4-, 2-,
    and 1-bit operands to get the final result. Note that the leading bits are not
    meaningful, and we have to explicitly extract the result from the least-significant
    bit.


