    \ is performed by replacing the root’s key with the key at the last leaf and then\
    \ recovering the heap property by repeatedly exchanging keys with children.\n\n\
    ## Heaps boot camp\nSuppose you were asked to write a program which takes a sequence\
    \ of strings presented in “streaming” fashion: you cannot back up to read an earlier\
    \ value. Your program must compute the k longest strings in the sequence. All\
    \ that is required is the k longest strings—it is not required to order these\
    \ strings.\n\nAs we process the input, we want to track the k longest strings\
    \ seen so far. Out of these k strings, the string to be evicted when a longer\
    \ string is to be added is the shortest one. A min-heap (not a max-heap!) is the\
    \ right data structure for this application, since it supports efficient `find-min`,\
    \ `remove-min`, and `insert`. In the program below we use a heap with a custom\
    \ compare function, wherein strings are ordered by length.\n\n```python\ndef top_k(k,\
    \ stream):\n    # Entries are compared by their lengths.\n    min_heap = [( len(s),\
    \ s) for s in itertools.islice(stream , k)]\n    heapq.heapify(min_heap)\n   \
    \ for next_string in stream:\n        # Push next_string and pop the shortest\
    \ string in min_heap.\n        heapq.heappushpop(min_heap , (len(next_string),\
    \ next_string)) \n    return [p[1] for p in heapq.nsmallest(k, min_heap)]\n```\n\
    \nEach string is processed in `O(logk)` time, which is the time to add and to\
    \ remove the minimum element from the heap. Therefore, if there are n strings\
    \ in the input, the time complexity to process all of them is `O(nlogk)`.\n\n\
    We could improve best-case time complexity by first comparing the new string’s\
    \ length with the length of the string at the top of the heap (getting this string\
    \ takes `O(1)` time) and skipping the insert if the new string is too short to\
    \ be in the set.\n\nUse a heap when **all you care about** is the **largest**\
    \ or **smallest** elements, and you **do not need** to support fast lookup, delete,\
    \ or search operations for arbitrary elements.\n\nA heap is a good choice when\
    \ you need to compute the k largest or k smallest elements in a collection. For\
    \ the former, use a min-heap, for the latter, use a max-heap.\n\n**Table 7.1:**\
    \ Top Tips for Heaps\n\n## Know your heap libraries\nHeap functionality in Python\
    \ is provided by the `heapq` module. The operations and functions we will use\
    \ are:\n\n- `heapq.heapify(L)`, which transforms the elements in `L` into a heap\
    \ in-place,\n- `heapq.nlargest(k, L)` (`heapq.nsmallest(k, L)`) returns the k\
    \ largest (smallest) elements in `L`,\n- `heapq.heappush(h, e)`, which pushes\
    \ a new element on the heap,\n- `heapq.heappop(h)`, which pops the smallest element\
    \ from the heap,\n- `heapq.heappushpop(h, a)`, which pushes `a` on the heap and\
    \ then returns the smallest element,\n- `e = h[0]`, which returns the smallest\
    \ element on the heap without popping it.\n\nIt’s very important to remember that\
    \ `heapq` only provides min-heap functionality. If you need to build a max-heap\
    \ on integers, insert their negative to get a max-heap. For objects, implement\
    \ `__lt__` appropriately.\n\n### 7.1 Merge sorted files\nThis problem is motivated\
    \ by the following scenario. You are given 500 files, each containing trade information\
    \ for an S&P 500 company. Each trade is encoded by a line in the following format:\
    \ `123211,AAPL,30,456`. The first number is the time of the trade expressed as\
    \ milliseconds since the start of the day. Lines within each file are sorted in\
    \ increasing order. The remaining values are stock symbol, number of shares, and\
    \ price. You are to create a single file containing all the trades from the 500\
    \ files, sorted in order of times. The individual files are of the order of 5–100\
    \ megabytes; the combined file will be of the order of five gigabytes. In the\
    \ abstract, we are trying to solve the following problem:\n\nWrite a program that\
    \ takes as input a set of sorted sequences and computes the union of these sequences\
    \ as a sorted sequence. For example, if the input is `3,5,7`, `0,6`, and `0,6,28`,\
    \ then the output is `0,0,3,5,6,6,7,28`.\n\n**Hint:** Which part of each sequence\
    \ is significant as the algorithm executes?\n\n**Solution:** A brute-force approach\
    \ is to concatenate these sequences into a single array and then sort it. The\
    \ time complexity is `O(logn)`, assuming there are n elements in total. The brute-force\
    \ approach does not use the fact that the individual sequences are sorted. We\
