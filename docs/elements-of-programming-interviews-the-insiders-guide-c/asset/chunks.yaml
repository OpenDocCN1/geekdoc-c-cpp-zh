- fmt: "\nA string is a sequence of characters. A string may encode an integer, e.g.,\
    \ “123” encodes 123. In this problem, you are to implement methods that take a\
    \ string representing an integer and return the corresponding integer, and vice\
    \ versa. Your code should handle negative integers. You cannot use library functions\
    \ like `stoi` in C++, `parseInt` in Java, and `int` in Python.\n\nImplement string\
    \ `/integer` inter-conversion functions. Hint: Build the result one digit at a\
    \ time.\n\n**Solution:** Let’s consider the integer to string problem first. If\
    \ the number to convert is a single digit, i.e., it is between 0 and 9, the result\
