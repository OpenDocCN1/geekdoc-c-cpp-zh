    \ DP。\n\n与分治法类似，DP 通过结合多个较小问题的解决方案来解决问题，但 DP 的不同之处在于相同的子问题可能会重复。因此，使 DP 高效的关键是缓存中间计算的结果。使用\
    \ DP 解决问题的题是困难面试题的热门选择。\n\n为了说明 DP 的底层思想，考虑计算斐波那契数。前两个斐波那契数是 0 和 1。后续数字是前两个数字之和。前几个斐波那契数是\
    \ 0,1,1,2,3,5,8,13,21...斐波那契数出现在许多不同的应用中——生物学、数据结构分析和并行计算就是一些例子。\n\n在数学上，第 n 个斐波那契数\
    \ `F(n)` 由方程 `F(n) = F(n−1)+F(n−2)`给出，其中 `F(0) = 0` 且 `F(1) = 1`。一个递归调用自身的计算 `F(n)`\
    \ 的函数时间复杂度随 n 呈指数级。这是因为递归函数重复计算了某些 `F(n)`。缓存中间结果可以使计算斐波那契数的复杂度变为相对于 n 性的，代价是^O(n)\
    \ 的存储。\n\n```python\ndef fibonacci(n, cache={}):\n    if n <= 1:\n        return\
    \ n\n    elif n not in cache:\n        cache[n] = fibonacci(n - 1, cache) + fibonacci(n\
    \ - 2, cache)\n    return cache[n]\n```\n\n最小化缓存是 DP 中的一个反复出现的主题。现在展示一个以^O(n)\
    \ 时间和^O(1) 空间计算 `(n)` 的程序。概念上，与上面的程序相比，此程序以自底的方式填充缓存。\n\n```python\ndef fibonacci(n):\n\
    \    if n <= 1:\n        return n\n    f_minus_2, f_minus_1 = 0, 1\n    for _\
    \ in range(1, n):\n        f_minus_2, f_minus_1 = f_minus_1, f_minus_2 + f_minus_1\n\
    \    return f_minus_1\n```\n\n**图 13.1：** 朴素计算斐波那契数的递归调用树。每个节点都是带有参数 x 的调用，右侧斜体数字是调用的顺序。节点的子节点是该调用的子调用。关键是找到一种将问题分解为子问题的方法，使得：\n\
    • 一旦子问题可用，就可以轻松解决原始问题，并且\n• 这些子问题的解被缓存。\n\n通常，但并非总是，子问题很容易识别的。这里有一个更复杂的 DP 应用。考虑以下问题：找到给定数组所有子数组的最大和。作为一个具体的例子，图\
    \ 13.2 中数组的最大子数组从索引 0 开始到索引 3 结束。\n\n**904 40 523 12 -335 -385 -124 481 -31**\n\
    A[0] A[1] A[2] A[3] A[4] A[5] A[6] A[7] A[8]\n**图 13.2：** 一个具有最大子数组和的数组。\n\n计算每个子数组和的暴力算法时间复杂度为^O(n³)——有^(n(n+1))\
    \ 个子数组，每个和计算需要^O(n) 时间。通过先计算 `S[k] = A[0,k]`，暴力算法可以改进为^O(n²)，代价是^O(n) 的额外存储。\n\
    \n这里有一个自然的分治算法。取 `m =^n` 为 A 的中间索引。解决子数组 `L = A[0,m]` 和 `R = A[m + 1,n−1]` 的问题。除了每个问题的答案外，我们还返回以\
    \ L 的最后一个元素结束的子数组的最大和 `l`，以及从 R 的第一个元素开始的子数组的最大和 `r`。数组 A 的最大子数组和是 `l + r`、L 的答案和\
    \ R 的答案之间的最大值。时间复杂度分析与快速排序类似，时间复杂度为^O(nlogn)。由于差一错误，需要一些时间让程序完全正确。\n\n"
- fmt: "\nNow we will solve this problem by using DP. A natural thought is to assume\
    \ we have the solution for the subarray `A[0,n^− 2]`. However, even if we knew\
    \ the largest sum subarray for subarray `A[0,n− 2]`, it does not help us solve\
    \ the problem for `A[0,n− 1]`. Instead we need to know the subarray amongst all\
    \ subarrays `A[0,i]`, `i< n− 1`, with the smallest subarray sum. The desired value\
    \ is `S[n^− 1]` minus this subarray’s sum. We compute this value by iterating\
    \ through the array. For each index `j`, the maximum subarray sum ending at `j`\
    \ is equal to `S[j]^− min[k]≤[j] S[k]`. During the iteration, we track the minimum\
    \ `S[k]` we have seen so far and compute the maximum subarray sum for each index.\
    \ The time spent per index is constant, leading to `an^O(n)` time and `^O(1)`\
    \ space solution. It is legal for all array entries to be negative, or the array\
    \ to be empty. The algorithm handles these input cases correctly.\n\n```python\n\
    def find_maximum_subarray(A):\n    min_sum = max_sum = 0\n    for running_sum\
    \ in itertools.accumulate(A):\n        min_sum = min(min_sum , running_sum)\n\
    \        max_sum = max(max_sum , running_sum - min_sum)\n    return max_sum\n\
    ```\n\n## **Dynamic programming boot camp**\n\nThe programs presented in the introduction\
    \ for computing the Fibonacci numbers and the maximum subarray sum are good illustrations\
    \ of DP.\n\n### 13.1 Count the number of ways to traverse a [2D] array\n\nIn this\
    \ problem you are to count the number of ways of starting at the top-left corner\
    \ of a 2D array and getting to the bottom-right corner. All moves must either\
    \ go right or down. For example, we show three ways in a `5^× 5` 2D array in Figure\
    \ 13.3. (As we will see, there are a total of 70 possible ways for this example.)\n\
    \n**Figure 13.3:** Paths through a 2D array.\n\nWrite a program that counts how\
    \ many ways you can go from the top-left to the bottom-right in a 2D array.\n\n\
    **Hint:** If `i> 0` and `j> 0`, you can get to `(i, j)` from `(i− 1, j)` or `(j−\
    \ 1,i)`.\n\nConsider using DP whenever you have to **make choices** to arrive\
    \ at the solution. Specifically, DP is applicable when you can construct a solution\
    \ to the given instance from solutions to subinstances of smaller problems of\
    \ the same kind.\n\nIn addition to optimization problems, DP is also **applicable**\
    \ to **counting and decision problems**—any problem where you can express a solution\
    \ recursively in terms of the same computation on smaller instances.\n\nAlthough\
    \ conceptually DP involves recursion, often for efficiency the cache is **built\
    \ “bottomup”**, i.e., iteratively.\n\nWhen DP is implemented recursively the cache\
    \ is typically a dynamic data structure such as a hash table or a BST; when it\
    \ is implemented iteratively the cache is usually a one- or multi-dimensional\
    \ array.\n\nTo save space, **cache space** may be **recycled** once it is known\
    \ that a set of entries will not be looked up again.\n\nA common **mistake** in\
    \ solving DP problems is trying to think of the recursive case by splitting the\
    \ problem into **two equal halves**, a la quicksort, i.e., solve the subproblems\
    \ for subarrays `A[0,^n ]` and `A[n2 + 1,n]` and combine the results. However,\
    \ in most cases, these two subproblems are not sufficient to solve the original\
    \ problem.\n\nDP is based on **combining solutions** to subproblems to **yield\
    \ a solution** to the original problem. However, for some problems DP will not\
    \ work. For example, if you need to compute the longest path from City 1 to City\
    \ 2 without repeating an intermediate city, and this longest path passes through\
    \ City 3, then the subpaths from City 1 to City 3 and City 3 to City 2 may not\
    \ be individually longest paths without repeated cities.\n\n**Table 13.1:** Top\
    \ Tips for Dynamic Programming\n\n**Solution:** A brute-force approach is to enumerate\
    \ all possible paths. This can be done using recursion. However, there is a combinatorial\
    \ explosion in the number of paths, which leads to huge time complexity.\n\nThe\
    \ problem statement asks for the number of paths, so we focus our attention on\
    \ that. A key observation is that because paths must advance down or right, the\
    \ number of ways to get to the bottom-right entry is the number of ways to get\
    \ to the entry immediately above it, plus the number of ways to get to the entry\
    \ immediately to its left. Let’s treat the origin `(0,0)` as the top-left entry.\
    \ Generalizing, the number of ways to get to `(i, j)` is the number of ways to\
    \ get to `(i− 1, j)` plus the number of ways to get to `(i, j^− 1)`. (If `i =\
    \ 0` or `j = 0`, there is only one way to get to `(i, j)` from the origin.) This\
    \ is the basis for a recursive algorithm to count the number of paths. Implemented\
    \ naively, the algorithm has exponential time complexity—it repeatedly recurses\
    \ on the same locations. The solution is to cache results. For example, the number\
    \ of ways to get to `(i, j)` for the configuration in Figure 13.3 on the previous\
    \ page is cached in a matrix as shown in Figure 13.4 on the facing page.\n\n```python\n\
    def number_of_ways(n, m):\n    number_of_ways = [[0] * m for _ in range(n)]\n\
    \    for i in range(n):\n        for j in range(m):\n            if i == 0 and\
    \ j == 0:\n                number_of_ways[i][j] = 1\n            else:\n     \
    \           ways_top = 0 if i == 0 else number_of_ways[i-1][j]\n             \
    \   ways_left = 0 if j == 0 else number_of_ways[i][j-1]\n                number_of_ways[i][j]\
    \ = ways_top + ways_left\n    return number_of_ways[n-1][m-1]\n```\n(Note: The\
    \ logic in the provided text for the code was fragmented; I have reconstructed\
    \ the standard DP approach for the problem described in the text.)\n"
