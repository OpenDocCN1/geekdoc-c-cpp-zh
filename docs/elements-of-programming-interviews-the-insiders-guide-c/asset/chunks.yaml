  trans: "\n字符串是字符的序列。字符串可以编码一个整数，例如，“123”编码为 123。在这个问题中，你需要实现方法，接收一个表示整数的字符串并返回对应的整数，反之亦然。你的代码应该处理负整数。你不能使用像\
    \ C++ 中的 `stoi`、Java 中的 `parseInt` 以及 Python 中的 `int` 等库函数。\n\n实现字符串与整数之间的互转换函数。提示：一次构建一个数字的结果。\n\
    \n**解决方案：** 让我们先考虑整数到字符串的问题。如果要转换的数字是单位数（即在 0 到 9 之间），结果很容易计算：它就是由编码该数字的单个字符组成的字符串。\n\
    \n如果数字多于一位，逐位进行转换是自然而然的。关键洞察是，对于任何正整数 `x`，十进制表示法中的最低位数字是 `x mod 10`，剩余数字是 `x/10`。这种方法按倒序计算数字位，例如，如果我们从\
    \ 423 开始，我们得到 3，并剩下 42 待转换。然后我们得到 2，并剩下 4 待转换。最后，我们得到 4，且没有数字可以转换了。自然的算法是将数字前置到部分结果。然而，在字符串开头添加数字是非常昂销的，因为所有剩余数字都必须移动。一种更高效的时间的方法是将每个计算出的数字添加到末尾，然后反转计算出的序列。\n\
    \n如果 `x` 是负数，我们记录下来，对 `x` 取反，然后在反转之前添加一个‘-’。如果 `x` 为 0，我们的代码将在不写入任何数字的情况下跳出循环，在这种情况下，我们需要显式地将其设为\
    \ 0。\n\n要从字符串转换为整数，我们回到了位值计数法的基本工作原理。一个十进制数 `d[2]d[1]d[0]` 编码数字 `10^(2×) d[2]\
    \ + 10^(1×) d[1] + d[0]`。一种暴力算法是从右侧的数字开始，迭代地将 `10^i× d[i]` 加到累加和中。计算 `10^(i+1)`\
    \ 的有效方法是使用现有的值 `10^i` 并将其乘以 10。\n\n另一种优雅的解决方案是从左侧的数字开始，并随着后的每个数字，将部分结果乘以 10 并加上该数字。例如，要将“314”转换为整数，我们将部分结果\
    \ `r` 初始化为 0。在第一次迭代中，`r = 3`，在第二次迭代中 `r = 3^× 10 + 1 = 31`，在第三次迭代中 `r = 31× 10\
    \ + 4 = 314`，这便是最终结果。\n\n负数通过记录符号并取反结果来处理。\n\n```python\ndef int_to_string(x):\n\
    \    is_negative = False\n    if x < 0:\n        x, is_negative = -x, True\n \
    \   s = []\n    while True:\n        s.append(chr(ord(’0’) + x % 10))\n      \
    \  x //= 10\n        if x == 0:\n            break\n    # 如果 is_negative 为真则加回负号\n\
    \    return (’-’ if is_negative else '') + ’’.join(reversed(s))\n\ndef string_to_int(s):\n\
    \    return functools.reduce(lambda running_sum ,\n                          \
    \ c: running_sum * 10 + string.digits.index(c), s[s[0] == ’-’:],\n           \
    \                0) * (-1 if s[0] == ’-’ else 1)\n```\n\n### 3.2 进制转换\n\n在十进制系统中，数字的位置用于表示该数字所乘的\
    \ 10 的幂次方。例如，“314”表示数字 `3^× 100 + 1^× 10 + 4^× 1`。进制 `b` 系统推广了十进制系统：字符串“a[k]−[1]a[k]−[2]...a[1]a[0]”，其中\
    \ `0^≤ a[i]< b` 在进制 `b` 中表示整数 `a[0]^× b⁰ + a[1]^× b¹ + a[2]^× b² +^(· ·) + a[k−[1]^×\
    \ b^(k−1)`。\n\n编写一个执行进制转换的程序。输入是一个字符串、一个整数 `b[1]` 和另一个整数 `b[2]`。字符串表示进制 `b[1]`\
    \ 中的整数。输出应该是该整数在进制 `b[2]` 中的字符串。假设 `2^≤ b[1],b[2]^≤ 16`。用“A”表示 10，“B”表示 11……，用“F”表示\
    \ 15。（例如，如果字符串是“615”，`b[1]` 是 7，`b[2]` 是 13，那么结果应该是“1A7”，因为 `6× 7² + 1× 7 + 5\
    \ = 1× 13² + 10× 13 + 7`。）\n\n提示：你可以轻松地转换哪种进制？\n\n**解决方案：** 一种暴力方法可能是将输入转换为元表示，然后将\
    \ 1 分组为 `b[2]`、`b²`、`b³` 等的倍数。例如，111111111111111111111111111111111111111111111111111111111111111。结果是\
    \ 1A7，因为 `6× 7² + 1× 7 + 5 = 1× 13² + 10× 13 + 7`。\n\n\n"
- fmt: "\nFor all problems in this chapter, unless otherwise stated, each node has\
    \ two entries—a data field, and a next field, which points to the next node in\
    \ the list, with the next field of the last node being null. Its prototype is\
    \ as follows:\n\n```python\nclass ListNode:\n    def __init__(self , data=0, next_node=None):\n\
    \        self.data = data\n        self.next = next_node\n```\n\n# **Linked lists\
    \ boot camp**\n\nThere are two types of list-related problems—those where you\
    \ have to implement your own list, and those where you have to exploit the standard\
    \ list library. We will review both these aspects here, starting with implementation,\
    \ then moving on to list libraries.\n\nImplementing a basic list API—search, insert,\
    \ delete—for singly linked lists is an excellent way to become comfortable with\
    \ lists.\n\n### Search for a key:\n\n```python\ndef search_list(L, key):\n   \
    \ while L and L.data != key:\n        L = L.next\n    # If key was not present\
    \ in the list , L will have become null.\n    return L\n```\n\n### Insert a new\
    \ node after a specified node:\n\n```python\n# Insert new_node after node.\ndef\
    \ insert_after(node , new_node):\n    new_node.next = node.next\n    node.next\
    \ = new_node\n```\n\n### Delete a node:\n\n```python\n# Delete the node past this\
    \ one. Assume node is not a tail.\ndef delete_after(node):\n    node.next = node.next.next\n\
    ```\n\nInsert and delete are local operations and have `O(1)` time complexity.\
    \ Search requires traversing the entire list, e.g., if the key is at the last\
    \ node or is absent, so its time complexity is `O(n)`, where `n` is the number\
    \ of nodes.\n\nList problems often have a simple brute-force solution that uses\
    \ `O(n)` space, but a subtler solution that uses the `existing list nodes` to\
    \ reduce space complexity to `O(1)`.\n\nVery often, a problem on lists is conceptually\
    \ simple, and is more about `cleanly coding what’s specified`, rather than designing\
    \ an algorithm.\n\nConsider using a `dummy head` (sometimes referred to as a sentinel)\
    \ to avoid having to check for empty lists. This simplifies code, and makes bugs\
    \ less likely.\n\nIt’s easy to forget to `update next` (and previous for double\
    \ linked list) for the head and tail.\n\nAlgorithms operating on singly linked\
    \ lists often benefit from using `two iterators`, one ahead of the other, or one\
    \ advancing quicker than the other.\n\n**Table 4.1:** Top Tips for Linked Lists\n\
    \n## **Know your linked list libraries**\n\nWe now review the standard linked\
    \ list library, with the reminder that many interview problems that are directly\
    \ concerned with lists require you to write your own list class.\n\nUnder the\
    \ hood, the `Python list` type is typically implemented as a dynamically resized\
    \ array, and the key methods on it are described on Page 8. This chapter is concerned\
    \ specifically with linked lists, which are not a standard type in Python. We\
    \ define our own singly and doubly linked list types. Some of the key methods\
    \ on these lists include returning the head/tail, adding an element at the head/tail,\
    \ returning the value stored at the head/tail, and deleting the head, tail, or\
    \ arbitrary node in the list.\n\n### [4.1 T]est for cyclicity\n\nAlthough a linked\
    \ list is supposed to be a sequence of nodes ending in null, it is possible to\
    \ create a cycle in a linked list by making the next field of an element reference\
    \ to one of the earlier nodes.\n\nWrite a program that takes the `head` of a singly\
    \ linked list and returns null if there does not exist a cycle, and the node at\
    \ the start of the cycle, if a cycle is present. (You do not know the length of\
    \ the list in advance.)\n\n**Hint:** Consider using two iterators, one fast and\
    \ one slow.\n\n**Solution:** This problem has several solutions. If space is not\
    \ an issue, the simplest approach is to explore nodes via the `next` field starting\
    \ from the `head` and storing visited nodes in a hash table—a cycle exists if\
    \ and only if we visit a node already in the hash table. If no cycle exists, the\
    \ search ends at the tail (often represented by having the `next` field set to\
    \ null). This solution requires `O(n)` space, where `n` is the number of nodes\
    \ in the list.\n\nA brute-force approach that does not use additional storage\
    \ and does not modify the list is to traverse the list in two loops—the outer\
    \ loop traverses the nodes one-by-one, and the inner loop starts from the `head`,\
    \ and traverses as many nodes as the outer loop has gone through so far. If the\
    \ node being visited by the outer loop is visited twice, a loop has been detected.\
    \ (If the outer loop encounters the end of the list, no cycle exists.) This approach\
    \ has `O(n²)` time complexity.\n\nThis idea can be made to work in linear time—use\
    \ a slow iterator and a fast iterator to traverse the list. In each iteration,\
    \ advance the slow iterator by one and the fast iterator by two. The list has\
    \ a cycle if and only if the two iterators meet. The reasoning is as follows:\
    \ if the fast iterator jumps over the slow iterator, the slow iterator will equal\
    \ the fast iterator in the next step.\n\nNow, assuming that we have detected a\
    \ cycle using the above method, we can find the start of the cycle, by first calculating\
    \ the cycle length `C`. Once we know there is a cycle, and we have a node on it,\
    \ it is trivial to compute the cycle length. To find the first node on the cycle,\
    \ we use two iterators, one of which is `C` ahead of the other. We advance them\
    \ in tandem, and when they meet, that node must be the first node on the cycle.\n\
    \nThe code to do this traversal is quite simple:\n\n```python\ndef has_cycle(head):\n\
    \    def cycle_len(end):\n        start , step = end , 0\n        while True:\n\
    \            step += 1\n            start = start.next\n            if start is\
    \ end:\n                return step\n\n    fast = slow = head\n    while fast\
    \ and fast.next and fast.next.next:\n        slow = slow.next\n        fast =\
    \ fast.next.next\n        if slow is fast:\n            C = cycle_len(slow)\n\
    \            slow = head\n            fast = head\n            for _ in range(C):\n\
    \                fast = fast.next\n            while slow is not fast:\n     \
    \           slow = slow.next\n                fast = fast.next\n            return\
    \ slow\n    return None\n```\n"
