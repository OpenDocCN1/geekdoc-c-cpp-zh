    \ `next` 字段设置为 `null` 表示）。该解决方案需要 `O(n)` 空间，其中 `n` 是列表中的节点数。\n\n不使用额外存储且不修改列表的暴力方法是使用两个循环遍历列表——外循环逐个遍历节点，内循环从\
