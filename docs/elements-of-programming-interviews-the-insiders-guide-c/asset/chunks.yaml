    # **11 Binary Search Trees**


    The number of trees which can be formed with n+1 given knotsα, β, γ, . . . = (n
    + 1)^(n−1).


    — “A Theorem on Trees,” A. C^(ayley), 1889


    BSTs are a workhorse of data structures and can be used to solve almost every
    data structures problem reasonably efficiently. They offer the ability to efficiently
    search for a key as well as find the min and max elements, look for the successor
    or predecessor of a search key (which itself need not be present in the BST),
    and enumerate the keys in a range in sorted order.


    BSTs are similar to arrays in that the stored values (the “keys”) are stored in
    a sorted order. However, unlike with a sorted array, keys can be added to and
    deleted from a BST efficiently. Specifically, a BST is a binary tree as defined
    in Chapter 6 in which the nodes store keys that are comparable, e.g., integers
    or strings. The keys stored at nodes have to respect the BST property—the key
    stored at a node is greater than or equal to the keys stored at the nodes of its
    left subtree and less than or equal to the keys stored in the nodes of its right
    subtree. Figure 11.1 on the next page shows a BST whose keys are the first 16
    prime numbers.


    Key lookup, insertion, and deletion take time proportional to the height of the
    tree, which can in worst-case be^O(n), if insertions and deletions are naively
    implemented. However, there are implementations of insert and delete which guarantee
    that the tree has height^O(logn). These require storing and updating additional
    data at the tree nodes. Red-black trees are an example of height-balanced BSTs
    and are widely used in data structure libraries.


    A common mistake with BSTs is that an object that’s present in a BST is to updated.
    The consequence is that a lookup for that object returns false, even though it’s
    still in the BST. As a rule, avoid putting mutable objects in a BST. Otherwise,
    when a mutable object that’s in a BST is to be updated, always first remove it
    from the tree, then update it, then add it back.


    The BST prototype is as follows:


    class BSTNode:


    def __init__(self , data=None , left=None , right=None): self.data , self.left
    , self.right = data , left , right


    **Binary search trees boot camp**


    Searching is the single most fundamental application of BSTs. Unlike a hash table,
    a BST o ffers the ability to find the min and max elements, and find the next
    largest/next smallest element. These operations, along with lookup, delete and
    find, take time^O(logn) for library implementations of BSTs. Both BSTs and hash
    tables use^O(n) space—in practice, a BST uses slightly more space.


    ^A 19


    ^B 7 43^(I


    C) 3 11^(F J) 23 47^(O


    D) 2 5^E 17^G 37^K 53^(P


    H) 13^L 29 41^N


    31^M


    **Figure 11.1:** An example of a BST.


    The following program demonstrates how to check if a given value is present in
    a BST. It is a nice illustration of the power of recursion when operating on BSTs.


    def search_bst(tree , key):


    return (tree if not tree or tree.data == key else search_bst(tree.left , key)
    if key < tree.data else search_bst(tree.right , key))


    Since the program descends tree with in each step, and spends^O(1) time per level,
    the time complexity is^O(h), where h is the height of the tree.


    With a BST you can **iterate** through elements in **sorted order** in time^O(n)
    (regardless of whether it is balanced).'
