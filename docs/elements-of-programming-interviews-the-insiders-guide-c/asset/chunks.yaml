  trans: "\n脚本语言，如 `AWK`、Perl 和 Python，最初是作为用于快速修补、快速原型开发以及胶接其他程序的工具开发的。它们已经演变为主流编程语言。它们的一些特征如下：\n\
    \n- 文本字符串是基础（有时也是唯一的）数据类型。\n- 关联数组是基础聚合类型。\n- 正则表达式（Regexps）通常是内置的。\n- 程序是解释执行而非编译执行的。\n\
    - 通常不需要声明。\n\n这些语言很容易上手，并且通常可以用非常少的代码完成大量工作。\n\n## 构建系统\n程序通常在修改后不能立即执行：需要中间步骤来构建程序并在部署之前进行测试。其他组件也可能受到影响，例如从程序文本生成的文档。构建系统自动化了这些步骤。\n\
    \n## 数据库\n今天大多数软件系统都与数据库交互，对于开发者来说，拥有数据库的基础知识很重要。\n\n## 网络\n今天大多数软件系统都与网络交互，对于处于堆栈位置更高的开发者来说，拥有网络的基础知识同样重要。以下是你在面试环境中可能会遇到的网络问题。\n\
    \n# 第三部分：荣誉班\n\n## 章节：21 荣誉班\n数学问题的供应是无穷无尽的，只要一个问题被解决，就有许多其他问题随之浮现。\n\n— “数学问题，”\
    \ D. H^(ilbert), 1900\n\n本章包含了比之前介绍的更难解决的问题。其中许多在面试中经常被问到，尽管预期的候选人可能不会提供完美的解决方案。\n\
    \n我们包含这些问题有几个原因：\n\n- 尽管掌握这些问题对你的成功并非必不可，但如果你真的解决了它们，你将让自己置于一个非常有利的地位，类似于戴着脚环进行比赛训练。\n\
    - 如果你被问到其中一个问题或其变体，并且成功推导出最佳解决方案，你将给面试官留下深刻的印象。其影响远超获得录取机会——你的工资、职位和地位都将提升。\n\
    - 一些问题适用于面试特殊职位的候选人，例如优化大规模分布式系统、计算金融的机器学习等。这些问题也经常问及拥有高级学位的候选人。\n- 最后，如果你热爱挑战，这些问题将为你提供挑战！\n\
    \n如果你的面试官问你一个难题，你应该感到高兴——这意味着对你有高期望，而且是一个展示自己的机会，相比之下，被要求写一个测试字符串是否为回文的程序要容易得多。\n\
    \n### 不计算性\n面试中提出的编码问题几乎总有一个（或多个）快速的解决方案，例如 `O(n)` 时间复杂度。有时，你可能会被问到一个在计算上不可行的问题——对于可能不存在高效的算法。（这类问题在现实世界中很常见。）解决不可计算问题有很多方法：\n\
    \n- 暴力解法，包括动态规划，具有指数级时间复杂度，如果遇到的实例较小，或者复杂度呈指数关系的特定参数较小，则是可以接受的；\n- 搜索算法，如回溯、分支限界和爬山算法，它们修剪了暴力搜索的大部分复杂度；\n\
    - 近似算法，返回一个证明接近最优解的解决方案；\n- 基于洞察、常见情况分析和仔细调优的启发式方法，可以较好地解决问题；\n- 并行算法，大量计算机可以同时处理子部分。\n\
    \n### 21.1 计算最大公约数\n非负整数 `x` 和 `y` 的最大公约数 (GCD) 是最大的整数 `d`，使得 `d` 能整除 `x` 且 `d`\
    \ 能整除 `y`，即 `x mod d = 0` 且 `y mod d = 0`。（当 `x` 和 `y` 均为 0 时，取 GCD 为 0。）\n\n\
    设计一个高效算法，在不使用乘法、除法或模运算符的情况下计算两个非负整数的 GCD。\n\n提示：使用用例分析：都是偶数；都是奇数；一奇一偶。\n\n**解：**\
    \ 直观的算法基于递归。如果 `x = y`，`GCD(x, y) = x`；否则，在不失一般性的情况下假设 `x > y`。那么 `GCD(x, y)`\
    \ 是 (`x− y, y`) 的 GCD。\n\n基于上述递归算法没有使用乘法、除法或模，但对于某些输入它运行非常慢。例如，如果输入是 `x = 2^n`,\
    \ `y = 2`，算法将进行 `2^(n−1)` 次递归调用。通过观察到重复减法等于除法，可以改进时间复杂度，即当 `x > y` 时，`GCD(x, y)\
    \ = GCD(y, x mod y)`，但这种方法使用了题目声明中明确禁止的整数除法。\n\n这是一个快速解决方案，它也基于递归，但没有使用通用的乘法或除法。相反，它使用了分类分析，特别是数字中有一个、两个或没有偶数的情况。\n\
    \n可以用例子来说明。假设我们要计算 24 和 300 的 GCD。与其反复从 300 中减去 24，我们可以观察到由于两者都是偶数，结果是 `2^× GCD(12,150)`。除以\
    \ 2 是右移一位，因此我们不需要通用的除法操作。由于 12 和 150 均都是偶数，`GCD(12,150) = 2× GCD(6,75)`。由于 75\
    \ 是奇数，`GCD(6,75)` 是 6 和 75 的 GCD。\n\n```python\ndef gcd(x, y):\n    if x == y:\n\
    \        return x\n    if x == 0:\n        return y\n    if y == 0:\n        return\
    \ x\n    if x % 2 == 0 and y % 2 == 0:\n        return 2 * gcd(x >> 1, y >> 1)\n\
    \    if x % 2 == 0:\n        return gcd(x >> 1, y)\n    if y % 2 == 0:\n     \
    \   return gcd(x, y >> 1)\n    return gcd(x, y - x)\n```\n\n注意，最后一步会导致一个包含一个偶数和一个奇数的递归调用。因此，每两次调用，我们至少减少两个数字的总位位数一位，这意味着时间复杂度与\
    \ x 和 y 的位数之和成比，即 `O(logx+log y)`。\n\n### 21.2 计算除一个以外所有元素的最大乘积\n假设给你整数数组 A，并要求通过乘以\
    \ A 中除一个以外的所有元素来得到最大的乘积。（不能重复使用同一个元素。）例如，如果 A = 3,2,5,4 ，结果是 3^× 5^× 4 = 60；如果\
    \ A = 3,2,^−1,4 ，结果是 3^× 2^× 4 = 24；如果 A = 3,2,^−1,4,^−1,6 ，结果是 3^(× −)1^× 4^(×\
    \ −)1^× 6 = 72。\n"
- fmt: "\nOne approach is to form the product `P` of all the elements, and then find\
    \ the maximum of `P/A[i]` over all `i`. This takes `n−1` multiplications (to form\
    \ `P`) and `n` divisions (to compute each `P/A[i]`). Suppose because of finite\
    \ precision considerations we cannot use a division-based approach; we can only\
    \ use multiplications. The brute-force solution entails computing all `n` products\
    \ of `n−1` elements; each such product takes `n−2` multiplications, i.e., `^O(n²)`\
    \ time complexity.\n\nGiven an array `A` of length `n` whose entries are integers,\
    \ compute the largest product that can be made using `n−1` entries in `A`. You\
    \ cannot use an entry more than once. Array entries may be positive, negative,\
    \ or `0`. Your algorithm cannot use the division operator, explicitly or implicitly.\n\
    \n**Hint:** Consider the products of the first `i−1` and the last `n−i` elements.\
    \ Alternatively, count the number of negative entries and zero entries.\n\n**Solution:**\
    \ The brute-force approach to compute `P/A[i]` is to multiplying the entries appearing\
    \ before `i` with those that appear after `i`. This leads to `n(n−2)` multiplications,\
    \ since for each term `P/A[i]` we need `n−2` multiplications.\n\nNote that there\
    \ is substantial overlap in computation when computing `P/A[i]` and `P/A[i+1]`.\
    \ In particular, the product of the entries appearing before `i+1` is `A[i]` times\
    \ the product of the entries appearing before `i`. We can compute all products\
    \ of entries before `i` with `n−1` multiplications, and all products of entries\
    \ after `i` with `n−1` multiplications, and store these values in an array of\
    \ prefix products, and an array of suffix products. The desired result then is\
    \ the maximum prefix-suffix product. A slightly more space efficient approach\
    \ is to build the suffix product array and then iterate forward through the array,\
    \ using a single variable to compute the prefix products. This prefix product\
    \ is multiplied with the corresponding suffix product and the maximum prefix-suffix\
    \ product is updated if required.\n\n```python\ndef find_biggest_n_minus_one_product(A):\n\
    \    # Builds suffix products.\n    suffix_products = list(\n        reversed(list(itertools.accumulate(reversed(A),\
    \ operator.mul))))\n    )\n    # Finds the biggest product of (n - 1) numbers.\n\
    \    prefix_product, max_product = 1, float('-inf')\n    for i in range(len(A)):\n\
    \        suffix_product = suffix_products[i + 1] if i + 1 < len(A) else 1\n  \
    \      max_product = max(max_product , prefix_product * suffix_product)\n    \
    \    prefix_product *= A[i]\n    return max_product\n```\n\nThe time complexity\
    \ is `^O(n)`; the space complexity is `^O(n)`, since the solution uses a single\
    \ array of length `n`.\n\nWe now solve this problem in `^O(n)` time and `^O(1)`\
    \ additional storage. The insight comes from the fact that if there are no negative\
    \ entries, the maximum product comes from using all but the smallest element.\
    \ (Note that this result is correct if the number of `0` entries is zero, one,\
    \ or more.)\n\nIf the number of negative entries is odd, regardless of how many\
    \ `0` entries and positive entries, the maximum product uses all entries except\
    \ for the negative entry with the smallest absolute value, i.e., the least negative\
    \ entry.\n\nGoing further, if the number of negative entries is even, the maximum\
    \ product again uses all but the smallest nonnegative element, assuming the number\
    \ of nonnegative entries is greater than zero. (This is correct, even in the presence\
    \ of `0` entries.)\n\nIf the number of negative entries is even, and there are\
    \ no nonnegative entries, the result must be negative. Since we want the largest\
    \ product, we leave out the entry whose magnitude is largest, i.e., the greatest\
    \ negative entry.\n\nThis analysis yields a two-stage algorithm. First, determine\
    \ the applicable scenario, e.g., are there an even number of negative entries?\
    \ Consequently, perform the actual multiplication to get the result.\n\n```python\n\
    def find_biggest_n_minus_one_product(A):\n    number_of_negatives = 0\n    least_nonnegative_idx\
    \ = least_negative_idx = greatest_negative_idx = None\n    # Identify entries.\
    \ for i, a in the least negative , greatest negative , and least nonnegative\n\
    \    for i, a in enumerate(A):\n        if a < 0:\n            number_of_negatives\
    \ += 1\n            if least_negative_idx is None or A[least_negative_idx] < a:\n\
    \                least_negative_idx = i\n            if greatest_negative_idx\
    \ is None or a < A[greatest_negative_idx]:\n                greatest_negative_idx\
    \ = i\n        else: # a >= 0.\n            if least_nonnegative_idx is None or\
    \ a < A[least_nonnegative_idx]:\n                least_nonnegative_idx = i\n \
    \   idx_to_skip = (least_negative_idx if number_of_negatives % 2 else least_nonnegative_idx\
    \ if\n                   least_nonnegative_idx is not None else greatest_negative_idx)\n\
    \    return functools.reduce(lambda product , a: product * a,\n        # Use a\
    \ generator rather than list comprehension to avoid extra space.\n        (a for\
    \ i, a in enumerate(A) if i != idx_to_skip), 1)\n```\n\nThe algorithm performs\
    \ a traversal of the array, with a constant amount of computation per entry, a\
    \ nested conditional, followed by another traversal of the array, with a constant\
    \ amount of computation per entry. Hence, the time complexity is `O(n) +O(1) +O(n)\
    \ =O(n)`. The additional space complexity is `^O(1)`, corresponding to the local\
    \ variables.\n"
