    Python 中的数组由`list`类型提供。（`tuple`类型与`list`类型非常相似，其限制是它是不可变的。）`list`的关键属性是它是动态调整大小的，也就是说，向其中添加多少个值是没有限制的。同样地，可以在任意位置删除和插入值。


    *   了解实例化列表的语法，例如`[3, 5, 7, 11]`、`[1] + [0] * 10`、`list(range(100))`。（后文描述的列表推导式（List
    comprehension）也是实例化数组的强大工具。）

    *   基本操作有`len(A)`、`A.append(42)`、`A.remove(2)` 和 `A.insert(3, 28)`。

    *   了解如何实例化二维数组，例如`[[1, 2, 4], [3, 5, 7, 9], [13]]`。

    *   检查一个值是否存在于数组中只需`a in A`即可。（此操作的时间复杂度为`^O(n)`，其中`n`是数组的长度。）

    *   理解拷贝的工作原理，即`B = A` 和 `B = list(A)` 之间的区别。理解什么是深拷贝（deep copy），以及它与浅拷贝的区别，即`copy.copy(A)`与`copy.deepcopy(A)`的区别。

    *   列表的关键方法包括`min(A)`、`max(A)`、针对有序列表的二分查找（`bisect.bisect(A, 6)`、`bisect.bisect_left(A,
    6)` 和 `bisect.bisect_right(A, 6)`）、`A.reverse()`（原地操作）、`reversed(A)`（返回迭代器）、`A.sort()`（原地）、`sorted(A)`（返回副本）、`del
    A[i]`（删除第`i`个元素）以及 `del A[i:j]`（移除切片）。

    *   切片是操作数组的一种非常简洁的方式。它可以被视为索引的泛化：切片的最通用形式是`A[i:j:k]`，其中`i`、`j`和`k`都是可选。设`A =
