    # **12 Recursion**


    The power of recursion evidently lies in the possibility of defining an infinite
    set of objects by a finite statement. In the same manner, an infinite number of
    computations can be described by a finite recursive program, even if this program
    contains no explicit repetitions.


    — “Algorithms + Data Structures = Programs,” N. E. W^(irth), 1976


    Recursion is an approach to problem solving where the solution depends partially
    on solutions to smaller instances of related problems. It is often appropriate
    when the input is expressed using recursive rules, such as a computer grammar.
    More generally, searching, enumeration, divideand-conquer, and decomposing a complex
    problem into a set of similar smaller instances are all scenarios where recursion
    may be suitable.


    A recursive function consists of base cases and calls to the same function with
    di fferent arguments. Two key ingredients to a successful use of recursion are
    identifying the base cases, which are to be solved directly, and ensuring progress,
    that is the recursion converges to the solution.


    Both backtracking and branch-and-bound are naturally formulated using recursion.
    **Recursion boot camp**


    The Euclidean algorithm for calculating the greatest common divisor (GCD) of two
    numbers is a classic example of recursion. The central idea is that if y> x, the
    GCD of x and y is the GCD of x and y− x. For example, GCD(156,36) = GCD((156−
    36) = 120,36). By extension, this implies that the GCD of x and y is the GCD of
    x and y mod x, i.e., GCD(156,36) = GCD((156 mod 36) = 12,36) = GCD(12,36 mod 12
    = 0) = 12.


    def gcd(x, y):


    return x if y == 0 else gcd(y, x % y)


    Since with each recursive step one of the arguments is at least halved, it means
    that the time complexity is^O(log max(x, y)). Put another way, the time complexity
    is^O(n), where n is the number of bits needed to represent the inputs. The space
    complexity is also^O(n), which is the maximum depth of the function call stack.
    (The program is easily converted to one which loops, thereby reducing the space
    complexity to^O(1).)


    Now we describe a problem that can be elegantly solved using a recursive divide-and-conquer
    algorithm. A triomino is formed by joining three unit-sized squares in an L-shape.
    A mutilated chessboard (henceforth 8^× 8 Mboard) is made up of 64 unit-sized squares
    arranged in an 8^× 8 square, minus the top-left square, as depicted in Figure
    12.1(a) on the next page. Suppose you are asked to design an algorithm that computes
    a placement of 21 triominoes that covers the 8^× 8 Mboard. Since the 8^×8 Mboard
    contains 63 squares, and we have 21 triominoes, a valid placement cannot have
    overlapping triominoes or triominoes which extend out of the 8^× 8 Mboard.


