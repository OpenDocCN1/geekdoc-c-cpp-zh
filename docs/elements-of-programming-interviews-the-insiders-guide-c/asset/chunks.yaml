  trans: "\n现在我们来说明设计适用于字符串的哈函数的步骤。首先，哈希函数应该检查字符串中的所有字符。它应该给出一个较大的范围，并且不应该让某个字符占据主导地位（例如，如果我们简单地将字符转换为整数并相乘，那么一个\
    \ 0 就会导致哈希码为 0）。我们还希望使用滚动哈希函数（rolling hash function），即如果从字符串开头删除一个字符并在末尾添加另一个字符，可以在\
    \ `O(1)` 时间内计算出新的哈希值。以下函数具有这些属性：\n\n```python\ndef string_hash(s, modulus):\n\
    \    MULT = 997\n    return functools.reduce(lambda v, c: (v * MULT + ord(c))\
    \ % modulus , s, 0)\n```\n\n哈希表是表示字典（即字符串集合）的一种数据结构。在某些应用中，`trie`（字典树）这种用于存储动态字符串集合的树形数据结构具有计算优势。与\
    \ `BST`（二叉搜索树）不同，树中的节点并不存储键。相反，节点在树中的位置定义了它所关联的键。\n\n## 哈希表训练营\n\n我们将通过两个示例来介绍哈希表——一个是受益于哈希表算法优势的应用程序，另一个说明了可用于哈希表的类的设计。\n\
    \n### 哈希表的应用\n\n字母字母异位词（Anagrams）是一种流行的文字游戏游戏，通过重新排列一组单词的字母，可以得到另一组单词。例如，“eleven\
    \ plus two”是“twelve plus one”的字母异位词。交叉字游戏爱好者和拼字游戏（Scrabble）玩家受益于查看给定字母集合所有可能的字母异位词的能力。\n\
    \n假设你被要求编写一个程序，输入一组单词并返回这些单词的字母异位词分组。每组必须至少包含两个单词。\n\n例如，如果输入是“debitcard”、“elvis”、“silent”、“badcredit”、“lives”、“freedom”、“listen”、“levis”、“money”，那么有三组字母异位词：(1.)\
    \ “debitcard”、“badcredit”；(2.) “elvis”、“lives”、“levis”；(3.) “silent”、“listen”。（注意，“money”没有出现在任何组中，因为它在集合中没有字母异位词。）\n\
    \n让我们先考虑测试一个单词是否是另一个单词的字母异位词的问题。由于字母异位词不取决于字符串中字符的顺序，我们可以通过对字符串中的字符排序来执行测试。如果两个单词在排序后得到相同的字符串，那么它们就是字母异位词。例如，`sort(“logarithmic”)`\
    \ 和 `sort(“algorithmic”)` 都是“acghiilmort”，所以“logarithmic”和“algorithmic”是字母异位词。\n\
    \n我们可以通过遍历所有字符串，并将每个字符串与其他所有剩余字符串进行比较来形成上述字符串分组。如果两个字符串是字母异位词，我们就不再考虑第二个字符串。这导致了一个\
    \ `O(n²mlogm)` 的算法，其中 `n` 是字符串的数量，`m` 是字符串的最大长度。\n\n更仔细观察上面的计算，注意核心思想是将字符串映射到一个代表值。对于任何字符串，其排序后的版本都可以作为其所属字母异位词组的唯一标识符。我们需要的是从排序后的字符串到其对应的字母异位词的映射。每你需要存储一组字符串时，哈希表都是极佳的选择。我们的最终算法通过将字典中每个字符串\
    \ `s` 的 `sort(s)` 添加到哈希表中来进行。排序后的字符串是键，值是原始输入中对应字符串的数组。\n\n```python\ndef find_anagrams(dictionary):\n\
    \    sorted_string_to_anagrams = collections.defaultdict(list)\n    for s in dictionary:\n\
    \        # 对字符串排序，将其作为键，然后将原始字符串作为另一个值追加到哈希表中。\n        sorted_string_to_anagrams[''.join(sorted(s))].append(s)\n\
    \    return [\n        group for group in sorted_string_to_anagrams.values() if\
    \ len(group) >= 2\n    ]\n```\n\n计算过程包含 `n` 次 `sort` 调用和 `n` 次哈希表插入。排序所有键的时间复杂度为\
    \ `O(nmlogm)`。插入操作增加了 `O(nm)` 的时间复杂度，最终产生总计时间复杂度 `O(nmlogm)`。\n\n### 可哈希类的设计\n\
    \n考虑一个表示联系人的类。为了简单起见，假设每个联系人都是一个字符串。假设有一个硬性要求，个人联系人必须存储在列表中，且列表可能包含重复项。如果两个联系人包含相同的字符串集合，那么它们应该是相等的，无论底层列表中字符串的顺序如何。重复性并不重要，即：同一个联系人的重复三次等同于该联系人的单个实例。为了能够在哈希表中存储联系人，我们首先需要显式定义相等性，我们可以通过从列表创建集合并比较集合来实现。\n\
    \n在我们的语文中，这意味着哈希函数应该依赖于存在的字符串，而不是它们的顺序；如果一个字符串以重复形式出现，它还应该只考虑一份。需要指出的是，下面的哈函数和\
    \ `equals` 方法非常低效。在实践中，建议缓存底层集合和哈希码，并记住在更新时清除这些值。\n\n```python\nclass ContactList:\n\
    \    def __init__(self, names):\n        \"\"\"\n        names 是字符串列表。\n     \
    \   \"\"\"\n        self.names = names\n\n    def __hash__(self):\n        # 概念上是可变的，我们对名称集合进行哈希。\n\
    \        return hash(frozenset(self.names))\n\n    def __eq__(self, other):\n\
    \        return set(self.names) == set(other.names)\n\ndef merge_contact_lists(contacts):\n\
    \    \"\"\"\n    contacts 是 ContactList 列表。\n    \"\"\"\n    return list(set(contacts))\n\
    ```\n\n计算哈希的时间复杂度为 `O(n)`，其中 `n` 是联系人列表中字符串的数量。哈希码通常会被缓存以提高性能，但要在更新对象字段时必须清除缓存。\n\
    \n**表 9.1：哈希表顶级技巧**\n\nPython 中有多种常用的基于哈希表的数据结构——`set`、`dict`、`collections.defaultdict`\
    \ 和 `collections.Counter`。`set` 与其他三者的区别在于 `set` 仅存储键，而其他三个存储键值对。它们都具有不允许重复键的属性，不像\
    \ `list`。\n\n"
- fmt: "\nIn a `dict`, accessing value associated with a key that is not present leads\
    \ to a `KeyError` exception. However, a `collections.defaultdict` returns the\
    \ default value of the type that was specified when the collection was instantiated,\
    \ e.g., if `d = collections.defaultdict(list)`, then if `k` not in `d` then `d[k]`\
    \ is `[]`. A `collections.Counter` is used for counting the number of occurrences\
    \ of keys, with a number of set-like operations, as illustrated below.\n\n```python\n\
    c = collections.Counter(a=3, b=1)\nd = collections.Counter(a=1, b=2)\n# add two\
    \ counters\nc + d\n# subtract (keeping together only positive counts)\nc[x] +\
    \ d[x], collections.Counter({'a': 4, 'b': 3})\ncollections.Counter({'a': 2}) c\
    \ - d \n# intersection: min(c[x], d[x]), collections.Counter({'a': 1, 'b': 1})\n\
    c & d\n# union: max(c[x], d[x]), collections.Counter({'a': 3, 'b': 2})\nc | d\n\
    ```\n\nThe most important operations for set are `s.add(42)`, `s.remove(42)`,\
    \ `s.discard(123)`, `x in s`, as well as `<= t` (is a subset of t), and `s - t`\
    \ (elements in `s` that are not in `t`).\n\nThe basic operations on the three\
    \ key-value collections are similar to those on sets. One difference is with iterators—iteration\
    \ over a key-value collection yields the keys. To iterate over the key-value pairs,\
    \ iterate over `items()`; to iterate over values, use `values()`. The `keys()`\
    \ method returns an iterator to the keys.\n\nNot every type is “hashable”, i.e.,\
    \ can be added to a set or used as a key in a `dict`. In particular, mutable containers\
    \ are not hashable—this is to prevent a client from modifying an object after\
    \ adding it to the container, since the lookup will then fail to find it if the\
    \ slot that the modified object hashes to is different.\n\nNote that the built-in\
    \ `hash()` function can greatly simplify the implementation of a hash function\
    \ for a user-defined class, i.e., implementing `__hash__(self__)`.\n\n# 9.1 Is\
    \ an anonymous letter constructible?\n\nWrite a program which takes text for an\
    \ anonymous letter and text for a magazine and determines if it is possible to\
    \ write the anonymous letter using the magazine. The anonymous letter can be written\
    \ using the magazine if for each character in the anonymous letter, the number\
    \ of times it appears in the anonymous letter is no more than the number of times\
    \ it appears in the magazine.\n\n**Hint:** Count the number of distinct characters\
    \ appearing in the letter.\n\n**Solution:** A brute force approach is to count\
    \ for each character in the character set the number of times it appears in the\
    \ letter and in the magazine. If any character occurs more often in the letter\
    \ than the magazine we return `false`, otherwise we return `true`. This approach\
    \ is potentially slow because it iterates over all characters, including those\
    \ that do not occur in the letter or magazine. It also makes multiple passes over\
    \ both the letter and the magazine—as many passes as there are characters in the\
    \ character set.\n\nA better approach is to make a single pass over the letter,\
    \ storing the character counts for the letter in a single hash table—keys are\
    \ characters, and values are the number of times that character appears. Next,\
    \ we make a pass over the magazine. When processing a character `c`, if `c` appears\
    \ in the hash table, we reduce its count by 1; we remove it from the hash when\
    \ its count goes to zero. If the hash becomes empty, we return `true`. If we reach\
    \ the end of the letter and the hash is nonempty, we return `false`—each of the\
    \ characters remaining in the hash occurs more times in the letter than the magazine.\n\
    \n```python\ndef is_letter_constructible_from_magazine(letter_text, magazine_text):\n\
    \    # Compute the frequencies for all chars in letter_text.\n    char_frequency_for_letter\
    \ = collections.Counter(letter_text)\n    for c in magazine_text:\n        if\
