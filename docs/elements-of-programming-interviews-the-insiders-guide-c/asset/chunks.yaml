    # **8 Searching**


    ![](images/00001.gif)— “The Anatomy of A Large-Scale Hypertextual Web Search Engine,”
    S. M. B^(rin and) L. P^(age), 1998


    Search algorithms can be classified in a number of ways. Is the underlying collection
    static or dynamic, i.e., inserts and deletes are interleaved with searching? Is
    it worth spending the computational cost to preprocess the data so as to speed
    up subsequent queries? Are there statistical properties of the data that can be
    exploited? Should we operate directly on the data or transform it?


    In this chapter, our focus is on static data stored in sorted order in an array.
    Data structures appropriate for dynamic updates are the subject of Chapters 7,
    9, and 11.


    The first collection of problems in this chapter are related to binary search.
    The second collection pertains to general search.


    **Binary search**


    Given an arbitrary collection of n keys, the only way to determine if a search
    key is present is by examining each element. This has^O(n) time complexity. Fundamentally,
    binary search is a natural elimination-based strategy for searching a sorted array.
    The idea is to eliminate half the keys from consideration by keeping the keys
    in sorted order. If the search key is not equal to the middle element of the array,
    one of the two sets of keys to the left and to the right of the middle element
    can be eliminated from further consideration.


    Questions based on binary search are ideal from the interviewers perspective:
    it is a basic technique that every reasonable candidate is supposed to know and
    it can be implemented in a few lines of code. On the other hand, binary search
    is much trickier to implement correctly than it appears—you should implement it
    as well as write corner case tests to ensure you understand it properly.


    Many published implementations are incorrect in subtle and not-so-subtle ways—a
    study reported that it is correctly implemented in only five out of twenty textbooks.
    Jon Bentley, in his book “Programming Pearls” reported that he assigned binary
    search in a course for professional programmers and found that 90% failed to code
    it correctly despite having ample time. (Bentley’s students would have been gratified
    to know that his own published implementation of binary search, in a column titled
    “Writing Correct Programs”, contained a bug that remained undetected for over
    twenty years.)


    Binary search can be written in many ways—recursive, iterative, di fferent idioms
    for conditionals, etc. Here is an iterative implementation adapted from Bentley’s
    book, which includes his bug.


    def bsearch(t, A):


    L, U = 0, len(A) - 1


    while L <= U:


    M = (L + U) // 2


    if A[M] < t:


    L = M + 1


    elif A[M] == t:


    return M


    else:


    U = M - 1


    return -1


    The error is in the assignment M = (L + U) / 2in Line 4, which can potentially
    lead to overflow. This overflow can be avoided by usingM = L + (U - L) / 2.


    The time complexity of binary search is given by T(n) = T(n/2) + c, where c is
    a constant. This solves to T(n) =^O(logn), which is far superior to the^O(n) approach
    needed when the keys are unsorted. A disadvantage of binary search is that it
    requires a sorted array and sorting an array takes^O(nlogn) time. However, if
    there are many searches to perform, the time taken to sort is not an issue.


    Many variants of searching a sorted array require a little more thinking and create
    opportunities for missing corner cases.


    **Searching boot camp**


    When objects are comparable, they can be sorted and searched for using library
    search functions. Typically, the language knows how to compare built-in types,
    e.g., integers, strings, library classes for date, URLs, SQL timestamps, etc.
    However, user-defined types used in sorted collections must explicitly implement
    comparison, and ensure this comparison has basic properties such as transitivity.
    (If the comparison is implemented incorrectly, you may find a lookup into a sorted
    collection fails, even when the item is present.)


    Suppose we are given as input an array of students, sorted by descending GPA,
    with ties broken on name. In the program below, we show how to use the library
    binary search routine to perform fast searches in this array. In particular, we
    pass binary search a custom comparator which compares students on GPA (higher
    GPA comes first), with ties broken on name.


    Student = collections.namedtuple(’Student ’, (’name’, ’grade_point_average ’))


    def comp_gpa(student):


    return (-student.grade_point_average , student.name)


    def search_student(students , target , comp_gpa):


    i = bisect.bisect_left ([ comp_gpa(s) for s in students], comp_gpa(target)) return
    0 <= i < len(students) and students[i] == target


    Assuming the i-th element in the sequence can be accessed in^O(1) time, the time
    complexity of the program is^O(logn).


    **Binary search** is an effective search tool. It is applicable to more than just
    searching in **sorted arrays**, e.g., it can be used to search an **interval of
    real numbers or integers**.'
