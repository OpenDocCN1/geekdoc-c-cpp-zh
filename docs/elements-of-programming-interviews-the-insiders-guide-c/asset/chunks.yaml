    if you insert student objects into a BST and entries are ordered by GPA, and then
    a student’s GPA needs to be updated and all we have is the student’s name and
    new GPA, we cannot find the student by name without a full traversal. However,
    with an additional hash table, we can directly go to the corresponding entry in
    the tree.


    The BST property is a **global property**—a binary tree may have the property
    that each node’s key is greater than the key at its left child and smaller than
    the key at its right child, but it may not be a BST.


    **Table 11.1:** Top Tips for Binary Search Trees


    **Know your binary search tree libraries**


    Some of the problems in this chapter entail writing a BST class; for others, you
    can use a BST library. Python does not come with a built-in BST library.


    Thesortedcontainersmodule the best-in-class module for sorted sets and sorted
    dictionaries— it is performant, has a clean API that is well documented, with
    a responsive community. The


    [√] underlying data structure is a sorted list of sorted lists. Its asymptotic
    time complexity for inserts[√] and deletes is^O( n)) since these operations entail
    insertion into a list of length roughly n, rather than the^O(logn)) of balanced
    BSTs. In practice, this is not an issue, since CPUs are highly optimized for block
    data movements.


    In the interests of pedagogy, we have elected to use the bintrees module which
    implements sorted sets and sorted dictionaries using balanced BSTs. However, any
    reasonable interviewer should acceptsortedcontainers wherever we usebintrees.


    Below, we describe the functionalities added by bintrees.


    • insert(e) inserts new element e in the BST.


    • discard(e) removes e in the BST if present.


    • min_item()/max_item() yield the smallest and largest key-value pair in the BST.


    • min_key()/max_key() yield the smallest and largest key in the BST.


    • pop_min()/pop_max() remove the return the smallest and largest key-value pair
    in the BST.


    It’s particularly important to note that these operations take^O(logn), since
    they are backed by the underlying tree.


    The following program illustrates the use ofbintrees.


    t = bintrees.RBTree ([(5, ’Alfa’), (2, ’Bravo ’), (7, ’Charlie ’), (3, ’Delta
    ’), (6, ’Echo’)])


    print(t[2]) # ’Bravo ’


    print(t.min_item (), t.max_item ()) # (2, ’Bravo ’), (7, ’Charlie ’)


    # {2: ’Bravo ’, 3: ’Delta ’, 5: ’Alfa ’, 6: ’Echo ’, 7: ’Charlie ’, 9: ’Golf ’}
    t.insert(9, ’Golf’)


    print(t)


    print(t.min_key (), t.max_key ()) # 2, 9


    t.discard (3)


    print(t) # {2: ’Bravo ’, 5: ’Alfa ’, 6: ’Echo ’, 7: ’Charlie ’, 9: ’Golf ’}


    # a = (2: ’Bravo ’)


    a = t.pop_min ()


    print(t) # {5: ’Alfa ’, 6: ’Echo ’, 7: ’Charlie ’, 9: ’Golf ’}


    # b = (9, ’Golf ’)


    b = t.pop_max ()


    print(t) # {5: ’Alfa ’, 6: ’Echo ’, 7: ’Charlie ’}


    11.1 Test if a binary tree satisfies the BST property


    Write a program that takes as input a binary tree and checks if the tree satisfies
    the BST property. Hint: Is it correct to check for each node that its key is greater
    than or equal to the key at its left child and less than or equal to the key at
    its right child?


    **Solution:** A direct approach, based on the definition of a BST, is to begin
    with the root, and compute the maximum key stored in the root’s left subtree,
    and the minimum key in the root’s right subtree. We check that the key at the
    root is greater than or equal to the maximum from the left subtree and less than
    or equal to the minimum from the right subtree. If both these checks pass, we
    recursively check the root’s left and right subtrees. If either check fails, we
    return false.


    Computing the minimum key in a binary tree is straightforward: we take the minimum
    of the key stored at its root, the minimum key of the left subtree, and the minimum
    key of the right subtree. The maximum key is computed similarly. Note that the
    minimum can be in either subtree, since a general binary tree may not satisfy
    the BST property.


    The problem with this approach is that it will repeatedly traverse subtrees. In
    the worst-case, when the tree is a BST and each node’s left child is empty, the
    complexity is^O(n²), where n is the number of nodes. The complexity can be improved
    to^O(n) by caching the largest and smallest keys at each node; this requiresO(n)
    additional storage for the cache.


    We now present two approaches which have^O(n) time complexity.


    The first approach is to check constraints on the values for each subtree. The
    initial constraint comes from the root. Every node in its left (right) subtree
    must have a key less than or equal (greater than or equal) to the key at the root.
    This idea generalizes: if all nodes in a tree must have keys in the range [l,u],
    and the key at the root is w (which itself must be between [l,u], otherwise the
    requirement is violated at the root itself), then all keys in the left subtree
    must be in the range [l,w], and all keys stored in the right subtree must be in
    the range [w,u].


    As a concrete example, when applied to the BST in Figure 11.1 on Page 55, the
    initial range is [−∞,∞]. For the recursive call on the subtree rooted at B, the
    constraint is [−∞,19]; the 19 is the upper bound required by A on its left subtree.
    For the recursive call starting at the subtree rooted at F, the constraint is
    [7,19]. For the recursive call starting at the subtree rooted at K, the constraint
    is [23,43]. The binary tree in Figure 6.1 on Page 28 is identified as not being
    a BST when the recursive call reaches C—the constraint is [−∞,6], but the key
    at F is 271, so the tree cannot satisfy the BST property.


    def is_binary_tree_bst(tree , low_range=float(’-inf’), high_range=float(’inf’)):
    if not tree:


    return True


    elif not low_range <= tree.data <= high_range:


    return False


    return (is_binary_tree_bst(tree.left , low_range , tree.data) and


    is_binary_tree_bst(tree.right , tree.data , high_range))


    The time complexity is^O(n), and the additional space complexity is^O(h), where
    h is the height of the tree.


    Alternatively, we can use the fact that an inorder traversal visits keys in sorted
    order. Furthermore, if an inorder traversal of a binary tree visits keys in sorted
    order, then that binary tree must be a BST. (This follows directly from the definition
    of a BST and the definition of an inorder walk.) Thus we can check the BST property
    by performing an inorder traversal, recording the key stored at the last visited
    node. Each time a new node is visited, its key is compared with the key of the
    previously visited node. If at any step in the walk, the key at the previously
    visited node is greater than the node currently being visited, we have a violation
    of the BST property.


    All these approaches explore the left subtree first. Therefore, even if the BST
    property does not hold at a node which is close to the root (e.g., the key stored
    at the right child is less than the key stored at the root), their time complexity
    is stillO(n).


    We can search for violations of the BST property in a BFS manner, thereby reducing
    the time complexity when the property is violated at a node whose depth is small.


    Specifically, we use a queue, where each queue entry contains a node, as well
    as an upper and a lower bound on the keys stored at the subtree rooted at that
    node. The queue is initialized to the root, with lower bound^(−∞) and upper bound^∞.
    We iteratively check the constraint on each node. If it violates the constraint
    we stop—the BST property has been violated. Otherwise, we add its children along
    with the corresponding constraint.'
