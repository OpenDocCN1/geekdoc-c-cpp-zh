    [7.1 M]erge sorted files


    This problem is motivated by the following scenario. You are given 500 files,
    each containing stock trade information for an S&P 500 company. Each trade is
    encoded by a line in the following format: 1232111,AAPL,30,456.12.


    The first number is the time of the trade expressed as the number of milliseconds
    since the start of the day’s trading. Lines within each file are sorted in increasing
    order of time. The remaining values are the stock symbol, number of shares, and
    price. You are to create a single file containing all the trades from the 500
    files, sorted in order of increasing trade times. The individual files are of
    the order of 5–100 megabytes; the combined file will be of the order of five gigabytes.
    In the abstract, we are trying to solve the following problem.


    Write a program that takes as input a set of sorted sequences and computes the
    union of these sequences as a sorted sequence. For example, if the input is 3,5,7
    , 0,6 , and 0,6,28 , then the output is 0,0,3,5,6,6,7,28 .


    Hint: Which part of each sequence is significant as the algorithm executes?


    **Solution:** A brute-force approach is to concatenate these sequences into a
    single array and then sort it. The time complexity is^O(nlogn), assuming there
    are n elements in total.


    The brute-force approach does not use the fact that the individual sequences are
    sorted. We can take advantage of this fact by restricting our attention to the
    first remaining element in each sequence. Specifically, we repeatedly pick the
    smallest element amongst the first element of each of the remaining part of each
    of the sequences.


    A min-heap is ideal for maintaining a collection of elements when we need to add
    arbitrary values and extract the smallest element.


    For ease of exposition, we show how to merge sorted arrays, rather than files.
    As a concrete example, suppose there are three sorted arrays to be merged: 3,5,7
    , 0,6 , and 0,6,28 . For simplicity, we show the min-heap as containing entries
    from these three arrays. In practice, we need additional information for each
