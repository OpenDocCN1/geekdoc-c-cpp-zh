    Don’t be fooled by the many books on complexity or by the many complex and arcane
    algorithms you find in this book or elsewhere. Although there are no textbooks
    on simplicity, simple systems work and complex don’t.


    — “Transaction Processing: Concepts and Techniques,” J. G^(ray), 1992


    You may be asked in an interview how to go about creating a set of services or
    a larger system, possibly on top of an algorithm that you have designed. These
    problems are fairly open-ended, and many can be the starting point for a large
    software project.


    In an interview setting when someone asks such a question, you should have a conversation
    in which you demonstrate an ability to think creatively, understand design trade-offs,
    and attack unfamiliar problems. You should sketch key data structures and algorithms,
    as well as the technology stack (programming language, libraries, OS, hardware,
    and services) that you would use to solve the problem.


    The answers in this chapter are presented in this context—they are meant to be
    examples of good responses in an interview and are not comprehensive state-of-the-art
    solutions.


    We review patterns that are useful for designing systems in Table 17.1. Some other
    things to keep in mind when designing a system are implementation time, extensibility,
    scalability, testability, security, internationalization, and IP issues.


    **Table 17.1:** System design patterns. **Design principle**


    Algorithms and Data Structures


    Decomposition


    Scalability


    **Key points**


    Identify the basic algorithms and data structures


    Split the functionality, architecture, and code into manageable, reusable components.


    Break the problem into subproblems that can be solved relatively independently
    on different machines. Shard data across machines to make it fit. Decouple the
    servers that handle writes from those that handle reads. Use replication across
    the read servers to gain more performance. Consider caching computation and later
    look it up to save work.


    **Decomposition** Good decompositions are critical to successfully solving system-level
    design problems. Functionality, architecture, and code all benefit from decomposition.


    For example, in our solution to designing a system for online advertising, we
    decompose the goals into categories based on the stake holders. We decompose the
    architecture itself into a frontend and a back-end. The front-end is divided into
    user management, web page design, reporting functionality, etc. The back-end is
    made up of middleware, storage, database, cron services, and algorithms for ranking
    ads.


    Decomposing code is a hallmark of object-oriented programming. The subject of
    design patterns is concerned with finding good ways to achieve code-reuse. Broadly
    speaking, design patterns are grouped into creational, structural, and behavioral
    patterns. Many specific patterns are very natural—strategy objects, adapters,
    builders, etc., appear in a number of places in our codebase. Freeman et al.’s
    “Head First Design Patterns” is, in our opinion, the right place to study design
    patterns.


    **Scalability**


    In the context of interview questions parallelism is useful when dealing with
    scale, i.e., when the problem is too large to fit on a single machine or would
    take an unacceptably long time on a single machine. The key insight you need to
    display is that you know how to decompose the problem so that


    • each subproblem can be solved relatively independently, and


    • the solution to the original problem can be efficiently constructed from solutions
    to the subproblems.


    Efficiency is typically measured in terms of central processing unit (CPU) time,
    random access memory (RAM), network bandwidth, number of memory and database accesses,
    etc.


    Consider the problem of sorting a petascale integer array. If we know the distribution
    of the numbers, the best approach would be to define equal-sized ranges of integers
    and send one range to one machine for sorting. The sorted numbers would just need
    to be concatenated in the correct order. If the distribution is not known then
    we can send equal-sized arbitrary subsets to each machine and then merge the sorted
    results, e.g., using a min-heap.


    Caching is a great tool whenever computations are repeated. For example, the central
    idea behind dynamic programming is caching results from intermediate computations.
    Caching is also extremely useful when implementing a service that is expected
    to respond to many requests over time, and many requests are repeated. Workloads
    on web services exhibit this property.


    [17.1 D]esign a system for detecting copyright infringement


    YouTV.com is a successful online video sharing site. Hollywood studios complain
    that much of the material uploaded to the site violates copyright.


    Design a feature that allows a studio to enter a set V of videos that belong to
    it, and to determine which videos in the YouTV.com database match videos in V.


    Hint: Normalize the video format and create signatures.


    **Solution:** Videos differ from documents in that the same content may be encoded
    in many different formats, with different resolutions, and levels of compression.


    One way to reduce the duplicate video problem to the duplicate document problem
    is to reencode all videos to a common format, resolution, and compression level.
    This in itself does not mean that two videos of the same content get reduced to
    identical files—the initial settings affect the resulting videos. However, we
    can now “signature” the normalized video.'
