    def generate_power_set(input_set):\n    if not input_set:\n        return [[]]\n\
    \    x = input_set[0]\n    rest_power_set = generate_power_set(input_set[1:])\n\
    \    with_x = [[x] + subset for subset in rest_power_set]\n    return rest_power_set\
    \ + with_x\n```\n"
