    (a) An 8× 8 Mboard. (b) Four 4× 4 Mboards.


    **Figure 12.1:** Mutilated chessboards.


    Divide-and-conquer is a good strategy for this problem. Instead of the 8^× 8 Mboard,
    let’s consider an n^× n Mboard. A 2^× 2 Mboard can be covered with one triomino
    since it is of the same exact shape. You may hypothesize that a triomino placement
    for an n× n Mboard with the top-left square missing can be used to compute a placement
    for an (n+ 1)^× (n+ 1) Mboard. However, you will quickly see that this line of
    reasoning does not lead you anywhere.


    Another hypothesis is that if a placement exists for an n^× n Mboard, then one
    also exists for a 2n^× 2n Mboard. Now we can apply divide-and-conquer. Take four
    n^× n Mboards and arrange them to form a 2n^×2n square in such a way that three
