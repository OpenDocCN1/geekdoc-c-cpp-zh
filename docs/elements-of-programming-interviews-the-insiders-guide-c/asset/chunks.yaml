    64-bit integer—we would need 2^(64) bits of storage, which is of the order of
    ten trillion exabytes. However, when computing the parity of a collection of bits,
    it does not matter how we group those bits, i.e., the computation is associative.
    Therefore, we can compute the parity of a 64-bit integer by grouping its bits
    into four nonoverlapping 16 bit subwords, computing the parity of each subwords,
    and then computing the parity of these four subresults. We choose 16 since 2^(16)
    = 65536 is relatively small, which makes it feasible to cache the parity of all
    16-bit words using an array. Furthermore, since 16 evenly divides 64, the code
    is simpler than if we were, for example, to use 10 bit subwords.


    We illustrate the approach with a lookup table for 2-bit words. The cache is 0,1,1,0
    —these are the parities of (00),(01),(10),(11), respectively. To compute the parity
    of (11001010) we would compute the parities of (11), (00), (10), (10). By table
    lookup we see these are 0,0,1,1, respectively, so the final result is the parity
    of 0,0,1,1 which is 0.


    To lookup the parity of the first two bits in (11101010), we right shift by 6,
    to get (00000011), and use this as an index into the cache. To lookup the parity
    of the next two bits, i.e., (10), we right shift by 4, to get (10) in the two
    least-significant bit places. The right shift does not remove the leading (11)—it
    results in (00001110). We cannot index the cache with this, it leads to an out-of-bounds
    access. To get the last two bits after the right shift by 4, we bitwise-AND (00001110)
    with (00000011) (this is the “mask” used to extract the last 2 bits). The result
    is (00000010). Similar masking is needed for the two other 2-bit lookups.


    def parity(x):


    MASK_SIZE = 16


    BIT_MASK = 0xFFFF


    return (PRECOMPUTED_PARITY[x >> (3 * MASK_SIZE)] ^


    PRECOMPUTED_PARITY [(x >> (2 * MASK_SIZE)) & BIT_MASK] ^


    PRECOMPUTED_PARITY [(x >> MASK_SIZE) & BIT_MASK] ^


    PRECOMPUTED_PARITY[x & BIT_MASK ])


    The time complexity is a function of the size of the keys used to index the lookup
    table. Let L be the width of the words for which we cache the results, and n the
    word size. Since there are n/L terms, the time complexity is^O(n/L), assuming
    word-level operations, such as shifting, take^O(1) time. (This does not include
    the time for initialization of the lookup table.)


    We can improve on the^O(n) worst-case time complexity of the previous algorithms
    by exploiting some simple properties of parity. Specifically, the XOR of two bits
    is defined to be 0 if both bits are 0 or both bits are 1; otherwise it is 1\.
    XOR has the property of being associative, i.e., it does not matter how we group
    bits, as well as commutative, i.e., the order in which we perform the XORs does
    not change the result. The XOR of a group of bits is its parity. We can exploit
    this fact to use the CPU’s word-level XOR instruction to process multiple bits
    at a time.


