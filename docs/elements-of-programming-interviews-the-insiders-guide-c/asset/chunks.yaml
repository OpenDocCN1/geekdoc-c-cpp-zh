    ### 术语索引 102\n\n## 第一部分：数据结构与算法\n### 第 1 章 # 1 原始类型\n\n表示是编程的本质。\n\n— 《人月神话》，F.\
    \ P. Brooks, 1975\n\n程序根据指令更新内存中的变量。变量有不同的类型——类型是对数据的一种分类，它规定了该类型可能取的值以及可以在该类型上执行的操作。类型可以由语言提供，也可以由程序员定义。在\
    \ Python 中，一切都是对象——这包括布尔值、整数、字符等。\n\n### 原始类型训练营\n\n编写一个程序来计算整数中设置为 1 的位个数，是快速上手原始类型的良好方法。以下程序从最低位开始逐位测试位；它说明了位移和掩码的操作；同时也展示了如何避免硬编码整数长度。\n\
    \n```python\ndef count_bits(x):\n    num_bits = 0\n    while x:\n        num_bits\
    \ += x & 1\n        x >>= 1\n    return num_bits\n```\n\n由于我们对每个位执行 $O(1)$ 计算，因此时间复杂度为\
    \ $O(n)$，其中 $n$ 是表示该整数所需的位数，例如，表示 12 需要 4 位，其二进制表示为 $(1100)_2$。对页 Solution 1.1\
    \ 中涉及计算位数模 2 结果的结果（即奇偶性）的技术可以改进上述程序的性能。\n\n### 认识你的原始类型\n\nPython 拥有许多内置类型：数值型（例如整数）、序列（例如列表）、映射（例如字典），以及类、实例和异常。这些类型的所有实例都是对象。\n\
    \nPython 3 中的整数是无界的——能够表示的最大整数取决于可用内存。可以使用常量 `sys.maxsize` 来查找机器字长；具体来说，它是可以存储在字中的最大整数值，例如在\
    \ 64 位机器上为 $2^{63}-1$。浮点数的边界规定在 `sys.float_info` 中。\n\n- 非常熟悉位运算符，如 `6&4`、`1|2`、`8>>1`、`-16>>>2`、`1<<10`、`~0`、`15^x`。负数被视为其补码值。（Python\
    \ 中没有无符号移动的概念，因为整数具有无限精度。）\n- 熟练掌握**位运算符**，特别是异或（XOR）。\n- 理解如何以**机器无关**的方式使用并创建**掩码**。\n\
    - 了解快速**清除最低置位**（并类推设置最低 0、获取其索引等）的方法。\n- 理解**符号位**及其对**位移**的影响。\n- 考虑使用**缓存**，通过暴力破解小规模输入来加速操作。\n\
    - 注意**交换律**和**结合律**可以用于**并行**执行操作和**重排**操作。\n\n**表 1.1:** 原始类型核心技巧\n\n- 数值类型的关键方法有\
    \ `abs(-34.5)`、`math.ceil(2.17)`、`math.floor(3.14)`、`min(x,-4)`、`max(3.14, y)`、`pow(2.71,\
    \ 3.14)`（或者使用 `2.71 ** 3.14`）以及 `math.sqrt(225)`。\n- 整数和字符串之间的相互转换，例如 `str(42)`、`int('42')`，浮点数和字符串的转换，例如\
    \ `str(3.14)`、`float('3.14')`。\n- 与整数不同，浮点数不是无限精度，使用 `float('inf')` 和 `float('-inf')`\
    \ 表示无穷大非常方便。这些值可以与整数比较，并用于创建伪最大值和伪最小值。\n- 在比较浮点数值时，考虑使用 `math.isclose()`——它是健壮的，例如在比较大值时，并且可以处理绝对差和相对差。\n\
    - `random` 模块的关键方法有 `random.randrange(28)`、`random.randint(8,16)`、`random.random()`、`random.shuffle(A)`\
    \ 和 `random.choice(A)`。\n\n### 1.1 计算字的奇偶性\n\n如果二进制字中 1 的个数为奇数，则字的奇偶性为 1；否则为 0。例如，1011\
    \ 的奇偶性为 1，10001000 的奇偶性为 0。\n\n你如何计算一个大数的奇偶性？提示：使用查找表。\n\n**解：** 由于我们只关心 1 的个数是偶数还是奇数，我们可以使用：\n\
    \n```python\ndef parity(x):\n    result = 0\n    while x:\n        result ^= x\
    \ & 1\n        x >>= 1\n    return result\n```\n\n[/content]\n\n    [content]\n\
    时间复杂度为 $O(n)$，其中 $n$ 是字长。\n\n现在我们将描述几种优于暴力破解法的算法。第一种改进基于清除字的最低置位。\n\n```python\n\
    def parity(x):\n    result = 0\n    while x:\n        result ^= 1\n        x &=\
    \ x - 1 # 去掉 x 的最低置位\n    return result\n```\n\n设 $k$ 为特定字中置为 1 的位数。（例如，对于 10001010，$k=3$。）上述算法的时间复杂度为\
    \ $O(k)$。\n\n这种方法分离 x 中最低位的特性非常重要，你应该记住它。然而，它也很好推导出。首先，假设 $x$ 不是 0，即它有一个位是 1。从\
    \ $x$ 中减去 1 将最右边的位变为 0 并将所有低位设置为 1（现在加回 1 即可恢复原始值）。其效果是屏蔽掉最右边的 1。因此，$x \\& \\\
    sim(x-1)$ 只有一个位设置为 1，即 $x$ 中最右边的 1。现在假设 $x$ 为 0。从 $x$ 中减去 1 会溢出，产生一个所有位均为 1 的字。同样，$x\
    \ \\& \\sim(x-1)$ 为 0。\n\n类似的推导显示，$x \\& (x-1)$ 将最低的 1 位位替换为 0。例如，如果 $x = (00101100)_2$，则\
    \ $x-1 = (00101011)_2$，所以 $x \\& (x-1) = (00101100)_2 \\& (00101011)_2 = (00101000)_2$。\n"
- fmt: "\nFirst we demonstrate caching. Clearly, we cannot cache the parity of every\
    \ 64-bit integer—we would need `2^(64)` bits of storage, which is of the order\
    \ of ten trillion exabytes. However, when computing the parity of a collection\
    \ of bits, it does not matter how we group those bits, i.e., the computation is\
    \ associative. Therefore, we can compute the parity of a 64-bit integer by grouping\
    \ its bits into four nonoverlapping 16 bit subwords, computing the parity of each\
    \ subwords, and then computing the parity of these four subresults. We choose\
    \ 16 since `2^(16) = 65536` is relatively small, which makes it feasible to cache\
    \ the parity of all 16-bit words using an array. Furthermore, since 16 evenly\
    \ divides 64, the code is simpler than if we were, for example, to use 10 bit\
    \ subwords.\n\nWe illustrate the approach with a lookup table for 2-bit words.\
    \ The cache is `0,1,1,0`—these are the parities of `(00)`, `(01)`, `(10)`, `(11)`,\
    \ respectively. To compute the parity of `(11001010)` we would compute the parities\
    \ of `(11)`, `(00)`, `(10)`, `(10)`. By table lookup we see these are `0,0,1,1`,\
    \ respectively, so the final result is the parity of `0,0,1,1` which is `0`.\n\
    \nTo lookup the parity of the first two bits in `(11101010)`, we right shift by\
    \ 6, to get `(00000011)`, and use this as an index into the cache. To lookup the\
    \ parity of the next two bits, i.e., `(10)`, we right shift by 4, to get `(10)`\
    \ in the two least-significant bit places. The right shift does not remove the\
    \ leading `(11)`—it results in `(00001110)`. We cannot index the cache with this,\
    \ it leads to an out-of-bounds access. To get the last two bits after the right\
    \ shift by 4, we bitwise-AND `(00001110)` with `(00000011)` (this is the “mask”\
    \ used to extract the last 2 bits). The result is `(00000010)`. Similar masking\
    \ is needed for the two other 2-bit lookups.\n\n```python\ndef parity(x):\n  \
    \  MASK_SIZE = 16\n    BIT_MASK = 0xFFFF\n    return (PRECOMPUTED_PARITY[x >>\
    \ (3 * MASK_SIZE)] ^\n            PRECOMPUTED_PARITY [(x >> (2 * MASK_SIZE)) &\
    \ BIT_MASK] ^\n            PRECOMPUTED_PARITY [(x >> MASK_SIZE) & BIT_MASK] ^\n\
    \            PRECOMPUTED_PARITY[x & BIT_MASK ])\n```\n\nThe time complexity is\
    \ a function of the size of the keys used to index the lookup table. Let `L` be\
    \ the width of the words for which we cache the results, and `n` the word size.\
    \ Since there are `n/L` terms, the time complexity is `O(n/L)`, assuming word-level\
    \ operations, such as shifting, take `O(1)` time. (This does not include the time\
    \ for initialization of the lookup table.)\n\nWe can improve on the `O(n)` worst-case\
    \ time complexity of the previous algorithms by exploiting some simple properties\
    \ of parity. Specifically, the XOR of two bits is defined to be 0 if both bits\
    \ are 0 or both bits are 1; otherwise it is 1. `XOR` has the property of being\
    \ associative, i.e., it does not matter how we group bits, as well as commutative,\
    \ i.e., the order in which we perform the XORs does not change the result. The\
    \ `XOR` of a group of bits is its parity. We can exploit this fact to use the\
    \ CPU’s word-level XOR instruction to process multiple bits at a time.\n\nFor\
    \ example, the parity of `b[63],b[62], . . ,b[3],b[2],b[1],b[0]` equals the parity\
    \ of the XOR of `b[63],b[62], . . ,b[32]` and `b[31],b[30], . . ,b[0]`. The XOR\
    \ of these two 32-bit values can be computed with a single shift and a single\
    \ 32-bit XOR instruction. We repeat the same operation on 32-, 16-, 8-, 4-, 2-,\
    \ and 1-bit operands to get the final result. Note that the leading bits are not\
    \ meaningful, and we have to explicitly extract the result from the least-significant\
