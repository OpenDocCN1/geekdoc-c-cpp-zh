  trans: "\n\n节点 `n` 的深度是从根节点到 `n` 的搜索路径上的节点数，不包括 `n` 本身。二叉树的高度是该树中任意节点的最大深度。二叉树的一层是具有相同深度的所有节点。参见上一页的图\
    \ 6.1 作为深度和高度概念的示例。\n\n作为这些概念的具体示例，请考虑对面页图 6.1 中的二叉树。节点 `I` 是 `J` 和 `O` 的父节点。节点\
    \ `G` 是 `B` 的后代。到 `L` 的搜索路径为 `A,I,J,K,L`。`N` 的深度为 `4`。节点 `M` 是深度最大的节点，因此树的高度为\
    \ `5`。以 `B` 为根的子树的高度为 `3`。以 `H` 为根的子树的高度为 `0`。节点 `D`,`E`,`H`,`M`,`N` 和 `P` 是树的叶子节点。\n\
    \n满二叉树是指除叶子节点外，每个节点都有两个孩子的二叉树。完美二叉树是一种满二叉树，其中所有叶子节点处于相同的深度，且每个父节点都有两个孩子。完全二叉树是指除最后一层外，每一层都完全满，且所有节点尽可能靠左的二叉树。（该术语并非通用，例如，某些作者使用完全二叉树来代替我们写的完美二叉树。）使用归纳法很容易证明，满二叉树中的非叶节点数量比叶子节点数量少一个。高度为\
    \ `h` 的完美二叉树恰包含 `2^(h+1)-1` 个节点，其中 `2^h` 个是叶子。`n` 个节点的完全二叉树高度为 `logn`。左斜树是指没有节点有右孩子的树；右斜树是指没有节点有左孩子的树。在任何情况下，我们称该二叉树为倾斜树。\n\
    \n二叉树的一个关键计算是遍历树中的所有节点。（遍历有时也被称为行走。）以下是实现这种访问的几种方法。\n\n* 遍历左子树，访问根节点，然后遍历右子树（中序遍历）。上一页图\
    \ 6.1 中二叉树的中序遍历按以下顺序访问节点：`D,C,E,B,FH,G,A,J,L,M,K,N,I,O,P`。\n* 访问根节点，遍历左子树，然后遍历右子树（前序遍历）。对面页图\
    \ 6.1 中二叉树的前序遍历按以下顺序访问节点：`A,B,C,D,E,FG,H,I,J,K,L,M,N,O,P`。\n* 遍历左子树，遍历右子树，然后访问根节点（后序遍历）。上一页图\
    \ 6.1 中二叉树的后序遍历按以下顺序访问节点：`D,E,C,H,G,FB,M,L,N,K,J,P,O,I,A`。\n\n设 `T` 为具有 `n` 个节点的二叉树，高度为\
    \ `h`。递归实现这些遍历的时间复杂度为 `O(n)`，额外空间复杂度为 `O(h)`。（空间复杂度由函数调用堆栈的最大深度决定。）如果每个节点都有一个\
    \ `parent field`，则可以用 `O(1)` 的额外空间复杂度完成遍历。\n\n`tree` 一词是重载的，这可能会导致混淆；参见第 75 页关于常见变体的概述。\n\
    \n### 二叉树训练营\n\n快速上手二叉树的一种良好方法是实现三种基本遍历——中序、前序和后序。\n\n```python\ndef tree_traversal(root):\n\
    \    if root:\n        # 前序：# 孩子。在遍历左右子树之前处理根节点。\n        print ('Preorder: %d'\
    \ % root.data)\n        tree_traversal(root.left)\n        # 中序：在遍历左子树后、# 遍历右子树前处理根节点。\n\
    \        print('Inorder: %d' % root.data)\n        tree_traversal(root.right)\n\
    \        # 后序：在遍历左右 # 孩子之后处理根节点。\n        print('Postorder: %d' % root.data)\n\
    ```\n\n每每种方法的时间复杂度均为 `O(n)`，其中 `n` 是树中的节点数。虽然没有显式分配内存，但函数调用堆栈会达到最大深度 `h`，即树的高度。因此，空间复杂度为\
    \ `O(h)`。`h` 的最小值为 `logn`（完全二叉树），最大值为 `n`（倾斜树）。\n\n`Recursive algorithms` 非常适合处理树上的问题。在进行空间复杂度分析时，请记住包含`function\
    \ call stack` 上隐式分配的空间。如果你需要复习递归，请阅读第 12 章的介绍。\n\n某些树问题有使用 `O(n)` 空间的简单暴力破解解，但也有更微妙的解，利用`existing\
    \ tree nodes` 将空间复杂度降低到 `O(1)`。\n\n在进行复杂度分析时，考虑 `left- and right-skewed trees`。注意，`O(h)`\
    \ 复杂度（其中 `h` 为树的高度）在完全二叉树中对应 `O(logn)`。\n\n如果每个节点都有一个 `parent field`，则可以用 `O(1)`\
    \ 的额外空间复杂度完成遍历。这可以简化代码，并减少误用为 `single child`。\n\n### 表 6.1：二叉树的技巧\n\n测试二叉树是否为高度平衡的\n\
    \n一棵二叉树被认为是高度平衡的，如果树中的每个节点左右子树的高度差最多为 1。完美二叉树是高度平衡的——参见下一页的图 6.2 示例。\n\nA\nB\n\
    C\nD\nE\nF\nG\nH\nI\nJ\nK\nL\nM\nN\n\n**图 6.2：** 高度为 4 的高度平衡二叉树。\n\n**解：** 这是一个暴力算法。从叶子开始向上计算每个节点的高度。检查左右孩子的高度差是否大于\
    \ 1。我们可以将高度存储在哈希表中，或者节点的新字段中。这涉及到 `O(n)`的存储和 `O(n)`的时间，其中 `n` 是树的节点数。\n\n我们可以通过观察到不需要存储所有节点的高度来使用更少的存储解决这个问题。当我们完成一个子树的处理时，只需要它是否平衡，以及它的高度——我们不需要子树根的任何信息。\n\
    \n```python\nimport collections\n\ndef is_balanced_binary_tree(tree):\n    # 返回值表示树是否平衡，如果是，返回值的第二个值是树的高度。\n\
    \    BalancedStatusWithHeight = collections.namedtuple('BalancedStatusWithHeight',\
    \ ('balanced', 'height'))\n    # 第一个值表示树是否平衡，如果是，第二个值是高度。\n    def check_balanced(tree):\n\
    \        if not tree:\n            return BalancedStatusWithHeight(True, -1) #\
    \ 基础情况。\n        left_result = check_balanced(tree.left)\n        if not left_result.balanced:\n\
    \            # 左子树不平衡。\n            return BalancedStatusWithHeight(False, 0)\n\
    \        right_result = check_balanced(tree.right)\n        if not right_result.balanced:\n\
    \            # 右子树不平衡。\n            return BalancedStatusWithHeight(False, 0)\n\
    \        is_balanced = abs(left_result.height - right_result.height) <= 1\n  \
    \      height = max(left_result.height, right_result.height) + 1\n        return\
    \ BalancedStatusWithHeight(is_balanced, height)\n    return check_balanced(tree).balanced\n\
    ```\n\n该程序实现了后序遍历，某些调用由于提前终止而被消除。具体来说，如果任何左子树不是高度平衡的，就不需要访问对应的右子树。函数调用堆栈对应于从根节点通过当前节点的唯一路径的调用序列，因此堆栈高度受限于树的高度，导致了\
    \ `O(h)` 的空间限制。时间复杂度与后序遍历相同，即 `O(n)`。\n\n**变体：** 写一个程序返回最大的完全二叉树子树的大小。\n\n"
