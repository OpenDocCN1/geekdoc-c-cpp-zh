    Graphs naturally arise when modeling geometric problems, such as determining connected
    cities. However, they are more general, and can be used to model many kinds of
    relationships.


    A graph can be implemented in two ways—using adjacency lists or an adjacency matrix.
    In the adjacency list representation, each vertex v, has a list of vertices to
    which it has an edge. The adjacency matrix representation uses a|V| × |V| Boolean-valued
    matrix indexed by vertices, with a 1 indicating the presence of an edge. The time
    and space complexities of a graph algorithm are usually expressed as a function
    of the number of vertices and edges.


    A tree (sometimes called a free tree) is a special sort of graph—it is an undirected
    graph that is connected but has no cycles. (Many equivalent definitions exist,
    e.g., a graph is a free tree if and only if there exists a unique path between
    every pair of vertices.) There are a number of variants on the basic idea of a
    tree. A rooted tree is one where a designated vertex is called the root, which
    leads to a parent-child relationship on the nodes. An ordered tree is a rooted
    tree in which each vertex has an ordering on its children. Binary trees, which
    are the subject of Chapter 6, differ from ordered trees since a node may have
    only one child in a binary tree, but that node may be a left or a right child,
    whereas in an ordered tree no analogous notion exists for a node with a single
    child. Specifically, in a binary tree, there is position as well as order associated
    with the children of nodes.


