    \ CPU 的字级异或指令一次处理多个位。例如，`b[63],b[62],...b[3],b[2],b[1],b[0]` 的奇偶性等于 `b[63],b[62],...b[32]`\
    \ 和 `b[31],b[30],...b[0]` 的异或。这两个 32 位值的异或可以通过一次移位和一个 32 位异或指令完成计算。对 32、16、8、4、2\
    \ 和 1 位操作重复相同的操作以得到最终结果。注意，领先位没有意义，我们必须从最低位显式提取结果。\n\n我们用一个 8 位字来演示这种方法。`(11010111)`\
    \ 的奇偶性等同于 `(1101)` 异或 `(0111)` 的奇偶性，即 `(1010)`。这又等同于 `(10)` 异或 `(10)` 的奇偶性，即 `(00)`。最终结果是\
    \ `(0)` 异或 `(0)`，即 `0`。注意，第一次异或得到 `(11011010)`，后续只有最后 4 位是有效的。第二次异或得到 `(11101100)`，只有最后\
    \ 2 位是有效的。第三次异或得到 `(10011010)`。最后一位是结果，为了提取它，我们必须与 `(0000)` 进行按位与。\n\n```python\n\
    def parity(x):\n    MASK_SIZE = 16\n    BIT_MASK = 0xFFFF\n    return (PRECOMPUTED_PARITY[x\
    \ >> (3 * MASK_SIZE)] ^\n            PRECOMPUTED_PARITY [(x >> (2 * MASK_SIZE))\
    \ & BIT_MASK] ^\n            PRECOMPUTED_PARITY [(x >> MASK_SIZE) & BIT_MASK]\
