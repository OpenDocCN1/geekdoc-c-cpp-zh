    # Elements of Programming Interviews in Python


    ## The Insiders’ Guide


    ### Adnan Aziz, Tsung-Hsien Lee, Amit Prakash


    This document is a sampling of our book, Elements of Programming Interviews in
    Python (EPI). Its purpose is to provide examples of EPI’s organization, content,
    style, topics, and quality. The sampler focuses solely on problems; in particular,
    it does not include three chapters on the nontechnical aspects of interviewing.
    We’d love to hear from you—we’re especially interested in your suggestions as
    to where the exposition can be improved, as well as any insights into interviewing
    trends you may have.


    You can buy EPI Python at Amazon.com (paperback). http://ElementsOfProgrammingInterviews.com


    `Adnan Aziz` is a Research Scientist at Facebook. Previously, he was a professor
    at the Department of Electrical and Computer Engineering at The University of
    Texas at Austin, where he conducted research and taught classes in applied algorithms.
    He received his Ph.D. from The University of California at Berkeley; his undergraduate
    degree is from Indian Institutes of Technology Kanpur. He has worked at Google,
    Qualcomm, IBM, and several software startups. When not designing algorithms, he
    plays with his children, Laila, Imran, and Omar.


    `Tsung-Hsien Lee` is a Senior Software Engineer at Uber. Previously, he worked
    as a Software Engineer at Google and as Software Engineer Intern at Facebook.
    He received both his M.S. and undergraduate degrees from National Tsing Hua University.
    He has a passion for designing and implementing algorithms. He likes to apply
    algorithms to every aspect of his life. He takes special pride in helping to organize
    Google Code Jam 2014 and 2015.


    `Amit Prakash` is a co-founder and CTO of ThoughtSpot, a Silicon Valley startup.
    Previously, he was a Member of the Technical Staff at Google, where he worked
    primarily on machine learning problems that arise in the context of online advertising.
    Before that he worked at Microsoft in the web search team. He received his Ph.D.
    from The University of Texas at Austin; his undergraduate degree is from Indian
