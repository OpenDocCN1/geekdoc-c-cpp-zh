    \ which all bits are set to one. Again, $x \\& \\sim(x-1)$ is 0.\n\nA similar\
    \ derivation shows that $x \\& (x-1)$ replaces the lowest bit that is 1 with 0.\
    \ For example, if $x = (00101100)_2$, then $x-1 = (00101011)_2$, so $x \\& (x-1)\
    \ = (00101100)_2 \\& (00101011)_2 = (00101000)_2$.\n"
