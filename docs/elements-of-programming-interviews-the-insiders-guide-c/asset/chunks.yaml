  trans: "\n\n一种方法是形成所有元素的乘积 `P`，然后找到所有 `i` 中 `P/A[i]` 的最大值。这需要 `n−1` 次乘法（形成 `P`）和\
    \ `n` 次除法（计算每个 `P/A[i]`）。假设由于有限精度的考虑，我们无法使用基于除法的方法；只能使用乘法。暴力解法涉及计算所有 `n` 个由 `n−1`\
    \ 个元素组成的乘积；每个这样的乘积需要 `n−2` 次乘法，即时间复杂度为 `^O(n²)`。\n\n给定一个长度为 `n` 元素为整数的数组 `A`，计算使用\
    \ `A` 中 `n−1` 个元素得到的最大乘积。你不能多次使用同一个元素。数组元素可以是正数、负数或 `0`。你的算法不能显式或隐式使用除法运算符。\n\n\
    **提示：** 考虑前 `i−1` 个元素和最后 `n−i` 个元素的乘积。或者，统计负数元素和零元素的个数。\n\n**解：** 计算 `P/A[i]`\
    \ 的暴力解法是将出现在 `i` 之前的元素与出现在 `i` 之后的元素相乘。这导致 `n(n−2)` 次乘法，因为对于每一项 `P/A[i]`，我们需要\
    \ `n−2` 次乘法。\n\n注意，在计算 `P/A[i]` 和 `P/A[i+1]` 时存在大量的计算重复。特别是 `i+1` 之前元素的乘积是 `A[i]`\
    \ 乘以 `i` 之前元素的乘积。我们可以通过 `n−1` 次乘法计算所有 `i` 之前元素的乘积，通过 `n−1` 次乘法计算所有 `i` 之后元素的乘积，并将这些值存储在前缀乘积数组和后缀乘积数组中。所需的结果就是最大的前缀后缀乘积。稍微节省空间的方法是构建后缀乘积数组，然后正向遍历数组，使用单个变量计算前缀乘积。将此前缀乘积与相应的后缀乘积相乘，如果需要则更新最大前缀后缀乘积。\n\
    \n```python\ndef find_biggest_n_minus_one_product(A):\n    # Builds suffix products.\n\
    \    suffix_products = list(\n        reversed(list(itertools.accumulate(reversed(A),\
    \ operator.mul))))\n    )\n    # Finds the biggest product of (n - 1) numbers.\n\
    \    prefix_product, max_product = 1, float('-inf')\n    for i in range(len(A)):\n\
    \        suffix_product = suffix_products[i + 1] if i + 1 < len(A) else 1\n  \
    \      max_product = max(max_product , prefix_product * suffix_product)\n    \
    \    prefix_product *= A[i]\n    return max_product\n```\n\n时间复杂度为 `^O(n)`；空间复杂度为\
    \ `^O(n)`，因为该解决方案使用了长度为 `n` 的单个数组。\n\n我们现在用 `^O(n)` 时间和 `^O(1)` 额外存储来解决这个问题。洞察来自于：如果没有负数元素，最大乘积来自于使用除最小元素以外的所有元素。（注意，如果\
    \ `0` 元素的个数为零、一个或多个，该结果均是正确的。）\n\n如果负数元素的个数为奇数，无论有多少 `0` 元素和正数元素，最大乘积都使用除绝对值最小的负数（即最小的负数）以外的所有元素。\n\
    \n进一步来说，如果负数元素的个数为偶数，最大乘积再次使用除最小非负元素以外的所有元素，假设非负元素的个数大于零。（即使在存在 `0` 元素的情况下，这也是正确的。）\n\
    \n如果负数元素的个数为偶数，且没有非负元素，则结果必须为负数。由于我们想要最大的乘积，我们舍弃幅度最大的元素，即最大的负数。\n\n该分析得出了一个两阶段算法。首先，确定适用的场景，例如，是否存在偶数个负数？随后，执行实际乘法以获得结果。\n\
    \n```python\ndef find_biggest_n_minus_one_product(A):\n    number_of_negatives\
    \ = 0\n    least_nonnegative_idx = least_negative_idx = greatest_negative_idx\
    \ = None\n    # Identify entries. for i, a in the least negative , greatest negative\
    \ , and least nonnegative\n    for i, a in enumerate(A):\n        if a < 0:\n\
    \            number_of_negatives += 1\n            if least_negative_idx is None\
    \ or A[least_negative_idx] < a:\n                least_negative_idx = i\n    \
    \        if greatest_negative_idx is None or a < A[greatest_negative_idx]:\n \
    \               greatest_negative_idx = i\n        else: # a >= 0.\n         \
    \   if least_nonnegative_idx is None or a < A[least_nonnegative_idx]:\n      \
    \          least_nonnegative_idx = i\n    idx_to_skip = (least_negative_idx if\
    \ number_of_negatives % 2 else least_nonnegative_idx if\n                   least_nonnegative_idx\
    \ is not None else greatest_negative_idx)\n    return functools.reduce(lambda\
    \ product , a: product * a,\n        # Use a generator rather than list comprehension\
    \ to avoid extra space.\n        (a for i, a in enumerate(A) if i != idx_to_skip),\
    \ 1)\n```\n\n该算法对数组进行遍历，每个元素执行常数次计算、一个嵌套条件判断，随后是另一个数组的遍历，每个元素执行常数次计算。因此，时间复杂度为\
    \ `O(n) +O(1) +O(n) =O(n)`。额外空间复杂度为 `^O(1)`，对应于局部变量。\n\n"
