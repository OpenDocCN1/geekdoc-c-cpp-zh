    # **6 Binary Trees**


    The method of solution involves the development of a theory of finite automata
    operating on infinite trees.


    — “Decidability of Second Order Theories and Automata on Trees,” M. O. R^(abin),
    1969


    Formally, a binary tree is either empty, or a root node r together with a left
    binary tree and a right binary tree. The subtrees themselves are binary trees.
    The left binary tree is sometimes referred to as the left subtree of the root,
    and the right binary tree is referred to as the right subtree of the root.


    Binary trees most commonly occur in the context of binary search trees, wherein
    keys are stored in a sorted fashion (Chapter 11 on Page 54). However, there are
    many other applications of binary trees: at a high level, binary tree are appropriate
    when dealing with hierarchies.


    Figure 6.1 gives a graphical representation of a binary tree. Node A is the root.
    Nodes B and I are the left and right children of A.


    ^A 314 depth 0


    B 6 6 I depth 1


    C 271 561 F J 2 271 O depth 2


    height = 5


    D 28 0 E 3 G 1 K P 28 depth 3


    H 17 L 401 257 N depth 4


    641 M depth 5


    **Figure 6.1:** Example of a binary tree. The node depths range from


    0 to 5. Node M has the highest depth (5) of any node in the tree, implying the
    height of the tree is 5.


    Often the node stores additional data. Its prototype is listed as follows:


    class BinaryTreeNode:


    def __init__(self , data=None , left=None , right=None): self.data = data


    self.left = left


    self.right = right


    Each node, except the root, is itself the root of a left subtree or a right subtree.
    If l is the root of p’s left subtree, we will say l is the left child of p, and
    p is the parent of l; the notion of right child is similar. If a node is a left
    or a right child of p, we say it is a child of p. Note that with the exception
    of the root, every node has a unique parent. Usually, but not universally, the
    node object definition includes a parent field (which is null for the root). Observe
    that for any node there exists a unique sequence of nodes from the root to that
    node with each node in the sequence being a child of the previous node. This sequence
    is sometimes referred to as the search path from the root to the node.


    The parent-child relationship defines an ancestor-descendant relationship on nodes
    in a binary tree. Specifically, a node is an ancestor of d if it lies on the search
    path from the root to d. If a node is an ancestor of d, we say d is a descendant
    of that node. Our convention is that a node is an ancestor and descendant of itself.
    A node that has no descendants except for itself is called a leaf.'
