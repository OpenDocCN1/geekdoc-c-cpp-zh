    \            ]\n    return True\n```\n\n时间复杂度为 $O(n)$，额外的空间复杂度为 $O(n)$。\n\n#递归的力量显然在于可以通过有限的语句定义无限对象集。同样，无限数量的计算可以通过一个有限的递归程序描述，即使该程序不包含显式的重复。\n\
    \n— “算法 + 数据结构 = 程序，” N. E. Wirth, 1976\n\n递归是解决问题的方法，其中解部分取决于相关问题的较小实例的解。当输入使用递归规则（如计算机语法）表示时，这种方法通常是合适的。更广泛地说，搜索、枚举、分治以及将复杂问题分解为一组相似的较小实例，都是递归可能适用的场景。\n\
    \n递归函数由基准情况（base cases）和带有不同参数的相同调用组成。成功使用递归的两个关键要素是识别可以直接解决的基准情况，以及确保进展性（即递归收敛到解）。\n\
    \n回溯和分支定界自然地使用递归表述。**递归训练营**\n\n用于计算两个数字最大公约数（GCD）的欧几里得算法是递归的经典示例。核心思想是，如果 `y>\
    \ x`，`x` 和 `y` 的 GCD 是 `x` 和 `y− x` 的 GCD。例如，`GCD(156,36) = GCD((156− 36) = 120,36)`。以此类推，这意味着\
    \ `x` 和 `y` 的 GCD 是 `x` 和 `y mod x` 的 GCD，即 `GCD(156,36) = GCD((156 mod 36) =\
    \ 12,36) = GCD(12,36 mod 12 = 0) = 12`。\n\n```python\ndef gcd(x, y):\n    return\
    \ x if y == 0 else gcd(y, x % y)\n```\n\n由于每个递归步骤中其中一个参数至少减少了一半，这意味着时间复杂度为 $O(\\\
    log \\max(x, y))$。换句话说，时间复杂度为 $O(n)$，其中 $n$ 是表示输入所需的位数。空间复杂度也是 $O(n)$，即函数调用栈的最大深度。（该程序可以很容易转换为循环形式的程序，从而将空间复杂度降低到\
    \ $O(1)$。）\n\n现在我们描述一个可以使用递归分治算法优雅解决的问题。三骨牌（triomino）由三个单位大小的正方形以 L 形连接形成。一个被割残缺的棋盘（下文称为\
