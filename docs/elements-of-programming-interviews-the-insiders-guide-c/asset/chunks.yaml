    ## Part I


    Data Structures and Algorithms


    [C]hapter


    # **1 Primitive Types**


    Representation is the essence of programming.


    — “The Mythical Man Month,” F. P. B^(rooks), 1975


    A program updates variables in memory according to its instructions. Variables
    come in types—a type is a classification of data that spells out possible values
    for that type and the operations that can be performed on it. A type can be provided
    by the language or defined by the programmer. In Python everything is an object—this
    includes Booleans, integers, characters, etc.


    **Primitive types boot camp**


    Writing a program to count the number of bits that are set to 1 in an integer
    is a good way to get up to speed with primitive types. The following program tests
    bits one-at-a-time starting with the least-significant bit. It illustrates shifting
    and masking; it also shows how to avoid hard-coding the size of the integer word.


    def count_bits(x):


    num_bits = 0


    while x:


    num_bits += x & 1


    x >>= 1


    return num_bits


    Since we perform^O(1) computation per bit, the time complexity is^O(n), where
    n is the number of bits needed to represent the integer, e.g., 4 bits are needed
    to represent 12, which is (1100)[2] in binary. The techniques in Solution 1.1
    on the facing page, which is concerned with counting the number of bits modulo
    2, i.e., the parity, can be used to improve the performance of the program given
    above.


    **Know your primitive types**


    Python has a number of build-in types: numerics (e.g., integer), sequences (e.g.,
    list), mappings (e.g., dict), as well as classes, instances and exceptions. All
    instances of these types are objects.


    Integers in Python3 are unbounded—the maximum integer representable is a function
    of the available memory. The constantsys.maxsize can be used to find the word-size;
    specifically, it’s the maximum value integer that can be stored in the word, e.g.,2**63
    - 1 on a 64-bit machine. Bounds on floats are specified insys.float_info.


    • Be very familiar with the bit-wise operators such as6&4,1|2,8>>1,-16>>>2,1<<10,˜0,15ˆx.
    Negative numbers are treated as their 2’s complement value. (There is no concept
    of an unsigned shift in Python, since integers have infinite precision.)


    Be very comfortable with the **bitwise operators**, particularly XOR.


    Understand how to use **masks** and create them in an **machine independent**
    way.


    Know fast ways to **clear the lowermost set bit** (and by extension, set the lowermost
    0, get its index, etc.)


    Understand **signedness** and its implications to **shifting**.


    Consider using a **cache** to accelerate operations by using it to brute-force
    small inputs.


    Be aware that **commutativity** and **associativity** can be used to perform operations
    in **parallel** and **reorder** operations.


    **Table 1.1:** Top Tips for Primitive Types


    • The key methods for numeric types areabs(-34.5),math.ceil(2.17),math.floor(3.14),
    min(x,-4), max(3.14, y), pow(2.71, 3.14) (alternately, 2.71 ** 3.14), and math.sqrt(225).


    • Know how to interconvert integers and strings, e.g.,str(42), int(’42’), floats
    and strings, e.g.,str(3.14), float(’3.14’).


    • Unlike integers, floats are not infinite precision, and it’s convenient to refer
    to infinity as float(’inf’) andfloat(’-inf’). These values are comparable to integers,
    and can be used to create psuedo max-int and pseudo min-int.


    • When comparing floating point values consider using math.isclose()—it is robust,
    e.g., when comparing very large values, and can handle both absolute and relative
    differences.


    • The key methods in random are random.randrange(28), random.randint(8,16), random.random(),random.shuffle(A),
    andrandom.choice(A).


    [1.1 C]omputing the parity of a word


    The parity of a binary word is 1 if the number of 1s in the word is odd; otherwise,
    it is 0\. For example, the parity of 1011 is 1, and the parity of 10001000 is
    0\. Parity checks are used to detect single bit errors in data storage and communication.
    It is fairly straightforward to write code that computes the parity of a single
    64-bit word.


    How would you compute the parity of a very large number of 64-bit words?


    Hint: Use a lookup table, but don’t use 2^(64) entries!


    **Solution:** The brute-force algorithm iteratively tests the value of each bit
    while tracking the number of 1s seen so far. Since we only care if the number
    of 1s is even or odd, we can store the number modulo 2.


    def parity(x):


    result = 0


    while x:


    result ^= x & 1


    x >>= 1 return result


    The time complexity is^O(n), where n is the word size.


    We will now describe several algorithms for parity computation that are superior
    to the brute


    force algorithm.


    The first improvement is based on erasing the lowest set bit in a word in a single
    operation, thereby improving performance in the best- and average-cases. Specifically,
    the expression y = x & ~(x^− 1), where & is the bitwise-AND operator and ~ is
    the bitwise complement


    operator. The variable y is 1 at exactly the lowest bit of x that is 1; all other
    bits in y are


    0\. For example, if x = (00101100)[2], then x^− 1 = (00101011)[2], ~(x^− 1) =
    (11010100)[2], and


    y = (00101100)[2] & (11010100)[2] = (00000100)[2]. This calculation is robust—it
    is correct for unsigned


    and two’s-complement representations. Consequently, this bit may be removed from
    x by computing x^⊕ y, where^⊕ is the bitwise-XOR function. The time complexity
    is^O(s), where s is the number


    of bits set to 1 in x.


    def parity(x):


    result = 0


    while x:


    result ^= 1


    x &= x - 1 # Drops the lowest set bit of x.


    return result


    Let k be the number of bits set to 1 in a particular word. (For example, for 10001010,
    k = 3.) Then time complexity of the algorithm above isO(k).


    The fact that x & ~(x^−1) isolates the lowest bit that is 1 in x is important
    enough that you should memorize it. However, it is also fairly easy to derive.
    First, suppose x is not 0, i.e., it has has a bit that is one. Subtracting one
    from x changes the rightmost bit to zero and sets all the lower bits to one (if
    you add one now, you get the original value back). The effect is to mask out the
    rightmost one. Therefore x & ~(x− 1) has a single bit set to one, namely, the
    rightmost 1 in x. Now suppose x is 0\. Subtracting one from x underflows, resulting
    in a word in which all bits are set to one. Again, x & ~(x^− 1) is 0.


    A similar derivation shows that x &(x^− 1) replaces the lowest bit that is 1 with
    0\. For example, if x = (00101100)[2], then x^− 1 = (00101011)[2], so x &(x^−
    1) = (00101100)[2]&(00101011)[2] = (00101000)[2]. This fact can also be very useful.


    We now consider a qualitatively di fferent approach. The problem statement refers
    to computing the parity for a very large number of words. When you have to perform
    a large number of parity computations, and, more generally, any kind of bit fiddling
    computations, two keys to performance are processing multiple bits at a time and
    caching results in an array-based lookup table.'
