  raw: 'Scripting languages, such as AWK, Perl, and Python were originally developed
    as tools for quick hacks, rapid prototyping, and gluing together other programs.
    They have evolved into mainstream programming languages. Some of their characteristics
    are as follows.


    • Text strings are the basic (sometimes only) data type.


    • Associative arrays are a basic aggregate type.


    • Regexps are usually built in.


    • Programs are interpreted rather than compiled.


    • Declarations are often not required.


    They are easy to get started with, and can often do a great deal with very little
    code. **Build systems**


    A program typically cannot be executed immediately after change: intermediate
    steps are required to build the program and test it before deploying it. Other
    components can also be affected by changes, such as documentation generated from
    program text. Build systems automate these steps.


    **Database**


    Most software systems today interact with databases, and it’s important for developers
    to have basic knowledge of databases.


    **Networking**


    Most software systems today interact with the network, and it’s important for
    developers even higher up the stack to have basic knowledge of networking. Here
    are networking questions you may encounter in an interview setting.


    ## Part III


    The Honors Class


    [C]hapter


    # **21 Honors Class**


    The supply of problems in mathematics is inexhaustible, and as soon as one problem
    is solved numerous others come forth in its place.


    — “Mathematical Problems,” D. H^(ilbert), 1900


    This chapter contains problems that are more di fficult to solve than the ones
    presented earlier. Many of them are commonly asked at interviews, albeit with
    the expectation that the candidate will not deliver the best solution.


    There are several reasons why we included these problems:


    • Although mastering these problems is not essential to your success, if you do
    solve them, you will have put yourself into a very strong position, similar to
    training for a race with ankle weights.


    • If you are asked one of these questions or a variant thereof, and you successfully
    derive the best solution, you will have strongly impressed your interviewer. The
    implications of this go beyond being made an offer—your salary, position, and
    status will all go up.


    • Some of the problems are appropriate for candidates interviewing for specialized
    positions, e.g., optimizing large scale distributed systems, machine learning
    for computational finance, etc. They are also commonly asked of candidates with
    advanced degrees.


    • Finally, if you love a good challenge, these problems will provide it!


    You should be happy if your interviewer asks you a hard question—it implies high
    expectations, and is an opportunity to shine, compared, for example, to being
    asked to write a program that tests if a string is palindromic.


    Intractability


    Coding problems asked in interviews almost always have one (or more) solutions
    that are fast, e.g., ^O(n) time complexity. Sometimes, you may be asked a problem
    that is computationally intractable— there may not exist an efficient algorithm
    for it. (Such problems are common in the real world.) There are a number of approaches
    to solving intractable problems:


    • brute-force solutions, including dynamic programming, which have exponential
    time complexity, may be acceptable, if the instances encountered are small, or
    if the specific parameter that the complexity is exponential in is small;


    • search algorithms, such as backtracking, branch-and-bound, and hill-climbing,
    which prune much of the complexity of a brute-force search;


    • approximation algorithms which return a solution that is provably close to optimum;


    • heuristics based on insight, common case analysis, and careful tuning that may
    solve the problem reasonably well;


    • parallel algorithms, wherein a large number of computers can work on subparts
    simultaneously.


    [21.1 C]ompute the greatest common divisor


    The greatest common divisor (GCD) of nonnegative integers x and y is the largest
    integer d such that d divides x evenly, and d divides y evenly, i.e., x mod d
    = 0 and y mod d = 0\. (When both x and y are 0, take their GCD to be 0.)


    Design an efficient algorithm for computing the GCD of two nonnegative integers
    without using multiplication, division or the modulus operators.


    Hint: Use case analysis: both even; both odd; one even and one odd.


    **Solution:** The straightforward algorithm is based on recursion. If x = y, GCD(x,
    y) = x; otherwise, assume without loss of generality, that x> y. Then GCD(x, y)
    is the GCD(x^− y, y).


    The recursive algorithm based on the above does not use multiplication, division
    or modulus, but for some inputs it is very slow. As an example, if the input is
    x = 2^n, y = 2, the algorithm makes 2^(n−1) recursive calls. The time complexity
    can be improved by observing that the repeated subtraction amounts to division,
    i.e., when x> y, GCD(x, y) = GCD(y,x mod y), but this approach uses integer division
    which was explicitly disallowed in the problem statement.


    Here is a fast solution, which is also based on recursion, but does not use general
    multiplication or division. Instead it uses case-analysis, specifically, the cases
    of one, two, or none of the numbers being even.


    An example is illustrative. Suppose we were to compute the GCD of 24 and 300\.
    Instead of repeatedly subtracting 24 from 300, we can observe that since both
    are even, the result is 2^× GCD(12,150). Dividing by 2 is a right shift by 1,
    so we do not need a general division operation. Since 12 and 150 are both even,
    GCD(12,150) = 2× GCD(6,75). Since 75 is odd, the GCD of 6 and 75 is the same as
    the GCD of 3 and 75, since 2 cannot divide 75\. The GCD of 3 and 75 is the GCD
    of 3 and 75^− 3 = 72\. Repeatedly applying the same logic, GCD(3,72) = GCD(3,36)
    = GCD(3,18) = GCD(3,9) = GCD(3,6) = GCD(3,3) = 3. This implies GCD(24,300) = 2×
    2× 3 = 12.


    More generally, the base case is when the two arguments are equal, in which case
    the GCD is that value, e.g., GCD(12,12) = 12, or one of the arguments is zero,
    in which case the other is the GCD, e.g., GCD(0,6) = 6.


    Otherwise, we check if none, one, or both numbers are even. If both are even,
    we compute the GCD of the halves of the original numbers, and return that result
    times 2; if exactly one is even, we half it, and return the GCD of the resulting
    pair; if both are odd, we subtract the smaller from the larger and return the
    GCD of the resulting pair. Multiplication by 2 is trivially implemented with a
    single left shift. Division by 2 is done with a single right shift.


    def gcd(x, y):


    if x > y:


    return gcd(y, x)


    elif x == 0:


    return y


    elif not x & 1 and not y & 1: # x and y are even.


    return gcd(x >> 1, y >> 1) << 1


    elif not x & 1 and y & 1: # x is even , y is odd.


    return gcd(x >> 1, y)


    elif x & 1 and not y & 1: # x is odd , y is even.


    return gcd(x, y >> 1)


    return gcd(x, y - x) # Both x and y are odd.


    Note that the last step leads to a recursive call with one even and one odd number.
    Consequently, in every two calls, we reduce the combined bit length of the two
    numbers by at least one, meaning that the time complexity is proportional to the
    sum of the number of bits in x and y, i.e.,^O(logx+log y)).


    [21.2 C]ompute the maximum product of all entries but one


    Suppose you are given an array A of integers, and are asked to find the largest
    product that can be made by multiplying all but one of the entries in A. (You
    cannot use an entry more than once.) For example, if A = 3,2,5,4 , the result
    is 3^× 5^× 4 = 60, if A = 3,2,^−1,4 , the result is 3^× 2^× 4 = 24, and if A =
    3,2,^−1,4,^−1,6 , the result is 3^(× −)1^× 4^(× −)1^× 6 = 72.'
