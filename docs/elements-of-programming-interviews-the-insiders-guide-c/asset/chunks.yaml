    # **7 Heaps**


    Using F-heaps we are able to obtain improved running times for several network
    optimization algorithms.


    — “Fibonacci heaps and their uses,” M. L. F^(redman and) R. E. T^(arjan), 1987


    A heap is a specialized binary tree. Specifically, it is a complete binary tree
    as defined on Page 29. The keys must satisfy the heap property—the key at each
    node is at least as great as the keys stored at its children. See Figure 7.1(a)
    for an example of a max-heap. A max-heap can be implemented as an array; the children
    of the node at index i are at indices 2i+1 and 2i+2\. The array representation
    for the max-heap in Figure 7.1(a) is 561,314,401,28,156,359,271,11,3 .


    A max-heap supports^O(logn) insertions,^O(1) time lookup for the max element,
    and^O(logn) deletion of the max element. The extract-max operation is defined
    to delete and return the maximum element. See Figure 7.1(b) for an example of
    deletion of the max element. Searching for arbitrary keys has^O(n) time complexity.


    A heap is sometimes referred to as a priority queue because it behaves like a
    queue, with one difference: each element has a “priority” associated with it,
    and deletion removes the element with the highest priority.


    The min-heap is a completely symmetric version of the data structure and supports^O(1)
    time lookups for the minimum element.


    561 401


    314 401 314 359


    28 156 359 271 28 156 3 271


    11 3 11


    (a) A max-heap. Note that the root hold the maximum key, (b) After the deletion
    of max of the heap in (a). Deletion is per561\. formed by replacing the root’s
    key with the key at the last leaf and then recovering the heap property by repeatedly
    exchanging keys with children.


    **Figure 7.1:** A max-heap and deletion on that max-heap.


    **Heaps boot camp**


    Suppose you were asked to write a program which takes a sequence of strings presented
    in “streaming” fashion: you cannot back up to read an earlier value. Your program
    must compute thek longest strings in the sequence. All that is required is the
    k longest strings—it is not required to order these strings.


    As we process the input, we want to track the k longest strings seen so far. Out
    of these k strings, the string to be evicted when a longer string is to be added
    is the shortest one. A min-heap (not a max-heap!) is the right data structure
    for this application, since it supports efficient find-min, remove-min, and insert.
    In the program below we use a heap with a custom compare function, wherein strings
    are ordered by length.


    def top_k(k, stream):


    # Entries are compared by their lengths.


    min_heap = [( len(s), s) for s in itertools.islice(stream , k)]


    heapq.heapify(min_heap)


    for next_string in stream:


    # Push next_string and pop the shortest string in min_heap.


    heapq.heappushpop(min_heap , (len(next_string), next_string)) return [p[1] for
    p in heapq.nsmallest(k, min_heap)]


    Each string is processed in^O(logk) time, which is the time to add and to remove
    the minimum element from the heap. Therefore, if there are n strings in the input,
    the time complexity to process all of them is^O(nlogk).


    We could improve best-case time complexity by first comparing the new string’s
    length with the length of the string at the top of the heap (getting this string
    takes^O(1) time) and skipping the insert if the new string is too short to be
    in the set.


    Use a heap when **all you care about** is the **largest** or **smallest** elements,
    and you **do not need** to support fast lookup, delete, or search operations for
    arbitrary elements.


    A heap is a good choice when you need to compute the k **largest or** k **smallest**
    elements in a collection. For the former, use a min-heap, for the latter, use
    a max-heap.


    **Table 7.1:** Top Tips for Heaps


    **Know your heap libraries**


    Heap functionality in Python is provided by the heapq module. The operations and
    functions we will use are


    • heapq.heapify(L), which transforms the elements inL into a heap in-place,


    • heapq.nlargest(k, L) (heapq.nsmallest(k, L)) returns the k largest (smallest)
    elements in L,


    • heapq.heappush(h, e), which pushes a new element on the heap,


    • heapq.heappop(h), which pops the smallest element from the heap,


    • heapq.heappushpop(h, a), which pushes a on the heap and then pops and returns
    the smallest element, and


    • e = h[0], which returns the smallest element on the heap without popping it.


    •


    It’s very important to remember thatheapq only provides min-heap functionality.
    If you need to build a max-heap on integers or floats, insert their negative to
