    **Queues**


    A queue supports two basic operations—enqueue and dequeue. (If the queue is empty,
    dequeue typically returns null or throws an exception.) Elements are added (enqueued)
    and removed (dequeued) in first-in, first-out order. The most recently inserted
    element is referred to as the tail or back element, and the item that was inserted
    least recently is referred to as the head or front element.


    A queue can be implemented using a linked list, in which case these operations
    have^O(1) time complexity. The queue API often includes other operations, e.g.,
    a method that returns the item at the head of the queue without removing it, a
    method that returns the item at the tail of the queue without removing it, etc.


