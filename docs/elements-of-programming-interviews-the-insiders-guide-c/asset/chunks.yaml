  trans: "\n\n双端队列（deque），有时称为双端队列，是一种双向链表，其所有的插入和删除操作都在列表的两个端之一，即头部或尾部。在头部插入通常称为\
    \ `push`，在尾部插入通常称为 `inject`。从头部删除通常称为 `pop`，从尾部删除通常称为 `eject`。（不同的不同的编程语言和库可能会有不同的命名法。）\n\
    \n### 队列训练营\n\n在接下来的程序中，我们实现了基本的队列 API——`enqueue` 和 `dequeue`——以及一个 `max` 方法，该方法返回队列中存储的最大元素。基本思想是使用组合：添加一个引用库队列对象的私有字段，并将现有方法（在本例中为\
    \ `enqueue` 和 `dequeue`）转发到该对象。\n\n```python\nclass Queue:\n    def __init__(self):\n\
    \        self._data = []\n\n    def enqueue(self, x):\n        self._data.append(x)\n\
    \n    def dequeue(self):\n        return self._data.pop(0)\n\n    def max(self):\n\
    \        return max(self._data)\n```\n\n`enqueue` 和 `dequeue` 的时间复杂度与库队列相同，即 `O(1)`。寻找最大值的时间复杂度为\
    \ `O(n)`，其中 `n` 是条目的数量。学习识别何时适用队列的 FIFO（先进先出）属性。例如，当需要保持顺序时，队列是理想的。\n\n**表 5.2:**\
    \ 队列技巧\n\n### 了解队列库\n\n某些问题需要你实现自己的队列类；另一些问题则使用 `collections.deque` 类。\n\n* `q.append(e)`\
    \ 将一个元素推入队列。调用 `push` 通常不会出什么错。\n* `q[0]` 将检索但不会移除队列头部的元素。同样，`q[-1]` 将检索但不会移除队列尾部的元素。\n\
    * `q.popleft()` 将移除并返回队列头部的元素。对空集合进行出队或访问头部/尾部会导致 `IndexError` 异常。\n\n### [5.2]\
    \ 按深度递增的顺序计算二叉树节点\n\n二叉树在第 6 章中正式定义。特别是，二叉树中的每个节点都有一个深度，即它到根节点的距离。\n\n给定一个二叉树，返回一个由相同层键组成的数组。键应该按照相应节点深度的顺序出现，如果深度相同，则从左到右打破。例如，对于第\
    \ 28 页图 6.1 中的二叉树，你应该返回 `314, 6,6, 271,561,2,271, 28,0,3,1,28, 17,401,257, 641`。\n\
    \n**提示：** 首先考虑使用一对队列来解决这个问题。\n\n**解决方案：** 一种暴力方法可能是将节点写入数组中，同时计算它们的深度。我们可以使用先序遍历来计算此数组——通过先遍历节点的左孩子，我们可以确保相同深度的节点从左到右排序。现在我们可以使用稳定排序算法对该数组进行排序，以节点深度为排序键。时间复杂度由排序所需的时间决定，即\
    \ `O(nlogn n)`，空间复杂度为 `O(n)`，即存储节点深度的空间。\n\n直觉上，由于节点在树中已经以某种有序的方式呈现，因此可能避免完全排序，从而减少时间复杂度。此外，通过按深度的顺序处理节点，我们不需要为每个节点标记其深度。\n\
    \n在下面，我们使用一个存储深度为 `i` 的节点的队列和一个存储深度为 `i + 1` 的节点的队列。在处理完所有深度为 `i` 的节点后，我们就完成了该队列，并开始处理深度为\
    \ `i + 1` 的节点队列，将深度 `i + 2` 的节点放入一个新的队列。\n\n```python\ndef binary_tree_depth_order(tree):\n\
    \    result, curr_depth_nodes = [], collections.deque([tree])\n    while curr_depth_nodes:\n\
    \        next_depth_nodes, this_level = collections.deque([]), []\n        while\
    \ curr_depth_nodes:\n            curr = curr_depth_nodes.popleft()\n         \
    \   if curr:\n                this_level.append(curr.data)\n                #\
    \ 将空检查推迟到上面的空测试中。next_depth_nodes += [curr.left, curr.right]\n        if this_level:\n\
    \            result.append(this_level)\n        curr_depth_nodes = next_depth_nodes\n\
    \    return result\n```\n\n由于每个节点恰好入队和出队一次，时间复杂度为 `O(n)`。空间复杂度为 `O(m)`，其中 `m`\
    \ 是任何单一深度的最大节点数。\n\n**变体：** 编写一个程序，以二叉树为输入，并从左到右开始，交替从左到右和从右到左顺序从向下返回键。例如，如果输入是下一页图\
    \ 6.1 中的二叉树，你的程序将返回 `314, 6,6, 271,561,2,271, 28,1,3,0,28, 17,401,257, 641`。\n\
    \n**变体：** 编写一个程序，以二叉树为输入，并按自下向上、从左到右顺序返回键。例如，如果输入是下一页图 6.1 中的二叉树，你的程序将返回 `314,\
    \ 6,6, 271,561,2,271, 28,1,3,0,28, 17,401,257, 641`。\n\n"
- fmt: "\nThe depth of a node `n` is the number of nodes on the search path from the\
    \ root to `n`, not including `n` itself. The height of a binary tree is the maximum\
    \ depth of any node in that tree. A level of a tree is all nodes at the same depth.\
    \ See Figure 6.1 on the preceding page for an example of the depth and height\
    \ concepts.\n\nAs concrete examples of these concepts, consider the binary tree\
    \ in Figure 6.1 on the facing page. Node `I` is the parent of `J` and `O`. Node\
    \ `G` is a descendant of `B`. The search path to `L` is `A,I,J,K,L`. The depth\
    \ of `N` is `4`. Node `M` is the node of maximum depth, and hence the height of\
    \ the tree is `5`. The height of the subtree rooted at `B` is `3`. The height\
    \ of the subtree rooted at `H` is `0`. Nodes `D`,`E`,`H`,`M`, `N`, and `P` are\
    \ the leaves of the tree.\n\nA full binary tree is a binary tree in which every\
    \ node other than the leaves has two children. A perfect binary tree is a full\
    \ binary tree in which all leaves are at the same depth, and in which every parent\
    \ has two children. A complete binary tree is a binary tree in which every level,\
    \ except possibly the last, is completely filled, and all nodes are as far left\
    \ as possible. (This terminology is not universal, e.g., some authors use complete\
    \ binary tree where we write perfect binary tree.) It is straightforward to prove\
    \ using induction that the number of nonleaf nodes in a full binary tree is one\
    \ less than the number of leaves. A perfect binary tree of height `h` contains\
    \ exactly `2^(h+1)-1` nodes, of which `2^h` are leaves. A complete binary tree\
    \ on `n` nodes has height `logn`. A left-skewed tree is a tree in which no node\
    \ has a right child; a right-skewed tree is a tree in which no node has a left\
    \ child. In either case, we refer to the binary tree as being skewed.\n\nA key\
    \ computation on a binary tree is traversing all the nodes in the tree. (Traversing\
    \ is also sometimes called walking.) Here are some ways in which this visit can\
    \ be done.\n\n* Traverse the left subtree, visit the root, then traverse the right\
    \ subtree (an inorder traversal). An inorder traversal of the binary tree in Figure\
    \ 6.1 on the preceding page visits the nodes in the following order: `D,C,E,B,FH,G,A,J,L,M,K,N,I,O,P`.\n\
    * Visit the root, traverse the left subtree, then traverse the right subtree (a\
    \ preorder traversal). A preorder traversal of the binary tree in Figure 6.1 on\
    \ the facing page visits the nodes in the following order: `A,B,C,D,E,FG,H,I,J,K,L,M,N,O,P`.\n\
    * Traverse the left subtree, traverse the right subtree, and then visit the root\
    \ (a postorder traversal). A postorder traversal of the binary tree in Figure\
    \ 6.1 on the preceding page visits the nodes in the following order: `D,E,C,H,G,FB,M,L,N,K,J,P,O,I,A`.\n\
    \nLet `T` be a binary tree of `n` nodes, with height `h`. Implemented recursively,\
    \ these traversals have `O(n)` time complexity and `O(h)` additional space complexity.\
    \ (The space complexity is dictated by the maximum depth of the function call\
    \ stack.) If each node has a `parent field`, the traversals can be done with `O(1)`\
    \ additional space complexity.\n\nThe term `tree` is overloaded, which can lead\
    \ to confusion; see Page 75 for an overview of the common variants.\n\n### Binary\
    \ trees boot camp\n\nA good way to get up to speed with binary trees is to implement\
    \ the three basic traversals—inorder, preorder, and postorder.\n\n```python\n\
    def tree_traversal(root):\n    if root:\n        # Preorder: # children. Processes\
    \ the root before the traversals of left and right\n        print ('Preorder:\
    \ %d' % root.data)\n        tree_traversal(root.left)\n        # Inorder: Processes\
    \ the root after the traversal of left child and # before the traversal of right\
    \ child.\n        print('Inorder: %d' % root.data)\n        tree_traversal(root.right)\n\
    \        # Postorder : Processes the root after the traversals of left and right\
    \ # children.\n        print('Postorder: %d' % root.data)\n```\n\nThe time complexity\
    \ of each approach is `O(n)`, where `n` is the number of nodes in the tree. Although\
    \ no memory is explicitly allocated, the function call stack reaches a maximum\
    \ depth of `h`, the height of the tree. Therefore, the space complexity is `O(h)`.\
    \ The minimum value for `h` is `logn` (complete binary tree) and the maximum value\
    \ for `h` is `n` (skewed tree).\n\n`Recursive algorithms` are well-suited to problems\
    \ on trees. Remember to include space implicitly allocated on the `function call\
    \ stack` when doing space complexity analysis. Please read the introduction to\
    \ Chapter 12 if you need a refresher on recursion.\n\nSome tree problems have\
    \ simple brute-force solutions that use `O(n)` space solution, but subtler solutions\
    \ that uses the `existing tree nodes` to reduce space complexity to `O(1)`.\n\n\
    Consider `left- and right-skewed trees` when doing complexity analysis. Note that\
    \ `O(h)` complexity, where `h` is the tree height, translates into `O(logn)` complexity\
    \ for balanced trees, but `O(n)` complexity for skewed trees.\n\nIf each node\
    \ has a `parent field`, use it to make your code simpler, and to reduce time and\
    \ space complexity.\n\nIt’s easy to make the `mistake` of treating a node as a\
    \ `single child`.\n\n### Table 6.1: Tips for Binary Trees\n\nTest if a binary\
    \ tree is height-balanced\n\nA binary tree is said to be height-balanced if for\
    \ each node in the tree, the difference in the height of its left and right subtrees\
    \ is at most one. A perfect binary tree is height-balanced, as is complete binary\
    \ tree—see Figure 6.2 on the next page for an example.\n\nA\nB\nC\nD\nE\nF\nG\n\
    H\nI\nJ\nK\nL\nM\nN\n\n**Figure 6.2:** A height-balanced binary tree of height\
    \ 4.\n\n**Solution:** Here is a brute-force algorithm. Compute the height for\
    \ each node starting from the leaves, and proceeding upwards. For each node, we\
    \ check if the difference in heights of the left and right children is greater\
    \ than one. We can store the heights in a hash table, or in a new field in the\
    \ nodes. This entails `O(n)` storage and `O(n)` time, where `n` is the number\
    \ of nodes of the tree.\n\nWe can solve this problem using less storage by observing\
    \ that we do not need to store the heights of all nodes at the time. Once we are\
    \ done with a subtree, all we need is whether it is heightbalanced, and if so,\
    \ what its height is—we do not need any information about descendants of the subtree’s\
    \ root.\n\n```python\ndef is_balanced_binary_tree(tree):\n    BalancedStatusWithHeight\
    \ = collections.namedtuple('BalancedStatusWithHeight', ('balanced', 'height'))\n\
    \    # First value of the return value indicates if tree is balanced, and if #\
    \ balanced the second value of the return value is the height of tree.\n    def\
    \ check_balanced(tree):\n        if not tree:\n            return BalancedStatusWithHeight(True,\
    \ -1) # Base case.\n        left_result = check_balanced(tree.left)\n        if\
    \ not left_result.balanced:\n            # Left subtree is not balanced.\n   \
    \         return BalancedStatusWithHeight(False, 0)\n        right_result = check_balanced(tree.right)\n\
    \        if not right_result.balanced:\n            # Right subtree is not balanced.\n\
    \            return BalancedStatusWithHeight(False, 0)\n        is_balanced =\
    \ abs(left_result.height - right_result.height) <= 1\n        height = max(left_result.height,\
    \ right_result.height) + 1\n        return BalancedStatusWithHeight(is_balanced,\
    \ height)\n    return check_balanced(tree).balanced\n```\n\nThe program implements\
    \ a postorder traversal with some calls possibly eliminated because of early termination.\
    \ Specifically, if any left subtree is not height-balanced we do not need to visit\
    \ the corresponding right subtree. The function call stack corresponds to a sequence\
    \ of calls from the root through the unique path to the current node, and the\
    \ stack height is therefore bounded by the height of the tree, leading to an `O(h)`\
    \ space bound. The time complexity is the same as that for a postorder traversal,\
    \ namely `O(n)`.\n\n**Variant:** Write a program that returns the size of the\
    \ largest subtree that is complete.\n"
