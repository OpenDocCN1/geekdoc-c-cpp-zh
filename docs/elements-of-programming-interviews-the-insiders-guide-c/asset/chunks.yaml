    \ . . . . . . . . 95\n## 21.2 Compute the maximum product of all entries but one\
    \ . . . . . . . . . . . . . . 96\n## IV Notation and Index 99 \n### Notation 100\n\
    ### Index of Terms 102\n\n## Part I: Data Structures and Algorithms\n### Chapter\
    \ 1 # 1 Primitive Types\n\nRepresentation is the essence of programming.\n\n—\
    \ “The Mythical Man Month,” F. P. Brooks, 1975\n\nA program updates variables\
    \ in memory according to its instructions. Variables come in types—a type is a\
    \ classification of data that spells out possible values for that type and the\
    \ operations that can be performed on it. A type can be provided by the language\
    \ or defined by the programmer. In Python everything is an object—this includes\
    \ Booleans, integers, characters, etc.\n\n### Primitive types boot camp\n\nWriting\
    \ a program to count the number of bits that are set to 1 in an integer is a good\
    \ way to get up to speed with primitive types. The following program tests bits\
    \ one-at-a-time starting with the least-significant bit. It illustrates shifting\
    \ and masking; it also shows how to avoid hard-coding the size of the integer\
    \ word.\n\n```python\ndef count_bits(x):\n    num_bits = 0\n    while x:\n   \
    \     num_bits += x & 1\n        x >>= 1\n    return num_bits\n```\n\nSince we\
    \ perform $O(1)$ computation per bit, the time complexity is $O(n)$, where $n$\
    \ is the number of bits needed to represent the integer, e.g., 4 bits are needed\
    \ to represent 12, which is $(1100)_2$ in binary. The techniques in Solution 1.1\
    \ on the facing page, which is concerned with counting the number of bits modulo\
    \ 2, i.e., the parity, can be used to improve the performance of the program above.\n\
    \n### Know your primitive types\n\nPython has a number of build-in types: numerics\
    \ (e.g., integer), sequences (e.g., list), mappings (e.g., dict), as well as classes,\
    \ instances and exceptions. All instances of these types are objects.\n\nIntegers\
    \ in Python3 are unbounded—the maximum integer representable is a function of\
    \ the available memory. The constant `sys.maxsize` can be used to find the word-size;\
    \ specifically, it’s the maximum value integer that can be stored in the word,\
    \ e.g., $2^{63}-1$ on a 64-bit machine. Bounds on floats are specified in `sys.float_info`.\n\
    \n- Be very familiar with the bit-wise operators such as `6&4`, `1|2`, `8>>1`,\
    \ `-16>>>2`, `1<<10`, `~0`, `15^x`. Negative numbers are treated as their 2’s\
    \ complement value. (There is no concept of an unsigned shift in Python, since\
    \ integers have infinite precision.)\n- Be very comfortable with the **bitwise\
    \ operators**, particularly XOR.\n- Understand how to use **masks** and create\
    \ them in an **machine independent** way.\n- Know fast ways to **clear the lowermost\
    \ set bit** (and by extension, set the lowermost 0, get its index, etc.)\n- Understand\
    \ **signedness** and its implications to **shifting**.\n- Consider using a **cache**\
    \ to accelerate operations by using it to brute-force small inputs.\n- Be aware\
    \ that **commutativity** and **associativity** can be used to perform operations\
    \ in **parallel** and **reorder** operations.\n\n**Table 1.1:** Top Tips for Primitive\
    \ Types\n\n- The key methods for numeric types are `abs(-34.5)`, `math.ceil(2.17)`,\
    \ `math.floor(3.14)`, `min(x,-4)`, `max(3.14, y)`, `pow(2.71, 3.14)` (alternately,\
    \ `2.71 ** 3.14`), and `math.sqrt(225)`.\n- Know how to interconvert integers\
    \ and strings, e.g., `str(42)`, `int('42')`, floats and strings, e.g., `str(3.14)`,\
    \ `float('3.14')`.\n- Unlike integers, floats are not infinite precision, and\
    \ it’s convenient to refer to infinity as `float('inf')` and `float('-inf')`.\
    \ These values are comparable to integers, and can be used to create pseudo max-int\
    \ and pseudo min-int.\n- When comparing floating point values consider using `math.isclose()`—it\
    \ is robust, e.g., when comparing very large values, and can handle both absolute\
    \ and relative differences.\n- The key methods in random are `random.randrange(28)`,\
    \ `random.randint(8,16)`, `random.random()`, `random.shuffle(A)`, and `random.choice(A)`.\n\
    \n### 1.1 Computing the parity of a word\n\nThe parity of a binary word is 1 if\
    \ the number of 1s in the word is odd; otherwise, it is 0. For example, the parity\
    \ of 1011 is 1, and the parity of 10001000 is 0. For example, the parity of 1011\
    \ is 1, and the parity of 10001000 is 0.\n\nHow would you compute the parity of\
    \ a large number? Hint: Use a lookup table.\n\n**Solution:** Since we only care\
    \ if the number of 1s is even or odd, we can use\n\n```python\ndef parity(x):\n\
    \    result = 0\n    while x:\n        result ^= x & 1\n        x >>= 1\n    return\
    \ result\n```\n\nThe time complexity is $O(n)$, where $n$ is the word size.\n\n\
    We will now describe several algorithms that are superior to the brute force algorithm.\
    \ The first improvement is based on erasing the lowest set bit in a word.\n\n\
    ```python\ndef parity(x):\n    result = 0\n    while x:\n        result ^= 1\n\
    \        x &= x - 1 # Drops the lowest set bit of x\n    return result\n```\n\n\
    Let $k$ be the number of bits set to 1 in a particular word. (For example, for\
    \ 10001010, $k=3$.) Then time complexity of the algorithm above is $O(k)$.\n\n\
    The fact that this isolates the lowest bit in x is important enough that you should\
    \ memorize it. However, it is also fairly easy to derive. First, suppose x is\
    \ not 0, i.e., it has a bit that is one. Subtracting one from x changes the rightmost\
    \ bit to zero and sets all the lower bits to one (if you add one now, you get\
    \ the original value back). The effect is to mask out the rightmost one. Therefore\
    \ $x \\& \\sim(x-1)$ has a single bit set to one, namely, the rightmost 1 in x.\
