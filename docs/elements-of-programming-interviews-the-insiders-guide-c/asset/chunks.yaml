    An abstract factory provides an interface for creating families of related objects
    without specifying their concrete classes. For example, a `classDocumentCreator`
    could provide interfaces to create a number of products, such as `createLetter()`
    and `createResume()`. Concrete implementations of this class could choose to implement
    these products in different ways, e.g., with modern or classic fonts, right-flush
    or right-ragged layout, etc. Client code gets a `DocumentCreator` object and calls
    its factory methods. Use of this pattern makes it possible to interchange concrete
    implementations without changing the code that uses them, even at runtime. The
    price for this flexibility is more planning and upfront coding, as well as and
    code that may be harder to understand, because of the added indirections.


    # 20 Common Tools


    UNIX is a general-purpose, multi-user, interactive operating system for the Digital
    Equipment Corporation PDP-11/40 and 11/45 computers. It offers a number of features
    seldom found even in larger operating systems, including: (1) a hierarchical file
    system incorporating demountable volumes; (2) compatible file, device, and inter-process
    I/O; (3) the ability to initiate asynchronous processes; (4) system command language
    selectable on a per-user basis; and (5) over 100 subsystems including a dozen
    languages.


    — “The UNIX TimeSharing System,” [D. R]itchie and [K. T]hompson[, 1974


    The problems in this chapter are concerned with tools: version control systems,
    scripting languages, build systems, databases, and the networking stack. Such
    problems are not commonly asked—expect them only if you are interviewing for a
    specialized role, or if you claim specialized knowledge, e.g., network security
    or databases. We emphasize these are vast subjects, e.g., networking is taught
    as a sequence of courses in a university curriculum. Our goal here is to give
    you a flavor of what you might encounter. Adnan’s Advanced Programming Tools course
    material, available freely online, contains lecture notes, homeworks, and labs
    that may serve as a good resource on the material in this chapter.


    ## Version control


    Version control systems are a cornerstone of software development—every developer
    should understand how to use them in an optimal way.


    ### 20.1 Merging in a version control system


    What is merging in a version control system? Specifically, describe the limitations
    of line-based merging and ways in which they can be overcome.


    **Solution:**


    Modern version control systems allow developers to work concurrently on a personal
    copy of the entire codebase. This allows software developers to work independently.
    The price for this merging: periodically, the personal copies need to be integrated
    to create a new shared version. There is the possibility that parallel changes
    are conflicting, and these must be resolved during the merge.


    By far, the most common approach to merging is text-based. Text-based merge tools
    view software as text. Line-based merging is a kind of text-based merging, specifically
    one in which each line is treated as an indivisible unit. The merging is “three-way”:
    the lowest common ancestor in the revision history is used in conjunction with
    the two versions. With line-based merging of text files, common text lines can
    be detected in parallel modifications, as well as text lines that have been inserted,
    deleted, modified, or moved. Figure 20.1 on the next page shows an example of
    such a line-based merge.


    One issue with line-based merging is that it cannot handle two parallel modifications
    to the same line: the two modifications cannot be combined, only one of the two
    modifications must be selected. A bigger issue is that a line-based merge may
    succeed, but the resulting program is broken because of syntactic or semantic
    conflicts. In the scenario in Figure 20.1 on the facing page the changes made
    by the two developers are made to independent lines, so the line-based merge shows
    no conflicts. However, the program will not compile because a function is called
    incorrectly.


    In spite of this, line-based merging is widely used because of its efficiency,
    scalability, and accuracy. A three-way, line-based merge tool in practice will
    merge 90% of the changed files without any issues. The challenge is to automate
    the remaining 10% of the situations that cannot be merged automatically.


    Text-based merging fails because it does not consider any syntactic or semantic
    information. Syntactic merging takes the syntax of the programming language into
    account. Text-based merge often yields unimportant conflicts such as a code comment
    that has been changed by different developers or conflicts caused by code reformatting.
    A syntactic merge can ignore all these: it displays a merge conflict when the
    merged result is not syntactically correct.


    We illustrate syntactic merging with a small example:


    ```

    if (n%2 == 0) then m = n/2;

    ```


    Two developers change this code in a different ways, but with the same overall
    effect. The first updates it to


    ```

    if (n%2 == 0) then m = n/2 else m = (n-1) /2;

    ```


    and the second developer’s update is `m = n/2;`


    Both changes to the same thing. However, a textual-merge will likely result in
    `m := n div 2 else m := (n-1)/2`

    which is syntactically incorrect. Syntactic merge identifies the conflict; it
    is the integrator’s responsibility to manually resolve it, e.g., by removing the
    `else` portion.


    Syntactic merge tools are unable to detect some frequently occurring conflicts.
    For example, in the merge of Versions 1a and 1b in Figure 20.1 on the next page
    will not compile, since the call to `sum(10)` has the wrong signature. Syntactic
    merge will not detect this conflict since the program is still syntactically correct.
    The conflict is a semantic conflict, specifically, a static semantic conflict,
    since it is detectable at compile-time.


    Technically, syntactic merge algorithms operate on the parse trees of the programs
    to be merged. More powerful semantic merge algorithms have been proposed that
    operate on a graph representation of the programs, wherein definitions and usage
    are linked, making it easier to identify mismatched usage.


    Static semantic merging also has shortcomings. For example, suppose `Point` is
    a class representing 2D points using Cartesian coordinates, and that this class
    has a distance function that returns x². Suppose Alice checks out the project,
    and subclasses `Point` to create a class that supports polar coordinates, and
    uses Points’s distance function to return the radius. Concurrently, Bob checks
    out the project and changes Point’s distance function to return y². Static semantic
    merging reports no conflicts: the merged program compiles without any trouble.
    However the behavior is not what was expected.


    Both syntactic merging and semantic merging greatly increase runtimes, and are
    very limiting since they are tightly coupled to specific programming languages.
    In practice, line-based merging is used in conjunction with a small set of unit
    tests (a “smoke suite”) invoked with a pre-commit hook script. Compilation finds
    syntax and static semantics errors, and the tests (hopefully) identify deeper
    semantic issues.


    ```

    int sum(int n) {

    int total = 0;

    for (int i = 0; i < n; i++) {

    total = total + i;

    }

    return total;

    };

    ```

    Version 1


    ```

    int sum(int n) {

    if (n < 0) {

    return 0;

    }

    int total = 0;

    for (int i = 0; i < n; i++) {

    total += i;

    }

    return total;

    };

    ```

    ...


    ```

    int x = sum(10);

    void sum(int n, int* result) { int total = 0;

    for (int i = 0; i < n; i++) {

    total = total + i;

    }

    *result = total;

    };

    ```

    Version 1a


    Version 1b


    ```

    void sum(int n, int* result) { if (n < 0) {

    return 0;

    }

    int total = 0;

    for (int i = 0; i < n; i++) {

