  trans: "\n如果你的解决方案使用了排序，且排序后执行的计算比排序本身更快（例如 `O(n)` 或 `O(logn)`），**请寻找不需要进行完整排序的解决方案**。\n\
    \n考虑时间/空间权衡，例如对数据进行多次遍历。**表 8.1：搜索高阶技巧**\n\n### 了解你的搜索库\n\n`bisect` 模块为排序列表提供了二分查找函数。具体来说，假设\
    \ `a` 是一个有序列表。\n\n* 要找到第一个不小于目标值的元素，使用 `bisect.bisect_left(a,x)`。该调用返回返回第一个大于或等于目标值的条目的索引。如果列表中的所有元素都小于\
    \ `x`，则返回的值为 `len(a)`。\n* 要找到第一个大于目标值的元素，使用 `bisect.bisect_right(a,x)`。该调用返回第一个大于目标值的条目的索引。如果列表中的所有元素都小于或等于\
    \ `x`，则返回的值为 `len(a)`。\n\n在面试中，如果允许，请使用上述函数，而不是自己实现二分查找。\n\n### [8.1] 在排序数组中查找\
    \ [k] 的首次出现\n\n二分查找通常要求找到排序数组中任何等于指定元素的索引。以下问题在此基础上稍有转折。\n\n**-14 -10 2 108 108\
    \ 243 285 285 285 401**\n\n`A[0] A[1] A[2] A[3] A[4] A[5] A[6] A[7] A[8] A[9]`\n\
    \n**图 8.1：** 一个带有重复元素的有序排序数组。\n\n编写一个方法，接收一个排序数组和一个键（key），并返回该键在数组中首次出现的索引。例如，当应用于图\
    \ 8.1 中的数组时，如果给定的键是 108，你的算法应该返回 3；如果是 285，你的算法应该返回 6。\n\n**提示：** 当每个条目都等于 `k`\
    \ 时会发生什么？不要在第一次看到 `k` 时就停止。\n\n**解决方案：** 一种简单的方法是使用二分查找找到任何等于键 `k` 的元素的索引。（如果\
    \ `k` 不存在，我们只需返回 -1。）找到该元素后，从它向后遍历以找到该元素的首次出现。二分查找耗时 `O(logn)`，其中 `n` 是数组中的条目数量。向后遍历在最坏情况下需要\
    \ `O(n)` 时间——考虑条目等于 `k` 的情况。\n\n二分查找的基本思想是维护一组候选解决方案。对于当前问题，如果我们看到索引为 `i` 的元素等于\
    \ `k`，尽管我们不知道 `i` 是否是第一个等于 `k` 的元素，但我们确切后续的元素都不可能是第一个。因此，我们从候选集中移除所有索引为 `i + 1`\
    \ 或更大的元素。\n\n让我们将上述逻辑应用于给定的示例，假设 `k = 108`。我们从所有索引作为候选开始，即 `[0,9]`。中间点索引 `4` 包含\
    \ `k`。因此我们现在可以将候选集更新为 `[0,3]`，并记录 4 为 `k` 的一次出现位置。下一个中间点是 1，该索引包含 -10。我们将候选集更新为\
    \ `[2,3]`。中间点 `2` 的值是 2，因此我们将候选集更新为 `[3,3]`。由于此中间点的值是 108，我们将首次看到的 `k` 出现位置更新为\
    \ 3。现在区间是 `[3,2]`，它是空的，终止搜索——结果为 3。\n\n```python\ndef search_first_of_k(A, k):\n\
    \    left, right, result = 0, len(A) - 1, -1\n    # A[left:right + 1] 是候选集.\n\
    \    while left <= right:\n        mid = (left + right) // 2\n        if A[mid]\
    \ > k:\n            right = mid - 1\n        elif A[mid] == k:\n            result\
    \ = mid\n            right = mid - 1 # mid 的右侧没有任何元素可以作为解。\n        else: # A[mid]\
    \ < k.\n            left = mid + 1\n    return result\n```\n\n复杂度界限仍然 `O(logn)`——这是因为每次迭代将候选集的大小减少了一一半。\n\
    \n**变体：** 设计一种高效算法，接收一个排序数组和一个键，并找到大于该键的元素的首次出现索引。例如，当应用于图 8.1 中的数组时，如果键是 285，你的算法应该返回\
    \ 9；如果是 -13，你的算法应该返回 1。\n\n**变体：** 令 `A` 为包含 `n` 个整数的未排序数组，满足 `A[0] >= A[1]` 且\
    \ `A[n-2] <= A[n-1]`。如果 `A[i]` 小于或等于它的相邻元素，则称索引 `i` 为局部最小值。如果存在局部最小值，你如何高效地找到它？\n\
    \n**变体：** 编写一个程序，接收整数排序数组 `A` 和整数 `k`，并返回包含 `k` 的区间，即整数对 `L` 和 `U`，使得 `L` 是 `k`\
    \ 在 `A` 中的首次出现，`U` 是 `k` 在 `A` 中的最后一次出现。如果 `k` 不在 `A` 中，返回 `[-1,-1]`。例如，...\n\n\
    # 9 哈希表\n...（其余文本遵循相似逻辑）\n"
- fmt: "\nNow we illustrate the steps for designing a hash function suitable for strings.\
    \ First, the hash function should examine all the characters in the string. It\
    \ should give a large range of values, and should not let one character dominate\
    \ (e.g., if we simply cast characters to integers and multiplied them, a single\
    \ 0 would result in a hash code of 0). We would also like a rolling hash function,\
    \ one in which if a character is deleted from the front of the string, and another\
    \ added to the end, the new hash code can be computed in `O(1)` time. The following\
    \ function has these properties:\n\n```python\ndef string_hash(s, modulus):\n\
    \    MULT = 997\n    return functools.reduce(lambda v, c: (v * MULT + ord(c))\
    \ % modulus , s, 0)\n```\n\nA hash table is a good data structure to represent\
    \ a dictionary, i.e., a set of strings. In some applications, a `trie`, which\
    \ is a tree data structure that is used to store a dynamic set of strings, has\
    \ computational advantages. Unlike a `BST`, nodes in the tree do not store a key.\
    \ Instead, the node’s position in the tree defines the key which it is associated\
    \ with.\n\n## Hash tables boot camp\n\nWe introduce hash tables with two examples—one\
    \ is an application that benefits from the algorithmic advantages of hash tables,\
    \ and the other illustrates the design of a class that can be used in a hash table.\n\
    \n### An application of hash tables\n\nAnagrams are popular word play puzzles,\
