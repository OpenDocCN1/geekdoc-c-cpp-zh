    \ (next_element, smallest_array_i))\n    return result\n\n# Pythonic 解决方案，使用了接受多个输入的\
    \ heapq.merge() 方法。\ndef merge_sorted_arrays_pythonic(sorted_arrays):\n    return\
    \ list(heapq.merge(*sorted_arrays))\n```\n\n设 `k` 为输入序列的数量。那么最小顶堆中的元素最多有 `k` 个。`extract-min`\
    \ 和 `insert` 操作均需要 `O(logk)` 时间。因此，我们可以在 `O(nlogk)` 时间内完成合并。除了写入最终结果所需的空间外，空间复杂度为\
    \ `O(k)`。特别是，如果数据来自文件并写入文件而不是数组，我们只需要 `O(k)` 的额外存储。\n\n或者，我们可以使用 `merge sort`\
    \ 中的合并步骤，每次两个地递归地合并 `k` 个文件。文件数量从 `k` 减少到 `k/2`，然后是 `k/4` 等。这会有 `logk` 个阶段，每个阶段的时间复杂度为\
    \ `O(n)`，因此时间复杂度与基于堆的方法相同，即 `O(nlogk)`。任何合理的 `merge sort` 实现，其空间复杂度最终将是 `O(n)`，当\
    \ `k << n` 时，这远差于基于堆的方法。\n\n# 8 搜索\n\n![](img/00001.gif) — “The Anatomy of A Large-Scale\
    \ Hypertextual Web Search Engine,” S. M. Brin and L. P. Page, 1998\n\n搜索算法可以有多种分类方式。底层集合是静态的还是动态的（即插入和删除与搜索交替进行）？是否值得花费计算成本对数据进行预处理以加速后续查询？数据是否存在可以利用的统计属性？我们应该直接在数据上操作还是对其进行转换？\n\
    \n在本章中，我们的重点是存储在数组中并有序排列的静态数据。适用于动态更新的数据结构是第 7、9 和 11 章的主题。\n\n本章的第一组问题与二分查找有关。第二组问题涉及通用搜索。\n\
    \n## 二分查找\n\n给定一个包含 `n` 个键的任意集合，确定搜索键存在的唯一方法是检查每个元素。这具有 `O(n)` 的时间复杂度。从根本上说，二分查找是针对排序数组的一种自然的基于消除的搜索策略。其思想是通过保持键的有序排列来排除掉一半的键。如果搜索键不等于数组的中间元素，则可以将中间元素左侧或右侧的两组键中的一组从后续考虑中排除。\n\
    \n基于二分查找的问题是面试的理想选择：候选人应该掌握这种基础技术，它可以用几行代码实现。另一方面，二分查找的实现比看起来的要复杂。\n\n```python\n\
    def bsearch(t, A):\n    L, U = 0, len(A) - 1\n    while L <= U:\n        M = (L\
    \ + U) // 2\n        if A[M] < t:\n            L = M + 1\n        elif A[M] ==\
    \ t:\n            return M\n        else:\n            U = M - 1\n    return -1\n\
    ```\n\n二分查找的时间复杂度由 `T(n) = T(n/2) + c`给出，其中 `c` 是常数。这解得 `O(logn)`，远优于键无序时所需的 `O(n)`\
    \ 方法。二分查找的缺点是它需要排序数组，而排序数组需要 `O(nlogn)` 时间。然而，如果有大量的搜索，排序的时间并不是问题。\n\n## 搜索训练营\n\
    \n当对象可比较时，可以使用库函数进行排序和搜索。通常语言知道如何比较内置类型，例如整数、字符串、日期类、SQL 时间戳。然而，用于排序集合的自定义类型必须实现比较，并确保比较具有传递性等基本属性。（如果比较实现错误，可能会发现即使项存在查找也会失败。）\n\
    \n假设输入是一个按 GPA 降序排列的学生数组，并用名称比较。在下面的程序中，我们展示了如何使用库二分查找例程对该数组进行快速搜索。特别是，我们为二分查找传递了一个自定义比较器，按\
    \ GPA 比较学生（高 GPA 优先），并在相同时比较名称。\n\n```python\nStudent = collections.namedtuple('Student',\
    \ ('name', 'grade_point_average'))\n\ndef comp_gpa(student):\n    return (-student.grade_point_average,\
    \ student.name)\n\ndef search_student(students, target, comp_gpa):\n    i = bisect.bisect_left([comp_gpa(s)\
    \ for s in students], comp_gpa(target))\n    return 0 <= i < len(students) and\
    \ students[i] == target\n```\n\n假设序列中的第 `i` 个元素可以在 `O(1)` 时间访问，程序的时间复杂度为 `O(logn)`。\n\
    \n**二分查找**是一种有效的搜索工具。它不仅适用于搜索**排序数组**，例如，它可以用于搜索**实数或整数区间**。\n\n"
