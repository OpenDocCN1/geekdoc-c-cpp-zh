    as well. Hence, a placement exists for any n that is a power of 2\. In particular,
    a placement exists for the 2^(3×) 2³ Mboard; the recursion used in the proof directly
    yields the placement.


    12.1 Generate the power set


    The power set of a set S is the set of all subsets of S, including both the empty
    set^∅ and S itself. The power set of^{0,1,2^} is graphically illustrated in Figure
    12.2 on the next page.


    Write a function that takes as input a set and returns its power set.


    Hint: There are 2^n subsets for a given set S of size n. There are 2^k k-bit words.


    **Solution:** A brute-force way is to compute all subsets U that do not include
    a particular element (which could be any single element). Then we compute all
    subsets V which do include that element. Each subset set must appear inUor inV,
    so the final result is justU^∪V. The construction is recursive, and the base case
    is when the input set is empty, in which case we return^({{}}).


    Recursion is especially suitable when the **input is expressed using recursive
    rules** such as a computer grammar.


    Recursion is a good choice for **search**, **enumeration**, and **divide-and-conquer**.


    Use recursion as **alternative to deeply nested iteration** loops. For example,
    recursion is much better when you have an undefined number of levels, such as
    the IP address problem generalized to k substrings.


    If you are asked to **remove recursion** from a program, consider mimicking call
    stack with the **stack data structure**.


    Recursion can be easily removed from a **tail-recursive** program by using a while-loop—no
    stack is needed. (Optimizing compilers do this.)


