    # **10 Sorting**


    PROBLEM 14 (Meshing). Two monotone sequences S, T, of lengths n, m, respectively,
    are stored in two systems of n(p + 1), m(p + 1) consecutive memory locations,
    respectively: s,s + 1, . . . ,s + n(p + 1)^− 1 and t,t + 1, . . . ,t + m(p + 1)^−
    1\. . . . It is desired to find a monotone permutation R of the sum [S,T], and
    place it at the locations r,r + 1, . . . ,r + (n + m)(p + 1)^− 1.


    — “Planning And Coding Of Problems For An Electronic Computing Instrument,” [H.
    H. G]oldstine and [J.] von [N]eumann[, 1948]


    Sorting—rearranging a collection of items into increasing or decreasing order—is
    a common problem in computing. Sorting is used to preprocess the collection to
    make searching faster (as we saw with binary search through an array), as well
    as identify items that are similar (e.g., students are sorted on test scores).


    Naive sorting algorithms run in^O(n²) time. A number of sorting algorithms run
    in^O(nlogn) time—heapsort, merge sort, and quicksort are examples. Each has its
    advantages and disadvantages: for example, heapsort is in-place but not stable;
    merge sort is stable but not in-place; quicksort runs^O(n²) time in worst-case.
    (An in-place sort is one which uses^O(1) space; a stable sort is one where entries
    which are equal appear in their original order.)


    A well-implemented quicksort is usually the best choice for sorting. We briefly
    outline alternatives that are better in specific circumstances.


    For short arrays, e.g., 10 or fewer elements, insertion sort is easier to code
    and faster than asymptotically superior sorting algorithms. If every element is
    known to be at most k places from its final location, a min-heap can be used to
    get an^O(nlogk) algorithm. If there are a small number of distinct keys, e.g.,
    integers in the range [0..255], counting sort, which records for each element,
    the number of elements less than it, works well. This count can be kept in an
    array (if the largest number is comparable in value to the size of the set being
    sorted) or a BST, where the keys are the numbers and the values are their frequencies.
    If there are many duplicate keys we can add the keys to a BST, with linked lists
    for elements which have the same key; the sorted result can be derived from an
    in-order traversal of the BST.


    Most sorting algorithms are not stable. Merge sort, carefully implemented, can
    be made stable. Another solution is to add the index as an integer rank to the
    keys to break ties.


    Most sorting routines are based on a compare function. However, it is also possible
    to use numerical attributes directly, e.g., in radix sort.'
