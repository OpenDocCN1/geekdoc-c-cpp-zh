- fmt: "\nA deque, also sometimes called a double-ended queue, is a doubly linked\
    \ list in which all insertions and deletions are from one of the two ends of the\
    \ list, i.e., at the head or the tail. An insertion to the front is commonly called\
    \ a `push`, and an insertion to the back is commonly called an `inject`. A deletion\
    \ from the front is commonly called a `pop`, and a deletion from the back is commonly\
    \ called an `eject`. (Different languages and libraries may have different nomenclature.)\n\
    \n### Queues boot camp\n\nIn the following program, we implement the basic queue\
    \ API—`enqueue` and `dequeue`—as well as a `max`-method, which returns the maximum\
    \ element stored in the queue. The basic idea is to use composition: add a private\
    \ field that references a library queue object, and forward existing methods (`enqueue`\
    \ and `dequeue` in this case) to that object.\n\n```python\nclass Queue:\n   \
    \ def __init__(self):\n        self._data = []\n\n    def enqueue(self, x):\n\
    \        self._data.append(x)\n\n    def dequeue(self):\n        return self._data.pop(0)\n\
    \n    def max(self):\n        return max(self._data)\n```\n\nThe time complexity\
    \ of `enqueue` and `dequeue` are the same as that of the library queue, namely,\
    \ `O(1)`. The time complexity of finding the maximum is `O(n)`, where `n` is the\
    \ number of entries. Learn to recognize when the queue FIFO property is applicable.\
    \ For example, queues are ideal when order needs to be preserved.\n\n**Table 5.2:**\
    \ Top Tips for Queues\n\n### Know your queue libraries\n\nSome of the problems\
    \ require you to implement your own queue class; for others, use the `collections.deque`\
    \ class.\n\n* `q.append(e)` pushes an element onto the queue. Not much can go\
    \ wrong with a call to `push`.\n* `q[0]` will retrieve, but not remove, the element\
    \ at the front of the queue. Similarly, `q[-1]` will retrieve, but not remove,\
    \ the element at the back of the queue.\n* `q.popleft()` will remove and return\
    \ the element at the front of the queue. Dequeing or accessing the head/tail of\
    \ an empty collection results in an `IndexError` exception being raised.\n\n###\
    \ [5.2] Compute binary tree nodes in order of increasing depth\n\nBinary trees\
    \ are formally defined in Chapter 6. In particular, each node in a binary tree\
    \ has a depth, which is its distance from the root.\n\nGiven a binary tree, return\
    \ an array consisting of the keys at the same level. Keys should appear in the\
    \ order of the corresponding nodes’ depths, breaking ties from left to right.\
    \ For example, you should return `314, 6,6, 271,561,2,271, 28,0,3,1,28, 17,401,257,\
    \ 641` for the binary tree in Figure 6.1 on Page 28. \n\n**Hint:** First think\
    \ about solving this problem with a pair of queues.\n\n**Solution:** A brute force\
    \ approach might be to write the nodes into an array while simultaneously computing\
    \ their depth. We can use preorder traversal to compute this array—by traversing\
    \ a node’s left child first we can ensure that nodes at the same depth are sorted\
    \ from left to right. Now we can sort this array using a stable sorting algorithm\
    \ with node depth being the sort key. The time complexity is dominated by the\
    \ time taken to sort, i.e., `O(nlogn n)`, and the space complexity is `O(n)`,\
    \ which is the space to store the node depths.\n\nIntuitively, since nodes are\
    \ already presented in a somewhat ordered fashion in the tree, it should be possible\
    \ to avoid a full-blow sort, thereby reducing time complexity. Furthermore, by\
    \ processing nodes in order of depth, we do not need to label every node with\
    \ its depth.\n\nIn the following, we use a queue of nodes to store nodes at depth\
    \ `i` and a queue of nodes at depth `i + 1`. After all nodes at depth `i` are\
    \ processed, we are done with that queue, and can start processing the queue with\
    \ nodes at depth `i + 1`, putting the depth `i + 2` nodes in a new queue.\n\n\
    ```python\ndef binary_tree_depth_order(tree):\n    result, curr_depth_nodes =\
    \ [], collections.deque([tree])\n    while curr_depth_nodes:\n        next_depth_nodes,\
    \ this_level = collections.deque([]), []\n        while curr_depth_nodes:\n  \
    \          curr = curr_depth_nodes.popleft()\n            if curr:\n         \
    \       this_level.append(curr.data)\n                # Defer the null checks\
    \ to the null test above. next_depth_nodes += [curr.left, curr.right]\n      \
    \  if this_level:\n            result.append(this_level)\n        curr_depth_nodes\
    \ = next_depth_nodes\n    return result\n```\n\nSince each node is enqueued and\
    \ dequeued exactly once, the time complexity is `O(n)`. The space complexity is\
    \ `O(m)`, where `m` is the maximum number of nodes at any single depth.\n\n**Variant:**\
    \ Write a program which takes as input a binary tree and returns the keys in top\
    \ down, alternating left-to-right and right-to-left order, starting from left-to-right.\
    \ For example, if the input is the tree in Figure 6.1 on the following page, your\
    \ program should return `314, 6,6, 271,561,2,271, 28,1,3,0,28, 17,401,257, 641`.\n\
    \n**Variant:** Write a program which takes as input a binary tree and returns\
    \ the keys in a bottom up, left-to-right order. For example, if the input is the\
    \ tree in Figure 6.1 on the next page, your program should return `314, 6,6, 271,561,2,271,\
    \ 28,1,3,0,28, 17,401,257, 641`.\n"
