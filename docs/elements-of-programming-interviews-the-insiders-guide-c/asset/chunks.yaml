  trans: "\n\n某些问题需要`BST 与哈希表的结合`。例如，如果你将学生对象插入到 `BST` 中并按 `GPA` 排序，当需要更新某个学生的 `GPA`\
    \ 而我们又只知道该学生的名字和新的 `GPA` 时，在不进行全遍历的情况下，我们无法通过名字找到该学生。然而，如果有一个额外的哈希表，我们可以直接访问树中对应的条目。\n\
    \n`BST` 属性是一个`全局属性`——一个二叉树可能具有这种属性，即每个节点的键大于其左子节点的键且小于其右子节点的键，但它可能并不是一个 `BST`。\n\
    \n表 11.1：二叉搜索树的顶级技巧\n\n### 了解你的二叉搜索树库\n\n本章中的某些问题涉及编写一个 `BST` 类；对于另一些问题，你可以使用\
    \ `BST` 库。Python 没有内置的 `BST` 库。\n\n`sortedcontainers` 模块是排序集合和排序字典的顶级模块——它性能优异，拥有清晰且文档完备的\
    \ API，社区活跃。其底层数据结构是排序列表的排序列表。由于 `inserts` 和 `deletes` 操作涉及向长度约为 `n` 的列表中进行插入，其渐近时间复杂度为\
    \ `O(n)`，而不是平衡 `BSTs` 的 `O(log n)`。在实践中，这并不是问题，因为 CPU 对块数据移动进行了高度优化。\n\n出于教学考虑，我们选择了使用\
    \ `bintrees` 模块，它使用平衡 `BSTs` 实现排序集合和排序字典。然而，在我们任何使用 `bintrees` 的地方，任何合理的面试官都应该接受\
    \ `sortedcontainers`。\n\n下面我们描述了 `bintrees` 添加的功能。\n\n* `insert(e)` 在 `BST` 中插入新元素\
    \ `e`。\n* `discard(e)` 如果 `BST` 中存在 `e`，则将其移除。\n* `min_item()`/`max_item()` 返回\
    \ `BST` 中最小和最大的键值对。\n* `min_key()`/`max_key()` 返回 `BST` 中最小和最大的键。\n* `pop_min()`/`pop_max()`\
    \ 并返回 `BST` 中最小和最大的键值对。\n\n特别需要注意的是，这些操作的时间复杂度为 `O(log n)`，因为它们由底层的树支持。\n\n以下程序演示了\
    \ `bintrees` 的用法。\n\n```\nt = bintrees.RBTree([(5, ’Alfa’), (2, ’Bravo ’), (7,\
    \ ’Charlie ’), (3, ’Delta ’), (6, ’Echo’)])\nprint(t[2]) # ’Bravo ’\nprint(t.min_item\
    \ (), t.max_item ()) # (2, ’Bravo ’), (7, ’Charlie ’)\n# {2: ’Bravo ’, 3: ’Delta\
    \ ’, 5: ’Alfa ’, 6: ’Echo ’, 7: ’Charlie ’, 9: ’Golf ’} t.insert(9, ’Golf’)\n\
    print(t)\nprint(t.min_key (), t.max_key ()) # 2, 9\nt.discard (3)\nprint(t) #\
    \ {2: ’Bravo ’, 5: ’Alfa ’, 6: ’Echo ’, 7: ’Charlie ’, 9: ’Golf ’}\n# a = (2:\
    \ ’Bravo ’)\na = t.pop_min ()\nprint(t) # {5: ’Alfa ’, 6: ’Echo ’, 7: ’Charlie\
    \ ’, 9: ’Golf ’}\n# b = (9, ’Golf ’)\nb = t.pop_max ()\nprint(t) # {5: ’Alfa ’,\
    \ 6: ’Echo ’, 7: ’Charlie ’}\n```\n\n### 11.1 测试二叉树是否满足 BST 属性\n\n编写一个程序，输入一个二叉树并检查该树是否满足\
    \ `BST` 属性。提示：检查每个节点的键是否大于或等于其左子节点的键且小于或等于其右子节点的键是正确的吗？\n\n**解：** 一基于 `BST` 定义的直接方法是从根节点开始，计算根节点左子树存储的最大键以及右子树的最小键。我们检查根节点的键是否大于或等于左子树的最大值且小于或等于右子树的最小值。如果这两项检查都通过，则递归地检查根节点的左、右子树。如果任何一个检查失败，则返回\
    \ false。\n\n在二叉树中计算最小键是简单的：我们取根节点存储的键、左子树的最小键以及右子树的最小键中的最小值。最大键的计算方式类似。注意，最小值可以在任何子树中，因为通用二叉树可能不满足\
    \ `BST` 属性。\n\n这种方法的问题在于它会反复遍历子树。在最坏情况下，当树是一个 `BST` 且每个节点的左节点为空时，复杂度为 `O(n²)`，其中\
    \ `n` 是节点数。通过在每个节点缓存最大最小键，可以将复杂度提高到 `O(n)`；这需要 `O(n)` 的额外存储空间。\n\n现在给出两种时间复杂度为\
    \ `O(n)` 的方法。\n\n第一种方法是检查每个子树的值。初始约束来自根节点。其左（右）子树中的每个节点键必须小于或等于（大于或等于）根节点的键。这个想法可以推广：如果树中的所有节点键必须在\
    \ `[l, u]` 范围内，那么……（文本继续逻辑）\n\n```python\ndef is_binary_tree_bst(tree, low_range=float(’inf’),\
    \ high_range=float(’inf’)):\n    if not tree:\n        return True\n    elif not\
    \ low_range <= tree.data <= high_range:\n        return False\n    return (is_binary_tree_bst(tree.left,\
    \ low_range, tree.data) and\n            is_binary_tree_bst(tree.right, tree.data,\
    \ high_range))\n```\n\n"
- fmt: "\nFor the example in Figure 11.1 on Page 55, we initialize the queue with\
    \ `(A,[−∞,∞])`. Each time we pop a node, we first check the constraint. We pop\
    \ the first entry, `(A,[^(−∞),^∞])`, and add its children, with the corresponding\
    \ constraints, i.e., `(B,[^(−∞),19])` and `(I,[19,^∞])`. Next we pop `(B,[^(−∞),19])`,\
    \ and add its children, i.e., `(C,[^(−∞),7])` and `(D,[7,19])`. Continuing through\
    \ the nodes, we check that all nodes satisfy their constraints, and thus verify\
    \ the tree is a BST.\n\nIf the BST property is violated in a subtree consisting\
    \ of nodes within a particular depth, the violation will be discovered without\
    \ visiting any nodes at a greater depth. This is because each time we enqueue\
    \ an entry, the lower and upper bounds on the node’s key are the tightest possible.\n\
    \n```\ndef is_binary_tree_bst(tree):\n    QueueEntry = collections.namedtuple(’QueueEntry\
    \ ', (’node’, ’lower ', ’upper '))\n    bfs_queue = collections.deque([QueueEntry(tree\
    \ , float(’-inf’), float(’inf’))])\n    while bfs_queue:\n        front = bfs_queue.popleft\
    \ ()\n        if front.node:\n            if not front.lower <= front.node.data\
    \ <= front.upper:\n                return False\n            bfs_queue += [\n\
    \                QueueEntry(front.node.left , front.lower , front.node.data),\
    \ \n                QueueEntry(front.node.right , front.node.data , front.upper)\n\
    \            ]\n    return True\n```\n\nThe time complexity is $O(n)$, and the\
    \ additional space complexity is $O(n)$.\n\n# 12 Recursion\n\nThe power of recursion\
    \ evidently lies in the possibility of defining an infinite set of objects by\
    \ a finite statement. In the same manner, an infinite number of computations can\
    \ be described by a finite recursive program, even if this program contains no\
    \ explicit repetitions.\n\n— “Algorithms + Data Structures = Programs,” N. E.\
    \ Wirth, 1976\n\nRecursion is an approach to problem solving where the solution\
    \ depends partially on solutions to smaller instances of related problems. It\
    \ is often appropriate when the input is expressed using recursive rules, such\
    \ as a computer grammar. More generally, searching, enumeration, divide-and-conquer,\
    \ and decomposing a complex problem into a set of similar smaller instances are\
    \ all scenarios where recursion may be suitable.\n\nA recursive function consists\
    \ of base cases and calls to the same function with different arguments. Two key\
    \ ingredients to a successful use of recursion are identifying the base cases,\
    \ which are to be solved directly, and ensuring progress, that is the recursion\
    \ converges to the solution.\n\nBoth backtracking and branch-and-bound are naturally\
    \ formulated using recursion. **Recursion boot camp**\n\nThe Euclidean algorithm\
    \ for calculating the greatest common divisor (GCD) of two numbers is a classic\
    \ example of recursion. The central idea is that if `y> x`, the GCD of `x` and\
    \ `y` is the GCD of `x` and `y− x`. For example, `GCD(156,36) = GCD((156− 36)\
    \ = 120,36)`. By extension, this implies that the GCD of `x` and `y` is the GCD\
    \ of `x` and `y mod x`, i.e., `GCD(156,36) = GCD((156 mod 36) = 12,36) = GCD(12,36\
    \ mod 12 = 0) = 12`.\n\n```python\ndef gcd(x, y):\n    return x if y == 0 else\
    \ gcd(y, x % y)\n```\n\nSince with each recursive step one of the arguments is\
    \ at least halved, it means that the time complexity is $O(\\log \\max(x, y))$.\
    \ Put another way, the time complexity is $O(n)$, where $n$ is the number of bits\
    \ needed to represent the inputs. The space complexity is also $O(n)$, which is\
    \ the maximum depth of the function call stack. (The program is easily converted\
    \ to one which loops, thereby reducing the space complexity to $O(1)$.)\n\nNow\
    \ we describe a problem that can be elegantly solved using a recursive divide-and-conquer\
