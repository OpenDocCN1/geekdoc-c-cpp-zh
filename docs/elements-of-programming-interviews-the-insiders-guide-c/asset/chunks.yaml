  trans: "\n首先我们演示缓存技术。显然，我们无法缓存每个 64 位整数的奇偶性——我们需要 `2⁶⁴` 位的存储空间，这数量级高达十万艾字节（exabytes）。然而，在计算一组位数的奇偶性时，我们如何分组这些位并不重要，即该计算具有结合律。因此，我们可以通过将\
    \ 64 位整数的位分为四个互不重叠的 16 位子字，计算每个子字的奇偶性，然后计算这四个中间结果的奇偶性来得到其奇偶性。我们选择 16 是因为 `2¹⁶\
    \ = 65536` 较小，这使得使用数组缓存所有 16 位字的奇偶性变得可行。此外，由于 16 能整除 64，这比我们使用 10 位子字时代码要简单得多。\n\
    \n我们通过一个 2 位字的查找表来说明这种方法。缓存为 `0,1,1,0`——这些分别是 `(00)`、`(01)`、`(10)` 和 `(11)` 的奇偶性。要计算\
    \ `(11001010)` 的奇偶性，我们需要计算 `(11)`、`(00)`、`(10)` 和 `(10)` 的奇偶性。通过查表我们发现它们分别是 `0,0,1,1`，因此最终结果是\
    \ `0,0,1,1` 的奇偶性，即 `0`。\n\n为了查找 `(11101010)` 中前两个位的奇偶性，我们右移 6 位得到 `(00000011)`，并将其作为缓存的索引。要查找后续两个位的奇偶性，即\
    \ `(10)`，我们将其右移 4 位，在两个最低位处得到 `(10)`。右移并没有移除开头的 `(11)`——结果的结果是 `(00001110)`。我们无法用此值作为缓存索引，这会导致越界访问。为了获取右移\
    \ 4 位后的最后两个位，我们将 `(00001110)` 与 `(00000011)` 进行按位与运算（这是用于提取最后 2 位的“掩码”）。结果是 `(00000010)`。另外两个\
    \ 2 位查找也需要类似的掩码操作。\n\n```python\ndef parity(x):\n    MASK_SIZE = 16\n    BIT_MASK\
    \ = 0xFFFF\n    return (PRECOMPUTED_PARITY[x >> (3 * MASK_SIZE)] ^\n         \
    \   PRECOMPUTED_PARITY [(x >> (2 * MASK_SIZE)) & BIT_MASK] ^\n            PRECOMPUTED_PARITY\
    \ [(x >> MASK_SIZE) & BIT_MASK] ^\n            PRECOMPUTED_PARITY[x & BIT_MASK\
    \ ])\n```\n\n时间复杂度取决于用于索引查找表的键的大小。令 `L` 为我们缓存结果的字宽，`n` 为字长。由于有 `n/L` 项，在假设字级操作（如移位）花费\
    \ `O(1)` 时间的情况下，时间复杂度为 `O(n/L)`。（这不包括初始化查找表的时间。）\n\n我们可以通过利用奇偶性的某些简单属性来改进之前算法\
    \ `O(n)` 最坏情况的时间复杂度。具体来说，两个位的异或（XOR）定义为：如果两个位均为 0 或均为 1，则为 0；否则为 1。`XOR` 具有结合律，即位的分组方式并不重要；具有交换律，即执行异或的顺序不影响结果。一组位的异或即为它们的奇偶性。我们可以利用这一点，使用\
    \ CPU 的字级异或指令一次处理多个位。例如，`b[63],b[62],...b[3],b[2],b[1],b[0]` 的奇偶性等于 `b[63],b[62],...b[32]`\
    \ 和 `b[31],b[30],...b[0]` 的异或。这两个 32 位值的异或可以通过一次移位和一个 32 位异或指令完成计算。对 32、16、8、4、2\
    \ 和 1 位操作重复相同的操作以得到最终结果。注意，领先位没有意义，我们必须从最低位显式提取结果。\n\n我们用一个 8 位字来演示这种方法。`(11011011)`\
    \ 的奇偶性等同于 `(1101)` 异或 `(0111)` 的奇偶性，即 `(1010)`。这又等同于 `(10)` 异或 `(10)` 的奇偶性，即 `(00)`。最终结果是\
    \ `(0)` 异或 `(0)`，即 `0`。注意，第一次异或得到 `(11011010)`，后续只有最后 4 位是有效的。第二次异或得到 `(11101100)`，只有最后\
    \ 2 位是有效的。第三次异或得到 `(10011010)`。最后一位是结果，为了提取它，我们必须与 `(0000)` 进行按位与。\n\n```python\n\
