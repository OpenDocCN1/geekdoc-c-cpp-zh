  \ 最短路径算法`和`最小生成树`都是适用于优化问题的图算法示例。\n\n**表 15.1:** 图算法的顶级技巧\n\n## 图搜索\n\n计算从其他顶点可达的顶点是一项基本操作，可以通过两种惯用方法之一执行，即深度优先搜索\
  \ (`DFS`) 和广度优先搜索 (`BFS`)）。两者的时间复杂度都是线性的——确切地说是 $O(|V|+|E|)$。在最坏情况下，存在一条从初始顶点覆盖所有顶点且不重复的路径，`DFS`\
  \ 选定的边对应于这条路径，因此 `DFS` 的空间复杂度为 $O(|V|)$（该空间隐式地分配在函数调用堆栈上）。`BFS` 的空间复杂度也是 $O(|V|)$，因为在最坏情况下，存在从初始顶点到所有剩余顶点的边，这意味着它们在某个时刻会同时位于\
  \ BFS 队列中。\n\n`DFS` 和 `BFS` 的区别在于它们提供的额外信息，例如，`BFS` 可用于计算从起始顶点的距离，而 `DFS` 可用于检查环的存在。`DFS`\
  \ 中的关键概念包括顶点的发现时间和完成时间。\n\n### [15.1 P] 涂色布尔矩阵\n\n设 `A` 为一个编码黑白图像的布尔二维数组。条目 `A(a,b)`\
