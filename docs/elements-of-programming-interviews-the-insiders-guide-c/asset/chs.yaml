  \ `|T− (A[p] + A[q] + A[r])|`，且满足 `A[p]^≤ A[r]^≤ A[s]`。\n\n**变体：** 编写一个程序，输入整数数组\
  \ `A` 和整数 `T`，并返回三元组 `(p,q,r)` 的数量，使得 `A[p] + A[q] + A[r]^≤ T` 且满足 `A[p]^≤ A[q]^≤\
