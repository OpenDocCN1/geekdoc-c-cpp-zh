  \n— “协作的顺序进程，” E. W. Dijkstra, 1965\n\n并行计算已变得普遍。例如，笔记本电脑和台式电脑配备了多个通过共享内存通信的处理器。高端计算通常使用由通过网络通信的独立计算机组成的集群完成。\n\
  \n并行性提供了许多优势：\n\n- 高性能——更多处理器处理某项任务（通常）意味着任务完成得更快。\n- 更好的资源利用——当一个程序等待磁盘或网络时，另一个程序可以执行。\n\
  - 公平性——让不同的用户或程序共享一台机器，而不是让一个程序一次运行到结束。\n- 便捷性——在概念上，使用一组并发程序处理子任务通常比让单一个程序管理所有子任务要简单直观得多。\n\
  - 容错性——如果提供网页的集群中某台机器发生故障，其他机器可以接管。\n\n并行计算的具体应用包括图形用户界面 (GUI)（一个专用线程处理 UI 操作，而其他线程例如正忙于进行网络通信并将结果传递给\
  \ UI 线程，从而提高了响应速度）、Java 虚拟机（一个单独线程处理垃圾回收，否则会导致阻塞，而另一个线程忙于运行用户代码）、Web 服务器（单个逻辑线程处理单个客户端请求）、科学计算（大型矩阵乘法可以分布在集群中）以及网络搜索（多台机器爬取、索引和检索网页）。\n\
  \n并行计算的两种主要模型是共享内存模型（其中每个处理器都可以访问内存中的任何位置）和分布式内存模型（其中处理器必须显式地向另一个处理器发送消息以访问其内存）。前者在多核设置下更合适，后者对于集群更为准确。本章的问题集中在共享内存模型。\n\
  \n编写正确的并行程序是具有挑战性的，因为并行组件之间存在微妙的相互作用。关键挑战之一是竞态（races）两个并发指令序列访问内存中的相同地址，且至少其中一个写入该地址。其他影响正确性的挑战还有：\n\
  \n- 饥饿（处理器需要某种资源但永远得不到），\n- 死锁（`Thread A` 获取了 `Lock L1`，`Thread B` 获取了 `Lock L2`，随后\
  \ `A` 尝试获取 `L2` 而 `B` 尝试获取 `L1`），\n- 活锁（处理器不断重试一个总是失败的操作）。\n\n这些问题引起的 Bug 很难通过测试发现。调试它们也很困难，因为可能是不可复现的。通常情况下也无法实现并行所暗示的性能——某些关键任务无法并行化，无论有多少个处理器。同样，处理器之间通信结果的开销可能会超过性能收益。\n\
  \n## 并行计算训练营\n\n信号量是一种非常强大的同步机制。概念上，信号量维护一组许可。调用信号量 `acquire()` 的线程在必要时会等待直到许可可用，然后获取它。调用信号量\
  \ `release()` 的线程增加一个许可并通知等待等待的获取者。\n\n```python\nimport threading\n\nclass Semaphore\
  \ ():\n    def __init__(self, max_available):\n        self.cv = threading.Condition()\n\
  \        self.MAX_AVAILABLE = max_available\n        self.taken = 0\n\n    def acquire(self):\n\
  \        self.cv.acquire()\n        while (self.taken == self.MAX_AVAILABLE):\n\
  \            self.cv.wait()\n        self.taken += 1\n        self.cv.release()\n\
  \n    def release(self):\n        self.cv.acquire()\n        self.taken -= 1\n \
  \       self.cv.notify()\n        self.cv.release()\n```\n\n\n\n\n考虑一个基于 Web 的日历，其中托管日历的服务器必须在下一个日历事件发生时执行某项任务。（该任务可以是发送电子邮件或短信服务\
  \ (SMS)。）你的任务是设计一个管理此类任务执行的设施。\n\n开发一个 `timer` 类来管理延迟任务的执行。`timer` 构造函数接收一个对象作为参数，该对象包含一个\
  \ `run` 方法和一个字符串字段 `name`。该类必须支持：(1.) 在未来的某个时间启动一个由 `name` 标识的线程；以及 (2.) 取消由 `name`\
  \ 标识的线程（如果线程已经启动，则忽略取消请求）。\n\n提示：涉及两个方面——数据结构设计和并发。\n\n**解决方案:** 设计的两个方面是数据结构和锁机制。我们使用两个数据结构。第一个是\
  \ `min-heap`（最小堆），我们在其中插入键值对：键是运行时间，值是在该时间运行的线程。一个分发线程（dispatch thread）运行这些线程；它在每次调用之间保持睡眠，如果池中添加或删除了线程，它可能会被唤醒。如果被唤醒，它将根据\
  \ `min-heap` 顶部的元素推进或延迟其剩余的睡眠时间。唤醒后，它查找 `min-heap` 顶部的线程——如果它的启动时间是当前时间，分发线程将其从\
  \ `min-heap` 中删除并执行它。然后它将睡眠直到 `min-heap` 中下一个线程的启动时间。（由于删除操作，可能会出现分发线程唤醒后发现无事可。）\n\
  \n第二个数据结构是 `hash table`（哈希表），以线程 ID 为键，`min-heap` 中的项值为值。如果我们需要取消一个线程，就去 `min-heap`\
  \ 删除它。每当添加一个线程时，我们就将其添加到 `min-heap` 中；如果插入到 `min-heap` 的顶部，我们就中断分发线程以便其调整唤醒时间。\n\
  \n由于 `min-heap` 被更新方法和分发线程共享，我们需要对它加锁。最简单的解决方案是使用单一锁，用于对 `min-heap` 和 `hash table`\
  \ 的所有读写操作。\n\n## 第二部分：领域特定问题\n\n# 17 设计问题\n\n不要被许多关于复杂性的书籍，或你在书中或其他地方发现的许多复杂且晦奥的算法所误导。虽然没有关于简单性的教科书，但简单的系统可以运行，而复杂的则不行。\n\
  \n— “Transaction Processing: Concepts and Techniques,” J. G^(ray), 1992\n\n在面试中，你可能会被问及如何创建一个服务集或更大的系统，这可能是建立在你设计的算法之上的。这些问题是相当开放的，许多问题可以作为大型软件项目的起点。\n\
  \n在面试环境中，当有人问此类问题时，你应该进行一次对话，在其中展示你具备创造性思考、理解设计权衡以及应对未知问题的能力。你应该勾画关键的数据结构和算法，以及你将用于解决该问题的技术栈（编程语言、库、操作系统、硬件和服务）。\n\
  \n本章中的答案是在这种语境下呈现的——它们旨在作为面试中良好回答的示例，而不是全面的最先进解决方案。\n\n我们在表 17.1 中回顾了用于设计系统的模式。在设计系统时需要考虑的其他因素还有实现时间、可扩展性、可伸缩性、可测试性、安全性、国际化和\
  \ IP 问题。\n\n**表 17.1：系统设计模式。**\n\n| 设计原则 | 关键点 |\n| :--- | :--- |\n| **算法与数据结构**\
  \ | 识别基础算法和数据结构。将功能、架构和代码拆分为可管理、可复用的组件。 |\n| **分解** | 将问题分解为可以在不同机器上相对独立解决的子问题。跨机器分片（Shard）数据以适应需求。将处理写的服务器与处理读的服务器解耦。在读服务器上使用复制以获得更多性能。考虑缓存计算并在稍后查找以节省工作。\
  \ |\n\n**分解** 良好的分解对于成功解决系统级设计问题至关重要。功能、架构和代码都受益于分解。\n\n例如，在我们设计在线广告系统的解决方案中，我们根据利益相关者将目标分解为几类。我们将架构本身分解为前端和后端。前端又分为用户管理、网页设计、报告功能等。后端由中间件、存储、数据库、cron\
  \ 服务和用于广告排序的算法组成。\n\n代码分解是面向对象编程的标志。设计模式的主题是寻找实现代码复用的良好方法。广而言之，设计模式分为创建模式、结构模式和行为模式。许多特定的模式非常自然——策略对象、适配器、构建器等出现在我们代码库的许多地方。Freeman\
  \ 等人的《Head First Design Patterns》在我们看来是学习设计模式的正确读物。\n\n**可扩展性** 在面试题背景下，并行性在处理规模时非常有用，即当问题大到无法放入单台机器上，或者在单台机器上运行花费无法接受的时间时。你需要展示的关键洞察是，你知道如何分解问题以使得：\n\
  - 每个子问题都可以相对独立地解决，并且\n- 原始问题的解决方案可以从子问题的解决方案高效构造。\n\n效率通常以中央处理器（`CPU`）时间、随机访问内存（`RAM`）、网络带宽等衡量。\n\
  \n考虑排序 PB 整数数组。如果我们知道分布，最好的方法是定义等大小的整数范围，并将范围发送到一台机器进行排序。排序后的数字只需按顺序拼接即可。如果分布未知，可以将任意子集发送到每台机器，然后使用\
  \ `min-heap` 等方法合并结果。\n\n每当计算重复时，缓存都是极佳的工具。例如，动态规划的核心思想是缓存中间计算的结果。在实现一个预期随时间推响应许多请求且许多请求是重复的服务时，缓存也极其有用。Web\
  \ 服务的负载具有这种特性。\n\n## 17.1 设计一个检测侵权的系统\n\nYouTV.com 是一个成功的在线视频分享网站。好莱坞制片公司抱怨上传到网站的大部分材料侵犯版权。\n\
  \n设计一个功能，允许制片公司输入其所属的视频集 `V`，并确定 YouTV.com 数据库中哪些视频与 `V` 匹配。\n\n提示：归一化视频格式并创建签名。\n\
  \n**解决方案:**视频与文档的区别在于，相同的内容可能以不同的格式、分辨率和压缩水平进行编码。\n\n将重复视频问题转换为重复文档问题的一种方法是将所有视频重新编码为通格式、分辨率和压缩水平。这本身并不意味着两个相同内容的视频会变成完全相同的文件——初始设置会影响生成的视频。然而，我们现在可以对归一化后的视频进行“签名”。\n\
  \n\n\n\n一种简单的签名方法是根据每帧的亮度高于或低于平均值，为每一帧分配 0 或 1。更复杂的签名方法是针对每帧的红、绿、蓝强度进行 3 位测量。甚至可以开发出更复杂的签名，例如，考虑单帧上的特定区域。开发更好签名的动机是减少系统返回的虚假匹配数量，从而缩短审核这些匹配所需的时间。\n\
  \n上述提出的解决方案是算法性的。然而，还有其他可能有效的替代方法：让用户标记侵犯版权的视频（并可能对他们的付努力给予奖励），检查是否与之前识别为侵权的视频完全相同的视频，查看视频标头中的元数据等等。\n\
  \n**变体：** 设计一个在线音乐识别服务。\n\n# 18 语言问题\n\n我语言的界限意味着我的世界的界限。[— 维特斯坦 (Wittgenstein)]\n\
  \n## 18.1 闭包 (Closure)\n\n以下程序打印了什么？为什么？\n```python\nincrement_by_i = [lambda x:\
  \ x + i for i in range (10)]\nprint(increment_by_i 3)\n```\n\n**解答：** 程序打印的是 13\
  \ (=9 + 4)，而不是预期的 7 (=3 + 4)。这是因为在循环中创建的函数具有相同的作用域。它们使用相同的变量名，因此它们都引用同一个变量 `i`，而在循环结束时，`i`\
  \ 的值为 10，因此结果是 13 (=9 + 4)。\n\n有许多方法可以实现所需的行为。合理的方法是从函数中返回 lambda，从而避免命名冲突。\n\n\
  ```python\ndef create_increment_function(x):\n    return lambda y: y + x\n\nincrement_by_i\
  \ = [create_increment_function(i) for i in range (10)]\nprint(increment_by_i 3)\n\
  ```\n\n## 18.2 浅拷贝与深拷贝\n\n描述浅拷贝 (shallow copy) 和深拷贝 (deep copy) 之间的区别。它们在什么情况下适用？什么时候两者都不适用？深拷贝是如何实现的？\n\
  \n**解答：** 首先，我们注意到 Python 中的赋值并不复制——它只是将一个变量指向一个目标。对于可变对象或包含可变项的对象，如果我们想在不改变原始对象的情况下更改副本，就需要进行拷贝。例如，如果\
  \ `A = [1, 2, 4, 8]` 且我们将 `A` 赋值给 `B`（即 `B = A`），那么如果我们更改 `B`（例如 `B.append(16)`），则\
  \ `A` 也会发生变化。\n\n有两种拷贝方法：浅拷贝和深拷贝。它们在 `copy` 模块中实现，具体为 `copy.copy(x)` 和 `copy.deepcopy(x)`。浅拷贝构建一个新的复合对象，然后（在可能的范围内）向其中插入原始对象中对象的引用。深拷贝则构建一个新的复合对象，然后递归地向其中插入原始对象中对象的副本。\n\
  \n举一个具体的例子，假设 `A = [[1, 2, 3],[4, 5, 6]]` 且 `B = copy.copy(A)`。那么如果通过 `B[0][0] =\
  \ 0` 更新 `B`，则 `A[0][0]` 也会变为 0。但是，如果 `B = copy.deepcopy(A)`，则相同的更新将保持 `A` 不变。\n\n\
  浅拷贝和深拷贝之间的区别仅适用于复合对象，即包含其他对象的对象，例如列表或类实例。如果 `A = [1, 2, 3]` 且 `B = copy.copy(A)`，那么如果通过\
  \ `B[0] = 0` 更新 `B`，则 `A` 保持不变。\n\n深入底层，深拷贝的实现更具挑战性，因为递归对象（直接或间接包含自身引复合对象）会导致深拷贝的朴素实现出现无限递归。此外，由于深拷贝会拷贝所有内容，它可能会拷贝过多内容，例如即使在拷贝之间也应该共享的记账数据结构。`copy.deepcopy()`\
  \ 函数通过缓存已拷贝的对象，并允许用户定义的类重写拷贝操作来避免这些问题。特别是，类可以重写一个或两个方法：`__copy__()` 和 `__deepcopy__()`。\n\
  \n拷贝是防御性的——如果已知客户端不会修改对象，则可以避免拷贝。同样，如果对象本身是不可变的（例如元组），则没有必要拷贝它。\n\n# 19 面对象设计\n\n\
  专家级设计师知道不该做的一件事就是从第一原理开始解决每一个问题。\n\n— “设计模式：可重用面向对象软件元素，” E. G^(amma), R. H^(elm),\
  \ R. E. J^(ohnson), 还有 J. M. V^(lissides), 1994\n\n类是数据以及操作这些数据的方法的封装。类符合我们思考计算的方式。它们提供了封装，减少了编写代码的认知负担，并通过使用继承和多态实现了代码重用。然而，朴素地使用面向对象的构造结构可能会导致代码难以维护。\n\
  \n设计模式是针对常见问题的通用可重复的解决方案。它不是一个可以直接编码的完整设计——而是对如何解决在许多不同情况下出现问题的描述。在面向对象编程的背景下，设计模式同时处理了重用性和可维护性。本质上，设计模式使得系统的某些部分能够独立变化。Adnan\
  \ 的设计模式课程（在线免费）包含了讲义、作业和可以作为良好参考的实验。\n\n## 19.1 创建模式\n\n解释以下这些创建模式分别是什么：构建器 (builder)、静态工厂\
  \ (static factory)、工厂方法 (factory method) 和抽象工厂 (abstract factory)。\n\n**解答：** 构建器模式的核心思想是分阶段构建复杂对象。它通过使用内部类并返回所需对象来避免可变性和不一致的状态。其主要优势是拆分构建过程，并为步骤命名。与构造函数相比，它能更好地处理可选参数以及参数列表长的情况。\n\
  \n静态工厂是用于创建对象的函数。它的优点在于：与构造函数相比，函数的名称可以让操作更清晰。函数没有义务创建一个新对象——特别是，它可以返回一个重量级 (flyweight)。它还可以返回一个经过优化的类型，例如，当数组大小小于整数字长时，可以使用整数代替布尔数组。\n\
  \n工厂方法定义了创建对象的接口，但让子类决定实例化哪个类。经典的例子是两种模式的迷宫游戏：一种是普通房间，另一种是魔法房间。\n\n```python\nfrom\
  \ abc import ABC , abstractmethod\n\nclass Room(ABC):\n    @abstractmethod\n   \
  \ def connect(self , room2): pass\n\nclass MazeGame(ABC):\n    @abstractmethod\n\
  \    def make_room(self):\n        print(\"abstract make_room\")\n        pass\n\
  \n    def addRoom(self , room): print(\"adding room\")\n\n    def __init__(self):\n\
  \        room1 = self.make_room () room2 = self.make_room () room1.connect(room2)\
  \ self.addRoom(room1) self.addRoom(room2)\n```\n\n这段代码实现了普通房间。这段代码实现了魔法房间。\n\n class\
  \ MagicMazeGame(MazeGame):\n\n    def make_room(self): return MagicRoom ()\n\nclass\
  \ MagicRoom(Room):\n\n    def connect(self , room2):\n\n        print(\"Connecting\
  \ magic room\")\n\n```\n\n这里是使用工厂创建普通游戏和魔法游戏的方法。`ordinary_maze_game = ordinary_maze_game.OrdinaryMazeGame\
  \ () magic_maze_game = magic_maze_game.MagicMazeGame ()`\n\n工厂方法模式的缺点是使得子类化具有挑战性。\n\
  \n\n\n抽象工厂提供了一种接口，用于创建相关对象族，而无需指定它们的具体类。例如，一个 `classDocumentCreator` 可以提供接口来创建多个产品，如\
  \ `createLetter()` 和 `createResume()`。该类的具体实现可以选择以不同的方式实现这些产品，例如，使用现代或经典的字体、右对齐或右不对齐布局等。客户端代码获取一个\
  \ `DocumentCreator` 对象并调用它的工厂方法。使用这种模式使得在不改变使用它们代码的情况下交换具体实现成为可能，甚至可以在运行时。这种灵活性的代价是更多的规划和前期的代码编写，由于增加了间接性，代码也可能更难理解。\n\
  \n# 20 种常用工具\n\nUNIX 是一种为数字设备公司 PDP-11/40 和 11/45 计算机设计的通用型、多用户、交互式操作系统。它提供了许多即使在大型操作系统也罕见的特性，包括：(1)\
  \ 包含可卸载卷的分层文件系统；(2) 兼容的文件、设备和进程间 I/O；(3) 启动异步进程的能力；(4) 可按用户选择的系统命令语言；以及(5) 包括 100\
  \ 多个子系统，其中包括十多种语言。\n\n— “ UNIX 时间共享系统，” [D. R]itchie 和 [K. T]thompson[, 1974\n\n\
  本章的问题涉及工具：版本控制系统、脚本语言、构建系统、数据库和网络栈。此类问题通常不会被问到——只有当你正在为特殊职位面试，或者你声称拥有专业知识（例如网络安全或数据库）时，才预期遇到它们。我们强调这些都是巨大的领域，例如，网络在大学课程中是系列课程教授的。我们这里的目标是让你了解可能会遇到的内容。Adnan\
  \ 的高级编程工具课程材料免费提供，包含了讲义笔记、作业和实验，可以作为本章内容的良好资源。\n\n## 版本控制\n\n版本控制系统是软件开发的基石——每位开发者都应该理解如何以优化方式使用它们。\n\
  \n### 20.1 版本控制系统中的合并\n\n什么是版本控制系统中的合并？具体描述基于行的合并的局限性以及克服这些局限的方法。\n\n**解决方案：**\n\
  \n现代版本控制系统允许开发者在整个代码库的副本上并发工作。这使得软件开发人员能够独立工作。这种合并的代价是：需要定期整合个人副本以创建一个新的共享版本。存在并行更改发生冲突的可能性，这些冲突必须在合并期间解决。\n\
  \n到为止，最常用的合并方法是基于文本的。基于文本的合并工具将软件视为文本。基于行的合并是基于文本合并的一种，具体来说每一行都被视为一个不可分割的单元。这种合并是“三路”的：将修订历史中的最低共同祖先与两个版本结合使用。通过对文件进行基于行的合并，可以在并行修改中检测到公共文本行，以及被插入、删除、修改或移动的文本行。下一页的图\
  \ 20.1 显示了此类基于行的合并示例。\n\n基于行的合并的一个问题是，它无法处理对同一行的两个并行修改：这两个修改无法合并，必须在两个修改中选择一个。一个更大的问题是，基于行的合并可能会成功，但由于语法或语义冲突，导致程序是损坏的。在对页图\
  \ 20.1 的场景中，两个开发者所做的更改是针对独立行的，因此基于行的合并没有显示冲突。然而，程序将无法编译，因为函数调用不正确。\n\n尽管如此，基于行的合并因其效率、可扩展性和准确性而被广泛使用。实践中，三路基于行的合并工具可以无任何问题地合并\
  \ 90% 更改的文件。挑战在于自动化处理剩下的 10% 无法自动合并的情况。\n\n基于文本的合并失败因为它没有考虑任何语法或语义信息。语法合并考虑了编程语言的语法。基于文本的合并经常产生无关紧要的冲突，例如不同开发者更改的代码注释或由代码重格式化引起的冲突。语法合并可以忽略所有这些：当合并结果在语法上不正确时，它会显示合并冲突。\n\
  \n我们通过一个小示例来说明语法合并：\n\n```\nif (n%2 == 0) then m = n/2;\n```\n\n两个开发者以不同的方式更改了这段代码，但整体效果相同。第一个将其更新为：\n\
  \n```\nif (n%2 == 0) then m = n/2 else m = (n-1) /2;\n```\n\n第二个开发者的更新是 `m = n/2;`\n\
  \n两个更改都是针对相同的内容。然而，文本合并可能会导致 `m := n div 2 else m := (n-1)/2`，这在语法上是不正确的。语法合并识别出冲突；集成者的责任是手动解决它，例如，通过删除\
  \ `else` 部分。\n\n语法合并工具无法检测某些频繁发生的冲突。例如，在下一页图 20.1 中，版本 1a 和 1b 的合并将无法编译，因为对 `sum(10)`\
  \ 的调用签名错误。语法合并不会检测到此冲突，因为程序在语法上仍然是正确的。冲突是语义冲突，具体说是静态语义冲突，因为它在编译时是可以检测的。\n\n技术上，语法合并算法在待合并程序的解析树上操作。更强大的语义合并算法已被提出，在程序的图表示上操作，其中定义和使用相关联，更容易识别不匹配。\n\
  \n静态语义合并也有缺点。例如，假设 `Point` 是一个使用笛卡尔坐标的二维类，该类有一个返回 x² 的距离函数。Alice 检出项目并派生自 Point\
  \ 创建了一个支持极坐标的类，并使用该距离函数返回半径。同时，Bob 检出项目并将 Point 的距离函数更改为返回 y²。静态语义合并没有报告冲突：合并后的程序可以编译。然而行为并不符合预期。\n\
  \n语法合并和语义合并大大增加运行时间，并由于它们与特定的编程语言紧耦合而非常有限制。在实践中，基于行的合并与一组单元测试（“烟雾测试集”）结合使用，并通过预提交钩子脚本调用。编译发现语法和静态语义错误，测试（理想情况下）可以识别更深层次的语义问题。\n\
  \n\n\n脚本语言，如 `AWK`、Perl 和 Python，最初是作为用于快速修补、快速原型开发以及胶接其他程序的工具开发的。它们已经演变为主流编程语言。它们的一些特征如下：\n\
  \n- 文本字符串是基础（有时也是唯一的）数据类型。\n- 关联数组是基础聚合类型。\n- 正则表达式（Regexps）通常是内置的。\n- 程序是解释执行而非编译执行的。\n\
  - 通常不需要声明。\n\n这些语言很容易上手，并且通常可以用非常少的代码完成大量工作。\n\n## 构建系统\n程序通常在修改后不能立即执行：需要中间步骤来构建程序并在部署之前进行测试。其他组件也可能受到影响，例如从程序文本生成的文档。构建系统自动化了这些步骤。\n\
  \n## 数据库\n今天大多数软件系统都与数据库交互，对于开发者来说，拥有数据库的基础知识很重要。\n\n## 网络\n今天大多数软件系统都与网络交互，对于处于堆栈位置更高的开发者来说，拥有网络的基础知识同样重要。以下是你在面试环境中可能会遇到的网络问题。\n\
  \n# 第三部分：荣誉班\n\n## 章节：21 荣誉班\n数学问题的供应是无穷无尽的，只要一个问题被解决，就有许多其他问题随之浮现。\n\n— “数学问题，”\
  \ D. H^(ilbert), 1900\n\n本章包含了比之前介绍的更难解决的问题。其中许多在面试中经常被问到，尽管预期的候选人可能不会提供完美的解决方案。\n\
  \n我们包含这些问题有几个原因：\n\n- 尽管掌握这些问题对你的成功并非必不可，但如果你真的解决了它们，你将让自己置于一个非常有利的地位，类似于戴着脚环进行比赛训练。\n\
  - 如果你被问到其中一个问题或其变体，并且成功推导出最佳解决方案，你将给面试官留下深刻的印象。其影响远超获得录取机会——你的工资、职位和地位都将提升。\n- 一些问题适用于面试特殊职位的候选人，例如优化大规模分布式系统、计算金融的机器学习等。这些问题也经常问及拥有高级学位的候选人。\n\
  - 最后，如果你热爱挑战，这些问题将为你提供挑战！\n\n如果你的面试官问你一个难题，你应该感到高兴——这意味着对你有高期望，而且是一个展示自己的机会，相比之下，被要求写一个测试字符串是否为回文的程序要容易得多。\n\
  \n### 不计算性\n面试中提出的编码问题几乎总有一个（或多个）快速的解决方案，例如 `O(n)` 时间复杂度。有时，你可能会被问到一个在计算上不可行的问题——对于可能不存在高效的算法。（这类问题在现实世界中很常见。）解决不可计算问题有很多方法：\n\
  \n- 暴力解法，包括动态规划，具有指数级时间复杂度，如果遇到的实例较小，或者复杂度呈指数关系的特定参数较小，则是可以接受的；\n- 搜索算法，如回溯、分支限界和爬山算法，它们修剪了暴力搜索的大部分复杂度；\n\
  - 近似算法，返回一个证明接近最优解的解决方案；\n- 基于洞察、常见情况分析和仔细调优的启发式方法，可以较好地解决问题；\n- 并行算法，大量计算机可以同时处理子部分。\n\
  \n### 21.1 计算最大公约数\n非负整数 `x` 和 `y` 的最大公约数 (GCD) 是最大的整数 `d`，使得 `d` 能整除 `x` 且 `d`\
  \ 能整除 `y`，即 `x mod d = 0` 且 `y mod d = 0`。（当 `x` 和 `y` 均为 0 时，取 GCD 为 0。）\n\n设计一个高效算法，在不使用乘法、除法或模运算符的情况下计算两个非负整数的\
  \ GCD。\n\n提示：使用用例分析：都是偶数；都是奇数；一奇一偶。\n\n**解：** 直观的算法基于递归。如果 `x = y`，`GCD(x, y) =\
  \ x`；否则，在不失一般性的情况下假设 `x > y`。那么 `GCD(x, y)` 是 (`x− y, y`) 的 GCD。\n\n基于上述递归算法没有使用乘法、除法或模，但对于某些输入它运行非常慢。例如，如果输入是\
  \ `x = 2^n`, `y = 2`，算法将进行 `2^(n−1)` 次递归调用。通过观察到重复减法等于除法，可以改进时间复杂度，即当 `x > y` 时，`GCD(x,\
  \ y) = GCD(y, x mod y)`，但这种方法使用了题目声明中明确禁止的整数除法。\n\n这是一个快速解决方案，它也基于递归，但没有使用通用的乘法或除法。相反，它使用了分类分析，特别是数字中有一个、两个或没有偶数的情况。\n\
  \n可以用例子来说明。假设我们要计算 24 和 300 的 GCD。与其反复从 300 中减去 24，我们可以观察到由于两者都是偶数，结果是 `2^× GCD(12,150)`。除以\
  \ 2 是右移一位，因此我们不需要通用的除法操作。由于 12 和 150 均都是偶数，`GCD(12,150) = 2× GCD(6,75)`。由于 75 是奇数，`GCD(6,75)`\
  \ 是 6 和 75 的 GCD。\n\n```python\ndef gcd(x, y):\n    if x == y:\n        return x\n\
  \    if x == 0:\n        return y\n    if y == 0:\n        return x\n    if x %\
  \ 2 == 0 and y % 2 == 0:\n        return 2 * gcd(x >> 1, y >> 1)\n    if x % 2 ==\
  \ 0:\n        return gcd(x >> 1, y)\n    if y % 2 == 0:\n        return gcd(x, y\
  \ >> 1)\n    return gcd(x, y - x)\n```\n\n注意，最后一步会导致一个包含一个偶数和一个奇数的递归调用。因此，每两次调用，我们至少减少两个数字的总位位数一位，这意味着时间复杂度与\
  \ x 和 y 的位数之和成比，即 `O(logx+log y)`。\n\n### 21.2 计算除一个以外所有元素的最大乘积\n假设给你整数数组 A，并要求通过乘以\
  \ A 中除一个以外的所有元素来得到最大的乘积。（不能重复使用同一个元素。）例如，如果 A = 3,2,5,4 ，结果是 3^× 5^× 4 = 60；如果 A\
  \ = 3,2,^−1,4 ，结果是 3^× 2^× 4 = 24；如果 A = 3,2,^−1,4,^−1,6 ，结果是 3^(× −)1^× 4^(× −)1^×\
  \ 6 = 72。\n\n\n\n\n一种方法是形成所有元素的乘积 `P`，然后找到所有 `i` 中 `P/A[i]` 的最大值。这需要 `n−1` 次乘法（形成\
  \ `P`）和 `n` 次除法（计算每个 `P/A[i]`）。假设由于有限精度的考虑，我们无法使用基于除法的方法；只能使用乘法。暴力解法涉及计算所有 `n` 个由\
  \ `n−1` 个元素组成的乘积；每个这样的乘积需要 `n−2` 次乘法，即时间复杂度为 `^O(n²)`。\n\n给定一个长度为 `n` 元素为整数的数组 `A`，计算使用\
  \ `A` 中 `n−1` 个元素得到的最大乘积。你不能多次使用同一个元素。数组元素可以是正数、负数或 `0`。你的算法不能显式或隐式使用除法运算符。\n\n\
  **提示：** 考虑前 `i−1` 个元素和最后 `n−i` 个元素的乘积。或者，统计负数元素和零元素的个数。\n\n**解：** 计算 `P/A[i]` 的暴力解法是将出现在\
  \ `i` 之前的元素与出现在 `i` 之后的元素相乘。这导致 `n(n−2)` 次乘法，因为对于每一项 `P/A[i]`，我们需要 `n−2` 次乘法。\n\n\
  注意，在计算 `P/A[i]` 和 `P/A[i+1]` 时存在大量的计算重复。特别是 `i+1` 之前元素的乘积是 `A[i]` 乘以 `i` 之前元素的乘积。我们可以通过\
  \ `n−1` 次乘法计算所有 `i` 之前元素的乘积，通过 `n−1` 次乘法计算所有 `i` 之后元素的乘积，并将这些值存储在前缀乘积数组和后缀乘积数组中。所需的结果就是最大的前缀后缀乘积。稍微节省空间的方法是构建后缀乘积数组，然后正向遍历数组，使用单个变量计算前缀乘积。将此前缀乘积与相应的后缀乘积相乘，如果需要则更新最大前缀后缀乘积。\n\
  \n```python\ndef find_biggest_n_minus_one_product(A):\n    # Builds suffix products.\n\
  \    suffix_products = list(\n        reversed(list(itertools.accumulate(reversed(A),\
  \ operator.mul))))\n    )\n    # Finds the biggest product of (n - 1) numbers.\n\
  \    prefix_product, max_product = 1, float('-inf')\n    for i in range(len(A)):\n\
  \        suffix_product = suffix_products[i + 1] if i + 1 < len(A) else 1\n    \
  \    max_product = max(max_product , prefix_product * suffix_product)\n        prefix_product\
  \ *= A[i]\n    return max_product\n```\n\n时间复杂度为 `^O(n)`；空间复杂度为 `^O(n)`，因为该解决方案使用了长度为\
  \ `n` 的单个数组。\n\n我们现在用 `^O(n)` 时间和 `^O(1)` 额外存储来解决这个问题。洞察来自于：如果没有负数元素，最大乘积来自于使用除最小元素以外的所有元素。（注意，如果\
  \ `0` 元素的个数为零、一个或多个，该结果均是正确的。）\n\n如果负数元素的个数为奇数，无论有多少 `0` 元素和正数元素，最大乘积都使用除绝对值最小的负数（即最小的负数）以外的所有元素。\n\
  \n进一步来说，如果负数元素的个数为偶数，最大乘积再次使用除最小非负元素以外的所有元素，假设非负元素的个数大于零。（即使在存在 `0` 元素的情况下，这也是正确的。）\n\
  \n如果负数元素的个数为偶数，且没有非负元素，则结果必须为负数。由于我们想要最大的乘积，我们舍弃幅度最大的元素，即最大的负数。\n\n该分析得出了一个两阶段算法。首先，确定适用的场景，例如，是否存在偶数个负数？随后，执行实际乘法以获得结果。\n\
  \n```python\ndef find_biggest_n_minus_one_product(A):\n    number_of_negatives =\
  \ 0\n    least_nonnegative_idx = least_negative_idx = greatest_negative_idx = None\n\
  \    # Identify entries. for i, a in the least negative , greatest negative , and\
  \ least nonnegative\n    for i, a in enumerate(A):\n        if a < 0:\n        \
  \    number_of_negatives += 1\n            if least_negative_idx is None or A[least_negative_idx]\
  \ < a:\n                least_negative_idx = i\n            if greatest_negative_idx\
  \ is None or a < A[greatest_negative_idx]:\n                greatest_negative_idx\
  \ = i\n        else: # a >= 0.\n            if least_nonnegative_idx is None or\
  \ a < A[least_nonnegative_idx]:\n                least_nonnegative_idx = i\n   \
  \ idx_to_skip = (least_negative_idx if number_of_negatives % 2 else least_nonnegative_idx\
  \ if\n                   least_nonnegative_idx is not None else greatest_negative_idx)\n\
  \    return functools.reduce(lambda product , a: product * a,\n        # Use a generator\
  \ rather than list comprehension to avoid extra space.\n        (a for i, a in enumerate(A)\
  \ if i != idx_to_skip), 1)\n```\n\n该算法对数组进行遍历，每个元素执行常数次计算、一个嵌套条件判断，随后是另一个数组的遍历，每个元素执行常数次计算。因此，时间复杂度为\
  \ `O(n) +O(1) +O(n) =O(n)`。额外空间复杂度为 `^O(1)`，对应于局部变量。\n\n\n\n\n\n# 索引\n\n- `二分查找`,\
