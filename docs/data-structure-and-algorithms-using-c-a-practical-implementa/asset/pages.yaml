- pgno: 173
  md: '# # Linked List


    The linked list is the way of representing the data structure that may be linear
    or nonlinear. The elements in the linked list will be allocated randomly inside
    the memory with a relation in between them. The elements in the linked list is
    known as NODES.


    The link list quite better than the array due to the proper usage of memory.


    # ## 7.1 Why Use Linked List?


    The array always requires the memory that are in sequential order but the linked
    list requires a single memory allocation which is sufficient enough to store the
    data. In case of array the memory may not be allotted even if the memory space
    is greater than the required space because that may not be in sequential order.


    # ## 7.2 Types of Link List


    The link list are of Four types such as


    +   - Single Link List

    +   - Double Link List

    +   - Circular Link List

    +   - Header Link List'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# 7.3 Single Link List


    # STRUCTURE OF THE NODE OF A LINKED LIST


    The node of a link list having the capacity to store the data as well as the address
    of its next node and the data may varies depending on the users requirement so
    it will be better to choose the data type of the node as STRUCTURE which will
    have the ability to store different types of elements.


    The general format of the node is


    ```

    Struct tagname

    {

    Data type member1;

    Data type member2;

    ............

    ............

    Data type membern;

    Struct tagname *var;

    };

    ```


    Example:


    ```

    struct link

    {

    int info;

    struct link *next;

    };

    ```


    This structure is also called as self referential structure.


    # CONCEPT OF CREATION OF A LINKED LIST


    ```

    int *p,q=5;

    p=&q;

    *p = 10;

    After this the value of q is being changed to 10.

    The main observation here is that if a pointer variable points to another variable
    then what ever the changes made with the pointer that will directly affect to
    the variable whose address is stored inside the pointer and concept is used to
    design/create the linked list.

    ```'
