  md: '# 9.5 Single Source Shortest Path


    The shortest path weight from a vertex u ∈ V to a vertex v ∈ V in the weighted
    graph is the minimum cost of all paths from u to v if there exists no such path
    from vertex u to vertex v then the weight of the shortest path is ∞


    We can also define as

    δ(u, v) = {

    Min(w(p): u -> v) if there is a path from u to v

    ∞

    otherwise

    }


    # NEGATIVE WEIGHTED EDGES


    The negative weight cycle is a cycle whose total weight is –ve. No path from starting
    vertex S to a vertex on the cycle can be a shortest path.


    Since a path can run around the cycle many many times so it may get any –ve costing
    other word we can say that a negative cycle invalidates the notion of distance
    based on edge weights.


    If some path from S to v contains a negative cost syle , there does not exist
    a shortest path otherwise there exist one that is simple.


    ![](img/1faaa0256577c74e8a61f42967760aa8_327_0.png)


    # RELAXATION TECHNIQUE


    This technique consists of testing whether we can improve the shortest path found
    so far, if so update the shortest path. A relaxation step may or may not decrease
    the value of the shortest path estimate.


    # ALGORITHM RELAX(u,v,w)


    +   1. if d[u] + w(u,v) < d[v]

    +   2. then d[v] <= d[u] + w(u,v)

    +   3. π[v] <- u'
