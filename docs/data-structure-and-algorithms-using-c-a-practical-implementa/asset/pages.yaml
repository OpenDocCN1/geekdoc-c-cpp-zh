    # 9.4.2 Prim''s Algorithm


    The key to implementing Prim''s algorithm efficiently is to make it easy to select
    a new edge to be added to the tree formed by the edges in A in the pseudo code
    below, the connected graph G and the root R of the minimum spanning tree to be
    grown are inputs to the algorithm. During execution of the algorithm all vertices
    that are not in the tree reside in a min priority queue Q based in a key field.
    For each vertex V, Key[V] is the minimum weight of any edge connecting V to a
    vertex in the tree, by conversion key[V] = ∞ if there is no such edge. The field
    π (V) names the parent of V in the tree.'
