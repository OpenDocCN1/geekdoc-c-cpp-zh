- pgno: 66
  md: '# 3.6 Drawbacks of Sparse Matrix


    # Memory Drawbacks of a Sparse Matrix


    Every element of a program array takes up memory and a sparse matrix can end up
    taking unnecessary amounts of memory space. For example, a 10x10 array can occupy
    10 x 10 x 1 byte (assuming 1 byte per element) = 100 bytes. If a majority of these
    elements say 70 of 100, are zeroes, then 70 bytes of space is essentially wasted.
    Sometimes large sparse matrices are too big to fit into memory.


    # Computational Drawbacks of a Sparse Matrix


    Performing algorithmic computations (like matrix multiplication, for example)
    takes up a lot of unnecessary time for each zero computation. Anything multiplied
    by zero is zero, but this operation still has to be performed which is seen as
    a waste of computational time.


    A sparse matrix can be compressed and memory reduction can be achieved by storing
    only the non-zero elements. However, this will also require programming additional
    structures to recover the original matrix when elements have to be accessed, but
    overall a compressed sparse matrix can ultimately increase computational speed.


    Sparse matrices are very common in machine learning algorithms. Now that your
    question ‘what is sparse matrix’ is answered, let’s understand some examples and
    its uses.


    # 3.7 Sparse Matrix and Machine Learning


    As mentioned earlier, sparse matrices are a common occurrence in Machine Learning
    algorithms.


    # 1. In Data Storage


    +   (a) In a movie application like Netflix, the array that stores the check of
    which movies are watched and not watched in a catalog.


    +   (b) In e-commerce programs, data that represents the products purchased and
    not purchased by a user.


    +   (c) In a music app, the count of songs listened and not listened to by a user.'
