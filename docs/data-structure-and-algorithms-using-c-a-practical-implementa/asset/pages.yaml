  md: '# # Searching and Sorting


    Searching is the process of finding out the position of an element in an list.
    If the element is found inside the list then the searching process is successful
    otherwise the searching process is failure.


    Searching is of two types such as


    +   - Linear Search

    +   - Binary Search


    # ## 10.1 Linear Search


    This is the simplest method of searching. In this method the element to be found
    is sequentially searched in the list.


    This method can be applied to a sorted or an un-sorted list.Searching is case
    of sorted list starts from 0th element and continues until the element is found
    or an element whose value is greater (Assuming the list is sorted in ascending
    order) than the value being searched is reached.


    As against this,searching in case of unsorted list starts from 0th element and
    continues until the element is found or the end of list is reached.


    # ### Algorithm


    ```

    N → Boundary of the list

    Item → Searching number

    Data → Linear array

    Step-1 I=0

    Step-2 Repeat while I<=n

    If (item = data[I])

    Print "Searching is successful"

    Exit

    ```'
