  md: '# Concepts of Class


    # 4.1 Introduction to CLASS


    Like structure the class is also a user defined data type or Abstract Data Type
    (which derives/combines the properties of different data types into a single unit),
    which combines both the data members and member functions into a single unit.
    The Object oriented properties like Data encapsulation and Data Hiding is fully
    supported by the class.


    Like structure the class has also its declaration and before its use we must have
    to declare it. The declaration of the class is very simple except that all the
    members of the class can be arranged in different sections (block) to achieve
    the data hiding.


    The main purpose of C++ programming is to add object orientation to the C programming
    language and classes are the central feature of C++ that supports object-oriented
    programming and are often called user-defined types.


    A class is used to specify the form of an object and it combines data representation
    and methods for manipulating that data into one neat package. The data and functions
    within a class are called members of the class.


    When you define a class, you define a blueprint for a data type. This does not
    actually define any data, but it does define what the class name means, that is,
    what an object of the class will consist of and what operations can be performed
    on such an object.'
