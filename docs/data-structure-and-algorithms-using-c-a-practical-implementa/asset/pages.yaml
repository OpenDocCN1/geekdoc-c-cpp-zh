    # 8.7 Types of Binary Tree


    There are different types of BINARY trees are found but some of them which are
    frequently used are


    +   > Expression Tree

    +   > Binary Search Tree

    +   > Height Balanced Tree (AVL Tree)

    +   > Threaded Binary Tree

    +   > Heap Tree

    +   > Huffman Tree

    +   > Decision Tree

    +   > Red Black Tree


    # 8.8 Expression Tree


    An expression tree is a Binary Tree which stores/represents the mathematical (arithmetic)
    expressions.


    The leaves of an expression tree are operands, such as constants or variable names
    and all the internal nodes are the operators. An expression tree will be always
    a binary tree because an arithmetic expression contains either binary operators
    or unary operators.'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'Formally we can define an expression Tree as a special kind of binary tree
    in which:


    +   - Each leaf is an operand. Examples: a, b, c, 6, 100

    +   - The root and internal nodes are operators. Examples: +, -, *, /, ^

    +   - Subtrees are subexpressions with the root being an operator.


    # Construction of Expression Tree:


    Now For constructing expression tree we use a stack. We loop through input expression
    and do following for every character.


    +   1) If character is operand push that into stack.

    +   2) If character is operator pop two values from stack make them its child
    and push current node again.


    At the end only element of stack will be root of expression tree.


    # EXAMPLE


    # Represent an Expression Tree


    A + (B*(C) – (D^E) / F + G * H


    While constructing the TREE choose an operator in such a way that the terms in
    parenthesis will be in a side (for better construction) and choose a operator
    having higher precedence.


