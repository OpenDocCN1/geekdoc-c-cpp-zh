    +   (9 and (55 46 37 89 82 32)


    At this point 20 is in its proper position in the array x[1], each element below
    that position (9) is less than or equals to 20 and each element above that position
    (55 46 37 89 82 32) is greater than or equals to 20.


    The problem is broken into two sub problems that are to sort the two sub arrays.
    Since the first sub array contains only a single element, so it is already sorted.
    To sort the second sub array we choose its first element 55 as the pivot and again
    get two sub arrays (46 37 32) and (89 82) .


    So the entire array can be represented as


    +   9 20 (46 37 32) 55 (89 82)


