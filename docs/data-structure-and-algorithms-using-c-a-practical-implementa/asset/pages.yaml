    # Analysis of the Sequential Search


    The number of comparisons for a successful search is depends upon the position
    where the key value is present. If the searched value is present at the 1st place
    then 1 comparison is required. So in general mth comparisons are required to search
    the mth element.


    # Best Case Complexity


    If the key value is present at first position on the array then T(n) = O(1)


    # Worst Case Complexity


    If the value is present at the end of the array then T(n) = O(n)

    Average Case Complexity

    (Best case + Worst Case)/2 = (1+n)/2

    T(n) = O(n)


