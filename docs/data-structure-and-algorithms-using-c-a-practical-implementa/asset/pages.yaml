    # 9.5.1 Bellman-Ford Algorithm


    Bellman ford algorithm solves the single source shortest path problem in the general
    case in which edges of a given digraph can have –ve weight as long as G contains
    no negative cycles.


    It uses d[u] as an upper bound on the distance d[u,v] from u to v. The algorithm
    progressively decreases an estimate d[v] on the weight of the shortest path from
    the source vertex S the each vertex v in V until it achieves the actual shortest
    path.


    This algorithm returns TRUE if the given digraph contains no –ve cycle that are
    reachable from source vertex S otherwise FALSE.


    # ALGORITHM BELLMAN-FORD(G,W,S)


    +   1. INITIALIZE-SINGLE-SOURCE(G,S)

    +   2. for each edge i = 1 to V[G] – 1 do

    +   3. for each edge(u,v) ∈ E(G) do

    +   4. RELAX(u,v,w)

    +   5. for each edge(u,v) in E(G)

    +   6. do if d[u] + w(u,v) < d[v]

    +   7. then return FALSE'
