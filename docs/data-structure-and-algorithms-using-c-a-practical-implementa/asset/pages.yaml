    +   20 55 46 37 9 89 82 32

    +   9 20 (46 37 32) 55 (89 82)

    +   9 20 (37 32) 46 55 (89 82)

    +   9 20 (32) 37 46 55 (89 82)

    +   9 20 32 37 46 55 (82) 89

    +   9 20 32 37 46 55 82 89


    The average run time efficiency of the quick sort is O(n(log, n)). In the worst
    case when the array is already sorted, the efficiency of quick sort may drop down
    to O(n^2)


