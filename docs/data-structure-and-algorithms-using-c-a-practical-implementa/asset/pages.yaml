    \ as O(max(N,M)). In the case where the second loop goes to N instead of M the\
    \ complexity is O(N). You can see this from either expression above. O(N+M) becomes\
    \ O(2N) and when you drop the constant it is O(N). O(max(N,M)) becomes O(max(N,N))\
