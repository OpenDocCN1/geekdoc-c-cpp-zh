    # 3.3 Algorithm to Represent the Sparse Matrix


    +   STEP-1 Input the array of mXn elements.

    +   STEP-2 [COUNT THE NUMBER OF NON ZERO ELEMENTS]

    +   REPEAT For I = 1 to m

    +   REPEAT For j = 1 to n

    +   If arr[i][j] != 0 THEN:

    +   Count := count + 1

    +   [END OF IF]

    +   [END OF LOOP]

    +   [END OF LOOP]

    +   STEP-3 SP[0][0] := m

    +   SP[0][1] := n

    +   SP[0][2] := COUNT

    +   STEP-4 K:=1

    +   REPEAT For I = 0 to m

    +   REPEAT For j = 0 to n

    +   If arr[i][j] != 0 THEN:

    +   Sp[k][0] := i

    +   Sp[k][1] := j

    +   Sp[k][2] := arr[i][j]

    +   K:=K+1

    +   [END OF IF]

    +   [END OF LOOP]

    +   [END OF LOOP]

    +   STEP-5 REPEAT For I = 1 to k+1

    +   REPEAT For j = 1 to 3

    +   Print sp[i][j]

    +   [END OF LOOP]

    +   [END OF LOOP

    +   STEP-6 EXIT'
