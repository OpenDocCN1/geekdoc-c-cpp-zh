  md: '# Review of Concepts of ''C++''


    # 2.1 Array


    Whenever we want to store some values then we have to take the help of a variable,
    and for this we must have to declare it before its use. If we want to store the
    details of a student so for this purpose we have to declare the variables as


    ```

    char name[20], add[30] ;

    int roll, age, regdno ;

    float total, avg ;

    etc......

    ```


    for a individual student.


    If we want to store the details of more than one student than we have to declare
    a huge amount of variables and which is too much difficult to access. I.e/ the
    programs length will increased too faster. So it will be better to declare the
    variables in a group. I.e/ name variable will be used for more than one student,
    roll variable will be used for more than one student, etc.


    So to declare the variable of same kind in a group is known as the Array and the
    concept of array is used for this purpose only.


    Definition: The array is a collection of more than one element of same kind with
    a single variable name.


    # Types of Array:


    The arrays can be further classified into two broad categories such as:


    +   - One Dimensional (The array having one boundary specification)

    +   - Multi dimensional (The array having more than one boundary specification)'
