  md: '# UNDERFLOW


    If one can try to delete an element from an empty stack then that situation will
    be called as the UNDERFLOW.


    In general if one can try to DELETE an element from an empty data structure then
    that will be called as OVERFLOW.


    # Condition for UNDERFLOW


    +   - Top = -1 (for the STACK starts with 0)

    +   - Top = 0 (for the STACK starts with 1)


