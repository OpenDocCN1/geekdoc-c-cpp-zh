    # 9.6 All Pair Shortest Path


    Given a directed, connected weighted graph G(V,E), for each edge (u,v)∈E, a weight
    w(u,v) is associated with the edge. The all pairs of shortest paths problem (APSP)
    is to find a shortest path from u to v for every pair of vertices u and v in V.


    *The representation of G*


    The input is an nxn matrix W=( wij ).


    \(\ w(i,j) = \left\{ \begin{array}{ll} 0 & \text{if } i = j \\ \text{the weight
    of the directed edge}(i,j) & \text{if } i \neq j \land (i,j) \in E \\ \infty &
    \text{if } i \neq j \land (i,j) \notin E \end{array} \right.\)


    The all-pairs-shortest-path problem is generalization of the single-source-shortest-path
    problem, so we can use Floyd''s algorithm, or Dijkstra''s algorithm (varying the
    source node over all nodes).


    +   * Floyd''s algorithm is O(N^3)

    +   * Dijkstra''s algorithm with an adjacency matrix is O(N^2), so varying over
    N source nodes is O(N^3)'
