  md: 'This is the 1st iteration and on completing this iteration the largest element
    gets placed at the last position. Similarly, in the second iteration the comparisons
    are made till the last but one element and this time the second largest element
    gets placed at the second last position in the list. As a result, after all the
    iterations the list becomes a sorted list.


    For ex.


    Let an array having five numbers.


    | 8 | 12 | 10 | 78 | 5 |

    |---|---|---|---|---|


    Step-1: In the 1st iteration the 0th element 8 is compared with 1st element 12
    and since 8 is less than 12 then there is nothing to do.


    Step-2: Now the 1st element 12 is compared with the 2nd element 10 and here the
    swapping will be performed.


    Step-3: This process is repeated until (n – 2)th element is compared with the
    (n – 1)th element and during comparison if the 1st element other wise no interchange.


    Step-4: If there are n number of elements then n-1 iterations are required.


