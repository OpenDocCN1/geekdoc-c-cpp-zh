    # 10.5 Insertion Sort


    Insertion sort is implemented by inserting a particular element at the appropriate
    position.In this method, the first iteration starts with the comparison of 1st
    element with the 0th element. In the second iteration 2nd element is compared
    with the 0th element and 1st element.


    In general, in every iteration an element is compared with all the elements before
    it.During comparison if it is found that the element in question can be inserted
    at a suitable position then a space is created for it by shifting the other elements
    one position to the right and inserting the element at a suitable position.This
    procedure is repeated for all the elements in the array.


    For Ex.

    Consider the array


    | 76 | 52 | 66 | 45 | 33 |


    +   Step-1 : In the first loop the 1st element 52 is compared with the 0th element
    76. Since 52<76, 52 is inserted at 0th place. The 0th element 76 is shifted one
    position to the right.


    +   Step-2 : In the second loop, the 2nd element 66 and the 0th element 52 are
    compared since 66>52, then no change will be performed. Then the second element
    is compared with the 1st element and same procedure will be continued.'
