    # 8.13 Huffman Tree


    Generally the HUFFMAN TREE concept is implemented based upon the concepts of extended
    binary tree. In extended binary tree we known that every node has zero or two
    children. The nodes which have two children that is called as internal nodes and
    the node which have no children is that called as external node.


    In any extended binary tree the number of external nodes is more than the number
    of internal nodes.


    Mathematically


    ```

    External node = internal node + 1

    i.e/ E = I+1

    ```


    ![](img/1faaa0256577c74e8a61f42967760aa8_287_0.png)'
