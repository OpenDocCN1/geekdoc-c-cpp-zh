    Sparse Matrix of the Above array is


    | 6 | 6 | 8 |

    |---|---|---|

    | 0 | 0 | 7 |

    | 0 | 3 | 1 |

    | 0 | 5 | 2 |

    | 1 | 1 | 1 |

    | 1 | 2 | 9 |

    | 2 | 3 | 7 |

    | 4 | 0 | 8 |

    | 5 | 2 | 3 |


    The elements arr[0][0] and arr[0][1] contain the number of rows and columns of
    the sparse matrix respectively. The element arr[0][2] contains the number of non
    zero elements in the sparse matrix.


    The declaration of the sparse matrix takes the form


    ```

    Data type sparse[terms + 1][3];

    ```


    Where the term is the number of non zero elements in the matrix.


    # Method 2: Using Linked Lists


    In linked list, each node has four fields. These four fields are defined as:


    +   • Row: Index of row, where non-zero element is located

    +   • Column: Index of column, where non-zero element is located

    +   • Value: Value of the non zero element located at index – (row,column)

    +   • Next node: Address of the next node'
