  md: '# Queue


    # 6.1 Queue


    Queue is a linear data structure which follows the principle of FIFO. In other
    words we can say that if the FIFO principle is implemented with the array than
    that will be called as the QUEUE.


    The most commonly implemented operations with the stack are INSERT, DELETE.


    Besides these two more operations can also be implemented with the QUEUE such
    as PEEP and UPDATE.


    During the INSERT operation we have to check the condition for OVERFLOW and during
    the DELETE operation we have to check the condition for UNDERFLOW.


    The end at which the insertion operation is performed that will be called as the
    REAR end and the end at which the delete operation is performed is known as FRONT
    end.


    # 6.2 Types of Queue


    +   • Linear Queue

    +   • Circular Queue

    +   • D - Queue (Double ended queue)

    +   • Priority Queue.


    # 6.3 Linear Queue


    # OVERFLOW


    If one can try to insert an element with an filled QUEUE than that situation will
    be called as the OVERFLOW.'
