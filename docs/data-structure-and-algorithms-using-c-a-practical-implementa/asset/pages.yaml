  md: '# Best Case Complexity


    If the searched value is found at the middle of the list then the comparison required
    T(n) = O(1)


    # Worst Case Complexity


    Let K, be the smallest integer such that n<=2^k and c is one constant time required
    for one comparison so,


    ```

    T(n) = T(n/2) + c

    T(2^k) = T(2^k/2) + c => T(2^k) = T(2^(k-1)) + c

    ```


    By the method of induction we have


    ```

    T(2^k) = T(2^(k-1)) + c

    T(2^(k-1)) = T(2^(k-2)) + c

    ....................

    ....................

    ....................

    T(2^1) = T(2^(k-(k-1))) + c

    ```


    ```

    T(2^k) = T(1) + kc

    T(n) <= kc   T(1) as constant

    T(n) <= c* log n, n = 2^k => k = log n

    T(n) = O(log n)

    ```


    # Program for Binary Search


    ```

    //input the elements in ascending order

    #include<iostream>

    using namespace std;

    int main()

    {

    int *a,no,up,i,low=0,f=0;

    cout<<"\nENTER HOW MANY ELEMENTS TO BE STORED IN THE LIST";

    cin>>up;

