  md: '# 9.7 Topological Sorting


    In any directed graph which has no cycle, topological sort gives the sequential
    order of all the nodes x,y and x comes before y in sequential order if a path
    exists from x to y. So this sequential order will indicate the dependency of one
    task on another.a


    For topological sorting the steps are


    +   - Take all the nodes which have zero indegree.

    +   - Delete those nodes and edges going from those nodes.

    +   - Do the same process again until all the nodes are deleted.


    Ex :


    ![](img/1faaa0256577c74e8a61f42967760aa8_350_0.png)


    The Adjacency List of the above graph is


    ```

    A -> B,F

    B -> E,F

    C -> B,D

    D -> B,E

    E ->

    F ->

    G -> E,F

    ```


    # STEP-1:


    Indegree of the Nodes are


    ```

    A=0, B=3, C=0, D=1, E=3, F=3, G=0

    ```


    # STEP-2:


    +   1) Taking all the nodes, which have zero indegree

    +      A,C,G

    +   2) Add all zero indegree nodes to queue

    +      QUEUE : A,C,G   front = 1 Rear = 3'
