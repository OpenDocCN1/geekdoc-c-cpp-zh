    # ALMOST COMPLETE BINARY TREE


    An almost complete binary TREE IS A BINARY TREE in which the following conditions
    must hold:


    +   1. All the leaves are at the bottom level or the bottom 2 levels

    +   2. All the leaves are in the leftmost possible positions and all levels are
    completely filled with nodes.


    # STRICTLY BINARY TREE


    If every non-terminal node in a binary tree consists of non empty left subtree
    and right subtree , then such a tree is called as the STRICTLY binary tree.


    # EXAMPLE


    ![](img/1faaa0256577c74e8a61f42967760aa8_257_1.png)


    # EXTENDED BINARY TREE


    A binary tree is called as extended binary tree or 2-TREE if every node of tree
    has zero or two children.'
