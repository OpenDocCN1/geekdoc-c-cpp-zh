  md: "```\nEnter a number 5\nFactorial is 120\n```\n\n# 2.3.6 C++ Null Pointer\n\n\
    It is always a good practice to assign the pointer NULL to a pointer variable\
    \ in case you do not have exact address to be assigned. This is done at the time\
    \ of variable declaration. A pointer that is assigned NULL is called a null pointer.\n\
    \nThe NULL pointer is a constant with a value of zero defined in several standard\
    \ libraries, including iostream. Consider the following program:\n\n```\n#include\
    \ <iostream>\nusing namespace std;\nint main ()\n{\n   int *ptr = NULL;\n   cout\
    \ << \"The value of ptr is \" << ptr ;\n   return 0;\n}\n```\n\nWhen the above\
    \ code is compiled and executed, it produces the following result:\n\n```\nThe\
    \ value of ptr is 0\n```\n\nOn most of the operating systems, programs are not\
    \ permitted to access memory at address 0 because that memory is reserved by the\
    \ operating system. However, the memory address 0 has special significance; it\
    \ signals that the pointer is not intended to point to an accessible memory location.\
    \ But by convention, if a pointer contains the null (zero) value, it is assumed\
    \ to point to nothing.\n\nTo check for a null pointer you can use an if statement\
    \ as follows:\n\n```\nif(ptr)     // succeeds if p is not null\nif(!ptr)    //\
    \ succeeds if p is null\n```\n\nThus, if all unused pointers are given the null\
    \ value and you avoid the use of a null pointer, you can avoid the accidental\
    \ misuse of an uninitialized pointer. Many times uninitialized variables hold\
    \ some junk values and it becomes difficult to debug the program."
