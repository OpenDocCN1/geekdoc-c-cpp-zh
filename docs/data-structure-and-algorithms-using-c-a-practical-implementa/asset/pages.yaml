- pgno: 17
  md: '# ## 1.4 Complexity of an Algorithm


    The complexity of programs can be judged by criteria such as whether it satisfies
    the original specification task, whether the code is readable. These factors affect
    the computing time and storage requirement of the program.


    # ### Space Complexity


    The space complexity of a program is the amount of memory it needs to run to completion.
    The space needed by a program is the sum of the following components:


    +   * A fixed part that includes space for the code, space for simple variables
    and fixed size component variables, space for constants, etc.

    +   * A variable part that consists of the space needed by component variables
    whose size is dependent on the particular problem instance being solved, and the
    stack space used by recursive procedures.


    # ### Time Complexity


    The time complexity of a program is the amount of computer time it needs to run
    to completion. The time complexity is of two types such as


    +   * Compilation time

    +   * Runtime


    The amount of time taken by the compiler to compile an algorithm is known as compilation
    time. During compilation time it does not calculate for the executable statements,
    it calculates only the declaration statements and checks for any syntax and semantic
    errors.


    The run time depends on the size of an algorithm. If the number of instructions
    in an algorithm is large, then the run time is also large, and if the number of
    instructions in an algorithm is small, then the time for executing the program
    is also small. The runtime is calculated for executable statements and not for
    declaration statements.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'Suppose space is fixed for one algorithm then only run time will be considered
    for obtaining the complexity of algorithm, these are


    +   - Best case

    +   - Worst case

    +   - Average case


    # Best Case


    Generally, most of the algorithms behave sometimes in best case. In this case,
    algorithm searches the element for the first time by itself. For example: In linear
    search, if it finds the element for the first time by itself, then it behaves
    as the best case. Best case takes shortest time to execute, as it causes the algorithms
    to do the least amount of work.


    # Worst Case


    In worst case, we find the element at the end or when searching of elements fails.
    This could involve comparing the key to each list value for a total of N comparisons.

    For example in linear search suppose the element for which algorithm is searching
    is the last element of array or it is not available in array then algorithm behaves
    as worst case.


    # Average Case


    Analyzing the average case behavior algorithm is a little bit complex than the
    best case and worst case. Here, we take the probability with a list of data. Average
    case of algorithm should be the average number of steps but since data can be
    at any place, so finding exact behavior of algorithm is difficult. As the volume
    of data increases, the average case of algorithm behaves like the worst case of
    algorithm.


    # 1.5 Efficiency of an Algorithm


    Efficiency of an algorithm can be determined by measuring the time, and amount
    of resources it uses for executing the program. The amount of time taken by an
    algorithm can be calculated by finding the number of steps the algorithm executes,
    while the space refers to the number of units it requires for memory storage.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# 1.6 Asymptotic Notations


    The asymptotic notations are the symbols which are used to solve the different
    algorithms and the notations are


    +   - Big Oh Notation (O)

    +   - Little Oh Notation (o)

    +   - Omega Notation (Ω)

    +   - Theta Notation (Θ)


    # Big Oh (O) Notation


    This Notation gives the upper bound for a function to within a constant factor.
    We write f(n) = O(g(n)) if there are +ve constants n0 and C such that to the right
    of n0, the value of f(n) always lies on or below Cg(n)


    # Omega Notation (Ω)


    This notation gives a lower bound for a function to with in a constant factor.
    We write f(n) = Ωg(n) if there are positive constants n0 and C such that to the
    right of n0 the value of f(n) always lies on or above Cg(n)


    # Theta Notation (Θ)


    This notation bounds the function to within constant factors. We say f(n) = θg(n)
    if there exists +ve constants n0, C1 and C2 such that to the right of n0 the value
    of f(n) always lies between c1g(n) and c2g(n)) inclusive.


    # Little Oh Notation (o)


    F(n) = o(g(n)) iff f(n) = O(g(n)) and f(n) != Ωg(n).


    # Introduction


    An important question is: How efficient is an algorithm or piece of code? Efficiency
    covers lots of resources, including:


    +   - CPU (time) usage

    +   - Memory usage

    +   - Disk usage

    +   - Network usage'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'All are important but we will mostly talk about CPU time

    Be careful to differentiate between:


    **Performance:** how much time/memory/disk/... is actually used

    when a program is running. This depends on the machine, compiler, etc.,

    as well as the code.


    **Complexity:** how do the resource requirements of a program or algorithm

    scale, i.e., what happens as the size of the problem being solved gets larger.

    Complexity affects performance but not the other way around. The time

    required by a method is proportional to the number of “basic operations”

    that it performs. Here are some examples of basic operations:


    +   one arithmetic operation (e.g., +, *).

    +   one assignment

    +   one test (e.g., x == 0)

    +   one read

    +   one write (of a primitive type)


    +   Note: As an example,

    +   O(1) refers to constant time.

    +   O(n) indicates linear time;

    +   O(n^k) (k fixed) refers to polynomial time;

    +   O(log n) is called logarithmic time;

    +   O(2^n) refers to exponential time, etc.


    n^2 + 3n + 4 is O(n^2), since n^2 + 3n + 4 < 2n^2 for all n > 10. Strictly speaking,

    3n + 4 is O(n^2), too, but big-O notation is often misused to mean equal to

    rather than less than.


    # 1.7 How to Determine Complexities


    In general, how can you determine the running time of a piece of code?

    The answer is that it depends on what kinds of statements are used.


    # 1. Sequence of statements


    ```

    statement 1;

    statement 2;

    ...

    statement k;

    ```'
  merge: -1
  img_proc: true
- pgno: 21
  md: "Note: this is code that really is exactly k statements; this is **not** an\
    \ unrolled loop like the N calls to `addBefore` shown above.) The total time is\
    \ found by adding the times for all statements:\n\n```\ntotal time = time(statement\
    \ 1) + time (statement 2) + ... + time(statement k)\n```\n\nIf each statement\
    \ is “simple” (only involves basic operations) then the time for each statement\
    \ is constant and the total time is also constant: O(1). In the following examples,\
    \ assume the statements are simple unless noted otherwise.\n\n# 2. if-then-else\
    \ statements\n\n```\nif (cond) {\n    sequence of statements 1\n}\nelse {\n  \
    \  sequence of statements 2\n}\n```\n\nHere, either sequence 1 will execute, or\
    \ sequence 2 will execute. Therefore, the worst-case time is the slowest of the\
    \ two possibilities: max(time(sequence 1), time(sequence 2)). For example, if\
    \ sequence 1 is O(N) and sequence 2 is O(1) the worst-case time for the whole\
    \ if-then-else statement would be O(N).\n\n# 3. for loops\n\n```\nfor (i = 0;\
    \ i < N; i++) {\n    sequence of statements\n}\n```\n\nThe loop executes N times,\
    \ so the sequence of statements also executes N times. Since we assume the statements\
    \ are O(1), the total time for the for loop is N * O(1), which is O(N) overall.\n\
    \n# 4. Nested loops\n\n```\nfor (i = 0; i < N; i++) {\n    for (j = 0; j < M;\
    \ j++) {\n        sequence of statements\n    }\n}\n```\n\nThe outer loop executes\
    \ N times. Every time the outer loop executes, the inner loop executes M times.\
    \ As a result, the statements in the inner loop execute a total of N * M times.\
    \ Thus, the complexity is O(N * M). In a common special case"
