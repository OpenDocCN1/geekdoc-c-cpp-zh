    The most important application of Max Priority Queue is to schedule jobs on a
    shared computer. The Max Priority queue keeps track of the jobs to be performed
    and their relative priorities. When a job is finished or interrupted the highest
    priority job is selected from those pending using Extract-Max, A new job can be
    added to the queue at any time by using Insert.


    EXTRACT_MAX operation returns the largest element. So to find the largest element
    from an unordered list takes θ(n) times. An alternative is to use an ordered linear
    list . The elements are in non decreasing order if a sequential representation
    is used.


    The Extract-Max operation takes θ(1) and the Insert time is O(n). When Max heap
    is used both Extract-max and insert can be performed in O(logn) time.


