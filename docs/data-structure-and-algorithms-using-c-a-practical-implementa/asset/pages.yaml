  md: "# Q2. How would the complexity change if the second loop went to N instead\
    \ of M?\n\nA nested loop followed by a non-nested loop:\n\n```\nfor (i = 0; i\
    \ < N; i++) {\n    for (j = 0; j < N; j++) {\n        sequence of statements\n\
    \    }\n}\nfor (k = 0; k < N; k++) {\n    sequence of statements\n}\n```\n\nAnswer:\
    \ The first set of nested loops is O(N^2) and the second loop is O(N). This is\
    \ O(max(N^2,N)) which is O(N^2).\n\n# Q3. A nested loop in which the number of\
    \ times the inner loop executes depends on the value of the outer loop index:\n\
    \n```\nfor (i = 0; i < N; i++) {\n    for (j = i; j < N; j++) {\n        sequence\
    \ of statements\n    }\n}\n```\n\nAnswer: When i is 0 the inner loop executes\
    \ N times. When i is 1 the inner loop executes N-1 times. In the last iteration\
    \ of the outer loop when i is N-1 the inner loop executes 1 time. The number of\
    \ times the inner loop statements execute is N + N-1 + ... + 2 + 1. This sum is\
    \ N(N+1)/2 and gives O(N^2).\n\n# Q4. For each of the following loops with a method\
    \ call, determine the overall complexity. As above, assume that method f takes\
    \ constant time, and that method g takes time linear in the value of its parameter.\n\
    \n+   a. `for (j = 0; j < N; j++) f(j);`\n+   b. `for (j = 0; j < N; j++) g(j);`\n\
    +   c. `for (j = 0; j < N; j++) g(k);`\n\nAnswer: a. Each call to f(j) is O(1).\
    \ The loop executes N times so it is N x O(1) or O(N). b. The first time the loop\
    \ executes j is 0 and g(0) takes “no operations”. The next time j is 1 and g(1)\
    \ takes 1 operations. The last time the loop executes j is N-1 and g(N-1) takes\
    \ N-1 operations. The total work is the sum of the first N-1 numbers and is O(N^2)."
