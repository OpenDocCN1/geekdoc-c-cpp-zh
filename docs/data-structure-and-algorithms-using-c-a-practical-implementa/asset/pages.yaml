- pgno: 255
  md: '**NODE:** Each element of a tree is called as node. It is the basic structure
    in a tree. It specifies the information and links(branches) to other data items.
    In the above diagram 14 nodes are there.


    **ROOT:** It is specially designated node in a tree. It is the first node in the
    hierarchical arrangement of data items. In the diagram A is the root node.


    **PARENT:** Parent of a node is the immediate predecessor of an node. Here B is
    the parent of E and F.


    **CHILD:** Each immediate successor of a node is known as child. In the above
    diagram B, C, D are children of A.


    **SIBLINGS:** The child nodes of a given parent node are called siblings. In the
    figure H, I, J are siblings.


    **DEGREE OF A NODE:** The number of sub-trees of a node in a given tree is called
    degree of that node. In the figure The degree of node A is 3 The degree of node
    B is 2 The degree of node G is 1 The degree of node F is 0


    **DEGREE OF TREE:** The maximum degree of nodes in a given tree is called the
    degree of the tree. In the figure the maximum degree of nodes A and D is 3. So
    the degree of Tree is 3.


    **TERMINAL NODE:** A node with degree zero is called terminal node or a leaf.
    In the figure K, F, L, H, M, N, J are terminal nodes.


    **NON-TERMINAL NODE:** Any node (except the root node) whose degree is not zero
    is called as non-terminal node. In the above tree B, E, C, G, D, I are non-terminal
    nodes.


    **LEVEL:** The entire tree structured is leveled in such a way that the root is
    always at the level 0, then its immediate children are at level 1, and their immediate
    children are at level 2 and so on up to the leaf node. The above tree has four
    levels.


    **EDGE:** Edge is the connecting line of 2 nodes. CG is an edge of the above tree.


    **PATH:** Path is the sequence of consecutive edges from the source node to the
    destination node. In the above tree the path between A and M is (A,D),(D,I),(I,M)'
