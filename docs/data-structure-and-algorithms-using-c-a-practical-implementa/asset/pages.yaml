- pgno: 274
  md: '![](img/1faaa0256577c74e8a61f42967760aa8_274_0.png)


    # SEARCHING


    To search any node in a Binary tree, initially the data item that is to be searched
    is compared with the data of the root node. If the data is equal to the data of
    the root node then the search is successful.


    If the data is found to be greater than the data of the root node then the searching
    proceeds in the right sub-tree, otherwise searching process proceeds in the left
    sub-tree.


    Repeat the same process till the element is found and while searching if Leaf
    node is found then print that the number is not found.


    # INSERTION


    To insert any node into a binary search tree, initially data item that is to be
    inserted is compared with the data of the root node.


    If the data item is found to be greater than or equal to the data item of root
    node then the new node is inserted in the right sub tree of the root node, other
    wise the new node is inserted in the left sub tree of the root node.


    Now the root node of the right or left sub tree is taken and its data is compared
    with the data that is to be inserted and the same procedure is repeated. This
    is done till the left or right sub tree where the new node to be inserted is found
    to be empty. Finally the new node is made the appropriate child of this current
    node.'
  merge: -1
  img_proc: true
- pgno: 275
  md: '# DELETION


    While deletion if the deleted node has only one sub tree, in this case simply
    link the parent of the deleted node to its sub tree.


    When the deleted node has both left and right sub then the process is too complicated
    and there we have to follow the following four cases such as


    +   - CASE1: No node in the tree contains the specified data item.

    +   - CASE2: The node containing the data item has no children

    +   - CASE3: The node containing the data item has exactly one child

    +   - CASE4: The node containing the data item has two children.


    # CASE1


    In first case we have to check the condition whether tree is empty or not.


    Condition is


    ```

    IF (ROOT = NULL)

    WRITE : "TREE IS EMPTY"

    [END OF IF]

    ```


    # CASE2


    In this case where the node to be deleted is a leaf node i.e/ its left and right
    node is not there then just delete it by assigning NULL to its parent node.


    Condition is


    ```

    IF ([left]item = NULL AND [RIGHT]ITEM = NULL)

    ```


    Ex: If we want to delete 52 than add NULL to 49.


    # CASE3


    In this case where the node having either left sub tree or right sub tree.


    Condition is


    ```

    IF ([left]item != NULL AND [RIGHT]ITEM = NULL)

    IF ([left]item = NULL AND [RIGHT]ITEM != NULL)

    ```


    Ex: If we want to delete 49 , which has only one child , so we can delete it simply
    by giving address of right child to its parent left pointer. Here 55 is the parent
    of 49 and 52 is the right child of 49. So after delete of 49 52 will be added
    to left of 55.'
  merge: -1
  img_proc: true
- pgno: 276
  md: '![](img/1faaa0256577c74e8a61f42967760aa8_276_0.png)


    # CASE4


    In this case the node to be deleted has two children. Now we have to consider
    the condition when the node has both left and right child. This can be checked
    as


    ```

    if(left[item] !=NULL AND right[item]!=NULL)

    ```


    For example Let we want to delete 78, which has left and right children, for this
    we have to first delete the item which is inorder successor of 78. Here 80 is
    the inorder successor of 78. We delete the 80 by simply giving NULL value to its
    parents left pointer.


