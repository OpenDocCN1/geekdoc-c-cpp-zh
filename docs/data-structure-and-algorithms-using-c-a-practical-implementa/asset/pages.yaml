    # ADJACENCY MATRIX


    The nodes that are adjacent to one another are represented as matrix. Thus adjacency
    matrix is the matrix, which keeps the information of adjacent or nearby nodes.
    In other words we can say that this matrix keeps the information whether the node
    is adjacent to any other node or not.


    The adjacency matrix is a sequence matrix with one row and one column for each
    vertex. The values in the matrix are either 0 or 1. The adjacency matrix of the
    graph G is a two dimensional array of size * n (Where n is the number of vertices
    in the graph) with the property that A[I][J] = 1, if the edge (Vp , Vq ) is in
    the set of edges and A[I][J] = 0 if there is no such edge.


