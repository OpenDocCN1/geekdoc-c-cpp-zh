  md: '# 2.1.1 One-Dimensional Array


    # Declaration:


    # Syntax :


    ```

    Data type variable_name[bound] ;

    ```


    The data type may be one of the data types that we are studied. The variable name
    is also same as the normal variable_name but the bound is the number which will
    further specify that how much variables you want to combine into a single unit.


    Ex : int roll[15];


    In the above example roll is an array 15 variables whose capacity is to store
    the roll_number of 15 students.


    And the individual variables are roll[0] , roll[1], roll[2], roll[3] , ...............roll[14]


    # Array Element in Memory


    The array elements are stored in a consecutive manner inside the memory. i.e./
    They allocate a sequential memory allocation.


    For Ex : int x[7]; Let the x[0] will be at the memory address 568 then the entire
    array can be represented in the memory as


    | x[0] | X[1] | X[2] | X[3] | X[4] | X[5] | X[6] |

    |---|---|---|---|---|---|---|

    | 568 | 570 | 572 | 574 | 576 | 578 | 580 |


    # Initialization:


    The array is also initialized just like other normal variable except that we have
    to pass a group of elements with in a chain bracket separated by commas.


    Ex : int x[5] = { 24,23,5,67,897 } ;

    In the above statement x[0] = 24, x[1] = 23, x[2]=5, x[3]=67,x[4]=897'
