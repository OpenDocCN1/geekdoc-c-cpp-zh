  md: '# 1. Grounded Header Linked List


    In this type of linked list the last node will have the NULL pointer.. In the
    header linked list the start pointer always points to the header node. start ->
    next = NULL indicates that the grounded header linked list is empty. Like single
    linked list and double linked list we can also perform all type of operations
    with this type of header linked list.


    ![](img/1faaa0256577c74e8a61f42967760aa8_238_0.png)


    # 2. Circular Header Linked List


    In this type of linked list the last node will point or connected to header node.
    Because in circular linked list the last node will connect to the first node of
    linked list. So formally we can say that the list does not indicate first or last
    nodes. In this case, external pointers provide a frame of reference because last
    node of a circular linked list doesnot contain the NULL pointer. Like single linked
    list and double linked list we can also perform all type of operations with this
    type of header linked list.'
