    If a function is to use arguments, it must declare variables that accept the values
    of the arguments. These variables are called the **formal parameters** of the
    function.


    The formal parameters behave like other local variables inside the function and
    are created upon entry into the function and destroyed upon exit.


    While calling a function, there are two ways that arguments can be passed to a
    function:


    | Call Type | Description |

    | :--- | :--- |

    | Call by value | This method copies the actual value of an argument into the
    formal parameter of the function. In this case, changes made to the parameter
    inside the function have no effect on the argument. |

    | Call by pointer | This method copies the address of an argument into the formal
    parameter. Inside the function, the address is used to access the actual argument
    used in the call. This means that changes made to the parameter affect the argument.
    |

    | Call by reference | This method copies the reference of an argument into the
    formal parameter. Inside the function, the reference is used to access the actual
    argument used in the call. This means that changes made to the parameter affect
    the argument. |


    By default, C++ uses **call by value** to pass arguments. In general, this means
    that code within a function cannot alter the arguments used to call the function
    and above mentioned example while calling max() function used the same method.


    # ### 2.2.4 Call By Value and Call By Reference


    When a function is called by its value then that function call is known as call
    by value.


    When a function is called by its reference/address then that function call is
    known as call by reference.'
