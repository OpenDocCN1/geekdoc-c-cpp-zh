  md: '# CONVERSION OF INFIX TO POSTFIX(reverse polish) ALGORITHM


    +   STEP 1 : First Insert a opening parenthesis at the beginning and closing parenthesis
    at the end of the expression.

    +   STEP 2 : Arrange the expression in the ARRAY.

    +   STEP 3 : Scan every element from the array and if operand than store it in
    the POSTFIX and if operator than PUSH it into the STACK followed by STEP-4 and
    STEP-5

    +   STEP 4 : If the scanned operator having Less or Equal precedence than the
    existing operator than pop out the operators from the stack till a less precedence
    operator or opening parenthesis is found.

    +   STEP 5 : If the scanned operator is a closing parenthesis than pop the operators
    from the STACK up to the Opening Parenthesis and omit them and poped operators
    will store in the POSTFIX.

    +   STEP 6 : Repeat step-3, step-4, step-5 till all the elements are scanned from
    the array.

    +   STEP 7 : Print the POSTFIX as the result.


    # CONVERSION OF INFIX TO PREFIX(POLISH) ALGORITHM


    +   STEP 1 : First Insert an opening parenthesis at the beginning and closing
    parenthesis at the end of the expression.

    +   STEP 2 : Arrange the expression in reverse order in the ARRAY by swapping
    the parenthesis (i.e/ for open use close and vice_versa)

    +   STEP 3 : Scan every element from the array and if operand than store it in
    the PREFIX and if operator than PUSH it into the STACK followed by STEP-4 and
    STEP-5

    +   STEP 4 : If the scanned operator having Less precedence than the existing
    operator than pop out the operators from the stack till a less precedence or Equal
    precedence operator or opening parenthesis is found.

    +   STEP 5 : If the scanned operator is a closing parenthesis than pop the operators
    from the STACK up to the Opening Parenthesis and omit them and poped operators
    will store in the PREFIX.

    +   STEP 6 : Repeat step-3, step-4, step-5 till all the elements are scanned from
    the array.

    +   STEP 7 : Print the PREFIX in reverse order as the result.'
