    # EXPRESSION CONVERSIONS


    In general the expressions are represented in the form of INFIX notations that
    is the operators are used in between the operands. But during the evaluation process
    the given expression is converted to POSTFIX or PREFIX according to the requirements.


    +   - **INFIX :** The operator is used in between the operands.

    +     EX : A+B

    +   - **POSTFIX :** The operator is used after the operands. It is also known
    as POLISH notation.

    +     EX : AB+

    +   - **PREFIX :** The operator is used used before the operands. It is also known
    as REVERSE POLISH notation.

    +     EX : +AB


    During conversion we have to concentrate on the precedence of the operators such
    as


    +   - PRECEDENCE

    +   - FIRST : ( ), [ ], { }

    +   - SECOND : ^, $, arrow mark

    +   - THIRD : *, /, [Left to Right]

    +   - FOURTH : + -, (Left to Right)'
