  md: '# ## 5.1 STACK


    Stack is a linear data structure which follows the principle of LIFO (Last in
    First Out). In other words we can say that if the LIFO principle is implemented
    with the array than that will be called as the STACK.


    # ## 5.2 Operations Performed With STACK


    The most commonly implemented operations with the stack are PUSH, POP.


    Besides these two more operations can also be implemented with the STACK such
    as PEEP and UPDATE.


    The PUSH operation is known as the INSERT operation and the POP operation is known
    as DELETE operation. During the PUSH operation we have to check the condition
    for OVERFLOW and during the POP operation we have to check the condition for UNDERFLOW.


    # ### OVERFLOW


    If one can try to insert an element with a filled stack then that situation will
    be called as the OVERFLOW.


    In general if one can try to insert an element with a filled data structure then
    that will be called as OVERFLOW.


    # ### Condition for OVERFLOW


    +   - Top = size - 1 (for the STACK starts with 0)

    +   - Top = size (for the STACK starts with 1)'
  merge: -1
