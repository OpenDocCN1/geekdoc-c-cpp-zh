    # DEPTH FIRST SEARCH


    The DFS uses STACK for the traversal of Graph.


    # PROCEDURE


    +   1. PUSH starting node into the STACK

    +   2. Pop an element from the STACK, if it has not traversed then traverse it,
    if it has already been traversed then just ignore it. After traversing make the
    value of visited array true for this node.

    +   3. Now PUSH all the unvisited adjacent nodes of the popped element on STACK.
    PUSH the element even if it is already on the stack.

    +   4. Repeat Step-3 and step-4 until stack is empty.


    # STEP-1


    ```

    PUSH 1 into STACK

    Top = 0 stack = 1

    ```


    # STEP-2


