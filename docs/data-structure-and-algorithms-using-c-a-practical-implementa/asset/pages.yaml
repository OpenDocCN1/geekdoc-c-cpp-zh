- pgno: 282
  md: '# 8.11 Threaded Binary Tree


    When a binary tree is represented using pointers then the pointers to empty subtrees
    are set to NULL. That is the left pointer of a node whose left child is an empty
    subtree is normally set to NULL similarly the right pointer of a node whose right
    child is an empty subtree is also set to NULL. Thus a large number of pointers
    are set to NULL. It will be useful to use these pointer fields to keep some other
    information for operations in binary tree. The most common operation in Binary
    tree is traversing. We can use these pointer fields to contain the address pointer
    which points to the nodes higher in the tree. Such pointer which keeps the address
    of the nodes higher in the tree is called as Thread. A binary tree which implements
    these pointers is called Threaded Binary Tree.


    In the context of Data structure the threaded binary tree are of three types such
    as


    +   • Left threaded Binary tree

    +   • Right threaded binary tree

    +   • Complete threaded binary tree


    # ADVANTAGE


    Thread mechanism is used to avoid recursive function call and also it saves stacks
    and memory.


    # LEFT-THREADED BINARY TREE


