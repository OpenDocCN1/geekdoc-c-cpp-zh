    # 8.2 Binary Tree


    The BINARY TREE are of THREE types such as


    +   - Complete Binary Tree

    +   - Almost Complete Binary Tree

    +   - Strictly Binary Tree

    +   - Extended Binary Tree


    # COMPLETE BINARY TREE


    A binary tree with n nodes and of depth d is a strictly binary tree all of whose
    terminal nodes are at level d. In a complete Binary Tree the out degree of every
    node is either 2 or Nil.'
