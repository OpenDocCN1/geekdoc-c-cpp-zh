    is that the string always terminates with a NULL (''\0'') character. So while
    accessing the string there is no need to use the loop frequently.(We may access
    it as a array with the help of loop). When we will access it with the loop (like
    int, float etc. array) than the NULL character will not be assigned at the end
    of it, so while printing it we are bound to use the loop again. If we want to
    convert the character array to a string so we have to assign the NULL character
    at the end of it, manually.


