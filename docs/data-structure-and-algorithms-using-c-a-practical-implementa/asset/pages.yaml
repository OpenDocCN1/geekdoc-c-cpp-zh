  md: '# 4.8 Inline Member Function


    C++ provides a facility to use the keyword inline for its conventional users.
    C++ provides an inline function where the compiler writes the code for the function
    directly in the place where it is invoked, rather than generating the target function
    for a function and invoking it every time it is needed.


    When a normal function calls it always shift the control from its call to definition
    part which will take more extra time in executing a series of instructions for
    shifting the control, saving registers, returning the value to the calling function
    and arranging the values.


    To avoid this we may replace the task with macros as For ex : #define min(a,b)
    (a<b ? a:b)


    This saves the overhead of a function call by simply replacing the expression
    min(a,b) (a<b ? a : b) textually in the program


    The major drawback of the macro is that they are not really functions and therefore
    the usual error checking does not occur during compilation.


    So to avoid this C++ introduces a new feature called as Inline function which
    is expanded in line when it is invoked. That is when a function calls then the
    compiler replaces its call with the function definition. Generally the inline
    is used for those functions which having smaller in size. The inline is not a
    command. It is a request to compiler and whether the function will be treated
    as inline or not that depends upon the compiler even if we mention the inline.


    In C++ when we define the member functions of a class inside the body then by
    default these will treated as Inline but when we will define the functions outside
    of the body of class then we have to define the function as inline explicitly.


    When we define the member function inside a class then by default the C++ compiler
    will treat it as inline but when we provide the definition of a function outside
    of a class then we may also set it as Inline by the keyword inline.


    ```

    inline return_type class_name :: function_name(data_type var............)

    {

    Body of function;

    Return(value/variable/expression) ;

    }

    ```'
