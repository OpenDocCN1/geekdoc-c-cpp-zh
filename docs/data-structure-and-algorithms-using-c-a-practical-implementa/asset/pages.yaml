  md: '# INSERTION IN B-TREE


    While insertion process we have to use the traversing. Through traversal it will
    find that key to be inserted is already existing or not. Suppose key does not
    exist in tree then through traversal it will reach the leaf node. Now we have
    to focus on two cases such as


    +   - Node is not FULL

    +   - Node is already FULL


    In the first case we can simply add the key at that node. But in the second case
    we will need to split the node into two nodes and median key will go to the parent
    of that node. If parent is also full then same thing will be repeated until it
    will get non full parent node. Suppose root is full then it will split into two
    nodes and median key will be the root.


