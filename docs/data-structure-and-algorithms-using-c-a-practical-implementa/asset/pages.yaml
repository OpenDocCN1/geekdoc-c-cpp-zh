    |---|---|---|---|---|---|---|

    | V1 | 0 | 0 | 0 | 0 | 0 | 0 |

    | V2 | 1 | 0 | 0 | 0 | 0 | 0 |

    | V3 | 0 | 0 | 0 | 0 | 0 | 0 |'
