    # 9.4 Spanning Tree


    Let a graph G = (V,E) , if it T is a sub graph of G and contains all the vertices
    but no cycles/circuit , then T may be called as Spanning Tree.


    # MINIMUM SPANNING TREE


    If a weighted graph is considered, than the weight of the spanning tree (T) of
    graph G can be calculated by summing all the individual weights, in the spanning
    tree B. but we observe that for a graph a number of spanning tree are available
    but minimum spanning tree means the spanning tree with minimum weight.


    A tree is a connected Graph with no cycles


    +   1. A graph is a tree if and only if there is one and only one path joining
    any two of its vertices.

    +   2. A connected graph is a tree if and only if every one of its edges is a
    bridge.

    +   3. A connected graph is a tree if and only if it has N vertices and N-1 edges.


    One practical implementation of MST would be in the design of network. Another
    useful application of MST is to finding airline routes.


    # 9.4.1 Kruskal Algorithm


    The Kruskal Algorithm is used to build the minimum spanning tree in forest. Initially
    each vertex is in its own tree in forest. Then algorithm'
