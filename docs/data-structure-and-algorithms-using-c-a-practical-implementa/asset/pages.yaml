  md: '# ## Strrev()

    **Purpose**: Used to find out the reverse of a string.

    **Syntax**: strrev(string);


    # ## Strcat()

    **Purpose**: Used to concatenate(join) two strings. It will append the source
    string at the end of the destination. The length of the destination will be the
    length of source + length of destination.

    **Syntax**: strcat(destination,source);


    # ## Strcmp()

    **Purpose**: Used to compare two strings.

    **Process**: The string comparison always starts with the first character in each
    string and continuous with subsequent characters until the corresponding characters
    differ or until the end of a string is reached.

    This function returns an integer value that is


    +   < 0 if s1 < s2

    +   == 0 if s1 == s2

    +   >0 if s1 > s2


    ![](img/1faaa0256577c74e8a61f42967760aa8_35_0.png)


    **Syntax** : integer_variable = strcmp(s1,s2);


    # ## Strcpy()

    **Purpose**: To copy a string to other.

    **Syntax**: strcpy(destination,source);


    # ## Strupr()

    **Purpose**: To convert all the lower case alphabets to its corresponding upper-case.

    **Syntax**: strupr(string);


    # ## Strlwr()

    **Purpose**: To convert all the upper case alphabets to its corresponding lower-case.

    **Syntax**: strlwr(string);'
