    # 6.5 Double Ended Queue


    The double ended queue is also called as D-QUEUE or DE-QUEUE or DEQUE which allows
    to perform the insertion and deletion operation at both the ends. Depending upon
    the operations this can be categorized into two types as


    +   * Input Restricted DEQUE

    +   * Output Restricted DEQUE'
