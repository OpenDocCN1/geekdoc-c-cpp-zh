    # Floyd-Warshall Algorithm


    Floyd–Warshall''s algorithm is based upon the observation that a path linking
    any two vertices u and v may have zero or more intermediate vertices. The algorithm
    begins by disallowing all intermediate vertices. In this case, the partial solution
    is simply the initial weights of the graph or infinity if there is no edge.


    The algorithm proceeds by allowing an additional intermediate vertex at each step.
    For each introduction of a new intermediate vertex x, the shortest path between
    any pair of vertices u and v, x,u,v∈V, is the minimum of the previous best estimate
    of δ(u,v), or the combination of the paths from u→x and x→v.


    The Floyd–Warshall algorithm compares all possible paths through the graph between
    each pair of vertices. It is able to do this with only Θ(|V|^3) comparisons in
    a graph. This is remarkable considering that there may be up to Ω(|V|^2) edges
    in the graph, and every combination of edges is tested. It does so by incrementally
    improving an estimate on the shortest path between two vertices, until the estimate
    is optimal.


    ```

    δ(u,v)←min(δ(u,v),δ(u,x)+δ(x,v))

    ```


    Let the directed graph be represented by a weighted matrix W.


    # FLOYD-WARSHALL (W)


    ```

    1 n ← rows [W]

    2 D(0) ← W

    3 for k ← 1 to n

    4     do for i ← 1 to n

    5         do for j ← 1 to n

    6             do d_ij^(k) ← MIN(d_ij^(k-1), d_ik^(k-1) + d_kj^(k-1))

    7 return D(n)

    ```


    The time complexity of the algorithm above is O( n3 ).'
