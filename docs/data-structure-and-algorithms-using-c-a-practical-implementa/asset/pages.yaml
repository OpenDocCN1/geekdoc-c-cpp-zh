  md: '+   3. its left subtree is completely full of height h – 1 and its right subtree
    is complete of height h – 1.


    A binary tree has the heap property if


    +   1. It is empty or


    +   2. The key in the root is larger than that in either child and both subtrees
    have the heap property.


    A heap can be used as priority queue: the highest priority item is at the root
    and is trivially extracted. But if the root is deleted , we are left with two
    sub-trees and we must efficiently re-create a single tree with the heap property.The
    value of the heap structure is that we can both extract the highest priority item
    and insert a new one in O(logn) time.


    A heap is an ordered balanced binary tree (complete binary tree) in which the
    value of the node at the root of any sub-tree is less than or equals to the value
    of either of its children.


