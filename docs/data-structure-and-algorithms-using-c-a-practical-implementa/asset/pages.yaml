  md: "A tree is a nonlinear data structure in which the elements are arranged in\
    \ the parent and child relationship manner. We can also say that in the tree data\
    \ structure the elements can also be stored in a sorted order, and is used to\
    \ represent the hierarchical relationship.\n\n> A TREE is a dynamic data structure\
    \ that represents the hierarchical relationships between individual data items.\n\
    > \n> In a tree, nodes are organized in an hierarchical way in such a way that\n\
    > \n> - There is a specially designated node called the root, at the beginning\
    \ of the structure except when the tree is empty\n> - Lines connecting the nodes\
    \ are called branches and every node except the root is joined to just one node\
    \ at the next higher level(parent)\n> - Nodes that have no children are called\
    \ as leaf nodes or terminal nodes.\n\n# 8.1 Tree Terminologies\n\n![](img/1faaa0256577c74e8a61f42967760aa8_254_0.png)"
