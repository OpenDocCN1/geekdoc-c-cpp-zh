    # ALGORITHM FOR INSERTION OF A NODE WHEN NODE NUMBER IS KNOWN


    INSNODE(START,NODE,NO)

    STEP-1: NODE. := NEXT[START]

    STEP-2: COUNT := 1

    STEP-3: REPEAT WHILE (NEXT[NODE]!=NULL)

    IF(COUNT = NO ) THEN:

    ALLOCATE A MEMORY TO NEW

    PREV[NEW] := PREV[NODE]

    NEXT[NEW] := NODE

    NEXT[PREV[NODE]] := NEW

    PREV[NODE] :=NEW

    ELSE:

    NODE. := NEXT[NODE]

    COUNT := COUNT+1

    [END OF IF]

    [END OF LOOP]

    STEP-4: INPUT : INFO[NEW]

    STEP-5: RETURN'
