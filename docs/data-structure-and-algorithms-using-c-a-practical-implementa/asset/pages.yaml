  md: '# SORTING


    Sorting means arranging the data in a particular order. i.e. either ascending
    or descending.


    There are different methods for sorting. These methods can be divided into two
    categories such as


    +   - Internal Sorting

    +   - External Sorting


    # INTERNAL SORTING


    If all the data that is to be sorted can be accommodated at a time in memory then
    internal sorting method can be used.


    # EXTERNAL SORTING


    When the data is to be sorted is so large that some of the data is present in
    the memory and some is kept in auxiliary memory(Hard disk, floppy disk, tape etc.)
    then the external sorting methods are used.


    # INTERNAL SORTING


    There are different types of internal sorting methods are used out of them some
    of are discussed. All the methods below are discussed for the ascending order.


    # 10.3 Bubble Sort


    > Bubble sort is a reasonable sort to use for sorting a fairly small number of
    items and is easy to implement.


    But for the smaller list this sorting procedure works fine.


    In this method to arrange elements in ascending order, begin with the 0th element,
    and is compared with the 1st element. If it is found to be greater than the 1st
    element then they are interchanged. Then the 1st element is compared with the
    2nd element. If it is found to be greater then they are interchanged. In the same
    way all the elements (Excluding the last) are compared with their next element
    and are interchanged if required.'
