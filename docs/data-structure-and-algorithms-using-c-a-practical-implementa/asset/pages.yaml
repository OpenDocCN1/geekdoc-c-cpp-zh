    \nAfter use of any memory it must be reusable, and its the work of the operating\
    \ system to find out those memory which are allocated but not used anywhere so\
    \ the operating system will perform a task as a result these unused memory spaces\
    \ will added into the free memory space.\n\nThe technique which does this collection\
    \ is called garbage collection.\n\nThe garbage collection may take place when\
    \ there is only some minimum amount of space or no space at all left in the free\
    \ storage list, or when the CPU is idle and has time to do the collection. The\
    \ garbage collections invisible to the programmer.\n\nMemory management system\
    \ uses the concept called compaction, which collects all free memory blocks and\
    \ places them at one location in a single free block. So the request for memory\
    \ allocation will be from this free block. Memory management system uses some\
    \ technique for tis. Different methods for assigning the requested memory from\
    \ free block such as\n\n+   - FIRST FIT METHOD\n+   - BEST FIT METHOD\n+   - WORST\
    \ FIT METHOD\n\nIn *first fit* method of memory allocation, the first entry which\
    \ has free block equal to or more than required one is taken."
