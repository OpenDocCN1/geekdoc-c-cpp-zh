  \n# 12 记录 (Records)\n\n记录是将一个或多个字段组合在一起复合类型。字段可以是任何类型，甚至是记录。\n\n## 12.1 基础记录\n\n\
  ![](img/image06814.jpeg)\n\n## 12.2 空记录\n\n空记录是指不需要数据的类型。有两种声明空记录的方法：\n\n![](img/image06815.jpeg)\n\
  \n![](img/image06816.jpeg)\n\n对于编译器来说，它们是相同的。然而，如果类型尚未完成，程序员通常会使用第一种方式表示他们计划以后扩展该类型；如果标记（tagged）记录是对象编程中的基类，他们通常会使用第二种。\n\
  \n## 12.3 记录值\n\n记录类型的值可以使用记录聚合来指定，给出一个命名组件列表如下\n\n![](img/image06817.jpeg)\n\n\
  ![](img/image06818.jpeg)\n\n对于一个较大的记录类型，\n\n![](img/image06819.jpeg)\n\n可以使用位置表示法指定值，即按照声明顺序为每个记录组件指定一个值\n\
  \n![](img/image06820.jpeg)\n\n然而，为 `Car` 聚合的组件命名具有许多优势。\n\n\n\n\n重新排列组件顺序是可能的，因为组件名称会告知编译器（以及人类读者！）预期的值关联。由于向编译器传递了这些额外信息，编译器的信息也随之得到了改进。虽然由于\
  \ Ada 的覆盖规则[2]，遗漏的组件总是会被报告，但当存在命名的关联时，错误信息可以变得具体得多。考虑上述的 `Car` 类型，假设程序员在位置表示法中错误地仅为\
  \ `BMW` 指定了两个浮点值中的一个。编译器在寻找另一个组件值时，将无法判断指定的数值是用于 `Horse_Power_kW`（马力功率）还是 `Consumption`（油耗）。如果程序员改用命名关联，例如\
  \ `Horse_Power_kW => 190.0`，就能清楚地缺少了哪一个组件。\n\n![](img/image06821.jpeg)\n\n要访问记录实例（record\
  \ instance）的组件，请使用点分隔符（`.`），例如 `BMW.Number_Wheels`。\n\n![](img/image06822.jpeg)\n\
  \n2[`www.adacore.com/2007/05/14/gem-1/`](http://www.adacore.com/2007/05/14/gem-1/)\n\
  \n## 12.4 判别记录 (Discriminated record)\n\n判别记录\n\n![](img/image06823.jpeg)\n\n##\
  \ 12.5 变体记录 (Variant record)\n\n变体记录\n\n变体记录是一种特殊的判别记录，其中某些组件的存在取决于判别符（discriminant）的值。\n\
  \n![](img/image06824.jpeg)\n\n### 12.5.1 可变与不可变变体记录\n\n你可以声明变体记录类型，使其判别符以及变体结构可以在变量生命周期内更改。这种记录被称为可变的（mutable）。在“修改”记录时，你必须一次性为正在修改的变体结构的所有组件，用一个完整的变体结构替换记录。虽然变体记录的声明允许其类型的对象是可变的，但对于对象是否可变存在某些限制。限制对象可变的原因包括：\n\
  \n- 对象是带有判别符声明的（参见下文的 `Immutable_Traffic_Light`）\n- 对象被别名化了（通过在对象声明中使用 `aliased`，或通过使用\
  \ `new` 在堆上分配）\n\n![](img/image06825.jpeg)\n![](img/image06826.jpeg)\n\n相反，你可以声明记录类型，使得判别符以及变体记录结构不可更改。要使记录类型声明变为不可变，判别符不能有默认值。\n\
  \n![](img/image06827.jpeg)\n![](img/image06828.jpeg)\n\n## 12.6 联合 (Union)\n\n联合\n\
  \n此语言特性仅适用于 Ada 2005\n\n![](img/image06829.jpeg)\n\n它与变体记录的区别在于 `Option` 并没有实际存储在记录内部，且从未进行正确性检查——它只是一个占位符。\n\
  \n这种记录通常用于与 C 交互，也可以用于其他用途（此时不使用 `pragma (C, Union);`）。\n\n## 12.7 标记记录 (Tagged\
  \ record)\n\n标记记录\n\n标记记录是其他语言中被称为“类”（class）的一部分。它是 Ada 中面向对象编程的基础[3]。 Ada 中的类所需的另外两个部分是包（package）[4]和原始操作（primitive\
  \ operations）[5]。\n\n![](img/image06830.jpeg)\n\n3 第 [187] 页的第 [22] 章\n4 第 [217]\
  \ 页的第 [22.4.2] 章\n5 第 [188] 页的第 [22.1.2] 章\n\n![](img/image06831.jpeg)\n![](img/image06832.jpeg)\n\
  Ada 2005 仅限：\n\n![](img/image06833.jpeg)\n\n## 12.8 抽象标记记录 (Abstract tagged record)\n\
  \n抽象标记记录\n\n抽象类型至少包含一个抽象原始操作，即其操作之一没有被定义，那么它的派生类型必须提供实现。\n\n## 12.9 带有别名的元素 (With\
  \ aliased elements)\n\n带有别名的元素\n\n如果你来自 C[6]/C++[7]，你可能习惯于记录的每个元素（只要不是位字段的一部分）都有地址。在\
  \ Ada 中，情况并非如此，因为记录和数组一样是可以被压缩（packed）。就像数组一样，你可以使用 `aliased` 来确保可以通过访问类型（access\
  \ type）访问元素。\n\n![](img/image06834.jpeg)\n请注意：每个元素都需要它们自己的 aliased。\n![](img/image06835.jpeg)\n\
  \n6 http://en.wikibooks.org/wiki/C_Programming\n7 http://en.wikibooks.org/wiki/C++_Programming\n\
  \n## 12.10 限制记录 (Limited Records)\n\n限制记录\n\n除了变体、标记和抽象之外，记录还可以是限制的（受限制类型没有赋值操作，也没有等值操作[8]）。在面向对象编程中，当通过引用而非拷贝来处理标记对象时，这与将对象设为限制契合。\n\
