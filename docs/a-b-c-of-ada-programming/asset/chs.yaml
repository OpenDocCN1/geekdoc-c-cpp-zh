  \ `Universal_Integer`。`S2` 中的字面量 `1` 是 `Universal_Integer` 类型，并隐式转换为 `Long_Integer`。`S3`\
  \ 隐式地将加数转换为 `root_integer`，执行计算并转换回 `Universal_Integer`。`S4` 是非法的，因为它混合了两种不同的类型。不过，你可以将其写为\n\
