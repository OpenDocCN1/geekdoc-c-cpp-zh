  \ 函数的差异。\n\n![](img/image07272.jpeg)![](img/image07273.jpeg)![](img/image07274.jpeg)\n\
  7[`en.wikibooks.org/wiki/%2FTrigonometry`](http://en.wikibooks.org/wiki/%2FTrigonometry)\n\
