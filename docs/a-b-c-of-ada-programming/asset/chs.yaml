  \ 95 的模块化类型（modular types）更适合这些操作。根据用例，可以与命名布尔数组索引（如 `Traffic_Lights' (Red => True,\
  \ others => False)`）的优势权衡。\n\n## 28.4 'Bit_Order 属性\n\n'Bit_Order 属性\n\n`'Bit_Order`\
  \ 属性并不是为了在大端字节和小端字节机器之间转换数据（它影响的是位编号，而不是字节顺序）。当指定了非原生位序时，编译器不会生成重新排序多字节字段的代码。\n\n\
  ## 28.5 'Size 属性\n\n'Size 属性\n\n一个常见的 Ada 编程错误是假设为类型 `T` 指定 `'Size` 会强制编译器为对象分配恰好该数量的位。事实并非如此。指定的\
  \ `T'Size` 将强制编译器在紧凑数组和 `Unchecked_Conversion` 中使用此大小，但编译器仍然可以为独立对象分配更多位。在对象本身上使用\
  \ `'Size` 以强制对象对象为指定的值。\n\n## 28.6 另另\n\n![](img/image0722.jpeg)\n\n18 软件生产力联盟 (1995\
