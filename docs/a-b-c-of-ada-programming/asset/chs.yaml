  9 [http://freecode.com/tags/ada?sort=vitality&with=&without=]\n\n门户\n\nAda 源代码集合\n\
  \n### AdaBasis\nAdaBasis 包含约 560 MB 的公有领域源代码和文档，主要取自公共 Ada 库 (`PAL`)。该软件经过分类，并以分层的方式呈现，分为不同的应用领域，对于某些领域，还具有额外的多维度搜索功能。\n\
  \n其目的是为学生、教师和研究人员提供大量的可重用 Ada 组件和系统，用于语言和软件工程课程。\n\nAdaBasis 由德国斯图加特大学计算机学院的编程语言小组建立。他们计划在未来扩大该库，并欢迎免费领域的贡献。如需更多建议性信息，请联系\
  \ `adabasis@informatik.uni-stuttgart.de`。\n\n### 公共 Ada 库 (PAL)\n`PAL` 是一个包含 Ada\
  \ 和 VHDL 软件及课件的库，包含超过十亿字节的材料（主要为压缩格式）。`PAL` 中的所有项目已向公众发布并不受限制发行，在大多数情况下（共享软件除外），这些项目都是免费软件。\n\
  \n### Ada 工程库版本 2 (ASE2)\n`ASE2` 库包含了通过 60 多个组织合作汇集的超过 1.1GB Ada 和软件工程材料。Walnut\
  \ Creek CDROM 曾销售过该库的副本。现在它不再维护，但仍托管在 Ada FTP 服务器上。它可能包含有用资源，但与其他库相比高度重复。\n\n###\
  \ AdaPower\n一个 Ada 工具和资源的目录及集合。\n\n## 57.4 参见\n\n\n\n参见\n\n### 57.4.1 维基书\n* Ada\
