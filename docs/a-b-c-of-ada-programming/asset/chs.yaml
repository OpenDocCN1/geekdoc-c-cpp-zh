  \n### 高级主题：冻结规则（Freezing rules）\n\n冻结规则 ([`www.adaic.com/standards/05rm/html/RM-13-14.html`](http://www.adaic.com/standards/05rm/html/RM-13-14))\
  \ 可能是 Ada 语言定义中最复杂的部分；这是因为标准试图尽可能准确地描述冻结。此外，语言定义的该部分涉及所有实体的冻结，包括泛型和通过访问值访问的对象的复杂情况。然而，如果你理解动态分发的工作原理，就可以对标记类型（tagged\
  \ types）的冻结有一个直观的理解。在该节中，我们看到编译器为每个标记类型生成一个基本操作表。程序文中发生这一点的位置就是标记类型被冻结的点，即表完整的点。类型被冻结后，不能再向其添加更多基本操作。\n\
  \n该点是以下情况中最早的：\n\n*   声明标记类型的包规范（package spec）的结束\n*   第一个派生自该标记类型的出现。示例：\n\n![](img/image07087.jpeg)\n\
