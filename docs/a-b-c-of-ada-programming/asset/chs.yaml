  \ Ada 编程是目前唯一基于 Ada 2005 标准的教程，目前正在更新到 Ada 2012。\n\n2. Lovelace 是一个在万维网（WWW）上提供的免费（不收费）自学\
  \ Ada 95 教程。Lovelace 假设用户已经熟悉另一种编程语言，如 `C`、`C++` 或 `Pascal`。Lovelace 具有交互性，包含许多短章节，大部分章节都以问题结束，以帮助用户理解材料。Lovelace\
  \ 可以直接从网上使用、下载或从 CD-ROM 运行。Lovelace 由 David A. Wheeler 开发。\n\n3. AdaTutor 是一个作为公共领域\
  \ Ada 程序分发的交互式 Ada 95 教程。该教程也有网页版。\n\n4. 《Ada-95: A guide for C and C++ programmers》是一个针对具有\
  \ C 或 C++ 风格编程语言背景程序员的简短超文本教程。它由 Simon Johnston 编写，Tucker Taft 提供了一些额外的文本。PDF 版本。\n\
  \n5. Dale Stanbrough 的《简介》（Introduction）是一组提供 Ada 简单介绍的笔记。这些材料已多年来被作为该语言的简单介绍。\n\
