  \n### 17.2.1 包规范 — 可见部分\n\n\n\n\n包规范的可见部分描述了所有子程序规范、变量、类型、常量等，这些内容对任何想要使用该包的人可见。\n\
  \n![](img/image06930.jpeg)\n\n### 17.2.2 私有部分\n\n包的私有部分有两个作用：\n\n*   完成私有类型和常量的延迟定义。\n\
  *   导出仅对包的子包可见的实体\n\n![](img/image06931.jpeg)\n\n### 17.2.3 包体\n\n包体定义了包的实现。规范中定义的所有子程序必须在体中实现。在体中可以定义新的子程序、类型和对象，这些内容对包的用户是不可见的。\n\
  \n![](img/image06932.jpeg)\n![](img/image06933.jpeg)\n![](img/image06934.jpeg)\n\
  \n#### pragma\n\n仅在运行 `GNAT`7`(#part0138.xhtml__bookmark402)` 时可用。\n\n### 17.2.4\
  \ 两种类型的包\n\n上述包分别定义了一个类型以及该类型的操作。当类型的组合被放在包的私有部分时，该包就导出了所谓的抽象数据类型[8`(#part0138.xhtml__bookmark403)`\
  \ 或简称 `ADT`。然后通过调用与相应类型相关的子程序来构造该类型的对象。\n\n另一种类型的包是抽象状态机。包将对问题领域中的单个项目进行建模，例如汽车的发动机。如果一个程序控制一辆汽车，通常只有一个发动机，或者说电机。包规范的公共部分仅声明模块（例如发动机）的操作，而不声明类型。模块的所有数据都隐藏在包体中，它们在那里作为状态变量，供包的子程序查询或操作。初始化部分将状态变量设置为它们的初始值。\n\
  \n![![](img/image06936.jpeg)\n\n7 [`en.wikipedia.org/wiki/GNAT`](http://en.wikipedia.org/wiki/GNAT)\n\
  8 [`en.wikipedia.org/wiki/Abstract_data_type`](http://en.wikipedia.org/wiki/Abstract_data_type)\n\
  \n![](img/image06937.jpeg)\n![](img/image06938.jpeg)\n\n(关于构造的说明：`begin` 之后的包初始化部分对应于\
  \ `ADT` 包的构造子程序。然而，由于状态机是一个“对象”，因此“构造”是在包初始化期间发生的。（这里它将状态变量 `The_A` 设置为它的初始值。）一个\
  \ `ASM` 包可以被视为单例 9`(#part0139.xhtml__bookmark405)`。）\n\n## 17.3 使用包\n\n### 使用包\n\
  \n要利用一个包，需要在 `with` 子句中命名它；而要使该包具有直接可见性，则需要在 `use` 子句中命名它。\n\n对于 C++ 程序员来说，Ada 的\
  \ `with` 子句类似于 C++ 预处理器的 `#include`，而 Ada 的 `use` 类似于 C++ 中的 `using namespace` 语句。特别地，`use`\
  \ 会导致与 `using namespace` 相同的命名空间污染问题，因此应该节节使用。重命名可以将长复合名缩短为可接受的长度，而 `use type` 子句则使类型的操作符可见。这些特性减少了对普通\
  \ `use` 的需求。\n\n#### 17.3.1 标准 with\n\n标准的 `with` 子句为定义单元的公共部分提供了对后续单元的可见性。导入的包可以在定义单元的任何部分使用，包括当子句在规范中使用时的包体。\n\
  \n![\n\n9 [`en.wikipedia.org/wiki/Singleton_pattern`](http://en.wikipedia.org/wiki/Singleton_pattern)\n\
  \n#### 17.3.2 Private with\n\n此语言特性仅可用 Ada 2005 中\n\n![](img/image06940.jpeg)\n\
  ![](img/image06941.jpeg)\n\n#### 17.3.3 Limited with\n\n此语言特性仅可用 Ada 2005 中\n\n\
  ![](img/image06942.jpeg)\n![](img/image06943.jpeg)\n\n#### 17.3.4 使操作符可见\n\n假设你有一个包\
  \ `Universe`，它定义了某种类型 `T`。\n\n![](img/image06945.jpeg)\n\n现在你遇到麻烦了。由于 `Universe`\
  \ 尚未构建，你无法为 `Universe` 使用 `use_package` 子句来使操作符可见，由于同样的原因也无法限定。此外，为 `Pack` 使用 `use_package`\
  \ 也没有帮助，因为操作符没有定义。\n\n你有四种选择使其合法：\n\n1. 使用 `use_package` 子句。这使得 `Universe` 中的所有声明都可见。\n\
  2. 使用重命名。这很容易出错，因为你重命名了许多操作符。\n3. 使用限定限定。这既丑陋又不可读。\n4. 使用 `use type` 子句。这使得仅 `Universe`\
  \ 中的操作符可见。\n\n等等，`use type` 子句有一种特殊的美感。假设你有一组包：\n\n![](img/image06950.jpeg)\n![](img/image06951.jpeg)\n\
  \n解决方案很简单：对 `Pack.T` 使用 `use type`，一切大好！\n\n![](img/image06952.jpeg)\n\n## 17.4\
  \ 包组织\n\n### 17.4.1 嵌套包\n\n嵌套包是定义在包内部的包。像普通包一样，它有一个公共部分和一个私有部分。从外部来看，嵌套包 `N` 中声明的项具有常规可见性；程序员可以使用全点名如\
  \ `P.N` 来引用这些项。（但不是 `P.M`。）\n\n![](img/image06953.jpeg)\n\n在包内部，声明按照它们出现的顺序变得可见。也就是说，在某个声明\
  \ `D` 之后的嵌套包 `N` 可以引用该声明 `D`。在 `N` 之后的声明 `E` 可以引用 `N` 的项[10`(#part0143.xhtml__bookmark409)`]。但它们都无法“向前看”并引用任何在它们之后的声明。例如，上面的\
  \ `N` 无法以任何方式引用 `M`。\n\n在以下示例中，类型在两个嵌套包 `Disks` 和 `Books` 中都派生了。注意父类型 `Item` 的完整声明出现在两个嵌套包之前。\n\
  \n![](img/image06954.jpeg)\n\n10 例如，`E: Integer := D + N.X;`\n\n![](img/image06955.jpeg)\n\
  ![](img/image06956.jpeg)\n\n包也可以嵌套在子程序内部。事实上，包可以声明在任何声明部分，包括块的声明部分。\n\n### 17.4.2\
  \ 子包\n\nAda 允许通过所谓的孩子（子包）扩展单元（包）的功能。除某些例外外，父包的所有功能对子包可用。这意味着父包的所有公共和私有声明对所有子包都是可见的。\n\
  \n\n\n上述示例以包的分级结构重新构建后如下。注意，顶层包 `Shelf` 不需要包 `Ada`，因此它的 `with` 子句在这里没有出现（尽管我们添加了一个用于搜索书架的\
  \ `match` 函数）：\n\n![](img/image06957.jpeg)\n\n子包的名称由父单元的名称加上子包的标识符组成，两者之间用点（dot）分隔。\n\
  \n![](img/image06958.jpeg)\n\n![](img/image06959.jpeg)\n\n`Book` 有两个类型为 `Unbounded_String`\
  \ 的组件，因此 `Ada` 现在子包的 `with` 子句中。这与嵌套包的情况不同，嵌套包要求任何一个嵌套包所需的所有单元都必须列在外层包的上下文子句中（参见\
  \ 10.1.2 上下子句 - With Clauses [`www.adaic.org/resources/add_content/standards/05rm/html/RM-10-1-2.html`](http://www.adaic.org/resources/add_content/standards/05rm/html/RM-10-1-2.html)）。因此，子包对包依赖提供了更好的控制。`With`\
  \ 子句更具局部性。\n\n新的子包 `Shelf.Disks` 看起来相似。原本在原始 `Shelf` 包私有部分的嵌套包 `Boxes` 现在被移动到了一个私有子包中：\n\
  \n![](img/image06960.jpeg)\n\n包的私有性意味着它只能被同样私有性的客户端单元使用。这些客户端包括私有兄弟单元以及兄弟单元的体（因为体永远不是公共的）。\n\
  \n子包可以像普通包一样列在上下文子句中。对子包进行 `with` 也会 `with` 父包。\n\n### 17.4.3 子单元 (Subunits)\n\n\
  子单元只是一个将体移动到其独立空间的功能，以防止外围体变得过于庞大。它也可以用于限制上下文子句的范围。\n\n子单元允许在物理上将包划分为不同的编译单元，而不破坏包的逻辑统一性。通常，每个分离的子单元对应不同的文件，允许对每个子单元进行单独编译，并为每个单元提供独立的版本控制历史。\n\
