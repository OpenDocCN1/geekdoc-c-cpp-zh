  \n# Ada 问题\n\n• AI95-00216-01 未经检查的联合体 — 无运行时判符的变体记录 [`www.ada-auth.org/cgi-bin/cvsweb.cgi/AIs/AI-00216.TXT`](http://www.ada-auth.org/cgi-bin/cvsweb.cgi/AIs/AI-00216.TXT)\n\
  \n# 13 访问类型 (Access types)\n\n## 13.1 什么是访问类型？\n\n什么是访问类型？\n\nAda 中的访问类型就是其他语言中所说的指针。它们指向位于某个特定地址的对象。因此，通常可以将访问类型视为简单的地址（尽管这种简化视图也有例外）。Ada\
  \ 并不说“指向”，而是说“授予对对象的访问权限”或“指定对象”。\n\n访问类型的对象被隐式初始化为空（null），即在未显式初始化时，它们指向空内容。\n\n\
  在 Ada 中应极少使用访问类型。在其他语言使用指针的许多情况下，有无需使用指针的其他方法。如果你需要动态数据结构，首先检查是否可以使用 Ada 容器库。特别是对于不定的记录或数组组件，可以使用\
  \ Ada 2012 的 `Indefinite_Holders` 包 (RM A.18.18) 来代替指针。\n\nAda 中有四种访问类型：池访问类型 -\
  \ 通用访问类型 - 匿名访问类型 - 访问子程序类型的访问类型。\n\n## 13.2 池访问 (Pool access)\n\n池访问\n\n池访问类型处理对在特定堆（或\
  \ Ada 中称为存储池）上创建的对象的访问。此类类型的指针不能指向栈级或库级（静态）对象，也不能指向位于不同存储池的对象。因此，池访问类型之间的转换是非法的。（可以使用\
  \ `Unchecked_Conversion`，但请注意，通过与分配时不同的存储池关联的访问对象进行释放内存是错误的。）\n\n![](img/image0837.jpeg)\n\
  \n可以使用 `size` 子句来限制相应的（实现定义的）存储池。`size` 子句设为 `0` 会禁用分配器的调用。\n\n![](img/image0838.jpeg)\n\
  \n如果未指定，存储池由实现定义。Ada 支持用户定义的存储池，因此你可以通过以下方式定义存储池：\n\n![](img/image0839.jpeg)\n\n\
  存储池中的对象使用关键字 `new` 来创建：\n\n![](img/image0840.jpeg)\n\n你通过附加 `.all` 来访问存储池中的对象。`Mother.all`\
  \ 是完整的记录；组件像往常一样用点表示法表示：`Mother.all.First_Name`。在访问组件时，隐式解引用用（即省略 `all`）可以作为一种方便的简写：\n\
  \n![](img/image0841.jpeg)\n\n隐式解引用用也适用于数组：\n\n![](img/image0842.jpeg)\n\n在拷贝访问对象时，请注意区分深拷贝和浅拷贝：\n\
  \n![](img/image0843.jpeg)\n\n### 13.2.1 从存储池中删除对象\n\n尽管 Ada 标准提到了垃圾回收器（它可以自动移除在堆上创建的所有需要的对象，未定义存储池时），但只有针对\
  \ Java 或 .NET 等虚拟机的 Ada 编译器才具有垃圾回收器。还有一个 `pragma Controlled` 指令，当它应用于此类访问类型时，可以防止对其创建的对象进行垃圾回收。请注意\
  \ `pragma Controlled` 将从 Ada 2012 中移除，详见 RM 2012 13.11.3。\n\n因此，为了从堆中删除对象，你需要使用泛型单元。如示例所示，在释放对象时要极加小心，不要创建悬空指针。（并注意，当相应的存储池不同时，使用与创建对象时不同的访问类型来释放对象是错误的。）\n\
  \n![](img/image0844.jpeg)\n\n正因为有了这种悬空指针问题，释放操作（deallocation）才被称为“未经检查的”（`unchecked`）。确保这种情况不发生是程序员的责任。\n\
  \n由于 Ada 允许用户定义存储池，你也可以尝试使用垃圾回收器库。\n\n![](img/image0845.jpeg)\n\n[Ada 库/多用途/AdaCL](http://en.wikibooks.org/wiki/Ada%20Programming%2FLibraries%2FMultiPurpose%2FAdaCL)\
  \ [23 垃圾回收](http://en.wikibooks.org/wiki/Ada%20Programming%2FLibraries%2FMultiPurpose%2FAdaCL%23Garbage_Collector)2(Ada%20Programming%2FLibraries%2FMultiPurpose%2FAdaCL%23Garbage_Collector)\n\
  \n### 13.2.2 构建引用计数指针\n\n你可以在网上找到引用计数指针的实现，称为安全指针或智能指针。使用此类类型可以避免对内存释放的担心，因为当没有更多指向对象的指针时，释放将自动完成。但要小心\
  \ - 大多数实现并没有防止故意的释放，从而破坏了使用它们据称获得的安全性。\n\n关于如何构建此类类型的优秀教程可以在 AdaCore 网站的一系列 Gems\
  \ 中找到。\n\nGem #97: Ada 中的引用计数 - 第一部分 这个小 Gem 构建了一个简单的引用计数指针，但它不能防止释放，即从本质上是不安全的。\n\
  \nGem #107: 防止引用计数类型的释放 这个 Gem 进一步描述了如何获得一种安全性不会被破坏的指针类型（任务问题除外）。这种改进安全性的代价是语法晦涩。\n\
  \nGem #123: Ada 2012 中的隐式解引用 这个 Gem 展示了如何用新的 Ada 2012 版本简化语法。（承认，这个 Gem 与引用计数关系不大，因为新语言特性可以应用于任何容器。）\n\
  \n## 13.3 通用访问 (General access)\n\n通用访问\n\n通用访问类型允许对在任何存储池、栈上或库级（静态）创建的对象进行访问。它们有两个版本，授予读写访问或只读访问。通用访问类型之间的转换是被允许的但取决于某些访问级别检查。\n\
  \n解引用与池访问类型类似。被引用的对象（池对象之外）必须声明为别名（aliased），对它们的引用通过属性 `'Access` 创建。访问级别限制防止访问存生存被访问对象，这会导致程序错误。`'Unchecked_Access`\
  \ 属性会省略相应的检查。\n\n### 13.3.1 访问变量\n\n当在定义中使用关键字 `all` 时，它们授予读写访问。\n\n![](img/image0846.jpeg)\n\
  \n![](img/image0847.jpeg)\n\n### 13.3.2 访问常量\n\n\n\n\n\n赋予被引用对象只读权限的通用访问类型在在定义中使用了\
  \ `constant` 关键字。被引用对象可以是常量，也可以是变量。\n\n![](img/image06848.jpeg)\n\n### 13.3.3 示例\n\
  \n![](img/image06849.jpeg)\n\n## 13.4 匿名访问\n\n### 匿名访问\n\n匿名访问类型也像通用访问类型一样有两个版本，根据是否出现\
  \ `constant` 关键字，分别赋予读写权限或只读权限。\n\n匿名访问可以作为子程序的参数，也可以作为判别符（discriminant）。以下是一些示例：\n\
  \n![](img/image06850.jpeg)\n![](img/image06851.jpeg)\n![](img/image06852.jpeg)\n\
  \n在使用匿名访问之前，你应该考虑使用具名的访问类型，或者更好的是，考虑 \"out\" 或 \"in out\" 修饰符是否更合适。\n\n此语言特性仅在 Ada\
  \ 2005 中可用\n\n在 Ada 2005 中，匿名访问在更多情况下是被允许的：\n\n![](img/image06853.jpeg)\n\n## 13.5\
  \ 隐式解引用\n\n### 隐式解引用\n\nAda 2012 将通过新语法简化通过指针对对象的访问。假设你有一个持有某些元素的容器。\n\n![](img/image06854.jpeg)\n\
  \n现在你如何访问存储在容器中的元素？当然你可以通过以下方式获取它们：\n\n![](img/image06855.jpeg)\n\n这将复制元素，如果元素很大，将非常遗憾。你可以通过以下方式直接访问：\n\
  \n![](img/image06856.jpeg)\n\n现在指针是危险的，因为你可能会创建这样的悬空指针：\n\n![](img/image06857.jpeg)\n\
  \n使用访问对象（accessor object）代替访问类型（access type）可以防止意外的释放（这在 Ada 2005 中仍然适用）：\n\n![](img/image06858.jpeg)\n\
  \n（关于判别符声明中的 null 排除，请见下文）。通过此类访问器访问是安全的：判别符只能用于解引用，不能复制到类型为 `Element_Ptr` 的对象，因为它的可访问级别更深。在上述形式中，访问器提供了读写权限。如果加上\
  \ `constant` 关键字，则只有只读权限。\n\n![](img/image06859.jpeg)\n\n现在对容器对象的访问如下：\n\n![](img/image06860.jpeg)\n\
  \n这里 Ada 2012 的新特性属性（aspects）派上了用场；对于目前的情况，我们需要 `Implicit_Dereference` 属性：\n\n![](img/image06861.jpeg)\n\
  \n现在，我们不需要编写上面那种长而又丑的函数调用，只需像这样省略判别符及其解引用：\n\n![](img/image06862.jpeg)\n\n注意，调用\
  \ `Get (Cont)` 是重载的——它可以表示访问对象，也可以表示元素，编译器将根据上下文选择正确的解释。\n\n## 13.6 Null 排除\n\n\
  ### Null 排除\n\n此语言特性仅在 Ada 2005 中可用\n\n所有的访问子类型都可以用 `not null` 进行修改，这样该子类型的对象就永远不会有\
  \ `null` 值，因此初始化是强制的。\n\n![](img/image06863.jpeg)\n\n语言还允许在声明第一个子类型时直接带有空排除：\n\n\
  ![](img/image06864.jpeg)\n\n然而，在几乎所有情况下都不是一个好主意，因为这使得该类型的对象几乎无法使用（例如，你无法释放分配的内存）。`not\
  \ null` 访问旨在访问子类型、对象声明和子程序参数。\n\n## 13.7 子程序访问\n\n### 子程序访问\n\n对子程序的访问允许在不知道其名称或位置的情况下调用子程序。这种访问的一种用途是众名的回调函数（callbacks）。\n\
  \n![](img/image06865.jpeg)\n\n要获取对子程序的访问，将具有适当参数和结果的 `Access` 属性应用于子程序名称。\n\n![](img/image06866.jpeg)\n\
  \n#### 13.7.1 子程序的匿名访问\n\n此语言特性仅在 Ada 2005 中可用\n\n![](img/image06867.jpeg)\n\n现在序列中\
  \ `constant` 的数量没有限制：\n\n![](img/image06868.jpeg)\n\n这是一个函数，它返回一个对函数的访问，而该函数又返回对某种类型的访问。\n\
  \n## 13.8 访问常见问题解答\n\n### 访问常见问题解答\n\n关于 Ada 访问类型的一些“常见问题”和“经常遇到的问题”（大多来自 C 语言用户）。\n\
  \n![](img/image06869.jpeg)\n\n#### 13.8.1 Access vs. access all\n\n`access all`\
  \ 可以完成简单访问能做的任何事情。因此有人可能会问：“为什么要用简单访问？”——确实，有些程序员从不使用简单访问。\n\n`Unchecked_Deallocation`\
  \ 如果使用不当，总是危险的。两次释放一个特定池的对象同样容易，而且和释放栈对象一样危险。`access all` 的优势在于你可能根本不需要使用 `Unchecked_Deallocation`。\n\
  \n教训：如果你有（或可能）正当将 `'Access` 或 `'Unchecked_Access` 存储到访问对象中，请使用 `access all` 而不必担心。如果没有，“最小权限”原则建议省略\
  \ `all`（不要开启你将不会使用的功能）。\n\n以下（可能是灾难性的）示例将尝试释放一个栈对象：\n\n![](img/image06870.jpeg)\n\
  \n使用简单访问，你至少知道自己不会尝试释放栈对象。\n\n### 13.8.2 Access vs. System.Address\n\n访问可能不同于简单的内存地址，它可能包含更多内容。例如，“对字符串的访问”通常还需要存储字符串长度的方法。如果你只需要简单的地址且不担心强类型，请使用\
  \ `System.Address` 类型。\n\n### 13.8.3 C 兼容指针\n\n创建 C 兼容访问的正确方法是使用 `pragma`：\n\n![](img/image06871.jpeg)\n\
  ![](img/image06872.jpeg)\n\n`pragma` 应应用于任何你想在 C 中使用的类型。如果类型无法兼容，编译器将向你警告。\n\n在声明\
  \ `Day_Of_Month` 时，你也可以考虑以下更短的替代方案：\n\n![](img/image06873.jpeg)\n\n在 C 中使用访问类型之前，你应该考虑使用标准的\
  \ \"in\"、\"out\" 和 \"in out\" 修饰符。`pragma` 和 `pragma` 知道参数在 C 中是如何传递的，并在 C 也会使用它们的地方自动使用指针传递参数。\n\
  \n#### 13.8.4 Where is void*?\n\n虽然这实际上是与 C 接口时的问题，但这里是一些可能的解决方案：\n\n\n\n\n\n![](img/image06874.jpeg)\n\
  \n可移植性较差但可能更好用（对于 32 位 CPU）：\n\n![](img/image06875.jpeg)\n\n通过 GNAT，你可以使用以下方法获得\
  \ 32/64 位可移植性：\n\n![](img/image06876.jpeg)\n\n更接近 `void` 的真实本质——指向零大小元素的指针是指向空记录的指针。这同时也具有为\
  \ `void` 和 `void*` 提供表示的优点：\n\n![](img/image06877.jpeg)\n\n# 13.9 细指针与胖访问类型 (Thin\
  \ and Fat Access Types)\n\n访问类型（access type）与地址（address）之间的区别将在下文中详细介绍。之所以使用 `pointer`（指针）一词是因为这是常用术语。\n\
  \n有一个预定义的单元 `System.Address_to_Access_Conversion` 可以在访问值和地址之间进行相互转换。请谨慎使用这些转换，如需文所述。\n\
  \n### 13.9.1 细指针 (Thin Pointers)\n\n细指针允许访问受限子类型（constrained subtypes）。\n\n![](img/image06878.jpeg)\n\
  \n此类子类型的对象具有静态大小，因此只需一个简单的地址即可访问它们。在数组的情况下，这通常是第一个元素的地址。\n\n对于此类类型的指针，使用 `System.Address_to_Access_Conversion`\
  \ 是安全的。\n\n### 13.9.2 胖指针 (Fat Pointers)\n\n![](img/image06879.jpeg)\n\n子类型为 `Unc`\
  \ 的对象需要约束，即起始索引和结束索引，因此指向它们的指针也需要包含这些信息。所以，像第一个组件那样的简单地址是不够的。注意，对于任何数组对象，`A'Address`\
  \ 与 `A(A'First)'Address` 是相同的。\n\n对于此类类型的指针，`System.Address_to_Access_Conversion`\
  \ 可能无法理想地工作。\n\n### 13.9.3 示例\n\n![](img/image06880.jpeg)\n\n在这里，`CO` 是一个名义受限对象（nominally\
  \ constrained），指向它的指针不需要存储约束，即一个细指针即可。相比之下，`UO` 是一个名义未受限子类型的对象，其实际子类型由初始值约束。\n\n\
  ![](img/image06881.jpeg)\n\nRM（参考手册）中的相关章节很难理解。简而言之：\n\n访问类型的目标类型被称为指定子类型（designated\
  \ subtype），在我们的示例中为 `Unc`。RM` 3.10.2(27.1/2) 要求 `Unc_Acc` 的指定子类型在静态上与对象的名义子类型匹配。\n\
  \n现在 `CO` 的名义子类型是受限的匿名子类型 `Unc` (-1 .. +1)，`UO` 的名义子类型是未受限子类型 `Unc`。在非法情况下，指定子类型和名义子类型在静态上不匹配。\n\
