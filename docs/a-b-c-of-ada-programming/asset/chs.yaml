  ## 57.1 开源项目平台\n\n开源项目平台\n\n### SourceForge\n目前 SourceForge 上托管了 200 个 Ada 项目——包括\
  \ Ada 编程入门维基书的示例程序。\n\n### GitHub\n一个基于 `Git` 的源代码仓库，有许多最近的进展。\n\n### 以 Ada 为中心的平台\n\
  有一些由 Ada 协会和个人托管的以 Ada 为中心的平台：\n\n* [http://forge.ada-ru.org]\n* http://www.ada-france.org:8081\
  \ \n* [http://codelabs.ch/]\n* http://scm.ada.cx/]\n\nBerliOS\n\n## 57.2 免费工具和库目录\n\
  \n免费工具和库目录\n\n### Ada 信息中心 — 免费工具和库\nOloh（语言摘要、`ada tag`、语言搜索）\n\nOloh 是一个开源项目目录。其主要功能是对公共仓库进行源代码分析以及对项目进行公开评审。\n\
  \n### Freecode\nFreecode（前身为 Freshmeat.net）是一个软件目录，开发者可以在此注册他们的项目，用户可以在此寻找感兴趣的软件。尽管内容与其他门户有些重复，但某些项目仅在此列出。\n\
