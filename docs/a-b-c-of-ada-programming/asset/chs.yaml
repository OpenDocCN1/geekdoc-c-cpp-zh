  \n# 6 整数类型\n\n范围（range）是一个符号整数值，其取值从 `First` 到 `Last`。它的定义如下：\n\n![](img/image06742.jpeg)\n\
  \n当将一个值赋值给具有此类范围约束的对象时，会对该值进行有效性检查；如果值不在 `First` 到 `Last` 之间，将抛出 `Constraint_Error`\
  \ 异常。\n\n在声明范围类型时，语言会在相同位置隐式声明相应的数学运算符。\n\n编译器可以自由为此自定义类型选择合适的底层硬件类型。\n\n## 6.1\
