  \n# 22 对象面向\n\n## 22.1 Ada 中的面向对象\n\nAda 中的面向对象\n\n面向对象编程是指根据“对象”来构建软件。一个“对象”包含数据并具有行为。数据通常由书中其他部分看到的常量和变量组成，但推测，它们也可能完全存储在程序之外，例如存储在磁盘或网络上。行为则由对数据进行操作的子程序组成。与过程化编程相比，面向对象的独特之处不在于某一个特性，而在于多个特性的组合：\n\
  \n- 封装（encapsulation），即将对象的实现与其接口分离开的能力；这反过来又将对象的“客户端”（它们只能以某些预定义方式使用对象）与对象的内部实现分离开来，而内部实现对外部客户端一无所知。\n\
  - 继承（inheritance），允许一种类型的对象继承另一种类型对象的数据和行为（子程序）的能力，而并不一定需要破坏封装；\n- 类型扩展（type extension），允许对象在继承的基础之上添加新的数据组件和新的子程序，并用它自己的版本替换某些继承的子程序；这被称为覆盖（overriding）。\n\
  - 多态（polymorphism），允许“客户端”在不知道对象确切类型的情况下使用对象的服务的能力，即以抽象的方式。对象的实际类型确实可以在运行时从一次调用到下一次发生变化。\n\
  \n在任何语言（甚至是汇编）中都可以进行面向对象编程。然而，如果没有语言的支持，很难正确实现类型扩展和多态。\n\n在 Ada 中，这些概念每一个都有对应的构造结构；这就是为什么\
  \ Ada 直接支持面向对象编程。\n\n- 包（Packages）提供了封装；\n- 派生类型（Derived types）提供了继承；\n- 下文描述记录扩展（Record\
  \ extensions）提供了类型扩展；\n- 下文描述的类类型（Class-wide types）提供了多态。\n\nAda 从第一个版本（1980 年的\
  \ MIL-STD-1815）开始就有封装和派生类型，这导致一些人从非常狭义意义上将该语言描述为“面向对象”。记录扩展和类类型在 Ada 95 中引入。Ada\
  \ 2005 增加了接口（interfaces）。本章其余部分将涵盖这些方面。\n\n### 22.1.1 最简单的对象：单例\n\n![](img/image07055.jpeg)\n\
  \n`Directory` 是一个由数据（电话号码和地址，假设存储在外部文件或数据库中）和行为（它可以查找并遍历匹配 `Name_Pattern` 的所有条目，并对每个条目调用\
  \ `Visit`）组成的对象。简单的包提供了封装（内部工作机制被隐藏），一对子程序提供了行为。当某种类型只能存在一个时，这种模式是合适的；因此，不需要类型扩展或多态。\n\
  \n### 22.1.2 原生操作\n\n对于以下内容，我们需要原生操作的定义：类型 `T` 的原生操作集由符合条件的子程序组成：\n\n- 立即声明在与类型相同的包内（而不是在嵌套包或子包内）；\n\
  - 接收该类型的参数，或者对于函数来说，返回该类型的对象；\n- 接收该类型的访问参数（access parameter），或者对于函数来说，返回该类型的访问值（access\
  \ value）。（预定义运算符如 `=` 是原生的。）\n\n操作可以是多个类型的原生操作，但只能是标记类型（tagged type）的原生。如果 `B` 是标记类型，以下示例是非法的。\n\
  \n![](img/image07056.jpeg)\n\n### 22.1.3 派生类型\n\n类型派生从 Ada 诞生起就是其一部分。\n\n![](img/image07057.jpeg)\n\
  ![](img/image07058.jpeg)\n\n上面的示例创建类型 `T`，它包含数据（这里是布尔，可以是任何类型）和由子程序组成的行为。通过将类型 `T`\
  \ 的细节放在包的私有部分实现了封装。`T` 的原生操作是函数 `Create`、重载过程 `Work` 以及预定义的 `=`；`Proc` 不是原生的，因为它有一个\
  \ `T` 的访问类型——不要将其与第二个过程 `Work` 中使用的访问参数混淆。派生自 `T` 时，原生操作会被继承。\n\n![](img/image07059.jpeg)\n\
  \n类型 `Q.Derived` 具有与 `P.T` 相同的数据和行为；它了数据和子程序。因此，可以写：\n\n![](img/image07060.jpeg)\n\
  \n承认，这样写的原因看起来很晦懂。这类代码的目的是拥有 `P.T` 和 `Q.Derived` 类型的对象，它们是不兼容的：\n\n![](img/image07061.jpeg)\n\
  \n该功能并不经常使用（例如用于声明物理尺寸的类型），但我在这里介绍它是为了引入后续步骤：类型扩展。\n\n### 22.1.4 类型扩展\n\n类型扩展是 Ada\
  \ 95 的一项修订。\n\n标记类型（tagged type）为动态多态和类型扩展提供了支持。标记类型带有隐藏的标记，可以在运行时标识类型。除了标记之外，标记记录就像任何其他记录，因此它可以包含任意数据。\n\
  \n![](img/image07062.jpeg)\n\n正如你所看到的，`Person.Object` 是一个对象，因为它具有数据和行为（过程 `Put`）。然而，这个对象没有隐藏它的数据；任何带有\
  \ `Person` 字的程序单元都可以直接读取和写入 `Person.Object` 中的数据。这破坏了封装，也说明了 Ada 完全分离了封装和类型概念。这里有一个封装了数据的\
  \ `Person.Object` 版本：\n\n\n\n\n\n![](img/image07063.jpeg)\n\n由于类型 `Person.Object`\
  \ 是带标记的，因此可以创建一个记录扩展（record extension），这是一种带有额外数据的派生类型。\n\n![](img/image07064.jpeg)\n\
  \n`Programmer.Object` 类型从 `Person.Object` 继承了数据和行为，即该类型的原始操作；因此可以写成：\n\n![](img/image07065.jpeg)\n\
  \n因此，`Programmer.Object` 类型作为 `Person.Object` 的记录扩展，隐式地声明了一个适用于 `Programmer.Object`\
  \ 的过程 `Put`。\n\n与未标记类型的情况一样，`Person` 和 `Programmer` 类型的对象是可以相互转换的。然而，在未标记对象可以双向转换的情况下，带标记类型的转换仅在指向根节点的方向有效。（离开根节点的转换将不得不凭空添加组件。）这种转换被称为**视图转换**（view\
  \ conversion），因为组件并没有丢失，它们只是变得不可见了。\n\n如果你要离开根节点，则必须使用扩展聚合（Extension aggregates）。\n\
  \n### 22.1.5 重写（Overriding）\n\n既然我们已经介绍了带标记类型、记录扩展和原始操作，现在就可以理解重写了。在上面的示例中，我们引入了一个带有名为\
  \ `Put` 的原始操作类型 `Person.Object`。这里是包的体：\n\n![](img/image07066.jpeg)\n\n如你所示，这个简单的操作将记录类型的两个数据组件都打印到标准输出。现在，记住记录扩展\
  \ `Programmer.Object` 还有一个额外的数据成员。如果我们写：\n\n![](img/image07067.jpeg)\n\n那么程序将调用继承的原始操作\
  \ `Put`，它将打印名称和性别，但不会额外数据。为了提供这种额外的行为，我们必须这样重写继承的过程 `Put`：\n\n![](img/image07068.jpeg)\n\
  \n![](img/image07069.jpeg)\n\n`Programmer.Put` 重写了 `Person.Put`；换句话说，它完全替换了后者。由于意图是扩展行为而非替换它，`Programmer.Put`\
  \ 将调用 `Person.Put` 作为其行为的一部分。它通过将其参数从 `Programmer.Object` 类型转换为其祖先类型 `Person.Object`\
  \ 来实现。这种结构是一种视图转换；与普通的类型转换不同，它不会创建一个新对象，也不会产生任何运行时开销。当然，重写操作调用其祖先是可选的；在某些情况下，意图确实是替换而非扩展继承的行为。\n\
  \n（注意，对于未标记类型，重写继承的操作也是可能的。在这里讨论此点的原因是，未标记类型的派生很少发生。）\n\n### 22.1.6 多态、类范围编程和动态分派\n\
  \n面向对象程序的完整威力通过多态、类范围编程和动态分派来实现，这些词其实是描述同一个单一概念的不同表述。为了解释这个概念，让我们扩展之前章节中的示例，在那个示例中，我们声明了一个带有原始操作\
  \ `Put` 的基础带标记类型 `Person.Object`以及一个带有额外数据和重写原始操作 `Put` 的记录扩展 `Programmer.Object`。\n\
  \n现在，让我们想象一个人集合。在集合中，某些人是程序员。我们想要遍历这个集合并对每个人调用 `Put`。当所考虑的人是程序员时，我们想要调用 `Programmer.Put`；当该人不是程序员时，我们想要调用\
  \ `Person.Put`。这在本质上就是多态、类范围编程和动态分派。\n\nAda 通过类范围类型（class-wide types）来实现这一概念。\n\n\
  每个带标记类型（如 `Person.Object`）都有一个对应的类型类，该类由 `Person.Object` 本身以及所有扩展 `Person.Object`\
  \ 的类型组成。在我们的示例中，这个类包含两个类型：\n\n* `Person.Object`\n* `Programmer.Object`\n\nAda 95\
  \ 定义了 `Person.Object'Class` 属性来表示对应的类范围类型。换句话说：\n\n![](img/image07070.jpeg)\n\n\n\
  \n\n# 分发 (Dispatch)\n\n分发基于对象的（隐藏）标签工作。那么，当一个原始操作 `Op1` 调用另一个原始操作 `Op2` 时会发生什么？当通过分发调用\
  \ `Op1` 时，会调用哪个操作？\n\n![](img/image07073.jpeg)\n\n在这个片段中，`Op1` 没有被重写，而 `Op2` 被重写了。`Op1`\
  \ 的体调用了 `Op2`，那么当用类型为 `Derived` 的参数调用 `Op1` 时，会调用哪个 `Op2`？\n\n答案是：Ada 对分发和重分发提供了完全的控制。如果你想要重分发，必须通过显式将参数再次转换为类范围类型（class-wide\
  \ type）来要求它。（记住：视图转换不会丢失组件，它们只是隐藏了它们。转换为类范围类型会使它们重新变得可见。）\n\n因此，`Op1` 的第一次调用（静态链接，即不分发）调用了继承的\
  \ `Op1` —— 在 `Op1` 内部，对 `Op2` 的第一次调用也是对继承的 `Op2` 的静态调用（没有重分发）。然而，第二次调用，由于参数 `R`\
  \ 被转换为类范围类型，它会分发到重写的 `Op2`。\n\n`Op1` 的第二次调用是对继承的 `Op1` 的分发调用，其行为与第一次调用完全相同。\n\n\
  为了理解这里发生了什么，隐式定义的继承自 `Op1` 只是在对参数进行视图转换后调用的父操作：\n\n![](img/image07074.jpeg)\n\n\
  ## 运行时类型识别 (Run-time type identification)\n\n运行时类型识别允许程序在运行时（间接或直接）查询对象的标签，以确定对象属于哪种类型。这一特性显然只在多态和动态分发的语境下才有意义，因此仅对标记的类型有效。\n\
  \n你可以通过成员身份测试 `in` 来判断对象是否属于某一类类型或某个特定类型，如下：\n\n![](img/image07075.jpeg)\n\n得益于\
  \ Ada 的强类型规则，运行时类型识别实际上很少需要；类范围类型和特定类型之间的区别通常允许程序员在不诉助于该功能的情况下确保对象是适当类型。\n\n此外，参考手册定义了包\
  \ `Ada.Tags` (RM 3.9(6/2))、属性 `'Tag` (RM 3.9(16,18)) 以及函数 `Ada.Tags.Generic_Dispatching_Constructor`\
  \ (RM 3.9(18.2/2))，它们允许对标签进行直接操作。\n\n### 22.1.7 创建对象\n\n《语言参考手册》关于 3.3 对象与命名数字的章节\
