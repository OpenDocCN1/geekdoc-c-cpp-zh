  \n# 19 异常\n\n## 19.1 健壮性\n\n健壮性是指系统或系统组件在检测到异常时能够以“合理”的方式运行的能力，例如：\n\n* 它接收到无效输入。\n\
  * 另一个系统组件（硬件或软件）发生故障。\n\n以电话交换机控制程序为例。当线路故障时，控制程序应该做什么？仅仅停止是不可接受的——因为所有通话都会失败。更好的做法是仅放弃当前通话，记录该线路已离线并继续。更好的做法是尝试重用该线路——故障可能是瞬时的。健壮性在所有系统中都是理想的，但在关乎人类安全或福利的系统中至关重要，例如医院病人监控、飞机电传控制系统、核电站控制等。\n\
  \n## 19.2 模块、前置条件和后置条件\n\n可以使用前置条件和后置条件定义模块。前置条件（precondition）是模块输入应当满足的条件。后置条件（postcondition）是满足前置条件的情况下模块输出必须满足的条件。如果模块的前置条件没有满足，模块应该做什么？\n\
  \n* 停止？即使有诊断信息，这通常也是不可接受的。\n* 使用全局结果码？可以设置结果码来指示异常。随后，它可以由能够执行错误恢复的模块进行测试。问题：这会导致相关模块之间产生紧耦合。\n\
  * 每个模块都有自己的结果码？这是一个参数（或函数结果），可以被设置以指示异常，并由调用它的模块进行测试。问题：(1) 设置和测试结果码往往会淹没正常情况的逻辑；2)\
  \ 结果码通常会被忽略。\n* 异常处理——Ada 的解决方案。模块在检测到异常时抛出一个异常。同一个模块或另一个模块可以处理该异常。\n\n异常机制允许对异常情况进行清晰、模块化的处理：\n\
  \n* 单元（例如块或子程序体）可以抛出异常，以信号检测到了异常。抛出异常的计算将被放弃（并且永远无法恢复，尽管可以重新启动）。\n* 单元可以传播自己抛出的异常（或从它所调用的另一个单元传播出来的异常）。\n\
  * 单元也可以选择处理此类异常，允许程序员对异常情况进行自定义恢复。异常处理程序与正常情况的代码是分离的。\n\n## 19.3 预定义异常\n\n预定义异常是在\
  \ `Standard` 中定义的异常。每种语言定义的运行时错误都会导致抛出一个预定义异常。示例包括：\n\n* `Constraint_Error`：当子类型的约束未被满足时抛出。\n\
  * `Program_Error`：当在保护对象内部调用保护操作时抛出，例如。\n* `Storage_Error`：由于存储耗尽抛出。\n* `Task_Error`：当由于操作系统资源不足导致无法激活任务抛出，例如。\n\
  \nEx. 1\n![](img/image0698.jpeg)\n\nEx. 2\n![](img/image0699.jpeg)\n\nEx. 3 比较以下方法：\n\
  ![](img/image0670.jpeg)\n![](img/image0671.jpeg)\n\n传递 `Compute_Sqrt` 负参数会导致 `OK`\
  \ 被设置为 `False`。`Triangle` 使用它来确定自己的状态参数，并一直向上调用树传递，相比之下\n![](img/image0672.jpeg)\n\
  \n传递 `Sqrt` 负参数会在 `Sqrt` 内部显式抛出 `Constraint_Error` 并向外传播。`Triangle` 只是传播了异常（通过不处理它）。或者，我们可以通过类型系统来捕获错误：\n\
  ![](img/image0673.jpeg)\n\n现在传递 `Sqrt` 负参数会在调用点抛出 `Constraint_Error`。`Sqrt` 甚至不会被进入。\n\
  \n## 19.4 输入输出异常\n\n预定义软件包 `Ada.Text_IO` 中的子程序抛出的异常示例有：\n\n* `End_Error`：由 `Get`、`Skip_Line`\
  \ 等抛出，如果到达文件末尾。\n* `Data_Error`：由 `Integer_IO` 中的 `Get` 等抛出，如果输入不是预期类型的字面量。\n* `Mode_Error`：由尝试从输出文件读取或向输入文件写入等操作抛出。\n\
  * `Layout_Error`：由在文本 I/O 操作中指定了无效的数据格式抛出，Ex. 1\n![](img/image0674.jpeg)\n\n## 19.5\
  \ 异常声明\n\n异常的声明方式类似于对象，但它们并不是对象。例如，递归进入声明了异常的作用范围不会创建同名的新异常；而是重用外部作用范围中声明的异常。\n\n\
  Ex. 1\n![](img/image0675.jpeg)\n\nEx. 2\n![](img/image0676.jpeg)\n![](img/image0677.jpeg)\n\
  \n## 19.6 抛出异常\n\n`raise` 语句显式抛出一个指定的异常。Ex. 1\n![](img/image0678.jpeg)\n\n## 19.7\
  \ 异常处理与传播\n\n异常处理程序可以组合在块、子程序体的结尾。处理器可以是任何以下方式结束的语句序列：\n\n* 完成；\n* 执行返回语句；\n* 抛出不同的异常（raise\
  \ e;`);\n* 重新抛出相同的异常（raise;）。\n\n假设异常 `e` 在语句序列 `U`（块、子程序体）中抛出。\n\n* 如果 `U` 包含 `e`\
  \ 的处理器：执行该处理器，然后离开 `U`。\n* 如果 `U` 不包含 `e` 的处理器：`e` 传播出 `U`；实际上，`e` 在 `U` 的“调用点”抛出。\n\
  \n因此，抛出异常会导致负责的语句序列在异常发生点被放弃。它没有、也无法恢复。\n\nEx. 1\n![](img/image0679.jpeg)\n\n##\
  \ 19.8 异常发生的信息\n\n关于异常发生的信息\n\n\n\n\nAda 提供了关于 `Exception_Occurrence` 类型对象的异常信息，该类型定义在\
  \ `Ada.Exceptions` 中，并附带了以该类型作为参数的程序：\n\n• `Exception_Name`: 使用点号表示法并全大写字母返回完整的异常名称。例如，`Queue.Overflow`。\n\
  \n• `Exception_Message`: 返回与发生次数关联的异常消息。\n\n• `Exception_Information`: 返回一个包含异常名称和相关异常消息的字符串。\n\
  \n获取异常发生对象使用以下语法：\n\n![](img/image06980.jpeg)\n\n![](img/image06981.jpeg)\n\n当异常消息不是由抛出异常的用户设置时，其内容是由实现定义的（implementation\
  \ defined）。它通常包含异常的原因和抛出位置。\n\n用户可以使用程序 `Raise_Exception` 过程来指定消息。\n\n![](img/image06982.jpeg)\n\
  \n从 Ada 2005 开始，可以使用更简单的语法将字符串消息与异常发生关联。\n\n![](img/image06983.jpeg)\n\n`Ada.Exceptions`\
  \ 包还提供了用于保存异常发生对象并重新抛出它们的子程序。\n\n## 19.9 另参见\n\n另参见\n\n### 19.9.1 Wikibook\n\n•\
