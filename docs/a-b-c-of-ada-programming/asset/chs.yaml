  \n## 21.4 终止 (Termination)\n\n### 终止\n服务器任务通常包含无限循环，以便它们连续处理任意数量的调用。但在任务终止之前，控制无法离开任务主，因此我们需要一种让服务器知道何时应该终止。这是通过选择等待（selective\
  \ wait）中的 `terminate` 备分支来实现。\n\n![](img/image07043.jpeg)\n\n### Ex. 9\n![](img/image07044.jpeg)\n\
  \n任务在以下情况下终止：\n1. 至少有一个 `terminate` 备分支开启，且\n2. 对其入口没有待处理的调用，且\n3. 同一主的所有其他任务处于相同状态（或已终止），且\n\
  4. 任务主已完成。\n\n## 21.5 超时 (Timeout)\n\n任务可能需要避免被慢速服务器阻塞。定时入口（timed entry）允许客户端在尝试的入口被撤回并执行备用分支之前指定最大延迟。\n\
  \n### Ex. 10\n![](img/image07045.jpeg)\n\n![](img/image07046.jpeg)\n\n对称地，选择等待中的延迟允许服务器超时。\n\
  \n### Ex. 11\n![](img/image07047.jpeg)\n\n![](img/image07048.jpeg)\n\n## 21.6 条件入口调用\
  \ (Conditional entry calls)\n\n入口调用可以是条件的，以便在没有立即实现汇（rendezvous）时被撤回。这使用了 `else`\
  \ 语句。\n\n![](img/image07049.jpeg)\n\n![](img/image07050.jpeg)\n\n## 21.7 重排语句 (Requeue\
  \ statements)\n\n`requeue` 语句允许接受语句或入口体在完成的同时重定向到不同的或相同的队列。调用的入口必须共享相同的参数。\n\n##\
  \ 21.8 调度 (Scheduling)\n\nFIFO，优先级反转回避。\n\n## 21.9 接口 (Interfaces)\n\n此语言特性仅在 Ada\
