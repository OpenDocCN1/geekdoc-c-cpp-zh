  \ `Enclosing` 上的类型转换。\n\n## 22.2 类名\n\n### 类名\n\n类包（class package）和类记录（class record）都需要名称。在理论上它们可以有相同的名称，但在实践中，当你使用\
  \ `use` 子句时，这会导致糟糕的（因为错误信息不直观）名称冲突。因此，随着时间的推，三种事实上的命名标准被广泛使用。\n\n#### 22.2.1 Classes/Class\n\
  \n包用复数命名，记录用对应的单数形式命名。\n\n![](img/image07110.jpeg)\n\n这种约定通常在 Ada 的内置库中使用。\n\n缺点：某些“复数形式”拼写很复杂，特别是对于我们这些非英语母语者的人来说。\n\
  \n#### 22.2.2 Class/Object\n\n包以类名命名，记录直接命名为 `Object`。\n\n![](img/image07111.jpeg)\n\
  \n大多数 UML[5](http://en.wikipedia.org/wiki/Unified%20Modeling%20Language) 和 IDL[6](http://en.wikipedia.org/wiki/Interface%20description%20language)\
  \ 代码生成器都使用这种技术。\n\n缺点：你无法同一时间对超过一个这样的类包使用 `use` 子句。但你始终可以使用“类型”来代替包。\n\n![](img/image07112.jpeg)\n\
  \n#### 22.2.3 Class/Class_Type\n\n包以类名命名，记录后部带有 `_Type`。\n\n![](img/image07113.jpeg)\n\
  \n缺点：有很多难陋的 `_Type` 后缀。\n\n## 22.3 针对 C++ 程序员的面向对象 Ada\n\n面向 C++ 程序员的面向对象 Ada\n\n\
  在 C++ 中，构造结构\n\n![](img/image07114.jpeg)\n\n严格等同于 Ada 中的以下内容：\n\n![](img/image07115.jpeg)\n\
  \n在 C++ 中，成员函数隐式地接收一个类型为 `C*` 的参数 `this`。在 Ada 中，所有参数都是显式的。因此，`u()` 不接受参数这一事实在 C++\
  \ 中是隐式的，但在 Ada 中是显式的。\n\n在 C++ 中，这是一个指针。在 Ada 中，显式的 `This` 参数不需要是指针；因为所有标记类型（tagged\
  \ type）的参数都是隐式按引用传递的。\n\n### 22.3.1 静态分发\n\n在 C++ 中，函数调用在以下情况下进行静态分发：\n\n- 调用目标是一个对象类型\n\
  - 成员函数是非虚的\n\n例如：\n\n![](img/image07116.jpeg)\n\n两者都进行静态分发。特别是，`v()` 的静态分发可能会令人困惑；这是因为对象既不是指针也不是引用。Ada\
  \ 在这方面完全相同，只是 Ada 将此称为静态绑定（static binding）而不是分发：\n\n![](img/image07117.jpeg)\n\n\
