  \ 必须冻结。\n\n*   标记类型变量的声明。示例：\n\n![](img/image07088.jpeg)\n\n直观地说：在声明 `V` 之后，可以调用该类型在该上的任何基本操作。因此，基本操作列表必须是已知且完整的，即已冻结。\n\
