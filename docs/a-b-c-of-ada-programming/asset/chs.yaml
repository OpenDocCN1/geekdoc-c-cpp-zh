  \n# 3 构建\n\nAda 程序的构建通常比 C 或 C++ 等其他语言更简单，后者经常需要 Makefile。这是因为 Ada 源文件已经指定了其源单元的依赖关系。更多信息请参见\
  \ `with` 关键字。\n\n参考手册并未定义 Ada 程序的构建，因此该过程完全取决于编译器。通常编译器工具包包含一个 make 工具，用于编译主程序及其所有依赖项，并链接成可执行文件。\n\
  \n\n\n\n\n此列表尚未完整。你可以通过添加其他编译器的构建信息来帮助 Wikibooks。\n\n### 3.1.1 GNAT\n\n使用 `GNAT`，你可以运行此命令：\n\
  \n![](img/image06627.jpeg)\n\n如果文件包含一个过程（procedure），`gnatmake` 将生成一个以该过程作为主程序的可执行文件。否则，例如一个包（package），`gnatmake`\
  \ 将编译该单元及其所有依赖项。\n\n#### GNAT 命令行\n\n`gnatmake` 可以写成一个单词 `gnatmake` 或两个单词 `gnat\
  \ make`。要查看完整的选项列表，请输入 `gnat`。输出将如下所示：\n\n![](img/image06628.jpeg)\n\n- [1. with](http://.wikibooks.org/Programming%2Fwith)\n\
  - [2. wikibooks.org](http://.wikibooks.org/index.php?action=edit)\n- [3. GNAT](http://en.wikipedia.org/wiki/GNAT)\n\
  - [4. image0663.jpeg](https://en.wikipedia.org/wiki/GNAT%2FProgramming)\n- [5. Integrated\
  \ development environment](http://en.wikipedia.org/wiki/Integrated%20development%20environment)\n\
  - [6. Studio](http://en.wikipedia.org/wiki/Studio)\n- [7. graphical interface](http://en.wikipedia.org/wiki/Graphical%20user%20interface)\n\
  - [8. Emacs](http://en.wikipedia.org/wiki/Emacs)\n- [9. KDevelop](http://en.wikipedia.org/wiki/KDevelop)\n\
  - [10. Vim (text editor)](http://en.wikipedia.org/wiki/Vim%20%28text%20editor%29)\n\
  - [11. script.php?script_id=1609](http://www.vim.org/scripts/script.php?script_id=1609)\n\
  - [12. gnuada.org/](http://gnuada.org/)\n- [13. GNU Compiler Collection](http://en.wikipedia.org/wiki/GNU%20Compiler%20Collection)\n\
  - [14. Debugger](http://en.wikipedia.org/wiki/Debugger)\n\n`GNAT` 工具链包含一个名为 `GPS`\
  \ 的 IDE。你需要单独下载并安装它。`GPS` 具有图形化界面。\n\n### 3.1.2 Rational\n\nRational 是一个包含编辑器、编译器、调试器、覆盖率分析等的环境。视图（view）是一个开发环境。每个\
  \ Ada 编译单元必须位于自己的文件中。在编译单元时，编译器会跟踪 `with` 子句。如果在一个执行编译的子系统中没有找到该单元，编译器将搜索导入列表（仅考虑直接导入）。单元可以纳入版本控制。在每个子系统中，可以定义一组历史。一个\
  \ Ada 单元可以在历史中被控制。如果你想编辑它，必须先将其检出（checkout）——它将获得一个新的版本号。更改后，你可以再次将其检入（check in），即使更改永久（或者放弃更改，即返回之前的版本）。你通常只在开发视图中检出单元；发布视图可以禁止检出。\n\
  \n### 3.1.3 ObjectAda\n\nObjectAda 是一套用于编辑、编译、导航和调试用 Ada 编写的程序的工具。ObjectAda 有多个版本。对于某些版本，你为运行工具的相同平台和操作系统编译程序。这些被称为原生（native）。一个可能的平台是\
  \ Java 虚拟机。\n\n这些说明适用于原生的 Microsoft Windows 版本。你可以从 IDE 或命令行运行翻译工具。\n\n\n\n\n无论你倾向于从\
  \ IDE 还是从命令行工作，都需要进行一些记录工作。这是通过创建一个项目来实现。每个项目由若干源文件以及若干设置组成，例如附加 Ada 库的搜索路径和其他依赖项。每个项目还至少有一个目标（target）。通常，有一个调试目标（debug）和一个发布目标（release）。目标的名称指示了它们的用途。在某些时候为了调试进行编译（通常在开发期间），而在其他时间使用不同的设置进行编译，例如当程序准备发布时。`ObjectAda`\
  \ 的某些（所有商业？）版本允许 `Java (VM)` 目标。\n\n### 3.1.4 用于 VMS 的 DEC Ada\n\nDEC Ada 是一个用于\
  \ VMS 的 Ada 83 编译器。虽然“DEC Ada”可能是大多数用户熟悉的名称，但该编译器现在被称为“HP Ada”。它之前也被称为 \"VAX Ada\"\
  \ 和 \"Compaq Ada\"。\n\nDEC Ada 使用真正的库管理系统——因此你需要做的第一件事是创建并激活一个库：\n\n![](img/image06631.jpeg)\n\
