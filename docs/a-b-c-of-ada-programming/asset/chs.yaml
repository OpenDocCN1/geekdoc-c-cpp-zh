  \n# 17 包 (Packages)\n\nAda 鼓励将代码划分为名为“包”的独立模块。每个包可以包含任意组合的项。\n\n使用包的一些优点是：\n- 包的内容被放置在独立的命名空间中，防止命名冲突；\n\
  - 包的实现细节可以对程序员隐藏（信息隐藏）；\n- 面向对象要求在包内定义一个类型及其原始子程序；以及\n- 包可以被单独编译。\n\n包的某些更常用用法包括：\n\
  - 一组相关的子程序及其共享数据，其中这些数据在包外部不可见；\n- 一个或多个数据类型以及操作这些数据类型的子程序；以及\n- 一个可以在不同条件下实例化的泛型包（generic\
  \ package）。\n\n![](img/image06928.jpeg)以下引用自当前版 Ada 参考手册第 7 章：包。RM 7(1) [http://www.adaic.org/resources/add_content/standards/05rm/html/RM-7-.html]\n\
  \n## 17.1 独立编译\n\n独立编译\n\n将包声明和包体编写在单独的文件中分别编译是非常常见的做法。这样做将包置于库级别，所有其他代码都可以通过 `with`\
  \ 语句访问它——如果需要更严格的作用范围，只需在适当的作用范围内声明该包（如果需要，还需包体）即可。通过指定一个或多个子程序实现是相互独立的，可以将包体划分为多个文件。\n\
  \nAda 相比大多数其他编程语言的最大优势之一是其定义良好的模块化和独立编译系统。尽管 Ada 允许独立编译，但它通过强制编译和兼容性规则，维持了多次编译之间的强类型检查。Ada\
  \ 使用的是独立编译（类似于 Modula-2[1], Java[2]），而不是相互独立编译（如 C[4]/C++[5] 那样），在后者中各个部分是在不了解其他编译单元的情况下进行编译的。\n\
  \n给 C/C++ 用户的提示：是的，你可以使用预处理器来模拟独立编译——但这仅仅是模拟，最小的错误也会导致非常难以发现的缺陷。令人深思，包括 D[6] 在内的所有\
  \ C/C++ 后继语言都放弃了独立编译和预处理器的使用。因此，了解 Ada 从 Ada-83 开始开始就有独立编译且可能是最复杂的很好。\n\n## 17.2\
  \ 包的部分\n\n包通常由两部分组成：规范（specification）和包体（body）。包规范可以进一步分为两个逻辑部分：可见部分和私有部分。规范的可见部分是强制性的。规范的私有部分是可选的，包规范可能没有包体——包体的存在仅是为了完成规范中的任何不完整项。子程序声明是最常见的不完整项。如果没有不完整的声明，则没有包体；如果规范中有不完整的声明，则必须有包体。\n\
  \n为了理解这种三分划分的价值，考虑一个已经发布并在使用的包。对规范的可见部分的更改需要所有软件的程序员验证该更改是否影响调用代码。对声明的私有部分的更改需要重新编译所有调用代码，但不需要审查。然而，对私有部分的某些更改可能会改变客户端代码的含义。一个例子是将私有记录类型更改为私有访问类型（access\
  \ type）。这种更改可以在私有部分完成，但会改变客户端代码中赋值操作的语义含义。对包体的更改只需要重新编译包含包体的文件，因为包体外部的任何内容都无法访问包体内的任何内容（规范部分中的声明除外）。\n\
  \n这三个部分的常见用法是：在可见部分声明记录类型的存在以及一些操作该运行的子程序，在私有部分定义记录类型的实际结构，并在包体中提供实现子程序的代码。\n\n\
