  \n![](img/image07118.jpeg)\n\n在 Ada 中，原始程序调用当且仅当满足以下条件时进行（动态）分发：\n\n- 目标对象是类类型（class-wide\
  \ type）；\n\n注意：在 Ada 术语中，分发（dispatching）总是指动态。例如：\n\n![](img/image07119.jpeg)\n\n\
  可以看到，不需要访问类型（access types）或指针即可完成分发。在 Ada 中，标记类型始终按引用传递给子程序，不需要访问值。还要注意，在 C++ 中，类充当了：\n\
  \n- 封装单元（Ada 使用包和可见性来实现此）\n- 类型，就像在 Ada 中一样。\n\n因此，你在 C++ 中调用 `C::u()` 是因为 `u()`\
  \ 被封装在 `C` 中，而在 Ada 中调用 `P.U` 是因为 `U` 被封装在包 `P` 中，而不是类型 `C` 中。\n\n#### 22.3.3 类类型和特定类型\n\
  \n对于 C++ 程序员来说，最令人困惑的部分是“类类型”的概念。为了帮助你理解：\n\n- C++ 中的指针和引用实际上是隐式的、类类型的；\n- C++ 中的对象类型实际上是特定的（specific）；\n\
  - C++ 没有提供方法声明等同于以下内容：\n\n![](img/image07120.jpeg)\n\n- C++ 没有提供方法声明等同于以下内容：\n\n\
  ![](img/image07121.jpeg)\n\n这 Ada 中是两种不同的、不兼容的类型，可能从不同的存储池中分配内存！\n\n- 在 Ada 中，不需要访问值来进行分发。\n\
  - 在 Ada 中，使用访问值进行内存管理（仅限），使用类类型进行分发（仅限）。\n- 在 C++ 中，使用指针和引用同时进行内存管理和分发。\n- 在 Ada\
  \ 中，类类型是显式的（使用 `Class`）。\n- 在 C++ 中，类类型是隐式的（使用 `*` 或 `&`）。\n\n### 22.3.4 构造函数\n\n\
  在 C++ 中，用特殊语法声明构造函数：\n\n![](img/image07122.jpeg)\n\n构造函数不能是虚的。类可以根据参数需要多个构造函数。\n\
  \nAda 没有这种构造函数。也许它们被认为是不必要的，因为在 Ada 中，任何返回标记类型对象的函数都可以作为构造函数。但这等同于 C++ 那种真正的构造函数；这种差异在派生树的情况下最为明显（见下文的\
  \ Finalization）。Ada 构造程序不需要特殊的名称，并且可以根据需要有多个构造函数；每个函数都可以根据情况带有参数。\n\n![](img/image07123.jpeg)\n\
  \n如果一个 Ada 构造函数也是原始操作（如上例所示），它在派生时变为抽象的，如果派生类型本身不是抽象的，则必须重写。如果你不想这样做，可以在嵌套作用域内声明此类函数。\n\
  \n在 C++ 中，一种惯用法拷贝构造函数及其赋值运算符：\n\n![](img/image07124.jpeg)\n\n这种拷贝构造函数在初始化时被隐式调用，例如\n\
  \n![](img/image07125.jpeg)\n\nAda 通过控制类型（controlled types）提供了类似的功能。控制类型是扩展了定义类型\
  \ `Ada.Finalization.Controlled` 的类型：\n\n![](img/image07126.jpeg)\n\n注意 `Initialize`\
  \ 不是构造函数；它在某些方面类似于 C++ 构造函数，但也很多不同。假设你有一个派自 `T` 的类型 `T1`，并对 `Initialize` 有相应的重写。真正的构造函数（如\
  \ C++ 那种）会自动先构造父组件（T），然后构造子组件。在 Ada 中，这不是自动的。为了在 Ada 中模拟这种效果，我们必须写：\n\n![](img/image07127.jpeg)\n\
  \n![](img/image07128.jpeg)\n\n\n\n当没有给出初始值时，编译器在为每个类型为 `T` 的对象分配内存后插入一个对 `Initialize`\
  \ 的调用。它还会在对对象的每次赋值后插入一个对 `Adjust` 的调用。因此，以下声明：\n\n![](img/image07129.jpeg)\n\n将执行：\n\
  \n* 为 `A` 分配内存\n* 调用 `Initialize(A)`\n* 为 `B` 分配内存\n* 将 `X` 的内容拷贝到 `B`\n* 调用 `Adjust(B)`\n\
  \n由于使用了显式初始化，不会调用 `Initialize(B)`。因此，拷贝构造函数的等效实现是重写 `Adjust`。\n\n如果你想为扩展其他非受控类型的类型提供此功能，请参见“多重继承”7。\n\
  \n### 22.3.5 析构函数\n\n在 C++ 中，析构函数是一个只有一个隐式 `this` 参数的成员函数：\n\n![](img/image07130.jpeg)\n\
  \n构造函数不能是虚的，但析构函数必须是虚的。遗憾的是，C++ 语言规则并没有强制这一点，因此程序员很容易因为忘记写 `virtual` 关键字而给程序带来灾难。\n\
  \n在 Ada 中，等效的功能再次通过受控类型提供，通过重写 `Finalize`过程实现：\n\n![](img/image07131.jpeg)\n\n![](img/image07132.jpeg)\n\
  \n7 第 22.4.2 章，位于第 217 页\n\n![](img/image07133.jpeg)\n\n由于 `Finalize` 是一个基本操作，它是自动“虚”的；在\
  \ Ada 中，你不会忘记将析构函数设为虚。\n\n## 22.3.6 封装：公共、私有保护成员\n\n在 C++ 中，封装的单元是类；在 Ada 中，封装的单元是包（package）。这影响了\
  \ Ada 程序员放置对象类型各种组件的方式。\n\n![](img/image07134.jpeg)\n\n在 Ada 中模拟这种 C++ 类的一种方法是定义类型层次结构，其中基类型是公共部分，它必须是抽象的，以便无法定义该基类型的任何独立对象。如下所示：\n\
  \n![](img/image07135.jpeg)\n\n![](img/image07136.jpeg)\n\n私有部分仅定义为存根（stub），其完整实现隐藏在包体中。为了使其成为完整类型的一部分，我们必须使用指针，因为该组件的大小仍然未知（指针的大小是编译器已知的）。遗憾的是，使用指针时我们面临着内存泄漏的危险，因此我们必须将私有组件设为受控的。\n\
  \n为了进行简单测试，这是包体，其中子程序体提供了标识性打印：\n\n![](img/image07137.jpeg)\n\n![](img/image07138.jpeg)\n\
  \n我们看到，由于这种构造，私有过程并不是一个基本操作。让我们定义一个子类，以便可以保护操作：\n\n![](img/image07139.jpeg)\n\n\
  子类可以查看父类的私有部分，因此可以看到该保护过程：\n\n![](img/image07140.jpeg)\n\n这是一个简单的测试程序，其输出所示。\n\n\
  ![](img/image07141.jpeg)\n\n这是测试程序的注释输出：\n\n![](img/image07142.jpeg)\n\n你可以看到，将\
  \ C++ 行为直接翻译成 Ada 是困难的，如果真的可行的话。我想，Ada 的基本子程序更对应于 C++ 的虚方法（在示例中，它们并不是的）。每种语言都有必须考虑的特殊之处，因此尝试将代码从一种语言直接翻译成另一种语言可能不是最佳方法。\n\
  \n## 22.3.7 解封装：友元与流输入输出\n\n在 C++ 中，友元函数或类可以查看其所属友元类的所有成员。友元破坏了封装，因此不建议使用。在 Ada\
  \ 中，由于封装的单元是包而不是类，因此“友元”子程序仅仅是指与标记类型（tagged type）在同一个包中声明的程序。\n\n在 C++ 中，流输入输出是通常需要友元的特殊情况：\n\
  \n![](img/image07143.jpeg)\n\n![](img/image07144.jpeg)\n\nAda 不需要这些，因为它默认定义了流输入输出操作：\n\
  \n![](img/image07145.jpeg)\n\n![](img/image07146.jpeg)\n\n默认情况下，`Output` 属性将对象的标记发送到流，然后调用更基础的\
  \ `Write` 属性，该属性按照声明相同的顺序将组件发送到流，即 A、B 然后 C。可以这样重写 `Input`、`Output` 和 `Write` 属性的默认实现：\n\
  \n![](img/image07147.jpeg)\n\n在上面的示例中，`P.C'output` 调用了 `P.C'Write`，后者在包体中被重写。由于包\
  \ `P` 的规范没有定义任何子程序，它通常不需要包体，因此禁止使用包体。`pragma Elaborate_Body` 告诉编译器该包有一个由于其他原因需要的包体。请注意，流\
  \ IO 属性不是标记类型的基本操作。\n\n### 22.3.8 术语\n\n| Ada | C++ |\n| :--- | :--- |\n| 包（package）\
  \ | 类（class） |\n| 标记类型（tagged type） | 类（class） |\n| 基本操作（primitive operation） |\
