  \n![](img/image06739.jpeg)\n\n实数字面量是 `Universal_Real` 类型，适用于类似的规则。\n\n## 5.10 类型之间的关系\n\
  \n类型由其他类型组成。例如，数组类型由两个类型组成：一个用于数组索引，另一个用于数组组件。数组表示了一种关联，即索引类型的一个值与组件类型的值之间的关联。\n\
