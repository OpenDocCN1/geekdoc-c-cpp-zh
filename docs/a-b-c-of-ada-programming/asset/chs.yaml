  \ Private\n- 8.3.3 Formal Private and Limited Types\n\n## 14.4 参考文献\n\n# 15 Strings\n\
  \nAda 支持三种不同的字符串类型。每种字符串类型的设计用于解决不同的问题。\n\n此外，每种字符串类型都为每个可用类型（`Character`、`Wide_Character`、`Wide_Wide_Character`）实现，提供了九种组合。\n\
  \n## 15.1 固定长度字符串处理\n\n固定长度字符串（Fixed-Length Strings）是 `Character` 的数组，因此具有固定长度。由于固定长度字符串是一个不定的子类型，因此其长度不需要在编译时已知——长度完全可以在运行时计算。在下面的示例中，长度是从命令行参数\
  \ 1 计算的：\n\n![](img/image06894.jpeg)\n\n然而，一旦长度被计算且字符串被创建，长度就会保持不变。尝试以下程序，它展示了一个典型的错误：\n\
  \n![](img/image06895.jpeg)!(Images/image06896.jpeg)\n\n![](img/image06897.jpeg)\n\
  \n只有当第 1 和第 2 个参数长度相同时，程序才能工作。即使第二个参数较短也是如此。它既没有对短字符串进行自动填充，也没有对长字符串进行自动截断。\n\n\
  尽管如此，Ada 包包含一组用于固定长度字符串处理的过程和函数，允许对短字符串进行填充以及对长字符串进行截断。\n\n尝试以下示例查看它是如何工作的：\n\n\
  ![](img/image06898.jpeg)\n![](img/image06899.jpeg)\n\n\n\n\n## 15.2 有界长度字符串处理\n\n\
  有界长度字符串处理\n\n当字符串的最大长度已知或受限时，可以使用有界长度的字符串。这在数据库应用中很常见，因为只能存储有限数量的字符。\n\n与`Fixed-Length\
  \ Strings`（固定长度字符串）一样，长度不需要在编译时知道——它也可以在运行时计算——如下例所示：\n\n![](img/image06900.jpeg)\n\
  \n你应该知道，有界字符串具有一些明显的缺点。最显著的是，每个有界字符串都是不同的类型，这使得它们之间的转换相当繁琐。此外，有界字符串类型始终为该类型允许的最大字符串长度分配内存。有界字符串的内存分配等于字符串“字符”的最大数量加上一个包含字符串长度的取决于实现的数字（取决于字符串的底层字符类型，每个字符可能需要分配超过一个字节；例如，在\
  \ Windows GNAT Ada 编译器 `v3.15p` 中，长度数字为 4 字节）。\n\n## 15.3 无界长度字符串处理\n\n无界长度字符串处理\n\
  \n最后但同样重要的是还有无界长度字符串（Unbounded-Length String）。事实上：如果你不是在进行嵌入式或数据库编程，这将是你最经常使用的字符串类型，因为它提供了最大的灵活性。\n\
  \n正如名称所示，无界长度字符串可以包含几乎任何长度的字符串——仅限于`Integer` 的最大值或你可用的堆内存。这是因为 `Unbounded_String`\
  \ 类型在后台使用动态内存分配实现，虽然效率较低，但提供了最大的灵活性。\n\n![](img/image06901.jpeg)\n\n![](img/image06902.jpeg)\n\
  \n如你所见，无界字符串的示例也是最短的（舍弃第一个有错误的示例），这使得使用无界长度字符串变得非常有吸引力。\n\n## 15.4 参见\n\n参见\n\n\
