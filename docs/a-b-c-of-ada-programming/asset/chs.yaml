  \n# 37 运算符\n\n## 37.1 标准运算符\n\nAda 允许对所有标准运算符进行重载，因此以下摘要只能描述每个运算符建议的标准操作。完全有可能误用任何标准运算符来执行非常规的操作。\n\
  \n每个运算符要么是 `keyword`（关键字），要么是 `delimiter`（分隔符）——因此所有运算符页面都重定向到相应的 `keyword` 或 `delimiter`。\n\
  \n运算符带有参数，在参考手册（RM）中，二元运算符的操作称为 `Left` 和 `Right`，一元运算符称为 `Right`（表示相对于运算符符号的位置）。列表按低优先级到高优先级排序。\n\
