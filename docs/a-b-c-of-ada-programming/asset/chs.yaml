  \n# 34 词法元素\n\n## 34.1 字符集\n\n字符集\n\nAda 程序使用的字符集由以下部分组成：\n\n• 大写字母：A, ..., Z 和小写字母：a,\
  \ ..., z。\n\n• 数字：0, ..., 9。\n\n• 特殊字符。\n\n注意，在 Ada 95 中，字母范围包含了带重音的字母以及西欧语言使用的字母，即属于\
  \ ISO Latin-1 字符集的字母，如 ç, ñ, ð 等。\n\n在 Ada 2005 中，字符集已扩展到整个 Unicode 集合，因此标识符和注释可以用世界上几乎任何语言编写。\n\
  \nAda 是一种不区分大小写的语言，即除了字符字符串字面量和字符字面量外，大写集合相当于小写集合。\n\n## 34.2 词法元素\n\n词法元素\n\n在\
  \ Ada 中，我们可以找到以下词法元素：\n\n• 标识符\n• 数字字面量\n• 字符字面量\n• 字符串字面量\n• 分隔符\n• 注释\n• 关键字 示例：\n\
  \n![](img/image07290.jpeg)\n\n这一行包含 5 个词法元素：\n\n• 标识符 `Temperature_In_Room`。\n•\
  \ 复合分隔符 `:=`。\n• 数字 `25`。\n• 单分隔符 `;`。\n\n![](img/image07291.jpeg)\n\n1 [`en.wikipedia.org/wiki/ISO%208859-1`](http://en.wikipedia.org/wiki/ISO%208859-1)\n\
