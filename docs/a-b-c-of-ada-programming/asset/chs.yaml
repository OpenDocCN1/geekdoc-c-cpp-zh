  \n# 21 任务 (Tasking)\n\n## 21.1 任务 (Tasks)\n\n### 任务\n\n任务单元是一个与 Ada 程序的其余部分并发执行的程序单元。相应的活动——即一个新的控制中心点——在\
  \ Ada 术语中被称为任务（task），它类似于线程，例如 `Java Threads`1 主主程序的执行也是一个任务，即匿名环境任务。任务单元既有声明也有体，且这两者都是强制性的。任务体可以作为子单元单独编译，但任务不能是库单元，也不能是泛型的。每个任务都依赖于一个主任务（master），主任务是紧邻其的声明区域——一个块（block）、子程序、另一个任务或一个包（package）。在所有依赖的任务结束之前，主任务的执行不会完成。环境任务是所有其他任务的主任务；它只有在所有其他任务都结束后后才会终止。\n\
  \n任务单元与包（package）相似之处在于，任务声明定义了从任务导出的实体，而其体则包含了任务的局部声明和语句。\n\n单个任务的声明如下：\n\n![](img/image07023.jpeg)\n\
  \n如果没有导出任何内容，任务声明可以简化，因此：\n\n![](img/image07024.jpeg)\n\nEx. 1\n\n![](img/image07025.jpeg)\n\
  \n![](img/image07026.jpeg)\n\n1[`en.wikibooks.org/wiki/Java%3AThreads`](http://en.wikibooks.org/wiki/Java%3AThreads)\n\
  \n![](img/image07027.jpeg)\n\n可以声明任务类型，从而允许动态创建任务单元并将其纳入数据结构：\n\n![](img/image07028.jpeg)\n\
  \n任务类型是有限的，即它们受限制的方式与限制私有类型相同，因此不允许赋值和比较。\n\n### 21.1.1 会合 (Rendezvous)\n\n任务可以导出的唯一实体是入口（entries）。入口的形式非常像过程（procedure）。它有一个标识符，并可以有\
  \ in、out 或 in out 参数。Ada 支持通过入口调用实现任务与任务之间的通信。信息通过调用的实际参数在任务之间传递。我们可以在任务内部封装数据结构，并通过入口调用对其进行操作，这种方式类似于使用包来封装变量。主要区别在于，入口是由被调用任务执行的，而不是调用任务，调用任务会被挂起直到调用完成。如果被调用任务未准备好处理某个入口的调用，调用任务将在与入口相关的（先进先出）队列中等待。这种调用任务与被调用任务之间的交互被称为会合（rendezvous）。调用任务通过调用特定命名任务的任一入口来请求与之会合。任务通过执行该入口的\
  \ `accept` 语句来接受与特定入口的任何调用者的会合。如果没有调用者在等待，它会被阻塞。因此，入口调用和 `accept` 语句的行为是对称的。（坦率地说，优化的对象代码可能会将上下文切换的次数降低到这种简单描述所暗示的数量以下。）\n\
  \nEx. 2 下述任务类型实现了一个槽缓冲区，即一个 `Encapsulated_Buffer_Task`，它可以被插入和移除值。注意缓冲区不需要循环。\n\n\
  ![](img/image07029.jpeg)\n\n### 21.1.2 选择性等待 (Selective Wait)\n\n为了避免在可以进行有效工作时被阻塞，服务器任务通常需要自由接受任何入口。它通过选择性等待来实现这一点。如果备选方案中只有一个处于待处理状态，则接受该。如果有两个或多个备选方案处于待处理状态，实现可以随机选择一个。这在程序中引入了边界非确定性。一个健壮的程序不应该依赖于特定方法。\n\
  \nEx. 3\n\n![](img/image07030.jpeg)\n\n![](img/image07031.jpeg)\n\n![](img/image07032.jpeg)\n\
  \n创建了两个 `Encapsulated_Variable_Task` 变量。它们可以这样使用：\n\n![](img/image07033.jpeg)\n\n\
  再次注意，体的控制结构确保了在接受任何 `Fetch` 操作之前，必须通过 `Store` 操作给 `Encapsulated_Variable_Task` 一个初始值。\n\
  \n### 21.1.3 守卫 (Guards)\n\n根据情况，服务器任务可能无法接受某些具有备选方案的入口调用。通过使用守卫（guard），可以使任何备选方案的接受变为条件，守卫是接受的\
  \ `Boolean`2 前置条件。这使得编写类似监控器的服务器任务变得简单，不需要显式的信号机制，也不需要互斥。具有 True 守卫的备选方案被称为开启的。如果在执行选择性等待时没有开启的备选方案，这是一个错误并抛出\
  \ `Program_Error` 异常。\n\nEx. 4\n\n![](img/image07034.jpeg)\n\n![](img/image07035.jpeg)\n\
  \n2 [`en.wikibooks.org/wiki/Ada%20Programming%2FTypes%23Boolean`](http://en.wikibooks.org/wiki/Ada%20Programming%2FTypes%23Boolean)\n\
  \n![](img/image07036.jpeg)\n\n## 21.2 类型 (Protected types)\n\n### 类型\n\n任务允许封装和安全使用变量数据，而不需要显式的互斥和信号机制。Ex.\
  \ 4 展示了如何编写服务器任务来为多个客户端安全地管理局部声明的数据。由于所管理的数据不会被并发访问，因此不需要对访问进行互斥处理。然而，仅仅为了提供某些数据而创建任务的开销可能过大。对于此类应用，Ada\
  \ 95 提供了保护模块（protected modules）。保护模块封装了数据结构，并在自动互斥的情况下导出了对其操作的子程序。它还提供了客户端任务之间自动、隐式的条件信号传递。再次，保护模块可以是单个保护对象，也可以是保护类型，允许创建许多保护对象。\n\
  \n[/content] 修正：\n\n\n\n受保护模块（protected module）可以导出过程、函数和入口，其体内部可以只包含过程、函数和入口的体。受保护数据在规范中声明在\
  \ `private` 之后，但仅在受保护模块体内部访问。受保护过程和入口可以读取和/或写入其封装的数据，并且会自动相互互斥。受保护函数只能读取封装的数据，因此可以在同一个受保护对象中并发执行多个受保护函数调用，且具有完全安全性；但受保护过程调用和入口调用会排斥受保护函数调用，反之亦然。受保护对象导出的入口和子程序由其调用任务（calling\
  \ task）执行，因为受保护对象没有独立的控制点。（坦率地说，优化的对象代码可能会将上下文切换次数减少到低于这种简单描述所暗示的次数。）\n\n像任务入口（task\
  \ entry）一样，受保护入口可以使用守卫（guard）来控制准入。这提供了自动信号机制，并确保当受保护入口调用被接受时，其守卫条件为 `True`，从而为入口体提供了一个可靠的前置条件。\n\
  \n### Ex. 5\n以下是一个简单的受保护类型，类似于示例 2 中的 `Encapsulated_Buffer` 任务。\n\n![](img/image07037.jpeg)\n\
  \n注意守卫如何使用状态变量 `Empty` 确保消息交替插入和移除，并确保无法尝试从空缓冲区获取数据。这一切都是在没有显式信号或互斥结构的情况下实现的，无论是在调用任务中还是受保护类型本身。\n\
  \n调用受保护入口或过程的符号与调用任务入口的符号完全相同。这使得易于用另一种实现来替换抽象类型，而不影响调用代码。\n\n### Ex. 6\n以下任务类型实现了\
  \ `Dijkstra's` 信号量 ADT，并对恢复的进程进行 FIFO（先进先出）调度。算法接受对 `Wait` 和 `Signal` 的调用，只要不违反信号量不变。当接近这种情况时，对\
  \ `Wait` 的调用将被暂时忽略。\n\n![](img/image07038.jpeg)\n\n![](img/image07039.jpeg)\n\n\
  该任务可以使用如下方式：\n\n![](img/image07040.jpeg)\n\n或者，可以通过受保护对象提供信号量功能，从而获得显著的效率提升。\n\n\
  ### Ex. 7\n该受保护类型的 `Initialize` 和 `Signal` 操作是无条件的，因此它们被实现为受保护过程，但 `Wait` 操作必须经过守卫，因此被实现为入口。\n\
  \n![](img/image07041.jpeg)\n\n与上面的任务类型不同，它不确保在调用 `Wait` 或 `Signal` 之前调用了 `Initialize`，而是给\
  \ `Count` 给了一个默认初始值。恢复任务版本的这种防御性特性留给读者练习。\n\n## 21.3 入口族 (Entry families)\n\n###\
  \ 入口族\n有时我们需要一组相关的入口。由离散类型索引的入口族满足了这种需求。\n\n### Ex. 8\n该任务提供了一个多个缓冲区池。\n\n![](img/image07042.jpeg)\n\
