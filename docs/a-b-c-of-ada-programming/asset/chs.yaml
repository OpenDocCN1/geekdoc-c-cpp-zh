  \n# 20 泛型\n\n## 20.1 参数多态（泛型单元）\n\n参数多态（泛型单元）\n\n代码复用的想法源于构建结合良好区块系统的必要性。代码复用提高了软件生产力和质量。泛型单元是\
  \ Ada 语言支持此的一种方式。给 C++ 程序员的提示：泛型单元类似于 C++ 模板。\n\n例如，定义一个交换任何（非限制）类型的变量程序：\n\n![](img/image06985.jpeg)\n\
  \n![](img/image06986.jpeg)\n\n`Swap` 程序被称为泛型的。程序规范之前由 `generic` 关键字组成，后面跟着泛型形式参数列表，该列表可以为空。声明为泛型的实体不能直接使用，必须对其实例化。\n\
  \n要使用 Swap，需要为所需的类型创建实例。例如：\n\n![](img/image06987.jpeg)\n\n现在 `Swap_Integers` 程序可以用于\
  \ `Integer` 变量。\n\n泛型程序可以为所有需要的类型实例化。如果在实例化时使用相同的标识符，则每个声明都会重载该程序。\n\n同样，可以使用泛型包，例如实现任何类型元素的栈：\n\
  \n![](img/image06989.jpeg)\n\n![](img/image06990.jpeg)\n\n可以通过这种方式定义一个给定大小和类型的栈：\n\
  \n![](img/image06991.jpeg)\n\n## 20.2 泛型参数\n\n泛型参数\n\n泛型单元声明泛型形式参数，这些参数可以是：\n\n\
  • 对象（模式为 `in` 或 `in out` 但绝不是 `out`）\n\n• 类型\n\n• 程序\n\n• 其他指定的、泛型单元的实例。\n\n\n\n\
  \n在实例化泛型时，程序员为每个形式参数（formal parameter）传递一个实际参数（actual parameter）。形式值和子程序可以有默认值，因此为它们传递实际参数是可选的。\n\
  \n### 20.2.1 泛型形式对象\n\n`accept` 中的 `mode` 形式参数可以接受指定类型的任何值、常量或变量。实际参数被复制到泛型实例中，并在泛型内部表现得像一个常量；这意味着指定的类型不能被限制。可以指定默认值，如下所示：\n\
  \n![](img/image06992.jpeg)\n\n对于 `out` 中的 `mode`，实际参数必须是一个变量。\n\n泛型形式对象的一个局限性是，它们从不被视为静态的，即使实际参数恰好是静态的。如果该对象是一个数字，它不能用于创建一个新类型。然而，它可以用于创建一个新的派生类型或子类型：\n\
  \n![](img/image06993.jpeg)\n\n形式对象非静态的原因是允许编译器仅为泛型生成一次对象代码，并让所有实例共享该代码，通过将其实际对象的地址作为参数传递。。这种编译器技术被称为**共享泛型**（shared\
  \ generics）。如果形式对象是静态的，编译器将为每个实例生成一个嵌入了对象的对象代码副本，这可能导致对象代码量的爆炸式增长（代码膨胀）。\n\n（给 C++\
  \ 程序员的备注：在 C++ 中，由于形式对象可以是静态的，编译器无法在通用情况下实现共享泛型；它必须在决定是否共享对象代码之前检查泛型的整个正体。相比之下，Ada\
  \ 泛型设计使得编译器可以在不查看其正体的情况下实例化泛型。）\n\n### 20.2.2 泛型形式类型\n\n语法允许程序员指定哪些类型类别可以作为实际参数。根据经验法则：语法表达了泛型是如何看待该类型的（即它假设了最坏情况），而不是实例的创建者是如何看待该类型的。\n\
  \n这是 RM 12.5 的语法：\n\n![](img/image06994.jpeg)\n\n![](img/image06995.jpeg)\n\n这非常复杂，因此下面给出了一些示例。用\
  \ `type T (<>)` 语法定义的类型表示具有未知判别符（discriminants）的类型。这是 Ada 对不确定类型（indefinite types）的术语，即在不给出初始表达式的情况下无法声明对象的类型。此类类型的示例是带有无默认值判别符的类型，另一个示例是无约束数组类型。\n\
  \n| 泛型形式类型 | 可接受的实际类型 |\n| :--- | :--- |\n| `type T (<>) is limited private;` |\
  \ 任何类型。实际类型可以是限制的或未限制的、不确定或确定的，但泛型将其视为限制的且不确定的，即不假设该类型支持赋值。 |\n| `type T (<>) is\
  \ private;` | 任何非限制类型：泛型知道可以给该类型的变量赋值，但可以在没有初始值的情况下声明该类型的对象。 |\n| `type T is private;`\
  \ | 任何非限制确定类型：泛型知道可以给该类型的变量赋值，并可以在没有初始值的情况下声明对象。 |\n| `type T (<>) is abstract tagged\
  \ limited private;` | 任何标记类型，无论是抽象还是具体的，受限或未受限。 |\n| `type T (<>) is tagged limited\
  \ private;` | 任何具体的标记类型，无论是否受限。 |\n| `type T (<>) is abstract tagged private;` |\
  \ 任何非限制的标记类型，无论是抽象还是具体的。 |\n| `type T (<>) is tagged private;` | 任何非限制的具体的标记类型。\
  \ |\n| `type T (<>) is new Parent;` | 任何派生自 Parent 的类型。泛型知道 Parent 的操作，因此可以调用。`T`\
  \ 和 `Parent` 都不能是抽象的。 |\n| `type T (<>) is abstract new Parent with private;` |\
  \ 任何派生自 Parent 的类型（抽象或具体），其中 Parent 是标记类型，因此对 T 操作可以可以动态补丁。 |\n| `type T (<>) is\
  \ new Parent with private;` | 任何派生自标记 Parent 的具体类型。 |\n\n![](img/image0696.jpeg)\n\
  \n| 泛型形式类型 | 可接受的实际类型 |\n| :--- | :--- |\n| `type T is (<>);` | 任何离散类型：整数、模数或枚举。\
  \ |\n| `type T is range <>;` | 任何有符号整数类型 |\n| `type T is mod <>;` | 任何模数类型 |\n|\
  \ `type T is delta <>;` | 任何（非十进制）定点类型 |\n| `type T is delta digits <>;` | 任何十进制定点类型\
  \ |\n| `type T is digits <>;` | 任何浮点类型 |\n| `type T is array (I) of E;` | 任何索引类型为\
  \ `I` 元素类型为 `E` 的数组类型（`I` 和 `E` 也可以是形式参数） |\n| `type T is access O;` | 任何指向类型 `O`\
  \ 访问类型（`O` 也可以是形式参数） |\n\n在正体中，我们只能使用为形式参数类型预定义的操作。也就是说，泛型规范是泛型实现者与实例化泛型的客户端之间的合约。这与其他语言（如\
  \ C++）的参数化特征不同。可以进一步限制可接受的实际类型集合，例如：\n\n| 泛型形式类型 | 可接受的实际类型 |\n| :--- | :--- |\n\
  | `type T (<>) is...` | 确定或不确定类型（泛义上：带或不带判别符的类型，但存在其他形式的不确定） |\n| `type T (D : DT)\
  \ is...` | 具有类型 `DT` 判别符的类型（也可以指定多个判别符） |\n| `type T is...` | 确定类型（泛义上：不带判别符或带有默认值判别符的类型）\
  \ |\n\n### 20.2.3 泛型形式子程序\n\n可以将子程序作为参数传递给泛型。泛型指定一个泛型形式子程序，包含参数列表和返回值（如果子程序是函数）。实际必须匹配此参数配置。不过，参数名称不需要匹配。\n\
  \n![](img/image0697.jpeg)\n\n这是一个接收另一个子程序作为参数的泛型子程序的规范：\n\n![](img/image0698.jpeg)\n\
  \n这是该泛型子程序的正体；它像调用其他子程序一样调用参数。\n\n![](img/image0699.jpeg)\n\n这个泛型函数可以用于矩阵，假设已定义矩阵乘法。\n\
  \n![](img/image0700.jpeg)\n\n\n\n\n\n可以使用“方框”（即 `<>`）来指定默认值，例如所示：\n\n![](img/image07001.jpeg)\n\
  \n这意味着如果在实例化点，为实际类型存在一个函数 `*`，且该函数是直接可见的，那么它将被默认作为实际子程序使用。\n\n其主要用途之一是传递所需的运算符。下面的示例展示了这一点（完整示例请参阅下载链接）：\n\
  \n![](img/image07002.jpeg)\n![](img/image07003.jpeg)\n![](img/image07004.jpeg)\n\
  \n### 20.2.4 其他泛型包的泛型实例\n\n泛型形式可以是一个包；它必须是泛型包的实例，这样泛型才能知道该包所导出的接口：\n\n![](img/image07005.jpeg)\n\
  \n这意味着实际类型必须是泛型包 `Q` 的实例。`Q` 后面的方框意味着我们不在乎使用了哪些实际泛型参数来创建 `P` 的实际。可以指定具体的参数，或者指定必须使用默认值，如下所示：\n\
  \n![](img/image07006.jpeg)\n\n这是全有或无的：如果你指定了泛型参数，就必须指定所有的。同样，如果你没有指定任何参数也没有方框，那么\
  \ `Q` 的所有泛型形式参数都必须有默认值。当然，实际包必须匹配这些约束。\n\n泛型可以同时看到实际包的公共部分和泛型参数（上述示例中的 `Param1`\
  \ 和 `Param2`）。\n\n此特性允许程序员将任意复杂的类型作为参数传递给泛型单元，同时保持完全的类型安全和封装。（需要示例）\n\n包无法将自己列为泛型形式，因此无法进行泛型递归。以下是是非法的：\n\
  \n![](img/image07007.jpeg)\n\n事实上，这只是以下情况的一种特殊情况：\n\n![](img/image07008.jpeg)\n\n\
  这也是非法的，尽管 `A` 已经不再是泛型的。\n\n## 20.3 实例化泛型\n\n#### 实例化泛型\n\n要实例化一个泛型单元，使用关键字 `new`：\n\
  \n![](img/image07009.jpeg)\n\n对 C++ 程序员特别感兴趣的说明：\n\n- 泛型形式类型完全定义了哪些类型可以接受作为实际；因此，编译器可以在不查看泛型体的情况下实例化泛型。\n\
  - 每个实例都有一个名称并且与其他所有实例都不同。特别是，如果一个泛型包声明了一个类型，而你创建了该包两个实例，那么你将两个不同的、不兼容的类型，即使实际参数是相同的。\n\
  - Ada 要求所有实例化必须是显式的。\n- 不为泛型创建特例实例（在 C++ 中被称为“模板私有化”）。\n\n由于上述原因，Ada 不允许模板元编程。然而，这种设计具有显著的优势：\n\
  \n- 对象代码可以由泛型的所有实例共享，除非程序员要求对子程序进行内联（inlined）；这样就不会有代码膨胀的危险。\n- 在阅读他人编写的程序时，没有隐藏的实例化，也没有特例需要担心。Ada\
  \ 遵循“最小惊讶直觉原则”。\n\n## 20.4 高级泛型\n\n### 20.4.1 泛型与嵌套\n\n泛型单元可以嵌套在另一个单元内部，而该单元本身可以是泛型的。尽管没有特殊的规则适用（仅适用泛型的常规规则和关于嵌套单元的规则），但初学者可能会感到困惑。理解泛型单元与泛型单元实例之间的区别是非常重要的。\n\
  \n示例 1。嵌套在非泛型包中的泛型子程序。\n\n![](img/image07010.jpeg)\n\n要使用 `Apply_To_All`，你首先定义应用于\
  \ `Bag` 中每个 `String` 的过程。然后，实例化 `Apply_To_All`，最后调用该实例。\n\n![](img/image07011.jpeg)\n\
  \n示例 2。嵌套在泛型包中的泛型子程序。这与上面相同，现在 `Bag` 本身是泛型的：\n\n![](img/image07012.jpeg)\n\n如你所示，泛型子程序接收一个\
  \ `Element_Type` 参数。你不能直接实例化 `Bag.Apply_To_All`，所以你必须先创建一个 `Bag` 的实例，例如 `Bag_Of_Strings`，然后实例化\
  \ `Bag_Of_Strings.Apply_To_All`。\n\n![](img/image07013.jpeg)\n\n#### 20.4.2 泛型与子单元\n\
  \n示例 3. 作为非泛型单元子单元的泛型单元。\n\n泛型的每个实例都是父单元的子单元，因此可以看到父单元的公共部分。（等待，文中说“泛型的每个实例都是父单元的子单元，因此可以看到父单元的公共部分。”）\n\
  \n![](img/image07014.jpeg)\n\n与示例 1 的区别在于：\n\n- `Bag_Of_Strings.Apply_To_All` 是单独编译的。如果你没有使用\
  \ `Bag_Of_Strings.Apply_To_All`，你的程序就不会包含它的代码。\n- 因为 `Bag_Of_Strings.Apply_To_All`\
  \ 处于库级，它可以声明受控类型；嵌套包在 Ada 95 中无法做到这一点。\n\n![](img/image07015.jpeg)\n\n示例 4. 作为泛型单元子单元的泛型单元\n\
  \n这与示例 3 相同，现在 `Bag` 是泛型的：\n\n![](img/image07016.jpeg)\n\n![](img/image07017.jpeg)\n\
