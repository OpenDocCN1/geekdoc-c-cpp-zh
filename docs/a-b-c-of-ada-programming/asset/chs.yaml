  \n# 18 输入输出\n\n## 18.1 概述\n\n概述\n\n标准的 Ada 库提供了几种输入/输出设施，每种都适应了特定的需求。具体来说，语言定义了以下专用包：\n\
  \n• `Text_IO`\n\n• `Sequential_IO`\n• `Direct_IO`\n• `Stream_IO`\n\n程序员必须根据应用程序需求选择合适的包。例如，应该考虑应用程序处理的数据的以下属性：\n\
  \n• 数据内容：纯文本还是二进制数据？\n• 数据访问：随机访问还是顺序访问？\n• 介质：数据文件、控制台、网络/数据总？\n• 数据结构：同质文件（相同数据字段序列）、异质文件（不同数据字段）？\n\
  • 数据格式：遵循现有的数据格式，还是应用程序可以自由选择一个新的？\n\n例如，`Stream_IO` 非常强大可以处理复杂的数据结构，但可能比其他包重；`Sequential_IO`\
  \ 轻量且易用，但不能用于需要随机数据的应用程序；`Text_IO` 只能处理文本数据，但处理命令行控制台已经足够。\n\n下表提供了选择更合适包的一些建议：\n\
  \n| 选择 I/O 包的简单启发式方法 |\n| 数据访问 | 纯文本 | 二进制数据 |\n| :--- | :--- | :--- |\n| 同质 | 异质\
  \ | |\n| 顺序 | `Text_IO` | `Sequential_IO` | `Stream_IO` |\n| 随机 | `Text_IO` | `Direct_IO`\
  \ | `Stream_IO` |\n| | | |\n\n最重要的教训是选择正确的一个。本章将详细描述这些包，并说明如何使用。除了这些 Ada 定义的通用 I/O\
  \ 包，还有专门的 I/O 库。\n\n## 18.2 文本输出\n\n文本输出\n\n文本输出 2 可能是最常用的包。文件中的所有数据都是人类可读的。\n\n\
  ![](img/image0693.jpeg)\n\n它还包含几个泛型包，用于将数值和枚举类型转换为字符串，或处理边界和无边界字符串。最后，相同的 `Text_IO`\
  \ 包族（包括子包）也适用于 `Wide_Character` 类型。\n\n值得注意的是 `Text_IO` 包族提供了一些自动文本处理。例如，`Get_Line`\
  \ 会忽略行首的空格（`Get_Immediate` 则不会），并在关闭文件时添加换行符。因此这对于处理简单数据的应用程序是足够的，但需要直接管理文本的用户必须考虑其他包，如\
  \ `Sequential_IO`。\n\n## 18.3 直接输出\n\n直接输出\n\n直接输出用于包含一种特定类型的随机访问文件。通过 `Direct_IO`，你可以将文件指针置到该类型的任何元素（随机访问），但你不能自由选择元素类型，元素类型需要是一个确定的子类型\
  \ 3。\n\n![](img/image0694.jpeg)\n\n## 18.4 顺序输出\n\n顺序输出\n\n顺序输出用于包含一种特定类型的随机访问文件。通过\
  \ `Sequential_IO` 情况则反过来：你可以在确定的 4 和不定的 5 元素类型之间进行选择，但你必须一个接一个地读写元素。\n\n## 18.5\
  \ 流输出\n\n\n\n\n# 流输入/输出 (Stream I/O)\n\n流 I/O 是 Ada 提供的最强大的输入输出包。流 I/O 允许你在一个顺序文件中混合不同元素类型的对象。为了对流进行读/写，每个类型都提了\
  \ `Read` 和 `Write` 属性，以及 `Input` 和 `Output` 属性。这些属性会为你声明的每个类型自动生成。\n\n`Read` 和 `Write`\
  \ 属性将元素视为原始数据。它们适用于低级输入输出以及与其他编程语言的接口交互。\n\n`Input` 和 `Output` 属性为文件添加额外的控制信息，例如数组的\
  \ `First` 和 `Last` 属性。\n\n在面向对象的编程中，你还可以使用 `ClassInput` 和 `ClassOutput` 属性——它们还会存储并恢复实际的对象类型。\n\
  \n流 I/O 也是最灵活的输入输出包。所有的 I/O 属性可以使用表示子（representation clauses）替换用户定义的函数或过程，你可以使用灵活的面向对象技术提供自己的流\
  \ I/O 类型。\n\n## 18.6 参见\n\n![](img/image06965.jpeg)\n\n- 4 [Ada 编程子类型](http://en.wikibooks.org/wiki/ada%20Programming%2FSubtypes%23definite_subtype)](http://en.wikibooks.org/wiki/ada%20Programming%2FSubtypes%23definite_subtype)\n\
