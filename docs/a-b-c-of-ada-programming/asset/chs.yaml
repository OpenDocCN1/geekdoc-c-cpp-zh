  \n# 23 Ada 2005 新特性\n\n本文介绍了 Ada 2005 中提供的主要特性，该版本是 2007 年 1 月前接受的 Ada 标准版本（以与之前的\
  \ Ada 83 和 Ada 95 区分来）。有关原理和更详细（且非常技术）的描述，请参阅《Ada 参考手册修订版》(AI)。虽然标准已经发布，但并非所有的编译器都能处理它。这些新增内容已由以下自由软件编译器实现：\n\
  \n* GNAT GPL 版\n* GCC 4.1\n* GNAT Pro 6.0.2（支持的 Ada 是完整实现）。\n\n在下载并安装其中任何一个版本后，请在编译\
  \ Ada 2005 代码时使用 `-gnat05` 参数。请注意，Ada 2005 是 GNAT GPL 2007 版本的默认模式。\n\n## 23.1 语言特性\n\
  \n### 23.1.1 字符集\n\nAda 2005 不仅支持一种名为 `Wide_Character` 的新 32 位字符类型——源代码本身也可以属于这种扩展集。例如，俄罗斯人和印度人可以在标识符和注释中使用母语。数学家们也将为之高兴：整个希腊字母和分数字符集均可用于标识符。例如，`Ada.Numerics`\
  \ 将扩展一个新的常量：\n\n这并不是一个新想法——GNAT 始终有一个 `-gnatic` 编译器选项来指定字符集（http://gcc.gnu.org/onlinedocs/gnat_ugn_unw/Character-Set-Control.html）。但现在这个想法已经标准化，因此所有的\
  \ Ada 编译器都将支持 Unicode 4.0 的标识符——正如新标准所要求的。\n\n另请：\n\n* AI95-00285-01 对 16 位和 32\
  \ 位字符的支持 ([http://www.ada-auth.org/cgi-bin/cvsweb.cgi/AIs/AI-00285.TXT])\n* AI95-00388-01\
  \ 在 `Ada.Numerics` 中添加希腊字母 pi ([http://www.ada-auth.org/cgi-bin/cvsweb.cgi/AIs/AI-00388.TXT])\n\
