  \n![](img/image06750.jpeg)\n\n# 8 枚举类型\n\n枚举类型定义为可能值的列表：\n\n![](img/image06751.jpeg)\n\
  \n对于数值类型，例如 1 是一个整数字面量，Red、Green 和 Blue 被称为该类型的字面量（literals）。没有其他值可以赋值给该类型的对象。\n\
  \n## 8.1 运算符与属性\n\n运算符与属性\n\n除了相等（“=”），枚举类型上的唯一运算符是排序运算符：`<、<=、/=、>=、>`，其中顺序关系由字面量的序列隐式给出：每个字面量都有一个位置，从第一个开始为\
  \ 0，之后递增 1。可以通过 `'Pos` 属性查询此位置；反操作 `'Val` 则返回对应的字面量。在我们的示例中：\n\n![](img/image06752.jpeg)\n\
  \n还有两个重要的属性：`Image` 和 `Value`（不要混淆 `Val` 和 `Value`）。`Image` 返回值的字符串表示（全大写），`Value`\
  \ 是其反操作：\n\n![](img/image06753.jpeg)\n\n这些属性对于简单的 IO 非常重要（Ada 为枚举类型提供了更复杂的 IOset）。注意，由于\
  \ Ada 不区分大小写，传递给 `'Value` 的字符串可以是任意大小。\n\n## 8.2 枚举字面量\n\n![](img/image06754.jpeg)\n\
  \n枚举字面量\n\n字面量是可以重载的，即你可以拥有另一个具有相同字面量的类型。\n\n![](img/image06755.jpeg)\n\n\n\n\n\
  在字面量使用的上下文中，重载解析通常会解析出指的是哪一个 Red。只有当遇到无法解决的重载冲突时，才能使用特殊语法来指定指的是哪个 Red：\n\n![](img/image06756.jpeg)\n\
  \n像许多其他声明式项一样，枚举字面量可以被重命名。事实上，这样的字面量实际上是一个函数，因此必须以此方式重命名：\n\n![](img/image06757.jpeg)\n\
  \n在这里，假设 `Primary_Color` 被定义在包 `P` 中，并且在重命名声明处是可见的。重命名使得 Red 直接可见，而无需诉助于 `use` 子句。\n\
  \n注意，将其重新声明为函数不会影响字面量的静态性。\n\n### 8.2.1 字符作为枚举字面量\n\nAda 特有的用法是可以使用字符字面量作为枚举字面量：\n\
  \n![](img/image06758.jpeg)\n\n此字面量 `'A'` 与预定义类型 `Character`（或 `Wide_Character`）的字面量\
  \ `'A'` 没有任何共同之处。\n\n任何至少有一个字符字面量的类型都是字符类型。对于每个字符类型，字符串字面量和连接运算符 `\"&\"` 也是隐式定义的。\n\
  \n![](img/image06759.jpeg)\n\n在这个示例中，`S` 和 `T` 具有相同的值。\n\n![](img/image06760.jpeg)\n\
  \n![](img/image06761.jpeg)\n\nAda 的 `Character` 类型就是这样定义的。参见 `Ada Programming/Libraries/Standard`。\n\
