  \n# 24 容器\n\n以下是某些容器类型的简单演示。它没有涵盖所有内容，但应该足够让你入门。此语言特性仅在 Ada 2005 中可用。\n\n### 第一个示例：Maps\n\
  \n下面的程序用多种人类语言向世界问候。问候语存储在表格或哈希映射（hashed map）中。映射将每个问候语（值）与语言代码（键）关联。也就是说，你可以使用语言代码作为键在表中查找问候值。\n\
  \n映射中的元素是国际字符的常量字符串，或者说，是指向此类常量字符串的指针。使用了 `Regional` 包来设置语言 ID 和 `Ada` 的实例。\n\n\
  ![](img/image07160.jpeg)\n![](img/image07161.jpeg)\n\n这是该程序，细节将在稍后解释。\n\n![](img/image07162.jpeg)\n\
  ![](img/image07163.jpeg)\n\n第一个 `Insert` 语句是以 Ada 95 编写的：\n\n![](img/image07164.jpeg)\n\
  \n接下来的插入使用了所谓的区分接收者符号（distinguished receiver notation），你可以在 Ada 2005 中使用。虽然 `Insert`\
  \ 调用涉及一个 `Container` 对象（`greetings`）、一个 `Key` 对象（`lang`）和一个 `New_Item` 对象（`\"Hello,\
  \ World!\"`），但 `Container` 对象将被修改。\n\n![](img/image07165.jpeg)\n\n设置完成后，程序继续打印所有问候语。它使用游标来实现：\n\
  \n1. `Has_Element`：用于检查游标是否位于元素上\n2. `Element`：获取元素\n3. `Next`：将游标移动到另一个元素\n\n当没有剩余元素时，游标将具有特殊值\
  \ `No_Element`。实际上，这是一种适用于 Ada 中所有容器的迭代方案。\n\n### 些微变化：选取元素\n\n下一个程序展示了如何根据键从映射中选取值。实际上，你将提供该键。程序与上一个相似，不同之处它不只是打印映射中的所有元素，而是根据它从标准输入读取的\
  \ `Language_ID` 值来选取一个。\n\n![](img/image07166.jpeg)\n![](img/image07167.jpeg)\n\n\
  ### 第二个示例：Vectors 和 Maps\n\n让我们从字面上数数豆子。红豆、绿豆和白豆（是的，白豆确实存在）。你的任务是收集若干豆子，称它们的重，然后分别确定红豆、绿豆和白豆的平均重量。这里有一种方法。\n\
  \n同样，我们需要一个包，这次用于存储蔬菜相关的信息。引入 `Beans` 包（`Grams` 类型不属于蔬菜包，但为了保持简单，它被放在了那里）：\n\n![](img/image07168.jpeg)\n\
  ![](img/image07169.jpeg)\n\n`Vectors` 实例提供了一个类似于数组的数据结构，该结构可以在运行时更改大小。它被称为 `Vector`。读取的每颗豆子都会追加到\
  \ `Bean_Vecs.Vector` 对象中。\n\n\n\n\n\n以下程序首先调用 `read_input` 向缓冲区中填充豆子。接下来，它调用一个函数来计算相同颜色豆子的平均重量。该函数如下：\n\
  \n![](img/image07170.jpeg)\n\n然后，程序将打印每种颜色豆子的平均值并停止。\n\n![](img/image07171.jpeg)\n\
  \n![](img/image07172.jpeg)\n\n所有的容器操作都在函数 `average_weight` 中完成。为了找到相同颜色豆子的平均重量，该函数会按顺序查看所有的豆子。如果豆子的颜色正确，`average_weight`\
  \ 会将其重量累加到总重量中，并将计数加 1。\n\n计算过程访问了所有的豆子。从一个豆子移动到下一个豆子并执行上述步骤所需的迭代，最好留给所有容器包包含的 `Iterate`\
  \ 过程。要这样做，请将上述步骤封装在一个过程内部，并将该过程传递给 `Iterate`。效果是 `Iterate` 会为向量中的每个元素调用你的过程，并为你的过程传递一个游标值（每个元素一个）。\n\
  \n让容器机制执行迭代可能比你自己移动和检查游标更快，就像在 `Hello_World_Extended` 示例中所做的那样。\n\n![](img/image07173.jpeg)\n\
  \n![](img/image07174.jpeg)\n\n![](img/image07175.jpeg)\n\n这种方法非常直接。然而，想象更大的向量。`average_weight`\
  \ 为每种颜色重复访问所有元素。如果有 M 种颜色和 N 颗豆子，`average_weight` 将被调用 `M * N` 次，每有一种新颜色就需要额外的 `N`\
  \ 次调用。一种可能的替代方案是在豆子被访问时收集其所有信息。然而，这可能需要更多变量，并且你找到一种方法返回多个结果（每种颜色一个平均值）等。试试看！\n\n\
  另一种方法可能更好。一种是将不同颜色的豆子拷贝到单独的向量对象。（记住灰姑娘的故事。）这样 `average_weight` 只需要访问每个元素一次。以下过程执行了这一点，它使用了来自\
  \ `Beans` 的新类型 `Bean_Pots`。\n\n![](img/image07176.jpeg)\n\n注意这个普通数组如何将颜色与 `Vectors`\
  \ 关联。将豆子放入正确碗的过程使用豆子颜色作为数组索引来寻找正确的碗（向量）。\n\n![](img/image07177.jpeg)\n\n![](img/image07178.jpeg)\n\
  \n![](img/image07179.jpeg)\n\n现在一切都就绪了。\n\n![](img/image07180.jpeg)\n\n![](img/image07181.jpeg)\n\
  \n作为每种颜色选择一个向量的副作用，我们可以调用 `Length` 函数来确定每个向量中豆子的数量。但 `average_weight` 也计算了向量中的元素数量。因此，这里可以用一个求和函数代替\
  \ `average_weight`。\n\n### 全部都在一个 Map 中！\n\n以下程序首先调用 `read_input` 向缓冲区中填充豆子。然后，这些豆子的信息被存储在表中，将豆子属性映射到出现次数。\n\
  \n从 `Iterate` 开始的处理使用了 Ada 迭代机制典型的链式过程调用。\n\n示例中的 `Beans` 包实例化了另一个泛型库单元 `Ada`。在\
  \ Ada 需要一个哈希函数的地方，Ada 也需要一个比较函数。我们提供了一个 `<`，它首先按颜色后按重量对豆子排序。它将与对应的泛型形式函数关联，因为它的名称\
  \ `<` 与泛型形式函数的名称 `<` 匹配。\n\n![](img/image07182.jpeg)\n\n之前的示例使用了子程序，而这个 `bean_counting`\
  \ 的变体将它们全部封装为局部子程序。\n\n![](img/image07183.jpeg)\n\n![](img/image07184.jpeg)\n\n\
  ![](img/image07185.jpeg)\n\n```ada\nend add_bean_info;\n\nbegin --bean_counting\n\
  \nread_input( buffer) ;\n\n--接下来，对于刚刚填充的向量‘buffer’中的所有豆子，\n--将每个豆子的信息存储在‘stats_cw’\
  \ 表中。\ndeclare\n  use Bean_Vecs;\n\n  procedure count_bean(c:Cursor) is begin\n\
  \    add_bean_info( Element(c) );\n  end count_bean;\nbegin\n  Iterate( buffer,\
  \ count_bean );\n  --现在计算某些统计数据已经准备就绪。\n-- map 的键（即豆子）按颜色然后按重量排序。\n--‘First’和‘Ceiling’函数将找到表示\n\
  --一组末尾的游标。\ndeclare\n  use Bean_Statistics;\n  q_sum:Integer;\n  q_count:Natural;\n\
  \n  procedure q_stats(lo, hi:Cursor) is\n    k:Cursor := lo;\n  begin\n    q_count\
  \ := 0;\n    q_sum := 0;\n    loop\n      exit when k = hi;\n      q_count := q_count\
  \ + Element(k);\n      q_sum := q_sum + Key(k) * Element(k);\n      Next(k);\n \
  \   end loop;\n  end q_stats;\n--前置\n  pragma assert( not Is_Empty(stats_cw), \"\
  container is empty\") ;\n\n  lower, upper:Cursor := First(stats_cw);\n--分别表示一组的第一个键和下一个\n\
  --组的第一个键\nbegin\n  --开始报告并触发计算\n  Wide_Text_IO.Put_Line( \"Summary:\");\n```\n\n\
  ![](img/image07186.jpeg)\n\n就像问候示例一样，你可以从表中选取值。这次，这些值表示具有某些属性的豆子数量。`stats_cw` 表按键（即豆子属性）排序。给定的特定属性，你可以使用\
  \ `Floor` 和 `Ceiling` 函数来查找表中最符合所需属性的豆子。\n\n现在很容易打印一个直方图，显示每种豆子出现的频率了。如果 N 是某类豆子的数量，则在行上打印\
  \ N 个字符，或者画一个长度为 N 的图形条等。在计算出这种颜色豆子的总和后，可以使用像之前的示例那样的分组绘制每颜色豆子数量的直方图。你可以使用相同的技术从表中删除某种颜色的豆子。\n\
  \n最后，考虑从出现次数最少的种类开始排序豆子。即构造一个向量，首先追加出现一次的豆子，然后是出现两次的豆子（如果有），依此类推。从表开始是可能的，但请确保查看\
  \ `Ada` 的排序函数。\n\n## 24.1 另参见\n\n另参见\n\n### 24.1.1 Wikibook\n\n* `Ada Programming`[1]\n\
