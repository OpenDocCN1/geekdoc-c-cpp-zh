  \n### 34.2.1 标识符\n\nBNF 定义：\n\n![](img/image07292.jpeg)\n\n从该定义中，我们必须排除语言中的保留关键字，它们不能用作标识符。\n\
  \n示例：\n\n以下单词是合法的 Ada 标识符：\n\n![](img/image07293.jpeg)\n\n以下这些**不是** Ada 标识符：\n\n\
  ![](img/image07294.jpeg)\n\n练习：你能给出每一个它们不合法的理由吗？\n\n### 34.2.2 数字\n\n数字字面量由以下字符组成：\n\
  \n• 数字 0..9\n• 小数分隔符 `.`\n• 指数符号 `e` 或 `E`\n• 负号 `-`（仅在指数中）\n• 下划线 `_`\n\n下划线用作提高人类可读性的分隔符，但编译器会忽略它。你可以根据任何理由分隔数字，例如每三位一组十进制整数，或每八位一组二进制整数。\n\
  \n例如，实数 `98.4` 可以表示为：`98.4E1`、`98.4e0`、`984.0e-1` 或 `0.984E+2`，但不能表示为 `984e-1`。\n\
  \n对于整数，例如 `1900`，可以写成 `1900`、`19E2`、`190e+1` 或 `1_900+0`。\n\n数字字面量还可以以非 10 进制表示，通过将数字封装在\
  \ `#` 字符之间，并在前面指定基数，基数可以是 2 到 16 之间的数字。例如，`2#101#` 是 5；带有指数的十六进制数 `16#B#E2` 是 11×16²=28。注意没有负字面量；例如\
  \ `-1` 不是字面量，而是负运算符作用于 `1`。\n\n![](img/image0295.jpeg)\n\n6 [http://en.wikipedia.org/wiki/Backus-Naur_form]\n\
  \n### 34.2.3 字符字面量\n\n它们的类型为 `Standard.Character`、`Wide_Character` 或 `Wide_Wide_Character`。它们由单引号\
