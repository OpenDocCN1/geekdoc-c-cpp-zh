  \n### 4.1.3 case\n\n通常需要将一个特定变量与多个常量表达式进行比较。对于这种条件表达式可以使用 case 语句。例如：\n\n![](img/image06657.jpeg)\n\
  \n`X` 的子类型必须是离散类型，即枚举类型或整数类型。\n\n在 Ada 中，case 语句的一个优势是编译器会检查选择的覆盖范围，即变量 `X` 子类型的所有值必须存在，或者有一个默认分支来指定在剩余情况下需要做什么。\n\
  \n## 4.2 无条件语句\n\n无条件语句允许你在没有条件的情况下改变程序的流。在使用无条件语句时应要小心。它们通常会让程序难以理解。阅读《goto 是邪恶的吗？11\
  \ 获取更多信息。\n\n### 4.2.1 return\n\n结束函数并返回到调用的过程或函数。对于过程：\n\n![](img/image06658.jpeg)\n\
  \n对于函数：\n\n![](img/image06659.jpeg)\n\n11 第 4.2 位于 39 页\n\n![](img/image06660.jpeg)\n\
  \n### 4.2.2 goto\n\ngoto 将控制转移到标签后的语句。\n\n![](img/image06661.jpeg)\n\n\n\n\n\n#\
  \ `goto` 邪恶吗？\n\n人们经常听到 `goto` 是邪恶的，应该避免使用 `goto`。但人们经常忽略的是，任何不是过程或函数内部最后一个语句的 `return`\
  \ 也是一种无条件语句——一个伪装的 `goto`。不过，它们存在一个重要的区别：`return` 是 `goto` 的仅正向用法。异常也是一种 `goto`\
  \ 语句；更糟糕的是，它们甚至不需要指定去往何处！\n\n因此，如果你有包含多个 `return` 语句的函数和过程，你完全可以使用 `goto`。在涉及到读到可读性时，以下两个示例几乎是相同的：\n\
  \n![](img/image06662.jpeg)\n\n![](img/image06663.jpeg)\n\n由于使用 `goto` 需要声明标签（label），因此\
  \ `goto` 的可读性实际上是 `return` 的两倍。所以，如果你关注的是可读性而不是严格的“不要使用 `goto`”编程规则，那么你应该尽量使用 `goto`\
  \ 而不是多个 `return`。当然，最好的方法是结构化方法，即不需要 `goto` 也不需要多个 `return`：\n\n![](img/image06664.jpeg)\n\
  \n## 4.3 循环\n\n循环允许让一组语句重复执行。\n\n### 4.3.1 无限循环\n\n无限循环是一个永远不会结束的循环，内部语句永远重复。这里的“永远”是一个相对术语——如果计算机关闭，即使是无限循环也会非常突然地结束。\n\
  \n![](img/image06665.jpeg)\n\n循环名称（在此例中为 `\"Endless_Loop\"`）是 `Ada` 的可选特性。命名循环有利于读性，但并非严格需要。不过，如果程序需要跳出内部循环（见下文），循环名称就会很有用。\n\
  \n### 4.3.2 条件在开头的循环\n\n这种循环在开头有一个条件。只要满足条件，语句就会重复执行。如果在开头就没有满足条件，则循环内部的语句将永远执行。\n\
  \n![](img/image06666.jpeg)\n\n### 4.3.3 条件在结尾的循环\n\n这种循环在末尾有一个条件，语句会重复执行直到满足条件。由于检查是在末尾进行的，语句至少会被执行一次。\n\
  \n![](img/image06667.jpeg)\n\n### 4.3.4 条件在中间的循环\n\n有时你需要先进行某种计算，并在满足某些标准时退出循环。然而，当不满足标准时，还有其他事情要做。因此，你需要一个退出条件在中间的循环。\n\
  \n![](img/image06668.jpeg)\n\n在 `Ada` 中，退出条件也可以与任何其他循环语句结合。你可以有多个退出语句。如果你有嵌套的循环，还可以退出命名的外层循环。\n\
  \n### 4.3.5 for 循环\n\n通常人们需要一个循环，让特定变量从给定的开始值递增或递减特定的结束值。你可以在这里使用 `while` 循环——但这是一个非常常见的循环，所以有更简单的语法。\n\
  \n![](img/image06669.jpeg)\n\n你不需要像示例那样同时声明类型和范围。如果你省略了类型，编译器将根据上下文确定类型；如果省略了范围，则循环将遍历该类型的每个有效值进行迭代。\n\
  \n![](img/image06670.jpeg)\n\n正如 `Ada` 一如既往：当“由上下文确定”给出两个或更多可能的选项时，将显示错误，此时你必须指定要使用的类型。`Ada`\
  \ 只在安全的情况下才会进行“猜测”。\n\n#### 数组上的 for 循环\n\n另一个非常常见的情况是需要一个遍历数组每个元素的循环。下面的示例代码向你展示了如何实现：\n\
  \n![](img/image06671.jpeg)\n\n假设 `X` 是一个数组。注意：这种语法主要用于数组——因此得名如此——但在需要完整迭代时也适用于其他类型。与其他循环计数器不同，`for`\
  \ 语句中的循环计数器 `i` 的值是修改的。以下是非法的：\n\n```\nfor i in 1..10 loop\n  i := i + 1;\nend loop;\n\
  ```\n\n此外，循环的声明在循环体之后停止。\n\n#### 演示\n\n下面的演示展示了如何遍历 `integer` 类型的每个元素。\n\n![](img/image06672.jpeg)\n\
