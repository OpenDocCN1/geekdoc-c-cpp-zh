  \n大多数编程语言都有“语句”的概念。语句是程序员给计算机的命令。例如\n\n![](img/image07285.jpeg)\n\n如果你在文件中多个命令，每条命令都将按照从上到下的顺序执行。因此，文件可能包含：\n\
  \n![](img/image07286.jpeg)\n\n## 32.1 赋值语句\n\n# 33 变量\n\n变量是引用，代表存储在特定内存地址的值。\n\n\
  变量被认为有一个值，并可能具有数据类型 [1]。如果一个变量有类型，则只能将该类型的值赋值给它。变量并不总是有类型。一个值可以具有许多不同类型的数值：整数 (7)、比例\
  \ (1/2)、(实数的)近似值 (10.234)、复数 (4+2i)、字符 ('a')、字符串 (\"hello\") 以及更多。\n\n不同的语言对其类型使用不同的名称，并且不包含上述任何内容。\n\
  \n\n\n\n\n赋值语句用于为变量设置新值。赋值语句的形式为 `name = value`。\n\n![](img/image07287.jpeg)<map\
  \ name=\"awmap5\"><area shape=\"rect\" href=\"_bookmark0\" coords=\"71, 11, 77,\
