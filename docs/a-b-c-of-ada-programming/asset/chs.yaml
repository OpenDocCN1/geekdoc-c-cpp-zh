  \n# 27 技巧\n\n## 27.1 类型的完整声明可以推迟到单元体中\n\n类型的完整声明可以推迟到单元体中。\n\n通常，你想要修改私有类型的内部实现。这反过来又要求修改处理该类型的算法。如果类型在单元规格（unit\
  \ specification）中完成定义，那么编辑并重新编译两个文件将是一件痛苦的事，即使使用了 `IDE` 1，但这是一些程序员学会并接受的现象。\n\n\
  事实证明，你不必这样做。`ARM` 2 中曾随口带过、且在教程中通常被忽略的一个事实是：私有类型可以在单元体本身中完成定义，使得它们与相关代码更接近，并节省了对规格以及每个依赖它的单元的编译。这看起来可能是一件小事，对于小项目来说确实如此。然而，如果你有那种需要进行几十次调整的难以配合的类型，或者你的依赖图深度很大，那么节省的时间和烦恼就会迅速累积。\n\
  \n此外，这种结构在编写共享库时非常有用，因为它允许在更改类型实现的同时仍提供兼容的 `ABI` 3。\n\n代码示例：\n\n![](img/image07197.jpeg)\n\
  \n公共部分中的类型是一个访问器 4。它的缺点是内存管理必须由包的实现提供。这就是为什么 `Private_Type` 是一个受限类型，客户端不允许拷贝访问值，以防止悬空引用。\n\
  \n![](img/image07198.jpeg)\n\n1 [`en.wikipedia.org/wiki/Integrated%20development%20environment`](http://en.wikipedia.org/wiki/Integrated%20development%20environment)\n\
  2 [`www.adaic.org/standards/95lrm/html/RM-TTL.html`](http://www.adaic.org/standards/95lrm/html/RM-TTL.html)\n\
  3 [`en.wikipedia.org/wiki/Application_binary_interface`](http://en.wikipedia.org/wiki/Application_binary_interface)\n\
  4 第 13 章，第 99 页\n\n这些类型有时被称为“Taft 类型”——以 Ada 95 的主设计师 Tucker Taft 命名——因为它们是在针对 Ada\
  \ 83 的所谓的“Taft 修正案”中引入的。在其他编程语言中，这种技术被称为“不透明指针” 5。\n\n## 27.2 通过泛型实现 Lambda 演算\n\
  \n通过通过泛型实现 Lambda 演算。\n\n假设你决定自己实现一套集合 6 类型。你可以向它添加内容、从中删除内容，并且你想让用户对它的所有成员应用某些函数。但作用域规则似乎在与你作对，迫使几乎所有内容都变成全局的。\n\
  \n思维上的障碍是，大多数给出的泛型 7 示例都是包，而 `Set` 包本身已经是泛型的。在这种情况下，解决方案是让 `Apply_To_All` 过程也变成泛型；即嵌套泛型。包内部的泛型过程处于一种奇怪的作用域临界状态，其中在实例化时作用范围内的任何内容都可以被实例化使用，而形式参数通常在作用范围内的任何内容都可以被形式参数访问。最终结果是相关的作用域规则不再适用。这并不是完整的\
  \ Lambda 演算，只是其中最有用的部分之一。\n\n![](img/image07199.jpeg)\n关于 Ada 中的函数式编程，请参阅 252.xhtml__bookmark656)。\n\
  \n## 27.3 编译器消息\n\n不同的编译器诊断问题的方式可能不同，或者使用不同的消息诊断同一问题等。手头有两个编译器是有用的。\n\n### 选定组件\
  \ (selected component)\n\n当源程序包含如 `Foo.Bar` 这样的结构时，你可能会看到类似 `selected component\
  \ \"Bar\"` 的消息，或者类似 `selected component \"Foo\"` 的消息。这些短语可能会令人困惑，因为一个指向 `Foo`，而另一个指向\
  \ `Bar`。\n\n![\n5 [`en.wikipedia.org/wiki/opaque_pointer`](http://en.wikipedia.org/wiki/opaque_pointer)\n\
  6 [`en.wikipedia.org/wiki/Set%20(computer%20science)`](http://en.wikipedia.org/wiki/Set%20(computer%20science))\n\
  7 第 20 章，第 161 页\n8 Ada 中的函数式编程？[`okasaki.blogspot.com/2008/07/functional-programming-inada.html`](http://okasaki.blogspot.com/2008/07/functional-programming-inada.html)，作者\
  \ Okasaki\n\n它们都是正确的。原因是 `selected_component` 是 Ada 语法中的一项（4.1.3 选定组件 [`www.adaic.org/resources/add_content/docs/05rm/html/RM-4-1-3`](http://www.adaic.org/resources/add_content/docs/05rm/html/RM-4-1-3)）。它表示：前缀、点和\
  \ `selector_name`。在 `Foo.Bar` 示例中，这些分别对应 `Foo`、`.` 和 `Bar`。在编译器消息中寻找更多的语法词，例如“prefix”，并将它们与引号中的标识符关联起来。\n\
  \n例如，如果你向编译器提交以下代码，\n\n![](img/image07201.jpeg)\n\n编译器可能会打印关于前缀组件的诊断消息：Foo 的作者认为\
  \ `Pak` 表示包，但实际上它是泛型包的名字。（这需要先实例化；然后实例名称才是合适的前缀。）\n\n## 27.4 通用整数\n\n通用整数。所有的整数字面量以及某些如\
  \ `'Length` 的属性都是匿名类型 `universal_integer`，它包含了数学整数的集合。命名数字也是这种类型，并且计算精确（除了机器存储限制外没有溢出），例如：\n\
  \n![](img/image07202.jpeg)\n\n由于 `universal_integer` 没有运算符，在这个示例中它的值被转换为 `root_-integer`（另一个匿名类型），进行计算后结果再次转换回\
  \ `universal_integer`。\n\n通常 `universal_integer` 的值在某些表达式中使用会被隐式转换为相应的类型。因此，表达式\
  \ `not A'Length` 是允许的；`A'Length` 的被解释为模整数，因为 `not` 只能应用于模整数（当然需要上下文来决定是指哪种模整数类型）。这种特性可能会导致陷阱。考虑\n\
  \n![](img/image07203.jpeg)\n\n以及然后\n\n\n\n\n\n![](img/image07204.jpeg)\n\n![](img/image07205.jpeg)\n\
  \n第二个条件无法编译，因为 `in` 左侧的表达式与右侧的类型不兼容。注意，`not` 的优先级高于 `in`。它不会否定整个成员性测试，而仅否定 `A' Length`。\n\
  \n第四个条件以各种方式失败了。\n\n第六个条件可能是正确的，因为 `not` 将 `A' Length` 转换为一个模值，如果该值被模类型 `Mod_6`\
  \ 覆盖，那么就是可以的。\n\nGNAT GPL 2009 分别给出了这些诊断：\n\n![](img/image07206.jpeg)\n\n避免这些问题的方法是使用\
