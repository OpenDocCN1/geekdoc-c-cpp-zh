  \n# 16 子程序\n\n在 Ada 中，子程序被分为两类：`procedures`[#part0127.xhtml__bookmark382] 和 `functions`[#part0127.xhtml__bookmark383]。过程调用是一个语句，不返回任何值，而函数返回一个值，因此必须是一个表达式。\n\
  \n## 16.1 过程\n\n过程\n\nAda 中的过程调用本身构成一个语句。例如：\n\n![](img/image06905.jpeg)\n\n当使用语句调用过程时：\n\
  \n![](img/image06906.jpeg)\n\n\n\n\n\n表达式 `5 + P` 和 `48` 被求值（表达式仅允许出现在参数中），然后被赋值给形式参数\
  \ `A` 和 `B`，它们的行为类似于常量。然后，值 `A + B` 被赋值给形式变量 `C`，当过程执行结束时，该值将赋值给实际参数 `Q`。\n\n`C`\
  \ 作为一个一个 `out` 参数，在第一次赋值之前是一个未初始化的变量。（因此，在 Ada 83 中，存在对 `out` 参数为只写写的限制。如果你想读取已写入的值，必须声明一个局部变量，用它进行所有计算，最后在返回之前将其赋值给\
  \ `C`。这种做法很麻烦且容易出错，因此该限制在 Ada 95 中被删除了。）\n\n在过程内部，可以使用不带参数的 `return` 语句来退出过程并将控制权返回给调用者。\n\
  \n例如，求解类似于 `ax2 + bx + c = 0` 类型的方程：\n\n![](img/image06907.jpeg)\n\n函数 `SQRT` 计算非负值的平方根。如果根是实数，它们将通过\
  \ `R1` 和 `R2` 返回；但如果根是复数或方程退化（`A = 0`），过程执行将在向 `Valid` 变量赋值 `False` 值后结束，以便在调用过程后对其进行控制。注意，`out`\
  \ 参数应该至少被修改一次，并且如果没有指定模式，则隐含该模式。\n\n## 16.2 函数\n\n### 函数\n\n函数是一个可以作为表达式的一部分被调用的子程序。在\
  \ Ada 2005 之前，函数只能输入（默认）或访问参数；后者可以用作对函数不能拥有 `out` 参数这一限制的变通方法。Ada 2012 删除了这一限制。\n\
  \n这是一个函数体体的示例：\n\n![](img/image06908.jpeg)\n\n或者在 Ada2012 中：\n\n![](img/image06909.jpeg)\n\
  \n甚至更短，作为一种表达式函数\n\n![](img/image06910.jpeg)\n\n模式为 `in` 的形式参数的行为类似于局部常量，其值由相应的实际参数提供。`return`\
  \ 语句用于指示函数调用返回的值，并将控制权交给调用该函数的表达式。`return` 语句的表达式可以是任意复杂度的，并且必须与规范中声明的类型相同。如果使用了不兼容的类型，编译器会报错。如果没有满足子类型的限制（例如范围），它将抛出\
  \ `Constraint_Error` 异常。\n\n函数体可以包含多个 `return` 语句，执行其中任何一个都将结束函数，并将控制权返回给调用者。如果函数内部的控制流以多种方式分支，则需要确保每个分支都以\
  \ `return` 语句结束。如果在运行时到达函数末尾而没有遇到 `return` 语句，则将抛出 `Program_Error` 异常。因此，函数体必须至少有一个这样的\
  \ `return` 语句。\n\n每次调用函数都会产生内部声明的任何对象的新副本。当函数结束时，其对象就会消失。因此，可以递归地调用函数。例如，考虑 `factorial`\
  \ 函数的这种实现：\n\n![](img/image06911.jpeg)\n\n当评估表达式 `Factorial (4)` 时；函数将带有参数 `4` 被调用，在函数内部它将尝试求值表达式\
  \ `Factorial (3)`，将自身作为函数调用，但在这种情况下参数 `N` 将是 `3`（每次调用都会复制参数），依此类推，直到 `N = 1` 被求值，这将结束递归，然后表达式将按照反向顺序开始完成。\n\
  \n函数的形式参数可以是任何类型，包括向量或记录。然而，它不能是匿名类型，也就是说它的类型必须提前声明，例如：\n\n![](img/image06912.jpeg)\n\
  \n在这个示例中，函数可以用于任意维度的向量。因此，传递给的参数中没有静态边界。\n\n## 16.3 命名参数\n\n### 命名参数\n\n在子程序调用中，命名参数表示（即形式参数名后跟\
