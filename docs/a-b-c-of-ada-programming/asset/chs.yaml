  \ Goto 语句\n* 6.5 Return 语句\n\n![](img/image06674.jpeg)\n\n# 5 类型系统\n\n`Ada` 的类型系统允许程序员构建表示真实的强大抽象，并为编译器提供有用信息，以便编译器在错误变成\
  \ bug 之前发现许多逻辑或设计错误。它是语言的核心，优秀的 `Ada` 程序员学会了充分利用它。四个原则支配着类型系统：\n\n* **强类型**：类型之间互是不兼容的，因此无法将苹果和橘子混合。然而，有方法可以在类型之间转换。\n\
  * **静态类型**：在编译时检查类型，这允许尽早发现类型错误。\n* **抽象**：类型表示现实世界或当前处理的问题；而不是计算机内部表示数据的方式。有方法可以精确指定类型在位级别上的表示方式，但我们将该讨论推迟到另一章节。\n\
  \n\n\n\n\n-   名称等效（Name equivalence），与大多数其他语言中使用的结构等效相反。两种类型当且仅当它们具有相同的名称时才是兼容的；而不是仅仅因为它们的大小或位表示相同。因此，你可以声明两个范围相同但完全不兼容的整数类型，或者声明两个组件完全相同但互斥的记录类型。\n\
  \n类型之间是不兼容的。然而，每个类型都可以拥有任意数量的子类型，这些子类型彼此以及与它们的基类型是兼容的。\n\n## 5.1 预定义类型\n\n### 预定义类型\n\
  \n有几种预定义类型，但大多数程序员更定义定义特定类型。尽管如此，这些预定义类型作为独立开发的库之间的接口非常有用。预定义库显然使用了这些类型。\n\n这些类型在\
  \ `Standard` 包中预定义：\n\n#### 整数 (Integer)\n该类型至少涵盖 $-2^{15} +1 .. +2^{15} -1$ 的范围（RM\
  \ 3.5.4 (21) [http://www.adaic.org/resources/add_content/standards/05rm/html/RM-3-5-4.html]）。标准还定义了该类型的\
  \ `Natural`（自然）和 `Positive`（正）子类型。\n\n#### 浮点数 (Float)\n该类型只有一个非常弱的实现要求（RM 3.5.7\
  \ (14) [http://www.adaic.org/resources/add_content/standards/05rm/html/RM-3-5-7.html]）；大多数情况下，你会定义自己的浮点类型，并指定你的精度和范围要求。\n\
  \n#### 持续 (Duration)\n一种用于计时的定点类型。它表示以秒为单位的时间（RM A.1 (43) [http://www.adaic.org/resources/add_content/standards/05rm/html/RM-A-1.html]）。\n\
  \n#### 字符 (Character)\n`Enumerations`（枚举）的一种特殊形式。字符类型有三种预定义的种类：8 位字符（称为 `Character`）、16\
  \ 位字符（称为 `Wide_Character`）和 32 位字符（`Wide_Wide_Character`）。`Character` 自语言的第一版本（Ada\
  \ 83）起就存在，`Wide_Character` 包含在 Ada 95 中，而 `Wide_Wide_Character` 类型在 Ada 2005 中可用。\n\
  \n#### 字符串 (String)\n三种不确定数组类型，分别为 `Character`、`Wide_Character` 和 `Wide_Wide_Character`。标准库包含处理三种变体字符串的包：固定长度（Ada）、在某个上限以下变长（Ada）以及无界长度（Ada）。这些每个包都有一个\
  \ `Wide_and` 和 `Wide_Wide_variant`。\n\n#### 布尔值 (Boolean)\nAda 中的 `Boolean` 是 `False`\
  \ 和 `True` 的 `Enumeration`（枚举），具有特殊的语义。\n\n`System` 和 `System` 包预定义了一些类型，这些类型主要用于底层编程和硬件接口交互。\n\
  \n#### System.Address\n内存中的地址。\n\n#### System.Storage_Elements.Storage_Offset\n\
  偏移量，可以加到地址上获得新地址。你也可以从一个地址减去另一个地址来获得它们之间的偏移量。`Address`、`Storage_Offset` 及其相关程序提供了地址算术。\n\
  \n#### System.Storage_Elements.Storage_Count\n`Storage_Offset` 的子类型，不能为负数，表示数据结构的内存大小（类似于\
  \ `size_t`）。\n\n#### System.Storage_Elements.Storage_Element\n在大多数计算机中，这是一个字节。形式上讲，它是具有地址的最小内存单元。\n\
  \n#### System.Storage_Elements.Storage_Array\n一个 `Storage_Elements` 数组，没有任何特殊含义，在进行原始内存访问时有用。\n\
  \n## 5.2 类型层次结构\n\n### 类型层次结构\n\n类型按分级结构组织。类型继承其层次结构中上方类型的属性。例如，所有标量类型（整数、枚举、模数、定点和浮点类型）都定义了运算符\
  \ `<`、`>` 以及算术运算符，并且所有离散类型都可以作为数组索引。\n\n以下是每类类型的粗括概述；请遵循链接查看详细说明。括号内是为熟悉这些语言的读者提供的\
  \ C 和 Pascal 中的等价项。\n\n#### 有符号整数 (int, INTEGER)\n有符号整数通过所需的数值范围定义。\n\n#### 无符号整数\
  \ (unsigned, CARDINAL)\n无符号整数被称为模数类型（Modular Types）。除了无符号外，它们还具有回绕功能。\n\n#### 枚举\
  \ (enum, char, bool, BOOLEAN)\nAda `Enumeration` 类型是一个独立的类型族。\n\n#### 浮点数 (float,\
  \ double, REAL)\n浮点类型由所需的位数和相对误差界定义。\n\n#### 普通和十进制定点 (DECIMAL)\n定点类型由其 `delta`（绝对误差界）定义。\n\
  \n#### 数组 ([ ], ARRAY [] OF, STRING)\n支持在编译时和运行时确定的数组。\n\n#### 记录 (struct, class,\
  \ RECORD OF)\n记录是一种分组了一个或多个字段的复合类型。\n\n#### 访问 (*, ^, POINTER TO)\nAda 的 `Access`\
  \ 类型可能不仅仅是一个简单的内存地址。\n\n#### 任务与保护 (C 或 Pascal 中无等价项)\n任务（Task）和保护（Protected）类型允许控制并发。\n\
  \n#### 接口 (C 或 Pascal 中无等价项)\n\n\n\n\n\n# 第 69 页的第 6 章\n# 第 71 页的第 7 章\n# 第 73 页的第\
  \ 8 章\n# 第 77 页的第 9 章\n# 第 79 页的第 10 章\n# 第 83 页的第 11 章\n# 第 91 页的第 12 章\n\n[http://en.wikibooks.org/wiki/Ada%20Programming%2FTypes%23List%20of%20types]\n\
  # 第 99 页的第 13 章\n# 第 173 页的第 21 章\n[http://en.wikibooks.org/wiki/Ada%20Programming%2FKeywords%2Finterface]\n\
  \n这些类型是 Ada 2005 新引入的，类似于 Java 接口。\n\n## 5.2.1 类型的分类\n\n该层次结构中的类型可以分类如下。\n\n###\
  \ 特定类型（Specific）与类类型（Class-wide）\n\n![](img/image06679.jpeg)\n\n特定类型的操作是非分派的（non-dispatching），而类类型的操作是是分派的（dispatching）。\n\
  \n新类型可以通过派生特定类型来声明；原始操作通过派生继承。你不能从类类型进行派生。\n\n### 受约束类型（Constrained）与无约束类型（Unconstrained）\n\
  \n![](img/image06680.jpeg)\n\n通过为无约束子类型提供一个约束，子类型或对象就变成了受约束的：\n\n![](img/image06681.jpeg)\n\
  \n只有在上方类型声明中给出了默认值时，才能声明无约束对象。语言没有规定如何分配此类对象。GNAT 分配最大大小，因此由于判别符（discriminant）变化而可能发生的大小变化没有问题。另一种可能性是在堆上进行隐式动态分配，并在大小变化时释放并随后重新分配。\n\
  \n### 确定类型（Definite）与不确定类型（Indefinite）\n\n![](img/image06682.jpeg)\n![](img/image06683.jpeg)\n\
  \n确定子类型允许在没有初始值的情况下声明对象，因为确定子类型的约束在创建时是已知的。不确定子类型的对象声明需要一个初始值来提供约束；它们将由初始值提供的约束进行约束。\n\
  \n![](img/image06684.jpeg)\n\n### 无约束类型与不确定类型\n\n注意，无约束子类型并不一定是不确定的，如上文 RD 所示：它是一个确定无约束子类型。\n\
  \n## 5.3 并发类型\n\nAda 语言除了分类数据外，类型还用于另一个目的。类型系统集成了并发（线程、并行）。程序员将使用类型来表示程序的并发控制流。类型系统这部分的核心部分——任务类型和保护类型，将在后续章节中进行详细解释。\n\
  \n## 5.4 限制类型（Limited Types）\n\n限制类型意味着不允许赋值。上述的“并发类型”总是受限制的。程序员可以定义自己的受限制类型，如下所示：\n\
  \n![](img/image06685.jpeg)\n\n（省略号代表私有或记录定义，请参见本页的相应子节。）受限制类型也没有相等运算符，除非程序员定义一个。你可以在限制类型章节中学习更多信息。\n\
  \n## 5.5 定义新类型和子类型\n\n![](img/image06686.jpeg)\n\n第 173 页的第 21 章\n第 113 页的第 14 章\n\
  \n### 定义新类型和子类型\n\n你可以使用以下语法定义新类型：\n\n![](img/image06687.jpeg)\n\n随后是该类型的描述，在每种类型类别中都有详细解释。从形式上讲，上述声明创建了一个类型及其第一个名为\
  \ `T` 的子类型。该类型本身（正确地称为“T 的类型”）是匿名的；RM（参考手册）将其称为 `T`，但通常对该类型的表述并不严谨。不过，这只是学术上的考量；对于大多数目的来说，将\
  \ `T` 视为一个类型就足够了。对于标量类型，还有一个名为 `T'Base` 的基类型，它包含了 `T` 的所有值。\n\n对于有符号整数类型，`T` 的类型由数学整数的（完整）集合。基类型是一个特定的硬件类型，关于零对称（除可能有一个额外值外），包含了\
  \ `T` 的所有值。\n\n如上文所述，所有类型之间都是不兼容的；因此：\n\n![](img/image06688.jpeg)\n\n是非法的，因为 `Integer_1`\
  \ 和 `Integer_2` 是不同的且不兼容的类型。正是特性允许编译器在编译时检测逻辑错误，例如将文件描述符加到字节数，或将长度加到重量。两种类型范围相同并不意味着它们兼容：这是名称等效性（name\
  \ equivalence）的作用，而不是结构等效性。（在后面，我们将看到如何在不兼容类型之间进行转换；对此有严格的规则。）\n\n#### 5.5.1 创建子类型\n\
  \n你也可以为给定类型创建新的子类型，它们之间是兼容的，如下所示：\n\n![](img/image06689.jpeg)\n\n`Integer_2` 的声明是错误的，因为约束\
  \ `7 ..11` 与 `Integer_1` 不兼容；它在子类型具体化时会抛出 `Constraint_Error`。`Integer_1` 和 `Integer_3`\
  \ 是兼容的，因为它们都是相同类型的子类型，即 `Integer_1'Base`。\n\n子类型的范围没有必要重叠，或相互包含。当你将 `A` 赋值给 `B`\
  \ 时，编译器会插入运行时范围检查；如果此时 `A` 的值恰好在 `Integer_3` 的范围之外，程序将抛出 `Constraint_Error`。\n\n\
  有几个预定义的子类型非常有用：\n\n![](img/image06690.jpeg)\n\n#### 5.5.2 派生类型（Derived types）\n\n\
  派生类型是从现有类型创建的、完整的类型。像任何其他类型一样，它与其父类型不兼容；但是，它继承了父类型定义的原始操作。\n\n![](img/image06691.jpeg)\n\
  \n这里两种类型都是离散的；派生类型的范围必须在父类型的范围之内。将此与子类型对比。原因是派生类型继承了父类型定义的原始操作，而这些操作假设了父类型的范围。这里是该特性的说明：\n\
  \n![](img/image06692.jpeg)\n\n\n\n\n\n当我们调用 `P (B)` 时，参数 `B` 被转换为 `Integer_1`；这种转换理然通过的，因为派生类型（此处为\
  \ `8 .. 10`）的可接受值集合必须包含在父类型（`1 .. 10`）的范围之内。然后使用转换后的参数调用 `P`。\n\n然而，考虑上述示例的变体：\n\
  \n![](img/image06693.jpeg)\n\n当调用 `P (B, Y)` 时，两个参数都会被转换为 `Integer_1`。因此，`P` 体内部对\
  \ `J (7)` 的范围检查将通过。然而，在返回时，参数 `Y` 被转换回 `Integer_2`，对 `Y` 的范围检查自然会失败。\n\n考虑到上述点，你将看到为什么在接下来的程序中运行时会调用\
  \ `Constraint_Error`。\n\n![](img/image06694.jpeg)\n\n# 5.6 子类型分类\n\n子类型分类\n\nAda\
  \ 支持多种类型的子类型，它们具有不同的功能。以下是按字母顺序排列的概述。\n\n### 5.6.1 匿名子类型\n\n没有分配名称的子类型。此类子类型通过变量声明来创建：\n\
  \n![](img/image06695.jpeg)\n\n在这里，`(1 .. 10)` 是约束。此变量声明等同于：\n\n![](img/image06696.jpeg)\n\
  \n### 5.6.2 基础类型\n\n在 Ada 中，所有类型都是匿名的，只有子类型可以命名。对于标量类型，匿名类型有一个特殊的子类型，称为“基础类型”（base\
  \ type），可以使用 `'Base` 属性进行命名。基础类型包含了第一个子类型的所有值。示例示例：\n\n![](img/image06697.jpeg)\n\
  \n基础类型 `Int'Base` 是由编译器选择的硬件类型，包含了 `Int` 的值。因此，它的范围可能是 `-2**7 .. 2**7-1` 或 `-2**15\
  \ .. 2**15-1` 或任何其他类型。\n\n![](img/image06698.jpeg)\n\n`Enum'Base` 等于 `Enum`，但 `Short'Base`\
  \ 还别持有字面量 `D`。\n\n![](img/image06699.jpeg)\n\n### 5.6.3 受限子类型\n\n一种增加了约束的未受限（indefinite）子类型。下面的示例定义了一个\
  \ 10 字符的字符串子类型。\n\n![](img/image06700.jpeg)\n\n你不能对未受限子类型进行部分约束：\n\n![](img/image06701.jpeg)\n\
  \n必须给出所有索引的约束，结果必然是一个确定子类型。\n\n### 5.6.4 确定子类型\n\n确定子类型是指大小在编译时已知的子类型。根据定义，所有非不定的子类型都是确定子类型。\n\
  \n声明确定子类型的对象可以不带额外的约束。\n\n### 5.6.5 不定子类型\n\n不定子类型是指大小在编译时未知但在运行时动态计算的子类型。不定子类型本身并不提供创建对象所需的信息；需要额外的约束或显式初始化表达式来计算实际大小并创建对象。\n\
  \n![](img/image06702.jpeg)\n\n`X` 是不定（子）类型 `String` 的对象。它的约束从其初始值隐式推导出。`X` 可能会改变其值，但不会改变其边界。\n\
  \n需要注意的是，没有必要从字面量初始化对象。你也可以使用函数。例如：\n\n![](img/image06703.jpeg)\n\n\n\n\n\n编译器首先检查转换是否合法，如果合法，它会在转换点处插入一个运行时检查；因此这种转换被称为**检查转换**（checked\
  \ conversion）。如果转换失败，程序将抛出 `Constraint_Error`。大多数编译器非常智能，会优化掉约束检查；因此，你不需要担心任何性能损失。某些编译器还可以警告约束检查将始终失败（并用无条件抛出来优化该检查）。\n\
  \n显式类型转换是合法的：\n\n* 在任意两种数值类型之间\n* 在同类型的任意两个子类型之间\n* 在任意两个源自同类型的类型之间（注意标记类型/tagged\
  \ types 的特殊规则）\n* 在某些条件下数组类型之间（参见 `RM 4.6(24.2/2..24.7/2)`）\n* 在其他任何地方都不允许\n\n（随着类范围类型和匿名访问类型的引入，规则会变得更加复杂。）\n\
  \n![](img/image06715.jpeg)\n\n此示例说明了显式类型转换：\n\n![](img/image06716.jpeg)\n\n![](img/image06717.jpeg)\n\
  \n在任意两种数值类型（整数、定点型和浮点型）之间都可以进行显式转换。如果涉及的类型之一是定点或浮点类型，编译器不仅会检查范围约束（因此上述代码将抛出 `Constraint_Error`），还会执行任何必要的精度损失。\n\
  \n示例 1：精度损失导致过程只打印“0”或“1”，因为 `P / 100` 是整数，且始终为零或一。\n\n![](img/image06718.jpeg)\n\
  \n示例 2：我们使用中间浮点类型来保证精度。\n\n![](img/image06719.jpeg)\n\n你可能会问为什么要在同一类型的子类型之间进行转换。一个示例将说明这一点。\n\
  \n![](img/image06720.jpeg)\n\n在这里，`Slice` 的边界是 1 和 10，而 `X (11 .. 20)` 的边界是 11 和\
  \ 20。\n\n### 5.8.2 表示的变化\n\n类型转换可以用于记录或数组的打包和解包。\n\n![](img/image06721.jpeg)\n\n\
  ![](img/image06722.jpeg)\n\n### 5.8.3 非数值类型的检查转换\n\n上面的示例都围绕数值类型之间的转换展开；通过这种方式可以在任意两种数值类型之间进行转换。但非数值类型之间（例如数组类型或记录类型之间）会发生什么？答案是两方面的：\n\
  \n* 你可以在类型和派生自它的类型之间，或者在源自同类型的类型之间进行显式转换，\n* 仅此而已。没有其他可能的转换。\n\n你为什么想从一个记录类型派生另一个记录类型？这是因为表示子（representation\
  \ clauses）。在这里我们进入了底层系统编程领域，这可不是胆小者的领域，对桌面应用程序也没有什么用。所以请坐稳了，让我们深入其中。\n\n假设你有一个使用默认高效表示的记录类型。现在你想将此记录写入一个使用特殊记录格式的设备。这种特殊表示更紧凑（使用的位较少），但效率极低。你想要一个分层编程接口：用于应用程序的上层使用高效表示；底层是直接访问硬件的设备驱动程序，使用低效表示。\n\
  \n![](img/image06723.jpeg)\n\n编译器为 `Register` 选择了默认的高效表示。例如，在 32 位机器上，它可能会使用三个 32\
  \ 位的字，分别用于 `A`、`B` 和 `Size`。这种高效表示对应用程序是有益的，但在某一点，我们希望将整个记录转换为仅 8 位，因为这是我们的硬件要求的。\n\
  \n![](img/image06724.jpeg)\n\n在上面的示例中，包体部声明了一个具有低效但紧凑表示的派生类型，并从其转换。这说明了类型转换可以导致表示的变化。\n\
  \n### 5.8.4 面向对象编程中的视图转换\n\n在面向对象编程中，你必须区分特定类型（specific types）和类范围类型（class-wide\
  \ types）。对于特定类型，只有向祖先的转换是可能的，且经过检查。在转换过程中，你并没有“丢”派生类型中存在的组件；它们只是存在那里。这被称为**视图转换**（view\
  \ conversion）。\n\n![](img/image06725.jpeg)\n\n由于在面向对象编程中，子类型对象就是父类型对象，因此不需要运行时检查。对于类范围类型，向祖先和子类型的转换都是可能的，并且同样经过检查。这些转换也是视图转换，不会产生数据。\n\
  \n![](img/image06726.jpeg)\n\n这种视图转换涉及运行时检查，以确定 `Parent_View` 确实是 `Child_Type` 对象的视图。在第二情况下，运行时检查接受\
  \ `Child_Type` 类型的对象。\n\n重命名声明不创建任何新对象也不执行任何转换；它只是给已存在的东西起一个新名字。由于重命名完全在编译时完成，性能是最优的。我们在这里提到它是因为常用的用法。\n\
  \n现在，`Parent_View` 不是一个新对象，而是视为父类的 `Child_Instance` 的另一个名称，即只有父类组件可见，进一步的子组件被隐藏了。\n\
  \n### 5.8.5 地址转换\n\nAda 的访问类型（access type）不仅仅是一个内存位置（细指针）。取决于实现和使用的访问类型，访问可能会保留额外信息（胖指针/fat\
  \ pointer）。例如，GNAT 为每次访问无限对象保留了两个内存地址——一个用于数据，另一个用于约束信息（Size, First, Last）。\n\n\
  如果你想将访问转换为简单的内存位置，可以使用 `System` 包。但注意，地址和胖指针之间不能相互可逆地转换。\n\n数组对象的地址是其第一个组件的地址。因此，在此类转换中边界会丢失。\n\
  \n![](img/image06730.jpeg)\n\n### 5.8.6 未检查转换\n\nPascal 受到的极大批评之一是“无处可逃”。原因是有时你必须转换那些不兼容的内容。为了这一目的，Ada\
  \ 提供了泛型函数 `Unchecked_Conversion`：\n\n```\n![](img/image06731.jpeg)\n```\n\n\n\n\n\
  `Unchecked_Conversion` 将对源数据进行位拷贝，并在没有任何任何检查的情况下按照目标类型对其进行重新解释。你的任务是确保满足 `RM 13.9`\
  \ (http://www.adaic.org/resources/add_content/standards/05rm/html/RM-13-9.html)\
  \ 中规定的关于未检查转换的要求；否则，结果将取决于实现，甚至可能导致数据异常。在出现问题的情况的情况下，请使用“转换后的有效性属性（Valid attribute\
  \ after the conversion）”来检查数据的有效性。\n\n对 `Unchecked_Conversion`（其实例）的函数调用会将源数据拷贝到目标。编译器也可能进行就地转换（每个实例都有约定\
  \ `Intrinsic`）。\n\n要使用 `Unchecked_Conversion`，你需要实例化该泛型。\n\n![](img/image06732.jpeg)\n\
  \n在下例示例中，你可以看到是如何操作的。运行时，该示例将输出“A = -1, B = 255”。不会报告错误，但这是你预期的结果吗？\n\n![](img/image06733.jpeg)\n\
  \n在赋值 `B := Convert (A);` 中，当然存在范围检查。因此，如果 `B` 定义为 `B: Byte range 0 .. 10;`，则会引发\
  \ `Constraint_Error`。\n\n### 5.8.7 覆盖 (Overlays)\n\n如果拷贝 `Unchecked_Conversion`\
  \ 的结果在性能方面浪费太大，那么你可以尝试覆盖，即地址映射。通过使用覆盖，两个对象共享相同的内存位置。如果你为其中一个赋值赋值，另一个也会发生变化。语法如下：\n\
  \n![](img/image06734.jpeg)\n\n其中 `expression` 定义了源对象的地址。\n\n虽然覆盖看起来比 `Unchecked_Conversion`\
  \ 更优雅，但你应该意识到它们更加危险，并且具有更大的产生严重错误的潜力。例如，如果 `Source'Size < Target'Size` 且你向 `Target`\
  \ 赋值，你可能会无意中写入分配给另一个对象的内存中。\n\n你还需要处理目标类型对象的隐式初始化，因为它们会覆盖源对象的实际值。可以使用约定为 `Ada` 的\
  \ `Import` pragma 来防止这一点，因为它避免了隐式初始化，`RM B.1` (http://www.adaic.org/resources/add_content/standards/05rm/html/RM-B-1.html)。下面的示例与“未检查转换”中的示例相同。\n\
  \n![](img/image06735.jpeg)\n\n### 5.8.8 导出 / 导入 (Export / Import)\n\n仅供记录：还有另一种使用\
  \ `pragma` 和 `pragma` 指令的方法。然而，由于这种方法比覆盖更彻底破坏 Ada 的可见性和类型概念，它在这个语言介绍中没有位置之地，留给专家处理。\n\
  \n## 5.9 有符号整数类型的详尽讨论\n\n有符号整数类型的详尽讨论：如前所述，类型声明\n\n![](img/image06736.jpeg)\n\n\
