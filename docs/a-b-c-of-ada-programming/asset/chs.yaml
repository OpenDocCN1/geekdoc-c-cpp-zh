  \n![](img/image07366.jpeg)\n\n## 43 接口\n\n`Interfaces` 包有助于与其他语言进行交互。Ada 是少数将与其他语言的交互作为语言标准一部分的语言之一。语言标准定义了\
  \ `C`、`Cobol` 和 `Fortran` 的接口。当然，任何实现都可能定义更多的接口——例如 `GNAT` 定义了与 `C++` 的接口。\n\n\n\
