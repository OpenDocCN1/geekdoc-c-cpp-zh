  13 章 28 第 255 页\n\n# 28 常见错误\n\n某些语言特性经常被误解，导致性能下降和可移植性问题。以下是初学者编写的 Ada 错误用法。\n\n\
  ## 28.1 pragma Atomic & Volatile\n\n几乎使用 `atomic`1 或 `volatile`2 变量用于并发 3 几乎总是错误的。当对象是原子的，仅意味着它以原子方式从内存读取或写入。编译器在访问该对象时不会生成原子指令或内存屏障，它只是：\n\
  \n* 检查架构保证原子加载和存储，\n* 禁止某些编译器优化，例如消除冗余访问。\n\n例如，以下代码（`A` 是原子对象）可能会被误解：\n\n![](img/image07214.jpeg)\n\
  \n编译器不会（且标准不允许 4）生成原子递增指令直接从内存更新变量 `A`。这是编译器生成的代码：\n\n```\n804969f: | a1 04 95 05\
  \ 08 | mov | 0x805904,%eax\n80496a4: | 40 | inc | %eax\n80496a5: | a3 04 95 05 08\
  \ | mov | %eax,0x805904\n```\n\n如所示，没有生成原子递增指令或测试并设置操作码。与其他编程语言一样，如果程序需要这些特定的指令，必须显式使用机器代码插入\
  \ 5。\n\n![](img/image07215.jpeg)\n\n1 [`en.wikibooks.org/wiki/Ada_Programming/Pragmas/Atomic`](http://en.wikibooks.org/wiki/Ada_Programming/Pragmas/Atomic)\n\
  2 [`en.wikibooks.org/wiki/Ada_Programming/Pragmas/Volatile`](http://en.wikibooks.org/wiki/Ada_Programming/Pragmas/Volatile)\n\
  3 章 21 第 173 页\n4 Volatile: 在多线程编程中几乎无用 2008-05-30\n5. Intel Software Network. Retrieved\n\
  6 Laurent Guerby Ada 95 Rationale . Intermetrics , , 1995\n77\n\n![](img/image07216.jpeg)\n\
  \n![](img/image07217.jpeg)\n\n上述代码段等同于以下代码（两个代码序列产生完全相同的对象代码），其中 `T` 是一个（非原子）临时变量：\n\
  \n![](img/image07219.jpeg)\n\n\n\n\n因此，从多个任务同时修改原子变量是不正确的。例如，两个任务并行增加计数器。即使在单处理器中，也也应该使用其他的\
  \ Ada 任务特性，如保护对象（protected object）。在多处理器中，取决于内存一致性模型，使用各种原子或易变（volatile）变量进行任务通信可能会产生意想不到的后果。因此，在使用原子对象进行任务数据共享或同步时，应格外小心，特别是在多处理器环境中。\n\
