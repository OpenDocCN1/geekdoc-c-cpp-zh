  \n# 38 属性\n\n## 38.1 语言摘要属性\n\n语言摘要属性\n\n属性（Attributes）的概念在 Ada 中是相当独特的。属性允许你获取——有时也可以设置——关于对象或其他语言实体（如类型）的信息。一个很好的例子是\
  \ `Size` 属性。它描述了对象或类型以位为单位的大小。\n\n![](img/image07323.jpeg)<map name=\"awmap7\"><area\
  \ shape=\"rect\" href=\"_bookmark0\" coords=\"444, 11, 450, 24\"></map>\n\n然而，与\
  \ C/C++ 中的 `sizeof` 运算符不同，`Size` 属性也可以被设置：\n\n![](img/image07324.jpeg)\n\n当然，并不是所有属性都可以设置。属性以单引号\
  \ `'` 开头，后面紧跟其名称。编译器根据上下文判断单引号是属性的开头还是字符字量字的开头。\n\n![](img/image07325.jpeg)\n\n\
