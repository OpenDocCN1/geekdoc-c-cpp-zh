  \ `Ada` 中。\n\n![](img/image07276.jpeg)\n\n![](img/image0277.jpeg)\n作为奖励，此版本支持错误处理，因此在执行非法计算时不会崩溃。\n\
  \n### 31.3.3 复数运算\n\n对于复数运算 8，Ada 提供 `Ada` 包。该包是“特殊附件”的一部分，意味着它是可选的。开源 Ada 编译器 GNAT\
  \ 实现了所有“特殊附件”，因此可以使用复数运算。\n\n由于 Ada 支持自定义运算符，只要 `Ada` 包已实例化（`package ... is new\
  \ ...`）且类型可见（`use type ...`），所有的 `+`、`-`、`*` 运算符都具有它们的通常含义。\n\nAda 还提供了 `Ada` 和\
  \ `Ada` 包，它们提供的功能与其普通版本相似。但存在一些差异：\n\n- Ada 仅支持在复数运算中有意义的指数函数和三角函数。\n- Ada 是 `Ada`\
  \ 的子包，因此需要它自己的 `with`。注意：`Ada` 的 `Get()` 函数非常有容错性——如果你忘记了逗号或括号 `()`，它仍然能正确解析输入。\n\
  \n因此，只需极少量修改，你就可以将“普通”计算器转换为复数运算计算器：\n\n![](img/image07278.jpeg)![](img/image07279.jpeg)![](img/image07280.jpeg)\n\
  \n8 [`en.wikibooks.org/wiki/Algebra%2FComplex%20Numbers`](http://en.wikibooks.org/wiki/Algebra%2FComplex%20Numbers)\n\
  \n```ada\nuse Complex_Functions;\n\nValues: Value_Array :=\n  (others => Complex_Types.Complex(Re\
  \ => 0.0, Im => 0.0));\n\n...\n\nprocedure Put_Line (Value : in Complex_Types.Complex)\
  \ is\nbegin\n  if (abs Value_Type'Exponent(Value.Re) >=\n    abs Value_Type'Exponent(10.0\
  \ ** C_IO.Default_Aft))\n  or else (abs Value_Type'Exponent(Value.Im) >=\n    abs\
  \ Value_Type'Exponent(10.0 ** C_IO.Default_Aft))\n  then\n    C_IO.Put(\n      Item\
  \ => Value,\n      Fore => C_IO.Default_Aft,\n      Aft => C_IO.Default_Aft,\n \
  \     Exp => 4);\n  end if;\n```\n\n\n\n\n```ada\nFore => C_IO.Default_Aft, Aft\
  \ => C_IO.Default_Aft, Exp => 0);\n\nend if; T_IO.New_Line;\n\nreturn; end Put_Line;\n\
  \nbegin\n\n...\n\n=> 0.0);\n\n...\n\nelsif Operation = \"e\" then\n  -- insert e\
  \ Push_Value; Values (1) :=\n  Complex_Types.Complex'(Re => Ada.Numerics.e, Im\n\
