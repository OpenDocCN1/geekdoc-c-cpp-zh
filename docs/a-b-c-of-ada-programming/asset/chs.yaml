  \ 可以简单地声明如下：\n\n![](img/image06804.jpeg)\n\n## 11.2 使用数组\n\n![](img/image06805.jpeg)\n\
  \n### 11.2.1 赋值\n\n在访问元素时，索引在括号中指定。也可以通过这种方式访问切片（slices）：\n\n![](img/image06806.jpeg)\n\
  \n注意，在这个示例中，索引范围是平移的：赋值后，`Vector_A (1) = Vector_B (3)`，其他索引也是如此。\n\n同样注意，范围是重叠的，尽管如此\
  \ `Vector_A (3) /= Vector_B (3)`；交付此类结果的编译器将存在严重缺陷。\n\n### 11.2.2 拼接\n\n可以使用运算符\
  \ `\"&\"` 来拼接数组：\n\n![](img/image06807.jpeg)\n\n在两种情况下，如果结果数组无法放入目标数组中，则会抛出 `Constraint_Error`。\n\
  \n如果你尝试通过数组范围外的索引访问已存在的元素，将抛出 `Constraint_Error`（除非抑制了检查）。\n\n### 11.2.3 数组属性\n\n\
  有四个对数组非常重要的属性：`'First`、`'Last`、`'Length` 和 `'Range`。让我们通过示例来看它们。假设我们有以下三个字符串：\n\n\
  ![](img/image06808.jpeg)\n\n| 数组 | 'First | 'Last | 'Length | 'Range |\n| :--- |\
  \ :--- | :--- | :--- | :--- |\n| Hello_World | 1 | 12 | 12 | 1 .. 12 |\n| World\
  \ | 7 | 11 | 5 | 7 .. 11 |\n| Empty_String | 1 | 0 | 0 | 1 .. 0 |\n\n选择这个示例是为了展示几个常见的初学者错误：\n\
  \n1. 假设字符串从索引值 1 开始是错误的。\n2. 假设（从第一个假设推导出的）`X'Length = X'Last` 是错误的。\n3. 最后是假设 `X'Last\
  \ >= X'First`；这对于空字符串来说是不正确的。\n\n`'Range` 属性有点特殊，因为它返回的不是离散值，而是数组的抽象描述。人们可能会奇怪它有什么用。最常见的用法是在\
  \ `arrays[16](https://en.wikibooks.org/wiki/Ada_Programming/%E2%80A9arrays#part0090.xhtml__bookmark312)`\
  \ 的 `for` 循环中，但 `'Range` 也可以用于为索引子类型命名：\n\n![](img/image06809.jpeg)\n\n在编写索引检查时，`Range`\
  \ 属性非常方便：\n\n![](img/image06810.jpeg)\n\n### 11.2.4 空数组或空数组\n\n正如你在上一节中看到的，Ada 允许空数组。而且——当然——你可以拥有各种空数组，不仅仅是字符串：\n\
