  \n![](img/image06768.jpeg)\n\n# 9 浮点类型\n\n## 9.1 描述\n\n要定义一个浮点类型，只需要只需要需要多少个 `digits`，即定义相对精度：\n\
  \n![](img/image06769.jpeg)\n\n如果你愿意，也可以声明最小范围：\n\n![](img/image06770.jpeg)\n\n这种功能是\
  \ Ada 相比其他编程语言的一大优势。在其他语言中，你只需要在 `\"float\"` 和 `\"long float\"` 之间选择，而大多数人的做法是：\n\
  \n* 如果他们不在乎精度，就选择 `float`\n* 否则，选择 `long float`，因为这是你能获得的最好的\n\n在任何情况下，你都不知道得到的是什么样的精度。在\
  \ Ada 中，你指定所需的精度，编译器将选择一个至少达到请求精度的浮点类型。这样，你的需求就得到了保障。此外，如果计算机有多种浮点类型可用，编译器可以使用所有它们。\n\
  \n## 9.2 参见\n\n### 9.2.1 Wikibook\n\n![](img/image06771.jpeg)\n\n* `Ada Programming`\n\
  * `Ada Programming/Types`\n* `Ada Programming/Types/range`\n* `Ada Programming/Types/delta`\n\
  * `Ada Programming/Types/mod`\n* `Ada Programming/Keywords/digits`\n\n### 9.2.2\
  \ Ada Reference Manual\n\n* 3.5.7`Floating Point Types`{standards/05rm/html/RM-3-5-1.html}\n\
  \n![](img/image06772.jpeg)\n\n# 10 定点类型\n\n### 10.1 描述\n\n定点算术：定点类型定义了一组具有给定绝对精度的等间距值集合。相比之下，浮点值都是根据相对精度分布的。\n\
  \n\n\n\n对于小数定点类型（Decimal Fixed Point），`small` 被定义为增量（delta），而它必须是 10 的整数幂。（因此，你无法通过属性子指定\
  \ `small`。）\n\n例如，如果你定义了一个增量为 `0.1` 的小数定点类型，你将能够准确存储值 `0.1`、`1.0`、`2.2`、`5.7` 等。你将无法准确存储值\
  \ `0.01`。相反，该值将被向下取整为 `0.0`。\n\n如果编译器接受你的定点类型定义，它保证该类型表示的值将至少具有指定的精度（或更高）。如果编译器无法支持该类型定义（例如由于硬件限制），将导致编译时错误。\n\
  \n## 10.2 普通定点\n\n对于普通定点（Ordinary Fixed Point），你只需要定义 `delta` 和一个范围：\n\n![](img/image06773.jpeg)\n\
  \n`delta` 可以是任意实值——例如，你可以通过以下方式定义一个分辨率为角秒的圆：\n\n![](img/image06774.jpeg)\n\n1[`en.wikipedia.org/wiki/Fixed-point%20arithmetic`](http://en.wikipedia.org/wiki/Fixed-point%20arithmetic)\n\
  \n![](img/image06775.jpeg)\n\n[关于定点类型有一个相当奇怪的规则：由于它们的内部表示方式，范围可能只到 'Last - Delta'。这有点像圆——0°\
  \ 和 360° 标记也是同一个点。]\n\n需要注意的是，在上面的示例中，使用的最小值不是 `12 = 1`。\n\n![](img/image06776.jpeg)\n\
  \n603600\n\n编译器将选择一个较小的值，默认情况下是不大于 `delta` 的 2 的整数幂。\n\n![](img/image06777.jpeg)\n\
  在我们的示例中，这可能是 `2−12 = 1`。在大多数情况下，这应该带来更好的性能，但是以牺牲精度为代价的。\n\n这不是你所想要的，且精度确实更重要，你可以通过属性子\
  \ `'Small` 选择你自己的 `small` 值。\n\n![](img/image06778.jpeg)\n\n作为内部表示，你将获得一个 32 位符号整数类型。\n\
  \n## 10.3 小数定点\n\n你通过定义 `delta` 和需要的位数来定义小数定点：\n\n![](img/image06779.jpeg)\n\n`Delta`\
  \ 必须是 10 的正或负整数幂——否则声明是非法的。\n\n![](img/image06780.jpeg)\n\n如果你愿意，你也可以定义所需的范围：\n\n\
  ![](img/image06781.jpeg)\n\n## 10.4 普通定点与小数定点类型的区别\n\n声明“小数”定点的另一种方法：你声明一个普通定点，并使用\
  \ 10 的整数幂作为 `'Small`。以下两个声明\n\n![](img/image06782.jpeg)\n\n在内部表示方面是等价的：\n\n![](img/image06783.jpeg)\n\
  \n![](img/image06784.jpeg)\n\n你可能会好奇这两个声明之间的区别是什么。答案是：在精度、加法、减法、与整数乘法方面没有区别。\n\n\
  以下是普通定点类型和小数定点类型之间不完全的区别列表：\n\n* 小数定点类型旨在反映具有给定位数的典型 COBOL 声明。\n* 小数定点在乘法和除法中需要截断（`RM\
  \ 4.5.5 (21) [`www.adaic.org/resources/add_content/standards/`](http://www.adaic.org/resources/add_content/standards/95lrm/ARM_HTML/RM-4-5.5)]`），而普通定点不需要。类型转换的操作完全指定，而普通定点则不然。\n\
  * 以下属性仅定义于小数定点：`T'Digits` (RM 3.5.10 (10)) 对应可表示的小位数；`T'Scale` (RM 3.5.10 (11))\
  \ 取自 COBOL，表示小数点相对于最右侧有效数字的位置；`T'Round` (RM 3.5.10 (12)) 可用于指定转换时的舍入。\n* `Package\
  \ Decimal` (RM F.2）（当然仅适用于小数定点）定义了 `Divide` 通用过程。如果支持附件 F（GNAT 支持），则必须至少支持 18 位数字（定点类型没有此类规则）。\n\
  * `Decimal_IO` (RM A.10.1 (73)) 的语义与 `Fixed_IO` (RM A.10.1 (68)) 不同。\n* 小数定点的静态表达式必须是\
  \ `Small` 的倍数。\n\n结论：对于普通的数值用途，应该定义一个普通定点（可能定义了 `'Small`）。只有当你对类 COBOL 的用法感兴趣，即具有定义良好的确定性小数语义（特别是对于财务计算，但它可能适用于货币以外的情况）时，才采用小数定点。\n\
