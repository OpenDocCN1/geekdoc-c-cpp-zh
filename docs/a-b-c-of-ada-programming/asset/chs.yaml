  \n### 40.3.3 资源\n* 由 Ada 资源协会维护的工具和库集合[15]。es:Programación en Ada/Unidades predefinidas[16]\n\
  \n\n\n\n\n`Standard` 包是隐式的。这意味着两点：\n\n1. 你不需要 `with` 或 `use` 该包，实际上你也无法这样做（见下文）。它是始终可用的（除非被同形词隐藏，请参阅\
  \ RM 8.3 (8)`](http://www.adaic.org/resources/add_content/standards/05rm/html/RM-8-3.html))）。\n\
  \n2. `Standard` 可能包含不完全符合 Ada 的构造（例如 `Character` 和 `Wide_Character` 的定义）。\n\n提及\
  \ `Standard` 的 `with` 子句指的是隐藏了预定义包的用户自定义包 `Standard`。请不要这样做。然而，任何被同形词隐藏的库单元都可以通过使用\
  \ `Standard.` 限定其名称来重新变为可见，例如 `Standard.My_Unit`。\n\n# 41.1 实现\n\n实现\n\n由于 `Standard`\
  \ 包对于可移植性非常重要，以下是针对各种编译器的示例：\n\n• 来自 `ISO 8652` 的 `Standard` 包。\n• 来自 `GNAT` 的 `Standard`\
  \ 包。\n• 来自 `Rational Apex` 的 `Standard` 包。\n• 来自 `ObjectAda` 的 `Standard` 包。\n•\
  \ `AppletMagic` 的 `Standard` 定义。\n\n## 41.2 可移植性\n\n可移植性\n\n`Standard` 中唯一的强制类型是\
  \ `Boolean`、`Integer` 及其子类型、`Float`、`Character`、`Wide_Character`、`Wide_Wide_Character`、`String`、`Wide_String`、`Wide_-Wide_String`\
  \ 以及 `Duration`。`RM A.1 (51)` 中的一项实现允许存在更多的整数和浮点类型，以及一项实现建议 `RM A.1 (52)`。\n\n![](img/image07353.jpeg)\n\
  \n注意，这些类型的范围和大小在每个平台上可能是不同的（当然 `Boolean` 和 `Wide_Character` 除外）。有一项实现要求 `Integer`\
  \ 的大小至少为 16 位，`Long_Integer`（如果存在）的大小至少为 32 位 `RM 3.5.4 (21..22)`。因此，如果你希望类型具有完全的可移植性，请不要使用\
  \ `Standard` 中的类型（除非必须使用，见下文），而是定义你自己的类型。编译器将拒绝任何其无法满足范围的类型声明。这意味着例如，如果你需要一个 64\
  \ 位的类型，并发现在你当前的实现中 `Standard.Long_Integer` 就是这种类型，那么当你将程序移植到另一个实现时，该类型可能会更短，但编译器不会通知你，你的程序很可能会崩溃。然而，当你定义自己的类型时，当移植到一个无法满足该范围的实现时，编译器将拒绝你的程序。当你使用宽字符串或指数时，`Integer`\
  \ 类型是强制性的。某些项目甚至定义了自己的字符串，但这意味着“因倒洗水连带弃了孩子”。在字符串和幂运算中使用 `Integer` 通常不会导致可移植性问题。\n\
