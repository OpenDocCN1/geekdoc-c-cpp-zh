  \n## 2.8 Atego 的 ObjectAda（原 Aonix）\n\nAtego 提供针对各种平台的原生和交叉编译器。它们配备了一个 IDE、一个调试器、一个\
  \ `Eclipse` 插件，以及一个 `POSIX` 绑定 [`www.aonix.com/pdf/`](http://www.aonix.com/pdf/oa-linux.pdf)\
  \ [oa-linux.pdf](http://www.aonix.com/pdf/oa-linux.pdf)。\n\n在 Microsoft Windows\
  \ 和 `i386` 上的 `GNU/Linux` 上，Aonix 提供两种定价模式供客户选择：可以是带有可选支持的永久许可费用，或者仅支付年度支持费：对于 Linux，单用户费用为\
  \ 3000 美元，5 用户服务包为 12000 美元。详见完整新闻稿。\n\n此外，他们还提供“ObjectAda 特别版”：一个 `ObjectAda` 的免费评估版本，它限制了可编译程序的大小，但在其他方面功能完备，包含\
  \ IDE 和调试器。需要免费注册。\n\nAtego 最近的一项贡献是用于 `Eclipse` 的 `ADT`。Ada 开发工具 (ADT) 为 `Eclipse`\
  \ 开源开发平台增加了 Ada 语言支持。`ADT` 可以配合 Aonix 编译器以及 `GNAT` 使用。`Eclipse` 中的 `ADT` 是一个开源供应商支持的项目。该项目代号为\
  \ `Hibachi`，并在 2007 年英国 Ada 会和 Ada-Europe 2007 期间进行过展示，现在已正式创建。\n\n商业用，专利所有。\n\n\
