  \n第 5 章 4 位于第 37 页\n\n![](img/image07263.jpeg)\n\n## 31.2 指数计算\n\n指数计算\n\n所有指数函数都定义在通用包\
  \ `Ada` 内部。\n\n### 31.2.1 幂\n\n形式为 $x^y$ 的计算通过运算符 `**` 执行。注意：该运算符有两个版本。预定义的运算符 `**`\
  \ 允许使用 `Standard.Integer` 作为指数。如果你需要使用浮点类型作为指数，则需要使用 `Ada` 中定义的 `**`。\n\n### 31.2.2\
  \ 根\n\n![](img/image07264.jpeg)平方根 $\\sqrt{x}$ 使用函数 `Sqrt()` 计算。目前没有定义函数来\n\n![](img/image07265.jpeg)计算任意根\
  \ $\\sqrt[n]{x}$。然而，你可以使用数学等式利用对数计算任意根：$\\sqrt[b]{a} = e^{loge(a)/b}$，这在 `Ada` 中变为\
  \ `root := Exp (Log(a) / b)`。或者，使用 $\\sqrt[b]{a} = a^{1/b}$，在 Ada 中为 `root := a**(1.0/b)`。\n\
  \n### 31.2.3 对数\n\nAda 为任意对数 `logn(x)` 和自然对数 `loge(x)` 都定义了函数，两者的名称相同，通过参数的数量来区分。\n\
  \n### 31.2.4 演示\n\n以下扩展示例展示了如何在 Ada 中使用指数函数。新示例使用了 `Unbounded_String6` 代替 `Strings`\
  \ 以使比较更加简单。请注意，从现在起不再拷贝源代码。请通过链接查看完整程序。\n\n![](img/image07269.jpeg)\n```ada\nfunction\
  \ Get_Line return Unbounded_String is\n  BufferSize: constant := 2000;\n  Retval:\
  \ Unbounded_String := Null_Unbounded_String;\n  Item: String(1..BufferSize);\n \
  \ Last: Natural;\nbegin\n  Get_Whole_Line: loop\n    T_IO.Get_Line(Item => Item,\
  \ Last => Last);\n    Str.Append(Retval, Item => Item(1..Last));\n    exit Get_Whole_Line\
  \ when Last < Item;\n  end Get_Whole_Line;\n  return Retval;\nend Get_Line;\n...\n\
  begin\n  Main_Loop: loop\n    T_IO.Put(\">\");\n    Operation := Get_Line;\n   \
  \ elsif Operation = \"e\" then\n      -- 插入 e\n      Push_Value;\n      Values(1)\
  \ := Ada.Numerics.e;\n    elsif Operation = \"**\" or Operation = \"^\" then\n \
  \     -- x^y 的幂\n      Values(1) := Values(1) ** Values(2);\n      Pop_Value;\n\
  \    elsif Operation = \"sqr\" then\n      -- 平方\n      Values(1) := Sqrt(Values(1));\n\
  \    elsif Operation = \"root\" then\n      -- 任意根\n      Values(1) := Exp (Log(Values(2))\
  \ / Values(1);\n      Pop_Value;\n    elsif Operation = \"ln\" then\n      -- 自然对数\n\
  \      Values(1) := Log(Values(1));\n    elsif Operation = \"log\" then\n      --\
  \ 常用对数\n      Values(1) := Log(Base => Values(1), X => Values(2));\n      Pop_Value;\n\
  \    elsif Operation = \"exit\" then\n      exit Main_Loop;\n    else\n      Push_Value;\n\
  \      F_IO.Get(From => Str.To_String(Operation), Item => Values(1), Last => Dummy);\n\
  \    end if;\n...\nend Main_Loop;\n```\n![](img/image7271.jpeg)\n\n## 31.3 高级数学\n\
