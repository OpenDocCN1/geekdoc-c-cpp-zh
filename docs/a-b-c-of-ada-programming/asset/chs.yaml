  \nes:Programación en Ada/Tipos/Enteros\n\n![](img/image06746.jpeg)\n\n# 7 无符号整数类型\n\
  \n## 7.1 描述\n\nAda 中的无符号整数值范围从 0 到某个正数（不一定是 2 的幂减 1）。它们使用 `mod` 关键字定义，因为它们实现了回绕运算（wrap-around\
  \ arithmetic）。\n\n![](img/image06747.jpeg)\n\n其中 `'First` 为 0，`'Last` 为 `Modulus-1`。回绕运算意味着\
  \ `'Last + 1 = 0 = 'First`，且 `'First - 1 = 'Last`。除了普通的算术运算符外，该类型还定义了位 `and`、`or`\
  \ 和 `xor`。预定义包 `Interfaces` (RM B.2) 提供了基于无符号整数，，整数定义了 `shift` 和 `rotate` 操作。值取决于编译器和目标架构。\n\
  \n你可以使用 `range` 对模数类型进行子范围划分：\n\n![](img/image06749.jpeg)\n\n但注意：`Half_Byte` 的 `Modulus`\
  \ 仍然是 256！至少可以说，对这种类型进行算术运算是非常有趣的\n\n## 7.2 另参\n\n另参\n\n### 7.2.1 Wikibook\n\n-\
