  \n# 14 受限类型 (Limited types)\n\n## 14.1 受限类型\n\n当一个类型被声明为受限（limited）时，意味着该类型的对象不能赋值相同类型的值。\n\
  \n受限类型 `LT` 的对象 `b` 不能复制到相同类型 `LT` 的对象 `a` 中。\n\n\n\n\n声明限制类型（limited type）的预期效果包括防止浅拷贝。此外，对象的（唯一）标识性得以保留：一旦声明，类型为\
  \ `LT` 的变量名将继续引用同一个对象。\n\n接下来的示例将使用一个相当简单的类型 `Boat`。\n\n![](img/image06883.jpeg)\n\
  \n当我们声明一个变量的类型为 `Boat` 时，它的名称从此起将代表一艘船。船与船之间不会互相拷贝。\n\n船的完整视图可以实现为如下所示的记录（record）：\n\
  \n![](img/image06884.jpeg)\n\n`Choose` 函数根据参数 `Load` 和 `Speed` 返回一个 `Boat` 对象。如果我们现在声明一个类型为\
  \ `Boat` 的变量，那么先 `Choosing` 一个初始的 `Boat` 会比较好（否则我们可能会掉入未初始的水域！）。但当我们这样做时，这种初始化过程看起来非常像赋值，而赋值在限制类型中是不可用的：\n\
  \n![](img/image06885.jpeg)\n\n幸幸运的是，当前的 Ada 区分了初始化和拷贝。限制类型的对象可以通过分隔符 `:=` 右侧的初始化表达式来初始化。\n\
  \n（为了防止混淆：Ada 参考手册区分了赋值（assignment）和赋值语句（assignment statement），其中赋值是赋值语句的一部分。初始化当然是一种赋值，对于限制类型来说，这种赋值是原地完成的。赋值语句涉及拷贝，而拷贝对于限制类型来说是被禁止的。）\n\
  \n与此特性相关的是限制类型的聚合（aggregates）以及用于限制类型的“构造函数”。在内部，`Choose` 函数的实现将返回一个限制记录。然而，由于返回类型\
  \ `Boat` 是限制的，任何地方都不能有拷贝。这可行得吗？第一次尝试可能是为 `Choose` 声明一个局部结果变量 `result`，操作 `result`\
  \ 并返回它。但 `result` 是 `Choose` 的局部变量。当 `Choose` 返回时，`result` 将不再处于作用范围内。因此，看起来 `result`\
  \ 必须被拷贝，但这在限制类型中是不允许的。语言提供了两种解决方案：扩展返回语句（参见 6.5 Return Statements）和限制类型的聚合。接下来的\
  \ `Choose` 函数体体在找到其组件的初始值后，返回一个限制类型 `Boat` 的聚合。\n\n![](img/image06886.jpeg)\n\n\
  返回的对象同时是那个接收返回值的对象。因此，该函数原地初始化了 `Henrietta`。\n\n与预定义类型 `Ada.Controlled` 并行，Ada 在同一个包中提供了\
  \ `Limited_Controlled` 类型。它是前者的限制版本。\n\n![](img/image06887.jpeg)\n\n## 14.2 初始化限制类型\n\
  \n初始化限制类型\n\n这里介绍了初始化此类类型的方法。\n\n![](img/image06888.jpeg)\n![](img/image06889.jpeg)\n\
  ![](img/image06890.jpeg)\n\n注意 `D3` 是一个常量，而其他所有都是变量。\n\n同样注意，为 `Preinitialised`\
  \ 组件定义的初始值是在对象创建时进行求值的，也就是说如果使用了表达式而不是字面量，则该值可能取决于运行时。\n\n![](img/image06891.jpeg)\n\
  \n在这一两个对象的声明中，初始化表达式将被计算两次，并可能交付不同的值，因为它等同于以下序列：\n\n![](img/image06892.jpeg)\n\n\
  因此 `X` 在 `Y` 之前被初始化。\n\n## 14.3 参见\n\n### 14.3.1 Ada 95 参考手册\n- 7.5 Limited Types\n\
