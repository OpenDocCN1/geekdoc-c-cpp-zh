  \n# 4 控制语句\n\n## 4.1 条件语句\n\n条件语句\n\n条件语句是仅当特定表达式（条件）为真时才会执行的代码块 1。\n\n### 4.1.1\
  \ if-else\n\nif-else 语句是条件语句中最简单的。它们也被称为分支，因为当程序在执行过程中遇到 if 语句时，控制将“分支”到两个或多个“方向”之一。if-else\
  \ 语句通常具有如下形式：\n\n![](img/image06652.jpeg)\n\n如果满足原始条件，则执行第一个语句中的所有代码。可选的 `else`\
  \ 部分指定了在条件为假时执行的备选语句。确切语法会随编程语言而异，但大多数编程语言（特别是过程化 4 和结构化 3）都具有某种形式的内置 if-else。if-else\
  \ 语句通常可以扩展为以下形式：\n\n![](img/image06653.jpeg)\n\n![](img/image06654.jpeg)\n1 [`en.wikipedia.org/wiki/Truth_function`](http://en.wikipedia.org/wiki/Truth_function)\n\
  2 [`en.wikibooks.org/wiki/Computer_Programming/Procedural_programming`](http://en.wikibooks.org/wiki/Computer_Programming/Procedural_programming)\n\
  3 [`en.wikibooks.org/wiki/Computer_Programming/Structured_programming`](http://en.wikibooks.org/wiki/Computer_Programming/Structured_programming)\n\
  \n整个块中只有一个语句会被执行。该语句将是第一个条件求值为真的语句。通过示例的帮助，if-else-if 结构的概念更容易理解：\n\n![](img/image06655.jpeg)\n\
  \n### 4.1.2 优化提示\n\n当此程序执行时，计算机将顺序检查所有条件，直到其中一个条件符合其对真的理解。一旦发生这种情况，程序将立即执行条件后的语句并继续运行，不再检查其他条件是否为真。正因如此，当你尝试优化\
  \ 4 程序时，将你的 if-else 条件按概率 5 降序排列是一个好主意。这将确保在最常见的情况下，计算机执行最少的工作。在第一次编写程序时，不要过早考虑这一点\
  \ 6。\n\n虽尽管如此，要意识到优化编译器 7 可能会重排你的 if 语句，在没有副作用 8 的情况下甚至应用跳转表 9 或二分查找 10。\n\n在 Ada\
  \ 中，多个条件的语句默认不使用短路计算。为了模拟 C/C++ 的短路计算，请在条件之间使用 `or` 或 `else`\n\n![](img/image06656.jpeg)\n\
