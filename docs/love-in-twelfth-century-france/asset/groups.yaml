    ## 修道院


    在世世界上，人想要的比他所拥有的多。不虔诚的人在物事之间穿梭，总是感到失望，因为没有什么能完全满足他。这样一个人如果能获得所有的造物，甚至可能得到神，使得除了创造者外别无他物，但事实上，他将短暂的生命浪费在一个沉重而徒劳的循环中。他所追求的物质对灵魂的滋养，远不如风对身体的滋养。


    只有上帝能满足精神。他是人类爱的开始，也是终结。爱神的人得到欲望的满足作为回报。他不应为了报酬而爱神（否则他爱的报酬多过爱神），但这种爱仍然需要一个回报，尽管它本身是值得得的”（第984页）。而爱神的人已经开始拥有他了，因为“这一切的奇迹在于，除非人们先找到了你，否则没有人能寻找你（第987页）”。对神的爱本身就是报报，部分在地上体验，在天上获得圆满。


    伯纳德通过探寻人类的心发现了人爱神的理由。通过同样的程序，他叙述了爱发展的阶段。爱固然是一种自然的倾向，但它必须在正确的渠道中运行，在自身以及上帝直接和间接作用的引导和推动下移动。人从简单的、自我中心的肉欲之爱开始。他希望自己的身体得到良好的食物和舒适。这种自爱是完全自然且良好的，只要它不溢出生存所需的渠道进入感官的领域。当人意识到人与人之间物质需求的相互依赖时，这种爱就成熟为一种更全面的肉欲之爱。他的肉欲之爱变得社会化，拥抱了一个相互依赖的社区。


    但人的局限性迫使他超越人类社会去寻求一个更大的力量，因此他进入了爱的第二阶段。最有能力的个体或最受天眷顾的社区并不总是能做到一切，因此他转向了爱的第二阶段。这种力量并不让任何人逃避灾难。上帝通过访问人类，迫使他进入第二的爱。通过这种方式，自我中心的爱扩张了，包含了一个相互依赖的社区。


