    # 引言


    维克多——即将成为其中一员的巴黎大学，曾是全欧洲的学术殿堂。这里的学者们并非完全是“法国人”：彼得·伦巴德来自意大利北部，圣维克多的休格来自萨克森，圣圣维克多的理查德来自苏格兰，萨尔兹的约翰来自英国。但出于某种原因，法国似乎是学者们的青睐之地。


    与十二世纪的欧洲其他地区一样，法国正以胚胎形式发展着现代社会错综复杂的关联性。随着人口密度增加，社会组织必然变得更加复杂。为了保持这些组织的顺畅运行，需要更多的思考；在城镇和王侯宫廷（包括教会领主的宫廷），第一批官僚机构开始发展。这些新政府压制了早期时代特征中的某些暴力（那个时代暴力是维护自身权利的唯一手段），并提供了法庭作为替代方案。地区之间、城乡之间日益增长的贸易需要更多的资金进入流通，需要建立如市场、集市和银行等机构以促进交换。这也提供了足够的财富来支持监督和保护这种交换的城市和王侯官僚机构。在每一个层面上，都需要受过教育的人才，那些能够记录和账目、制定规则制度、收集证词并做出判决的人。年轻人涌向学校，希望在这些萌芽中的官僚机构中升迁到权力和财富之上，诸如圣丹尼修道院院长苏热（Suger，他是路易七世时期“法国”的摄政者）或鲁昂大主教瓦尔特·德·库唐（Walter
    of Coutances）这样的职位，后者是狮心王理查德一世治下的英国首席法官。城镇居民的儿子们在生意中寻求自己的财运，他们向往那些地位显赫但几乎同样舒适的职位。他们通常也从信函和数字开始职业生涯。像今天一样，这些人中有些人在商界取得了了成功，有些人转入学术和教学，另一些人则仅仅过着怀才不遇、希望破灭的生活。他们的共同努力创造了一个庞大的受过教育的群体，他们与贵族宫廷中识字的男女一起，为许多以爱情为主题的作家提供了创作温床和观众。


    现代学术界理所当然强调了十二世纪法国的成就。繁荣的城镇、宏伟石造教堂、满溢的学校以及强大而复杂的宫廷，稳固地建立在繁荣且扩张的经济基础之上——事实上，这是一个对爱情产生丰厚兴趣的可能背景。但那个时期的编年阻止我们严厉地称其为爱情之世纪。它也是一个贫困与苦难、无知与残忍的世纪。


    现代城市居民几乎忘记了对农业周期的依赖。快速的交通和现代食品保存方法使我们的饮食全年保持相对不变。因此，我们把大部分注意力放在了不规则的经济周期上，这些周期对我们生活水平的影响，远比治理农业的季节周期要大得多。但在十二世纪，一年的作物收成对于该地区的人民来说，意味着丰年或饥荒。1109年，桑斯（Sens）地区的粮食价格是前一年的两倍，因为风暴和冰雹毁了农田、果园和葡萄园.¹¹
    在第二次十字军东征（1147年）之前的近十年里，特罗瓦方丹修道院（Trois-Fontaines）附近的份粮食短缺迫使贵族卖掉所有财产以生存，并让成百上千的平民去僧侣那里乞面包吃¹²
    地区性饥荒是十二世纪法国的常态。


    战争也许是天气更大的威胁。没有什么比争斗的贵族破坏敌人的经济资源更常见的了，即焚烧农作物和建筑，以及任何倒霉挡路的农民和动物。农民总是受苦者。对于贵族来说，战争是一种相当有趣的运动，缓解了和平时期的单调；但正如一位编年史家写道，“平静的安全给农民的心灵带来了快乐。”¹³


    即使在天气良好且贵族们正式和平的时期，生活也远非安全。成群结队的无赖匪徒像狼群一样恐吓着农村。甚至克吕尼（Cluny）本身也遭受过围攻。1166年，当僧侣们带领一群市民游行，他们只信任随身携带的圣物和所穿的神圣法衣，匪徒袭击了他们。他们剥光并杀死了市民。路易七世抓获了其中一些人并将他们吊在绞架上处死，但没有哪个君主能希望清除这片土地上所有的匪徒.¹⁴
    1183年，一支来自各阶层的绝望之师成功包围并屠杀了一支多达一万人的匪徒部队；但在附近营地发现的500名女性在寻找新营地时可能并没有什么困难¹⁵


    接下来的页面旨在揭示十二世纪法国的一些温柔、智慧和美感；但读者应当记住，那里也有黑暗的一面。犹太人被屠杀；被俘的农民被挖掉眼睛；人类和野兽般的敌人在复杂的“宗教”仪式中被诅咒；火灾、瘟疫和饥荒从未远去。这种中世纪的悖论——美与丑以如家人般的亲密方式共存——无疑困扰着我们，但在解决我们城市的悖论之前——这些作为现代慈悲与残忍、博学与文盲、奢华与贫困的现代家园——我们无法真正抱怨。


    最后，读者还应该记住所谓的“中世纪”。作者经常使用“中世纪的”这一形容词同时指代五世纪和十五世纪，尽管两者之间的千年时间并没有改变任何东西。“中世纪”作品选集将九世纪农民的描述与十五世纪城镇居民的描述放在一起，仿佛将他们分开的只有一城墙和一片森林。当十二世纪开始时，圣奥古斯丁已去世近700年，查理大帝已去世近300年。当它结束时，但丁的《神曲》还有一个世纪才问世，乔叟的《坎terbury故事集》在那之后又过了一个世纪。因此，这并不是一本关于“中世纪”的书，那是一个覆盖在千年不同色彩之上的漫罩。它只关于十二世纪，一个欧洲其他地区向法国寻求爱情指导的时代。


    # 第二章


    # 过去遗产中的爱情


    十二世纪继承的文化遗产在很大程度上是没有文字的。不识字的法国骑士珍视着关于法兰克祖先的故事，这些祖先跟随查理大帝反对穆斯林人的战斗，这些战斗的规模随着每一次讲述而增加。从威尔士云雾缭绕的高地和爱尔兰（凯尔特人先躲避罗马人，后躲避盎尔人和撒克逊人，最后躲避诺曼人），其他关于传说的故事流入了法国：关于伟大凯尔特战士亚瑟，他在很久以前抵御了英国的撒克逊入侵者的故事；关于不幸的恋人特里斯坦和伊索尔特的故事；关于龙、魔法药水、利剑构成的桥以及各种魔法药水的故事。古老的日曼和凯尔特故事在几个世纪里不断讲述、不断重述，不断变化。


