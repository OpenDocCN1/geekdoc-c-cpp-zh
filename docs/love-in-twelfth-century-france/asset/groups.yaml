    ## 第一章：引论


    “爱情的力量是伟大的，其力量是如此奇妙的。爱情有许多层次，它们之间的差异也是巨大的。谁能体面地区分它们，甚至列举它们呢？”十二世纪的教职人员理查德（Richard
    of St. Victor）是这样说的.¹ 无论爱情是什么，它唤起西方文明男女好奇心的程度是任何其他主题可比拟的。爱情是人们所做或享受的事，是发生在他们身上的事，是他们陷入其中的事。它是人们思考的话题。文学、艺术和音乐充满了爱情的主题。精神病学家、神学家、诗人、科学家，几乎所有人人都说过爱情是美好且必要的。但古代人和现代人均未能对爱情究竟是什么达成共识。


    这种分歧并不意外。正如真理和美一样，爱情是伟大的无形资产之一。它无法像“十二世纪法国的爱情”那样被测量、称重或分析为它的化学成分。它在光谱图中不会显示出任何东西。但令人惊讶的是，以其清醒理性传统为傲的西方文明，竟然继续容忍在使用“爱情”一词时这种真正令人糟糕的松散。


    **在今天，一个人可以“爱”他的上帝、国家、母亲、父亲、妻子、工作、孩子、邻居的妻子、他的跑车、他的狗，以及他的波士忌。** 其中一些人还被期望回报以“爱”。这种分歧并不意外。正如真理和美一样，爱情是伟大的无形资产之一。它无法像“十二世纪法国的爱情”那样被测量、称重或分析为它的化学成分。它在光谱图中不会显示出任何东西。但令人惊讶的是，以其清醒理性传统为傲的西方文明，竟然继续容忍在使用“爱情”一词时这种真正令人糟糕的松散。**今天，一个人可以“爱”他的上帝、国家、母亲、父亲、妻子、工作、孩子、邻居的妻子、他的跑车、他的狗，以及他的波士忌。**
