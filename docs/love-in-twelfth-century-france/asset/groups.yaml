    ## 前言


    本书旨在面向学生和普通读者，但我希望一些学者也能从中发现它的实用价值。在我们自己的专业领域之外，我们许多人都会成为“普通读者”，寻求轻松触及复杂的知识体系。这里欢迎所有读者的到来。


    针对学术读者的几点技术说明：除非另有说明，译文均为我本人所译。圣经引用译自《修订标准版》（Revised Standard Version），尽管我在多处修改了翻译，使其更接近《武丁堡圣经》。全文中，我引用了我认为易于阅读的译文，并注明了我认为易于获取的版本。PL
    是 *Patologia Latina* 的缩写，J. P. Migne 编辑，221卷（巴黎，1844–55年）；RHGF 是 *Recueil des
    historiens de Gaules et de la France* 的缩写，24卷（巴黎，1737–1904年）。


    vii


    我想向所有以各种方式促本书成书的人表示感谢：法兰·L·魏尔宗教与人文研究所；本杰明·内尔森教授，我在霍夫斯特大学的同事，特别是林顿·S·索恩（Linton
    S. Thorn）、约翰·T·马库斯（John T. Marcus）以及已故的盖瑞·P·贾德（Gerrit P. Judd），最后还有我的妻子帕特里夏（Patricia），多年来一直是我爱情道路上的同学。


    J.C.M.


