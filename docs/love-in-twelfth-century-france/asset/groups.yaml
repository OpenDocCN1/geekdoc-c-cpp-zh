    # THE MONASTERIES


    modern Christians is the immediate relevance of the doctrine of the Trinity to
    the experience of loving. Twelfth-century monks were quite consciously engaged
    in psychological engineering, in deliberately fostering in themselves attitudes
    and emotions which were by no means spontaneous. But in doing so, they never doubted
    that the Holy Spirit was supporting their efforts. Their struggle would be in
    vain unless they acted to unite them to the Father and the Son in some mysterious
    remotely analogous to the way in which he united the Father and the Son to each
    other. Even today the oneness experienced between two lovers remains something
    of a mystery. Medieval monks, as the Latin fathers had done before them, associated
    the mysterious loving union of separate persons with the doctrine of the Trinity.
    The Holy Spirit was both the agent and the expression of that union.


    The writings of two monks, Bernard, abbot of Clairvaux, and his friend, William,
    abbot of St. Thierry, are of particular importance for the topic of love. Their
    works on love were much sought after, and by the end of the century manuscript
    copies had found their way into monastic libraries all over Europe.


    Bernard was surely the most remarkable man of his day. It was Bernard who, in
    the 1130s, organized European leaders in support of Pope Innocent II against his
    rival for the papacy, Anacletus II. It was Bernard who mobilized European knights
    in the 1140s and sent them to the Holy Land in the futile Second Crusade. He was
    probably the supreme moral author-


