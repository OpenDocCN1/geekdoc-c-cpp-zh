    ## 12世纪法国的爱情


    除了行政上的划分，这个王国还因剧烈的文化差异而分歧，尤其是南北之间。南部地区使用一种方言，这赋予了该地区名称“奥克多克”（Languedoc），并呼吸着地中海温暖的空气。北方则是“奥伊语”（langue
    d''oil）之地，面朝英吉利海峡和北海。边界、气候和文化的差异使得奥克德多克对北方人来说就像是异域。在12世纪中叶，克莱沃的圣伯纳德在评价一个逃往南方的异端教士时说，他被“驱出了法国”，奥克德多克在当时看来是如此遥远。


    法国与其邻国之间的现代边界在12世纪仅通过一些定义模糊的区域得以预示。从法国北部前往西班牙康波斯泰拉圣雅各圣地的朝圣者会发现，西班牙与法国南部的差异，几乎不比法国南北之间的差异大。在访问英国圣托马斯·贝肯特的墓时，他会发现一个由法国王子亨利二世和法国贵族统治的王国。在东方，法语区和德语区人民之间的差异已经非常明显，但即便在这里，边界也不清晰，且法国和德国贵族在建立通姻关系时往往忽视了这种边界。


    法国国王的软弱意味着没有一个中央政府来聚焦于12世纪法国的故事。1100年，菲利普一世几乎无法控制巴黎周边。一位编史家写道，他的儿子路易六世“深受法国贵族们的苦扰……他们拒绝向他履行应有的效忠义务。”^5
    到1200年时，路易六世的孙子菲利普二世强大得多，但当时还不清楚他是否比“高卢”的其他大贵族更。在法国，正如其他地方一样，贵族们首先为了生存而斗争，然后为了财富和权力。他们蚕食邻居的土地；他们与一个邻居结成盟约以掠夺另一个；他们通过复杂的豪赌将孩子嫁到此方或彼方，希望通过正确的出生死亡模式，让几个公国落入他们某位后代手中。这种动态关系的范围可以通过路易七世的家族关系来窥见。他的第一妻子是阿基坦尼的继承人埃莉诺尔，她后来嫁给了英国的亨利二世。他第一段婚姻的两个女儿嫁给了香槟侯和布洛瓦侯。路易七世娶了卡斯蒂利亚国王的女儿，再次有两个女儿。一个嫁给了蓬蒂埃爵，另一个起初嫁给了亨利二世和埃莉诺尔之子小亨利，后来嫁给了匈牙利国王。路易七世的第三妻子生下了未来的国王菲利普·奥古斯和一个嫁给君士坦丁堡拜占庭皇帝的女儿。这些婚姻的实际政治结果错乱如麻；其可能的结果则难以想象。


    尽管存在这些分歧和复杂性，法国确实发展出政治统一。到世纪末，法国的卡佩王朝国王即将成为欧洲最强大的统治者。然而，更令人印象深刻的是法国在欧洲享有的文化领先地位。


    大约1100年，法国北方的一位诗人创作了《罗兰骑士》，这是一首英雄史诗，体现了法国宫廷战士的理想，并将其传到了法国边界之外，事实上跨越了12世纪的边界。大约同一时期，在南方，阿基坦公爵威廉九世创作了已知的第一批吟游诗人诗，即被作为艺术研究的抒情爱情诗。大约世纪中叶，南北传统融合。其结果就是浪漫小说（romance），它是英雄事事诗（chansons
    de geste）、吟游诗人巧妙的歌曲以及赞助作者的日益悠闲和复杂的宫廷的杂交产物。大约1170年，诗人克雷捷·德·特罗自称，骑士精神和学问在抛弃希腊和罗马后，必须居住在法国。6
    这一豪言依然成立；在12世纪的法国，现代欧洲文学诞生了。


    尽管宗教机构和学校存在分歧，但法国确实产生了一些政治统一。到世纪末，法国卡佩王朝正处于成为欧洲最强统治者的边缘。然而，更令人深刻的是法国在欧洲享文化领先地位。


