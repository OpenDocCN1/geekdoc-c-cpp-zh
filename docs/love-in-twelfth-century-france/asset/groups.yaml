    # THE MONASTERIES


    this world man wants more than he has. The impious man goes from thing to thing,
    always disappointed because nothing ever completely satisfies. Such a man might
    even get to God if he could obtain all creation, so that nothing was left but
    the Creator, but in fact he spends his too brief life in a burdensome and fruitless
    circuit. The material things he seeks nourish the soul no more than wind nourishes
    the body.


    Only God can satisfy the spirit. He is the beginning of human love and its end.
    The man who loves God is rewarded with the satisfaction of his desires. He should
    not love God for the reward (for then he would be loving the reward more than
    God), but the love will nevertheless require a reward, but it merits nevertheless”
    (col. 984). And the man who loves God has already begun to possess him, for “here
    is the wonder of it all, that no one can seek you unless he has first found you
    (col. 987). The love of God is its own reward, experienced in part on earth and
    in its fullness in heaven.


    Bernard found man’s reasons for loving God by searching the soul of man. Using
    the same procedure, he recounted the stages through which love develops. Love
    is a natural inclination, to be sure, but it must move along proper channels,
    guided and impelled by himself and by the direct and indirect action of God. Man
    begins with simple, egocentric carnal love. He wants his body to be well fed and
    comfortable. This self-love is wholly natural and good, so long as it does not
    overflow the channels of necessity into the fields of sensuality. This love matures
    into a more compre-


    57'
  - '[PAGE 69]


    hensive carnal love as man comes to realize the in-terdependence of men for their
    material needs. His carnal love becomes social, embracing an interdepend-dent
    community.


    But man''s limitations force him to look beyond human society to a greater power,
    and thus he moves to the second stage of love. The most capable individual or
    the most providential community cannot always escape disaster. God does not allow
    man to overlook his own inadequacy. By visiting suffering upon man, God forces
    him to see dependence upon divine will. In this way, man''s love, just self-centered,
    expands to include the human community. The love of God, rooted in man''s need,
    is the second stage of love.


    Only when man has reached this stage he is ready to profit from the lesson earlier
    outlined by Bernard. Now he comes to see God''s generosity in providing him with
    physical necessities, and, indeed, with his spiritual gifts. Now he comes to see
    and appreciate the goodness of God and begins to love God for his own sake."For
    we have tasted and have seen how sweet is the Lord" (col. 989). This is the third
    stage of love, when man has gone beyond carnal love, when he has gone beyond loving
    God because of man''s dependence on him and has come to love God because of what
    God is.


    The fourth stage is a great blessing rarely achieved in this life. When the soul
    is drunk with divine love and loses all consciousness of self, when it is almost
    absorbed into God, it becomes one spirit with him.'
  - '[PAGE 70]


    There is an utter oneness of will between the soul and God. The fortunate soul
    who does have this experience in this life is soon recalled by the mundane needs
    of his brothers. But one day love will be experienced in its fullness. As water
    mixed with wine seems to become wine, as iron in fire seems to take on the form
    and the color of the flame, as transfused with light seems to be the light itself,
    so will the soul be one with God. “The substance will remain, but in another form,
    another glory, another power” (col. 991).


    Bernard expects this final glory after the resurrection, for until then the soul
    with God will not be contented reunited with the body, that “good and faithful
    companion of the soul” (col. 993). The invitation of the Song of Songs, “Eat,
    friends, and drink; and become inebriated, dear ones” (5:1), is God’s invitation
    to man. The soul eats in this life, drinks in the next, inebriated with love and
    lost in God. Even then, love is not static, but it is eternally restless, while
    being at rest: “Hence that satisfaction without satiety, hence eternal and inexhaustible
    desire which feels no want; hence finally that sober inebriation steeped in drink
    but in truth—not soaking with wine but burning with God” (col. 995).


