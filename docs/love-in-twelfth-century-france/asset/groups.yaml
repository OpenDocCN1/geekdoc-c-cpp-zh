    ## CHAPTER SIX

    ## The Varieties of Love


    THE HISTORIAN''s lot is to make generalizations and then apologize for them. They
    mask the variety of life. I have already explained that "France" is a very imprecise
    term to use when speaking of the twelfth century. A similar warning and apology
    must be made for grouping people under the headings "monasteries," "courts," and
    "towns." These were not sharply divided entities. Many monks had been raised in
    aristocratic courts and continued to frequent them. Scholars like Alain of Lille
    and princes like Count William of Nevers passed through the towns. I can only
    say that despite this intermingling, there were still differences recognized and
    expected by contemporaries. A townsman aping an aristocrat, a nobleman who seemed
    monkish, a scholar playing the courtier, a monk with a sharp eye for a bargain—all
    these were fair game for ridicule. Just as there was a difference between France
    and Germany despite the obscurity of the line between them, so also were there
    universally recognized differences among monasteries, courts, and towns.


    The "twelfth century" is also a generalization. Not only are its boundaries hard
    to define (the new year began on different dates in different parts of France),
    but it was not static. Life was changing rapidly in that century, and men knew
    that it was. Toward the end of the century, arrogant young scholars spoke of themselves
    as “moderns” who had already mastered and were now surpassing the wisdom of the
    ancients.


    As the twelfth century passed into the thirteenth, the attention enjoyed by love
    and literature passed to logic and law. The passion for these studies, appearing
    in 1100, grew stronger, fed by the influx of Aristotelian works coming into Europe
    from Arab sources in Spain and Sicily and by the needs of organized society. The
    study of logic and law flourished in the universities, even among theologians
    and philosophers, for scholastic philosophy can be fairly considered an amalgam
    of logic and law. Moreover, the centralization of the Church under popes and principalities
    like Philip IV of France was the work of logic and law.


