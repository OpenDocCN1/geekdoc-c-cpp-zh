    ## 十二世纪法国的爱情


    相比于吟游诗人，他们意识到这种爱情的诉求往往与社会甚至与自然相冲突。社会和命运似乎经常合谋让恋人彼此离散。婚姻的规则往往在恋人之间竖起障碍，或者命运描绘了一个永恒的三角关系，其中至少有一个人必须受苦。


    爱情与社会习俗之间的冲突往往导致了悲剧。特里斯坦与伊索尔特爱情的凯尔特故事在12世纪广为人知。特里斯坦是康康沃尔国王叔舅马克国王派遣的一位骑士，负责护送伊索尔特从爱尔兰去成为国王的新娘。由于一个失误，特里斯坦和伊索尔特喝了本该给国王和新娘准备的爱情汤药，从那一刻起，尽管伊索尔特嫁给了国王，尽管国王的疑虑此起彼伏，他们注定要互为恋人。最终，他们的婚外之恋导致了他们的死亡。从12世纪起，特里斯坦和伊索尔特在欧洲文学中被视为爱情的象征，这种爱情将他们推向了毁灭，尽管它具有破坏性，却依然带着一种挥之不去的美感。


    玛丽·德·法国也在忧郁而丰富的传说中发现了悲剧性的爱情故事。作为法国文学的第一位女性作家，她受到了英国亨利二世的赞助。例如，她讲述了一个骑士爱上了邻居的妻子，而妻子也爱着他。他们的家被一墙隔开，无法在一起，但他们可以隔墙互相投递字条，也可以站在窗前彼此可见。当春天来临时，女士每晚都会起床，凝望对岸的爱人；当她的丈夫抱怨时，她告诉他自己起床是为了听每晚在花园里歌唱的夜莺。她的丈夫或许怀疑了真相，抓住了那只夜莺，扯下它的头，将尸体扔在她的膝上。爱情结束了。她把夜莺送给了隔壁的骑士，后者将其封装在一个用黄金和精美珠宝制的小盒子里。恋人之间再也没有见过，因为社会更倾向于婚姻权利而非高尚的爱情，倾向于残酷的丈夫而非温柔的恋人。


    另一方面，并非所有的故事都如此沉重；人类或自然造成的障碍被克服了。玛丽本人也讲述了恋人获得幸福结局的故事。在其中一个故事里，亚瑟王的部下兰瓦尔为了他所爱的仙女，拒绝了王后不当的追求。王后向国王描述了一个相当扭曲的事实，兰瓦尔几乎名誉扫地，直到那名仙女出现拯救了他的名声。然后，他和他的爱人骑着同一匹矮马离去，再也没有出现过。


    在《埃利杜克》中（这是玛丽的另一个故事）——骑士埃利杜克爱上了一位年轻公主，但他对公主的爱和对妻子的忠诚之间陷入了挣扎。公主得知他已婚后，陷入了昏迷并被认为死亡了。埃利杜克将她完好无损的身躯交给一位隐士，并每天去探望她。他的妻子担心他的忧伤，经过调查发现了公主并成功救活了她。接着，这位女士（无疑是文学作品中最体事的妻子）退隐到修道院，以便这对恋人结婚。最后，当这对幸福夫妇决定也放弃世俗投身修道生活时，爱情、世俗社会和宗教的诉求得到了完美的调和。爱情的三角得到了净化，三人在神圣的友谊中度余生。⁸


    北方作家中最伟大的是克列蒂·德·特罗瓦。是克列蒂首次向我们介绍了兰斯洛和桂妮薇弗的故事。这部浪漫小说是受到了埃莉诺之女儿——香槟的玛丽的请求的，但克列蒂从未完成它。有人说他不喜欢婚外情主题，也许他确实不喜欢，因为在其他浪漫小说中，他极力调和爱情与社会。他对压迫性的便利婚姻几乎没有同情，也不在意通奸或乱交。他赞美男女之间自由给予并忠实守护的相互爱，他的故事通常以恋人的幸福结婚作终。


    克列蒂的浪漫小说《克里吉热斯》是寻找他爱情观的好地方，因为在近7000行诗中，他带领读者经历了两代恋人。故事开始君士坦丁堡皇帝之子亚历山德与兄弟埃利斯前往亚瑟王的宫廷。在那里，他爱上了索雷达莫尔，她是高文恩的妹妹，王后的侍女。索雷达莫尔也爱他，但他们无法向对方表白。相反，通过长长而孤独的独白，他们思考自己的情感，抱怨自己的痛苦，并渴望对方给出某种信号，证明他们的爱得到了回应。在某一次，亚历山德发现送给他的一衬衫是用索雷达莫尔头上的一根金发缝制而成的，他欣喜若狂。“他充满爱地吻了它，多达十万次，感到自己多么幸运……他怀里紧抱着那件衫，当他看着那根金发时，他觉得自己就像是整个世界的主人”（第112页）。亚历山德知道如果他请求，国王会把索雷达莫尔嫁给他，但“他宁愿在没有的情况下受苦，也不愿违背她的意愿”（第120页）。最后，王后干预了。她建议他们“不要在爱情中寻求暂时的享乐；要在婚姻中体面地结合”（第121页）。他们结婚了，不久后，索雷达莫尔生下了克里吉热斯。亚历山德带着妻子和孩子回到希腊，在那里阿里斯已经继承了他的头衔。亚历山德允许他保留这一头衔，条件是他永远不结婚，并让克里吉热斯成为他的继承人。为了推进故事到这里，克列蒂描述了多次战斗，而克里吉热斯像他父亲一样，经常因英勇而闻名。浪漫小说中英雄的学院是亚瑟王的宫廷，因此克里吉热斯在不暴露自己感情的情况下，告别了他的婶。他前往英格兰，并凭借英勇的事迹进一步提升了自己的声望，这些事迹由克列蒂详尽记载。在他回来，芬妮向她的女仆特莎拉倾诉。“我的病与众不同不同；因为当我想要谈论它时，它既带来快乐也带来痛苦，我在痛苦中竟是如此幸福”（第131页）。特莎拉诊断这种病症源于爱情，他们两人开始为芬妮的困境寻找解决方案。她爱着克里吉热斯但已嫁给阿里斯，只要她还是阿里斯的妻子，就不会将自己交给克里吉热斯。于是，特莎拉准备了一种魔药。这种药让阿里斯以为芬妮已经去世了。随后发生了许多惊心动魄的波折和险境，但克里吉热斯


