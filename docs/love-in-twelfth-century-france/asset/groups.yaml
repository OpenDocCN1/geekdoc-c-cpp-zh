    # LOVE IN TWELFTH-CENTURY FRANCE


    The main well of Christian thought was the Judeo-Christian Bible, and Jerome assured
    that it would be available to the medieval centuries by translating from Hebrew
    and Greek into Latin. His "Vulgate" translation was the most revered source possessed
    by twelfth-century readers. They puzzled over it, they quarrelled about it, but
    they never doubted that it was the word of God.


    The Bible gave a primacy in human affairs unmatched in any other philosophical
    or religious tradition. The God of the Old Testament was not only a just and faithful
    God, but a loving God. "I have loved you with an everlasting love," he told his
    people in return: "You shall love the Lord your God with all your heart, and with
    all your soul, and with all your might" (Deut. 6:5). But whereas love is only
    one of many themes of the Old Testament, the New Testament is a rich collage of
    texts on love, bound together by the single theme that "God so loved the world
    that he gave his only Son" (John 3:16), and that man''s response should be one
    of unmeasured love: "You shall love the Lord your God with all your heart, and
    with all your soul, and with all your mind. This is the great and first commandment.
    And a second is like it, You shall love your neighbor as yourself. On these two
    commandments depend all the law and the prophets" (Matt. 22:37-40). The primacy
    of love is inescapable:


    If I speak in the tongues of men and of angels, but have not love, I am a noisy
    gong or a clanging cymbal.

    And if I have prophetic powers and understand all


