    状态，即人与圣字的结合，当两者在精神上合而为一。


    伯纳德讨论的每一句话都会得到他的朋友威廉的支持，威廉是雷姆附近圣蒂里本尼笃会修道院的院长。尽管威廉比伯纳德年大几岁，但他非常崇拜伯纳德，之所以没有随他一起加入克莱沃西斯特会修道院，是因为伯纳德坚持让他留在需要他需要的圣蒂里。


    威廉的性格与他的朋友截然不同。他与伯纳德一起试图约束阿伯拉德，但他从未表现出像伯纳德那样的极度自信或对他人的掌控力。他的教育经历使他来到了拉昂，当时年轻的阿伯拉德正通过羞辱他的老师安瑟姆而初声鹊噪。威廉对学术辩论的激烈性以及竞争性的年轻学者之间相互智斗勇的傲慢感到反感，因此他离开了这一切，投向了修道院的和平与仁慈。1119年，他成为圣蒂里的院长，此时伯纳德成为克莱沃院长已四年；1135年，他搬到了西尼西斯特会修道院。西斯特生活的艰苦虽然毁了伯纳德的健康，但从未动摇他的精神，这对韧性较弱的威廉来说几乎难以承受，但他一直坚持直到1148年的去世。最后几年致力于撰写伯纳德的传记。


    威廉并非仅仅伯纳德的回声；他是一个博学的学者，写过许多广泛的主题。但他与伯纳德一样，深受同样的博学与苦修传统的熏陶，


    ## 12世纪法国的爱


    由于深受伯纳德传统的影响，并对伯纳德的伟大感到敬畏，威廉在爱的问题上不太可能和他产生根本分歧。他的思想和比喻与伯纳德并不完全相同，但他所描述的那种爱显然是同样的。


    威廉并不费力详细解释上帝为何存在。他为修道院读者写作，这些读者认同他的基本假设：爱神是人生的目的。威廉同意奥维的观点，爱是一种艺术，人们需要这种艺术的指导，但与奥维不同，威廉感兴趣的是那种将人类灵魂从世俗关注提升到追求上帝的爱。他在几部著作中讨论了这种追求的本质，特别是《沉思上帝》和《爱的本质与尊严》，这两部作品都是在圣蒂里创作的，还有一封在他去世西尼的几年前写给加尔笃会修道院的信。这封信长期来被误认为是伯纳德的作品，作为“黄金信”而闻名，但另外两部作品在欧洲的修道院也被广泛传读。三部作品合在一起，为我们研究修道生活提供了良好的来源。


    和伯纳德一样，威廉认为爱是自然（或自然的创造者上帝）置于灵魂之中的通向善的本能冲动。但如果不经过细心培养，爱很容易被肉体的软弱所腐蚀。爱必须被教导，但不是奥维德的方式，甚至不是学院派的方式——后者往往屈于骄傲和竞争，而非爱。在写给加尔笃修士的信中，


    ## 修道院


    威廉赞扬他们的生活方式，并补充道：“离开这个时代的智者吧——他们被这个世界的精神充斥，声称品尝高尚的智慧却在舔舐大地——让他们明智地堕入地狱吧。”——不，学习爱的艺术的地方应该是修道院，因为那是爱的特殊学校。“在这里，爱的研究得到了培养，辩论在这里举行，而解决方案不是通过三段法，而是通过理性、真实的真理和经验得出的。”


    必要的课程在修道院提供。修道生活需要对肉体的纪律，使其成为灵魂的忠实仆人。它要求阅读耶稣的生平，以便那个“不知道思考任何非物质事物的肉体之人，有一些可以与自己联系的东西。”它需要祈祷以寻求神性的帮助。通过圣灵的引导，肉体之人“可以一些可以与自己联系的东西。爱上帝，人无法爱上帝。”和伯纳德一样，威廉认为爱是某种通过阶段发展的。。这种爱通过恩典在人身上出生，通过阅读冥想来滋养，通过祈祷来装饰。爱通过阶段发展，从男孩发展为青少年，从青少年发展为老年人。他称这种发展的爱（amor），爱发展为仁德（caritas），而仁德发展为智慧。再次，他谈到了五种爱，对应五种感官：肉欲之爱（爱家人）、社交之爱（爱基督徒）、自然之爱（爱所有人）、精神之爱（爱敌人）以及神圣之爱（爱上帝）。引用奥古斯丁，他在其他地方谈到了宗教生活的三个阶段：开始、进步和完善。无论威廉选择什么样的比喻，基本上都是一样的。受恐惧（以及恩典）驱动的初学者决定爱上帝。他在修道院的练习中抑制肉体、阅读、冥想和祈祷，但他是盲目的。然而，他逐渐开始感知上帝。圣灵引导出一个新人。当“新人”在智慧中成长时，几乎“通过经验的手”感知上帝的美好。和伯纳德一样，威廉意识到尽管爱在增长和改变，这种具有分裂性的统一通过阶段进入智慧堡垒，否则意志不会移动，爱也不会持续，沉思也不会产生仁德，除非智慧在每一个阶段都在寻找她……正如我们从品味开始，我们也从品味继续。”
    一个人并不是离开一个阶段进入另一个阶段，而是这些阶段汇在一起工作。“因为看到上帝的美好就是爱它们，而爱它们就是拥有它们。因此，让我们尽力努力，以便看到，通过看到来理解，通过爱来拥有。”


    比喻并不总是相互一致，对于描述人与上帝之间爱的结合也是必要的，这种结合始于世间，在相似中完美，是因为人是按照上帝的形象创造的。但人已进入了“不相似的区域”，因此需要修道院提供的基督救赎之道。圣餐使人与基督之体合而一，从而成为真正的父子。圣灵注入灵魂，使人更像上帝，他的内省完美地揭示了自己，并通过对自我的认知开始升华为上帝的认知。这种在本世开始并在另一世达到巅峰的不可言的结合，是身体的统一，另一世则是精神的统一，以及相似性的统一。上帝之所以如此，人因恩典如此。”


    伯纳德和威廉只是描述爱神的众多僧侣中的两个。1142年，英国西斯特会修士阿德在前往罗马的途中经过法国，受伯纳德指导他写了一篇关于爱的论文。他的《爱的镜》将人通往上帝的过程描述为从一个安日到另一个安日的进展：


    img/56fc5d09a6530017ed18a63962a8c685_77_0.png


    图 5 最后的审判。正如受苦的基督已经在荣耀中复活，僧侣希望在最后的审判中战胜死亡和痛苦。来源：因内伯格诗集，尚蒂利，康德博物馆，藏品编号 1695，第 33r
    页。照片由 Giraudon 提供。

