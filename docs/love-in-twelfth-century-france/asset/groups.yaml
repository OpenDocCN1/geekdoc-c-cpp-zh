    # BIBLIOGRAPHICAL NOTE


    The Mystical Theology of Saint Bernard, trans. A. H. C. Downes (London and New
    York, 1940). The works of David Knowles provide sympathetic and highly reliable
    commentaries on medieval monasticism; those of G. G. Coulton are less sympathetic
    and are out of date, but they are still valuable. Works on individual figures
    are Watkins Williams, Saint Bernard of Clairvaux (Manchester, 1935); J. M. Déchanet,
    Guillaume de Saint-Thierry (Bruges, 1942); and Amédée Hallier, The Monastic Theology
    of Aelred of Rievaux: An Exper Theology, trans. Columbaney (Spencer, Mass., 1969).


