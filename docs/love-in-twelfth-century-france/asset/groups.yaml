    Plate 5. The Last Judgment. Just as the suffering Christ had risen in glory, the
    monk hoped to overcome death and suffering at the Last Judgment. Source: Ingeborg
    Psalter, Chantilly, Muse Condé, Ms. 1695, fol. 33r. Photo courtesy Giraudon.

