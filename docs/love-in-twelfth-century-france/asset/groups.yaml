- md: '

    # THE MONASTERIES


    In each Sabbath we find rest and peace and joy for the spirit, but the first belongs
    to a man’s own quiet conscience, the second to a community of men living happily
    together, and the third consists in the contemplation of God. The first sabb is
    rest from sin, the second is rest from cupidity and the third is rest from every
    dissension. In the first one we taste and see how sweet the manhood of Jesus is.
    In the second we see how perfect and complete is His charity. In the third we
    see Him in Himself, as God. First we are recollected in our souls, then we are
    drawn to the love of our fellow men, and finally we are lifted up to heaven.²20


    Another Cistercian abbot, Gilbert of Holland, continued Bernard’s complete series
    of sermons on the Song of Songs.²¹ Gilbert is not Bernard’s equal, but the love
    he describes is basically the same. Bernard and William of St. Thierry had not
    to startle their readers with radically new ideas. They hoped to provide illuminating
    variations on a theme that had been heard in the monasteries for centuries. The
    other monastic writers of their day hoped for no more.


