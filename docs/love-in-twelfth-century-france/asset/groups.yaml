    \ to Pages 156\n- Bibliographical Note 162\n- Index 168\n\n![](img/56fc5d09a6530017ed18a63962a8c685_10_0.png)\n\
    \n## Illustrations\n\n- **PLATE 1** Map of Europe 22\n- **PLATE 2** Boethius and\
    \ Philosophy 25\n- **PLATE 3** Christ embracing the Church 37\n- **PLATE 4** The\
    \ deposition of Christ 56\n- **PLATE 5** Last Judgment 66\n- **PLATE 6** King\
    \ David in battle and with musicians 82\n- **PLATE 7** David and Bathsheba 83\n\
    - **PLATE 8** Church sculpture showing an angel driving Adam and Eve from Paradise\
    \ 103\n- **PLATE 9** Detail from Gratian's Decretum showing a married couple and\
    \ another man 116\n- **MAP 1** France in the Twelfth Century 4\n\n## CHAPTER ONE:\
    \ Introduction\n\n\"GREAT is the force of love, wondrous is its strength. Many\
    \ are the degrees of love, and great the differences among them. And who can worthily\
    \ distinguish among them or even enumerate them? So speaks Richard of St. Victor,\
    \ a twelfth-century cleric.¹ Whatever love is, it has aroused the curiosity of\
    \ the men and women of Western civilization as has no other subject. Love is something\
    \ people do or enjoy, something that happens to them, something they fall into.\
    \ It is something people think about. Literature, art, and music are filled with\
    \ themes of love. Psychiatrists, theologians, poets, scientists, nearly all have\
    \ said that love is something good and necessary. But ancients and moderns alike\
    \ have failed to agree about what love is really. \n\nThe disagreement is not\
    \ surprising. Like truth and beauty, love is one of the great intangibles. It\
    \ cannot be LOVE IN TWELTH-CENTURY FRANCE measured, weighed, or analyzed into\
    \ its chemical components. It reveals nothing in a spectrograph. But it is surprising\
    \ that Western civilization, proud of its tradition of lucid rationality, has\
    \ continued to tolerate a really deplorable laxity in the use of the term love.\
    \ \n\n**Today a man can \"love\" his God, his country, his mother, his father,\
    \ his wife, his work, his children, his neighbor's wife, his sports car, his dog,\
    \ and his bourbon.** Some of these are expected to \"love\" him in return. The\
    \ poverty of the English language seems to impose an impossible burden upon one\
    \ little, four-letter \"Anglo-Saxon\"—a word of a kind usually noted for precision\
    \ if not for delicacy.\n\nUnfortunately, the languages of twelfth-century France\
    \ were no better. Unlike the educated American, the educated Frenchman of the\
    \ twelfth century had at least two languages at his disposal, Latin and French.\
    \ Twelfth-century writers learned their Latin from the pagan and Christian writers\
    \ of ancient Rome and from the Vulgate Bible. They found the nouns *amor, dielectio,\
    \ caritas* and the verbs *amare et diligere*, all meaning love. From these Latin\
    \ words were derived the French *amour* (and its variants) and *charité*. One\
    \ might have hoped that these rich resources, twelfth-century writers would have\
    \ cleared up a little by carefully reserving each word for a certain kind of love.\
    \ Unhappily, they did not. True, the Latin *caritas* was used only for a good\
    \ love, usually Christian in character. True, the French *charité* had a similar\
    \ usage, though it was already taking on the meaning of \"charitable\" service,\
    \ alms-giving and the like. But \n\namor, dilectio, and amour could be used indiscriminately,\
    \ for the love of God and of mammon alike.² A twelfth-century viscountess was\
    \ said to comment that the love between man and wife and the love between lovers\
    \ were two entirely different things and that “the ambiguous nature of the word”\
    \ prevented their comparison.² Ambiguous it was then, and ambiguous it has remained.\n\
    \nStill, twelfth France has a special attraction for the historian of love. Love\
    \ then occupied the attention of thoughtful and creative men and women as it did\
    \ in no other medieval century. Twelfth-century France was the scene of St. Bernard’s\
    \ mystic love of God, of the tragic love affair of Heloiseise and Abelard, and\
    \ of the new “romantic” love of troubadours and writers of romances. Consequently,\
    \ the subject has richness and variety. At the same time, it is contained within\
    \ manageable limits of time and space.\n\nThe twelfth century was one of energy,\
    \ growth, and ambition for all of Europe. As the century opened, Christendom was\
    \ still exhilarated with the success of the knights of France in the first crusade.\
    \ In 1099, they knelt in the blood of massaced Saracens and wept for joy. Jerusalem\
    \ was theirs. Only a few years before, the men of Genoa and Pisa had driven the\
    \ Moslems from Sardinia, and knights from Norman France had taken Sicily from\
    \ the Moslems. Similarly, in Spain the frontiers of Islam were being pushed southward\
    \ by Christian knights. Throughout the century, the sons and grandsons of the\
    \ first crusaders came and went between Europe and the Holy Land, and in their\
    \ wake followed merchants and pilgrims. Within Europe, the “medieval boom” was\
    \ well under way with a growing population, increased agricultural production,\
    \ and expanding commerce. Forests were cleared and swamps drained to make way\
    \ for new land. (Wait, \"Within Europe, the “medieval boom” was well under way\
    \ with a growing population, increased agricultural production, and expanding\
    \ commerce. Forests were cleared and swamps drained to make way for new land.\
    \ Settlers in these new lands founded the “new towns” of Europe: Villeneuve, Villanova,\
    \ Neuburg.) Technological innovations, like heavy, wheeled plows and watermills,\
    \ made the labor of peasant farmers more fruitful, and nearly everyone profited\
    \ from the increased wealth. Growing numbers of craftsmen and merchants were building\
    \ cities, travelling the roads, and sailing the seas and rivers. A new society\
    \ was developing, rooted in the rich resources of Europe, in new techniques for\
    \ exploiting those resources, and in the organizing skills of medieval princes,\
    \ clergy, and townsmen. The foundations of modern Europe were laid.\n\n“France”\
    \ participated in these changes, but not in the sense that France was a clearly\
    \ defined unit. In the twelfth century, it had neither today's internal unity\
    \ nor today's sharp differences from neighboring areas. The kings of France claimed\
    \ authority over an area almost equal to modern France, with the eastern boundary\
    \ running from north to south, roughly along the Scheldt or Escaut, the upper\
    \ Meuse, the Saône, and the Rhone. In practice, however, the king had no control\
    \ over most of this kingdom. Chroniclers frequently called it “Gaul” and reserved\
    \ the name “France” for the area around Paris. Besides political\n\n![](img/56fc5d09a6530017ed18a63962a8c685_15_0.png)\n\
    \nFrance in the Twelfth Century. Map by Linton S. Thorn.\n"
