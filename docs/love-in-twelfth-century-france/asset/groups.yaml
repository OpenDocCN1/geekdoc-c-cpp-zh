    # LOVE IN TWELFTH-CENTURY FRANCE


    progresses through stages. Love is more than a mere gift of God, for it is God
    himself. “God is love,” wrote John (1 John 4:8). Love is the law by which God
    lives, for “what is it in the supreme and blessed Trinity which preserves supreme
    and ineffable unity, unless it is love?” Love is the “divine substance” (col.
    996). As for the four stages of love, they are presented again in this final chapter,
    but Bernard also speaks of the “laws” of the slave, the hireling, and of the son.
    The slave praises God out of fear, the hireling out of desire for reward, and
    the son out of love, because God is good. Perhaps Bernard’s most acute perception
    here is that the law of the son, which is the law of love, does not destroy the
    other laws. That is, fear and desire remain, in him who loves God for himself.
    But the fear is now a “chaste” fear, not fear of punishment but fear of losing
    the beloved. The desire is now an “ordered” desire. The love of God is an overriding
    love which puts all things in their proper places, so that “the body and all the
    good things of the body are loved for the sake of the soul, the soul for the sake
    of God, but God for the sake of himself alone” (col. 998).


    For Bernard, love gratitude for needs and desires fulfilled, for gifts given out
    of love; love is the desire and yearning of the human heart which can only be
    satisfied by God; love is the joy of possession and of being possessed, of oneness
    with the divine Bridegroom. and love is all these things at once; the knowledge
    of God, the desire for God, and the enjoyment of God are all inseparable, from
    their primitive origins in the beginner to their culmination in the final


