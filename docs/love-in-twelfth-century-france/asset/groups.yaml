    reaffirmed the longstanding belief that marriage must be monogamous and indissoluble,
    requirements which could only serve to raise women above the level of concubinage.
    And the masters of Paris gave generously to provide dowries for prostitutes who
    wished to reform and marry.


    However ineffective their opinions may have been in changing society, the schoolchildren
    were unanimous in agreeing that love must be freely given, and that no one could
    be forced to marry against his or her will. A marriage was made, they said, not
    by agreements between families, not by priests, not by rituals in the church,
    but by the free consent of the couple, and it was confirmed by their sexual union.
    The marriage in a cathedral before a bishop, with all the trappings of a princely
    ceremony, was no more valid, no more a sacrament, no more a marriage, than was
    the private commitment made on a spring day between a young man and woman alone
    in a meadow. The maid in the meadow might later regret the absence of witnesses
    if her husband simply denied that he had made any commitment, but in the eyes
    of God, the schoolmen said, Similarly, no amount of extravagant ritual could make
    a marriage where either man or woman withheld free consent.


