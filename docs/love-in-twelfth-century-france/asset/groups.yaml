    那些争斗的种子；

    太阳神驾着金车带来

    黄金，和粉红的日子；

    月亮女神统治着

    由赫斯珀斯带来的夜晚；

    贪婪的海限制着

    它的波浪在边界内

    免得它们侵犯

    动荡大地的广阔边界。爱统治着陆地

    并主宰着天空。

    如果爱松开缰绳，

    现在在爱中运行的

    将在突如其来的战争中碰撞；

    一切将争相破碎

    那些美丽的运动，

    那是它们现在，

    在爱与信赖中维持的秩序。这种爱将所有民族

    统一在神圣律法之下，将婚姻的神圣仪式

    在纯洁的爱中结合，

    为同伴定下友谊信赖的法则。

    噢，人类！如果统治天空的爱

    也能统治你们的灵魂，该多么幸福！


    # 遗产中的爱


    那么，异教传统为它的继任者提供了几个主要的爱主题。它是对“善”的灵魂渴望，这种渴望在物质世界中无法满足；它是拥有爱人的狂热且色欲的欲望；它是简单的肉体愉悦，不应被太认真地对待，以免失去愉悦；它是高尚品格之人之间可能的善与情感的互惠纽带；在宇宙尺度上，它是一种神秘的力量或能量，产生了宇宙中所有的生命，并维持着其各个部分之间的和谐。


    所有这些思想在十二世纪的图书馆里都能找到；但中世纪读者发现，罗马文明留给他的不仅有基督教作者，还有异教作者。到四世纪末，罗马帝国正式成为基督教国家。当时最优秀的人才将他们的才华献给摇摇欲坠的帝国，而是献给了新兴的基督教教会。圣安布罗斯，一位来自高尔贵族家庭的罗马政治家，成为了米兰主教。圣杰罗姆出生于伊利里亚的富裕家庭，接受了卓越的罗马文学教育，并利用他的技能将圣经翻译成拉丁语。圣奥古斯丁出生于罗马北非，放弃了卓越古典修辞教师的职业，成为他家乡希波的主教。这些以及其他基督教罗马人的著作在中世纪图书馆中随处可见，它们向中世纪传递了新的基督教思想，以及基督教对已熟悉的异教思想的变体。


    # 十二世纪法国的爱


    基督教思想的主要源泉是犹太基督教圣经，杰罗姆通过将希伯来语和希腊语翻译成拉丁语，确保了它在中世纪可用。他的“武加大本”译本是十二世纪读者最受推崇的来源。他们对其感到困惑，对其产生争论，但他们从未怀疑过那是上帝的话。


    圣经在人类事务中赋予了任何其他哲学或宗教传统都无法比拟的主导地位。旧约的上帝不仅是公义忠实的神，也是一位仁爱的神。“我用永远的爱爱你，”他向他的民回答道：“你要尽心、尽性命、尽力爱耶和华你的神”（申命记
    6:5）。但虽然爱只是旧约众多主题之一，新约则是关于爱的文本的丰富合集，由一个单一主题结在一起：“神爱世间，甚至将他的独生子赐他们”（约翰福音 3:16），而人的回应应当是不计量的爱：“你要尽心、尽性命、尽意爱耶和华你的神。这是最大的也是第一的诫。第二条也是像这的，“要爱你的邻舍如爱自己。”所有的律法和先知都在这两诫上”（马太福音
    22:37-40）。爱的主导地位是不可逃避的：


    即使我说人道和天使的话，若没有爱，就成了响的钟、鸣响的钷。

    即使我有先知的能力，能洞察一切奥秘和知识，并且有所有的信心，可以移山，若没有爱，我就什么也不是。

    即使我将所有的所有的舍给人，甚至把身体交给火烧，若没有爱，就与我无益。……信、望、爱，这三一直是总存，其中最大的是爱（哥林多后书 13:1–3,13）。


    约翰简洁地说道：“神就是爱”（约翰一书 4:8）。


    # 遗产中的爱


    首先，有上帝对人的爱，一个异教徒对此没话可说。在圣保的信函和圣奥古斯丁的著作中，上帝的爱是全给予的。创造的行为是上帝爱的表达，完全是单方面的；上帝对人的爱先于人。堕落之后，当人需要救赎时，上帝赐下他的儿子来实现人的救赎。再次，上帝自由地行动，证明一种绝非赢得也不应得的爱。最后，还有“灵的恩赐”（奥古斯丁倾向于将其等同于圣灵本身），上帝派遣它居住在选民的心中。全程，上帝对人的爱是恩赐之爱。


    但如果爱是给予，人又是如何爱上帝呢，因为人又什么是上帝所缺乏的？回答这个问题


