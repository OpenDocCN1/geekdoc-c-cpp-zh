    Love, trans. John J. Parry (New York, 1959); Mediaeval Latin Lyrics, trans. Helen
    Wadd, ed. (London, 1948).


    ### SECONDARY WORKS


    Good general histories are Georges Duby and Robert Mandrow, A History of French
    Civilization, trans. James B. Adkinson (New York, 1964) and Friedrich Heer, The
    Medieval World: Europe, 1100–1350, trans. Janet Sondheimer (New York, 1963). There
    are many useful articles and bibliographies in the New Catholic Encyclopedia,
    15 vols. (New York, 1967).


    A sense of what daily life was like in twelfth-century France can be acquired
    from Achille Luchaire, Social France at the Time of Philip Augustus, E. B. Krehbiel,
    introduced by John W. Baldwin (New York, 1967) and Urban T. Holmes, Daily Living
    in the Twelfth Century (Madison, 1964). A superb interpretation of the period
    is provided by R. W. Southern, The Making of the Middle Ages (New Haven, 1961).
    See also the same author Medieval Humanism and Other Studies (New York and Evanston,
    1970). An excellent collection of essays appears in Twelfth-Century Europe and
    the Foundations of Modern Society, ed. Marshall Claget (Madison, Wis, 1966); and
    a recent work of much value is Christopher Brooke, The Twelfth Century (New York,
    1970).


    The twelfth-century inheritance from antiquity can be seen in R. R. Bolgar, The
    Classical Heritage and Its Benefaries (Cambridge, 1954); E. K. Rand, Founders
    of the Middle Ages (Cambridge, Mass., 1928) and his Ovid and His Influence (Boston,
    1925); C. H. Haskins, The Renaissance of the Twelfth Century (Cambridge, Mass.,
