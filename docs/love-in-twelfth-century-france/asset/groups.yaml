    # 修道院


    在每一个安息日，我们的灵魂都能获得安息、和平与喜悦，但第一种安息属于个人宁静的良知，第二种属于和谐生活的人共同体，而第三种则在于对上帝的冥想。第一种安息是远离罪恶的，第二种是远离贪婪的，第三种是远离一切纷争的。在第一种安息中，我们品尝并看到耶稣的人性是多么美妙；在第二种中，我们看到他的爱是多么完美且完整；在第三种中，我们看到他自身，作为上帝。首先我们在灵魂中反省，然后我们被同胞的爱所吸引，最后我们被升向天堂。²20


    另一位西斯多会的院长，来自荷兰的吉伯特（Gilbert of Holland），延续了伯纳德关于《雅歌歌》的系列讲演。²¹吉伯特并不如伯纳德那样卓越，但他所描述的爱本质上是相同的。伯纳德和圣蒂埃的威廉（William
    of St. Thierry）并不用根本性的新思想来惊扰读者。他们希望在一个在修道院中流传了几个世纪的主题上，提供启发性的变奏。当时的其他修道院作家也并无他求。


    修道院的主要事务是爱上帝，但修士们不能忽视第二条诫——爱邻人。他们知道自己应该爱人类，并通过向同道表现出善意以及通过慈善行为来表达这种爱。伯纳德从广义的社会责任角度解读这种爱。他声称，正是这种爱使他沉浸在欧洲事务中，并迫使他忽略了自己的朋友。


    # 十世纪法国的爱


    正是这种爱要求人们在担任院长或主教时承担政府职责，尽管他们更倾向于过独处祈祷的生活。²22爱同胞是修道院生活中公认的一部分，尽管我们应当记住，实践往往背离原则，而且即使原则也不谴责严厉，甚至不谴责不虔诚的人：犹太人、穆斯林、异教徒、不悔改的罪人。无论如何，爱所有人的要求显然被认为是一个简单的问题，不需要多少研究。通过祈祷和讲道，人们帮助他人看到并履行上帝的旨意。在不那么重要的层面，人们照顾他们的身体需求。


    友谊则更为复杂。正如我们所看到的，古代的遗产既向基督徒推荐人类友谊，也暗示它是对爱上帝的干扰。这种模糊性一直持续着。西斯多会的博伊的阿尔努夫（Arnulf
    of Boys）写道：“让修士没有亲密的朋友……让他想得好像这个宇宙中只存在他一个人——只有他和上帝。”²23 嘉图斯会会的古戈（Guigo）实际上拒绝了友谊，因为他说人应该爱他人，但不应为自己寻求任何爱。


    每个人的爱都是被所有人所分享的。因为个人应当爱所有人。因此，那些希望这种生活被特别地向自己展示的人是一个小偷，并因此得罪了所有人……所以，要对那些爱你们的人大喊道：“你们这些可怜的人，请立即停止以任何方式崇拜、敬畏或尊崇我，因为我自己是卑微的，我也无法为自己或你们提供任何帮助；相反，我需要你们的帮助。”24


    伯纳德本人有很多亲密的朋友，他对友谊持矛盾态度。有时，他发现个人朋友是他爱上帝和服侍所有人工作的障碍。“让我们停止这种劳累的信件往来吧，”他写给朋友奥格（Oger）。“让我们……专心日日夜夜地冥想主主的律法，那是爱的律法。”25
    他似乎也忘记了友谊的互惠性质，就像他写给普雷蒙特雷院长休（Hugh）时那样：“对我而言，我决定爱你所做的一切，即使你不报我的爱……我将紧贴着你，即使违背你的意愿；我将紧贴着你，即使违背我自己的意愿。”26
    如果伯纳德按照这些夸张的言论行动，他对许多人来说一定像个可怕的麻烦。当他正组织反对阿伯拉德（Abelard）时，他却向阿伯拉德彰显友谊，这看起来似乎比麻烦更糟。


    但尽管有这些顾虑，友谊似乎在修士之间依然兴盛。他们的信件往往是温暖且私人的，伯纳德本人也不羞于宣称对他已故兄弟杰拉德（Gerard）的友谊。在葬礼讲道中，他说：


    我的灵魂紧贴着他的灵魂；两个合而为一，不是通过血缘，而是通过我们思想的统一。我们确实有血缘之亲，但我们更多是通过精神的共同、思想的契合、举止的相似而结合。我们同心同德。但现在，一把剑刺穿了这灵魂，他的和我的，并将其一分为二，将其中一部分送往天堂，却将另一部分留在地上……我承认我并非对痛苦无感；我被死亡感到恐惧，我自己的死亡和我所爱之人的死亡。他是我的，杰拉德无疑是我的。难道我不能声称他是我血缘上的兄弟、我教团中的儿子、他在为我牵挂关怀时的父亲、我精神上的伴侣、我情感上的亲密之交吗？他从我身边离开了。我感受到了。我被切（割）了，而且切得很深。27


    只有一位十二世纪的修士曾详细论述过友谊，那是里沃的艾尔雷德（Ailred of Rievaux），他住在英国而非法国。诚然，他的思想至少受到一位法国人的青睐。布卢斯的彼得（Peter
    of Blois）是一位声誉卓着的教会政治家和作家，他非常喜欢艾尔雷德，以至于将艾尔雷德的作品伪装成自己的剽窃之作发表了。²8 尽管彼得有偷窃行为，艾尔雷德的思想只能通过扩大本书的地理限制才能纳入其中。这些思想似乎值得这种牺牲。


    作为一名学生，艾尔雷德曾读过西塞罗的作品。诚然，他的思想得到了至少一位法国人的青睐。尽管彼得有偷窃行为，艾尔雷德的思想只能通过扩大本书的地理限制才能纳入其中。在50岁时，艾尔雷德重新转向这一主题。由于由于西塞罗写的是《友谊》，艾尔雷德的题目是《精神友谊》。通过修士们对内心情感运动的敏感洞察，艾尔雷德开始解释人与人的爱。


    正如我们所看到的，被理性净化的爱与情感相结合时，这种爱是甜蜜的。正如友谊也有其错误或不完美的形式，存在幼稚和青少年期的友谊主要是以自我为，是不稳定的。然而，成熟的友谊既受理性驱动也受情感驱动。


    当理性宣布一个人因美德而值得被爱时，同时心灵被其迷人的举止所征服，这种友谊是受理性和情感共同驱动的。理性与情感如此紧密结合，以至于理性净化的爱因情感而变得甜蜜。


    这种爱并非一蹴而就的。相反，朋友必须寻找彼此，并了解彼此的特质，“显然，人们必须警惕那种在于判断之前的爱的冲动，这种冲动带走了……”（col. 68b）。朋友必须能够彼此信任，在一起时完全安全。他们必须表现出谨慎，知道何时给予对方恩惠何时请求帮助，何时安慰何时祝贺，并在必要时以适当的方式、地点互相纠正。他们必须保持耐心，为了朋友承受任何逆境，甚至是朋友的责备。随着两人变得亲密，他们通过善意的行为展示爱的内在甜蜜；他们揭示内心的秘密，必须爱所有人，但他不能成为所有人的朋友。“从他们中间选择一个让他进入友谊秘密的人……向他慷慨倾倒情感，向他袒露胸膛，揭示他的内在本质、骨髓以及思想和意图”（col.
    700）。随后，两人体验到了西塞罗所论述的合一，那种“人性与神性思想的最高统一”（col. 680）。他们同心同意，意图一致，为彼此的救赎希望并祈祷，甚至在外表上合一，因为一个朋友的面部表情映照着另一个。


