    state, the marriage of man with the Word, when the two become one in spirit.


    Every word of Bernard''s discussion would have been seconded by his friend William,
    abbot of the Benedictine abbey of St. Thierry near Rheims. Although a few years
    near his senior, William idolized Bernard and was prevented from joining him at
    the Cistercian abbey of Clairvaux only by Bernard''s insistence that he should
    remain at St. Thierry where he was needed.


    William''s temperament was quite different from that of his friend. He joined
    Bernard in trying to rein in Abelard, but he never showed Bernard''s supreme self-confidence
    or his mastery of others. His education had taken him to Laon probably at the
    time when the young Abelard was first making a name for himself by humiliating
    his teacher Anselm. William was repelled by the violence of academic disputations
    and by the arrogance of competitive young scholars matching wits with one another,
    so he left them all for the peace and benevolence of the monastery. He became
    abbot of St. Thierry in 1119, four years after Bernard became abbot at Clairvaux;
    in 1135 he moved to the Cistercian house at Signy. The sharpness of Cistercian
    life, which broke Bernard''s health but never fazed his spirit, was almost too
    much for the less resilient William, but he endured until his death in 1148. The
    last years were spent in working on a life of Bernard.


    William was no mere echo of Bernard; he was a man of learning and he wrote on
    a wide variety of subjects. But formed by the same learned and ascetic tradition


    ## LOVE IN TWELFTH-CENTURY FRANCE


    as Bernard, and awed by Bernard''s greatness, William was not likely to differ
    from him radically about love. His ideas and metaphors are not identical with
    Bernard''s, but the kind of love he describes is clearly the same.


    William did not bother to explain in detail why God should be. He wrote for a
    monastic audience that shared his basic assumption that the love of God was the
    purpose of human life. William agreed with Ovid that love was the art of that
    and that one needed instruction in this art, but unlike Ovid, William was interested
    in the love that lifted man''s soul from earthly concerns to the pursuit of God.
    He discussed the nature of this pursuit in several works, but especially *On the
    Contemplation of God* and *On the Nature and Dignity of Love*, both written at
    St. Thierry, and a letter written to a Carthusian community a few years before
    his death at Signny. This letter, long mistaken for a work of Bernard''s, was
    famous as the “Golden Letter,” but the other two works were also widely read in
    European monasteries. Taken together, the three works provide us with a good source
    for monastic life.


    Like Bernard, William thought love was the natural impulse toward goodness placed
    within the soul by nature, or by God, the author of nature. But love was easily
    corrupted by the weakness of the flesh unless it was carefully cultivated. Love
    must be taught, but not the manner of Ovid, nor even in the manner of the schoolmen,
    too often given over to pride and rivalry rather than to love. In his letter to
    the Carthusians,


    ## THE MONASTIES


    William commended them for their way of life and added, “Leave the wise men of
    this age—blown up with the spirit of this world, claiming to taste lofty wisdom
    while licking the earth—leave them to descend wisely into hell.”— No, the place
    to learn the art of love was the monastery, for it was the special school of love.
    “Here the study of love is cultivated, its disputations are held, and the solutions
    are reached not by syllogisms but by reason and by real truth and by experience.”


    The necessary lessons were given in the monastery. The monastic life required
    discipline for the body, that it became the faithful servant of the soul. It required
    reading about the life of Jesus so that corporeal man “who doesn’t know how to
    think about anything which is not corporeal, may have something which he can relate
    to himself.” It required prayer for divine assistance, there could be no love
    of God. “Man does not love God. Man does not love God except through the Holy
    Spirit. The love of God, therefore, which is born in man by grace, is nurtured
    by reading, by meditation, and strengthened and adorned by prayer.”


    Like Bernard, William looked for love as something that develops. Love grows through
    stages, just as the boy develops into youth, the youth into the man, and the man
    into the old man. He called these stages will, which grows into love, love (amor),
    which grows into charity, and charity (caritas), which grows into wisdom. Again,
    he spoke of five kinds of love analogous to the five senses of the body: carnal
    love (love of family), social love (love of fellow Christians), natural love (love
    of all men, all sharing the same nature), spiritual love (love of enemies, a love
    that does not grow out of nature), and divine love (love of God). Borrowing from
    Origen, he wrote elsewhere of the three stages of the religious life: beginning,
    progressing, and perfected.


    Whatever metaphor William chose, the development is basically the same. Moved
    by fear (and grace), the beginner determines to love God. He labors and sweats
    in the monastic exercises, subjugating the flesh, reading, meditating, praying,
    but he acts blindly, without any direct perception of why he does. Gradually,
    however, he begins to develop an awareness of God. The Holy Spirit leads forth
    a new man who perceives the goodness of God and is untroubled by the demands of
    the flesh or secular ambition. As the “new man” grows in wisdom, almost “to touch
    with the hand of experience” the goodness of God.


    Like Bernard, William is aware that although love grows and changes, the experience
    of having a unity which is betrayed by rational division who ascends through stages
    to the citadel of wisdom, nevertheless, the will would not move, nor love continue,
    nor would contemplation come forth in charity nor delight in wisdom, if wisdom
    did not, in every stage up to the last, seek out those seeking her. . . . As we
    have begun with taste, we continue with taste.” One does not leave one stage and
    pass to another; rather the stages concur to work together. "For to see the good
    things of the lord is to love them, and to love them is to have them. So let us
    strive as best we can so that we may see, and by seeing understand, and by understanding
    love, and by loving have."


    Metaphors, not always consistent with one another, are necessary too for describing
    the loving union between man and God who begins on earth and is perfected in likeness
    with God because he was created in God''s image. But by man has passed into the
    "region of dissimilarity" and is therefore in need of the saving regimen of Christ
    provided in the monastery. The Eucharist makes man one with the body of Christ
    and thus a true son of the Father. The Holy Spirit pours himself into the soul
    so that man becomes more like God, his own introspection reveals himself perfectly,
    and, by progressing in the knowledge of self, begins to ascend to the knowledge
    of God. That ineffable union which begins in this life and culminates in the next
    is a oneness of body, terminates in the next is a oneness of spirit, and oneness
    of similarity. What God is by nature, man is by grace."


    Bernard and William are only two of many monks to describe the love of God. In
    1142, the English Cistercian Aard of Clairvaux passed through France on his way
    to Rome and was instructed by Bernard to write a treatise on love. His *Mirror
    of Charity* describes man''s progress to God as progress from one sabbath to another:


