    than the recent past. The students, the teachers, and the alumni who became abbots,
    bishops, popes, and secular ecclesiastical princes formed a special intelligentsia
    within twelfth-century France. Drawn from all social classes, they were one in
    Latin learning, in their celibacy, and in their sacred orders.


