    viscountess—on the occasion of the bishop’s next haircut. As a prince, William
    maintained as much order as could be expected in an unruly land, and for twenty
    years was strong enough to refuse to do homage to King Louis the Fat.


    William’s son, William X, gave his family’s future a new direction when, at his
    death, he left his daughter and heiress, Eleanor, to the care of Louis the Fat.
    From his deathbed, Louis arranged for her marriage to his son Louis VII in 1137,
    and the Capetian family had apparently acquired Aquitaine and a new preeminence
    in the south. Eleanor proved to have a mind of her own. She and Louis did not
    get along. On the Second Crusade, rumor had it she found consolation with men
    more worldly than her pious spouse, and in 1152 they separated. The Capetians
    thereby lost Aquitaine. The Angevins were not slow to find it, for within the
    year Henry married Eleanor, eleven years his senior. When Henry inherited England
    two years later, the Angevin Empire had been born, stretching from Scotland to
    the Mediterranean. In the second half of the century, therefore, the Capetians
    and the Angevins contended for dominance of all France, and the Capetians were
    decidedly the underdogs.


    The Angevins were more impressive than the Capetians in almost every way. The
    vigor, the intelligence, and the fearful temper of Henry II made Louis VII seem
    even more lackluster than that he was. Henry’s son Richard the Lion-Hearted was
    known to Christians and Moslems almost as the greatest warrior of his day, while
    his Capetian contemporary, Philip Augustus (II), avoided battles whenever he could.
    Richard’s brothers Henry and Geoffrey were models of chivalric courtesy and valor.
    But the Capetians were equipped by nature with crucial assets for an hereditary
    monarchy: they lived a long time and they had sons. Louis the Fat and Louis VII
    were both crowned during their fathers'' lifetimes. Louis VII failed to produce
    a male heir for almost thirty years, but in 1165, Philip Augustus was born. News
    of his birth reached the monks of St.-Germain-des-Prés as they were chanting,
    “Blessed is the Lord God of Israel, since he has visited and brought salvation
    to his people,” and the monks took it as a good omen.


    Philip justified their expectations, for during 1180 to 1223, he learned to be
    patient in awaiting opportunities and quick to seize them. He died the strongest
    man in France. He had earned the name “Augustus” by “augmenting” his kingdom.
