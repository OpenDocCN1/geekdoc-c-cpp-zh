    # INTRODUCTION


    Victor—were on the verge of becoming one, the university of Paris, the mistress
    of studies for all of Europe. The scholars were by no means entirely “French”;
    Peter Lombard came from northern Italy, Hugh of St. Victor from Saxony, Richard
    of St. Victor from Scotland, John of Salisbury from England. But for some reason,
    France seemed to be the favorite home for scholars.


    Like other parts of Europe in the twelfth century, France was developing, in embryonic
    form, the interrelated complexities of modern society. As the population became
    more dense, the social organizations necessarily became more complicated. More
    thought was needed to keep these organizations functioning smoothly, and in the
    towns and princely courts, including the courts of ecclesiastical princes, the
    first bureaucracies began to develop. These new governments suppressed some of
    the violence which characterized an earlier age (when violence was the only means
    to defend one''s rights) and provided courts as an alternative. The growing commerce
    between regions and between town and country required that additional money be
    put in circulation, that institutions such as markets, fairs, and banking be developed
    to facilitate exchange. It also provided the wealth to support the urban and princely
    bureaucracies which supervised and protected the exchange. On every level, educated
    men were needed, men who could keep records and accounts, formulate rules and
    regulations, gather testimony and give judgments. Young men flocked to the schools
    in the hope of rising to positions


    # LOVE IN TWELFTH-CENTURY FRANCE


    of power and affluence in these budding bureaucracies, positions like those of
    Suger, abbot of St. Denis and regent of “France” under Louis VII, or of Walter
    of Coutances, archbishop of Rouen and chief justiciar of England under Richard
    the Lion-Hearted. The sons of townsmen sought their fortunes in business as asp
    to positions exalted but almost as comfortable. They too usually began their careers
    with letters and numbers. As happens today, some of these men succeeded in the
    world of affairs, some turned to learning and teaching, some simply lived lives
    of unfulfilled promise and disappointed hopes. Their combined efforts created
    a sizeable group of educated men who, together with the literate men and women
    of aristocratic courts, provided both the seed-bed and the audience for the many
    writers who took love as their subject.


    Modern scholarship rightly stresses the accomplishments of twelfth-century France.
    The prosperous towns, the great stone churches, the overflowing schools, and the
    powerful, sophisticated courts were solidly based in a flourishing and expanding
    economy—indeed a likely setting for a fruitful interest in love. But the chronicles
    of the period prevent us from harshly calling it a century of love. It was also
    one of poverty and suffering, of ignorance and cruelty.


    The modern city-dweller has almost forgotten his dependence on agricultural cycles.
    Rapid transportation and modern methods of preserving foods have made our diets
    relatively unchanging all year round. Consequently, we give most of our attention
    to irregular business cycles, cycles which affect our scale of living much more
    than the cycle of seasons which governs agriculture. But in the twelfth century,
    the success of a year''s crop meant feast or famine to the people of the region.
    In 1109, food prices in the region of Sens were twice that of the previous year
    because storms of wind and hail had ruined fields, orchards, and vineyards.¹11
    For almost a decade before the second crusade (1147), food shortages in a province
    near the monastery of Trois-Fontaines forced nobles to sell all they had to survive
    and sent the lowly by the hundreds to beg bread from the monks.¹12 Regional famines
    were a commonplace of twelfth-century France.


    Warfare was perhaps a greater threat than the weather. Nothing was more common
    than for quarrelling nobles to destroy their enemies'' economic resources, which
    is, to burn crops and buildings, together with any peasants and animals who happened
    to get in the way. The farmers always suffered. For the nobles, warfare was a
    rather enjoyable sport that relieved the tedium of peace, but writes a chronicler,
    “quiet safety brought joy to the hearts of farmers.”¹³


    Even when the weather was good and the nobles were formally at peace, life was
    far from secure. Large bands of brigands, who respected nothing, terrorized the
    countryside like wolf-packs. A group of beset Cluny itself. In 1166, when the
    monks led out a procession of burghers, trusting only in the relics they carried
    and the holy vestments they wore, the brigands fell upon them. They stripped and
    killed the burghers. Louis VII caught some of them and hung them on gibbets to
    die, but no prince could hope to rid the land of all of them.14 In 1183, an army
    of desperate people from all classes succeeded in cornering and massacring a force
    of brigands numbered at 10,000; but the 500 women who were found at the nearby
    camp probably had little trouble finding new camps to follow.15


    The following pages are intended to reveal some of the tenderness, wisdom, and
    beauty of twelfth-century France; but the reader should remember that there was
    a darker side. Jews were massacred; captured peasants had their eyes put out;
    human and bestial enemies were cursed in elaborate “religious” rituals; fire,
    plague, and famine were never far away. This medieval paradox, in which beauty
    and ugliness live together with familial intimacy, no doubt disturbs us, but we
    cannot really complain until we resolve the paradox of our cities, the modern
    homes of compassion and brutality, of erudition and illiteracy, and of luxury
    and poverty.


    Finally, the reader should also remember that the so-called “middle ages.” Authors
    frequently use the adjective medieval to apply to the fifth and fifteenth centuries
    alike, though the millennium between them had changed nothing. Anthologies of
    “medieval” writings place descriptions of ninth-century peasants near those of
    fifteenth-century townsmen, as though nothing separated them but a town-wall and
    a stretch of forest. When the twelfth century began, St. Augustine had been dead
    for nearly 700 years, Charlemagne for nearly 300. When it ended, Dante’s Divine
    Comedy was still a century in the future, Chaucer’s Canterbury Tales another century
    after that. This, then, is not a book about the “middle ages,” that drag shroud
    thrown over the varied colors of a thousand years. It is about the twelfth century
    only, a time when the rest of Europe looked to France for instruction on love.


    # CHAPTER TWO


    # Love in the Legacy from the Past


    THE CULTURAL legacy inherited by the twelfth century was largely unwritten. Illiterate
    French knights treasured stories of their Frankish ancestors who rode with Charlemagne
    in campaigns against the Moslems, campaigns whose grandeur increased with each
    telling. From the misty highlands of Wales and from Ireland, where the Celts had
    taken refuge first from the Romans, then from the Angles and Saxons, and finally
    from the Normans, other tales of the fabled past filtered into France: tales of
    a great Celtic warrior Arthur who had long, long ago withstood the Saxon invaders
    of Britain; tales of the ill-starred lovers Tristan and Iseult; tales of dragons,
    of magic potions, of bridges made of sharp swords, and of magic potions of every
    variety. The old German and Celtic stories were told and retold through the centuries,
    changing.

