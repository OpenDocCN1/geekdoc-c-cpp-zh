    ## THE VARIETIES OF LOVE


    In manifesting either the giving or the taking attitude, one can be either active
    or passive. In real reciprocal love, the relationship is a fluctuating one in
    which each person is alternately giving and taking, active and passive. This fluid
    character of reciprocal love could be exemplified by describing sexual love-making,
    but describing a conversation between friends serves just as well. When one consoles,
    instructs, or amuses another, he exemplifies an active giving while the listener
    exemplifies a passive taking attitude. When a friend speaks, though, to relieve
    his own mind, or to take delight in the sound of his own voice, he exemplifies
    an active taking attitude, while his patient friend exemplifies a passive giving
    attitude. There can be no reciprocal love when one gives or takes exclusively,
    and a wholly active or wholly passive individual is inconceivable. In reciprocal
    interpersonal love, all four attitudes are present in a constantly fluctuating
    combination.


    Unilateral love lacks reciprocity. A person is benevolent toward another (giving)
    or desires another''s benevolence (taking), but because of choice, ignorance,
    or circumstance, the other person does not respond. A person may be benevolent
    to so many people, mankind perhaps, that it is impossible for them to respond.
    Influenced by the Christian and pagan writers of antiquity, twelfth-century thinkers
    were inclined to accept unilateral love as an adequate form of love. Too often,
    they thought of love as a virtue or emotion contained entirely within the individual.
    Following St. Augustine, they sometimes thought of God''s love for man as God''s
    unilateral benevolence, neglecting their God''s obvious interest in being loved
    in return. They sometimes thought that man''s love for God was unilateral desire,
    neglecting their own generous impulses to give God something in return, an impulse
    manifested in worship, and in good works. Poets sometimes stressed the desire
    of the lover for the beloved, neglecting the implicit inadequacy of a love which
    is not returned. But in each case, there was something lacking, the element of
    conscious sharing, of deliberate reciprocity. Unilateral love seems unavoidable
    in human experience, but it seems incomplete, an imperfect version of reciprocal
    love, forced upon us by the inherent limitations of human nature.


    If there was a twelfth-century paradigm of interpersonal love, it was the Trinity.
    For within the Trinity, three persons loved one with another with such an intensity
    that they were one in substance and in nature. At the same time, each person retained
    his own individuality, complementing the individuality of the other two. It was
    a love in which each person was giving and taking, a perfect love uniting three
    faultless persons within a divine union of infinite and everlasting joy. The mystery
    of the Trinity, which seems so remote to modern man, was an expression of the
    mystery of love, which makes one out of many.


    But twelfth-century thinkers quarrelled constantly about the Trinity. Small wonder,
    then, that they could not agree on the nature of love when concrete, perfect mortals
    entered the relationship. They were looking for the kinds of unifying relationship
    appropriate for man, but the variables were too many. Their searches usually came
    to rest with some incomplete, imperfect version of interpersonal love, whether
    it be love between God and man, between man and woman, or between man and his
    fellow man.


    The reciprocal love between God and man was the special province of the monks.
    The reader who believes in the existence of a personal God will accept the possibility
    of interpersonal love between God and man. But even the atheist should not overlook
    the experience which Freud called “oceanic feeling,” the feeling of oneness with
    the totality of being. What is more, the attribution of personal characteristics
    to the fundamental principle of the universe is not necessarily foreign to the
    atheist who has experienced human love, for human lovers commonly attribute qualities
    to their beloveds which the beloveds do not obviously possess. After speaking
    of love among human beings, Erich Fromm says that “the religious form of love,
    that is called the love of God, is psychologically speaking, not different.” The
    monastic attempt to achieve the appropriate unifying relationship with God may
    then be instructive for the nonbeliever.


    The monk''s life was ordered to achieving and understanding interpersonal love
    with God. Like all men, he learned soon after birth in the struggle to survive,
    he was forced to play the unwilling mediator between the external universe and
    his internal instincts, of which seemed to propel him toward extinction. His Christian
    beliefs called upon him to transcend both and to seek an immaterial God. For what
    was man''s fundamental need? Life. What a fragile grip he had on that one precious
    possession! The tenuously living creature looked to God, the source of life, for
    sustenance, and God responded with the promise of eternal life. He manifested
    himself in the power and order and beauty of the universe; and as an even greater
    concession to human frailty, he became man and walked the earth. In the New Testament,
    the monk found God in human form curing the ill, feeding the hungry, raising the
    dead, and in a final dramatic victory over death, dying himself, only to rise
    again. Jesus'' ''humanity'', the monk found a human capable of understanding and
