    Works from antiquity: The Confessions of St. Augustine, trans. Edward Pusey (New
    York, 1949); St. Augustine’s City of God, trans. Marcus Dods (New York, 1950);
    Selected Letters of St. Jerome, ed. and trans. F. A. Wright (London and Cambridge,
    Mass., 1933); and Macrobius, Commentary on the Dream of Scipio, trans. William
    Harris Stahl (New York, 1952).


    Monastic authors: The Letters of St. Bernard of Clairvaux, trans. Bruno James
    (Chicago, 1953); Meditations of Guigo, Prior of the Charterhouse, trans. John
    Jolin (Milwaukee, 1951); Aired ofievaux, Mirror of Charity, trans. Geoffrey Webb
    and Adrian Walker (London, 1962). See also the memoirs of Guibert of Nogent, cited
    below. Two additional translations are The Book of Saint Bernard on the Love of
    God, trans. Edmund G. Gardner (New York, n. d. [1915]) and Alan''s De spirituale
    amicitia, trans. as Christian Friendship by C. H. Talbot (London, 1942).


    Couratly writes: Chrétien de Troyes, Arthurian Romances, trans. W. W. Swinton
    Bland (London and New York, 1965); Lays of Marie de France, trans. Eugene Mason
    (London and New York, 1963); Anthologies I have cited are Medieval Epics (New
    York, 1963), and Medieval Age, ed. Angel Flores (New York, 1963); Wilhelm''s book,
    Seven Troubadours, cited below, has a number of poems in translation.


    Authors whom I have associated with towns: Self and Society in Medieval France:
    The Memoirs of Guibert de Nogent, trans. C. C. Swinton Bland, ed., rev., and introd.
    by John F. Benton (New York and Evanston, 1970); Adam, a Religious Play of the
    Twelfth Century, trans. Edward Noble Stone (Seattle, 1926); Fabiaux, trans. Robert
