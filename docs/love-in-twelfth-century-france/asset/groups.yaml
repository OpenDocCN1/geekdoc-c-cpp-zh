    # LOVE IN TWELFTH-CENTURY FRANCE


    Augustine drew on his own experience and the Neoplatonic theories of a third-century
    Roman named Plotinus. Augustine had wandered from creed to seeking an intangible
    goal called happiness. He returned to Christianity believing he would find it
    through Christ, who was the way, the truth, and life. He recorded these adventures
    in his unprecedented autobiography, *The Confessions*, the first page of which
    bears its theme: "Our hearts are restless until they rest in Thee." Man''s love
    for God was not one of giving; it was rather that longing for the Good described
    by Plato and Plotinus, and its goal was union with the Good, now recognized by
    Augustine as the personal God revealed in Jesus. Man''s love for God was the desire
    for and the delight in the Good.


    The Christian who would love God, who would obtain himself from material distractions
    lest he be forced to confess like Augustine, "While turned from thee, the One
    Good, I lost myself among a multiplicity of things." Plotinus had expected the
    philosopher to lead a life of asceticism to facilitate the soul''s movement up
    the "chain of being." Augustine expected the same discipline of the Christian,
    and offered as a reward the final beatitude after death and even, perhaps, some
    foreshadowing of that beatitude in this life, the mystical experience of God.
    Paul had written with reserve of his own mystical experience:


    I know a man in Christ who fourteen years ago was caught up to the third heaven—whether
    in the body or out of the body I do not know, God knows. And I know that this
    man was caught into Paradise—whether in the body or out of the body I do not know,
    God knows—and he heard things that cannot be told, which man may not utter (II
    Cor. 12:2–4).


    This mystical communion was called contemplation throughout the middle ages. It
    was heaven anticipated on earth.


    When Augustine turned to the second great commandment, the love of neighbor was
    somewhat puzzled. His own experience was that human love was dangerous, for God
    one should love (desire and delight in) nothing but God. Friendship could be a
    source of sin, “while through an immoderate inclination towards the lowest order,
    the better and higher are forsaken. . . .” At first, he said that only God is
    to be loved for himself; other things are only to be used so that they bring one
    closer to God. Then, faced with the unavoidable requirement that love and not
    just “use” his neighbor, he developed the idea that creatures should be loved
    in proportion to their position in the hierarchy of existence. There was an order
    of love, *ordo amoris*; created goodness and beauty helped one’s mind to their
    creator. But, however, Augustine Augustine may have been in his own life, his
    theories did not readily incorporate love between humans in this world. One’s
    attention belonged to God, and one was diverted from that goal only because the
    gospels required man to tend to the physical and spiritual needs of one’s neighbor—a
    “giving” love akin to God’s love for man.


    Essentially the same view of Christian love is found in the works of Gregory the
    Great (d. 604), an author revered in the twelfth century only slightly less than
    Augustine. Gregory was a monk; and his writings helped define the monastic ideal,
    the highest Christian ideal from Gregory''s day until the thirteenth century.
    Like Augustine, Gregory saw love as the soul''s desire for and delight in God.
    Of contemplation, Gregory said, "When the mind tastes inward sweetness, it is
    on fire with love." The soul was purified and weaned away from worldly attachments
    by a life of asceticism and by the tribulations and temptations sent or allowed
    by God. The process began on earth was completed only in heaven.


    To Gregory, as Augustine, the requirement to love his neighbor mean to minister
    to his needs, and of course his spiritual needs came first. It was Gregory who
    took the paradoxical step of using monks, men missionaries to convert the world.
    He sent Augustine to a life of withdrawal from the world, as missionaries of Canterbury
    to England, and from the new monasteries founded there Benedictine monks some
    come back to the continent to convert the heathen Germans. During the entire middle
    ages, love of neighbor meant first of all his conversion to the Christian life,
    for conversion meant salvation, and no greater gift could be given.


    The love between God and man and between his neighbor clearly had nothing to do
    with erotic love. That was another matter, and it was a problem. The Christian
    legacy on sexual love was ambiguous. The twelfth-century reader might easily conclude
    from his sources that sexual love, marriage, women, and even matter itself were
    evil, but he might also discover, if he read more carefully, that such conclusions
    would be heretical.


    The disapproval of sexual love had several sources. The licentiousness of much
    Roman society were no doubt repelled. In any case, there was a strong tendency
    to asceticism founded in Stoicism and Neoplatonism and confirmed by the Bible.
    In Neoplatonism, especially, the soul reached its goal by moving “upward,” away
    from the body and its concerns. The New Testament seemed to recommend complete
    sexual abstinence. Jesus and his mother were believed to be virgins, and Jesus
    spoke somewhat obscurely of those “who have made themselves euns for the sake
    of the kingdom of heaven” (Matt. 19:12). Paul is quite explicit, and his first
    epistle to Corinthians is so basic for medieval thought that it should be quoted
    length:


    It is well for a man not to touch a woman. But because of fornication, each man
    should have his own wife and each woman her own husband. The husband should give
    his wife what is owed, and likewise the wife to her husband. For the wife should
    not rule over her husband. For the wife does not rule over her body, but the husband
    does. Likewise the wife does not rule over her body, but the husband does. I say
    this for your own benefit, not to lay any restraint upon you, but to promote good
    order and to secure your undivided devotion to the Lord (I Cor. 7:1–11).


    The meaning of these passages has much debated, especially since the Protestant
    Reformation, throughout the medieval centuries they were nearly always taken to
    be a divine call to celibate life. And later writers did not always preserve Paul’s
    moderate tone. The love of woman was the earthly attachment Augustine found most
    difficult to cast off, and he described his deliverance like this, “Now was my
    soul free from the biting cares of canvassing and getting, and weltering in filth,
    and scratching off the itch of lust.” Generations of monks read these words, just
    as they read of the temptations of St. Anthony, an Egyptian monk of the third
    and fourth centuries whom the devil tried to entrap by taking the form of a beautiful
    woman, who knew that the flesh lusted against the spirit, was often tempted to
    hate the body that strove to master, to suspect woman, the universal temptress,
    who first betrayed Adam and the human race and who continued to be a trap for
    the unwary Christian. In the New Testament, Paul had required women to cover their
    heads in church (I Cor. 11:5–15). St. Ambrose, the friend and counsellor of Augustine,
    explained:


    Since she is not the image of God a woman ought, therefore, to veil her head,
    to show herself subject. And since falsehood began through her, she ought to have
    this sign, that her head be not free, but covered with a veil of reverence for
    the bishop.... Because of the beginning of crime, she ought to appear subject
    before a bishop, since he is the vicar of the Lord, just as she would before a
    judge.


    The inheritance from antiquity, then, cast a cloud of suspicion over sexual love,
    over marriage, over women, and even over the body itself. On the other hand, one
    could not condemn matter and the body without being guilty of the Manichaean heresy,
    a heresy Augustine was at pains to repudiate. The Bible itself left little doubt
    that God had created

