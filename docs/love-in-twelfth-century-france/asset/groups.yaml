    they understood better than anyone else that the appropriate unifying relationship
    between persons was the elusive product of sustained effort, of the careful and
    determined engineering of all the resources of the human person.


    Like the monks, the courtly poets were authorities on reciprocal love between
    persons. Their understanding of the human person, male and female, made them no
    less contemptuous than the monks of the rapist’s animal lust and the seducer’s
    diabolical deception. But the poets went further. That man and woman should come
    together in sexual union was obvious to almost everyone. That they should bring
    children were equally obvious. That they should take pleasure in their union seems
    obvious now, but in the world of Christian ascetics, it was denied. Surely among
    the boldest thinkers of the century, the poets affirmed the value of shared erotic
    experience.


    ## THE VARIETIES OF LOVE


    What is more, they went beyond the simple fact of physical pleasure and explored
    the psychic currents of erotic love. The appropriate unifying relationship between
    a man and a woman was not merely attraction between two souls or between two bodies
    was a fluctuating current between two whole personalities. It was all lust to
