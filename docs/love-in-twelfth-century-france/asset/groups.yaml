    # CHAPTER ONE:


    # Introduction


    "GREAT is the force of love, wondrous is its strength. Many are the degrees of
    love, and great the differences among them. And who can worthily distinguish among
    them or even enumerate them? So speaks Richard of St. Victor, a twelfth-century
    cleric.¹ Whatever love is, it has aroused the curiosity of the men and women of
    Western civilization as has no other subject. Love is something people do or enjoy,
    something that happens to them, something they fall into. It is something people
    think about. Literature, art, and music are filled with themes of love. Psychiatrists,
    theologians, poets, scientists, nearly all have said that love is something good
    and necessary. But ancients and moderns alike have failed to agree about what
    love is really.

    The disagreement is not surprising. Like truth and beauty, love is one of the
    great intangibles. It cannot be'
  - '[PAGE 13]


    # LOVE IN TWELTH-CENTURY FRANCE


    measured, weighed, or analyzed into its chemical components. It reveals nothing
    in a spectrograph. But it is surprising that Western civilization, proud of its
    tradition of lucid rationality, has continued to tolerate a really deplorable
    laxity in the use of the term love.

    **Today a man can "love" his God, his country, his mother, his father, his wife,
    his work, his children, his neighbor''s wife, his sports car, his dog, and his
    bour-bon.** Some of these are expected to "love" him in return. The poverty of
    the English language seems to impose an impossible burden upon one little, four-letter
    "Anglo-Saxon"—a word of a kind usually noted for precision if not for delicacy.


    Unfortunately, the languages of twelfth-century France were no better. Unlike
    the educated American, the educated Frenchman of the twelfth century had at least
    two languages at his disposal, Latin and French. Twelfth-century writers learned
    their Latin from the pagan and Christian writers of ancient Rome and from the
    Vulgate Bible. They found the nouns *amor, dielectio, caritas* and the verbs *amare
    et diligere*, all meaning love. From these Latin words were derived the French
    *amour* (and its variants) and *charité*. One might have hoped that these rich
    resources, twelfth-century writers would have cleared up a little by carefully
    reserving each word for a certain kind of love. Unhappily, they did not. True,
    the Latin *caritas* was used only for a good love, usually Christian in character.
    True, the French *charité* had a similar usage, though it was already taking on
    the meaning of "charitable" service, alms-giving and the like. But


    2'
  - '[PAGE 14]


    # INTRODUCTION


    amor, dilectio, and amour could be used indiscriminately, for the love of God
    and of mammon alike.² A twelfth-century viscountess was said to comment that the
    love between man and wife and the love between lovers were two entirely different
    things and that “the ambiguous nature of the word” prevented their comparison.²
    Ambiguous it was then, and ambiguous it has remained.


    Still, twelfth France has a special attraction for the historian of love. Love
    then occupied the attention of thoughtful and creative men and women as it did
    in no other medieval century. Twelfth-century France was the scene of St. Bernard’s
    mystic love of God, of the tragic love affair of Heloiseise and Abelard, and of
    the new “romantic” love of troubadours and writers of romances. Consequently,
    the subject has richness and variety. At the same time, it is contained within
    manageable limits of time and space.


    The twelfth century was one of energy, growth, and ambition for all of Europe.
    As the century opened, Christendom was still exhilarated with the success of the
    knights of France in the first crusade. In 1099, they knelt in the blood of massaced
    Saracens and wept for joy. Jerusalem was theirs. Only a few years before, the
    men of Genoa and Pisa had driven the Moslems from Sardinia, and knights from Norman
    France had taken Sicily from the Moslems. Similarly, in Spain the frontiers of
    Islam were being pushed southward by Christian knights. Throughout the century,
    the sons and grandsons of the first crusaders came and went'
  - '[PAGE 15]


    ![](img/56fc5d09a6530017ed18a63962a8c685_15_0.png)


    France in the Twelfth Century. Map by Linton S. Thorn.'
  - '[PAGE 16]


    between Europe and the Holy Land, and in their wake followed merchants and pilgrims.
    Within Europe, the “medieval boom” was well under way with a growing population,
    increased agricultural production, and expanding commerce. Forests were being
    cleared and swamps drained to make way for new land towns. Settlers in these new
    lands founded the “new towns” of Europe: Villeneuve, Villanova, Neuburg. Technological
    innovations, like heavy, wheeled plows and watermills, made the labor of peasant
    farmers more fruitful, and nearly everyone profited from the increased wealth.
    Growing numbers of craftsmen and merchants were building cities, travelling the
    roads, and sailing the seas and rivers. A new society was developing, rooted in
    the rich resources of Europe, in new techniques for exploiting those resources,
    and in the organizing skills of medieval princes, clergy, and townsmen. The foundations
    of modern Europe were laid.


    “France” participated in these changes, but not in the sense that France was a
    clearly defined unit. In the twelfth century, it had neither today''s internal
    unity nor today''s sharp differences from neighboring areas. The kings of France
    claimed authority over an area almost equal to modern France, with the eastern
    boundary running from north to south, roughly along the Scheldt or Escaut, the
    upper Meuse, the Saône, and the Rhone. In practice, however, the king had no control
    over most of this kingdom. Chroniclers frequently called it “Gaul” and reserved
    the name “France” for the area around Paris. Besides political'
- md: '

    ## LOVE IN TWELFTH-CENTURY FRANCE


    divisions, the kingdom was also divided by sharp cultural differences, especially
    between north and south. The southern part spoke a dialect which gave the area
    its name, Languedoc, and it breathed the warm air of the Mediterranean. The north,
    the land of langue d''oil, looked to the Channel and the North Sea. The difference
    in frontiers, climate, and culture made Languedoc seem like foreign parts to a
    northerner. In mid-twelfth century, St. Bernard of Clairvaux could say of a heretic
    fled to the south that he had been "chased from France," so remote seemed Languedoc.


    The modern frontiers between France and her neighbors were anticipated in the
    twelfth century only by ill-defined zones. The pilgrim travelling from northern
    France to the shrine of St. James of Compostela in Spain would find the differences
    between Spain and southern France scarcely greater than the differences between
    the north and south of France itself. Visiting the tomb of St. Thomas Becket in
    England, he would find a kingdom ruled by a French prince, Henry II, and by a
    French aristocracy. To the east, the difference between French- and German-speaking
    peoples was already pronounced, but even here the frontier was not clear and was
    ignored by French and German nobles as they formed marital ties.


    The weakness of the kings of France means that there is no central government
    to give focus to the story of twelfth-century France. In 1100, Philip I could
    scarcely control the vicinity of Paris. His son Louis VI, wrote a chronicler,
    "suffered many things from the princes of France...who refused to do homage to
    him as was owing."^5 By 1200, Louis VI''s grandson Philip II was much more powerful,
    but it was still not yet clear that he was stronger than the other great princes
    of "Gaul." In France, as elsewhere, the nobles were engaged in a struggle first
    for survival, and then for wealth and power. They nibbled at their neighbors''
    lands; they formed sworn alliances with one neighbor to despoil another; they
    married their children hither and yon in elaborate gambles, hoping that the right
    pattern of births and deaths would bring several principalities into the lap of
    one of their descendants. The scope of this dynamic relationships can be suggested
    by the family relationships of Louis VII. His first wife was Eleanor, heiress
    of Aquitaine, who later married Henry II of England. The two daughters of his
    first marriage married the counts of Champagne and Blois. Louis VII married the
    daughter of the king of Castile and again had two daughters. One married the count
    of Pontieu, the other married first Henry the Younger, son of Henry II and Eleanor,
    and then the king of Hungary. Louis VII''s third wife bore him the future King
    Philip Augustus and a daughter who married the Byzantine emperor in Constantinople.
    The actual political results of these marriages are a tangle; the possible results
    are beyond imagining.


    Despite the divisions and complications, though, France did develop some political
    unity. By the end of the century, the Capetian king of France was on the verge
    of becoming the strongest ruler in Europe. Even more impressive, though, was the
    cultural preeminence France enjoyed in Europe.


    Around 1100, a poet in the north of France composed the Song of Roland, a heroic
    epic which embodied the ideals of the warriors of French courts, and transmitted
    them beyond the frontiers of France and, indeed, beyond the frontiers of the twelfth
    century. About the same time, in the south, Duke William IX of Aquitaine was composing
    the first known troubadour poetry, lyric love poems that were studied as art.
    About mid-century, the northern and southern traditions merged. The result was
    the romance, the eclectic product of the heroic chansons de geste, of the artful
    songs of troubadours, and of the increasingly leisurely and sophisticated courts
    which patronized the writers. Around 1170, the poet Chrétien de Troyes boasted
    that chivalry and learning, having deserted Greece and Rome, had to dwell in France.^6
    The boast still stands; in France, in the twelfth century, modern European literature
    was born.


    Although the religious houses and the schools of France did not set European styles
    with quite the same unquestioned supremacy at the aristocratic courts, France
    was still the intellectual and religious heart of Europe. In 1131, when Pope Innocent
    II consecrated a new abbot at the abbey of Morigny in northern France, two men
    among the onlookers already surpassed the pope himself in fame, Bernard of Clairvaux
    and Peter Abelard^7


    Bernard was the best-known representative of the religious revival already under
    way in Europe, but he was only one among many. The Burgundian monastery of Cluny,
    founded in 910, had been the first of the great reforming monasteries, but by
    1100, Cluny was too old—some thought, too comfortable. Other fervent avoided this
    dilemma by becoming canons regular (priests under a rule). They lived together
    in poverty, chastity, and obedience, but not in isolation. They saw around them
    a fluid society of growing towns, new peasant settlements, of traveling pilgrims,
    a society moving away from the monasteries. They went where the people were, to
    preach, to administer sacraments, found schools, to build hospices. As a famous
    monk, Bernard was something of an anomaly, for the monk should live in holy leisure,
    removed from the hustle and bustle of ordinary society. He himself contradicted
    the contradiction in his own "monstrous" life; he called himself a "chimera, neither
    cleric nor layman," who kept the habit of a monk but abandoned the life.^9


    When Bernard died in 1153, Cluny had daughter houses, including Clairvaux, and
    there were over 700 monks atvaux alone. Bernard''s contemporary, Peter the Venerable,
    abbot of Cluny, wrote, "What an enumerable crowd of monks our day! It has covered
    all the fields of Gaul; it filled the towns, the castles! How varied in custom
    and attire is this army of the Lord of Hosts!"^8


    ## INTRODUCTION


    As the century opened, most of the famous schools of Europe were in France: the
    Norman abbey of Bec, the cathedral schools of Rheims, Laon, Orléans, and Chartres.
    They were rivaled only by the abbey school of Monte Cassino, the law school in
    Bologna, and the medical school in Salerno. As the century closed, the various
    schools of Paris—Notre Dame, Ste. Geneviève, St.


    the stage was occupied by canons regular, of Premontré, of St. Victor, and of
    dozens of other houses. That day at the abbey of Morigny, the other famous man
    was Abelard, already at odds with Bernard. Bernard said of him, “We have in France
    one Peter Abelard, a monk without a rule, a prelate without responsibility, an
    abbot without discipline, who argues with boys and consorts with women.”10 There
    was some truth in each of these charges, they could not diminish Abelard’s skill
    or his fame. His early promise of becoming the most renowned logician and teacher
    in Christendom had been fulfilled. His affair with Heloise and subsequent castration
    nearly destroyed him, but students flocked to him, even when he retreated into
    the wilderness.


    Indeed, they flocked to dozens of masters in France, for the appetite for learning
    was insatiable in the twelfth century, and France came to the favorite feeding
    place of men like “Peter the Eater” (Petrus Comestor), who devoured books.

