    # LOVE IN TWELFTH-CENTURY FRANCE


    The place of love in twelfth-century life and literature has been the highly controversial
    subject of an enormous body of scholarly writing. The best introduction to the
    controversies over ''courtly love'' is the editor''s preface to The Meaning of
    Courtly Love, ed. N. Newman (Albany, 1968). This small volume contains excellent
    papers by distinguished scholars and a good bibliography. The most readable introduction
    to the love poetry itself is Maurice Valency, In Praise of Love (New York, 1958).
    The theory that there was a systematic set of beliefs which be called "courtly
    love" and which were set seriously by Andreas Capellanus has been spread by C.
    S. Lewis, The Allegory of Love (New York, 1958; first pub.1336) and Sidney Painter,
    French Chivalry (Ithaca, 1961, first pub.1940). This theory has been challenged
    by a number of scholars who consider Andreas'' intent to be satirical but who
    nevertheless differ considerably among them. The most important of these are Durant
    W. Robertson, A Preface to Chaucer (Princeton, 1963); E. Talbot Donaldson, "The
    Myth of Courtly Love," Ventures, 5, 2 (1965), 16-23), and Peter Dronke, European
    Love-Lyric, cited above.


    Life in the towns described in two works cited above, Holmes, Daily Living, and
    Luchaire, Social France. The reflections of Paris masters on moral problems facing
    town are presented in John W. Baldwin, Masters, and Merchants: The Social Views
    of Peter the Chanter and His Circle, 2 vols (Princeton, 1970); but one finds little
    on love in any of these volumes. For heresies, see Jeffrey Burton Russell, Dissent
    and Reform in the Early Middle Ages (Berkeley and Los Angeles, 1965).


    A good introduction to the intellectual life of the period is David Knowles, The
    Evolution of Medieval Thought (New York, 1964). For the attitudes of schoolmen
    toward sexuality'
