- md: '

    ## LOVE IN TWELFTH-CENTURY FRANCE


    men whose wealth and education challenged the position of the warrior class, they
    welcomed anything that set them apart from, and above, the pretentious commoners.
    Their horses, their weapons, their armor, their training made them knights, chevaliers.
    They were warriors who did not work; they owned their land and ruled over men;
    they would have their own style of life to reinforce their claim to superiority,
    a claim not yet securely fortified by hereditary legal privileges.


    Why poetry should have become part of this “courtesy” has puzzled scholars for
    many years. Some have found the origins of troubadour love-poetry in the literary
    influences coming from Ovid, from Spain, or from the language of love used by
    Christian monks. Others have stressed the social and psychological causes: the
    influence of women in the court (especially with men away for crusades or other
    wars), the high ratio of men to women in the courts, the psychological immaturity
    of the troubadours, or the ambivalent state of all men, who see in women both
    the all-powerful, life-giving mother of their childhood and the small, weak dependent
    of their manhood. Others have found connections between some of the heresies of
    the twelfth and thirteenth centuries and troubadour love-poetry. For the purposes
    of this book, however, the troublesome courtly love and the scholarly debates
    about it are best avoided. For whatever reason, there was in the courts of twelfth-century
    France a new interest in love, and that interest gave a new direction to European
    life and literature.


    The love songs of the troubadours present no well-defined set of ideas which can
    be neatly labeled “courtly love.” They contain, rather, a “spectrum of attitudes.”⁶
    Some of these attitudes became conventions, not universally accepted but certainly
    very common, which can be set forth rather simply. The most familiar convention
    is the suppliant knight “courting” an idealized lady. The lady is beautiful and
    desirable, the poet speaks to her as a humble knight, offering his services to
    her as a vassal to his lord or as a man to his God. His love for her makes him
    a faithful lover and a better knight, one who will brave all dangers for her,
    but one who is at the same time made humble and gentle in supplication. The love
    of the troubadour is mainly a love of desire, not consummation. The mood shifts
    from the joy the beloved inspires in him to the sorrow he feels because he does
    not possess her. He wants to win freely love, but his song usually stops short
    of his receiving it. The concluding mood may be hopeful anticipation and mournful
    longing, but it is rarely satisfaction.


    Examples of these conventions, grown more complex since the time of Count William,
    can be seen in this song of Bernart de Vantador, a troubadour patronized by Eleanor
    of Aquitaine herself in mid-century:


    > Singing is not worth a thing

    > if the heart sings not the song, and the heart can never sing

    > it brings not along.


    87


    Thus my song never can go wrong,

    for I to love''s use have assigned

    my heart, my eyes, my mouth and mind.

    I would not have gain from God the power

    to escape my love''s disdain,

    and if I had no good of her,

    but every day she brought me pain,

    and I would gain much more content

    from my pure heart than from lament.


