    # LOVE IN TWELFTH-CENTURY FRANCE


    2 In 1122, the townmen of Tours rebelled against the cathedral canons and burned
    the church and the castle.3 In 1147, the abbot of St. Peter''s abbey in Sens succeeded
    in having the townmen''s commune revoked and they killed him for it.4 In 1155,
    it was the townmen of Vézelay against the abbot and monks of the town.5 Local
    nobles and the king were frequently involved on one side or the other. Sometimes
    the townmen succeeded, sometimes not, but they usually paid dearly in blood and
    silver.


    What did love mean to these people? We know that prostitution flourished in the
    towns. But we can only guess that many men and women grew in natural affection
    as they raised their families and moved through their daily routines, that the
    townmen had their friends, and that perhaps they were especially close when conflict
    forced upon them a camaraderie akin to that which bound knights together. We know
    that they were familiar with the basic beliefs of Christianity. They learned them
    from the clergy, but also from the windows and statuary, those mute sermons that
    decorated their churches. On the steps of the churches, they plays Adam, which
    tells Adam and Eve to love each other, and Adam tells Satan how he loves and fears
    God.6 They understood the obvious requirements of Christian love. Hospitals and
    leprosaries multiplied in the twelfth century, thanks to the generosity of townmen
    as well as of nobles. The townmen took religion seriously, so seriously that many
    were willing to risk their lives and property by associating themselves with the
    ill-defined heresies lumped together under the the term Catharism. These heresies
    were most common in the south, but they could be found all the way to the Rhine
    and beyond.


    Townmens apparently entertained mixed feelings about women. They built churches
    in honor of “Our Lady,” but on a more practical level, they were little inclined
    to idealize love or women. Anyone who saw the play heard first husband bitterly
    reproach Eve for misleading him. In the fabliaux, rather crude stories relished
    by townmens, women are commonly portrayed as self-serving and deceitful. The Wife
    of Orleans, for example, was probably known in the twelfth century. This wife
    of a merchant of Orleans has a young scholar for a lover. The husband grows suspicious,
    tells his wife he is going on a trip, but returns at night disguised as her lover.
    She sees through his husband find him. She then tells the servants to defend their
    master''s honor from the rogue upstairs, and while they are, and while they are
    thrashing him and throwing him on a trash heap, she sees her rendezvous with her
    lover. The next day, the bruised husband comes home well content that his wife
    is an utterly faithful woman who knows how to handle young lechers. The tale is
    typical in that townsman is victimized by a self-indulgent cleric and by an unfaithful
    woman.


    Whereas the townmens have left us little about their thoughts on love, the scholars
    who lived among them have left us a great deal. In most centuries, the intelligentsia''s
    mastery of the written word gives them a disproportionately large role in later
    histories. We know what they read, what they wrote, and even some of what they
    thought in their private moments.


    In the early twelfth century, urban schools replaced monastic schools as the main
    centers of education. The students who taught them were rudimentary as clergy,
    but their interests were much more varied than those of the monks, whose only
    real business was the internal ascent to God. The students who flocked to the
    schools provided by bishops and by chapters of canons planned to be men of affairs
    and men of learning, a combination much common among clergy in the twelfth century
    than the recent past. The students, the teachers, and the alumni who became abbots,
    bishops, popes, and secular ecclesiastical princes formed a special intelligentsia
    within twelfth-century France. Drawn from all social classes, they were one in
    Latin learning, in their celibacy, and in their sacred orders.


    Most of the urban schools remain unknown, but some became famous, usually through
    the presence of a respected master. In the Loire valley, Tours and Orleans were
    distinguished for their schools. The cathedral school of Chartres was blessed
    with at least one outstanding master, Bernard of Chartres. To the northeast, Anselm
    had already brought fame to Laon when the rebellious townsmen burned down their
    cathedral in 1115. His student William of Champeauxaux attracted other students
    to Paris. One of those students, the brilliant young Abelard, so humiliated his
    master that William retired to a monastery. William''s withdrawal from the world
    is suspect since the monastery he founded for the occasion, St. Victor''s, was
    right outside the walls of Paris, and since he stayed there only a few years,
    but the incident laid the foundation for the greatness of Paris. In 1115, Hugh
    came at St. Victor, and together with Abelard, who taught at the chapter school
    of Ste. Geneieve and at the cathedral school of Notre Dame, he made Paris the
    intellectual center of Europe. Hugh of St. Victor died in 1141, Abelard in 1142,
    and a chronicler mourned the passing of “these two lights among the Latins.”^8


    Like the monastic schools studies, for the study of creation revealed the art
    of the creator. Whereas the monastic schools taught what was needed for the personal
    ascent to God, the urban schools made intellectual inquiry a way of life, and
    they sought to include all knowledge in their inquiries. "Learn everything, Like
    the monks, the urban scholars learned from the ancients, but they were more deferential.
    Their thought was always based on faith, but they were more aggressive in dealing
    with the Bible, the Fathers, and the ancient pagans. They put questions to the
    ancients, they rearranged the texts, they tested one authority against another.
    Their reliance on antiquity as well as their new-confidence can be seen in the
    famous statement of Bernard of Chartres, who said that he and his contemporaries
    had seen nothing further than dwarfs sitting on the shoulders of giants. The monks
    sat at the feet of the ancients; the schoolmen sat on their shoulders. The learning
    of the urban schools was, then, more comprehensive than that of the monasteries,
    it was pursued more systematically and aggressively, and it was more commonly
    treated as an end in itself. When the century was over, the schoolmen had added
    little that was new, but they had performed the task at hand: mastering the legacy
    from the past.


    The schoolmen learned much from the methods of lawyers. For centuries, students
    of canon law (church law) had been compiling collections of papal announcements,
    conciliar decrees, statements of the Fathers, and the like. From the ninth century
    on, the collections were usually organized topologically, with the clear implication
    that authorities that seemed to disagree on a given topic needed to be interpreted
    and reconciled. Theological and legal questions were intermingled, and when twelfth-century
    theologians and philosophers put together their Sentences, or summaries of knowledge,
    they borrowed freely from the substance and the style of the legal writers. Abelard
    dramatized the usefulness of logic in reconciling the opinions of ancients by
    compiling a list of questions and quoting authorities that seemed to take opposing
    sides on each question. The need of reconciliation was obvious, and the next step
    was taken by Peter Lombard in his Sentences, a comprehensive and systematic survey
    of existing theological knowledge, in which the author used logic to interpret
