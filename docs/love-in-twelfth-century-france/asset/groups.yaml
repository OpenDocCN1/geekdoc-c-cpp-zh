    ## LOVE IN TWELFTH-CENTURY FRANCE


    through Joseph just as Cicero had spoken through Laelius. Like Cicero, Cassian
    saw virtue as the source of friendship, but the Christian monk, writing for a
    monastic audience, necessarily meant something different. Unlike Cicero, and even
    unlike Ambrose and Jerome, Cassian was writing for men who could not choose their
    friends. Having decided to live out their days within monastic walls, they had
    to live in accord with a small circle of men whose nature and habit had shaped
    quite differently. Consequently, Cassian adjusted the proposition that friendship
    was based on likeness in virtue so that it meant: likeness in virtue would inevitably
    bring about friendship. If all the monks were alike in virtue, friendship, with
    its “oneness of will,” would guarantee concord and peace to the monastery. Cassian
    warned, “Peace can never be preserved where there is diversity of wills.”12 Likeness
    in virtue for such a heterogeneous group would have struck Cicero impossible,
    but for the Christian Cassian, virtue was the product of nature but by God’s grace
    and the persistent effort of the monk. If the monks wished to have the peace provided
    by friendship, let each one contain the goods of this world, commonly the source
    of dissension; let him subordinate his will to the discipline of the monastery,
    so that he be less fond of his own ways of doing things and more adaptable to
    the ways of his brothers; let him put love and peace before all else; let him
    never succumb to anger himself and let him do all he can to dispel the anger conceived
    against him by his brother; let him distrust his judgment and place his trust
    in the older monks; and let him ever remember that he is each day migrating from
    this world to the next.


    Friendship, as described by Cassian, is primarily peace and concord. There is
    little in his treatise to suggest the personal intimacy, the pleasure of a friend’s
    company, found in Cicero and Ambrose. Cassian would, if true, allow a monk to
    extend greater affection to one to another (while still loving all), but only
    on the basis of “merit.” Individual tastes, inclinations, obstacles were, rather
    than the bases of friendship, and were to be obliterated by uniform adherence
    to the rule.


    In practice, Cassian may have shown greater warmth and affection than his theories
    suggest. But, like Augustine found any concern for his fellow a distraction from
    what was more important:


    > Who can with tranquil gaze upon the glorious majesty of God while engaged in
    works of charity? Who can contemplate the immeasurable blessedness of heaven at
    that very moment when he is ministering to the poor, when he is welcoming visitors
    with gracious hospitality, when he is concerned with caring for the needs of brethren?¹³


    Most of the early Christians balance their praise for human love with this wariness
    of earthly attachments, perhaps unable to forget the evangelical warning, “He
    who loves father or mother more than me is not worthy of me” (Matt. 10:37–38).


    The legacy from Christian Romans, then, contained some ideas on love which were
    similar to pagan ideas, and some which were quite different.


    ## LOVE IN TWELFTH-CENTURY FRANCE


    The Christian love for God was similar to the pagan love for the Good. Christian
    suspicions of sexual love, even in marriage, were derived in part from pagan philosophies,
    and Christians condemning Roman licentiousness echoed their pagan countrymen.
    The Christian spectrum included some acceptance of sexual love and a somewhat
    more generous acceptance of Ciceronian friendship.


    On the other hand, Christianity introduced entirely new ideas into the pagan world.
    First of all, the Christian God was, apart from his goodness, radically different
    from the Good of Plato and Plotinus. He was a God of three persons, who loved
    one another without losing their divine unity. He was a personal and loving God
    who intervened in human life through his “grace.” The central intervention was
    the Incarnation, God become man, an intervention which would enable man to reach
    his “supernatural” goal. There is none of this notion of a loving God in the pagans.


    Secondly, the Christian commandment to love was something new. For the pagan,
    love was the spontaneous reaction of the noble soul when brought into the presence
    of something good or beautiful, or else the equally spontaneous sexual desire
    for the sexually desirable. For the Christian, the spontaneous reactions of a
    fallen nature were not to be trusted. For him, the commandment to love meant that
    man was free to love or not, and it required him to exert himself rather than
    wait for spontaneous movements of love. Gregory the Great described the difficult
    stages through which the soul went under in achieving love of God: “Whoever has
    already subdued the insolencies of the flesh in himself, has this task left him,
    to discipline his mind by the exercises of holy working; and whosoever opens his
    mind in holy works, has over and above to extend it to the secret pursuits of
    inward contemplation.”¹⁴


