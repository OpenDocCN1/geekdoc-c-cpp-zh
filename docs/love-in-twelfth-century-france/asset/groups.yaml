    It made love an impersonal and unilateral benevolence, uncomplicated by personal
    interactions. And the practice of avoiding other human beings as much as possible
    made it all easier to be impersonal and benevolent. One merely prayed for all
    mankind.


    Most others, though, struggled with the problem without resolving it, for it cannot
    really be resolved. Unilateral love—wishing others well, preaching the gospel,
    giving alps to the poor, protecting widows and orphans—was praised by all as the
    most obvious way to love only unilateral benevolence. After all, the good Samaritan
    had shown only unilateral benevolence. According to the parable, he looked after
    the man who had been beaten without much as asking his name. But even this form
    of love of neighbor distracted from thinking about God. When Martha complained
    that her sister neglected her work of serving others to sit at the feet of Jesus,
    Jesus said, “Martha, Martha, you are anxious and troubled about many things; one
    thing is needful. Mary has chosen the best part, which shall not be taken away
    from her” (Luke 10:41–42). Twelfth did not resolve the dilemma of Mary and Martha.
    Bernard himself left the cloister to look after the needs of Christendom but then
