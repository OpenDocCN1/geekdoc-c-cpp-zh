    # LOVE IN TWELFTH-CENTURY FRANCE


    schoolmen were also vulnerable to the occupational hazard of their craft: an insensitivity
    to experience, an inattentive neglect of empirical data. They reclaimed the wisdom
    of antiquity, they analyzed it and restructured it into elaborate and comprehensive
    explanations of God and his universe, but they added little of substance. They
    were not as responsive to the quiet movements of the soul as were the monks or
    to the powerful erotic passions of the heart as the courtly writers. Neglecting
    experience, they did not understand as well as others such things as the mutuality
    of love, the growth of love through successive stages, and the value of erotic
    love.


    Mutual love was certainly not an unfamiliar idea to the schoolmen. Friendship.
    They knew well the ancient treatises on friendship. It was a favorite subject
    for schoolroom exercises in poetry and letter-writing. But against this distracted
    twelfth-century scholars from the reciprocal character of friendship, as they
    just had distracted Cassian centuries before. The Christian distrust of erotic
    love, for example, was frequently at the heart of their praise of friendship.
    The clerical scholars contrasted friendship with *seevus amor*, violent and passionate
    love. The main value of friendship for these men was that it was rational and
    pure of erotic passion.


    Perhaps even more subtly eroding the value of mutual love was the Christian emphasis
    on disinterested love. Peter Abelard argued that a Christian should love God without
    any hope or expectation of being rewarded or loved in return. The value of love'
