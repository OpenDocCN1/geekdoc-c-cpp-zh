    it. Perhaps the best that we can do this: love is a unifying relationship which
    is appropriate to the things being united.


    This definition would need needing defending before any western audience, be it
    twelfth-century or twentieth, since we are accustomed to thinking of love as something
    existing within an individual—an instinct, an emotion, an attitude—rather than
    a relationship. Moreover, we commonly and conveniently use love for any one of
    the emotions associated with the unifying relationship which is love itself. But
    benevolence, joy, jealousy, tranquility, and anxiety are all attendant to love.
    No one of them is essential. Love itself is the relationship, begun when the lover
    first becomes aware of the beloved and progressing through the many forms and
    degrees experienced by lovers. I love someone in love when I enter into this relationship;
    I grow in love when the unifying relationship becomes deeper and stronger.


    The definition will also seem odd to many objects because it can be applied to
    inanimate objects. But there have many western thinkers who have thought of love
    in this-inclusive way. The solar system, the wolfpack, and the atom find their
    appropriate unifying relationships spontaneously, without thought or consternation.
    These patterns of unifying relationships were called love by Boethius. The theme
    was confirmed by the ninth-century philosopher Scotus Eriigena: “Love is the connection
    and bond by which the totality of all things is joined together in ineffable friendship
    and in indissoluble unity."1 It was adopted by some of the schoolmen of the twelfth
    century. It has made its way into the twentieth century in the works of Sigmund
    Freud, who identified Eros as the power that "holds together everything in the
    world."2


    But ordinarily, when we speak of love, and here the question becomes much more
    difficult. What is the unifying relationship appropriate for man? The presence
    of man eliminates the simple determinism which seems to rule the universe, and
    introduces the possibility of moral freedom, of intelligent choice. Unlike atomic
    particles and protozoa, man is faced with a wide range of possible relationships,
    and man''s experience tells him that the unifying relationships appropriate for
    himself and his fellow man are discovered, realized, and preserved only with the
    greatest difficulty.


    Simple spontaneity serves nature well, but not man. Nature can afford to be indifferent
    to the survival of individuals and sometimes even of a whole species, for she
    will never exhaust her many forms of life. Seingly without thought, she creates
    an infinite variety of organisms, or ill-equipped to survive, ends them with an
    excess of reproductive energy, and leaves them indifferently to survive or die.
    But man resists. Individually and collectively, man refuses to be merely one form
    of life thrown out and then forgotten by the prodigality of nature. From the very
    beginning, man learned he must distrust the instincts given him by nature. The
    Judeo-Christian Adam and the Freudian primal father discovered alike that the


    # THE VARIETIES OF LOVE


    man who indulges his taste for pleasure without restraint suffers death as a consequence.
    From cradle to grave, he either controls his instincts or suffers the penalties
    inflicted by parents, society, and the universe. In order to survive, a man needs
    society; therefore, his pursuit of pleasure must be regulated, so that his infringe
    upon another’s. Siblings compete with each other and with their father for their
    mother''s attention; rival suitors compete for their beloved''s affection; everyone
    competes for wealth, which brings pleasure and security. If men and women did
    not agree to master and regulate these competing instincts, they would destroy
    their society and themselves. Those incapable of accepting restraint are destroyed
    or imprisoned by society for its own protection.


    Furthermore, the peculiarity of man is that his self and therefore the relationships
    appropriate to himself are never static. They are always changing and fraught
    with discord, for within man and within human society, the winds blow one way
    and then another, creating instability, tension, and conflict. Are the winds the
    flesh versus the spirit, the devil versus God, original sin versus divine grace,
    good versus evil? Are the libido versus the super-ego, the life-instinct versus
    the death-instinct? Whatever they are, man alone must understand the physical,
    biological, and psychic forces operating within himself and within others and
    must devise and achieve the appropriate unifying relationships. Only for man had
    hatred and moral evil exist. Only for man is love so difficult.


    # LOVE IN TWELFTH-CENTURY FRANCE


    So, what kind of relationships are appropriate to man? They must be based on what
    he is. He needs food, clothing, and shelter. The species must continue, so there
    must be reproduction. The young must be taught through a process much longer than
    the education of any other creature. Within the few years of childhood, young
    humans must learn the contents of a culture which has been millennia in the making.
    As they grow older, human beings must cooperate in larger and larger groups, in
    social and political patterns of great complexity. At the same time, their bisexualuality
    leads them to pair off not only for reproduction, but for the physical and psychic
    satisfaction derived from the complementary nature of the sexes.


    Man’s needs go beyond this simple list. Man must understand himself. He is conscious
    that he exists in time and space—once he did not exist and that one day he will
    die. He does not accept these facts easily in thought or in feeling; he must look
    further to find some wider significance for his momentary existence. Perhaps this
    is the root of man’s desire for love and knowledge: his existence is extended
    through other parts of reality, it is confirmed through the knowledge of those
    relationships. In any case, the unifying relationships appropriate for man must
    include his need to understand.


    Moreover, man needs to play. One student of this need, Roger Caillois, has listed
    the four “principles of play” as competition, chance, simulation, and “vertigo."³
    Hence, relationships appropriate to man must enable him to indulge with control
    his taste for comme


    # THE VARIETIES OF LOVE


    tition, for gambling, for mimicry, and for vertigo. Small wonder, then, that love
    means so many things. How varied are the judgments about what is not!


    Certainly, the simplest form of love for man is that between himself and matter.
    For some twelfth-century people, Albigensians or Cathari, all matter was evil.
    It could not be loved; there could be no unifying relationship. For the monk,
    food, drink, and comfort were useful from his home. The world was there for the
    well-being of man; to all agreed. There was merely divergence over the kind of
    well-being to be pursued, whether it be survival, pleasure—or salvation—or, most
    often, some mixture. In more sensitive hearts, the material universe was there
    not only to be used, but to be revered. They believed that in the beauty and order
    of creation one could discern the beauty and order of the creator. This belief
    could be formulated by philosophers, or it could be the more intuitive judgment
    of a man like Saint


    Bruno, founder of the Carthusians, who spoke of "the plain stretching grandly
    between the mountains, the green fields and flowering pastures, the gently rising
    line of hills, and the retreats of hidden valleys."


    More difficult, though, was the love between persons. The commandments to God
    above all things and one''s neighbor as oneself placed the love between persons
    on another level, a more complex level. One could not use God nor fellow-humans
    as one used an object. Another person was equal to oneself in rationality, in
    freedom, in self-consciousness, and in immortality. Even love between God and
    man was based on a kind of quality. St. Bernard wrote, "Of all the movements,
    feelings, and affections of the soul, love alone enables the creator to answer
    his question, responding to him, if not equally, at least in kind."


    The kind of love most suited to two persons can be called reciprocal interpersonal
    love, while its less perfect and less complete form can be called unilateral interpersonal
    love. Reciprocal love is a relationship of mutual benevolence and desire between
    two persons. In this relationship, each person finds pleasure in showing himself
    benevolence toward the other, and each desires and enjoys the benevolence of the
    other toward himself. In brief, interpersonal love requires giving and taking
    on the part of both.

