    Pagan antiquity provided a notion of love of quite a different sort, called philia
    in Greek, amicitia in Latin, and commonly translated as friendship in English.
    The subject was first treated extensively by Aristotle in the Nicomachean Ethics
    (books 8 and 9), but that work was not known in Western Europe until the thirteenth
    century. Aristotle''s ideas made their way into the twelfth century via Cicero''s
    dialogue On Friendship, a favorite of medieval readers.


    Speaking through Laelius, the principal character of the dialogue, Cicero makes
    clear that friends show none of the blind irrationality of passionate lovers and
    none of the selfish deceit of calculating seducers. Friendship is based on the
