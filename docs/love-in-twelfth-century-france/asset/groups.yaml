  - '[PAGE 163]


    having done so. Conversely, he discouraged the archbishop of York from becoming
    a monk because he would thereby deprive his archdiocese of his loving care.¹10


    The problem was to find a balance among the different kinds of love. Each man
    should achieve reciprocal love with God. He could hope to achieve reciprocal love
    with a few friends, but certainly not with the vast majority of fellow men. He
    could achieve an erotic interpersonal love with one woman. But if there were more,
    love was shallow and transitory. He could try to extend unilateral love to all
    mankind, but in practice the very demands of love in the service of some required
    him to turn his back on others. The limitations of human nature required man to
    choose among or balance all these needs and obligations, to accept the tension
    among them, to try to maintain some kind of equilibrium, and to live with the
    inadequacy of his efforts.


    This equilibrium—the schoolmen would call it “ordered love”—was not maintained
    perfectly by anyone, and the thinkers of the day were quick to point out the imbalances
    in the love-lives of others. Preachers condemned the imbalance as sin and satirists
    laughed at it as folly. Personal lust was condemned by monks and schoolmen as
    unworthy of man and offensive to God. The poets distinguished reciprocal erotic
    love from impersonal lust, which they too considered inordinate. Andreas Capellanus
    ridiculed the hypocrisy of courtiers who pretended to seek true interpersonal
    erotic love (“pure love”) but who were in


    152'
  - '[PAGE 164]


    fact playing the game of seduction, but he was equally sardonic in presenting
    the unbalanced and misogynous ravings of other worldly clerics and monks. Others
    told the ribald stories in which women and clerics abandoned the forms of love
    to which they had pledged themselves for the sake of avarice, lust, and hypocrisy.
    The failures of twelfth-century lovers were well known at the time.


    No one in the twelfth century achieved the equilibrium in practice; no one achieved
    it in theory. That is to say, no one put together the ideas of contemporaries
    into a comprehensive theory of love, incorporating all its forms, and no one realized
    in his own life a perfect balance of the demands of nature and of God. For that
    failure we can blame in part the strong traditions, derived mainly from Plato
    and St. Paul, which sharply divided the human being into body and soul. No theory
    based on those traditions could be completely true to human experience. We can
    blame in part the tradition of thinking of love as an individual act independent
    of the beloved. But we must also blame the inherent limitations of human nature,
    limitations as restrictive today as they were then.


    Of course, people could pretend that the limitations were not there. Some fastened
    on only one of the competing demands of reality as though it were everything.
    The courtly poets who spoke only of incipient erotic love, one could indulge in
    a "truancy, alike from vulgar common sense and from the ten commandments,"¹ but
    it was hard to sustain that kind of myopia. A remarkable number of troubadours
    ended'
  - '[PAGE 165]


    their days in monasteries.¹12 Many others no doubt took the broad view by deluded
    themselves into thinking that they had achieved the equilibrium, that they had
    in fact met the requirements of human nature and of the gospel. They were the
    complacent, selfrighteous. Others placed themselves above the problem, playing
    the role of the witty cynic. They did not pursue love because there was no love
    to pursue; it was merely a ruse for obtaining more tangible benefits, money or
    sexual pleasure. The cynic and the hypocrite will view each other with contempt,
    but they are one in their self-righteousness.


    The best of twelfth-century people struggled after love and met success and failure
    intermixed. Like modern man''s, their achievements were limited by the narrowness
    of their understanding, by the inconstancy of their spirits, by the harsh demands
    of a society seeking its own survival, by the vagaries of fortune. Whatever love
    they experienced was bittersweet, because it always fell short of love in its
    perfection, love in which all things would find their appropriate unifying relationships,
    in which God and man, and woman, man and fellow-man would realize a warm and deep
    everlasting communion. The vision of that love was described by Hugh of St Victor,
    speaking of the love which God offered man:


    That love is unique but not private, alone but not isolated, shared but not divided,
    both communal and individual, a singular love of all and a total love of each,
    not decreased by sharing nor diminished by use; not aging in time, ever old, ever
    new; desirable


