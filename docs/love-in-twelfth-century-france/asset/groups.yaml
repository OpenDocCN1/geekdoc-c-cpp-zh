    Europe, the best poetry soon being written in Italy. And even among the poets
    and their audiences, a growing cynicism seemed to tarnish the first vision of
    love. Guillaume de Lorris began the *Romance of the Rose* in the first part of
    the thirteenth century; it was an allegorical poem on love.


