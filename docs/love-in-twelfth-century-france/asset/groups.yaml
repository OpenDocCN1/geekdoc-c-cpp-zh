    他是12和13世纪异教古代最受欢迎的诗人，一些学者将这一时代称为“奥维德时代”。他的作品有时被赋予奇异的寓言和神秘主义解释，使得这位描写罗马式淫乱的诗人成为了基督教道德的无意识发声人，但无疑地，他也因其自身的本色而受到赞赏。无论如何，他在十二世纪被教皇、诗人、圣徒和学者所引用。


    异教古代提供了一种完全不同的爱概念，在希腊语中称为 *philia*，拉丁语中称为 *amicitia*，在英语中通常翻译为 friendship（友谊）。这一主题最早由亚里士多德在《尼各马德伦伦学》（第8、9卷）中详细探讨，但该著作直到13世纪才在西欧为人知。亚里士多德的思想通过西塞罗的《友谊》（中世纪读者的喜爱）进入十二世纪。


    西塞罗通过对话的主角拉埃留斯明确表示，朋友之间既没有狂热恋人那种盲目的非理性，也没有精明诱惑者的自私欺诈。友谊基于两个朋友之间美德的相互认可，除了爱本身不寻求任何回报。友谊是“凡事中人类与神的和谐，以及善意与情感”（6.20）；它的效果是“使一个灵魂变成多个”（25.92）。它既稀有又珍贵。它只能存在于品德且性格和趣味相似的人之间，当然，没有常见的组合。但由于友谊超越了美德本身，“我们应该一直寻找我们将爱的人以及那些报答我们的人”（27.104）。


    全程，西塞罗确实提到了女性。亚里士多德曾允许夫妻之间可能存在友谊（《尼各马德伦伦学》8.12），但如果这种友谊在本质上劣于男性，那么它必然是一种低等的友谊。西塞罗甚至没有提到这种可能性，而是提出了一种由色欲维持的男性化美德。因此，关于友谊的思想对于一群禁欲男性的基督教知识分子来说极其契合，这并不奇怪。


    最后，十二世纪的学者如果观察得足够仔细，就能在他的异教作者的作品中发现另一种、更全面的爱的神化。一些古人认为爱包含的内容远超人与人的关系。他们将其视为一种解释宇宙运行的巨大宇宙力量。有些人强调爱的生殖能力，它是宇宙的生命力。史前时期将性能量与生命之源（体现在母神和丰产仪式中）联系在一起的传统，在女神和仪式被正式废弃后，这种联系依然留存。在十二世纪法国所读的多个异教作者作品中，金星被描述为“万代之母”。


