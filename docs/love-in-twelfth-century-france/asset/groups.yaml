    to conquer Alis, when word reaches them dead. Cligés and Fenice return to Constantinople,
    are married, and are crowned emperor and empress.


    His mistress has made his wife, but he still calls her mistress and sweetheart,
    and she can complain of no loss of affection, for he loves her still as his mistress,
    and she loves him, too, as a lady ought to love her lover. And each day saw their
    love grow stronger: he never doubted her, nor did she blame him for anything (p.
    178).


    The love poets had very little to say about the growth of consumated love. It
    should surely endure, like the love of Cligés and Fenice, but Chrétien can say
    no more than that love “grew stronger.” He might have learned from the monks about
    the stages of love, about the gradual process of mutual self-revelation, the erosion
    of selfishness for the sake of the other. The lovers in the poetry do not consummate
    their love, or if they do, the story is over. Like the monks, the poets tried
    to understand the experience of loving, but, like them, they excluded conjugal
    love, the love which begins rather than ends with sexual union. Like the monks,
    however, the poets should be remembered for what they did as well as for what
    they did not do.


    The poets of the courts shared an insight which they expressed and preserved,
    that the passion-love that draws man and woman together in a union of heart and
    mind, of body and soul, is a thing of value. The notion seems obvious now, but
    if it was mentioned at all in Christian Europe before the twelfth century, it
    was fairly rejected. The ascetic tradition of the monks left no room for erotic
    love. Sexual union was necessary for offspring, but sexual pleasure was lust.
    No matter whether erotic desire and pleasure were part of an enduring union or
    the distraction of a momentary passion; they were still lust. On the other hand,
    the warriors of France had used women for their ambitions and for their pleasure,
    but they had not been much inclined to value the love of one particular woman
    as an ennobling thing.


    The love poets were fascinated by incipient love, that psychic disruption seemed
    at once akin to madness and to saintliness, which brought both joy and sorrow
    to the lover, which inspired in him both passion and reverence, which bestowed
    upon unbounded desire and the will to restrain it. They tried to make a place
    for the love of man and woman amid the values of the day, to shelter gentle, sensitive,
    and faithful sexual love from the asceticism of the monks and from the ambition
    and brutal sensuality of the knights.


    The poets had some success. Certainly the women welcomed ideas which raised them
    to be the equal or even the superior of their knightly lovers and “vassals.” Some
    men as well accepted the ideals and made them the sign of an inner aristocracy,
    one whose status was derived not from birth or wealth, but from a noble heart.
    And the literary conventions certainly flourished, moving from French literature
    into German, Spanish, English, and Italian. The insight of the twelfth-century
    love poets has been preserved and elaborated in the literature of every European
    language, in every century since then.


    But the magic of the poets had its limits. Whatever place love between man and
    woman had found in European literature, it would have little room in the religious
    and social realities of Europe for a long time to come. The ascetic tradition
    did not waver, and the use of marriage as an instrument for conveying wealth and
    power, rather than love, continued. Love certainly did not displace war as the
    main interest of the aristocrats, and even the poets sometimes laughed at their
    own idealization of love. Rambbaut of Orange wrote:


    - O would you gain a woman-prize?

    - O would you gain the pretty pieces?

    - Put menaces in your replies

    When they''re discourteous. Be wise,

    If their impudence increases,

    Then quickly punch them on the nose.

    Rudeness for pride! Yes, take my tip.

    Beat them: they''ll come with kissing lip.¹10


    For all the talk of love, most knights of the day would probably have preferred
    songs! like those of the troubadour Bertran de Born. Bertran sang of spring, as
    the others did:


    How I like the gay time of spring

    That makes leaves and flowers grow,

    And how I like the piercing ring

    Of birds, as their songs go

    Echoing among the woods.


    But his song celebrates the springtime blooming, not of love, but of war:


    I tell you: no pleasure’s so large

    (Not eating or drinking or sleep)

    As when I hear the cry: "Charge"

    Or out of the darkened deep

    Or the horse’s whinying refrain,

    Or the cry: "Help! Bring aid!"

    As big and little cascade

    And I see, by, the corpses whose sides

    Into ditches across the plain

    Are splintered, flags furling wide.¹¹¹


    The poets rescued erotic love from the monks and the warriors. They did not override
    the claims of spiritual or secular ambition; they did not extirpate brutish lust;
    and they left unplored the unfolding complexities of conjugal love. But in their
    poetry they created a haven for gentle, faithful, and ennobling erotic love between
    man and woman.


