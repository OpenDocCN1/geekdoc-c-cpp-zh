    ## LOVE IN TWELFTH-CENTURY FRANCE


    Sit you down amid the fire,

    Will the fire not burn you?

    To Pavia, will you

    Just as chaste return you?

    Pavia, where Beauty draws

    Youth with finger-tips,

    Youth entangled in her eyes,

    Ravished with her lips.¹26


    Quite irreverent was the poem describing a council of nuns held in their convent
    at Remiremont.¹27 The nuns begin with readings, not from the Bible, but from Ovid,
    and then move on, not to hymns, but to songs. Invoking the name of Love, god of
    all things, they debate whether they should accept knights as lovers or only clerics
    as they have done in the past. The argument goes clearly in favor of the clergy,
    whose wisdom, discretion, and and generosity are praised on all sides. The council
    ends by calling down an elaborate curse on those who accept knights as lovers.
    Their sorrows will be perpetual unless they repent, spurn the laymen, and give
    themselves only to clerics.


    The audience for whom these works were created must have been especially pleased
    with the Treatise on Love by Andreas Capellanus (Andrew the Chaplain).²⁸ Writing
    in Latin, the language of the clergy, Andreas modelled his work on that of Ovid,
    but his raw material was drawn from twelfth-century France. He presented the work
    as a letter to his young friend Walter who had been importuning Andreas for advice
    about love. Andreas obviously was a man familiar with these matters and he finally
    consented.


    In the first book, Andreas defines and describes love. "Love is a certain inborn
    suffering derived from the sight of and excessive meditation upon the beauty of
    the opposite sex, which causes each one to wish above all things the embraces
    of the other and by common desire to carry out all of love''s precepts in the
    other''s embrace" (p. 28). Andreas clearly knew the fashions of the courts. After
    some preliminary discussions, Andreas provides a number of sample conversations,
    showing how a commoner, a nobleman, and a high nobleman (who is also a cleric)
    might approach women of those classes. Then he discusses such matters as the love
    of clergy, nuns, peasants, and prostitutes and the role of money in love. Throughout,
    love and marriage are two entirely different—and incompatible—things.


    In the second book, Andreas explains how love can be retained or diminished. He
    reviews some cases which are purported to have been decided in "courts of love"
    presided over by some of the ladies of the day: Countess Marie of Champagne, Queen
    Eleanor of Aquitaine, Viscount Ermergarde of Narbonne, Countess Isabelle of Flanders.
    He concludes with the "Rules of Love," which, he says, were provided by the "King
    of Love." This famous list includes such dicta: Marriage is no real excuse for
    not loving; every lover regularly turns pale in the presence of his beloved; whom
    the thought of love vexes and sleeps very little; and the like (pp. 184-86).


    In the final book, however, Andreas rejects the contents of the first two books.
    He tells Walter that although he has consented to give him the instruction he
    asked, Walter would be much the wiser to ignore it.


    Read this little book, then, not as one seeking to take up the life of a lover,
    but that, invigorated by the theory and trained to excite the minds of women to
    love, you may, by refraining from so doing, win an eternal reward and thereby
    deserve a greater reward from God (p. 187).


    Andreas reviews, with remarkable thoroughness, all the arguments against love,
    concluding with an equally thorough diatribe against women. Andreas finally treats
    Walter to "accept this health-giving teaching we offer you, and pass by all the
    vanities of the world, so that when the Bridegroom cometh to celebrate the greater
    nuptials . . . you may be prepared to go forth to meet him with your lamps filled"
    (p. 211).


    Many scholars have taken the treatise of Andreas to be the serious and almost
    official statement of the "system of courtly love." In this view, Andreas was
    naive and foolish. The opinion is now gaining ground that if anyone is naive or
    foolish, it is those were taken in the satire of a sophisticated twelfth-century
    cleric. Andreas was a man who knew the fashions of the courts, the tastes of monks,
    the manners of townsmen, and the interests of the schoolmen. Taking love between
    man and woman as his subject, he wrote a treatise in the manner of the schoolmen,
    systematic and comprehensive; but he wrote more for the amusement than for the
    instruction of his fellow clerics.


    In the first two books, Andreas plays upon the ideals of religious and secular
    life; but the sordid realities of his society keep intruding. Surely, “one can
    find nothing in the world more desirable than love, since from it comes the doing
    of every good thing and without it one would do anything good in the world” (p.
    72). Surely a lover should possess every virtue (pp. 59–61). But these delicate
    principles wither in the hands of the seducer. The old man can argue that since
    he has developed gentlemanly virtues he deserves the lady’s favor, the young man
    that only her love will enable him to become virtuous (pp. 39–43). If the lady
    hesitates because of the immorality of adulterous dalliance, the seducer responds
    in a classic vein, that if she were really interested in morality, she would be
    praying in a convent rather than flirting in a court. Better to be an honest adulteress
    than a hypocritically faithful wife. Moreover, God cannot be seriously offended
    by love, for what is done under the compulsion of nature can be made clean by
    any easy expiation. Besides, it is said that love is the cause and origin of everything
    good (p. 108), but in his sample dialogues, Andreas suggests that one can go too
    far in idealizing women. When a lady rejects a clerical suitor because clerics
    are indolent and gluttonous, the cleric replies, with greater candor than tact,
    that no one is lazier than a woman, no one a slave to the belly (pp. 126-29).
    For nuns, Walter should completely avoid them. Their seduction is a great crime
    in the eyes of God and man, yet no one is more easily seduced (pp. 142-44).


    The commoner who would mimic the style of the noble lover is distinguished mainly
    for his tenacity. He is not even discouraged when a noble lady observes that “your
    calves are fat and roughly turned, abruptly, and your feet are huge and immensely
    spread out so that they are as broad as they are long” (p. 57). Even the clergy
    for whom Andreas writes are invited to consider the contrast between the ideals
    and the realities of their lives. As a man of learning, the cleric cannot resist
    displaying his dialectical skills even in the midst of a seduction. He begins,
    “Now I shall prove to you that you cannot properly deprive me of your love.” He
    then marshals after syllogism, finally arriving at his triumphant conclusion:
    “Therefore if you find that my character is good you do wrong in denying your
    love” (p. 88).


    The audience for whom these works were created must have been especially pleased
    with the Treatise on Love by Andreas Capellanus (Andrew the Chaplain).²⁸ Writing
    in Latin, the language of the clergy, Andreas modelled his work on that of Ovid,
    but his raw material was drawn from twelfth-century France. He presented the work
    as a letter to his young friend Walter who had been importuning Andreas for advice
    about love. Andreas obviously was a man familiar with these matters and he finally
    consented.

