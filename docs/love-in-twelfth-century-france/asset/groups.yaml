    ## Preface\n\nThis book is intended for the student and the general reader, but\
    \ I hope that some scholars too may find it useful. Outside of our own areas of\
    \ specialization, many of us become “general readers” seeking easy access to complicated\
    \ bodies of knowledge. All are welcome here.\n\nA few technical points for the\
    \ scholarly reader. Translations are my own unless otherwise indicated. Biblical\
    \ quotations are from the Revised Standard Version, although I have modified the\
    \ translation in a number of instances to bring it closer to the Vulgate. Throughout,\
    \ I've quoted translations I thought readable and cited editions I thought accessible.\
    \ PL is an abbreviation for *Patologia Latina*, ed. J. P. Migne, 221 vols. (Paris,\
    \ 1844–55); RHGF is an abbreviation for *Recueil des historiens de Gaules et de\
    \ la France*, *24* vols. (Paris, 1737–1904).\n\nvii\n\nI wish to express my thanks\
    \ to all those who, in one way or another, made this book possible: The Frank\
    \ L. Weil Institute for Studies in Religion and the Humanities; Professor Benjamin\
    \ Nelson, my colleagues at Hofstra University, particularly Linton S. Thorn, John\
    \ T. Marcus, and the late Gerrit P. Judd, and finally my wife, Patricia, who has\
    \ been my fellow-student of love for some years now.\n\nJ.C.M.\n\n## Contents\n\
    \n- Preface vii\n- CHAPTER ONE Introduction I\n- CHAPTER TWO Love in the Legacy\
    \ of the Past 16\n- CHAPTER THREE The Monasteries 47\n- CHAPTER FOUR The Courts\
