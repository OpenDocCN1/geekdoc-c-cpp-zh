    # 书目笔记


    《圣伯纳德的神秘神学》，A. H. C. Downes 译（伦敦与纽约，1940）。大卫·诺尔斯（David Knowles）的作品对中世纪修道院提供了富有同情且高度可靠的注释；G.
    G. 库尔顿的作品较缺乏同情且已过时，但仍有价值。关于个人人物的作品有沃特金斯·威廉姆斯（Watkins Williams）《克莱的圣伯纳德》（曼彻斯特，1935）；J.
    M. 德沙内（J. M. Déchanet）《圣谢里的里昂》（布鲁日，1942）；以及阿梅德·哈利埃（Amédée Hallier）《里沃德的修道神学：一种经验神学》，Columbaney
    译（马萨诸塞州，1969）。


    关于王朝史，查尔斯·佩蒂-杜塔伊斯（Charles Petit-Dutaillis）《10至13世纪法国和英国的封建君主制》，E. D. Hunt 译（伦敦，1936）；A.
    吕泰尔（A Luchaire）《早期章节（987–1137）》（巴黎，1901），第二卷第二部分。他的《法国史》，由埃内斯特·拉维斯（Ernest Lavise）编辑；以及《中世纪法国制度史》第一卷，由费迪南德·洛（Ferdinand
    Lot）和罗伯特·塔夫（Robert Taft）编辑（巴黎，1957）。见《中世纪欧洲的领主与社区》，Freder里克·切特（Cheytte）编辑（纽约，1968）。关于贵族赞助文学的最彻底的讨论是雷特罗·R.
    贝索拉（Retro R. Bezisola）《宫廷文学的起源与形成》，第三部分：宫廷城市：宫廷文学与宫廷文学》，两卷（巴黎，1963）；但也可参见约翰·F.
    班顿（John F. Benton）“作为文学中心的香槟宫廷”，《世纪问题》，第36（1961），551–91。


    关于广义的文学与思想，H. O. 泰勒的《中世纪思想》，第4版（马萨诸塞州，1951）仍是一本很好的入门读。关于文学的更专门的作品有埃恩斯特·柯蒂斯（Ernst
    Curtis）《欧洲文学与拉丁中世纪》，威拉德·R. 特拉斯 译（纽约与伊斯顿，1963）；欧尔班·T. 霍姆斯等（Urban T. Holmes, Jr.）《古法语文学史》，修订版（纽约，1962）；以及彼得·德龙克（Peter
    Dronke）《中世纪拉丁语与欧洲爱情抒歌的兴起》，第2版，两卷（牛津，1968）。个体的独特性……


    # 12世纪法国的爱情


    爱情在12世纪生活和文学中的地位一直是海量学术著作中一个极具争议的话题。关于“宫廷爱情”争议的最好入门介绍是N. 纽曼（N. Newman）编辑的《宫廷爱情的意义》（奥尔巴尼，1968）序言。本小书包含了优秀学者优秀的论文和良好的参考文献。关于爱情诗本身最易读的介绍是莫里斯·瓦伦西（Maurice
    Valency）的《赞美爱情》（纽约，1958）。关于存在一套可以被称为“宫廷爱情”并由安德烈亚斯·卡佩拉努斯（Andreas Capellanus）严肃提出的系统信仰理论，是由C.
    S. 刘易斯（C. S. Lewis）的《爱情寓言》（纽约，1958；首次出版于1336）和西德尼·潘特（Sidney Painter）的《法国骑士》（伊塔卡，1961，首次出版于1940）传播的。这一理论受到了许多学者的挑战，他们认为安德烈亚斯的意图是讽刺性的，尽管他们之间仍存在很大分歧。其中最重要的杜兰特·W.
    罗伯森（Durant W. Robertson）《乔叟序》（普林斯顿，1963）；E. 塔尔尔博特·唐纳森（E. Talbot Donaldson）“宫廷爱情的神话”，《冒险》，第5卷第2期（1965），16-23），以及上述提到的彼得·德龙克《欧洲爱情抒歌》。


    上述引用的两部作品描述了城镇的生活：霍姆斯（Holmes）的《日常生活》，和吕泰尔（Luchaire）的《社会法国》。巴黎大师对城市面临的道德问题的反思在约翰·W.
    鲍尔德温（John W. Baldwin）的《大师与商人：圣咏彼得及其圈子的社会观点》，两卷（普林斯顿，1970）中，但在这些任何一书中很少找到关于爱情的内容。关于异端，请参见杰弗里·伯尔顿·鲁塞尔（Jeffrey
    Burton Russell）的《中世纪早期的异端与改革》（伯克利与洛洛矶矶，1965）。


    关于该时期知识生活的良好介绍是大卫·诺尔斯（David Knowles）《中世纪思想的演变》（纽约，1964）。关于学院派对性与婚姻的态度，请参见约翰·T.
    诺南上士（John T. Noonan, Jr.）《避孕：天主教神学家和法学家对其处理的历史》（马萨诸塞州，1965）；同一作者的“教会法学家中的婚姻情感”，《格拉齐亚研究》，第12（1967），479–509；以及《天神学辞典》中关于“婚姻”的几篇文章，第9（巴黎，1926），2044–335。关于个人作者的有用著作有G.
    雷诺德·德利尔（G. Raynaud de Lille）《阿兰·德利尔》（蒙特利尔与巴黎，1951）；理查德·H. 格林（Richard H. Green）“德利尔的《论自然本性》”，《世纪问题》，第31（1956），64–74；菲利普·德莱耶（Philippe
    Delhaye）《彼得·伦巴尔德：他的道德》（蒙特利尔与巴黎，1961）；热尔瓦·杜梅日（Gervais Dumeige）《圣维多的理查德与基督教爱情思想》（巴黎，1952）；以及埃蒂安·吉尔松（Etienne
    Gilson）《海洛伊丝与阿伯拉德》，L. Shook 译（安诺堡，1960），以及莱夫·格雷（Leif Grane）《海洛伊丝与阿伯拉德：中世纪基督教》，F.
    Hopman 译（花园城）。关于爱情的历史和哲学的最好介绍是欧尔文·辛格（Irving Singer）《爱情的本质》（纽约，1966），并在《西方思想史》第20（1968），141中有评述。参见马丁·C.
    迪（Martin C. Dy）《爱情的心与灵》，修订版（纽约，1956）。关于爱情的选集，参见《爱情的思想》，Robert G. 哈泽（纽约，1967）。


