    # 五章


    # 城镇


    一切在城镇中汇聚：来自东方的香料、来自乡村的粮食、来自海洋的鱼类；僧侣、骑士、学者和工匠；古代的学问和当下的浮华。这一切在城镇狭窄而恶臭的街道上混合。法国大多数城镇是围绕某个贵族或主教的城堡或筑的修道院建立的。无论起源如何，城镇居民通常在教堂的阴影下进行获取和支出的日常事务，城镇的保护通常在骑士手中，这些人为教会或世俗君主服务，君主声称城镇为己，并将大部分时间花在墙内。此外，任何规模的城镇都有一所或几所学校，男孩在那里学习字母、数字，可能甚至更多。


    # 12世纪法国的爱情


    在教室里，勤奋的学生听了对异教和基督教古代遗产的宣读和解释；在那里和教堂里，他学习了几个世纪以来丰富了这些遗产的僧侣积累。在街道上，在小贩的叫卖声、马和猪的喧闹声中，他听到了酒馆里的淫歌，以及那些为宫廷创作但流传到民间的故事和歌曲。


    城镇本身作为创造工匠和商人的技艺见证存了下来，但没有什么能告诉我们他们居民的心灵。我们知道他们的生活是危险的。路易六世国王的继承人在巴黎的一场交通事故中去世：他被一只猪撞倒在街上.¹在12世纪，有疾病。也有叛乱。城镇居民发现君主、主教或道院主的统治对他们的商业利益过于限制，便试图组成“公社”（communes），这些公社并非完全独立，但赋予城镇居民管理自己事务的权利。例如在1115年，拉昂（Laon）的市民反抗了他们的主教，一个傲慢且贪婪的人，他在他在犯罪时服从于一个强壮的非洲奴隶。在复活节期间，城镇居民挤满大街大喊“公社！”他们杀杀了主教及其家眷，焚烧了教堂，并追捕杀杀了住在


    的贵族家族。


