    to so many people, mankind perhaps, that it is impossible for them to respond.
    Influenced by the Christian and pagan writers of antiquity, twelfth-century thinkers
    were inclined to accept unilateral love as an adequate form of love. Too often,
    they thought of love as a virtue or emotion contained entirely within the individual.
