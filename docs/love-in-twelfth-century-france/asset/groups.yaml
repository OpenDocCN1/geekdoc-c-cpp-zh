    # LOVE IN TWELFTH-CENTURY FRANCE


    strated the involvement of the whole personality in the experience of loving.
    Love grew from fear and gratitude, it caused joy and sorrow, it poured forth in
    songs and tears. The monastic habit of analyzing the movements of the soul is
    a major source of the western tradition of introspection, a tradition which has
    given rise to modern psychiatry and to much of modern literature.


    The monks'' sensitivity to the workings of the soul enabled them to see that love
    was not a static thing. It grew and developed—or waned. Moreover, they saw that
    although love was a natural inclination, its direction and intensity could be
    at least partially controlled. Oneness with God, the goal of monastic life, was
    the fruit of a long process. It was understood only through thought and prayer,
    realized only through effort and grace.


