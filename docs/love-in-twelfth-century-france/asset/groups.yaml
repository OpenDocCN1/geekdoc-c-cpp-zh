    到1200年时，路易六世的孙子菲利普二世强大得多，但当时还不清楚他是否比“高卢”的其他大贵族更强。在法国，正如其他地方一样，贵族们首先为了生存而斗争，然后为了财富和权力。他们蚕食邻居的土地；他们与一个邻居结成盟约以掠夺另一个；他们通过复杂的豪赌将孩子嫁到此方或彼方，希望通过正确的出生死亡模式，让几个公国落入他们某位后代手中。这种动态关系的范围可以通过路易七世的家族关系来窥见。他的第一妻子是阿基坦尼的继承人埃莉诺尔，她后来嫁给了英国的亨利二世。他第一段婚姻的两个女儿嫁给了香槟侯和布洛瓦侯。路易七世娶了卡斯蒂利亚国王的女儿，再次有两个女儿。一个嫁给了蓬蒂埃爵，另一个起初嫁给了亨利二世和埃莉诺尔之子小亨利，后来嫁给了匈牙利国王。路易七世的第三妻子生下了未来的国王菲利普·奥古斯和一个嫁给君士坦丁堡拜占庭皇帝的女儿。这些婚姻的实际政治结果错乱如麻；其可能的结果则难以想象。


    尽管存在这些分歧和复杂性，法国确实发展出一些政治统一。到世纪末，法国的卡佩王朝国王即将成为欧洲最强大的统治者。然而，更令人印象深刻的是法国在欧洲享有的文化领先地位。


    大约1100年，法国北方的一位诗人创作了《罗兰骑士》，这是一首英雄史诗，体现了法国宫廷战士的理想，并将其传到了法国边界之外，事实上跨越了12世纪的边界。大体同一时期，在南方，阿基坦公爵威廉九世创作了已知的第一批吟游诗人诗，即被作为艺术研究的抒情爱情诗。大约世纪中叶，南北传统融合。其结果就是浪漫小说，它是英雄事事诗、吟游诗人巧妙的歌曲以及赞助作者的日益悠闲和复杂的宫廷的杂交产物。大约1170年，诗人克雷捷·德·特罗自称，骑士精神和学问在抛弃希腊和罗马后，必须居住在法国。^6这一豪言依然成立；在12世纪的法国，现代欧洲文学诞生了。


    尽管宗教机构和学校存在分歧，但法国确实产生了一些政治统一。到世纪末，法国卡佩王朝国王正处于成为欧洲最强统治者的边缘。然而，更令人深刻的是法国在欧洲享文化领先地位。


