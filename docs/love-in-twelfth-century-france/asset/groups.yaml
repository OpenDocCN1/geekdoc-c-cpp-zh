    of his life: to know and love God. The good monk lived in the personal presence
    of the God who made him, who knew him, who loved him, and who would one day judge
    him. The monastic life was acknowledged by all to be the best way for a man to
    respond to this presence. The monk read in the Old Testament of how the Hebrews
    anticipated the Promised Land and the Messiah, he thought of his own exile in
