    among the baser minerals the glittering substance of interpersonal erotic love.


    And as the rules of courtesy became more formalized, romantic love took on more
    characteristics of a game. Courtly behavior became a kind of ritual in which each
    played a part, a kind of mimicry. And, most important for a game, its field was
    circumscribed in time and place, sheltered by the imagination from harsh social
    realities, played according to rules less complicated than the rules of real life.


    ## LOVE IN TWELFTH-CENTURY FRANCE


    The valid insights of the poets could not be integrated into twelfth-century aristocratic
    culture, but they were preserved in the play of aristocratic culture. And even
    in the game itself, one finds an understanding of human needs lacking in the severity
    of the monks.


    The isolation of erotic love in time and space was unfortunate. The poets surely
    knew that in describing early forms of love they had not completely presented
    the appropriate unifying relationship between man and woman. They had discovered
    something, but they did not pursue their discovery with the persistence of the
    monks nor with the breadth of vision of the schoolmen. They had achieved new insights
    into the appropriate unifying relationship between man and woman, but their searching
    stopped at the end of the poem, at the end of the game. So they had nothing to
    say about how the relationship between man and woman changes over extended time,
    how it is modified by the birth of children, how individual characteristics, so
    deeply rooted to be immovable, persevere to the end as sources of consolation
    and irritation to the other, and how the process of revelation and discovery leads
    to the growth and psychic intertwining of two imperfect personalities. In brief,
    the poets did not discover conjugal love.


    But then, neither did anyone else. The schoolmen had little to say about reciprocal
    love. When they described the appropriate unifying relationship between man and
    woman, they took into account the needs of society, but they saw husband and wife
    almost as celibates who had children. In the minds of the clergy, the ideal parents
    were like affectionate brother and sister, except that they copulated to have
    children and to relieve lustful desires in the least way damaging to themselves
    and to society. Like modern sociologists, the schoolmen insisted that man''s sexual
    instincts must be controlled so that they serve society. The instincts should
    not work violence on others through rape; they should not take what is another''s
    through adultery; they should not be indulged at the expense of the offspring
    they create. The schoolmen were sensible. What they said was good for society.
    It was good for individuals too, in far as it defended the worth of every person
    and insisted that marriage was up to the free choice of the individual. But because
    they thought of love as a virtue or affection inhering in the individual, they
    neglected the experience of reciprocal interpersonal love, and because of their
    condemnation of erotic pleasure, the schoolmen offered nothing but conjugal love,
    the most complex, the most variable, and the most profound form of interpersonal
    love among humans.


    Knights looked for appropriate unifying relationships too, but for nearly all
    relationships were questions of power: lord and vassal, husband and wife, parent
    and child. The fundamental thrust of the Christian commandment to love one''s
    neighbor as one''s was egalitarian, but nothing was more foreign to the hierarchical
    mentality of French knights than this egalitarian sentiment. Men were equal in
    the eyes of God, but not in the eyes of one another. A knight was stronger than
    a serf, a man was stronger than a woman. The appropriate unifying relationship
    was sought in the light of this disparity of power, not in the light of the egalitarian
