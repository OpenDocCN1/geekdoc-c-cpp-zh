    ## 十二世纪法国的爱情


    那些财富和教育挑战了战士阶级地位的男性，欢迎任何能让他们与虚伪的平民区分开来并凌驾其上的事物。他们的马匹、武器、盔甲和训练让他们成为了骑士（chevaliers）。他们是不劳作的战士；他们拥有土地并统治着他人；他们拥有自己的生活方式来强化他们对优越地位的主张，而这种主张尚未通过世袭法律特权得到稳固的。


    诗歌为何会成为这种“礼仪”的一部分，多年来一直困扰着学者。有些人发现吟游诗人爱情诗歌的起源于来自奥维的文学影响、来自西班牙的影响，或者是基督教僧侣使用的爱情语言。另一些人则强调社会和心理原因：女性在宫廷的影响（尤其是当男性外出参加十字军东征或其他战争时）、宫廷中男女比例的失调、吟游诗人心理上的不成熟，或者是所有男性矛盾的心态——他们在女性身上既看到了童年时期无所不能的、赋予生命的母亲，又看到了成年后渺小、虚弱的依赖者。还有人发现十二世纪和十三世纪的某些异端教说与吟游诗人爱情诗之间存在联系。然而，为了本书的，最好避免讨论棘手的“宫廷爱情”以及关于它的学术争论。无论出于什么原因，十二世纪法国宫廷对爱情产生了一种新的兴趣，这种兴趣为欧洲的生活和文学指明了新的方向。


    吟游诗人的情歌并没有一套定义明确、可以被整齐标记为“宫廷爱情”的观点。相反，它们包含了一种“态度的光谱”。⁶ 这些态度中的一些变成了习俗，虽然并非被普遍接受，但无疑非常常见，可以相当简单地阐述。最熟悉的习俗是恳求的骑士在“追求”一位理想化的女士。这位女士美丽且令人向往，诗人以谦卑骑士的身份对她说话，像附庸对领主、或像人对上帝一样向她提供服务。他对她的爱让他成为一个忠诚的情人和一个更好的骑士，一个会为她勇于面对危险的人，但同时在祈求中变得谦卑和温柔。吟游诗人的爱主要是欲望之爱，而非圆满。情绪从爱人带给他的喜悦转变为由于无法拥有她而感到的忧伤。他想要自由地赢得爱，但他的歌通常停留在尚未获得爱之前。结尾的情绪可能是希望的期待和哀伤的渴望，但很少有满足。


    这些习俗的例子自威廉伯爵时代以来变得复杂，可以在伯纳特·德·范塔多尔（Bernart de Vantador）的一首诗中看到，他是中世纪由阿基坦的埃莉诺诺本人赞助的吟游诗人：


    > 如果心中不唱这首歌，

    > 歌就毫无价值，而心永远无法

    > 带上它。


    87


    因此，我的歌绝不会出错，

    因为我已将我的用途给了爱情，

    包括我的心、眼睛、嘴巴和思想。

    我不愿从上帝那里获得力量

    去逃避爱人的蔑视，

    如果我没有得到她的恩惠，

    但她每天都带给我痛苦，

    那么比起哀叹，

    我从自己纯洁的心中将获得更多的满足。


    愚人嘲笑那些心在无知中静止的爱人，但伤害未必会降临，

    因为爱不会被轻易杀死，

    除非它是不相互的，

    如果是那样，那根本不是爱，

    而只是名字、形式和伪装：

    没有索取就没有爱。


    我最亲爱的愿望变得宏大而大胆，

    当命运呈现出那张可爱的、

    我最爱且必须凝视的面庞，

    高贵、温柔、真诚，没有一丝

    不圣洁的痕迹，身体充满了优雅的气息。

    她能为国王带来救赎；

    她让我从虚无中变得富有。


    正如我恐惧爱那样深沉，

    没有什么比将她所有的愿望都珍放在心上更令人沮丧。

    每天都像圣诞节一样

    她那充满灵魂的眼睛望向我。


    88


    但她们实现这些愿望如此缓慢，

    要过几个月才能过去一天。⁷


    诗歌中所涉及的女士通常是已婚的。也许正如某些人说，吟游诗人创造了一种“通奸崇拜”。更有可能是，他们只是对爱情感兴趣，而在十二世纪的法国，与婚姻几乎没有关系。通过婚姻，人们获得财富和地位。爱情的进入更多是偶然或刻意设计的。此外，吟游诗人和他们的北方同类（*trouvères*）通常是希望在贵族宫廷获得青睐的男性，而宫廷中那些被奉承或“追求”的重要女性几乎全都是已婚的。最后，吟游诗人出于某种原因，喜欢歌唱未满足欲望的不断变化的情绪，这种经历在此贵族的婚姻安排中并不常见。婚姻是在没有欲望的情况下完成的，随后立即得到了满足。


    因此，吟游诗人对攻击婚姻并不特别。相反，婚姻——通常以嫉妒丈夫形象出现——不断侵入爱情领域。诗人们对萌芽爱情的闪烁情感感兴趣，他们的主题在社会看来必然是可疑的。对于基督教苦行者来说，肉欲之爱是地狱的诱惑。对于总是找到女性来缓解欲望的世俗君主来说，吟游诗人的爱降低了婚姻作为转移财富和权力手段的真实重要性。它还威胁到继承人的遗产，因为一个屈从吟游诗人的妻子可能会给另一个人的后代。因此，吟游诗人带有些防御性地对婚姻表示反感，因为婚姻对爱情留出的空间很小。但尽管如此，吟游诗人为欧洲带来了一套新的理想，并不是他们或他们的听众一定符合这些理想。他们赞扬爱人中的温柔、谦卑、节制和谨慎，但并不一定恒久。在没有剧烈改变社会的情况下，吟游诗人一定在某种程度上精炼并软化了宫廷的生活。他们在苦行主义对肉欲生活的否认与对性的无感接受之间提供了一种折中地。男女之间的肉欲之爱，被诗人称为“真爱”、“纯洁之爱”或“高尚之爱（fine
    love）”，变得本身就是了一种好的东西。


    这种对爱情的新兴趣在法国南部增长，并在当地方言中得到表达，但它很快就不限于那个地区或那种语言。当威廉九世的孙女埃莉诺在1137年作为路易七世的妻子北上时，她的文学品味随之而去，并将这些口味传给了她与路易以及亨利·普兰塔热尼所的孩子。亨利和埃莉诺无论是分开还是在一起，都是普瓦图地区、安茹地区、诺曼地区和英国诗人的主要赞助人。埃莉诺的女儿玛丽于1159年嫁给了香槟的亨利伯爵，虽然伯爵的兴趣使他倾向于学者群体和宗教历史主题的拉丁语著作，但玛丽在当时杰出的法国诗人（包括克雷铁·德·特瓦）的鼓励下，支持了这种创作。特瓦宫廷在几年前还被圣伯纳德定期访问，现在庇护了对新世俗爱情诗的赞助，这一事实定会让严厉的西多会修士感到震惊。


    北方作家采纳了吟游诗人的爱情主题，并将其织入过去的素材——特洛伊、希腊、罗马和亚瑟王宫廷的故事。除了以吟游诗人的方式创作情歌外，他们改编了骑士冒险故事，使得产生的“传奇小说（romances）”不仅关于冒险，也是关于爱情的长篇故事。


    北方作家对爱情的并没有单一的观念。但与吟游诗人一样，他们对爱情的早期阶段着迷：恋人对爱人思想的全神贯注、新爱情中交织的喜忧、以及使恋人远离任何随意欲望念念的道德净化。甚至更加


