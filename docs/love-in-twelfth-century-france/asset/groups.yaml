    If he knows of his dignity, he claims it as his own work, he is diabolic, for
    he would make himself God. But the man who perceives himself as God-created is
    led, through sheer gratitude, to the love of God.


    Bernard believed that introspection can reveal all to the infidel as well to the
    Christian, so that, nothing else does so, gratitude should lead all men to the
    love of God. For the Christian, the gratitude should be all the greater, because
    he knows God''s generosity in the death and resurrection of Christ, who earned
    eternal life for those who believe. Whereas the infidel has only his experience
    to draw upon, the bride in the *Song of Songs* pleaded, "Sustain me with flowers,
    comfort me with apples, for I am sick with love" (2:5). Christ the Bridegroom
    responds to the soul and consoles her with the "apples of her suffering" and the
    "flowers of her resurrection." With these memories, the soul is comforted until
    she enters the embrace of the heavenly bedroom. Bernard says, then, any man should
    love God in gratitude and without measure, especially the man who knows Christ,
    who is the fullness of God''s generosity.


    Besides gratitude for what we have, there is desire for what we lack. Bernard
