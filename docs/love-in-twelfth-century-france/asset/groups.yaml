    # 十二世纪法国的爱


    奥古斯丁借鉴了自己的经历以及三世纪罗马人普鲁图丁的新柏拉主义理论。奥古斯丁曾游走于各种信仰之间，寻求一个名为“幸福”的无形目标。他回到了基督教，相信自己可以通过基督找到它，因为基督就是道路、真理和生命。他在他史无前例的自传《忏悔录》中记录了这些冒险，书的第一页写出了它的主题：“我们的心未在你里面，就得不得安。”人对上帝的爱并非给予，而是对柏拉图和普鲁图丁所描述的“善”的渴望，其目标是与“善”合一，而奥古斯丁现在将其认作通过耶稣启示的人格神。人对上帝的爱是对“善”的渴望和喜悦。


    想要爱神的基督徒必须从物质诱惑中夺回自我，以免像奥古斯丁那样坦白道：“当我离开你，这唯一的善时，我在万物中迷失了自我。”普鲁图丁本希望这位哲学家过上苦行生活，以促进灵魂沿着“存在之链”向上移动。奥古斯丁对基督徒也有同样的纪律要求，并将死后的终极福报作为奖励，甚至可能在世上提供这种福报的某种预示——对上帝的神秘体验。保罗在描述自己的神秘体验时措辞十分谨慎：


    我晓得在基督里有一个人，十四年前曾被提到了第三个天——是在身体里还是在体外，我不知道，上帝知道。我晓得那人提到了天堂——是在身体里还是在体外，我不知道，上帝知道——他听了不能言说的话，人不能说的话（哥林多后书
    12:2–4）。


    这种神秘的交融在整个中世纪被称为“沉想”。它是在地上的天堂的预演。


    当奥古斯丁转向第二大诫令爱邻人时，他感到有些困惑。他自己的经历是，人性的爱是危险的，因为人除了爱上帝（渴望并喜悦上帝），不能爱别的。友谊可能成为罪恶的源头，“因为对最低等级事物的过度倾向，更好、更高的事物就被遗弃了……”起初，他说只有上帝应当为了自身而被爱；其他事物仅能被使用，以便人接近上帝。随后，面对必须不仅是“使用”而是“爱”邻人的必然要求，他发展出一种观点：造物应当根据其在存在层级中的位置来被爱。有一种爱的秩序，即“爱的秩序”（*ordo
    amoris*）；被创造的善与美有助于人的心灵向它们的创造者靠拢。然而，尽管奥古斯丁在生活中可能是这样，但他的理论并没有轻易纳入世上人与人之间的爱。人的注意力属于上帝，人之所以偏离了这一目标，是因为福音要求人要照顾邻人的生理和精神需求——一种类似于上帝对人之爱的“给予”之爱。


    这种对基督教之爱的相同观点，在大格里高利（死于604年）的作品中也能找到，他在十二世纪受推崇的程度仅略次于奥古斯丁。格里高利是一位修士；他的著作帮助定义了修道院理想，这是从格里高利时代直到十三世纪的基督教最高理想。与奥古斯丁一样，格里高利将爱视为灵魂对上帝的渴望和喜悦。关于沉想，格里高利说：“当心灵尝到内在的甜美时，它被爱点燃了。”通过苦行生活以及上帝派遣或允许的苦难与诱惑，灵魂得到了净化并戒断了世俗依恋。这个在地上开始的过程只有在天堂才能完成。


    对于格里高利，对于奥古斯丁来说，爱邻人的要求意味着满足他们的需求，当然，精神需求优先。是格里高利采取了带有矛盾色彩的一步，利用修士——这些男传教士来教化世界。他派遣奥古斯丁过上隐世生活，作为坎特伯雷的传教士前往英国；从那里建立的新修道院中，一些本笃苦会修士返回大陆教化异教的德尔曼人。在整个中世纪，爱邻人首先意味着让他们归信基督的生活，因为归信意味着拯救，没有比这更大的礼物了。


    上帝与人之间、以及人与邻人之间的爱，显然与色爱无关。那是另一一回事，而且是一个问题。基督教关于性爱的遗产是模糊的。十二世纪的读者可能很容易从其来源中得出结论：性爱、婚姻、女性甚至物质本身都是邪恶的；但如果他们读得更仔细，也可能发现这种结论是异端性的。


    对性爱的反感有几个来源。罗马社会的许多淫乱无疑令人反感。无论如何，当时存在一种强烈的基于斯多葛学派和新柏拉主义、并经圣经证实的苦行主义倾向。特别在新柏拉主义中，灵魂通过“向上”移动、远离身体及其关注的事物来达到目标。新约圣经似乎建议完全禁欲。耶稣和他的母亲被认为是处女，耶稣也带有一点晦晦地谈到了那些“为天国缘自作太的人”（马太福音
    19:12）。保罗则写得非常明确，他给哥林多人的第一封信对于中世纪思想是如此基础，以至于应该全文引用：


    男人不犯妇女是好的；但免于奸淫，每个男人应当有自己的妻子，每个女子应当有自己的丈夫。丈夫应当给妻子应得的权利，妻子亦是这样给丈夫。妻子不应当主丈夫；因为妻子不主自己的身体，由丈夫主；同样，妻子不主自己的身体，由丈夫主。我说这话是为你们自己缘，不是要在你们上有束缚，是要叫你们专心事主（哥林多前书
    7:1–11）。


    这些经文的意义引起了很大争议，特别是在宗教改革以后；在整个中世纪，它们几乎被视为对贞洁生活的神圣召唤。后来的作家并不总是保持保罗那种温和的语气。对女性之爱是奥古斯丁最摆脱的世俗依恋，他这样描述自己的解脱：“现在我的灵魂脱离了营营索取的苦恼，不再在污秽中打滚，不再欲望的瘙痒。”世代修士阅读这些话，正如他们阅读关于安东尼的诱惑的故事，他是一位三四世纪的埃及修士，魔鬼试图通过化身为美女来陷害他。魔鬼知道肉体对抗灵，常诱使人恨恶试图支配身体，怀疑女性这一普遍性的诱惑者，她首先背叛了亚当和人类，并继续成为不警备基督徒的陷阱。在新约圣经中，保罗要求妇女在教会中要蒙头（哥林多前书
    11:5–15）。奥古斯丁的朋友和顾问圣安布鲁塞解释道：


    既然女子不是上帝的像，所以女子应当蒙头，显出顺服。由于罪恶从她身上开始，她应当有这个记号，头不要露，而是蒙上敬畏的面纱……因为犯罪的起源，她在主教面前应当顺服，因为他是主的代表，正如在法官面前一样。


    因此，古代遗产对性爱、婚姻、女性甚至身体本身都投下了怀疑的阴云。另一方面，人不能在谴责物质和身体而不陷入摩尼教异端的错误，这种异端是奥古斯丁极力否斥的。圣经本身几乎没有不确定上帝创造了'
