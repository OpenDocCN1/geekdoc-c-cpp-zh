    Excellent anthologies are Mediaeval Latin Lyrics, and trans. Helen Waddelfield,
    5th ed. (London, 1948) and Heresies of the High Middle Ages, ed. Walter L. Wakefield
    (New York, 1969).


    # SECONDARY WORKS


    Good general histories are Georges Duby and Robert Mandrow, A History of French
    Civilization, trans. James B. Adkinson (New York, 1964) and Friedrich Heer, The
    Medieval World; Europe: 1100–1350, trans. Janet Sondheimer (New York, 1963). There
    are many useful articles and bibliographies in the New Catholic Encyclopedia,
    15 vols. (New York, 1967).


