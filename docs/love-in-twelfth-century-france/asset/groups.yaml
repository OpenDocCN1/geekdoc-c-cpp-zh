    Only the most severe of the monks, like Arnulf of Boyers (see p. 68), had a simple
    answer to this question. They rejected any form of reciprocal love among humans.
    Each monk was to show all men equal and unilateral benevolence. This was, they
    thought, how God loved man. But unlike God, man should not desire or expect any
    special love in return. This answer was simple and self-effacing. It made love
    an impersonal and unilateral benevolence, uncomplicated by personal interactions.
    And the practice of avoiding other human beings as much as possible made it all
    easier to be impersonal and benevolent. One merely prayed for all mankind.


