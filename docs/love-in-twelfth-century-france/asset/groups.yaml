  - '[PAGE 65]


    ity in Europe in those decades, and he did not hesitate to use that authority
    to chasten kings and cardinals, scholars and bishops. Bernard moved with the astonishing-self-confidence
    of those who believe themselves to be the instruments of God or of history. Many
    of his campaigns now seem misguided: his enthusiasm for the crusade, his condemnation
    of townsmen who tried to expand their liberties by rebelling against barons or
    bishops, his attacks upon the intellectuals Abelard and Gilbert de la Porée. He
    assumed that political and social problems rooted in the complexities of history,
    which he had not studied, were as readily solved as those rooted in the complexities
    of the individual soul, which he had. But his devotional works remain as an achievement
    independent of his public life.


    Love is prominent in all of Bernard''s writing. References to “Lady Charity” fill
    his correspondence; he wrote a long series of sermons, each based on a verse from
    the *Song of Songs*, and love is never neglected in his many other works. One
    small treatise, though, was devoted exclusively to love. Probably written in the
    1120s, it was entitled *On Loving God.*⁵


