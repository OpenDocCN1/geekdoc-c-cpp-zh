    ## LOVE IN TWELFTH-CENTURY FRANCE


    than the troubadours, they recognized that the claims of this love often conflicted
    with society and even with nature. Too often, society and fate seemed to conspire
    to keep lovers apart. Too often, the rules of marriage raised obstacles between
    the lovers, or fate drew the eternal triangle in which at least one must suffer.


    Often the conflict between love and social convention produced tragedy. The Celtic
    story of the love between Tristan and Iseult was well known in the twelfth century.
    Tristan was a knight sent by his uncle King Mark of Cornwall to escort Iseult
    from Ireland to be the king''s bride. By mistake, Tristan and Iseult drank the
    love potion intended for the king and his bride, and from that moment, despite
    Iseult''s marriage to the king, despite the king''s waning and waxing suspicion,
    the two were fated to be lovers. In the end, their adulterous love caused their
    deaths. From the twelfth century on, Tristan and Iseult were known in European
    literature as the symbols of lovers driven to their own destruction by a love
    which, for all its destructiveness, had still a haunting beauty.


    Marie de France also found tragic love stories in the melancholy riches of folklore.
    The first woman writer of French literature, she was patronized by Henry II of
    England. She told the story, for example, of the knight who loved his neighbor''s
    wife and she loved him. Their homes were separated by a wall which kept them apart,
    but they could throw notes back and forth across the wall, and they could see
    each other by standing at their windows. When spring came, the lady would rise
    each night to gaze upon her beloved across the way, and when her husband complained,
    she told him she rose to hear the song of the nightingale that sang each night
    in the garden. Perhaps suspecting the truth, her husband snared the nightingale,
    wrenched off its head, and threw the body on her lap. The love ended. She sent
    the nightingale to the knight next door, who had it encased in a tiny casket of
    gold and fine jewels. The lovers saw each other no more, for society preferred
    marital rights to ennobling love, brutal husbands to gentle lovers.


    On the other hand, not all the stories are so somber; the obstacles raised by
    man or nature are overcome. Marie herself tells tales of lovers who live happily
    after. In one of them, Lanval, a vassal of King Arthur repulses the improper advances
    of the queen for the sake of a fairy maiden whom he loves. The queen gives the
    king a rather distorted version of the incident, and Lanval is nearly disgraced
    before the maiden appears to save his good name. Then he and his beloved ride
    off on a single palfrey, never to be seen again.


    In Eliduc, another of Marie''s tales, the knight Eliduc falls in love with a young
    princess but is torn between his love for her and his devotion to his wife. When
    the princess learns he is married, falls into a coma and is taken for dead. Eliduc
    leaves her body, which remains perfectly preserved, with a hermit and visits her
    every day. His wife becomes concerned about his sadness and, investigating, discovers
    the princess and is able to revive her. Then the lady, surely the most obliging
    wife in all literature, retires to a convent so that the lovers can marry. And
    finally, the claims of love, of secular society, and of religion are perfectly
    reconciled when the happy couple decide that they too will abandon the world for
    the monastic life. The triangle of love is purified, and the three lived out their
    days in holy friendship.⁸


