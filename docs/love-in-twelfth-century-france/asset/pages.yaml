  md: '# LOVE IN TWELFTH-CENTURY FRANCE


    A sense of what daily life was like in twelfth-century France can be acquired
    from Achille Luchaire, Social France at the Time of Philip Augustus, E. B. Krehbiel,
    introduced, by John W. Baldwin (New York, 1967) and Urban T. Holmes, Jr., Daily
    Living in the Twelfth Century (Madison, Wis., 1964). A superb interpretation of
    the period is provided by R. W. Southern, The Making of the Middle Ages (New Haven,
    1961). See also the same author Medieval Humanism and Other Studies (New York
    and Evanston, 1970). An excellent collection of essays appears in Twelfth-Century
    Europe and the Foundations of Modern Society, ed. Marshall Claget et al. (Madison,
    Wis., 1966); and a recent work of much value is Christopher Brooke, The Twelfth
    Century Renaissance (New York, 1970).


    The twelfth-century inheritance from antiquity can be seen in R. R. Bolgar, The
    Classical Heritage and Its Benefaries (Cambridge, 1954); E. K. Rand, Founders
    of the Middle Ages (Cambridge, Mass., 1928) and his Ovid and His Influence (Boston,
    1925); C. H. Haskins, The Renaissance of the Twelfth Century (Cambridge, Mass.,
    1927); Raymond Klibansy, The Continuity of the Platonic Tradition during the Middle
    Ages (London, 1939); and Joseph Anthony Mazzeo, “Plato’s Eros and Dante’s Amor.,
    Traditio, 12 (1956), 315–37. Antique ideas on love are described in Robert Flaciere,
    Love in Ancient Greece, trans. James Clegg (New York, 1962); Georg Luck, The Latin
    Love Egypt (New York, 1960); and John Burnaby’s Medieval Amor Dei: A Study of
    the Religion of St. Augustine (London, 1938). Many of the works listed below contain
    material on the ancient antecedents of the twelfth century.


    For monasticism, Owen Chadwick, John Cassian, 2nd ed. (Cambridge, 1968); Cuthbert
    Butler, Benedictine Monism (Cambridge and New York, 1961) and the same author’s
    Western Mysticism, 2nd ed. (London, 1951); Jean Leclercq, The Love of Learning
    and the Desire for God, trans. Catharine Misrahi (New York, 1961); and Etienne
    Gilson.


    164'
