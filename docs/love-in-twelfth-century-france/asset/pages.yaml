    which each person is alternately giving and taking, active and passive. This fluid
    character of reciprocal love could be exemplified by describing sexual love-making,
    but describing a conversation between friends serves just as well. When one consoles,
    instructs, or amuses another, he exemplifies an active giving while the listener
    exemplifies a passive taking attitude. When a friend speaks, though, to relieve
    his own mind, or to take delight in the sound of his own voice, he exemplifies
    an active taking attitude, while his patient friend exemplifies a passive giving
    attitude. There can be no reciprocal love when one gives or takes exclusively,
    and a wholly active or wholly passive individual is inconceivable. In reciprocal
    interpersonal love, all four attitudes are present in a constantly fluctuating
    combination.


    Unilateral love lacks reciprocity. A person is benevolent toward another (giving)
    or desires another''s benevolence (taking), but because of choice, ignorance,
    or circumstance, the other person does not respond. A person may be benevolent
    to so many people, mankind perhaps, that it is impossible for them to respond.
    Influenced by the Christian and pagan writers of antiquity, twelfth-century thinkers
