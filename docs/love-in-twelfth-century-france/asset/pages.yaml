    His Histoire de France, ed. Ernest Lavise; and Institutions seigneuriales, vol
    I (Paris, 1957) of Histoire des institutions françaises au moyen age, ed. Ferdinand
    Lot and Robert Taft. In Lordship and Community in Medieval Europe, ed. Frederic
    Cheytte (New York, 1968). The most thorough discussion of aristocratic patronage
    of literature is Retro R. Bezisola, Les origins et la formation de la littérature
