    measured, weighed, or analyzed into its chemical components. It reveals nothing
    in a spectrograph. But it is surprising that Western civilization, proud of its
    tradition of lucid rationality, has continued to tolerate a really deplorable
    laxity in the use of the term love.

    **Today a man can "love" his God, his country, his mother, his father, his wife,
    his work, his children, his neighbor''s wife, his sports car, his dog, and his
    bour-bon.** Some of these are expected to "love" him in return. The poverty of
    the English language seems to impose an impossible burden upon one little, four-letter
    "Anglo-Saxon"—a word of a kind usually noted for precision if not for delicacy.


    Unfortunately, the languages of twelfth-century France were no better. Unlike
    the educated American, the educated Frenchman of the twelfth century had at least
    two languages at his disposal, Latin and French. Twelfth-century writers learned
    their Latin from the pagan and Christian writers of ancient Rome and from the
    Vulgate Bible. They found the nouns *amor, dielectio, caritas* and the verbs *amare
    et diligere*, all meaning love. From these Latin words were derived the French
    *amour* (and its variants) and *charité*. One might have hoped that these rich
    resources, twelfth-century writers would have cleared up a little by carefully
    reserving each word for a certain kind of love. Unhappily, they did not. True,
    the Latin *caritas* was used only for a good love, usually Christian in character.
    True, the French *charité* had a similar usage, though it was already taking on
    the meaning of "charitable" service, alms-giving and the like. But


