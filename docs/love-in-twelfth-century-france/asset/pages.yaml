    # Love in the Legacy

    from the Past


    THE CULTURAL legacy inherited by the twelfth century was largely unwritten. Illiterate
    French knights treasured stories of their Frankish ancestors who rode with Charlemagne
    in campaigns against the Moslems, campaigns whose grandeur increased with each
    telling. From the misty highlands of Wales and from Ireland, where the Celts had
    taken refuge first from the Romans, then from the Angles and Saxons, and finally
    from the Normans, other tales of the fabled past filtered into France: tales of
    a great Celtic warrior Arthur who had long, long ago withstood the Saxon invaders
    of Britain; tales of the ill-starred lovers Tristan and Iseult; tales of dragons,
    of magic potions, of bridges made of sharp swords, and of magic potions of every
    variety. The old German and Celtic stories were told and retold through the centuries,
    changing


