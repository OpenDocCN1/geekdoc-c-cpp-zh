  md: '# BIBLIOGRAPHICAL NOTE


    and marriage, see John T. Noonan, Jr., Contraception: A History of Its Treatment
    by the Catholic Theologians and Canonists (Cambridge, Mass., 1965); the same author’s
    “Marital Affection in the Canonists,” Studia Gratiana, 12 (1967), 479–509; and
    the several articles on “Marriage” in the Dictionnaire de théologie catholique,
    9 (Paris, 1926), 2044–335. Useful works on individual authors are G. Raynaud de
