  md: 'The history of these courts is a confusing one, but one can impose an impressionistic
    pattern on the political maneuvering by dividing France and the twelfth century
    into halves. In the first half of the century, several dynastic houses competed
    for domination of the north while several others competed for domination of the
    south. In the second half of the century, the competition was for all of France,
    and it had been narrowed down to two families, the Capetians and the Angevins.


    Before about 1150, the contenders in the north were the Capetian kings (who controlled
    the vicinity of Paris), the house of Anjou (called “Angevin”), the house of Blois-Champagne,
    and, until his death in 1135, Henry I, king of England and duke of Normandy.

    In 1100, the Capetian King Philip I had only eight years to live of a life given
    largely to pleasure. The only notable conquest of his last years was Bertrande
    de Montfort, countess of Anjou, for whom he repudiated his wife and antagonized
    the pope. His son Louis VI—called “The Fat”—inherited his father’s corpulence
    but none of his indulgence. During his reign, from 1108 to 1137, he fought countless
    petty wars against surrounding warriors, some of whom, with no more than a single
    castle defied the king for years. His successor, Louis VII, was less impressive.
    A chronicler remarked about his performance on the Second Crusade, “He was able
    to do nothing useful, nothing memorable, nothing worthy of France.”1 That judgment
    is unduly harsh, Louis VII did not impress his contemporaries, and he has not
    much impressed posterity.'
