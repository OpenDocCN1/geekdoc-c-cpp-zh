  md: '# CHAPTER FOUR


    # The Courts


    THE ARISTOCRATIC court was a most unlikely place for love-poetry to flourish.
    The court was the principal room of a castle, and its main business was war. Most
    of the castles which dotted Europe were wooden towers with two or three rooms,
    but the more powerful nobles of France could boast of at least one stone castle,
    perhaps even one elegant as that of the counts of Flanders, still standing in
    Ghent. The weapons and armor of a warrior class shaped the lives of everyone who
    lived in these castles: the ruling family, the household knights, the clerks,
    servants, sycophants, and hangers. Like wood and stone, leather and steel, marriage
    was only part of the armory. The history of the courts is one of scheming and
    fighting to bring yet another castle and the land it dominated under control.
    The ultimate prize was all of France, and perhaps even more.'
