    De Plancu Naturae,” Speculum, 31 (1956), 64–74; Philippe Delhaye, Pierre Lombard:
    sa morale (Montreal and Paris, 1961); Gervais Dumeige, Richard de Saint-Victor
    et l’idée chrétienne de l’amour (Paris, 1952); and Etienne Gilson, Heloise and
    Abelard, L. K. Shook (Ann Arbor, 1960), and Leif Grane, Heloise and Abelard: Philosophy
    and Christianity in the Middle Ages, trans. Frederick and Christine Crowley-s
    masters, see Helen Waddell, The Wandering Scholars, 6th ed. (Garden City, 1961).


    On the fourteenth centuries, see Heer, The Medieval World, cited above, and J.
    Huizinga, The Waning of the Middle Ages, trans. F. Hopman (Garden City, 1956).


    The best introduction to the general history and philosophy of love is Irving
    Singer, The Nature of Love: Plato to Luther (New York, 1966), with the qualifications
    expressed in my review of that volume, “The Origins of Western Ideas: Journal
    of the History of Ideas, 20 (1968), 141–51. See also the learned and urbane Martin
    C. D’Arcy, The Mind and Heart of Love: Lion and Unicorn, a Study in Eros and Agape,
    rev. ed. (New York, 1956). For an anthology of readings on love, see The Idea
    of Love, ed. Robert G. Hazo (New York, 1967).'
