    and formless at one telling, artful at another, sometimes a short vignette, other
    times, as the late-autumn evenings grew longer, becoming long, complex, with countless
    digressions. They were the legacy of everyone, even of the illiterate. But an
    even more awesome treasure awaited the man of learning.


