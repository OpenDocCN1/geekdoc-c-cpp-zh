    All of these ideas were found in twelfth-century libraries; but the medieval reader
    found that Roman civilization bequeathed to him Christian authors as well as pagan.
    By the end of the fourth century, the Roman Empire became officially Christian.
    Some of the best minds of the day brought their talents, not to the faltering
    Empire, but to the rising Christian Church. St. Ambrose, a Roman statesman from
    a noble family in Gaul, became bishop of Milan. St. Jerome, born of wealthy parents
    in Illyria, received a superb Roman literary education and used his skills to
    translate the Bible into Latin. And St. Augustine, born in Roman North Africa,
    abandoned a career as a distinguished teacher of classical rhetoric to become
    the bishop of his home town, Hippo. The works of these and other Christian Romans
    abounded in medieval libraries, and they passed on to the middle ages both the
    new Christian ideas and Christian variations on the pagan ideas already familiar.'
