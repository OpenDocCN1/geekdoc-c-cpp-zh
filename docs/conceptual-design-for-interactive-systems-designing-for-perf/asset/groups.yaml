    Now that we have four simple applications as examples, let us think about them.
    We know that the four applications support users in achieving the same goals:
    set an appointment, set a recurring appointment, and set a reminder for the appointment.
    They look and behave differently. Why? There is an obvious answer: each application
    runs in a different interaction channel. The design of each application complies
    with the native look and feel of the respective channel.


    However, is that all that is different between them? Moreover, does it matter?
    Here is the thesis of this book: there are differences that are more fundamental,
    and yes, they do matter. To elaborate, we shall discuss the conceptual model and
    show the fundamental differences and their impact. However, before we do that,
    let us consider one more aspect.


    You probably noted that the description of the interaction flow in each of the
