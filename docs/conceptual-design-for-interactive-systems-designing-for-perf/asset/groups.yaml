    ## The Detailed Layers


    The analysis so far dealt with the conceptual model at a relatively high abstraction
    level. That is, the elements in the model are void of any details. Now, we have
    reached the layers where we see more details in the concept. This is a transitional
    layer where decisions influence the conceptual model and consequently performance
    and usability, on the one hand, and introduce details into the design, on the
    other hand.


    ## FORM: DETAILED CONCEPTUAL ELEMENTS


    In the form layer, the conceptual elements have some details from each of the
    chunks (information, parameters, and actions) in consideration of the physical
    assignment and the navigation map and policy. Detailed conceptual design involves
    preliminary decisions about the controls and preliminary visual design considerations
    (for a visual user interface).


    There could be *several granularity levels* for the transitional phase between
    conceptual to detailed conceptual elements. These depend on the definition of
    the functional chunks


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_53_0.png)


    ### FIGURE 7.1:

    Two granularity levels of conceptual model in the form layer.


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_54_0.png)


    The left-hand element shows the granularity levels for a given conceptual model.
    The right-hand element shows the design-with "distractions." Note that this granularity
    level still lacks detail, the right-hand element has the parameters and controls
    the user interacts with.


    Decisions about controls are typically a two-step process. One is fine-tuning
    the decisions about physical places. For example, the designer can assign several
    conceptual elements to the same physical place such as window or web page. Decisions
    span the transition from conceptual to detailed design, because on one hand, they
    reflect the functional chunks and their interrelations and can affect the conceptual
    model, and on the other hand, they involve decisions about specific controls.
    Such decisions may include example whether setting a numerical parameter will
    be done by entering a number into a text field or selected from a predefined list
    or via a spinner-type control (see examples in the right-hand sketch in 7.1).


    Finally, determining initial visual design is also part of the transition from
    conceptual to detailed design. Overall, visual layout reflects the functional
    chunks and their interrelations and can affect the conceptual model and its implications
    (e.g., impact on visual search).


    ## DETAILS: USER INTERFACE ELEMENTS


    As the design process unfolds, we reach the top layer in the conceptual and detailed
    design framework: the details layer. We add more details to the elements making
    up the user interface. Such details include finalized decisions about controls,
    visual layout, graphic design (e.g., colors, fonts, and icons), terminology, and
    any other issues regarding navigation policy and operational principles.


    ![](0d8a14fde3082fc884c0d2b2be68fd9_55_0.png)


    This book addresses primarily the layers and phases pertaining directly to the
    conceptual model and conceptual design. It does not address the detailed design
    aspects.

