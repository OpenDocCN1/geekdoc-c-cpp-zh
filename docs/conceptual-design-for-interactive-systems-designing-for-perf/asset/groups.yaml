    and the needs for their representation. Figure 7.1 shows two granularity levels
    for a given conceptual model element in the form layer. The left-hand element
    shows the design decision that the conceptual model element contains a functional
    chunked of subchunks, all of them assigned to the same physical place. Note that
    this granularity level still lacks detail, allowing the design and evaluation
    of the fundamental structure of the conceptual model with "distractions." The
    right-hand element has the parameters and controls the user interacts with and
    a more detailed visual layout.


    Decisions about controls are typically a two-step process. One is fine-tuning
    the decisions about the physical places hosting the conceptual elements and the
    navigation policy. For example, the designer can assign several conceptual elements
    to the same physical place such as a window or a web page. Such elements would
    be those that the users need to see or act upon together, interaction with one
    element following the other. However, the designer can fine-tune the decision
    to place the conceptual elements in separate areas on the window or under tabs
    selected through a menu. Decisions span the transition between conceptual and
    detailed design, because on one hand, they reflect the nature and relations between
    functional chunks and impact navigation map and policy, and on the other hand,
    they involve decisions about specific controls. This brings us the details in
    the UI. On top of that, the transition phase between conceptual and detailed design
    can include decisions about specific controls that have negligent impact on the
    conceptual model. Such decisions may include, for example,'
  - '[PAGE 55]


    whether setting of a numerical parameter will be done by entering a number into
    a text field or selected from a predefined list or via a spinner-type control
    (see examples in the right-hand sketch in Figure 7.1).


    Finally, determining initial visual design is also part of the transition from
    conceptual to detailed design. Overall, visual layout reflects the functional
    chunks and their interrelations and can affect the conceptual model and its implications
    (e.g., impact on visual search). Another aspect of visual design is a choice of
    a metaphor. As examples, the desktop and the hand calculator are enduring visual
    metaphors for many operating systems and applications. A choice of an appropriate
    metaphor is highly relevant to users'' mental models. The metaphor could fit existing
    mental models (e.g., a visual metaphor of a pocket calendar could be appropriate
    for a calendar application) or could support users in constructing a new mental
    model that can facilitate a better understanding of an application.


    # DETAILS: USER INTERFACE ELEMENTS


    As the design process unfolds, we reach the top layer in the conceptual and detailed
    design framework: the details layer. We add more details to the elements making
    up the user interface. Such details include finalized decisions about controls,
    visual layout (e.g., exact locations of controls and information items), graphic
    design (e.g., colors, fonts, and icons), terminology, and any other issues regarding
    navigation policy and operational principles.


