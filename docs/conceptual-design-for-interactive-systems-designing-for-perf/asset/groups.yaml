    # NAVIGATION POLICY: THE “RULES OF THE ROAD”


    Effective map and route instructions must include the rules that govern the navigation.
    Can we go anywhere where we want at time? Similarly, the conceptual navigation
    map must include those rules, which we refer to as the navigation policy.


    Design decisions regarding the conceptual navigation map go in hand with decisions
    regarding the physical places and the policy of the navigation. These decisions
    must consider a fundamental question: Should the user be able to perform more
    than one task at a time? In terms of interaction flow, the implications of this
    question are: Is the user required to fully or partially complete a task before
    moving to the next task, and is the user required to complete a given task, move
    on to another task and complete it, and then return to the original task?


    In terms of the conceptual model, the policy deals fundamentally with the challenge
    of modality: While interacting with a conceptual element in a physical place,
    can the user interact with another conceptual element, in the same physical place
    or different places? When the answer to this is yes, we refer to it as a modelless
    policy. A modelless conceptual element allows interactions with other conceptual
    elements at the same time. When the policy confines the user to interacting with
    only one conceptual element in a single physical place at a time, we refer to
    it as a modal policy. A modal conceptual element is one that does not allow interaction
    with any other conceptual element at the same time.


    The conceptual navigation map in Figure 6.4 is an example of the relations between
    the navigation policy and the physical places of the conceptual elements. The
    navigation policy shown in part A of Figure 6.4 allows the user to interact simultaneously
    with conceptual element 2 in "place" and with element 3 in "place" 3. The physical
    assignment is such that the user can then close model element 3, conclude the
    task with conceptual element 2, and go back to conceptual model element 1, which
    is in "place" 1. The navigation policy shown in part'
