    ## 概念模型的组件概述：根据分层框架


    我们将所有内容整合在一起。具体来说，概念模型的三个关键方面：功能块（functional chunks）、概念元素的配置（configuration of
    conceptual elements）以及导航与策略（navigation and policy），已经在前面分析过了。


    | 应用 1 | 应用 2 | 应用 3 | 应用 4 |

    |---|---|---|---|

