    # 形式：向详细设计过渡


    # 131


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_147_0.png)


    图 18.1：

    书籍的视觉隐喻与电子阅读器中基于触摸的滑动操作原理的结合。


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_147_1.png)


    图 18.2：

    标签页（Tabs）作为概念元素的物理载体，具有独特的视觉隐喻。


    概念元素意味着某种视觉外观。标签页是对我们在现实世界中熟悉的文件的标签的隐喻（图 18.2）。使用标签页是否意味着我们正在采用桌面类型的隐喻？并不是，因为将标签页用作互斥概念元素的载体是常见的，而且它们会根据交互通道及其原生样式有不同的不同的外观。然而，我们应该意识到隐喻是可以被“破坏”的。回到上面讨论的书籍隐喻，图
    18.1 中的右侧图片显示了在书籍隐喻上叠加带有各种功能的工具栏，这破坏了隐喻并将用户带回了应用程序的标准外观。


    选择隐喻的步骤：

    1. 确定是否有必要使用隐喻。基于用户研究的结果来决定。

    2. 熟悉他们生活、工作、社会和文化中常用的隐喻。

    3. 利用用户研究来考虑心理模型。

    4. 确定你可以利用隐喻走多远（参见上述书籍隐喻作为隐喻破坏的示例）。

    5. 考虑原生和传统的隐喻（例如，文件）。

    6. 考虑产品本身。


    # 添加细节


    到目前为止，概念模型处于一个较高的抽象水平。选择隐喻可以帮助过渡到为概念模型添加更多细节。即使在将概念元素分配给物理位置时，其表示也是以占位符的形式存在的。一旦我们评估并验证了模型，就可以开始添加细节了。具体来说，我们从功能块（functional
    chunks）开始添加细节。每个功能块的细节源于用户研究和进行的分析。细节可以包括以下内容：


    - 操作（Actions）——区分在功能对象上执行的导航操作。导航操作是那些能够遍历概念模型的动作，例如，打开或关闭窗口、点击标签页移动到另一个概念元素，以及打开文件。功能对象上的操作可以主要从操作分析中得出。功能对象上的操作包括对象的创建、修改或删除（例如，在跑步示例中创建一个新的训练计划）。

    - 参数（Parameters）——通常，每个功能对象都关联着帮助用户定义其自身的参数。在跑步示例中，以公里为单位计划距离是帮助用户定义训练计划的参数之一。请注意，由于这一步是向详细设计的过渡，而不是详细设计的定稿，因此不需要确定让用户定义参数的最终用户元素。例如，计划的公里距离可以在简单的文本字段中设置，可以在带有计数器控件的文本中设置，或者从预设的距离列表中选择。

    - 信息（Information）——任何非用户定义的静态或动态信息。信息可以包括任何从外部源接收的而非由用户输入或设置的信息、营销信息、解释和描述、标题和说明文字、参数标签以及用户引导（图
    18.3）。


    # 开发完整的故事板


    在为设计添加了细节并进行了原型制作后，我们现在可以将所有内容整合成一个故事板。故事板起源于视觉艺术，主要是电影和视频，后来进入数字媒体。其基本思想是以视觉图形的方式呈现，以说明故事中情节的顺序。故事板被应用于需求收集（Andriole,
    1992）、基于场景的设计（Carroll, 2000）以及用户界面设计（Landay & Myers, 2001）。


    将故事板作为概念设计过程的一部分的想法是，根据我们从研究中使用的场景和分析，通过关键交互流来表示完整的概念模型。详细的故事板是沟通和测试概念模型的强大工具。我们可以以用户场景的形式来呈现它（参见图
    18.4）。


    呈现故事板的另一种方法是创建一个导航地图，将原型化和详细的概念元素与我们到目前为止所使用的导航地图进行对比（图 18.5）。


    Jake 第一次使用该应用程序时，他从设置屏幕开始。他首先进行设置，然后配置 HR 监测器来监控应用程序。作为他计划的一部分，他定义了几个计划中的训练项目。


    从设置屏幕，他导航到计划训练屏幕。他设置了一系列计划在不同时间跑步的距离。


    当他跑步时，他会看一眼手机屏幕，并计算他故事映射中的情节顺序，将他的跑步表现映射到显示他所在位置的地图上。


    一旦他完成了跑步，应用程序就会切换到摘要屏幕，他可以在那里查看性能参数。他还可以访问之前跑步的摘要。


    图 18.4：

    跑步示例的部分故事板，以故事的形式呈现移动端通道。


