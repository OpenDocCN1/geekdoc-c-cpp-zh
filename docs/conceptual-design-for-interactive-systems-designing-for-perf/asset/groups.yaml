    图 13-5：一个针对跑步示例的简单旅程图示例。旅程中红色矩形框出的部分突出了根据场景判断用户体验较差的阶段。


    可用性与用户体验需求。此类需求的制定是用户研究的重要成果。


    在实践中，拥有可用性需求意味着什么？记住，例如，效率和效果之间可能存在权衡。我们决定模型是否应该在可能牺牲效率的代价支持有效的交互，或者反之亦然，并将其制定为需求。除了作为用户研究的成果外，确定可用性需求还应与产品的战略方面相关。


    ## 战略方面


    让我们回到战略性的理解和思考。我们必须意识到业务目标，并确保这些目标通过概念模型直接或间接地实现。这包括理解开发产品的动机以及其他业务考量，如合作伙伴、品牌建设和未来计划。另一个重要方面是作为项目管理设计和开发的方式。


    ### 用户研究——关键实践要点

    - 去做！让所有团队成员和利益相关者参与。

    - 明确定义你的研究问题。

    - 考虑能够回答研究问题的数据源和收集技术。

    - 识别用户画像，开发人物模型，并针对每个情境场景。

    - 执行任务分析并勾勒工作流。

    - 映射对象和动作。

    - 映射用户旅程和体验。

    - 制定可用性和体验需求。

    - 考虑更广泛的业务方面。


    请注意，对战略方面的考虑包含在这里，作为先决用户研究的一部分。换句话说，你应该收集和分析的一些数据应该包括产品和项目的战略方面。


    我们现在准备好开始概念设计并构建概念模型了。正如你所看到的，从研究到设计的转变并没有什么魔法或神秘色彩。以下是几个桥接研究与设计之间感知到的神秘鸿沟的条理化步骤。


    ## 功能块：构建核心基础


    在概念设计的的第一步中，我们定义功能块（functional chunks）。这是我们为系统主题建立秩序的步骤。在网站世界中，这等于构建信息架构的第一步。在这一步中，我们高度依赖之前进行的用户研究和分析。如任务分析和对象-动作映射等分析指导我们定义功能块及其之间的链接。


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_105_0.png)


    ## 这一步包含什么？


    当我们从功能层面开始时，有三个活动：


    1. 定义功能块。

    2. 将它们连接起来。

    3. 暂停并自我检查。


    ## 定义功能块


    我们从功能开始。基于我们进行的研究，功能是共同构成产品主题的各种动作、元素和参数。构建概念模型的第一个活动是将功能分组为块。定义功能块的关键驱动因素是什么？让我们在这里考虑两个：


    *先验的 (A priori)*：有时，对于如何划分功能存在*先验*的考虑。这些考虑可能受业务考量、市场趋势、品牌策略、产品底层技术的反映，以及对用户如何感知主题（换句话说，他们的心理模型）的良好呈现。


    *涌生的 (Emergent)*：块产生于实证发现过程（例如焦点小组、卡片分类或使用 KJ 方法，来自任务分析，或基于对象-动作分析）。


    无论分组是*先验的*还是涌生的，我们都希望这些块是有意义的。什么是有意义的块？让我们从简单的功能块开始，稍后将其转换为复合块。


    ## 任务导向的功能块


    *定义*：任务导向功能块的核心是一个任务。适用性：当任务导向的功能块符合用户的心理模型，且工作流反映了面向对象的交互时，定义任务导向的功能块。


    在图 14.1 和 14.2 所示的跑步示例中，任务导向功能块的核心是任务。移动端（图 14.1 顶部）的任务导向功能块如下：设置、计划训练、跑步和评审。同样，桌面端（图
    14.1 底部）的任务导向功能块为：


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_107_0.png)


    图 14.1：基于跑步示例中任务分析的简单任务导向功能块，用矩形表示。移动端的功能块在上方，桌面端的功能块在下方。


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_107_1.png)


    图 14.2：基于跑步示例任务流的简单任务导向功能块，用背景矩形表示。


    ## 概念设计：一种方法论


    基于工作流（图 14.2）的任务导向功能块如下：设置、跑步和评审。我们稍后将它们转换为概念模型元素。


    ## 面向对象的功能块


    *定义*：面向对象的功能块的核心是项目领域中的对象。应该在领域对象或主题对象与实现对象之间做出清晰区分。在寻找面向对象的功能块时，这些块必须反映主题中的对象。适用性：当


    - 它们符合用户的心理模型，

    - 工作流反映了面向对象的交互。


    在图 14.3 所示的跑步示例中，面向对象的功能块的核心是一个对象。移动端的对象是“训练”（Workout），其中计划、实时和之前的训练是该对象的实例。同样，桌面端的对象是图
    14.4 所示的“训练”（Workout），其中计划的和之前的训练是该对象的实例。


    图 14.3：

    跑步示例中

    移动端的面向对象的

    功能块。


