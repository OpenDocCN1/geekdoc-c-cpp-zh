  mdcn: "\n\n![](img/03d8a14fde3082fc884c0d2b2be68fd9_135_0.png)\n\n图 17.1：\n桌面通道概念模型运行体验示例中，概念元素的物理位置分配。使用\
    \ Balsamiq 构建，网址为：http://balsamiq.com/。\n\n导航策略：定义“道路规则”\n119\n\n# 概念设计：方法论\n\n\
    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_136_0.png)\n\n图 17.2：\n移动端（小屏）通道概念模型运行体验示例中，概念元素的物理位置分配。使用\
    \ Balsamiq 构建，网址为：http://balsamiq.com/。\n\n# 定义策略\n\n导航策略是你在概念设计阶段应该处理的重要问题，它与概述导航地图以及将概念元素分配到物理位置相辅相。这里是对导航策略的回顾。该策略从根本上处理的是模态（modality）的挑战：当用户与物理位置中的某个概念元素交互时，他们还能与相同或不同物理位置的另一个概念元素交互吗？在做出导航和交互策略的决策时，我们遵循与确定概念元素向物理位置分配时相同的标准。\n\
    \n在将概念元素分配到物理位置时，你做出了大部分的模态决策（示意性示例，请参考本书入门部分的表 6.1）。要确定策略决策，请执行以下操作：\n\n**细化分析的含义：**\
    \ 重新审各种分析的结果以及概念元素之间的亲和性。我们同时交互和看到的元素应该是独立的。换句话说，无论它们被分配到相同还是不同的物理位置，它们之间都不存在模态关系。\n\
    \n**遵循特定通道的视觉效果和感受指南及约定：** 在大屏交互通道中应用模态（modal）或非模态（modeless）策略，需要将窗口、对话框和屏幕定义为彼此之间的模态或非模态。然而，在小屏通道中，我们往往最终得到互斥元素，仅仅是因为它们由于尺寸限制无法同时显示和访问，而不是出于刻意的设计决策。\n\
    \n在遵循了运行示例中概念元素物理分配的初始决策后，我们开始检查导航策略。该示例的导航策略细节见表 17.3。我们可以看到，在模态方面，两个通道都有相应的策略，尽管它们对概念元素的物理分配不同。使用物理位置分配的标准，我们可以看到对于桌面通道，设置任务的位置和锻炼元素的位置是互斥的，尽管它们都在同一个地方。同样的模态也适用于移动端通道：不同概念元素的位置是互斥的，但它们被分配到了不同的物理位置。\n\
    \n# 概念设计：方法论\n\n| 模态 (Modality) | 同一位置——互斥 | 不同位置——互斥 |\n| --- | --- | --- |\n\
    | 交互通道 | 桌面 | 窗口 1 | |\n| | 移动端 | | 对话框：执行这个还是那个？[否] [是] |\n\n表 17.3：运行示例中每个通道的导航策略\n\
    \n# 检查点：回顾与修改\n\n此时，我们已经有了一个完整的概念模型，包含所有的概念元素和相互关系，所有元素均已分配到物理位置，并有导航地图和策略。我们还拥有初始原型形式的模型。这是一个停下来进行另一个检查点并评估我们现状的好时机。\n\
    \n# 交互通道的其他影响：操作原则\n\n# 运行体验示例：回顾导航地图和策略\n\n- 1. 收集更多关于设置和个人账户更改频率的数据。此外，收集跑步者对使用移动设备的熟悉程度，以及他们在跑步前、中、后如何使用设备。\n\
    - 2. 考虑更改通道的物理分配和策略，特别是移动端，由于使用的限制条件（如户外、天气光线条件以及疲劳）。\n- 3. 重新考虑是否需要主入口屏幕，并考虑将其他元素作为默认入口处，提供访问所有其他元素的路径。\n\
    \n到为止，我们非常关注交互通道的特征。某些物理分配决策是基于这些特征的，反过来影响了导航地图和策略。现在要问用户与通道交互的物理方式是否也会影响关于概念模型的设计决策。回我们称之为交互的操作原则（operational\
    \ principles）。参考书第一部分的表 6.2 以复操作原则。\n\n要考虑交互通道的操作原则，请遵循以下步骤：\n\n- 识别并理解通道的操作原则（即物理交互的特征）。\n\
    - 根据用户研究，通过以下问题考虑哪些操作原则是相关的：\n  - 它符合用户画像（persona）吗？\n  - 它符合使用场景（context）吗？\n\
