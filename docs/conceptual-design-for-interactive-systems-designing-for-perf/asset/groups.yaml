    outcome as early as possible. Thus, spending time in up-front user research may
    seem by some a waste of time, rather than a critical investment. Moreover, the
    work associated with the up-front development of the conceptual model fundamentals
    could also be seen as time that rather be invested in actual development. Other
    published work provides some great ideas and perspectives on the place and role
    of designing positive UX and usability in agile and lean development processes
    (Gotthelf & Seiden, 2013; Ratcliffe & McNeil, 2012). The methodology outlined
    here assumes that some user and usage research have been conducted prior to embarking
    any of the design and development activities.


    # Multi- and cross-channel design and development strategy


    Systems and products are designed and developed in such a way that they can run
    on multiple devices in multiple contexts. Moreover, users can start a task on
    one device and continue/complete the task on another device. This is referred
    to as multichannel or cross-channel interaction and experience, where channel
    is defined as the venue through which a user interacts with the subject matter
    or content domain of the application/product/system. In the computerized interactive
    systems realm, a channel is most often device such as a desktop computer, a mobile
    device, an information booth or kiosk, an interactive voice response system, or
    any embedded interactive device (e.g., in-vehicle built-in navigation system).


    The priorities within the project respect to designing user interface, interaction,
    and UX for the various channels—when relevant—are set as a function of the business
    considerations. Updating an existing product due to user needs or new technology
    or other business goals could be realized in time of adding a new channel. The
    design and development of that channel will get the highest priority in such a
    context. In a context of a new product aimed to be realized on several channels,
    priority is given to one channel over others due to user needs or other business
    goals and considerations (e.g., competition and market needs and new partners).


    # The teamwork approach


    Whatever the design and development approach is, a multidisciplinary team approach
    is critical for ensuring the inclusion of usability and UX considerations throughout
    the life cycle of the product. Moreover, it is critical for usability and UX design
    professionals to perform their task effectively. Usability and UX design professionals
    must work with users or user representatives. In addition, team with other professions
    such as business, marketing, sales, engineering, software developers, graphic
    and industrial designers, and technical writers. Finally, and maybe indirectly,
    work with other stakeholders such as business partners, investors, and other providers
    to take into consideration their goals and concerns.'
