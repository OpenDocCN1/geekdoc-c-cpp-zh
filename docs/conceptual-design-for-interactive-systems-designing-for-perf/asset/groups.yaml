    ## 第 15 章：配置：绘制你的第一份概念模型草图


    我们希望尽快得到可以展示的内容。虽然整合功能分块（chunks）和功能架构是我们应该与所有利益相关者共享的重要步骤，但仍然很难清楚地看出用户界面本身将从此演变。在配置步骤中，我们绘制一个看起来像模型的东西，你甚至可以在抽象层面上说明用户将如何与之交互。这就像是你的第一个“餐巾草图”，即概念的首次可视化。


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_115_0.png)


    > ### 步包含什么？

    配置层的活动包括：

    1. 定义并配置概念模型元素。

    2. 识别关键元素（pivotal elements）。

    3. 重新配置模型。

    4. 检查。


    ## 定义并配置概念模型元素


    一旦你定义了功能分块（无论是简单的还是复合的），你现在就可以它们转换为概念模型元素。正如入门介绍中所解释，功能分块更抽象的表示有助于对概念模型的理解、进一步开发和评估。配置概念模型有两个步骤：


    +   1. 将每个功能分块表示为概念模型元素。在这一阶段，我们可能有简单的任务导向或对象导向型功能分块。此外，我们还有预期的交互流。无论它们的类型和简单程度如何，我们都应该抽象出最符合交互流的分块。因此，我们可能会得到代表某些任务导向和/或某些对象导向的概念模型元素。参见图
    15.1 中运行示例的概念元素。注意，某些对象表示为工作流，而某些任务则表示为查看和分享。


    +   2. 在相关时，根据元素之间的链接定义复合概念元素，而这些链接又基于功能分块之间的链接。注意，在此时，链接并没有传达完整导航地图的所有细节。参见图
    15.2，包含移动端和桌面端的交互通道。


    生成的配置是概念模型的基础。


    ## 在配置中寻找关键元素


    概念模型应该具有意义的配置。仅仅连接概念元素并不总能传达有意义的配置。你应该


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_116_0.png)


    ## 绘制你的第一份概念模型草图 101


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_117_0.png)


    图 15.2：运行示例中的复合概念元素，基于简单功能分块之间的链接，左侧为移动交互通道，右侧为桌面通道。


    观察它，它应该对你来说是合理的。它本身应该讲述产品的故事。一个有意义的配置是能够很好地表示心理模型，或者能够容易引发新的心理模型，从而有助于理解、工作流，或业务和品牌考虑的平台与约束。寻找有意义的配置是将一组链接的元素转换为连贯概念模型的关键步骤。入门介绍中介绍和讨论的概念模型分类是连贯模型最常见的示例。


    为了评估配置并将其转换为有意义的配置，请问问自己是否存在一个或多个紧密链接的元素可以被视为关键元素。例如，在人类与交互系统体验的背景下，关键概念包括在文字处理程序中编写文档、在演示文稿中准备幻灯片、在绘图程序的画布上画草图、在日历应用中设置预约、编写并发送推特或监控自动过程。


    关键元素是指符合以下一项或多项标准的元素：


    +   * 使用频繁，

    *   关键且必不可少，

    *   最稳定状态，以及

    *   最能代表业务目标和/或品牌。


    通过回顾以下内容来寻找关键元素：


    +   * 用户画像和场景，

    *   任务分析，

    *   关键用户界面和可用性需求，

    *   业务目标和品牌考虑，

    *   使用上下文，以及

    *   设备/通道限制。


    在运行示例中，根据用户研究，我们可以找到两个关键元素：锻炼（workout）和当然还有跑步（running）（见图 15.3）。锻炼元素似乎一致出现在移动端和桌面通道的所有任务和所有工作流中。用户在跑步之前、期间和之后都会与锻炼元素交互。另一个呈现为关键元素的是任何与跑步有关的事：计划、参与以及稍后查看。跑步元素对于主要服务该目的的移动通道来说尤为关键。


    需要强调的是，概念模型中的关键元素并不一定在字面上位于中心位置。在研究入门介绍中讨论的“枢纽模型”（hub and spokes model）时，模型的枢纽字面上位于中心，大多数交互发生在那里，在任何补充交互之后，用户都会返回那个中心位置——枢纽。相比之下，单序列模型或网络模型似乎没有这样的枢纽。然而，这些模型确实有关键元素。例如，在一个具有网络概念模型的网站中，首页可以是那个元素。在一个具有单序列的安装向导应用程序中……


    图 15.3：运行示例中关键元素的可能性。


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_118_0.png)


    ## 绘制你的第一份概念模型草图


    起始点可以是那个。在层级模型中，根节点可以是那个。


    ## 重新配置模型


    现在是时候回顾元素的配置以表达你所识别的关键元素了。这不仅仅是图形旋转或重新排列。目标是让重新配置的模型能够适应现有的心理模型，或者直观地引发一个新的心理模型。此外，重新配置将有助于勾勒导航地图。


    在运行示例中，我们选择了关键元素，因为它出现在两个通道的工作流和任务中，如图 15.4 和 15.5 所示。注意两个通道的模型都有几个复合元素：锻炼、跑步前准备（prerun）和跑步后（postrun）。此外，移动通道的概念模型还有一个用于实时锻炼的元素。


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_119_0.png)


    图 15.4：运行示例中移动端的重新配置模型


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_120_0.png)


    图 15.5：运行示例中桌面端的重新配置模型。


    ## 跑步示例：回顾配置与迭代


    ## 检查：回顾与修订


    +   1. 回顾关于两个候选元素（锻炼和跑步）的使用频率的用户研究数据。

    2. 在计划或回顾跑步时，考虑区分上下文和通道。

    3. 评估你是否拥有两个概念模型：一个用于实时跑步的移动通道，另一个用于非跑步上下文的其他通道。


    在此时，我们已经有了一个模型：表示了功能分块及其相互关系。现在需要回顾的一个方面是配置，即表示关系的链接。特别地，如果你确定了一个关键元素，重新评估该决策是非常重要的。


    ## 项目管理考虑


    我们现在有了一个草图，换说我们有了用户界面的“架构计划”。现在可以分享了吗？假设你与利益相关者（特别是用户）密切合作，你应该与他们分享它。利益相关者应该对这种表示提供初步反馈，它将演变为详细的'
