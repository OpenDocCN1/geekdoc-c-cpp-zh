    # NAVIGATION POLICY: DEFINE THE "RULES OF THE ROAD"


    support and facilitate interaction in the more challenging contexts, which are
    the ones that may include increased cognitive, or emotional, or physical workload
    on the user.


    # The interaction channels


    The interaction channel is a very influential consideration when assigning conceptual
    elements to physical places. Interaction channel characteristics include stationary
    vs. model, screen size, interaction devices (e.g., keyboard and mouse, touch,
    buttons, gestures and movements, gaze, and others), native style of look and the
    associated context of the channel (e.g., performing a financial transaction through
    an automated banking machine or through the bank''s website or through a dedicated
    application on a small screen is typically associated with different contexts).


    Of the various characteristics, screen size and the native style of look and feel
    tend to be the most influential factors on the decision of physical assignment
    of conceptual elements. Simply put, a small screen introduces a serious obstacle
    to assigning several conceptual elements to a single physical place. The small
    screen size may result result in considerable amount of scrolling and panning
    to reach all elements within the single physical place, or the size of elements
    will be decreased to fit better the small screen making them less legible.


    Nevertheless, assigning conceptual elements to one or few physical places can
    still be associated with a small-screen interaction channel. For example, a website
    originally designed for a large-screen desktop interaction channel can be adapted
    to the small screen via responsive design techniques. The resulting design ensures
    that the elements are not too small and support effective viewing, but they are
    still different places on a single web page, which requires scrolling and panning.
    Such an approach has the obvious benefits of not having to redress the website
    to small-screen channels, and a similar conceptual and detailed design can be
    implemented across channels.


    The characteristics of the interaction channel can sometimes overturn decisions
    made based on performance goals, consideration of analyses outcomes, and contextual
    factors. In other words, a design decision to assign several elements to a single
    physical place may be overturned if the intended interaction channel has a small
    screen. This may also be associated with typical contextual factors for using
    small-screen devices as mobility, being outdoors, experiencing environmental factors
    such as lighting and stability, and being in personal and social contexts that
    introduce more distractions and interruptions.


    # Business and brand considerations


    Last, but definitely not the least, the consideration of business objectives and
    implications of branding. A plausible requirement can be include elements expressing
    the product brand, upselling, or cross selling (depending upon business partners).
    Including such elements requires their assignment to physical places, which in
    turn can impact the physical assignment of all other conceptual elements.'
