    Summary: Conceptual Design Methodology in a Glance


    As a way of summarizing, let us now take the entire methodology and sum it up
    as a 1-2-3 step process. Here is the idea:


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_153_0.png)


    - 1. Sketch the conceptual model: Sketching the conceptual model spans three layers
    in the framework, from defining functional chunks, to configuring the model, to
    delineating the navigation map.


