    # 网络概念模型示例


    网络概念模型的一个示例是某商业航空公司的网站。该网站在多个页面中包含多个概念元素。图 10.10 中的示例强调了用户到达同一目的地可以采取的多种导航路线。为了从主页导航到“航班延误与取消”页面（图
    10.10 中的路线 1），用户可以在主页选择“信息与服务”选项（图 10.10 中的 A），进入“信息与服务”页面（图 10.0 中的 B）。在该页面中，用户可以选择“航班延误与取消”选项并导航（图
    10.10 中的路线 2）到“航班延误与取消”页面（图 10.10 中的 C）。在主页到达“航班延误服务”选项的另一种方法（图 10.10 中的路线 3）。


    图 10.10：

    网络概念模型的示例。


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_78_0.png)


    # 概念模型的分类学


    另一个示例是导航到“航班状态”页面（图 10.10 中的 D）。实现此操作的一种直接选项位于主页，它可以直接进入“航班状态”页面（图 10.10 中的路线
    4）。另一条路线是从“延误与取消”页面，通过在该页面选择“航班状态”选项来实现（图 10.10 中的路线 5）。


    # 混合概念模型


    很难发现上述任何一种模型类型是作为任何独立应用程序的唯一且排他的模型。在大多数情况下，概念模型是此处列出的几种类型的混合体。例如，一个应用程序可能包含一个基于单序列概念模型的安装组件，然后
    是一个用于启动多个工作流的层级模型，每个工作流又引导向一个用于特定任务的纽辐辐射模型。构建此类模型需要仔细考虑其对用户特征和任务的适用性。混合模型的相关性将在书中的方法论部分进行讨论。


    # 是否存在好或坏的概念模型？引入概念模型的复杂性


    人们很想问是否存在所谓的“好”概念模型。一种类型的概念模型是否比另一种更好？显而易见的答案是：这取决于具体情况。一个更合理的问题是，对于特定的上下文/任务，哪种模型或模型组合更为合适。每种模型分类学的概述部分都涉及这个问题，特别是在处理每种模型类型适用场景的章节中。现在，为了进一步讨论，我们从基本概念开始研究概念复杂性。


    让我们从基本概念开始：复杂的概念模型并不坏，简单的模型也不总是好的。一个概念模型的好坏取决于它对上下文/目标/任务/用户的支持程度。影响模型复杂性及其关系的关键特征如图
    10.11 所示。各种模型之间的区别主要在于它们支持任务结构化程度（图 10.1 中的横轴）的范围不同。任务和工作流在所需步骤的顺序以及尽可能减少过程中引入的决策点和导航分支方面可以是高度结构化的。简单来说，任务结构化程度越高，提供的效率就越高。支持任务结构化与概念模型为用户完成任务和实现目标时提供的自由度（图
    10.11 中的左侧垂直轴）相辅相成。


    # 概念模型——基础


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_80_0.png)


    图 10.11：

    概念模型分类学的总结与对比视图，其取决于其支持的任务的结构化程度、各模型的自由度以及由此产生的模型复杂性


    模型提供了……这通常体现在概念元素的数量、入口和出口的数量以及用户可以采取的可能路线上。模型提供的自由度越高，在执行各种任务和工作流时的灵活性和控制力就越大。这通常会导致更高的效率，特别是对于经验用户和专家。与单序列模型相比，网络模型为用户提供了更多自由度。与网络模型相比，单序列模型对于高度结构化的任务支持良好且适用。


    简单来说，复杂性是由许多许多方式相互关联的元素组成的系统或情况。根据模型提供的自由度和其支持的任务结构化程度来表征模型，对模型复杂性具有影响。支持高度结构化任务但自由度较少模型是简单模型。支持具有更多自由度的非结构化任务的模型是复杂模型。图
    10.11 中连接不同模型的曲线意味着，任务结构化程度、自由度与产生的模型复杂性之间的关系并不一定是线性的。换句话说，随着模型为结构化程度越来越低的任务提供越来越多的自由度，模型复杂性的增加可能会有所加速。


    正如本节开头所述，一个概念模型的好坏取决于它对上下文/目标/任务/用户的支持程度。一方面，模型越复杂，用户就越难以理解它们，这可能会影响学习、可用性和整体体验。然而，这并不以任何方式意味着复杂的概念模型是坏的。复杂的概念模型支持非结构化任务，并可能适用于经验丰富的用户。


    所以要问的问题是：给定给定的上下文/目标/任务/用户，什么是“好”的概念模型？


    # 第一部分总结


    书的这部分分析了概念模型及其重要性。以下是要点：


    - 概念模型的好坏取决于它对上下文/目标/任务/用户的支持程度。

    - 概念模型有几种分类：序列、层级、纽辐辐射和网络。

    - 不同模型的区别在于它们提供的自由度，从而产生不同的复杂性。

    - 支持高度结构化任务但自由度较少模型是简单模型。支持具有更多自由度的非结构化任务的模型是复杂模型。

    - 复杂的概念模型并不坏，简单的模型也不总是好的。

    - 概念模型通常是几种类型的混合体。


