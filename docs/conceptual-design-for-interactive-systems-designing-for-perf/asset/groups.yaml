    ## Conceptual Models

    Matter!: Implications to Human Performance, Usability, and Experience


    Earlier in the book, after introducing the four applications, the efficiency,
    and the usability, we asked what the fundamental differences between them are.
    Moreover, do those fundamental differences matter? The discussion of the conceptual
    model using the layered framework addressed the first question: do differences
