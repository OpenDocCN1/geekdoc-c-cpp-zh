    # An example for a network conceptual model


    The example for a network conceptual model is the website of a commercial airline.
    The website has multiple conceptual elements in multiple pages. The example in
    Figure 10.10 highlights the multiple navigation routes the user can take to reach
    the same destination. In order to navigate from the home page to the Delayed Flights
    & Cancellations page (route 1 in Figure 10.10), the user can select the Information
    & Services option in the home page (A in Figure 10.10) leading to the Information
    & Services page (B in Figure 10.0). In that page, the user can select the Delayed
    Flights & Cancellations option and navigate (route 2 in Figure 10.10) to the Delayed
    Flights & Cancellations page (C in Figure 10.10). Another way of reaching the
    Delayed Flights Service option in the home page (route 3 in Figure 10.10).


    Figure 10.10:

    An example for a network conceptual model.


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_78_0.png)


    # A TYPOLOGY OF CONCEPTUAL MODELS


    Another example is the navigation to the Flight Status page (D in Figure 10.10).
    One immediate option for doing this is available in the home page, which leads
    directly to the Flight Status page (route 4 in Figure 10.10). Another route is
    from Delayed Flights & Cancellations page, by selecting the Flight Status option
    in that (route 5 in Figure 10.10).


    # Hybrid conceptual models


    It is rare to find any of the above model typologies as the single and exclusive
    model underlying any stand-alone application. In most cases, the conceptual model
    is a hybrid of several of the types outlined here. For example, an application
    could include an installation component based on a single-sequence conceptual
    model and then a hierarchy model for initiating several workflows, each leading
    to a hub and spoke model for specific tasks. Constructing such models requires
    careful consideration of the appropriateness to user profiles and tasks. The relevance
    of hybrid models will be discussed in the methodology part of the book.


    # IS THERE A GOOD OR A BAD CONCEPTUAL MODEL? INTRODUCING CONCEPTUAL MODEL COMPLEXITY


    It is tempting to ask if there is such a thing as a “good” conceptual model. One
    type of conceptual model better than another? The obvious answer is: it depends.
    A more reasonable question is which model or combination of models is more appropriate
    for a given context/task. Part of the overview of each model typology looked into
    this question, specifically in the section addressing what each model type is
    appropriate for. Now, to discuss this further, we examine the idea of conceptual
    complexity with basic.


    Let us start with a basic: Complex conceptual models are not bad, and simple models
    are not always good. a conceptual model is as good as it supports the context/goal/task/user.
    The key characteristics that may influence model complexity and their relations
    are represented in Figure 10.11. The various models differ primarily in the extent
    which they support the level of task structuredness (the horizontal axis in Figure
    10.1). Tasks and workflows can be highly structured in terms of the sequence of
    required steps and the minimization of decision points and navigation branching
    introduced along the way. As simple things go, the more structured the task, the
    more effectiveness is afforded. Supporting the task structuredness goes in hand
    with the amount of degrees of freedom the conceptual


    # THE CONCEPTUAL MODEL—FUNDAMENTALS


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_80_0.png)


    FIGURE 10.11:

    Summary and comparative view of the conceptual model typologies as a function
    of the level of structuredness of the tasks it supports, the degrees of freedom
    each, and the resulting complexity of the model


    model provides the user in accomplishing tasks and achieving goals (the left-hand
    vertical axis in Figure 10.11). This is typically reflected in the number of conceptual
    elements, the number of entry and exit points, and the possible routes a user
    can take. The more degrees of freedom the model provides, the more flexibility
    and control are afforded in performing a variety of tasks and workflows. This
    often results in higher efficiency, particularly for experienced and expert users.
    The network model offers the user more degrees of freedom in comparison to the
    single-sequence model. The single-sequence model is supportive and appropriate
    for tasks that are highly structured in comparison with the network model.


    Simply put, complexity is a system or a situation consisting of many elements
    interlinked in many ways. Characterizing the models in terms of the degrees of
    freedom they provide and the task structuredness they support has implications
    for model complexity. A model that supports a highly structured task with fewer
    degrees of freedom is a simpler model. A model that supports unstructured tasks
    with more degrees of freedom is a more complex model. The curve connecting the
    different models in Figure 10.11 implies that the relation between level of task
    structuredness and degrees of freedom, on the one hand, and resulting complexity
    of the model, on the other hand, is not necessary linear. In other words, the
    increase in model complexity can be somewhat accelerated as the model provides
    more and more degrees of freedom to support tasks that are less and less structured.


    As stated at the beginning of this section, a conceptual model is as good as it
    supports the context/goal/task/user. On the one hand, the more complex the model
    is, the more likely it will be harder for the users to understand them and this
    may impact learning, usability, and overall experience. However, this does not
    imply in any way that complex conceptual models are bad. Complex conceptual models
    support unstructured tasks and can be appropriate for experienced users.


    So the question is what is to ask: given the context/goal/task/user, what is a
    “good” conceptual model?


    # Summary of Part 1


    This part of the book analyzed the conceptual model and its significance. These
    are take-aways:


    - The conceptual model is as good as it supports the context/goal/task/user.

    - There are several typologies of conceptual models: sequence, hierarchy, hub
    and spoke, and network.

    - Different models differ in the amount of degrees of freedom they provide, which
    results in varying complexity.

    - A model that supports a highly structured task with fewer degrees of freedom
    is a simpler model. A model that supports unstructured tasks with more degrees
    of freedom is a more complex model.

    - Complex conceptual models are not bad, and simple models are not always good.

    - Conceptual models are often a hybrid of several types.

    '
