    # The Conceptual Model—Fundamentals


    So far, the preface and the title of this section suggested that a key concept
    in this book is the “conceptual model.” The objective of the first part of the
    book is to present the fundamentals of the conceptual model in interactive systems
    and discuss its impact. Briefly, a conceptual model is the configuration of conceptual
    elements and the navigation between them. As such, a conceptual model is the foundation
    of the user interface of any interactive system. However, before we proceed any
    further with abstract-sounding words and sentences, let us dive into an example.
    Designing an effective and consistent user experience across the interaction channels
    is challenging. We will put emphasis in the book on this challenge. The running
    example for this part of the book is a multiple and cross-channel interaction
    one.


    ## A Multiple and Cross Channel Example: Setting an Appointment


    In order to illustrate the fundamental components of the conceptual model, we
    introduce and analyze four existing calendar applications. Each of the four applications
    setting an appointment and each is on a different interaction channel. Such a
    comparative illustration can demonstrate how you can achieve the same goal using
    different conceptual models.


    The first step in the interaction flow is common to all applications: In order
    to set an appointment, the user can select a starting date and time by pointing
    at on the calendar or by activating an option.


    The sample calendar are on the following channels:

    - Desktop

    - Web-based

    - Tablet

    - Smartphone


    The first application is a Windows-based typically installed on desktop and laptop
    with a familiar graphical interface (GUI). In the calendar, the user can perform
    the following tasks:

    - 1. Setting the basic appointment: subject and location, in addition to controls
    to specify date and time

    - 2. Setting a reminder: a pop-down list to select the lead time for the reminder

    - 3. Setting a recurrence: frequency and range of dates


