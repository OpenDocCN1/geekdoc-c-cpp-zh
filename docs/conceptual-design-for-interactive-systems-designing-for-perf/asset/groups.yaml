    - 我们是否定义了用户是否应该从一个组到另一个组？例如，计划中的锻炼应该关联吗？

    - 我们是否确定了这些组应该显示在哪里？例如，计划中的锻炼应该单独显示还是在一起？

    - 以及更多...


    这些问题和示例反映了设计和开发交互式系统的方法论。特别是，它们反映了研究（图2中的1和3）与详细设计之间的差距。


    这本书关注用户界面设计过程中的一部分：概念设计。它是有效方法论的基础，是科学而非魔法。它填补了研究与设计之间的差距。


