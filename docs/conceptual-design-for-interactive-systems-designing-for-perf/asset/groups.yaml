    +   * Location awareness—medium

    * Visual search effectiveness—high

    * Operational (executing actions) load—low

    * Working memory load—medium


    Usability implications:


    +   * Learnability—fast and easy

    * Effectiveness—high

    * Efficiency—low

    * Satisfaction—likely medium to high


    Appropriate for:


    +   * Functional chunks that have many parameters and actions (all of them should
    be together to support task completion)


    +   - When the user tends to focus on one or several related main tasks most of
    the time and requires a single "place" to perform them

    - When additional, local, and temporary tasks supplement the performance of those
    tasks with little interruption to the main workflow


    # An example for a hub and spokes conceptual model


    In this example, the hub is a window hosting a conceptual element consisting of
    parameters and actions pertaining to the definition of a style in a word processing
    program. While the hub can include many of the style definition tasks, there are
    supplementary elements to fine-tune the setup of parameters. Each of these supplementary
    elements is placed in a modal window allowing the conclusion of the fine-tune
    setup of parameters and return to the hub before proceeding anywhere (Figure 10.6).


    FIGURE 10.6: An example for a hub and spokes conceptual model.


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_73_0.png)


    *Note*


    # Matrix


    Configuration: There are two key characteristics to the matrix conceptual model:


    +   1. There are several and parallel starting points (in contrast to the sequential
    and structured models that have a single starting point).

    2. There are at least two, related or independent, sets of such starting points.
    That is the reason it is named a matrix.


    Visualizing this model as having two dimensions expresses the strategy of having
    parallel interaction flows. In a matrix configuration with two independent dimensions,
    there is no functional or interaction flow dependency between the elements in
    one dimension and the elements in the other. In a matrix configuration with two
    related dimensions, an interaction with a given element in one dimension will
    determine the available elements in the other dimension.


    The two visualizations in Figure 10.7 reflect two common approaches to this model:


    +   A. Each of the parallel starting points in each dimension leads to a sequence
    of linked conceptual elements.

    B. Each of the parallel starting points in each dimension leads to a single conceptual
    element where most of the interaction is taking place.


    Conceptual navigation principles: There are multiple entry and exit points with
    no sequential dependency among them; the user can start at any of the points.
    Once the user enters an interaction flow at a given starting point, the relevant
    functional chunk or chunks may appear in a single place (B in Figure 10.7) that


    Figure 10.7:

    Two examples for a matrix conceptual model: A. Parallel, related or unrelated,
    starting points linked to a sequence or group of additional elements; B. Parallel,
    related or unrelated, starting points linked to a central element.


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_74_0.png)


    may include more than one conceptual element. Alternatively, entering an interaction
    flow at a starting point may invoke several conceptual elements assigned to several
    physical places (A in Figure 10.7). The navigation among those can be a single
    sequence or hub and spokes, or as will be discussed below, even a network-type
    navigation.


    Interaction policy: The matrix model allows for interaction with more than one
    conceptual element at a time.


    Performance implications:


    +   * Location awareness—medium

    * Visual search effectiveness—high to medium

    * Operational (executing actions) load—low to medium

    * Working memory load—medium


    Usability implications:


    +   * Learnability—medium

    * Effectiveness—medium

    * Efficiency—high

    * Satisfaction—likely medium


    Appropriate for:


    +   * When there are clear sets of starting points that can be organized as different
    dimensions.

    * When dependency between sets of starting points is relevant.

    * When the overall task structure is such that there is no single start or end.

    * When the user requires flexibility and control to initiate different tasks and
    workflows depending on the objectives.

    * There are parallel workflows with no particular order, importance, or priority
    among them.


    # An example for a matrix conceptual model


    The example for a matrix conceptual model is a web site. The site provides multiple
    starting points implemented as a horizontal row of tabs at the top of the page
    and the user can select any of those tabs at any time. There are additional starting
    points available once the user makes a selection in the horizontal dimension of
    the matrix. These two dimensions are dependent. Once the user makes the selection
    in the vertical set, the relevant element becomes available in the center of the
    page (similar to 10.7).


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_76_0.png)


    The implementation of the matrix concept does not necessitate a literal translation
    to the visual appearance; that is, both dimensions do not have to appear as orthogonal
    sets. They could represent dependent and independent sets (Figure 10.8).


    # Network


    Conceptual configuration: The model consists of multiple entry points and interlinked
    conceptual elements and physical places. The configuration provides the user with
    many degrees of freedom with respect to where to start interaction and how to
    navigate. Almost by definition, many websites have a network conceptual modeling
    (Figure 10.9).


    Conceptual navigation principles: The user can initiate interaction flows from
    multiple points. Since there are multiple links between conceptual elements, the
    user can navigate to some destinations in more than one route. In addition, the
    user may start on a given route and deviate to a different route without necessarily
    concluding the initial one. The user can exit at various points as well.


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_77_0.png)


    FIGURE 10.9:

    Two schematic depictions of a network conceptual model.

