    The configuration of the conceptual elements reflects the “places” users visit
    and the links between the “places” enabling the performance of tasks and accomplishment
    of goals. Comparing the four conceptual models in Table 5.1 indicates that each,
    while serving a similar function, is very different with respect to the number
    of conceptual elements and their configuration, particularly applications 3 and
    4 being very different from each other and from 1 and 2.


    The configuration of the conceptual elements by itself does not fully reflect
    the strength of the links between the elements. In addition, it does not provide
    the details of the navigation through the configuration. We still need the navigation
    map, the assignment of the conceptual elements to physical places, and the navigation
    policy. These are on the next layer in the conceptual design framework.


    # The Navigation and Policy Layer


    The spatial metaphor continues to serve us well in describing the conceptual model
    of interactive systems. We use the term “navigation” to describe users getting
    from one place to another. We use the term “navigation map” to represent the route
    instructions, as it-were, throughout the conceptual model. Here are some details
    about navigation and navigation maps.


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_41_0.png)


    ## THE CONCEPTUAL NAVIGATION MAP: MOVING BETWEEN CONCEPTUAL MODEL ELEMENTS


    The conceptual navigation map shows “routes” the user can or is required to take
    through the configuration to perform and conclude all required steps for a goal.


    - 1. The entry and exit points for starting and concluding the interaction.

    - 2. The direction of each link between conceptual elements in the configuration;
    some links are one-way and some are two-way.


    # THE CONCEPTUAL MODEL–FUNDAMENTALS


    Figure 6.1 shows one conceptual model configuration (configuration C from Figure
    5.1) with three different navigation maps.


    In conceptual navigation map C1, navigation starts and ends with conceptual model
    1. From that element, one can proceed to conceptual model 2 or 4. When one occurs
    the interaction at conceptual model 2 or 4, one navigates back to conceptual model
    1 in order to exit. Finally, one can continue from conceptual model 2 to 3, and
    once one concludes the interaction at conceptual model 3, one has navigate to
    conceptual model 2. Conceptual navigation map C2 is identical to C1 with the exception
    that one can conclude the interaction at conceptual model 4 and exit without going
    back to conceptual model 1. Finally, in conceptual navigation map C3, one can
    also conclude the interaction in conceptual elements 2 and 3 without having to
    retrace the navigation.


    The following two primary considerations influence the route a user takes linked
    conceptual elements to perform all the tasks required to accomplish goal:


    - 1. The conceptual model configuration

    - 2. Decisions on the workflow and dynamics of the interaction


    Each of. However, having a link between elements does not always tell us if it
    is a one-way or two-way route. In addition, it does not tell where the entry and
    exit points are. The decision on those latter parameters is influenced by workflow.


    However, the physical location of each conceptual element also influences the
    route characteristics. For example, look at elements 2 and 3 in any of the three
    examples in Figure 6.1. The map indicates that there is a two-way route between
    these two elements. Will the navigation be the same if each of the elements are
    in a separate window as compared to a case where both elements are in the same
    window but are in separate tabs? This brings us to the next important aspect of
    the conceptual model: physical places.


    # PHYSICAL PLACES FOR THE CONCEPTUAL ELEMENTS


    So far, we used the spatial term “places” to talk about conceptual elements. It
    is very important to emphasize that this is in a strict metaphorical sense and
    not in the physical sense of places. However, the correspondence between the metaphorical
    “places” and their physical location is significant when we determine that physical
    location, the “distances” between “places,” and the navigation among them.


    Conceptual model elements could sometimes have a correspondence of one-to-one
    with their physical location. For example, a “place” could be a window. Yet, at
    other times, there would not be such correspondence. For example, Figure 6.2 illustrates


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_42_0.png)


    FIGURE 6.2:

    Different physical assignments for a conceptual model with three elements.

