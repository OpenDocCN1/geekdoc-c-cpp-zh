    # DEFINE POLICY


    The navigation policy is an important issue you should address during the conceptual
    design phase, and it goes in hand with outlining the navigation map and assigning
    conceptual elements to physical places. Here is a reminder of what the navigation
    policy is. The policy deals fundamentally with the challenge of modality: While
    interacting with a conceptual element in a physical place, can the user also interact
    with another conceptual element in the same or different physical place? In making
    our decisions about the navigation and interaction policies, we follow the same
    criteria we use for determining the assignment of conceptual elements to physical
    places.


    You make a large portion of the modality decisions while assigning conceptual
    elements to physical places (for a schematic example, go back to Table 6.1 in
    the primer part of this book). To determine the policy decisions, do the following:


    **Fine-tune the analyses implications:** Revisit the outcomes of the various analyses
    and the affinities between conceptual elements. Elements that we interact with
    and see at the same time be independent. In other words, there is no modality
    between them regardless of whether they are assigned to the same or different
    physical place.


    **Follow channel-specific look and feel guidelines and conventions:** Applying
    a modal, modeless policy in a large-screen interaction channel requires the definition
    of windows, dialogs, and screens as either modal or modeless relative to each
    other. However, in a small-screen channel, we can often end up with mutually exclusive
    elements only because they cannot be displayed and accessed at the same time due
    to size and not to an intentional design decision.


    Following the initial decisions on the physical assignment of conceptual elements
    in our running example, we move on to examining the navigation policy. The details
    of the navigation policy for the example are in Table 17.3. We can see that with
    respect to modality, there is the policy for both channels, even though both have
    a different physical assignment for the conceptual elements. Using the criteria
    for the physical place assignment, we see that for the desktop channel, the places
    for the setup tasks and the workout elements are mutually exclusive, even though
    they are all in the same place. The same modality applies for the mobile channel:
    The places for the different conceptual elements are mutually exclusive, but they
    are assigned to different physical places.'
