    概念元素的配置反映了用户访问的“位置”以及连接这些“位置”的链接，这些链接确保了任务的执行和目标的实现。通过对比表 5.1 中的四个概念模型可以看出，尽管每个模型的功能相似，但在概念元素的数量及其配置上非常不同，特别是应用程序
    3 和 4 彼此以及与 1 和 2 之间非常不同。


    概念元素的配置本身并没有完全反映元素之间链接的强度。此外，它没有提供通过配置进行导航的细节。我们仍然需要导航地图、概念元素到物理位置的以及导航策略。这些位于概念设计框架的下一层。


    # 导航与策略层


    空间隐喻在描述交互式系统的概念模型时继续有效。我们使用“导航”一词来描述用户从一个位置移动到另一个位置。我们使用“导航地图”一词来代表整个概念模型中的路线指令。以下是关于导航和导航地图的一些细节。


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_41_0.png)


    ## 概念导航地图：在概念模型元素之间移动


    概念导航地图显示了用户可以或必须通过配置采取以执行并完成目标的所有所需步骤的“路线”。


    - 1. 开始和结束交互的入口和出口点。

    - 2. 配置中概念元素之间每个链接的方向；某些链接是单向的，某些是双向的。


    # 概念模型基础


    图 6.1 显示了一个概念模型配置（图 5.1 中的配置 C），它带有三个不同的导航地图。


    在概念导航地图 C1 中，导航从概念模型 1 开始并结束。从该元素出发，可以进入概念模型 2 或 4。当在概念模型 2 或 4 处发生交互时，需要导航回概念模型
    1 以退出。最后，可以从概念模型 2 继续到 3，一旦在概念模型 3 处结束交互，就导航到了概念模型 2。概念导航地图 C2 与 C1 相同，例外是可以在概念模型
    4 处结束而无需返回概念模型 1。最后，在概念导航地图 C3 中，可以在概念元素 2 和 3 之间无需回溯导航。


    以下两个主要考虑因素影响用户链接概念元素以完成目标所需任务的路线：


    - 1. 概念模型配置

    - 2. 关于工作流和交互动态的决策


    每一个然而，元素之间的链接并不总是告诉我们是单向还是双向路线。此外，它没有告诉我们入口和出口点在哪里。后者的参数的决策受工作流的影响。


    然而，每个元素的物理位置也会影响路线特征。例如，观察图 6.1 中三个示例中的元素 2 和 3。地图显示这两个元素之间存在双向路线。如果每个元素都位于单独的窗口，与两个元素位于同一个窗口但不同标签的情况相比，导航还会相同吗？这引出了概念模型的下一个重要方面：物理位置。


    # 概念元素的物理位置


    到目前为止，我们使用空间术语“位置”来讨论概念元素。非常重要的一点是强调这是严格在隐喻意义上的，而不是物理意义上的位置。然而，当我们确定物理位置、“位置”之间的“距离”以及它们之间的导航时，隐喻“位置”与物理位置之间的对应是非常重要的。


    概念模型元素有时可以与其物理位置一一对应。例如，一个“位置”可以是一个窗口。但在其他情况下，可能没有这种对应。例如，图 6.2 展示了


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_42_0.png)


    图 6.2：

    三个元素概念模型的不同物理分配。


