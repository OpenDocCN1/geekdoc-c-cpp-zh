    # Beyond the conceptual model and onto detailed design


    The transition from conceptual to detailed design is part of the same continuous
    process. Following that, we carry-over into the detailed design goals and issues
    that we addressed in the conceptual design. Throughout the book we used the following
    human performance goals as a guide for conceptual design decisions:


    +   - Mental models and understanding

    - Location awareness

    - Visual search effectiveness

    - Operational (executing actions) load

    - Working memory load


    As we transition into the detailed design, we should continue with these goals
    in mind. In the same manner each of these goals was translated into conceptual
    design requirements, now they should be further translated into detailed design
    requirements. The following table (Table 1) offers some principles and requirements
    as you move on from conceptual to detailed design:


    | Human performance goals | Conceptual design | Detailed design |

    | --- | --- | --- |

    | Facilitate intuitive understanding | Express affinities between elements | Layout
    to convey structure and relations; consistent use of metaphor |

    | Support location awareness | Keep elements in places; Short navigation routes
    routed to complete tasks | Navigation controls; titles and captions as clear landmarks
    |

    | Minimize working load | Titles and captions: feedback back and information;
    aids and guides |

    | Reduce operational load | Short-cuts and alternate ways to perform tasks; provide
    immediate access to operations |

    | Increase visual search effectiveness | Minimize number of functional elements
    in a single functional chunk | Layout to guide visual search |'
