    # On Mental Models


    Norman refers to one’s understanding when interacting with an artifact as "having
    a conceptual model of the device you interact with" (Norman, 1983, 1988, 1999,
    2004). The internal, psychological representation of this model is often referred
    to as the user’s mental or a model. To quote Norman’s definition: "Mental models
    are the models people have of themselves, the environment, and the things with
    which they interact. People form mental models through experience, training, and
    instruction. The mental model of a device is formed largely by interpreting its
    actions and its structure" (Norman, 1988, p. 17). Hollnagem (2008) argued that
    the mental model of the operator’s knowledge he has about or for his environment
    is crucial for how the operator interprets, plans, and acts. Similarly to Norman,
    Hollnagem claimed that the operator’s world is shaped by how the world is perceived.
    Young (1981) also suggested that users create representations of the systems they
    use with and that helps them plan their actions and understand the system’s behavior.
    According to Gray (1987), users develop small working models of components of
    the system they interact with in order to reduce the workload that may be associated
    in that interaction. Together, these approaches define mental models focus on
    the representation of the device or system that the user interacts with and its
    environment.


    interacting with an artifact, the user either starts with a preexisting mental
