    # Conceptual Design in

    Context: Think

    Strategically


    Involvement in conceptual design requires you to have good strategic awareness
    and to leverage that awareness in the conceptual design process. What is the meaning
    of having strategic awareness? Simply put, it means being aware of the larger
    context within which the conceptual design takes place. This chapter discusses
    aspects of strategic awareness and thinking and their relevance to conceptual
    design.


    # THE BUSINESS CONTEXT: MOTIVATIONS FOR

    DEVELOPING THE PRODUCT AND VALUE

    PROPOSITIONS


    When we design the user interface, we naturally consider user and usage aspects.
    But that is not all. The strategic and business side of things has a huge impact
    on how a product is designed and developed and, consequently, has an impact on
    usability and user experience. Being aware of the strategic and business aspects
    includes addressing questions such as the following: Is the product a revision
    or update of an existing product? Alternatively, is it a completely new product,
    perhaps based on new technology?


    An update for an existing product puts the designer and developer in a context
    where there is some experience with the product, there is a user population that
    can be accessed in user research, the stronger and weaker aspects of the product
    are known or at least can be reached via summative usability testing, and a style
    has been set for the user interface and interaction with the product. In contrast,
    if it is a completely new product, there is no coherent and accessible user population,
    there is much uncertainty with respect to what may be the strong and weak aspects
    of the product, and user interface and interactions are to be defined.


    However, here is a cautionary note: It may sound if the designer''s life is easier
    with a revision or update of an existing product compared with a new product.
    This is not necessarily so and there is a downside to the benefits. An existing
    product may carry over a legacy that constrains the revision or update work, that
    does not exist with a new product. In contrast, a new product can introduce many
    uncertainties that may result in uninformed design decisions.'
- md: '

    As a designer, you must know why a product is developed, be it a new one or a
    revision and update. You must be aware of the motivation and fully understand
    its value proposition for the end user and other stakeholders. Such understanding
    and awareness provide you with information that should be applied in the design
    to facilitate meeting the goals and objectives dictated by the motivation.


    There could be various reasons to update or revise a product or develop a new
    product. Let us have a quick glance at the most common ones:


    - Meeting user needs—An existing user population may have previously unmet or
    new needs. These can be uncovered via venues such as requests, complaints, frequency
    and nature of using support and help facilities, usability testing, and design
    surveys. These needs can define new directions for either updating products or
    developing new ones.

    - Providing or improved technology—The discovery and development of a new technology,
    be it hardware or software-based, is often a major catalyst in developing a new
    product or in revising and updating an existing product. The discovery and development
    of a new technology could be a response to user needs or a serendipitous outcome
    of unrelated processes and developments. In these cases, where new technology
    emerges and might not relate to user needs, it is the role of interaction and
    UX designers to uncover the user needs and design according to. It is the social
    responsibility of all involved to ensure that the new technology is beneficial
    and does not have any adverse impact on people and society.

    - Generating or increasing revenue—The motivation for developing a product is
    often the motivation for generating new revenue or increasing already existing
    revenue. In other words, follow the money. It is important to note that a new
    product or updating an existing product as a response to user needs is usually
    associated with generating and increasing revenue—either by getting new customers
    and clients and users by retaining ones.

    - Other non-related motivations—Not everything is driven by a desire for revenue.
    There are numerous motivations such as social and environmental concerns. Any
    website or application serving a nonprofit organization is most driven by motivations
    and goals of that organization and not revenue-oriented goals. Any website or
    application supporting the service of a government to its citizens is not driven
    by revenue-oriented goals (at least directly). It is usually at informing, educating,
    and facilitating good citizenship.


    Meeting business development, branding, and marketing opportunities—New business
    opportunities, some of which are related to responding to user needs, can be a
    driver for developing a product. Such opportunities arise with new technologies,
    new investments, new partners, and new competitions, and global financial and
    market changes and fluctuations, and social and political changes. Any of those
    could influence business directions. Such directions can sometimes be associated
    with brand changes.


    ## CONCEPTUAL DESIGN IN CONTEXT: THINK STRATEGICALLY


    A designer must be aware and understand such changes and trends and include them
    as part of the design considerations.


    ## THE DESIGN AND DEVELOPMENT CONTEXT: THE USER-ORIENTED APPROACH


    Before diving into the methodology of conceptual design, let us put it into the
    design and development context. Conceptual design, while critical, is but one
    ingredient in the much larger context of designing, developing, and deploying
    interactive products. We assume you are familiar with designing for usability
    and user experience. Consequently, this brief overview is only meant to establish
    common ground. It is not meant as a comprehensive or even an introductory review
    of various approaches to the processes in the user interface and experience design.


    The process with which we design and develop interactive systems has many definitions,
    prescriptions, standards, approaches, deceptions, and visualizations. Most approaches
    follow similar core principles of the user-oriented design philosophy. The user-oriented
    approach has the yet powerful of honing the point of all activities. In addition,
    it invites continuous involvement of all stakeholders—primarily the end user—and
    the iterative nature of the process involving early prototyping, evaluations and
    testing, and redesting. Thus, if we transcend a specific approach, the process
    of designing the user interface of interactive systems typically consists of several
    generic activities. These generic activities share the impact of improving user
    experience, both in utility and in emotional aspects. These are presented briefly
    here in the typical order they can be presented (Figure 11.1), but this presentation
    of activities and their order is not meant to be prescriptive at all.


    > Conceptual models and conceptual design have been addressed throughout the years
    from diverse perspectives. Conceptual design is often viewed as a phase or in-between
    doing some user research and developing requirements and the detailed design of
    the system or program. Most of the treatment of conceptual design has been in
    the context of website design, focusing primarily on the challenge of designing
    effective information architecture. For example, Garrett (2002) discussed navigation
    models in information architecture, Lynch and Horton (2008) presented architecture
    and navigation models, and Brink, George, and Wood (2002) discussed information
    architectures.


    > However, are conceptual models and conceptual design relevant only to the information
    architecture of websites? Norman (1983) referred to one''s understanding when
    interacting with any artifact as “having a conceptual model of the device you
    interact with.” He further suggested that conceptual models underlie the user
    interface linking between users'' mental models about the artifact they interact
    with and how the artifact is designed and works. This implies a very important
    and critical role for the conceptual model for any system or product or computer
    program. It applies to anything the human user interacts with.


    ## CONCEPTUAL DESIGN: A METHODOLOGY


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_90_0.png)


    FIGURE 11.1:

    The conceptual design activity in the overall context of designing user interfaces.
    The depiction highlights the affinity with user research, on the one hand, and
    the transition to detailed design, on the other hand, with ongoing evaluation.


    **Initiation:** Developing an interactive product and releasing it to users start
    with a need, an idea, a business opportunity, or a technological innovation. Regardless
    of the motivation and originating drive for the product, there is typically a
    primary phase that triggers all activities related to developing and releasing
    the product. This phase may include market research and needs assessment, development
    of business partnerships, technology assessment, and establishment of the project
    team. The latter is highly relevant to the design for UX the team composition
    may influence the subsequent activities such as research and design.


    **Research:** Research activities can be associated with the initiation phase
    and often the bases for defining what should go into the product. This may include
    market and user research. User research is particularly critical for the design
    activities of the product. Some research activities can be revisited at later
    phases to gather more data or redo some of the analyses. Typically, the outcome
    of the initial user research is a set of requirements, some of which are the bases
    for the design activities.


    **Design:** The actual formulation of the user interface and implications for
    usability and user experience is realized through a series of design activities.
    This book focuses on the conceptual design activity within this context (Figure
    11.1). The approach here advocates that user research and requirements are the
    bases for conceptual design, which leads into detailed design. Evaluation and
    testing is an ongoing activity throughout both conceptual and detailed design.

