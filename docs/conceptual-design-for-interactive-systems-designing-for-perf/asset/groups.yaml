    # Conceptual Design: An Overview of the Methodology


    # REVISITING THE FRAMEWORK


    The conceptual model was presented in the first part of the book within a layered
    framework. The layers underlie the final and detailed user interface. Building
    the conceptual model is the process of conceptual design and is at the heart of
    the methodology presented here in the second part of the book.


    Taking the framework as the basis for the conceptual design process, there are
    three main phases to manage it from the top up (Figure 12):


    *The conceptual design*—This phase is the core of the methodology and spans three
    layers of the framework: the function, configuration, and the navigation and policy
    layers.


    *The transition from conceptual to detailed design*—This is the phase where we
    transform the abstract aspects of the conceptual model to more concrete by adding
    details to them.


    *The detailed design*—This is typically the final phase in designing the user
    interface, but it will not be covered in this book as it is focused on the conceptual
    part of the entire process. While this represents activities beyond the conceptual
    design, it is in the framework because the conceptual model is the foundation
    for the final detailed design. In addition, detailed design is a significant part
    of the overall context of designing interactive systems.


    The methodology will guide you through a series of design activities following
    the layers of the framework from the bottom up. We must address user research.
    We cannot, and should not start, the design process without having done some research.
    With in mind, we start in Chapter 13 with a refresher of some user research techniques
    and data that are relevant to the conceptual design.


    Chapter 14 tells us how to determine the functional chunks and their interrelations.
    The next step in Chapter 15 is transforming the functional chunks into conceptual
    elements and linking between them to create the foundation of the model, the configuration
    of the elements. Chapter 16, we make the model and define the navigation map.


    Then, we fine-tune the navigation by Chapter 17 by defining the navigation policy
    along with the assignment of conceptual elements to physical places. Finally,
    Chapter 18 covers the transition from the conceptual design activities towards
    detailed design. Each of the chapters will also provide some project management
    considerations.'
