    四个元素概念模型的不同物理分配。


    ## 导航与策略层 29


    同时也托管概念元素链接，而“位置”以弹出窗口的形式出现。这种分配反映了元素 2 和 3 之间更紧密的链接以及它们与元素 4 之间的“距离”。或者，元素 2
    和 3 之间可能的层级链接可以进行物理分配，使得元素 2 和 3 在同样托管概念元素 1 的窗口内作为“位置”出现，其中元素 3 是元素 2 的扩展。元素
    4 被分配给一个弹出窗口。


    确定概念元素到物理位置的分配对导航地图和导航策略具有重要影响。正如本书这部分即将讨论的，它对人类性能、易用性和用户体验也有影响。


    ## 导航策略：“道路规则”


    有效的地图和路线指令必须包含规范导航的规则。我们能随时随地去想去的地方吗？同样，概念导航地图必须包含这些规则，我们称之为导航策略。


    关于概念导航地图的设计决策与关于物理位置和导航策略的决策密不可分。这些决策必须考虑一个根本性问题：用户是否应该同时执行多个任务？在交互流方面，这个问题的影响是：用户是否被要求在移动到下一个任务之前完全或部分完成任务，用户是否被要求完成给定任务、移动到另一个任务并完成，然后返回原始任务？


    从概念模型来看，策略根本上处理的是模态（modality）挑战：在与物理位置中的概念元素交互时，用户是否可以在同一物理位置或不同位置与另一个概念元素交互？当答案为是时，我们称之为无模式策略（modeless
    policy）。无模式概念元素允许同时与其他概念元素交互。当策略限制用户在单个物理位置内一次只与一个概念元素交互时，我们称之为模态策略（modal policy）。模态概念元素是不允许同时与任何其他元素交互的。


    图 6.4 中的概念导航地图是导航策略与概念元素物理位置之间关系的示例。图 6.4 A 部分所示的导航策略允许用户同时与“位置”中的概念元素 2 以及“位置”3
    中的元素 3 交互。物理分配使得用户随后可以关闭模型元素 3，完成概念元素 2 的任务，并返回“位置”1 中的概念模型元素 1。图 6.4 B 部分所示的导航策略允许用户仅与概念模型元素
    2 交互，并可以选择继续到概念模型元素 3，在并在完成任务，然后返回概念模型元素 2 完成任务，最后回到概念模型元素 1。


    图 6.4：

    具有两种物理分配的概念导航地图，反映了不同的导航策略。


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_46_0.png)


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_46_1.png)


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_46_2.png)


    图 6.4 中的示例告诉我们关于交互式系统中模态概念的一些知识。处理模态并对其范围做出决策对于最终确定导航地图和策略至关重要。表 6.1 显示了概念元素物理位置分配与模态之间关系的简单分类。


    概念元素的物理位置分配有两种可能性：元素位于相同的物理位置，或者位于不同的物理位置。


    模态也存在两种可能性：与概念元素的交互是独立的，或者用户可以同时与多个元素交互，亦或是互斥的，即用户一次只能与一个元素交互。


