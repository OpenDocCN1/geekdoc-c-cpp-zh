    ## CHAPTER 15: Configuration: Draw Your First Rough Sketch of the Conceptual Model


    We want to get fast to something we can show. Whereas putting together the chunks
    and the functional architecture is an essential step that we should share with
    all stakeholders, it is still hard to get a clear sense of how the user interface
    itself will evolve from it. In the configuration step, we sketch something that
    looks like a model and you can even illustrate, on an abstract level, how the
    user will interact with it. It is your first napkin sketch, as it were, the first
    visualization of the concept.


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_115_0.png)


    > ### What''s in This Step?

    The configuration layer activities are the following:

    1. Define and configure conceptual model elements.

    2. Identify pivotal elements.

    3. Reconfigure the model.

    4. Checkpoint.


    ## DEFINE AND CONFIGURE CONCEPTUAL MODEL ELEMENTS


    Once you defined the functional chunks, be they simple or compound, you can now
    transform them into conceptual model elements. As was explained in the primer,
    a more abstract representation of the functional chunks supports the understanding,
    further development, and assessment of the conceptual model. There are two steps
    in configuring the conceptual model:


    +   1. Represent each functional chunk as a conceptual model element. At this
    point, we may have simple task-oriented or object-oriented functional chunks.
    In addition, we have the desired interaction flow. Regardless of their type and
    simplicity, we should abstract the chunks that fit best the interaction flow.
    Thus, we may end up with conceptual model elements representing some of the task-oriented
    and/or some of the object-oriented. See the conceptual elements of the running
    example in Figure 15.1. Note that some of the represent objects as workflows,
    and some tasks as review and share.


    +   2. Define compound conceptual elements, when relevant, on links between the
    elements, which in turn are based on the links between the functional chunks.
    Note that at this point, the links do not convey all the details of the full navigation
    map. See Figure 15.2 with the mobile and the desktop interaction channels.


    The resulting configuration is the foundation for the conceptual model.


    ## LOOK FOR A PIVOTAL ELEMENT IN THE CONFIGURATION


    The conceptual model should have a meaningful configuration. The mere linking
    of conceptual elements may not always convey meaningful configuration. You should


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_116_0.png)


    ## DRAW YOUR FIRST ROUGH SKETCH OF THE CONCEPTUAL MODEL 101


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_117_0.png)


    FIGURE 15.2: Compound conceptual elements in the running example based on links
    between the simple functional chunks for the mobile interaction channel on the
    left-hand side and for the desktop channel on the right-hand side.


    look at it and it it should make sense to you. By itself, it should tell the story
    of the product. A meaningful configuration is one that represents well mental
    models or would easily induce a new mental model that can facilitate understanding,
    or workflow, or platform and constraints of business and brand considerations.
    Looking for a meaningful configuration is an essential step in transforming a
    bunch of linked elements into a coherent conceptual model. The conceptual model
    typologies presented and discussed in the primer are the most common examples
    for coherent models.


    In order to assess the configuration and transform it into a meaningful one, ask
    yourself if there is a conceptual element or several tightly linked elements that
