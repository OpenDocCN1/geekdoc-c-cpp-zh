    # 功能分块：构建核心基础


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_109_0.png)


    # 链接功能分块


    在定义功能分块（无论是面向任务的还是面向对象的）之后，下一步是概述分块之间的链接。功能分块之间的链接取决于任务结构、交互流以及与对象的关联性。同样需要考虑链接的强度。如果分块被频繁使用，或者在交互流期间相互依赖，则链接可能会更强。链接满足以下条件的简单任务面向型分块：


    - 在具有多个目标的产品中服务同一个目标；

    - 是同一个任务工作流的一部分；

    - 在给定的任务工作流中是顺序关系；

    - 经常一起执行。


    图 14.4：运行示例中桌面端的简单对象面向型功能分块。


    # 概念设计：一种方法论


    例如，图 14.2 中有两个面向设置的简单功能分块：(1) 设备和个人设置以及 (2) 设置健身计划。这两者都可以进一步链接，因为它们都服务于在运行前设置系统参数的共同目标。此外，两者都可以作为同一个任务流的一部分，通常是在用户首次使用时，此时用户将设置产品的所有方面。最后，如果先设置设备，然后进行个人设置，那么两者也可以是顺序关系。


    在定义这些链接时，你可能会重新定义某些功能分块。具体来说，你可能认为将几个相互关联的分块组成一个功能分块。在我们的运行示例中，两个链接的功能分块“设备和个人设置”与“设置健身计划”可以被重新定义为“设置复合分块”，如图
    14.5 顶部的移动端示例所示。同样，设置个人账户和健身计划可以被分块为桌面端的“设置复合分块”，如图 14.5 底部所示。


    图 14.5：重新定义复合任务面向型功能分块。顶部的图描述了移动端的分块，底部的图是桌面端的复合功能分块。


    我们可以对对象面向型分块采用类似的方法。链接满足以下条件的简单对象面向型分块：


    - 代表具有共同含义的对象；

    - 代表它们之间存在某种关联的对象。


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_110_0.png)


    # 功能分块：构建核心基础


    95


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_111_0.png)


    例如，在图 14.6 中，我们可以看到运行示例中移动端的两个复合功能分块。顶部的复合分块是“健身”，它结合了图 14.3 中所有的健身对象面向型简单分块。这些被组合为一个单一的复合功能分块，是因为所有对象对用户都有共同含义，并且符合心理模型。注意图
    14.6 中的另一个复合功能分块，它结合了个人账户和传感器分块。这两个对象分块之间存在某种关联：它们都代表在跑步前涉及的对象。这两个对象面向型功能分块被组合为一个任务面向型复合功能分块，这与我们在检查任务面向型复合分块的定义时得出的结论一致。我们可以采用同样的推理，为运行示例中的桌面端定义对象面向型复合分块，如图
    14.7 所示。


    图 14.6：

    运行示例中移动端的复合对象面向型功能分块


    除了所有标准外，你还可以根据以下因素链接简单任务面向型或对象面向型分块：


    - 使用语境（当功能分块在相同的使用语境下相关或被处理，并且与其它语境下处理的功能分块有不同时）


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_111_1.png)


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_112_0.png)


    图 14.7：运行示例中桌面端的复合对象面向型功能分块。


    - 交互通道（当功能分块通常在特定的交互通道中处理，并且与在通道中处理的其他分块有不同时）。


    遵循运行示例的工作流，我们可以区分出几种使用语境或状态：初始设置、跑步前、运行中和跑步后。在运行示例的任务分析（图 14.1）中，与查看跑步表现的任务只能在跑步后执行。跑步分块（运行过程中的实时信息）只能在手机或跑步智能手表等移动设备上完成。相比之下，与个人账户或查看跑步表现的任务可以在桌面电脑网站或程序，以及移动设备（如平板电脑或手机）上的
    App 网站等通道中完成，但无法在手表上以非常线性的方式完成。在定义复合功能分块为面向任务型或面向对象型时，应该考虑这些因素。


    # 功能分块：构建核心基础


    关于复合功能分块的决定将以后影响如何分配物理位置的决定。将复合功能分块分配给单一位置，比将每个简单分块分配到不同位置更为合理。这反过来将影响导航，我们很快就会看到。


    '
