    Performance implications:


    - Location awareness—medium

    - Visual search effectiveness—high

    - Operational (executing actions) load—low

    - Working memory load—medium


    **Usability implications:**


    - Learnability—fast and easy

    - Effectiveness—high

    - Efficiency—low

    - Satisfaction—likely high


    Appropriate for:


    - Functional chunks that have logical and relevant relations between them.

    - There are several related user goals that are typically or ideally accomplished
