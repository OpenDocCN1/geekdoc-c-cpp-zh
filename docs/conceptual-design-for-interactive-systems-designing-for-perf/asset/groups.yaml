    作为一名设计师，你必须了解开发某个产品的原因，无论是新产品还是修订和更新。你必须意识到其动机，并充分理解其对终端用户和其他利益相关者的价值主张。这种理解和意识能为你提供信息，这些信息应被应用于设计中，以促进实现动机所设定的目标和任务。


    更新或修订产品或开发新产品可能有多种原因。让我们快速浏览一下最常见的几种：


    -   **满足用户需求**——现有的用户群体可能存在之前未被满足的需求或新需求。这些需求可以通过请求、投诉、使用支持和帮助设施的频率和性质、易可用性测试以及设计问卷等渠道被发现。这些需求可以为更新产品或开发新产品定义新的方向。

    -   **提供或改进技术**——新技术（无论是硬件还是软件）的发现和开发，通常是开发新产品或修订和更新现有产品的主要催化剂。新技术的发现和开发可能是对用户需求的响应，也可能是无关过程和发展的偶然结果。在这些新技术出现且可能与用户需求无关的情况下，交互和
    UX 设计师的角色是发现用户需求并据此进行设计。确保新技术是有益的且不对人类和社会产生任何负面影响，是所有参与者的社会责任。

    -   **产生或增加收入**——开发产品的动机通常是产生新收入或增加现有收入的动机。换句话说，追随资金。需要注意的是，作为用户需求响应开发新产品或更新现有产品通常与产生和增加收入有关——无论是通过获取新客户、客户和用户，还是通过留住用户。

    -   **其他无关动机**——并非所有动力都来自对收入的渴望。还有许多动机，例如社会和社会关注。任何为非营利组织服务的网站或应用程序，其驱动力主要是该组织的动机和目标，而非收入为导向的目标。任何支持政府为其公民服务的网站或应用程序都不是以收入为导向的目标驱动（至少直接如此）。它通常是为了告知、教育和促进良好的公民行为。

    -   **把握业务发展、品牌建设和营销机会**——新的业务机会（其中一些与响应用户需求有关）可以成为开发产品的动力。这些机会随着新技术、新投资、新伙伴、新竞争，以及全球金融和市场的变化波动，以及社会和政治变化而出现。其中任何一点都可能影响业务方向。这些方向有时会与品牌变化相关。


    ## 语境中的概念设计：战略性思考


    设计师必须意识到并理解这些变化和趋势，并将它们作为设计考量的一部分。


    ## 设计与开发背景：以用户为中心的方法


    在深入概念设计的方法之前，让我们将其放在设计和开发的背景中。概念设计虽然至重要，但它只是设计、开发和部署交互产品巨大背景中的一个元素。我们假设你已经熟悉易可用性和用户体验的设计。因此，本简要概述仅旨在建立共识。它并不是为了对用户界面和体验设计过程中各种方法进行全面甚至是介绍性的回顾。


    我们设计和开发交互系统的过程有许多定义、处方、标准、方法、描述和可视化。大多数方法都遵循以用户为中心的设计哲学的核心原则。以用户为中心的方法具有强化所有活动的强大力量。此外，它邀请了所有利益相关者（主要是终端用户）持续参与，以及过程的迭代性质，涉及早期原型、评估、测试和重新测试。因此，如果我们超越特定的方法，交互系统用户界面的设计过程通常由几个通用活动组成。这些通用活动在提高用户体验（包括实用性和情感方面）方面具有共同影响。这里简要介绍了这些活动呈现的典型顺序（图
    11.1），但这些活动的呈现方式及其顺序完全不具有规定性。


    > 概念模型和概念设计多年来从不同的角度被讨论。概念设计通常被视为一个阶段，或者处于进行某些用户研究与开发需求以及系统或程序的详细设计之间的过渡阶段。对概念设计的处理大部分是在网站设计的背景下进行的，主要关注设计有效信息架构的挑战。例如，Garrett
    (2002) 讨论了信息架构中的导航模型，Lynch 和Horton (2008) 介绍了架构和导航模型，Brink、George 和 Wood (2002)
    讨论了信息架构。


    > 然而，概念模型和概念设计仅与网站的信息架构相关吗？Norman (1983) 将人们在与任何人工制品交互时的理解定义为“对你所交互的设备有一个概念模型”。他进一步建议，概念模型是连接用户对所交互人工物的心理模型与该人工物的设计及工作方式之间用户界面衔接的基础。这意味着概念模型对于任何系统、产品或计算机程序都起着非常重要且关键的作用。它适用于人类用户交互的任何事物。


    ## 概念设计：一种方法


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_90_0.png)


    图 11.1：

    在用户界面设计的整体背景下的概念设计活动。该图强调了一方面与用户研究的关联性，另一方面是向详细设计的过渡，并伴随着持续的评估。


    **启动：** 开发交互产品并将其发布给用户始于一个需求、一个想法、一个业务机会或技术创新。无论产品的动机和原始驱动力如何，通常有一个触发所有与开发和发布产品相关的初级阶段。该阶段可能包括市场研究和需求评估、业务伙伴关系的建立、技术评估以及项目团队的建立。后者与
    UX 设计高度相关，团队组成可能会影响研究和设计等后续活动。


    **研究：** 研究活动可以与启动阶段相关，并通常是定义产品包含内容的基础。这可能包括市场研究和用户研究。用户研究对于产品的设计活动至关重要。某些研究可以在后期阶段重新进行，以收集更多数据或重新进行某些分析。通常，初始用户研究的结果是一组需求，其中一些是设计活动的基础。


    **设计：** 用户界面的实际制定以及对易可用性和用户体验的影响是通过一系列设计活动实现的。本书关注的是这一背景下的概念设计活动（图 11.1）。这里的方法主张，用户研究和需求是概念设计的基础，随后进入详细设计。评估和测试在概念设计和详细设计中都是持续进行的活动。


