    # 概念模型的分类法


    我们已经泛泛地讨论了概念模型，并以预约应用程序为例对其进行了说明。然而，这些插图展示的是非常具体的模型。是否存在通用的模型类型？换句话说，我们可以讨论一种概念模型的分类法吗？分类法可以为我们提供：


    - 1. 模型类型适用于特定情境的通用标准；

    - 2. 用于比较备选模型的术语。


    目前已发表了一些关于网站架构的分类法（Brinck, Gergle, & Wood, 2002; Garrett, 2002; Lynch & Horton,
    2008）。以下是对这些某些分类法在任何用户界面底层模型的轻量级适配，无论是网站还是任何应用程序，无论其在线还是离线。


    概念模型的区别在于在完成任务和实现目标时赋予用户的自由度程度不同。在某些情况下，任务流是高度结构化且线性的，使得用户在可选交互方式上的自由度较少。在其他情况下，任务流是非结构化的，为用户提供了执行交互的替代方案提供了更大的自由度。据此，概念模型的分类法可以分为两大类：


    - 1. 顺序和结构化：包括单序列、层次结构或多序列模型。

    - 2. 非顺序和非结构化：包括轴辐模型（hub and spokes）、矩阵和网络模型。


    系统很少由单一模型组成。以下每种分类法都像是一个广泛的概念模型中简单或复杂的构建块，该模型可能由这些分类法的几种组合组成。下面的大多数示例都说明了这种情况在程序中是常见的。本节末尾的“混合概念模型”讨论了这一点。


