    In order to discuss why the conceptual model matters, let us distinguish between
    “human performance,” on the one hand, and “usability and user experience,” on
    the other hand. Human performance refers to cognitive, perceptual, emotional,
    and physical processes and behaviors. Usability and user experience refers to
    the effectiveness, efficiency, and usability associated with users interacting
    with an application in order to accomplish goals.


    There are strong connections between human performance and usability. A simple
    example can illustrate this: assume a user has difficulties in reading some information
    off a display. This is an issue with perception and possibly cognitive aspects
    related to comprehension. Such a degraded perceptual and cognitive process could
    result in reduced effectiveness of the user’s interaction with the application.
    Thus, human performance can directly affect usability and user experience.


    The discussion of why conceptual models focus on fundamental human psychology
    and performance factors play a role in any interaction. This focuses how the configuration
    of functional chunks, “places,” and “routes” underlying the UI influence performance.
    The five factors are the following:


    - **If you understand it, you can use it!** The user interface of interactive
