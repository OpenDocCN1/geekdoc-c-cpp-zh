    +   set the time in a similar way to setting the date (once the parameters are,
    the user can conclude this extended interaction by closing the pop-up modal window
    and returning to the original and main window for setting an appointment);


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_22_0.png)


    +   4. set a reminder by scrolling down in the same window to the place denoted
