    # 绘制你的第一份概念模型草图


    先构建概念模型，然后过渡到详细设计。对于那些想要快速实现并交付内容的敏捷和精益方法，该怎么办？我们可以通过团队合作来实现，而且在团队内部，我们自己应该是自己的守门员。


    然而，要向所有人共享抽象表示往往是困难的。团队成员和利益相关者可能需要看到更具体的内容。他们可能希望至少看到更详细的线框图（wireframes），以便理解基本概念。需要强调的是，这里概述的方法论中没有任何内容阻碍你提取一些概念模型元素，并提前进入后续步骤以提供更多细节。然后，你可以回来进一步开发概念模型或进一步开发其他元素。正如早些提到的，目标并不非要遵循线性过程，而是确保在结束时设计的所有层级都得到了覆盖并良好整合。


    # 配置——关键实践要点


    - 使用功能块（无论是单一的还是复合的）来定义概念模型元素。

    - 概念元素可以基于任务面向型和对象面向型功能块的组合。

    - 配置元素：勾勒出元素之间的链接。

    - 使用用户研究并确定是否存在关键元素——即最重要或最频繁使用的元素。

    - 重新配置模型。

    - 结果是一个代表概念元素及其配置的图表。

    - 与团队成员和其他利益相关者一起评估以验证模型。


    # 导航地图：从一个地方移动到另一个地方


    导航和策略层的主要方面是概念模型的导航地图。正如本书的入门部分所讨论的，获取完整的地图不仅仅是拥有概念元素之间的路线。完整的地图还包括基于概念元素到物理位置分配而产生的导航策略（模态）。然而，在本文的分步走方法论中，我们将这一层分为两个步骤：我们在本章中概述并解释的导航地图，然后在下一章中，我们将涵盖物理分配并最终确定导航策略。


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_123_0.png)


    # 此步骤包含什么？


    导航和策略层的活动如下：


    1. 概述导航地图。

    2. 评估与修订。


    # 概述导航地图


    在确定了关键概念元素并重新配置模型以适应该元素后，我们进入了导航地图阶段。随着设计过程的推进，我们以后将通过考虑概念元素到物理位置的分配并确定导航策略来进一步完善导航地图。尽管如此，现在我们通过定义以下内容来概述概念导航地图：


    - 入口和出口概念元素

    - 概念元素之间链接的导航方向


    为了确定这些内容，你应该使用基于识别出的关键元素和交互工作流的重新配置模型。关于导航，关键元素的概念是：我们让用户尽快到达它。它可以是起点，也可以是通往它的最短路径。这不仅应该符合典型的交互工作流，还应该支持用户研究发现或基于用户研究发现的所有可能的工作流。


    在我们运行示例中，移动端和桌面端的通道导航地图分别如图 16.1 和图 16.2 所示。请注意，在这两个图中，我们都有若干处入口和出口。当我们将元素分配到物理位置并细调导航地图时，我们需要考虑这一点。


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_124_0.png)


    图 16.1：运行示例中移动端的概念导航地图。


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_125_0.png)


    重排后的导航地图保留了模型中的所有概念元素，但我们可以以反映程程图和工作流的方式重新排列草图。在图 16.1 和图 16.2 的示例中，元素的排列方式使得最典型、常见的工作流从左到右、从上到下进行。无论是移动端还是桌面端，典型的工作流从运行前设置（prerun
    setup）开始，进入运行本身，最后以运行后活动结束。穿过表示复合元素的框的双向箭头表示交互的开始和退出位置。注意，锻炼（workout）的关键状态在两张导航地图中是一致的。


    # 评估与修订


    我们现在手里有一个包含导航地图的概念模型。它是一个有效的模型吗？是一个好模型吗？换句话说，这个模型是否符合用户需求，或者它是否支持业务目标？当我们真的只有一张草图时，要解决这些问题可能具有挑战性。然而，我们可以在评估模型的有效性和优劣时解决一些基本问题。


    首先，谁应该参与评估？理想情况下，所有利益相关者的代表都应该参与。这些包括用户、设计和开发团队以及产品业务方面的代表。其次，由于此时我们拥有的只是草图，我们可以对模型进行检查式的评估。


    # 概念设计：一种方法论


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_126_0.png)


    Jake 第一次使用该应用时，是从设置屏幕开始的。他首先设置账户，然后在跑步过程中使用应用配置心率教练（HR mentor）。他从设置屏幕导航到计划锻炼（Planned
    Workouts）。他设置了多个计划跑步的不同距离锻炼。跑步时，他会看一眼手机屏幕，查看一些有趣的跑步参数，以及显示所在位置的地图。一旦完成跑步，应用程序就会切换到总结最近跑步的屏幕，显示数字参数和总结性能的图表。他还可以访问之前的跑步摘要。


    图 16.3：评估场景以及每个步骤对应的概念模型部分（用黑色框标记）。


    这种检查应该涉及通过概念模型（图 16.3）进行场景走演，并配合出声思考（think-alouds）。为了辅助检查，这里有一份基于维度的检查清单：概念模型——通过以下方面来评估模型的有效性和优劣：


    - 它是否代表了所有功能块？

    - 它是否表达了元素之间所有相关的链接，反映了块之间的链接？

    - 导航地图是否支持工作流？

    - 模型的复杂度是否适用于用户画像和任务结构化程度？


    人类性能——概念模型对人类性能和可用性的影响可以通过以下问题来获取：


    - 模型是否支持位置感知？

    - 模型是否支持视觉搜索？

    - 模型是否减少了操作负载？

    - 模型是否减少了记忆负担？


    可用性与用户体验——通过以下问题对概念的实用性方面以及某些用户体验方面进行推测：


    - 模型是否支持易用性？

    - 模型是否支持有效的交互？

    - 模型是否支持效率？

    - 模型是否支持积极的体验？


    表 16.1 展示了使用此清单评估图 16.2 所示模型的一个示例。


    '
