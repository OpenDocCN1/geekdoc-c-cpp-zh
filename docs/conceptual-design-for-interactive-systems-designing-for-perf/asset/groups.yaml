    objects or users can see, touch, and manipulate physically. In the running example,
    the running sensors, as HR sensor and monitor, the GPS receiver, a music player,
    or the road itself, are very tangible objects with which the runners interact.


    - Abstract—Finally, the third common object category includes abstract objects.
    It is very tempting to defy the philosophers and define abstract objects by what
    they are not: they are not people and not any tangible object. Abstract objects
    could include information. In the running example, the object-type includes the
    workout plan.


