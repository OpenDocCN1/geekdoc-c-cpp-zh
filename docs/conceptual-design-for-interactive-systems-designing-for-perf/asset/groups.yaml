    多通道或跨渠道交互考虑因素：许多设计和开发项目最常见的挑战是确保跨不同交互渠道的一致用户体验。请注意在运行示例中，我们也解决了这一挑战。虽然这里的方法是并行处理跨渠道概念设计，但这绝不是一种建议。正如本书的这部分提到的，处理多通道和跨渠道设计的方法是多样的，可能取决于本书范围之外各种因素和考虑因素。然而，我们在这里展示的是我们可以开发一个跨渠道的概念模型。


    # 导航策略——关键实践点


    - 基于人类表现目标、用户研究和交互渠道考虑因素，将每个概念元素分配到一个物理位置。

    - 定义导航策略，其应包括关于元素局部性以及它如何影响导航的规则。

    - 使用你最喜欢的原型工具开始制作模型原型。

    - 暂停并重新审视模型，专注于导航和策略。

    - 根据交互通道的操作原理，定义用户将如何在物理上与模型进行交互。

    - 结果：一个细节较少的初步原型——带有导航地图和策略的概念模型。

    - 与团队成员和其他利益相关者一起评估，以验证模型和导航地图。


