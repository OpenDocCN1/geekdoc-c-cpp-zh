    # CONCEPTUAL DESIGN IN CONTEXT: THINK STRATEGICALLY


    *Implementation*: Once the design reaches a point where it can be implemented,
    the actual development and building of the product (e.g., code writing in a computer
    program) takes place. In some approaches (e.g., agile), design, testing, and implementation
    often overlap.


    *Testing*: User-oriented approaches advocate early and formative evaluation and
    testing that take place throughout the process. There are some cases where summative
    evaluation and testing take place before releasing the product to the end user.
    In some approaches, the testing is part of smaller and shorter cycles including
    design, implementation, and testing.


    *Deployment*: The final phase, regardless of the development approach, is the
    release of the product to the end user and the initial or ongoing user support.


    Depending on the approach and methodology of system development, these activities
    may take place in different orders. For example, some summative testing can take
    place at earlier stages of the process for parts of the product to be released;
    the product may be incomplete before release (such as in agile and lean approaches),
    where design and implementation and deployment can take place for parts of the
    system) or be highly iterative (e.g., research and redesign can be done after
    testing or lessons learned from deployment). Regardless of the specific approach,
    most do include all the core activities and processes described above.


    Strategic and business considerations are intertwined in the overall human-oriented
    design and whatever specific design and development approach is taken. In addition,
    specific characteristics of project management are important to consider within
    the overall context of conceptual design. The following two sections address these
    issues.


    # PROJECT MANAGEMENT


    The various business considerations and all the stakeholders influence managing
    the design and development enterprise as an effective project. As a designer,
    you should be concerned with (1) the ability to conduct user research within the
    development approach, (2) keeping the design priorities within the project, and
    (3) considering all the stakeholders that may have an impact on interaction and
    UX design.


    # Design and development approach: the place of user research


    User and usage research are a prerequisite for the conceptual design of any product.
    In the classical and more traditional approaches of user-centered or human-oriented
    design, having conducted user research is an obvious step. Some of the most recent
    approaches such as the agile and lean approaches are more of a challenge to adequate
    user research because of their commitment to supply the end client/customer with
