    # Object-action analysis


    As part of the interactions with products, users manipulate or interact with various
    entities. These invariably appear in any story or user scenario. We refer to these
    entities as objects, and the user can perform various actions with any of these
    objects. Object-action analysis maps the interrelations among objects and their
    associated actions. This mapping is critical because any of these objects should
    be represented in the conceptual model. There are three key object categories:


    - There are always people in any story about working and engaging with an interactive
    product. The people in the story could be only the herself or himself or the user
    and any other people involved.


