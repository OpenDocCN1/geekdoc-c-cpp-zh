  mdcn: "\n图 3.1：\n代表概念模型和详细设计的的分层框架。\n\n![](img/03d8a14fde3082fc884c0d2b2be68fd9_28_0.png)\n\
    \n在对概念模型进行分析和讨论的过程中，我们将像剥洋葱一样层层深入。换句话说，我们将对上一中的日历示例进行反向工程，以揭示各自底层概念模型的元素和特征。\n\
    \n# 功能层 (The Function Layer)\n\n## 功能块 (FUNCTIONAL CHUNKS)\n\n许多因素决定了产品的功能：用户及其他利益相关者的需求、产品愿景与定义、业务目标与模型以及技术。结果就是我们在功能层看到的内容。它包含了与应用或系统领域（例如时间管理）相关的所有参数、信息项和操作。所有这些内容共同构成了产品的功能。\n\
    \n![](img/03d8a14fde3082fc884c0d2b2be68fd9_29_0.png)\n\n设计师通常根据用户（用户、市场等）的共同目的或意义，将与特定领域相关的参数、信息项和操作分组为功能块。功能块可以围绕任务和/或对象展开。在本书中，我们关注功能块的两种主要形式：面向任务的和面向对象的。还有另一种形式的功能块，即面向内容的块。我们在此处会提到它，但书的关于方法论的部分不会重点介绍它。定义这些功能块是概念设计过程的一部分。书的第二部分将涉及概念设计的方法论。\n\
    \n## 面向任务的块 (TASK-ORIENTED CHUNKS)\n\n面向任务的功能块是用于共同目的的任务集合（见图 4.1）。面向任务的块使用户能够实现切实的目标、完成具体事项（如设置预约或设置提醒）或获取关于特定主题的信息。面向任务的块也可能纯粹是为了功能和参与而没有实际的实用价值（例如游戏任务，如“根据一组规则对所有卡片排序”）。\n\
    \n![](img/03d8a14fde3082fc884c0d2b2be68fd9_30_0.png)\n\n图 4.1：\n面向任务的功能块的想法。\n\
    \n## 面向对象的块 (OBJECT-ORIENTED CHUNKS)\n\n面向对象的块包括应用领域主题中的对象（例如预约、打印机、页面、行程或停车位置），以及与该对象相关的的内容（图\
    \ 4.2） (Shneiderman, 1998)。\n\n![](img/03d8a14fde3082fc884c0d2b2be68fd9_30_1.png)\n\
    \n图 4.2：\n面向对象的块的想法。\n\n## 面向内容的块 (CONTENT-ORIENTED CHUNKS)\n\n面向内容的块是信息项的集合。每个块都是内容类别。用户通常为了各种目的搜索并使用这些信息项（图\
    \ 4.3）。\n\n![](img/03d8a14fde3082fc884c0d2b2be68fd9_31_0.png)\n\n图 4.3 面向内容的块。\n\
    \n## 功能块与复合块之间的关系\n\n通常，单个块无法完全支持任务的完成。更多时候，它无法支持用户目标的实现。在这种情况下，我们寻找几个相互相关的块来支持任务的完成和/或目标的实现。我们甚至可以让任务块、对象块和内容块组成复合块（图\
    \ 4.4）。复合块中包含几个块取决于使用的频率、任务结构和交互流程。让我们来看一个小例子来澄清。为了支持用户准备打印某些东西，我们可以有一个复合功能对象，如打印机和页面，这些与面向任务的块相关，包括打开、更改、删除、保存和打印。\n\
    \n# 概念模型——基础 (THE CONCEPTUAL MODEL—FUNDAMENTALS)\n\n图 4.4：\n复合功能块的想法。\n\n## 复合功能块\n\
    \n![](img/03d8a14fde3082fc884c0d2b2be68fd9_32_0.png)\n\n## 预约中的功能块\n\n在不同渠道上实现的四个应用程序具有相同的功能：设置预约参数。这种共同的功能似乎将每个应用程序中的三个块（参数块和操作块）绑定在一起，旨在支持功能的实现。预约示例中的“功能块”包括以下内容：\n\
    \n- 子目标 1：定义预约详情。\n    - 参数：会议标题、日期和时间，最后是会议地点。\n    - 操作：批准或取消预约定义。\n- 子目标 2：设置提醒。\n\
    \    - 参数：预约开始前的时间。\n    - 操作：批准或取消参数。\n- 子目标 3：定义预约的循环。\n    - 参数：在给定期间内按频率或次数进行的循环。\n\
    \n功能块的内容反映了用户所做的。分层结构可以正式地表示这种关系。任务树的根是所有应用程序通用的主要目标。该目标进一步细分为三个子目标及其相关操作（图 4.4\
    \ 和 4.5）。\n\n此示例中的功能块是面向任务的还是面向对象的？这种功能块围绕着参数和操作，看起来是面向对象的。然而，在预约示例中，这些功能块是面向任务的……\n\
    \n![](img/03d8a14fde3082fc884c0d2b2be68fd9_33_0.png)\n\n图 4.5：任务结构的想法。\n\n# 配置层\
    \ (The Configuration Layer)\n\n配置层是多个元素组合在一起的结果，也就是我们在功能层看到的内容。配置层是元素之间关系的抽象¹\n\
    \n![](img/03d8a14fde3082fc884c0d2b2be68fd9_35_0.png)\n\n## 概念元素 (CONCEPTUAL ELEMENTS)\n\
    \n用户交互通常涉及做某事，然后“转换”到其他事，直到实现目标。这种空间关系描述了用户访问和导航的“地方”。因此，概念模型中的基础元素是这些地方。\n\n\
    ## 配置：概念模型元素之间的连接 (CONFIGURATION: THE CONNECTIONS BETWEEN CONCEPTUAL MODEL ELEMENTS)\n\
    \n连接元素的配置可以支持任务的完成，特别是涉及许多操作和参数的任务。概念元素之间连接的强度是它们关系的另一个特征。某些连接由于交互频率、一个任务依赖于另一个或任务功能相似而更强。此外，有多种配置连接元素以支持不同的任务和交互流。\n\
    \n为了模拟“地方”（每个“地方”都是功能块的容器）以及它们之间的连接，我们将每个“地方”表示为一个空框。连接框的线表示概念模型元素之间的连接。这种作为框和线的底层配置的示意图图就是你的第一份“巾草图”。有些人将其称为最基础的框架。通过视觉表示，图\
    \ 5.1 展示了四个概念元素的不同配置如何导致三种不同的模型。\n\n图 5.1 显示了配置 A 中顺序链接的元素。在这种配置中，两个元素（1 和 4）仅连接到另一个元素，两个元素（2\
    \ 和 3）连接到其他元素。在配置 B 中，元素与另外两个元素连接。此外，每个元素都缺少与另一个元素的连接。最后，配置 C 中，两个元素（1 和 2）与另外两个元素连接，其余元素（3\
    \ 和 4）每个连接到单个元素。¹ 等效于“地方”之间的连接，整体配置支持用户目标。设计得当，这些元素具有两个基本特征：\n\n1. 完全或部分地支持至少一个任务（例如设置预约或结束提醒）。\n\
    2. 为用户提供执行任务的机会。因此，概念元素是交互式元素。\n\n> 线框本身可以出现在并应用于多个抽象层级，即具有不同程度的细节。这将在书的后续入门部分以及概述概念模型方法论的第二部分进行进一步讨论。\n\
    \n"
