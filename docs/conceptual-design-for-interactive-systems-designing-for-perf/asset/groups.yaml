    # PROJECT MANAGEMENT CONSIDERATIONS


    At this point, we have a conceptual model with the navigation map. Having conducted
    an evaluation, and when relevant, some revisions, we can say we have a validated
    model. What is the impact of this step and its outcome?


    We should consider several points with respect to what we can do with this outcome.
    Remember, this is an interim outcome. We are still in the process and this is
    work in progress. By analogy, if we view the process as building a house, we have
    just laid the foundation. The significance and impact of this foundational model
    are the following:


    - 1. We have a conceptual model founded on user research, rigorous methodology,
    and scientific underpinnings.

    - 2. We have a conceptual model that has undergone a formative evaluation.

    - 3. We have a detailed sketch of the conceptual model we can share with stakeholders.

    - 4. We have a well-defined framework with which we can proceed towards the detailed
    design.

    - 5. We have a well-defined framework within which we can start prototyping parts
    of the product.


    As we indicated in the previous step, the outcome here may not be concrete enough
    for some team members and stakeholders to relate to. You can run ahead the next
    steps for some of the elements in order to provide a more concrete illustration
    of the model. But always make sure that at the end, you do skip the steps suggested
    to ensure a coherent conceptual model.


    | Navigation Map—Key Practical Points |

    | :--- |

    | Outline the navigation map based on scenarios and workflows. |

    | Include in the navigation map entry points, exit points, and routes that can
    be taken through the conceptual model. |

    | Overlay the conceptual model diagram with arrows indicating navigational information.
    |

    | Validate the model and the navigation map by preparing a scenario with the model
    to evaluate with team members and other stakeholders. |


    # Navigation Policy:

    Define the “Rules of the Road”


    As promised in the previous chapter, we continue here to fine-tune the navigation
    map by determining the physical assignment and finalizing the navigation policy.
    In terms of the layered framework, we are still on the navigation and policy layer.
    The outcome of this step is the detailed and fine-tuned navigation map with all
    the behaviors defined.


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_129_0.png)


    # What''s in This Step?


    The relevant activities in navigation and policy for fine-tuning navigation map
    are the following:


    - 1. Define the physical place assignment.

    - 2. Start prototyping.

    - 3. Define policy (modality).

    - 4. Revisit and revise.

    - 5. Define operational principles.

    - 6. Evaluate and revise.


    # DEFINE PHYSICAL PLACES FOR CONCEPTUAL ELEMENTS


    While still far from making detailed implementation decisions, at this point,
    we should assign conceptual elements to their physical places. As explained in
    the primer part of this book, the assignment to physical places has an impact
    on navigation and interaction policy. You can use several decision criteria to
    assign conceptual elements to physical places as described below.


    # Human performance goals


    The following human performance criteria have been outlined and discussed in the
    primer and may be considered as performance goals:


    - Mental models and understanding

    - Location awareness

    - Visual search effectiveness

    - Operational (executing actions) load

    - Working memory load


    We can use these performance goals as primary decision criteria for physical assignments
    (Table 17.1).

    As always with human behavior, we may trade-offs between goals. The very common
    one is the trade-off between increasing visual effectiveness and reducing operational
    load. Resolve the trade-offs between the performance gals with additional implications
    from the user research analyses, context of use, and interaction channels.


    # NAVIGATION POLICY: DEFINE THE "RULES OF THE ROAD" 115


    | Human performance goals | Conceptual | Physical assignment |

    | :--- | :--- | :--- |

    | Facilitate intuitive understanding | Express affinities between elements | All
    elements in one or few windows |

    | Support location awareness | Keep elements in fewer places Shorten navigation
    routes required to complete tasks | Separate physical place for each but in one
    window (e.g., use a matrix model or tabs within the same) |

    | Minimize working memory load | | |

    | Reduce operational load | | |

    | Increase visual effectiveness | Minimize number of elements in a single chunk
    | Have elements in several places to minimize the amount of details in a given
    place |


    TABLE 17.1:

    Using human performance goals as criteria to determine physical assignment of
    conceptual models


    # Analyses implications


    The analyses relevant to assigning conceptual models to physical locations are
    task analysis, object-action analysis, and the desired interaction flow. These
    analyses have the following outcomes and implications:


    What do we do something?—One of the outcomes of task analysis is the frequency
    with which tasks are performed or expected to be performed. Tasks and associated
    conceptual elements with similar frequencies can be considered for the same physical
    place or in close proximity.


    What do we do at the same time?—An outcome of all the analyses is whether tasks
    and actions are typically performed at the same time, or close to each other.
    Tasks and actions done at the same time, on the same object or different objects,
    can be considered for the same physical place or in close proximity.


    What do we do after another?—An outcome of the desired interaction flow and of
    task analysis is the sequence with which tasks and actions are performed or supposed
    to be performed. Together with similar frequency and/or doing things at the same
    time, operations in a sequence can be considered for the same physical place or
    in close proximity.


    What depends on what?—A primary outcome of the desired interaction flow, and also
    implied from the task analysis and object-action analysis, is the dependency between
    actions. Dependency is the requirement that a given action must precede another
    action. A simple, almost everyday example for dependency in many programs and
    applications is between copy or cut and paste. Actions with dependency relations
    between them can be considered for the same physical place or in close proximity.


    What do we see at the same time?—An outcome of all the analyses is the required
    expected visibility of tasks and objects. The visibility of a task or an object
