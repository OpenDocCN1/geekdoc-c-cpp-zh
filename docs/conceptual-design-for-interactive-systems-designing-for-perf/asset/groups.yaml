    The first time Jake used the application, he started with the Setup screen. He
    first set it up and then went on to configure the HR monitor to watch the application.
    As part of his planning he went on to define several planned workouts.


    From the Setup screen he navigated to the Planned Workouts screen. He set up a
    sequence of distances planning to run at different times.


    When he ran, he would glance at the screen of his phone, and count the sequence
    of episodes in his story mapping his running performance, to a map showing where
    he was.


    Once he completed his run, the application switched to a screen summary where
    he could view parameters of his performance. He could also access summaries of
    previous runs.


    FIGURE 18.4


    A partial storyboard for the running experience example with the mobile channel
    presented as a story.


    primarily cinema and video, and later digital media. The fundamental idea is to
    present in a visual graphic fashion to illustrate the sequence of episodes in
    the story. Storyboarding was adapted in the area of requirements gathering (Andriole,
    1992), scenario-based design (Carroll, 2000), and user interface design (Landay
    & Myers, 2001).


    The idea of the storyboard as part of the conceptual design process is to represent
    the full conceptual model in terms of key interaction flows, according to the
    scenarios and analyses we use from the research. The detailed storyboard is a
    powerful tool for communicating and testing the conceptual model. We can present
    it as the form of the user scenario (see Figure 18.4).


    Another way to present the storyboard is create a navigation map with the key
    prototyped and detailed conceptual elements in contrast to the navigation map
    we used so far with boxes-and-arrows representations (Figure 18.5).


    # TEST AND REVIEW


    So far, we used inspection tools as the checklist proposed in the earlier steps
    for evaluations. We did not have the possibility to collect “real” performance
    and experience measures. Now, we have a prototyped and detailed conceptual design,
    and you can employ formative testing involving users and usage scenarios, and
    stakeholders can collect various usability and experience metrics. With the details
    and the prototype, we have now gained a significant additional capability of evaluation
    and testing in comparison with the earlier inspections.


    Many of the available books and resources on usability testing and measuring user
    experience are relevant for the testing at this stage. We will not elaborate on
    testing in view of the abundance of resources on usability testing and as this
    book focuses only on the conceptual design phase in the entire life cycle'
