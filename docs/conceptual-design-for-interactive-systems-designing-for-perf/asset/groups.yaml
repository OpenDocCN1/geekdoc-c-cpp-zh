    其他概念模型的设计者将旧设计推向了新的方向，例如将纸质变为电子书，将汽车仪表盘旋钮变为触摸屏组件。然而，用户体验设计师最大的成功体现在全球 60 亿手机用户身上。虽然摩尔定律和其他技术进步是重要的因素，但我认为，这些设计师厨师们在烹饪
    Web 浏览器、桌面软件和智能手机应用程序方面，其广受赞誉的贡献理应巨大的荣誉。生活在很多时候变得更美好，是因为人类通信的便利性连接了家庭，电子商务促进了业务，医疗保健的提高延长并提高了生活质量，等等。当然，网络犯罪分子、诈骗者、垃圾邮件发送者和恐怖分子也利用了这些新技术，这提醒我们，易用性和通用性具有令人困扰的负面影响，我们必须保持警惕。


    卓越的文艺复兴思想家巴明斯特·富勒（Buckminster Fuller）提倡“全面预测性设计科学”，这鼓励现代设计师思考未来的影响，考虑意外之外的副作用，尊重不同利益相关者的需求，并确保可用性。他不断提醒人们对地球影响和设计伦理的关注。我们应该继续阅读并受他思想的启发。


    总之，技术的进步为设计师带来了巨大的机遇和挑战。有数以千计籍和网站介绍了设计的各个方面，包括设计思维、设计方法、设计理论、设计研究和设计科学。新手设计师可以从这些化的来源中学习到很多，现在
    Avi Parush 为设计师如何开发基本概念，以及支持功能、逻辑配置、易记忆的导航与策略、易于理解的形式和引人入胜细节的相关信息架构提供了全新的视角。这种分层的方法一直是设计指南的标准特征，Parush
    引导新手和专家设计师完成了创建功能分块、概念模型元素、物理模型元素、详细概念元素和用户界面元素的步骤。


    Parush 的描述非常精确，并辅以有帮助的示例。他对用词的仔细选择和清晰的图表引导了读者并澄清了概念。当然，每位旅行者和设计师都会找到自己的道路，但 Parush
    有价值的指南将帮助体验设计师让新手更容易学习新系统，同时为专家提供更大的灵活性。


    > —本·什尼德曼 (Ben Shneiderman)

