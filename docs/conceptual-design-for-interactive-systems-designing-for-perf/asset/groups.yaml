    ## 运行原则


    我们已经多次提到，通道的特性（如屏幕大小和视觉效果）是整个设计过程中做出决策的一些基本标准。在此之后，交互的另一个重要特性是物理性的。与桌面式计算机交互的最简单示例是键盘和鼠标。键盘输入文本、发布命令、导航、启动程序并控制设备（例如磁盘驱动器、音量和照明）。鼠标通过点击和拖放等操作对屏幕元素进行直接操控（Shneiderman,
