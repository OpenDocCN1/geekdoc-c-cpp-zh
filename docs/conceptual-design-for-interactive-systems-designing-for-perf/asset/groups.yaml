    # 项目管理考虑：这不必是一个线性过程！


    这个过程看起来是线性的，你可能会怀疑它在某些情况下的适用性。尽管过程是以线性方式描述的，但并不意味着它实际上也是线性的。换句话说，不要恐慌！这并不是建议我们遵循臭名昭著的瀑布模型。但同样，这也不意味着我们必须遵循敏捷或或精益方法。正如你所看到的，每一步都提倡迭代过程：重新审视之前的步骤并进行修改。


    目标并不一定是要遵循线性过程，而是确保设计的每一个层级在最后都能得到覆盖并良好整合。


    # 第一，用户研究。

    尽管去做（Just Do It）


    理解用户心理和人类性能的关键因素对于概念模型的设计及其评估至关重要。提醒一下，这些因素包括：


    - 心理模型与理解

    - 位置感知

    - 视觉搜索有效性

    - 操作（执行动作）负载

    - 工作记忆负载


    在设计之前、期间和之后进行的用户和使用研究可以提供关于这些因素的信息和见解。正如前言所述，熟悉用户和使用研究是读这本书的前提。由于用户研究对概念设计至关重要，我们将在有限的范围内对其进行介绍，因为本书侧重于构建概念模型的程序性步骤。以下是用户研究中与概念设计相关的关键技术和成果的简要概述。该概述将介绍我们在书中方法论部分使用的“贯穿始终”示例。


    用户和使用研究，无论其目的是什么，通常包含以下内容：


    - 数据收集

    - 分析


    # 数据收集


    数据来源和收集技术

    在进行用户和使用研究时，你希望尽可能接近真实用户，以及他们执行任务和交互的自然语境。这将产生更接近现实的数据，或者用更科学的话说，具有更高的生态效度的数据。然而，有时我们不得不妥协，在离开自然语境的情况下进行研究，甚至不是与真实用户一起进行。尽管如此，通过这种距离，我们仍然可以收集与概念设计过程高度相关的价值数据。以上是根据我们与真实用户及使用自然语境接近程度划分的用户研究中最常见的数据收集技术的简述（表
    13.1）。


    # 80 概念设计：方法论


    表 13.1：设计目的的用户研究中最常见的数据来源和收集技术汇总


    | 来源 | 收集技术 |

    |---|---|---|

    | 非常接近真实用户和语境 | 语境中的用户 | 访谈、观察、实地控制研究、背景性能测量 |

    | | 远程、语境中的用户 | 性能远程采集、口头数据远程采集 |

    | | 脱离语境的用户 | 焦点小组、问调查、实验室控制研究、文档和归档 |

    | 非常远离真实用户和语境 | 其他利益相关者 | 业务计划、文档和归档、竞争分析 |


    # 收集的数据


    用户研究中数据收集的首要目标是尽可能获取关于用户的信息。表 13.2 概述了我们希望回答的关键问题。通过上一节概述的各种收集技术收集的最常见数据类型与研究问题列在一起。最后，表格列出了数据的实际成果，这些成果为问题提供了答案并被用于概念设计。


    表 13.2：作为研究问题函数的数据类型以及关键实际成果


    | | | | | | | | |

    |---|---|---|---|---|---|---|

    | | 口头数据和叙述 | 计数和频率 | 评分量表 | 时间和时长 | 实际成果 |

    | 你的研究问题 | 用户是谁？ | ✓ | | | | | 用户画像和人物模型 |

    | | 他们在做什么或想做什么？ | ✓ | ✓ | ✓ | | 目标和任务；主题对象 |

    | | 他们为什么要做他们正在做或想做的事？ | ✓ | ✓ | ✓ | | 故事、场景、用例 |

    | | 他们在什么语境下做或想做？ | ✓ | | | ✓ | 地点、时间、状态和大部分 |

    | | 他们是如何做的？ | ✓ | ✓ | | | | 交互流、任务模型、对象-动作映射 |


    # 分析


    对数据进行各种分析的实际成果是对我们研究问题的回答。以下是与概念设计相关的关键成果概述。我们还借此来介绍我们用于说明概念设计方法的“贯穿始终”的示例。我们的“贯穿始终”示例字面意思就是关于跑步的示例。更具体地说，它是关于使用设备和交互式应用程序来促进和支持跑步体验。


    # 用户画像和人物模型


    一方面受业务目标和目的的指导，另一方面根据收集到的数据的发现，将现有或潜在的用户群划分为子群体。每个子群体构成一个用户画像，并根据关键研究问题的答案进行统一描述。每个片段由一个人物模型（persona）表示。关于根据什么标准划分人群、应该构建多少个用户和人物模型，以及人物模型的有用参数，在其他资源中有所讨论（Mulder
    & Yaar, 2007; Pruitt & Adlin, 2006）。贯穿示例的一个例子如图 13.1 所示。


    # 用户使用场景


    场景是关于用户的故事。场景从“从摇篮到坟墓”类型到与产品交互的具体实例，涵盖了意图、动机、状态和感受（Rosson & Carroll, 2009）。为每个人物模型准备至少三个场景：


    1. 生命周期场景

    2. 典型的一天场景

    3. 问题场景


    场景作为执行后续分析（如任务分析）的基础。


    # 概念设计：方法论


    “跑步就像一部电影。观察它的帧并从中构建故事线”


    Jake 是一位记者，几乎 7x24 小工作，住在渥特华，无论夏天冬天都喜欢跑步。当他搬到渥特华并想在冬天跑步时，他了解到应该穿层，包括专业的鞋。Jake
    喜欢带着心率（HR）监测器、播放音乐的跑步程序并随身携带手机![](img/03d8a14fde3082fc884c0d2b2be68fd9_98_0.png)


    # 基本信息


    - 记者

