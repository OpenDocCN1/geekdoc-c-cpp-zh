    # 第 19 章

    总结：概念设计方法论概览


    作为一种总结方式，现在让我们把整套方法论归纳为 1-2-3 步的过程。其思路如下：


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_153_0.png)


