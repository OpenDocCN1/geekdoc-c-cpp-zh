    # START PROTOTYPING


    When assigning conceptual elements to physical places, we transition from representing
    the model in boxes and arrows to representing the model in users of interface
    elements. This is a good time to start prototyping. The idea is that the prototype
    you start constructing now will evolve and unfold as we proceed to add details
    to the conceptual model and transition to the detailed design. The prototype will
    serve as a design tool, a communication channel with all stakeholders, and a tool
    for evaluation and testing. See an example for the initial prototyping of the
    conceptual model in the running example in Figure 17.1.


    What we see in Figure 17.1 is the physical assignment of the conceptual elements
    in the model for each of the interaction channels in the running example, along
    with the abstract sketch of the model. In the top part of the figure, we see the
    conceptual model for the desktop channel, where all elements were assigned to
    a single physical place, a web page. That place has two subarrays, tabs, for all
    the elements associated with the setup tasks and the other for all the elements
    that are instances of a workout. Analyses and context of usage were used as criteria
    for such an assignment. More specifically, the setup tasks and the workout-related
    tasks are not done with the same frequency; they do not require concurrent or
    sequential operation and not need to be visible at the same time. In addition,
    setup tasks are typically done before running, whereas interaction with the workout
    elements is done typically and after every run. Recall that the navigation map
    allows for several entry and exit points. The physical assignment to a single
    web page nevertheless supports access to several points.


    In the bottom part of Figure 17.2, we see the conceptual model for the mobile
    channel, where all elements were assigned to different screens (remember that
    things are sometimes not what they seem, and more will be revealed in the sections
    where we talk about policy and operational principles). Here, we used similar
    criteria to the ones used for the desktop channel when assigning conceptual elements
    to physical places. Setup tasks are typically done before running, altogether
    were assigned to one screen. Each of the running elements was assigned to another
    screen since each is interacted with at different times and contexts during the
    running journey and each of those was assigned to a different screen. Recall that
    we have several entry and exit points in the navigation map. Due to the small-screen
    interaction channel, we cannot provide access to all points in the same manner
    we did for the desktop, the large-screen channel. Consequently, we need to “create”
    a new place that will serve as the main entry point and the access routes to all
    other elements. The top element in Figure 17.2 is that main entry point.'
