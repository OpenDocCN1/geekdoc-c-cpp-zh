    # 概念模型——基础


    到目前为止，序言和本节标题表明，书中一个核心概念是“概念模型”。本书第一部分的目标是介绍交互系统中概念模型的基础并讨论其影响。简而言之，概念模型是概念元素的配置以及元素之间的导航。因此，概念模型是任何交互系统用户界面的基础。然而，在我们继续使用听起来抽象的词汇和句子之前，让我们先来看一个例子。在跨交互渠道设计有效且一致的用户体验是具有挑战性的。我们将在书中强调这一挑战。本书这部分的运行示例是一个多渠道和跨渠道的交互案例。


    ## 多渠道跨渠道示例：设置预约


    为了说明概念模型的基本组件，我们引入并分析了四个现有的日历应用程序。这四个应用程序都在设置预约，且每个都在不同的交互渠道上。这种对比说明可以证明你如何使用不同的概念模型来实现相同的目标。


    交互流的第一步对所有应用程序都是通用的：为了设置预约，用户可以通过点击日历或激活某个选项来选择起始日期和时间。


    示例日历分布在以下渠道：

    - 桌面端

    - Web 端

    - 平板

    - 智能手机


    第一个应用程序是基于 Windows 的，通常安装在桌面电脑和笔记本电脑上，具有熟悉的图形用户界面（GUI）。在日历中，用户可以执行以下任务：

    - 1. 设置基础预约：主题和地点，以及指定日期和时间的控件

    - 2. 设置提醒：通过下拉列表选择提醒的提前时间

    - 3. 设置循环：循环频率和日期范围


    第二个应用程序是 Web 端日历。与 Windows 应用程序一样，该应用程序中的交互流也允许从日历中的特定时间段开始，在这种情况下，日期和时间已经根据起始点设置好（图
    1.2 中的弹出模态窗口 1）。用户可以

    - 1. 在页面右上角设置基础预约参数

    - 2. 通过将其移动到页面其他位置并打开提醒提前时间列表来设置提醒

    - 3. 通过打开弹出模态窗口设置循环，其中包含循环频率和额外参数


    第三个日历应用程序用于触摸平板电脑。与上面分析的两个应用程序一样，交互从日历开始，屏幕上弹出一个对话框（图 1.3 中的 1）。用户可以：

    - 1. 直接在窗口顶部定义预约的（目的）和地地点

    - 2. 设置或编辑预约的日期和时间，一个新的弹出模态窗口会覆盖在之前的窗口之上，可以在其中设置日期和时间


