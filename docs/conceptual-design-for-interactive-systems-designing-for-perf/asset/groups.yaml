    ## CONCEPTUAL DESIGN IN CONTEXT: THINK STRATEGICALLY


    *Implementation*: Once the design reaches a point where it can be implemented,
    the actual development and building of the product (e.g., code writing in a computer
    program) takes place. In some approaches (e.g., agile), design, testing, and implementation
    often overlap.


    *Testing*: User-oriented approaches advocate early and formative evaluation and
    testing that take place throughout the process. There are some cases where summative
    evaluation and testing take place before releasing the product to the end user.
    In some approaches, the testing is part of smaller and shorter cycles including
    design, implementation, and testing.


    *Deployment*: The final phase, regardless of the development approach, is the
    release of the product to the end user and the initial or ongoing user support.


    Depending on the approach and methodology of system development, these activities
    may take place in different orders. For example, some summative testing can take
    place at earlier stages of the process for parts of the product to be released;
    the product may be incomplete before release (such as in agile and lean approaches),
    where design and implementation and deployment can take place for parts of the
    system) or be highly iterative (e.g., research and redesign can be done after
    testing or lessons learned from deployment). Regardless of the specific approach,
    most do include all the core activities and processes described above.


    Strategic and business considerations are intertwined in the overall human-oriented
    design and whatever specific design and development approach is taken. In addition,
    specific characteristics of project management are important to consider within
    the overall context of conceptual design. The following two sections address these
    issues.


    ## PROJECT MANAGEMENT


    The various business considerations and all the stakeholders influence managing
    the design and development enterprise as an effective project. As a designer,
    you should be concerned with (1) the ability to conduct user research within the
    development approach, (2) keeping the design priorities within the project, and
    (3) considering all the stakeholders that may have an impact on interaction and
    UX design.


    ## Design and development approach: the place of user research


    User and usage research are a prerequisite for the conceptual design of any product.
    In the classical and more traditional approaches of user-centered or human-oriented
    design, having conducted user research is an obvious step. Some of the most recent
    approaches such as the agile and lean approaches are more of a challenge to adequate
    user research because of their commitment to supply the end client/customer with
    an outcome as early as possible. Thus, spending time in up-front user research
    may seem by some a waste of time, rather than a critical investment. Moreover,
    the work associated with the up-front development of the conceptual model fundamentals
    could also be seen as time that rather be invested in actual development. Other
    published work provides some great ideas and perspectives on the place and role
    of designing positive UX and usability in agile and lean development processes
    (Gotthelf & Seiden, 2013; Ratcliffe & McNeil, 2012). The methodology outlined
    here assumes that some user and usage research have been conducted prior to embarking
    any of the design and development activities.


    ## Multi- and cross-channel design and development strategy


    Systems and products are designed and developed in such a way that they can run
    on multiple devices in multiple contexts. Moreover, users can start a task on
    one device and continue/complete the task on another device. This is referred
    to as multichannel or cross-channel interaction and experience, where channel
    is defined as the venue through which a user interacts with the subject matter
    or content domain of the application/product/system. In the computerized interactive
    systems realm, a channel is most often device as as a desktop computer, a mobile
    device, an information booth or kiosk, an interactive voice response system, or
    any embedded interactive device (e.g., in-vehicle built-in navigation system).


    The priorities within the project respect to designing user interface, interaction,
    and UX for the various channels—when relevant—are set as a function of the business
    considerations. Updating an existing product due to user needs or new technology
    or other business goals could be realized in time of adding a new channel. The
    design and development of that channel will get the highest priority in such a
    context. In a context of a new product aimed to be realized on several channels,
    priority is given to one channel over others due to user needs or other business
    goals and considerations (e.g., competition and market needs and new partners).


    ## The teamwork approach


    Whatever the design and development approach is, a multidisciplinary team approach
    is critical for ensuring the inclusion of usability and UX considerations throughout
    the life cycle of the product. Moreover, it is critical for usability and UX design
    professionals to perform their task effectively. Usability and UX design professionals
    must work with users or user representatives. In addition, team with other professions
    such as business, marketing, sales, engineering, software developers, graphic
    and industrial designers, and technical writers. Finally, and maybe indirectly,
    work with other stakeholders such as business partners, investors, and other providers
    to take into consideration their goals and concerns.


    ## Conceptual Design: An Overview of the Methodology


    ## REVISITING THE FRAMEWORK


    The conceptual model was presented in the first part of the book within a layered
    framework. The layers underlie the final and detailed user interface. Building
    the conceptual model is the process of conceptual design and is at the heart of
    the methodology presented here in the second part of the book.


    Taking the framework as the basis for the conceptual design process, there are
    three main phases to manage it from the top up (Figure 12):


    - *The conceptual design*—This phase is the core of the methodology and spans
    three layers of the framework: the function, configuration, and the navigation
    and policy layers.

    - *The transition from conceptual to detailed design*—This is the phase where
    we transform the abstract aspects of the conceptual model to more concrete by
    adding details to them.

    - *The detailed design*—This is typically the final phase in designing the user
    interface, but it will not be covered in this book as it is focused on the conceptual
    part of the entire process. While this represents activities beyond the conceptual
    design, it is in the framework because the conceptual model is the foundation
    for the final detailed design. In addition, detailed design is a significant part
    of the overall context of designing interactive systems.


    The methodology will guide you through a series of design activities following
    the layers of the framework from the bottom up. We must address user research.
    We cannot, and should not start, the design process without having done some research.
    With in mind, we start in Chapter 13 with a refresher of some user research techniques
    and data that are relevant to the conceptual design. Chapter 14 tells us how to
    determine the functional chunks and their interrelations. The next step in Chapter
    15 is transforming the functional chunks into conceptual elements and linking
    between them to create the foundation of the model, the configuration of the elements.
    Chapter 16, we make the model and define the navigation map. Then, we fine-tune
    the navigation by Chapter 17 by defining the navigation policy along with the
    assignment of conceptual elements to physical places. Finally, Chapter 18 covers
    the transition from the conceptual design activities towards detailed design.
    Each of the chapters will also provide some project management considerations.

