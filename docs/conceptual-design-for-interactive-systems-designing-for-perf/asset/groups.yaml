    the usability and user experience requirements. The formulation of such requirements
    is an important outcome of user research.


    What does it mean, practically, to have usability requirements? Remember, for
    example, there can be some trade-off between efficiency and effectiveness. We
    determine whether the model should support effective interaction at the possible
    expense of efficiency, or perhaps the opposite, and formulate it as a requirement.
    In addition to being an outcome of user research, determining usability requirements
    should be related to the strategic aspects of the product.


    ## The strategic aspects


    Let us go back to strategic understanding and thinking. We must be aware of business
    objectives and ensure they are most directly or indirectly through the conceptual
    model. These include understanding the motivation for developing the product and
    other business considerations such as partners, branding, and future plans. Another
    important aspect is the way the design and development will be managed as a project.


    ### User Research—Key Practical Points

    - Do it! Have all team members and stakeholders involved.

    - Clearly define your research questions.

    - Consider data sources and collection techniques that will answer your research
    questions.

    - Identify user profiles, develop personas, and for each context scenarios.

    - Perform task analysis and delineate workflows.

    - Map objects and actions.

    - Map user journey and experience.

    - Formulate usability and experience requirements.

    - Consider the wider business aspects.


    Note that the consideration of the strategic aspects is included here as part
    of the prerequisite user research. In other words, some of the data you should
    gather and analyze should include the strategic aspects of the product and the
    project.


    We are now ready to start the conceptual design and construct the conceptual model.
    As you will see, there is very little magic and mystery in the transition from
    the research to design. The following are several methodical steps that can bridge
    the perceived mystical gap between research and design.


    ## Functional Chunks: Construct the Essential Foundation


    In the first step of conceptual design, we define the functional chunks. This
    is the step where we put some order in the subject matter of the system. In the
    world of Web sites, this is equivalent to the first step of putting together the
    information architecture. In this step, we rely heavily on some of the user research
    and analyses we did. Analyses such as the task analysis and object-action mapping
    guide us in defining the functional chunks and the links between them.


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_105_0.png)


    ## What''s in This Step?


    There are three activities when we start at the function level:


    1. Define the functional chunks.

    2. Link them.

    3. Pause and check yourself.


    ## DEFINE FUNCTIONAL CHUNKS


    We start with functions. Based on the research we have done, functions are the
    various actions, elements, and parameters that together make up the subject matter
    of the product. The first activity in constructing the conceptual model is to
    group functions into chunks. What are the key drivers to define functional chunks?
    Let us consider here two:


    *A priori*: Sometimes, there are *a priori* considerations for how to chunk the
    functions. These can be driven by business considerations and market trends, branding
    strategies, reflection of the underlying technology of the product, and a good
    representation of how users perceive the subject matter or, in other words, their
    mental model.


    *Emergent*: The chunks emerge from an empirical discovery process (e.g., a focus
    group or card sorting or employing the KJ method, from the task analysis, or based
    on the object-action analysis) with the task analysis.


    Regardless of whether chunking are *a priori* or emergent, we would like these
    chunks to be meaningful. What is a meaningful chunk? Let us start with simple
    functional chunks, which we later transform into compound chunks.


    ## Task-oriented functional chunks


    *Definition*: The core of a task-oriented functional chunk is a task. Appropriateness:
    Define task-oriented functional chunks when they fit users’ mental models, workflow
    reflects object-oriented interactions.


    The core of the task-oriented functional chunks in the running example, presented
    in Figures 14.1 and 14.2, are the tasks. The task-oriented functional chunks for
    the mobile channel (top of 14.1) are as follows: setup, plan workout, run, and
    review. Similarly, the task-oriented functional chunks for the desktop channel
    (bottom of 14.1) are.


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_107_0.png)


    FIGURE 14.1: Simple task-oriented functional chunks, denoted by rectangles, based
    on task analysis in the running example. The functional chunks for the mobile
    channel are at the top and for the desktop channel at the bottom.


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_107_1.png)


    FIGURE 14.2: Simple task-oriented functional chunks, denoted by the background
    rectangles, based on task flow in the running example.


    ## CONCEPTUAL DESIGN: A METHODOLOGY


    The task-oriented functional chunks based on the workflow (Figure 14.2) are as
    follows: setup, run, and review. We later transform those into conceptual model
    elements.


    ## Object-oriented functional chunks


    *Definition*: The core of an object-oriented functional chunk is an object from
    domain of the project. A clear distinction should be made between domain or subject
    matter objects and implementation objects. When looking for object-oriented functional
    chunks, these must reflect objects in the subject matter. Appropriateness: Define
    object-oriented functional chunks when


    - they fit users’ mental models,

    - workflow reflects object-oriented interactions.


    The core of the object-oriented functional chunks in the running example, presented
    in Figure 14.3, is an object. The objects, for the mobile channel, are Workout,
    with plan, real-time, and previous workouts as instances of this object. Similarly,
    the objects, for the desktop channel, are Workout, presented in Figure 14.4, with
    planned and previous workouts as instances of that object.


