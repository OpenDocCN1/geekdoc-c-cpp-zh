    # Summary of Part 1


    This part of the book analyzed and discussed the concept of conceptual model and
    its significance to performance and usability. These are your take-aways:


    +   - The conceptual model is composed of functional chunks and their respective
    conceptual elements, the configuration of the conceptual elements, the assignment
    of conceptual element to physical places, a navigation map among the elements,
    and a navigation policy.

    - There are several typologies of conceptual models: sequence, hierarchy, hub
    and speaks, matrix, and the network. Typically, however, most applications have
    a conceptual model that is a hybrid of these typologies.

    - Different conceptual models differ in the amount of degrees of freedom provided
    to the user in meeting the structuredness of the task. This in turn result in
    varying degrees of model complexity.

    - The conceptual model has implications to human performance, usability, and experience.
    With respect to performance, the conceptual model impacts understanding of the
    product and how to work with it (mental models), location awareness while interacting,
    the effectiveness of visual search, operational load, and working memory load.'
