    # 项目管理考虑因素


    到此时，我们已经有了一个带有导航地图的概念模型。在进行评估以及并在相关情况下进行了一些修订后，我们可以说我们拥有了一个经过验证的模型。这一步及其结果的影响是什么？


    我们应该就利用这一结果所能做的事情考虑以下几点。记住，这是一个中间结果。我们仍然处于过程中，这只是进行中的工作。类比一下，如果我们把这个过程比作盖房子，我们刚刚奠定了基础。这个基础性模型的意义和影响如下：


    - 1. 我们拥有一个基于用户研究、严谨方法论和科学依据的概念模型。

    - 2. 我们拥有经过形成性评估的概念模型。

    - 3. 我们有一个概念模型的详细草图，可以与利益相关者共享。

    - 4. 我们有了一个定义良好的框架，据此向详细设计推进。

    - 5. 我们有了一个定义良好的框架，可以在此开始产品部分的原型制作。


    正如我们在上一步中指出的，这里的结果对于某些团队成员和利益相关者来说可能不够具体，难以联系。你可以对某些元素提前执行后续步骤，以便为模型提供更具体的插图。但务必确保在最后不要跳过建议的步骤，以确保概念模型的连贯性。


    | 导航地图——关键实践点 |

    | :--- |

    | 基于场景和工作流勾勒导航地图。 |

    | 在导航地图中包含入口点、出口点以及通过概念模型可以采取的路线。 |

