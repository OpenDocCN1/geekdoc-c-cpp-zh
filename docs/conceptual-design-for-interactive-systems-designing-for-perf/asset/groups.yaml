    # CHAPTER 19

    Summary: Conceptual Design Methodology in a Glance


    As a way of summarizing, let us now take the entire methodology and sum it up
    as a 1-2-3 step process. Here is the idea:


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_153_0.png)'
  - '[PAGE 154]


    +   1. Sketch the conceptual model: Sketching the conceptual model spans three
    layers in the framework, from defining functional chunks, to configuring the model,
    to delineating the navigation map.


    +   2. Refine it: Refine the model by assigning elements to physical places, defining
    the policy, and fine-tuning the navigation and operational principles.


    +   3. Put everything together: Finally, put everything together by developing
    a fully prototyped detailed model.


    Along the line of the 1-2-3 process, here is the entire methodology in a single
    page you can take away with you and use as a quick reference card (Table 19.1):'
