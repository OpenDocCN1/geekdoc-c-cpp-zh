    # OUTLINE NAVIGATION MAP


    Having determined a pivotal conceptual element, and having reconfigured the model
    to accommodate that element, brings us to the navigation map. As we progress with
    the design process, we will later refine the navigation map by considering the
    assignment of conceptual elements to physical places and determining the navigation
    policy. Nevertheless, for now, we outline the conceptual navigation map by defining
    the following:


    +   - Entry and exit conceptual elements

    - The navigation directionality of the links between the conceptual elements


    In order to determine these, you should use the reconfigured model based on the
    identified pivotal element and the interaction workflow. With respect to navigation,
    the concept of a pivotal element is such that we have to have the user get to
    it as soon as possible. It could either be the starting point or have the shortest
    route to it. This should not only correspond to the typical interaction workflow
    but also support all possible workflows that can be uncovered through user research
    or based on user research.


    The navigation maps for the mobile and desktop channels in our running example
    are presented in Figures 16.1 and 16.2, respectively. Note that in both of them,
    we have several entry and exit places. We will need to consider this when we assign
    the elements to physical places and fine-tune the navigation map.


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_124_0.png)


    FIGURE 16.1: Conceptual navigation map for the mobile channel in the running example.'
  - '[PAGE 125]


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_125_0.png)


    The rearrange navigation maps preserve all the conceptual elements of the model,
    but we can rearrange the sketch in a way that reflects the journey map and workflow.
    In the examples in Figures 16.1 and 16.2, the elements are arranged in a way that
    the most typical and common workflows progress from left to right and from top
    to bottom. Typical workflow, with either the mobile or the desktop channels, starts
    with the prerun setup, then progresses to the running itself, and concludes with
    the postrun activities. The two-way arrows that break through the boxes depicting
    the compound elements start and exit places of the interactions. Note that the
    pivotal status of the workout is consistent in both navigation maps.


    # EVALUATE AND REVISE


    What we have in our hands is a conceptual model including the navigation map.
    Is it a valid model? Is it a good model? In other words, is this model appropriate
    to user needs or does it support business objectives? It could be challenging
    to address such questions when we really have a sketched diagram. Nevertheless,
    we can address some fundamental questions in assessing the validity and goodness
    of the model.


    First, who should be involved in the evaluation? Ideally, representatives of all
    stakeholders should be involved. Those include users, the design and development
    team, and representatives of the business aspects of the product. Second, since
    at this point all we have are sketches, we can run an inspection-style evaluation
    of the model.'
