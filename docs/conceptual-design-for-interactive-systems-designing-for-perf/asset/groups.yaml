    # PROJECT MANAGEMENT CONSIDERATIONS: THIS DOES NOT HAVE TO BE A LINEAR PROCESS!


    The process seems linear and you may doubt its applicability in some instances.
    Even though the process is described in a linear fashion, it is not to say that
    it is indeed linear. In other words, don''t panic! It is not suggesting that we
    follow the infamous waterfall approach. But in the same vein, it is not to say
    that we necessarily follow an agile or lean approach. And as you will see, each
    step advocates an iterative process: revisiting previous steps and doing revisions.


    The goal is not necessarily to follow a linear process but rather ensure that
    all layers of the design are covered and well integrated at the end.


    # First, User Research.

    Just Do It


    Understanding key factors in user psychology and human performance is critical
    to the design of the conceptual models and their evaluation. To remind you, these
    factors include the following:


    - Mental models and understanding

    - Location awareness

    - Visual search effectiveness

    - Operational (executing actions) load

    - Working memory load


    User and usage research conducted before, during, and after the design can provide
    information and insights regarding those factors. As said in the preface, familiarity
    with user and usage research is a prerequisite for this book. Since user research
    is critical to conceptual design, we will go over it within a limited scope because
    the book focuses on the procedural steps in building the conceptual model. The
    following is a brief overview of some of the key techniques and outcomes in user
    research that are relevant to conceptual design. This overview will introduce
    our “running” example for the methodology part of the book.


    User and usage research, for whatever purpose it is, typically consists of the
    following:


    - Data collection

    - Analysis


    # DATA COLLECTION


    Data sources and collection techniques

    When conducting user and usage research, you want to get as close as possible
    to the real users and to the natural context where they perform their tasks and
    interactions. This will result in data that are closer to real life or, in more
    scientific words, have a higher ecological validity. However, sometimes, we have
    to compromise and conduct the research away from the natural context or even not
    with the real users. Nevertheless, with such distance, we can still collect valuable
    data that are highly relevant to the conceptual design process. Above is a brief
    overview of the most common data collection techniques in user research organized
    by our closeness to the real users and the natural context of usage (Table 13.1).


    # 80 CONCEPTUAL DESIGN: A METHODOLOGY


    TABLE 13.1: Summary of the most common data sources and collection techniques
    in user research for design purposes


    | Source | Collection techniques |

    |---|---|---|

    | Very close to real users and context | Users in context | Interviews, Observations,
    Field-controlled studies, Background performance measures |

    | | Remotely, users in context | Remote-capture of performance, Remote of verbal
    data |

    | | Users out of context | Focus groups, Survey, Lab-controlled studies, Documentation
    and archives |

    | Very far from real users and context | Other stakeholders | Business plans,
    Documentation and archives, Competition analysis |


    # Data collected


    The primary objective of data collection in user research is to have as much information
    as possible about users. Table 13.2 outlines the key questions we would like answered.
    The most common data types, collected with the variety of collection techniques
    outlined in the previous section, are listed along with the research questions.
    Finally, the table lists the practical outcomes of the data that provide answers
    to the questions and are utilized in the conceptual design.


    TABLE 13.2: Data types as a function of research questions, along with key practical
    outcomes


    | | | | | | | |

    |---|---|---|---|---|---|

    | | Verbal data and narratives | Counts and frequencies | Rating scales | Times
    and durations | Practical outcomes |

    | Your research question | Who are the users? | ✓ | | | | User profiles and personas
    |

    | | What do they do or want to do? | ✓ | ✓ | ✓ | | Goals and tasks; subject matter
    objects |

    | Why do they do what they do or want to do? | ✓ | ✓ | ✓ | | Stories, scenarios,
    use cases |

    | In what context do they do it or want to do it? | ✓ | | | ✓ | Places, times,
    states, and most |

    | How do they do it? | ✓ | ✓ | | | Interaction flows, task models, object-action
    maps |


    # ANALYSIS


    The practical outcomes of various analyses of the data are answers to our research
    questions. The following is an overview of the key outcomes relevant to conceptual
    design. We also use this to introduce our “running” example for illustrating the
    conceptual design methodology. Our “running” example is literally an example about
    running. More specifically, it is about using devices and interactive applications
    at facilitating and supporting the running experience.


    # User profiles and personas


    Guided by both business goals and objectives, on the one hand, and the findings
    of the data collected, on the other the existing or prospective user population
    is segmented into subpopulations. Each segment constitutes a user profile and
    is uniformly characterized by the answers to the key research questions. Each
    segment is represented by a persona. Various questions by which criteria to segment
    the population, how many users and personas should be constructed, and what are
    the useful parameters of a persona as discussed in other resources (Mulder & Yaar,
    2007; Pruitt & Adlin, 2006). An example of a running example is presented in Figure
    13.1.


    # User usage scenarios


    Scenarios are stories about users. Scenarios range from “cradle-to-grave” type
    to specific instances of interacting with the product, covering the intentions,
    motivations, states, and feelings (Rosson & Carroll, 2009). You should have at
    least three scenarios for each persona:


    1. A full life cycle scenario

    2. A specific “day in the life”

    3. A “problematic” scenario


    The scenarios serve as the primary foundation for performing subsequent analysis
    such as task and interaction flow.


    # CONCEPTUAL DESIGN: A METHODOLOGY


    "Running is like a movie. See its frames and build a story line from them"


    Jake is a journalist, working almost 24/7, living in Ottawa, and loves to run
    anytime, summer or winter. When he moved to Ottawa and wanted to run in the winter,
    he learned that he should put on layers, including heavy-duty shoes. Jake loves
    running with a heart rate (HR) monitor, a running program that plays music, and
    always has his phone with him.![](img/03d8a14fde3082fc884c0d2b2be68fd9_98_0.png)


    # General information


    - Journalist

    - Works with photographers and editor

    - Works 7 days a week, sometimes late at night

    - Prefers in-running city, anytime

    - Uses GPS and music player

    - Heavy user of smart phone


    # Goals


    # Amateur


    - Improve cardio

    - Enjoy running


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_98_1.png)


    # Values


    - Efficiency

    - Hard work

    - Aesthetics


    # Pain points


    - Device setup

    - Too many steps

    - Info while running


    FIGURE 13.1

    An example of a persona in the "running" example.


    # Persona and scenario implications


    Let us consider the implications of the persona and the scenarios to the conceptual
    model. The persona reveals a very busy person with his occupation, yet passionate
    about running and highly motivated to keep and improve his physical shape. The
    persona seems to be tech-savvy and on the lookout for the state-of-the-art devices
