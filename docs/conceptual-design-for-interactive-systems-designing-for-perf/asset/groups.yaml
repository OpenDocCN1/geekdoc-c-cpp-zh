    ## On Working Memory


    If you are not required to remember much, you can do more! Interaction is inherently
    sequential. We tend to do things one after another, and it is very challenging
    to do things simultaneously. To accomplish our goals, we should be fully aware
    of what we did, and what we are doing now, what we are yet to do and where. For
    this, we have to store information about actions and “places” in some sort of
    a memory buffer. The psychology of perception, attention, and memory refers to
    this working memory. The working memory is transient in the sense that it working
    memory is a transient and limited-capacity buffer we use to store and retrieve
    information we require while performing actions and interacting with a product,
    keeps for a relatively short time (4–10 s) and is limited in terms of the amount
    of information it can store and use at a given moment. Thus, having few steps
    and/or “places” and “routes” in an interaction aimed at achieving a goal implies
    less challenge/load to the duration and capacity of the working memory. Reduced
    load on the working memory increases the likelihood of performing tasks more accurately
    and efficiently.


