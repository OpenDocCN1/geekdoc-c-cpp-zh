    # Foreword


    Technology designers who shape user experiences seek to smooth the path for novices
    and serve the demanding needs of experts. This was true for fifteenth-century
    book designers, nineteenth-century train designers, and twenty-first-century smartphone
    designers. Their innovative designs emerged from a deep empathy for people, sensitivity
    to diverse social contexts, and imaginative sparks to create new ways of thinking
    about technology.


    When scrolls were reconceived as books, the idea of numbered pages made it possible
    to have tables of contents, indexes, and cross-references. These breakthrough
    inventions depended on an understanding of how books would be used differently
    from scrolls. Similarly, when horse-drawn carriages were reconceived as iron-horse
    trains and then again as horse-less carriages, the changes were more profound
    than giving up on buggy wipers. New user needs and new technologies required a
    reconceptualization of the user experience. The metaphor, terminology, visual
    presentation, color, sounds, texture, and sizes of every component had to be rethought.
    Then the actions presented were refined to accommodate fresh opportunities and
    new human needs.


    Each generation of designers faces fresh opportunities to remake human experiences
    in ways that will be easier, safer, more enjoyable, and even more compelling the
    past. These considerations were strong in my mind as I developed the direct manipulation
    concept, providing a set of principles based on cognitive models. The key principle
    in the conceptual model was the "visual representation of the objects and actions
    of interest." For example, the document and file folders when the objects and
    the trash can a visual representation of the action of deletion. A second direct
    manipulation principle was "rapid, incremental and reversible operations." The
    bold change was to shift from keyboard typing of commands to mouse or touchscreen
    dragging, dropping, clicking, double-clicking, hovering, and other actions formulation
    of the objects and actions of interest.


    This direct manipulation of the desktop concept enabled teaching and redesign
    of many applications. It also triggered the idea of making words selectable as
    highlighted that helped the World Web such a remarkable phenomenon. Direct manipulation
    also led to varied designs including tiny keyboards plus gestures on mobile devices,
    as well as touchscreen home controls, airport kiosks, and museum exhibits. The
    direct manipulation conceptual model also triggered interactive information visualization
    strategies with multiple coordinated windows controlled by dynamic query sliders
    to filter data items from 5–15 windows simultaneously.'
- md: '

    Other conceptual model designers carried old designs into new directions, such
    as transforming paper books into electronic books and automobile dashboard knobs
    into touchscreen widgets. However, the greatest success of user experience designers
    is manifest in the 6 billion users of cell phones. While Moore''s Law and other
    technology advances were important ingredients, I think the designer chefs cooked
    the Web browsers, desktops, and the smartphone apps deserve ample credit for their
    widely admired contributions. Life has been made better, much of the time, because
    of the facility for human communication to bind families, e-commerce to promote
    business, improved healthcare to lengthen and improve quality of life, and much
    more. Of course, cyber-criminals, scammers, spammers, and terrorists have also
    taken advantage of these new technologies, reminding us that ease of use and universal
    access have troubling downsides for which we must remain vigilant.


    The remarkable Renaissance thinker Buckminster Fuller promoted “comprehensive
    anticipatory design science” which encouraged modern designers to think about
    future impacts, consider unexpected side effects, respect the needs of diverse
    stakeholders, and ensure usability. He constantly alerted the awareness of planetary
    impacts and ethics of design. We should continue to read and be inspired by his
    thinking.


    In summary, the progress of technology brings great opportunities and challenges
    for designers. There are thousands of books and Web sites about the diverse aspects
    of design, including design thinking, design methods, design theory, design research,
    and design science. Novice designers can learn much from these diverse sources,
    and now Avi Parush provides a fresh perspective on how designers can develop the
    basic concepts, as well as the attendant information architectures that support
    function, logical configuration, memorable navigation and policy, comprehensible
    forms, and engaging details. Such layered approaches have been a standard feature
    of design guides, by Parush walks novice and expert designers through the steps
    of creating functional chunks, conceptual model elements, physical model elements,
    detailed conceptual elements, and the user interface elements.


    Parush''s characterizations are precise and illustrated with helpful examples.
    His careful choice of wording and clear figures guides readers and clarify the
    concepts. Of course, every traveler and designer will find his or her own path,
    but Parush''s valuable guide will help experience designers to make it even easier
    for novices to learn new systems, while giving experts even more flexibility.


    > —Ben Shneiderman

    University of Maryland,

    February 2015


    # Preface


    # WHAT IS THIS BOOK ABOUT?


    This book is about conceptual models and conceptual design of interactive systems.


    There are so many attractively designed applications. Nevertheless, many leave
    the user frustrated. What do you need to consider before designing the screens
    in order to ensure that the application will provide a positive user experience?
    Conceptual design is a key step in the process of user interface design that answers
    that question. And this book offers an effective methodology to do conceptual
    design.


    Let us examine a practical example to illustrate where you could encounter conceptual
    models in the overall context of designing and developing interactive systems.
    Imagine an application on a mobile device supporting physical workouts. Within
    such an application, designing the feature of reviewing previous workouts. We
    can envision a very straightforward 1-2-3 design process consisting of three major
    steps (Figure 1):


    - 1. Take a few features;

    - 2. Sketch a wireframe, test and revise; and then

    - 3. Finalize the detailed design of the user interface.


    However, how exactly did we get from the list in step 1 to the detailed wireframe
    in step 2? There are unanswered questions such as:


    - How and when we decide which items should be grouped? For example, should the
    "previous workouts" be a group?

    - Did we define other groups of features? For example, should there be a group
    of planned workouts?


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_11_0.png)


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_11_1.png)


    Features


    A detailed wireframe


    Final detailed design


    - 1. List view workouts

    - 2. Show some parameters for each

    - 3. Allow selection of each


