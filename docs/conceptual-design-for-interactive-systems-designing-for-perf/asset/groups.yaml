    # FUNCTIONAL CHUNKS: CONSTRUCT THE ESSENTIAL FOUNDATION


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_109_0.png)


    # LINK FUNCTIONAL CHUNKS


    The next step after defining the functional chunks, be they task- or object-oriented,
    is to outline the links between chunks. The links between functional chunks depend
    on task structure, interaction flow, and affinities with objects. Consider also
    the strength of the links. The links can be stronger if the chunks are used frequently
    or if they are dependent upon each other during the interaction flow. Link simple
    task-oriented chunks that:


    - serve the same goal, in a product with multiple goals;

    - are part of the same task workflow;

    - are sequential in a given task workflow;

    - are performed frequently together.


    FIGURE 14.4: Simple object-oriented functional chunks for the desktop channel
    in the running example.


    # CONCEPTUAL DESIGN: A METHODOLOGY


    For example, there are two setup-oriented simple functional chunks in Figure 14.2:
    (1) device and personal setup and (2) setting up a workout plan. Both can be further
    linked because they serve the same goal of setting up parameters in the system
    before running. In addition, both can be part of the same task flow, typically
    in a first-time use when the user will setup all aspects of the product. Finally,
    both can be sequential if one would first set up the device and then proceed with
    the personal setup.


    While defining those links, you may end redefining some of the functional chunks.
    Specifically, you may consider several interlinked chunks as making up a functional
    chunk. In our running example, the two linked functional chunks device and personal
    setup and setting up workout plans can be redefined as a setup compound chunk,
    as can be seen at the top of Figure 14.5, for the mobile channel. Similarly, setting
    up the personal account and the workout plans can be chunked into a setup compound
    chunk for the desktop channel, as is shown at the bottom of Figure 14.5.


    Figure 14.5: Redefining compound task-oriented functional chunks. The top diagram
    depicts the chunks for the mobile channel, and the bottom diagram is the compound
    functional chunks for the desktop channel.


    We can employ a similar approach to the object-oriented chunks. Link simple object-oriented
    chunks that:


    - represent objects having a common meaning,

    - represent objects that have some affinity between them.


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_110_0.png)


    # FUNCTIONAL CHUNKS: CONSTRUCT THE ESSENTIAL FOUNDATION


    95


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_111_0.png)


    For example, in Figure 14.6, we can see two compound functional chunks for the
    mobile channel in the running example. The top compound functional chunk is “Workout”
    and combines all the workout object-oriented simple chunks first in Figure 14.3.
    These are combined to a single compound functional chunk because all objects have
    common meaning for the user and can fit the mental model. Note in Figure 14.6
    another compound functional chunk combining the personal account and sensor chunks.
    These two object chunks have some affinity between them: Both represent objects
    that are engaged before running. These two object-oriented functional chunks are
    combined into a task-oriented compound functional chunk and are in line with what
    we came up when we examined the definition of task-oriented compound chunks. We
    can employ the same line of reasoning and define object-oriented compound chunk
    for the desktop channel in the running example, as is presented in Figure 14.7.


    FIGURE 14.6:

    Compound object-oriented functional chunks in the running example for the mobile
    channel


    In addition to all of the above criteria, you can link simple task-oriented or
    object-oriented chunks as a function of:


    - usage context (when functional chunks are relevant to or deal with in the same
    usage context and are distinct from other functional chunks dealt with in other
    usage contexts)


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_111_1.png)


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_112_0.png)


    FIGURE 14.7: Compound object-oriented functional chunks in the running example
    for the desktop channel.


    - interaction channel (when functional chunks are typically dealt with in a given
    interaction channel and are distinct from other functional chunks dealt with in
    channels).


    Following the workflow in the running example, we can distinguish between several
    usage contexts or states: initial setup, before running, during running, and after
    running. In the task analysis of the running example (Figure 14.1), the tasks
    associated with reviewing running performance can be performed only after running.
    The running chunks (real-time information during the run itself) could be done
    only on a mobile device such as a smartphone or a running smartwatch. In contrast,
    tasks associated with the personal account or reviewing running performance can
    be done in channels such as a desktop computer Web site or program and an app
    Web site on a mobile device such as a tablet or a smartphone, but cannot be done
    in a very linear fashion on a wristwatch. These considerations should be taken
    into account when defining compound functional chunks as either task-oriented
    or object-oriented.


    # FUNCTIONAL CHUNKS: CONSTRUCT THE ESSENTIAL FOUNDATION


    The decisions on compound functional chunks will later influence the decision
    of how to assign physical places. It is more reasonable to assign a compound functional
    chunk to a single place than to have each of the simple functional chunks in a
    separate place. This in turn will influence navigation and policy, as we will
    see soon.


    # CHECKPOINT: REVISIT AND REVISE


    At this point, based on user research and analysis, you have defined simple and
    compound functional chunks and linked them. As you realize, not all is resolved
    and you may be far from a conclusion. You may not be sure about the definitions
    of the chunks andor the links between them. You have several alternative definitions
    and links. You may not be ready to make a decision.


    The process should be iterative. It would be a good practice to revisit what you
    have done. You may go back all the way to user research and collecting more data.
    You may go back and redo your task analysis or refine personas or scenarios or
    even remove personas and scenarios. You may consider going back to the stakeholders
    you work with validating the chunking strategy with them.


    # The Running Experience Example: Revisiting Functional Chunks and Iterating


    - Collect more data on what runners like to review their performance immediately
    after running or they can wait until they get to a tablet, app, or a desktop computer.

    - Considering a new persona and scenarios for those who run and review performance
    together.

    - Redo task analysis and workflow mapping to consider combining running and review
    into a compound functional chunk.


    # PROJECT MANAGEMENT CONSIDERATIONS


    We now have a definition of functional chunks. Looking at the broader context
    of product development projects, there is a strong tendency to define the minimum
    viable product (MVP), particularly with start-ups using lean and agile approaches.
    Our job is to ensure there are no gaps in features essential to UX. In other matters,
    let us consider the most viable experience (MVX). In this early stage, it is ensuring
    functional chunks are well defined in a way that users can understand; in other
    words, they can match existing mental models or contribute to developing a new
    one.


    ### Functional Chunks—Key Practical Points

    * Use the task analysis, workflow, and object-action analysis to define functional
    chunks that are either task-oriented or object-oriented. Remember, objects can
    be information items as well.

    * Link between functional chunks to define compound chunks.

    * Outcomes: diagrams with the functional chunks.

    * Evaluate with team members and other stakeholders to validate the definitions.

