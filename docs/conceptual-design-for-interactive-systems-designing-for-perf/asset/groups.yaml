    - 当额外的、局部的临时任务补充这些任务的执行，且对主工作流的干扰较小时


    # 轮辐型概念模型的示例


    在例例中，中心是一个承载概念元素的窗口，该元素由与文字处理程序中样式定义相关的参数和动作组成。虽然中心可以包含许多样式定义任务，但还有补充元素用于精调参数设置。每个这些补充元素都放置在一个模态窗口中，允许在继续进入其他地方之前完成参数设置的精调并返回中心（图
    10.6）。


    图 10.6：一个轮辐型概念模型的示例。


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_73_0.png)


    *注*


    # 矩阵


    配置：矩阵概念模型有两个关键特征：


    +   1. 有多个并行的起点（与具有单一起点的顺序化和结构化模型相比）。

    2. 有至少两组此类相关或独立的起点。这就是它被命名为矩阵的原因。


    将此模型可视化为具有两个维度表达了具有并行交互流的策略。在具有两个独立维度的矩阵配置中，一个维度中的元素与另一个维度的元素之间不存在功能或交互流依赖关系。在具有两个相关维度的矩阵配置中，与一个维度中给定元素的交互将决定另一个维度中可用元素。


    图 10.7 中的两种可视化形式反映了该模型的两种常用方法：


    +   A. 每个维度中的每个并行起点都指向一组链接的概念元素。

    B. 每个维度中的每个并行起点都指向一个单一概念元素，大多数交互在该处发生。


    概念导航原则：有多个入口和出口，且它们之间没有顺序依赖关系；用户可以从任何一点开始。一旦用户从给定的起点进入交互流，相关的某个分块或多个分块可能会出现在同一个位置（图
    10.7 中的 B），该位置


    图 10.7：

    两个矩阵概念模型的示例：A. 并行的、相关或不相关的起点链接到序列或一组额外元素；B. 并行的、相关或不相关的起点链接到中心元素。


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_74_0.png)


    可能包含多个概念元素。或者，在起点处进入交互流可能会调用分配到几个物理位置的多个概念元素（图 10.7 中的 A）。这些之间的导航可以是单一序列，也可以是轮辐型，或者如下面将讨论的那样，甚至是网络类型的导航。


    交互策略：矩阵模型允许同时与多个概念元素进行交互。


    对性能的影响：**


    +   * 位置感知—中等

    * 视觉搜索有效性—高到中等

    * 操作（执行动作）负载—低到中等

    * 工作内存负载—中等


    **对可用性的影响：**


    +   * 易学性—中等

    * 有效性—中等

    * 效率—高

    * 满意度—可能为中等


    适用场景：


    +   * 当存在清晰的起点集合并可以将其组织为不同的维度时。

    * 当起点集合之间的依赖关系具有相关性时。

    * 当整体任务结构使得没有单一的开始或结束时。

    * 当用户需要灵活性和控制权根据目标启动不同的任务和工作流时。

    * 存在并行的工作流，它们之间没有特定的顺序、重要性或优先级。


    # 矩阵概念模型的示例


    矩阵概念模型的示例是一个网站。该网站提供了多个起点，实现为页面顶部的一行标签，用户可以随时候选择这些标签中的任何一个。一旦用户在矩阵的水平维度上做出选择，就会有额外的起点可用。这两个维度是相互依赖的。一旦用户在垂直集合中做出选择，相关的元素将在页面中心变得可用（类似于
    10.7）。


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_76_0.png)


    矩阵概念的实现并不要求在视觉外观上进行字面翻译；也就是说，两个维度不必非表现为正交集合。它们可以代表依赖和独立的集合（图 10.8）。


    # 网络


    概念配置：该模型由多个入口点、相互链接的概念元素以及物理位置组成。该配置为用户提供了从哪里开始交互以及如何导航的许多自由度。几乎根据定义，许多网站都有网络概念建模（图
    10.9）。


    概念导航原则：用户可以从多个点启动交互流。由于概念元素之间存在多个链接，用户可以通过多种路线导航到某些目的地。此外，用户可以在给定的路线上开始并偏离到不同的路线，而不必完成初始路线。用户也可以在各种点退出。


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_77_0.png)


    图 10.9：

    网络概念模型的两个示意图。


