    ## 语境中的概念设计：战略性思考


    *实施*（Implementation）：一旦设计达到可以实施的程度，就会对产品进行实际开发和构建（例如在计算机程序中编写代码）。在某些方法（例如敏捷开发）中，设计、测试和实施往往是重叠的。


    *测试*（Testing）：以用户为导向的方法倡在整个过程中进行早期和形成性的评估与测试。在某些情况下，在产品发布给最终用户之前会进行总结性评估和测试。在某些方法中，测试是更小、更短周期的一部分，包括设计、实施和测试。


    *部署*（Deployment）：无论采用何种开发方法，最后阶段都是将产品发布给最终用户，并提供初始或持续的用户支持。


    根据系统开发方法和方法论的不同，这些活动可能会不同的顺序进行。例如，对于要发布的产品部分，可以在过程的早期进行某些总结性测试；产品在发布前可能是不完整的（例如在敏捷和精益方法中，系统的部分可以先设计、实施并部署），或者具有高度迭代性（例如，可以在测试后或从部署中吸取教训后进行研究和重新设计）。无论采用什么具体方法，大多数方法都包含了上述的所有核心活动和流程。


    在整体以人为本的设计以及无论采取何种特定的设计开发方法中，战略和业务考虑都是交织的。此外，在概念设计的整体语境下，考虑项目管理的特定特性也非常。以下两个部分涉及这些问题。


    ## 项目管理


    各种业务考量和所有利益相关者都会影响将设计开发工作作为一个有效的项目进行管理。作为设计师，你应该关注 (1) 在开发方法中进行用户研究的能力，(2) 保持项目的设计优先级，(3)
    考虑可能对交互和 UX 设计产生影响的所有利益相关者。


    ## 设计与开发方法：用户研究的位置


    用户和研究是任何产品概念设计的前提。在以用户为中心或以人为本设计的经典和更传统的方法中，进行用户研究是一个显而易见的步骤。一些最新的方法（如敏捷和精益方法）由于其承诺尽早为最终客户/用户提供成果，对充分的用户研究构成了更大的挑战。因此，在前期用户研究上花费时间可能被某些人视为浪费时间，而不是关键的投资。此外，与概念模型基础前期开发相关的工作也被视为本应投入到实际开发中的时间。其他发表的作品对于敏捷和精益开发过程中设计良好的
    UX 和可用性的位置和作用提供了一些很好的观点和视角（Gotthelf & Seiden, 2013; Ratcliffe & McNeil, 2012）。此处概述的方法论假设在开始任何设计和开发活动之前，已经进行了一些用户和使用研究。


    ## 多通道和跨渠道的设计与开发策略


    系统的设计和开发使其能够在多种设备、多种语文中运行。此外，用户可以在一个设备上开始任务，并在另一个设备上继续/完成任务。这被称为多通道或跨渠道交互与体验，其中通道被定义为用户与应用程序/产品/系统的主题或内容领域交互的场所。在计算机交互系统领域，通道通常是指设备，如台式电脑、移动设备、信息亭或自助机、交互式语音响应系统，或任何嵌入式交互设备（例如，车载内置导航系统）。


    项目内部针对各种通道（相关时）设计用户界面、交互和 UX 的优先级是根据业务考量而设定的。由于用户需求、新技术或其他业务目标而更新现有产品，可以在添加新通道时实现。在这种情况下，该通道的设计和开发将获得最高优先级。在旨在多个通道上实现的新产品语境下，由于用户需求或其他业务目标和考虑（例如竞争、市场需求和新合作伙伴），某一通道的优先级高于其他通道。


    ## 团队方法


    无论采用什么设计开发方法，多学科团队方法对于确保在整个生命周期中包含可用性和 UX 考虑至关重要。此外，可用性和 UX 设计专业人员有效执行任务也至关重要。可用性和
    UX 设计专家必须与用户或用户代表合作。此外，还要与业务、营销、销售、工程、软件开发人员、平面和工业设计师以及技术作家等其他职业人员合作。最后，可能间接地，与业务伙伴、投资者和其他提供者合作，以考虑他们的目标和关注。


    ## 概念设计：方法论概述


    ## 回顾框架


    概念模型在书的第一部分以分层框架的形式呈现。这些层构成了最终和详细的用户界面的基础。构建概念模型是概念设计的过程，也是本书第二部分介绍的方法论的核心。


    以框架为概念设计过程的基础，从上到下管理它有三个主要阶段（图 12）：


    - *概念设计*——该阶段是方法论的核心，跨了框架的三层：功能层、配置层以及导航和策略层。

    - *从概念设计到详细设计的过渡*——在这个阶段，我们通过添加细节将概念模型的抽象方面转变为更具体。

    - *详细设计*——这通常是设计用户界面的最后阶段，但本书将不会涵盖此，因为它侧重于整个过程的概念部分。虽然这代表了概念设计之外的活动，但它位于框架之内，因为概念模型是最终详细设计的基础。此外，详细设计是设计交互系统整体语境的重要组成部分。


    该方法论将引导你按照框架的分层从下到上进行一系列设计活动。我们必须处理用户研究。在没有进行研究的情况下，我们不能也不应该开始设计过程。基于此，我们在第 13
    章开始回顾一些与概念设计相关的用户研究技术和数据。第 14 章告诉我们如何确定功能块及其相互关系。第 15 章的下一步是将功能块转换为概念元素并建立它们之间的联系，以创建模型的基础——元素的配置。在第
