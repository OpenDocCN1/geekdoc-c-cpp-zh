    Now that we have four simple applications as examples, let us think about them.
    We know that the four applications support users in achieving the same goals:
    set an appointment, set a recurring appointment, and set a reminder for the appointment.
    They look and behave differently. Why? There is an obvious answer: each application
    runs in a different interaction channel. The design of each application complies
    with the native look and feel of the respective channel.


    However, is that all that is different between them? Moreover, does it matter?
    Here is the thesis of this book: there are differences that are more fundamental,
    and yes, they do matter. To elaborate, we shall discuss the conceptual model and
    show the fundamental differences and their impact. However, before we do that,
    let us consider one more aspect.


    You probably noted that the description of the interaction flow in each of the
    applications treated each action as if the user "goes" to another "place." Think
    of "going places" metaphorically. The following sections of this primer discuss
    the relation between "places" and elements of the conceptual model and their relation
    to "physical places" such as windows, dialog boxes, and Web pages. We call this
    the spatial metaphor. Next, we discuss the significance of spatial metaphor and
    the importance of abstraction when dealing with the conceptual model.


    # Places, Routes, and Abstraction


    A very common term when designing a website is information architecture. The use
    of the term "architecture" implies talking about the basic function, configuration,
    and layout. Look just at any architectural plan, such as the one in Figure 2.1.
    The plan is rather minimal with respect to providing any details. All it provides
    is the general layout of spaces serving a given function (e.g., kitchen and bedroom),
    the location of each place in the overall configuration relative to other places.
    In addition, depicting doors and passages it gives us clear information regarding
    the routes one should navigate from one place to another. Yet, as minimal as it
    is, the drawing is highly useful in assessing the architectural plan before proceeding
    to implement it: Are all desired functions provided for (e.g., there is a place
    for the den)? Is there enough space allocated for each function (e.g., dining
    and living room should be the largest place?) Is access to rooms appropriate?
    Do the routes and distances support easy navigation from one place to another?
    In other words, a typical architectural plan provides us with the global features
    before introducing the details.


    The representation of the conceptual models is similar to the architectural plan.
    It helps to ensure that there is a "place" for each function and the routes for
    navigating from one place to another support the interaction workflow adequately.
    How can we best represent such global features before getting into the details?
    To analyze and discuss conceptual models, we use the visual language of boxes
    and arrows. In other words, we are talking about conceptual models in abstract
    terms that are free of any details. Why is it important to remain at the abstract
    level when designing and discussing the conceptual model before getting into the
    details?


    The abstract representation of the conceptual models supports well one of the
    fundamental characteristics of human perception and understanding. A classic research
    on human perception and attention (Navon, 1977) suggests that the global structure
    of a visual scene tends to precede perception of any local features, rather than
    perceiving all features at once. The original study used stimuli to those in Figure
    2.2. The findings of the study suggest that people respond to perceiving the letter
    "H" in both the left and the right elements in Figure 2.2, compared to identifying
    from which characters the large "H" is composed of "H" in the left-hand stimulus
    and "S" in the right-hand stimulus. The large letter "H" is considered as a global
    feature of the


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_26_0.png)


    FIGURE 2.1: A simple architectural plan.


    FIGURE 2.2: Stimuli used in Navon (1977) global precedence.


    # A Layered Framework for the Conceptual Model


    We are going to use a layered framework to define and analyze the conceptual model.
    Why layered? Think of the onion metaphor. The idea behind this popular metaphor
    is that we peel off one layer after another to reach the core and discover the
    real taste of the onion. When it comes to user interfaces of interactive systems,
    we can take what we see in the UI as the outer layer and imagine there are inner
    layers that we need to peel off.


    In the first part of the book where we introduce and analyze conceptual models,
    we peel off layers to cover the core, the underlying conceptual model. In the
    second part of the book where we methodically construct a conceptual model, we
    go the other way: we add one layer on top of another, from the abstract to the
    most concrete. Figure 3.1 shows the layered framework representing the entire
    context in which the conceptual model resides.


    The framework, from the bottom up, consists of five layers:


    - 1. The *function* level consists of functional chunks—*groups of tasks and objects*
    and their *associated parameters* that the user uses to accomplish goals.

    - 2. The *configuration* level consists of the conceptual model elements—the metaphorical
    “places” that the user must visit to perform each set of functions and the links
    between “places.”

    - 3. The *navigation and policy* level depicts the navigation and navigation rules—the
    “routes” the user takes between “places,” the physical elements containing one
    or more conceptual “places,” and the policy governing the interrelations among
    the physical elements.

    - 4. The *form* level consists of *detailed conceptual elements* serving as the
    transition from conceptual design.

    - 5. The *details* level consists of user interface elements—*detailed look and
    feel* of each UI element at each place the user visits to perform tasks.


    The conceptual design deals with *what* the user does and *where*, but without
    the details. In terms of this framework, conceptual design spans the function,
    configuration, and navigation and policy levels. The transition to the detailed
    design takes place on the form level, introducing details and finally transforming
    the conceptual design into a full and detailed user interface.

