    # Navigation Policy—Key Practical Points


    - Based on human performance goals, user research, and the interaction channel
    considerations, assign each conceptual element to a physical place.

    - Define the navigation policy, which should include rules regarding locality
    of elements and how it influences navigation.

    - Start prototyping the model with your favorite prototyping tool.

    - Pause and revisit the model with focus on navigation and policy.

    - Define how the user will interact physically with the model based on the operational
    principles of the interaction channel.

