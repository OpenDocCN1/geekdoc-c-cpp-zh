    # 本书是如何组织的？


    本书分为两个部分。第一部分较偏理论性，侧重于概念模型的概念及其对人类性能、易用性和体验的影响。你可以将这一部分视为一个入门指南，介绍并讨论了我们所谓的“概念模型”这一概念。第二部分是实操部分，侧重于概念设计过程以及我们开发概念模型的方法论。第二部分将带你了解开发概念模型的各个步骤，你可以将其作为一份“如何做”指南。


    # 致谢


    撰写这本书对我来说是一项巨大的工程。但正因为在通往这里的漫长旅程中，有许多人给予我支持和启发，这一切才成为可能。


    首先，要感谢我的妻子、最好的朋友兼合伙人 Debi**。多年来，我们一直在人机交互领域共同工作，你真正理解这本书的核心内容。我们有很多机会共同开发并细化了我对概念设计的观点，以及帮助开发概念模型的方法论。Debi，是你让我写这本书的梦想变成了现实。


    我的哥哥 **Zeev Parush**，他也是用户界面设计和用户体验领域的资深专业人士。我们讨论并辩论过通用设计、概念设计中的许多挑战以及参与其中的设计的意义。Zeev，你对手稿早期版本的宝贵意见帮助我重新思考并改写了书的部分内容。


    **Ben Schneiderman 教授**多年来一直是我的灵感来源。从你开创性的思想、概念，以及我们对人机交互研究的讨论中，我学到了很多。你在职业和学术生涯各个阶段的支持，以及对这本书的支持和鼓励对我产生了深远的影响。


    **Tom Hewett 教授**，我曾就人机交互、研究、认知心理学、伦理以及优秀单麦威士忌与平庸品种之间的等等问题进行过许多富有启发性且深刻的讨论。


    我在人机交互领域从业期间合作过的**客户们**。所有的项目都为我完善通用用户界面设计模型、特别是概念模型提供了宝贵机会。


