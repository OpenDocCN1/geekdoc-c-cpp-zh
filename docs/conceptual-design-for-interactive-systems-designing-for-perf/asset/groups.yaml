    ## 单序列

    配置：多个概念元素按线性顺序配置，每个元素都与序列中指向它的前一个元素以及序列中的下一个概念模型相连（图 10.1）。


    概念导航图：单序列结构具有单一入口点和一个出口/终点。导航仅可以在序列中每对链接的模型元素之间向前或向后进行。

    导航策略：在任何给定的时间内，仅有一个概念模型元素可供交互。

    异常和变体：序列中的所有或部分概念模型元素都有出口，因此不会强制用户通过序列中的所有概念模型元素才能退出交互。


    对性能的影响：


    - 位置感知度——高

    - 视觉搜索有效性——高

