    or mental models, to represent what they know. The mental structures typically
    consist of elements and the links between them. The elements could be words, concepts,
    images, names, places, episodes, experiences, and actions. A person’s knowledge
    on a topic comprises elements and their links. Some links are strong; others are
    weak. When


    - Use five human performance factors to assess implications of conceptual models:

    - Mental models and understanding

    - Location awareness

    - Visual search effectiveness

    - Operational (executing actions)

    - Working memory load


    ## On Mental Models


    Norman refers to one’s understanding when interacting with an artifact as "having
    a conceptual model of the device you interact with" (Norman, 1983, 1988, 1999,
    2004). The internal, psychological representation of this model is often referred
    to as the user’s mental or a model. To quote Norman’s definition: "Mental models
    are the models people have of themselves, the environment, and the things with
    which they interact. People form mental models through experience, training, and
    instruction. The mental model of a device is formed largely by interpreting its
    actions and its structure" (Norman, 1988, p. 17). Hollnagem (2008) argued that
    the mental model of the operator’s knowledge he has about or for his environment
    is crucial for how the operator interprets, plans, and acts. Similarly to Norman,
    Hollnagem claimed that the operator’s world is shaped by how the world is perceived.
    Young (1981) also suggested that users create representations of the systems they
    use with and that helps them plan their actions and understand the system’s behavior.
    According to Gray (1987), users develop small working models of components of
    the system they interact with in order to reduce the workload that may be associated
    in that interaction. Together, these approaches define mental models focus on
    the representation of the device or system that the user interacts with and its
    environment.


    Interacting with an artifact, the user either starts with a preexisting mental
    structure about that artifact or constructs a new one based on the interaction
    and experience with the artifact. When one’s preexisting mental structure matches
    the structure of the artifact one interacts with, it is easier to understand.
    Alternatively, if a user does not have a preexisting mental model, the artifact
    should convey a structure that will facilitate understanding and the construction
    of a corresponding mental structure. The configuration underlying the user interface
    is composed of functional chunks, “places,” and “routes.” It conveys that users
    can utilize their mental representation and understand better the product they
    interact with. The methodology of the book will address the challenge of matching
    the conceptual model to users’ mental models.


    ## If you know where you are, you can get to your destination!


    The first thing we like when interacting with a system is oriented, is, we want
    to get to a destination, the “place” that contains the desired parameters and
    actions. As was emphasized earlier, “places” can be conceptual or physical. Different
    screens and windows in the interaction flow include finding parameters and actions,
    setting them, and executing them. For one to take the correct “route,” to get
    the correct “place,” and not get lost, one needs location awareness. Location
    awareness is about knowing which “place” one visited, the “place” is one at, and
    “places” are yet to be visited. Having good location awareness increases the likelihood
    of getting to the correct “place” factor.


    ## On Location Awareness


    Location awareness is our ability to recognize where we are relative to what is
    around us, relative to what we know where we are, and to other places that could
    be destinations.


    There are various factors that influence location awareness, which are among the
    number of locations visited, the “landmarks” and “you are here” aids to orientation,
    and the length and complexity of routes among the “places,” and frequently fewer
    “routes” would be typically associated with location awareness,


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_60_0.png)


    Compared with many “places” and “routes.” Location awareness may be more effective
    when navigating between conceptual places located in different physical places.


    ## If you can find what you look for, you can accomplish your goal!


    Typically, we start with a given goal, we search for what will help us go to other
    places. Probably, one of the common ways we behave when reaching a “place” is
    to perform visual search. Having an effective and efficient visual search means
    finding the correct “target” faster.


    Visual search is influenced by the amount of items in the scene and their specific
    visual attributes as size, color, and similarity to other items. The amount of
    items in any physical place gives upon the determination of functional chunks
    and conceptual elements and their assignment to physical places. Having more conceptual
    elements in the same place may support location awareness, as discussed above;
    however, it may also be a challenge for effective visual search. Conversely, having
    less conceptual elements in a physical place may facilitate effective visual search;
    however, it may also degrade location awareness.


    It is important to note that in a physical place with many conceptual elements,
    it is possible to facilitate visual search by proper visual layout and organization
    even with a large number of elements. The implications discussed here directly
    related to the more number of “places” and if it results in a higher or lower
    number of elements in each physical place.


    ## On Visual Search


    Visual search is a perceptual process whereby we scan the scene and search for
    a given target. During such process, any other non-target element in the scene
    is a disaster.


    ## On Operational Load


    Operational load is the mental or physical effort we invest when performing actions
    as part of our interaction with a product.


