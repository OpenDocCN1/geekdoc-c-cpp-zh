    # CONCEPTUAL DESIGN: A METHODOLOGY


    objects whose status should be visible to the user when interacting with other
    objects or performing another task. Tasks or objects requiring a similar level
    of visibility or tasks or object requiring visibility while engaged with other
    tasks or objects can be considered for the same physical place or in close proximity.


    Intuitiveness and findability—An outcome of all analyses is the grouping of elements
    in a way that can facilitate intuitive understanding of the affinities among them
    and subsequently with the ease to find what the user looks for. To increase intuitiveness
    and findability, tasks and objects with high affinity can be considered for the
    same physical place or in close proximity.


    These analyses and their implications imply assignment of conceptual elements
    are summarized in the following table (Table 17.2).


    # TABLE 17.2:

    Implications of several user research analyses on the physical assignment decisions


    | Analysis | Conceptual | Implications | Physical assignment |

    |---|---|---|---|n| Task analysis | Task-oriented affinities | Similar frequency,
    likely sequence, likely concurrency | All elements in one or few screens or windows
    |

    | Object analysis | Object-oriented affinities | Likely concurrency, findability
    | Separate physical place for each chunk in one window or place (e.g., use a matrix
    model or use tabs within the same window) |

    | Desired interaction flow | Work flow | Sequence, dependency | |


    # Context of usage, states, and modes


    The context within which the user interacts with the system/product has an influence
    on the interaction. There are various levels to the context of:


    +   1. The physical context such as indoors vs, outdoors, stationary vs. mobile,
    day vs. night, or adequate vs. poor lighting conditions, quiet vs noisy place,
    temperature and climate, and presence or absence of movements and vibrations.

    2. The work flow context as being in any given phase, step, state, or a mode.
    A common example is the distinction between an initial installation, or configuration
    state, and the subsequent actual usage.

    3. The personal context, which consists of the user is, as a novice vs. experienced,
    wakeful vs. fatigued, highly motivated vs. burnt-out, and other states.

    4. The social context, which refers to whether the user is alone or engages with
    the product with others. The presence of others could be group or teamwork, collaborative
    and sharing interaction, located or remote, and on a broader social context such
    as national, cultural, ethnic, or international associations and societies.


    The analyst and designer should consider the combined implications of the various
    contextual factors on the assignment of conceptual elements to physical places.
    Having conceptual elements in the same physical place or in close proximity can'
