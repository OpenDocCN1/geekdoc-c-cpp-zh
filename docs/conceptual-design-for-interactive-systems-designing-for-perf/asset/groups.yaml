    # FORM: TRANSITION TO DETAILED DESIGN


    # 131


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_147_0.png)


    FIGURE 18.1:

    A visual metaphor of a book combined with an operational principle of touch-based
    swiping in e-readers.


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_147_1.png)


    FIGURE 18.2:

    Tabs, as physical places for conceptual elements, have a distinct visual metaphor.


    Conceptual elements imply some sort of visual appearance. Tabs are a metaphor
    to the tabs on files we are familiar with from the real world (Figure 18.2). Does
    using tabs imply we are going with a desktop-type metaphor? Not, because it is
    common to use tabs as places for mutually exclusive conceptual elements, and they
    have different appearances depending on the interaction channel and its native
    style. However, we ought to be aware that a metaphor can be "broken". Back to
    the book metaphor discussed above, the right-hand picture in Figure 18.1 shows
    the use of the book metaphor overlaid with a toolbar with various functions, which
    breaks the metaphor and takes the user back to the standard look of applications.


    Steps to choosing metaphor:

    1. Determine if it is relevant to have a metaphor. Base yourself on outcomes of
    the user research.

    2. Get familiar with metaphors commonly used in their lives, work, society, and
    culture.

    3. Utilize user research to consider mental models.

    4. Determine how far you can go with metaphor (see above the book metaphor as
    an example for breakdown of the metaphor).

    5. Consider native and conventional metaphors (e.g., file).

    6. Consider the product.


    # ADD DETAILS


    So far, the conceptual model is at a relatively high abstraction level. Choosing
    metaphor can help the transition to adding more details to the conceptual model.
    Even when assigning conceptual elements to physical places, the representation
    was in terms of placeholders. Once we have evaluated and validated the model,
    it is time to start adding the details. Specifically, we add the details from
    functional chunks. The details of each functional chunk are derived from the user
    research and the analyses that were performed. The details can include the following:


    - Actions—Distinguish between navigation actions performed on functional objects.
    Navigation actions are those that enable going through the conceptual model, for
    example, opening or closing a window, clicking on a tab to move to another conceptual
    element, and opening a file. The actions on functional objects can be derived
    primarily from action analysis. Actions on functional objects include the creation,
    modification, or deletion of objects (e.g., creating a new workout in the running
    example).

    - Parameters—Typically, each functional object is associated with parameters that
    help the user define it. In the running example, the planned distance in kilometers
    is one of the parameters that help the user define the workout. Note that since
    this step is the transition to the detailed design, not the finalization of the
    detailed design, there is no need to determine the final user element that will
    let the user define the parameter. For example, the planned distance in kilometers
    can be set in a simple text field, or a text with a spinner control, or selected
    from a preset list of dancers.

    - Information—Any information, static or dynamic, that is not user-defined. The
    information can include any information received from external sources and not
    entered or set by the user, marketing information, explanations and descriptions,
    titles and captions, parameter labels, and user guidance (Figure 18.3).


    # DEVELOP A FULL STORYBOARD


    Having added details to the design, and having prototyped it, we can now put everything
    together into a storyboard. Storyboarding originated in the visual arts, primarily
    cinema and video, and later digital media. The fundamental idea is to present
    in a visual graphic fashion to illustrate the sequence of episodes in the story.
    Storyboarding was adapted in the area of requirements gathering (Andriole, 1992),
    scenario-based design (Carroll, 2000), and user interface design (Landay & Myers,
    2001).


    The idea of the storyboard as part of the conceptual design process is to represent
    the full conceptual model in terms of key interaction flows, according to the
    scenarios and analyses we use from the research. The detailed storyboard is a
    powerful tool for communicating and testing the conceptual model. We can present
    it in the form of user scenario (see Figure 18.4).


    Another way to present the storyboard is to create a navigation map with the prototyped
    and detailed conceptual elements in contrast to the navigation map we used so
    far (Figure 18.5).


    The first time Jake used the application, he started with the Setup screen. He
    first set it up and then went on to configure the HR monitor to watch the application.
    As part of his planning he went on to define several planned workouts.


    From the Setup screen he navigated to the Planned Workouts screen. He set up a
    sequence of distances planning to run at different times.


    When he ran, he would glance at the screen of his phone, and count the sequence
    of episodes in his story mapping his running performance to a map showing where
    he was.


    Once he completed his run, the application switched to a screen summary where
    he could view parameters of his performance. He could also access summaries of
    previous runs.


    FIGURE 18.4:

    A partial storyboard for the running example with the mobile channel presented
    as a story.


