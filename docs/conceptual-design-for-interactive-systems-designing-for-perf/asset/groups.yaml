    使用这本书需要任何预先知识吗？是的，有一些。这本书关注的是用户界面过程的一个部分：概念设计。这就是为什么你应该了解以下内容：


    - 用户界面、可用性和用户体验设计的基础

    - 以用户为中心或面向人类的设计流程

    - 用户研究


    通过学习和使用这本书，你将实现两个目标：


    - 1. 理解功能分块、配置、导航与策略的概念模型，以及通过如何定义概念模型来影响人类性能、可用性和用户体验。

    - 2. 实现一种可靠的概念设计方法论来开发概念模型。

