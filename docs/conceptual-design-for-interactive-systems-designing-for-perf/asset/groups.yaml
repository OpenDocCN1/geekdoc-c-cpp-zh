    ## 详细层 (The Detailed Layers)


    到目前为止的分析处理的是较高抽象级别的概念模型。也就是说，模型中的元素不包含任何细节。现在，我们到达了可以看到概念中更多细节的层级。这是一个过渡层，一方面，决策会影响概念模型并导致性能和可用性；另一方面，它为设计引入了细节。


    ## 表单：详细概念元素 (FORM: DETAILED CONCEPTUAL ELEMENTS)


    在表单层中，考虑到物理分配以及导航地图和策略，概念元素在每个数据块（信息、参数和动作）都有了一些细节。详细的概念设计涉及关于控件的初步决策以及初步的视觉设计考量（针对视觉用户界面）。


    从概念元素到详细概念元素的过渡阶段可能存在*多个粒度级别*。这些取决于功能性数据块的定义。


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_53_0.png)


    ### 图 7.1：

    表单层中概念模型的两个粒度级别。


    左侧元素显示了给定概念模型的粒度级别。右侧元素显示了带有“干扰”的设计。注意，这种粒度级别仍然缺乏细节，而右侧元素包含了用户交互的参数和控件。


    关于控件的决策通常是一个两步过程。一步是微调关于物理位置的决策。例如，设计师可以将多个概念元素分配到同一个物理位置（如窗口或网页）。决策跨越了从概念设计到详细设计的过渡，因为一方面，它们反映了功能数据块及其相互关系并可以影响概念模型；另一方面，它们涉及关于特定控件的决策。此类决策可能包括：设置数值参数是通过在文本框中输入数字，还是从预定义列表中选择，或者通过选择器类型的控件完成（参见
    7.1 右侧草图中的示例）。


    最后，确定初始视觉设计也是从概念设计到详细设计过渡的一部分。总体，视觉布局反映了功能数据块及其相互关系，并可以影响概念模型及其影响（例如对视觉搜索的影响）。


    ## 细节：用户界面元素 (DETAILS: USER INTERFACE ELEMENTS)


    随着设计过程展开，我们到达概念和详细设计框架中的顶层：细节层。我们为组成用户界面元素添加更多细节。这些细节包含了关于控件的最终决策、视觉布局、图形设计（例如颜色、字体和图标）、术语，以及关于导航策略和操作原理的任何问题。


    ![](0d8a14fde3082fc884c0d2b2be68fd9_55_0.png)


    本书主要讨论与概念模型和概念设计直接相关的层级和阶段。它不涉及详细设计方面。


