    # 价值观


    - 效率

    - 努力工作

    - 美学


    # 痛点


    - 设备设置

    - 步骤过多

    - 跑步时的信息


    图 13.1

    “贯穿”示例中的人物模型示例。


    # 人物模型和场景的影响


    让我们考虑人物模型和场景对概念模型的影响。人物模型揭示了一个职业非常忙碌的人，但热爱跑步并有强烈的动力保持和改善体能。该人物似乎通技术，并在寻找与其跑步相关的先进设备和应用程序。因此，如果应用程序符合他的需求和习惯，他很可能会使用。


