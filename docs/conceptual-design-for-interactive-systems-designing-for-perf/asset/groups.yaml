    # 这本书适合你吗？


    这本书适合你，如果：


    - 你设计用户界面。

    - 你正在寻找提高可用性的方法。

    - 你正在寻找支持从需求到设计跳跃的系统化基础。


    如果你设计用户界面并正在寻找提高设计可用性的方法，那么这本书适合你。如果你仍然觉得从功能需求到屏幕设计的跳跃是一种魔法般的神秘体验，并且想引入一种系统的、经过证明的方法，那么这本书适合你。如果你评审他人设计的用户界面并寻找分享反馈的词汇，那么这本书适合你。它适用于
