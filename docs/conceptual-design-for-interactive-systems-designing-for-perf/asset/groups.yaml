    # 前言


    # 这本书是关于什么的？


    这本书是关于交互式系统的概念模型和概念设计的。


    有许多设计精美的应用程序。然而，许多应用让用户感到沮丧。在设计屏幕之前，你需要考虑什么以确保应用程序能够提供正向的用户体验？概念设计是用户界面设计过程中的关键步骤，它回答了那个问题。而这本书提供了一种进行概念设计的有效方法论。


    让我们来看一个实际示例，说明在设计和开发交互式系统的整体背景下，你可能在何时遇到概念模型。想象一个支持身体锻炼的移动设备应用程序。在这样的应用程序中，设计查看之前锻炼的功能。我们可以设想一个非常直接的
    1-2-3 设计过程，由三个主要步骤组成（图1）：


    - 1. 选取几个功能；

    - 2. 绘制线框图，进行测试和修改；然后

    - 3. 完成用户界面的详细设计。


    然而，我们究竟是如何从步骤 1 中的列表得到步骤 2 中的详细线框图的呢？这存在着一些尚未解决的问题，例如：


    - 我们如何以及何时决定哪些项目应该被分组？例如，“之前的锻炼”应该是一个组吗？

    - 我们是否定义了其他功能组？例如，应该有一个计划中的锻炼功能组吗？


