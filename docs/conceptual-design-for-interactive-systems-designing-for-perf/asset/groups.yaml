    # 人类性能目标


    序言部分概述并讨论了以下人类性能标准，可以将其视为性能目标：


    - 心理模型与理解

    - 位置感知

    - 视觉搜索有效性

    - 操作（执行动作）负担

    - 工作记忆负担


    我们可以将这些性能目标作为物理分配的首要决策标准（表 17.1）。

    一像人类行为一样，我们可能在目标之间进行权衡。最常见的一种权衡是增加视觉有效性与减少操作负担之间的平衡。根据用户研究分析、使用场景和交互通道的额外影响，来解决性能目标之间的权衡。


