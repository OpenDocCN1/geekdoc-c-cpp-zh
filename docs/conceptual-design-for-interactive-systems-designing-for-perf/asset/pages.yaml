    to the tabs on files we are familiar with from the real world (Figure 18.2). Does
    using tabs imply we are going with a desktop-type metaphor? Not, because it is
    common to use tabs as places for mutually exclusive conceptual elements, and they
    have different appearances depending on the interaction channel and its native
    style. However, we ought to be aware that a metaphor can be "broken". Back to
    the book metaphor discussed above, the right-hand picture in Figure 18.1 shows
    the use of the book metaphor overlaid with a toolbar with various functions, which
    breaks the metaphor and takes the user back to the standard look of computer applications.'
