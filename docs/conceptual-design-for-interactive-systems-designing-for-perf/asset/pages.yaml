    for coherent models.


    In order to assess the configuration and transform it into a meaningful one, ask
    yourself if there is a conceptual element or several tightly linked elements that
    can be considered as pivotal. As examples, pivotal concepts in the context of
    human experience with interactive systems are writing a document in a word processing
    program, preparing a slide in a show, sketching on a canvas in a drawing program,
    setting an appointment in a calendar application, writing and sending a tweet,
    or monitoring an automatic process.


    Pivotal elements would be those meeting one or several of the following criteria:


    +   * used frequently,

    * critical and essential,

    * the most common steady state, and

    * best represent the business objective and/or the brand.'
