  md: '# DEFINE AND CONFIGURE CONCEPTUAL MODEL ELEMENTS


    Once you defined the functional chunks, be they simple or compound, you can now
    transform them into conceptual model elements. As was explained in the primer,
    a more abstract representation of the functional chunks supports the understanding,
    further development, and assessment of the conceptual model. There are two steps
    in configuring the conceptual model:


    +   1. Represent each functional chunk as a conceptual model element. At this
    point, we may have simple task-oriented or object-oriented functional chunks.
    In addition, we have the desired interaction flow. Regardless of their type and
    simplicity, we should abstract the chunks that fit best the interaction flow.
    Thus, we may end up with conceptual model elements representing some of the task-oriented
    and/or some of the object-oriented. See the conceptual elements of the running
    example in Figure 15.1. Note that some of the represent objects as workflows,
    and some tasks as review and share.


    +   2. Define compound conceptual elements, when relevant, on links between the
    elements, which in turn are based on the links between the functional chunks.
    Note that at this point, the links do not convey all the details of the full navigation
    map. See Figure 15.2 with the mobile and the desktop interaction channels.


    The resulting configuration is the foundation for the conceptual model.


