  md: '# # A Multiple and Cross Channel Example: Setting an Appointment


    In order to illustrate the fundamental components of the conceptual model, we
    introduce and analyze four existing calendar applications. Each of the four applications
    setting an appointment and each is on a different interaction channel. Such a
    comparative illustration can demonstrate how you can achieve the same goal using
    different conceptual models.


    The first step in the interaction flow is common to all applications: In order
    to set an appointment, the user can select a starting date and time by pointing
    at on the calendar or by activating an option for setting a new appointment. The
    illustration of the conceptual model starts after this initial step by looking
    for what comes next. For the four applications, we will use the following tasks:


    +   1. Defining the basic details of the appointment: topic, place, date, and
    time.

    2. Setting a reminder for the appointment.

    3. Setting the appointment as a recurring one.


    The sample calendar applications are on the following four interaction channels:


    +   1. Desktop Windows

    2. Web-based

    3. Tablet

    4. Smartphone


    The following is a detailed description of the interaction with setting an appointment
    in each of the well-known Windows-based applications.


    **The first application** for typically installed on desktop and laptop computers
    with a familiar graphical user interface (GUI). In the calendar user interface,
    the user can perform these tasks in the very first tab of the Appointment window.
    The label for that window and the first tab is “Appointment” (Figure 1.1). Notice
    where and how the user performs each of the following tasks in the GUI:


    +   1. Setting the basic appointment parameters: text fields to specify the subject
    and location of the appointment, in addition to a couple of controls to specify
    the date and time of the appointment.


    +   2. Setting a reminder: a pop-down list to select the lead time for the reminder.'
  merge: -1
