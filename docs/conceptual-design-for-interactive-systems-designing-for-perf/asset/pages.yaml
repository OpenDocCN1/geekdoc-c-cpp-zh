  md: '# Conceptual Design in

    Context: Think

    Strategically


    Involvement in conceptual design requires you to have good strategic awareness
    and to leverage that awareness in the conceptual design process. What is the meaning
    of having strategic awareness? Simply put, it means being aware of the larger
    context within which the conceptual design takes place. This chapter discusses
    aspects of strategic awareness and thinking and their relevance to conceptual
    design.


    # THE BUSINESS CONTEXT: MOTIVATIONS FOR

    DEVELOPING THE PRODUCT AND VALUE

    PROPOSITIONS


    When we design the user interface, we naturally consider user and usage aspects.
    But that is not all. The strategic and business side of things has a huge impact
    on how a product is designed and developed and, consequently, has an impact on
    usability and user experience. Being aware of the strategic and business aspects
    includes addressing questions such as the following: Is the product a revision
    or update of an existing product? Alternatively, is it a completely new product,
    perhaps based on new technology?


    An update for an existing product puts the designer and developer in a context
    where there is some experience with the product, there is a user population that
    can be accessed in user research, the stronger and weaker aspects of the product
    are known or at least can be reached via summative usability testing, and a style
    has been set for the user interface and interaction with the product. In contrast,
    if it is a completely new product, there is no coherent and accessible user population,
    there is much uncertainty with respect to what may be the strong and weak aspects
    of the product, and user interface and interactions are to be defined.


    However, here is a cautionary note: It may sound if the designer''s life is easier
    with a revision or update of an existing product compared with a new product.
    This is not necessarily so and there is a downside to the benefits. An existing
    product may carry over a legacy that constrains the revision or update work, that
    does not exist with a new product. In contrast, a new product can introduce many
    uncertainties that may result in uninformed design decisions.'
  merge: -1
  pgno: 87
- img_proc: true
  md: 'As a designer, you must know why a product is developed, be it a new one or
    a revision and update. You must be aware of the motivation and fully understand
    its value proposition for the end user and other stakeholders. Such understanding
    and awareness provide you with information that should be applied in the design
    to facilitate meeting the goals and objectives dictated by the motivation.


    There could be various reasons to update or revise a product or develop a new
    product. Let us have a quick glance at the most common ones:


    +   - Meeting user needs—An existing user population may have previously unmet
    or new needs. These can be uncovered via venues such as requests, complaints,
    frequency and nature of using support and help facilities, usability testing,
    and design surveys. These needs can define new directions for either updating
    products or developing new ones.

    - Providing or improved technology—The discovery and development of a new technology,
    be it hardware or software-based, is often a major catalyst in developing a new
    product or in revising and updating an existing product. The discovery and development
    of a new technology could be a response to user needs or a serendipitous outcome
    of unrelated processes and developments. In these cases, where new technology
    emerges and might not relate to user needs, it is the role of interaction and
    UX designers to uncover the user needs and design according to. It is the social
    responsibility of all involved to ensure that the new technology is beneficial
    and does not have any adverse impact on people and society.

    - Generating or increasing revenue—The motivation for developing a product is
    often the motivation for generating new revenue or increasing already existing
    revenue. In other words, follow the money. It is important to note that a new
    product or updating an existing product as a response to user needs is usually
    associated with generating and increasing revenue—either by getting new customers
    and clients and users by retaining ones.

    - Other non-related motivations—Not everything is driven by a desire for revenue.
    There are numerous motivations such as social and environmental concerns. Any
    website or application serving a nonprofit organization is most driven by motivations
    and goals of that organization and not revenue-oriented goals. Any website or
    application supporting the service of a government to its citizens is not driven
    by revenue-oriented goals (at least directly). It is usually at informing, educating,
    and facilitating good citizenship.


    Meeting business development, branding, and marketing opportunities—New business
    opportunities, some of which are related to responding to user needs, can be a
    driver for developing a product. Such opportunities arise with new technologies,
    new investments, new partners, and new competitions, and global financial and
    market changes and fluctuations, and social and political changes. Any of those
