    # LINK FUNCTIONAL CHUNKS


    The next step after defining the functional chunks, be they task- or object-oriented,
    is to outline the links between chunks. The links between functional chunks depend
    on task structure, interaction flow, and affinities with objects. Consider also
    the strength of the links. The links can be stronger if the chunks are used frequently
    or if they are dependent upon each other during the interaction flow. Link simple
    task-oriented chunks that


    +   - serve the same goal, in a product with multiple goals;

    - are part of the same task workflow;

    - are sequential in a given task workflow;

    - are performed frequently together.


