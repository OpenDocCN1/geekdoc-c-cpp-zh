  md: '# Preface


    # WHAT IS THIS BOOK ABOUT?


    This book is about conceptual models and conceptual design of interactive systems.


    There are so many attractively designed applications. Nevertheless, many leave
    the user frustrated. What do you need to consider before designing the screens
    in order to ensure that the application will provide a positive user experience?
    Conceptual design is a key step in the process of user interface design that answers
    that question. And this book offers an effective methodology to do conceptual
    design.


    Let examine a practical example to illustrate where you could encounter conceptual
    models in the overall context of designing and developing interactive systems.
    Imagine an application on a mobile device supporting physical workouts. Within
    such an application, designing the feature of reviewing previous workouts. We
    can envision a very straightforward 1-2-3 design process consisting of three major
    steps (Figure 1):


    +   1. Take a few features;

    2. Sketch a wireframe, test and revise; and then

    3. Finalize the detailed design of the user interface.


    However, how exactly did we get from the list in step 1 to the detailed wireframe
    in step 2? There are un-answered questions such as:


    +   * How and when we decide which items should be grouped? For example, should
    the "previous workouts" be a group?

    * Did we define other groups of features? For example, should there be a group
    of planned workouts?


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_11_0.png)


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_11_1.png)


    Features


    A detailed wireframe


    Final detailed design


    +   1. List view workouts

    2. Show some parameters for each

    3. Allow selection of each'
