  md: '# CHAPTER

    10


    # A Typology of

    Conceptual Models


    We have talked about conceptual models in general terms and illustrated them with
    the appointment applications. However, the illustrations showed us very specific
    models. Are there general types of models? In other words, can we talk about a
    typology of conceptual models? A typology can give us


    +   1. general criteria for appropriateness of a model type to a given situation,

    2. terms to compare between alternative models.


    There are several published typologies of website architectures (Brinck, Gergle,
    & Wood, 2002; Garrett, 2002; Lynch & Horton, 2008). The following is a light adaptation
    of some of those typologies to conceptual models underlaying any user interface,
    be it a website or any application regardless if it is online or offline.


    Conceptual models differ in the degrees of freedom given to the user in accomplishing
    tasks and achieving goals. In some cases, the task flow is highly structured and
    linear, giving the user less degrees of freedom in terms of alternative ways of
    interaction. In other cases, the task flow is unstructured, giving the user more
    degrees of freedom in alternatives how to perform the interaction. Following this,
    typologies of conceptual models can be divided into two main categories:


    +   1. Sequential and structured: including single-sequence and hierarchy or multiple-sequence
    models

    2. Nonsequential and unstructured: including hub and spokes, matrix, and network
    models


    A system rarely consists of a single model. Each of the following typologies is
    like a simple or a complex building block in a broader conceptual model that likely
    consists of a combination of several of these typologies. Most of the examples
    below illustrate how typical this is in programs. “Hybrid Conceptual Models” at
    the end of this section discusses this.'
  merge: -1
  pgno: 67
- img_proc: true
  md: '# SEQUENTIAL AND STRUCTURED MODELS


    Single sequence

    Configuration: Several conceptual elements configured in a linear sequence, with
    each element linked to the element leading to it and to the following conceptual
    model in the sequence (Figure 10.1).


    Conceptual navigation map: The single-sequence structure has a single entry point
    and a exit/conclusion point. Navigation is possible only forward or backward within
    each pair of linked model elements in the sequence.

    Navigation policy: Only a single conceptual model element is available for interaction
    at any given time.

    Exceptions and variations: All or some of the conceptual model elements in the
    sequence have an exit, thus not forcing the user to go through all conceptual
    model elements in the sequence in order to exit the interaction.


    Performance implications:


    +   * Location awareness—high

    * Visual search effectiveness—high

    * Operational (executing actions) load—low

    * Working memory load—low


    Usability implications:


    +   * Learnability—fast and easy

    * Effectiveness—high

    * Efficiency—low

    * Satisfaction—likely high


    Appropriate for:

    The single-sequence model supports


    +   * short task sequences,

    * highly structured tasks (there is a prescribed order with which the user must
    perform and complete the task),

    * infrequent tasks,

    * tasks primarily for novices and users who need guidance,


    FIGURE 10.1:

    A schematic example for a single-sequence conceptual model.


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_68_0.png)'
