    # PROJECT MANAGEMENT CONSIDERATIONS


    We now have details. Often, the outcome of this design phase is easier to communicate
    because we can show something concrete, which is easier to understand. We can
    also test what we have. How can we get to see what in Figures 18.4 and 18.5, since
    it feels we went through a long sequence of activities and outcomes that may be
    harder to communicate and evaluate?


    First, as tempting it is, not to skip the steps that lead to this point. A good
    and valid detailed conceptual model must be based on the foundation developed
    and validated in all previous steps.


    Second, remember the teamwork approach. All relevant stakeholders should buy into
    this process and be an integral part of it.


    Third, as discussed earlier how the previous steps are shorter and faster. Remember,
    the goal is not necessarily to follow a linear process but rather ensure that
    all layers of the design are covered and well integrated at the end.'
