  md: '# Navigation Map: Moving from One Place to Another


    The main aspect of the navigation and policy layer is the navigation map of the
    conceptual model. As discussed in the primer part of the book, getting to the
    full navigation map is more than just having the routes between conceptual elements.
    The full map includes also the navigation policy (modality) based on the assignment
    of conceptual elements to physical places. However, here in the step-by-step methodology,
    we will divide this layer into two steps: we outline the navigation map, explained
    in this chapter, and then in the next chapter, we will cover the physical assignment
    and finalize the navigation policy.


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_123_0.png)


