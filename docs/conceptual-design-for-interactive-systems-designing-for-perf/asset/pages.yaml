  md: 'Multichannel or cross channel interaction considerations: The most common

    allenge of many design and development projects is to ensure a consistent

    user experience across different interaction channels. Note that in the running

    example, we have addressed this challenge as well. While the approach in is

    to deal with the cross channel conceptual design in parallel, it is by no means

    a recommendation. As was said earlier in this part of the book, the approaches

    to dealing with multichannel and cross channel design are variable and may

    depend on a variety of factors and considerations that are out of the scope of
    this

    book. However, what we show here is that we can develop a cross channel conceptual

    model.


    # Navigation Policy—Key Practical Points


    +   * Based on human performance goals, user research, and the interaction

    channel considerations, assign each conceptual element to a

    physical place.

    * Define the navigation policy, which should include rules regarding

    mality of elements and how it influences navigation.

    * Start prototyping the model with your favorite prototyping tool.

    * Pause and revisit the model with focus on navigation and policy.

    * Define how the user will interact physically with the model based on

    t operational principles of the interaction channel.

    * Outcome: A preliminary prototype with little details—of the

    conceptual model with the navigation map and policy.

    * Evaluate with team members and other stakeholders to validate the

    model and the navigation map.'
