    models, to represent what they know. The mental structures typically consist of
    elements and the links between them. The elements could be words, concepts, images,
    names, places, episodes, experiences, and actions. A person’s knowledge on a topic
    comprises elements and their links. Some links are strong; others are weak. When


    +   * Use five human performance factors to assess implications of conceptual
    models:

    * Mental models and understanding

    * Location awareness

    * Visual search effectiveness

    * Operational (executing actions)

    * Working memory load'
