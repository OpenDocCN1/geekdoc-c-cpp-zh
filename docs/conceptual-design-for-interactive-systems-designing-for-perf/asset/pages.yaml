    # Is this book for you?


    This book is for you if:


    +   - You design user interfaces.

    - You are looking for ways to improve the usability of the product.

    - You are looking for a systematic proven foundation to support the creative leap
    from requirements to design.


    If you design user interfaces and are looking for ways to improve the usability
    of your designs, then this is for you. If you still experience the leap from functional
    requirements to screen design as a magical mystical experience and you want to
    introduce a systematic, proven approach, then this is for you. If you review test
    user interfaces designed by others and are looking for the words to share your
    feedback, then this is for you. It is for whoever are (1) the product manager,
    (2) the UX or UI designer, (3) the programmer, (4) the marketing person, (5) the
    graphic designer, (6) an investor, or (7) any other person who has stay in the
    product.


    Is there any pre-requisite knowledge for using this book? Yes, some. The book
    focuses on a part of the user interface design process: conceptual design. That
    is why you should know something about the following:


    +   - Fundamentals of user interface, usability, and user experience design

    - User-centered or human-oriented design processes

    - User research


    By studying and using this book, you will achieve two goals:


    +   1. Understand conceptual models in terms of functional chunks, configuration,
    navigation & policy in terms of how you can influence human performance, usability,
    and user experience by how you define the conceptual model.

    2. Implement a solid conceptual design methodology for developing conceptual models.


    You can and should devote time to the construction of conceptual models when you
    are engaged in an agile or lean development process aimed at expedit delivering
    to clients and end users. This book challenges the tendency of some developers
    to think it could be a waste of time to do too much research, or waste time engaging
    with wireframes and prototypes in exploring various ideas. By engaging in conceptual
    design instead of skipping this critical phase, you will make the system more
    usable, saving significant time, money and goods as a result. You can avoid being
    part of the proliferation of unusable systems and suffer the costs of redesigning
    those systems to make them effective.'
