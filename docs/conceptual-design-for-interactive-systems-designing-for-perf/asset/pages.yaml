  md: '# DEFINE FUNCTIONAL CHUNKS


    We start with functions. Based on the research we have done, functions are the
    various actions, elements, and parameters that together make up the subject matter
    of the product. The first activity in constructing the conceptual model is to
    group functions into chunks. What are the key drivers to define functional chunks?
    Let us consider here two:


    *A priori*: Sometimes, there are *a priori* considerations for how to chunk the
    functions. These can be driven by business considerations and market trends, branding
    strategies, reflection of the underlying technology of the product, and a good
    representation of how users perceive the subject matter or, in other words, their
    mental model.


    *Emergent*: The chunks emerge from an empirical discovery process (e.g., a focus
    group or card sorting or employing the KJ method, from the task analysis, or based
    on the object-action analysis) with no *a priori* considerations.


    Regardless of whether the criteria for chunking are *a priori* or emergent, we
    would like these chunks to be meaningful. What is a meaningful chunk? A real ease
    definition of a meaningful chunk is whatever we define as meaningful according
    to certain criteria. But seriously, what should be the criteria for defining meaningful
    chunks? We can characterize meaningful chunks around two typical cores: tasks
    or objects. Let us start with defining simple functional chunks, that is, chunks
    with a single core. Later, we will get to defining complex chunks, which we will
    call compound chunks.


    # Task-oriented functional chunks


    *Definition*: A user is the core of a task-oriented functional chunk. Appropriateness:
    Define task-oriented functional chunks when


    +   * they users'' mental models. The results of a task analysis validated by
    users can be viewed as reflecting users'' mental models. See the functional chunks
    for the mobile and desktop channels in the running example in Figure 14.1.

    * workflow is very task-oriented and structured. See the functional chunks for
    the mobile channel in the running example in Figure 14.2. No functional chunks
    are presented for the desktop channel since the workflow has only three steps,
    each distinct with respect to the tasks they represent (see Figure 13.4, the left-hand
    diagram).


    The core of the task-oriented functional chunks in the running example, presented
    in Figures14.1 and 14.2, are the tasks. The task-oriented functional chunks for
    the mobile channel (top of Figure 14.1) are as follows: device and personal setup,
