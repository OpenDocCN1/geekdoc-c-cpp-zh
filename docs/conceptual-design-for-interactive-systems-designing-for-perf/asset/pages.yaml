  md: '# How Is the book organized?


    The book has two parts. The first part is a bit theoretical. It focuses on the
    concept of conceptual models and their impact on human performance, usability,
    and experience. You can view this part as a primer introducing and discussing
    this thing we call “a conceptual model.” The second part is the practical part.
    It focuses on the conceptual design process and the methodology with which we
    develop the conceptual model. The second part walks you through the steps in developing
    a conceptual model and you can use it as a “how to” guide.'
