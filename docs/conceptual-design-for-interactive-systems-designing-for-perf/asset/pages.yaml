  md: '# The Function Layer


    # FUNCTIONAL CHUNKS


    Many drivers determine the functions of the product: needs of users and any other
    stakeholder, product vision and definition, business objectives and model, and
    technology. The outcome is what we have on the function layer. it includes all
    the parameters, information items, and actions that are relevant to the domain
    of the application or system (e.g., time management). Combined, all of these represent
    the functionality of the product.


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_29_0.png)


    Designers typically group parameters, information items, and actions pertaining
    to a given domain into functional chunks according to a common purpose or meaning
    for the user. (user, market, etc.). The functional chunks can revolve around tasks
    and/or objects. In this book, we focus on the two primary forms of functional
    chunks: task-oriented and object-oriented. There is another form of functional
    chunk and that is the content-oriented chunk. We will mention it here but the
    methodology part of the book will not focus on it. Defining these functional chunks
    is a part of the conceptual design process. The second part of the book deals
    with the methodology of conceptual design.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# TASK-ORIENTED CHUNKS


    Task-oriented functional chunks are collections of tasks serving a common purpose
    (see Figure 4.1). Task-oriented chunks enable the user to reach a tangible goal,
    accomplish something concrete (such as set an appointment or set a reminder) or
    get information about a specific topic. A task-oriented chunk could also be purely
    for function and engagement with no tangible utility (e.g., a game task such as
    "place all the cards in order according to a set of rules")


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_30_0.png)


    FIGURE 4.1:

    The idea of a task-oriented chunk.


    # OBJECT-ORIENTED CHUNKS


    Object-oriented chunks include an object from the subject matter of the application
    domain (e.g., an appointment, a printer, a page, a trip, or a parking location)
    relevant to that object (Figure 4.2) (Shneiderman, 1998).


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_30_1.png)


    FIGURE 4.2:

    The idea of an object-

    oriented chunk.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# CONTENT-ORIENTED CHUNKS


    Content-oriented chunks are collections of information items. Each chunk is a
    content category. Users typically search for and use the information items for
    various purposes (Figure 4.3).


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_31_0.png)


    FIGURE 4.3: The idea of a content-oriented chunk.


    # THE RELATIONS BETWEEN FUNCTIONAL CHUNKS AND COMPOUND CHUNKS


    Often, a single chunk does not fully support the completion of a task. More often,
    it does not support the accomplishment of user goals. In such cases, we look for
    several interrelated chunks to support task completion and/or goal achievement.
    We can even have task, object, and content chunks making up a compound chunk (Figure
    4.4). Having several chunks within a compound chunk depends on how frequency of
    use, task structure, and interaction flow. Let us look at a small example to clarify.
    In order to support users in preparing to print something, we can have a compound
    function objects such as the printer and the page, and these are related to task-oriented
    chunk including opening, changing, removing, saving, and printing.'
  merge: -1
