    # Analyses implications


    The analyses relevant to assigning conceptual models to physical locations are
    task analysis, object-action analysis, and the desired interaction flow. These
    analyses have the following outcomes and implications:


    What do we do something?—One of the outcomes of task analysis is the frequency
    with which tasks are performed or expected to be performed. Tasks and their associated
    conceptual elements with similar frequencies can be considered for the same physical
    place or in close proximity.


    What do we do at the same time?—An outcome of all the analyses is whether tasks
    and actions are typically performed at the same time, or close to each other.
    Tasks and actions done at the same time, on the same object or different objects,
    can be considered for the same physical place or in close proximity.


    What do we do after another?—An outcome of the desired interaction flow and of
    task analysis is the sequence with which tasks and actions are performed or supposed
    to be performed. Together with similar frequency and/or doing things at the same
    time, operations in a sequence can be considered for the same physical place or
    in close proximity.


    What depends on what?—A primary outcome of the desired interaction flow, and also
    implied from the task analysis and object-action analysis, is the dependency between
    actions. Dependency is the requirement that a given action must precede another
    action. A simple, almost everyday example for dependency in many programs and
    applications is between copy or cut and paste. Actions with dependency relations
    between them can be considered for the same physical place or in close proximity.


    What do we see at the same time?—An outcome of all the analyses is the required
    expected visibility of tasks and objects. The visibility of a task or an object
    is the level with which the user is aware of their status. The analyst should
    identify those tasks or'
