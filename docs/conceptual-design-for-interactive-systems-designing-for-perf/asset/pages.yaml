  md: '# What''s in This Step?


    The relevant activities in navigation and policy for fine-tuning

    navigation map are the following:


    +   1. Define the physical place assignment.

    2. Start prototyping.

    3. Define policy (modality).

    4. Revisit and revise.

    5. Define operational principles.

    6. Evaluate and revise.


    # DEFINE PHYSICAL PLACES FOR CONCEPTUAL ELEMENTS


    While still far from making detailed implementation decisions, at this point,
    we should\assign conceptual elements to their physical places. As explained in
    the primer part

    of this book, the assignment to physical places has an impact on navigation and

    interaction policy. You can use several decision criteria to assign conceptual
    elements

    to physical places as described below.


    # Human performance goals


    The following human performance criteria have been outlined and discussed in the

    primer and may be considered as performance goals:


    +   - Mental models and understanding

    - Location awareness

    - Visual search effectiveness

    - Operational (executing actions) load

    - Working memory load


    We can use these performance goals as primary decision criteria for physical

    assignments (Table 17.1).

    As always with human behavior, we may trade-offs between goals. The

    very common one is the trade-off between increasing visual effectiveness

    and reducing operational load. Resolve the trade-offs between the performance

    gals with additional implications from the user research analyses, context of
    use,

    and interaction channels.'
