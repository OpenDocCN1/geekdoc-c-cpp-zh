  md: '# THE APPEARANCE CONCEPT: CONSIDER A METAPHOR


    In the primer part of the book, we stated that if the user does not understand
    it, the user would not be able to use it. What is a good way to facilitate the
    understanding of the conceptual model? Here, we need to consider if the conceptual
    model was developed to match an existing mental model of users, or if there is
    a need to help the user develop a new mental model and be able to use the system.
    One common way in the world of UI and UX design to achieve this is using metaphors.
    A metaphor is the representation of a concept in terms of another concept. Using
    something as a metaphor can help users interact with elements that are otherwise
    too abstract or too technical to understand.


    For example, the most famous, popular, and longest surviving metaphor in the world
    of human-computer interaction is the "desktop.\ Introduced first through the Xerox
    Star graphical interface, the desktop metaphor represented computer and software
    elements in the familiar desktop environment with terminology and icons as folders
    and files, the trashcan, and peripheral devices as the printer.


    metaphor is another great example for combining an operational principle with
    a visual metaphor. E-readers or book reading applications on various devices typically
    have the application appear as a hint of the book cover in the background and
    the look of pages as the binding midline. Moreover, the use of the book utilizes
    the touch-based interaction style of swiping from right to left to imitate the
    page flipping action we do to change pages with a real book (Figure 18.1).


    # On Mapping, Analogies, and Metaphors


    When we use artifacts in our environment, and the same goes for interactive products,
    Norman (1999) talked about the principle of natural mapping. The principle refers
    to an ability to understand and what to do or how to use by mapping a correspondence
    between controls (e.g., buttons) and the elements we are trying to control or
    manipulate (e., an on-screen element).


    Mapping is inherent in our ability to understand and solve problems by the use
    of analogies. We can solve a problem by solving another problem that is analogous
    to the source problem. To do that, we first notice a correspondence between the
    two problems and then map the correspondence between the two problems. Based on
    the mapped correspondence, we can apply the solution from the analog to the original
    problem (Catrambone & Holoyoak, 1989; Gick & Holoyoak, 1980; Holoyoak & Thagard,
    1995).


    The use of metaphors is very similar to understanding another. A metaphor helps
    us understand one concept or idea in terms of another (e.g., Lakkoff & Johnson,
    1980). In other words, we can map the correspondence between the metaphor and
    what we know or can understand.'
  merge: -1
