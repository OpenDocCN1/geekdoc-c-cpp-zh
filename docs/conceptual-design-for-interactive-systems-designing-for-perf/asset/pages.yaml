    # Network


    Conceptual configuration: The model consists of multiple entry points and multiple
    interlinked conceptual elements and physical places. The configuration provides
    the user with many degrees of freedom with respect to where to start interaction
    flow and how to navigate. Almost by definition, many websites have a fundamental
    network conceptual modeling their architecture (Figure 10.9).


    Conceptual navigation principles: The user can initiate interaction flows from
    multiple starting points. Since there are multiple links between conceptual elements,
    the user can navigate to some destinations in more than one route. In addition,
    the user may start on a given route and deviate to a different route without necessarily
    concluding the initial one. The user can exit at various points as well.'
