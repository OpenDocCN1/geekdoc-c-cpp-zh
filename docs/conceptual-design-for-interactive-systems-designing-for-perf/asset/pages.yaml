    # PROJECT MANAGEMENT CONSIDERATIONS


    Very often, in many project contexts, this is the state we want to get to as soon
    as we can. This is because at at this step, we have our ideas and the concept
    expressed in concrete terms that we can show and test. Does it feel like too long
    to get here? First, recall that we suggested earlier at various times in the process,
    you can “fast-forward” to the abstract state of some functional chunks and conceptual
    elements to a more concrete visualization and get back to proceed with other elements.


    Second, the project team can manage the process described so effectively and efficiently.
    With respect to effectiveness, members of the project team and other stakeholders
    should be involved. This ensures that all perspectives, on all levels of the product
    from the very strategic to the very specific, are considered. It is effective
    because it can mitigate too-late realizations that some important considerations
    were missed or not properly addressed. With respect to efficiency, this process
    can be managed fast. While it may, at first glance, seem like a long and multistep
    process, the duration and throughput depend on the scope and complexity of the
    domain and feature set. Let us use the running example and review the activities
    in getting to point with hypothetical, yet realistic, time estimates for a quick
    process (Table 17.6).


    TABLE 17.6:

    Estimated project time for the running example


    | Activity | Participants | Time estimate |

    |---|---|--|

    | User research | Users, other stakeholders | 2 days (including interviews and
    focus groups) |

    | Generating functions and requirements from data | Project team | 1 day |

    | Chunking functions | Project team, stakeholders | 0.5-day workshop with stakeholders
    |

    | Model elements and configuration | Project team | 0.5 day |

    | Adding navigation and policy while prototyping | Project team | 1 day |

    | Formative evaluation and revision | Project team, stakeholders | 1 day |

    | Total for “Sketching the conceptual model” | | 6 days |'
