  md: '# The Conceptual Model—Fundamentals


    So far, the preface and the title of this section suggested that a key concept
    in this book is the “conceptual model.” The objective of the first part of the
    book is to present the fundamentals of the conceptual model in interactive systems
    and discuss its impact. Briefly, a conceptual model is the configuration of conceptual
    elements and the navigation between them. As such, a conceptual model is the foundation
    of the user interface of any interactive system. However, before we proceed any
    further with abstract-sounding words and sentences, let us dive into an example.
    Designing an effective and consistent user experience across the interaction channels
    is challenging. We will put emphasis in the book on this challenge. The running
    example for this part of the book is a multiple and cross-channel interaction
    one.'
  merge: -1
