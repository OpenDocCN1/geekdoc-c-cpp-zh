    # Example for a single-sequence model


    The installation wizard for many programs is a typical example for a single-sequence
    conceptual model. Note that in this example, the navigation map provides an entry
    in every conceptual element. In addition, each conceptual element appears in a
    window of its own (Figure 10.2).


    FIGURE 10.2: An example for a single-sequence conceptual model.


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_69_0.png)


    # Hierarchy or multiple sequences


    Configuration: Several conceptual elements configured as a hierarchy, with source
    “parent” element linked to several “child” elements, and each subsequent element
    could be linked further to “child” elements.


    A hierarchical structure supports multiple sequences based on all branches in
    the hierarchy. Each sequence is ad hoc, or as needed, and exists as a function
    of a specific interaction sequence the user performs in order to accomplish a
    goal. The example here (Figure 7.1, right-hand side) illustrates how the hierarchy
    supports two possible sequences.


    Note that the relatively simple hierarchy in this can support up to six sequences,
    two of them consisting of two conceptual model elements and four with three conceptual
    model elements each (Figure 10.3).


    Conceptual navigation map: A hierarchical structure has a single entry and exit
    point at the source “parent” element. It allows forward and backward navigation
    within each pair of linked elements. In order to conclude the interaction, the
    user is required to navigate back to the source element. From there, the user
    can either exit or initiate another interaction sequence.'
