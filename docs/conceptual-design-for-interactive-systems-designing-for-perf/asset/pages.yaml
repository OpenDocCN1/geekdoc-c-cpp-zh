    # # USABILITY AND USER EXPERIENCE IMPLICATIONS


    The underlying configuration of the UI has an impact on its human performance
    factors. These, in turn, can have an impact on user experience. Here, we discuss
    four factors that are popular in the usability and user experience discipline:

    **Learnability:** Learnability is the rate and by which users learn to use the
    application. Many factors influence learning. For the purpose of the discussion
    here, we will focus on the mental load imposed primarily by working memory load.

    **Effectiveness:** Effectiveness is the accuracy and completeness with which users
    achieve specific goals (ISO 9241-11). Location awareness and the effectiveness
    of the visual search heavily affect accuracy and completeness.

    **Efficiency:** Efficiency is the resources expended in relation to the accuracy
    and completeness with which users achieve goals (ISO 9241-11). The more a task
    loads working memory, the more mental resources it costs to perform.

    **Satisfaction:** Satisfaction is the third parameter of usability according to
    ISO 9241-11 is satisfaction, the comfort and acceptability of use.'
