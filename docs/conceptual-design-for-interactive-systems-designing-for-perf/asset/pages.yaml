  md: '# THE CONCEPTUAL MODEL–FUNDAMENTALS


    Figure 6.1 shows one conceptual model configuration (configuration C from Figure
    5.1) with three different navigation maps.


    In conceptual navigation map C1, navigation starts and ends with conceptual model
    1. From that element, one can proceed to conceptual model 2 or 4. When one occurs
    the interaction at conceptual model 2 or 4, one navigates back to conceptual model
    1 in order to exit. Finally, one can continue from conceptual model 2 to conceptual
    model 3, and once one concludes the interaction in conceptual model element 3,
    one has navigate back to conceptual model element 2. Conceptual navigation map
    C2 is identical to C1 with the exception that one can conclude the interaction
    at conceptual model element 4 and exit from there without going back to conceptual
    model element 1. Finally, in conceptual navigation map C3, one can also conclude
    the interaction in conceptual elements 2 and 3 and exit from each of them without
    having to retrace the navigation backward to exit.


    The following two primary considerations influence the route a user takes linked
    conceptual model elements to perform all the tasks required to accomplish goal:


    +   1. The conceptual model configuration

    2. Decisions on the workflow and dynamics of the interaction


    Each of the links in a conceptual model configuration is a possible route the
    user can take. However, having a link between elements does not always tell us
    if it is a one-way or a two-way route. In addition, it does not tell where the
    entry and exit points are. The decision on those latter parameters is influenced
    by workflow.


    However, the physical location of each conceptual element also influences the
    route characteristics. For example, look at elements 2 and 3 in any of the three
    examples in Figure 6.1. The map indicates that there is a two-way route between
