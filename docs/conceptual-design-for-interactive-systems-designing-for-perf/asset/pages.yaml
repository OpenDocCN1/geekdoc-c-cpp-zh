  md: '# Matrix


    Configuration: There are two key characteristics to the matrix conceptual model:


    +   1. There are several and parallel starting points (in contrast to the sequential
    and structured models that have a single starting point).

    2. There are at least two, related or independent, sets of such starting points.
    That is the reason it is named a matrix.


    Visualizing this model as having two dimensions expresses the strategy of having
    parallel interaction flows. In a matrix configuration with two independent dimensions,
    there is no functional or interaction flow dependency between the elements in
    one dimension and the elements in the other. In a matrix configuration with two
    related dimensions, an interaction with a given element in one dimension will
    determine the available elements in the other dimension.


    The two visualizations in Figure 10.7 reflect two common approaches to this model:


    +   A. Each of the parallel starting points in each dimension leads to a sequence
    of linked conceptual elements.

    B. Each of the parallel starting points in each dimension leads to a single conceptual
    element where most of the interaction is taking place.


    Conceptual navigation principles: There are multiple entry and exit points with
    no sequential dependency among them; the user can start at any of the points.
    Once the user enters an interaction flow at a given starting point, the relevant
    functional chunk or chunks may appear in a single place (B in Figure 10.7) that


    Figure 10.7:

    Two examples for a matrix conceptual model: A. Parallel, related or unrelated,
    starting points linked to a sequence or group of additional elements; B. Parallel,
    related or unrelated, starting points linked to a central element.


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_74_0.png)'
