  md: 'Steps to choosing a metaphor:


    +   1. Determine if it is relevant to have a metaphor. Base yourself on outcomes
    of the user research.


    +   2. Get familiar with users’ language and metaphors are commonly used in their
    lives, work, society, and culture.


    +   3. Utilize user research to consider mental models.


    +   4. Determine how far you can go with the metaphor (see above the book metaphor
    as an example for the breakdown of the metaphor).


    +   5. Consider native and conventional metaphors (e.g., file).


    +   6. Consider the product brand.


    # ADD DETAILS


    So far, the conceptual model is at a relatively high abstraction level. Choosing
    a metaphor can help the transition to adding more details to the conceptual model.
    Even when assigning the conceptual elements to physical places, the representation
    was in terms of placeholders with no details in any of the places. However, once
    we have evaluated and validated the model, it is time to start adding the details.
    Specifically, we add the details from the functional chunks.


    The details of each functional chunk are derived from the user research and the
    analyses that were performed. The details can include the following:


    +   * Actions—Distinguish between navigation actions actions performed on the
    subject-matter objects. Navigation actions are those that enable going through
    the navigation map of the conceptual model, for example, opening or closing a
    window, clicking on a tab to move to another conceptual element, and opening a
    file or an application. The actions on subject-matter objects can be derived primarily
    from the object-action analysis. Actions on subject-matter objects can include
    the creation, modification, or deletion of objects (e.g., creating a new workout
    plan in the running experience example).


    +   * Parameters—Typically, each subject-matter object is associated with parameters
    that help the user define it. In the running experience example, the planned distance
    in kilometers is one of the parameters that help the user define the workout.
    Note that since this step is the transition to the detailed design, not the fine-tuning
    and the finalization of the detailed design, there is no need to determine the
    final user interface element that will let the user define the parameter. For
    example, the planned distance in kilometers can be set in a'
