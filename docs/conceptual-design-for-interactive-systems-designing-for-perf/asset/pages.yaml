  md: '# # The Configuration Layer


    The configuration layer is the abstraction of the functional chunks along with
    their relations. The result is model elements configured according to the relations
    between them. In other words, we can refer to this as the functional architecture.¹


    ![](img/03d8a14fde3082fc884c0d2b2be68fd9_35_0.png)


    # ## CONCEPTUAL MODEL ELEMENTS


    User interaction typically involves doing something, then “transitioning” to do
    something else, and so on until accomplishing the goal. The spatial metaphor to
    describe such an interaction flow. The spatial metaphor talks about “places” the
    user visits and navigates among them. Thus, the underpinnings of user interaction
    with the functional chunks are the different “places” the user visits in order
    to perform tasks and accomplish goals. These “places” are the most fundamental
    elements of the conceptual model. Relations between functional chunks translate
    to


    > ¹Equivalent to information architecture in the World of Web site design, but
    in conceptual design of interactive systems, information is but one category of
    elements in the architecture, in addition to tasks, objects, and their parameters.'
