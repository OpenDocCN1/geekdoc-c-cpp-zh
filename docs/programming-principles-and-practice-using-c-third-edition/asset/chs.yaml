  \ `Window` 对象，但屏幕上什么都没有出现。可能的原因有哪些？\n[18] 我们使用什么库来实现我们的图形/GUI 界面？我们为什么不直接使用操作系统？\n\
  \n### 术语\n\n| | | | | |\n| :--- | :--- | :--- | :--- | :--- |\n| 颜色 | 图形 | 坐标 |\
