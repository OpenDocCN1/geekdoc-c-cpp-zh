  \n[18] 为什么要将成员函数设为虚函数？\n\n[19] 为什么要*不*将成员函数设为虚函数？\n\n[20] 为什么要将虚成员函数设为纯虚？\n\n[21]\
  \ 重写（Override）意味着什么？\n\n[22] 为什么你应该始终对类层次中的类禁用拷贝操作？\n\n[23] 接口继承与实现继承有什么区别？\n\n\
  [24] 什么是面向对象编程？\n\n### 术语\n\n| 抽象类 | 可变性 | `public` | 访问控制 |\n| :--- | :--- | :---\
  \ | :--- |\n| 对象布局 | 纯虚函数 | 基类 | 面向对象 |\n| 子类 | 派生类 | `override` | 超类 |\n| 分发 |\
  \ 多态性 | `virtual` 函数 | 封装 |\n| `private` | 虚函数调用 | 继承 | `protected` |\n| 虚函数表 |\
  \ `=0` | OOP | `=delete` |\n\n### 练习题\n\n[1] 定义两个类 `Smiley` 和 `Frowny`，它们都派生自类 `Circle`。接下来，派生类\
