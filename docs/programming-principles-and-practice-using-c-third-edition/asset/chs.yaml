  \ 调用 `f()`。\n\n### 知识复习\n\n[1] 什么是应用领域？\n\n[2] 命名的理想标准是什么？\n\n[3] 我们可以命名什么？\n\n\
  [4] `Shape` 提供哪些服务？\n\n[5] 抽象类与非抽象类有何区别？\n\n[6] 如何让一个类变成抽象类？\n\n[7] 访问控制控制的是什么？\n\
  \n[8] 将数据成员设为 `private` 有什么好处？\n\n[9] 什么是虚函数？它与非虚函数有什么区别？\n\n[10] 什么是基类？\n\n[11]\
  \ 是什么使得一个类是派生的？\n\n[12] 我们说的对象布局是什么意思？\n\n[13] 你可以做什么让一个类更容易测试？\n\n[14] 什么是继承图？\n\
