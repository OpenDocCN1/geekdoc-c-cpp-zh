  zero\"`、`\"one\"`、. . . `\"nine\"`。在程序中使用它将数字转换为对应的拼写值；例如，输入 `7` 输出 `seven`。让同一个程序使用相同的输入循环，将拼写的数字转换为数字形式；例如，输入\
