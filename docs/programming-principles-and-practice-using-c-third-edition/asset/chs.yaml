  [23] 对于容器，`begin()` 和 `end()` 应该做什么？\n\n#### 后记\n\n**CC**\n\n如果我们有 $N$ 种容器和我们要对它们做的\
  \ $M$ 件事，我们很容易写出 $N \\times M$ 段代码。如果数据有 $K$ 种类型，我们最终可能会写出 $N \\times M \\times\
  \ K$ 段代码。STL 通过将元素作为参数（处理 $K$ 因素）以及将数据访问分离来解决这个问题。通过使用迭代器访问任何容器的任何算法，我们可以实现巨大的简化。例如，如果我们有\
  \ 12 种容器和大约 125 种算法（不包括范围算法），暴力破解方法需要 1500 个函数，而 STL 策略只需要 125 个函数和 12 个迭代器定义：我们节省了\
  \ 90% 的工作。事实上，这还低估了节省的精力，因为许多算法需要两个迭代器，且这对迭代器不需要相同类型（例如 `copy()`）。此外，STL 为编写正确且可组合的代码提供了惯例，因此节省更多。\n\
