  \ f(i);\n}\n```\n\n当编译 `user.cpp` 时，编译器会执行 `#include` 并编译\n\n```cpp\nint f(int);\n\
  \nint g(int i)\n{\n         return f(i);\n}\n```\n\n由于 `#include` 在逻辑上发生在编译器执行任何其他操作之前，因此处理\
  \ `#include` 属于所谓的*预处理*（preprocessing）部分（PPP2.§27.8）。\n\n## AA\n\n为了方便一致性检查，我们在使用其声明的源文件以及提供这些声明的定义的源文件中都\
  \ `#include` 同一个头文件。这样一来，编译器就能尽早捕获错误。例如，假设 `Token_stream::putback()` 的实现者犯错了：\n\n\
  点击此处查看代码图片\n\n```\nToken Token_stream::putback(Token t)\n{\n         buffer.push_back(t);\n\
  \         return t;\n}\n```\n\n这看起来足够无害。幸运的是，编译器捕获了这些错误，因为它看到了（通过 `#include` 引入的）`Token_stream::putback()`\
  \ 的声明。将该声明与我们的定义进行比较，编译器发现 `putback()` 不应该返回 `Token`，且 `buffer` 是一个 `Token` 而不是\
  \ `vector<Token>`，因此我们无法使用 `push_back()`。当我们修改代码以改进它时会发生此类错误，但没能让更改在整个程序中保持一致。\n\
  \n同样，考虑这些错误：\n\n点击此处查看代码图片\n\n```\nToken t = ts.gett();     // 错误：没有成员 gett\n//\
  \ ...\nts.putback();              // 错误：缺少参数\n```\n\n编译器会立即报错；头文件 `token.h` 为它提供了检查所需的所有信息。\n\
  \n## AA\n\n头文件通常会被包含在多个源文件中。这意味着头文件应该只包含可以在多个文件中重复的声明（例如函数声明、类定义和数值常量的定义）。\n\n在§10.8.1\
