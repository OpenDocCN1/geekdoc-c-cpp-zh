  \ `Order` 的文件，其中约三分之一的内容与第一个文件相同，将其读取到 `list<Order>` 中，按（客户）地址排序，然后写回文件。使用 `std::merge()`\
  \ 将两个文件合并为第三个文件。\n\n[8] 计算上一个练习中两个文件中 `Order` 的总价值。单个 `Purchase` 的价值（当然）是其 `unit_price\
  \ * count`。\n\n[9] 提供一个 GUI 界面，用于将 `Order` 输入到文件中。\n\n[10] 提供一个 GUI 界面，用于查询 `Order`\
  \ 文件；例如：“查找所有来自 `Joe` 的订单”、“查找文件 `Hardware` 中所有订单的总价值”以及“列出文件 `Clothing` 中的所有订单”。提示：首先设计一个非\
  \ GUI 界面；然后在此基础上构建 GUI。\n\n[11] 编写一个程序来“清理”文本文件以用于单词查询；即：将标点符号替换为空格，将单词转为小写，将 `don’t`\
  \ 替换为 `do not`（等等），并删除复数形式（例如，`ships` 变为 `ship`）。不要想得太宏大。例如，通常很难确定复数形式，所以如果你同时发现了\
  \ `ship` 和 `ships`，只需删除一个 `s`。使用该程序处理一个至少包含 5000 个单词的真实文本文件（例如研究论文）。\n\n[12] 编写一个程序（使用上一个练习的输出）来回答此类问题：“文件中有\
  \ `ship` 出现了几次？”“哪个单词出现频率最高？”“文件中最长的单词是什么？”“最短的又是？”“列出所有以 `s` 开头的单词。“列出所有四个字母的单词。”\n\
  \n[13] 为上一个练习的程序提供一个 GUI。\n\n## 后记\n\n### AA\n`STL` 是 ISO C++ 标准库中涉及容器和算法的部分。因此，它提供了非常通用、灵活且实用的工具。它可以为我们节省大量工作：重新发明轮子可能很有，但很少能产生效益。除非有强力的理由反对，否则请使用\
  \ `STL` 容器和算法。此外，`STL` 是泛型编程的一个示例，展示了具体的问题和具体的解决方案如何变成一套强大且通用的工具集。如果你需要处理数据——程序员确实需要——`STL`\
  \ 提供了一个示例、一套思想以及一种通常可以提供帮助的方法。\n\n## 索引\n两种知识。我们要么自己了解一个主题，要么知道去哪里可以找到关于它的信息。\n\n\
