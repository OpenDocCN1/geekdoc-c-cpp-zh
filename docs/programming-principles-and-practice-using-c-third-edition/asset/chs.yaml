  \ C++ 的核心，也是许多高效设计技术的关键。本书的大部分内容都是关于类的设计和使用。类（或一组类）——是我们在代码中表示概念的机制。在这里，我们主要介绍了类的语言技术层方面；在其他地方，我们重点关注如何通过类来优雅地表达有用的思想。\n\
