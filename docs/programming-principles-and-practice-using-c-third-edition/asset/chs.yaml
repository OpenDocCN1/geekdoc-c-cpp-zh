  \    *   `e`: 科学计数法 (scientific)\n    *   `f`: 固定点位 (fixed)\n    *   `g`: 通用格式，精度为\
  \ 6\n    *   `none`: 通用格式，使用默认精度\n3. 我们还可以指定用于某个值的多少个字符位置。§9.10.2](#ch09.xhtml_ch09lev2sec9)\
  \ 中的“宽度示例”可以这样写。\n4. 精度通过小数点后的数字来指定。\n5. 你可以组合格式化指令。\n6. 你可以使用 `string` 作为 `istream`\
