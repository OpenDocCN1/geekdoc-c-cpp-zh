  * *第 14 章：*图形用户界面\n\n## 9\n\n## 输入与输出流\n\n*科学就是我们学到的关于如何不自欺骗的知识。*\n\n*– 理查德·P·费曼*\n\
  \n在本章中，我们介绍了 C++ 标准库中用于处理各种来源的输入和输出的设施：I/O 流。我们展示了如何读写文件、如何处理错误、如何处理格式化输入，以及如何为用户定义类型提供和使用\
  \ I/O 操作符。本章侧重于基础模型：如何读写单个值，以及如何打开、读取和写入整个文件。\n\n*§9.1* 输入与输出\n*§9.2* I/O 流模型\n\
  *§9.3* 文件\n\n打开文件; 读写文件\n*§9.4* I/O 错误处理\n*§9.5* 读取单个值\n\n将问题分解为可管理的部分; 将对话框与函数分离\n\
  *§9.6* 用户定义的输出操作符\n*§9.7* 用户定义的输入操作符\n*§9.8* 标准输入循环\n*§9.9* 读取结构化文件\n\n内存表示; 读取结构化值;\
  \ 更改表示\n*§9.10* 格式化\n\n整数 I/O; 浮点数 I/O; 字符串 I/O; 字符 I/O; 扩展 I/O\n\n*§9.1* 输入与输出\n\
  \n### 9.1 输入与输出\n\n**CC**\n\n科学就是我们学到的关于如何不自欺骗的知识。没有数据，计算就是毫无意义的。我们需要向程序输入数据并从程序输出结果。在本章中，我们将看到如何使用\
  \ C++ 标准库进行格式化数据的输入输出。\n\n从程序员的角度来看，有许多不同的输入和输出。一种分类方法是\n\n*   数据项流（通常来自文件、网络连接、记录设备或显示设备）\n\
  *   与键盘用户的交互\n*   通过图形界面与用户的交互（输出对象、接收点击等）\n\n这种分类并不是唯一的分类方法，这三种 I/O 之间的区别并不像那么明显。例如，如果输出流恰好是一个浏览器的\
  \ HTTP 文档，结果看起来非常像用户交互，并包含图形元素。相反，与 GUI（图形用户界面）交互的结果可能以字符序列呈现给程序。然而，这种分类符合我们的工具：前两种\
  \ I/O 由 C++ 标准库提供，并被大多数操作系统直接支持。我们从第 1 章就开始使用 iostream 库，并在本章和下章中重点关注它。图形输出和图形用户交互由各种不同的库提供，我们将在第\
  \ 10 章到第 14 章关注这类 I/O。\n\n### 9.2 I/O 流模型\n\nC++ 标准库提供了 `istream` 类型来处理输入流，提供了 `ostream`\
  \ 类型来处理输出流。我们已经使用过标准的 `istream`（cin）和标准的 `ostream`（cout），因此我们了解如何使用这部分标准库（通常称为 iostream\
  \ 库）的基础知识。\n\n**CC**\n\n一个 `ostream`\n\n\n\n\n\n*   将各种类型的值转换为字符序列\n*   将这些字符发送到“某处”（例如控制台、文件、主内存或另一台计算机）\n\
  \n我们可以像这样图形化地表示 `ostream`：\n\n![图表显示了 o stream 的用法。数据值 c、(12, 34) 和 123 合并 o stream\
  \ 并经过缓冲区渲染成单词 Somewhere。](img/f0255-01.jpg)\n\n缓冲区（buffer）是 `ostream` 内部使用的一种数据结构，用于在与操作系统通信时存储你提供的数据。如果你发现向\
  \ `ostream` 写入内容与字符出现在目的地之间存在“延迟”，这通常是因为它们仍在缓冲区中。缓冲对于性能至关重要，而当你处理大量数据时，性能也至关重要。\n\
  \n**CC**\n\n### 一个 `istream`\n\n[1] 从某处获取字符（例如控制台、文件、主内存或另一台计算机）\n[2] 将这些字符序列转换为各种类型的值\n\
  \n我们可以像这样图形化地表示 `istream`：\n\n![图表显示了 i stream 的用法。单词 Somewhere 经过缓冲区并通过 i stream\
  \ 渲染出数据值 c、(12, 34) 和 123。](img/f0255-02.jpg)\n\n与 `ostream` 一样，`istream` 也使用缓冲区与操作系统通信。对于\
  \ `istream`，缓冲过程对用户来说是非常明显的。当你使用一个连接到键盘的 `istream` 时，你输入的内容会留在缓冲区中，直到你按下回车键（return/换行），期间你可以使用退格键（Backspace）来“改变主意”（直到你按下回车键为止）。\n\
  \n输出的主要用途之一是为人类读取数据。想想电子邮件、学术文章、Web 页面、账单记录、业务报告、联系人列表、目录、设备状态读数等。因此，`ostream` 提供了许多格式化文本的功能，以适应不同的喜味。同样，许多输入是由人类编写的，或者经过格式化以便于人类阅读。因此，`istream`\
  \ 提供了读取 `ostream` 生成的类型输出的功能。我们将在 §9.10 中讨论格式化。与输入相关的大部分复杂性与如何处理错误有关。为了能够给出更实际的例子，我们首先开始讨论\
  \ iostream 模型如何与数据文件相关。\n\n### 9.3 文件\n\n**CC**\n\n我们拥有的数据通常比主内存能容纳的数据多得多，因此我们将大部分数据存储在磁盘或其他大容量设备上。此类设备具有一个理想的属性：当电源关闭时数据不会消失——数据是*持久的*（persistent）。在最基础的层面上，文件简单来说就是从\
  \ 0 开始编号的字节序列：\n\n![显示了一个从 0 开始编号的字节序列的文件，其表现为一系列矩形数组。](img/f0256-01.jpg)\n\n文件有一种格式；也就是说，它有一套决定字节含义的规则。例如，如果我们有一个文本文件，前\
  \ 4 个字节将是前四个字符。另一方面，如果我们有一个使用二进制表示整数的文件，那么这同样的前 4 个字节将位视为第一个整数的（二进制）表示。格式对于磁盘上的文件起的作用，与类型对于主内存中的对象起的作用相同。只有当（并且当）我们知道文件的格式时，我们才能理解文件中位位的含义。\n\
  \n**CC**\n\n对于文件，`ostream` 将主内存中的对象转换为字节流并将其写入磁盘。`istream` 则相反；即，它从磁盘获取字节流并由它们组合成对象：\n\
  \n![图表显示了 i o stream 的用法。输入/输出流或 i o streams 通过文件（字节序列）连接到磁盘，通过对象（各种类型）连接到主内存。](img/f0256-02.jpg)\n\
  \n在大多数情况下，我们假设这些“磁盘上的字节”实际上是我们常用的字符集中的字符。情况并不总是如此，但凭这个假设我们就可以走得很远，而且其他表示方式处理起来也不那么困难。我们说话也就像所有文件都在某种形式的永久存储器上一样（即在旋转磁性存储或固态存储上）。同样，这并不总是如此（考虑远程存储的文件），但在这种编程水平，实际的存储方式并没有区别。这就是文件和流抽象的魅力之处之一。\n\
  \n要读取文件，我们必须：\n\n[1] 知道它的名称\n[2] 打开它（为了读取）\n[3] 入字符\n[4] 关闭它（尽管这通常是隐式完成的）\n\n要写入文件，我们必须：\n\
  \n[1] 为其命名\n[2] 打开它（为了写入）或创建一个同名的新文件\n[3] 写出我们的对象\n[4] 关闭它（尽管这通常是隐式完成的）\n\n我们已经知道了读写的基本知识，因为连接到文件的\
  \ `ostream` 的行为与我们目前为止所执行的 `cout` 完全一样，而连接到文件的 `istream` 的行为与我们目前为止所执行的 `cin` 完全一样。我们将在\
  \ PPP2.§11.3.3 中介绍只能针对文件的操作，但现在我们只需查看如何打开文件，然后专注于适用于所有 `ostream` 和 `istream` 的操作和技术。\n\
  \n### 9.3.1 打开文件\n\n**AA**\n\n如果你需要从文件读取或向文件写入内容。`ifstream` 是读取文件的 `istream`，`ofstream`\
  \ 是写入文件的 `ostream`，而 `fstream` 是可以同时用于读取和写入的 `iostream`。在使用文件流之前，必须将其附加到文件。例如：\n\
  \n点击此处查看代码示例\n\n```cpp\ncout << \"输入文件名：\";\nstring iname;\ncin >> iname;\nifstream\
  \ ist {iname};                  // ist 是名为 iname 的输入流\nif (!ist)\n         error(\"\
  无法打开输入文件：\",iname);\n```\n\n**AA**\n\n使用字符串定义 `ifstream` 会打开该名称的文件进行读取。`!ist` 的测试检查文件是否正确打开。之后，我们可以像使用任何其他\
  \ `istream` 一样从文件中读取。例如，假设输入运算符 `>>` 已经为 `Point` 类型定义，我们可以：\n\n```cpp\nvector<Point>\
  \ points;\nfor (Point p; ist>>p; )\n         points.push_back(p);\n```\n\n输出到文件通过\
  \ `ofstream` 以类似的方式处理。例如：\n\n点击此处查看代码示例\n\n```cpp\ncout << \"输出文件名：\";\nstring oname;\n\
  cin >> oname;\nofstream ost {oname};              // ost 是名为 oname 的输出流\nif (!ost)\n\
  \         error(\"无法打开输出文件：\",oname);\n```\n\n**AA**\n\n使用字符串定义 `ofstream` 会打开该名称的文件进行写入。`!ost`\
  \ 的测试检查文件是否正确打开。之后，我们可以像使用任何其他 `ostream` 一样向文件中写入。例如：\n\n点击此处查看代码示例\n\n```cpp\n\
  for (Point p: points)\n         ost << '(' << p.x << ',' << p.y << \")\\n\";\n```\n\
  \n当文件流超出作用域时，其关联的文件会被关闭。当文件关闭时，其关联的缓冲区会被“刷新”（flush）——即缓冲区中的字符会被写入文件。\n\n通常最好在程序执行任何实际计算之前打开文件。毕竟，在做了大量工作后才发现因为没有可以写入结果的地方而无法完成，那是浪费的。\n\
  \n在创建 `ostream` 或 `istream` 的过程中隐式打开文件是理想的，文件流在作用域结束时会隐式关闭其文件；参见 §15.5。例如：\n\n点击此处查看代码示例\n\
  \n\n\n\n\n```\nvoid fill_from_file(vector<Point>& points, string& name)\n{\n   \
  \      ifstream ist {name};                  // 打开文件进行读取\n         if (!ist)\n \
  \                 error(\"can't open input file \",name);\n         // ... 使用 ist\
  \ ...\n         // 当我们离开函数时，文件会自动关闭\n}\n```\n\n不要忘记在打开流后对其进行测试。\n\n你也可以使用显式的 `open()`\
  \ 和 `close()` 操作。例如：\n\n点击此处查看代码图片\n\n```\nifstream ifs;\nifs.open(name,ios::in);\
  \                     // 以读读模式打开名为 name 的文件\n// ...\nifs.close();              \
  \                             // 关闭文件\n```\n\n然而，这种做法太繁琐了。此外，依赖作用域来控制文件的打开时间，可以最大限度地减少有人在文件打开之前或关闭之后尝试使用它的概率。\n\
  \n为什么要显式地使用 `open()` 或 `close()` 呢？嗯，偶尔与文件连接的生命周期无法方便地受作用域限制，因此你必须这样做。但这种情况非常罕见，我们不需要在这里担心。更重要的一点是，你会在某些语言和库风格的代码中发现这种用法，这些库没有\
  \ `iostream` 所使用的作用域惯用法（以及 C++ 标准库的其他部分 §18.4.2）。\n\n### 9.3.2 文件的读写\n\n考虑如何从文件中读取一组测量结果并将其表示在内存中。这些可能是气象站的温度读数：\n\
  \n```\n0 60.7\n1 60.6\n2 60.3\n3 59.22\n...\n```\n\n该数据文件包含一系列 `(hour,temperature)`\
  \ 元对。小时数编号为 0 到 23，温度单位为华氏度。不假设任何额外的格式；也就是说，文件不包含任何特殊的头部信息（例如读取是在哪里进行的）、数值的单位、标点符号（如每对数值周围的括号）或终止指示符。这是最简单的情况。\n\
  \n我们可以用 `Reading` 类型来表示温度读数：\n\n点击此处查看代码图片\n\n```\nstruct Reading {            \
  \    // 一个温度读数\n         int hour;                                     // 午夜后的小\
  \ [0:23]\n         double temperature;                 // 华氏度\n};\n```\n\n基于此，我们可以这样读取：\n\
  \n点击此处查看代码图片\n\n```\nvector<Reading> temps;                  // 在此处存储读数\nint hour;\n\
  double temperature;\nwhile (ist >> hour >> temperature) {\n         if (hour < 0\
  \ || 23 <hour)\n                  error(\"hour out of range\");\n         temps.push_back(Reading{hour,temperature});\n\
  }\n```\n\n这是一个典型的输入循环。名为 `ist` 的 `istream` 可以是一个输入文件流 (`ifstream`)（如上一节所示），标准输入流\
  \ (`cin`）的别名，或者任何其他类型的 `istream`。对于此类代码，`istream` 从何处获取数据并不重要。我们的程序只关心 `ist` 是一个\
  \ `istream` 并且数据符合预期格式。下一节将讨论一个有趣的问题：如何检测输入数据中的错误，以及在检测到格式错误后我们可以做什么。\n\n向文件写入通常比从文件读取更简单。同样，一旦初始化了流，我们不需要确切知道它是哪种流。特别是，我们可以像使用任何其他\
  \ `ostream` 一样使用上一节中的输出文件流 (`ost`)。例如，我们可能希望用括号括起每对数值并输出读数：\n\n点击此处查看代码图片\n\n```\n\
  for (Reading x : temps)\n         ost << '(' << x.hour << ',' << x.temperature <<\
  \ \")\\n\";\n```\n\n生成的程序将读取原始的温度读数文件，并生成一个带有 `(hour,temperature)` 格式的新文件。\n\n**AA**\n\
  \n由于文件流在离开作用域时会自动关闭文件，完整的程序变为：\n\n点击此处查看代码图片\n\n```\nstruct Reading {          \
  \      // 一个温度读数\n         int hour;                             // 午夜后的小 [0:23]\n\
  \         double temperature;         // 华氏度\n};\nint main()\n{\n         cout <<\
  \ \"Please enter input file name: \";\n         string iname;\n         cin >> iname;\n\
  \         ifstream ist {iname};                          // ist 读取名为 iname 的文件\n\
  \         if (!ist)\n                  error(\"can't open input file \",iname);\n\
  \n         string oname;\n         cout << \"Please enter name of output file: \"\
  ;\n         cin >> oname;\n         ofstream ost {oname};                      \
  \ // ost 写入名为 oname 的文件\n         if (!ost)\n                  error(\"can't open\
  \ output file \",oname);\n\n         vector<Reading> temps;                   //\
  \ 在此处存储读数\n         int hour = −1;\n         double temperature = −700;\n      \
  \   while (ist >> hour >> temperature) {\n                  if (hour < 0 || 23 <hour)\n\
  \                           error(\"hour out of range\");\n                  temps.push_back(Reading{hour,temperature});\n\
  \         }\n\n         for (Reading x : temps)\n                  ost << '(' <<\
  \ x.hour << ',' << x.temperature << \")\\n\";\n}\n```\n\n### 9.4 I/O 错误处理\n\n在处理输入时，我们必须预期错误并处理它们。什么类型的错误？如何处理？错误的发生是因为人类失误（误解指令、输入错误、让猫在键盘上等），是因为文件不符合规范，是因为我们（程序员）有错误的预期等。错误的可能性是无限的！然而，`istream`\
  \ 将所有情况简化为四种可能，称为流状态：\n\n| **流状态** |\n| --- |\n| **good()** | 操作成功。 |\n| **eof()**\
  \ | 我们达到了输入末尾（文件结束即 \"eof\"）。 |\n| **fail()** | 发生了意外情况（例如，我们寻找数字却发现了 ‘x’）。 |\n\
  | **bad()** | 发生了意外且严重的情况（例如，磁盘读取失败）。 |\n\n**CC**\n\n遗憾的是，`fail()` 和 `bad()` 之间的区别没有精确定义，并且取决于定义新类型\
  \ I/O 操作的程序员的意。。然而，基本思想非常简单：如果输入操作遇到简单的格式错误，它会让流变为 `fail()`，假设你（该输入操作的用户）可能能够恢复。另一方面，如果发生了非常糟糕的事情（例如磁盘读取失败），输入操作会让流变为\
  \ `bad()`，假设除了放弃尝试从该流获取数据外无事可做。一个 `bad()` 流也是 `fail()`。这为我们留下了如下通用的逻辑：\n\n点击此处查看代码图片\n\
  \n```\nint i = 0;\ncin >> i;\nif (!cin) {                                只有当输入操作失败时我们才会进入这里\n\
  \         if (cin.bad())                               // 流损坏\n                \
  \  error(\"cin is bad\");           // 让我们离开这里！\n         if (cin.eof()) {     \
  \                          // 没有更多输入：\n                  // ... 这通常是我们希望一组输入操作结束的方式\
  \ ...\n         }\n         if (cin.fail()) {                               // 流遇到意外情况\n\
  \                  cin.clear();                        // 为更多输入做好准备\n          \
  \        // ... 以某种方式恢复 ...\n         }\n}\n```\n\n\n\n\n\n`!cin` 可以读为“`cin` 不好”或“`cin`\
  \ 出了问题”或“`cin` 的状态不是 `good()`。”它是“操作成功”的反面。请注意我们在处理 `fail()` 时使用的 `cin.clear()`。当流发生失败时，我们可能可以进行恢复。为了尝试恢复，我们显式地将流从\
  \ `fail()` 状态中移出来，这样我们就可以再次查看它的字符；`clear()` 正是做这一点——在 `cin.clear()` 之后，`cin` 的状态即为\
  \ `good()`。\n\n### 示例\n\n这里有一个我们如何使用流状态的示例。考虑如何向 `vector` 中读取一个整数序列，该序列可能由字符 `*`\
  \ 或“文件结束符”（Windows 上的 Ctrl+Z，Linux 上的 Ctrl+D）终止。例如：\n\n```\n1 2 3 4 5 *\n```\n\n\
  可以使用如下函数来实现这一功能：\n\n点击此处查看代码图片\n\n```\nvoid fill_vector(istream& ist, vector<int>&\
  \ v, char terminator)\n         // 从 ist 中读取整数到 v，直到遇到 eof() 或 terminator\n{\n \
  \        for (int x; ist>>x; )\n                  v.push_back(x);\n         if (ist.eof())\
  \                                                  // 很好：我们找到了文件末尾\n           \
  \       return;\n         if (ist.bad())                                       \
  \          // 流损坏；\n                  error(\"ist is bad\");                   \
  \         // 让我们离开这里！\n         if (ist.fail()) {                              \
  \                 // 尽可能地清理现场并报告问题\n                  ist.clear();             \
  \                             // 清除流状态，以便我们可以查找 terminator\n                  char\
  \ c = 0;\n                  ist >> c;                                          \
  \    // 读取一个字符，希望是 terminator\n                  if (c != terminator) {        \
  \                  // 意外之外的字符\n                           ist.unget();         \
  \                       // 将该字符放回\n                           ist.clear(ios::failbit);\
  \                // 将状态设为 fail()\n                  }\n         }\n}\n```\n\n注意，当我们没有找到终止符时，我们仍然返回了。毕竟，我们可能收集了一些数据，而\
  \ `fill_vector()` 的调用者可能能够从 `fail()` 中恢复。由于我们清除了状态以便检查字符，我们必须将流状态设回 `fail()`。我们通过\
  \ `ist.clear(ios::failbit)` 做到这一点。这里处处出现的 `ios` 是 `iostream` 的一部分，它持有诸如 `failbit`\
  \ 等常量以及控制流行为的其他有用工具。你使用 `::` 运算符来引用它们，例如 `ios::badbit`。使用带参数的 `clear()` 可能会引起混义；`clear()`\
  \ 会设置上述的 `iostream` 状态标志（位），并清除未提到的标志位。\n\n通过将状态设为 `fail()`，我们表示遇到了格式错误，而不是更严重的问题。我们使用\
  \ `unget()` 将字符放回 `ist` 中；`fill_vector()` 的调用者可能需要用到它。`unget()` 函数是 `putback()`\
  \ (§5.8) 的简短版本，它依赖于流记住上一次产生的字符，这样你就不需要提到它了。\n\n如果你调用了 `fill_vector()` 并想知道什么终止了读取，你可以测试\
  \ `fail()` 和 `eof()`。你也可以捕获由 `error()` 抛出的 `runtime_error` 异常，但大家都认为 `bad()` 状态下从\
  \ `istream` 获取更多数据是不可能的。大多数调用者不会费心。这意味着在几乎所有情况下，如果我们遇到 `bad()`，我们唯一想做的就是抛出异常。为了方便起，如果我们遇到\
  \ `bad()` 唯一想做的就是抛出异常，我们可以让 `istream` 这样做：\n\n点击此处查看代码图片\n\n```\nist.exceptions(ios::badbit|ios::failbit);\
  \ \n```\n\n通过将状态设为 `fail()`，我们表示遇到了格式错误，而不是更严重的问题。我们使用 `unget()` 将字符放回 `ist` 中；`fill_vector()`\
  \ 的调用者可能需要用到它。`unget()` 函数是 `putback()` (§5.8) 的简短版本，它依赖于流记住上一次产生的字符，这样你就不需要提到它了。\n\
  \n如果你调用了 `fill_vector()` 并想知道什么终止了读取，你可以测试 `fail()` 和 `eof()`。你也可以捕获由 `error()`\
  \ 抛出的 `runtime_error` 异常，但大家都认为 `bad()` 状态下从 `istream` 获取更多数据是不可能的。大多数调用者不会费心。这意味着在几乎所有情况下，如果我们遇到\
  \ `bad()`，我们唯一想做的就是抛出异常。为了方便起见，如果我们遇到 `bad()` 唯一想做的就是抛出异常，我们可以让 `istream` 这样做：\n\
  \n点击此处查看代码图片\n\n```\nist.exceptions(ios::badbit|ios::failbit); \n```\n\n这种写法看起来很奇怪，但其效果是从该语句开始，`istream`\
  \ 在 `bad()` 时会异常：\n\n点击此处查看代码图片\n\n```\nist.exceptions(ios::badbit|ios::failbit);\
  \ \n```\n\n对于输出设备有很大几率不可用、填充或损坏的程序，我们可以在每次输出操作后像测试输入操作一样进行测试。`ostream` 拥有与 `istream`\
  \ 完全相同的状态：`good()`、`fail()`、`eof()` 和 `bad()`。然而，对于输出，我们通常可以让 `bad()` 和 `fail()`\
  \ 抛出异常来简化代码。\n\n### 9.5 读取单个值\n\n所以，我们知道如何读取以文件结束或终止符结束的一系列值。我们将在过程中展示更多示例，但让我们看看一直流行的想法：反复请求值直到输入有效值为止。这个示例允许我们检查几种常见的设计选择。我们将通过解决“如何从用户获取有效值”这一简单问题的系列方案来讨论这些选择。我们从一个混乱且明显的“首次尝试”开始，经过一系列改进版本。我们的基本假设是，正在处理交互式输入，即人类正在输入内容并阅读程序的提示。让我们请求一个\
  \ 1 到 10 范围内的整数：\n\n点击此处查看代码图片\n\n```\nint get10()\n{\n         cout << \"请输入 1\
  \ 到 10 范围内的整数（包含边界）:\\n\";\n         int n = 0;\n         while (cin>>n) {     \
  \                    // 读取\n                  if (1<=n && n<=10)           // 检查范围\n\
  \                           return n;\n                  cout << \"抱歉 \" << n <<\
  \ \" 不在 [1:10] 范围内；请重试\\n\";\n         }\n}\n```\n\n\n\n\n这看起来相当糟糕，但它“算好能用”。为什么它只是“算好有用”呢？如果用户仔细输入整数，它是可以的。但如果用户打字不规范，输入了\
  \ `t` 而不是 `6`（在很多键盘上 `t` 在 `6` 的下方），程序将会在不改变 `n` 值的情况下跳出循环。这称不上合格的代码。一个开玩笑的人（或严谨的测试者）也可能发送一个文件结束符。同样，这也会让\
  \ `n` 超出范围。换句话说，为了获得健壮的读取，我们必须处理三个问题：\n\n1. 用户输入了超出范围的值\n2. 未获取值（文件结束符）\n3. 用户输入了错误类型的内容（在这里，不是整数）\n\
  \n在这些情况下，我们想要怎么做？这通常是编写程序时面临的问题：我们到底想要？在这里，对于这三个错误，我们有替代方案：\n\n1. 在代码中处理问题。\n2.\
  \ 抛出异常让其他部分处理问题（可能终止程序）。\n3. 忽略问题。\n\n**AA**\n\n碰巧，这些是处理错误的三种常见替代方案。因此，这就是我们必须对错误的思考方式。\n\
  \n人们倾向于认为第三种替代方案——忽略问题总是不可接受的，但这种说法太傲慢了。如果我写一个自己用的简单程序，我可以随心所欲，包括忘记错误检查。然而，对于一个我可能想使用几个小时的程序，留下这种错误可能是愚蠢的，而且如果我想把程序分享给任何人，我就不应该在代码中留下这样的漏洞。请注意这里使用第一人称单数，“我们”会产生误导。\n\
  \n在方案 1 和 2 之间进行选择是真实的；也就是说，对于给定的程序，选择任何一种方式都有理由。首先我们注意到，大多数程序没有优雅的方法来处理用户的输入：输入流关闭后，要求用户输入数字没有意义。我们可以重新打开\
  \ `cin`（使用 `cin.clear()`），但用户不太可能意外关闭它（你怎么按 Ctrl+Z 的？）。如果程序想要整数但发现了文件结束符，尝试读取整数的部分通常必须放弃并希望程序的其他部分处理；也就是说，我们请求输入的代码必须抛出异常。\n\
  \n更深层的问题是定义什么是有效输入。例如，我们应该在哪里拒绝“12 月 20 日”？通常，输入程序只能处理与格式相关的简单问题。与输入含义相关的问题必须在已知数据用途的更高层面处理。例如，在大多数程序中，年份\
  \ 20 是错误的，但在分析历史数据的程序中可能是一个完美的值。我们会反复回到这些问题，因为验证输入是编写良好程序的关键。\n\n### 9.5.1 将问题分解为可管理的部分\n\
  \n让我们尝试在本地处理超出范围的输入和类型错误的输入：\n\n点击此处查看代码\n\n```\nint get10()\n{\n         cout <<\
  \ \"Please enter an integer in the range 1 to 10 (inclusive):\\n\";\n         int\
  \ n = 0;\n         while (true) {\n                  cin >> n;\n               \
  \   if (cin) {                               // 我们得到了一个整数；现在检查它\n              \
  \            if (1<=n && n<=10)\n                                   return n;\n\
  \                          cout << \"Sorry \" << n << \" is not in the [1:10] range;\
  \ please try again\\n\";\n                  }\n                  else if (cin.fail())\
  \ {                     // 我们找到了一个不是整数的内容\n                          cin.clear();\
  \                         // 将状态设回 good()；我们要查看字符\n                          cout\
  \ << \"Sorry, that was not a number; please try again\\n\";\n                  \
  \        for (char ch; cin>>ch && !isdigit(ch); )             // 丢弃非数字\n       \
  \                            /* nothing */ ;\n                          if (!cin)\
  \                               // 我们没有找到数字：放弃\n                               \
  \    error(\"no input\");\n                          cin.unget();              \
  \         // 将数字退回，以便读取数字\n                  }\n                  else\n       \
  \                   error(\"no input\");             // 错误：放弃\n         }\n}\n```\n\
  \n**XX**\n\n这很混乱，而且冗长。事实上，它是如此混乱以至于我们不能建议每次需要从用户那里获取整数时写这样的代码。另一方面，我们确实需要处理潜在错误，因为人们确实会犯错，那么我们可以做什么？代码混乱的原因是处理几个不同关注点的代码混合在了一起：\n\
  \n* 读取值\n* 提示用户输入\n* 编写错误信息\n* 跳过“坏”输入字符\n* 针对范围测试输入\n\n**AA**\n\n使代码更清晰的方法通常是将逻辑上的关注点分离到不同的函数中。例如，我们可以分离出看到“坏”（即非预期的）字符后恢复的代码：\n\
  \n点击此处查看代码\n\n```\nvoid skip_to_int()\n{\n         if (cin.fail()) {           \
  \                    // 我们找到了一个不是整数的内容\n                  cin.clear();         \
  \                      // 我们想查看字符\n                  for (char ch; cin>>ch; )  \
  \                    // 丢弃非数字\n                           if (isdigit(ch) || ch=='−')\
  \ {\n                                    cin.unget();                          //\
  \ 将数字退回，以便读取数字\n                                    return;\n                  \
  \         }\n                  }\n         }\n         error(\"no input\");    \
  \                           // 或错误：放弃\n}\n```\n\n有了 `skip_to_int()` “工具函数”，我们可以写：\n\
  \n点击此处查看代码\n\n```\nint get10()\n{\n         cout << \"Please enter an integer in\
  \ the range 1 to 10 (inclusive):\\n\";\n         int n = 0;\n         while (true)\
  \ {\n                  if (cin>>n) {                               // 我们得到了一个整数；现在检查它\n\
  \                           if (1<=n && n<=10)\n                               \
  \     return n;\n                           cout << \"Sorry \" << n << \" is not\
  \ in the [1:10] range; please try again\\n\";\n                  }\n           \
  \       else {\n                           cout << \"Sorry, that was not a number;\
  \ please try again\\n\";\n                           skip_to_int();\n          \
  \        }\n         }\n}\n```\n\n这段代码更好，但仍然太长、太混乱且太特殊（例如，为什么是 [1:10]？）。\n\n我们到底想要什么样的操作？一个可能的答案是“一个读取**整数**（任意整数）的函数，以及另一个读取给定范围内**整数**的函数”：\n\
  \n点击此处查看代码\n\n```\nint get_int();                               // 从 cin 读取一个整数\n\
  int get_int(int low, int high);             // 从 cin 读取 [low:high] 范围内的整数\n```\n\
  \n如果我们有了这些，就可以简单正确地使用它们。它们写起来并不难：\n\n点击此处查看代码\n```\n\n\n\n\n\n```cpp\nint get_int()\n\
  {\n         int n = 0;\n         while (true) {\n                  if (cin >> n)\n\
  \                           return n;\n                  cout << \"Sorry, that was\
  \ not a number; please try again\\n\";\n                  skip_to_int();\n     \
  \    }\n}\n```\n\n基本上，`get_int()` 会固执地继续读取，直到找到某些可以被解释为整数的数字为止。如果我们想跳出 `get_int()`，必须提供一个整数或文件结束符（而文件结束符会导致\
  \ `skip_to_int()` 抛出异常）。\n\n使用那个通用的 `get_int()`，我们可以编写出带有范围检查的 `get_int()`：\n\n\
  点击此处查看代码图像\n\n```cpp\nint get_int(int low, int high)\n{\n         cout << \"Please\
  \ enter an integer in the range \"\n                  << low << \" to \" << high\
  \ << \" (inclusive):\\n\";\n         while (true) {\n                  int n = get_int();\n\
  \                  if (low<=n && n<=high)\n                           return n;\n\
  \                  cout << \"Sorry \"\n                           << n << \" is\
  \ not in the [\" << low << ':' << high\n                           << \"] range;\
  \ please try again\\n\";\n         }\n}\n```\n\n这个 `get_int()` 和另一个一样固执。它不断从不带范围限制的\
  \ `get_int()` 获取 `int`，直到它得到的 `int` 在预期的范围内为止。\n\n我们现在可以可靠地这样读取整数：\n\n```cpp\nint\
  \ n = get_int(1,10);\ncout << \"n: \" << n << '\\n';\n\nint m = get_int(2,300);\n\
  cout << \"m: \" << m << '\\n';\n```\n\n不过，如果你想在 `get_int()` 真的（可能罕见）无法为我们读取数字时获得良好的错误信息，请忘记在某处捕获异常。\n\
  \n### 9.5.2 将对话与函数分离\n\n`get_int()` 函数仍然将读取操作与向用户写入消息混合在了一起。对于简单程序来说这可能足够了，但在大型程序中，我们可能希望改变写入用户用户的消息。我们可能想这样调用\
  \ `get_int()`：\n\n点击此处查看代码图像\n\n```cpp\nint strength = get_int(1,10, \"enter strength\"\
  , \"Not in range, try again\");\ncout << \"strength: \" << strength << '\\n';\n\n\
  int altitude = get_int(0,50000, \"Please enter altitude in feet\", \"Not in range,\
  \ please try again\");\ncout << \"altitude: \" << altitude << \"f above sea level\\\
  n\";\n```\n\n我们可以这样实现它：\n\n点击此处查看代码图像\n\n```cpp\nint get_int(int low, int high,\
  \ const string& greeting, const string& sorry)\n{\n         cout << greeting <<\
  \ \": [\" << low << ':' << high << \"]\\n\";\n\n         while (true) {\n      \
  \            int n = get_int();\n                  if (low<=n && n<=high)\n    \
  \                       return n;\n                  cout << sorry << \": [\" <<\
  \ low << ':' << high << \"]\\n\";\n         }\n}\n```\n\n组合任意消息是很困难，因此我们对消息进行了“样式化”处理。这通常是可以接受的，而组合真正灵活的消息——例如为了支持多种自然语言（如阿拉伯语、孟加拉语、中文、丹麦语、英语和法语）所需要的消息——并不是初学者的任务。\n\
  \n请注意，我们的解决方案仍然不完全：不带范围限制的 `get_int()` 仍然会“唠叨”。这里的深层次的观点是，我们在程序的许多部分使用的“工具函数”不应该将消息“硬编码”在它们内部。此外，供许多程序使用的库函数根本不应该向用户写入任何内容——毕竟，库的编写可能根本不知道有人类在看。这就是为什么我们的\
  \ `error()` 函数不仅仅是写入错误信息（§4.6.3）的原因之一；通常情况下，我们不知道该在哪里写入。\n\n### 9.6 用户定义的输出运算符\n\
  \n为给定类型定义输出运算符 `<<` 通常是轻而易举的。主要的设计问题是，不同的人可能希望输出看起来不同，因此很难就单一格式达成一致。然而，即使没有单一输出格式适用于所有用例，为用户定义的类型定义\
  \ `<<` 通常也是一个好主意。这样，我们至少可以在调试和早期开发期间简单地写出该类型的对象。以后，我们可能会提供一个更复杂的 `<<`，允许用户提供格式化信息。此外，如果我们希望输出看起来与\
  \ `<<` 提供的不同，我们可以简单地跳过 `<<`，按照我们在应用程序中喜欢的方式输出用户定义类型的各个部分。\n\n这里是一个来自 §8.7.4 的 `Date`\
  \ 的简单输出运算符，它简单地在括号内用逗号分隔打印年、月、日：\n\n点击此处查看代码图像\n\n```cpp\nostream& operator<<(ostream&\
  \ os, const Date& d)\n{\n         return os << '(' << d.year()\n               \
  \            << ',' << d.month()\n                           << ',' << d.day() <<\
  \ ')';\n}\n```\n\n这将打印出 (30,2004)。注意 `operator<<` 取 `ostream&` 作为其第一个参数并再次返回它，这样你就可以“链”输出操作。例如，我们可以这样输出两个日期：\n\
  \n```cpp\ncout << d1 << d2;\n```\n\n这将通过先解析第一个 `<<` 然后是第二个 `<<` 来处理：\n\n```cpp\n\
  cout << d1 << d2;               means operator<<(cout,d1) << d2;\n             \
  \                  // means operator<<(operator<<(cout,d1),d2);\n```\n\n也就是说，首先将\
  \ `d1` 输出到 `cout` 输出操作的结果。事实上，我们可以使用这三种变体来写入 `d1` 和 `d2`。不过我们知道哪一种更容易读。\n\n### 9.7\
  \ 用户定义的输入运算符\n\n为给定类型和输入格式定义输入运算符 `>>` 基本上是错误处理的练习。因此它可能非常棘手。这里有一个 §8.7.4 的 `Date`\
  \ 的简单输入运算符，它可以读取由上面定义的输出 `<<` 运算符写入的日期：\n\n点击此处查看代码图像\n\n```cpp\nistream& operator>>(istream&\
  \ is, Date& dd)\n{\n         int y, m, d;\n         char ch1, ch2, ch3, ch4;\n \
  \        is >> ch1 >> y >> ch2 >> m >> ch3 >> d >> ch4;\n         if (!is)\n   \
  \               return is;\n         if (ch1!='(' || ch2!=',' || ch3!=',' || ch4!=')')\
  \ { // 哎：格式错误\n                  is.clear(ios::failbit);\n                  return\
  \ is;\n         }\n         dd = Date{y,Month(m),d};                           \
  \          // 更新 dd\n         return is;\n}\n```\n\n这个 `>>` 将读取像 (2004,8,20) 这样的项并尝试根据这三个整数创建一个\
  \ Date。一既往，输入比输出难处理得多。输入中可能（且通常发生）的问题比输出多得多。\n\n\n\n\n如果这个 `>>` 没有找到符合 `( integer\
  \ , integer , integer )` 格式的任何内容，它将使流处于一个状态不佳的状态（`fail`、`eof` 或 `bad`），并保持目标 `Date`\
  \ 不变。`clear()` 成员函数用于设置 `istream` 的状态。显然，`ios::failbit` 会将流设置为 `fail()` 状态。在读取失败时保持目标\
  \ `Date` 不变是理想的；这往往倾向于产生更整洁的代码。理想的情况是 `operator>>()` 不消耗（丢弃）任何它没有使用的字符，但在这种情况下太难了：在捕获到格式错误之前，我们可能已经读取了大量字符。例如，考虑\
  \ `(2004, 8, 30`。只有当我们看到最后的 `}` 时，我们才知道自己遇到了格式错误，而且我们通常无法依赖于回退许多字符。`unget()` 仅仅是普遍保证可以回退一个字符。如果这个\
  \ `operator>>()` 读取了无效的 `Date`，例如 `(2004,8,32)`，`Date` 的构造函数将抛出异常，这将带我们离开这个 `operator>>()`。\n\
  \n### 9.8 标准输入循环\n\n在 §9.3.2 中，我们看到了如何读写文件。然而，那是在我们更仔细地研究错误（§9.4）之前，所以输入循环仅仅假设我们可以从文件开始一直读到文件结束。这是一个合理的假设，因为我们经常通过单独检查来确保文件是有效的。然而，我们通常希望在读取过程中进行检查。这里有一个通用的策略，假设\
  \ `ist` 是一个 `istream`：\n\n点击此处查看代码图片\n\n```cpp\nfor (My_type var; ist>>var; ) {\
  \           // 读取直到文件结束\n         // ... 也许检查 var 是否有效 ...\n         // ... 对 var\
  \ 进行某些操作 ...\n}\n// 我们很少能从 bad 状态恢复；除非真的需要，否则不要尝试：\nif (ist.bad())\n         error(\"\
  bad input stream\");\n\nif (ist.fail()) {\n         // .. 是可以接受的终止符吗？ ...\n}\n//\
  \ 继续：我们找到了文件结束\n```\n\n也就是说，我们将一系列值读入变量中，当我们无法再读取更多值时，我们检查流的状态来查看原因。正如 §9.4 中，我们可以通过让\
  \ `istream` 在进入错误状态时抛出 `failure` 类型的异常来稍微改进这一点。这省去了我们一直检查它的的麻烦：\n\n点击此处查看代码图片\n\n\
  ```cpp\n// 在某处：让 ist 在发生错误时抛出异常：\nist.exceptions(ist.exceptions()|ios::badbit);\n\
  ```\n\n我们也可以决定指定一个字符作为终止符：\n\n点击此处查看代码图片\n\n```cpp\nfor (My_type var; ist>>var;\
  \ ) {                   // 读取直到文件结束\n         // ... 也许检查 var 是否有效 ...\n       \
  \  // ... 对 var 进行某些操作 ...\n}\n\nif (ist.fail()) {                             \
  \                   // 使用 ’|’ 作为终止符和/或分隔符\n         ist.clear();\n         char\
  \ ch;\n         if (!(ist>>ch && ch=='|'))\n                  error(\"bad termination\
  \ of input\");\n}\n// 继续：我们找到了文件结束或终止符\n```\n\n如果我们不想接受终止符——也就是说，只接受文件结束作为结束——只需删除调用\
  \ `error()` 之前的测试即可。然而，当你读取带有嵌套结构的文件时，终止符是非常用的，例如一个包含每日读数的每月读数文件，其中又包含小时读数等，因此我们将继续考虑终止字符的可能性。\n\
  \n遗憾的是，那代码仍然有点乱。特别是，如果我们要读取很多值，重复终止测试会很繁燥。我们可以写一个函数来处理这个问题：\n\n点击此处查看代码图片\n\n```cpp\n\
  void end_of_loop(istream& ist, char term, const string& message)\n{\n         if\
  \ (ist.fail()) {                                // 使用 term 作为终止符和/或分隔符\n       \
  \           ist.clear();\n                  char ch = 0;\n                  if (ist>>ch\
  \ && ch==term)\n                           return;                       // 一切正常\n\
  \                  error(message);\n         }\n}\n```\n\n这使得输入循环简化为\n\n点击此处查看代码图片\n\
  \n```cpp\nfor (My_type var; ist>>var; ) {                                      //\
  \ 读取直到文件结束\n         // ... 也许检查 var 是否有效 ...\n         // ... 对 var 进行某些操作 ...\n\
  }\nend_of_loop(ist,'|',\"bad termination of file\");             // 检查是否可以继续\n\n\
  // 继续：我们找到了文件结束或终止符\n```\n\n除非流处于 `fail()` 状态，否则 `end_of_loop()` 什么都不做。我们认为这对于许多目的来说足够简单且通用。\n\
  \n### 9.9 读取结构化文件\n\n让我们尝试用这个“标准循环”处理一个具体的例子。假设你有一个读数文件，其结构如下：\n\n- 文件实际上持有年份（包含每月读数）。年份以\
  \ `{` 开始，后面跟着表示年份的整数（如 1900），并以 `}` 结束。\n- 年份持有月份（包含每日读数）。月份以 `{` 开始，后面跟着三个字母的月份名称（如\
  \ `jan`），并以 `}` 结束。\n- 读数持有时间和温度。读数以 `(` 开始，后面跟着日期、小时和温度，并以 `)` 结束。\n\n例如：\n\n点击此处查看代码图片\n\
  \n```\n{ year 1990 }\n{year 1991 { month jun }}\n{ year 1992 { month jan ( 1 0 61.5)\
  \ } {month feb (1 1 64) (2 2 65.2) } }\n{year 2000\n         { month feb (1 1 68\
  \ ) (2 3 66.6) }\n         {month dec (15 15 −9.2 ) (15 14 −8.8) (14 0 −2) }\n}\n\
  ```\n\n这种格式有些奇特。文件格式往往如此。工业界正向更规则和分层结构的文件（如 HTML、XML 和 JSON 文件）发展，但现实情况仍然是我们往往无法控制所需文件提供的输入格式。文件就是那样，我们只能读取它们。如果格式太糟糕或者文件包含太多错误，我们可以编写一个格式转换程序来产生更适合我们主程序的格式。\n\
  \n#### 9.9.1 内存表示\n\n\n\n\n\n# 我们应该如何在内存中表示这些数据？\n\n显而易见的第一个选择是三个类：`Year`、`Month`\
  \ 和 `Reading`，以精确匹配输入。在处理数据时，`Year` 和 `Month` 显然是有用的；我们想要比较不同年份的温度、计算每月平均值、比较同一年的不同月份、比较不同年份同一个月份、将温度读数与光照记录及湿度读数进行匹配等。基本上，`Year`\
  \ 和 `Month` 匹配我们对温度和天气一般的思考方式：`Month` 持有一个一个月的信息，而 `Year` 持有一个一年的信息。但 `Reading`\
  \ 呢？那是一个匹配某些硬件（传感器）的低级概念。`Reading` 的数据（几号、几点、温度）是“奇异”的，且只有在 `Month` 内部才有意义。它还是无结构化的：我们无法保证读数是按日期或小时顺序排列的。基本上，每当我们想对读数进行任何感兴趣的操作时，都必须对它们进行排序。\n\
  \n为了在内存中表示温度数据，我们做了以下假设：\n\n* 如果我们某个月份有任何读数，那么我们倾向于该月份有很多读数。\n* 如果我们某一天有任何读数，那么我们倾向于那一天有很多读数。\n\
  \n在这种情况下，将 `Year` 表示为包含 12 个 `Month` 的向量（vector），将 `Month` 表示为包含约 30 个 `Day` 的 `vector`，并将\
  \ `Day` 表示为 24 个温度（每小时一个），是合理的。这样既简单又易于各种用途的操作。因此，`Day`、`Month` 和 `Year` 是简单的数据结构，每个结构都有一个构造函数。由于我们计划在知道拥有哪些温度读数之前就作为\
  \ `Year` 的一部分创建 `Month` 和 `Day`，我们需要对于一天中我们（尚未）读取数据的小小时有一个“非读数”的概念。\n\n点击此处查看代码图像\n\
  \n```\nconst int not_a_reading = −7777;              // 小于绝对零\n```\n\n同样，我们注意到经常会有没有数据的月份，因此我们引入了“非月份”的概念来直接表示它，而不是必须搜索所有天以确保没有数据躲在某处：\n\
  \n```\nconst int not_a_month = −1;\n```\n\n那么这三个关键类就变成了\n\n点击此处查看代码图像\n\n```\nstruct\
  \ Day {\n         vector<double> temp = vector<double>(24,not_a_reading);      \
  \      // 注意：括号\n};\n```\n\n也就是说，一个 `Day` 拥有 24 个小时的温度，每个都初始化为 `not_a_reading`。\n\
  \n点击此处查看代码图像\n\n```\nstruct Month {           // 一个月的温度读数\n         int month =\
  \ not_a_month;                                         // [0:11] 1 月是 0\n      \
  \   vector<Day> day = vector<Day>(32);                       // [1:31] 每天一个读数向量\n\
  };\n```\n\n我们“浪费”了 `day[0]` 来保持代码简单。\n\n点击此处查看代码图像\n\n```\nstruct Year {       \
  \       // 按月份组织的年度温度读数\n         int year;                                    \
  \                                     // 正数 == 公元\n         vector<Month> month\
  \ = vector<Month>(12);           // [0:11] 1 月是 0\n};\n```\n\n每个类基本上都是由“部分”组成的简单\
  \ `vector`，而 `Month` 和 `Year` 分别具有一个标识性成员 month 和 year。\n\n## XX\n\n这里有几个“魔数常量”（例如，`24`、`32`\
  \ 和 `12`）。我们尽量避免在代码中使用此类字面量常量。这些是相当基础的（一年的月份数很少改变），并且不会在代码的其他部分使用。然而，我们将它们留在代码中，主要是为了提醒你“魔数常量”的问题；符号常量几乎总是更优的（§6.6.1）。用\
  \ `32` 表示每月数确实需要解释；`32` 在这里显然是“魔数”。\n\n我们为什么不写成这样\n\n点击此处查看代码图像\n\n```\nstruct Day\
  \ {\n         vector<double> temp {24,not_a_reading};                // 注意：花括号\n\
  };\n```\n\n那样将更简单，但遗憾的是，我们将得到一个包含两个元素的向量（`24` 和 `−7777`）。当我们想要为一个整数可以转换为元素类型的向量指定元素数量时，遗憾的是我们必须使用\
  \ `( )` 初始化器语法（§7.2.2）。\n\n### 9.9.2 读取结构化值\n\n`Reading` 类仅用于读取输入，且是显而简单的：\n\n点击此处查看代码图像\n\
  \n```\nstruct Reading {\n         int day;\n         int hour;\n         double\
  \ temperature;\n};\n\nistream& operator>>(istream& is, Reading& r)         // 从\
  \ is 中读取温度读数\n         // 格式:( )\n{\n         char ch1;\n         if (is>>ch1 &&\
  \ ch1!='(') {                               // 格式是否合理?\n                  is.unget();\n\
  \                  is.clear(ios::failbit);\n                  return is;\n     \
  \    }\n\n         char ch2;\n         if ((is >> r.day >> r.hour >> r.temperature\
  \ >> ch2) && ch2!=')') // 错误的 Reading?\n                  error(\"bad reading\"\
  );\n         return is;\n}\n```\n\n基本上，我们检查格式开始是否合理。如果不是，我们将文件状态设置为 `fail()` 并返回。另一方面，如果我们在读取某些数据后发现格式错误，我们将通过\
  \ `error()` 退出。\n\n`Month` 输入操作非常相似，只是它必须读取任意数量的 `Reading` 而固定集合（如 `Reading` 的 `>>`\
  \ 那样）：\n\n点击此处查看代码图像\n\n```\nistream& operator>>(istream& is, Month& m)        \
  \ // 从 is 中读取月份到 m\n         // 格式:{ . . }\n{\n         char ch = 0;\n         if\
  \ (is >> ch && ch!='{') {                               // 我们未能读取月份\n          \
  \        is.unget();\n                  is.clear(ios::failbit);\n              \
  \    return is;\n         }\n\n         string month_marker;\n         string mm;\n\
  \         is >> month_marker >> mm;\n         if (!is || month_marker!=\"month\"\
  )                               // 坏的开始\n                  error(\"bad start of\
  \ month\");\n         m.month = month_to_int(mm);\n\n         int duplicates = 0;\n\
  \         int invalids = 0;\n         for (Reading r; is >> r; ) {\n           \
  \       if (is_valid(r)) {\n                           if (m.day[r.day].hour[r.hour]\
  \ != not_a_reading)\n                                   ++duplicates;\n        \
  \                   m.day[r.day].hour[r.hour] = r.temperature;\n               \
  \   }\n                  else\n                           ++invalids;\n        \
  \ }\n         if (invalids)\n                  error(\"invalid readings in month\"\
  ,invalids);\n         if (duplicates)\n                  error(\"duplicate readings\
  \ in month\", duplicates);\n         end_of_loop(is,'}',\"bad end of month\");\n\
  \         return is;\n}\n```\n\n我们稍后会回到 `month_to_int()`；它将月份的符号表示（如 `jun**）转换为\
  \ [0:11] 范围内的数字。注意使用来自 §9.8 的 `end_of_loop()` 来检查终止符。我们记录了无效和重复 `Reading`，有人可能会感兴趣。\n\
  \n`Month` 的 `>>` 在存储之前会快速检查 `Reading` 是否合理。\n\n\n\n\n\n```cpp\nconstexpr int implausible_min\
  \ = −200;\nconstexpr int implausible_max = 200;\nbool is_valid(const Reading& r)\n\
  \         // 一个粗略测试\n{\n         if (r.day<1 || 31<r.day)\n                  return\
  \ false;\n         if (r.hour<0 || 23<r.hour)\n                  return false;\n\
  \         if (r.temperature<implausible_min|| implausible_max<r.temperature)\n \
  \                 return false;\n         return true;\n}\n```\n\n最后，我们可以读取 `Year`\
  \ 了。`Year` 的 `>>` 与 `Month` 的 `>>` 类似：\n\n点击此处代码图片\n\n```cpp\nistream& operator>>(istream&\
  \ is, Year& y)\n         // 从 is 读取一个年份到 y。格式: { year 1972 ... }\n{\n         char\
  \ ch = 0;\n         is >> ch;\n         if (ch!='{') {\n                  is.unget();\n\
  \                  is.clear(ios::failbit);\n                  return is;\n     \
  \    }\n\n         string year_marker;\n         int yy = −1;\n         is >> year_marker\
  \ >> yy;\n         if (!is || year_marker!=\"year\")\n                  error(\"\
  bad start of year\");\n         y.year = yy;\n\n         while(true) {\n       \
  \           Month m;          // 每次循环获取一个干净的 m\n                  if(!(is >> m))\n\
  \                           break;\n                  y.month[m.month] = m;\n  \
  \       }\n\n         end_of_loop(is,'}',\"bad end of year\");\n         return\
  \ is;\n}\n```\n\n我们更希望它是“无聊地相似”而不只是“相似”，但它们之间存在显著差异。看一眼读取循环。你预预期类似下面的代码吗？\n\n点击此处代码图片\n\
  \n```cpp\nfor (Month m; is >> m; )\n         y.month[m.month] = m;\n```\n\n你可能应该是预料到的，因为到目前为止我们写所有的读取循环都是这种方式。那实际上是我们最开始写的代码，但它是错误的。问题在于\
  \ `operator>>(istream& is, Month& m)` 并没有给 `m` 分配一个全新的值；它仅仅是将来自 `Reading` 的数据添加到\
  \ `m` 中。因此，重复的 `is>>m` 会不断向我们那个唯一的 `m` 中添加数据。噢！每个新月份都会获得该年份之前所有月份的所有读取数据。在每次执行 `is>>m`\
  \ 时，我们需要一个全新的、干净的 `Month` 来读取数据。这样做最简单的方法是将 `m` 的定义放在循环内部，这样它在每次循环时都会被初始化。替代方案是让\
  \ `operator>>(istream& is, Month& m)` 在读取之前给 `m` 分配一个空的 `Month`，或者由循环来这样做：\n\n点击此处代码图片\n\
  \n```cpp\nfor (Month m; is >> m; ) {\n         y.month[m.month] = m;\n         m\
  \ = Month{};            // “重新初始化” m\n}\n```\n\n让我们尝试使用它：\n\n点击此处代码图片\n\n```cpp\n\
  // 打开一个输入文件：\ncout << \"Please enter input file name\\n\";\nstring iname;\ncin >>\
  \ iname;\nifstream ifs {iname};\nif (!ifs)\n         error(\"can't open input file\"\
  ,iname);\n\nifs.exceptions(ifs.exceptions()|ios::badbit);              // 出 bad()\
  \ 时抛出异常\n\n// 打开一个输出文件：\ncout << \"Please enter output file name\\n\";\nstring oname;\n\
  cin >> oname;\nofstream ofs {oname};\nif (!ofs)\n         error(\"can't open output\
  \ file\",oname);\n\n// 读取任意数量的年份：\nvector<Year> ys;\nwhile(true) {\n         Year\
  \ y;                      // 每次循环获取一个新初始化的 Year\n         if (!(ifs>>y))\n     \
  \             break;\n         ys.push_back(y);\n}\ncout << \"read \" << ys.size()\
  \ << \" years of readings\\n\";\n\nfor (Year& y : ys)\n         print_year(ofs,y);\n\
  ```\n\n我们把 `print_year()` 留作练习题。\n\n### 9.9.3 修改表示形式\n\n为了让 `Month` 的 `>>` 工作，我们需要提供一种读取月份符号表示形式的方法。为了对称性，我们将提供一个匹配的符号表示写入方法。繁琐的方法是写一个\
  \ `if−` 语句来进行转换：\n\n点击此处代码图片\n\n```cpp\nif (s==\"jan\")\n         m=1;         \
  \                    // 月份从 1 开始\nelse if (s==\"feb\")\n         m = 2;\n...\n```\n\
  \n这不仅繁琐，还将月份名称硬编码到了代码中。更好的做法是将它们放在某处的表格中，这样即使我们必须更改符号表示，主程序也可以保持不变。我们决定将输入表示形式表示为一个\
  \ `vector<string>` 加上一个查找函数：\n\n点击此处代码图片\n\n```cpp\nvector<string> month_input =\
  \ {\n         −not a month\", \"jan\", \"feb\", \"mar\", \"apr\", \"may\", \"jun\"\
  , \"aug\", \"sep\", \"oct\", \"nov\", \"dec\"\n};\n\nint month_to_int(string s)\n\
  \         // s 是月份的名称吗？ \n{\n         for (int i=1; i<13; ++i)\n               \
  \   if (month_input[i]==s)\n                           return i;\n         return\
  \ 0;\n}\n```\n\n如果你在想 C++ 是否提供了一种更简单的方法来实现此。当我们想要产生输出时，我们有 `int` 到 `string` 的反操作：\n\
  \n点击此处代码图片\n\n```cpp\nvector<string> month_print_tbl = {\n         −not a month\"\
  , \"January\", \"February\", \"March\", \"April\", \"May\", \"June\",\n        \
  \ \"July\", \"August\", \"September\", \"November\", \"December\"\n};\n\nstring\
  \ int_to_month(int i)\n         // 1:12\n{\n         if (i<1 || 12<=i)\n       \
  \           error(\"bad month index\");\n         return month_print_tbl[i];\n}\n\
  ```\n\n所以，你真的读了所有这些吗？还是你的眼睛模糊了跳到了结尾？记住我们在本示例中使用的技术。\n\n### 9.10 格式化\n\niostream\
  \ 库——C++ 标准库的输入输出部分——提供了一个统一且可扩展的文本输入输出框架。我们所说的“文本”是指任何可以表示为字符序列的任何。因此，当我们谈论输入输出时，可以将整数\
  \ `1234` 视为文本，因为我们可以使用字符 `1`、`2`、`3` 和 `4` 来写它。\n\n到目前为止，我们假设对象的类型完全决定了它的输入输出布局。这并不准确，也不够。例如，我们通常希望控制输出时表示浮点数时使用的位数（其精度）。本节介绍了我们许多可以根据需要定制输入和输出的方法。\n\
  \n\n\n\n\nI/O 的细节似乎是无穷尽的。它们可能确实如此，因为它们的限制仅在于人类的创造力和喜性无常。例如，我们还没有考虑自然语言所隐含的复杂性。在英语中写为\
  \ `12.35` 的数字在大多数欧洲语言中惯常表示为 `12,35`。自然地，C++ 标准库提供了设施来处理这些以及许多其他特定自然语言的 I/O 特性。如何编写汉字？如何比较使用马拉雅姆语（Malayalam）字符编写的字符串？答案是有的，但它们远超本书的范围。如果你需要了解，请查阅更专业或高级的书籍以及库和系统文档。寻找“`locale`；这是通常用于处理自然语言差异设施的术语。\n\
  \n另一个复杂性和灵活性的来源是缓冲：标准库的 `iostream` 依赖于一个名为 `streambuf` 的概念。对于高级工作——无论是为了性能还是为了功能——在使用\
  \ `iostream` 时这些 `streambuf` 是不可避免的。如果你觉得需要定义自己的 `iostream` 或针对新的数据源/汇点点调整 `iostream`，请查找它们。\n\
  \n### 9.10.1 整数 I/O\n\n整数值可以用二进制（二进制）、八进制（八进制）、十进制（我们常用的十进制数字系统）和十六进制（十六进制）以文本形式输出。大多数输出使用十进制。十六进制在输出硬件相关信息时非常流行。其原因是一个十六进制数位恰好表示一个\
  \ 4 位的值。因此，两个十六进制位可以用来表示一个 8 位字节的值，四个十六进制位可以表示 2 字节的值（那通常是一个半字），八个十六进制位可以表示 4 字节的值（那通常是\
  \ `int` 的大小）。当 C++ 的祖先 C 语言首次设计时（20 世纪 70 年代），八进制在表示位模式时很流行，但现在很少使用了。\n\n例如：\n\n\
  点击此处查看代码图像\n\n```\nint x = 1234;\ncout << x << \" − \" << hex << x <<\"−\"<< oct\
  \ << x << \" − \" << dec << x << '\\n';\n```\n\n这打印出\n\n```\n1234 − 4d2 − 2322 −\
  \ 1234\n```\n\n`<< hex` 符号并不输出值。相反，`hex` 通知流任何后续整数值都应该以十六进制形式显示。它们被称为*操纵符*（manipulators），因为它们会操纵流的状态。我们还有\
  \ `dec` 和 `oct` 操纵符。\n\n#### 尝试一下\n\n以十进制、十六进制和八进制形式输出你的出生年份。为每个值标记标签。使用制表符将你的输出按列对齐。现在输出你的年龄。\n\
  \n默认情况下，`>>` 假设数字使用十进制表示法：\n\n点击此处查看代码图像\n\n```\nint a = 0;\nint b = 0;\nint c =\
  \ 0;\ncin >> a >> hex >> b >> oct >> c;\ncout << dec;\ncout << a << '\\t' << b <<\
  \ '\\t' << c << '\\n';\ncout << hex;\ncout << a << '\\t' << b << '\\t' << c << '\\\
  n';\n```\n\n`'\\t'` 字符被称为“tab”（“tabulation character”的缩写——这是机械打字机时代遗留下的）。\n\n如果你输入\n\
  \n```\n1234  4d2  2322\n```\n\n这打印出：\n\n```\n1234 1234 1234\n4d2   4d2   4d2\n```\n\
  \n注意，控制格式的运算符（如 `hex`）是“粘性的”（sticky）；也就是说，它们会一直持续到被更改为止，以便我们可以为流设置一次，并使其效果在多次操作中持续。我们不需要反复应用它们。\n\
  \n没有标准的 `bin` 操纵符来提供二进制输出。如果我们需要二进制输出，就必须自己写一个，或者使用 `format()` (§9.10.6)。\n\n###\
  \ 9.10.2 浮点 I/O\n\n在科学计算和许多其他领域中，我们处理浮点值的格式化。它们使用 `iostream` 操纵符处理，方式与整数值非常相似。例如：\n\
  \n点击此处查看代码图像\n\n```\nconstexpr double d = 1234.56789;\n\ncout << \"format: \" <<\
  \ d << \" − \"                 // 使用 d 的默认格式\n         << hexfloat << d << \" −\
  \ \"                    // 为 d 使用十六进制表示法\n         << scientific << d << \" − \"\
  \                  // 为 d 使用 1.123e2 风格格式\n         << fixed << d << \" − \"   \
  \                      // 为 d 使用 123.456 风格格式\n         << defaultfloat << d <<\
  \ '\\n';               // 为 d 使用默认格式\n```\n\n这打印出\n\n点击此处查看代码图像\n\n```\nformat:\
  \ 1234.57 − 0x1.34a4584f4c6e7p+10 − 1.23457e+03 − 1234.56789\n```\n\n浮点数操纵符有：\n\n\
  | `hexfloat` | 为 `d` 使用十六进制表示法 |\n| :--- | :--- |\n| `scientific` | 为 `d` 使用 `1.123e2`\
  \ 风格格式 |\n| `fixed` | 为 `d` 使用 `123.456` 风格格式 |\n| `defaultfloat` | 为 `d` 使用默认格式\
  \ |\n\n\n\n\n现在我们有了整行内容。我们为什么需要它呢？一个很好的答案是：“因为我们想做一些 `>>` 无法实现的事情。”通常，答案很糟糕：“因为用户输入了整行内容。”如果这就是你能想到的最好的办法，那就坚持使用\
  \ `>>` 吧，因为一旦输入了这一行，你通常需要以某种方式对其进行解析。\n\n### 9.10.4 字符 I/O\n\n**CC**\n\n通常，我们按照格式约定读取整数、浮点数、单词等。然而，我们可以——而且有时必须——降低一个抽象层级来读取单个字符。这虽然工作量更大，但当我们读取单个字符时，对所处的操作具有完全的控制权。考虑表达式的词法分析（§5.8.2）。在那里，我们希望将\
  \ `1+4*x<=y/z*5` 分为十一个标记（tokens）：\n\n```\n1 + 4 * x < = y/z * 5\n```\n\n我们可以使用 `>>`\
  \ 来读取数字，但尝试将标识符作为字符串读取会导致 `x<=y` 被读取为一个字符串（因为 `<` 和 `=` 不是空白字符），而 `z*` 被读取为一个字符串（因为\
  \ `*` 也不是空白字符）。相反，我们可以写成：\n\n点击此处查看代码图像\n\n```\nfor (char ch; cin.get(ch); ) {\n\
  \         if (isspace(ch)) {\n                  // 什么都不做；即跳过空白字符（例如空格或制表符）\n   \
  \      }\n         else if (isdigit(ch)) {\n                  // .. 读取一个数字 ...\n\
  \         }\n         else if (isalpha(ch)) {\n                  // ... 读取一个标识符\
  \ ...\n         }\n         else {\n                  // ... 处理运算符 ...\n       \
  \  }\n}\n```\n\n`istream::get()` 函数将单个字符读入其参数中。它并不会跳过空白字符。与 `>>` 一样，`get()` 返回其\
  \ `istream` 的引用，以便我们可以测试它的状态。\n\n当我们读取单个字符时，通常希望对它们进行分类：这个字符是数字吗？这个字符是大写字母吗？等等。有一组标准库函数用于此类操作：\n\
  \n| **字符分类** |\n| --- |\n| `isspace(c)` | `c` 是空白字符（` \"`、`'\\t’`、`'\\n’` 等）吗？ |\n\
  | `isalpha(c)` | `c` 是字母（`’a’`..`’z’`、`’A’`..`’Z’`）吗（注意：不是 `’_’）？ |\n| `isdigit(c)`\
  \ | `c` 是十进制数字（`’0’`..`’9’）吗？ |\n| `isxdigit(c)` | `c` 是十六进制数字（十进制数字或 `’a’`..`’f’`\
  \ 或 `’A’`..`’F’`）吗？ |\n| `isupper(c)` | `c` 是大写字母吗？ |\n| `islower(c)` | `c` 是小写字母吗？\
  \ |\n| `isalnum(c)` | `c` 是字母或十进制数字吗？ |\n| `iscntrl(c)` | `c` 是控制字符吗（ASCII 0..31\
  \ 和 127）？ |\n| `ispunct(c)` | `c` 不是字母、数字、空白字符或控制字符吗？ |\n| `isprint(c)` | `c` 是可打印的吗（ASCII\
  \ ”..’˜’）？ |\n| `isgraph(c)` | `isalpha(c)` 或 `isdigit(c)` 或 `ispunct(c)` 为真吗（注意：不是空格）？\
  \ |\n\n注意，这些分类可以使用“或”运算符 (`||`) 组合起来。例如，`isalnum(c)` 意味着 `isalpha(c)||isdigit(c)`；也就是说，“c\
  \ 是字母或数字吗？”此外，标准库提供了两个实用的函数来忽略大小写：\n\n| **字符大小** |\n| --- |\n| `x=toupper(c)` |\
  \ `x` 变为 `c` 的大写等价形式 |\n| `x=tolower(c)` | `x` 变为 `c` 的小写等价形式 |\n\n当你想要忽略大小写时，这些函数非常有用。例如，在来自\
  \ `Right`、`right` 和 `rigHT` 的输入中，它们可能意思相同（`rigHT` 最可能是不小心按了 Caps Lock 的结果）。在对这些字符串中的每个字符应用\
  \ `tolower()` 之后，我们得到的每个字符串都是 `right`。我们可以对任意的 `string` 这样做：\n\n点击此处查看代码图像\n\n```\n\
  void tolower(string& s)              // 将 s 转换为小写\n         for (char& x : s)\n\
  \                  x = tolower(x);\n}\n```\n**AA** 我们使用引用传递（7.4.5）来实际修改 `string`。如果我们想保留旧字符串，可以写一个函数来创建副本。优先使用\
  \ `tolower()` 而不是 `toupper()`，因为这在某些自然语言（如德语）中效果更好，因为那里并不是每个字符都有大写等价形式。\n\n在字符串或输入流中查看单个字符最常见的原因是为了分离项目；请参见\
  \ 20.2。\n\n### 9.10.5 扩展 I/O\n\n现在我们有了整行内容。我们为什么需要它呢？一个很好的答案是：“因为我们想做一些 `>>` 无法实现的事情。”通常，答案很糟糕：“因为用户输入了整行内容。”如果这就是你能想到的最好的办法，那就坚持使用\
  \ `>>` 吧，因为一旦输入了这一行，你通常需要以某种方式对其进行解析。字符串或输入流中查看单个字符最常见的原因是为了分离项目；请参见 20.2。\n\n扩展\
  \ I/O\n\n`<<` 已经包含了许多类型（9.7）。幸运的是，标准库允许 `<<` 处理自定义类型（9.6）。除了数字、字符串外，`<<` 还可以处理（20.4）`duration`、`time_point`、`year`、`month`、`weekday`、`day_month`（`20.5`）以及\
  \ `zoned_time`（`20.6`）。甚至 `system_clock`（`20.7`）和 `local_time`（`20.8`）也可以被处理。`years`（`20.9`）和\
  \ `months`（`20.10`）也是如此，weeks（`20.11`）和 `days`（`20.12`）、`hours`（`20.13`）、`minutes`（`20.14`）和\
  \ `seconds`（`20.15`）也是。`nanoseconds`（`20.16`）和 `microseconds`（`20.17`）同样如此，`milliseconds`（`20.18`）和\
  \ `ticks`（`20.19`）也是。甚至 `ratio`（`20.20`）和 `duration`（`20.21`）都是可以处理的。\n\n### 9.10.6\
  \ format()\n\n`format()` 提供了一种 `printf()` 格式化机制。`format()` 产生一个格式化的 `string`。它接受一个\
  \ `format_string` 和任意数量的参数。`format_arg_list`（`20.22`）也可以用于此目的。\n\n`format()` 最常用的用法是输出其结果：\n\
  \n点击此处查看代码图像\n\n```\nstring s = format(\"Hello, {}!\\n\", val);\n```\n\n`format()`\
  \ 允许使用复杂的格式化字符串（`20.23`）来控制输出的格式。例如，你可以对数字进行对齐（`20.24`）、设置宽度（`20.25`）和填充字符（`20.26`）。此外，你还可以设置精度（`20.27`）以及指定进制格式（`20.28`\
  \  world）。\n\n### 9.10.7 扩展 I/O\n\n`<<` 已经包含了许多类型（`9.7`）。幸运的是，标准库允许 `<<` 处理自定义类型（`9.6）。除了数字、字符串外，`<<`\
  \ 还可以处理（`20.4`）`duration`、`time_point`、`year`、`month`、`weekday`、`day_month`（`20.5`）以及\
  \ `zoned_time`（`20.6`）。\n\n```cpp\nfriend ostream& operator<<(ostream& os, const\
  \ Person& p) {\n    os << \"Person name: \" << p.name << \", age: \" << p.age;\n\
  \    return os;\n}\n```\n\n通过重载 `operator<<` 运算符，你可以让自定义类型直接与 `cout` 输出。\n\n```cpp\n\
  Person p{\"Alice\", 30};\ncout << p; // 输出：Person name: Alice, age: 30\n```\n\n\
  这种方法比手动调用一个成员函数更简洁，更符合 C++ 的习惯用法。\n[/content]\n\n抱歉，由于你提供的待翻译文本存在大量的重复和逻辑混乱（例如 9.10.4\
