  \n\n选择合适的数据结构来存储应用程序数据是简化代码和最大化性能的关键。关于这一点已经有很多厚书了。在这里，我们关注几种常用的良好选择容器类型：`map`、`unordered_map`、`set`、`array`、`string`，当然还有\
  \ `vector`。这些实际上相对简单，因此紧凑且快速。广泛的参数化使得它们极其灵活。它们的设计和实现技术为开发更特定的容器提供了极有用的模式。\n\n# 21\
  \ 算法\n\n*理论上，实践是简单的。*\n> *– Trygve Reenskaug*\n\n本章完成了我们对 STL 核心思想的介绍以及对其所提供功能的调研。在这里，我们关注算法。我们的首要目标是介绍十个左右最实用的算法，这将为你节省几天甚至几个月的工作。每个算法都配有用法示例以及它支持的编程技术示例。我们的第二个目标是，当你需要比标准库和其他可用库所提供的更多功能时，提供足够的工具来编写自己的——优雅且高效的算法。\n\
  \n### 21.1 标准库算法\n\n标准库提供了约 125 种算法。它们对某些人来说都是有用的；我们专注于某些对许多人经常有用的，以及某些对某些人偶尔非常有用的算法：\n\
  \n| 选定的标准算法 | |\n| :--- | --- |\n| `p=find(b,e,v)` | `p` 指向 `[b:e)` 中 `v` 第一次出现的位置。\
  \ |\n| `p=find_if(b,e,p)` | `p` 指向 `[b:e)` 中第一个满足 `p(x)` 为 `true` 的元素 `x`。 |\n|\
  \ `x=count(b,e,v)` | `x` 是 `v` 在 `[b:e)` 中出现的次数。 |\n| `x=count_if(b,e,p)` | `x`\
  \ 是 `[b:e)` 中满足 `p(x)` 为 `true` 的元素个数。 |\n| `sort(b,e)` | 使用 `<` 排序 `[b:e)`。 |\n\
  | `sort(b,e,p)` | 使用 `p` 排序 `[b:e)`。 |\n| `x=is_sorted(b,e)` | 如果 `[b:e)` 是排序的则\
  \ `x` 为 `true`。 |\n| `b2=copy(b,e,b2)` | 将 `[b:e)` 拷贝到 `[b2:b2+(e–b))`；`b2` 之后最好有足够的元素容纳\
  \ `[b:e)`。 |\n| `b2=move(b,e,b2)` | 将 `[b:e)` 移动到 `[b2:b2+(e–b))`；`b2` 之后最好有足够的元素容纳\
  \ `[b:e)`。 |\n| `b2=uninitialized_copy(b,e,b2)` | 将 `[b:e)` 拷贝到未初始化的 `[b2:b2+(e–b))`；`b2`\
  \ 之后最好有足够的元素容纳 `[b:e)`。 |\n| `b2=unique_copy(b,e,b2)` | 将 `[b:e)` 拷贝到 `[b2:b2+(e–b))`；`b2`\
  \ 之后最好有足够的元素容纳 `[b:e)`。 |\n| `e2=merge(b,e,e2,r)` | 将两个排序序列 `b` 和 `e2` 合并到 `r`。\
  \ |\n| `[p,q]=equal_range(b,e)` | `[p,q)` 是等于 `v` 的元素范围。 |\n| `x=accumulate(b,e,i)`\
  \ | `x` 是 `i` 的和。 |\n| `r=max(x,y)` | `r` 指向 `x` 和 `y` 中较大的者。 |\n| `p=max_element(b,e)`\
  \ | `p` 指向 `[b:e)` 中最大的元素。 |\n| `iota(b,e,i)` | ...（内容继续） |\n\n### 21.1.1 最简单的算法：find()\n\
  \n可以说，最简单的算法是 `find()`。它在序列中查找具有给定值的元素：\n\n```cpp\ntemplate<input_iterator In, equality_comparable<In::value_type>\
  \ T>\nIn find(In first, In last, const T& val)\n{\n    while (first != last && *first\
  \ != val)\n        ++first;\n    return first;\n}\n```\n\n让我们来看这个 `find()` 的定义。与你在查看\
  \ `std::find` 时看到的相比，它稍微简化，例如，它没有处理没有 `value_type` 成员的原始指针（如果你真的好奇，可以查一下*迭代器特性/iterator\
  \ traits*）。当然，你可以使用它。\n\n首先，`find()` 作用于由一对迭代器定义的序列。我们在 `[first:last)` 中查找值 `val`。`find()`\
  \ 返回的结果是一个迭代器。该结果要么指向序列中具有值 `val` 的第一个元素，要么指向 `last`。返回指向序列最后一个元素之后的元素的迭代器是 STL\
  \ 报告“未找到”的最常用方法。因此，我们可以这样使用 `find()`：\n\n```cpp\nvoid f(vector<int>& v, int x)\n\
  {\n    auto p = find(v.begin(), v.end(), x);\n    if (p != v.end()) {\n        //\
  \ ... 在 v 中找到了 x；我们可以使用 *p ...\n    }\n    else {\n        // ... v 中没有找到 x；不要解引用\
  \ p ...\n    }\n    // ...\n}\n```\n\n在这里，像通常一样，序列由容器（一个 STL **vector**）的所有元素组成。我们通过将返回的迭代器与序列边界比较来检查是否找到了值。返回值的类型是作为参数传递的迭代器类型。\n\
  \n\n\n\n为了避免为 `find()` 返回的类型命名，我们使用了 `auto` (§2.10)。`auto` 类型说明符在泛型代码中特别有用，例如在 `find()`\
  \ 中，为实际类型命名可能非常繁琐（在这里是 `vector<int>::iterator`）。\n\n我们现在已经知道了如何使用 `find()`，因此也知道了如何使用许多遵循与\
  \ `find()` 相同约定的其他算法。在继续学习更多用法和更多算法之前，让我们仔细观察一下那个定义：\n\n点击此处查看代码图像\n\n```\ntemplate<input_iterator\
  \ In, equality_comparable<In::value_type> T>\nIn find(In first, In last, const T&\
  \ val)         // 在 first,last) 中查找第一个等于 val 的元素\n{\n        while (first!=last\
  \ && *first!=val)\n                ++first;\n        return first;\n}\n```\n\n你一眼能看出那个循环显而易见吗？我们并没有。它实际上非常简洁、高效，并且是基本算法的直接表示。然而，在看到几个示例之前，它并不是显而易见的。让我们用“普通人写法”来写它，看看那个版本对比如何：\n\
  \n[点击此处查看代码图像\n\n```\ntemplate<input_iterator In, equality_comparable<In::value_type>\
  \ T>\nIn find(In first, In last, const T& val)         // 在 first,last) 中查找第一个等于\
  \ val 的元素\n{\n        for (In p = first; p!=last; ++p)\n                if (*p==val)\n\
  \                        return p;\n        return last;\n}\n```\n\n这两个定义在逻辑上是等价的，非常优秀的编译器会为它们生成相同的代码。然而，在现实中，许多编译器并不足够能够消除那个额外的变量（`p`）并重新排列代码以便所有的测试都在一个地方完成。为什么要担心并解释呢？部分是因为第一种（也是首选的）`find()`\
  \ 版本已经变得非常流行，你必须理解它才能读懂他人的代码；部分是因为性能对于处理大量数据的小型、频繁使用的函数至关重要。\n\n### 尝试一下\n\n你确定这两个定义在逻辑上是等价的吗？你如何确定？尝试构造一个证明它们等价论据。完成之后，在一些数据上尝试两者。著名的计算机科学家（Don\
  \ Knuth）曾说过：“我只证明了算法是正确的，还没有测试过它。”即使是数学证明也可能包含错误。为了有信心，你既需要推理也测试。\n\n#### 21.1.2\
  \ 泛型用法\n\n**CC**\n\n`find()` 算法是泛型的。这意味着它可以用于不同的数据类型。事实上，它在两个方面都是泛型的；它可以用于：\n\n\
  *   任何 STL 风格的序列（可以读取）\n*   任何元素类型（可以与迭代器的值类型进行比较）\n\n这里是一些示例（如果你感到困惑，请参阅 [§19.3\
  \ 中的图表）：\n\n点击此处查看代码图像\n\n```\nvoid f(vector<int>& v, int x)             // 适用于\
  \ int 向量\n{\n        vector<int>::iterator p = find(v.begin(),v.end(),x);\n\n  \
  \      if (p!=v.end()) {\n               // ...我们找到了 x ...\n        }\n        //\
  \ ...\n}\n```\n\n**CC**\n\n在这里，`find()` 使用的迭代操作是 `vector<int>::iterator` 的操作；也就是说，`++`（在\
  \ `++first` 中）只是将指针移动到内存中的下一个位置（`vector` 的下一个元素存储的地方），而 `*`（在 `*first` 中）对该指针解引用。迭代器比较（在\
  \ `first!=last` 中）是指针比较，值比较（在 `*first!=val` 中）仅仅是比较两个整数。\n\n让我们尝试一下 `list`：\n\n\
  点击此处查看代码图像\n\n```\nvoid f(list<string>& v, string x)         // 适用于 string 列表\n\
  {\n        list<string>::iterator p = find(v.begin(),v.end(),x);\n        if (p!=v.end())\
  \ {\n                // ... 我们找到了 x ...\n        }\n        // ...\n}\n```\n\n**CC**\n\
  \n在这里，`find()` 使用的迭代操作是 `list<string>::iterator` 的操作。操作符具有所需的含义，因此逻辑与上面的 `vector<int>`\
  \ 相同。尽管如此，实现非常不同；也就是说，`++`（在 `++first` 中）只是通过元素中 `Link` 部分的指针找到 `list` 下一个元素存储的位置，而\
  \ `*`（在 `*first` 中）找到 `Link` 的值部分。迭代器比较（在 `first!=last` 中）是 `Link*` 指针的比较，值比较（在\
  \ `*first!=val` 中）使用 `string` 的 `!=` 运算符比较 `string`。\n\n因此，`find()` 极其灵活：只要我们遵循迭代器的简单规则，就可以使用\
  \ `find()` 来查找元素。例如，我们可以使用 `find()` 来查找 §19.3 中定义的字符：\n\n点击此处查看代码图像\n\n```\nvoid\
  \ f(vector<int>& v, int x)             // 适用于 int 向量\n{\n        vector<int>::iterator\
  \ p = find(v.begin(),v.end(),x);\n\n        if (p!=v.end()) {\n               //\
  \ ...我们找到了 x ...\n        }\n        // ...\n}\n```\n\n`find()` 最常用的用法是寻找特定的值。更多时候，我们对寻找符合某些标准的值感兴趣。那么，当我们能够定义自己的搜索时，就可以获得一个更有用的\
  \ `find` 操作。\n\n#### 21.1.3 通用化搜索：find_if()\n\n我们实际上并没有在寻找一个特定的值\n```auto p = find(v.begin(),v.end(),\
  \ x);\n        if (p!=v.end()) {\n                // ...我们找到了 x ...\n        }\n\
  \        // ...\n}\n```\n\n必须写 `ranges::` 是非常遗憾的。原因在于要同时拥有旧式的无约束算法版本（为了兼容）和适当约束的版本。根据用户提供的标准进行搜索的标准算法是\
  \ `find_if()`：\n\n点击此处查看代码图像\n\n```\ntemplate<input_iterator In, predicate<In::value_type>\
  \ Pred>\nIn find_if(In first, In last, Pred pred)\n{\n        while (first!=last\
  \ && !pred(*first))\n                ++first;\n        return first;\n}\n```\n\n\
  显然（当你对比源代码时），它和 `find()` 相似，只是使用了 `!pred(*first)` 而不是 `*first!=val`；也就是说，它在谓词成功时停止，而不是在元素等于值时停止。\n\
  \n**CC**\n\n谓词是一个返回 `true` 或 `false` 的函数。显然，`find_if()` 需要一个接受一个参数的谓词以便执行 `pred(*first)`。我们可以轻松地编写一个检查值属性的谓词，例如：“字符串是否包含字母\
  \ **x**？”“值是否大于 42？”“数字是奇数吗？”例如，我们可以像这样在 `int` 向量中找到第一个奇数：\n\n点击此处查看代码图像\n\n```\n\
  bool odd(int x) { return x%2; }         // % 是取模运算符\n\nvoid f(vector<int>& v)\n\
  {\n        auto p = find_if(v.begin(), v.end(), odd);\n        if (p!=v.end()) {\n\
  \                // ...我们找到了一个奇数 ...\n        }\n        // ...\n}\n```\n\n\n\n\n\
  对于 `find_if()` 的调用，`find_if()` 会对每个元素调用 `odd()`，直到找到第一个奇值。请注意，当你将函数作为参数传递时，不需要在它的函数名后添加\
  \ `()`，因为这样做会调用该函数。\n\n同样地，我们可以通过这种方式找到列表中第一个大于 42 的元素：\n\n点击此此处查看代码图片\n\n```\n\
  bool larger_than_42(double x) { return x>42; }\n\nvoid f(list<double>& v)\n{\n \
  \       auto p = find_if(v.begin(), v.end(), larger_than_42);\n        if (p!=v.end())\
  \ {\n                // ... 我们找到了一个大于 42 的值 ...\n        }\n        // ...\n}\n\
  ```\n\n不过，上一个例子并不令人满意。如果我们接下来想找到一个大于 41 的元素怎么办？我们必须写一个新函数。找一个大于 19 的元素？再写一个函数。一定有更好的方法！\n\
  \n如果我们想与任意值 `v` 进行比较，我们需要某种方法让 `v` 成为 `find_if()` 谓词的隐式参数。我们可以尝试（选择 `v_val` 作为名称，它不太与其他名称冲突）：\n\
  \n点击此此处查看代码图片\n\n```cpp\ndouble v_val;          // larger_than_v() 比较参数时的值\nbool\
  \ larger_than_v(double x) { return x>v_val; }\n\nvoid f(list<double>& v, int x)\n\
  {\n        v_val = 31;               // 为下次调用 larger_than_v 时将 v_val 设置为 31\n  \
  \      auto p = find_if(v.begin(), v.end(), larger_than_v);\n        if (p!=v.end())\
  \ {\n                // ... 我们找到了一个大于 31 的值 ...\n        }\n\n        v_val = x;\
  \         // 为下次调用 larger_than_v 时将 v_val 设置为 x\n        auto q = find_if(v.begin(),\
  \ v.end(), larger_than_v);\n        if (q!=v.end()) {\n                // ... 我们找到了一个大于\
  \ x 的值 ...\n        }\n        // ...\n}\n```\n\n**XX**\n\n真讨厌！我们深信写这种代码的人最终会自得其报，但我们同情他们的用户以及任何维护他们代码的人。再次强调：一定有更好的方法！而且，确实有。\n\
  \n## 尝试一下\n\n为什么我们对这种 `v` 的用法感到如此反感？至少列出三种可能导致晦涩错误的方法。列出三个你特别不想发现此类代码的应用场景。\n\n\
  ### 21.2 函数对象\n\n所以，我们想向 `find_if()` 传递一个谓词，并且我们希望该谓词将元素与我们指定的某种参数值进行比较。具体来说，我们想写类似这样的代码：\n\
  \n点击此此处查看代码图片\n\n```cpp\nvoid f(list<double>& v, int x)\n{\n        auto p = find_if(v.begin(),\
  \ v.end(), Larger_than{31});\n        if (p!=v.end()) {\n                // ...\
  \ 我们找到了一个大于 31 的值 ..\n        }\n\n        auto q = find_if(v.begin(), v.end(),\
  \ Larger_than{x});\n        if (q!=v.end()) {\n                // ... 我们找到了一个大于\
  \ x 的值 ...\n        }\n        // ...\n}\n```\n\n显然，`Larger_than` 必须是某种东西：\n\n*\
  \   可以作为谓词被调用，例如 `pred(*first)`\n*   可以持有一个值（如 `31` 或 `x`），以便在调用时使用\n\n**CC**\n\n\
  为了实现这一点，我们需要一个“函数对象”；即一个可以像函数一样运行的对象。我们需要一个对象是因为对象可以存储数据，例如用于比较的值。例如：\n\n点击此此处查看代码图片\n\
  \n```cpp\nclass Larger_than {\n        int v;\npublic:\n        Larger_than(int\
  \ vv) : v{vv} { }                          // 存储参数\n        bool operator()(int\
  \ x) const { return x>v; }      // 比较\n};\n```\n\n有趣的是，这个定义使得上面的例子按照预期工作。现在我们只需要弄清楚它为什么起作用。当我们说\
  \ `Larger_than{31}` 时，我们（显然）创建了一个 `Larger_than` 类的对象，其数据成员 `v` 持有 `31`。例如：\n\n点击此此处查看代码图片\n\
  \n```cpp\nfind_if(v.begin(),v.end(),Larger_than{31})\n```\n\n在这里，我们将该对象作为参数 `pred`\
  \ 传递给 `find_if()`。对于 `v` 的每个元素，`find_if()` 都会进行一次调用：\n\n```\npred(*first)\n```\n\
  \n这触发了用于我们函数对象的调用运算符，即 `operator()`，并使用了参数 `first`。结果是元素的元素值 `first` 与 `31` 的比较。\n\
  \n**CC**\n\n我们在这里看到函数调用可以被看作一个运算符，即 `()` 运算符。“()` 运算符也被称为*函数调用运算符*和*应用运算符*。因此 `pred(*first)`\
  \ 中的 `()` 是由 `Larger_than::operator()` 赋予含义的，就像 `v[i]` 中的下标是由 `vector::operator[]`\
  \ 赋予含义一样。\n\n#### 21.2.1 函数对象的抽象\n\n**CC**\n\n我们在这里拥有一种机制，允许“函数”携带它需要的数据。显然，函数对象为我们提供了非常通用、强大且方便的机制。考虑一种更通用的函数对象概念：\n\
  \n点击此此处查看代码图片\n\n```cpp\nclass F {                  // 函数对象的示例\n        Ss;    \
  \              // 状态\npublic:\n        F(const S& ss) :s(ss) { /* 建立状态*/\n     \
  \   T operator() (const S& ss) const\n        {\n               // 对 s 进行某些操作\n\
  \               // 返回类型为 T 的值（T 通常为 void, bool 或 S）\n        }\n\n        const\
  \ S& state() const { return s; } // 显示状态\n        void reset(const S& ss) { s =\
  \ ss; }            // 重置状态\n};\n```\n\n`F` 类对象通过其成员 `s` 持有数据。如果需要，函数对象可以有很多数据成员。说事物持有数据的另一种方式是它“有状态”。当我们创建一个\
  \ `F` 时，可以初始化该状态。每当我们需要，就可以读取该状态。对于 `F`，我们提供了一个读取状态的操作 `state()` 和另一个写入状态的操作 `reset()`。然而，当我们设计函数对象时，可以提供任何认为合适的访问状态的方法。当然，我们可以使用标准的函数调用符号直接或间接地调用它。我们定义\
  \ `F` 在调用时接受单个参数，但我们可以定义带有任意数量参数的函数对象。\n\n**CC**\n\n函数对象是 STL 参数化的主要方法。我们使用函数对象来指定搜索的目标（§21.2）、定义排序标准（§21.2.2）、在数值算法中指定算术操作（§21.3）、定义值的相等含义（§21.1.3）以及更多。函数对象的使用是灵活性和通用性的主要来源。\n\
  \n\n\n\n函数对象通常非常高效。特别是，将一个较小的函数对象按值传递给模板函数，通常可以获得最佳性能。其原理很简单，但对于那些习惯于将函数作为参数的人来说却很惊讶：通常，传递函数对象产生的代码比传递函数要小得多且运行更快！这仅在对象很小（例如只有零、一个或两个字长的数据）或通过引用传递，并且函数调用操作符较小（例如使用\
  \ `<` 进行的简单比较）并被定义为内联（例如，其定义位于类内部）时才成立。本章中的大多数示例都遵循这一模式。\n\n小型且简单的函数对象高性能的根本原因是，它们保留了足够的类型信息，使编译器能够生成最优代码。即使是具有不复杂优化器的旧版编译器，也能为\
  \ `Larger_than` 中的比较生成一条简单的“大于”机器指令，而不是调用函数。调用函数所需的时间通常比执行简单的比较操作要长 10 到 50 倍。此外，函数调用的代码比简单比较的代码大几倍。\n\
  \n### 21.2.2 类成员的谓词\n\n正如我们所见，标准算法可以很好地处理基本类型元素的序列，如 `int` 和 `double`。然而，在许多领域，类值的容器更为常见。考虑一个在许多应用中关键的示例：根据多个标准对记录进行排序：\n\
  \n点击此处查看代码图片\n\n```\nstruct Record {\n        string name;              // 为了方便使用的字符串\n\
  \        char addr[24];            // 为了匹配数据库布局的旧样式\n        // ...\n};\n\nvector<Record>\
  \ vr;\n```\n\n有时我们想按名称对 `vr` 排序，有时想按地址排序。除非我们能够优雅且高效地完成这两者，否则我们的技术实际意义就非常有限。幸运的是，这样做很容易。我们可以写出：\n\
  \n点击此处查看代码图片\n\n```\n// ...\nranges::sort(vr, Cmp_by_name{});             // 按名称排序\n\
  // ...\nranges::sort(vr, Cmp_by_addr{});              // 按地址排序\n// ...\n```\n\n\
  #### CC\n\n`Cmp_by_name` 是一个函数对象，通过比较 `name` 成员来比较两个 `Record`。`Cmp_by_addr` 是一个函数对象，通过比较\
  \ `addr` 成员来比较两个 `Record`。为了允许用户指定此类比较标准，标准库 `sort` 算法接受一个可选的第三参数来指定排序标准。`Cmp_by_name{}`\
  \ 创建了一个 `Cmp_by_name` 用于 `sort()` 比较 `Record`。这看起来很好——意味着我们不在意维护这样的代码。现在我们需要做的就是定义\
  \ `Cmp_by_name` 和 `Cmp_by_addr`：\n\n点击此处查看代码图片\n\n```\n// 对 Record 对象的不同比较：\n\n\
  struct Cmp_by_name {\n        bool operator()(const Record& a, const Record& b)\
  \ const\n                { return a.name < b.name; }\n};\n\nstruct Cmp_by_addr {\n\
  \        bool operator()(const Record& a, const Record& b) const\n             \
  \   { return strncmp(a.addr, b.addr, 24) < 0; }        // 咦？\n};\n```\n\n`Cmp_by_name`\
  \ 类显而易见。函数调用运算符 `operator()` 只是使用标准 `string` 的 `<` 运算符比较 `name` 字符串。然而，`Cmp_by_addr`\
  \ 中的比较非常拙劣。这是因为我们选择了一种拙劣的地址表示：一个 24 字符的数组（不是零终止的）。我们选择它部分是为了展示如何使用函数对象隐藏拙劣且易出错的代码，部分是因为这种特定的表示曾被作为一个挑战给我：“一个\
  \ STL 无法处理的拙劣且重要的现实问题。”嗯，STL 可以处理。比较函数使用了 C（以及 C++）库函数 `strncmp()`，它比较固定长度的字符数组，如果第二个“字符串”在字典序上晚于第一个，则返回负数。如果你需要这种晦涩的比较，可以查一下。\n\
  \n### 21.2.3 Lambda 表达式\n\n在程序的某处定义函数对象（或函数）然后在另一个地方使用它是很乏味的。特别是如果我们想要执行的操作非常容易指定、易于理解且以后再也不会需要，那么就会很麻烦。在这种情况下，我们可以使用\
  \ lambda 表达式 (§13.3.3)。关于 lambda 表达式最好的思考方式是将其视为定义函数对象（一个带有运算符 `()` 的类）并立即创建其实例的简记法。例如，我们可以这样写：点击此处查看代码图片\n\
  \n```\n// ...\nranges::sort(vr, [](const Record& a, const Record& b) { return a.name\
  \ < b.name; });\n// ...\nranges::sort(vr, [](const Record& a, const Record& b) {\
  \ return strncmp(a.addr, b.addr, 24) < 0; });\n```\n\n\n\n\n| `iota(b,e,v)` | 用范围\
  \ `[`b`:`e`]` 填充值 `v`、`v+1`、`v+2` 等；这些值是使用前缀 `++` 的计算机。 |\n| `x=midpoint(a,b)` |\
  \ 计算 `a` 和 `b` 之间的中间值；约为 `(a+b)/2` 且不会溢出 |\n| `x=gcd(a,b)` | `x` 是 `a` 和 `b` 的最大公约数\
  \ |\n| `x=lcm(a,b)` | `x` 是 `a` 和 `b` 的最小公倍数 |\n\n我们在这里描述前两个，如果你觉得需要，可以留给你探索其余部分。还有\
  \ `inclusive_scan()`、`exclusive_scan()`、`transform_inclusive_scan()` 和 `transform_exclusive_scan()`，它们超出了本书的范围。\n\
  \n### 21.3.1 Accumulate\n\n最简单且最实用的数值算法是 `accumulate()`。在最简单的形式下，它对一个序列的值进行累加：\n\
  \n点击此处查看代码图片\n\n```\ntemplate<input_iterator In, Number T>\nT accumulate(In first,\
  \ In last, T init)\n{\n        while (first!=last) {\n                init = init\
  \ + *first;\n                ++first;\n        }\n        return init;\n}\n```\n\
  \n给定一个初始值 `init`，它简单地将 `[`first`:`last`]` 序列中的每个值加到上面并返回和。用于计算和的变量 `init` 通常被称为*累加器*（accumulator）。例如：\n\
  \n点击此处查看代码图片\n\n```\nint a[] = { 1, 2, 3, 4, 5 };\ncout << accumulate(a, a+sizeof(a)/sizeof(int),\
  \ 0);\n```\n\n这将打印 `15`，即 0+1+2+3+4+5（`0` 是初始值）。显然，`accumulate()` 可以用于各种序列：\n\n\
  点击此处查看代码图片\n\n```\nvoid f(vector<double>& v, int* p, int n)\n{\n        double sum\
  \ = accumulate(v.begin(), v.end(), 0.0);\n        int sum2 = accumulate(p,p+n,0);\n\
  }\n```\n\n出于某些神秘的原因，`ranges` 版本的数值算法没有进入 C++20，但它们并不难定义。例如：\n\n点击此处查看代码图片\n\n```\n\
  template<input_range R, output_iterator Out, typename T>\nT accumulate(R r, Out\
  \ oo, T init)\n{\n        return accumulate(begin(r),end(r),oo,init);\n}\n```\n\n\
  结果（和）的类型是 `accumulate()` 用来保存累加器的变量的类型。这提供了可能重要的灵活性。例如：\n\n点击此处查看代码图片\n\n```\nvoid\
  \ g(vector<int>& v)\n{\n        int s1 = accumulate(v, 0);                     \
  \  // 累加 int\n        long sl = accumulate(v, long{0});           // 将 int 累加 long\n\
  \        double s2 = accumulate(v, 0.0);             // 将 int 累加 double\n}\n```\n\
  \n在某些计算机上，`long` 的有效数字比 `int` 多。`double` 可以比 `int` 表示更大（或更小）的数字，但精度可能较低。\n\n####\
  \ AA\n\n使用结果所在的变量作为初始化值是指定累加器类型的常用惯用法：\n\n点击此处查看代码图片\n\n```\nvoid f(vector<double>&\
  \ v)\n{\n        double s1 = 0;\n        s1 = accumulate(v, s1);\n        int s2\
  \ = accumulate(v, s2);            // 哎\n        float s3 = 0;\n        accumulate(v,\
  \ s3);                        // 哎\n}\n```\n\n#### XX\n\n记得初始化累加器，并将 `accumulate()`\
  \ 的结果赋值给变量。在这个例子中，`s2` 在自身初始化之前被用作初始化值；因此结果是未定义的。我们把 `s3` 传递给 `accumulate()`（值传递；参见\
  \ §7.4.3），但结果从未赋值给任何地方；那样编译只是浪费时间。\n\n### 21.3.2 Generalizing accumulate()\n\n所以，基础的三参数\
  \ `accumulate()` 执行加法。然而，还有许多其他有用的操作，例如乘法和减法，我们可能想在序列上执行这些操作，因此 STL 提供了另一个四参数版本的\
  \ `accumulate()`，我们可以指定要使用的操作：\n\n点击此处查看代码图片\n\n\n\n\n\n这把内积的概念推广到了任何类型元素的任何序列上。作为一个例子，考虑第\
  \ §20.2.3 节 中的股票指数示例。它的工作原理是选取一组公司，并为每家公司分配一个“权重”。我们可以将通过 `dow_price` 和 `dow_weight`\
  \ 的向量版本计算 DJII 的循环替换为单次的 `inner_product` 调用：\n\n点击此处查看代码图片\n\n```\ndouble dji_index\
  \ = inner_product(    // 相乘 (weight,value) 元对并相加\n                             \
  \            dow_price.begin(), dow_price.end(),\n                             \
  \            dow_weight.begin(),\n                                         0.0\n\
  \                                 );\n\ncout << \"DJI value \" << dji_index << '\\\
  n';\n```\n\n## XX\n\n注意 `inner_product()` 接收两个序列。然而，它只接受三个参数：它只提到了第二个序列的起始位置。第二个序列的元素至少要与第一个序列一样多。如果不是，我们就会遇到运行时错误。对于\
  \ `inner_product()` 来说，第二个序列的元素比第一个多是可以允许的；那些“多余元素”将不会被使用。\n\n### 尝试一下\n\n定义一个接收两个输入范围的\
  \ `inner_product()`。然后用你的版本尝试上面的示例。\n\n### 21.3.4 推广 inner_product()\n\n`inner_product()`\
  \ 可以像 `accumulate()` 那样被推广。尽管如此，对于 `inner_product()` 需要两个额外的参数：一个用于将累加器与新值合并（与 `accumulate()`\
  \ 完全相同），另一个用于合并元素值对：\n\n点击此处查看代码图片\n\n```\ntemplate<input_iterator In, input_iterator\
  \ In2, typename T, typename BinOp, typename BinOp2>\n        requires invocable<BinOp,T,In::value_type>\n\
  \                && invocable<BinOp2,T,In2::value_type>\nT inner_product(In first,\
  \ In last, In2 first2, T init, BinOp op, BinOp2 op2)\n{\n        while(first!=last)\
  \ {\n                init = op(init, op2(*first, *first2));\n                ++first;\n\
  \                ++first2;\n        }\n        return init;\n}\n```\n\n我们甚至可以直接使用\
  \ `dow_price` 和 `dow_weight` 的 map 版本进行一些计算。特别是，我们可以使用标准库算法 `inner_product()` (§21.3.3)\
  \ 来计算索引。我们必须从各自的 map 中提取股票值和权重并将它们相乘。我们可以轻松地编写一个函数来处理任意两个 `map<string,double>`：\n\
  \n点击此处查看代码图片\n\n```\ndouble weighted_value(const pair<string,double>& a, const pair<string,double>&\
  \ b)\n        // 提取值并相乘\n{\n        return a.second * b.second;   // 使用 pair 的第二个成员\n\
  }\n```\n\n现在我们只需要将该函数插入到推广后的 `inner_product()` 中，就可以得到索引的值了：\n\n点击此处查看代码图片\n\n```\n\
  double dji_index = inner_product(\n                                dow_price.begin(),\
  \ dow_price.end(),       // 所有公司\n                                dow_weight.begin(),\
  \                                  // 它们的权重\n                                0.0,\
  \                                                             // 初始值\n         \
  \                       plus<double>(),                                        \
  \  // 相加（通常）\n                                weighted_value                   \
  \                      // 提取值和权重，然后相乘\n                                        );\n\
  ```\n\n范围版本的 `inner_product()`会让代码更加漂亮。\n\n### 21.4 复制\n\n在 §21.1.1 中，我们认为 `find()`\
  \ 是“最简单的实用算法”。自然地，这一点是可以引起争议的。许多简单算法都是用的——即使有些写起来轻而易举。但既然可以使用别人为你编写并调试好的代码（无论它多么简单），为什么要费力写新代码呢？在简单性和实用性方面，`copy()`\
  \ 与 `find()` 可不相上下。STL 提供了三个版本的 copy：\n\n| 复制操作 |\n| --- |\n| `b2=copy(b,e,b2)`\
  \ | 将 `[`b:`e`]` 复制到 `[`b2`:`b2+(e−b)`]`。 |\n| `b2=unique_copy(b,e,b2)` | 将 `[`b:`e`]`\
  \ 复制到 `[`b2`:`b2+(e−b)`)；抑制相邻的复制。 |\n| `b2=copy_if(b,e,b2,p)` | 将 `[`b:`e`]` 复制到\
  \ ``b2`:`b2+(e−b)`)，但仅复制满足谓词 `p` 的元素。 |\n\n#### 21.4.1 最简单的复制：copy()\n\n基础复制算法定义如下：\n\
  \n[点击此处查看代码图片\n\n```\ntemplate<input_iterator In, output_iterator Out>\nOut copy(In\
  \ first, In last, Out result)\n{\n        while(first!=last) {\n               \
  \ *result = *first;\n                ++first;\n                ++result;\n     \
  \   }\n}\n```\n\n给定一对迭代器，`copy()` 将一个序列复制到另一个序列。例如：\n\n点击此处查看代码图片\n\n```\ntemplate<input_iterator\
  \ In, output_iterator Out>\nvoid copy(In first, In last, Out result)\n{\n      \
  \  while(first!=last) {\n                *result = *first;\n                ++first;\n\
  \                ++result;\n        }\n}\n```\n\n注意 `copy()` 的输入序列类型可以与输出序列的类型不同。这是\
  \ STL 算法的一个非常有用的通用性：它们适用于各种序列，而不做不必要的假设。STL 算法是为了最大的通用性和最优性能而编写的；它们（默认情况下）不会进行范围检查或可能昂贵的测试。\n\
  \n#### 21.4.2 推广复制：copy\n\n`copy()` 算法无条件复制。`unique_copy()` 算法抑制相邻相邻元素。第三种复制算法仅复制谓词为真的元素：\n\
  \n点击此处查看代码图片\n\n```\ntemplate<input_iterator In, output_iterator Out, predicate<In::value_type>\
  \ Pred>\nOut copy_if(In first, In last, Out res, Pred p)\n{\n        while(first!=last)\
  \ {\n                if (p(*first)) {\n                       *res = *first;\n \
  \                      ++res;\n                }\n                ++first;\n   \
  \     }\n        return res;\n}\n```\n\n例如，使用范围版本的 `copy_if()`，我们可以这样复制序列中大于 6 的元素：\n\
  \n点击此处查看代码图片\n\n```\nvoid f(const vector<int>& v)            // 将大于 6 的元素复制到 v2\n\
  {\n        vector<int> v2(v.size());\n        ranges::copy_if(v, v2.begin(), [](int\
  \ x){ return x>6;});\n        // ...\n}\n```\n\n### 21.5 排序与搜索\n\n通常，我们希望数据是有序的。我们可以通过使用维护顺序的数据结构（如\
  \ `map` 和 `set`）或者通过排序来实现。STL 中常用且实用的排序操作是已经已经过几次的 `sort()`。默认情况下，`sort()` 使用 `<`\
  \ 作为排序准则，但我们也可以提供自己的准则：\n\n点击此处查看代码图片\n\n```\ntemplate<random_access_iterator Ran>\n\
  void sort(Ran first, Ran last);\n\ntemplate<random_access_iterator Ran, less_than_comparable<Ran::value_type>\
  \ Cmp>\nvoid sort(Ran first, Ran last, Cmp cmp);\n```\n\n\n\n\n作为一个根据用户指定标准进行排序的示例，我们将展示如何在不考虑大小的情况下对字符串进行排序：\n\
  \n点击此处查看代码图片\n\n```cpp\nstruct No_case {\n        bool operator()(const string&\
  \ x, const string& y) const           // is lowercase(x) < lowercase(y)?\n     \
  \   {\n                for (int i = 0; i<x.length(); ++i) {\n                  \
  \      if (i == y.length())                    // y<x\n                        \
  \        return false;\n                        char xx = tolower(x[i]);\n     \
  \                   char yy = tolower(y[i]);\n                        if (xx<yy)\
  \                                // x<y\n                                return\
  \ true;\n                        if (yy<xx)                                // y<x\n\
  \                                return false;\n                }\n            \
  \    if (x.length()==y.length())               // x==y\n                       \
  \ return false;\n                return true;                                  \
  \  // x<y (fewer characters in x)\n        }\n};\n\nvoid sort_and_print(vector<string>&\
  \ vc)\n{\n        ranges::sort(vc,No_case{});\n        for (const auto& s : vc)\n\
  \               cout << s << '\\n';\n}\n```\n\n### CC\n\n一旦序列被排序，我们就不再需要使用 `find()`\
  \ 从头开始搜索了；我们可以利用这个顺序进行二分查找。基本上，二分查找的工作原理如下：\n\n假设我们正在寻找值 `x`；查看中间元素：\n\n*   如果元素的值等于\
  \ `x`，我们我们找到了！\n*   如果元素的值小于 `x`，则任何值为 `x` 的元素一定在右侧，因此我们查看右半部分（对该半部分进行二分查找）。\n*\
  \   如果 `x` 的值小于元素的值，则任何值为 `x` 的元素一定在左侧，因此我们查看左半部分（对该半部分进行二分查找）。\n*   如果我们到达最后一个元素（向左或向右）仍未找到\
  \ `x`，则不存在该值的元素。\n\n### AA\n\n对于较长的序列，二分查找比 `find()`（线性搜索）快得多。标准库中的二分查找算法有 `binary_search()`\
  \ 和 `equal_range()`。我们所说的“较长”是什么意思？这取决于情况，但通常十个元素就足以让 `binary_search()` 优于 `find()`。对于一个包含\
  \ 1000 个元素的序列，`binary_search()` 的速度大约是 `find()` 的 200 倍，因为它的代价是 `O(log2(N));`；参见\
  \ §20.3。\n\n`binary_search` 算法有两个变体：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<random_access_range\
  \ Ran, typename T>\nbool binary_search(Ran r, const T& val);\n\ntemplate<random_access_range\
  \ Ran, typename T, predicate<Ran::value_type,Ran::value_type> Cmp>\nbool binary_search(Ran\
  \ r, const T& val, Cmp cmp);\n```\n\n### XX\n\n显然，也有接受迭代器对的版本这些算法要求并假设输入序列是排序过的。如果不是，可能会发生“有趣的事情”，例如无限循环。`binary_search()`\
  \ 仅仅告诉我们某个值是否存在：\n\n点击此处查看代码图片\n\n```cpp\nvoid f(vector<string>& vs)           \
  \    // vs is sorted\n{\n        if (binary_search(vs.begin(),vs.end(),\"starfruit\"\
  )) {\n                // 我们有一个杨星果\n        }\n        // ...\n}\n```\n\n### AA\n\
  \n所以，当我们只关心某个值是否在序列中时，`binary_search()` 是理想的。如果我们关心找到找到的元素本身，可以使用 `lower_bound()`、`upper_bound()`\
  \ 或 `equal_range()` (PPP2.§23.4)。在关心找到的是哪个元素的情况下，原因通常是因为它是一个包含比键值（key）更多信息的对象，或者有很多元素具有相同的键值，或者我们想知道哪个元素符合搜索标准。例如：\n\
  \n点击此处查看代码图片\n\n```cpp\ntemplate<class T>\nvoid print same(const vector<T>& v, const\
  \ T& x)\n{\n        for (const auto& x : ranges::equal_range(v,x))            //\
  \ equal_range() 返回一个子范围\n                cout << x << '\\n';\n}\n```\n\n#### 练习\n\
