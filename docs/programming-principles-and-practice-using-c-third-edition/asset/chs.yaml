  ### 15.7.1 列表操作\n\n我们的 `Link` 类需要为用户提供哪些操作？\n\n*   `insert`: 插入元素\n*   `add`: 在元素后插入\n\
  *   `erase`: 删除元素\n*   `find`: 查找给定值；未找到时返回 `nullptr`\n*   `advance`: 在列表中移动 `n`\
  \ 位；未找到时返回 `nullptr`\n\n只要可能，标准库都会提供 `list`（如第 20.6 节）。我们本可以考虑将在列表之外尝试 `advance()`\
  \ 视为错误并抛出异常，但我们选择返回 `nullptr`，从而强制用户处理那种可能性。为什么呢？主要因为在这种级别的指针使用中，用户必须时刻意识到 `null`\
  \ 的可能性。是的，这很容易出错，所以我们尽可能地使用更高级的构造结构（如标准库的 `list`）。\n\n### 15.7.2 列表的使用\n\n作为一个小练习，让我们构建两个列表：\n\
  \n点击此处查看代码图像\n\n```\nLink* norse_gods = new Link{\"Thor\"};\nnorse_gods = insert(norse_gods,new\
  \ Link{\"Odin\"});\nnorse_gods = insert(norse_gods,new Link{\"Zeus\"});\nnorse_gods\
  \ = insert(norse_gods,new Link{\"Freja\"});\n\nLink* greek_gods = new Link{\"Hera\"\
  };\ngreek_gods = insert(greek_gods,new Link{\"Athena\"});\ngreek_gods = insert(greek_gods,new\
  \ Link{\"Mars\"});\ngreek_gods = insert(greek_gods,new Link{\"Poseidon\"});\n```\n\
  \n\n\n\n“遗憾的是，”我们犯了几个错误：宙斯（Zeus）是一个希腊神，而不是北欧神，而且希腊战神是阿瑞斯（Ares），而不是火星（Mars 是他的拉丁语/罗马名字）。我们可以修复这一点：\n\
  \n点击此处查看代码图像\n\n```\nLink* p = find(greek_gods, \"Mars\");\nif (p)\n        p−>value\
  \ = \"Ares\";\n```\n\n注意看我们对 `find()` 返回 `nullptr` 是多么谨慎。我们认为知道在这种情况下这种情况不会发生（毕竟，我们刚刚把\
  \ `Mars` 插入了 `greek_gods`），但在实际示例中，有人可能会修改这段代码。\n\n同样，我们可以将宙斯移动到它正确的神话体系中：\n\n点击此处查看代码图像\n\
  \n```\nLink* p = find(norse_gods,\"Zeus\");\nif (p) {\n        erase(p);\n     \
  \   insert(greek_gods,p);\n}\n```\n\n你发现那个 bug 了吗？它非常微妙（除非你习惯了直接处理链接）。如果我们 `erase()`\
  \ 的那个 `Link` 是被 `norse_gods` 指向的那一个呢？同样，这在在这里并没有发生，但为了编写良好的、可维护的代码，我们必须考虑这种可能性：\n\
  \n点击此处查看代码图像\n\n```\nLink* p = find(norse_gods, \"Zeus\");\nif (p) {\n       if\
  \ (p==norse_gods)\n               norse_gods = p−>succ;\n       erase(p);\n    \
  \   greek_gods = insert(greek_gods,p);\n}\n```\n\n既然都做到了，我们还纠正了第二个 bug：当我们把宙斯插入到第一个希腊神*之前*时，我们需要让\
  \ `greek_gods` 指向宙斯的 `Link`。指针极其有用且灵活，但也很微妙。必须小心处理它们，并在尽可能避免它们，转而使用不易出错的替代方案。\n\n\
  最后，让我们打印出这些列表：\n\n```\nvoid print_all(Link* p)\n{\n        cout << \"{ \";\n   \
  \     while (p) {\n                 cout << p−>value;\n                 if (p=p−>succ)\n\
  \                         cout << \", \";\n         }\n         cout << \" }\";\n\
  }\n\nprint_all(norse_gods);\ncout << '\\n';\n\nprint_all(greek_gods);\ncout << '\\\
  n';\n```\n\n这应该输出：\n\n点击此处查看代码图像\n\n```\n{ Freja, Odin, Thor }\n{ Zeus, Poseidon,\
  \ Ares, Athena, Hera }\n```\n\n### 15.8 this 指针\n\n注意，我们的每个列表函数都接受一个 `Link*` 作为第一个参数，并访问该对象中的数据。这种函数我们经常制作成成员函数。我们可以通过将操作设为成员来简化\
  \ `Link`（或链接的使用）吗？我们也许可以将指针设为私有，使得只有成员函数可以访问它们吗？我们可以做到：\n\n点击此处查看代码图像\n\n```\nclass\
  \ Link {\npublic:\n        string value;\n\n        Link(const string& v, Link*\
  \ p = nullptr, Link* s = nullptr)\n               : value{v}, prev{p}, succ{s} {\
  \ }\n\n        Link* insert(Link* n);                                      // 在此对象之前插入\
  \ n\n        Link* add(Link* n);                                        // 在此对象之后插入\
  \ n\n        Link* erase();                                                // 从列表中删除此对象\n\
  \n        Link* find(const string& s);                            // 在列表中查找 s\n\
  \        const Link* find(const string& s) const;         // 在 const 列表中查找 s（参见\
  \ _oper.const_)\n\n        Link* advance(int n) const;                         \
  \ // 在列表中移动 n 个位置\n        Link* next() const { return succ; }\n        Link* previous()\
  \ const { return prev; }\n\nprivate:\n        Link* prev;\n        Link* succ;\n\
  };\n```\n\n这看起来很有前景。我们将不改变 `Link` 状态的操作定义为 `const` 成员函数。我们添加了（非修改的）`next()` 和 `previous()`\
  \ 函数，以便用户可以遍历列表（`Link` 列表——既然禁止了对 `succ` 和 `prev` 的直接访问，现在就需要这些函数。我们将 `value` 留为公共成员，因为（到目前）我们没有理由这样做；它“仅仅是数据”。\n\
  \n现在，让我们尝试通过复制我们的全局 `insert()` 并修改它来实现 `Link::insert()`：\n\n点击此处查看代码图像\n\n```\n\
  Link* Link::insert(Link* n)                // 在 p 之前插入 n；返回 n\n{\n        Link*\
  \ p = this;                          // 指向此对象的指针\n        if (n==nullptr)      \
  \                    // 无内容插入\n                return p;\n        if (p==nullptr)\
  \                         // 无处插入\n                return n;\n        n−>succ =\
  \ p;                          // p 在 n 之后\n        if (p−>prev)\n              \
  \  p−>prev = n;\n        p−>succ = n;                              // 这的前驱\n   \
  \     prev = n;                                 // n 的前驱\n        return n;\n}\n\
  ```\n\n\n\n\n点击此处查看代码图像\n\n```\nLink* p2 = norse_gods−>find(\"Zeus\");\nif (p2)\
  \ {\n        if (p2==norse_gods)\n                norse_gods = p2−>next();\n   \
  \     p2−>erase();\n        greek_gods = greek_god−>insert(p2);\n}\n```\n\n最后，让我们打印这些列表：\n\
  \n```\nvoid print_all(Link* p)\n{\n        cout << \"{ \";\n        while (p) {\n\
  \                 cout << p−>value;\n                 if (p=p−>next())\n       \
  \                  cout << \", \";\n        }\n        cout << \" }\";\n}\n\nprint_all(norse_gods);\n\
  cout << '\\n';\n\nprint_all(greek_gods);\ncout << '\\n';\n```\n\n这应该再次得到：\n\n点击此处查看代码图像\n\
  \n```\n{ Freja, Odin, Thor }\n{ Zeus, Poseidon, Ares, Athena, Hera }\n```\n\n所以，你更喜欢哪种版本：`insert()`\
  \ 等作为成员函数的版本，还是它们作为独立函数的版本？在这种情况下，区别并不大，但请参阅第 8.7.5 节。\n\n### **AA**\n\n这里可以观察到的一点是，我们仍然没有列表类（list\
  \ class），只有一个链接类（link class）。这迫使我们必须一直担心哪个指针是指向第一个元素的指针。这段 `Link` 代码中充斥着裸露的 `new`，而且看不见任何\
  \ `delete`。我们希望你注意到了这一点，并且这让你感到有些不适从。我们可以做得更好——通过定义一个 `List` 类——但此类此处展示的设计非常常见，而\
  \ `Link` 示例是为了说明指针操作，而不是资源管理。标准库中的 `list` 在第 19.3 节 中介绍。通常情况下，细微的指针操作最好封装在类中（第 12.3\
