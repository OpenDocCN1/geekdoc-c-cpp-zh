  \ (Fourth Edition)*. Addison-Wesley, 2013\\. ISBN 0321563840. |\n\n#### 后记\n\n每章都提供了一个简短的“后记”，尝试为呈现的内容提供一些视角。你不会一天之内变成专家，但在学习过程中，你可以成为一名合格的程序员。\n\
  \n# 第一部分：基础\n\n第一部分介绍了编程的基本概念和技术，以及入门所需的 C++ 语言和库。这包括类型系统、控制结构、错误处理以及函数的设计和使用。\n\
  \n*   第 1 章：Hello, World!\n*   第 2 章：对象、类型和值\n*   第 3 章：计算\n*   第 4 章：错误！\n*   第\
  \ 5 章：编写程序\n*   第 6 章：完成程序\n*   第 7 章：技术细节\n*   第 8 章：技术细节\n\n## 1 Hello, World!\n\
  \n*编程是通过编写程序学习的。*\n– Brian Kernighan\n\n在这里，我们介绍一个能够实际作用的最简单 C++ 程序。编写这个程序的目的是：\n\
  \n*   让你尝试你的编程环境\n*   让你初步感受如何让计算机为你工作\n\n因此，我们介绍了介绍了程序的概念、使用编译器将程序从人类可读格式转换为机器指令的思想，以及最后执行这些机器指令。\n\
  \n### 1.1 程序\n\n要让计算机做某事，你（或他人）必须告诉它具体做什么，并且是详尽的细节。这种对“做什么”的描述被称为*程序*，而*编程*就是编写和测试此类程序的活动。\n\
  \n\n\n在某种意义上，我们都曾编写过程序。毕竟，我们都对要完成的任务给出过描述，例如“如何开车去最近的电影院”、“如何找到楼上的卫生间”以及“如何用微波炉加热食物”。这类描述与程序之间的区别在于精确程度的不同：人类倾向于利用常识来弥补粗劣的指令，但计算机不会。例如，“在走廊里右转，走上楼梯，它会在你的左侧”，这对于通往楼上卫生间可能是一个不错的描述。然而，当你观察这些简单的指令时，你会发现语法很粗糙，而且指令不完整。人类很容易进行弥补。例如，假设你正坐在桌旁询问去卫生间的方向。你不需要被提醒从椅子上站起来走廊，以某种方式绕过（而不是穿过或钻过）桌子，不要踩到猫等等。你不需要被提醒不要带上刀叉，或者不要记得开灯以便看清楼梯。在进入卫生间之前开门可能也是你不需要被提醒的。\n\
  \n相比之下，计算机是*真的*愚蠢。它们要求一切都得到精确且详细的描述。再次考虑“在走廊里右转，走上楼梯，它会在你的左侧”。走廊在哪里？走廊是什么？什么是“右转”？哪段楼梯？我如何上楼梯？（一步一步？一次两步？顺着扶手滑上去？）我的左侧是什么？什么时候会在我的左侧？为了能为计算机精确地描述“事物”，我们需要一种具有特定语法的精确定义的语言（英语的结构对于这来说太松散了）以及一种针对我们想要执行的动作类型定义的、定义良好的词汇。这种语言被称为*编程语言*，而\
  \ `C++` 是一种为广泛编程任务设计的编程语言。当计算机能够根据简单指令执行复杂任务时，那是因为有人通过提供程序教会了它如何做。\n\n如果你想了解更多关于计算机、程序和编程的哲学细节，请参阅\
  \ `PPP2.Ch1` 和 `PPP2.Ch22`。在这里，我们从一个非常简单的程序以及让它运行所需的工具和技术开始介绍。\n\n## 1.2 经典的第一个程序\n\
  \n这是一个经典第一个程序的版本。它在你的屏幕上打印“Hello, World!”：\n\n点击此处查看代码图像\n\n```cpp\n//这个程序向显示器输出消息\
  \ \"Hello, World!\"\n\nimport std;               // 访问 C++ 标准库\n\nint main()   \
  \               // C++ 程序从执行 main 函数开始\n{\n          std::cout << \"Hello, World!\\\
  n\";                // 输出 \"Hello, World!\"\n          return 0;\n}\n```\n\n将这段文本看作是我们提供给计算机执行的一组指令，就像我们给厨师提供一份食谱让他们遵循，或者像我们提供一份组装清单供自己遵循以让新玩具工作一样。让我们讨论一下这个程序的每一行的作用，从这一行开始\n\
  \n点击此处查看代码图像\n\n```cpp\nstd::cout << \"Hello, World!\\n\";                     \
  \              // 输出 \"Hello, World!\"\n```\n\n**CC**\n\n那一行是实际上产生输出的代码。它打印了字符 `Hello,\
  \ World!` 然后紧跟一个换行符；也就是说，在写入 `Hello, World!` 之后，光标将位于下一行的开头。*光标*是一个不断闪烁的字符或线条，显示你可以在何处输入下一个字符。\n\
  \n在 C++ 中，字符串字面量由双引号（`\"`）定界；也就是说，`\"Hello, World!\\n\"` 是一个字符字符串。`\\n` 是表示换行的*特殊字符*。`cout`\
  \ 指的是一个标准输出流。使用输出运算符 `<<` “放入 `cout`”的字符将出现在屏幕上。`cout` 的读音是“see-out”，是“`character\
  \ output stream`（字符输出流）”的缩写。你会发现编程中缩写非常常见。自然，第一次看到并必须记住它时，缩写可能会有点困扰，但一旦你开始反复使用缩写，它们就会变成本能，并且对于保持程序文本简短且易于管理至关重要。\n\
  \n`std::cout` 中的 `std::` 表示 `cout` 可以在我们通过 `import std;` 访问的标准库中找到。\n\n该行的末尾\n\n\
  ```cpp\n// 输出 \"Hello, World!\"\n```\n\n是一个注释。在行中，标记 `//`（即是两次字符 `/`，称为“斜杠”）之后写的任何内容都是注释。编译器会忽略注释，编写注释是为了阅读代码的程序员的利益。在这里，我们使用注释来告诉该行的开头实际上执行了什么。\n\
  \n编写注释是为了描述程序意图执行的操作，并且通常为人类提供无法在代码中直接表达的有用信息。从你代码中的注释中受益最多的人很可能是你自己——当你下周或明年回到那段代码时，已经忘记了你到底为什么要那样写这段代码。所以，请良好地记录你的程序。在\
  \ §4.7.2.1 和 §6.6.4 中，我们将讨论什么构成了良好的注释。\n\n**CC**\n\n程序是为两种受众写的。自然，我们编写代码是为了计算机执行。然而，我们花费大量时间阅读和修改代码。因此，程序员是另一个受众。所以，编写代码也是人与人之间的交流。事实上，我们把代码的读者视为主要受众：如果他们（我们）发现代码难以理解，那么代码就不可能是正确的。所以，请不要忘记：代码是为了阅读的——请尽一切让它易读。\n\
  \n程序的起始行是一个典型的注释；它简单地告诉人类读者程序应该做什么：\n\n点击此处查看代码图像\n\n```cpp\n//\n```\n\n这样的注释很有用，因为代码本身说明了程序做了什么，而不是我们想要它做什么。此外，我们通常向人类大致解释程序应该做什么，比我们向计算机用代码详细表达它要简洁得多。通常这样的注释是我们编写程序的第一部分。即使没有别的，它也提醒了我们正在尝试做什么。\n\
  \n下一行\n\n```cpp\nimport std;\n```\n\n是一个模块导入语句。它指示计算机可以使用（“导入”）来自名为 `std` 的模块的设施。这是一个标准模块，使\
  \ C++ 标准库中的所有设施可用。我们将在过程中解释其内容。\n\n计算机如何知道从哪里执行程序？它寻找一个名为 `main` 的函数并开始执行在那里找到的所有指令。这里是我们的“Hello,\
  \ World!”程序的 `main` 函数：\n\n点击此处查看代码图像\n\n```cpp\nint main()          // C++ 程序从执行\
  \ main 函数开始\n{\n          std::cout << \"Hello, World!\\n\";                // 输出\
  \ \"Hello, World!\"\n          return 0;\n}\n```\n\n**CC**\n\n每个 C++ 程序必须有一个名为 `main`\
  \ 的函数来告诉它从哪里开始执行。函数基本上是一段命名的指令序列，计算机按照它们的编写顺序执行它们。函数包含四个部分：\n\n\n\n\n*   *返回类型*，此处为\
  \ `int`（意思是“整数”），它指定了函数（如果有的话）将向请求执行它的者返回什么类型的结果。`int` 词是 C++ 中的一个保留字（*关键字*），因此\
  \ `int` 不能用作任何其他内容的名称。\n\n*   *名称*，此处为 `main`。\n\n*   *参数列表*，括在括号内（详参见 §7.2 和 §7.4），此处为\
  \ `()`；在这种情况下，参数列表是空的。\n\n*   *函数体*，括在一组“大括号”`{ }` 中，它列出了函数要执行的操作（称为*语句*）。\n\n因此，一个最最小的\
  \ C++ 程序仅仅是：\n\n```cpp\nint main() { }\n```\n\n不过，这并没有什么用，因为它什么都不做。我们“Hello, World!”程序的\
  \ `main()`（“主函数”）在函数体中有两个语句：\n\n点击此处查看代码图像\n\n```cpp\nstd::cout << \"Hello, World!\\\
  n\";                                       // 输出 \"Hello, World!\"\nreturn 0;\n\
  ```\n\n首先它会在屏幕上写入 `Hello, World!`，然后它会向调用它的者返回一个值 `0`（零）。由于 `main()`是由“系统”调用的，我们不会使用该返回值。然而，在某些系统（特别是\
  \ Unix/Linux）上，可以使用它来检查程序是否成功。`main()` 返回的零（`0`）表示程序成功终止。\n\nC++ 程序中指定操作的部分称为*语句*。\n\
  \n### 1.3 编译\n\n**CC**\n\nC++ 是一种编译型语言。这意味着为了让程序运行，你必须先将其从人类可读的形式翻译成机器可以“理解”的东西。这种翻译是由一个称为*编译器*的程序完成的。你读和写的被称为*源代码*或*程序文本*，而计算机执行的被称为*目标代码*或*机器码*。通常，C++\
  \ 源代码文件以 `.cpp` 为后缀（例如 `hello_world.cpp`），目标代码文件以 `.obj`（Windows 上）或 `.o`（Linux）为后缀。因此，简单的\
  \ *code*（代码）一词是有歧义的，可能会引起混淆；只有在含义很明确时才谨慎使用。除非另有说明，否则我们用 *code* 指“源代码”，甚至是“除去注释后的源代码”，因为注释确实是为了我们人类准备的，生成目标代码的编译器是看不见的。\n\
  \n![一张图表展示了程序的步骤序列。步骤是 C++ 源代码到编译器再到目标代码。](img/f0021-01.jpg)\n\n编译器读取你的源代码并尝试理解你写的内容。它会检查你的程序在语法上是否正确，每个单词是否有定义的含义，以及是否存在任何在不尝试实际执行程序就能检测到的明显错误。你会发现编译器对语法非常挑剔。遗漏我们程序的任何细节，例如\
  \ `importing` 一个 `module` 文件、一个分号或大括号，都会导致错误。同样，编译器对拼写错误是零容忍的。让我们用一系列示例来说说明这一点，每个示例都包含一个微小的错误。每个错误都是我们经常犯的某种错误示例：\n\
  \n点击此处查看代码图像\n\n```cpp\nint main()\n{\n          std::cout << \"Hello, World!\\\
  n\";\n          return 0;\n}\n```\n\n我们没有向编译器提供任何解释 `std::cout` 是什么，所以编译器抱怨了。为了修正这一点，让我们添加\
  \ `import`：\n\n点击此处查看代码图像\n\n```cpp\nimport std;\nint main()\n{\n          cout\
  \ << \"Hello, World!\\n\";\n          return 0;\n}\n```\n\n编译器再次抱怨：我们提供了标准库可用，但忘记告诉编译器去\
  \ `std` 中查找 `cout` 了。编译器还反对这一点：\n\n点击此处查看代码图像\n\n```cpp\nimport std;\nint main()\n\
  {\n          std::cout << \"Hello, World!\\n;\n          return 0;\n}\n```\n\n我们没有用\
  \ `\"` 结束字符串。编译器还反对这一点：\n\n点击此处查看代码图像\n\n```cpp\nimport std;\ninteger main()\n{\n\
  \          std::cout << \"Hello, World!\\n\";\n          return 0;\n}\n```\n\nC++\
  \ 中使用的是缩写 `int` 而不是单词 `integer`。编译器不喜欢这个：\n\n点击此处查看代码图像\n\n```cpp\nimport std;\n\
  int main()\n{\n          std::cout < \"Hello, World!\\n\";\n          return 0;\n\
  }\n```\n\n我们使用了 `<`（小于运算符）而不是 `<<`（输出运算符）。另一个错误：\n\n点击此处查看代码图像\n\n```cpp\nimport\
  \ std;\nint main()\n{\n          std::cout << 'Hello, World!\\n';\n          return\
  \ 0;\n}\n```\n\n我们使用了单引号而不是双引号来界定字符串。编译器给出了错误：\n\n点击此处查看代码图像\n\n```cpp\nimport std;\n\
  int main()\n{\n          std::cout << \"Hello, World!\\n\"\n          return 0;\n\
  }\n```\n\n我们忘记了分号。最后，让我们尝试一些惊奇地有效的东西：\n\n点击此处查看代码图像\n\n```cpp\nimport std;\nint\
  \ main()\n{\n          std::cout << \"Hello, World!\\n\";\n}\n```\n\n出于历史原因，我们可以省略\
  \ `main` 函数中的返回语句（仅限 `main` 函数），这就好像我们在 `main` 体的末尾写了 `return 0;` 来表示成功完成一样。\n\n\
  \n\n\n\n一个程序通常由几个独立的部分组成，通常由不同的人开发。例如，“Hello, World!”程序由我们编写的部分以及 C++ 标准库的部分组成。这些独立的部分（有时被称为\
  \ `modules` 模块或 `translation units` 编译单元）必须经过编译，并将生成的目标代码文件（链接在一起，以形成一个可执行程序。将这些部分链接在一起的程序（理不而然）被称为\
  \ `linker`（链接器）：\n\n![图表显示了使用链接器的程序中一系列的步骤。](img/f0023-01.jpg)\n\n链接器的输出被称为 `executable\
  \ file`（可执行文件），在 Windows 上，它的名称通常带有 `.exe` 后缀。请注意，目标代码和可执行文件在系统之间**不是**通用的。例如，当你为\
  \ Windows 机器编译时，你得到的是 Windows 的目标代码，它无法在 Linux 机器上运行。\n\n`library`（库）仅仅是一些代码——通常由他人编写——我们通过\
  \ `import` 导入的 `module` 中找到声明来访问它。例如：\n\n![图表显示了使用链接器的两条路径中的步骤序列。](img/f0024-01.jpg)\n\
  \n`declaration`（声明）是一个指定代码片段如何使用的程序语句；我们稍后将详细检查声明 (§3.5.2, §7.2)。编译器发现的错误被称为 `compile-time\
  \ errors`（编译时错误），链接器发现的错误被称为 `link-time errors`（链接错误），直到程序运行时才发现的错误被称为 `run-time\
  \ errors`（运行时错误）或 `logic errors`（逻辑错误）。通常，编译时错误比链接错误更容易理解和修复，而链接错误通常比运行时错误更容易发现和修复。在第\
  \ 4 章中，我们将详细详细讨论错误及其处理方法。\n\n### 1.5 编程环境\n\n为了编程，我们使用编程语言。我们还使用编译器将源代码翻译成目标代码，并使用链接器将目标代码链接成可执行程序。此外，我们还使用一些程序将我们的源代码文本输入计算机并对其进行编辑。这些只是构成我们程序员工具箱或“程序开发环境”的第一批最关键的工具。\n\
  \n如果你在命令行窗口中工作（像许多专业程序员那样），你必须自己手动发布编译和链接命令 (§0.3.1)。如果你使用 IDE（“交互式开发环境”或“集成开发环境”），正如许多专业程序员所做的那，只需点击正确的按钮即可完成工作。\n\
  \nIDE 通常包含一个编辑器，具有许多实用的功能，例如颜色编码，有助于区分注释、关键字和程序源代码的其他部分，以及其他帮助你调试、编译和运行代码的设施。`Debugging`（调试）是发现并消除程序中错误的活动活动；在这一过程中，你会听到很多关于它的内容。程序中的错误通常被称为\
  \ `bug`（漏洞），因此有了“debugging”这一术语。之所以将错误称为“a bug”，是因为在一个非常早的系统中，一个程序运行失败是因为一只昆虫进入了计算机\
  \ PPP2.§22.2.2.2。\n\n配合本书的练习，你可以使用任何提供最新的、符合标准的 C++ 实现的系统。我们说的大部分对所有 C++ 实现来说都是正确的，并且代码可以在任何地方运行。在我们的工作中，我们使用了几种不同的实现。\n\
  \n#### 操练\n\n到为止，我们已经讨论了编程、代码和工具（如编译器）。现在你必须让程序运行起来。这是本书中的一个关键点，也是学习编程的重要步骤。从这里开始，你开始开发实践技能和良好的编程习惯。本章练习重点是让你熟悉你的软件开发环境。一旦你让“Hello,\
  \ World!”程序运行起来，你就通过了程序员的第一个大里程碑。\n\n##### AA\n\n操练（drill）的目的是建立或强化你的实践编程技能，并让你获得编程环境工具经验。通常，操练是对单个程序的一系列修改，将其从一个完全平凡的东西“成长”为可能是真实程序中有用的部分。传统的练习集旨在测试你的主动性、聪明程度或创造力。相比之下，操练不需要你有太大的创造力。通常，顺序至关重要，每一个具体的步骤都应该是简单的（甚至是微不足道的）。请不要试图耍聪明跳过步骤；平均而言，那会减慢你的速度，甚至让你感到困惑。\n\
  \n你可能认为你理解了读到的每一个以及导师或老师告诉你的一切，但重复和练习对于开发编程技能是必须的。在这方面，编程就像体育、音乐、舞蹈或任何基于技能的工艺。想象一下人们在没有经常练习的情况下尝试在这些任何领域进行竞争。你知道他们的表现会如何。持续的练习——对于专业人士来说，这意味着终身的持续练习——是开发和保持高水平实践技能的唯一途径。\n\
  \n##### XX\n\n所以，无论你多么受诱，永远不要跳过操练；它们对学习过程至关重要。从第一步开始并继续，在每一步时都进行测试，以确保你的操作是正确的。\n\
  \n##### AA\n\n如果你不理解正在使用的语法的每一个细节，不要惊慌，也不要向老师或朋友寻求帮助。继续下去，完成所有的操练和许多练习，一切终将变得明朗。\n\
  \n所以，这里是你的第一次操练：\n\n1. 弄清楚如何在你的机器上编译和运行程序。这可能是向做过这件事的人寻求帮助的好机会。\n2. 如果你使用 IDE，创建一个名为\
  \ `hello_world` 的空 C++ 项目。否则，如果你计划使用命令行，获取一个命令行窗口，弄清楚如何使用编辑器输入代码，并参考 §0.3.1。\n3.\
  \ 输入 `hello_world.cpp`，完全如下所示，将其保存在你的练习目录（文件夹）中，并将其包含在 hello_world 项目中。\n\n点击查看图像\n\
  \n```cpp\nimport std;\nint main() // C++ 程序从执行 main 函数开始\n{\n        std::cout <<\
  \ \"Hello, World!\\n\"; // 输出 \"Hello, World!\"\n}\n```\n\n如果你没有支持 `std` 模块的最新 C++\
  \ 实现怎么办？那么使用一种不优雅且效率较低的技术，这种技术从 C 的早期起一直有效：按照 §7.7.2 所示 `#include` 头文件：\n\n点击查看图像\n\
  \n```cpp\n#include<iostream>\nint main() // C++ 程序从执行 main 函数开始\n{\n        std::cout\
  \ << \"Hello, World!\\n\"; // 输出 \"Hello, World!\"\n}\n```\n\n4. 编译并运行“Hello, World!”程序。IDE\
  \ 会有一个编译并运行按钮。即使是像“Hello, World!”这样简单的程序，第一次尝试新编程语言或新编程环境也很少直接编译运行。\n\n找到问题并修复它！这是一个向更有经验的人寻求帮助是明智的点，但确保你理解他们展示的内容，以便在继续之前能够独立完成。\n\
  \n\n\n\n\n[5] 此时，你可能已经遇到过一些错误并不得不纠正它们。现在是时候更熟悉一下你编译器的错误检测和错误报告功能了！尝试运行 §1.3 中的八个程序，看看你的编程环境是如何反应的。至少想出五个你在输入程序时可能犯的错误（例如，在输入一个单词时开启了大写字母锁定键，或者用逗号代替分号），并尝试每一种错误，看看在尝试尝试编译和运行这些版本时会发生什么。\n\
  \n### 复习 (Review)\n\n#### `AA`\n\n这些复习题的核心思想是给你一个机会看看你是否注意到并理解了本章的关键要点。你可能需要返回文本来回答问题；这是正常且符合预期的。你可能需要重读整个章节；这同样正常且符合预期。然而，如果你必须重读整章，或者在每个复习题上遇到问题，你应该考虑自己的学习方法是否有效。你是否读得太快了？你是否遵循了一些“尝试一下”的建议？你是否应该和朋友一起学习，以便就书中的解释讨论问题？\n\
  \n[1] “Hello, World!”程序的目的是什么？\n\n[2] 举出函数的四个部分。\n\n[3] 举出一个每个 C++ 程序中必须出现的函数。\n\
  \n[4] 在“Hello, World!”程序中，`return 0;`这一行的目的是什么？\n\n[5] 编译器的目的是什么？\n\n[6] `import`\
  \ 语句的目的是什么？\n\n[7] `#include` 指令的目的是什么？\n\n[8] 在 C++ 中，文件名结尾的 `.cpp` 后缀表示什么？\n\n\
  [9] 链接器为程序做了什么？\n\n[10] 源文件和对象文件之间的区别是什么？\n\n[11] 什么是可执行文件？\n\n[12] 什么是 IDE，它能为你做什么什么？\n\
  \n[13] 如何让编译好的程序运行起来？\n\n[14] 什么是注释？\n\n[15] 练习题（drill）的目的是什么？\n\n[16] 如果你理解了书中的所有内容，为什么还需要练习？\n\
  \n大多数复习题在它们出现的章节中都有明确的答案。然而，我们偶尔也会包含一些问题，提醒你注意其他章节的相关信息，有时甚至涉及此书之外的世界。我们认为这是合理的；编写良好的软件以及思考其影响，其内容远超一个章节或一本书所能涵盖的。\n\
  \n### 术语 (Terms)\n\n这些术语展示了编程和 C++ 的基础词汇。如果你想理解人们对编程话题的说法，并清晰地表达自己的想法，你就应该知道每个词的含义。\n\
