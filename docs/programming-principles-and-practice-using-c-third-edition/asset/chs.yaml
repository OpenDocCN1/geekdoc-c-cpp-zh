  \ 的 `vector` 中（存储在对应的位置，这样如果 `names[7]==\"Joe\"`，那么 `scores[7]==17`）。使用 `NoName\
  \ 0` 结束输入。检查每个名称是否唯一，如果输入了重复的名称，则输出错误信息并终止。写出所有的（名称，分数）对，每行一个。\n\n[19] 修改上一个练习的程序，使得在你输入完名称-值对后，要求你输入值：在一个循环中，当你输入名称时，程序将输出对应的分数或\
  \ `name not found`。\n\n[20] 修改上一个练习的程序，使得在你输入完名称-值对后，要求你输入名称：在一个循环中，当你输入一个值时，程序将输出所有该分数的名称或\
  \ `score not found`。\n\n#### 后记\n\n从哲学角度来说，你现在可以做任何计算机能做的所有事情——剩下的都是细节！除此之外，这展示了“细节”的价值以及实践技能的重要性，因为显然你作为一个程序员才刚刚开始。但我们认真的。到目前介绍的工具允许你表达每一个计算：你可以拥有任意数量变量（包括\
  \ `vectors` 和 `strings`），你拥有算术运算和比较，以及选择和迭代。每个计算都可以使用这些原语来表达。你有文本和数字的输入输出，每个输入或输出都可以表示为文本（甚至是图形）。你甚至可以将你的计算组织成一组命名函数。你剩下的工作“仅仅”是学习编写良好的程序，也就是说，编写正确、可维护且效率合理的程序。重要的是，你必须尝试投入合理的努力来这样做。\n\
  \n## 4\n\n## 错误！\n\n*我意识到从现在起，我生活中很大一部分将花费在发现和修正自己的错误上。*\n\n*– Maurice Wilkes, 1949*\n\
  \n在本章中，我们将讨论程序的正确性、错误以及错误处理。如果你是一个真正的初学者，你会发现讨论有时显得有些抽象，有时又详细得令人痛苦。错误处理真的这么重要吗？它是重要的，而且在你写出别人愿意使用的程序之前，你总会以这种或其他方式学会这一点。我们试图做的是向你展示“像程序员一样思考”意味着什么。它结合了相当抽象的策略与细节及替代方案的细致分析。\n\
  \n- 4.1 引言\n- 4.2 错误的来源\n- 4.3 编译时错误\n    - 语法错误\n    - 类型错误\n- 4.4 链接时错误\n- 4.5\
  \ 运行时错误\n    - 调用者处理错误\n    - 被调用者处理错误\n    - 错误报告\n- 4.6 异常\n    - 错误的参数\n    -\
  \ 范围错误\n    - 错误输入\n- 4.7 避免和发现错误\n    - 估计\n    - 调试\n    - 断言\n    - 测试\n    -\
  \ 随机数\n\n### 4.1 引言\n\n在之前的章节中我们反复提到了错误，但尚未进行详细讨论。在本章中，我们将讨论程序的正确性、错误以及错误处理。如果你是一个真正的初学者，你会发现讨论有时显得有些抽象，有时又详细得令人痛苦。错误处理真的这么重要吗？它是重要的，而且在你写出别人愿意使用的程序之前，你总会以这种或其他方式学会这一点。我们试图做的是向你展示“像程序员一样思考”意味着什么。它结合了相当抽象的策略与细节及替代方案的细致分析。\n\
  \n### 4.2 错误的来源\n\n分类错误有很多方法。例如：\n\n*   `编译时错误`：编译器发现的错误。我们可以根据它们违反的规则对编译时错误进一步分类，例如：\n\
  \    *   `语法错误`\n    *   `类型错误`\n*   `链接时错误`：链接器在尝试将目标文件组合成执行文件时发现的错误。\n*   `运行时错误`：运行中的程序发现的错误。我们可以将运行时错误进一步分类为：\n\
  \    *   `计算机检测的错误`（硬件或操作系统）\n    *   `库检测的错误`（标准库）\n    *   `用户代码检测的错误`。此类错误也称为\
  \ `逻辑错误`。\n\n### 4.3 编译时错误\n\n人们很容易说，我们作为程序员的工作是消除所有错误。这当然是理想状态，但通常是不可行的。事实上，对于现实世界的程序，很难知道“所有错误”意味着什么。如果在执行你的程序时切掉了你电脑的电源，这是你应该处理的错误吗？在很多情况下，答案是“显然不是”，但如果我们讨论的是一个医疗监控程序或电话交换机的控制程序呢？在这些情况下，用户可以合理地预期即使计算机断电或宇宙射线损坏了内存，你程序的一部分也会执行某些操作。关键问题变成了：\n\
  \n*除非我们特别说明，否则假设你的程序：*\n\n1. 对所有合法输入产生预期的结果\n2. 对所有非法输入给出合理的错误信息\n3. 不需要担心硬件故障\n\
  4. 不需要担心系统软件故障\n5. 允许在发现错误后终止\n\n基本上，所有假设 3、4 或 5 不成立的程序都可以被认为是高级程序，并超出了本书的范围。然而，假设\
  \ 1 和 2 包含在基本职业化的定义中，而职业化是我们的目标之一。即使我们不能 100% 地达到这一理想，它也必须是理想目标。\n\n\n\n\n在编写可靠程序时，经验至关重要，也就是说，那些可以信赖能够在可接受的错误率内完成预期工作的程序。请不要忘记，理想情况是我们的程序始终做正确的事。我们通常只能做到接近这一理想，但这不能作为我们不加努力的借口。\n\
  \n### 4.2 错误的来源\n\n这里是一些错误的来源：\n\n**CC**\n\n* **规范不完善（Poor specification）**：如果我们没有明确规定程序应该做什么，我们可能无法充分检查代码中的“死角”，并确保所有情况都得到了处理（即：每个输入都给出一个正确的答案或恰当的错误信息）。\n\
  * **程序不完整（Incomplete programs）**：在开发过程中，显然存在我们尚未处理的情况。这是不可避免的。我们必须追求的目标是：清楚何时我们已经处理了所有情况。\n\
  * **意外的参数（Unexpected arguments）**：函数接收参数。如果给函数传递了一个我们没有处理的参数，就会出现问题。例如，调用标准库中的平方根函数并传入\
  \ -1.2：`sqrt(-1.2)`。由于 `double` 类型的 `sqrt()` 返回 `double`，因此不存在可能的正确返回值。§4.5 和 §4.7.3.1\
  \ 讨论了这类问题。\n* **意外的输入（Unexpected input）**：程序通常会读取数据（来自键盘、文件、GUI、网络连接等）。程序对这类输入有很多假设，例如假设用户会输入一个数字。如果用户输入的是“噢，闭嘴！”而不是预期的整数怎么办？§4.5\
  \ 和 §9.4 讨论了这类问题。\n* **意外的状态（Unexpected state）**：大多数程序会保留大量数据（“状态”）供系统的不同部分使用。例如地址列表、电话簿和温度读取数的\
  \ `vectors`（向量）。如果这些数据不完整或错误了怎么办？程序的各个部分仍然必须进行管理。PPP2.26.3.5 讨论了这类问题。\n* **逻辑错误（Logical\
  \ errors）**：即代码根本没有执行它应该执行的事情；我们只能找到并修复此类问题。§5.6 和 §5.7 提供了寻找此类问题的示例。\n\n这个列表具有实际用途。当我们考虑程序进展了多大时，可以将其作为检查清单。在我们考虑所有这些潜在的错误来源之前，没有任何程序是完成的。事实上，从项目开始就记住这些错误是明智的，因为一个完全没有考虑过错误、只是草草拼凑在一起的程序，极不可能在不经过重大重写的情况下发现并消除其所有错误。\n\
  \n### 4.3 编译时错误\n\n当你编写程序时，编译器是你防范错误的第一道防线。在生成代码之前，编译器会分析代码以检测语法错误和类型错误。只有当它发现程序符合语言规范时，它才允许你继续。编译器发现的许多错误仅仅由于源代码拼写错误或编辑不完整导致的“低级错误”。另一些错误则源于我们对程序部分之间交互方式的理解缺陷。对于初学者来说，编译器往往显得很琐碎，但当你学会使用语言特性——特别是类型系统——来直接表达你的想法时，你将体会编译器的能力，它能检测出那些本会让你花费数小时枯燥搜索漏洞的问题。\n\
  \n作为一个示例，我们将查看这个简单函数的几次调用：\n\n点击此处查看代码图像\n\n```\nint area(int length, int width);\
  \       // 计算矩形面积\n```\n\n#### 4.3.1 语法错误\n\n如果我们像这样调用 `area()` 会怎样：\n\n点击此处查看代码图像\n\
  \n```\nint s1 = area(7,2;              // 错误: 缺少 )\nint s2 = area(7,2)         \
  \     // 错误: 缺少 ;\nInt s3 = area(7,2);             // 错误: Int（大写 I）不是一种类型\nint s4\
  \ = area('7,2);            // 错误: 未结束的字符 '； 缺少结束符 ' )\n```\n\n**AA**\n\n这些每一行都有语法错误；也就是说，它们不符合\
  \ C++ 语法，因此编译器会拒绝它们。遗憾的是，语法错误并不总是能以一种你（程序员）易于理解的方式报告出来。这是因为编译器可能需要比错误位置多读一点，才能确定确实存在错误。其结果是，尽管语法错误通常是微不足道的（一旦你发现它，通常会难以相信自己竟然犯了这样的错误），但报告信息往往是晦涩的，有时还会引用程序中后面的某行。因此，对于语法错误，如果你没有发现编译器指向的那行有错，也请查看程序中之前的几行。\n\
  \n注意，编译器并不知道你想做什么，因此它无法根据你的意图报告错误，只能根据你的语法。\n\n#### 4.3.2 类型错误\n\n一旦你删除了语法错误，编译器就会开始报告类型错误；也就是说，它将报告你为变量、函数等声明（或忘记声明）的类型与你赋值或作为函数参数传递的值或表达式的类型之间的匹配。例如：\n\
  \n点击此处查看代码图像\n\n```\nint x0 = arena(7,2);                       // 错误: 未定义的函数\n\
  int x1 = area(7);                           // 错误: 参数数量错误\nint x2 = area(\"seven\"\
  ,2);                  // 错误: 第一个参数类型错误\n```\n\n让我们考虑这些错误。\n\n* 对于 `arena(7,2)`，我们将\
  \ `area` 误拼为 `arena`，所以编译器认为我们要调用一个名为 `arena` 的函数。（它还能“想”什么呢？正如所说的。）假设没有 `arena()`\
  \ 函数，你会收到一条关于未定义函数的错误信息。如果存在名为 `arena` 的函数，且该函数接受 `(7,2)`，你就面临更严重的问题：程序可以通过编译，但执行的操作并不是你预期的（那是逻辑错误；见\
  \ §4.5）。\n* 对于 `area(7)`，编译器检测到参数数量错误。在 C++ 中，每次函数调用都必须提供预期数量的、正确的类型以及正确的顺序。当适当使用类型系统时，这可以成为避免运行时错误的强大工具（§12.1）。\n\
  \n\n\n\n*   对于 `area(\"seven\",2)`，你可能希望计算机能查看 `\"seven\"` 并判断出你的意思是整数 `7`。它并不会这样做。如果函数需要一个整数，你不能给它一个字符串。C++\
  \ 确实支持某些隐式类型转换（参见 §2.9），但不支持从 `string` 到 `int` 的转换。编译器不会尝试猜测你的意思。对于 `area(\"Hovel\
  \ lane\",2)`、`area(\"7,2\")` 和 `area(\"sieben\",\"dos\")`，你期望得到什么结果？\n\n这些只是几个例子。编译器还会为你发现更多错误。\n\
  \n#### 试一试\n\n尝试编译这些示例，看看编译器是如何响应的。试着自己再想几个错误并尝试它们。\n\n当你与编译器交道时，你会希望它足够聪明，能读出你的意；也就是说，你希望它报告的某些错误不要是错误。这很自然。更令人惊讶的是，随着经验的增加，你会开始希望编译器拒绝更多的代码，而不是更少。考虑一下：\n\
  \n点击此处查看代码图像\n\n```\nint x4 = area(10,−7);                     // OK：但宽度为 -7 的矩形是什么？\n\
  int x5 = area(10.7,9.3);                 // OK：但调用了 area(10,9)\nchar x6 = area(100,9999);\
  \           // OK：但截断了结果\n```\n\n对于 `x4`，我们没有得到编译器的错误信息。从编译器的角度来看，`area(10,−7)`\
  \ 没有问题的：`area()` 要求两个整数，而你提供了它们；没有人规定过这些参数必须是正数。\n\n对于 `x5`，一个良好的编译器会发出浮点值 `10.7`\
  \ 和 `9.3` 被截断为整数 `10` 和 `9` 的警告（参见 §2.9）。然而，根据（古老的）语言规则，你可以隐式地将 `double` 转换为 `int`，因此编译器不允许拒绝调用\
  \ `area(10.7,9.3)`。如果你确实想进行窄转换，请显式进行（§7.4.7）。\n\n随着经验的增长，你将学会如何充分利用编译器检测错误的能力并规避其已知的缺点。然而，不要过度自信：“我的程序编译通过了”并不意味着它会运行正确。即使它运行了，最初通常也会给出错误的结果，直到你发现逻辑中的缺陷。\n\
  \n此外，还有许多工具可以帮助我们检测并报告那些并非显而违反语言规则、但我们希望被捕获的结构。许多此类工具是领域特定的，因为在某些程序中可以接受的，在另一些程序中可能不可接受。强制\
  \ C++ 核心准则 [CG] 的程序就是此类工具的示例。\n\n### 4.4 链接时错误\n\n**CC**\n\n程序由几个单独编译的部分组成，这些部分被称为*翻译单元*或*模块*。程序中的每个函数在使用的每个翻译单元中必须以完全相同的类型声明。每个函数在程序中也必须恰定义一次。如果违反了其中任何一条规则，链接器将给出错误。我们将在\
  \ §7.6 和 §7.7 中讨论如何避免链接时错误。现在，这是一个可能产生典型链接器错误的程序示例：\n\n点击此处查看代码图像\n\n```\nint area(int\
  \ length, int width);            // 计算矩形面积\n\nint main()\n{\n         int x = area(2,3);\n\
  }\n```\n\n除非我们以某种方式在另一个源文件中定义了 `area()`并将该源文件生成的代码链接到此代码，否则链接器将抱怨未找到 `area()` 的定义。\n\
  \n`area()` 的定义必须与我们在文件中使用的类型（包括返回类型和参数类型）完全相同，即：\n\n点击此处查看代码图像\n\n```\nint area(int\
  \ x, int y) { /* ... */ }                                 // “我们的” area()\n```\n\
  \n同名但类型不同的函数将不会匹配并被忽略：\n\n点击此处查看代码图像\n\n```\ndouble area(double x, double y) { /*\
  \ ... */ }          // 不是“我们的” area()\nint area(int x, int y, char unit) { /* ...\
  \ */ }               // 不是“我们的” area()\n```\n\n注意，函数名称拼写错误通常不会导致链接器错误。相反，编译器在看到对未声明函数的调用时会立即给出错误。这是好事：编译时错误比链接时错误更早发现，且通常更容易修复。\n\
  \n上述函数链接规则也适用于所有其他实体，例如变量：一个实体必须恰好有一个定义，但声明必须类型一致。参见 §7.2 和 §7.3。\n\n### 4.5 运行时错误\n\
  \n一旦消除了编译和链接错误，程序就会运行。通常接下来发生的情况是没有产生输出，或者程序输出的结果是错误的。这可能由于多种原因。也许你的程序逻辑理解存在缺陷；也许你写的并不是你所想的写的；又也许你在某个\
  \ `if` 语句中犯了“愚蠢错误”，等等。这类逻辑错误通常最难发现，因为在这个阶段，计算机完全按照你让它做的。基本上，计算机是一个非常快的白痴。当你编写程序时，你能够检测到错误，但不总是知道该如何处理。考虑：\n\
  \n点击此处查看代码图像\n\n```\nint area(int length, int width)\n      // 计算矩形面积\n{\n     \
  \    return length*width;\n}\n\nint framed_area(int x, int y)\n      // 计算框内面积\n\
  {\n         return area(x−2,y−2);\n}\n\nvoid test(int x, int y, int z)\n{\n    \
  \     int area1 = area(x,y);\n         int area2 = framed_area(1,z);\n         int\
  \ area3 = framed_area(y,z);\n         double ratio = double(area1)/area3;      \
  \     // 转换为双以浮点除法\n         // ...\n}\n```\n\n**AA**\n\n我们知道一个整数除以另一个整数会得到整数结果（§2.4），因此我们没有使用\
  \ `area1/area3`，而是将 `area1` 转换为 `double` 以获得正确的比例。\n\n现在我们可以测试：\n\n```\nint main()\n\
  {\n         test(−1,2,3);\n}\n```\n\n\n\n\n在回答这些问题之前，先看看上面代码中 `ratio` 的计算。它看起来足够无害。你发现它哪里有什么问题了吗？如果没有，再看一遍：`area3`\
  \ 将为 `0`，导致 `double(area1)/area3` 发生除零错误。这会导致硬件检测到的错误，并带有某些与硬件相关的晦涩信息来终止程序。如果你不检测并明智地处理运行时错误，你——或你的用户——就不得不面对这种错误。大多数人对这种“硬件违规”的忍忍度较低，因为对任何不熟悉程序的人来说，提供的所有信息都是“某个地方出了问题！”。这对于任何建设性的行动都是不足的，所以我们感到愤怒，并想对提供程序的人大吼。\n\
  \n那么，让我们解决 `area()` 的参数错误问题。我们有两个而易见的替代方案：\n\n*   让 `area()` 的调用者处理错误的参数。\n*   让\
  \ `area()`（被调用函数）处理错误的参数。\n\n### 4.5.1 由调用者处理错误\n\n让我们先尝试第一种替代方案（“让用户小心！”）。如果 `area()`\
  \ 是库中一个我们无法修改的函数，我们就必须选择这一个。无论好坏，这是最常见的方法。\n\n在 `main()` 中保护对 `area(x,y)` 的调用相对容易：\n\
  \n点击此处查看代码图像\n\n```\nif (x<=0)\n         error(\"non−positive x\");\nif (y<=0)\n\
  \         error(\"non−positive y\");\nint area1 = area(x,y);\n```\n\n实际上，唯一的问题是当我们发现错误时该怎么办。在这里，我们调用了一个函数\
  \ `error()`，我们假设它会执行一些明智的操作。事实上，在 `PPP_support` 中，我们提供了一个 `error()` 函数，它默认情况下会带有系统错误消息加上我们作为参数传递给\
  \ `error()` 的字符串来终止程序。如果你更喜欢写自己的错误消息或采取其他行动，你可以可以捕获 `runtime_error`（§4.6.3, §6.3,\
  \ §6.7）。这种方法对于大多数学生程序足够，并且是可以用于更复杂的错误处理的风格示例。\n\n如果我们不需要对每个参数提供独立的错误消息，我们就可以简化：\n\
  \n点击此处查看代码图像\n\n```\nif (x<=0 || y<=0)                                   // || 表示“或”\n\
  \         error(\"non−positive area() argument\");\nint area1 = area(x,y);\n```\n\
  \n为了完全保护 `area()` 免受错误参数的侵害，我们必须通过 `framed_area()` 处理调用。我们可以写：\n\n点击此处查看代码图像\n\n\
  ```\nif (z<=2)\n         error(\"non−positive 2nd area() argument called by framed_area()\"\
  );\nint area2 = framed_area(1,z);\n// ...\nif (y<=2 || z<=2)\n         error(\"\
  non−positive area() argument called by framed_area()\");\nint area3 = framed_area(y,z);\n\
  ```\n\n这很凌乱，而且从根本上说也有问题。只有在确切知道 `framed_area()` 如何使用 `area()` 的情况下才能这样写。我们必须知道 `framed_area()`\
  \ 从每个参数中减了 `2`。我们不应该知道这些细节！如果有人修改了 `framed_area()` 使用 `1` 而不是 `2` 怎么办？这样做的人必须查看\
  \ `framed_area()` 的每一次调用，并相应地修改错误检查代码。这种代码被称为“脆弱的”，因为它很容易崩溃。这这也是“魔法常数”（§3.3.1）的例子。我们可以通过给\
  \ `framed_area()` 减去的值起一个名称来让代码不那么脆弱：\n\n点击此处查看代码图像\n\n```cpp\nconstexpr int frame_width\
  \ = 2;\n\nint framed_area(int x, int y)\n     // 计算框架内的面积\n{\n        return area(x−frame_width,y−frame_width);\n\
  }\n```\n\n这个名称可以被调用 `framed_area()` 的代码使用：\n\n点击此处查看代码图像\n\n```cpp\nif (1−frame_width<=0\
  \ || z−frame_width<=0)\n         error(\"non−positive argument for area() called\
  \ by framed_area()\");\nint area2 = framed_area(1,z);\nif (y−frame_width<=0 || z−frame_width<=0)\n\
  \         error(\"non−positive argument for area() called by framed_area()\");\n\
  int area3 = framed_area(y,z);\n```\n\n看那段代码！你确定它是正确的吗？你觉得它漂亮吗？易读吗？实际上，我们觉得它非常丑（因此容易出错）。我们把代码的大小增加了三倍，并暴露了\
  \ `framed_area()` 的实现细节。一定有更好的方法！\n\n看看这段代码：\n\n```\nint area2 = framed_area(1,z);\n\
  int area3 = framed_area(y,z);\n```\n\n这可能是错误的，但至少我们可以把检查放在 `framed_area()` 内部。\n\
  \n### 4.5.2 由被调用者处理错误\n\n在 `framed_area()` 内部检查参数是简单的，而且 `error()` 仍然可以报告问题：\n\n\
  点击此处查看代码图像\n\n```cpp\nint framed_area(int x, int y)\n// 计算框架内的面积\n{\n    constexpr\
  \ int frame_width = 2;\n    if (x−frame_width<=0 || y−frame_width<=0)\n        \
  \     error(\"non−positive area() argument called by framed_area()\");\n    return\
  \ area(x−frame_width,y−frame_width);\n}\n```\n\n这种很好，我们不再需要为每次调用进行检查。对于在大型程序中调用\
  \ 500 次的函数，这是一个巨大的优势。注意一个有趣的现象：我们几乎是无意识地从“调用者必须检查”的方法转变为“函数必须检查自己的参数”的方法（也称为“被调用者检查”）。后一种方法的好处是错误检查代码在一个地方。我们不需要搜索整个程序中的调用。此外，那个地方恰恰是使用参数的地方，所以我们所需的信息很容易获取。\n\
  \n让我们把这种解决方案应用于 `area()`：\n\n点击此处查看代码图像\n\n```cpp\nint area(int length, int width)\n\
  \       // 计算矩形面积\n{\n         if (length<=0 || width<=0)\n                  error(\"\
  non−positive area() argument\");\n         return length*width;\n}\n```\n\n这将捕捉所有对\
  \ `area()` 的调用，所以我们不再需要在 `framed_area()` 中检查。尽管如此，我们可能想这样做，以获得更好的、更具体的错误消息。\n\n\
  在函数中检查参数看起来那么简单，为什么人们不总是这样做呢？不注意错误处理是一个原因，粗心是另一个原因，但也有合理的理由：\n\n*   *我们无法修改函数定义*：函数位于由于某种原因无法更改的库中。它可能被那些不认同你的良好错误处理观念的人使用。它可能属于别人，你没有源代码。它可能在一个定期发布新版本的库中，如果你在自己的副本中做了更改，你就必须为每个新版本重复你的更改。\n\
  *   *被调用函数不知道在发生错误时该做什么*：这通常是库函数的情况。库作者可以检测到错误，但只有你（调用者）知道发生错误时该做什么。\n*   *被调用函数不知道自己是从哪里被调用的*：当你收到错误消息时，它告诉你哪里出了问题，但没有告诉你执行程序是如何到达那里的。有时，你希望错误消息更具体。\n\
  \n\n\n\n-   **性能**：对于小型函数来说，检查的成本可能超过计算结果的成本。例如，`area()` 函数就是如此，检查操作甚至使函数体积增加了一倍以上（即需要执行的机器指令数量，而不仅仅是源代码的长度）。对于某些程序来说，这可能是至关重要的，特别是当函数相互调用并传递基本没有发生变化的信息时，这些相同的信息会被反复检查。\n\
  \n那么，你应该怎么做呢？除非你有充分的理由不检查，否则请在函数中检查你的参数。\n\n## AA\n\n在检查了几个相关主题后，我们将在第 4.6.1 节](#ch04.xhtml_ch04lev2sec6)中回到如何处理错误参数的问题。\n\
  \n### 4.5.3 错误报告\n\n让我们考虑一个稍微不同的问题：一旦你检查了一组参数并发现错误，你该怎么办？有时你可以返回一个“错误值”。例如：\n\n\
  点击此处查看代码图片\n\n```\nchar ask_user(string question)\n         // 询问用户是或否的答案；\n   \
  \      // 返回 ’b’ 表示答案错误（即既不是是也不是否）\n{\n         cout << question << \"? (yes or\
  \ no)\\n\";\n         string answer;\n         cin >> answer;\n         if (answer\
  \ ==\"y\" || answer==\"yes\")\n                  return 'y';\n         if (answer\
  \ ==\"n\" || answer==\"no\")\n                  return 'n';\n         return 'b';\
  \                  // ’b’ 表示“bad 答案”\n}\n\nint area(int length, int width)\n   \
  \      // 计算矩形面积；\n         // 返回 -1 表示参数错误\n{\n         if (length<=0 || width\
  \ <=0)\n                  return −1;\n         return length*width;\n}\n```\n\n\
  通过这样，我们可以让被调用函数执行详细检查，同时让每个调用者根据需要处理错误。这种方法似乎可行，但它存在几个问题，导致它在许多情况下无法使用：\n\n-   现在被调用函数和所有调用者都必须进行测试。调用者只需执行一个简单的测试，但仍然必须编写该测试，并在测试失败时决定该做什么。\n\
  \n-   调用者可能会忘记测试。这可能导致程序后续出现不可 own 的行为。\n\n-   许多函数没有“额外”的返回值可以指示错误。例如，一个从输入读取整数的函数（如\
  \ `cin` 的运算符 `>>`）显然可以返回任何 `int` 值，因此没有一个可以返回的特定 `int` 值来表示失败。\n\n上面的第二种情况——调用者忘记测试——很容易导致意外。例如：\n\
  \n点击此处查看代码图片\n\n```\nint f(int x, int y, int z)\n{\n         int area1 = area(x,y);\n\
  \         if (area1<=0)\n                  error(\"non−positive area\");\n     \
  \    int area2 = framed_area(1,z);\n         int area3 = framed_area(y,z);\n   \
  \      double ratio = double(area1)/area3;\n         // ...\n}\n```\n\n你看到这些错误了吗？这种错误很难发现，因为没有显见的“错误代码”可以查看：错误在于缺失了测试。\n\
  \n#### 尝试一试\n\n使用各种值测试此程序。打印出 `area1`、`area2`、`area3` 和 `ratio` 的值。插入更多的测试，直到所有错误都被捕获。你如何知道你捕获了所有错误？这不是陷阱题。在这个特定的例子中，你可以为捕获所有错误提供合理的理由。\n\
  \n还有另一种解决方案可以解决该问题：使用异常。\n\n### 4.6 异常\n\n与大多数现代编程语言一样，C++ 提供了一种帮助处理错误的机制：异常。其基本思想是将错误的检测（应该应该在被调用函数中完成）与错误的处理（应该在调用函数中完成）分离，同时确保检测到的错误不会被忽略；也就是说，异常提供了一种机制，允许我们结合到目前为止所探索的各种错误处理方法的优点。没有任何东西能让错误处理变得简单，但异常让它变得更容易。\n\
  \n## CC\n\n基本思想是，如果一个函数发现了一个它无法处理的错误，并且无法期望其直接调用者来处理，它就不会正常地 `return`；相反，它会 `throw`\
  \ 一个异常指示哪里出了问题。任何直接或间接的调用者都可以 `catch` 该异常，即指定当被调用代码使用 `throw` 时该做什么。函数通过使用 `try`-块（如下节所述）来表达对异常的兴趣，并在\
  \ `try`-块的 `catch` 部分列出它想要处理的异常类型。如果没有调用者捕获异常，程序将终止。\n\n## AA\n\n我们将在稍后时候回到异常（§18.3、\
  \ §18.4、 §18.5），查看如何以更高级的方式使用它们。现在，只需使用它们报告无法在本地处理的错误。也就是说，使用异常处理被认为是“异常”的错误。这并不意味着每个问题都应该是异常的。\n\
  \n#### 4.6.1 错误参数\n\n这是一个使用异常的 `area()` 版本：\n\n点击此处查看代码图片\n\n```\nclass Bad_area\
  \ { }; // 专门报告 area 错误的类型\n\nint area(int length, int width)\n         // 计算矩形面积；\n\
  \         // 在参数错误时抛出 Bad_area 异常\n{\n         if (length<=0 || width <=0)\n   \
  \               throw Bad_area{};\n         return length*width;\n}\n```\n\n也就是说，如果参数是正确的，我们像往常一样返回；如果不是，我们使用\
  \ `throw` 跳出 `area()`，希望某个 `catch` 能提供相应的响应。`Bad_area` 是我们定义的新类型，唯一目的是从 `area()`\
  \ 中 `throw` 以便某些 `catch` 识别它。用户自定义类型（类和枚举）将在第 9 章](#ch09)中讨论。`Bad_area{}` 符号表示“创建一个默认值的\
  \ `Bad_area` 类型对象”，因此 `throw Bad_area{}` 意味着“创建一个 `Bad_area` 类型对象并 `throw` 它”。\n\
  \n我们现在可以写出\n\n点击此处查看代码图片\n\n```\nvoid test(int x, int y, int z)\n{\n         int\
  \ area1 = area(x,y);\n         int area2 = framed_area(1,z);\n         int area3\
  \ = framed_area(y,z);\n         double ratio = area1/area3;\n}\n\nint main()\ntry{\n\
  \         test(−1,2,4);\n}\ncatch(Bad_area){\n         cout << \"哎！area 参数错误\\n\"\
  ;\n}\n```\n\n首先注意，这处理了所有对 `area()` 的调用，包括 `main()` 中的一次以及通过 `framed_area()` 的两次。其次，注意错误的处理与错误的检测是如何清晰分离的：`main()`\
  \ 不知道哪个函数执行了 `throw Bad_area{}`，而 `area()` 知道哪个函数（如果有）关心 `catch` 它 `throw` 出的 `Bad_area`\
  \ 异常。\n\n\n\n\n\n大多数现实世界中的代码处理的是数据集合；也就是说，它使用各种表格、列表等数据元素来完成工作。在 C++ 的语境下，我们通常将“数据集合”称为\
  \ `containers`（容器）。最常用且有效的标准库容器是我们在 §3.6 中介绍的 `vector`。`vector` 存储多个元素，我们可以通过调用\
  \ `vector` 的 `size()` 成员函数来确定数量。通用表示法 ``low`:`high`)` 表示从 `low` 到 `high−1` 的索引，即包含\
  \ `low` 但不包含 `high`：\n\n![数据表展示了 vector 转换为元素序列的过程。\n\n如果我们尝试使用索引（下标）不在有效范围 ``0`:`v.size()`)`\
  \ 之内的元素会发生什么呢？在回答这个问题之前，我们应该提出另一个问题：\n\n*你为什么要这样做呢？*\n\n毕竟，你知道 `v` 的下标应该在 `[`0,v.size()`)`\
  \ 范围内，所以只需确保总是如此即可！事实是，这说起来容易，但有时很难做到。考虑这段合理的代码：\n\n[点击此处查看代码图像\n\n```\nvector<int>\
  \ v;                                     // 一个 int 向量\nfor (int i; cin>>i;)\n  \
  \       v.push_back(i);                         // 获取值\nfor (int i = 0; i<=v.size();\
  \ ++i)            // 打印值\n         cout << \"v[\" << i <<\"] == \" << v[i] << '\\\
  n';\n```\n\n你看到错误了吗？请尝试在继续阅读之前将其找出它。这并不是一种罕见的错误。我们自己也犯过这样的错误——特别是在疲惫的深夜。当你疲劳或匆忙时，错误总是更容易发生。我们使用\
  \ `0` 和 `size()` 来尽量确保在执行 `v[i]` 时 `i` 始终在范围内。\n\n## XX\n\n遗憾的是，我们犯了一个错误。看这个 `for`\
  \ 循环：终止条件是 `i<=v.size()`，而不是正确的 `i<v.size()`。这导致了不幸的后果：如果我们读入五个整数，我们就会尝试输出六个。我们尝试读取\
  \ `v[5]`，这已经超出了 `vector` 的末尾。这种错误如此常见且“闻名”，以至于它有好几个名称：它是*差一错误*（off-by-one error）的一个例子；因为索引（下标）不在\
  \ `vector` 要求的范围内，它被称为*范围错误*（range error）；因为索引不在 `vector` 的限制（边界）之内，它被称为*边界错误*（bounds\
  \ error）。\n\n我们为什么没有使用范围-for 语句来表示这个循环？使用 range-for，我们不会在循环边界出错。然而，对于这个循环，我们不仅想要每个元素的值，还需要索引（下标）。如果不付出额外的努力，range-for\
  \ 无法提供这些。\n\n这里有一个更简单的版本，它会产生与循环相同的范围错误：\n\n```\nvector<int> v(5);\nint x = v[5];\n\
  ```\n\n然而，我们怀疑你可能不会认为这是现实的且值得认真关注的。\n\n那么，当我们犯这样的范围错误时实际上会发生什么？`vector` 的下标操作知道\
  \ `vector` 的大小，因此它可以进行检查（我们使用的 `vector` 确实如此；见 §3.6 和 §18.3）。如果检查失败，下标操作将抛出一个类型为\
  \ `out_of_range` 的异常。因此，如果上面的差一错误代码是一个捕异常程序的一部分，我们至少会得到良好的错误信息：\n\n点击此处查看代码图像\n\n\
  ```cpp\nint main()\ntry{\n         vector<int> v;                              \
  \      // 一个 int 向量\n         for(int x; cin>>x;)\n                 v.push_back(x);\
  \                        // 设置值\n         for (int i = 0; i<=v.size(); ++i)    \
  \        // 打印值\n                 cout << \"v[\" << i <<\"] == \" << v[i] << '\\\
  n';\n}\ncatch (out_of_range) {\n         cerr << \"Oops! Range error\\n\";\n   \
  \      return 1;\n}\ncatch (...) {                                             \
  \      // 捕捉所有其他异常\n         cerr << \"Exception: something went wrong\\n\";\n \
  \        return 2;\n}\n```\n\n注意，范围错误实际上是我们在 §4.5.2 中讨论的参数错误的特例。我们不相信自己能一致地检查 `vector`\
  \ 索引的范围，所以让 `vector` 的下标操作为我们完成。由于我们概述的原因，`vector` 的下标函数（称为 `vector::operator[]`）通过抛出异常来报告错误。它还能做什么呢？它不知道在发生范围错误时我们希望发生什么。`vector`\
  \ 的作者甚至不知道 `vector` 代码将位于哪些程序中。\n\n### 4.6.3 错误输入\n\n我们将对错误输入的详细讨论推迟到 §9.4。然而，一旦检测到错误输入，其处理方式与范围错误相同。在开发早期阶段，我们经常想知道\
  \ `cin` 是否成功。考虑读取浮点数：\n\n```cpp\ndouble d = 0;\ncin >> d;```\n\n条件 `!cin`（即 `cin`\
  \ 不处于良好状态）意味着之前的操作失败了。`cin` 失败有几种可能的原因。通过通过方式测试 `cin` 是否成功：\n\n```cpp\nif (cin)\
  \ {\n    // 一切正常，我们可以尝试...\n}else {\n    // ...\n}\n```\n\n传递给 `error()` 的字符串可以作为调试帮助或给用户的消息打印。如何编写\
  \ `error()` 才能在很多程序中都有用？它不能返回值，因为我们不知道对该值做什么；相反，`error()` 应该终止程序。此外，我们可能在退出前采取一些微小的操作，例如让窗口保持足够的时间让我们阅读消息。这显然是异常的工作（见\
  \ §6.3).\n\n## AA\n\n标准库定义了一些异常类型，例如 `vector` 抛出的 `out_of_range`。它还提供了 `runtime_error`，这非常符合我们的需求，因为它包含一个可以供错误处理器使用的字符串。因此，我们可以这样写我们简单的\
  \ `error()`：\n\n点击此处查看代码图像\n\n```cpp\nvoid error(string s)\n{\n          throw runtime_error{s};\n\
  }\n```\n\n当我们想要处理 `runtime_error` 时，只需捕获它。对于简单的程序，在 `main()` 中捕获 `runtime_error`\
  \ 是理想的：\n\n点击此处查看代码图像\n\n```cpp\nint main()\ntry{\n         // ... 程序 ...\n    \
  \     return 0;            // 0 表示成功\n}\ncatch (runtime_error& e) {\n         cerr\
  \ << \"runtime error: \" << e.what() << '\\n';\n         return 1;           //\
  \ 1 表示失败\n}\n```\n\n`e.what()` 调用从 `runtime_error` 中提取错误消息。`catch` 中的 `&` 在：\n\n\
  ```cpp\ncatch(runtime_error& e) {\n```\n\n\n\n\n这表示我们想要“通过引用传递异常”。目前，请简单地将其视为一个无关紧要的技术细节即可。在\
  \ §7.4.5 中，我们将解释通过引用传递内容意味着什么。\n\n请注意，我们在错误输出时使用了 `cerr` 而不是 `cout`：`cerr` 与 `cout`\
  \ 完全相同，只是它专门用于错误输出。默认情况下，`cerr` 和 `cout` 都会写入屏幕，但 `cerr` 没有经过优化，因此它对错误的容错性更强，而且在某些操作系统上，它可以被重定向到不同的目标（例如文件）。使用\
  \ `cerr` 还有一个简单的效果，即记录我们写入的内容与错误有关。因此，我们使用 `cerr` 来输出错误信息。\n\n恰巧，`out_of_range`\
  \ 并不是 `runtime_error`，所以捕获 `runtime_error` 无法处理因误用 `vectors` 以及标准库容器类型而可能得到的 `out_of_range`\
  \ 错误。然而，`out_of_range` 和 `runtime_error` 都是“异常”，因此我们可以捕获 `exception` 来同时处理两者：\n\n\
  点击此处查看代码图片\n\n```cpp\nint main()\ntry{\n         // our program\n         return\
  \ 0;           // 0 表示成功\n}\ncatch (exception& e) {\n         cerr << \"error: \"\
  \ << e.what() << '\\n';\n         return 1;           // 1 表示失败\n}\ncatch (...)\
  \ {\n         cerr << \"Oops: unknown exception!\\n\";\n         return 2;     \
  \      // 2 表示失败\n}\n```\n\n我们添加了 `catch(...)` 来处理任何类型的异常。\n\n通过单一类型 `exception`（它被认为是两者的共同基类/超类）来处理\
  \ `out_of_range` 和 `runtime_error` 类型的异常，是一种非常用且通用的技术，我们将在第 12 章 以及其他地方进行探索。\n\n\
  再次注意，`main()` 的返回值会被传递给调用程序的“系统”。某些系统（如 Linux）经常会使用该值，而另一些系统（如 Windows）通常会忽略它。返回零表示成功完成，`main()`\
  \ 返回非零值则表示某种失败。\n\n当你使用 `error()` 时，你通常希望同时传递两部分信息来描述问题。在这种情况下，只需将描述这两部分信息的字符串拼接即可。这种情况非常常见，以至于我们提供了\
  \ `error()` 的第二个版本：\n\n点击此处查看代码图片\n\n```cpp\nvoid error(string s1, string s2)\n\
  {\n         throw runtime_error{s1+s2};\n}\n```\n\n这种简单的错误处理方法可以维持一段时间，直到我们的需求显著增加，我们作为设计者和程序员的成熟程度也随之增加。注意，无论我们在到达错误之前进行了多少函数调用，都可以使用\
  \ `error()`：`error()` 会找到最近的 `runtime_error` 的 `catch` 块，通常是 `main()` 中的那个。关于异常和\
  \ `error()` 使用的示例，请参阅 §6.3 和 §6.7。如果你没有捕获异常，将得到默认系统错误（即“未捕获异常”错误）。\n\n### 尝试一下\n\
  \n为了查看未捕获异常错误的样式，请运行一个使用了 `error()` 但没有捕获任何异常的小程序。\n\n## 4.7 避免和发现错误\n\n我们知道，程序的第一次尝试不会完美。因此，我们必须提高发现问题并修复它们的能力（§4.7.1,\
  \ §4.7.2, §4.7.4）。其中很大一部分是组织代码，让 bug 难以隐藏（§7.3, §4.7.3）。\n\n### 4.7.1 估计\n\n假设你写了一个执行简单计算的程序，例如计算六边形的面积。你运行它，它给出的面积\
  \ `-34.56`。你只知道这是错的。为什么？因为没有任何形状有负面积。所以，你修复了那个 bug（无论它是什么），得到了 `21.65685`。这正确吗？这很难说，因为我们通常脑子里里并不记得六边形的面积公式。在交付一个产生荒谬结果的程序让自己难脸之前，我们必须做的只是检查答案是否合理。在这种情况下，这很容易。六边形非常像方形。我们在纸上随手画了一个正六边形，肉眼估算它大约是一个\
  \ `3-by-3` 正方形的大小。这样一个正方形的面积是 `9`。糟糕，我们的 `21.65685` 就不可能是对的！于是我们再次检查程序，得到了 `10.3923`。现在，这可能是正确的！\n\
  \n要点在于，除非我们对正确答案心中有所数，否则我们无法判断结果是否合理。*估计*是一门结合了常识和简单算术的艺术。在交付一个产生荒谬结果的程序让自己难脸之前，我们只需要检查答案是否合理。在这种情况下，这很容易。六边形非常像方形。我们在纸上随手画了一个正六边形，肉眼估算它大约是一个\
