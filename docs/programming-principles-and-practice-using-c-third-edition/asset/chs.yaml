  \ 不包含任何字符 `; :\"’[]&*&^%$#@!`。在发生错误时使用 `error()`。测试。\n\n[20] 从输入（`cin`）读取一系列 `Person`\
  \ 到 `vector<Person>` 中；再次将它们写入屏幕（`cout`）。用正确和错误的输入进行测试。\n\n[21] 修改 `Person` 的表示，用\
  \ `first_name` 和 `second_name` 代替 `name`。如果不同时提供名和姓，则视为错误。确保也修复了 `>>` 和 `<<`。测试。\n\
  \n#### 复习\n\n[1] 什么是单参数函数？\n\n[2] 你在什么时候会用（连续）线来表示数据？什么时候用（离散）点？\n\n[3] 哪个函数（数学公式）定义了斜率？\n\
  \n[4] 什么是抛物线？\n\n[5] 如何创建 `x` 轴？`y` 轴？\n\n[6] 什么是默认参数？你什么时候会使用它？\n\n[7] 如何将函数相加？\n\
  \n[8] 如何对绘制的函数进行着色和标记？\n\n[9] 当说一个级数近似一个函数时是什么意思？\n\n[10] 在编写绘制代码之前，你为什么要勾勒图形布局？\n\
  \n[11] 你如何缩放你的图形以使输入适应窗口？\n\n[12] 你如何在不进行尝试的情况下缩放输入？\n\n[13] 为什么要格式化你的输入而不是仅仅让文件包含“数字”？\n\
  \n[14] 你如何规划图形的整体布局？你如何在代码中反映该布局？\n\n#### 术语\n\n| 近似 | `Function` | 缩放 | 默认参数 |\n\
  | lambda 表达式 | 屏幕布局 | `Axis` | 溢出 |\n\n#### 练习\n\n[1] 这是定义阶乘函数的另一种方法：\n\n点击查看代码图像\n\
  \n```\nint fac(int n) { return n>1 ? n*fac(n−1) : 1; }     // factorial n!\n```\n\
  \n\n\n数据的图形化表示非常重要。比起用于生成图表的数字集合，我们能更容易理解一张设计精良的图表。人在需要绘制图表时，通常会使用他人的代码——一个库。这些库是如何构建的？如果你手头没有现成的库该怎么办？“普通绘图工具”背后的基本思想是什么？现在你知道了：这并不是魔法，也不是脑手术。我们只涵盖了二维图表；三维绘图在科学、工程、营销等领域也非常有用，而且可能更有趣。找一天去探索它吧！\n\
  \n# 14 图形用户界面\n\n*计算不再仅仅关于计算机。它关乎生活。*\n– 尼古拉斯·尼格罗庞特（Nicholas Negroponte）\n\n图形用户界面（GUI）允许用户通过点击按钮、从菜单中选择、各种方式输入数据以及在屏幕上显示文本和图形实体来与程序进行交互。这就是我们在与计算机以及网站交互时所熟悉的模式。在本章中，我们将展示如何编写代码来定义和控制\
  \ GUI 应用程序的基础。特别是，我们将展示如何使用回调函数（callbacks）编写与屏幕上实体交互的代码。我们的 GUI 工具是构建在系统功能“之上”的。低级功能和接口在网络提供的代码中呈现，这些代码使用了第\
  \ 15 章和第 16 章中介绍的功能和技术。在这里我们重点关注用法。\n\n*   §14.1 用户界面替代方案\n*   §14.2 “下一步”按钮\n*\
  \   §14.3 简单的窗口\n*   等待循环\n*   §14.4 `Button` 和其他 `Widget`\n*   **`Widget`**；**`Button`**；[`In_box`\
  \ 和 `Out_box`; **`Menu`**\n*   §14.5 示例：绘制线条\n*   控制反转; 添加菜单\n*   §14.6 简单动画\n*\
  \   §14.7 调试 GUI 代码\n\n## 14.1 用户界面替代方案\n\n**CC**\n\n每个程序都有用户界面。运行在小型设备上的程序可能仅限于通过几个按钮进行输入以及通过闪烁的指示灯进行输出。其他计算机仅通过电线与外部世界连接。在这里，我们将考虑一种常见情况：我们的程序与一个盯着屏幕并使用键盘和指向设备（如鼠标）的用户进行通信。在这种情况下，我们作为程序员有三个主要选择：\n\
  \n*   **使用控制台输入输出**：对于技术性/专业工作的有力竞争者，输入是简单的文本，由命令和短数据项（如文件名和简单数据值）组成。如果输出是文本，我们可以将其显示在屏幕上或存储在文件中。C++\
  \ 标准库中的 `iostream`（第 9 章）为此提供了合适且方便的机制。如果需要图形输出，可以使用图形显示库（如第 10 章 – 第 14 章 所示），而无需对我们的编程风格发生剧变。\n\
  *   **使用图形用户界面 (GUI) 库**：当我们希望用户交互基于操纵屏幕上对象的隐喻（指向、点击、拖放、悬停等）时，我们会这样做。通常情况下（但并非总是），这种风格伴随着高程度的图形显示信息。任何用过现代计算机或手机的人都知道这种方便的例子。任何想要匹配\
  \ Windows/Mac 应用程序“感觉”的人都必须使用 GUI 风格的交互。\n*   **使用浏览器界面**：为此，我们需要使用标记（布局）语言，如 HTML，并且通常还需要一种脚本语言，如\
  \ JavaScript、Python 和 PHP。介绍如何这样做超出了本书的范围，但它对于需要远程访问的应用程序来说通常是理想的。在这种情况下，程序与屏幕之间的通信再次是文本形式（使用字符流）。浏览器是一个\
  \ GUI 应用程序，它翻译部分此类文本。\n\n**AA**\n\n对许多人来说，GUI 的使用是编程的核心，有时我们认为 GUI 是一种 I/O。在可能的情况下，我们希望将程序逻辑与\
  \ I/O 分离开。\n\n话尽管如此，GUI 在多个角度上都是重要的且有趣的。我们探讨了如何将 GUI 集成到应用程序中，以及我们如何让程序逻辑与屏幕上的交互分开来。我们的图形化/GUI\
  \ 库既可以在手机上运行，也可以在浏览器中运行。\n\n### 14.2 “下一步”按钮\n\n我们是如何提供第 10 章 – 第 13 章 中使用的“下一步”按钮的？在那里，我们在窗口中使用按钮进行图形。显然，这是一种简单的\
  \ GUI 形式。事实上，我们可以认为它不是“真正的 GUI”。然而，让我们看看它是如何实现的，因为它将直接进入每个人都能熟悉的 GUI 编程。\n\n我们的代码通常结构如下：\n\
  \n点击此处查看图像\n\n```\n// ... create objects and/or manipulate objects, display them\
  \ in Window win ...\nwin.wait_for_button();\n\n// ... create objects and/or manipulate\
  \ objects, display them in Window win ...\nwin.wait_for_button();\n\n// ... create\
  \ objects and/or manipulate objects, display them in Window win ...\nwin.wait_for_button();\n\
  ```\n\n每当我们到达 `wait_for_button()` 时，我们就可以查看屏幕上的对象，直到点击按钮以获取程序的后续部分。从程序逻辑的角度来看，这与一个向屏幕（控制台窗口）写入行的程序没有区别，后者偶尔会从键盘接收输入。例如：\n\
  \n点击此处查看图像\n\n```\n// ... define variables and/or compute values, produce output\
  \ ...\ncin >> var;     // wait for input\n\n// ... define variables and/or compute\
  \ values, produce output ...\ncin >> var;     // wait for input\n\n// ... define\
  \ variables and/or compute values, produce output ...\ncin >> var;     // wait for\
  \ input\n```\n\n\n\n\n*   告诉 GUI 它要寻找什么（例如，“有人点击了‘下一步’按钮”）\n*   告诉它当有人执行该操作时应该做什么\n\
  *   等待直到 GUI 检测到程序感兴趣的操作\n\n这里新颖且与众不同之处在于，GUI 不会停止并等待用户响应；它被设计为对不同的用户操作以不同的方式做出，例如点击许多按钮中的一个、缩放窗口、在窗口被另一个窗口遮挡后重绘窗口，以及弹出弹出菜单。这被称为*控制反转*（参见\
  \ §14.5.1）。\n\n起初，我们只是想说：“当有人点击我的按钮时，请唤醒我”；也就是说，“请停止执行我的程序，直到有人点击鼠标按钮且光标位于显示按钮图像的矩形区域内。然后唤醒我”。这已经是我们能想象的最简单的操作了。然而，这种操作并不是由“系统”直接提供，所以我们自己写了一个。了解它是如何完成的，是理解\
  \ GUI 编程的第一步。\n\n### 14.3 一个简单的窗口\n\n**CC**\n\n基本上，“系统”（它是 GUI 库和操作系统的结合）持续跟踪鼠标的位置以及其按钮是否被按下。程序可以对屏幕的某个区域表示兴趣，并要求“系统”在“某些有趣的事情”发生时调用一个函数。在特定情况下，我们要求系统在点击“我们的按钮”上的鼠标按钮时，调用我们的其中一个函数（一个“回调函数”）。为了做到这一点，我们必须：\n\
  \n*   定义一个按钮\n*   将其显示\n*   定义一个供 GUI 调用的函数\n*   告诉 GUI 关于该按钮和该函数\n*   等待 GUI 调用我们的函数\n\
  \n让我们开始。按钮是 `Window` 的一部分，所以（在 `Simple_window.h` 中）我们定义了类 `Simple_window` 来包含一个成员\
  \ `next_button`：\n\n点击此处查看代码图像\n\n```cpp\nstruct Simple_window : Window {\n    \
  \   Simple_window(Point xy, int w, int h, const string& title );\n       ~Simple_window()\
  \ {}\n       void wait_for_button();\nprivate:\n       Button next_button;\n};\n\
  ```\n\n显然，`Simple_window` 派自 `Graph_lib` 的 `Window`。我们所有的窗口都必须直接或间接地派生自 `Graph_lib::Window`，因为它是（通过\
  \ Qt）将我们的窗口概念与系统的窗口实现连接起来的类。关于 `Window` 实现的细节，请参见 [www.stroustrup.com/programming.xhtml](http://www.stroustrup.com/programming.xhtml)\
  \ 上的 `Window.h`。\n\n我们的按钮在 `Simple_window` 的构造函数中初始化：\n\n点击此处查看代码图像\n\n```cpp\n\
  Simple_window::Simple_window(Point xy, int w, int h, const string& title)\n    \
  \    : Window(xy,w,h,title),\n        next_button(Point{x_max()−70,0}, 70, 20, \"\
  Next\", []{})\n{\n        attach(next_button);\n}\n```\n\n不出意料的是，`Simple_window`\
  \ 将其位置（`xy`）、尺寸（`w`,`h`）和标题（`title`）传递给 `Graph_lib` 的 `Window` 处理。接下来，构造函数初始化 `next_button`，其位置（`Point{x_max()−70,0}`；大约在右上角）、尺寸（`70`,`20`）、标签（`\"\
  Next\"`）以及一个操作 `[]{}`。前四个参数与我们对 `Window` 所执行的操作完全对应：我们在屏幕上放置一个矩形形状并对其标记标签。\n\n`[]{}`\
  \ 是最小的操作。它是一个*lambda* 表达式（§13.3.3, §21.2.3），表示不需要执行任何操作。这意味着在按钮被按下（“点击”）后，处理将继续进行。我们在程序中定义的、由系统响应某些用户操作（例如“点击”按钮）而调用的操作称为*回调*（callback）。也就是说，系统回调到我们的程序中。在这里，`[]()`\
  \ 表示“什么都不做并继续”。大多数回调都会做更多事情。\n\n在显示这段代码之前，让我们考虑一下这里正在发生什么：\n\n![系统回调程序时的流程图。](img/f0415-01.jpg)\n\
  \n我们的程序运行在几层软件*层*之上。它直接使用我们使用 Qt 实现的图形/GUI 库。Qt 反而是使用操作系统接口实现的。在操作系统中还有更多层，直到我们到达设备驱动程序，驱动程序将像素放置在我们的屏幕上并跟踪我们鼠标的操作。这种分层有助于我们管理复杂的系统，让我们能够一次只关注某一个——或仅少数几个——层。\n\
  \n#### 14.3.1 等待循环\n\n所以，在我们这个——最简单的案例中，我们希望 `Simple_window` 在每次按钮被“按下”时做什么呢？我们希望停止程序的执行，以便我们有机会看到我们拥有的东西。像大多数\
  \ GUI 系统一样，Qt 提供了一个函数来挂起程序，直到某些事情发生。Qt 的版本是 `exec()`，当程序感兴趣的任何事情发生时，它会唤醒我们的程序。在这种情况下，通过将\
  \ `next_button` 附加到 `window`，我们对按钮的“点击”表示兴趣。\n\n点击此处查看代码图像\n\n```cpp\n// ... 创建对象和/或操作对象，在窗口显示它们\n\
  win.wait_for_button();\n```\n```cpp\nvoid Simple_window::wait_for_button()     \
  \    // 等待按钮被按下\n{\n        get_impl().wait_button(&next_button);      // 将 &next_button\
  \ 传递给 Window 实现\n}\n```\n\n这看起来很简单，但这里隐藏着巨大的复杂性。例如，代码适用于 MacOS、iOS、Linux 和 Windows。在我们的接口库中，Qt\
  \ 特定的代码被隐藏在 `WidgetPrivate` 类中，它是 `Window` 类的一部分。\n\n### 14.4 按钮和其他 Widget\n\n我们这样定义\
  \ `Button`：\n\n点击此处查看代码图像\n\n```cpp\nusing Callback = std::function<void()>;   \
  \        // 回调没有参数且没有返回值\n\nstruct Button : Widget {\n       Button(Point xy, int\
  \ w, int h, string& label, Callback cb);\n       void attach(Window&);\n};\n```\n\
  \n**CC**\n\n所以，`Button` 是一个具有位置（`xy`）、尺寸（`w`,`h`）、文本标签（`label`）和回调（`cb`）的 `Widget`。基本上，出现在屏幕上并关联操作（例如回调）的东西都是\
  \ `Widget`。\n\n#### 14.4.1 Widget\n\n是的，*widget* 确实是一个技术术语。widget 更具描述性但较缺乏感染力的名称是*控件*（control）。我们使用\
  \ widget 通过 GUI（图形用户界面）与程序交互的形式定义。我们的 `Widget` 接口类看起来如下：\n\n\n\n\n\n```\nclass Widget\
  \ {\n        // Widget is a handle to a QWidget - it is *not* a QWidget\n      \
  \  // We keep our interface classes at arm’s length from Qt\npublic:\n        Widget(Point\
  \ xy, int w, int h, const string& s, Callback cb);\n\n        Widget& operator=(const\
  \ Widget&) = delete;         // don’t copy Widgets\n        Widget(const Widget&)\
  \ = delete;\n\n        virtual void move(int dx,int dy);\n        virtual void hide();\n\
  \        virtual void show();\n        virtual void attach(Window&) = 0;\n\n   \
  \     Point loc;\n        int width;\n        int height;\n        string label;\n\
  \        Callback do_it;                                                       //\
  \ the action\n\n        virtual ~Widget();\n\n        WidgetPrivate& get_impl()\
  \ const { return *impl; }\nprivate:\n        std::unique_ptr<WidgetPrivate> impl;\n\
  };\n```\n\n`Widget`类似于 `Shape`，但不同在于它可以执行涉及用户的操作。因此，它是一个稍微复杂的机制，与 GUI 引擎有更深层的集成。因此，尽管在接口和用法上有相似之处，但\
  \ `Widget` 并不是 `Shape`，反之亦然。\n\n`Widget` 有两个有趣的函数，我们可以将其用于 `Button`（也适用于任何其他派自 `Widget`\
  \ 的类，例如 `Menu`；见 §14.5.2）：\n\n* `hide()` 让 `Widget` 不可见。\n* `show()` 让 `Widget`\
  \ 可见。\n\n`Widget` 初始状态是可见的。\n\n就像 `Shape` 一样，我们可以在 `Window` 中 `move()` 一个 `Widget`，并且在使用之前必须将其\
  \ `attach()` 到一个 `Window`。注意，我们将 `attach()` 声明为纯虚函数（§12.3.5）：每个派自 `Widget` 的类都必须定义附加到\
  \ `Window` 的含义。事实上，是在 `Window::attach()` 中创建了系统级组件。`Widget::attach()` 和 `Shape::attach()`\
  \ 函数是从 `Window` 调用的，作为其对 `Window` 自身 `attach()` 实现的一部分。基本上，连接窗口和组件是一场精细的小舞蹈，每个部分都必须完成自己的职责。结果是窗口知道它的组件，而每个组件也知道所属的窗口：\n\
  \n![一张图将两个组件连接到窗口。](img/f0417-01.jpg)\n\n注意，`Window` 并不知道它处理的是什么类型的 `Widget`。正如\
  \ §12.5 所述，我们使用基础的面向对象编程来确保 `Window` 能够处理各种类型的 `Widget`。同样，`Widget` 也不知道它处理的是什么类型的\
  \ `Window`。\n\n我们处理得有点粗略，留下了数据成员的可访问。然而，替代方案是添加 10 个访问函数，这在本质上没有语义收益。`impl` 成员是\
  \ `Widget` 连接到其 Qt 实现的。用户界面类 `Widget` 的用户没有理由干涉它的实现，因此我们将其保持为 `private`。`Widget`\
  \ 是一个无法拷贝的唯一对象的接口——它代表屏幕上的一个区域以及与之相关的操作——因此我们 `delete` 了它的拷贝操作（§12.4.1）。\n\n####\
  \ 14.4.2 Button\n\n`Button` 是我们处理的最简单的 `Widget`。它所做的只是在我们点击它时调用一个回调：\n\n点击此处查看代码图\n\
  \n```\nclass Button : public Widget {\npublic:\n        Button(Point xy, int ww,\
  \ int hh, const string& s, Callback cb);\n        void attach(Window&) {}\n};\n\
  Button::Button(Point xy, int w, int h, const string& label, Callback cb)\n     \
  \   :Widget(xy,w,h,label,cb)\n{\n        WidgetPrivate& w_impl = get_impl();\n \
  \       QPushButton* button = new QPushButton();\n        w_impl.widget = button;\n\
  \        button−>setText(QString::fromStdString(label));\n        QObject::connect(button,\
  \ &QPushButton::clicked, [this]{ do_it(); });\n}\n```\n\n就是这样。构造函数包含了所有（相对）混乱的连接\
  \ Qt 的代码。目前，请只需注意定义一个简单的 `Widget` 并不特别困难。`connect()` 的调用是最有趣的：它表示当有人点击按钮时，将调用回调\
  \ `do_it()`。\n\n**AA**\n\n我们不处理按钮（以及其他 `Widget`）在屏幕上看起来如何的这个相当复杂且混乱的问题。问题在于选择是近乎无限，且某些样式是由特定系统强制要求的。此外，从编程技术的角度来看，表达按钮的外观并不需要任何新东西。如果你感到无所适从，我们注意到在按钮上方放置一个\
  \ `Shape` 不会影响按钮的功能——而且你知道如何让一个形状看起来像任何东西。\n\n#### 14.4.3 In_box and Out_box\n\n\
  我们提供了一个 `Widget` 用于将文本输入到我们的程序中。\n\n点击此处查看代码图\n\n```\nstruct In_box : Widget {\n\
  \      In_box(Point xy, int w, int h, const string& s, Callback cb);\n\n      int\
  \ get_int();\n      string get_string();\n\n      int get_keep_open();\n      string\
  \ get_keep_open();\n\n      void attach(Window& win) override;\n\n      void dismiss();\n\
  \      void hide() override;\n      void show() override;\n      void hide_buttons();\n\
  \n      enum State {idle, rejected};\n      State last_result();\n      string last_string;\n\
  \      int last_int = 0;\n   };\nprivate:\n       ResultData result;\n      bool\
  \ waiting = false;\n};\n```\n\n`In_box` 可以接受输入到它的文本，我们可以使用 `get_string()` 将文本作为字符串读取，或使用\
  \ `get_int()` 将作为整数读取。我们可以通过按下回车/确认键告知 `In_box` 我们已完成。或者，我们可以弹出一个按钮让用户点击（使用 `show_buttons()`）。接受输入并生成输出的框通常被称为对话框。\n\
  \n我们的 `In_box` 稍微有点复杂——显然如此——因为它支持超出本书书范围的对话框变体，例如弹出对话框。我们应该宽容这种复杂性，因为明年或以后我们可能是“其他用户”。\n\
  \n`Out_box` 用于向用户展示信息。类似于 `In_box` 的 `get` 函数，我们可以向 `Out_box` `put` 整数或字符串：\n\n\
  点击此处查看代码图\n\n```\nstruct Out_box : Shape {\n       enum Kind { horizontal, vertical\
  \ };\n       Out_box(Point p, const string& s, Kind k = horizontal);\n\n       void\
  \ set_parent_window(Window* win) override;\n\n       void put(int);\n       void\
  \ put(const string&);\n       void draw_specific(Painter& painter) const override;\n\
  \n       Text label;\n       Text data;\n       Kind orientation;              //\
  \ Label 在数据之前还是上方？\n};\n```\n\n`Out_box` 比 `In_box` 简单得多因为它不需要与用户交互，它只是显示一个值。因此，`Out_box`\
  \ 是一个 `Shape`，而 `In_box` 是一个 `Widget`。\n\n**AA**\n\n我们可以提供 `get_floating_point()`、`get_complex()`\
  \ 等，但我们没有，因为你可以将字符串放入 **stringstream**，并以那种方式进行任何喜欢的输入格式化（§9.11）。\n\n§14.5 给出了 `In_box`\
  \ 和 `Out_box` 使用的示例。\n\n#### 14.4.4 Menu\n\n我们提供了一个非常菜单概念：\n\n点击此处查看代码图\n\n\n\n\n\
  \n```cpp\nstruct Menu : Widget {\n       enum Kind { horizontal, vertical };\n \
  \      Menu(Point xy, int w, int h, Kind kk, const string& label);\n\n       using\
  \ Window::attach;                             // 将菜单附加到窗口\n\n       int attach(Button&\
  \ b);                               // 将具名按钮附加到菜单\n       int attach(unique_ptr<Button>\
  \ p);            // 将无命名按钮附加到菜单\n\n       void show()                          \
  \                    // 显示所有按钮\n       {\n               for (auto&& x : selection)\n\
  \                       x−>show();\n       }\n\n       void hide()             \
  \                                  // 隐藏所有按钮\n       {\n               for (auto&&\
  \ x : selection)\n                       x−>hide();\n       }\n\n       void move(int\
  \ dx, int dy)                          // 移动所有按钮\n       {\n               for (auto&&\
  \ x : selection)\n                       x−>move(dx,dy);\n       }\n\nprivate:\n\
  \       Vector_ref<Button> selection;\n       Kind k;\n       int offset;\n\n  \
  \     void layoutButtons(Button& b);                // 水平或垂直布局\n       void layoutMenu();\
  \                                  // 告诉 Widget 菜单在窗口中的位置\n};\n```\n\n一个 `Menu`\
  \ 本质上是一个按钮向量。按照惯例，`Point xy` 是左上角。宽度和高度用于在按钮被添加到菜单时对其进行尺寸调整。示例请参阅 §14.5 和 §14.5.2。每个菜单按钮（即“菜单项”）都是一个独立的\
  \ `Widget`，作为 `attach()` 的参数传递给 `Menu`。反之，`Menu` 提供了一个 `attach()` 操作，以便将其所有的 `Button`\
  \ 附加到 `Window`。`Menu` 使用 `Vector_ref` (§11.7.3) 来跟踪它的 `Button`。如果你想要一个“弹出式”菜单，你需要自己实现；请参阅\
  \ §14.5.2。\n\n## 14.5 示例：绘制线条\n\n为了更好地感受基础 GUI 功能，考虑一个包含输入、输出和少量图形的简单应用程序窗口：\n\n\
  ![Canvas 窗口的，显示了坐标和三条线条。](img/f0421-01.jpg)\n\n该程序允许用户显示一组由坐标对序列指定的线条（一条开放多段线； §11.6.1）。其思路是让用户反复在“next_xy”框中输入\
  \ `x`、`y` 坐标。例如，`100,200`。注意需要逗号，且不接受括号。在输入完每个坐标对后，用户按下键盘上的回车/Enter 键。上方的窗口显示了输入四个坐标对后的结果：`*(50,50)*`、`*(100,100)*`、`*(100,200)*`、`*(200,100)*`。\n\
  \n最初，“current (x,y)”框是空的，程序等待用户输入第一个坐标对。完成后，起点会出现在“current (x,y)”框中，每输入一个新的坐标对，就会绘制一条线：从当前点（其坐标在“current\
  \ (x,y)”框中显示）到新输入的 `x`, `y` 画一条线，然后该 `x`, `y` 变成新的当前点。\n\n这绘制出了一条开放多段线。当用户厌倦了这个活动时，有一个“Quit”按钮用于退出。这非常直观，程序练习了几个实用的\
  \ GUI 功能：文本输入和输出、线条绘制以及多个按钮。\n\n让我们定义一个类来表示此类窗口。它非常直观：\n\n点击查看代码图像\n\n```cpp\nstruct\
  \ Lines_window : Window {\n       Lines_window(Application& application, Point xy,\
  \ int w, int h, const string& title);\n       Open_polyline lines;\n       void\
  \ wait_for_button();\n\nprivate:\n        Application* app = nullptr;\n        Button\
  \ quit_button;                    // 一个 Widget\n        In_box next_xy;        \
  \                // 一个 Widget\n        Out_box xy_out;                       //\
  \ 一个 Shape\n        void next();\n        void quit();\n};\n```\n\n线条被表示为 `Open_polyline`。按钮和框被声明出来（作为\
  \ `Button`、`In_box` 和 `Out_box`），并为每个按钮定义了一个实现所需操作的成员函数。我们决定消除“样板代码”回调函数并转而使用 lambda\
  \ 。\n\n`Lines_window` 的构造函数初始化了一切：\n\n点击查看代码图像\n\n```cpp\nLines_window::Lines_window(Application&\
  \ application, Point xy, int w, int h, const string & title)\n        : Window{\
  \ xy,w,h,title },\n                app(application),\n                quit_button{\
  \ Point{x_max() − 70,0}, 70, 20, \"Quit\", [this]() { quit(); } },\n           \
  \     next_xy{ Point{250,0}, 50, 20, \"next xy:\", [this]() { next(); } },\n   \
  \             xy_out{ Point{10,10}, \"current (x,y): \" }\n{\n        attach(lines);\n\
  \        attach(quit_button);\n\n        next_xy.hide_buttons();               \
  \     // Qt 输入框带有按钮；我们决定隐藏它们\n        attach(next_xy);\n        next_xy.show();\
  \                               // 但我们希望框本身显示\n\n        xy_out.label.set_size(8);\
  \          // 使用比默认小的字体\n        xy_out.data.set_size(8);\n        attach(xy_out);\n\
  }\n```\n\n也就是说，每个 `Widget` 和 `Shape` 都被构造并附加到窗口。注意初始化器的顺序与数据成员的定义顺序相同。这是编写初始化器的正确顺序。事实上，成员初始化总是按照数据成员声明的顺序执行。如果指定的基类或成员构造顺序不对，某些编译器会热心地给出警告。\n\
  \n“Quit”按钮使用 Qt 功能删除 `Window`：\n\n点击查看代码图像\n\n```cpp\nvoid Lines_window::quit()\n\
  {\n        end_button_wait();           // 不等待\n        next_xy.dismiss();     \
  \       // 清理\n        app−>quit();\n}\n```\n\n所有的实际工作都在 `next_xy` 按钮的 `next()`\
  \ 中完成：它读取坐标对，更新 `Open_polyline` 并更新位置：\n\n```cpp\nvoid Lines_window::next()    \
  \         // 当 next_xy 被唤醒时执行的操作\n        if (next_xy.last_result() == In_box::accepted)\
  \ {// 检查值是否变化\n                string s = next_xy.last_string_value();// 读取坐标对\n\
  \                istringstream iss{ s };\n                int x = 0;\n         \
  \       char ch = 0;\n                int y = 0;\n                iss >> x >> ch\
  \ >> y;\n                lines.add(Point{ x,y });\n\n                ostringstream\
  \ oss;                               // 更新位置读数\n                oss << '(' << x\
  \ << ',' << y << ')';\n                xy_out.put(oss.str());\n        }\n     \
  \   next_xy.clear_last_result();                                   // 清空框\n}\n```\n\
  \n那么这个程序有什么奇怪和不同之处？让我们来看看它的 `main()`：\n\n\n\n\n\n```cpp\n#include \"GUI.h\"\n\n\
  int main()\ntry{\n        Application app;                                     \
  \                         // 创建一个 GUI 应用程序\n        Lines_window win {app,Point{100,100},600,400,\"\
  lines\"};       // 我们的窗口\n        return app.gui_main();                       \
  \                                    // 启动 GUI 应用程序\n}\ncatch(exception& e) {\n\
  \         cerr << \"exception: \" << e.what() << '\\n';\n         return 1;\n}\n\
  catch ( ...) {\n         cerr << \"Some exception\\n\";\n         return 2;\n}\n\
  ```\n\n那里基本上什么都没有！`main()` 的体体只是我们窗口 `win` 的定义，其之前是创建 Qt GUI 应用程序的请求，之后是把控制权移交给\
  \ GUI 系统的调用。这里没有其他的函数、`if`、`switch` 或循环——没有看到我们在 第 5 章 和 第 6 章 中看到的那些代码——只是一个变量的定义以及对\
  \ GUI 系统主循环 `gui_main()` 的调用，而这仅仅是一个无限循环。\n\n除了我们看到的几个实现细节外，我们已经看到了让我们的“lines”程序运行的所有代码。我们已经看到了所有的基础逻辑。那么发生了什么呢？\n\
  \n### 14.5.1 控制反转\n\n### CC\n\n发生的情况是我们将执行顺序的控制权从程序转移到了部件（widgets）：用户激活哪个部件，哪个部件就运行。例如，点击一个按钮，它的回调函数就会运行。当该回调返回时，程序恢复稳定状态，等待用户做其他事情。基本上，调用\
  \ `app.exec()` 是告诉“系统”监视部件并调用相应的回调。在理论上，`app.exec()` 可以告诉你（程序员）哪个部件请求了关注，并由你来调用相应的函数。然而，在\
  \ Qt 和大多数其他 GUI 系统，`app.exec()` 仅仅是调用相应的回调，省去了你编写代码来选择它的麻烦。\n\n一个“常规程序”的结构如下：\n\n\
  ![一张流程图显示了常规程序的流程。在这个程序中，应用程序调用输入函数，由输入函数提示用户如何响应。](img/f0424-01.jpg)\n\n一个“GUI\
  \ 程序”的结构如下：\n\n![一张流程图显示了 GUI 程序的流程。在这个程序中，用户点击系统，系统回调应用程序，应用程序为系统设置一个回调。](img/f0424-02.jpg)\n\
  \n### XX\n\n这种“控制反转”的影响之一是，执行顺序完全由用户的操作决定。这使得程序组织和调试都变得复杂。很难想象用户会做什么，也很难想象随机回调序列的所有可能结果。这使得系统测试变成了一场噩梦。处理\
  \ GUI 测试的技术超出了本书的范围，但我们鼓励你对通过回调用户驱动的代码格外小心。除了显而易见的控制流问题外，还存在可见性问题以及跟踪哪个部件连接到什么数据的困难性。为了尽量减少麻烦，保持程序\
  \ GUI 部分的简单，并增量地构建 GUI 程序、在每个阶段进行测试是至关重要的。在编写 GUI 程序时，绘制对象及其相互作用的小图几乎是必不可少的。\n\n\
  由各种回调触发的代码是如何通信的？最简单的方法是让函数对存储在窗口中的数据操作，正如 §14.5 中的示例所示。在那里，通过点击“Next point”按钮调用的\
  \ `Lines_window` 的 `next()` 函数，从 `In_box` (`next_xy`) 中读取数据并更新 `lines` 成员变量和 `Out_box`。显然，回调调用的函数可以做任何事情：它可以打开文件、连接网络等。然而，目前我们只考虑在窗口中持有数据。\n\
  \n### 14.5.2 添加菜单\n\n让我们通过为“lines”程序提供一个菜单来探索由“控制反转”引发的控制和通信问题。首先，我们将提供一个允许用户更改所有\
  \ `lines` 颜色的菜单。我们添加 `color_menu` 及其回调：\n\n点击此处查看图像\n\n```cpp\nstruct Color_window\
  \ : Lines_window {\n       Color_window(Application& app, Point xy, int w, int h,\
  \ const string& title);\n       void change(Color c) { lines.set_color(c); }\nprivate:\n\
  \       Button menu_button;\n};\n```\n\n定义了 `color_menu` 成员后，我们需要初始化它：\n\n点击此处查看图像\n\
  \n```cpp\nColor_window::Color_window(Application& app, Point xy, int w, int h, const\
  \ string& title)\n        : Lines_window{ app,xy,w,h,title },\n                color_menu{\
  \ Point{x_max() – 70,40},70,20,Menu::vertical,\"color\" }\n{\n        color_menu.attach(make_unique<Button>(\
  \ Point{0,0},0,0,\"red\", [&] { change(Color::red); } ));\n        color_menu.attach(make_unique<Button>(\
  \ Point{0,0},0,0,\"blue\",[&] { change(Color::blue); } ));\n        color_menu.attach(make_unique<Button>(\
  \ Point{0,0},0,0,\"black\",[&] { change(Color::black); } ));\n        attach(color_menu);\n\
  }\n```\n\n按钮动态地附加到菜单中（使用 `attach()`），并根据需要移除或替换。`Menu::attach()` 会调整按钮的大小和位置并将其附加到窗口。这就是全部。在输入几个坐标对并按下“red”后，我们得到：\n\
  \n![一个显示坐标和三条彩色线的 Canvas 窗口截图。](img/f0425-01.jpg)\n\n在尝试了一段时间后，我们决定真正想要的是“弹出菜单”；也就是说，我们不想在不使用菜单时也浪费宝贵的屏幕空间来显示它。因此，我们添加了一个“颜色菜单”按钮；按下它，颜色菜单就会弹出来。当我们做出选择后，菜单再次隐藏，按钮重新出现。\n\
  \n\n\n\n\n```cpp\nstruct Color_window : Lines_window {\n        Color_window(Application&\
  \ app, Point xy, int w, int h, const string& title);\nprivate:\n        void change(Color\
  \ c) { lines.set_color(c); }\n        void hide_menu() { color_menu.hide(); menu_button.show();\
  \ }\n\n        Button menu_button;\n        Menu color_menu;\n};\n\nColor_window::Color_window(Point\
  \ xy, int w, int h, const string& title)\n        :Lines_window{ xy,w,h,title },\n\
  \        menu_button{ Point{x_max() − 80,30}, 80, 20, \"color menu\",\n        \
  \        [&] { menu_button.hide(); color_menu.show(); } },\n        color_menu{\
  \ Point{x_max() − 70,40},70,20,Menu::vertical,\"color\" }\n{\n        attach(color_menu);\n\
  \        color_menu.attach(make_unique< Button>(Point{0,0},0,0,\"red\",\n      \
  \          [&] { change(Color::red); hide_menu(); }));\n        color_menu.attach(make_unique<\
  \ Button>(Point{0,0},0,0,\"blue\",\n                [&] { change(Color::blue); hide_menu();\
  \ }));\n        color_menu.attach(make_unique< Button>(Point{0,0},0,0,\"black\"\
  ,\n                [&] { change(Color::black); hide_menu(); }));\n        attach(menu_button);\n\
  \        hide_menu();\n}\n```\n\n注意除了构造函数外，所有内容都是私有的。基本上，这个 `Window` 类就是程序。所有发生的事情都是通过它的回调函数发生的，因此不需要来自窗口外部的代码。\n\
  \n### 14.6 简单动画\n\n`Button`、`Text` 和 `Menu` 都非常非常好用，但它们是静态的：没有任何东西在移动！嗯，我们可以加载一些带有动作的图像，但根据目前为止提供的设施，我们能做的最好的就是每当我们点击按钮时让某些东西移动。然而，`Window`\
  \ 提供了一种等待一段时间后进行重绘的机制。如果我们利用机会在重绘之前改变窗口的内容，我们就能实现动画。这是一个每两秒变化一次的简单红绿灯。首先我们定义窗口：\n\
  \n点击此处查看代码图片\n\n```cpp\nWindow w{140, 240, \"Traffic light\"};\n\nRectangle r{{10,\
  \ 10}, 120, 220};\nr.set_fill_color(Color::black);\n\nCircle red {{70, 50}, 30};\n\
  Circle amber {{70, 120}, 30};\nCircle green {{70, 190}, 30};\n```\n\n附加这四个 `Shape`，我们就有了一个静态的\
  \ `Window`。然而，我们现在可以添加动作：\n\n点击此处查看代码图片\n\n```cpp\nconst int second = 1000;    \
  \      // 1000 毫秒 == 1 秒\nconst int yellow_delay = second;\nconst int red_green_delay\
  \ = 120*second;\n\nwhile (true)\n    for (int i = 0; i < 3; ++i) {\n        red.set_fill_color(Color::red);\n\
  \        w.timer_wait(red_green_delay);\n\n        amber.set_fill_color(Color::yellow);\n\
  \        w.timer_wait(yellow_delay);\n\n        red.set_fill_color(Color::black);\n\
  \        amber.set_fill_color(Color::black);\n        green.set_fill_color(Color::green);\n\
  \        w.timer_wait(red_green_delay);\n\n        amber.set_fill_color(Color::yellow);\n\
  \        green.set_fill_color(Color::black);\n        w.timer_wait(yellow_delay);\n\
  \n        amber.set_fill_color(Color::black);\n    }\n```\n\n现在红绿灯从红色缓慢地变为黄色，再变为绿色循环：\n\
  \n![显示彩色圆形的四个窗口的截图。](img/f429-01)\n\n`w.timer_wait(yellow_delay)` 仅仅是等待 10,000 毫秒（十秒）：\n\
  \n点击此处查看代码图片\n\n```cpp\nvoid Window::timer_wait(int milliseconds)\n{\n        impl->timer_wait(milliseconds);\n\
  }\n```\n\n你也可以添加一个动作（回调）作为参数。该动作会在延迟后被调用。\n\n点击此处查看代码图片\n\n```cpp\nvoid Window::timer_wait(int\
  \ milliseconds, std::function<void()> cb)\n{\n        impl->timer_wait(milliseconds,\
  \ cb);\n}\n```\n\n回调模型的好处之一是“系统”会留意其他动作。这样一来，`Button`、`Menu` 等就能工作。红绿灯的例子是我们能想到的最简单的，但我们相信你还能想出更多的例子。记住，一个应用程序可以有多个窗口，所以我们可以运行好几个动画。此外，在两次\
  \ `timer_wait()` 之间，我们可以更新几个不同的内容。\n\n### 14.7 调试 GUI 代码\n\n一旦 GUI 程序运行，调试它通常是容易的：所见即所得。然而，在窗口开始出现之前，通常会有一个令人沮丧的时期。尝试\
  \ `main()`：\n\n点击此处查看代码图片\n\n```cpp\nint main()\n{\n        Application app;\n \
  \       Lines_window {100,100},600,400,\"lines\"};\n        app.gui_main();\n}\n\
  ```\n\n你看到错误了吗？无论你看到没看到，程序都会编译并运行，但你得到的只是窗口上的一次闪烁。你有什么方法找到这种程序中的错误呢？\n\n* 通过仔细检查所有代码（类、函数）\n\
  * 通过简化新代码，逐行查看代码\n* 通过检查所有设置\n* 通过与已运行的程序对比\n* 向朋友解释代码\n\n你发现最困难的是跟踪代码的执行。如果你已经学会了使用调试器，你就有机会，但在这种情况下仅仅插入输出语句是无效的——因为没有输出。即使是调试器也会遇到问题，因为有多个事情同时发生（多线程）——你的代码并不是唯一在与屏幕交互的代码。简化代码和系统地理解代码是关键。\n\
  \n那么问题出在哪里？这里是正确的版本（来自 #14.5)\n\n点击此处查看代码图片\n\n```cpp\nint main()\n{\n        Application\
  \ app;\n        Lines_window win {100,100},600,400,\"lines\"};\n        app.gui_main();\n\
  }\n```\n\n我们“忘记”了 `Lines_window` 的名称 `win`。由于我们并不需要那个名字，这看起来是合理的，但编译器随后认为既然我们没有使用那个窗口，就可以立即将其销毁。哎！那个窗口只存在了毫秒级的时间。难怪我们会错过它。\n\
  \n另一个常见问题是将一个窗口*精确地*叠在另一个窗口上。这显然地（或者说完全不明显）看起来只有一个窗口。另一个窗口去哪了？我们可能会花费大量时间寻找代码中不存在的\
  \ Bug。如果我们把一个形状叠在另一个形状上，也会发生同样的问题。\n\n最后——更糟糕的是——当我们使用 GUI 库时，异常并不总是像我们希望的那样工作。由于我们的代码是由\
  \ GUI 库管理的，我们抛出的异常可能永远无法到达我们的处理器——库或操作系统可能会“吃掉”它。也就是说，它们可能依赖于与 C++ 异常不同的错误处理机制，并且可能对\
  \ C++ 异常一无所知）。调试期间发现的常见问题包括 `Shape` 和 `Widget` 因为没有附加而不显示，以及对象因为超出作用范围而行为异常。考虑程序员可能会如何提取菜单中按钮的创建和附加逻辑。\n\
  \n\n\n\n\n```cpp\nvoid load_disaster_menu(Menu& m)       // 将按钮加载到菜单的辅助函数\n{\n \
  \       Point orig {0,0};\n        Button b1 {orig,0,0,\"flood\",cb_flood};\n  \
  \      Button b2 {orig,0,0,\"fire\",cb_fire};\n        // ...\n        m.attach(b1);\n\
  \        m.attach(b2);\n        // ...\n}\n\nint main()\n{\n        // ...\n   \
  \     Menu disasters {Point{100,100},60,20,Menu::horizontal,\"disasters\"};\n  \
  \      load_disaster_menu(disasters);\n        win.attach(disasters);\n        //\
  \ ...\n}\n```\n\n这种行不可通。所有这些按钮都是 `load_disaster_menu` 函数的局部变量，将它们附加到菜单上不会改变这一点。故事的核心在于，在\
  \ `load_disaster_menu()` 返回后，这些局部对象已经被销毁，而 `disasters` 菜单指向的是不存在（已销毁）的对象。结果很可能是令人惊讶且不理想的。编译器可以也应该捕捉此类错误，但遗憾的是并非所有编译器都能做到。解决方案是使用由\
  \ `make_unique` 创建的匿名对象，而不是命名的局部对象：\n\n点击此处查看代码图像\n\n```cpp\nvoid load_disaster_menu(Menu&\
  \ m)\n        // 将按钮加载到菜单的辅助函数\n{\n        Point orig {0,0};\n        m.attach(make_unique<Button>(orig,0,0,\"\
  flood\",cb_flood));\n        m.attach(make_unique<Button>(orig,0,0,\"fire\",cb_fire));\n\
  \        // ...\n}\n```\n\n正确的解决方案比这个（极其常见的）错误还要简单得多。\n\n### 训练 (Drill)\n\n[1] 创建一个全新的项目，并设置适用于\
  \ Qt 的链接器选项（[www.stroustrup.com/program-ming.xhtml](http://www.stroustrup.com/program-ming.xhtml)）。\n\
  \n[2] 使用 `Graph_lib` 的功能，输入第 §14.5 节 中的线条绘制程序并运行。\n\n[3] 修改程序以使用第 §14.5.2 节 的弹出菜单并运行它。\n\
  \n[4] 修改程序，添加第二个用于选择线条样式的菜单并运行它。\n\n### 复习 (Review)\n\n[1] 你为什么想要一个图形用户界面（GUI）？\n\
  \n[2] 什么情况下你会想要非图形用户界面？\n\n[3] 什么是软件层？\n\n[4] 你为什么想要对软件进行分层？\n\n[5] 什么是回调（callback）？\n\
  \n[6] 什么是控件（widget）？\n\n[7] Qt 是一个缩写吗？\n\n[8] Qt 如何读音？\n\n[9] 你听过其他哪些 GUI 工具包？\n\
  \n[10] 哪些系统使用 `widget` 术语，哪些系统倾向于使用 `control`？\n\n[11] 控件有哪些示例？\n\n[12] 你什么时候会使用收件箱（inbox）？\n\
  \n[13] 收件箱中存储的值的类型是什么？\n\n[14] 你什么时候会使用按钮？\n\n[15] 你什么时候会使用菜单？\n\n[16] 什么是控制反转（control\
  \ inversion）？\n\n[17] 调试 GUI 程序的基本策略是什么？\n\n[18] 为什么调试 GUI 程序比调试使用流进行 I/O 的普通程序更困难？\n\
  \n[19] 如何让控件动起来？\n\n### 术语 (Terms)\n\n| `Button` | 对话框 | 可见/隐藏 | 回调 |\n| --- | ---\
  \ | --- | --- |\n| GUI | 等待输入 | 控制台/O | GUI/O |\n| 菜单 | 等待循环 | 控制 | 软件 |\n| 层 |\
  \ 控件 | 浏览器/O | `Application` | `In_box` |\n| `Out_box` | 动画 | `timer_wait()` | |\n\
  \n### 练习 (Exercises)\n\n[1] 创建一个 `My_window`，它与 `Simple_window` 类似，但它有两个按钮：`next`\
  \ 和 `quit`。\n\n[2] 创建一个窗口（基于 `My_window`），带有一个 4x4 的棋盘布局按钮。按下时，按钮会执行一个简单的操作（例如在输出框中打印其坐标），或者变为略有不同的颜色（直到另一个按钮被按下）。\n\
  \n[3] 在 `Button` 之上放置一个 `Image`；当按钮按下时，移动两者。使用来自 `PPP__support` 的此随机数生成器为“图像”选择一个新位置：点击此处查看代码\n\
  \n```cpp\ninline int rand_int(int min, int max)\n{\n        static default_random_engine\
  \ ran;\n        return uniform_int_distribution<min,max}(ran);\n}\n```\n它返回 `min,max`\
  \ 范围内的随机 `int`。\n\n[4] 创建一个菜单，其项目分别绘制圆、正方形、等边三角形和六边形。创建一个输入框（或两个）来提供坐标对，并在按下菜单项时在相应的坐标处放置该形状。抱歉，不支持拖放。\n\
  \n[5] 编写一个程序，绘制你选择的形状，并在每次点击“Next”时将其移动到一个新点。新点应通过从输入流读取的坐标对来确定。\n\n[6] 创建一个带指针的模拟时钟。从操作系统获取时间。提示：`chrono::now()`、`sleep()`。\n\
  \n[7] 使用之前章节的技术，制作一个会“飞行的”图像。提供“Start”和“Stop”按钮。\n\n[8] 创建一个汇率转换器。从文件读取汇率。\n\n[9]\
  \ 修改第 6 节](#ch06.xhtml_ch06) 中的程序，从输入框获取金额。\n\n[10] 创建一个可以为一组函数（如 `sin()` 和 `log()`）提供参数并在输出框中返回结果。\n\
  \nGUI 是一个巨大的话题。它的很大一部分与现有系统的兼容性有关。此外，许多种类的控件（例如提供数十种风格的 GUI）会让植物学家感到如鱼得水。然而，这些与基础编程技术几乎没有关系，因此我们不会沿着该方向进行。你应该注意的一点是，大多数\
