  \n[5] 执行测试并修复你在注释时遗漏的任何 bug。\n\n[6] 添加一个预定义名称 `k`。\n\n[7] 再次测试并修复你在注释时遗漏的任何 bug。\n\
  \n[8] 提供一个数的平方根功能。\n\n[9] 提供一个数的平方根功能。\n\n[10] 将“声明关键字”从 `let` 修改。\n\n[11] 将“退出关键字”从\
