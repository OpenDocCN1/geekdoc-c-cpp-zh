  \         ++cr;       // 错误：cr 是 const 类型\n}\n```\n\n如果你想修改传递的对象的值，你必须使用非 `const`\
  \ 引用：值传递会给你一个副本，而 `const` 引用传递会阻止你修改所传递对象的值。因此，我们可以尝试：\n\n点击此处查看代码图像\n\n```\nvoid\
  \ g(int a, int& r, const int& cr)\n{\n         ++a;                   // 修改局部变量\
  \ a\n         ++r;                   // 修改 r 引用的对象\n         int x = cr;       \
  \   // 读取 cr 引用的对象\n}\n\nint main()\n{\n         int x = 0;\n         int y = 0;\n\
  \         int z = 0;\n\n         g(x,y,z);             // x==0; y==1; z==0\n   \
  \      g(1,2,3);             // 错误：引用参数 r 需要一个变量来引用\n         g(1,y,3);        \
  \     // OK：由于 cr 是 const，我们可以传递字面量\n}\n```\n\n所以，如果你想修改通过引用传递的对象的值，你必须传递一个对象。从技术上讲，整数字面量\
  \ `2` 只是一个值（右值），而不是一个持有值的对象。`g()` 的参数 `r` 所需的是一个左值（lvalue），即可以出现在赋值表达式左侧的东西。\n\n\
  注意，`const` 引用不需要左值。它可以执行与初始化或值传递完全相同的类型转换。基本上，在最后一次调用 `g(1,y,3)` 中发生的情况是，编译器为 `g()`\
  \ 的参数 `cr` 预留了一个 `int` 用于引用：\n\n点击此处查看代码图像\n\n```\ng(1,y,3);      // 意味着 int compiler_generated\
  \ = 3; g(1,y, compiler_generated)\n```\n\n这种编译器生成的对象被称为*临时对象*（temporary object）或直接称为*临时变量*（temporary）。\n\
  \n## AA\n\n我们的经验法是：\n\n[1] 使用值传递传递非常小的对象。\n\n[2] 使用 `const` 引用传递你不需要修改的大型对象。\n\n\
  [3] 返回结果，而不是通过引用参数修改对象。\n\n[4] 仅在必须时才使用引用传递。\n\n这些规则能产生最简单、最不容易出错且效率最高的代码。我们说的“非常小”是指一个或两个\
  \ `int`、一个或两个 `double` 或类似的内容。\n\n第三条规则反映了当你想要使用函数来改变变量的值时，你有选择。考虑：\n\n点击此处查看代码图像\n\
  \n```\nint incr1(int a) { return a+1; }              // 返回新值作为结果\nvoid incr2(int&\
  \ a) { ++a; }                   // 修改作为引用传递的对象\n\nint x = 7;\nx = incr1(x);    \
  \          // 非常明显\nincr2(x);                    // 非常晦晦\n```\n\n## CC\n\n我们为什么会使用非\
  \ `const` 引用参数？偶尔，它们是至关重要的：\n\n*   用于操作容器（例如 `vector`）和其他大型对象\n\n*   用于需要改变多个对象的函数\n\
  \n例如：\n\n点击此处查看代码图像\n\n```\nvoid larger(vector<int>& v1, vector<int>& v2)\n    \
  \     // 将 v1 中的每个元素都变为 v1 和 v2 对应元素中的较大者；\n         // 同样，将 v2 中的每个元素都变为较小者\n{\n\
  \         if (v1.size()!=v2.size())\n                  error(\"larger(): different\
  \ sizes\");\n         for (int i=0; i<v1.size(); ++i)\n                  if (v1[i]<v2[i])\n\
  \                          swap(v1[i],v2[i]);\n}\n```\n\n对于像 `larger()` 这样的函数，使用引用传递参数（或逻辑等价项；19.3.2）是唯一的合理选择。\n\
  \n## AA\n\n如果我们使用引用是为了避免拷贝，我们就使用 `const` 引用。因此，当我们看到非 `const` 引用参数时，我们假设函数会改变其参数的值；也就是说，当我们看到非\
  \ `const` 引用传递时，我们假设该函数不仅可以修改传递的参数，而且会这样做，因此我们必须额外查看调用处，以确保它符合我们的预期。\n\n### 7.4.7\
  \ 参数检查\n\n传递参数是调用中的形式参数。考虑：\n\n点击此处查看代码图像\n\n```\ng(1,y,3);      // 意味着 int compiler_generated\
  \ = 3; g(1,y, compiler_generated)\n```\n\n这种编译器生成的对象被称为*临时对象*\n\n## XX\n\n转换通常很有用，但有时会产生意想不到的结果（参见\
  \ §2.9）。因此，我们必须对它们小心，并留意编译警告。例如：\n\n点击此处查看代码图像\n\n```\ng(7.8);                //\
  \ 将 7.8 截断为 7，你想这样做吗？\nint x = 7.8;         // 将 7.8 截断为 7，你想这样做吗？\n```\n\n如果你确实想将\
  \ `double` 值截断为 `int`，请明确说明。[CG: ES.46]。我们可以使用 Core Guidelines 中的窄操作，作为 `PPP_support`\
  \ 提供：`narrow<T>(x)`：检查 x，如果存在信息丢失则抛出 `narrowing_error`。例如：\n\n点击此处查看代码图像\n\n```\n\
  void conv1(double y)\n{\n         int x = narrow<int>(y);               // 检查转换\n\
  }\n```\n\n这样，下一个查看这段代码的程序员就能看到你考虑过这个问题，并且在信息丢失时会报错。另一方面，如果我们想要舍入，可以使用 `PPP_support`\
  \ 中的 `round_to()`。例如：\n\n点击此处查看代码图像\n\n```\nvoid conv2(double y)\n{\n         int\
  \ x = round_to<int>(y);             // 四舍五入\n}\n```\n\n在科学计算中，我们经常需要将整数转换为浮点值，反之亦然。你可以在我们的图形库中找到示例（§11.7.5\
  \ 和 §13.3）。对于 `int` 到 `double` 的转换，我们使用 `double(i)` 表示法。例如：\n\n点击此处查看代码图像\n\n```\n\
  void conv3(int x, int y)\n{\n         double z = double(x)/y;               // x/y\
  \ 会被截断\n}\n```\n\n## Try This\n\n尝试上述转换 `int`、`double` 和 `char` 的所有组合。使用值 `1001`、`7.7`\
  \ 和 `'x'`。尝试隐式转换和 `narrow` 转换。写出程序编译通过的结果。你得到了哪些错误和警告？\n\n#### 7.4.8 函数调用实现\n\n\n\
  \n\n但计算机到底是如何执行函数调用的呢？第 5 章和第 6 章中的`expression()`、`term()` 和 `primary()` 函数非常适合用来说明这一点，但有一个细节除：它们不接受任何参数，因此我们无法用它们来解释参数是如何传递的。等一下！它们*必须*接收某些输入；如果没有，它们就无法执行任何有用操作。它们确实接收了一个隐式参数：它们使用一个名为\
  \ `ts` 的 `Token_stream` 来获取输入；`ts`是一个全局变量。这有点狡猾。我们可以通过让它们接受一个 `Token_stream&` 参数来改进这些函数。这里是添加了\
  \ `Token_stream&` 参数并删除了所有与函数调用实现无关的内容。\n\n首先，`expression()` 完全直观易懂；它有一个参数（`ts`）和两个局部变量（`left`\
  \ 和 `t`）：\n\n点击此处查看代码图像\n\n```\ndouble expression(Token_stream& ts)\n{\n       \
  \  double left = term(ts);\n         Token t = ts.get();\n         // ...\n}\n```\n\
  \n其次，`term()` 与 `expression()` 非常相似，不同在于它有一个额外的局部变量（`d`），用于存储运算符 `'/'` 的除数的结果：\n\
  \n点击此处查看代码图像\n\n```\ndouble term(Token_stream& ts)\n{\n         double left = primary(ts);\n\
  \         Token t = ts.get();\n         // ...\n                  case '/’:\n  \
  \                {\n                           double d = primary(ts);\n       \
  \                    // ...\n                  }\n         // ...\n}\n```\n\n第三，`primary()`\
  \ 与 `term()` 非常相似，不同在于它没有局部变量 `left`：\n\n点击此处查看代码图像\n\n```cpp\ndouble primary(Token_stream&\
  \ ts)\n{\n         Token t = ts.get();\n         switch (t.kind) {\n         case\
  \ '(':\n                  {       double d = expression(ts);\n                 \
  \         // ...\n                  }\n                  // ...\n         }\n}\n\
  ```\n\n现在它们不再使用任何“狡猾的全局变量”了，并且非常适合我们的演示：它们有参数，有局部变量，并且彼此相互调用。你可能想借此机会复一下完整的 `expression()`、`term()`\
  \ 和 `primary()` 看起来什么样，但就函数调用而言，这里展示了其显著特征。\n\n**CC**\n\n当函数被调用时，语言实现会开留一个数据结构，称为*函数激活记录*（function\
  \ activation record），它包含了所有参数和局部变量的副本。例如，当 `expression()` 第一次被调用时，编译器会确保创建一个如下的结构：\n\
  \n![一个数据表列出了一次调用时数据结构的元素。](img/f0204-01.jpg)\n\n“实现相关的内容”随实现而异，但这些基本上是函数需要返回给调用者以及向调用者返回一个值所需的信息。每个函数都有其激活记录的详细布局。请注意，从实现的角度来看，参数只是另一个局部变量。\n\
  \n到目前为止一切正常，现在 `expression()` 调用了 `term()`，因此编译器确保为这次 `term()` 调用生成一个激活记录：\n\n![一个数据表列出了两次调用时数据结构的元素。](img/f0204-02.jpg)\n\
  \n注意，`term()` 有一个额外的变量 `d` 需要存储，因此即使代码可能永远不会使用到它，我们在调用中为它预留了空间。这没关系。对于合理的函数（例如我们在书中直接或间接使用的每个函数），设置函数激活记录的运行时代价并不取决于它的大小。局部变量\
  \ `d` 只有在我们执行它的 `case ’/’` 时才会被初始化。接下来，`term()` 调用了 `primary()`，我们得到了：\n\n![一个数据表列出了三次调用时数据结构的元素。](img/f0204-03.jpg)\n\
  \n这开始变得有点重复，但现在 `primary()` 调用了 `expression()`：\n\n![一个数据表列出了四次调用时数据结构的元素。](img/f0205-01.jpg)\n\
  \n**CC**\n\n所以这次 `expression()` 调用拥有了它自己的激活记录，与第一次 `expression()` 调用不同。这很好，否则我们就会陷入大胶团，因为\
  \ `left` 和 `t` 在两次调用中是不同的。直接调用或（如此处所示）间接调用自身的函数被称为*递归*（recursive）。\n\n因此，每当我们调用一次函数，*激活记录栈*（stack\
  \ of activation records，通常直接称为*栈* stack）就会增加一条记录。相反，当函数返回时，它的记录就不再被使用。例如，当最后一次 `expression()`\
  \ 调用返回到 `primary()` 时，栈将恢复如下所示：\n\n![一个数据表列出了包含 14 条目的三次调用时数据结构的元素。](img/f0205-02.jpg)\n\
  \n当该 `primary()` 调用返回到 `term()` 时，我们回到了![一个数据表列出了三次调用时数据结构的元素。](img/f0206-01.jpg)如此。*栈*（也称为*调用栈*）根据“后进先出”的原则增长和收缩。请记住，调用栈的实现方式各异，但基础是相同的。\n\
  \n#### 7.4.9 编译时计算\n\n函数表示一种计算，有时我们希望在编译时进行计算。想要由编译器执行计算的原因是为了避免在运行时执行数百万次相同的计算。我们通过声明函数为\
  \ `constexpr` 来传达让编译器执行函数的意图（参见§3.3.1）。如果提供了常量表达式作为参数，`constexpr` 函数可以由编译器计算。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\nconstexpr double xscale = 10;     // 缩放因子\nconstexpr double\
  \ yscale = 0.8;\n\nconstexpr Point scale(Point p) { return {xscale*p.x,yscale*p.y};\
  \ };\n```\n\n假设 `Point` 是一个具有成员 `x` 和 `y` 的二维坐标。现在，当我们给 `scale()` 一个 `Point` 参数时，它返回一个根据\
  \ `xscale` 和 `yscale` 缩放的 `Point`。例如：\n\n点击此处查看代码图像\n\n```cpp\nvoid user(int x,\
  \ int y)\n{\n         Point p1 {x,y};                                   // 在编译时，我们不知道\
  \ p1 的值\n         constexpr Point p2 {10,10};\n\n         Point p3 = scale(p1);\
  \                             // OK: p3 == {100,8}; 运行时计算可以\n         constexpr\
  \ Point p4 = scale(p2);                   // OK: p4 == {100,8}; scale(p2) 是常量\n\
  \         constexpr Point p5 = scale(p1);                   // 错误：scale (p1) 不是常量表达式\n\
  \         // ...\n}\n```\n\n`constexpr` 函数的行为就像普通函数，直到你在需要常量的地方使用它。那时，它会在编译时进行计算，且参数必须是常量表达式（例如\
  \ `p2`），如果不是则会报错（例如 `p1`）。为了实现这一点，`constexpr` 函数必须足够简单，以便编译器（每个符合标准的编译器）都能评估它。这包括简单的循环和局部变量。例如：\n\
  \n点击此处查看代码图像\n\n\n\n\n```\nconstexpr int sum(const vector<int>& v)\n{\n        \
  \ int s = 0;\n         for (int x : v)\n                  s += x;\n         return\
  \ s;\n}\n```\n\n当在常量表达式中调用时，`constexpr` 函数不能有副作用；也就是说，它不能改变其自身体体之外对象的值。在编译时，这些对象是不存在的。\n\
  \n如果你想要一个只能在编译时进行求值的函数，请将其声明为 `consteval` 而不是 `constexpr`。例如：\n\n点击此处查看代码图片\n\n\
  ```\nconsteval half(double d) { return d/2; }\n\ndouble x1 = half(7);          \
  \ // OK: 7 是常量\ndouble x2 = half(x1);         // error: x1 是非 const 变量\n```\n\n\
  ### 7.4.10 后缀返回类型 (Suffix return type)\n\n我们到目前为止使用的传统函数声明语法是：\n\n`type-identifier`\
  \ `function-identifier` `(` `parameter-list` `)`\n\n例如：\n\n点击此处查看代码图片\n\n```\ndouble\
  \ expression(Token_stream& ts);           // double 是调用 expression(ts) 的结果\n```\n\
  \n然而，还有另一种表示法，将返回类型放在它被认为所属的末尾：\n\n`auto` `function-identifier` `(` `parameter-list`\
  \ `) −>` `type-identifier`\n\n例如：\n\n点击此处查看代码图片\n\n```\nauto expression(Token_stream&\
  \ ts) −> double;      // 调用 expression(ts) 并获得一个 double\n```\n\n这被称为*后缀返回类型*（suffix\
  \ return type）表示或*尾随返回*（trailing return）表示。当返回类型用参数类型表示时，这种表示法有时是关重要的，而且它具有名称对齐的良好属性。例如：\n\
  \n点击此处查看代码图片\n\n```\nauto Token_stream::get() −> Token;\nauto statement() −> double;\n\
  auto find_all(string s) −> vector<Variable>;\n```\n\n与之相比\n\n点击此处查看代码图片\n\n```\n\
  Token Token_stream::get();\ndouble statement();\nvector<Variable> find_all(string\
  \ s);\n```\n\n当返回名称变得更长且复杂时，这种差异变得更加明显。\n\n当使用 `auto` 引入函数定义时，返回类型可以从 `return`语句中推导出：\n\
  \n点击此处查看代码图片\n\n```\nauto expression(Token_stream& ts)         // 从定义中推导返回类型\n{\n\
  \         double left = term(ts);\n         // ...\n         return left;\n}\n```\n\
  \n就像在 `auto` 对象定义（(§2.10) 中一样，返回类型是从初始化器（这里是函数体）推导出来的。这种推导机制不应过度使用，就像一般的 `auto`\
  \ 不应该那样一样，因为可能导致代码更难读。更糟糕的是，函数的类型可能会随着实现的更改而无意中发生。\n\n### 7.5 求值顺序 (Order of evaluation)\n\
  \n#### CC\n\n程序的求值——也称为程序的执行——根据语言规则通过语句进行。当这条“执行线程”到达变量的定义时，变量被构造；也就是说，为该对象分留内存并初始化该对象。当变量超出作用范围时，变量被销毁；也就是说，它所引用的对象在原则上被移除，编译器可以使用它的内存用于其他地方。例如：\n\
  \n点击此处查看代码图片\n\n```\nstring program_name = \"silly\";\nvector<string> v;       \
  \                                 // v 是全局的\n\nvoid f()\n{\n         string s; \
  \                                             // s 是 f 的局部变量\n         while (cin>>s\
  \ && s!=\"quit\") {\n                  string stripped;                        \
  \ // stripped 是循环内局部的\n                  string not_letters;\n                 \
  \ for (char x : s)                           // x 语句作用域\n                      \
  \    if (isalpha(x))\n                                   stripped += x;\n      \
  \                    else\n                                   not_letters += x;\n\
  \                  v.push_back(stripped);\n         }\n         // ... 我们在这里仍然可以使用\
  \ s ...\n}\n```\n\n全局变量，如 `program_name` 和 `v`，在 `main()` 的第一条语句执行之前初始化。它们一直“生存”到程序终止，然后被销毁。它们按照定义的顺序进行构造（即\
  \ `program_name` 在 `v` 之前），并以反序销毁（即 `v` 在 `program_name` 之前）。\n\n当有人调用 `f()` 时，首先构造\
  \ `s`；也就是说，`s` 被初始化为空字符串。它将一直存在到我们从 `f()` 返回。\n\n每当我们进入 `while` 语句体的块时，`stripped`\
  \ 和 `not_letters` 就会被构造。由于 `stripped` 定义在 `not_letters` 之前，`stripped` 在 `not_letters`\
  \ 之前构造。\n\n### 7.5.1 表达式求值 (Expression evaluation)\n\n#### XX\n\n子表达式的求值顺序受满足优化器的规则支配，而不是为了让程序员方便。这很遗憾，但你本就应该避免复杂的表达式，并且有一个简单的规则可以让你免于麻烦：如果你在表达式中更改变量的值，不要再次读取或写入它。\n\
  \n例如：\n\n点击此处查看代码图片\n\n```\nf(++i,++i);                                      //\
  \ 未定义的求值顺序\nx = ++i + i;                                     // 未定义的求值顺序\nz = f(x)+g(y);\
  \                                   // 如果 f(x) 和 g(y) 的顺序很重要\nh(f(x),g(y))     \
  \                                // 如果 f(x) 和 g(y) 的顺序很重要\n```\n\n遗幸的是，并不是所有编译器都会在你编写这种糟糕代码时发出警告；它的糟糕是因为当你将代码移动到另一台计算机、使用不同的编译器或使用不同的优化器设置时，无法依赖结果是相同的。编译器对于这类代码差异巨大；千万不要这样做。\n\
  \n幸运的是，已经规定了一些顺序。对于 `x.y`、`x−>y`、`x(y)`、`x[y]`、`x<<y`、`x>>y`、`x,y`、`x&&y` 和 `x||y`，求值顺序是从左到右的。对于赋值（例如\
  \ `x=y` 和 `x+=y`），顺序是从右到左的。这实际上让大多数合理的构造按照人们直觉预期的方式运行。例如：\n\n点击此处查看代码图片\n\n```\n\
  if (0<=x && v[x]!=0) ...               // 当 x<0 时，v[x] 永远不会执行\nv[i] = ++i;     \
  \                               // i 在用作下标之前会增加\ncout << ++i << ' ' << ++i;    \
  \       // 如果调用时 i==1，将打印 \"2 3\"\n```\n\n\n\n\n对于 `&&`，除非第一个（左侧）操作数为 `true`，否则第二个（右侧）操作数不会执行。同样，对于\
  \ `||`，除非第一个操作数为 `false`，否则第二个操作数不会执行。这有时被称为*短路求值*。\n\n## 7.5.2 全局初始化\n\nXX\n\n\
  在极少数情况下，使用全局变量通常不是一个好主意。程序员没有真正有效的方法来知道大型程序的哪些部分读取和/或写入全局变量（§7.3）。遗憾的是，全局变量在旧代码中很常见。\n\
  \n单个翻译单元（§7.7.1）中的全局变量（以及命名空间变量；见 §7.6）按照它们出现的顺序进行初始化。例如：\n\n点击此处查看代码图像\n\n```\n\
  // file f1.cpp\nint x1 = 1;\nint y1 = x1+2;             // y1 becomes 3\n```\n\n\
  这种初始化在逻辑上发生在“`main()` 函数中的代码执行之前”。然而，不同翻译单元中全局变量的初始化顺序是未定义的。例如：\n\n点击此处查看代码图像\n\n\
  ```\n// file f2.cpp\nextern int y1;\nint y2 =y1+2;               // y2 becomes 2\
  \ or 5\n```\n\n出于几个原因，应该避免此类代码：它使用了全局变量，它给全局变量起了短名字，并且对全局变量使用了复杂的初始化。如果文件 `f1.cpp`\
  \ 中的全局变量在 `f2.cpp` 中的全局变量之前初始化，`y2` 将初始化为 `5`（正如程序员可能天真且合理预期的那样样）。然而，如果文件 `f2.cpp`\
  \ 中的全局变量在 `f1.cpp` 中的全局变量之前初始化，`y2` 将初始化为 `2`（因为在尝试复杂的初始化之前，用于全局变量的内存会被初始化为 `0`）。避免此类代码，当你看到带有非平凡初始化器的全局变量时要保持怀疑。对于全局变量，请认为任何不是常量表达式的初始化器都是复杂的。\n\
  \n但当我们确实需要一个具有复杂初始化器的全局变量（或常量）时，我们能做什么？一个合理的例子是在每天早上程序启动时初始化一个为今天日期的 `Date` 对象。\n\
  \n点击此处查看代码图像\n\n```\nconst Date today = get_date_from_clock();                 //\
  \ suspicious definition\n```\n\n我们如何知道 `today` 在初始化之前从未被使用过呢？基本上，我们无法知道，所以我们不应该写那个定义。我们最常用的技术是调用一个返回值的函数。例如：\n\
  \n点击此处查看代码图像\n\n```\nconst Date today()\n{\n         return get_date_from_clock();\
  \                  // return today’s date\n}\n```\n\n### AA\n\n这会在每次调用 `today()`\
  \ 时都构造一个 `Date`。如果频繁调用 `today()` 并且调用 `get_date_from_clock()` 的代价很高，我们希望只构造一次该 `Date`。我们可以通过使用\
  \ `static` 局部变量来实现：\n\n点击此处查看代码图像\n\n```\nconst Date& today()\n{\n         static\
  \ const Date today = get_date_from_clock();             // initialize today the\
  \ first time we get here\n         return today;\n}\n```\n\n这个 `Date` 只在函数第一次被调用时进行初始化（构造）。注意，我们返回了一个引用以消除不必要的拷贝。特别是，我们返回了一个\
  \ `const` 引用以防止调用函数意外更改该值。关于如何传递参数（§7.4.6）的内容也适用于返回值。\n\n## 7.6 命名空间\n\n我们使用块来组织函数内部的代码（§7.3）。我们使用类将函数、数据和类型组织成一个类型（第\
  \ 8 章）。函数和类都为我们做了两件事：\n\n*   它们允许我们定义许多“实体”，而不必担心它们的名称与程序中的其他名称冲突。\n*   它们给了我们一个名称来指代我们定义的内容。\n\
  \n### CC\n\n我们目前缺乏的是某种可以将类、函数、数据和类型组织成程序中可识别且命名的部分，无需定义类型。这种声明分组的语言机制是*命名空间*（namespace）。例如，我们可能希望为图形库提供名为\
  \ `Color`、`Shape`、`Line`、`Function` 和 `Text` 的类（见第 11 章）：\n\n点击此处查看代码图像\n\n```\n\
  namespace Graph_lib {\n         struct Color { /* ... */ };\n         struct Shape\
  \ { /* ... */ };\n         struct Line : Shape { /* ... */ };\n         struct Function\
  \ { /* ... */ };\n         struct Text { /* ... */ };\n         int gui_main() {\
  \ return 0; }\n}\n```\n\n\n\n\n有时候，我们更倾向于对命名空间名称的使用使用更强力的“缩写”：“如果你在这个作用范围内没有找到某个名称的声明，就去\
  \ `std` 中查找。”这种说法的方法是使用 `using` 指令：\n\n点击此处查看代码图像\n\n```\nusing namespace std; \
  \               // 直接访问来自 std 的名称\n```\n\n因此，我们得到了这种常见的风格：\n\n点击此处查看代码图像\n\n```\n\
  import std;                         // 获取 ISO C++ 标准库\nusing namespace std;    \
  \  // 直接访问来自 std 的名称\n\nint main()\n{\n         string name;\n         cout << \"\
  Please enter your first name\\n\";\n         cin >> name;\n         cout << \"Hello,\
  \ \" << name << '\\n';\n}\n```\n\n`cin` 实际上是 `std::cin`，`string` 是 `std::string`\
  \ 等，依此类推。只要你使用了 `PPP_support`，就不需要担心标准头文件和 `std` 命名空间。\n\n## XX\n\n对于任何命名空间，避免使用\
  \ `using` 指令通常是一个好主意，像 `std` 这样在应用领域广为人知的命名空间。过度使用 `using` 指令的问题在于你无法追踪哪些名称来自哪里，导致你再次开始遇到命名冲突。使用命名空间名进行显式限定以及\
  \ `using` 声明则没有这个问题。因此，在头文件中放置 `using` 指令（导致用户无法避免它）是一个非常糟糕的习惯。然而，为了简化我们的初始代码，我们确实在\
  \ `PPP_support` 中放置了 `std` 的 `using` 指令。这允许我们编写：\n\n点击此处查看代码图像\n\n```\nimport PPP_import;\n\
  \nint main()\n{\n         string name;\n         cout << \"Please enter your first\
  \ name\\n\";\n         cin >> name;\n         cout << \"Hello, \" << name << '\\\
  n';\n}\n```\n\n## 7.7 模块与头文件\n\n我们如何管理我们的声明和定义？毕竟，它们必须保持一致，而在现实世界的程序中，可能有成千上万个声明；拥有成十万个声明的程序并不罕见。通常，当我们编写程序时，我们使用的多数定义并不是我们编写的。例如，`cout`\
  \ 和 `sqrt()` 的实现是多年前由其他人编写的。我们只是使用它们。\n\n## CC\n\n在 C++ 中管理“别处”定义的设施的关键在于模块和头文件。\n\
  \n- *头文件*（header）：一种通过文件组合程序的古老且成熟的机制。\n- *模块*（module）：一种直接表达模块化的现代语言机制。\n\n模块是目前确保模块化并以此加速编译的优越机制。然而，头文件已经使用了\
  \ 50 多年，并且有数十亿行代码在使用它们，因此我们必须学会如何良好使用它们。\n\n### 7.7.1 模块\n\n假设我们想将 `Token_stream`\
  \ 抽象封装为一个独立的设施，人们可以将其整体（包括类、函数等）导入到自己的程序中。我们可以通过定义一个名为 `Tokenstream` 的 `module`\
  \ 来实现这一点：\n\n点击此处查看代码图像\n\n```\nmodule Tokenstream;      // 我们正在定义一个名为 \"Tokenstream\"\
  \ 的模块\n\nimport std;                        // 实现“细节”\nusing namespace std;    \
  \ // 隐式访问 std - 仅在 Tokenstream 内部\nexport class Token {\npublic:\n         char\
  \ kind;                  // token 的类型\n         double value;            // 对于数字：一个值\n\
  \         Token(char k) :kind{k}, value{0.0} {}                  // 从一个值构造\n   \
  \      Token(char k, double v) :kind{k}, value{v} {}    // 从两个值构造\n};\n\nexport\
  \ class Token_stream {\npublic:\n         Token get();                       //\
  \ 获取一个 Token (get() 在 §5.8.2 中定义)\n         void putback(Token t);     // 放回一个 Token\n\
  private:\n         bool full = false;                // 缓冲区中是否有 Token？\n       \
  \  Token buffer;                     // putback() 将其 token 保在这里\n};\n\nvoid Token_stream::putback(Token\
  \ t)\n{\n         if (full)\n                  error(\"Token_stream::putpack() into\
  \ a full buffer\");\n         buffer = t;                  // 将 t 拷贝到 buffer\n \
  \        full = true;                 // buffer 现在已满\n}\n\nToken Token_stream::get()\n\
  {\n         if (full) {                               // 我们已经有一个准备好的 Token 了？\n\
  \                  full = false;                 // 从缓冲区移除 Token\n             \
  \     return buffer;\n         }\n\n         // ... 使用 iostream 并创建一个 Token ...\n\
  }\n```\n\n这当然是一个非常微微的模块。像 `std` 和 `PPP_support` 这样的模块提供了意义重大的益处，但 `Tokenstream`\
  \ 提供了一个易于管理的示例。\n\n标记为 `export` 的定义对 `import` 该模块的用户可用。模块本身可以 `import` 它需要的模块，就像这里为\
  \ `std` 所做的那样。重要的是，只有 `exported` 声明对用户可见，因此在这种情况下，`Tokenstream` 的用户不会被导入的模块 `std`\
  \ 中所有标准库的隐式负担。\n\n我们可以用图表表示 `Tokenstream` 的用法：\n\n![数据表定义了 Token 流的使用。](img/f0215-01.jpg)\n\
  \n遗憾的是，模块没有标准化的后缀名（Microsoft 使用 `.ixx`，GCC 使用 `.cxx`，Clang 使用 `.cppm`）。要编译和使用模块，你需要了解特定的实现是如何处理它的。这具有重要影响，例如模块可以按任何顺序\
  \ `imported`：\n\n```\nimport m1;\nimport m2;\n```\n\n等同于\n\n```\nimport m2;\nimport\
  \ m1;\n```\n\n这对于编译器和人类读者来说都是巨大的帮助。\n\n### 7.7.2 头文件\n\n在编写本文时，模块在 C++ 中仍然相当新颖。在此之前的\
  \ 50 年里，模块化是通过使用头文件概念通过文件操作来“模拟”的。鉴于数十亿行代码使用头文件，且数百万程序员熟悉它们，它们将继续使用多年。\n\n基本上，一个*头*（header）是声明的集合，通常定义在一个文件中，因此头也被称为*头文件*（header\
  \ file）。这些头随后被 `#included` 在我们的源文件中。例如，我们可能决定通过分离标记管理来改进计算器（第 5 章 和第 6 章](#ch06.xhtml_ch06)）的源代码组织。我们可以定义一个包含使用\
  \ `Token` 和 `Token_stream` 所需声明的头文件 `token.h`：\n\n![数据表定义了带有声明的头文件的 Token 流。](img/f0216-01.jpg)\n\
  \n`Token` 和 `Token_stream` 的声明在头文件 `token.h` 中。它们的定义在 `token.cpp` 中。`.h` 后缀对于 C++\
  \ 头文件最常见，`.cpp 源文件最常见。实际上，C++ 语言并不关心文件后缀，但某些编译器和大多数程序开发环境坚持要求，因此请在你的源代码中使用这种约定。\n\
  \n从原理上讲，`#include \"file.h\"` 直接将 `file.h` 中的声明拷贝到文件中 `#include` 所在。例如，我们可以写一个头文件\
  \ **f.h**：\n\n```\n// f.h\nint f(int);\n```\n\n\n\n\n并将其包含在文件 `user.cpp` 中：\n\n\
  ```\n// user.cpp\n#include \"f.h\"\n\nint g(int i)\n{\n         return f(i);\n}\n\
  ```\n\n当编译 `user.cpp` 时，编译器会执行 `#include` 并编译\n\n```cpp\nint f(int);\n\nint g(int\
  \ i)\n{\n         return f(i);\n}\n```\n\n由于 `#include` 在逻辑上发生在编译器执行任何其他操作之前，因此处理\
  \ `#include` 属于所谓的*预处理*（preprocessing）部分（PPP2.§27.8）。\n\n## AA\n\n为了方便一致性检查，我们在使用其声明的源文件以及提供这些声明的定义的源文件中都\
  \ `#include` 同一个头文件。这样一来，编译器就能尽早捕获错误。例如，假设 `Token_stream::putback()` 的实现者犯错了：\n\n\
  点击此处查看代码图片\n\n```\nToken Token_stream::putback(Token t)\n{\n         buffer.push_back(t);\n\
  \         return t;\n}\n```\n\n这看起来足够无害。幸运的是，编译器捕获了这些错误，因为它看到了（通过 `#include` 引入的）`Token_stream::putback()`\
  \ 的声明。将该声明与我们的定义进行比较，编译器发现 `putback()` 不应该返回 `Token`，且 `buffer` 是一个 `Token` 而不是\
  \ `vector<Token>`，因此我们无法使用 `push_back()`。当我们修改代码以改进它时会发生此类错误，但没能让更改在整个程序中保持一致。\n\
  \n同样，考虑这些错误：\n\n点击此处查看代码图片\n\n```\nToken t = ts.gett();     // 错误：没有成员 gett\n//\
  \ ...\nts.putback();              // 错误：缺少参数\n```\n\n编译器会立即报错；头文件 `token.h` 为它提供了检查所需的所有信息。\n\
  \n## AA\n\n头文件通常会被包含在多个源文件中。这意味着头文件应该只包含可以在多个文件中重复的声明（例如函数声明、类定义和数值常量的定义）。\n\n在§10.8.1\
  \ 中，我们提供了一个更贴实际头文件使用示例。\n\n### 练习\n\n[1] 编写三个函数 `swap_v(int,int)`、`swap_r(int&,int&)`\
  \ 和 `swap_cr(const int&, const int&)`。每个函数都应该具有体体\n\n点击此处查看代码图片\n\n```\n{ int temp;\
  \ temp = a, a=b; b=temp; }\n```\n\n其中 `a` 和 `b` 是参数的名称。\n\n尝试这样调用每个 swap 函数：\n\n\
  点击此处查看代码图片\n\n```\nint x = 7;\nint y = 9;\nswap_?(x,y);             // 用 v, r, 或\
  \ cr 替换 ?\nswap_?(7,9);\nconst int cx = 7;\nconst int cy = 9;\nswap_?(cx,cy);\n\
  swap_?(7.7,9.9);\ndouble dx = 7.7;\ndouble dy = 9.9;\nswap_?(dx,dy);\nswap_?(7.7,9.9);\n\
  ```\n\n哪些函数和调用编译通过了？为什么？在每个编译成功的 swap 之后，打印调用后参数的值以查看它们是否真的被交换了。如果你对某个结果感到惊讶，请查阅§7.5。\n\
