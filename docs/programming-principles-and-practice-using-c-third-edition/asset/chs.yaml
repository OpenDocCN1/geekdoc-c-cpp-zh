  \ temp = a, a=b; b=temp; }\n```\n\n其中 `a` 和 `b` 是参数的名称。\n\n尝试这样调用每个 swap 函数：\n\n\
  点击此处查看代码图片\n\n```\nint x = 7;\nint y = 9;\nswap_?(x,y);             // 用 v, r, 或\
  \ cr 替换 ?\nswap_?(7,9);\nconst int cx = 7;\nconst int cy = 9;\nswap_?(cx,cy);\n\
  swap_?(7.7,9.9);\ndouble dx = 7.7;\ndouble dy = 9.9;\nswap_?(dx,dy);\nswap_?(7.7,9.9);\n\
  ```\n\n哪些函数和调用编译通过了？为什么？在每个编译成功的 swap 之后，打印调用后参数的值以查看它们是否真的被交换了。如果你对某个结果感到惊讶，请查阅§7.5。\n\
