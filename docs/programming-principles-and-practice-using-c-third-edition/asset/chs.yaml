  \ 运行第一个示例\n* §10.10 [整合一切]\n\n### 10.1 为什么需要图形化？\n\n为什么我们要花四章的内容讲图形，只花一章讲 GUI（图形用户界面）？毕竟，这是一本关于编程的书，而不是关于图形的书。所以，“为什么需要图形化？”基本上，图形是一个允许我们探索软件设计、编程和语言功能的重要领域的课题：\n\
  \n* **图形是有用的**。在许多领域，良好的图形是必不可少的或非常重要的。例如，如果没有绘图能力，我们无法梦想进行科学计算、数据分析或任何定量学科。第 13\
  \ 章\n\n```html\n<hr>\n<h2>\n组织\n</h2>\n此列表由三部分组成：\n<ul>\n<li>**提议**，编号为 EPddd, ...</li>\n\
  <li>**问题**，编号为 EIddd, ...</li>\n<li>**建议**，编号为 ESddd, ...</li>\n</ul>\n<p>我们尝试 ...</p>\n\
  <p>\n```\n\n\n\n\n在本章及接下来的四章中，我们将介绍替代方案：一种直接面向计算机屏幕的图形和图形用户界面概念。这些概念本质上是图形化的（并且是二维的，适应计算机屏幕的矩形区域），例如坐标、线、矩形和圆。从编程的角度来看，目标是实现内存中的对象与屏幕上的图像之间的直接对应。\n\
  \n## CC\n\n基本模型如下：我们通过图形系统提供的基本对象（如线）来组合对象。我们将这些图形对象“附加”到一个窗口对象上，该对象代表我们的物理屏幕。我们可以将一个程序想象成显示器本身、“显示引擎”、“我们的图形库”、“我们的\
  \ GUI 库”，甚至（幽默地）称为“坐在屏幕背后的小地精”，然后它会获取我们已经附加到窗口上的对象，并将它们绘制在屏幕上：\n\n![数据表显示了将图形对象附加到窗口对象的过程](img/f0293-01.jpg)\n\
  \n“显示引擎”在屏幕上绘制线条、在屏幕上放置文本字符串、为屏幕区域上等。为了简单起见，尽管我们的 GUI 库工作远不止于绘制对象，但我们仍用“我们的 GUI\
  \ 库”甚至“系统”来称呼显示引擎。正如我们的代码让 GUI 库为我们完成大部分工作一样，GUI 库也将大部分工作委托给了操作系统。\n\n### 10.3 第一个示例\n\
  \n我们的工作是定义类，通过这些类创建我们想要在屏幕上看到的对象。例如，我们可能想通过一系列连接的线来绘制图形。这里有一个展示该非常简单版本的小程序：\n\n\
  点击此处查看代码图片\n\n```cpp\n#include \"Simple_window.h\"                       // 获取我们的窗口库\n\
  #include \"Graph.h\"                                       // 获取图形库设施\n\nint main()\n\
  {\n         using namespace Graph_lib;                               // 我们的图形设施在\
  \ Graph_lib 中\n\n         Application app;                                     \
  \               // 启动图形/GUI \n\n         Point tl {900,500};                   \
  \                               // 成为窗口的左上角\n\n         Simple_window win {tl,600,400,\"\
  Canvas\"};        // 创建一个简单的窗口\n\n         Polygon poly;                       \
  \                                 // 创建一个形状（多边形）\n         poly.add(Point{300,200});\
  \                                     // 添加一个点\n         poly.add(Point{350,100});\
  \                                     // 添加另一个点\n         poly.add(Point{400,200});\
  \                                     // 添加第三个点\n         poly.set_color(Color::red);\
  \                                   // 调整 poly 的属性\n\n         win.attach (poly);\
  \                                                   // 将 poly 连接到窗口\n\n        \
  \ win.wait_for_button();                                           // 将控制权交给显示引擎\n\
  }\n```\n\n当我们运行此程序时，屏幕看起来如下所示：\n\n![Windows 屏幕的截图](img/f0294-01.jpg)\n\n## AA\n\n\
  在我们窗口的背景中，我们看到一个笔记本屏幕（为了该场合进行了清理）。在我们窗口的背景中，我们看到一个笔记本屏幕（为了该场合进行了清理）。对于人们来说，我们看到一个笔记本屏幕（为了该场合进行了清理）。在我们窗口的背景中，我们看到一个笔记本屏幕（为了该场合进行了清理）。对于人们来说，我们看到一个笔记本屏幕（为了该场合进行了清理）。在我们窗口的背景中，我们看到一个笔记本屏幕（为了该场合进行了清理）。对于人们来说，我们看到一个笔记本屏幕（为了该场合进行了清理）。在我们窗口的背景中，我们看到一个笔记本屏幕（为了该场合进行了清理）。对于人们来说，我们看到一个笔记本屏幕（为了该场合进行了清理）。在我们窗口的背景中，我们看到一个笔记本屏幕（为了该场合进行了清理）。对于人们来说，我们看到一个笔记本屏幕（为了该场合进行了清理）。在我们窗口的背景中，我们看到一个笔记本屏幕（为了该场合进行了清理）。对于人们来说，我们看到一个笔记本屏幕（为了该场合进行了清理）。在我们窗口的背景中，我们看到一个笔记本屏幕（为了该场合进行了清理）。对于人们来说，我们看到一个笔记本屏幕（为了该场合进行了清理）。\n\
  \n\n\n点击此处查看代码图像\n\n```\nwin.wait_for_button();                                \
  \              // 将控制权交给显示引擎\n```\n\n要让 GUI 系统在屏幕上显示对象，你必须将控制权交给“系统”。我们的 `wait_for_button()`\
  \ 正做到了这一点，它在继续执行之前还会等待你“按下”（或“点击”）`Simple_window` 右角的“Next（下一步）”按钮。这让你在程序结束和窗口消失之前有机会查看该窗口。当你按下按钮时，程序将终止并关闭窗口。\n\
  \n在接下来的图形和 GUI 章节中，我们消除了窗口周围的干扰，只显示窗口本身：\n\n![Canvas 窗口的截图。窗口右上角有最小化、最大化和关闭按钮。Next\
  \ 按钮在它们下方。窗口上显示了一个锐角三角形。](img/f0296-01.jpg)\n\n你会注意到我们稍微“作了弊”。那个标记为“Next”的按钮是从哪里来的？我们将其构建在了自己的\
  \ `Simple_window` 类中。在第 14 章中，我们将从 `Simple_window` 迁移到“纯” `Window`，它没有内置可能的多余功能，并将展示如何编写自己的代码来控制与窗口的交互。\n\
  \n在接下来的三个章节中，我们将简单地使用那个“Next”按钮，在我们分阶段显示信息（“逐帧”）时，从一个“显示”移动到下一个。\n\n本章及后续章节中的图片是在\
  \ Microsoft Windows 系统上生成的，因此你“免费”获得了右上角的通常三个按钮。这非常有用：如果你的程序陷入了真正的混乱（在调试过程中确实经常会发生），你可以通过点击\
  \ `X` 按钮来杀死它。当你在另一个系统上运行程序时，将添加一个不同的框架以适应该系统的习惯。我们对框架的唯一贡献是标签（这里是 `Canvas`）。\n\n\
  ### 10.4 使用 GUI 库\n\nCC\n\n在书中，我们不会直接使用操作系统的图形和 GUI（图形用户界面）功能。这样做会限制我们的程序只能在单个操作系统上运行，并且迫使我们直接处理许多杂的细节。与文本\
  \ I/O 一样，我们将使用库来平滑操作系统差异、I/O 设备变化等，并简化代码。遗憾的是，C++ 并没有像提供标准流 I/O 库那样提供标准的 GUI 库，因此我们使用了许多可用\
  \ C++ GUI 库之一。为了不让你直接绑定到某一个 GUI 库，并为了避免你同时面对 GUI 库的所有复杂性，我们使用了一组简单的接口类，这些类对于任何 GUI\
  \ 库都可以用几百行代码实现。\n\n我们使用的 GUI 工具包（目前是间接使用）来自 [www.qt.io](http://www.qt.io) 的 `Qt`。只要有\
  \ `Qt` 的地方，我们的代码都是可的（Windows、Mac、Linux、许多嵌入式系统、手机、浏览器等）。我们的接口类也可以使用 `Simple_window`\
  \ 去接口类重新实现。\n\n（注：输入文本中存在大量重复段落，已进行去重处理以确保专业性。）\n\n\n\n现在我们将走过一个简单的程序，逐行解释代码并展示每一行代码在屏幕上的效果。当你运行程序时，你将看到随着我们在窗口中添加形状和修改现有形状，图像是如何变化的。基本上，我们正在通过观察程序的执行过程来“动画化”代码的进度。\n\
  \n### 10.7.1 轴\n\n一个几乎空白的窗口并不十分有趣，所以我们最好添加一些信息。我们想显示什么呢？为了提醒你图形学不仅仅是好玩玩乐，我们将从一些严肃且相当复杂的东西开始——坐标轴。没有坐标轴的图表通常是耻辱的。没有坐标轴，你根本不知道数据代表什么。也许你已经在某些随附的文中解释了一切，但添加坐标轴要安全得多；人们通常不读说明文字，而且精美的图形表示往往会脱离其原始语境。因此，图表需要坐标轴：\n\
  \n点击此处查看代码图像\n\n```\nAxis xa {Axis::x, Point{20,300}, 280, 10, \"x axis\"};   //\
  \ 创建一个轴\n         // Axis 是一种形状 Shape\n         // Axis::x 表示水平方向\n         // 起于\
  \ (20,300)\n         // 长度为 280 像素\n         // 有 10 个“刻度”\n         // 将轴标记为 \"\
  x axis\"\n\nwin.attach(xa);                             // 将 xa 附加到窗口 win 上\nwin.set_label(\"\
  X axis\");               // 重新标记窗口\nwin.wait_for_button();                 // 显示！\n\
  ```\n\n操作序列是：创建轴对象，将其添加到窗口中，最后显示它：\n\n![显示坐标轴的 Canvas 窗口截图](img/f0300-01.jpg)\n\n\
  我们可以看到 `Axis::x` 是一条水平线。我们看到了所需的“刻度”数量（10 个）以及标签“x axis”。通常，标签会解释坐标轴和刻度代表什么。自然地，我们选择将\
  \ `x` 轴放置在窗口底部附近。在现实生活中，我们会用符号常量来表示高度和宽度，这样我们就可以将“底部正上方”称为 `y_max−bottom_margin`\
  \ 之类的东西，而不是使用像 `300` 这样的“魔法数字”(§3.3.1, §13.6.3)。\n\n为了识别输出，我们使用 `Window` 的成员函数 `set_label()`\
  \ 将屏幕标记为 `X axis`。\n\n现在，让我们添加一个 `y` 轴：\n\n点击此处查看代码图像\n\n```\nAxis ya {Axis::y,\
  \ Point{20,300}, 280, 10, \"y axis\"};\nya.set_color(Color::cyan);             \
  \            //为 y 轴选择颜色\nya.label.set_color(Color::dark_red);        //为文本选择颜色\n\
  win.attach(ya);\nwin.set_label(\"Y axis\");\nwin.wait_for_button();            \
  \                   // 显示！\n```\n\n只是为了展示一些功能，我们将 `y` 轴涂成青色，将标签涂成深红色。\n\n![显示两个坐标轴的\
  \ Canvas 窗口截图](img/f0301-01.jpg)\n\n我们并不认为为 `x` 和 `y` 轴使用不同的颜色是一个好主意。我们只是想向你展示如何设置形状的颜色以及形状单个元素的颜色。使用大量颜色并不一定是个好主意。特别是，新手使用颜色的热情往往大于他们的品味。\n\
  \n### 10.7.2 绘制函数\n\n接下来是什么？我们现在有一个带坐标轴的窗口，所以绘制一个函数似乎是个好主意。我们制作一个代表正弦函数的形状并将其附加：\n\
  \n点击此处查看代码图像\n\n```\ndouble dsin(double d) { return sin(d); }    // 选择了正确的 sin()\
  \ (§13.3)\n\nFunction sine {dsin,0,100,Point{20,150},1000,50,50};      // 正弦曲线\n\
  \         // 在 0:100) 范围内绘制 sin()，(0,0) 位于 (20,150)\n         // 使用 1000 个点；x 值放大\
  \ *50，y 值放大 *50\n\nwin.attach(sine);\nwin.set_label(\"Sine\");\nwin.wait_for_button();\n\
  ```\n\n在这里，名为 `sine` 的 `Function` 将使用标准库函数 `sin(double)` 生成值来画出正弦曲线。我们将在 [§13.3\
  \ 中解释关于绘制函数的细节。现在，只需注意要绘制函数，我们必须说明它从哪里开始（一个 `Point`），以及我们希望在哪些输入值范围内看到它（一个范围），并且我们需要提供关于如何将这些信息压缩到窗口中的信息（缩放）：\n\
  \n![显示振荡曲线的 Canvas 窗口截图](img/f0302-01.jpg)\n\n### 10.7.3 多边形\n\n注意名为 `sine` 的 `Function`\
  \ 将使用标准库函数 `sin(double)` 生成值来画出正弦曲线。我们即将在 §13.3 中解释关于绘制函数的细节。现在，只需注意要绘制函数，我们必须说明它从哪里开始（一个\
  \ `Point`），以及我们希望在哪些输入值范围内看到它（一个范围），并且我们需要提供关于如何将这些信息压缩到窗口中的信息（缩放）：\n\n\n\n\n\n\
  ```cpp\nClosed_polyline poly_rect;\npoly_rect.add(Point{100,50});\npoly_rect.add(Point{200,50});\n\
  poly_rect.add(Point{200,100});\npoly_rect.add(Point{100,100});\n\nwin.set_label(\"\
  Polyline\");\nwin.attach(poly_rect);\nwin.wait_for_button();\n```\n\n这个多边形看起来完全——到最后一个像素——就像一个矩形：\n\
  \n![A screenshot of a Canvas window a curve, two rectangles, and a triangle.](img/f0305-01.jpg)\n\
  \n然而，它看起来像是一个 `Rectangle`。没有任何 `Rectangle` 有四个点：\n\n```cpp\npoly_rect.add(Point{50,75});\n\
  win.set_label(\"Polyline 2\");\nwin.wait_for_button();\n```\n\n没有任何矩形有五个点：\n\n![A\
  \ screenshot of a Canvas window a curve, a rectangle, a polygon, and a triangle.](img/f0305-02.jpg)\n\
  \n### CC\n\n事实上，屏幕上 4 点 `poly_rect` 的*图像*确实*是一个矩形。然而，内存中的 `poly_rect` 对象并不是一个 `Rectangle`，它并不“知道”任何关于矩形的知识。\n\
  \n对于我们对代码的推理来说，重要的是：`Rectangle` 不仅仅恰好在屏幕上看起来像矩形；它维持了矩形的基本保证（正如我们从几何中所了解的那样）。我们编写的代码依赖于\
  \ `Rectangle` 在屏幕上确实是一个矩形，并保持原样。\n\n### 10.7.5 填充\n\n我们一直以轮廓的形式绘制形状。我们也可以为矩形“填充”颜色：\n\
  \n点击此处查看代码图像\n\n```cpp\nr.set_fill_color(Color::yellow);         // 给矩形内部上\npoly.set_style(Line_style(Line_style::dash,4));\n\
  poly_rect.set_style(Line_style(Line_style::dash,2));\npoly_rect.set_fill_color(Color::green);\n\
  win.set_label(\"Fill\");\nwin.wait_for_button();\n```\n\n我们还决定不喜欢三角形 (`poly`) 的线样式，因此我们将其线样式设置为“粗（厚度为正常的四倍）虚线”。同样，我们更改了\
  \ `poly_rect` 的样式（现在看起来不再像矩形）并用绿色填充了它：\n\n![A screenshot of a Canvas window a curve,\
  \ a solid rectangle, a solid polygon, and a triangle.](img/f0306-01.jpg)\n\n如果你仔细观察\
  \ `poly_rect`，你会发现轮廓打印在填充之上。\n\n填充任何闭合形状都是可能的 (§11.7, §11.7.2)）。矩形的特殊之处在于填充它们是如此简单（且快速）。\n\
  \n### 10.7.6 文本\n\n### CC\n\n最后，任何绘图系统如果没有简单的文本写入方式都是不完整的——将每个字符绘制为一组线条是不够的。我们为窗口本身标记标签，轴也可以有标签，但我们也可以使用\
  \ `Text` 对象在任何地方放置文本：\n\n点击此处查看代码图像\n\n```cpp\nText t {Point{150,150}, \"Hello,\
  \ graphical world!\"};\nwin.attach(t);\nwin.set_label(\"Text\");\nwin.wait_for_button();\n\
  ```\n\n![A screenshot of a Canvas window with shapes and a text.](img/f0307-01.jpg)\n\
  \n从你在窗口中看到的原始图形元素中，你可以构建出任何复杂和精细程度的显示。目前，只需注意本章代码的一个特点：没有循环，没有选择语句，并且所有数据都是“硬编码”进去的。输出只是以最简单的方式由原语组成。一旦我们开始组合这些原语，使用数据和算法，事情就会变得有趣起来。\n\
  \n我们已经看到如何控制文本的颜色：`Axis` 的标签 (§10.7.1) 仅仅是一个 `Text` 对象。此外，我们可以选择字体并设置字符大小：\n\n点击此处查看代码图像\n\
  \n```cpp\nt.set_font(Font::times_bold);\nt.set_font_size(20);\nwin.set_label(\"\
  Bold text\");\nwin.wait_for_button();\n```\n\n我们将 `Text` 字符串 `Hello, graphical world!`\
  \ 的字符放大到字号 20，并选择了粗体 Times 字体：\n\n![A screenshot of a Canvas window with shapes\
  \ and a text in bold.](img/f0308-01.jpg)\n\n### 10.7.7 图像\n\n我们还可以从文件加载图像：\n\n![A\
  \ screenshot of a Canvas window with a curve, two shapes, text in bold, and a photograph.](img/f0308-02.jpg)\n\
  \n\n\n\n\n一个代码文件实现了一个面向用户的头文件 `#include`，该头文件以及其代码所需的任何头文件。例如，我们可以这样表示 `Window.cpp`：\n\
  \n![一张图表连接了五个代表窗口的面向用户的头文件 .cpp。](img/f0312-02.jpg)\n\n通过这种方式，我们使用文件将用户看到的内容（面向用户的头文件，如\
  \ `Window.h`）与这些头文件的实现所需的内容分开（例如 Qt 头文件和 `GUI_private.h`）。在模块中，这种区别由 `export` 标识符控制（§7.7.1）。\n\
  \n与工业系统相比，这种“文件堆”是*微小*的，在工业系统中，成千上万个文件是常态，几万个文件也并不常见。这就是我们倾向于使用模块的原因之一；它们有助于组织代码。幸运的是，我们不需要同时考虑超过几个文件就能完成工作。这正是我们在这里所做的：操作系统、C++\
  \ 标准库和 Qt 的许多文件对于我们这些图形接口库的用户来说是不可见的。\n\n### 10.8.2 汇总一切\n\n不同的系统（如 Windows、Mac\
  \ 和 Linux）有安装库（如 Qt）以及编译和链接程序（如我们的程序）的不同方法。糟糕的是，这些设置程序会随着时间而变化。因此，我们将说明放在了网上：**[www.stroustrup.com/program-ming.xhtml](http://www.stroustrup.com/program-ming.xhtml)**\
  \ 并尝试保持这些描述的更新。在设置你的第一个项目时，请务小心并做好可能遇到挫败的准备。设置这样一个相对复杂的系统可能非常简单，但通常会有一些初学者并不明显的“问题”。如果你是一门课程的一部分，你的老师或助教可以提供帮助，甚至可能已经找到了更简单的方法让你入门。无论如何，安装新系统或库正是有经验的人士可以提供巨大帮助的地方。\n\
  \n### 操练\n\n操练是图形版的“Hello, World!”程序的等价物。它的目的是让你熟悉最简单的图形输出工具。\n\n[1] 编译、链接并运行一个大小为\
  \ 600x400 标签为 `My window` 的空 `Simple_window`。注意，你必须链接 Qt 库，在代码中 `#include Graph.h`\
  \ 和 `Simple_window.h`，并编译链接 `Graph.cpp` 和 `Window.cpp` 到你的程序中。\n\n[2] 现在逐一添加 §10.7\
  \ 中的示例，在每添加一个子章节示例之间进行测试。\n\n[3] 遍历并对每个子章节示例进行一个微改（例如修改颜色、位置或点的数量）。\n\n### 复习\n\n\
  [1] 为什么我们要使用图形？\n[2] 我们什么时候尝试不使用图形？\n[3] 为什么图形对程序员来说是有趣的？\n[4] 什么是窗口？\n[5] 我们在哪个命名空间中保留图形类（我们的库）？\n\
