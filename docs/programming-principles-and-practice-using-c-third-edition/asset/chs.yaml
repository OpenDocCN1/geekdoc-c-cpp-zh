  \n\n\n\n# 关联型容器\n\nC++ 标准库提供的容器比 `vector` 和 `list` 更多。在本章中，我们将介绍关联型容器 `map` 和 `unordered_map`，通过提供一个“键（key）”来查找值。例如，通过引用名称来查找记录。这类类型在应用程序中无处不在，因为它们简化并加速了常见任务。某些类型并不是标准库容器，但可以被视为元素的序列。例如内置数组和\
  \ I/O 流。迭代器的概念非常灵活，以至于此类类型可以适配该框架。为了从这种灵活性中受益，我们对范围（ranges）进行了泛化。\n\n## 20.1 关联型容器\n\
  \n### CC\n在 `vector` 之后，最有用的标准库容器可能是 `map`。`map` 是一个有序的 `(key,value)` 对序列，在其中你可以根据键查找值；例如，`my_phone_book[\"\
  Nicholas\"]` 可以是 Nicholas 的电话号码。在流行度竞赛中，`map` 唯一的潜在竞争对手是 `unordered_map`，它是一种针对字符串键进行了优化的\
  \ `map`。与 `map` 和 `unordered_map` 类似的数据结构有许多名称，例如*关联数组（associative arrays）*、*哈希表（hash\
  \ tables）*和*红黑树（red-black trees）*。在标准库中，我们将此类数据结构统称为*关联型容器（associative containers）*。流行且实用的概念似乎有很多名称。\n\
  \n标准库提供了八种关联型容器：\n\n| 关联型容器 | |\n| --- |\n| `map` | 有序的 `(key,value)` 对容器 |\n| `set`\
  \ | 有序的键容器 |\n| `unordered_map` | 无序的 `(key,value)` 对容器 |\n| `unordered_set` | 无序的键容器\
  \ |\n| `multimap` | 键可以出现多次的 `map` |\n| `multiset` | 键可以出现多次的 `set` |\n| `unordered_multimap`\
  \ | 键可以出现多次的 `unordered_map` |\n| `unordered_multiset` | 键可以出现多次的 `unordered_set`\
  \ |\n\n## 20.2 Map\n\n考虑一个概念简单的任务：列出文本中单词出现的次数列表。实现此任务明显的方法是保留一份我们见过的单词列表，以及每个单词出现的次数。当我们读取一个新单词时，查看我们是否已经见过它；如果见过，就将它的计数加\
  \ 1；如果没有，则将其插入列表并赋值为 `1`。我们可以使用 `list` 或 `vector` 来执行此操作，但这样我们就必须对读取的每个单词进行搜索。这可能很慢。`map`\
  \ 存储键的方式使得易于检查键是否存在，从而使我们任务中的搜索部分变得轻而易举：\n\n```\nint main()\n{\n        map<string,int>\
  \ words;                                  // 存储 (word,frequency)\n        while\
  \ (cin >> word) {\n            words[word]++;\n        }\n        for (const auto&\
  \ [key,value] : words) {\n            cout << key << \": \" << value << endl;\n\
  \        }\n}\n```\n\n### 20.2.1 结构化绑定\n\n查看 `map` 节点是使用返回多个值的示例。事实上，解引用 `map` 迭代器会得到一个具有\
  \ `first` 和 `second` 成员的 `pair`。为什么是 `first` 和 `second`？嗯，为什么不呢？`pair` 的实现者必须给它们起名字。另一方面，作为这个特定的\
  \ `pair<string,int>` 的用户，我们将这些值认为是 `key` 和 `value`。一种名为*结构化绑定（structured binding）*的机制允许我们为函数返回结构的成员命名。例如：\n\
  \n```cpp\nfor (const auto& [key,value] : words) {\n    cout << key << \": \" <<\
  \ value << endl;\n}\n```\n\n\n\n对 `words` 的迭代返回指向 `pair<key,value>` 对象的引用。结构化绑定（structured\
  \ binding）允许我们直接使用喜好的名称 `key` 和 `value` 来代替这些 `pair` 的 `first` 和 `second`。没有进行额外的拷贝。\n\
  \n与所有强大的机制一样，结构化绑定可能会过度使用并导致代码晦涩，但在情况下，正如许多情况下一样，我们认为它让代码更具可读性。\n\n## 20.2.2 map\
  \ 概述\n\n### CC\n\n那么什么是 map？实现 map 有多种方法，但 STL 的 `map` 实现倾向于平衡二叉搜索树；更具体地说，它们是红黑树。我们不会深入细节，但现在你已经知道了这些术语，如果你想了解更多，可以在文献或网上查阅。树由节点组成：\n\
  \n![一张定义 map 节点的图表。一个 map 节点定义为 Key key, Value val, Node asterisk left, Node asterisk\
  \ right。](img/f0582-01.jpg)\n\n`Node` 包含一个键、其对应的值以及指向两个后代 `Node` 的指针。\n\n假设有一个带有适当构造函数的类型\
  \ `Fruit`，我们可以写出\n\n点击此处查看代码图像\n\n```\nmap<Fruit,int> fruits = { {Kiwi,100}, {Quince,0},\
  \ {Plum,8}, {Apple,7}, {Grape,2345}, {Orange,99} };\n```\n\n这生成了一个如下的数据结构：\n\n![树形图中水果类数据结构的数据表。Orange\
  \ 99 被分为 Grape 2345 和 Quince 0。Grape 2345 被分为 Apple 7 和 Kiwi 100。Quince 0 被分为 Plum\
  \ 8 和末尾之外的一个。](img/f0583-01.jpg)\n\n将 `map<Fruit,int>` 节点的键成员命名为 `key`，二叉搜索树的基本规则是：\n\
  \n点击此处查看代码图像\n\n```\nleft−>key<key && key<right−>key\n```\n\n也就是说，对于每个节点：\n\n* \
  \  它的左子节点的键小于该节点的键，且\n*   该节点的键小于其右子节点的键\n\n### AA\n\n你可以验证这一规则对于树中的每个节点都成立。这允许我们“从根节点开始沿树向下”进行搜索。有趣的是，在计算机科学文献中，树是从根节点向下生长的。在示例中，根节点是\
  \ `{Orange,99}`。我们只需沿着树向下比较，直到找到我们正在寻找的内容或它本应该所在的位置。当每个子树（如上面的示例）的节点数量与距离根节点同样远的其他子树大致相等时，这棵树被称为*平衡的*（balanced）。平衡可以最小化我们为到达某个节点而需要访问的平均节点数。\n\
  \n平衡树 `Node` 通常还持有一些数据，map 将使用这些数据来保持其节点树的平衡。如果一个拥有 `N` 个节点的树是平衡的，我们最多只需要查看 `log2(N)`\
  \ 个节点即可找到某个节点。这比如果将键放在列表中从头开始搜索而需要检查的平均 `N/2` 个节点好得多（这种线性搜索的最坏情况是 `N`）。（另参见 §20.3。）例如，看看这棵不平衡树：\n\
  \n![树形图中水果类数据结构的数据表。Quince 0 被分为 Orange 99 和末尾之外的一个。Orange 99 被分为 Grape 2345 和 Plum\
  \ 8。Grape 2345 被分为 Apple 7 和 Kiwi 100。](img/f0583-02.jpg)\n\n这棵树仍然满足每个节点的键大于其左子节点键且小于其右子节点键的标准：\n\
  \n点击此处查看代码图像\n\n```\nleft−>key<key && key<right−>key\n```\n\n然而，这个版本的树是不平衡的，因此我们现在到达\
  \ Apple 和 Kiwi 需要三次“跳跃”，而不是像在平衡树中那样的两次。对于拥有许多个节点的树来说，这种差异可能是巨大的，因此用于实现 `map` 的树是平衡的。\n\
  \n使用 `map` 并不需要理解树。但假设专业人士至少理解其工具的基础原理是合理的。我们必须理解的是标准库提供的 `map` 接口。这是一个稍微简化的版本：\n\
  \n点击此处查看代码图像\n\n```\ntemplate<typename Key, typename Value, binary_operation<Value>\
  \ Cmp = less<Key>>\nclass map {\n        // ...\n        using value_type = pair<Key,Value>;\
  \                         // map 处理 (Key,Value) 对\n\n        using iterator = sometype1;\
  \                                       // 类似于指向树节点的指针\n        using const_iterator\
  \ = sometype2;\n\n        iterator begin();                                    \
  \                     // 指向第一个元素\n        iterator end();                      \
  \                                      // 指向最后一个元素之后\n\n        Value& operator[](const\
  \ Key& k);                              //下标\n\n        iterator find(const Key&\
  \ k);                                        // 查找 k\n\n        iterator erase(iterator\
  \ p);                                           // 删除指向 p 的元素\n        pair<iterator,\
  \ bool> insert(const value_type&);          // 插入 (key,value) 对\n        // ...\n\
  };\n```\n\n你可以想象迭代器类似于 `Node*`，但你不能依赖这种特定类型来实现 map。\n\n与 `vector` 和 `list` (§19.4)\
  \ 的相似性显而易见。主要的区别在于，当你遍历 `map` 时，元素是类型为 `pair<Key,Value>` 的对。这种类型是：\n\n点击此处查看代码图像\n\
  \n```\ntemplate<typename T1, typename T2>\nstruct pair {                       \
  \                  // std::pair 的简化版本\n         T1 first;\n         T2 second;\n\
  };\n```\n\n### CC\n\n注意，遍历 `map` 时，元素将按照键的顺序排列。例如，使用结构化绑定 (§20.2.1) 获取比 `first`\
  \ 和 `second` 更好的名称：\n\n点击此处查看代码图像\n\n```\nfor (const auto& [key,value] : fruits)\n\
  \        cout << '(' << key << ',' << value << \")\";\n```\n\n得到：\n\n点击此处查看代码图像\n\
  \n```\n(Apple,7) (Grape,2345) (Kiwi,100) (Orange,99) (Plum,8) (Quince,0)\n```\n\n\
  插入这些水果的顺序并不重要。\n\n`insert()` 操作有一个奇特的返回值，我们通常会忽略它。它包含指向 (key,value) 元素的迭代器和一个 `bool`，如果该\
  \ (key,value) 对是通过此调用插入的，则为 `true`。如果键已在 map 中，插入失败，`bool` 为 `false`。\n\n### CC\n\
  \n注意你可以通过第三个参数（map 声明中的 `Cmp`）来定义 map 使用的顺序。例如：\n\n点击此处查看代码图像\n\n```\nmap<string,\
  \ double, No_case> m;\n```\n\n`No_case` 定义了不区分大小的比较；参见 §21.5。默认情况下，顺序由 `less<Key>`\
  \ 定义，意味着“小于”。\n\n## 20.2.3 另一个 map 示例\n\n为了更好地理解 map 的用处，请考虑股票市场指数。它的工作原理是选取一组公司并为每个公司分配一个“权重”。例如，当我们上次查看道琼工业指数时，Alcoa\
  \ 的权重为 2.4808。为了得到指数的当前值，我们将每个公司的股票价格与其权重相乘，并将所有加权后的价格相加。例如：\n\n点击此处查看代码图像\n\n\n\
  \n\n```\n// 计算道琼斯工业指数：\nvector<double> dow_price = {       // 每家公司的股票价格\n      \
  \   81.86, 34.69, 54.45,\n         // ...\n};\n\nlist<double> dow_weight = {   \
  \    // 每家公司在指数中的权重\n        5.8549, 2.4808, 3.8940,\n        // ...\n};\n\ndouble\
  \ dji_index = 0;\nfor (size_ti=0;i<dow_price.size(); ++i)\n        dji_index +=\
  \ dow_price[i]*dow_weight[i];\n\ncout << \"DJI value \" << dji_index << '\\n';\n\
  ```\n\n上述代码之所以正确，当且仅当所有权重在 `vector` 中的位置与其对应的名称位置完全一致。这种关系是隐式的，很容易成为晦涩 bug 的根源。解决这个问题有许多方法，但一种很有吸引力的方法是将每个权重与其公司的股票代码（ticker\
  \ symbol）放在一起，例如（“AA”,2.4808）。“股票代码”是公司名称的缩写，用于需要简洁表示的场景。同样，我们可以将公司的股票代码与其股票价格放在一起，例如（“AA”,34.69）。最后，对于我们这些不经常接触美国股票市场的人来说，可以将公司的股票代码与公司名称放在一起，例如（“AA”,“Alcoa\
  \ Inc.”）；也就是说，我们可以维护三个对应值的映射。\n\n### 符号与价格映射 (symbol,price map)\n\n首先我们创建（符号，价格）映射：\n\
  \n点击此处查看代码图片\n\n```\nmap<string,double> dow_price = {  // 道琼斯工业指数 (符号,价格);\n   \
  \                                                      // 最新报价请访问 www.djindexes.com\n\
  \        {\"MMM\",104.48},\n        {\"AAPL\",165.02},\n        {\"MSFT\",285.76},\n\
  \        // ...\n};\n```\n\n### 符号与权重映射 (symbol,weight map)\n\n（符号，权重）映射：\n\n点击此处查看代码图片\n\
  \n```\nmap<string,double> dow_weight = {          // 道琼 (符号,权重)\n        {\"MMM\"\
  , 2.41},\n        {\"AAPL\",2.84},\n        {\"MSFT\",4.88},\n        // ...\n};\n\
  ```\n\n### 符号与名称映射 (symbol,name map)\n\n（符号，名称）映射：\n\n点击此处查看代码图片\n\n```\nmap<string,string>\
  \ dow_name = {   // 道琼 (符号,名称)\n       {\"MMM\",\"3M\"},\n       {\"AAPL\",\"Apple\"\
  },\n       {\"MSFT\",\"Microsoft\"},\n       // ...\n};\n```\n\n### 提取信息\n\n给定这些映射，我们可以方便地提取各种信息。例如：\n\
  \n点击此处查看代码图片\n\n```\ndouble caterpillar = dow_price [\"CAT\"];                 \
  \  // 从 map 中读取值\ndouble boeing_price = dow_price [\"BA\"];\n\nif (dow_price.find(\"\
  INTC\") != dow_price.end())                // 在 map 中查找条目\n        cout << \"Intel\
  \ is in the Dow\\n\";\n```\n\n遍历 map 是很容易的：\n\n点击此处查看代码图片\n\n```\nfor (const auto&\
  \ [symbol,price] : dow_price)\n        cout << symbol << '\\t' << price << '\\t'\
  \ << dow_name[symbol] << '\\n';\n```\n\n`AA`\n\n为什么有人会选择将此类数据存储在 `map` 而不是 `vector`\
  \ 中？我们使用 `map` 是为了让不同值之间的关联显式化。这是常见原因之一。另一个原因是 `map` 会按照其键定义的顺序保持其元素。当我们在上面遍历 `dow`\
  \ 时，我们按字母顺序输出了符号；如果我们使用 `vector`，就必须进行排序。使用 `map` 最常见的原因仅仅是我们想要根据键来查找值。对于大型序列，使用\
  \ `find()` 查找内容的速度远比在有序数据结构（如 `map`）中查找要慢。\n\n### 试一试\n\n让这个小例子运行起来。然后添加几家你喜欢的公司，以及你选择的权重。\n\
  \n### 20.3 unordered_map\n\n`CC`\n\n在 `vector` 中查找元素，`find()` 需要从头到目标值的元素或末尾检查所有元素。平均成本与\
  \ `vector` 的长度 (*N*) 成正比；我们将该成本称为 `O(N)`。\n\n在 `map` 中查找元素，下标运算符需要从树的根节点到目标值的元素或叶子节点检查树的所有元素。平均成本与树的深度成正比。一个持有\
  \ *N* 个元素的平衡二叉树最大深度为 `log2(N)`，因此查找成本为 `O(log2(N))`；即成本与 `log2(N)` 成正比，这与 `O(N)`\
  \ 相比实际上非常不错：\n\n| *N* | 16 |\n|---|---|\n| *O(N)* | 16 |\n| *O(log2(N))* | 4 |\n\
  \n`CC`\n\nSTL `unordered_map` 使用哈希表实现，就像 STL `map` 使用平衡二叉树实现，而 STL `vector` 使用数组实现一样。STL\
  \ 的用处之一是将所有这些存储和访问数据的方式放入通用的算法框架中。经验法则是：\n\n-   除非有充分理由，，否则使用 `vector`。\n-   如果你需要根据值进行查找，请使用\
  \ `map`（前提是你的键类型具有合理且高效的小于操作）。\n-   如果你需要在大型映射中进行大量查找且不需要有序遍历，请使用 `unordered_map`（前提是你能为你的键类型找到一个良好的哈希函数）。\n\
  \n在这里，我们不会详细描述 `unordered_map`。你可以像使用 `map` 一样完全地使用 `string` 或 `int` 类型键的 `unordered_map`，区别在于当你遍历元素时，元素是无序的。例如，我们可以这样重写道琼斯示例的部分代码：\n\
  \n点击此处查看代码图片\n\n```cpp\nunordered_map<string,double> dow_price;\n\nfor (const auto&\
  \ [symbol,price] : dow_price)\n        cout << symbol << '\\t' << price << '\\t'\
  \ << dow_name[symbol] << '\\n';\n```\n\n\n\n\n在 `dow` 中查找现在可能更快了。不过，这种提升并不显著，因为该索引中只有\
  \ 30 家公司。如果我们一直维护着纽约证券交易所所有公司的价格，我们可能会注意到性能上的差异。然而，我们会注意到一个逻辑上的区别：迭代的输出现在将不再按字母顺序排列。\n\
  \n### 20.4 计时\n\n我们提到了效率和操作速度。但这些容器的实际运行速度到底有多快？我们认为，在没有具体测量的情况下谈论“效率”是不可靠的：在没有测量数据支持的情况下，不要对效率做出断言。大-O\
  \ 复杂度（[§20.3)）衡量是一个非常好且值得考虑的——往往是出色的因素，但如果性能可能至关重要，我们想要测量一段代码运行到底需要多少时间。考虑一下：\n\n\
  点击此处查看代码图像\n\n```\nusing namespace chrono;                      // 那是计时支持的地方\n\n\
  auto t0 = system_clock::now();               // 调用的时间点\nauto x = do_something();\n\
  auto t1 = system_clock::now();\ncout << \"res: \" << x <<'\\n';\ncout << t1−t0 <<\
  \ '\\n';                              // 那是花费的时间\n```\n\n这种基本技术虽然简单，但现代计算机非常快，因此这种风格的测量需要大量的计算才能获得有意义的结果。它还需要我们反复运行测试，比如运行\
  \ 3 或 5 次，以确保我们的结果不会被计算机上正在运行的其他事情所干扰。\n\n时钟的 `now()` 函数返回一个时间点，即 `time point`（时间点），因此，两个\
  \ `time_points` 相减会得到一个时间段，即 `duration`（持续时间）。\n\n我们为什么要向输出写入 `res`？嗯，如果我们不使用 `do_something()`\
  \ 的结果，优化器会认为我们不需要运行这段代码并将其消除掉。也就是说，测得的时间将是 `0`。\n\n尽管如此，让我们尝试使用 [§4.7.5] 中的随机数生成器来测量在\
  \ `vector` 和 `map` 中查找的代价：\n\n点击此处查看代码图像\n\n```\nusing namespace chrono;       \
  \                                                      // 那是计时支持的地方\n\nvector<pair<string,int>>\
  \ v = generate(1'000'000);                          // 生成一些数据 (§4.7.5):\nstring\
  \ x = v[v.size()/2].first;                                                     \
  \       // 选定一个字符串进行搜索 (§20.2.2)\n\nauto t0 = system_clock::now();             \
  \                                         // 调用的时间点\nauto pv = ranges::find_if(v,\
  \ &x { return s.first == x; });          // 线性 own\nauto t1 = system_clock::now();\n\
  cout << \"vector: \" << pv−>second << '\\n';\ncout << duration_cast<microseconds>(t1−t0).count()\
  \ << \"us\\n\\n\";         // count() 是“时周期”的数量\n\nmap<string, int> m {v.begin(),\
  \ v.end()}; ;\nauto t2 = system_clock::now();\nauto vm = m[x];                 \
  \                                                          // 树搜索；可能会添加一个元素\nauto\
  \ t3 = system_clock::now();\ncout << \"map[]: \" << vm << '\\n';\ncout << duration_cast<microseconds>(t3−t2).count()\
  \ << \"us\\n\\n\";\n\nauto t22 = system_clock::now();\nauto pm = ranges::find_if(m,\
  \ &x { return s.first == x; });      // 线性搜索\nauto t32 = system_clock::now();\n\
  cout << \"map find_if: \" << pm−>second << '\\n';\ncout << duration_cast<microseconds>(t32−t22).count()\
  \ << \"us\\n\";\n```\n\n我们得到了：\n\n```\nvector: 665618\n3085us\n\nmap[]: 665618\n\
  2us\n\nmap find_if: 665618\n81749us\n```\n\n确切的结果在你的机器上会有所不同。\n\n本可以使用更简单的语句输出结果：\n\
  \n```\ncout << t1−t0 << \"\\n\";\n```\n\n然而，我们更倾向于明确测量单位，而 `duration_cast` 正做到了这一点；`us`\
  \ 是微秒的常用缩写，因为它看起来有点像希腊字母 μ。\n\n我们发现，简单的计时测量对于感知运行时成本非常有帮助。它们并不完美，但比猜想好得多。要准确猜测现代计算机上真实世界代码的性能是非常困难的。\n\
  \n### 尝试一下\n\n运行你自己版本的那项计时实验。至少运行三次，并使用至少三个不同数量的元素。解释你的结果。\n\n在 [§4.7.5] 中，我们承诺提供一些关于我们的\
  \ `random_int()` 函数如何工作的细节。这里是实现代码：\n\n点击此处查看代码图像\n\n```\nnamespace Random {\n \
  \       using engine = default_engine;\n        using distribution = uniform_int_distribution;\n\
  \n        engine ran;\n\n        int random_int(int min, int max) { return distribution(min,\
  \ max)(ran); }\n        int random_int(int max) { return distribution(0, max)(ran);\
  \ }\n        void seed(int s) { ran.seed(s); }\n        void seed() { ran.seed(random_device{}());\
  \ }\n}\n```\n\n`namespace Random` 是为了避免污染命名空间。`seed()` 的定义有点神奇。\n\n#### 20.4.1 日期\n\
  \n日期与 `unordered_map` 或通用容器无关，但在讨论了 `time_point` 和 `duration` 概念后，我们不可避免地会考虑到天、周和。\n\
  \n这是一个简单的示例：\n\n点击此处查看代码图像\n\n```\nusing namespace chrono;\n\nauto now = system_clock::now();\
  \                   // 时钟精度，可能是微秒或更低\nauto today = floor<days>(now);           \
  \          // 将时间取整到天\ncout << weekday(today) << '\\n';                     // Tue\n\
  cout << format(\"{:%A}\\n\", weekday(today));   // Tuesday\n```\n\n首先获取时间，然后将其取整到天的精度（而不是更小的单位），然后输出星期。默认输出是\
  \ `Tue`，但如果我们不喜欢这种缩写，可以使用 `format()` 获取 `Tuesday` (§9.10.6)。\n\n我们可以使用 `chrono`\
  \ 中的设施制作日历并对其进行操作。例如：\n\n点击此处查看代码图像\n\n```\nsys_days xmas = December/24/2023;\n\
  cout << \"New Year \" << xmas + days{7} << '\\n';\n```\n\n如果你可能需要编写处理人类尺度时间的代码，阅读标准库中\
  \ `chrono` 关于日期和时区的设施。这个库组件比某人的自制代码更有可能给出正确的结果。标准库组件经过测试并有文档记录。此外，其设计者考虑的现实世界需求和限制远比我们在解决问题时考虑的要。例如，`chrono`\
  \ 能够正确处理时区和闰秒。\n\n除此之外，`chrono` 库的速度极其惊人。\n\n## 20.5 Set\n\n\n\n我们可以将 `set` 视为一种\
  \ `map`，只不过我们对值（values）不感兴趣，或者说它是一个没有独立值的 `map`。我们可以这样可视化一个 `set` 节点：\n\n![图表定义了一个\
  \ set 节点。map 节点定义为 Key key，Node asterisk left，Node asterisk right。](img/f0591-01.jpg)\n\
  \n我们可以这样表示 `map` 示例中使用的水果 `set` ([§20.2.2)：\n\n![树形图中的水果数据结构数据表。橙子被分为葡萄和木瓜。葡萄被分为苹果和奇异果。木瓜被分为李子和最后一个之外的项。](img/f0592-01.jpg)\n\
  \n`set` 有什么用呢？事实上，有很多问题需要我们记住是否见过某个值。跟踪哪些水果是可用的（与价格无关）是其中一个例子；构建字典是另一个。另一种略有不同的用法是拥有一组“记录”的\
  \ `set`；即元素是可能包含“大量”信息的对象——我们只需使用一个成员作为键。例如：\n\n点击此处查看代码图像\n\n```cpp\nstruct Fruit\
  \ {\n        string name;\n        int count;\n        double unit_price;\n    \
  \    Date last_sale_date;\n};\n\nstruct Fruit_order {\n        bool operator()(const\
  \ Fruit& a, const Fruit& b) const\n        {\n                return a.name<b.name;\n\
  \        }\n};\n\nset<Fruit, Fruit_order> inventory;          // 使用 Fruit_order(x,y)\
  \ 比较 Fruits\n```\n\n在这里，我们再次看到使用函数对象 ([§21.2)）如何显著增加 STL 组件适用的问题范围。\n\n### CC\n\n\
  由于 `set` 没有值类型，它也不支持下标操作（`operator[]()`）。我们必须使用“列表操作”，例如 `insert()` 和 `erase()`。遗憾的是，`map`\
  \ 和 `set` 也不支持 `push_back()` ——其原因显而易见：是由 `set` 而不是程序员来决定新值插入的位置。请改用 `insert()`。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\ninventory.insert(Fruit{\"quince\",5});\ninventory.insert(Fruit{\"\
  apple\",200,0.37});\n```\n\n`set` 优于 `map` 的一个优点是你可以直接使用从迭代器获取的值：解引用运算符给出元素类型的值：\n\
  \n点击此处查看代码图像\n\n```cpp\nfor (auto p = inventory.begin(); p!=inventory.end(); ++p)\n\
  \        cout << *p << '\\n';\n```\n\n当然，前提是你已经为 `Fruit` 定义了 `<<`。或者我们可以等价地写成\n\n\
  点击此处查看代码图像\n\n```cpp\nfor (const auto& x : inventory)\n        cout << x << '\\\
  n';\n```\n\n### 20.6 容器概述\n\nSTL 提供了许多容器：\n\n| 标准容器 | |\n| --- |\n| `vector` | 连续分配的元素序列；用作默认容器\
  \ |\n| `list` | 双向链表；当需要插入和删除元素且不移动现有元素时使用 |\n| `forward_list` | 单向链表；用于大部分为空的列表\
  \ |\n| `deque` | `list` 和 `vector` 的结合体；在未对算法和机器架构拥有专家级知识之前不要使用 |\n| `map` | 平衡有序树；当你需要通过值访问元素时使用\
  \ ([§20.2)） |\n| `multimap` | 平衡有序树，其中键可以有多个副本的；当你需要通过值访问元素时使用 |\n| `unordered_map`\
  \ | 哈希表；`map` 的优化版本；当您需要高性能且能设计出良好的哈希函数时，用于大型 map ([§20.3)） |\n| `unordered_multimap`\
  \ | 哈希表，其中键可以有多个副本的；`multimap` 的优化版本；当您需要高性能且能设计出良好的哈希函数时，用于大型 map |\n| `set` |\
  \ 平衡有序树；当你需要跟踪单个值时使用 ([§20.5)） |\n| `multiset` | 平衡有序树，其中键可以有多个副本的；当你需要跟踪单个值时使用\
  \ |\n| `unordered_set` | 类似于 `unordered_map`，但只有值，没有（键，值）对 |\n| `unordered_multiset`\
  \ | 类似于 `unordered_multimap`，但只有值，没有（键，值）对 |\n\n你可以在书籍和在线文档中查找关于这些容器及其用法的海量额外信息。\n\
  \n### AA\n\n你觉得被骗了吗？你认为我们应该解释容器的所有内容？功能和库太多，你无法吸收。一旦你理解了 `vector`、`list` 和 `map`，你就会发现其他容器很容易使用。\n\
  \n### CC\n\n什么是容器？你可以在上述来源中找到 STL 容器的定义。在这里我们只给出一个非正式的定义。STL 容器\n\n*   拥有一个元素序列\
  \ [`begin()`:`end()`。\n*   提供所有元素的拷贝操作。\n*   提供所有元素的移动操作。\n*   将其元素类型命名为 `value_type`。\n\
  *   拥有迭代器类型 `iterator` 和 `const_iterator`。迭代器提供 `*`、`++`（前置和后置）、`==` 和 `!=` 以及相应的语义。`list`\
  \ 的迭代器还提供 `--` 以向后移动；这被称为*双向迭代器*。`vector` 的迭代器还提供 `--`、`[]`、`+` 和 `−`，被称为*随机访问迭代器*\
  \ ([§20.7.1)）。\n*   提供 `insert()` 和 `erase()`、`front()` 和 `back()`、`push_back()`\
  \ 和 `pop_back()`、`size()`、`swap()` 等；`vector` 和 `map` 还提供下标（例如运算符 `[]`）。\n*   提供比较元素的比较运算符（`==`、`!=`、`<`、`<=`、`>`\
  \ 和 `>=`）。容器对 `<`, `<=`、`>` 和 `>=` 使用字典序排序；即它们从第一个元素开始顺序比较元素。\n\n`forward_list`\
  \ 是一个只提供正向迭代器而不提供更多功能的容器示例。也就是说，我们可以从开始到结束遍历 `forward_list`，但反之不行。\n\n例如：\n\n点击此处查看代码图像\n\
  \n\n\n\n```\nforward_list<double> lst = {0.0,1.1,2.2,3.3};\nfor (auto p = lst.begin();\
  \ p!=lst::end(); ++p)             // OK (但冗长)\n        cout << *p << '\\n';\nfor\
  \ (auto p = lst.end(); p!=lst::begin(); −−p)             // 错误: 无法后移动 (没有 --)\n\
  \        cout << *p << '\\n';\nfor (const int x : lst)                         \
  \                       // OK\n        cout << *p << '\\n';\nsize_t sz = lst.size();\
  \                                               // 错误: forward_list 没有 size()\n\
  size_t sz2 = 0;\nfor (auto p = lst.begin(); p!=lst::end(); ++p)            // OK\n\
  \        ++sz2;\n```\n\n为什么没有 `size()`？通过*不*存储大小，`forward_list` 可以被表示为指向其第一个节点的单个指针（如果存在）。这种最小尺寸是非常重要的，因为\
  \ `forward_list` 的一个用法是需要成千上万个通常为空的容器。如果你想知道 `forward_list` 的元素数量，只需数一下即可。\n\n注意，在示例中我们遍历了\
  \ `lst` 三次。输入迭代器和前向迭代器的区别在于，你可以使用前向迭代器多次遍历序列。\n\n### 20.6.1 几乎容器 (Almost containers)\n\
  \n某些数据类型提供了标准容器的大部分功能，但并非全部。我们有时将它们称为“几乎容器”。其中最有趣的是：\n\n| “几乎容器” |\n| --- |\n| `T[n]`\
  \ | 内置数组；没有 `size()`或其他成员函数；在有选择时，优先使用容器（如 `vector`、`string` 或 `array`）而不是内置数组。\
  \ |\n| `array` | 固定大小的数组，不会受到大多数与内置数组相关的问题的影响 (§20.6.2)。 |\n| `string` | 仅存储字符，但提供了对文本处理有的操作，例如拼接（`+`\
  \ 和 `+=`）；优先使用标准字符串而不是其他字符串。 |\n| `valarray` | 一种带有数学向量操作的数值向量，但有许多限制以鼓励高性能的实现；仅在你进行大量向量算术运算时才使用。\
  \ |\n\n此外，许多个人和组织已经了符合标准容器要求（或几乎符合）的容器。\n\n**AA**\n\n如果有疑问，使用 `vector`。除非你有充分理由不使用，否则请使用\
  \ `vector`。\n\n### 20.6.2 array\n\n我们反复指出内置数组的缺点：它们在稍有触发时就会隐式转换为指针，不能通过赋值进行拷贝，它们不知道自己的大小等\
  \ (§16.1)。我们我们也指出了它们的主要优势：它们几乎完美地模拟了物理内存。为了兼得两者的完美，标准库提供了 `array<T,N>`，它“知道”自己的大小是\
  \ `N` (§16.4.2)。作为一个示例，我们可以为 §19.3.2 中的 `high()` 示例编写 `array` 版本：\n\n点击此处查看代码图像\n\
  \n```\nvoid f()\n{\n        array<double,6> arr = { 0.0, 1.1, 3.3, 5.5, 2.2, 4.4\
  \ };\n        auto p = high(arr.begin(), arr.end());\n        cout << \"the highest\
  \ value was \" << *p << '\\n';\n}\n```\n\n注意，我们在写 `high()` 时并没有考虑过 `array`。能够为 `array`\
  \ 使用 `high()` 是遵循两者标准惯例的简单结果。\n\n在序列中寻找最大的元素是常见需求，因此标准库提供了一个版本。我们甚至可以说：\n\n点击此处查看代码图像\n\
  \n```\nauto p = ranges::max_element(arr);      // p 是指向 arr 中最高值元素的迭代器\n```\n\n\
  鉴于 `array<T,N>` 知道其元素数量，我们可以像 `vector` 那样提供赋值、`==`、`!=` 等。\n\n### 20.6.3 将内置数组适配到\
  \ STL\n\n当作用域内有内置数组的定义时，我们实际上可以看到它有多少个元素。例如：\n\n点击此处查看代码图像\n\n```\nvoid f(int[]\
  \ a1)          // int[] 看起来像数组，但实际上只是指针：int*\n{\n        int a2[10];        // 显然有\
  \ 10 个元素\n        // ...\n}\n```\n\n我们拥有了将 `a2` 视为 [begin:end) 序列的所有信息，只需要一种方便的方法引用它。标准库提供了\
  \ `begin()` 和 `end()`：\n\n\n\n\n迭代器 `eos` 是流迭代器对“输入末尾”的表示。当一个 `istream` 到达输入末尾（通常称为\
  \ `eof`）时，它的 `istream_iterator` 将等于默认的 `istream_iterator`（此处称为 `eos`）。\n\n## XX\n\
  \n注意，我们通过一对迭代器初始化了 `vector`。作为容器的初始化器，一对迭代器对 `(a,b)` 意味着“将序列 `[a:b]` 读入容器中”。自然地，我们使用的迭代器对是\
  \ `(ii,eos)` —— 输入的开始和结束。这避免了我们显式地使用 `>>` 和 `push_back()`。我们强烈建议不要使用替代方案：\n\n点击此处查看代码图片\n\
  \n```cpp\nvector<string> b {max_size};     // 不要对输入的数量猜测！\ncopy(ii,eos,b.begin());\n\
  ```\n\n尝试猜测输入最大大小的人往往会发现自己低估了，从而导致严重的问题——无论是对他们自己还是对他们的用户——这些问题源于结果性的缓冲区溢出。此类溢出也是安全问题的来源。\n\
  \n## 尝试一下\n\n首先让编写所示的程序运行起来，并用一个小文件（例如几百个单词）进行测试。然后尝试那个*极不建议*的、猜测输入大小的版本，看看当输入缓冲区\
  \ `b` 溢出时会发生什么。注意，最坏的情况是溢出在你的特定示例中没有导致任何坏处，以至于你会忍不住将其交给用户。\n\n在我们的小程序中，我们读取了单词并对它们进行了排序。这在当时看来是一种显而易见的方法，但为什么要单词放在“错误的位置”，导致我们以后不得不进行排序呢？更糟糕的是，我们发现存储一个单词并按照它在输入中出现的次数打印它。\n\
  \n我们可以使用 `unique_copy()` 代替 `copy()` 来解决后者的问题。`unique_copy()` 不会拷贝重复的相同值。例如，使用普通的\
  \ `copy()`，程序将处理 \"man bit the dog\" 并产生：\n\n```\nbit\ndog\nman\nthe\nthe\n```\n\
  \n如果我们使用 `unique_copy()`，程序将写入：\n\n```\nbit\ndog\nman\nthe\n```\n\n## AA\n\n那些换行符是从哪里来的？使用分隔符输出是非常常见的，以至于\
  \ `ostream_iterator` 的构造函数允许你（可选地）指定一个在每个值之后打印的字符串：\n\n点击此处查看代码图片\n\n```cpp\nostream_iterator<string>\
  \ oo {os,\"\\n\"};    //为流创建输出迭代器\n```\n\n显然，对于人类阅读的输出，换行是一个流行的选择，但也许我们更倾向于使用空格作为分隔符？我们可以写：\n\
  \n点击此处查看代码图片\n\n```cpp\nostream_iterator<string> oo {os,\" \"};    //为流创建输出迭代器\n\
  ```\n\n这将给我们输出：\n\n```\nbit dog man the\n```\n\n### 20.6.5 使用 set 保持顺序\n\n获取该输出更简单的方法；使用\
  \ `set` 而不是 `vector`：\n\n点击此处查看代码图片\n\n```cpp\nint main()\n{\n        string from,\
  \ to;\n        cin >> from >> to;           //获取源和目标文件名\n\n        ifstream is {from};\
  \           //创建输入流\n        ofstream os {to};             //创建输出流\n\n        set<string>\
  \ b {istream_iterator<string>{is}, istream_iterator<string>{}};\n        copy(b.begin(),b.end(),\
  \ ostream_iterator<string>{os,\" \"});            //将缓冲区拷贝到输出\n}\n```\n\n## CC\n\
  \n当我们向 `set` 插入值时，重复会被忽略。此外，`set` 的元素按顺序保持，因此不需要排序。有了正确的工具，大多数任务都是轻松的。\n\n自然地，我们甚至可以使用\
  \ `ranges::copy()`：\n\n点击此处查看代码图片\n\n```cpp\nranges::copy(b, ostream_iterator<string>{os,\"\
  \ \"});          //将缓冲区拷贝到输出\n```\n\n### 20.7 Ranges 和迭代器\n\n我们已经使用 ranges 有很长时间了。它们是我们使用序列和算法处理序列的首选方式，因为它们更容易编写，并且不会像直接使用迭代器那样提供犯错的机会。考虑：\n\
  \n点击此处查看代码图片\n\n```cpp\nsort(v.end(),v.start());           // 哎！\nsort(v1.start(),v2.end());\
  \       // 哎！\n```\n\nRanges 没有比显式使用迭代器灵活，这意味着出错的机会更少：\n\n点击此处查看代码图片\n\n```cpp\n\
  ranges::sort(v);                       // 如果这不符合逻辑，编译器会告诉我们\n```\n\n到为止，我们认为 range\
  \ 是由一对迭代器定义的，分别指向第一个元素（如果有的话）和最后一个元素之后的那个元素。然而，流迭代器表明这种观点仅仅是种简化。事实上，我们可以通过三种方式定义一个\
  \ range：\n\n*   `{begin,end}`：一对迭代器\n*   `{begin,length}`：一个迭代器和一个长度\n*   `{begin,predicate}`：一个迭代和一个谓词\n\
  \n#### 20.7.1 迭代器分类\n\n我们一直以来把迭代器看作是由一对指向第一个元素（如果有）和最后一个元素之后的那个元素的迭代器定义的。然而，流迭代器表明这种观点是种简化。事实上，我们可以通过三种方式定义一个\
  \ range。\n\n我们现在一直在讨论迭代器，仿佛所有的迭代器都是可交换的。如果你只需要简单的操作，你需要更高级的：\n\n| 迭代器分类 |\n| ---\
  \ |\n| input iterator | 可以向前迭代 `++` 并通过 `*` 读取值。这是 `istream` 提供的迭代器类型，见 #20.6.4。\
  \ |\n| output iterator | 可以向前迭代 `++` 并通过 `*` 写入值。这是 `ostream` 提供的迭代器类型，见 #20.6.4。\
  \ | |\n| forward iterator | 可以多次遍历序列并读取或写入的迭代器。这是 `forward_list` 提供的迭代器类型，见 #20.6.1。\
  \ | |\n| bidirectional iterator | 可以向后移动（使用 `--`）的向前迭代器。这是 `list`、`map` 和 `set`\
  \ 提供的迭代器类型。 |\n| random-access iterator | 可以通过 `+=`, `+`, `-=`, `-n` 向前向后移动 `n`\
  \ 个位置的双向迭代器。 |\n| contiguous iterator | 元素连续分布的随机访问迭代器。这是 `vector` 提供的迭代器类型。 |\n\
  \n从提供的操作可以看出，在任何可以使用输出迭代器或输入迭代器的地方，我们都可以向前迭代器。双向迭代器也是向前迭代器，而随机访问迭代器也是双向迭代器。在图中，我们可以这样表示迭代器分类：\n\
  \n![图表表示迭代器分类。](img/f0600-01.jpg)\n\n注意，由于迭代器分类不是类，这种层次结构不是通过派生实现的类层次结构。使用概念（§18.1.3）表示这些迭代器分类。\n\
  \n每个迭代器分类都有对应的 range 分类。例如：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<input_iterator In>\
  \              // 简化\nIn find(In b, In e);\n\ntemplate<ranges::input_range R>\n\
  ranges::iterator_t<R> find(R r);\n```\n\n自然地，由于 `R` 是一个 `input_range`，它的迭代器（称为 `iterator_t<R>`）是一个\
  \ `input_iterator`。你可能会奇怪在没有指向输入末尾的指针的情况下如何拥有输入范围，但迭代器的概念足够灵活，可以应对“从输入开始到输入结束”的概念（§20.6.4）。\n\
  \n#### 20.7.2 输出 ranges\n\n\n\n\n标准库提供了输出迭代器，但遗憾的是并没有提供输出范围（output ranges）。这很遗憾，因为输出范围可以用来捕获范围错误。输出范围就像一个输出迭代器，它会记录我们正在向范围中的哪个元素写入数据。考虑这个想法的简单实现：\n\
  \n点击此处查看代码图片\n\n```cpp\ntemplate<ranges::range R>\nclass Output_range {\npublic:\n\
  \        using value_type = ranges::range_value_t<R>;\n        using difference_type\
  \ = int;\n\n        Output_range(R r) : b{ r.begin() }, e{ r.end() }, p{ b } {}\n\
  \        Output_range& operator++() { check_end(); ++p; return *this; }\n      \
  \  Output_range operator++(int) { check_end(); auto t{ *this }; ++p; return t; }\n\
  \n        value_type& operator*() const { check_end(); return *p; }\nprivate:\n\
  \        void check_end() const { if (p == e) throw Overflow{}; }\n\n        ranges::iterator_t<R>\
  \ b;\n        ranges::iterator_t<R> e;\n        ranges::iterator_t<R> p;\n};\n```\n\
  \n显然，与使用普通迭代器相比，这会有成本，但范围错误通常也会带来代价。\n\n这并不是“工业级强度”或“ISO C++ 标准库质量”，但它实际上在许多场景下有效：\n\
  \n点击此处查看代码图片\n\n```cpp\nvector<int> v = {0,1,2,3,4,5};\nvector<int> v1(10);\nvector<int>\
  \ v2(5);\n\nranges::copy(v,Output_range{v1});         // 将 v 拷贝到 v1\nranges::copy(v,Output_range{v2});\
  \         // 抛 Range_error\n```\n\nSTL 是一个巨大的框架。有时我们必须扩展它来获取我们想要。然而，这很少是初学者的任务。\n\
  \n`Output_range` 实际上是一个跟踪它所迭代范围的迭代器，因此我们可以称它为 `Checked_iterator`。\n\n### 习题\n\n\
