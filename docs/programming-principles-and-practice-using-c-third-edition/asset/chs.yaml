  \n### 结记\n\n第 10 章 展示了如何成为类的使用者。本章将我们在程序员的“食物链”上提升了一层：在这里，我们不仅是工具使用者，还成为了工具的构建者。\n\
  \n## 12 类设计\n\n*功能性、耐久性、美观。*\n– 特鲁维的\n\n图形章节的目的具有双重性：我们既希望为显示信息提供实用的工具，又利用图形界面类族来演示通用的设计和实现技术。特别是本章介绍了接口设计的一些思想和继承的概念。在此过程中，我们必须稍微绕路，检查最直接支持面向对象编程的语言特性：类派生、虚函数和访问控制。我们认为设计不能脱离使用和实现而独立讨论，因此我们对设计的讨论相当具体。你可以将本章视为“类的设计与实现”，甚至是“面向对象编程”。\n\
  \n- §12.1 设计原则\n- 类型; 操作; 命名; 可变性\n- §12.2 形状\n- 抽象类; 访问控制; 绘制形状\n- §12.3 基类与派生类\n\
  - 对象布局; 派生类与虚函数的定义; 重写; 访问; 纯虚函数\n- §12.4 其他形状函数\n- 拷贝; 移动形状\n- §12.5 面向对象编程的益处\n\
  \n### 12.1 设计原则\n\n本章专注于通常被称为面向对象编程的技术。作为补充，我们还介绍了具体的类（第 8 章、第 17 章）和参数化类（第 18 章）以及相关技术。\n\
  \n#### 12.1.1 类型\n\n我们图形接口类的设计原则是什么？首先：这是一个什么问题？什么是“设计原则”，我们为什么要关注这些而不是直接开始编写漂亮图片的正经事？\n\
  \n**CC**\n\n图形是一个应用领域的示例。因此，我们在这里看到的是如何向程序员（如我们）展示一组基本的应用概念和设施的示例。如果这些概念在代码中的呈现方式混乱、不一致、不完整或以其他方式表示不当，那么生成图形输出的难度就会增加。\n\
  \n**CC**\n\n我们的设计理念是直接在代码中表示应用领域。这样，如果你理解了应用领域，就理解了代码。例如：\n\n- `Window` —— 操作系统呈现的窗口\n\
  - `Line` —— 你在屏幕上看到的线条\n- `Point` —— 坐标\n- `Color` —— 你在屏幕上看到的颜色\n- `Shape` —— 我们图形中所有形状的共性\n\
  \n最后一个例子 `Shape` 与其他不同之处在于它是一个泛化，一个纯抽象的概念。我们不在屏幕上只看到形状；我们看到的是具体的形状，如线条或六边形。你会在我们的类型定义中发现这一点：尝试创建一个\
  \ `Shape` 变量，编译器会阻止你。\n\n我们的图形类集合是一个库；这些类旨在被组合使用。当你在定义表示其他图形形状的类时，它们可以作为示例和构建块。我们并不是在定义一组无关的类，因此不能孤立地为每个类做设计。我们的类共同展示了如何做图形的视图。我们必须确保这种视图是优雅且贯的。考虑到库的大小和图形应用的庞大，我们无法追求完全性。相反，我们追求的是简单性和扩展性。\n\
  \n\n\n\n我们在这里提供的类是为简单的图形和简单的图形用户界面设计的。它们主要针对需要从数值/科学/工程应用中展示数据和图形输出的用户。你可以在我们的类“之上”构建自己的类。如果这还不够，我们在实现中暴露了足够的\
  \ Qt 细节，以便在你有需要时能够直接使用它们（或类似的“完整版”工业级图形/GUI 库）。但是，如果你决定走那条路，请等到你掌握第 15 章、第 16 章\
  \ 和 第 17 章。这些章节包含了指针和内存管理信息，这是成功直接使用大多数图形/GUI 库所需要的。\n\n## AA\n\n一个关键决策是提供许多操作较少的“小”类。例如，我们提供了\
  \ `Open_polyline`、`Closed_polyline`、`Polygon`、`Rectangle`、`Marked_polyline`、`Marks`\
  \ 和 `Mark`，而我们本可以提供一个类（可能称为“polyline”），带有大量的参数和操作，允许我们指定对象的折线类型，甚至可能将折线从一种类型变为另一种类型。这种思维的极端是将每种形状都作为单个类\
  \ `Shape` 的一部分。我们认为：\n\n*   许多小类最接近且最用的方式建模了我们的领域。\n*   提供“所有内容”的单个类会让用户在处理数据和选项时，缺乏能够帮助理解、调试和优化性能的框架。\n\
  *   大类和大型函数比一组小类更难编写正确。\n*   “许多小类”模型简化了向库中添加新类的过程。\n\n例如，想象一下在表示 `Shape` 的两种替代方案中添加一个\
  \ `Spline` 或 `Clock_face` 需要什么。\n\n### 12.1.2 Operations\n\n## CC\n\n我们在每个类中都提供了最少的操作。我们的理想是提供一个能够实现心愿的最小接口。当我们想要更大的便利性时，始终可以以添加非成员函数或另一个类的形式来提供。\n\
  \n## AA\n\n我们希望类的接口显示出统一的风格。例如，不同类中执行相似操作的所有函数具有相同的名称、接收相同类型的参数，并在可能的情况下以相同的顺序要求这些参数。考虑构造函数：如果形状需要一个位置，它将\
  \ `Point` 作为其第一个参数：\n\n点击此处查看代码图像\n\n```\nLine ln {Point{100,200},Point{300,400}};\n\
  Mark m {Point{100,200},'x'};                              // 将单个点显示为 ’x’\nCircle\
  \ c {Point{200,200},250};\n```\n\n所有处理点的函数都使用 `Point` 类来表示它们。这似乎是显而易见的，但许多库却表现出混合的风格。例如，想象一个画线的函数。我们可以使用两种风格中的一种：\n\
  \n点击此处查看代码图像\n\n```\nvoid draw_line(Point p1, Point p2);                       \
  \       // 从 p1 到 p2 (我们的风格)\nvoid draw_line(int x1, int y1, int x2, int y2);  \
  \               // 从 (x1,y1) 到 (x2,y2)\n```\n\n我们甚至允许两者并行，但为了一致性、更好的类型检查和更高的可读性，我们专门使用第一种风格。一致地使用\
  \ `Point` 还避免了坐标对与另一对常见的整数（宽度和高度）之间的混淆。例如，考虑：\n\n点击此处查看代码图像\n\n```\ndraw_rectangle(Point{100,200},\
  \ 300, 400);              // 我们的风格\ndraw_rectangle(100,200,300,400);           \
  \               // 另一种\n```\n\n第一个调用绘制了一个带有点、宽度和高度的矩形。这相当容易猜，但第二个调用呢？它是由点 (100,200)\
  \ 和 (300,400) 定义的矩形吗？还是由点 (100,200)、宽度 300 和高度 400 定义的矩形？或者是完全不同的东西（尽管对某些人来说合理的）？一致地使用\
  \ `Point` 类型避免了这种混淆。\n\n顺便提一下，如果函数需要宽度和高度，它们总是以这种顺序呈现（正如我们总是先给出 *x* 坐标再给出 *y* 坐标一样）。保持这些小细节的一致性对易用性和避免运行时错误产生了惊人的巨大影响。\n\
  \n## AA\n\n逻辑上相同的操作具有相同的名称。例如，向任何类型的形状添加点、线等的每个函数都称为 `add()`。这种统一性有助于我们记忆（通过减少需要记忆的细节），并在设计新类时帮助我们（“照常操作”）。有时，它甚至允许我们编写适用于许多不同类型的代码，因为这些类型的操作具有相同的模式。这种代码被称为*泛型*的；参见第\
  \ 19 章、第 20 章。\n\n### 12.1.3 Naming\n\n## AA\n\n逻辑上相同的操作具有相同的名称。例如，向任何类型的形状添加点、线等的每个函数都称为\
  \ `add()`。这种统一性有助于我们记忆（通过减少需要记忆的细节），并在设计新类时帮助我们（“照常操作”）。有时，它甚至允许我们编写适用于许多不同类型的代码，因为这些类型的操作具有相同的模式。这种代码被称为*泛型*的；参见第\
  \ 19 章、第 20 章。\n\n\n\n\n请注意，如果我们将 `f()` 声明为接受 `const` 引用作为 `Window` 参数（如 §7.4.6\
  \ 所示），编译器将阻止我们的错误。然而，我们无法对 `const Window` 执行 `attach(r)`，因为 `attach()` 需要修改 `Window`\
  \ 以记录该 `Window` 对 `r` 的感兴趣。\n\n## 12.1.4 可变性\n\n### CC\n\n当我们设计一个类时，“谁可以修改数据（表示）？”以及“如何修改？”是我们必须回答的关键问题。我们试图确保对对象状态的修改仅由其自身的类完成。`public`/`private`\
  \ 的区别是此的关键，但我们将展示使用更灵活/更细微机制（`protected`）的示例。这意味着我们不能简单地给类分配一个数据成员，例如一个名为 `label`\
  \ 的 `string`；我们还必须考虑在构造后是否应该允许进行修改，如果是，该如何修改。我们还必须决定除了类成员函数以外的代码是否需要读取 `label` 的值，如果是，该如何读取。例如：\n\
  \n点击此处查看代码图像\n\n```\nstruct Circle {\n       // ...\nprivate:\n       int r;   \
  \       // radius\n};\n\nCircle c {Point{100,200},50};\nc.r = −9;           // OK?\
  \ 不，编译时错误：Circle::r 是私有的\n```\n\n### AA\n\n正如你在第 11 章中可能注意到的，我们决定防止对大多数数据成员的直接访问。不直接暴露数据让我们有机会检查某些“愚蠢”的值，例如半径为负数的\
  \ `Circle`。为了实现上的简单性，我们没有充分充分利用这个检查错误的机会，因此请小心你的值。不进行一致且完全检查的决定反映了保持演示代码简洁的考虑，并且我们知道如果用户（你或我们）提供了“愚蠢”的值，结果仅仅是屏幕上出现混乱的图像，而不是宝贵数据的损坏。\n\
  \n我们将屏幕（视为一组 `Window`）纯粹视为一个输出设备。我们可以显示新对象并移除旧对象，但我们永远不会向“系统”索取我们自己无法（或不能）从已构建的表示图像的数据结构中获取的信息。\n\
  \n## 12.2 Shape\n\n`Shape` 类表示了出现在屏幕 `Window` 中的某些事物的通用概念：\n\n* 它是将我们的图形对象与 `Window`\
  \ 抽象联系起来的概念，而 `Window` 进而提供了与操作系统和物理屏幕的连接。\n* 它是处理颜色和绘制线条样式的类。为了做到这一点，它持有 `Line_style`、用于线条的\
  \ `Color` 以及用于填充的 `Color`。\n* 它可以持有 `Point` 序列，并有关于如何绘制它们的基本概念。\n\n经验丰富的设计师会意识到，一个承担三件事的类的通用性上可能存在问题。然而，在这里，我们需要比最通用解决方案简单得多的东西。\n\
  \n我们将首先介绍完整的类，然后讨论它的细节：\n\n点击此处查看代码图像\n\n```\nstruct Shape {                  //\
  \ 处理颜色和样式，并持有线条序列\n       virtual ˜Shape() {                                   \
  \                        // 析构函数：见 §15.5.2\n\n       Shape(const Shape&) = delete;\
  \                                      // 防止拷贝：见 §12.4.1\n       Shape& operator=(const\
  \ Shape&) = delete;\n\n       virtual void move(int dx, int dy);               \
  \                     // 移动形状 +=dx 和 +=dy\n\n       void set_color(Color col) {\
  \ lcolor = col; redraw(); }        // 写\n       Color color() const { return lcolor;\
  \ }                               // \n\n       void set_style(Line_style sty) {\
  \ ls = sty; redraw(); }\n       Line_style style() const { return ls; }\n\n    \
  \   void set_fill_color(Color col) { fcolor = col; redraw(); }\n       Color fill_color()\
  \ const { return fcolor; }\n\n       Point point(int i) const { return points[i];\
  \ }\n       int number_of_points() const { return naro<int>(points.size()); }\n\n\
  \       void set_window(Window* win) { parent_window = win; }\n\n       void draw(Painter&\
  \ painter) const;                                  // 处理颜色和绘制细节\nprotected:\n  \
  \     Shape(std::initializer_list<Point> lst = {});                      // 将 Points\
  \ 添加到此 Shape\n\n       void add(Point p){ points.push_back(p); redraw(); }\n   \
  \    void set_point(int i, Point p) { points[i] = p; redraw(); }\n\n       void\
  \ redraw();\nprivate:\n       virtual void draw_specifics(Painter& painter) const\
  \ = 0; // 绘制此特定形状\n\n       Window* parent_window = nullptr;                   \
  \             // Shape 出现的窗口\n       vector<Point> points;                     \
  \                                // 并非所有形状都使用\n       Color lcolor = Color::black;\n\
  \       Line_style ls;                                                         \
  \        // 使用默认线条样式\n       Color fcolor = Color::invisible;                  \
  \                    // 填充颜色\n};\n```\n\n这是一个复杂的类，旨在支持各种图形类并表示屏幕上形状的通用概念。然而，它仍然只有\
  \ 5 个数据成员和 19 个函数。此外，这些函数都是非常微不足道的，因此我们可以专注于设计问题上。在本节的剩余部分中，我们将逐一遍历成员，并解释它们在设计中的作用。\n\
  \n### 12.2.1 抽象类\n\n首先考虑 `Shape` 的构造函数：\n\n点击此处查看代码图像\n\n```\nprotected:\n     \
  \   Shape(initializer_list<Point> lst = {});            // 将 Points 添加到此 Shape\n\
  ```\n\n构造函数 `add()` 将其参数列表的元素添加到 `Shape` 的 `vector<Point>` 中：\n\n点击此处查看代码图像\n\n\
  ```\nShape::Shape(initializer_list<Point> lst)\n{\n        for (Point p : lst)\n\
  \                add(p);\n}\n```\n\n如果我们不提供一组 `Points`，它将默认为空的 `initializer_list`。\n\
  \n构造函数是 `protected` 的。这意味着它只能从通过 `:Shape` 标记派生的 `Shape` 类中直接使用。也就是说，对于特定的形状，例如 `Circle`\
  \ 和 `Closed_polyline`，而不是形状的通用概念。使用 `:Shape` 标记定义的类称为*派生类*，而 `Shape` 称为它们的*基类*(§12.3)。\n\
  \n那个 `protected:` 的目的是确保我们不直接创建 `Shape` 对象。例如：\n\n点击此处查看代码图像\n\n```\nShape ss; \
  \          // 错误：无法构造 Shape\n```\n\n通过这种方式，我们直接模拟了这样想法：我们无法拥有通用形状，只能拥有特定的形状，例如 `Circle`\
  \ 和 `Closed_polyline`。思考一下！形状看起来像什么样？唯一合理的回答是反问“什么形状？”我们用 `Shape` 表示的形状概念是一个抽象概念。这是一个重要且经常使用的设计概念，因此我们不希望在程序中妥协它。允许用户直接创建\
  \ `Shape` 对象将破坏我们类作为概念直接表示的理想。\n\n\n\n\n如果一个类只能作为基类使用，那么它就是 `abstract`（抽象）的。另一种更常见的实现方法被称为\
  \ `pure virtual function`（纯虚函数）(§12.3.5)。可以创建对象——即抽象类的反面——被称为 `concrete`（具体）类。注意，`abstract`\
  \ 和 `concrete` 只是对日常区别的技术性术语。我们可能会去商店买一台相机。然而，我们不能只要求一台相机就带回家。什么种类型的相机？什么品牌的相机？哪款型号的相机？“相机”这个词是一个泛指；它指的是一个抽象概念。奥尼路\
  \ E-M5 指的是一种特定的相机，我们（通过支付一笔巨款）可能会获得它的一个特定实例：一个具有唯一序列号的特定相机。因此，“相机”非常像一个抽象（基）类；“奥尼路\
  \ EM5”非常像一个具体（派生）类，而我手中真实的相机（如果我买了的话）就会非常像该类的一个对象。\n\n### 12.2.2 访问控制\n\n类 `Shape`\
  \ 声明所有数据成员为 `private`：\n\n点击此处查看代码图像\n\n```\nprivate:\n        Window* parent_window\
  \ = nullptr;         // Shape 所在的窗口\n        vector<Point> points;             \
  \                 // 并非所有形状都使用\n        Color lcolor = Color::black;           \
  \          // 线和字符的颜色（带默认值）\n        Line_style ls;                            \
  \               // 使用默认线样式\n        Color fcolor = Color::invisible;           \
  \     // 填充颜色（默认：无颜色）\n```\n\n数据成员的初始化器不依赖于构造函数参数，因此我们在数据成员声明中指定了它们。一如既往，vector\
  \ 的默认值是“空”，所以我们不需要显式地说明这一点。构造函数将应用这些默认值。\n\n### AA\n\n由于 `Shape` 的数据成员被声明为 `private`，我们需要提供访问函数。实现这种方法有几种可能的风格。我们选择了一个我们认为简单、方便且易读的风格。如果我们有一个代表属性\
  \ `X` 的成员，我们提供一对函数 `X()` 和 `set_X()` 分别用于读取和写入。例如：\n\n点击此处查看代码图像\n\n```\nvoid Shape::set_color(Color\
  \ col)\n{\n        lcolor = col;\n}\n\nColor Shape::color() const\n{\n       return\
  \ lcolor;\n}\n```\n\n这种风格的主要不便之处在于，你不能给成员变量起与与其读取函数相同的名称。一如既往，我们为函数选择了最方便的名字，因为它们是公共接口的一部分。我们如何命名\
  \ `private` 变量影响要小得多。注意我们使用 `const` 的方式，用来指示读取函数不会修改它们的 `Shape` (§8.7.4)。\n\n`Shape`\
  \ 保留着一个 `Point` 向量，称为 `points`，这是 `Shape` 为了支持其派生类而维护的。我们提供了函数 `add()` 来向 `points`\
  \ 中添加 `Point`：\n\n点击此处查看代码图像\n\n```\nvoid Shape::add(Point p)         // protected\n\
  {\n        points.push_back(p);\n}\n```\n\n自然地，`points` 开始是空的。我们决定为 `Shape` 提供一个完整的功能接口，而不是让用户——即使是派自\
  \ `Shape` 的派生类的成员函数——直接访问数据成员。对于某些人来说，提供功能接口是显而易见的做法，因为他们认为将类的任何数据成员设为 `public`\
  \ 是糟糕的设计。对于另一些人来说，我们的设计似乎过于限制，因为我们不允许对派生类的所有成员进行直接写访问。\n\n派自 `Shape` 的形状（如 `Circle`\
  \ 和 `Polygon`）知道它的这些点意味着什么。基类 `Shape` 并不“理解”这些点；它只是存储它们。因此，派生类需要控制如何添加点。例如：\n\n\
  *   `Circle` 和 `Rectangle` 不允许用户添加点；那根本不符合逻辑。带有一个额外点的矩形算什么东西？(§10.7.4, §11.7.5)。\n\
  *   `Lines` 只允许添加成对的点（而不是单个点；§11.3)）。\n*   `Open_polyline` 和 `Marks` 允许添加任意数量的点。\n\
  *   `Polygon` 仅允许通过检查相交的 `add()` 添加点 (§11.7.1)。\n\n### AA\n\n我们将 `add()` 设为 `protected`（即仅可从派生类访问），以确保派生类接管如何添加点。如果\
  \ `add()` 是 `public`（每个人都可以添加点）或是 `private`（只有 `Shape` 可以添加点），那么这种功能与我们对形状构想的紧密匹配将是不可能的。\n\
  \n同样，我们将 `set_point()` 设为 `protected`。通常情况下，只有派生类知道点意味着什么，以及是否可以在不违反不变式的情况下更改它们\
  \ (§8.4.3)。例如，如果我们有一个定义为六个点的 `Regular_hexagon` 类，改变其中一个点就会使其“不是正六边形”。事实上，如果我们想要一个\
  \ `Mutable_rectangle`，我们可以派自 `Rectangle` 并提供更改点的操作。\n\n我们将 `Point` 向量 `points` 设为\
  \ `private` 以保护其不受意外修改。为了让它有用，我们还需要对其提供访问：\n\n点击此处查看代码图像\n\n```\nvoid Shape::set_point(int\
  \ i, Point p)          // 尚未使用；目前\n{\n        points[i] = p;\n}\n\nPoint Shape::point(int\
  \ i) const\n{\n        return points[i];\n}\n\nint Shape::number_of_points() const\n\
  {\n        return points.size();\n}\n```\n\n在派生类的成员函数中，这些函数用法所示：\n\n点击此处查看代码图像\n\
  \n```\nvoid Lines::draw_specifics(Painter& painter) const                  // 连接成对点的线\n\
  {\n        if (color().visibility())\n                for (int i=1; i<number_of_points();\
  \ i+=2)\n                       painter.draw_line(point(i−1),point(i));\n}\n```\n\
  \n### CC\n\n你可能会担心所有这些访问函数。它们效率不高吗？它们会减慢程序速度吗？它们会增加生成代码的大小吗？不，它们会被编译器内联（inline）。例如，调用\
  \ `number_of_points()` 占用的内存和执行的指令与直接调用 `points.size()` 完全一样。\n\n这些访问控制的考虑和决策是非常重要的。我们可以提供这个\
  \ `Shape` 的这种简化版本：\n\n点击此处查看代码图像\n\n```\nstruct Shape {                   // 简化定义——太简单——未使用\n\
  \        Shape(initializer_list<Point> = {});\n        void draw() const;      \
  \                         // 处理颜色并调用 draw_specifics\n        virtual void draw_specifics(Painter&\
  \ painter) const;        // 绘制特定形状\n        virtual void move(int dx, int dy); \
  \                                     // 移动形状 +=dx 和 +=dy\n        virtual ˜Shape();\n\
  \n        Window* parent_window;\n        vector<Point> points;                \
  \               // 并非所有形状都使用\n        Color lcolor;\n        Line_style ls;\n  \
  \      Color fcolor;\n};\n```\n\n\n\n\n通过额外的 14 个成员函数和两行访问权限说明符（`private:` 和 `protected:`），我们增加了什么价值呢？基本的回答是，保护表示法可以确保它不会以类设计者意想不到的方式发生改变，从而让我们能够用更少的精力写出更好的类。这就是关于“不变性”的论点(§8.4.3)。在这里，我们在定义派自\
  \ `Shape` 的类时将指出此类优势。一个简单的例子是，早期版本的 `Shape` 使用了\n\n点击查看代码图片\n\n```\nFl_Color lcolor;\
  \       //早期：使用 FLTK 的颜色类型\nint line_style;          //早期：使用普通整数表示线样式\n```\n\n事实证明这种方法局限性太大了（`int`\
  \ 类型的线样式无法优雅地支持线宽，且 `Fl_Color` 无法容纳 `invisible` 可见性），并导致了一些混乱的代码。如果这两个变量是 `public`\
  \ 并在用户的代码中使用，那么我们在改进接口库时，只需付出破坏该代码的代价（因为该代码提到了 `lcolor` 和 `line_style` 名称）。\n\n\
  **AA**\n\n此外，访问函数通常提供了符号上的便利。例如，`s.add(p)` 比 `s.points.push_back(p)` 更易读也易写。\n\n\
  我们可以通过移除所有形状并不需要的内容来进一步简化 `Shape`。例如，`Line` 不使用填充颜色，而 `Circle` 只使用单个 `Point`，而不是\
  \ `Point` 的 `vector`。这将使 `Shape` 成为 §12.3.5 中描述的纯接口，但也会迫使我们在特定形状的实现中重复大量代码。\n\n\
  ### 12.2.3 绘制形状\n\n现在我们已经描述了 `Shape` 类除了核心部分外的几乎的所有内容：\n\n点击查看代码图片\n\n```\nvoid\
  \ draw(Painter& painter) const;                                 //处理颜色和样式并调用 draw_specifics\n\
  virtual void draw_specifics(Painter& painter) const;       // 适当绘制此特定形状\n```\n\n\
  `Shape` 最基本的工作是绘制形状。我们可以从 `Shape` 中移除所有其他功能，或者让它没有自己的数据，而不会产生重大的概念损害 (§12.5)，但绘制是\
  \ `Shape` 的核心业务。它使用 Qt 和操作系统的基础机制来实现，但从用户的角度来看，它提供了两个函数：\n\n* `draw()` 选择颜色和样式；然后调用\
  \ `draw_specifics()`；然后恢复颜色和样式。\n* `draw_specifics()` 为特定的 `Shape` 在屏幕上放置像素。\n\n\
  `draw()` 函数没有使用任何新颖技术。它只是调用 Qt 函数将颜色和样式设置为 `Shape` 中指定的设置，调用 `draw_specifics()`\
  \ 在屏幕上进行实际绘制，然后将颜色和样式恢复到调用之前的状态：\n\n点击查看代码图片\n\n```\nvoid Shape::draw(Painter& painter)\
  \ const\n{\n        painter.save();\n        painter.set_line_style(style());\n\
  \        painter.set_color(color());\n        painter.set_fill_color(fill_color());\n\
  \        draw_specifics(painter);\n        painter.restore();\n}\n```\n\n`Shape::draw()`\
  \ 不直接处理填充颜色或线条的可见性。这些由各个具体的 `draw_specifics()` 函数处理，这些函数更清楚如何解释这些内容。例如，对于非闭合形状，`set_fill_color()`\
  \ 是一个“无操作”，什么都不做 (§11.7)。从原则上讲，所有的颜色和样式处理都可以委托给各个 `draw_specifics()` 函数，但那样将非常重复。\n\
  \n**CC**\n\n现在考虑我们可能如何处理 `draw_specifics()`。如果你仔细思考，你会发现让一个 `Shape` 函数为每种形状绘制所有需要的内容是困难的。这将需要每个形状的每一个像素都必须以某种方式存储在\
  \ `Shape` 对象中。如果我们保留 `vector<Point>` 模型，我们就必须存储大量的点。更糟糕，“屏幕”（即图形硬件）已经做了这一点——而且做得更好。\n\
  \n**CC**\n\n为了避免那些额外工作和额外存储，`Shape` 采用了另一种方法：它给每个 `Shape`（即每个派自 `Shape` 的类）一个机会来定义绘制它的含义。`Text`、`Rectangle`\
  \ 或 `Circle` 类可能有巧妙的方法来绘制自己。事实上，大多数此类类都是如此。毕竟，这些类“确切知道”它们应该代表什么。例如，`Circle` 由一个点和一个半径定义，而不是，比如，很多线段。在需要时从点和半径为\
  \ `Circle` 生成所需的位并不真的那么困难或昂贵。因此 `Circle` 定义了它自己的 `draw_specifics()`，我们想要调用它而不是 `Shape`\
  \ 的 `draw_specifics()`。这就是 `Shape::draw_specifics()` 声明中 `virtual` 的含义：\n\n点击查看代码图片\n\
  \n```\nstruct Shape {\n        // ...\n        virtual void draw_specifics(Painter&\
  \ painter) const; // 适当绘制此特定形状\n        // ...\n};\n\nstruct Circle : Shape {\n\
  \        // ...\n        void draw_specifics(Painter& painter) const override;\n\
  \        // ...\n};\n```\n\n所以，`Shape` 的 `draw_specifics()` 必须在 `Shape` 是 `Circle`\
  \ 时调用 `Circle` 的 `draw_specifics()`，在 `Shape` 是 `Rectangle` 时调用 `Rectangle` 的 `draw_specifics()`。这就是\
  \ `draw_specifics()` 声明中 `virtual` 单词确保的：\n\n### 12.3 基类和派生类\n\n**CC**\n\n让我们从更技术的角度来看基类和派生类；即，让我们在本节中（仅）将讨论重点从编程、应用设计和图形转向编程语言特性。当我们设计图形接口库时，我们依赖于三个关键语言机制：\n\
  \n\n\n\n\n-   **派生 (Derivation)**：从一个类构建另一个类的方法，使得新类可以替代原始类。例如，`Circle` 派生自 `Shape`，换句话说，“`Circle`\
  \ 是一种 `Shape`”或“`Shape` 是 `Circle` 的基”。派生类（此处为 `Circle`）除了拥有自己的成员外，还获得了基类（此处为 `Shape`）的所有成员。这通常被称为*继承\
  \ (inheritance)*，因为派生类“继承”了其基类的所有成员。在某些情况下，派生类被称为*子类 (subclass)*，而基类被称为*超类 (superclass)*。\n\
  \n-\n\n**虚函数 (Virtual functions)**：在基类中定义一个函数，并在用户调用该基类函数时，调用派生类中相同名称和类型的函数的能力。例如，当\
  \ `Window` 通过 `draw()` 为一个 `Circle` own `Shape` 调用 `draw_specifics()` 时，执行的是 `Circle`\
  \ 的 `draw_specifics()`，而不是 `Shape` 自身的 `draw_specifics()`。这通常被称为*运行时多态 (run-time\
  \ polymorphism)*、*动态派发 (dynamic dispatch)*或*运行时派发 (run-time dispatch)*，因为所调用的函数根据所使用的对象类型在运行时确定。\n\
  \n-\n\n**私有和保护成员 (Private and protected members)**：我们将类的实现细节保持为私有，以防止直接使用可能增加维护的复杂性\
  \ (§12.2.2)。这通常被称为*封装 (encapsulation)*。\n\n继承、运行时多态和封装的使用是面向对象编程（object-oriented\
  \ programming）最常见的定义。因此，C++ 除了其他编程风格外还直接支持面向对象编程。例如，在第 20 章和第 21 章中，我们将看到 C++ 如何支持泛型编程。C++\
  \ 在明确承认的情况下从 Simula67 借用了其关键机制，它是第一个直接支持面向对象编程的语言 (PPP2.Ch22)。\n\n这里有很多技术术语！但这些都意味着什么？它们在我们的计算机上究竟是如何工作的？让我们先为我们的图形接口类画一个简单的图表，显示它们的继承关系：\n\
  \n![显示图形接口数组继承关系的层次结构图。](img/f0370-01.jpg)\n\n箭头从派生类指向其基类。此类图表有助于类关系视觉化，并经常装饰程序员的白板。与商业框架相比，这是一个极小的*类层次结构\
  \ (class hierarchy)*，只有 16 个类，而且只有在 `Open_polyline` 有许多后代类的情况下，层次深度才超过一个。显然，公共基类（`Shape`）是这里最重要的类，尽管它代表了一个抽象概念，我们永远不会直接创建形状。\n\
  \n### 12.3.1 对象布局 (Object layout)\n\n**CC**\n\n对象在内存中是如何布局的？正如我们在 §8.4.1 所示，类的成员定义了对象的布局：数据成员在内存中连续存储。当使用继承时，派生类的数据成员会被简单地添加在基类成员之后。例如：\n\
  \n![数据表显示两个派生数组的数据成员。](img/f0371-01.jpg)\n\n一个 `Circle` 拥有 `Shape` 的数据成员（毕竟，它是一种\
  \ `Shape`），并且可以作为 `Shape` 使用。此外，`Circle` 还有它“自己的”数据成员 `r`，放置在继承的数据之后。\n\n**CC**\n\
  \n为了处理虚函数调用，我们在 `Shape` 对象中需要（并且拥有）额外额外数据：用于告诉我们调用 `Shape` 的 `draw_specifics()`\
  \ 时实际上调用了哪个函数。通常的方法是添加一个函数列表的地址。该表通常被称为 `vtbl`（代表“virtual table”或“virtual function\
  \ table”），其地址通常被称为 `vptr`（代表“virtual pointer”）。我们在第 17 章和第 18 章中讨论过指针；在这里，它们的作用类似于引用。特定的实现可能对\
  \ `vtbl` 和 `vptr` 使用不同的名称。将 `vptr` 和 `vtbl`s 引入构图中，我们得到：\n\n![数据表显示带有 v t b l 和\
  \ v p t r 函数的两个派生数组的数据成员。](img/f0371-02.jpg)\n\n由于 `draw_specifics()` 是第一个虚函数，它获得\
  \ `vtbl` 中的第一个槽位，紧随其的是第二个虚函数 `move()`。类可以拥有你需要的任意数量的虚函数；其 `vtbl` 将根据需要调整大小（每个虚函数一个槽位）。现在当我们调用\
  \ `x.draw_specifics()` 时，编译器会生成对 `x` 的 `vtbl` 中 `draw_specifics()` 槽位对应函数的调用。基本上，代码只是遵循图表上的箭头。因此，如果\
  \ `x` 是一个 `Circle`，将调用 `Circle::draw_specifics()`。如果 `x` 是某种类型（例如 `Open_polyline`），它使用的\
  \ `vtbl` 与 `Shape` 定义的完全一致，则将调用 `Shape::draw_specifics()`。如果 `x` 是一个 `Circle`，将调用\
  \ `Circle::draw_specifics()`。\n\n### 12.3.2 派生类和定义虚函数 (Deriving classes and defining\
  \ virtual functions)\n\n我们通过在类名后提到基类来指定一个类为派生类。例如：\n\n```\nstruct Circle : Shape\
  \ { /* ... */ };\n```\n\n**CC**\n\n默认情况下，**struct** 的成员是**公有的 (public)** (§8.3)，这将包括基类的**公有**成员。我们可以等价地说：\n\
  \n```cpp\nclass Circle : public Shape { public: /* ...*/ };\n```\n\n\n\n\n\n这两个\
  \ `Circle` 的声明是完全等价，但你可能会与人们就哪种更好进行许多冗长且无结果的讨论。我们认为，将时间花在其他主题上会更有成效。\n\n请注意在需要时不要漏掉\
  \ `public`。例如：\n\n点击此处查看代码图像\n\n```\nclass Circle : Shape { public: /* ... */ };\
  \       // 可能是一个错误\n```\n\n这将使得 `Shape` 成为 `Circle` 的 `private` 基类，导致 `Circle` 无法访问\
  \ `Shape` 的 `public`成员函数。这可能不是你的本意。一个良好的编译器会对这种可能的错误发出警告。`private` 基类也有其用途，但那些超出了本书的范围。\n\
  \n虚函数必须在它的类声明中声明为 `virtual`，但 `virtual` 关键字在类外既不需要也不允许使用。例如：\n\n点击此处查看代码图像\n\n```\n\
  struct Shape {\n        // ...\n        virtual void draw_specifics(Painter& painter)\
  \ const;\n        virtual void move();\n        // ...\n};\n\nvirtual void Shape::draw_specifics(Painter&\
  \ painter) const { /* ... */ }      // 错误：\"virtual\" 在类外\nvoid Shape::move() {\
  \ /* ... */ }                                   // OK\n```\n\n### 12.3.3 重写 (Overriding)\n\
  \n**XX**\n\n当你想要重写虚函数时，必须使用与基类中完全相同的名称和类型。例如：\n\n点击此处查看代码图像\n\n```\nstruct Circle\
  \ : Shape {\n       void draw_specifics(int) const;          // 可能是一个错误 (int 参数?)\n\
  \       void drawlines() const;                     // 可能是一个错误 (名称拼写错误?)\n     \
  \  void draw_specifics();                      // 可能是一个错误 (缺少 const?)\n       void\
  \ draw_specifics() const;            // 可能是一个错误 (缺少 Painter& 参数?)\n\n       void\
  \ draw_specifics(Painter&) const;                               // OK: 隐式重写\n  \
  \     void draw_specifics(Painter&) const override;                 // OK: 显式重写\n\
  \n       // ...\n};\n```\n\n在这里，编译器将看到四个与 `Shape::draw_specifics()` 独立的函数（因为它们有不同的名称或类型），并且不会重写它们。一个良好的编译器会对这些可能的错误发出警告。\n\
  \n`draw_specifics()` 的示例是真实的，因此在所有细节上可能很难理解，所以这里有一个纯技术性的示例来说说明重写：\n\n点击此处查看代码图像\n\
  \n```\nstruct B {\n       virtual void f() const { cout << \"B::f \"; }\n      \
  \ void g() const { cout << \"B::g \"; }             // 不是虚\n};\n\nstruct D : B {\n\
  \       void f() const { cout << \"D::f \"; }               // 重写 B::f\n       void\
  \ g() { cout << \"D::g \"; }\n};\n\nstruct DD : D {\n       void f() { cout << \"\
  DD::f \"; }                      // 重写 B::f\n       void g() { cout << \"DD::g \"\
  ; }\n};\n```\n\n在这里，编译器将看到四个与 `Shape::draw_specifics()` 独立的函数（因为它们有不同的名称或类型），并且不会重写它们。一个良好的编译器会对这些可能的错误发出警告。\n\
  \n`draw_specifics()` 的示例是真实的，因此在所有细节上可能很难理解，所以这里有一个纯技术性的示例来说明重写：\n\n在这里，编译器将看到四个与\
  \ `Shape::draw_specifics()` 独立的函数（因为它们有不同的名称或类型），并且不会重写它们。一个良好的编译器会对这些可能的错误发出警告。\n\
  \n`draw_specifics()` 的示例是真实的，因此在所有细节上可能很难理解，所以这里有一个纯技术性的示例来说明重写：\n\n\n\n\n\n在 #12.2.1\
  \ 中，我们看到了如何通过将构造函数声明为 `protected` 来使类变为抽象。还有另一种——更常用的抽象类的方法：声明其一个或多个 `virtual` 函数必须在某些派生类中重写。例如：\n\
  \n点击此处查看代码图片\n\n```cpp\nclass B { // 抽象基类\npublic:\n        virtual void f() =0;\
  \    // 纯虚函数\n        virtual void g() =0;\n};\n\nB b;          // 错误：B 是抽象类\n```\n\
  \n奇特的 `=0` 符号表示虚函数 `B::f()` 和 `B::g()` 是“纯”的；也就是说，它们必须在某些派生类中被重写。由于 `B` 拥有纯虚函数，我们无法创建类\
  \ `B` 的对象。重写纯虚函数可以解决这个“问题”：\n\n```cpp\nclass D1 : public B {\npublic:\n        \
  \ void f() override;\n         void g() override;\n};\n\nD1 d1;          // OK\n\
  ```\n\n注意，除非所有的纯虚函数都被重写，否则生成的类仍然是抽象的：\n\n点击此处查看代码图片\n\n```cpp\nclass D2 : public\
  \ B {\npublic:\n        void f() override;\n        // 没有 g()\n};\n\nD2 d2;    \
  \ // 错误：D2（仍然）是抽象类\n\nclass D3 : public D2 {\npublic:\n        void g() override;\n\
  };\n\nD3 d3;                  // OK\n```\n\n## AA\n\n带有纯虚函数的类倾向于成为纯接口；也就是说，它们倾向于没有数据成员（数据成员将位于派生类中），因此没有构造函数（如果没有需要初始的数据成员，可能就不需要构造函数）。\n\
  \n## 12.4 其他 Shape 函数\n\n为了完成 `Shape` 的实现，我们需要处理 `Shape` 的拷贝问题。我们还展示了如何在屏幕上移动 `Shape`。\n\
  \n### 12.4.1 拷贝\n\n## CC\n\n`Shape` 类声明了拷贝构造函数并将拷贝赋值运算符 `delete` 掉了：\n\n点击此处查看代码图片\n\
  \n```cpp\nShape(const Shape&) =delete;                          // 防止拷贝\nShape&\
  \ operator=(const Shape&) =delete;\n```\n\n这消除了 `Shape` 默认的拷贝操作，以及每个派生自 `Shape`\
  \ 且未定义自身拷贝操作的类（而我们不会这样做）。考虑这种情况：\n\n点击此处查看代码图片\n\n```cpp\nvoid copy_to(Circle& c,\
  \ Rectangle& r)\n{\n        c=r;                  // 这看起来一点也不无害（幸运的是这是一个错误）\n  \
  \      // ...\n}\n```\n\n将一个 `Rectangle` 赋值给 `Circle` 是没有意义的：\n\n* 一个 `Rectangle`\
  \ 由两个 `Points` 表示。\n* 一个 `Circle` 由一个 `Point` 和一个 `int` 表示。\n\n这两个对象甚至的大小都不一样！如果允许，`Rectangle`\
  \ 将被拷贝到哪个空间（§12.3.1)？此外，`Circle` 和 `Rectangle` 具有完全不同的 `draw_specifics()` 函数。\n\n\
  那么，如果我们不禁止它，`c=r` 为什么能运行呢？如果允许 `Shape` 的拷贝，将调用 `Shape` 的拷贝赋值运算符，将 `Circle` 和 `Rectangle`\
  \ 视为 `Shape`：\n\n点击此处查看代码图片\n\n```cpp\nShape& operator=(const Shape&);         \
  \ // 拷贝赋值\n```\n\n要实现这种使其合理的赋值在通常情况下是不可能的。例如，将 `Circle` 赋值给 `Rectangle` 根本没有意义。对于赋值有意义的\
  \ `Shape` 组合，我们可以定义函数来处理这些特殊情况。\n\n## XX\n\n基本上，类层次结构加上按引用传递和默认拷贝是不兼容的。当你设计一个意图作为基类的类（即至少有一个\
  \ `virtual` 函数）时，请像处理 `Shape` 那样，使用 `=delete` 禁用它的拷贝构造函数和拷贝赋值运算符。另见 #12.3。\n\n###\
  \ 12.4.2 移动形状\n\n`Shape` 的 `move()` 函数简单地移动相对于当前位置存储的每个点：\n\n点击此处查看代码图片\n\n```cpp\n\
  void Shape::move(int dx, int dy)    // 移动形状 +=dx 和 +=dy\n{\n        for (auto& xy\
  \ : points) {\n                xy.x += dx;\n                xy.y += dy;\n      \
  \  }\n        redraw();\n}\n```\n\n像 `draw_specifics()` 一样，`move()` 是虚函数，因为派生类可能拥有需要移动且\
  \ `Shape` 并不知晓的数据。例如，参见 `Axis` ([§10.7.1，§13.4)）。每个派生自 `Shape` 且未存储所有数据的类都必须定义自己的\
  \ `move()`。在 `Shape` 发生变化后，我们必须让 `Window` 刷新 `redraw()` (§12.2)\n\n## 12.5 面对象编程的优势\n\
  \n## CC\n\n当我们说 `Circle` 派生自 `Shape`，或者 `Circle` 是一种 `Shape` 时，我们是为了获得以下（者或两者）：\n\
  \n* 接口继承：期望 `Shape` 的函数（通常作为引用参数）可以通过 `Shape` 提供的接口接收 `Circle`。\n* 实现继承：当我们定义 `Circle`\
  \ 及其成员函数时，可以利用 `Shape` 提供的功能（如数据和成员函数）。\n\n## XX\n\n不提供接口继承（即派生类对象不能作为其公基类对象使用的设计）是一种糟糕且易出错的设计。例如，我们可能会以\
  \ `Shape` 为公基类定义一个 `Never_do_this` 类。然后我们可以重写 `Shape::draw_specifics()`，该函数并不绘制形状，而是将其中心向左移动了\
  \ 100 像素。这种“设计”是有致命缺陷的，尽管 `Never_do_this` 提供了 `Shape` 的接口，但它的实现并没有维护 `Shape` 所要求的语义（含义、行为）。千万不要这样做！\n\
  \n## AA\n\n接口继承之所以命名，是因为其优势来自于使用基类提供的接口（“接口”，这里是 `Shape`）而不需要了解派生类（“实现类”，这里是派生自\
  \ Shape 的类）。\n\n## AA\n\n实现继承之所以命名，是因为其优势来自于基类提供的功能简化了派生类（例如 `Circle`）的实现。\n\n##\
  \ AA\n\n注意，我们的图形设计关键依赖于接口继承：“图形引擎”调用 `Shape::draw()`，后者又调用 `Shape` 的虚函数 `draw_specifics()`\
  \ 来执行在屏幕上显示图像的实际工作。无论是“图形引擎”还是 `Shape` 类都不知道存在哪些形状。特别是，我们的“图形引擎”（目前是 Qt 加上操作系统的图形设施）在我们图形类之前的几年前就已经编写并编译了！我们只需定义特定的形状并将它们作为\
  \ `Shape` `attach()` 到 `Window` 上（`Window::attach()` 接收 `Shape&` 参数）。此外，由于 `Shape`\
  \ 类并不知道你的图形类，每当你定义一个新的图形接口类时，你都不需要重新编译 `Shape`。\n\n\n\n\n\n换句话说，我们可以在不修改现有代码的情况下，向程序中添加新的\
  \ `Shape`。这是软件设计/开发/维护中的圣杯：在不修改系统的情况下对其进行扩展。我们在不修改现有类的情况下，所能做的更改是有限制的（例如，`Shape`\
  \ 提供的服务范围相当有限），而且这种技术并不适用于所有的编程问题（例如，参见第 15 章 – 第 18 章，我们在那里定义了一个 `Vector`；对于这种情况，继承的作用有限）。然而，接口继承是设计和实现面对变化具有健壮性的最强大的技术之一。\n\
  \n## XX\n\n同样，实现继承也有很多优势，但它并不是万灵药。通过在 `Shape` 中放置有用的服务，我们避免了在派生类中反复重复工作的麻烦。这在真实世界的代码中可能尤为重要。然而，代价是对是对\
  \ `Shape` 接口的任何更改或对 `Shape` 数据成员布局的任何更改都会导致所有派生类及其调用者的重新编译。对于一个广泛使用的库，这种重新编译可能是不行的。自然，有办法可以在获得大部分收益的同时避免大部分问题；参见\
  \ §12.3.5。\n\n### 习题\n\n遗憾的是，我们无法为理解通用设计原则编写练习题，因此我们在这里关注支持面向对象编程的语言特性。\n\n[1] 定义一个类\
  \ `B1`，包含一个虚函数 `vf()` 和一个非虚函数 `f()`。在类 `B1` 中定义这两个函数。实现每个函数以输出其名称（例如，`B1::vf()`）。将这些函数设为\
  \ `public`。创建一个 `B1` 对象并调用每个函数。\n\n[2] 从 `B1` 派生一个类 `D1` 并重写 `vf()`。创建一个 `D1` 对象并对其调用\
