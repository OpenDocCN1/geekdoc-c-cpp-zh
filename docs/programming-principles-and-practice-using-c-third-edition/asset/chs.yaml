  \ 1 到 100 的循环，检查每个数字是否为质数，并将找到的质数存储在 `vector` 中。再写另一个循环列出你找到的质数。你可以将你的质数 `vector`\
  \ 与 `primes` 比较来检查结果。将 2 视为第一个质数。\n\n[13] 创建一个程序寻找 1 到 100 之间所有的质数。有一种经典方法叫做“埃筛”。如果你不知道这种方法，上网查找。使用这种方法编写你的程序。\n\
  \n[14] 编写一个程序，获取输入值 `n` 然后寻找前 `n` 个质数。\n\n[15] 在练习中，你写了一个程序，给定一组数字，找到该序列的最大值和最小值。序列中出现次数最多的数字被称为**众数**（mode）。创建一个程序找到一组正整数的众数。\n\
  \n[16] 编写一个程序，找到一个 `string` 序列的最小值、最大值和众数。\n\n\n\n\n\n[17] 编写一个程序来求解一元二次方程。二次方程的形式为\
  \ `ax`² + `bx` + `c` = 0。如果你不知道求解此类表达式的公式，请进行一些研究。记住，在程序员教计算机如何解决问题之前，研究如何解决问题通常是必要的。使用\
  \ `doubles` 来接收用户对 `a`、`b` 和 `c` 的输入。由于二次方程有两个解，请同时输出 `x1` 和 `x2`。\n\n[18] 编写一个程序，首先你输入一组名称-值对，例如\
