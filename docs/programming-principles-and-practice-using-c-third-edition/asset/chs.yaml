  \ `vector<vector<vector<int>>>` 但大部分元素向量是空的。定义 `Vector` 使得 `sizeof(Vector<int>)==sizeof(int*****)`，也就是说\
  \ `Vector` 本身仅由指向表示结构的指针组成，结构包含元素、元素数量和 `space` 指针。\n\n[17] 定义函数 `finally()`，它接受一个函数对象作为参数，并返回一个析构函数会调用该函数对象的对象。因此\n\
  \n点击此处查看代码图像\n\n```\nauto x = finally([](){ cout<< \"Bye!\\n\"; });\n```\n\n每当我们退出\
  \ `x` 的作用域时，它都会“说” `Bye!`。`finally()` 在什么情况下可能有用？\n\n#### 后记\n\n模板和异常是极其强大的语言特性。它们支持非常有灵活的编程技术——主要通过允许人们分离关注点，即一次只处理一个问题。例如，使用模板，我们可以将容器（如\
  \ `vector`）与元素类型的定义分开来。同样，使用异常，我们可以将检测并信号错误的代码与处理该错误的代码分开来。有了模板和异常，我们通过考虑如何改进 `push_back()`、`resize()`\
  \ 和 `reserve()` 完成了 `Vector`，以便它们在发生错误时能处理构造和析构。概念（Concepts）允许我们为模板提供定义的接口。\n\n\
  ## 19\n\n## 容器与迭代器\n\n*计算机科学中的任何问题都可以通过另一层间接来解决。当然，除了间接过多的问题。*\n\n*– David J. Wheeler*\n\
  \n本章和下一章介绍了 STL，即标准库中的容器和算法部分。STL 是一个处理数据的可扩展框架。在第一个示例之后，我们介绍了序列和迭代器的基本概念，它们用于将容器（数据）与算法（处理）结合起来，这将在第\
  \ 21 章中介绍。本章为通用、高效且实用的实现奠定了基础。\n\n### 19.1 存储和处理数据\n\n在查看更大的数据集之前，让我们考虑一个简单的示例，它指向了处理一大类数据处理问题的方法。Jack\
  \ 和 Jill 分别测量车速，并将其记录为浮点值。Jack 作为 C 程序员长大的，将值存储在数组中并使用指针；而 Jill 将值存储在 `vector` 中并依赖移动语义\
  \ (§17.4.4)）。现在我们想在程序中使用他们的数据。我们该怎么做呢？\n\n我们可以让 Jack 和 Jill 的程序将值写入文件，然后将其读回我们的程序。这样，我们就完全不受他们对数据结构和接口选择的影响。通常，这种隔离是一个好主意，如果我们决定这样做，我们就可以使用[第\
  \ 9 章](#ch09.xhtml_ch09）中的技术进行输入，并使用 `vector<double>` 进行计算。\n\n\n\n\n\n```\ndouble*\
  \ get_from_jack(int* count);         // Jack 填充一个数组并将元素数量存入 *count\nvector<double>\
  \ get_from_jill();              // Jill 填充一个 vector\n\nvoid fct()\n{\n        int\
  \ jack_count = 0;\n        double* jack_data = get_from_jack(&jack_count);\n   \
  \     vector<double> jill_data = get_from_jill();\n        // ... process ...\n\
  \        delete[] jack_data;\n}\n```\n\n假设我们无法重写 Jack 和 Jill 的代码，或者不想重写。\n\n####\
  \ 19.1.1 处理数据\n\n显然，这是一个相当简化的例子，但它与大量的现实世界问题并不相似。如果我们能够优雅地处理这个例子，就能处理大量的常见编程问题。这里的根本问题在于，我们无法控制“数据供应商”存储提供给我们的数据的方式。我们的工作要么以获取到的形式对其进行处理，要么将其读取并按照我们更喜欢的方式进行存储。\n\
  \n我们想对这些数据做什么呢？排序？找到最大值？找到平均值？找到所有大于 65 的值？将 Jill 的数据与 Jack 的数据对比？查看有多少次读取？可能性是无限的，在编写实际程序时，我们只需执行所需的计算。在这里，我们只想通过一些事情来学习如何处理数据以及涉及大量数据的计算。让我们先做一些简单的事：找到每个数据集中值最大的元素。我们可以通过将这段代码插入\
  \ `fct()` 中的 `... process ...` 注释处来实现：\n\n点击此处查看代码图像\n\n```\ndouble h = −1;\ndouble*\
  \ jack_high;           // jack_high 指向值最大的元素\ndouble* jill_high;             //\
  \ jill_high 指向值最大的元素\nfor (int i=0; i<jack_count; ++i)\n         if (h<jack_data[i])\
  \ {\n                 jack_high = &jack_data[i];               // 保存最大元素的地址\n  \
  \               h = jack_data[i];                              // 更新“最大元素”\n   \
  \      }\n\nh = −1;\nfor (double& x : jill_data)\n         if (h<x) {\n        \
  \         jill_high = &x;         // 保存最大元素的地址\n                 h=x;          \
  \              // 更新“最大元素”\n         }\n\ncout << \"Jill's max: \" << *jill_high\n\
  \        << \"; Jack's max: \" << *jack_high;\n```\n\n#### 19.1.2 代码泛化\n\nCC\n\n\
  我们希望有一种统一的方法来访问和操作数据，这样当数据以略有不同的方式呈现时，我们就不需要编写不同的代码。让我们看看 Jack 和 Jill 的代码作为示例，学习如何让代码更抽象、更统一。\n\
  \n显然，我们对 Jack 数据所的操作与对 Jill 数据所的操作非常相似。然而，存在一些烦人的差异：Jack 使用传统的 `for` 循环和下标访问，而 Jill\
  \ 使用范围 `for` 循环。我们可以通过对 Jill 的数据使用传统的 `for` 循环来消除后者的差异：\n\n点击此处查看代码图像\n\n```\nvector<double>&\
  \ v = jill_data;\n\nfor (int i=0; i<v.size(); ++i)\n        if (h<v[i]) {\n    \
  \           jill_high = &v[i];\n               h = v[i];\n        }\n```\n\n这与 Jack\
  \ 数据的代码非常接近。要写一个既能为 Jill 数据又能为 Jack 数据计算的函数，需要什么？我们可以考虑几种方法（参见练习 3），但出于通用性的考虑（这将在接下来的两个章节中变得清晰），我们选择了一个基于指针的解决方案：\n\
  \n点击此处查看代码图像\n\n```\ndouble* high(double* first, double* last)\n        // 返回 first:last)\
  \ 范围内值最大的元素指针\n{\n        double h = −1;\n        double* high;\n\n        for (double*\
  \ p = first; p!=last; ++p)\n                if (h<*p) {\n                      \
  \  high = p;\n                        h = *p;\n                }\n        return\
  \ high;\n}\n```\n\n鉴于此，我们可以写出：\n\n[点击此处查看代码图像\n\n```\ndouble* jack_high = high(jack_data,jack_data+jack_count);\n\
  double* jill_high = high(&jill_data[0],&jill_data[0]+jill_data.size());\n```\n\n\
  这看起来好多了。我们没有引入这么多变量，并且只写了一次循环和循环体（在 `high()` 中）。如果我们想知道最大值，可以查看 `jack_high` 和 `jill_high`。例如：\n\
  \n点击此处查看代码图像\n\n```\ncout << \"Jill's max: \" << *jill_high\n        << \"; Jack's\
  \ max: \" << *jack_high;\n```\n\n\n\n\n\nC++ 标准库提供了一个处理元素序列化数据的框架，称为 STL。STL 通常被认为是“标准模板库”（standard\
  \ template library）的缩写。STL 是 ISO C++ 标准库的一部分，它提供了容器（如 `vector`、`list` 和 `map`）和通用算法（如\
  \ `sort`、`find` 和 `accumulate`）。因此，我们可以——并且确实是——将 `vector` 等设施既视为“STL”的一部分，也是“标准库”的一部分。其他标准库特性，如\
  \ `ostream`（第 9 章）和 C 风格字符串函数（PPP2.Ch23），并不属于 STL。为了更好地欣赏和理解 STL，我们首先考虑在处理数据时必须解决的问题，以及我们对解决方案的理想目标。\n\
  \n### CC\n计算有两个主要方面：计算本身和数据。有时我们关注计算，谈论 `if`-语句、循环、函数、错误处理等；在其他时候，我们关注数据，谈论数组、vector、字符串、文件等。然而，为了完成有用的工作，我们兼者都需要的。如果没有分析、可视化和对“有趣部分”的搜索，大量数据是不可理解的。反之，我们可以随心所进行计算，但如果没有一些数据将我们的计算与现实联系起来，它将是枯燥且乏味的。此外，我们程序的“计算部分”理想上必须与“数据部分”进行优雅的交互。\n\
  \n![三个部分之间的序列。序列是输入、读取、计算和写入输出。](img/f0552-01.jpg)\n\n### AA\n当我们这样谈论数据时，我们想的是大量数据：几十个\
  \ `Shape`、数百个温度读数、数千条日志记录、数百万个点、数十亿个网页等；也就是说，我们谈论的是处理数据容器、数据流等。特别地，这并不是讨论如何最好地选择几个值来表示一个小型对象（例如复数、温度读数或圆形）。对于此类类型，请参阅第\
  \ 8 章、9.3.2 节 和 11.7.4 节。\n\n考虑一些我们想对“大量数据”所做的简单示例：\n\n*   按字典顺序对单词排序。\n*   给定一个名字，在电话簿中查找数字。\n\
  *   找到最高温度。\n*   找到所有大于 8800 的值。\n*   找到值 17 第一次出现。\n*   按单元号对遥测记录进行排序。\n*   按时间戳对遥测记录进行排序。\n\
  *   找到字典序上大于“Petersen”的第一个值。\n*   找到最大金额。\n*   找到两个序列之间的第一个差异。\n*   计算两个序列元素的两两乘积。\n\
  *   找到每月每天的最高温度。\n*   在销售记录中找到前十名畅销商品。\n*   统计“Stroustrup”在网络上的出现次数。\n*   计算元素和。\n\
  \n注意，我们可以描述这些任务中的每一个，而无需实际提到数据是如何存储的。显然，为了让这些任务有意义，我们必须处理类似于列表、vector、文件、输入流等内容，但我们在讨论如何处理数据时，并不需要知道关于数据如何存储（或收集）的细节。重要的是值或对象的类型（元素类型）、我们如何访问这些值或对象，以及我们想对它们做什么。\n\
  \n这类任务非常常见。自然，我们希望编写简单且高效的代码来执行此类任务。相反，对我们程序员来说，问题在于：\n\n*   数据类型有无限的变（“数据种类”）。\n\
  *   存储数据元素集合的方法多得令人眼花缭乱。\n*   我们想对数据集合执行的任务种类极其多样。\n\n为了减少这些问题的影响，我们希望代码能够利用类型之间、数据存储方式之间以及处理任务之间的共同性。换句话说，我们希望将代码泛化，以应对这些变化。我们真的不想从零开始手工构建每个解决方案；那将是极其无聊的时间浪费。\n\
  \n为了了解我们对编写代码需要什么样的支持，请考虑我们处理数据的一种更抽象的视角：\n\n*   将数据收集到容器中\n    *   例如 `vector`、`list`\
  \ 和数组\n*   组织数据\n    *   为了打印\n    *   为了快速访问\n*   检索数据项\n    *   通过索引（例如第 42 个元素）\n\
  \    *   通过值（例如“年龄字段”为 7 的第一个记录）\n    *   通过属性（例如所有“温度字段” >32 且 < 100 的记录）\n*  \
  \ 修改容器\n    *   添加数据\n    *   删除数据\n    *   排序（根据某些标准）\n*   执行简单的数值操作（例如，将所有元素乘以\
  \ 1.7）\n\n我们希望做这些事情，而不会陷入容器之间差异、访问元素方式差异以及元素类型差异的细节泥沼中。如果我们能做到这一点，我们在实现简单高效使用大量数据的目标上就迈出了一步。\n\
  \n回顾之前章节中的编程工具和技术，我们注意到，无论使用什么类型，程序都是相似的：\n\n*   使用 `int` 与使用 `double` 并没有区别。\n\
  *   使用 `vector<int>` 与使用 `vector<string>` 并没有区别。\n*   使用 `double` 数组与使用 `vector<double>`\
  \ 并没有区别。\n\n### AA\n我们希望组织代码，以便在做真正新、不同的事情时才编写新代码。特别地，我们希望为常见的编程任务提供代码，这样每当我们发现新的数据存储方式或略微不同的数据解释方式时，就不需要重写解决方案。\n\
  \n*   在 `vector` 中查找值与在数组中查找值并没有区别。\n*   忽略大小写查找 `string` 与区分大小写字母地查找 `string` 并没有区别。\n\
  *   使用精确值绘制实验数据图与使用舍入值绘图并没有区别。\n*   复制文件与复制 `vector` 并没有区别。\n\n### CC\n为了最大限地减少我们的编程工作，我们希望：\n\
  \n*   统一的数据访问\n    *   独立于存储方式\n    *   独立于其类型\n*   类型安全的数据访问\n*   数据的便捷遍历\n*  \
  \ 数据的紧凑存储\n*   快速的\n    *   数据检索\n    *   数据添加\n    *   数据删除\n*   常用算法的标准版本\n  \
  \  *   例如 copy、find、search、sort, ...\n\nSTL 提供了这些以及更多。我们不仅将其视为一组非常实用的工具，还将其视为一个为了最大灵活性性能而设计的库示例。STL\
  \ 由 Alex Stepanov 设计，旨在为在数据结构上运行通用、正确且高效的算法提供框架。其理想是数学的简单性、通用性和优雅性。\n\n### XX\n\
  如果不使用具有清晰理想和原则的框架来处理数据，替代方案是让每个程序员利用基础语言设施，根据当时认为好的想法来手工构建每个程序。这将产生大量的额外工作。此外，结果通常是一个毫无原则的混乱体；很少有结果是让除原始设计者以外的人轻松理解的，只有偶然情况下，结果才是我们可以在其他上下文中使用的代码。\n\
  \n\n\n\n在考虑了动机和理想之后，让我们来看 STL 的基本定义，最后通过示例来展示我们如何接近这些理想——即编写更好的代码来处理数据，并让过程变得更加轻松。\n\
  \n### 19.2 序列与迭代器\n\nCC\n\nSTL 的核心概念是 `sequence`（序列），也称为 `range`（范围）。从 STL 的角度来看，数据集合就是一个序列。序列有一个起点和一个终点。我们可以从头到尾遍历序列，并可以选择性地读取或写入每个元素的值。我们通过一对迭代器来标识序列的起始和结束。`iterator`（迭代器）是一个标识序列中元素的对象。我们可以这样理解序列：\n\
  \n![数据表连接了多个数组。序列的开头有三个数组一直持续到末尾。一个扩展数组在末尾之后继续。](img/f0554-01.jpg)\n\n在这里，`begin`\
  \ 和 `end` 是迭代器；它们标识序列的开始和结束。STL 序列通常被称为“半开区间”（half-open）——即由 `begin` 标识的元素是序列的一部分，但\
  \ `end` 迭代器指向序列末尾之后的一个位置。此类序列（范围）的常用数学符号是 `begin:end)`。从一个元素指向下一个元素的箭头表示，如果我们有一个指向某个元素的迭代器，就可以获取指向下一个元素的迭代器。\n\
  \nCC\n\n什么是迭代器？迭代器是一个相当抽象的概念。例如，如果 `p` 和 `q` 是同一个序列元素的迭代器：\n\n| 基础标准迭代器操作 | |\n\
  | --- | --- |\n| `p==q` | 当且仅当 `p` 和 `q` 指向同一个元素，或都指向最后一个元素之后的位置时为真 |\n| `p!=q`\
  \ | `!(p==q)` |\n| `*p` | 指 `p` 指向的元素 |\n| `*p=val` |  `p` 指向的元素 |\n| `val=*p` |\
  \ 从 `p` 指向的元素读取 |\n| `++p` | 使 `p` 指向序列中的下一个元素，或指向最后一个元素之后的位置 |\n\n显然，迭代器的思想与指针的概念有关\
  \ ([§15.4)。事实上，指向数组元素的指针就是一个迭代器。然而，许多迭代器不仅仅是指针；例如，我们可以定义一种范围检查的迭代器，如果你尝试让它指向 `begin:end)`\
  \ 序列之外或对 `end` 进行解引用，它会抛出异常 ([§20.7.2)。事实证明，将迭代器作为抽象概念而非特定类型让我们获得了巨大的灵活性通用性。本章和下一章将给出几个示例。\n\
  \n### 尝试一下\n\n编写函数 `void copy(int*** f1, int*** e1, int*** f2)`，将由 `f1:e1)` 定义的\
  \ `int` 数组元素拷贝到另一个 `[f2:f2+(e1−f1))` 中。仅使用上述迭代器操作（不使用下标）。\n\n迭代器用于将我们的代码（算法）与数据连接起来。代码编写者知道迭代器（而不知道迭代器如何到达数据的细节），而数据提供者提供迭代器，而不是向所有用户暴露数据存储的细节。结果是令人愉的简单，并在算法和容器之间提供了重要程度的独立性。引用\
  \ Alex Stepanov 的话：“STL 算法和容器之所以配合得如此完美，是因为它们彼此一无知。”相反，它们都理解由迭代器对定义的序列。\n\n![数据表连接了所有迭代器。\n\
  \n句话说，算法不再需要知道存储和访问数据的各种杂乱方式；它们只需要知道迭代器。反之，数据提供者不再需要为各种各样的用户编写代码；他们只需要为自己类型的数据实现迭代器。在最基础的层，迭代器仅通过\
  \ `*`、`++`、`==` 和 `!=` 运算符定义。这使得它们简单且快速。为了进一步增加灵活性和使用范围，所有的 STL 容器都根据其元素类型 (§18.1.1)\
  \ 和分配器进行了参数化 (§18.2.1)。\n\nSTL 框架由约十个容器和约 125 个算法通过迭代器连接组成 (第 21 章)。这大约由约 150 段代码表示的\
  \ 1500 种组合。此外，许多机构和个人提供了 STL 风格的容器和算法。STL 可能是最知名且使用最广泛的泛型编程示例 (§18.1.2, §21.1.2)。如果你了解基本概念和几个示例，就可以其余部分。\n\
  \n#### 19.2.1 回到 Jack-and-Jill 示例\n\n让我们看看如何使用 STL 的序列概念来表达“找到值最大的元素”问题：\n\n点击查看图像\n\
  \n```cpp\ntemplate<forward_iterator Iter>\nIter high(Iter first, Iter last)\n//\
  \ 返回指向 first:last) 中值最大的元素的迭代器\n{\n         Iter high = first;\n         for (Iter\
  \ p = first; p!=last; ++p)\n                 if (*high<*p)\n                   \
  \     high = p;\n         return high;\n}\n```\n\n注意，我们消除了以前用于存储目前最高值的局部变量 `h`。当我们不知道元素的实际类型名称时，用\
  \ `-1` 初始化似乎完全是随机且奇怪的。那是因为这确实是随机且奇怪的！它还是一个可能发生的错误：在我们的示例中，`-1` 能够起作用是因为我们恰好没有负速度。我们知道“魔数常量”（如\
  \ `-1`）对代码维护是有害的 ([§3.3.1, §6.6.1, §9.9.1 等在这里，我们看到它们也会限制函数的用途，并可能是解决方案考虑不周的迹象；也就是说，“魔数常量”可能是且往往也是粗略思考的标志。\n\
  \n注意，这个“泛型” `high()` 可以用于可以使用 `<` 进行比较的元素类型。例如，我们可以使用 `high()` 在 `vector<string>`\
  \ 中查找字典序最后的字符串（参见 练习 7）。\n\n`high()` 模板函数可以用于任何由一对迭代器定义的序列。例如，我们可以完全复制我们的示例程序：\n\
  \n点击查看代码图像\n\n```cpp\ndouble* get_from_jack(int* count);           // Jack 填充数组并将元素数量放在\
  \ *count 中\nvector<double> get_from_jill();                // Jill 填充 vector\n\n\
  void fct()\n{\n        int jack_count = 0;\n        double* jack_data = get_from_jack(&jack_count);\n\
  \        vector<double> jill_data = get_from_jill();\n\n        double* jack_high\
  \ = high(jack_data,jack_data+jack_count);\n        double* jill_high = high(jill_data.begin(),jill_data.end());\n\
  \n        cout << \"Jill's high \" << *jill_high << \"; Jack's high \" << *jack_high;\n\
  \        delete[] jack_data;\n}\n```\n\n\n\n对于这里的两次调用，`high()` 的 `Iterator` 模板参数类型是\
  \ `double`。除了（终于）纠正了 `high()` 的代码外，似乎与我们之前的解决方案没有区别。确切地说，所执行的代码没有区别，但在代码的泛用性上有一个至关重要的区别。`high()`\
  \ 的模板版本可以用于每种可以用一对迭代器描述的序列。在查看 STL 的详细约定以及它为我们提供的、那些可以让我们免于编写常见的繁琐代码的有用标准算法之前，让我们先考虑存储数据元素集合的另外两种方法。\n\
  \n### 试一试看\n\n我们又在那个程序中留下了一个严重的错误。找到它，修复它，并针对该类问题建议一种通用的解决办法。\n\n分析代码片段的相似性并将其泛化为单段代码的过程通常被称为*提升*（lifting）。我们可以利用\
  \ STL 的思想和 STL 本身进一步提升“杰克和水水”的例子；参见相关习题。\n\n### 19.3 链表\n\n**CC**\n\n再次考虑序列概念的图形化表示：\n\
  \n![数据表连接了几个数组。序列的开头有三个持续到末尾的数组。一个扩展数组在末尾之后。](img/f0557-01.jpg)\n\n将其与我们在内存中可视化\
  \ `vector` 的方式进行比较：\n\n![数据表连接了几个数组。](img/f0557-02.jpg)\n\n基本上，下标 `0` 标识的元素与迭代器\
  \ `v.begin()` 相同，下标 `v.size()` 标识的元素与迭代器 `v.end()` 相同的最后一个之后。\n\n`vector` 的元素在内存中是连续的。STL\
  \ 的序列概念并不要求这一点，而且恰好在许多算法中，我们希望在两个现有元素之间插入一个元素，而不移动这些现有元素。抽象概念的图形表示暗示了在不移动其他元素的情况下插入（以及删除）元素的可能性。STL\
  \ 的迭代器概念支持了这一点。\n\nSTL 序列图最直接暗示的数据结构被称为*链表*（linked list）。抽象模型中的箭头通常实现为指针。链表的一个元素是一个“链接”的一部分，该链接由元素和一个或多个指针组成。一个链接只有一个指针（指向下一个链接）的链表被称为*单链表*（singly-linked\
  \ list），而一个链接同时指向前一个和下一个链接的链表被称为*双链表*（doubly-linked list）。我们将勾画双链表的实现方案，这是 C++ 标准库以\
  \ `list` 之名提供的。在图形上，它可以表示如下所示：\n\n![数据表连接了几个数组。序列的开头有三个持续到末尾的数组。一个扩展数组在末尾之后。连接通过双链接定义。](img/f0558-01.jpg)\n\
  \n这可以用代码表示为：\n\n点击此处查看代码图像\n\n```\ntemplate<Element T>\nstruct Link {\n        Link*\
  \ prev;                // 前一个链接\n        Link* succ;                // 后继（下一个）链接\n\
  \        T val;                        // 值\n};\n\ntemplate<Element T> struct List\
  \ {\n        Link<T>* first;\n        Link<T>* last;           // 最后一个链接之后的\n};\n\
  ```\n\n我们可以这样展示 `Link` 的布局\n\n![数据表显示了链接的布局。从上到下，链接包含 prev、succ 和 val，prev 和 succ\
  \ 采用单链接。](img/f0558-02.jpg)\n\n实现链表并向用户展示链表有许多方法。在这里，我们只需概述列表的关键属性（你可以插入和删除元素而不扰动现有元素），展示我们如何遍历列表，并给出一个列表使用的示例。\n\
  \n当你尝试思考列表时，我们强烈鼓励你画一些小图来视觉化你正在考虑的操作。链表操作确实是一个“画胜千言”的话题。另见 §15.7 中的列表示例。\n\n####\
  \ 19.3.1 列表操作\n\n**CC**\n\n列表需要哪些操作？\n\n*   我们在 `vector` 中拥有的操作（构造函数、size 等）§18.1.1），下标访问除外。\n\
  *   `insert()`（添加元素）和 `erase()`（移除元素）操作；`vector` 也有这些操作（参见 §19.4.2）。\n*   可以用于引用元素并遍历列表的东西：迭代器。\n\
  \n在 STL 中，该迭代器类型是其类的成员，因此我们将采取相同的方法：\n\n点击此处查看代码图像\n\n```\ntemplate<Element T>\n\
  class List {\n        // ... 表示和实现细节 ...\npublic:\n        // ... 构造函数、析构函数等 ...\n\
  \n        class iterator;                  // 成员类型：迭代器\n\n        iterator begin();\
  \               // 指向第一个元素的迭代器\n        iterator end( );                 // 指向最后一个元素之后的迭代器\n\
  \n        iterator insert(iterator p, const T& v);       // 在 p 之后插入 v\n       \
  \ iterator erase(iterator p);                         // 移除 p\n\n        void push_back(const\
  \ T& v);                    // 在末尾插入 v\n        void push_front(const T& v);   \
  \                // 在头部插入 v\n        void pop_front();                         \
  \      // 移除第一个元素\n        void pop_back();                               // 移除最后一个元素\n\
  \n        T& front();       // 第一个元素\n        T& back();        // 最后一个元素\n};\n\
  ```\n\n正如 `Vector` 不是完整的定义，这个 `List` 也不完整。`List` 没有问题；它仅仅是不完整。我们的 `List` 的目的是传达链表是什么、如何实现\
  \ `list` 以及如何使用。更多信息请参见专家级 C++ 书。\n\n#### 19.3.2 遍历\n\n`List` 迭代器必须提供 `*`、`++`、`==`\
  \ 和 `!=`。由于 `std::list` 是双链表，它还提供了 `--` 用于向列表头部“反向”遍历：\n\n点击此处查看代码图像\n\n\n\n\n```cpp\n\
  template<Element T>\nclass List<Elem>::iterator {\n        LinkT>* curr;       \
  \            // 当前链接\npublic:\n        iterator(Link<T>* p) :curr{p} { }\n\n   \
  \     iterator& operator++() {curr = curr−>succ; return *this; }               \
  \ // 前进\n        iterator& operator−−() { curr = curr−>prev; return *this; }   \
  \            // 后退\n        T& operator*() { return curr−>val; }               \
  \                                 // 获取值（解引用）\n\n        bool operator==(const iterator&\
  \ b) const { return curr==b.curr; }\n        bool operator!= (const iterator& b)\
  \ const { return curr!=b.curr; }\n};\n```\n\n这些函数短小且简单，显然是高效的：没有循环，没有复杂的表达式，也没有“可疑”的函数调用。如果你对实现方式还不清楚，只需快速查看上面的图表。这个\
  \ `List` 迭代器只是一个指向带有所需操作的链接。请注意，尽管 `list<T>::iterator` 的实现（代码）与我们作为 `vector` 和数组迭代器使用的简单指针非常不同，但操作的含义（语义）是相同的。基本上，`List`\
  \ 迭代器为 `Link` 指针提供了合适的 `++`、`--`、`*`、`==` 和 `!=`。\n\n再次查看 `high()`：\n\n点击此处查看代码图像\n\
  \n```cpp\ntemplate<input_iterator Iter>\nIter high(Iter first, Iter last)\n    \
  \    // 返回指向 first,last) 中值最大的元素的迭代器\n{\n        Iter high = first;\n        for\
  \ (Iter p = first; p!=last; ++p)\n                if (*high<*p)\n              \
  \         high = p;\n        return high;\n}\n```\n\n我们可以将其用于 `list` 或 `List`：\n\
  \n[点击此处查看代码图像\n\n```cpp\nvoid f()\n{\n        list<int> lst;\n        for (int x;\
  \ cin >> x; )\n                lst.push_front(x);\n\n        list<int>::iterator\
  \ p = high(lst.begin(), lst.end());\n        cout << \"the highest value was \"\
  \ << *p << '\\n';\n}\n```\n\n在这里，`high()` 的参数 `Iter` 的“值”是 `list<int>::Iterator`，且\
  \ `++`、`*` 和 `!=` 的实现与数组的情况发生了巨大变化，但含义仍然。模板函数 `high()` 仍然遍历数据（这里是一个 `list`）并找到最大值。我们可以在\
  \ `list` 的任何位置插入元素，因此我们使用 `push_front()` 在头部添加元素，仅仅是为了证明我们可以这样做。我们同样可以像处理 `vector`\
  \ 那样使用 `push_back()`。\n\n### 尝试一下\n\n标准库的 `vector` 不提供 `push_front()`。为什么呢？为 `vector`\
  \ 实现 `push_front()` 并将其与 `push_back()` 进行比较吧。\n\n现在，最后，是时候问这个问题了：“但如果 `list` 是空的怎么办？”换句话说，“如果\
  \ `lst.begin()==lst.end()` 怎么办？”在这种情况下，`p` 将尝试解引用最后一个元素之后的元素 `lst.end()`：灾难！或者——可能更糟糕——结果可能是一个被误认为是正确答案的随机值。\n\
  \n### CC\n\n问题的最后一种表述强烈暗示了解决方案：我们可以通过比较 `begin()` 和 `end()` 来测试列表是否为空——事实上，我们可以通过比较其起始和结束位置来测试任何\
  \ STL 序列是否为空：\n\n![数据表连接两个数组。起始数组和结束数组连接到一个未分配的槽位。](img/f0561-01.jpg)\n\n这就是为什么让\
  \ `end` 指向最后一个元素之后而不是指向最后一个元素的更深层原因：空序列不是一个特殊情况。我们不喜欢特殊情况，因为——根据定义——我们必须记住为它们编写处理特殊情况的代码。\n\
  \n在我们的示例中，我们可以像像这样使用它：\n\n点击此处查看代码图像\n\n```cpp\nlist<int>::iterator p = high(lst.begin(),\
  \ lst.end());\nif (p==lst.end())                        // 我们是否到达了末尾？\n        cout\
  \ << \"The list is empty\";\nelse\n        cout << \"the highest value is \" <<\
  \ *p << '\\n';\n```\n\n我们在 STL 算法中系统地使用针对 `end()`（表示“未找到”）的测试。\n\n由于标准库提供了 `list`，我们在这里不再深入探讨其实现。相反，我们将简要查看\
  \ `list` 的用途（如果你对列表实现细节感兴趣，请参见练习 12–14）。\n\n### 19.4 再次泛化 Vector\n\n标准库的 `vector`\
  \ 有 `iterator` 成员类型以及 `begin()` 和 `end()` 成员函数（就像 `std::list` 一样）。然而，我们在 §18.1.1\
  \ 为 `Vector` 提供的这些仅返回指针。为了让不同的容器可以通用地使用，究竟需要什么？首先，我们概述解决方案，然后解释它：\n\n点击此处查看代码图像\n\
  \n```cpp\ntemplate<Element T, Allocator A = allocator<T>>\nclass Vector {\npublic:\n\
  \        using size_type = int;\n        using value_type = T;\n        using iterator\
  \ = T*;\n        using const_iterator = T*;\n\n        // ...\n\n        iterator\
  \ begin();\n        const_iterator begin() const;\n        iterator end();\n   \
  \     const_iterator end() const;\n\n        size_type size();\n\n        // ...\n\
  };\n```\n\n**CC**\n\n`using` 声明为类型创建别名；也就是说，对于 `Vector`，`iterator` 是我们选择作为迭代器的类型别名：`T*`。现在，对于一个名为\
  \ `v` 的 `Vector`，我们可以\n\n点击此处查看代码图像\n\n```cpp\nvector<int>::iterator p = find(v.begin(),\
  \ v.end(), 32);\n```\n\n并且\n\n点击此处查看代码图像\n\n```cpp\nfor (vector<int>::size_type\
  \ i = 0; i<v.size(); ++i)\n         cout << v[i] << '\\n';\n```\n\n编写这些代码，我们不需要知道\
  \ `iterator` 和 `size_type` 的具体类型。特别是，由于上面的代码是基于 `iterator` 和 `size_type` 的，它适用于各种标准容器以及具有不同表示方法的系统。例如，我们可以提供范围检查的迭代器类型\
  \ (20.7.2))。`size_type` 通常是一个无符号整数类型（PPP25.5.3），但这里我们为了简单使用了 `int`。为了在符号类型之间安全转换，我们使用\
  \ `narrow`。\n\n标准库以类似的方式定义了 `list` 和其他标准容器。例如：\n\n[点击此处查看代码图像\n\n```cpp\ntemplate<Element\
  \ T, Allocator A = allocator<T>>\nclass List {\npublic:\n        using size_type\
  \ = int;\n        using value_type = T;\n        class Link;\n        class iterator;\
  \                           //  §19.3\n        class const_iterator;           \
  \      // 与 iterator，但允许写入元素\n        // ...\n\n        iterator begin();\n    \
  \    const_iterator begin() const;\n        iterator end();\n        const_iterator\
  \ end() const;\n\n        size_type size();\n\n        // ...\n};\n```\n\n#### 19.4.1\
  \ 容器遍历\n\n使用 `size()`，我们可以从我们的 `vector` 的第一个元素遍历到最后一个元素。例如：\n\n点击此处查看代码图像\n\n```cpp\n\
  void print1(const vector<double>& v)\n{\n        for (int i = 0; i<v.size(); ++i)\n\
  \                cout << v[i] << '\\n';\n}\n```\n\n**CC**\n\n然而，这并不适用于 `list`，因为\
  \ `list` 不提供下标。然而，我们可以使用迭代器遍历标准库的 `vector` 和 `list`。例如：\n\n\n\n\n\n```cpp\nvoid\
  \ print2(const vector<double>& v, const list<double>& lst)\n{\n        for (vector<T>::iterator\
  \ p = v.begin(); p!=v.end(); ++p)\n                cout << *p << '\\n';\n\n    \
  \    for (list<T>::iterator p = v.begin(); p!=v.end(); ++p)\n                cout\
  \ << *p << '\\n';\n}\n```\n\n这既适用于标准库容器，也适用于我们的 `Vector` 和 `List`。\n\n## CC\n\n\
  在泛型代码中，类型名称可能会变得长得令人人。我们并不喜欢重复输入像 `vector<T>::iterator` 这样的名称，而且我们知道 `begin()` 返回的值是相应类型的迭代器。因此，我们通常使用\
  \ `auto` 来简化此类代码：\n\n点击此处查看代码图片\n\n```cpp\nvoid print2(const vector<double>& v,\
  \ const list<double>& lst)\n{\n        for (auto p = v.begin(); p!=v.end(); ++p)\n\
  \                cout << *p << '\\n';\n\n        for (auto p = v.begin(); p!=v.end();\
  \ ++p)\n                cout << *p << '\\n';\n}\n```\n\n当我们不需要元素的位置时，还可以做得更好。范围\
  \ 循环（range-for-loop）仅仅是使用迭代器遍历序列的“语法糖”，因此我们得到：\n\n点击此处查看代码图片\n\n```cpp\nvoid print3(const\
  \ vector<double>& v, const list<double>& lst)\n{\n        for (double x : v)\n \
  \               cout << x << '\\n';\n\n        for (double x : lst)\n          \
  \      cout << x << '\\n';\n}\n```\n\n用于 `print2()` 和 `print3()` 的技术可以用于所有的标准库容器（§20.6）。\n\
  \n### 19.4.2 insert() 和 erase()\n\n## AA\n\n标准库的 `vector` 是我们容器的默认选择。它具有大多数我们所需的功能，因此我们只在必要时才使用替代方案。它的主要问题是在我们在进行列表操作（`insert()`\
  \ 和 `erase()`）时，具有移动元素的习惯；当我们处理包含大量元素的 `vector` 或包含大型元素的 `vector` 时，这种代价可能是高昂的。不过，不要太担心。我们对使用\
  \ `push_back()` 向 `vector` 中读入五十万个浮点值感到相当满意——测量证实，预分配并没有产生显著差异。在为了性能而做出重大更改之前，务必始终进行测量。即使对于专家来说，猜测性能也是困难的。\n\
  \n## XX\n\n移动元素还意味着一个逻辑限制：在执行列表操作（如 `insert()`、`erase()` 和 `push_back()`）时，不要持有指向\
  \ `vector` 元素的迭代器或指针：如果元素移动了，你的迭代器或指针将指向错误的元素或完全指向没有元素。这是 `list`（以及 `map`（§19.4.2））相对于\
  \ `vector` 的主要优势。如果你需要一个大型对象的集合，或者一个从程序中许多地方指向的对象集合，请考虑使用 `list`。\n\n让我们比较 `vector`\
  \ 和 `list` 的 `insert()` 和 `erase()`。首先，我们取一个仅用于说明关键点的示例：\n\n点击此处查看代码图片\n\n```cpp\n\
  vector<int>::iterator p = v.begin();           // 取一个 vector\n++p; ++p; ++p;   \
  \                                      // 指向它的第 4 个元素\nvector<int>::iterator q =\
  \ p;\n++q;                                                         // 指向它的第 5 个元素\n\
  ```\n\n![数据表连接多个数组。](img/f0564-01.jpg)\n\n点击此处查看代码图片\n\n```cpp\np = v.insert(p,99);\
  \                               // p 指向插入的元素\n```\n\n![数据表连接多个数组。](img/f0565-01.jpg)\n\
  \n注意 `q` 现在已无效。随着 vector 大小的的增长，元素可能已经被重新分配了。如果 `v` 有剩余容量，使其能够在原地增长，那么 `q` 最可能指向值为\
  \ `3` 的元素而不是值为 `4` 的元素，但不要尝试利用这一点。\n\n点击此处查看代码图片\n\n```cpp\np = v.erase(p);    \
  \                               // p 指向被删除元素之后的一个元素\n```\n\n![数据表连接多个数组。](img/f0565-02.jpg)\n\
  \n也就是说，一个 `insert()` 后接对插入元素的 `erase()` 会让我们回到起点，但此时 `q` 失效了。然而，在此期间，我们移动了插入点之后的所有元素，可能由于\
  \ `v` 的增长，所有元素都被重新定位了。\n\n为了比较，我们将对 `list` 执行完全相同的操作：\n\n点击此处查看代码图片\n\n```cpp\n\
  list<int>::iterator p = lst.begin();           // 取一个 list\n++p; ++p; ++p;     \
  \                                    // 指向它的第 4 个元素\nlist<int>::iterator q = p;\n\
  ++q;                                                         // 指向它的第 5 个元素\n```\n\
  \n点击此处查看代码图片\n\n```cpp\np = lst.insert(p,99);                               // p\
  \ 指向插入的元素\n```\n*注：根据上下文，源代码中的 v.insert 应该是 lst.insert 以对应 list）*\n\n点击此处查看代码图片\n\
  \n```cpp\np = lst.erase(p);                               // p 指向被删除元素之后的元素\n```\n\
  \n### 19.4.3 使 vector 适配 STL\n\n在添加了 `begin()`、`end()` 以及 §19.4 中的类型名后，我们的 `Vector`\
  \ 只缺少 `insert()` 和 `erase()` 来接近 `std::vector`：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<Element\
  \ T, Allocator A>\nclass Vector {\n        Vector_rep<A> r;\npublic:\n        //\
  \ ...\n        iterator insert(iterator p, const T& val);\n        iterator erase(iterator\
  \ p);\n};\n```\n\n我们再次使用了元素类型 `T*` 作为迭代器类型。这是最简单的解决方案。我们将提供范围检查的迭代器留给了练习（练习 19）。\n\
  \n## AA\n\n通常人们不会为连续存储元素的数据类型（如 `vector`）提供列表操作（如 `insert()` 和 `erase()`）。然而，对于元素元素或数量较少的\
  \ `vector`，列表操作（如 `insert()` 和 `erase()`）非常有用且效率惊人。我们反复看到 `push_back()` 的用处，它是另一个与列表关联的操作。\n\
  \n基本上，我们通过拷贝我们要删除（移除、删除）元素之后的所有元素来实现 `Vector<T,A>::erase()`。结合 §18.1.1 中 `Vector`\
  \ 的定义以及 §18.4.4 和 §19.4 中的添加，我们得到：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<Element T,\
  \ Allocator A>\nVector<T,A>::iterator Vector<T,A>::erase(iterator p)\n{\n      \
  \  if (p==end())\n                 return p;\n        move(p+1,r.sz,p);        \
  \                     // 将每个元素左移一位\n        destroy_at(r.elem()+r.sz−1));      \
  \      // 销毁多出的最后一个元素\n        --r.sz;\n        return p;\n}\n```\n\n我们使用标准库函数 `move()`\
  \ 和 `destroy_at` 来避免更复杂的底层设施。\n\n如果你查看图形表示，这样的代码会更容易理解：\n\n![数据表连接两个数组。](img/f0567-01.jpg)\n\
  \n\n\n\n`erase()` 的代码相当简单，但尝试通过在纸上画几个示例来练习可能是一个好主意。空的 `Vector` 是否被正确处理了？为什么我们需要\
  \ `p==end()` 测试？如果我们删除了 `Vector` 的最后一个元素会怎样？如果我们使用下标表示法，代码是否会更易读？\n\n实现 `Vector<T,A>::insert()`\
  \ 稍微复杂一点点：\n\n点击此处查看代码图片\n\n```\ntemplate<Element T, Allocator A>\nVector<T,A>::iterator\
  \ Vector<T,A>::insert(iterator p, const T& val)\n{\n       int index = p−begin();\
  \                             // 保存索引以防重定位\n       if (size()==capacity())\n   \
  \           reserve(size()==0?8:2*size());           // 确保有空间\n       p = begin()+i;\
  \                                          // p 现在指向当前的分配区域\n       move_backward(p,r.sz−1,p+1);\
  \               // 将每个元素向右移动一位\n        *(begin()+index) = val;                \
  \           // “插入” val\n       ++r.sz;\n       return pp;\n}\n```\n\n请注意：\n\n*\
  \   迭代器可能不会指向其序列之外，因此我们使用指针（例如 `elem+sz`）来这样做。这就是为什么分配器是基于指针而不是迭代器定义的理由之一。\n*  \
  \ 当我们使用 `reserve()` 时，元素可能会移动到新的内存区域。因此，我们必须记住元素要插入的索引，而不是指向它的元素的迭代器。当 `Vector`\
  \ 重新分配其元素时，指向该 `Vector` 的迭代器将失效——你可以将它们认为指向了旧内存。\n*   我们使用标准库函数 `move_backward()`\
  \ 而不是 `std::move()`，以确保最后一个元素是第一个被移动的。普通的 `move()` 会先移动第一个元素，从而在第二个元素被移动之前就覆盖了它。\n\
  *   正是这些细节，使我们能够在可能的情况下避免处理底层的内存问题。自然地，`std::vector` 以及所有其他标准库容器都正确处理了这类重要的语义细节。这就是偏好使用标准库而不是“自制”的原因之一。\n\
  \n出于性能考虑，你通常不会在一个包含 100,000 个元素的 `vector` 中间使用 `insert()` 和 `erase()`；`list` 和 `map`\
  \ 是为此设计的（§19.4.2）。然而，所有的 `vector` 都提供了 `insert()` 和 `erase()` 操作，当你只需要移动几个单词——甚至是几十个单词时，它们的性能是无敌的，因为现代计算机非常擅长这种拷贝；参见练习\
  \ 20。避免使用（链接的）`list` 来表示少量小元素的列表。\n\n### 19.5 示例：简单的文本编辑器\n\n**CC**\n\n列表的核心特征是可以添加和删除元素，而不移动列表中的其他元素。让我们尝试一个简单的示例来说明这一点。考虑如何在简单的文本编辑器中表示文本文档的字符。这种表示法应该让对文档的操作简单且具有合理的效率。\n\
  \n哪些操作呢？假设文档可以放入计算机的主内存中。这样，我们就可以选择任何适合我们的表示法，并在想要将其存储到文件中时简单地转换为字节流。同样，我们可以从文件中读取字节流并将其转换为内存中的表示法。确定了这一点，我们可以专注于选择一种方便的内存表示法。基本上，我们的表示法必须很好支持以下五点：\n\
  \n*   从输入的字节流构造它\n*   插入一个或多个字符\n*   删除一个或多个字符\n*   搜索字符串\n*   生成输出到文件或屏幕的字节流\n\n\
  最简单的表示法是 `vector<char>`。然而，为了添加或删除字符，我们必须移动文档中后续每一个字符。考虑：\n\n点击此处查看代码图片\n\n```\n\
  This is the start of a very long document.\nThere are lots of ...\n```\n\n我们可以添加所需的\
  \ `t` 来得到\n\n点击此处查看代码图片\n\n```\nThis is the start of a very long document.\nThere\
  \ are lots of ...\n```\n\n但是，如果这些字符存储在单个 `vector<char>` 中，我们就必须从 `h` 开始的每个字符向右移动一位。这会导致大量的拷贝。事实上，对于一个长达\
  \ 70,000 个字符的文档（例如本章，包括空格），我们平均需要移动 35,000 个字符才能插入或删除一个字符。产生的实时延迟可能会让用户察觉并感到烦恼。因此，我们将我们的表示法“拆分”成“块”（chunks），这样我们就可以在不移动大量字符的情况下更改文档的一部分。我们将文档表示为“行”的列表\
  \ `list<Line>`，其中 `Line` 是一个 `vector<char>`。\n\n\n\n\n\n```cpp\nusing Line = vector<char>;\
  \             // a line is a vector of characters\n\nstruct Document {\n       \
  \ list<Line> line;                // a document is a list of lines\n        Document()\
  \ { line.push_back(Line{}); }\n};\n```\n\n每个 `Document` 都从一个空行开始：`Document` 的构造函数会创建一个空行，并将其推入行列表中。\n\
  \n读取并拆分为行可以像这样操作：\n\n点击此处查看代码图片\n\n```cpp\nistream& operator>>(istream& is, Document&\
  \ d)\n{\n        for (char ch; is.get(ch); ) {\n                d.line.back().push_back(ch);\
  \      // add the character\n                if (ch=='\\n')\n                  \
  \        d.line.push_back(Line{});// add another line\n        }\n        if (d.line.back().size())\n\
  \                d.line.push_back(Line{});          // add final empty line\n  \
  \      return is;\n}\n```\n\n`vector` 和 `list` 都有一个成员函数 `back()`，它返回最后一个元素的引用。要使用它，你必须确保确实有一个最后一个元素供\
  \ `back()` 引用——不要在空容器上使用它。这就是为什么我们定义 `Document` 以一个空 `Line` 结尾。请注意，我们存储了输入中的每一个字符，甚至是换行符（`'\\\
  n'`）。存储这些换行符极大地简化了输出操作，但你必须小心如何定义字符计数（仅仅计算字符将得到一个包含空格和换行符的数字）。\n\n### 19.5.2 迭代\n\
  \n如果文档只是一个 `vector<char>`，那么遍历它非常简单。我们如何遍历一个行列表呢？显然，我们可以使用 `list<Line>::iterator`\
  \ 来遍历列表。但是，如果我们想一个接一个访问字符，而不受换行符的干扰呢？我们可以为我们的 `Document` 提供一个专门的迭代器：\n\n点击此处查看代码图片\n\
  \n```cpp\nclass Text_iterator {                 // keep track of line and character\
  \ position within a line\n        list<Line>::iterator ln;\n        Line::iterator\
  \ pos;\npublic:\n        Text_iterator(list<Line>::iterator ll, Line::iterator pp)\n\
  \                // line ll’s character position pp\n                :ln{ll}, pos{pp}\
  \ { }\n\n        char& operator*() { return *pos; }\n        Text_iterator& operator++();\n\
  \        bool operator==(const Text_iterator& other) const\n                { return\
  \ ln==other.ln && pos==other.pos; }\n        bool operator!=(const Text_iterator&\
  \ other) const\n                { return !(*this==other); }\n};\n\nText_iterator&\
  \ Text_iterator::operator++()\n{\n        ++pos;                            // proceed\
  \ to next character\n        if (pos==ln−>end()) {\n               ++ln;       \
  \                // proceed to next line\n               pos = ln−>begin();   //\
  \ bad if ln==line.end(); so make sure it isn’t\n        }\n        return *this;\n\
  }\n```\n\n为了让 `Text_iterator` 用，我们需要为 `Document` 类配备传统的 `begin()` 和 `end()` 函数：\n\
  \n点击此处查看代码图片\n\n```cpp\nstruct Document {\n       list<Line> line;\n\n       Text_iterator\
  \ begin()                         // first character of first line\n           \
  \    { return Text_iterator{line.begin(), line.begin()−>begin()}; }\n\n       Text_iterator\
  \ end()                            // one beyond the last character of the last\
  \ line\n       {\n               auto last = line.end();\n               −−last;\
  \                                      // we know that the document is not empty\n\
  \               return Text_iterator{last, (*last).end()};\n       }\n};\n```\n\n\
  现在我们可以这样遍历文档的字符：\n\n```cpp\nvoid print(Document& d)\n{\n         for (auto p : d)\n\
  \           cout << p;\n}\n```\n\n将文档呈现为字符序列对很多事情用，但通常我们遍历文档是为了寻找比字符更特定的内容。例如，这里有一段删除第\
  \ `n` 行的代码：\n\n点击此处查看代码图片\n\n```cpp\nvoid erase_line(Document& d, int n)\n{\n  \
  \      if (!(0<=n && n<d.line.size()))\n                return;\n        auto p\
  \ = d.line.begin();\n        advance(p,n);\n        d.line.erase(p);\n}\n```\n\n\
  调用 `advance(p,n)` 会将迭代器 `p` 向移动 `n` 个元素；`advance()` 是标准库函数，但我们也可以这样自己实现它：\n\n点击此处查看代码图片\n\
  \n```cpp\ntemplate<forward_iterator Iter>\nvoid advance(Iter& p, int n)\n{\n   \
  \     while (0<n) {\n                ++p;\n                −−n;\n        }\n}\n\
  ```\n\n注意 `advance()` 可以用来模拟下标操作。实际上，对于一个名为 `v` 的 `vector`，`p=v.begin();` `advance(p,n);`\
  \ 大约等同于 `v[n]`。\n\n\n\n\n返回序列的末尾以表示“未找到”是一个重要的 STL 约定。`match()` 函数显而易见；它只是比较两个字符序列。尝试自己写一下。用于在字符序列中查找字符的\
  \ `find()` 可以是最简单的标准库算法（§21.1.1）。我们可以这样使用我们的 `find_txt()`：\n\n点击此处查看代码图片\n\n```cpp\n\
  auto p = find_txt(my_doc.begin(), my_doc.end(), \"secret\\nhomestead\");\nif (p==my_doc.end())\n\
  \        cout << \"not found\";\nelse {\n        // do something\n}\n```\n\n我们的“文本处理器”及其操作非常简单。显然，我们的目标是简单和合理的效率，而不是提供一个“功能丰富”的编辑器。不过，不要被欺骗，认为为任意字符序列提供*高效*的插入、删除和搜索是轻而易举的。我们选择这个例子是为了说明\
  \ STL 概念——序列、迭代器和容器（如 `list` 和 `vector`）以及一些 STL 编程约定（技术），例如返回序列的末尾以表示失败的力量和通用性。注意，如果我们愿意，可以将\
  \ `Document` 开发为 STL 容器——通过提供 `Text_iterator`，我们已经完成了将 `Document` 表示为值序列的关键部分。\n\
  \n### 19.6 vector, list, and string\n\n为什么我们对行使用 `list` 而对字符使用 `vector`呢？更准确地说，为什么我们对行序列使用\
  \ `list`，而对字符序列使用 `vector`？此外，为什么我们没有使用 `string` 来存储一行呢？\n\n我们可以问一个稍微通用一点的问题。我们现在已经看到了存储字符序列的五种方法：\n\
  \n*   `char[N]`（`N` 个字符的数组）\n*   `array<char,N>`（`N` 个字符的 `std::array`；§20.6.2）\n\
  *   `vector<char>`\n*   `string`\n*   `list<char>`\n\n**CC**\n\n对于给定的问题，我们如何在它们之间进行选择？对于非常简单的任务，它们是可以互换的；也就是说，它们的接口非常相似。例如，给定一个迭代器，我们可以使用\
  \ `++` 遍历每一个元素，并使用 `*` 访问字符。如果我们查看与 `Document` 相关的代码示例，我们实际上可以将 `vector<char>` 替换为\
  \ `list<char>` 或 `string` 而不会产生任何逻辑问题。这种可交换性从根本上说是好的，因为它允许我们根据性能进行选择。然而，在考虑性能之前，我们应该查看这些类型的逻辑属性：每种类型可以做什么其他类型不能做的事？\n\
  \n*   `T[N]`：不知道自己的大小。没有 `begin()`、`end()` 或任何其他有用的容器成员函数。相反，我们可以对数组使用 `begin(a)`\
  \ 和 `end(a)`，但（显然）不适用于指针。不能进行系统的范围检查。可以传递给用 C 语言和 C 风格函数编写的。元素在内存中连续分配。数组的大小在编译时是固定的。比较（`==`\
  \ 和 `!=`）和输出（`<<`）使用数组第一个元素的指针，而不是元素本身。\n*   `array<T,N>`：类似于 `T[N]`，但没有到指针的隐式转换§20.6.2]。具有用于复制和比较的值语义。\n\
  *   `vector<T>`：几乎可以做任何事情，包括 `insert()` 和 `erase()`。提供下标访问。列表操作（如 `insert()` 和 `erase()`）通常涉及移动元素（对于大元素和大量元素可能是无效的）。可以进行范围检查。元素在内存中连续分配。`vector`\
  \ 是可扩展的（例如使用 `push_back()`）。`vector` 的元素存储（连续地）在数组中。比较运算符（`==`, `!=`, `<`, `<=`,\
  \ `>`, 和 `>=`）比较元素。\n*   `string`：元素是字符。提供了所有常见且有用的操作以及特定的文本处理操作，例如拼接（`+` 和 `+=`）。元素保证在内存中是连续的。`string`\
  \ 是可扩展的。比较运算符（`==`, `!=`, `<`, `<=`, `>`, 和 `>=`）比较元素。\n*   `list<T>`：提供了所有常见且通常的操作，除了下标访问。我们可以执行\
  \ `insert()` 和 `erase()` 而不需要移动其他元素。每个元素需要额外的两个字（用于链接指针）。遍历元素可能是昂贵的的。`list` 是可扩展的。比较运算符（`==`,\
  \ `!=`, `<`, `<=`, `>`, 和 `>=`）比较元素。\n\n**AA**\n\n正如我们所见（§16.1），数组对于处理底层内存以及与用 C\
  \ 语言编写的代码接口是有用且必要的（PPP2.§27.1.2, PPP2.§27.5）。除此之外，更倾向于使用 `vector` 因为更容易用、更灵活、更安全。`list<char>`\
  \ 占据的内存是其他的三倍；`vector<char>` 每个元素使用 1 字节。\n\n`vector` 在哪方面优于 `string`？从它们的属性来看，`string`\
  \ 可以做 `vector` 能做的一切，而且更多。也就是说，`vector` 针对内存操作（如 `push_back()`）进行了优化，而 `string`\
  \ 则针对拼接或读取空白分隔的单词进行了优化。结论是，除非你需要字符串操作，否则优先选择 `vector` 而非 `string`。\n\n这些差异列表在实际代码中意味着什么？对于\
  \ `char[]`、`vector<char>`、`list<char>` 和 `string` 的每一个，定义值为 \"Hello\"，将其作为参数传递给函数，输出字符串的长度，与\
  \ \"Hello\" 进行比较（看你是否真的传递了 \"Hello\"），并与 \"Howdy\" 比较看哪个在字典中靠前。将参数拷贝到另一个同类型的变量中。\n\
  \n对 `int` 数组、`vector<int>` 和 `list<int>` 执行之前的 **TRY THIS**，值为 `{1,2,3,4,5}`。\n\n\
