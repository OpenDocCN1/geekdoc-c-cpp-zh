  \n# 3 计算\n\n*“如果不需要产生正确的结果，我可以让它运行得任意快。”*\n\n*– 杰拉德·M·温伯*\n\n本章介绍了计算的基础知识。特别是，我们讨论了如何从一组操作数（*表达式*\
  \ expression）计算出一个值，如何在备选操作之间进行选择（*选择* selection），以及如何对一系列值重复计算（*迭代* iteration）。我们还展示了如何单独命名并指定特定的子计算（一个*函数*\
  \ function）。我们的主要关注点是以能够产生正确且组织良好的程序的方式表达计算。为了帮助你执行更真实的计算，我们引入了 `vector` 类型来存储值的序列。\n\
  \n*§3.1 计算\n*§3.2 目标与工具\n*§3.3 表达式\n\n常量表达式; 运算符\n\n*§3.4 语句\n\n选择; 迭代\n\n*§3.5\
  \ 函数\n\n为什么要用函数？; 函数声明\n\n*§3.6 vector\n\n遍历 vector; 增长 vector; 数值示例; 文本示例\n\n*§3.7\
  \ 语言特性\n\n### 3.1 计算\n\n从一个角度来看，程序所做的一切就是计算；也就是说，它接收一些输入并产生一些输出。毕竟，我们将运行程序的硬件称为“计算机”。只要我们广泛地看什么构成输入和输出，这个观点就是合理的：\n\
  \n![一张图表揭示了程序执行的一系列步骤。输入通过代码转换为数据（代码通常很杂乱且包含大量代码），以渲染出输出。](img/f0052-01.jpg)\n\n\
  输入可以来自键盘、鼠标、触摸屏、文件、其他输入设备、其他程序或程序的其他部分。“其他输入设备”是一个包含非常有趣输入源的类别：音乐键盘、视频录制机、网络连接、温度传感器、图像传感器、电源等。\n\
  \n为了处理输入，程序通常包含一些数据，这些数据有时被称为*数据结构*（data structures）或*状态*（state）。例如，日历可以建立节日的列表。\n\
  \n从（一个角度来看，程序所做的一切就是计算；也就是说，它接收一些输入并产生一些输出。毕竟，我们将运行程序的硬件称为“计算机”。只要我们广泛地看什么构成输入和输出，这个观点就是合理的：\n\
  \n输入可以来自键盘、鼠标、触摸屏、文件、其他输入设备、其他程序或程序的其他部分。“其他输入设备”是一个包含非常有趣输入源的类别：音乐键盘、视频录制机、网络连接、温度传感器、图像传感器、电源等。\n\
  \n为了处理输入，程序通常包含一些数据，这些数据有时被称为*数据结构*或*状态*。例如，日历可以建立节日的列表。\n\n`I/O` 缩写代表“输入/输出”。在这种情况下，一段代码的输出是另一段代码的输入。此类“程序部分”共享存储在主内存、持久化存储（如磁盘）或通过网络连接传输的数据。当我们说“程序部分”时，我们指的是某些实体，例如从一组输入参数产生结果的函数、在物理对象上执行操作的函数（例如在屏幕上画线的函数），或修改程序内部某些表格的函数（例如向客户表中添加姓名的函数）。\n\
  \n当我们谈论“输入”和“输出”时，我们通常指的是进入和离开计算机的信息，但正如你所看到的，我们也可以用这些术语来指代提供给程序部分或由程序部分产生的信息。程序的输入通常称为参数（arguments），而程序的输出通常称为结果（results）。\n\
  \n通过*计算*，我们简单指的是根据某些输入产生某些输出的行为，例如使用计算（函数）`square` 从参数（输入）`7` 产生结果（输出）`49`（见 §3.5）。\n\
  \n### 3.2 目标与工具\n\nCC\n\n作为程序员，我们的工作是以以下方式表达计算\n\n*   正确地\n\n*   简单地\n\n*   高效地\n\
  \n\n\n\n\n请注意这些理想的顺序：如果程序给出的结果是错误的，无论运行有多快都没有意义。同样，一个正确且高效的程序可能非常复杂，至于必须丢弃或完全重写以生成新版本（发布）。请记住，实用的程序总是会被修改以适应新需求、新硬件等。因此，一个程序——以及程序的任何部分——应该尽可能简单地完成它的任务。例如，假设你为你当地学校的小朋友编写了一个教学基础算术的完美程序，但它的内部结构却是一团糟。你用什么语言与孩子们交流呢？英语？英语和西班牙语？如果我想在芬兰使用它呢？在科威特呢？你会如何改变用于与孩子交流的（自然）语言呢？如果程序的内部结构是一团糟，那么改变与用户交流的自然语言这一逻辑上简单（但在实践中几乎总是非常困难）的操作将变得不可逾越。\n\
  \n## AA\n\n当我们开始为他人编写代码并承担做好这件事的责任时，对正确性、简单性和效率的关注就成了我们的首要任务；也就是说，当我们决定成为专业人士时，我们必须接受这种责任。在实际操作中，这意味着我们不能只是胡凑代码直到它们看起来可以运行；我们必须关注代码的结构。相反的是，对结构和“代码质量”的关注通常是让程序运行起来的最快方法。当编程得良好时，这些关注会减少对编程中最令人沮丧的部分——调试的需求；也就是说，在开发过程中良好的程序结构可以减少犯的错误数量，以及查找和消除此类错误所需的时间。\n\
  \n## CC\n\n我们组织程序（以及在编程时组织我们思维）的主要工具是将一个大的计算任务分解成许多许多小的计算任务。这种技术有两种变体：\n\n*   **抽象**：将我们不需要使用的功能的细节（“实现细节”）隐藏在方便且通用的接口之后。例如，与其考虑如何排序电话簿的细节（关于如何排序电话簿已经写了厚厚的著作），我们只需调用\
  \ C++ 标准库中的 `sort` 算法。我们排序只需要知道如何调用（call）该算法，这样我们就可以写 `sort(b)`，其中 `b` 指代电话簿；`sort()`\
  \ 是标准库 `sort` 算法的一个版本 (§21.5)）。另一个例子是我们使用计算机内存的方式。直接使用内存可能会非常混乱，因此我们通过类型化和命名的变量\
  \ (§2.2)、标准库的 `vector` (§3.6)、`map` (§20.2) 等来访问内存。\n\n*   **分治**：在这里，我们将一个大问题分解为几个小问题。例如，如果我们需要构建一个字典，可以将这项工作分为三部分：读取数据、排序数据和输出数据。产生的每个问题都比原始问题小得多。\n\
  \n## XX\n\n为什么这有帮助？毕竟，由部分构建的程序可能比所有内容都优化合并在一起的程序稍微大。原因是我们并不擅长处理大问题。我们实际上处理这些问题（在编程和其他地方）的方法是将它们分解成更小的问题，并继续分解成更小的部分，直到得到一个简单足够理解和解决的东西。在编程方面，你会发现一个\
  \ 1000 行程序的首次尝试错误数量远比 100 行程序多十倍以上，因此我们尝试用少于 100 行的部分来组成 1000 行的程序。对于大型程序，例如 10,000,000\
  \ 行，应用抽象和分治不仅是一个选项，更是一项基本要求。我们无法编写和维护大型的单体程序。观察本书其余部分的一种方法是将其视为一系列需要分解成更小部分的示例，以及执行这些操作所需的工具和技术。\n\
  \n当我们考虑划分程序时，我们必须始终考虑我们有哪些可用工具来表达这些部分及其通信。一个提供用于表达想法的有用良好库，可以关键性地影响我们将功能分配到程序不同部分的方式。我们不能只是坐在这里“想象”如何最好划分程序；我们必须考虑我们有哪些可用库来表达这些部分及其通信。现在还处于早期阶段，但指出以下一点也不为太早：如果你可以使用现有的库（例如\
  \ C++ 标准库），你就可以节省大量工作，不仅是在编程方面，在测试和文档方面也是如此。`iostream` 让我们免于直接处理硬件输入输出端口的痛苦。这是使用抽象划分程序的第一个示例。每一新章节都会提供更多示例。\n\
  \n注意对结构和组织的强调：你并不能通过编写大量语句来获得良好的代码。我们现在为什么要提到这一点？在这个阶段，你（或至少许多读者）对代码是什么几乎没有概念，在几个月之后，你才准备好编写让别人赖以生存或生计的代码。我们提到这一点是为了帮助你找对学习的重点。人们很容易急于求成，关注编程中那些——如本章其余部分描述的——具体且立即实用的部分，而忽略开发艺术中更“软”、更具概念的部分。然而，优秀的程序员和系统设计师知道（通常是通过痛苦教训得到的）结构问题是良好软件的核心，而忽视结构会导致昂贵的混乱。\n\
  \n### 3.3 Expressions\n\n程序最基本的构建单元是表达式。表达式从若干操作数计算出一个值。最简单的表达式就是一个字面量值，例如 `10`、`'a'`、`3.14`\
  \ 或 `\"Norah\"`。\n\n变量名也是表达式。变量代表它所命的对象。考虑：\n\n```\nint length = 20;           \
  \       // 字面量整数（用于初始化变量）\nint width = 40;\nint area = length*width;   // 乘法\n```\n\
  \n在这里，字面量 `20` 和 `40` 被初始化变量 `length` 和 `width`。然后，`length` 和 `width` 相乘；也就是说，我们乘以\
  \ `length` 和 `width` 中找到的值。在这里，`length` 只是“名为 `length` 的对象的值”的简写。再考虑：\n\n```\nlength\
  \ = 99;      // 将 99 赋值给 length\n```\n\n\n\n\n\n在这里，作为赋值的左操作数，`length` 意味着“名为 `length`\
  \ 的对象”，因此该赋值表达式被读作“将 `99` 放入名为 `length` 的对象中”。我们区分了赋值或初始化左侧使用的 `length`（`length`\
  \ 的**左值** *lvalue*：“名为 `length` 的对象”）与赋值或初始化右侧使用的 `length`（`length` 的**右值** *rvalue*：“名为\
  \ `length` 的对象的值”，或简单称为“`length` 的值”）。在这种背景下，我们发现将变量可视化为一个由其名称标记的盒子是很有用的（§2.2, §2.5）：\n\
  \n![一个数据表，列标记为 'int'，行标记为 'length'。值 '99' 被输入在 'length' 行和 'int' 列交处的单元格中。](img/f0055-01.jpg)\n\
  \n也就是说，`length` 是一个类型为 `int` 且包含值 `99` 的对象的名称。有时（作为左值）`length` 指的是盒子（对象），有时（作为右值）`length`\
  \ 指的是盒子中的值。\n\n我们可以通过使用运算符（例如 `+` 和 `*`）像我们所习惯的那样构造更复杂的表达式。需要时，我们可以使用括号对表达式进行分组：\n\
  \n点击此处查看代码图像\n\n```cpp\nint perimeter = (length+width)*2;              // 先加后乘\n\
  ```\n\n如果没有括号，我们就得写成：\n\n点击此处查看代码图像\n\n```cpp\nint perimeter = length*2+width*2;\n\
  ```\n\n这很笨拙，而且我们甚至可能犯下这种错误：\n\n点击此处查看代码图像\n\n```cpp\nint perimeter = length+width*2;\
  \                              // 将 width*2 加到 length 上\n```\n\n最后一个错误是逻辑上的，编译器无法发现它。编译器看到的只是一个名为\
  \ `perimeter` 的由有效表达式初始化的变量。如果该表达式的结果是无意义的，那是你的问题。你知道周长的数学定义，但编译器不知道。\n\n适用于运算符优先级的通常数学规则，因此\
  \ `length+width*2` 意味着 `length+(width*2)`。同样，`a*b+c/d` 意味着 `(a*b)+(c/d)` 而不是 `a*(b+c)/d`。运算符优先级表请参见\
  \ cppreference (§0.4.1)）。\n\n使用括号的第一条规则就是：“如果不确定，就加括号”，但请尽可能学习足够的表达式，以便你不会对 `a*b+c/d`\
  \ 产生疑问。过度使用括号（如 `(a*b)+(c/d)`）会降低代码的可读性。\n\n你为什么要关心可读性？因为你和可能还有其他人会阅读你的代码。丑的代码会减慢阅读和理解。丑的代码不仅难读，而且更难写对。丑的代码往往隐藏着逻辑错误。不要编写荒谬复杂的表达式，例如：\n\
  \n点击此处查看代码图像\n\n```cpp\na*b+c/d*(e/-f/g)/h+7           // 太复杂了\n```\n\n并始终尝试选择有意义的名字。\n\
  \n### 3.3.1 常表达式\n\n程序通常使用大量常量。例如，几何程序可能会使用 `pi`，英寸到厘米转换程序将使用像 `2.54` 这样的转换因子。显然，我们希望这些常量使用有意义的名字（正如我们对\
  \ `pi` 所做的；我们没有说 `3.14159`）。同样，我们不希望意外更改这些常量。因此，C++ 提供了符号常量的概念，即一个初始化后无法再赋予新值的具名对象。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\nconstexpr double pi = 3.14159;\npi = 7;                \
  \                 // 错误：常量赋值\ndouble c = 2*pi*r;              // OK：我们只是读取了 pi；没有尝试改变它\n\
  ```\n\n此类常量有助于保持代码的可读性。如果你在某些代码中看到 `3.14159`，可能会认出它是 `pi` 的近似值，但你能认出 `299792458`\
  \ 吗？此外，如果有人要求你修改代码使用 12 位精度的 `pi` 进行计算，你可以在代码中搜索 `3.14`，但如果有人不留心地使用了 `22/7`，你可能找不到它。最好更改\
  \ `pi` 的定义以使用更合适的值：\n\n点击此处查看代码图像\n\n```cpp\nconstexpr double pi = 3.14159;\n```\n\
  \n`constexpr` 变量有助于保持代码的可读性。如果你在某些代码中看到 `3.14159`，可能会认出它是 `pi` 的近似值，但你能认出 `299792458`\
  \ 吗？此外，如果有人要求你修改代码使用 12 位精度的 `pi` 进行计算，你可以在代码中搜索 `3.14`，但如果有人不留心地使用了 `22/7`，你可能找不到它。最好更改\
  \ `pi` 的定义以使用更合适的值：\n\n### 3.3.2 运算符\n\n我们刚刚使用了简单的运算符。然而，当你想要表达复杂的操作时，很快就会更多。大多数运算符都是惯例，所以我们在需要时解释。这里是一些常见的运算符：\n\
  \n| 示例 | 名称 | 注释 |\n| :--- | :--- | :--- |\n| `lval=a` | 赋值 | 不要与 `==` 混淆 |\n| `++lval`\
  \ | 前置增 | 增并使用增后的值 |\n| `--lval` | 前置减 | 减并使用减后的值 |\n| `!a` | 取反 | 结果为 `bool` |\n\
  | `-a` | 一元负 | |\n| `a*b` | 乘 | |\n| `a/b` | 除 | |\n| `a%b` | 取模（求余数） | 仅用于整数类型\
  \ |\n| `a+b` | 加 | |\n| `a-b` | 减 | |\n| `out<<b` | 将 `b` 写入 `out` | `out` 是 `ostream`\
  \ |\n| `in>>b` | 从 `in` 读入 `b` | `in` 是 `istream` |\n| `lval*=a` | 复合赋值 | `lval\
  \ = lval*a`；也用于 `/`、`%`、`+`、`-` |\n| `f(a)` | 函数调用 | 将 `a` 作为参数传递给 `f` (§3.5) |\n\
  | `f<T>(a)` | 函数模板调用 | 将 `a` 作为参数传递给 `f<T>` (§21.2) |\n| `[](a){S}` | Lambda 表达式\
  \ | 创建一个 `a` 为参数的函数对象 (§21.2.3) |\n\n当运算符修改操作数时，我们使用了 `lval`（lvalue 的缩写，即可以出现在赋值左侧的值）。\n\
  \n| 示例 | 名称 | 注释 |\n| :--- | :--- | :--- |\n| `a<b` | 小于 | 结果为 `bool` |\n| `a<=b`\
  \ | 小于等于 | 结果为 `bool` |\n| `a>b` | 大于 | 结果为 `bool` |\n\n\n\n\n\n| `a>=b` | 大于或等于\
  \ | 结果为 `bool` |\n| `a==b` | 等于 | 不要与 `=` 混淆 |\n| `a!=b` |等于 | 结果为 `bool` |\n| `a&&b`\
  \ | 逻辑与 | 结果为 `bool` |\n| `a||b` | 逻辑或 | 结果为 `bool` |\n| `T{a}` | 宽转换 | 结果是 `a`\
  \ 转换为类型 `T` 的值 |\n\n请参考 cppreference (§0.4.1) 获取完整的运算符列表。关于逻辑运算符 `&&`（与）、`||`（或）和\
  \ `!`（非）的示例，请参阅 §4.5.1、 §6.7 以及 §9.3.1。\n\n## XX\n\n注意 `a<b<c` 意味着 `(a<b)<c`，并且\
  \ `a<b` 评估为布尔值：`true` 或 `false`。因此，`a<b<c` 将等于 `true<c` 或 `false<c`。特别是，`a<b<c`\
  \ 并不意味着“`b` 是否在 `a` 和 `c` 之间？”，正如很多人天地（但并非没有理由）假设的那样。因此，`a<b<c` 基本是一个无用的表达式。不要编写此类包含两个比较操作的表达式，如果你在别人的代码中发现这样的表达式，要非常警惕——它极可能是一个错误。\n\
  \n增量至少可以用三种方式表示：\n\n```\n++a\na+=1\na=a+1\n```\n\n## AA\n\n我们应该使用哪种符号？为什么？我们更倾向于第一种版本\
  \ `++a`，因为它更直接地表达了增加的思想。它表达了我们想做什么（增量 `a`），而不是怎么做（给 `a` 加 `1` 然后将结果写入 `a`）。通常情况下，如果程序中表达某事的方式比另一种方式更直接地表达意图，那么这种方式就更好。结果更简洁，读者也更容易理解。如果我们写\
  \ `a=a+1`，读者可能会很容易怀疑我们是否真的想加 `1`。也许我们只是误打了 `a=b+1`、`a=a+2` 甚至是 `a=a−1`；而使用 `++a`\
  \ 产生此类疑虑的机会要少得多。请注意，这是一个关于可读性和正确性的逻辑论证，而不是关于效率的论证。与大众认知相反，当 `a` 是内置类型之一时，现代编译器倾向于为\
  \ `a=a+1` 和 `++a` 生成完全相同的代码。同样地，我们更倾向于使用 `a*=scale` 而不是 `a=a*=scale`。\n\n### 3.4\
  \ 语句\n\n表达式使用类似 §3.3 中提到的运算符从一组操作数计算出一个值。当我们想要产生多个值时该怎么办？当我们想要多次执行某操作时怎么办？当我们想要在备选项中进行选择时怎么办？当我们想要获取输入或产生输出时怎么办？在\
  \ C++ 中，像许多语言一样，你使用称为*语句*（statements）的语言结构来表达这些内容。\n\n到为止，我们已经看到了两种语句：表达式语句和声明。表达式语句简单的表达式后面跟着一个分号。例如：\n\
  \n```\na=b;\n++c;\n```\n\n这是两个表达式语句。注意赋值运算符 `=` 是一个运算符，因此 `a=b` 是一个表达式，我们需要终止分号来使\
  \ `a=b;` 成为一个语句。为什么我们需要这些分号？原因很大程度上是技术性的。考虑：\n\n点击此处查看代码图像\n\n```\na=b\n++ c;  \
  \          // 语法错误：缺少分号\n```\n\n如果没有分号，编译器不知道我们是指 `a=b++; c;` 还是 `a=b; ++c;`。这类问题并不限于计算机语言；考虑感叹句“人吃虎（man\
  \ eating tiger）！”谁在吃谁？标点符号的存在是为了消除此类问题：“人吃的虎（man-eating tiger）！”\n\n当语句连续出现时，计算机按照它们编写的顺序执行它们。例如：\n\
  \n```\nint a = 7;\ncout << a << '\\n';\n```\n\n这里，带有初始化的声明在输出表达式语句之前执行。\n\n通常，我们希望语句能产生某种效果。没有效果的语句通常是无用的。例如：\n\
  \n点击此处查看代码图像\n\n```\n1+2;          // 执行加法，但不使用和\na*b;          // 执行乘法，但不使用乘积\n\
  ```\n\n这种没有效果的语句通常是逻辑错误，编译器经常会针对它们发出警告。因此，表达式语句通常是赋值语句、I/O 语句或函数调用。\n\n我们还会提到另一种类型的语句：“空语句”（empty\
  \ statement）。考虑这段代码：\n\n```\nif (x == 5);\n          y = 3;\n```\n\n## XX\n\n这看起来像是一个错误，而且几乎肯定是。第一行的\
  \ `;` 不应该出现在那里。但遗憾的是，这是 C++ 中一个合法的结构。它被称为*空语句*，即不执行任何操作的语句。运行这段代码会发生什么？编译器将测试 `x`\
  \ 是否等于 `5`。如果条件为真，将执行后续的空语句，不产生效果。然后程序像之前一样继续给 `y` 赋值 `3`（除非你本来就想这样做）。\n\n下一节将介绍用于改变评估顺序的语句，以便我们能够实现比按编写顺序执行更有趣的计算。\n\
  \n### 3.4 选择\n\n在程序中，就像在生活中一样，我们经常需要在选项之间进行选择。在 C++ 中，这通过使用 **if** 语句或 **switch**\
  \ 语句来实现。\n\n### 3.4.1 if 语句\n\n选择最简单的形式是 **if** 语句，它在两个选项之间进行选择。例如：\n\n点击此处查看代码图像\n\
  \n```\nint a = 0;\nint b = 0;\ncout << \"Please enter integers\\n\";\ncin >> a >>\
  \ b;\n\nif (a<b)     // 条件\n         cout << a << \" is smaller than \" << b <<\
  \ '\\n';                     // 第一种选项（条件为真）\nelse\n         cout << a << \" is larger\
  \ or equal to \" << b << '\\n';    // 第二种选项（条件为假）\n```\n\n## CC\n\n**if** 语句在两个选项之间做出选择。如果它的条件为真，则执行第一个语句；否则，执行第二个语句。这个概念是简单的。大多数基础的编程特性也是如此。事实上，编程语言中的大多数基础设施只是你在小学甚至更早学过的东西的新表示法。例如，你在幼儿园时可能被告诉，在红绿灯路马路时，必须等灯变绿：“如果交通灯是绿色的，走”以及“如果交通灯是红色的，等”。在\
  \ C++ 中，这变成了类似于\n\n```cpp\nif (traffic_light==green)\n         go();\n```\n\n和\n\
  \n```cpp\nif (traffic_light==red)\n         wait();\n```\n\n所以，基本概念是简单的，但也容易以过于简单的方式使用\
  \ **if** 语句。考虑这段代码有什么问题：\n\n点击此处查看代码图像\n\n\n\n\n\n```cpp\n// 将英寸转换为厘米，或将厘米转换为英寸\n\
  // 后缀 ’i’ 或 ’c’ 表示输入的单位\n\nconstexpr double cm_per_inch = 2.54;             // 每英寸的厘米数\n\
  double length = 1;                                               // 以英寸或厘米为单位长度\n\
  char unit = ' ';\ncout << \"Please enter a length followed by a unit (c or i):\\\
  n\";\ncin >> length >> unit;\nif (unit == 'i')\n         cout << length << \"in\
  \ == \" << length*cm_per_inch << \"cm\\n\";\nelse\n         cout << length << \"\
  cm == \" << length/cm_per_inch << \"in\\n\";\n```\n\n实际上，这个程序的运行方式正如广告所示：输入 `1i`，你会得到\
  \ `1in == 2.54cm`；输入 `2.54c`，你会得到 `2.54cm == 1in`。试试看；这是一个很好的练习。\n\n问题在于我们没有对坏输入进行测试。程序假设用户输入的是正确的。`unit==’i’`\
  \ 区分了单位为 `'i'` 的情况以及所有其他情况。它从不寻找 `'c'`。\n\n如果用户输入 `15f`（代表英尺）“只是看看会发生什么”呢？条件 (`unit\
  \ == ’i’`) 将失败，程序将执行 `else` 部分（第二种备选），将厘米转换为英寸。显然，这并不是我们输入 `'f'` 时想要的结果。\n\n## AA\n\
  \n我们必须始终用“坏”输入来测试程序，因为最终会有人——无论有意还是无意——输入坏输入。即使用户不这样做，程序也应该表现得合理。\n\n这是 `if` 语句的改进版本：\n\
  \n点击此处查看代码图像\n\n```cpp\nif (unit == 'i')\n         cout << length << \"in == \"\
  \ << length*cm_per_inch << \"cm\\n\";\nelse if (unit == 'c')\n         cout << length\
  \ << \"cm == \" << length/cm_per_inch << \"in\\n\";\nelse\n         cout << \"Sorry,\
  \ I don't know a unit called '\" << unit << \"'\\n\";\n```\n\n我们首先测试 `unit==’i’`，然后测试\
  \ `unit==’c’`，如果两者都不是，我们就说“对不起”。这看起来像是我们使用了“`else−if`-statement`”，但在 C++ 中并没有这种东西。相反，我们组合了两个\
  \ `if`-语句。`if` 语句的通用形式是：\n\n```cpp\nif ( expression )\n     statement\nelse\n  \
  \   statement\n```\n\n也就是说，一个 `if`，后面跟着括号里的一个 `expression`，接着是一个 `statement`，然后是\
  \ `else`，最后是一个 `statement`。我们将一个 `if` 语句作为另一个 `if` 语句的 `else` 部分：\n\n```cpp\nif\
  \ ( expression )\n      statement\nelse if ( expression )\n      statement\nelse\n\
  \      statement\n```\n\n对于我们这个给出这种结构的程序：\n\n点击此处查看代码图像\n\n```cpp\nif (unit == 'i')\n\
  \          ...                      // 第 1 种备选\nelse if (unit == 'c')\n        \
  \  ...                      // 第 2 种备选\nelse\n          ...                    \
  \  // 第 3 种备选\n```\n\n## AA\n\n通过这种方式，我们可以编写任意复杂的测试，并为每种备选关联一个语句。然而，请记住，代码的理想之一是简单，而不是复杂。你不需要通过编写最复杂的程序来证明你的聪明。相反，你通过编写完成任务的最简单代码来证明你的能力。\n\
  \n## 尝试一下\n\n使用上面的示例作为模型，编写一个将日元（`'y'`）、克朗（`'k'`）和英镑（`'p'`）转换为美元的程序。如果你喜欢真实感，可以在网上找到汇率。\n\
  \n### 3.4.1.2 switch-语句\n\n实际上，将 `unit` 与 `'i'` 以及 `'c'` 进行比较是最常见的选择形式之一的示例：基于值与多个常量进行比较的选择。这种选择如此常见，以至于\
  \ C++ 为其提供了一个专门的语句：`switch` 语句。我们可以将单位示例中的选择部分重写为：\n\n点击此处查看代码图像\n\n```cpp\nswitch\
  \ (unit) {\ncase 'i':\n         cout << length << \"in == \" << length*cm_per_inch\
  \ << \"cm\\n\";\n         break;\ncase 'c':\n         cout << length << \"cm ==\
  \ \" << length/cm_per_inch << \"in\\n\";\n         break;\ndefault:\n         cout\
  \ << \"Sorry, I don't know a unit called '\" << unit << \"'\\n\";\n         break;\n\
  }\n```\n\n## AA\n\n`switch` 语句的语法虽然过时，但仍比嵌套的 `if`-语句清晰，特别是当我们与许多常量进行比较时。`switch`\
  \ 后面括号中呈现的值与一组常量进行比较。每个常量都作为 `case` 标签的一部分呈现。如果该值等于 `case` 标签中的常量，则选择该 case 的语句。每个\
  \ `case` 都由 `break` 终止。如果值不匹配任何 `case` 标签，则选择 `default` 标签。你不需要提供 `default`，但这样做是个好主意。\n\
  \n### 3.4.1.3 技术细节\n\n关于 `switch` 语句有一些技术细节：\n\n1. `switch` 的值必须是整数、字符或枚举。特别是，你不能对\
  \ `string` 或浮点值进行 switch。\n2. `case` 标签必须是常量表达式。特别是，你不能在 `case` 标签中使用变量。\n3. 你不能为两个\
  \ `case` 标签使用相同的值。\n4. 你可以使用多个 `case` 标签对应同一个 `case`。\n5. 不要忘记用 `break` 结束每个 `case`。遗憾的是，如果你忘记了，编译器可能不会警告你。\n\
  \n例如：\n\n点击此处查看代码图像\n\n```cpp\n// 你只能对整数进行 switch：\n\ncout << \"Do you fish?\";\n\
  string s;\ncin >> s;\n\nswitch (s) {     // 错误：值必须是整数\ncase \"no\":\n         //\
  \ ...\n         break;\ncase \"yes\":\n         // ...\n         break;\n}\n```\n\
  \n针对一组常量生成优化后的代码。对于较大的常量集，这通常比 `if`-语句更高效。然而，这意味着 `case` 标签值必须是唯一的且是常量。在 C++ 中，这些必须在编译时已知。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\n// case 标签必须是唯一的且常量：\n\nint y = 'y';          // 这会导致问题\n\
  constexpr char n = 'n';\n\ncout << \"Do you fish?\\n\";\nchar a = 0;\ncin >> a;\n\
  \nswitch (a) {\ncase n:\n         // ...\n         break;\ncase y:             //\
  \ 错误：case 标签中使用变量\n         // ...\n         break;\ncase 'n':           // 错误：case\
  \ 标签重复（n 的值为 ’n’）\n         // ...\n         break;\ndefault:\n         // ...\n\
  \         break;\n}\n```\n\n通常你希望对 switch 中的一组值执行相同的动作。重复该动作很冗余，因此你可以用一组 `case`\
  \ 标签来标记同一个动作。例如：\n\n点击此处查看代码图像\n\n```cpp\n// 你可以使用多个 case 标签标记一个语句：\n\ncout << \"\
  Please enter a digit\\n\";\nchar a = 0;\ncin >> a;\n\nswitch (a) {\ncase '0': case\
  \ '2': case '4': case '6': case '8':\n         cout << \"is even\\n\";\n       \
  \  break;\ncase '1': case '3': case '5': case '7': case '9':\n         cout << \"\
  is odd\\n\";\n         break;\ndefault:\n         cout << \"is not a digit\\n\"\
  ;\n         break;\n}\n```\n\n## XX\n\n`switch` 语句最常见的错误是忘记用 `break` 终止 `case`。例如：\n\
  \n点击此处查看代码图像\n\n\n\n\n\n```cpp\nswitch (unit) {\ncase 'i':\n         cout << length\
  \ << \"in == \" << length*cm_per_inch << \"cm\\n\";\ncase 'c':\n         cout <<\
  \ length << \"cm == \" << length/cm_per_inch << \"in\\n\";\n}\n```\n\n遗憾的是，编译器会接受这种写法。当你完成\
  \ case `'i'` 的时候，你会直接“穿透”（fall through）进入 case `'c'`，因此如果你输入 `2i`，程序将输出：\n\n```\n\
  2in == 5.08cm\n2cm == 0.787402in\n```\n\n我已经警告过你了！\n\n在需要穿透到下一个 case 的少数情况下，你也可以也应该这样做：\n\
  \n点击此处查看代码图片\n\n```cpp\nswitch (check) {\ncase checked:\n         if (val<0)\n \
  \                 val=0;\n         [[fallthrough]];\ncase unchecked:\n         //\
  \ ... use val ...\n         break;\n}\n```\n\n`[[fallthrough]]` 是一个让我们的意图显式化的*属性*。\n\
  \n### 尝试一下\n\n重写你之前**尝试一下**中的货币转换器程序，使用 `switch` 语句。添加一个对瑞士郎的转换。哪个版本的程序更容易编写、理解和修改？为什么？\n\
  \n### 3.4.2 迭代\n\n我们很少只做某件事一次。因此，编程语言提供了方便的方法来多次执行操作。对一系列对象执行相同的操作被称为*迭代*。\n\n###\
  \ 3.4.2.1 while-语句\n\n作为迭代的一个示例，考虑第一个运行在存储程序计算机上的第一个程序（EDSAC）。它是由 David J. Wheeler\
  \ 于 1949 年 5 月 6 日在英国剑桥大学计算机实验室编写并运行的，用于计算并打印如下的简单平方列表：\n\n```\n0      0\n1    \
  \  1\n2      4\n3      9\n4      16\n   ...\n98     9604\n99     9801\n```\n\n每行是一个数字，后面跟着一个“制表符”字符（`'\\\
  t'`），然后是该数字的平方。C++ 版本如下：\n\n点击此处查看代码图片\n\n```cpp\nint main()\n         // calculate\
  \ and print a table of squares 0-99\n{\n         int i = 0;                    \
  \ // 从 0 开始\n         while (i<100) {\n                 cout << i << '\\t' << square(i)\
  \ << '\\n';\n                 ++i;                    // 增加 i（即 i 变为 i+1）\n    \
  \     }\n}\n```\n\n符号 `square(i)` 意味着 `i` 的平方。稍后我们将解释如何让它这种含义（§3.5）。\n\n不，这个第一个现代程序实际上并不是用\
  \ C++ 编写的，但逻辑所示：\n\n* 我们从 `0` 开始。\n* 我们检查是否已经达到了 `100`，如果是，则我们结束。\n* 否则，我们打印该数字及其平方，用制表符（`'\\\
  t'`）分隔，增加该数字，然后重试。\n\n显然，为了做到这一点我们需要：\n\n* 一种重复某些语句的方法（*循环*）\n* 一个用来跟踪我们进入循环次数的变量（*循环变量*或*控制变量*），在这里在这里是名为\
  \ `i` 的 `int` 类型\n* 循环变量的初始化器，在这里是 `0`\n* 一个终止准则，在这里是我们想要执行循环 100 次\n* 每次循环时要执行的操作（循环的*体体*）\n\
  \n我们使用的语言结构是 `while` 语句。只需遵循其独特的关键字 `while`，它有一个位于“顶部”的条件，后面跟着它的体体：\n\n点击此处查看代码图片\n\
  \n```cpp\nwhile (i<100)               // 测试循环变量 i 的循环条件\n{\n         cout << i <<\
  \ '\\t' << square(i) << '\\n';\n         ++i;                    // 增加循环变量 i\n}\n\
  ```\n\n循环体是一个块（由花括号分隔），它写出表格的一行并增加循环变量 `i`。我们每次通过循环时，都首先测试 `i<100`。如果是，说明我们还没有完成，可以执行循环体。如果我们已经到达末尾，即\
  \ `i` 等于 `100`，我们就离开 `while` 语句并执行后续内容。在这个程序中，程序的末尾就是后续内容，所以我们离开了程序。\n\n`while`\
  \ 语句的循环变量必须在 `while` 语句之外（之前）定义并初始化。如果我们没有定义它，编译器将给我们我们一个错误。如果我们定义了它，但未能初始化它，大多数编译器会警告我们，说诸类似“局部变量\
  \ `i` 未设置”之的话，但如果我们坚持，它们也愿意让我们执行程序。不要坚持！当编译器警告未初始化的变量时，它们几乎是正确的。未初始化的变量是错误的常见来源。在这种情况下，我们写了：\n\
  \n```cpp\nint i = 0;\n```\n\n### 3.4.2.2 块\n\n循环体是一个块（由花括号分隔），它写出表格的一行并增加循环变量 `i`。我们每次通过循环时，都首先测试\
  \ `i<100`。如果是，说明我们还没有完成，可以执行循环体。如果我们已经到达末尾，即 `i` 等于 `100`，我们就离开 `while` 语句并执行后续内容。在这个程序中，程序的末尾就是后续内容，所以我们离开了程序。\n\
  \n`while` 语句的循环变量必须在 `while` 语句之外（之前）定义并初始化。如果我们没有定义它，编译器将给我们我们一个错误。如果我们定义了它，但未能初始化它，大多数编译器会警告我们，说诸类似“局部变量\
  \ `i` 未设置”之的话，但如果我们坚持，它们也愿意让我们执行程序。不要坚持！当编译器警告未初始化的变量时，它们几乎是正确的。未初始化的变量是错误的常见来源。在这种情况下，我们写了：\n\
  \n```cpp\nint i = 0;\n```\n\n### 3.4.2.3 for-语句\n\n遍历数字序列是非常常见的，因此 C++ 与大多数其他语言都有其特殊的语法。`for`\
  \ 语句类似于 `while` 语句，但控制变量的管理集中在容易看到的地方。我们可以把“第一个程序”写成：\n\n```cpp\nint main()\n  \
  \       // calculate and print a table of squares 0-99\n{\n         for (int i =\
  \ 0; i<100; ++i)\n                 cout << i << '\\t' << square(i) << '\\n';\n}\n\
  ```\n\n这意味着“从 `i=0` 开始执行体，在每次执行体后增加 `i`，直到我们达到 `100`。”`for` 语句总是等同于某个 `while` 语句。在这种情况下\n\
  \n点击此处查看代码图片\n\n```cpp\nfor (int i = 0; i<100; ++i)\n         cout << i << '\\t'\
  \ << square(i) << '\\n';\n```\n\n意味着\n\n点击此处查看代码图片\n\n```cpp\n{\n         int i\
  \ = 0;                                // for-语句初始化器\n         while (i<100) {  \
  \                                                   // for-语句条件\n              \
  \   cout << i << '\\t' << square(i) << '\\n';          // for-语句体\n            \
  \     ++i;                                                               // for-语句增量\n\
  \         }\n}\n```\n\n有些初学者喜欢 `while` 语句，有些初学者喜欢 `for` 语句。然而，当循环可以定义为具有简单初始化器、条件和增量操作的\
  \ `for` 语句时，使用 `for` 语句会产生更容易理解和更易维护的代码。只有在不是这种情况的情况下才使用 `while` 语句。\n\n永远不要在 `for`\
  \ 语句体内部修改循环变量。这会违反每个读者对循环正在执行内容的合理假设。考虑：\n\n点击此处查看代码图片\n\n\n\n\n\n```\n// bad code:\n\
  \nfor (int i = 0; i<100; ++i) {           // for i in the 0:100) range\n       \
  \  cout << i << '\\t' << square(i) << '\\n';\n         ++i;                    \
  \                 // 这里发生了什么？这闻起来像是个错误！\n}\n```\n\n任何看到这个循环的人都会合理地假设循环体会被执行 100\
  \ 次。然而，事实并非如此。循环体中的 `++i` 确保了 `i` 在每次循环时都增加了了两次，因此我们只为 `i` 的 50 个偶数值得到输出。如果我们看到这样的代码，我们会认为它是一个错误，可能是由于从\
  \ `while` 语句粗略转换而导致的。如果你想每次递增 2，请直接说明：\n\n[点击此处查看代码图像\n\n```\n// 计算并打印 0:100) 范围内偶数的平方表：\n\
  \nfor (int i = 0; i<100; i+=2)\n         cout << i << '\\t' << square(i) << '\\\
  n';\n```\n\n**AA**\n\n请注意，更整洁、更明确的版本反而比混乱的版本要短。这是很典型的。\n\n### 尝试一下\n\n重写上一个 **TRY\
  \ THIS** 中的字符值示例，使用 `for` 语句。然后修改你的程序，也写出大写字母和数字的整数值表格。\n\n还有一种更简单的“范围循环”（range-for-loop）用于遍历数据集合，例如\
  \ `vector`；请参见 [§3.6。\n\n### 3.5 函数\n\n在上面的程序中，`square(i)` 是什么？它是函数调用。具体来说，它是对名为\
  \ `square` 的函数带有参数 `i` 调用。*函数*是一个命名的语句序列。函数可以返回一个结果（也称为 `return`-value）。标准库提供了许多有用的函数，例如我们在\
  \ §2.4 中使用的平方根函数 `sqrt()`。然而，我们也会自己编写很多函数。这里是 `square` 一个可能的定义：\n\n```\nint square(int\
  \ x)\n         // 返回 x 的平方\n{\n         return x*x;\n}\n```\n\n该定义的第一行告诉我们这是一个函数（这就是括号的含义），它命名为\
  \ `square`，它接受一个 `int` 类型参数（在这里称为 `x`），并且它返回一个 `int`（结果的类型在函数声明中置前）；也就是说，我们可以这样使用它：\n\
  \n点击此处查看代码图像\n\n```\ncout << square(2) << ' ' << square(10) << '\\n';          \
  \    // 打印 4 100\n```\n\n我们不必使用函数调用的的结果，但我们必须给函数提供它所需的精确参数。考虑：\n\n点击此处查看代码图像\n\n\
  ```\nsquare(2);                           // 可能是一个错误：未使用的返回值\nint v1 = square();\
  \               // 错误：缺少参数\nint v2 = square;                 // 错误：缺少括号\nint v3\
  \ = square(1,2);          // 错误：参数过多\nint v4 = square(\"two\");     // 错误：参数类型错误；预期为\
  \ int\n```\n\n**CC**\n\n许多编译器会警告未使用的结果，并且所有编译器都会如所示给出错误。你可能会认为计算机应该足够聪明，能够看出通过字符串\
  \ `\"two\"`，你实际上是指整数 `2`。然而，C++ 编译器故意并不那么聪明。编译器的任务是在验证你的代码根据 C++ 的定义是良好的之后，准确地执行你要求它做的事情。如果编译器猜测你的意图，它偶尔会猜错，而你——或者你程序的用户——会感到非常恼火。预测你的代码将做什么已经足够困难了，不需要编译器通过“猜你的心思”来提供所谓的“帮助”。\n\
  \n*函数体*（function body）是 (§3.4.2.2) 实际执行工作的块。\n\n点击此处查看代码图像\n\n```\n{\n         return\
  \ x*x;      // 返回 x 的平方\n}\n```\n\n对于 `square` 来说，工作是轻而易举的：我们产生参数的平方并将其作为结果返回。在\
  \ C++ 中说这句话比用英语说更容易。这对于简单的想法来说很典型。毕竟，编程语言的设计初衷就是简单、精确地表达此类简单的想法。\n\n*函数定义*（function\
  \ definition）的语法可以描述如下：\n\n```\nfunction-definition:\n     type-identifier function-identifier\
  \ ( parameter-list ) function-body\n```\n\n也就是说，先是一个类型（返回类型），接着是一个标识符（函数名），然后是括号内的参数列表，最后是函数体（要执行的语句）。函数所需的所需的参数列表被称为*参数列表*（parameter\
  \ list），其元素被称为*参数*（parameters）或*形式参数*（formal parameters）。参数列表可以是空的，我们使用 `void`（意思是“无”）作为返回类型。例如：\n\
  \n点击此处查看代码图像\n\n```\nvoid sorry() // 不接受参数；不返回内容\n{\n         cout << \"Sorry\\\
  n\";\n}\n```\n\n### 3.5.1 为什么要费心使用函数？\n\n**CC**\n\n我们在以下情况下定义函数：\n\n*   使计算分离\n\
  *   使程序更清晰（通过命名计算过程）\n*   使函数在多个处使用可能\n*   便于测试\n\n在学习过程中，我们将看到每个原因的许多示例。注意，现实世界的程序使用成千上万个函数，有些数百个。显然，如果这些部分没有被清晰地分离和命名，我们永远无法编写或理解此类程序。在\
  \ §7.4 中，我们处理了许多函数的技术细节，但现在我们只给另一个例子。\n\n如果我们想让“第一个程序”(§3.4.2.3) 中 `main()` 循环变得真正简单，我们可以这样写：\n\
  \n点击此处查看代码图像\n\n```\nvoid print_square(int v)\n{\n         cout << v << '\\t' <<\
  \ v*v << '\\n';\n}\n\nint main()\n{\n         for (int i = 0; i<100; ++i)\n    \
  \             print_square(i);\n}\n```\n\n我们不是使用了使用 `print_square()` 版本吗？那个版本并没有比使用\
  \ `square()`的版本显著简单，而且注意：\n\n*   `print_square()` 是一个相当专门的函数，我们无法预期以后还能使用它，而 `square()`\
  \ 是一个显而易见的候选函数\n*   `square()` 几乎不需要文档，而 `print_square()` 显然需要解释\n\n这两种方法的根本原因是\
  \ `print_square()` 执行了两个逻辑上分离的操作：\n\n*   它打印。\n*   它计算平方。\n\n**AA**\n\n如果每个函数都执行一个逻辑操作，程序通常会更容易编写和理解。基本上，`square()`\
  \ 版本是更好的设计。\n\n\n\n\n最后，为什么在问题的第一个版本中我们使用 `square(i)` 而不是简单的 `i*i` 呢？嗯，函数的目的之一是通过将复杂的计算分离为命名函数来简化代码，而对于\
  \ 1949 年版本的程序，并没有直接实现“乘法”的硬件。因此，在 1949 年版本的程序中，`i*i` 实际上是一个相当复杂的计算，类似于你用纸笔手动计算。此外，该原始版本的作者大卫·惠勒（David\
  \ Wheeler）是现代计算函数（当时称为子程序）的发明者，所以在这里使用它看起来很合适。\n\n### 尝试一下\n\n在不使用乘法运算符的情况下实现 `square()`；即通过重复加法来实现\
  \ `x*x`（初始化变量 `result` 为 `0`，并向其累加 `x` 次 `x`）。然后使用该 `square()` 运行某个版本的“第一个程序”。\n\
  \n### 3.5.2 函数声明\n\n你是否注意到，调用函数所需的所有信息都在其定义的第一行中？例如：\n\n```\nint square(int x)\n\
  ```\n\n基于此，我们知道足够的信息来说：\n\n```cpp\nint x = square(44);\n```\n\n我们并不真的需要查看函数体。在实际程序中，我们通常都不想看函数体。我们为什么要看标准库\
  \ `sqrt()` 函数的体呢？我们知道它计算的是参数的平方根。我们为什么要看我们自己的 `square()` 函数的体呢？当然，我们可能只是好奇。但在几乎大多数时候，我们只是想知道如何调用函数——看到定义只会分散我们的注意力。幸运的是，C++\
  \ 提供了一种独立于完整函数定义提供该信息的方法。它被称为*函数声明*：\n\n点击此处查看代码图像\n\n```\nint square(int);    \
  \                // square 的声明\ndouble sqrt(double);          // sqrt 的声明\n```\n\
  \n注意末尾的分号。在函数声明中，使用分号代替了相应的函数定义中使用的函数体：\n\n点击此处查看代码图像\n\n```\nint square(int x)\
  \                 // square 的定义\n{\n         return x*x;\n}\n```\n\n所以，如果你只想使用一个函数，你只需要写下——或更常见的\
  \ `import` 或 `#include`——它的声明。函数定义可以在其他地方。我们将在 §7.3–§7.7.1 中讨论那个“其他地方”可能在哪里。这种声明与定义之间的区别在较大的程序中变得至关重要，在这些程序中，我们使用声明让大部分代码处于视野之外，以便我们一次集中于程序的某一部分\
  \ (§3.2)。\n\n### 3.6 vector\n\n为了对程序进行几乎任何有趣的操作，我们需要一组数据来处理。例如，我们可能需要一个电话号码列表、一个足球队成员列表、一个课程列表、过去一年读的书单、一个下载歌曲目录、一套汽车支付方案、一份未来下周的天气预报列表、不同\
  \ Web 商店的相机价格列表等。这些可能性字面上是无尽的，因此在程序中无处不在。我们将看到存储数据集的各种方法（各种数据容器；参见第 19 章和第 20 章）。这里我们将从存储数据最简单、也是最有用的方法之一开始：`vector`。\n\
  \n#### CC\n\n`vector` 仅仅是一组可以通过索引访问的元素序列。例如，这里有一个名为 `v` 的 `vector`：\n\n![将 vector\
  \ 转换为元素序列的数据表](img/f0072-01.jpg)\n\n也就是说，第一个元素的索引为 0，第二个索引为 1，依此类推。我们通过在 `vector`\
  \ 名称后紧跟元素的索引来引用元素，所以这里 `v[0]` 的值是 `5`，`v[1]` 的值是 `7`，依此类推。`vector` 的索引始终从 0 开始并每次增加\
  \ 1。这看起来很熟悉：标准库的 `vector` 仅仅是 C++ 标准库对一个老且为人知的想法的实现。我画这个 vector 是为了强调它“知道自己的大小”；也就是说，`vector`\
  \ 不仅存储它的元素，还存储它的大小。\n\n我们可以这样创建一个这样的 `vector`：\n\n点击此处查看代码图像\n\n```cpp\nvector<int>\
  \ v = {5, 7, 9, 4, 6, 8};       // 6 个整数的 vector\n```\n\n我们指定了元素的类型和初始元素集。元素类型位于\
  \ `vector` 后面的尖括号 (`<>`) 中，这里是 `<int>`。这是另一个例子：\n\n点击此处查看代码图像\n\n```cpp\nvector<string>\
  \ philosopher = {\"Kant\", \"Plato\", \"Hume\", \"Kierkegaard\"}; // 4 个字符串的 vector\n\
  ```\n\n当然，`vector` 只接受其类型的元素：\n\n点击此处查看代码图像\n\n```cpp\nphilosopher[2] = 99;\n```\n\
  \n我们也可以在不指定元素值的情况下定义给定大小的 `vector`。在这种情况下，我们使用 `(n)` 符号，其中 `n` 是元素的数量，元素根据其类型给出默认值。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\nvector<int> vi(6);             // 6 个整数的 vector\nvector<string>\
  \ vs(4);         // 4 个字符串的 vector\n```\n\n没有字符的字符串 `\"\"` 被空字符串。请注意，你不能引用 `vector`\
  \ 中不存在的元素：\n\n点击此处查看代码图像\n\n```cpp\nvi[20000] = 44;                // 错误\n```\n\n\
  我们将在下一章讨论运行时错误和下标。\n\n#### 3.6.1 遍历 vector\n\n`vector` “知道自己的大小”，所以我们可以这样打印 `vector`\
  \ 的元素：\n\n点击此处查看代码图像\n\n```cpp\nvector<int> v = {5, 7, 9, 4, 6, 8};\nfor (int i\
  \ = 0; i<v.size(); ++i)\n         cout << v[i] << '\\n';\n```\n\n`v.size()` 调用给出名为\
  \ `v` 的 `vector` 的元素数量。通常情况下，`v.size()` 让我们能够避免访问范围之外的元素。`vector v` 的范围是 `[0:v.size())`。这是半开元素序列的数学符号。`v`\
  \ 的第一个元素是 `v[0]`，最后一个是 `v[v.size()−1]`。如果 `v.size()==0`，`v` 没有元素，也就是说 `v` 是空 `vector`。这种半开序列的概念贯穿整个\
  \ C++ 和 C++ 标准库（§19.2、§20.7）。\n\n语言利用半开序列的概念提供了一种遍历序列所有元素（例如 `vector` 的元素）的简单循环。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\nvector<int> v = {5, 7, 9, 4, 6, 8};\nfor (int x : v)   \
  \                   // 对于 v 中的每个 x\n         cout << x << '\\n';\n```\n\n\n\n这被称为范围\
  \ for 循环（range-for-loop），因为 `range` 一词通常用来表示“元素序列”的意思。我们将 `for (int x : v)` 读取为“对于\
  \ `v` 中的每个 `int x`”，该循环的含义与遍历下标 [`0:v.size()]` 的等效循环完全相同。我们使用范围 for 循环对序列中的所有元素进行简单遍历，一次处理一个元素。更复杂的循环，例如查看\
  \ `vector` 的每第三个元素、只查看 `vector` 的后半部分，或者比较两个 `vector` 之间的元素，通常使用更复杂且更通用的传统的 `for`语句来完成得更好（见\
  \ §§3.4.2.3）。\n\n## 3.6.2 扩容 vector\n\n### CC\n\n通常情况下，我们从一个空的 `vector` 开始，并在读取或计算所需数据时将其扩容到所需的大小。这里的关键操作是\
  \ `push_back()`，它向 `vector` 添加一个新元素。新元素将成为 `vector` 的最后一个元素。例如：\n\n![几行代码和输出定义了\
  \ vector 的增长。(graphics/f0073-01.jpg)\n\n注意 `push_back()` 用的语法。它被称为“成员函数调用”；`push_back()`\
  \ 是 `vector` 的一个成员函数，必须使用这种点符号表示来调用：\n\n点击此处查看代码图像\n\n```\nmember-function-call:\n\
  \      object-name . member-function-name ( argument-list )\n```\n\n`vector` 的大小可以通过调用\
  \ `vector` 的另一个成员函数：`size()` 来获取。初始时，`v.size()` 为 `0`，在第二次调用 `push_back()` 之后，`v.size()`\
  \ 变成了 `2`。\n\n如果你以前写过程序，你会发现 `vector` 与 C 及其他语言中的数组相似。然而，你不需要预先指定 `vector` 的大小（长度），你可以根据需要添加任意数量的元素。随着学习的，你会发现\
  \ C++ 标准 `vector` 还有其他实用的属性。\n\n## 3.6.3 数值示例\n\n让我们来看一个更真实的例子。通常，我们有一系列想要读取到程序中的值，以便对它们进行某些处理。这些“处理”可以是生成这些值的图表、计算平均值和中、找到最大元素、对它们进行排序、与其他数据合并、搜索“有趣”的值、与其他数据进行比较等。对数据可能执行的计算范围没有限制，但首先我们需要将数据存入计算机的内存中。以下是将未知（可能是大量的）数据获取到计算机中的基本技术。作为一个具体的例子，我们选择读取代表温度的浮点数：\n\
  \n点击此处查看代码图像\n\n```\nint main()\n         // 将一些温度读取到 vector 中\n{\n         vector<double>\
  \ temps;                     // 温度\n         for(double temp; cin>>temp;)      \
  \    // 读取到 temp\n                temps.push_back(temp);          // 将 temp 放入 vector\n\
  \         // ...执行某些操作 . . .\n}\n```\n\n那么，这里发生了什么？首先，我们声明一个 `vector` 来存放数据：\n\n\
  点击此处查看代码图像\n\n```\nvector<double> temps;    // 温度\n```\n\n这里提到了我们预期输入的类型。我们读取并存储\
  \ `double`。\n\n接下来是实际的读取循环：\n\n点击此处查看代码图像\n\n```\nfor (double temp; cin>>temp; )\
  \          // 读取到 temp\n         temps.push_back(temp);          // 将 temp 放入 vector\n\
  ```\n\n我们定义了一个类型为 `double` 的变量 `temp` 用于读取。`cin>>temp` 读取一个 `double`，然后该 `double`\
  \ 被推入 `vector`（放在末尾）。我们之前已经见过这些单独的操作。这里的新之处在于，我们将输入操作 `cin>>temp` 作为 `for`语句的条件。基本上，如果正确读取了一个值，则\
  \ `cin>>temp` 为真，否则为假，因此 `for`语句将读取我们提供给它的所有 `double`，并在我们提供任何其他内容时停止。例如，如果你输入\n\
  \n```\n1.2 3.4 5.6 7.8 9.0 |\n```\n\n那么 `temps` 将获得五个元素 `1.2`、`3.4`、`5.6`、`7.8`、`9.0`（按顺序，例如\
  \ `temps[0]==1.2`）。我们使用字符 `'|'` 来结束输入——任何不是 `double` 的字符都可以用。在 §9.4 中，我们讨论了如何结束输入以及如何处理输入错误。\n\
  \n为了将输入变量 `temp` 的范围限制在循环内，我们使用了 `for`语句而不是 `while`语句：\n\n点击此处查看代码图像\n\n```\ndouble\
  \ temp;\nwhile (cin>>temp)               // 读取到\n         temps.push_back(temp);\
  \     // 将 temp 放入 vector\n```\n\n等等，让我们根据提供的文本结构对齐逻辑：\n将元素加到 `sum` 中，然后除以元素的数量（即\
  \ `temps.size()`）：\n\n点击此处查看代码图像\n\n```\ndouble sum = 0;\nfor (double x : temps)\n\
  \         sum += x;\ncout << \"Average temperature: \" << sum/temps.size() << '\\\
  n';\n```\n\n注意 `+=` 运算符是方便的。为了计算中位数（使得一半数值较低，另一半较高的值），我们需要对元素进行排序。为此，我们使用标准库排序算法的变体——`sort()`：\n\
  \n点击此处查看代码图像\n\n```\n// 计算中位数温度：\nranges::sort(temps);                         \
  \       // 温度排序\ncout << \"Median temperature: \" << temps[temps.size()/2] << '\\\
  n';\n```\n\n我们稍后会详细解释标准库算法（第 21 章）。一旦温度排序，找到中位数就很容易：我们只需选择中间元素，即索引为 `temps.size()/2`\
  \ 的元素。如果你想挑剔（如果你开始像程序员一样思考了），你可以观察到我们找到的值可能并不是我们定义的中位数。本章末尾的 练习 3 设计就是为了解决这个问题。\n\
  \n我们刻意在代码中遗留了一个可能更严重的问题。你发现了吗？如果我们没有输入任何温度值会怎样？在这种情况下，一切正常，直到我们尝试输出中位数温度。那时，我们尝试读取\
  \ `temps[temps.size()/2]` 但 `size()` 为 0，所以没有元素可以读取！幸运的是，如果你使用带有范围检查的 `vector` 实现，错误会被捕获并报告。如果你使用我们的\
  \ PPP 支持，就会发生这种情况。在迭代时忘记没有元素的情况是一个常见问题；始终要这种可能性。\n\n\n\n我们没有展示温度的例子，是因为我们对温度特别感兴趣。许多人——例如气象学家、农艺学家和海洋学家——对温度数据以及基于这些温度的数值（如平均值和中位数）非常感兴趣。然而，我们并不感兴趣。从程序员的角度来看，这个例子的趣味之处在于它的通用性：`vector`\
  \ 及其对它进行的简单操作可以应用于极其广泛的场景。完全可以说，无论你对什么感兴趣，只要你需要分析数据，你就会使用 `vector`（或类似的数据结构；请参见第\
  \ 15 章）。作为一个例子，让我们来构建一个简单的字典：\n\n点击此处查看代码图像\n\n```cpp\nint main()\n         // 简单的字典：排序后的单词列表\n\
  {\n         vector<string> words;\n         for(string temp; cin>>temp;)       \
  \              // 读取由空格分隔的单词\n                 words.push_back(temp);          \
  \        // 放入 vector\n         cout << \"Number of words:\" << words.size() <<\
  \ '\\n';\n\n         ranges::sort(words);                                 // 对单词排序\n\
  \n         for (int i = 0; i<words.size(); ++i)\n                 if (i==0 || words[i−1]!=words[i])\
  \         // 这是新单词吗？\n                         cout << words[i] << \"\\n\";\n}\n\
  ```\n\n如果我们向这个程序输入一些单词，它将按顺序写出来，且不重复单词。例如，给定：\n\n```\na man a plan a canal panama\n\
  ```\n\n它将输出：\n\n```\na\ncanal\nman\npanama\nplan\n```\n\n我们如何停止读取字符串输入？换句话说，我们如何终止输入循环？\n\
  \n点击此处查看代码图像\n\n```cpp\nfor (string temp; cin>>temp; )             // 读取\n     \
  \    words.push_back(temp);            // 放入 vector\n```\n\n当我们读取数字时（在 §3.6.2 节），我们只是输入了一个不是数字的字符。在这里我们不能这样做，因为每个（普通的）字符都可以读入\
  \ `string` 中。幸运的是，有些字符是“非普通的”。正如在 §2.5.1 中提到的，在 Windows 下使用 `Ctrl+Z` 终止输入流，而在 Linux\
  \ 下则使用 `Ctrl+D` 实现。\n\n这个程序的大部分与我们处理温度时做的非常相似。事实上，我们是通过复制粘贴“温度程序”来编写“字典程序”的。唯一的新内容是测试：\n\
  \n点击此处查看代码图像\n\n```cpp\nif (i==0 || words[i−1]!=words[i])     // 这是新单词吗？\n```\n\n\
  如果你删除了那个测试，输出将是：\n\n```\na\na\na\ncanal\nman\npanama\nplan\n```\n\n我们不喜欢重复，所以我们使用那个测试消除了它。这个测试的作用是什么？它检查我们打印的上一个单词是否与即将打印的单词不同（`words[i−1]!=words[i]`），如果是，我们就打印该单词；否则，我们不打印。显然，当我们准备打印第一个单词时（`i==0`），无法谈论上一个单词，所以我们先测试该情况，并使用\
  \ `||`（或）运算符将这两个测试结合：\n\n点击此处查看代码图像\n\n```cpp\nif (i==0 || words[i−1]!=words[i])\
  \     // 这是新单词吗？\n```\n\n\n\n\n\n## [7] 什么是常量表达式？\n\n## [8] 什么是字面量？\n\n## [9] 什么是符号常量？我们为什么要使用它们？\n\
  \n## [10] 什么是魔法常量？请举例。\n\n## [11] 哪些运算符可以用于整数和浮点数值？\n\n## [12] 哪些运算符可以用于整数，但不能用于浮点数？\n\
  \n## [13] 哪些运算符可以用于 `strings`？\n\n## [14] 程序员在什么情况下会倾向于使用 `switch` 语句而不是 `if` 语句？\n\
  \n## [15] `switch` 语句常见问题有哪些？\n\n## [16] `for` 循环头部中每个部分的作用是什么？它们按什么顺序执行？\n\n##\
  \ [17] 什么时候应该使用 `for` 循环，什么时候应该使用 `while` 循环？\n\n## [18] 描述函数定义中行 `char foo(int\
  \ x)` 的含义。\n\n## [19] 什么时候应该为程序的一部分定义一个独立的函数？列出原因。\n\n## [20] 你可以对 `int` 做什么而不能对\
  \ `string` 做？\n\n## [21] 你可以对 `string` 做什么而不能对 `int` 做？\n\n## [22] `vector` 中第三个元素的索引是什么？\n\
