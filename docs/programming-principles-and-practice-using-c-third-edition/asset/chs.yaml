  \ | 对象代码 | C++ | 头文件 |\n| 输出 | 注释 | IDE | 程序 |\n| 编译器 | `import` | 源代码 | 编译时 |\n\
  | 错误 | 库 | 语句 | `cout` |\n| 链接器 | `module` | `#include` | `std` |\n| 命令行 | bug |\
  \ 调试 | |\n\n你可能逐渐编写一个用自己的语言编写的词表。你可以通过对每个章节重复下方的练习 5 来做到。\n\n### 练习 (Exercises)\n\
  \n我们将练习题（drills）与习题（exercises）分开列出；在尝试习题之前，务必完成章节练习。这样做将节省你的时间。\n\n[1] 修改程序输出以下两行：\n\
  \n```\nHello, programming!\nHere we go!\n```\n\n[2] 在你所学知识的基础上，编写一个程序，列出计算机寻找楼上卫生间的指令（\
  \ §1.1 中讨论过）。你能想出更多人类会假设但计算机不会假设的步骤吗？将它们加入你的列表。这是“像计算机一样思考”的一个良好开始。警告：对于大多数人来说，“去厕所”是一个完全足够的指令。但对于一个没有任何房屋或卫生所经验的人（想象一个被某种传到你餐厅的石器时代人），必要的指令列表可能会非常长。请不要超过一页。为了读者的考虑，你可以对你所想象的房屋布局进行简短描述。\n\
  \n[3] 写一个描述如何从你的宿舍、公寓、房子或其他任何地方的大门走到教室门（假设你正在某所学校；如果不是，请选择另一个目标）。让一个朋友尝试遵循这些指令，并在过程中对改进之处进行标注。为了留住朋友，在把指令交给朋友之前，你自己对这些指令进行“实地测试”可能是一个好主意。\n\
  \n[4] 找一本好的食谱。阅读烤蓝莓松芬的指令（如果你所在的国家蓝莓松芬是一种奇怪的异国菜肴，请用更熟悉的菜肴代替）。请注意，在一些帮助和指导下，世界上大多数人都能烘焙美味的蓝莓松芬。这不被认为是高级或困难的精细烹饪。然而，对于作者来说，书中很少有练习像这道题一样困难。通过一点练习，你所做的事情令人惊叹。\n\
  \n*   重写这些指令，使每个单独的动作位于其自己的编号段落中。小心列出每一步使用的所有原料和所有厨具。注意关键细节，例如所需的烤箱温度、预热烤箱、烤盘的准备，以及从烤箱中取出松芬时保护手的需要。\n\
  *   从烹饪新手的角度考虑这些指令（如果你不是，请向一个不会做饭的朋友帮助）。补充书中作者（无疑是经验丰富的厨师）由于显而易见而省略的步骤。\n*   建立一个用词术语表。（松芬盘是什么？预热是做什么的？你指的是烤箱？）\n\
  *   现在烤一些松芬并享受你的成果。\n\n[5] 为“术语”中的每个词语写一个定义。首先尝试在不看章节的情况下完成（可能不可能），然后翻阅章节寻找定义。你可能会发现你的第一次尝试与书中版本之间的差异很有趣。你可以参考一些在线词汇表，例如\
  \ `www.stroustrup.com/glossary.xhtml` (http://www.stroustrup.com/glossary.xhtml)。在查找之前写下自己的定义，可以加强你通过阅读获得的收获。如果你必须重读某个章节来形成定义，这有助于你理解。可以随意用自己的语言来定义，并使其达到你认为合理的细节。\n\
  \n#### 结记 (Postscript)\n\n**CC**\n\n“Hello, World!”程序的意义何？它的目的是让我们熟悉编程的基础工具。每当我们接触新工具时，倾向于使用一个极其简单的例子，如“Hello,\
  \ World!”。这样，我们将学习分为两个部分：首先我们通过一个微不足道的程序学习工具的基础知识，随后我们在不被工具分心的情况下学习更复杂的程序。同时学习工具和语言比先做其中一个要困难得多。这种通过将复杂任务分解为一系列较小的（更易处理的）步骤来简化学习的方法并不仅限于编程和计算机。它在生活的大多数领域都是常见且用的，特别是在涉及某些实践技能的领域。\n\
  \n\n\n\n本章介绍了在程序中存储和使用数据的基础知识。为了实现这一点，我们首先关注如何从键盘读取数据。在建立了对象、类型、值和变量的基础概念后，我们引入了几个运算符，并提供了许多关于\
  \ `char`、`int`、`double` 和 `string` 类型变量的用法示例。\n\n## 2.1 输入\n### 2.2 变量\n### 2.3\
  \ 输入与类型\n### 2.4 操作与运算符\n### 2.5 赋值与初始化\n- 示例：检测重复单词\n- 复合赋值运算符\n- 示例：查找重复单词\n###\
  \ 2.6 标识\n### 2.7 类型与对象\n### 2.8 类型安全\n### 2.9 转换\n### 2.10 类型推导：auto\n\n## 2.1\
  \ 输入\n\n“Hello, World!”程序只是向屏幕写内容。它产生了输出，但它不读取任何内容；也不从用户那里获取输入。这相当相当无味。真正的程序倾向于根据我们提供的某些输入来产生结果，而不是在每次执行时都执行完全相同的事情。\n\
  \n**CC**\n\n为了读取某些东西，我们需要一个地方来读取；也就是说，我们需要在计算机内存中找一个地方来放置读取的内容。我们将这样的“地方”称为对象。一个*对象*是一个具有特定*类型*的内存区域，该类型规定了可以向其中放置什么种类的信息。一个命名的对象被称为*变量*。例如，字符字符串被放入\
  \ `string` 变量中，整数被放入 `int` 变量中。你可以将对象想象为一个“箱子”，你可以向其中放入该对象类型的值：\n\n![一个数据表，列标记为\
  \ 'int'，行标记为 'age'。值 '42' 被输入在 'age' 行与 'int' 列交叉处的单元格中。](img/f0030-01.jpg)\n\n\
  这代表一个名为 `age` 的 `int` 类型对象，其中包含整数值 `42`。使用字符串变量，我们可以从输入读取一个字符串并再次将其写出，如下：\n\n点击此处查看代码图像\n\
  \n```cpp\n// read and write a first name\n#include \"PPP.h\"\n\nint main()\n{\n\
  \         cout << \"Please enter your first name (followed by \\\"enter\\\"):\\\
  n\";\n         string first_name;                      // first_name 是一个 string\
  \ 类型的变量\n         cin >> first_name;                     // 将字符读入 first_name\n```\n\
  \         cout << \"Hello, \" << first_name << \"!\\n\";\n}\n```\n\n`#include` 和\
  \ `main()` 在第 1 章 中已经熟悉。由于我们所有的程序都需要 `#include` 或等效的直接使用 `import`，我们将在演示中省略它，以防分散注意力。同样，我们有时会展示只有放置于\
  \ `main()` 或其他函数中才能运行的代码，如下：\n\n点击此处查看代码图像\n\n```cpp\ncout << \"Please enter your\
  \ first name (followed by 'enter'):\\n\";\n```\n\n我们假设你可以设如何将此类代码放入一个完整的程序中进行测试。\n\
  \n`main()` 的第一行只是写出一条消息，鼓励用户输入名字。这样的消息通常被称为*提示*（prompt），因为它提示用户采取行动。接下来的几行定义了一个类型为\
  \ `string` 的变量 `first_name`，从键盘读取输入到该变量中，并写出问候语。让我们依次查看这三行：\n\n点击此处查看代码图像\n\n```cpp\n\
  string first_name;     // first_name 是一个 string 类型的变量\n```\n\n这代表一个名为 `age` 的 `int`\
  \ 类型对象，其中包含整数值 `42`。\n\n![一个数据表，列标记为 'int'，行标记为 'age'。值 '42' 被输入在 'age' 行与 'int'\
  \ 列交叉处的单元格中。](img/f0030-01.jpg)\n\n这代表一个名为 `age` 的 `int` 类型对象，其中包含整数值 `42`。使用字符串变量，我们可以从输入读取一个字符串并再次将其写出，如下：\n\
  \n点击此处查看代码图像\n\n这代表一个名为 `age` 的 `int` 类型对象，其中包含整数值 `42`。使用字符串变量，我们可以从输入读取一个字符串并再次将其写出，如下：\n\
  \n```cpp\nstring first_name;     // first_name 是一个 string 类型的变量\n```\n\n这代表一个名为\
  \ `age` 的 `int` 类型对象，其中包含整数值 `42`。\n\n### 2.2 变量\n\n**CC**\n\n基本上，如果我们不在内存中存储数据（就像我们在上面的示例中存储输入字符串那样），计算机无法进行任何有意义的操作。我们存储数据的“地方”被称为对象。为了访问对象，我们需要一个名称。一个命名的对象被称为变量，它有一个特定的*类型*（例如\
  \ `int` 或 `string`），该类型决定了可以放入对象的内容（例如 `123` 可以放入 `int`，`\"Hello, World!\\n\"` 可以放入\
  \ `string`）以及可以应用哪些操作（例如，我们可以使用 `*` 运算符相乘整数，并使用 `<=` 运算符比较字符串）。我们放入变量的数据项被称为*值*。定义变量的语句（意所当然地）被称为*定义*，定义可以（并且通常应该）提供一个初始值。考虑：\n\
  \n\n\n\n\n```\nstring name = \"Annemarie\";\nint number_of_steps = 39;\n```\n\n\
  `{=}` 之后的值被称为*初始化器*。\n\n你可以这样可视化这些这些变量：\n\n![显示了两个数据表。](img/f0032-01.jpg)\n\n你不能将错误类型的值放入变量中：\n\
  \n点击此处查看代码图像\n\n```\nstring name2 = 39;                                     //错误:\
  \ 39 不是字符串\nint number_of_steps = \"Annemarie\";      // 错误: \"Annemar ie\" 不是整数\n\
  ```\n\n编译器会记住每个变量的类型，并确保你按照其定义中指定的类型来使用它。\n\nC++ 提供了大量的类型。你可以在网页上找到完整的列表（例如 `[cppreference.com](http://cppreference.com)`）。然而，你只需要使用其中五种就可以编写出完美的程序：\n\
  \n点击此处查看代码图像\n\n```\nint number_of_steps = 39;                // int 用于整数\ndouble\
  \ flying_time = 3.5;                  // double 用于浮点数\nchar decimal_point = '.';\
  \                   // char 用于单个字符\nstring name = \"Annemarie\";           // string\
  \ 用于字符字符串\nbool tap_on = true;                         // bool 用于逻辑变量\n```\n\n`double`\
  \ 这个名字出于历史原因：`double` 是“double-precision floating point”（双精度浮点数）的缩写。浮点数是计算机对实数数学概念的近似。\n\
  \n注意这些类型每种都有其独特的字面量风格：\n\n点击此处查看代码图像\n\n```\n39                                \
  \ // int: 一个整数\n3.5                                // double: 一个浮点数\n'.'       \
  \                           // char: 用单引号括的单个字符\n\"Annemarie\"              // string:\
  \ 双引号括的字符序列\ntrue                             // bool: true 或 false\n```\n\n也就是说，数字序列（如\
  \ `1234`、`2` 或 `976`）表示整数，单引号括的单个字符（如 `'1'`、`@'` 或 `'x'`）表示字符，带有小数点的数字序列（如 `1.234`、`0.12`\
  \ 或 `.98`）表示浮点值，而双引号括的字符序列（如 `\"1234\"`、`\"Howdy!\"` 或 `\"Annemarie\"`）表示字符串。\n\n\
  ### 2.3 输入与类型\n\n#### CC\n\n输入操作 `>>`（“从...获取”）对类型很敏感；也就是说，它根据你读取入的变量类型进行读取。例如：\n\
  \n点击此处查看代码图像\n\n```\nint main()          // 读取 name 和 age\n{\n         cout << \"\
  Please enter your first name and age\\n\";\n         string first_name = \"???\"\
  ;                // 字符串变量 (\"???\" 表示“不知道名字”）\n         int age = −1;          \
  \                             // 整数变量 (-1 表示“不知道年龄”)\n         cin >> first_name\
  \ >> age;                // 读取一个字符串后跟一个整数\n         cout << \"Hello, \" << first_name\
  \ << \" (age \" << age << \")\\n\";\n}\n```\n\n所以，如果你输入 `Carlos 22`，`>>` 运算符会将 `Carlos`\
  \ 读取到 `first_name`，将 `22` 读取到 `age`，并产生输出：\n\n```\nHello, Carlos (age 22)\n```\n\
  \n为什么它不会将（所有的）`Carlos 22` 读取到 `first_name` 中呢？因为根据惯例，`string` 的读取会被所谓的*空白字符*终止，即空格、换行符和制表符。否则，`>>`\
  \ 默认会忽略空白字符。例如，你可以在要读取的数字之前任意数量的空格；`>>` 将跳过它们并读取数字。\n\n就像我们可以在单个输出语句中写多个值一样，我们可以在单个输入语句中读取多个值。注意\
  \ `<<` 对类型敏感，就像 `>>` 一样，所以我们可以输出 `int` 变量 `age` 以及 `string` 变量 `first_name` 和字符串字面量\
  \ `\"Hello, \"`、 `\" (age\"` 和 `\")\\n\"`。\n\n如果你输入 `22 Carlos`，你会看到一些在你思考之前可能会令你惊讶的内容。（误导性的）输入\
  \ `22 Carlos` 将输出：\n\n```\nHello, 22 (age −1)\n```\n\n`22` 将被读取到 `first_name` 中，因为毕竟\
  \ `22` 是一个字符序列，它们被空白字符终止。另一方面，`Carlos` 不是整数，所以它不会被读取。输出将是 `22` 和 `age` 的初始值 `−1`。为什么？你没有成功地向它读取一个值，所以它保留了初始值。\n\
  \n#### AA\n\n使用 `>>` 读取的 `string`（默认情况下）由空白字符终止。\n\n### 2.4 运算与运算符\n\n除了指定变量中可以存储哪些值外，类型还决定了哪些操作可以应用于它以及这些操作的含义。例如：\n\
  \n点击此处查看代码图像\n\n```\nint age = −1;\ncin >> age;                                \
  \               // 读取整数到 age\n\nstring name;\ncin >> name;                     \
  \                       // 读取字符串到 name\n\nint a2 = age+2;                      \
  \                  // + 整数\nstring n2 = name + \" Jr. \";                     //\
  \ + 拼接字符串\n\nint a3 = age−2;                                       // - 整数\nstring\
  \ n3 = name − \" Jr. \";                    // 错误: - 未定义\n```\n\n这里的“错误”意味着编译器将拒绝减去字符串。编译器确切知道每个变量可以使用哪些操作，因此可以防止许多错误。然而，编译器不知道哪些操作对你来说是有意义的，所以它会乐意接受在你看来荒谬的合法操作。例如：\n\
  \n```\nage = −100;\n```\n\n对你来说，显然不能有负年龄（为什么不能呢？）但没有人告诉编译器，所以它会生成该定义的代码。\n\n这里是一些常用且有用类型的运算符表：\n\
  \n| 运算 | **bool** | **char** | **int** | **double** | **string** |\n| :--- | :---\
  \ | :--- | :--- | :--- | :--- |\n| 赋值 | `=` | `=` | `=` | `=` | `=` |\n| 加法 | |\
  \ | `+` | `+` | |\n| 拼接 | | | | | `+` |\n| 减法 | | | `−` | `−` | |\n| 乘法 | | | `*`\
  \ | `*` | |\n| 除法 | | | `*/` | `*/` | |\n| 取余（取模） | | | `%` | | |\n| 增 1 | | | `++`\
  \ | `++` | |\n| 减 1 | | | `--` | `--` | |\n| 增 **n** | | | `+=n` | `+=n` | | |\n\
  | 加到末尾 | | | | | `+=` |\n| 减 **n** | | | `−=n` | `−=n` | |\n| 乘法并赋值 | | | | `*=`\
  \ | |\n\n\n\n\n\n| 除法并赋值 | | | `/=` | `/=` | |\n| 余数赋值 | | | `%=` | | | |\n| 从 `s`\
  \ 读取到 `x` | `s >> x` | `s >> x` | `s >> x` | `s >> x` | `s >> x` |\n| 将 `x` 写入 `s`\
  \ | `s << x` | `s << x` | `s << x` | `s << x` | `s << x` |\n| 等于 | `==` | `==` |\
  \ `==` | `==` | `==` |\n| 不等于 | `!=` | `!=` | `!=` | `!=` | `!=` |\n| 大于 | `>` |\
  \ `>` | `>` | `>` | `>` |\n| 大于等于 | `>=` | `>=` | `>=` | `>=` | `>=` |\n| 小于 | `<`\
  \ | `<` | `<` | `<` | `<` |\n| 小于等于 | `<=` | `<=` | `<=` | `<=` | `<=` |\n\n空白方格表示该操作对某种类型不可直接使用（尽管可能有间接使用该操作的方法；参见\
  \ §2.9）。\n\n我们将在学习过程中解释这些操作以及更多内容。这里的关键点是，有很多非常有用的运算符，而且它们的含义对于相似类型往往是相同的。\n\n让我们尝试一个涉及浮点数的示例：\n\
  \n点击此处查看代码图像\n\n```cpp\nint main()          // simple program to exercise operators\n\
  {\n         cout << \"Please enter a floating−point value: \";\n         double\
  \ n = 0;\n         cin >> n;\n         cout << \"n == \" << n\n                \
  \  << \"\\nn+1 == \" << n+1\n                  << \"\\nthree times n == \" << 3*n\n\
  \                  << \"\\ntwice n == \" << n+n\n                  << \"\\nn squared\
  \ == \" << n*n\n                  << \"\\nhalf of n == \" << n/2\n             \
  \     << \"\\nsquare root of n == \" << sqrt(n)\n                  << '\\n';\n}\n\
  ```\n\n显然，我们从小学时期就熟悉的常用算术运算具有其标准的符号和含义。例外是等等的表示法是 `==`，而不是简单的 `=`。普通的 `=` 用于赋值。自然地，我们可能想对浮点数进行的某些操作（例如求平方根）并不是都能作为运算符提供的。许多操作被表示为命名函数。在这种情况下，我们使用标准库中的\
  \ `sqrt()` 来获取 `n` 的平方根：`sqrt(n)`。这种表示法在数学中很常见。我们将在过程中使用函数，并在 §3.5 和 §7.4 中进行详细讨论。\n\
  \n### 尝试一下\n\n运行这个小程序。然后，修改它以读取一个 `int` 而不是 `double`。此外，“练习”其他操作，例如取模运算符 `%`。注意，对于\
  \ `int` 类型，`/` 是整数除法，`%` 是取余（取模），因此 `5/2` 的结果是 `2`（而不是 `2.5` 或 `3`），而 `5%2` 的结果是\
  \ `1`。整数、`/` 和 `%` 的定义保证了对于两个正整数 `int` `a` 和 `b`，有 `a/b * b + a%b == a`。\n\n字符串的运算符较少，但它们有许多命名操作（PPP2.Ch23）。然而，它们拥有的运算符可以按照惯使用。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\nint main()          // read first and second name\n{\n \
  \        cout << \"Please enter your first and second names\\n\";\n         string\
  \ first;\n         string second;\n         cin >> first >> second;            \
  \                    // read two strings\n\n         string name = first + ' ' +\
  \ second;              // concatenate strings\n         cout << \"Hello, \" << name\
  \ << '\\n';\n}\n```\n\n对于字符串来说，`+` 意味着连接；也就是说，当 `s1` 和 `s2` 是字符串时，`s1+s2` 是一个字符串，其字符由\
  \ `s1` 的字符后接 `s2` 的字符组成。例如，如果 `s1` 的值为 `\"Hello\"`，`s2` 的值为 `\"World\"`，那么 `s1+s2`\
  \ 的值就是 `\"HelloWorld\"`。`string` 之间的比较特别有用：\n\n点击此处查看代码图像\n\n```cpp\nint main()\
  \           // read and compare names\n{\n         cout << \"Please enter two names\\\
  n\";\n         string first;\n         string second;\n         cin >> first >>\
  \ second;    // read two strings\n\n         if (first == second)\n            \
  \      cout << \"that's the same name twice\\n\";\n         if (first < second)\n\
  \                  cout << first << \" is alphabetically before \" << second <<'\\\
  n';\n         if (first > second)\n                  cout << first << \" is alphabetically\
  \ before \" << second <<'\\n';\n}\n```\n\n\n\n\n这种结构被称为 `while`-语句，它本身就很有趣，我们将在\
  \ §3.4.2.1 中进一步检查它。`while` 表示，只要输入操作 `cin>>current` 成功，`(cin>>current)` 之后的语句就会重复执行，而只要标准输入中还有字符可读，`cin>>current`\
  \ 就会成功。请记住，对于 `string` 类型，`>>` 读取的是由空格分隔的单词。你通过向程序提供一个输入结束字符（通常称为 *文件末尾*）来终止这个循环。在\
  \ Windows 机器上，那是 `Ctrl+Z`（同时按下 Control 和 Z）然后按回车键。在 Linux 机器上，那是 `Ctrl+D`（同时按下 Control\
  \ 和 D）。\n\n所以，我们所要做的是读取一个单词到 `current` 中，然后将其与上一个单词（存储在 `previous` 中）进行比较。如果它们相同，我们就说明一下：\n\
  \n点击此处查看代码图像\n\n```\nif (previous == current)             // 检查单词是否与上次相同\n     \
  \    cout << \"repeated word: \" << current << '\\n';\n```\n\n然后我们必须为下一个单词再次做准备。我们通过将\
  \ `current` 单词复制到 `previous` 中来实现：\n\n```\nprevious = current;\n```\n\n只要我们能开始，这种方法就能处理所有情况。对于我们没有上一个单词可以比较的第一个单词，我们该怎么办？这个问题通过\
  \ `previous` 的定义来解决：\n\n点击此处查看代码图像\n\n```\nstring previous;                  //\
  \ 上一个单词；初始化为 \"\"\n```\n\n空字符串不是一个单词。因此，在第一次通过 `while`-语句时，测试条件\n\n```\nif (previous\
  \ == current)\n```\n\n会失败了（正如我们预期的一样）。\n\n**AA**\n\n理解程序流的一种方法是“扮演计算机”，即逐行跟踪程序，执行它指定的指令。只需在纸上画一些框，并将它们的值写入其中。按照程序指定的更改存储的值。\n\
  \n尝试一试\n\n你自己用一张纸执行这个程序。使用输入 `The cat cat jumped`。即使是经验丰富的程序员也使用这种技术来视觉化某些代码段的操作，这些操作似乎并不完全直观。\n\
  \n尝试一试\n\n让“重复单词检测程序”运行。用句子 `She she laughed \"he he he!\" because what he did did\
  \ not look very very good good` 进行测试。有多少有多少个重复单词？为什么？在这里使用的 *单词* 的定义是什么？*重复单词* 的定义是什么？（例如，`She\
  \ she` 是重复吗？）\n\n### 2.5.2 复合赋值运算符\n\n对变量进行递增（即对其加 1）在程序中非常常见，因此 C++ 为其提供了特殊的语法。例如：\n\
  \n```\n++counter\n```\n\n意味着\n\n```\ncounter = counter + 1\n```\n\n还有许多其他常用方法可以根据变量的当前值更改其值。例如，我们可能想给它加\
  \ 7、减去 9 或将其乘以 2。C++ 也直接支持此类操作。例如：\n\n```\na+=7;        // 意味着 a = a+7\nb−=9;  \
  \      // 意味着 b = b-9\nc *=2;        // 意味着 c = c*2\n```\n\n通常情况下，对于任何二进制运算符 `oper`，`a\
  \ oper= b` 意味着 `a = a oper b`。首先，该规则给了我们运算符 `+=`、`−=`、`*=`、`/=` 和 `%%=`。这提供了一种令人悦的紧凑表示法，直接反映了我们的思想。例如，在许多应用领域\
  \ `*=` 和 `/=`。\n\n### 2.5.3 示例：发现重复单词\n\n考虑相邻单词的发现。我们通过一个 `while` 语句来处理。一个简单的示例展示了程序如何发现重复单词：\n\
  \n```cpp\n#include <iostream>\n#include <string>\nusing namespace std;\n\nint main()\n\
  {\n    string previous;                  // 上一个单词；初始化为 \"\"\n    string current;\n\
  \    while (cin >> current) {\n        if (previous == current) {\n            cout\
  \ << \"repeated word: \" << current << '\\n';\n        }\n        previous = current;\n\
  \    }\n}\n```\n\n\n\n\n\n点击此处查看代码图像\n\n```\nint string = 7;  // this will lead\
  \ to trouble\n```\n\n# AA\n\n当你为变量、函数、类型等命名时，请选择有意义的名称；也就是说，选择那些能够帮助人们理解你程序的名称。如果你在程序中充斥着像\
  \ `x1`、`x2`、`s3` 和 `p7` 这样“易于输入”的变量，你自己也会难以理解你的程序到底是做什么的。缩写和首字母词可能会困扰人们，因此请谨慎使用。这些缩写词在我们编写它们时是显而易见的，但我们预计你至少会在其中一个上感到困惑：\n\
  \n点击此处查看代码图像\n\n```\nmtbf         TLA         myw         NBV\n```\n\n我们预计几个月后，我们至少会在其中一个上感到困惑。\n\
  \n短名称（如 `x` 和 `i`）在惯例用法时是有意义的；也就是说，`x` 应该是一个局部变量或参数（参见 §3.5 和 §7.4），而 `i` 应该是一个循环索引（§3.4.2.3）。\n\
  \n不要使用过长的名称；它们难以输入，会导致行过长而屏幕无法容纳，并且难以快速阅读。这些可能是可以的：\n\n点击此处查看代码图像\n\n```\npartial_sum\
  \               element_count           stable_partition\n```\n\n这些可能太长了：\n\n点击此处查看代码图像\n\
  \n```\nthe_number_of_elements                 remaining_free_slots_in_symbol_table\n\
  ```\n\n我们的“代码风格”是使用下划线来分隔标识符中的单词，例如 `element_count`，而不是其他方案（如 `elementCount` 和 `ElementCount`）。我们从不使用全大写名称，例如\
  \ `ALL_CAPITAL_LETTERS`，因为那在约定上留给宏（PPP2.§27.8），而我们避免使用宏。我们定义的类型使用首字母大写，例如 `Square`\
  \ 和 `Graph`。C++ 语言和标准库并不使用首字母大写风格，因此是 `int` 而不是 `Int`，是 `string` 而不是 `String`。因此，我们的规范有助于减少我们的类型与标准类型之间的混淆。\n\
  \n# XX\n\n避免易拼错、易读错或易混淆的名称。例如：\n\n点击此处查看代码图像\n\n```\nName                 names\
  \             nameS             foo             f00             fl             \
  \ f1       fI          fi\n```\n\n字符 `0`（零）、`o`（小写 O）、`O`（大写 o）、`1`（一）、`I`（大写 i）和\
  \ `l`（小写 L）特别容易引起麻烦。\n\n### 2.7 类型与对象\n\n# CC\n\n类型的概念是 C++ 以及大多数其他编程语言的核心。让我们更深入、稍微带技术性的角度来看类型：\n\
  \n*   *类型*（type）定义了一组可能的值集合和一组操作（针对对象）。\n*   *对象*（object）是存储给定类型值的内存。\n*   *值*（value）是内存中根据类型解释的一组位。\n\
  *   *变量*（variable）是一个命名的对象。\n*   *声明*（declaration）是一个为对象提供名称和类型的语句。\n*   *定义*（definition）是一个为对象分配内存的声明。\n\
  \n形象地说，我们把对象看作一个盒子，可以在其中放入给定类型的值。一个 `int` 箱子可以存放整数，如 `7`、`42` 和 `−399`。一个 `string`\
  \ 箱子可以存放字符字符串值，如 `\"Interoperability\"`、`\"operators: +−*****/%\"` 和 `\"Old MacDonald\
  \ had a farm\"`。从图形上我们可以这样想：\n\n![几行代码解释了存储整数的 int 箱子的用法。](img/f0043-01.jpg)\n\n\
  `string` 的表示比 `int` 稍微复杂一点，因为 `string` 会跟踪它所持有的字符数量。注意 `double` 存储一个数字，而 `string`\
  \ 存储字符。例如，`x` 存储数字 `1.2`，而 `s2` 存储三个字符 `'1'`、`'.'` 和 `'2'`。字符和字符串字面量的引号是不存储的。\n\n\
  每个 `int` 的大小相同；也就是说，编译器为每个 `int` 分配相同数量的内存。在典型的电脑或手机上，该数量是 4 字节（32 位）。同样，`bool`、`char`\
  \ 和 `double` 也是固定大小的。你通常会发现计算机为 `bool` 或 `char` 使用 1 字节（8 位），为 `double` 使用 8 字节。注意不同类型的对象占据的空间不同。\n\
  \n### 2.8 类型安全\n\n# AA\n\n每个对象在定义时都会被赋予一个类型，且该类型永远改变。当一个程序（或程序的局部）完全按照其类型规则使用对象时，它是类型安全的。完全类型安全是理想状态也是语言的通用规则。遗憾的是，C++\
  \ 编译器本身无法保证任意代码的类型安全，因此我们必须避免不安全的技术。也就是说，我们必须遵守某些编码规则来实现类型安全。有强制这些规则的方法，但从历史上看，这些规则被认为过于严格，且没有被一致执行。考虑到旧版本的\
  \ C++（早于近期 ISO C++ 标准）以及从 C 语言采用的技术，这是不可避免的，因此并不合理。然而，使用现代 C++ 和现代分析工具，大多数 C++ 用例的类型安全的。理想是不使用任何在程序执行前无法证明安全的特性：*静态类型安全*。除了演示不安全技术的代码（例如\
  \ §16.1.1），书中的代码遵循 C++ Core Guidelines [CG] 并已验证类型安全。\n\n# XX\n\n编写可靠代码时，类型安全的理想至关重要。这就是为什么我们在书中尽早讨论这个问题。请注意这些陷阱并避免它们。如果你这样做，你将面临许多挫败，你的代码将包含许多晦涩的错误。\n\
  \n# AA\n\n例如，使用未初始变量不是类型安全的：\n\n点击此处查看代码图像\n\n\n\n\n\n```\nint main()\n{\n     \
  \    double x;                        // 我们“忘记”了初始化：x 的值是未定义的\n         double y\
  \ = x;                 // y 的值是未定义的\n         double z = 2.0+x;          // + 的含义和\
  \ z 的值都是未定义的\n}\n```\n\n# `AA`\n\n始终初始化你的变量！实现可以很容易强制执行这一规则，但遗憾的是，它们默认通常不会这样做。不过幸运的是，对于像\
  \ `string` 和 `vector` 这样的类型，可以保证进行默认初始化（§2.5, §7.2.3, §8.4.2）。弄清楚如何启用警告（通常是编译器选项\
  \ `−Wall`）并遵守这些警告。这样做将为你节省大量的麻烦。\n\n# `CC`\n\n现代 C++ 实现还附带了强大的静态分析工具，允许我们防止更微妙的问题。专业人士会大量地使用此类工具，如果你成为或目标成为专业人士，你也会这样做，但在学习的这个初始阶段，只需遵循书中使用的规则和风格即可。\n\
  \n### 2.9 转换\n\n在 §2.4 中，我们看到不能直接相加 `char` 或将 `double` 与 `int` 比较。然而，C++ 提供了间接的方法来实现这两者。当在表达式中需要时，`char`\
  \ 会转换为 `int`，`int` 会转换为 `double`。例如：\n\n点击此处查看代码图像\n\n```\nchar c = 'x';\nint i1\
  \ = c;                              // i1 获取 c 的整数值\nint i2 = c+1000;          \
  \          // i2 获取 c 的值加上 1000 后的整数值\ndouble d = i2+7.3;               // d 获取\
  \ i2 加上 7.3 的浮点值\n```\n\n在这里，`i1` 获取了值 `120`，这是在常用的 8 位字符集 ASCII 中字符 `'x'` 的整数值。这是获取字符数字表示法的一种简单方法。要获取\
  \ `i2` 的值，加法使用整数算术完成并得到值 `1120`。`char` 在加法之前被认为*提升*为了 `int`。\n\n同样地，当混合使用浮点数值和整数值时，整数会被提升为浮点数，以给出意料之的结果。在这里，`d`\
  \ 获取了值 `1127.3`。\n\n转换有两种：\n\n* *宽转换（widening）*：保留信息的转换，例如从 `char` 到 `int`。\n* *窄化转换（narrowing）*：可能会丢失信息的转换，例如从\
  \ `int` 到 `char`。\n\n宽转换将一个值转换为相等的值或等于相等值的最佳近似值。宽转换通常是程序员的福音，并简化了代码的编写。\n\n# `XX`\n\
  \n遗憾的是，C++ 也允许隐式窄化转换。我们所说的窄化是指将一个值转换为另一个与原值不相等的类型的值。\n\n考虑 `int` 和 `char`。从 `char`\
  \ 到 `int` 的转换没有窄化问题。然而，`char` 只能存放非常小的整数值。通常，`char` 是一个 8 位字节，而 `int` 是 4 字节：\n\n\
  ![多个数组被赋值给运算符以检查字节计数。一个数组被赋值给运算符 c h a r。四个相邻的数组被赋值给运算符 i n t。](img/f0045-01.jpg)\n\
  \n# `XX`\n\n我们不能将大数字（如 `1000`）放入 `char` 中。这类转换被称为*窄化*，因为它们将一个值放入一个可能太小（“窄”）无法容纳所有值的对象中。遗憾的是，像\
  \ `double` 到 `int` 以及 `int` 到 `char` 这样的转换默认被大多数编译器接受，尽管它们是窄化的。为什么这可能是一个问题？因为我们通常并不怀疑正在发生窄化——即破坏信息的转换。考虑一下：\n\
  \n点击此处查看代码图像\n\n```\ndouble x = 2.7;\n// ... 大量代码 ...\nint y = x;              \
  \      // y 变成 2\n```\n\n当我们把 `x` 赋值给 `y` 时，我们可能已经忘记 `x` 是一个 `double`，或者忘记 `double`到`int`\
  \ 的转换会*截断*（始终向下取整，向零舍入），而不是使用传统的四五舍入（向最近的整数舍入）。发生的情况是有定义的，但在 `y=x;` 中没有任何东西可以提醒我们信息（`.7`）被丢弃了。\n\
  \n为了对转换有感觉并理解为什么必须避免窄化转换，请进行实验。考虑这个程序，它展示了 `double` 到 `int` 的转换以及 `int` 到 `char`\
  \ 的转换在你的机器上是如何实现的：\n\n点击此处查看代码图像\n\n```\nint main()\n{\n         double d = 0;\n\
  \         while (cin>>d) {\n                  cout << \"d=\" << d << endl;\n   \
  \               int i = d;\n                  cout << \"i=\" << i << endl;\n   \
  \               char c = i;\n                  cout << \"c=\" << c << endl;\n  \
  \       }\n}\n```\n\n### 尝试\n\n尝试各种输入：\n\n* 小值（`2` 和 `3`）。\n* 大值（大于 `127`）。\n* 负值。\n\
  * `56`, `89`。\n* 非整数值（例如 `56.9` 和 `56.2`）。\n\n你会发现许多输入在转换时产生了“不合理”的结果。基本上我们试图把一加仑倒进\
  \ 500 毫升的杯子里。\n\n**CC**\n\n为什么人们接受窄化转换？主要原因是历史：C++ 从它的祖先语言 C 继承了窄化转换，因此从第一天起就存在依赖窄化的代码。特别是许多此类转换的值在范围内，而且许多程序员反对“编译器告诉他们该做什么”。它们在较大的程序中可能是错误的来源，也是新手程序员的一个重大问题。幸运的是，编译器会对窄化发出警告——许多编译器都是。\n\
  \n当我们真的需要窄化时，可以使用 `narrow<T>(x)` 来检查 `x` 是否可以缩小为 `T` 而不丢失信息。当我们想要舍入时，可以使用 `round_to<int>(x)`。两者都由\
  \ `PPP_support` 提供。\n\n**CC**\n\n出于历史和实际原因，C++ 提供了四种初始化符号：例如：\n\n点击此处查看代码图像\n\n\
  ```\nint x0 = 7.8;               // 窄化，某些编译器警告\nint x1 {7.8};               // 错误：{}\
  \ 不窄\nint x2 = {7.8};            // 错误：={} 不窄（冗余的 = 是允许的）\nint x3 (7.8);       \
  \        // 窄化，某些编译器警告\n```\n\n`=` 和 `{}` 符号追溯到 C 的早期。当初始化只是复制其初始化器时，我们使用 `=` 符号，而\
  \ `{}` 用于复杂的初始化以及我们需要编译时的窄保护。\n\n```cpp\nint x = 7;\ndouble d = 7.7;\nstring s =\
  \ \"Hello, World\\n\";\n\nvector v = {1, 2, 3, 5, 8 };            // 见 §17.3\npair\
  \ p {\"Hello\",17};                     // 见 §20.2.2\n```\n\n我们将 `()` 初始化留给少数非常特殊的情况（§17.3）。\n\
  \n### 2.10 类型推导：auto\n\n\n\n\n你可能已经注意到定义中存在一些重复。考虑一下：\n\n```cpp\nint x = 7;\ndouble\
  \ d = 7.7;\n```\n\n我们知道 `7` 是一个整数，`7.7` 是一个浮点数，编译器也是如此。那么，我们为什么还要说 `int` 和 `double`\
  \ 呢？嗯，除非我们想这样做，否则我们没有必要；我们可以让编译器从初始化值的类型来推断类型：\n\n点击此处查看图片\n\n```cpp\nauto x = 7;\
  \                  // x 是一个 int（因为 7 是 int）\nauto d = 7.7;               // d 是一个\
  \ double（因为 7.7 是 double）\n```\n\n## AA\n\n这个使用 `auto` 的版本与显式指定类型的版本*完全*相同。当且*仅当*类型从初始化值显而易见且我们不想要任何转换时，我们才使用\
  \ `auto`。\n\n当我们使用较长的类型名（§18.5.2, §20.2.1）以及在泛型编程（§18.1.2）中，`auto` 的便利变得非常显著。例如：\n\
  \n点击此处查看图片\n\n```cpp\nauto z = complex<double>{1.3,3.4};\nauto p = make_unique<Pair<string,int>>{\"\
  Harlem\",10027};     // 一个 unique_ptr<Pair<string,int>> (§18.5.2)\nauto b = lst.begin();\
  \                                                              // lst.begin 是一个\
  \ vector<int>::iterator (§19.3.2)\n```\n\n在此之前，克制过度使用 `auto` 的冲动。过度使用 `auto` 会导致代码晦涩，从而让我们得到不快的惊喜。\n\
