  [4] `sort(b,e)` 使用什么作为排序标准？\n[5] STL 算法如何接受容器作为输入参数？\n[6] STL 算法如何接受容器作为输出参数？\n\
  [7] STL 算法如何指示“未找到”或“失败”？\n[8] 什么是函数对象（function object）？\n[9] 函数对象与函数何不同？\n[10]\
  \ 什么是谓词（predicate）？\n[11] 为什么要使用函数或函数对象而不是 lambda？\n[12] `accumulate()` 是什么？\n[13]\
  \ `inner_product()` 是什么？\n[14] 如果可以直接写循环，为什么要用 `copy()` 算法？\n[15] 什么是二分查找？\n\n####\
  \ 术语\n\n| `accumulate()` | `find_if()` | 搜索 (searching) | 算法 (algorithm) |\n| 函数对象\
  \ (function object) | 序列 (sequence) | 应用 `()` | 通用 (generic) |\n| `set` | `sort()`\
  \ | `iota()` | `find()` |\n| `inner_product()` | 排序 (sorting) | `binary_search()`\
  \ | `upper_bound()` |\n| lambda | `copy()` | `lower_bound()` | 谓词 (predicate) |\n\
  | `unique_copy()` | `copy_if()` | `equal_range()` | 可调用性 (invocable) |\n\n#### 习题\n\
