  \ 0.5*x; }`。\n\n[8] 在其左下端点上方使用 `Text \"0.5x\"` 对斜率进行标记。\n\n[9] 向窗口中添加 `double square(double\
  \ x) { return x*x; }`。\n\n[10] 向窗口中添加一个余弦函数（不要写新函数）。\n\n[11] 将余弦函数设为蓝色。\n\n[12]\
  \ 编写函数 `sloping_cos()`，它向 `slope()`（如上定义）添加一个余弦函数并将其添加到窗口。\n\n类定义练习：\n\n[13] 定义一个\
  \ `struct Person`，包含一个 `string` 类型的名字和一个 `int` 类型的年龄。\n\n[14] 定义一个 `Person` 类型的变量，初始化为“Goofy”和\
  \ 63，并将其写入屏幕（`cout`）。\n\n[15] 为 `Person` 定义输入 (`>>`) 和输出 (`<<`) 运算符；从键盘（`cin`）读取一个\
