  \       p−>prev = n;                     // n 成为 p 的前驱\n       return n;\n}\n```\n\
  \n只要 `p` 确实指向一个 `Link` 且 `p` 指向的 `Link` 确实有一个前驱，这段代码就能运行。请务必确认这确实如此。在思考指针和链式结构（如由\
