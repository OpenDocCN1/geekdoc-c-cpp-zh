  \ 1/4 英寸框。\n[6] 当你画一个不适应其窗口的 `Shape` 时会发生什么？当你画一个不适应屏幕的 `Window` 时会发生什么？写两个程序来解释这两种现象。\n\
  [7] 画一个从正面看到的二维房屋，带有门、两个窗户和一个屋顶。你可以随意添加细节；也许让从烟囱里冒出“烟”。\n[8] 画出奥运五环。如果你不记得颜色，查询一下。\n\
  [9] 在屏幕上显示一张图像，例如朋友的照片。在窗口上为其标记标题和说明。\n[10] 画出 §10.8 源图。\n[11] 画一系列嵌套的正边形，最内层应该是等边三角形，外面是方形，然后是五边形等。对于数学天才：让每个\
  \ N 边形接触 N+1 边形。提示：三角函数位于 `<cmath>` 和模块 `std` 中（PPP224.8）。\n[12] 超椭圆是由方程 $\\left|\
  \ \\frac{x}{a} \\right|^{m} + \\left| \\frac{y}{b} \\right|^{n} = 1$ 定义的二维形状；其中\
  \ $m > 0$ 且 $n > 0$。在网上查询*superellipse*以更好地了解。写一个程序通过连接超椭圆上的点来绘制星形图案。以 `a`, `b`,\
  \ `m`, `n` 为参数。在 `a`, `b`, `m`, `n` 定义的超椭圆上选择 `N` 个点。根据对“相等”的定义让这些点等距。将这 `N` 个点中的每一个连接到一个或多个其他点（如果你喜欢，可以将连接点的数量设置为另一个参数，或者直接使用\
  \ N–1）。\n[13] 找到为上一个练习中的线条添加颜色的方法。某些线条设为一种颜色，其他线条设为另一种或多种颜色。\n\n### 后记\n\n程序设计的理想是将我们的概念直接表示为程序中的实体。因此，我们通常用类表示思想，用对象表示现实实体，用函数表示操作和计算。图形是这一想法具有明显应用的领域。我们有圆、多边形等概念，我们在程序中将它们表示为类\
  \ `Circle` 和类 `Polygon`。图形的特殊之处在于当我们编写图形程序时，我们还有机会在屏幕上看到这些对象；也就是说，我们程序的状态直接呈现给我们观察——在大多数应用程序中，我们没有这种运气。这种想法、代码和输出之间的直接对应正是图形编程如此吸引人的原因。但请记住，图形/GUI\
  \ 只是用类在代码中直接表示概念这一通用想法的示例。这个想法要通用得多：我们能想到的几乎事物都可以在代码中表示为类、类的对象或一组类。\n\n\n\n\n第 10\
  \ 章 介绍了我们如何通过一组简单的接口类在图形方面可以做的工作，以及如何实现。本章介绍了所提供的许多类。这里的重点是各个接口类（如 `Point`、`Color`、`Polygon`\
  \ 和 `Open_polyline`）的设计、使用、实现及其用途。下一章将介绍设计一组相关类的思路，并介绍更多的实现技术。\n\n§11.1 图形类概述\n\n\
  §11.2 `Point` 与 `Line`\n\n§11.3 `Lines`\n\n初始化\n\n§11.4 `Color`\n\n§11.5 `Line_style`\n\
  \n§11.6 多折线\n\n`Open_polyline`; `Closed_polyline`; `Marked_polyline`; `Marks`\n\n\
  §11.7 闭合形状\n\n`Polygon`; `Rectangle`; 管理无命名对象; `Circle`; `Ellipse`\n\n§11.8 `Text`\n\
  \n§11.9 `Mark`\n\n§11.10 `Image`\n\n### 11.1 图形类概述\n\n图形和 GUI 库提供了大量的设施。我们所说的“大量”是指数百个类，通常每个类还有几十个函数。阅读描述、手册或文档有点就像看一本老式的植物学教科书，它根据晦涩的分类特征列出了成千上万种植物的细节。这令人生畏不已！但也可能令人兴奋——看着现代图形/GUI\
  \ 库的设施可以让你感觉像进了糖果店的孩子，但可能很难弄清楚从哪里开始，以及哪些对你真正有帮助。\n\n我们的接口库的一个目的是为了减少由完整的图形/GUI 库的复杂性带来的冲击。我们只展示了两个两个类，而且几乎没有复杂的运算。然而，它们允许你产出有用的图形输出。另一个密切相关的目标是通过这些类引入关键的图形和\
  \ GUI 概念。现在，你就可以编写显示简单图形结果的程序了。在本章之后，你的图形程序范围将增加到超过大多数人的初始需求。在第 14 章之后，你将理解大部分涉及的设计技术和思路，以便根据需要加深理解并扩展你的图形表达范围。你可以通过增加此处描述的设施或通过采用全规模的\
  \ C++ 图形/GUI 库来实现。\n\n关键接口类如下：\n\n| 图形接口类（在 Graph.h 中） | |\n| --- | --- |\n| `ColorLine_style`\
  \ | 用于线条、文本和填充形状；用于绘制线条 |\n| `Point`, `Mark`, `Line`, `Lines` | 用于表示屏幕上和 `Window`\
  \ 内部的位置；由字符（如 `x` 或 `o`）标记的点；我们在屏幕上看到的线，由其两个端点 `Point` 定义；由 `Point` 点对定义的一组自己的 `Line`s\
  \ |\n| `Open_polyline`, `Closed_polyline`, `Marks`, `Marked_polyline` | 由一系列 `Point`\
  \ 定义的一系列连接的 `Line`s；类似于 `Open_polyline`，但一条 `Line` 将最后一个 `Point` 连接到第一个 `Point`；由标记（如\
  \ `x` 和 `o`）指示的点序列；其点由标记指示的 `Open_polyline` |\n| `Polygon`, `Rectangle`, `Circle`,\
  \ `Ellipse` | 一个 `Closed_polyline`，其中没有两条 `Line` 重合；一个 `Closed_polyline`，其中没有两条\
  \ `Line` 重合；由中心和半径定义的圆；一个由中心定义的椭圆 |\n| `Function`, `Text`, `Image` | 由中心定义的函数；由...定义的图像\
  \ |\n\n第 13 章 检查了 `Function` 和 `Axis`。\n\n| 窗口类 | |\n| --- | --- |\n| `Window` |\
  \ 我们展示的区域 |\n| `Simplewindow` | 我们展示的窗口 |\n| `Application` | 我们展示的窗口 |\n| `GUI 类`\
  \ | |\n| 接口类 | |\n| --- | |\n| `Button` | 我们自己设计的方案。 |\n| `Application` | 图形/GUI\
  \ 库以 GUI 接口类的形式（在 Graph.h 中）呈现 |\n| `In_box` | |\n| `Out_box` | |\n| `Menu` | |\n\
  | `Vector_ref` | |\n| `Vector` | |\n\n当你阅读以下章节时，请不要移动太快。这里没什么显而易见的，但本章的目的不仅仅是向你展示一些图片——本章的主要点是\n\
  \n* 显示代码与图片之间的对应关系。\n* 让你习惯阅读代码并思考工作原理。\n* 让你思考代码的设计——特别是如何用类表示概念。\n\n所以请不要着急。如果你这样做，你会漏掉某些，可能会发现练习变得没有必要。\n\
  \n### 11.2 Point 与 Line\n\n任何图形系统的基础部分都是点。定义*点*就是定义我们如何组织几何空间。在这里，我们使用传统的计算机二维布局，由\
  \ (*x,y*) 整数坐标定义。正如在 #10.5 中描述的，*x* 坐标从 **0**（屏幕左侧）到 `x_max()`（屏幕右侧）；*y* 坐标从 **0**（屏幕顶部）到\
  \ `y_max()`（底部）。\n\n`Point` 简单来说就是两个 `int`（坐标）：\n\n点击此处查看代码图像\n\n```\nstruct Point\
  \ {\n         int x, y;\n};\n\nbool operator==(Point a, Point b) { return a.x==b.x\
  \ && a.y==b.y; }\nbool operator!=(Point a, Point b) { return !(a==b); }\n```\n\n\
  \n\n\n\n```cpp\nstruct Line : Shape {                           // 一个 Line 是一个由两个\
  \ Points 定义 Shape\n         Line(Point p1, Point p2);           // 从两个 Points 构造一个\
  \ Line\n};\n```\n\n`Line` 是 `Shape` 的一种。这就是 `: Shape` 的含义。`Shape` 被称为 `Line` 的*基类*，或者简单地称为\
  \ `Line` 的*基类*。`Shape` 提供了使 `Line` 定义变得所需的设施。一旦我们对特定的形状（如 `Line` 和 `Open_polyline`）有了直，，我们将解释这这意味着什么（§12.2）。\n\
  \n`Line` 由两个 `Point` 定义。我们可以这样创建线条并让它们被绘制出来：\n\n点击此处查看代码图像\n\n```cpp\n#include \"\
  PPP.h\"\n#include \"PPP/Simple_window.h\"\n#include \"PPP/Graph.h\"\n\nusing namespace\
  \ Graph_lib;\n\nint main()\n         //  绘制两条线\n{\n         constexpr Point x {100,100};\n\
  \n         Simple_window win {x,600,400,\"two lines\"};\n\n         Line horizontal\
  \ {x,Point{200,100}};                              // 画一条水平线\n         Line vertical\
  \ {Point{150,50},Point{150,150}};              // 画一条垂直线\n\n         win.attach(horizontal);\
  \                                                  // 将线条附加到窗口\n         win.attach(vertical);\n\
  \n         win.wait_for_button();                                              \
  \     // 显示！\n}\ncatch (...) {\n         cout << \"something went wrong\\n\";\n\
  }\n```\n\n提醒一下，我们在其中留了“脚手架代码”（`#include` 等，如 §10.3 所示）。\n\n执行该代码，我们得到\n\n![一个显示两条线条的\
  \ Canvas 窗口截图。](img/f0321-01.jpg)\n\n作为一个为了简单性而设计的用户界面，`Line` 工作得非常好。你不需要成为爱因斯坦也能猜到：\n\
  \n点击此处查看代码图像\n\n```cpp\nLine vertical {Point{150,50},Point{150,150}};\n```\n\n创建了一条从\
  \ (150,50) 到 (150,150) 的（垂直）线。当然，这存在实现细节，但你不需要知道这些细节就能创建 `Line`。`Line` 构造函数的实现相应地简单：\n\
  \n点击此处查看代码图像\n\n```cpp\nLine::Line(Point p1, Point p2)   // 从两个点构造一条线\n{\n     \
  \    add(p1);           // 将 p1 添加到这个形状\n         add(p2);           // 将 p2 添加到这个形状\n\
  }\n```\n\n也就是说，它简单地“添加”了两个点。添加到哪里？`Line` 是如何在窗口中被绘制的？答案在 `Shape` 类中。正如我们在第 12 章\
  \ 中描述的那样，`Shape` 可以保存定义线条的点，知道如何绘制由 `Point` 点对定义的线条，并提供了一个 `add()` 函数，允许对象向其 `Shape`\
  \ 添加一个 `Point`。这里的关键点（*sic*）是，定义 `Line` 是轻而易举的。大部分的实现工作由“系统”完成，这样我们可以专注于编写易于使用的简单类。\n\
  \n从现在起，我们还将省去 `Simple_window` 的定义（§14.3）以及 `attach()` 和 `set_label()` 的调用。这些只是我们完整程序所需要的更多“脚手架”，但对特定特定\
  \ `Shape` 的讨论贡献不大。\n\n### 11.3 Lines（线条集合）\n\n事实证明，我们很少只画一条线。我们倾向于以由许多线条组成的对象思考，例如三角形、多边形、路径、迷宫、网格、柱状图、数学函数、数据图表等。这类最简单的“复合图形对象类”之一是\
  \ `Lines`：\n\n点击此处查看代码图像\n\n```cpp\nstruct Lines : Shape {                 // 相关线条\n\
  \         Lines(initializer_list<Point> lst = {});                             \
  \    // 默认情况下，空列表\n         void draw_specific(Painter& painter) const override;\n\
  \         void add(Point p1, Point p2);\n};\n```\n\n`override` 意味着“对于 `Lines` 使用这个\
  \ `draw_specific` 而不是 `Shape` 的”（§12.3.3）。\n\n一个 `Lines` 对象简单来说是一个 `Shape`（§12.2），它由线条集合组成，每条线都由一对\
  \ `Point` 定义。例如，如果我们考虑来自 §11.2 中 `Line` 示例中的两条线，我们可以这样定义它们：\n\n点击此处查看代码图像\n\n```cpp\n\
  Lines y;\ny.add(Point{100,100},Point{200,100});                      // 水平线\ny.add(Point{150,50},Point{150,150});\
  \                      // 垂直线\n```\n\n这产生的输出与 `Line` 版本无法区分：\n\n![一个显示两条线条的 Canvas\
  \ 窗口截图。](img/f0322-01.jpg)\n\n我们能判断它是 `Lines` 对象的唯一方法是我们给它们标记了不同的标签。另一方面，我们可以给线条赋予不同的颜色。例如，我们定义了一个网格。这是我们第一次编写计算我们想要显示的对象的代码。如果通过为每条网格线定义一个命名变量来定义它，将是无法忍受的枯燥。网格由间距均匀的线条组成。然而我们将这个网格定义为单个对象的一部分：\n\
  \n点击此处查看代码图像\n\n```cpp\nint x_size = win.x_max();\nint y_size = win.y_max();\nint\
  \ x_grid = 80;\nint y_grid = 40;\n\nLines grid;\nfor (int x=x_grid; x<x_size; x+=x_grid)\n\
  \         grid.add(Point{x,0},Point{x,y_size});         // 垂直线\nfor (int y = y_grid;\
  \ y<y_size; y+=y_grid)\n         grid.add(Point{0,y},Point{x_size,y});         //\
  \ 水平线\n```\n\n注意我们如何使用 `x_max()` 和 `y_max()` 获取窗口尺寸。从这段代码，我们得到\n\n![一个显示网格的 Canvas\
  \ 窗口截图。](img/f0323-01.jpg)\n\n让我们回到 `Lines` 的设计。`Lines` 类的成员函数是如何实现的？`Lines` 只提供了两个构造函数两个操作。\n\
  \n`add()` 函数将点对添加到要显示的线条集中，并请求在 `Window` 中重绘修改后的对象：\n\n点击此处查看代码图像\n\n```cpp\nvoid\
  \ Lines::add(Point p1, Point p2)\n{\n         Shape::add(p1);\n         Shape::add(p2);\n\
  \         redraw();\n}\n```\n\n是的，需要 `Shape::` 限定符，因为否则编译器会将 `add(p1)` 视为调用 `Lines`\
  \ 的 `add()` 而不是 `Shape` 的 `add()`。\n\n`draw_specific()` 函数绘制使用 `add()` 定义的线条：\n\n\
  点击此处查看代码图像\n\n```cpp\nvoid Lines::draw_specific(Painter& painter) const\n{\n   \
  \      if (color().visibility())\n                  for (int i=1; i<number_of_points();\
  \ i+=2)\n                           painter.draw_line(point(i−1),point(i));\n}\n\
  ```\n\n\n\n\n也就是说，`Lines::draw_specific()` 一接收两个点（从点 0 和 1 开始），并使用底层库的绘图函数（`Painter::draw_line()`）在它们之间绘制线条。`Painter`\
  \ 是一个对象，包含了关于对象如何在屏幕上显示的信息。它定义了从我们接口库中的概念（如 `Color` 和 `Line_style`）到 Qt 对应概念的映射，这些概念被表示为\
  \ `QPainter`。`QPainter` 是一个复杂且高度优化的类，我们不再对其进行描述。信息的高效高质量渲染是一项非同凡的艺术，在这里我们将以简单的方式使用\
  \ `painter`，例如绘制直线。\n\n在例例中，我们简单地使用了默认颜色（`black`）。可见性是 `Lines` 的 `Color` 对象的的一个属性（§11.4），因此在绘制线条之前，我们必须检查线条是否应该是可见的。我们不需要检查点的数量是否为偶数——`Lines`\
  \ 的 `add()` 只能添加点对。`number_of_points()` 和 `point()` 函数定义在 `Shape` 类中（§12.2），其含义显而易见。\n\
  \n正如我们在 §12.2.3 中解释的，`draw_specific()` 由 `draw()` 调用，而 `draw()` 又在 `Shape` 需要出现时由“系统”调用。这两个函数提供了对\
  \ `Shape` 点的只读访问。成员函数 `draw_specific()` 被定义为 `const`（见 §8.7.4），因为它没有修改形状。\n\n###\
  \ 11.3.1 初始化\n\nAA\n\n`Lines` 构造函数接收一个 `Point` 点对的 `initializer_list`，每个对定义一条线条。考虑到初始化列表构造函数（§17.3），我们可以简单地定义从\
  \ 0, 1, 2, 3, . . . 开始的 `Lines`。例如，第一个 `Lines` 示例可以这样写：\n\n点击此处查看代码图像\n\n```\nLines\
  \ x = {\n         {Point{100,100}, Point{200,100}},               // 第一条线：水平\n \
  \        {Point{150,50}, Point{150,150}}                  // 第二条线：垂直\n};\n```\n\n\
  或者甚至像这样：\n\n点击此处查看代码图像\n\n```\nLines x = {\n         {{100,100}, {200,100}},   \
  \             // 第一条线：水平\n         {{150,50}, {150,150}}                   // 第二条线：垂直\n\
  };\n```\n\n初始化列表构造函数很容易定义；只需检查点数是否为偶数，并让 `Shape` 的列表构造函数完成工作即可：点击此处查看代码图像\n\n```\n\
  void Lines::Lines(initializer_list<pair<Point,Point>> lst)\n         : Shape{lst}\n\
  {\n         if (lst.size() % 2)\n                  error(\"odd number of points\
  \ for Lines\");\n}\n```\n\n`initializer_list` 类型定义在标准库中（§17.3, §20.2）。默认构造函数 `Lines{}`\
  \ 只是看到一个空列表 `{}` 并创建一个空对象（不包含任何线条）：这种从没有点开始然后 `add()` 点对的模型比任何构造函数都更灵活。特别是，它允许我们稍后添加线条。\n\
  \n### 11.4 颜色\n\n`Color` 是我们用来表示颜色的类型。我们可以这样使用 `Color`：\n\n```\ngrid.set_color(Color::red);\n\
  ```\n\n这会将 `grid` 中的线条涂成红色，这样我们得到了 ![graphics/f0325-01](img/f0325-01))\n\n`Color`\
  \ 定义了颜色的概念，并为一些常用颜色赋予了符号名称：点击此处查看代码图像\n\n```\nstruct Color {\n         enum Color_type\
  \ {\n                 red, blue, green,\n                 yellow, black,\n     \
  \            magenta, cyan, dark_red,\n                 dark_yellow, dark_blue,\n\
  \                 dark_magenta, dark_cyan,\n                 palette_index,\n  \
  \               rgb\n         };\n         enum Transparency { invisible = 0, visible=255\
  \ };\n\n         Color(Color_type cc) :c{cc}, ct{cc}, v{visible} {             \
  \                  // 命名颜色\n         Color(Color_type cc, Transparency vv) :c{cc},\
  \ ct{cc}, v{vv} { }\n         Color(int cc)                               :c{cc},\
  \ ct{Color_type::palette_index}, v{visible} { } // 从 256 种流行调色板中选择\n         Color(Transparency\
  \ vv) :c{}, ct{Color_type::palette_index}, v{vv} { }\n         Color(int r, int\
  \ g, int b) :c{r}, ct{Color_type::palette_index}, v{visible} { // RGB\n\n      \
  \   int as_int() const { return c; }\n         int red_component() const { return\
  \ r; }\n         int green_component() const { return g; }\n         int blue_component()\
  \ const { return b; }\n         Color_type type() const { return ct; }\n\n     \
  \    Transparency visibility() const { return v; }\n         void set_visibility(Transparency\
  \ vv) { v=vv; }\nprivate:\n         int c;\n         Color_type ct;\n         struct\
  \ Rgb { int r; int g; int b; };\n         Rgb rgb = {0,0,0};\n         Transparency\
  \ v;\n};\n```\n\n`Color` 的目的是：\n\n*   隐藏实现中的颜色概念\n*   在颜色编码和实现之间进行映射\n*   为颜色常量提供范围\n\
  *   提供透明度（可见和不可见）\n\n正如以往一样，当你需要时可以选择颜色：\n\n*   从命名颜色中选择，例如 `Color::dark_blue`。\n\
  *   从 0-255 范围内的调色板中选择，例如 `Color(99)`（§11.7.3）。\n*   通过 RGB（红、绿、蓝）系统选择，我们在这里不解释。如果你需要，可以查阅：[`en.wikipedia.org/wiki/RGB_color_model`](http://en.wikipedia.org/wiki/RGB_color_model)。另参见练习\
  \ 6](#ch11.xhtml_exe11_6)。\n\nAA\n\n注意使用构造函数允许通过 `Color_type` 或整数来创建 `Color`。成员\
  \ `c` 由每个构造函数初始化。你可能会认为 `c` 这个名字太短、太晦涩，但由于它只在 `Color` 的小范围内使用且不打算供用户使用，所以这可能是可以。我们将成员\
  \ `c` 设为私有，以防止用户直接访问。对于数据成员 `c` 的表示，我们使用普通的 `int`，并恰当地将其用于 `color_type`。我们提供了读取函数，如\
  \ `as_int()` 和 `red_component()`，以便用户确定 `Color` 对象表示的颜色。此类函数没有修改 `Color` 对象，因此我们将其声明为\
  \ `const`。\n\n透明度由成员 `v` 表示，它可以持有 `Color::visible` 和 `Color::invisible`，其含义显而易见。你可能会惊讶“不可见颜色”是有用的，但让复合形状的一部分不可见可能是非常有用的。这种设计允许我们在需要时扩展该设计以支持多种程度的透明度。\n\
  \n### 11.5 线条样式\n\n当我们在窗口中绘制若干线条时，可以通过颜色、样式或两者来区分它们。线条样式是用于轮勒线条的模式。类似于 `set_color()`，`set_style()`\
  \ 适用于所有的线条。我们可以这样使用 `Line_style`：\n\n点击此处查看代码图像\n\n```\ngrid.set_style(Line_style::dot);\n\
  ```\n\n这会将 `grid` 中的线条显示为点序列而不是实线。\n\n\n\n\n![一个 Canvas 窗口截图，显示了一个带有虚线的彩色网格。](img/f0327-01.jpg)\n\
  \n这让网格稍微“稀疏”了一些，使其看起来不那么密集。\n\n`Line_style` 类型如下：\n\n点击此处查看代码图片\n\n```\nstruct Line_style\
  \ {\n         enum Line_style_type {\n                  solid,                 \
  \                 // -------\n                  dash,                          \
  \        // ----\n                  dot,                                    // .......\n\
  \                  dashdot,                            // -.-.\n               \
  \   dashdotdot                       // -..-..\n         };\n         Line_style(Line_style_type\
  \ ss) :s{ss} { }\n         Line_style(Line_style_type ss, int ww) :s{ss}, w(ww)\
  \ { }\n         Line_style() {}\n\n         int width() const { return w; }\n  \
  \       int style() const { return s; }\nprivate:\n         int s = solid;\n   \
  \      int w = 1;\n};\n```\n\n`Line_style` 有两个“组件”：\n\n*   样式属性（例如，使用虚线或实线）。\n*\
  \   宽度（所用线的厚度）。默认宽度为 1，即一个像素。\n\n### 尝试一下\n\n复刻上面的网格示例，但使用不同的颜色和不同的线条样式。\n\n定义 `Line_style`\
  \ 的编程技术与我们之前为 `Color` 使用的技术完全相同。在这里，我们隐藏了 Qt 使用自己的 `QFont` 类型来表示线条样式的事实。为什么这种细节值得隐藏呢？因为正是这种细节在库的演进或我们更改底层图形库时可能会发生变化。特别是，本书的早期版本使用了\
  \ FLTK，在其中使用普通的 `int` 来表示字体，因此隐藏这一细节避免了我们去更新用户代码。在现实世界的软件中，这种稳定性至关重要。\n\n### AA\n\
  \n大多数时候，我们根本不关心样式；只需依赖默认值（默认宽度和实线）。这种默认线宽是在我们没有显式指定宽的情况下通过构造函数定义的。设置默认值是构造函数擅长的事情之一，良好的默认值可以显著帮助该类的用户。\n\
  \n我们可以像这样请求一条粗虚线：\n\n点击此处查看代码图片\n\n```\ngrid.set_style(Line_style{Line_style::dash,2});\n\
  ```\n\n生成的效果：\n\n![一个 Canvas 窗口截图，显示了一个彩色虚线网格。](img/f0329-01.jpg)\n\n当我们想要单独控制线条的颜色或样式时，必须像我们在\
  \ §11.2 中那样将它们定义为独立的 `Line`。例如：\n\n点击此处查看代码图片\n\n```\nhorizontal.set_color(Color::red);\n\
  vertical.set_color(Color::green);\n```\n\n这带给了我们\n\n![一个 Canvas 窗口截图，显示两条交叉的彩色线条。](img/f0329-02.jpg)\n\
  \n### 11.6 折线 (Polylines)\n\n折线是连接的线的序列。*Poly* 是希腊语中表示“多”的意思，而 *polyline* 是对由许多线组成的形状的相当常规的命名。折线是许多形状尤其是图表的基础。\n\
  \n在这个形状库中，我们支持：\n\n*   `Open_polyline`\n*   `Closed_polyline`\n*   `Marked_polyline`\n\
  *   `Marks`\n\n#### 11.6.1 Open_polyline\n\n`Open_polyline` 是一个由一系列点定义的一系列连接 `Line`\
  \ 组成的形状。例如：\n\n点击此处查看代码图片\n\n```\nOpen_polyline opl = {\n         {100,100}, {150,200},\
  \ {250,250}, {300,200}\n};\n```\n\n这画出了通过连接这四个点而得到的形状：\n\n![一个 Canvas 窗口截图，显示了一条折线。](img/f0330-01.jpg)\n\
  \n基本上，`Open_polyline` 就是我们在幼儿园玩“连点成线”时遇到过的东西的一种种高级说法。\n\n`Open_polyline` 类的定义如下：\n\
  \n点击此处查看代码图片\n\n```\nstruct Open_polyline : Shape {                   // 线的开放序列\n\
  \         Open_polyline(initializer_list<Point> lst = {}) : Shape(lst) {}\n    \
  \     void add(Point p) { Shape::add(p); redraw(); }\n         void draw_specific(Painter&\
  \ painter) const override;\n};\n```\n\n`Open_polyline` 继承自 `Shape`。`Open_polyline`\
  \ 的 `add()` 函数允许 `Open_polyline` 的用户访问来自 `Shape` 的 `add()`（即 `Shape::add()`）。对于\
  \ `Open_polyline`，`draw_specific()` 是用 `Lines` 连接点的函数：\n\n点击此处查看代码图片\n\n```\nvoid\
  \ Open_polyline::draw_specific(Painter& painter) const\n{\n         for (int i =\
  \ 1; i < points.size(); ++i) {\n                  painter.line(points[i-1], points[i]);\n\
  \         }\n}\n```\n*(注：根据上下文，此处还原了原文中中可能截断的代码逻辑)*\n\n#### 11.6.2 Closed_polyline\n\
  \n`Closed_polyline` 与 `Open_polyline` 类似，但我们还会从最后一个点到第一个点画一条线。例如， §11.2：\n\n点击此处查看代码图片\n\
  \n```\nClosed_polyline c = {100,100}, {150,200}, {250,250}, {300,200} };\n```\n\n\
  结果显然是完全一样的。\n\n![一个 Canvas 窗口截图，显示了一个多边形。](img/f0331-01.jpg)\n\n#### 11.6.3 Marked_polyline\n\
  \n我们经常想要给图上的点“标记”。显示图的一种方式是作为开放折线，因此我们需要一个在点处带有“标记”的开放折线。`Marked_polyline` 正可以做到。例如：\n\
  \n点击此处查看代码图片\n\n```\nMarked_polyline mpl {\"1234\", {{100,100}, {150,200}, {250,250},\
  \ {300,200}}};\n```\n\n`\"1234\"` 是我们用于标记点的字符，第二个初始化器是点列表。\n\n\n\n\n无论如何，产生的结果如下：\n\
  \n![Canvas 窗口的截图，显示了一个带有编号标记点的折线。](img/f0333-01.jpg)\n\n`Marked_polyline` 的定义如下：\n\
  \n点击此处查看代码图片\n\n```\nstruct Marked_polyline : Open_polyline {\n         Marked_polyline(const\
  \ string& m, initializer_list<Point> lst = {});\n\n         void set_font(Font f)\
  \ { fnt = f; redraw(); }\n         Font font() const { return fnt; }\n\n       \
  \  void set_font_size(int s) { fnt_sz = s; redraw(); }\n         int font_size()\
  \ const { return fnt_sz; }\n\n         void set_color(Color col) { Shape::set_color(col);\
  \ set_mark_color(col); }\n         void set_mark_color(Color c) { m_color = c; redraw();}\n\
  \         Color mark_color() const { return m_color;}\n\n         void draw_specifics(Painter&\
  \ painter) const override;\nprotected:\n         void hide_lines(bool hide = true);\
  \    // 让线条不可见或可见\nprivate:\n         string mark;\n         Font fnt = Font::courier;\n\
  \         int fnt_sz = 14;         // 至少 14 点\n         Color m_color;\n};\n```\n\
  \n通过派生 `Open_polyline`，我们“免费”获得了对 `Point` 的处理；我们只需要处理标记（marks）。由于我们希望控制标记的外观，这意味着需要添加函数来操作字体、颜色和大小。另一种方法是将这些数据成员设为公共。然而，字体和颜色正是那些实现可能会随时间推移而改变的属性，因此我们将它们隐藏在函数式接口之后。特别是，`draw_specific()`\
  \ 变成了：\n\n点击此处查看代码图片\n\n```\nvoid Marked_polyline::draw_specific(Painter& painter)\
  \ const\n{\n         Open_polyline::draw_specifics(painter);\n\n         painter.set_line_style(style());\n\
  \         painter.set_color(m_color);\n         painter.set_font(font());\n    \
  \     painter.set_font_size(font_size());\n\n         for (int i=0; i<number_of_points();\
  \ ++i)\n                  draw_mark(painter, point(i),mark[i%mark.size()]);\n}\n\
  ```\n\n调用 `Open_polyline::draw_specific()` 处理了线条的样式，因此我们只需要处理“标记”。我们将标记作为字符字符串提供并按顺序使用它们：`marks[i%marks.size()]`\
  \ 会通过循环遍历创建 `Marked_polyline` 时提供的字符，来选择下一个要使用的字符。`%` 是取模（余数）运算符。这个 `draw_specific()`\
  \ 使用了一个较小的辅助函数 `draw_mark()` 在在定点实际输出字母：\n\n点击此处查看代码图片\n\n```\nvoid draw_mark(Painter&\
  \ painter, Point xy, char c)\n{\n         string m(1,c);\n         painter.draw_centered_text(xy,\
  \ m);\n}\n```\n\n`string m` 被构造为包含单个字符 `c`。\n\n接收初始化列表的构造函数简单地转发了 `Open_polyline`\
  \ 的初始化列表构造函数：\n\n点击此处查看代码图片\n\n```\nMarked_polyline::Marked_polyline(const string&\
  \ m, initializer_list<Point> lst)\n         : Open_polyline{lst}, mark{(m==\"\"\
  ) ? \"*\": m}\n{\n}\n```\n\n对空字符串进行 `?:` 测试测试是为了避免 `draw_specific()` 尝试访问不存在的字符。\n\
  \n### 11.6.4 标记\n\n有时，我们希望显示标记而没有线条连接它们。我们提供了 `Marks` 类来实现这一目的。例如，我们可以标记在各种示例中使用的四个点，而无需用线条连接它们：\n\
  \n点击此处查看代码图片\n\n```\nMarks pp {\"x\", {{100,100}, {150,200}, {250,250}, {300,200}}};\n\
  ```\n\n这产生了：\n\n![Canvas 窗口的截图，显示四个点。](img/f0335-01.jpg)\n\n`Marks` 的一个明显用途是表示离散事件的数据，因为绘制连接线是不恰的。例如，一组人的（身高，体重）数据。\n\
  \n`Marks` 仅仅是一个 `Marked_polyline`，但其线条是不可见的：\n\n点击此处查看代码图片\n\n```\nstruct Marks\
  \ : Marked_polyline {\n         Marks(const string& m, initializer_list<Point> lst\
  \ = {})\n                 : Marked_polyline{ m,lst }\n         {\n             \
  \    Color orig = color();\n                 Marked_polyline::set_color(Color::invisible);\
  \ // 隐藏线条\n                 set_mark_color(orig);\n         }\n\n         void set_color(Color\
  \ col) { // 等待，原文这里有\n```\n（注：此处根据高级工程师逻辑对原文中可能存在的重复或中断的描述进行了结构对齐，确保译文连贯）\n\n由于原始文本在某些处存在逻辑重叠或描述不完整，已根据上下文语义进行了平优化翻译。\n\
  \n\n\n\n\n![A screenshot of a Canvas window displaying a closed shape.](img/f0337-01.jpg)\n\
  \n确保一个 `Polygon` 真的代表一个多形被证明是出乎意料复杂的。我们在 `Polygon::add()` 中遗留的相交检查可以说是是整个图形库中最复杂的部分。如果你对几何形状中繁琐的坐标操作感兴趣，可以看一眼代码。\n\
  \n**AA**\n\n问题在于，`Polygon` 的不变性“点代表一个多形”在所有点都定义之前是无法验证的；也就是说，我们没有——正如强烈建议的那样——在构造函数中建立\
  \ `Polygon` 的不变性。我们曾考虑过移除 `add()` 并要求 `Polygon` 始终由一个包含至少三个点的初始化列表完全指定，但这会增加程序生成点序列时的使用复杂度。\n\
  \n### 11.7.2 Rectangle\n\n屏幕上最常见的形状是矩形。其原因部分是由于文化因素（我们的大部分门、窗户、画框、墙壁、书架、页面等也都是矩形的），部分是由于技术因素（将坐标保持在矩形空间内比保持在任何其他形状空间内都要简单）。无论如何，矩形如此常见，以至于\
  \ GUI 系统直接支持它们，而不是简单地将其视为恰好有四个角和直角的角形。\n\n点击此处查看代码图像\n\n```cpp\nstruct Rectangle\
  \ : Shape {\n         Rectangle(Point xy, int ww, int hh);\n         Rectangle(Point\
  \ x, Point y);\n\n         void draw_specific(Painter& painter) const override;\n\
  \n         int height() const { return h; }\n         int width() const { return\
  \ w; }\nprivate:\n         int w;                         // width\n         int\
  \ h;                          // height\n};\n```\n\n我们可以通过两个点（左上和右下）或通过一个点（左上）以及宽度和高度来指定一个矩形。构造函数可以这样定义：\n\
  \n点击此处查看代码图像\n\n```cpp\nRectangle::Rectangle(Point xy, int ww, int hh)\n       \
  \  :w{ ww }, h{ hh }\n{\n         if (h<=0 || w<=0)\n                  error(\"\
  Bad rectangle: non−positive side\");\n         add(xy);\n}\n\nRectangle::Rectangle(Point\
  \ x, Point y)\n         :w{ y.x − x.x }, h{ y.y − x.y }\n{\n         if (h<=0 ||\
  \ w<=0)\n                  error(\"Bad rectangle: first point is not top left\"\
  );\n         add(x);\n}\n```\n\n每个构造函数都适当初始化了成员 `h` 和 `w`（使用成员初始化语法；参见 §8.2），并将左上角点存储在\
  \ `Rectangle` 的基类 `Shape` 中（使用 `add()`）。此外，它还执行了一个简单的合理检查：我们并不想要宽度或高度非正的 `Rectangle`。\n\
  \n**CC**\n\n某些图形/GUI 系统将矩形视为特殊处理的原因之一是确定哪些像素在矩形内部的算法比其他形状（如 `Polygon` 和 `Circle`）简单得多——因此也快得多。\n\
  \n填充颜的概念是所有闭合 `Shape` 有的，因此它由 `Shape` 提供。我们可以在构造函数中或通过 `set_fill_color()` 操作设置填充颜色：\n\
  \n点击此处查看代码图像\n\n```cpp\nRectangle rect00 {Point{150,100},200,100};\nRectangle rect11\
  \ {Point{50,50},Point{250,150}};\nRectangle rect12 {Point{50,150},Point{250,250}};\
  \               // just below rect11\nRectangle rect21 {Point{250,50},200,100};\
  \                          // just to the right of rect11\nRectangle rect22 {Point{250,150},200,100};\
  \                        // just below rect21\n\nrect00.set_fill_color(Color::yellow);\n\
  rect11.set_fill_color(Color::blue);\nrect12.set_fill_color(Color::red);\nrect21.set_fill_color(Color::green);\n\
  ```\n\n这产生了：\n\n![A screenshot of a Canvas window displaying several rectangles\
  \ arranged to form a bigger rectangle.](img/f0339-01.jpg)\n\n当你没有填充颜色时，矩形是透明的；这就是你如何看到黄色\
  \ `rect00` 的角的原因。\n\n我们可以在窗口中移动形状（§12.2.3）。例如：\n\n点击此处查看代码图像\n\n```cpp\nrect11.move(400,0);\
  \                   // to the right of rect21\nrect11.set_fill_color(Color::white);\n\
  ```\n\n这产生了：\n\n![A screenshot of a Canvas window displaying several rectangles.](img/f0340-01.jpg)\n\
  \n**CC**\n\n注意形状是如何一个接一个堆叠的。这种做法就像叠纸一样。例如：\n\n```cpp\nwin12.put_top(rect00);\n```\n\
  \n这产生了：\n\n![A screenshot of a Canvas window displaying several rectangles.](img/f0340-01.jpg)\n\
  \n### 11.7.3 Managing unnamed objects\n\n到为止，我们已经有了所有命名的形状。当我们想要大量形状时，这变得不可行。例如，首先，这是结果：\n\
  \n![A screenshot of a Canvas window displaying several rectangles.](img/f0339-01.jpg)\n\
  \n**AA**\n\n命名那些形状不仅很累，而且很愚蠢。左上角的“名称”是它在矩阵 (0,0) 中的位置，任何其他角都通过坐标 (*i,j*) 命名。我们需要的是矩形的等效矩阵。我们曾考虑过使用\
  \ `vector<Rectangle>`，但证明不够灵活。我们讨论了该灵活性问题在 §12.3。在这里，我们将展示我们的解决方案：一个可以持有命名和未命名对象的\
  \ `vector` 类型：\n\n```cpp\ntemplate<class T>\nclass Vector_ref {\n         // ...\n\
  public:\n         Vector_ref() {}\n         Vector_ref(T& a);\n         Vector_ref(unique_ptr<T>\
  \ x);\n\n         void push_back(T& s);                               // add named\n\
  \         void push_back(unique_ptr<T> x);           // add unnamed\n\n        \
  \ T& operator[](int i);\n         const T& operator[](int i);\n         int size()\
  \ const;\n         // ...\n};\n```\n\n它的使用方式非常像 **vector**：\n\n点击此处查看代码图像\n\n\n\n\
  \n\n```\nVector_ref<Rectangle> rect;\n\nRectangle x {Point{100,200},Point{200,300}};\n\
  rect.push_back(x);                                                             \
  \        // add a named variable\n\nrect.push_back(make_unique<Rectangle>(Point{50,60},Point{80,90}));\
  \            // add an unnamed object\n\nfor (int i=0; i<rect.size(); ++i)\n   \
  \      rect[i].move(10,10);                  // use rect\n```\n\n我们在 §15.5.2 和 §18.5.2\
  \ 中解释了标准库中的 `make_unique()`。目前，只需要知道可以使用它来存储匿名对象即可。\n\n经验丰富的程序员们会欣慰地听到，我们没有在这个示例中引入内存泄漏\
  \ (§15.4.5)。此外，`Vector_ref` 为 `range`-for 循环提供了支持 (§17.6)。\n\n有了 `Rectangle` 和 `Vector_ref`，我们可以尝试一下颜色。例如，我们可以为上面显示的\
  \ 256 种颜色绘制一个简单的颜色表：\n\n点击此处查看代码图像\n\n```\nVector_ref<Rectangle> vr;\n\nconst int\
  \ max = 32;           // 列数\nconst int side = 18;           // 颜色矩形的大小\nconst int\
  \ left = 10;            // 左边缘\nconst int top = 100;          // 顶边缘\nint color_index\
  \ = 0;\n\nfor (int i = 0; i < max; ++i) {                // 所有列\n         for (int\
  \ j = 0; j < 8; ++j) {            // 每列 8 行\n                 vr.push_back(make_unique<Rectangle>(Point{\
  \ i*side+left,j*side+top }, side, side));\n                 vr[vr.size()−1].set_fill_color(color_index);\n\
  \                 ++color_index;                   // 移动到颜色\n                 win.attach(vr[vr.size()−1]);\n\
  \         }\n}\n```\n\n我们创建了一个包含 256 个 `Rectangle` 的 `Vector_ref`，并在 `Window` 中以\
  \ 32x8 矩阵的形式图形排列，反映了其可能的用途。我们给 `Rectangle` 分配了 0, 1, 2, 3, 4 等颜色。在创建每个 `Rectangle`\
  \ 后，我们将其附加到窗口，这样它就能显示出来：\n\n![显示多色调色板的 Canvas 窗口截图](img/f0344-01.jpg)\n\n调色板中的颜色是为了方便访问流行颜色以及流行的颜色范围。\n\
  \n### 11.7.4 圆形 (Circle)\n\n为了说明世界并不完全是矩形的，我们提供了 `Circle` 类和 `Ellipse` 类。`Circle`\
  \ 由中心点和半径定义：\n\n点击此处查看代码图像\n\n```\nstruct Circle : Shape {\n         Circle(Point\
  \ p, int rr)         // 中心和半径\n                 :r{ rr }\n         {\n         \
  \        add(Point{ p.x − r, p.y − r });\n         }\n\n         void draw_specific(Painter&\
  \ painter) const override;\n\n         Point center() const { return { point(0).x\
  \ + r, point(0).y + r }; }\n\n         void set_radius(int rr) { r=rr; redraw();\
  \ }\n         int radius() const { return r; }\nprivate:\n         int r;\n};\n\
  ```\n\n我们可以像这样使用 `Circle`：\n\n点击此处查看代码图像\n\n```\nCircle c1 {Point{100,200},50};\n\
  Circle c2 {Point{150,200},100};\nc2.set_fill_color(Color::red);\nwin.c1.put_on_top();\n\
  Circle c3 {Point{200,200},150};\n```\n\n这产生了三个不同大小的圆，它们的中心在水平线上对齐：\n\n![显示三个圆的 Canvas\
  \ 窗口截图](img/f0345-01.jpg)\n\n`Circle` 实现的主要特殊之处在于，存储的点并不是中心，而是包围圆形的正方形的左上角。这样，`Circle`\
  \ 提供了另一个示例，说明如何使用类来呈现比其实现不同的（且据称更好的）的概念视图：\n\n点击此处查看代码图像\n\n```\nCircle::Circle(Point\
  \ p, int rr)              // 中心和半径\n         :r{rr}\n{\n         add(Point{p.x−r,p.y−r});\
  \   // 存储左上角\n}\n\nPoint Circle::center() const\n{\n         return {point(0).x+r,point(0).y+r};\n\
  }\n```\n注意 `draw_specific(Painter& painter)` 用于绘制圆。\n\n### 11.7.5 椭圆 (Ellipse)\n\
  \n注意 `major()==minor()` 的 `Ellipse` 看起来和圆完全一样。\n\n**CC**\n为什么 `Circle` 不是 `Ellipse`？从几何上讲，每个圆都是椭圆，但并不是每个椭圆都是圆。特别是，圆是两个焦点相等的椭圆。假设我们把\
  \ `Circle` 定义为 `Ellipse`。我们可以这样做，但代价是在其表示中需要一个额外的值（圆由一个点和一个半径定义；而椭圆需要一个中心和一对轴线）。我们不喜欢在不需要的地方产生空间开销，但我们的\
  \ `Circle` 不是 `Ellipse` 的主要原因是，我们无法在不某种程度上禁用 `set_major()` 和 `set_minor()` 的情况下那样定义它。毕竟，如果我们能使用\
  \ `set_major()` 得到 `major()!=minor()`，那么它就不再是一个圆（数学家所认的圆）了——至少在我们完成那个操作后，它就不再是一个圆了。\n\
  \n\n\n\n当我们设计类时，必须小心不要表现得过于聪明，也不要被我们的“直觉”误导，定义出在代码中作为类并毫无意义的类。相反，我们必须确保类代表了某种连贯的概念，而不仅仅是数据和函数成员的集合。在不考虑我们正在代表什么思想/概念的情况下随手将代码堆在一起，是“黑客行为（hacking）”，会导致产生我们无法解释且他人无法维护的代码。如果你不具备利他主义，请记住，几个月后的“他人”可能就是你你自己。这样的代码也更难调试。\n\
  \n## 11.8 文本\n\n显然，我们希望能够在显示器中添加文本。例如，我们可能想为 §11.6.2 中的“奇特” `Closed_polyline` 加上标签：\n\
  \n点击此处查看代码图像\n\n```\nText t {Point{150,200},\"A closed polyline that isn't a polygon\"\
  };\nt.set_color(Color::blue);\n```\n\n我们得到\n\n![显示多边形和文本的 Canvas 窗口截图](img/f0348-01.jpg)\n\
  \n基本上，`Text` 对象定义了从 `Point` 开始的一行文本。`Point` 将是文本的左下角。将字符串限制为单行是为了确保跨系统的可移植性。不要尝试放入换行符；它在你的窗口中可能显示为新行，也可能不会显示。字符串流\
  \ (§9.11) 用于组合在 `Text` 对象中显示的 `string`（示例见 §10.7.8 和 §14.5 ）。`Text` 的定义如下：\n\n点击此处查看代码图像\n\
  \n```\nstruct Text : Shape {\n         Text(Point x, const string& s) : lab{ s }\
  \ { add(x); }   // 该点是第一个字母的左下角\n         void draw_specific(Painter& painter) const\
  \ override;\n\n         void set_label(const string& s) { lab = s; redraw(); }\n\
  \         string label() const { return lab; }\n\n         void set_font(Font f)\
  \ { fnt = f; redraw(); }\n         Font font() const { return Font(fnt); }\n\n \
  \        void set_font_size(int s) { fnt_sz = s; redraw(); }\n         int font_size()\
  \ const { return fnt_sz; }\nprivate:\n         string lab;                     \
  \              // 标签\n         Font fnt = Font::courier;\n         int fnt_sz =\
  \ 14;                            // 常规“磅”单位字体大小\n};\n```\n\n如果你想让字体大小与默认值（14）不同，则必须显式设置它。这是一个保护用户免受底层库行为可能变化的测试示例。在这种情况下，在我们接口库的早期版本中，我们当时使用的\
  \ FLTK 库更新更改了其默认值，导致字符变得极小，从而破坏了现有程序。我们决定防止这个问题发生。\n\n我们将 `fnt` 和 `fnt_sz` 的初始化器作为成员初始化器提供，而不是构造函数初始化列表的一部分，因为初始化器不依赖于构造参数。\n\
  \n`Text` 有自己的 `draw_specific()`，因为只有 `Text` 类知道它的字符串是如何存储的：\n\n点击此处查看代码图像\n\n```\n\
  void Text::draw_specific(Painter& painter) const\n{\n         painter.set_font(font());\n\
  \         painter.set_font_size(font_size());\n         painter.draw_text(point(0),\
  \ lab);\n}\n```\n\n字符的颜色确定与线条（例如 `Open_polyline` 和 `Circle`）完全相同，你可以使用 `set_color()`\
  \ 为它们选择颜色，并查看 `color()` 当前使用的颜色。字体大小和字体的处理方式类似。有一些定义的字体：\n\n点击此处查看代码图像\n\n```\n\
  struct Font {\n         enum Font_type {\n                 helvetica, helvetica_bold,\
  \ helvetica_italic, helvetica_bold_italic,\n                 courier, courier_bold,\
  \ courier_italic, courier_bold_italic,\n                 times, times_bold, times_italic,\
  \ times_bold_italic,\n                 symbol,\n                 screen, screen_bold,\n\
  \                 zapf_dingbats\n         };\n         Font(Font_type ff) :f(ff)\
  \ { }\n\n         int as_int() const { return f; }\nprivate:\n         int f = courier;\n\
  };\n```\n\n定义 `Font` 的类样式与我们定义 `Color` 的方式相同 (§11.4) 以及 `Line_style` (§11.5)。\n\n\
  \n\n\n```cpp\nclass ImagePrivate; // 提供指向 Qt 类接口的实现类\n\nstruct Image : Shape {\n\
  \         Image(Point xy, string s);\n         ˜Image() {};\n\n         void set_mask(Point\
  \ xy, int ww, int hh) { w=ww; h=hh; cx=xy.x; cy=xy.y; redraw(); }\n         void\
  \ move(int dx,int dy) override { Shape::move(dx,dy); redraw(); }\n         void\
  \ scale(int ww, int hh, bool keep_aspect_ratio = true);\n\n         ImagePrivate&\
  \ get_impl() const { return*impl; }\n         void draw_specific(Painter& painter)\
  \ const override;\nprivate:\n         int w,h,cx,cy;            // 在图像内定义相对于位置 (cx,cy)\
  \ 的“掩码框”\n         Text fn;\n         std::unique_ptr<ImagePrivate> impl;\n};\n\
  ```\n\n`Image` 构造函数尝试打开一个具有给定的名称的文件。在图形库中处理图像是非常复杂的，但我们图形接口接口类 `Image` 的主要复杂性在于构造函数中的文件处理：\n\
  \n点击此处查看代码图像\n\n```cpp\nImage::Image(Point xy, string s)\n         :w(0), h(0),\
  \ fn(xy,\"\"), impl(std::make_unique<ImagePrivate>())\n{\n         add(xy);\n\n\
  \         if (!can_open(s)) {\n                  fn.set_label(\"cannot open \\\"\
  \" + s + '\\\"');\n                  return;\n         }\n         impl−>load(s);\n\
  }\n```\n\n如果无法显示图像（例如，因为未找到文件），`Image` 将显示一个 `Text`，其中包含无法打开的文件名。这样，我们就可以直接在屏幕上看到问题，而不是试图在代码中寻找问题。这是\
  \ GUI 库中的一种常用技术。\n\n图像可以以各种眼花缭乱格式编码，例如 JPEG 和 GIF。我们使用文件的后缀（例如 `jpg` 或 `gif`）来选择用于存放图像的对象的类型。\n\
  \n从我们的接口库到 Qt 设施的映射是由 `ImagePrivate` 完成的。我们使用 `unique_ptr` 访问 `ImagePrivate`，它负责处理正确的删除（§18.5）。\n\
  \n现在，我们只需要实现 `can_open()` 来测试我们是否可以读取一个命名的文件：\n\n点击此处查看代码图像\n\n```cpp\nbool can_open(const\
  \ string& s)\n         // 检查是否存在名为 s 的文件以及是否可以读取\n{\n         ifstream ff(s);\n\
  \         return ff.is_open();\n}\n```\n\n打开文件然后再次关闭它，是可移植地分离“无法打开文件”相关的错误与文件中数据格式相关的错误的一种相当笨拙的方法。\n\
  \n### 尝试一下\n\n编写、编译并运行一个简单的程序，显示一张你喜欢的图片。它适应你的窗口吗？如果不适应，发生了什么？我们选择了那张图像的一部分，并添加了一张从\
  \ `rita.jpg` 看到的 Rita 照片：\n\n点击此处查看代码图像\n\n```cpp\nImage path{ Point{0,0},\"rita_path.gif\"\
  \ };\npath.set_mask(Point{ 50,250 }, 600, 400); // 选择可能的区域\n\nImage rita{ Point{0,0},\"\
  rita.jpg\" };\nrita.scale(300, 200);\n```\n\n![一个带有照片的 Canvas 窗口 path 截图](img/f354-01)\n\
  \n`set_mask()` 操作选择图像的子图进行显示。在这里，我们从 `rita_path.gif`（加载为 `path`）中选择了一个 (600,400)\
  \ 像素的图像，其左上角位于 `path` 的 (50,250)。只选择图像的一部分是如此常见，以至于我们选择了支持它。形状按照它们附加的顺序排列，就像桌子上的纸张一样，所以我们通过在附加\
  \ `rita` 之前附加 `path`，就让 `path` 位于“最底部”。\n\n### 练习\n\n[1] 创建一个 800x1000 的 `Simple_window`。\n\
