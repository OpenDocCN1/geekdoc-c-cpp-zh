  \n前言\n\n*管鱼雷！*\n\n*全速前进。*\n\n*– 拉加特海军*\n\n编程是表达问题解决方案的艺术，以便计算机执行这些解决方案。编程中的大部分精力用于寻找和完善解决方案。通常，只有在编写解决方案的过程中，才能完全理解一个问题。\n\
  \n\n\n\n这本书是为那些从未编写过程序但愿意努力学习的人准备的。它将帮助你理解编程原理，并使用 C++ 编程语言获得实用技能。它也适用于具有某些编程知识、希望更深入地掌握编程原理和现代\
  \ C++ 的读者。\n\n你为什么想学习编程呢？我们的文明运行在软件之上。如果不理解软件，你只能沦为相信“魔法”，并且被排除在许多最有趣、最有利可且最具社会价值的技术工作领域之外。当我谈论编程时，我指的是整个计算机程序谱系：从带有图形用户界面（GUI）的个人电脑应用程序，到工程计算和嵌入式系统控制应用（如数码相机、汽车和手机），再到许多人文和商业应用中常见的文本处理应用。像数学一样，编程——只要做得好——是一项有价值的智力活动，能够锻炼我们的思维能力。然而，得益于计算机的反馈，编程比大多数形式的数学更具体，因此更多的人可以接触及。这是一种接触并改变世界的方式——理想情况下是变得更好。最后，编程可以非常有趣。\n\
  \n编程有许多种类。本书旨在服务那些想要为他人编写非平凡程序并以负责任的方式这样做的人，提供体面的系统质量。也就是说，我假设你希望达到一种专业水平。因此，我为本书选择的主题涵盖了开始现实世界编程所需的内容，而不仅仅是易于教学和学习的内容。如果你需要一种技术来正确完成基础工作，我会描述它，演示支持该技术所需的概念和语言特性，并提供相应的练习。如果你只是想理解玩具程序或编写仅调用他人提供的代码的程序，你只需要比我所呈现的内容少得多的东西。在这种情况下，使用一种比\
  \ C++ 更简单的语言可能更适合你。另一方面，我不会在实际意义有限的材料上浪费你的时间。如果一个想法在这里被解释，是因为你几乎肯定需要它。\n\n编程是通过编写程序来学习的。在这方面，编程与其他具有实践成分的活动相似。你不能仅仅通过看书就学会游泳、弹乐器或开车——你必须练习。如果不阅读和编写大量代码，你也无法成为一名优秀的程序员。本书侧重于与说明文字图表紧密相关的代码示例。你需要这些内容来理解编程的理想、概念和原理，并掌握用于表达它们的语言结构。这至关重要，但单凭这些并不能给你编程的实用技能。为了这些，你需要完成练习，并习惯编写、编译和运行程序的工具。你需要亲手犯错并学会纠正它们。编写代码是不可替代的。此外，那正是乐趣所在！\n\
  \n编程包含的内容——多得多——远不仅仅是遵循几条规则和阅读手册。本书的重点不在于“C++ 语法”。C++ 被用于说明基本概念。理解基础的理想、原理和技术是一个优秀程序员的精髓。此外，“基础知识”才是持久的：即使在今天的编程语言和工具演变或被取代很久之后，它们仍然将是至关重要的。\n\
  \n代码既可以是优美的也可以是实用的。本书的目的是帮助你理解代码之美的含义，帮助你掌握创建此类代码的原理，并建立创建代码的实用技能。祝你编程顺利！\n\n##\
