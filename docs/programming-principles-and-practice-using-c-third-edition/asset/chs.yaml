  \n- [13] 实现游戏“猎杀通普斯（Hunt the Wumpus）”的版本。“猎杀通普斯”（或简称为“Wump”）是一个由 Gregory Yob 最初发明的简单（非图形）计算机游戏。其基本设定是一个相当臭的怪物住在一个由相互连接房间组成的黑暗洞穴中。你的任务是使用弓箭杀死通普斯。除了通普斯，洞穴还有两个危险：无底洞和巨蝙。如果你进入有无底洞的房间，你的游戏就结束了。如果你进入有蝙蝠的房间，蝙蝠会把你抓起并掉进另一个房间。如果你进入有通普斯的房间或它进入了你的房间，它就会吃掉你。当你进入一个房间时，会被告知附近是否有危险：\n\
  \n*   “我闻到了通普斯的气味”：它在相邻房间里。\n*   “我感觉到一阵风”：相邻房间中有一个无底洞。\n*   “我听到了蝙蝠的声音”：一只巨蝙在相邻房间里。\n\
