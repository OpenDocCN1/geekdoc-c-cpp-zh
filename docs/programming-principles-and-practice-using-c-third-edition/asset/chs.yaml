  \n### 0.6 参考文献\n\n`§0.6` `ch00.xhtml0sec6`\n\n#### 0.1 本书的结构\n\n本书由三部分组成：\n\n* 第一部分\
  \ (第 1 章 到 第 8 章) 介绍了编程的基本概念和技术，以及开始编写代码所需的 C++ 语言和库设施。这包括类型系统、算术运算、控制结构、错误处理以及函数和自定义类型的设计、实现和使用。\n\
  \n\n\n\n\n- 第二部分 (第 9 章 到 第 14 章]) 首先描述了如何从键盘和文件获取数值和文本数据，以及如何向屏幕和文件产生相应的输出。然后，我们展示了如何将数值、文本和几何形状作为图形输出，以及如何从图形用户界面（GUI）向程序输入数据。作为的一部分，我们介绍了面向对象编程的基本原理和技术。\n\
  \n- 第三部分 (第 15 章 到 第 21 章) 重点关注 C++ 标准库的容器和算法框架（通常称为 STL）。我们展示了如何实现和使用容器（如 `vector`、`list`\
  \ 和 `map`）。在此过程中，我们引入了指针、数组和动态内存等底层设施。我们还了如何使用异常处理错误，以及如何使用模板对类和函数进行参数化。作为的一部分，我们介绍了泛型编程的基本原理和技术。我们还演示了标准库算法（如\
  \ `sort`、`find` 和 `inner_product`）的设计和使用。\n\n主题顺序是由编程技术决定的，而不是编程语言特征。\n\n## CC\n\
  \n为了方便回顾，并在你在第一次阅读时错过关键点（此时你尚未发现哪些信息是关重要的）时提供帮助，我们在页边放置了三种“标记标记”：\n\n- **CC**: 概念和技术（本段就是此类示例）\n\
  - **AA**: 建议\n- **XX**: 警告\n\n使用 `CC`、`AA` 和 `XX` 而不是不同颜色的单一标记，是为了在颜色难以区分的情况下提供帮助。\n\
  \n### 0.1.1 通用方法\n\n在本书中，我们直接与你交流。这比大多数科学论文中那种传统的“专业”间接称呼方式更简单、清晰。我们所说的“你”是指“你，读者”，我们所说的“我们”是指“你，作者和老师们”，通过一个问题共同工作，就像我们坐在同一个房间里可能做的那样。当我提到自己的工作或个人观点时，我会使用“我”。\n\
  \n#### AA\n\n本书的设计要求是从头到尾逐章阅读。通常情况下，你会想要回去看第二次或第三次某些内容。事实上，这是唯一合理的方法，因为你总是会跳过一些你尚未看出其意义的细节。在这种情况下，你最终会再次回去。尽管有索引和交叉引用，这并不是一本你可以随机翻到某页并开始阅读且对成功有任何期待的书。每个章节和每一章都假设读者已经理解了之前的内容。\n\
  \n每一章都是一个相当独立的单元，旨在“一次性读完”（当然这在逻辑上如此，尽管对于学生紧凑的日程并不总是可行）。这是将文本分为章节的主要标准之一。其他标准还包括章节是适合训练和练习的单位，以及每章都介绍某个特定的概念、想法或技术。这些标准的复数性导致几个章节长得令人不安，所以请不要太字面地理解“一次性读完”。特别是，一旦你思考了复习题、完成了训练并做了几道练习题，你通常会发现自己必须回去重读几个章节。\n\
  \n对教科书的常见赞誉是：“它在我想到问题时就回答了我的所有问题！”这对于微小的技术问题来说是一个理想状态，早期读者已经在本书中观察到了这种现象。然而，这不能是全部的理想。我们提出的问题是学者可能想不到的。我们的目标是提问并回答你在为他人编写高质量软件时需要考虑的问题。学会提问正确的（通常是困难的）问题是学习像程序员一样思考的重要组成部分。只问简单而而易见的问题会让你感觉良好，但它无法帮助你成为一名程序员。\n\
  \n我们努力尊重你的智力并考虑你的时间。在我们的表达中，我们追求专业性而非可爱，我们宁愿低调描述一个观点也不对其大肆渲染。我们努力不夸大编程技术或语言特征的重要性，但请不要低估诸如“这通常有用”之类的简单陈述。如果我们静静地强调某事很重要，我们的意思是如果你不掌握它，早晚会浪费几天时间。\n\
  \n我们对幽默的使用比希望的要有限，但经验表明，人们对幽默的理解存在巨大差异，而且失败的幽默尝试可能会令人困惑。\n\n#### CC\n\n我们并不假装我们的想法或提供的工具是完美的。没有任何工具、库、语言或技术是解决程序员面临的众多挑战的“终极方案”。起码，一种语言可以帮助你开发和表达你的解决方案。我们努力避免“白谎”；也就是说，我们克制使用过于简单的解释——这些解释虽然清晰易懂，但在真实语言和真实问题的背景下是不真实的。\n\
  \n### 0.1.2 训练、练习等\n\n#### AA\n\n编程不仅仅是一项智力活动，因此编写程序对于掌握编程技能是必要的。我们提供了三个级别的编程实践：\n\
  \n- **训练（Drills）**: 训练是一种非常简单的练习，旨在培养实用的、几乎是机械的技能。训练通常由对单个程序的一系列修改组成。你应该完成每一个训练。训练不要求深层理解、聪明或主动性。我们认为训练是书的基础部分。如果你没有完成训练，你就没有“读完”这本书。\n\
  - **练习（Exercises）**: 有些练习很平庸，另一些则非常困难，但大多数练习旨在留出主动性和想象力的空间。如果你认真，你会做很多。至少做一下那些对你来说困难的题。然后多做几个。这是你学到最多的方法。练习的设计是为了不需要卓越的聪明就能完成，而不是脑筋急转弯。然而，我们希望提供的练习足以挑战任何人，并且练习量足以耗尽优秀学生可用的时间。我们不要求你完成所有，但尽管尝试。\n\
  - **试一试（Try this）**: 有些人喜欢在读完章节之前放下书尝试示例；另一些人则喜欢读到最后再尝试让代码运行。为了支持这种偏好的读者，我们在文中自然折处提供了标记为\
  \ `Try this` 的简单实践建议。`Try this` 通常类似于训练，但专门针对之前的主题。如果你跳过了 `Try this` 而没有尝试（可能是因为附近没有计算机或你被文本吸引），请在做章节训练时返回这里；`Try\
  \ this`要么补充章节训练，要么是其的一部分。\n\n此外，在每章末尾我们提供了一些帮助以巩固所：\n\n- **复习（Review）**: 在每章最后，你会发现一组复习题。它们旨在引导你指向章节解释的核心思想。可以将复习题看作练习的补充：练习侧重于编程的实践方面，而复习题试图帮助你表达思想和概念。在这方面，它们类似于很好的面试题。\n\
  - **术语（Terms）**: 每章末尾的一个章节介绍了编程和 C++ 的基础词汇。如果你想理解人们对编程话题的讨论并表达自己的想法，你应该知道每个术语的含义。\n\
  \n\n\n\n\n*   `Postscript`: 旨在为所介绍的内容提供某些角的段落。\n\n此外，我们建议你参加一个小型项目（如果时间允许，可以参加更多）。项目的目的是产生一个完整且实用的程序。理想情况下，项目应该由一小组人（例如三个人）共同完成（例如，在阅读本书后几个章节的过程中）。大多数人发现此类项目是最有趣的，而且它们能将所有知识点联系起来。\n\
  \n**CC**\n\n学习涉及重复。我们的目标是让每个重要知识点至少出现两次，并通过练习来强化它的记忆。\n\n### 0.1.3 本书之后还有什么？\n\n\
  **AA**\n\n读完这本书后，你会成为编程专家和 `C++` 专家吗？当然不会！如果做得得当，编程是一门精细、深奥且高技能的艺术，它建立在多种技术技能基础之上。你不应该期待在四个月内成为编程专家，就像你不应该期待在四个月内成为生物学、数学、自然语言（如中文、英语或丹麦语）或小提琴专家一样——即使是半年或一年也一样。你应该期待的、而且如果你认真对待这本书就能获得的，是有一个非常好的开端，让你能够编写相对简单实用的程序，能够阅读更复杂的程序，并为进一步工作打良好的概念和实践基础。\n\
  \n这门入门课程最好的后续学习是开展一个项目，开发供他人使用的代码；最好由经验丰富的开发人员指导。在那之后，或者（更好的是）在进行项目的同时，阅读一本专业级的通用教材、一本与你的项目需求更相关的专业书籍，或者一本专注于\
  \ `C++` 特定方面的教科书（如算法、图形学、科学计算、金融或游戏）；请参阅 ``§0.6`]。\n\n**AA**\n\n最终，你应该学习另一种编程语言。我们认为，如果不熟悉超过一种语言，就不可能在软件领域成为专业人士——即使你主要不是程序员。为什么呢？没有哪个大型程序是用单一语言编写的。此外，不同语言在代码思维和程序构建方式上通常也不同。设计技术、库的可用性以及程序的构建方式不相同，有时差异是巨大的。即使两种语言的语法相似，这种相似性通常也仅限于表面。性能、错误检测以及对表达能力的限制通常也不同。这类似于自然语言和文化之间的差异。只了解一种语言和一种文化，意味着存在一种危险，即认为“我们做事的方法”是唯一的方法或唯一正确的方法。这种想法会让你错失机会，并产生次优的程序。避免此类问题的最好方法之一就是学习几种语言（编程语言和自然语言）。\n\
  \n### 0.2 教学与学习的哲学\n\n我们试图帮助你学习什么？我们又是如何处理教学过程的？我们尝试为你提供编写高效实用程序所需的最少概念、技术和工具，包括：\n\
  \n*   程序组织\n*   调试与测试\n*   类设计\n*   计算\n*   函数与算法设计\n*   图形学（仅限二维）\n*   图形用户界面 (GUIs)\n\
  *   文件\n*   输入与输出\n*   内存管理\n*   设计策略\n*   `C++` 标准库\n\n为了保持书籍的轻量，某些主题被放置在 ``§0.4`章节：\n\
  \n*   计算机与人 (`Ch1`)\n*   理想与历史 (`Ch22`)\n*   文本处理 (`Ch23`)\n*   数值计算 (`Ch24`)\n\
  *   嵌入式系统 (`Ch25`)\n*   正则表达式 (`Ch27`)\n\n通过学习这些章节，我们涵盖了过程化编程、面向对象编程和泛型编程。我们关注的是使用\
  \ `C++` 进行编程，而不是 `C++` 语言本身，因此我们详细描述了许多 `C++` 特性。但请记住，`C++` 只是一个工具，而不是本书的主题。\n\n\
  我们涉及的每个主题至少有两个作用：它既介绍了一种技术、概念或原则，同时也介绍了一个实用的库特性。例如，我们使用二维图形系统来解释类和继承。这使我们能够节省空间（以及你的时间），并尽可能地获得结果。`C++`\
  \ 标准库是“一举多用”的主要来源——许多时候甚至是一一举三用。例如，我们引入 `vector` 来说明广泛有用的设计技术，并展示它是如何实现的。我们坚持认为匠人必须理解他们的工具，而不仅仅是将它们视为“魔法”。\n\
  \n某些主题对某些程序员来说比对其他人更有趣。然而，我们鼓励你不要预判自己的需求（你怎么知道自己以后需要什么呢？），并且至少看每一章。如果你作为课程的一部分来读这本书，你的老师会引导你。\n\
  \n**CC**\n\n我们将我们的方法描述为“深度优先”。它也是“具体优先”和“基于概念的”。首先，我们快速（嗯，是相对快速，从 ``第 1 章` 到 ``第\
  \ 9 章`）汇集一套编写实用程序所需的技能。在此过程中，我们以最精少的细节介绍了许多工具和技术。我们关注简单的具体的例子，因为人们对具体的理解比抽象的要快。这正是大多数人类的学习方式。在初始阶段，你不应该期待理解每一个微小的细节。特别是，你会发现尝试与刚刚成功的方法稍有不同的做法会有“神秘”的效果。但请尽管尝试！请完成我们提供的练习和作业。只需记住，在早期你还没有概念和技能来准确估计什么是简单的、什么是复杂的；预会有惊喜，并从中学习。\n\
  \n**XX**\n\n\n\n\n至关重要的一点是，不要试图学习某种语言细节或技术的“所有内容”。例如，你可以记住 `C++` 所有的内置类型以及使用它们的所有规则。当然，你可以这样做，而且这样做可能会让你觉得自己很有学问。然而，这并不能让你成为一名程序员。跳过细节偶尔会让你因为缺乏知识而“碰钉头”，但这是获得编写良好程序所需视角的最快方法。请注意，我们的方法本质上是孩子们学习母语的方法，也是学习外语时最有效的方法。在不可避免的遇到卡壳时，我们鼓励你向老师、朋友、同事、导师等寻求帮助。请放心，这些早期章节中的内容从根本上来说并不困难。然而，很多内容是陌生的，因此起初可能会感到困难。\n\
  \n随后，我们会在你初始技能的基础上拓宽你的知识基础。我们使用示例和练习来巩固你的理解，并为编程提供概念基础。\n\n## AA\n\n我们非常强调理想和原因。在寻找实际解决方案时，你需要理想来引导你——知道什么时候一个解决方案是良好且有原则的。你需要理解这些理想背后的原因，以理解为什么它们应该是你的理想，以及追求它们为什么能帮助你和你的代码的用户。没有人应该仅仅对“因为事实就是这样”这种解释感到满意。更重要的是，对理想和原因的理解允许你从已知知识推广到新情况，并以新颖的方式结合思想和工具来解决新问题。知道“为什么”是获取编程技能的重要部分。相反，仅仅记忆许多不定义的规则是有局限性的，是错误的来源，也是时间的巨大浪费。我们认为你的时间非常宝贵，并努力不浪费它。\n\
  \n许多 `C++` 语言技术细节被转移到了其他来源，大部分在网上（[§0.4.1]）。我们假设你在需要时会有主动去搜索信息。使用索引和目录。不要忘记你编译器的在线帮助功能。但请记住，在你有理由相信它之前，对每个网络资源都要保持高度怀疑。许多看起来权威的网站是由编程初学者或某些推销产品的人建立的。另一些则已经过时。我们在支持网站上提供了链接和信息集：**[www.stroustrup.com/programming.xhtml](http://www.stroustrup.com/programming.xhtml)**。\n\
  \n请不要对“现实性”示例太不耐烦。我们的理想示例是直接说明语言功能、概念或技术的最短、最简单的代码。大多数真实世界的示例比我们的要混乱得多，但它们包含的内容并不超过我们所演示的内容的组合。拥有数十万行代码的成功商业程序也是基于我们在十几个\
  \ 50 行的程序中说明的技术的。理解真实世界代码最快的方法是通过对基础知识的良好理解。\n\n我们不使用“涉及可爱动物的幼稚示例”来阐述观点。我们假设你的目标是编写供真实人类使用的真实程序，因此每一个未作为特定语言技术呈现的示例都取自真实世界的应用。我们的基本基调是专业人士对（未来的）专业人士的态度。\n\
  \n`C++` 建立在两个支柱之上：\n\n*   **高效直接访问机器资源**：使 `C++` 对于底层、接近机器的编程变得有效，这在许多应用领域中至关重要。\n\
  *   **强大的（零开销）抽象机制**：通过提供高层编程所需的优雅、灵活、类型和资源安全且高效的设施，使其能够逃避易出错的底层编程。\n\n本书教授了这两个层面。我们使用高层抽象的实现作为主要示例，来引入底层语言特征和编程技术。目标始终是在可以负担的最高水平上编写代码，但这通常需要一个使用底层设施和技术建立的基础。我们的目标是让你精通这两个层面。\n\
  \n### 0.2.1 给学生的一封信\n\n## AA\n\n许多使用本本书前两个版本进行教学的数千万名大一学生，在他们的人生中从未见过哪怕一行代码。大多数人都成功了，所以你也可以。\n\
  \n你不需要作为课程的一部分来读这本书。这本书被广泛用于自学。然而，无论你是作为课程的一部分还是独立学习，都请尝试与他人合作。编程被誉为一项——不公平的——孤独活动。但大多数人在当处于一个具有共同目标的群体中工作时，表现得更好，学得更快。与朋友一起学习和讨论问题不是作弊！这是取得进步最高效且最愉快的方式。即使没有别的好处，与朋友一起工作也能迫使你清晰地表达自己的想法，这正是测试你的理解并确保你记得的最有效的方法。你并不需要亲自发现每一个晦涩的语言和编程环境问题的答案。但是，请不要因为不进行训练和相当数量的练习（即使没有老师强迫你这样做）而欺骗自己。记住：编程（除其他因素外）是一项必须通过练习才能掌握的实践技能。\n\
  \n大多数学生——尤其是深思熟虑的好学生——会面临怀疑自己的努力是否值得的时候。当（而不是如果）这种情况发生时，休息一下，重读这一章，查看网上发布的“计算机、人与编程”以及“理想与历史”章节（[§0.4.1]）。在那里，我尝试表达我发现编程令人兴奋的地方，以及为什么我认为它是为世界做出积极贡献的关键工具。\n\
  \n请不要太不耐烦。学习任何重大且重要的技能都需要时间。\n\n本书的主要目标是帮助你用代码表达想法，而不是教你如何获得想法。在过程中，我们提供了许多关于如何解决问题的示例，通常是通过对问题进行分析，然后逐步完善解决方案。我们认为编程本身就是解决问题：只有完全理解问题及其解决方案，你才能编写出正确的程序；只有通过构建和测试程序，你才能你的理解是完整的。因此，编程本质上是获取理解的一部分。然而，我们的目标是通过示例来证明这一点，而不是通过“说教”或提供详细的解决问题方案。\n\
  \n### 0.2.2 给老师的一封信\n\n## CC\n\n不。这不是门传统的计算机科学 101 课程。这是一本关于如何构建运行软件的书。因此，它省略了许多计算机科学学生传统接触的内容（图灵完备性、状态机、离散数学、文法等）。甚至硬件也被忽略了，假设学生从幼儿园就开始以各种方式使用计算机。本书甚至没有尝试提到大多数计算机科学课题。它是关于编程的（或更广泛地说，关于软件开发），因此它在较少的主题上比许多传统课程更深入。它试图做好一件事，而计算机科学不是一个课程就能解决的话题。如果这本书/课程作为计算机科学、计算机工程、电气工程（我们的第一批学生很多是电气工程专业的）、信息科学或任何计划的一部分，我们希望它与其他课程一起教授，作为全面介绍的一部分。\n\
  \n\n\n\n\n许多学生想知道为什么设置这些课程，以及为什么要以这种方式进行教学。请在教学过程中尝试向学生传达我的教学理念、通用方法等。此外，为了激励学生，请展示一些\
  \ C++ 广泛使用的领域和应用实例，例如航空航天、医学、游戏、动画、汽车、金融和科学计算。\n\n## 0.3 ISO 标准 C++\n\nC++ 是由 ISO\
  \ 标准定义的。第一个 ISO C++ 标准于 1998 年通过，因此该版本的 C++ 被称为 C++98。本书的代码使用了现代的 C++，即 C++20（以及少量的\
  \ C++23）。如果你的编译器不支持 C++20 [C++20]，请获取新编译器。良好的、现代的 C++ 编译器可以从各种供应商处下载；请参见 `[www.stroustrup.com/compilers.xhtml](http://www.stroustrup.com/compilers.xhtml)`。使用较早且支持性较少的语言版本来学习编程可能会变得变得非常困难。\n\
  \n另一方面，你可能处于一个只能使用 C++14 或 C++17 的环境中。虽然本书的大部分内容仍然适用，但你在使用 C++20 引入的特性时会遇到困难：\n\n\
  * `modules` (§7.7.1)。使用头文件代替模块 (§7.7.2)。特别是使用 `#include \"PPPheaders.h\"` 来编译我们的示例和你的练习，而不是\
  \ `#include \"PPP.h\"` (§0.4)。\n* `ranges` (§20.7)。使用显式迭代器而不是范围。例如，使用 `sort(v.begin(),v.end())`\
  \ 而不是 `ranges::sort(v)`。如果/当这变得繁琐时，可以为你喜爱的算法编写自己的 ranges 版本 (§21.1)。\n* `span` (§16.4.1)。退回到旧的“指针和大小”技术。例如，使用\
  \ `void f(int* p, int n);` 而不是 `void f(span<int> s);` 并根据需要进行自己的范围检查。\n* `concepts`\
  \ (§18.1.3)。使用普通的 `template<typename T>` 并听天由命。对于简单的错误，产生的错误信息可能是糟糕的。\n\n### 0.3.1\
  \ 可移植性\n\n#### CC\n\n编写 C++ 代码以运行在各种机器上是常见的。主要的 C++ 应用程序运行在我们从未听过的机器上！我们认为在各种机器架构和操作系统上使用\
  \ C++ 是最重要的。从本质讲，本书中的每一个示例不仅是 ISO 标准 C++，而且是可移植的。我们所说的*可移植*，是指我们对计算机、操作系统和编译器不做任何假设，只要有一个更新的、符合标准的\
  \ C++ 实现即可。除非另有说明，我们展示的代码应该可以在每个 C++ 实现上运行，并且已经在若干机器和操作系统上经过了测试。\n\n编译、链接和运行 C++\
  \ 程序的细节在不同系统之间有所不同。此外，大多数系统都为你提供了多种编译器和工具的选择。解释众多且经常变化的工具集超出了本书的范围。我们可能会在 PPP 支持网站上添加一些此类信息\
  \ (§0.4)。\n\n如果你在使用某个流行但相当复杂的 IDE（集成开发环境）时遇到困难，我们建议你尝试从命令行工作；它出奇地简单。例如，这里是在 Linux\
  \ 系统上使用 GNU C++ 编译器编译、链接和执行由两个源文件 `my_file1.cpp` 和 `my_file2.cpp` 组成的简单程序所需的全套命令：\n\
  \n点击此处查看代码图片\n\n```\nc++ −o my_program my_file1.cpp my_file2.cpp\n./my_program\n\
  ```\n\n是的，这真的就是它所需要的全部了。\n\n另一种入门方法是使用构建系统，例如 Cmake (§0.4)。然而，当有经验丰富的人可以指导这些初始步骤时，采取这条路径是最佳的。\n\
  \n### 0.3.2 保证\n\n除非是在演示错误，否则本书的代码是类型安全的（对象的使用仅符合其定义）。我们遵循*C++ 核心准则*（The C++ Core\
  \ Guidelines）的规则来简化编程并消除常见错误。你可以在网上找到核心准则 [CG]，并且在你需要保证合规性时，可以使用相应的规则检查器。\n\n我们不建议你在还是新手时就深入研究这些，但考虑到书中阐述的推荐风格和技术具有工业支持，这会让你感到。一旦你熟悉了\
  \ C++ 并理解了潜在的错误（例如在第 16 章 之后），我们建议你阅读 CG 的引言并尝试一种 CG 检查器，看看它们是如何工作的。\n\n### 0.3.3\
  \ C++ 简史\n\n1989 年，几家大公司决定我们需要一个 C++ 的 ISO 标准。与 Margaret Ellis 一起，我编写了成为 C++ 基础文档的《ARM》[ARM]。第一个\
  \ ISO 标准于 1998 年被 20 个国家批准，被称为 C++98。在十年里，C++98 支持了 C++ 使用量的巨大增长，并为其进一步演进提供了大量反馈。除了语言之外，标准还规定了丰富的标准库。在\
  \ C++98 中，最重要的标准库组件是 STL，它提供了迭代器 (§19.3.2),容器（如 `vector` (§3.6) 和 `map` (§20.2))以及算法\
  \ (§21)。\n\nC++11 是一次重大升级，增加了改进的编译时计算 (§3.3.1)、lambda (§13.3.3, §21.2.3) 以及正式的并发支持。并发从\
  \ C++ 早期就开始使用，但这个有趣且重要的话题超出了本书的范围。最终参见 [AW,2019]。C++11 标准库增加了许多实用组件，特别是随机数生成 (§4.7.5)\
  \ 和资源管理指针 (unique_ptr (§18.5.2) 和 shared_ptr; §18.5.3))。\n\n\n\n\nC++14 和 C++17\
  \ 增加了许多实用特性，但没有引入显著的新编程风格。\n\nC++20 [C++20] 是 C++ 的一次重大改进，其意义与 C++11 相当，并非常接近我在\
  \ 1994 年的 *The Design and Evolution of C++* [DnE] 一书中阐述的对 C++ 的理想。在许多扩展中，它添加了模块\
  \ (§7.7.1)）、概念 (§18.1.3)）、协程（超出本书范围）以及范围 (§20.7)。\n\n这几十年来的变化是演进式的，并且非常关注向后兼容性。我有一些\
  \ 20 世纪 80 年代编写的小程序今天仍然运行。如果旧代码无法编译或运行不正常，原因通常是操作系统或第三方库的变化。这提供了一种程度的稳定性，对于维护使用数十年的软件的机构来说，这被视为一项主要特性。\n\
  \n关于关于 C++ 设计和演变的更深入讨论，请参阅 *The Design and Evolution of C++* [DnE] 以及我的三篇 *History\
  \ of Programming* 论文 [HOPL-2] [HOPL-3] [HOPL-4]。不过，这些并不是为初学者写的。\n\n### 0.4 PPP 支持\n\
  \n书中所有的代码都是 ISO 标准 C++。要开始编译并运行示例，请在代码开头添加两行：\n\n```\nimport std;\nusing namespace\
  \ std;\n```\n\n这使得标准库可用。\n\n遗憾的是，标准并不保证对容器（如标准的 `vector`）进行范围检查，且大多数实现默认并不强制执行。通常，必须通过不同编译器之间不同的选项来启用。我们认为范围检查对于简化学习和尽量减少挫败感至关重要。因此，我们提供了一个\
  \ `PPP_support` 模块，它提供了一个保证下标范围检查的 C++ 标准库版本（参见 **`[www.stroustrup.com/programming.xhtml](http://www.stroustrup.com/programming.xhtml)**）。所以，与其直接使用\
  \ `std` 模块，不如使用：\n\n```\n#include \"PPP.h\"\n```\n\n对于没有良好模块支持编译器的用户，我们还提供了 `\"\
  PPPheaders.h\"` 作为与 `\"PPP.h\"` 类似的版本。它提供的 C++ 标准库比 `\"PPP.h\"` 少，且编译速度较慢。\n\n除了范围检查，`PPP_support`\
  \ 还提供了一个方便的 `error()` 函数以及标准随机数设施的简化接口，许多学生在过去发现这些工具非常有用。我们强烈建议统一使用 `PPP.h`。\n\n\
  有些人对我们在 PPP1 和 PPP2 中使用支持头文件发表过评论，认为“使用非标准头文件不是真正的 C++”。嗯，这是因为这些头文件的内容是 100% 的 ISO\
  \ C++，并且不会改变正确程序的含义。我们认为，我们的 PPP 支持在帮助你避免非移植代码和意外行为方面能做得很好是很重要的。此外，编写便于支持良好高效代码的库是\
  \ C++ 的主要用途之一。`PPP_support` 仅仅是其中一个简单的示例。\n\n**AA**\n\n如果你无法下载支持 PPP 的文件，或者编译它们时遇到困难，请直接使用标准库，但尝试找出如何启用范围检查。所有主要的\
  \ C++ 实现都有该选项，但并不总是容易找到并启用。对于所有的启动问题，最好向有经验的人寻求建议。\n\n此外，当你读到第 10 章 并需要运行图形和 GUI\
  \ 代码时，你需要安装 Qt 图形/GUI 系统以及专门为本书设计的接口库。请参见 `display.system_` 和 **`[www.stroustrup.com/programming.xhtml](http://www.stroustrup.com/programming.xhtml)**。\n\
  \n#### 0.4.1 网络资源\n\n网络上有大量的关于 C++ 的材料，包括文本和视频。遗憾的是，它们的质量参差不齐，很多针对高级用户，而且很多已经过时了。因此，请谨慎使用并保持适度的怀疑态度。\n\
  \n**AA**\n\n本书的支持网站是 **`[www.stroustrup.com/programming.xhtml](http://www.stroustrup.com/programming.xhtml)**。在那上面，你可以找到：\n\
  \n*   `PPP_support` 模块源码 (§0.4)。\n*   `PPP.h` 和 `PPPheaders.h` 头文件 (§0.4)。\n*  \
  \ 关于 PPP 支持的一些安装指南。\n*   一些代码示例。\n*   错误列表。\n*   PPP2（*Programming: Principles and\
  \ Practice using C++* 的第二版）[PPP2] 中的章节，这些章节为了减轻重量由于已有替代来源从印刷版中删除了。这些章节可以在 **[www.stroustrup.com/programming.xhtml](http://www.stroustrup.com/programming.xhtml)**\
  \ 获取，并在 PPP3 正文中如此引用：`PPP2.Ch22` 或 `PPP2.§22.1.2`。\n\n其他网络资源：\n\n*   我的网站 **[www.stroustrup.com](http://www.stroustrup.com)**\
  \ 包含许多与 C++ 相关的材料。\n*   C++ 基金会网站 **[www.isocpp.org](http://www.isocpp.org)** 有各种有用且有趣的信息，很多关于标准化的，也有文章和新闻。\n\
  *   我推荐将 [`cppreference.com`](http://cppreference.com) 作为在线参考。我每天都用它来查询语言和标准库的细节。我不建议将其作为教程。\n\
  *   主要的 C++ 实现者，如 `Clang`、`GCC` 和微软，提供了其产品的免费下载（**[www.stroustrup.com/compilers.xhtml](http://www.stroustrup.com/compilers.xhtml)**）。它们都有下标范围检查的选项。\n\
  *   有几个网站提供免费的在线 C++ 编译，例如 *compiler explorer* [`godbolt.org`](https://godbolt.org)。这些易于使用，对于测试小型示例以及不同编译器及其版本如何处理源码非常有用。\n\
  *   关于如何使用现代 C++ 的指南，请参阅 *The C++ Core Guidelines*：C++ Core Guidelines（[`github.com/isocpp/CppCoreGuidelines`](https://github.com/isocpp/CppCoreGuidelines)）[CG]\
  \ 及其小型支持库（[`github.com/microsoft/GSL`](https://github.com/microsoft/GSL)）。除了演示错误外，书中使用了\
  \ CG。\n*   对于第 10 章到第 14 章，我们使用 Qt 作为图形和 GUI 代码的基础：**[www.qt.io](http://www.qt.io)**。\n\
  \n### 0.5 作者简介\n\n你可能会合理地问：“你是谁，凭什么认为你能帮我学习编程？”这里有一份固定的简介：\n\n\n\n\nBjarne Stroustrup\
  \ 是 C++ 的设计者和原始实现者，也是 *The C++ Programming Language (4th edition)*、*A Tour of C++\
  \ (3rd edition)*、*Programming: Principles and Practice Using C++ (3rd edition)*\
  \ 以及许多流行和学术出版物的作者。他是纽约市哥伦比亚大学的计算机科学教授。Stroustrup 博士是美国工程学院士，同时也是 IEEE、ACM 和 CHM\
  \ 会士。他获得了 2018 年查尔斯·斯拉克·德鲁珀奖、IEEE 计算机学会 2018 年计算机先驱奖以及 2017 年 IET 法拉第奖。在加入哥伦比亚大学之前，他曾是德克萨斯\
  \ A&M 大学的杰出教授，以及摩根士丹的技术专员和董事董事董事。他在贝尔实验室完成了大部分最重要的工作。他的研究兴趣包括分布式系统、设计、编程技术、软件开发工具以及编程语言。为了让\
  \ C++ 成为现实世界软件开发的稳定且更新的基础，30 多年来他一直是 ISO C++ 标准化工作的领军人物。他在奥尔胡斯大学获得数学硕士学位，并是该校计算机系的荣誉教授；在剑桥大学获得计算机科学博士学位，是该校丘吉学院的荣誉研究员。他还是马德里卡洛洛斯三世大学的荣誉博士。[www.stroustrup.com](http://www.stroustrup.com)。\n\
  \n换句话说，我拥有丰富的工业和学术经验。\n\n我曾使用这本书的早期版本教过成千上万名大一学生，其中许多人一生中从未写过一行代码。除此之外，我还教过从本科生到资深开发者和科学家的各个水平的人员。目前，我在哥伦比亚大学教授大四本科生和研究生。\n\
  \n工作之余我也生活。我已婚，有两个孩子和五个孙子。我读很多书，包括历史、科幻、犯罪小说和时事。我喜欢大多数音乐，包括古典音乐、经典摇滚、布鲁斯和乡村音乐。与朋友一起享受美食至关重要，我喜欢访问世界各地有趣的地方。为了能享受美食，我跑步。\n\
  \n有关更多个人简介，请参阅 `[www.stroustrup.com/bio.xhtml](http://www.stroustrup.com/bio.xhtml)`。\n\
