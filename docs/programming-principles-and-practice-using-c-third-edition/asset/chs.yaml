  \n计算的大部分涉及将大量数据从一个地方移动到另一个地方，例如，从文件复制文本到屏幕，或将音乐从计算机移动到 MP3 播放器。通常，在途中需要对数据进行某些转换。`iostream`\
  \ 库是处理许多此类任务的方法，其中数据可以被视为值的序列（数据流）。输入和输出在常见的编程任务中占据着令人惊讶的巨大比例。这部分部分是因为我们（或我们的程序）需要大量数据，另一部分是因为数据进入系统的地方是容易发生错误的地方。因此，我们必须努力保持\
  \ I/O 的简单性，并尽量减少坏数据“滑入”我们系统的机会。\n\n**CC**\n\n输入和输出是混乱的，因为人类的品味和习惯并没有遵循简单易述的规则和直观的数学法则。作为程序员，我们很少有能力要求用户必须偏离他们的偏好；当我们确实有这种能力时，通常也不应该没那么傲慢，认为自己可以为几十年或几个世纪积累的传统提供更优的替代方案。因此，我们必须预期、接受并适应输入输出的某种混乱，同时仍努力让程序尽可能简单——但不能过简单。\n\
  \n# 10\n\n## 显示模型\n\n*那个世界是黑白的。*\n\n*直到 20 世纪 30 年代的某个时候才变成彩色。*\n\n*– Calvin 的爸爸*\n\
  \n本章介绍了一种显示模型（GUI 的输出部分），提供了使用示例以及基本概念，如屏幕坐标、线条和颜色。`Line`、`Lines`、`Polygon`s、`Axis`\
  \ 和 `Text` 都是 `Shape` 的示例。`Shape` 是内存中的一个对象，我们可以在屏幕上显示并操纵它。接下来的两个章节将进一步探索这些类，其中第\
