  \n[10] 编写一个函数 `maxv()`，返回 `vector` 参数中最大的元素。\n\n[11] 编写一个函数，找到 `vector` 参数中最小和最大的元素，并计算平均值和中位数。不要使用全局变量。要么返回一个包含结果的\
  \ `struct`，要么通过引用参数将结果传回。两种返回多个结果值的方法，你更倾向于哪一种？为什么？\n\n[12] 改进 §7.4.2 中的 `print_until_s()`。测试它。什么是一组良好的测试用例？给出理由。然后，写一个\
  \ `print_until_ss()`，它会打印直到看到 `quit` 参数的第二次出现。\n\n[13] 编写一个函数，接收 `vector<string>`\
  \ 参数并返回一个 `vector<int>`，其中包含每个字符串的字符数。还要找到最长和最短的 `string` 以及字典序第一个和最后一个 `string`。这些任务你会使用多少个独立的函数？为什么？\n\
  \n[14] 我们可以将非引用函数参数声明为 `const` 吗（例如 `void f(const int);`）？这可能意味着什么？我们为什么想这样做？为什么人们不经常这样做？试一下；写几个小程序看看什么有效。\n\
  \n#### 结记\n\n我们可以把本章的大部分内容（以及下一章的大部分）放在附录中。然而，你将在书的其他部分需要这里描述的大部分功能。你很快就会遇到这些功能为了帮助解决而发明的大多数问题。你可能会进行的简单编程项目都需要你解决此类问题。因此，为了节省时间并尽量减少混乱，需要一种相当系统的方法，而不是“随机”查阅手册和附录。\n\
  \n## 8\n\n## 技术细节：类等等\n\n*记住，凡事都是需要时间的。*\n\n*– Piet Hein*\n\n在本章中，我们继续关注编程的主要工具：C++\
  \ 编程语言。我们介绍了语言技术细节，主要与用户定义类型相关，即类和枚举。语言特征的很多呈现形式都是 `Date` 类型的逐步改进。这样，我们也有机会演示一些实用的类设计技术。\n\
  \n*§8.1 用户定义类型\n\n*§8.2 类与成员\n\n*§8.3 接口与实现\n\n*§8.4 演进类：`Date`\n\n*§8.5 枚举\n\n\
  *§8.6 运算符重载\n\n*§8.7 类接口\n\n（注：原文中的目录链接已重构为下方）\n\nISO 标准），也可以是我们自己构建的类型，例如 `Token`\
  \ 和 `Token_stream`（ §5.3.2 和 §5.8）。一旦我们掌握了必要的技术细节，我们将构建图形类型，如 `Shape`、`Line` 和 `Text`（第\
  \ 11 章）。标准库类型与内置类型一样都是语言的一部分，但我们仍然认为它们是用户定义的，因为它们是用相同的原始类型和相同的技术构建的；标准库构建者没有任何你没有的特权或设施。就像内置类型一样，大多数用户定义类型提供了操作。例如，`vector`\
  \ 拥有 `[ ]` 和 `size()`（ §3.6.1`（ §5.8`而 `Shape` 拥有 `add(Point)` 和 `set_color()`（\
  \ §12.2）。\n\n\n\n\n\n# 为什么我们要构建类型？\n\n编译器并不知道我们可能在程序中使用的所有类型。它做不到，因为有用的类型实在太多了——任何语言设计者或编译器实现者都不可能知道所有的类型。我们每天都在发明新的类型。为什么？类型有什么用呢？类型的用处在于可以在代码中直接表示思想。当我们编写代码时，理想情况是将我们的思想直接体现在代码中，以便我们、同事以及编译器都能理解我们写了什么。当我们想进行整数算术时，`int`\
  \ 极有帮助；当我们想处理文本时，`string` 非常有帮助；当我们想处理计算器输入时，`Token` 和 `Token_stream` 则非常有帮助。这种帮助体现在两种形式：\n\
  \n- `Representation`（表示）：类型“知道”如何表示对象中所需的数据。\n- `Operations`（操作）：类型“知道”哪些操作可以应用到对象上。\n\
  \n许多思想都遵循这种模式：“某物”拥有表示其当前值的数据（有时称为当前 `state` [状态]）以及一组可以应用的操作。想一下计算机文件、Web 页面、烤面包机、音乐播放器、咖啡杯、电机、手机、电话簿；所有这些都可以通过某些数据来表征，并且都有一组或多固定的标准操作供你执行。在每情况下，操作的结果取决于对象的数据——即当前的\
  \ `state` [状态]。\n\n因此，我们想用一个数据结构加上一组函数，在代码中表示这样的“思想”或“概念”。问题是：“具体该怎么做？”本章将介绍在 C++\
  \ 中实现这些基本方法的各种细节。\n\nCC\n\nC++ 提供了两种用户定义类型：类（classes）和枚举（enumerations）。类是目前最通用、最重要的类型，因此我们首先关注类。类直接表示程序中的一个概念。一个\
  \ `class` 是一种（用户定义的）类型，它规定了该类型的对象如何表示、如何创建这些对象、如何使用它们以及如何销毁它们（第 17 章）。如果你将某物看作一个独立的实体，那么可能应该定义一个类来表示程序中的这个“东西”。例如：vector、矩阵、输入流、string、FFT（快速傅里叶变换）、阀控制器、机械臂、设备驱动程序、屏幕上的图像、对话框、图、窗口、温度读数和时钟。\n\
  \n在 C++ 中，类是大型程序的关键构建模块——对于小型程序同样有用，正如我们在计算器中所看到的（第 5 章 和 第 6 章）。\n\n### 8.2 类与成员\n\
  \nCC\n\n类是一种用户自定义的类型。它由内置类型、其他用户自定义类型和函数组成。用于定义类的部分被称为 `members` [成员]。一个类有零或多个成员。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\nclass X {\npublic:\n         int m;                    \
  \                   // 数据成员\n         int mf(int v) { int old = m; m=v; return old;\
  \ } // 函数成员\n};\n```\n\n成员可以是各种类型。大多数是数据成员（定义类对象的表示形式）或函数成员（提供对此类对象的操作）。我们使用 `object.member`\
  \ 来访问成员。例如：\n\n点击此处查看代码图像\n\n```cpp\nX var;                                    \
  \ // 类型为 X 的变量\nvar.m = 7;                                // 给 var 的数据成员赋值\nint\
  \ x = var.mf();                         // 调用 var 的成员函数\n```\n\n你可以将 `var.m` 读作\
  \ `var` 的 `m`。大多数人将其读作“var dot m”或“var 的 `m`”。成员的类型决定了我们能对其执行什么操作。例如，我们可以读取和写入一个\
  \ `int` 成员，并调用成员函数。成员函数（如 `var` 的 `mf()`）不需要使用 `var.m` 这种符号。它可以使用普通的成员名称（`m`）。在成员函数内部，成员名称指的是调用该成员函数的对象的成员。因此，在调用\
  \ `var.mf()` 时，`mf()` 定义中的 `m` 指的是 `var.m`。\n\n### 8.3 接口与实现\n\nCC\n\n通常情况下，我们认为类包含一个接口（interface）和一个一个实现（implementation）。接口是类声明中用户直接访问的部分。实现是类声明中用户仅通过接口间接访问的部分。公共接口由\
  \ `public:` 标识，实现由 `private:` 标识。你可以这样理解一个类声明：\n\n点击此处查看代码图像\n\n```cpp\nclass X\
  \ {           // 此类的名字是 X\npublic:\n        // 面给用户的接口（所有人可访问）\n        // 函数、类型和数据（数据通常保持为私有）\n\
  private:\n        // 实现细节（仅供该类的成员使用）\n        // 函数、类型和数据\n};\n```\n\n类成员默认是私有的；也就是说：\n\
  \n```cpp\nclass X {\n         int mf(int);\n         // ...\n};\n```\n\n意味着：\n\n\
  ```cpp\nclass X {\nprivate:\n         int mf(int);\n         // ...\n};\n```\n\n\
  这意味着用户无法直接引用私有成员。相反，我们必须通过公共函数来使用它。例如：\n\n点击此处查看代码图像\n\n```cpp\nX x;           \
  \                   // 类型 X 的变量\nint y = x.mf();                   // 错误：mf 是私有的\n\
  ```\n\n```cpp\nclass X {\nprivate:\n         int m;\npublic:\n         int f(int\
  \ i) { m=i; return m; }\n};\n\nX x;\nint y = x.f(2);\n```\n\n我们使用 `private` 和 `public`\
  \ 来区分接口（用户对类的视图）和实现细节（实现者对类的视图）。我们将解释这一点，并在过程中给出大量示例。在这里，对于纯数据项，这种区分没有意义。`struct`\
  \ 是一个成员默认公开的 `class`：\n\n```cpp\nstruct X {\n         int m;\n         // ...\n\
  };\n```\n\n意味着：\n\n```cpp\nclass X {\npublic:\n         int m;\n         // ...\n\
  };\n```\n\n`struct` 主要用于成员可以取任何值的数据结构；即我们无法定义任何意义的不不变式 (8.4.3)）。\n\n## 8.4 类的类：Date\n\
  \n通过展示如何以及为什么将一个简单的数据结构演变为具有私有实现细节和支持操作类，来说明支持类的语言设施以及基本使用技术。我们使用一个看似平凡的问题，即如何在程序中表示日期（例如\
  \ 1954 年 8 月 14 日）。许多程序对日期的需求显而易见（商业交易、天气数据、日历程序、工作记录、库存管理等）。唯一的问题是我们可能如何表示它们。\n\
  \n### 8.4.1 struct 与函数\n\n我们如何表示日期？当被问及时，大多数回答是：“那么年、月、怎么样？”这不是唯一的答案，也不总是最好的答案，但对于我们这里的使用足够了，所以我们就这样做。我们的第一次尝试是一个简单的\
  \ `struct`：\n\n点击此处查看代码图像\n\n```cpp\n// 简单的 Date（太简单了么？）\nstruct Date {\n      \
  \   int y;        // 年\n         int m;       // 月\n         int d;        // 日\n\
  };\n\nDate today;            // 一个 Date 变量（一个命名的对象）\n```\n\n\n\n\n\n![一个数据表显示了对象的三个输入值：Date。该\
  \ Date 对象由输入 y: 2025, m: 12 和 d: 24 定义。](img/f0227-01.jpg)\n\n在任何与 `Date` 相关的地方，都没有依赖于隐藏数据结构的“魔法”——对于本章中的每一个\
  \ `Date` 版本都是如此的。\n\n现在，我们已经有了 `Date`；我们可以用它做什么呢？从意义上来说，我们可以做一切，因为我们可以访问 `today`（以及任何其他\
  \ `Date`）的成员，并按我们的意愿读取和写入它们。问题在于，其实什么都不怎么方便。我们想要对 `Date` 进行的几乎任何操作都必须通过对这些成员的读取和写入来实现。例如：\n\
  \n点击此处查看代码图片\n\n```\ntoday.y = 2025;          //将今天设置为 2025 年 12 月 24 日\ntoday.m\
  \ = 24;\ntoday.d = 12;\n```\n\n**AA**\n\n这既乏味又容易出错。你发现那个错误了吗？所有乏味的事情都是容易出错的！有些错误更难发现。这种呢：\n\
  \n点击此处查看代码图片\n\n```\nDate y;              //将今天设置为 2025 年 12 月 24 日：\ny.y = 2000;\n\
  y.m = 2;\ny.d = 29;\n```\n\n2000 年是闰年吗？你确定吗？\n\n我们所做的是提供一些辅助函数来为我们执行最常见的操作。这样，我们就不需要反复重复地编写相同的代码，也不会再一遍又一遍地犯、发现并修复相同的错误。对于几乎每种类型，初始化和赋值都是常见操作之一。对于\
  \ `Date`，增加 `Date` 的值是另一个常见操作，因此我们将这些添加为辅助函数：\n\n点击此处查看代码图片\n\n```\nvoid init_day(Date&\
  \ dd, int y, int m, int d)\n{\n         // ... 检查 (y,m,d) 是否为有效日期。如果是，则使用它初始化 dd\
  \ ...\n}\n\nvoid add_day(Date& dd, int n)\n{\n         // ... 将 dd 增加 n 天 ...\n\
  }\n```\n\n我们现在可以尝试使用 `Date` 了：\n\n点击此处查看代码图片\n\n```\nvoid f()\n{\n         Date\
  \ today;\n         init_day(today, 12, 24, 2025);   // 哎呀！（12 年没有 20 日）\n      \
  \   add_day(today,1);\n}\n```\n\n**AA**\n\n首先，我们注意到这种“操作”的用处——在这里它们作为辅助函数实现。检查一个日期是否有效是足够困难且乏味的，以至于如果我们不写一个通用的检查函数，我们偶尔跳过检查并导致产生错误的程序。每当我们定义一个类型时，我们都希望为它提供一些操作。具体想要多少个操作以及哪种操作会有不同。具体如何提供这些操作（作为函数、成员函数或运算符）也会不同，但每当我们决定提供一个类型时，我们都会问自己：“我们希望这个类型具备哪些操作？”\n\
  \n#### 8.4.2 成员函数和构造函数\n\n我们为 `Date` 提供了一个初始化函数，它对 `Date` 的有效性提供了重要的检查。然而，如果我们不使用这些检查函数，它们就无用武了。例如，假设我们已经为\
  \ `Date` 定义了输出运算符 `<<`：\n\n点击此处查看代码图片\n\n```\nvoid f()\n{\n         Date today;\n\
  \         // ...\n         cout << today << '\\n';                // 使用 today\n\
  \         // ...\n         init_day(today,2008,3,30);\n         // ...\n       \
  \  Date tomorrow;\n         tomorrow.y = today.y;\n         tomorrow.m = today.m;\n\
  \         tomorrow.d = today.d+1;        // 在今天基础上加 1\n\n         cout << tomorrow\
  \ << '\\n';       // 使用 tomorrow\n}\n```\n\n在这里，我们“忘记”了立即初始化 `today`，并且“某人”在我们还没调用\
  \ `init_day()` 之前就使用了它。“另一个人”认为调用 `add_day()` 是浪费时间——也许没听说过它——于是手动构造了 `tomorrow`。事实证明，这是糟糕的代码——非常糟糕的代码。有时，在大多数时候，它是能运行的，但小小的变化会导致严重的错误。例如，写出一个未初始化的\
  \ `Date` 将产生垃圾数据，而通过简单地向其成员 `d` 加 `1` 来增加一天是一个定时炸弹：当 `today` 是月的最后一天时，这种增量会产生一个无效日期。这种“非常糟糕的代码”最糟糕的一点是它看起来很糟糕。\n\
  \n这种思维导致了我们需要一个不会被遗忘的初始化函数，以及不容易被忽略的操作。实现这一点的基本工具是成员函数，即在类体内部声明为类成员的函数。例如：\n\n点击此处查看代码图片\n\
  \n```\n// 简单的 Date\nstruct Date {\n          int y, m, d;\n          Date(int y,\
  \ int m, int d);          // 构造函数\n          void add_day(int n);              \
  \  // 增加 n 天\n};\n```\n\n这种与类名相同的成员函数被称为构造函数。它是用于初始化对象的特殊方式，并且是用于对对象的初始化（“构造”）。忘记初始化一个具有构造函数的类（这里是\
  \ `{12,24,2027}`）是错误的。此外，我们还有一种特殊的语法来执行这种初始化：\n\n点击此处查看代码图片\n\n```\nDate birthday;\
  \                                // birthday 未初始化\nDate today {12,24,2027};    \
  \                    // 哎呀！（12 年没有 24 日）\nDate last {2005,12,31};              \
  \          // OK（口语风格）\nDate next {2014,2,14};                         // OK（稍显冗余）\n\
  Date Beethoven{1770,12,16};                   // OK（列表风格）\n```\n\n声明 `birthday`\
  \ 失败是因为我们没有指定初始值。声明 `today` 可以通过编译，但构造函数中的检查代码会在运行时捕获到非法日期（`{12,24,2027}`）。`last`\
  \ 的定义将 `Date` 构造函数所需的初始值作为紧跟变量名后的 `{}` 列表提供。这是具有构造函数的类最常见的初始化样式。我们也可以使用更冗余的风格，即显式创建一个对象（这里是\
  \ `Date{1976,12,24}`），然后使用赋值语法初始化变量。除非你真的喜欢打字，否则很快就会厌了。\n\n我们现在可以尝试使用这些定义的变量了：\n\
  \n点击此处查看代码图片\n\n```\nlast.add_day(1);\nadd_day(2);                             \
  \     // 错误：什么日期？\n```\n\n注意，成员函数 `add_day()`是通过点访问符号为特定的 `Date` 调用的。我们将在 8.4.4\
  \ 介绍如何定义成员函数。\n\n在 C++ 中，人们使用括号分隔初始化列表，因此你会看到很多这样的代码：\n\n点击此处查看代码图片\n\n```\nDate\
  \ last(2000,12,31);                        // OK（旧样式）\n```\n\n我们更倾向于使用 `{}` 初始化列表，因为这清楚地表示了初始化（构造）的完成，而且这种表示法更有用。逻辑上，即使是内置类型也有构造函数，因此我们可以写：\n\
  \n点击此处查看代码图片\n\n```\nint x {7};                                      // OK（初始化列表样式）\n\
  x = int{9};\n```\n\n\n\n\n我们仍然面临一个问题：如果有人忘记使用成员函数 `add_day()` 怎么办？如果有人决定直接修改月份怎么办？毕竟，我们“忘记”为此提供支持了：\n\
  \n点击此处查看代码\n\n```\nDate birthday {1960,12,31};      // 1960 年 12 月 31 日\n++birthday.d;\
  \                            // 哎！无效日期 (birthday.d==32 使生日 无效)\n\nDate today {1924,2,3};\n\
  today.m = 14;                             // 哎！无效日期 (today.m==14 使今天 无效)\n```\n\n\
  **XX**\n\n只要我们让 `Date` 的表示对所有人可见，就会有人——无论无意还是刻意——搞乱它；也就是说，某人会执行产生无效值的操作。在这些示例中，我们给\
  \ `Date` 赋值了与日历上的日期不对应的值。这些无效对象是定时炸弹；早晚某人无意中使用了这些无效值，并导致运行时错误或——通常更糟——产生错误的结果。\n\
  \n这些忧虑让我们得出结论：`Date` 的表示除了通过我们提供的公共成员函数外，应该对用户应该是不可访问的。这里是初步方案：\n\n点击此处查看代码\n\n\
  ```\n// 简单的 Date（控制访问权限）\nclass Date {\n         int y, m, d;                  \
  \                 // 年，月，日\npublic:\n         Date(int y, int m, int d);       \
  \       // 检查有效日期并初始化\n         void add_day(int n);                  // 将 Date\
  \ 增加 n 天\n         int month() { return m; }\n         int day() { return d; }\n\
  \         int year() { return y; }\n};\n```\n\n我们可以这样使用它：\n\n点击此处查看代码\n\n```\nDate\
  \ birthday {1970, 12, 30};                       // OK\nbirthday.m = 14;       \
  \                                    // 错误：Date::m 是私有的\ncout << birthday.month()\
  \ << '\\n';                // 我们提供了读取 m 的方法\n```\n\n**AA**\n\n“有效的 `Date`”的概念是“有效值”想法的一个重要特殊用例。我们尝试设计类型，以保证值是有效的；也就是说，我们隐藏表示形式，提供一个只创建有效对象的构造函数，并设计所有成员函数以期望有效值，并在返回时只留下有效值。对象的值通常称为其*状态*（state），因此有效值的概念通常被称为对象的*有效状态*（valid\
  \ state）。\n\n另一种方案是，我们在每次使用对象时都检查有效性，或者只希望没有人留下无效值。经验表明，“希望”可能会导致“过得去”的程序。然而，产生偶尔产生错误结果和偶尔崩溃的“过得去”的程序，绝不是作为专业人士赢得朋友和尊重的方法。我们倾向于编写可以被证明是正确的代码。\n\
  \n**CC**\n\n规定什么构成有效值的规则称为*不变性*（invariant）。`Date` 的不变性（“一个 `Date` 必须代表过去、现在或未来的某一天”）异常难以精确描述：记住闰年、格列哥利历法、时区等。然而，对于\
  \ `Date` 的简单实际用途，我们可以做到。例如，如果我们正在分析网络日志，就不需要受困于格列哥利历、儒略历或玛雅历了。如果我们想不出良好的不变性，那么我们可能处理的是纯数据。如果是这样，请使用\
  \ `struct`。\n\n### 8.4.4 定义成员函数\n\n到目前为止，我们从接口设计者和用户的角度查看了 `Date`。但早晚我们必须实现这些成员函数。首先，这里有一个重新整理的\
  \ `Date` 子集，以适应先提供公共接口的常用风格：\n\n点击此处查看代码\n\n```\n// 简单的 Date（许多人倾向于将实现细节放在最后）\n\
  class Date {\npublic:\n         Date(int y, int m, int d);     // 构造函数：检查有效日期并初始化\n\
  \         void add_day(int n);         // 将 Date 增加 n 天\n         int month();\n\
  \         // ...\nprivate:\n         int y, m, d;                         // 年，月，日\n\
  };\n```\n\n许多人将公共接口放在前面，是因为接口是大多数人感兴趣的。原则上讲，用户不需要查看实现细节。现实中，我们通常很好奇，会快速查看实现看起来是否合理，以及实现者使用了某些我们可以学习的技术。然而，除非我们是实现者，否则我们确实倾向于在公共接口上花费更多时间。编译器并不关心类函数和数据成员的顺序；它会按照你愿意呈现的任何顺序处理声明。\n\
  \n当我们在类外定义成员函数时，需要说明它是哪个类的成员。我们使用 `class_name` `::` `member_name` 记法来实现这一点：\n\n\
  点击此处查看代码\n\n```\nDate::Date(int yy, int mm, int dd)     // 构造函数\n         :y{yy},\
  \ m{mm}, d{dd}               // 初始化列表\n         {\n         }\n\nvoid Date::add_day(int\
  \ n)               // 将 Date 增加 n 天\n{\n         // ...\n}\n\nint Date::month()\
  \                       // 返回 m\n{\n         return m;\n}\n```\n\n`:y{yy}, m{mm},\
  \ d{dd}` 记法称为（成员）初始化列表。我们使用此类列表来显式初始化成员。我们可以写成：\n\n```cpp\nDate::Date(int yy, int\
  \ mm, int dd)     // 构造函数\n{\n         y = yy;\n         m = mm;\n         d = dd;\n\
  }\n```\n\n然而，这样我们将先初始化成员，然后给它们赋值。这会带来在成员初始化之前不小心使用的可能性。`:y{yy}, m{mm}, d{dd}` 记法更直接地表达了我们的意图。这种区别与完全相同：\n\
  \n```cpp\nint x;       // 先定义变量\n// ...\nx = 2;         // 后赋值给 x\n```\n\n和\n\n\
  ```cpp\nint x = 2;   // 定义并立即初始化为 2\n```\n\n我们也可以在类内部定义成员函数：\n\n```cpp\nclass Date\
  \ {\npublic:\n         Date(int yy, int mm, int dd)\n                  :y{yy}, m{mm},\
  \ d{dd}\n         {\n         }\n\n         void add_day(int n)\n         {\n  \
  \                // ...\n         }\n         int month() { return m; }\n\n    \
  \     // ...\nprivate:\n         int y, m, d;     // 年，月，日\n};\n```\n\n在类定义内编写成员函数的定义，我们首先注意到的是类声明变得更大、更乱了。在这个示例中，构造函数和\
  \ `add_day()` 的代码每个可能有十多行。这使得类声明大了几倍，并使得难以在实现细节中找到接口。因此，我们不在类声明中定义大型函数。\n\n然而，看\
  \ `month()` 的定义。这种方式简单直接，比将 `Date::month()` 放在类外的版本要短。对于这种简短、简单的函数，我们可以考虑在类声明中直接定义。\n\
  \n注意，`month()` 可以引用 `m`，即使 `m` 在 `month()` 之后（下方）定义。成员可以引用其类的函数或数据成员，而不论该其他成员在类中声明的位置。在某些名称之前必须先声明的规则在类的有限范围内被放宽了。\n\
  \n在类定义中编写成员函数的定义会有三个影响：\n\n\n\n\n- 该函数将是 `inline`（内联的）；也就是说，编译器将尝试在每个调用点为函数生成代码，而不是使用函数调用指令来使用公共代码。对于像\
  \ `month()` 这样几乎不执行操作但被频繁调用的函数，这可以带来显著的性能优势。\n- 每当我们修改内联函数的体时，对该类的所有使用处都必须重新编译。如果函数体在类声明之外，则只有当类声明本身发生变化时，才需要重新编译用户。在大型程序中，在函数体变化时不需要重新编译可能是一个巨大的优势。\n\
  - 类定义变得更大了。因此，在成员函数定义中查找成员可能会变得困难。\n\n## AA\n\n一个显而易见的经验法则是：除非你确定需要通过内联小函数来获得性能提升，否则不要将成员函数体放在类声明中。大型函数（例如五行或更多代码的）无法从内联中获益，并且会让类声明变得更难阅读。我们很少内联包含一个或两个表达式的函数。\n\
  \n## Try This（尝试一下）\n\n运行目前 `Date` 版本的一些示例用法。为此，我们需要为 `Date` 提供一个输出运算符。`PPP_support`\
  \ 中已经有一个，但现在请使用\n\n点击此处查看代码图像\n\n```\nostream& operator<<(ostream& os, Date d)\n\
  {\n        return os << d.year() << '/’ << d.month() << '/’ << d.day();\n}\n```\n\
  \n第 9 章 解释了它的工作原理以及如何工作。\n\n### 8.4.5 引用当前对象\n\n考虑目前 `Date` 类的简单用法：\n\n点击此处查看代码图像\n\
  \n```\nclass Date {\n         // ...\n         int month() { return m; }\n     \
  \    // ...\nprivate:\n         int y, m, d;     // 年，月，日\n};\n\nvoid f(Date d1,\
  \ Date d2)\n{\n         cout << d1.month() << ' ' << d2.month() << '\\n';\n}\n```\n\
  \n`Date::month()` 如何知道在第一次调用中返回 `d1.m` 的值，而在第二次调用中返回 `d2.m`？再次查看 `Date::month()`；它的声明没有指定函数参数！`Date::month()`\
  \ 如何知道它是为哪个对象调用的？类成员函数（如 `Date::month()`）有一个隐式参数，它使用该参数来识别被调用的对象。因此，在第一次调用中，`m`\
  \ 正确地指向 `d1.m`，在第二次调用中，它指向 `d2.m`。关于此隐式参数的更多用法，请参阅 §15.8。\n\n### 8.4.6 报告错误\n\n\
  ## CC\n\n当我们发现无效日期时该怎么办？在代码的哪里查找无效日期？从 §4.6 我们知道，第一个问题的答案是“抛出异常”，而显而见的查找位置是我们第一次构造\
  \ `Date` 的地方。如果我们不创建 `Date` 并且正确地编写我们的成员函数，我们就永远不会有具有无效值的 `Date`。因此，我们将阻止用户创建具有无效状态的\
  \ `Date`：\n\n点击此处查看代码图像\n\n```\n// 简单的 Date（防止无效日期）\nclass Date {\npublic:\n   \
  \      class Invalid { };                         // 用于异常\n         Date(int y,\
  \ int m, int d);              // 检查有效日期并初始化\n         // ...\n         bool is_valid();\
  \                           // 如果日期有效则返回 true\nprivate:\n         int y, m, d; \
  \                              // 年，月，日\n};\n```\n\n我们将有效性测试放在一个单独的 `is_valid()`\
  \ 函数中，因为检查有效性在逻辑上与初始化是不同的，我们可能想要有多个构造函数。如你所见，我们可以有私有函数以及私有数据：\n\n点击此处查看代码图像\n\n\
  ```\nDate::Date(int yy, int mm, int dd)\n         : y{yy}, m{mm}, d{dd}        \
  \        // 初始化数据\n{\n         if (!is_valid())                               //\
  \ 检查有效性\n                  throw Invalid{};\n}\n\nbool Date::is_valid()        \
  \                    // 如果日期有效则返回 true\n{\n         return 0<m<13;             \
  \     // 非常不完整的检查\n}\n```\n\n鉴于 `Date` 的定义，我们可以写：\n\n点击此处查看代码图像\n\n```\nvoid f(int\
  \ x, int y)\ntry{\n         Date dxy {2024,y};\n         cout << dxy << '\\n';\n\
  \         dxy.add_day(2);\n}\ncatch(Date::Invalid) {\n          error(\"f(): invalid\
  \ date\");          // 定义在 §4.6\n}\n```\n\n我们现在知道 `<<` 和 `add_day()` 将在一个有效的 `Date`\
  \ 对象上进行操作。在完成我们的 `Date` 类的演变（8.7）之前，我们现在绕个路来描述我们需要的运算符重载。\n\n### 8.5 举举\n\n## CC\n\
  \n`enum`（枚举）是一种非常简单的用户定义类型，通过符号常量来指定它的值集合（枚举量）。例如：\n\n点击此处查看代码图像\n\n```\nenum class\
  \ Month {\n         jan, feb, mar, apr, may, jun, jul, aug // 1\n};\n```\n\n枚举的“体”仅仅是它的枚举量。`enum\
  \ class` 意味着枚举量在作用域内。也就是说，为了引用 `jan`，我们必须说 `Month::jan`。你可以赋予枚举量一个特定的值，就像我们为 `jan`\
  \ 做的那样，或者让编译器选择合适的值。如果你让编译器选择，它会给每个枚举量递加 1。因此，我们可以这样写：\n\n```\nenum class Month\
  \ {\n         jan=1, feb=2, mar=3, apr=4, may=5, jun=6, jul=7, aug=8, sep=9, oct=10,\
  \ nov=11, dec=12\n};\n```\n\n然而，这样做很麻烦且容易出错。让编译器处理这类重复性任务比我们更擅长，而且它不会感到无聊。\n\n如果我们不初始化第一个枚举量，计数从\
  \ 0 开始。例如：\n\n点击此处查看代码图像\n\n```\nenum class Day {\n         monday, tuesday, wednesday,\
  \ thursday, friday, saturday, sunday\n};\n```\n\n这里 `monday` 表示 `0`，而 `sunday` 表示\
  \ `6`。从 0 开始通常是一个很好的选择。\n\n我们可以这样使用我们的 `Month`：\n\n点击此处查看代码图像\n\n```\nMonth m1 =\
  \ Month::feb;\nMonth m2 = feb;                        // 错误：feb 不在作用域内\nMonth m3\
  \ = 7;                           // 错误：不能将 int 赋值给 Month\nMonth m4 = Month{7}; \
  \            // OK：显式转换\nMonth m5 {7};                           // OK：显式初始化\n\n\
  int x1 = m1;                              // 错误：不能将 Month 赋值给 int\nint x2 = int{m1};\
  \                       // 错误：窄转换\nint x3 = to_int(m1);                  // 将 Month\
  \ 转换为 int；见下文\n```\n\n`Month` 是一个与其“底层类型” `int` 独立的类型。每个 `Month` 都有对应的整数值，但大多数 `int`\
  \ 并没有对应的 `Month`。例如，我们确实希望这种初始化失败：\n\n点击此处查看代码图像\n\n```\nMonth bad = 9999;     \
  \        // 错误：不能将 int 转换为 Month\n```\n\n## XX\n\n显式的 `Month{7}` 转换是不经过检查的，因此只有在你确定要转换的值符合你对\
  \ `Month` 的定义时才使用它。我们无法为枚举定义构造函数来检查初始化值，但编写一个简单的检查函数是轻而易举的：\n\n\n\n\n\n点击此处查看代码图像\n\
  \n```\nMonth int_to_month(int x)\n         // 检查后的转换\n{\n         if (x<to_int(Month::jan)\
  \ || to_int(Month::dec)<x)\n                  error(\"bad month\");\n         return\
  \ Month{x};\n}\n```\n\n我们使用 `to_int(Month::jan)` 符号来获取 `Month::jan` 的 `int` 表示表示。例如：\n\
  \n点击此处查看代码图像\n\n```\nvoid f(int m)\n{\n         Month mm = int_to_month(m);\n  \
  \       // ...\n}\n```\n\n将 `Month` 转换为其底层类型 `int` 的方法有点混乱，因此在 `PPP_support` 中，我们定义了一个函数来实现：\n\
  \n点击此处查看代码图像\n\n```\nint to_int(Month m)\n{\n         return static_cast<int>(m);\n\
  }\n```\n\n我们用枚举是做什么的？基本上，当我们需要一组相关的命名整数常量时，枚举就是很有用的。当我们尝试表示一组备选项（`up`、`down`；`yes`、`no`、`maybe`；`on`、`off`；`n`、`ne`、`e`、`se`、`s`、`sw`、`w`、`nw`）或不同的值（`red`、`blue`、`green`、`yellow`\
  \ 等等）时，这种情况经常发生。\n\n#### 8.5.1 “普通”枚举\n\n除了 `enum class`（也称为作用域枚举）外，还有“普通”枚举，它们与作用域枚举的区别在于会隐式地将枚举器“导出”到枚举的作用域范围内，并允许到\
  \ `int` 的隐式转换。例如：\n\n点击此处查看代码图像\n\n```\nenum Month {                 // 注意：没有“class”\n\
  \         jan=1, feb, mar, apr, may, jun, jul, aug, sep, oct, nov, dec\n};\n\nMonth\
  \ m1 = feb;                        // OK: feb 在作用域内\nMonth m2 = Month::feb;    \
  \      //  OK\nMonth m3 = 7;                           // error：不能将 int 赋值给 Month\n\
  Month m4 = Month{7};             // OK: 显式转换\n\nint x1 = m1;                   \
  \           // OK: 我们可以将 Month 赋值给 int\n```\n\n显然，“普通” `enum` 没有 `enum class` 那么严格。它们的枚举器会“污染”定义其枚举器的作用域。这可能是一种便利，但偶尔会导致意外。例如，如果你尝试将此\
  \ `Month` 与 `iostream` 格式化机制（§9.10.1）一起使用，你会发现代表十二月的 `dec` 与代表十进制的 `dec` 冲突。\n\n\
  同样，让枚举值转换为 `int` 可以让我们在想要转换为 `int` 时无需显式转换，这在某些时候是便利的。然而，当我们不想要这种隐式转换时，可能会导致意外和错误。例如：\n\
  \n点击此处查看代码图像\n\n```\nvoid bad_code(Month m)\n{\n         if (m==17)            \
  \                        // 哈：第 17 个月？\n                  do_something();\n    \
  \     if (m==monday)                          // 哈：将月份与周一比较？\n                 \
  \ do_something_else();\n}\n```\n\n如果 `Month` 是 `enum class`，这两个条件都无法编译。如果 `Month`\
  \ 是普通枚举且 `monday` 是普通枚举的枚举器，而不是 `enum class`，那么两个比较都会成功，但结果可能是不想要的。\n\n尽量使用更简单、安全的\
  \ `enum class` 而不是普通 `enum`，但在旧代码中可能会看到普通 `enum`：`enum class` 是 C++11 引入的。\n\n###\
  \ 8.6 运算符重载\n\n你可以为类或枚举操作定义几乎所有的 C++ 运算符。这通常被称为*运算符重载*。当我们为设计的类型提供惯用符号时使用它。例如，我们可以为\
  \ `Month` 类型提供一个自增运算符：\n\n点击此处查看代码图像\n\n```\nenum class Month {\n         jan=1,\
  \ feb, mar, apr, may, jun, jul, aug, sep, nov, dec\n};\n\nMonth operator++(Month&\
  \ m)           // 前置自增运算符\n{\n         m = (m==Month::dec) ? Month::jan : Month{to_int(m)+1};\
  \ // “回绕”\n         return m;\n}\n```\n\n`? :` 结构是一个算术表达式：如果 `(m==Dec)` 则 `m` 变为\
  \ `Jan`，否则变为 `Month(to_int(m)+1)`。它是表示月份在十二月后“回绕”这一事实的一种相当优雅的方法。`Month` 类型可以这样使用：\n\
  \n点击此处查看代码图像\n\n```\nMonth m = Month::dec;\n++m; // m 现在是 jan\n```\n\n\n\n\n我们已经论证了类的公共接口和实现部分应该是分离的。只要我们允许对仅作为数据集合的类型使用\
  \ `struct`，很少专业人士会不同意。然而，我们如何设计一个良好的接口呢？什么区分了良好的公共接口与混乱的代码？答案的某只能通过示例给出，但我们可以列出几个通用原则，这些原则在\
  \ C++ 中得到了某些支持：\n\n* 保持接口完整。\n* 保持接口极简。\n* 提供构造函数。\n* 支持拷贝（或禁止拷贝）（参见 §12.4.1）。\n\
  * 使用类型提供良好的参数检查。\n* 识别非修改的成员函数（参见 §8.7.4）。\n* 在析构函数中释放所有资源（参见 §15.5）。\n\n另见 §4.5）。\n\
  \n让我们来看其他——不那么抽象且有更直接支持的理想。\n\n### 8.7.1 参数类型\n\n当我们在 §8.4.3 中为 `Date` 定义构造函数时，使用了三个\
  \ `int` 作为参数。这导致了一些问题：\n\n点击此处查看代码图像\n\n```\nDate d1 {4,5,2005};      // 错误：年份 4，日期\
  \ 2005\nDate d2 {2005,4,5};      // 4 月 5 日还是 5 月 4 日？\n```\n\n第一个问题（非法的日期）可以通过构造函数中的测试轻松处理。第二个问题仅仅是月份和日期的写法习惯不同；例如，4/5\
  \ 在美国是 4 月 5 日，在英国是 5 月 4 日。我们无法通过计算来解决这个问题，必须采取其他措施。显而易见的解决方案是使用 `Month` 类型：\n\n\
  点击此处查看代码图像\n\n```cpp\nenum class Month {\n         jan=1, feb, mar, apr, may, jun,\
  \ jul, aug, sep, oct, nov, dec\n};\n\n//简单的 Date (使用 Month 类型)\nclass Date {\npublic:\n\
  \         Date(int y, Month m, int d);               // 检查有效日期并初始化\n         //\
  \ ...\nprivate:\n         int y;                 // 年份\n         Month m;\n    \
  \     int d;                 // 日\n};\n```\n\n当我们使用 `Month` 类型时，如果我们交换了月份和日期，编译器会捕获到，而且使用枚举作为\
  \ `Month` 类型也为我们提供了符号化名称。读取和编写符号名称通常比比弄数字要容易，因此也不易出错：\n\n点击此处查看代码图像\n\n```cpp\n\
  Date dx1 {1998, 4, 3};                                 // 错误：第二个参数为 Month\nDate\
  \ dx2 {1998, 4, Month::mar};                // 错误：第二个参数不是 Month\nDate dx3 {4, Month::mar,\
  \ 1998};                // 错误：运行时错误：日期\nDate dx4 {Month::mar, 4, 1998};        \
  \       // 错误：第二个参数不是 Month\nDate dx5 {1998, Month::mar, 30};              // OK\n\
  ```\n\n这处理了大多数“意外错误”。注意使用枚举名对枚举成员符 `mar` 进行限定：`Month::mar`。我们不说 `Month.mar`，因为 `Month`\
  \ 不是对象（它是一个类型），而 `mar` 不是数据成员（它是一个枚举符）。在类、枚举或命名空间名称后使用 `::` (7.6.1)，在对象名称后使用 `.`。\n\
  \n当我们有选择时，在编译期捕获错误而不是运行时。我们更倾向于让编译器发现错误，而不是由我们来精确判断问题发生在代码的哪个位置。重要的是，编译期捕获的错误不需要我们编写测试代码。在编译期捕获错误使代码更简单、更快速。\n\
  \n这样想，我们能捕获日期和年份的交换吗？可以，但解决方案没有那么简单或优雅。正如 `Month` 那样，我们可能需要做一些事情，定义一个 `Year` 类型：\n\
  \n```cpp\nstruct Year {\n         int y;\n};\n\nclass Date {\npublic:\n        \
  \ Date(Year y, Month m, int d);               // 检查有效日期并初始化\n         // ...\nprivate:\n\
  \         Year y;\n         Month m;\n         int d;                 // 日\n};\n\
  ```\n\n现在我们得到：\n\n点击此处查看代码图像\n\n```cpp\nDate dx1 {Year{1998}, 4, 3};           \
  \                      // 错误：第二个参数为 Month\nDate dx2 {Year{1998}, 4, Month::mar};\
  \                // 错误：第二个参数不是 Month\nDate dx3 {4, Month::mar, 1998};          \
  \      // 错误：第一个参数不是 Year\nDate dx4 {Month::mar, 4, Year{1998}};               //\
  \ 错误：第二个参数不是 Month\nDate dx5 {Year{1998}, Month::mar, 30};              // OK\n\
  Date dx6 {Year{4}, Month::mar, 1998};               // 运行时错误：Year 无效\n```\n\n我们可以修改\
  \ `Year` 来检查可能的年份，但这些额外工作值得吗？自然，这取决于你使用 `Date` 解决的问题。\n\n### 8.7.2 拷贝\n\n我们总是必须创建对象；也就是说，我们必须考虑初始化和构造函数。可以说它们是类最重要的成员：编写它们时，你必须决定如何初始化一个对象以及一个值有效的含义（不变式是什么？）。仅仅思考初始化就能帮助你避免错误。\n\
  \n下一个要考虑的问题通常是：我们可以拷贝我们的对象吗？如果是，我们如何拷贝它们？\n\n对于 `Date` 或 `Month`，答案是我们显然想要拷贝该类型的对象，并且拷贝的意义是微不足道的：只需拷贝所有成员。实际上，这是默认情况。所以只要你没有其他说明，编译器就会这样做。例如，当你作为初始化器或赋值的右侧拷贝\
  \ `Date` 时，它的所有成员都会被拷贝：\n\n点击此处查看代码图像\n\n```cpp\nDate holiday {Year{1978}, Month::jul,\
  \ 4};                  // 初始化\nDate d2 = holiday;\nDate d3 = Date{Year{1978}, Month::jul,\
  \ 4};\nholiday = Date{Year{1978}, Month::dec, 24};            // 赋值\nd3 = holiday;\n\
  ```\n\n这些都将按照预期工作。`Date{Year{1978}, Month::dec, 24}` 这种表示法产生一个相应的匿名 `Date` 对象，然后你可以相应地使用它。例如：\n\
  \n\n\n\n点击此处查看代码图像\n\n```\ncout << Date{Year{1978}, Month::dec, 24};\n```\n\n这是构造函数的一种用法，其作用非常像一个类类型的字面量。它通常被视为一种方便的替代方案，避免了先定义一个变量或\
  \ `const` 然后然后只使用一次的情况。\n\n如果我们不想要拷贝的默认含义呢？我们可以定义自己的（§17.4）或者 `delete` 拷贝构造函数和拷贝赋值（§12.4.1）。\n\
  \n### 8.7.3 默认构造函数\n\n**CC**\n\n未初始化的变量可能是错误的严重来源。为了解决这个问题，我们引入了构造函数的概念，以确保类的每个对象都被初始化。例如，我们声明了构造函数\
  \ `Date::Date(int,Month,int)` 以确保每个 `Date` 都能被正确初始化。对于 `Date` 来说，这意味着程序员必须提供三个正确类型的参数。例如：\n\
  \n点击此处查看代码图像\n\n```\nDate d0;                                                //\
  \ error: no initializer\nDate d1 {};                                           \
  \ // error: empty initializer\nDate d2 {Year{1998}};                          //\
  \ error: too few arguments\nDate d3 {Year{1},2,3,4};                       // error:\
  \ too many arguments\nDate d4 {Year{1},\"jan\",2};                   // error: wrong\
  \ argument type\nDate d5 {Year{1},Month::jan,2};         // OK: 使用三参数构造函数\nDate\
  \ d6 {d5};                                        // OK: 使用拷贝构造函数\n```\n\n注意，即使我们为\
  \ `Date` 定义了构造函数，我们仍然可以拷贝 `Date` 对象。\n\n许多类对默认值都有很好的概念；也就是说，对于问题“如果不给它初始化器，它应该是什么值？”有一个显而易见的答案。例如：\n\
  \n点击此处查看代码图像\n\n```\nstring s1;                            // default value: 空字符串\
  \ \"\"\nvector<string> v1;             // default value: 空 vector; 无元素\n```\n\n\
  这看起来很合理。它甚至按照注释指示的方式在工作。这是通过为 `vector` 和 `string` 分别提供一个*默认构造函数*来实现的，隐式地提供了所需的初始化。可以在无参数的情况下调用的构造函数被称为默认构造函数。\n\
  \n使用默认构造函数不仅仅是为了外观。想象一下，如果我们拥有一个未初始化的 `string` 或 `vector`，可能会得到什么样的错误：\n\n点击此处查看代码图像\n\
  \n```\nstring s;                                       // 假设 s 可能是未初始化的\nfor (int\
  \ i = 0; i<s.size(); ++i)       // oops: 循环次数未定义\n         s[i] = toupper(s[i]);\
  \           // oops: 写随机内存位置\n\nvector<string> v;                       // 假设 v\
  \ 可能是未初始化的\nv.push_back(\"bad\");                 // oops: 写入随机地址\n```\n\n如果 `s`\
  \ 和 `v` 的值真的是未定义的，那么 `s` 和 `v` 将不知道它们包含多少元素或（使用常用的实现技术；参见第 17 章）这些元素应该存储在哪里。结果将是使用随机地址——这可能导致最糟糕的错误。基本上，没有构造函数，我们就无法建立不变性——我们无法确保这些变量中的值是有效的（§8.4.3）。我们必须坚持要求此类变量被初始化。我们可以坚持使用初始化器并编写：\n\
  \n```\nstring s2 = \"\";\nvector<string> v2 {};\n```\n\n这并不特别漂亮，有点冗长。然而，对于 `string`\
  \ 和 `vector`，“，“空”是一个合理且有效的默认值，因此标准提供了它。\n\n然而，对于许多类型，要找到一个合理的默认值表示并不容易。对于许多类型，定义在一个没有显式初始化的情况下赋予对象创建意义的构造函数更好。\n\
  \n日期没有显而见的默认值。这就是为什么我们为止还没有为 `Date` 定义默认构造函数，但让我们提供一个（仅仅是为了展示我们可以这样做）。我们必须选择一个默认日期。21\
  \ 世纪的第一天可能是一个合理的选择：\n\n点击此处查看代码图像\n\n```\nclass Date {\npublic:\n         Date()\
  \                         // 默认构造函数（不接受参数）\n                  :y{Year{2001}}, m{Month::jan},\
  \ d{1}\n         {\n         }\n         // ...\n}\n```\n\n现在我们可以写道：\n\n点击此处查看代码图像\n\
  \n```\nDate d;               // d = {Year{2001},Month::jan,1}\n```\n\n与其将成员的默认值放在构造函数中，我们可以将它们放在成员本身上：\n\
  \n点击此处查看代码图像\n\n```cpp\nclass Date {\npublic:\n         // ...\n         Date()\
  \                         :y{Year{2001}}, m{Month::jan}, d{1}\n         {\n    \
  \     }\nprivate:\n         Year y;\n         Month m;\n         int d;\n};\n```\n\
  \n这样，默认值对每个构造函数都可用。例如：\n\n点击此处查看代码图像\n\n```\nDate d;               // d = {Year{2001},Month::jan,1}\n\
  ```\n\n因为 `Date(int)` 没有显式初始化 `m` 或 `d`，所以使用了 `Month::jan` 和 `1`。作为声明一部分指定的成员初始化被称为*默认成员初始化*或*类内初始化*。\n\
  \n**CC**\n\n对于类型 `T`，`T{}` 是默认值的表示，因此 `int{}` 是 `0` 的复杂写法，`double{}` 是 `0.0` 的冗长写法。然而，`}`\
  \ 可简化变量的初始化：\n\n点击此处查看代码图像\n\n```\nvoid test()\n{\n         double x0;         \
  \          // 初始化；不要这样做\n         double x1 {0};             // 初始化为 0\n       \
  \  double x2 = 0;             // 初始化为 0\n         double x3 {};               //\
  \ 初始化为 0\n}\n```\n\n### 8.7.4 const 成员函数\n\n某些变量是为了更改的——这就是我们称它们为“变量”的原因——有些不是；也就是说，我们拥有表示不可变值的“变量”。这些我们通常称之为*常量变量*（sic!）、*常量*或简单的\
  \ **const**。考虑：\n\n点击此处查看代码图像\n\n```\nDate d;\nconst Date start_of_term;\n\nint\
  \ a = d.day();                                      // OK\nint b = start_of_term.day();\
  \                 // 应该是 OK（为什么？），但不是\n\nd.add_day(3);                         \
  \              // OK\nstart_of_term.add_day(3);                 // error\n```\n\n\
  \n\n\n在这里，`d` 是可变的，但 `start_of_term` 在一个 `const` 中。改变 `start_of_term` 的值是不允许的。到目前为止一切正常，但为什么可以使用\
  \ `day()` 读取 `start_of_term` 的 `day` 呢？根据目前 `Date` 的定义，`start_of_term.day()` 是一个错误，因为编译器不知道\
  \ `day()` 不改变它的 `Date`。我们从未告诉过它，所以编译器假设 `day()` 可能会修改它的 `Date`（就像 `add_day()` 一样），并报告错误。\n\
  \n##### AA\n\n我们通过将类的操作分类为“修改修改的”和“非修改的”来解决这个问题。这是一个帮助我们理解类的基本区别。它还具有实际意义：不修改对象的操作可以在\
  \ `const` 对象上被调用。例如：\n\n点击此处查看代码图像\n\n```cpp\nclass Date {\npublic:\n         //\
  \ ...\n         int day() const;                            // const 成员：不能修改对象\n\
  \         Month month() const;                 // const 成员：不能修改对象\n         Year\
  \ year() const;                        // const 成员：不能修改对象\n\n         void add_day(int\
  \ n);                    // 非 const 成员：可以修改对象\n         void add_month(int n); \
  \              // 非 const 成员：可以修改对象\n         void add_year(int n);            \
  \       // 非 const 成员：可以修改对象\nprivate:\n         Year y;\n         Month m;\n  \
  \       int d;                                             // 日期\n};\n\nDate d {2000,\
  \ Month::jan, 20};\nconst Date cd {2001, Month::feb, 21};\ncout << d.day() << \"\
  \ − \" << cd.day() << '\\n';       // OK\nd.add_day(1);                        \
  \                               // OK\ncd.add_day(1);                          \
  \                           // error: cd 是 const\n```\n\n我们在成员函数声明的参数列表之后直接使用 `const`，以表示该成员函数可以在\
  \ `const` 对象上被调用。一旦我们声明了一个 `const` 成员函数，编译器就会要求我们遵守承诺，不修改对象。例如：\n\n点击此处查看代码图像\n\n\
  ```cpp\nint Date::day() const\n{\n         ++d;          // error: 尝试从 const 成员函数修改对象\n\
  \         return d;\n}\n```\n\n当然，我们不会刻意通过这种方式“作弊”。然而，编译器通过防止意外的违规来帮助类的实现者。\n\n\
  ##### 8.7.5 成员函数和辅助函数\n\n##### AA\n\n当我们设计的接口尽可能精简（尽管是完备的）时，我们必须忽略许多仅仅是有用的操作。如果一个函数可以简单、优雅且高效地实现为一个一个立函数（即非成员函数），那么它就应该在类之外实现。这样一来，该函数中的错误就不会直接腐损坏类对象中的数据。不访问表示（representation）是非常重要的，因为通常的调试技术是“寻找常见的嫌疑人”；也就是说，当类出现问题时，我们首先查看直接访问表示的函数：其中一个几乎肯定是它干的。如果有十几个这样的函数，我们会比有\
  \ 50 个时要开心得多。\n\n一个 `Date` 类有五十个函数！你一定在怀疑我们是否开玩笑。我们没有：几年前，我调查了一些商业化使用的 `Date` 库，发现它们充满了像\
  \ `next_Sunday()`、`next_workday()` 等成员函数。对于一个为了方便用户使用而不是为了易于理解、实现和维护而设计的类来说，五十个函数并不是一个不合理的数字。\n\
  \n还要注意，如果表示发生了变化，只有直接访问表示的函数需要重写。这是保持接口精简的另一个强有力的实际理由。在我们的 `Date` 示例中，我们可能用表示自 1900\
  \ 年 1 月 1 日以来天数的整数，比（年,月,日）更适合我们用途的表示。只需要更改成员函数即可。\n\n这里是一些*辅助函数*（helper functions）的示例：\n\
  \n点击此处查看代码图像\n\n```cpp\nDate next_Sunday(const Date& d)\n{\n         // 使用 d.day(),\
  \ d.month(), 和 d.year() 访问 d\n         // 返回一个新的 Date\n}\n\nDate next_weekday(const\
  \ Date& d) { /* ... */ }\n\nbool leapyear(int y) { /* ... */ }\n\nbool operator==(const\
  \ Date& a, const Date& b)\n{\n         return a.year()==b.year()\n             \
  \    && a.month()==b.month()\n                 && a.day()==b.day();\n}\n\nbool operator!=(const\
  \ Date& a, const Date& b)\n{\n         return !(a==b);\n}\n```\n\n##### CC\n\n辅助函数也被称为*便利函数*、*辅助函数*等许多名称。这些函数与非成员函数的区别是逻辑上的；即，“辅助函数”是一个设计概念，而不是语言概念。通常，我们使用命名空间来识别一组辅助函数；参见\
  \ §7.6：\n\n点击此处查看代码图像\n\n```cpp\nnamespace Chrono {\n         enum class Month {\
  \ /* ... };\n         class Date { /* ... };\n         bool is_date(int y, Month\
  \ m, int d);                              // 对于有效日期返回 true\n         Date next_Sunday(const\
  \ Date& d) { /* ... }\n         Date next_weekday(const Date& d) { /* ... }\n\n\
  \         bool leapyear(int y) { /* ... */ }\n}\n```\n\n注意 `==` 和 `!=` 函数。它们是典型的辅助函数。对于许多类，`==`\
  \ 和 `!=` 是显而易见的，但由于它们并不是所有类都有意义，编译器无法像编写拷贝构造函数和拷贝赋值运算符那样编写它们。\n\n注意我们还引入了一个辅助函数\
  \ `is_date()`。该函数取代了 `Date::is_valid()`，因为检查日期是否有效在很大程度上独立于 `Date` 的表示。例如，我们不需要知道\
  \ `Date` 对象是如何表示的，就知道“2028 年 1 月 30 日”是有效日期，而“2028 年 2 月 30 日”不是。某些方面仍然取决于表示（例如，我们可以表示\
  \ 1066 年 10 月 14 日吗？），但如果有必要，`Date` 的构造函数可以处理这些。\n\n##### 8.7.6 ISO 标准\n\n我们的 `Date`\
  \ 不差，但与 ISO C++ 标准库中处理时间、日期和时区的设施相比，远不够复杂。然而，现在你已经了解标准库 `chrono` 组件（§20.4\n\n```cpp\n\
  auto birthday = December/16/1770;          // year_month_day{year{1770},December,day{16}}\n\
  ```\n\n`Date` 是这类作为练习构建非常有用的类型，但之后将其删除是很：标准的版本由专家实现，有详尽文档，经过广泛测试，并且被数百万程序员熟悉。其他类似的有用的“练习类”还有\
  \ `string` 和 `vector`。我们在第 15 章](#ch15.xhtml_ch15)、第 19 章](#ch19.xhtml_ch19)、第 20\
  \ 章](#ch20.xhtml_ch20) 和第 21 章](#ch21.xhtml_ch21) 中访问更多标准库内容。\n\n#### 练习题\n\n\n\n\
  按照上述描述编写 `Day`、`Month` 及其关联函数。完成 `Date` 的最终版本，包含默认构造函数、`is_valid()`、`Month`、`Year`\
  \ 等。定义一个名为 `today` 的 `Date` 对象并初始化为 2020 年 2 月 2 日。然后定义一个名为 `tomorrow` 的 `Date`\
  \ 对象，通过将 `today` 拷贝进去并使用 `add_day()` 增加一天来为其赋值。最后，使用 §9.6 和 §9.7 中定义的 `<<` 输出 `today`\
  \ 和 `tomorrow`。\n\n你对有效日期的检查 `is_valid()` 可以非常简单。可以忽略闰年。但不要接受不在 [1,12] 范围内的月份或不在\
  \ [1,31] 范围内的日期。用至少一个无效日期（例如 2004, 13, -5）测试每个版本。\n\n## 复习\n\n[1] 根据本章的描述，类的两个部分是什么？\n\
  \n[2] 类中的接口（interface）和实现（implementation）之间有什么区别？\n\n[3] §8.4.1 中 `struct Date`\
  \ 的局限性和问题是什么？\n\n[4] 为什么 `Date` 类型使用构造函数而不是 `init_day()` 函数？\n\n[5] 什么是不变性（invariant）？请举例。\n\
  \n[6] 函数应该应该放在类定义中，什么时候应该定义在类外部？为什么？\n\n[7] 什么是默认构造函数？我们什么时候需要它？\n\n[8] 什么是默认成员初始化器（default\
  \ member initializer）？\n\n[9] 程序中何时应该使用运算符重载？列出你可能想要重载的运算符列表（每个给出理由）。哪些运算符可以在 C++\
  \ 中定义？\n\n[10] 为什么类的公共接口应该尽可能小？\n\n[11] 在成员函数上添加 `const` 会发生什么？\n\n[12] 为什么“辅助函数”最好放在类定义之外？\n\
  \n[13] `enum class` 与“普通” `enum` 有什么区别？\n\n## 术语\n\n| 内置类型 | 枚举值 | 表示法 | `class`\
  \ |\n| :--- | :--- | :--- | :--- |\n| 辅助函数 | `struct` | `const` | 实现 |\n| 结构 | 构造函数\
  \ | 类内初始化 | 用户定义类型 |\n| 析构函数 | 内联 | 有效状态 | `enum` |\n| 接口 | 枚举 | 不变性 | `enum class`\
  \ |\n| 运算符重载 | 默认成员初始化器 | | |\n\n## 练习\n\n[1] 为 §8.1 中的现实对象示例列出可能的操作（例如，面包机）。\n\n\
