  \ 引言\n\n**CC**\n\nC++ 标准库中最实用的容器是 `vector`。一个 `vector` 提供了一个给定类型元素的序列。你可以通过索引（下标）引用元素，通过\
  \ `push_back()` 或 `resize()` 扩展 `vector`，使用 `size()` 查询 `vector` 的元素数量，并且在尝试访问越界元素时对\
  \ `vector` 进行访问检查。标准库的 `vector` 是一种方便、灵活、高效（在时间和空间上）且具有静态类型安全的元素容器。标准 `string` 具有类似的属性，其他实用的标准容器类型（如\
  \ `list` 和 `map`）也是如此，我们将在第 20 章中描述它们。然而，计算机内存并不直接支持这些实用的类型。硬件直接支持的只是字节序列。例如，对于\
  \ `vector<double>v`，`v.push_back(2.3)` 操作将 `2.3` 添加到 `double` 序列中，并将 `v` 的元素计数（`v.size()`）增加\
  \ 1。在最底层，计算机对任何如 `push_back()` 这样复杂的东西一无所知；它只知道如何一次读写几个字节。\n\n在本章和接下来的三个章节中，我们将展示如何从每位程序员都可使用的基础语言设施构建一个\
  \ `Vector`。逐渐地，我们的 `Vector` 将越来越接近标准库的 `vector`。这种方法允许我们说明有用的概念和编程技术，并观察它们是如何使用\
  \ C++ 语言特征表示的。我们在实现 `Vector` 时遇到的语言设施和编程技术通常都是很有用且广泛使用的。\n\n一旦我们了解了 `vector` 是如何设计、实现和使用的，就可以继续其他其他库容器（例如\
  \ `map`），并检查 C++ 标准库为它们的使用提供的优雅且高效的设施（第 20 章 和 第 21 章）。这些设施使我们避免了自己编写涉及数据的常见任务。相反，我们可以利用每个\
  \ C++ 实现中现有的工具来简化代码的编写和测试。\n\n**AA**\n\n我们通过一系列日益复杂的 `Vector` 实现来接触标准库的 `vector`。首先，我们构建一个极其简单的\
  \ `Vector`。然后，我们看到该 `Vector` 的哪些不妥之处并修复它。请不要将这些 `Vector` 版本与真实的 `vector` 混淆。这些版本是为了解决单个问题而简化的，因此是有缺陷的。在我们稍后的版本中提到并修复某个缺陷之前，如果你发现了它，请感到高兴。发现缺陷意味着当你在自己的或别人的代码中看到它时，很可能识别出来。当我们对这些严重缺陷的早期版本进行几次改进后，我们将得到一个接近标准库\
  \ `vector` 的 `Vector` —— 它是随你的 C++ 编译器一起提供的，也就是你在之前的章节中一直使用的那个。这种逐步精炼的过程反映了我们通常处理新编程任务的方式。在此过程中，我们遇到并探索了许多与内存使用和数据结构相关的经典问题。基本计划如下：\n\
  \n* 第 15 章：我们如何处理不同大小的内存？特别是 `vector` 如何拥有不同数量的元素？这引导我们检查自由存储区（也称为*堆*）和指针。我们引入析构函数这一关键概念。\n\
  * 第 16 章：我们引入数组并探索它们与指针的关系。我们讨论指针与引用的关系。我们介绍 C 风格字符串。我们提供 `span`、`array` 和 `string`\
  \ 作为底层构造的替代方案。\n* 第 17 章：我们如何复制 `vector`？我们如何为它们提供下标操作？我们如何改变 `vector` 的大小？我们引入了类生命周期和资源管理所需的操作。\n\
  * 第 18 章：我们如何拥有不同元素类型的 `vector`？我们又如何处理越界错误？为了回答这些问题，我们探索模板和异常设施。我们展示一个接近标准库 `vector`\
  \ 的 `Vector`，以及资源管理指针 `unique_ptr` 和 `shared_ptr`。\n\n\n\n\n嗯，我们是程序员（计算机科学家、软件开发人员或类似的身份），而不是物理学家。如果我们研究的是器件物理，那么我们就必须深入研究计算机内存设计的细节。然而，由于我们学习的是编程，我们必须深入研究程序的详细设计。在理论上，我们可以将底层内存访问和管理设施视为“实现细节”，就像我们对待器件物理那样。但是，如果我们真的这样做，我们不仅要“迷信魔法”，而且将无法实现一个新容器（如果我们需要的话，而这并不罕见）。此外，我们将无法阅读大量直接使用内存的\
  \ C 语言和旧版 C++ 代码。正如我们在接下来的几章中看到的，指针（一种引用对象的低级且直接的方式）对于许多与内存管理无关的理由也很有用。在不使用指针的情况下，要用好\
  \ C++ 并不容易。\n\n## XX\n\n从哲学角度上说，我是广大计算机专业人士中的一员，我们认为如果你缺乏对程序如何映射到计算机内存和操作的基础性且实用的理解，那么在牢固掌握高级主题（如数据结构、算法和操作系统）时将会遇到困难。\n\
  \n### 15.2 vector 基础\n\n我们通过考虑 `vector` 的一个简单用法开始对 `Vector` 进行增量设计：\n\n点击此处查看代码图像\n\
  \n```\nvector<double> age(4);            //一个包含 4 个 double 类型元素的 vector\nage[0]=0.33;\n\
  age[1]=22.0;\nage[2]=27.2;\nage[3]=54.2;\n```\n\n这创建了一个具有四个 `double` 类型元素的 `vector`，并给这四个元素赋予了值\
  \ `0.33`、`22.0`、`27.2` 和 `54.2`。这四个元素被编号为 0, 1, 2, 3。C++ 标准库容器中的元素编号始终从 0（零）开始。从\
  \ 0 开始编号非常常见，它是 C++ 程序员之间的通用约定。`vector` 的元素数量称为其大小（size）。因此，`age` 的大小是 4。`vector`\
  \ 的元素从 0 到 `size-1` 编号（索引）。例如，`age` 的元素编号从 0 到 `age.size()−1`。我们可以像这样图形化表示 `age`：\n\
  \n![图表显示了数组元素的划分。数组 age 的大小为 4。age [0]、age [1]、age [2] 和 age [3] 的元素索引值分别为 0.33、22.0、27.2\
  \ 和 54.2。](graphics/f0440-01.jpg)\n\n我们如何在计算机内存中让这种“图形化设计”变为现实呢？我们如何像那样存储和访问这些值？显然，我们必须定义一个类，并且想把这个类名为\
  \ `Vector`。此外，它需要一个数据成员来保存它的大小，另一个保存它的元素。但我们如何表示一个数量可以变化的元素集合呢？我们可以使用标准库的 `vector`，但在这种语境下那是作弊：我们在这里正在构建自己的\
  \ `Vector`。\n\n那么，我们如何表示上面图中的那个箭头呢？考虑一下不使用它。我们可以定义一个固定大小的数据结构：\n\n点击此处查看代码图像\n\n\
  ```\nclass Vector {\n       int size;\n       double age0, age1, age2, age3;\n};\n\
  ```\n\n忽略一些符号细节，我们将得到类似这样的东西：\n\n![图表列出了数组的元素。数组 age 的大小为 4。age 0、age 1、age 2 和\
  \ age 3 的元素索引值分别为 0.33、22.0、27.2 和 54.2。](img/f0440-02.jpg)\n\n## CC\n\n这既简单又好，但当我们第一次尝试用\
  \ `push_back()` 添加元素时，我们就完蛋了：我们没有办法添加元素；元素的数量在程序文中被固定为四个。我们需要一些比一个持有固定数量元素的数据结构更复杂的东西。如果我们定义的\
  \ `Vector` 具有固定数量的元素，就无法实现改变 `vector` 元素数量的操作（如 `push_back()`）。根本上，我们需要一个指向元素集合的数据成员，以便在我们需要更多空间时，让它指向不同的元素集合。我们需要类似于第一个元素的内存地址的东西。在\
  \ C++ 中，可以保存地址的数据类型被称为指针，在语法上通过后缀 `*` 区分，因此 `double*` 意味着“指向 double 的指针”。基于此，我们可以定义第一个版本的\
  \ `Vector` 类：\n\n点击此处查看代码图像\n\n```\nclass Vector {           //一个非常简化的 double 类型\
  \ vector（类似于 vector<double>）\n       int sz;                                   \
  \    //大小\n       double* elem;                          //指向第一个元素（double 类型）的指针\n\
  public:\n       Vector(int s);                             //构造函数：分配 s\n       int\
  \ size() const { return sz; }             //当前大小\n};\n```\n\n### 15.3 内存、地址与指针\n\
  \nCC\n\n从哲学角度上说，我是广大计算机专业人士中的，我们认为如果你缺乏对程序如何映射到计算机内存和操作的基础性且实用的理解，那么在牢固掌握高级主题（如数据结构、算法和操作系统）时将会遇到困难。\n\
  \n根本上，我们将计算机内存视为一组从 0 到内存大小减 1 的字节序列。在某些机器上这是一种简化，但作为初始的内存模型它是足够的。每种类型都有对应的指针类型。例如：\n\
  \n点击此处查看代码图像\n\n```\nint x = 17;\nint* pi = &x;                    //指向 int 的指针\n\
  \ndouble e = 2.71828;\ndouble* pd = &e;                 //指向 double 的指针\n```\n\n\
  如果我们想查看所指向对象的值，可以使用“内容”运算符单元运算符 `*`。例如：\n\n点击此处查看代码图像\n\n```\ncout << \"pi == \"\
  \ << pi << \"; contents of pi == \" << *pi << \"\\n\";\ncout << \"pd == \" << pd\
  \ << \"; contents of pd == \" << *pd << \"\\n\";\n```\n\n***pi** 的输出将是整数 **17**，***pd**\
  \ 的输出将是双 **2.71828**。**pi** 和 **pd** 的输出取决于编译器在内存中分配我们变量 **x** 和 **e** 的位置。指针值的表示表示法也可能取决于你的系统使用的约定。\n\
  \n\n\n\n运算符 `*`（通常称为 `dereference` 运算符，引用运算符）的内容也可以用于赋值语句的左侧：\n\n点击此处查看代码图片\n\n\
  ```\n*pi = 27;                // OK: 你可以将 27 赋值给 pi 指向的 int\n*pd = 3.14159;    \
  \   // OK: 你可以将 3.14159 赋值给 pd 指向的 double\n*pd = *pi;              // OK: 你可以将一个\
  \ int (*pi) 赋值给一个 double (*pd)\n```\n\n**XX**\n\n请注意，尽管指针值可以作为整数打印，但指针并不是整数。“`int`\
  \ 指向什么？” 并不是一个符合语法规范的问题；`int` 并不指向任何东西，指针才指向。指针类型提供了适用于地址的操作，而 `int` 提供了适用于整数的算术运算。因此，指针和整数之间不会发生隐式混合：\n\
  \n点击此处查看代码图片\n\n```\nint i = pi;                  // error: 不能将 int* 赋值给 int\npi\
  \ = 7;                      // error: 不能将 int 赋值给 int*\n```\n\n同样，指向 `char` 的指针（`char*`）不是指向\
  \ `int` 的指针（`int*`）。例如：\n\n点击此处查看代码图片\n\n```\nchar* pc = pi;           // error:\
  \ 不能将 int* 赋值给 char*\npi = pc;                    // error: 不能将 char* 赋值给 int*\n\
  ```\n\n为什么将 `pc` 赋值给 `pi` 是一个错误？考虑一个答案：`char` 通常比 `int` 小得多，所以请考虑以下情况：\n\n点击此处查看代码图片\n\
  \n```\nchar ch1 = 'a';\nchar ch2 = 'b';\nchar ch3 = 'c';\nchar ch4 = 'd';\nint*\
  \ pi = &ch3;           // error: 我们不能将 char* 赋值给 int*，但假设我们可以可以\n*pi = 12345;  \
  \             // 向一个 int 大小的内存单元写入\n*pi = 67890;\n```\n\n编译器究竟如何在内存中分配变量取决于具体实现，但我们很可能会得到这样的结果：\n\
  \n![一个数据表显示了编译器在内存中分配变量的过程。内存被分为五部分。从左到右，这些部分包含字符 a, b, c, d 和 ch 3。](img/f0442-01.jpg)\n\
  \n现在，如果编译器允许这段代码运行，我们就会向从 `&ch3` 开始的内存中写入 `12345`。这无疑会改变某些附近内存的值，例如 `ch2` 或 `ch4`。如果我们真的非常倒霉（这很可能），我们甚至会覆盖\
  \ `pi` 本身的一部分！在这种情况下，下一次赋值（`*pi=67890`）将把 `67890` 放在内存中另一个完全不同的部分。庆幸这种赋值是不允许的吧。这被称为*内存损坏*。然而，这是编译器在如此低级别的编程中提供的少数保护机制之一。我们在这里非常接近硬件。这对于程序员来说并不是一个特别舒适的地方。我们只有少数几个原始操作可用，而且几乎得不到语言或标准库的支持。然而，到达这里是为了了解更高级的设施（如\
  \ `vector`）是如何实现的。我们需要理解如何在这一层级编写代码，因为并不是所有代码都是“高层级”的。此外，一旦我们体验过这些功能的缺失，我们可能会更好地体会软件高层级的便利性和安全性。我们的目标始终是在给定问题和解决方案限制的情况下，在尽可能高的抽象层级上工作。\n\
  \n---\n\n### 15.3.1 `sizeof` 运算符\n\n**CC**\n\n那么一个 `int` 到底占据了多少内存？指针呢？`sizeof`\
  \ 运算符回答了此类问题：点击此处查看代码图片\n\n```\nvoid sizes(char ch, int i, int* p)\n{\n        cout\
  \ << \"the size of char is \" << sizeof(char) << ' ' << sizeof(ch);\n        cout\
  \ << \"the size of int is \" << sizeof(int) << ' ' << sizeof(i);\n        cout <<\
  \ \"the size of int* is \" << sizeof(int*)<< ' ' << sizeof(p);\n}\n```\n\n如你所见，我们可以将\
  \ `sizeof` 应用于类型名或表达式；对于类型，`sizeof` 给出该类型对象的大小；对于表达式，它给出结果的大小。`sizeof` 的结果是一个正整数，单位是\
  \ `sizeof(char)`，它被定义为 `1`。通常情况下，`char` 存储在一个字节中，因此 `sizeof` 报告的是字节数。\n\n尝试上面的示例并看你会得到什么。然后扩展示例来确定\
