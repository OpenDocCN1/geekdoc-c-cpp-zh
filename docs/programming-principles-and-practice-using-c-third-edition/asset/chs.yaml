  \ `narrow` (§6.5)。\n\n[11] 重新回顾你为 §3 或 第 4 章 中的练习编写的两个程序。根据本章列出的规则清理那些代码。看看在这个过程中是否发现了任何漏洞（bugs）。\n\
  \n[12] 修改计算器以接受来自任何 `istream` 的输入。\n\n#### 后记\n\n恰好的是，我们现在已经看到了编译器如何工作的简单示例。计算器分析分解为标记（tokens）的输入，并根据语法进行理解。这正是编译器所做的。在分析输入后，编译器会生成一个表示（对象代码），我们稍后可以执行。计算器立即执行它分析过的表达式；执行此类操作程序被称为解释器而不是编译器。\n\
  \n# 7\n\n## 技术细节：函数等\n\n*再多的天才也无法克服对细节的痴迷。*\n\n*– 传统格言*\n\n在本章和下一章中，我们将重心从编程转向我们编程的主要工具：C++\
  \ 编程语言。我们介绍了语言技术细节，以对 C++ 的基本设施提供稍微宽泛的视角，并为这些设施提供一个更系统的视角。这些章节还作为对目前为止介绍的许多编程概念的回顾，并提供了一个在不增加新编程技术或概念的情况下探索我们工具的机会。\n\
  \n*§7.1* 技术细节\n\n*§7.2* 声明与定义\n\n声明的种类; 变量和常量声明; 默认初始化\n\n*§7.3* 作用域\n\n*§7.4* 函数调用与返回\n\
  \n声明参数和返回类型; 返回值; 按值传递; 按常量引用（const reference）传递; 按引用传递; 按值传递与按引用传递; 参数检查与转换; 函数调用实现;\
  \ 编译时计算; 后缀返回类型\n\n*§7.5* 求值顺序\n\n表达式求值; 全局初始化\n\n*§7.6* 求值顺序\n\n*§7.7* 命名空间\n\n\
  \n\n\n- 为命名内容（例如变量或函数）指定类型\n- 可选地，指定一个初始化器（例如初始化值或函数体）\n\n例如：\n\n点击此处查看代码图像\n\n\
  ```\nint a = 7;                                        // 一个 int 变量\nconst double\
  \ cd = 8.7;                // 一个双精度浮点数常量\ndouble sqrt(double);                 \
  \  // 一个接受 double 参数并返回 double 结果的函数\nvector<Token> v;                        //\
  \ 一个 Token 向量变量\n```\n\n在 C++ 程序中使用某个名称之前，必须先对其进行声明。考虑以下情况：\n\n点击此处查看代码图像\n\n```\n\
  int main()\n{\n         std::cout << f(i) << '\\n';\n}\n```\n\n编译器会为这段代码给出至少四个“未声明的标识符”（undeclared\
  \ identifier）错误：`std`、`cout`、`f` 和 `i` 在此程序片段中均未声明。我们可以通过 `import` 标准库模块 `std` 来获取\
  \ `cout` 的声明，该模块包含了它的声明：\n\n点击此处查看代码图像\n\n```\nimport std;                // 我们在此处找到了\
  \ cout 的声明\n\nint main()\n{\n         std::cout << f(i) << '\\n';\n}\n```\n\n现在，我们只得到了两个“未定义”（undefined）错误。当你编写现实世界的程序时，你会发现大多数声明都位于模块或……\n\
  \n\n\n我们可以按照意愿任意这四个函数的顺序；总会有一个对定义在其方的函数的调用。在某个地方，我们需要一个“前向”声明。因此，我们在定义 `primary()`\
  \ 之前声明了 `expression()`，一切就正常了。这种循环调用链非常常见。\n\n为什么一个名称必须在使用它之前先声明呢？难道我们不能只要求语言实现程序读取程序（就像我们做的那样）并找到定义以查看函数必须如何被调用吗？我们可以这样做，但这将导致“有趣”的技术问题，特别是在大型程序中，因此我们决定不采用这种做法。C++\
  \ 的定义要求在使用之前先声明（类成员除外；参见 §8.4.4）。此外，这也是普通（非程序性）写作的惯例：当你阅读教科书时，你期望作者在使用某个术语之前对其进行定义；否则，你必须不断地猜测或查阅索引。只需要知道我们所用部分的声明，可以节省我们（以及编译器）去翻阅大量的程序文本。\n\
  \n### 7.2.1 声明的种类\n\n程序员在 C++ 中可以定义许多种实体。最有趣的是：\n\n*   变量和常量 (§7.2.2)\n*   函数 (§7.4)\n\
  *   命名空间 (§7.6)\n*   模块 (§7.7)\n*   类型（类和枚举；第 8 章)\n*   模板 (第 18 章)\n*   概念 (§18.1.3)\n\
  \n### 7.2.2 变量和常量声明\n\n变量或常量的声明指定了名称、类型，以及可选的初始化器：\n\n点击此处查看代码图像\n\n```cpp\nint\
  \ a;                                   // 无初始化器\ndouble d = 7;                 \
  \    // 使用 = 语法的初始化器\nvector<int> vi(10);            // 使用 ( ) 语法的初始化器\nvector<int>\
  \ vi2 {1,2,3,4};  // 使用 { } 语法的初始化器\n```\n\n常量的声明语法与变量相同。它们的区别在于其类型中包含 `const` 或\
  \ `constexpr`，并且需要一个初始化器 (§3.3.1)：\n\n点击此处查看代码图像\n\n```cpp\nconst int x = 7;   \
  \      // 使用 = 语法的初始化器\nconst int x2 {9};       // 使用 {} 语法的初始化器\nconst int y; \
  \              // 错误：无初始化器\n```\n\n**AA**\n\n`const` 需要初始化器的原因显而易见：如果 `const` 没有值，它怎么可能是一个常量呢？初始化变量通常也是个好主意；未初始化的变量是晦晦\
  \ bug 的根源。例如：\n\n点击此处查看代码图像\n\n```cpp\nvoid f(int z)\n{\n         int x;       \
  \             // 未初始化\n         // ...\n         x = 7;                   // 给 x\
  \ 赋值\n         // ...\n}\n```\n\n这看起来很无害，但如果第一个 **...** 包含了对 `x` 的使用呢？例如：\n\n点击此处查看代码图像\n\
  \n```cpp\nvoid f(int z)\n{\n         int x;                 // 未初始化\n         //\
  \ ... 这里没有对 x 赋值 ...\n         if (z>x) {\n                  // ...\n         }\n\
  \         x = 7;                // 给 x 赋值\n         // ...\n}\n```\n\n由于 `x` 未初始化，执行\
  \ `z>x` 的结果将是未定义的。比较 `z>x` 在不同的机器上可能会产生不同的结果，在同一台机器的程序不同运行中产生不同的结果。从原则上讲，`z>x` 可能导致程序因硬件错误终止，但大多数情况下并不会发生。相反，我们得到的是不可预测的结果。\n\
  \n自然，我们不会刻意这样做，但如果我们不一一致地初始化变量，这种情况最终会错误地发生。记住，大多数“愚蠢错误”（例如在给变量赋值之前使用未初始化的变量）都发生在你忙碌或疲劳时。编译器尝试警告，但在复杂的代码中——此类错误最可能发生的地方——编译器并不智能到捕捉所有此类错误。有些人没有养成初始化变量的习惯。有些人克制是因为他们是在不允许或不鼓励一致初始化的语言中学习编程的。另一些则习惯于每个变量都初始化为默认值的语言（这在所有情况下可能适用，也可能不适用）。因此，你会在别人的代码中看到未初始化的变量示例。请不要因为忘记初始化你自己定义的变量而让问题进一步恶化。\n\
  \n我们倾向于对于仅复制值的初始化使用 `=` 语法，而对于执行更复杂构造的初始化使用 `{ }` 初始化器语法。\n\n### 7.2.3 默认初始化\n\n\
  你可能注意到我们经常不为 `string` 和 `vector` 提供初始化器。例如：\n\n点击此处查看代码图像\n\n```cpp\nvoid f(int\
  \ z)\n{\n         int x;                 // 未初始化\n         // ... 这里没有对 x 赋值 ...\n\
  \         if (z>x) {\n                  // ...\n         }\n         x = 7;    \
  \            // 给 x 赋值\n         // ...\n}\n```\n\n由于 `x` 未初始化，执行 `z>x` 的结果将是未定义的。比较\
  \ `z>x` 在不同的机器上可能会产生不同的结果，在同一台机器的程序不同运行中产生不同的结果。从原则上讲，`z>x` 可能导致程序因硬件错误终止，但大多数情况下并不会发生。相反，我们得到的是不可预测的结果。\n\
  \n自然，我们不会刻意这样做，但如果我们不一一致地初始化变量，这种情况最终会错误地发生。记住，大多数“愚蠢错误”（例如在给变量赋值之前使用未初始化的变量）都发生在你忙碌或疲劳时。编译器尝试警告，但在复杂的代码中——此类错误最可能发生的地方——编译器并不智能到捕捉所有此类错误。有些人没有养成初始化变量的习惯。有些人克制是因为他们是在不允许或不鼓励一致初始化的语言中学习编程的。另一些则习惯于每个变量都初始化为默认值的语言（这在所有情况下可能适用，也可能不适用）。因此，你会在别人的代码中看到未初始化的变量示例。请不要因为忘记初始化你自己定义的变量而让问题进一步恶化。\n\
  \n我们倾向于对于仅复制值的初始化使用 `=` 语法，而对于执行更复杂构造的初始化使用 `{ }` 初始化器语法。\n\n默认初始化。你可能注意到我们经常不为\
  \ `string` 和 `vector` 提供初始化器。例如：\n\n```cpp\nvector<string> v;\nstring s;\nwhile\
  \ (cin>>s)\n         v.push_back(s);\n```\n\n这不是对在使用之前必须初始化的规则的例外。这里的情况是 `v` 和 `s`\
  \ 被定义，以便在到达循环之前它们具有默认值。保证初始化的机制被称为*默认构造函数* (§8.4.2)。不幸的是，语言不允许我们做出这种保证。你已经收到警告！\n\
  \n### 7.3 作用域\n\n**CC**\n\n*作用域*是程序文本的一个区域。一个名称在作用域中声明，并在声明它的作用域结束之前都是有效的（“在作用域内”）。例如：\n\
  \n```cpp\nvoid f()\n{\n         g();                     // 错误：g()不在作用域内\n}\n\n\
  void g()\n{\n         f();                     // OK：f()在作用域内\n}\n\nvoid h()\n{\n\
  \         int x = y;            // 错误：y 不在作用域内\n         int y = x;            //\
  \ OK：x 在作用域内\n         g();                     // OK：g()在作用域内\n}\n```\n\n作用域内的名称可以在嵌套其中的作用域内可见。例如，对`f()`的调用位于`g()`的作用域内，它嵌套在全局作用域内。全局作用域是不嵌套在任何其他作用域的作用域。在使用之前必须声明的规则仍然有效，因此\
  \ `f()` 不能调用 `g()`。\n\n我们可以使用哪些作用域：\n\n*   *全局作用域*：任何其他作用域之外的区域\n*   *模块作用域*：模块内部的文本区域\
  \ (§7.7.1)\n*   *命名空间作用域*：嵌套在全局作用域或其他命名空间中的具名作用域 (§7.6)\n*   *类作用域*：类内部的文本区域 (§8.2)\n\
  *   *局部作用域*：块 **{ ... }** 大括号之间或在函数参数列表中\n*   *语句作用域*：例如，在 **for** 语句中\n\n作用域的主要目的是保持名称局部化，这样它们就不会与别处声明的名称冲突。例如：\n\
  \n点击此处查看代码图像\n\n\n\n\n```\nint max(int a, int b)            // max 是全局；a 和 b 是局部\n\
  {\n         int m;                         // m 是局部\n         if (a>=b)\n      \
  \            m=a;\n         else\n                  m=b;\n         return m;\n}\n\
  \nint abs(int a)                      // abs 是全局；a 是局部\n{\n         return (a>=0)\
  \ ? a : −a;\n}\n```\n\n或者用图示表示：\n\n![数据表显示了作用域的作用是将名称保持局部。对于全局作用域，最大值定义为 a、b 和 m。a\
  \ b s 值被定义为 a。](img/f0189-01.jpg)\n\n`max()` 中的 `a` 与 `abs()` 中的 `a` 不同。它们不会发生“冲突”，因为它们处于不同的作用域中。在同一个作用域内两个不兼容的声明通常被称为*冲突*。\n\
  \n`abs()` 中使用的 `?:` 结构被称为*算术 if*或*条件表达式*。如果 `a>=0`，则 `(a>=0)?a:−a` 的值为 `a`，否则为 `−a`。在许多情况下，条件表达式可以避免我们编写像\
  \ `max()` 那样使用 `if` 的冗长代码。它还避免了我们使用未初始化变量的诱惑，因为“我们正准备要给它赋值”。你可以在标准库中找到 `max()` 和\
  \ `abs()`，所以你不需要自己编写它们。\n\n## AA\n\n所以，除了全局作用域这个显著例外外，作用域将名称保持局部。对于大多数用途来说，局部性是好的，因此尽可能将名称保持为局部。当我在函数、类、命名空间等内部声明变量、函数等时，它们不会干扰你的。记住：真正的程序有*成千上万*命名实体。为了让此类程序易于管理，大多数名称必须是局部的。\n\
  \n这里有一个较大的技术示例，说明了名称如何在语句和块（包括函数体）结束时离开作用域：\n\n点击此处查看代码图像\n\n```\n// 这里没有 r, i 或\
  \ v\nclass My_vector {\n         vector<int> v;                                \
  \                   // v 在类作用域中\npublic:\n         int largest()\n         {\n \
  \                 int r = 0;                                                   //\
  \ r 是局部的\n                  for (int i = 0; i<v.size(); ++i)\n                 \
  \         r = max(r,abs(v[i]));                        // i 在 for 语句作用域中\n     \
  \             // ... 这里没有 i ...\n                  return r;\n         }\n     \
  \    // ... 这里没有 r ...\n};\n// 这里没有 v\n\nint x = 0;                            \
  \   // 一个全局变量 – 尽可能避免使用它们\nint y = 0;\n\nint f()\n{\n         int x = 0;       \
  \               // 一个局部变量，隐藏了全局的 x\n         x = 7;                           //\
  \ 局部的 x\n         {\n                  int x = y;             // 由全局 y 初始局部 x，隐藏了之前的局部\
  \ x\n                  ++x;                    // 上一行的 x\n         }\n         ++x;\
  \                             // f() 第一行的 x\n         return x;\n}\n```\n\n只要可以，尽量避免这种复杂的嵌套和隐藏。记住：“保持简单！”\n\
  \n名称的作用域越大，它的名称就应该越长、描述性越强：`x`、`y` 和 `f` 作为全局名称是非常糟糕的。你不想在程序中使用全局变量的主要原因是，很难知道是哪些函数修改了它们。在大型程序中，基本上不可能知道哪些函数修改了全局变量。想象一下你正在调试一个程序，并发现一个全局变量有一个意料之外的值。是谁给它赋这个值的？为什么？哪些函数向该值写入数据？你如何知道？向该变量写入错误值的函数可能位于你从未过的源文件中！一个良好的程序只会有极少数（比如一两个）全局变量，如果没有的话。例如，第\
  \ 5 章和第 6 章中的计算器有两个全局变量：标记流 `ts` 和符号表 `names`。\n\n注意，大多数定义作用域的 C++ 结构都是嵌套的：\n\n\
  *   类内部的函数：成员函数（见 §8.4.2)\n\n    点击此处查看代码图像\n\n    ```\n    class C {\n    public:\n\
  \             void f();\n             void g() { /* ... */ }               // 成员函数可以在其类内部定义\n\
  \             // ...\n    };\n    void C::f()                                  \
  \  // 成员定义可以在类外部\n    {\n             // ...\n    }\n    ```\n\n    这是最常见且实用的情况。\n\
  \n*   类内部的类：成员类（也称为嵌套类）\n\n    ```\n    class C {\n    public:\n             class\
  \ M {\n                      // ...\n             };\n             // ...\n    };\n\
  \    ```\n\n    这通常在复杂的类中才有用；记住理想情况是保持类短小简单。\n\n*   函数内部的类：局部类\n\n    ```\n    void\
  \ f()\n    {\n             class L {\n                      // ...\n           \
  \  };\n    }\n    ```\n\n*   函数内部的函数：局部函数\n\n    点击此处查看代码图像\n\n    ```\n    void\
  \ f()\n    void g() { /* ... */       // 错误：嵌套函数\n             // ...\n    }\n \
  \   ```\n\n    在 C++ 中函数嵌套是不合法的。相反，请使用 lambda (21.3)\n\n*   函数和其他块内部的块：嵌套块\n\n \
  \   **XX**\n\n    我们使用缩进来表示嵌套。如果没有一致的缩进，嵌套结构将变得不可读。考虑：\n\n    点击此处查看代码图像\n\n   \
  \ ```\n    // 极其糟糕的代码\n    struct X {\n    void f(int x) {\n    struct Y {\n   \
  \ int f() { return 1; } int m; };\n    int m;\n    m=x; Y m2;\n    return f(m2());\
  \ }\n    int m; void g(int m) {\n    if (0<m) f(m+2); else {\n    g(m+2); }}\n \
  \   X() { } int m3() {\n    }\n\n    void main() {\n    X a; a.f(2);}\n    };\n\
  \    ```\n\n    **AA**\n\n    嵌套块是不可避免的，但对复杂的嵌套要警惕：如果你觉得需要局部类，那么你的函数可能太长了。\n\n###\
  \ 7.4 函数调用和返回\n\n**CC**\n\n函数是用来表示动作和计算的方式。每当我们想要执行值得命名的操作时，我们就编写一个函数。为了完成工作，函数通常需要参数，许多函数会返回结果。本节重点介绍如何指定和传递参数。\n\
  \n#### 7.4.1 声明参数和返回类型\n\n函数声明由返回类型、后跟的函数名称以及括号中的参数列表组成。例如：\n\n\n\n\n```cpp\ndouble\
  \ fct(int a, double d);                 // fct 的声明（无函数体）\n\ndouble fct(int a, double\
  \ d)                  // fct 的定义\n{\n         return a*d;\n}\n```\n\n定义包含了函数体（调用时要执行的语句），而不是定义的声明仅包含一个分号。参数通常被称为*形式参数*（formal\
  \ arguments）。如果你不想让函数接受参数，只需省略形式参数即可。例如：\n\n点击此处查看代码图片\n\n```cpp\nint current_power();\
  \                           // current_power 不接受参数\n```\n\n如果你不想从函数返回值，请将 `void`\
  \ 指定为返回类型。例如：\n\n点击此处查看代码图片\n\n```cpp\nvoid increase_power_to(int level);    //\
  \ increase_power_to() 不返回值\n```\n\n在这里，`void` 意味着“不返回值”或“不返回任何内容”。\n\n在声明和定义中，你可以根据需要为参数命名或不命名。例如：\n\
  \n点击此处查看代码图片\n\n```cpp\nint my_find(vector<string> vs, string s, int hint);    \
  \ // 命名参数：从 hint 开始搜索\n\nint my_find(vector<string>, string, int);             \
  \       // 未命名参数\n```\n\n### CC\n\n在声明中，形式参数名称在逻辑上并不是必须的，但对于编写良好的注释非常有用。从编译器的角度来看，`my_find()`\
  \ 的第二个声明与第一个一样好：它包含了调用 `my_find()` 所需的所有信息。\n\n通常，我们在定义中命名所有参数。例如：\n\n点击此处查看代码图片\n\
  \n```cpp\nint my_find(vector<string> vs, string s, int hint)\n         // 在 vs 中从\
  \ hint 开始搜索 s\n{\n         if (hint<0 || vs.size()<=hint)\n                  hint\
  \ = 0;\n         for (int i = hint; i<vs.size(); ++i)        // 从 hint 开始搜索\n  \
  \                if (vs[i]==s)\n                           return i;\n         for\
  \ (int i = 0; i<hint; ++i)                    // 如果没有找到 s，则在 hint 之前搜索\n       \
  \           if (vs[i]==s)\n                           return i;\n         return\
  \ −1;\n}\n```\n\n`hint` 让代码变得复杂了很多，但提供 `hint` 的假设是用户可以通过大致知道 `string` 在 `vector`\
  \ 中的查找位置来使其发挥良好作用。然而，想象一下，我们在使用 `my_find()` 一段时间后，发现调用者很少很好地使用 `hint`，以至于实际上损害了性能。现在我们不再需要\
  \ `hint` 了，但外部有大量代码在使用带有 `hint` 的调用 `my_find()`。我们不想重写这些代码（或者无法重写，因为那是别人的代码），因此我们不想更改\
  \ `my_find()` 的声明。相反，我们只需不使用最后一个参数。由于我们不使用它，可以对其保持不命名：\n\n点击此处查看代码图片\n\n```cpp\n\
  int my_find(vector<string> vs, string s, int)     // 第 3 个参数未使用\n{\n         for\
  \ (int i = 0; i<vs.size(); ++i)\n                  if (vs[i]==s) return i;\n   \
  \      return −1;\n}\n```\n\n#### 7.4.2 返回值\n\n我们使用 `return`语句从函数返回值：\n\n```cpp\n\
  T f()      // f() 返回一个 T\n{\n         V v;\n         // ...\n         return v;\n\
  }\n```\n\n在这里，返回的值正是我们通过类型为 `V` 的值初始化类型为 `T` 的变量所得到的值：\n\n点击此处查看代码图片\n\n```cpp\n\
  V v;\n// ...\nT t(v);        //用 v 初始化 t\n```\n\n也就是说，值返回是初始化的形式。遗憾的是，它是一种潜在的窄转换初始化（§2.9），但编译器通常会警告，且\
  \ Core 指南会捕获窄转换。\n\n声明为返回值的函数必须返回一个值。特别是，“穿过函数末尾”是一个错误：\n\n点击此处查看代码图片\n\n```cpp\n\
  double my_abs(int x)      // 警告：错误代码\n{\n         if (x < 0)\n                 \
  \ return −x;\n         else if (x > 0)\n                  return x;\n}        //\
  \ 错误：如果 x 为 0 则没有返回值\n```\n\n实际上，编译器可能不会我们“忘记”了 `x==0` 的情况。从原则上讲它可以做到，但很少有编译器那么智能。对于复杂的函数，编译器无法知道我们是否“忘记”了\
  \ `x==0` 的情况。\n\n\n\n\n```\nvoid f(int x)\n{\n         vector<double> vd1(10); \
  \                  // small vector\n         vector<double> vd2(1000000);      \
  \   // large vector\n         vector<double> vd3(x);                     // vector\
  \ of some unknown size\n\n         // ... fill vd1, vd2, vd3 with values ...\n\n\
  \         print(vd1);\n         print(vd2);\n         print(vd3);\n}\n```\n\n###\
  \ CC\n\n这段代码可以运行，但第一次调用 `print()` 必须拷贝十个 `double`（可能是 80 字节），第二次调用必须拷贝一百万个 `double`（可能是\
