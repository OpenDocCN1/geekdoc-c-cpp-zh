  \ `m13`（移动到 13 号房间）和 `s13–4–3`（穿过 13、4 和 3 号房间射箭）。箭箭的射程是三个房间。在游戏开始时，你有五支箭。射箭的麻烦在于会惊醒通普斯，它会移动到它所在房间的相邻房间——那可能是你的房间。\n\
  \n练习中最困难的部分可能是通过选择哪些房间与哪些其他房间连接来构建洞穴。你可能想使用随机数生成器（例如 `PPP_support` 中的 `randint()`）来让程序的每次运行使用不同的洞穴，并在蝙蝠和通普斯之间移动。提示：确保你有一种方法可以产生洞穴状态的调试输出。\n\
  \n#### 后记\n\n指针和数组在 C 代码和旧的 C++ 代码中无处不在。例如，字符串字面量是 C 风格字符串。因此，我们必须理解它们的用法并学习如何避免误用。标准库的\
  \ `span`、`array` 和 `not_null` 解决了许多与范围错误相关的问题并可以在无法一致地使用 `vector` 等高层类型的地方使用。\n\n\
  ## 17 核心操作\n\n*当有人说我想要一种只需要说出我想做的事的编程语言时，给他一个棒棒糖吧。*\n*   *– Alan Perlis*\n\n本章描述了如何拷贝\
  \ `vector` 以及通过下标进行访问。为了这一点，我们讨论了通用的拷贝，并介绍了每个类型都必须考虑的核心操作：构造、默认构造、拷贝、移动和析构。像许多类型一样，`vector`\
  \ 提供了比较，因此我们展示了如何提供如 `==` 和 `<` 等操作。最后，我们处理改变 `vector` 大小的问题：为什么以及如何做？\n\n*   §17.1\
  \ 介绍\n*   §17.2 访问访问\n*   §17.3 列表初始化\n*   §17.4 拷贝与移动\n*   拷贝构造函数; 拷贝赋值; 拷贝术语;\
  \ 移动\n*   §17.5 核心操作\n*   §17.6 显式构造函数\n*   §17.7 比较运算符\n*   §17.8 改变大小\n*   §17.9\
  \ 赋值\n\n### 17.1 介绍\n\n为了进入空中，飞机必须在跑道上加速，直到速度快到可以跃起。当飞机在跑道上蹒跚移动时，它仅仅像是一辆特别沉重的卡车。一旦进入空中，它就会升空变成一种完全不同的工具。\n\
  \n在本章中，我们正处于收集语言特征以摆脱机器约束的“运行”过程中。我们希望达到能够根据逻辑需求使用精确提供所需的类型进行编程的程度。\n\n本章关注拷贝这一概念。这是一个重要但非常技术性的点：拷贝非平凡对象意味着什么？拷贝操作后，这些拷贝在多大程度上是独立的？有哪些拷贝操作？我们如何指定它们？它们与其他基础操作（如初始化和清理）有什么关系？\n\
  \n请注意，`vector` 的细节对于 `vector` 来说特殊的，也是 C++ 从底层类型构建新高层类型的方式。然而，每个语言中的每个“高层”类型（`string`、`vector`、`list`、`map`\
  \ 等）某种程度上都是从相同的机器原理构建的，并反映了对此处问题的各种解决方案。\n\n### 17.2 访问元素\n\n我们在第 15 章 结束时留下的 `Vector`\
  \ 与 `std::vector` 相比仍然非常不完整。特别是，它缺乏一种访问元素的优雅方式。它拥有的一对 `get()` 和 `set()` 函数。使用 `get()`\
  \ 和 `set()` 访问元素的代码与通常的下标表示法相比要丑得多：\n\n\n\n\n\n```\nVector v(3);\nv.set(0,1);\n\
  v.set(1,2);\nv.set(2,3);\nint x = v.get(2);\n```\n\n我们可以做得更好。获取通常的 `v[i]` 表示法的方法是定义一个名为\
  \ `operator[]` 的成员函数。这是我们的第一次（天素的）尝试：\n\n点击此处查看代码图片\n\n```cpp\nclass Vector {\n\
  \        int sz;                       // 大尺寸\n        double* elem;          //\
  \ 指向元素的指针\npublic:\n        // ...\n        double operator[](int n) { return elem[n];\
  \ }              // 返回元素\n};\n```\n\n这看起来不错，尤其是看起来非常简单，但遗憾的是它太简单了。让下标运算符 `operator[]()`\
  \ 返回一个值将只能读取元素而不能写入元素：\n\n点击此处查看代码图片\n\n```cpp\nVector v(10);\ndouble x = v[2];\
  \                // 正常\nv[3] = x;                            // 错误：v[3] 不是左值 (§3.3)\n\
  ```\n\n在这里，`v[i]` 被解释为调用 `v.operator[](i)`，而该调用返回 `v` 的第 `i` 个元素的值。对于这个过于天素的 `Vector`，`v[3]`\
  \ 是一个浮点值，而不是一个浮点变量。\n\n#### 尝试一下\n\n编写这个 `Vector` 的版本，使其完整到可以编译，并查看你的编译器为 `v[3]=x;`\
  \ 产生什么错误信息。\n\n我们的下一次尝试是让 `operator[]` 返回指向相应元素的指针：\n\n点击此处查看代码图片\n\n```cpp\nclass\
  \ Vector {\n        // ...\n        double* operator[](int n) { return &elem[n];\
  \ }        // 返回指针\n};\n```\n\n给定该定义，我们可以写：\n\n点击此处查看代码图片\n\n```cpp\nVector v(10);\n\
  for (int i=0; i<v.size(); ++i) {\n        *v[i] = i;             // 可以运行，但仍然太丑了\n\
  \         cout << *v[i];\n}\n```\n\n在这里，`v[i]` 被解释为调用 `v.operator[](i)`，该调用返回指向\
  \ `v` 的第 `i` 个元素的指针。问题是，我们必须编写 `*` 来解引用该指针以获取元素。这与必须编写 `set()` 和 `get()` 几乎一样糟糕。从下标运算符返回引用可以解决这个问题：\n\
  \n点击此处查看代码图片\n\n```cpp\nclass Vector {\n        // ...\n        double& operator[](int\
  \ n) { return elem[n]; }                      // 返回引用\n        const double& operator[](int\
  \ n) const { return elem[n]; }   // 为 const 返回一个 const& (§8.7.4)\n};\n```\n\n引用不仅仅用于函数参数。\n\
  \n现在我们可以写：\n\n点击此处查看代码图片\n\n```cpp\nVector v(10);\nfor (int i=0; i<v.size(); ++i)\
  \ {             // 成功！\n        v[i] = i;             // v[i] 返回第 i 个元素的引用\n   \
  \     cout << v[i];\n}\n```\n\n我们实现了习惯的表示法：`v[i]` 被解释为调用 `v.operator[](i)`，它返回指向\
  \ `v` 的第 `i` 个元素的引用。\n\n由于 `vector` 经常通过 `const` 引用传递，因此 `operator[]()` 的 `const`\
  \ 版本是一个必不可少的补充。该版本可以返回一个原始的 `double`，而不是 `double&`。\n\n### 17.3 列表初始化\n\n再次考虑我们的\
  \ `Vector`：\n\n点击此处查看代码图片\n\n```cpp\nclass Vector {\n        int sz;           \
  \           // 大尺寸\n        double* elem;         // 指向元素的指针\npublic:\n        Vector(int\
  \ s) :sz{s}, elem{new double[s]} { /* ... */ }          // 构造函数：分配内存\n        ~Vector()\
  \ { delete[] elem; }                                               // 析构函数：释放内存\n\
  \        // ...\n};\n```\n\n这很好，但我们想用一组值列表来初始化 `Vector`。例如：\n\n点击此处查看代码图片\n\n```cpp\n\
  Vector v1 = {1.2, 7.89, 12.34 };\n```\n\n仅设置大小然后赋值我们想要的值是繁琐且容易出错的：\n\n点击此处查看代码图片\n\
  \n```cpp\nVector v2(2);                        // 繁琐且容易出错\nv2[0] = 1.2;\nv2[1] =\
  \ 7.89;\nv2[2] = 12.34;                       // 哎！范围错误\n```\n\n那么，我们如何编写一个接受初始化列表的构造函数呢？一个\
  \ `T` 类型的 `{ }` 列表呈现为 `initializer_list`，这意味着我们可以使用 `{ }` 表示元素列表。这种代码风格在标准库中无处不在，并在\
  \ `[17.6]` 中简要描述，在 `[19]` 中详细介绍。\n\n注意我们如何使用 `( )` 表示元素计数，使用 `{ }` 表示元素列表。我们需要一种符号来区分它们。例如：\n\
  \n点击此处查看代码图片\n\n```cpp\nVector v1 {3};           // 值为 3.0 的一个元素\nVector v2(3);\
  \            // 三个默认值为 0\n```\n\n这并不优雅，但有效。如果存在选择，编译器会将 `{ }` 列表中的值解释为元素值，并作为 `initializer_list`\
  \ 的元素传递它。\n\n在大多数情况下（包括我们书中遇到的所有情况），`{ }` 初始化列表前的 `=` 是可选的，所以我们可以写：\n\n点击此处查看代码图片\n\
  \n```cpp\nVector v11 = {1,2,3};         // 三个元素 1.0, 2.0, 3.0\nVector v12 {1,2,3};\
  \           // 三个元素 1.0, 2.0, 3.0\n```\n\n区别纯粹是风格上的。\n\n注意我们按值传递 `initializer_list<double>`。这是故意的，且是语言规则要求的：`initializer_list`\
  \ 仅仅是指向“别处”元素的句柄。\n\n自然地，当我们能用列表初始化 `Vector` 时，我们期望能够将列表赋值给 `Vector`。例如：\n\n```cpp\n\
  v1 = {7,8,9,0};\n```\n\n为了这一点，我们定义了 `Vector::operator=(initializer_list<double>)`。\n\
  \n\n\n\n\n```cpp\nclass Vector {\n        int sz;                     // 尺寸\n  \
  \      double* elem;        // 指向元素的指针\npublic:\n        Vector(int s) :sz{s}, elem{new\
  \ double[s]} { /* ... */           // 构造函数：分配内存\n        ~Vector() { delete[] elem;\
  \ }                                                // 析构函数：释放内存\n        // ...\n\
  };\n```\n\n让我们尝试复制这些 vector 中的一个：\n\n点击此处查看代码图像\n\n```cpp\nvoid f(int n)\n{\n  \
  \      Vector v(3);               // 定义一个包含 3 个元素的 vector\n        v[2] = 2.2;\n\
  \        Vector v2 = v;           // 这里发生了什么？\n        // ...\n}\n```\n\n理想情况下，`v2`\
  \ 应该成为 `v` 的一个副本（即 `=` 会产生副本）；也就是说，对于 [`0`:`v.size()`] 范围内的所有 `i`，`v2.size()==v.size()`\
  \ 且 `v2[i]==v[i]`。此外，在退出 `f()` 时，所有内存都应该返回空闲存储（free store）。这正是标准库 `vector` 所做的（当然），但并不是我们这个仍然过于简单的\
  \ `Vector` 所会发生的情况。如果你足够好，编译器会警告你。\n\n我们的任务是改进 `Vector` 以便它能正确处理此类示例，但首先，让我们弄清楚我们当前版本到底做了什么。它到底哪里做错了？怎么错的？为什么？一旦我们了了，可能就可以修复这些问题。更重要的是，我们有机会在其他语境下遇到类似问题时能够识别并避免它们。\n\
  \n**CC**\n\n类复制的默认含义是“复制所有数据成员”。这通常是完全合理的。例如，我们通过复制坐标来复制一个 `Point`。但对于指针成员，仅仅复制成员就会导致问题。特别是对于我们示例中的\
  \ `Vector`s，这意味着在复制之后，我们拥有了 `v.sz==v2.sz` 和 `v.elem==v2.elem`，导致我们的 `vector`s 看起来像这样：\n\
  \n![数据表连接了三个数组。](img/f0490-01.jpg)\n\n也就是说，`v2` 并没有 `v` 元素的副本；它共享了 `v` 的元素。我们可以写：\n\
  \n点击此处查看代码图像\n\n```cpp\nv[1] = 99;                                    // 修改 v\n\
  v2[0] = 88;                                  // 修改 v2\ncout << v[0] << ' ' << v2[1];\n\
  ```\n\n结果将是输出 `88 99`。这并不是我们想要的。如果 `v` 和 `v2` 之间没有“隐藏”连接，我们将得到输出 `0 0`，因为我们从未向 `v[0]`\
  \ 或 `v2[1]` 写入数据。你可以辩称我们得到的行为是“有趣的”、“整洁的！”或“有时是有用的”，但这并不是我们的意图，也不是标准库 `vector` 所提供的。此外，当我们从\
  \ `f()` 返回时发生的情况是一场彻底的灾难。此时，`v` 和 `v2` 的析构函数会被隐式调用；`v` 的析构函数使用以下代码释放元素使用的存储：\n\n\
  ```cpp\ndelete[] elem;\n```\n\n`v2` 的析构函数也是如此。由于 `elem` 在 `v` 和 `v2` 中都指向同一个内存位置，该内存将被释放两次，可能会导致灾难性的结果。\n\
  \n### 17.4.1 拷贝构造函数\n\n那么，我们该怎么办？我们做显而易见的：提供一个复制元素的拷贝操作，并确保在用一个 `Vector` 初始化另一个\
  \ `Vector` 时调用这个拷贝操作。\n\n类对象的初始化是通过构造函数完成的。因此，我们需要一个用于复制的构造函数。不出所意料，这样的构造函数被称为*拷贝构造函数*。它的定义接收一个指向要复制对象的引用。因此，对于\
  \ `Vector` 类，我们需要：\n\n点击此处查看代码图像\n\n```cpp\nVector(const Vector&);             //\
  \ 复制一个 Vector\n```\n\n当我们尝试用一个 `Vector` 初始化另一个 `Vector` 时，将调用此构造函数。我们通过引用传递是因为我们（显然）不想复制定义复制的构造函数的参数。我们通过\
  \ `const` 引用传递，是因为我们不想修改我们的参数 (§7.4.4)）。因此我们这样完善 `Vector`：\n\n点击此处查看代码图像\n\n```cpp\n\
  class Vector {\n        int sz;\n        double* elem;\npublic:\n        Vector(const\
  \ vector&);             // 拷贝构造函数：定义拷贝\n        // ...\n};\n```\n\n拷贝构造函数在从参数 `Vector`\
  \ 复制元素值之前，会设置元素数量（`sz`）并为元素分配内存（初始化 `elem`）：\n\n点击此处查看代码图像\n\n```cpp\nVector::Vector(const\
  \ Vector& arg)            // 分配元素，然后通过拷贝初始化它们\n        :sz{arg.sz}, elem{new double[arg.sz]}\n\
  {\n            for (int i = 0; i < arg.sz; ++i)\n                elem[i] = arg.elem[i];\n\
  \        }\n```\n\n当我们尝试用一个 `Vector` 初始化另一个时，将调用此构造函数。我们通过引用传递是因为我们（显然）不想复制定义复制的构造函数的参数。我们通过\
  \ `const` 引用传递是因为我们不想修改我们的参数。\n\n给定这种情况，考虑我们的示例：\n\n```cpp\nVector v2 = v;\n```\n\
  \n这个定义通过调用 `Vector` 的拷贝构造函数并以 `v` 为参数来初始化 `v2`。由于此，两个 `Vector` 现在是独立的，我们可以更改 `v`\
  \ 的值而不影响 `v2`，反之亦然。例如：\n\n![数据表连接了三个数组。](img/f0490-01.jpg)\n\n```cpp\nv[1] = 99;\
  \                                    // 修改 v\nv2[0] = 88;                      \
  \            // 修改 v2\ncout << v[0] << ' ' << v2[1];\n```\n\n这将输出 `0 88`。\n\n###\
  \ 17.4.2 拷贝赋值\n\n**CC**\n\n我们处理了拷贝构造，但也可以通过赋值拷贝 `Vector`。与拷贝初始化一样，赋值的默认含义是成员拷贝，因此由于我们没有说明\
  \ `Vector` 赋值的含义，使用了默认赋值；也就是说，赋值是成员拷贝，使得 `v2` 的 `sz` 和 `elem` 分别变为 `v` 的 `sz` 和\
  \ `elem`。例如：\n\n```cpp\nvoid f2(int n)\n{\n        Vector v(3);              //\
  \ 定义一个 vector\n        v[2] = 2.2;\n        Vector v2(4);\n        v2 = v;     \
  \                // 赋值：这里发生了什么？\n        // ...\n}\n```\n\n当我们离开 `f2()` 时，发生了我们在\
  \ §17.4 添加拷贝构造函数之前离开 `f()` 时同样的灾难：`v` 和 `v2` 指向的元素被释放两次（隐式使用 `delete[]`）。此外，我们泄漏了最初为\
  \ `v2` 的四个元素分配的内存。我们“忘记”释放这些内存了。如果你犯了这种错误，希望能得到编译警告。\n\n这种缺陷拷贝赋值的补救方法与缺陷拷贝初始化从根本上相同：我们定义一个正确拷贝的赋值操作：\n\
  \n点击此处查看代码图像\n\n\n\n\n\n```cpp\nclass Vector {\n        int sz;\n        double*\
  \ elem;\npublic:\n        Vector& operator=(const Vector&);           //拷贝赋值\n \
  \       // ...\n};\n\nVector& Vector::operator=(const Vector& a)    // 将此 Vector\
  \ 变为 a 的拷贝\n{\n        double* p = new double[a.sz];        // 分配新空间\n        copy(a.elem,a.elem+a.sz,p);\
  \          // 将 a.elem 中的元素 [0:sz) 拷贝到 p\n        delete[] elem;               \
  \                 // 释放旧空间\n        elem = p;                                  \
  \     // 现在我们可以重置 elem\n        sz = a.sz;\n        return *this;              \
  \                     // 返回自引用 (§15.8)\n}\n```\n\n赋值比构造要复杂一点，因为我们必须处理旧的元素。我们的基本策略是从源\
  \ `Vector` 中制作一份元素的副本：\n\n点击此处查看代码图片\n\n```cpp\ndouble* p = new double[a.sz];  \
  \        // 分配新空间\ncopy(a.elem,a.elem+a.sz,p);            // 将 a.elem 中的元素 0:sz)\
  \ 拷贝到 p\n```\n\n然后，我们释放目标 `Vector` 中的旧元素：\n\n[点击此处查看代码图片\n\n```cpp\ndelete[] elem;\
  \                                  // 释放旧空间\n```\n\n最后，我们让 `elem` 指新元素：\n\n点击此处查看代码图片\n\
  \n```cpp\nelem = p;                                         // 现在我们可以重置 elem\nsz\
  \ = a.sz;\n```\n\n我们可以像这样图化地表示结果：\n\n![数据表连接了五个数组。](img/f0493-01.jpg)\n\n我们现在有了一个既内存内存的\
  \ `Vector`，也不会两次释放（`delete[]`）任何内存。\n\n**AA**\n\n在实现赋值时，你可以考虑在创建拷贝之前释放旧元素的内存以简化代码，但在你确定可以替换它之前，不要丢弃信息通常是一个非常好的主意。此外，如果你这样做，当将\
  \ `Vector` 赋值给自身时，会发生奇怪的事情：\n\n点击此处查看代码图片\n\n```cpp\nVector v(10);\nv=v;       \
  \           // 自赋值\n```\n\n请检查我们的实现是否正确处理了这种情况（即使不是最优效率）。\n\n### 17.4.3 拷贝术语\n\n\
  **CC**\n\n拷贝在大多数程序和大多数编程语言中都是一个问题。基本问题是拷贝指针（或引用），还是拷贝指针所指向（或引用指向）的信息：\n\n* *浅拷贝*（*Shallow\
  \ copy*）仅拷贝指针，使得两个指针现在指向同一个对象。这就是指针和引用的作用。\n* *深拷贝*（*Deep copy*）拷贝指针所指向的内容，使得两个指针现在指向不同的对象。这就是\
  \ `vector`、`string` 等所执行的操作。当我们想要为类对象实现深拷贝时，就会定义拷贝构造函数和拷贝赋值运算符。\n\n这里有一个浅拷贝的示例：\n\
  \n点击此处查看代码图片\n\n```cpp\nint* p = new int{77};\nint* q=p;                    // 拷贝指针\
  \ p\n*p = 88;                     // 修改 p 和 q 指向的 int 的值\n```\n\n我们可以这样说明它：\n\n\
  ![数据表连接了三个数组。数组 p 和 q 连接到数组 p，数组 p 有元素 88。](img/f0494-01.jpg)\n\n相比之下，我们可以进行深拷贝：\n\
  \n点击此处查看代码图片\n\n```cpp\nint* p = new int{77};\nint* q = new int{*p};        // 分配一个新的\
  \ int，然后拷贝 p 指向的值\n*p = 88;                           // 修改 p 指向的 int 的值\n```\n\n\
  我们可以这样说明它：\n\n![数据表连接了四个数组。数组 p 连接到数组 p，数组 p 有元素 88。数组 q 连接到数组 q，数组 q 有元素 77。](img/f0494-02.jpg)\n\
  \n**AA**\n\n使用这些术语，我们可以说我们原始 `Vector` 的问题在于它是浅拷贝，而不是拷贝其 `elem` 指针指向的元素。我们改进后的 `Vector`\
  \ 类似于 `std::vector`，通过为元素分配新空间并拷贝它们的值来执行深拷贝。提供浅拷贝的类型（如指针）被称为具有*指针语义*（*pointer semantics*）或*引用语义*（*reference\
  \ semantics*）（它们拷贝地址）。提供深拷贝的类型（如 `string` 和 `vector`）被称为具有*值语义*（*value semantics*）（它们拷贝指向的值）。从用户的角度来看，具有值语义的类型行为就像没有涉及指针一样——只是可以被拷贝的值。考虑值语义类型的一种方式是，在拷贝方面它们“工作得就像整数一样”。\n\
  \n### 17.4.4 移动\n\n如果一个 vector 有很多元素，拷贝的代价可能是昂贵的。因此，我们应该在需要时才拷贝 `Vector`。考虑这样一个例子：\n\
  \n```cpp\nVector fill(istream& is)\n{\n        Vector res;                     \
  \           // 假设有默认构造函数\n        for (double x : is)                      // 假设有\
  \ range for for\n                res.push_back(x);               // 假设有 push_back\n\
  \        return res;                                // 假设有 return\n}\n\nvoid use()\n\
  {\n        Vector vec = fill(cin);                  // 假设有 cin\n}\n```\n\n如果一个 vector\
  \ 有很多元素，拷贝代价可能是昂贵的。所以，我们应该在需要时才拷贝 `Vector`。考虑这样一个例子：\n\n点击此处查看代码图片\n\n![数据表连接了三个数组。数组\
  \ 1 标记为 vec，数组 2 标记为 res，大小为 3。array2 连接到另一个具有元素 0.0、1.1 和 2.2 的数组。](img/f0495-01.jpg)\n\
  \n**AA**\n\n我们想要“偷取” `res` 的表示给 `vec`。换句话说，`vec` 元素不需要任何拷贝。将 `res` 的元素指针和计数移动到 `vec`\
  \ 后，`res` 不包含元素。我们成功地从 `fill()` 及其调用者处移动了 3 个 `double`，代价是 4 次单字赋值。\n\n![数据表连接了三个数组。数组\
  \ 1 标记为 vec，数组 2 标记为 res，大小为 3。array2 连接到另一个具有元素 0.0、1.1 和 2.2 的数组。](img/f0495-02.jpg)\n\
  \n即使我们移动了 100,000 个 `double`，代价也是一样的。\n\n在这样的简单情况下，编译器可以发现如何做得更好，而且几十年来一直一直是这么的。它直接在\
  \ `vec` 的位置构造 `res`。这样一来，就不会有独立的 `res` 需要拷贝。这被称为*拷贝消除*（*copy elision*）。然而，为了避免在任何情况下都拷贝，我们需要在\
  \ C++ 代码中表达这种移动。如何？我们定义移动操作来补充拷贝操作：\n\n点击此处查看代码图片\n\n```cpp\nclass Vector {\n  \
  \      int sz;\n        double* elem;\npublic:\n        Vector(Vector&& arg);  \
  \                            // 移动构造函数\n        Vector& operator=(Vector&& arg);\
  \           // 移动赋值\n        // ...\n};\n```\n\n**AA**\n\n奇怪的 `&&` 符号被称为*右值引用*（*rvalue\
  \ reference*）。我们用它定义移动操作。注意移动操作不接受 `const` 参数；也就是说，我们写 `(Vector&&)` 而不是 `(const\
  \ Vector&&)`。移动操作的目的之一是修改源，使其“为空”。移动操作的定义往往很简单。它们往往比等效的拷贝操作简单且高效。对于 `Vector`，我们得到了\n\
  \n\n\n\n点击此处查看代码图像\n\n```\nVector::Vector(Vector&& arg)\n         :sz{arg.sz}, elem{arg.elem}\
  \           // 拷贝 arg 的 elem 和 sz\n{\n        arg.sz = 0;                      \
  \         // 使 arg 变为空 Vector\n        arg.elem = nullptr;\n}\n\nVector& Vector::operator=(Vector&&\
  \ arg)              //将 arg 移动到此 Vector\n{\n        if (this != &arg) {        \
  \              // 防止自赋值（例如 v=v）\n                delete[] elem;                \
  \ // 释放旧空间\n                elem = arg.elem;            // 拷贝 arg 的 elem 和 sz\n\
  \                sz = arg.sz;\n                arg.elem = nullptr;          // 使\
  \ arg 变为空 Vector\n                arg.sz = 0;\n        }\n        return *this;\
  \                             // 返回自引用 (§15.8)\n}\n```\n\n通过定义移动构造函数，我们可以轻松且廉价地移动大量信息，例如包含许多元素的\
  \ vector。再次考虑：\n\n点击此处查看代码图像\n\n```\nVector fill(istream& is)\n{\n        Vector\
  \ res;                               // 假设我们有一个默认构造函数 (§17.5)\n        for (double\
  \ x; is>>x; )              // 假设支持范围 for 循环 (§17.6)\n                res.push_back(x);\
  \            // 假设我们有 Vector::push_back (§17.8.4)\n        return res;\n}\n```\n\
  \n移动构造函数被隐式用于实现返回。编译器知道返回的局部值 `res` 将离开作用域，因此它可以从它进行移动，而不是拷贝。\n\n**XX**\n\n移动构造函数的重要性在于，我们不需要通过处理指针或引用来从函数获取大量信息。考虑这个有缺陷（但很常见）替代方案：\n\
  \n点击此处查看代码图像\n\n```\nVector* fill2(istream& is)\n{\n        Vector* res = new Vector;\n\
  \        for (double x; is>>x; )\n                res−>push_back(x);\n        return\
  \ res;\n}\n\nvoid use2()\n{\n        Vector* vec = fill2(cin);\n        // ... 使用\
  \ vec ...\n        delete vec;\n}\n```\n\n现在我们必须记住删除 `Vector`。正如 §15.4.5 中描述的，删除放置在空存储（free\
  \ store）上的对象并不看起来那样容易一致且正确地完成。\n\n### 17.5 核心操作\n\n**CC**\n\n我们现在已经到了讨论如何决定一个类应该拥有哪些构造函数、是否应该有一个析构函数，以及是否需要提供拷贝和移动操作了。有七种核心操作需要考虑：\n\
  \n*   来自一个或多个参数的构造函数\n*   默认构造函数 (§17.5)\n*   拷贝构造函数（拷贝相同类型的对象；§17.4.1](#ch17.xhtml_ch17lev2sec1))\n\
  *   拷贝赋值（拷贝相同类型的对象；§17.4.2](#ch17.xhtml_ch17lev2sec2))\n*   移动构造函数（移动相同类型的对象；§17.4.4](#ch17.xhtml_ch17lev2sec4))\n\
  *   移动赋值（移动相同类型的对象；§17.4.4](#ch17.xhtml_ch17lev2sec4))\n*   析构函数 (§15.5)\n\n通常，我们需要一个或多个接受初始化对象所需参数的构造函数。例如：\n\
  \n点击此处查看代码图像\n\n```\nstring s {\"cat.jpg\"};                                   \
  \ // 将 s 初始化为字符字符串 \"cat.jpg\"\nImage ii {Point{200,300},\"cat.jpg\"};         \
  \  // 初始化一个坐标为{200,300} 的 Point，\n                                             \
  \                    // 然后在该点处显示文件 cat.jpg 的内容\n```\n\n初始化列表的含义/用法完全取决于构造函数。标准 `string`\
  \ 的构造函数使用字符字符串作为初始值，而 `Image` 的构造函数将字符串用作打开的文件名。通常，我们使用构造函数来建立一个不变性 (§8.4.3)）。如果我们无法为一个类定义构造函数可以建立的良好不变性，我们可能拥有一个设计糟糕的类或一个简单的数据结构。\n\
  \n接受参数的构造函数与它们服务的类一样多样。剩余的操作具有更规则的模式。\n\n我们如何知道一个类是否需要默认构造函数？如果我们希望能够在不指定初始化列表的情况下创建类的对象，我们就需要默认构造函数。最常见的例子是当我们想要将类的对象放入标准库\
  \ `vector` 中。以下代码之所以能运行，是因为我们拥有 `int`、`string` 和 `vector<int>` 的默认值：\n\n点击此处查看代码图像\n\
  \n```\nvector<double> vi(10);                            // 包含 10 个 double 的 vector\n\
  vector<string> vs(10);                             // 包含 10 个 string 的 vector\n\
  vector<vector<int>> vvi(10);                      // 包含 10 个 vector 的 vector\n```\n\
  \n\n\n接受单个参数的构造函数定义了从该参数类型到其类的转换。这可能非常有用。例如：\n\n点击此处查看代码图片\n\n```cpp\nclass complex\
  \ {\npublic:\n        complex(double);                      // 定义了 double 到 complex\
  \ 的转换\n        complex(double,double);\n        // ...\n};\n\ncomplex z1 = 3.14;\
  \                            // OK: 将 3.14 转换为 (3.14,0)\ncomplex z2 = complex{1.2,\
  \ 3.4};\n```\n\n#### AA\n\n然而，隐式转换应该节用并谨慎使用，因为它们可能会导致意想不到且不理想的结果。例如，我们到为止定义的 `Vector`\
  \ 拥有一个接受 `int` 的构造函数。这意味着它定义了从 `int` 到 `Vector` 的转换。例如：\n\n点击此处查看代码图片\n\n```cpp\n\
  class Vector {\n        // ...\n        Vector(int);\n        // ...\n};\n\nVector\
  \ v = 10;                    // 奇怪：创建了一个包含 10 个 double 的 Vector\nv = 20;       \
  \                        // 额？将一个新的包含 20 个 double 的 Vector 赋值给 v\n\nvoid f(const\
  \ Vector&);\nf(10);                                 // 额？用包含 10 个 double 的新 Vector\
  \ 调用 f\n```\n\n#### CC\n\n看来我们得到的比预期的要多。幸运的是，抑制这种构造函数作为隐式转换的使用是简单的。由构造函数定义的 `explicit`\
  \ 只提供常规的构造语义，而不提供隐式转换。例如：\n\n点击此处查看代码图片\n\n```cpp\nclass Vector {\n        // ...\n\
  \        explicit Vector(int);\n        // ...\n};\n\nVector v = 10;           \
  \       // 错误：没有隐式的 int 到 Vector 转换\nv = 20;                             // 错误：没有隐式的\
  \ int 到 Vector 转换\nVector v(10);                    // OK: 被认为是显式构造\n\nvoid f(const\
  \ Vector&);\nf(10);                               // 错误：没有隐式的 int 到 Vector 转换\n\
  f(Vector(10));                   // OK: 被认为是显式构造\n```\n\n为了避免意外的转换，我们——像标准库一样——将\
  \ `Vector` 的单参数构造函数定义为 `explicit`。遗憾的是，构造函数默认不是 `explicit` 的；如果确定，请将任何可以使用单个参数调用的构造函数都设为\
  \ `explicit`。\n\n##### 17.5.2 调试构造函数和析构函数\n\n##### AA\n\n构造函数和析构函数在程序执行过程中定义明确且可预测的时间点被调用。然而，我们并不总是编写显式调用，例如\
  \ `vector<double>(2)`；相反，我们会执行一些操作，例如从函数返回一个 `vector`、将 `vector` 作为值参数传递，或者使用 `new`\
  \ 在堆上创建一个 `vector`。这对于从语法角度思考的人可能会引起困惑。触发构造函数的并不是只有一种语法。这样思考构造函数和析构函数更简单：\n\n* \
  \  每当创建一个类型为 `X` 的对象时，就会调用 `X` 的构造函数之一。\n*   每当类型为 `X` 的对象被销毁时，就会调用 `X` 的析构函数。\n\
  \n当一个类的对象被销毁时，析构函数就会被调用；这发生在名称超出作用域、程序终止或对对象指针使用 `delete` 时。当一个类的对象被创建时，构造函数（某个合适的构造函数）就会被调用；这发生在变量初始化时、使用\
  \ `new` 创建对象时（内置类型除外），每当对象被复制时。\n\n但这些在什么时候发生呢？获得这种感觉的一个好方法是在构造函数、赋值操作和析构函数中添加打印语句，然后直接尝试。例如：\n\
  \n点击此处查看代码图片\n\n```cpp\nstruct X {                // 简单的测试类\n       int val;\n\n\
  \       void out(const string& s, int nv) { cout << this << \"−>\" << s << \": \"\
  \ << val << \" (\" << nv << \")\\n\"; }\n\n       X(){ out(\"X()\",0); val=0; }\
  \                                                           // 默认构造函数\n       X(int\
  \ x) { out( \"X(int)\",x); val=x; }\n       X(const X& x){out(\"X(X&) \",x.val);\
  \ val=x.val; }                          // 拷贝构造函数\n       X(X&& x){ out(\"X(X&&)\
  \ \",x.val); val=x.val; x.val=0; }                // 移动构造函数\n       X& operator=(const\
  \ X& x) { out(\"X copy assignment\",x.val); val=x.val; return *this; }\n       X&\
  \ operator=(X&& x) { out(\"X move assignment\",x.val); val=x.val; x.val=0; return\
  \ *this; }\n       ˜X() { out(\"˜X()\",0); }                                   //\
  \ 析构函数\n};\n```\n\n我们对这个 `X` 进行的任何都会留下我们可以研究的痕迹。例如：\n\n点击此处查看代码图片\n\n```cpp\nX glob\
  \ {2};                                       // 全局变量\n\nX glob {2};            \
  \                           // 全局变量\n\nX glob {2};                             \
  \          // 全局变量\n```\n\n\n\n\n*   `initializer_list` 构造与赋值 (§17.3)\n\n*   迭代支持函数，例如\
  \ `begin()` 和 `end()`，这是范围-`for` 所需的\n\n*   `swap()` (§7.4.5, §18.4.3))\n\n对于 `vector`，`begin()`\
  \ 返回序列中第一个元素的位置，`end()` 返回末尾之后的位置。对于 `Vector`，这变为：\n\n点击此处查看代码图像\n\n```cpp\ndouble*\
  \ Vector::begin() const { return elem; }\ndouble* Vector::end() const { return elem+sz;\
  \ }\n```\n\n或者以图形化表示：\n\n![数据表连接两个数组。数组 1 通过函数 s z, e l e m 和空间定义。该数组连接到一个从 0 到\
  \ s z 减 1 的数组。](img/f0502-01.jpg)\n\n`begin()`/`end()` 对被用于许多算法 (第 21 章) 和范围-`for`\
  \ 实现元素的遍历。\n\n### 17.6.1 比较运算符\n\n我们可以为自己的类型定义运算符，不仅仅是 `[]` 和 `=`，基本上是所有的运算符。当我们定义赋值\
  \ `=` 时，通常还需要定义等等性 `==`，这样我们就可以说明赋值目标与其源具有相同值意味着什么。通常，`a=b` 意味着赋值后我们有 `a==b`。对于我们的\
  \ `Vector`，这很容易做到：\n\n点击此处查看代码图像\n\n```cpp\nbool operator==(const Vector& v1, const\
  \ Vector& v2)\n{\n        if (v1.size!=v2.size())\n                return false;\n\
  \        for (int i = 0; i<v1.size(); ++i)\n                if (v1[i]!=v2[i])\n\
  \                        return false;\n        return true;\n}\n```\n\n注意对元素数量的初始比较。如果没有那个，我们可能会在找到两个不相等的元素之前浪费大量时间比较许多元素。此外，在确定大小相等后，我们在遍历元素时不需要再次检查两个大小。在处理容器时，这种简单的优化往往是最有效的。\n\
  \n### 17.6.2 相关运算符\n\n运算符很少孤立存在，它们以相关运算符的“簇”形式出现，共同实现所需的所需的语义：\n\n*   `+`、`−`、`*`、`/`\
  \ 以及有时的 `%` 倾向于在一起。\n*   我们看到指针需要 `*`、`->` 和 `[]`。\n*   当我们有 `==` 时，我们通常也想要 `!=`。\n\
  *   当我们有 `=` 时，我们通常也想要 `==` 和 `!=`。\n*   `<` `<=` `>` `>= 是比较运算符。当我们拥有这些时，通常也想要\
  \ `==` 和 `!=`。\n\n运算符具有约定的含义，我们应该小心遵守这些约定。一个执行减法功能的 `+` 会严重误导读者。\n\n通常，从一组相关运算符中构建一个运算符最简单且最高效的方法是基于其中另一个运算符。这里是为我们的\
  \ `Vector` 定义 `!=`：\n\n点击此处查看代码图像\n\n```cpp\nbool operator!=(const Vector& v1, const\
  \ Vector& v2)\n{\n        return !(v1==v2);\n}\n```\n\n出于历史原因，定义运算符被称为*运算符重载* (operator\
  \ overloading)，因为这样做为该运算符添加了含义。\n\n自然，标准库的 `std::vector` 拥有比较运算符：`==`、`!=`、`<` `<=`\
  \ `>` 和 `>=`。我们在这里所做的只是继续努力，按照标准库中它的形象来构建我们的 `Vector`。\n\n你可以为自己的类型定义的其他运算符还包括：\n\
  \n*   `()` 应用/调用\n*   `,` 逗号\n*   `<<` 和 `>>`\n*   `&` 按位与、`|` 按位或、`^` 按位异或，以及 `~`\
  \ 按位取反\n*   `&&` 逻辑与，以及 `||` 逻辑或\n*   但遗憾的是没有 `.`（点）\n\n不，你不能定义自己的运算符（例如 `^=` 或\
  \ `~==`）或重定义内置类型上运算符的含义（例如整数上的 `+`）。我们认为允许这种灵活性带来的混乱大于在少数情况下获得的收益。\n\n### 17.7 剩余的\
  \ Vector 问题\n\n我们的 `Vector` 类已经达到了这一点，我们可以：\n\n*   创建任意数量双精度浮点元素（`Vector` 类对象）的\
  \ `Vector`。\n*   使用赋值和初始化拷贝我们的 `Vector`。\n*   使用赋值和初始化廉价地跨作用域移动 `Vector`。\n*   使用\
  \ `initializer_list` 进行赋值和初始化。\n*   依赖 `Vector` 在离开作用域时正确释放内存。\n*   使用下标符号访问 `Vector`\
  \ 元素。\n*   使用 `==` 和 `!=` 比较 `Vector`。\n*   通过 `begin()` 和 `end()` 支持范围-`for`。\n\
  \n这些都很用，但为了达到预期的水平（基于 `std::vector`），我们需要解决三个问题：\n\n*   如何更改 `Vector` 的大小？\n*  \
  \ 如何捕获越界的 `Vector` 访问？\n*   如何指定 `Vector` 的元素类型？\n\n例如，我们如何定义：\n\n点击此处查看代码图像\n\n\
  ```cpp\nVector<double> vd;                      // double 类型元素\nfor (double d; cin>>d;\
  \ )\n        vd.push_back(d);                  // 扩展 vd 以包含所有元素\n\nVector<char>\
  \ vc(100);                   // char 类型元素\nint n = 0;\nif (cin>>n && 0<n)\n    \
  \    vc.resize(n);                         // 使 vc 有 n 个元素\n```\n\n\n\n\n\n并不是所有的容器都具有相同数量的元素。我们可以使用一个大小在初始定义时就固定的\
  \ `vector` 吗？也就是说，我们是否可以在不使用 `push_back()`、`resize()` 以及等效操作的情况下编写代码？当然可以，而且这种类\
  \ vector 的容器可能非常有用。然而，这会给程序员带来不必要的负担：处理固定大小容器的基本技巧是，当元素数量增长到超过初始大小的范围时，将元素移动到一个更大的容器中。例如，我们可以像这样读取到一个\
  \ `vector` 中，而从未改变 `vector` 的大小：\n\n点击此处查看代码\n\n```\nvoid grow(Vector& v)      \
  \            // 在不使用 push_back 的情况下向 vector 读取元素:\n{\n        int n = 0;       \
  \                             // 元素数量\n        for (double d; cin>>d; ) {\n    \
  \            if (n==v.size()) {\n                         Vector v2(v.size()+1);\n\
  \                         for (int i; i<v.size(); ++i)\n                       \
  \          v2[i] = v[i];\n                         v = v2;\n                }\n\
  \        }\n        v[n] = d;                                     // 添加新元素\n}\n\
  ```\n\n这看起来并不优雅。你确信我们这样做是对的吗？如果我们超过了原始大小，效率将是极其低下的！使用容器（如 `vector`）的原因之一是为了做得更好；换句话说，我们希望\
  \ `Vector` 在内部处理此类大小变化，以为我们——即用户——节省麻烦并减少出错的机会。换句话说，我们通常更倾向于使用可以增长以容纳我们所需的精确数量元素的容器。标准库中相当于上述代码的代码简单得多，也高效得多：\n\
  \n点击此处查看代码\n\n```\nvoid grow(vector<double>& v)          // 使用标准库\n{\n        for\
  \ (double d; cin>>d; )\n                vd.push_back(d);\n}\n```\n\n**CC**\n\n这种大小的变化常见吗？如果并不常见，那么改变大小的功能仅仅是微小的便利。然而，这种大小的变化非常常见。最明显的例子是从输入中读取未知数量的值。其他例子包括从搜索中收集结果集（我们预先不知道会有多少结果）以及从集合中逐个删除元素。因此，问题不在于我们是否应该处理容器的大小变化，而是如何处理。\n\
  \n**XX**\n\n我们为什么要费心改变大小呢？为什么不“直接分配足够的空间就完事”？这似乎是最简单、最高效的策略。然而，只有在我们能够可靠地分配足够空间而又不会分配过多空间时，这种策略才有效——而我们做不到。当我们能做到这一点时，仍然必须跟踪预分配空间中已经使用了多少。经验表明，这样做绝非易事，而且是错误的根源。除非我们仔细且系统地检查越界访问，否则我们就会招遭灾难。因此，我们更倾向于让一个设计合理且实现仔细的库来处理这些问题。\n\
  \n容器有许多种类。这是一个重要的点，因为它具有重要的影响，所以不应该在不加思考的情况下就接受它。为什么所有容器不能都是 `vector` 呢？如果我们只需要对付一种容器（例如\
  \ `vector`），我们就可以抛弃关于如何编写它的顾虑，直接将其作为语言的一部分。如果我们只需要对付一种容器，我们就不需要费心学习不同种类的容器；我们一直使用\
  \ `vector` 即可。\n\n好了，数据结构是大多数重要应用程序的关键。有很多关于如何组织数据的厚实且实用的书籍，其中许多信息可以被视为对“如何最好存储我的数据？”这个问题的回答。因此，答案是我们需要许多不同类型的容器，但这是一个太大的课题了，在在这里无法充分解决。然而，我们已经大量地使用了\
  \ `vector` 和 `string`（`string` 是字符的容器）。在接下来的章节中，我们将看到 `list`、`map`（`map` 是一个由键值对构成的树）以及矩阵（PPP2.§24.5）。因为我们需要许多不同的容器，构建和使用容器所需的语言特性和编程技术具有广泛的用处。事实上，我们用于存储和访问数据的技术是所有非平凡计算形式中最基础、最有效的技术之一。\n\
  \n**CC**\n\n在最基础的内存层面，所有对象都是固定大小的且不存在类型。我们在这里做的是引入语言设施和编程技术，允许我们提供各种类型对象的容器，并改变其元素数量。这赋予了我们从根本上非常有用的灵活性便利性。\n\
  \n### 17.8 改变大小\n\n`std::vector` 提供了哪些改变大小的功能？它提供了三种简单的操作。给定\n\n点击此处查看代码\n\n```\n\
  vector<double> v;          // v.size()==0\n```\n\n我们可以通过三种方式改变它的大小：\n\n点击此处查看代码\n\
  \n```\nv.resize(10);                   // v 现在有 10 个元素\n\nv.push_back(7);      \
  \        // 在 v 的末尾添加一个值为 7 的元素；v.size() 增加 1\n\nv.push_back(7);              //\
  \ 赋值另一个 vector；v.size() 现在等于 v2.size()\n```\n\n标准库 `vector` 提供了更多改变 `vector` 大小的操作，例如\
  \ `erase()` 和 `insert()`，但在这里我们只看到 **Vector** 的 `resize()`、`push_back()` 和 `operator=`。\n\
  \n#### 17.8.1 表示\n\n在第 17.7 节中，我们展示了一种改变大小的简单、原始策略：只需为新数量的元素分配空间，并将旧元素复制到新空间中。然而，如果你频繁调整大小，那样效率很低。在实践中，如果我们改变大小，通常会这样做很多。特别是，我们很少只看到一个\
  \ `push_back()`。因此，我们可以通过预测此类大小变化来优化程序。事实上，所有的 `vector` 实现都跟踪元素数量以及为“未来扩展”预留的“空闲空间”。例如：\n\
  \n点击此处查看代码\n\n```\nclass Vector {\n        // ...\nprivate:\n        int sz;   \
  \                   // 元素数量\n        double* elem;         // 第一个元素的地址\n       \
  \ int space;                // 元素数量加上新元素的“空闲空间”\n};\n```\n\n我们可以像这样图化表示：\n\n![Data\
  \ tables connects two arrays.](img/f0507-01.jpg)\n\n我们从 **0** 开始编号，所以 `sz`（元素数量）指向元素之后，而\
  \ `space` 指向最后一个分配槽位之后。所示的指针实际上是 `elem+sz` 和 `elem+space`。\n\n当 `Vector` 首次构造时，`space==sz`；也就是说，没有“空闲空间”：\n\
  \n![Data tables connects two arrays.](img/f0507-02.jpg)\n\n我们在开始改变元素数量之前不会分配额外的槽。通常，`space==sz`，除非使用\
  \ `push_back()`，否则没有内存开销。\n\n`Vector` 的默认构造函数将它的整数成员设置为 **0**，将指针成员设置为 `nullptr`：\n\
  \n点击此处查看代码\n\n```cpp\nVector() :sz{0}, elem{nullptr}, space{0} {}\n```\n\n\n\n\n\
  \n那个超出边界的元素是完全虚构的。默认构造函数不进行堆内存分配，且占用的存储极极（但请参见第 16 题）。\n\n请注意，我们的 `Vector` 展示了用于实现标准\
  \ `vector`（以及其他数据结构）的技巧，但标准库的实现拥有了相当大的自由度，因此你系统上的 `std::vector` 可能会使用不同的技术。\n\n\
  ### 17.8.2 `reserve()` 和 `capacity()`\n\n当我们改变大小（即改变元素数量）时，最基础的操作是 `Vector::reserve()`。这是我们用来为新元素添加空间的操作：\n\
  \n点击查看代码图像\n\n```\nvoid Vector::reserve(int newalloc)\n{\n        if (newalloc<=space)\
  \                                // 永远不减少分配\n                return;\n        double*\
  \ p = new double[newalloc];         // 分配新空间\n        for (int i=0; i<sz; ++i) \
  \                               // 拷贝旧元素\n                p[i] = elem[i];\n    \
  \    delete[] elem;                                          // 释放旧空间\n        elem\
  \ = p;\n        space = newalloc;\n}\n```\n\n注意，我们没有初始化预留空间的元素。毕竟，我们只是预留空间；使用该空间存储元素是\
  \ `push_back()` 和 `resize()` 的工作。\n\n显然，`Vector` 中可用的空闲空间对用户可能，因此我们（像标准库一样）提供了一个成员函数来获取该信息：\n\
  \n点击查看代码图像\n\n```\nint Vector::capacity() const { return space; }\n```\n\n也就是说，对于一个名为\
  \ `v` 的 `Vector`，`v.capacity()−v.size()` 是我们在不引起重新分配的情况下，可以向 `v` `push_back()` 的元素数量。\n\
  \n标准库的 `vector` 永远不会隐式地减少其分配。它假设如果我们曾经需要某数量的内存，很可能会再次需要。如果不需要，`v.shrink_to_fit()`\
  \ 将将 `capacity` 减到 `size()`。\n\n### 17.8.3 `resize()`\n\n有了 `reserve()`，为我们的 `Vector`\
  \ 实现 `resize()` 相当简单。我们必须处理几种情况：\n\n*   新大小大于旧分配空间。\n*   新大小大于旧大小，但小于或等于旧分配空间。\n\
  *   新大小等于旧大小。\n*   新大小小于旧大小。\n\n让我们看看结果如何：\n\n点击查看代码图像\n\n```\nvoid Vector::resize(int\
  \ newsize)\n        // 使 vector 拥有 newsize 个元素\n        // 用默认值 0.0 初始化每个新元素\n{\n\
  \        reserve(newsize);\n        for (int i=sz; i<newsize; ++i)           //\
  \ 初始化新元素\n                elem[i] = 0;\n        sz = newsize;\n}\n```\n\n我们让 `reserve()`\
  \ 来处理内存的繁重工作。循环负责初始化新元素（如果有任何的话）。\n\n虽然我们在这里没有显式地处理任何情况，但你仍然可以验证所有情况都已正确处理。\n\n\
  **尝试一试**\n\n如果我们想说服自己这个 `resize()` 是正确的，我们需要考虑（并测试）哪些情况？`newsize == 0` 怎样？`newsize\
  \ == −77` 又又怎样？\n\n### 17.8.4 `push_back()`\n\n当我们第一次想到它时，`push_back()` 的实现可能看起来复杂，但有了\
  \ `reserve()`，它就非常简单：\n\n点击查看代码图像\n\n```\nvoid Vector::push_back(double d)\n   \
  \     // 将 vector 大小增加一；用 d 初始化新元素\n{\n        if (space==0)                   \
  \     // 从 8 个元素的空间开始\n                reserve(8);\n        else if (sz==space)\n\
  \                reserve(2*space);         // 获取更多空间\n        elem[sz] = d;    \
  \                    // 在末尾添加 d\n        ++sz;                                 \
  \    增加大小（sz 是元素数量）\n}\n```\n\n换句话说，如果没有空闲空间，我们就将分配的大小翻倍。在实践中证明，对于 `vector` 的绝大多数用途来说，这是一个非常好的选择，这也是\
  \ `std::vector` 大多数实现所采用的策略。\n\n### 17.8.5 赋值\n\n我们可以通过几种不同的方式定义 vector 赋值。例如，我们可以决定只有当涉及的两个\
  \ vector 具有相同数量的元素时赋值才是合法的。但在 §17.4 中，我们决定 vector 赋值应该具有通用且可能是最明显的含义：在赋值 `v1=v2`\
  \ 之后，vector `v1` 是 `v2` 的拷贝。考虑：\n\n![数据表连接四个数组。](img/f0510-01.jpg)\n\n显然，我们需要像在\
  \ §17.4.2 中那样拷贝元素，但空闲空间呢？我们拷贝空闲空间吗？最简单的实现是：\n\n*   为拷贝分配内存。\n*   拷贝元素。\n*   删除旧分配。\n\
  *   设置 `sz`、`elem` 和 `space` 为新值。\n\n如下：\n\n点击查看代码图像\n\n```\nVector& Vector::operator=(const\
  \ Vector& a)\n        // 拷贝构造函数，但我们必须处理旧元素\n{\n        double* p = new double[a.sz];\
  \     // 分配新空间\n        for (int i = 0; i<a.sz; ++i)               // 拷贝元素\n   \
  \             p[i] = a.elem[i];\n        delete[] elem;                        \
  \      // 释放旧空间\n\n        space = sz = a.sz;                        // 设置新大小\n\
  \        elem = p;                                     // 设置元素\n        return *this;\
  \                                  // 返回引用\n}\n```\n\n按照约定，赋值运算符返回对象的引用。该符号是 `this`，在\
  \ §15.8 中解释。\n\n这种实现是正确的，但当我们仔细观察时，发现我们做了很多冗的分配和释放。如果我们赋值的 vector 比我们要赋值的元素多？如果我们赋值的\
  \ vector 与我们要赋值的元素数量相同？在许多应用中，最后一种情况非常常见。在任何情况下，我们都可以将元素拷贝到目标 `Vector` 的可用空间中：\n\
  \n点击查看代码图像\n\n```\nVector& Vector::operator=(const Vector& a)\n{\n        if (this==&a)\
  \                                  // 自赋值，不需要做工作\n                return *this;\n\
  \n        if (a.sz<=space) {                          // 空间足够，不需要新分配\n         \
  \       for (int i = 0; i<a.sz; ++i)       // 拷贝元素\n                        elem[i]\
  \ = a.elem[i];\n                sz = a.sz;\n                return *this;\n    \
  \    }\n\n        double* p = new double[a.sz];     // 分配新空间\n        for (int i\
  \ = 0; i<a.sz; ++i)               // 拷贝元素\n                p[i] = a.elem[i];\n \
  \       delete[] elem;                              // 释放旧空间\n\n        space =\
  \ sz = a.sz;                        // 设置新大小\n        elem = p;                \
  \                     // 设置元素\n        return *this;                           \
  \       // 返回自引用\n}\n```\n\n\n\n\n\n请说服你自己，如果我们移除 `this==&a` 情况，这段代码实际上是有效的。`a.sz<=space`\
  \ 也仅仅是一种优化。请说服你自己，如果我们移除 `a.sz<=space` 情况，这段代码实际上是有效的。\n\n### 17.9 我们到目前为止的 Vector\n\
  \n现在我们有了一个接近真实的 `double` 类型的 `Vector`：\n\n点击此处查看代码图像\n\n```cpp\nclass Vector {\n\
  /*\n        不变性:\n        如果 0<=n<sz, elem[n] 是元素 n\n        sz<=space;\n      \
  \  如果 sz<space，则 elem[sz-1] 后有空间存放 (space-sz) 个 double\n*/\n        int sz;    \
  \                   // size\n        double* elem;          // 指元素的指针（或 0）\n   \
  \     int space;                 // 元素数量加上空槽数量\npublic:\n        Vector() : sz{0},\
  \ elem{nullptr}, space{0} { }\n        explicit Vector(int s) :sz{s}, elem{new double[s]},\
  \ space{s}\n        {\n                for (int i=0; i<sz; ++i)\n              \
  \          elem[i]=0;        // 元素已初始化\n        }\n\n        Vector(initializer_list<double>\
  \ lst);                        // 列表初始化\n        Vector& operator=(initializer_list<double>\
  \ lst);      // 列表赋值\n\n        Vector(const Vector&);                         \
  \                   // 拷贝构造函数\n        Vector& operator=(const vector&);       \
  \                  // 拷贝赋值\n\n        Vector(vector&&);                        \
  \                           // 移动构造函数\n        Vector& operator=(Vector&&);    \
  \                            // 移动赋值\n\n        ~Vector() { delete[] elem; }   \
  \                                   // 析构函数\n\n        double& operator  { return\
  \ elem[n]; }         // 访问：返回引用\n        const double& operator[](int n) const {\
  \ return elem[n]; }\n\n        int size() const { return sz; }\n        int capacity()\
  \ const { return space; }\n\n        void resize(int newsize);                 \
  \                     // 增长\n        void push_back(double d);\n        void reserve(int\
  \ newalloc);\n\n        double* begin() const { return elem; }                 \
  \  // 迭代支持\n        double* end() const { return elem+sz; }\n};\n\nbool operator==(Vector&\
  \ v1, Vector &v2);\nbool operator!=(Vector& v1, Vector &v2);\n```\n\n注意看它包含了核心操作（§17.5）：构造函数、默认构造函数、拷贝操作、移动操作和析构函数。它拥有访问数据的操作（下标运算符：`[\
  \ ]`）、提供该数据信息的操作（`size()` 和 `capacity()`）以及控制增长的操作（`resize()`、`push_back()` 和 `reserve()`）。\n\
  \n#### 练习\n\n编写一个类 `Ptr`，它有一个名为 `p` 的私有成员 `double*`。为 `Ptr` 提供如 §17.5 中描述的核心操作。构造函数应接受一个\
  \ `double` 参数，在自由存储区上分配一个 `double`，将该指针赋给 `p`，并将参数拷贝到 `*p`。为 `Ptr` 提供一个运算符 `*`，允许你读取和写入\
  \ `*p`。测试 `Ptr`。\n\n#### 复习习\n\n[1] 类对象拷贝的默认含义是什么？\n\n[2] 类对象拷贝的默认含义在什么时候合适？什么时候不合适？\n\
  \n[3] 什么是拷贝构造函数？\n\n[4] 什么是拷贝赋值？\n\n[5] 什么是移动构造函数？\n\n[6] 什么是移动赋值？\n\n[7] 什么是默认构造函数？\n\
  \n[8] 拷贝构造函数和移动构造函数之间的区别是什么？\n\n[9] 拷贝构造函数和拷贝赋值的区别是什么？\n\n[10] 什么是浅拷贝？什么是深拷贝？\n\n\
  [11] `vector` 的拷贝与它的源相比如何？\n\n[12] 拷贝消除（copy elision）的意义是什么？\n\n[13] 类的核心操作有哪些？\n\
  \n[14] 什么是 `explicit` 构造函数？\n\n[15] 什么情况下你希望构造函数不是 `explicit`？\n\n[16] 如何为容器定义遍历？\n\
  \n[17] 类对象可能会隐式地调用哪些操作？\n\n[18] 哪些运算符经常由用户定义？\n\n[19] 什么是*零规则（the rule of zero）*？\n\
  \n[20] 什么是*全规则（the rule of all）*？\n\n[21] 为什么我们不总是定义一个足够大的 `vector` 来应对所有情况？\n\n\
  [22] 哪些 `vector` 操作可以在构造后改变 `vector` 的大小？\n\n[23] `reserve()` 和 `resize()` 的区别是什么？\n\
  \n[24] 我们为新的 `vector` 分配多少空闲？\n\n[25] 我们什么时候必须将 `vector` 元素拷贝到新位置？\n\n[26] 拷贝后 `vector`\
  \ 的值是多少？\n\n#### 术语\n\n| `reserve()` | 深拷贝 | 浅拷贝 | 移动赋值 |\n| capacity | 默认构造函数 |\
  \ 移动构造 | 列表初始化 |\n| 拷贝赋值 | 核心操作 | `begin()` | `end()` |\n| 拷贝构造函数 | `explicit` 构造函数\
  \ | `&&` | `push_back()` |\n| `resize()` | size | 比较 | 遍历 |\n| 零规则 | 全规则 | `==`\
  \ | `!=` |\n\n#### 习\n\n[1] 定义类 `Matrix` 来表示 `double` 类型的二维矩阵。构造函数应接受两个整数参数指定行数和列数，例如\
  \ `Matrix{3,4}` 有 3 行 4 列。将 `Matrix` 的元素存储在单个 `vector` 中。测试 `Matrix`。\n\n[2] 为你的\
  \ `Matrix` 提供 `<<` 和 `>>`。\n\n[3] 将 `Matrix` 的表示改为私有。对于 `Matrix` 来说，什么是更完整的成员？例如，你需要一个\
  \ `+=` 运算符吗？什么是一组良好的构造函数？实现并测试你更完整的 `Matrix`。\n\n\n\n\n\n本章完成了最常用且最用的 STL 容器：`vector`\
  \ 的设计与实现。我们展示了如何指定元素类型为参数的容器，以及如何处理范围错误。按照惯例，所使用的技术通常是通用的，而不仅仅限于 `vector` 的实现，甚至不限于容器的实现。这些技术依赖于模板和异常，因此我们展示了如何定义模板，并提供了资源管理的基本技术，这是良好使用异常的关键。在此背景下，我们讨论了称为“资源获取即初始化”（RAII）的通用资源管理技术、资源管理保证以及标准库资源管理指针\
  \ `unique_ptr` 和 `shared_ptr`。\n\n## §18.1 模板\n\n- 类型作为模板参数\n- 泛型编程\n- 概念\n- 容器与继承\n\
  - 值模板参数\n\n## §18.2 泛化 Vector\n\n- 分配器\n\n## §18.3 范围检查与异常\n\n- 附记：设计考虑\n- 模块 PPP_support\n\
  \n## §18.4 资源与异常\n\n- 潜在的资源管理问题\n- 资源获取即初始化\n- 资源管理保证\n- Vector 的 RAII\n\n## §18.5\
  \ 资源管理指针\n\n- 通过移动返回 unique_ptr\n- shared_ptr\n\n### 18.1 模板\n\n显然，并不是所有的 `vector`\
  \ 都相同类型的元素。我们需要 `double` 类型的 `vector`、温度读数、记录（各种类型）、`string`、操作、GUI 按钮、形状、日期、指向窗口的指针等。这种可能性是无尽的。我们希望像这样为我们的\
  \ `Vector` 自由指定元素类型：\n\n点击此处查看代码图像\n\n```\nVector<double>\nVector<int>\nVector<Month>\n\
  Vector<Window*>                          // 指向 Windows 的指针 Vector\nVector<Vector<Record>>\
  \               // 记录 Vector 的 Vector\nVector<char>\n```\n\n**AA**\n\n为了实现这一点，我们必须了解如何定义模板。我们从第一天起就使用模板，但直到目前还没有需要定义过它。标准库提供了我们目前为止所需的内容，但我们不能迷信魔法，因此必须检查标准库的设计者和实现者是如何提供如\
  \ `vector` 类型和 `sort()` 函数等设施的 (§21.5)）。这不仅具有理论意义，因为一如往常，用于标准库的工具和技术对于我们自己的代码是最有用的。例如，在第\
  \ 19 章到第 21 章中我们展示了如何使用模板来实现标准库的容器和算法。\n\n**CC**\n\n基本上，*模板* 是一种允许程序员将类型作为类或函数的参数的机制。当我们以后提供特定类型作为参数时，编译器会生成特定的类或函数。\n\
  \n#### 18.1.1 类型作为模板参数\n\n**CC**\n\n我们希望将元素类型成为我们 `Vector` 的参数。因此，我们取 `Vector` 并\
  \ `double` 替换为 `T`，其中 `T` 是一个可以赋予“值”的参数，例如 `double`、`int`、`string`、`Vector<Record>`\
  \ 和 `Window*`。C++ 引入类型参数 `T` 的符号是 `template<typename T>` 前缀，意味着“对于所有类型 `T`”。例如：\n\
  \n点击此处查看代码图像\n\n```\ntemplate<typename T>           // 对于所有类型 T（就像数学中一样）\nclass\
  \ Vector {\n        int sz;              // 大小\n        T* elem;             //\
  \ 元素的指针\n        int space;            // 空间\npublic:\n        Vector() :sz{0},\
  \ elem{nullptr}, space{0} { }\n\n        explicit Vector(int s) :sz{s}, elem{new\
  \ T[s]}, space{s}\n        {\n                for (int i=0; i<sz; ++i)\n       \
  \         elem[i]=0;               // 元素被初始化\n        }\n\n        Vector(initializer_list<T>);\
  \ // 列表构造函数\n        Vector& operator=(initializer_list<T>); // 列表赋值\n\n       \
  \ Vector(const Vector&);      // 拷贝构造函数\n        Vector& operator=(const Vector&);\
  \ // 拷贝赋值\n\n        Vector(Vector&&);           // 移动构造函数\n        Vector& operator=(Vector&&);\
  \      // 移动赋值\n\n        ~Vector() { delete[] elem; }   // 析构函数\n\n        T& operator[](int\
  \ n) { return elem[n]; } // 访问：返回引用\n        const T& operator[](int n) const {\
  \ return elem[n]; }\n\n        int size() const { return sz; }     // 当前大小\n   \
  \     int capacity() const { return space; } // 当前容量\n\n        void resize(int\
  \ newsize);          // 增长\n        void push_back(const T& d);\n        void reserve(int\
  \ newalloc);\n\n        T* begin() const { return elem; } // 迭代支持\n        T* end()\
  \ const { return elem+sz; }\n};\n\ntemplate<typename T>\nbool operator==(const Vector<T>&,\
  \ const Vector<T>&);\n\ntemplate<typename T>\nbool operator!=(const Vector<T>&,\
  \ const Vector<T>&);\n```\n\n这就是我们 §18.1 中的 `double` 类型 `vector`，将 `double` 替换为模板参数\
  \ `T`。我们可以这样使用这个类模板 `Vector`：\n\n点击此处查看代码图像\n\n```\nVector<double> vd;         \
  \          // T 是 double\nVector<int> vi;                           // T 是 int\n\
  Vector<double*> vpd;                // T 是 double*\nVector<vector<int>> vvi;   \
  \         // T 是 Vector<T>, 其中 T 是 int\n```\n\n**AA**\n\n思考编译器在使用模板时所做的办法是：它用实际类型（模板参数）替换模板参数来生成类。例如，当编译器在代码中看到\
  \ `Vector<char>` 时，它（在某处）会生成类似的内容：\n\n点击此处查看代码图像\n\n\n\n\n\n```cpp\nclass Vector_char\
  \ {\n        int sz;               // 大小\n        char* elem;      // 指向元素的指针\n\
  \        int space;         // 大小 + 空闲空间\npublic:\n        Vector_char() :sz{0},\
  \ elem{nullptr}, space{0} { }\n        explicit Vector_char(int s) :sz{s}, elem{new\
  \ char[s]}, space{s}\n        {\n                for (int i=0; i<sz; ++i)\n    \
  \                    elem[i]=0;               // 元素初始化\n        }\n\n        Vector(initializer_list<T>);\
  \                                             // 列表构造函数\n        Vector& operator=(initializer_list<T>);\
  \                           // 列表赋值\n\n        Vector_char(const Vector_char&);\
  \                                  // 拷贝构造函数\n        Vector_char& operator=(const\
  \ Vector_char&);               // 拷贝赋值\n\n        Vector_char(vector_char&&);  \
  \                                       // 移动构造函数\n        Vector_char& operator=(Vector_char&&);\
  \                      // 移动赋值\n\n        ˜Vector_char();                      \
  \                                         // 析构函数\n\n        char& operator[] (int\
  \ n) { return elem[n]; }                     // 访问：返回引用\n        const char& operator[]\
  \ (int n) const ) { return elem[n]; }\n\n        int size() const;             \
  \                                                 // 当前大小\n        int capacity()\
  \ const;                                                       // 当前容量\n\n     \
  \   void resize(int newsize);                                               // 扩容\n\
  \        void push_back(const char& d);\n        void reserve(int newalloc);\n\n\
  \        char* begin() const { return elem; }                               // 迭代支持\n\
  \        char* end() const { return elem+sz; }\n};\n\nbool operator==(const Vector_char&,\
  \ const Vector_char&);\nbool operator!=(const Vector_char&, const Vector_char&);\n\
  ```\n\n同样，对于 `Vector<double>`，编译器会根据第 17.9 节 生成一个大致 `double` 类型的 `Vector`（使用一个意味着\
  \ `Vector<double>` 的适当内部名称）。\n\n**CC**\n\n有时，我们将类模板称为*类型生成器*（type generator）。从给定模板参数的类模板生成类型（类）的过程被称为*特化*（specialization）或*模板实例化*（template\
  \ instantiation）。例如，`Vector<char>` 和 `Vector<Open_polyline*****>` 被称为 `Vector` 的特化版本。在简单的情况下，比如我们的\
  \ `Vector`，实例化是一个非常简单的过程。在最通用和最先进的情况下，模板实例化是极其复杂的。对于模板用户来说，幸运的是，这种复杂性是编译器编写者的范畴，而不是模板用户的负担。模板实例化（模板特化版本的生成）发生在编译时或链接时，而不是运行时。\n\
  \n自然地，我们可以使用此类类模板的成员函数。例如：\n\n```cpp\nvoid fct(Vector<string>& v)\n{\n         int\
  \ n = v.size();\n         v.push_back(\"Ada\");\n         // ...\n}\n```\n\n当使用类模板的此类成员函数时，编译器会生成相应的相应的函数。例如，当编译器看到\
  \ `v.push_back(\"Ada\")` 时，它会生成一个函数\n\n点击此处查看代码图像\n\n```cpp\nvoid Vector<string>::push_back(const\
  \ string& d) { /* ... */ }\n```\n\n从模板定义中\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename\
  \ T>\nvoid Vector<T>::push_back(const T& d) { /* ... */ };\n```\n\n这样，就有一个函数供 `v.push_back(\"\
  Ada\")` 调用了。换句话说，当你需要为给定的对象和参数类型编写一个函数时，编译器会根据其模板为你编写它。\n\n与其编写 `template<typename\
  \ T>`，你可以写 `template<class T>`。这两种结构的意思完全相同，但有些人更倾向于使用 `typename`，“因为更清晰”，并且“因为没有人会因为看到\
  \ `typename` 而误认为你不能使用像 `int` 这样的内置类型作为模板参数”。我们认为 `class` 已经代表了类型，所以没有区别。此外，`class`\
  \ 更短一些。\n\n#### 18.1.2 泛型编程\n\n**CC**\n\n模板是 C++ 泛型编程的基础。事实上，C++ 中“泛型编程”最简单的定义就是“使用模板”。不过，这个定义有点太简单浅了。我们不应该用编程语言特性来定义基本的编程概念。编程语言特性的存在是为了支持编程技术——而不是相反。与大多数流行术语一样，“泛型编程”有许多定义。我们认为最有用的简单定义是：\n\
  \n*   *泛型编程*：编写可以处理作为参数呈现的各种类型的代码，只要这些参数类型满足特定的语法和语义要求。\n\n**CC**\n\n例如，`vector`\
  \ 的元素必须是我们可以拷贝和移动的类型。在第 19 章到第 21 章中，我们将看到要求对其参数进行算术运算的模板。当被我们参数化的是一个类时，我们得到一个*类模板*（通常称为*参数化类型*或*参数化类*）。当我们参数化的是一个函数时，我们得到一个*函数模板*（通常称为*参数化函数*，有时也称为*算法*）。因此，泛型编程有时被称为“算法导向的”。\n\
  \n由于参数化类型的概念是编程的核心，让我们进一步探索一下这些令人困惑的术语。这样我们在其他上下文中遇到此类概念时才不会混淆。\n\n**CC**\n\n这种依赖显式模板的泛型编程形式通常被称为*参数多态*（parametric\
  \ polymorphism）。相比之下，通过类层次结构和虚函数获得的多态被称为*特设多态*（ad hoc polymorphism），那种编程风格被称为*面向对象编程*（12.3）。这两种编程风格之所以被称为*多态*，是因为每种风格都通过单一接口呈现多个版本。*多态*在希腊语中是“许多形状”，指的是通过通用接口操作的许多不同类型。在第\
  \ 10 章到第 13 章的 **Shape** 示例中，我们通过 **Shape** 的接口访问了许多形状（如 **Text**、**Circle** 和 **Polygon**）。当我们使用\
  \ **vector** 时，我们通过 **vector** 模板定义的接口使用了许多 **vector**（如 **vector<int>**、**vector<double>**\
  \ 和 **vector<Shape*****）。\n\n面向对象编程（使用类层次结构和虚函数）与泛型编程（使用模板）之间有几点区别。最明显的区别是，在使用泛型编程时，调用的函数是由编译器在编译时确定的，而面向对象编程则直到运行时才确定。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\nv.push_back(x);                   // 将 x 放入向量 v\ns.draw();\
  \                              // 绘制形状 s\n```\n\n对于 `v.push_back(x)`，编译器将确定 `v`\
  \ 的元素类型并使用相应的 `push_back()`，但对于 `s.draw()`，编译器将间接调用某个 `draw()` 函数（使用 `s` 的 `vtbl`；参见\
  \ 12.3.1 节）。这为面向对象编程提供了泛型编程缺乏的自由，但让泛型编程更加规则、易于理解且性能更好（因此有了“特设”和“参数化”的标签）。\n\n\n\n\
  \n总结一下：\n\n- `泛型编程`(Generic programming)：由模板支持，依赖于编译时解析。\n- `面向对象编程`(Object-oriented\
  \ programming)：由带有虚函数的类层次结构支持，允许运行时解析。\n\n两者的结合是可能的且有用的。例如：\n\n点击此处查看代码\n\n```cpp\n\
  void draw_all(vector<Shape*>& v)\n{\n        for (auto x : v)\n                x−>draw();\n\
  }\n```\n\n在这里，我们在基类 `Shape` 上调用了虚函数 `draw()`——这无疑是面向对象编程。然而，我们还将 `Shape` 存储在 `vector`\
  \ 中，由于这是一个参数化类型，因此我们也使用了（简单的）泛型编程。\n\n## AA\n\n所以——假设你现在已经听了够哲学——人们实际上用模板做什么呢？为了获得无与伦比的灵活性和性能：\n\
  \n- 在性能至关重要的地方使用模板（例如，数值计算和硬实时；参见 PPP2.Ch24 和 PPP2.Ch25）。\n- 在组合多种类型信息的灵活性至关重要的地方使用模板（例如，C++\
  \ 标准库；参见第 19 章）。\n\n### 18.1.3 概念 (Concepts)\n\n## XX\n\n无约束参数的模板 `template<typename\
  \ T>` 有许多有用属性，例如极大的灵性和近乎完美的性能。此外，我们需要对模板对其模板参数的要求进行精确。例如，在非常旧的 C++ 代码中，我们发现这样的代码：\n\
  \n点击此处查看代码\n\n```cpp\ntemplate<typename T>          // 所有类型 T\nclass Vector {\n\
  \        // ...\n};\n```\n\n这并没有精确说明对参数类型 `T` 的期望是什么。\n\n我们将对一组模板参数的一系列要求称为`概念`(concept)。例如，`vector`\
  \ 要求其元素可以被复制和移动，可以获取地址，并且可以默认构造（如果需要）。换句话说，元素必须满足一组要求，我们可以称之为 `Element`。我们可以将其显式化：\n\
  \n点击此处查看代码\n\n```cpp\ntemplate<typename T>               // 所有类型 T\n        requires\
  \ Element<T>()         // 只要 T 是 Element\nclass Vector {\n        // ...\n};\n```\n\
  \n这表明概念实际上是一个类型谓词（type predicate），即一个编译时求值的（`constexpr`）函数，如果类型参数（此处为 `T`）具有概念（此处为\
  \ `Element`）所要求的属性，则返回 `true`，否则返回 `false`。这种表示法有点冗长，但简写符号带我们我们：\n\n点击此处查看代码\n\n\
  ```cpp\ntemplate<Element T>       // 所有类型 T，使得 Element<T>() 为真\nclass Vector {\n\
  \        // ...\n};\n```\n\n我们用于描述概念的数学词汇反映了概念的数学根。概念代表了谓词逻辑的形式。\n\n标准库提供了许多有用的概念，其中一些我们在第\
  \ 19 章中可能会。那时，它们的含义和用途将变得清晰。\n\n- `range<C>()`：`C` 可以持有 `Element` 并作为 `[begin():end())`\
  \ 序列被访问。\n- `input_iterator<In>()`：`In` 可用于一次读取序列 `[b:e)`（如输入流）。\n- `output_iterator<Out>()`：`Out`\
  \ 可用于输出（如输出流）。我们无法使用 `Out` 进行读取。\n- `forward_iterator<For>()`：`For` 可用于遍历序列 `[b:e)`（如链表、vector\
  \ 或数组）。我们可以使用 `For` 多次遍历 `[b:e)`。\n- `random_access_iterator<Ran>()`：`Ran` 可多次读写序列\
  \ `[b:e)`，并支持使用 `[]` 进行下标访问。\n- `random_access_range<Ran>()`：带有 `random_access_iterator`\
  \ 器的 `range`。\n- `equality_comparable<T>()`：我们可以使用 `==` 比较两个 `T` 是否相等以获得布尔结果。\n\
  - `equality_comparable_with<T,U>()`：我们可以使用 `==` 比较一个 `T` 和一个 `U` 是否相等以获得布尔结果。\n\
  - `predicate<P,T...>()`：我们可以用一组指定的 N 个类型 `T1, T2, ...` 的参数调用 `P` 以获得布尔结果。\n- `indirect_unary_predicate<P,I>()`：我们可以用类型\
  \ `I` 的迭代器参数调用 `P` 以获得布尔结果。\n- `invocable<F,T...>()`：我们可以用一组指定的 N 个类型 `T1, T2, ...`\
  \ 的参数调用 `F`。\n- `totally_ordered<T>()`：我们可以使用 `==` 比较两个 `T`。\n- `totally_ordered_with<T,U>()`：我们可以使用\
  \ `==` 比较一个 `T` 和一个 `U` 以获得布尔结果。\n- `binary_operation<B,T,U>()`：我们可以使用 `B` 对 `T`\
  \ 和 `U` 执行操作。\n- `derived_from<D,B>()`：`D` 公地派自 `B`。\n- `convertible_to<F,T>()`：`F`\
  \ 可以转换为 `T`。\n- `integral<T>()`：`T` 是整数类型（如 `int`）。\n- `floating_point<T>()`：`T`\
  \ 是浮点类型（如 `double`）。\n- `copyable<T>()`：`T` 可以被复制。\n- `moveable<T>()`：`T` 可以被移动。\n\
  - `semiregular<T>()`：`T` 可以被复制、移动和交换。\n- `regular<T>()`：`T` 是 `semiregular` 且 `equality_comparable`。\n\
  - `sortable<I>()`：`I` 是 `random_access_iterator`，其 `value_type` 元素可以使用 `<` 比较。\n\
  - `sortable<I,C>()`：`I` 是 `random_access_iterator`，其 `value_type` 元素可以使用 `C` 比较。\n\
  - `allocator<A>()`：`A` 可用于获取和释放内存（如自由存储）。\n\n对于标准库容器和算法，这些概念（以及更多）是以极其详尽的方式指定的。在这里，特别是在第\
  \ 19 章到第 21 章，我们使用它们来指定我们的容器。\n\n#### 容器与继承。\n\n面向对象编程和泛型编程的结合中有一种方式人们总是尝试但行不通：尝试将派生类对象的容器作为基类对象的容器。例如：\n\
  \n点击此处查看代码\n\n```cpp\nvector<Shape> vs;\nvector<Circle> vc;\nvs = vc;          \
  \                  // 错误：需要 vector<Shape>\nvoid f(vector<Shape>&);\nf(vc);     \
  \                           // 错误：需要 vector<Shape>\n```\n\n\n\n但为什么不呢？毕竟，你说过，我可以将一个\
  \ `Circle` 转换为 `Shape`！实际上，你不能这样做 (§12.4.1)。你可以将一个 `Circle` 转换为 `Shape`，以及将一个 `Circle&`\
  \ 转换为 `Shape&`，但我们刻意禁用了 `Shape` 的赋值操作，这样你就不必去纳闷，如果你把一个带有半径的 `Circle` 放入一个没有半径的 `Shape`\
  \ 变量中会发生什么 (§12.3.1)。如果我们允许这样做，发生的情况将是所谓的*切片* (slicing)；也就是说，只有 `Circle` 的 `Shape`\
  \ 部分会被复制，产生的结果将是一个不完整的 `Shape`，这在被使用时会导致运行时错误。这等同于类对象中的整数截断 (§2.9)。\n\n所以我们尝试使用指针来重试：\n\
  \n点击此处查看代码图像\n\n```\nvector<Shape*> vps;\nvector<Circle*> vpc;\nvps = vpc;     \
  \                          // error: vector<Shape*> required\nvoid f(vector<Shape*>&);\n\
  f(vpc);                                     // error: vector<Shape*> required\n\
  ```\n\n再次，类型系统拒绝了。为什么呢？考虑一下 `f()` 可能会做什么：\n\n点击此处查看代码图像\n\n```\nvoid f(vector<Shape*>&\
  \ v)\n{\n        Shape s = new Rectangle{Point{0,0},Point{100,100}}\n        v.push_back(s);\
  \                 // put a Rectangle* into a vector<Shape*>\n}\n```\n\n## XX\n\n\
  显然，我们可以将一个 `Rectangle*` 放入 `vector<Shape**>>` 中，但不能放入 `Circle*` 中。毕竟，`Rectangle*`\
  \ 指向的并不是 `Circle`。然而，如果类型系统允许 `f(vpc)`，那恰恰就是它所做的。继承是一种强大而微妙的机制，而模板并不会隐式地扩展它的范围。使用模板来表达继承的方法有很多，但超出了本书的范围。只需记住，“`D`\
  \ 是一个 `B`”并不意味着对于任意模板 `C`，“`C<D>` 是一个 `C<B>`”——我们应该视为防止意外类型违规的保护。参见 PPP2.§25.4.4。\n\
  \n### 18.1.5 值模板参数\n\n显然，用类型对类进行参数化是有用的。那么，用“其他东西”对类进行参数化如何呢，例如整数值和字符串值？基本上，任何类型的参数都是有用的，但对*值模板参数*\
  \ (value template parameters) 的详细描述超出了本书的范围，因此我们只展示一个示例。考虑一种缓冲区类型：\n\n点击此处查看代码图像\n\
  \n```\ntemplate<typename T, int sz>\nclass Buffer {\npublic:\n        using value_type\
  \ = T;\n        const int size() { return sz; }\n        // ... useful operations\
  \ ...\nprivate:\n        T elem[sz];\n};\n```\n\n我们可以用此在需要的地方放置固定大小的缓冲区。例如：\n\n\
  点击此处查看代码图像\n\n```\nBuffer <int,1024> global;\n\nvoid use()\n{\n        Buffer<Message,12>\
  \ local;\n        // ...\n}\n```\n\n当我们不想使用自由存储（free store）时，像 `Buffer` 这样的类型是有用的。\n\
  \n### 18.2 通用 Vector\n\n当我们把 `Vector` 从一个 `double` 的类`Vector`”泛化为 `T` 的模板`Vector`”时，我们没有回顾\
  \ `push_back()`、`resize()` 和 `reserve()` 的定义。我们现在必须这样做，因为按照它们在 §17.8.2、 §17.8.3\
  \ 以及 §17.8.4 中的定义，它们所做的假设对于 `double` 是成立的，但对于我们希望作为 `Vector` 元素类型的所有类型（例如 `string`\
  \ 和 `Date`）则不成立：\n\n*   我们如何处理一个 `X` 没有默认值的 `Vector<X>`？\n*   我们如何处理带有可能抛出异常的拷贝操作符元素类型？\n\
  *   我们如何确保在用完元素后它们能被销毁？\n\n## AA\n\n我们必须解决这些问题吗？我们可以说：“不要尝试创建没有默认值类型的 `Vector`”以及“不要以会导致问题的方式对带有析构函数的类型使用\
  \ `Vector`”。对于一个旨在“通用”的设施来说，这种限制会让用户感到困扰，并给人一种设计者没有想清楚问题或并不真正关心用户的印象。通常情况下，这种怀疑是正确的，但标准库的设计者没有这样做。\n\
  \n为了解决这些问题，我们必须找到一种通过给用户提供选项来处理未初始化存储的方法。例如：\n\n```\nvector<Shape*> vps;\nvector<Circle*>\
  \ vpc;\nvps = vpc;                               // error: vector<Shape*> required\n\
  void f(vector<Shape*>&);\nf(vpc);                                     // error:\
  \ vector<Shape*> required\n```\n\n```cpp\nvoid f(vector<Shape*>& v)\n{\n       \
  \ Shape s = new Rectangle{Point{0,0},Point{100,100}}\n        v.push_back(s);  \
  \               // put a Rectangle* into a vector<Shape*>\n}\n```\n\n```cpp\ntemplate<typename\
  \ T, int sz>\nclass Buffer {\npublic:\n        using value_type = T;\n        const\
  \ int size() { return sz; }\n        // ... useful operations ...\nprivate:\n  \
  \      T elem[sz];\n};\n```\n\n```\nBuffer <int,1024> global;\n\nvoid use()\n{\n\
  \        Buffer<Message,12> local;\n        // ...\n}\n```\n\n### 18.2.1 分配器\n\n\
  首先，我们需要找到一种方法在操作未初始化存储时完成构造和析构。幸运的是，标准库提供了一个类名为 **allocator**，它提供了未初始化的内存。一个稍微简化的版本如下：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\nclass allocator {\npublic:\n     \
  \   // ...\n        T* allocate(int n);                           // 为 n 个 T 类型分配空间\n\
  \        void deallocate(T* p, int n);           // 释放从 p 开始的 n 个 T 类型\n};\n```\n\
  \n意料之中，**allocator** 正是我们实现 `Vector<T>::reserve()` 所需要的。我们从给 **Vector** 添加一个分配器参数开始：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<Element T, typename A = allocator<T>>\nclass Vector\
  \ {\n        A alloc;            // 使用 allocate 处理元素的内存\n        // ...\n};\n```\n\
  \n\n\n\n点击此处查看代码图像\n\n```cpp\ntemplate<Element T, Allocator A>\nvoid Vector<T,A>::reserve(int\
  \ newalloc)\n{\n        if (newalloc<=space)                                   //\
  \ 从不减少分配\n                return;\n        T* p = alloc.allocate(newalloc);    \
  \              // 分配新空间\n        uninitialized_move(elem,&elem[sz],p);     // 将元素移动到未初始化空间\n\
  \        destroy(elem,space);                                  // 销毁旧元素\n      \
  \  alloc.deallocate(elem,capacity());              // 释放旧空间\n        elem = p;\n\
  \        space = newalloc;\n}\n```\n\n我们通过在未初始化空间构造拷贝并销毁原始将元素移动到新空间。我们不能使用赋值，因为对于像\
  \ `string` 这样的类型，赋值假设目标区域已经初始化。我们使用标准库函数 `uninitialized_move()` 将元素移动到新分配的空间；`uninitialized_move(b,e,p)`\
  \ 将元素从范围 `b:e)` 移动到范围 `[p:p+(e−b))`。我们使用标准库函数 `destroy()` 调用旧拷贝的析构函数；`destroy(b,e)`\
  \ 调用范围 `[b:e)` 内元素的析构函数。在[第 21 章中，我们展示了更多操作左半开区间（如 `b:e)`）的算法。\n\n有了 `reserve()`，`Vector<T,A>::push_back()`\
  \ 就简单了：\n\n[点击此处查看代码图像\n\n```cpp\ntemplate<Element T, Allocator A>\nvoid Vector<T,A>::push_back(const\
  \ T& val)\n{\n        reserve((space==0) ?8:2*space);               // 获取更多空间\n\
  \        construct_at(&elem[sz],val);                     // 在末添加 val\n        ++sz;\
  \                                                        // 增加大小\n}\n```\n\n这使用了标准库函数\
  \ `construct_at()` 在未初始化空间的正确位置上构造新元素。\n\n同样，`Vector<T,A>::resize()` 也并不难：\n\n点击此处查看代码图像\n\
  \n```cpp\ntemplate<Element T, Allocator A>\nvoid Vector<T,A>::resize(int newsize,\
  \ T val = T())\n{\n        reserve(newsize);\n        if (sz<newsize)\n        \
  \        uninitialized_fill(&elem[sz],&elem[newsize],val);         // 将新增的元素初始化为\
  \ val\n        if (newsize<sz)\n                destroy(&elem[newsize],&elem[sz]);\
  \                           // 销毁多余原始元素\n        sz = newsize;\n}\n```\n\n注意，由于某些类型没有默认构造函数，我们再次提供了提供一个值作为新元素初始值的选项。`uninitialized_fill()`\
  \ 是 `uninitialized_move()` 的“近亲”，它重复地赋值同一个值，而不是从元素序列中移动。\n\n**CC**\n\n这里的另一个新点是在我们将缩容到一个较小的\
  \ `Vector` 的情况下，销毁“多余元素”。将析构函数想象成将一个类型对象转回“原始内存”。相反，构造函数将“原始内存”转变为一个类型对象。\n\n**XX**\n\
  \n“玩弄分配器”是非常高级的内容，而且棘手。在你准备好成为专家之前，先不管它吧。\n\n### 18.3 范围检查与异常\n\n我们回顾目前为止的 `Vector`，并发现（恐怖地？）访问并没有进行范围检查。`operator[]`\
  \ 的实现仅仅是\n\n点击此处查看代码图像\n\n```cpp\ntemplate<Element T,Allocator A>\nT& Vector<T,A>::operator[](int\
  \ n)\n{\n       return elem[n];\n}\n```\n\n因此，考虑：\n\n点击此处查看代码图像\n\n```cpp\nVector<int>\
  \ v(100);\nv[−200] = v[200];              // 哎！\nfor (int i; cin>>i; )\n       \
  \ v[i] = 999;                // 破坏任意内存位置\n```\n\n这段代码可以编译并运行，访问了不属于我们 `Vector` 的内存。这可能意味着大麻烦！在实际程序中，这种代码是不可接受的。让我们尝试改进\
  \ `Vector` 来处理这个问题。简单的方法是添加一个带检查的操作的操作，称为 `at()`：\n\n点击此处查看代码图像\n\n```cpp\nstruct\
  \ out_of_range { /* ... */                // 用于报告范围访问错误的类\n\ntemplate<Element T,\
  \ Allocator A = allocator<T>>\nclass Vector {\n        // ...\n        T& at(int\
  \ n);                                               // 检查访问\n        const T& at(int\
  \ n) const;                            // 检查访问\n\n        T& operator[](int n);\
  \                                  // 未检查访问\n        const T& operator[](int n)\
  \ const;               // 未检查访问\n        // ...\n};\n\ntemplate<Element T, Allocator\
  \ A>\nT& Vector<T,A>::at(int n)\n{\n        if (n<0 || n>=sz)\n               throw\
  \ out_of_range();\n        return elem[n];\n}\n\ntemplate<Element T, Allocator A>\n\
  T& Vector<T,A>::operator[](int n)\n{\n        return elem[n];\n}\n```\n\n因此，考虑：\n\
  \n点击此处查看代码图像\n\n```cpp\nvoid print_some(Vector<int>& v)\n{\n        int i = −1;\n\
  \        while(cin>>i && i!=−1)\n                try {\n                       \
  \ cout << \"v[\" << i << \"]==\" << v.at(i) << \"\\n\";\n                }\n   \
  \             catch(out_of_range) {\n                        cout << \"bad index:\
  \ \" << i << \"\\n\";\n                }\n}\n```\n\n在这里，我们使用 `at()` 获取检查访问，并在非法访问时捕获\
  \ `out_of_range`。\n\n#### 18.3.1 旁论：设计考虑\n\n**CC**\n\n到为止还好，但我们为什么不直接将范围检查添加到 `operator[]()`\
  \ 中呢？嗯，`std::vector` 提供了检查的 `at()` 和可能的未检查 `operator[]()`，如所示。让我们尝试解释为什么这是有意义的。基本上有四个理由：\n\
  \n1. *兼容性*：在 C++ 有异常很久以前人们就已经在使用未检查的下标操作了。\n2. *效率*：你可以在最优快的未检查访问运算符之上构建检查访问运算符，但你无法在检查访问运算符之上构建最优快的访问运算符。\n\
  3. *约束条件*：在某些环境中，异常是不可接受的。\n4. *可选检查*：标准并没有说不能对 `vector` 进行范围检查，所以如果你想要检查，请使用支持检查的实现，例如来自\
  \ `PPP_support` 的，但最好是标准库提供者支持的。\n\n##### 18.3.1.1 兼容性\n\n\n\n\n人们真的、非常不喜欢看到旧代码崩溃。例如，如果你有百万行代码，为了正确使用异常而重构所有代码，可能是一件非常昂贵的事。我们可以争辩，为了额外的工作会让代码变得更好，但我们并不是那些付出代价（无论时间还是金钱）的人。此外，现有代码的维护者通常认为，未检查的代码在原则上是不安全的，但他们特定的代码已经经过测试并使用了多年，所有的\
  \ bug 已经被发现。我们对这一观点表示怀疑，但同样，任何没有对真实代码做过此类决策的人都不应该过分主观的判断。自然，在 `vector` 被引入 C++ 标准之前，没有任何使用标准库\
  \ `vector` 的代码，但有数百万行代码使用了非常类似的 `vector`，它们（由于是标准前的）没有使用异常。其中许多代码后来被修改为使用标准库。\n\n\
  ### 18.3.1.2 效率\n\n**AA**\n\n是的，范围检查在极端情况下可能会成为负担，例如网络接口的缓冲区和高性能科学计算中的矩阵。然而，在我们大多数人花费大部分时间的这类“普通计算”中，范围检查的成本很少引起担心。因此，只要可能，我们建议并使用带范围检查的\
  \ `vector` 实现。通常情况下，尝试优化程序的每一个细节是一个错误。这会导致代码变得脆弱，并分散了对程序整体进行优化的注意力。\n\n### 18.3.1.3\
  \ 限制\n\n反对使用异常的论点适用于某些程序员和某些应用程序。事实上，它适用于大量的程序员，不应该被轻率忽略。然而，如果你是在一个不涉及硬实时（`PPP2.Ch25.2.1`）的环境中启动一个新程序，请优先选择基于异常的错误处理和带范围检查的\
  \ `vector`。\n\n### 18.3.1.4 可选检查\n\n**AA**\n\nISO C++ 标准简单说明，越范围的 `vector` 访问不保证具有任何特定语义，并且应该避免此类访问。当程序尝试越范围访问时抛出异常是完全符合标准的。因此，如果你希望\
  \ `vector` 抛出异常，并且不需要被特定应用程序的前三个原因困扰，请使用带范围检查的 `vector` 实现。这正是我们在本书中所做的。简而言之，现实世界的设计可能比我们预想的要混乱，但是有应对方法的。\n\
  \n### 18.3.2 模块 PPP_support\n\n与我们的 `Vector` 一样，大多数 `std::vector` 实现都不保证对下标运算符（`[\
  \ ]`）进行范围检查，但提供了检查的 `at()`。那么，我们程序中的那些 `std::out_of_range` 异常是从哪里来的？基本上，我们从 `18.3.1`\
  \ 中选择了“选项 4”：`vector` 实现没有义务对 `[ ]` 进行范围检查，但禁止这样做，因此我们安排了检查。你可能使用的是我们来自 `PPP_support`\
  \ 的版本。它以很小的代价减少了错误和调试时间。\n\n```cpp\nexport module PPP_support;\n\nimport <vector>;\n\
  import <stdexcept>;\n\nexport namespace PPP {\n    template <typename T>\n    class\
  \ Checked_vector {\n        std::vector<T> v;\n    public:\n        Checked_vector(const\
  \ std::vector<T>& v) : v(v) {}\n        T& operator[](size_type i) {\n         \
  \   if (i >= v.size()) {\n                throw std::out_of_range(\"Checked_vector::[]\
  \ out of range\");\n            }\n            return v[i];\n        }\n       \
  \ const T& operator[](size_type i) const {\n            if (i >= v.size()) {\n \
  \               throw std::out_of_range(\"Checked_vector::[] out of range\");\n\
  \            }\n            return v[i];\n        }\n        T& at(size_type i)\
  \ {\n            if (i >= v.size()) {\n                throw std::out_of_range(\"\
  Checked_vector::at out of range\");\n            }\n            return v[i];\n \
  \       }\n        const T& at(size_type i) const {\n            if (i >= v.size())\
  \ {\n                throw std::out_of_range(\"Checked_vector::at out of range\"\
  );\n            }\n            return v[i];\n        }\n    };\n}\n```\n\n\n\n\n\
  ```cpp\nvoid suspicious(int s, int x)\n{\n        int* p = new int[s];         \
  \  // acquire memory\n        // ...\n        delete[] p;                      \
  \ // release memory\n}\n```\n\n正如我们在 §15.4.5 中看到的，并不总是容易就能记得要释放内存。当我们向画面中引入异常时，资源泄漏可能会变得常见；而这仅仅是因为无知或某些疏忽心。特别是，我们对像\
  \ `suspicious()` 这样显式使用 `new` 并将生成的指针赋值给局部变量的代码持有极大的怀疑态度。为了编写可靠的软件，我们必须让资源（如内存）的释放变得隐式。这样做也能让代码编写变得更加容易。\n\
  \n**CC**\n\n我们将负责释放资源的对象（例如 `vector`）称为其负责资源的*所有者*（owner）或*句柄*（handle）。\n\n### 18.4.1\
  \ 潜在的资源管理问题\n\n**XX**\n\n对看似无害的指针赋值产生怀疑的原因之一是，像这样的点击此处查看代码图像\n\n```cpp\nint* p =\
  \ new int[s];             // acquire memory\n```\n\n很难验证 `new` 是否有一个对应的 `delete`。至少\
  \ `suspicious()` 包含一个 `delete[] p;` 语句，它可能会释放内存，但让我们想象几种可能导致该释放未发生的情况。我们可以在 `suspicious()`\
  \ 的 `...` 部分放入什么来导致内存泄漏呢？我们发现的这些问题的示例应该引起你的思考，并让你对这类代码产生怀疑。它们还应该让你欣赏这种代码的简单而强大的替代方案。\n\
  \n考虑以下：\n\n点击此处查看代码图像\n\n```cpp\nvoid suspicious(int s, int x)\n{\n        int*\
  \ p = new int[s];                    // acquire memory\n        // ...\n       \
  \ if (x<0)\n                p=q;                                 // make p point\
  \ to another object\n        if (x==0)\n                return;                \
  \             // we may return\n        if (0<x)\n                p[x] = v.at(x);\
  \                   // subscripting may throw\n        // ...\n        delete[]\
  \ p;                               // release memory\n}\n```\n\n这段代码永远不会删除 `p`；它会泄漏内存。原因取决于\
  \ `x` 的值。显然，我们永远不会刻意写这种混乱的代码，但所说明的这三种搞砸的方式会在真实世界的代码中出现，那里代码的函数更长，控制结构更复杂。通常，问题不在原始代码中，而是多年后由某个维护代码的人误插入的。\n\
  \n当人们第一次遇到这个问题的异常抛出版本时，他们倾向于将其视为异常的问题，而不是通用的资源管理问题。由于错误地分类了根源，他们想出了捕获异常的解决方案：\n\n\
  点击此处查看代码图像\n\n```cpp\nvoid suspicious(int s, int x)                 // messy code\n\
  {\n        int* p = new int[s];              // acquire memory\n        vector<int>\
  \ v;\n        // ...\n        try {\n                if (x)\n                  \
  \       p[x] = v.at(x);     // subscripting may throw\n                // ...\n\
  \        }\n        catch (...) {                         // catch every exception\n\
  \                delete[] p;                  // release memory\n              \
  \  throw;                        // re-throw the exception\n        }\n        //\
  \ ...\n        delete[] p;                          // release memory\n}\n```\n\n\
  这以增加某些代码为代价解决了问题。换句话说，这种解决方案是丑陋的；更糟糕的是，它并不通用。考虑获取更多资源：\n\n```cpp\nvoid suspicious(int\
  \ s)\n{\n         int* p = new T[s];\n         // ...\n         int* q = new T[s];\n\
  \         // ...\n         delete[] p;\n         // ...\n         delete[] q;\n\
  }\n```\n\n**XX**\n\n`try-catch` 技术在这个示例中也有效，但我们需要几个 `try` 块，而且代码是重复且丑陋的。我们不喜欢重复且丑陋的代码，因为“重复”意味着代码是维护隐患，而“丑陋”意味着代码难以写对、难以阅读且是维护的隐患。特别是，如果我们尝试用\
  \ `try-catch` 来处理资源泄漏，我们就必须记住一致地使用 `try-catch`。这不是一个好主意。经验表明，我们有时会忘记。忘记释放资源很容易；问问任何管理员吧！释放必须是隐式的且有保障的。\n\
  \n大量的 `try` 块是设计糟糕的标志，也是错误处理可能问题的指示。我们必须——也可以做得更好。\n\n#### 尝试一下\n\n在这个最后的示例中添加 `try`\
  \ 块，以确保在可能抛出异常的所有情况下，所有资源都被正确释放。\n\n我们使用 `new/delete` 示例是因为它容易理解和实验。然而，大多数资源泄漏的示例并不容易发现。考虑一个在许多程序中仍然可以找到旧式示例：\n\
  \n点击此处查看代码图像\n\n```cpp\nvoid old_style()\n{\n        FILE* output = fopen(\"myfile\"\
  ,\"r\");                   // acquire\n        fprintf(output,\"Hello, world!\\\
  n\");                 // print to file\n        // ...\n        fclose(output);\n\
  }\n```\n\n这里使用 C++ 标准库函数 `fopen()` 和 `fclose()` 来打开和关闭文件。再次，`...` 部分可能会退出函数而不关闭文件。如果是这样，输出缓冲区可能永远不会刷新，导致我们不知道为什么没有输出。\n\
  \n### 18.4.2 资源获取初始化 (RAII)\n\n幸运的是，我们不需要到处布满复杂的 `try catch` 语句来处理潜在的资源泄漏。考虑 `suspicious()`\
  \ 和 `old_style()` 的结合：\n\n点击此处查看代码图像\n\n```cpp\nvoid user(int s)\n{\n        vector<T>\
  \ p(s);\n        vector<T> q(s);\n        ifstream in{\"myfile\"};\n        // ...\n\
  }\n```\n\n**CC**\n\n这样更好。更重要的是，它*显然更好*。资源（这里是堆内存和文件句柄）通过构造函数获取并在相应的析构函数中释放。我们在解决向量内存问题时，实际上解决了这个特定的“异常问题”。该解决方案是通用的；适用于所有类型的资源：在对象的构造函数中获取资源，并在相应的析构函数中释放。资源的示例包括字符字符串、数据库事务、锁、套接字和\
  \ I/O 缓冲区（`iostream` 为你处理）。\n\n考虑上面的示例。无论我们以什么方式离开 `user()`，`p`、`q` 和 `in` 的析构函数都会被相应调用。这一通用规则成立：当执行线程离开作用域时，每个完全构造的对象和子对象的析构函数都会被调用。对象在构造函数完成时被认为已构造。探索这两个语句的详细含义可能会头疼，但它们仅仅意味着构造函数和析构函数会在需要时调用。\n\
  \n**AA**\n\n特别是，当作用域内需要非常量存储时，使用 `vector` 而不是显式的 `new` 和 `delete`。\n\n最后，考虑一个为了测试错误处理而人为构造的示例：\n\
  \n\n\n\n\n```\nvoid test()\n{\n        string name;\n        cin>>name;\n      \
  \  ifstream in {name};                                                         \
  \ // §9.3\n        if (!in)\n                error(\"couldn't open \",name);\n\n\
  \        vector<string> v {\"hello\"};\n        for (string s; in>>s; )\n      \
  \          v.push_back(s);\n        v[3] += \"odd\";\n\n        Simple_window win;\
  \                                                       // Chapter 10\n        auto\
  \ ps = make_unique<Shape>(read_shape(cin));         // §18.5.2, §12.2\n        Smiley_face\
  \ face {Point{0,0},20};\n        win.attach(face);\n        // ...\n}\n```\n\n真实世界中的代码比这要复杂得多：\n\
  \n- 想象一下，如果使用没有析构函数的类型来重写这个 `test()` 函数需要付出什么代价。\n- 想象一下，在不使用异常的情况下重写这个 `test()`\
  \ 并捕获且正确报告所有可能的错误需要付出什么代价。\n\n注意，我们在打开文件时并没有依赖异常。我们本可以这样做，但无法打开文件并不是什么异常情况，因此我们在本地处理了这种可能性。\n\
  \n### 18.4.3 资源管理保证\n\n**CC**\n\n当我们离开一个函数（或仅仅是离开一个作用域）时，我们可以提供什么样的保证来使资源管理易于理解？为了能够理性地思考此类问题，请考虑这些基本概念：\n\
  \n- *基本保证（The basic guarantee）*：函数要么成功，要么抛出异常且不泄露任何资源。程序中所有我们期望从异常 `throw`（或任何其他影响资源的错误形式）中恢复的代码，都应该提供基本保证。所有标准库代码都提供了基本保证。\n\
  - *强保证（The strong guarantee）*：函数在基本保证的基础上，还确保在失败后所有可观测值（所有非函数局部值）都与调用函数时相同。当我们编写一个函数时，强保证是理想状态：要么函数成功完成了它要求的所有工作，要么除了抛出异常以指示失败外，其他什么都没有发生。\n\
  - *不抛出异常保证（The no-throw guarantee）*：除非我们可以在无任何失败或抛出异常风险的情况下执行简单操作，否则我们将无法编写满足基本保证或强保证的代码。幸运的是，\
  \ C++ 语言中几乎所有的内置设施都提供了不抛出异常保证：它们无法抛出异常。要避免抛出异常，只需避免 `throw` 本身、`new` 以及对引用类型的 `dynamic_cast`\
  \ 即可。主要的危险是导致所需资源未释放的简单返回。\n\n基本保证和强保证对于思考程序的正确性最有帮助。RAII 对于简单且高效地实现根据这些理想编写的代码至关重要。\n\
  \n### 18.4.4 用于 Vector 的 RAII\n\n作为资源管理的一个示例，让我们看看如何为 `Vector` 赋值提供保证。正如我们在 §17.8\
  \ 中看到的，`Vector` 内存管理和元素初始化的关键在于 `reserve()` 操作，因此我们必须从这里开始。那个 `reserve()` 在编写时没有考虑异常。然而，该\
  \ `reserve()` 可能会在分配内存时失败（抛出异常），导致 `Vector` 的内存出现问题。我们可以尝试添加 `try-` 块，但 18.4.1 这样会增加复杂性。更好的解决方案是回退并意识到\
  \ `Vector` 的内存是一个资源，即：18.4.2 这里的代码展示了：\n\n```cpp\ntemplate<typename T, typename\
  \ A = allocator<T>>\nstruct Vector_rep {\n        A alloc;                  // 分配器\n\
  \        int sz;                     // 元素数量\n        T* elem;                 //\
  \ 分配起始位置\n        int space;               // 分配空间\n\n        Vector_rep(const A&\
  \ a, int n)\n                : alloc{ a }, sz{ n }, elem{ alloc.allocate(n) }, space{\
  \ n } { }\n        ~Vector_rep() {}\n};\n```\n\n`Vector_rep` 处理的是内存而不是（类型）对象。我们的\
  \ `Vector` 实现可以使用它来持有目标类型的对象。基本上，`Vector`（处理类型元素）仅仅是 `Vector_rep`（处理原始内存）的一个方便接口：\n\
  \n```cpp\ntemplate<typename T, typename A = allocator<T>>\nclass Vector {\n    \
  \    Vector_rep<T,A> r;\npublic:\n        Vector() : r{A{},0} { }\n        explicit\
  \ Vector(int s) :r{A{},s}\n        {\n                 for (int i = 0; i < r.sz;\
  \ ++i)\n                         r.elem[i] = 0;              // 元素初始化\n        }\n\
  \        // ...\n};\n```\n\n我们必须修改所有成员函数以使用 `Vector_rep`。特别是，可以将 §18.2.1 中的 `reserve()`\
  \ 重写为更简单且正确的版本：\n\n```cpp\ntemplate<typename T, typename A>\nvoid Vector<T, A>::reserve(int\
  \ newalloc)\n{\n        if (newalloc <= r.space)                               //\
  \ 从不减少分配\n                return;\n        Vector_rep<T, A> b{ r.alloc,newalloc\
  \ };                              // 分配新空间\n        uninitialized_move(r.elem, r.elem+r.sz,\
  \ b.elem);              // 移动\n        destroy(r.elem, r.elem + r.sz);         \
  \                                     销毁旧元素\n        swap(r, b);               \
  \                                // 交换表示\n}\n```\n\n我们使用标准库函数 `uninitialized_move()`\
  \ 和 `destroy()` 完成大部分工作。当我们离开 `reserve()` 时，如果拷贝操作成功，`Vector_rep` 的析构函数会自动释放旧内存。相反，如果退出是由移动操作抛出异常引起的，则新分配的空间将被释放。`swap()`\
  \ 函数是一个交换两个对象的标准库算法。\n\n\n\n\n\n```\ntemplate<typename T, typename A>\nVector<T>&\
  \ Vector::operator=(const Vector<T>& arg)\n{\n        auto tmp = arg;          \
  \      // copy all elements\n        swap(*this,arg);                // then swap\
  \ (Vector handles): strong guarantee\n        return *this;\n}\n```\n\n我们首先拷贝，然后进行交换。这意味着对于\
  \ `v1=v2`，`v1` 获得 `v2` 的元素，而 `v1` 原有的旧元素（现在位于 `tmp` 中）会在退出 `operator=()` 时被销毁。如果拷贝过程中抛出异常，我们永远不会执行\
  \ `swap`。因此，从拷贝操作抛出的异常对 `v1` 或 `v2` 产生任何影响。也就是说，我们的 `operator=()` 提供了强保证（strong\
  \ guarantee）。\n\n`Vector` 的 `swap()` 只是移动了 `Vector` 对象中的指针（§7.4.5），因此它提供了不异常保证（no-throw\
  \ guarantee）。如果没有指针和移动，我们将无法提供任何有用的保证。\n\n我们甚至可以把 `operator=` 写得更简单：\n\n点击此处查看代码图片\n\
  \n```\ntemplate<typename T, typename A>\nVector<T>& Vector::operator=(const Vector<T>\
  \ arg)\n{\n        swap(*this,arg);                // then swap (Vector handles):\
  \ strong guarantee\n        return *this;\n}\n```\n\n按值传递（§7.4.3）为我们完成了拷贝。\n\n但是\
  \ `Vector::operator=()` 的优化版本呢？该版本在空间足够时会直接将元素拷贝到目标位置（§17.8.5）：\n\n点击此处查看代码图片\n\n\
  ```\ntemplate<typename T, typename A>\nVector<T>& Vector::operator=(const Vector<T>&\
  \ arg)\n{\n        if (arg.size()<=size()) {                                   \
  \          // enough space; copy directly\n                move(arg.r.elem,arg.r.elem+arg.size(),r.elem);\n\
  \                destroy(r.elem+arg.size(),r.elem+size());          // destroy surplus\
  \ elements\n        }\n\n        auto tmp = arg;                // copy all elements\n\
  \        swap(*this,arg);                // then swap (Vector handles): strong guarantee\n\
  \        return *this;\n}\n```\n\n由于我们使用了移动，因此我们只能提供基本保证（basic guarantee）：在抛出异常之前，元素可能已经被覆盖了。此外，这个优化的\
  \ `operator=` 的代码大小是优雅的“纯 `swap()`”版本的两倍。这种优化值得付出努力并牺牲强保证吗？对于 `vector` 来说，答案是肯定的：性能差异可能非常显著，而且在许多重要的性能敏感型应用中，经常会对相同或更小的\
  \ `vectors` 进行赋值。例如，考虑将矩阵元素存储在 `vector` 中的矩阵计算。因此，`std::vector` 的 `=` 是经过优化的。如果你需要强保证，可以很容易地写一个函数来实现：\n\
  \n点击此处查看代码图片\n\n```cpp\ntemplate<typename T>\nstrong_assign(Vector<T>& target, const\
  \ Vector<T> arg)\n{\n        swap(target,arg);            // then swap (vector handles):\
  \ strong guarantee\n}\n```\n\n不要在没有理由的情况下优化，除非你非常确定这种优化对于重要代码是值得的。\n\n### 18.5 资源管理指针\n\
  \n指针有很多常见的用途，例如：\n\n* 从函数返回大型对象\n* 将接口作为参数传递给多态对象（面向对象编程）\n* 向算法传递容器元素的位置（第 21 章）\n\
  * 实现高级（易于使用、高效、RAII 等）类型，如 `vector`\n\n为了应对这些情况，我们需要区分指针的不同用途。\n\n* 指针在何时是必要的？我们通常有更好的替代方案（§16.4,\
  \ §18.5.1）\n* 指针在何时仅标识一个对象？\n* 指针在何时标识一个对象序列？不要使用内置指针来标识元素序列；它们并不知道指向多少个元素（§16.1）。请使用容器（第\
  \ 19 章）或 `span`（§16.4.1）。\n* 指针在何时代表所有权（即需要删除）？（§18.5.2, §18.5.3）\n\n在这里，我们将考虑这些情况中的第一和最后。\n\
  \n### 18.5.1 移动返回\n\n将大量信息放在自由堆上并返回指针的技术很常见。但有必要吗？在现代 C++ 中，我们通常可以按值返回，编译器会为我们移动对象。这通常更高效、更安全。\n\
  \n考虑以下代码：\n\n```vector<int> get_vector()\n{\n    vector<int> v(100, 1);\n    return\
  \ v;\n}\n```\n\n在这种情况下，`vector` 是移动的而不是拷贝，所有权得到了高效转移。这比返回指针好得多。\n\n如果我们确实需要返回指针，应该使用\
  \ `unique_ptr`：\n\n```cpp\nunique_ptr<vector<int>> get_vector()\n{\n    return make_unique<vector<int>>(100,\
  \ 1);\n}\n```\n\n`unique_ptr` 会管理 `vector` 的内存，并在它离开作用域时进行删除。这比使用原始指针安全且方便得多。\n\n\
  ### 18.5.2 unique_ptr\n\n`unique_ptr` 是一种所有其所指向对象的智能指针。它不能被拷贝，但可以移动。这确保了任何时候都只有一个所有者。\n\
  \n```cpp\nunique_ptr<int> p1 = make_unique<int>(10);\nunique_ptr<int> p2 = move(p1);\
  \ // p1 现在为空，p2 拥有该对象\n```\n\n`unique_ptr` 是 C++ 中管理内存的一个非常有用的工具。它可以帮助防止内存泄漏，并确保对象被正确删除。\n\
  \n\n\n\n\n一个 `unique_ptr` 非常像普通的指针，但它有一个重大的限制：你不能将一个 `unique_ptr` 赋值给另一个，以获得两个指向同一个对象的\
  \ `unique_ptr`。必须如此，否则可能会对于由哪一个 `unique_ptr` 拥有指向的对象并负责对其进行 `delete` 操作产生混义。例如：\n\
  \n点击此处查看代码图像\n\n```\nvoid no_good()\n{\n        unique_ptr<X> p = make_unique<X>();\n\
  \        unique_ptr<X> q = p;                       // error: 幸运的是\n        // ...\n\
  } // 在这里 p 和 q 都会 delete X\n```\n\n如果你想要一个既能保证删除又可以复制的“智能”指针，请使用 `shared_ptr` (§18.5.3)。不过，这是一个更重量级的解决方案，它涉及一个引用计数（use\
  \ count），以确保最后一个被销毁的拷贝会销毁所指向的对象。\n\n相比之下，`unique_ptr` 与普通指针相比没有开销。\n\n除了作为一种转移所有权的方式外，`unique_ptr`\
  \ 还可以用于在抛出异常时保证删除：\n\n点击此处查看代码图像\n\n```\nvoid trouble(int n)\n{\n        int* naked\
  \ = new int[n];\n        auto covered = make_unique<int[]>(n);\n        // ... 在此处某处返回或抛出异常\
  \ ...\n        delete[] naked;\n}\n```\n\n`make_unique` 防止了可能的内存泄漏，但“裸露 `new`”并不会。\n\
  \n### CC\n\n最后，`unique_ptr` 可以用来代替“裸”指针来表示所有权。考虑 §15.5。在其中，我们使用析构函数来处理元素和持有它们的内存的删除。使用\
  \ `unique_ptr` 我们可以让这变得隐式，从而消除写错析构函数的可能性：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<Elem\
  \ T>\nclass Vector {\npublic:\n        Vector(int s) :sz{s}, elem{std::make_unique<T[]>(s)}\
  \ { }         //构造一个 Vector\n        T& operator[](int i) { return elem[i]; }  \
  \                                  // 元素访问：下标索引\n        int size() { return sz;\
  \ }\n        // ...\nprivate:\n        int sz;                                 \
  \      // 元素的数量\n        std::unique_ptr<T[]> elem;       // 指向元素的指针\n        int\
  \ alloc;\n};\n```\n\n为 `Vector` 生成的析构函数 (§15.5.1) 会调用 `elem` 的析构函数。\n\n为什么从一开始没有使用那种简化方法呢？我们想要展示资源管理类是如何构造的，而且（当然地？）`unique_ptr`\
  \ 的构造使用了与我们为 `Vector` 展示的完全相同的技巧和基础语言特性。\n\n### 18.5.3 Shared_ptr\n\n如果你需要指向一个对象的多个指针，并且不清楚哪个指针应该被\
  \ `delete` 该怎么办？我们可以尝试通过这样分配对象：使其“寿命超过”所有指向它的指针来避免这种情况。这通常是理想的，可以通过让对象位于所有指针的外部作用域来实现。然而，在许多情况下，很难简单且可靠地实现这一点。在这种情况下，我们可以使用标准库的\
  \ `shared_ptr`。它的用法与 `unique_ptr` 类似：\n\n点击此处查看代码图像\n\n```cpp\nshared_ptr<Shape>\
  \ read_shape(istream& is)           // 伪代码\n{\n        // ... 读取各种形状 ...\n     \
  \   // ... 如果我们读到了 Circle ...\n                 return make_shared<Circle>(center,radius);\n\
  }\n```\n\n然而，`shared_ptr` 与 `unique_ptr` 的不同在于它允许许多个拷贝。它保留一个引用计数，即指向给定对象的 `shared_ptr`\
  \ 数量，当该引用计数变为零时，`shared_ptr` 的析构函数会删除所指向的对象。这有时在口俗中被称为“最后一个离开的人关灯”。\n\n请注意 `shared_ptr`\
  \ 仍然是一个指针：你需要使用 `*` 或 `−>` 来访问它的对象，并且你可以创建循环引用：\n\n点击此处查看代码图像\n\n```cpp\nstruct\
  \ Slink {\n        string name;\n        shared_ptr<Slink> next;\n};\n\nauto p =\
  \ make_shared<Slink>(\"Friday\",nullptr);\nauto q =make_shared<Slink>(\"viernes\"\
  ,p);\np−>next = q;\n```\n\n这两个 `Slink` 将“永远”存在。要打破这种循环，你需要标准库的 `weak_ptr`，但如果可以的话，最好干脆不要创建这样的循环。\n\
