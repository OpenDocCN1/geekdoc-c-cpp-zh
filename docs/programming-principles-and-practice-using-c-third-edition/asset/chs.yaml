  \n为了查看未捕获异常错误的样式，请运行一个使用了 `error()` 但没有捕获任何异常的小程序。\n\n## 4.7 避免和发现错误\n\n我们知道，程序的第一次尝试不会完美。所以我们必须提高发现问题并修复它们的能力（§4.7.1,\
  \ §4.7.2, §4.7.4）。其中很大一部分是组织代码，让 bug 难以隐藏（§7.3, §4.7.3）。\n\n### 4.7.1 估计\n\n假设你写了一个执行简单计算的程序，例如计算六边形的面积。你运行它，它给出的面积\
  \ `-34.56`。你只知道这是错的。为什么？因为没有任何形状有负面积。所以，你修复了那个 bug（无论它是什么），得到了 `21.65685`。这正确吗？这很难说，因为我们通常脑子里并不记得六边形的面积公式。在交付一个产生荒谬结果的程序让自己难脸之前，我们必须做的只是检查答案是否合理。在这种情况下，这很容易。六边形非常像方形。我们在纸上随手画了一个正六边形，肉眼估算它大约是一个\
  \ `3-by-3` 正方形的大小。这样一个正方形的面积是 `9`。糟糕，我们的 `21.65685` 就不可能是对的！于是我们再次检查程序，得到了 `10.3923`。现在，这可能是正确的！\n\
  \n要点在于，除非我们对正确答案心中有所数，否则我们无法判断结果是否合理。*估计*是一门结合了常识和简单算术的艺术。\n\n### 4.7.2 调试\n\n当你写了一个程序时，它会有错误。小程序在第一次尝试时就能编译并运行正确。但如果对于任何完全微不足道的程序发生了这种情况，你初应该非常怀疑。如果它真的第一次运行正确，去告诉你的朋友并庆祝吧——因为这种情况并不会每年发生。\n\
  \n\n\n\n所以，当你写完一些代码后，必须找到并删除错误。这个过程通常被称为*调试*（debugging），而错误被称为*虫*（bugs）。*bug*这个词通常被认为源于硬件故障，在计算机还是填满整个房间的真空管和继电器的时代，电子设备中是由昆虫引起的故障。有几个人被认为是发现并将*bug*一词应用于软件错误的功功者。其中最著名的是格蕾丝·默里·霍珀（Grace\
  \ Murray Hopper），COBOL 编程语言的发明者（PPP2.§22.2.2.2）。无论是谁在 50 多年前发明了这个术语，*bug*都是一个形象生动且无处不在的词。刻意寻找并消除错误的活动被称为*调试*。\n\
  \n调试的工作原理大致如下：\n\n[1] 让程序通过编译。\n\n[2] 让程序通过链接。\n\n[3] 让程序实现它应该实现的功能。\n\n基本上，我们会一遍又一遍重复这个序列：对于非常大的程序，要重复数百次、数千次，甚至多年来反复复始。每当某个部分无法正常工作时，我们都必须找到问题产生的原因并修复它。我认为调试是编程中最枯燥、最浪费时间的一个，因此在设计和编程阶段，我会尽尽努力减少寻找\
  \ bug 的时间。而其他人发现这种寻找过程是刺激的，是编程的精髓——它可以像任何视频游戏一样让人上瘾，让程序员连续坐在电脑前几天几夜（我也可以从个人经验证明这一点）。\n\
  \n## XX\n\n以下是**不**正确的调试方法：\n\n点击此处查看代码图像\n\n```\nwhile (the program doesn't appear\
  \ to work){       // 伪代码\n         随机浏览程序，寻找某些“看起来奇怪”的地方\n         将其修改得看起来更好一些\n\
  }\n```\n\n## AA\n\n我们为什么要费心提到这一点呢？这显然是一个糟糕的算法，几乎没有成功的保证。遗憾的是，这种描述仅仅是许多人在深夜、当感到特别迷茫和无所适从、在尝试了“其他所有方法”后所做行为的浅微写照。调试的关键问题是：\n\
  \n*我如何知道程序是否真的运行正常？*\n\n如果你无法回答这个问题，你将面临漫长而枯燥的调试过程，而且你的用户很可能会面临一些挫败。我们反复回到这一点，是因为任何有助于回答该问题的因素都能减少调试工作，并帮助产生正确且可维护的程序。基本上，我们希望设计程序，让\
  \ bug 无处遁形。这通常要求过高，但我们的目标是结构化程序，以尽可能减少错误概率，并最大限地发现那些出现的错误。\n\n### 4.7.2.1 实用调试建议\n\
  \n## AA\n\n在写第一行代码之前就开始考虑调试。一旦你写了大量代码，再尝试简化调试就太晚了。\n\n决定如何报告错误：“在`main()`中使用`error()`并捕获`exception`”\
  \ (§4.6)将是本书的默认答案。\n\n## AA\n\n让程序易于阅读，这样你才有机会发现 bug：\n\n*   良好地注释你的代码。这不仅仅意味着“添加大量注释”。不要用英语表达那些用代码表达得清楚的内容。相反，你应该在注释中——尽可能清晰且简洁地——说明代码中无法表述清楚的内容：\n\
  \n    *   程序的名称\n    *   程序的目的\n    *   谁在什么时候编写了这些代码\n    *   版本号\n    *   复杂的代码片段应该做什么\n\
  \    *   整体设计思想是什么\n    *   源代码是如何组织的\n    *   对输入做出了哪些假设\n    *   代码中哪些部分仍然缺失，哪些情况仍未处理\n\
  \    *   对辅助材料的引用（例如，解释所用算法的书籍）\n\n*   使用有意义的名字。\n    *   这不仅仅意味着“使用长变量名”。\n\n*\
  \   使用一致的代码布局。\n    *   你的 IDE 会尝试提供帮助，但它不能包办一切，你才是负责任的人。\n    *   本书使用的风格是一个合理的起点。\n\
  \n*   将代码拆分为较小的函数，每个函数表达一个逻辑动作。\n    *   尽量避免长度超过一两页的函数；大多数函数会比短得多。\n\n*   避免复杂的代码序列。\n\
  \    *   尽量避免嵌套循环、嵌套的`if`-语句、复杂的条件等。遗憾的是，你有时需要这些，但记住，复杂的代码是 bug 最容易隐藏的地方。\n\n* \
  \  在可能的情况下使用库设施而不是自己的代码。\n    *   库可能比你在忙于解决主要问题时产出的替代方案更经过周密考虑、经过更好的测试。\n\n现在这些还很抽象，但随着我们的进行，我们将向你展示一个又一个的例子。\n\
  \n## AA\n\n让程序通过编译。显然，编译器是你这里最好的帮助。它的错误信息通常很有用——尽管我们总是希望有更好的信息——除非你是个真正的专家，否则请假设编译器总是正确的；如果你是真正的专家，那么这本书就不是为你写的。偶尔，你会觉得编译器强制的规则是愚蠢且没必要的（它们很少如此），而且事情本可以也应该更简单（确实如此，但事实并非如此）。然而，正如人们所说，“拙工无怨工具”。优秀的工匠知道工具的优缺点，并此调整自己的工作。参见\
  \ §4.3 编译时错误和 §4.4 链接错误。程序编译并链接后，接下来通常是最困难的部分：找出程序为什么没有按预期运行。在寻找 bug 时，从你最后确定正确的地方开始，仔细逐行跟踪代码。想象你就是那个执行程序的计算机。输出符合你的预期吗？如果不符合，你就在进行调试了。\n\
  \nAA\n\n通常，当我们看不到问题时，是因为我们“看到”了我们预期看到的，而不是实际看到的。考虑：\n\n点击此处查看代码图像\n\n```\nfor (int\
  \ i = 0; 0<=max; ++i) {               // 噢！\n         for (int j = 0; j<v.size();\
  \ ++i);            // 打印 v 的元素\n                 cout << \"v[\" << j << \"]==\"\
  \ << v[j] << '\\n';\n         }\n```\n\n上一个例子等同于经验丰富的程序员编写的真实程序代码。我们预计它是某个深夜编写的。\n\
  \n通常当我们看不到问题时，原因是在程序产生最后一次良好输出到下次输出（或没有输出）之间执行了太多的代码。大多数编程环境都提供逐条执行（单步调试）语句的方法。最终，你会学会使用这些设施，但对于简单的问题和程序，你可以添加一些额外的输出语句（使用错误报告输出流\
  \ `cerr`）来帮助你观察发生了什么。例如：\n\n点击此处查看代码图像\n\n```\nint my_fct(int a, double d)\n{\n\
  \         cerr << \"my_fct(\" << a << \",\" << d << \")\\n\";\n         int res\
  \ = 0;\n         // 此处有异常的代码 ...\n         cerr << \"my_fct() returns \" << res\
  \ << '\\n';\n         return res;\n}\n```\n\n\n\n\n\n在怀疑存在 bug 的代码段中，插入检查不变性（即应该始终成立的条件；参见\
  \ §4.7.3 和 §8.4)的语句。例如：\n\n点击此处查看代码图像\n\n```\nint my_complicated_function(int a,\
  \ int b, int c)\n         // 参数为正数且 a < b < c\n{\n         if (!(0<a && a<b && b<c))\
  \                  // ! 意味着“不”，&& 意味着“与”\n                  error(\"bad arguments\
  \ for mcf\");\n         // ...\n}\n```\n\n如果这样做没有任何效果，请在不怀疑存在 bug 的代码段中插入不变性检查；如果你找不到\
  \ bug，那么你几乎肯定找错地方了。\n\n## 4.7.3 断言 (Assertions)\n\n声明（或断言）不变性的语句称为 `assertion`（或简称为\
  \ `assert`），有时也称为 `contract`（合约）。\n\n### AA\n\n有趣的是，编程有许多有效的方法。不同的人成功地使用了截然不同的技术。调试技术上的许多差异源于人们处理的程序类型不同；另一些似乎与思维方式的差异有关。据我们所知，没有一种最好的调试方法。但有一点应该始终记住：杂乱的代码很容易潜藏\
  \ bug。通过保持你的代码尽可能简单、逻辑清晰且格式良好，你可以缩短调试时间。\n\n### 4.7.3.1 前置条件 (Preconditions)\n\n\
  CC\n\n现在，让我们回到如何处理函数错误参数的问题上。函数调用基本上是考虑正确代码和捕获错误的最佳时机：这是一个逻辑上独立的计算开始的地方（并在返回时结束）。看看我们在上面的建议中做了些什么：\n\
  \n点击此处查看代码图像\n\n```\nint my_complicated_function(int a, int b, int c)\n        \
  \ // 参数为正数且 a < b < c\n{\n         if (!(0<a && a<b && b<c))         // ! 意味着“不”，&&\
  \ 意味着“与”\n                 error(\"bad arguments for mcf\");\n         // ...\n\
  }\n```\n\n首先，我们（在注释中）说明了函数对其参数的要求，然后我们检查了该要求是否满足（如果不满足则抛出异常）。\n\n这是一个很好的基本策略。函数对其参数的要求通常被称为\
  \ `precondition`（前置条件）：为了让函数正确执行其操作，它必须为真。问题仅在于当 `precondition` 被违反（不成立）时该怎么办。我们基本上有两个选择：\n\
  \n1. 忽略它（希望/假设所有调用者都提供正确的参数）。\n2. 检查它（并某种方式报告错误）。\n\n从这个角度看，参数类型只是让编译器为我们检查简单的前置条件并在编译时报告它们的一种。例如：\n\
  \n点击此处查看代码图像\n\n```\nmy_complicated_function(1, 2, \"horsefeathers\")\n```\n\n在这里，编译器将捕捉到第三个参数必须是整数的要求（`precondition`）被违反了。基本上，我们在这里讨论的是如何处理编译器无法检查的要求/前置条件。\n\
  \nAA\n\n我们的建议是始终在注释中记录前置条件（这样调用者就可以看到函数期望什么）。没有注释的函数将被假设为处理所有可能的参数值。但我们应该相信调用者阅读了这些注释并遵循了规则吗？有时我们不得不，但“在被调用者中检查参数”的规则可以述为：“让函数检查其前置条件”。只要我们没有理由不这样做，就应该这样做。不检查前置条件最常给出的理由：\n\
  \n* 没人会提供错误的参数。\n* 这会减慢我的代码。\n* 检查起来太复杂了。\n\n第一个理由只有在我们恰好知道“谁”调用了某个函数时才是合理的——在现实世界的代码中，这可能非常困难。\n\
  \n第二个理由成立的情况比人们想象的少得多，大多数情况下应该被忽略，作为“过早优化”的例子。如果检查真的变成了负担，你随时可以移除它们。但你无法轻易获得它们所确保的正确性，无法找回因寻找那些测试本可以发现的\
  \ bug 而失去的睡眠。\n\n第三个理由是严重的。一旦你成为一名丰富的程序员，很容易找到某些检查前置条件所需的工作比执行函数要多多的例子。一个例子是在字典中查找：前置条件是字典项是有排序的——而验证字典是否排序的代价远比查找高得多。有时，在代码中表达一个前置条件并确保你表达得正确也可能困难的。然而，当你写一个函数时，始终考虑你是否可以对前置条件进行快速检查，除非你有充分理由不这样做，否则就这样做。\n\
  \n### 4.7.3.2 expect()\n\n编写前置条件（即使是作为注释）对你的程序质量也有显著益处：它迫使你思考函数需要什么。如果你不能在几行注释中简单精确地说明这一点，你可能对你正在要做思考得不够深。经验表明，显式声明前置条件有助于避免许多设计错误。\n\
  \n为了解决第二个问题，我们引入了一个名为 `expect` 的函数来进行检查。`expect()` 接受一个测试函数和一个用于报告错误的字符串：\n\n点击此处查看代码图像\n\
  \n```\nbool ordered_positive(int a, int b, int c)\n{\n         return 0<a && a<b\
  \ && b<c;\n}\n\nint my_complicated_function(int a, int b, int c)\n         // 参数为正数且\
  \ a < b < c\n{\n         expect(ordered_positive(a,b,c), \"bad arguments for mcf\"\
  );\n         // ...\n}\n```\n\n现在我们可以看到 `my_complicated_function()` 从参数期望什么，但对于我们在源代码中不经常使用的测试，我们更希望直接将它们出来。我们可以这样做：\n\
  \n点击此处查看代码图像\n\n```\nint my_complicated_function(int a, int b, int c)\n        \
  \ // 参数为正数且 a < b < c\n{\n         expect([&]{ return 0<a && a<b && b<c; }, \"bad\
  \ arguments for mcf\");\n         // ...\n}\n```\n\n这种构造\n\n点击此处查看代码图像\n\n```\n\
  [&]{ return 0<a && a<b && b<c; }\n```\n\n被称为 lambda 表达式（lambda expression），将在 §21.2.3\
  \ 中解释。这种语法不像我们希望的那么简洁，但它构造了一个供 `expect()` 用的函数测试\n\n```\n0<a && a<b && b<c\n```\n\
  \n如果该测试失败，\n\n点击此处查看代码图像\n\n```\nerror(\"bad arguments for mcf\")\n```\n\n\n\n\n\
  其调用方式恰这与我们使用命名函数 `ordered_positive()` 时完全一样。\n\n### 4.7.3.3 后置条件\n\n声明前置条件并插入 `expect()`\
  \ 调用有助于我们改进设计并尽早发现使用错误。这种显式声明要求的想法可以用于其他地方吗？可以，脑中立刻浮现出另一个地方：返回值！毕竟，我们通常必须说明函数返回什么；也就是说，如果我们从函数返回一个值，我们*总是*在对返回值做出某种承诺（否则调用者如何知道期待什么呢？）。让我们再次看看我们的面积函数（来自\
  \ §4.6.1）：\n\n点击此处查看代码图像\n\n```cpp\nint area(int length, int width)\n         //\
  \ 计算矩形的面积\n         // 参数为正数\n{\n         expect([&]{ return 0<length && 0<width;\
  \ }, \"bad arguments to area()\");\n         return length*width;\n}\n```\n\n它检查了自身的前置条件，但仅仅假设计算是正确的（这对于这种微不足道的计算可能没问题）。对正确性的检查被称为*后置条件*。对于\
  \ `area()` 来说，后置条件应该是结果确实是面积。我们无法检查完整的后置条件，但可以检查结果应该是正数：\n\n点击此处查看代码图像\n\n```cpp\n\
  int area(int length, int width)\n         // 参数为正数\n{\n         expect([&]{ return\
  \ 0<length && 0<width; }, \"bad arguments to area()\");\n         int a = length*width;\n\
  \         expect([&]{ return 0<a; }, \"bad area() result\");\n         return a;\n\
  }\n```\n\n这段代码与直观的写法相比显得相当臃肿：\n\n点击此处查看代码图像\n\n```cpp\nint area(int length, int\
  \ width)\n{\n         return length*width;\n}\n```\n\n但它说明了一种技术，在编写对正确结果至关重要的程序时，这种技术是非常有用的。\n\
  \n#### 尝试一下\n\n找到一对值，使得这个版本的 `area` 函数的前置条件成立，但后置条件不成立。\n\n前置条件和后置条件为代码提供了基本的健全性检查。因此，它们与不变性（§8.4.3）、正确性（§3.2,\
  \ §4.2）以及测试（§4.7.4）的概念密切相关。\n\n**CC**\n\n注意 `error()` 和 `expect()` 不是 ISO C++ 标准库的一部分。它们只是\
  \ `PPP_support` 的一部分。标准委员会正在进行直接支持前置和后置条件的工作，但在写作时，该工作尚未完成。\n\n### 4.7.4 测试\n\n\
  我们如何知道何时停止调试？嗯，我们一直调试直到找到所有 bug —— 或者至少我们尝试这样做。我们如何知道自己找到了最后一个 bug 呢？我们不知道。“最后一个\
  \ bug”是程序员的笑话：根本没有这种东西；我们永远无法在大程序中找到“最后一个 bug”。等我们可能找到时，我们正忙于为了新的用途修改程序了。\n\n**CC**\n\
  \n除了调试之外，我们还需要一种系统的方法来搜索错误。这被称为*测试*，我们将在 §6.3 和第 9 章的练习中回到这个问题。基本上，测试是使用一组大量且系统选择的输入运行程序，并将结果与预期结果进行比较。使用一组定的输入运行被称为*测试用例*。现实程序可能需要数百万测试用例，因此系统测试无法通过人工一个一个输入测试来完成。正确进行测试所需的工具是可用的，但超本书的范围。目前，请以发现错误是好事的态度对待测试。考虑一下：\n\
  \n* *态度 1：我比任何程序都聪明！我会搞坏该死的代码！*\n* *态度 2：我打磨了两个周的代码。它是完美的！*\n\n**AA**\n\n你认为谁会发现更多错误？当然，最好的应该是一个带有一点“态度\
  \ 1”的经验丰富的人，他们酷酷、冷静、耐心且系统地处理程序可能出现的所有缺陷。优秀的测试人员无价连城。\n\n我们尝试系统化地选择测试用例，并总是尝试正确和错误的输入。\
  \ §6.3 给了这方面的第一个例子。\n\n对于工业级用途，被称为*测试框架*的程序与其他开发支持集成，并几乎被普遍使用。示例有 Boost.Test, Catch2,\
  \ CTest, Google Test, Microsoft Unit Testing Framework for C++ 和 UnitTest++。它们都允许你编写一组代码示例，并对每个示例说明其执行的预期结果，例如产生特定结果或抛出特定异常。一旦你对编程和\
  \ C++ 有进一步了解，我们鼓励你尝试并使用这样的框架。与所有工具一样，如果能请一位经验丰富的开发者帮助你入门，那是最好的。\n\n### 4.7.5 随机数\n\
  \n随机数是数字序列中的一个数字，在给定之前的数字的情况下，很难（甚至不可能）确定下一个。某些随机序列是真正的随机，例如从盖格计数器读取的背景辐射读数，但大多数是*伪随机*的，也就是说，是由数学公式生成的。\n\
  \n随机数在计算的许多领域都很重要，如模拟、游戏、密码学、安全和测试。即在我们需要不可预测的结果或输入的地方。例如，在测试函数时，使用一系列随机输入调用它来查看其是否有响应可能是很有用的。C++\
  \ 标准库提供了一个复杂的随机数组件，它被描述为“随机数库长大后想成为的样子”，但这里只描述通的想法和几个简单的示例。\n\n我们从生成一系列随机值开始。这是通过*引擎*（engine）完成的：\n\
  \n点击此处查看代码图像\n\n```cpp\ndefault_random_engine engine; // 最简单的引擎\n```\n\n`default_random_engine`\
  \ 对于大多数用途都是足够的，也是这里唯一的。为了有用，来自引擎的随机数必须转换为我们需要的*分布*（distribution），例如 [1:6] 范围内的整数以模拟骰子：\n\
  \n点击此处查看代码图像\n\n```cpp\nuniform_int_distribution<int> dist(1,6); // 我们想要的分布\nfor\
  \ (int i=0; i<10; ++i)\n         cout << dist(engine) << ' '; // 使用引擎从分布获取值\n```\n\
  \n当我们多次掷骰子时，如果范围内所有值的出现频率相同（对于不均匀的骰子来说确实如此），该分布被称为 `uniform_int_distribution`。标准库提供了许多非常有用的分布，包括用于模拟均值周围波动的正态分布\
  \ `normal_distribution` 以及用于建模等待时间的 `exponential_distribution`。\n\n通常，我们希望在一个地方选择引擎和分布，然后通过简单的接口使用它们。我们在\
  \ `PPP_support` 中通过提供几个访问函数实现了这一点：\n\n点击此处查看代码图像\n\n```cpp\nint random_int(int min,\
  \ int max); // 在 [min:max] 范围内获取一个整数\nint random_int(int max);         // 在 [0:max]\
  \ 范围内获取一个整数\n```\n\n我们现在可以说：\n\n点击此处查看代码图像\n\n```cpp\nfor (int i=0; i<10; ++i)\n\
  \         cout << random_int(1,6) << ' '; // 使用分布获取一个值\n```\n\n\n\n在`§20.4`中，我们将展示如何实现这一点。这非常简单，但需要用到我们尚未解释的几个特性。\n\
  \n一旦我们有了随机数，就可以生成其他类型的随机值序列。例如，这段代码可以生成随机字符串，我们可以用它们来测试字符串容器的算法：\n\n点击此处查看代码图片\n\
  \n```\nstring random_letters(int n, int m)\n        // 生成一个包含 4 到 24 个随机小写字母的字符串\n\
  {\n        string s(random_int(n, m),'x');                                    //\
  \ 生成一个大小在 [n:m] 范围内的字符串\n        for (char& ch : s)\n                ch = narrow<char>(random_int('a','z'));\
  \             // 一个小写字母\n        return s;\n}\n```\n\n在构造给定大小的 `string` 时，其字符必须初始化为某些值；在这里，我们选择了\
  \ `’x’`。此外，我们使用 `narrow` 来显式地将 `random_int()` 返回的 `int` 窄化为所需的 `char` (§7.4.7)。\n\
  \n与 `random_int()` 一样，`random_letters()` 可以在 `PPP_support` 中找到。我们可以使用它来生成一个包含（名称，值）对的\
  \ `vector` 用于测试：\n\n点击此处查看代码图片\n\n```\nvector<pair<string, int>> generate(int n)\n\
  \         // 生成 n 个随机 (name,value) 对\n{\n         vector <pair<string, int>> res;\n\
  \         for (int i = 0; i < n; ++i)\n                 res.push_back({random_letters(4,24),random_int(1'000'000)});\n\
  \         return res;\n}\n```\n\n随机数生成器每次创建和使用时都会交付相同的序列。这对于需要重复结果的调试和测试非常有用，但在我们需要不可预测输出的情况下是不理想的。例如，在游戏中，我们不希望怪物每次在玩时都是在相同地点、相同时间以相同方式攻击的巨魔。\n\
  \n为了从引擎获取不同的序列，我们对其进行*种子设置（seed）*：\n\n点击此处查看代码图片\n\n```\ndefault_random_engine engine2(7777);\
  \            // 使用 7777 代替默认起始值\n// ...\nengine2.seed(9876);                   \
  \                         // 从 9876 开始新序列\n```\n\n要使序列变得不可预测，可以使用某些不可预测的值对其设置种子，例如创建时间。在\
  \ `PPP_support` 中，我们提供了一个函数 `seed()` 来为 `random_int()` 使用的引擎设置种子：\n\n点击此处查看代码图片\n\
  \n```\nvoid seed(int s);                         // 使用 s 设置种子\nvoid seed();    \
  \           // 使用一个真正不可预测的值设置种子\n```\n\n`random_int()` 和 `seed()` 函数仅暴露了标准库中复杂的\
  \ `random` 组件的一极小部分，但它非常简单，且足够用于广泛用途。\n\n### 练习\n\n下面是 25 个代码片段。每个片段都旨在插入到这个“脚手架”中：\n\
