  \ store）这些混乱的低级内容呢？嗯，答案之一是有人必须设计并实现 `vector` 类似的抽象，而了解它是如何实现的通常是有用的。有些编程语言规避了低级编程的问题。基本上，此类语言的程序员将将涉及直接访问硬件的任务委托给\
  \ C++ 程序员（以及其他适用于低级编程的语言程序员）。然而，我们最喜欢的理由仅仅是：在你看到软件如何与硬件交互之前，你不能真正声称理解了计算机和编程。那些不知道指针、内存地址和其他基础低级设施的人，对于其编程语言设施的工作原理往往有最奇怪的想法；这些错误的想法可能会导致代码变得“糟糕地有趣”（即运行缓慢且/或不可维护）。\n\
  \n## 16 数组、指针与引用\n\n*谨者挑选！（Caveat emptor!）*\n\n*– 良好的建议*\n\n本章描述了数组和指针等低级概念。我们考虑了指针的，例如数组遍历和地址算术，以及此类用法引发产生的问题。我们还介绍了广泛使用的\
  \ C 风格字符串；即一个零终止的 `char` 数组。指针和数组是实现某些类型的关键，这些类型可以防止我们错误使用指针，例如 `vector`、`string`、`span`、`not_null`、`unique_ptr`\
  \ 和 `shared_ptr`。作为一个示例，我们展示了实现判断字符序列是否为回文的几种方法。\n\n- *§16.1* 数组\n  - 指针算术\n- *#§16.2*\
  \ 指针与引用\n  - 指针和引用参数; 指针作为参数\n- *#§16.3* C 风格字符串\n- *#§16.4* 指针用法的替代方案\n  - span;\
  \ array; not_null\n- *#§16.5* 示例：回文\n  - 使用 `string` 的回文; 使用数组的回文; 使用指针的回文; 使用 `span`\
  \ 的回文\n\n### 16.1 数组\n\n到为止，我们把所有的数组都分配在自由存储上；这是我们实现 `vector` 所需要的。然而，我们也可以在栈和静态内存中使用数组（§15.4）。例如：\n\
  \n```cpp\nint ai[4];\n\nvoid fct() {\n    char ac[8];\n}\n\nvoid test() {\n    double\
  \ a[3];\n    use(a);\n}\n\nvoid use(double* pd) {\n    pd[2] = 2.2;\n    pd[3] =\
  \ 3.3;\n    pd[-2] = -2.2;\n}\n```\n\n\n\n\n一个让防止越界访问变得困难的问题是，我们可以独立地将一个 `double`\
  \ 赋值给另一个 `double`，而不考虑它们各自指向多少个对象。指针实际上并不知道它指向多少个对象。例如：\n\n点击此处查看代码图像\n\n```\ndouble*\
  \ p = new double;                 // 分配一个 double\ndouble* q = new double[1000];\
  \        // 分配 1000 个 doubles\n\nq[700] = 7.7;                                 \
  \    // 正确：q 指向 1000 个 doubles\nq=p;                                           \
  \      // 让 q 指向与 p 相同的对象\ndouble d = q[700];                            // 错误：q\
  \ 指向一个单个 double：越界访问！\n```\n\n在这里，仅通过三行代码，`q[700]` 就引用了两个不同的内存位置，而最后一次使用是越界访问，很可能导致灾难。\n\
  \n![一张图表列出了数组的元素。数组 q 的第二个值定义了数组 p。数组 q 的第一个值定义了数组 q。](img/f0467-01.jpg)\n\n到这里，我们认为你可能会问：“但为什么指针不能记住大小呢？”显然，我们可以设计一种恰好做到此点的“指针”——`vector`\
  \ 几乎就是那样，如果你翻阅 C++ 文档和库，你会发现许多“智能指针”，它们补偿了底层内置指针的弱点（例如，参见第 16.4.1 节](#ch16.xhtml_ch16lev2sec4)中的\
  \ `span`）。然而，在某些地方我们需要接触硬件层面并理解对象是如何寻址的——机器地址并“不知道”它所指向的内容。此外，理解指针对于理解许多真实世界的代码至关重要。\n\
  \n### 16.1.1 指针算术\n\n指针可以指向数组的一个元素。考虑以下：\n\n点击此处查看代码图像\n\n```\ndouble ad[8];\ndouble*\
  \ p = &ad[4];            // 指向 ad[4]；ad 的第 5 个元素\n```\n\n我们现在有一个指向名为 `ad[4]` 的 `double`\
  \ 的指针 `p`：\n\n![一张图表列出了数组的元素。数组 p 有未定义的大小。元素的索引值对 d 是定义的，d 在第一个槽中有一个 d [0]。内存有八个槽。](graphics/f0468-01.jpg)\n\
  \n我们可以对该指针进行下标操作和引用：\n\n```\n*p =7;\np[2] = 6;\np[−2] = 9;\n```\n\n我们得到\n\n![一张图表列出了数组的元素。](img/f0468-02.jpg)\n\
  \n也就是说，我们可以用正数和负数对指针进行下标操作。只要结果元素在范围内，一切都是正常的。然而，访问所指向的数组范围之外是非合法的（与在堆上分配的数组一样；参见第\
  \ 16.1 节](#ch16.xhtml_ch16lev1)）。通常，数组之外的访问不会被编译器检测到，并且（迟早）产生灾难）。\n\n一旦指针指向数组内部，可以使用加法和下标操作让它指向数组的另一个元素。例如：\n\
  \n点击此处查看代码图像\n\n```\np+=2;                  // 将 p 向右移动 2 个元素\n```\n\n我们得到\n\n![一张图表列出了数组的元素，p\
  \ d。](img/f0468-03.jpg)\n\n我们也可以向后移动：\n\n点击此处查看代码图像\n\n```\np−=4;              \
  \ // 将 p 向左移动 4 个元素\n```\n\n我们得到\n\n![一张图表列出了数组的元素。](img/f0469-01.jpg)\n\n使用 `+`、`-`、`+=`\
  \ 和 `-=` 来移动指针被称为指针算术。显然，如果我们这样做，必须非常小心以确保结果不会指向数组之外的内存：\n\n点击此处查看代码图像\n\n```\n\
  p += 1000;                   // 疯狂的：p 指向一个只有 8 个元素的数组\ndouble d = *p;          \
  \  // 非法：可能是一个坏值\n*p = 12.34;                  // 非法：可能会扰乱某些数据\n```\n\n不幸的是，并不是所有涉及指针算术的坏\
  \ Bug 都容易发现。最好的策略是在除非实现没有替代方案的设施时，否则简单地避免指针算术。\n\n指针算术最常见的用法是增加指针（使用 `++`）以指向下一个元素，以及减少指针（使用\
  \ `--`）以指向上一个元素。例如，我们可以这样打印 `ad` 元素的值：\n\n点击此处查看代码图像\n\n```\nconst int max = sizeof(ad)/sizeof(*ad);\
  \                  // 确定 ad 元素数量的一种方法\nfor (double* p = &ad[0]; p<&ad[max]; ++p)\n\
  \        cout << *p;\n```\n\n或者：\n\n点击此处查看代码图像\n\n```\nfor (double* p = &ad[max];\
  \ p>&ad[0]; --p)\n        cout << *p;\n```\n\n\n\n\n| `p=x;` | `r=&x;` | 类型错误 |\n\
  | :--- | :--- | :--- |\n| `p=7;` | `r=7;` | 写入到指向/引用的对象 |\n| `p=7;` | `r=7;` | 类型错误\
  \ |\n| `int x2 = *p;` | `int x2 = r;` | 读取指向/引用的对象的值 |\n| `int* p2 = p;` | `int&\
  \ r2 = r;` | 让 `p2` 指向 `p` 所指向的对象 |\n| `p = nullptr;` | `r = \"nullref\"` | 无空引用\
  \ |\n| `p = &x2;` | | 让 `p` 指向 `x2` |\n| | `r = x2;` | 将 `x2` 赋值给 `r` 所引用的对象 |\n\
  \n## AA\n\n注意 `r=x2` 不会引用指向 `x2`。初始化后让引用指向不同的对象，这是一种有用的保证。相反，`r=x2` 将 `x2` 的值赋值给\
  \ `r` 所引用的对象；即 `x`。如果你需要指向不同的内容，请使用指针。\n\n关于何时以及如何使用指针，请参见 15.7 和 16.5。\n\n引用和指针都是通过内存地址实现的。它们只是在使用该地址时为你——程序员——提供了略有不同的功能。\n\
  \n### 16.2.1 指针和引用参数\n\n当你想要更改函数计算出来的值时，你有三个选择。例如：\n\n查看代码图像\n\n```cpp\nint incr_v(int\
  \ x) { return x+1; } // 计算新值并返回\nvoid incr_p(int* p) { ++*p; }     // 传递指针（解引用并增加结果）\n\
  void incr_r(int& r) { ++r; }     // 传递引用\n```\n\n如何选择？我们认为返回值通常是最直观（因此最不容易出错）的代码；即：\n\
  \n查看代码图像\n\n```cpp\nint x = 2;\nx = incr_v(x); // 将 x 传递给 incr_v() 然后将结果赋值\n```\n\
  \n对于小对象倾向于这种风格，例如 `int`。此外，如果一个“大对象”（例如 `vector`）具有移动构造函数 17.4.4，我们可以高效地来回传递。\n\n\
  在使用引用参数和指针参数之间如何选择？遗憾的是，两种方式都有优缺点，因此答案并不显而易见。你需要根据具体的函数及其可能的用途做出决定。\n\n## XX\n\n\
  如果你使用指针作为函数参数，函数必须小心有人用空指针（即 `nullptr`）调用它。例如：\n\n查看代码图像\n\n```cpp\nincr_p(nullptr);\
  \ // 崩溃：incr_p() 将尝试解引用空指针\nint* p = nullptr;\nincr_p(p); // 崩溃：incr_p() 将尝试解引用空指针\n\
  ```\n\n这显然很糟糕。编写 `incr_p()` 的人可以防止这种情况：\n\n查看代码图像\n\n```cpp\nvoid incr_p(int* p)\n\
  {\n        if (p==nullptr)\n                error(\"incr_p() 的参数为空指针\");\n     \
  \   ++*p; // 解引用并增加指向的对象\n}\n```\n\n但现在 `incr_p()` 看起来不再以前那么简单和吸引人了。第 4 章 讨论了如何处理错误的参数。相比之下，引用的使用者（如\
  \ `incr_r()`）有权假设引用指向一个对象。\n\n如果从函数的语义来看，“通过”（不传递对象）是可以接受的，我们必须使用指针参数。然而，对于我们的递增操作，“通过”是不可接受的——因此需要对\
  \ `p==nullptr` 抛出异常。\n\n## AA\n\n所以，真正的答案是：“选择取决于函数的性质”：\n\n* 对于小对象，倾向于按值传递。我们所说的“小”是指两个内置类型的值（例如两个\
  \ `double`），或两个等大小的类对象。\n* 对于“无对象”（由 `nullptr` 表示）作为有效参数的函数，使用指针参数（并记得测试 `nullptr`）。\n\
  * 否则，使用引用参数。\n\n另见 7.4.6，不要忘记按 `const` 引用传递。\n\n### 16.2.2 指针作为参数\n\n## XX\n\n指针作为参数很流行。例如：\n\
  \n查看代码图像\n\n```cpp\nconst char* s = \"Danger!\";\n```\n\n我们可以这样表示 **s**：\n\n![列出了数组元素。元素的索引定义值为\
  \ D, a, n, g, e, r, 感叹号和 0。](img/f047-01)\n\n注意字面量字符串是 `const`。如果我们想修改字符，需要使用数组：\n\
  \n查看代码图像\n\n```cpp\nchar s[] = \"Modifiable\";\ncout << \"modifiable: \" << s; //\
  \ 输出 Modifiable\n\ns[6] = 'e';\ns[7] = 'd';\ns[8] = 0; // 终止零\n\ncout << \"modifiable:\
  \ \" << s; // 输出 Modified\n```\n\n为了获取 C 风格字符串的字符数，我们使用 `strlen()`：\n\n查看代码图像\n\n\
  ```cpp\ncout << strlen(s); // 输出 8\n```\n\n注意 `strlen()` 不计算终止的 `0`；它给出到该 `0` 之前但不包含它的字符数。这意味着如果在字符串中间放置一个\
  \ `0`（正如我们对 `s` 所的那样），我们就无法确定为该字符串分配了多少内存。\n\n我们的 C 风格“字符串”是指针，并且具有指针语义。这意味着赋值、拷贝和\
  \ `sizeof` 应用于指针本身，而不是它指向的内容。\n\n问题的根源在于指针并“不知道”为该字符串分配了多少内存，15.7 和 16.5。\n\n引用和指针都是通过内存地址实现的。它们只是在使用该地址时为你——程序员——提供了略有不同的功能。\n\
  \n\n\n\n\n```\nchar* cat2(const char* name, const char* addr)\n{\n       int nsz\
  \ = strlen(name);\n       int sz = nsz+strlen(addr)+2;                      // +2\
  \ for ’@’ and the terminating zero\n       char* res = (char*) malloc(sz);     \
  \             // using the old allocation function\n       strcpy(res,name);   \
  \                                  // copy from *name to *res until a zero is seen\n\
  \       res[nsz+1] = '@';\n       strcpy(res+2,addr);\n       return res;\n}\n```\n\
  \nC 和 C++ 标准库函数 `malloc()` 在堆（free store）上分配内存；通过 `malloc()` 分配的内存必须使用 `free()`\
  \ 给堆管理器。在 C 风格的代码中，你经常看到这种写法代替 `new`/`delete` —— `string`、`new` 和 `delete` 并不是 C\
  \ 的一部分。C 和 C++ 标准库函数 `strcpy()` 将第二个参数所指向的字符复制到第一个参数所指向的位置，直到遇到终止零为止。该终止零也会被复制。\n\
  \n## XX\n\n这种代码冗长且容易出错。它使用了杂乱的指针运算，而且谁来 `free()` `cat2()` 返回的内存呢？我们强烈建议使用 `std::string`\
  \ 或类似的高级字符串代替 C 风格字符串。作为代码的读者或维护者，你更愿意看到 `cat()` 还是 `cat2()`？\n\n为什么要设计像 C 字符串这样的东西？当\
  \ C 风格字符串发明时，计算机内存是以几十 KB 为单位衡量的——如果你运气好，是几百 KB。我记得当我得到一台整达 1 MB 的电脑时简直狂喜！对于当时编写的程序，C\
  \ 风格字符串在时间和空间上都是最优的。原因是它们没有计算或存储任何你可能不需要的信息。此外，C 风格字符串的早期用户比今天的平均水平优秀得多。他们只是不会犯大多数显而易见的编程错误。\n\
  \n## AA\n\n为什么今天还会写这样的代码？嗯，有很多 C 程序员没有其他选择，并且经常将他们的习惯带到 C++ 中。此外，许多程序员相信他们可以在不犯错的情况下编写最优代码。他们几乎总是错的。\n\
  \n事实上，C 风格字符串有许多可能让不熟悉它的人感到惊讶的特性。C 风格字符串确实就是指针。例如，`=` 分配的是指针，而不是它们指向的值。\n\n你已经收到警告了！有选择时，请优选\
  \ `std::string`。如果没有，请查阅额外的教程信息和文档（例如，[cppref]）。\n\n### 16.4 指针使用的替代方案\n\n## AA\n\
  \n指针本质上可以用于任何地方。这就是为什么我们尝试避免使用它们：通过观察充满大量指针的代码，我们无法可靠地确定程序员的意图。这使得许多指针的使用容易出错。考虑以下替代方案：\n\
  \n*   要持有值的集合，请使用标准库容器，如 `vector`、`set` (§20.5)、`map` (§20.2)、`unordered_map` (§20.3)\
  \ 或 `array` (§16.4.2)。\n*   要持有字符字符串，请使用标准库 `string` (§2.4, §9.10.3 PPP2.§23.2)。\n\
  *   要指向你拥有的对象（即必须 `delete`），请使用标准库 `unique_ptr` (§18.5.2) 或 `shared_ptr` (§18.5.3)。\n\
  *   要指向你不拥有的连续元素序列，请使用标准库 `span` (§16.4.1)。\n*   要系统地避免解引用空指针，请使用 `not_null` (§16.4.3)。\n\
  \n通常，标准库组件也有替代方案，但要把标准库作为你的默认。\n\n#### 16.4.1 Span\n\n指针大多数用途涉及跟踪指针所指向的元素数量。大多数与所有权无关的问题都源于元素数量获取错误。因此，我们采用显而易见的补办法：一种跟踪元素数量的“指针”。这种类型被称为\
  \ `span`。例如：\n\n```\nint arr[8];\nspan {arr}; // 指向 8 个整数的 span<int>\n```\n\n或者图化地显示：\n\
  \n![图表列出了元素...]\n\n在这里，`spn` 在定义时没有提到元素类型或元素数量，这些是从 `arr` 推导出来的。我们并不总是拥有这些信息，也不总是想要整个数组。这时，我们必须显式指定：\n\
  \n```\nconst int max = 1024;\nint buf[max];\nspan<int>sp {buf,max/2}; // buf 的半部分\n\
  ```\n\n通过 `span`，我们可以获得范围检查和范围 for：\n\n```cpp\nvoid test(span<int> s)\n{\n     \
  \   cout << \"size: \" << s.size() << '\\n';\n        for (int x : s)\n        \
  \        cout << x << '\\n';\n        try {\n                int y = s[size()];\n\
  \        }\n        catch (...) {\n                cout << \"we have range checking\\\
  n\";\n                return;\n        }\n        cout << \"no range checking! Boo!\\\
  n\";\n        terminate(); // 退出程序\n}\n```\n\n遗憾的是，`std::span` 不保证进行范围检查，尽管 `PPP_support`\
  \ 中的版本是。\n\n#### 16.4.2 array\n\n内置数组在稍有变动时就会转换为指针。生成的指针缺少大小信息，并可能与需要 `delete` 的指针混淆。然而，标准库提供了一种不会隐式产生指针的\
  \ `array` 类型。例如：\n\n```cpp\nstd::array<int,8> arr { 0,1,2,3,4,5,6,7 };\nint* p =\
  \ arr; // 错误（这很棒）\n```\n\n与 `vector` 和 `string` 不同，`array` 不是指向别处的句柄：\n\n有利有坏，像内置数组一样，`array`\
  \ 比 `vector` 类型简单且不灵活。它的大小不存储在内存中，而是由类型系统记住。除非你使用 `new` 创建，否则 `array` 不使用堆。相反，`array`\
  \ 使用你创建它时的内存类型（例如栈或静态内存），这可能是重要的。\n\n遗憾的是，`array` 的元素数量永远不会推导，因此必须显式说明。另一方面，如果元素多于初始化值，剩余部分将进行默认初始化。例如：\n\
  \n```cpp\narray<string,4> as { \"Hello\", \" \", \"World!\" }; // as[3] 是空字符串\n\
  ```\n\n#### 16.4.3 not_null\n\n考虑 `strlen()` 的可能实现：\n\n```cpp\nint strlen(const\
  \ char* p)\n{\n       if (p==nullptr)\n               return 0;\n       int n =\
  \ 0;\n       while (*p++)\n               ++n;\n       return n;\n}\n```\n\n对 `nullptr`\
  \ 测试是否有必要？如果没有，`strlen(p)` 在 `p` 为空指针时最可能导致崩溃；如果没有，它会给出一个错误的结果。如果有，应该给出一个结果吗？也就是说，我们是否应该假装\
  \ `nullptr` 指向的（虚拟）字符串有零个元素？还是给出错误（例如抛出异常）更好？\n\n### 尝试一下\n\n查阅 `std::strlen()`\
  \ 的定义以查看标准要求的。然后，尝试 `char* p = nullptr; size_t x = strlen(p);` 看看你的实现做了什么。\n\n\n\
  \n\n\n每当我们使用指针时，如何处理 `nullptr` 的问题就会立即浮出水。`nullptr` 有定义的含义吗？它是一个 Bug 吗？如果是 Bug，由谁负责捕获它？是调用者还是被调用者？文档或注释可能会提供答案，但我们并不总是读手册。`PPP_support`\
  \ 提供了一个简单的解决方案：一种类型，它检查其参数是否为 `nullptr`，如果是，则抛出 `not_null_error`。在通过检查之后，`not_null`\
  \ 的行为就像指针一样。如果 `strlen()` 不允许 `nullptr`，我们可以这样定义它：\n\n点击此处查看代码图片\n\n```\nint strlen(not_null<const\
  \ char*>p)\n{\n       int n = 0;\n       while (*p++)\n               ++n;\n   \
  \    return n;\n}\n```\n\n如果 `strlen()` 不是这样定义的——作为一个 20 世纪 70 年代的 C 函数，它确实不是如此——那么实现者必须决定是信任调用者还是防范\
  \ `nullptr` 参数的可能性。此外，每个用户都必须决定是否确保 `strlen` 的任何参数都不是 `nullptr`。这就是低抽象层面的生活。理想情况下，我们通过使用高级类型（如\
  \ `vector` 和 `string`）来避免这种困境。在无法这样做的情况下，对于来自你无法控制的代码的指针参数使用 `not_null`。\n\n###\
  \ 16.5 示例：回文\n\n技术示例够了！让我们来玩一个小谜题。*回文*（palindrome）是指正反读拼写都相同的单词。例如，*anna*、*petep*\
  \ 和 *malayalam* 是回文，而 *ida* 和 *homesick* 则不是。确定一个单词是否为回文有两种基本方法：\n\n*   制作一个字母的反序副本，并将该副本与原始字符串比较。\n\
  *   检查第一个字母和最后一个字母是否相同，然后检查第二个字母和倒数第二个字母是否相同，以此类推直到中间。\n\n在这里，我们将采用第二方法。在代码中表达这种思想有很多方法，取决于我们如何表示单词以及如何跟踪比较字符的进度。我们将编写一个小型程序，以几种不同的方式测试单词是否为回文，只需看看不同的语言特性如何影响代码的外观和工作。\n\
  \n### 16.5.1 使用 string 实现回文\n\n首先，我们尝试一个使用标准库的 `string` 并配合 `int` 索引来跟踪比较进度的版本：\n\
  \n点击此处查看代码图片\n\n```\nbool is_palindrome(const string& s)\n{\n        int first =\
  \ 0;                       // 第一个字母的索引\n        int last = s.length()−1;      //\
  \ 最后一个字母的索引\n        while (first < last) {          // 我们还没有到达中间\n            \
  \    if (s[first]!=s[last])\n                       return false;\n            \
  \    ++first;                    // 前移\n                −−last;                \
  \    // 后移\n        }\n        return true;\n}\n```\n\n如果我们到达中间且没有发现差异，则返回 `true`。我们建议你查看这段代码，以说服自己当字符串为空、只有一个字母、字符串有偶数个字母以及字符串有奇数个字母时，它是正确的。当然，我们不应该仅仅依靠逻辑来判断代码是正确的，我们还应该进行测试。我们可以这样测试\
  \ `is_palindrome()`：\n\n点击此处查看代码图片\n\n```\nint main()\n{\n        for (string s;\
  \ cin>>s; ) {\n                cout << s << \" is\";\n                if (!is_palindrome(s))\n\
  \                        cout << \" not\";\n                cout << \" a palindrome\\\
  n\";\n        }\n}\n```\n\n基本上，我们使用 `string` 的原因是“字符串非常适合处理单词”。将一个由空格分隔的单词读取到 `string`\
  \ 中是简单的，而且 `string` 知道自己的大小。如果我们想用包含空格的字符串来测试 `is_palindrome()`，可以使用 `getline()`\
  \ ( 11.5) 进行读取。那将会显示 *ah ha* 和 *as df fd sa* 是回文。\n\n### 16.5.2 使用数组实现回文\n\n如果我们没有\
  \ `string`（或 `vector`），导致我们必须使用数组来存储字符会怎样？让我们来看看：\n\n点击此处查看代码图片\n\n```\nbool is_palindrome(const\
  \ char s[], int n)\n         // s 指向一个 n 个字符数组的第一个字符\n{\n        int first = 0;\
  \                       // 第一个字母的索引\n        int last = n−1;                   //\
  \ 最后一个字母的索引\n        while (first < last) {           // 我们还没有到达中间\n           \
  \     if (s[first]!=s[last])\n                       return false;\n           \
  \     ++first;                     // 前移\n                −−last;              \
  \       // 后移\n       }\n       return true;\n}\n```\n\n为了测试 `is_palindrome()`，我们必须先将字符放入数组中。安全地做到这一点（即不导致数组溢出）的方法如下：\n\
  \n点击此处查看代码图片\n\n```\nistream& read_word(istream& is, char* buffer, int max)\n  \
  \      // 最多读取 max-1 个字符到 buffer\n{\n        is.width(max);          // 读取最多 max-1\
  \ 个字符\n        is >> buffer;             // 读取以空格终止的单词\n        return is;\n}\n\
  ```\n\n```\n\n适当设置 `istream` 的 `width` 可以防止下次 `>>` 操作发生缓冲区溢出。遗憾的是，这也意味着我们不知道读取是因为空格终止的还是因为缓冲区满了（谁还记得输入端\
  \ `width()` 的细节呢？）。\n\n点击此处查看代码图片\n\n```\nint main()\n{\n        constexpr int max\
  \ = 128;\n        for (char s[max]; read_word(cin,s,max); ) {\n                cout\
  \ << s << \" is\";\n                if (!is_palindrome(s,strlen(s)))\n         \
  \               cout << \" not\";\n                cout << \" a palindrome\\n\"\
  ;\n        }\n}\n```\n\n`strlen(s)` 调用在 `read_word()` 调用后返回数组中的字符数，而 `cout<<s` 输出数组中直到终止\
  \ `0` 的字符。\n\n**AA**\n\n我们认为这种“数组解决方案”比“**string 解决方案**”混乱得多，如果我们尝试认真地处理长字符串的可能性，情况会变得糟糕得多。请参见练习\
  \ 10。\n\n### 16.5.3 使用指针实现回文\n\n我们不使用索引来识别字符，而是使用指针：\n\n点击此处查看代码图片\n\n```\nbool\
  \ is_palindrome(const char* first, const char* last)\n         // first 指向第一个字母，last\
  \ 指向最后一个字母\n{\n         while (first < last) {           // 我们还没有到达中间\n        \
  \         if (*first!=*last)\n                         return false;\n         \
  \        ++first;                    // 前移\n                 −−last;           \
  \         // 后移\n         }\n         return true;\n}\n```\n\n这可能是迄为止最简洁的 `is_palindrome()`**，但其简单性是通过通过将获取正确范围的任务推给用户来实现的：\n\
  \n点击此处查看代码图片\n\n\n\n\n\n```cpp\nint main()\n{\n        const int max = 128;\n  \
  \      for (char s[max]; read_word(cin,s,max); ) {\n                cout << s <<\
  \ \" is\";\n                if (!is_palindrome(&s[0],&s[strlen(s)−1]))\n       \
  \                cout << \" not\";\n                cout << \" a palindrome\\n\"\
  ;\n        }\n}\n```\n\n为了好玩，我们这样重写了 `is_palindrome()`：\n\n点击此处查看代码图片\n\n```cpp\n\
  bool is_palindrome(const char* first, const char* last)\n        // first 指向第一个字母，last\
  \ 指向最后一个字母\n{\n        if (first<last)\n                return (*first==*last) ?\
  \ is_palindrome(first+1,last−1) : false;\n        return true;\n}\n```\n\n当我们重新表述回文（palindrome）的定义时，这段代码变得显而易见：如果一个单词的首字符和最后一个字符相同，并且去掉首尾字符后得到的子字符串也是回文，那么这个单词就是回文。\n\
  \n### 16.5.4 使用 span 处理回文\n\n基本上，`span` 仅仅是使用数组或指针的另一种不同且通常更好的替代方案。例如：\n\n点击此处查看代码图片\n\
  \n```cpp\nbool is_palindrome(span<char> s)\n{\n        return (s.size()) ? is_palindrome(s.data(),s.data()+s.size())\
  \ : true;     // 使用指针实现\n}\n```\n\n与与所有标准库类型一样，`span` 拥比书中包含更多的实用成员函数。在这里，我们使用了\
  \ `data()`，它返回指向 `span` 第一个元素的指针。空的 `span` 没有第一个元素，因此我们首先检查了 `s` 的大小。\n\n这个 `is_palindrome()`\
  \ 是如何从一种风格映射到另一种风格的示例，这里是从使用 `span` 的现代风格到使用指针的旧风格。在大型、跨多年的项目中，随着设施和潮流的演变，同时存在多种风格并不罕见。我们也可以反向映射：\n\
  \n点击此处查看代码图片\n\n```cpp\nbool is_palindrome(const char* first, const char* last)\n\
  {\n        return is_palindrome(span<char>{first,last−first});                 \
  \            // 使用 span 实现\n}\n```\n\n遗憾的是，没有简单且可靠的运行时测试来判断指针对 `first` 和 `last`\
  \ 是否合理，因此在整个过程中统一使用 `span` 通常会更好：\n\n点击此处查看代码图片\n\n```cpp\nbool is_palindrome(span<char>\
  \ s)\n{\n        if (s.size()<2)\n                return true;\n        return (s.front()==s.back())\
  \ ? is_palindrome(span<int>{s.data()+1,s.size()−2}) : false;\n}\n```\n\n### 练习题\n\
  \n在本章中，有两个练习题：一个是练习数组，另一个是以大致相同的方式练习 `vector`。完成这两个练习，并比较它们所需的工作量。\n\n#### 数组练习题：\n\
  \n[1] 定义一个全局 `int` 数组 `ga`，包含十个 `int`，初始化为 1, 2, 4, 8, 16 等。\n\n[2] 定义一个函数 `f()`，接收一个\
  \ `int` 数组参数和一个指示数组元素个数的 `int` 参数。\n\n[3] 在 `f()` 中：\n* 定义一个包含十个 `int` 的局部 `int`\
  \ 数组 `la`。\n* 将 `ga` 的值复制到 `la`。\n* 打印 `la` 的元素。\n* 定义一个 int 指针 `p`，并将其初始化为在堆（free\
  \ store）上分配的数组，其元素个数与参数数组相同。\n* 将参数数组的值复制到堆数组中。\n* 打印堆数组的元素。\n* 释放堆数组内存。\n\n[4]\
  \ 在 `main()` 中：\n* 以 `ga` 作为参数调用 `f()`。\n* 定义一个包含十个元素的数组 `aa`，并将其初始化为前十个阶乘值（1, 2*1,\
  \ 3*2*1, 4*3*2*1, 等）。\n* 以 `aa` 作为参数调用 `f()`。\n\n#### 标准库 `vector` 练习题：\n\n[1] 定义一个全局\
  \ `vector<int> gv`；初始化包含十个 `int`：1, 2, 4, 8, 16 等。\n\n[2] 定义一个函数 `f()`，接收一个 `vector<int>`\
  \ 参数。\n\n[3] 在 `f()` 中：\n* 定义一个与参数 `vector` 元素个数相同的局部 `vector<int> lv`。\n* 将 `gv`\
  \ 的值复制到 `lv`。\n* 打印 `lv` 的元素。\n* 定义一个局部 `vector<int> lv2`；将其初始化为参数 `vector` 的拷贝。\n\
  * 打印 `lv2` 的元素。\n\n[4] 在 `main()` 中：\n* 以 `gv` 作为参数调用 `f()`。\n* 定义一个包含十个元素的数组 `aa`，并将其初始化为前十个阶乘值（1,\
  \ 2*1, 3*2*1, 4*3*2*1, 等）。\n* 以 `aa` 作为参数调用 `f()`。\n\n#### 复习\n\n[1] `at` 是什么？\n\
  [2] 什么是数组？\n[3] 如何初始化数组？\n[4] 什么时候应该优先使用引用作为参数？\n[5] 什么时候应该优先使用 `span` 而不是指针？\n\
  [6] `std::array` 有不同？\n[7] 什么是范围检查？\n[8] 进行范围检查需要什么信息？\n[9] `nullptr` 可以做什么？\n[10]\
  \ 什么是 C 字符串？\n[11] 什么是回文？\n\n#### 术语\n\n| 数组 | 指针 | 回文 |\n| :--- | :--- | :--- |\n\
  | span | 数组 | 空 |\n| * | 解引用 | C 字符串 |\n| [ ] | strlen() | 范围 |\n\n#### 练习\n\n[1]\
  \ 编写一个函数 `to_lower(char*)`，将 C 字符串 `s` 中的所有大写字母替换为对应的小写字母。例如，**Hello, World!** 变为\
  \ **hello, world!**。不要使用标准库函数。\n\n[2] 编写一个函数 `char* str_dup(const char*)`，在分配的内存中复制一个\
  \ C 字符串。不要使用标准库函数。\n\n[3] 编写一个函数 `char* find_x(const char* s, const char* x)`，在\
