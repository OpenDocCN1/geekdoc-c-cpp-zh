  \ 或 `’A’`..`’F’`）吗？ |\n| `isupper(c)` | `c` 是大写字母吗？ |\n| `islower(c)` | `c` 是小写字母吗？\
  \ |\n| `isalnum(c)` | `c` 是字母或十进制数字吗？ |\n| `iscntrl(c)` | `c` 是控制字符吗（ASCII 0..31\
  \ 和 127）？ |\n| `isispunct(c)` | `c` 不是字母、数字、空白字符或控制字符吗？ |\n| `isprint(c)` | `c`\
  \ 是可打印的吗（ASCII ”..’˜’）？ |\n| `isgraph(c)` | `isalpha(c)` 或 `isdigit(c)` 或 `ispunct(c)`\
  \ 为真吗（注意：不是空格）？ |\n\n注意，这些分类可以使用“或”运算符 (`||`) 组合起来。例如，`isalnum(c)` 意味着 `isalpha(c)||isdigit(c)`；也就是说，“c\
  \ 是字母或数字吗？”此外，标准库提供了两个实用的函数来忽略大小写：\n\n| **字符大小** |\n| --- |\n| `x=toupper(c)` |\
  \ `x` 变为 `c` 的大写等价形式 |\n| `x=tolower(c)` | `x` 变为 `c` 的小写等价形式 |\n\n当你想要忽略大小写时，这些函数非常有用。例如，在来自\
  \ `Right`、`right` 和 `rigHT` 的输入中，它们可能意思相同（`rigHT` 最可能是不小心按了 Caps Lock 的结果）。在对这些字符串中的每个字符应用\
  \ `tolower()` 之后，我们得到的每个字符串都是 `right`。我们可以对任意的 `string` 这样做：\n\n点击此处查看代码图像\n\n```cpp\n\
  void tolower(string& s)              // 将 s 转换为小写\n         for (char& x : s)\n\
  \                  x = tolower(x);\n}\n```\n**AA** 我们使用引用传递（7.4.5）来实际修改 `string`。如果我们想保留旧字符串，可以写一个函数来创建副本。优先使用\
  \ `tolower()` 而不是 `toupper()`，因为这在某些自然语言（如德语）中效果更好，因为那里并不是每个字符都有大写等价形式。\n\n\n\n\n\
  # 格式化字符串\n\n格式化字符串依赖于一套小型编程语言来指定值的呈现方式。解释所有这些内容超出了本书的范围。如果你需要更多信息，可以参考更详细的源码，例如\
  \ [`https://en.cppreference.com/w/cpp/utility/format/formatter`](https://en.cppreference.com/w/cpp/utility/format/formatter)。\n\
  \n对于浮点数，§9.10.2](#ch09.xhtml_ch09lev2sec9) 中描述的选择表示为：\n\n*   `a`: 十六进制浮点数 (hexfloat)\n\
  *   `e`: 科学计数法 (scientific)\n*   `f`: 固定点位 (fixed)\n*   `g`: 通用格式，精度为 6\n*   `none`:\
  \ 通用格式，使用默认精度\n\n例如：\n\n点击此处查看代码图像\n\n```\nconstexpr double d = 1234.56789;\ncout\
  \ << format(\"format: {} − {:a} − {:e} − {:f} − {:g}\\n\", d, d, d, d, d);\n```\n\
  \n输出如下：\n\n点击此处查看代码图像\n\n```\nformat: 1234.56789 − 1.34a4584f4c6e7p+10 − 1.234568e+03\
  \ − 1234.567890 − 1234.57\n```\n\n我们还可以指定用于某个值的多少个字符位置。§9.10.2](#ch09.xhtml_ch09lev2sec9)\
  \ 中的“宽度示例”可以这样写：\n\n点击此处查看代码图像\n\n```\ncout << format(\"width: {} − {:8} − {:20}\
  \ −\\n\", d, d, d);\n```\n\n这输出为：\n\n点击此处查看代码图像\n\n```\nwidth: 1234.56789 − 1234.56789\
  \ −              1234.56789 −\n```\n\n精度通过小数点后的数字来指定：\n\n点击此处查看代码图像\n\n```\ncout\
  \ << format(\"precision: {} − {:.8} − {:.20} −\\n\", d, d, d);\n```\n\n这输出为：\n\n\
  点击此处查看代码图像\n\n```\nprecision: 1234.56789 − 1234.57 − 1234.567890000000034 −\n```\n\
  \n你可以组合格式化指令。例如：\n\n点击此处查看代码图像\n\n```\ncout << format(\"− {:12} − {:12.8f} − {:30.20e}\
  \ −\\n\", d, d, d);\n```\n\n### 尝试一下\n\n看看最后一条语句的输出是什么，并解释它。尝试其他格式。\n\n## 9.11 字符串流\
  \ (String streams)\n\n#### CC\n\n你可以使用 `string` 作为 `istream` 的源或 `ostream` 的目标。从\
  \ `string` 读取的 `istream` 称为 `istringstream`，而将写入的字符存储在 `string` 中的 `ostream` 称为\
  \ `ostringstream`。例如，`istringstream` 可用于从格式化字符串中提取值：\n\n点击此处查看代码图像\n\n```\nPoint\
  \ get_coordinates(const string& s)    // 从 \"(x,y)\" 中提取 {x,y}\n{\n         istringstream\
  \ is {s};         // 创建一个流以便从 s 中读取\n         Point xy;\n         char left_paren,\
  \ ch, right_paren;\n         is >> left_paren >> xy.x >> ch >> xy.y >> right_paren;\n\
  \         if (!is || left_paren !='(' || ch!=',' || right_paren!=')')\n        \
  \          error(\"format error: \",s);\n         return xy;\n}\n\n// 测试:\nauto\
  \ c1 = get_coordinates(\"(2,3)\");\nauto c2 = get_coordinates(\"( 200, 300) \");\n\
  auto c3 = get_coordinates(\"100,400\");              // 将调用 error()\n```\n\n如果我们尝试读取超出\
  \ `istringstream` 字符串结尾的内容，`istringstream` 将进入 `eof()` 状态。这意味着我们可以对 `istringstream`\
  \ 使用“常规输入循环”；`istringstream` 确实是一种 `istream`。\n\n#### AA\n\n当我们想要将实际的 I/O 与处理分离时，通常使用\
  \ `stringstream`。例如，`get_coordinates()` 的 `string` 参数通常源于文件（例如 Web 日志）、GUI 库或键盘。同样，我们在\
  \ `my_code()` 中组合的消息最终会被写入屏幕的某个区域。\n\n`ostringstream` 的一个简单用法是构造字符串。例如：\n\n点击此处查看代码图像\n\
  \n```\nint seq_no = 42;\nostringstream oss;\noss << \"number: \" << seq_no;\nstring\
  \ s = oss.str();\n```\n\n对于文件，我们通常希望填充零。在这种情况下，我们使用 `setfill` 和 `setw`：\n\n点击此处查看代码图像\n\
  \n```\nint seq_no = 42;\ncout << setfill('0') << setw(5) << seq_no; // 输出 00042\n\
  ```\n\n#### Drill\n\n1. 格式化字符串依赖于一套小型编程语言来指定值的呈现方式。解释所有这些内容超出了本书的范围。如果你需要更多信息，可以参考更详细的源码，例如\
  \ [`https://en.cppreference.com/w/cpp/utility/format/formatter`](https://en.cppreference.com/w/cpp/utility/format/formatter)。\n\
