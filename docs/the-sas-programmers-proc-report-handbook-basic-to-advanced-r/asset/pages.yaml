    Page breaks are not straightforward in other destinations. HTML output is designed
    to be viewed on a screen, and the amount of report that can be seen is limited
    by the size of your monitor. Scroll bars are used to see output that is extremely
    wide or long. Destinations such as PDF or RTF are true “paging” destinations and
    are meant to be printed. Printed output is limited to the size of the page. However,
    the amount of output that fits on one page is extremely variable. Titles, footnotes,
    logos, margins, font face, font size, and borders affect the output.


    PROC REPORT does not control the placement of output. Each destination is responsible
    for placement. Each destination used to output controls the paging. PROC REPORT
    does not know where a page break will occur in the non-Listing ODS destinations.
    The PAGE option, both on the DEFINE and BREAK statements, behaves differently
    for these destinations. PROC REPORT does not automatically insert a page break.
    Instead, it creates a new table. The destination determines whether the new table
    will be placed on a new page.


    When the PAGE option is used on a DEFINE statement, a vertical break will occur,
    that is, a new table is created. However, all observations for the first set of
    columns will be printed. Any variables designated as ID will also be printed with
    the second set of columns. For non-Listing destinations, the order of the results
