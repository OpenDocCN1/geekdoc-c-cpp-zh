  md: The SHOWALL option, explained in Chapter 1, is very useful if you have used
    the NOPRINT or NOZERO options. Hidden columns affect the column numbers needed
    inside of compute blocks. You can use this option to confirm you are using the
    correct column numbers. Hidden GROUP or ORDER variables can affect the GROUP or
    ORDER variables that are seen. Use the SHOWALL option to see hidden columns without
    having to alter any other statements in the PROC REPORT step.
