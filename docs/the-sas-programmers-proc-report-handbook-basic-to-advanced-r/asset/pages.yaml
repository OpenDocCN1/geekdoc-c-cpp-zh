    # Example 6.28a: Create a Format and Make Changes to the Style Template


    ```

    data crfmt;

    fmtname=''mydatef'';nhlo=''MS'';

    begin=''01JAN2003''D;

    finish=''31DEC2007''D;

    numg=intck(''qtr'',begin,finish);

    ummy=intck(''year'',begin,finish);

    do i=0 to numq;

    start=intx(''qtr'',begin,i);

    end=intx(''qtr'',begin,i,''E'');

    label=put(start,yyq6);

    output;

    do i=0 to numy;

    start=intx(''year'',begin,i);

    end=intx(''year'',begin,i,''E'');

    label=year(start);

    output;

    end;

    run;

    proc sort data=crfmt;

    by end descending;

    run;

    proc format cntlin=crfmt;

    run;

    proc template;

    def style mypearl;

    parent=styles.pearl;

    style Table from Table /\ncellpadding = 4pt

    borderspacing = 0pt

    borderwidth = 1pt

    frame = box

    rules = rows

    bordercolor = black

    bordercollapse = collapse;

    ```'
