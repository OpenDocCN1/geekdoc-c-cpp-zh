    # 6.8.3 Change Borders in HTML Output


    Borders in HTML do not always act like they do in other destinations. In general,
    you can change the color or thickness in STYLE<(location)>= options. You can also
    change them with inline formatting commands as long as the cell has text. (If
    the cell does not have text, add a non-breaking space so that HTML treats the
    cell like it has text.) The tricky task is removing borders in HTML.


    Example 6.4 inserted borders between PRODUCT_LINE groups. If you run the exact
    same code from that example and send the report to HTML, it looks like Output
    6.26.'
