    # 1.5 BREAK Statement


    The BREAK statement creates summary rows or table breaks at places in the report
    determined by the target and location values. The BREAK statement requires both
    a target and a location, as well as a forward slash (/). The statement does not
    have any required options. However, the BREAK statement will have no effect on
    the report if no options are specified.


    +   - target is a break variable (a variable defined as either GROUP or ORDER).
    Target controls when execution takes place.

    - location is either BEFORE or AFTER. Location specifies where the statement executes.


    # SUMMARIZE


    The SUMMARIZE option generates a row in the report that contains summary information.
    Statistics, ANALYSIS, and COMPUTED variables will be populated in the row. Target
    and any GROUP or ORDER variables to its left (on the COLUMN statement) will also
    be populated.


