    In Output 4.1 each statistic inherited the format of the ANALYSIS variable. The
    N statistic for TOTAL_RETAIL_PRICE is formatted with a dollar sign because of
    this behavior. The format can be controlled using a DEFINE statement for the N
    statistic and specifying a different format.


    You can define categorical variables as an ACROSS without having to specify anything
    else the COLUMN statement. PROC REPORT will automatically insert the N statistic,
    giving you a count for each category, as seen in Example 4.2 and Output 4.2.


    Example 4.2: Define a Variable as ACROSS


    ```

    proc data=orders;

    column customer_age_group;

    define customer_age_group / across;

    run;

    ```


    # Output 4.2: The N Statistic Is under the ACROSS Variable


    | Customer Age Group |

    | 15-30 31-45 46-60 61-75 |

    | years years years years |

    | 172 233 106 107 |


    # 4.2.2 Multiple Variables under an ACROSS Variable


    As nice as simple reports, you probably want more. The other method for putting
    multiple variables in the same column is to use the comma in the COLUMN statement,
    as we have seen, and put report-items after the comma. One of the report-items,
    usually the preceding the comma, is defined as ACROSS. Recall that when a variable
    is defined as ACROSS, its values become column headers. Under each of the ACROSS
    variable values are columns created by other report-items. The other report-items
    can be defined as GROUP, DISPLAY, ANALYSIS, or COMPUTED.


    In Example 4.3, the values of CUSTOM_AGE_GROUP become column headers. The summed
    values for TOTAL_RETAIL_PRICE and QUANTITY are'
