    # 7.7 ODS DOCUMENT and PROC DOCUMENT


    Controlling the number of nodes and their labels through PROC REPORT can'
  merge: -1
  pgno: 273
- img_proc: true
  md: 'be frustrating and difficult. In some cases, with the BREAK statement nodes,
    PROC REPORT has only a small amount of control. For some reports, the best thing
    to do is let PROC REPORT create the bare minimum number of necessary nodes, then
    restructure the table of contents and change the entry levels with the ODS Document
    destination and PROC DOCUMENT.


    The ODS destination is designed to store output objects in a document item store.
    From the stored information, you can produce output for multiple destinations
    without rer the original PROC or DATA step. In its most basic form, PROC DOCUMENT
    sends the output objects in a document item store to open any ODS destination
    with the REPLAY statement. However, PROC DOCUMENT is more powerful; it can be
    used to change the order of the output objects as well as to restructure the table
    of contents.


    The ODS DOCUMENT destination and PROC DOCUMENT are very powerful and complex tools
    in Base SAS. This book just touches the surface of how they can be used in conjunction
    with PROC REPORT. For more information on PROC DOCUMENT, please refer to SAS 9.4
    Output Delivery System: User’s Guide and the SAS 9.4 Output Delivery System: Procedures
    Guide Another great reference is the book PROC DOCUMENT by Example Using SAS by
    Michael Tuchman.


    # 7.7.1 ODS DOCUMENT Convention


    The syntax for the ODS DOCUMENT destination is the same as for other destinations.
    You must first open the destination, and then, after data and procedure steps,
    close the destination.


    ```

    ods document name=temp;

    proc report ...nrun;

    ods document close;

    ```


    The default behavior of the ODS DOCUMENT statement is Update access mode. Update
    appends any new procedure information to an already existing document item store.
    The code in this section will specify the Write access mode. This mode deletes
    anything in the item store and starts from scratch each time. The purpose is to
    avoid confusion regarding the contents of the item store. The document store will
    be called TEMP. By default, this will be stored in WORK. The name can be changed
    to something more meaningful and prefaced with a libref so that the document store
    is permanently stored.


    Also, please be aware the CUSTOMER_COUNTRY variable uses a format. For this code,
    the format and ODS DOCUMENT were created in the same SAS session. ODS DOCUMENT
    stores temporary formats as part of the document'
  merge: -1
  pgno: 274
- img_proc: true
  md: 'and those are used when the document is replayed. Permanent formats are not
    saved into the document. In your code, you must make sure SAS knows where user-defined-formats
    are located when you replay a document. This can be accomplished with PROC FORMAT
    or an OPTIONS statement with the FMTSEARCH option.


    # 7.7.2 PROC DOCUMENT Statements and Options


    In the next two sections, PROC DOCUMENT is used to display the contents of the
    document item store created by ODS DOCUMENT. The sections will use only the LIST
    statement. The LIST statement does exactly what the name implies – it writes a
    list of the contents of each entry in the document. On the LIST statement, two
    options are needed: LEVELS and DETAILS. The LEVELS = option will be set to ALL
    so that the output contains every entry and path in the item store. The DETAILS
    option is used, so that you can see the TYPE and LABEL variables for each path.


    In the final two sections of this chapter, the MAKE, SETLABEL, and COPY statements
    will be used. The MAKE statement is used to create a new directory. All changes
    made within the item store will be placed in a new directory to avoid confusion
    and inadvertent changes to the items created by PROC REPORT. SETLABEL is used
    to assign node labels. The COPY statement is used to copy items created by PROC
    REPORT to the new directory. Again, this is to avoid inadvertent changes. PROC
    DOCUMENT has other methods besides COPY that use less space, but for the sake
    of simplicity, the examples use only the COPY statement.


    PROC DOCUMENT allows RUN-Group processing. Interactively, you can submit multiple
    statements and execute them without terminating the procedure. Therefore, the
    RUN statement is very important; it must be used to ensure that all statements
    are executed. The procedure must end with a QUIT statement properly terminated.


