    # 6.6 Color in Headers


    Sections 6.4 and 6.5 discuss various ways of changing the color for cells within
    the details section of the report. This section addresses changing the color of
    the header cells. Header cell attributes can be changed only within a style element
    in PROC TEMPLATE or by using the STYLE(HEADER) = option on the PROC REPORT or
    DEFINE statements. Header attributes cannot be changed by a CALL DEF statement.


    # 6.6.1 STYLE(HEADER) = on PROC REPORT Statement


    As mentioned at the start of this chapter, there is an order of precedence when
