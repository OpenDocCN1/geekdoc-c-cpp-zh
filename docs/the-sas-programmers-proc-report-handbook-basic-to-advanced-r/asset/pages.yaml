    # # 3.3.4 Rows Created with a LINE Statement Versus a BREAK Statement


    LINE statements are used for writing text or summary values that have a general
    justification. In the examples in the previous sections, the text was center-justified
    or left-justified across the entire table. However, LINE statements are not useful
    when you need to align the text or summary values under specific columns. In LISTING
    output, you can create alignment using pointer controls such as the at-sign (@)
    and the plus sign (+). In ODS destinations, pointer controls do not work in a
    predictable manner because of font face, font size, margins, and other style attributes.


    Recall that LINE statements create one large, merged cell. Alignment is achieved
    by creating a row with columns that match the detail above it. In terms of cell
    creation, a row that is created with a BREAK or RBREAK statement looks just like
    a detail row. When alignment is a requirement, it is best to use a BREAK or RBREAK
    statement rather than a LINE statement.


    It is important to consider where you want the new row to appear in the report.
    If you require multiple rows, one for each section, you should use a BREAK statement.
    If you require only one row at the top or bottom of the report, an RBREAK statement
    will work. Depending on the situation, you might need to create a new variable
    in a DATA step to use as a break variable, as described in Section 3.3.3.


