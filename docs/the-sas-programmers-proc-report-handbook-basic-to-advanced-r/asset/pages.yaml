    sense for your data.


    The example in Chapter 3 uses CUSTOM_COUNTRY, PRODUCT_LINE, and ORDER_TYPE. The
    goal of using COMPLETEROWS is to generate rows for all possible values of ORDER_TYPE
    within each PRODUCT_LINE and CUSTOM_COUNTRY combination. However, the report contains
    rows for products that were not actually sold in a given country.


    COMPLETEROWS is designed to generate all possible combinations. PROC REPORT does
    not have a method for indicating that all possible combinations should be generated
    for only values of one GROUP variable. You might want a report that contains all
    ORDER_TYPE values, but only for country and product combinations that exist in
    the data. To generate the desired report, you have to pre-process the data. As
    in previous examples, the most straightforward way of getting the desired report
    is to insert rows into the data set for combinations that do not exist. Again,
    PROC MEANS is very useful in creating the desired combinations.


    Example 5.9 the two outside grouping variables, CUSTOM_COUNTRY and PRODUCT_LINE,
    on a BY statement instead of a CLASS statement. Placing the variables on the BY
    statement ensures that only country and product combinations that already exist
    will be present in the output data set. The BY statement does require you to sort
    the first data.'
