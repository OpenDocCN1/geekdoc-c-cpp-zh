    Output 7.1: Default TOC Nodes and Labels


    ![](img/f6ee976690c39d71850f5ac8b0a47c60_264_0.png)


    +   1. **The procedure label:** The first node, the procedure label, is controlled
    by the ODS PROCLABEL statement. The label can be assigned to any string value.
    The label can be set to blank, but the node cannot be eliminated completely unless
    you use PROC DOCUMENT, which is discussed later in this chapter.


    +   2. **The report label:** The second node is controlled by the CONTENTS= option
    on the PROC REPORT statement. The text value is static. It can hold only one value.
    It can be eliminated completely by assigning a null value, CONTENTS= ".


    +   3. **The table label:** The third node always defaults to “Table 1”. This
    node is controlled by the CONTENTS= statement. The BREAK statement must also have
    the PAGE option specified to change the node label. This means you must have a
    paging variable. If you do not need table breaks but to control the node label,
    you can assign the paging variable to the same value for every observation in
    the input data set. The text value is static. It can hold only one value. The
    node can be eliminated completely by assigning a null value, CONTENTS= ".


    Example 7.2 changes the default labels. The changes are displayed in Output 7.2.
    The location value on the BREAK statement must be BEFORE.


    # Example 7.2: Change Default Node Labels


    ```

