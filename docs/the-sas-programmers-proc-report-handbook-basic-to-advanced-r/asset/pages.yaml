    # 2.3 Compute Blocks


    The REPORT, TABULATE, and PRINT procedures are considered the reporting procedures
    in Base SAS. PROC REPORT is unique among these procedures because it can manipulate
    the incoming data and the outgoing values using a compute block. Blocks start
    with a COMPUTE statement and end with an ENDCOMP statement. Any number of statements
    can be inside the compute block, including LINE and CALL DEFINE statements. Also,
    DATA step statements can be used inside compute blocks, as assignment, IF/THEN,
    and ARRAY statements.


    PROC REPORT builds the report one row and one column at a time. Compute blocks
    are executed as the report is built. PROC REPORT does not require compute blocks.
    Compute blocks are necessary only when you need to create a new report-item, change
    a value, or make some other modification to the final report. They are also necessary
    for finer control of style attributes, changing the format or foreground color
    of one cell within a column or row.


    This section describes how the report-items and options on the COMPUTE statement
    dictate what the compute block can do. The section also explains the execution
    order of the compute block types. Finally, each compute block is discussed.


    Compute blocks are used in many examples throughout the book, you should use this
    section as a reference. This section does not contain example code for each compute
    block type. Refer to the program Program2_compute.sas (found on the Author’s Page)
    for small examples of each compute block type. As you read through the book refer
    to this section to help you understand how the compute block affects the report
    that is created in each example.


    # 2.3.1 COMPUTE Statement'
