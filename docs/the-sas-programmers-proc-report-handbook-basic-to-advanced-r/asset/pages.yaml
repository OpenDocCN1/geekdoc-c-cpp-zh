    8.4 General Tips


    # ## 8.1 Introduction


    No matter how well you know your data or how careful you are when writing your
    PROC REPORT code, something might still go wrong. This chapter discusses errors,
    warnings, and notes that PROC REPORT will generate if something is wrong. It also
    demonstrates how you can view the value of temporary variables to ensure they
    contain the value that you expect. Finally, the chapter provides general debugging
    tips.


    # ## 8.2 Errors, Warnings, and Notes in the Log


    This section includes a description of various errors, warnings, and notes that
    PROC REPORT might generate. The focus is on PROC REPORT specific messages. Messages
    for global statements or common syntax errors are not discussed. Also, this is
    not an exhaustive list of all possible messages PROC REPORT might generate, but
    it does cover frequently encountered messages. The messages are categorized by
    which statement generates the error.


    # ### 8.2.1 DEFINE Statement


    The following messages are written to the log based on issues with one or more
    DEFINE statements.


    **ERROR:** XXXX conflicts with earlier use of XXXX.


    PROC REPORT does not allow two different usages for the same report-'
  merge: -1
  pgno: 289
- img_proc: true
  md: 'item. For example, a variable cannot be used as both GROUP and ACROSS. This
    error is most often generated when an alias is the COLUMN statement, but defined
    with another usage. An alias is most useful when you have an ANALYSIS variable
    that you want multiple statistics for, such as mean, minimum, maximum, or when
    you want to use a variable twice in the same manner but formatted two different
    ways.


    Solution:


    The workaround for this error is to create a duplicate variable on the input data
    set. The new variable contains the same information as the original variable but
    can deined with any usage in the PROC REPORT step.


    # ERROR: The width of XXXX is not between 1 and NNN. Adjust the column width or
    line size.


    This error is generated when the WIDTH= option or the length of a report-item
    is longer than the LINESIZE system option. This only affects the ODS Listing destination.
    If multiple destinations are open, the report will be successfully created in
    the other destinations.


    Solution:


    To avoid this error, close the ODS Listing destination if it is not needed. Otherwise,
    specify WIDTH= on a DEFINE statement for the report-item generating the error
    and set it to a value less than the value of LINESIZE. Also, increase the LINESIZE=
    system option if it is not at the highest possible value.


    # ERROR: There is more than one ANALYSIS usage associated with the column defined
    by the following elements.


    A comma in the COLUMN statements means that you intend to stack columns. The error
    is generated when a comma is present but no variables have been defined with a
    usage of ACROSS.


    Solution:


    To eliminate the error remove the comma from the COLUMN statement or change the
    usage to ACROSS for one of the report-items next to the comma.


    # ERROR: There is no statistic associated with XXXX


    When there is a DISPLAY under an ACROSS, there needs to be a statistic associated
    with it.


    Solution:


    The DISPLAY usage should be changed to GROUP or the N statistic'
