    value might be ok if you do not expect a missing value, you need to check the
    log, check your syntax, and especially check to see whether you have referenced
    report-items that are to the right of the report-item on the COLUMN statement.


    The solution for this problem is to change the report-item to COSTPRICE_PER_UNIT.
    It does seem strange to use COSTPRICE_PER_UNIT on the COMPUTER statement when
    you are trying to calculate a value for TOTAL_COST. However, as the third report-item
    on the COLUMN statement, the values are available for all report-items needed
    in the assignment statement. When it creates the TOTAL_COST column, PROC REPORT
    will simply assign its value as missing, the default value, because it has not
    encountered another value that it should be assigned to. When PROC REPORT creates
    the COSTPRICE_PER_UNIT column associated with that column. Within the compute
    block, the assignment statement will be evaluated and the missing value for TOTAL_COST
    will be replaced with the calculated value. Example 2.2 demonstrates the solution
    code.


