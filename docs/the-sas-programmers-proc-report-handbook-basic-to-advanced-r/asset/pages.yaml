    # Insert a BACKGROUND Image


    An image can also be set as the background image of a cell using the BACKGROUNDIMAGE=
    attribute. The BACKGROUNDIMAGE= attribute is valid only in a select number of
    ODS destinations, which limits its usefulness. The size of the image versus the
    width and height of the cell also plays an important role in the final appearance
    of the report. Images that are larger than the cell will look truncated. Images
    that are smaller than the cell might repeat in order to fill the entire cell.
    For images that you intend to use as background images, it is best to create them
    with a specific height and width, and then apply that same height and width to
    the cell in the PROC REPORT.'
