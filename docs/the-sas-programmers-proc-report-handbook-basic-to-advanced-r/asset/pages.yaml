- img_proc: true
  md: '# Preface


    With PROC REPORT you can sort and transpose data. You can calculate statistics
    and create new variables. You can concatenate character variables and multiply
    numeric variables. No other procedure comes close to this kind of versatility.
    Because PROC REPORT acts like no other procedure in Base SAS, it might be the
    hardest to learn and understand. It can be both frustrating and confusing.


    In this book I try to show you the power of PROC REPORT and help you imagine all
    of the things you can do with it. I also try to show you the pitfalls that make
    you want to throw your hands in defeat. Programmers are no longer tasked with
    just calculating a number; you must create output in a certain form and must be
    aesthetically pleasing. The output must be suitable for all levels of management
    and areas of expertise. Therefore, all programmers should learn how to use PROC
    REPORT because at any time, they might be asked to create a report. I admit it
    takes time to learn all the nuances, but it is well worth the time spent.


    The best advice I can give you about learning PROC REPORT is to just try. Write
    a piece of code and see if it works. If the code works, build on it. If the code
    doesn''t work, take one thing out at a time to see where it breaks. The best way
    to learn PROC REPORT is to use it.


    I want to thank you in advance for reading this book. I have attempted to put
    everything I know about PROC REPORT in this book. I hope the information in these
    pages will deepen your knowledge and understanding of PROC REPORT and expand your
    programming skills.'
  merge: -1
  pgno: 16
