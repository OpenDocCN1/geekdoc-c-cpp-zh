  md: "# # Chapter 7: Table of Contents – How to Manipulate with CONTENTS = and PROC\
    \ DOCUMENT\n\n+   - 7.1 Introduction\n- 7.2 Default Nodes\n- 7.3 BY-Variable Nodes\n\
    - 7.4 DEFINE Statement CONTENTS =\n- 7.5 BREAK Statement CONTENTS =\n- 7.6 RBREAK\
    \ Statement CONTENTS =\n- 7.7 ODS DOCUMENT AND PROC DOCUMENT\n  - 7.7.1 ODS ODS\
    \ DOCUMENT Convention\n  - 7.7.2 PROC DOCUMENT Statements and Options\n  - 7.7.3\
    \ Default Items\n  - 7.7.4 BY-Variable Item Labels\n  - 7.7.5 Parent Node With\
    \ Multiple Child Nodes\n  - 7.7.6 Combine Multiple PROC REPORT Steps Under One\
    \ Node\n\n# ## 7.1 Introduction\n\nThe final step to mastering PROC REPORT is\
    \ learning how to control the Table of Contents and labels. A table of contents\
    \ is a very useful and necessary tool for navigating through a long, multipage\
    \ report. PROC REPORT has the ability to control the entries in the table of contents.\
    \ PROC REPORT has the CONTENTS= option on many statements that allows you to change\
    \ the node labels. This chapter will examine the various uses of the CONTENTS=\
    \ option. Then the chapter will explore how you can use ODS Document destination\
    \ and PROC DOCUMENT to change the content nodes created by PROC REPORT and replay\
    \ the report with a new table of contents.\n\n# ## 7.2 Default Nodes\n\nThe default\
    \ table of contents that PROC REPORT creates has three node levels. The first\
    \ node is the procedure label. The second node is the report label. The third\
    \ node is the table label. The first two levels are straightforward and easily\
    \ manipulated. The third node level is the hardest"
  merge: -1
  pgno: 263
- img_proc: true
  md: 'understand and control. Example 7.1 produces the default table of contents
    nodes.


    # Example 7.1: Default TOC Nodes


    ```

    proc report data=orders;

    column product_line quantity total_retail_price;

    define product_line / group;


    run;

