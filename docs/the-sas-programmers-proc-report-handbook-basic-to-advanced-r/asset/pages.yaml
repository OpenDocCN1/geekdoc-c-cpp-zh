    # 4.1 Introduction


    As mentioned in Chapter 1, you can stack statistics or put one variable another
    with the ACROSS usage. ACROSS variables transpose your data without changing the
    data set. The topic of PROC REPORT code using ACROSS variables is often handled
    as a separate category in the procedure documentation and in other samples, and
    this book is no different. Reports'
  merge: -1
  pgno: 128
- img_proc: true
  md: 'that use ACROSS variables deserve their own chapter because ACROSS variables
    can drastically change the code.


    Using ACROSS variables changes how you have to think about the report, how you
    reference variables, and how you have to code the PROC REPORT step. Simply, these
    kinds of reports are different. As you read this chapter, keep in mind that each
    of column of an ACROSS variable is constructed entirely independent of the other
    columns.


    This chapter starts by demonstrating standard reports showing how to construct
    the COLUMN statement and how to refer to columns in compute blocks. Calculating
    percentages is also covered. The key to percentages is defining the denominator
    because the value changes based on what you are trying to convey.


    Along with understanding how to construct the COLUMN statement and reference columns
    in a compute block, you must also understand how ACROSS variable alters the header
    section of the report. The chapter describes how the header section is built with
    ACROSS variables and how to manipulate header text.


    Formats play an important role in ordering the ACROSS variable values and inserting
    columns for subt. This chapter demonstrates hiding columns and inserting vertical
    table (page) breaks. The chapter ends with examples using macro processing to
    apply changes to columns under an ACROSS variable.


    # 4.2 Standard Reports


    This section of the chapter demonstrates various ways multiple pieces of information
    share a column. You can stack statistics under one column heading. You can also
    define a variable as ACROSS and put a statistic or another variable underneath
    it. New report-items can be created and percentages calculated.


    # 4.2.1 Stack a Statistic


    PROC REPORT allows you to stack multiple statistics for an ANALYSIS variable under
    one heading. The syntax on the COLUMN statement is key to this behavior. The ANALYSIS
    variable is followed by a comma, and the name of the statistic. Multiple statistics
    can be placed inside parentheses. The DEFINE statement is not necessary for this
    kind of report. Example 4.1 shows the syntax, Output 4.1 shows the result.


    Example 4.1: Stack Statistics under ANALYSIS Variables


    ```

    proc report data=orders;

    ```'
  merge: -1
  pgno: 129
