  md: '# Tip #7: Use the LIST Option


    As discussed in Chapter 1, the LIST option is most useful when creating output
    for the Listing destination, but it can be handy when you need to confirm the
    label, format, and width PROC REPORT is using for a variable.


    # Tip #8: Remove Unnecessary Options


    Use only the options that you need. PROC REPORT code can become long and complicated
    even without unnecessary code. Including options that do not impact the output
    are distracting and add clutter.'
