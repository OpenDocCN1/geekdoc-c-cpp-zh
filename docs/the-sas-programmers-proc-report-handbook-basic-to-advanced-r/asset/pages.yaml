    Manipulating borders is discussed in detail in Chapter 6.


    # 5.8.2 Merge Horizontally


    Other reports require horizontally merged cells, for displaying confidence intervals
    or p-values. The vertical border between cells can be removed or changed to white,
    as was done in the previous example. However, the value cannot be forced to span
    the width of both cells, as this method is often not adequate.


    The alternative method is to use two or more PROC REPORT steps to create the output.
    Each step will be responsible for creating a certain number of columns. The step
    that creates the rows with the merged-cell look will create fewer columns than
    the other step.


    For example, a report contains five columns with the last row containing two merged
    cells – columns 2 and 3 looked merged and columns 4 and 5 look merged. One PROC
    REPORT step will create the output with five columns. Another PROC REPORT step
    will create just three columns.


    The CELLWIDTH attribute is extremely important in this method. A width will need
    to be specified for all columns; the default width created by the'
