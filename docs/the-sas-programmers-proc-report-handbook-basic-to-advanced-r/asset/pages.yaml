    # 4.4.3 Nesting ACROSS Variables


    PROC REPORT does not have a limitation on the number of variables that can be
    used as an ACROSS or the number of categories of variable. Nor does it restrict
    the number of report-items stacked underneath the ACROSS. The restricting factor
    is usually the data or the point at which the report becomes unreachable.


    The previous examples used variables that had to two distinct categories. This
    made the code easier to understand and the output fit on a page. However, reports
    that are sent to HTML or Excel do not have page restrictions and ODS attributes
    can be used to freeze column to make scrolling easier. For these destinations,
    it is easier to rationalize a variable that has more categories, using more report-items
    underneath, or nesting ACROSS variables.


    Example 4.24 explores more than one ACROSS variable. The syntax for using multiple
    variables as ACROSS is straightforward. The two important steps are adding a comma
    to the COLUMN statement and specifying ACROSS on the DEFINE statement. Output
    4.19 displays the results of using two ACROSS variables.


    Example 4.24: Nest One ACROSS Variable under Another ACROSS'
