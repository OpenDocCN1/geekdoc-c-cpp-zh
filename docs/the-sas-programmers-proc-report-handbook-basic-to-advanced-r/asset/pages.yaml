    # 7.7.4 BY-Variable Item List


    When a BY statement is used, a subdirectory is added to the document store

    under the main directory for each value of the BY variable. The sequence number
    is an integer that is unique for

    each subdirectory or entry. Multiple BY variables do not change the

    subdirectory structure. They do increase the number of subdirectories the

    item store contains there will be one for each combination of the BY-

    variable values.


    For Example 7.16, the variable CUSTOMER_AGE_GROUP has five unique

    values. Therefore, five subdirectories are added. The first subdirectory is

    called Group1#1, the next is called Group2#1, and so on. Under each

    BY value directory is another subdirectory, and in that subdirectory is the

    table output object. The results are shown in Output 7.16.


    Example 7.16: Include a BY Statement in the PROC REPORT Step


    ```

    proc sort data=orders;

    by customer_age_group;

    run;

    ods document name=temp(write);

    proc report data=orders;

    by customer_age_group;

    column product_line quantity total_retail_price;

