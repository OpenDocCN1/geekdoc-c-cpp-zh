    # 5.5 Use Information from a Variable in Header and Data Sections


    PROC REPORT is very good at a number of different tasks. It can consolidate multiple
    observations into one row or one column. It can order data in a specific manner.
    STATISTICS PROC cannot create both rows and columns from the same variable, which
    means that you cannot assign two different tasks to the same variable.'
