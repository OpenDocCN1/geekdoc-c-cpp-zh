    It is important to pay attention to which variable is placed on the COMPUTE statement
    and which column is referenced as the first argument of the CALL define statement.
    Remember from Chapter 2 that PROC REPORT works to left right based on the order
    of the report-items in the COLUMN statement. You must be sure you are not referencing
    a report-item that is to the right of the one on the COMPUTE statement.


