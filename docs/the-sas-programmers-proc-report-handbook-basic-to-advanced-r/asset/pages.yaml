    When TOT, the alias of TOTAL_RETAIL_PRICE, is placed at the end of the

    COLUMN statement, the report-item in the COMPUTE statement has to

    change. It needs to be TOT so its values are available. This is

    demonstrated in Example 4.13.


    # Example 4.13: Calculate Percentages Using an Alias


    ```

    proc report data=orders;

