    # # 4.3.6 Counts As Part of ACROSS Values


    PROC REPORT creates the header text based on the values of the ACROSS variable.
    The text of these headers cannot be changed inside of PROC REPORT. For some reports,
    you might want the header text to be more dynamic, like including the overall
    count for that category as part of the value.


    The header text can be changed in one of three ways:


    +   1. Change the value of the ACROSS variable in the data set.

    2. Create a format for the ACROSS variable with the label containing the (n=xx)
    text.

    3. Change the structure of your data so that each value of the current ACROSS
    variable is its own, in other words transpose the data. Then, in the DEFINE statements,
    assign a label that includes (n=XX).


    Of these choices, the second one, creating a format, is probably the easiest and
    most dynamic. Each time the program is executed, the counts can be determined
    and the format re-created.


    PROC MEANS/SUMMARY or PROC SQL are capable of creating counts and prevent the
    need for hardcoding. Example 4.20 uses PROC MEANS to create the counts for the
    header text. The counts are part of the header in Output 4.16.


    Example 4.20: Put Category Totals in Header Text'
  merge: -1
  pgno: 150
- img_proc: true
  md: '```

    proc means data=orders nway noprint;

    class customer_gender;

    output out=cnts n=count;

    run;

    data fmt;

    set cnts;

    length label $50;

    start = customer_gender;

    label = catt(customer_gender, "n=", count,"");

    type = "C"

    fmtname = ''gencnt'';

    keep start label type fmtname;

    run;

    proc format cntlin=fmt;

    run;

    proc report data=orders;

    column customer_age_group customer_gender,quantity;

    define customer_age_group / group;

    define customer_gender / across format=$gencnt;

    ```


    +   1 Create a data set containing unique values of CUSTOMER_GENDER and the count
    of each values. CUSTOMER_GENDER ACROSS variable will be be the subsequent PROC
    REPORT step.

    2 Create a data set that contains the necessary variables for a format. Concatenate
    the CUSTOMER_GENDER and COUNT values into the LABEL variable.

    3 Use the CNTLIN= option on the PROC FORMAT statement to reference a variable
    set with the format information.

    4 Specify the format name on the DEFINE statement for the ACROSS variable CUSTOMER_GENDER.


