    # 2.6.3 Undesired Repeating Values


    For some reports, the value of a GROUP or ORDER variable might repeat when you
    do not want it to. Remember that PROC REPORT works to right and groupings are
    nested inside GROUP/ORDER variables to the left. When the value of a GROUP/ORDER
    variable at the beginning of the COLUMN statement changes, the value of the GROUP/ORDER
    variables to its right will be displayed.'
