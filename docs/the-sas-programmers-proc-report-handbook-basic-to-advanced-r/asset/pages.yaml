    # MISSING


    This option instructs PROC REPORT to include observations from the input data
    set that have a value of missing for a GROUP, ORDER, or ACROSS report-item. When
    used on the DEFINE statement this option impacts only missing values for specific
    report-item. The MISSING option does not affect the inclusion of missing observations
    for ANALYSIS report-items.


    # ORDER =


    This option can be used to change the default sort order, which is FORMATTED.
    Report-items defined as GROUP, ORDER, or ACROSS automatically sort the values.
