- img_proc: true
  md: 'because PROC REPORT does not create the statistic or structure by default.
    However, the reports can still be produced by PROC REPORT. Inside of the procedure,
    percentages can be calculated, informational text can be added for certain sections
    of the report, and additional rows of statistics can be included.


    The last section in this chapter demonstrates how to create reports that require
    special consideration of the data that you have, like really wide reports or missing
    data categories. When producing a, you must know your data. Your data might dictate
    how you write the PROC REPORT step and whether you must have additional code to
    generate the final report.


    In general, this chapter starts with the least complicated examples and builds
    to the most complicated examples. The programs in each section use variables that
    best demonstrate the type of report or technique discussed in that section. Some
    variable combinations are chosen because they produce the shortest amount of output,
    not because they represent the most desirable combinations. Once you have learned
    the techniques, you can expand the code for larger data sets with more variables
    and observations.


    # 3.2 Standard Reports


    The word “standard” has been chosen to describe the reports created in this section
    because PROC REPORT can create them by default without any extra coding. In this
    context, standard does not mean correct or typical. Standard reports include detail
    reports and summary reports based on values present in the input data set. Detail
    reports have one row for each observation in the data set. Summary reports include
    a row of aggregate values, or summarized values. Summary reports can include one
    GROUP/ORDER variable or many GROUP/ORDER variables.


    This section includes examples of creating basic reports, ordered reports, and
    grouped reports. The examples demonstrate how to create new variables to be included
    in the report and how to insert summary rows.


    # 3.2.1 Create a Basic Report


    A basic report is one where you let PROC REPORT and the ODS destination do all
    of the work. You just want to see the data. Therefore, you accept how PROC REPORT
    handles each variable type, the alignment, the coloring, and so on. You use the
    COLUMN statement to specify the variables from the input data set that you want
    to specify the order in which you want to see them.


    In Example 3.1, the report is restricted to the six report-items on the COLUMN
    statement. Accepting the default behavior means that this report is simply a'
