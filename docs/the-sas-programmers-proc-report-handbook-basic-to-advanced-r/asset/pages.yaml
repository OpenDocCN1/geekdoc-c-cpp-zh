    # 1.6 RBREAK Statement


    The RBREAK statement creates a summary row. The summary row contains the overall
    (grand total) values of ANALYSIS and COMPUTED report-items. When a BY statement
    is used, the overall summary values will be for each BY group. The RBREAK statement
    requires a location as well as a forward slash (/). The statement does not have
    any required options; however, the RBREAK statement will have no effect on the
    report if no options are specified.


    location is either BEFORE or AFTER. It specifies where the statement executes.


    SUMMARIZE


    This option generates a row in the report that contains summary information. Statistics,
    ANALYSIS, and COMPUTED values will be populated in the row.


