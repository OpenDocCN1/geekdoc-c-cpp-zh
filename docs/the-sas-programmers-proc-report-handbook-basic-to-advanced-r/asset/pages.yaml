- img_proc: true
  md: '# About This Book


    # Purpose


    The purpose of this book is to describe every aspect of PROC REPORT. The book
    reviews options and syntax and how the data is set behind the scenes. Most importantly,
    it provides many examples of the kinds of reports programmers need to create every
    day. The book explains why specific options and statements are required for certain
    kinds of reports and provides the most efficient code for generating the desired
    reports.


    # Is This Book for You?


    This book is meant for SAS programmers of all skill levels in all industries who
    need to create reports. PROC REPORT can create easy, bland reports, but programmers,
    no matter the skill level, are rarely tasked with creating such reports. This
    book will help you increase your skill level and proficiency in generating the
    reports you need.


    # Prerequisites


    Basic knowledge of SAS programming is necessary to understand the concepts and
    examples in this book. You should understand data structure and formats. You need
    a general understanding of what the Macro Facility is and you should know the
    basic concepts of sending output to Output Delivery System (ODS) destinations.


    # Scope of This Book


    This book is entirely about PROC REPORT. It covers everything there is to know
    about PROC REPORT.


    Although it includes the FORMAT, TRANSPOSE, MEANS, SQL, and DOCUMENT procedures,
    they are not covered in depth in this book. The syntax of those procedures is
    described only enough to convey the reason the procedure is needed in conjunction
    with PROC REPORT. The book also includes use of the Macro Facility.


    PROC REPORT is designed specifically for generating reports; therefore, ODS plays
    a major role in the final appearance of the report. A full description of the
    syntax and use of ODS is beyond the scope of this book. However, where necessary,
    the behavior of a certain destination is explained as it pertains to PROC REPORT.'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# About the Examples


    # Software Used to Develop the Book’s Content


    The examples in this book were developed using Base SAS 9.4TS1M3. The examples
    can be run in 9.4TS1M0-9.4TS1M3, with all available hot fixes installed.


    The examples should work in SAS 9.3 as well, but please note: if the example programs
    are run interactively in 9.3, the NOWD option should be added to the PROC REPORT
    statement. This book is also compatible with SAS University Edition.


    # Example Code and Data


    The Orion data set used throughout this book is the examples with the permission
    of Sean O''Brien and Eric Rossland. The majority of the examples in this book
    use one data set, the other data sets are either a subset or restructuring of
    the ORDERS data set. Using just one data set should limit the confusion of having
    to understand the data structure of multiple data sets.


    +   ORDERS contains purchase order data. The data set is unique at CUSTOMER_ID,
    ORDER_ID, and PRODUCT_ID level. A customer can have multiple orders and within
    each unique order, the customer can purchase multiple products.


    The QUANTITY variable contains the quantity ordered of a specific product.


    The SUMINFO variable contains one record for each CUSTOMER_NAME value.


    The SUMINFO variable was created by running PROC MEANS step on the ORDERS data
    set. It contains one record for each CUSTOMER_COUNTRY-CUSTOMER_GROUP combination.


    The TRAN_ORDERS variable was created by running PROC TRANSPOSE step on the ORDERS
    data set. It contains one record for each CUSTOMER_ID-CUSTOMER_NAME combination
    and has one variable for each order the customer placed.


    The ORDERS_3OBS variable contains three observations and four variables. The variables
    match those from the ORDERS data set that are used throughout the book.


    To use the example programs from the author page, you need to store the five data
    sets described above in the WORK location. You also need to submit the createfmts.sas
    program. The program creates two formats, called $cntry and'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'type, used throughout the book. The formats should be stored in a catalog in
    the WORK location as well.


    You do not have to read this book cover to cover to gain valuable knowledge about
    PROC REPORT. Each example demonstrates one technique and a specific outcome. However,
    the examples and chapters do build on each other, so you might find it helpful
    to read entire sections or chapters in order to fully understand the purpose of
    each example.


    You can access the example code and data for this book by linking to our author
    page at http://support.sas.com/publishing/authors. Select the name of the author.
    Then, look for the cover thumbnail of this book, and select Example Code and Data
    to display the SAS programs that are included in this book.


    If you are unable to access the code through the website, send email to saspress@sas.com.


    # SAS University Edition


    If you are using SAS University Edition to access data and run your programs,
    then please check the SAS University Edition page to ensure that the software
    contains the product or products that you need to run the code: http://support.sas.com/software/products/university-edition/index.html.


    # Output and Graphics Used In This Book


    The output in this book is sent to many of ODS destinations, including PDF, HTML,
    RTF, Tagsets.ExcelXP, and the Excel destination. Most of the output is sent to
    the PDF destination. When another destination is used, it is noted with the example.


    # Terminology Used in This Book


    The terms report-item, variable, and column are used interchangeably throughout
    the book and the term that is used is determined by the context. The term report-item
    distinguishes the type of compute block or required syntax for a specific statement.
    Otherwise, the term variable or column is used.


    The terms location and target are italicized to distinguish how variables are
    used on BREAK, RBREAK, and COMPUTE statements. Location controls the placement
    of the break rows or where a block executes. Target controls when the execution
    takes place. This book capitalizes the value of a specific location or target
    when referred to within text.


    The words group, order, and across are capitalized when the context refers to'
