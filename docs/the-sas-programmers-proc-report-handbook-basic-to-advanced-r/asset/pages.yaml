    The COLUMN statement has two analysis variables, QUANTITY and TOTAL_RETAIL_PRICE.
    Each one is followed with comma, and the desired statistics inside parentheses.


    # Output 4.1: Multiple Statistics Appear under Each ANALYSIS Variable Header


    | Quantity Ordered | Total Retail Price for This |

    | min max sum | n mean sum |

