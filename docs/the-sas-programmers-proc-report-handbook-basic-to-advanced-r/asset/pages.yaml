  md: '# 2.8 Date Variables


    SAS variables are numeric; they are often formatted so that we understand the
    value, but they are still numeric. Date variables are often thought of as their
    own category, PROC REPORT simply sees them as numeric and will sum the values
    by default. Performing calculations on dates, like determining an interval, might
    be needed in certain reports, but for other reports, summed date values are not
    logical. A good rule of thumb is to always have a DEFINE statement for date variables.
    Often date variables are needed as GROUP, ORDER, or ACROSS variables. For other
    reports, date variables should be defined as DISPLAY. Defining them as DISPLAY
    serves two purposes:


    +   1. A DISPLAY variable is not populated in summary rows. This will prevent
    nonsensical date values from being placed on the summary row.

    2. Inside of a compute block, you will not need to refer to the variable with
    the compound name like DATE.SUM.


    For reports that have a date variable defined as GROUP/ORDER/ACROSS, the values
    will be sorted by their formatted value. This most likely not give you the desired
    results, because April will be placed before January. Use the ORDER = option and
    set it to INTERNAL so that the dates will be output in chronological order. Section
    2.10 discusses sorting in PROC REPORT.


    # 2.9 Temporary Variables


    PROC REPORT allows the creation and use of temporary variables, sometimes called
    “DATA step variables.” You might also see them referred to as “hold variables.”
    These are variables that are not on the input data set nor are listed on the COLUMN
    statement. The variables are created and used inside compute blocks and are not
    available anywhere else. They are not considered part of the report and therefore
    are not included in the output data set, if one is created.


    Temporary variables behave much the same way that retained variables behave inside
    of a DATA step. Temporary variables are initialized to a value and maintain that
    value until reset to another value. They are not re-initialized or set to missing
    on each row.'
