    # 4.4.5 Vertical Page Breaks


    ODS destinations to keep columns together when they share a spanning header. The
    destination will break the table prior to two with a shared header instead of
    breaking the columns. However, wide output created with an ACROSS variable might
    not break at a column that is most logical to you.


    Chapter 3 demonstrated one method for handling vertical page breaks for really
    wide reports by placing the PAGE option on a DEFINE statement for a specific column.
    That example contains a large number of individually named and created columns,
    but what do you do if the table is wide due to the number of values of the ACROSS
    variable? Placing the PAGE option on the DEFINE statement for the ACROSS variable
    or the report-item underneath it will not generate the desired output.


    PROC REPORT does not have an option or straightforward mechanism for inserting
    a break between values of an ACROSS variable. The only recourse for a programmer
    is to control the width of the columns. A physical page has a finite width; you
    can control the width of your columns to match width and force the ODS destination
    to trigger a new page at the column that you want to.


    Example 4.28 produces 19 columns and demonstrates the default behavior in a paging
    destination. In PDF, the first three columns are on page 1 and the other 16 columns
    (the ones created by the ACROSS variable) are on page 2.


    Output 4.23a contains page 1 of the PDF file. Output 4.23b contains page 2 of
    the PDF file.


    Example 4.28: Output Very Wide Report to ODS PDF


