    # 5.7.2 The Importance of ORDER Variables


    Output 5.14 contains the desired information, but it is very unappealing. The
    reader does not know why the report skips from customer name to “F”. The bottom
    section does not contain any labeling or spacing to tell the reader what the section
    is for. It is failed to explain that the groupings are not mutually exclusive.


    NAME defaults to DISPLAY. No variables are defined as GROUP or ORDER, PROC REPORT
    does not sort the observations from the input data set. The rows in the final
    report just happen to be in the correct order of how the two temporary data sets
    were together.


    Most reports require full control over the order of the rows. This is where ORDER
    variables become very useful. Recall that ORDER variables do not consolidate rows
    from the input data set; they simply enforce a sort order. That capability is
    perfect for this type of report. When each observation in the data set is unique,
    you need to ensure that they are written where you'
  merge: -1
  pgno: 196
- img_proc: true
  md: "want them to be.\n\nORDER variables also offer the capability of BREAK statements\
    \ and COMPUTE BEFORE target and COMPUTE AFTER target blocks. Table (page) breaks\
    \ can be inserted via the BREAK statement. The compute blocks allow the use of\
    \ LINE statements with informative text.\n\nThe creation of ORDER variables requires\
    \ foresight; you have to know how they will be used inside of PROC REPORT. When\
    \ assigning values, remember that PROC REPORT nests these variables if there is\
    \ more than one the COLUMN statement. The first one listed on the COLUMN statement\
    \ creates the initial sort order. The next variable from the COLUMN statement\
    \ then gives finer control of the order, but only within the values of the first\
    \ variable.\n\nIn general, an ORDER variable that has a unique value for every\
    \ observation on the input data will work as expected when it is the only ORDER\
    \ variable. If you use multiple ORDER variables, it is best for the first variable\
    \ listed to be the broadest with the fewest number of unique values. As the variables\
    \ move further to the right on the COLUMN statement, the number of unique values\
