    # 2.1 Introduction


    This chapter covers the behind-the-scenes mechanics of PROC REPORT. The chapter
    discusses the very important topics of how compute blocks work and how to reference
    variables – two concepts that no procedure has. You have to know how to reference
    a report-item and when that variables'' values are available to get the expected
    values in the final report. Understanding how to use the power of the compute
    block will help you get there. These concepts are unique to PROC REPORT because
    it works like no other procedure in BASE SAS.


    PROC REPORT can create and access values from temporary variables; GROUP and ORDER
    variables allow you to order and consolidate observations from the input data
    set. They act similarly to CLASS variables in other procedures but come with a
    unique set of challenges, which this chapter will explore.'
