    # 4.3 Header Section Rows


    The above section shows how ACROSS variables affect how columns are created. They
    also have a big effect on the header section of the report. ACROSS variables can
    add a number of rows to the header section. They also affect the placement of
    spanning headers over other columns. All of the rows can be overwhelming and confusing.
    This section explains the rows that are created and how to move header text when
    an ACROSS variable is present.'
