  md: "When you use multiple report-items from the COLUMN statement inside of a compute\
    \ statement, it is important to pay attention to the order of the report-items\
    \ in the COLUMN statement, as well as which variable is specified as the report-item\
    \ in the COMPUTE statement. One method for avoiding the problems described in\
    \ the previous sections is to make sure that you always use the last report-item\
    \ in the COLUMN statement as the report-item in the COMPUTE statement. The last\
    \ variable in the COLUMN statement is the last column that is built for each row,\
    \ which means that all of the values in that row are available. You can use one\
    \ compute block for most of the statements that you need for the entire report,\
    \ including assignment statements and CALL DEFINE statements.\n\n**Note:** Whether\
    \ you choose to adopt this technique depends on programmer preference. You must\
    \ decide what makes sense to you and what is easiest for you to read and modify.\n\
    \nOne way to ensure that you always put the correct report-item in the COMPUTE\
    \ statement is to add a dummy, or placeholder, report-item at the end of the COLUMN\
    \ statement. For example, each time you write PROC REPORT code, include the dummy\
    \ variable _LASTVAR in the COLUMN statement, define it as NOPRINT, and use report-item\
    \ in the COMPUTE statement. Example 2.7 uses this technique.\n\n# Example 2.7:\
    \ Place a Dummy Report-item on the COLUMN Statement\n\n```\nproc report data=orders;\n\
    \  column customer_age_group total_retail_price quantity total_cost\ncostprice_per_unit\
    \ _lastvar;\n  define customer_age_group / group;\n  define total_cost / computed\
    \ 'Total Cost' format=dollar15.2;\n  define _lastvar / noprint;\n  compute _lastvar;\n\
    \    total_cost = costprice_per_unit.sum * quantity.sum;\n    if quantity.sum\
    \ > 250 then define(\n      'total_retail_price.sum','style',style=[background=pink]');\n\
    \  endcomp;\n\nrun;\n```\n\n# **Output 2.7: Set Background Color for TOTAL RETAIL\
    \ PRICE using LASTVAR Compute Block**"
