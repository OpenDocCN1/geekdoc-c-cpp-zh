    The COLUMN statement is the only statement inside PROC REPORT that has keyword
    aliases. COLUMN, COLUMNS, COL, and COLS are all acceptable references.


    # 1.4 Define Statement


    TheDEFINE statement tells PROC REPORT how to use a report-item and the desired
    display characteristics. A DEFINE statement is not required for each report-item
    because PROC REPORT has built-in behaviors for each type of variable. A numeric
    variable is simply printed out. The permanently associated format for a variable
    is used if present; otherwise, PROC REPORT uses variable length for character
    variables and nine (9) for a numeric variable. The effect of the default width
    is discussed in detail in the next chapter.


    # 1.4.1 Usage Options


    TheDEFINE statement specifies how to use a report-item. A report-item can have
    only one usage. You should include only one of the following options on a DEFINE
    statement. If you put more than one usage on a DEFINE statement, PROC REPORT will
    use the last one, the one closest to the semicolon.


    ACROSS


    This usage creates columns. The values of a variable defined as ACROSS become
    column headers. The values within the column are dependent on the syntax of the
    COLUMN statement. This usage can be applied to both character and numeric variables.


    ANALYSIS


    This usage specifies that the column will be used to calculate a statistic. Only
    a numeric variable default to ANALYSIS, so specifying this option is not required.
    However, it can be helpful to specify this option in order to clarify the usage
    is for a particular variable.


    COMPUTED'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'This usage indicates the report-item is not in the input data set, but is on
    the COLUMN statement and will be part of the report. This option is not required,
    but it is extremely helpful because it makes obvious that the report-item is being
    created inside of the PROC REPORT step. A compute block is necessary to populate
    the values. Reportitems of this usage default to numeric unless assigned the character
    type on the COMPUTE statement.


    # DISPLAY


    A variable defined as DISPLAY is simply printed output. The variable values appear
    in the report in the same order as they are in the input data set. Character variables
    default to DISPLAY. Numeric variables can be defined with this option, so the
    values are written to the report without being summed. This option is not the
    opposite of NOPRINT.


    # GROUP


    This option is used to order the report and consolidate rows from the input data
    set. This usage can be applied to character and numeric variables. It is common
    practice to put all GROUP variables at the beginning of the COLUMN statement;
    however, GROUP variables can be placed anywhere on the COLUMN statement. GROUP
    variables will always have an impact on the order of the rows no matter where
    on the COLUMN statement they are placed.


    # ORDER


    This option is used to order the report. It does not consolidate rows. This usage
    can be applied to both character and numeric variables. It is common practice
    to put all ORDER variables at the beginning of the COLUMN statement. However,
    ORDER variables can be placed anywhere on the COLUMN statement. ORDER variables
    will always impact the order of the rows no matter where on the COLUMN statement
    they are placed. ORDER variables cannot be stacked under an ACROSS variable.


    # 1.4.2 Interaction Options


    The following options interact with the usage options from the previous section.
    These options affect the contents of the report when used with a specific usage
    value. The description specifies the usage value option interacts with.


    # Statistic


    A statistical keyword is used with the ANALYSIS usage. Specifying a statistical
    keyword without specifying ANALYSIS will automatically change the usage of that
    variable to ANALYSIS. The default statistic for a'
  merge: -1
