    # 3.3 Nonstandard Reports


    As you saw in the previous section, PROC REPORT can easily create reports that
    are listing of the data or summary reports that contain aggregate values of ANALYSIS
    or COMPUTED variables. Your data or the desired report arrangement might not conform
    to those standard reports. This section looks at common nonstandard reports. These
    reports include percentages, a customized sort order, non-default summary rows,
    and values not present in the input data set. Again, the term nonstandard does
    not imply atypical. PROC REPORT can create the layout that you need, but it might
    require more code and additional variables from the input data set.


    # 3.3.1 Calculate Percentages within Groups


    Percentages, ratios, and proportions are key figures for explaining data. Percentages
    are found in a wide range of reports. Unfortunately, percentages are not as straightforward
    in PROC REPORT as one would hope. PROC REPORT honors the PCTN and PCTSUM keywords.
    These statistics are calculated based on the whole report, that is, all of the
    data. There is not a keyword for calculating percentages within groups. You must
