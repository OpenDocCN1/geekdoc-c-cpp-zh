    # 2.6.2 Numeric Variables


    PROC REPORT treats numeric GROUP or ORDER variables differently. It does not allow
    you to manipulate the variables as it does with character variables. For example,
    it will not let you overwrite a missing value. When the GROUP or ORDER variable
    is numeric and you need to manipulate its value, you have to create a new report-item.


    The new report-item should be placed to the right of the variable of interest
    on the COLUMN statement and defined as COMPUTED. In a compute block, the values
    are assigned based on the GROUP/ORDER variable. The NOPRINT option is added to
    the DEFINE statement for the GROUP/ORDER variable because you do not need to see
    two columns of the same values. Example 2.9 shows how to create a copy of a numeric
    GROUP variable.


    Example 2.9: Create a Character Copy of a Numeric GROUP Variable


    ```

    proc report data=orders;

    column customer_age_c customer_gender_quantity;

    define customer_age / group noprint;

    define c_age / computed ''Customer Age'';

    define customer_gender / group;

    compute c_age;

    if missing(customer_age) then hold = customer_age;

    c_age = hold;

    endproc;

    run;

    ```


    +   Add the new report-item, C_AGE, to the COLUMN statement to the right of CUSTOMER_AGE.
    CUSTOMER_AGE is the numeric GROUP variable that needs to be repeated on every
    row.


    +   Add the NOPRINT option to the DEFINE statement for CUSTOMER_AGE.'
