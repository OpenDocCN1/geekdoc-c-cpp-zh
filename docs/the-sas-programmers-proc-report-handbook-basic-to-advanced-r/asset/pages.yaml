  md: '# 4.4 Nonstandard Reports


    The examples in this section are for commonly required reports, but ones that
    are not easily created by PROC REPORT the ones previously discussed in this chapter.
    ACROSS variables often must appear in a custom order, and sometimes additional
    values must be added. This section discusses those circumstances as well as nesting
    ACROSS variables and hiding columns.


    # 4.4.1 Customized Sort Order


    Creating a custom sort order with an ACROSS variable works just like it did in
    the previous chapter for GROUP variables. You have to create a format with PROC
    FORMAT and specify the NOTSORTED order. The values in the PROC FORMAT step need
    to be placed in the order which you want them to appear from left to right in
    the final report.


    Example 4.21 demonstrates customizing the ACROSS variable sort order. After the
    format is created, add ORDER=DATA, FORMAT= and PRELOADMT options to the DEFINE
    statement in PROC REPORT for the ACROSS variable. ORDER_TYPE appears in the customized
    order in Output 4.17.


    Example 4.21: Customize the Order of the ORDER_TYPE Values


    ```

    proc format;

    value typeofOrd (notsorted)

    3=''Internet Sale''

    1=''Retail Sale''

    2=''Catalog Sale'';


    run;

    proc report data=orders;

    column order_type / (quantity total_retail_price);

    define order_type / across format=typeofOrd. order=preloadfmt;

    define total_retail_price / ''Retail Price'';


    run;

    ```


    +   ① A format is created with the NOTSORTED option.

    ② The values of ORDER_TYPE are listed in the order in which they should appear
    in the report from left to right.

    ③ The format is specified for ORDER_TYPE. The DEFINE statement must also have
    the options ORDER=DATA and PRELOADMT.


    # Output 4.17: ORDER_TYPE Values Appear in Customized Order'
  merge: -1
  pgno: 152
- img_proc: true
  md: '# 4.4.2 Creating Subtotal Columns


    Variables with all manner of values can be used as ACROSS, with the values dictating
    the columns. In some circumstances, subtotals are needed. Thinking of a report
    that uses a variable as ACROSS; you might want to see a subtotal for given date
    ranges. You have seen that you can create new reportitems under an ACROSS, but
    this is different. This isn''t putting another value under the ACROSS; it is putting
    another column within the ACROSS.


    The ORDERS data set has a delivery date variable, which can be used in a report
    to show the quantity delivered each day. You would like to see totals for the
    first half of the week and for the second half. In order to have a subtotal column,
    you need another value of the ACROSS variable. In other words, you need another
    date, but how do you assign “half week 1” and “half week 2?” You use PROC FORMAT.


    PROC FORMAT let you add categories to your ACROSS variable. Example 4.22 is very
    similar to Example 4.21 because it creates a format with PROC FORMAT and uses
    the PRELOADFMT and ORDER = DATA options in PROC REPORT. The format created in
    Example 4.22 adds the additional categories needed for the subtotal columns, shown
    in Output 4.18.


    Example 4.22: Use a Format to Include Subtotal Columns under ACROSS


    ```

    data orders;

    set orders;

    ddate = weekday(delivery_date);

    run;

    proc format;

    value wkdy

    1=''Sunday''

    2=''Monday''

    3=''Tuesday''

    4=''Wednesday''

    4.5=''Subtotal 1''

    5=''Thursday''

    6=''Friday''

    7=''Saturday''

    8=''Subtotal 2'';

    ```'
  merge: -1
  pgno: 153
- img_proc: true
  md: '```

    run;

    options missing=''0'';

    proc report data=orders2 now;

    column customer_country ddate,quantity;

    define customer_country / group;

    define ddate /across format=wkdy. preadfmt order=data "";

    compute quantity;

    _c6 = sum(_c2, _c3, _c4, _c5);

    _c10 = sum(_c7, _c8, _c9);

    endcomp;

    run;

    ```


    A new variable is created in a DATA step. The DDATE variable is a numeric and
    contains the weekday value.


    A format is created containing the weekday values plus two additional values.
    These values, 4.5 and 8, will create two new columns in the output.


    The DEFINE statement for ACROSS variable contains the FORMAT=PRELOADFMT, and ORDER=DATA
    options.


    The compute block for QUANTITY is executed on every row of the report.


    An assignment statement is needed for the new columns. The value of the column
    is the sum of the previous columns. Notice assignment statements are not needed
    for the other weekdays because the values already exist in the data.


