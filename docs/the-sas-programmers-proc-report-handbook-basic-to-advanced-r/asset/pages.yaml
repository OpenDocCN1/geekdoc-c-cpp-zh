    # 6.1 Introduction


    You now have a good grasp on how to get the numbers and report structure that
    you need out of PROC REPORT. PROC REPORT is not only a very powerful tool for
    creating reports in various structures, but it has the capability to add colors,
    images, hyperlinks, and more. These features help the reader focus on the most
    important aspects of the report and click to see more detail. This chapter focuses
    on the styling aspects of PROC REPORT that make the report easier to read.


    The chapter begins by demonstrating the use of border control attributes. These
    attributes can be used to change or remove borders so that specific columns and
    rows are visually grouped together.


    Trafficlighting is an important tool for conveying relationship and hierarchies.
    Unlike some reporting procedures, PROC REPORT has the ability to apply trafficlighting
    based on the values of any cell in the report.


    This chapter also demonstrates changing color attributes in the headers of reports
    and changing attributes of rows generated by LINE statements.


    PROC REPORT is not limited to changing just one attribute or just one cell. Section
    6.8 shows how borders can be altered at the same time that colors and formats
    are. The key is changing the attribute in the correct compute block based on execution
    order.


    Finally, the chapter explores including images and URLs as part of the table to
    enhance not only the appearance, but the information the report conveys.


    # 6.2 STYLE = Option


    Style attributes can be applied from any or all of the PROC REPORT statements,
    using the STYLE <location(s)> = option. Specifying the location value is optional,
    but it is best practice to include it. Attribute and value pairs are listed in
    brackets after the equal sign. The valid and default values for location vary
    by statement. The location value can be:


    +   - column'
  merge: -1
  pgno: 207
- img_proc: true
  md: '+   * header

    * summary

    * report

    * lines

    * caldef


    To specify more than one value with a space. For example,, STYLE(COLUMN) = STYLE(HEADER)
    = will change the attributes in both the header and column areas of the report.


    The following statements use the STYLE <(location(s)) > option. The default location
    is listed.


    +   * PROC REPORT: report

    * DEFINE: column and header

    * BREAK: summary and lines

    * RBREAK: summary and lines

    * COMPUTE: lines


    Most of the location values are straightforward. Base SAS Procedures Guide has
    a description of each location and a table showing what attributes can be used
    for that section of the report. Style attributes are applied in the following
    order. The last one listed takes precedence.


    +   1. Style template created by PROC TEMPLATE and specified on the ODS statement.

    2. PROC REPORT statement

    3. DEFINE statement

    4. BREAK or RBREAK statement

    5. COMPUTE statement

    6. CALL DEFINE statement


    The precedence order means that when specified on the PROC REPORT statement, the
    header location controls all header cells. When specified on a DEFINE statement,
    the header location controls the header cell for that specific-item. The same
    is true for all of the other locations.


    The report location can be tricky. Attributes such as RULES =, FRAME=, and BORDERCOLOR=
    impact every area of the report. OUTPUTWIDTH=(or WIDTH=) is applied to the entire
    table. Text related attributes, such as FONSIZE= andONT=, impact the text created
    by PRETEXT and POSTTEXT. When associated with the report location, the BACKGROUND=
    attribute has a'
  merge: -1
  pgno: 208
- img_proc: true
  md: 'different effect in ODS destination. The most important thing to remember is
    that if you specify an attribute in the report location, you need to make sure
    it changes the output in the way you expect. If it does not, you might need to
    try assigning the attribute in a different location.


    This chapter will not cover all possible style attributes that can be applied
    to PROC REPORT output. It will focus on the most commonly changed attributes.


    # # 6.3 Borders


    Border lines draw the focus of the report reader; they help distinguishing different
    pieces of information and hopefully make the report easier to read. Borders for
    specific sections of the table can be controlled with style templates using the
    following style attributes:


    +   - FRAME =

    - RULES =

    - BORDER <LOCATION> WIDTH =

    - BORDER <LOCATION> COLOR = (where location = BOTTOM, TOP, LEFT, or RIGHT)


    These options, when used in a style template, can turn the borders on and off
    for a specific section (location) of the report, but they cannot control individual
    borders within that location. You will need to use these options inside PROC REPORT
    to gain granular control of the borders.


    In this section, we will first look at the various appearances the FRAME = RULES=
    attributes produce. Then, we will explore how to manipulate the border lines in
    order to get custom appearances. Due to the fact that we are changing individual
    borders, we will make all changes within PROC REPORT and not PROC TEMPLATE.


    The report, column, and header locations are the most used locations when controlling
    the borders. The report location is where you would specify the FRAME = and RULES
    = attributes. This location is used only on the PROC REPORT statement.


    When border style attributes are specified, the lines are drawn for the entire
    width and height of the cell. These attributes should not be used when trying
    to underline lines.


    Note: Each ODS destination behaves differently from every other destination. This
    is especially true when changing borders. For example, in ODS PDF, changing one
    border results in all four being drawn. Also, you might have to specify color
    and width for the border to be drawn. The code in this section is geared toward
    use with ODS PDF, but should'
  merge: -1
  pgno: 209
- img_proc: true
  md: 'be applicable in other destinations. Section 6.7.3 specifically addresses changing
    borders in HTML output.


    **Note:** The border color is set to black throughout this section. The style
    template for your report might use a different color. You should check the style
    template for the appropriate color specification.


    #  6.3.1 FRAME= and RULES = Attributes


    The FRAME= option controls the borders on the outside of the table. The option
    can be assigned one of the values listed in Table 6.1.


    **Table 6.1: FRAME = Values**


    | Value for frame-type | Frame |

    | --- | --- |

    | ABOVE | A border at the top |

    | BELOW | A border at the bottom |

    | BOX | Borders at the top, bottom, and both sides |

    | HSIDES | Borders at the top and bottom |

    | LHS | A border at the left side |

    | RHS | A border at the right side |

    | VOID | No borders |

    | VSIDES | Borders at the left and right sides |


    The default value for FRAME= varies for each template. However, BOX is frequently
    the default. The FRAME= value is at the table level. In some destinations (Tagsets.RTF),
    if the table is long enough to span multiple pages, the bottom border might appear
    only on the last page. In this circumstance, you will have to create a dummy paging
    variable in order to generate a bottom border on each page. Paging variables are
    discussed in Chapters 2 and 3. The page break will create multiple tables, one
    for each page, and the bottom border will be placed on each table.


    The RULES = option controls the borders within the table. It can be assigned one
    of the values listed in Table 6.2.


    **Table 6.2: RULES = Values**


    | Value for | Location of Rules |

    | --- | --- |'
