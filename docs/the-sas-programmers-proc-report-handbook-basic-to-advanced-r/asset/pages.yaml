    # 4.4.4 Column under an ACROSS


    PROC REPORT will create a column for every variable under an ACROSS. It is not
    common, but it is possible to prevent one or more of the columns from being included
    in the final report. These circumstances are ones in which a WHERE statement is
    too broad. You do not want all of a category removed; just one of the instances
    of.


    Take as example the previous code that used ORDER_DATE twice. Maybe a large storm
    occurred, or a critical system was under repair, or a part of the business was
    not up and running for part of the year. Therefore, you do not want a specific
    quarter to appear in the output because the numbers are too different from the
    norm and you do not want them for comparison.


    The NOZERO option will suppress the display of a column if all of its values are
    missing or zero. The problematic column can be placed on a DEFINE statement. In
    a compute block, the column is is set to missing. When the report is rendered,
    the column will be removed. Example 4.27 removes one of the ORDER_DATE column,
    shown in Output 4.22.


    # Example 4.27: Use the NOZERO Option to Hide a Column


    ```

    proc report orders;

    column order_date, order_date=orddate,quantity;

    define _ / across format=year4. order=internal"

    nozero;

    define orddate / across format=qtr. order=internal ''Quarter'';ndefine quantity
    / '' '';

    compute quantity;

    _cl2_ = :;

    endcomp;

    run;

    ```


    +   Add the NOZERO option to a DEFINE statement. The option can be placed on either
    the DEFINE statement for the ACROSS variable or the'
