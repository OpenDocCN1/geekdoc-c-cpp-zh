  md: 'Style attributes for multiple LINE statements from the same compute block cannot
    be controlled separately. However, for some reports it might be necessary to have
    two LINE statements at the same place in the table but with different attributes.
    Chapter 3 explains PROC REPORT cannot have two compute blocks at the same location
    (BEFORE or AFTER). The example in chapter demonstrates creating a new grouping
    variable that changes values at the same time the first grouping variable value.
    Examples 6.27a and 6.27b use the same technique to place two LINE statements at
    the same place with different attributes. Example 6.27b uses the BEFORE location.
    Therefore, the LINE statements are written in the order the variables appear on
    the COLUMN statement from left to right. The first grouping variable on the COLUMN
    statement writes the top LINE statement.


    # Example 6.27a: Create a Copy of CUSTOMER_COUNTRY


    ```

    data orders2;

    set orders;

    c_country = customer_country;

    run;

    ```


    You now use the copy, C_COUNTRY, as necessary. Example 6.27b writes one LINE statement
    from two compute blocks, which will appear together in the table. The order of
    the LINE statements in the output is based on the order of the CUSTOMER_COUNTRY
    and C_COUNTRY variables in the COLUMN statement. The orange divider rows are written
    first. Those rows are created with the CUSTOMER_VARIABLE, so CUSTOMER_COUNTRY
    should be the first variable in the COLUMN statement. Then, C_COUNTRY is used
    to create the blue rows that contain the text value for CUSTOMER_COUNTRY, as seen
    in Output 6.23.


    # Example 6.27b: Use the Copy of CUSTOMER_COUNTRY to Write a Second LINE Statement


    ```

    proc report data=orders2;

    column customer_country c_country customer_group quantity

    total_retail_price;

    define customer_country / group noprint;

    define c_country / group noprint;

    define customer_group / group;

    define total_retail_price / ''Retail Price'';

    compute c_country /style=(just=1 background=lightblue);

    line customer_country $cntry;

    endcomp;

    compute before customer_country /style=(background=cxfe9929);

    line '' '';nendcomp;

    ```'
