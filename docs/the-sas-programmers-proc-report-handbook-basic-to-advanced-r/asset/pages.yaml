    #  3.1 Introduction


    This chapter is the first of three chapters with examples of how to create various
    kinds of reports. The chapter begins with the standard reports that PROC REPORT
    can create by default. PROC REPORT can create a simple listing of the data or
    an ordered listing of the data. A report can also contain variables not present
    in the original data set. PROC REPORT will consolidate rows from the input data
    set and provide summary statistics of the analysis variables.


    Next is a section on nonstandard reports. These are reports that are commonly
    asked for, but require a little more programming effort to produce'
