    All variables that are needed from the input data set must be included in this
    statement; this includes variables that do not set to a column in the final report
    but need their value for another purpose. You will get a note in the log that
    the variable is uninitialized if you reference a variable from the input data
    set that is not on the COLUMN statement.


    PROC REPORT allows more than one COLUMN statement. PROC REPORT concatenates the
    list of variables starting with the first COLUMN statement, then the second COLUMN
    statement, and so on. The most common use of this capability is to specify variables
    to use based on the value of a macro variable, as demonstrated in Example 1.1.


    # Example 1.1: Multiple COLUMN statements


    ```

    %let all = Y;

    %macro rep;

    proc report data=orders;

    column customer_country customer_group;

    if &&all=Y then do;

    column customer_age customer_gender;

    end;

    column quantity total_retail_price;

    run;

    %end rep;

    %rep

    ```


    Another role of the COLUMN statement is to identify the contents of a column.
    The contents of a column can simply be the value of the variable directly from
    the input data set. The contents can also be a statistic for an ANALYSIS variable.
    Example 1.2 shows that a statistic can be “stacked” under an ANALYSIS variable
    by using a comma (,) between the variable name and the statistic name.


    # Example 1.2: Stack a Statistic


    ```

    proc report data=orders;

    column quantity,min total_retail_price,max;

    run;

    ```


