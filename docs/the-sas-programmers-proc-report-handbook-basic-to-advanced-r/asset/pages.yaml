    # # 6.4 Trafficlighting


    A common task for report creators is to apply coloring to the background or foreground
    of certain cells so they stand out. This is called trafficlighting. The type of
    trafficlighting that is needed depends on the report, but you can highlight a
    cell based on its value or the value of another cell. You can also highlight an
    entire row or color cells in a diagonal pattern. In this section, we will explore
    how to trafficlight cells for each of these tasks.


    # ## 6.4.1 Color Based on Cell''s Value


    The most common technique is to change the foreground or background of a cell
    based on its value. This method is used to draw attention to values that are above
    a certain threshold or have fallen below it. This method can also simply distinguish
    one group from another.


    The color assignment can be made on two different statements, the DEFINE statement
    and the CALL DEFINE statement. Both statements produce the same result.


    Example 6.8 changes the background of the TOTAL_RETAIL_PRICE column, as seen in
    Output 6.7. The color will be based on a range of possible values, usually the
    lowest value assigned and the highest value assigned to the darkest color. The
    color values are assigned in PROC'
  merge: -1
  pgno: 220
