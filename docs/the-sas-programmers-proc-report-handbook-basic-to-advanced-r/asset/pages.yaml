    It is important to understand the entries PROC REPORT places into the document
    item store. The first step is to view the default behavior. Example 7.13 below
    creates an item store from a simple PROC REPORT step, shown in Output 7.13.


    Example 7.13: Store PROC REPORT Output Object in a Document Item Store


    ```

    ods document name=temp(write);

    proc report data=orders;

    column product_line quantity total_retail_price;

    ```'
