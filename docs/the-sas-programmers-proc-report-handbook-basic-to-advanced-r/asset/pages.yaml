- img_proc: true
  md: '# 4.3.1 Default Header Section Created with ACROSS


    By default, the header section has one row containing the column headers. When
    a variable is defined as ACROSS, two additional rows are added to the header.
    One row contains the ACROSS variable label, which spans all the columns created
    by the variable. Another row contains the ACROSS variable values. Each value will
    span the columns of the report-items listed under the ACROSS. Example 4.15 creates
    a report with the header created by an ACROSS variable, shown in Output 4.11.


    Example 4.15: Default Headers Created by ACROSS


    ```

    options missing=''0'';

    proc report data=orders;

    column product_line customer_age_group customer_gender,

    (quantity total_retail_price); ①

    define product_line / group "Product"; ②

    define customer_age_group / group "Age Group"; ③

    define customer_gender / across "Gender"; ④

    run;

    ```


    +   ① PRODUCT_LINE and CUSTOMER_AGE_GROUP are the first listed variables and will
    be placed before the columns created by CUSTOMER_GENDER.


    +   ② The label "Product" is assigned to the PRODUCT_LINE variable.


    +   ③ The label "Age Group" is assigned to the CUSTOMER_AGE_GROUP variable.


    +   ④ CUSTOMER_GENDER is given the ACROSS usage and a label. Its values becoming
    spanning headers over the QUANTITY and TOTAL_RETAIL_PRICE labels. The label "Gender"
    will be placed over the values of F and M.


    Output 4.11: ACROSS Variable Generates Two Additional Header Rows'
