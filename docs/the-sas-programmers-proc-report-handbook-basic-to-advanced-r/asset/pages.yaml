- img_proc: true
  md: "values with other procedures.\n\nA report that requires an observation to be\
    \ part of two separate groups might also require data restructuring. For example,\
    \ demographic information could display ethnicity and education. The report should\
    \ be the breakdown of each ethnicity level, education level, and the combination\
    \ of the two. In essence, the final report is actually two reports combined into\
    \ one.\n\nPROC REPORT documentation discusses detail reports and summary reports.\
    \ Detail reports show information from individual observations from the input\
    \ data. Summary reports consolidate multiple observations from the input data\
    \ set to report summaries, or grouped information. PROC REPORT cannot create both\
    \ types of reports in the same step. For example, PROC REPORT will not create\
    \ a report that has rows for each customer in the top portion of the report and\
    \ then returns with summary information for country, gender, order type, product\
    \ line, and so on, in the bottom portion of the report. For those types of reports,\
    \ you either have to create a lot of dummy grouping variables in the data set\
    \ and temporary variables in compute blocks, or restructure your data.\n\n# 5.7.1\
    \ Combine Detail and Summary Information\n\nThe example in this section demonstrates\
    \ creating a report that combines detail and summary information. Instead of 'tricking'\
    \ PROC REPORT into creating the desired report structure, it will be created within\
    \ a DATA step, and then displayed via PROC REPORT.\n\nThe top section of the report\
    \ will contain one row for each customer. The columns will represent the total\
    \ number of separate products ordered, the total quantity ordered, and the amount\
    \ of money spent. The bottom section of the report will contain rows for various\
    \ categories each customer might fall into, such as gender, age group, and type.\
    \ Example 5.12a shows the steps to summarize the data for each section and set\
    \ them in one data set.\n\n# Example 5.12a: Calculate Detail and Summary Information\
    \ in Two Separate Steps\n\n```\nproc sort data=orders;\n  by customer_name;\n\
    run;\nproc means data=orders noprint;\n  by customer_name;\n  var quantity total_retail_price;\n\
    \  output out=top_tots(rename=(_freq=totn)) sum=/autoname;\nrun;\nproc means data=orders\
    \ noprint;\n```"
  merge: -1
  pgno: 193
