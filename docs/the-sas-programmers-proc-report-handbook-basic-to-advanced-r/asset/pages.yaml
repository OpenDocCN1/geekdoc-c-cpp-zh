- img_proc: true
  md: "As you can see, the BY-variable node is in the form BY-variable = BY-variable\
    \ value. The BY-group value becomes the second node level. The report label moves\
    \ down to the third level. The table label becomes the fourth level. PROC REPORT\
    \ does not have the ability to change this structure. The CONTENTS= option does\
    \ not resolve #BYVAR or #BYVAL.\n\nTo change the node label for each BY group,\
    \ the PROC REPORT step needs to be placed inside a macro program. The macro program\
    \ has to run once for each BY group. Moving the PROC REPORT step inside of a macro\
    \ program eliminates the need for a BY statement. Therefore, the code reverts\
    \ to the default structure of creating three node levels and those labels can\
    \ be modified, as demonstrated in Example 7.4 and Output 7.4.\n\n# ### Example\
    \ 7.4: Change BY-Variable Node Labels\n\n```\nproc sort data=orders;\n  by customer_age_group;\n\
    run;\n%macro bynode(byvar)\n  local i;\n  ods proclabel = \"&byvar\";\n  proc\
    \ report data=orders contents=\"&byvar\";\n    where customer_age_group=\"&byvar\"\
    ;\n    column product_line quantity total_retail_price;\n    define product_line\
    \ / group;\n  run;\n%end bynode\ndata _null_;\n```"
