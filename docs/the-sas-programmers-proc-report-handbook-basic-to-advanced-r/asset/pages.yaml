  md: "# 5.6 Wrap Text at a Specific Place\n\nThe Listing destination requires the\
    \ WRAP or FLOW destination to make a long text string wrap, or span multiple rows.\
    \ The Listing destination will honor the SPLIT character when it is part of a\
    \ data value.\n\nOther ODS destinations will automatically wrap text. In fact,\
    \ they ignore the WRAP and FLOW options. They do not honor the SPLIT character\
    \ in data values. The SPLIT character will be displayed in the data column on\
    \ the report just like any other character. For long data values, the destination\
    \ will fit as much as possible on a row within the cell as possible. The amount\
    \ of text that can fit on a row is based on the font size and cell width, with\
    \ other other attributes. When it reaches the end of the row, the destination\
    \ will force a line break and continue the rest of the text. The destination will\
    \ attempt to insert the line break at a space if possible.\n\nThe destination\
    \ might not wrap a value where you\n\nYou must place it inside of the actual data\
    \ value. The data value can be changed via an assignment statement in a DATA step\
    \ or a compute block. For most programmers, it is easier to make the change in\
    \ a DATA step. Be sure the length of the variable is long enough to incorporate\
    \ the inserted command.\n\nThe PRODUCT_GROUP variable supplies a general description\
    \ of the product. For products that fall in the children's line, PRODUCT_GROUP\
    \ has a comma and a more detailed group value. Example 5.11 and Output 5.13 demonstrate\
    \ how to convert a value to a line break to force the detail to be on a new line.\n\
    \nExample 5.11: Insert NEWLINE Function in PRODUCT_LINE Value\n\n```\nods escapechar=\"\
    ^\";\ndata orders2;\n  set orders;\n  length product_group2 $75;\n  label product_group2\
    \ = 'Product Group';\n  if product_line = 'Children' then\n    product_group2\
    \ = tranrd(product_group, ' ', '^(newline 1)');\n  else product_group2 = product_group;\n\
    run;\nproc report\n```"
