- img_proc: true
  md: 'Reports often require hyperlinks. The hyperlinks could be to a single website
    or to files that contain information related to report (known as drill-down reports).
    In this section, we will look at how to create both types of hyperlinks. The URL=
    attribute creates the hyperlinks and can be associated with a header or a cell
    value.


    Each destination designates a hyperlinked cell differently. Adobe software will
    place a blue border around a cell when there is a hyperlink unless you turn it
    off the style template. Adobe will place a note icon in the corner of the cell
    when the FLYOVER= attribute is applied. Microsoft Word will have a flyover with
    instructions to press Ctrl+Click when you hover over a hyperlinked cell in RTF
    files. Both applications will change the cursor to a hand when you hover over
    the cell. Hyperlinks are easily distinguishable in HTML as they tend to be underlined
    and in a different font color. HMTL allows you to place a hyperlink on individual
    words across a cell. Most other ODS destinations cannot place multiple hyperlinks
    within one cell.


    Example 6.38 creates a custom style template that will be used throughout this
    section of the chart. The output being created is set to PDF; by default, PDF
    will surround hyperlinks with blue boxes. The custom style template removes the
    blue boxes.


    # Example 6.38: Create Style Template That Removes the Blue Hyperlink Box


    ```

    ods path(prepend) work.templat.update); ❶


    proc template;

    define styles.pearl2;

    parent=styles.pearl;

    style body from document /

    linkcolor=_undef_; ❷

    end;

    run;

    ods pdf file=''url.pdf'' notoc style=pearl2;

    ```


    +   ① Set the ODS PATH to set with WORK.TEMPLAT because this custom style does
    not need to be stored. It is just temporary.


    +   ② Set the LINKCOLOR= attribute to undefined in order to remove the blue boxes
    around hyperlinks.


    # 6.10.1 Hyperlink to a Static Location


    The URL= attribute can be set to a hardcoded value. Example 6.39, STYLE(HEADER)=
    for CUSTOMER_TYPE contains URL= and it specifies a link to www.sas.com, as seen
    in Output 6.35.'
  merge: -1
  pgno: 259
