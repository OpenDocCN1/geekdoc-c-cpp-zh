    # ## 3.2.3 Define a Variable as GROUP


    In Example 3.3, the ORDER ordered option its value is written out only when it
    does not match the value above it. The GROUP option performs both of these functions
    and consolidates the rows. Consolidating rows is the key feature for defining
    a variable as GROUP. Using a variable as GROUP allows observations from the input
    data to be combined so that the report is no longer a list of the data.


    PROC REPORT cannot create an aggregate value if any DISPLAY variables are on the
    COLUMN statement contains both a GROUP and a DISPLAY variable, PROC REPORT will
    calculate an aggregate value for all of the ANALYSIS and COMPUTED variables from
    the statement. The report will be sorted by the GROUP values and summary rows
    can still be generated, but the report will contain individual values instead
    of aggregated ones. The GROUP variable will behave like an ORDER variable and
    the following note will be written to the log to make you aware that PROC REPORT
    could not perform all of the functions associated with a GROUP variable.


    > NOTE: Groups are not created because the usage of XXXX is DISPLAY.

    To avoid this note, change all GROUP variables to ORDER variables.


    Example 3.4 demonstrates the difference between accepting the default usages of
