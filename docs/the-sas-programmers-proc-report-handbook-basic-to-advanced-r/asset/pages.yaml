    # 8.3 Temporary Variable Values


    As mentioned in Chapter 2, temporary variables are created within compute blocks,
    but they do not exist on the input data set and are not part of the final report
    or output data set. Their values are retained until overwritten by another assignment
    statement, but it requires extra work to see the values as PROC REPORT builds
    a report. You cannot use a PUT statement within a compute block. Therefore, you
    have to use another method to see the value of temporary variables.


    There are two methods for seeing the value of a temporary variable. The method
    you use depends on how often the value of the temporary variable changes. Temporary
    variables created in compute blocks executed at certain locations (that is, BEFORE
    or AFTER a grouping variable), usually do not change as temporary variables created
    in compute report-item blocks.


    # 8.3.1 Output via a LINE Statement


    The first method for seeing the temporary variable values is to use a LINE statement.
    This method is truly useful only for temporary variables that change as the value
    of a GROUP or ORDER variable changes. It works just like if you output a variable
    from the COLUMN statement. Generating the LINE statement does not have to be a
    permanent part of your PROC REPORT step. You can use it for troubleshooting and
    remove the code. You can use the LINE statement in the block where it was created,
    or output it from another block referencing the other location.


    Chapter 3 contains an example of calculating percentages for each value of CUSTOMERCOUNTRY.
    Recall calculating group percentages creating a temporary variable to hold the
    denominator value. Revisit that code to demonstrate using a LINE statement to
    check the value of the temporary variable.


    It is very helpful to add text in the LINE statement prior to the variable name
    to remind yourself what you are looking at in the final report. Also, text'
  merge: -1
  pgno: 297
- img_proc: true
  md: 'is helpful if you have multiple LINE statements, because it might be confusing

    as to which one you wrote for debugging Example 8.1 outputs a

    LINE statement with the value of the temporary variable and text to draw

    atention to that row in the final result. The result is shown in Output 8.1.


    # Example 8.1: Use a LINE Statement to View Temporary Variables


    ```

    proc report data=orders;

    column customer_country order_type total_retail_price pct;

    define customer_country / group format=$cntry;

    define order_type / group format=typef;

    define total_retail_price / ''Total Retail Price'';

    define pct / computed format=percent8.1 ''Percent Retail Price'';\compute before
    customer_country;

    de = total_retail_price.sum;

    endcomp;

    compute after customer_country;

    line ''the denominator used was: '' den 8.2;

    endcomp;

    compute pct;

    if den > 0 then pct = total_retail_price.sum / den;

    endcomp;

    run;

    ```


    > On the LINE statement, place helpful text along with the name of the

    temporary variable and an appropriate format.


