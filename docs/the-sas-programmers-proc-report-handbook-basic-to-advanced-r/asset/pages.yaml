    # 4.4.6 Macro to Create Column References


    The previous examples in this chapter were purposely short in order to simplify
    the explanations and fit on a page. But in real life, you might have many more
    categories of an ACROSS or many more variables under the ACROSS. In these situations,
    entering all of the column references is both cumbersome and error prone. You
    do not have to enter all of the code; you can let macro program code do it for
    you.


    Let'' revisit Example 4.9, the code for creating a new report-item.


    Example 4.9: Create a New Report-item Called ESTPRICE_PER_ITEM


    ```

    proc report data=orders;

    column customer_age_group, (quantity total_retail_price

    estprice_per_item);

    define customer_age_group / across;

    defestprice_per_item / computed ''Est. Item Price''

    format=dollar8.2;

    compute estprice_per_item;

    c3_ = _c2 / _c1;

    _c6 = _c5 / _c4;

    _c9 = _c8 / _c7;

    _c12 = _c11 / _c10;

    endcomp;

    run;

    ```


    The number of ACROSS variable values (categories) dictates how many assignment
    statements are needed. In the above code, CUSTOMER_AGE_GROUP has four values,
    so four assignment statements are needed.


    The absolute column numbers, representing ESTPRICE_PER_ITEM on the left of the
    assignment statements, increment by three. This is because three columns appear
    under each value of the ACROSS.


    This code does not contain any report-items on the COLUMN statement before'
  merge: -1
  pgno: 162
- img_proc: true
  md: 'the ACROSS, so the first column number referenced is 1.

    The statements follow a pattern. PROC REPORT allows the use of DO loops inside
    of a compute block, which you can use if you know the number of columns. A normal
    DATA step loop requires you to hardcode the column reference. It is not capable
    of building the variable name _cn_. However, a %DO loop is capable of building
    the correct variable names. Macro program is perfect for situations that require
    the same to be repeated multiple times and that have a pattern.


    To create the macro variable references, you need to know three things.


    +   - The number of unique values of the ACROSS variable.

    - The number of report-items under the ACROSS variable.

    - The number of report-items to the left of the ACROSS variable.


    If you were to write out the logic of the DO loop, it would be: Start at the left-most
    column under the ACROSS, which is the number of columns to the left of the ACROSS
    plus one. Go to the last column under the ACROSS, which is determined by multiplying
    the number of unique values of the ACROSS by the number of report-items under
    the ACROSS and adding the number of columns to the left of the ACROSS.


    ```

    %do i=%eval(&numleft+1) to %eval(&numcat*&numumber+&numleft) %by

    %numumber;

    ...assignment statements...

    end;

    ```


    Example 4.30 contains the entire example code converted into a macro program,
    and Output 4.25 shows the results.


    Example 4.30: Use a Macro Program to Create a New Report-item Called ESTPRICE_PER_ITEM


    ```

    %let numcat = 4;

    %let numleft = 0;

    %let numumber = 3;

    %macro rep;

    %local i;

    proc report data=orders;

    column customer_age_group, (quantity total_retail_price

    estprice_per_item);

    define customer_age_group / across;

    define estprice_per_item / computed ''Est. Item Price''

    format=dollar8.2;

    compute estprice_per_item;

    %do i=%eval(&numleft+1) to %eval(&numcat*&numumber+&numleft) %by

    ```'
