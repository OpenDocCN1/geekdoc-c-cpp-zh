    # 7.4 DEFINE Statement CONTENTS =


    The DEFINE statement has a CONTENTS= option, but it is ignored unless the PAGE
    option is also specified. For basic PROC REPORT output, this option can be used
    to change the third node, the table label. This method is an alternative to needing
    to add a paging variable. However, the CONTENTS= option on the DEFINE statement
    does not allow you to completely eliminate the node like it on the BREAK statement.
    Example 7.6 modifies the label of the third node using the DEFINE statement, shown
    in Output 7.5.


    Example 7.6: Change Third Node Level Label Using the DEFINE'
