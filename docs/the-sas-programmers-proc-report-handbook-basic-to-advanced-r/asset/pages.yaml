    effect on ANALYSIS, DISPLAY, or COMPUTED report-items. See [Chapter 2](#chapter2)
    for an in-depth discussion on the behavior of this option.


    # DESCENDING


    This option reverses the display order of the GROUP, ORDER, or ACROSS values.


    # PRELOADFMT


