    # # 8.4 General Tips


    As SAS in general, PROC REPORT does exactly what you tell it to do. It might not
    give what you want it to do, but it does give what you tell it to do. The following
    tips give guidance on how to approach generating a report with PROC REPORT and
    places to check if something goes wrong.


    # ## Tip #1: Know Your Data


    The first tip for determining why PROC REPORT did not give you you want is universal
    to programming: know your data.


    +   - Check that there are no missing values. Warning messages about missing values,
    whether they are grouping or ANALYSIS variables, are generated because the input
    data set does in fact have missing values.

    - Check that all the categories that you are present in your data. PROC REPORT
    is not going to output a category that does not exist. Chapter 3 contains an example
    of inserting categories with no data.

    - Check the length of your character variables. A text value inserted via PROC
    REPORT might be truncated if the length of the variable that you are inserting
    it into is shorter than the length of the text.


    # ## Tip #2: Plan Your Report


    The next tip is to plan your report before you start to program. The plan should
    help you decide whether you need to create formats or whether you need to add
    variables to your data set for grouping or ordering purposes. Based on what you
    have learned about PROC REPORT from this book,'
