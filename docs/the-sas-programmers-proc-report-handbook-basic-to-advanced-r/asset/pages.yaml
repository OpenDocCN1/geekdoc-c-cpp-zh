- img_proc: true
  md: '# OUT =


    PROC REPORT can create a data set with the results of the procedure.

    The output data set is used for many types of applications, such as quality control
    or as an input for another procedure. The data set will contain all of the variables
    from the COLUMN statement, including variables defined as NOPrint. It also contains
    the automatic variable _BREAK_ which indicates whether the row was created by
    a BREAK or RBRE statement. The data set does not contain any temporary variables
    inside of a compute block. The value of GROUP and ORDER variables will be populated
    over every row, which is not what you see in the output because those variables''
    values are included in the output only for the first row of the grouping. In the
    output data, columns created by stacking variables under an ACROSS are named in
    the form _Cn_, where n is the column number. There is no option to change this
    behavior. To change the variable names, you have to use the RENAME= data option.


    # CENTER|NOCENTER


    By default, the table created by PROC REPORT is centered on the page of the output
    destination. Using NOCENTER moves the table as far over to the left as it can.
    In paging destinations, such as ODS RTF and ODS PDF, the left margin determines
    where the table will start. NOCENTER is helpful when the output is very wide and
    you want to make sure as many columns as possible fit on the page. The system
    option CENTER|NOCENTER does affect the output. PROC REPORT will use the system
    option unless you override the system option with this procedure option.


    # LIST


    The LIST option writes to the log portions of the code that PROC REPORT uses to
    generate the report. The information on the DEFINE statements is the most useful,
    as it uses the keyword, format, width, and label that PROC REPORT will use for
    each variable. In general, this option is most useful when you are sending the
    output to Listing; however, it can be used regardless of where you send the output.
    This option is needed when debugging, such as determining the format and width
    that is used.


    # SHOWALL


    This option forces all items from the COLUMN statement to be displayed, even when
    the NOPrint option is used on the DEFINE statement. This option is a great debugging
    tool! When all report-items are displayed in the report, it is easy to determine
    the correct column number. Using this option will help ensure you refer to the
    correct column number in a compute block when an ACROSS variable is used. With
    this option GROUP and ORDER columns are displayed. You will be able to determine'
