- img_proc: true
  md: '# 6.9 Images


    Images are vital to many types of reports. Images can be company logos, graphs,
    and photos. This section explores images and how they can be incorporated into
    a PROC REPORT table. Images can be placed at the top or bottom of the report,
    as well as cells of the table. Both the PREIMAGE= and POSTIMAGE= attributes can
    be used to insert images. The size and DPI of image are important factors in the
    final appearance of the report. Image files should be high quality and relatively
    small. Images that are six inches tall and six inches wide are unlikely to be
    in a table cell without dramatically affecting the rest of the table.


    Note: Images cannot be used with reports sent to the Tagsets.ExcelXP destination.
    the ODS destination for PowerPoint cannot place images inside of cells; this is
    a restriction in Microsoft PowerPoint. PowerPoint allows images to be placed at
    the top or bottom of the report.


    # 6.9.1 Place an Image above or below a Report Table


    Recall from earlier in the chapter that STYLE(REPORT)= applies to the report as
    a whole. STYLE(REPORT)= is the option to insert images above or below the report
    table. Borders or lines might not surround the image, but the image is part of
    the table. If the image should be its own output object, it should be placed in
    a TITLE, FOOTNOTE, or ODS TEXT=statement or output via PROC ODSTEXT.


    # Place Image above the Table


    Example 6.32 demonstrates using the PREIMAGE attribute to place a logo above the
    table, as seen in Output 6.29.


    Example 6.32: Use PREIMAGE=


    ```

    proc report data=orders style(report)=[preimage="cologo.tif"];

    column customer_type n;

    define customer_type / group;

    ```


    PREIMAGE= places the image above the table. Because it is part of the table, the
    image will not be repeated if the table spans multiple pages.


    Output 6.29: PREIMAGE= Places the Logo Above The Table'
