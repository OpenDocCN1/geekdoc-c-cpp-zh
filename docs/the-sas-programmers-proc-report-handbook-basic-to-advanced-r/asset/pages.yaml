    # Column Percentages within Groups


    Percentages can also be calculated within groups. The denominator is more finely
    defined. In Example 4.14, the denominator is the sum of TOTAL_RETAIL_PRICE for
    a specific value of gender within country. The sum of TOTAL_RETAIL_PRICE for females
    in Australia is $5,426.20. For males in Australia, the sum is $11,895.09. Then
    Canada, and so on. The numerator is the value of TOTAL_RETAIL_PRICE for each gender,
    country, and order type combination. The results are displayed in Output 4.10.


    # Example 4.14: Calculate Percentages within CUSTOMER_COUNTRY


    ```

    proc report data=orders;

    column customer_country order_type customer_gender,

    (total_retail_price pct); ①

    define customer_country / group format=$cntry;

    define order_type / group format=typef;

    define customer_gender / across; ②

    define total_retail_price / ''Total Retail Price'';

    define pct / computed format-percent=8.1 ''Percent Retail Price''; ③

    compute before customer_country; ④

    denF = _c3;

    denM = _c5;

    endcomp;

    compute pct; ⑤

    if denF > 0 then _c4_ = _c3_ / denF; ⑥

    if denM > 0 then _c6_ = _c5_ / denM;

    endcomp;

    ;

    ```


    +   ① PCT, along with TOTAL_RETAIL_PRICE, is placed under CUSTOMER_GENDER.


    +   ② CUSTOMER_GENDER is defined as ACROSS.'
