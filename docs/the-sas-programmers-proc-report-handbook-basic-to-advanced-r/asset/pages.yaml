    # 5.7 Incorporate Various Data Pieces into One Report


    Chapters 3 and 4 provide a number of really good examples for producing non-default
    reports, such as including extra summary rows at the bottom of a report or inserting
    summary columns into the middle of the report. Many of those techniques required
    adding dummy variables to the data set or additional categories to the format.
    These strategies might not be effective for some report structures. The best way
    to generate the desired report structure is to build a data set that looks like
    the report and then use REPORT simply to display the data in a pleasing manner.


    Clinical reports of adverse events are report type that might require you to restructure
    the data set. Clinical reports often have a row for overall totals, then a row
    for subtotals, and then rows for individual events. In theory, RBREAK and BREAK
    statements can produce totals and subtotals. The tricky part is creating a grouping
    variable to capture that correct observations. For some programmers, it is easier
    to create the observations, columns, and'
