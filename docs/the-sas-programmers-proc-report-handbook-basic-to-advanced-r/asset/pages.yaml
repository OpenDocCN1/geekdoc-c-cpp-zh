    # 7.7.5 Parent Node with Multiple Child Nodes


    The nodes and items can be so overwhelming and confusing, but you have to know
    the structure of the item store before you can manipulate it. That is the good
    news — you can change the structure! This section contains examples of using PROC
    DOCUMENT to change the structure of the item list, which ultimately changes the
    nodes in the table of contents in the output.


    One common desire for the table of contents is to have one parent node with multiple
    child nodes. The PAGE and CONTENTS = options on the BREAK statement do not create
    multiple nodes in the item store, there is nothing to manipulate to create child
    nodes. The section on BY-variable nodes demonstrated making each BY value a node,
    but those nodes did not have a parent node. This is where PROC DOCUMENT comes
    in. PROC DOCUMENT can create a parent node with a meaningful label and then move
    child nodes underneath it again, with meaningful labels.


    Creating one parent node with multiple child nodes is a two-step process.


    +   1. The first step, seen in Example 7.17a, is to create a document item store
    containing the PROC REPORT output, a BY statement required to create the required
    number of items.

    2. The second step, seen in Example 7.17b, is to create a new directory in the
    item store and move the output objects to that directory with the desired label.


    The table of contents generated by the result of these two steps can be seen in
    Output 7.17.


    Example 7.17a: Create Document Item Store Containing PROC REPORT Output


    ```

    proc sort data=orders;


    by customer_country;

    run;

    ```'
