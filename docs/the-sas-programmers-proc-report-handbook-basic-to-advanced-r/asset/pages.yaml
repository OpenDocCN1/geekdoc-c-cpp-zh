    # # Row Percentages


    ACROSS variables automatically create columns that can be compared and contrasted.
    A certain variable takes ‘value a’ or ‘value b’. Therefore, row percentages are
    a natural fit for these kinds of reports. The denominator is the total value for
    a particular row. The numerator is the value for a specific value of the ACROSS
    variable.


    In Example 4.11, the percentage for each gender is calculated for each order type
    within a country, in Output 4.9.


    # ## Example 4.11: Calculate Percent For Gender Within Country


    ```

    options missing="";nproc report data=customer_country_type customer_gender,

    (total_retail_price pct);

    define customer_gender / group format=$cntry;

    define order_type / group format=typef;

    define total_retail_price / ''Total Retail Price'';

    define pct / computed format=percent=8.1 ''Percent Retail Price'';ncompute pct;

    _c4_ = _c3 / sum(_c3_, _c5);

    _c6_ = _c5 / sum(_c3_, _c5);

    endcomp;

    run;

    ```'
