  md: "# 2.6 Repeating GROUP or ORDER Variable Values\n\nIn the final report, the\
    \ value of a GROUP or ORDER variable is not repeated if its value is the same\
    \ as in the row above it. A value is only placed in a cell when it is the first\
    \ value within grouping. For some reports, you might want the value to be repeated\
    \ on every row. This section demonstrates how to accomplish that goal.\n\nOne\
    \ important thing to keep in mind is that an IF condition that is based on the\
    \ value of a GROUP or ORDER variable will be true only on the first row of the\
    \ grouping, because it is only the only row that has a value.\n\n# 2.6.1 Character\
    \ Variables\n\nCharacter GROUP/ORDER variable values can be forced to repeat by\
    \ using a temporary variable. Example 2.8 shows the syntax for creating the needed\
    \ temporary variable. In a compute block, create a temporary variable to hold\
    \ the value from the first row of the grouping. Then, for rows where the value\
    \ is not originally populated, the held value can be inserted.\n\nExample 2.8:\
    \ Repeat GROUP Variable Value using a Temporary Variable\n\n```\nproc report data=orders;\n\
    column customer_group customer_gender quantity;\ndefine customer_group / group;\n\
    define customer_gender / group;\ncompute customer_group;\n not missing(customer_group)\
    \ then hold = customer_group;\nif missing(customer_group) then customer_group\
    \ = hold;\nendcomp;\n```\n\n+   Determine if the CUSTOMER_GROUP variable contains\
    \ a value. If it does, then place the value in the temporary variable called HOLD.\
    \ The value of HOLD does not change until a new, nonmissing value of CUSTOMER_AGE\
    \ is encountered."
  merge: -1
