  md: '# 6.5.3 Color on the Diagonal


    For some reports, the values on the diagonal are the most important and need to
    be highlighted to draw the readers'' attention. Highlighting the diagonal makes
    the most sense when a GROUP variable and an increasing ordered value; for example,
    CUSTOMER_AGE_GROUP starts with the youngest age group and ends with the oldest
    age group. When an ACROSS variable is used to create the columns, highlighting
    the diagonal cells is straightforward because the column number can be compared
    to the row number.


    The ACROSS variable, CUSTOMER_AGE_GROUP, has a logical increasing order in Example
    6.18 and Output 6.15. PRODUCT_LINE does not have an obvious logical order, but
    it is used as the GROUP variable. It has four groups, which helps demonstrate
    highlighting the cells on the diagonal. Presumably, your data would have two variables
    closely linked with a matching number of distinct categories.


    # Example 6.18: Apply Color in a Diagonal Pattern under an ACROSS


    ```

    proc sql noprint;

    select count(distinct customer_age_group) into :ctntage

    from orders;

    quit;

    options missing=";

    proc report data=orders;

    column product_line customer_age_group;

    def product_line /group;

    define customer_age_group /across;

    compute before product_line;

    row_num+1;

    endcomp;

    compute customer_age_group;

    doi=1 to &ctntage;

    if row_num=i then call define(i+1,''style'',

    ''style=[background=cxfe9929]'');

    end;

    endcomp;

    run;

    ```


    +   Determine the number of distinct categories for the ACROSS variable CUSTOMER_AGE_GROUP.
    Put this number in a macro variable that will be used inside of a compute block
    in PROC REPORT.'
