- img_proc: true
  md: 'This is vastly different from the Listing destination, where the first set
    of columns will be output for a given number of observations (determined by PAGESIZE)
    and the second set of columns will be output for the same observations. This pattern
    continues for all observations.


    Non-Listing destinations, to interleaved pages, where the first set of columns
    is on page one and the second set of columns is on page two, you will need to
    add a variable to the input data that can be used as a GROUP or ORDER variable.
    This new variable will set the number of observations for each table. This new
    variable must be placed on a BREAK statement to keep the observations together.
    The PAGE option on a DEFINE statement places the second set of columns in a new
    table. The destination places each table on its own page. The value of the new
    variable is populated based on the number of observations that can reasonably
    fit on a page when taking into consideration margins, font size, and business
    requirements.


    Because PROC REPORT does not know where to report a page break will be inserted,
    it does not know whether all rows for a particular grouping will fit on a page.
    PROC REPORT will create a new table when the GROUP or ORDER variable on the BREAK
    statement changes values and the PAGE option is specified. If you want the value
    of GROUP or ORDER variable to repeat at the top of a page or you want all rows
    for a group to be on one page, you have to specify the PAGE option on the BREAK.


    The only way to truly control where page breaks occur in non-Listing destinations
    is to have a "paging" variable. This variable, along with the use of the PAGE
    option dictates the number of observations and columns that you will see on a
    page. See Chapter 3 for an example of creating a paging variable.


    The THISPAGE, LASTPAGE, and PAGEEOF formatting functions are often used for the
    PDF and RTF destinations. The destination is responsible for populating the values.
    PROC REPORT cannot does not control these values. The only way PROC REPORT has
    an effect is through the PAGENO option, discussed in Chapter 1. Even using the
    PAGE option does not guarantee a new page will start or that the page number will
    be incremented.'
