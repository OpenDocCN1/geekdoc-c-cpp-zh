    #  3.3.3 Multiple Summary Rows at One Location


    As discussed previously, summary rows are created by BREAK and RBREAK statements.
    The placement of the rows in the report is dictated by the *location* value, BEFORE
    or AFTER. Every GROUP or ORDER variable can have two summary rows, one at each
    *location*. The report can also have a row at the top and bottom. PROC REPORT
    will not let you place two summary rows at the same *location*. In other words,
    you cannot have BREAK or RBREAK statements that look exactly alike. PROC REPORT
    will produce only one row.


    This section demonstrates how to produce a report that looks like it has multiple
    summary rows at the same location; The “trick” is that the rows are actually not
    at the same *location*; they are produced by different variables that happen to
    start and end at the same place in the final report. Therefore, the summary rows
    appear at the


    In this section, the summary rows are written to output using the AFTER *location*.
    Therefore, they appear in the order the variables appear on the COLUMN statement
    from right to left. The variable farthest right writes the top row. The variable
    leftmost writes the bottom.


    Producing a report with extra summary rows requires a fairly large amount of code.
    You need to create additional variables, include DEFINE and BREAK statements for
    the variables, and create assignment statements for every summary row and column.


