    # 5.1 Introduction


    Chapters 3 and 4 demonstrated a number of techniques for generating the desired
    report. For example, you can add dummy variables to your data set to leverage
    the grouping power of PROC REPORT or include categories in a PROC FORMAT step
    to ensure that appear in the report. However, there are just some things it cannot
    do without the data being pre-processed or restructured. The goal of this chapter
    is to provide a sampling of the types of reports that require extra work prior
    to PROC REPORT. For each of these reports, the chapter demonstrates a method that
    you could use to pre-process your data.


    PROC REPORT will not sort a report by an ANALYSIS or COMPUTED reportitem. You
    must have the final statistics in a data set used by PROC REPORT for your report
    to be sorted. This chapter shows how to generate such a report.'
  merge: -1
  pgno: 165
- img_proc: true
  md: 'The COMPLETEROWS option is covered in Chapter 3. It is a very useful option,
    but for some reports, it might not create the desired report structure. Multiple
    sections in this chapter provide methods for generating the desired report in
    circumstances where COMPLETEROWS cannot or should not be used.


    Variables and their labels hold large amounts of information, but PROC REPORT
    will only allow one usage type. This chapter explains how you can restructure
    your data to use all pieces of information stored with a variable. Data restructuring
    is the only way to use a variable''s information in both the header and data sections
    of a report.


    ODS destinations and PROC REPORT will wrap or split variable text as they can.
    However, you only know what works best for your data and the reader of a report.
    You must alter your data values to take full control of when and how a variable''s
    value wraps.


    Finally, this chapter discusses report structures that are the most difficult
    to produce with PROC REPORT. The best thing to do is calculate the values for
    these types of reports with other procedures. Then use PROC REPORT to output the
    values in the structure of the data set.


    PROC MEANS used extensively throughout this chapter, but you do not have to use
    PROC MEANS. You can use any procedure or DATA step technique that you are comfortable
    with and gets the job done.


    # 5.2 Sort by Statistic


    PROC REPORT cannot sort by an ANALYSIS variable or COMPUTED-item. If you want
    to sort by a statistic, you have to calculate the statistic first. The statistic(s)
    can be calculated with the procedure of your choice. For example, PROC SQL, PROC
    TABULATE, PROC MEANS, and PROC REPORT can create output data sets that contain
    summary statistics. Statistical procedures, like PROC LOGISTIC or PROC GLM, may
    also be used to generate output data sets with a particular statistic like an
    odds ratio or a p-value.


    You can then define the pre-calculated statistic variable as GROUP or ORDER, which
    PROC REPORT can sort by. Alternatively, you can create a variable to indicate
    the desired sort order and use that in the PROC REPORT step.


    # 5.2.1 Grouped Report, No ACROSS Variable


    This section demonstrates the steps needed to sort a grouped report by a statistic.
    These types of reports do not have an ACROSS variable. We have a report with CUSTOMER_COUNTRY,
    CUSTOMER_AGE_GROUP, and QUANTITY. Both CUSTOMER_COUNTRY have been defined as GROUP.'
  merge: -1
  pgno: 166
- img_proc: true
  md: 'final report has the values of CALC_QUANTITY sorted in descending order each
    country. Example 5.1a demonstrates the needed statistics with PROC MEANS. Example
    5.1b shows PROC REPORT step that sorts the report by the descending value of CALC_QUANTITY.
    The results are shown in Output 5.1.


    # Example 5.1a: Pre-Calculate the Sum of QUANTITY within CUSTOMER_COUNTRY


    ```

    proc means data=orders noprint;

    class customer_country customer_age_group;

    var quantity;

    output=order_sum sum=calc_quantity;

    ```


    +   This example uses PROC MEANS to pre-process the data. The NWAY option instructs
    PROC MEANS to keep only the most detailed level of the CLASS variable combinations.
    The NPRINT option suppresses the printing of a table.


    +   Place the variables that you would define as GROUP in PROC REPORT on the CLASS
    statement.


    +   QUANTITY is the ANALYSIS variable for which the procedure will calculate a
    statistic.


    +   The OUTPUT statement sends the final statistics to a data set, ORDER_SUM.
    The keyword for the desired statistic, SUM=, is used. The summed value is placed
    in the variable called CALC_QUANTITY.


    # Example 5.1b: Sort Report by CALC_QUANTITY within CUSTOMER_COUNTRY


    ```

    proc sort data=order_sum;

    by customer_country descending calc_quantity customer_age_group;

    proc report data=order_sum;

    column customer_country customer_age_group class

    define customer_country / order format=$cntry;

    ```


    +   Use PROC SORT to sort the ORDER_SUM data set by CUSTOMER_COUNTRY and the descending
    value of CALC_QUANTITY.


    +   Specify the new data set, ORDER_SUM, on the PROC REPORT statement.


    +   The COLUMN statement contains the original GROUP/CLASS variables, CUSTOMER_COUNTRY
    and CUSTOMER_AGE_GROUP. CALC_QUANTITY is the summed variable from PROC MEANS.'
