    # # Sort by the Statistic within Each Value of ACROSS


    As mentioned above, there is more than one way to sort a report that has grouping
    variables and an ACROSS variable. Instead of CUSTOMER_AGE_GROUP being in its column,
    it could be placed under each gender value. The sum for QUANTITY for each value
    of age group can be sorted within each value of gender. The final report could
    have a different age group as the first row for each column of gender.


