    \ as shown in Example 3.32, which will generate Output 3.31.\n\n# Example 3.32:\
    \ Output Text at the Bottom of the Table Structure\n\n```\ncompute after;\n  line\
    \ \"The Orders data set does not have data for Mexico\";\nendcomp;\n```\n\n# Output\
    \ 3.31: Output Text within the Table Structure\n\n| Customer Country | Order Type\
    \ | Product Line | Quantity Ordered | Total Retail Price for This Product |\n\
    | ODS data set does not have data for Mexico |\n\nThe TAGATTR style allows you\
    \ to insert text strings that the ODS destination interprets as special instructions.\
    \ In the Tagsets.Excel destination, you can use a special instruction to hide\
    \ a specific row. The row still exists in the table but is hidden from view. Inside\
    \ of a compute block, you can instruct Tagsets.Excel to hide the blank row of\
    \ data, as demonstrated in Example 3.33 and Output 3.32.\n\n# Example 3.33: Use\
    \ TAGATTR to Hide the Blank Row\n\n```\ncompute customer_country;\n  if customer_country\
    \ = ' ' then call define(\n    row_=\"style\",style=\"tagattr=yes=\"hidden\"\"\
    );\nendcomp;\n```\n\n# Output 3.32: The Row Is Hidden in Tagsets.Excel Output\n\
    \n| Customer Country | Order Type | Product Line | Quantity Ordered | Total Retail\
    \ Price for This Product |\n| The ORDERS data set does not have data for Mexico\
    \ |\n\nIn the new ODS destination for Excel, you do not have to use special TAGATTR\
    \ instructions. The destination has an option for hiding rows. You can hide single\
    \ rows or a range of rows. The destination option will produce the same table\
    \ as shown in Output 3.32.\n\n```\nods excel options (HIDDEN_ROWS='2');\n```\n\
    \n# 3.4.5 Dynamically Assign Spanning Header Text\n\nSpanning header text is assigned\
    \ on the COLUMN statement. Its value is generally hardcoded. A macro variable\
    \ can be specified within double"
  merge: -1
