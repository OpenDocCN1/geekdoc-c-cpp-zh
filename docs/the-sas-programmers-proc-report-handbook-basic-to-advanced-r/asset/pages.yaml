- img_proc: true
  md: 'Temporary variables can be created in any compute block. However, you must
    take into account when the compute block executes, a temporary variable created
    inside of a COMPUTE AFTER_PAGE block will not be of any use. A temporary variable''s
    value is available in the compute block where it is created and any compute block
    executes after it.


    These variables are very useful for repeating GROUP values (already demonstrated)
    as well as calculating percentages or maintaining a running total.


    # 2.10 Sorting and the ORDER = Option


    The input data set is not required to be sorted unless you use a BY statement.
    PROC REPORT will sort the contents of a report if least one variable is defined
    as GROUP, ORDER, or ACROSS. The report cannot be sorted by ANALYSIS, DISPLAY,
    or COMPUTED report-items.


    The values of GROUP, ORDER, or ACROSS report-items are automatically sorted. The
    default sort order is FORMATTED, which is different from most other procedures.
    To match the default sort order of other procedures, you must specify it on the
    DEFINE statement using the option ORDER = INTERNAL.


    Another way to sort the output is to use ORDER =DATA. PROC REPORT establishes
    a sort order based on the values for that variable appear across all observations
    in the input data set. This will produce the expected output if you have just
    one variable ordering the PROC REPORT output. For reports that have multiple variables
    contributing to the order of the report, you might not get the expected output.


    A variable defined with ORDER =DATA might be nested inside another GROUP/ORDER
    variable or within a BY group, but the ORDER =DATA sort order is created based
    on that variable alone. The sort order is not established or changed per grouping
    or value.


    The behavior of ORDER =DATA can be difficult to understand. To visualize the behavior,
