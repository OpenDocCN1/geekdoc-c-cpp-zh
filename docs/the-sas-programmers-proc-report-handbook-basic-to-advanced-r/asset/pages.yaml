    # ## 2.2 General Execution


    PROC REPORT completes many of its behind-the-scenes processing steps prior to
    building the final report that you see in your output destination. The steps are
    numbered below, but please keep in mind that some of these actions happen simultaneously.


    +   1. As with other procedures, PROC REPORT first does a syntax check. It will
    issue error messages and stop processing when a syntax error is found.


    +   2. Once PROC REPORT has finished checking for syntax errors, it evaluates
    the variable usages found on the DEFINE statements, or inferred on variable type.
    If any numeric ANALYSIS variables are present, a call to the summary engine is
    made. The presence of a GROUP or ORDER variable will trigger a call to the summary
    engine as well. GROUP, ORDER, and ACROSS variables trigger the use of the sort
    engine.


    +   3. The summary engine calculates the statistics for ANALYSIS variables for
    the overall report, and for any GROUP/ORDER values. The summary values are held
    in memory until they are needed during the report-building phase. Because these
    values are held in memory, their values are available to various compute blocks.
    See Section 2.3.2 for a discussion of each type of compute block.


    +   4. If a variable with an ACROSS usage, the number of levels column names are
    determined. Absolute column numbers are determined and the assigned (_c1, _c_,
    and so on).


    +   5. After summary statistics are calculated and observations are consolidated
    and ordered, PROC REPORT begins to build the report. The first step of this build
    process is to initialize all of the temporary variables to missing. PROC REPORT
    builds one row and one column at a time. At the start of the detail rows, it initializes
    all of the report-item variables to missing, and fills in the values. When a compute
    block is present for that particular column, the compute block is executed.'
