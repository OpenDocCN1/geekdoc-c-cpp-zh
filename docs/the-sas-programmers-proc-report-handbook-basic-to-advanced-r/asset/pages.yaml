- img_proc: true
  md: 'To create a report that uses information from one variable in the header (columns)
    and data (rows) sections of the report requires pre-processing restructuring of
    the data. If you have a categorical variable that you want to use headers and
    rows in the same report, the strategy is straightforward – create a copy (with
    a new name) of the variable in a DATA step. If you want to use a variable''s name
    or label to create rows and its values to create columns, you have to restructure
    your data.


    A number of scenarios fall under the second circumstance. Questionnaire data is
    one such scenario. The data has one observation per respondent and one variable
    per question. The label of each variable is the question text. The final report
    should list the text of the variable in a column (each row is a question) and
    subsequent columns should display counts, percentages, and averages for each response.
    Another scenario is clinical data with pre- and post-surgery measurements. The
    final report should list the measurement type in a column (each type has its own
    row) and subsequent columns should list statistics on that measurement.


    Both of these scenarios require restructuring of the data set. The data set must
    contain one variable indicating the row value (the question text or “pre and post”)
    and at least one variable containing the response, which could be character or
    numeric. For the scenarios above, the second variable is most likely to be numeric.


    SAS has many ways to restructure data to create a new data set. You can use a
    DATA step, PROC TRANSPOSE, PROC SQL, or the OUT = option on many procedures. Recommending
    the best method is difficult. The best method depends on the data, the desired
    report, and the programmer, and it might require many steps. In the end, the best
    method might be what is easiest and most familiar to the programmer. No matter
    which method is used, you, as the programmer, must ensure that you have one variable
    that contains the grouping, or row designation, and one variable that will be
    analyzed. However, the new data set can also contain other grouping or analysis
    variables.


    This example will use three numeric variables from the ORDERS data set: QUANTITY,
    TOTAL_RETAIL_PRICE, and DISCOUNT. The final report will contain one row for each
    of these variables. The first column will indicate the original variable''s label.
    The subsequent columns will contain the N, MEAN, MIN, and MAX statistics.


    For the ORDERS data set, it makes the sense to use PROC TRANSPOSE to create a
    new data set, seen in Example 5.10a and Output 5.11. The new data set will have
    one observation per order (ORDER_ID) and product name (PRODUCT_NAME). The columns
    created by PROC TRANSPOSE will contain the original variables'' names, labels,
    and values. Prior to the PROC'
