    ERROR: A DISPLAY or GROUP variable above or below an ACROSS variable requires
    that there be an ORDER, GROUP, or DISPLAY variable in the report that is not above
    or below an ACROSS variable.


    As indicated by the error message, a GROUP variable needs to be in the report
    but not under the ACROSS when a GROUP or DISPLAY variable is under the ACROSS.


    Solution:


    If you do not already have a suitable variable, you need to create a grouping
    variable in a DATA step to place the ACROSS variable on the COLUMN statement in
