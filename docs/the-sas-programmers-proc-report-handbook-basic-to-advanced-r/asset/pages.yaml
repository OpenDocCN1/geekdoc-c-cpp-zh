    # 6.8.4 Special Instructions for the ODS Destination


    One of the advanced features of the STYLE = ODS option is that it allows PROC
    REPORT to pass special destination-specific instructions to the ODS destination
    where the report is being rendered. Chapter 3 touched on this concept briefly
    with the explanation of the TAGATTR = attribute. This attribute passes Excel-specific
    instructions. TAGATTR= be used with both the Tagsets.ExcelXIP and the ODS destination
    for RTF command codes can be passed to Microsoft Word when creating RTF documents.
    HTML tags can also be passed to HTML-based output, most often with the HTMLSTYLE=
    attribute.


    To PROC REPORT and SAS, the instructions are simple text strings. The ODS destination
    is responsible for interrupting the instructions and executing the command. You
    must be careful when passing special instructions to the ODS destination because
    SAS does little to syntax checking on the string. SAS gives the programmer the
    power to pass the instruction, and assumes that the programmer has entered a valid
    command. If the command is incorrect, it is unlikely that an error or warning
    is printed to the log. It is more likely that an incorrect command alters the
    output in an unexpected way or produces a corrupt file.


    It is common to need to send special instructions in output generated for Excel.
    The special instruction might be to apply an Excel-specific format, for'
  merge: -1
  pgno: 251
- img_proc: true
  md: 'example, changing negative numbers so that they are displayed in red. A special
    instruction might also be used to hide a row, as demonstrated in Chapter 3. The
    TAGATR= attribute is also capable of formulas for Excel.


    The formula in Example 6.31 simply divides one by another, but it demonstrates
    the technique of using the STYLE= option to insert special instructions for Excel.
    Output 6.28 highlights the formula for one cell. The formula is applied to all
    rows for a column, but it could have been applied via a CAA define statement and
    limited to one row or one cell.


    # Example 6.31: Use STYLE= to Send a Formula to Excel


    ```

    ods excel file="Output6-28.xlsx";nproc report data=orders;

    column customer_age_group customer_gender quantity

    total_retail_price new;

    define customer_age_group / group;

    define customer_gender / group;

    define new / computed ''Price per Unit''

    style(column)={tagattr=''format:Currency formula:RC[-1]/RC[-2]''};

    compute new;

    new = 0;

    endcomp;

    run;

    ods excel close;

    ```


    The COMPUTED variable needs a value before the formula can be applied. Setting
    NEW to zero ensures the formula is applied and a value is present in the final
    table.


    # Example 6.28: For the Last Column Generated By a Formula


