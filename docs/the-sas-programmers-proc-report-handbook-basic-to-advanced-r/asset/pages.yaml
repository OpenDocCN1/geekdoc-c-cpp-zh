    # 1.1 Introduction


    The REPORT procedure is a powerful tool for generating reports in any industry.
    PROC REPORT is a versatile procedure that allows you to calculate statistics,
    create new columns, consolidate, sort, and transpose observations. The goal of
    this book is to teach you, through examples, how to make PROC perform each one
    of these functions and generate the report that you need.'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'Chapter 1 explains each statement in PROC REPORT and the available options.
    Chapter 2 discusses important concepts on how PROC REPORT builds a report. Use
    Chapters 1 and 2 as a reference as you work through the examples in Chapters 3,
    4, and Those chapters demonstrate how to structure the report that you want. Chapters
    6 and 7 provide examples that put the finishing touches on your report by adding
    style changes and a table of contents. Chapter 8 helps you troubleshoot any errors
    or warnings that you might encounter along the way.


    Learning any procedure in SAS starts with understanding the various statements
    and options associated with that procedure. PROC REPORT has eight statements to
    use along with the procedure statement. Each of these statements and their options
    play a unique role in creating the desired report.


    The statements covered in this chapter are:


    +   PROC REPORT – assigns the input and output data sets and controls the general
    layout of the report.


    +   COLUMN – dictates the report-items that will appear in the final report and
    spanning headers.


    +   DEFINE – specifies how each report-item is used, along with format and style
    specifications.


    +   BREAK – generates summary rows for groups.


    +   REBREAK – generates summary rows for the entire report.


    +   COMPUTE – begins a compute block, which is where PROC REPORT allows you to
    create new report-items, generate LINE statements, and apply cell-specific style
    attributes.


    +   ENDCOMP – ends a compute block.


    +   CALL DEFINE – sets the value of an attribute for a specific row or column.


    +   LINE – writes a row of text to the final report.


    Knowing the statements used in PROC REPORT is the first step to successfully creating
    output. This chapter explains each valid statement within PROC REPORT and its
    use. The chapter also discusses the options for each statement and how they might,
    or might not, affect your output. Commentary is provided on each statement to
    give helpful advice on how the options should be used and when they should not
    be used.


    As it explores each option, this chapter references the ODS Listing and non-Listing
    ODS destinations many times. The Listing destination is the traditional, monospaced
    destination that was the default destination prior to'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'SAS 9.3. All other destinations, such as HTML and PDF, fall into the non-Listing
    destinations category. As you learn to use PROC REPORT you will begin to understand
    how to apply options that affect the destination your final report will be sent.


    The information in this chapter should be used as a starting point for learning
    what PROC REPORT can do, but this chapter is not designed to replace or be thorough
    as Base SAS Procedures Guide, nor does it contain an exhaustive list of options.


    # ## 1.2 PROC REPORT Statement


    The PROC REPORT statement is the only required statement of the entire procedure
    and none of the options on the statement are required. You could run the entire
    procedure with this syntax:


    ```

    proc report;

    run;

    ```


    It is highly unlikely that you would want the report produced by this piece of
    code, but without any other statements, the output will contain every variable
    from the input data set. If the input data set has at least one character variable,
    the resulting report will be a printout of all variables for all observations.
    If the input data set has only numeric variables, the report will consist of one
    row, containing the overall sum of every variable.


    Most of the options on the PROC REPORT statement have been available since the
    early days of SAS. The majority of the options that control the report are designed
    for and are specific the ODS Listing destination. We will explore the options
    that affect every report created by PROC REPORT and touch on the options specific
    to Listing. As SAS and current business needs have evolved the Listing destination
    is used less and less; for cleaner code, specifying only the options valid for
    the open destination is the best practice.


    # ## 1.2.1 General Options


    The options in this section designate the input and output data sets as well as
    the information that PROC REPORT writes to the log. The section also covers options
    that affect the overall appearance of the final report.


    DATA =


    This option is used to specify the data set you want the procedure to use. It
    is optional, but it is best programming practice to include this option.'
