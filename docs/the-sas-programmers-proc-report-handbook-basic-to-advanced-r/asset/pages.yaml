  md: 'The content of a COMPUTUTE statement is vital to the output that you want to
    generate. A COMPUTUTE statement can contain a number of arguments: report-item,
    location, target, style=, or type-specification. You must specify a location or
    a report-item on every COMPUTUTE statement. You can also have a combination of
    these arguments.


    +   - report-item represents either a data set variable, a computed variable,
    or statistic.

    - location is either BEFORE or AFTER. It specifies where the compute block executes.

    - target is a break variable (a variable defined as either GROUP or ORDER). The
    target controls execution takes place. _PAGE_ is a special value of target.

    - STYLE= allows you to specify style attributes for any LINE statements within
    the block.

    - type-specification is the value CHAR and can include LENGTH=. The type specification
    defines the variable type of a COMPUTED report-item.


    # 2.3.2 Execution of Compute Blocks


    This section looks at the effects of combining the report-item, location, and
    target. The order of execution of compute blocks is based on the arguments from
    the COMPUTUTE statement. The arguments also affect the behavior of the compute
    block.


    Be aware that some report cells can be manipulated by more than one compute block.
    Also, most PROC REPORT steps do not contain every possible compute block. However,
    it is very likely that a PROC REPORT step will have more than one compute block
    of the same type.


    In general, compute blocks are executed in the following order:


    +   - COMPUTE report-item;

    - COMPUTE BEFORE;

    - COMPUTE BEFORE target;

    - COMPUTE BEFORE _PAGE;

    - COMPUTE AFTER;

    - COMPUTE AFTER target;

    - COMPUTE AFTER _PAGE;


    Table 2.1 describes the behavior of each compute block type. The execution time
    column explains when that compute block type is executed.'
