  md: "# 3.2.4 Create a New Report-Item\n\nOne of the unique features of PROC REPORT\
    \ is it allows you to create brand new report-items to place in the report without\
    \ adding them to the input data set. Character report-items can be concatenated\
    \ or abbreviated. Numeric report-items can be multiplied or added together, along\
    \ with many other numeric functions. PROC REPORT gives you the flexibility to\
    \ make the changes that you need. Remember PROC REPORT works left to right; when\
    \ creating new columns the report-item on the COMPUTE statement is very important.\
    \ All of the report-items used on the assignment statement, the one farthest to\
    \ the right on the COLUMN statement needs to be used on the COMPUTE statement\
    \ that all values are available.\n\n# Character Report-Item\n\nThis section will\
    \ demonstrate creating new character report-items. COMPUTED report-items default\
    \ to being numeric unless you specify otherwise. The option CHAR is used on the\
    \ COMPUTE statement to tell PROC REPORT to create a character report-item. Inside\
    \ of compute blocks, COMPUTED report-items are referenced by name as any other\
    \ DISPLAY, GROUP, or ORDER variables, which is demonstrated in Example 3.8 and\
    \ Output 3.8.\n\nExample 3.8: Create a Character COMPUTED Variable PRO_INFO\n\n\
    ```\nproc data=orders;\n  column customer_name product_line product_name prod_info\n\
    \  quantity;\n  define customer_name / group;\n  define product_line / noprint;\n\
    \  define product_name / noprint;\n  define prod_info = computed 'Product Line:\
    \ Product Name';\n  compute prod_info /char length=100;\n  prod_info = catx(':',\
    \ 'product_line, product_name);\nend;\nrun;\n```\n\n+   1 The COLUMN statement\
    \ contains the character variables from the input data set and the name of the\
    \ report-item to be created by PROC REPORT, PRO_INFO.\n\n+   2 PRODUCT_LINE will\
    \ contribute to the new report-item but does not need to be in the final report,\
    \ so the DEFINE statement contains the NOPRINT option.\n\n+   3 PRODUCT_NAME will\
    \ contribute to the new report-item but does not need"
