    # 7.6 RBREAK Statement CONTENTS =


    The RBREAK statement also has a CONTENTS= option. The option is valid only when
    used with the BEFORE location, the PAGE option, and the SUMMARIZE option. Another
    entry will be added to the third node level. Due to the restrictive nature of
    this option on the RBREAK statement, it might not be practical to use in most
    business situations. Example 7.12 demonstrates the additional entry generated
    by the RBREAK statement. The result is shown in Output 7.12.


