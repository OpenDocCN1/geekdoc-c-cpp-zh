    # Output Plain Text


    In some circumstances, the space for an empty table can be filled with plain text
    to indicate that no data fits. The text can be generated via an ODS TEXT = statement,
    PROC ODEXT, or with a PUT statement inside of a DATA step. An ODS TEXT = statement
    does not generate a bookmark in the table of contents. Therefore, this section
    will use a PUT statement within a DATA step.


    You must determine whether the data set is empty or does not meet settings prior
    to the PROC REPORT step. Then, you conditionally execute either the PROC REPORT
    step or the DATA step depending on the number of observations. To conditionally
    execute these steps, place them inside of a macro program.


    An in-depth explanation of macro processing is beyond the scope of this book.
    You can learn more about the Macro Facility in SAS 9.4 Macro Language: Reference.
    The general macro logic needed to conditionally execute either procedure code
    or a DATA step is explained in this section.


    There are a number of different ways to determine the number of observations in
    a data set and put value inside of a macro variable. The macro variable can be
    created either inside or outside of the macro program. For brevity, Example 3.30
    creates the macro variable outside of the macro program using PROC SQL. The results
    are shown in Output 3.29.


