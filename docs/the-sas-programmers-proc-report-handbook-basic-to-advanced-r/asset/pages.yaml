    #  8.3.2 Output via a COMPUTED Variable


    The second method for seeking the values of a temporary variable is to assign
    them to a COMPUTED variable. This method works best if the value changes frequently,
    such as on every row. It is especially helpful when checking a temporary variable
    that is keeping a running total.


    Chapter 3 contains an example of showing summary values for nested groups. The
    example requires temporary variables to hold a running tally of QUANTITY for each
    ORDER_TYPE. Let''s revisit the example, but modify it slightly so that the COLUMN
    variables change more frequently.


    A new report-item has to be placed on the end of the COLUMN statement so that
    it does not affect the creation of any of your other columns. A DEFINE statement
    and a compute block having a COMPUTED column does not have to be a permanent part
    of your PROC REPORT step. You can use it for troubleshooting and then remove the
    column from the code or add the NOPR option to prevent the column from appearing
    in the final report. Example 8.2 and Output 8.2 demonstrate including the COMPUTED
    variable.


    # Example 8.2: Use a COMPUTED Variable to View Temporary Variable Values'
  merge: -1
  pgno: 299
- img_proc: true
  md: '```

    data orders2;

    set orders;

    dummy1 = 1;

    dummy2 = 1;

    dummy3 = 1;

    run;

    proc report data=orders2;

    column dummy1 dummy2 dummy3 customer_group order_type

    total_retail_price quantity discount seetemvar;

    define dummy1 / group noprint;

    define dummy2 / group noprint;

    define dummy3 / group noprint;

    define customer_group / group /

    define order_type / group format=typef. order=internal;

    define seetemvar / computed;

    break after dummy1 /summarize;

    break after dummy2 /summarize;

    break after dummy3 /summarize;

    compute discount;

    if order_type in (1 2) then

    qntl + quantity.sum;

    end

    endcomp;

    compute seetemvar;

    seetemvar = qntl;

    endcomp;

    run;

    ```


    Add SEETEMVAR to the COLUMN statement. This report-item will hold the value of
    the temporary variable created in a compute block.


    Define SEETEMVAR as COMPUTED.


    A compute block is needed for the COMPUTED report-item. This compute block will
    execute on every row. It executes after the block where the temporary variable
    is assigned a value.


    The SEETEMVAR is assigned the current value of the temporary variable. Its value
    can now be seen in the final report.


