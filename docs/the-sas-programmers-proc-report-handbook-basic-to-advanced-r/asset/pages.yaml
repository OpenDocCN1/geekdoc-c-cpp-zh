    # 5.3 Use COMPLETEROW WITH ACROSS


    Chapter 4 includes a brief example of using a DISPLAY or GROUP variable under
    an ACROSS variable; recall, the examples used a "concise" data set. The chapter
    does not include any examples of using the COMPLETEROWS option that also uses
    an ACROSS variable. The reason Chapter 4 does not delve deeply into COMPLETEROWS
    is that, more often than not, those types of reports require pre-processing.


    COMPLETEROWS can be used to get all possible values of a GROUP variable under
    each ACROSS value. However, COMPLETEROWS might cause undesired output in two ways.
    it might create output with values populated only in a stair-step manner. It might
    also create output with many additional blank rows. This section explores why
    you might encounter either type of output and how to pre-process your data to
    get the desired output.


    # 5.3.1 COMPLETEROW and a GROUP Variable under an ACROSS Variable'
  merge: -1
  pgno: 176
- img_proc: true
  md: 'The COMPLETEROWS option creates all possible combinations for the values of
    the ACROSS variables, even if one or more of the combinations do not occur within
    the input data set. When COMPLETEROWS is specified and a GROUP variable is placed
    under an ACROSS, the resulting report is often extremely longer than expected,
    presents values in a stair-step pattern, or shows values only on the diagonal.


    PROC REPORT builds each column separately. Even when you specify an ACROSS variable,
    each of its columns is entirely independent of the other columns. The reason you
    might see values only on the diagonal is that PROC REPORT first creates the column
    for the first value of the ACROSS. The COMPLETEROWS option tells PROC REPORT to
    fill the column with all possible combinations of the ACROSS and the GROUP variables.
    Then PROC REPORT begins the creation of the second value of the ACROSS. However,
    the values for the second ACROSS value start at the row where the first column
    stopped. In other words, PROC REPORT does not move the report position back up
    to the first row of the report. As it builds the column for the second value of
    the ACROSS, it again fills the column with all possible combinations of the ACROSS
    and GROUP variables.


    # Default Behavior of COMPLETEROWS


    Example 5.4 demonstrates this behavior using the same four variables from Section
    5.2: CUSTOMER_COUNTRY, CUSTOMER_GENDER, CUSTOMER_AGE, GROUP and QUANTITY. CUSTOMER_COUNTRY
    will be a GROUP variable but it will be its own column. CUSTOMER_GENDER will be
    defined as ACROSS. CUSTOMER_AGE_GROUP will be defined as GROUP and placed under
    CUSTOMER_GENDER. The results are shown in Output 5.6.


    Example 5.4: Demonstrate Undired Output Generated by COMPLETEROWS


    ```

    proc report data=orders completeros;

    column customer_country customer_gender;

    (customer_age_group quantity);

    define customer_country / group format=$cntry;

    define customer_gender / across;

    define customer_age_group / group;

    run;

    ```


    The resulting table has the stair-step pattern. The entire report is almost two
    pages long; only part of the first page is shown here.


    # Output 5.6: Undesired Stair-Step Pattern Generated by COMPLETEROWS'
