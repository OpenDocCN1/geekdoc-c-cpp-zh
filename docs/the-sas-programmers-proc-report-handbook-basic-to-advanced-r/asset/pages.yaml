    # 3.2.5 Produce Summary Rows


    PROC REPORT has the ability to produce rows containing summary values of

    YSISYSIS COMPUTED report-items. The summary rows can be inserted

    at the group level or at the report level. A BREAK statement adds summary

    rows at the group level. The statement requires the name of either a GROUP

    or ORDER variable. An REBREAK statement adds summary rows at the report

    level.'
