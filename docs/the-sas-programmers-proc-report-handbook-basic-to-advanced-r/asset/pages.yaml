- img_proc: true
  md: "quotation marks as the text, but its value is set at the first pass through\
    \ the code. the text of the spanning header cannot be changed within one PROC\
    \ REPORT step. To dynamically assign the spanning header text, you must place\
    \ the PROC REPORT step inside of a macro program, and execute the macro program\
    \ for each value of the text that you displayed.\n\nA final report might require\
    \ the value of a BY variable to be in a spanning header. #BYVAR is not honored\
    \ inside PROC REPORT. Therefore, you need to place the PROC REPORT step inside\
    \ of a macro program and run the macro program for each value of the BY variable.\
    \ A macro variable reference to the BY variable can be placed as a spanning header\
    \ on the COLUMN statement.\n\nIn Example 3.34, CUSTOMER_AGE_GROUP is the BY variable,\
    \ so one table is created for each value. The BY value becomes a spanning header.\
    \ The result is shown in Output 3.33.\n\n# Example 3.34: Assign Spanning Header\
    \ Using a Macro Variable\n\n```\nproc sort data=orders;\n  by customer_age_group;\n\
    \n%macro rep(byvar);\n  proc report data=orders style=[width=lin];\n  where customer_age_group\
    \ = \"&byvar\"; 1\n  column (\"&byvar Age Group\") 2 customer_name customer_gender);\n\
    run;\n%mend rep;\ndata _null_\n  set orders;\n  by customer_age_group;\n  if first.customer_age_group\
    \ then call execute(cats(\n  '%hrstr(rep(\\',customer_age_group,')))); 3\nrun;\n\
    ```\n\n+   1 Subset the data used by PROC REPORT to the current value of BYVAR.\
    \ The macro variable name is BYVAR notice a BY statement is no longer needed,\
    \ because the macro program is being run for each CUSTOMER_AGE_GROUP value. Each\
    \ time PROC REPORT is executed, a new table is created, as it would be with a\
    \ BY statement.\n\n+   2 Place the macro variable inside double quotation marks\
    \ as a spanning header. The text will change each time the macro program is executed.\n\
    \n+   3 Use a CALL EXECUTE statement to execute the macro program for each value\
    \ of CUSTOMER_AGE_GROUP."
