    | 5 61-75 years | F | 61 | $5,360.85 | $87.86 |

    | 6 76-90 years | M | 114 | $9,954.75 | $87.02 |

    | 8 | F | 157 | $3,016.12 | $19.19 |


    The number of special instructions for each destination is so large and the capability
    too to cover in this book. Example 6.31 is designed simply to make you aware of
    the possibilities that are open to you. The need for special instructions gets
    smaller with each new release of SAS, because the capabilities are being built
    into the ODS destinations or new style attributes. However, as in this example,
    there are cases when they are their best option.'
