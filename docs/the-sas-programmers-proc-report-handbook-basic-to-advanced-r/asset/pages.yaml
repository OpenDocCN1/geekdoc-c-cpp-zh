    ERROR: An ORDER variable appears above or below other report items.


    An ACROSS variable cannot share a column with an ACROSS variable.


    Solution:


    The ORDER usage should be changed to GROUP. Please note that another GROUP variable
    needs to exist that is not under the ACROSS.


    ERROR: XXXX is not an ORDER, GROUP, or ACROSS variable and is marked DESCENDING.


    The DESCENDING option is only valid for ORDER, GROUP, or ACROSS variables. This
    error will be generated if the option is placed on a DEFINE statement for a DISPLAY,
    ANALYSIS, or COMPUTED variable.


    Solution:


    Remove the DESCENDING option to eliminate the error.


    ERROR: You cannot have a GROUP variable stacked with an ACROSS variable when there
    is a DISPLAY variable by itself in a separate column.


    PROC REPORT has some restrictions when an ACROSS variable is used. One such restriction
    is that you cannot have a DISPLAY variable that is not under the ACROSS when a
    GROUP variable is under the ACROSS.


    Solution:


    Change the DISPLAY variable to GROUP to avoid this error.


