    in one of four ways:


    name


    > Report-items that are defined as type GROUP, ORDER, DISPLAY, or COMPUTED are
    referred to name. By default, all character report-items have a DISPLAY usage.


    In the following example, the compute block is used to change the value of PRODUCT_LINE,
    which is a DISPLAY variable. Therefore, it is referenced by name.


    ```

    compute product_line;

    product_line = upcase(product_line);

    endcomp;

    ```


    compound name


    > ANALYSIS report-items are referred to by a compound name; the syntax is variable-name.statistic.
    By default, all numeric variables are ANALYSIS report-items, and the default statistic
    is SUM. Even if you do not include a statistical keyword in a DEFINE statement,
    you must use the compound name in the compute block.


    In this example, the value of TOTAL_RETAIL_PRICE is increased by 10%. The compound
    name is used for both references to the report-item.


    ```

    compute total_retail_price;

    total_retail_price.sum = total_retail_price.sum * 1.1;

    endcomp;

    ```


