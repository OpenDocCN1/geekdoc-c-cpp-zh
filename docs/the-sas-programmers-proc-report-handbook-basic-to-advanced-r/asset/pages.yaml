    have no effect for the variable XXXX.


    As the warning indicates, the MLF option is only valid for certain usage values.
    The message is generated if the DEFINE statement does not contain one of these
    usages.


    Solution:


    To eliminate the message, remove the MLF option from the DEFINE statement or change
    the usage to GROUP or ACROSS.


    # WARNING: A GROUP, ORDER, or ACROSS variable is missing on every observation.


    PROC REPORT will issue this warning when, as it says, a GROUP/ORDER/ACROSS variable
    has a missing value on every observation of the input data set. PROC REPORT will
    issue the warning, but will not generate a table when this situation occurs.


    Solution:


    If a missing value is valid, add the MISSING option to the PROC REPORT statement
    or the DEFINE statement for the offending grouping variable.


    NOTE: Groups are not created because the usage of XXX is DISPLAY. To avoid this
    note, change all GROUP variables to ORDER variables.


    By default, a character variable is defined as a DISPLAY. DISPLAY means that every
    row from the input data set will be printed. However, a GROUP variable is also
    defined in the PROC REPORT code. GROUP, by definition, means to consolidate the
    variables to the lowest common level. When there is a DISPLAY and a GROUP in the
    code, PROC REPORT will treat GROUP as ORDER and issue this note.


    Solution:


    Changing the usage from GROUP to ORDER will eliminate the note.


    # 8.2.2 BREAK Statement


    These errors and warnings might be generated by the BREAK statement.'
