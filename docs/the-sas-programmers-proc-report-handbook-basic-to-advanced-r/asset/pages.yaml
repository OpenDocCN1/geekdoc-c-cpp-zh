  md: '# Chapter 6.


    # 5.8 Create the Look of Merged Cells


    PROC REPORT will create merged cells in three ways.


    +   The SPANROWS option is specified in the PROC REPORT statement. Multiple rows
    in one column are merged into one cell containing a GROUP or ORDER value.


    +   A spanning header is created, either with text on the COLUMN statement or
    an ACROSS variable over multiple columns. Multiple columns in one row are merged
    into one cell containing the header text.


    +   A LINE statement is used in a compute block. One cell will be created for
    the row containing the LINE statement text and it will span all of the columns
    in the report.


    PROC REPORT has no other means of creating a merged cell. There are no attributes
    to specify a merged cell. However, for some reports, you want the final report
    to look like it has merged cells. This section demonstrates techniques to achieve
    the look of merged cells.


    # 5.8.1 Merge Vertically


    In some reports, the desire is to have a header cell that is merged vertically;
    in other words, a top and bottom cell become one cell. This is not possible with
    PROC REPORT. The only method for getting the merged look is to remove the border
    between the two cells or change the color of the border to match the background.
    The text will still belong to one of the cells. Example 5.14 demonstrates changing
    the border between two header cells, shown in Output 5.16.


    Example 5.14: Change Borders to Get Vertically Merged Cell Look


    ```

    proc data=orders rules=cols

    style(report)=[bordertopwidth=.75pt bordertopcolor=black];

    column(''Customer Name'' customer_name)\(''style[borderbottomwidth=.75pt

    Borderbottomcolor=black]Customer Demographics customer_country customer_age customer_gender);

    define customer_name / '' '';ndefine customer_country / ''Country'' format=$cntry;

    define customer_age / ''Age'';

    define customer_gender / ''Gender'';

    ```'
  merge: -1
  pgno: 201
- img_proc: true
