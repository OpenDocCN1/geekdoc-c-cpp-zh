  - '[PAGE 185]


    The main circumstance in which you wouldn’t use anticipation is when animating
    an inanimate object affected by gravity and you don’t want to give the impression
    of the object being alive.


    # How Much Anticipation?


    The amount of anticipation to animate depends on a number of factors:


    +   1. How much force is being put into the movement.

    +   2. How fast the movement is.

    +   3. How much you want to surprise the audience.

    +   4. Whether the anticipation is taking place during a movement or is initiating
    a change of direction during a movement.

    +   5. Whether the movement is anticipated by part of the person’s body or the
    whole body.


    # Force


    Following are examples showing how force affects anticipation.


    If somebody wants to throw a relatively light ball a long distance, they will
    lean right back in anticipation of the throw. They will pull back with the ball
    in the extreme position relatively slowly and accelerate out of the extreme position
    quickly.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_185_0.png)'
  - '[PAGE 186]


    If they are throwing the same ball a short distance and trying to hit a target
    with accuracy, the extreme position will not be as far back. They will move slowly
    backwards into the extreme position and accelerate slowly out of it, making a
    quick movement at the end of the throw with a flick of the wrist.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_186_0.png)


    If somebody is trying to throw a heavy ball, they may not be able to lean back
    very far without unbalancing themselves. In this case the ball would be kept fairly
    close to the body. The body would be used more in the throw, bending down at the
    knees and swinging the arms (if they are both holding the ball), just far enough
    backwards to prevent themselves from over-balancing. They could perhaps take a
    step back or part their legs further in order to keep their center of balance
    above and between their legs.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_186_1.png)'
