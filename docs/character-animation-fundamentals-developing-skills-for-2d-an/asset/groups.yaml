    The first thing to do when building an animated character is to think about what
    motivates the character. So, work through the seven questions of character and
    work out which Laban ''efforts'' suit the character and list those as well. Then
    work out the practicalities. Think about what your character will need to do during
    the piece of animation that you are going to create and make sure the character
    is going to be able to do it. For example, if your character needs to reach up
    to a high shelf, will their arms raise above their head? Are the arms long enough
    to reach? Will the hands be able to pick up the thing they are trying to reach?
    Make lots of lists.


    Next, put together a mood board. A mood board can be the cork board above your
    desk or a bit of cardboard with things stuck to it that will inspire you in the
    creation of your character. These can be illustrations from magazines, postcards,
    photocopies, printouts from web sites or fast food paper bags - anything! As well
    as the shape of your character, you need to think about the colours, textures
    and feel of the character and the movie they are going to be in. It''s always
    better to have all this reference stuff where you can see it all the time, rather
    than on a computer where you will have to go to a certain amount of trouble to
    open up a file and you won''t be able to see everything at once.


