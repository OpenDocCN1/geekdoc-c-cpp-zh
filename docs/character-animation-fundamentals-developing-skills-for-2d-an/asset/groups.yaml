    # Building a More Sophisticated Character


    Because modelling and rigging a more sophisticated character is quite difficult,
    I’ve stuck to the fundamentals. You should be consulting the manual that came
    with your software while constructing your character.


    I’ve built a character called Jenny, who you can open up in Maya or 3D Studio
    Max and have a go at animating. Video tutorials on the website show how to build
    her. I’ve also supplied a headless version of her, so you could just build a head
    and stick it on her body.'
