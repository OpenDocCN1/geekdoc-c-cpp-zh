  - '[PAGE 247]


    If the angle of the hip has the trailing hip higher and the leading hip lower,
    the spine curves forwards, giving a “negative” angle to the body. Depression,
    misery, goofiness and tiredness are suggested by this hip angle.


    Of course, there are lots of other things that will suggest the mood of your character
    (which we’ll go into later), but the angle of the hips and the body gives the
    basics of emotion in a walk.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_247_0.png)


    # *The Crossover Positions*


    The breakdowns to sort out are the crossover positions. These are the drawings
    where the raised leg crosses over in front of or behind the leg that is still
    in contact with the ground.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_247_1.png)'
  - '[PAGE 248]


    A leg that is picked up high during the crossover looks light. The hip of the
    raised leg will be higher than the other hip.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_248_0.png)


    These are the key drawings that give the audience a clue to the character and
    mood of your animation. A leg that drags along the ground when crossing over looks
    heavy. The hip connected to the raised leg would be lower than the hip of the
    leg touching the ground.'
  - '[PAGE 249]


    # Shoulder Movement


    With the stride key drawings, the shoulder opposite the leading leg will be forwards.
    The other shoulder will be trailing. Because the shoulders can move independently
    of each other, the leading shoulder can be higher, lower or level with the trailing
    shoulder.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_249_0.png)


    If the leading shoulder is angled higher than the trailing shoulder, the top part
    of the body looks as if it is pulled back. This gives an up-beat, positive feel.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_249_1.png)


    If the leading shoulder is lower than the trailing shoulder, the top of the body
    has more direction, giving determination to the character. The character is leaning
    towards what it’s walking to.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_249_2.png)'
  - '[PAGE 250]


    How you draw the crossover key positions for the shoulders will also give a guide
    to character. If the shoulder of the arm coming forwards moves up (in an arc)
    and the shoulder of the arm travelling back moves down (also in an arc) – creating
    a rolling of the shoulders towards the front of the body – the impression is given
    of someone who is pushy, determined and knows what they want: perhaps something
    of a gangster’s walk. The effort is being put into pushing the arms forwards.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_250_0.png)


    If the shoulder of the arm that is moving forwards dips down (in an arc) and the
    shoulder of the arm travelling back moves up (in an arc) – creating a rolling
    of the shoulders towards the back of the body – the impression is given of someone
    who is happy and positive. The effort is being put into pulling the arms back.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_250_1.png)'
  - '[PAGE 251]


    If both shoulders dip down when moving forwards and backwards, the appearance
    is given of lethargy and depression.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_251_0.png)


    # Arm Movement


    At their most basic, the arms will swing like pendulums. They will accelerate
    out of the extreme positions at the strides, moving faster when they are near
    to the body. They will then decelerate as they reach the next extreme key position,
    at the next stride.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_251_1.png)'
  - '[PAGE 252]


    <!-- no content -->'
  - '[PAGE 253]


    If the wrists initiate the movement, the hands flail out from the wrists down,
    following through the movement of the wrists.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_253_0.png)


    # Up-and-Down Movement of the Body


    As a person walks, their body bobs up and down. Depending on the mood of your
    character, this will happen at different places.


    During a basic walk, the body will bob down at the point when all the weight goes
    on to the one foot. It will lift up at the point where the foot is brought over,
    between the crossover position and the stride position.


    Making the highest point of the walk at the crossover will give a resentful, depressed,
    negative feeling. Animating the crossover at the lowest point of a walk will make
    the body bounce up and down further and give more positive feel.


    # Walk Cycles Displaying Different Moods


    It has to be emphasised that all the following examples of walks are stereotypes
    and as such are at the extreme cartoon end of the animation spectrum. The reason
    why I give these examples is that it is usually better to exaggerate real life,
    in order for your animation to look more convincing. If you try and make the animation
    look naturalistic (especially when you are learning to animate),'
  - '[PAGE 254]


    it will always end up looking stiff and wooden. It''s better to think of all your
    animation as having more in common with theatrical stage acting than with real
    life. When animating, I''ve often found that it''s better to ‘ham up’ a scene
    at first and then go back and tone the animation down if it''s too over-the-top
    (it rarely is).


    The mood or character of a person will affect the way they walk. If a person is
    depressed they will drag their feet and slouch forwards with droopy shoulders.
    Their inner turmoil will result in them putting as little effort into their forwards
    progression as possible so they can concentrate on being depressed. Every movement
    is an effort. A good depressed face and a head hung low will be the main signs
    to an audience of what is going on in the head of your character. The shoulders
    follow up and down arcs (the shoulder is at its highest point at each stride).
    Have a look at ‘depressed_walk_2D.avi’.


    A not-so-clever person will move in a similar way to a depressed person, but this
    time the reason why the person finds movement such an effort is that they find
    walking intellectually difficult! If this dragging of the feet with droopy shoulder
    movement is topped with an erect head with a stupid grin and half-open eyes (too
    much effort to open the eyes fully), your character has a goofy look. Have a look
    at ‘not_so_clever_walk_2D.avi’.


    An angry person has something they are angry at, focussing their attention/gaze
    on the object of their anger. They will stamp their feet and clench their fists,
    holding their body at a stiff angle forwards, maybe fixing their gaze toward the
    thing they are angry at. Their shoulders roll over the top as they move forwards.
    Have a look at ‘angry_walk_2D.avi’.


    A determined person will move in a similar way but with smaller movements and
    emphasis on the body angle. Everything about this person is pointing toward the
    goal that they want to achieve. Their head is down like a bull that is about to
    charge and they keep their leg and arm movements small so that nothing gets in
    their way.


    A happy person will walk with a spring in their step, perhaps putting a double
    bounce into their stride at the point where all the weight is on one foot. The
    strides will be light and the arms will swing with a snap (much slower at the
    extremes). It''s as if they are full of energy and are putting the excess into
    their walk. Their shoulders roll underneath as they move forwards. Have a look
    at ‘happy_walk_2D.avi’.


    If somebody wants to be quiet when walking, they could tiptoe. This involves taking
    little steps on the tips of the toes. See ‘tip_toe_2D.avi’.


    If someone is too scared to be really quiet (or is walking over a pond of ice,
    testing the surface), they could sneak. This involves placing the feet slowly
    onto the ground to test whether it will make a noise or break. When the character
    knows the surface is OK, they move forwards and take the next step.


    If somebody is cool and laid back, they will adopt a laid back position when they
    walk. The whole point of this type of walk is to give the impression that as little
    effort as possible is being put into it. The body is angled back and the legs
    are bent to help with balance. As the legs are picked up, the body will slowly
    lower and then rise as the legs are kicked forwards. See ‘sneak_2D.avi’.


    A dreamy person will float along, giving the impression of being very light. It
    is as if they are being carried along by their thoughts, the movement being like
    a leaf falling off a tree. Make them cushion themselves with their extended toe
    instead of each stride. See ‘dreamy_walk_2D.avi’.


    The double bounce walk is a type of walk used by a lot of cartoon characters.
    It involves having a dip of the body at the point where the front foot comes into
    contact with the ground and a second dip of the body as the rear foot leaves the
    ground. See ‘cool_walk_2D.avi’.'
