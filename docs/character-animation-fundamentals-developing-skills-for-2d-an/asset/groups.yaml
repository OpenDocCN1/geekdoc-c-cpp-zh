    ## Timing


    Timing is probably the most difficult thing to teach and learn about in animation.
    Timing makes a movement witty or touching or relevant. It is central to any form
    of filmmaking, whether live action or animation. It runs through all elements
    of visual moving imagery. Every chapter in this book is about timing.


    Timing is about conveying information to your audience so they can follow the
    action. I always think that good timing is the minimum period you give your audience
    to understand what is happening. If you make a move or a pose too quick, they
    won’t follow what’s going on. Make a move or a pose too slow and the audience
    will be bored. Timing controls how your audience reacts to what they see. Sometimes
    you will make your audience wait for the action, or lead them to expect one thing
    to happen but make another happen (surprise is the basis of a lot of humour).
    You can lull your audience into a state of complacency through repetition, and
    then make your character do something different. These are only a few examples
    of the use of timing, but you can see what I mean about it being difficult to
    teach.


    I touched on timing in Chapter 1, and I have been through the basic stages of
    working out timing during the exercises in Chapters 1, 2 and 3. To recap, these
    are as follows: first, draw the key positions (making sure they are as clear as
    possible) and shoot them on a line tester for the required

