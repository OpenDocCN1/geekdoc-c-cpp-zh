    ## The Dive Exercise in 2D


    We will animate a character diving off a cliff, then bouncing off a diving board
    and finally splashing into the sea. This scene is 70 frames long.


    During this scene, the diver is distorted on certain frames to emphasize the movement.
    The diver should never be distorted for more than one frame at a time and should
    only be distorted at the fastest point of any movement.


    When our diver takes off, distort him as far as you possibly can up to the apex
    of the jump. At the apex, have him regain his original shape. These are the second
    and third key positions, which are at frames 9 and 13, with the breakdown on frame
    11.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_220_0.png)


    The character will follow an arc through the air similarly to the balls we animated
    in Chapter 2. These are the third and fourth key positions, at frames 13 and 18,
    the breakdown being at frame 14.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_220_1.png)


    As our diver falls, make him distort again in the direction of the fall before
    he hits the diving board. These are the fourth and fifth key positions, at frames
    18 and 24, with the breakdown at frame 22.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_221_0.png)


    The diving board will bend as it is hit. At this point, it will move with the
    diver. These are the sixth and seventh key positions, at frames 25 and 31. The
    breakdown position is at frame 27. Diving board D5 goes with man M25, D7 goes
    with M27, D8 goes with M29, and D9 goes with M31.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_221_1.png)


    After the diving board bends down, the diver bounces up from the board and is
    stretched along the second arc of his dive. These are the seventh and eighth key
    positions and are framed 31 and 35. The breakdown position is at 33. Diving board
    D9 goes with man M31, D8 goes with M33, and D4 goes with M35.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_222_0.png)


    At the apex of this arc, the character slows down and regains his shape. These
    are the eighth and ninth key positions, at frames 35 and 40, the breakdown position
    being at frame 36. D4 goes with M35, D1 goes with M36, and D1 goes with M40.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_222_1.png)


    The diver will then fall into the water, distorting at the fastest point. These
    are the ninth and tenth key positions and are at frames 40 and 46. The breakdown
    position is at frame 44. D9 goes with M40, D3 goes with M44, and D3 goes with
    M46.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_223_0.png)


    Then there will be a splash as the diver falls into the water.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_223_1.png)


    The diving board will then vibrate to a stop. Draw the following positions and
    then shoot them in the order shown. This will produce the effect of the diving
    board vibrating and gradually coming to a stop.


    At the second key (frame 9), the man bends down into the position that anticipates
    the jump.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_227_0.png)


    At the third key (frame 13), the man is distorted as he jumps to the apex of the
    first bounce. When just putting in the key positions, we want to move the body
    to a point halfway between the man''s anticipation position at frame 9 and the
    apex of the first bounce, without any distortion.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_227_1.png)


    At the fourth key (frame 18), the man is at the apex of the bounce. Move him into
    the same position as the fourth drawn key position (drawing 18).


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_228_0.png)


    At the fifth key (frame 24), the key position should be distorted but, as for
    the third key, just move the man to a rough approximation of the correct position.


