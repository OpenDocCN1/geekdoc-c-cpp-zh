    # The Seven Questions of Character


    Ask yourself seven basic questions about the personality of your character. From
    the answers you can build a solid, defined character that everybody should understand.


    This is a very useful thing to do when working out what your character is like.
    It establishes where they have come from, where they are going and how they would
    react in a given situation. It should be done particularly thoroughly on a movie,
    where several animators may be animating the same character. Often I''ve seen
    the same character animated by several animators in several different ways, leading
    to a degree of confusion on the part of the audience!


    So, before you do anything (storyboarding or even scriptwriting, let alone animating)
    ask yourself the following seven questions about your character:


    +   1. Who am I? (Name, age, temperament etc.)

    +   2. Where am I? (In a bedroom, up a tree etc.)

    +   3. When am I? (Present day, seventeenth century, in the future etc.)

    +   4. What do I want? (Money, power, a simple life etc.)

    +   5. Why do I want it?

    +   6. How will I get it?

    +   7. What is stopping you getting it?


    These are standard questions that any actor would ask himself or herself when
    establishing a character for a play or a film. You don''t have to slavishly stick
    to these questions but this seven questions do act as a firm foundation, enabling
    you to get your character clear in your head and explain your character to other
    people (producers, directors, clients, an audience or other animators).


    You will find a .pdf form of these seven questions that you can print out and
    write on in Chapter 9 on the website. When you have filled it out, stick it up
    on the wall above your desk and keep referring to it!


    # The Different Types of Animation Acting


    Depending on the budget, time scale and type of production, most acting in animated
    films tends to fall into the following categories.


    # *Animated Radio*


    Also known as limited animation, this form of animation is a series of pictures
    that illustrate the script. This is probably the simplest form of animated acting.
    It is frequently used in low-budget television series. The characters move as
    little as possible and tend to be flatter in design to save time and money. When
    using limited animation your script needs to be as good as possible because you
    can''t use the animation to distract from weaknesses or holes in the plot.


    Animators working on these productions have to think far more about the drawings
    they do and they have to be very good draftspersons. The audience is relying on
    fewer drawings to convey the story.'
