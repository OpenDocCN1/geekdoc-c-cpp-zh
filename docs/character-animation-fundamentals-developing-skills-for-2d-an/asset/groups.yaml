    # # How to Animate a Basic Bouncy Ball in Maya


    # ## How to Create Your Ball


    Open up Maya and make the screen turn into four view panels by pressing the space
    bar on your keyboard quickly once. Make the mouse pointer hover over the front
    view panel and press the space bar quickly again to make the front view panel
    full screen.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_63_0.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_63_1.png)


