  - '[PAGE 297]


    in 1936, is well worth a read. Lee Strasberg was the first to develop training
    in method acting, at the Actors Studio in New York from the 1930s onwards.


    The basic premise is that an actor lives and breathes the character of the part
    he is about to play so that when the actor''s character is put in a given situation
    the character will react in a convincing way. This living and breathing of the
    character is carried out via workshops with other actors, the director making
    the actor act out spontaneous situations and also by the actor taking his role
    home with him and acting the character out in real life situations – imagine going
    out for the evening as Henry VIII!


    The actor is meant to use his or her own emotional experience and memory in preparing
    to live a role. An actor using this method is likely to ask, ‘what is my motivation
    for this scene?’. The idea is that, when an actor comes to reciting his lines,
    the body language, intonation and facial expressions will come naturally. It is
    a style of acting that is particularly suited to film. Quite often a camera will
    be left running while the actor acts out a scene, not knowing exactly how it will
    end. This ‘acting on the hoof’ can result in some very powerful performances.
    It can also end up looking rather ragged and messy, depending on the actor’s ability
    and plain good luck.


    In animation, the method acting technique is useful for working out how your character
    would act in a given situation. Act out what your character would do in front
    of a mirror, then use what you’ve learnt in your animation.


    # Theatrical Acting


    You can almost think of this form of acting as constructing the character from
    the outside in. The actor’s inspiration for the character is derived from the
    script. The director and the actor work out a series of positions and facial expressions
    to adopt while each line is read. Sometimes this form of acting is referred to
    as ‘negative acting’. Depending on the actor’s ability, it can seem over the top
    or it can be breathtaking.


    This technique is best used in animation to work out the main poses and facial
    expressions that your character will adopt during a scene.


    # Consequence


    In real life, any demonstration of an emotion (via body language, facial expression
    and tone of voice) will be as a consequence of emotions felt internally. In method
    acting, body language, tone of voice and facial expression are the consequence
    of genuine (or imagined) emotions felt by the actor, who uses his or her experience
    and memory to inspire these emotions). In theatrical acting, the actor mimics
    the body language, facial expressions and intonation that are the consequence
    of emotions in order to put these over to an audience.


    Method actors can be very disparaging of theatrical actors because of this mimicry,
    whereas theatrical actors can be disparaging of method actors because they can
    seem unable to act out a scene without knowing everything about the character
    they are playing.


    Animators have to use both acting techniques. They have to understand the characters
    inside out and know how a character will behave in a given situation (this is
    where an animator will act out a scene in front of a mirror). The animator then
    mimics the visible manifestations of these emotions (body language, facial expressions
    and tone of voice) in their animation.'
  - '[PAGE 298]


    # Emotions


    Emotions are the manifestations of conscious and unconscious feelings. They can
    include a character’s affectation, vibes, mood, attitude, state of mind, or a
    character trait.


    Emotions can be divided into three types, each of which has a sliding scale of
    intensity:


    +   1. *Positive and negative.* These emotions can range from happiness and enthusiasm
    (positive) to anger, sadness or boredom (negative).

    +   2. *Engagement and rejection.* These emotions can range from surprise and
    attention (engagement) to disgust and contempt (rejection).

    +   3. *Neutrality and high intensity.* These emotions can range from calmness
    (neutrality) to excitement (high intensity).


    Each of these three groups of emotions can be intermixed; for example, anger combined
    with contempt (negative and rejection).


    Emotions can be experienced very briefly (for only a few seconds or fractions
    of a second) or for a long time. A mood could last for a couple of hours or for
    several days. An attitude or state of mind could last for a very long time. A
    character trait will be a part of the character’s emotional make-up and will give
    a clue to the character’s outlook on life. For example, if a character is constantly
    miserable, they may have a sad or angry look on their face. Their shoulders may
    be stooped and their motions may be laboured.


    Acting is the bodily expression of these emotions.


    # Introduction to Laban Movement Theory


    One of the most useful things you can do as an animator is to take some drama
    classes. Actually learn about acting and movement and get somebody who knows what
    they are doing to teach you. A lot of animators dismiss this approach, saying
    that you don’t need to leap about and make a fool of yourself in order to animate.
    All I can say is that my animation has improved incredibly as a result of acting
    classes and any animator who doesn’t try this is missing out.


    Of all the drama techniques that I studied, I found the most useful to be Laban
    movement theory. This approach to acting and dancing was developed by Rudolf Laban
    (1879–1958). Laban not only was a choreographer, dancer and actor but also was
    interested in all forms of movement. He was involved in time and motion studies
    for industry and applied his theories using mathematics, geometry and drawing.


    I won’t even try to cover all aspects of Laban’s movement theory and will only
    review the absolute basics. The best thing you can do is to try and find a Laban
    movement class locally and do some exercises. Failing that you could look up the
    Laban Center web site (www.trinitylaban.ac.uk/Laban) or buy the book *Laban for
    Actors and Dancers* by Jean Newlove (1993). However, remember that nothing beats
    doing the movement yourself to really take it in.


    The great thing about Laban movement theory is that it makes you very body- and
    movement-aware. Through a series of exercises you become familiar with the way
    the body moves and how external and internal influences can affect it. The theory
    also ascribes movements to things like character and emotion.'
