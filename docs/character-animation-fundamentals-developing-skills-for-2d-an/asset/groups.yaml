    # *Pantomime Horse Construction*


    Pantomime horse construction involves constructing your four-legged animal like
    two actors in a horse suit.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_268_0.png)


    When the two actors walk in unison they will probably do something like the illustration
    below: both pairs of legs doing a basic human walk.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_268_1.png)'
  - '[PAGE 269]


    The walk consists of the four major key positions. The first key position is at
    frame 1: stride at the front, crossover at the back. The second key position is
    at frame 7: stride at the back, crossover at the front. The third key position
    is at frame 13: stride at the front, crossover at the back (mirror image of the
    first key position). The fourth key position is at frame 19: stride at the back,
    crossover at the front (mirror image of the second key position). This means that
    there are always at least two legs touching the ground and, in order to maintain
    a ‘tripod’ of balance, three legs will remain on the ground for as long as possible.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_269_0.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_269_1.png)'
  - '[PAGE 270]


    <!-- no content -->'
  - '[PAGE 271]


    <!-- no content -->'
  - '[PAGE 272]


    As with the pantomime horse walk, the tripod of balance will be maintained for
    as long as possible and the foot of the rear leading leg will step into the front
    trailing leg’s footprint.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_272_0.png)


    This kind of walk and construction is suited to the types of animal character
    that jump up and become more human-like and characters that talk and gesticulate
    with their front legs. Examples include Tom and Jerry and Bugs Bunny.


    I’ve included a basic animation – ‘cartoon_dog_2D.avi’ – in Chapter 6 on the website.


    # Correct Four-Legged Construction


    This is a four-legged animal that is constructed like a real quadruped. Still
    think of your animal as a human on all fours, but, rather than standing with the
    feet and the hands flat on the ground, the feet are articulated differently depending
    on the animal. The rib cage on the animal is elongated downwards whereas a human
    rib cage is flat. The shoulder blades on an animal are on the sides of the rib
    cage whereas a human they are on the back.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_272_1.png)'
  - '[PAGE 273]


    Unlike humans, these animals do not have a collarbone. This allows the shoulder
    blade to rotate and move up and down more freely. It is as though the shoulder
    blade of a four-legged animal has a sliding pivot point that can move up and down
    the side of their rib cage. When all the weight is on one of the front legs, the
    body will drop in relation to the shoulder, making the top of the shoulder blade
    stick out at the top of the body.


    # Animal Leg and Foot Construction


    The construction of the legs and feet of a four-legged character influence the
    way in which they walk.


    # *Animals with Paws*


    This category includes cats (big cats as well as domestic cats), dogs (all breeds
    as well as wolves and wild dogs), rodents (although they vary enormously) and
    some marsupials.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_273_0.png)


    Notice how the length of all four feet has been elongated and how the animal balances
    on the last two digits of the toes. The animal also walks on pads, giving it lightness
    as it walks on the ground. The legs remain fairly straight. Bend the legs when
    you want to suggest an animal is crouching in order to jump or is sneaking along.'
