  - "[PAGE 459]\n\n# Developing Skills for 2D and 3D Character Animation\n\n# Previous\
    \ Praise for Steve Roberts’ Character Animation in 3D\n\n> > “At last! A definitive\
    \ work on the principles of 3D animation, from a highly experienced, traditional\
    \ animator. Steve Roberts brings his substantial knowledge of teaching the fundamental\
    \ techniques of animation to this essential reference work—anyone who wants to\
    \ make a career in CG animation needs this book.”  \n> > — Dr. Mike Milne, Director\
    \ of Computer Animation, Framestore CFC\n\n> > “An understanding of basic animation\
    \ principles is often overlooked in 3D computer animation . . . this essential\
    \ source of knowledge will enable 2D and 3D animators to understand each other’s\
    \ purpose.”  \n> > — Daniel Greaves, Oscar-Winning Animator, Director of Tandem\
    \ Films\n\nApply the industry’s best practices to your own workflows and develop\
    \ 2D, 3D and hybrid characters with ease. Side-by-side comparisons of 2D and 3D\
    \ character design will help you improve your character animation and master traditional\
