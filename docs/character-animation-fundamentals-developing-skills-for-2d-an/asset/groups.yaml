    # The Lift Exercise in Maya


    Copy the folder ‘mayaman’ onto the C: drive of your computer (or wherever you
    want to put it). Open up Maya, go to the main menu and select File > Open. In
    the ‘mayaman’ folder, find ‘mayaman.mb’ (if you have Maya 2010 or earlier) or
    ‘mayaman-circles.mb’ (Maya 2011 onwards). Highlight it and click the Open button.


    Select a view where you have a side view of the character that is similar to your
    drawings (or the drawings in the illustrations of this book).


    So that we can select parts of the body more easily, we need to open the Hypergraph,
    which is a window that shows all of the components of the 3D man in a graphic
    form. To open the Hypergraph click on Window on the main menu and then click on
    Hypergraph: Hierarchy.'
