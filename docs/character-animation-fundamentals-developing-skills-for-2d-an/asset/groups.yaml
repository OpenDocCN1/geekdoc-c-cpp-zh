    For the 3D animation exercises outlined in the book, we will be using a very simple
    character, like the one below.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_127_0.png)


    The character is made up of two arms, two legs, a sphere for the head, a body
    like a bean and basic mittens for hands. The feet have joints at the ankles and
    toes.


    You can design your own character, but bear in mind that it is easier to do the
    exercises and then apply the timing and spacing learning to a 3D character that
    is similar to the 2D drawn one.


    When designing a character, there are a number of points to look at:


    +   1. Complexity

    +   2. The “graphic” nature of the character

    +   3. Strong silhouettes

    +   4. Weight and balance


    # How to Design a 3D Character


    The main thing to bear in mind when designing and building a 3D animated character
    is to *keep it simple*! You could build the most complicated character in the
    world, but if it’s very complex it makes it awkward to animate the object of the
    exercise is defeated. Internally, think of your character as being like a racing
    car. All the controls are cut down to a minimum and are easily accessible. There
    won’t be any cup holders, electric windows, climate control or the 101 other gadgets
    that you might find on'
