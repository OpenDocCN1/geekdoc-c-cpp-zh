    ## Animation of Acting – Facial Expressions


    ### Chapter Summary


    - Emotions

    - The Eyes

    - Facial Expressions

    - Head Angle

    - Hand-to-Face Gestures

    - Extreme Close-Ups

    - How to Animate a Piece of Facial Acting

    - Exercises


    Humans have the most expressive face in the animal kingdom. With a combination
    of eight basic expressions we can pull around 5000 different faces, all with slightly
    different meanings. The majority of these expressions are universal to all human
    cultures.


    The face is used as a signpost to other people. It shows how we are feeling and
    what we want, or can be used to mask the way we feel. Almost half of our brain
    is concerned with seeing and almost half of that part of the brain is dedicated
    to recognising human faces and facial expressions. When we look at someone, we
    study the face. We look at the eyes, the eyebrows, the lips and the forehead.
    They give out a combination of signals that provides us with the information to
    form an opinion as to what the owner of the face is thinking.


    When animating your character, because facial expressions can be very ambiguous
    and misleading, it is always best to work out the body language first and then
    add the facial expressions. I have deliberately kept the illustrations and examples
    in this chapter as simple as possible. It''s up to you to act out these emotions
    in a mirror to elaborate on them.


    ### Emotions


    Facial expressions are the ultimate demonstration of our emotions. We use the
    face to broadcast and communicate our emotions. Facial expressions are caused
    by the contraction and relaxation of the facial muscles.


    Facial expressions result from somebody hearing something, seeing something, smelling
    something, tasting something, feeling something or thinking something. As a character
    goes through a scene, the facial expression will change depending on these stimuli.
    Think of each facial expression as a key position and animate between them and
    hold them as necessary.


    On the most simplistic level, there are eight basic emotions: happiness, sadness,
    surprise, fear, anger, disgust/contempt, interest and pain.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_351_0.png)


    These are inherited, not learnt. Each of the basic emotions has an appropriate
    facial expression to display it. These are common to all human cultures. Some
    variations of these facial expressions are culturally specific and learnt.


    A combination of these basic facial expressions can appear on the face at the
    same time, for example happiness and surprise. All of the basic facial expressions
    can also be varied, depending on the intensity of the emotion portrayed.


    The design of a character could emphasise a certain emotion. A down-turned mouth
    will make your character look more sad, angry or irritable. Heavy-set eyebrows
    can produce the same effect. When this character displays an emotion other than
    the overriding emotion suggested by the design, the new emotion must be exaggerated
    to make up for the character’s design.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_351_1.png)


    Sometimes in animation we tend to only include ‘readable’ or ‘appealing’ facial
    expressions; however, it''s useful to include neutral – almost indistinguishable
    – expressions to complement these.


    ### The Eyes


    It is commonly said that the eyes are the windows of the soul, and the main feature
    that makes a character seem alive is its eyes. If the eyes are not focusing on
    something, your character will look like a groggy doll. Always give your character
    something to look at, either on screen or off. The only times your character will
    be not looking at something are when their eyes are glazed and looking into the
    mid distance or they have crossed eyes (when they are thinking or have been drugged
    or knocked out and are dazed). The eyes will lead all movement of the face and
    body. When a character looks off screen, the eyes move first, then the head, then
    the shoulders and then the body will twist at the waist.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_353_0.png)


    Following are some examples of emotions and the different looks connected with
    them. When a character is thinking, they could look heaven-ward for inspiration
    or down at the ground when searching for an idea.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_353_1.png)

