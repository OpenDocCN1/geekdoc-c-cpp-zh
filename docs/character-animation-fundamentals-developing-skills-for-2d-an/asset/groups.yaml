    As the character leans in one direction, the plumb line will move with the center\
    \ of gravity. If it swings far enough to reach a leg, other parts of the body\
    \ will need to be moved to maintain balance and to stop the character from falling\
    \ over. For example, if a person leans forwards, to maintain their balance they\
    \ need to stretch their arms out behind them. If they lean further, they will\
    \ need to stretch one leg out behind them.\n\n![](img/49afe0fca1d8f7ebd02f6839692b55f6_134_0.png)\n\
    \nIf a person holds a heavy bucket of water, they will lean their body at the\
    \ opposite angle to the arm holding the bucket.\n\n![](img/49afe0fca1d8f7ebd02f6839692b55f6_134_1.png)\n\
    \nSomeone who is overweight will need to lean back to balance his or her large\
    \ stomach.\n\n![](img/49afe0fca1d8f7ebd02f6839692b55f6_135_0.png)\n\n## Overview\
    \ of How to Build and Rig a Simple 3D Character\n\nThis character is built and\
    \ ready and waiting for you to animate it. Have a look in the folder “man_models”\
    \ in Chapter 3 folder on the website. However, if you want to have a go at building\
    \ him (and doing so will give you a better idea of how to animate him later),\
    \ following are some basic instructions. There are lots of ways to build and rig\
    \ a 3D animated character. I have deliberately kept him very simple so that he\
    \ is easy for a beginner to build.\n\nA 3D character’s skeleton will consist of\
    \ a series of bones (or joints) that are linked together and rotate in relationship\
    \ to each other (you will hardly ever move or translate these bones). These will,\
    \ in turn, move the skin (or envelope) that surrounds them. The bones need to\
    \ be linked to the skin. There are several ways of doing this, two of which are\
    \ the ‘skin and bones’ and ‘child of the joint’ methods.\n\n### Skin and Bones\n\
    \nThe most sophisticated way of constructing a character is to build a complete\
    \ skin and then insert bones within it and link them to the skin. This is referred\
    \ to as ‘skinning’ or ‘enveloping’. You then need to modify the skin so that different\
    \ parts of it move correctly in relation to the bones. This is achieved by ‘weighting’.\
    \ All 3D animation programs have slightly different ways of weighting a character.\
    \ The basic idea is that you select points on the surface of the skin and assign\
    \ them a differing degree of influence, depending on how each part of the skin\
    \ should move in relation to the\n\nsubconscious aspects of us. It’s the side\
    \ that’s working when we have a ‘feeling’ about something. It’s also the side\
    \ of the brain that thinks of the body as a whole.\n\nWhen you are animating,\
    \ you should be using the right-hand side of your brain. In order to do this,\
    \ it is best to work fast and rough. Don’t rub anything out. If the lines are\
    \ in the wrong place, re-draw them until the drawing looks right. Don’t be precious\
    \ about the drawing at this stage. Also, don’t think too much, just draw.\n\n\
    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_139_0.png)\n\nRemember to use a Co-Erase\
    \ pencil for the rough drawings. You can then mark a clean, correct line with\
    \ a graphite pencil. Always keep flipping, flacking and rolling.\n\nFor this way\
    \ of drawing to work, you need to have studied the movement beforehand. Get a\
    \ friend to act it out or watch yourself in a mirror. Study how the limbs move\
    \ and any twists to the body. Look at the balance and the weight.\n\n![](img/49afe0fca1d8f7ebd02f6839692b55f6_139_1.png)\n\
    \nWhile acting out the movement, use a stopwatch to work out the rough timing.\
    \ If you don’t have a stopwatch, it takes about a second to say each repetition\
    \ of the phrase ‘one little monkey ... two little monkeys ... three little monkeys’,\
    \ or about a third of a second to say each of the words. Use this to help with\
    \ the timing. Then use your X-sheet, which uses the left side of the brain.\n\n\
    ## Exercises\n\nTo understand weight and balance, we will animate a human character\
    \ lifting a heavy ball and pulling and pushing a heavy object. The three exercises\
    \ are set out step by step as follows:\n\n1. Working out the key drawings. (I’ve\
    \ included timing charts with each of the key positions to show where in-the-betweens\
    \ should be placed.)\n2. Completing the in-betweens.\n3. Animating each exercise\
    \ in the 3D programs covered in this book, using the drawn animation as a guide.\
    \ Instructions for doing this can be found on the website.\n\nYou can follow the\
    \ exercises I’ve done or use them as a rough guide and animate something that\
    \ you’ve acted out yourself.\n\n## The Lift Exercise in 2D\n\nIn this exercise\
    \ we will get our character to pick up a heavy ball. For the majority of the time,\
    \ the character should be balanced; that is, there should be an equal amount of\
    \ weight either side of the imaginary plumb line.\n\nBefore you put pencil to\
    \ paper, act out the movement. Find a reasonably heavy object (I would suggest\
    \ a bowling ball, but not everyone has one of these lying around) and have a go\
    \ at picking it up. Remember to lift the ball correctly. Keep your back as straight\
    \ as possible and bend your legs to bring yourself down to the ball. When you\
    \ pick up the object, use your legs to provide most of the momentum (the largest\
    \ muscle in the body is at the top of the leg) and keep your back straight.\n\n\
    By acting out this sequence, you should have an understanding of the movement,\
    \ which will begin to make the different stages clear in your head. I have provided\
    \ some thumbnail sketches but use these as a guide. Use your own research to guide\
    \ your animation for this sequence. This will influence the way you animate the\
    \ scene, bringing something of you to your animation.\n\nWhen you act the sequence,\
    \ exaggerate the weight of the object you are picking up. This will help the animation\
    \ to work better. Exaggerating the weight of the object makes the action more\
    \ clear to the audience.\n\nIt can also help to study mime artists. These performers\
    \ are trained to give the illusion of acting with props that don’t exist. In animation,\
    \ the props exist but they have no substance.\n\n## Working Out the Key Positions\n\
    \nThe first stage is to draw the key positions and then shoot them on a line tester.\
    \ There are 10 key positions for this sequence and the sequence is 100 frames\
    \ long. (Remember to have a go at ‘slugging out’ the X-sheet. That is, fill out\
    \ a description of all the key positions in the ‘Action’ column of the X-sheet.)\n\
    \nThe first key position is at frame 1. Begin with your character standing over\
    \ the ball. Make sure the ball isn’t too far away; otherwise, as the character\
    \ bends, he will end up having to reach too far forwards.\n\n![](img/49afe0fca1d8f7ebd02f6839692b55f6_140_0.png)\n\
    \n![](img/49afe0fca1d8f7ebd02f6839692b55f6_140_1.png)\n\nThe second key position\
    \ is at frame 9. Move your character up slightly. This is the anticipatory move\
    \ (more about anticipation in the next chapter).\n\n![](img/49afe0fca1d8f7ebd02f6839692b55f6_141_0.png)\n\
    \nThe third key position is at frame 19. This is where our character is grabbing\
    \ hold of the ball. The hands should be placed on the lower part of the ball.\n\
    \n![](img/49afe0fca1d8f7ebd02f6839692b55f6_141_1.png)\n\nThe fourth key position\
    \ is at frame 29. As the character starts to pick up the ball, his body leans\
    \ back and his bottom goes down. The weight of the ball causes the arms to become\
    \ straight and even stretch a bit.\n\n![](img/49afe0fca1d8f7ebd02f6839692b55f6_142_0.png)\n\
    \nThe fifth key position is at frame 39. As the weight of the body is moved backwards,\
    \ the arms straighten and the ball leaves the ground. The ball swings between\
    \ the character’s legs. Think of the arms being straightened by the weight of\
    \ the ball and swinging like a pendulum. As the ball travels between the legs,\
    \ it crosses the plumb line and causes the character to lean forwards.\n\n![](img/49afe0fca1d8f7ebd02f6839692b55f6_142_1.png)\n\
    \nThe eighth key position is at frame 61. As the character starts descending towards\
    \ the resting position, the ball keeps moving upwards. This is because the ball\
    \ contains momentum from being picked up and wants to keep going.\n\n![](img/49afe0fca1d8f7ebd02f6839692b55f6_144_0.png)\n\
    \nThe ninth key position is at frame 69. Our character has moved up slightly from\
    \ the last key position and the ball has fallen down against his legs.\n\n![](img/49afe0fca1d8f7ebd02f6839692b55f6_144_1.png)\n"
