    # ACKNOWLEDGEMENTS


    This book would not have been possible without the following people.


    Dee Honeybun for going through my unintelligible notes and turning them into something
    worth reading.


    Marie Hooper for commissioning the book in the first place and putting up with
    every missed deadline.


    Katy Spencer of Elsevier for commissioning the revised version of this book and
    putting up with even more missed deadlines.


    Claude Lester for being my ‘best man’ and persuading me that function curves are
    my friends.

    Kevin Rowe for help with Maya and acting.

    Birgitta Hosea for making time for me.


    Bob Godfrey for getting me into animation in the first place – I was bought his
    book *The Do-It-Yourself Film Animation Book* at the age of 10.


    Paul Stone and Mal Hartley for being my animated best mates.

    Central St Martins College of Art and Design for their support and the use of
    Maya.

    Cavendish College for their support and the use of 3D Studio Max.

    Kent Braun for the use of DigiCel FlipBook.


    Nick Manning of Autodesk, Inc. for permission to use images from Maya and 3D Studio
    Max. Screen shots and movies are used with the permission of Autodesk, Inc.


    Vasco Carou for the wonderful footage of his horse Inato (a thoroughbred Lusitano).


    All of the students I have ever taught animation to (nearly 1000!) – believe me,
    I’ve learnt as much from you as you have from me. A very big thank you to all
    the students who replied to my inane email questions.


    All the people I’ve known, argued with, watched, listened too, agreed with, ignored
    and generally experienced that have made me the animator I am today.


    My mum and dad who had faith in me getting a job that involved scribbling all
    day.


    But most of all Dee, Felix and Emily, who haven’t seen nearly as much of me as
    they should have done for the past few years but have loved me all the same.'
