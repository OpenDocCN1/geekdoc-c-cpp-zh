  - '[PAGE 245]


    # Walking Mechanics


    The four basic positions of a walk are the two stride positions and the two crossover
    positions.


    # The Stride Positions


    The two basic keys of a walk are at the extremes of each stride. To complete a
    walk cycle you need two strides. The exact arm and leg positions will be dependent
    on the emotions of your character and the external influences on them. However,
    one thing that is generally true of these stride keys is that the shoulder of
    the leading arm will be twisted forwards of the shoulder of the trailing arm,
    whereas the hip joint of the leading leg will be twisted forwards of the hip joint
    of the trailing leg. In other words, opposite shoulders and hips lead.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_245_0.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_245_1.png)


    A large amount of the twisting that happens in the body occurs at the base of
    the spine. This is the most flexible part of the spinal column.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_245_2.png)'
  - '[PAGE 246]


    The twisting of the shoulders is dealt with by the movement of the shoulder blades
    and the collarbone. The shoulder joint of the arm is pushed forwards or backwards
    in order to balance the top part of the body.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_246_0.png)


    The hips twist in the opposite direction to the shoulders, the leading hip being
    attached to the leg that is forwards.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_246_1.png)


    The angle of the hip at this stride position can help put over an idea of the
    mood of your character. If the hip is angled with the leading hip higher than
    the trailing hip, the backbone is thrown back and increases the curve in the small
    of the back. This gives a ‘positive’ feel to the way your character holds itself.
    Moods such as happy, determined and laid back will have a hip positioned like
    this at the stride position.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_246_2.png)'
