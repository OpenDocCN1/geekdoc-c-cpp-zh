    ## Eight Basic Efforts


    Laban movement theory divides movement into eight basic ‘efforts’. One way to
    give the scene you are animating more depth is to determine which of these efforts
    applies to the personality of your character and the situation that they are in
    within the scene. Then have a go at physically doing these efforts yourself. Subconsciously
    you will take on board the movement required to do these efforts and this will
    be reflected in your animation.


    It would be a good idea to practise each of these following movements, individually
    and in combination, just so you get a feel for them.


    ### Pressing


    This movement is direct, sustained and strong. It could be pushing or pulling
    something, or lifting or leading something. It suggests a character that is determined
    and indefatigable. This movement could be applied to a determined person who has
    a definite goal.


    ### Flicking


    This movement is flexible, sudden and light. It could be delicate movements of
    any part of the body, for example flicking dust off clothes or suddenly moving
    the head round to something that is heard. This perhaps suggests a more nervous
    person, twitching and reacting suddenly to things that happen to them.


    ### Wringing


    This movement is flexible, sustained and strong. It can be a movement such as
    wringing out wet clothes but could also be interpreted as gut-churning internal
    emotions within somebody who is frightened or embarrassed. This suggests somebody
    in inner turmoil or somebody who is worried about something.


    ### Dabbing


    This movement is direct, sudden and light, a bit like flicking but with a directness
    to it. An example is poking somebody on the shoulder to get his or her attention.
    This movement could be applied to a busybody-type person, bossing other people
    around.


    ### Slashing


    This movement is sudden, strong and flexible. Imagine slashing a sword in all
    directions or whirling the arms about to escape from something. This movement
    could be applied to an angry person who is annoyed by everything and anything.


    ### Gliding


    This movement is sustained, light and direct. One example could be a butler gliding
    silently into a room, very confident and aloof. The movement has a definite direction
    to it. This movement could


    A lot of puppet animation (and puppetry in general, for that matter) relies purely
    on body language. The faces of puppets can’t change expression to the same degree
    as drawn animation or 3D computer animation, but puppet animation and puppetry
    can be just as expressive (if not more so) as any other sort of performance. Watch
    puppet shows like the Muppets and animated films like *The Nightmare before Christmas*
    and see how the characters express themselves.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_302_0.png)


    This is not to say that facial expressions are not important. Humans have the
    most expressive faces of any animal and one of the main reasons for this is to
    facilitate communication with other human beings. I like to think of the face
    as a canvas that different expressions are painted onto (more about faces in Chapter
    10).


    One amazing thing about human beings is their ability to lie. This ability to
    lie is at its most refined in the face. We can be feeling miserable but still
    say that we are OK and have a smile on our face. As we move down the body this
    ability to lie weakens. To put it bluntly, our bodies are more honest. So, if
    we are feeling miserable, we can put on a happy face and may be able to hold our
    shoulders up when we want them to droop, but there will be a strange strain to
    the position — perhaps the shoulders are slightly too high and are stiff in their
    movement. Further down the body, the arms and hands may hang in a way that suggests
    that any movement is an effort, the small of the back may tend to bend outwards
    and, if the character walks, the feet may drag. Very corny, I know, but all these
    little things can add up to telling your audience what a character is feeling.


    ## Basic Body Postures


    From the moment we wake up to the moment we go to bed, we are spending our day
    reacting to things that we are presented with. Whether people, ideas, situations
    or problems, smells or sounds, everything we do is a reaction to something else.
    How we react to these situations is reflected in the body language we adopt. There
    are a huge number of signals that can be given off by the positions adopted by
    different parts of the body. These postures can complement or contradict each
    other, depending on the situation. In the example above of a character who is
    depressed and openly expressing this, although some of the signals given off by
    parts of the character’s body will say something else, the majority of the signals
    say ‘depressed’ and so the observer will still get an overall feeling of depression.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_302_1.png)


    ### Forwards Body Postures


    In these postures the character is leaning forwards and pointing toward something
    with a fist or a finger. They indicate that a character is actively accepting
    or rejecting a message given to them. They are involved, absorbed or passionate
    about what they feel.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_304_0.png)


    ### Backwards Body Postures


    In these postures the character may be leaning backwards, looking up at the ceiling
    or engaged in some other activity such as cleaning glasses, winding a watch or
    doodling on a pad. They indicate that a character is passively involved or ignoring
    a message given to them.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_304_1.png)


    - 2. When a character is bored, the body could be slumped or angled back with
    the head staring into space. The character may be fiddling with a pen, tapping
    their feet or fingers, doodling with a pen, or looking around for something interesting.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_309_0.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_309_1.png)


    - 3. When a character is sad or miserable, the body will be very slumped. The
    arms will hang lifeless. The head will be hung low. Everything will seem to be
    an effort and difficult to do.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_309_2.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_309_3.png)


    - 4. When a character is in denial, angle the body backwards and have the arms
    sweep across the body as if pushing something away. Have the hands form a fist
    or a pointing finger. Make the neck tense and hunch the shoulders.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_309_4.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_309_5.png)


    - 2. When a character is putting over a point forcefully, they will point with
    the hands and lean forwards as if they are putting themselves forwards.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_311_0.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_311_2.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_311_3.png)


    - 3. When a character is being defiant, they will pull themselves up and cross
    their arms. The head will be held up high and angled back.


    - 4. When a character is having an argument, they will lean forwards, wave their
    fists, strike things, hunch their shoulders and gesticulate wildly.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_311_4.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_311_5.png)


    - 5. When a character is listening to something that they disagree with they will
    partly cover their face with one hand, which could have a single upturned finger.
    The other arm will cross over the body. If seated, the legs will be crossed.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_312_0.png)


    ## Palm, Hand, Arm and Leg Gestures


    The hands and arms play a crucial part in our communication with other people.
    The postures adopted by the legs reinforce these gestures.


    ### Palm Gestures


    The palm can be used to suggest openness and honesty or the lack thereof. Honesty
    and submission are suggested by a character gesticulating with open palms facing
    upwards or away from the character’s body and towards the person to whom they
    are gesticulating. You will see this sort of palm signal when people are shrugging
    and when they are happy, eager, interested or contemplating something.


    Dishonesty and dominance are suggested by the palms being open but facing downwards
    or towards the character’s body. You will see this when people are defiant, bored,
    sad or annoyed. When you see the open body language associated with a responsive
    body posture but the palms are facing downwards or towards the character, something
    doesn’t seem quite right and you tend not to believe the character. This could
    suggest that the character is lying.


    The closing of the palm suggests anger and aggression or exaggerated dominance.
    You will see this form of display if somebody is aggressively pointing while talking
    or chopping the hand across the body. Examples of this type of palm signal will
    be seen when a character is angry, trying to put a point over, disagreeing with
    something or being argumentative.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_312_1.png)

