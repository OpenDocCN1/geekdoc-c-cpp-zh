  - '[PAGE 71]


    To create a ball go to the Command Panel and select the Create tab. In the dropdown
    menu make sure that Standard Primitives is displayed in the Object Type section
    select ‘Sphere’. Go down to the Keyboard Entry section and type ‘10.0’ in the
    box next to Radius. Then click Create and a sphere will appear in the center of
    the viewport.


    The ball should be solid rather than wireframe, but, if it’s wireframe, click
    on Wireframe in the top left corner of the viewport and select Smooth + Highlight
    from the menu that comes up.


    # How to Animate Your Ball


    Take out your drawn animation of a ball dropping (or have a look at the illustration
    of the ball dropping earlier in this chapter).


    Click the Time Configuration button at the bottom right of the screen. Up will
    come the Time Configuration window. In the Frame Rate section select Custom and
    in FPS type 25, then select ‘PAL’ (unless you are in a country that uses NTSC,
    in which case choose ‘NTSC (30 fps)’). Click OK to close the Time Configuration
    window.


    Click the middle mouse button and move the mouse to pan the view so that the thick
    horizontal line on the grid is near to the bottom of the viewport.


    Make sure the Time Slider is at frame 1. Move the ball to the top of the view
    panel by clicking the Select and Move button and then clicking and dragging the
    green arrow that emerges from the top of the ball. This will move the ball in
    the Y axis (up and down). When the ball is in the correct position, select Create
    a Key. Select the Set Keys button (the surround of the viewport goes red) then
    click the Set Button (the button with the key on it).You could use Auto Key. To
    do this, select the Auto Key button, then move the ball to its first position.
    It will set a key for you automatically.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_71_0.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_71_1.png)'
  - '[PAGE 72]


    You have now created your first key in 3D Studio Max! Alternatively, you could
    select the Auto Key button. Then, whenever you move the ball, a key is automatically
    set.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_72_0.png)


    Move the Time Slider to frame 14 and then drag the ball down so that it is sitting
    on the thick horizontal line running through the grid. Set your second key (or,
    if Auto Key is selected, a key will be set automatically).


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_72_1.png)'
  - '[PAGE 73]


    Follow this procedure for all remaining keys (at frames 17, 23, 29, 33, 37 and
    41).


    Play back your animation (or take a look at your `drop_keys_3D.avi`, animations001,
    Chapter 1 on the website). It bounces in a rather strange way. This is because
    the ball is accelerating out of and then decelerating into each of the key positions.
    It should decelerate into and accelerate out of the key positions at the apex
    of each bounce (17, 29 and 37) but should keep accelerating into the key positions
    at the ground and then accelerate out of these key positions (9, 23, 33 and 41).


    # *Adjusting the In-Betweens*


    Open up the Track View by going to the main menu and selecting **Graph Editors
    > Track View – Curve Editor**. In the hierarchy tree area of the Track View select
    **Objects**, then **Sphere 01**, then **Transform**, then **Position** and also
    **Z Position**. This will all be selected for you if the ball is selected in the
    viewport. A blue curve will be illustrated in the **Animation Curve** area of
    the **Curve Editor**.


    Each of the points on the curve is one of the key frames that you set. On the
    graph, horizontally they will correspond to the frame number they were set at,
    and vertically to the value in Y (up and down). These values can be adjusted using
    various tools (more later). The highest key points on the curves are the highest
    parts, in the animation, of each of the bounces. The lowest key points on the
    curves are the parts, in the animation, where the ball touches the ground. The
    program has linked these key points together in a way that makes the curve gracefully
    swoop in and out of each key point.


    These curves are referred to as ‘spline’ curves. (You can also set the curves
    to ‘linear’, ‘stepped’ ‘flat’ and others. Right click on one of the key points
    on the curve and in the **Position** window. Play back your animation and see
    what effect ‘linear’, ‘stepped’ and ‘flat’ curve have on the ball’s movement and
    then return the curves to ‘spline’ to continue with the exercise.)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_73_0.png)'
  - '[PAGE 74]


    The effect of spline curves is to accelerate the movement out of one particular
    key point and decelerate into the next key point and so on through the piece of
    animation. Sometimes this works fine, as with the apex of each bounce of the ball,
    and sometimes it doesn''t, as with the parts of the animation where the ball hits
    the ground. At these points we need to ''break'' the curves.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_74_0.png)


    You can adjust each of these key points by selecting them (right click on a key
    point) and in the Position window selecting the Handle Spline button for the In
    Curve. When selected, the key points will grow handles and left mouse clicking
    and dragging on one of the handles will affect the shape of the curve and thus
    affect your animation.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_74_1.png)'
  - '[PAGE 75]


    The handles work in unison using this method of adjustment. You can also make
    them work independently of each other by “breaking” the key point. To do this,
    right click a key point to bring up the Position window and select the Advanced
    button. In between the In and Out sections is a padlock icon. Click on this.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_75_0.png)


    Click one of the handles and drag to adjust it. Drag it so that you get a nice
    sharp curve arising into the key point. Do the same for the second handle.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_75_1.png)'
