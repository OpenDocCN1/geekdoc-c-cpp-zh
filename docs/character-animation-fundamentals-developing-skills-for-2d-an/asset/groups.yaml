  - '[PAGE 139]


    subconscious aspects of us. It’s the side that’s working when we have a ‘feeling’
    about something. It’s also the side of the brain that thinks of the body as a
    whole.


    When you are animating, you should be using the right-hand side of your brain.
    In order to do this, it is best to work fast and rough. Don’t rub anything out.
    If the lines are in the wrong place, re-draw them until the drawing looks right.
    Don’t be precious about the drawing at this stage. Also, don’t think too much,
    just draw.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_139_0.png)


    Remember to use a Co-Erase pencil for the rough drawings. You can then mark a
    clean, correct line with a graphite pencil. Always keep flipping, flacking and
    rolling.


    For this way of drawing to work, you need to have studied the movement beforehand.
    Get a friend to act it out or watch yourself in a mirror. Study how the limbs
    move and any twists to the body. Look at the balance and the weight.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_139_1.png)


    While acting out the movement, use a stopwatch to work out the rough timing. If
    you don’t have a stopwatch, it takes about a second to say each repetition of
    the phrase ‘one little monkey ... two little monkeys ... three little monkeys’,
    or about a third of a second to say each of the words. Use this to help with the
    timing. Then use your X-sheet, which uses the left side of the brain.


    # Exercises


    To understand weight and balance, we will animate a human character lifting a
    heavy ball and pulling and pushing a heavy object. The three exercises are set
    out step by step as follows:


    +   1. Working out the key drawings. (I’ve included timing charts with each of
    the key positions to show where in-the-betweens should be placed.)

    +   2. Completing the in-betweens.

    +   3. Animating each exercise in the 3D programs covered in this book, using
    the drawn animation as a guide. Instructions for doing this can be found on the
    website.


    You can follow the exercises I’ve done or use them as a rough guide and animate
    something that you’ve acted out yourself.'
  - '[PAGE 140]


    # The Lift Exercise in 2D


    In this exercise we will get our character to pick up a heavy ball. For the majority
    of the time, the character should be balanced; that is, there should be an equal
    amount of weight either side of the imaginary plumb line.


    Before you put pencil to paper, act out the movement. Find a reasonably heavy
    object (I would suggest a bowling ball, but not everyone has one of these lying
    around) and have a go at picking it up. Remember to lift the ball correctly. Keep
    your back as straight as possible and bend your legs to bring yourself down to
    the ball. When you pick up the object, use your legs to provide most of the momentum
    (the largest muscle in the body is at the top of the leg) and keep your back straight.


    By acting out this sequence, you should have an understanding of the movement,
    which will begin to make the different stages clear in your head. I have provided
    some thumbnail sketches but use these as a guide. Use your own research to guide
    your animation for this sequence. This will influence the way you animate the
    scene, bringing something of you to your animation.


    When you act the sequence, exaggerate the weight of the object you are picking
    up. This will help the animation to work better. Exaggerating the weight of the
    object makes the action more clear to the audience.


    It can also help to study mime artists. These performers are trained to give the
    illusion of acting with props that don’t exist. In animation, the props exist
    but they have no substance.


    # Working Out the Key Positions


    The first stage is to draw the key positions and then shoot them on a line tester.
    There are 10 key positions for this sequence and the sequence is 100 frames long.
    (Remember to have a go at ‘slugging out’ the X-sheet. That is, fill out a description
    of all the key positions in the ‘Action’ column of the X-sheet.)


    The first key position is at frame 1. Begin with your character standing over
    the ball. Make sure the ball isn’t too far away; otherwise, as the character bends,
    he will end up having to reach too far forwards.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_140_0.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_140_1.png)'
  - '[PAGE 141]


    The second key position is at frame 9. Move your character up slightly. This is
    the anticipatory move (more about anticipation in the next chapter).


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_141_0.png)


    The third key position is at frame 19. This is where our character is grabbing
    hold of the ball. The hands should be placed on the lower part of the ball.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_141_1.png)'
  - '[PAGE 142]


    The fourth key position is at frame 29. As the character starts to pick up the
    ball, his body leans back and his bottom goes down. The weight of the ball causes
    the arms to become straight and even stretch a bit.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_142_0.png)


    The fifth key position is at frame 39. As the weight of the body is moved backwards,
    the arms straighten and the ball leaves the ground. The ball swings between the
    character’s legs. Think of the arms being straightened by the weight of the ball
    and swinging like a pendulum. As the ball travels between the legs, it crosses
    the plumb line and causes the character to lean forwards.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_142_1.png)'
  - '[PAGE 143]


    <!-- no content -->'
  - '[PAGE 144]


    The eighth key position is at frame 61. As the character starts descending towards
    the resting position, the ball keeps moving upwards. This is because the ball
    contains momentum from being picked up and wants to keep going.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_144_0.png)


    The ninth key position is at frame 69. Our character has moved up slightly from
    the last key position and the ball has fallen down against his legs.


