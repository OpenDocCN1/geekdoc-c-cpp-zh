    As the character leans in one direction, the plumb line will move with the center
    of gravity. If it swings far enough to reach a leg, other parts of the body will
    need to be moved to maintain balance and to stop the character from falling over.
    For example, if a person leans forwards, to maintain their balance they need to
    stretch their arms out behind them. If they lean further, they will need to stretch
    one leg out behind them.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_134_0.png)


