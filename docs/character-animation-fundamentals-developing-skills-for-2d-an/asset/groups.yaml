    \ professional animation paper.\n\n### Peg Bars\n\nProfessional peg bars, used\
    \ with professional animation paper, are made up of a strip of steel or plastic\
    \ with three pins. They are made to an industry standard. They are used to register\
    \ each piece of animation paper against the next.\n\nIt is possible to buy two-pin\
    \ peg bars – these are often called ‘junior peg bars’.\n\n![](img/49afe0fca1d8f7ebd02f6839692b55f6_24_1.png)\n\
    \nIt is equally possible to make your own, using a strip of wood with two pieces\
    \ of dowel that correspond to the holes in your paper, or even to tape two 5mm\
    \ counter-sunk bolts onto your light box. These can then be used with ring-binder\
    \ punched A4 paper.\n\n![](img/49afe0fca1d8f7ebd02f6839692b55f6_25_0.png)\n\n\
    As with the paper, bear in mind that, if you want to use your animation professionally,\
    \ it is advisable to buy a three-pin peg bar.\n\n### Light Boxes\n\nIn its most\
    \ basic form, a light box is a flat sheet of opal Perspex over a light. Professional\
    \ light boxes use a rotating disk. They should also have the ability to change\
    \ the angle of the drawing surface. This makes drawing easier on both the wrist\
    \ and the back.\n\n![](img/49afe0fca1d8f7ebd02f6839692b55f6_25_1.png)\n\nSimple\
    \ light boxes are relatively straightforward to make. You could use a wooden storage\
    \ box with the top part cut off at an angle, mount a neon bulb inside and then\
    \ fasten a piece of 6mm opal Perspex to the top with screws.\n\n![](img/49afe0fca1d8f7ebd02f6839692b55f6_25_2.png)\n\
