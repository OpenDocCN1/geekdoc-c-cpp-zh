    Touching the nose or cheeks gives the impression of somebody who is being economical
    with the truth.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_374_5.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_374_6.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_374_7.png)


    ## Stress


    When somebody is stressed, nervous or frightened, they may stick their fingers
    in their mouth for comfort. Biting the fingernails is a more complicated version
    of this.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_376_0.png)


    Slapping the front of the forehead, scratching the top of the head or rubbing
    the back of the neck are also signs of stress or frustration.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_376_1.png)


    ## Extreme Close-Ups


    In many live-action films there are often extreme close-ups of the main actors,
    where only the eyes and nose are on screen. These sorts of close-ups tend not
    to work so well in animation. With drawn animation it’s difficult to decide how
    thick the line should be. Drawing the lines can be problematic because the audience
    very easily sees any inaccuracy. It is also easy for the lines to wobble and ooze.
    This makes an audience stop believing in your characters. With 3D computer animation,
    line wobble is less of a problem, but close-ups of polygons, skinning or texture
    mapping already have a lot going on and your audience won’t register the change.
    This is called a moving hold. Moving holds aren’t limited to the face. The hands
    could stay in the same position (e.g. when the character is pointing) while the
    rest of the body is doing something else.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_381_0.png)


    Another way to make sure an audience sees an expression (e.g. when a character
    is falling out of screen and is looking at the audience) is to move the head slightly
    as the body moves rapidly. This gives an impression of the head being left behind
    while the neck stretches. When the audience has had enough time to see the face
    (8 to 12 frames), it then zooms out of screen after its body.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_381_1.png)


    What happens when your character is constantly moving in a scene and there isn’t
    time to adopt any poses? When you have to cram many facial expressions into a
    small amount of time, you will need to ‘snap’ the facial expressions from one
    to the other as the character moves. You need to ensure the audience has enough
    time to register each expression during the movement. In simple terms, this uses
    several moving holds in a row. If you make the character screw their face up from
    one expression and then pop it out into another, this can work well.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_382_0.png)


    Anticipation and overshoot can be used within the face to get from one facial
    expression to another. For example, if a character is happy and they see something
    that makes them sad, their happy expression could first become more happy (bigger
    smile, narrower eyes, more crow’s feet) and then move into a frown. Make the frown
    slightly more exaggerated to start with and then tone it down a bit during the
    pose.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_382_1.png)


    He then recoils back in shock.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_384_0.png)


    He then turns back towards the camera with an angry look on his face, fuming.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_384_1.png)


    Take a look at ‘acting072_2D.avi’ in animation010, Chapter 10 on the website.


    It may help you to think about what your character has seen and why they have
    reacted in this way. In the example above, the man has seen an ice cream van and
    smiled at the thought of getting an ice cream. He then notices the extortionate
    price of the ice cream and recoils back in horror. He finally looks at us angrily
    because he can’t afford one.


    Following are some other suggestions for close-up exercises:


    - 1. A character is sat at center screen holding a telephone, listening to the
    receiver (make it a mobile phone—no wires to worry about). Depending on what the
    character hears, his or her facial expression changes from one look to another.
    Do about four facial expressions and use expressive body language to augment these.


    - 2. A character is sat at a table waiting to be served a meal. It is taking a
    long time to turn up, so he is annoyed. He looks to one side to see his plate
    placed in front of him. He looks down at the plate with a happy expression and
    licks his lips. He forks up a portion of food and pops it into his mouth with
    a look of ecstasy on his face and starts chewing. His face turns to one of disgust
    as he realises that the food tastes awful. He spits the food out and looks angrily
    in the direction that the food came from.


    - 3. A character tries to attract somebody’s attention off screen (make it to
    one side of the screen or the other—it’s much more difficult to do this towards
    the camera). They may be waving and smiling or looking angry and waving their
    fist (anything you want). The character is ignored by the person off screen and
    reacts as a result of being ignored. They may get angry (or angrier) or become
    sad or nonchalant (again, it’s up to you).

