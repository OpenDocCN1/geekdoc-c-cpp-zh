    button (in 3ds Studio Max 5 press the **Auto Key** button) and click the **Motion**
    tab on the Command Panel.


    Move the Time Slider to frame zero and select Bone01 (the bone at the stick).
    In the Motion area of the Command Panel, go to the PRS Parameters section, click
