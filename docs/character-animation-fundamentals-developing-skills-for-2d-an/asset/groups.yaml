  - '[PAGE 64]


    To create a ball, go to the main menu and select **Create > NURBS Primitives >
    Sphere** (alternatively click the **Sphere** icon on the shelf above the view
    panel). Then click and drag in the view panel. This will create a ball.


    You can rename your ball by going to the top of the **Channel Box** and under
    **SHAPES** clicking on ‘NURBSSphere1’ (the current name of your ball), which will
    turn blue. Type in a new name; let’s be imaginative and call it ‘ball’. Press
    Enter. The position of the ball can be controlled by typing in the upper part
    of the Channel Box. Next to **Translate X** and **Translate Y**, type ‘0’. This
    will bring the ball to the center of the viewport.


    The size and shape of the ball can be altered by going to the **Inputs** section
    of the Channel Box and clicking on ‘MakeNurbSphere’. This will open a series of
    input boxes: **Radius** (the radius of the sphere) – type ‘1’ to give it a radius
    of 1 unit; **Start Sweep** and **End Sweep** (by adjusting the figures in these
    boxes you can end up with a sphere that looks a bit like an orange with a few
    segments missing); **Degree** (this will change the ball from the low-resolution
    look to the high-resolution look); **Sections** (this controls the number of lines
    running up and down the sphere); **Spans** (this controls the number of lines
    running from side to side across the sphere); and **Height Ratio** (I haven’t
    got a clue what this does so I keep it at 2).


    Have a play at changing the inputs on the ball. If you mess up, delete it and
    create another. When you have adjusted the ball to something that you like, it’s
    always a good idea to delete its history. Do this by selecting the ball and from
    the main menu selecting **Edit > Delete by Type > History**. This sets the ball
    to the new shape.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_64_0.png)


    # How to Animate Your Ball


    Take out your drawn animation of a ball dropping (or have a look at the ball dropping
    illustration earlier in this chapter). Click the **Animation Preferences** button
    at the bottom right of the screen. Up will come the **Preferences** window. In
    the **Categories** box select **Settings** and in the box next to **Time** select
    ‘PAL (25 fps)’ (unless you are in a country that uses NTSC, in which case choose
    ‘NTSC (30 fps)’). Alternatively, keep it at 24 fps (film speed); this is easier
    to work with mathematically (it is more easily divisible than 25). Click **Save**
    to close the **Preferences** window.'
