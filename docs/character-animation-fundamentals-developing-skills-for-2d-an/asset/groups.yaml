    Play your key animation back. How does it look? It looks like the animation in
    ‘bowlingball_keys.avi’ (Chapter 2 on the website), you’re doing OK. If not, adjust
    the number of frames that each of the key drawings is played for until you are
    happy with it. Show it to other people: friends, loved ones or complete strangers.
    If they identify it as a bowling ball falling off a shed, you know you are on
    the right track. Above is an illustration of the bowling ball with the correct
    drawing numbers (the frame numbers that each of these balls should be captured
    on).


    Now you have to do the ‘in-between’ drawings. We will follow the same procedure
    as in Chapter 1 to change the preliminary numbering sequence for the key drawings
    to the correct sequence that includes the in-betweens. Note down the numbers for
    the key drawings on a paper X-sheet in column 6. In column 1, write the animation
    drawing numbers in every other frame. These will be the correct animation drawing
    numbers (we are going to be numbering our drawings by the frame). Transfer the
    correct animation drawing numbers across to the key drawings. So, key drawing
    1 will now be animation drawing 1 (corresponding with frame 1); key drawing 2
    will become animation drawing 17 (corresponding with frame 17); key 3 will become
    19; key 4 will become 21; and so on. Once you have re-numbered your key drawings
    with the correct animation drawing numbers, rub out the key drawing numbers on
    the paper X-sheet. See the illustration right.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_102_1.png)


    Once you''ve completed your in-between drawings, capture them with your line tester,
    as follows. When setting up DigiCel, specify 2 in # of Levels.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_104_0.png)


    Click the Capture button and the Video Capture box comes up. Capture the background.
    Change the Level box to 0 and click Capture.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_104_1.png)


    To play the drawings on top of the background, change the Level box to 1 and change
    the Frame box to 1. Drawings 1–19 will be captured two frames each. Set the Hold
    box to 2.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_104_2.png)


    Drawings 21–28 will be captured for one frame each. Set the Hold box to 1.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_104_3.png)


    Drawings 29–57 will be captured for two frames each. Set the **Hold** box to 2.


    When you''ve finished, click OK. Your X-sheet should look something like the illustration
    below.


    When you play the drawings back, your animation should look like ‘bowlingball_2D.avi’
    (animations002, Chapter 2 on the website).


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_105_0.png)


    ## Animating a 2D Soccer Ball


    Below is the rough trajectory for the soccer ball, showing the key positions.
    A soccer ball will undergo a certain amount of squash and stretch. As the ball
    hits the ground, it squashes. As it flies through the air, it stretches at the
    fastest point of each arc.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_106_0.png)


    Draw the 12 key positions of the soccer ball and capture them. Number each key
    by the drawing: 1, 2, 3, 4 etc. The sequence will be 120 frames long (in DigiCel,
    use the following settings: # of Frames: 120, Frame Rate: 25, and # of Levels:
    2). Play the keys back and adjust the frames until you are happy with the timing
    of the sequence (hold down Alt while clicking and dragging down). Use the illustration
    below for reference. Check out ‘soccerball_keys.avi’, animations002, Chapter 2
    on the website.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_106_1.png)


    Work out the timing charts for each key drawing. Use the illustration below for
    reference. Complete the in-betweens. All the drawings in this piece of animation
    are on twos.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_108_0.png)


    You may notice that on the timing chart between drawings 29 and 31 there is an
    X. This means that the ball halfway between frames 27 and 33 has no drawing. The
    two in-between drawings are positioned half way between the key drawings and the
    mythical X. So, drawing 29 is positioned a quarter of the distance nearer to drawing
    27 and three quarters of the distance away from drawing 33. Drawing 31 is positioned
    a quarter nearer to drawing 33 and three quarters further away from drawing 29.
    This will give the appearance of the ball moving faster in the middle of the movement.


    When you have drawn all the in-betweens, capture them and play them back. If your
    animation looks like ‘soccerball_2D.avi’, animations002, Chapter 2 on the website,
    well done. If not, try to find where you’ve gone wrong. For example, if the ball
    spends too much time in the air, take a drawing out or hold one of the drawings
    for a single frame rather than a double. Don’t be afraid to experiment.


    ## Animating a 2D Beach Ball


    The beach ball sequence will be 120 frames long (in DigiCel, use the following
    settings: # of Frames: 120, Frame Rate: 25 and # of Levels: 2).


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_109_0.png)


    Follow the sequence for the bowling ball and soccer ball. This time, experiment
    with the timing. A beach ball will travel more slowly through the air than a football.
    It might roll slightly as it bounces on the ground and not bounce as high. It
    will crumple at the bottom when it hits the ground rather than squash like a soccer
    ball. Have a look at ‘beachball_keys.avi’ and ‘beachball_2D.avi’, animations002,
    Chapter 2 on the website. As the beach ball bounces, there will be an in-between
    drawing just before it touches the ground. This slows the beach ball down. The
    reason we do this is to emphasize the lightness of the beach ball, suggesting
    that the air above the ground gives a small amount of resistance to such a light
    ball.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_109_1.png)


    ## Animating a 2D Ping-Pong Ball


    A Ping-Pong ball will bounce quite high with fairly short distances between the
    apex of each bounce. It will not squash or stretch at all. The upwards bounce
    is quite quick. When it reaches the apex it slows before almost floating down
    to hit the ground. Adjust your in-betweens accordingly. Below is an illustration
    of the trajectory of a ping-pong ball. Once it hits the ground it bounces very
    quickly. To show this, the drawings between 19 and 56 will be on singles.


    Follow the sequence for the bowling ball and the soccer ball. The ping-pong ball
    sequence will be 100 frames long. In DigiCel, use the following settings: # of
    Frames: 100, Frame Rate: 25 and # of Levels: 2. (Have a look at ‘ping-pongball_keys.avi’
    and ‘ping-pongball_2D.avi’, animations002, Chapter 2 on the website.)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_110_0.png)


    ## Animating a 2D Water-Filled Balloon


    This is probably the most difficult sequence to animate but it is also the most
    fun to watch when it’s working well.


    Work out the basic trajectory. Think of the water flowing around the inside of
    the balloon as it moves, pushing the balloon forwards.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_110_1.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_110_2.png)


    The sequence will be 75 frames long. In DigiCel, use the following settings: #
    of Frames: 75, Frame Rate: 25 and # of Levels: 2.


    Start with the basic key positions of the balloon rolling down the shed roof.
    The in-between drawings of this sequence should be on singles. The illustration
    (right) shows the in-betweens from key 1 to key 5. The rest of the in-betweens
    of the balloon rolling down the roof will follow this pattern.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_111_0.png)


    Try to make sure the balloon doesn’t slide down the roof. Most forwards movement
    occurs at the point at which the balloon is most stretched. When stationary, the
    water rotating inside the balloon stretches the rubber slightly backwards, upwards,
    then ahead. As the water inside the balloon moves forwards it stretches the balloon
    and pulls it onward. Have a look at ‘waterballoon_keys.avi’, animations002, Chapter
    2 on the website.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_111_1.png)


    The water-filled balloon will fall quickly when it leaves the edge of the roof
    because it is very heavy. When it lands it will squash slightly more on one side
    than the other because of the slight angle at which it leaves the roof.


    When you have animated the full sequence capture the drawings and the background
    and see how it looks. Take a look at ‘waterballoon_2D.avi’, animations002, Chapter
    2 on the website.


    When you’re happy with the five different sequences and it is easy to identify
    what sort of balls they are, you are ready to do them all again in 3D!


    ## 3D Exercises


    The 3D exercises for this chapter can be found on the book’s website, www.charactermation.com.


    To animate the five different balls in 3D, we will follow a similar approach to
    that for the 2D exercises. First we need to make a background. This consists of
    a cube that has been given a sloping top. It is built to the same proportions
    as the shed in our 2D background (5 units × 5 units × 4 units).

