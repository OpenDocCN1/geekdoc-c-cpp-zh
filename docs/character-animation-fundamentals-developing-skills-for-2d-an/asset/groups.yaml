    Using this method, you can place a field of any size in any area.


    All exercises in this book are at 12-field center (or, if you are using A4 photocopy
    paper, 10 field at 2 south of 12-field center).


    # ### Line Testers


    A line tester is a device that captures your drawings and plays them back. It
    is a quick and easy way to see whether the roughly drawn sequence works. There
    are a number of ways to set up a line tester. You could use a film camera, a video
    recorder that can record single frames or a line testing software program and
    a computer. The movie examples on the website were produced using a program called
    DigiCel FlipBook, which can be downloaded from www.DigiCelinc.com (you can start
    with the free watermarked version but I would recommend upgrading to the basic
    version for a small fee). Alternatives are available. I would suggest looking
    for a program that contains an X-sheet, as this is best for working out timing.


    The simplest and cheapest way of setting up a line tester is to use a webcam together
    with a computer and the line testing software. Set the camera to point down onto
    the table. The camera could be mounted on a tripod or even stuck to a steel rule
    that is then attached to the top of your computer. Stick your peg bar to the table,
    put a piece of your animation paper onto it and align it under the camera. The
    peg bar is important for the accurate placing of drawings. It is also possible
    to scan drawings into the computer using a flat bed scanner, but it takes an awful
    lot longer than using a camera.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_32_0.png)


    Now would be a good time to load a copy of DigiCel FlipBook onto your PC and familiarise
    yourself with its operation.


