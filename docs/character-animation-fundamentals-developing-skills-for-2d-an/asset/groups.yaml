  mdcn: "\n\n特克斯·阿弗里（Tex Avery）和查克·琼斯（Chuck Jones）：我小时候最喜欢的卡通人物是“疯狂松鼠”（Screwy Squirrel）和“德鲁比”（Droopy）（都是特克斯·阿弗里创作的），紧随其后的是达菲鸭（Daffy\
    \ Duck）和兔八哥（Bugs Bunny）（通常是查克·琼斯电影中这些角色的形象）。\n\n令我心存敬畏的动画师名单几乎无穷无尽：布拉德·伯德（Brad\
    \ Bird）、约翰·拉塞特（John Lasseter）、宫崎骏（Hayao Miyazaki）、尼克·帕克（Nick Park）、乔安娜·奎因（Joanna\
    \ Quinn）、扬·斯凡克梅耶（Jan Švankmajer）——我可以一直列下去。\n\n希望这本书能给你带来启发。\n\n> 动画师是幸运的：他们不必受限于戏剧舞台的局限，也不必面对真人电影外景拍摄的诸多风险！他们唯一的限制就是自己的想象力和支票簿的厚度。有了整个宇宙可供支配，再加上宇宙中所有的色彩和声音，动画可能是一个令人望而生畏的前景！难怪有些人转而从事园艺或DIY。史蒂夫·罗伯茨（Steve\
    \ Roberts）（我第一次见到他是在法纳姆的动画课程上——他当时正在把《白雪公主和七个小矮人》重制成一部讽刺作品）并不容易被吓倒。他撰写并绘制了一本了不起的书，真正让动画变得易于理解。通过简单的插图，他带领读者经历他们在迈向可信动画的过程中可能遇到的每一种情况。这本书的关键在于*简洁*。保持简单！分开红海对塞西尔·B·德米尔（Cecil\
    \ B. DeMille）来说是完美之举。\n>\n> **鲍勃·戈弗雷（Bob Godfrey MBE）**\n\n## 动画入门\n\n### 工作实践\n\
    \n### 章节摘要\n\n- 动画的工作原理\n- 每秒帧数\n- 你的工作室需要什么\n- 让我们开始动画吧\n- 翻动、弹拨和滚动\n- 如何使用线条测试器辅助你的动画\n\
    - 练习\n- 如何将你的二维动画与三维动画联系起来\n- 关于 Maya 你需要知道的 13 件事\n- 关于 3D Studio Max 你需要知道的\
    \ 13 件事\n- 3D 中“球体下落”练习概述\n- 如何在 Maya 中制作基础弹跳球动画\n- 如何在 3D Studio Max 中制作基础弹跳球动画\n\
    - 绘画\n- 动画的 12 项原则\n\n在本章中，我将带你了解两件事：建立一个基础动画工作室所需的设备，以及一些简单的动画。我们将研究摄影表（X-sheets）及其如何帮助计时、翻动、弹拨和滚动；如何使用线条测试器；以及如何将你从手绘练习中学到的经验应用到\
    \ 3D 计算机动画程序中。到本章结束时，你将学会如何组织自己，以及如何规划和执行一段动画。\n\n我毫不抱歉地把你带回到最基础的内容。你可能已经知道其中很多，但请耐心听我说——重温这些知识并巩固动画背后的基本原理是值得的。\n\
    \n### 动画的工作原理\n\n*基础知识*\n\n二维手绘动画由一系列连续拍摄并回放的图画组成，从而产生运动的错觉。这种动画可以通过多种方式回放：\n\n\
    - 以“翻页书”（flipbook）的形式（基本上是一叠按顺序装订的图画，用拇指翻动）。\n- 用电影摄影机逐帧拍摄在胶片上，再用电影放映机回放。\n- 用摄像机拍摄，再用视频播放器回放。\n\
    - 用连接到计算机的摄像机拍摄，并在同一台计算机上使用动画程序回放。\n- 扫描到计算机中并回放。\n\n### 每秒帧数\n\n拍摄在胶片上并投影的动画以每秒\
    \ 24 帧的速度播放。欧洲、非洲、中东和澳大利亚的电视动画以每秒 25 帧的速度播放。这些国家使用一种名为 PAL 的电视系统，该系统以每秒 50 场（帧）的速度播放。以每秒\
    \ 25 帧播放的动画与 PAL 兼容，但如果我们以每秒 24 帧的速度在电视上播放一部动画电影，我们会看到一条黑条在屏幕上滚动。美洲、西印度群岛和环太平洋地区国家使用\
    \ NTSC 系统，该系统的运行速度为每秒 60 场。这意味着对于该系统，你应该以每秒 30 帧的速度制作动画（60 可以被 30 整除）。很多时候会使用某种数字转换器将一种胶片速度转换为另一种视频速度，从而使每秒\
    \ 24 帧的电影能够在每秒 60 场（NTSC）的电视上播放。如果你在动画电影的视频中逐帧暂停，你会发现有些帧会模糊到另一帧中。这就是克服两种系统不兼容性的方法。（逐帧暂停观看动画电影是学习动画的一种非常好的方法。）制作动画时最重要的事情是确定动画将以什么速度回放。本书中教授的所有动画都将以每秒\
    \ 25 帧的速度回放。\n\n### 你的工作室需要什么\n\n为了完成本书中的手绘练习，你需要以下物品（所有这些都可以从本书末尾列出的专业动画设备供应商处获得）：\n\
    \n- 动画纸\n- 定位条（peg bar）\n- 透写台（light box）\n- 摄影表（X-sheets）\n- 线条测试器\n- 铅笔\n\n\
    ### 动画纸\n\n制作动画时，你经常会发现自己在使用四层或更多层的纸张。为了能看到所有图画，需要一定程度的半透明度。专业动画纸正是为此而制造的。\n\n\
    它还有不同的尺寸，这些尺寸被称为规格（field sizes）。12 规格和 15 规格是最常用的。15 规格宽 15 英寸，12 规格宽 12 英寸。（我将在本章后面提到规格指南（field\
    \ guides）时详细说明，它们是测量规格尺寸的网格。）\n\n大多数专业动画纸都带有三个打好的孔。也可以购买没有孔的纸张（价格更便宜，但你需要一台非常昂贵的专业动画打孔机）。与定位条配合使用时，这些孔可以确保每张纸与下一张精确对齐。这一点很重要，因为拍摄这个序列时，哪怕最细微的移动都会显示出来。\n\
    \n![](img/49afe0fca1d8f7ebd02f6839692b55f6_24_0.png)\n\n使用带有标准活页夹孔的 A4 纸和带有两个与孔匹配的销钉的定位条也是可行的。这样一来，成本会比专业动画纸便宜得多。\n\
    \n### 定位条（Peg Bars）\n\n与专业动画纸配合使用的专业定位条由一条带有三个销钉的钢条或塑料条制成。它们按照行业标准制造，用于将每张动画纸与下一张对齐。\n\
    \n也可以购买两销钉的定位条 —— 这类通常被称为“初级定位条”。\n\n![](img/49afe0fca1d8f7ebd02f6839692b55f6_24_1.png)\n\
    \n你也可以自己制作，用一条木条和两根与纸上的孔对应的木钉，甚至可以用胶带把两个 5 毫米的沉头螺栓粘在你的透写台上。然后就可以配合用活页夹打孔的 A4 纸使用。\n\
    \n![](img/49afe0fca1d8f7ebd02f6839692b55f6_25_0.png)\n\n和纸张一样，请记住，如果你希望专业地使用你的动画，建议购买三销钉定位条。\n\
    \n### 透写台（Light Boxes）\n\n透写台最基本的形式是一块放在灯上的扁平乳白色有机玻璃板。专业透写台使用可旋转的圆盘，还应该能够改变绘图表面的角度。这可以让绘图时手腕和背部都更轻松。\n\
    \n![](img/49afe0fca1d8f7ebd02f6839692b55f6_25_1.png)\n\n简单的透写台制作起来相对容易。你可以使用一个顶部切出斜角的木制收纳箱，在里面安装一根霓虹灯管，然后用螺丝将一块\
    \ 6 毫米的乳白色有机玻璃固定在上面。\n\n![](img/49afe0fca1d8f7ebd02f6839692b55f6_25_2.png)\n\n\
    ### 摄影表（X-sheets）\n\n**动画师：**  \n**制作：**  \n**场景编号：**  \n**序列编号：**  \n**长度：**\
