    # The Animation of Liquids


    # *A Drip*


    Liquids, unlike solids, have the ability to break apart and reform easily. As
    it falls, a drop of liquid takes on a tear shape (a bit like a balloon). Surface
    tension creates a ‘membrane’, which holds the majority of the water at the bottom
    of the drop. When the drop hits the ground, the surface tension is broken and
    the water breaks apart. As the first amount of water hits the ground it bounces
    outwards and upwards at an angle. It is prevented from bouncing directly upwards
    by the water that follows.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_95_0.png)'
  - '[PAGE 96]


    The water caught in the bounce separates from the main body and creates smaller
    drops. As each of these smaller drops bounce they follow a parabola like a bouncing
    ball. The smaller drops radiate outwards from the central point of impact and,
    as each reaches the apex of its bounce, it slows down. As each comes out of its
    apex, it speeds up and breaks away from the middle. The water behind these smaller
    drops may form other drops that continue to radiate outwards in arcs or, as they
    run out of energy and become unable to complete a full arc, they may fall back
    on themselves. Depending on the momentum of the water, this sequence may continue
    for a number of bounces or the drops may run out of energy as they hit the ground,
    causing the water to flow forwards over the surface. See ‘drip.avi’, Chapter 2
    on the website.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_96_0.png)


    # A Splash


    Splashes follow the same principles as drips, but they consist of a lot more water.
    To help visualise this, I always think of the water bouncing off the ground as
    looking like sheets folding over on themselves. For the first bounce, the sheet
    of water remains in a mass as it radiates outwards before separating into smaller
    drops during further bounces or running out of energy and flowing over the ground.
    See ‘splash.avi’, animations002, Chapter 2 on the website.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_96_1.png)'
  - '[PAGE 97]


    # An Object Falling into Water


    When an object is dropped into water, the object penetrates the surface, forcing
    a splash to rise up at the outside edges of the object.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_97_0.png)


    In the above illustration, you will notice that a column of water bounces up in
    the middle of the splash. This happens because, as the object sinks, it leaves
    a hollow column. The water surrounding this hollow fills in. It meets in the middle
    with equal force and wants to rebound. It can’t bounce back because of the following
    water. It can’t go down because the object below is in the way, so the water is
    propelled up. When the column of water reaches a certain height, it runs out of
    energy and gravity takes over. The water at the very top has the most energy.
    As the water blows it runs out of energy, it breaks away and falls back on itself.
    This leaves a blob of water floating in the air that, as gravity takes over, then
    starts its descent to the water surface. It may also cause another smaller splash
    when it hits the water surface. See ‘pond splash.avi’, animations002, Chapter
    2 on the website.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_97_1.png)'
  - '[PAGE 98]


    # 2D Exercises


    These exercises look at the principles behind the movement of laminate objects.
    Using the examples from earlier we will animate five different balls rolling off
    the roof of a shed and bouncing on the ground before rolling to a stop. These
    exercises look at momentum, the force of gravity and how different objects react
    when hitting the ground.


    We will animate a bowling ball, a soccer ball, a beach ball, a ping-pong ball
    and a water-filled balloon. Each of the balls should be 1 cm in diameter.


    # The Background Level


    First draw a shed at the side of your paper in the same position as in the illustration
    below. Draw it in black felt pen to make the lines as dark as possible, so that
    when you combine it with the animation it will be as clear as possible. Make the
    shed 5 cm wide, 5 cm tall at the highest point and 4 cm tall at the lowest point.
    (These same dimensions are going to be used in your 3D computer animation.)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_98_0.png)


    You will only need to draw this once. This is your background. When you are animating
    your balls, keep this background on your peg bar on the light box. Remember that
    ‘BG 1’ in the bottom right-hand corner.


    I will go through the bowling ball exercise in detail. The method is the same
    for all five balls and can be used as a reference for the other exercises.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_98_1.png)'
