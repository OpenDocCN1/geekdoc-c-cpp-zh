    \ – it is worth refreshing your knowledge and reinforcing the basic principles\
    \ behind animation.\n\n# ## How Animation Works\n\n*The Basics*\n\n2D drawn animation\
    \ consists of a series of drawings shot one after another and played back to give\
    \ the illusion of movement. This animation can be played back in a number of ways:\n\
    \n+   - In the form of a ‘flipbook’ (basically a pile of drawings in sequence,\
