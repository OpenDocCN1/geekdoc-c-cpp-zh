    # # Matter and the Animation of Inanimate Objects


    +   ### Chapter Summary

    +   - Inanimate Objects

    +   - How to Animate Inanimate Objects

    +   - The Animation of Solids

    +   - The Animation of Liquids

    +   - 2D Exercises

    +   - 3D Exercises


    If you can cast your mind back to your first ever physics lesson at school, you
    will probably remember being told that the world is divided into three states
    of matter: solid, liquid and gas. At some point you''re going to animate all three
    of these. And, just to make life difficult, there are also energy sources you''ll
    need to animate: electricity, fire and explosions. The animation of liquids, gasses,
    electricity, fire and explosions is the preserve of the special-effects animator
    and, although I will touch on how it is done, it is not really in this book''s
    remit. However, knowledge of the movement of solid inanimate objects is vital
    to the understanding of character animation and that''s primarily what this chapter
    is about.


    One thing that will always help your animation is to study real life. We are going
    to be spending most of this chapter looking at how balls bounce. Almost anything
    we need to know about the movement of matter can be condensed into its most basic
    form in the movement of bouncing balls. So, get some balls and start bouncing
    them!


    This chapter is also about familiarising yourself with the 3D program you are
    using. I will go into a lot of detail about how to use your chosen program.


    # ## Inanimate Objects


    My definition of an inanimate object is any object that does not display ''life''.
    These fall into two categories. The first are objects that do not move by themselves:
    things that have to be dropped, pushed, pulled or propelled by a character. The
    second are inanimate objects that are able to move: cars, motorbikes, ships, aircraft,
    machines, engines etc. I would still describe these things as inanimate objects
    because they are not alive and they show no character or emotion.'
