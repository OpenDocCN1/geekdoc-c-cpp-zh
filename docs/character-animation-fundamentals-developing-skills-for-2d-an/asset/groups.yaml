    The next stage is to work out the in-between drawings and place a timing chart
    at the bottom of each key. Remember that, to show increased speed as the ball
    is dropped, the drawings will be further and further apart.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_48_0.png)


