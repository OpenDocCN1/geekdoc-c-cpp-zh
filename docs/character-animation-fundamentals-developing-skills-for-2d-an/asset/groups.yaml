    # Running


    The main point of a human running is to get from A to B as fast as possible. This
    is achieved not by making the strides quicker (this results in a fast walk) but
    by making the strides longer. Each stride is basically a jump, with both feet
    off the ground. Each crossover point is the squash down following the jump, combined
    with the anticipation for the next jump. The twists in the body will be an exaggerated
    version of a walk cycle. The line of balance is pushed forwards as if our character
    is falling forwards – this gives more momentum.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_257_0.png)


    There are four basic key drawings to a run cycle:


    +   1. Near-side leg leading a stride and the far-side leg trailing.

    +   2. Near-side leg impacting the ground and bending as the far-side leg crosses
    over.

    +   3. Far-side leg leading the stride and the near-side leg trailing.

    +   4. Far-side leg impacting the ground and bending as the near-side leg crosses
    over, and so on.


