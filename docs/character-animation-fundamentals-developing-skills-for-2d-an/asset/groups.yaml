    Go to the main menu and click **Render > Render Current Frame**. Up will come
    the Render View window. In the Render View window select **Options > Render Globals**
    and up will come the Render Globals window.


    Fill in the columns in accordance with how you want to output your rendered scene.
    Give it a name in **File Name Prefix**. **Frame/Animation Ext** is for an image
    sequence and how you want it numbered (use either “frame#.ext” or “name.#.ext”).
    Start Frame and End Frame are for the first and last frames that you want to render.
    **Frame Padding** is for numbering an image sequence and should be set to 3 if
    you have less than 1000 frames. **Image Format** is the output you want to produce,
    either an image sequence or an .avi. **Renderable Objects** should be set to **All**.
    For **Camera**, choose the view you want to render from. In **Resolution**, set
    Presets to **320 × 240**. When you have finished inputting the settings, close
    the Render Globals window. Then go to the main menu and select **Render > Batch
    Render**. Your scene should now render. It will be saved to your hard drive.


