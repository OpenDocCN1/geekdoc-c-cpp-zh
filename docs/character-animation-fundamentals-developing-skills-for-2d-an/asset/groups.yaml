  - '[PAGE 277]


    At the stride position, the hips are level. As the animal moves forwards, more
    weight is placed on the leading leg. Less weight is placed on the trailing leg
    and that side of the hip drops as a result. As the trailing leg is picked up and
    goes into the crossover position, the hip is raised to stop the leg dragging on
    the ground. Finally this leg reaches the next stride position and the hips are
    level.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_277_0.png)'
  - '[PAGE 278]


    At the front, most of the twisting is made by the movement of the shoulder blades,
    with only a small amount of rotation through the rib cage.


    Generally at the stride position the shoulders and rib cage are slightly angled,
    the shoulder of the leading leg being slightly higher than the shoulder of the
    trailing leg. The leading leg''s shoulder blade is facing forwards and the trailing
    leg''s shoulder blade is facing back. The illustration below shows the first half
    of the cycle. In the remaining part of the cycle the shoulders do the same thing,
    but as a mirror image: 13 is the mirror image of 1, 15 is the mirror image of
    3, 17 is the mirror image of 5 etc.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_278_0.png)


    As the dog moves forwards, the rib cage twists away and downwards from the leading
    leg and the shoulder blade of the trailing leg drops. The shoulder blade of the
    leading leg (the leg in contact with the ground) sticks up through the top of
    the body as it takes all the weight. The illustration below shows the first half
    of the cycle.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_278_1.png)'
  - '[PAGE 279]


    As the trailing leg moves to the crossover position, its shoulder blade is higher
    than the shoulder blade of the leg in contact with the ground.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_279_0.png)


    Finally we get back to the next stride position. The remaining drawings in the
    cycle will do the same thing but on the opposite sides. The two previous illustrations
    show the first half of the cycle. The remainder of the cycle will do the same
    thing but as a mirror image: 13 is the mirror image of 1, 15 is the mirror image
    of 3, 17 is the mirror image of 5 etc.


    From the top, the spine will twist from side to side in order to accommodate the
    stride positions.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_279_1.png)


    Take a look at ‘dog_walk_2D’ and ‘dog_walk_3D.avi’, in the animations006 folder
    in Chapter 6 on the website.'
  - '[PAGE 280]


    # A Cat Walk


    Where dogs are quite solid and resilient in the way they move, cats are rather
    floppy and nonchalant. Have a look at ‘catwalk.avi’ in movies006, Chapter 6 on
    the website.


    In comparison to dogs, cats tend to have longer back legs but the strides their
    front and back legs take will be of the same length. Cats are more likely to hold
    their bodies lower to the ground and tend to pick up their legs slightly slower
    than a dog does. A cat’s hips will move in a similar way to the hips of a dog.
    The noticeable difference in movement is at the shoulders.


    To give a cat that ‘can’t-be-bothered’ feel to their walk, the rib cage should
    always be suspended lower between the shoulder blades than a dog’s rib cage is.
    This makes the shoulder blade of the leg in contact with the ground stick up through
    the top of the body. The leg that is picked up to cross over will drop, leaving
    the shoulder blade lower than the outline of the body. The rib cage drops and
    twists slightly. The illustration below shows half of the cycle. Frame 17 is a
    mirror image of 1, 19 is a mirror image of 3, 21 is a mirror image of 5, etc.


    At the crossover position, the rib cage remains dropped (although slightly raised,
    compared with the stride position) and the shoulder blade of the leg in contact
    with the ground remains visible through the top of the body.


    The raised leg then moves to the next stride position. The twisting of the spine
    (from the top view) will be similar to that of a dog.


    Take a look at ‘cat_walk_2D.avi’ and ‘cat_walk_3D.avi’ in the animations006 folder
    in Chapter 6 on the website.


    # Animals with Cloven Feet


    Animals such as cows, sheep, pigs, goats and deer walk on the equivalent of two
    fingers.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_280_0.png)


    These extended digits are referred to as fetlocks. The lengthening of these digits
    allows for a longer leg and thus a longer stride, thereby enabling these animals
    to walk and run faster. Take a look at ‘cow_walk_2D.avi’ in the animations006
    folder of Chapter 6 on the website.'
