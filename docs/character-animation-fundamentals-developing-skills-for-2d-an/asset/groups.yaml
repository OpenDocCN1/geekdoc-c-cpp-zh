  mdcn: '


    现在我们处于第 1 个关键姿势。


    如果你一直在设置关键帧（或者使用了**自动关键帧**），那么现在已经在第 1 帧保存了一个关键帧。如果没有，请选择你移动过的元素，并分别在键盘上按下 **S**
    来保存关键帧。最好也为所有背部、颈部、肩部、手腕、手指和拇指骨骼设置关键帧。


    一个关键姿势完成了，还剩 9 个！


    第二个关键姿势位于第 9 帧，是“预备”姿势。身体、手臂和头部略微抬起。


    将时间滑块移动到第 9 帧。选择“BodyHandle”，单击移动工具，将身体稍微向上移动。按下 **S** 设置关键帧。选择“RarmControl”和“LarmControl”，将手臂向上移动（设置关键帧）。继续参考你绘制的动画（或
    2D 抬举部分中的插图），确定人物的姿势。你也可以单击播放按钮来回放动画，或者按住键盘上的 **K**，在视图面板上前后拖动鼠标来回查看动画。可以把这个过程想象成翻动、快速翻页和滚动。设置关键帧前，一定要确认自己位于正确的帧上！


    选择“leftwrist”，旋转手腕，直到得到与关键姿势绘图相似的位置（设置关键帧）。对“rightwrist”执行相同操作（设置关键帧）。


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_160_0.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_160_1.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_160_2.png)


    如果操作失误，设置了不需要的关键帧，只需在时间滑块上右键单击该关键帧位置，然后选择**删除**。选择尚未移动的骨骼并为其设置关键帧（背部骨骼、颈部骨骼等）。将时间滑块移动到第
    19 帧，以便设置第三个关键姿势（参见上面的插图）。


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_161_0.png)


    选择“BodyHandle”，将人物向下移动。膝盖应该自然弯曲，同时双脚保持在地面上的原位。然后旋转他的身体，使其几乎与地面平行。不要选择并移动“back1”关节。尝试为它制作动画时会发生奇怪的情况。


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_161_1.png)


    就在他捡起球之前，球的运动存在奇怪的晃动；他的左臂也有奇怪的晃动，整个动作显得异常均匀，而且画面中出现了两个球！我们没有为计算机提供足够的信息，让它正确地计算关键帧之间的动画。现在我们需要制作主要的中间帧（也称为分解姿势）。


    打开曲线编辑器（**Window > Animation Editors > Graph Editor**），然后在超级图中选择每个节点。曲线编辑器窗口中会出现大量动画曲线。为了在不使用计算机自动插入中间帧的情况下查看动画，我们需要将这些动画曲线从样条曲线转换为阶梯曲线（这与查看手绘线条测试中的关键帧效果相同）。这意味着播放动画时，曲线会从一个关键帧水平延伸到下一个关键帧，然后垂直向上跳转。你的动画将变成一系列从一个关键姿势跳到下一个关键姿势的画面。要转换曲线，请在曲线编辑器的菜单中进入
    **Tangents**，然后选择 **Stepped**。所有波浪形的动画曲线都会变得整齐、平直！


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_165_0.png)


    首先，我们可以处理两个球的显示和隐藏。取消选择所有对象（在某个视图中人物以外的区域单击），然后选择地面上的球（nurbsSphere1）。打开曲线编辑器，你会看到与该球运动相关的动画曲线。在曲线编辑器窗口的浏览器区域中，在“nurbsSphere1”下选择
    Visibility。这会显示一条值为 1 的黑线，以及线上的几个点（这些点就是曲线编辑器图形区域中的关键帧）。在所有关键姿势中，我们只需要第 1 帧、第
    29 帧和第 100 帧的关键帧。因此，删除第 19、39、47、53、61、69 和 75 帧的关键帧。你可以在曲线编辑器中选择动画曲线上的相应点，然后按键盘上的
    Delete；也可以在时间滑块中右键单击这些关键帧，然后选择删除。现在，你应该得到一条包含三个关键帧的动画曲线。在曲线编辑器中选择第 29 帧的关键帧。曲线编辑器顶部的两个
    Stats 框中会显示数字“29”（表示第 29 帧）和“1”（表示值为 1）。将值从 1 改为 0。这会使该关键帧的位置在图形中下降到 0。当球的可见性值为
    1 时，我们可以看到它；当可见性为 0 时，我们就看不到它！对第 100 帧的关键帧重复此操作。由于你之前选择了阶梯关键帧，动画曲线会呈现出明显的“阶梯”形状。


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_166_0.png)


    我们需要对连接在人物手上的球执行相同的操作，但这次球应该在第 1 帧到第 28 帧之间不可见，然后在第 29 帧到第 100 帧之间可见。你只需删除无关的关键帧，并将第
    100 帧关键帧的值设为 0。


    对动画进行播放预览（Playblast），以便以正确的速度查看动画。它看起来应该类似于“lift_3D_keys.avi”，也就是 2D 关键帧线条测试的
    3D 版本。


    ## 在 Maya 中设置分解姿势


    在 Maya 中转到动画的第 1 帧，调出你绘制动画中的第 1 至第 9 张图。此部分的分解姿势（主要中间帧）位于第 3 帧和第 5 帧。这两个关键姿势之间的中间帧时间表显示，第
    3 张图比第 1 张图更接近三分之一，同时又沿远离第 1 张图的方向推进了三分之二（参见前面时间表中的插图）。我们需要让人物在第 3 帧处于这个姿势。


    在视图面板菜单中，将 **Shading** 设置为 **Wireframe**。在超级图中选择所有节点，然后为动画启用鬼影显示（在主菜单中选择 **Display
    > Object Display > Ghosting**）。现在，你应该能在视图面板中看到前两个关键姿势。


    将时间滑块移动到第 3 帧，并将人物移动到与第 3 张图相同的位置（位于第 1 个姿势和第 9 个姿势之间）。你可能会发现，为所有对象启用鬼影显示会占用大量内存，使操作变慢且难以控制。如果出现这种情况，可以只为身体的某一部分启用鬼影显示，或者在屏幕上贴一张透明片进行绘制。如果需要计算身体的中间姿势，请选择身体并应用鬼影显示。将时间滑块置于第
    3 帧，选择“BodyHandle”节点移动人物身体，使其处于与你的绘图相同的位置。


    在制作分解姿势时，计算机会将动画恢复为均匀的中间过渡状态（动画曲线会恢复为“样条”状态）。你可以保持这种状态，也可以选择所有节点，然后进入曲线编辑器，将切线转换为阶梯切线。


    如果动画在两个关键姿势之间跳动，说明动画曲线仍然是“阶梯”状态（也就是说，曲线编辑器中两个关键姿势之间存在直线段）。要解决这个问题，请打开曲线编辑器，并在超级图中选择所有节点。这会在曲线编辑器中显示所有动画曲线。不要在意那些五颜六色、杂乱如意大利面的曲线；我们只关心第
    25 帧和第 33 帧之间的曲线。将指针放在曲线编辑器区域内，按键盘上的 **A**，然后使用鼠标左键在动画曲线上第 25 帧和第 33 帧的关键姿势周围拖出一个框，确保能看到所有曲线。选中这些关键姿势后，进入曲线编辑器菜单，选择
    **Tangents**，然后选择 **Spline**，将它们之间的曲线设置为样条曲线。第 25 帧和第 33 帧之间的帧现在应该会均匀地生成中间帧。


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_167_0.png)


    检查整个动画序列，在主要关键姿势之间放置分解姿势（查看 2D 部分中的插图，或者更好的是，参考你自己绘制的图）。完成后，你应该能得到类似网站第 3 章中的“lift
    3D breakdowns.avi”的效果。正如你所看到的，我们已经基本完成了。在我制作的分解姿势中，我通过在人物下落和再次起身的过程中拖动头部和手臂，确保动画具有一定的生命力。但动画仍然有些粗糙。左臂在捡球时会轻微晃动，右手在抓住球之前也会晃动。我们还需要在人物用力捡球时闭上眼睛。现在需要逐一调整那些动作不理想位置的动画曲线。一次选择一个片段，并像上一章调整弹跳球时那样改变曲线的角度。


    ## 试试看！


    另一种修正动画中不满意部分的方法，是在每一帧都设置一个关键帧。例如，在手第一次接触球并开始晃动的阶段（第 19 帧到第 29 帧之间），尽可能放大到手接触球的位置，并选择“Larm-Control”。在第
    19 帧，用透明片贴在屏幕上，描出手的轮廓。然后沿时间轴拖动到第一个分解姿势（第 23 帧），旋转“LarmControl”关节，直到手处于与透明片上绘图相同的位置，然后设置关键帧。接着转到下一个分解姿势（第
    25 帧），旋转“LarmControl”，直到手处于与透明片上绘图相同的位置，然后设置关键帧。继续前后拖动时间轴、旋转“LarmControl”，并在不同帧设置关键帧，使手始终保持在相同的位置。


    使用相同的技巧处理其他晃动。记住，你可以移动或旋转角色的任何部分来改变关键帧的位置，然后在新的姿势下按键盘上的 S 保存关键帧。


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_168_0.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_168_1.png)


