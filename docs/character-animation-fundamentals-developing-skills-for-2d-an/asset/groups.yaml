  mdcn: "\n\n## “F”音\n\n当嘴巴发出“F”音时，下唇向内收拢，被牙齿轻轻咬住。大部分声音来自牙齿与嘴唇之间挤出的气流。上唇的形状会随角色的情绪而变化。当他开心或放松时，上唇放松，几乎盖住牙齿。当他生气或带有攻击性时，上唇紧绷并向后拉，露出牙齿——例如，在说某个四字母单词的时候。在动画中过渡到下一个音时，牙齿抬起，下唇向前下方弹动，进入下一个嘴型。\n\
    \n![](img/49afe0fca1d8f7ebd02f6839692b55f6_421_0.png)\n\n## “V”音\n\n与“F”一样，下唇向内收在牙齿下方，但程度没那么深。发出的声音是牙齿与嘴唇间的气流摩擦声和哼鸣声的混合。在动画中结束“V”音时，下唇向外弹出的幅度不像“F”音那样大。\n\
    \n## 元音\n\n![](img/49afe0fca1d8f7ebd02f6839692b55f6_421_1.png)\n\n## “EH”音\n\n\
    如“wet”中的发音。嘴巴张大，呈宽阔的微笑状，下颌下垂，但下垂程度不及“O”和“A”。\n\n![](img/49afe0fca1d8f7ebd02f6839692b55f6_424_0.png)\n\
    \n## “EEE”音\n\n如“squeeze”中的发音。声音仍然相当响亮，但下颌张开的程度不像其他响元音那么大。嘴型是宽阔的微笑。\n\n![](img/49afe0fca1d8f7ebd02f6839692b55f6_424_1.png)\n\
    \n请注意，这段80帧的对话只有三个姿势位置。对于“one moment ... my good man”，主要的强调点是“one moment”和“my\
    \ good man”。\n\n**等一等……**\n\n**……我的好伙计。**\n\n![](img/49afe0fca1d8f7ebd02f6839692b55f6_427_0.png)\n\
    \n请查看网站上的“moment_thumbs.avi”和“hello_thumbs.avi”。\n\n接下来要做的是确定关键姿势和中间画，确保动作符合对话的感觉。对于“hello\
    \ ... how are you?”，我们让角色在“hello...”时先向后做预备动作，然后向前倾。随后在“...o”音上动作过头，再在“...o”音结束时回落到静止（这个音相当长）。在停顿中，他的头部向画面左侧做预备动作。然后在“how...”时把头偏向画面右侧，在“...w”上动作过头，在“are”时又把头略微向后收，接着在“you”时再次把头低下，在“...o...”上动作过头，最后回到“...u”上静止。请看“hello_keys_2D.avi”。\n\
    \n![](img/49afe0fca1d8f7ebd02f6839692b55f6_427_1.png)\n\n像“dad”中的“A”音，嘴型大而窄，呈微笑状。使用“big\
    \ smile”嘴型。\n\n![](img/49afe0fca1d8f7ebd02f6839692b55f6_433_0.png)\n\n如“wet”中的“EH”音，嘴型大而宽，呈微笑状，下颌下垂，但不像“O”和“A”那么低。将“OH”与“big\
    \ smile”混合，但嘴巴不要张得像“AR”那么大。\n\n![](img/49afe0fca1d8f7ebd02f6839692b55f6_433_1.png)\n\
    \n如“squeeze”中的“EEE”音，声音仍然相当响亮，但下颌张开的程度不如其他响元音。嘴型是宽阔的微笑。使用“big smile”和“smile”的混合。\n\
    \n![](img/49afe0fca1d8f7ebd02f6839692b55f6_434_0.png)\n\n## 较轻柔的元音和辅音\n\n这些音包括“C”、“D”、“I”、“K”、“N”、“T”、“Y”、“Z”等。只要能从一种主要嘴型过渡到下一种嘴型，你几乎可以使用任何喜欢的嘴型。\n\
    \n## 嘴部动画\n\n根据 X-sheet（摄影表）上特定发音所需的嘴型来改变嘴部的形状。这四个程序在改变嘴型和设置关键帧的方式上略有不同，因此请遵循第10章中针对每个程序给出的单独说明。对于第二段对话，尝试使用更精细的角色（Jenny）。请观看网站上的“hello_3D.avi”以及第12章文件夹中的视频教程，了解具体做法。\n\
    \n## 动画设备供应商\n\n**Animation Supplies Ltd**  \n木偶动画用品。  \nD4 Yeoman Gate  \nYeoman\
    \ Way  \nWorthing  \nWest Sussex  \nBN13 3QZ  \nUK  \n+44 (0)844 358 0852  \n\
