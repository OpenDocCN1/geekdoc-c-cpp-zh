    Play back your animation (or take a look at ''ball_drop_keys_3D.avi'', animations001,
    Chapter 1 on the website). It bounces in a rather strange way. This is because
    the ball is accelerating out of and then decelerating into each of the key positions.
    It should decelerate into and accelerate out of the key positions at the apex
    of each bounce (17, 29 and 37) but should keep accelerating into the keys where
    it hits the ground and then accelerate out of these key positions (9, 23, 33 and
    41).


    # ### Adjusting the In-Betweens


    Open up the Graph Editor by going to the main menu and selecting **Window > Animation
    Editors > Graph Editor**. In the **Outliner** area of the Graph Editor select
    **Translate Y** and a green curve will be illustrated in the **Animation Curve**
    area of the Graph Editor.


    Each of the points on the curve is one of the key frames that you set. On the
    graph, horizontally they will correspond to the frame number they were set at,
    and vertically to the value in Y (up and down). These values can be adjusted using
    various tools (more later). The highest key points on the curves are the highest
    parts, in the animation, of each of the bounces. The lowest key points on the
    curves are the parts, in the animation, where the ball touches the ground. The
    program has linked these key points together in a way that makes the curve gracefully
    swoop in and out of each key point.'
