  md: "\n## ‘F’\n\nWhen the mouth is making an ‘F’ sound, the bottom lip is tucked\
    \ under and bitten by the teeth. Most of the sound comes from air hissing out\
    \ from between the teeth and the lips. The shape of the top lip varies depending\
    \ on the mood of your character. When he is happy or relaxed, the top lip is relaxed\
    \ and almost covering the teeth. When he is angry or aggressive, the top lip is\
    \ tensed up and pulled back to reveal the teeth – for example, when saying a certain\
    \ four-letter word. When animating into the next sound, the teeth are raised and\
    \ the bottom lip is flicked forwards and downwards into the next mouth shape.\n\
    \n![](img/49afe0fca1d8f7ebd02f6839692b55f6_421_0.png)\n\n## ‘V’\n\nAs with ‘F’,\
    \ the bottom lip is tucked under the teeth, but not as much. The sound made is\
    \ a mixture of hissing air between the teeth and the lips and a humming sound.\
    \ When animating out of a ‘V’ sound the bottom lip doesn’t pop out as far as with\
    \ an ‘F’.\n\n## Vowels\n\n![](img/49afe0fca1d8f7ebd02f6839692b55f6_421_1.png)\n\
    \n## ‘EH’\n\nAs in ‘wet’. A large, wide smiling mouth with the jaw dropped, but\
    \ not quite as dropped as for ‘O’ and ‘A’.\n\n![](img/49afe0fca1d8f7ebd02f6839692b55f6_424_0.png)\n\
    \n## ‘EEE’\n\nAs in ‘squeeze’. Still quite loud but the jaw will not be as open\
    \ as for the other loud vowels. It consists of a wide smile.\n\n![](img/49afe0fca1d8f7ebd02f6839692b55f6_424_1.png)\n\
    \nNotice that there are only three pose positions for the 80 frames of dialog.\
    \ For ‘one moment ... my good man’, the main emphasis points are ‘one moment’\
    \ and ‘my good man’.\n\n**One moment...**\n\n**...my good man.**\n\n![](img/49afe0fca1d8f7ebd02f6839692b55f6_427_0.png)\n\
    \nTake a look at ‘moment_thumbs.avi’ and ‘hello_thumbs.avi’ on the website.\n\n\
    The next thing to do is to work out the key positions and the in-betweens, making\
    \ sure the action fits the feel of the dialog. For ‘hello ... how are you?’, we\
    \ have the character anticipate backwards and then lean forwards on ‘hello...’.\
    \ He then overshoots on the ‘...o’ and comes back to rest on the end of the ‘...o’\
    \ sound (it’s quite long). In the pause he anticipates his head to screen left.\
    \ He then leans his head to screen right on ‘how...’, overshoots on the ‘...w’,\
    \ pulls his head back again slightly on ‘are’ and then puts his head back down\
    \ again for ‘you’, overshooting on the ‘...o...’, and coming back up to rest on\
    \ ‘...u’. Take a look at ‘hello_keys_2D.avi’.\n\n![](img/49afe0fca1d8f7ebd02f6839692b55f6_427_1.png)\n\
    \n'A' as in 'dad' is a large but narrow smiling mouth shape. Use mouth shape 'big\
    \ smile'.\n\n![](img/49afe0fca1d8f7ebd02f6839692b55f6_433_0.png)\n\n'EH' as in\
    \ 'wet' is a large, wide smiling mouth with the jaw dropped, but not quite as\
    \ dropped as 'O' and 'A'. Mix 'OH' with 'big smile' but don't have the mouth as\
    \ open as for 'AR'.\n\n![](img/49afe0fca1d8f7ebd02f6839692b55f6_433_1.png)\n\n\
    ‘EEE’ as in ‘squeeze’ is still quite loud but the jaw will not be as open as for\
    \ the other loud vowels. It consists of a wide smile. Use a mixture of ‘big smile’\
    \ and ‘smile’.\n\n![](img/49afe0fca1d8f7ebd02f6839692b55f6_434_0.png)\n\n## The\
    \ Quieter Vowels and Consonants\n\nThese are ‘C’, ‘D’, ‘I’, ‘K’, ‘N’, ‘T’, ‘Y’,\
    \ ‘Z’ etc. Use almost any mouth shape you like as long as it in-betweens from\
    \ one of the major mouth shapes to the next.\n\n## Animating the Mouth\n\nChange\
    \ the shape of the mouth depending on the mouth shape required for the given sound\
    \ on the X-sheet. Each of the four programs has a slightly different way of changing\
    \ the mouth shapes and setting keys, so follow the individual instructions for\
    \ each program outlined in Chapter 10. With the second piece of dialog, try using\
    \ the more sophisticated character (Jenny). Take a look at ‘hello_3D.avi’ and\
    \ the video tutorials in the Chapter 12 folder on the website to get an idea of\
    \ what to do.\n\n## ANIMATION EQUIPMENT SUPPLIERS\n\n**Animation Supplies Ltd**\
    \  \nPuppet animation supplies.  \nD4 Yeoman Gate  \nYeoman Way  \nWorthing  \n\
    West Sussex  \nBN13 3QZ  \nUK  \n+44 (0)844 358 0852  \nwww.animationsupplies.net\n\
    \n**Cartoon Supplies**  \nAll drawn animation supplies such as paper, peg bars,\
    \ light boxes and pencils.  \n36125 Travis Ct.  \nTemecula  \nCA 92592  \nUSA\
    \  \n+1 951 693 5165  \nwww.cartoonsupplies.com\n\n**Cartoon Colour Company, Inc.**\
    \  \nAll drawn animation supplies such as paper, peg bars, light boxes and pencils.\
