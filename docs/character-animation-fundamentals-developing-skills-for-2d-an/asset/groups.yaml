  - '[PAGE 212]


    Next we need to parent the joints in the string to the joints in the stick. In
    the Hypergraph select ‘joint3’ and then middle click it, drag it to ‘joint2’,
    and let go of the mouse button. You should now have a line linking ‘joint2’ to
    ‘joint3’.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_212_0.png)


    Test your model by selecting (clicking) the joints and rotating them (don’t move
    them; this will distort the model). After you’ve tested each joint, put the stick
    and string back to their original positions. Do this by going to the main menu
    and clicking Skin > Go to Bind Pose. The stick and string will return to the pose
    they were in when they were first bound to the joints.


    # Animating the Stick and String in Maya


    Get out your drawn animation. The first thing we need to do is to set the keys
    for the waving of the stick.


    Open the Preferences window by clicking the Animation Preferences button at the
    bottom of the screen or, in the main menu, clicking Window > Settings/Preferences
    > Preferences. Select Settings from the Categories list and in Working Units set
    the Time to ‘PAL (25fps)’ from the dropdown menu.


    The scene is 100 frames long so make sure the End Time box is set to 100 (this
    is the default setting so you may not have to do anything).


    +   - Move the Time Slider to frame 1 and select ‘joint1’ (the joint in the stick)
    and rotate the joint in Z by 35 degrees (in the Channel Box, in the Rotate Z box
    type 50). Set a key position by pressing S on your keyboard. Move the Time Slider
    to frame 17 and set the second key position of a rotation of −35 degrees. Move
    the Time Slider to frame 33 and set the third key position to a rotation of 35
    degrees. Move the Time Slider to frame 43 and set the fourth key position to a
    rotation of −35 degrees. Move the Time Slider to frame 65 and set the fifth key
    position to a rotation of 35 degrees.


    Make a Playblast of your animation (Window > Playblast) and then take a look at
    ‘stick_3D_keys.avi’, Chapter 4 on the website. You now have a waving stick with
    a stiff piece of string.'
