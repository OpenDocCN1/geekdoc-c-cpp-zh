    \ 413\n    - 制作嘴部动画 — 413\n\n- 动画设备供应商 — 415\n- 索引 — 419\n\n## 致谢\n\n没有以下这些人的帮助，本书不可能问世。\n\
    \n感谢Dee Honeybun，她梳理了我难以辨认的笔记，并把它们变成了值得阅读的内容。\n\n感谢Marie Hooper，最初是她委托我撰写本书，并容忍了我每一次的逾期交稿。\n\
    \n感谢爱思唯尔的Katy Spencer，她委托我修订本书，并容忍了我更多的逾期交稿。\n\n感谢Claude Lester，作为我的“最佳男伴”，并说服我相信函数曲线是我的朋友。\n\
    \n感谢Kevin Rowe在Maya和表演方面给予的帮助。\n\n感谢Birgitta Hosea为我腾出时间。\n\n感谢Bob Godfrey最初引领我进入动画领域——我在10岁时就拥有了他的书\
    \ *《自己动手的电影动画书》*。\n\n感谢Paul Stone和Mal Hartley，他们是我动画路上的好兄弟。\n\n感谢中央圣马丁艺术与设计学院的支持，以及允许我使用Maya。\n\
    \n感谢卡文迪什学院的支持，以及允许我使用3D Studio Max。\n\n感谢Kent Braun允许我使用DigiCel FlipBook。\n\n\
    感谢Autodesk公司的Nick Manning允许我使用Maya和3D Studio Max的图片。屏幕截图和影片的使用已获得Autodesk公司的许可。\n\
    \n感谢Vasco Carou提供他的马Inato（一匹纯种卢西塔诺马）的精彩影像。\n\n感谢所有我教过动画的学生（近1000人！）——相信我，我从你们身上学到的和你们从我这里学到的一样多。非常感谢所有回复过我那些无聊邮件问题的学生。\n\
    \n感谢所有我认识过、争论过、观察过、倾听过、赞同过、忽视过，以及所有以各种方式影响过我的人，正是你们造就了今天的我。\n\n感谢我的父母，他们相信我能找到一份整天涂涂画画的工作。\n\
    \n但最重要的是Dee、Felix和Emily，过去几年里，他们见到我的次数远不及应有的那样多，但他们依然爱着我。\n\n本书是我近20年来向3D电脑动画师教授手绘动画技巧的成果结晶。\n\
    \n你可能会想：“3D电脑动画师究竟为什么需要学习如何做动画？”这个问题的答案是，无论使用何种媒介，动画的基本原理都是相同的，而且通常用纸笔可以更快地捕捉到运动的想法。电脑可以减轻动画制作中的大量苦差事，但最终你可能会做出一段动画，却不完全明白它是如何产生的，也不知道它是否真的有效。\n\
    \n在过去25年的动画生涯中，我学到的最宝贵经验之一就是保持简单。动画教师的主要价值在于开门见山地告诉你需要掌握的基本要点。然后你可以用自己的方式去拓展它们。我在本书中尽量保持示例和动画练习的简单性，以便你能够打下坚实的技能基础，在这个基础上进一步发展你的动画。\n\
    \n本书的结构如下。在每一章中，我将讲解某个主题的基本原理，随后安排一个手绘动画练习供你完成。只有在那之后，你才能尝试使用自己选择的软件包来完成相同的动画练习。\n\
    \n本书包含了基本原理、手绘动画练习以及如何在3D中完成相同练习的指导。请访问本书配套网站：www.characteranimation.com。网站上包含带有更大图片的.pdf文件，以及展示如何做练习或如何建模的影片，还有动画影片，以及大量已完全绑定好、可供你下载到电脑上进行练习的模型。此外，还有大量关于动画和电影制作的技巧与诀窍。我还有一个名为characteranimation的YouTube频道（www.youtube.com），我会定期上传教程。\n\
    \n动画制作中最重要的事情是做足研究。如果你需要制作大象的动画，就去观察大象是如何移动的。如果你需要制作某人打篮球的动画，就去观察别人打篮球（或者更好的是，自己去打！）。如果你能体会某种动作的感觉，你总能把它制作得更好。网络非常适合研究，但没有什么能比得上亲身体验真实事物。这是我喜欢动画的原因之一：它促使你去了解周围的世界。\n\
    \n我从七岁起就爱上了动画，那时母亲带我去电影院看了迪士尼的 *《睡美人》*。与我们家里那台小小的Murphy黑白电视相比，电影的色彩、巨大的银幕和美妙的音响几乎让我震撼不已。直到今天，我仍然觉得动画电影是一种特别的东西。\n\
    \n我在10岁时痴迷于成为动画师，那时我看到了由Bob Godfrey主持的电视节目 *《自己动手制作电影动画秀》*。如果说有谁让我与动画结缘（或该为此负责），那就是Bob。能与他共事，并被他视为朋友，真是太好了。其他给我带来巨大启发的人还有\n\
    \n"
