    为进一步验证运动规划算法的有效性，本文以某典型搬运任务为例，进行了仿真实验。仿真环境中的机械臂模型如图 1 所示。通过仿真获得了末端执行器的位置、速度随时间变化的曲线，结果表明末端轨迹平滑连续，满足作业要求。


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_200_0.png)


    The arm should be re-drawn so that it ‘flows’ with the movement. Achieving a graceful
    movement as the arm moves into a resting position may require the bending of joints
    into impossible positions. This way of achieving fluidity by ‘cheating’ is often
    called ‘the breaking of joints’. Imagine that the arm is a length of rubber hose
    and will flow through the movement initiated by the hand. This will look fluid
    but will also look odd, as though it’s lost the elbow and the wrist joint. To
    make it more convincing, take this piece of animation but add the elbow and the
    wrist joint to it. Bend the elbow or wrist joint in such a way that it follows
    the general bend of our rubbery arm. Don’t worry that the joints do something
    impossible. As long as the arm moves nicely, it doesn’t matter!


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_201_0.png)


    You can take this idea further when any of the limbs are moving at a very fast
    speed. The arms can lose their joints altogether and even be distorted along the
    length of the movement to suggest speed. This is referred to as ‘smearing’.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_201_1.png)


    When somebody points, the finger doing the pointing will go slightly beyond its
    final resting position. You could even lose the joint and make the arm perfectly
    straight at the most extreme position, or even try stretching the arm as well.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_203_0.png)


    When a head moves from one side to another, it will go slightly beyond its final
    resting position and then move back to a stop. The hair continues to move, as
    do the jowls, earrings and any other loose items. The hair, being lighter, will
    go further beyond the stopping position; the earrings, being heavier and more
    solid, will not go as far. The jowls will only go beyond their resting position
    a small amount before coming to a stop. Both the hair and the jowls will come
    back to a final resting position but at slightly different times, with the hair
    coming to a stop last.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_203_1.png)


    Drapery will move beyond the character''s final resting position and then flow
    back to a graceful stop.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_204_0.png)


    Making parts of your character come to a stop at different times always improves
    your animation.


    ## Vibration


    When we have a stiff object that can show a small amount of flexibility, like
    an arrow, a plank of wood or a fishing rod, we will get a certain amount of vibration
    with its follow-through and overlapping action.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_204_1.png)


    The stick is going to move forwards in an arc to an angle that is a mirror image
    of the first position. This is key 2 and will be at frame 17.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_206_0.png)


    Bring the stick back to the same position as key 1 (this is the third key position
    and will be at frame 33). Draw the stick at the same position as key 2 for the
    fourth key position (this is at frame 49). Finally, draw the stick at the same
    position as key 1 for key position 5 (this is at frame 65). Have a look at ‘stick_2D.keys.avi’
    in Chapter 4 on the website to get the idea.


    In-between the key positions by accelerating out of one key position and decelerating
    into the next.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_206_1.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_206_2.png)


    Have a look at ‘stick_2D.avi’, Chapter 4 on the website. This is the stick waving
    backwards and forwards.


    Now animate the string as straight-ahead animation, drawing on top of your stick
    drawings. Start with the string hanging down from the end of the stick on frame
    1. As the stick moves forwards to the next drawing, the string will be pulled
    through the air and will follow through the shape of the previous drawing.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_207_0.png)


    When the string reaches the second key position (the point where the stick comes
    to the end of its arc), the string will keep going forwards and be pulled in the
    opposite direction as the stick moves back through its arc.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_207_1.png)


    When the stick reaches the end of the second arc (key position 3), the string
    will keep going forwards and then be pulled in the opposite direction as the stick
    moves back through its arc.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_208_0.png)


    When the stick reaches the end of the third arc (key position 4), the string will
    keep going forwards and then be pulled in the opposite direction as the stick
    moves back through its arc.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_208_1.png)


    ## The Stick and String Exercise in Maya


    ### Building the Stick and String in Maya


    Make the View panel Front. Create a polygon cylinder by clicking the Polygonal
    Cylinder button at the top of the screen, or by going to the main menu and clicking
    Create > Polygon Primitives > Cylinder.


    In the Channel Box, rename ‘polyCylinder1’ to ‘stick’. Under Inputs, click ‘polyCylinder1’
    and the Input boxes will open up. Make Radius 0.4, Height 16, Subdivisions Axis
    20, Subdivisions Height 1 and Subdivisions Caps 1.


    Create a second polygon cylinder and call it ‘string’. Make it Radius 0.1, Height
    16, Subdivisions Axis 20, Subdivisions Height 16 and Subdivisions Caps 1.


    Rotate ‘string’ 90 degrees in Z and move it 9 units in Y and −8 units in X. This
    will put it 1 unit higher up than the stick.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_210_0.png)


    Now we need to put some joints through the ‘stick’ and ‘string’ and ‘bind’ them
    together. Go into animation mode by selecting Animation from the dropdown menu
    in the Modes box. Open up the Hypergraph (on the main menu, select Window > Hypergraph).
    This will help when selecting different parts of the skeleton and the stick and
    string. Click the Snap to grids button and then click the Click to place IK joint
    button or go to the main menu and click Skeleton > Joint Tool. Click at the center
    of the top of ‘stick’ and then at the center of the top of ‘string’. Press Enter
    on your keyboard to leave Joint Tool mode. This will put a joint up through the
    stick. Select


    Next we need to parent the joints in the string to the joints in the stick. In
    the Hypergraph, select ‘joint3’ and then middle-click it, drag it to ‘joint2’,
    and let go of the mouse button. You should now have a line linking ‘joint2’ to
    ‘joint3’.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_212_0.png)


    Test your model by selecting (clicking) the joints and rotating them (don’t move
    them; this will distort the model). After you’ve tested each joint, put the stick
    and string back to their original positions. Do this by going to the main menu
    and clicking Skin > Go to Bind Pose. The stick and string will return to the pose
    they were in when they were first bound to the joints.


    ### Animating the Stick and String in Maya


    Get out your drawn animation. The first thing we need to do is to set the keys
    for the waving of the stick.


    Open the Preferences window by clicking the Animation Preferences button at the
    bottom of the screen or, in the main menu, clicking Window > Settings/Preferences
    > Preferences. Select Settings from the Categories list and, in Working Units,
    set the Time to ‘PAL (25fps)’ from the dropdown menu.


    The scene is 100 frames long, so make sure the End Time box is set to 100 (this
    is the default setting, so you may not have to do anything).


    - Move the Time Slider to frame 1 and select ‘joint1’ (the joint in the stick)
    and rotate the joint in Z by 35 degrees (in the Channel Box, in the Rotate Z box
    type 35). Set a key position by pressing S on your keyboard. Move the Time Slider
    to frame 17 and set the second key position to a rotation of −35 degrees. Move
    the Time Slider to frame 33 and set the third key position to a rotation of 35
    degrees. Move the Time Slider to frame 43 and set the fourth key position to a
    rotation of −35 degrees. Move the Time Slider to frame 65 and set the fifth key
    position to a rotation of 35 degrees.


    Make a Playblast of your animation (Window > Playblast) and then take a look at
    ‘stick_3D_keys.avi’, Chapter 4 on the website. You now have a waving stick with
    a stiff piece of string.

