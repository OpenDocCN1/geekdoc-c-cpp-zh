    because the quality of animation required is not as high as for the main characters.


    ## Exercises


    ### The Double Acting Exercise in 2D


    Have two characters in a scene side by side. One of the characters attracts the
    attention of the other. The other character then reacts. The characters could
    be sat at a bar, standing at a bus stop, sat on a park bench, waiting in a queue,
    arm wrestling or anything else. Some possible situations are as follows:


    - 1. Have the passive character occupied with something – reading a book, newspaper
    or poster, cleaning their glasses or listening to music. Have another character
    trying to get their attention.

    - 2. One of the characters sees something off screen and tries to get the other
    character to look at it.

    - 3. One character asks the other character for something – the time, some change,
    a match or directions.


    When animating two characters interacting with each other, always animate the
    character that initiates the action first and then animate the character that
    reacts. Keep each of these characters on different pieces of paper. This means
    that if you need to change the timing of one of your characters you only have
    to re-draw that character.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_406_0.png)


    ### Animating It


    The first thing to do is to write down what is going to happen in the scene. Then
    draw some thumbnail sketches and shoot them to get an idea of the timing. In this
    little scenario we have two characters on a park bench. The first character is
    sitting staring into the distance and then glances


    Then, when the attention goes back to the first character, work out the key positions
    for the first character.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_410_0.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_410_1.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_410_2.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_410_3.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_410_4.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_410_5.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_410_6.png)


    ## Recording and Breaking Down a Dialog Track


    In order to animate a piece of lip-sync, it helps if you first record your dialog
    (you can take advantage of the dialog to help with your timing and characterization).


    Record a piece of dialog or take a section from a feature film, television show,
    radio show or CD. You can even download .wav files from the Internet.


    If you are recording your own dialog or don''t have the sound file on your computer,
    the simplest way to get it onto the computer is to use the Sound Recorder application.
    Locate the ‘Programs’ folder on your computer, find the ‘Accessories’ folder and
    open Sound Recorder (this may be in a further folder called ‘Entertainment’, depending
    on your operating system). Connect the ‘audio out’ socket of a video recorder,
    mini-disk player, CD player or microphone to the microphone socket on your computer.
    Press play on your sound equipment or speak into the microphone, and press the
    Record button on Sound Recorder. Save the sound as a .wav file.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_413_0.png)


    Sound Recorder does not give the best sound quality and you may want to try a
    specific sound recording program. There are lots of programs for recording and
    editing sound available in either shareware or demo versions on the Internet.
    You may even have one that came with your sound card.


    Budget allowing, the best thing to do is to hire a sound studio and record an
    actor, but this can work out to be very expensive. Alternatively, you could buy
    or hire a portable sound recorder. A company called Zoom make some very impressive
    professional sound recorders at a very reasonable cost.


    I’ve included two pieces of dialog on the website in the ‘sounds’ folder in Chapter
    12. They are called ‘hello.wav’ and ‘moment.wav’.


    Once you’ve got your dialog, you need to break it down. That is, you need to work
    out, frame by frame, where each sound of your piece of dialog occurs during the
    scene that you are animating. This then needs to be marked onto the sound column
    of an X-sheet.


    DigiCel FlipBook can be used to break your sound track down. In fact, you can
    use any program that divides up your sound track into units of 24 frames per second
    for film, 25 frames per second for PAL or 30 frames per second for NTSC.


    It’s best to record your dialog in short pieces (the length of a scene, say, or
    one person talking) rather than the entire movie at once. This will give you more
    freedom when it comes to editing your movie. Trim your dialog to the correct length
    and save what you’ve recorded as a .wav file.


    Now open up DigiCel FlipBook and import your sound track onto an X-sheet (right
    click on Sound on the X-sheet and in the Sound Properties window click Change;
    find your .wav file and click OK; the sound will now be loaded into the sound
    column). Scrub through the sound slowly and mark onto a paper X-sheet the frames
    where each of the sounds of the dialog start and end.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_414_0.png)


    When breaking down a sound track I always play the dialog through a few times
    and write what is said at the top of my paper X-Sheet. When I’m scrubbing through
    the dialog slowly the first thing I listen for is the silences. These occur between
    some words and where there are the sounds produced by the consonants that occur
    when the mouth is shut (‘M’, ‘B’, ‘P’, ‘F’ and ‘V’). Little sound comes out of
    the mouth when these consonants are spoken and the sound track is quiet or silent
    at these points.


    Then I listen for the ‘S’ sounds in the dialog, which tend to sound like a “shhh”
    or hissing sound. If the hissing sound lasts for three frames, mark it down on
    your X-sheet for three frames. Keep scrubbing backwards and forwards through your
    dialog. The next sounds to listen for are ‘T’ and ‘C’. ‘T’ makes a ‘tut’ kind
    of sound and ‘C’ makes a ‘kar’ sound. Next listen out for the consonants at the
    start of each of the syllables of each of the words.


    Once these are done, all that remain is the vowels. Listen for the loudest ones
    first. These will generally be the vowels that are spoken with the mouth wide
    open (jaw dropped). ‘A’ and ‘O’ are the loudest of the vowels and ‘I’ and ‘E’
    tend to be quieter because the mouth is less open and less sound can come out
    of the mouth as a result.


    shapes, concentrate on hitting the mouth-shut consonants and the large vowels.
    The rest of the mouth shapes can be regarded as in-betweens.


    ## Acting with Dialog


    When animating a scene with dialog, it’s always best to leave the mouth shapes
    until last and concentrate on the body language and facial expressions first!


    Listen to the dialog over and over. It’s probably best to do this via headphones
    if you don’t want to drive everybody in the room crazy by playing the same track
    over and over. Act out the dialog as you play it. Watch yourself in a mirror.
    Listen to the piece of dialog until you’re sick of it. It’s at this point that
    you start living it! You’ll notice that there are certain words that are the main
    emphasis points. At each of these emphasis points, your character should be put
    into a suitable pose. This technique is called ‘phrasing’. You can divide your
    animation up into major emphasis points and minor emphasis points. The major ones
    involve a movement of the body whereas the minor ones perhaps only involve a movement
    of the head. Use the information in Chapters 9–11 to work out the key poses that
    are appropriate for your dialog.


    If a character says ‘hello [pause] how are you?’, the two major emphasis points
    are ‘hello’ and ‘how’. The character could lean forwards as he says ‘hello’ and
    then put his head to one side to say ‘how are you?’. Within this movement you
    can put in a minor emphasis point on the ‘you’ at the end of the dialog. So, the
    head has been put on one side to say ‘how are’ and then nods on ‘you?’ while the
    body stays in the same position. There would also need to be small anticipation
    positions out of, and overshoot positions into, each of these poses (see the 2D
    animation exercise below for a full description).


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_416_0.png)

