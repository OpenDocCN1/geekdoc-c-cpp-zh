    # Eight Basic Efforts


    Laban movement theory divides movement into eight basic ‘efforts’. One way to
    give the scene you are animating more depth is to determine which of these efforts
    applies to the personality of your character and the situation that they are in
    within the scene. Then have a go at physically doing these efforts yourself. Subconsciously
    you will take on board the movement required to do these efforts and this will
    be reflected in your animation.


    It would be a good idea to practise each of these following movements, individually
    and in combination, just so you get a feel for them.


    # Pressing


    This movement is direct, sustained and strong. It could be pushing or pulling
    something, or lifting or leading something. It suggests a character that is determined
    and indefatigable. This movement could be applied to a determined person who has
    a definite goal.


    # Flicking


    This movement is flexible, sudden and light. It could be delicate movements of
    any part of the body, for example flicking dust off clothes or suddenly moving
    the head round to something that is heard. This perhaps suggests a more nervous
    person, twitching and reacting suddenly to things that happen to them.


    # Wringing


    This movement is flexible, sustained and strong. It can be a movement such as
    wringing out wet clothes but could also be interpreted as gut-churning internal
    emotions within somebody who is frightened or embarrassed. This suggests somebody
    in inner turmoil or somebody who is worried about something.


    # Dabbing


    This movement is direct, sudden and light, a bit like flicking but with a directness
    to it. An example is poking somebody on the shoulder to get his or her attention.
    This movement could be applied to a busybody-type person, bossing other people
    around.


    # Slashing


    This movement is sudden, strong and flexible. Imagine slashing a sword in all
    directions or whirling the arms about to escape from something. This movement
    could be applied to an angry person who is annoyed by everything and anything.


    # Gliding


    This movement is sustained, light and direct. One example could be a butler gliding
    silently into a room, very confident and aloof. The movement has a definite direction
    to it. This movement could'
