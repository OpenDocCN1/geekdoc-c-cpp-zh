    # Overview of How to Build and Rig a Simple 3D Character


    This character is built and ready and waiting for you to animate it. Have a look
    in the folder “man_models” in Chapter 3 folder on the website. However, if you
    want to have a go at building him (and doing so will give you a better idea of
    how to animate him later), following are some basic instructions. There are lots
    of ways to build and rig a 3D animated character. I have deliberately kept him
    very simple so that he is easy for a beginner to build.


    A 3D character’s skeleton will consist of a series of bones (or joints) that are
    linked together and rotate in relationship to each other (you will hardly ever
    move or translate these bones). These will, in turn, move the skin (or envelope)
    that surrounds them. The bones need to be linked to the skin. There are several
    ways of doing this, two of which are the ‘skin and bones’ and ‘child of the joint’
    methods.


    # Skin and Bones


    The most sophisticated way of constructing a character is to build a complete
    skin and then insert bones within it and link them to the skin. This is referred
    to as ‘skinning’ or ‘enveloping’. You then need to modify the skin so that different
    parts of it move correctly in relation to the bones. This is achieved by ‘weighting’.
    All 3D animation programs have slightly different ways of weighting a character.
    The basic idea is that you select points on the surface of the skin and assign
    them a differing degree of influence, depending on how each part of the skin should
    move in relation to the'
