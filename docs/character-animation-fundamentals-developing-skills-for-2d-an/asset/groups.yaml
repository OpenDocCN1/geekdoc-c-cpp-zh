    # Rolling


    Place the first five drawings of the sequence onto the peg bar with drawing 1
    at the bottom and drawing 9 at the top. Interleave each of these drawings between
    the fingers of your left hand. You can only ever roll with five drawings.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_42_0.png)


    Fold all the drawings towards you and look at drawing 1. By moving your little
    finger forwards, allow drawing 3 to fall flat over drawing 1 and look at this.
    Let drawing 5 fall flat over drawing 3. Look at this. Let drawing 7 fall flat
    over drawing 5. Look at this. Lastly, allow drawing 9 to fall flat onto drawing
    7 and look at this. Bring your hand back and repeat the process. Make sure your
    fingers stay interleaved with the paper at all times. When this is done in quick
    succession, you will see the ball falling from the top left of the page and hitting
    the ground, accelerating as it falls. You are now rolling. (See “raging.avi” in
    movies001, Chapter 1 on the website.)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_42_1.png)'
  - '[PAGE 43]


    Complete the exercise by in-betweening drawings 11 to 21. Below is the timing
