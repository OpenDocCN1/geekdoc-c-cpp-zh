    The arm should be re-drawn so that it ‘flows’ with the movement. Achieving a graceful
    movement as the arm moves into a resting position may require the bending of joints
    into impossible positions. This way of achieving fluidity by ‘cheating’ is often
    called ‘the breaking of joints’. Imagine that the arm is a length of rubber hose
    and will flow through the movement initiated by the hand. This will look fluid
    but will also look odd, as though it’s lost the elbow and the wrist joint. To
    make it more convincing, take this piece of animation but add the elbow and the
    wrist joint to it. Bend the elbow or wrist joint in such a way that it follows
    the general bend of our rubbery arm. Don’t worry that the joints do something
    impossible. As long as the arm moves nicely, it doesn’t matter!


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_201_0.png)


    You can take this idea further when any of the limbs are moving at a very fast
    speed. The arms can lose their joints altogether and even be distorted along the
    length of the movement to suggest speed. This is referred to as ‘smearing’.


