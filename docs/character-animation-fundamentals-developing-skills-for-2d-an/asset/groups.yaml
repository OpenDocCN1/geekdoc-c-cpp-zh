    # The Dive Exercise in Maya


    Open `mayaman.mb`. We’ll be doing most of the animation from the **Front** view
    panel, so enlarge this (hover the mouse pointer over this view panel and then
    press the space bar on your keyboard quickly).


    # Building the Background in Maya


    To create the cliff the man stands on, make a polygon cube by clicking the **Polygonal
    Cube** button (or go to the main menu and select **Create > Polygon Primitives
    > Cube**). In the **Inputs** section of the Channel Box, make the cube 40 units
    in width, height and depth. Translate it −14 in X and −20 in Y. Give it the name
    ‘cliff’. Your man should now be standing on top of your cliff.


    To create the sea for the man to dive into, create another cube and give it a
    width of 160, a height of 0.1 and depth of 160. Translate it 46 in X and −40 in
    Y. Give it the name ‘sea’.


    To make the diving board, create a cube and give it a width of 28, a height 0.5
    and a depth of 8. Set **Subdivisions Width** to 8. Translate it 20 in X and −15
    in Y. Save object as ‘diving_board’.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_232_0.png)'
