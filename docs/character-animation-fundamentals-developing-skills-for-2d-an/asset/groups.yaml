    # ## Weight and Balance


    For your audience to believe that your character is a living, breathing being
    (rather than graphite scraped onto paper or a collection of pixels on a screen),
    you need to follow a few basic rules. Two of these are: give your character weight
    and ensure your character is balanced correctly.


    # ## Gravity


    Assuming we are animating a character on planet Earth, the first thing it has
    to deal with is gravity. In the same way that our bouncy ball falls to the ground
    and bounces when rolled off the roof, so our character will fall to the ground
    and bounce (though rather less) if it jumps off the roof. Similarly, if the character
    jumps into the air, this takes effort and will always result in the character
    falling back to earth.


    Every object (including our character) has a center of gravity. With our ball
    this would be in the exact center. With a character it will be roughly at the
    bottom of the rib cage (about the center of the body). If the object or character
    is taller, the center of gravity will be higher. If the character is shorter,
    the center of gravity will be lower.


    A character''s center of gravity is not always in the same place. It will change
    position as the character changes its body posture.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_132_0.png)


    # ## Balance


    The stability of an object is affected by its shape. The wider the base, the more
    stable it will be. For example, a cube is a very stable object. It is difficult
    to push over or roll down a slope.


    A ball, on the other hand, is much less stable. It is easy to push along or roll
    down a slope. Because of this instability, it is much more susceptible to the
    forces of gravity.


