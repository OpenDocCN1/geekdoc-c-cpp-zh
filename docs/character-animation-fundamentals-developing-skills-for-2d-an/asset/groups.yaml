    \  - 工作实践，5–11，25–7\n\n## 培养2D和3D角色动画技能\n\n## 对史蒂夫·罗伯茨《3D角色动画》的以往好评\n\n> “终于！这是一本关于3D动画原理的权威著作，出自一位经验丰富的传统动画师之手。史蒂夫·罗伯茨将他教授动画基本技巧的丰富知识融入了这本必备参考书中——任何想要在CG动画领域有所作为的人都需要这本书。”\n\
    >\n> — 迈克·米尔恩博士，计算机动画总监，Framestore CFC\n\n> “对基本动画原理的理解在3D计算机动画中常常被忽视……这一必备知识来源将使2D和3D动画师能够理解彼此的意图。”\n\
    >\n> — 丹尼尔·格里夫斯，奥斯卡获奖动画师，Tandem Films 总监\n\n将行业最佳实践应用到自己的工作流程中，轻松开发2D、3D和混合角色。2D和3D角色设计的并排比较将帮助你改进角色动画，并掌握包括重量与平衡、时间控制和走路在内的传统原理与流程。创作受人类、鸟类、鱼类、蛇类和四足动物启发的角色——通过表演、口型同步和面部表情等章节，赋予它们生命，塑造它们的个性。\n\
    \n按照突出 Maya 和 3D Studio Max 工作流程的分步教程，将核心动画技术熟练地与你选择的软件集成。针对独特项目调整角色设计技巧、诀窍和技术，包括用于转描和动作捕捉的角色设计。借助配套网站\
    \ www.characteranimation.com，超越2D和3D角色动画的基础，该网站包含简短演示、视频、2D和3D练习以及完全绑定的角色模型。\n\
    \n## 特色：\n\n- 通过并排比较2D和3D走路循环、时间控制、平衡和面部表情，在学习如何轻松开发和设计2D和3D角色的同时，扩充你的动画工具集并丰富你的简历\n\
    - 通过实用的动手示例以及关于 Maya 和 3D Studio Max 的分步教程（可在 www.characteranimation.com 和 YouTube.com/characteranimation\
    \ 获取），超越书本的局限\n- 通过关于动作捕捉和转描角色设计的新内容，探索角色动画的新趋势，并掌握基本技术\n\n史蒂夫·罗伯茨在其30年职业生涯中，为数百位客户创作并执导了获奖影片。他是伦敦中央圣马丁艺术与设计学院的角色动画高级讲师。\n\
    \n**用户级别：** 初级–中级\n\n"
