    X-sheet 也被称为摄影表（dope sheets）或曝光表（exposure sheets）。动画师使用它来记录与动画拍摄方式相关的所有必要信息。标准
    X-sheet 由若干从上到下的列和100行从左到右的行组成（图示为50行）。每一行代表动画的一帧。如果动画以每秒25帧的速度播放，100帧将相当于4秒的动画（在所示的
    X-sheet 上则为2秒）。


    X-sheet 上的各列用途如下。


    ## 声音


    此列包含与动画相关的声音。通常是角色所说的话语。在动画制作中，对白是先录制的。然后进行“分解”。也就是说，通常由剪辑师逐帧检查音轨，确定每个单词的起止位置，以及每个主要元音和辅音的位置。然后逐帧标记在
    X-sheet 的声音列中。这样你就能知道场景中某一帧发出了特定声音。


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_27_0.png)


    ## 图层


    这些列显示图层的放置顺序：背景位于最底层（X-sheet 上的右侧），前景位于最顶层（X-sheet 上的左侧），角色位于中间。


    每张画稿都有自己的编号。每个单位代表一帧。插入画稿编号是为了表示该帧动画在序列中的位置。这会根据每张画稿所代表的每秒帧数而变化。右侧示例显示了一个以“一拍二”方式拍摄的序列；也就是说，每张画稿拍摄两帧。当采用“一拍二”时，第一行有编号，第二行留空。不需要填满每一帧。在序列末尾，最后一张画稿保持10帧；也就是说，该画稿拍摄10帧。这通过从画稿编号底部延伸到保持的最后一帧的线条来表示。如果画稿保持超过两帧，则需要插入线条以显示画稿保持的时间长度。


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_29_0.png)


    动画序列中，即使只有单个角色，一帧动画的画稿也可能分布在几层纸上。如果序列中身体保持不动，而头部和手臂在运动，那么整个序列只需要一张身体画稿。如果头部的运动速度与手臂不同，头部会放在单独的纸上，手臂则放在另一张纸上。例如，如果有背景且角色站在树前，这些同样要分开画在单独的纸上。无论最终画稿多么精确，如果需要重复描摹同一张图画20次或更多（例如带有树的背景），画稿之间会产生差异，在播放动画时会显现出来。这也不必要地浪费时间。在计算机出现之前，完成的画稿会被描摹并着色到赛璐璐片（Cel，即醋酸纤维素或透明塑料片）上。这样最多只能有六个图层，否则赛璐璐片的厚度会使下方图层的颜色显得浑浊。如今，每个图层都会被单独上色，然后用
    DigiCel FlipBook 或 Toon Boom 等程序合成。这样可以拥有无限图层，且没有任何质量损失。


