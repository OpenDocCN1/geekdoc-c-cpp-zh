    <!-- no content -->'
  - '[PAGE 195]


    # Follow-Through of Inanimate Objects


    This is the animation of hair, manes, coat tails, ties, sleeves, strings, general
    drapery, and so on. Generally, inanimate objects connected to your character will
    follow a path similar to the part of the character they are attached to. Depending
    on the size and flexibility of the object, it will flap out from the end of this
    path to varying degrees.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_195_0.png)


    Depending on the ‘stiffness’ of the object, you will get a slightly different
    type of follow-through. Generally a piece of drapery will demonstrate a wave running
    along its length as it is pulled through the air. At its most simple, this is
    like a flag cycle. See `flag_cycle.avi`, Chapter 4 on the website.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_195_1.png)'
  - '[PAGE 196]


    A flag cycle consists of a piece of cloth that has a wave running through it.
    Each crest of the wave on one drawing becomes the crest of the wave on the next
    drawing. The first key drawing (number 5) is the mirror image of the first key
    position (number 1) and the fourth key drawing (number 13) is the mirror image
    of the second key drawing. These key drawings need in-betweening. You should shoot
    these drawings as follows: 1, 3, 5, 7, 9, 11, 13, 15, 1, 3, 5, 7, 9, 11, 13, 15,
    etc.


    Imagine a piece of cloth being pulled through the air. The cloth will drag behind
    the point where it is being held by the hand, falling outwards at the end. If
    the hand slows down or stops, the cloth will catch up with the hand and start
    to move ahead.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_196_0.png)


    A piece of string or rope will act in a similar way but, because it has greater
    flexibility than a piece of cloth, it will fall out of the path set by the character
    to a larger degree.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_196_1.png)'
  - '[PAGE 197]


    A steel chain will do something similar but will always be affected by its weight,
    falling faster but not swinging as far.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_197_0.png)


    If the object holding the cloth speeds up, the cloth straightens as it is left
    behind. Just give it a very tight wave running along its length.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_197_1.png)'
  - '[PAGE 198]


    <!-- no content -->'
  - '[PAGE 199]


    In the same way that a piece of string will, to a certain extent, follow a path
    led by the part of the body that initiates the movement, the same will happen
    with the tail. This time the movement is led by the animal’s bottom.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_199_0.png)


    Occasionally the animal will initiate a slight movement through the tail itself.
    So, for most of the time the tail will follow a cycle but occasionally it will
    give a twitch and do something slightly different. The tail will then return to
    the cycle.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_199_1.png)


    Think about how much of the tail will be following through and how much is initiated
    from within. Some of the movement results from the animal’s bottom moving and
    some results from the animal moving its tail.


    Ears move slightly differently. As with the tail, the make-up of the ear varies
    from animal to animal. This affects the movement during follow-through. With dogs
    ears, for example, a spaniel’s ears will move in a much more floppy way than a
    terrier’s ears. This is because a spaniel’s ears are larger and softer and a terrier’s
    ears are shorter and stiffer.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_199_2.png)'
