  - '[PAGE 34]


    ‘Key drawings’, also referred to as ‘keys’, are important drawings that sum up
    the essence of the action during a scene.


    In key-to-key animation, ‘key positions’ or ‘poses’ in a sequence are drawn before
    completing the sections between them (‘in-betweens’). I always like to think of
    the key positions as the plot or a précis of a scene. They give a rough overall
    feel of the animation. The in-between drawings provide the characterisation or
    detail.


    Animating key-to-key allows for a large degree of control over your animation.
    It can prevent the character or object from changing size or distorting where
    you don’t want it to. It also means you have control over the timing of your animation
    and can more easily predict what action will happen when and where. By line testing
    the keys you can see the basic movement of a sequence before completing the full
    animation.


    In the end, though, all the frames of your animation are important and if you
    put too much emphasis on the key positions the animation can look clunky and stiff.


    Below is an example of key-to-key animation. In this example, a man sits at a
    table with a glass of liquid on it. He picks up the glass and drinks from it.


    +   - Key number 1 – He looks at the glass.

    +   - Key number 2 – He grasps the glass in his hand.

    +   - Key number 3 – He raises the glass to his lips.

    +   - Key number 4 – He tips the contents of the glass into his mouth.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_34_0.png)'
