    # Motion Capture (Mocap)


    Motion capture, mocap and motion tracking are terms used to describe the process
    of recording action and transposing these actions onto a computer-generated model.
    The technique can be used in medical applications, entertainment and sports analysis.
    In movie making, it refers to recording the movement of human actors and using
    that information to animate computer character models in 3D or 2D digital animation.


    During a motion capture session, the movements of an actor are sampled many times
    per second, but only the movement – not the way a person looks. Consequently,
    the movement of a human actor can be used as the action of an animal or fantasy
    creature.


    The main strength of motion capture is that it can turn out a lot of very realistic
    movement very quickly. However, the quality of the movement is only as good as
    the actor doing the moving. The actor has to take into account the fact that the
    model they are moving may be a totally different shape to the actor, otherwise
    parts of the model’s body can intersect other parts. These are referred to as
    ‘artefacts’. Usually most motion capture requires some cleaning up and fixing
    by an animator afterwards to make it more believable to an audience. Anticipation,
    overshoot, squash and stretch and other cartoon effects have to be added later
    by an animator. It can also be very expensive to set up a motion capture studio
    (although there are now some affordable options available).


    There are two main ways of doing motion capture: via optical systems and via non-optical
    systems.


    # Optical Systems


    This is where the actor dresses in a suit with lots of special markers on it and
    cameras arranged around a large room register the movement of the markers. This
    data can then be applied to the model in the computer program. Obviously all of
    these cameras, a large room to put them in and all the data crunching software
    add up to a very big outlay before you have produced any animation at all (way
    out of the scope of individual animators and small animation studios).


    # Non-Optical Systems


    This is where the movements of the actors are detected mechanically either by
    gyros or potentiometers (complex switches). Usually these are arranged in a suit
    or on an exoskeleton that has sensors attached to it. These sensors then send
    the data to a computer either through wires or wirelessly.'
  md: '

    When thumb and all the fingertips of each hand are pressed together and the hands
    are held upright, this gives an impression of superiority. It is usually done
    when the character is talking or, more accurately, pontificating. It''s a bit
    smug and suggests that the character is a ''know it all''. When somebody is listening
    attentively to something, the thumbs and fingertips can be pressed together but
    the hands will be held downwards.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_314_0.png)


    Rubbing the thumb and fingers together suggests money!


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_314_1.png)


    ## Arm Crossing


    Hiding behind something is a way of protecting ourselves. If a character crosses
    their arms in front of them it''s as if they are hiding behind their crossed arms.
    They may do this because they disagree with something that has been said or are
    not comfortable with the situation they are presented with.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_316_0.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_316_1.png)


    Clenching the fists while crossing the arms gives a hostile signal.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_316_2.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_316_3.png)


    Gripping the arms tightly with the hands while the arms are crossed suggests nervousness
    and stress.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_316_4.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_316_5.png)


    Partially crossing the arms shows a lack of confidence (e.g. in a situation where
    the character is with a lot of strange people).


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_317_0.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_317_1.png)


    Crossing the arms at the hands suggests humility.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_317_2.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_317_3.png)


    ## Leg Crossing


    Leg crossing gives off a similar signal to arm crossing but is far less strong.
    A basic crossing of the legs can give the impression of defensiveness, but could
    actually have been adopted by a person trying to make themselves comfortable.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_317_4.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_317_5.png)


    Combine a leg cross with an arm cross, a backwards body posture and a sour look
    on the face and you get a strong impression of displeasure.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_318_0.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_318_1.png)


    Crossing the leg with the heel at the knee gives a competitive, aggressive impression.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_318_2.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_318_3.png)


    Crossing the legs at the ankles gives a ''prim and proper'' look.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_318_4.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_318_5.png)


    When you''ve completed your thumbnails, shoot them with your line tester and play
    about with the timing. It doesn''t matter if the sizes of the character change
    - all you are doing is feeling your way through the scene.


    You can now re-draw the thumbnail sketches onto full-size paper, modifying them
    as you go along (alternatively, you could always blow them up on a photocopier).
    The idea is to retain the appearance of the thumbnails in your animation. Shoot
    these to the same rough timing as your original pose test with your thumbnails,
    making sure that nothing is bouncing about too much, for example feet touching
    the ground or hands touching the scenery. This test should consist of the major
    key positions.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_321_0.png)


    After this, sketch in the minor key positions (all the anticipations and overshoots)
    and some of the major in-between drawings (the breakdowns). Shoot it again. Keep
    flicking, flipping and rolling all the time.


    Generally, the way we move in both real life and when acting is to shift from
    one major pose to another. When we reach each of these poses we keep moving but
    make only minor movements. If you want to see a good example of this, just fast-forward
    a feature film and watch how the actor will move quickly from one position to
    another and then stay put for a short period of time.


