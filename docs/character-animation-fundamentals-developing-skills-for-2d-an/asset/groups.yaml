  - '[PAGE 360]


    # Sadness


    Sadness can range from disappointment through to crying with despair.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_360_0.png)


    The inner ends of the eyebrows will be raised and the outer ends lowered. This
    pushes the outer edge of the eye socket over the eyes. The upper eyelids may drop
    slightly. There will be concave furrows on the forehead.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_360_1.png)


    The corners of the mouth will be turned down, causing two furrows to run downwards
    from the nostrils to the chin via the corners of the mouth. The lower lip could
    be pushed upwards and outwards, increasing this downturn. This can be accompanied
    by a depression immediately under the lip. This is particularly apt for the face
    of a sad baby.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_360_2.png)'
