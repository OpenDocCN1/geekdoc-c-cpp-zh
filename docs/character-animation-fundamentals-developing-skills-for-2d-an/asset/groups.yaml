    # 7 *Using Track View in 3D Studio Max*


    Open up Track View by going to the main menu and selecting **Graph Editors > Track
    View > Open Track View – Curve Editor**. Select the curve from within the hierarchy
    tree (follow the path **Objects > Specific object > Transform > Position Rotation
    or Scale**).


    To get handles on a key point on a function curve, select the key point (right
    click) and up will come the Position window. Select the Handles buttons for both
    In and Out. Move the handle with the left mouse button. Only the Show Tangents
    and Move Keys buttons should be selected at the top of the Track View window.


    To break handles, click on the **Advanced** button and click **Lock** against
    X, Y or Z. Move handles with the left mouse button.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_56_0.png)


    # 8 *Creating a Preview in 3D Studio Max*


    Select a viewport, go to the main menu and click **Rendering** and then click
    **Make Preview** and up will come a panel with settings for various parameters
    such as start and end frames, size, frames per second etc. Click **Create** and
    an .avi movie will be rendered for you.


    # 9 *Hierarchies in 3D Studio Max*


    Open up Schematic View (on the main menu, **Graph Editors > Open Schematic View
    or New Schematic View**) and up will come the **Schematic View** window. Select
    an object (which will turn yellow) in Schematic View, then select the **Link**
    button (top left of the **Schematic View** window). Click and drag from the selected
    object to the object that you want to be the parent and let go. You should now
    have two linked objects. To unlink them select them both (click one object then
    select the other object with **Ctrl** pressed) and then click the **Unlink Selection**
    button (next to the Link button). The objects should now be unlinked.


    # 10 *Creating Objects and Putting Bones in them in 3D Studio Max*


    To make an object, go to the main menu and select **Create > Standard Primitives
    or Extended Primitives**.'
