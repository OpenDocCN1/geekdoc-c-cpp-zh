- pgno: 220
  md: 'When our diver takes off, distort him as far as you possibly can up to the
    apex of the jump. At the apex have him regain his original shape. These are the
    second and third key positions, which are at frames 9 and 13 with the breakdown
    on frame 11.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_220_0.png)


    The character will follow an arc through the air similarly to the balls we animated
    in Chapter 2. These are the third and fourth key positions, at frames 13 and 18,
    the breakdown being at frame 14.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_220_1.png)'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'As our diver falls, make him distort again in the direction of the fall before
    he hits the diving board. These are the fourth and fifth key positions, at frames
    18 and 24 with the breakdown at frame 22.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_221_0.png)


    The diving board will bend as it is hit. At this point it will move with the diver.
    These are the sixth and seventh key positions, at frames 25 and 31. The breakdown
    position is at frame 27. Diving board D5 goes with man M25, D7 goes with M27,
    D8 goes with M29 and D9 goes with M31.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_221_1.png)'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'After the diving board bends down, the diver bounces up from the board and
    is stretched along the second arc of his dive. These are the seventh and eighth
    key positions and are framed 31 and 35. The breakdown position is at 33. Diving
    board D9 goes with man M31, D8 goes with M33 and D4 goes with M35.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_222_0.png)


    At the apex of this arc, the character slows down and regains his shape. These
    are the eighth and ninth key positions, at frames 35 and 40, the breakdown position
    being at frame 36. D4 goes with M35, D1 goes with M36 and D1 goes with M40.


