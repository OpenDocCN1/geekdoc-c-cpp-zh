  md: "# Developing Skills for 2D and 3D Character Animation\n\n# Previous Praise\
    \ for Steve Roberts’ Character Animation in 3D\n\n> > “At last! A definitive work\
    \ on the principles of 3D animation, from a highly experienced, traditional animator.\
    \ Steve Roberts brings his substantial knowledge of teaching the fundamental techniques\
    \ of animation to this essential reference work—anyone who wants to make a career\
    \ in CG animation needs this book.”  \n> > — Dr. Mike Milne, Director of Computer\
    \ Animation, Framestore CFC\n\n> > “An understanding of basic animation principles\
    \ is often overlooked in 3D computer animation . . . this essential source of\
    \ knowledge will enable 2D and 3D animators to understand each other’s purpose.”\
    \  \n> > — Daniel Greaves, Oscar-Winning Animator, Director of Tandem Films\n\n\
    Apply the industry’s best practices to your own workflows and develop 2D, 3D and\
    \ hybrid characters with ease. Side-by-side comparisons of 2D and 3D character\
    \ design will help you improve your character animation and master traditional\
    \ principles and processes for topics including weight and balance, timing and\
    \ walks. Develop characters inspired by humans, birds, fish, snakes and four-legged\
    \ animals—breathe life into them and develop their personalities with chapters\
    \ on acting, lip-synching and facial expressions.\n\nExpertly integrate core animation\
    \ techniques with your software of choice following step-by-step tutorials that\
    \ highlight Maya and 3D Studio Max workflows. Adapt character design tips, tricks\
    \ and techniques for unique projects including character design for rotoscoping\
    \ and motion capture. Advance beyond the fundamentals of 2D and 3D character animation\
    \ with the companion website, www.characteranimation.com, which includes short\
    \ demonstrations, videos, 2D and 3D exercises and fully rigged character models.\n\
    \n# FEATURES:\n\n+   - Expand your animation toolset and résumé while learning\
    \ how to develop and design 2D and 3D characters with ease with side-by-side comparisons\
    \ of 2D and 3D walk cycles, timing, balance and facial expressions\n+   - Go beyond\
    \ the book with practical, hands-on examples and step-by-step tutorials on Maya\
    \ and 3D Studio Max, available at www.characteranimation.com and youtube/characteranimation\n\
    +   - Explore new trends in character animation with new content on motion capture\
    \ and rotoscopy character design and master the fundamental techniques\n\nSteve\
    \ Roberts has animated and directed award-winning films for hundreds of clients\
    \ during his 30 year career. He is a senior lecturer in character animation at\
    \ Central Saint Martins College of Art and Design.\n\n**USER LEVEL:** Beginner–Intermediate"
  merge: -1
