- pgno: 171
  md: 'When you click on an object, the numeric boxes tell you where its position
    is in relation to the center of the selected viewpoint. When you click and drag
    on the object, the numeric boxes tell you the movement of the object in relation
    to its original position. All the figures I will be quoting are in relation to
    the center of the object.


    # Setting the Key Positions in 3D Studio Max


    Click the Auto Key button at the bottom right of the screen. Make sure that the
    Time Slider is at frame 1. The first key frame should be set at frame 1 (make
    the position the same as at frame 1 of the drawn animation). Move your man into
    a position like the first key position of your drawn animation (or see the illustrations
    of the lift in the 2D section). Use a combination of selecting and rotating or
    moving the handles and selecting the individual bones or fins and rotating them
    (you should only rotate the bones; don’t select the skin of the man – you’ll end
    up with a skinless skeleton).


    For the first frame you will need to set keys manually for everything you move.
    So, when you have moved something, click the Set Key button (the one with the
    big key on it).


    When it comes to selecting the handles, you can select them in the viewpoint but
    selecting the bones is trickier. Open up Schematic View and you will see many
    nodes that relate to your man.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_171_0.png)


    You can select the bones individually in Schematic View by double clicking on
    them; however, finding them can be difficult! The large hierarchy is the skeleton
    of the man, so zoom into this (use the buttons at the bottom right of the Schematic
    View window) and select the bones you wish to rotate. You can use the Page Up
    and Page Down keys on your keyboard to move through the selection of the bones.)
    You could select the fins on the bones if you are using Max 201 and the model
    ‘maxman-fins.max’.'
