- pgno: 106
  md: '# Animating a 2D Soccer Ball


    Below is the rough trajectory for the soccer ball, showing the key positions.
    A soccer ball will undergo a certain amount of squash and stretch. As the ball
    hits the ground, it squashes. As it flies through the air, it stretches at the
    fastest point of each arc.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_106_0.png)


    Draw the 12 key positions of the soccer ball and capture them. Number each key
    by the drawing: 1, 2, 3, 4 etc. The sequence will be 120 frames long (in DigiCel,
    use the following settings: # of Frames: 120, Frame Rate: 25, and # of Levels:
    2). Play the keys back and adjust the frames until you are happy with the timing
    of the sequence (hold down Alt while clicking and dragging down). Use the illustration
    below for reference. Check out ''soccerball_keys.avi'', ''animations002, Chapter
    2'' on the website.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_106_1.png)'
  merge: -1
  img_proc: true
