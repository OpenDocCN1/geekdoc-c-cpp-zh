- pgno: 38
  md: 'Place a second sheet on top, using the peg bar to register it. Draw a squashed
    ball and label it drawing number 11. This is our second key drawing.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_38_0.png)


    Lastly, place a third sheet over the previous two and draw a ball at the top right-hand
    corner. Call this drawing number 17. This is our third and final key drawing.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_38_1.png)


    Remove drawing number 21. We will ‘in-between’ drawings 1–11. This means we will
    draw the drawings that go between 1 and 11.


    The first in-between we draw will be number 9. This is half way between numbers
    1 and 11. This may seem rather odd, but it will help give the impression of the
    ball speeding up as it hits the ground. If we look at the ‘timing chart’ (on page
    18), we see that, because the ball was at its slowest on the apex, there are more
    drawings and they are closer together at this point. As the ball falls out of
    the sky, the drawings get further and further apart. This is why the drawing half
    way between 1 and 11 is number 9.'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'The first drawing you do as an in-between is often referred to as a “breakdown
    drawing.” This is the major in-between.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_39_0.png)


    Timing charts (also known as breakdown guides, in-betweening guides, or telegraph
    poles) are used to show where the in-between drawings should be drawn. They are
    generally placed at the bottom of the key drawing and should relate to the drawings
    between that key and the next. They consist of a horizontal line with a vertical
    line at each end representing the key drawings. The “breakdown” (major in-between)
    drawings are indicated by a vertical line and by a couple of arcs between them
    and the key drawings. The remaining in-between drawings are represented by shorter
    vertical marks. The illustration (right) shows the breakdown guide for drawings
    1 to 11.


    Drawing 7 is half way between numbers 1 and 9, drawing 5 is half way between numbers
    1 and 7 and drawing 3 is half way between numbers 1 and 5.


    When we’re in-between our sequence, we need to ‘flick’ our drawings. Place drawing
    11 over drawing 1 with a


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_39_1.png)'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'clean sheet over them. Label this drawing number 9. Hold drawing 9 with your
    left thumb and forefinger. Slip your index finger underneath drawing 11. Leave
    drawing 1 flat on the light box.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_40_0.png)


    Now draw the ball on drawing 9. Remember the ball is moving through an arc and
    that it should be half way between the balls on drawings 1 and 11.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_40_1.png)


    In order to see how the ball is moving, fold back drawings 11 and 9 towards you
    (while still attached to the peg bar) and look at drawing 1.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_40_2.png)'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'Fold drawings 11 and 9 flat against the light box and look at drawing 9.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_41_0.png)


    Then fold drawing 9 up towards you and look at drawing 11.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_41_1.png)


    When this is done in quick succession, the ball will move along the arc. You are
    now ‘flicking’. Sometimes it helps to put a rubber band over the pins on the peg
    bar to stop the paper slipping off. If the ball in drawing 9 doesn’t appear to
    be in the correct position, rub it out and redraw it. Keep flicking and redrawing
    until it looks right. (See ‘flicking animation’ in movies001, Chapter 1 on the
    website)


    Repeat the ‘in-betweening’ process for drawing 7 (between drawings 1 and 9), drawing
    5 (between drawings 1 and 7) and drawing 3 (between drawings 1 and 5). Once you
    have drawn all these you can have a go at rolling.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# Rolling


    Place the first five drawings of the sequence onto the peg bar with drawing 1
    at the bottom and drawing 9 at the top. Interleave each of these drawings between
    the fingers of your left hand. You can only ever roll with five drawings.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_42_0.png)


    Fold all the drawings towards you and look at drawing 1. By moving your little
    finger forwards, allow drawing 3 to fall flat over drawing 1 and look at this.
    Let drawing 5 fall flat over drawing 3. Look at this. Let drawing 7 fall flat
    over drawing 5. Look at this. Lastly, allow drawing 9 to fall flat onto drawing
    7 and look at this. Bring your hand back and repeat the process. Make sure your
    fingers stay interleaved with the paper at all times. When this is done in quick
    succession, you will see the ball falling from the top left of the page and hitting
    the ground, accelerating as it falls. You are now rolling. (See “raging.avi” in
    movies001, Chapter 1 on the website.)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_42_1.png)'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'Complete the exercise by in-betweening drawings 11 to 21. Below is the timing
    chart for drawing 11, showing how you should in-between the drawings between numbers
    11 and 21.


    The X in the chart shows that the distance has been divided into three. The first
    in-between you will do is drawing 15. This is the breakdown drawing. It is one
    third closer to 21 and two thirds further away from 11. (The X is there to show
    the relative position of drawing 15.) The next drawing to do is number 17. This
    is half way between 15 and 21. Then do drawing 19. This is half way between 17
    and 21.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_43_0.png)


    There is no drawing at position X. The next drawing to do is number 13. This is
    half way between X and number 11. By using this spacing, the ball will accelerate
    from drawing 9 and decelerate as it reaches drawing 17. Make sure the ball follows
    the arc through the sequence. When you have completed all the drawings, have a
    go at flipping them. Pick up all the drawings you’ve animated with the first number
    at the bottom and the last at the top. Hold them up with your right hand and flip
    with your left.


    Finally, shoot the sequence with a line tester to see accurately how the animation
    moves. Each drawing should be shot for two frames. If you haven’t worked out how
    to use a line tester yet, never fear! I’m going to take you through how to use
    one in the next section. (See ‘ball_bounce.avi’ in animations001, Chapter 1 on
    the website.)


    # How to Use a Line Tester to Help Your Animation


    In the previous exercise we looked at the timing of a ball bouncing across the
    screen. Learning the timing for the key positions is one of the hardest things
    to do in animation. Using a line tester enables you to see how the timing is working
    and will hopefully help you to learn timing skills more quickly.


    For the next exercise we will make a ball drop into screen, fall straight to the
    ground and bounce a few times before coming to a halt.


    The first thing to do is to animate and shoot the key drawings on the line tester.
    The resulting movie is called a pose test or a key test. The number of frames
    that each of the key drawings is played back for can be adjusted on the X-sheet
    part of the program. When this is working satisfactorily, the drawings are marked
    onto a paper X-sheet and from this the timing for the in-between drawings is worked
    out. Work out timing charts for where the in-betweens will go. Do the in-betweens
    and finally shoot the entire sequence on the line tester.'
  merge: -1
  img_proc: true
