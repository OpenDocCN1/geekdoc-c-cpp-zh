  md: '> > Animators are fortunate: not for them the limitations of the theatrical
    stage or the many hazards of a live-action film location shoot! Their only limitations
    are their imaginations and the size of their checkbooks. With the cosmos at their
    disposal, plus all the colors and sounds in the universe, animation can be a daunting
    prospect! Small wonder some take up gardening or DIY. Steve Roberts (the first
    time I saw him was at Farnham''s Animation course – he was remaking *Snow White
    and the Seven Dwarfs* as a satire) is not easily daunted. He has written and illustrated
    a remarkable book that actually makes animation easy to understand. Using simple
    illustrations, he takes the reader through every situation they are likely to
    come across in their progress towards believable animation. The key to this book
    is *simplicity*. Keep it simple! Parting the Red Sea is perfect for Cecil B. DeMille.

    > >

    > > **Bob Godfrey MBE**'
