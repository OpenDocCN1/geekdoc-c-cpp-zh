- pgno: 149
  md: 'Between the seventh and eighth key positions (frames 53 and 61) the man comes
    back down to earth but the ball continues moving upwards, slowing at its apex
    (57 and 59).


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_149_0.png)


    Between the eighth and ninth key positions (frames 61 and 69) the ball falls to
    a resting point against the man''s tummy with the arms at full stretch. The ball
    comes out of its apex slowly (drawings 63 and 65), falls quickly (gap between
    65 and 67) and then slows into the next key (69). This slowing down is caused
    by the body moving upwards and the arms stretching slightly, with the body slowing
    to its highest point at key nine (69).


    Between the ninth and tenth key positions (frames 69 and 75) the man comes down
    to his final resting position, moving slowly out of key nine (the drawings between
    69 and 73 are closer together).


    Have a look at “lift_2D.avi”, Chapter 3 on the website.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_149_1.png)'
