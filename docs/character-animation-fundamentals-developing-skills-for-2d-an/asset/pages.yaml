- pgno: 309
  md: '2. When a character is bored, the body could be slumped or angled back with
    the head staring into space. The character may be fiddling with yawn, tapping
    their feet or fingers, doodling with a pen, or looking around for something interesting.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_309_0.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_309_1.png)


    3. When a character is sad or miserable, the body will be very slumped. The arms
    will hang lifeless. The head will be hung low. Everything will seem to be an effort
    and difficult to do.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_309_2.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_309_3.png)


    4. When a character is in denial, angle the body backwards and have the arms sweep
    across the body as if pushing something away. Have the hands form a fist or a
    pointing finger. Make the neck tense and hunch the shoulders.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_309_4.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_309_5.png)'
