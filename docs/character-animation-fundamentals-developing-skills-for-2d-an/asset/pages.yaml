- pgno: 312
  md: '5. When a character is listening to something that they disagree with they
    will partly cover their face with one hand, which could have a single upturned
    finger. The other arm will cross over the body. If seated, the legs will be crossed.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_312_0.png)


    # Palm, Hand, Arm and Leg Gestures


    The hands and arms play a crucial part in our communication with other people.
    The postures adopted by the legs reinforce these gestures.


    # Palm Gestures


    The palm can be used to suggest openness and honesty or the lack thereof. Honesty
    and submission are suggested by a character gesticulating with open palms facing
    upwards or away from the character’s body and towards the person to whom they
    are gesticulating. You will see this sort of palm signal when people are shrugging
    and when they are happy, eager, interested or contemplating something.


    Dishonesty and dominance are suggested by the palms being open but facing downwards
    or towards the character’s body. You will see this when people are defiant, bored,
    sad or annoyed. When you see the open body language associated with a responsive
    body posture but the palms are facing downwards or towards the character, something
    doesn’t seem quite right and you tend not to believe the character. This could
    suggest that the character is lying.


    The closing of the palm suggests anger and aggression or exaggerated dominance.
    You will see this form of display if somebody is aggressively pointing while talking
    or chopping the hand across the body. Examples of this type of palm signal will
    be seen when a character is angry, trying to put a point over, disagreeing with
    something or being argumentative.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_312_1.png)'
  merge: -1
  img_proc: true
