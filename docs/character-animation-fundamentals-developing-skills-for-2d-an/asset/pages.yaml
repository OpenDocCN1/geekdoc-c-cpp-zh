- pgno: 144
  md: 'The eighth key position is at frame 61. As the character starts descending
    towards the resting position, the ball keeps moving upwards. This is because the
    ball contains momentum from being picked up and wants to keep going.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_144_0.png)


    The ninth key position is at frame 69. Our character has moved up slightly from
    the last key position and the ball has fallen down against his legs.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_144_1.png)'
