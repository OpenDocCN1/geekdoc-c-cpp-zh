- pgno: 347
  md: 'If you want to make a model with complex topology, draw out the quads of the
    mesh first on your design and then create the mesh on top of your design in Maya
    or Max. It’s a good idea to create one mesh for the front of the body and one
    for the back and then join them together.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_347_0.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_347_1.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_347_2.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_347_3.png)


    Make the topology as simple as possible and construct it as parts that can be
    joined together like a plastic model kit.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_347_4.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_347_5.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_347_6.png)'
  merge: -1
  img_proc: true
