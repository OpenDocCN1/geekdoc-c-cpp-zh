- pgno: 78
  md: 'Go to zoos and sketch the animals. You''ll have to draw quickly in order to
    capture an animal on the move! This will be far more informative than drawing
    from books, the television or the Internet.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_78_0.png)'
  merge: -1
