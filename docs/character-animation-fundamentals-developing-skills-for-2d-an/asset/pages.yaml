- pgno: 262
  md: 'Below are the key positions for a character walking into the scene happy, slowing
    to see the sign and walking out unhappy as a result of seeing what is written
    on the sign.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_262_0.png)


    First work out the stride positions all the way through the scene. Once these
    are done and you are happy with the pace, put in the breakdowns. These are the
    crossover positions. Take a look at ‘walk_by_2D.avi’, Chapter 5 on the website.


    You don’t have to follow this scenario. You may want to have a sad person becoming
    happy, a miserable person becoming dreamy or a stupid person acquiring some intelligence.
    Just make sure your audience understands it.


    # Changing the Pace and Mood in a Walk Exercise in 3D


    Start by building a floor for the man to walk on. Make it out of a grid, plane,
    box or cube. It should be about 100 units wide for Maya or 1000 units wide for
    3D Studio Max and 30 units deep for Maya or 300 units deep in 3D Studio Max. Don’t
    make it any taller than 1 unit in Maya or 10 units in 3D Studio Max. Position
    it so that the majority of its length is in front of our man.


    Make a sign for our man by creating a post out of a box or cube


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_262_1.png)'
