- pgno: 311
  md: '+   2. When a character is putting over a point forcefully, they will point
    with the hands and lean forwards as if they are putting themselves forwards.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_311_0.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_311_0.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_311_2.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_311_3.png)


    +   3. When a character is being defiant, they will pull themselves up and cross
    their arms. The head will be held up high and angled back.


    +   4. When a character is having an argument, they will lean forwards, wave their
    fists, strike things, hunch their shoulders and gesticulate wildly.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_311_4.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_311_5.png)'
