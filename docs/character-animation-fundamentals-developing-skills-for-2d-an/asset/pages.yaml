- pgno: 367
  md: 'The eyebrows can be raised, producing a furrowed forehead, and they could be
    brought together. One of the eyebrows could be higher than the other. The pupils
    could dilate and the eyes will stare unblinkingly at the object of interest. The
    eyebrows are positioned similarly to the surprised facial expressions but the
    mouth usually has a smile.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_367_0.png)


    The head could be brought forwards and even put onto one side.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_367_1.png)


    The opposite of interest is boredom. The face becomes relaxed and unanimated:
    the eyes droop and look up or straight ahead, not focusing on anything. The whole
    upper body may lean forwards until the character catches themselves and moves
    suddenly back to an upright position. The character could also fiddle with things
    to occupy them. Yawning is a good sign of boredom.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_367_2.png)'
  merge: -1
