- pgno: 87
  md: '# Construction


    How is your inanimate object constructed? A balloon full of water will move differently
    from a solid box full of water. A feather will float gently down whereas a bowling
    ball will fall with great speed straight to the ground.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_87_0.png)


    # How to Animate Inanimate Objects


    It’s always best to base your animation on real life. Even the most cartoon-like
    animation will have one foot in reality to make it believable. If your animation
    involves dropping a bowling ball, find a bowling ball and drop it. This way you
    can observe the motion. Bear in mind that, to make the action more convincing
    for your audience, you will have to exaggerate the way the ball moves. All animation
    can be thought of as a performance, in the same way that an actor will produce
    a performance that is an exaggerated version of real life. If you make the animation
    too ‘realistic’ it can often look stiff or insignificant. Exaggerating the movement
    can make the piece of animation more convincing.


    A good example of this can be seen in many live-action films that feature explosions.
    The explosion will usually be shown in slow motion, emphasising its power and
    force and drawing your attention to the smoke and debris flying through the air.
    Think of all animation as being an exaggerated version of real life.


    # The Animation of Solids


    # A Bowling Ball


    This is a good example of a heavy object. Once dropped, the bowling ball will
    accelerate rapidly to its maximum speed (deriving its energy from gravitational
    pull). It will then bounce (with no squash and stretch, because it is a solid,
    rigid object) as it hits the ground (unless it smashes straight through the floor,
    in which case it will keep going). The maximum speed is reached just before the
    ball hits the ground. The weight of the ball combined with its rigidity means
    that the curve (or angle) of the bounce will be steep. As it accelerates away
    from the ground and decelerates into the apex, the movement will be short and
    quick before the ball accelerates back towards'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'the ground as gravitational pull takes over. This could be repeated a couple
    of times. The apex of the bounce will be lower each time. Each successive bounce
    will be increasingly closer to the previous bounce, while the curves of the bounces
    will remain quite sharp.


    To animate this sequence, start with a still picture of the ball being held. When
    the ball is dropped, the time elapsed between each drawing rapidly increases until
    you reach maximum speed, at which point the drawings will be an equal distance
    apart. This means that each subsequent ball will be further and further from the
    previous one on the drawings.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_88_0.png)


    When the ball hits the ground it will bounce. The reason it bounces is that when
    the ball hits the ground the energy contained within the ball has nowhere to go
    but back up, lifting the ball into a bounce. The ground absorbs a small amount
    of energy, which gives each bounce less power. The'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'height of the first bounce will be lower than the height from which the ball
    was initially dropped. As more energy is absorbed by the ground, each successive
    bounce will be lower than the last.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_89_0.png)


    As another example, when you propel a bowling ball forwards, the acceleration
    is slow as you transfer energy from your hand to the ball. It is as if the ball
    is reluctant to take on the energy. You need to give it a very hard shove to get
    it going. The ball will be at its maximum speed as you stop pushing. Once it gets
    going, the weight of the ball combined with the energy from the push gives the
    ball the momentum to keep travelling and it will decelerate very slowly before
    stopping.


    When animating a bowling ball being bowled, the first drawings, of the hand propelling
    the bowling ball, are close together, giving the impression of the initial thrust
    of speed. The time spacing between the drawings then increases gradually until
    the maximum speed is reached (the point at which the hand stops pushing the ball).
    The drawings gradually become closer and closer to each other as the speed of
    the ball slowly decreases and it comes to a graceful stop. It must be remembered
    that a lot of energy has been passed to the ball to get it rolling. It has a great
    deal of momentum, so it will take considerable force (or a very strong object)
    to stop it prematurely.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_89_1.png)'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# A Soccer Ball


    A soccer ball, when dropped, will accelerate at a slightly slower pace than a
    bowling ball. It will squash slightly as it hits the ground. This is because a
    football is flexible: it consists of a membrane holding in compressed air. As
    the ball hits the ground, the energy contained in the ball is forced outwards
    (i.e. the ball squashes) and not upwards because there is still energy at the
    top of the ball that will prevent the energy at the bottom of the ball from bouncing
    straight up. Only when the energy at the top of the ball has reached its lowest
    limit will the ball bounce up. Because a soccer ball is lighter than a bowling
    ball, it is affected less by the pull of gravity as it bounces and will bounce
    higher (assuming they are dropped from the same height). A membrane filled with
    compressed air has a certain amount of give, making it springier. This means that
    a soccer ball will also bounce more times than a bowling ball before coming to
    a stop.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_90_0.png)'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'A soccer ball being kicked is far easier to move than a bowling ball (it is
    a soccer ball, after all). The energy is passed easily from the foot to the ball,
    which will probably travel further than the bowling ball. It will be easier to
    stop, though, because it is flexible and will squash against any object in its
    path, and also won''t contain as much kinetic energy as a shoved bowling ball.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_91_0.png)


    # A Balloon


    When dropped, a balloon will accelerate very slowly to maximum speed, squash slightly,
    bounce slowly a couple of times (each time a smaller bounce) and come to a stop.
    The reason it squashes less than a football is that it has gained far less momentum
    from its fall, so there is less energy to push outwards at the point at which
    it hits the ground. It will also slow down just before it hits the ground. This
    is because a balloon is so light that a cushion of air above the ground gives
    a small amount of resistance and adds to the impression of the balloon’s lightness.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_91_1.png)'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'A balloon being pushed along the ground requires very little energy to get
    it moving, so it will accelerate rapidly to its maximum speed while some of the
    energy is absorbed by the balloon squashing against the hand as it is pushed.
    Very little energy is passed to the balloon from the hand so it contains very
    little forwards momentum. As such, as it leaves the hand it will decelerate to
    a stop rapidly.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_92_0.png)


    # *A Water-Filled Balloon*


    A balloon full of water, when dropped, will accelerate rapidly because it is heavy.
    It will also adopt a tear shape as it falls. This is because the balloon is a
    flexible membrane and all of the water wants to be at the bottom of the balloon
    because of gravity. The membrane will flex to a certain point at the bottom of
    the balloon and any water that can''t fit at the bottom will stay at the top.


    When it hits the ground, the water at the top of the balloon will push the membrane
    outwards to the sides. When the water has pushed the membrane out as far as it
    will go (without bursting), the water is forced upwards, all around the inner
    surface of the balloon''s membrane. When it meets at the top, whatever energy
    there is will lift the balloon. As the balloon reaches the top of its apex, the
    water will fall back down within the middle of the balloon. As the balloon hits
    the ground again, the water is forced outwards, again causing the balloon to squash.
    This time, because the force of the fall is smaller, the balloon will squash less.
    As before, the water is forced upwards by the membrane, meets at the top and is
    then forced down. The balloon does not take off this time.'
  merge: -1
  img_proc: true
