- pgno: 29
  md: 'The columns show the order in which the levels are placed: background at the
    bottom level (right on the X-sheet) and foreground at the top (left on the X-sheet)
    with the character in the middle.


    Each drawing will have its own number. Each unit represents a frame. The drawing
    number is inserted to show where that frame of animation will be in the sequence.
    This varies depending on how many frames per second each drawing represents. The
    example right shows a sequence that is shot on twos; that is, each drawing is
    shot for two frames. When something is on twos, the first row has a number and
    the second is left blank. It is not necessary to fill in every frame. At the end
    of the sequence, the last drawing is held for 10 frames; that is, the drawing
    is shot for ten frames. This is indicated by the line that runs from the bottom
    of the drawing number to the last frame that the drawing is held for. If the drawing
    is held for more than two frames, it is necessary to insert a line to show how
    long the drawing is held for.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_29_0.png)


    # Levels


    When a sequence is animated, even if there is only one character, the drawing
    for one frame of animation may be on several levels of paper. If the body remains
    still during the sequence but the head and arms are moving, there will be only
    one drawing of the body for the whole sequence. If the head is moving at a different
    rate to the arms, the head will be on a separate piece of paper and the arms on
    a further piece. If there is a background and the character is stood in front
    of a tree, for example, these will again be on separate pieces of paper. However
    accurate the final drawings are, if you have to re-trace exactly the same drawing
    20 times or more (your background with a tree, for example), there will be variations
    between the drawings that will show when the animation is played. It also is an
    unnecessary use of time. Before the use of computers, the finished drawings were
    traced and colored onto Cel (cellulose acetate, or clear plastic sheets). This
    allowed for a maximum of six levels before the thickness of the cel made the colors
    on the lower levels look muddy. Today, each of these levels would be painted and
    they would then be assembled with programs such as DigiCel FlipBook or Toon Boom.
    This allows for infinite levels without any loss of quality.


    | LEVELS: | 6 | 5 | 4 | 3 | 2 | 1 | B.G. |

    |---|---:|---:|---:|---:|---:|---:|---|

    |  |  |  |  |  |  |  |  |

    |  |  |  |  |  |  |  |  |

    |  |  |  |  |  |  |  |  |

    |  |  |  |  |  |  | A1 |  |

    |  |  |  |  |  |  | A3 |  |

    |  |  |  |  |  |  | A5 |  |

    |  |  |  |  |  |  | A7 |  |

    |  |  |  |  |  |  | A9 |  |'
