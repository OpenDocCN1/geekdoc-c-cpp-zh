- pgno: 203
  md: 'When somebody points, the finger doing the pointing will go slightly beyond
    its final resting position. You could even lose the joint and make the arm perfectly
    straight at the most extreme position, or even try stretching the arm as well.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_203_0.png)


    When a head moves from one side to another, it will go slightly beyond its final
    resting position and then move back to a stop. The hair continues to move, as
    do the jowls, earrings and any other loose items. The hair, being lighter, will
    go further beyond the stopping position; the earrings, being heavier and more
    solid, will not go as far. The jowls will only go beyond their resting position
    a small amount before coming to a stop. Both the hair and the jowls will come
    back to a final resting position but at slightly different times, with the hair
    coming to a stop last.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_203_1.png)'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'Drapery will move beyond the character''s final resting position and then flow
    back to a graceful stop.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_204_0.png)


    Making parts of your character come to a stop at different times always improves
    your animation.


    # Vibration


    When we have a stiff object that can show a small amount of flexibility, like
    an arrow, a plank of wood or a fishing rod, we will get a certain amount of vibration
    with its follow-through and overlapping action.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_204_1.png)'
