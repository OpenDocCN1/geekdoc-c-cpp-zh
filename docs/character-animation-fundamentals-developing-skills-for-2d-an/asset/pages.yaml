- pgno: 374
  md: '# *Evaluation*


    If somebody is considering something, they may stroke their chin or support their
    face delicately.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_374_0.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_374_1.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_374_2.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_374_3.png)


    If somebody is bored, they may support their head with their hand as if their
    head were heavy.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_374_4.png)


    # *Deceit*


    When a young child is telling a lie, they will often cover their mouths involuntarily,
    as if they are trying to cover up the lie they are saying. Adults will do a similar
    action but will try to disguise it but turning the gesture into something else.
    Touching the nose or cheeks gives the impression of somebody who is being economical
    with the truth.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_374_5.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_374_6.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_374_7.png)'
  merge: -1
  img_proc: true
