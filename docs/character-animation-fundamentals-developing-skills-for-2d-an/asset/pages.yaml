- pgno: 215
  md: 'The scene is 100 frames long so open up the Time Configuration window (click
    the **Time Configuration** button at the bottom of the screen) and make sure the
    Length box is set to 100 in the Animation section.


    Make sure you are still in the left viewport and open up Schematic View by clicking
    the **Open Schematic View** button at the top of the screen. Click the **Animate**
    button (in 3ds Studio Max 5 press the **Auto Key** button) and click the **Motion**
    tab on the Command Panel.


    Move the Time Slider to frame zero and select Bone01 (the bone at the stick),
    in the Motion area of the Command Panel go to the PRS Parameters section, click
    the lower Rotation button to put us into rotation mode and then click the Rotation
    button in the Create Key section. This will create a key at frame zero. In the
    Key Info (Basic) section type -125 into the Value box and press Enter on your
    keyboard. You should now have a stick that is leaning to one side with a still
    piece of string.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_215_0.png)


    Move the Time Slider to frame 17 and set the second key position by clicking the
    Rotation button in the Create Key section, within PRS Parameters section on the
    Command Panel. Then in the Value box of the Key Info (Basic) section type -55
    and press Enter on your keyboard. As you scrub the Time Slider back and forth,
    the stick should move through an arc from key 1 (frame 0) to key 2 (frame 17).


    Move the Time Slider to frame 35 and set the third key position to a rotation
    of -125 degrees. Move the Time Slider to frame 49 and set the fourth key position
    to a rotation of -55 degrees. Move the Time Slider to frame 65 and set the fifth
    key position to a rotation of 125 degrees.'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'So that the stick waves from side to side correctly – by accelerating from
    each of the key positions and then slowing down to the next key position – open
    up the Track View (click the **Open Track View** button at the top of the screen).
    Then open the function curve editor by clicking the **Function Curves** button
    at the top of the **Track View** window. In the explorer section of the **Track
    View** window, select **Bone01 > Transform > Rotation > Y Rotation**. This will
    display the Y function curve in the Track View.


    Right click each of the key positions on the function curve in turn and give them
    handles by selecting the handles button below **In** or **Out** in the **Bone01\Y
    Rotation** window that comes up. To get the handles to work independently of each
    other, click the **Advanced** button and click the button with a padlock on it.
    Shape the curves as per the illustration. This will give us a nice pendulum-like
    movement of the stick.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_216_0.png)


    Render a preview of your animation (on the main menu, select **Animation > Make
    Preview**) and then take a look at ‘stick_3D_keys.avi’, Chapter 4 on the website.
    We’ve now got a waving stick with a stiff piece of string.


    Move the Time Slider to frame zero and select ‘Bone02’ in the Schematic viewport
    by double clicking it. Rotate ‘Bone02’ so that the string is hanging straight
    down, as in frame 1 of your drawn animation (or the illustrations in the 2D section
    of this chapter).


    Put a sheet of acetate onto your screen and draw the position of the string at
    frame zero on the screen with your acetate. Move the timeline to frame 3. Select
    ‘Bone02’ and each of the subsequent bones in the string and rotate them into a
    shape that resembles drawing 3 of your drawn animation (or have a look at the
    illustration in this book). Each time you rotate a bone, make sure you save a
    key (the default setting on 3D Studio Max is to set a key automatically whenever
    you move something).'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'Move the Time Slider to frame 5 and repeat the process. Continue through your
    animation, copying every drawing from your drawn animation for illustrations in
    the book onto the computer.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_217_0.png)


    When you are done, have a look at ‘stick_string_3D.avi’. Chapter 4 on the website.


    # The Dive Exercise in 2D


    We will animate a character diving off a cliff, then bouncing off a diving board
    and finally splashing into the sea. This scene is 70 frames long.


    During this scene the diver is distorted on certain frames to emphasize the movement.
    The diver should never be distorted for more than one frame at a time and should
    only be distorted at the fastest point of any movement.'
