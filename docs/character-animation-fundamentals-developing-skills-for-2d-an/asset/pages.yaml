- pgno: 210
  md: '# _The Stick and String Exercise in Maya_


    # **Building the Stick and String in Maya**


    Make the View panel Front. Create a polygon cylinder by clicking the Polygonal
    Cylinder button at the top of the screen, or by going to the main menu and clicking
    Create > Polygon Primitives > Cylinder.


    In the Channel Box rename ‘polyCylinder1’ to ‘stick’. Under Inputs click ‘polyCylinder1’
    and the Input boxes will open up. Make Radius 0.4, Height 16, Subdivisions Axis
    20, Subdivisions Height 1 and Subdivisions Caps 1.


    Create a second polygon cylinder and call it ‘string’. Make it Radius 0.1, Height
    16, Subdivisions Axis 20, Subdivisions Height 16 and Subdivisions Caps 1.


    Rotate ‘string’ 90 degrees in Z and move it 9 units in Y and −8 units in X. This
    will put it 1 unit higher up than the stick.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_210_0.png)


    Now we need to put some joints through the ‘stick’ and ‘string’ and ‘bind’ them
    together. Go into animation mode by selecting Animation from the dropdown menu
    in the Modes box. Open up the Hypergraph (on the main menu, select Window > Hypergraph).
    This will help when selecting different parts of the skeleton and the stick and
    string. Click the Snap to grids button and then click the Click to place IK joint
    button or go to the main menu and click Skeleton > Joint Tool. Click at the center
    of the top of ‘stick’ and then at the center of the top of ‘string’. Press Enter
    on your keyboard to leave Joint Tool mode. This will put a joint up through the
    stick. Select'
  merge: -1
  img_proc: true
- pgno: 211
  md: <!-- no content -->
