- pgno: 259
  md: 'A good way of helping a run cycle to work is to add whiz lines, smear the arms
    and legs and also, if it’s on singles, offset the legs slightly so that they don’t
    strobe” (this is when the stride positions look so similar that your audience
    can’t tell the difference between them when the sequence is played). See ‘fast_run_2D.avi’.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_259_0.png)


    A skip is a kind of run that involves a floating stride position and landing on
    the rear foot. See ‘skip_2D.avi’.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_259_1.png)


    # Exercises


    # *The Walk or Run Cycle Exercise in 2D*


    Take any of the illustrated examples of walk cycles or run cycles and have a go
    at a character walking or running on the spot. In order to do this, think of your
    character walking on a treadmill.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_259_2.png)'
