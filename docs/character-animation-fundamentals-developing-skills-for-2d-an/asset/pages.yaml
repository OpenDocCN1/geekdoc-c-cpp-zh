- pgno: 316
  md: '# Arm Crossing


    Hiding behind something is a way of protecting ourselves. If a character crosses
    their arms in front of them it’s as if they are hiding behind their crossed arms.
    They may do this because they disagree with something that has been said or are
    comfortable with the situation they are presented with.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_316_0.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_316_1.png)


    Clenching the fists while crossing the arms gives a hostile signal.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_316_2.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_316_3.png)


    Gripping the arms tightly with the hands while the arms are crossed suggests nervousness
    and stress.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_316_4.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_316_5.png)'
  merge: -1
  img_proc: true
- pgno: 317
  md: 'Partially crossing the arms shows a lack of confidence (e.g. in a situation
    where the character is with a lot of strange people).


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_317_0.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_317_1.png)


    Crossing the arms at the hands suggests humility.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_317_2.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_317_3.png)


    # Leg Crossing


    Leg crossing gives off a similar signal to arm crossing but is far less strong.
    A basic crossing of the legs can give the impression of defensiveness, but could
    actually have been adopted by a person trying to make themselves comfortable.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_317_4.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_317_5.png)'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'Combine a leg cross with an arm cross, a backwards body posture and a sour
    look on the face and you get a strong impression of displeasure.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_318_0.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_318_1.png)


    Crossing the leg with the heel at the knee gives a competitive, aggressive impression.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_318_2.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_318_3.png)


    Crossing the legs at the ankles gives a ‘prim and proper’ look.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_318_4.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_318_5.png)'
