  md: '''A'' as in ''dad'' is a large but narrow smiling mouth shape. Use mouth shape
    ''big smile''.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_433_0.png)


    ''EH'' as in ''wet'' is a large, wide smiling mouth with the jaw dropped, but
    not quite as dropped as ''O'' and ''A''. Mix ''OH'' with ''big smile'' but don''t
