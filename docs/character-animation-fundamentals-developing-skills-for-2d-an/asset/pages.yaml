- pgno: 282
  md: 'The movement of the hips and the shoulders is similar to the earlier four-legged
    walks, but with an animal with hooves these movements tend to be more pronounced
    because the legs are longer. The head will counteract what the body is doing.
    The head will be down on the crossover position of the front legs and up on the
    stride. This head movement tends to be more pronounced in a hoofed walk because
    the legs are much longer than in the other animal walks.


    # Flat Feet


    Animals such as elephants and rhinos walk on the equivalent of the bones at the
    very end of human fingers. Imagine the thumb facing backwards and three fingers
    facing forwards. These digits are very thick and heavy in order to take the large
    weight of the animal they are supporting. The remaining digits are very short.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_282_0.png)


    There is virtually no movement of these digits because they are firmly wrapped
    in flesh, which further helps in supporting the great weight of the animal they
    belong to. The solidity of the foot gives the appearance of it having one less
    joint than most animals.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_282_1.png)


    Take a look at ‘elephant_walk_2D.avi’ in animations006, Chapter 6 on the website.'
