- pgno: 302
  md: 'A lot of puppet animation (and puppetry in general, for that matter) relies
    purely on body language. The faces of puppets can’t change expression to the same
    degree as drawn animation or 3D computer animation, but puppet animation and puppetry
    can be just as expressive (if not more so) as any other sort of performance. Watch
    puppet shows like the Muppets and animated films like *The Nightmare before Christmas*
    and see how the characters express themselves.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_302_0.png)


    This is not to say that facial expressions are not important. Humans have the
    most expressive faces of any animal and one of the main reasons for this is to
    facilitate communication with other human beings. I like to think of the face
    as a canvas that different expressions are painted onto (more about faces in Chapter
    10).


    One amazing thing about human beings is their ability to lie. This ability to
    lie is at its most refined in the face. We can be feeling miserable but still
    say that we are OK and have a smile on our face. As we move down the body this
    ability to lie weakens. To put it bluntly, our bodies are more honest. So, if
    we are feeling miserable, we can put on a happy face and may be able to hold our
    shoulders up when we want them to droop, but there will be a strange strain to
    the position — perhaps the shoulders are slightly too high and are stiff in their
    movement. Further down the body, the arms and hands may hang in a way that suggests
    that any movement is an effort, the small of the back may tend to bend outwards
    and, if the character walks, the feet may drag. Very corny, I know, but all these
    little things can add up to telling your audience what a character is feeling.


    # Basic Body Postures


    From the moment we wake up to the moment we go to bed, we are spending our day
    reacting to things that we are presented with. Whether people, ideas, situations
    or problems, smells or sounds, everything we do is a reaction to something else.
    How we react to these situations is reflected in the body language we adopt. There
    are a huge number of signals that can be given off by the positions adopted by
    different parts of the body. These postures can complement or contradict each
    other, depending on the situation. In the example above of a character who is
    depressed and openly expressing this, although some of the signals given off by
    parts of the character’s body will say something else, the majority of the signals
    say ‘depressed’ and so the observer will still get an overall feeling of depression.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_302_1.png)'
