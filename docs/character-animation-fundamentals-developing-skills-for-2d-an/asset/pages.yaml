- pgno: 434
  md: '‘EEE’ as in ‘squeeze’ is still quite loud but the jaw will not be as open as
    for the other loud vowels. It consists of a wide smile. Use a mixture of ‘big
    smile’ and ‘smile’.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_434_0.png)


    # The Quieter Vowels and Consonants


    These are ‘C’, ‘D’, ‘I’, ‘K’, ‘N’, ‘T’, ‘Y’, ‘Z’ etc. Use almost any mouth shape
    you like as long as it in-betweens from one of the major mouth shapes to the next.


    # Animating the Mouth


    Change the shape of the mouth depending on the mouth shape required for the given
    sound on the X-sheet. Each of the four programs has a slightly different way of
    changing the mouth shapes and setting keys, so follow the individual instructions
    for each program outlined in Chapter 10. With the second piece of dialog, try
    using the more sophisticated character (Jenny). Take a look at ‘hello_3D.avi’
    and the video tutorials in the Chapter 12 folder on the website to get an idea
    of what to do.'
