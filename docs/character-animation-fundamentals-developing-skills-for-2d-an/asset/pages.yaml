- pgno: 396
  md: '# Mirroring


    When two people know each other well and are in close proximity (for example,
    engaged in a conversation), they will ‘mirror’ each other. That is, they will
    adopt body language similar to that of the other character. They may cross their
    legs in the same way, lean on their elbows on the table in the same way or angle
    their head in the same way. These are only a few examples of the many different
    ways in which your characters can mirror each other.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_396_0.png)


    The degree to which people mirror each other depends on how well they know each
    other and also how well they want to know the other person. The degree to which
    your characters mirror each other is an indication to the audience as to what
    sort of relationship they have. Two teenagers trying to look cool will both adopt
    postures that suggest boredom. An office junior trying to impress his boss will
    imitate his body language.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_396_1.png)'
  merge: -1
  img_proc: true
- pgno: 397
  md: 'When a couple are on that oh-so-important first date, if they are attracted
    to one another they will end up mirroring each other’s behavior. They will be
    trying so hard to mirror each other that their movements may seem forced. They
    will occasionally slip out of mirroring when they are distracted – for example,
    when a waiter asks whether everything is OK with their meal – and will act as
    themselves. To show to the other person that they are attracted to them, the character
    must learn to mirror.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_397_0.png)


    When couples have known each other for a while, they will mirror automatically
    and feel at ease in each other’s company. Their body language will suggest to
    the rest of the world that they are together. They will hold hands or hug when
    they walk.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_397_1.png)'
  merge: -1
  img_proc: true
- pgno: 398
  md: 'This may work in the opposite direction, however. When two characters are in
    a long-term relationship there may be a level of boredom with each other. As a
    result they will try to reinforce their own identity. When together they may tend
    to, almost deliberately, not mirror each other''s body language. One may read
    newspaper while the other is looking at their surroundings. They will deliberately
    occupy different poses. When interrupted they will start mirroring each other,
    because this is their natural state.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_398_0.png)


    When mirroring, people will take drinks from their glasses at roughly the same
    time and take bites of their food at the same time. When walking along together,
    their strides will synchronise.


    # How Characters Look at Each Other


    Again, this depends on how well the characters know each other and what their
    relationship is.


    When two characters are in love they will stare directly into each other''s eyes.
    Each character is essentially ‘giving’ themselves to the other person and not
    covering anything up, and they will look at each other with a happy, questioning
    look. Because each character is looking into the eyes of the other person, their
    own eyes will flick from side to side, with both eyes focusing on one eye and
    then the other in turn (when animating, make the eyes stay in one position for
    a second or so and then click the pupils to a second position, repeat at random).
    This gives a very ‘open’ look. Combine this with an occasional slow eye blink
    and dilated pupils.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_398_1.png)'
  merge: -1
  img_proc: true
