- pgno: 167
  md: 'In the view panel menu set **Shading** to **Wireframe**. In the Hypergraph
    select all the nodes and then ghost your animation (on the main menu, **Display
    > Object Display > Ghosting**). You should now see the first two key positions
    displayed in your view panel.


    Move the Time Slider to frame 3 and move your man to the same position as drawing
    3 (between positions 1 and 9). You may find that ghosting everything will gobble
    up large amounts of memory, making it slower and tricky. If so, try ghosting only
    one part of his body or drawing on an acetate sheet stuck on your screen. If you
    need to work out the in-between for the body, select the body and apply ghosting.
    With the Time Slider on frame 3, move the body of the man (by selecting the ‘BodyHandle’
    node) and move it to the same position as your drawing.


    As you do the breakdowns, the computer returns its animation to being evenly in-betweened
    (the animation curves return to ‘spline’). You can either leave this or select
    all the nodes and then go into Graph Editor and convert to stepped tangents.


    If the animation jumps between one key position and the next, it means that the
    animation curves are still ‘stepped’ (i.e. there are straight line bits between
    the two key positions in the Graph Editor). To remedy this, open up the Graph
    Editor and select every one in the Hypergraph. This will show all of the animation
    curves in the Graph Editor. Don’t worry about the multicolored spaghetti; we are
    only concerned with the curves between frames 25 and 33. Make sure you can see
    all the curves by having the pointer in the Graph Editor box, pressing **A** on
    your keyboard and with the left mouse button drawing a box around key positions
    25 and 33 on the animation curves. With these key positions highlighted, make
    the curves between them Spline by going to the Graph Editor menu and selecting
    **Tangents** and then **Spline**. The frames between key 25 and 33 should now
    be evenly in-betweened.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_167_0.png)'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'Go through the entire sequence, placing the breakdowns between the main key
    positions (have a look at the illustrations in the 2D section or, better still,
    your own drawings). Once this is done, you should have something like “lift 3D
    breakdowns.avi” in Chapter 3 on the website. As you can see, we are almost there.
    In the breakdowns I’ve made sure I’ve put in some life by dragging the head and
    the arms on the way down and on the way back up again. But it’s still a little
    ragged. The left arm wobbles slightly as the ball is picked up and the right hand
    wobbles just before it grabs the ball. We also need to close the eyes at the point
    where the man is straining to pick up the ball. It’s now a case of adjusting the
    animation curves at each of the points where you’re not happy with the movement.
    Choose one section at a time and change the angles of the curves as you did with
    the bouncing balls in the last chapter.


    # Experiment!


    Another method of correcting a part of the animation that you aren’t happy with
    is to put in a key at every frame. For example, at the point where the hand first
    touches the ball and wobbles around (between frames 19 and 29), go in as close
    as possible to the hand touching the ball and select ‘Larm-Control’. At frame
    19, draw an outline of the hand on an acetate sheet stuck on your screen. Then
    scrub along the timeline to the first breakdown position (frame 23) and rotate
    the ‘LarmControl’ joint until the hand is in the same position as the drawing
    on the acetate sheet and set a key. Then go to the next breakdown (frame 25) and
    rotate ‘LarmControl’ until the hand is in the same position as the drawing on
    the acetate sheet and set a key. Keep scrubbing backwards and forwards, rotating
    ‘LarmControl’ and setting a key at various frames in order to keep the hand in
    the same position.


    Repeat this same technique to sort out any other wobbles. Remember that you can
    change the position of a key by moving or rotating any part of the character and
    saving a key in the new shape by pressing S on your keyboard.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_168_0.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_168_1.png)'
