- pgno: 325
  md: 'glances up, man does a double take and looks up in a more exaggerated way).
    Act it out yourself a few times until you think you’ve got it how it needs to
    be, then act it out in front of somebody else. Get their comments on what you’ve
    done. Do they understand it? Does the movement fit in with what they understand
    as the personality of the character? When you’ve taken all of this on board and
    re-acted it a few times so that it feels natural, get somebody to film you with
    a digital camera. Act a few versions, using different timing and mannerisms. One
    thing you will find is that you will start putting things in that you never would
    have thought of if you had just started animating straight on to the computer.
    When you’ve seen the footage, you may find that you need to re-shoot. For example
    with the first video that I shot, I felt that the first look off screen was too
    subtle (have a look at ‘vid-ref01.avi’ in the movies folder of Chapter 9 on the
    website). So, I shot it again with a bigger ‘look’ off screen at the start (‘vid-ref02.avi’).


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_325_0.png)


    Download the movie(s) from the camera onto your computer and watch them a few
    times. Try to remember how it ‘felt’ to do the movement. If you did several ‘takes’,
    watch them all and take the best bits from each movie to apply to your piece of
    animation. The most important thing is not to slavishly copy the footage. Take
    the essence of it. You may have to change the timing (you will usually have to
    animate things a bit slower than real life). You may also need to exaggerate each
    of the poses as well as the anticipation, the movement itself, and the overshoot
    and overlapping action.


    Once you have watched the footage over and over again (almost until you are sick
    of it), do a series of thumbnail sketches for you to stick on the wall to refer
    to. This will also make it a lot clearer in your head what you will need to do
    once you are animating.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_325_1.png)'
