- pgno: 349
  md: 'When it comes to rigging your character, again keep it as simple as possible.
    You could copy the basic rig I did for my man character. All I would change is
    to make the joint for the ankle a bit higher (because this joint is not flat on
    the ground in a human being). Add some more bones for the fingers and I would
    also add some handles to each of the backbones, the neck joints, the head joint,
    the eyelids and the shoulder joints, just to make them easier to select on the
    screen.


    You could have a go at scripting and expressions and stuff like that (programming
    that can help with some movements), but that is a path I have chosen not to go
    down (I want to be an animator not a technical director).


    Always test your character out on a couple of scenes before you start animating
    in earnest and be prepared for it to fall to bits at any time. I will go into
    more sophisticated facial expressions in Chapter 12.


    Take a look at the Chapter 9 folder on the website. I have included some movie
    tutorials on how to build a head and body and there is also a model for you to
    play with.


    It is possible to download a lot of excellent models from the Internet these days,
    all for free. If you want to learn how to animate, it might be better to stick
    to animating a downloaded model rather than spending a lot of time building one.


    Specific exercises on building a more sophisticated character in Maya and 3D Studio
    Max can be found on the book’s website, www.charactermation.com.'
  merge: -1
  img_proc: true
- pgno: 350
  md: "# # Animation of Acting – Facial Expressions\n\n+   ## Chapter Summary\n+ \
    \  \n+   - Emotions\n+   - The Eyes\n+   - Facial Expressions\n+   - Head Angle\n\
    +   - Hand-to-Face Gestures\n+   - Extreme Close-Ups\n+   - How to Animate a Piece\
    \ of Facial Acting\n+   - Exercises\n\nHumans have the most expressive face in\
    \ the animal kingdom. With a combination of eight basic expressions we can pull\
    \ around 5000 different faces, all with slightly different meanings. The majority\
    \ of these expressions are universal to all human cultures.\n\nThe face is used\
    \ as a signpost to other people. It shows how we are feeling and what we want,\
    \ or can be used to mask the way we feel. Almost half of our brain is concerned\
    \ with seeing and almost half of that part of the brain is dedicated to recognising\
    \ human faces and facial expressions. When we look at someone, we study the face.\
    \ We look at the eyes, the eyebrows, the lips and the forehead. They give out\
    \ a combination of signals that provides us with the information to form an opinion\
    \ as to what the owner of the face is thinking.\n\nWhen animating your character,\
    \ because facial expressions can be very ambiguous and misleading, it is always\
    \ best to work out the body language first and then add the facial expressions.\
    \ I have deliberately kept the illustrations and examples in this chapter as simple\
    \ as possible. It's up to you to act out these emotions in a mirror to elaborate\
    \ on them.\n\n# ## Emotions\n\nFacial expressions are the ultimate demonstration\
    \ of our emotions. We use the face to broadcast and communicate our emotions.\
    \ Facial expressions are caused by the contraction and relaxation of the facial\
    \ muscles.\n\nFacial expressions result from somebody hearing something, seeing\
    \ something, smelling something, tasting something, feeling something or thinking\
    \ something. As a character goes through a"
  merge: -1
  img_proc: true
- pgno: 351
  md: 'scene, the facial expression will change depending on these stimuli. Think
    of each facial expression as a key position and animate between them and hold
    them as necessary.


    On the most simplistic level, there are eight basic emotions: happiness, sadness,
    surprise, fear, anger, disgust/contempt, interest and pain.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_351_0.png)


    These are inherited, not learnt. Each of the basic emotions has an appropriate
    facial expression to display it. These are common to all human cultures. Some
    variations of these facial expressions are culturally specific and learnt.


    A combination of these basic facial expressions can appear on the face at the
    same time, for example happiness and surprise. All of the basic facial expressions
    can also be varied, depending on the intensity of the emotion portrayed.


    The design of a character could emphasise a certain emotion. A down-turned mouth
    will make your character look more sad, angry or irritable. Heavy-set eyebrows
    can produce the same effect. When this character displays an emotion other than
    the overriding emotion suggested by the design, the new emotion must be exaggerated
    to make up for the character’s design.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_351_1.png)'
  merge: -1
  img_proc: true
- pgno: 352
