- pgno: 427
  md: 'Notice that there are only three pose positions for the 80 frames of dialog.
    For ‘one moment ... my good man’, the main emphasis points are ‘one moment’ and
    ‘my good man’.


    # One moment...


    # ...my good man.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_427_0.png)


    Take a look at ‘moment_thumbs.avi’ and ‘hello_thumbs.avi’ on the website.


    The next thing to do is to work out the key positions and the in-betweens, making
    sure the action fits the feel of the dialog. For ‘hello ... how are you?’, we
    have the character anticipate backwards and then lean forwards on ‘hello...’.
    He then overshoots on the ‘...o’ and comes back to rest on the end of the ‘...o’
    sound (it’s quite long). In the pause he anticipates his head to screen left.
    He then leans his head to screen right on ‘how...’, overshoots on the ‘...w’,
    pulls his head back again slightly on ‘are’ and then puts his head back down again
    for ‘you’, overshooting on the ‘...o...’, and coming back up to rest on ‘...u’.
    Take a look at ‘hello_keys_2D.avi’.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_427_1.png)'
