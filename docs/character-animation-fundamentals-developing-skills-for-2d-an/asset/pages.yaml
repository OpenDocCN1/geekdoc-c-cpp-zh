- pgno: 339
  md: 'Take a look at ‘coin_keys_3D.avi’ in Chapter 9 on the website. The movement
    during the sequence is close to being as it should. However, there are some important
    faults. The movement/dynamics throughout the scene is slightly too even and the
    character seems to sway around at the points where it should be making only a
    small amount of movement (e.g. where the character looks off screen and at the
    point where it looks at the coin). The legs also act very strangely. Go through
    the animated sequence inserting further keys at the positions of the breakdowns
    (the major in-betweens), between the keys you have already set.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_339_0.png)


    At the points in the animation where the character should only move slightly,
    flatten out the animation curves to make them linear. This will take out the swaying
    motion. Finally, when this is working, go back and animate the hands and fingers,
    the eye blinks and the swivelling of the feet on the ground. It’s often best to
    animate the hands straight ahead.


    You could even have a go at making a pocket out of a sphere. Shape it like a cup
    and make it appear as the character opens its pocket. Scale it as the coin is
    thrust into it and make it disappear as the character’s hand lets go of it.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_339_1.png)


    Take a look at ‘coin_3D.avi’ in animation009, Chapter 9 on the website.


    # Building a More Sophisticated Character


    Because modelling and rigging a more sophisticated character is quite difficult,
    I’ve stuck to the fundamentals. You should be consulting the manual that came
    with your software while constructing your character.


    I’ve built a character called Jenny, who you can open up in Maya or 3D Studio
    Max and have a go at animating. Video tutorials on the website show how to build
    her. I’ve also supplied a headless version of her, so you could just build a head
    and stick it on her body.'
  merge: -1
  img_proc: true
- pgno: 340
  md: 'The first thing to do when building an animated character is to think about
    what motivates the character. So, work through the seven questions of character
    and work out which Laban ''efforts'' suit the character and list those as well.
    Then work out the practicalities. Think about what your character will need to
    do during the piece of animation that you are going to create and make sure the
    character is going to be able to do it. For example, if your character needs to
    reach up to a high shelf, will their arms raise above their head? Are the arms
    long enough to reach? Will the hands be able to pick up the thing they are trying
    to reach? Make lots of lists.


    Next, put together a mood board. A mood board can be the cork board above your
    desk or a bit of cardboard with things stuck to it that will inspire you in the
    creation of your character. These can be illustrations from magazines, postcards,
    photocopies, printouts from web sites or fast food paper bags - anything! As well
    as the shape of your character, you need to think about the colours, textures
    and feel of the character and the movie they are going to be in. It''s always
    better to have all this reference stuff where you can see it all the time, rather
    than on a computer where you will have to go to a certain amount of trouble to
    open up a file and you won''t be able to see everything at once.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_340_0.png)'
  merge: -1
  img_proc: true
- pgno: 341
  md: <!-- no content -->
