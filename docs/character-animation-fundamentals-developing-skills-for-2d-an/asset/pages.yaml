- pgno: 148
  md: 'Between the fifth and sixth key positions (frames 39 and 47) the ball swings
    between the man''s legs and slows as it reaches the end of its swing to the left
    (43, 45 and 47). The arms stay straight and they swing like a pendulum.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_148_0.png)


    Between the sixth and seventh key positions (frames 47 and 53) the man reaches
    his highest position and the ball swings slightly to the right as it is picked
    up. The arms stay straight and the man goes up onto his toes. He slows down as
    he reaches this position (49, 51 and 53).


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_148_1.png)'
