- pgno: 177
  md: 'In the **Hierarchy Tree** section of the **Track View** window, expand ‘RightArmControl’
    (click on the circled ‘+’ next to ‘RightArmControl’). Click on **Z Position**.
    Find the key frame at frame 29 on the Z (blue) function curve. Zoom into it. Right
