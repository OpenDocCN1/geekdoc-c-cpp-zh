- pgno: 161
  md: 'If you make a mistake and set a key that you don''t want, just right click
    on the key position in the Time Slider and select **Delete**. Select the bones
    you haven''t moved and set keys on them (the back bones, neck bones and so on).
    Move the Time Slider to frame 19 so you can do the third key position (take a
    look at the illustration above).


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_161_0.png)


    Select ‘BodyHandle’ and move your man down. The knees should bend nicely with
    the feet staying in place on the floor. Then rotate his body so he is almost parallel
    to the floor. Don’t select and move the joint ‘back1’. Strange things happen when
    you try to animate it.


