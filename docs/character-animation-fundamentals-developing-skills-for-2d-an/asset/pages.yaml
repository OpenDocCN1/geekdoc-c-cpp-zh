- pgno: 30
  md: '# Camera


    Information in this column instructs the camera on how you want the scene to be
    shot and pinpoints the area within the artwork that needs to be in frame. The
    most important piece of information is the field size. The most popular paper
    is 12-field, which means that the camera at its maximum setting will shoot an
    oblong area that is 12 inches wide.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_30_0.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_30_1.png)


    Traditional 2D animators use a field guide, also called a graticule, to work out
    the position of a shot. For example, for animation to be shot using the full size
    of the paper, “12-field center” is marked at the top of the camera column. As
    a 3D computer animator, you won’t be using field sizes. However, it is worth understanding
    how they are worked out.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_30_2.png)'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'The field guide has ''North'', ''South'', ''East'' and ''West'' printed at
    the top, bottom, right and left. It consists of 24 columns and 24 rows in a grid.
    The columns are half an inch wide. By using these compass points and grid references
    you can specify any area on your paper that you want to be shot.


    The illustration right shows an oblong area at the top right of the paper that
    is 5 inches wide. This would be 5 field at 7 east/7 north of 12-field center.
    Using the field guide, you work out where the center of the oblong is in relation
    to 12-field center (the center of the field guide). To find the center you would
    count along seven lines east and seven lines north from the center of the field
    guide (12-field center).


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_31_0.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_31_1.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_31_2.png)'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'Using this method, you can place a field of any size in any area.


    All exercises in this book are at 12-field center (or, if you are using A4 photocopy
    paper, 10 field at 2 south of 12-field center).


    # ### Line Testers


    A line tester is a device that captures your drawings and plays them back. It
    is a quick and easy way to see whether the roughly drawn sequence works. There
    are a number of ways to set up a line tester. You could use a film camera, a video
    recorder that can record single frames or a line testing software program and
    a computer. The movie examples on the website were produced using a program called
    DigiCel FlipBook, which can be downloaded from www.DigiCelinc.com (you can start
    with the free watermarked version but I would recommend upgrading to the basic
    version for a small fee). Alternatives are available. I would suggest looking
    for a program that contains an X-sheet, as this is best for working out timing.


    The simplest and cheapest way of setting up a line tester is to use a webcam together
    with a computer and the line testing software. Set the camera to point down onto
    the table. The camera could be mounted on a tripod or even stuck to a steel rule
    that is then attached to the top of your computer. Stick your peg bar to the table,
    put a piece of your animation paper onto it and align it under the camera. The
    peg bar is important for the accurate placing of drawings. It is also possible
    to scan drawings into the computer using a flat bed scanner, but it takes an awful
    lot longer than using a camera.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_32_0.png)


    Now would be a good time to load a copy of DigiCel FlipBook onto your PC and familiarise
    yourself with its operation.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_32_1.png)'
  merge: -1
  img_proc: true
