    X-sheets are also referred to as dope sheets or exposure sheets. They are used
    by the animator to record all the necessary information relating to how the animation
    should be shot. A standard X-sheet consists of several columns that run from top
    to bottom and 100 rows that run from left to right (the illustration shows 50).
    Each row represents one frame of animation. If the animation is to be played back
    at 25 frames per second, 100 frames will equal 4 seconds of animation (or 2 seconds
    on the X-sheet shown).


    The columns on an X-sheet are used as follows.


    # Sound


    This column contains the sounds that are relevant to the animation. Very often
    this is the dialog spoken by the characters. For animation the dialog is recorded
    first. It is then ‘broken down’. This means that someone, usually an editor, goes
    through the sound track frame by frame. They work out where each word starts and
    ends and where each of the major vowel and consonant sounds are. These are then
    marked on the X-sheet in the sound column, frame by frame. You then know that
    at a certain frame in a scene a particular sound is made.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_27_0.png)'
  merge: -1
  img_proc: true
