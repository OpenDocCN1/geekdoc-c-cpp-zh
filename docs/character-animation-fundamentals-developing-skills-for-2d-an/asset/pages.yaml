- pgno: 199
  md: 'In the same way that a piece of string will, to a certain extent, follow a
    path led by the part of the body that initiates the movement, the same will happen
    with the tail. This time the movement is led by the animal’s bottom.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_199_0.png)


    Occasionally the animal will initiate a slight movement through the tail itself.
    So, for most of the time the tail will follow a cycle but occasionally it will
    give a twitch and do something slightly different. The tail will then return to
    the cycle.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_199_1.png)


    Think about how much of the tail will be following through and how much is initiated
    from within. Some of the movement results from the animal’s bottom moving and
    some results from the animal moving its tail.


    Ears move slightly differently. As with the tail, the make-up of the ear varies
    from animal to animal. This affects the movement during follow-through. With dogs
    ears, for example, a spaniel’s ears will move in a much more floppy way than a
    terrier’s ears. This is because a spaniel’s ears are larger and softer and a terrier’s
    ears are shorter and stiffer.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_199_2.png)'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# # 六自由度机械臂的运动规划及仿真分析


    本文以工业六自由度机械臂为研究对象，针对其运动规划问题进行了深入分析。首先，基于D-H参数法建立了机械臂的运动学模型，并求解了正逆运动学问题；其次，采用笛卡尔空间和关节空间相结合的规划策略，对机械臂的轨迹进行了规划；最后，利用MATLAB/Simulink平台进行了仿真验证。仿真结果表明，所提出的运动规划方法能够使机械臂平稳、准确地完成指定任务，为实际应用提供了理论依据。


    | 关节 | 杆长(mm) | 偏距(mm) | 扭角(°) | 关节范围(°) |

    |------|----------|----------|---------|-------------|

    | J1   | 150      | 0        | -90     | -170~170    |

    | J2   | 560      | 0        | 0       | -85~85      |

    | J3   | 0        | 150      | -90     | -170~170    |

    | J4   | 0        | 650      | 90      | -180~180    |

    | J5   | 0        | 0        | -90     | -120~120    |

    | J6   | 0        | 100      | 0       | -360~360    |


    表1 六自由度机械臂D-H参数表


    在轨迹规划过程中，考虑到机械臂在运动过程中的平稳性和效率，本文采用分段多项式插值算法，对机械臂各个关节的角位移、角速度和角加速度进行了优化设计。实验结果表明，该算法能够有效抑制机械臂在运动过程中的振动和冲击，提高轨迹跟踪精度。


    为进一步验证运动规划算法的有效性，本文以某典型搬运任务为例，进行了仿真实验。仿真环境中的机械臂模型如图1所示。通过仿真获得了末端执行器的位置、速度随时间变化的曲线，结果表明末端轨迹平滑连续，满足作业要求。


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_200_0.png)'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'The arm should be re-drawn so that it ‘flows’ with the movement. Achieving
    a graceful movement as the arm moves into a resting position may require the bending
    of joints into impossible positions. This way of achieving fluidity by ‘cheating’
    is often called ‘the breaking of joints’. Imagine that the arm is a length of
    rubber hose and will flow through the movement initiated by the hand. This will
    look fluid but will also look odd, as though it’s lost the elbow and the wrist
    joint. To make it more convincing, take this piece of animation but add the elbow
    and the wrist joint to it. Bend the elbow or wrist joint in such a way that it
    follows the general bend of our rubbery arm. Don’t worry that the joints do something
    impossible. As long as the arm moves nicely, it doesn’t matter!


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_201_0.png)


    You can take this idea further when any of the limbs are moving at a very fast
    speed. The arms can lose their joints altogether and even be distorted along the
    length of the movement to suggest speed. This is referred to as ‘smearing’.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_201_1.png)'
  merge: -1
  img_proc: true
