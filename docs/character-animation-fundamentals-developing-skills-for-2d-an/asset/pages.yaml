- pgno: 292
  md: 'The computer will in-between the legs reasonably successfully but the back
    is left rammed straight. To alter this, do the breakdowns (the minor in-betweens).
    Go to frame 3, select ‘BodyControl’ and lift the body up. Save a key, then rotate
    ‘BodyControl’ to position the front part of the body lower than the back. It will
    play back your animation you will have to drag the dips at the front as it puts
    all its weight at the front onto the leading leg. As the back it raises its bottom.
    Then go to frame 15. At this frame the body will be positioned exactly the same
    as in frame 3. So, select, move and rotate ‘BodyHandle’ so that the body is in
    the same position at frame 15 as at frame 3.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_292_0.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_292_1.png)


    Frame 3 (2)


    Frame 15 (14)


    Next sort out frames 9 and 21, in which the front part of the body is higher than
    the back. Lower and rotate ‘BodyControl’ upwards to increase the height at the
    back.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_292_2.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_292_3.png)


    Frame 9 (8)


    Frame 21 (20)'
