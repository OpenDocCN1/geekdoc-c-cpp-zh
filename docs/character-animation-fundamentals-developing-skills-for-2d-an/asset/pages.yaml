- pgno: 101
  md: 'Click Play. A bit quick, isn’t it? So, we have to give our drawings extra frames.
    Experiment with prolonging the number of frames that each of the drawings is held
    for.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_101_0.png)


    As a guide, arrange your drawings on the X-sheet as shown below. Note down in
    the ‘action column’ what is happening and where. If the ball hits the ground at
    frame 22, write ‘ball hits ground’ in the row that corresponds with frame 22.
    This is called ‘slugging out’ and is good to do so that you get a feel for the
    timing. After a while you will be able to fill in the column before you even start
    animating!


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_101_1.png)'
