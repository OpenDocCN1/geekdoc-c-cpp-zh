  md: '# The 3D Dog Walk or Run Cycle


    Take out your drawings for the 2D dog walk cycle (or have a look at the illustrations
    in the 2D section of this chapter) for reference.


    To help with this exercise, create some small blocks and position them alongside
    the dog at intervals of 2 units for Maya (or 20 units for 3D Studio Max). These
    will act as markers to guide where the feet will go.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_290_0.png)


    Make the scene one frame longer than the drawn walk or run cycle and make the
    last key position at the last frame identical to the first key position at the
    first frame (just like in the main walk or run cycle exercise). The dog walk is
    24 frames long so the animation needs to be set to 25 frames. The first frame
    (frame 1) and the last frame (frame 25) are the same and have a stride at the
    front and a crossover at the back.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_290_1.png)'
