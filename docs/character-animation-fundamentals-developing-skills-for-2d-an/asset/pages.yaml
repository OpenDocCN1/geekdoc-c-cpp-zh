- pgno: 386
  md: 'The model is basically the same as the model of the man we used earlier but
    with a mouth and eyebrows. The mouth can be morphed to produce different mouth
    shapes (each program uses a slightly different method) and the eyebrows are moved
    by bones inside them. I’ll go into more detail about how to morph the mouths in
    each individual program later in the chapter.


    The majority of facial expressions can be done with a minimum of 11 basic mouth
    shapes and variation in the position of the eyebrows. The same basic mouth shapes
    can be used to speak the majority of words.


    These are ‘neutral’, ‘smile’, ‘frown’, ‘big smile’, ‘big frown’, ‘oh’ (as when
    you say the word ‘pot’), ‘ooo’ (as when you say the word ‘pool’), ‘anger’, ‘yuk’
    (as in disgust or contempt), ‘fvbpm’ (the bottom lip is tucked under the top lip
    when you say each of these consonants) and ‘Elvis’ (one corner of the lip is pulled
    up).


    Take out your animation drawings of your expression change acting (or copy the
    positions from the illustrations in this chapter). Work out the body language
    and the eyebrows first by setting keys for the whole body and head all the way
    through the scene.


    The eyebrows have bones (joints) running through them and can be rotated and moved.
    They can have keys saved on them as with any other bones. They are called ‘R_Brow’
    and ‘L_Brow’. The bones within them are called ‘R_BrowBone01’, ‘R_BrowBone02’
    etc.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_386_0.png)


    To one side of the man there is a pile of mouth shapes. These are the reference
    shapes that the mouth on the face of the man can morph to. Always keep them out
    of scene, otherwise you end up with strange mouths floating around.


    For the ‘face_acting_3D.avi’ example, the mouth shape is a frown between frames
    1 and 31. It is then neutral for frames 33 and 35. It is a smile between frames
    37 to 41 and then becomes'
