- pgno: 331
  md: 'When using full animation, some actions are more difficult to animate than
    others. The subtle movements made when somebody is sitting down and doing nothing
    other than thinking can be difficult to animate well. Animating a swash-buckling
    sword fight is much easier to do because of the complexity and speed of the action.
    There’s only one thought going through the head of a sword fighter – “how do I
    swing at my opponent again?”. However, a character who is falling in love has
    hundreds of thoughts going through their head. To convey these emotions and thoughts
    you’ve got to animate them all bubbling to the surface. Similarly, it’s much easier
    to act out a sword fight in the form of your full-length mirror than it is to
    portray a believable love scene. This is because complex action is very different
    from complex acting.


    Full animation also demands a good use of timing and a sense of design for the
    overall screen image. For this kind of film making you not only have to know when
    to slow your animation down and when to speed it up but also when to hold back
    with your background animation and when to exaggerate. It’s all very well having
    the most brilliant animation in the background but if it distracts the eye from
    the main purpose of the scene it’s worse than useless.


    # Mime


    It is worth looking at and studying mime artists. If they are performing well,
    they have amazing control of their bodies and are able to convey emotions with
    the smallest gesture. The whole body can portray emotion. For example, a head
    hung low, shoulders drooped, body bent over and legs dragging the feet suggest
    depression. Folded arms and legs suggest somebody that is lying or feeling uncomfortable.
    Somebody who is happy will walk with a spring in their step and their movements
    will be quicker and quicker.


    Mime is used in a lot of European animated films. Mute films can be viewed by
    a larger global audience, which is why they are so popular around the world.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_331_0.png)


    # Analysis of a Character


    The basic idea is to live and breathe your character – act out everything your
    character has to do – and present it to an audience so they understand what makes
    that character tick. One of the best things to do before you start animating is
    to write down a list of the main character traits of the character you are about
    to animate. On a professional animation project, your director has, hopefully,
    already done this and will be able to brief you before you start animating. When
    you’re working on your own project you’ll have to do it for yourself.


    > > MY CHARACTER IS:

    > > GREEDY.

    > > A COWARD.

    > > THE KIND OF PERSON DISASTERS HAPPEN TO.

    > > SELFISH.

    > > (MY GOD! IT’S ME!)'
  merge: -1
  img_proc: true
- pgno: 332
  md: 'Make sure you also have a good collection of model sheets to work from. A model
    sheet is a collection of drawings on one page (or several pages) that show front,
    back, side and three-quarter views of the character. It could also include head
    shots of the same character showing different emotions.

    Finally, remember that actors have drawn inspiration from animation, as well as
    the other way round. Laurence Olivier based his portrayal of Richard III, in the
    film of the same name, on the wolf in Disney’s *Three Little Pigs*.


    # Exercises


    # *Animating Acting in 2D*


    In the exercise below, the character spots a coin on the floor, looks around and
    quietly pockets the money. As with all the exercises, this is only a guide to
    follow – other possibilities include picking an apple out of a tree, a book off
    a shelf, a cake off a plate or even picking somebody’s pocket. The aim is to have
    a character see something, spot it and sneakily take it.


    Have a character standing in medium shot, slightly to one side of the screen.
    To the character’s side on the ground is a coin. The character is going to see
    the coin, sneakily look from side to side, pick up the coin, look at it and then
    pocket it. Act the sequence out in front of a mirror and draw a series of thumbnail
    pose sketches of the major key positions (or have a look at the illustrations
    below). Shoot the thumbnail sketches as a basic line test, then take a look at
    ‘coin_thumbs.avi’ in animations009, Chapter 9 on the website.


    Once you’re happy with the timing of the thumbnails, draw them full size and think
    about the minor key positions. These are the smaller movements your character
    makes when in a pose. They are also the anticipatory movements out of one position
    and the overshoot positions into another. Remember to slug out these actions in
    the action column on your X-sheet.


    Between the equivalent of the first thumbnail sketch (character standing) and
    the second thumbnail sketch (character looking at coin), have the character straighten
    up, glance down at the coin, do a double-take and then do a big look at the coin.
    Key 1 (frame 1) is basically the same as the first thumbnail sketch: the character
    is standing center screen. Key 2 (frame 11) is at the highest point of the straightening
    up.


    Key 3 (frame 33) is at the point where the character finishes glancing at the
    coin. Key 4 (frame 37) is the anticipation of the second look. Key 5 (frame 45)
    is the big look at the coin and is the equivalent of the second thumbnail sketch.


    Between the equivalent of the second thumbnail sketch (key 5, frame 45) and the


