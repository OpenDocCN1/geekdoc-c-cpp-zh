- pgno: 260
  md: "Think of the body staying in the same position on the piece of paper: it can\
    \ go up and down but not backwards and forwards.\n\nStart with the two stride\
    \ positions. They are basically mirror images of each other. Make sure that you\
    \ take into account perspective when you draw each of these. This will prevent\
    \ the character from strobing.\n\nTake a look at any of the ‘...walk_2D.avi’ files\
    \ in Chapter 5 on the website. Have a go at animating several of the different\
    \ walk cycles.\n\n# *The Walk or Run Cycle*  \n*Exercise in 3D*\n\nBecause there\
    \ is nothing new to learn in either of the 3D computer programs covered in this\
    \ book, I will only give a very general guide as to how to animate a walk cycle\
    \ in 3D.\n\n![](img/49afe0fca1d8f7ebd02f6839692b55f6_260_0.png)\n\n![](img/49afe0fca1d8f7ebd02f6839692b55f6_260_1.png)\n\
    \nFrame 1.\n\nTake one of your animation drawings for the walk or run cycle (or\
    \ refer to the relevant illustrations in this book). We are only going to animate\
    \ two strides (one complete cycle) and then loop the animation on playback. Our\
    \ man will be walking on the spot, sliding his feet backwards along the ground\
    \ and then picking them up to cross them over and bring them forwards.\n\nIn order\
    \ for this to work correctly, we need to set the length of the scene to one frame\
    \ longer than the drawn walk or run cycle. For example, if we are animating ‘basic_walk_2D.avi’,\
    \ which is 24 frames long, we need to set the length of the animation on your\
    \ chosen computer program to 25 frames.\n\nLoad your man model and move him into\
    \ the first key position at the first frame of your animation. This will be a\
    \ stride. Set a key for this position. Go to the last frame and, without moving\
    \ anything, select your model (or the individual sections that you moved at the\
    \ first frame) and set a key.\n\nMove to the frame of the next stride key position\
    \ and move your man into the position of this stride, setting keys as you do so.\
    \ For example, in ‘basic_walk_2D.avi’, this will be at frame 13. Playing the animation\
    \ will give the impression of a man sliding his feet backwards and forwards on\
    \ the floor.\n\n![](img/49afe0fca1d8f7ebd02f6839692b55f6_260_2.png)\n\n![](img/49afe0fca1d8f7ebd02f6839692b55f6_260_3.png)\n\
    \nFrame 13."
