- pgno: 46
  md: 'When you have adjusted the X-sheet, click the **Play Forwards** button on the
    main screen. How does your animation look? It will be jerky, but at this stage
    that doesn''t matter. The important thing is to work out the timing. You have
    to imagine what it will look like when it has all the in-between drawings included.
    (This is a skill that comes with experience. The more you animate and look at
    pose tests, the more adept you become at working out the correct timing.)


    If any of your key drawings appear to be playing for too long or too short a period,
    ‘hold’ them for less or more frames. With DigiCel FlipBook, highlight the drawing
    on the X-sheet by clicking on the image that you want to change the frame value
    of. Then click and hold on a second time and hold the mouse button down while
    holding down **Alt** on your keyboard. Drag the column up or down, depending on
    whether you want to increase or decrease the number of frames.


    When you are happy with the result, mark the key positions onto a paper X-sheet
    (photocopy the one included either print one from the folder X-SHEETS in Chapter
    1 on the web-site). Use the far-left Level column and a pencil. (These are marked
    here for temporary reference.) If key drawing 1 (BG-1) starts on frame 1 of the
    DigiCel X-sheet, mark it into frame 1 of the paper X-sheet. If key drawing 2 (BG-2)
    starts on frame 9 of the DigiCel X-sheet, mark it onto frame 9 of the paper X-sheet,
    and so on. If the animation is on twos we need to know where these will be during
    the sequence. In the far-right Level column, mark in the correct drawing numbers;
    that is, drawing 1 on frame 1, drawing 3 on frame 3 etc.


    You can now re-number your key drawings by the


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_46_0.png)


    | FRM NO. | LEVELS | CAMERA |

    |---:|---|---|

    | 1 | K1; 1 | L2 / FIELD / CENTER |

    | 2–8 |  | 3, 5, 7 |

    | 9 | K2; 9 | 9 |

    | 10–16 |  | 11, 13, 15 |

    | 17 | K3; 17 | 17 |

    | 18–23 |  | 19, 21, 23 |

    | 24 | K4; 24 | 25 |

    | 25–28 |  | 27, 29 |

    | 29 | K5; 29 | 31 |

    | 30–32 |  | 33, 35 |

    | 33 | K6; 33 | 37 |

    | 34–36 |  | 39 |

    | 37 | K7; 37 | 41 |

    | 38–40 |  | CUT |

    | 41 | K8; 41 | ↓ |

    | 42–50 |  |  |'
  merge: -1
  img_proc: true
