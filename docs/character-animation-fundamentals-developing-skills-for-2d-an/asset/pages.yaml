- pgno: 156
  md: 'the two diamond handles is ''RightHeelControl'' or ''LeftHeelControl'', and
    controls the rotation of the heel. The smaller of the two diamonds controls the
    rotation of the toe. Have a go at rotating the heel and the toe.


    The arms are much simpler; you can control the positions of the hands by selecting
    the diamond shapes located at the wrists. These are called ''LeftArmControl''
    and ''RightArmControl''.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_156_0.png)


    The other four handles worth knowing about are ‘rkneelocator’, ‘lkneelocator’,
    ‘relbowlocator’, and ‘lelbowlocator’. These can move the knees and the elbows
    of your man from side to side. You will have to keep moving these locators from
    one key position to the next, otherwise they get left behind.


    As a general rule, move (translate) locators and IK handle controls and rotate
    the individual joints of the skeleton. If you try to rotate a locator or IK handle,
    nothing will happen. If you try to move (translate) a joint, it ends up doing
    some very strange things.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_156_1.png)'
