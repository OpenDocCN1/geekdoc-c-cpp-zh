- pgno: 160
  md: 'We are now at key position 1.


    If you have been setting keys as you have been going along (or if you have been
    using **Auto Keyframe**), you have now saved a key at frame 1. If not, select
    the elements you have moved and press **S** on your keyboard for each one to save
    a key. It would also be a good idea to set a key on all the back, neck, shoulder,
    wrist, finger and thumb bones.


    One key position down, nine more to go!


    The second key position is on frame 9 and is the ‘anticipation’ position. The
    body, arms and head are raised slightly.


    Move the Time Slider to frame 9. Select ‘BodyHandle’, click the Move tool and
    move the body upwards slightly. Press **S** to set a key. Select ‘RarmControl’
    and ‘LarmControl’ to move the arms up (set a key). Keep referring to your drawn
    animation (or the illustration in the 2D lift section) for the position of your
    man. You can also keep playing back your animation by clicking on the Play button
    or by scrubbing your mouse backwards and forwards over the view panel with **K**
    pressed on your keyboard. Think of this as being like flipping, flicking and rolling.
    Always make sure you are back on the correct frame before you set a key!


    Select ‘leftwrist’ and rotate the wrist until you get a position similar to the
    key drawing (set a key). Do the same for ‘rightwrist’ (set a key).


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_160_0.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_160_1.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_160_2.png)'
