- pgno: 342
  md: 'best 3D animated characters you have seen in movies would have been sculpted
    in clay first and then scanned into the computer. They would then have been ‘cleaned
    up’ and tweaked to make them look better.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_342_0.png)


    Finally, draw up a plan and elevation diagram of your character – straight-on
    front and straight-on side views. We are going to scan this into the computer
    as a .jpeg and set it up in the 3D environment. It will then be used as reference
    for your model. Stick the arms out to the side (all 3D models seem to be built
    this way).


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_342_1.png)'
  merge: -1
  img_proc: true
- pgno: 343
  md: 'Make sure that the plan and elevation views of your character match up correctly.
    The top of the eye, the bottom of the chin, the bridge of the nose, the arms,
    the legs and so on should line up.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_343_0.png)


    Next learn some anatomy. Look at how a face is constructed in terms of muscles
    and bones.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_343_1.png)


    You then need to draw the structure on your character in the form of four-sided
    shapes (quads) within a wireframe (also known as the topology). This is so that,
    when we start creating a model, we know where to position the mesh. You need to
    follow the natural creases of the face and body'
  merge: -1
  img_proc: true
- pgno: 344
  md: 'and take into account the muscles underneath the skin. You only need to do
    this for the front of the face, but put some creases on the side of the face as
    well. You will need to work out the front, back and sides of the body.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_344_0.png)


    After all of this, you can finally switch on your computer. When building your
    character think how you can divide it up into bits. It’s always going to be a
    lot easier to work on small bits one at a time rather than a whole character.
    So, the head can be one part of the model, the torso another, the arms another
    and so on. Think of them like these children’s toys that have one piece of colored
    plastic for the head, another piece for the hair and so on.


    The reason why this makes life so much easier is that you can apply a texture
    or color to each individual component, rather than having to paint a huge complicated
    texture map to apply to the whole character.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_344_1.png)'
  merge: -1
  img_proc: true
