- pgno: 390
  md: 'Open up the Blend Shape window by going to the main menu and selecting **Window
    > Animation Editors > Blend Shape**. In the Blend Shape window is a series of
    sections called **BlendShape1** through to **BlendShape10**. These are the controls
    that relate to the different basic mouth shapes.


    They can be maximised or minimised by clicking the triangle next to the particular
    **BlendShape**.


    Maximise one of them and you will see that it consists of a slider and several
    buttons that relate to creating and deleting keys. Move one of the sliders and
    the mouth on the face of the man will change. We create animation of the mouth
    by moving the Time Slider to the correct frame and then moving a **Blend Shape**
    slider to a position where the mouth is the right shape and then setting a key
    by clicking the Key button underneath the **Blend Shape** slider. You can change
    the value of several of the **Blend Shape** sliders to get almost any mouth shape
    you could ever want.


    Go through your animation and at the appropriate points change the shape of the
    mouth to suit your drawings (or the illustrations in the 2D exercise in this chapter).
    Keep experimenting with different mouth shapes until you have something you are
    pleased with. Then take a look at ‘face_acting_3D.avi’, animations010, Chapter
    10 on the website.


    # Animating Mouths with the Morpher in 3D Studio Max


    First animate the body, head, eyes and eyebrows.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_390_0.png)


    Select the mouth in one of the views and make sure the **Modify** tab is selected
    in the Command Panel. Make sure **Morpher** is selected in the Modifier Stack.
    In the **Channel List** there is a list of all the mouth shapes (apart from ‘oh’,
    which is the mouth shape you get to start with). Next to each of the mouth shapes
    are boxes that have percentages in. When you vary the percentage number in the
    box, the mouth on the man’s face will morph into the mouth shape named by the
    box (0 means 0% of the mouth shape and 100 means 100% of the mouth shape). Have
    a practice by changing the percentages of one of the mouth shapes.'
  merge: -1
  img_proc: true
