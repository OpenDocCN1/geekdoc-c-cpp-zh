- pgno: 165
  md: 'the ball just before he picks it up, there is a strange wobble on his left
    arm, there is a strange evenness to the movement and there are two balls! We haven''t
    given the computer enough information to in-between the keys properly. Now we
    need to do the major in-betweens (otherwise known as the breakdowns).


    Open up the Graph Editor (**Window > Animation Editors > Graph Editor**) and then
    select every node in the Hypergraph. In the Graph Editor window will appear a
    large number of animation curves. So that we can view the animation without the
    computer in-betweens, we need to convert these animation curves from spline to
    stepped (this is the same as viewing the keys of our drawn line test). This means
    that when the animation is playing the curve will turn horizontally from one key
    frame to the next and then run vertically up it. Your animation will become a
    series of key positions that jump from one to the next. To convert the curves,
    in the Graph Editor go to **Tangents** in the menu and select **Stepped**. All
    of those wavy animation curves become nice and neat and straight!


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_165_0.png)


    The first thing we can do is sort out the visibility and the invisibility of our
    two balls. Deselect everything (by clicking away from the man in one of the views)
    and then select the ball on the ground (nurbsSphere1). Open up the Graph Editor
    and you will be confronted with the animation curves that refer to the movement
    of that ball. Under the word ''nurbsSphere1'' in the explorer part of the Graph
    Editor window, select Visibility. This will show a black line with a value of
    1 and'
