- pgno: 129
  md: 'It''s a good idea to have a go at sculpting your character first in modelling
    clay. This way you can get a good ‘feel’ for your character and you can also save
    a hell of a lot of time selecting and moving points on your model. Look at it
    from all sides. Hold it up in front of a strong light source. Does it throw up
    good silhouettes? Have a go at sculpting all the facial expressions you think
    your character will pull.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_129_0.png)


    A texture map is a flat piece of artwork that is wrapped around your model. For
    example, it could be the skin of your character’s face with areas around the eyes
    and cheek bones shaded and stubble on the chin. When it comes to applying textures
    to your character, think about the texture map’s construction. If your character’s
    trousers are separate objects from its torso, using a texture map makes it a lot
    easier to color them different colors. Painting a texture map for an entire character
    is a lot more difficult. So, the head could be one object. The torso and arms
    another. The hands would be separate objects, as would the legs and feet.


    Try to avoid the ‘Christmas wrapping paper’ effect. This is where a texture bares
    absolutely no relation to the model it has been applied to. It ends up looking
    like a gift very tightly wrapped in highly patterned paper.


    Lastly and most importantly, make sure your model will do everything that is required
    of it to act out the script of your movie. In other words, write the script first.
    If your character is required to reach up and grab something off a tall shelf,
    make sure their arms are long enough to reach. For some reason, taller thinner
    characters seem to be easier to animate than shorter, fatter ones. Maybe it’s
    because they can produce stronger silhouettes, which means you can get a pose
    over to an audience quicker. Maybe it’s because you can’t fit as much ‘clutter’
    onto a thinner character so there’s less to distract from the movement.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# Complexity


    Decide how much animation you wish to do. In ''full'' animation (the kind of animation
    that you will see in feature films, where the character is moving all the time)
    the characters tend to be simpler. There will be few buttons, frills or details.
    Too many details will distract the eye and can cause ''full'' animation to look
    clumsy. It also takes a considerable amount of time to animate a waistcoat full
    of buttons throughout an entire film. Disney knew this in the 1930s. It was estimated
    that each button on a character would cost several thousand dollars for the length
    of a feature film.


    For limited animation (the kind of animation that you see in television series,
    where the characters tend to stop and start or jump from one strong pose to another),
    characters can be more complicated, mainly because they won''t be moving as much.


    This is also true of 3D animated characters. The more textures and details you
    add to your model, the more difficult it is to ''read'' what the character is
    doing. Also, the more complicated the character, the more difficult it is to achieve
    elegant animation.


    # The Graphic Nature of the Character


    The more complex the character is, the slower the animation has to be. A simple,
    flat graphic character that consists of blocks of color will ''read'' (the audience
    will understand what it is doing) more quickly than a complicated 3D one. For
    the same reason that adding lots of details affects the speed at which you can
    animate a character, the flat, graphic character can be moved at a faster pace
    than the complicated 3D one. This is because there is so much more to look at.
    With a 3D character, you''ve got shadows and highlights, color and texture, and
    various details that you may have added as well as the animation.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_130_0.png)'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'Line drawings also need more time to ‘read’ than coloring animation. When animating
    for a black and white sequence (or if you are going to convert the movement to
    3D), make the animation for the test slightly slower than you think it should
    be. If the line test is going to be colored using flat colors, make the line test
    slightly faster.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_131_0.png)


    The shapes of the character will also affect how it animates. Characters made
    from rounded shapes tend to be easier to move in 3D and easier to make strong
    poses with. The rounded shapes also suggest softness. Angular characters made
    from hard, sharp shapes look clumsier when moving and tend to look more aggressive.


    The type of animation used also influences the pace of the animation. 2D drawn
    animation is suited to a fast, frenetic pace. It is not very good for slow-moving,
    subtle close-ups of a character’s face. However, clay or puppet animation works
    better with subtle, slower, close-up movements and is not so good at the fast,
    frenetic stuff. Computer 3D animation has both the advantages and disadvantages
    of these two disciplines. It can move faster, while more fluidly than clay or
    puppet animation, but is not as good with the subtle, close-up work. It is better
    at close-up work than 2D drawn animation, but is not as good with fast, fluid
    or aggressive movements.


    Please remember that these are very general rules and that there are many brilliant
    exceptions to them.


    # Strong Silhouettes


    When drawing your key positions, make sure they have good silhouettes. If you
    were to black out the character, would you still be able to understand what the
    character was doing? If the answer is yes, this will help the audience to understand
    what is happening faster.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_131_1.png)'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'When animating in 3D, always think of the camera angle that your final animation
    will be viewed from and make sure that you have good, strong silhouetted poses
    that work from that angle. Don''t do the animation and then sort the camera angle
    out later. If you want to do a flying camera move, make sure that every frame
    is well-composed during the sequence.


    # ## Weight and Balance


    For your audience to believe that your character is a living, breathing being
    (rather than graphite scraped onto paper or a collection of pixels on a screen),
    you need to follow a few basic rules. Two of these are: give your character weight
    and ensure your character is balanced correctly.


    # ## Gravity


    Assuming we are animating a character on planet Earth, the first thing it has
    to deal with is gravity. In the same way that our bouncy ball falls to the ground
    and bounces when rolled off the roof, so our character will fall to the ground
    and bounce (though rather less) if it jumps off the roof. Similarly, if the character
    jumps into the air, this takes effort and will always result in the character
    falling back to earth.


    Every object (including our character) has a center of gravity. With our ball
    this would be in the exact center. With a character it will be roughly at the
    bottom of the rib cage (about the center of the body). If the object or character
    is taller, the center of gravity will be higher. If the character is shorter,
    the center of gravity will be lower.


    A character''s center of gravity is not always in the same place. It will change
    position as the character changes its body posture.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_132_0.png)


    # ## Balance


    The stability of an object is affected by its shape. The wider the base, the more
    stable it will be. For example, a cube is a very stable object. It is difficult
    to push over or roll down a slope.


    A ball, on the other hand, is much less stable. It is easy to push along or roll
    down a slope. Because of this instability, it is much more susceptible to the
    forces of gravity.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_132_1.png)'
  merge: -1
  img_proc: true
