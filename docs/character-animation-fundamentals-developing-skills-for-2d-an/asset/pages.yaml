- pgno: 372
  md: 'When moving a head quickly, it’s fine to distort it along the path of movement,
    but always keep the cranium the same shape and size. Distort the cheeks, jowls
    and jaw. Have a look at ‘distorted_head.avi’, animations010, Chapter 10 on the
    website.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_372_0.png)


    # Head Angle


    The head moves in an arc in relation to the neck and shoulders. The expression
    on the face is important but the angle of the head has to be right. Angling the
    head forwards but upwards indicates a willingness to engage; either the character
    is interested in something or wants to challenge it head on. Angling the head
    forwards and downwards can give an argumentative or determined look. It can also
    give a tired or stupid impression.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_372_1.png)'
  merge: -1
  img_proc: true
