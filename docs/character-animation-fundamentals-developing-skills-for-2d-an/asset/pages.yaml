- pgno: 323
  md: 'Once you’ve worked out these major poses and the minor key positions (the anticipations
    out of a position and overshoots into a position), think about things that you
    can get your character to do while in those poses. Move your character through
    a pose in such a way as to emphasise what the character is doing. If your character
    is looking off to screen right, move the character into that position and then
    move them slowly forwards a small amount while looking.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_323_0.png)


    Think of the most extreme position as being one key position and the position
    that the character moves to as another key position. Do some timing charts to
    work out where to place the in-betweens and then complete the in-betweens.


    Make sure that when you do the in-betweens different parts of your character move
    at different rates depending on the item you are animating. For example, the drapery
    will follow through the main movement of the character. One way to do this is
    to roughly animate one part of the character (e.g. the main movement of the body)
    all the way through the scene and then go back and animate a different part of
    the character (e.g. the drapery). This technique is referred to as building the
    animation up as layers.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_323_1.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_323_2.png)'
  merge: -1
  img_proc: true
