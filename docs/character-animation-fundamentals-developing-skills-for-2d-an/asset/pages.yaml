- pgno: 421
  md: '# ‘F’


    When the mouth is making an ‘F’ sound, the bottom lip is tucked under and bitten
    by the teeth. Most of the sound comes from air hissing out from between the teeth
    and the lips. The shape of the top lip varies depending on the mood of your character.
    When he is happy or relaxed, the top lip is relaxed and almost covering the teeth.
    When he is angry or aggressive, the top lip is tensed up and pulled back to reveal
    the teeth – for example, when saying a certain four-letter word. When animating
    into the next sound, the teeth are raised and the bottom lip is flicked forwards
    and downwards into the next mouth shape.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_421_0.png)


    # ‘V’


    As with ‘F’, the bottom lip is tucked under the teeth, but not as much. The sound
    made is a mixture of hissing air between the teeth and the lips and a humming
    sound. When animating out of a ‘V’ sound the bottom lip doesn’t pop out as far
    as with an ‘F’.


    # Vowels


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_421_1.png)'
