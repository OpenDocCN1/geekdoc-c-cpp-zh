- pgno: 48
  md: 'The next stage is to work out the in-between drawings and place a timing chart
    at the bottom of each key. Remember that, to show increased speed as the ball
    is dropped, the drawings will be further and further apart.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_48_0.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_48_1.png)


    The above illustration shows the timing charts for all the keys and the correct
    numbering. As the ball bounces up, it will accelerate to the maximum speed and
    then start to slow as gravity takes over and it reaches the apex of the bounce.
    As the ball hits the ground for the second time, it will squash slightly less
    (having fallen from a lower height). This pattern is repeated for the remaining
    bounces. Each bounce will be lower and lower until the ball comes to a stop.


    Complete the in-between drawings for the sequence by following the timing charts
    and then line test it (shoot each drawing for two frames each). You may have or
    may want to work out your own timing for the sequence. The finished piece of animation
    should be similar to ''ball-drop.avi'' in animations001, Chapter 1 on the website.


    # How to Relate Your 2D Animation to Your 3D Animation


    +   - Once you''ve worked out the basic timing of your animation in 2D, you can
    go on and do the animation in 3D. The basic premise is the same: you create key
    positions in the 3D program just as you would in 2D, and then you let the computer
    do the in-betweening for you. Sounds easy? If only it were that simple! You will
    probably have to adjust the way in which the computer in-betweens the object you
    have moved. Usually this is done by adjusting the animation curves (more about
    this later).


    First you need to know 13 basic things about your 3D program.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# # The 13 Things You Need to Know About Maya


    # ## 1 Maya Screen Basics


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_49_0.png)


    # ## 2 Maya Keyboard Shortcuts


    # ### Views Shortcuts


    +   - **Alt** + Left mouse button = Tumble (only in perspective view)


    +   - **Alt** + Middle mouse button = Track


    +   - **Alt** + Left mouse button + Middle mouse button = Dolly


    +   - **Alt** + **Ctrl** + Left mouse button and drag a box = Box dolly


    +   - **A** = Frame all


    +   - **D** = Rough, medium and fine display of model


    +   - **Space bar (quick tap)** = Takes you from one set of view panels to full
    screen on the selected view panel


    # ### Animation/Manipulation Shortcuts


    +   - **S** = Set key


    +   - **E** = Rotate tool'
  merge: -1
  img_proc: true
- pgno: 50
  md: '+   R = Scale tool

    +   W = Translate tool


    # Playback Shortcuts


    +   - Alt + V = Playback animation

    +   - K + Left mouse button + drag = Scrub animation

    +   - . + Alt = Move one frame forwards

    +   - , + Alt = Move one frame back

    +   - . = Go to next key

    +   - , = Go to last key


    # 3  Setting Up Animation Preferences in Maya


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_50_0.png)


    Click the Animation Preferences button (bottom right of screen) and up will come
    the Preferences window. In the Categories section select Settings and set Time
    to PAL (25 fps). Then, in the Categories section go to Timeline and specify a
    Playback Speed of ''Real-Time'' (25 fps).


    # 4  Creating Basic Objects in Maya


    Go to the main menu and select Create and then select the sort of object that
    you want to create. For example, NURBS Primitive > Sphere. This will then create
    a sphere of a default radius of 1.'
