    Set the **In** and **Out** buttons to ‘Handles’ (as shown in the illustration).
    Click the **Advanced** button to reveal several number boxes relating to the X,
    Y, and Z positions.


    Click the padlock button next to the Z **In** and **Out** boxes. In the **Function
    Curve** section of the **Track View** window, click and drag the handle emerging
    from the right-hand side of the key position at frame 29 on the Z function curve
