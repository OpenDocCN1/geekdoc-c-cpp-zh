- pgno: 314
  md: 'When thumb and all the fingertips of each hand are pressed together and the
    hands are held upright, this gives an impression of superiority. It is usually
    done when the character is talking or, more accurately, pontificating. It''s a
    bit smug and suggest that the character is a ''know it all''. When somebody is
    listening attentively to something the thumbs and fingertips can be pressed together
    but the hands will be held downwards.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_314_0.png)


    Rubbing the thumb and fingers together suggests money!


