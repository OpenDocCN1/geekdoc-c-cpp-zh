- pgno: 356
  md: 'With a standard blink, the eyelid will close slowly and open quickly. By making
    the eyelids pop open quickly, the character looks alive and awake.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_356_0.png)


    When somebody is sleepy or not very bright, the eyelids will shut slowly and open
    very slowly, with a lot of drag on the lids. This gives the impression that opening
    the eyes is a huge effort.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_356_1.png)'
