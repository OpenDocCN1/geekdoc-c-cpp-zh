- pgno: 152
  md: 'You then need to move your man into each of the major key positions at the
    appropriate frame numbers and tweak the way the computer does the in-betweens,
    either by adding extra key frames (breakdowns) or by manipulating the animation
    curves appropriate to your program.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_152_0.png)


    As with the drawn animation, you will need to add some extra key positions to
    improve the animation. Set these extra key positions at the equivalent of the
    breakdown positions of the drawn animation.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_152_1.png)'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'Between key position one and key position two, make the hands ‘drag’ a bit
    to make the wrist movement seem more fluid.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_153_0.png)


    Between the second and third key positions, make the hand flail upwards as it
    moves out of the second key position. As the hand goes downwards towards the ball,
    make it move outwards (towards us) to give the idea that it is going to grasp
    the ball.


    Draw your previous key positions on an acetate sheet stuck on your screen as a
    guide to your animation.


    Have a look at ‘lift_3D.avi’, Chapter 3 on the website.


    # The Lift Exercise in Maya


    Copy the folder ‘mayaman’ onto the C: drive of your computer (or wherever you
    want to put it). Open up Maya, go to the main menu and select File > Open. In
    the ‘mayaman’ folder, find ‘mayaman.mb’ (if you have Maya 2010 or earlier) or
    ‘mayaman-circles.mb’ (Maya 2011 onwards). Highlight it and click the Open button.


    Select a view where you have a side view of the character that is similar to your
    drawings (or the drawings in the illustrations of this book).


    So that we can select parts of the body more easily, we need to open the Hypergraph,
    which is a window that shows all of the components of the 3D man in a graphic
    form. To open the Hypergraph click on Window on the main menu and then click on
    Hypergraph: Hierarchy.'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'You will be confronted with a window that has a large number of small boxes,
    some connected to each other, others on their own. If you can''t see all of these
    boxes, just press A on your keyboard and they will all instantiate/view. You can
    zoom in and out and pan around the Hypergraph in the same way that you move around
    the view panels of Maya.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_154_0.png)


    It all looks rather confusing, because the display consists of many ‘nodes’ that
    represent different parts of your man. However, there are only two areas of the
    Hypergraph to worry about. The first is the tall, connected hierarchy (a hierarchy
    is a collection of nodes joined together) in the middle of the Hypergraph window.
    This represents the skeleton of your man. You can select individual nodes of this
    hierarchy, which will in turn select individual bones in your man’s skeleton.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_154_1.png)'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'At the very top of this hierarchy is a handle (called ‘BodyHandle’) connected
    to the base of the spine. If you select this you select the entire skeleton and
    can move the man as a whole or rotate him at the base of the spine. (On the man
    the handle appears as a circle that runs through the middle of his body.)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_155_0.png)


    The second area of the Hypergraph to concern us is the collection of smaller hierarchies
    to the right of the skeleton hierarchy.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_155_1.png)


    The hierarchy labelled ‘EyeHandle’ on the top node controls the eyes. The six
    hierarchies labelled ‘IK Handle’ at the top are to do with the mechanics of the
    articulation of the inverse kinematics of the leg and can be ignored.


    The nodes that do matter are the hierarchies labelled ‘RightFootControl’ (right
    foot control) and ‘LeftFootControl’ (left foot control). The foot has a square
    and two diamond handles attached to it. The square is the node ‘RightFootControl’
    (or ‘LeftFootControl’) in the Hypergraph and is used to control the whole foot.
    The bigger of


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_155_2.png)'
