- pgno: 190
  md: 'This relative flinging of the body backwards acts as an anticipatory movement
    and gives the audience something to latch onto prior to and during the major movement.


    # Anticipation During a Movement


    As with the sudden movement discussed above, anticipatory movements don''t have
    to happen before a movement; they can happen during a movement as well.


    If somebody is moving their arm to pick something up, as the hand approaches the
    object it may pause and pull back slightly, opening its fingers just before it
    grabs the object. The arm as a whole is moving all the time, but the hand relative
    to the arm is moving backwards (anticipatory movement) and then forwards (major
    movement).


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_190_0.png)


    If a character is running and wants to change direction, he could twist away,
    still running, before executing the main turn. I always think of this in relation
    to driving a car and making a tight turn. In order to do this you have to initially
    steer outwards in order to increase your turning circle. The same is true of a
    four-legged character like a horse or a dog.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_190_1.png)'
  merge: -1
  img_proc: true
- pgno: 191
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 192
  md: 'This is a very cartoon-like trip and, hopefully, will make an audience laugh.
    A more naturalistic trip will look something like the illustration below. An audience
    seeing this trip will not laugh – they will think ‘ouch’!


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_192_0.png)


    # Varying the Amount of Anticipation


    This is to do with the amount that the body anticipates a given movement over
    the movement’s entirety. If a character is going to point with its arm, the arm
    is going to pull back in anticipation by a large amount. The body will pull back
    by only a small amount and the head (especially if the character is looking at
    something intently) may move by an even smaller amount.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_192_1.png)'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'If a character is going to make a movement that uses the entire body, the whole
    body will do an anticipatory movement. Any variation across the body will be relatively
    smaller.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_193_0.png)


    When animating a scene in which there will be several anticipations, try to think
    of different ways of doing each anticipatory movement. If they are all done in
    the same way, your animation will look very mechanical and repetitive.


    # Other Ways of Using Anticipation


    Anticipation can also be used with special effects animation. When something is
    struck by lightning, the clouds that generate the flash should light up at different
    patches. This will let the audience know that something is about to happen. Just
    before the bolt of lightning appears, have a white flash frame. Otherwise the
    audience misses the bolt of lightning.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_193_1.png)'
  merge: -1
  img_proc: true
