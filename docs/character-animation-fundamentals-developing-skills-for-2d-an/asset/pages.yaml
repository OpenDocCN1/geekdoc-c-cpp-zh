- pgno: 102
  md: '![](img/49afe0fca1d8f7ebd02f6839692b55f6_102_0.png)


    Play your key animation back. How does it look? It looks like the animation in
    ‘bowlingball_keys.avi’ (Chapter 2 on the website), you’re doing OK. If not, adjust
    the number of frames that each of the key drawings is played for until you are
    happy with it. Show it to other people: friends, loved ones or complete strangers.
    If they identify it as a bowling ball falling off a shed, you know you are on
    the right track. Above is an illustration of the bowling ball with the correct
    drawing numbers (the frame numbers that each of these balls should be captured
    on).


    Now you have to do the ‘in-between’ drawings. We will follow the same procedure
    as in Chapter 1 to change the preliminary numbering sequence for the key drawings
    to the correct sequence that includes the in-betweens. Note down the numbers for
    the key drawings on a paper X-sheet in column 6. In column 1, write the animation
    drawing numbers in every other frame. These will be the correct animation drawing
    numbers (we are going to be numbering our drawings by the frame). Transfer the
    correct animation drawing numbers across to the key drawings. So, key drawing
    1 will now be animation drawing 1 (corresponding with frame 1); key drawing 2
    will become animation drawing 17 (corresponding with frame 17); key 3 will become
    19; key 4 will become 21; and so on. Once you have re-numbered your key drawings
    with the correct animation drawing numbers, rub out the key drawing numbers on
    the paper X-sheet. See the illustration right.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_102_1.png)'
