- pgno: 146
  md: 'Between the first and second key positions (frames 1 and 9), make the hands
    ‘drag’ a bit to make the wrist movement seem more fluid.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_146_0.png)


    Between the second and third key positions (frames 9 and 19), make the hand flap
    upwards as it moves out of the second key position. As the hand goes downwards
    towards the ball, make it move outwards (towards us) to give the idea that it
