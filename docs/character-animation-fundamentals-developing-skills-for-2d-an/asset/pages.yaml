- pgno: 353
  md: 'Sometimes in animation we tend to only include ‘readable’ or ‘appealing’ facial
    expressions; however, it''s useful to include neutral – almost indistinguishable
    – expressions to complement these.


    # The Eyes


    It is commonly said that the eyes are the windows of the soul, and the main feature
    that makes a character seem alive is its eyes. If the eyes are not focusing on
    something, your character will look like a groggy doll. Always give your character
    something to look at, either on screen or off. The only times your character will
    be not looking at something are when their eyes are glazed and looking into the
    mid distance or they have crossed eyes (when they are thinking or have been drugged
    or knocked out and are dazed).


    The eyes will lead all movement of the face and body. When a character looks off
    screen, the eyes move first, then the head, then the shoulders and then the body
    will twist at the waist.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_353_0.png)


    Following are some examples of emotions and the different looks connected with
    them. When a character is thinking, they could look heaven-ward for inspiration
    or down at the ground when searching for an idea.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_353_1.png)'
