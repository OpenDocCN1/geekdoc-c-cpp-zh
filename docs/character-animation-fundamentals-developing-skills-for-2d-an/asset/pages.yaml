- pgno: 108
  md: 'Work out the timing charts for each key drawing. Use the illustration below
    for reference. Complete the in-betweens. All the drawings in this piece of animation
    are on twos.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_108_0.png)


    You may notice that on the timing chart between drawings 29 and 31 there is an
    X. This means that the ball half way between frames 27 and 33 has no drawing.
    The two inbetween drawings are positioned half way between the key drawings and
    the mythical X. So, drawing 29 is positioned a quarter of the distance nearer
    to drawing 27 and three quarters of the distance away from drawing 33. Drawing
    31 is positioned a quarter nearer to drawing 33 and three quarters further away
    from drawing 29. This will give the appearance of the ball moving faster in the
    middle of the movement.


    When you have drawn all the in-betweens, capture them and play them back. If your
    animation looks like ‘snowball_2D_anim’, animations002. Chapter 2 on the website,
    well done. If not, try to find where you’ve gone wrong. For example, if the ball
    spends too much time in the air, take a drawing out or hold one of the drawings
    for a single frame rather than a double. Don’t be afraid to experiment.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# ## Animating a 2D Beach Ball


    The beach ball sequence will be 120 frames long (in DigiCel, use the following
    settings: # of Frames: 120, Frame Rate: 25 and # of Levels: 2).


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_109_0.png)


    Follow the sequence for the bowling ball and soccer ball. This time, experiment
    with the timing. A beach ball will travel more slowly through the air than a football.
    It might roll slightly as it bounces on the ground and not bounce as high. It
    will crumple at the bottom when it hits the ground rather than squash like a soccer
    ball. Have a look at ‘beachball_keys.avi’ and ‘beachball_2D.animation002, Chapter
    2 on the website. As the beach ball bounces, there will be an in-between drawing
    just before it touches the ground. This slows the beach ball down. The reason
    we do this is to emphasize the lightness of the beach ball, suggesting that the
    air above the ground gives a small amount of resistance to such a light ball.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_109_1.png)'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# Animating a 2D Ping-Pong Ball


    A Ping-Pong ball will bounce quite high with fairly short distances between the
    apex of each bounce. It will not squash or stretch at all. The upwards bounce
    is quite quick. When it reaches the apex it slows before almost floating down
    to hit the ground. Adjust your in-betweens accordingly. Below is an illustration
    of the trajectory of a ping-pong ball. Once it hits the ground it bounces very
    quickly. To show this, the drawings between 19 and 56 will be on singles.


    Follow the sequence for the bowling ball and the soccer ball. The ping-pong ball
    sequence will be 100 frames long. In DigiCel, use the following settings: # of
    Frames: 100, Frame Rate: 25 and # of Levels: 2. (Have a look at ‘ping-pongball
    keys.avi’ and ‘ping-pongball_2D.avi’, animations002, Chapter 2 on the website.)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_110_0.png)


    # Animating a 2D Water-Filled Balloon


    This is probably the most difficult sequence to animate but it is also the most
    fun to watch when it’s working well.


    Work out the basic trajectory. Think of the water flowing around the inside of
    the balloon as it moves, pushing the balloon forwards.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_110_1.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_110_2.png)'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'The sequence will be 75 frames long. In Digi-Cel, use the following settings:
    # of Frames: 75, Frame Rate: 25 and # of Levels: 2.


    Start with the basic key positions of the balloon rolling down the shed roof.
    The in-between drawings of this sequence should be on singles. The illustration
    (right) shows the in-betweens from key 1 to key 5. The rest of the in-betweens
    of the balloon rolling down the roof will follow this pattern.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_111_0.png)


    Try to make sure the balloon doesn’t slide down the roof. Most forwards movement
    occurs at the point at which the balloon is most stretched. When stationary, the
    water rotating inside the balloon stretches the rubber slightly backwards, upwards,
    then ahead. As the water inside the balloon moves forwards it stretches the balloon
    and pulls it onward. Have a look at ‘waterballoon_keys.avi’, animations002, Chapter
    2 on the website.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_111_1.png)


    The water-filled balloon will fall quickly when it leaves the edge of the roof
    because it is very heavy. When it lands it will squash slightly more on one side
    than the other because of the slight angle at which it leaves the roof.


    When you have animated the full sequence capture the drawings and the background
    and see how it looks. Take a look at ‘water balloon_2D.avi’, animations002, Chapter
    2 on the website.


    When you’re happy with the five different sequences and it is easy to identify
    what sort of balls they are, you are ready to do them all again in 3D!


    # 3D Exercises


    The 3D exercises for this chapter can be found on the book’s website, www.charactermation.com.


    To animate the five different balls in 3D, we will follow a similar approach to
    that for the 2D exercises. First we need to make a background. This consists of
    a cube that has been given a sloping top. It is built to the same proportions
    as the shed in our 2D background (5 units × 5 units × 4 units).'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'We also need to make a floor for the ball to bounce on. This consists of a
    grid that is the same width as our shed and is long enough to fit all of our ball
    bounces on (5 units × 40 units). This only has to be built once. It can be reused
    for each ball we animate.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_112_0.png)


    Then we need to make our balls. These will all be the same size? We want an audience
    to be able to tell what sort of ball they are from their movement rather than
    their size. The balls will always be 1/5 the size of the width of the shed.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_112_1.png)'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'Each of the balls will have to be constructed with a ''hierarchy.'' A hierarchy
    is an abstract graphical interpretation of how a model is constructed. It consists
    of a ''parent'' that could then be linked to any number of ''children.'' Let''s
    say we have two objects on screen, a big cube and a smaller cube. They will be
    linked together in a hierarchy. The large cube is the parent and the smaller cube
    is the child. When you select the large cube (the parent) and move it, the small
    cube (the child) will move with it. But, when you select and move the small cube
    (the child), it will move on its own, leaving the large cube (the parent) behind.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_113_0.png)


    Movement given to the parent will affect all of the children, but movement given
    to a child will work independently of the parent.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_113_1.png)'
  merge: -1
  img_proc: true
- pgno: 114
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 115
  md: 'Once the movement key positions are in place, the computer will do the in-betweens
    for us. As we saw in Chapter 1, the in-betweening that the computer does will
    not be correct. We have to tell it where to put the in-between balls. We do this
    either by putting in all the in-between balls ourselves or by manipulating the
    animation curves, as in Chapter 1.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_115_0.png)


    Once the movement is done we can go back over our animation and set keys for rotation
    on the rotation part of the hierarchy. Select the rotation part of the hierarchy
    and set a key at the very start of the piece of animation. Work out how much the
    ball will rotate over the length of the scene by measuring the distance travelled
    in relation to the circumference of the ball. Then, go to the very end of the
    scene, rotate the ball by the correct amount and adjust the curves to make it
    looks right.'
  merge: -1
  img_proc: true
- pgno: 116
  md: "# # The Construction of a Simple Character, its Articulation and Balance\n\n\
    +   ### Chapter Summary\n+   \n+   - Basic Human Anatomy\n+   - Joints\n+   -\
    \ Movement in Arcs\n+   - Line of Action\n+   - Designing a Basic Human Character\n\
    +   - How to Design a 3D Character\n+   - Overview of How to Build and Rig a Simple\
    \ 3D Character\n+   - Planning a Scene\n+   - Animating Your Characters (Using\
    \ the Left and Right Sides of the Brain)\n+   - Exercises\n\nAnimating inanimate\
    \ objects such as bouncy balls gives you an idea of weight, timing, spacing, and\
    \ squash and stretch. However, they are not the most interesting things to animate.\
    \ During this chapter, we will animate something with life, something that initiates\
    \ movement and has forces imposed upon it: the human character.\n\nOur first task\
    \ is to design our character. Before doing this we need a basic understanding\
    \ of human anatomy. I will go through the construction of the skeleton and types\
    \ of joints. As well as looking at the structure of these, I will also explain\
    \ how they move and the importance of arcs when animating.\n\n# ## Basic Human\
    \ Anatomy\n\nA whole book could be (and likely has been) written on animating\
    \ human and animal anatomy, so I’m going to stick to the absolute minimum that\
    \ we need to know. Let’s start with the main part of the human skeleton: the spine."
  merge: -1
  img_proc: true
- pgno: 117
  md: '![](img/49afe0fca1d8f7ebd02f6839692b55f6_117_0.png)


    # The Spine


    At the center of the human skeleton is the ‘S’-shaped spine. It is made up of
    24 individual bones, called vertebra, which are linked by discs of cartilage.
    This combination gives the spine great flexibility, allowing forwards and backwards
    and side-to-side movement and a degree of twisting.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_117_1.png)


    At the top of the spine are the seven vertebrae that make up the neck.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# The Rib Cage


    Attached to the next twelve vertebrae are 24 ribs (two per vertebra), which constitute
    the rib cage. The role of the rib cage is to protect the heart, lungs and internal
    organs. At the bottom of the rib cage is the diaphragm; this, in conjunction with
    the rib cage, controls breathing. The rib cage restricts the bending and twisting
    movement of the 12 vertebrae that the ribs are attached to. The lower five vertebra
    make up the lower spine. Most of the twisting and bending of the spine during
    the body’s movement occurs between these five vertebra.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_118_0.png)


    # The Pelvic Girdle


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_118_1.png)


    At the base of the spine is the pelvic girdle. This solid set of bones plays a
    role in keeping us upright. Attached by ball and socket joints are the two femurs
    of the upper legs. The largest muscle in the body (the gluteus maximus) is attached
    to the upper thigh bone (the femur) at one end and to the pelvic girdle at the
    other end. This muscle is used to hold the body upright when stationary and moves
    the femur during walking. It is used when picking things up and jumping. It also
    helps with the balance of the body.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_118_2.png)'
  merge: -1
  img_proc: true
