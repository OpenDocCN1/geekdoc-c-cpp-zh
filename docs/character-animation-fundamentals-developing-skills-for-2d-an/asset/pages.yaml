- pgno: 232
  md: 'Once the key positions are done, it’s time to sort out the details – putting
    in the breakdown positions, distorting the character at frames 18, 24, 35 and
    46 and making the diving board vibrate. The programs do this in a slightly different
    way.


    # The Dive Exercise in Maya


    Open `mayaman.mb`. We’ll be doing most of the animation from the **Front** view
    panel, so enlarge this (hover the mouse pointer over this view panel and then
    press the space bar on your keyboard quickly).


    # Building the Background in Maya


    To create the cliff the man stands on, make a polygon cube by clicking the **Polygonal
    Cube** button (or go to the main menu and select **Create > Polygon Primitives
    > Cube**). In the **Inputs** section of the Channel Box, make the cube 40 units
    in width, height and depth. Translate it −14 in X and −20 in Y. Give it the name
    ‘cliff’. Your man should now be standing on top of your cliff.


    To create the sea for the man to dive into, create another cube and give it a
    width of 160, a height of 0.1 and depth of 160. Translate it 46 in X and −40 in
    Y. Give it the name ‘sea’.


    To make the diving board, create a cube and give it a width of 28, a height 0.5
    and a depth of 8. Set **Subdivisions Width** to 8. Translate it 20 in X and −15
    in Y. Save object as ‘diving_board’.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_232_0.png)'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'Next we need to put some joints through the diving board so we can get it to
    bend when the man lands on it and vibrate when he bounces off. Zoom in to the
    diving board. Click the **Snap to grids** button. Click the **Click to place IK
    joint** button and make seven bones by clicking at the point where the diving
    board meets the cliff and then moving along the diving board, clicking at each
    of the subdivisions. When you are done, press **Enter** on your keyboard.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_233_0.png)


    To bind them together, select the diving board and all the joints within it with
    the **Shift** key pressed. Then go to the main menu and click **Skin > Bind Skin
    > Rigid Bind**.


    As a guide to the height the man is going to jump up to, put a locator (on the
    main menu select **Create > Locator**) at the apex of each bounce and at the point
    where he hits the water. The apex of the first bounce is half way between the
    man''s standing position at frame 1 and the end of the diving board. The bounce
    is approximately the same height again, into the air, as the height of the cliff
    (about **X = 17** and **Y = 40**). The apex of the second bounce is half way between
    the end of the diving board and the point where the man hits the water, and about
    two thirds the height of the apex of the first bounce (about **Z = 50, Y = 30**).
    The point where the man hits the water is approximately the same distance from
    the diving board that the man is from the diving board in frame 1 (**X = 67, Y
    = −40**).


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_233_1.png)


    Now we''re ready to animate.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# ## Animating the Dive in Maya


    Take your animation drawings (or have a look at illustrations in the 2D section
    of the exercise) and copy the key positions at the same frames into the computer.


    At the first key position we need to have our man standing at the top of the cliff
    in a relaxed pose. Select the ‘BodyHandle’ handle with the left mouse button,
    and, with Move button selected, translate the body so that it is in the correct
    position. Set a translation key (press S on your keyboard). Select the arms individually
    and translate them to positions by the sides of the body. Set a translation key.
    Select each of the elbow, knee, foot and eye controls and set a translation key.
    When the man is at a position that you like, select everything in the skeleton
    hierarchy of the man in the Hypergraph and set a rotation key. Select all the
    bones in the diving board and set a rotation key.


    At the second key (frame 9), the man bends down into the anticipation position
    of the jump. Middle click ‘BodyHandle’ to translate the body down and rotate it
    forwards. Rotate each of the back-bones to arch the back. Translate the arms up
    behind the body. Save translation keys on the foot, elbow, eye, knee and arm controls
    and finally save a rotation key on the entire skeleton hierarchy.


    The third key (frame 13) is the position where the man is distorted on the way
    up to the apex of the first bounce. At the moment we just want to move the body
    to a point half way between the man’s anticipation position at frame 9 and the
    apex of the first bounce, without any distortion. Straighten the man’s back by
    middle clicking and selecting and rotating each of the bones and setting rotation
    keys. Select the ‘BodyHandle’ handle by clicking it and translating it up to a
    point half way between the previous key and the locator at the apex of the bounce
    and set a translation key. Translate the arm, foot, elbow, knee and eye controls
    to ‘catch up’ with the position of the body and save translation keys. Select
    the skeleton hierarchy and save a rotation key on it.


    For the rest of the key positions, follow the illustrations in the book. At the
    seventh key (frame 31), the diving board has to bend when the full weight of the
    man comes to bear upon it.


    Take a look at ‘dive_3D_keys.avi’, Chapter 4 on the website. It is all too even
    and there’s no distortion yet. Additionally, the board only vibrates once, the
    feet sink into the cliff at the start, the feet sink into the diving board and
    there’s no splash (we will not be animating the splash).


    Adjust the feet sinking into the cliff by flattening out the function curves in
    X and Y between frames 1 and 9 of the foot controls (‘RFootControl’ and ‘LFootControl’)
    in translation and rotation. To do this, open up the Graph Editor (on the main
    menu, select Window > Animation Editors > Graph Editor) and select a foot control.
    Back in the Graph Editor in the explorer section, select Translate X and its curve
    will be shown in the Graph Editor. Click the key point on the curve at frame 9
    and click the Linear Tangents button. This should flatten the curve between frames
    1 and 9. Repeat this procedure with the rotation in X and then with the other
    foot control.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_234_0.png)'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'At each of the breakdown positions (the major in-betweens), move your model
    to a position similar to the equivalent drawing and set a key. Have a look at
    the illustrations in the 2D section of the exercise.


    To adjust the diving board, bend it (by rotating the bones inside it) so that
    on each frame where the man''s feet are in contact with it the feet are not sinking
    into the board. After the man has bounced off, vibrate the board by following
    the illustrations in the 2D section of the exercise.


    Once all of the breakdowns are done, take a look at “dive_3D_breakdowns.avi”.
    It is much better but we need to distort our man along the arcs at the fastest
    points of each bounce.


    Middle click ‘BodyHandle’ and select the **Scale** tool in the **Transform** section
    of the Command Panel. We need to scale the shape of the man to make him distort
    and set a scale key, but we need to set a scale key without any distortion on
    the frames before and after.


    Take out your drawn animation (or look at the illustrations in the book) and find
    the key drawing where the man distorts and the drawings before and after it. The
    first distorted man occurs on frame 13, so take out drawings 11, 13 and 14. Move
    the Time Slider to frame 11 and, without any scaling, set a scale key. Move the
    Time Slider to frame 14 and, without any scaling, set a scale key. Finally move
    the Time Slider to frame 13 and scale ‘BodyControl’ using the Z (blue) handle.
    You may have to alter the legs to make him look correct. Repeat this procedure
    with all the other positions where the man distorts (frames 24, 35 and 46).


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_235_0.png)


    Take a look at ‘dive_3D.avi’, Chapter 4 on the website. Don’t worry about animating
    a splash (this is character animation we’re doing, after all).


    # The Dive Exercise in 3D Studio Max


    Open ‘maxman09.max’ and save the scene as ‘dive.max’. For this exercise we will
    be mainly using the front viewport, so enlarge it.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# Building the Background in 3D Studio Max


    To make the cliff you must stand on, create a box (on the **Create** tab of the
    **Command Panel**, select **Box**) and, in the **Keyboard Entry** section of the
    **Command Panel**, make it 400 units in length, 400 units in width and 400 units
    in height and click **Create**. Click the **Select and Move** button and move
    the box -14.0 in X, 20 in Y and -200 in Z. Give it the name “cliff”. Your man
    should now be standing on top of your “cliff”.


    To make the scar for the man to dive into, create a box and make it 1.0 units
    in length, 1600 units in width and 1600 units in height. Move it to X = 450, Y
    = 800 and Z = 400. Give it the name “sea”.


    To make the diving board, create a box and make it 10.0 units in length, 280 units
    in width and 80 units in height. Move it to X = 200, Y = 40 and Z = 400. Make
    its Width Segs 7. Give it the name “diving_board”. Because the diving board has
    to bend and vibrate, we need to put some bones in it. Zoom into the side of the
    diving board in the front view. Make sure the Snap Toggle Button is on. Go into
    Create Bones mode (on the Create tab of the Command Panel select **Systems > Bones**)
    and draw seven bones.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_236_0.png)


    along the length of the diving board. Right click twice to leave bone creation
    mode.


    To skin the bones with “diving_board”, select “diving_board” and then **Modifiers
    > Animation Modifiers > Skin**. In the Command Panel click the **Add Bone** button
    and in the **Select Bones** window select “Bone01” through to “Bone08” then click
    the **Select** button.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_236_1.png)'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'We now need to change the “weighting” of the bones. Weighting is the amount
    of influence that an individual bone has on the skin as it is attached to. Arrange
    the diving board in the perspective view, to the Parameters section of the Command
    Panel click the Edit Envelopes button. Select a bone in the box below this button
    and a strange device will appear around the bone. Select the outer squares of
    this device and move them outwards to enlarge it. As you do, the points on the
    diving board will change color. The more red they are, the more they are affected
    by the bone’s movement. You will need to do this with all the bones. Extend the
    device so that it goes to the far end of the board on each bone. Experiment with
    it until you have a diving board that bends nicely. To leave this mode click the
    Edit Envelopes button again.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_237_0.png)


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_237_1.png)'
