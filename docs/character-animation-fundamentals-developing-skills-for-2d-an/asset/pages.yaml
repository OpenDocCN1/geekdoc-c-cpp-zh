  md: '# ‘EH’


    As in ‘wet’. A large, wide smiling mouth with the jaw dropped, but not quite as
    dropped as for ‘O’ and ‘A’.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_424_0.png)


    # ‘EEE’


    As in ‘squeeze’. Still quite loud but the jaw will not be as open as for the other
    loud vowels. It consists of a wide smile.


