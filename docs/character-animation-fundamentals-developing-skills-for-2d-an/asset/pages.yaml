    will render an .avi movie for you.


    Hopefully you''ll be bouncing a bit more like a real ball now. Have a look at
    ball drop 3D. avi, animations001, Chapter 1 on the website.


    # Drawing


    A good animator (whether 2D or 3D) should be able to sketch and pose for a key
    frame of an animation in a simple, concise form. You don''t have to be brilliant
    at drawing; however, drawing is the best way there is to interpret the world around
    you. So, draw as much as possible. Drawing'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'something that is moving (an animal, say) means that you need to observe it
    intensively and this will help you to understand the way it moves.


    Attend life drawing classes and focus on short poses (less than 10 minutes). If
    the model is going to pose for an hour or two, draw them from one angle for a
    short period of time and then move around the room and draw them from another
    angle. This teaches you to capture the essence of a pose with a few simple lines.
    Concentrate on getting the structure, weight and balance correct.


    ![](img/49afe0fca1d8f7ebd02f6839692b55f6_77_0.png)'
  merge: -1
