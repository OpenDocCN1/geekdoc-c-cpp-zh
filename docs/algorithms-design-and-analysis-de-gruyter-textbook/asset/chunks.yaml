    \ 4.4.4 Bellman–Ford algorithm\n\nThe Bellman–Ford Algorithm solves single-source\
    \ shortest path problem of a given graph that can have negative length weight\
    \ edges. The function `wf` is the weight function that returns weight of edge\
    \ from vertex `v[1]` to `v[2]`. If there is negative-length cycle, the algorithm\
    \ signifies that no solution exists. If there is no such cycle, the algorithm\
