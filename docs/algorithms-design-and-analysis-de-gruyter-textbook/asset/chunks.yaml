    \n15. 用模型解释堆排序的计算。\n\n16. 用模型解释 Horspool 算法计算。\n\n17. 排序以下数组\n    90, 194, 245,\
    \ 44, 23, 19, 60, 39, 76, 14, 1, 8, 54\n    利用每一个附带的策略：\n    1. 归并排序\n    2. 快速排序\n\
    \    3. 插入排序\n    4. 选择排序\n    5. 堆排序\n    此外，统计每种排序技术的活动数量。\n\n18. 编写一个快速排序算法以隔离待排序的各种组件，并编写排序后收敛的计算方法。\n\
    \n# 第 3 章：算法设计技术\n\n本章介绍了基于以下内容的算法设计技术：贪心算法、动态规划、回溯法和分支限界法。本章还讨论了摊还分析过程。\n\n##\
    \ 3.1 贪心算法\n\n贪心算法可能是生产技术中最简单的一种。它通常用于解决优化问题，例如在网络中找到从一个节点到下一个节点的短路径，以及为计算机上执行的一系列任务选择最佳顺序。在贪心算法中，我们选择在当前情况下看起来最好的选项。贪心算法通过在任何时刻选择最有希望的解决方案来工作。无论以后出现什么情况，它都不会重新评估此决定。它遵循`当前最优`的概念。\n\
    \n### 3.1.1 旅行销员问题\n\n在旅行销员问题中，推销员必须访问 n 个地方或城市，使得所有城市只能被访问一次，最后他回到起始的城市，且成本最低。贪心算法使用`最近邻居`的概念，并选择距离当前城市最近的城市。\n\
    \n**示例 3.1:** 给定完全图 G 的距离矩阵（参见图 3.1）。\n\n![](img/b_9783110693607-003_ingr_001.png)\n\
    ![](img/b_9783110693607-003_fig_001.png)\n\n图 3.1：图 G 及其距离矩阵。\n\nV1-V5-V2-V3-V4-V1\n\
    巡游成本：–12 + 14 + 15 + 16 + 16 = 73，\n\n### 3.1.2 分数背包问题\n\n我们必须将 n 个物体放入给定的背包中。背包容量为\
    \ W。第 i 个物品的重量为 `w[i]`，如果选择第 i 个物品的比例 `x[i]` (0 ≤ `x[i]` ≤ 1) 来填充背包，则获得的利润为 `v[i]x[i]`，其中\
    \ `v[i]` 是放置第 i 个物品所获得的价值。目标是填满背包使利润最大化。那么上述问题的线性规划问题 (LPP) 为：\n\n$\\begin{matrix}\
    \ & {{z =}\\sum\\limits_{i = 1}^{n}{v_{i}x_{i}}} \\\\ & {{such\\, that}\\,\\,\\\
    sum\\limits_{i = 1}^{n}{w_{i}x_{i}} \\leq W} \\\\ & {{and\\,}0 \\leq x_{i} \\\
    leq 1,\\ 1 \\leq i \\leq n} \\end{matrix}$\n\n**算法：** `Greedy-Knapsack(W, n)`\n\
    \n// v [1: n] 是价值数组，w [1: n] 是重量数组，x[1:n] 包含放入背包物品的分数值。物品按递增顺序排列，使得：\n\n$\\frac{v[i]}{w[i]}\
    \ \\geq \\frac{v[i + 1]}{w[i + 1]}$\n\n```\n {\n     for k : = 1 to n do\n   \
    \                x[k]: = 0.0;\n     U: = W;\n     for k: = 1 to n do\n       \
    \            {\n                           if (w[k] > U) Then break;\n       \
    \                    x[k]:=1.0; U: = U-w[k];\n                   }\n     if(k\
    \ ≤ n) Then x[k]: = U/w[k];\n}\n```\n\n该算法的时间复杂度为 O(n)。\n\n**示例 3.2:** 使用贪心算法解决给定的分数背包问题（参见表\
    \ 3.1）。背包容量 W = 16，物品数量为 4，价值和重量如表所示。\n\n按 $\\frac{v[i]}{w[i]} \\geq \\frac{v[i\
    \ + 1]}{w[i + 1]}$ 的顺序排列物品（参见表 3.2）。\n\n表 3.1：放入背包的物品列表。\n\n| 物品 (i) | v[i] |\
    \ w[i] | v[i]/w[i] |\n| --- | --- | --- | --- |\n| 1 | 10 | 5 | 2 |\n| 2 | 12\
    \ | 4 | 3 |\n| 3 | 8 | 4 | 2 |\n| 4 | 20 | 5 | 4 |\n\n表 3.2：按顺序排列的物品。\n\n| 物品\
    \ (i) | v[i] | w[i] | v[i]/w[i] |\n| --- | --- | --- | --- |\n| 1 | 10 | 5 | 2\
    \ |\n| 2 | 12 | 4 | 3 |\n| 3 | 8 | 4 | 2 |\n| 4 | 20 | 5 | 4 |\n\n![](img/b_9783110693607-003_fig_002.png)\n\
    图 3.2：使用贪心算法解决背包问题。\n\n## 3.2 回溯\n\n美国数学家 D. Lehmer 在 20 世纪 50 年代首次提出了 `backtrack`（回溯）一术语。SBOL\
    \ 语言（1962 年）是第一个内置回溯的语言。这种方法特别适用于 NP 完全问题。回溯的关键点在于二选一 `Yes` 或 `No`，当回溯出现 `No`\
    \ 时，意味着算法遇到了死胡同。它会回溯一步并尝试不同的 `Yes` 路径。从而完成。\n\n### 3.2.1 哈顿回路\n\n图的哈顿回路是一种通过图中每个顶点的回路，\n\
    \n或者\n\n哈顿回路是一种每个顶点恰好访问一次并返回起点的路径。这样的图被称为哈顿图（参见图 3.3）。\n\n![](img/b_9783110693607-003_fig_003.png)\n\
    \n图 3.3：带有哈顿回路的图 G。\n\n在不失一般的情况下，我们可以断定存在哈顿回路，它开始形成顶点“a”（图 3.4(a)），我们将顶点“a”作为空间树的根（图\
    \ 3.4 (b)）。\n\n![](img/b_9783110693607-003_fig_004.png)\n![](img/b_9783110693607-003_fig_200.png)\n\
    ![](img/b_9783110693607-003_fig_201.png)\n\n图 3.4：(a) 一个图，(b) 哈顿回路的空间树，(c) 哈顿回路。\n\
    \n让我们使用字母顺序来打破相邻 a 的顶点之间的冲突，我们选择顶点 b，然后是 c、d、e，最后到达 f 证明是一个死胡同。因此回溯算法从 f 回溯到 e，然后到\
    \ d，最后到 c。\n\n"
- fmt: "\nIt offers the first alternatives for the algorithm to follow, moving `c`\
    \ to `e` finally proves futile, so the algorithm has to backtrack from `e` to\
    \ `c`, then to `b`. From there it goes to the vertices `f`, `e`, `c`, and `d`,\
    \ from where the Hamiltonian circuit will regimentally return to yield: `a, b,\
    \ f, e, c, d, a` (figure 3.4(c)).\n\nSolution is a Hamiltonian cycle.\n\n### 3.2.2\
    \ 8-queen problem\n\nThe 8-queen problem is a problem in which 8 queens are to\
    \ be placed on a 8 × 8 cross board so that no two queens are in attacking position.\
    \ Same row, same column, and same diagonal are called the attacking positions.\
    \ Backtracking algorithm is applicable to use wide range of problem and it is\
    \ simple method. The backtracking resembles a depth first search tree in a directed\
    \ graph.\n\nTable 3.3: 8 × 8 board for 8-queen problem.\n\n| ![](graphic/converted/b_9783110693607-003_tab_004.png)\
    \ |\n\nTotal block 8 × 8 = 64.\n\n![](graphic/converted/b_9783110693607-003_fig_005.png)\n\
    \nFigure 3.5: Possible solution for 8-queen problem.\n\nThe problem can be computationally\
    \ quite expensive as there are `C[8]^(64)`, that is, 4,426,165,368 possible placements\
    \ of the queens on board, out of which only 92 arrangements satisfy the objective.\n\
    \nIt is quite feasible to use shortcuts that reduce computational requirements\
    \ or guidelines of thumb that avoids brute-force computational strategies. As\
    \ an instance, just by way of making use of an easy rule that constrains every\
    \ queen to an single column (or row), though nevertheless considered brute force,\
    \ it is possible to lessen the quantity of possibilities to simply 16,777,216\
    \ (that is, 8⁸) viable combos. Generating diversifications in addition reduces\
    \ the opportunities to just 40,320 (this is, 8!), which are then checked for diagonal\
    \ attacks. However, by allowing one placement of a queen on distinct row and column.\n\
    \nThe number of ways are `8! = 40,320` {8 Tuples}\n\nLet us assure that `ith`\
    \ queen is placed on row `i` so all the solution to 8-queen problem can therefore\
    \ be represented by 8 tuples `(c[1], c[2],..,c[8])` where `c[i]` is the column\
    \ on which `ith` queen is placed. The size of sample space is `8⁸`. Out of 8 tuples,\
    \ no `c[i]`’s can be same, this reduces the size of sample space to `8!`.\n\n\
    #### State space tree\n\nBacktracking algorithms decide problem solutions via\
    \ systematically looking the answer space for the given problem instance. This\
    \ seek is aided using a tree agency for the answer space. We start with an initial\
    \ state node and organize a tree of solution space. Every node on this tree defines\
    \ a problem state. All paths from the root node to other nodes define the state\
    \ space of the problem. Solution states are those problem states for which the\
    \ path from root to `s` defines a tuple within the solution space. The tree organization\
    \ is known as state space tree.\n\n*   **Live node:** A node is a live node which\
    \ has been generated and all of whose child nodes have not yet been generated.\n\
    *   **Dead node:** This node is a generated node which is not to be more expanded\
    \ on chess board.\n*   (R-L) “UPPER LEFT TO LOWER RIGHT”\n*   Again (R-L) value\n\
    *   `(5,1) = 6, (2,4) = 6, (3,3) = 6` “lower left to upper right” (sum of cell\
    \ coordinate). Similarly upper left to lower right `(3, 1) = 2, (4, 2) = 2`\n\
    *   Let us suppose two queens are placed at position `(m,n)` and `(p,q)`\n*  \
    \ Then they are on same diagonal\n    *   `if m - n = p - q or m + n = p + q n\
    \ - q = m - p or n - q = p - m`\n*   Therefore, two queen lie on the same diagonal\
    \ if\n    `|n - q| = |m - p|`\n\n**Algorithm**: `Place (p, m)`\n\n*//This returns\
    \ a Boolean value that is true if m^(th) column is suitable for the p^(th) queen.**\n\
    \n```\n {\n     for n := 1 to (p-1) do\n     if ( (c [n] == m) // same column\n\
    \     or [Abs (c[n] - m) == Abs (n-p)]) //diagonally attacking\n             \
    \                   then false;\n     return true ;\n}\n```\n\n**Algorithm**:\
    \ `Nqueen (p, N)`\n\n```\n {\n     for m: = 1 to N do\n          if place (p,\
    \ m) then\n               c[p]: = m,\n               If (p = N)\n            \
    \   Then write (c[1] : N]);\n          else Nqueen (p+1, N);\n          }\n}\n\
    ```\nAll solution of the N-queens for `n=8` are 92. One possible solution of 8-queen\
    \ problem is: `{c[1],c[2],c[3],c[4],c[5],c[6],c[7]}` ≡ `{4,6,8,2,7,1,3}`\n\n###\
    \ 3.3 Dynamic programming\n\nDynamic programming is an innovative way for fixing\
    \ complex problems by breaking them into some small or subtasks. It is applicable\
    \ for issues exhibiting overlapping subproblems and top-quality substructure (described\
    \ below). When applied, the method takes far less time than naive methods that\
    \ do not gain of subproblem (like depth-first search). Dynamic programming is\
    \ method for fixing issues with overlapping subproblems. These issues rise up\
    \ from recurrence to given solution to its subproblems. Dynamic programming advises\
    \ solving every subproblem once and storing the result in table from which we\
    \ can obtain a solution to the original problem.\n\nThe Fibonacci relation: `F[n]\
    \ = F[n-1] + F[n-2]`\n`F[0] = 0` `F[1] = 1` (*initial conditions*)\nA recurrence\
    \ relation, if we know `F[n-1]` and `F[n-2]`, we can compute `F[n]` easily.\n\n\
    #### 3.3.1 0/1 knapsack problem\n\nWe have `n` items of weights `w[1], w[2], …\
    \ …w[n]` and values `v[1], v[2], … …v[n]`, and `W` is capacity of knapsack. We\
    \ need to fill the knapsack while gaining maximum profit. In 0/1 knapsack, we\
    \ cannot take portion of object, that is, either an object is selected for knapsack\
    \ or not. The 0/1 knapsack problem as LPP is:\n\n$\\begin{matrix} & \\text{Max\
    \ } z = \\sum_{i = 1}^{n}{x_{i}.v_{i}} \\\\ & \\text{such that}\\sum_{i = 1}^{n}{x_{i}.w_{i}}\
    \ \\leq W \\\\ & v_{i} \\geq \\{0,}x_{i} \\in \\{0,1\\} \\end{matrix}$\n\nWe are\
    \ to find a recurrence relation that expresses a strategy to an example in phrases\
    \ of its small subinstances. The time and space performance each for the set of\
    \ rules is $\\theta(nW)$. Let us take the first `i` items (`1≤i≤n`), and knapsack\
    \ ability `j < W`. `O[i, j]` be the value of optimal solution of these `i` items\
    \ that suit the knapsack of capability `j`. This instance of `i` items is partitioned\
    \ into subsets of two:\n\n*   First subset does not contain the `ith` item, `O[i-1,\
    \ j]` is the value of this subset. If `ith` object is not placed into the knapsack\
    \ then the value will be same as `i–1` objects, so: `O[i, j] = O[i-1, j]`\n* \
    \  Second subset contains the `ith` item, therefore the value of such optimal\
    \ subset is `v[i]+O[i-1, j-w[i]]`\n\nThus, the value of an optimal solution of\
    \ the first `i` objects is the maximum of these two categories’ values.\n\n`O[i,\
    \ j] = max {O[i-1, j], v[i]+O[i-1, j-w[i]]} if (j-w[i]) ≥ 0`\n\nThe initial conditions\
    \ are:\n\n`O[0, j] = 0` for `j ≥ 0` and `O[i, 0] = 0` for `i ≥ 0`\n\nThe objective\
    \ is to find `O[n, W]`.\n\n**Example 3.3:** We have the following information\n\
    \n| Item | Weight | Value |\n| :--- | :--- | :--- |\n| 1 | 2 | RS 12 | CAPACITY\
    \ W=5 |\n| 2 | 1 | RS 10 |\n| 3 | 3 | RS 20 |\n| 4 | 2 | RS 15 |\n\n![](graphic/converted/b_9783110693607-003_fig_006.png)\n\
    \nFigure 3.6: Knapsack problem.\n"
