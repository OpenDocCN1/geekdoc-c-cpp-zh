    \ the sorting. Also, this algorithm is not space efficient since it requires extra\
    \ array space.\n\n## 2.5 Heap sort\n\nHeap sort is a sorting algorithm that is\
    \ based on comparisons. Heap sort is considered to be improved selection sort,\
    \ and like selection sort, it isolates its input into a sorted and an unsorted\
    \ locale, and it iteratively recoils the unsorted locale with the aid of extricating\
    \ the littlest factor and transferring that to the sorted locale. The advancement\
    \ accommodates of the use of a heap structure in preference to a linear one so\
    \ that the time to find the smallest is least. It is an in-place but not stable\
    \ algorithm. It was proposed by J.W.J. Williams in 1964 and became the beginning of\
    \ the heap.\n\n**Complete binary tree:** It is a binary tree for which the vertex\
