    \ there exists a way to solve `L[1]` by deterministic polynomial time algorithm\
    \ using a deterministic algorithm that solves `L[2]` in polynomial time.\n\n**Definition:**\
    \ A problem `L` is NP Hard if and only if satisfiability is reduced to `L` (satisfiability\
