    \n### 3.2.2 八皇后问题\n\n8 皇后问题是一个在 8 × 8 棋盘上放置 8 个皇后的问题，使得任意两个皇后互不处于攻击位置。同一行、同一列和同一对角线被称为攻击位置。回溯算法适用于广泛的问题，并且是一种简单的方法。回溯类似于有向图中的深度优先搜索树。\n\
    \n表 3.3：8 皇后问题的 8 × 8 棋盘。\n\n| ![](img/b_9783110693607-003_tab_004.png) |\n\n\
    总区块 8 × 8 = 64。\n\n![](img/b_9783110693607-003_fig_005.png)\n\n图 3.5：8 皇后问题的可能解。\n\
    \n这个问题在计算上可能相当昂贵，因为有 `C[8]⁶⁴`，即 4,426,165,368 种皇后在棋盘上的可能放置方式，其中只有 92 种排列满足目标。\n\
    \n使用捷径来减少计算需求或使用避免暴力计算策略的经验准则是是完全可行的。例如，仅通过使用一个简单的规则将每个皇后限制在单列（或单行），尽管这仍被认为是暴力破解，但可以将可能性的数量减少到仅\
    \ 16,777,216（即 8⁸）种可行组合。此外，生成多样化还将机会减少到仅 40,320（即 8!），然后进行对角线攻击检查。然而，通过允许在不同的行和列上放置一个皇后。\n\
    \n方法的数量为 `8! = 40,320` {8 个元组}\n\n让我们确保第 `ith` 个皇后放置在第 `i` 行，因此 8 皇后问题的所有解都可以由\
    \ 8 个元组 `(c[1], c[2],..,c[8])` 表示，其中 `c[i]` 是放置第 `ith` 个皇后的列。样本空间的大小为 `8⁸`。在 8\
    \ 个元组中，没有任何 `c[i]` 是相同的，这把样本空间的大小缩小到 `8!`。\n\n#### 状态空间树\n\n回溯算法通过系统地查找给定问题实例的答案空间来决定问题的解决方案。这种搜索通过使用答案空间的树结构来辅助。我们从一个初始状态节点开始，并组织一个解空间树。这棵树上的每个节点都定义了一个问题状态。从根节点到其他节点的路径都定义了问题的状态空间。解状态是指那些从根到\
    \ `s` 的路径定义了解空间内元组的问题状态。这种树的组织被称为状态空间树。\n\n*   **活跃节点（Live node）：** 一个已经生成且所有子节点尚未生成的节点。\n\
    *   **死节点（Dead node）：** 一个已生成的、在棋盘上不再进一步扩展的节点。\n*   (R-L) “左上到右下”\n*   再次 (R-L)\
    \ 值\n*   `(5,1) = 6, (2,4) = 6, (3,3) = 6` “左下到右上”（单元格坐标之和）。同样，左上到右下 `(3, 1) =\
    \ 2, (4, 2) = 2`\n*   假设两个皇后放置在位置 `(m,n)` 和 `(p,q)`\n*   那么它们在同一对角线上\n    *  \
    \ `if m - n = p - q or m + n = p + q n - q = m - p or n - q = p - m`\n*   因此，两个皇后位于同一对角线当且：\n\
    \    `|n - q| = |m - p|`\n\n**算法**：`Place (p, m)`\n\n*//此函数返回一个布尔值，如果第 m 列适合第\
    \ p 个皇后，则返回为真。**\n\n```\n {\n     for n := 1 to (p-1) do\n     if ( (c [n] ==\
    \ m) // 同列\n     or [Abs (c[n] - m) == Abs (n-p)]) // 对角线攻击\n                \
    \                then false;\n     return true ;\n}\n```\n\n**算法**：`Nqueen (p,\
