    \ inductively that S of size r–1 and a spanning tree T on S have been found. We\
    \ select vertices i ε S and j ∉ S so that the weight a[ij] of the edge e from\
    \ i to j is as small as possible, and adjoin j to S and e to T. When stage n is\
