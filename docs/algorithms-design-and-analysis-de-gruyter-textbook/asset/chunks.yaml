    \ if `L` is NP Hard and `L∈NP`. Example: Vertex cover problem, travelling sales\
    \ person problem, Hamiltonian cycle problem, clique problem, etc.\n\n### 5.10.5\
    \ Halting Problem for Deterministic Algorithms\n\nA halting problem is to determine\
    \ for an arbitrary deterministic algorithm `A` with input `I` ever terminates\
    \ (or enter in infinite loop). This problem is decidable, and there exists no\
    \ algorithms of any complexity to solve it, so this problem is not in NP. To show\n\
    \n> Satisfiability α Time Halting Problem\n\nConstruct a problem `A` whose input\
    \ is a propositional formula `X`, if `X` has `n` variables then `A` tries `2^n`\
    \ possible truth assignments and verifies whether `X` is satisfiable. If it is,\
    \ `A` stops and if not then `A` enters infinite loop.\n\nHence `A` halts on input\
    \ `X` if and only if `X` is satisfiable. IF we had a polynomial time algorithm\
    \ for halting problems then we could solve the satisfiability problem in polynomial\
    \ time using `A`, and `X` is input to algorithm for halting problems. Hence, halting\
    \ problem is NP hard that is not an NP.\n\n### 5.10.6 The satisfiability problem\n\
    \nLet the Boolean expression be\n\n`E` ℃≡ `a` ��∧ ⅅ¬(`b` ��∨ ⅅ`c`), `E`(`T`) ℃= 1\
    \ ⅅ*i*.*e*. ⅅ`E` ⅅ*i**s*t**r**u**e*.\n\n`E` is true if `a` is true and ¬(`b` ��∨\
    \ ⅅ`c`) is true, when both `b` and `c` are false. The expression `E` is said to\
    \ be satisfiable if there exist at least one truth assignment `T` that satisfies\
    \ `E(T)`  = 1.\n\n`E` ℃≡ `a` ��∧ ⅅ¬(`b` ��∨ ⅅ`c`) \n\nis satisfiable if\n\n`T`(a`)\
    \ ℃= 1, `T`(b`) ℃= 0, `T`(c`) ℃= 0\n\nFor these values, `E(T)`  = 1.\n\nTheorem\
    \ 5.10.4: (Cook’s Theorem) This theorem states that satisfiability problem is\
    \ NP complete.\n\n## 5.11 Clique\n\nA graph `G(V, E)` is said to be complete graph\
    \ if all vertices of graph `G` are adjacent to each other. A clique `C` of a graph\
    \ `G` is a collection of vertices that form complete graph. Size of clique is\
    \ the number of vertices in `C`. To discover the largest clique is an NP-hard\
    \ problem and is known as maximum clique problem. The problem is closely related\
    \ to vertex cover problem and independent set problem.\n\nLet the set `E` be the\
    \ complement of `E` (set of edges in `G`), `S` is a greatest independent set in\
    \ the complementary graph `G*` if `S` is a maximum clique of `G`. It follows that\
    \ `V–S` is a minimum vertex cover in `G*`. An example is given in figure 5.11.\n\
    \n![](graphic/converted/b_9783110693607-005_fig_010.png)\n\nFigure 5.11: Vertex\
    \ 2-3-4-5 forms a clique of size 4.\n\n![](graphic/converted/b_9783110693607-005_fig_009.jpg)\n\
    \nFigure 5.10: Relationship Between P, NP, NP hard and NP complete problems.\n\
    \n### 5.11.1 Clique Decision Problem\n\nThe problem is to find a clique of a particular\
    \ size (say `k`) in a given graph `G(V, E)`. It is generally called k-clique problem.\n\
    \n### 5.11.2 Non-Deterministic Algorithm for Clique Decision Algorithm\n\nThis\
    \ algorithm finds a set of `k` distinct vertices then check whether these vertices\
    \ form a complete graph `G`. The graph `G` is represented as adjacency matrix\
    \ and `|V|=n`.\n\n**Algorithm:** `DCK(G, n, k)`\n\n```\nS=Φ\ni=1 to k do \n{\n\
    \       q=choice(1, n)\n       if q∈S then failure()\n       S=SU{q}\n } // for\
    \ all pairs (p, q) such that p∈S and q∈S and p≠q.\nIf (p, q) is not an edge of\
    \ G then failure()\nElse success().\n```\n\n**Theorem: Prove that clique decision\
    \ problem is NP Complete.**\n\n**Proof:** We will prove this in two steps:\n\n\
    1. Show that clique problem is in NP.\n2. 3CNF (3SAT) can be reduced to clique\
    \ decision problem\n\nSuppose we are given a clique then it is simple to check\
    \ that whether it is clique of size `k`, by counting the number of vertices in\
    \ the clique and it would take polynomial time thus k-clique decision is NP problem.\n\
    \nFor second part, we will show that 3CNF (3SAT) can be reduced to clique decision\
    \ problem. Consider a Boolean expression, `E` ℃= `C[1]` ��∧ ⅅ`C[2]` ��∧ ⅅ`C[3]`\
    \ ��∧ ⅅ………`C[k]` These are k clauses in `E` and each clause `C[r]` ℃= `l[1]`(*r*)\
    \ ��∨ ⅅ`l[2]`(*r*) ��∨ ⅅ`l[3]`(*r*) are literals. Then expression `E(T)=1`, there\
    \ exists a clique of size `k` in the corresponding graph `(V, E)`.\n\n**Construction\
    \ of Graph:** For each clause `C[r]` ℃= `l[1]`(*r*) ��∨ ⅅ`l[2]`(*r*) ��∨ ⅅ`l[3]`(*r*)\
    \ in `V(G)` and after this will get `V(G)` containing 3k vertices and for `E(G)`\
    \ we will connect\n1. `V[i]^r` and `V[j]^s`, (r≠s) {No connection in same triple}\n\
    2. Also connect all the literals in different triples but not the negation of\
    \ each other. Now `E`= `G(V, E)` Since `E(T)==1` and `E` ℃= `C[1]` ��∧ ⅅ`C[2]`\
    \ ��∧ ⅅ`C[3]` ��∧ ⅅ………`C[k]` and `C[r]` ℃= `l[1]^r.l[2]^r.l[3]^r Thus in each\
    \ clause `C[r]`, we have at least a literal with value 1 for `E(T)=1`. For each\
    \ clause pick a vertex corresponding to literal having value 1. And then we have\
    \ a set of k vertices `V’`. From construction of graph `G(V, E)` all these vertices\
    \ are connected with each other by one edge and thus `V’` is a clique of size\
    \ k. Again graph `G(V, E)` has clique `V’` of size k by construction of graph\
    \ `G(V, E)`. We know that no connection in same triple and the literals are not\
    \ connected with their negations. Since we have a clique of size k, thus we have\
    \ a vertex in clique corresponding to clause. Map the literals in each clause\
    \ for which we have vertex in clique to 1. For each clause, we have one literal\
    \ which has truth value (i.e. 1) and thus `E(T)=1`, i.e. `E` is satisfied. It\
    \ means clique decision problem is NP Hard, since it is NP too. Therefore it is\
    \ complete problem.\n\n## Problem set\n\n1. By taking a condition where all of\
    \ the elements of a given pattern are different, can we amend the naive string\
    \ matching algorithm so that its results will be better for these types of patterns.\
    \ If we can, then what are the changes to original algorithm?\n2. Write down randomized\
    \ algorithm for quick sort.\n3. Rewrite the quick sort algorithm so that it takes\
    \ a comparison function `cmp: α × α → order` and a sequence of type `α seq`, and\
    \ only uses the comparison once when comparing the pivot with each key. The type\
    \ order is the set {Less, Equal, Less}.\n4. Solve and explain how 0/1 knapsack\
    \ problem using approximation algorithm.\n5. Explain the satisfiability problem.\n\
    6. Explain the convex and concave regions.\n7. Write a note on randomized algorithms.\n\
    8. Explain the computational geometry.\n9. Explain Class P, NP NP hard and NP\
    \ Complete with help of example.\n10. What is clique, explain clique decision\
    \ problem and max clique problem.\n11. Give a nondeterministic algorithm to clique\
    \ decision problem.\n12. State and prove Chinese Remainder Theorem.\n13. With\
    \ working modulo `q=13` how many spurious hits does Rabin Karp matcher encountered\
    \ in text `T=4 9 6 2 8 3 4 2 6 5 2 9`, when looking for `p=6 2`.\n14. Write a\
    \ short note on matrix multiplication.\n15. Prove that vertex cover problem is\
    \ NP Complete.\n\n# Chapter 6 Tree and heaps\n\n## 6.1 Red–Black Tree\n\nA Red–Black\
    \ Tree (RBT) is a kind of binary search tree that holds property of self-balancing.\
    \ Each node in `RBT` has color as an extra field; color may be red or black. A\
    \ RBT (see figure 6.1) must satisfy the following properties:\n\n1. The root node\
    \ always has a black color.\n2. A `nil` is considered to be black colored.\n3.\
    \ **The Rule of Black Children:** The children of red node are black.\n4. **The\
    \ Rule of Black Height:** For each node in `RBT`, there is black height which\
    \ is an integer `bh(v)` such that each path from node `v` to any of its descendant\
    \ leaves containing same number of black nodes. This is known as the *black height*\
    \ of node `v`. Black height of root is black height of the tree.\n"
