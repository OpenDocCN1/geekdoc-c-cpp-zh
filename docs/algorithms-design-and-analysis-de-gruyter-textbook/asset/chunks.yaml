    ### 3.3.3 Chain multiplication


    The chain multiplication problem is important in the area of compiler design and
    database. As we want code optimization and query optimization. The problem statement
    is:


    Given $\{A[1], A[2] \dots A[n]\}$, matrix $A[i]$ has dimension $p[i-1] \times
    p[i]$ and we have to perform the matrix multiplication and parenthesize the product
    $A[1] \times A[2] \dots A[n]$ in such a way so the number of scalar multiplications
    will be minimum.


    Since matrix multiplication holds associativity but not commutativity, we have
    to follow above matrix order for multiplication but we are free to parenthesize
    the above multiplication. Two matrices are compatible for multiplication if number
    of columns in first matrix equals to rows in second.


    $C[i][j] = \sum_{k = 1}^{q} A[i][k] * B[k][j]$


    The number of places in parenthesis in sequence of $n$ matrices given by $p(n)$.
    Then,


    $p(n) = 1$ for $n=1$


    Let us insert split between matrices, subproduct may take place between $m$th
    and $m+1$th matrices. Thus, for any $m = 1$ to $n-1$, the recurrence relation
    will be,


    $p(n) = \left\{ \begin{matrix} 1, & \text{if } n = 1 \\ \sum_{m = 1}^{n - 1}p(m).p(n
    - m) & \text{if } n \geq 2 \end{matrix} \right.$


    Let $A[i \dots j]$ represent the product of $A[i], A[i+1] \dots A[j]$, where $i
    \leq j$. If problem is nontrial, $i > k$ then any parenthesization of the product
    $A[i], A[2] \dots A[j]$ must split the product between $A[k]$ and $A[k+1]$ for
    some integer $k$ where $i < k < j$. For some value of $k$, we first compute $A[i
    \dots k]$ and $A[k+1 \dots j]$ and then result is combined to get the final product
    $A[i \dots j]$. The cost of this process is therefore the sum of computing cost
    of matrix $A[i \dots k]$ and $A[k+1 \dots j]$ and cost of multiplying these two
    matrices together. To compute the matrix $A[i \dots j]$, suppose minimum $N[i,
    j]$ number of scalar multiplication are performed. $N[i, j]$ can be defined as:


    $N[i, j] = N[i, k] + N[k+1, j] + p[i-1]xp[k]xp[j]$ where $i \leq k < j$. Clearly,
    $N[i, i] = 0$.


    The orders of $A[i]$ is $P[i-1] \times P[i]$, so the order of $A[i \dots j]$ is
    $P[i-1] \times P[j]$.


    #### 3.3.3.1 Optimal cost algorithm


