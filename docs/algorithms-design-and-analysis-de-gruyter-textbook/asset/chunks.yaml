    \ 作为辅助过程。`Binomial-Heap-Merge` 将两棵树的根列表合并为一个单一且有序的线性链表。\n\n### 算法：`Binomial-Heap-Union\
    \ (T[1,] T[2])`\n\n```\n {\n  T ← Make-Binomial-Heap ( );\n  head [T] ← Binomial-Heap-Merge(T1,\
