  trans: "\n\n3. 如果它是叶子节点，则字段 `Leaf[a]` 为 `TRUE`，否则为 `FALSE`。\n\n2. 每个节点中还包含 `n[a] + 1`\
    \ 个指针。这些指针 `{c[1][a], c[2][a], … .c[n[a] + 1][a]}` 指向节点 `a` 的子节点。由于叶子节点没有子节点，因此叶子节点的\
    \ `c[i]` 字段未定义。\n\n3. 节点 `a` 的键 `{key[i][a]}` 划分了节点 `a` 的每个子树中保存的键的范围。如果 `k[i]`\
    \ 是存储在根节点为 `c[i][a]` 的子树中的任意键，那么\n\n`k[*i*]  ≤ *k**e**y*[1][*a*]  ≤ *k*[2]  ≤ *k**e**y*[2][*a*]\
    \  ≤ …  ≤ *k**e**y*[*n*[*a*]][*a*]  ≤ *k**e**y*[*n*[*a*]+1]`\n\n4. 每个叶子节点的深度与其他叶子节点相同，这被称为树的高度（`(h)``）。\n\
    \n5. 节点中存储的键的最小和最大数量是有边界的。使用固定的整数 `t  ≥ 2` 来表示这些边界。这被称为 B 树的**最大阶**。\n\n    1.\
    \ 节点（根节点外）键的下界是 **(t–1) 个键**。因此，除根节点外的每个非叶子节点至少有 `t` 个子节点。在非空树的情况下，根节点至少包含一个键。\n\
    \n    2. 节点键的上界是 **(2 t–1) 个键**。因此，非叶子节点最多可以有 `2 t` 个子节点。如果一个节点恰好包含 `(2 t–1)`\
    \ 个键，则称该节点为满节点。\n\n下图图 6.3 显示了高度为 2 的 B 树。所有节点包含 1,000 个键。\n\n![](img/b_9783110693607-006_fig_003.png)\n\
    \n图 6.3：高度为 2 的 B 树。\n\n### 6.3.1 在 B 树中查找键 `k`\n\nB-Tree-Search 过程计算最小的 `i`，使得第\
    \ `ith` 个键大于等于 `a`。如果第 `i^(th)` 个键等于 `a`，则搜索完成，否则将 `z` 设置为第 `ith` 个子节点。\n\n**算法：**\
    \ `B-Tree-Search (z, a)`\n\n```\n {\n           x = 1;\n           while (x ≤ n[z]\
    \ and a > keyx[z])\n                       do x = x + 1;\n           if (x ≤ n[z]\
    \ and a = keyx[z])\n                       then return (z, x);\n           if\
    \ (leaf[z] = TRUE)\n                       then return NIL;\n           else Disk-Read(cx[z]);\n\
    \                       return B-Tree-Serach (cx[z], a);\n}\n```\n\n**示例 6.2：**\
    \ 在图 6.4 所示的 B 树中查找键 `k  = 11`。\n\n![](img/b_9783110693607-006_fig_004.png)\n\n\
    图 6.4：B 树。\n\n**解：** `n[x] = 3`，`key[1] = 5`，`key[2] = 9`，`key[3] = 14`，且 `k  = 11`。\n\
    \n对于 `i  = 1`，\n\n当 `(i ≤ n[x] and k > key[i][x])` 时，\n\n即 `1  ≤ 3` 且 `11  > key[1][x]`\
    \ `{真}`\n\n所以 `i  = i  + 1`，即 `i  = 2`。\n\n再次，`2  ≤ 3` 且 `11  > key[2][x]` `{真}`\n\
    \n所以，`i  = i  + 1`，即 `i  = 3`。\n\n现在 `3  ≤ 3` 且 `11  > key[3][x]` `{假}`\n\n由于\
    \ while 循环的条件不成立，将在 `14` 的左侧进行检查。因此执行 `Disk-Read(c[i][x])`，即 `Disk-Read(c[3][x])`\
    \ 并返回 `B-Tree-Search(C[3], a)`。\n\n对于 `C[3]`，我们有 `n[x]=3`。再次 `i=1`，\n\n当 `(1 ≤ n[x]\
    \ and 11 > key[1][x])` 时 `{真}`\n\n所以 `i  = i  + 1`，即 `i  = 2`。\n\n再次，`2  ≤ 3`\
    \ 且 `11  > key[2][x]` `{真}`\n\n所以，`i  = i  + 1`，即 `i  = 3`。\n\n现在 `3  ≤ 3` 且 `11\
    \  > key[3][x]` `{假}`\n\n由于 while 循环的条件不成立，将在 `14` 的左侧进行检查。因此执行 `Disk-Read(c[i][x])`，即\
    \ `Disk-Read(c[3][x])` 并返回 `B-Tree-Search(C[3], k)`。\n\n**定理 6.3.2：** 如果 `n>=1`，则任何高度为\
    \ `h` 最小阶为 `t` 的 B 树满足 `h ≤ log_{t}((n + 1))`。\n\n**证明：** 如果 B 树的高度为 `h`，根节点包含一个键，所有其他节点至少包含\
    \ `(t–1)` 个键，因此深度 1 处至少有 `2` 个节点，深度 2 处有 `2t` 个节点，深度 3 处有 `2t²` 个节点，依此类推，深度 `h`\
    \ 处至少有 `2t^(h–1)` 个节点。\n$n \\geq 1 + (t - 1)\\sum_{i = 1}^{h}2^{i - 1} = 1 + (t\
    \ - 1)\\frac{2^h-1}{t-1} = 1 + 2^h-1 = 2^h$。\n$2^h-1 \\leq n$，$2^h \\leq n+1，$h\
    \ \\leq \\log_{t}(n+1)$。\n\n## 6.4 二项堆 (Binomial heap)\n\n这是一个类似于二叉堆的数据结构，它支持两个堆的合并操作。二项堆是二项树的集合。二项树的递归定义如下：\n\
    \n1. 0 阶二项树只有一个节点。\n2. 阶大于 1 的二项树（即 `k>=1`），`k` 阶二项树 (`B[k]`) 由连接两个 `k–1` 阶二项树\
    \ (`B[k–1]`) 形成。一个树的根是另一个根的左侧子节点（见图 6.5）。\n\n![](img/b_9783110693607-006_fig_005.png)\n\
    \n图 6.5：二项树。\n\n二项树的特征如下：\n\n1. 树中有 `2^k` 个节点，且 `k` 是树的高度。\n2. 在深度 `i` 处有 `k choose\
    \ i` 个节点，其中 `i=0, 1, 2 … k`。\n3. 根节点的阶为 `k`，大于其他节点的阶；此外，根的节点是从左到右阶为 `k–1, k–2,\
    \ … .0` 的二项树。\n\n**证明：** 我们对 `k` 使用归纳法进行证明。\n对于 `k=0`，每个属性对于 0 阶二项树成立。\n\n**归纳步骤：**\
    \ 假设对于 `k–1` 阶树成立。\n\n1. 将两个阶为 `k–1` 的树连接形成一个阶为 `k` 的树，`B[k]` 中的节点数为 `2^(k–1)`，因此阶为\
    \ `k` 的树有 `2^(k–1) + 2^(k–1) = 2^k` 个节点。\n2. `B[k]` 的高度比 `B[k–1]` 高一。因此，`(k–1)\
    \ + 1 = k`。\n3. 设深度 `i` 处的节点数为树 `B[k]` 的 `N(k, i)`。由于 `B[k]` 中深度 `i` 处的节点数等于 `B[k–1]`\
    \ 中深度 `i` 处的节点数加上 `B[k–1]` 中深度 `i–1` 处的节点数。\n\n$\\begin{matrix} & {N\\left( {k,i}\
    \ \\right){= N}\\left( {k - 1,i} \\right) + \\, N\\left( {k - 1,i - 1} \\right)\\\
    ,} \\\\ & {\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\, =^{\\mspace{180mu}\
    \ k - 1}C_{i} +^{k - 1}C_{i - 1} =^{k}C_{i}} \\end{matrix}$\n\n4. `B[k]` 的根是唯一阶比\
    \ `B[k–1]` 大的节点。它比 `B[k–1]` 多一个子节点。`B[k–1]` 中根的阶是 `k–1`。根据归纳假设，`B[k]` 的根是阶为 `k`。\n\
    \n"
- fmt: "The following procedure unites two heaps $T[1]$ and $T[2]$. Procedure uses\
    \ `Binomial-Link` and `Binomial-Heap-Merge` as auxiliary procedures. `Binomial-Heap-Merge`\
    \ merges root list of both the trees into a single and sorted linked list.\n\n\
    ### Algorithm: `Binomial-Heap-Union (T[1,] T[2])`\n\n```\n {\n  T ← Make-Binomial-Heap\
    \ ( );\n  head [T] ← Binomial-Heap-Merge(T1, T2);\n  free object T1 and T2 but\
    \ not the list they point to;\n  If head [T]  = NIL\n    Then return T;\n  prev- > a←\
    \ NIL;\n  a← head [T];\n  next- > a←sib[a];\n  While (next- > a is not NIL)\n\
        do if (deg[a] 1deg[next- > a] or\n     (sib [next- > a] 1 NIL and deg[sib[next- > a]]\
    \  = degree[a])\n      Then prev- > a ← a;    // CASE 1 & 2\na←next- > a;\n    else\
    \ if (key[a]  ≤ key[next- > a])\n     then sib[a] ← sib[next- > a];\n      Bionomial-Link\
    \ (Next- > a, a);  // CASE 3\n     else if (prev- > a  = NIL)\n      Then head\
    \ [T] ←next- > a;\n     else sib [Prev- > a] ← next- > a;           // Case 4\n\
          Bionomial-Link (a, next- > a); // CASE-4\n     a← next – > a;\n  next- > a←sib[a];\n\
      Return T;\n}\n```\n\n### `Binomial-Heap-Merge`: This procedure merges root list\
    \ of $T[1]$ and $T[2]$ into a single linked list that is sorted by degree in ascending\
    \ order.\n\n### Algorithm: `Binomial-Heap-Merge(T[1], T[2])`\n\n```\n {\n  x←head[T1];\n\
      y←head[T2];\n  head[T1]← Min-Degree(x,y);\n  if head[T1]  = NIL\n    return;\n\
      if head[T1]  = y\n    then y←x;\n  x←head[T1];\n  while (y  ≠ NIL)\n    do if\
    \ sib[x]  = NIL\n     then sib[x]←y;\n      return;\n     elseif (degree[sib[x]]\
    \  < degree[y])\n     then x←sib[x];\n     else z←sib[y];\n     sib[y] ←sib[x];\n\
         x←sib[x];\n}\n```\n\nThe time complexity of union operation is $O(\\lg n)$,\
    \ where $n$ is the number of nodes in $T[1]$ and $T[2]$.\n\n#### 6.4.1.4 Insertion\
    \ of a node in binomial heap\n\n### Algorithm: `Binomial-Heap-Insert (T, x)`\n\
    \n```\n {\n  T’←Make-Binomial-Heap();\n  P[x]←NIL;\n  child[x]←NIL;\n  sib[x]←NIL;\n\
      deg[x]←0;\n  head[T’]←x;\n  T←Binomial-Heap-Union(T, T’);\n}\n```\n\nThis algorithm\
    \ runs in $O(\\log n)$ time. The binomial heap $T'$ is created in $O(1)$ time\
    \ and union of $T'$ and $n$ node in time $O(\\log n)$.\n\n#### 6.4.1.5 Decrement\
    \ of a key with specific value\n\nFollowing algorithm decreases the key of node\
    \ $a$ to a new key $d$. It displays an error if $d$ is greater than $a$'s current\
    \ key.\n\n### Algorithm: `BH-Decrease-Key (T, a, d)`\n\n```\n {\n  If d  > key[a]\n\
        display ‘decrement not possible’;\n  key[a]←d;\n  b←a;\n  c←p[b];\n  while\
    \ c  ≠ NIL and key[b]  < key[c]\n    do exchange[b]↔key[c];\n    b←c;\n  c←p[b];\n\
    }\n```\n\nThis procedure takes $O(\\log n)$ time, since maximum depth of $a$ is\
    \ $\\log k$, where $k=\\log n$.\n\n#### 6.4.1.6 Deletion\n\nThis procedure deletes\
    \ $x$'s key from binomial heap $T$, we assume that no key has value $-\\infty$.\n\
    \n`Binomial-Heap-Delete(T, x)`\n`BH-Decrease-Key(T, x,-∞)`\n`Binomial-Heap-Min(T)`.\n\
    \nThe running time of this procedure is $O(\\log n)$.\n\n## 6.5 Fibonacci heap\n\
    \nFibonacci heaps are an arrangement of min heap trees. It is not necessary that\
    \ the trees must be binomial. In Fibonacci heap, trees are rooted but unordered.\
    \ Each node $x$ contains a pointer `parent[x]` to its parents and a pointer `child[x]`,\
    \ points to any one of its children. Circular doubly linked list is used to link\
    \ together the children of $x$. This list is called `child list of x`.\n\n![](graphic/converted/b_9783110693607-006_fig_006.jpg)\n\
    \nFigure 6.6: Binomial Heap. The advantages of using circular doubly linked list\
    \ are as follows:\n\n1. A node can be removed from this list in $O(1)$ time.\n\
    2. Two circular doubly linked lists can be concatenated into one list in $O(1)$\
    \ time.\n\nA pointer `min[H]` is used to access the heap $H$. This pointer points\
    \ to the root of the tree with minimum key; this is the smallest node of the heap\
    \ (see figure 6.7). The heap is empty if this pointer is NIL.\n\n### 6.5.1 Operation\
    \ on Fibonacci heap\n\n#### 6.5.1.1 New Fibonacci heap: `MAKE_FIB_HEAP`\n\nThis\
    \ procedure allocates and return Fibonacci heap object $H$, where $n[H]=0$, `min[H]=NIL`.\
    \ The time requirement of this procedure is $O(1)$.\n\n#### 6.5.1.2 Inserting\
    \ a node\n\nInsert a node $a$ into Fibonacci heap $H$, let us assume that the\
    \ node has already been allocated and that `key[a]` has already been filled in.\n\
    \n### Algorithm: `Fibo-Heap-Insert (H, a)`\n\n```\n {\n  deg[a]←0;\n  parent[a]←NIL;\n\
      child[a]←NIL;\n  left[a]←a;\n  right[a]←a;\n  mark[a]←FALSE;\n  concatenate\
    \ the root list containing a with root list H\n  if min[H]  = NIL or key[a]  < key[min[H]]\n\
        then min[H]←a;\n  n[H]←n[H]  + 1\n}\n```\n\n#### 6.5.1.3 Finding the minimum\
    \ node\n\nThe pointer `min[H]` points to root of the minimum node of heap, which\
    \ is also minimum node of heap. It can be directly accessed in $O(1)$ time.\n\n\
    ![](graphic/converted/b_9783110693607-006_fig_007.png)\n\nFigure 6.7: A Fibonacci\
    \ heap. ![](graphic/converted/b_9783110693607-006_fig_008.png)\n\nFigure 6.8:\
    \ Finding the minimum node.\n\n##### 6.5.1.4 Decreasing a Key\n\nThis operation\
    \ assigns a new key $k$ to the key of $a$ such that the new key is less than or\
    \ equal to current key.\n\n### Algorithm: `DECREASE_KEY (T, a, d)`\n\n//This procedure\
    \ uses `CUT` and `CASCADE-CUT` to maintain properties.\n\n```\n {\n  If d  > key[a]\n\
        display ‘decrement not possible’;\n  key[a]←d;\n  b←a;\n  c←p[b];\n  while\
    \ c  ≠ NIL and key[b]  < key[c]\n    do exchange[b]↔key[c];\n    b←c;\n  c←p[b];\n\
    }\n```\n\nThis procedure takes $O(\\log n)$ time, since maximum depth of $a$ is\
    \ $\\log k$, where $k=\\log n$.\n\n### Algorithm: `CUT (H, x, y)`\n\n//This procedure\
    \ cut off the link between $x$ and parent of $x$ i.e. $y$, making $x$ a root.\n\
    \n```\n {\n  Remove x from the child list of y.\n  deg[y] ←deg[y]‒1;\n  add x\
    \ to the root list of H.\n  Parent[x] ←NIL;\n  Mark[x]←False;\nReturn x.\n}\n\
    ```\n\n### Algorithm: `CASCADE-CUT (H, y)`\n\n$z←Parent[y]$;\n\nIf $(z≠NIL)$ then\n\
    \n    If(mark[y]=False) then\n\n      Mark[y]←True;\n    Else\n      CUT(H, y,\
    \ z);\n     CASCADE-CUT(H, z);\n\nReturn;\n\n\n\n# Chapter 7 Lab session\n\n##\
    \ Appendices\n\n**The programming examples for students:**\n\n**//1\\. Program\
    \ for Comparison of growth of functions\\\\**\n"
