    # Chapter 4 Advanced graph algorithm


    This chapter introduces graph concept and algorithms based on graph.


    ## 4.1 Introduction


    A graph is a collection of vertices and edges. These vertices are connected by
    edges. A graph can be defined by two sets V and E, where V is the set of vertices
    of the graph and E is the set edges. [Figure 4.1](#bodymatter-004.xhtml_b_9783110693607-004_fig_001)
    shows two graphs: each one has five vertices, graph A has six edges, and graph
    B has eight edges.


    ![](graphic/converted/b_9783110693607-004_fig_001.png)


    Figure 4.1: Graph A (a) and graph B (b).


    ### 4.1.1 Terminology


    Here are some terminologies used throughout this chapter:


    1.  **Subgraph:** As the name indicates it is also a graph. The *subgraph H* of
    a graph can be denoted as H = (V’, E’) such that V’ ∈ V and E’ ∈ E.


    2.  **Spanning Subgraph:** The spanning subgraph has all vertices of G but not
    necessarily edges.


    3.  **Connected Graph:** In connected graph, any of the two vertices have a path
    joining them.


    4.  **Adjacent Vertices:** Adjacent vertices are the end points of the same edge.


    5.  **Neighbor Vertices:** If two vertices are adjacent to one another, they are
    said to be neighbor vertices.


    6.  **Isolated Vertex:** If a vertex has no neighbor vertex it is said to be an
    isolated vertex.


    7.  **Complete Graph:** If every vertex of the n vertices of graph G is adjacent
    to the other n–1 vertices of G (see [Figure 4.2](#bodymatter-004.xhtml_b_9783110693607-004_fig_002)).


    ![](graphic/converted/b_9783110693607-004_fig_002.png)


    Figure 4.2: Complete graph.


    1.  **Tree:** A tree is a graph that is connected and has no cycles (see [Figure
    4.3](#bodymatter-004.xhtml_b_9783110693607-004_fig_003)).


    ![](graphic/converted/b_9783110693607-004_fig_003.png)


    Figure 4.3: Tree.


    ## 4.2 The graph search techniques


    There are two techniques for performing search operation on graphs, namely breadth
    first search (BFS) and depth first search (DFS).


    ### 4.2.1 Breadth first search


    BFS starts with a vertex q and makes it as visited. This vertex q is currently
    said to be unexplored. Exploring this vertex means all adjacent vertices of this
    vertex are visited. Next step is to visit all adjacent vertices of vertex q and
    which are still unexplored (see [Figure 4.4](#bodymatter-004.xhtml_b_9783110693607-004_fig_004)).
    When all adjacent vertices of q are visited then vertex q is said to be explored.
    Unexplored vertices are maintained in a list. All these vertices are then added
    to this list. Next vertex to be explored is the first node in this list. This
    process of vertex exploration keeps on going until the list of unexplored is not
    empty.


    ![](graphic/converted/b_9783110693607-004_fig_004.png)


    Figure 4.4: Breadth first search.


    **Algorithm:** *Breadth-First-Search (G)*


    *// Input: A Graph*


    *// Output: All the vertices are marked with the integers depicting the order
    they have been visited. Integer 0 indicates vertex p is not yet visited.*


     { Mark each vertex in G with 0\. // Not visited


       Visit_Order: =0; *//global variable*


       For all vertices p in V do


         If p has number 0 // not yet visited


         *EXPLORE* (p);


     }


    **Algorithm:** *EXPLORE (p)*


     {


        Visit_Order := Visit_Order+1;


        Mark p with the value *Visit_Order* and initialize queue with p;


        While queue is not empty do


           For every vertex q in V adjacent to vertex p do


           If q in not yet visited // marked with 0


              Visit_Order := Visit_Order +1;


           Mark q with Visit_Order;


           Add q to the queue;


           Remove vertex p from the front of queue;


     }


    **Complexity of BFS:** Queue space need is at most (n–1), if q is connected with
    (n–1) remaining vertices, and then adjacent vertices of q are on the queue all
    at once therefore,


    *S*(*n*, *e*)= *θ*(*n*)


    If Adjacency list is used for representation of graph G, then all adjacent vertices
    of p can be determined in time equivalent to the degree of p, that is, d(p). If
    G is directed graph, d(p) is the out degree of node p. The time for *for* loop
    in algorithm is of θ(d(p)) since each vertex in G can be explored exactly once.


    **Example 4.1:** Adjacency list representation [Figure 4.5](#bodymatter-004.xhtml_b_9783110693607-004_fig_005),


    ![](graphic/converted/b_9783110693607-004_fig_005.png)


    Figure 4.5: Graph and its adjacency list representation.


    In *Breadth-First-Search(G)* algorithm, each vertex is enqueued and dequeued exactly
    once and operation of enqueue and dequeue takes O(1) time. Therefore total time
    for performing the operation enqueue is O(|V|) because the list is searched at
    most once, for dequeue vertex. The time spent in adjacency list scanning process
    is O(|E|). The initialization takes time O(|V|). Hence complexity of the algorithm
    is O(|V| +|E|), when the graph is represented by adjacency linked list. For adjacency
    matrix representation, it is O(|V|²).


    ### 4.2.2 Depth first search


    DFS starts with a vertex p in G, p is said to be current vertex. Any edge (p,
    q) incident to the current vertex p is traversed by the algorithm. If this edge
    vertex q is already visited, then search backtrack to the vertex p. Otherwise
    go to q and q becomes new current vertex. This process is repeated until “deadend”
    is reached. Then backtracking is performed. The process ends when backtracking
    leads back to the starting vertex. DFS is a recursive algorithm ([figure 4.6](#bodymatter-004.xhtml_b_9783110693607-004_fig_006)).


    ![](graphic/converted/b_9783110693607-004_fig_006.png)


    Figure 4.6: Depth first search.


    **Algorithm**: *Depth-First-Search (G)*


    // Input: A graph G


    // Output: *All the vertices are marked with the integers depicting the order
    they have been visited. Integer 0 indicates vertex p is unvisited.*


     { Mark each vertex in G with 0.


      Visit_Order: = 0;


      For each vetex p in V do


         If p is not yet visited


         DFS_VISIT (p);


    }


    **Algorithm:** *DFS_VISIT (p)*


     {


      Visit_Order: = Visit_Order +1; //global variable Visit_Order


      Mark p with Visit_Order.


      For each vertex q in V adjacent to p do


      If q is not yet visited


         DFS_VISIT (q);


    }


    **Complexity of DFS:** The complexity of algorithm will be O (|V|²) if graph is
    represented by adjacency matrix. If the graph is represented by adjacency linked
    list the complexity will be O (|V| +|E|).


    **Example 4.2:** DFS traversal of the graph ([figure 4.7](#bodymatter-004.xhtml_b_9783110693607-004_fig_007))
    given later.


    ![](graphic/converted/b_9783110693607-004_fig_007.png)


    Figure 4.7: Graph and its DFS traversal.


    ## 4.3 Spanning tree


    A spanning tree of an undirected and connected graph is a subgraph that is a tree
    and contain all the vertices of G. There can be more than one spanning trees of
    a graph. Weights can also be assigned to edges of the graph; this weight represents
    edge cost or length. Such graphs are called ***weighted graph***. A **minimum
    spanning tree** (**MST**) is the spanning tree with minimum possible weight.


    ### 4.3.1 Kruskal’s algorithm


    This algorithm is used to find MST using greedy approach.


    **Algorithm:** *Kruskals-MST (G)*


    *// Input: A connected weighted graph G (V, E)*


    *// Output: E[MST]: The set of edges creating a MST.*'
