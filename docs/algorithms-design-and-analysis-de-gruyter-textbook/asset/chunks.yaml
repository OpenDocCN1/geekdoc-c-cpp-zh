    \ minimum, is achieved.\n\n## 3.4 Branch-and-bound technique\n\nThe branch-and-bound\
    \ technique like backtracking explores the implicit graph and deals with the optimal\
    \ solution to a given problem. In this technique, at each state, the bound is\
    \ calculated for a particular node and is checked whether this bound will be able\
    \ to give the solution or not. That means we calculate how far we are from the\
    \ solution in the graph. At each stage, there is a lower bound for minimization\
    \ problems and an upper bound for maximization problems. For each node, bound\
    \ is calculated by means of partial solution (PS). The calculated bound for the\
    \ node is checked with previous best result and if found that new PS results lead\
    \ to worse case, then bound with the best solution so far, is selected and we\
    \ leave this part without exploring it further. Otherwise, the checking is done\
    \ with the previous best result obtained so far for every PS while exploring.\n\
    \nIn branch-and-bound technique, we need a function whose value is computed for\
    \ each node of state space tree. This function helps in identifying the promising\
    \ and nonpromising nodes in state space tree and hence helps in reducing the size\
    \ of the tree. Also, it accelerates the algorithm. A good function is not easy\
    \ to find and this function also should be easily computable.\n\n### 3.4.1 Assignment\
