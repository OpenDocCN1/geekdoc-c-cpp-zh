  trans: "\n\n2. 比较动态规划与分治法 (DAC) 编程？\n\n3. 详细解释这两种技术：分治法与动态规划之间的主要区别？\n\n4. 动态规划的基本特征是什么？\n\
    \n5. 使用动态规划计算 `C(12,8)` 的值。\n\n6. 使用贪心算法解决部分背包问题。背包容量 `W`   60。\n\n7. 解释回溯算法的应用。\n\
    \n8. 比较暴力法与回溯法。\n\n9. 写出回溯法的控制抽象。\n\n10. 使用分支界法解决指派问题：\n\n| | F[1] | F[2] | F[3]\
    \ | F[4] |\n|---|---|---|---|---|\n| J[1] | 4 | 3 | 1 | 5 |\n| J[2] | 6 | 2 |\
    \ 9 | 8 |\n| J[3] | 3 | 4 | 7 | 6 |\n| J[4] | 2 | 8 | 4 | 9 |\n\n# 第 4 章 高级图算法\n\
    \n本章介绍了图的概念以及基于图的算法。\n\n## 4.1 引言\n\n图是顶点和边的集合。这些顶点通过边连接起来。一个图可以用两个集合 `V` 和 `E`\
    \ 定义，其中 `V` 是图的顶点集合，`E` 是边的集合。图 4.1 显示了两个图：每个图都有五个个顶点，图 A 有六条边，图 B 有八条边。\n\n![](img/b_9783110693607-004_fig_001.png)\n\
    \n图 4.1：图 A (a) 和图 B (b)。\n\n### 4.1.1 术语\n\n以下是本章中使用的一些术语：\n\n1. **子图 (Subgraph):**\
    \ 如其名，它也是一个图。图的子图 `subgraph H` 可以表示为 `H =  (V’, E’)`，使得 `V' ∈ V` 且 `E’   E`。\n\
    \n2. **生成子图 (Spanning Subgraph):** 生成子图包含图 `G` 的所有顶点，但不一定包含所有的边。\n\n3. **连通图 (Connected\
    \ Graph):** 在连通图中，任意两个顶点之间都有路径相连。\n\n4. **相邻顶点 (Adjacent Vertices):** 相邻顶点是同一条边的端点。\n\
    \n5. **邻顶点 (Neighbor Vertices):** 如果两个顶点相互相邻，则称为邻顶点。\n\n6. **孤立顶点 (Isolated Vertex):**\
    \ 如果一个顶点没有邻顶点，则称为孤立顶点。\n\n7. **完全图 (Complete Graph):** 如果图 `G` 的 `n` 个顶点中的每一个都与\
    \ `G` 的其他 `n–1` 个顶点相邻（参见图 4.2）。\n\n![](img/b_9783110693607-004_fig_002.png)\n\n\
    图 4.2：完全图。\n\n8. **树 (Tree):** 树是连通且无环的图（参见图 4.3）。\n\n![](img/9783110693607-004_fig_003.png)\n\
    \n图 4.3：树。\n\n## 4.2 图搜索技术\n\n在图上进行搜索有两种主要技术，即广度优先搜索 (BFS) 和深度优先搜索 (DFS)。\n\n\
    ### 4.2.1 广度优先搜索\n\nBFS 从一个顶点 `q` 开始并标记为已访问。该顶点 `q` 目前被认为是未探索。探索该顶点意味着该顶点的所有相邻顶点都已访问。下一步是访问顶点\
    \ `q` 的所有仍未探索的相邻顶点（参见图 4.4）。当 `q` 的所有相邻顶点都被访问后，顶点 `q` 即可认为已探索。未探索的顶点维护在一个列表中。所有这些顶点都会被添加到列表中。下一个要探索的顶点是列表中的第一个节点。这种顶点探索的过程持续进行，直到未探索列表为空。\n\
    \n![](img/9783110693607-004_fig_004.png)\n\n图 4.4：广度优先搜索。\n\n**算法: Breadth-First-Search(G)**\n\
    ```\n// 输入: 一个图\n// 输出: 所有顶点都标记有表示其访问顺序的整数。整数 0 表示顶点 p 尚未访问。\n{\n  将 G 中的每个顶点标记为\
    \ 0。 // 未访问\n  Visit_Order =0; // 全局变量\n  对于 V 中的所有顶点 p 执行\n    如果 p 的编号为 0 //\
    \ 尚未访问\n      EXPLORE(p);\n}\n```\n\n**算法: EXPLORE(p)**\n```\n{\n  Visit_Order\
    \ := Visit_Order+1;\n  将 p 标记为 Visit_Order 并用 p 初始化队列；\n  当队列不空时\n    对于 V 中与顶点\
    \ p 相邻的每个 q\n      如果 q 尚未访问 // 标记为 0\n        Visit_Order := Visit_Order +1;\n\
    \        将 q 标记为 Visit_Order;\n        将 q 加入队列;\n    从队列头部移除顶点 p;\n}\n```\n\n\
    **BFS 复杂度:** 队列空间需求最多为 (n–1)，如果 `q` 与剩余的 (n–1) 个顶点连接，那么 `q` 的相邻顶点同时在队列中，因此，`S(n,\
    \ e) = θ(n)`\n\n如果使用邻接表来表示图 `G`，则确定 `p` 的所有相邻顶点的时间与 `p` 的度等效，即 `d(p)`。如果 `G` 是有向图，`d(p)`\
    \ 是节点 `p` 的出度。算法中 `for` 循环的时间为 `θ(d(p))`，因为 `G` 中的每个顶点都可以恰好被探索一次。`p` 的所有相邻顶点的时间等于\
    \ `p` 的度，即 `d(p)`。如果 `G` 是有向图，`d(p)` 是节点 `p` 的出度。算法中 `for` 循环的时间为 `θ(d(p))`，因为\
    \ `G` 中的每个顶点都可以恰好被探索一次。`p` 的所有相邻顶点的时间表示 图 4.5。\n\n![](img/b_9783110693607-004_fig_005.png)\n\
    \n图 4.5：图的邻接表表示。\n\n在使用邻接表表示图 `G` 时，每个顶点被恰好入队和出队一次，初始化时间为 O(|V|)。因此，算法的复杂度在邻接表表示为\
    \ O(|V|+|E|)。如果使用邻接矩阵表示，则复杂度为 O(|V|²)。\n\n### 4.2.2 深度优先搜索\n\nDFS 从一个顶点 `p` 开始，如果该顶点\
    \ `p` 的边 `(p, q)` 尚未访问，则访问 `q` 并使 `q` 成为当前顶点。这个过程重复进行，直到到达“死胡同”。然后执行回溯（参见图 4.6）。\n\
    \n![](img/9783110693607-004_fig_006.png)\n\n图 4.6：深度优先搜索。\n\n**算法: Depth-First-Search(G)**\n\
    ```\n// 输入: 一个图\n// 输出: 所有顶点都标记有表示其访问顺序的整数。整数 0 表示顶点 p 尚未访问。\n{\n  将 G 中的每个顶点标记为\
    \ 0。\n  Visit_Order =0;\n  对于 V 中的所有顶点 p 执行\n    如果 p 为 0 // 尚未访问\n      DFS_VISIT(p);\n\
    }\n```\n\n**算法: DFS_VISIT(p)**\n```\n{\n  Visit_Order := Visit_Order+1;\n  将 p\
    \ 标记为 Visit_Order。\n  对于 V 中与 p 相邻的每个 q\n    如果 q 尚未访问\n      DFS_VISIT(q);\n\
    }\n```\n\n**DFS 复杂度:** 如果图由邻接矩阵表示，算法的复杂度为 O(|V|²)；如果由邻接表表示，则复杂度为 O(|V|+|E|)。\n\
    \n**示例 4.2:** DFS 遍历（图 4.7）稍后给出。\n\n![](img/b_9783110693607-004_fig_007.png)\n\
    \n图 4.7：图及其 DFS 遍历。\n\n## 4.3 生成树\n\n无向连通图的生成树是包含 G 的所有顶点的树形子图。一个图可以有多个生成树。图的边也可以分配权重；这种权重代表边的代价或长度。这样的图被称为***加权图***。**最小生成树**\
    \ (**MST**) 是权重和最小的生成树。\n\n### 4.3.1 Kruskal 算法\n\n该算法用于通过贪心方法寻找生成树。\n\n**算法:\
    \ Kruskal-MST(G)**\n```\n// 输入: 一个连通加权图 G (V, E)\n// 输出: E[MST]: 创建 MST 的边集合。\n\
    ```\n"
- fmt: "\n```\n//Sort E: Arrange edge weights in increasing order\n\n//w(e[i1]) ≤.\
    \ . . . ≤ w(e[i |E|]), |E| *Number of edges in G.*\n\n{\n    E[MST]⋮≡ Null(Φ);\n\
    \    counter: = 0;\n    j: =0;\n    While (counter < (|v|-1)) //TOTAL (|v|-1)\
    \ edges\n        j: = j+1;\n        If E[MST] U{e[ij]} is not a cycle. //An edge\
    \ which do not form cycle when added\n            E[MST]⋮≡ E[MST] U{e[ij]};\n\
    \            counter: =counter +1;\n    RETURN E[MST];\n}\n```\n\n**Example 4.3:**\
    \ Find the MST using Kruskal’s algorithm for given graph ([figure 4.8](#bodymatter-004.xhtml_b_9783110693607-004_fig_008)).\n\
    \n![](graphic/converted/b_9783110693607-004_fig_008.png)\n\nFigure 4.8: Graph.\n\
    \nThe minimal spanning tree is given in [figure 4.9](#bodymatter-004.xhtml_b_9783110693607-004_fig_009).\n\
    \n![](graphic/converted/b_9783110693607-004_fig_009.png)\n\nFigure 4.9: MST using\
    \ Kruskal’s algorithm.\n\n**Complexity of Kruskal’s Algorithm:** Complexity of\
    \ the algorithm is basically depends on the sorting of edge weights of a given\
    \ graph. Number of edges are |E|, so the complexity with an efficient sorting\
    \ algorithm will be O(|E|log[2]|E|).\n\n### 4.3.2 Prim’s algorithm\n\nThe Prim’s\
    \ algorithm to find MST is based on greedy approach. The input to Prim’s algorithm\
    \ is an edge-weighted connected graph (the digraph case is not relevant here)\
    \ on vertices which we suppose are numbered from 1 to n. At stage `r` we shall\
    \ have chosen a set `S` of `r` vertices and a spanning tree `T` on `S`, all of\
    \ whose edges lie in `G`. Initially `S` = `{1} and `T` has no edges. For the `rth`\
    \ stage we suppose inductively that `S` of size `r–1` and a spanning tree `T`\
    \ on `S` have been found. We select vertices `i` ε `S` and `j` ∉ `S` so that the\
    \ weight `a[ij]` of the edge `e` from `i` to `j` is as small as possible, and\
    \ adjoin `j` to `S` and `e` to `T`. When stage `n` is complete, all vertices have\
    \ been included, and we have MST for `G`. MST for example 4.3 is given in [figure\
    \ 4.10](#bodymatter-004.xhtml_b_9783110693607-004_fig_010) solved using Prim’s\
    \ a algorithm.\n\n**Algorithm:** `Prim(G)`\n\n```\n// Input: A connected weighted\
    \ graph\n//Output: E[MST]: The set of edges creating a MST.\n{\n    V[T] : ≡ {v[0]};\n\
    \    E[MST]≡ Φ;\n    For k: = 1 to |V|-1 do // |V|= n\n    Find minimum weight\
    \ e*= (v*,u*), which does not form cycle when include in E[MST,] among all the\
    \ edges (v, u) s.t v is in V[T] and u is in (v-V[T])\n    V[T]: ≡ V[T]U {u*}\n\
    \    E[MST]: ≡ E[MST] U{e*}\n    Return E[MST];\n}\n```\n\n**Complexity of Prim:**\
    \ If adjacency list is used for graph representation and the priority queue is\
    \ implemented as a min heap, the complexity will be O(|E|log |V|).\n\n![](graphic/converted/b_9783110693607-004_fig_010.png)\n\
    \nFigure 4.10: MST of Example 4.3 using Prim’s Algorithm.\n\n## 4.4 Shortest path\
    \ algorithm\n\nThis section includes algorithms to find shortest paths between\
    \ all pair of vertices and from one source to all other vertices in a graph.\n\
    \n### 4.4.1 Warhsall’s algorithm\n\nWarshall’s algorithm finds matrices `M[0]`,\
    \ `M[1]`, `M[2]` … … `M[n]`, where for each in the `(r,s)`th entry `M[m](r,s)`\
    \ of `M[m]` is the least length of a path from vertex `r` to vertex `s` where\
    \ all intermediate vertices lie in `{1,2, …}`, `M[n]` is the desired matrix and\
    \ this time we may find the entries of `M[m]` for `m > 0` by recursive equation\
    \ `M[m](r,s) = {M[m-1](r,s), M[m-1](r,m) + M[m-1](m,s)}`.\n\n**Algorithm:** `Warshall()`\n\
    \n```\n{\n    For p = 1 to |V| do\n    M[p, p]: = 0;\n    for p : 1 to |V| do\n\
    \    {\n        for q : 1 to |V| do\n        {\n            M[q,r] = Min(M[q,r],\
    \ M[q,p] + M[p,r]);\n        }\n    }\n}\n```\n\n**Example 4.4:**\n\n![](graphic/converted/b_9783110693607-004_fig_011.png)\n\
