    \nFigure 2.3: Example of Merge Sort.\n\n### 2.4.1 Analysis of merge sort\n\nThe\
    \ running time of an algorithm can be described by recurrence relation when the\
    \ algorithm contains a recursive call to itself. For `MergeSort()`, we assume\
    \ for simplicity that $n = 2^k$. A recurrence for DAC algorithm is based on three\
    \ steps.\n\n*   **Divide:** This step finds the middle of subarray, so taking\
    \ a constant time only.\n*   **Conquer:** Two $n/2$-sized subproblems are solved\
    \ recursively, which adds $2T(n/2)$ to the running time.\n*   **Combine:** Merging\
    \ process (on $n$ element) takes time proportional to number of element, that\
    \ is $cn$.\n\n$\\begin{matrix} & {So\\; T(n) = \\,\\left\\{ \\begin{matrix} {1,}\
    \ & {n\\,= 1}} \\\\2T\\left( \\frac{n}{2} \\right) + \\,cn,} & {n\\,> 1}} \\end{matrix}\
    \ \\right.} & {{where}\\;{n =2^{k}} \\\\ {{Solving}\\;by}\\{substitution}\\;method},}\
    \ & {\\Rightarrow T(n) \\in \\theta(n\\;log n)}\\end{matrix}$\n\nThe complexity\
    \ of merge sort is $O(n \\log n)$. Merge sort is not in place method as it requires\
    \ an auxiliary array to support the sorting. Also, this algorithm is not space\
    \ efficient since it requires extra array.\n\n## 2.5 Heap sort\n\nHeap sort is\
    \ a sorting algorithm that is based on comparisons. Heap sort is considered to\
    \ be improved selection sort, and like selection sort, it isolates its input into\
    \ a sorted and an unsorted locale, and it iteratively restores the unsorted locale\
    \ with the aid of extracting the smallest factor and transferring that to the\
    \ sorted locale. It is an in-place not stable algorithm. It was proposed by J.W.J.\
    \ Williams in 1964 and became the beginning of the heap.\n\n**Complete binary\
    \ tree:** It is a binary tree for which the vertex level indices of vertices forms\
    \ a complete interval $1, 2, 3, \\dots, n$ of integers (see Figure 2.4).\n\n**Heap:**\
    \ A heap is a complete binary tree with the property that the value at each node\
    \ is least as large as its children (see Figure 2.5). This property is called\
    \ heap property and this heap is called `max heap`. In contrast to this, in `min\
    \ heap`, the value is small as its children.\n\n**Vertex level order index:**\
    \ If `p` is the root then `index(p) = 1`, and if `lc` is left child of vertex\
    \ `p`, then `index(lc) = (index p)*2`. If `rc` is right child of same vertex `p`,\
    \ then `index(rc) = 1 + (index p)*2.\n\n![](graphic/converted/b_9783110693607-002_fig_004.png)\n\
    \nFigure 2.4: Complete and Incomplete Binary Tree.\n\nThe minimum height of a\
    \ binary tree on $n$ nodes is $\\lceil \\log_2(n+1) \\rceil$.\n\n![](graphic/converted/b_9783110693607-002_fig_005.png)\n\
    \nFigure 2.5: Example of Max Heap.\n\n`Adjust()` is a function take three inputs;\
    \ array `Ar[]`, integer `k`, and `m`. It take `Ar[1:m]` as a complete binary tree.\
    \ If subtree rooted at $2k$ and $2k+1$ are already max heap, then `adjust` will\
    \ rearrange element of `Ar[]` such that the tree rooted at $k$ is also max heap.\
    \ For $m$ element in `Ar[1:m]`, we can create heap by applying `Adjust()`, since\
    \ the leaf nodes are already heaps. So, we can begin by calling `Adjust()` for\
    \ the parents of leaf nodes and then work up by level until the root is reached.\n\
    \n**Algorithm:** `Adjust(Ar, k, m)`\n\n```\n {\n            i: = 2k; el: = Ar[k];\n\
    \            While (i ≤ m) do\n                        {\n                   \
    \                 If(i <m) and (Ar[i] < Ar[i+1]) then\n                      \
    \                          i:= i+1;\n                                    If(el\
    \ ≥ Ar[i]) then break;\n                                    Ar[⎿i/2⏌] : = Ar[i];\
    \ i: = 2i;\n                        }\n            Ar[i/2] : = el;\n}\n```\n\n\
    The function `Heapify(Ar,m)` readjust the element in `Ar[1:m]` to form a heap.\n\
    \n**Algorithm:** `Heapify(Ar, m)`\n\n```\n{\nfor k = \\lfloor m/2 \\rfloor to\
    \ 1 step-1 do\n    Adjust(Ar, k, m);\n}\n```\n\n**Example 2.4:** The elements\
    \ of an array to be sorted are ![](graphic/converted/b_9783110693607-002_fig_006a.png)\
    \ Figure 2.6 shows sorting process of the array elements.\n\n![](graphic/converted/b_9783110693607-002_fig_006.png)\n\
    \nFigure 2.6: Process of Heap Sort.\n\n### 2.5.1 Analysis of Heapify\n\nFor the\
    \ worst case analysis of `Heapify`, let $2^{k-1} \\leq n < 2^k$. The levels of\
    \ the n node complete binary tree are numbered 1 to $k$. Number of iteration of\
    \ `Adjust`, for level $i$, it is $(k-i)$. Number of nodes at level $i$ are given\
    \ by $2^{i-1}$. So, the total time for Heapify is proportional to\n\n$\\sum_{1\
    \ \\leq i \\leq k-1} 2^{i-1}(k-i) = n \\sum_{1 \\leq i \\leq k-1} \\frac{i}{2^i}\
    \ \\leq 2n = O(n)$\n\nSo, `Heapify` takes a linear time to create the heap using\
    \ `Adjust` function.\n\n### 2.5.2 Heap sort\n\n**Algorithm:** `HeapSort()`\n\n\
    ```\n {\n    Heapify (Ar,m);                               // transforming array\
    \ into max heap\n    for k:= m to 2 step -1 do\n    {\n         Temp:= Ar[k];\n\
    \         Ar[k]: = Ar[1];\n         Ar[1]: = Temp;\n         Adjust (Ar,1,k-1);\n\
    \    }\n}\n```\n"
