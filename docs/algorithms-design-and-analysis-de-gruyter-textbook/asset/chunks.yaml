    \ fabricates the last arranged cluster (or show) each thing in turn. It is substantially\
    \ less effective on enormous records than more advanced algorithms, for example,\
    \ heap sort, merge sort, or quick sort. Be that as it may, insertion sort gives\
    \ a few preferences:\n\n*   Implementation is easy.\n\n*   Good for small number\
