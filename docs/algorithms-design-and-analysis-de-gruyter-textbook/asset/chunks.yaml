    ### 1.7.3 替换法


    当递归关系包含向下取整（floor）或向上取整（ceiling）符号时，这种技术非常适用。替换法的基本步骤是：


    1. 猜测解的类型。

    2. 使用数学归纳法确定常数并证明该解是有效的。


    **示例 1.16：** `T(n) = 2T\left( \left\lfloor \frac{n}{2} \right\rfloor \right) +
    n`


    **解：**


    我们首先专注于发现该排列的上界。我们意识到向下取整和向上取整在处理递归关系时通常比较不便。


    因此，我们为递归关系创建一个递归树（见图 1.8）：


    `${T(n) = 2T}\left( \frac{n}{2} \right){+ n}`![](img/b_9783110693607-001_fig_008.png)


    图 1.8：示例 1.16 中函数 `T(n)` 的树形表示。


    因此：


    $\begin{matrix} & {{T(n) =}\left\{ {{n + 2}\frac{n}{2}{+ 4}\frac{n}{4} + ...........{+
    n}} \right\}{i +}2^{i}{T(1)}} \\ & {{T(n) = in +}2^{i}\ {.c}} \\ & {{T(n) = nlo}g_{2}{n
    + n}.c} \\ {\Rightarrow{T(n)} \in O(nlogn)}} \end{matrix}$


    递归关系 `T(n)= 2T\left( \left\lfloor \frac{n}{2} \right\rfloor \right) + n`


    $\begin{matrix} & {{Let\ T}(1) = 1}} \\ {{we}\,{have,T(n)} \leq c\, n}} \end{matrix}$


    所以基础情况不成立。利用渐近符号，当 `n \ge 2` 时，`T(2)=4, T(3)=5`。假设对于 $\lfloor n/2 \rfloor$ 有 $T(n)
    \le c n \log$：


    **替换法：**


    $\begin{matrix} & {{T(n) = {2T}\left( \left\lfloor \frac{n}{2} \right\rfloor \right)
    + n,\underline{T(1)=1}}} \\ {{Let\,us}\,assume,true\,for}\,\left\lfloor \frac{n}{2}
    \right\rfloor}} & {T\left( \frac{n}{2} \right) \leq c\left\lfloor \frac{n}{2}
    \right\rfloor\,\log\left\lfloor \frac{n}{2} \right\rfloor}} \\ {T(n) \leq 2\left(
    {c\left\lfloor \frac{n}{2} \right\rfloor\log\left\lfloor \frac{n}{2} \right\rfloor}
    \right) + n} \\ {\leq c\,n\,\log\left\lfloor \frac{n}{2} \right\rfloor\, + n}
    \\ {= c\,n\logn - (c - 1)n} \\ {T(n) \leq c\,n\log n} {{for}\, c \geq 1}} \end{matrix}$


