    Design and analysis of algorithm is a difficult subject for students as well as
    faculty members, especially for those who do not have sound knowledge of mathematics.
    Students require a simple, perfect explanation of the topic and algorithms. The
    book covers all mathematical aspects related to the design of algorithm. The text
    of the book is quite easy; every chapter contains practice question, which is
    sufficient to clear the concept of the chapter. The book, which we are presenting,
    is based on our lectures on the subject, in which we explain almost all the topics
    in a simple systematic manner but comprehensive.


    This book contains all necessary mathematics background and clears the concepts
    of the students.


    The organizations of chapters are as follows:


    **Chapter 1:** Basic knowledge of mathematics, relations, recurrence relation
    and solution techniques, function and growth of functions.


    **Chapter 2:** Different sorting techniques and their analysis.


    **Chapter 3:** Greedy approach, dynamic programming, branch-and-bound techniques,
    backtracking and problems, amortized analysis, and order statics.


    **Chapter 4:** Graph algorithms, breadth-first search, depth-first search, spanning
    tree, flow-maximization algorithms, and shortest path algorithms.


    **Chapter 5:** Binary search tree, red black tree, binomial heap, B-tree, and
    Fibonacci heap.


    **Chapter 6:** Approximation algorithms, sorting networks, matrix operations,
    fast Fourier transformation, number-theoretic algorithm, computational geometry
    randomized algorithms, string matching, NP-hard, NP-complete, and Cook’s theorem.


    # Chapter 1 Introduction


    ## 1.1 Algorithm


    An algorithm is a finite sequence of computational steps that produces the desired
    output when applied on a certain problem with necessary input values. In algorithm,
    every step must be clear, simple, definite, and unambiguous. [Figure 1.1](#bodymatter-001.xhtml_b_9783110693607-001_fig_001)
    shows diagrammatic representation of algorithm.


    ```

    ![](graphic/converted/b_9783110693607-001_fig_001.png)

    ```


    Figure 1.1: Algorithm.


    ## 1.2 Another definition


    An algorithm is defined as an ultimate group of instructions to achieve a given
    set of goals to fulfill the given criteria.


    1. **Input**: Zero or more quantities must be passed externally as input to algorithm.

    2. **Output:** Minimum one quantity must be formed as an output.

    3. **Finiteness:** An algorithm must be well defined in a finite set of steps.

    4. **Definiteness**: Each and every instruction of a given algorithm must be precise
    and unambiguous.

    5. **Effectiveness:** Every statement/instruction specifically contributes something
    in solution, defined by an algorithm.


    **Example 1.1:** We will discuss an example of a sorting algorithm.


    **Input:** Set of elements (sequence)


    `a[1]`, `a[2]`……`a[n]`


    where elements are in random fashion.


    **Output:** Elements in ascending order, that is:


    `a[i]≤ a[i+1]`


    ## 1.3 Analyzing the performance of algorithms


    Analysis of the algorithms allows us to take decisions about the value of one
    algorithm over another. When an algorithm is executed in computer, it requires
    central processing unit (CPU, for performing its operations) and memory (for storing
    program and data). There are two parameters on which we can analyze performance
    of algorithm. These are `time complexity` and `space complexity`. As compared
    to space analysis, the analysis of time for an algorithm is important, whenever
    necessary, both complexities are used. The amount of memory required by program
    to run conclusion is known as `space complexity`. Space is a kind of resource
    that is reusable, and we can easily increase the space (memory) of system. But
    time is a resource that is limited, not reusable.


    Time complexity completely relies on the size of the input. The sum of time of
    CPU needed by algorithm (program) to execute conclusion is known as `time complexity`.
    It should be noted that the same algorithm can take different time to run. There
    are three kinds of time complexity: `best`, `worst`, and `average`. `Best-case
    complexity` is the minimum amount of time taken by algorithm for n-sized input.
    `Average-case complexity` is the time taken by algorithm having typical data of
    size `n`. `Worst-case complexity` is the maximum amount of time required by algorithm
    for n-sized input. These terms will be discussed later in this.


    ## 1.4 Growth of the functions


    The time complexity of an algorithm is generally a function of input size `n`.
    Growth order of a function indicates how fast a function grows with respect to
    change in input size `n`. Some useful functions are:


    * Linear function: `n`

    * Square function: `n²`

    * Exponential function: `2^n`

    * Logarithmic function: `log2n`


    [Figure 1.2](#bodymatter-001.xhtml_b_9783110693607-001_fig_002) shows how various
    functions grow with the input size `n`. The graph is evidence for how fast exponential
    function grows in comparison to other functions.


    ```

    ![](graphic/converted/b_9783110693607-001_fig_002.png)

    ```


    Figure 1.2: Plotting function values.


    ## 1.5 Asymptotic notations


    Whenever we learn about an algorithm, we are keen to depict them as per their
    preciseness and efficiency. In other words, we are mainly concerned about the
    growth of the running time of an algorithm (not in exact exact time). Scientifically,
    this phenomenon is called `asymptotic running time`. There is an acute need to
    design a method to find out the rate of growth of functions so we can compare
    algorithms. Asymptotic notation is an innovative way to provide the methodology
    for categorizing functions according to the rate of growth of function.


    ### 1.5.1 The O (big oh) notation


    Let `f(n)` and `g(n)` are two positive functions. A function `f(n)` is said to
    be in `O(g(n))` signified by `f(n) = O(g(n))`. If `f(n)` is bounded above by some
    positive multiple of `g(n)` for large values of `n`, i.e there exists some positive
    constant `c` and some nonnegative whole number `n[0]` (allude [Figure 1.3](#bodymatter-001.xhtml_b_9783110693607-001_fig_003))
    with the goal that


    `f(n) ≤ c * g(n)`, where `n ≥ n[0]`


    ```

    ![](graphic/converted/b_9783110693607-001_fig_003.png)

    ```


    Figure 1.3: Growth of the Function `f(n)` and `g(n)` for Big oh notation.


    **Example 1.2:**


    `500n + 1 = f(n)` says


    `500n + 1 ≤ 500n + n` {∀ n ≥ 1}

    `501n ≤ 501n²`

    `500n + 1 ≤ 501n², n ≥ 1`


    So `c = 501`, and `n[0] = 1`


    `500n + 1 ∈ O(n²)`


    ### 1.5.2 The Ω notation


    Let `f(n)` and `g(n)` are two positive functions. The function `f(n)` is said
    to be in `Ω(g(n))` (Omega of g(n)) meant by `f(n) = Ω(g(n))`; if function `f(n)`
    is lower bounded by some positive multiple of `g(n)` for some large value of `n`,
    i.e there exist a positive constant `c` and some nonnegative whole number `n[0]`
    (allude [Figure 1.4](#bodymatter-001.xhtml_b_9783110693607-001_fig_004)) with
    the goal that


    `f(n) ≥ c * g(n)`, where `n ≥ n[0]`


    ```

    ![](graphic/converted/b_9783110693607-001_fig_004.png)

    ```


    Figure 1.4: Growth of the Function `f(n)` and `g(n)` for Omega notation.


    **Example 1.3:**


    `f(n) = (n³)`

    `g(n) = (n²)`


    `n³ ≥ n²` where n ≥ 0

    `n³ ≥ 1.n²` where `n[0] ≥ 0`


    Hence, `c = 1`, `n[0] = 0`, `n³ ∈ Ω(n²)`


    ### 1.5.3 The θ notation


    Let `f(n)` and `g(n)` are two positive functions. A function `f(n)` is said to
