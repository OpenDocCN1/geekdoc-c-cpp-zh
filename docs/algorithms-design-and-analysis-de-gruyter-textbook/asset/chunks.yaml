    ,M[i]);\n  nf=1,line=1;\n  for(i=0;i<=n-2;i++)\n  {\n   f=0;\n   if(PM==M[i])\n\
       {\n    f=1,x=0;\n    for(j=i;j<(i+(m-1));j++)\n    {\n     if(T[j]!=P[x])\n\
         f=0;\n     break;\n     x++\n    }\n   if(f==1)\n   {\n     printf(\"\\n\\\
    n%d 模式在偏移量 %d 处匹配\",line,i);\n     nf=0;\n     line++;\n   }\n  }\n }\n  if(nf==1)\n\
      printf(\"\\n\\n 模式未匹配 \");\n  getch();\n}\nint Todec(int a[],int l,int u)\n\
