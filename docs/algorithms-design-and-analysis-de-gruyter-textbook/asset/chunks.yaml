          else sib [Prev- > a] ← next- > a;           // 情况 4\n      Bionomial-Link\
    \ (a, next- > a); // 情况-4\n    a← next – > a;\n  next- > a←sib[a];\n  Return T;\n\
    }\n```\n\n### `Binomial-Heap-Merge`：此过程将 $T[1]$ 和 $T[2]$ 的根列表合并为一个单一链表，该链表按度数升序排序。\n\
    \n### 算法：`Binomial-Heap-Merge(T[1], T[2])`\n\n```\n {\n  x←head[T1];\n  y←head[T2];\n\
      head[T1]← Min-Degree(x,y);\n  if head[T1]  = NIL\n   返回;\n  if head[T1]  = y\n\
        则 y←x;\n  x←head[T1];\n  while (y  ≠ NIL)\n   do if sib[x]  = NIL\n    则 sib[x]←y;\n\
         返回;\n    elseif (degree[sib[x]]  < degree[y])\n     则 x←sib[x];\n    else\
    \ z←sib[y];\n    sib[y] ←sib[x];\n    x←sib[x];\n}\n```\n\n并运算操作的时间复杂度为 $O(\\\
    lg n)$，其中 $n$ 是 $T[1]$ 和 $T[2]$ 中的节点数。\n\n#### 6.4.1.4 在二项堆中插入节点\n\n算法：`Binomial-Heap-Insert\
    \ (T, x)`\n\n```\n {\n  T’←Make-Binomial-Heap();\n  P[x]←NIL;\n  child[x]←NIL;\n\
      sib[x]←NIL;\n  deg[x]←0;\n  head[T’←x;\n  T←Binomial-Heap-Union(T, T’);\n}\n\
    ```\n\n该算法运行时间为 $O(\\log n)$。二项堆 $T'$ 的创建需要 $O(1)$ 时间，$n$ 个节点的合并需要 $O(\\log n)$。\n\
    \n#### 6.4.1.5 减小特定键\n\n以下算法将节点 $a$ 的键减小为新键 $d$。如果 $d$ 大于 $a$ 当前的键，则显示错误。\n\n\
    算法：`BH-Decrease-Key (T, a, d)`\n\n```\n {\n  If d  > key[a]\n    显示‘decrement\
