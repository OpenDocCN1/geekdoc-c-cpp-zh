- fmt: "\nA deterministic algorithm is one that consistently acts a similar way given\
    \ a similar input; the input totally decides the sequence of calculation execution\
    \ by the algorithm. Randomized algorithm puts together their conduct with respect\
    \ to the input as well as on a few arbitrary decisions (see figure 5.5). The equivalent\
    \ randomized algorithm given a similar input on numerous occasions may perform\
    \ diverse calculation in every invocation. This implies, among other change that\
    \ the running time of a randomized algorithm on a given input is not, at this\
    \ point fixed however itself a random variable. At the point when we investigate\
    \ randomized algorithm, we are regularly keen on the most pessimistic scenario:\
    \ worst case running time.\n\n![](graphic/converted/b_9783110693607-005_fig_004.png)\n\
    \nFigure 5.5: Deterministic and randomized algorithm.\n\n### 5.7.1 The nut and\
    \ bolt problem\n\nLet us assume that we have `n` nuts and `n` bolts of diverse\
    \ dimensions. Every nut fits with just one bolt and vice versa. The nuts and bolts\
    \ are all approximately just of the equal size. We wish to discover the nut matches\
    \ a specific bolt. Then, `(n–1)` test in worst case whereas in average case, `(n/2)`\
    \ test are to be performed.\n\nLet the number of comparisons to discover a match\
    \ for a sole bolt out of `n` nuts is denoted by `T(n)`. Obviously when we have\
    \ only one 1 nut then number of comparisons will be 0 and in case of 2 nuts, the\
    \ number of comparisons will be one. If number of nuts is greater than 2, then\
    \ `T(n)` have value between 1 to `(n–1)`. So expected value of `T(n)` would be:\n\
    \n$E\\left\\{ {T(n)} \\right\\}\\, = \\sum\\limits_{k = 1}^{n - 1}{k.P_{r}\\left\\\
    lbrack {T(n) = k} \\right\\rbrack}.$\n\nTypes of randomized algorithm:\n\n1. LAS\
    \ VEGAS: A randomized algorithm that always return a correct result but running\
    \ time may vary between executions. Ex: randomized quick sort.\n\n2. MONTE CARLO:\
    \ A randomized algorithm that terminates in polynomial time but might produce\
    \ erroneous result. Ex: randomized min cut algorithm.\n\n## 5.8 Computational\
    \ geometry\n\nComputational geometry is a part of computer science given to the\
    \ investigation of algorithm which can be expressed as far as geometry. Some absolutely\
    \ geometrical issues emerge out of the investigation of computational geometric\
    \ algorithms, and such problems are additionally viewed as a major aspect of computational\
    \ geometry. The primary catalyst for the advancement of computational geometry\
    \ as a control was progress in computer graphics and computer aided design and\
    \ manufacturing, yet numerous issues in computational geometry are old style in\
    \ nature and may originate from numerical perception.\n\nOther significant utilizations\
    \ of computational geometry incorporate robotics, geographic data framework, (geometrical\
    \ area and search, route arranging), integrated circuit plan (IC geometry structure\
    \ and confirmation), and computer aided designing.\n\n## 5.9 The convex hull\n\
    \nThe convex hull of a collection `Q` of points is the least convex polygon `P`\
    \ for which each point in `Q` is either on the boundary of `P` or in its interior\
    \ (see figure 5.6). The convex hull of `Q` is denoted by `CH(Q)`.\n\n`Q={p[0],\
    \ p[1], p[2],………p[12]}`![](graphic/converted/b_9783110693607-005_fig_005.png)\n\
    \nFigure 5.6: The convex hull.\n\nNaturally, we assume that each point in `Q`\
    \ is a nail sticking out from a board. The convex hull is then the shape formed\
    \ by a light rubber band that surrounds all the nails.\n\nGRAHAM-SCAN(Q)\n\n1.\
    \ Let `P[0]` be the point in `Q` with least value of `y` of coordinate or the\
    \ left most such point in case of tie.\n2. Let `{P[1], P[2], … … P[m]}` be the\
    \ rest of the points in `Q` sorted by polar angle in counterclockwise fashion\
    \ around `P[0]`. (if more than one point has a same angle, remove all but the\
    \ one that is at maximum distance from `P[0]`.)\n3. `PUSH(P[0], S)`\n4. `PUSH(P[1],\
    \ S)`\n5. `PUSH(P[2], S)`\n6. `for i = 3 to m`\n7. `do while the angle formed\
    \ by points NEXT TO TOP (S'), TOP (S'), and P[i] makes a nonleft turn.`\n8. `POP(S)`\n\
    \   a. `PUSH(P[i], S)`\n9. `Return S`\n\n![](graphic/converted/b_9783110693607-005_fig_006.png)\n\
    \nFigure 5.7: Counterclockwise and clockwise Turn.\n\n### 5.9.1 Counterclockwise\
    \ and clockwise\n\n![](graphic/converted/b_9783110693607-005_fig_007.png)\n\n\
    Figure 5.8: Condition for intersecting lines.\n\n`P[0] = (x[0], y[0]), P[1] =\
    \ (x[1], y[1]), P[2] = (x[2], y[2])`\n`P[1] - P[0] = (x[1] - x[0], y[1] - y[0])`\n\
    `P[2] - P[0] = (x[2] - x[0], y[2] - y[0])`\n`(x[1] - x[0])*i + (y[1] - y[0])*j\
    \ - (x[2] - x[0])*i - (y[2] - y[0])*j`\nIf the earlier expression is positive\
    \ at point `P[1]` is clockwise from `P[0]P[2]` and if it is negative then counterclockwise.\n\
    \n### 5.9.2 Finding whether two segments intersect\n\nA line segment `L[1]L[2]`\
    \ intersects the other if the end points `L[1], L[2]` lie on opposite side of\
    \ the other. A border line arises when both the lines coincide. The two conditions\
    \ to check whether line segments intersect each other are as follows (see figure\
    \ 5.8):\n\n1. Each line segment straddles the line containing the other.\n2. An\
    \ end point of one segment lies on the other.\n\n![](graphic/converted/b_9783110693607-005_fig_008.png)\n\
    \nFigure 5.9: Segment intersection.\n\nTo check whether two segments are intersecting\
    \ or not (see figure 5.8) the algorithm is given below. `SEGMENT INTERCT(L[1],\
    \ L[2], L[3], L[4])`\n\n1. `c[1] <- direction(L[3], L[4], L[1])`\n2. `c[2] <-\
    \ direction(L[3], L[4], L[2])`\n3. `c[3] <- direction(L[1], L[2], L[3])`\n4. `c[4]\
    \ <- direction(L[1], L[2], L[4])`\n5. `if {(c[1] > 0) and (c[2] < 0)} or {c[1]\
    \ < 0 and c[2] > 0} and {c[3] > 0 and c[4] < 0} or {c[3] < 0 and c[4] > 0}`\n\
    6. `return true`\n7. `else if c[1] = 0 and on_segment(L[3], L[4], L[1])`\n8. `return\
    \ true`\n9. `else if c[2] = 0 and on_segment(L[3], L[4], L[2])`\n10. `return true`\n\
    11. `else if c[3] = 0 and on_segment(L[1], L[2], L[3])`\n12. `return true`\n13.\
    \ `else if c[4] = 0 and on_segment(L[1], L[2], L[4])`\n14. `return true`\n15.\
    \ `return false`\n\n`Direction(L[i], L[j], L[k])`\n1. `return(L[k] - L[i]) x (L[j]\
    \ - L[i])`\n\n`On-segment(L[i], L[j], L[k])`\n1. `if min(x[i], x[j]) <= x[k] <=\
    \ max(x[i], x[j]) and min(y[i], y[j]) <= y[k] <= max(y[i], y[j])`\n2. `return\
    \ true`\n3. `else return false`\n\n![](graphic/converted/b_9783110693607-005_fig_002.png)\n\
    \nFigure 5.2: Graph.\n\n## 5.10 Class P problems\n\nAn algorithm shows a problem\
    \ is in polynomial time if its worst-case time efficiency belongs to `O(p(n))`,\
    \ where `p(n)` is polynomial of `n` (input size). These are easy problems since\
    \ `log[n] < n`, for `n`, so `t(n) ∈ O(log n)` also give `t(n) ∈ O(n)`.\n\nThe\
    \ problems that can be solved in polynomial time are called tractable. Problem\
    \ that cannot be solved in polynomial time are called intractable. Example: Sorting\
    \ and searching problems are class P problems.\n\n### 5.10.1 NP (nondeterministic\
    \ Polynomial Time) Problems\n\nClass NP is the decision class problems that can\
    \ be solved by nondeterministic polynomial algorithm. Any problem for which the\
    \ answer is either \"yes\" or \"no\" (0 or 1) is called a decision problem. A\
    \ problem is NP if you can quickly (in polynomial time) test whether a solution\
    \ is correct (without worrying about how many rounds it might be to find a solution).\
    \ Problems in NP class are relatively easy. Example: **Long simple path in a graph**.\n\
    \nDoes there exists a simple path from S to t with at least k edges?\n\nIf we\
    \ are given a path, we can quickly look at it and add up the length S, checking\
    \ that it really is a path with length at least k, this can be done in linear\
    \ (polynomial time).\n\n### 5.10.2 Any problem in P is also in NP\n\nThus P ⊆NP\n\
    \nSearching and sorting problems are P problems, so NP problems as well.\n\n###\
    \ 5.10.3 NP Hard Problems\n"
