    \ 6.3: B-tree of height 2.\n\n### 6.3.1 Searching key *k* in B-tree\n\nB-Tree-Search\
    \ procedure computes the smallest i such that the ith key is more than or equal\
    \ to a. If the i^(th) key is equal to a, then the search is done, otherwise set\
    \ z to the ith child.\n\n**Algorithm:** *B-Tree-Search (z, a)*\n\n```\n {\n  \
