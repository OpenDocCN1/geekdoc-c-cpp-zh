  trans: "\n设 `L[1]` 和 `L[2]` 是问题，如果 `L[1]` 可以归约为 `L[2]`，意味着存在一种确定性多项式时间算法，通过一个在多项式时间内解决\
    \ `L[2]` 的确定性算法来解决 `L[1]`。\n\n**定义：** 问题 `L` 是 NP Hard 的，当且仅当满足性问题（satisfiability）归约为\
    \ `L`（满足性 `α L`）。\n\n### 5.10.4 NP 完全\n\n一个问题 `L` 是 NP 完全的，当且仅当 `L` 是 NP Hard\
    \ 且 `L∈NP`。例如：顶点覆盖问题、旅行商问题、哈密顿圈问题、团问题等等。\n\n### 5.10.5 确定性算法的停机问题\n\n停机问题是判定对于一个具有输入\
    \ `I` 的任意确定性算法 `A`，它是否会终止（或进入无限循环）。该问题是可判定的，不存在任何复杂度的算法可以解决它，因此该问题不在 NP 中。为了证明\n\
    \n> 满足性 α 时间停机问题\n\n构造一个问题 `A`，其输入是一个命题公式 `X`，如果 `X` 有 `n` 个变量，则 `A` 尝试 `2^n`\
    \ 种可能的真值赋值并验证 `X` 是否满足。如果，则 `A` 停止；如果，则 `A` 进入无限循环。\n\n因此，`A` 在输入 `X` 上停机当且仅当\
    \ `X` 可满足。如果我们有一个针对停机问题的多项式时间算法，那么我们就可以使用 `A` 在多项式时间内解决满足性问题，而 `X` 是停机问题算法的输入。因此，停机问题是\
    \ NP hard，但不是 NP。\n\n### 5.10.6 满足性问题\n\n设布尔表达式为\n\n`E` ℃≡ `a` ��∧ ⅅ¬(`b` ��∨\
    \ ⅅ`c`), `E`(`T`) ℃= 1 ⅅ*i*.*e*. ⅅ`E` ⅅ*i**s*t**r**u**true*.\n\n当 `a` 为真且 ¬(`b`\
    \ ��∨ ⅅ`c`) 为真时（当 `b` 和 `c` 都为假时），`E` 为真。如果存在至少一个真值赋值 `T` 使得 `E(T)`  = 1，则称表达式\
    \ `E` 是满足的。\n\n`E` ℃≡ `a` ��∧ ⅅ¬(`b` ��∨ ⅅ`c`) \n\n是满足的，如果\n\n`T`(a`) ℃= 1, `T`(b`)\
    \ ℃= 0, `T`(c`) ℃= 0\n\n对于这些值，`E(T)`  = 1。\n\n定理 5.10.4: (Cook 定理) 该定理指出满足性问题是\
    \ NP 完全的。\n\n## 5.11 团 (Clique)\n\n图 `G(V, E)`称为完全图，如果图 `G` 的所有顶点都相互相邻。图 `G` 的一个团\
    \ `C` 是形成完全图的顶点集合。团的大小是 `C` 中顶点的数量。发现最大的团是一个 NP-hard 问题，被称为极大团问题。该问题与顶点覆盖问题和独立集问题密切相关。\n\
    \n设集合 `E` 是 `E` 的补集（`G` 中的边集），如果 `S` 是补图 `G*` 中的最大独立集，则 `S` 是 `G` 的极大团。由此推导出 `V–S`\
    \ 是 `G*` 中的最小顶点覆盖。图 5.11 给出了示例。\n\n![](img/b_9783110693607-005_fig_010.png)\n\n\
    图 5.11: 顶点 2-3-4-5 形成大小为 4 的团。\n\n![](img/b_9783110693607-005_fig_009.jpg)\n\n\
    图 5.10: P、NP、NP hard 和 NP 完全问题之间的关系。\n\n### 5.11.1 团判定问题\n\n该问题是在给定的图 `G(V, E)`\
    \ 中找到一个特定大小（假设 `k`）的团。它通常被称为 k-团问题。\n\n### 5.11.2 团判定算法是非确定性算法\n\n该算法找到一个包含 `k`\
    \ 个不同顶点的集合，然后检查这些顶点是否形成完全图 `G`。图 `G` 用邻接矩阵表示，且 `|V|=n`。\n\n**算法:** `DCK(G, n,\
    \ k)`\n\n```\nS=Φ\ni=1 to k do \n{\n       q=choice(1, n)\n       if q∈S then\
    \ failure()\n       S=SU{q}\n } // 对于所有对 (p, q)，使得 p∈S 且 q∈S 且 p≠q.\nIf (p, q)\
    \ 不是 G 的边 then failure()\nElse success().\n```\n\n**定理：证明团判定问题是 NP 完全的。**\n\n\
    **证明：** 我们通过两个步骤证明这一点：\n\n1. 证明团问题在 NP 中。\n2. 3CNF (3SAT) 可以归约到团判定问题\n\n假设我们给出一个团，那么通过计算团中顶点的数量来检查它是否为大小为\
    \ `k` 的团是非常简单的，这将需要多项式时间，因此 k-团判定是 NP 问题。\n\n第二部分，我们将证明 3CNF (3SAT) 可以归约到团判定问题。考虑一个布尔表达式，`E`\
    \ ℃= `C[1]` ��∧ ⅅ`C[2]` ��∧ ⅅ`C[3]` ��∧ ⅅ……`C[k]` 这些 `E` 中的 k 个子句，每个子句 `C[r]`\
    \ ℃= `l[1]`(*r*) ��∨ ⅅ`l[2]`(*r*) ��∨ ⅅ`l[3]`(*r*) 是文字。那么表达式 `E(T)=1`，在对应的图 `(V,\
    \ E)` 中存在一个大小为 `k` 的团。\n\n**图的构造：** 对于每个子句 `C[r]` ℃= `l[1]`(*r*) ��∨ ⅅ`l[2]`(*r*)\
    \ ��∨ ⅅ`l[3]`(*r*)，构造一个……（此处原文逻辑有重复，按原文结构翻译）。\n"
- fmt: "\n### 5. **Node Height**: The number of edges in the **longest** route to\
    \ a descendant leaf node.\n\n### 6. **A Node’s Black Height**: The number of nodes\
    \ that are black (including `NIL`) on the route from the node itself to a leaf\
    \ node {node itself is not counted}.\n\nEach node of the tree contains fields\
    \ `colour`, `key`, `left`, `right`, and a pointer `p` which indicates, if child\
    \ or parent of a node doesn’t exists then pointer field of the node contains value\
    \ `NIL`.\n\nIn Red-Black tree, the key bearing nodes are known as internal nodes.\n\
    \n**Theorem 6.1.1: A Red-Black tree with `n` internal nodes has height at most\
    \ 2 log[2](n+1).**\n\n**Proof:** To prove the theorem, first we show that subtree\
    \ rooted at any node `x` contains at least `2^(bh(x))–1` internal nodes. We will\
    \ prove this by mathematical induction on height of node `x`, if height of node\
    \ `x` is 0then node `x` must be a leaf node and subtree rooted at node `x` contains\
    \ at least `2^(bh(x))–1 {=2⁰–1=0}` internal nodes. It means, for height 0, statement\
    \ is valid.\n\nNow consider a node `x` that has a positive height and is an internal\
    \ node with two children. Each child has black height either `bh(x)` or `bh(x)–1`,\
    \ depending on its colour is red or black respectively. Since the height of child\
    \ of node `x` is less than the height of `x` itself, we can apply the inductive\
    \ hypothesis to say that each child has at least `2^(bh(x)–1)–1` internal nodes.\
    \ Thus a subtree rooted at `x` contain at least `(2^(bh(x)–1)–1)+(2^(bh(x)–1)–1)+1=2^(bh(x))–1`\
    \ internal nodes. Thus, the statement is valid.\n\nTo prove the theorem, let `h`\
    \ be the height of the tree then at least half of the nodes on any path from the\
    \ root to a leaf node including root must be black. Thus, the black height of\
    \ the root must be at least `h/2`. So,\n\n`n ≥ 2^(h/2)–1` (`n` is number of internal\
    \ nodes in the tree)\n\n`n+1 ≥ 2^(h/2)`\n\n`log[2](n+1) ≥ h/2`\n\n`h ≤ 2 log[2](n+1)`\
    \ **proved**\n\n![](graphic/converted/b_9783110693607-006_fig_001.png)\n\nFigure\
    \ 6.1: Red–Black Tree.\n\n## 6.2 Operations on RBT\n\nThis section discusses two\
    \ operations on RBT, *insertion* and *deletion* of node. Operations `left-rotate`\
    \ and `right-rotate` are used in these operations.\n\n### 6.2.1 Rotation\n\nRotation\
    \ is a confined process in search tree. Let us assume that we have to rotate about\
    \ the node `m` and its right child `n` is not nil. Node `n` will be the root of\
    \ the tree. The tree rooted by `m` will be left child of `n` and left child of\
    \ `n` will be right child of `m` after performing left rotation (see figure 6.2).\
    \ The following algorithm given is for left rotation. It is assumed that `right[m]\
    \ ≠ nil`, and parent of root node `parent` is nil.\n\n![](graphic/converted/b_9783110693607-006_fig_002.png)\n\
    \nFigure 6.2: Left rotation.\n\n**Algorithm:** `Left-Rotate()`\n\n```\n {\n  \
    \         n ←right[m];\n           right[m] ← left[n];\n           Parent[left[n]]\
    \ ←m;\n           parent[n]<-parent[m].\n           If Parent[m] = nil [Tree]\n\
    \                          Then root [Tree] ← n;\n           else if m = left\
    \ {Parent[m]}\n                          Then Left Parent [m] ←n;\n          \
    \ else right{Parent[m]} ←n;\n           left[n] ←m;\n           Parent[m] ←m;\n\
    }\n```\n\nTime complexity of both the rotations left and right operations is O(1)\
    \ as only the pointers are changed.\n\n### 6.2.2 Insertion\n\nTime complexity\
    \ of inserting a new node in RBT is O(log[n]) time. Algorithm for insertion of\
    \ a node in tree is given later. Suppose we have to insert node `c` (for which\
    \ `key[c] = v`, `left[c] = NIL` and `right[c] = NIL`) in the tree `Tree`. `RB-INSERT-FIXUP(Tree,\
    \ c)` procedure is used to recolor nodes and perform rotations. A node `c` is\
    \ passed as a parameter to the procedure.\n\n**Algorithm:** `RB-INSERT(Tree, c)`\n\
    \n```\n {\n     b ← NIL;\n     a ← root [Tree];\n     while (a is not NIL)\n \
    \              do b ← a;\n               if (key[c] < key[a])\n              \
    \      Then a ← left[a].\n               else a ← right [a];\n     p [c] ←b;\n\
    \     if b = Nil ;\n                    Then root[Tree] ← c;                 \
    \    // Tree is empty\n               else if (key[c] < key[b])\n            \
    \        Then left[b] ← c;\n          else right[b] ← c;\n     left[c] ← nil;\
    \     right[c] ← nil;\n    color[c] ←RED;\n    RB-INSERT-FIXUP (Tree, c);\n}\n\
    ```\n\nAfter this, if there is any color variation the following `RB-COLOR-FIXUP(Tree,c)`\
    \ fixes them:\n\n**Algorithm:** `RB-COLOR-FIXUP (Tree,c)`\n\n```\n {\n       \
    \    While color[parent[c]] = RED\n           do parent[c] = left[parent[c]] //\
    \ Left of Parent (Parent of c)\n               Then b ← right[parent[c]]\n   \
    \            if (color[b] = RED)\n               Then color[parent[c]] ← BLACK\
    \ \n               color[b] ←BLACK\n               color[parent[c]] ← RED\n  \
    \             c ← parent[parent[c]]\n           else if c = right[parent[c]]\n\
    \               Then c ← Parent[c]\n               Left-Rotate (Tree, c)\n   \
    \            color[parent[c]] ← BLACK\n               color[parent[c]] ← RED\n\
    \               Right-Rotate (Tree,parent[c])\n               else (Same as then\
    \ clause with “right” and left” exchanged)\n           Color [root[Tree]] ← BLACK\n\
    }\n```\n\n**Example 6.1:** Insert the values 42, 39, 32, 13, 20, 9 into an empty\
    \ RBT.\n\n* (1) Insert 42\n![](graphic/converted/b_9783110693607-006_ingr_001.png)\n\
    * (2) Insert 39\n![](graphic/converted/b_9783110693607-006_ingr_002.png)\n* (3)\
    \ Insert 32\n![](graphic/converted/b_9783110693607-006_ingr_003.png)\n* (4) Insert\
    \ 13\n![](graphic/converted/b_9783110693607-006_ingr_004.png)\n* (5) Insert 20\n\
    ![](graphic/converted/b_9783110693607-006_ingr_005.png)\n* (6) Insert 9\n![](graphic/converted/b_9783110693607-006_ingr_006.png)\n\
    \nLast one is the final tree.\n\n### 6.2.3 Deletion\n\nLike the other basic operations\
    \ on a n-node RB Tree, deletion of a node takes time O(log n).\n\n**Algorithm:**\
    \ `RB-DELETE(T, c)`\n\n```\nIf left[c]=nil or right[c]=nil then\n    b←c;\nelse\n\
    \    b←tree-successor[c];\nif left[b]≠nil then\n    a←left[b];\nelse\n    a←right[b];\n\
    parent[a]=parent[b];\nif parent[b]=nil then\n    root[tree] ←a;\nelse if b=left[parent[b]]\
    \ then\n    left[parent[y]] ←a;\n    else\n    right[parent[y]] ←a;\nif b≠c then\n\
    \    key[c] ←key[b]; {copy b data in c}\nif color[b]=black then\n    RB-DELETE-FIXUP(Tree,\
    \ a)\nReturn b;\n```\n\nThe call to `RB-DELETE-FIXUP(Tree, a)` is only if `b`\
    \ is black. If `b` is red the red black property still holds then `y` is spliced\
    \ out for the following reasons:\n\n1. No black height in the tree has changed.\n\
    2. No red node have been made adjacent and since `b` couldn’t have been the root\
    \ if it has red colour, the root remain black.\n\n**RB-DELETE-FIXUP (Tree, a)**\n\
    \n```\nWhile a≠root[tree] and color[a]=black\n    if a=left[a] then\n        w←right[a];\n\
    \        if color[w]=RED then\n            color[w] ←BLACK;\n            color[parent[a]]\
    \ ←RED;\n            Left-Rotate(Tree, a);\n            w←right[a];\n        if\
    \ color[left[w]]=black and color[right[w]]=black then\n            color[w] ←RED;\n\
    \            a←parent[a];\n        else\n            if color[left[w]]=red then\n\
    \                color[left[w]] ←BLACK;\n                color[w] ←RED;\n    \
    \            Right-Rotate(Tree, w);\n                w←right[a];\n           \
    \ color[parent[a]] ←BLACK;\n            color[right[w]] ←RED;\n            Left-Rotate(Tree,\
    \ a);\nif color[root]=RED then\n    color[root] ←BLACK;\n```\n\n## 6.3 B-tree\n\
    \nB-trees are a type of balanced search trees. Concept of B-tree was proposed\
    \ by Rudolf Bayer and Ed. McCreight. The leaf nodes of B-tree are at the same\
    \ level. Number of child of internal nodes may vary but within a fixed range.\
    \ For example, in a 3–4 B-tree, an internal node may have only 3 or 4 children.\
    \ No frequent rebalancing is required in B-trees because of the flexibility in\
    \ number of child nodes. Wastage of space is the disadvantage of B-tree since\
    \ it is not necessary that the nodes must be full. Following are the properties\
    \ of B-tree:\n\n1. Each node `a` has three fields:\n\n    1. Number of currently\
    \ stored keys in node `a`, that is, `n[a]`.\n\n    2. These keys are in ascending\
    \ order, that is,\n\n        `key[1][a] ≤ key[2][a] ≤ ... ≤ key[n][a]`\n"
