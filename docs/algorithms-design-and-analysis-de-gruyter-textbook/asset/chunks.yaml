    In the event that issue is NP Complete, we are probably not to locate polynomial
    time for solving it. Approximation algorithms don’t guarantee the best solution.
    The goal of an approximation algorithm is to come as close as possible to the
    optimum value in a reasonable amount of time which is at most polynomial. An algorithm
    that returns close to optimal solution is called approximation algorithm.


    Let `i` be instance of some optimization problem and this problem has large number
    of possible solutions and the cost of solution founded by approximate algorithm
    is `c(i)` and the cost of optimal solution is `c*()`. For minimization problem,
    we are concerned to discover a solution for which value of the expression `c(i)`
    will be small as possible. Conversely, for maximization problem, the expression
    `c(i)` will be large as possible. We say that approximation algorithms satisfy
    following condition:


    `max(c(i), c*(i)) ≤ p(n)`


    Both minimization and maximization problems holds this definition. Note that `p(n)
    ≥ 1` always. If solution generated by approximation algorithm is accurate and
    optimal then `p(n) = 1`.


