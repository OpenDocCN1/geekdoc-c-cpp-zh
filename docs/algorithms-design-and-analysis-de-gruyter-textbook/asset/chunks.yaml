    \ 1 3 6 8 9 10\n\nFor i: (n-1) to 0 do         D[0] = 1\n\n                     D[1] = 3\n\
    \n                     D[2] = 6:\n\n                     D[5] = 10\n\ni = n-1(1st\
    \ iteration)\n\nn = 10\n\nj = 5–4 = 1 { **A[9]** = 5}\n\nS[3–1]: = 5\n\nS[2]: = 5\n\
    \n|  | 5 | 5 |  |  |  |  |  |  |\n\nD[1]: = 2(Remaining)\n\nFinally, we will get\
    \ sorted array.\n\n### 2.7.1 Analysis of counting sort\n\nCounting sort algorithm makes\
    \ use of most effective simple for loops without any complex concept like recursion\
    \ or subroutine calls, it is easy to analyze. The general time complexity of the\
    \ counting sort is\n\n*θ*(*k*)+*θ*(*n*)+*θ*(*k*)+*θ*(*n*)= *θ*(*n* + *k*)= *θ*(*n*). *i**f* *k* *i**s* *a* *c**o**n**s**t**a**n**t*\n\
    \n## 2.8 Radix sort\n\nRadix sort is applicable to the unit of n integers, and\
    \ each integer has d digit. We start the sorting repetitively. We start with lowest\
    \ order digit and finish at the highest order. The sorting is stable.\n\n**Algorithm:**\
    \ *RadixSort (Ar, dig)*\n\n{\n\n*for* k = 1 to dig,\n\nPerform stable sort to\
    \ sort array Ar on the digit k.\n\n}\n\n### 2.8.1 Analysis of radix sort\n\nLet\
    \ us assume that the stable sort runs in O(n + b). Then the running time of Radix\
    \ sort will be O(dig(n + b)) = O(dig*n + dig*b). If dig is constant and b = O(n),\
    \ the complexity is O(n).\n\n**Example 2.6:** Input A = {677, 595, 295, 397}\n\
    \n677 59[5] 6[7]**7** [2]95 295\n\n595 ⇒ 29[5] ⇒5[7]5 ⇒[3]97 ⇒ 397\n\n295 67[7]\
    \ 2[9]5 [5]95 595\n\n397 39[7] 3[9]7 [6]77 679\n\n## 2.9 Bucket sort\n\nBucket\
    \ sort is a linear time algorithm. Input is random and is distributed evenly in\
    \ the interval [0, 1] the range is divided into n equal intervals. (see [Figure\
    \ 2.7](#bodymatter-002.xhtml_b_9783110693607-002_fig_007)). These intervals are\
    \ called buckets. As the input is uniformly distributed, it is not expected that\
    \ many numbers fall into one bucket. In bucket sort, first all the buckets are\
    \ sorted individually and then concatenate them to get sorted array.\n\n![](graphic/converted/b_9783110693607-002_fig_007.png)\n\
    \nFigure 2.7: Uniform distribution.\n\n**Algorithm:** *BucketSort(Ar)*\n\n```\n\
    \ {\n     size: = length[Ar];\n     for k: 1 to size do\n          insert Ar[k]\
    \ into List Bu[⎿size Ar [k] ⏌];\n     for k: = 0 to (size-1) do\n          sort\
    \ bucket Bu[k] with insertion sort;\n     Combine Bu[0], Bu[1],……………Bu[size-1],\
    \ in order.\n}\n```\n\nTo see how *BucketSort* works, consider two elements Ar[p]\
    \ and Ar[q]. If both the elements fall in the same bucket, they follow comparative\
    \ order in the sorted array because insertion sort arranges the buckets. Let us\
    \ assume that these elements fall into diverse buckets, Bu[p’] and Bu[q’], respectively,\
    \ and suppose without loss of generality that p’ < q’. When the buckets are combined,\
    \ Bu[p’] comes before Bu[q’], and therefore Ar[p] precedes Ar[q].\n\n### 2.9.1 Analysis\
    \ of bucket sort\n\nIf n[i] be the random variable, it denotes the number of elements\
    \ placed in Bucket Bu[i]. Except the sorting using insertion sort all instruction\
    \ takes time of order θ(n) and there are n calls for insertion sort, so time for\
    \ *BucketSort* is\n\n${T(n) = \\theta(n) +}\\sum\\limits_{i = 0}^{n - 1}O{(n}_{i}^{2})$\n\
    \nIn order to assess this summation, we have to find the distribution of each\
    \ random variable n. We have n elements and n buckets. The probability of falling\
    \ an element in a i^(th) bucket is 1/n. This problem is the same as that of “Balls-and-Bin”\
    \ problem. Hence, the probability follows the binomial distribution, which has\n\
    \nMean: *E*[*n*[*i*]] = *n**p* = 1\n\nVariance: ${Var}\\left\\lbrack n_{i} \\\
    right\\rbrack{= np}\\left( {1 - p} \\right){= 1} - \\frac{1}{n}$\n\nTaking expectations\
    \ of both side\n\n$E{\\lbrack T(n)\\rbrack = \\theta(n) +}\\sum\\limits_{i = 0}^{n\
    \ - 1}E\\lbrack{O(n}_{i}^{2}{)\\rbrack}\\,\\{ n_{i}\\rightarrow{random\\, variable,\\\
    , number\\, of\\, element\\, in\\, Bucket\\, B}\\lbrack i\\rbrack\\}$$\\mspace{-2520mu}{=\
    \ \\theta(n) +}\\sum\\limits_{i = 0}^{n - 1}O{(2} - \\frac{1}{n})$${= \\theta(n)\
    \ + n}{.O(2} - \\frac{1}{n})$= *O*(*n*)\n\nTherefore, the entire *BucketSort*\
    \ algorithm runs in linear expected time.\n\n**Example 2.7:** Sort the array A\
    \ using bucket sort\n\nA = {0.23, 0.37, 0.15, 0.18, 0.34, 0.88, 0.78, 0.38, 0–99,\
    \ 0.92}\n\nN = 10, the elements 0.34, 0.37, 0.38 mapped at i = 3\n\n![](graphic/converted/b_9783110693607-002_ingr_002.png)\n\
    \n![](graphic/converted/b_9783110693607-002_fig_008.png)\n\nFigure 2.8: Example\
    \ of Bucket Sort.\n\n### 2.9.2 Binomial distribution\n\n$\\begin{matrix} & {{Var(}n_{i})\
    \ = {E({n_{i}}^{2})} - \\{{\\lbrack E(n_{i})\\}^{2}}} \\\\ & {{Var(}x_{i}) = {npq}\
    \ = {(1} - \\frac{1}{n})} \\end{matrix}$*E*(*n*[*i*]²) = *V**a**r*(*n*[*i*]) + {*E*(*n*[*i*])}² = 1 − 1/*n* + 1 = 2 − 1/*n**E*(*n*[*i*]) = *n**p* = *n*.1/*n* = 1\n\
    \n## Problem set\n\n1.  What is meant by sorting?\n\n2.  List two different types\
    \ of sorting?\n\n3.  Give the use of radix sorting.\n\n4.  Discuss the complexity\
    \ of quick sort.\n\n5.  List and explain the sequence of steps required to sort\
    \ numbers in the main memory using merge sort.\n\n6.  Give the differences between\
    \ the insertion sort and selection sort."
