    \n**Kruskal 算法的复杂度：** 算法的复杂度基本上取决于给定图边权的排序。边的数量为 |E|，因此使用高效的排序算法时，复杂度为 O(|E|log[2]|E|)。\n\
    \n### 4.3.2 Prim 算法\n\n用于寻找最小生成树的 Prim 算法基于贪心策略。Prim 算法的输入是一个带权连通图（此处不涉及有向图情况），假设其顶点编号为\
    \ 1 到 n。在第 `r` 阶段，我们已经选择了一个包含 `r` 个顶点的集合 `S` 以及一个在 S 上的生成树 `T`，其所有的边都位于 G 中。初始时\
    \ `S` = `{1}` 且 `T` 没有边。对于第 `r` 阶段，我们归纳地假设已经找到了大小为 `r–1` 的集合 `S` 和在 S 上的生成树 `T`。我们选择顶点\
    \ `i` ∈ S 和 `j` ∉ S，使得从 `i` 到 `j` 的边 `e` 的权重 `a[ij]` 最小，并将 `j` 加入 S，将 `e` 加入 T。当第\
    \ `n` 阶段完成后，所有顶点都已包含在内，我们便得到了 G 的最小生成树。示例 4.3 的最小生成树所示于图 4.10，它是通过使用 Prim 算法求解的。\n\
    \n**算法：** `Prim(G)`\n\n```\n// 输入：一个连通权图\n// 输出：E[MST]: 创建最小生成树的边集。\n{\n    V[T]\
    \ : ≡ {v[0]};\n    E[MST]≡ Φ;\n    For k: = 1 to |V|-1 do // |V|= n\n    在所有边\
    \ (v, u) 中（其中 v 在 V[T] 且 u 在 (v-V[T])），找到权重最小的边 e*= (v*,u*)，它在加入 E[MST] 时不会形成环。\n\
    \    V[T]: ≡ V[T]U {u*}\n    E[MST]: ≡ E[MST] U{e*}\n    Return E[MST];\n}\n```\n\
    \n**Prim 的复杂度：** 如果使用邻接表表示图并将优先队列实现为最小堆，则复杂度为 O(|E|log |V|)。\n\n![](img/b_9783110693607-004_fig_010.png)\n\
    \n图 4.10：使用 Prim 算法得到示例 4.3 的最小生成树。\n\n## 4.4 最短路径算法\n\n本节包含了寻找图中所有顶点对之间最短路径以及从一个源到所有其他顶点最短路径的算法。\n\
    \n### 4.4.1 Warshall 算法\n\nWarshall 算法寻找矩阵 `M[0]`、`M[1]`、`M[2]` ……… `M[n]`，其中对于\
    \ `M[m]` 中的第 `(r,s)` 个元素 `Mm` 是从顶点 `r` 到顶点 `s` 的路径长度，其中所有中间顶点位于 `{1,2, …}` 中。`M[n]`\
    \ 是我们所需的矩阵，此时我们可以通过递归方程 `Mm = {Mm-1, Mm-1 + Mm-1}` 找到 `m > 0` 时 `M[m]` 的元素。\n\n\
    **算法：** `Warshall()`\n\n```\n{\n    For p = 1 to |V| do\n    M[p, p]: = 0;\n \
    \   for p : 1 to |V| do\n    {\n        for q : 1 to |V| do\n        {\n     \
    \       M[q,r] = Min(M[q,r], M[q,p] + M[p,r]);\n        }\n    }\n}\n```\n\n**示例\
    \ 4.4：**\n\n![](img/b_9783110693607-004_fig_011.png)\n\n图 4.11：图。矩阵将是\n\n![](img/b_9783110693607-004_ingr_001.png)\n\
    ![](img/b_9783110693607-004_ingr_002.png)\n![](img/b_9783110693607-004_ingr_003.png)\n\
    ![](img/b_9783110693607-004_ingr_004.png)\n![](img/b_9783110693607-004_ingr_005.png)\n\
    \n### 4.4.2 Floyd Warshall 算法\n\n在 Warshall 算法中，寻找矩阵 `M[0]`、`M[1]`、`M[2]` ………\
    \ `M[n]`，其中 `M[m]` 中的第 `(r,s)` 个元素 `Mm` 是从顶点 `r` 到顶点 `s` 的最短路径长度，其中所有中间顶点位于 `{1,2,\
    \ …}` 中。`M[n]` 是所需的矩阵，此时我们可以通过递归方程 `Mm = {Mm-1, Mm-1 + Mm-1}` 找到 `m > 0` 时 `M[m]`\
    \ 的元素。\n\n在 Floyd Warshall 算法中，使用一个矩阵 `L` 来存储所有顶点之间的最短路径，`L[p,q]` 表示顶点 `p` 到顶点\
    \ `q` 的路径长度。该算法的一个优势是它可以应用于有向图和无向图。对于具有 `n` 个顶点的权图，矩阵 `L` 是通过序列 `L((0))`、`L((1))`……`L((n))`\
    \ 计算的。由于存在三层嵌套循环，该算法的时间复杂度为。\n\n**算法：** `Floyd-Warshall(W)`\n\n```\n// 输入：权重矩阵\
    \ W\n// 输出：最短路径矩阵 L\n{\n    L := W //W = L((0))\n    for r: =1 to |V| do\n   \
    \ {\n        for p: =1 to |V| do\n        {\n            for q: =1 to |V| do\n\
    \            {\n                L[p,q]: =Min(L[p,q], L[p, r]+L[r, q]);\n     \
    \       }\n        }\n    }\n    Return L;\n}\n```\n\n**复杂度：** Floyd Warshall\
    \ 算法的运行时间复杂度为 O(n³)。\n\n**示例 4.5：**\n\n![](img/b_9783110693607-004_ingr_006.png)\n\
    \n### 4.4.3 Dijkstra 算法\n\nDijkstra 算法是一种单源最短路径算法；它适用于正权图。Dijkstra 算法的时间效率取决于表示图本身的数据结构。如果使用邻接表表示图并将优先队列实现为最小堆，其复杂度为\
    \ O(|E|log[2]|V|)。\n\n**算法：** `Dijkstra(G, A)`\n\n```\n// 输入：图 G 和源 A\n// 输出：从\
    \ A 到所有顶点 v 的距离 d[v]\n{\n    for each v in V \n        d[v] = ∞;\n    d[A] = 0;\n\
    \    Q = vertices in V;\n    while Q is not empty\n        u = 从 Q 中提取 d[u] 最小的顶点\n\
    \        for each neighbor v of u\n            if d[u] + weight(u,v) < d[v]\n\
    \                d[v] = d[u] + weight(u,v);\n}\n```\n\n**示例 4.6:** 为给定图寻找单源最短路径（见图\
    \ 4.11）。\n\n![](img/b_9783110693607-004_ingr_007.png)\n\n"
