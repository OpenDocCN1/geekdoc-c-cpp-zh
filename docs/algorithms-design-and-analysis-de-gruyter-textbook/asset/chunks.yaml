    ### 1.7.3 The substitution method


    This technique is pertinent when we have floor or ceiling sign in the recurrence
    relation. The fundamental strides of substitution technique are:


    1.  Guess the type of the solution.


    2.  Use scientific enlistment to discover the constants and show that the solution
    works.


