    ### 1.5.3 θ 表示


    设 `f(n)` 和 `g(n)` 是两个正函数。函数 `f(n)` 称为 `θ(g(n))`（Theta 的 g(n)），这意味着 `f(n) = θ(g(n))`。如果函数
