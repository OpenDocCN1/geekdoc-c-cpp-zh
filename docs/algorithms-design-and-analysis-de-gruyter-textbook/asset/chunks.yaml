    frac{n + 1}{2} \\geq t^{h}$$h \\leq log_{t}\\left( \\frac{n + 1}{2} \\right)$\n\
    \n## 6.4 Binomial heap\n\nIt is a data structure similar to binary heap but it\
    \ also supports merge operation of two heaps. Binomial heap is a set of binomial\
    \ trees. A binomial tree is a recursively defined ordered tree:\n\n1.  The binomial\
    \ tree of order 0 has only one node.\n\n2.  Binomial tree of order greater than\
    \ 1 (i.e., k ≥ 1), the binomial tree of order k (B[k]) is formed by linking two\
    \ binomial trees of order k–1 (B[k–1]). The root of one tree is the leftmost child\
    \ of the root of the other tree (see figure 6.5).\n\n![](graphic/converted/b_9783110693607-006_fig_005.png)\n\
    \nFigure 6.5: Binomial tree.\n\nFollowing are the features of binomial tree:\n\
    \n1.  There are 2 ^k nodes in the tree and k is height of tree.\n\n2.  There are\
    \ just ^kC[i] nodes at depth i, where i = 0, 1, 2 … k.\n\n3.  Degree of the root\
    \ node is k which is more than degree of any other node; besides this the children\
    \ of the root are binomial tree with order k–1, k–2, … … … .0 from left to right.\n\
    \n***Proof:*** We will proof it by induction method on k.\n\nFor k = 0, each property\
    \ holds for binomial tree of order 0.\n\n**Inductive Step:** Let us assume that\
    \ it holds for k–1 order tree.\n\n1.  Two trees of degree k–1 are linked to form\
    \ tree with degree k and number of nodes in B[k–1] is 2 ^(k–1), so the tree with\
    \ degree k has 2 ^(k–1) + 2 ^(k–1) = 2 ^k nodes.\n\n2.  The height of B[k] is\
    \ one greater than the height of B[k–1.] So, (k–1) + 1 = k.\n\n3.  Let number\
    \ of nodes at depth i is N (k, i) of tree B[k]. Since number of nodes at depth\
    \ i in B[k] is the number of nodes at depth i in B[k–1] plus number of nodes at\
    \ depth i–1 in B[k–1.]\n\n    $\\begin{matrix} & {N\\left( {k,i} \\right)\\,{=\
    \ N}\\left( {k - 1,i} \\right) + \\, N\\left( {k - 1,i - 1} \\right)\\,} \\\\\
    \ & {\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\, =^{\\mspace{180mu} k\
    \ - 1}C_{i} +^{k - 1}C_{i - 1} =^{k}C_{i}} \\end{matrix}$\n\n4.  Root of B[k]\
    \ is the only node that has greater degree than B[k–1]. It has one extra child\
    \ than in B[k–1]. Degree of root in B[k–1] is degree k–1 that of B[k] is k. By\
    \ inductive hypothesis, the children of the root of B[k–1] are roots of B[k–2],\
    \ B[k–3,] … B[0] is linked to B[k–1,] therefore, the children of the resulting\
    \ root are roots of B[k–1], B[k–2], … B[0].\n\n### 6.4.1 Binomial heap\n\nA Binomial\
    \ Heap is a sequence of binomial trees that satisfies the following min-heap property:\n\
    \n1.  Each tree is minimum heap ordered i.e. the key values of the parent is at\
    \ least as large as or smaller than its children.\n\n2.  For any non-negative\
    \ order k there exists at least on binomial tree whose root has degree k.\n\n\
    For any n node binomial heap:\n\n1.  Minimum key contained in the root B[0], B[1].......B[k].\n\
    \n2.  It contains at most upper bound of log[2]n+1 binomial trees.\n\n3.  Height\
    \ is less than or equal to upper bound of log n (see figure 6.6).\n\nEach node\
    \ of binomial heap contains:\n\n1.  A ***key***\n\n2.  A ***degree*** for the\
    \ number of children\n\n3.  A pointer ***child***, that points to leftmost child\n\
    \n4.  A pointer ***sib***, that points to the right sibling\n\n5.  Pointer ***p***,\
    \ that points to the parent\n\nA binomial heap has a root list. A field *head[H]*\
    \ is used to access the binomial heap. This pointer points to the initial root\
    \ of the root list of H. If *head[H] = nil,* it means H has no element.\n\n####\
    \ 6.4.1.1 Creating binomial heap\n\nMAKE-BINOMIAL-HEAP procedure allocate and\
    \ return an object H, where Head[H] = NIL. The running time is O(1).\n\n#### 6.4.1.2 Finding\
    \ minimum key\n\nAim of this procedure is to find the node with minimum key in\
    \ an n node binomial heap. There is no key with value ∞. Since a binomial heap\
    \ is a min-heap ordered, a minimum key must reside in the root node. The Binomial-Heap-Min()\
    \ procedure check all roots which are at most upper bound of (log n)+1, so its\
    \ running time is O (log[2]n).\n\n**Algorithm:** *Binomial-Heap-Min (H)*\n\n```\n\
    \ {\n  b←NIL;\n  a←head[H];\n  min←∞;\n  while (a is not NIL)\n    do if (key[a] < min)\n\
         then min←key[a];\n      b←a;\n    a←sib[a];\n  return b (min);\n}\n```\n\n\
    #### 6.4.1.3 Union of two heaps\n\nThe procedure for union repeatedly links binomial\
    \ tree whose roots have same degrees. Let the two trees be rooted at b and c.\
    \ Node c will become the root of the final tree.\n\n**Algorithm:** *Binomial-Link\
    \ (b, c)*\n\n```\n {\n  p[b]←c;\n  sib[b]←child[c];\n  child[c]←b;\n  degree[c]←degree[c] + 1;\n\
    }\n```"
