    \n图 14：从 S 到剩余顶点的最短路径。\n\n### 4.5 最大流 (Maximum flow)\n\n一些现实生活问题，如液体流、电缆中的电流和通道中的信息，可以使用流网络进行建模。以下是最大流中使用的一些术语：\n\
    \n**网络 (Network)：** 有权图，其中边是链路，每个顶点是一个站点。分配给每条边的权重称为容量。\n\n**容量 (Capacity)：**\
    \ 边的容量是单位时间内通过该边的最大速率。\n\n**流网络 (Flow Network)：** 有向图 `G`，其中：\n- 每条边 `(p, q)`\
    \ 属于 `E`，具有非负容量 `C(p, q) ≥ 0`。\n- 两个特殊顶点源 `(S)` 和汇 `(T)`。\n- 存在从源到汇的路径。\n换句话说，这是一个物质从源流向汇的有向图。源产生，汇消耗。\n\
    \n**流 (Flow)：** 令 `S` 为源，`T` 为汇，则 `G` 中的流是函数 `F:Vx → R`，满足以下三个属性（`C` 是流网络的容量）：\n\
    - **容量限制 (Capacity constraint)：** 边的流不能超过边的容量，即 `F(a, b) <= C(a, b)`。\n- **反对性\
    \ (Skew Symmetry)：** 从顶点 `a` 到顶点 `b` 的流是从顶点 `b` 到 `a` 的流的负值，即 `F(a, b) = -F(b,\
    \ a)`。\n- **流守恒 (Flow conservation)：** 进入顶点的速率等于离开顶点的速率。\n\n**可行流 (Feasible Flow)：**\
    \ 中间顶点的入流等于出流。满足守恒属性流被称为**可行流**。令 `F'` 为网络 `G` 中的一个可行流。网络的流由 `F(G)` 表示为从源出的流之和。\n\
    令 `F'` 为网络 `G` 中的一个可行流。边 `(p, q)` 如果：\n1. **饱和 (saturated)**，如果 `F(p, q) = C(p,\
