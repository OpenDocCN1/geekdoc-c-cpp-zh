    `500n + 1 ∈ O(n²)`


    ### 1.5.2 Ω 表示


    设 `f(n)` 和 `g(n)` 是两个正函数。函数 `f(n)` 称为 `Ω(g(n))`（Omega 的 g(n)），如果 `f(n)` 在 `n`
    较大时是 `g(n)` 的某个正倍数的下界，即存在正常数 `c` 和非负整数 `n[0]`，使得：


