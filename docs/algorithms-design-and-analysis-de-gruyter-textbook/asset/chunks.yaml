    ≥ 2`，`T(2) \le 2c \log 2`，`T(3) \le 3c \log 3`：


    $\begin{matrix} & {{T(2) = 4} \\ {{T(3) = 5} \\ {{T(4) = 10} \\ {\,\,\,\,\, =
    c\,4\,{lo}_{2}\,4} \\ {\,\,\,\,\, = 8.c\,.geq 16} \\ {T(n) \leq c\,n\,\{lo}g_{n}\,{for}\,\,
    c \geq 1\quad\quadInductive}\{proof\;for}\{this\;,\,\,\,\,} \\ {T(2)=4},T(3)=5}}
    {{taking\; c\;large}\{enough\;so}} {{that\; T(2) \leq {2c}\{lo}g_{2} \\ {{T(3)
    \leq 3\,\, c\,\{lo}g_{3} {\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\,\takingc}\,
    \geq 2.}} \end{matrix}$


    对于 `c≥2`，该解在 `n>1` 时有效。


