    ### 4.4.4 Bellman–Ford 算法\n\nBellman–Ford 算法解决的是具有负权边的给定图的单源最短路径问题。函数 `wf` 是权重函数，返回从顶点\
    \ `v[1]` 到 `v[2]` 的边权重。如果存在负权环，该算法将标明不存在解。如果不存在这样的环，算法将产生最短路径及其权重。\n\n**示例 4.7：**\
    \ 让我们来看一个例子，我们有一个如图 4.13 所示的图。`S` 是源顶点。我们需要找到从 `S` 到所有其他顶点的最短路径。\n\n从 `S` 到 `B`，只有一条路径，即：\n\
    \n`D(S, B) = wf(S, A) + wf(A, B) = 3 + (-4) = -1`\n\n要计算从 `S` 到 `C` 的路径，我们可以看到从\
    \ `S` 到 `C` 形成了一个环：\n\n环长度 `(C,D,C) = 6 + (-3) = 3 > 0`。\n\n因此路径长度 `(S,C)` 的权重为\
    \ `D(S, C) = 5`。\n\n同样，从 `S` 到 `D` 的最短路径是 `(S,C,D)`，权重为 `D(S, D) = 11`。\n\n再次从\
    \ `S` 到 `E`，存在一个长度为 `3 + (-6) = -3 < 0` 的环（负环）。因此从 `S` 到 `E` 没有最短路径。`D(S, E) =\
    \ -∞`。\n\n同样 `D(S,F) = -∞`。\n\n因为 `G` 可从 `F` 到达，所以 `D(S, G) = -∞`。\n\n顶点 `H`、`I`\
    \ 和 `J` 无法从 `S` 到达，所以 `D(S, H) = D(S, I) = D(S, J) = ∞`。\n\n![](img/b_9783110693607-004_fig_012.png)\n\
