    ### 1.6.3 非齐次线性递归关系


    形式为 `a[n] + b[1]a[n − 1] + b[2]a[n − 2] + · · · · b[k]a[n − k] = f(n)`，`n ≥ k`
    且 `f(n) ≠ 0` 的递归关系称为非齐次递归关系。


    考虑以下关系：


    ```

    $\begin{matrix} & {a_{n} - a_{n - 1} - a_{n - 2}}{= n + 3} \\ \begin{matrix} {LHS}
    & {RHS}} \end{matrix} \end{matrix}$

    ```


    其中 `f(n) = n + 3`。


    关系的 `LHS` 是齐次部分；它被称为**相关线性递归关系**。`RHS` 是右成员。要解此类关系，首先求解 `LHS`，然后求解 `RHS` 以找到特解
    (PS)。将这两个部分的结合结合形成关系的完整解。


    #### 寻找特解


    没有通用的方法来寻找递归关系的特解。尽管关系的 `RHS` 形式简单，但可以使用观察法（或猜测法）。例如：


    1. 如果 `f(n) = C`（常数），则假设特解也是常数 `A`：`a[n] + C[1]a[n − 1] + · · · · C[k]a[n − k]
    = D.(n)`。

    2. 如果 `f(n)` 是指数形式，即 `a^n`，当 `a` 不是特征方程的根时，则试验解为 `PS = A.a^n`。

    3. 如果 `f(n)` 是指数形式，即 `a^n`，当 `a` 是重数为 `m` 的特征方程的根时，试验解为 `PS = A.n^a^n`。


