    ## 1.7 Divide and conquer relations


    Assume that an algorithm divides a problem of size `n` into subproblems, where
    each subproblem is of size `n/b`. At that point, these subproblems are unraveled
    thus and the answers for these subproblems are joined to get arrangement of problems.
    Assume that `g(n)` tasks are performed for such a division and join. This follows
    a recurrence relation.


    **Example 1.12:** The algorithm of binary search decreases the search for a component
    of size `n` to twofold search for this component of size `n/2` (if `n` is even).


    (i) For Binary Search, `f(n) = f(n/2)+A`

    (ii) The recurrence relation for merge sort, `T(n) = 2T(n/2)+cn`, when `n>1` and
    `A`, when `n=1` is DAC relation.


    ### 1.7.1 Solution to DAC recurrence relation


    **Example 1.13:**


    ```

    $\begin{matrix} & f(n) = 3f(n/2) + n \\ {taking} & n = 2^{k}, k = log_{2}n \\
    {let} & f(n) = f(2^{k}) = b_{k} \\ & f(n/2) = f(2^{k/2}) = b_{k-1} \end{matrix}$

    ```


    So recurrence relation is


    ```

    $\begin{matrix} & b_{k} = 3b_{k-1} + 2^{k} \\ b_{k} - 3b_{k-1} = 2^{k} \end{matrix}$

    ```


    The characteristic equation for recurrence relation will be `t − 3 = 0`, so `t
    = 3`. The homogeneous solution will be, `b[k]^H=A.3^k`. Because `a = 2` and 2
    is not the root of characteristic equation, then according to case (ii), the trial
    solution for PS will be `B.2^k`, by substituting `b[k] = B.2^k` in the recurrence
    relation.


    ```

    $\begin{matrix} & B2^{k} - 3B2^{k - 1} = 2^{k} \\ {(2^{k - 1})(2B - 3B) = 2.2^{k
    - 1} \\ - B = 2,B = -2 \end{matrix}$

    ```


    So, `PS = B2^k = –2.2^k`. So solution will be


    ```

    $\begin{matrix} & b_{k} = A3^{k} + ( -2)2^{k} \\ b_{k} = A.3^{k} - 2.2^{k} \\
    b_{k} = a_{n} \Rightarrow a_{n} = A.3^{log_{2}n}} - 2n \\ a_{n} = A_{0}n^{log_{2}3}
    - 2n \end{matrix}$

    ```


    Let `3^(log[2](n)) = n^p`. Taking log of both sides at base 2


    ```

    $\begin{array}{l} {\log_{2}^{n}\log_{2}^{3} = \text{p}.\log_{2}^{n}} \\ {\text{p}
    = \log_{2}^{3}} \end{array}$

    ```


