  trans: "\n\n`Heapify` 需要 O(n) 次的操作，而 `Adjust` 可能需要 O(log[2]n) 次的操作，因此 `HeapSort`\
    \ 的最坏情况时间复杂度为 O(n log[2]n)。\n\n## 2.6 线性时间排序\n\n有些排序算法的运行时间比 O(n logn) 快，但它们在排序时需要对待排序的输入集合有特定的假设。这里我们介绍三种线性时间排序算法：计数排序、基数排序和桶排序。桶排序可以用于许多与计数排序相同的任务，其时间复杂度分析也相似的；然而，与计数排序相比，桶排序需要调用相关的列表、动态数组或大量重新分配的内存来存储每个桶中的\
    \ gadget 单元，而计数排序仅在每个桶中存储一个数字（元素的计数器）。\n\n## 2.7 计数排序\n\n计数排序及其在基数排序中的应用均由 Harold\
    \ H. Seward 于 1954 年发明。计数排序是一种对一组具有键值的对象进行排序的算法，这些键值可以是小整数，也就是说，它是适用于整数排序的规则。它的工作原理是统计具有每个特定键值的\
    \ gadget 数，并对这些计数进行数学处理，以确定每个键值在输出序列中的位置。然而，它经常用作另一种排序算法（基数类型）的子程序，后者可以更高效地处理大键。由于计数排序使用键值作为数组的索引，它不属于比较类型，因此比较排序的\
    \ Ω(n log n) 某些下界并不适用于它。\n\n这种排序技术基于频率分布。如果值是介于某个下界 `l` 和上界 `u` 之间的整数，我们计算这些值的频率并将它们存储在数组\
    \ `F[0:u–l]` 中。\n\n| A = 15 | 12 | 15 | 16 | 19 | 36 | 15 | 15 |\n\nl = 12, and\
    \ u = 36\n\n值: 12, 15, 16, 19, 36\n\n`Σ f[i]` = 8 = 频率: 1, 4, 1, 1, 1\n\n累积频率:\
    \ 1, 5, 6, 7, 8\n\n在该算法中，我们将元素拷贝到新数组 `s[0:n–1]` 中。数组 `A` 中值等于最小可能值 `l` 的元素被拷贝到\
    \ `S` 的前 `F(0)` 个元素中，即位置 0 到 `F[0]–1`，值略大于 `l` 的元素被拷贝到位置从 `F(0)` 到 `(F(0) + F(1)–1)`，依此类推。\n\
    \n**算法：** `Counting-Sort(Ar[0:size-1])`\n\n```\n {\n     for g : =0 to (u-l) do\n\
    \          D[g]: = 0:\n     for j: = 0 to (size-1) do\n          D[Ar[j]]: = D[Ar[j]]+l:\n\
    \     for k: 1 to (u-l) do\n          D[k] := D[k-1]+D[k];\n     for i: = (size-1)\
    \ down to 0 do\n          k:=Ar[i]-1\n          S[D[k]-1] = Ar[i];\n         \
    \ D[k] := D[k]-1;\n     Return S;\n}\n```\n\n计数排序是一种稳定排序算法，因为它按照元素在未排序数组中遇到的顺序将元素拷贝到数组数组。\n\
    \n**示例 2.5：**\n\n| 输入 A = 6 | 9 | 7 | 6 | 4 | 5 | 6 | 7 | 9 | 5 |\n\nl = 4, u\
    \ = 9\n\nu–l = 9–4 = 5, n = 10\n\n元素: 4 5 6 7 8 9\n\n频率: 1 2 3 2 0 2\n\nJ = 1\
    \ to 5\n\n累积频率: 1 3 6 8 9 10\n\nFor i: (n-1) to 0 do `D[0] = 1`\n\n`D[1] = 3`\n\
    \n`D[2] = 6`\n\n`D[3] = 8`\n\n`D[4] = 9`\n\n`D[5] = 10`\n\n`i = n-1(第 1 次迭代)`\n\
    \n`n = 10`\n\n`j = 5–4=5` `{A[9] = 5}`\n\n`S[3–1] = 5`\n\n`S[2] = 5`\n\n| 5 |\
    \ 5 | | | | | `D[1] = 2(剩余)`\n\n最后，我们将得到排序后的数组。\n\n### 2.7.1 计数排序分析\n\n计数排序算法利用了最有效的简单循环，没有任何像递归或子程序调用等复杂概念，易于分析。如果\
    \ `k` 是常数，排序的总时间复杂度为 `θ(k) + θ(n) + θ(k) + θ(n) = θ(n)`。\n\n## 2.8 基数排序\n\n基数排序适用于\
    \ `n` 个整数，每个整数有 `d` 位数字。我们重复地开始排序。从最低位开始，到最高位结束。该排序是稳定的。\n\n**算法：** `RadixSort(Ar,\
    \ dig)`\n\n```\n{for k = 1 to dig,\n对 Ar 执行稳定排序。\n}\n```\n\n### 2.8.1 基数排序分析\n\
    \n假设 `d` 是常数，基数排序的运行时间为 `O(n)`。\n\n**示例 2.6：** 输入 A = {170, 45, 75, 90, 802, 24,\
    \ 2, 66, 94, 25} (此处省略过程)\n\n## 2.9 桶排序\n\n桶排序基于频率分布。如果值是介于某个下界 `l` 和上界 `u` 之间的整数，我们计算这些值的频率并将它们存储在数组\
    \ `F[0:u–l]` 中。\n\n桶排序可以用于许多与计数排序相同的任务，其时间复杂度分析也相似的；然而，与计数排序相比，桶排序需要调用相关的列表、动态数组或大量重新分配的内存来存储每个桶中的\
    \ gadget 单元，而计数排序仅在每个桶中存储一个数字（元素的计数器）。\n\n"
