       while(j<=9)\n   {\n    for(i=j+1;i<10&&front[i]==-1;i++);\n    if(i<=9)\n    {\n\
         p=i;\n     node[rear[j]].next=front[i];\n    }\n    j=i;\n   }\n    node[rear[p]].next=-1;\n\
     }\n//copy into original array\nfor(i=0;i<n;i++)\n {\n  a[i]=node[first].info;\n\
