    \nLast one is the final tree.\n\n## 6.2.3 Deletion\n\nLike the other basic operations\
    \ on a n-node RB Tree, deletion of a node takes time O(log n).\n\n**Algorithm:**\
    \ *RB-DELETE(T, c)*\n\nIf left[c]=nil or right[c]=nil then\n\n    b←c;\n\nelse\n\
    \n    b←tree-successor[c];\n\nif left[b]≠nil then\n\n    a←left[b];\n\nelse\n\n\
        a←right[b];\n\nparent[a]=parent[b];\n\nif parent[b]=nil then\n\n    root[tree]\
    \ ←a;\n\nelse if b=left[parent[b]] then\n\n    left[parent[y]] ←a;\n\n  else\n\
    \n    right[parent[y]] ←a;\n\nif b≠c then\n\n    key[c] ←key[b]; {copy b data\
    \ in c}\n\nif color[b]=black then\n\n    RB-DELETE-FIXUP(Tree, a)\n\nReturn b;\n\
    \nThe call to RB-DELETE-FIXUP(Tree, a) is only if b is black. If b is red the\
    \ red black property still holds then y is spliced out for the following reasons:\n\
    \n1.  No black height in the tree has changed.\n\n2.  No red node have been made\
    \ adjacent and since b couldn’t have been the root if it has red colour, the root\
    \ remain black.\n\n**RB-DELETE_FIXUP(Tree, a)**\n\nWhile a≠root[tree] and color[a]=black\n\
    \n    Do if a=left[Parent[a]] then\n\n        w←right[Parent[a]];\n\n    if color[w]=red\
    \ then\n\n        color[w] ←black;\n\n        color[Parent[a]] ←red;\n\n        LEFT-ROTATE(Tree,\
    \ Parent[a]);\n\n        w←right[Parent[a]];\n\n    if color[left[w]]=black and\
    \ color[right[w]]=black\n\n        color[w] ←red;\n\n        a←Parent[a];\n\n\
        else if color[right[w]]=black then\n\n        color[left[w]] ←black;\n\n        color[w]\
    \ ←red;\n\n        RIGHT-ROTATE(Tree, w);\n\n        w←right[Parent[a]];\n\n        color[w]\
    \ ←color[Parent[a]];\n\n        color[P[a]] ←black;\n\n        color[right[w]]\
    \ ←black;\n\n        LEFT-ROTATE(Tree, P[a]);\n\n        a←root[Tree];\n\n     else\
    \ (Same as then clause with right and left exchanged)\n\n        color[a] ←black;\n\
    \n## 6.3 B-tree\n\nB-trees are a type of balanced search trees. Concept of B-tree\
    \ was proposed by Rudolf Bayer and Ed. McCreight. The leaf nodes of B-tree are\
    \ at the same level. Number of child of internal nodes may vary but within a fixed\
    \ range. For example, in a 3–4 B-tree, an internal node may have only 3 or 4 children.\
    \ No frequent rebalancing is required in B-trees because of the flexibility in\
    \ number of child nodes. Wastage of space is the disadvantage of B-tree since\
    \ it is not necessary that the nodes must be full. Following are the properties\
    \ of B-tree:\n\n1.  Each node a has three fields:\n\n    1.  Number of currently\
    \ stored keys in node a, that is, n[a].\n\n    2.  These keys are in ascending\
    \ order, that is,\n\n        *k**e**y*[1][*a*] ≤ *k**e**y*[2][*a*]  ≤ −−≤              *k**e**y*[*n*][*a*]"
