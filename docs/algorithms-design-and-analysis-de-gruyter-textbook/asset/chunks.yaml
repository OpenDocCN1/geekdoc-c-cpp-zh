    ### Theorem 1.3


    If $F(x) = b_m x^m + b_{m-1}x^{m-1} + \dots + b_1x + b_0$ where $b_0, b_1, \dots,
    b_n$ are real numbers, then $f(x) \in O(x^m)$ if $x > 1$.


    **Proof:** $|x+y| \leq |x| + |y|$ for $\forall x, y \in \mathbb{Z}$


    $F(x) = b_m x^m + b_{m-1}x^{m-1} + \dots + b_1x + b_0$

    $|F(x)| = |b_m x^m + b_{m-1}x^{m-1} + \dots + b_1x + b_0|$

    $\leq |b_m|x^m + |b_{m-1}|x^{m-1} + \dots + |b_1|x + |b_0|$

    $\leq x^m\{|b_m| + |b_{m-1}|/x + \dots + |b_0|/x^m\}$

    $|F(x)| \leq x^m(|b_m| + |b_{m-1}| + \dots + |b_0|)$

    $\Rightarrow |F(x)| \leq cx^m$ for $x > 1$

    $\Rightarrow F(x) \in O(x^m)$


