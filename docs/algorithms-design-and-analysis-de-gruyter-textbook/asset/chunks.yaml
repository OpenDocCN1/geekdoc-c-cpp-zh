    计算上界（ub）的简单方法是加上已选择物品的价值 `v`、背包剩余容量 `(W-w)` 与剩余物品中单位价值价值的 `+ amount` 的乘积：


    `u[b] = v + (W - w)(V[i + 1]/w[i + 1])`


    **示例 3.6：** 给定如下物品列表（见表 3.5），求解背包问题。


    表 3.5：背包问题。


    | 物品 | 重量 | 价值 | 价值/单体重量 |

    | --- | --- | --- | --- |

    | 1 | 4 | 40 | 10 |

    | 2 | 7 | 42 | 6 |

    | 3 | 5 | 25 | 5 |

    | 4 | 3 | 12 | 4 |


    背包容量 `W` 为 10。


    在状态空间树的根节点，尚未选择任何物品，因为已选择物品的总重量 `w` 和总价值 `v` 均等于 0。


    上界 `ub` = 0 + 10 x 10 = 100


    `${ub} = v + {(W} - w)(\frac{v_{i + 1}}{w_{i + 1}})$![](img/b_9783110693607-003_fig_011.png)


    图 3.11：背包问题的解空间。


    通过分支界法求解的最解是物品子集 {1,3}，最大价值 = 65（见图 3.11）。


    ## 3.5 摊还分析


    在摊还分析中，执行一系列数据结构操作所需的时间是所有执行操作的平均值。它与平均情况分析不同，因为这种分析不涉及概率。我们计算 `n` 次操作总成本的上界 `T(n)`。那么，每个操作的平均成本为
    `T(n)/n`。该平均成本被视为摊还成本，使得所有操作具有相同的摊还成本。


    ### 3.5.1 聚合分析


    在聚合分析中，一系列 `n` 次操作总共消耗最坏情况时间 `T(n)`。在最坏情况下，每次操作的平均情况成本或摊还成本为 `T(n)/n`。


    ### 3.5.2 势分析法


    势分析将预付的努力视为可以释放以支付未来操作的“势”。假设 `DS[0]` 是起始数据结构，在其上执行 `n` 次操作，第 `i^{th}` 次操作的结果是数据结构
    `DS[i]`，`c[i]` 为第 `i` 次操作的实际成本。势函数将每个 `DS[i]` 映射到一个实数 `ϕ(DS[i])`，即与该数据结构相关的势。


    第 `i` 次操作的摊还成本 `c[i]^` 可以定义为：


    ```

    \begin{matrix} & {c_{i}^{\text{\textbackslash\textasciicircum}} = \, c_{i}\, +
    \,{\Delta\phi_{i}}} \\ & {\Delta\phi_{i}\, = \,\phi\,{(DS_{i}})\, - \,\phi(DS_{i
    - 1})} \end{matrix}

    ```


    因此，每个操作的摊还成本是实际成本与势增加之和。对于 `n` 次操作，总摊还成本为：


    ```

    \begin{matrix} & {\sum\limits_{i = 1}^{n}c_{i}^{\text{\textbackslash\textasciicircum}}
    = \sum\limits_{i = 1}^{n}{(c}_{i}^{} + \phi(DS_{i}) - \phi(DS_{i - 1}))} \\ &
    {\mspace{4460mu} = \sum\limits_{i = 1}^{n}c_{i}^{} + \phi(DS_{n}) - \phi(DS_{0}))}
    \\ & {if\,\phi(DS_{n}) \geq \phi(DS_{0}{)\ Then\,,total\, amortized}} & {{cost}\sum\limits_{i
    = 1}^{n}c_{i}^{\text{\textbackslash\textasciicircum}}{\,{is\, an\, upper\, bound\,
    on\, the\, total\, actual\, cost}}\sum\limits_{i = 1}^{n}c_{i}^{}} \end{matrix}

    ```


    如果 `ϕ(DS[i])` − `ϕ(DS[i−1])` > 0，则摊还成本 `c[i]^` 代表对第 `i` 次操作的收费过度，数据结构的势增加。如果势差为负，则摊还成本
    `Ĉ[i]` 代表对第 `i` 次操作的收费不足，操作的实际成本通过势的减少来支付。


    **示例 3.7：** 有三种栈操作：PUSH、POP 和 MULTIPOP。PUSH 简单地将元素置于栈顶，POP 操作从栈中删除一个元素。MULTIPOP
    操作一次性删除多个元素。在栈上定义一个势函数 `ϕ` 为栈中对象的数量。对于空栈：


    ```

    \begin{matrix} & {\phi(DS_{o}) = 0\quad\quad\quad\quad\phi(DS_{i}) \geq 0\,{The\,\,
    number\,\, of\,\, object\,\, in\,\, negative}.} \\ & {{Since}\,\phi(DS_{o}) =
    0} & {\Rightarrow\phi(DS_{i}) \geq \phi(DS_{o})} \end{matrix}

    ```


    因此，相对于 `ϕ` `n` 次操作的总摊还成本是总实际成本的上界。如果栈上的第 `i` 次操作是 PUSH，且栈包含 `p` 个对象，则势差将为 `ϕ(DS[i])`
    − `ϕ(DS[i−1])` = p+1。PUSH 操作的摊还成本是：


    ```

    \begin{matrix} & {c_{i}^{\text{\textbackslash\textasciicircum}} = c_{i}} + \phi(DS_{i})
    - \phi(DS_{i - 1})} & {c_{i}^{\text{\textbackslash\textasciicircum}} = 1 + 1 \in
    O{(1)}} \end{matrix}

    ```


    等等，从栈中弹出 `k''` 个对象。操作的实际成本是势差 `ϕ(DS[i])` − `ϕ(DS[i−1])` = $-k''$。因此 MULTIPOP 的摊还成本：


    ```

    \begin{array}{l} {{\hat{c}_{i}}^{i} = c_{i} + \phi(DS_{i}}) - \phi(DS_{i - 1})}
    \\ {{\hat{c}_{i}}^{i} = k'' - k'' = 0}\end{array}

    ```


    同样，POP 操作的摊还成本是 0。每个操作的摊还成本为 O(1)。因此 `n` 次操作的总摊还成本为 O(n)。


    ## 3.6 序


    有序集 `Š`：元素按升序排列的集合，`š={2, 3, 4, 5, 6}`。令 `Š` 为包含 `n` 个元素的有序集，如果 `n` 是奇数，中位数由 $\lceil\frac{n+1}{2}\rceil$
    给出。如果 `n` 是偶数，中位数为 $n/2$ 和 $n/2+1$，$\lfloor\frac{n+1}{2}\rfloor$ 和 $\lceil\frac{n+1}{2}\rceil$。


    下位中位数 上位中位数


    $n=5$ 时，median = $\lceil\frac{5+1}{2}\rceil = 3$。再次，`š={10, 12, 13, 14, 18}`，$n=6$
    时，Median = $\lfloor\frac{6+1}{2}\rfloor = 3$，且 $\lceil\frac{6+1}{2}\rceil = 4$。


    **$i^{th}$ 序统计**


    如果 `Š` 是包含 `n` 个元素的有序集，则 `Š` 的第 `i` 序统计是 `S` 的第 `i` 小元素。如果 $i=1$，第 $i$ 序统计给出集合的元素；对于
    $i=n$，我们得到集合的最大元素。


    **算法：** `Median (S)`


    ```

    { // S 是一个包含“n”个元素的有序集，

    Set `n = length (S);`

    $\begin{matrix} & {{if{((n/2) = 0)}}\{then}} \\ {{i: = \,\left\lfloor {\frac{n
    + 1}{2}}}\right\rfloor,\,\,\,\,\,\,\,\,\,\,\, j:=\left\lceil {\frac{n + 1}{2}}}\right\rceil;}
    & {{returni,}\,j;}} & {else} \\ {{k: = \left\lceil {\frac{n + 1}{2}}}\right\rceil;}
    & {{return}\,k;}} \end{matrix}$

    }

    ```


    该算法在常数时间内完成，因为每个步骤花费常数时间 (O(1))。


    **算法：** `Selection (i)`


    ```

    { *// 选择集合 S 的第 i^{th} 小元素，首先将 S 转换为有序集.*

    S: = sort (S);

    p := s[i]

    return p; // p 是集合 Š 的第 i^{th} 小元素。

    }

    ```


    该算法的复杂度取决于排序算法的复杂度（如果排序算法是堆排序或合并排序）。算法的复杂度为 O(nlog2n)。


    **算法：** `Min(S)`


    ```

    { // *在包含 p 个元素的给定 S 中寻找最小元素.*

    minimum : = s[1] // 将第一个元素设置为最小元素

    *for* j:= 2 to p do

    {

    if(minimum>s[j]) Then

    minimum: = s[j];

    }

    Return (minimum);

    }

    ```


    该算法的复杂度取决于基本操作比较，总比较次数为 (n–1)，因此复杂度为 θ(n)。


