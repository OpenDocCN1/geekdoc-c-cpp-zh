    \nFigure 2.6: Process of Heap Sort.\n\n### 2.5.1 Analysis of Heapify\n\nFor the\
    \ worst case analysis of *Heapify*, let 2^(k–1) ≤ n < 2^k. The levels of the n\
    \ node complete binary tree are numbered 1 to k. Number of iteration of *Adjust*,\
    \ for level i, it is **(k-i)**. Number of nodes at level **i** are given by 2^(i–1).\
    \ So, the total time for Heapify is proportional to\n\n${\\sum\\limits_{1 \\leq\
    \ \\text{i} \\leq \\text{k}}{2^{\\text{i} - 1}(\\text{k} - \\text{i})}} = {\\\
    sum\\limits_{1 \\leq \\text{i} \\leq \\text{k} - 1}{\\text{i}2^{\\text{k} - \\\
    text{i} - 1}}} \\leq \\text{n}{\\sum\\limits_{1 \\leq \\text{i} \\leq \\text{k}\
    \ - 1}{\\frac{i}{2^{i}} \\leq 2n = \\text{O}(\\text{n})}}$\n\nSo, *Heapify* takes\
    \ a linear time to create the heap using *Adjust* function.\n\n### 2.5.2 Heap\
    \ sort\n\n**Algorithm:** *HeapSort()*\n\n```\n {\n     Heapify (Ar,m);       \
    \                        // transforming array into max heap\n     for k:= m to\
    \ 2 step -1 do\n     {\n          Temp:= Ar[k];\n          Ar[k]: = Ar[1];\n \
    \         Ar[1]: = Temp;\n          Adjust (Ar,1,k-1);\n     }\n}\n```\n\n###\
    \ 2.5.3 Analysis of heap sort"
