    \    ![](graphic/converted/b_9783110693607-004_ingr_014.png)\n\n# Chapter 5 Number\
    \ theory, classification of problems, and random algorithms\n\n## 5.1 Division\
    \ theorem\n\nDivision theorem states that if x and y are integers, y ≠ 0\\. Two\
    \ exceptional integers a and b exist such that\n\n*x* = *y*.*a* + *b*, *w**h**e**r**e* 0 ≤ *b* < *y*\n\
    \nThe quotient is *a* = ⌊*x*/*y*⌋. The ultimate result b = x mod y is called the\
    \ principle remainder of the division. The remainder b is 0 if x is divisible\
    \ by y.\n\n### 5.1.1 Common divisor and greatest common divisor\n\nAs can be understood\
    \ by the term common divisor, a number is called a common divisor if it divides\
    \ two numbers. Let S is the divisor of x and y then it holds the following property:\n\
    \n*S*|*x*  *a**n**d*  *S*|*y* → *S*|(*x* + *y*)  *a**n**d*  *S*|(*x* − *y*)\n\n\
    In common terms, S|(xa + yb) for integers a and b.\n\nThe gcd is the largest common\
    \ divisor of two integers x and y, not both zero and is denoted by gcd (x, y).\n\
    \n**Theorem 5.1:** *If there are two integers x and y s.t. x, y ≠ 0, then gcd\
    \ of x and y is the smallest positive number of the set {xa + yb: a, b ϵ Z}*,\
    \ where Z is a set of integers.\n\n***Proof:*** Let us assume that G be an integer\
    \ that is smallest positive such that\n\n*G* = *x**a* + *y**b* *f**o**r* *s**o**m**e* *a*, *b* ∈ *Z*.\n\
    \nLet q be the quotient and value of q is ⌊*x*/*G*⌋.\n\n$\\begin{matrix} & {x\\\
    ,{mod}\\, G\\, = \\, x - q.G} \\\\ & {\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\\
    ,\\,\\,\\,\\,\\,\\,\\,\\, = \\,\\, x - q\\left( {{xa}\\,{+ yb}} \\right)} \\\\\
    \ & {\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\, = \\,\
    \ x\\left( {1 - {qa}} \\right)\\, + \\, y\\left( {- \\,{qb}} \\right)} \\end{matrix}$\n\
    \nHence *x mod G* is a linear combination of x and y also but as x mod G < G,\
    \ so we have that x mod G = 0 since G is the least positive such linear combination\
    \ and so G|x, and similarly G|y. Therefore G is a common divisor of x and y and\
    \ so\n\n(i)*g**c**d*(*x*, *y*)  ≥ *G*\n\nAgain gcd(x, y) divides both x and y\
    \ and G is linear combination of x and y.\n\nBut gcd (x, y)|G and G > 0\n\n ⇒ *g**c**d*(*x*, *y*) ≤ *G*\n\
    \nMerging with eq (i) we get\n\n*g**c**d*(*x*, *y*) = *G*.\n\n## 5.2 Chinese remainder\
    \ theorem\n\nSun-Tzu, a mathematician from China found answer to the problem of\
    \ identifying a set of integers x that give remainder 2 if divided by 3, give\
    \ 3 if divided by 5, and remainder 2 if divided by 7\\. This theorem proves a\
    \ match between a system of equations modulo a set of pair wise relatively prime\
    \ moduli and equation modulo their product.\n\n**Theorem:** Let *m*[1], m[2,]\
    \ m[3] …, *m[i]* , …, *m[k]* be relatively prime integers, these are regularly\
    \ known as *moduli* or *divisors*. Let the product of these numbers up to k^(th)\
    \ number be M.\n\nAccording to the theorem, if the *m[i]* are pairwise coprime,\
    \ and *a*[1], …, *a[k]* are whole numbers, then p is the only integer, such that 0 ≤ *p* < *M* and\
    \ the remainder of the Euclidean division of *p* by *m[i]* is *a[i]* for every *i*.\n\
    \nThe above statements may be formed as follows in term of congruence:\n\n$\\\
    begin{matrix} & {p \\equiv a_{1}(mod\\; m_{1})} \\\\ & {p \\equiv a_{2}(mod\\\
    ; m_{2}).} \\\\ & . \\\\ & . \\\\ & {p \\equiv a_{k}\\left( {mod\\; m_{k}} \\\
    right),} \\end{matrix}$\n\nand any two such *p* are congruent modulo *M.*\n\n\
    ***Proof:*** To establish this theorem, we need to show that a solution exists\
    \ and it is unique modulo M. First we will construct the solution and then prove\
    \ that yes it is the solution.\n\nLet $M_{k'} = \\frac{M}{m_{k'}}\\{ M_{k}^{\\\
    prime} = m_{1}.m_{2.}m_{3}\\ldots\\,\\, m_{k' - 1}m_{k' + 1}.\\ldots\\ldots m_{k}\\\
    }$, for *k′* = 1,2, … k that is *M′*[*k′*] is the product of all *m*[*k′*] except\
    \ *m*[*k.*]\n\nClearly (*M[k′],m[k′])* = 1\n\nAlso there exists an integer *y′[k′]*,\
    \ inverse of *M′[k′]* modulo *m[k]* such that\n\n*M*[*k*]^′*y*[*k*]^′ ≡ 1 *m**o**d*(*m*[*k*])\n\
    \nTo construct the solution for the set of equations,\n\n*p* = *a*[1]*M*[1]*y*[1] + *a*[2]*M*[2]*y*[2] + …………. + *a*[*k*]*M*[*k*]*y*[*k*]\n\
    \nNow we will show that p is the solution of system of equations\n\nTaking p mod(*m[k′]*),\
    \ since\n\n*m[J]* = 0 mod(*m[k′]*) when *J ≠ k′*\n\nThus all terms produce remainder\
    \ 0 when divided by *m[k′]* except the term *a*[*k*]*M*[*k*]^′*y*[*k*]^′ So\n\n\
    $\\text{Re}\\left( \\frac{p}{m_{k}'} \\right) = \\left( \\frac{a_{k}M_{k}'y_{k}'}{m_{k'}}\
    \ \\right) + 0$\n\nAgain\n\n$= Re\\left( \\frac{a_{k'}(S.m_{k'} + 1)}{m_{k'}}\
    \ \\right) = a_{k'}$\n\nWhich is the solution of k′ th equation.\n\nSince\n\n\
    (*M*[*k*^′].*y*[*k*^′]) ≡ 1 *m**o**d*(*m*[*k*])\n\nThus\n\n(*M*[*k*^′].*y*[*k*^′]−1)/*m*[*k*^′] = *S* (*i**n**t**e**g**e**r*)(*M*[*k*^′].*y*[*k*^′]) = (*S*.[*m**k*^′] + 1)\n\
    \nSimilarly, for other equations, thus we have p is the solution to the given\
    \ system of equations.\n\nTo get smallest such p, take p mod (M) and this will\
    \ be the smallest number which will satisfy the given system of equations.\n\n\
    **Solution of Puzzle:** Let p be the number of the things\n\np/3 has reminder\
    \ 2, Thus p ≡ 2(mod 3)\n\np/5 has reminder 3, Thus p ≡ 3(mod 5)\n\np/7 has reminder\
    \ 2, Thus p ≡ 2(mod 7)\n\nOR\n\n$\\left. \\begin{matrix} {p\\, \\equiv \\, 2\\\
    ,{(mod}\\,{3)}} \\\\ {p\\, \\equiv \\, 3\\,{(mod}\\,{5)}} \\\\ {p\\, \\equiv \\\
    , 2\\,{(mod}\\,{7)}} \\end{matrix} \\right\\} set\\, of\\, congrument\\, Eq^{n}$\n\
    \nTaking N = n[1]n[2]n[3] = 3.5.7 = 105\n\nn[1] = N/3 = 35\n\nn[2] = N/5 = 21\n\
    \nn[3] = N/7 = 15\n\nAgain we see that 2 is inverse of 35 (modulo 3), Since\n\n\
    35 × 2 ≡ 1(*m**o**d* 3).*A**l**s**o* 1 *i**s* *t**h**e* *i**n**v**e**r**s**e* *o**f* (21 *m**o**d* 5), *s**o*∵  1  *x*  21  ≡  1(*m**o**d* 5)\n\
    \nAnd 1 is inverse of 15(mod 7)\n\n∵  1*X*15 ≡ 1(*m**o**d* 7)"
