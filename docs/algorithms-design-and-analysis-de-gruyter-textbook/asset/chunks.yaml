    \n图 4.16：正向与反向边。\n\n**算法:** `FORD-FULKERSON-ALGORITHM (G, S, T)`\n\n```\n {\n\
    for each edge (p, q) of graph G\ndo f[p, q] := 0\nf [q, p] : =0\nWhile there exist\
    \ an augmenting path P from S to T in the residual network Gf\n// 增路路径的剩余容量等于路径中每条边容量的最小值。\n\
    do RCf(P):= min {RCf (p, q) : (p, q ) is in P}\nfor each edge (p, q) in path P\n\
    do f[ p, q ] := f [p, q ] + RCf(P)\nf[ q, p ] := – f [ p, q ] // while 循环反复在 Gf\
    \ 中寻找增路路径 P，\n//并通过剩余容量 RCf(P) 沿 P 增加流量 f。当不存在增路路径时，流量 f 为最大流。 //\n}\n```\n\n\
    **示例 4.10:** 寻找图 4.17 所示图的最大流。\n\n**图 4.17:** 图\n\n![](img/b_9783110693607-004_fig_016.png)\n\
