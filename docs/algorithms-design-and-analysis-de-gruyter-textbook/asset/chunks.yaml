    \ 于 1960 年发明，他于于 1962 年正式提出。它依赖于分治法（DAC）技术。这是一种决策算法，由于执行并不困难，规模较大。它是一种很好的“广泛适用”排序算法，在执行过程中通常消耗的资源较少。\n\
    \n快速排序通过将给定的簇 `Ar[p . . r]` 分配两个非空子数组 `Ar[p . . q–1]` 和 `Ar[q + 1 . . r]` 来工作，使得\
    \ `Ar[p . . q–1]` 中的每个键都不等于或等于 `Ar[q]`，从而也不等于或等于 `Ar[q + 1 . . r]` 中的每个键。我们将此组件\
    \ (`Ar[q]`）称为“基准（PIVOT）”。此时，两个子数组将通过递归调用快速排序来排列。片段的具体情况取决于给定的数组，索引 `q` 是作为划分方法的一部分计算出来的。\n\
    \n这是一种依赖于分治方法的的重要排序方法。与合并排序根据数组中的情况分离输入完全不同，快速排序是显式地根据值对它们进行划分。它将给定显示 `Ar[1:n]`\
    \ 的元素重组为它的片段，在这种情况下，片段 `s` 之前的所有组件都小于或等于 `Ar[s]`，而该片段之后的所有组件都大于或等于 `Ar[s]`。显然，在完成关于\
    \ `s` 的划分后，`Ar[s]` 将位于排序后数组的最终位置。我们可以通过相同的方法独立地对 `Ar[s]` 之前和之后的两个子数组继续排序。首先，我们选择一个元素作为划分子数组的基准值。选择“基准”的最简单程序是将子数组的第一个元素设置为基准元素。这种排序策略被认为是就地的，因为它没有使用其他数组。\n\
    \n### 2.3.1 分治方法\n\n*   **划分（Divide）：** 将数组 `Ar [1: size]` 拆分为 `Ar [1: d–1]` 和\
    \ `Ar [d + 1: size]`，其中 `d` 是作为划分的一部分的。\n*   **解决（Conquer）：** 递归地排序 `Ar [1: d–1]`\
    \ 和 `Ar [d + 1: size]`。\n*   **合并（Combine）：** 所有这些操作让排序数组留在原地。\n\n**算法：** *Partition\
    \ (Ar, d, p)*\n\n//这是关于 Ar[d] 对数组 Ar[d:p-1] 的划分。\n\n```\n {\n             v: =\
    \ Ar[d]; it: = d; j: = p;\n             repeat\n                          {\n\
    \                                 repeat{\n                                  \
    \            it : = it +1;\n                                              }until\
    \ (Ar[it] ≥ v);\n                                       repeat {\n           \
    \                                   j = = j-1;\n                             \
    \                 }until (Ar[j] ≤ v);\n                                 if (it\
    \ < j), then interchange(Ar, it, j);\n                          }until (it ≥j);\n\
    \             Ar[d]: = Ar[j]; Ar[j]: = v;\n             return j;\n}\n```\n\n\
    **算法：** *Interchange (Ar, it, j)*\n\n```\n // 交换值 Ar[it] 和 Ar[j]\n{\n        \
    \    temp:= Ar[it];\n            Ar[it]: = Ar[j];\n            Ar[j]: = temp;\n\
    }\n```\n\n**算法：** *Quick Sort (m, n)*\n\n```\n {\n            If (m<n) then\n\
    \                    {                      // 将问题分解为子问题\n                   \
    \            index:= Partition(Ar, m, n);\n                               Quick\
    \ Sort (m, index-1);\n                               Quick Sort (index+1, n);\n\
    \                    }\n}\n```\n\n**示例 2.2：**\n\n![](img/b_9783110693607-002_fig_002.png)\n\
    \n图 2.2：快速排序示例。\n\n### 2.3.2 快速排序分析\n\n*   **最坏情况分析：** 在大多数最坏情况下，两个子数组中的一个将为空，而另一个仅比被划分子数组的大小少一个。这种情况发生在给定数组已经排序好的情况下。在这种情况下，取第一个元素作为基准元素。从左到右的输出将在\
    \ `A[2]` 停止，而向左扫描的选择将尽可能远并到达 `A[1]`，展示在位置 1 处的划分。因此，在 (n +1) 次比较后，我们将得到这个片段并将基准\
    \ `A[1]` 交换到自身。算法将对递增的数组 `A[2: n]` 完成排序。这种规模逐渐减小的递增数组过程将继续，直到最后一个 `A[n-1:n]` 需要就绪。因此，比较总数为：\n\
