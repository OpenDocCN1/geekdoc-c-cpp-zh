    We have a weighted, undirected, and complete graph $G = (V, E)$. Each edge $(u,
    v)$ has positive integer cost $c(u,v)$. The travelling salesman problem is to
    start from source vertex and cover all the vertices exactly and then return back
    to starting vertex and the cost of route must be minimum, that is, we have to
    find out Hamiltonian cycle of $G$ with minimal cost. The cost $c[ij] = \infty$
    if $(i,j) \notin E$, $|V| = n$ where $n > 1$.


    Let $g(i, S)$ be the length of shortest path beginning at vertex $i$ going via
    all vertices in $S$ and ending at vertex 1. The value $g(1, V-\{1\})$ is the length
    of optional tour, so we have


    $\text{g}\left( {\text{1},\text{V-}\left\{ \text{1} \right\}} \right)\text{=}\underset{\text{2}
    \leq \text{k} \leq \text{n}}{\text{min}}\left\{ {\text{c}_{\text{1},\text{k}}\text{+g}\left(
    {\text{k},\text{V-}\left\{ \text{1},\text{k} \right\}} \right)} \right\}$


    We have to obtain,


    $g(i, S) = \min[j \in S]\{C[ij] + g(j, S-\{j\})\}$


    Clearly, $g(i, \phi) = c[i1]$, $1 \leq i \leq n$


    When $|S| < n - 1$


    The values of $i$ and $S$ for which $g(i, S)$ is needed are such that $i \neq
    1$, $1 \notin S$, $i \notin S$.


    $g\{1, V-\{1\}} = \min[2 \leq k \leq n]\{c[1k] + g\{k, V-\{1,k\}\}\}$


    $g\{i, S*\} = \min[j \in S]\{c[ij] + g\{j, S-\{j\}\}\}$


    Clearly $g(i, \phi) = c[i1]$


    **Example 3.4:** Solve the given TSP in Figure 3.7


    ![](graphic/converted/b_9783110693607-003_fig_007.png)


    Figure 3.7: The traveling salesman problem.


    Since $g\{i, \phi\} = c[i1]$ so


    $g(B, \Phi) = c_{BA} = 5$

    $g(C, \Phi) = c_{CA} = 8$

    $g(D, \Phi) = c_{DA} = 6$


    Now compute $g(i, S)$ with $|S| = 1$,


    $g(B, \{C\}) = \{ c_{BC} + g(C, \phi)\} = 8 + 8 = 16$

    $g(C, D) = \{ c[CD] + g(C, \phi)\} = 13$

    $g(D, C) = \{ c[DC] + g(C, \phi)\} = 15$

    $g(C, B) = \{ c[CB] + g(B, \phi)\} = 13$

    $g(B, \{D\}) = \{ c_{BD} + g(D, \phi)\} = 9 + 6 = 15$

    $g(D, \{B\}) = \{ c_{DB} + g(B, \phi)\} = 9 + 5 = 14$


    When $|S| = 2$,


    $\begin{matrix} \{g(B, \{C, D\}) = \min[c_{BC} + g(C, D), c_{BD} + g(D, C)]\}
    \\ & \min[8+13, 9+15] \\ & \min[21, 24] \\ & = 21 \end{matrix}$


    $g(C, \{B, D\}) = \min[c_{CB} + g(B, D), c_{CD} + g(D, B)\} = 21$


    $g(D, \{B, C\}) = \min[c_{DB} + g(B, C), c_{DC} + g(C, B)\} = 20$


    Finally,


    $\begin{matrix} &g(D, \{B, C, D\}) = \min\{c_{DB} + g(B, \{C, D\}), c_{DC} + g(C,
    \{B, D\})\} \\ & = \min\{26, 29\} = 26 \end{matrix}$


