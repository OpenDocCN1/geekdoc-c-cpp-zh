    ### 3.3.3 Chain matrix multiplication


    The chain matrix multiplication problem is important in the area of compiler design
    and database. As we want to code optimization and query optimization. The problem
    statement is:


    *Given {A[1], A[2] … … ..A[n]}, matrix A[i] has dimension p[i-1] x p[i] and we
    have to perform the matrix multiplication and parenthesize the product A[1] X
    A[2] … … .. A[n] in such a way so that the number of scalar multiplications will
    be minimum.*


    Since matrix multiplication holds associativity property but not commutativity,
    we have to follow above matrix order for multiplication but we are free to parenthesize
    the above multiplication. Two matrices are compatible for multiplication if number
    of columns in first matrix equals to rows in second.


    $C\lbrack{i\rbrack\lbrack j}\rbrack = \sum\limits_{k = 1}^{q}{{A\lbrack i\rbrack\lbrack
    k}\rbrack \ast B\lbrack{k\rbrack\lbrack j}\rbrack}$


    The number of places in parenthesis in sequence of n matrices given by p(n). Then,


    *p*(*n*) = 1 *f**o**r* *n* = 1


    Let us insert split between matrices, subproduct may take place between mth and
    m + 1th matrices. Thus, for any m = 1 to n–1, the recurrence relation will be,


    $p(n) = \left\{ \begin{matrix} {\!\!\!\!\!\!\!\!\!\!\!\!\!\!\!\!\!\!\!\!\!\!\!\!\!\!\!\!\!\!\!\!
    1,{\ \ \ \ \ \ if\ n = 1}} \\ {\sum\limits_{m = 1}^{n - 1}{{p(m)}{.p(n} - {m)\
    if\ n} \geq 2}} \end{matrix} \right.$


    Let A[i … j] represent the product of A[i], A[i +1] … … ..A[j], where i ≤ j. If
    problem is nontrial, i > k then any parenthesization of the product A[i], A[2]
    … … ..A[j] must split the product between A[k] and A[k + 1] for some integer k
    where i < = k < j. For some value of k, we first compute A[i … k] and A[k + 1
    … j] and then result is combined to get the final product A[i] … .j. The cost
    of this process is therefore the sum of computing cost of matrix A[i … k] and
    A[k + 1 … j] and cost of multiplying these two matrices together. To compute the
    matrix A[i … j], suppose minimum N[i, j] number of scalar multiplication are performed.
    N[i, j] can be defined as:


    *N*[*i*, *j*] = *N*[*i*, *k*]+*N*[(*k* + 1)*j*] + {*p*[*i* − 1]*x**p*[*k*]*x**p*[*j*]}, *w**h**e**r**e* *i* ≤ *k* < *j* *C**l**e**a**r**l**y*, *N*[*i*, *i*] =  = 0.


