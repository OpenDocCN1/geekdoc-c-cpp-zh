    \n### 4.4.2 Floyd Warshall’s algorithm\n\nIn Floyd Warshall’s algorithm, a matrix\
    \ called distance `L[nxn]` is used to store the length of shortest path between\
    \ vertices, where `pqth` cell denotes the shortest path length between vertex\
    \ `v[p]` to `v[q]` and `1 ≤ p, q ≤ n`. One advantage of this algorithm is that\
    \ it can be applied to both directed and undirected graph. The matrix `L` of a\
    \ weighted graph with `n` vertices is computed through a sequence of `n x n` matrices.\n\
    \n`L((0))`, `L((1))`, `L((2))`………`L((r))`……..`L((n))`\n\nMatrix `L^r` (`r = 0,\
    \ 1, … n`) is equal to the length of the shortest path among all the paths from\
    \ the `pth` vertex to `qth` vertex with each intermediate vertex if any, number\
    \ not more than `r`. The time complexity of algorithm is O(n³) due to three nested\
    \ for loops.\n\n**Algorithm:** `Floyd-Warshall(W)`\n\n```\n// Input: The weight\
    \ matrix W\n// Output: The distance matrix L of the shortest path lengths\n{\n\
    \    L := W //W = L((0))\n    for r: =1 to |V| do\n    {\n        for p: =1 to\
    \ |V| do\n        {\n            for q: =1 to |V| do\n            {\n        \
    \        L[p,q]: =Min (L[p, q], L[p, r]+L[r, q]);\n            }\n        }\n\
    \    }\n    Return L;\n}\n```\n\n**Complexity:** The running time complexity of\
    \ Floyd Warshall’s algorithm is O(n³).\n\n**Example 4.5:** \n\n![](graphic/converted/b_9783110693607-004_ingr_006.png)\n\
    \n### 4.4.3 Dijkstra algorithm\n\nDijkstra’s algorithm is a single-source shortest\
    \ path algorithm; it follows greedy approach applicable to graph with positive\
    \ weights. The time efficiency of Dijkstra’s algorithm depends on the data structure\
    \ used for representing the graph itself. If graph is represented by adjacency\
    \ list and the priority queue implements as min heap. Its complexity will be O(|E|log[2]|V|).\n\
    \n**Algorithm:** `Dijkstra(G, A)`\n\n```\n// Input: A graph G and source A\n//\
    \ Output: The distance d[v] from A to all vertices v\n{\n    for each v in V \n\
    \        d[v] = ∞;\n    d[A] = 0;\n    Q = vertices in V;\n    while Q is not\
    \ empty\n        u = extract vertex from Q with minimum d[u];\n        for each\
    \ neighbor v of u\n            if d[u] + weight(u,v) < d[v]\n                d[v]\
    \ = d[u] + weight(u,v);\n}\n```\n\n**Example 4.6:** Find the single-source shortest\
