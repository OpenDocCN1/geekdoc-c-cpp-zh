    \ |\n\nTotal block 8 × 8 = 64.\n\n![](graphic/converted/b_9783110693607-003_fig_005.png)\n\
    \nFigure 3.5: Possible solution for 8-queen problem.\n\nThe problem can be computationally\
    \ quite expensive as there are *C*[8]^(64), that is, 4,426,165,368 possible placements\
    \ of the queens on board, out of which only 92 arrangements satisfy the objective.\n\
    \nIt is quite feasible to use shortcuts that reduce computational requirements\
    \ or guidelines of thumb that avoids brute-force computational strategies. As\
    \ an instance, just by way of making use of an easy rule that constrains every\
    \ queen to an single column (or row), though nevertheless considered brute force,\
    \ it is possible to lessen the quantity of possibilities to simply 16,777,216\
    \ (that is, 8⁸) viable combos. Generating diversifications in addition reduces\
    \ the opportunities to just 40,320 (this is, 8!), which are then checked for diagonal\
    \ attacks. However, by allowing one placement of a queen on distinct row and column.\n\
    \nThe number of ways are ë8 = 40,320 {8 Tuples}\n\nLet us assure that ith queen\
    \ is placed on row i so all the solution to 8-queen problem can therefore be represented\
    \ by 8 tuples (c[1], c[2],..,c[8]) where c[i] is the column on which ith queen\
    \ is placed. The size of sample space is 8⁸. Out of 8 tuples, no c[i]’s can be\
    \ same, this reduces the size of sample space to ë8.\n\nState space tree:\n\n\
    Backtracking algorithms decide problem solutions via systematically looking the\
    \ answer space for the given problem instance. This seek is aided using a tree\
    \ agency for the answer space. We start with an initial state node and organize\
    \ a tree of solution space. Every node on this tree defines a problem state. All\
    \ paths from the root node to other nodes define the state space of the problem.\
    \ Solution states are those problem states for which the path from root to s defines\
    \ a tuple within the solution space. The tree organization is known as state space\
    \ tree.\n\n*   **Live node:** A node is a live node which has been generated and\
    \ all of whose child nodes have not yet been generated.\n\n*   **Dead node:**\
    \ This node is a generated node which is not to be more expanded on chess board.\n\
    \n*   (R-L) “UPPER LEFT TO LOWER RIGHT”\n\n*   Again (R-L) value\n\n*   (5,1) = 6,(2,4) = 6,(3,3) = 6\
    \ “lower left to upper right” (sum of cell coordinate). Similarly upper left to\
    \ lower right (3, 1) = 2, (4, 2) = 2\n\n*   Let us suppose two queens are placed\
    \ at position (m,n) and (p,q)\n\n*   Then they are on same diagonal\n\n    *i**f* *m* − *n* = *p* − *q* *o**r* *m* + *n* = *p* + *q*  *n* − *q* = *m* − *p* *o**r* *n* − *q* = *p* − *m*\n\
    \n*   Therefore, two queen lie on the same diagonal if\n\n    |*n* − *q*| = |*m* − *p*|\n\
    \n**Algorithm**: *Place (p, m)*\n\n*//This returns a Boolean value that is true\
    \ if m^(th) column is suitable for the p^(th) queen.*\n\n```\n {\n     for n :=\
    \ 1 to (p-1) do\n     if ( (c [n] == m) // same column\n     or [Abs (c[n] – m)\
    \ == Abs (n-p)]) //diagonally attacking position\n                           \
    \     then return false;\n     return true ;\n}\n```\n\n**Algorithm**: *Nqueen\
    \ (p, N)*\n\n```\n {\n     for m: = 1 to N do\n     {\n          if place (p,\
    \ m) then\n          {\n               c[p]: = m,\n               If (p = N)\n\
    \               Then write (c[1 : N]);\n          else Nqueen (p+1, N);\n    \
    \      }\n     }\n}\n```\n\nAll solution of the N-queens problem for n = 8 are\
    \ 92.One of the possible solution of 8-queen problem is:\n\n{c[1],c[2],c[3],c[4],c[5],c[6],c[7],c[8]} ≡\
    \ {4,6,7,8,2,7,1,3,5}\n\n## 3.3 Dynamic programming\n\nDynamic programming is\
    \ an innovative way for fixing complex problems by means of breaking them into\
    \ some small or tiny subproblems or subtasks. It is applicable for issues exhibiting\
    \ the residences of overlapping subproblems and top-quality substructure (described\
    \ below). When applied, the method takes far less time than naive methods that\
    \ do not take gain of the subproblem overlap (like depth-first search).\n\nDynamic\
    \ programming is a method for fixing issues with overlapping subproblems. These\
    \ subissues rise up from a recurrence relating option to a given hassle with solution\
    \ to its smaller subproblems of the identical type. Rather than fixing overlapping\
    \ subissues repeatedly. Dynamic programming advises solving every smaller subproblem\
    \ just once and storing the result in a table from which we can obtain a solution\
    \ to the original problem.\n\nThe Fibonacci relation: *F*[*n*] = *F*[*n* − 1] + *F*[*n* − 2]\n\
    \n*F*[0] = *F*[1] = 1 (*i**n**i**t**i**a**l* *c**o**n**d**i**t**i**o**n**s*)\n\
    \nA recurrence relation, if we know F[n–1] and F[n–2], we can compute F[n] easily.\n\
    \n### 3.3.1 0/1 knapsack problem\n\nWe have n items of weights w[1], w[2], … …\
    \ … .w[n] and values v[1], v[2], … … v[n], and W is the capacity of knapsack.\
    \ We need to fill the knapsack while gaining maximum profit. In 0/1 knapsack,\
    \ we cannot take portion of object, that is, either an object is selected for\
    \ knapsack or not.\n\nThe 0/1 knapsack problem as LPP is:\n\n$\\begin{matrix}\
    \ & {{Max\\, z =}\\sum\\limits_{i = 1}^{n}{x_{i}.v_{i}}} \\\\ & {{such\\, that}\\\
    sum\\limits_{i = 1}^{n}{x_{i}.w_{i}} \\leq W} \\\\ & {v_{i} \\geq {0,}w_{i} \\\
    geq 0{\\, and\\,}x_{i} \\in \\{ 0,1\\}} \\end{matrix}$\n\nWe are to find a recurrence\
    \ relation that expresses a strategy to an example in phrases of its small subinstances.\
    \ The time and space performance each for the set of rules is *θ*(nW).\n\nLet\
    \ us take the first i items (1 ≤ i ≤ n), and knapsack ability j < W. O[i, j] be\
    \ the value of optimal solution of these i items that suit the knapsack of capability\
    \ j. This instance of i items is partitioned into subsets of two categories,\n\
    \n*   First subset does not contain the ith item, O[i-1, j] is the value of this\
    \ subset. If ith object is not placed into the knapsack then the value will be\
    \ same as of i–1 objects, so: O[i, j] = O[i–1 j]\n\n*   Second subset contains\
    \ the ith item, therefore the value of such optimal subset is\n\n*v*[*i*]+*O*[*i* − 1, *j* − *w*[*i*]]\n\
    \nThus, the value of an optimal solution of the first i objects is the maximum\
    \ of these two categories’ values.\n\n*O*[*i*, *j*] = max { *O*[*i* − 1, *j*],    *v**i*+  *O*[*i* − 1, *j* − *w*[*i*]]   *i**f*(*j* − *w*[*i*]) ≥ 0\n\
    \nThe initial conditions are:\n\n*O*[0, *j*] = 0 *f**o**r* *j* ≥ 0 *A**n**d* *O*[*i*, 0] = 0 *f**o**r* *i* ≥ 0\n\
    \nThe objective is to find O[n, W].\n\n**Example 3.3:** We have the following\
    \ information\n\n| Item | Weight | Value |  |\n\n| 1 | 2 | RS 12 | CAPACITY W = 5\
    \ |\n\n| 2 | 1 | RS 10 |\n\n| 3 | 3 | RS 20 |\n\n| 4 | 2 | RS 15 |\n\n![](graphic/converted/b_9783110693607-003_fig_006.png)\n\
    \nFigure 3.6: Knapsack problem.\n\n*O*[0, *J*] = 0, *J* ≥ 0 *a**n**d* *O*[*i*, 0] = 0, *i* ≥ 0\n\
    \nO [4,5] > O [3,5], item 4 is included in knapsack . Again O[3,3] = O[2, 3],\
    \ so item 3 is not included in knapsack. Also O[2,3] > O[1, 3], so item 2 is included\
    \ in knapsack. Again O[1, 2] > O[0, 2], thus item 1 is also included. Hence optimal\
    \ solution is {1, 2, 4}. (see figure 3.6).\n\nOptimal value is O [4, 5] = RS.\
    \ 37\n\n### 3.3.2 The traveling salesman problem"
