    \n7. 在给定的流网络找到从源点 `1` 到汇点 `6` 的最大流。\n\n![](img/b_9783110693607-004_ingr_014.png)\n\
    \n# 第 5 章 数论、问题分类与随机算法\n\n## 5.1 除法定理\n\n除法定理规定，如果 `x` 和 `y` 是整数且 `y ≠ 0`，则存在唯一的整数\
    \ `a` 和 `b` 使得 `x = y * a + b`，其中 `0 ≤ b < y`。\n\n商 `a = ⌊x/y⌋`。最终结果 `b = x mod\
    \ y` 称为余数。如果 `x` 可被 `y` 整除，则余数 `b=0`。\n\n### 5.1.1 公约数与最大约数\n\n从公约数一词可以理解，如果一个数整除两个数，则被称为公约数。设\
    \ `S` 是 `x` 和 `y` 的约数，则满足以下性质：`S|x` 且 `S|y`。在通俗中，对于整数 `a` 和 `b`，`S|(xa + yb)`。\n\
    \n`gcd` 是两个整数 `x` 和 `y` 的最大公约数（非零），记 `gcd(x, y)`。\n\n**定理 5.1:** 如果存在两个整数 `x`\
    \ 和 `y` 使得 `x, y ≠ 0`，那么 `x` 和 `y` 的 `gcd` 是集合 `{xa + yb: a, b ∈ Z}` 中的最小正整数，其中\
    \ `Z` 是整数集。\n\n**证明:** 假设 `G` 是使得 `G = xa + yb` 对于某些 `a, b` 的最小正整数。设 `q` 为商，值为\
    \ `⌊x/G⌋`。\n\n```\nx mod G = x - qG = x - q(xa + yb) = x(1 - qa) + y(-qb)\n```\n\
    因此 `x mod G` 是 `x` 和 `y` 的线性组合，且由于 `G` 是最小正组合 `x mod G < G`，且 `G|x`，`G|y`。因此 `G`\
    \ 是 `x` 和 `y` 的一个公约数，所以：\n\n(i) `gcd(x, y) ≥ G`。\n\n同样 `gcd(x, y)` 整除 `x` 和 `y`\
    \ 且 `G` 是 `x` 和 `y` 的线性组合。但 `gcd(x, y)|G` 且 `G > 0` ⇒ `gcd(x, y) ≤ G`。\n\n结合方程\
    \ (i) 得 `gcd(x, y) = G`。\n\n## 5.2 中国剩余定理\n\n中国数学家孙子找到了一个问题：确定一组整数 `x`，使其被 3 除余\
    \ 2，被 5 除余 3，被 7 除余 2。该定理证明了模一组互质数的方程组与模其积方程之间的关系。\n\n**定理:** 设 `m[1], m[2], m[3]\
    \ …, m[i], …, m[k]` 为互质整数，这些通常被称为“数”或约数。设这些数的积为 `M`。\n\n根据定理，如果 `m[i]` 两两互质且 `a[1],\
    \ …, a[k]` 为整数，则 `p` 是唯一满足 `0 ≤ p < M` 且对于每个 `i`，`p` 除 `m[i]` 的余数为 `a[i]` 的整数。\n\
    \n上述陈述可以用同余形式形成如下：\n\n```\n\\begin{matrix}\np \\equiv a_1(mod m_1) \\\\\np \\\
    equiv a_2(mod m_2) \\\\\np \\equiv a_k(mod m_k)\n\\end{matrix}\n```\n\n且任意两个这样的\
    \ `p` 模 `M` 同。\n\n**证明:** 为了建立该定理，我们需要证明解存在且模 `M` 唯一。我们首先构造解，然后证明它是解。\n\n设 $M_{k'}\
    \ = \\frac{M}{m_{k'}}\\{ M_{k}^{\\prime} = m_{1}.m_{2.}m_{3}\\ldots\\,\\, m_{k'\
    \ - 1}m_{k' + 1}.\\}$ 对于 $k'=1,2, \\dots, k$。\n"
- fmt: "\nAs per the theorem, $p = a[1]n[1]y[1] + a[2]n[2]y[2] + a[3]n[3]y[3] = 2\
    \ \\cdot 35 \\cdot 2 + 3 \\cdot 21 \\cdot 1 + 2 \\cdot 15 \\cdot 1 = 233$\n\n\
    Taking $233 \\mod(105) = 23$\n\n## 5.3 Matrix operations\n\n### 5.3.1 Strassen’s\
    \ matrix multiplication\n\nThe complexity of product of two matrix of order $(n\
    \ \\times n)$ by simple method is $O(n^3)$. Strassen designed a way to compute\
    \ product of two matrices with only 7 multiplication and 18 addition and subtractions.\n\
    \n```\n// // STARSON MATRIX MULTIPLICATION //\nX[n : n], Y[n : n] // each matrix\
    \ of order n Xn\nfor a: = 1 to n do\n    for c : = 1 to n do\n        Z[a][c]:\
    \ 0.0;\n        For b:=1 to n do\n            Z[a][c]: = Z[a][ c] + X[a][b] *Y[b][\
    \ c];\n    Return Z;\n```\n\nThe complexity of multiplication is simply given\
    \ by $T(n) = cn^3$ (complexity multiplication).\n\n### 5.3.2 Divide and conquer\
    \ for matrix multiplication\n\nWe have to perform multiplication of two matrices\
    \ of dimension $x \\times x$. Let us assume that $x$ is a power of 2, that is,\
    \ there exists a positive integer $k$ s. t. $x = 2^k$.\n\nIn case $x$ is not power\
    \ of two then enough rows and column of zero’s can be added to both the matrices,\
    \ so that resulting dimension are of power of 2.\n\nLet us assume that $X$ and\
    \ $Y$ be each divided into four submatrices, each sub matrix has dimension $x/2\
    \ \\times x/2$\n\n$\\begin{matrix} & \\begin{matrix} {\\begin{bmatrix} {X_{11}X_{12}}\
    \ \\\\ {X_{21}X_{22}} \\end{bmatrix}\\,\\,\\begin{bmatrix} {Y_{11}Y_{12}} \\\\\
    \ {Y_{21}Y_{22}} \\end{bmatrix}} & {\\{ 8/sub/matrices\\}} \\end{matrix} \\\\\
    \ & \\begin{bmatrix} {Y_{11}Y_{12}} \\\\ {Y_{21}Y_{22}} \\end{bmatrix} \\end{matrix}$\n\
    \nThen $\\begin{matrix} {Z_{11} = X_{11} \\ast Y_{11} + X_{12} \\ast Y_{21}} \\\
    \\ {Z_{12} = X_{11} \\ast Y_{12} + X_{12} \\ast Y_{22}} \\\\ {Z_{21} = X_{21}\
    \ \\ast Y_{11} + X_{22} \\ast Y_{21}} \\\\ {Z_{22} = X_{21} \\ast Y_{12} + X_{22}\
    \ \\ast Y_{22}} \\end{matrix}$\n\nIf $x > 2$, matrix $Z$’s elements can be computed\
    \ by multiplication and addition operations applied to matrices of size $x/2 \\\
    times x/2$. To perform matrix multiplication of two matrices 8 multiplications\
    \ and 4 additions of $x/2 \\times x/2$ matrices are performed.\n\n**Note:** The\
    \ complexity of addition of two matrices is given by $O(x^2)$.\n\nSince two matrices\
    \ of order $x/2 \\times x/2$ can be added in time $cx^2$, where $c$ is a constant,\
    \ and then earlier statement can be denoted by a relation $T(x)$, which is:\n\n\
    $T(x) = \\left\\lbrack \\begin{matrix} & {b,x \\leq 2} \\\\ {{8T}({x/2}) + \\\
    , cx^{2},x \\geq 2} \\end{matrix} \\right.$\n\nwhere, $b$ and $c$ are constant.\n\
    \nOn simplification we get\n\n$T(x) \\approx O(x^3)$\n\nThese is no improvement\
    \ over conventional multiplication method.\n\n### 5.3.3 Strassen’s multiplication\n\
    \nStranssen’s designed a way to compute product matrix $Z$ using only of 7 multiplications\
    \ and 18 additions and subtractions. This algorithm computes seven $x/2 \\times\
    \ x/2$ matrices $Z[1], Z[2], Z[3], Z[4], Z[5], Z[6],$ and $Z[7]$. These matrices\
    \ can be calculated by performing 7 multiplications and 10 matrix additions or\
    \ subtractions. Values of these seven matrices are as follows:\n\n$Z[1] = (X[11]\
    \ + X[22]) * (Y[11] + Y[22])$\n$Z[2] = (X[21] + X[22]) * (Y[11])$\n$Z[3] = X[11]\
    \ * (Y[12] - Y[22])$\n$Z[4] = X[22] * (Y[21] - Y[11])$\n$Z[5] = (X[11] + X[12])\
    \ * Y[22]$\n$Z[6] = (X[21] + X[22]) * Y[11]$\n$Z[7] = (X[12] - X[22]) * (Y[11]\
    \ + Y[22])$\n\nAnd\n\n$Z_{11} = Z_4 + Z_5 + Z_7$\n$Z_{12} = Z_3 + Z_5$\n$Z_{21}\
    \ = Z_2 + Z_4$\n$Z_{22} = Z_1 - Z_3 + Z_6$\n\nSo the recurrence relation is\n\n\
    $T(x) = \\left\\lbrack \\begin{matrix} & {b,x \\leq 2} \\\\ {{7T(x/2) + cx^{2},x\
    \ > 2}} \\end{matrix} \\right.$\n\n$T(1) = ax^{2}\\left( \\frac{7}{4} \\right)^{\\\
    log_{2}x} - ax^{2} + 7^{\\log_{2}x} = T(x) \\approx O(x^{2.81})$\n\nSo, a small\
    \ improvement has been observed.\n\n## 5.4 Pattern matching\n\nLet $Text[1:p]$\
    \ is a sequence of $p$ elements and $Pattern[1:q]$ is the pattern array where\
    \ $q \\leq p$. The elements of $Pattern$ and $Text$ are characters from the set\
    \ of alphabet $\\Sigma$. Set $\\Sigma$ is the set of all finite length strings\
    \ using character $z$ from $\\Sigma$. The pattern $Pattern$ exists with shift\
    \ $z$ in text $Text$ if $0 \\leq z \\leq (p–q)$ and $Text[z+1, z+q] = Pattern[1:q]$,\
    \ that is $Text[z+j] = Pattern[j]$ for $1 \\leq j \\leq q$. If pattern $Pattern$\
    \ exists with shift $z$ in array $Text$, then $z$ is called a valid shift otherwise\
    \ invalid. String matching problem is to find all valid shifts.\n\n![](graphic/converted/b_9783110693607-005_ingr_001.png)\n\
    \nThe pattern occurs only once at shift $z=3$ in the text.\n\n### 5.4.1 The Naive\
    \ algorithm\n\nThe worst case complexity of Naive algorithm is $O((p-q+1)m)$.\
    \ This bound is too tight (e.g., consider a text $a^p$ and a pattern $a^q$). If\
    \ the pattern is half the length of the text ($q=p/2$), then the worst-case running\
    \ time is $\\Omega(p^2)$. Because information gained about the text while trying\
    \ to match the pattern with shift $z$ is not utilized when one tries to match\
    \ the pattern with shift $z+1$, the naive algorithm is inefficient. Naive algorithm\
    \ identifies all valid shifts using a loop that ensures the condition $Pattern[1:q]\
    \ = Text[z+1: z+q]$ for all $(p-q+1)$ possible values of $z$.\n\n#### NAIVE-STRING–MATCHING–ALGORITHM\
    \ (Text, Pattern)\n\n```\n1. p: = length[Text]\n2. q: = length[Pattern]\n3. for\
    \ z: = 0 to (p-q)\n4.     if (Pattern[1:q] = Text[z+1: z+q])\n5.         print\
    \ \"Pattern occurs with shift z\"\n```\nThis procedure takes $O(p-q+1)$.\n\n###\
    \ 5.4.2 The Rabin–Karp algorithm\n\nThe Rabin–Karp algorithm is a randomized algorithm\
    \ for matching two strings. The idea is to compare hash values rather than strings.\
