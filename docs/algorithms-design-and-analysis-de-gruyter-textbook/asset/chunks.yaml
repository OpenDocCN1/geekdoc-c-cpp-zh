    ## 5.5 P 和 NP 类问题


    我们可以根据复杂度将所有决策问题分为两类：P 类和 NP 类。**P 类**问题是指可以通过确定性算法在多项式时间内解决的问题。这些也称为多项式问题。然而，某些问题无法在多项式时间内解决，例如哈密顿回路旅行商问题、背包问题和图着色问题。**NP
    类**问题是指可以通过非确定性多项式算法解决的问题。这类问题被称为非确定性多项式问题。所有的 P 类问题都是 NP 类问题，因此


    `P ⊆ NP`


    ### 5.5.1 归约（Reducibility）


    归约性是决策问题的一个属性。如果存在一个函数 `f` 将 `D[1]` 的实例 `s` 转换为 `D[2]`，使得：


    称问题 `D[1]` 多项式可归约到另一个决策问题 `D[2]`：


    1. 函数 `f` 将 `D[1]` 的所有是实例（yes instances）转换为 `D[2]` 的是实例，并将 `D[1]` 的所有否实例（no instances）转换为
    `D[2]` 的否实例。

    2. 函数 `f` 可以在多项式时间内计算。


    ### 5.5.2 NP 完全问题


    一个决策问题 `D` 被称为 **NP 完全**的，如果：


    1. 它属于 NP 类。

    2. NP 类中的每个问题都可以多项式可归约到 `D`。NP 类问题包含在多项式时间内可证明解决的决策问题。如前所述，P 类中的任何问题都在 NP 类中。


    ## 5.6 近似算法


    如果问题是 NP 完全的，我们可能无法找到在多项式时间内解决它的的方法。近似算法不保证获得最优解。近似算法的目标是在合理的时间（最多为多项式时间）内尽可能接近最优值。返回接近最优解的算法被称为近似算法。


    令 `i` 为某个优化问题的实例，该问题有大量可能的解，近似算法找到的解的代价为 `c(i)`，最优解的代价为 `c*()`。对于最小化问题，我们关注的是发现一个使表达式
    `c(i)` 值尽可能小的解。相反，对于最大化问题，表达式 `c(i)` 尽可能大。我们说近似算法满足以下条件：


    `max(c(i), c*(i)) ≤ p(n)`


    最小化和最大化问题符合此定义。注意 `p(n) ≥ 1`。如果近似算法生成的解是精确的，则 `p(n) = 1`。


    ### 5.6.1 相对误差


    近似算法的相对误差定义为（对于任何输入规模）：


    `c(i)/c*(i)`


    ### 5.6.2 TSP 近似算法


    最近邻算法（贪心方法）是解决旅行商问题（TSP）的近似算法，为了获得 TSP 的最优解，我们可以应用动态规划方法。考虑图 5.1 中的示例：


    ![](img/b_9783110693607-005_fig001.png)


    图 5.1：待求解 TSP 的图。


    最近邻方法从城市 `a` 开始，则 `a` 的最近邻是 `b`，`b` 的最近邻是 `c`，然后从 `c` 到 `d`，最后回到 `a`。


    `a-------b------c------d------a`


    哈密顿回路的路径长度为 10。但如果我们应用 DP，回路的长度将为 8。因此，该近似的精度比 `c(i)/c*(i))=10/8=1.25`。也就是说，路径
    `S[a]` 比最优路径 `S*` 长了 25%。


    ### 5.6.3 顶点覆盖问题


    顶点覆盖问题属于 NP 完全问题类。`G` 是一个无向图，`V` 为顶点集合，`E` 为边集合。`G` 的顶点覆盖 `V''` 是 `V` 的子集，如果 `(u,
    v)` 是图 `G` 的边，则 `u ∈ V''` 或 `v ∈ V''` 或两者都是。`V''` 中的顶点数量称为顶点覆盖的大小。该问题是发现最小的顶点覆盖。发现最优顶点覆盖可能不是容易的任务，但发现一个接近最优的顶点覆盖并不困难。


    #### APPROX-VERTEX-COVER (G)


    1. `V’: = Φ;`

    2. `E’: = E(G)`

    3. `While E’ not Φ do`

    4. `从集合 E’ 中取任意边(u, v)`

    5. `V’::= V’ ∪{u, v}`

    6. `从集合 E’ 中删除所有与 u 或 v 相连的边`

    7. `return V’.`


    **示例 5.3**：寻找图 5.2 给出图的近似顶点覆盖。


    ![](img/b_9783110693607-005_fig500.png) ![](img/b_9783110693607-005_fig501.png)


    图 5.3：图 5.2 给出图的近似顶点覆盖。最优覆盖见图 5.3。`c*={b, d, e}`，`size(c*)=3`。使用邻接表表示 `E` 时，上述算法的时间复杂度为
    `O(v+E)`。该算法给出的顶点覆盖最多是最优覆盖中顶点数量的两倍。


    ![](img/b_9783110693607-005_fig003.png)


    图 5.4：最优覆盖。


    **定理 5.6.4：APPROX-VERTEX-COVER 是多项式时间 2-近似算法。**


    **证明：** APPROX-VERTEX-COVER 在多项式时间内运行，证明 APPROX-VERTEX-COVER 返回的顶点覆盖是最优覆盖大小的两倍。


    令 `A` 是算法 APPROX-VERTEX-COVER 中选取的边集，为了覆盖 `A` 中的边，任何顶点覆盖（特别是最优覆盖 `C*`）必须包含 `A`
    中每条边的至少一个端点。`A` 中没有两条边共享端点，因为一旦选定了一条边，与其端点相连的所有其他边都会从 `E` 中删除，因此 `A` 中没有任意两条边被图
    `G` 的任何顶点 `C*` 覆盖。对于 `C*`，我们有下界：


    (i)`|C*| ≥ |A|`


    算法第 4 行的每次执行都会选取一条其两个端点均不在 `C` 中的边。集合 `A` 中包含一条边意味着集合 `C` 中包含两个顶点，因此我们有


    `C = {u, v}`


    `A = {(u,v)…}`


    (ii)`|C*| = 2|A|`


    结合方程 (i) 和 (ii)，我们得到：


    `|C*| = 2|A| ≤ 2|C*|` 证明 `|C*| ≤ 2|C*|`

