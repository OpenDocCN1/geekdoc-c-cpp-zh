  trans: "\n\n### 5. **节点高度**：通往后代叶子节点**最长**路径上的边数。\n\n### 6. **节点的黑高**：从节点本身到叶子节点路径上黑色节点（包括\
    \ `NIL`）的数量{不包括节点本身}。\n\n树的每个节点包含字段 `colour`、`key`、`left`、`right` 以及一个指针 `p`，该指针指示：如果一个节点的子节点或父节点不存在，则节点的指针字段包含值\
    \ `NIL`。\n\n在红黑树中，带有键键的节点被称为内部节点。\n\n**定理 6.1.1：具有 `n` 个内部节点的红黑树高度最多为 2 log2。**\n\
    \n**证明：** 为了证明该定理，我们首先证明以任意节点 `x` 为根的子树至少包含 `2^(bh(x))–1` 个内部节点。我们将通过对节点 `x` 的高度进行数学归纳法来证明这一点。如果节点\
    \ `x` 的高度为 0，则节点 `x` 必须是一个叶子节点，且以节点 `x` 为根的子树至少包含 `2^(bh(x))–1 {=2⁰–1=0}` 个内部节点。这意味着对于高度\
    \ 0，该陈题是有效的。\n\n现在考虑一个高度为正且具有两个子节点的内部节点 `x`。每个子节点的黑高为 `bh(x)` 或 `bh(x)–1`，取决于其颜色分别为红色或黑色。由于节点\
    \ `x` 子节点的高度小于节点 `x` 本身的高度，我们可以应用归纳假设，每个子节点至少包含 `2^(bh(x)–1)–1` 个内部节点。因此，以 `x`\
    \ 为根的子树至少包含 `(2^(bh(x)–1)–1)+(2^(bh(x)–1)–1)+1=2^(bh(x))–1` 个内部节点。因此，该陈题是有效的。\n\
    \n为了证明该定理，设 `h` 为树的高度，那么从根到叶子节点的任何路径上（包括根）至少有一半的节点是黑色的。因此，根的黑高至少为 `h/2`。所以：\n\n\
    `n ≥ 2^(h/2)–1`（`n` 是树中内部节点的数量）\n\n`n+1 ≥ 2^(h/2)`\n\n`log2 ≥ h/2`\n\n`h ≤ 2 log2`\
    \ **证明完毕**\n\n![](img/b_9783110693607-006_fig_001.png)\n\n图 6.1：红黑树。\n\n## 6.2\
    \ RBT 的操作\n\n本节讨论了 RBT 上的两种操作：节点的*插入*和*删除*。这些操作使用了 `left-rotate` 和 `right-rotate`。\n\
    \n### 6.2.1 旋转\n\n旋转是搜索树中的一种局限过程。假设我们需要围绕节点 `m` 进行旋转，且其右子节点 `n` 不为空。节点 `n` 将成为树的根。执行左旋转后，以\
    \ `m` 为根的树将成为 `n` 的左孩子，而 `n` 的左孩子将成为 `m` 的右孩子（参见图 6.2）。给出的以下算法用于左旋转。假设 `right[m]\
    \ ≠ nil`，且根节点 `parent` 为 nil。\n\n![](img/b_9783110693607-006_fig_002.png)\n\n\
    图 6.2：左旋转。\n\n**算法：**`Left-Rotate()`\n\n```\n {\n           n ←right[m];\n   \
    \        right[m] ← left[n];\n           Parent[left[n]] ←m;\n           parent[n]<-parent[m].\n\
    \           If Parent[m] = nil [Tree]\n                          Then root [Tree]\
    \ ← n;\n           else if m = left {Parent[m]}\n                          Then\
    \ Left Parent [m] ←n;\n           else right{Parent[m]} ←n;\n           left[n]\
    \ ←m;\n           Parent[m] ←m;\n}\n```\n\n左旋转和右旋转的时间复杂度均为 O(1)，因为只更改了指针。\n\n\
    ### 6.2.2 插入\n\n在 RBT 中插入新节点的时间复杂度为 O(log[n])。稍后将给出树中插入节点的算法。假设我们需要在树 `Tree` 中插入节点\
    \ `c`（其 `key[c] = v`，`left[c] = NIL` 且 `right[c] = NIL`）。使用 `RB-INSERT-FIXUP(Tree,\
    \ c)` 过程来重新染色并执行旋转。节点 `c` 作为参数传递给过程。\n\n**算法：**`RB-INSERT(Tree, c)`\n\n```\n {\n\
    \     b ← NIL;\n     a ← root [Tree];\n     while (a is not NIL)\n           \
    \    do b ← a;\n               if (key[c] < key[a])\n                    Then\
    \ a ← left[a].\n               else a ← right [a];\n     p [c] ←b;\n     if b\
    \ = Nil ;\n                    Then root[Tree] ← c;                     // 树为空\n\
    \               else if (key[c] < key[b])\n                    Then left[b] ←\
    \ c;\n          else right[b] ← c;\n     left[c] ← nil;     right[c] ← nil;\n\
    \    color[c] ←RED;\n    RB-INSERT-FIXUP (Tree, c);\n}\n```\n\n在此之后，如果发生颜色变化，后续的\
    \ `RB-COLOR-FIXUP(Tree,c)` 将修复它们：**算法：**`RB-COLOR-FIXUP (Tree,c)`\n\n```\n {\n\
    \           While color[parent[c]] = RED\n           do parent[c] = left[parent[c]]\
    \ // c 的父节点\n               Then b ← right[parent[c]]\n               if (color[b]\
    \ = RED)\n               Then color[parent[c]] ← BLACK \n               color[b]\
    \ ←BLACK\n               color[parent[c]] ← RED\n               c ← parent[parent[c]]\n\
    \           else if c = right[parent[c]]\n               Then c ← parent[c]\n\
    \               Left-Rotate (Tree, c)\n               color[parent[c]] ← BLACK\n\
    \               color[right[c]] ← RED\n               Right-Rotate (Tree, c])\n\
    \               else (与“right”和“left”句相同)\n           Color [root[Tree]] ← BLACK\n\
    }\n```\n\n**示例 6.1：**向空 RBT 插入值 42, 39, 32, 13, 20, 9。\n\n* (1) 插入 42 ![](img/b_9783110693607-006_ingr_001.png)\n\
    * (2) 插入 39 ![](img/b_9783110693607-006_ingr_002.png)\n* (3) 插入 32 ![](img/b_9783110693607-006_ingr_003.png)\n\
    * (4) 插入 13 ![](img/b_9783110693607-006_ingr_004.png)\n* (5) 插入 20 ![](img/b_9783110693607-006_ingr_005.png)\n\
    * (6) 插入 9 ![](img/b_9783110693607-006_ingr_006.png)\n\n最后一个是最终树。\n\n### 6.2.3\
    \ 删除\n\n与 n 节点 RB 树上的基本操作一样，删除节点的时间复杂度为 O(log n)。\n\n**算法：**`RB-DELETE(T, c)`\n\
    \n```\nIf left[c]=nil or right[c]=nil then\n    b←c;\nelse\n    b←tree-successor[c];\n\
    if left[b]≠nil then\n    a←left[b];\nelse\n    a←right[b];\nparent[a]=parent[b];\n\
    if parent[b]=nil then\n    root[tree] ←a;\nelse if b=left[parent[b]] then\n  \
    \  left[parent[b]] ←a;\n    else\n    right[parent[b]] ←a;\nif b≠c then\n    key[c]\
    \ ←key[b]; {将 b 的数据拷贝到 c}\nif color[b]=black then\n    RB-DELETE-FIXUP(Tree, a)\n\
    Return b;\n```\n\n调用 `RB-DELETE-FIXUP(Tree, a)` 仅当 `b` 为黑色时。如果 `b` 是红色，红黑属性仍然成立，则由于以下原因\
    \ `y` 被移除：\n\n1. 树中的黑高没有改变。\n2. 没有产生相邻红色节点，且由于红色的 `b` 不可能是根，因此根保持黑色。\n\n**RB-DELETE-FIXUP\
    \ (Tree, a)**\n\n```\nWhile a≠root[tree] and color[a]=black\n    if a=left[a]\
    \ then\n        w←right[a];\n        if color[w]=RED then\n            color[w]\
    \ ←BLACK;\n            color[parent[a]] ←RED;\n            Left-Rotate(Tree, a);\n\
    \            w←right[a];\n        if color[left[w]]=black and color[right[w]]=black\
    \ then\n            color[w] ←RED;\n            a←parent[a];\n        else\n \
    \           if color[left[w]]=red then\n                color[left[w]] ←BLACK;\n\
    \                color[w] ←RED;\n                Right-Rotate(Tree, w);\n    \
    \            w←right[a];\n            color[parent[a]] ←BLACK;\n            color[right[w]]\
    \ ←RED;\n            Left-Rotate(Tree, a);\nif color[root]=RED then\n    color[root]\
    \ ←BLACK;\n```\n\n## 6.3 B 树\n\nB 树是平衡搜索树的一种。B 树的概念由 Rudolf Bayer 和 Ed. McCreight\
    \ 提出。B 树的叶子节点处于同一层。内部节点的子节点数量可能会变化，但在固定范围内。例如，在 3–4 B 树中，一个内部节点可能只有 3 或 4 个孩子。由于子节点数量的灵活性，B\
    \ 树不需要频繁重新平衡。空间浪费是 B 树的缺点，因为节点并不一定是满的。以下是 B 树的属性：\n\n1. 每个节点 `a` 有三个字段：\n\n  \
    \  1. 节点 `a` 中当前存储的键的数量，即 `n[a]`。\n\n    2. 这些键按升序排列，即\n\n        `key[1][a] ≤\
    \ key[2][a] ≤ ... ≤ key[n][a]`\n\n"
- fmt: "\n3. If it is a leaf node then the field `Leaf[a]` is `TRUE` otherwise it\
    \ is `FALSE`.\n\n2. `n[a] + 1` pointers are also in each node. These pointer `{c[1][a],\
    \ c[2][a], … .c[n[a] + 1][a]}` points to child node of `a`. Since there is no\
    \ child node for leaf node, `c[i]` fields of leaf nodes are not defined.\n\n3.\
    \ The keys of node `a` `{key[i][a]}` split the ranges of keys saved in each sub\
    \ tree of node `a`. If `k[i]` is any key stored in the sub tree with root `c[i][a]`\
    \ then\n\n`k[*i*] ≤ *k**e**y*[1][*a*] ≤ *k*[2] ≤ *k**e**y*[2][*a*] ≤ … ≤ *k**e**y*[*n*[*a*]][*a*] ≤ *k**e**y*[*n*[*a*]+1]`\n\
    \n4. Each leaf node is at same depth like other leaf nodes and this is called\
    \ height (`(h)`) of the tree.\n\n5. Minimum and maximum number of keys stored\
    \ in a node is bounded. A fixed integer `t  ≥ 2` is used to express these bounds.\
    \ This is called the **maximum degree** of B-tree.\n\n    1. Lower bound on the\
    \ keys a node (other than root node) is **(t–1) keys**. Each nonleaf node except\
    \ root thus has a minimum of `t` child nodes. In case of nonempty tree, the root\
    \ must have no less than one key.\n\n    2. Upper bound on the keys a node is\
    \ **(2 t–1) keys**. So a nonleaf node can have maximum `2 t` child nodes. If a\
    \ node contains exactly `(2 t–1)` keys then the node is said to be full.\n\nThe\
    \ following figure Figure 6.3 shows the B-tree of height 2. All the nodes contain\
    \ 1,000 keys.\n\n![](graphic/converted/b_9783110693607-006_fig_003.png)\n\nFigure\
    \ 6.3: B-tree of height 2.\n\n### 6.3.1 Searching key `k` in B-tree\n\nB-Tree-Search\
    \ procedure computes the smallest `i` such that the `ith` key is more than or\
    \ equal to `a`. If the `i^(th)` key is equal to `a`, then the search is done,\
    \ otherwise set `z` to the `ith` child.\n\n**Algorithm:** `B-Tree-Search (z, a)`\n\
    \n```\n {\n           x = 1;\n           while (x ≤ n[z] and a > keyx[z])\n  \
    \                     do x = x + 1;\n           if (x ≤ n[z] and a = keyx[z])\n\
    \                       then return (z, x);\n           if (leaf[z] = TRUE)\n\
    \                       then return NIL;\n           else Disk-Read(cx[z]);\n\
    \                       return B-Tree-Serach (cx[z], a);\n}\n```\n\n**Example\
    \ 6.2:** Search the key `k  = 11` in the following B-tree given in figure 6.4.\n\
    \n![](graphic/converted/b_9783110693607-006_fig_004.png)\n\nFigure 6.4: B-tree.\n\
    \n**Solution:** `n[x] = 3`, `key[1] = 5`, `key[2] = 9`, `key[3] = 14`, and `k\
    \  = 11`.\n\nFor `i  = 1`,\n\nWhile `(i ≤ n[x] and k > key[i][x])`\n\nThat is,\
    \ `1 ≤ 3` and `11 > key[1][x]` `{TRUE}`\n\nSo `i  = i + 1`, that is, `i  = 2`.\n\
    \nAgain, `2 ≤ 3` and `11 > key[2][x]` `{TRUE}`\n\nSo, `i  = i + 1`, that is, `i\
    \  = 3`.\n\nNow `3 ≤ 3` and `11 > key[3][x]` `{FALSE}`\n\nSince condition for\
    \ while loop is not correct, checking will be performed at the left of `14`. Hence\
    \ `Disk-Read(c[i][x])`, that is,. `Disk-Read(c[3][x])` and return `B-Tree-Search(C[3][x],\
    \ k)`.\n\nFor `C[3][x]`, we have `n[x] = 3`.\n\nAgain for `i  = 1`,\n\nWhile `(1 ≤ 3\
    \ and 11 > key[1][x])` `{TRUE}`\n\nSo `i  = i + 1`, that is, `i  = 2`.\n\nAgain,\
    \ `2 ≤ 3` and `11 > key[2][x]` `{TRUE}`\n\nSo, `i  = i + 1`, that is, `i  = 3`.\n\
    \nNow `3 ≤ 3` and `11 > key[3][x]` `{FALSE}`\n\nSince condition for while loop\
    \ is not correct, checking will be performed at the left of `14`. Hence `Disk-Read(c[i][x])`,\
    \ that is. `Disk-Read(c[3][x])` and return `B-Tree-Search(C[3][x], k)`.\n\n**Theorem\
    \ 6.3.2:** If `n>=1` then any `n` B tree of height `h` and minimum degree `t>=2`\
    \ `h ≤ log_{t}((n + 1)/2)`\n\n**Proof:** If a B tree has height `h`, the root\
    \ contains at least one key and all other nodes contain at least `(t–1)` keys,\
    \ thus there are at least `2` nodes at depth `1`, at least `2t` nodes at depth\
    \ `2`, at least `2t²` nodes at depth `3`, and so on at depth `h` are at least\
    \ `2t^(h–1)` nodes.\nThen $n \\geq 1 + (t - 1)\\sum_{i = 1}^{h}2t^{i - 1} = 1\
    \ + (t - 1)\\frac{2(t^h-1)}{t-1} = 1 + 2(t^h-1) = 2t^h-1$.\n$2t^h-1 \\leq n$,\
    \ $2t^h \\leq n+1$, $h \\leq \\log_{t}(n+1)$.\n\n## 6.4 Binomial heap\n\nIt is\
    \ a data structure similar to binary heap it also supports merge operation of\
    \ two heaps. Binomial heap is a set of binomial trees. A binomial tree is a recursively\
    \ defined tree:\n\n1. The binomial tree of order `0` has only one node.\n2. Binomial\
    \ tree of order greater than `1` (i.e., `k>=1`), the binomial tree of order `k`\
    \ (`B[k]`) is formed by linking two binomial trees of order `k–1` (`B[k–1]`).\
    \ The root of one tree is the leftmost child of the root of the other (see figure\
    \ 6.5).\n\n![](graphic/converted/b_9783110693607-006_fig_005.png)\n\nFigure 6.5:\
    \ Binomial tree.\n\nFollowing are features of binomial tree:\n\n1. There are `2^k`\
    \ nodes in the tree and `k` is height of tree.\n2. There are just `^k[i]` nodes\
    \ at depth `i`, where `i=0, 1, 2 … k`.\n3. Degree of the root node is `k` which\
    \ is more than degree of any other node; besides this the children of the root\
    \ are binomial tree with order `k–1, k–2, … … .0` from left to right.\n\n**Proof:**\
    \ We proof it by induction method on `k`.\nFor `k=0`, each property holds for\
    \ binomial tree of order 0.\n\n**Inductive Step:** Let us assume that it holds\
    \ for `k–1` order tree.\n\n1. Two trees of degree `k–1` are linked to form tree\
    \ with degree `k` and number of nodes in `B[k1]` is `2^(k–1)`, so the tree with\
    \ degree `k` has `2^(k–1) + 2^(k–1) = 2^k` nodes.\n2. The height of `B[k]` is\
    \ one greater than the height of `B[k–1]`. So, `(k–1) + 1 = k`.\n3. Let number\
    \ of nodes at depth `i` is `N(k, i)` of tree `B[k]`. Since number of nodes at\
    \ depth `i` in `B[k]` is the number of nodes at depth `i` in `B[k–1]` plus number\
    \ of nodes at depth `i–1` in `B[k–1]`.\n\n$\\begin{matrix} & {N\\left( {k,i} \\\
    right)\\){= N}\\left( {k - 1,i} \\right) + \\, N\\left( {k - 1,i - 1} \\right)\\\
    ,} \\\\ & {\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\, =^{\\mspace{180mu}\
    \ k - 1}C_{i} +^{k - 1}C_{i - 1} =^{k}C_{i}} \\end{matrix}$\n\n4. Root of `B[k]`\
    \ is the only node that has greater degree than `B[k–1]`. It has one extra child\
    \ than in `B[k–1]`. Degree of root in `B[k–1]` is degree `k–1` that of `B[k]`\
    \ is `k`. By inductive hypothesis, the children of the root of `B[k–1]` are roots\
    \ of `B[k–2], B[k–3], … B[0]` is linked to `B[k–1]`, therefore, the children of\
    \ the resulting root are roots of `B[k–1], B[k–2], … B[0]`.\n\n### 6.4.1 Binomial\
    \ tree\n\nA binomial heap is a sequence of binomial trees that satisfies the min-heap\
    \ property:\n\n1. Each tree is min-heap.\n2. For any non-negative order `k` there\
    \ exists at most one tree whose root has degree `k`.\n3. Height is less than or\
    \ equal to `log[2]n`.\n\nEach node of binomial heap contains:\n\n1. A **key**\n\
    2. A **degree** for the number of children\n3. A pointer **child**, that points\
    \ to leftmost child\n4. A pointer **sib**, that points to right sibling\n5. Pointer\
    \ **p**, that points to the parent\n\nBin heap has a root list. A field `head[H]`\
    \ is used to access the binomial heap. This pointer points to the initial root\
    \ of the root list. If `head[H] = nil`, it means `H` has no element.\n\n#### 6.4.1.1\
    \ Creating binomial heap\n\nMAKE-BINOMIAL-HEAP procedure allocate and return an\
    \ object `H`, where `Head[H] = NIL`. The running time is O(1).\n\n#### 6.4.1.2\
    \ Finding minimum key\n\nAim of this procedure is to find the node with minimum\
    \ key in an `n` node binomial heap. There is no key with value ∞. Since a binomial\
    \ heap is min-heap ordered, a minimum key must reside in the root node. The `Binomial-Heap-Min()`\
    \ procedure check all roots which are at most upper bound of `(log n)+1`, so its\
    \ running time is O(log[2]n).\n\n**Algorithm:** `Binomial-Heap-Min (H)`\n\n```\n\
    \ {\n  b←NIL;\n  a←head[H];\n  min←∞;\n  while (a is not NIL)\n   do if (key[a] < min)\n\
        then min←key[a];\n     b←a;\n    a←sib[a];\n  return b (min);\n}\n```\n\n\
    #### 6.4.1.3 Union of two heaps\n\nThe procedure for union repeatedly links binomial\
    \ tree whose roots have same degrees. Let the two trees be rooted at `b` and `c`.\
    \ Node `c` will become the root of the final tree.\n\n**Algorithm:** `Binomial-Link\
    \ (b, c)`\n\n```\n {\n  p[b]←c;\n  sib[b]←child[c];\n  child[c]←b;\n  degree[c]←degree[c] + 1;\n\
    }\n```\n"
  raw: "    3.  If it is a leaf node then the field Leaf[a] is TRUE otherwise it is\
