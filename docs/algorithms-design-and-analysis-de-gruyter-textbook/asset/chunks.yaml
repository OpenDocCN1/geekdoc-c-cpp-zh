    ### 3.3.3 链乘法


    链乘法问题在编译器设计和数据库领域非常重要，因为我们需要代码优化和查询优化。问题描述如下：


    给定 $\{A[1], A[2] \dots A[n]\}$，矩阵 $A[i]$ 的维度为 $p[i-1] \times p[i]$，我们需要执行矩阵乘法并对乘积
    $A[1] \times A[2] \dots A[n]$ 进行加括号，使得标量乘法的次数最少。


    由于矩阵乘法满足结合律但不满足交换律，我们必须遵循上述矩阵顺序进行乘法，但可以自由地对上述乘法进行加括号。两个矩阵可以相乘的条件是第一个矩阵的列数等于第二个矩阵的行数。


    $C[i][j] = \sum_{k = 1}^{q} A[i][k]$


    $n$ 个矩阵序列中的括号数量由 $p(n)$ 给出。那么：


    $p(n) = 1$ 对于 $n=1$


    假设在第 $m$ 个和第 $m+1$ 个矩阵之间插入划分，因此对于任意 $m = 1$ 到 $n-1$，递归关系为：


    $p(n) = \left\{ \begin{matrix} 1, & \text{若 } n = 1 \\ \sum_{m = 1}^{n - 1}p(m).p(n
    - m) & \text{若 } n \geq 2 \end{matrix} \right.$


    令 $A[i \dots j]$ 表示 $A[i], A[i+1] \dots A[j]$ 的乘积，$i \leq j$。如果问题是非平凡的，$i > k$，则乘积
    $A[i], 2 \dots A[j]$ 的任何加括号方式必须在 $A[k]$ 和 $A[k+1]$ 之间划分，其中 $i < k < j$。对于 $k$
    的某个值，我们首先计算 $A[i \dots k]$ 和 $A[k+1 \dots j]$，然后合并结果得到最终积 $A[i \dots j]$。因此，该过程的代价是计算
    $A[i \dots k]$ 和 $A[k+1 \dots j]$ 的代价加上这两个矩阵相乘的代价。为了计算矩阵 $A[i \dots j]$，假设进行了最少
    $N[i, j]$ 次标量乘法。N[i, j]$ 定义为：


    $N[i, j] = N[i, k] + N[k+1, j] + p[i-1]xp[k]xp[j]$，其中 $i \leq k < j$。显然，$N[i,
    i] = 0$。


    $A[i]$ 的阶数为 $P[i-1] \times P[i]$，所以 $A[i \dots j]$ 的阶数为 $P[i-1] \times P[j]$。


