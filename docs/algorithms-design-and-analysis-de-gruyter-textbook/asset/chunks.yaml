    is limited above and below by some positive constant multiple of `g(n)` for large
    value of `n`, i.e there exist positive constants `c[1]` and `c[2]` and some nonnegative
    whole number `n[0]` (allude [Figure 1.5](#bodymatter-001.xhtml_b_9783110693607-001_fig_005))
