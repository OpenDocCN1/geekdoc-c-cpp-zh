    }\n```\n\n松弛的过程基本上是检查通过 `p` 找到目前的最短路径 `q` 是否可以改进，如果是，则更新 `D[q]` 和 `π[q]`。\n\n\
    **算法：** `Relax (p, q, w)`\n\n```\n {\n    if (D[q] > D[p]+ w[p,q])\n         \
    \    Then D[q]: = D[p]+ w[p,q];\n             π [q]: = p;\n}\n```\n\n**示例 4.8：**\n\
