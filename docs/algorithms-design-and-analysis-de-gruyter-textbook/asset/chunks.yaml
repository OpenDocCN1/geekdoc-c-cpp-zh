    in total. In worst case, the average case or amortized cost per operation is T(n)/n.


    ### 3.5.2 The potential method


    The potential method stands for prepaid efforts as potential that can be released
    to pay for future operations. Assume that DS[0] is the starting data structure
    on which n operations are carried out and the result of applying the i^(th) operation
    is the data structure DS[i] and c[i] be the actual cost of the ith operation.
    A potential function maps each DS[i] to a real number ϕ(DS[i]) which is the potential
    related with that data structure.


    The amortized cost *c*[*i*]^(\^) of i[th] operation can be defined as,


    $\begin{matrix} & {c_{i}^{\text{\textbackslash\textasciicircum}} = \, c_{i}\,
    + \,{\Delta\phi_{i}}} \\ & {\Delta\phi_{i}\, = \,\phi\,{(DS_{i}})\, - \,\phi(DS_{i
    - 1})} \end{matrix}$


    So the amortized cost of each operation is sum of actual cost and the increase
    in potential. The total amortized cost will be (for n operations),


    $\begin{matrix} & {\sum\limits_{i = 1}^{n}c_{i}^{\text{\textbackslash\textasciicircum}}
    = \sum\limits_{i = 1}^{n}{(c}_{i}^{} + \phi(DS_{i}) - \phi(DS_{i - 1}))} \\ &
    {\mspace{4460mu} = \sum\limits_{i = 1}^{n}c_{i}^{} + \phi(DS_{n}) - \phi(DS_{0}))}
    \\ & {if\,\phi(DS_{n}) \geq \phi(DS_{0}{)\ Then\,,total\, amortized}} \\ & {{cost}\sum\limits_{i
    = 1}^{n}c_{i}^{\text{\textbackslash\textasciicircum}}{\,{is\, an\, upper\, bound\,
    on\, the\, total\, actual\, cost}}\sum\limits_{i = 1}^{n}c_{i}^{}} \end{matrix}$


    If  *ϕ*(*D**S*[*i*]) − *ϕ*(*D**S*[*i* − 1]) > 0, then the amortized cost *c*[*i*]^(\^)
    represents an overcharge to the ith operation and the potential of data structure
    increases. If potential difference is negative then the amortized cost Ĉ[i]* represents
    an undercharge of the ith operation and actual cost of the operation is paid by
    the decrease in the potential.


    **Example 3.7:** There are three stack operations, PUSH, POP, and MULTIPOP. PUSH
    simply places an element on the top of the stack and POP operation deletes an
    element from the stack. MULTIPOP operation deleted multiple elements at once.
    Define a potential function ϕ on the stack to be the number object in the stack.
    For empty stack


    $\begin{matrix} & {\phi(DS_{o}) = 0\quad\quad\quad\quad\quad\quad\phi(DS_{i})
    \geq 0\,{The\,\, number\,\, of\,\, object\,\, in\,\, stock\,\, is\,\, never\,\,
    negative}.} \\ & {{Since}\,\phi(DS_{o}) = 0} \\ & {\Rightarrow\phi(DS_{i}) \geq
    \phi(DS_{o})} \end{matrix}$


    Thus, the total amortized cost of n operation with respect to ϕ represents upper
    bound on the actual cost. If the ith operation on the stack is PUSH, while stack
    contains p objects then the potential difference will be,


    *ϕ*(*D**S*[*i*]) − *ϕ*(*D**S*[*i* − 1])) = *p* + 1 − *p* = 1


    The amortized cost of PUSH operation is


    $\begin{matrix} & {c_{i}^{\!\!\text{\textbackslash\textasciicircum}}{= c}_{i}^{}
    + \phi(DS_{i}) - \phi(DS_{i - 1})} \\ & {c_{i}^{\!\!\text{\textbackslash\textasciicircum}}
    = 1 + 1 = 2{,2} \in O{(1)}} \end{matrix}$


    Suppose the i^(th) operation is MULTIPOP(p, k) and *k*^′ = *m**i**n*(*p*, *k*)
    objects are popped off the stack. The actual cost of the operation is *k*^′potential
    difference,


    *ϕ*(*D**S*[*i*]) − *ϕ*(*D**S*[*i* − 1]) = −*k*^′


    Thus the amortized cost of MULTIPOP,


    $\begin{array}{l} {{\hat{\text{c}}}_{\text{i}}^{} = \text{c}_{\text{i}} + \phi(\text{DS}_{\text{i}})
    - \phi(\text{DS}_{\text{i} - 1})} \\ {{\hat{\text{c}}}_{\text{i}}^{} = \text{k}''
    - \text{k}'' = 0} \end{array}$


    Similarly, the amortized cost of an ordinary POP operation is 0\. The amortized
    cost of each operation is O(1). So total amortized cost of n operations will be
    O(n).


    ## 3.6 Order statistics


    Order set Š: The set in which elements are arranged in ascending order,


    *š* = {2, 3, 4, 5, 6}


    Let Š be an ordered set containing n elements, if n is odd, then (n + 1) is even.


    Then, median is given by $\left\lceil {(\frac{n + 1}{2})} \right\rceil$


    Again, if n is even, then median are given by *n*/2 and *n*/2 + 1,


    ${or}\,\left\lfloor {\frac{n + 1}{2})} \right\rfloor\,{and}\,\left\lceil {- \frac{n
    + 1}{2})} \right\rceil$


    Lower median Upper median


    *l**e**t* *š*={18, 13, 12, 14, 10}*o**r**d**e**r* *s**e**t* *š*={10, 12, 13, 14, 18}, *n* = 5${median
    =}\,\lceil\frac{n + 1}{2})\rceil\, = \,\lceil\frac{5 + 1}{2})\rceil\, = \,\lceil
    3\rceil\, = \, 3$*A**g**a**i**n*, *i**f* *š*={1, 2, 3, 4, 5, 6}*n* = 6${Median}\,{are}\,\left\lfloor
    {\frac{n + 1}{2})} \right\rfloor\, = \left\lceil 3.5 \right\rceil = 3,{and}\left\lceil
    {\frac{n + 1}{2})} \right\rceil = \left\lceil 3.5 \right\rceil = 4$


    **i^(th) order statistics**


    If Š is an ordered set containing n elements, then ith order statistics for Š
    is the ith smallest element of S.


    If i = 1, the ith order statistics gives smallest element of the set and for i = n,
    we get max element of the set.


    **Algorithm:** *Median (S)*


    { // S is an ordered set containing “n” elements,


    Set n: = length (S);


    $\begin{matrix} & {{if}\,{((n/2) =}\,{= 0)}\,{hen}} \\ & {{i:}\, = \,\left\lfloor
    {\frac{n + 1}{2})} \right\rfloor,\,\,\,\,\,\,\,\,\,\,\,\, j:=\left\lceil {\frac{n
    + 1}{2})} \right\rceil;} \\ & {{returni,}\,{j;}} \\ & {else} \\ & {{k:}\, = \left\lceil
    {\frac{n + 1}{2})} \right\rceil;} \\ & {{return}\,{k;}} \end{matrix}$


    }


    This algorithm completes in a constant time because every steps takes a constant
    amount of time (O(1)). So, the complexity will be θ(1).


    **Algorithm:** *Selection (i)*


    { *// Selection of i^(th) smallest element of set S, first changing S into order
    set.*


    S: = sort (S);


    p := s[i]


    return p; // p is the i^(th) smallest element of set Š.


    The complexity of this algorithm is based on the complexity of the sorting algorithm
    if sorting algorithm is heap sort or merge sort. The complexity of algorithm is
    0(nlog[2]n).


    **Algorithm:** *Min(S)*


    { // *finding the minimum element of a given set S containing p element.*


    minimum : = s[1] // setting first element as min element


    *for* j:= 2 to p do


    {


    if(minimum>s[j]) Then


    minimum: = s[j];


    }


    Return (minimum);


    }


    The complexity of this algorithm depends on the basic operation comparisons, total
    comparison are (n–1) so complexity is θ(n).


