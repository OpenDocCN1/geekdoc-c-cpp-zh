    \ MST of Example 4.3 using Prim’s Algorithm.\n\n## 4.4 Shortest path algorithm\n\
    \nThis section includes algorithms to find shortest paths between all pair of\
    \ vertices and from one source to all other vertices in a graph.\n\n### 4.4.1 Warhsall’s\
    \ algorithm\n\nWarshall’s algorithm finds matrices M[0],M[1],M[2] … … M[n], where\
    \ for each in the (r,s)th entry M[m](r,s) of M[m] is the least length of a path\
    \ from vertex r to vertex s where all intermediate vertices if any lie in { 1,2,\
    \ … .,m}, again M[n] is the desired matrix and this time we may find the entries\
    \ of M[m] for m > 0 by recursive equation\n\n*M*[*m*](*r*, *s*) = *m**i**n*{*M*[*m* − 1](*r*, *s*), *M*[*m* − 1](*r*, *m*) + *M*[*m* − 1](*m*, *s*)}\n\
    \n**Algorithm:** *Warshall ()*\n\n {\n\n  For p = 1 to |V| do\n\n  M[p, p]: =\
