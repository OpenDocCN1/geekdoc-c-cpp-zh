    ## 1.6 Recurrence relation


    Consider a sequence S = {s[0], s[1], s[2 … … … … .]up to infinite}, a *recurrence
    relation* for S is an equation in which the general term s[n] can be defined in
    terms of its previous terms s[0], s[1] … s[n–1]. In Mathematics, a *recurrence
    relation* is a condition that recursively characterizes a succession. Each term
    of the grouping is characterized as a component of the former terms.


    **Example 1.5:**


    *   (a) s[n]–cs[n–1] + ds[n–2] = 3.2^n (in homogenous linear recurrence relation
    with constant coefficient),


    *   (b) s[n] = c a(n/d) + f(n) (recurrence relation in divide and conquer (DAC)
    form),


    *   (c) s[n]²–c s[n–1] + d s[n–2] = 3.2^n (nonlinear relation),


    *   (d) F[n] = F[n–1] + F[n–2] (Fibonacci relation).Solving a recurrence relation
    means to identify the sequence for which the recurrence relation exists.


    ### 1.6.1 Linear recurrence relation


    A recurrence relation in form


    (1.1)*a*[*n*] + *b*[1]*a*[*n* − 1] + *b*[2]*a*[*n* − 2] + − − − − − − − + *b*[*k*]*a*[*n* − *k*] = *f*(*n*),  *n* ≥ *k*


    where b[1], b[2], … …b[k] are all constants and f(n) is some function of n, known
    as linear recurrence relation with constant coefficient. If f(n) = 0, then the
    relation is identified as homogenous recurrence relation, otherwise nonhomogeneous
    recurrences relation. The degree of recurrence relation (1.1) is k, a[n] is (n + 1)th
    term of the sequence.


    ### 1.6.2 Solution of homogeneous recurrence relation


    **(a) Characteristic equation method**


    The characteristic equation method is developed from the generating function method.
    For sequence {*a*[*n*]}[ 0]^(   ∞), the generating function is A(x), then we have


    $A(x)\ = \sum\limits_{n = 0}^{n = \infty}a_{n}x^{n}$


    Further, for a given recurrence relation, we can express A(x) as


    A(x) = N(x)/D(x).


    This D(x) is an important expression, for recurrence relation


    *a*[*n*] + *b*[1]*a*[*n* − 1] + *b*[2]*a*[*n* − 2] + ⋅ ⋅ ⋅ ⋅ ⋅ ⋅ ⋅ + *b*[*k*]*a*[*n* − *k*] = 0 


    *D*(*x*) *w**i**l**l* *b**e* (1 + *b*[1]*x*+*b*[2]*x*² + ⋅ ⋅ ⋅ ⋅ ⋅ ⋅ ⋅+ *b*[*k*]*x*^(*k*))


    Then characteristic polynomial will be


    *C*(*t*)  = *t*^(*k*).{*D*(1/*t*)}


    The characteristic equation will be C (t) = 0.


    That is,


    t^k + b[1] t^(k–1 +) b[2] t^(k–2) + … … .. + b[k] = 0


    There two cases will arise:


    (1) *When the roots are all distinct*


    Let the roots be α[1], α[2], α[3], … .., α[k], then solution of recurrence relation
    will be


    a[n] = A[1]*α*[1]^n+A[2]*α*[2]^n+A[3]*α*[3]^n + ....... + A[n]*α*[k]^n'
