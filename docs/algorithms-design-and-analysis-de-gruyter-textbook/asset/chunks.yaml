  trans: "\n确定性算法是指在给定相同输入时始终以相似方式运行的算法；输入完全决定了算法执行计算的序列。随机化算法将其相对于输入的行为以及对少数任意决策的考虑相结合（见图\
    \ 5.5）。对于在许多情况下给定的相同输入，等价的随机化算法在每次调用中可能会执行不同的计算。这意味着，除了其他变化外，随机化算法在给定输入上的运行时间在此时并不是固定的，但它本身是一个随机变量。在我们研究随机化算法时，通常关注最悲观的情况：最坏情况运行时间。\n\
    \n![](img/b_9783110693607-005_fig_004.png)\n\n图 5.5：确定性算法与随机化算法。\n\n### 5.7.1\
    \ 螺母与螺丝问题\n\n假设我们有 `n` 个不同尺寸的螺母和 `n` 个螺丝。每个螺母只匹配一个螺丝，反亦然。螺母和螺丝的大小几乎相等。我们希望找到哪个螺母匹配特定的螺丝。在最坏情况下，需要\
    \ `(n–1)` 次测试，而在平均情况下，需要执行 `(n/2)` 次测试。\n\n设在 `n` 个螺母中找到某个特定螺丝匹配项的比较次数为 `T(n)`。显然，当我们只有一个\
    \ 1 个螺母时，比较次数将为 0；在有 2 个螺母的情况下，比较次数将为 1。如果螺母数量大于 2，那么 `T(n)` 的值在 1 到 `(n–1)` 之间。因此，`T(n)`\
    \ 的期望值为：\n\n$E\\left\\{ {T(n)} \\right\\}\\, = \\sum\\limits_{k = 1}^{n - 1}{k.P_{r}\\\
    left\\lbrack {T(n) = k} \\right\\rbrack}.$\n\n随机化算法的类型：\n\n1. LAS VEGAS（拉斯维）：总是返回正确结果的随机化算法，但运行时间在每次执行之间可能会变化。例如：随机排序。\n\
    \n2. MONTE CARLO（蒙特卡洛）：在多项式时间内终止，但可能产生错误结果的随机化算法。例如：随机最小切算法。\n\n## 5.8 计算几何\n\n\
    计算几何是计算机科学的一个分支，用于研究可以用几何形式表示的算法。通过对计算几何算法的研究，出现了一些纯几何领域的问题，这些问题被额外视为计算几何的一个主要方面。计算几何作为一种控制手段的发展的主要催化剂是计算机图形以及计算机辅助设计与制造的进步，但计算几何中的许多问题在本质上是老式的，可能源于数值值感知。\n\
    \n计算几何的其他重要应用包括机器人学、地理数据框架（几何区域和搜索、路径规划）、集成电路设计（IC 几何结构和验证）以及计算机辅助设计。\n\n## 5.9\
    \ 凸包\n\n点集 `Q` 的凸包是最小的凸多边形 `P`，使得 `Q` 中的每个点要么在 `P` 的边界上，要么在其内部（见图 5.6）。`Q` 的凸包表示为\
    \ `CH(Q)`。\n\n`Q={p[0], p[1], p[2],………p[12]}`![](img/b_9783110693607-005_fig_005.png)\n\
    \n图 5.6：凸包。\n\n自然地，我们假设 `Q` 中的每个点都是从板板上伸出的钉子。凸包就是由包绕所有钉子的轻质橡皮筋形成的形状。\n\nGRAHAM-SCAN(Q)\n\
    \n1. 令 `P[0]` 为 `Q` 中 `y` 坐标值最小的点，或者在相等的情况下取最左边的点。\n2. 令 `{P[1], P[2], … … P[m]}`\
    \ 为 `Q` 中剩余的点，按极角绕绕 `P[0]` 逆时针方向排序。（如果多个点具有相同的角度，则删除所有非距离 `P[0]` 最远的点。）\n3. `PUSH(P[0],\
    \ S)`\n4. `PUSH(P[1], S)`\n5. `PUSH(P[2], S)`\n6. `for i = 3 to m`\n7. `do while\
    \ 栈顶相邻点 (S')、栈顶 (S') 和 P[i] 形成的角度不构成左转。`\n8. `POP(S)`\n   a. `PUSH(P[i], S)`\n\
    9. `Return S`\n\n![](img/b_9783110693607-005_fig_006.png)\n\n图 5.7：逆时针与顺时针转向。\n\
    \n### 5.9.1 逆时针与顺时针\n\n![](img/b_9783110693607-005_fig_007.png)\n\n图 5.8：直线相交的条件。\n\
    \n`P[0] = (x[0], y[0]), P[1] = (x[1], y[1]), P[2] = (x[2], y[2])`\n`P[1] - P[0]\
    \ = (x[1] - x[0], y[1] - y[0])`\n`P[2] - P[0] = (x[2] - x[0], y[2] - y[0])`\n\
    `(x[1] - x[0])*(y[2] - y[0])`\n`[x[1] - x[0]]*(y[2] - y[0]) - [y[1] - y[0]]*(x[2]\
    \ - x[0])`\n如果结果大于 0，则为逆时针；小于 0，则为顺时针；等于 0，则共线。\n\n5.9.2 线段相交的条件\n\n两条线段相交的条件如下：\n\
    1. 一个线段的端点位于另一条线段的两侧。\n2. 另一个线段的端点也位于第一条线段的两侧。\n\n"
