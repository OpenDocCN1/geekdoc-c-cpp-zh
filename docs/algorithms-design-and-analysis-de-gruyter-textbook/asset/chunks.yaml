    \n### 3.1.2 Fractional knapsack problem\n\nWe have to place n objects in a given\
    \ knapsack. The knapsack capacity is W. Weight of the ith object is w[i], if a\
    \ fraction x[i] (0 ≤ x[i] ≤ 1) of ith item is chosen to fill the knapsack then\
    \ the profit earned is v[i]x[i], where v[i] is the value earned by placing ith\
    \ item. The aim is to fill up the knapsack so that the profit will be maximum.\
    \ Then linear programming problem (LPP) for above problem will be,\n\n$\\begin{matrix}\
    \ & {{z =}\\sum\\limits_{i = 1}^{n}{v_{i}x_{i}}} \\\\ & {{such\\, that}\\,\\,\\\
    sum\\limits_{i = 1}^{n}{w_{i}x_{i}} \\leq W} \\\\ & {{and\\,}0 \\leq x_{i} \\\
    leq 1,\\ 1 \\leq i \\leq n} \\end{matrix}$\n\n**Algorithm:** *Greedy-Knapsack(W,\
    \ n)*\n\n*// v [1: n] is the value array, w [1: n] is the weight array and x[1:n]\
    \ contains the fractional value of objects placed in knapsack. The objects are\
    \ sorted in increasing order s. t.*\n\n$\\frac{v\\lbrack i\\rbrack}{w\\lbrack\
    \ i\\rbrack} \\geq \\frac{v\\lbrack i + 1\\rbrack}{w\\lbrack i + 1\\rbrack}$\n\
    \n```\n {\n     for k : = 1 to n do\n                   x[k]: = 0.0;\n     U:\
    \ = W;\n     for k: = 1 to n do\n                   {\n                      \
    \     if (w[k] > U) Then break;\n                           x[k]:=1.0; U: = U-w[k];\n\
    \                   }\n     if(k ≤ n) Then x[k]: = U/w[k];\n}\n```\n\nThe time\
    \ complexity of the algorithm is O(n).\n\n**Example 3.2:** Solving the given fractional\
    \ knapsack problem with greedy approach (see table 3.1). Capacity of knapsack\
    \ W = 16, Number of items is 4, the value and weights are given in the table.\n\
    \nArranging items in order $\\frac{v\\lbrack i\\rbrack}{w\\lbrack i\\rbrack} \\\
    geq \\frac{v\\lbrack i + 1\\rbrack}{w\\lbrack i + 1\\rbrack}$ (see table 3.2)\n\
    \nTable 3.1:List of items to be filled in knapsack.\n\n| Item (i) | v[i] | w[i]\
    \ | **v**[**i**]/**w**[**i**] |\n\n| --- | --- | --- | --- |\n\n| 1 | 10 | 5 |\
    \ 2 |\n\n| 2 | 12 | 4 | 3 |\n\n| 3 | 8 | 4 | 2 |\n\n| 4 | 20 | 5 | 4 |\n\nTable\
    \ 3.2:Items arranged in order.\n\n| Item (i) | v[i] | w[i] | **v**[**i**]/**w**[**i**]\
    \ |\n\n| --- | --- | --- | --- |\n\n| 1 | 20 | 5 | 4 |\n\n| 2 | 12 | 4 | 3 |\n\
    \n| 3 | 10 | 5 | 2 |\n\n| 4 | 8 | 4 | 2 |\n\n![](graphic/converted/b_9783110693607-003_fig_002.png)\n\
    \nFigure 3.2: Solving the fractional knapsack problem with greedy approach.\n\n\
    Now, taking decision one by one.\n\nFor first item, *w*[1] = 5 < *U*( = 16) so\n\
    \n*x*[1] = 1.0*U* = *U*−*w*[1] = 16 − 5 = 11\n\nAgain selection *w*[2] = 4 < *U*( = 11)\n\
    \n*x*[2] = 1.0]*U* = *U* − *w*[2] = 11 − 4 = 7\n\nSelecting *w*[3] = 5 < *U*( = 7)\n\
    \n*x*[3] = 1.0*U* = *U*− *w*[3] = 7 − 5 = 2\n\nNow for 4th item\n\n*W*[4] = 4, *U* = 2*W*[4] > *U*\n\
    \nSo $x\\lbrack 4\\rbrack\\; = U/{w4} = \\frac{2}{4} = \\frac{1}{2} = 0.5$\n\n\
    So solution vector is\n\n*X*[1 : 4] = {1.0, 1.0, 1.0, 0.5}\n\nProfit earnest is\n\
    \n*Z*[*m**a**x*] = *v*[1].*x*[1] + *v*[2].*x*[2] + *v*[3].*x*[3] + *v*[4].*x*[4]= 20 * 1 + 12 * 1 + 10 * 1 + 8 * 0.5= 46\n\
    \nThus, the maximum profit earned is 46.\n\n## 3.2 Backtracking\n\nAmerican mathematician\
    \ D. H. Lehmer first proposed the term ***backtrack*** in the 1950s. The language\
    \ SNOBOL (1962) was the first to provide a built-in general backtracking service.\
    \ This approach is specially applied to NP-complete problems where no other choice\
    \ of algorithm that may give better solution exists. The key point of backtracking\
    \ algorithm is binary choice *Yes* or *No*, whenever backtracking has choice *No*,\
    \ that means the algorithm has encountered a dead end. And it backtracks one step\
    \ and tries a different path for choice *Yes*. The solution for the problem according\
    \ to backtracking can be represented as implicit graph. In backtracking approach,\
    \ we form a state space tree. This approach is used for a number of NP-hard problems.\n\
    \n### 3.2.1 Hamiltonian cycle\n\nHamiltonian cycle of a graph is a circuit that\
    \ passes just once through each vertex of the graph G = (V, E) excluding the terminating\
    \ vertex.\n\nor\n\nHamiltonian cycle is a graph G round trip path in which each\
    \ vertex is visited exactly once and returns to its starting point. Such graph\
    \ is called Hamiltonian graph (see [figure 3.3](#bodymatter-003.xhtml_b_9783110693607-003_fig_003)).\n\
    \n![](graphic/converted/b_9783110693607-003_fig_003.png)\n\nFigure 3.3: Graph\
    \ G with Hamiltonian cycle (in dark lines).\n\nWithout lack of generality, we\
    \ can conclude that there is a Hamiltonian loop and it begins to form vertex “a”\
    \ ([Figure 3.4(a)](#bodymatter-003.xhtml_b_9783110693607-003_fig_004)) and we\
    \ make vertex “a” root of the space tree in body ([figure 3.4 (b)](#bodymatter-003.xhtml_b_9783110693607-003_fig_004)).\n\
    \n![](graphic/converted/b_9783110693607-003_fig_004.png) ![](graphic/converted/b_9783110693607-003_fig_200.png)\
    \ ![](graphic/converted/b_9783110693607-003_fig_201.png)\n\nFigure 3.4: (a) A\
    \ Graph, (b) Space Tree for Hamiltonian Cycle, (c) Hamiltonian Cycle.\n\nLet us\
    \ use alphabetic order to break the tie between the vertices adjacent to a, we\
    \ select the vertex b, then c, then d, and then e and finally to f which proves\
    \ to be a dead end. So backtrack algorithm from f to e, and then to d and then\
    \ c."
