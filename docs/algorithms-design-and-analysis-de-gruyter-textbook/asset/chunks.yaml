    \ < F(p, q) < C(p, q)`。\n\n#### 4.5.1 最大流与最小切 (Maximum flow and minimum cut)\n\
    \n网络的最大流是容量网络中的可行流，使得流的值尽可能大。流网络 `G` 的切（cut）是 `G` 的边集合，删除这些边会停止源 `S` 到汇 `T` 的流。切的容量等于切中边的容量之和。\n\
