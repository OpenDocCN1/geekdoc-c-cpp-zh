    [content]![](graphic/converted/b_9783110693607-005_fig_500.png) ![](graphic/converted/b_9783110693607-005_fig_501.png)


    Figure 5.3: Approximate vertex cover of graph given in figure 5.2.


    The optimal cover. The optimal cover is given in figure 5.3. `c*={b, d, e}` size(c*)=3.


    The time complexity of the above algorithm is `O(v+E)` using adjacency list to
    represent `E`. This algorithm gives a vertex cover that is at most twice the number
    of vertices in an optimal cover.


    ![](graphic/converted/b_9783110693607-005_fig_003.png)


    Figure 5.4: The optimal cover.


