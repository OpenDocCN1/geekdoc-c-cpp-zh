    \ NIL;\n  a← head [T];\n  next- > a←sib[a];\n  While (next- > a 不是 NIL)\n    do\
    \ if (deg[a] 1deg[next- > a] or\n     (sib [next- > a] 1 NIL and deg[sib[next- > a]]\
