    \ ← BLACK\n}\n```\n\n**Example 6.1:** Insert the values 42, 39, 32, 13, 20, 9\
    \ into an empty RBT.\n\n*   (1) Insert 42\n\n    ![](graphic/converted/b_9783110693607-006_ingr_001.png)\n\
    \n*   (2) Insert 39\n\n    ![](graphic/converted/b_9783110693607-006_ingr_002.png)\n\
    \n*   (3) Insert 32\n\n    ![](graphic/converted/b_9783110693607-006_ingr_003.png)\n\
