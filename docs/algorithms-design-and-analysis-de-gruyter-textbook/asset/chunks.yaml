    ## 5.5 P and NP class problem


    We can divide all the decision problems into two classes based on their complexity:
    class P and class NP. **Class P** problems are the problems that can be cracked
    in polynomial time by deterministic algorithm. These are also called polynomial.
    However some problems cannot be cracked in polynomial time, like Hamiltonian circuit
    traveling salesman problem, knapsack problem, and graph coloring problem. **Class
    NP** problem are the problems that can be cracked by nondeterministic polynomial
    algorithm. This class of problem is called nondeterministic polynomial. All class
    P problems are also class NP problems, so


    `P ⊆ NP`


    ### 5.5.1 Reducibility


    Reducibility is the property of a decision problem. The problem `D[1]` is said
    to be polynominally reducible to another decision problem `D[2]` if there exists
    a function `f` that transform instance `s` of `D[1]` to `D[2]` such that:


    1. The function `f` makes all yes instances of `D[1]` to yes instance of `D[2]`
    and all no instance of `D[1]` into no instance of `D[2]`.

    2. The function `f` can be calculated by polynomial time.


    ### 5.5.2 NP complete problem


    A decision problem `D` is said to be NP Complete if


    1. It belongs to class NP.

    2. Every problem in NP class is polynomial reducible to `D`. The NP class of problems
    contains decision problems that provable in polynomial time. Any problem in P
    class is in NP class as stated.


    ## 5.6 Approximation algorithms


    In the event that issue is NP Complete, we are probably not to locate polynomial
    time for solving it. Approximation algorithms don’t guarantee the best solution.
    The goal of an approximation algorithm is to come as close as possible to the
    optimum value in a reasonable amount of time which is at most polynomial. An algorithm
    that returns close to optimal solution is called approximation algorithm.


    Let `i` be instance of some optimization problem and this problem has large number
    of possible solutions and the cost of solution founded by approximate algorithm
    is `c(i)` and the cost of optimal solution is `c*()`. For minimization problem,
    we are concerned to discover a solution for which value of the expression `c(i)`
    will be small as possible. Conversely, for maximization problem, the expression
    `c(i)` will be large as possible. We say that approximation algorithms satisfy
    following condition:


    `max(c(i), c*(i)) ≤ p(n)`


    Both minimization and maximization problems holds this definition. Note that `p(n)
    ≥ 1` always. If solution generated by approximation algorithm is accurate and
    optimal then `p(n) = 1`.


    ### 5.6.1 Relative error


    The relative error of approximate algorithm can be defined as:


    `mod[c(i)–c*(i))/c(i)` for any input size.


    ### 5.6.2 Approximation algorithm for TSP


    The nearest neighbor algorithm (greedy approach) is an approximation algorithm
    to solve traveling salesman problem (TSP) and to get optimal solution of TSP,
    we can apply the dynamic programming approach. Consider the example given in figure
    5.1:


    ![](graphic/converted/b_9783110693607-005_fig_001.png)


    Figure 5.1: A Graph to be solved for TSP.


    The nearest neighbor approach, starting from city `a`, then the nearest neighbor
    of `a` is `b` and nearest neighbor of `b` is `c` and then `c` to `d` and finally
    return to vertex `a`.


    `a-------^(1-)b------^(2-)c------^(1-)d------^(6-)a`


    The path length of Hamiltonian cycle is 10


    But if we apply DPP, the length of the tour would be 8.


    Thus the accuracy ration of this approximation is `V(S[a])=(c(i)/c*(i))=10/8=1.25`


    That is, path `S[a]` is 25% larger than the optimal path `S*`.


    ### 5.6.3 The vertex cover problem


    The vertex cover problem comes under the class of NP complete problems. `G` is
    an undirected graph with `V` as the collection of vertices and `E` as the collection
    of edges. Vertex cover `V''` of graph `G` is a subset of `V` and if `(u, v)` is
    an edge of graph `G` then `u ∈ V''` or `v ∈ V''` or both. Number of vertices in
    `V` is called size of the vertex cover. The problem is to discover a minimum sized
    vertex cover. This vertex cover will be optimal vertex cover of graph `G`. It
    may not be an easy task to discover an optimal vertex cover, but it is not too
    difficult to discover a vertex cover which is close to optimal.


    #### APPROX-VERTEX-COVER (G)


    1. `V’: = Φ;`

    2. `E’: = E(G)`

    3. `While E’ not Φ do`

    4. `Let take an arbitrary edge(u, v) from the set E’`

    5. `V’::= V’ ∪{u, v}`

    6. `Remove all the edges that are incident on either u or v from the set E’.`

    7. `return V’.`


    **Example 5.3:** Find approximate vertex cover of the graph given in figure 5.2.


    ![](graphic/converted/b_9783110693607-005_fig_500.png) ![](graphic/converted/b_9783110693607-005_fig_501.png)


    Figure 5.3: Approximate vertex cover of graph given in figure 5.2.


    The optimal cover. The optimal cover is given in figure 5.3. `c*={b, d, e}` size(c*)=3.


    The time complexity of the above algorithm is `O(v+E)` using adjacency list to
    represent `E`. This algorithm gives a vertex cover that is at most twice the number
    of vertices in an optimal cover.


    ![](graphic/converted/b_9783110693607-005_fig_003.png)


    Figure 5.4: The optimal cover.


    **Theorem 5.6.4: APPROX-VERTEX-COVER is a polynomial time 2-approximation algorithm.**


    **Proof:** The APPROX-VERTEX-COVER runs ion polynomial time, to prove that APPROX-VERTEX-COVER
    returns a vertex cover that is at twice the size of optimal cover.


    Let `A` is the set of edges picked in algorithm APPROX-VERTEX-COVER in order to
    cover the edges in `A`, any vertex cover, particular an optimal cover `C*` must
    include at least one end point of each edge in `A`. No two edges in `A` share
    an end point since once an edge is picked, all other edges that incident on its
    end points are deleted from `E`, thus no two edges in `A` are covered by any vertex
    `C*` of graph `G`. For `C*`, we have lower bound


    (i)`|C*| ≥ |A|`


    Each execution of line 4 of the algorithm, picks an edge for which neither of
    its end points are already in `C`. One edge included in set `A` mean two vertices
    included in set `C`, thus we have


    `C = {u, v}`


    `A = {(u,v)…}`


    (ii)`|C*| = 2|A|`


    Combining equation (i) and (ii), we have


    `|C*| = 2|A| ≤ 2|C*|proved|C*|| ≤ 2|C*|`

