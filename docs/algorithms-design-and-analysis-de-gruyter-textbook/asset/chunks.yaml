    \n*(注：原文此处存在大量文本重复，译文已按照语意进行了处理)*\n\n动态规划是一种解决复杂问题的方法，它通过将问题分解为较小的子问题。8 皇后问题的一个可能解是：`{c[1],c[2],c[3],c[4],c[5],c[6],c[7]}`\
    \ ≡ `{c[1],c[2],c[3],c[4],c[5],c[6],c[7]}`。\n\n#### 3.3.1 0/1 背包问题\n\n我们有 `n`\
    \ 个物品，重量为 `w[1], w[2], ...w[n]`，价值为 `v[1], v[2], ...v[n]`，`W` 是容量。目标是填满背包以获得最大利润。在\
    \ 0/1 背包中，要么选择物品或不选择：\n\n$\\begin{matrix} & \\text{Max } z = \\sum_{i = 1}^{n}x_{i}.v_{i}}\
    \ \\\\ & \\text{such that}\\sum_{i = 1}^{n}x_{i}.w_{i}} \\leq W \\\\ & x_{i} \\\
    in \\{0,1\\} \\end{matrix}$\n\n动态规划通过解决重叠子问题来提高效率。对于 `i` 个物品（`1≤i≤n`），背包能力为 `j\
    \ < W`。`O[i, j]` 是这些 `i` 个物品的最优解。该实例被分为两个子集：\n\n*   第一个子集不包含第 `ith` 个物品，`O[i-1,\
    \ j]` 是该子集的值。如果 `ith` 个对象不放入背包，则值将与 `i–1` 个物品相同，所以：`O[i, j] = O[i-1, j]`\n*  \
    \ 第二个子集包含第 `ith` 个物品，因此该最优子集的值为 `v[i]+O[i-1, j-w[i]]`\n\n因此，前 `i` 个物品的最优解是这两类值的最大值：\n\
