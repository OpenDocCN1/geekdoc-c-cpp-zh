    ## 1.5 渐近表示法


    每当我们学习算法时，我们都根据其精确性和效率来描述它们。换句话说，我们主要关心算法运行时间的增长（不是精确的时间）。在科学上，这种现象被称为`渐近运行时间`。迫切需要设计一种方法来发现函数的增长率。渐近表示法是一种根据增长率对算法分类的方法。


    ### 1.5.1 O 表示


    设 `f(n)` 和 `g(n)` 是两个正函数。函数 `f(n)` 称为 `O(g(n))`，如果 `f(n)` 在 `n` 较大时被 `g(n)` 的某个正倍数上界，即存在正常数
    `c` 和非负整数 `n[0]`，使得：


    `f(n) ≤ c * g(n)`，`n ≥ n[0]`


