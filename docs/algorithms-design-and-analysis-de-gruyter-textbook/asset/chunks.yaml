    \ c[2][a], … .c[n[a] +1][a]} points to child node of a. Since there is no child\
    \ node for leaf node, c[i] fields of leaf nodes are not defined.\n\n3.  The keys\
    \ of node a {key[i][a]} split the ranges of keys saved in each sub tree of node\
    \ a. If k[i] is any key stored in the sub tree with root c[i][a] then\n\n    *k*[*i*] ≤ *k**e**y*[1][*a*] ≤ *k*[2] ≤ *k**e**y*[2][*a*] ≤ … ≤ *k**e**y*[*n*[*a*]][*a*] ≤ *k**e**y*[*n*[*a*]+1]\n\
    \n4.  Each leaf node is at same depth like other leaf nodes and this is called\
    \ height (h) of the tree.\n\n5.  Minimum and maximum number of keys stored in\
    \ a node is bounded. A fixed integer t ≥ 2 is used to express these bounds. This\
    \ is called the ***maximum degree*** of B-tree.\n\n    1.  Lower bound on the\
    \ keys a node (other than root node) is ***(t–1) keys***. Each nonleaf node except\
    \ root thus has a minimum of t child nodes. In case of nonempty tree, the root\
    \ must have no less than one key.\n\n    2.  Upper bound on the keys a node is\
    \ ***(2 t–1) keys***. So a nonleaf node can have maximum 2 t child nodes. If a\
    \ node contains exactly (2 t–1) keys then the node is said to be full.\n\nThe\
    \ following figure Figure 6.3 shows the B-tree of height 2\\. All the nodes contain\
