    ## 5.5 P and NP class problem


    We can divide all the decision problems into two classes based on their complexity:
    class P and class NP. **Class P** problems are the problems that can be cracked
    in polynomial time by deterministic algorithm. These are also called polynomial.
    However some problems cannot be cracked in polynomial time, like Hamiltonian circuit
    traveling salesman problem, knapsack problem, and graph coloring problem. **Class
    NP** problem are the problems that can be cracked by nondeterministic polynomial
    algorithm. This class of problem is called nondeterministic polynomial. All class
    P problems are also class NP problems, so


    `P ⊆ NP`


    ### 5.5.1 Reducibility


    Reducibility is the property of a decision problem. The problem `D[1]` is said
    to be polynominally reducible to another decision problem `D[2]` if there exists
    a function `f` that transform instance `s` of `D[1]` to `D[2]` such that:


    1. The function `f` makes all yes instances of `D[1]` to yes instance of `D[2]`
    and all no instance of `D[1]` into no instance of `D[2]`.

    2. The function `f` can be calculated by polynomial time.


    ### 5.5.2 NP complete problem


    A decision problem `D` is said to be NP Complete if


    1. It belongs to class NP.

    2. Every problem in NP class is polynomial reducible to `D`. The NP class of problems
    contains decision problems that provable in polynomial time. Any problem in P
    class is in NP class as stated.


