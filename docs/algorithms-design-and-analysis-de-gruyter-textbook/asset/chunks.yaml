    ## 1.7 分治关系


    假设算法将规模为 `n` 的问题划分为子问题，每个子问题的大小为 `n/b`。在该点，这些子问题被解决，并将子问题的答案合并以得到问题的解。假设执行了 `g(n)`
    次任务。这遵循递归关系。


    **示例 1.12:** 二分查找算法将规模为 `n` 的搜索减少为规模为 `n/2` 的搜索（如果 `n` 是偶数）。


    (i) 对于二分查找，`f(n) = f(n/2)+A`

    (ii) 归排序的递归关系 `T(n) = 2T(n/2)+cn`，当 `n>1`，`n=1` 时为 DAC 。


    ### 1.7.1 DAC 递归关系的解


    **示例 1.13:**


    ```

    $\begin{matrix} & f(n) = 3f(n/2) + n \\ {taking} & n = 2^{k}, k = log_{2}n \\
    {let} & f(n) = f(2^{k}) = b_{k} \\ & f(n/2) = f(2^{k/2}) = b_{k-1} \end{matrix}$

    ```


    因此递归关系为：


    ```

    $\begin{matrix} & b_{k} = 3b_{k-1} + 2^{k} \\ b_{k} - 3b_{k-1} = 2^{k} \end{matrix}$

    ```


    递归关系的特征方程为 `t − 3 = 0`，所以 `t = 3`。齐次解为 `b[k]^H=A.3^k`。因为 `a = 2` 且 2 不是特征方程的根，根据情况
    (ii)，特解试验为 `B.2^k`，在递归关系中代入 `b[k] = B.2^k`：


    ```

    $\begin{matrix} & B2^{k} - 3B2^{k - 1} = 2^{k} \\ {(2^{k - 1})(2B - 3B) = 2.2^{k
    - 1} \\ - B = 2,B = -2 \end{matrix}$

    ```


    所以，`PS = B2^k = –2.2^k`。因此解为：


    ```

    $\begin{matrix} & b_{k} = A3^{k} + ( -2)2^{k} \\ b_{k} = A.3^{k} - 2.2^{k} \\
    b_{k} = a_{n} \Rightarrow a_{n} = A.3^{log_{2}n}} - 2n \\ a_{n} = A_{0}n^{log_{2}3}
    - 2n \end{matrix}$

    ```


    设 `3^(log2) = n^p`。两边取以 2 的对数：


    ```

    $\begin{array}{l} {\log_{2}^{n}\log_{2}^{3} = \text{p}.\log_{2}^{n}} \\ {\text{p}
    = \log_{2}^{3}} \end{array}$

    ```


