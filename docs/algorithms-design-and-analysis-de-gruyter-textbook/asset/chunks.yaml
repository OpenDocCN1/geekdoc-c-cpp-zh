    }} \\end{matrix}$\n\n## 2.4 Merge sort\n\n`Merge sort` is an $O(n \\log n)$ correlation-based\
    \ arranging algorithm. Most executions produce a steady sort, implying that the\
    \ usage protects the input order of equivalent elements in the arranged array.\
    \ It is based on DAC strategy. Merge sort was proposed by John von Neumann in\
    \ 1945. It sorts a given array `Ar[1:n]` by dividing it two halves `Ar[1:⌊n/2⌋]`\
    \ and `Ar[⌊n/2⌋ + 1: n]`, sorts every one of them recursively and afterward consolidates\
    \ the two smaller sorted array into a single sorted one.\n\n**Algorithm:** `Merge\
    \ Sort(low, high)`\n\n```\n {\nIf(low<high) Then\n     {\n     mid:=⌊(low+high)/2⌋\n\
    \     MergeSort(low,mid);\n     MergeSort(mid+1 ,high);\n     Merge(low ,mid ,high);\n\
    \     }\n}\n```\n\n**Algorithm:** `Merge(low, mid, high)`\n\n// `AU[]` is an auxiliary\
    \ global array.\n\n```\n {\n        h:=low; x:=low; y:=mid+1;\n        while (x\
    \ ≤ mid) and (y ≤ high)do\n         {\n            if(Ar[x]≤ Ar[y] Then);\n  \
    \           {\n                Au[h]: = Ar[x];\n                x: = x+1;\n  \
    \           }\n            else\n             {\n                Au[h]: = Ar[y];\n\
    \                y: = y+1;\n             }\n            h: = h+1;\n         }\n\
    \ if(x> mid) Then\n    {\n         for z: = y to high do\n          {\n      \
    \      Au[h]: = Ar[z];\n            h: = h+1;\n          }\n  else\n         for\
    \ z: = x to mid do\n          }\n           Au[h]: = Ar[z];\n           h: = h+1;\n\
    \  }\n        for z: = low to high do\n           Ar[z] = Au[z];\n      } \n```\n\
