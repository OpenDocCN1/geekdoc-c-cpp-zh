    ## (2) When the roots are not distinct


    Let the roots be `α[1]`, `α[2]`, `α[3]`, `...........`, `α[n]` with multiplicity
    `m[1]`, `m[2]`, `..........m[i]`, `....,`, `m[n]`, `m[1] + m[2] + ....... + m[n]
    = k`.


    Then the solution is


    `a[n] =.......+(A[0] + A[1]n + A[2]n² + ..... + A[m[i]-1]n^(m[i]-1)α[i]^(n) +......`,
    where `m[i]` is the multiplicity of root `α[i]`.


    **Example 1.6:** Find the general solution of recurrence relation


    `a[n] − 3a[n − 1] + 2a[n − 2] = 0` for `n ≥ 2`, where `a[0] = 1` and `a[1] = 2`.


    **Solution:**


    The characteristic equation is `x² − 3x + 2 = 0`, solving this equation


    ```

    (1.2)$\begin{array}{l} {\text{x} = \text{2,1}} \\ {\text{a}_{\text{n}}\text{A}_{\text{1}}\text{2}^{\text{n}}\text{+A}_{\text{2}}\text{1}^{\text{n}}}
    \end{array}$

    ```


    The starting conditions are `a[0] = 1` and `a[1] = 2`.


    By putting `n = 0` and `1` in eq. (1.2) and solving the equations, we get `A[1]
    = 1` and `A[2] = 0`.


    As a result, the solution to the recurrence relation will be


    `A[n] = 1.2^n`


    **Example 1.7:** Find the solution of the following relation


    `a[n] − 6a[n − 1] − 9a[n − 2] = 0` with `a[0] = 1` and `a[1] = 6`.


    **Solution:**


    The characteristic equation will be


    `t² − 6t − 9 = 0`


    Roots of the equation are 3 and 3.


    Hence, the solution to the recurrence relation is


    `a[n] = A[1].3^(n) + A[2].n.3^(n)` for some constants `A[1]` and `A[2]`.


    To match the initial condition, we need


    `a[0] = 1 = A[1]a[1] = 6 = A[1] × 3 + A[2] × 3`


    Solving these equations yields `A[1] = 1` and `A[2] = 1`.


    Consequently, the overall solution is given by


    `a[n] = 3^(n) + n.3^(n) = (1 + n).3^(n)`


    ### 1.6.3 Solution to nonhomogeneous linear recurrence relation


    A recurrence relation of the form


    `a[n] + b[1]a[n − 1] + b[2]a[n − 2] + · · · · b[k]a[n − k] = f(n)`, `n ≥ k` where
    `f(n) ≠ 0` is said to be a nonhomogeneous recurrence relation.


    Consider the following relation:


    ```

    $\begin{matrix} & {a_{n} - a_{n - 1} - a_{n - 2}}{= n + 3} \\ \begin{matrix} {LHS}
    & {RHS}} \end{matrix} \end{matrix}$

    ```


    where `f(n) = n + 3`.


    `LHS` of the relation is the homogeneous part of the relation; it is called the
    **associated linear recurrence relation**. `RHS` is the second member. To solve
    such relation, `LHS` is solved first and then `RHS` is solved to find a particular
    solution (PS). The results of both sections are combined to form a complete solution
    of relation.


    #### Finding the PS


    There is no universal process to find PS of a recurrence relation. Though `RHS`
    of the relation takes a simple form, the method of inspection (or guessing) can
    be used. For example:


    1. If `f(n) = C`, a constant. Then we suppose the PS is also a constant `A`: `a[n]
    + C[1]a[n − 1] + · · · · C[k]a[n − k] = D.(n)`.

    2. If `f(n)` is in exponential form, that is `a^n`, then the trial solution for
    `PS = A.a^n`, if `a` is not the root of characteristic equation.

    3. If `f(n)` is in exponential form, that is `a^n`, then the trial solution for
    `PS = A.n^a^n`, when `a` is root of characteristic equation with multiplicity
    `m`.


    **Example 1.10:** Find the solution for the following nonhomogeneous recurrence
    relation,


    `a[n] − 6a[n − 1] − 9a[n − 2] = 4.2^(n)`.


    **Solution:**


    The roots of the equation `t² − 6t − 9 = 0` are 3 and 3.


    Hence, the solution of associated homogenous part is


    `a[n]^H = (A[1] + A[2].n).3^(n)`, `A[1]` and `A[2]` are constants.


    To compute the PS, we have `a = 2`, and a is not the root of equation. Then according
    to case (iii), the trial solution will be


    `a[n]^p = A.2^(n)`


    To determine the value of `A`, we substitute `a[n] = A.2^(n)` in the given recurrence
    relation.


    **Example 1.11:** What is the solution of the recurrence relation?


    `a[n] – 7a[n–1] + 10 a[n–2] = 7.5^n`


    **Solution:**


    The roots of the equation `t² − 7t + 10 = 0` are 2 and 5.


    Hence, the solution of the associated homogenous part is


    `a[n]^H = (A[1].2^(n) + A[2].5^(n))`, `A[1]` and `A[2]` are constants.


    To compute the PS, we have `a = 5`, where a is the root of equation with multiplicity
    1. Then according to case (ii), the trial solution will be


    `a[n]^p = A.n.5^(n)`


    To determine the value of `A`, substitute `a[n] = A.n.5^(n)` in the given recurrence
    relation:


    ```

    $\begin{matrix} & An^{n} - 7A(n - 1)5^{n - 1} + 10A(n - 2)5^{n - 2} = 7.5^{n}
    \\ & A5^{n - 2}\{5n - 7(n - 1) + 10(n - 2)\} = 7.5^{n} \\ & A5^{n - 2}\{5n - 7n
    + 7 + 10n - 20\} = 7.5^{n} \\ & A5^{n - 2}\{8n - 13\} = 7.5^{n} \dots \text{ (Wait,
    the math in logic for } n \text{ and } a \text{ in original text seems inconsistent,
    but formatting follows)} \end{matrix}$

    ```

