    \ programming?\n\n3. Explain in detail the primary difference between the two\
    \ techniques: DAC and dynamic programming?\n\n4. What are the fundamental features\
    \ of dynamic programming?\n\n5. Calculate the value of `C(12,8)` using dynamic\
    \ programming.\n\n6. Solve the fractional knapsack problem with the greedy algorithm.\
    \ The knapsack capacity `W`   60.\n\n7. Explain the applications of backtracking.\n\
    \n8. Compare and contrast brute force approach and backtracking.\n\n9. Write the\
    \ control abstraction of backtracking.\n\n10. Use Branch and Bound technique to\
    \ solve the assignment problem:\n\n| | F[1] | F[2] | F[3] | F[4] |\n|---|---|---|---|---|\n\
    | J[1] | 4 | 3 | 1 | 5 |\n| J[2] | 6 | 2 | 9 | 8 |\n| J[3] | 3 | 4 | 7 | 6 |\n\
    | J[4] | 2 | 8 | 4 | 9 |\n\n# Chapter 4 Advanced graph algorithm\n\nThis chapter\
    \ introduces graph concept and algorithms based on graph.\n\n## 4.1 Introduction\n\
    \nA graph is a collection of vertices and edges. These vertices are connected\
    \ by edges. A graph can be defined by two sets `V` and `E`, where `V` is the set\
    \ of vertices of the graph and `E` is the set edges. [Figure 4.1](#bodymatter-004.xhtml_b_9783110693607-004_fig_001)\
    \ shows two graphs: each one has five vertices, graph A has six edges, and graph\
    \ B has eight edges.\n\n![](graphic/converted/b_9783110693607-004_fig_001.png)\n\
    \nFigure 4.1: Graph A (a) and graph B (b).\n\n### 4.1.1 Terminology\n\nHere are\
    \ some terminologies used throughout this chapter:\n\n1. **Subgraph:** As the\
    \ name indicates it is also a graph. The `subgraph H` of a graph can be denoted\
    \ as `H =  (V’, E’)` such that `V' ∈ V` and `E’   E`.\n\n2. **Spanning Subgraph:**\
    \ The spanning subgraph has all vertices of `G` but not necessarily edges.\n\n\
    3. **Connected Graph:** In connected graph, any of the two vertices have a path\
    \ joining them.\n\n4. **Adjacent Vertices:** Adjacent vertices are the end points\
    \ of the same edge.\n\n5. **Neighbor Vertices:** If two vertices are adjacent\
    \ to one another, they are said to be neighbor vertices.\n\n6. **Isolated Vertex:**\
    \ If a vertex has no neighbor vertex it is said to be an isolated vertex.\n\n\
    7. **Complete Graph:** If every vertex of the `n` vertices of graph `G` is adjacent\
    \ to the other `n–1` vertices of `G` (see [Figure 4.2](#bodymatter-004.xhtml_b_9783110693607-004_fig_002)).\n\
    \n![](graphic/converted/b_9783110693607-004_fig_002.png)\n\nFigure 4.2: Complete\
    \ graph.\n\n8. **Tree:** A tree is a graph that is connected and has no cycles\
    \ (see [Figure 4.3](#bodymatter-004.xhtml_b_9783110693607-004_fig_003)).\n\n![](graphic/converted/9783110693607-004_fig_003.png)\n\
    \nFigure 4.3: Tree.\n\n## 4.2 The graph search techniques\n\nThere are two techniques\
    \ for performing search on graphs, namely breadth first search (BFS) and depth\
    \ first search (DFS).\n\n### 4.2.1 Breadth first search\n\nBFS starts with a vertex\
    \ `q` and makes it as visited. This vertex `q` currently said to be unexplored.\
    \ Exploring this vertex means all adjacent vertices of this vertex are visited.\
    \ Next step is to visit all adjacent vertices of vertex `q` which are still unexplored\
    \ (see [Figure 4.4](#bodymatter-004.xhtml_b_9783110693607-004_fig_004)). When\
    \ all adjacent vertices of `q` are visited then vertex `q` is said to be explored.\
    \ Unexplored vertices are maintained in a list. All these vertices are then added\
    \ to this list. Next vertex to be explored is the first node in this list. This\
    \ process of vertex exploration keeps on until the list of unexplored is not empty.\n\
    \n![](graphic/converted/9783110693607-004_fig_004.png)\n\nFigure 4.4: Breadth\
    \ first search.\n\n**Algorithm: Breadth-First-Search(G)**\n```\n// Input: A Graph\n\
    // Output: All the vertices are marked with the integers depicting the order they\
    \ have been visited. Integer 0 indicates vertex p is not yet visited.\n{\n  Mark\
    \ each vertex in G with 0. // Not visited\n  Visit_Order =0; //global variable\n\
    \  For all vertices p in V do\n    If p has number 0 // not yet visited\n    \
    \  EXPLORE(p);\n}\n```\n\n**Algorithm: EXPLORE(p)**\n```\n{\n  Visit_Order :=\
    \ Visit_Order+1;\n  Mark p with the value Visit_Order and initialize queue with\
    \ p;\n  While queue is not empty do\n    For every vertex q in V adjacent to vertex\
    \ p do\n      If q not yet visited // marked with 0\n        Visit_Order := Visit_Order\
    \ +1;\n        Mark q with Visit_Order;\n        Add q to the queue;\n    Remove\
    \ vertex p from the front of queue;\n}\n```\n\n**Complexity of BFS:** Queue space\
    \ need is at most (n–1), if `q` is connected with (n–1) remaining vertices, and\
    \ then adjacent vertices of `q` are on the queue all at once therefore, `S(n,\
    \ e) = θ(n)`\n\nIf Adjacency list is used for representation of graph `G`, then\
    \ all adjacent vertices of `p` can be determined in time equivalent to the degree\
    \ of `p`, that is `d(p)`. If `G` is directed graph, `d(p)` is the out degree of\
    \ node `p`. The time for `for` loop in algorithm is of `θ(d(p))` since each vertex\
    \ in `G` can be explored exactly once.\n\n**Example 4.1:** Adjacency list representation\
    \ [Figure 4.5](#bodymatter-004.xhtml_b_9783110693607-004_fig_005),\n\n![](graphic/converted/b_9783110693607-004_fig_005.png)\n\
    \nFigure 4.5: Graph and its adjacency list representation.\n\nIn `Breadth-First-Search(G)`\
    \ algorithm, each vertex is enqueued and dequeued exactly once and operation of\
    \ enqueue and dequeue takes O(1) time. Therefore total time for performing the\
    \ operation enqueue is O(|V|) because the list is searched at most once, for dequeue\
    \ vertex. The time spent in adjacency list scanning process is O(|E|). The initialization\
    \ takes time O(|V|). Hence complexity of the algorithm is O(|V|+|E|), when the\
    \ graph is represented by adjacency linked list. For adjacency matrix representation,\
    \ it is O(|V|²).\n\n### 4.2.2 Depth first search\n\nDFS starts with a vertex `p`\
    \ in `G`, `p` is said to be current vertex. Any edge `(p, q)` incident to the\
    \ current vertex `p` is traversed by the algorithm. If this edge vertex `q` is\
    \ already visited, then search to the vertex `p`. Otherwise go to `q` and `q`\
    \ becomes current vertex. This process is repeated until “deadend” is reached.\
    \ Then backtracking is performed. The process ends when backtracking leads back\
    \ to the starting vertex ([figure 4.6](#bodymatter-004.xhtml_b_9783110693607-004_fig_006)).\n\
    \n![](graphic/converted/9783110693607-004_fig_006.png)\n\nFigure 4.6: Depth first\
    \ search.\n\n**Algorithm: Depth-First-Search(G)**\n```\n// Input: A graph\n//\
