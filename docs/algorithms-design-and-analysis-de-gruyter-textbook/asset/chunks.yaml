    }} \\end{matrix}$\n\n## 2.4 归并排序\n\n`Merge sort` 是一种 $O(n \\log n)$ 基于比较排序算法。大多数执行产生稳定排序，这意味着该方法保护了排序数组中相等元素的输入顺序。它基于分治算法策略（DAC）。归并排序由\
    \ John von Neumann 在 1945 年提出。它通过将给定数组 `Ar[1:n]` 分为两部分 `Ar[1:⌊n/2⌋]` 和 `Ar[⌊n/2⌋ +\
    \ 1: n]`，递归地对每一部分进行排序，然后将两个较小的排序数组合并为一个单一的排序数组。\n\n**算法：** `Merge Sort(low, high)`\n\
    \n```\n {\nIf(low<high) Then\n     {\n     mid:=⌊(low+high)/2⌋\n     MergeSort(low,mid);\n\
    \     MergeSort(mid+1 ,high);\n     Merge(low ,mid ,high);\n     }\n}\n```\n\n\
    **算法：** `Merge(low, mid, high)`\n\n// `AU[]` 是一个辅助全局数组。\n\n```\n {\n        h:=low;\
    \ x:=low; y:=mid+1;\n        while (x ≤ mid) and (y ≤ high)do\n         {\n  \
    \          if(Ar[x]≤ Ar[y] Then);\n             {\n                Au[h]: = Ar[x];\n\
    \                x: = x+1;\n             }\n            else\n             {\n\
    \                Au[h]: = Ar[y];\n                y: = y+1;\n             }\n\
    \            h: = h+1;\n         }\n if(x> mid) Then\n    {\n         for z: =\
    \ y to high do\n          {\n            Au[h]: = Ar[z];\n            h: = h+1;\n\
    \          }\n  else\n         for z: = x to mid do\n          }\n           Au[h]:\
    \ = Ar[z];\n           h: = h+1;\n  }\n        for z: = low to high do\n     \
    \      Ar[z] = Au[z];\n      } \n```\n\n**示例 2.3：** 例如，\n\n![](img/b_9783110693607-002_fig_003.png)\n\
    \n图 2.3：归并排序示例。\n\n### 2.4.1 归并排序分析\n\n当算法包含对自身的递归调用时，其运行时间可以通过递归关系来描述。对于 `MergeSort()`，我们简单起见假设\
    \ $n = 2^k$。分治算法的递归基于三个步骤：\n\n*   **划分（Divide）：** 这一步寻找子数组的中间位置，只需要常数时间。\n*  \
    \ **解决（Conquer）：** 递归求解两个规模为 $n/2$ 的子问题，这为运行时间增加了 $2T(n/2)$。\n*   **合并（Combine）：**\
    \ 合并过程（针对 $n$ 个元素）所需的时间与元素成比例，即 $cn$。\n\n$\\begin{matrix} & {So\\; T(n) = \\,\\\
    left\\{ \\matrix} {1,} & {n\\,= 1}} \\\\2T\\left( \\frac{n}{2} \\right) + \\,cn,}\
    \ & {n\\,> 1}}\\end{matrix} \\right. {{where}\\;{n =2^{k}} {{Solving}\\;by}\\\
    {substitution\\} \\Rightarrow T(n) \\in \\theta(n\\;log n)}\\end{matrix}$\n\n\
    归并排序的复杂度为 $O(n \\log n)$。归并排序不是原地算法，因为它需要额外的数组。此外，该算法在空间上并不高效。\n\n## 2.5 堆排序\n\
    \n堆排序是一种基于比较排序算法。它是改进的选择排序，与选择排序类似，它将输入分为排序区域和未排序区域，并通过提取最小因子转移到排序区域来迭代地恢复未排序区域。它由\
    \ J.W. Williams 在 1964 年提出，是就地的算法。\n\n**完全二叉树：** 这种二叉树的顶点层索引形成整数 $1, 2, 3, \\\
    dots, n$（见图 2.4）。\n\n**堆：** 堆是一个完全二叉树，其每个节点的值都至少与其子节点大（见图 2.5）。这种属性被称为堆属性，这种堆被称为`大堆`。与之相反，在`小堆`\
    \ 中，值最小。\n\n**顶点层级：** 如果 `p` 是根节点，则 `index(p) = 1`；如果 `lc` 是顶点 `p` 的左孩子，则 `index(lc)\
    \ = (index p)*2`。如果 `rc` 是顶点 `p` 的右孩子，则 `index(rc) = 1 + (index p)*2`。\n\n![](img/b_9783110693607-002_fig_004.png)\n\
    \n图 2.4：完全与不完全二叉树。\n\n$n$ 个节点的二叉树的最小高度为 $\\lceil \\log_2(n+1) \\rceil$。\n\n![](img/b_9783110693607-002_fig_005.png)\n\
    \n图 2.5：大堆示例。\n\n`Adjust()` 是接收接收三个输入：数组 `Ar[]`、整数 `k` 和 `m`。它接受 `Ar[1:m]` 作为完全二叉树。如果根为\
    \ $2k$ 和 $2k+1$ 的树已经是大堆，那么 `adjust` 将重新排列 `Ar[]` 的元素，使得根为 $k$ 的树也是大堆。对于 `Ar[1:m]`\
    \ 中的 $m$ 个元素，我们可以通过应用 `Adjust()` 创建堆，因为叶子节点已经是堆。因此，我们可以从调用叶子节点的 `Adjust()` 开始，逐层向上直到根节点。\n\
    \n**算法：** `Adjust(Ar, k, m)`\n\n```\n {\n            i: = 2k; el: = Ar[k];\n \
    \           While (i ≤ m) do\n                        {\n                    \
    \                If(i <m) and (Ar[i] < Ar[i+1]) then\n                       \
    \                         i:= i+1;\n                                    If(el\
    \ ≥ Ar[i]) then break;\n                                    Ar[⎿i/2⏌] = Ar[i];\
    \ i: = 2i;\n                        }\n            Ar[i/2] : = el;\n}\n```\n\n\
    函数 `Heapify(Ar,m)` 调整 `Ar[1:m]` 中的元素以形成堆。\n\n**算法：** `Heapify(Ar, m)`\n\n```\n\
    {\nfor k = \\lfloor m/2 \\rfloor to 1 step-1 do\n    Adjust(Ar, k, m);\n}\n```\n\
    \n**示例 2.4：** 排序的数组元素为 ![](img/b_9783110693607-002_fig_006a.png) 图 2.6 显示数组元素的排序过程。\n\
    \n![](img/b_9783110693607-002_fig_006.png)\n\n图 2.6：堆排序的过程。\n\n### 2.5.1 Heapify\
    \ 分析\n\n对于 `Heapify` 的最坏情况分析，假设 $2^{k-1} \\leq n < 2^k$。具有 $n$ 个节点的完全二叉树的层级编号为\
    \ 1 到 $k$。对于层 $i$，`Adjust` 的迭代次数为 $(k-i)$。层 $i$ 的节点数为为 $2^{i-1}$。因此，Heapify 的总时间正比于\n\
    \n$\\sum_{1 \\leq i \\leq k-1} 2^{i-1}(k-i) = n \\sum_{1 \\leq i \\leq k-1} \\\
    frac{i}{2^i} \\leq 2n = O(n)$\n\n所以，`Heapify` 使用 `Adjust` 函数花费线性时间创建堆。\n\n###\
    \ 2.5.2 堆排序\n\n**算法：** `HeapSort()`\n\n```\n {\n    Heapify (Ar,m);          \
    \                     // 将数组转换为大堆\n    for k:= m to 2 step -1 do\n    {\n    \
    \     Temp:= Ar[k];\n         Ar[k]: = Ar[1];\n         Ar[1]: = Temp;\n     \
    \    Adjust (Ar,1,k-1);\n    }\n}\n```\n\n"
- fmt: "\n`Heapify` requires O(n) operation, and `Adjust` possibly requires O(log[2]n),\
    \ so the worst-case time complexity for `HeapSort` is O(n log[2]n).\n\n## 2.6\
    \ Sorting in linear time\n\nThere are some sorting algorithms that run quicker\
    \ than O(n logn) time but they require unique assumptions about the input collection\
    \ to be sort. Here we present three linear time sorting algorithms; counting type,\
    \ radix sort, and bucket type. Bucket sort may be used for a lot of the identical\
    \ duties as counting kind, with a similar time analysis; however, compared to\
    \ counting type, bucket type calls for related lists, dynamic arrays, or a big\
    \ quantity of reallocated memory to hold the units of gadgets within each bucket,\
    \ whereas counting type instead stores a single number (the count of elements)\
    \ per bucket.\n\n## 2.7 Counting sort\n\nCounting sort and its application to\
    \ radix sorting was both invented by Harold H. Seward in 1954. Counting sort is\
    \ an algorithm for sorting a set of objects in step with keys which can be small\
    \ integers, that is, it is for an integer sorting set of rules. It operates by\
    \ counting the number of gadgets that have every wonderful key value and using\
    \ mathematics on those counts to decide the positions of each key value in the\
    \ output sequence. However, it is frequently used as a subroutine in another sorting\
    \ algorithm, radix type, that could cope with large keys more efficiently. Because\
    \ counting kind uses key values as indexes into an array, it is not a comparison\
    \ type, and the Ω(n log n) decrease certain for comparison sorting does not follow\
    \ to it.\n\nThis sorting technique is based on frequency distribution. If values\
    \ are integers between some lower bound l and upper bound u, we compute frequency\
    \ of these values and store them in array `F[0:u–l]`.\n\n| A = 15 | 12 | 15 |\
    \ 16 | 19 | 36 | 15 | 15 |\n\nl = 12, and u = 36\n\nValue: 12, 15, 16, 19, 36\n\
    \n`Σ f[i]` = 8 = freq: 1, 4, 1, 1, 1\n\nCumulative freq: 1, 5, 6, 7, 8\n\nIn this\
    \ algorithm, we copy elements into a new array `s[0:n–1]`. The elements of array\
    \ `A` whose values are equal to the lower possible value l are copied into the\
    \ first `F(0)` elements of `S`, that is, position 0 to `F[0]–1`, and the elements\
    \ of value just greater then l are copied to position from `F(0)` to `(F(0) +\
    \ F(1)–1)` and so on.\n\n**Algorithm:** `Counting-Sort(Ar[0:size-1])`\n\n```\n\
    \ {\n     for g : =0 to (u-l) do\n          D[g]: = 0:\n     for j: = 0 to (size-1)\
    \ do\n          D[Ar[j]]: = D[Ar[j]]+l:\n     for k: 1 to (u-l) do\n         \
    \ D[k] := D[k-1]+D[k];\n     for i: = (size-1) down to 0 do\n          k:=Ar[i]-1\n\
    \          S[D[k]-1] = Ar[i];\n          D[k] := D[k]-1;\n     Return S;\n}\n\
    ```\n\nCounting sort is a stable sorting algorithm as it copies elements in the\
    \ final array in that order in which they are encountered in the unsorted array.\n\
    \n**Example 2.5:**\n\n| Input A = 6 | 9 | 7 | 6 | 4 | 5 | 6 | 7 | 9 | 5 |\n\n\
    l = 4, u = 9\n\nu–l = 9–4 = 5, n = 10\n\nElement: 4 5 6 7 8 9\n\nFrequency: 1\
    \ 2 3 2 0 2\n\nJ = 1 to 5\n\nCumulative Frequency: 1 3 6 8 9 10\n\nFor i: (n-1)\
    \ to 0 do `D[0] = 1`\n\n`D[1] = 3`\n\n`D[2] = 6`\n\n`D[3] = 8`\n\n`D[4] = 9`\n\
    \n`D[5] = 10`\n\n`i = n-1(1st iteration)`\n\n`n = 10`\n\n`j = 5–4=5` `{A[9] =\
    \ 5}`\n\n`S[3–1] = 5`\n\n`S[2] = 5`\n\n| 5 | 5 | | | | | `D[1] = 2(Remaining)`\n\
    \nFinally, we will get sorted array.\n\n### 2.7.1 Analysis of counting sort\n\n\
    Counting sort algorithm makes use most effective simple for loops without any\
    \ complex concept like recursion or subroutine calls, it is easy to analyze. The\
    \ general time complexity of sort `θ(k) + θ(n) + θ(k) + θ(n) = θ(n)` if `k` is\
    \ constant.\n\n## 2.8 Radix sort\n\nRadix sort is applicable to unit of n integers,\
    \ and each integer has d digit. We start the sorting repetitively. We start with\
    \ lowest order digit and finish at highest order. The sorting is stable.\n\n**Algorithm:**\
    \ `RadixSort(Ar, dig)`\n\n```\n{\nfor k = 1 to dig,\nPerform stable sort to sort\
    \ array Ar on the digit k.\n}\n```\n\n### 2.8.1 Analysis of radix sort\n\nLet\
    \ us assume that stable sort runs in `O(n+b)`. Then the running time of Radix\
    \ sort will be `O(dig(n+b)) = O(dign+dig)`. If dig is constant and b = O(n), the\
    \ complexity is O(n).\n\n**Example 2.6:** Input A = {677, 595, 295, 397}\n\n677\
    \ 595[6]295 295\n\n595 ⇒ 295 ⇒575 ⇒397 ⇒ 397\n\n295 677 295[5]95 595\n\n397 397[6]\n\
    \n## 2.9 Bucket sort\n\nBucket sort is a linear time algorithm. Input is random\
    \ and is distributed evenly in the interval [0, 1] the range is divided into n\
    \ equal intervals. (see [Figure 2.7](#bodymatter-002.xhtml_b_9783110693607-002_fig_007)).\
    \ These intervals are called buckets. As the input is uniformly distributed, it\
    \ is not expected that many numbers fall into one bucket. In bucket sort, first\
    \ all the buckets are sorted individually and then concatenate them to get sorted\
    \ array.\n\n![](graphic/converted/b_9783110693607-002_fig_007.png)\n\nFigure 2.7:\
    \ Uniform distribution.\n\n**Algorithm:** `BucketSort(Ar)`\n\n```\n {\n     size\
    \ = length[Ar];\n     for k: 1 to size do\n          insert Ar[k] into List Bu[size\
    \ Ar [k]];\n     for k = 0 to (size-1) do\n          sort bucket Bu[k] with insertion\
    \ sort;\n     Combine Bu[0], Bu[1],…Bu[size-1], in order.\n}\n```\n\nTo see how\
    \ `BucketSort` works, consider two elements `Ar[p]` and `Ar[q]`. If both the elements\
    \ fall in the same bucket, they follow comparative order in the sorted array because\
    \ insertion sort arranges the buckets. Let us assume that these elements fall\
    \ into diverse buckets, `Bu[p']` and `Bu[q']`, respectively, and suppose without\
    \ loss of generality that `p' < q'`. When the buckets are combined, `Bu[p']` comes\
    \ before `Bu[q']`, and therefore `Ar[p]` precedes `Ar[q]`.\n\n### 2.9.1 Analysis\
    \ of bucket sort\n\nIf `n[i]` be the random variable, it denotes the number of\
    \ elements fall into bucket `Bu[i]`. To assess this summation, we have to find\
    \ the distribution of each `i`. The probability of falling an element in `i`th\
    \ bucket is 1/n. This is the same as “Balls-and-Bin” problem. Hence, the probability\
    \ follows binomial distribution, which has Mean: `E[n[i]] = np = n*1/n = 1`. Variance:\
    \ `Var(n[i]) = npq = n*(1/n)*(1-1/n) = 1 - 1/n`.\n\n`E[n[i]2] = Var(n[i]) + {E[n[i]]}^2\
    \ = 1 - 1/n + 1 = 2 - 1/n`.\n\n`E[T(n)] = θ(n) + sum_{i=0}^{n-1} O(n[i]2)` in\
    \ order `BucketSort` is `θ(n) = O(n)`. Therefore, the entire `BucketSort` algorithm\
    \ runs in expected time.\n\n**Example 2.7:** Sort the array A = {0.23, 0.37, 0.15,\
    \ 0.18, 0.34, 0.88, 0.78, 0.38, 0–99, 0.92}\n\nN = 10, the elements 0.34, 0.37,\
    \ 0.38 mapped at i = 3\n\n![](graphic/converted/b_9783110693607-002_ingr_002.png)\n\
    \n![](graphic/converted/b_9783110693607-002_fig_008.png)\n\nFigure 2.8: Example\
    \ of Bucket Sort.\n\n### 2.9.2 Binomial distribution\n\n$\\begin{matrix} {{Var(n_{i})\
    \ = E({n_{i}}^{2})} - {\\lbrack E(n_{i})\\}^{2}}} \\\\ {{Var(x_{i}) = npq = {(1}\
    \ - \\frac{1}{n})} \\end{matrix}$`E(n[i]²) = Var(n[i]) + {E(n[i])}^2 = 1 - 1/n\
    \ + 1 = 2 - 1/n``E(n[i]) = np = n*.1/n = 1`\n"
