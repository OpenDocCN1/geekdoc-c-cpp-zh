    \ heap property and this heap is called *max heap*. In contrast to this, in *min\
    \ heap*, the value is as small as its children.\n\n**Vertex level order index:**\
    \ If p is the root then index (p) = 1, and if lc is left child of vertex p, then\
    \ index (lc) = (index p)*2\\. If rc is right child of same vertex p, then index\
    \ (rc) = 1 + (index p)*2.\n\n![](graphic/converted/b_9783110693607-002_fig_004.png)\n\
