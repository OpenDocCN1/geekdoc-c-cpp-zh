    ## 3.5 Amortized analysis


    In amortized analysis, the time required to perform a sequence of data structure
    operations is average of all operation performed. It is different from average
    case analysis since it such analysis probability doesn’ involves. We computer
    an upper bound `T(n)` on total cost of a sequence of `n` operations. Then the
    average cost per operation is `T(n)/n`. This average cost is taken as amortized
    cost so that all operations have the same amortized cost.


    ### 3.5.1 Aggregate method


    In aggregate analysis, a series of `n` operations consumes worst-case time `T(n)`
    in total. In worst case, the average case or amortized cost per operation is `T(n)/n`.


    ### 3.5.2 The potential method


    The potential method stands for prepaid efforts as potential that can be released
    to pay for future operations. Assume that `DS[0]` is the starting data structure
    on which `n` operations are carried out and the result of applying the `i^{th}`
    operation is the data structure `DS[i]` and `c[i]` be the actual cost of the `ith`
    operation. A potential function maps each `DS[i]` to a real number `ϕ(DS[i])`
    which is the potential related with that data structure.


    The amortized cost `c[i]^` of `i[th]` operation can be defined as,


    ```

    \begin{matrix} & {c_{i}^{\text{\textbackslash\textasciicircum}} = \, c_{i}\, +
    \,{\Delta\phi_{i}}} \\ & {\Delta\phi_{i}\, = \,\phi\,{(DS_{i}})\, - \,\phi(DS_{i
    - 1})} \end{matrix}

    ```


    So the amortized cost of each operation is sum of actual cost and the increase
    in potential. The total amortized cost will be (for `n` operations),


    ```

    \begin{matrix} & {\sum\limits_{i = 1}^{n}c_{i}^{\text{\textbackslash\textasciicircum}}
    = \sum\limits_{i = 1}^{n}{(c}_{i}^{} + \phi(DS_{i}) - \phi(DS_{i - 1}))} \\ &
    {\mspace{4460mu} = \sum\limits_{i = 1}^{n}c_{i}^{} + \phi(DS_{n}) - \phi(DS_{0}))}
    \\ & {if\,\phi(DS_{n}) \geq \phi(DS_{0}{)\ Then\,,total\, amortized}} & {{cost}\sum\limits_{i
    = 1}^{n}c_{i}^{\text{\textbackslash\textasciicircum}}{\,{is\, an\, upper\, bound\,
    on\, the\, total\, actual\, cost}}\sum\limits_{i = 1}^{n}c_{i}^{}} \end{matrix}

    ```


    If `ϕ(DS[i])` − `ϕ(DS[i−1])` > 0, then the amortized cost `c[i]^` represents an
    overcharge to the `ith` operation and the potential of data structure increases.
    If potential difference is negative then the amortized cost `Ĉ[i]` represents
    an undercharge of the `ith` operation and actual cost of the operation is paid
    by the decrease in the potential.


    **Example 3.7:** There are three stack operations, PUSH, POP, and MULTIPOP. PUSH
    simply places an element on the top of the stack and POP operation deletes an
    element from the stack. MULTIPOP operation deleted multiple elements at once.
    Define a potential function `ϕ` on the stack to be the number object in the stack.
    For empty stack


    ```

    \begin{matrix} & {\phi(DS_{o}) = 0\quad\quad\quad\quad\quad\phi(DS_{i}) \geq 0\,{The\,\,
    number\,\, of\,\, object\,\, in\,\, negative}.} \\ & {{Since}\,\phi(DS_{o}) =
    0} \\ & {\Rightarrow\phi(DS_{i}) \geq \phi(DS_{o})} \end{matrix}

    ```


    Thus, the total amortized cost of `n` operation with respect to `ϕ` represents
    upper bound on actual cost. If the `ith` operation on stack is PUSH, while stack
    contains `p` objects then the potential difference will be `ϕ(DS[i])` − `ϕ(DS[i−1])`
    = p+1. The amortized cost of PUSH operation is


    ```

    \begin{matrix} & {c_{i}^{\text{\textbackslash\textasciicircum}} = c_{i}} + \phi(DS_{i})
    - \phi(DS_{i - 1})} & {c_{i}^{\text{\textbackslash\textasciicircum}} = 1 + 1 =
    2 \in O{(1)}} \end{matrix}

    ```


    Wait, objects are popped off the stack. The actual cost of the operation is `k''`
    potential difference, `ϕ(DS[i])` − `ϕ(DS[i−1])` = −k''. Thus the amortized cost
    of MULTIPOP,


    ```

    \begin{array}{l} {{\hat{c}_{i}}^{i} = c_{i} + \phi(DS_{i}}) - \phi(DS_{i - 1})}
    \\ {{\hat{c}_{i}}^{i} = k'' - k'' = 0}\end{array} own```


    Similarly, the amortized cost of an ordinary POP operation is 0. The amortized
    cost of each operation is O(1). So total amortized cost of `n` operations will
    be O(n).


