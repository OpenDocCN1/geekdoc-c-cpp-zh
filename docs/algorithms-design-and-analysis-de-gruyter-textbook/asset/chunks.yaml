    \ the corresponding manipulation on a min heap. How does the running time of `MIN-HEAPIFY`\
    \ compare to that of `MAX-HEAPIFY`?\n\n8. Explain the quick sort calculation with\
    \ a model and furthermore draw the tree structure of the recursive calls made.\n\
    \n9. Analyze the productivity of quick sort calculation.\n\n10. Explain the merge\
    \ sort calculation with a model and furthermore draw the tree structure of the\
    \ recursive calls made.\n\n11. Analyze the effectiveness of merge sort calculation.\n\
    \n12. Give the insertion sort calculation and break down the effectiveness.\n\n\
    13. What is heap? What are the various kinds of heaps?\n\n14. Explain how would\
    \ you develop heap?\n\n15. Explain the heap sort calculation with a model.\n\n\
    16. Explain the Horspool’s calculation with a model.\n\n17. Sort the following\
    \ array\n    90, 194, 245, 44, 23, 19, 60, 39, 76, 14, 1, 8, 54\n    utilizing\
    \ every one of the accompanying strategies:\n    1. Merge sort\n    2. Quick sort\n\
    \    3. Insertion sort\n    4. Selection sort\n    5. Heap sort\n    Further,\
    \ tally the quantity of activities by each arranging technique.\n\n18. Write an\
    \ algorithm for quick sort for isolating the variety of components which is to\
    \ be arranged and, furthermore, write the calculation for converging in the wake\
    \ of arranging.\n\n# Chapter 3: Algorithm design techniques\n\nThis chapter presents\
    \ techniques to design algorithms which are based on: greedy technique, dynamic\
    \ programming, backtracking approach, and branch-and-bound method. Amortized analysis\
    \ process is also discussed in this chapter.\n\n## 3.1 Greedy approach\n\nGreedy\
    \ approach is perhaps the simplest of production techniques. This is usually used\
    \ to solve optimization issues, such as finding the shortest path through a network\
    \ from one node to the next and choosing the best order for s series of jobs to\
    \ be performed on a computer. In greedy approach, we make the option that looks\
    \ better in the current situation. Greedy algorithm works by choosing the most\
    \ promising solution at any instant. It never reassesses this decision, whatsoever\
    \ condition may arise later. It follows the concept of the `current best`.\n\n\
    ### 3.1.1 Traveling salesman problem\n\nIn Traveling Salesman Problem, a salesperson\
    \ has to visit n places or cities, in such a manner that all the cities must be\
    \ visited only once and in the end, he returns to the city from where he starts,\
    \ with minimum cost. The greedy approach uses the concept of `Nearest neighbor`\
    \ and selects the city which is closest to the current city.\n\n**Example 3.1:**\
    \ The distance matrix for given complete graph G (refer figure 3.1).\n\n![](graphic/converted/b_9783110693607-003_ingr_001.png)\n\
    ![](graphic/converted/b_9783110693607-003_fig_001.png)\n\nFigure 3.1: A Graph\
    \ G and its Distance Matrix.\n\nV1-V5-V2-V3-V4-V1\nTour cost: –12 + 14 + 15 +\
    \ 16 + 16 = 73,\n\n### 3.1.2 Fractional knapsack problem\n\nWe have to place n\
    \ objects in a given knapsack. The knapsack capacity is W. Weight of the ith object\
    \ is `w[i]`, if a fraction `x[i]` (0 ≤ `x[i]` ≤ 1) of ith item is chosen to fill\
    \ the knapsack then the profit earned is `v[i]x[i]`, where `v[i]` is the value\
    \ earned by placing ith item. The aim is to fill up the knapsack so that the profit\
    \ will be maximum. Then linear programming problem (LPP) for above problem will\
    \ be,\n\n$\\begin{matrix} & {{z =}\\sum\\limits_{i = 1}^{n}{v_{i}x_{i}}} \\\\\
    \ & {{such\\, that}\\,\\,\\sum\\limits_{i = 1}^{n}{w_{i}x_{i}} \\leq W} \\\\ &\
    \ {{and\\,}0 \\leq x_{i} \\leq 1,\\ 1 \\leq i \\leq n} \\end{matrix}$\n\n**Algorithm:**\
    \ `Greedy-Knapsack(W, n)`\n\n// v [1: n] is the value array, w [1: n] is the weight\
    \ array and x[1:n] contains the fractional value of objects placed in knapsack.\
    \ The objects are sorted in increasing order s. t.\n\n$\\frac{v[i]}{w[i]} \\geq\
    \ \\frac{v[i + 1]}{w[i + 1]}$\n\n```\n {\n     for k : = 1 to n do\n         \
    \          x[k]: = 0.0;\n     U: = W;\n     for k: = 1 to n do\n             \
    \      {\n                           if (w[k] > U) Then break;\n             \
    \              x[k]:=1.0; U: = U-w[k];\n                   }\n     if(k ≤ n) Then\
    \ x[k]: = U/w[k];\n}\n```\n\nThe time complexity of the algorithm is O(n).\n\n\
    **Example 3.2:** Solving the given fractional knapsack problem with greedy approach\
    \ (see table 3.1). Capacity of knapsack W = 16, Number of items is 4, the value\
    \ and weights are given in the table.\n\nArranging items in order $\\frac{v[i]}{w[i]}\
    \ \\geq \\frac{v[i + 1]}{w[i + 1]}$ (see table 3.2)\n\nTable 3.1:List of items\
    \ to be filled in knapsack.\n\n| Item (i) | v[i] | w[i] | v[i]/w[i] |\n| --- |\
    \ --- | --- | --- |\n| 1 | 10 | 5 | 2 |\n| 2 | 12 | 4 | 3 |\n| 3 | 8 | 4 | 2 |\n\
    | 4 | 20 | 5 | 4 |\n\nTable 3.2:Items arranged in order.\n\n| Item (i) | v[i]\
    \ | w[i] | v[i]/w[i] |\n| --- | --- | --- | --- |\n| 1 | 10 | 5 | 2 |\n| 2 | 12\
    \ | 4 | 3 |\n| 3 | 8 | 4 | 2 |\n| 4 | 20 | 5 | 4 |\n\n![](graphic/converted/b_9783110693607-003_fig_002.png)\n\
    Figure 3.2: Solving the fractional knapsack problem with greedy approach.\n\n\
    ## 3.2 Backtracking\n\nAmerican mathematician D. Lehmer first proposed the term\
    \ `backtrack` in the 1950s. The language SBOL (1962) was the first to provide\
    \ built-in backtracking. This approach is specially applied to NP-complete problems.\
    \ The key point of backtracking is binary choice `Yes` or `No`, whenever backtracking\
    \ has choice `No`, that means the algorithm has encountered a dead end. And it\
    \ backtracks one step and tries a different path for choice `Yes`. Thus earned.\n\
    \n### 3.2.1 Hamiltonian cycle\n\nHamiltonian cycle of a graph is a circuit that\
    \ passes just once through each vertex of the graph,\n\nor\n\nHamiltonian cycle\
    \ is a graph round trip path in which each vertex is visited exactly once and\
    \ returns to its starting point. Such graph is called Hamiltonian graph (see figure\
    \ 3.3).\n\n![](graphic/converted/b_9783110693607-003_fig_003.png)\n\nFigure 3.3:\
    \ Graph G with Hamiltonian cycle (in lines).\n\nWithout lack of generality, we\
    \ can conclude that there is a Hamiltonian loop and it begins to form vertex “a”\
    \ (Figure 3.4(a)) and we make vertex “a” root of the space tree in body (figure\
    \ 3.4 (b)).\n\n![](graphic/converted/b_9783110693607-003_fig_004.png)\n![](graphic/converted/b_9783110693607-003_fig_200.png)\n\
    ![](graphic/converted/b_9783110693607-003_fig_201.png)\n\nFigure 3.4: (a) A Graph,\
    \ (b) Space Tree for Hamiltonian Cycle, (c) Hamiltonian Cycle.\n\nLet us use alphabetic\
    \ order to break the tie between the vertices adjacent to a, we select the vertex\
    \ b, then c, then d, and then e and finally to f which proves to be a dead end.\
    \ So backtrack algorithm from f to e, and then to d and then c.\n"
