    \n### 4.4.2 Floyd Warshall’s algorithm\n\nIn Floyd Warshall’s algorithm, a matrix\
    \ called distance matrix L[nxn] is used to store the length of shortest path between\
    \ vertices, where pq^(th) cell denotes the shortest path length between vertex\
    \ v[p] to v[q] and 1 ≤ p, q ≤ n. One advantage of this algorithm is that it can\
    \ be applied to both directed and nondirected graph. The matrix L of a weighted\
    \ graph with n vertices is computed through a sequence of n x n matrices.\n\n\
    *L*^((0)), *L*^((1)), *L*^((2))………*L*^((*r*))……..*L*^((*n*))\n\nMatrix L^r (r = 0,\
    \ 1, … … n) is equal to the length of the shortest path among all the paths from\
    \ the pth vertex to qth vertex with each intermediate vertex if any, number not\
    \ more than r. The time complexity of algorithm is O(n³) due to three nested for\
    \ loops.\n\n**Algorithm:** *Floyd-Warshall(W)*\n\n// Input: The weight matrix\
    \ W\n\n// Output: The distance matrix L of the shortest path lengths\n\n {\n\n\
      L: = W //W = L^((0))\n\n  for r: =1 to |V| do\n\n  {\n\n    for p: =1 to |V|\
    \ do\n\n    {\n\n      for q: =1 to |V| do\n\n      {\n\n        L[p,q]: =Min\
    \ (L[p, q], L[p, r]+L[r, q]);\n\n      }\n\n    }\n\n  }\n\n  Return L;\n\n }\n\
    \n**Complexity:** The running time complexity of Floyd Warshall’s algorithm is\
    \ O(n³).\n\n**Example 4.5:**\n\n![](graphic/converted/b_9783110693607-004_ingr_006.png)\n\
    \n### 4.4.3 Dijkstra algorithm\n\nIt is a single-source shortest path algorithm;\
    \ we have to identify the shortest path from a source vertex to all the remaining\
    \ vertices of the graph. Dijkstra’s algorithm follows greedy approach in that\
    \ it always chooses the most obviously attractive next step; This algorithm is\
    \ applicable to graph with positive weights.\n\nFor ease, we suppose that the\
    \ vertices of graph or digraph are numbered from 1 to n, where 1 is the vertex\
    \ from which minimum distances to the other vertices are required. There are n\
    \ main steps, at the rth of which we have a set S of r vertices such that the\
    \ minimum distances from 1 to members of S are definitely known, and the next\
    \ step is adjoining one of the remaining vertices to S. After step n, we definitely\
    \ know the minimum distances from 1 to all other vertices, and the algorithm terminates.\n\
    \nIn this algorithm, a set S is used to store vertices for which ultimate sorted\
    \ path length from the source “A” have been found by now. Next the vertex u ∈\
    \ V–S is selected with the minimum shortest path estimate, adds u to S and relaxes\
    \ all edges leaving u, this process goes on repetitively until we find shortest\
    \ path to all the vertices.\n\n**Algorithm:** *Dijkstra(G, A)*\n\n*// Input: A\
    \ graph G and source vertex A.*\n\n*// Output: The length d[v] of a shortest path\
    \ from A to v and its penultimate vertex pr[v] for every v in V*\n\n```\n {\n\
      for all v in V do\n   dv: == ∞: prv = Null;\n  Q=V;\n  dA: =0;\n  VT=Ф;\n  for\
    \ i = 0 to n-1 do\n     c* := Min-Priority(Q);\n     VT = VT U{c*};\n     For\
    \ all c adjacent to c* do\n     If dc*+ w (c*,c)<dc\n     dc = dc*+w (c*,c)\n\
        prc : = c* //calculate priority\n }\n```\n\nThe time efficiency of Dijkstra’s\
    \ algorithm depends on the data structure used for implementing priority queue\
    \ and for representing the graph itself. If graph is represented by adjacency\
    \ list and the priority queue implements as a min heap. Its complexity will be\
    \ O(|E|log[2] |V|).\n\n**Example 4.6:** Find the single-source shortest path of\
    \ the following graph ([figure 4.11](#bodymatter-004.xhtml_b_9783110693607-004_fig_011)).\n\
    \n![](graphic/converted/b_9783110693607-004_ingr_007.png)\n\n**Figure 4.12:**\
    \ Graph G.\n\n| S | d[1] | d[2] | d[3] | d[4] | d[5] | d[6] | Array of previous\
    \ vertices |\n\n| --- | --- | --- | --- | --- | --- | --- | --- |\n\n|  |  | \
    \ |  |  |  |  | 1 | 2 | 3 | 4 | 5 | 6 |\n\n| --- | --- | --- | --- | --- | ---\
    \ | --- | --- | --- | --- | --- | --- | --- |\n\n| **{1}** | 0 | 2 | ∞ | ∞ | ∞\
    \ | 5 |  | 1 |  |  |  | 1 |\n\n| **{1,2}** | 0 | 2 | 6 | ∞ | 5 | 4 |  | 1 | 2\
    \ |  | 2 | 2 |\n\n| **{1,2,6}** | 0 | 2 | 6 | ∞ | 5 | 4 |  | 1 | 2 |  | 2 | 2\
    \ |\n\n| **{1,2,5,6}** | 0 | 2 | 6 | 11 | 5 | 4 |  | 1 | 2 | 5 | 2 | 2 |\n\n|\
    \ **{1,2,3,5,6}** | 0 | 2 | 6 | 10 | 5 | 4 |  | 1 | 2 | 3 | 2 | 2 |"
