    \n增路：`s → X → W → t`。\n\n`s → X → W → t` 的剩余容量 = `min (4, 3, 5)` = `3`。\n\n**初始**\n\
    \n![](img/b_9783110693607-004_ingr_010b.png)\n\n增路路径：`s → X → t`\n\n`s → X → t`\
