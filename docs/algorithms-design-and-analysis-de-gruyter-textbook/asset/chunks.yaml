    \ `D(v)` 被维护为从源 `S` 到 `v` 的最短路径的最大值，被称为最短路径估计。该属性由图中的所有顶点维护。最短路径估计和前驱节点通过以下过程初始化。\n\
    \n**算法：** `Initialize-Single-Source (G, S)`\n\n```\n {\n    for all vertices q∈V\
