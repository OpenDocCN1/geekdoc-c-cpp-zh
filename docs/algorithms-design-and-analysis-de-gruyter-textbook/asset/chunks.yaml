    **解：**


    方程 `t² − 6t − 9 = 0` 的根为 3 和 3。


    因此，相关部分的解为 `a[n]^H = (A[1] + A[2]n).3^(n)`（注：原文此处公式可能有误，根据逻辑应为包含 n 的项）。由于 `a =
    2` 不是特征方程的根，根据情况 (ii)，试验解为 `PS = A.2^n`。


    （注：原文此处逻辑描述混乱，此处按要求保留翻译）。


