    ### 1.6 Recurrence relation


    Consider a sequence $S = \{s_0, s_1, s_2, \dots\}$ up to infinite; a recurrence
    relation for $S$ is an equation in which the general term $s_n$ can be defined
    in terms of previous terms $s_0, s_1, \dots$. In Mathematics, a recurrence relation
    is a condition that recursively characterizes each term as a component of the
    former terms.


    **Example 1.5:**

    a) $s_n - cs_{n-1} + ds_{n-2} = 3^n$ (in homogeneous recurrence relation with
    constant coefficient)

    b) $s_n = c(n/d) + f(n)$ (recurrence relation in divide and conquer (DAC) form)

    c) $s_n2 - cs_{n-1} + ds_{n-2} = 3^n$ (nonlinear relation)

    d) $F_n = F_{n-1} + F_{n-2}$ (Fibonacci relation). Solving a recurrence relation
    means to identify the sequence for which the recurrence exists.


    #### 1.6.1 Linear recurrence relation


    A recurrence relation in form:

    $a_n + b_1 a_{n-1} + b_2 a_{n-2} + \dots + b_k a_{n-k} = f(n), n \geq k$

    where $b_1, b_2, \dots, b_k$ are all constants and $f(n)$ is some function of
    $n$, known as linear recurrence relation with constant coefficient. If $f(n) =
    0$, then the relation is identified as homogeneous recurrence relation, otherwise
    nonhomogeneous recurrence relation. The degree of recurrence relation (1.1) is
    $k$, $a_n$ is $(n+1)$-th term of the sequence.


    #### 1.6.2 Solution of homogeneous recurrence relation


    **(a) Characteristic equation method**


    The characteristic equation method is developed from the generating function method.
    For sequence $\{a_n\}_0^\infty$, the generating function is $A(x)$, then we have

    $A(x) = \sum_{n=0}^{\infty} a_n x^n$


    Further, for a given recurrence relation, we can express $A(x)$ as

    $A(x) = N(x)/D(x)$.


    $D(x)$ is an important expression for recurrence relation:

    $a_n + b_1 a_{n-1} + b_2 a_{n-2} + \dots + b_k a_{n-k} = 0$


    $D(x)$ will be

    $(1 + b_1 x + b_2 x^2 + \dots + b_k x^k)$


    Then characteristic polynomial will be

    $C(t) = t^k \cdot D(1/t)$


    The characteristic equation will be $C(t) = 0$.

    That is,

    $t^k + b_1 t^{k-1} + b_2 t^{k-2} + \dots + b_k = 0$


    (1) *When the roots are all distinct*


    Let the roots be $\alpha_1, \alpha_2, \alpha_3, \dots, \alpha_k$, then solution
    of recurrence relation will be

    $a_n = A_1\alpha_1^n + A_2\alpha_2^n + A_3\alpha_3^n + \dots + A_k\alpha_k^n$

