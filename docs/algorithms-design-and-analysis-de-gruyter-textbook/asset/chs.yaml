  \t\t\tp++;\n\t\t\ti++;\n\t\t}\n\t\twhile(j<=high)\n\t\t{\n\t\t\tt[p]=a[j];\n\t\t\
  \tp++;\n\t\t\tj++;\n\t\t}\n\t\tfor(i=low;i<=high;i++)\n\t\t{\n\t\t\ta[i]=t[i-low];\n\
  \t\t}\n\t}\n}\n```\n\n### 5. 快速排序程序\n\n```c\n #include<stdio.h>\n#include<conio.h>\n\
