  }\n```\n\n### 2. 使用冒泡排序的数组程序\n\n```c\n // 冒泡排序\n#include <stdio.h>\n#include <conio.h>\n\
  void bubble_sort(int *arr,int n);\nint main(void)\n{\n\tint *arr,n;\n\tclrscr();\n\
