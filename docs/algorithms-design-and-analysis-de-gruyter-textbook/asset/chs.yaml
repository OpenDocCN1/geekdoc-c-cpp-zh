  \ *arr,int n)\n{\n\tint *arr,k,j,temp,n;\n\tfor(i=0;i<n;i++)\n\t{\n\t\tfor(j=0;j<n-1;j++)\
  \ // 元素比较\n\t\t\tif(arr[j]>arr[j+1])\n\t\t\t{\n\t\t\t\ttemp=arr[j];\n\t\t\t\tarr[j]=arr[j+1];\n\
  \t\t\t\tarr[j+1]=temp;\n\t\t\t}\n\t}\n\n\n### 3. 堆排序程序\n\n```c\n#include <stdio.h>\n\
  #include <conio.h>\nvoid reheap(int *a,int p,int s);\nvoid heapsort(int a[],int\
  \ s);\nvoid main()\n{\n\tint *a,i,l;\n\tprintf(\"\\n 输入限制:\");\n\tscanf(\"%d\",&l);\n\
  \ta=(int *)malloc(l*sizeof(int));\n\tprintf(\"\\n 输入数字:\");\n\tfor(i=0;i<l;i++)\n\
  \t{\n\t\tscanf(\"%d\",a[i]);\n\t}\n\theapsort(a,l);\n\tfor(i=0;i<l;i++)\n\t{\n\t\
  \tprintf(\"\\n%d\",a[i]);\n\t}\n\tgetch();\n}\nvoid heapsort(int a[],int s)\n{\n\
  \tint i,t;\n\tfor(i=s/2;i>=1;i--)\n\t\treheap(a,i,s);\n\tfor(i=s-1;i>=1;i--)\n\t\
  {\n\t\tt=a[i];\n\t\ta[i]=a[0];\n\t\ta[0]=t;\n\t\treheap(a,1,i);\n\t}\n}\nvoid reheap(int\
  \ *a,int p,int s)\n{\n\tint t=a[p-1];\n\tint c=2*p;\n\twhile(c<=s)\n\t{\n\t\tif(c<s\
  \ && a[c-1]<a[c])\n\t\t\tc=c+1;\n\t\tif(t>a[c-1])\n\t\t\tbreak;\n\t\ta[c-1]=a[c];\n\
  \t\tc=2*c;\n\t}\n\ta[c-1]=t;\n}\n```\n\n### 4. 合并排序程序\n\n```c\n#include<stdio.h>\n\
  #include<conio.h>\nvoid mergesort(int a[],int low,int high);\nvoid main()\n{\n\t\
