  \tfor(i=0;i<n;i++)\n\tprintf(\"\\n%d\",arr[i]);\n\tgetch();\n}\nvoid mergesort(int\
  \ a[],int low,int high)\n{\n\tint mid,i,j,p,*t;\n\tif(low>=high)\n\treturn;\n\t\
  else\n\t{\n\t\tmid=(int)(low+high)/2;\n\t\tmergesort(a,low,mid);\n\t\tmergesort(a,mid+1,high);\n\
  \t\ti=low;\n\t\tj=mid+1;\n\t\tp=0;\n\t\tt=(int*)malloc((high-low+1)*sizeof(int));\n\
  \t\twhile((i<=mid)&&j<=high)\n\t\t{\n\t\t\tif(a[i]<a[j])\n\t\t\t{\n\t\t\t\tt[p]=a[i];\n\
