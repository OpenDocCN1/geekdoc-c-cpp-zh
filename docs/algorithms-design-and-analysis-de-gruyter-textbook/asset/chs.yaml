- "# 算法：设计与分析 (De Gruyter 教科书)\n\n\n\n![](img/mark_cov_9783110693416.png)\n\n![epub-cover-image](img/mark_cov_9783110693416.png)\n\
  \n\n\n\n\n![](img/de-gruyter.png)\n\n\n\n\n\n\n## 6.4.1.4 在二项堆中插入节点\n\n算法：`Binomial-Heap-Insert\
  \ (T, x)`\n\n```\n {\n  T’←Make-Binomial-Heap();\n  P[x]←NIL;\n  child[x]←NIL;\n\
    sib[x]←NIL;\n  deg[x]←0;\n  head[T’←x;\n  T←Binomial-Heap-Union(T, T’);\n}\n```\n\
  \n该算法运行时间为 $O(\\log n)$。二项堆 $T'$ 的创建需要 $O(1)$ 时间，$n$ 个节点的合并需要 $O(\\log n)$。\n\n\
  ## 6.4.1.5 减小特定键\n\n以下算法将节点 $a$ 的键减小为新键 $d$。如果 $d$ 大于 $a$ 当前的键，则显示错误。\n\n算法：`BH-Decrease-Key\
  \ (T, a, d)`\n\n```\n {\n  If d  > key[a]\n    显示‘decrement possible’;\n  key[a]←d;\n\
    b←a;\n  c←p[b];\n  while c  ≠ NIL and key[b]  < key[c]\n    do exchange[b]↔key[c];\n\
      b←c;\n  c←p[b];\n}\n```\n\n此过程需要 $O(\\log n)$ 时间，因为 $a$ 的最大深度为 $\\log k$，其中\
  \ $k=\\log n$。\n\n## 6.4.1.6 删除\n\n此过程从二项堆 $T$ 中删除键 $x$，假设没有键的值为 $-\\infty$。\n\n\
  `Binomial-Heap-Delete(T, x)`\n`BH-Decrease-Key(T, x,-∞)`\n`Binomial-Heap-Min(T)`。\n\
  \n此过程的运行时间为 $O(\\log n)$。\n\n## 6.5 斐波堆\n\n斐波堆是堆树的排列。树不需要是二项的。在斐波堆中，树是无序的。每个节点 $x$\
  \ 包含一个指向其父节点的指针 `parent[x]` 和一个指向其任意子节点的指针 `child[x]`。使用双向链表连接 $x$ 的子节点。此列表被称为 $x$\
  \ 的子列表。\n\n![](img/b_9783110693607-006.jpg)\n\n图 6.6：二项堆。使用双向链表的优势如下：\n\n1. 可以在\
  \ $O(1)$ 时间内从列表中移除节点。\n2. 两个双向链表可以在 $O(1)$ 时间内合并。\n\n使用指针 `min[H]` 访问堆 $H$。该指针指向键最小的树根；这是堆的最小节点（见图\
  \ 6.7）。如果该指针为 NIL，则堆为空。\n\n### 6.5.1 斐波堆上的操作\n\n#### 6.5.1.1 新的斐波堆：`MAKE_FIB_HEAP`\n\
  \n此过程分配并返回斐波堆对象 $H$，其中 $n[H]=0$，`min[H]=NIL`。此过程的时间要求为 $O(1)$。\n\n#### 6.5.1.2 插入节点\n\
  \n将节点 $a$ 插入斐波堆 $H$，假设节点已经分配且 `key[a]` 已经填充。\n\n算法：`Fibo-Heap-Insert (H, a)`\n\n\
  ```\n {\n  deg[a]←0;\n  parent[a]←NIL;\n  child[a]←NIL;\n  left[a]←a;\n  right[a]←a;\n\
    mark[a]←FALSE;\n  将包含 a 的根列表与根列表 H 合并\n  if min[H]  = NIL or key[a]  < key[min[H]]\n\
      则 min[H]←a;\n  n[H]←n[H]  + 1\n}\n```\n\n#### 6.5.1.3 寻找最小节点\n\n指针 `min[H]`\
  \ 指向堆最小节点的根，它也是堆的最小节点。可以在 $O(1)$ 时间内直接访问。\n\n![](img/b_9783110693607-006_fig_007.png)\n\
  \n图 6.7：一个斐波堆。![](img/b_9783110693607-006_fig_008.png)\n\n图 6.8：寻找最小节点。\n\n####\
  \ 6.5.1.4 减键\n\n该操作将节点 $a$ 的键赋值为新键 $d$，使得新键小于等于当前键。\n\n算法：`DECREASE_KEY (T, a, d)`\n\
  \n//此过程使用 `CUT` 和 `CASCADE-CUT` 来维护属性。\n\n```\n {\n  If d  > key[a]\n    显示‘not\
  \ possible’;\n  key[a]←d;\n  b←a;\n  c←p[b];\n  while c  ≠ NIL and key[b]  < key[c]\n\
      do exchange[b]↔key[c];\n    b←c;\n  c←p[b];\n}\n```\n\n此过程需要 $O(\\log n)$ 时间，因为\
  \ $a$ 的最大深度为 $\\log k$，其中 $k=\\log n$。\n\n算法：`CUT (H, x, y)`\n\n//此过程切断 $x$ 与其父节点（即\
  \ $y$）的连接，使 $x$ 成为根节点。\n\n```\n {\n  从 y 的子列表中移除 x。\n  deg[y] ←deg[y]‒1;\n  将 x\
  \ 添加到 H 的根列表中。\n  Parent[x] ←NIL;\n  Mark[x]←False;\nReturn x.\n}\n```\n\n算法：`CASCADE-CUT\
  \ (H, y)`\n\n$z←Parent[y]$；\n\nIf $(z≠NIL)$ then\n\n   If(mark[y]=False) then\n\n\
       Mark[y]←True;\n   Else\n     CUT(H, y, z);\n     CASCADE-CUT(H, z);\n\nReturn;\n\
