  md: '# 324 WAVELETS IN BOUNDARY VALUE PROBLEMS


    At any scale $s$ the discretization step is $1/2^s$ which, for $s > 0$, gives
    $2^s$ number of segments in $[0, 1]$. Therefore, to have at least one inner wavelet,
    the following-condition must be satisfied:


    ```

    $2^s \geq 2m-1. \quad (10.59)$

    ```


    Let $s_0$ be the scale for the condition (10.59) is satisfied. Then for each $s
    \geq s_0$, let us defining the scaling functions $\phi_{m,k,s}$ of order $m$ as


    ```

    $$\begin{aligned} B_{m,k,s_0}(2^{-s_0}x), & k=-m+1, \dots, -1; \ \phi_{m,k,s}(x)
    := B_{m,2^s-m-k,s_0}(1-2^{s-s_0}x), & k=2^s-m+1, \dots, 2^s-1; \ B_{m,0,s_0}(2^{2-s_0}x-2^{-s_0}k),
    & k=0, \dots, 2^s-m, \end{aligned} \quad (10.60)$

    ```


    and the wavelets $\Psi_{m,k,s}$ as


    ```

    $$\begin{aligned} \Psi_{m,k,s_0}(2^{-s_0}x), & k=-m+1, \dots, -1; \ \Psi_{m,k,s}(x)
    := \Psi_{m,2^s-2m+1,s_0}(1-2^{s-s_0}x), & k=2^s-2m+2, \dots, 2^s-m; \ \Psi_{m,0,s_0}(2^{2-s_0}x-2^{-s_0}k),
    & k=0, \dots, 2^s-m+1, \end{aligned} \quad (10.61)$

    ```


    Observe that the inner scaling functions $(k=0, \dots, 2^s-2m+1)$ are the same
    as those for the nonboundary case. There are $m-1$ boundary scaling functions
    and wavelets at 0 and 1, and $2^s-m+1$ inner scaling functions and $2^s-2m+2$
    inner wavelets. Figure 10.4 shows all the scaling functions and wavelets for the
    scale $s=2$. All the scaling functions for $m=4$ and $s=3$ are shown in Figure
    10.5a, while Figure 10.5b gives only the corresponding boundary wavelets near
    $x=0$ and one inner wavelet. The rest of the inner wavelets can be obtained by
    simply translating the first one whereas the boundary wavelets near $x=1$ are
    the mirror images of ones near $x=0$.


    # 10.5 SPARSITY AND ERROR CONSIDERATIONS


    The study of the effects of thresholding the matrix elements on the sparsity and
    error is the objective of this subsection. By *thresholding*, we mean setting
    those elements of the matrix to zero that are smaller (in magnitude) than some
    positive number $\delta(0\leq \delta<1)$, called the *threshold parameter*, the
    largest and the smallest elements of the matrix in (10.23). For a fixed value
    of the threshold parameter $\delta$, define percent relative-error $(\varepsilon_\delta$)
    as


    ```

    $\varepsilon_\delta := \frac{\|f_0-f_\delta\|_2}{\|f_0\|_2} \times 100, \quad
    (10.62)$

    ```'
