  md: 'design is the joint design of its two filter banks to yield a set of complex
    wavelet and scaling functions that are as close as possible to analytic.


    The filter sets $\{h_0(n), h_1(n)\}$ and $\{g_0(n), g_1(n)\}$ individually satisfy
    the perfect reconstruction (PR) condition. They are the processing filters for
    the wavelet $\psi_h(t)$ and $\psi_g(t)$, respectively. The filters are jointly
    designed such that the complex wavelet


    ```

    $$\psi_c(t) = \psi_h(t) + j\psi_g(t)$ (8.54)

    ```


    is approximately analytic—that is, $\psi_g(t)$ is approximately the Hilbert transform
    of $\psi_h(t)$. The dual-tree approach comes very close to mirroring the properties
    of the Fourier transform.


    The filters are all real-valued so that there is no complex processing in the
    implementation of complex wavelet transform. The complexity is exactly twice that
    of a 1D real-valued DWT.


    It has been shown [17] that the following conditions should be satisfied at least
    approximately by the filter banks:


    +   1. The low-pass filters $h_0$ and $g_0$ should be approximately a half-sample
    shift of each other. That is


    ```

    $g_0(n) = h_0(n-0.5)$ (8.55)

    ```


    which implies $\psi_g(t)$ is approximately the Hilbert transform of $\psi_h(t)$.
    In the spectral domain, the condition (8.55) is equivalent to the requirement


    ```

    $|G_0(z)| = |H_0(z)|; z = e^{i\omega}$

    \angle G_0(z) = \angle H_0(z)-0.5\omega$ (8.56)

    ```


    +   2. PR condition must be satisfied by the filter banks.

    3. Finite impulse response filters must be of approximately the same length.

    4. There must be good stop-band behavior.


    There are three approaches [17] to designing these filter banks.


    # 8.4.1 Linear Phase Biorthogonal Approach


    The filter $h_0$ and $g_0$ are symmetric FIR, with odd and even lengths, respectively


    ```

    $h_0(n) = h_0(N-1-n)$,

    g_0(n) = g_0(N-1)$,

    ```'
