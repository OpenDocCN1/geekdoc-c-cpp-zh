    # 8.5 LIFTING WAVELET TRANSFORM


    The lifting scheme [19] is an alternative approach to constructing wavelets and
    computing wavelet transform. Unlike the classical wavelet construction methods
    demonstrated in previous chapters that rely heavily on the Fourier transform,
    the lifting procedure for discrete wavelet transform and for wavelet construction
    is carried out entirely in the time domain. Instead of using the filter banks
    for decomposition and reconstruction of a signal, the lifting procedure uses three
    steps—namely, the split [S], the predict [P] and the update [U] to decompose a
    signal into approximation and wavelet coefficients $a_{k,s}$ and $w_{k,s}$. It
    eliminates the need for performing the convolution followed by decimation or interpolation
    followed by convolution in wavelet analysis of a signal. Instead of using the
    synthesis filters $g_0[k]$ and $g_1[k]$ to derive the analysis filters'
