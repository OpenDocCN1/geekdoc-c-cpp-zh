  md: '# 9.3 THRESHOLDING


    Thresholding is one of the most commonly used processing tools in wavelet signal
    processing. It is widely used in noise reduction, signal and image compression,
    and sometimes in signal recognition. We consider three simple thresholding methods
    [3] here: (1) hard thresholding, (2) soft thresholding, and (3) percentage thresholding.
    The choice of thresholding method depends on the application. We discuss each
    type briefly.


    # 9.3.1 Hard Thresholding


    Hard thresholding is sometimes called gating. If a signal (or a coefficient) value
    is below a preset value, it is set to zero:


    ```

    $y = \begin{cases} x, & \text{for } |x| \ge \sigma \ 0 & \text{for } |x| < \sigma,
    \end{cases} \quad (9.5)$

    ```


    where $\sigma$ is the threshold value or the gate value. A representation of the
    hard threshold is shown in Figure 9.7. Notice that the graph is nonlinear and
    discontinuous at $x = \sigma$.


    # 9.3.2 Soft Thresholding


    Soft thresholding is defined as


    ```

    $y = sgn(x)f(|x|-\sigma), \quad \text{for } |x| \ge \sigma \nn=0, \quad \text{for
    } |x| < \sigma. \quad (9.6)$

    ```


    ![](img/62a0222c021def890c636babf0dc030a_267_0.png)'
  merge: -1
  pgno: 267
- img_proc: true
  md: '![](img/62a0222c021def890c636babf0dc030a_268_0.png)


    The function $f(x)$ is generally a linear function (a straight line with slope
    to be chosen; Figure 9.8). However, spline curves of the third or fourth order
    may be used to effectively weight the values greater than $\sigma$. In some signal
    compression applications, using a quadratic spline curves of order $m > 2$ may
    affect the compression ratio by a small amount.


    # 9.3.3 Percentage Thresholding


    In certain applications such as image compression where a bit quota has been assigned
    to the compressed file, it is more advantageous to set a certain percentage of
    wavelet coefficients to zero to satisfy the quota requirement. In this case, the
    setting of the threshold value $\sigma$ is based on the histogram of the coefficient
    set and the total number of coefficients. The thresholding rule is the same as
    hard thresholding once we have determined the threshold $\sigma$.


    # 9.3.4 Implementation


    Implementations of the hard, soft, and percentage thresholding methods are quite
    simple. One simply subtracts the threshold value from the magnitude of each coefficient.
    If the difference is negative, the coefficient is set to zero. If the difference
    is positive, no change is applied to the coefficient. To implement the soft thresholding
    by using a linear function of unit slope, the thresholding rule is


    ```

    $y = \begin{cases} sgn(x)(|x|-\sigma), & \text{if } x-\sigma \geq 0, \ 0 & \text{if
    } |x|-\sigma < 0. \end{cases} \quad (9.7)$

    ```'
