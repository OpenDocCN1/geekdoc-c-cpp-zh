  md: '# 9.7.3 Canny Edge Detector


    The Canny detector is an optimized form of the Marr-Hildreth detector by finding
    the direction of the edge as well as its gradient. Canny detector uses the second
    derivative of the image along the direction of the edge [7].


    ```

    $$\D_{\nabla f} f = \frac{1}{\|\nabla f\|^2} \left[ \left(\\frac{\partial f}{\partial
    x}\right)^2 \frac{\partial^2 f}{\partial x^2} + 2\left(\\frac{\partial f}{\partial
    x}\right)\left(\\frac{\partial f}{\partial y}\right) + \left(\\frac{\partial f}{\partial
    y}\right)^2 \frac{\partial^2 f}{\partial y^2} \right]$ (9.40)

    ```


    and that of gradient


    ```

    $$\D_{\nabla f} f = \frac{1}{\|\nabla f\|^2} \left[ \left(\\frac{\partial f}{\partial
    x}\right)^2 \frac{\partial^2 f}{\partial x^2} - 2\left(\\frac{\partial f}{\partial
    x}\right)\left(\\frac{\partial f}{\partial y}\right) + \left(\\frac{\partial f}{\partial
    y}\right)^2 \frac{\partial^2 f}{\partial y^2} \right]$ (9.41)

    ```


    The procedure for locating the edge points is as follows:


    +   1. Smooth the image with a Gaussian function.

    2. Compute the gradient of the result of step 1.

    3. If the gradient is not zero, compute the function $D \frac{\nabla(G*f)}{\|\nabla(G*f)\|^2}$

    4. Search the edge points by the location of sign change of step 3.


    # 9.7.4 Wavelet Edge Detector


    As mentioned in previous chapters, wavelets acts in some sense as differential
    operators (band-pass filters). The simplest example is the Haar wavelet, which
    gives the first difference of a function.


    Wave edge detection is based on two-dimension wavelet transform of the image.
    Recall from Section 9.6 at any resolution, 2D wavelet transform provides four
    components of an image—LL, LH, HL, HH (wavelets along x and y directions); LH
    (low-pass) scaling function along x and wavelets along y); LL LL represent the
    image at lower resolution, while the others combined together gives the edges.


    As described in Chapter 6, wavelets are very good in detecting point discontinuity.
    Edges, on the other hand, represent discontinuity along a line. For edge detection,
    ridgelet transforms are better suited. However evaluation of ridgelet transform
    takes considerably more computation time. Figure 9.24 shows edges detected using
