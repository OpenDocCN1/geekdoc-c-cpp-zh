  md: '# 10.8.2 Multiresolution Time Domain (MRTD) Method


    The explosive growth in wireless communications (3G cellular systems, 802.11 WLANs)
    has spawned a great deal of research in electronic packaging for high-performance
    devices. In addition, advances in device processing are enabling the creation
    of increasingly compact microwave circuits. These circuits incorporate a high
    degree of functionality through the combination of many microwave components in
    close proximity. These advanced devices often use geometries with high aspect
    ratios, small feature size, and moving parts. The simulation of these complex
    devices requires the use of extremely small elements or cells, which can tax many
    tools beyond their limits. This has led to the use of a combination of methods,
    such as full-wave simulation and microwave circuit, or if numerical efficiency
    and accuracy are required, the use of a parallel full-wave simulator on specialized
    hardware. Time-domain full-wave techniques demonstrate numerous advantages since
    they are robust and easy to program. Furthermore, they can wideband excitations
    that allow for one simulation to cover the entire frequency band of interest and
    can easily parallelized on relatively inexpensive hardware making it possible
    to simulate large structures.


    The finite difference time domain (FDTD) [70, 71] method is one of the most mature
    and versatile time-domain numerical techniques, and it has been used for a wide
    variety of structures. The use of variable gridding along effective parallelization
    allows fine details of large structures to be modeled. Curves and diagonal elements
    be modeled using adaptive stepping. The multiresolution time-domain technique
    [54, 57] is an adaptive generalization of the FDTD technique based on the principles
    of multiresolution analysis. It makes use of wavelets to alleviate the computational
    burdens of FDTD for complex or large structures, such as multilayer packages or
    microelectromechanical systems (MEMS), where the position of the boundaries is
    time-changing and the membrane thickness is much smaller than any other detail
    in the transverse direction. The MRTD technique allows the cell resolution to
    vary with both time and position. The wavelets can be used to represent higher
    levels of detail along with higher frequency content. As fields propagate through
    the structure the resolution can be varied for the rapidly changing fields.


    equations to provide a time- and space-adaptive electromagnetic modeling scheme.
    The advantage of this method is that it can use much larger cells than similar
    methods [56], as FDTD. The number of basis functions used in each cell can be
    varied as a function of space and time [60]. In this way, grids of complex structures
    can use high-resolution cells in areas of large field variation and lower-resolution
    cells elsewhere.


    In the application of the method, the electric and magnetic fields are expanded
    into a scaling and wavelet functions and then inserted into Maxwell''s equations.
    The method of moments is then applied to these equations.'
