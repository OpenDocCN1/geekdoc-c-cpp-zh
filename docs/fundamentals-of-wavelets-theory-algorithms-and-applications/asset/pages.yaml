    the real line. If we use these functions directly to expand the unknown function
    of an integral equation, then some of the scaling functions and wavelets will
    have to be placed outside the domain of integration, necessitating the explicit
    enforcement of the boundary conditions. In signal processing, uses of these wavelets
    lead to undesirable jumps near the boundaries (see Figures 8.8–8.10). We can avoid
