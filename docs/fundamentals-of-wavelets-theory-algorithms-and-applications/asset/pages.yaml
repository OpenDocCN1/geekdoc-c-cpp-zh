    only the scaling functions—that is, we need to find only the sequence $g_0[k]$.
    In this section we obtain these sequences for semiorthogonal spline wavelets introduced
    by Chui-Wang [1]. Here the cardinal $B$-splines $N_m$ are chosen to be the scaling
    functions. We will show that a finite energy sequence $g_0[m,k]$ exists such that
    the scaling relation


    ```

