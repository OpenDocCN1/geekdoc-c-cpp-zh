    # 9.12.2 Well Log Analysis


    There are numerous examples of application of wavelets to analyze individual well
    log or a combinations thereof. These applications feature feature extraction,
    fluid identification, data compression, and image analysis.


    Definition and interpretation of sedimentary facies often involve examination
    of well logs to assess values, trends, cycles, and sudden changes. The detection
    of cyclicity in sedimentary strata may point to the factors controlling sediment
    deposition. Cycles in rock successions may deposition processes of varying complexity
    and origin. These characteristics may vary over a wide range of scales and cannot
    be easily identified from the logs using traditional methods.


    Recent developments on wavelet analysis for well logs provide a visual representation
    of signals for interpretation and good supports for stratigraphic analyses. Wavelets
    make easy detection of cyclicities, transitions, unformities, and other sudden
    changes in sedimentary successions. The continuous wavelet transform provides
    a space-scale analysis of the signal. Rever et al. [39] have used the CWT to evaluate
    the well log and core data from the Sherwood Sandstone Group, Irish Sea. The wavelet
    features extracted from several logs are processed and combined to form a feature
    vector. As a result, one can analytically identify boundaries separating the sabkha,
    dune, and fluvial intervals. The cyclic behavior within each interval, representing
    different deposition episodes, can also be identified. By neural network and genetic
    algorithm have been applied in conjunction with wavelet analysis for zone detection
    and classification [35]. Yue et al. [43] have demonstrated that by proper-depth
    (similar to time-frequency) analysis of well log data, one could identify various
    zones with different types of fluid (Figure 9.45). It should be noted here that
    the vertical axis in Figure 9.45 is relative depth, not the absolute which may
    be in the thousands of feet.


    Another area where wavelet has been effective is in data compression. In measurement
