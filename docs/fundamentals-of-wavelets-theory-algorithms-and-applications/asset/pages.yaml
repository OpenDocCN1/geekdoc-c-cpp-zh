    # 9.1 WAVELET PACKET


    Because of the two-scale relation and the choice of the scale parameter $a=2^j$,
    the hierarchical wavelet decomposition produces signal components whose spectra
    form consecutive octave bands. Figure 9.1 depicts this concept graphically. In
    certain applications, the wavelet decomposition may not generate a spectral resolution
    fine enough to meet the problem requirements. One approach is to use the CWT for
    obtaining the necessary finer resolution by changing the scale parameter $a$ with
    a smaller increment. Another approach increases the computation load by orders
    of magnitude. Another approach was discussed in Chapter 8. The use of wavelet
    packets also helps avoid this problem. A wavelet packet is a generalization of
    a wavelet in that each octave frequency band of the wavelet spectrum is further
    subdivided into finer frequency bands by repeatedly using the two-scale relations.
    In other words, the development of wavelet packets is a refinement of wavelets
    in the frequency domain and is based on a mathematical theorem proven by Daubechies
    [1] (splitting trick). The theorem is stated as follows:


    ![](img/62a0222c021def890c636babf0dc030a_261_0.png)


    FIGURE 9.1: Constant Q spectra for wavelets at different resolutions.'
