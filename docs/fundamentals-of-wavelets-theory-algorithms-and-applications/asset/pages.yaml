    # 7.8.2.3 Two-Channel Biorthogonal Filter Bank in the Time-Domain. We have shown
    in last section that the biorthogonal condition on the analysis and synthesis
    filters is


    ```

    $C_0(z)+C_0(-z)=H_0(z)G_0(z)+H_0(-z)G_0(-z)=2.$

