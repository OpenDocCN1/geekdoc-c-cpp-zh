    # 3.3 FOURIER TRANSFORM


    To extend the Fourier series to Fourier transform, let us consider equations (3.1)
    and (3.2). The time function $p(t)$ in (3.1) can be expressed using (3.2) as


    ```

    $p(t) = \sum_{k=-\infty}^{\infty} [\int_{-T/2}^{T/2} p(t'')e^{-jk\omega_0 t''}
    dt'']e^{jk\omega_0 t}

    =\frac{1}{2\pi}\sum_{k=-\infty}^{\infty} \omega_0 [int_{-T/2}^{T/2} p(t'')e^{-jk\omega_0
    t''} dt'']e^{jk\omega_0 t}. \quad (3.15)

    ```


    We extend the period $T$ to infinity so that $\omega_0$ approaches $d\omega$ and
    $k\omega_0$ approaches $\omega$. The summation in (3.15) becomes an integral


    ```

    $p(t) = \frac{1}{2\pi} [int_{-\infty}^{\infty} p(t'')e^{-j\omega t''} dt'']e^{j\omega
    t}. \quad (3.16)

    ```


    The integral inside the bracket is represented by a function $\hat{p}(\omega)$


    ```

    $\hat{p}(\omega) = \int_{-\infty}^{\infty} p(t'')e^{-j\omega t''} dt'', \quad
    (3.17)

    ```


    and (3.16) becomes


    ```

    $p(t) = \frac{1}{2\pi} int_{-\infty}^{\infty} \hat{p}(\omega)e^{j\omega t} d\omega.
    \quad (3.18)

    ```


    Equations (3.17) and (3.18) are known as the Fourier transform pair. From here
    on, we will use $f(t)$ to represent a time-domain function, while $p(t)$ is restricted
    to representing periodic time functions. Let''s rewrite (3.17) in new notation.


    The Fourier transform of a finite energy function $f(t) \in L^2(\mathbb{R})$ of
    a real variable $t$ is defined by the integral


    ```

    $\hat{f}(\omega) = \int_{-\infty}^{\infty} f(t)e^{-j\omega t} dt. \quad (3.19)

    ```'
