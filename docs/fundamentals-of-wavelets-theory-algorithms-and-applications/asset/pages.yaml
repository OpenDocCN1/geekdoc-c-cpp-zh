    Writing this equation in the time domain and using the convolution formula, yield
    the time-domain biorthogonal condition


    ```

    $\sum_k h_0(k)g_0(\ell-k)+(-1)^\ell \sum_k h_0(k)g_0(\ell-k)=2\delta_{\ell,0}.$
    (7.123)

    ```


    The equality holds only if $\ell$ is even. This results in the biorthogonal relation
    between the analysis and synthesis filters


    ```

    $\sum_k h_0(k)g_0(2n-k)=\langleh_0(k), g_0(2n-k)\rangle=\delta_{n,0}.$ (7.124)

    ```


    The biorthogonal condition can also be expressed in terms of $H_1(z)$ to yield


    ```

    $\sum_k h_1(k)g_1(2n-k)=\langleh_1(k), g_1(2n-k)\rangle=\delta_{n,0}.$ (7.125)

