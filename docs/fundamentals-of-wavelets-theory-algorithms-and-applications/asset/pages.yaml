  md: '# 64 TIME-FREQUENCY ANALYSIS


    The function $\phi(t)$ described above with finite $\Delta_{\phi}$ is called a
    time window. Similarly, we can have a frequency window $\phi(\omega)$ with center
    $\omega^*$ and the r.m.s. radius $\Delta_{\omega}$ defined analogous to (4.2)
    and (4.3) as


    ```

    $$\omega^* = \frac{\int_{-\infty}^{\infty} \omega |\hat{\phi}(\omega)|^2 d\omega}{\int_{-\infty}^{\infty}
    |\hat{\phi}(\omega)|^2 d\omega}$, (4.4)

    $$\Delta_{\omega} := \left[\frac{\int_{-\infty}^{\infty} (\omega-\\omega^*)^2
    |\hat{\phi}(\omega)|^2 d\omega}{\dots}\right]^{1/2}$, (4.5)

    ```


    As we know, theoretically a function cannot be limited in time and frequency simultaneously.
    However, we can have $\phi(t)$ such that both $\Delta_{\phi}$ and $\Delta_{\omega}$
    are both finite; in such case, the function $\phi(t)$ is called a time-window.
    It is easy to verify that for the window in Figure 4.2, $\omega^* = 0$ and $\Delta_{\omega}
    = \infty$. This window is the best (ideal) time window but the worst (unacceptable)
    frequency-window.


    A figure of merit for the time-frequency window is its time-frequency product
    $\Delta_{\phi}\Delta_{\omega}$, which is bounded from below by the *uncertainty
    principle* and is given by


    ```

    $$\Delta_{\phi}\Delta_{\omega} \geq \frac{1}{2}$, (4.6)

    ```


    where the equality holds only when $\phi$ is of the Gaussian type (see Section
    3.5.3).


    # 4.2 SHORT-TIME FOURIER TRANSFORM


    In the beginning of this chapter we could obtain the approximate frequency contents
    of a signal $f(t)$ in the neighborhood of some desired location in time, say $t=b$,
    by first windowing the function using an appropriate window function $\phi(t)$
    to produce the windowed function $f_{b}(t)=f(t)\phi(t-b)$ and then taking the
    Fourier transform of $f_{b}(t)$. This is the short-Fourier transform (STFT). Formally,
    we define the STFT of a function $f(t)$ with respect to the window function $\phi(t)$
    evaluated at the location $(b,\xi)$ in the time-frequency plane as


    ```

    $G_{\phi}(b,\xi) := \int_{-\infty}^{\infty} f(t)\phi_{b}(t)e^{-i\xi t}dt$, (4.7)

    ```


    where


    ```

    $$\phi_{b,\xi}(t) := \phi(t-b)e^{i\xi t}$, (4.8)

    ```'
