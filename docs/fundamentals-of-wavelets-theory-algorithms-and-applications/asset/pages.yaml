  md: '# CONSTRUCTION OF BIORTHOGONAL WAVELETS - 137


    In the semiorthogonal case, equation (6.76) no longer holds for $\phi$ and $\psi$.
    They are orthogonal to their respective duals


    ```

    $$\phi_{k,s}(t), \tilde{\phi}_{m,s}(t)) = \delta_{k,m}$$

    $\psi_{k,s}(t), \tilde{\psi}_{m,s}(t)) = \delta_{k,m},$\quad (6.77)$

    ```


    and the dual span spaces in the sense that $\tilde{A}_s := span{\phi(2^s t-m),
    s,m \in \mathbb{Z}\}$ and $\tilde{W}_s := span{\psi(2^s t-m), s,m \in \mathbb{Z}\}$.
    As described in Chapter 5, semiorthogonality implies that $\tilde{A}_s = A_s$
    and $\tilde{W}_s = W_s$.


    In biorthogonal system, there exist an additional dual nested space:


    ```

    ${0} \leftarrow \dots \leftarrow \tilde{A}_2 \subset \tilde{A}_1 \subset \tilde{A}_0
    \subset A_1 \subset A_2 \subset \dots \longrightarrow L^2. \quad (6.78)$

    ```


    In association with this nested sequence of spaces is a set of dual wavelet subspaces
    (not nested) $\tilde{W}_s, s \in \mathbb{Z}$, that complements the nested subspaces
    $A_s, s \in \mathbb{Z}$. To be more specific, the relations of these subspaces
    are


    ```

    $A_s + \tilde{W}_s = A_{s+1} \quad (6.79)$$\n$\tilde{A}_s + W_s = \tilde{A}_{s+1}.
    \quad (6.80)$

    ```


    The orthogonality conditions then become


    ```

    $A_s \perp \tilde{W}_s \quad (6.81)$$\n$\tilde{A}_s \perp W_s. \quad (6.82)$

    ```


    giving us


    ```

    $$\phi_{k,s}(t), \tilde{\psi}_{m,s}(t)) = 0 \quad (6.83)$$\n$\tilde{\phi}_{k,s}(t),
    \psi_{m,s}(t)) = 0. \quad (6.84)$

    ```


    In addition, the biorthogonality between the scaling functions and the wavelets
    in (6.77) still holds. The two-scale relations for these bases are


    ```

    $$\phi(t) = \sum_{k} g_0[k]\phi(t-k) \quad (6.85)$$\n$\tilde{\phi}(t) = \sum_{k}
    \tilde{h}_0[k]\tilde{\phi}(t-k). \quad (6.86)$$\n$\psi(t) = \sum_{k} g_1[k]\psi(t-k).
    \quad (6.87)$$\n$\tilde{\psi}(t) = \sum_{k} \tilde{h}_1[k]\tilde{\psi}(t-k). \quad
    (6.88)$

    ```'
