  md: '# 2.8.5 Region of Convergence


    The variable $z$ in the $z$-transform is complex valued. The $z$-transform, $X(z)=\sum_{n=-\infty}^{\infty}
    x(n)z^{-n}$, may not converge for some values of $z$. The *region of convergence*
    (ROC) of a $z$-transform indicates the region in the complex plane in which all
    values of $z$ make the $z$-transform converge. Two sequences have the same $z$-transform
    but with different regions of convergence.


    **Example:** Find the $z$-transform of $x(n)=a^n \cos(\omega_0 n)u(n)$, where
    $u(n)$ is the unit step function, defined by


    ```

    $u(n)=\begin{cases} n \geq 0 \ 0 & \text{otherwise}\end{cases}$

    ```


    *Solution:* From the definition of $z$-transform, we have


    ```

    $X(z)=\sum_{n=-\infty}^{\infty} a^n \cos(\omega_0 n)z^{-n}$

    =\sum_{n=-\infty}^{\infty} a^n \frac{e^{j\omega_0 n}+e^{-j\omega_0 n}}{2}z^{-n}$

    =\frac{1}{2}\sum_{n=0}^{\inftyae^{j\omega_0}z^{-1})^n+\sum_{n=0}^{\inftyae^{-j\omega_0}z^{-1})^n$

    =\frac{1}{2}[\frac{1}{1-ae^{j\omega_0}z^{-1}}+\frac{1}{1-ae^{-j\omega_0}z^{-1}}]

    =\frac{1-a\cos(\omega_0)z^{-1}}{1-2a\cos(\omega_0)z^{-1}+a^2z^{-2}}, \text{ ROC:
    } |z|>|a|$.

    ```


    The case where $a=0.9$ and $\omega_0=10\pi$ is shown in Figure 2.3.


    **Special Cases:**


    +   1. If $a=1$ and $\omega_0=0$, we have


    ```

    $U(z)=\frac{1-z^{-1}}{1-2z^{-1}+z^{-2}}

    =\frac{1}{1-z^{-1}}, \text{ ROC: } |z|>1$.

    ```


    +   2. If $a=1$, we have


    ```

    $X(z)=\frac{1-\cos(\omega_0)z^{-1}}{1-2\cos(\omega_0)z^{-1}+z^{-2}}, \text{ ROC:
    } |z|>1$.

    ```'
