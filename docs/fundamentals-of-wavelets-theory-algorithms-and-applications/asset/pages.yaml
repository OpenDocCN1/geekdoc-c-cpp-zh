  md: '# DISCRETE LINEAR NORMALED SPACE


    # 2.5 DISCRETE LINEAR NORMALED SPACE


    A discrete linear normed space is a collection of elements that are discrete sequences
    of real or complex numbers with a given norm. For a discrete normed linear space,
    the operation rules in Section 2.1 are applicable as well. An element in an $N$-dimensional
    linear space is represented by a sequence


    ```

    $x(n) = \{x(0), x(1), \dots, x(N-1)\}, \quad (2.37)$

    ```


    and we represent a sum of two elements


    ```

