  md: "One sees the advantages of the lifting scheme as follows: (1) Fourier techniques\
    \ are not required, (2) the transform can be carried out without a fixed form\
    \ for the **P** and **U** operators, (3) the computation of the inverse transform\
    \ is straightforward, and (4) there are many variations on the operators **P**\
    \ and **U** that generate various wavelets.\n\n# 8.5.1 Linear Spline Wavelet\n\
    \nThe complexity of the lifting scheme is increased slightly when we use the linear\
    \ prediction for the odd samples of the signal. The predictor (**P**) uses the\
    \ average of the two adjacent even samples to predict the in-between odd sample\n\
    \n```\n$$\\tilde{a}_{2k+1,\\ell+1}=\\frac{1}{2}(a_{2k,\\ell+1}+a_{2k+2,\\ell+1}).\\\
    quad(8.66)$\n```\n\nThe prediction error (difference) forms the wavelet coefficient\n\
    \n```\n$$w_{k,\\ell}=a_{2k+1,\\ell+1}-\tilde{a}_{2k+1,\\ell+1}=\\frac{1}{2}(2a_{2k+1,\\\
    ell+1}-a_{2k,\\ell+1}-a_{2k+2,\\ell+1}).\\quad(8.67)$\n```\n\nTo preserve the\
    \ zeroth and first moments for all resolution, we have\n\n```\n$$\\sumsum_{k=0}^{2^{n-1}-1}a_{k,n-1}=\\\
    frac{1}{2}\\sum_{k=0}^{2^{n-1}-1}a_{k,n}.\\quad(8.68)\\n$$$\\sum_{k=0}^{2^{n-1}-1}kak_{k,n-1}=\\\
    frac{1}{2}\\sum_{k=0}^{2^{n-1}-1}kak_{k,n}.\\quad(8.69)$\n```\n\nThe upator (**U**)\
    \ is found to be\n\n```\n$$a_{k,\\ell}=a_{2k,\\ell+1}+\\frac{1}{4}(w_{k,\\ell-1}+w_{k,\\\
    ell}).\\quad(8.70)$\n```\n\nThe inverse transform is computed in a reverse manner\
    \ by\n\n```\n$$a_{2k,\\ell+1}=a_{k,\\ell}-\\frac{1}{4}(w_{k,\\ell-1}+w_{k,\\ell}).\\\
    quad(8.71)$\n```\n\n```\n$$a_{2k+1,\\ell+1}=w_{k,\\ell}+\\frac{1}{2}(a_{2k,\\\
    ell+1}+a_{2k+2,\\ell+1}).\\quad(8.72)$\n```\n\nThese coefficients are zipped back\
    \ together by the merger to form the signal at the next higher resolution."
