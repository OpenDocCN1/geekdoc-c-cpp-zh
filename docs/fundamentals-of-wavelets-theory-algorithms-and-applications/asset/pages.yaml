    \ a measure to determine which codevector has the smallest distance from the block\
    \ vector $X$.\n\n```\n$$MSE = \\frac{1}{n}\\sum_{i=1}^{k}(x_i - \\tilde{x}_i)^2\
    \ \\quadquad (9.43)$\n```\n\n4. Once the codevector $k$ is selected from the $MSE$\
    \ computation, the index $k$ is transmitted to the receiver.\n\n5. The receiver,\
    \ having received the index $k$, uses a table look-up method to find the codevector\
    \ $\tilde{X}_k$ from a duplicate codebook.\n\nThere are different algorithms for\
    \ generating the VQ code book. These discussions for this section are beyond the\
    \ scope of this section. For more details, the reader is referred to an excellent\
    \ tutorial in Ref. 12. VQ can be applied to the transformation of an image. Transforms\
    \ like the cosine transform and wavelet/wavelet packet transforms are good candidates\
    \ for this scheme. VQ can also be combined with other schemes, such as DPCM, to\
    \ compress an image. Figure 9.26 shows a composite DWT-DPCM-VQ scheme for image\
    \ compression.\n\n![](img/62a0222c021def890c636babf0dc030a_291_0.png)\n\nFIGURE\
    \ 9.26: Composite DWT-DPCM-VQ compression algorithm."
