    # 6.5 CONSTRUCTION OF BIORTHOGONAL WAVELETS


    In the previous sections, we have discussed the semiorthogonal and orthonormal-wavelets.
    We developed the orthogonal wavelets as a special case of the semiorthogonal wavelets
    using


    ```

    $$\tilde{\phi} = \phi\n\tilde{\psi} = \psi.$ \quad (6.72)$

    ```


    One of the major difficulties with supported orthonormal wavelets is that they
    lack spatial symmetry. This means the processing filters are nonsymmetric and
    do not possess linear phase property results in severe undesirable phase distortions
    in signal processing. This topic will be dealt with in Chapter 7 in more detail.
    Semiorthogonal wavelets, on the other hand, are symmetric but suffers from the
    drawback that duals do not have compact support. This is also undesirable since
    truncation of the filter coefficients is necessary for real-time processing. Biorthogonal
    wavelets may have both symmetry and compact support.


    Cohen, Daubechies, and Feaveau [11] extended the framework of the theory of orthonormal
    wavelets to the case of biorthogonal wavelets by a modification of the approximation
    space. Let us recall that in the semiorthogonal and orthonormal cases, there exist
    only one sequence of nested approximation substations,


    ```

    $\{0} \leftarrow \dots \subset A_{J-2} \subset A_{J-1} \subset A_0 \subset A_1
    \subset A_2 \subset \dots \subset L^2.$ \quad (6.73)$

    ```


    The wavelet subspace, $W_s$, is the orthogonal complements to $A_s$ within $A_{s+1}$
    such that


    ```

    $A_s \cap W_s = \{0\}, \quad s \in \mathbb{Z}, \quad \text{and}\n$A_s + W_s =
    A_{s+1}.$ \quad (6.74)$

    ```


    This framework implies that the approximation space is orthogonal to the wavelet
    space at any given scale $s$ and the wavelet spaces are orthogonal across scales:


    ```

    $W_s \perp W_p \quad \text{for } s \neq p.$ \quad (6.75)$

    ```


    In the orthonormal case, the scaling functions and wavelets are orthogonal to
    their translates at any given scale $s$


    ```

    $<langle \phi_{k,s}(t), \phi_{m,s}(t)\rangle = \delta_{k,m}\n<langle \psi_{k,s}(t),
    \psi_{m,s}(t)\rangle = \delta_{k,m}. \quad (6.76)$

    ```'
