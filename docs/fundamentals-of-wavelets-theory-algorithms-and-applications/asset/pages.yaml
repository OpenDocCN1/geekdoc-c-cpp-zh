  md: '# Digital Signal Processing Applications


    The introduction of wavelets to signal and image processing has provided engineers
    with a very flexible tool to create innovative techniques for solving various
    engineering problems. A survey of recent literature on wavelet processing shows
    the focus on using the wavelet algorithms for processing one-dimensional (1D)
    and two-dimensional (2D) signals. Acoustic, speech, music, and electrical transient
    signals are popular in 1D wavelet signal processing. The 2D wavelet signal processing
    mainly involves image compression and target identification. Problem areas include
    noise reduction, signature identification, target detection, signal and image
    compression, and interference suppression. We make no attempt to detail techniques
    in these areas; neither are we trying to provide the readers with processing techniques
    at the research level. Several examples are given in this chapter to demonstrate
    the advantages and flexibility of using wavelets in signal and image processing.


    In these examples, wavelet algorithms are working in synergy with other processing
    techniques to yield a satisfactory solution to the problem. Wavelet decomposition
    please play the vital role in separating the signal into components before other
    DSP techniques are applied. Algorithms include wavelet tree, wavelet-packet tree
    decomposition, 2D wavelet or wavelet-packet tree decomposition, pyramid or direction
    decomposition. In signature recognition and target detection, the corresponding
    reconstruction algorithm is not needed since the signal components are either
    destroyed or rendered useless after processing. In the last two examples, the
    orthogonality between wavelet


