    # 7.8 TWO-CHANNEL PERFECT RECONSTRUCTION FILTER BANK


    Many applications in digital signal processing require multiple band-pass filters
    to separate a signal into components whose spectra occupy different segments of
    the frequency axis. Examples of these applications include filter bank for Doppler
    frequencies in radar signal processing and tonal equalizer in music signal processing.
    Figure 7.18 demonstrates the concept of multiband filtering, the spectral bands
    corresponding to components of the signal may be processed with a different algorithm
    to achieve a desirable effect on the signal. In the case of Doppler processing
    and tonal equalizer, there is no need to reconstruct the original signal from
    the processed components. However, there is another form of filtering that requires'
