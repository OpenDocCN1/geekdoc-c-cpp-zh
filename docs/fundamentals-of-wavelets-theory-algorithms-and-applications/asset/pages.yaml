    ```


    which gives $2^N-1$ additional levels between any two consecutive octave levels,
    as.


    For each $k \in \mathbb{Z}, s < M$ to add $2^N-1$ levels between the $(s-1)^{th}$
    and $stth}$ octaves, we introduce the notations


    ```

    $$\begin{aligned} \phi_{k,s}^s(t) &= (2^s\alpha_n)^2 \phi(2^s\alpha_n t-k); \
    \psi_{k,s}^s(t) &= (2^s\alpha_n)^2 \psi(2^s\alpha_n t-k). \end{aligned} (8.15)$

    ```


    Observe that since $1/2 < \alpha_n < 1$, we have


    ```

    $$\begin{aligned} \supp \phi_{k,s}^s \subseteq supp \phi_{k,s}^n \subseteq supp
    \phi_{k,s}^{s-1}; \ \supp \psi_{k,s}^s \subseteq supp \psi_{k,s}^n \subseteq supp
    \psi_{k,s}^{s-1}. \end{aligned} (8.16)$

    ```'
