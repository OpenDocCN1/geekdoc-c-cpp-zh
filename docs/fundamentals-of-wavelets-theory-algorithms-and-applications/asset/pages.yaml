    for $x(t) \in \pi_{m-1}$. B-splines have $m$ order of approximation. In addition,
    since they are a local basis, the representation (5.46) is also local. By *local*
    we mean that to obtain the coefficient $a_{k,M}$ for some $k$, we do not need
    all the function values;'
