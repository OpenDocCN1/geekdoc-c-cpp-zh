  md: 'The window function $\phi(t)$ in (4.7) is allowed to be complex and satisfies
    the condition


    ```

    $\hat{\phi}(0) = \int_{-\infty}^{\infty} \phi(t)dt \neq 0.$

    ```


    In other words, $\hat{\phi}(\omega)$ behaves as a low-pass filter. That is, the
    spectrum is nonzero at $\omega=0$. Because of the windowing nature of the STFT,
    this transform is also referred to as the windowed Fourier transform or *running-window
    Fourier transform*.


    Unlike the case of Fourier transform, in which the function $f(t)$ must be known
    for the entire time axis before its spectral component at any single frequency
    can be computed, STFT needs to know $f(t)$ only in the interval where $\phi(t-b)$
    is nonzero. In other words, $G_{\phi f}(b,\xi)$ gives the approximate spectrum
    of $f$ near $t=b$.


    If the window function $\phi(t-b)$ in (4.7) is considered as the modulating function
    of the sinusoid $e^{ij\xi}$, the STFT can be written


    ```

    $G_{\phi f}(b,\xi) = (f(t)\phi(t-b)e^{ij\xi}). \quad (4.9)$

    ```


    The function $\phi_b(t) = \phi(t-b)e^{ij\xi}$ behaves like a *packet of waves*,
    where the sinusoidal oscillates inside the envelope function $\phi(t)$. In addition,
    (4.8) indicates that each of these packets of waves behaves like a basis function,
    so that the STFT may be interpreted as the components of the function $f(t)$ with
    respect to this basis in the time-frequency plane.


    # 4.2.1 Inversion Formula


    One can recover the time function $f_b(t)$ by taking the inverse Fourier transform
    of $G_{\phi f}(b,\xi)$


    ```

    $f_b(t) = \phi(t-b)f(t) = \frac{1}{2\pi}\int_{-\infty}^{\infty} G_{\phi f}(b,\xi)e^{ij\xi}d\xi.
    \quad (4.10)$

    ```


    The original $f(t)$ is obtained by multiplying (4.10) with $\phi(t-b)$ and integrating
    with respect to $b$. The final recovery formula is


    ```

    $f(t) = \frac{1}{2\pi|\phi(t)||^2}\int_{-\infty}^{\infty} d\xi e^{ij\xi}\int_{-\infty}^{\infty}
    G_{\phi f}(b,\xi)\phi(t-b)db. \quad (4.11)$

    ```


    One may observe a similar symmetric property between equations (4.7) and (4.11)
    and that of the Fourier transforms in (3.19) and (3.22).'
