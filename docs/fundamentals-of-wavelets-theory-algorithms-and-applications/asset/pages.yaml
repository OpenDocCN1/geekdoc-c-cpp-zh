    We also use the traditional FFT approach to solve this problem for the sake of
    comparison. The FFT feature vectors are constructed following the same pattern.


    +   1. From the $2^{12}$ data points, we compute the FFT and take only the positive
    frequency information represented by $2^{12}$ spectral coefficients.


    +   2. We divide the spectrum into 32 nonoverlapping bands with equal width. From
    each band, we compute the average energy contained in the coefficients. The feature
    element becomes


    ```

    $$v_i^{fft} = \frac{1}{n_i} \sum_{j=1}^{n_i} s_{i,j}^2, \ i=1, 2, \dots, 32, \text{
    and } n_i=128; \ \forall i, \quad (9.25)$

    ```


    where $s_{i,j}^2$ is the $j$th FFT coefficient in the $i$th subband. Consequently,
    the feature vector become


    ```

    $$v^{fft} = \{v_1^{fft}, v_2^{fft}, \dots, v_{13}^{fft}\}. \quad (9.26)$

    ```


