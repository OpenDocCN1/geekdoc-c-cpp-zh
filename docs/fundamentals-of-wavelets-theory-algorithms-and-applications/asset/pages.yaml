  md: '# 44 FOURIER ANALYSIS


    Two functions, $f(t)$ and $g(t)$, are related to their Fourier transform $\hat{f}(\omega)$
    and $\hat{g}(\omega)$ via the Parseval''s identity for Fourier transform given
    as


    ```

    $$(f(t), g(t)) = \frac{1}{2\pi}(\hat{f}(\omega), \hat{g}(\omega)). \quad (3.41)$

    ```


    This can be shown from


    ```

    $$(f(t), g(t)) = \int_{-\infty}^{\infty} f(t)\overline{g(t)}dt\n= \frac{1}{2\pi}\int_{-\infty}^{\infty}(\int_{-\infty}^{\infty}\hat{f}(\omega)e^{i\omega
    t}d\omega)\overline{g(t)}dt\n= \frac{1}{2\pi}\int_{-\infty}^{\infty}\hat{f}(\omega)\left(\int_{-\infty}^{\infty}g(t)e^{-i\omega
    t}dt\right)d\omega\n= \frac{1}{2\pi}\int_{-\infty}^{\infty}\hat{f}(\omega)\overline{\hat{g}(\omega)}d\omega
    \quad (3.42)$

    ```


    In particular, with $g(t) = f(t)$, we get the so-called Parseval''s theorem given
    in (3.40). Equation (3.40) is a statement about the energy content in the signal.
    It states that the total energy computed in the time domain $\int_{-\infty}^{\infty}|f(t)|^2dt$
    is equal to the total energy computed in the spectral domain $\frac{1}{2\pi}\int_{-\infty}^{\infty}|\hat{f}(\omega)|^2d\omega$.


    The Parseval theorem allows the energy of the signal to be considered in either
    the spectral domain or the time domain and can be exchanged between domains for
    convenience of computation.


