    # 2.8.4 z-Transform


    The z-transform is a very useful tool for discrete signal analysis. We will use
    it in the definitions of wavelet and filter bank algorithms. It is defined by
    the infinite sum


    > $H(z) = \sum_{k\in\mathbb{Z}} h(k)z^{-k}$

    = \dots, h(-1)z^{1}+h(0)+h(1)z^{-1}+h(2)z^{-2} + \dots \quad (2.83)$


