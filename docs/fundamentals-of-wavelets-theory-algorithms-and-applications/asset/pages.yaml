    # 9.6.4 Wavelet Packet Algorithm


    The 2D wavelet packet algorithm mimics the 1D case. It simply repeats the algorithms
    first along the $x$ direction and then the $y$ direction. Not only is the LL component
    (the approximation function component) decomposed to obtain further details of
    the image but the other wavelet components (LH, HL, HH) are also further decomposed.
    For example, starting with an original image with size $256 \times 256$, a 2D
    wavelet decomposition of this image will result in four subimages of size $128
    \times 128$. Continuing the decomposition, one gets 16 2D wavelet packet subimages
    of size $64 \times 64$. The computational algorithm for 2D wavelet packets is
    no more difficult than that for the 2D wavelets. It requires orderly bookkeeping
    to keep track of the directions ($x$ or $y$), and the filters that have been used
    in processing. It is necessary to reverse the order to reconstruct the image from
    its wavelet packet components. An example of 2D wavelet packet decomposition of
    an image and its reconstruction is shown in Figures 9.21–9.22.'
