    # 8.2 RIDGEGE TRANSFORM


    One-dimensional wavelet transforms are very good in detecting point discontinuities
    (Figure 8.11) in the sense that wavelet coefficients near the discontinuity are
    significantly higher than those at the smooth region. For a two-dimensional function—an
    image, for instance—discontinuities are represented by edges. We can construct
    a two-dimensional wavelets by simply taking the tensor product (more on edges
    and two-dimensional wavelets in the next chapters) and compute wavelet coefficients.
    However, these edges, while separating regions, are themselves smooth curves.
    As a result, direct applications of 2D wavelets will not be able to localize coefficients
    near the edges as a 1D wavelet transform does.


    To overcome the difficulties of wavelet transforms in effectively localizing edges
    in higher dimensions, ridgelet and curvelet transforms [11–14] have been developed.
    Ridgelet transform essentially projects a line discontinuity into a point discontinuity
    and takes its wavelet transform. For a 2D smooth function $f(x, y)$, the continuous
    ridge transform, $C_f(b, a, \theta)$, is defined by


    ```

    $$C_f(b,a,\theta)=\int_{-\infty}^{\infty}\int_{-\infty}^{\infty}f(x,y)\Psi_{b,a,\theta}(x,y)dxdy
    (8.38)$

    ```


    where the ridgelets, $\Psi_{b,a,\theta}(x,y)$, are defined in terms of wavelet
    functions as


    ```

    $$\Psi_{b,a,\theta}(x,y):=\frac{1}{\sqrt{a}}\(\frac{x\cos\theta+ysin\theta-b}{a}\right).
    (8.39)$

    ```


    Figure 8.22 shows an example of ridgelets. The expression in (8.38) can be thought
    of as a combination of Radon transform, and the wavelet transform in 1D. Radon
    transform is an integral transform that gives projection of a 2D function along
    a straight line at a desired angle.It has also been extended to higher-dimensional
    space. The Radon transform of a function $f(x,y)$ is given by


    ```

    $$R_f(t,\theta)=\int_{-\infty}^{\infty}\int_{-\infty}^{\infty}f(x,y)\delta(x\cos\theta+ysin\theta-t)dxdy.
    (8.40)$

    ```'
