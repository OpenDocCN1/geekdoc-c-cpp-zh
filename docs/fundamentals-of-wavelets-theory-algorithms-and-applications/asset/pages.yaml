  md: '# LIFTING WAVELET TRANSFORM 231


    ```

    $$W_{k,\ell} = a_{2k+1,\ell+1} - a_{2k,\ell}$ $$

    na_{k,\ell} = a_{2k,\ell} + \frac{W_{k,\ell}}{2}$$ $\quad (8.61)$

    ```


    This is the lifting approach for the Haar wavelet transform of a one-dimensional
    signal. The process can be summarized in three simple steps:


    +   1. The **S-step** splits (or unzips) the signal into an even and an odd sample
    paths.


    ```

    $$x(k) = a_{m,n} \rightarrow \begin{cases} \text{Even path} \rightarrow a_{2k,n}
    \ \text{Odd path} \rightarrow a_{2k+1,n} \end{cases}$ $$

    ```


    Notice that each path carries only half of the total number of samples in the
    original signal.


    +   2. The **P-step** predicts the odd samples based on the even samples. At certain
    $(\ell+1)^{th}$ resolution of the Haar wavelet analysis, the lifting scheme assumes
    the predicted odd value to be the same as its preceding value.


    ```

    $$a_{2k+1,\ell+1} = a_{2k,\ell}$ $$

    ```


    At this point, the wavelet coefficients (difference) of the next lower resolution
    is computed by


    ```

    $$W_{k,\ell} = a_{2k+1,\ell+1} - \tilde{a}_{2k+1,\ell+1} = a_{2k,\ell+1} - a_{2k,\ell}$
    $$

    ```


    +   3. The **U-step** updates the even value based on the difference obtained
    in the P-step to compute the approximation coefficients of the next lower resolution.


    ```

    $$a_{k,\ell} = a_{2k,\ell+1} + \frac{W_{k,\ell}}{2}$ $$

    ```


    From here on, the next level of signal decomposition starts with $a_{k,\ell}$
    and repeats the prediction and updating procedures with the same predictor and
    upator. It is important to note that the design of the predictor and upator must
    keep the average value of the signal level to be the same to preserve the zeroth
    order moment:


    ```

    $$\frac{1}{2} \sum_{k=0}^{2^{n-1}-1} a_{k,n} = \sum_{k=0}^{2^{n-1}-1} a_{k,n-1}$
    $$ $\quad (8.62)$

    ```'
