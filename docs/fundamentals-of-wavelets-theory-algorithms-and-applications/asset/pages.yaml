    leads to a time-marching scheme much like like the FDTD technique. The advantage
    of this technique over other methods is that wavelets can be added or subtracted
    during the simulation at any point in the grid. With why the grid can react to
    complex geometry and rapid changes in the field as it propagates through the grid.
    The choice of wavelet basis functions determines the characteristics of the MRTD
    scheme. The Haar-Lémeri, Daubechies and other wavelet basis (e.g., biorthogonal
    wavelets [61]) have been successfully applied and demonstrated significant savings
    in memory and execution time requirements by or two orders of magnitude [62–66]
    compared with FDTD technique. The stability and dispersion performance of entire-domain
    (e.g., Haar-Lémeri) MRTD schemes have been investigated for different stencil
    sizes [67]. Analytical expressions for the maximum stable time step have been
    derived. Larger stencils decrease the numerical error, making it significantly
    lower than FDTD for low and medium discretizations. Stencil sizes larger than
    10 offer a smaller phase error than FDTD even for discretizations close to 50
    cells/wavelength. The enhancement of wavelets further improves the dispersion
    performance for discretizations close to the Nyquist limit (23 cells/wavelength),
    making it comparable to that of denser grids (10–15 cells/wavelength), though
    it decreases the value of the maximum time step guaranteeing the stability of
    the scheme.


    The finite-domain Haar basis functions provide a convenient tool for the transition
    from FDTD to MRTD due to their compact support and their similarity with the FDTD
    pulse,, thus providing an effective demonstration tool for this section. The Haar
    wavelet family is in many ways one of the simplest; however, it has many properties
    that make its application to practical structures favorable [56]. Most importantly,
    it has finite domain and when reconstructed leads to finite areas of constant
    field value (equivalent points [58]). Using this property, it is possible to apply
    pointwise effects in the MRTD grid when an arbitrary level of Haar wavelets is
    used. To clearly present the MRTD method, a brief derivation of 2D Haar-MRTD is
    presented. The extension to 3D and other basis functions is straightforward.


    # 10.8.3 Haar-MRTD Derivation


    Haar scaling functions and wavelets are based on pulses in space. As described
    in previous chapters, for this case, the inner product of any wavelet with any
    other level, or with the scaling function, is 0. We assume that the highest resolution
