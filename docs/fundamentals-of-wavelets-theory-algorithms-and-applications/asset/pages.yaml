    # 9.11.2 Rendering Techniques


    Rendering is the process of generating images using computers. In data visualization,
    our goal is to transform numerical data into graphical data, or *graphical primitives*,
    for rendering.


    Traditional techniques assumed that when an object was rendered, the surfaces
    and their interactions with light were viewed. However, common objects such as
    clouds and fog are translucent and scatter light that passes through them. Therefore,
    for proper rendering, we need to consider the changing properties inside the object.


    When we render an object using surface rendering techniques, mathematically model
    the object with a surface description such as points, lines, triangles, polygons,
    or surface splines. The interior of the object is not described or is only implicitly
    represented by the surface representation.


    One of the key developments in volume visualization of scalar data was the marching
    cubes algorithm of Lorenson and Cline [24]. The basic assumption of this technique
    and its higher-dimension counterparts is that a contour can pass through a cell
    in only a finite number of ways. A case is constructed that enumerates all possible
    topological states of a cell, given combinations of scalar values at the cell
    points. The number of topological states depends on the number of cell vertices,
    and the number of inside/outside relationships a vertex can have with respect
    to the contour value. A vertex is considered to be inside a contour if its scalar
    value is larger the scalar value of the contour line. Vertices with scalar values
    less than the contour value are to be outside the contour. For example, if a cell
    has four vertices and each vertex can be either outside or inside the contour,
    there are $2^4 = 16$ possible ways contour lines can pass through the cell. There
    are 16 combinations for a'
