    The orthogonality and biorthogonality between these bases give the following four
    conditions on the filtering sequences:


    ```

    $g_0[k-2m], \hat{h}_1[k-2n] = 0 \quad (6.89)\n$g_1[k-2m], \hat{h}_0[k-2n] = 0
    \quad (6.90)\n$g_0[k-2m], \hat{h}_0[k] = \delta_{m,0} \quad (6.91)\n$g_1[k-2m],
    \hat{h}_1[k] = \delta_{m,0}. \quad (6.92)$

    ```


    Biorthogonal wavelet design consists of finding the filter sequences that satisfy
    (6.89) through (6.92). Because there is quite a bit of freedom in designing the
    biorthogonal wavelets, there are no set ways to the design procedure. For example,
    one may begin with $g0[k]$ being the two-scale sequence of a B-spline and proceed
    to determine the result of the sequences. Another way is to design biorthogonal
    filter banks and then iterate the sequences to obtain the scaling functions and
    the wavelet (discussed in Section 6.6). Unlike the orthonormal wavelet where the
    analysis filter is a simple time-reversed version of the synthesis filter, one
    must iterate both the synthesis filter and the analysis filter to get both wavelets
    and scaling functions. We will follow this approach and defer our discussion of
    biorthogonal wavelet design by way of example at the end of Chapter 7.


    # 6.6 GRAPHICAL DISPLAY OF WAVELET


    Many wavelets are mathematical functions that may not be described analytically.
    For examples, the Daubechies compactly supported wavelets are given in terms of
    two-scale sequences and the spline wavelets are described in terms of infinite
    polynomials. It is difficult for the user to visualize the scaling function and
    the wavelet based on parameters and indirect expressions. We describe three methods
    here to display the graph of the scaling function and the wavelet.


