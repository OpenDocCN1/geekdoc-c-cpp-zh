  md: 'The unknown coefficients. The finite element and finite difference techniques
    used to solve PDEs result in sparse and banded matrices, whereas integral equations
    almost always lead to a dense matrix. An exception is when the basis functions,
    chosen to represent the unknown functions, happen to be the eigenfunctions of
    the operator.


    Two of the main properties of wavelets-à-vis boundary value problems are their
    hierarchical nature and the vanishing moments properties. Because of their hierarchical
    (multiresolution) nature, wavelets at different resolutions are interrelated,
    a property that makes them suitable candidates for multigrid-type methods in solving
    PDEs. On the other hand, the vanishing moment property by virtue of wavelets,
    when integrated against a function of certain order, is attractive in sparsifying
    a dense matrix generated by an integral equation.


    A complete exposition of the application of wavelets to integral and differential
    equations is beyond the scope of this chapter. Our objective is to provide readers
    with some preliminary theory and results on the application of wavelets to boundary
    value problems and give references where more details may be found. Since most
    electrical engineering problems we encounter integral equations, we emphasize
    their solutions using wavelets. We give a few examples of commonly occurring integral
    equations. The first and the most important step in solving integral equations
    is to transform them into a set of linear equations. Both conventional and wavelet-based
    methods in generating matrix equations are discussed. The methods fall under the
    general categories of method of moments (MoM). We call methods with conventional
    bases (pulse, triangular, piecewise sinusoid, etc.) conventional MoM, while methods
    with wavelet bases will be referred to as wavelet MoM. Some of the numerical results
    are presented to illustrate the advantages of the wavelet-based technique. We
    also discuss wavelets on a bounded interval. Some of the techniques applied to
    solving integral equations are useful for differential equations as well. At the
    end of this chapter we briefly describe the applications of wavelets in PDEs,
    particularly the multiresolution time domain (MRTD) method, and provide references
    where readers can find further information.


