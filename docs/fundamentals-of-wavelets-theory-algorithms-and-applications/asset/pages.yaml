  md: '# 198 SPECIAL TOPICS IN WAVELETS AND ALGORITHMS


    in [Ref. 4] (see also [Ref. 5]) and later improved with the help of FFT by Rioul
    and Duhamel[2]. However, the computational complexity of the mvpo scheme, or without
    FFT, increases with the number of values of the scale parameter a. For example,
    in the FFT-based computational scheme, both the signal and the analyzing wavelet
    must be sampled at the same rate, with the sampling rate determined by the highest
    frequency content (or the smallest scale parameter) of the signal, and this sampling
    rate cannot be changed at the subsequent larger scale values for any fixed signal
    discretization. Furthermore, even at the highest frequency level, where the width
    of the wavelet is the narrowest in the time domain, the required number of sampled
    data for the wavelet will be significantly larger than the number of decomposition
    coefficients in the pyramid algorithm.


    In this chapter, we will discuss the fast integral wavelet transform (FIWT). Other
    wavelets and algorithms such as ridge, curvelets, complex wavelets, and lifting
    algorithm are briefly described.


    # 8.1 FAST INTEGRAL WAVELET TRANSFORM


    As mentioned before, in many applications it is important to compute wavelet transform
    on a dense set of points in the time-scale domain. A fast algorithm [6–8] is presented.


    # 8.1.1 Finer Time Resolution


    In this section, we will be concerned with maintaining the same time resolution
    on each scale by filling in the “holes” along the time axis on each scale—that
    is, we want to compute $(\\Psi_{xM}(n/2^M, 1/2^s)$, $n \in Z, s < M$). Recall
    that the standard algorithms discussed in Chapter 7 gives the IWT values only
    at dyadic points $\{n/2^s, 1/2^s$; $n \in Z, s < M\}$. For finer time resolution,
    we first observe that for each fixed $n$, by introducing


    ```

    $x_{xM,n}(t) := x_{xM}\left(t+\frac{n}{2^M}\right),$ (8.1)

    ```


    we have


    ```

    $(\\Psi_{xM}\left(\frac{n}{2^M}, \frac{1}{2^s}\right)) = 2^{5s/2} \int_{-\infty}^{\infty}
    x_{xM}(t)\psi\left(2^s t-\\frac{n}{2^M}\right)dt\n=2^{5s/2} \int_{-\infty}^{\infty}
    x_{xM}\left(t+\frac{n}{2^M}\right)\psi\left(2^s t\right)dt\n=(\\Psi_{xM,n})\left(0,\frac{1}{2^s}\right).$
    (8.2)

    ```'
