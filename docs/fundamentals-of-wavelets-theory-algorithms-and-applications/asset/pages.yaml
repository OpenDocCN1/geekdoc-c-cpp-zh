  md: '# 9.8.2 Wavelet Tree Coder


    In general, wavelet coders [13] use a tree structure, which takes advantage of
    the correlation between the discrete wavelet coefficients (DWCs) in each of the
    three spatial directions (HL, LH and HH), as shown in Figure 9.27. It means, that
    a DWC at a higher decomposition level is smaller than a specified threshold, there
    is a great probability that all its children and grandchildren are smaller than
    the threshold. Thus all of these insignificant DWCs can be encoded with one symbol.
    The encoding of a significant DWC may need more bits. Many tree structures have
    been developed for improving the efficiency of encoding the locations of the correlated
    DWCs, such as EZW, SOT, and GST.


    A brief description of a generic tree coder is given here:


    +   * The DWCs are selected in groups with decreasing thresholds such that larger
    DWCs are encoded earlier.

    * The first threshold is selected to be an integer $T_0=2$, where $j$ is the nearest
    integer $\leq max|DWC|$ and the $k$th threshold is $T_k=T_0/2^k$—that is, the
    uniform quantization.

    * Choosing the threshold $T_k$, all the locations of this group of DWCs, $C_{ij}$
    with $T_k \leq |C_{ij}| < T_{k-1}$, are encoded with a tree structure, and signs
    of these encoded DWCs are also appended. This process is called the dominant pass.


    ![](img/62a0222c021def890c636babf0dc030a_292_0.png)


    **FIGURE 9.27**: Spatial correlation and parent-child relationship among wavelet
    coefficients at different resolutions.'
  merge: -1
  pgno: 292
- img_proc: true
  md: '+   Those $C_{ij}$ encoded in previous higher thresholds are refined to a better
    accuracy by appending the bit corresponding to $T_k$. This process is called the
    subordinate pass.


    +   With decreasing thresholds, the leading zero bits of encoded DWCs are saved
    to achieve compression.


    +   The number of bits in the coded bit stream from a tree coder can be further
    reduced using a lossless entropy coder—for example, an arithmetic coder [12].


    # 9.8.3 EZW Code


    Initiated by Shapiro [14], the zerotree structure combined with bit plane coding
    is an efficient compression scheme for the discrete wavelet transformation. The
    embedded zerotree wavelet (EZW) coding scheme has proven its efficiency and flexibility
    in still image coding in terms of image quality and computation simplicity. Also,
    the EZW coding algorithm generates an embedded bitstream in which information
    is sent to the decoder in the order of its importance; importance is judged by
    how much the information reduces the distortion of the reconstructed image. This
    embedded technique has two important advantages. First, the bit rate control allows
    one to stop the coding process at any point. Second, the image can be reconstructed
    from a point at which the encoded bitstream has been disrupted, even with reduced
    quality.


    As an entropy coder, the zerotree coder takes advantage of the correlation between
    interlevel subbands of DWCs. Four symbols, ZTR, POS, NEG, and IZ, are used in
    the zerotree. A ZTR, zero root, represents a DWC and all of its descendants if
    they are insignificant, and it is the symbol that gets most of the compression.
    A POS or NEG stands for a significant DWC with a positive or negative sign, respectively.
    An IZ represents an insignificant DWC with at least one descendant. This is the
    symbol that reduces the compression because more symbols are needed for encoding
    its descendants. With these definitions, two bits per symbol on average are needed
    for each of the four symbols. zerotree cannot get good compression results. Also,
    all of the encoded symbols must be reordered so that the entropy coder can achieve
    compression on them. Both of these procedures increase the computation overhead.


    # 9.8.4 EZW Example


    We use a well-designed example similar to the one appearing in Shapiro''s original
    paper [14] the EZW is a successive approximation algorithm. It uses the dominant
    pass and the subordinate pass recursively to achieve the approximation. The coefficient
    map of this example is shown as follows:'
