  md: 'The parameters $b$ and $a$ are called *translation* and *dilation parameters*,
    respectively. The normalization factor $a^{-1/2}$ is included so that $|\psi_{b,a}||
    = ||\psi||$. For $\psi$ to be a window function and to recover $f(t)$ from IWT,
    $\psi(t)$ must satisfy the following condition


    ```

    $$\hat{\psi}(0) = \int_{-\infty}^{\infty} \psi(t)dt=0. \quad (4.34)$

    ```


    In addition to satisfying (4.34), wavelets are constructed so that they have a
    higher order of vanishing moments. A wavelet is said to have vanishing moments
    of order $m$ if


    ```

    $$\int_{-\infty}^{\infty} t^p\psi(t)dt=0; \quad p=0,\dots,m-1. \quad (4.35)$

    ```


    Strictly speaking, integral wavelet transform provides the time-scale analysis
    and not the time-frequency analysis. However, by proper scale-to-frequency transformation
    (discussed later), one can get an analysis that is very close to the time-frequency
    analysis. Observe that in (4.33), by reducing $a$, the support of $\psi_b$ reduces
    in time and hence carries a larger frequency range and vice versa. Furthermore,
    $1/a$ is a measure of frequency. The parameter $b$, on the other hand, indicates
    the location of the wavelet along the time axis. By changing $(b,a)$, $W\psi f$
    can be computed on the entire time-frequency plane. Furthermore, because of the
    condition (4.34), we conclude that all wavelets must oscillate, giving them the
    nature of small waves and hence the name *wavelets*. Recall that such an oscillation
    is not required for the window function in STFT. Compared with the definition
    of STFT in (4.7), the wavelet $\psi_{b,a}(t)$ takes the place of $\phi_{b,c}$.
    Hence a wavelet also behaves like a window function. The behavior and measures
    of wavelet windows are discussed in detail in Section 4.5.2.


    # 4.5.1 Inverse Wavelet Transform


    Since the purpose of the inverse transform is to reconstruct the original function
    from its integral wavelet transform, it involves a two-dimensional integration
    over the scale parameter $a>0$ and the translation parameter $b$. The expression
    for the inverse wavelet transform is


    ```

    $f(t) = \frac{1}{C_{\psi}}\int_{-\infty}^{\infty}\int_{0}^{\infty} \frac{1}{a^2}[W\psi
    f(b,a)]\psi_{b,a}(t)da. \quad (4.36)$

    ```


    where $C_{\psi}$ is a constant that depends on the choice of wavelet and is given
    by


    ```

    $C_{\psi} = \int_{-\infty}^{\infty}\frac{|\hat{\psi}(\omega)|^2}{|\omega|}d\omega<\infty.
    \quad (4.37)$

    ```'
