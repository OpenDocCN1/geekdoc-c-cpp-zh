  md: '# 9.10 MULTICARRIER COMMUNICATION SYSTEMS (MCCS)


    Multicarrier modulation is the principle of transmitting data by dividing the
    data stream into several parallel bitstreams, each of which has a much lower bit
    rate. Each of these substreams modulates an individual carrier. 9.33 shows the
    block diagram of the transmitter of a multicarrier communication system. A serial-to-parallel
    buffer segments the information sequences into sequences of $N_f$ bits. The $N_f$
    bits in each frame are parsed into $M$ groups, where the $i$th group is assigned
    $n_i$ bits so that


    ```

    $$\sum_{i=0}^{M-1} n_i = N_f. \quad (9.48)$

    ```


    It is convenient to view the multicarrier modulation as having $M$ independent
    channels, each operating at the same symbol rate $1/T$. The data in each channel
    are modulated by a different subcluster. We denote the signal input to the subchannels
    by $S_i$, $i=0, \dots, M-1$. To modulate the $M$ subcarriers, we use an orthogonal
    basis $\Phi = \{\phi_k\}_{k=0}^{M-1}$, such that


    ```

    $$\langle\phi_m, \phi_l\rangle = E\delta_{m,l}$.

    ```


    # 9.10.1 OFDM Multicarrier Communication Systems


    Orthogonal frequency division multiplexing (OFDM) is a special form of MCCS with
    densely spaced subcarriers and overlapping spectra. It abandons the use of steep
    bandpass filters that completely separate the spectra of individual subcarriers.
    Instead, OFDM time-domain waveforms are chosen so that mutual orthogonality is
    ensured, even though subcarrier spectra may overlap. OFDM is more robust against
    time-domain interference due to its long symbol time, whereas subcarriers may
    lose their mutual orthogonality if high-frequency errors occur in the channel.
    As shown in Figure 9.35, the operating principle is simple. The data are transmitted
    on several subcarriers. The spectra of the subcarriers may overlap, but the mutual
    orthogonality is ensured. These subcluster are summed together and transmitted
    over the channel. On the receiver end of the channel, the received signal is sent
    in parallel to the matched filters in each subcluster. The output of the matched
    filter is sampled before the decision is made on the signal. In general, each
    subcluster uses the binary phase-shift key (BPSK) scheme [23] to represent the
    signal.


    When the channel behaves well and does not introduce frequency dispersion, the
    bit error rate ($P_e$) is very small. The imperfection may be due to noise in
    the channel. On the other hand, when frequency dispersion is present due to time
    variation of the channel parameter, the $P_e$ increases. Phase jitters and'
