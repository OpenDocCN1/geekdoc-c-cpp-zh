    identifying the reflected voltage through the simulation of a through CPW line
    with a reference input voltage ($V_{ref}$) during the use of the full-wave FDTD,
    that provides the values of all electromagnetic components throughout the geometry,
    offers a more intuitive visualization of the circuit. For example, in the transition
    zone the electric fields have to change smoothly from a coplanar waveguide mode
    to a microstrip mode, to minimize the local reflections. Thus in the design process
    it is desirable to identify where this transition takes place and optimize the
    tapering. Figure 10.16 is a plot of total electric field for a transverse cross-section
    of the transition. It can be seen that at the position of this cross-section,
    the field is mostly in a CPW mode, though a microstrip mode has started developing
    below and at the edges of the signal line there. The relative amplitudes of the
    E-field could provide an intuitive design for the spacing between the CPW ground
    and signal line, so as not to suppress the microstrip mode.


    **10.8.52 Microstrip-Line Coupling.** Embedded transmission lines are commonly
    used in multilayer packages, where the use of non-continuous grounds could lead
    to increased cross-talk effects. The FDTD technique is used to estimate the coupling
    of finite-ground microstrip lines of Figure 10.18 [69]. The results presented
    in [69] for different line spacing and for a ground connecting via (an optimized
    design) are obtained by combining two simulations, an even and odd mode excitation.
    In addition, to reduce the unwanted cross-talk, the electric and magnetic field
    distributions are also calculated. It is shown that most of the coupling is through
    the magnetic field lines, leading to the design conclusion that attempts to reduce
    the coupling should focus on magnetic shielding.'
