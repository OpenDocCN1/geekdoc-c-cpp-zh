    # 3.2 EXAMPLES


    # 3.2.1 Rectified Sine Wave


    Consider a function $p(t) = |\sin t|$, as shown in Figure 3.1, with the period
    $T = \pi$ and $\omega_0 = 2\pi/T$ rad/s. Since the function $p(t)$ is an even
    function with respect to $t=0$, i.e., $p(-t) = p(t)$, $b_k=0$ for all $k$. The
    coefficients $\{a_k\}$ are computed as


    ```

    $a_k = \frac{2}{\pi} \int_{0}^{\pi} \sin t \cos(2kt) dt$

    = \frac{1}{\pi} \int_{0}^{\pi} [\sin(1-2k)t + \sin(1+2k)t] dt$

    = -\frac{1}{\pi} \left[ \frac{\cos(1-2k)t}{1-2k} \right]_{0}^{\pi} + \frac{1}{\pi}
    \left[ \frac{\cos(1+2k)t}{1+2k} \right]_{0}^{\pi}$

    = -\frac{4}{\pi} \frac{1}{4k^2-1}. \quad (3.9)$

    ```


    Hence the Fourier series of $p(t)$ is given as


    ```

    $p(t) = -\frac{2}{\pi} \sum_{k=1}^{\infty} \frac{4}{4k^2-1} \cos 2kt.$

    ```


