    band should be used when the local spectrum is well concentrated or when a small
    variance is obtained, while a wide band should be used when the local spectrum
    is spread or variance is large. We note in passing a basis is usually obtained
    between the third layer and the fourth layer, since deeper layers may yield some
    adverse effects due to the amplitude increase in their spectral sidelobes. Once
    we have chosen a best basis, the signal is readily expressed as


    ```

    $s(t) = \sum_{j=1}^{\infty} \sum_{m=0}^{\infty} \sum_{n=-\infty}^{\infty} d_n^{j,m}
