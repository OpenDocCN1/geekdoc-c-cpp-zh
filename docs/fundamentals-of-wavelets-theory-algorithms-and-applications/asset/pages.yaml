  md: '2. Denoising. The wavelet thresholding method is useful for data denoising.
    Data should be denoised before identifying the transients. Results using denoised
    data appear to be more reliable and robust.


    3. Transient identification. The transient identification algorithm can effectively
    locate the start of new transients. The approach is to identify the intermediate
    resolutions at which the noise singularities have disappeared while the signal
    singularity is still present.


    4. Data reduction. Permanent pressure process gauge data are usually enormous
    due to the long recording time. The pressure data may not change for a long period
    of time. The data reduction algorithm selects only the data that exceed a predetermined
    threshold.


    5. Flow history reconstruction. Using a nonlinear regression model, the flow rate
    history is successfully reconstructed by assuming unknown model parameters and
    matching the pressure response constrained to known flow rates and production
    data.


    6. Behavioral filtering. The behavioral filtering process intends to eliminate
    transients from the data. It can be very effective in reducing the uncertainties
    in the nonlinear regression. Filtering can be carried out by comparing the variance
    transients to the average variance of the overall data.


    7. Data interpretation. Due to the variation of the reservoir properties over
    long duration of the monitoring, a constant data window for analysis may not fit
    the acquired data. A moving window analysis can account for gradual changes in
    reservoir parameters. Otherwise, the estimates of model parameters in that data
    region may not be accurate. The moving window analysis provides parameter distributions
    that capture some of the uncertainties that may be useful in assessing uncertainties
    in subsequent analysis and predictions. It can also be used in reservoir characterization.


