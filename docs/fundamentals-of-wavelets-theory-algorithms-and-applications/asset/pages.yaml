    and } n_i=128; \ \forall i, \quad (9.23)$

    ```


    where $v_i^{wp}$ is the $i$th feature in a wavelet packet feature vector; $n_i$
    is the number of sample in each subband; and $p_{i,j}$ is the $j$th wavelet coefficient
