  md: '# 158 DWT AND FILTER BANK ALGORITHMS


    It is known that the CWT generates redundant information about the signal on the
    time-scale plane. By choosing $(b=k/2^s, a=1/2^s)$, it is much efficient using
    DWT to process a signal. It has been shown that DWT keeps enough information of
    the signal that it reconstructs the signal perfectly from the wavelet coefficients.
    In fact, the number of coefficients needed for perfect reconstruction is the same
    as the number of data samples. This is known as critical sampling, which minimizes
    redundant information.


    The decomposition (analysis) algorithm is used most often in wavelet signal processing.
    It is used in signal identification, although in the latter case, the reconstruction
    of the original signal is not always required. The algorithm separates a signal
    into components at various scales corresponding to successive octave frequencies.
    Each component can be be processed individually by a different algorithm. In echo
    cancellation, for example, each component is processed with an adaptive filter
    of a different filter length to improve convergence. The important issue of this
    algorithm is to retain all pertinent information so that the user may recover
    the original signal (if needed). The algorithm is based on the decomposition relation
    in MRA discussed in Chapter 5. We rewrite several of these relations here for
    reference.


    Let


    ```

    $x_{s+1}(t) \in A_{s+1}, \Rightarrow x_{s+1}(t) = \sum_{k} a_{k,s+1}\phi_{k,s+1}(t)$

    \nx_{s}(t) \in A_{s}, \Rightarrow x_{s}(t) = \sum_{k} a_{k,s}\phi_{k,s}(t)$\ny_{s}(t)
    \in W_{s}, \Rightarrow y_{s}(t) = \sum_{k} w_{k,s}\psi_{k,s}(t).$

    ```


    Since the MRA requires that


    ```

    $A_{s+1} = A_{s} + W_{s}, \quad (7.33)$

    ```


    we have


    ```

    $x_{s+1}(t) = x_{s}(t) + y_{s}(t)\n\sum_{k} a_{k,s+1}\phi_{k,s+1}(t) = \sum_{k}
    a_{k,s}\phi_{k,s}(t) + \sum_{k} w_{k,s}\psi_{k,s}(t). \quad (7.34)$

    ```


    We substitute the decomposition relation


    ```

    $\phi(2^{s+1}t-\ell) = \sum_{k}\{h_{0}[2k-\ell]\phi(2^{s}t-k) + h_{1}[2k-\ell]\psi(2^{s}t-k)\}
    \quad (7.35)$

    ```'
