  md: '# 3.2.2 Comb Function and the Fourier Series Kernel $K_N(t)$


    In this example, we want to find the Fourier series of a periodic impulse train
    [i.e., a periodic train of delta function$^1$ $\delta(t)$]. We write the impulse
    train with period $T$ as


    ```

    $I_T(t) = \sum_{n=-\infty}^{\infty}\delta(t-nT) = \sum_{k=-\infty}^{\infty}\alpha_k
    e^{jk\omega_0t} \quad (3.10)$

    ```


    The Fourier coefficients are given by


    ```

    $\alpha_k = \frac{1}{T}\int_{-T/2}^{T/2}\sum_{n=-\infty}^{\infty}\delta(t-nT)e^{-jk\omega_0t}dt.
    \quad (3.11)$

    ```


    Since the only $n$ that is within the range of integration is $n=0$, we find


    $\alpha_k = \frac{1}{T}, \quad k \in \mathbb{Z}$.


    Therefore, the Fourier series expansion of an impulse train $I_T(t)$ is written
    as


    ```

    $I_T(t) = \frac{1}{T}\sum_{k=-\infty}^{\infty}e^{jk\omega_0t}. \quad (3.12)$

    ```


    It is instructive to examine the behavior of a truncated version of (3.12). Let
    $K_N(t)$ be the $(2N+1)$ finite Fourier sum of $I_T(t)$:


    ```

    $K_N(t) = \frac{1}{T}\sum_{k=-N}^{N}e^{jk\omega_0t}. \quad (3.13)$

    ```


    $K_N(t)$ is known as the *Fourier series kernel*. The geometric series sum in
    (3.13) is carried out to give


    ```

    $K_N(t) = \frac{1}{T}\frac{\sin(N+\frac{1}{2})\omega_0t}{\sin\frac{\omega_0t}{2}}$

    ```


    > This is not a function in the classical sense. It is called a *generalized function*
    or distribution. However, in this book, we will refer to this as a *delta function*.'
