    The perfect reconstruction condition is an important condition in filter bank
    theory. It establishes the unique relationship between the low-pass and high-pass
    pass filters of the analysis section. Removal of the aliasing caused by decimation
    defines the relations between the analysis and synthesis filters. We will elaborate
    these conditions in much greater detail below.


    The filters in a two-channel PR filter bank is specially designed so that the
    component signals can be reconstructed perfectly with no loss of information.
    The output of the filter bank is simply a delayed version of the input signal.
    For a two-channel filter bank, the filtering operation is exactly the same as
    the wavelet algorithm. Because of the PR condition and the need to remove the
    aliasing components in the output, one needs to design only one of the four filters.
    For further details on filter banks and how they relate to wavelet theory, readers
    are referred to Refs. 3–7.'
