    # 4.5.2 Time-Frequency Window


    The definitions of the frequency domain center and radius discussed in Section
    4.1 do not apply to wavelet windows because, unlike the window of STFT in which
    $\hat{\phi}(0)=1$, here the wavelet window $\hat{\psi}(0)=0$. In other words,
    $\hat{\psi}(\omega)$ exhibits band-pass filter characteristics. We have two centers
    and two radii for $\hat{\psi}(\omega)$. We are interested only in the positive
    frequencies. Let us, therefore, define the center $\omega_\psi^*$ and the radius
    $\Delta_\psi^+$ on the positive frequency axis as


    ```

    $$\omega_{\psi^*} := \frac{\int_{-\infty}^{\infty} \omega |\hat{\psi}(\omega)|^2
    d\omega}{\int_{-\infty}^{\infty} |\hat{\psi}(\omega)|^2 d\omega} \quad (4.38)$

    ```


    ```

    $$\Delta_{\psi^+} := \sqrt{\frac{\int_{-\infty}^{\infty} (\omega-\\omega_{\psi^*})^2
    |\hat{\psi}(\omega)|^2 d\omega}{\int_{-\infty}^{\infty} |\hat{\psi}(\omega)|^2
    d\omega}}^{\frac{1}{2}} \quad (4.39)$

    ```


    The definitions for $t^*$ and $\Delta_\psi$ remain the same as those in Section
    4.1, with $\phi(t)$ replaced by $\psi(t)$. For wavelets the uncertainty principle
    gives


    ```

    $$\Delta_{\psi^+} > \frac{1}{2}. \quad (4.40)$

    ```


    If $t^*$ is the center and $\Delta_\psi$ is the radius of $\psi(t)$, then $W_\psi
    f(b, a)$ contains the information of $f(t)$ in the time window


    ```

    $[at^*+b-a\Delta_{\psi}, at^*+b+a\Delta_{\psi}]. \quad (4.41)$

    ```'
