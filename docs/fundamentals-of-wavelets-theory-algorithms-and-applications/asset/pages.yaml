    # 3.8 PARTIAL SUM AND GIBB’S PHENOMENON


    The partial sum of a Fourier series is a least square approximation to the original
    periodic function. Let $p_M(t)$ be the $(2M+1)$ term partial sum of the Fourier
    series of a periodic function $p(t)$ with period $T$


    ```

    $p_M(t)=\sum_{k=-M}^{M}\alpha_ke^{jk\omega_0t}.\quad (3.87)$

    ```


    with the Fourier coefficients given by


    ```

    $\alpha_k=\frac{1}{T}\int_{-T/2}^{T/2}p(t)e^{-jk\omega_0t}dt.\quad (3.88)$

    ```


    Putting $\alpha_k$ back into (3.87), we have the partial sum


    ```

    $p_M(t)=\sum_{k=-M}^{M}\frac{1}{T}\int_{-T/2}^{T/2}p(\tau)e^{-jk\omega_0\tau}e^{jk\omega_0t}d\tau.\quad
    (3.89)$

    ```'
