  md: 'subband; and $w_{i,j}^2$ is the $j$th coefficient of the $i$th subband. As
    a result, a DWT feature vector is formed as given by


    ```

    $$v^{dwt} = \{v_1^{dwt}, v_2^{dwt}, \dots, v_{13}^{dwt}\}. \quad (9.22)$

    ```


    # Wavelet Packet Feature Extraction


    +   1. Perform the wavelet packet multiresolution analysis to the fifth level
    of resolution to obtain 32 subbands. Each subband contains a total of 128 wavelet
    packet coefficients.


    +   2. From each subband at the fifth level of resolution, compute the average
