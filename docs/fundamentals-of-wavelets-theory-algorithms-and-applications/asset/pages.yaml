  md: '# 58 FURIER ANALYSIS


    We pointed out in Chapter 2 that the DTFT can be obtained from the z-transform
    by replacing the variable $z$ with $e^{j\omega}$. For this example, the z-transform
    is


    ```

    $F(z) = \sum_{n=0}^{\infty} a^nz^{-n} = \sum_{n=0}^{\infty}(az^{-1})^n = \frac{1}{1-az^{-1}}$

    ```


    Therefore, replacing the variable $z$ with $e^{j\omega}$ yields


    ```

    $F(z)|_{z=e^{j\omega}} = \hat{f}(\omega)$.

    ```


    The $z$-transform $F(z)$ and the DTFT, $[\hat{f}(\omega)=F(z)|_{z=e^{j\omega}}]$,
    will be used interchangeably in future derivations and discussions on wavelet
    construction.


    # 3.10 DISCRETE FOURIER TRANSFORM (DFT)


    The integral in the inverse DTFT discussed in Section 3.9 must be evaluated to
    recover the original discrete-time signal. Instead of evaluating the integral,
    we can obtain a good approximation by a discretization on the frequency $(\omega)$
    axis.


    Since the function $f(t)$ is band limited (if it is not, we make it so by passing
    through a low-pass filter with sufficiently large width), we need to discretize
    the interval $[-\Omega, \Omega]$ only, namely


    ```

    $\omega_n = \frac{2\pi n}{Nh} n = -\frac{N}{2},\frac{N}{2}$. (3.103)

    ```


    The integral in equation (3.17) can now be approximated as a series sum, namely


    ```

    $\hat{f}(\omega_n) = h \sum_{k=0}^{N-1} f(k)e^{-j\omega nk} = h\hat{f}(n)$ (3.104)

    ```


    where


    ```

    $\hat{f}(n) = \sum_{k=0}^{N-1} f(k)e^{-j\frac{2\pi kn}{N}}.$ (3.105)

    ```'
