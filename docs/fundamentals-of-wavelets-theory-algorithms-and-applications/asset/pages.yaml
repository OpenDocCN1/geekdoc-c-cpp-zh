    its samples $[x(n)]$, the sampling interval $h$ must be chosen such that


    $h \le \frac{\pi}{\Omega}$


    where $2\Omega$ is the bandwidth of the function $x(t)$, i.e., $\hat{x}(\omega)=0$
    for all $|omega| > \Omega$. The choice of $h$ is the Nyquist sampling rate, and
    the Shannon recovery formula


    ```

    $x(t) = \sum_{n\in\mathbb{Z}} x(nh) \frac{\sin\pi(t-nh)}{\pi(t-nh)} \quad (2.75)$

    ```


    enables us to recover the original analog function $x(t)$. The proof of this theorem
    is most easily carried out using the Fourier transform and the Poisson sum of
    Fourier series. We shall differ this proof until Chapter 3.


    # 2.8.2 Linear Shift-Invariant Systems


    Let us consider a system characterized by its impulse response $h(n)$. We say
    the system is linearly shift invariant if the input $x(n)$ and the output $y(n)$
    satisfy the following system relations:


    Shift invariance:


    ```

    ${x(n) \Rightarrow y(n) \\ x(n-n'') \Rightarrow y(n-n'')} \quad (2.76)$

    ```


    Linearity:


    ```

    ${x_1(n) \Rightarrow y_1(n) \text{ and } x_2(n) \Rightarrow y_2(n), \\ x_1(n)+mx_2(n)
    \Rightarrow y_1(n)+my_2(n).} \quad (2.77)$

    ```


    In general, a linear shift-invariant system is characterized by


    ```

    $x_1(n-n'')+mx_2(n-n'') \Rightarrow y_1(n-n'')+my_2(n-n'') \quad (2.78)$

    ```


