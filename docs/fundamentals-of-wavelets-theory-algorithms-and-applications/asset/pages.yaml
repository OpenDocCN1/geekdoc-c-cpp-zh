  md: '# CHAPTER FOUR


    # Time-Frequency Analysis


    We summarized rather briefly the Fourier analysis in the last chapter to refresh
    the memory of the reader and to point out a few important concepts in the analysis
    that will be useful when we discuss the time-frequency analysis. We observe from
    the definition of the Fourier transform (3.19) that the integration cannot be
    carried out until the waveform in the whole of the real line $(-\infty, \infty)$
    is known. This is because the functions $e^{it\omega}$ or $\cos\omega t$ and $\sin\omega
    t$ are global functions. By this we mean that a small perturbation of the function
    at any point along the $t$-axis influences every point on the $\omega$-axis and
    vice-versa. If we imagine the signal $f(t)$ at any point on the $t$-axis it will
    propagate through the entire $\omega$-axis. Another observation we make on the
    Fourier transform is that the integral can be evaluated at only one frequency
    at a time. This is quite inconvenient from a signal-processing point of view.
    Although there are fast algorithms to compute the transform digitally, it cannot
    be carried out in real time. All necessary data must be stored in the memory before
    the discrete or Fourier transform can be computed.


    Although unquestionably the most versatile method, Fourier analysis becomes inadequate
    when one is interested in the local frequency contents of a signal. In other words,
    the Fourier spectrum does not provide any time-domain information about the signal.
    To demonstrate this point, let us examine the function shown in Figure 4.1a, which
    represents a truncated sinusoid of frequency 4Hz in the time domain with perturbations
    $t=0.7$ s and $t=1.3$ s. We saw in the previous chapter that a sinusoid in the
    time domain will appear as a delta function in the frequency domain and vice-versa.
    Observe that the frequency spread near 4Hz in Figure 4.1b is due to the truncation
    of the sinusoid. We conclude from the Fourier spectrum shown in Figure 4.1b that
    the


