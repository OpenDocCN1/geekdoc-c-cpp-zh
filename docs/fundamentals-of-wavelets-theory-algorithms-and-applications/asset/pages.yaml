    # 3.6.1 Partition of Unity


    A direct consequence of Poisson''s sum is that a basis may be found so that unity
    is expressed as a linear sum of the basis. We call this property the partition
    of unity. Let $a$ be $1/2\pi$ in (3.62). Poisson''s sum formula becomes


    ```

    $$\sum_{n=-\infty}^{\infty} f(t+n) = \sum_{k=-\infty}^{\infty} \hat{f}(2\pi k)e^{j2\pi
    kt} \quad (3.65)$

    ```


    If the spectrum of a function $f(t) \in L^2(\mathbb{R})$ is such that


    ```

    $$\hat{f}(2\pi k) = \delta_{0,k} \text{ for } k \in \mathbb{Z}, \quad (3.66)$

    ```


    that is,


    ```

    $$\hat{f}(0) = 1,$

    ```


    and


    then it follows from (3.65) that


    ```

    $$\sum_{n\in\mathbb{Z}} f(t+n) = 1. \quad (3.67)$

    ```


    The first- and second-orders of $B$-splines are good examples of functions satisfying
    this property.


    # First-order B-spline


    ```

    $N_1(t) := \chi_{[0,1)}(t)\n$\hat{N}_1(\omega) = \int_0^{\1} e^{-jx\omega} dt
    = \frac{1-e^{-j\omega}}{j\omega}$\n$\hat{N}_1(0) = \lim_{\omega\to 0} \frac{1-e^{-j\omega}}{j\omega}
    = 1$\n$\hat{N}_1(2\pi k) = 0, \text{ for } k \in \mathbb{Z}\\\{0\}.}$

    ```


    Hence


    ```

    $$\sum_{k\in\mathbb{Z}} N_1(t+k) = 1. \quad (3.68)$

    ```'
