    Its Fourier transform, $\hat{g}((\omega)$, can be computed easily as


    ```

    $$\hat{g}(\omega) = \int_{-\infty}^{\infty} e^{-\alpha t^2} e^{-j\omega t} dt\n=
    \int_{-\infty}^{\infty} e^{-\alpha (t^2+\frac{\omega^2}{4\alpha})} e^{-\frac{\omega^2}{4\alpha}}
    dt\n= e^{-\frac{\omega^2}{4\alpha}} \int_{-\infty}^{\infty} e^{-\alpha (t+\frac{j\omega}{2\alpha})^2}
    dt\n= \sqrt{\frac{\pi}{\\alpha}} e^{-\frac{\omega^2}{4\alpha}}. \quad (3.52)$

    ```


    It is interesting to note that the Fourier transform of a Gaussian function is
    also a Gaussian function. The waveform and its transform are shown in Figure 3.7.

