    As discussed in Section 5,2, before a signal $x(t)$ can be decomposed, it must
    be mapped into an MRA subspace $A_M$ for some appropriate scale $M$, that is,


    $x(t) \mapsto x_M(t) = \sum_k a_{k,M}\phi(2^M t - k).$ (5.46)


    Once we know $\{a_{k,M}\}$ we can use fast algorithms to compute $\{a_{k,s}\}$
    for $s < M$. Fast algorithms will be discussed in later chapters. Here we are
    concerned with the evaluation of the coefficients $\{a_{k,M}\}$.


    If $x(t)$ is known at every $t$, then we can obtain $\{a_{k,M}\}$ of the orthogonal
    projection ($L^2$ projection) of the signal:


    $a_{k,M} = 2^M \int_{-\infty}^{\infty} x(t)\tilde{\phi}(2^M t - k)dt.$ (5.47)


    However, in practice the signal $x(t)$ is known at some discrete points. The given
    time steps determine the scale $M$ to which the function can be mapped. For representation
    such as (5.46), we want it to satisfy two important conditions: (1) interpolatory
    and (2) polynomial reproducibility. By *interpolation representation* we mean
    that the series should be exact, at least at the points at which the function
    is given, $x(k/2^M)=x_M(k/2^M)$. As pointed out before, *polynomial reproducibility*
    means that the representation is exact at every point for polynomials of order
