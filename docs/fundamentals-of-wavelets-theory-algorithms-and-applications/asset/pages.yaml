    It is easy to show that $\hat{\phi}(2\pi k)=\delta_{k,0}$, which is generally
    true for the scaling functions, then $\sum_k \phi(x-k)=1$. If we apply the last
    relation, which (as discussed in Chapter 5) is also known as the partition of
    unity to'
