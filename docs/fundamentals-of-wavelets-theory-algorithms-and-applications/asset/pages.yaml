    **10.8.5.3 MEMS Capacitive Switch.**  One example of a MEMS structure that benefits
    from simulation in MRTD is the MEMS capacitive switch shown in Figure 10.19. The
    gap between the plates in the switch is 1/175th of the substrate thickness. The
    simulation of this device in FDTD is tedious and slow because of the large number
    of cells that must be used to accurately represent the very small gap and substrate.


    In MRTD, the number of cells can be reduced by using the built-in adaptive gridding
    capability of the method. In addition, further efficiencies can be obtained in
    large simulations featuring this structure by allowing fewer cells to be used
    when the electric field variation near the cell is low.


