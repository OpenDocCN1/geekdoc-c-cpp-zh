    # 10.3.4 Wavelet Packets


    Recently, discrete wavelet packet (DWP) similarity transformations has been used
    to obtain a higher degree of sparsity of the matrix than is achievable using the
    standard wavelets [21]. It has also been shown that DWP method gives faster matrix-vector
    multiplication than some of the fast multipole methods.


    In the standard wavelet decomposition, first we map the function to a sufficiently
    high resolution subspace $(V_M)$ and obtain the approximation coefficients $[a_{k,M}]$
    (see Chapter 7). The approximation coefficients $[a_{k,M-1}]$ and wavelet coefficients
    $[w_{k,M-1}]$ are computed from $[a_{k,M}]$. This process continues—that is, the
    coefficients for the next level $M-2$ are obtained from $[a_{k,M-1}]$, and so
    on. Observe that in this scheme, only approximation coefficients $[a_{k,s}]$ are
    processed at each scale $s$; the wavelet coefficients are merely the outputs and
    remain untouched. In a wavelet packet, the wavelet coefficients are also processed,
    which, heuristically, should result in higher degree of sparsity since in this
    scheme, the frequency bands are further divided compared with the standard decomposition
    scheme.


    # 10.4 WAVELETS ON THE BOUNDED INTERVAL


