    # # 9.5 FAULTY BEARING SIGNATURE IDENTIFICATION


    # ## 9.5.1 Pattern Recognition of Acoustic Signals


    Acoustic signal recognition has gained much attention in recent years. It is applicable
    to the recognition of ships from sonar signatures, cardiopulmonary diagnostics
    from heart sounds, safety warnings and noise suppression in factories, and recognition
    of different types of bearing faults in the wheels of railroad cars. The basic
    goal of acoustic signal recognition is to identify an acoustic signature pattern
    from a library of acoustic signatures. Practically all acoustical signature patterns
    are statistical in nature, and they are also highly nonstationary. Using Wavelets
    to extract feature signals for recognition has great potential for success.


    To reliably recognize an acoustic pattern, it is necessary to have a set of distinctive
    features forming each pattern. These feature vectors from different patterns are
    obtained by applying many data sets belonging to a particular event to train a
    recognition algorithm such as an artificial neural network (ANN). After we obtain
    the feature vectors through training, they are stored in a library and used to
    compare with feature vectors from unknown events.


    In this example [5], we apply wavelet techniques and an ANN to identify several
    different types of faults in the wheel bearings of railroad cars.'
