    # 7.2 SIGNAL REPRESENTATION IN THE APPROXIMATION SUBSPACE


    We have shown in Chapter 5 that the approximation subspaces $A_n$ are nested so
    that the subspace $A_{-\infty} = L^2, A_{\infty} = [0]$ and $A_n \subset A_{n+1}$
    for any $n \in \mathbb{Z}$. For an arbitrary finite energy signal $x(t)$ there
    is no guarantee that signal is in any of these approximation subspaces. That is,
    we may not be able to find a coefficients $a_{k,s}$


    ```

    x(t) = \sum_{k \in \mathbb{Z}} a_{k,s} \psi(2^s t - k) \text{ for some } s. \quad
    (7.23)

    ```


    To make use of the two-scale relations for processing, a signal must be in one
    of these nested approximation subspaces. One way to meeting this requirement is
    by projecting the signal into one of the $A_s$ for some $s$. This is particularly
    important if one only knows the sampled values of the signal $x(k/2^s, k \in \mathbb{Z})$
    for some large value of $s$. Assuming that the signal $x(t)$ is not in the approximation
    $A_s$, we wish to find $x_s(t) \in A_s$ such that


    ```

    x(t) \equiv x_s(t) = \sum_{k} a_{k,s} \phi_{k,s}(t) = \sum_{k} a_{k,s} \phi(2^s
    t - k) \quad (7.24)

    ```


    where $a_{k,s}$ are the scaling function coefficients to be computed from the
    signal samples. We will show how one can determine $a_{k,s}$ from the sample data
    $x(t=k/2^s)$ using the orthogonal projection of $x(t)$ on the $A_s$ space. Since
    $A_s$ is a subspace of $L^2$ and $x(t) \in L^2$, we consider $x_s(t)$ as the orthogonal-projection
    of $x(t)$ into the $A_s$ subspace. Then, $x(t) - x_s(t)$ is orthogonal to $A_s$,
    and therefore orthogonal to the basis function $\phi_{l,s}$


    ```

    \langle (x(t)-x_s(t)), \phi_{l,s} \rangle=0, \quad \forall l \in \mathbb{Z}. \quad
    (7.25)

    ```


    Consequently, the coefficients are determined from the equation


    ```

    \langle x_s(t), \phi_{l,s} \rangle = \langle x(t), \phi_{l,s} \rangle = (\sum_{k}
    a_{k,s} \phi_{k,s}(t), \phi_{l,s}(t)) \ \quad (7.26)

    ```


    We expand the last equality yielding'
