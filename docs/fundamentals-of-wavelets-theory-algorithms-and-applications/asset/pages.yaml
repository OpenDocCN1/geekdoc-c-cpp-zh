  md: '# 2.4.1 Haar Basis


    The Haar basis is described by $\chi_{[0,1)}(t)=\chi_{[0,1)}(t-k), k\in\mathbb{Z}$,
    where


    ```

    $\chi_{[0,1)}(t)=\begin{cases}1, & 0\leq t<1;\ 0 & \text{otherwise},\\end{cases}
    \quad (2.25)$

    ```


    is the characteristic function. The Haar basis clearly satisfies the orthogonality
    condition


    ```

    $\Phi_{H,j}(t), \Phi_{H,k}(t)=\int_{-\infty}^{\infty}\chi_{[0,1)}(t-j)\chi_{[0,1)}(t-k)dt=\delta_{j,k}.
    \quad (2.26)$

    ```


    To represent a global function $f(t), t\in(-\infty, \infty)$ with a local basis
    $\phi(t), t\in(a,b)$, functions that exist outside of the finite interval must
    be represented by integer shifts (delays) of the function along the real line.
    Integer shifts of global functions can also form bases for linear spaces. The
    Shannon function $\phi_{SH}(t)$ is an example of such a basis.


    # 2.4.2 Shannon Basis


    The Shannon function is defined by


    ```

    $\phi_{SH}(t)=\frac{\sin \pi t}{\pi} \quad (2.27)$

    ```


    and the basis formed by


    ```

    $\phi_{SH,k}(t)=\frac{\sin \pi(t-k)}{\pi(t-k)}, k\in\mathbb{Z} \quad (2.28)$

    ```


    is an orthonormal basis and global. The proof of the orthonormality is best shown
    in the spectral domain.


    Let $g(t)\in L^2$ be expanded into a series with basis functions $\{\phi_k(t)\}_{k\in\mathbb{Z}}$:


    ```

    $g(t)=\sum_{k}c_k\phi_k(t). \quad (2.29)$

    ```


    The basis set $\{\phi_k(t)\}_{k\in\mathbb{Z}}$ is a Riesz basis if it satisfies
    the following inequality:


    ```

    $R_1\|c_k\|_2^2\leq\|g(t)\|_2^2\leq R_2\|c_k\|_2^2 \quad (2.30)$

    ```


    ```

    $R_1\|c_k\|_2^2\leq|\sum_{k}c_k\phi_k(t)\|_2^2\leq R_2\|c_k\|_2^2, \quad (2.31)$

    ```'
