  md: '# 16 MATHEMATICAL PRELIMINARY


    $0 < R_1 \leq R_2 < \infty$ are called Riesz bounds. The space $\ell^2$ is the
    counter part of $L^2$ for discrete sequences with the norm defined as


    ```

    $||c_k||_{\ell^2} = \left(\sum_k |c_k|^2\right)^{\frac{1}{2}} < \infty. \quad
    (2.32)$

    ```


    An equivalent expression for (2.30) in the spectral domain


    ```

    $0 < R_1 \leq \sum_k |\hat{\phi}(\omega+2\pi k)|^2 \leq R_2 < \infty. \quad (2.33)$

    ```


    The derivation of (2.33) is left as an exercise. A hat over a function represents
    its Fourier transform, a topic that will be discussed in the next chapter. If
    $R_1=R_2=1$, is orthonormal, the basis is orthonormal. The Shannon basis is an
    example of a Riesz basis that is orthonormal, since the spectrum of the Shannon
    function is one in the interval $[-\pi, \pi]$. Hence


    ```

    $\sum_k |\phi_{SH}(\omega+2\pi k)|^2 \equiv 1. \quad (2.34)$

    ```


    If the basis functions $\{\phi(t-k): k \in \mathbb{Z}\}$ are not orthonormal,
    then we can obtain an orthonormal basis set $\{\hat{\phi}^1(t-k) : k \in \mathbb{Z}\}$
    by the relation


    ```

    $\hat{\phi}^1(\omega) = \frac{\hat{\phi}(\omega)}{\{\{\sum_k |\hat{\phi}(\omega+2\pi
    k)|^2\\}^{\frac{1}{2}}}. \quad (2.35)$

    ```


    The Riesz basis is also called a stable basis in the sense that if


    ```

    $g_1(t) = \sum_j a_j^{(1)}\phi_j(t)\ng_2(t) = \sum_j a_j^{(2)}\phi_j(t),

    ```


    then a small difference in the functions results in a small difference in the
    coefficients and vice versa. In other words, stability implies


    ```

    $||g_1(t)-g_2(t)||^2 \Leftrightarrow small \||a_j^{(1)}-a_j^{(2)}||^2. \quad (2.36)$

    ```'
