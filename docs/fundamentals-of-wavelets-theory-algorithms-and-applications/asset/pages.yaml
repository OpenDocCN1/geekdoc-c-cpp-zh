    # 9.12.4 Downhole Pressure Gauge Data Analysis


    Downhole gauges for pressure and temperature are commonly used in oil and gas
    wells to understand dynamic behavior of the field and to monitor reservoir condition
    and performance. Long-term data from permanent gauges are different from short-term
    pressure transient data in several aspects. Long-term data gives insights on aspects
    of behavior as the reservoir is produced. A four-dimensional look at the reservoir
    information instead of a glimpse in time. These long-term data require special
    handling and interpretation. A number of papers [31, 34, 36, 45, 46, 47, 49] deal
    with application of wavelets to downhole pressure data. Most of these methods
    involve following major steps:


    +   1. Outlier removal. Outliers in long-term data can be detected and effectively
    removed using denoising techniques. The outlier detection framework can be applied
    to any type of data, such as geostatistical data.'
