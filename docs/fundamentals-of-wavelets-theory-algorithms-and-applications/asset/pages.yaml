  md: "# 9.7 EDGE DETECTION\n\nEdge is defined as a set of connected pixels that lie\
    \ on the boundary between two regions of relatively uniform intensity. Edge detection\
    \ is a discipline of great importance in digital image processing. It locates\
    \ object boundaries that are useful for image segmentation, image registration,\
    \ and object/shape identification. An edge detected in an image outlines the framework\
    \ of the scene/object. It significantly reduces the data storage requirement by\
    \ filtering out the unnecessary information.\n\nThere are many algorithms for\
    \ detecting edges [7–10] in a digital image. However, they can be largely classified\
    \ into two categories: the gradient (first derivative of the signal) approach\
    \ and the Laplacian (second derivative of the signal) approach. We will consider\
    \ some representative algorithms of these two classes as well as wavelet- and\
    \ curvelet-based approaches.\n\nAn ideal edge should be like a step function,\
    \ but in practice, edges are blurred and closely modeled as ramp functions (Figure\
    \ 9.23). A blurred edge can be modeled mathematically at x = 0 by an error function\
    \ given\n\n```\n$f(x)=\\frac{I_{x>0}-I_{x<0}}{2}\\left\\text{erf}\\left(\\frac{x}{\\\
    sqrt{2}}\\right)+1\\right]+I_{x<0}$\\quad(9.33)\n```\n\nwhere the error function\
    \ $\\text{erf}(y)=(2/\\pi)\\int_0^y e^{-u^2}du$ is bounded by $\\pm1$ as the variable\
    \ $y \\to \\pm\\infty$. Another model for an edge is\n\n```\n$f(x)=1+\tanh(\\\
    beta x)$\\quad(9.34)\n```\n\nwhich has similar behavior as the error function\
    \ model. The steepness of the edge is controlled by the parameter $\\beta$.\n\n\
    It is easy to see that the first derivative of these models at $x=0$ attains a\
    \ maximum such that the second derivative for these modeling function becomes\
    \ $0$ at $x=0$, which is the center of the edge.\n\n![](img/62a0222c021def890c636babf0dc030a_285_0.png)"
