  md: 'is used for defining approximation basis and wavelet basis on irregular grid
    points.


    Another scheme for subdivision is the interpolating average algorithm. The simplest
    algorithm for the new value at the higher resolution is


    ```

    $a_{2k,j+1} = a_{j,k}$

    a_{2k+1,j+1} = a_{j,k}$.

    ```


    A slightly more complicated one will be using a quadratic polynomial. We need
    to define a quadratic polynomial $q(x)$ such that


    ```

    $$\begin{aligned}\na_{k-1,j} &= \int_{2^{k-1}}^{2^k} q(x)dx\nna_{k,j} &= \int_{2^k}}^{2^{k+1}}
    q(x)dx.\na_{k+1,j} &= \int_{2^{k+1}}^{2^{k+2}} q(x)dx\end{aligned}$

    $ (8.76)

    ```


    The resulting quadratic polynomial will be used to compute the unknown values
    at $2^{j+1}$ level so that


    ```

    $$\begin{aligned}\na_{2k,j+1} &= \int_{2^k}}^{2^{k+1/2}} q(x)dx\nna_{k+1,j} &=
    \int_{2^{k+1/2}}}^{2^{k+1}} q(x)dx\end{aligned}$

    $ (8.77)

    ```


    For two-interval average, the coefficients are $\{-1/2, 1/2\}$, while the quadratic
    polynomial results in $\{-1/8, 1/8, 1, 1/8, -1/8\}$. The graphs for these two
    scaling functions are shown in Figure 8.29.


    For the construction of wavelet basis function, we need to recall that the wavelet
    space $W_{j-1}$ is a subspace complement of $V_{j-1}$ in $V_j$. If a function
    $f(t)$ is expressed as


    ```

    $f(x) = \sum a_{k,j}\phi_{k,j}(x),$ (8.78)

    ```


    a similar expression can be obtained for $f_{j-1}(x)$. The multiresolution analysis
    requires $f_{j-1}(x) + g_{j-1}(x) = f(x)$, the $g_{j-1}(x)$ represents the contribution
    from the wavelet subspace. Hence if the reconstruction process is carried out
    from $(j-1)$ level to $j$ level with one detail coefficient $d_{0,0}=1$ and the
    rest of the $d$ coefficients set to zero, we will obtain the coefficients connecting
    the scaling function and the wavelet as $q_k$


    ```

    $\psi_{0,0}(x) = \sum q_k\phi_{k,1}(x).$.

    ```


    Wavelets from interpolative subdivision and average subdivision are shown in Figure
    8.30.'
