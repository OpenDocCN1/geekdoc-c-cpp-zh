    By removing this interference, we obtain the wavelet-packet based cross-term deleted
    representation (WPCDR), given by


    ```

    $WPCDR(t,f) = \sum_{j,m} WVD_{s_{j,m}}(t,f). \quad (9.14)$

    ```


    We remark that the WPCDR accurately gives the auto WVD of the signal components
    within each subband; therefore, it is quite effective and perhaps the best choice
    for analyzing a multicomponent signal. In addition, the WPCDR is computationally
    advantageous, since both decomposition and representation can be implemented efficiently.


