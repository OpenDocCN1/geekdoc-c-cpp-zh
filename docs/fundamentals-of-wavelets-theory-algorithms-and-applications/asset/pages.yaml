    In this chapter we are concerned with the construction of orthonormal, semi-orthogonal,
    and biorthogonal wavelets. The construction problem is paramount to finding suitable
    two-scale and decomposition sequences as introduced in Chapter 5. It turns out
    that these coefficients for orthonormal wavelets can be easily derived from those
    of semiorthogonal wavelets. Therefore, we first discuss the semiorthogonal wavelet
    followed by orthonormal and biorthogonal wavelets.


    Recall that for the semiorthogonal wavelet, both $\phi(t)$ and $\hat{\phi}(t)$
    are in $A_0$, and $\psi(t)$ and $\hat{\psi}(t)$ are in $W_0$. Consequently, we
    can write $\phi(t)$ in terms of $\hat{\phi}(t)$; similarly for $\psi(t)$. These
    relations as given by (5.21) and (5.22) are reproduced here.


    ```

    $$\hat{\phi}(\omega) = \frac{\hat{\phi}(\omega)}{E_{\phi}(e^{i\omega})}\quad (6.1)$

    ```


    ```

    $$\hat{\psi}(\omega) = \frac{\hat{\psi}(\omega)}{E_{\psi}(e^{i\omega})}\quad (6.2)$

    ```


    with the Euler-Frobenius-Laurent (E-F-L) polynomial $E_f(e^{i\omega})$ given by


    ```

    $E_f(e^{i\omega}) := \sum_{k=-\infty}^{\infty} |\hat{f}(\omega+2\pi k)|^2 = \sum_{k=-\infty}^{\infty}
    A_f(e^{i\omega})k. \quad (6.3)$

    ```


    We will, therefore, concentrate on the construction of $\phi$ and $\psi$ only.


