    # 9.8.5 Spatial Oriented Tree (SOT)


    Said and Pearlman [15, 16] discovered set partitioning principles to improve the
    performance up to 1.3 dB over that of the zerotree method. They observed that
    there is a spatial self-similarity between subbands, and the discrete wavelet
    coefficients (DWCs) are expected to be better magnitude ordered if one moves downward
    in the pyramid following the same spatial orientation. On this observation, a
    tree structure called a spatial orientation tree (SOT) is used to define the spatial
    relationship of the DWCs in the hierarchical structure. Three main concepts are
    proposed by Said and Pearlman to adapt the better performance in image coding:
    (1) partial ordering of the transformed image by magnitude and transmission of
    coordinates via a subset partitioning algorithm, (2) ordered bit-plane transmission
    of refinement bits, and (3) exploitation of the self-similarity of the DWCs across
    the different scales.'
