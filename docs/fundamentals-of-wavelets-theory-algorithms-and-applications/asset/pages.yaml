  md: '# Special Topics in Wavelets and Algorithms


    In Chapter 7 we discussed standard wavelet decomposition and reconstruction algorithms.
    By applying an optimal-order local spline interpolation scheme as described in
    Section 5.6, we obtain the coefficient sequence $a^M$ of the desired B-spline
    series representation. Then, depending on the choice of linear or cubic spline
    interpolation, we apply the change-of-bases sequences (Section 7.5) to obtain
    the coefficient sequence $a^M$ of the dual series representation for the purpose
    of FIR wavelet decomposition.


    A typical time-scale grid obtained by following the implementation scheme described
    in Chapter 7 is shown in Figure 7.7. In other words, the IWT values of the given
    signal at the time-scale positions in Figure 7.7 can be obtained (in real time)
    by following this scheme. However, in many signal analysis applications, such
    as wide-band correlation processing [1] used in some radar and sonar applications,
    this information on the IWT of f on such sparse set of dyadic points (as shown
    in Figure 7.7), is insufficient for the desired time-frequency analysis of the
    signal. It becomes necessary to compute the IWT at nondynamic points as well.
    By maintaining the same time resolution at all the binary scales, the aliasing
    and the time variance difficulties associated with the standard wavelet decomposition
    algorithm can be circumvented. Furthermore, as will be shown in this chapter,
    computation only at binary scales may not be appropriate to separate all the frequency
    contents of a function.


    An algorithm for computing the IWT with finer time resolution was introduced by
    Rioul and Duhamel [2] and Shensa [3]. In addition, there have been some advances
    in fast computation of the IWT with finer frequency resolution, such as the multivoice
    for octave (mvpo) scheme, first introduced


    > Fundamentals of Wavelets: Theory, Algorithms, and Applications, Second Edition,

    By Jaideva C. Goswami and Andrew K. Kan

    Copyright © 2011 John Wiley & Sons, Inc.'
