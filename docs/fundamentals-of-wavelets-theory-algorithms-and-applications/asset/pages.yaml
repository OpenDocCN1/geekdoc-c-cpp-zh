    sharp pulse near $4$ Hz *primarily* from the sinusoid of $4$ Hz, and the small
    ripples that appear throughout the frequency axis are *primarily* due to some
    delta functions (sharp changes) in the time domain. However, we are unable to
    point out the locations of these delta functions in the time axis by observing
    the spectrum of Figure 4.1b. This can be explained simply by the Fourier representation
    of delta function (3.25). The delta function requires an infinite number of sinusoidal
    functions that combine constructively at $t = 0$ while interfering with one another
    destructively to produce zero at all points $t \neq 0$. This shows extreme cbersomeness
    and ineffectiveness of using global functions $e^{ilt}$ to represent local functions.
    To correct this deficiency, a local analysis is needed to combine both the time-domain
    and the frequency-domain analysis to achieve *time-frequency analysis*, by means
    of which we can extract the local frequency contents of a signal. This is very
    important, since in practice we may be interested in only some particular portion
    of the spectrum and, therefore, we may like to know which portion of the time-domain
    signal is primarily responsible for a given characteristic in the spectrum.


    Common sense dictates to know that the local frequency contents of a signal, we
    should first remove the desired portion from the given content and then take the
    Fourier transform of the removed part. Such a method of the time-frequency analysis
    is referred to as *short-time Fourier transform* (STFT). Before we discuss STFT,
    let us discuss the notion of *window function*, by means of which the desired
    portion of a given signal can be removed.'
