    which the interested reader can obtain from many excellent books available on
    these topics, we simply mention here that by appropriately arranging the data
    of length $N$ where $N$ is an integer power of 2 (known as decimation-in-time
    and decimation-in-frequency arrangements), we can compute the discrete Fourier
    transform in an $O(N \log_2 N)$ operation. If $N$ is not an integer power of 2,
    we can always make it so by padding the data sequence with zeros.


