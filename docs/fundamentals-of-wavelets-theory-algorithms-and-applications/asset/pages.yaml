  md: '# 2.8.6 Inverse z-Transform


    The formula for recovering the original sequence from its z-transform involves
    complex integration of the form


    ```

    $X(n)=\frac{1}{2\pi j}\oint_{C} X(z)z^{n-1}dz \quad (2.86)$

    ```


    where the contour is taken within the $ROC$ of the transform in the counter-clockwise
    direction. For the purpose of this text, we shall not use (2.86) to recover the
    sequence. Since the signals and filters that are of interest in this book are
    rational functions of $z$, it is more convenient to use partial fractions or long
    division to recover the sequence.


    **Example:** Determine the sequence $x(n)$ corresponding to the following z-transform


    ```

    $X(z)=\frac{z-1}{(z-0.7)(z-1.2)}=\frac{z-1}{z^{2}-1.9z+0.84}, ROC: |z|>1.2$

    ```


    **Solution:** Using long division, we have


    ```

    $X(z)=z^{-1}+0.9z^{-2}+0.87z^{-3\|+\frac{0.897z^{-2}-0.7308z^{-3}}{z^{2}-1.9z+0.84}$

    ```


    Obviously, $x(0)=0, x(1)=1, x(2)=0.9, x(3)=0.87, \dots x(n)$ is a right-sided
    infinite sequence since the $ROC$ is outside a circle of radius, $r=1.2$.


    If $ROC:|z|<0.7, x(n)$ is a left-sided sequence. We obtain


    ```

    $X(z)=\frac{-1+z}{.84-1.9z+z^{2}}-\frac{1}{.84},-\frac{1}{.84}(1-\frac{1.9}{.84})z+\dots$

    ```


    using long division. The sequence $\{x(n)\}$ becomes a sequence of ascending powers
    of $z$ and is a left-sided sequence where $x(0)=-1/.84=-1.19, x(-1)=1/.84[1-(1.9/.84)]=-1.5,
    x(-2)=\dots$.


