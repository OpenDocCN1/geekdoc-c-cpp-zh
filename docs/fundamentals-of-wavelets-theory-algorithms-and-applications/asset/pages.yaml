    # 10.3.3 Wavelets in Spectral Domain


    In the preceding chapters, we have used wavelets in the time (space) domain. In
    previous sections, the local support and vanishing moment properties of wavelet
    bases were used to obtain a sparse matrix representation of an integral equation.
    In some applications, particularly in the spectral domain methods in the electromagnetic
    problems, wavelets in the spectral domain may be quite useful. Whenever we have
    a problem in which the unknown function is expanded in the time domain while the
    numerical computation takes place in the spectral domain, we should look at the
    time-frequency window product to determine the efficiency of using the basis function.
    Because of the nearly optimal time (space-frequency wave number) window product
    of the cubic spline and the corresponding semiorogonal wavelet appearing in the
    transmission line discontinuity problems can be evaluated efficiently. In this
    section we consider an example from a transmission line discontinuity to illustrate
    the usefulness of wavelets in the spectral domain.


    Transmission line configurations are shown in Figure 10.3. Formulation of the
    integral equation for these configurations is not the purpose of this section.
    Readers may refer to $[5, 29, 30]$ for details on such formulation. The integral
    equation obtained is


    ```

    $\Lambda(K_{k_x,k_y})\hat{f}(k_y)\hat{\phi}(-k_y)dk_xdk_y=0 \quad (10.32)$

    ```'
