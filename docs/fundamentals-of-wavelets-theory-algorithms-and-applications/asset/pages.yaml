  md: '# 3.7 SAMPLING THEOREM


    The sampling theorem is fundamentally important to digital signal analysis. It
    states that if a signal $f(t)$ is bandlimited with bandwidth $2\Omega$, then the
    signal $f(t)$ can be exactly reconstructed from its sampled values at equidistant
    grid points. The distance between adjacent sample points, called the sampling
    period $h$, should not be less than $\pi/\Omega$. The function $f(t)$ is recovered
    by using the formula


    ```

    $f(t) = h \sum_{k\in\mathbb{Z}} f(kh) \frac{\sin[\Omega(t-kh)]}{\pi(t-kh)}, \quad
    k\in\mathbb{Z}. \quad (3.77)$

    ```


    If $h = \pi/\Omega$, the sampling frequency $f_s=1/h=\Omega$ is called the Nyquist
    rate. Theoretically, $f(t)$ can always be reconstructed perfectly from samples
    if $h < \pi/\Omega$. In practice, however, we cannot recover $f(t)$ without error
    due to the infinite nature of the sinc function. Let $\hat{f}(\omega)$ be the
    Fourier transform of $f(t)$


    ```

    $$\hat{f}(\omega) = \int_{-\infty}^{\infty} f(t)e^{-j\omega t}dt.$

    ```


    The integral can be approximated using Simpson''s rule as


    ```

    $$\hat{f}(\omega) \equiv \hat{F}(\omega) = h \sum_{k\in\mathbb{Z}} f(kh)e^{-j\omega
    kh} \quad (3.78)$

    ```


    Using Poisson''s sum formula in (3.64), we can rewrite $\hat{F}(\omega)$


    ```

    $$\hat{F}(\omega) = h \sum_{k\in\mathbb{Z}} f(kh)e^{-j\omega kh} \n= \sum_{k\in\mathbb{Z}}
    \hat{f}(\left(\frac{\omega+2\pi k}{h}\right)) \\n= \hat{f}(\omega) + \sum_{k\in\mathbb{Z}\setminus\0\}}
    \hat{f}(\left(\omega+\frac{2\pi k}{h}\right)) \ \quad (3.79)$

    ```


    Hence $\hat{F}(\omega)$ contains $\hat{f}(\omega)$ plus infinitely many copies
    of $\hat{f}(\omega)$ shifted along the $\omega$-axis. In order for $\hat{f}(\omega)$
    to be disjoint with its copies, the amount of shift, $2\pi/h$, must be at least
    $2\Omega$ (see Figure 3.9):


    ```

    $$\frac{2\pi}{h} \ge 2\Omega, \quad h \le \frac{\pi}{\Omega}. \quad (3.80)$

    ```'
