    # 3.6 POISSON''S SUM AND PARTITION OF UNITY


    We return to the Fourier series and discuss the Poisson''s sum whose derivation
    is made much simpler by using some properties of the Fourier transform. In many
    applications, it is necessary to format a periodic function from a nonperiodic
    function with finite energy for the purpose of analysis.


    Poisson''s sum formula is useful in relating the time-domain information of such
    a function with its spectrum. Let $f(t) \in L^2(\mathbb{R})$. The periodic version
    of $f(t)$, to be called $f_p(t)$, is obtained by


    ```

    $$f_p(t) := \sum_{n=-\infty}^{\infty} f(t+2\pi n), \quad (3.53)$

    ```


    where we have assumed $T=2\pi$ to be the period of $f_p(t)$. Consequently, $\omega_0=2\pi/T=1$,
    and the Fourier representation of $f_p(t)$ is


    ```

    $$f_p(t) = \sum_{k=-\infty}^{\infty} c_k e^{jkt}, \quad (3.54)$

    ```


    with the coefficient $c_k$ given by


    ```

    $$c_k = \frac{1}{2\pi} \int_{0}^{2\pi} f_p(t)e^{-jkt}dt\n= \frac{1}{2\pi} \int_{0}^{2\pi}
    \sum_{n\in\mathbb{Z}} f(t+2\pi n)e^{-jkt}dt\n= \frac{1}{2\pi} \int_{0}^{2\pi}
    \sum_{n\in\mathbb{Z}} f(t+2\pi n)e^{-jkt}dt\n= \frac{1}{2\pi} \sum_{n\in\mathbb{Z}}
    \int_{0}^{2\pi(n+1)} f(\xi)e^{-j(\xi-2\pi n)}d\xi, \quad (3.55)$

    ```'
