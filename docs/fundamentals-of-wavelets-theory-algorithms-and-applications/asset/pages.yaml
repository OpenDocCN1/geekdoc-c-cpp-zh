    limited number of radiologists. Consequently, human error can cause the percentages
    of false negatives (a true target missed) up to 20% [21]. If a computer-aided
    diagnostic (CAD) algorithm were designed and constructed, it could serve as a
    second opinion to help the radiologist by pointing out suspicious regions in the
    mammogram needing a more detailed screening. This application example attempts
    to show how a 2D wavelet algorithm working in conjunction with other image-processing
    techniques can identify the microcalcifications in mammograms and localize the
    suspicious regions.


    # 9.9.1 CAD Algorithm Structure


    Success in signature recognition greatly depends on the features one can extract
    from a signature. The more distinct the features, the higher the success rate
    for making a positive identification. The most important objective in the detection
    and recognition of microcalcifications is to remove the background noise and enhance
    the object to be identified. We use several traditional image-processing techniques
    to work with the wavelet decomposition algorithm to achieve this objective. Decision-making
    rules in some of these algorithms are oriented and therefore are dependent. Parameter
    choices often depend on the data to be analyzed. The CAD algorithm for microcalcification
    cluster detection in a highly textured and clustered background is illustrated
    in Figure9.30. The image-processing techniques used in this CAD algorithm include
    nonlinear image enhancement, wavelet pyramidal and directional image decomposition
    and reconstruction, wavelet coefficient domain operations, dark pixel removal,
    constant false alarm rate (C-FAR) type adaptive thresholding, adaptive resonance
    theory clustering, and false cluster discrimination.


    # 9.9.2 Partitioning of Image and Nonlinear Contrast Enhancement


    We partition the mammogram to be analyzed by simply dividing the image into a
    number of equal-size subimages. In this case, the size of the mammogram is 1024
    × 1024, and we divide it up to 64 subimages of size 128 × 128. Each partitioned
    subimage is separately processed to bring out locally significant details of the
    input image with contrast enhancement. This step provides better localization
    for detection of the targets. Since wavelet processing is known to handle the
    image boundary better than DCT, we are ensured that information is not lost in
    the partitioning. We use a cubic mapping to suppress pixels with low gray scale
    values and enhance pixels with large gray scale values.


