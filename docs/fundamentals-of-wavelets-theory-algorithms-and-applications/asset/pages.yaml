    with wide bandwidth, this Nyquist rate may be too high for the low frequency portion
    of the chirp. Consequently, there is a lot of redundant information to be carried
    around if one uses a fixed rate for the entire chirp. There is the area of multirate
    signal processing which deals with signal representation using more than one sampling
    rate. The mechanisms for changing the sample rate are decimation and interpolation.
    We discuss their basic characteristics in the time and spectral domains here.


    # 7.1.1 Decimation


    An $M$-point decimation retains only every $M$th sample of a given signal. In
    the time-domain, an $M$-point decimation of an input sequence $[x(n)]$ is given
    by


    $y(n)=x(nM), \text{ for } n \in \mathbb{Z}. \quad (7.1)$


    Figure 7.1 depicts the system diagram of an $M$-point decimator. The output of
    the decimator may be written in terms of a product of $x(n)$ and a sequence of
    unit impulses separated by $M$ samples $\sum_{k\in\mathbb{Z}} \delta(n-kM)$. Let


    $u(n)=\sum_{k\in\mathbb{Z}} x(n)\delta(n-kM), \text{ for } k \in \mathbb{Z} \quad
    (7.2)$


    which selects only the $kM$th samples of $x(n)$. The Fourier series representation
    of the $M$-point period impulse sequence (7.2) is


    $\sum_{k\in\mathbb{Z}} \delta(n-kM)=\frac{M-1}{M}\sum_{k=0}^{M-1} e^{-j2\pi kn/M}
    \quad (7.3)$


    Based on the geometric sum


    $\sum_{k=0}^{M-1} e^{-j2\pi kn/M}=\begin{cases} M, & \text{for } k=\ell, \ell
    \in \mathbb{Z}, \ 0, & \text{otherwise},\ \end{cases}$


    ![](img/62a0222c021def890c636babf0dc030a_169_0.png)


    FIGURE 7.1: An $M$-point decimator.'
