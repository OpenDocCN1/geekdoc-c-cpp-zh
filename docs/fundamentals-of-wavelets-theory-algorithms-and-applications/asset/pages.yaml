    # 7.8.2 Time-Domain Analysis


    The development of the filter bank theory is primarily based on the spectral analysis,
    we discuss the time-domain equivalent of the theory for enhancement of the understanding
    and for the digital implementation of the algorithm. Thus it suffices to illustrate
    the meaning of the terms, filter requirements, and the filter systems in terms
    of time domain variables.


    # 7.8.2.1 Causality. An FIR filter is causal if the impulse response


    ```

    $h(n)=0 \quad \forall \quad n<0$.

    ```


    The z-transform of $h(n)$ is a right-sided polynomial of $z^{-1}$


    ```

    $H(z)=h(0)+h(1)z^{-1}+h(2)z^{-2})+\dots+h(m)z^{-m}$.

    ```


    If $H(z)$ is a causal filter, then $H(z^{-1})$ is anticausal


    ```

    $H(-z^{-1})=h(0)-h(1)z+h(2)z^2+\dots+h(m)z^m$.

    ```


    which is a left-sided polynomial of $z$. As a result, $H(-z^{-1})$ is also anticausal
    since the polynomial is the same as that of $H(z^{-1})$ except the signs of odd
    coefficients have been changed


    ```

    $H(-z^{-1})=h(0)-h(1)z+h(2)z^2-\dots-h(m)z^m$.

    ```'
