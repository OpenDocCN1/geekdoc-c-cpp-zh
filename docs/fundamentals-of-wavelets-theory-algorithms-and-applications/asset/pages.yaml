  md: 'in ODE case, with nonconstant coefficients, and in PDEs, we generally use finite
    element or finite difference type methods. In this section we describe wavelet-based
    method to solve differential equations and give a few examples illustrating such
    applications.


    # 10.8.1 Multigrid Method


    In the traditional finite element method (FEM), local bases are used to represent
    the unknown function and the solution is obtained by Galerkin''s method, similar
    to the approach described in previous sections. For the differential operator,
    we get sparse and banded stiffness matrices that are generally solved using iterative
    techniques, the Jacobi method for instance.


    One of the disadvantages of conventional FEM is that the condition number (x)
    of the stiffness matrix grows as $O(h^{-2})$ with the discretization step. As
    a result, the convergence of the iterative technique becomes slow and the solution
    becomes sensitive to small perturbations in the matrix elements. If we study how
    the error decreases with iterative techniques, such as the Jacobi method, we find
    that the error decreases rapidly for the first few iterations. After that, the
    rate at which the error decreases slows down [39]. Such methods are also called
    *high-frequency methods* since these iterative procedures have a "smoothing" effect
    on the high-frequency portion of the error. Once the high-frequency portion of
    the error is eliminated, convergence comes quite slow. After the few iterations,
    if we could discretize the domain with coarser grids and then go to lower frequency,
    the convergence rate would be accelerated. This leads us to a multigrid-type method.


    Multigrid or hierarchical methods have been proposed to overcome the difficulties
    associated with the conventional method [39–55]. In this technique, one performs
    a few iterations of the smoothing method (Jacobi-type) and then the intermediate
    solution and the operator are projected to a coarser grid. The problem is then
    solved at the coarse grid and by interpolation one goes back to the finer grids.
    By going back and forth finer and coarser grids, the convergence can be accelerated.
    It has been shown for elliptic PDEs, for wavelet-based multilevel methods, the
    condition number is independent of discretization step, that is, $k=O(1)$ [50].
    The multigrid method is too involved to be discussed in this book. Readers are
    encouraged to look at the references provided at the end of this chapter.


    Multiresolution aspects of wavelets have also been applied in evolution equations
    [54–69]. In evolution problems, the space and time discretization are interrelated
    to gain a stable numerical scheme. The time-step must be determined from the smallest
    space discretization. This makes the computation quite complex. A space-time adaptive
    method has been introduced in [55], where wavelets have been used to adjust the
    space-time discretization steps locally. The rest of the discussion and results
    in this section are primarily derived from [69].'
