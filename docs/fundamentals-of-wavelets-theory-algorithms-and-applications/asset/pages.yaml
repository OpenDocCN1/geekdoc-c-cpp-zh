    A fast computation of $N_m(t)$, for $m \geq 2$, can be achieved using the following
    formula [7, p. 131].


    ```

    $N_m(t) = \frac{t}{m-1}N_{m-1}(t) + \frac{m-t}{m-1}N_{m-1}(t-1)$

