    # 8.4 COMPLEX WAVELETS


    As mentioned in Chapter 6, continuous real-valued compactly supported orthonormal
    wavelets do not have linear phases—that is, they do not have any symmetry or antisymmetry.
    In addition, all wavelets and wavelet algorithms that we have discussed thus suffer
    from few drawbacks: (1) shift variance—as a result of which wavelet coefficients
    of a shifted signal significantly differs from the original one (in Fourier transform,
    such shifts appear simply as a phase shift in the transformed domain); (2) aliasing
    due to up and down-sampling; (3) directional inflexibility of the tensor product
    2D wavelets for image processing, especially for detecting edges and ridges; and
    (4) the oscillatory property of the wavelet complicates the detection of singularity.
    Complex wavelets seem to address these issues effectively. A detailed discussion
    on complex wavelets is beyond the scope of this book. In this section we give
    brief introduction of the topic; readers may refer to [15-18] for further details.


    Similar to the Fourier transform kernel $(e^{i\omega} = \cos\omega + j\sin\omega)$,
    consider a complex wavelet with real and imaginary parts as


    ```

    $$\psi_{c}(t)=\psi_{r}(t)+j\psi_{i}(t), \quad (8.47)$

    ```


    where $\psi_{r}$ is an even and $\psi_{i}$ is an odd function of $t$. Complex
    scaling function may be defined in a similar way.


    Let us recall from the DWT that a signal $x(t)$ may be decomposed into components
    using the scaling function $\phi(t)$ and its associated wavelet $\psi(t)$ as


    ```

    $x(t)=\sum_{k=-\infty}^{\infty}a(k)\phi(t-k)+2^{j/2}\sum_{s=0}^{\infty}\sum_{n=-\infty}^{\infty}w(n,s)\psi(2^{s}t-n),
    \quad (8.48)$

    ```


    where $a(k)$ and $w(n,s)$ are scaling-function and wavelet coefficients, respectively.
    In complex wavelet analysis, the coefficients


    ```

    $w(n,s)=w_{r}(n,s)+jw_{i}(n,s)$

    ```


    ```

    =2^{s/2}\int_{-\infty}^{\infty}x(t)[\psi_{r}(2^{s}t-n)+j\psi_{i}(2^{s}t-n)]dt,$

    ```


