    # 3.4 PROPERTIES OF FOURIER TRANSFORM


    Since the focus of this chapter is not a detailed exposition of the Fourier analysis,
    only the properties that are relevant to wavelet analysis will be discussed.


    # 3.4.1 Linearity


    If $f(t) = \alpha f_1(t) + \beta f_2(t)$, for some constants $\alpha$ and $\beta$,
    then the Fourier transform is


    ```

    $$\hat{f}(\omega) = \int_{-\infty}^{\infty} f(t)e^{-j\omega t}dt=\alpha \int_{-\infty}^{\infty}
    f_1(t)e^{-j\omega t}dt+\beta \int_{-\infty}^{\infty} f_2(t)e^{-j\omega t}dt$\n=\alpha
    f_1(\omega)+\beta f_2(\omega).$ (3.26)$

    ```


    The extension of (3.26) to the finite sum of functions is trivial.


    # 3.4.2 Time Shifting and Time Scaling


    Let the function $f(t)$ be shifted by an amount $t_0$. The spectrum is changed
    by a phase shift. Indeed, the spectrum of the shifted function $f_0(t) := f(t-t_0)$
    is expressed by


    ```

    $$\hat{f}_0(\omega) = \int_{-\infty}^{\infty} f(t-t_0)e^{-j\omega t}dt=\int_{-\infty}^{\infty}
    f(u)e^{-j\omega(u+t_0)}du$\n=e^{-j\omega t_0}\hat{f}(\omega)=|\hat{f}(\omega)|e^{j(\phi(\omega)-\omega
    t_0)},$ (3.27)$

    ```


    where $\phi(\omega)$ is the phase of the original function $f(t)$. The magnitude
    of the spectrum remains unchanged for a shifted signal. The shifting is incorporated
    into the phase term of the spectrum.'
