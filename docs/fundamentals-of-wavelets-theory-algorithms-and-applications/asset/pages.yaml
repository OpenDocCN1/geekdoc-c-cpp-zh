  md: "234 SPECIAL TOPICS IN WAVELETS AND ALGORITHMS\n\n# 8.5.2 Construction of Scaling\
    \ Function and Wavelet from Lifting Scheme\n\nThus far have described the lifting\
    \ algorithm as a means to obtain the average and the difference from a given set\
    \ of data. From the DWT point of view, these data streams correspond to the approximation\
    \ coefficients and the wavelet coefficients for the next lower level of resolution.\
    \ However, the predicting and updating schemes are user designed, and therefore,\
    \ there are no known scaling function and wavelet bases based on the schemes.\
    \ Unlike the classical wavelet construction where the Fourier analysis is used\
    \ extensively, in lifting schemes, subdivision algorithms are often used in the\
    \ literature. These are important techniques in computer-aided curve and surface\
    \ designs. A detail exposition on the topic is beyond the scope of this section.\
    \ We will use only the elementary ones to demonstrate the procedure of wavelet\
    \ construction from lifting.\n\n# 8.5.3 Linear Interpolative Subdivision\n\nSubdivision\
    \ is a method of refining a set of original data (i.e., to increase the number\
    \ of data points by suitably inserting data in between two original data points).\
    \ Interpolative subdivision means that the original data points are not changed\
    \ by running the algorithm. One simple way to subdivide data is by using the average\
    \ of the adjacent value as the new (inserted) data value. Let $a_{k,0}$ be the\
    \ original data set. We compute the expanded set by\n\n```\n$a_{2k,j+1} = a_{k,j}$\n\
    ```\n\n```\n$a_{2k+1,j+1} = \frac{1}{2}(a_{k,j} + a_{k+1,j}).$\n```\n\nThe new\
    \ data points are inserted halfway between two adjacent old data points. Its value\
    \ is the linear interpolation of the two adjacent old values. If the original\
    \ data values are samples from linear functions, this linear subdivision algorithm\
    \ will reproduce the linear functions.\n\nMore sophisticated algorithms are available\
    \ for interpolative subdivision. One can use more values (original data values)\
    \ to adjust the data point location to compute its value. If we use four-points\
    \ $(a_{k-1,j}, a_{k,j}, a_{k+1,j}, a_{k+2,j})$ and a cubic interpolation to compute\
    \ the value of $a_{2k+1,j+1}$, the resulting value is a weighting of the 4 original\
    \ values\n\n```\n$a_{2k+1,j+1} = \frac{-1}{16}a_{k-1,j} + \frac{9}{16}a_{k,j}\
    \ + \frac{9}{16}a_{k+1,j} - \frac{1}{16}a_{k+2,j}$.\n```\n\nThis is known as the\
    \ four-point scheme in computer graphics.\nThe interpolative subdivision is a\
    \ very yet powerful algorithm to refine a set of data. A new sample value at a\
    \ given location is computed via an interpolating polynomial constructed by using\
    \ near sample values. If the samples are equidistant, the weights for the polynomial\
    \ need to be computed only once. Since equidistant sample is not a requirement\
    \ for subdivision, it can"
