    # 6.4.3 Battle-Lemarie Scaling Function


    Battle-Lemarie [5, 6] scaling functions are constructed by orthonormalizing the
    $m$th order B-spline $N_m(t)$ for $m \geq 2$. As pointed out before, the set of
    basis functions $[N_m(t-k): k \in \mathbb{Z}]$ is not orthogonal for $m \geq 2$.
    The corresponding orthonormal scaling function $N_m(t)$ can be obtained


    ```

    $$\tilde{N}_m(\omega) = \frac{\hat{N}_m(\omega)}{\left[E_m(e^{-j\omega})\right]^{1/2}}
    \quad (6.53)$

    ```


    The Battle-Lemarie (B-L) scaling function $\Phi_{BL,m}(t)$ is, then,


    ```

    $$\Phi_{BL,m}(t) = \tilde{N}_m(t)$,

    ```


    and the coefficients $[g_0[k]]$ can be found from


    ```

    $$\frac{1}{2}\sum_{k} g_0[k]z^k = G_0(e^{-j\omega/2}) = \frac{\hat{N}_m(\omega)}{\hat{N}_m(\omega/2)},
    \quad (6.54)$

    ```'
