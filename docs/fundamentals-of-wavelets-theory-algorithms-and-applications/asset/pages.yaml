    # 3.5.3 The Gaussian Function


    The Gaussian function is one of the most important functions in probability theory
    and the analysis of random signals. It plays the central role in the Gabor transform
    to be developed later. The Gaussian function with unit amplitude is expressed
    as


    ```

    $g(t) = e^{-\alpha t^2}. \quad (3.51)$

