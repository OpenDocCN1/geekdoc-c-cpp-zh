    # 3.4.3 Frequency Shifting and Frequency Scaling


    The results for frequency shifting and scaling follow in a similar way. If $\hat{f}_0(\omega):=\\hat{f}(\omega-\omega_0)$,
    then


    ```

    $f_0(t)=f(t)e^{j\omega t}, \quad (3.31)$

    ```


    and if $\hat{f}_a(\omega):=\\hat{f}(a\omega)$ for a nonzero value of $a$, then


    ```

    $f_a(t)=\frac{1}{|a|}f\left(\frac{t}{a}\right). \quad (3.32)$

    ```


    # 3.4.4 Moments


    The $n$thorder moment of a function is defined as


    ```

    $M_n:=\int_{-\infty}^{\infty}t^nf(t)dt. \quad (3.33)$

    ```


    The first-order moment,


    ```

    $M_1=\int_{-\infty}^{\infty}tf(t)dt=(-j)^{-1}\frac{d}{d\omega}\int_{-\infty}^{\infty}f(t)e^{-j\omega
    t}dt\bigg|_{\omega=0}\n=(-j)^{-1}\frac{df(\omega)}{d\omega}\bigg|_{\omega=0}.
    \quad (3.34)$

    ```


    The extension of this formula to the $n$th-order moment results in


    ```

    $M_n=(-j)^{-n}\frac{d^n}{d\omega^n}\hat{f}(\omega)\bigg|_{\omega=0}. \quad (3.35)$

    ```'
