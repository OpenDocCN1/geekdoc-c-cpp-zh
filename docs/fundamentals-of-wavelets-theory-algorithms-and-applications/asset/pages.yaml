  md: '# 12 MATHEMATICAL PRELIMINARY


    amplitudes of the harmonic frequency of the signal. If for some particular signal-processing
    objective, we decide to minimize (or make zero) certain harmonic frequencies (such
    as 60-Hz noise), we simply design a filter at that to reject the noise. It is
    therefore meaningful to decompose a signal into components for observation before
    processing the signal.


    Orthogonal decomposition of a signal is straightforward and the computation of
    the coefficients is simple and efficient. If a function $f(t) \in L^2$ is expanded
    in terms of a certain orthonormal set $\{\phi_k(t)\}_{k\in\mathbb{Z}}$, we may
    write


    ```

    $f(t) = \sum_{k=-\infty}^{\infty} c_k \phi_k(t). \quad (2.16)$

    ```


    We compute the coefficients by taking the inner product of the function with the
    basis to yield


    ```

    $$\langle f, \phi_k \rangle = \int_{-\infty}^{\infty} f(t) \overline{\phi_k(t)}
    dt\n= \int_{-\infty}^{\infty} \sum_{\ell=-\infty}^{\infty} c_{\ell} \phi_{\ell}(t)
    \overline{\phi_k(t)} dt\n= \sum_{\ell=-\infty}^{\infty} c_{\ell} \delta_{\ell,k}\n=
    c_k. \quad (2.17)$

    ```


    Computation of an inner product such as the one in (2.17) requires the knowledge
    of the function $f(t)$ for all $t$ and is not real-time computable.

    We have seen that an orthonormal basis is an efficient and straightforward way
    to represent a signal. In some applications, however, the orthonormal basis function
    may lack certain desirable signal-processing properties, causing inconvenience
    in processing. Biorthogonal representation is a possible alternative to overcoming
    the constraint in orthogonality and producing a good approximation to a given
    function. Let $\{\phi_k(t)\}_{k\in\mathbb{Z}} \in L^2$ be a biorthogonal basis
    function set. If there exists another basis function set $\{\tilde{\phi}_k(t)\}_{k\in\mathbb{Z}}
    \in L^2$ such that


    ```

    $$\langle \tilde{\phi}_k(t), \phi_l(t) \rangle = \int_{-\infty}^{\infty} \tilde{\phi}_k(t)
    \overline{\phi_l(t)} dt = \delta_{k,l}, \quad (2.18)$

    ```


    the set $\{\tilde{\phi}_k(t)\}_{k\in\mathbb{Z}}$ is called the dual basis of $\{\phi_k(t)\}_{k\in\mathbb{Z}}$.
    We may expand a function $g(t)$ in terms of the biorthogonal basis


    ```

    $g(t) = \sum_{k=-\infty}^{\infty} d_k \phi_k(t),$

    ```


    and obtain the coefficients by'
