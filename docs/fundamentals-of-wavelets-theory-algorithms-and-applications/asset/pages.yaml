  md: '# BASIS FUNCTIONS, ORTHOGONALITY, AND BIORTHOGONALITY


    We extend the concept of Euclidean geometric vector space to normed linear spaces.
    That is, instead of thinking about a collection of geometric vectors, we think
    about a collection of functions. Instead of basis vectors, we have basis functions
    to represent arbitrary functions in that space. These basis functions are basic
    building blocks for functions in that space. We will use the Fourier series as
    an example. The topic of Fourier series will be considered in more detail in the
    next chapter.


    # 2.3.1 Example


    Let us recall that a periodic function $p_T(t)$ can be expanded into a series


    ```

    $p_T(t) = \sum_{k=-\infty}^{\infty} c_k e^{ik\omega_0 t} \quad (2.13)$

    ```


    where $T$ is the periodicity of the function, $\omega_0 = 2\pi/T=2\pi f$ is the
    fundamental frequency, and $e^{ik\omega_0 t}$ is the $k$th harmonic of the fundamental
    frequency. Equation (2.13) is identical to equation (2.12) if we make the equivalence
    between $p_T(t)$ with $V$, $c_k$ with $v_k$, and $e^{ik\omega_0 t}$ with $a_k$.
    Therefore, the function set $\{e^{ik\omega_0 t}\}_{k\in\mathbb{Z}}$ forms the
    basis set for the Fourier space of discrete frequency. The coefficient set $\{c_k\}_{k\in\mathbb{Z}}$
    is often referred to as the discrete spectrum. It is well known that the discrete
    Fourier basis is an orthogonal basis. Using the inner product notation for functions


    ```

    $$\langle g, h\rangle = \int_{\Omega} g(t)\overline{h(t)}dt \quad (2.14)$

    ```


    where the overbar indicates complex conjugation, we express the orthogonality
    by


    ```

    $$\int_{-T/2}^{T/2} e^{ik\omega_0 t}e^{-il\omega_0 t}dt = \delta_{k,l} \forall
    k, \l\in\mathbb{Z} \quad (2.15)$

    ```


    We normalize the basis functions (with respect to unit energy) by dividing them
    with $\sqrt{T}$. Hence $\{e^{ik\omega_0 t}\}_{k\in\mathbb{Z}}$ forms the orthonormal
    basis of the discrete Fourier space.


    # 2.3.2 Orthogonality and Biorthogonality


    Orthogonal expansion of a function is an important tool for signal analysis. The
    coefficients of represent represent the magnitudes of the signal components. In
    the previous example, the Fourier coefficients represent the'
  merge: -1
