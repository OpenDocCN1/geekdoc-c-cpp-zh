    in $S(z)$ are zero except $s(0)=1$. $S(z)$ is a half-band filter satisfying the
    following conditions:


    +   1. $s(n)=0$ for all even $n$ except $n=0$.

    2. $s(0)$ = constant.

    3. $s(n)=s(-n)$.

    4. $S(e^{j\omega}) + S(-e^{j\omega})$ = constant.


