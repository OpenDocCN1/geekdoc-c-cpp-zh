  md: '# DIFFERENTIAL EQUATIONS 343


    Using this equation, it is possible to zero the field points that are tangential
    to PECs by multiplying with a matrix $I_p$, which is the identity matrix with
    zeros in the rows corresponding to PEC locations. As (10.78) is an update equation
    and the initial values of all fields are 0, multiplying the electric field vectors
    in (10.78) with $I_p$ is redundant.


    The new update equation with PEC locations zeroed is


    ```

    $R_n E_{i,j}^x = R_{n-1} E_{i,j}^x + \frac{\Delta t}{\Delta y} (I_p U_{Ex1} R_{n-1}
    H_{i,j}^x + I_p U_{Ex2} R_{n-1} H_{i,j}^x), \quad (10.79)$

    ```


    By multiplying (10.79) with $R^{-1}$ and defining $U = R^{-1}I_p U^R$ the PEC
    MRTD update equation becomes


    ```

    $n E_{i,j}^x = n-1 E_{i,j}^x + \frac{\Delta t}{\Delta y} (U_{Ex1} n-1 H_{i,j}^x
    + U_{Ex2} n-1 H_{i,j}^x), \quad \quad (10.80)$

    ```


    This equation is the same as (10.72) except for the use of the $U_p$ matrices.
    Thus, it is possible to implement subcell PEC modeling in MRTD by changing the
    inner product matrices. This method does not increase computational overhead;
    it only requires the additional memory to store the U matrices.


    # 10.85 Examples


    **10.8.5.1 CPW-Microstrip Transition.** The coplanar waveguide (CPW)-microstrip
    transition is shown in Figure 10.16. The loss of this transition can be optimized
    over a wide frequency range with the use of FDTD and design curves for various
    packaging specifications can be derived. The plot in Figure 10.17 shows $S_{21}$
    of this transition for a variety of lengths of the central straight from 10 to
    20 GHz. These data were obtained using time-domain voltage probes at the input
    $(V_1)$ and $(V_2)$ of the transition, converting them to frequency domain through
    the use of a discrete Fourier transform and


