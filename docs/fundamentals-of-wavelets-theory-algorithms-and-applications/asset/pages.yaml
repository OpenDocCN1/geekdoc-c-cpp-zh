    This condition is shown to be true as


    ```

    $2^{n-1-1} a_{k,n-1} = \sum_{k=0}^{2^{n-1}-1} [a_{2k,n} + w_{k,n-1}/2] = \sum_{k=0}^{2^{n-1}-1}
    (a_{2k,n} + a_{2k+1,n})/2 = 2^{n-1} \sum_{k=0}^{2^{n-1}-1} a_{k,n}.$ (8.63)

    ```


    The reconstruction phase of the DWT is carried out by simply running the decomposition
    algorithm *backward*! That is, we apply (8.61) in the reverse direction:


    ```

    $a_{2k,\ell+1} = a_{k,\ell} - w_{k,\ell}/2,$ (8.64)

    $a_{2k+1,\ell+1} = w_{k,\ell} + a_{2k,\ell}.$ (8.65)

    ```


    The coefficients are merged (zipped) together to form the next higher resolution
    signal.


    ```

    $a_{2k,\ell+1} \merge{\} \rightarrow a_{k,\ell+1}\na_{2k+1,\ell+1}$

    ```


    This process is repeated for every level of resolution until the wavelet coefficients
    at each level have been used in the reconstruction process and the final sequence
    of samples will be the original signal $x(k)$. The general lifting stages for
    decomposition and reconstruction of a signal are given in Figure 8.28.


