  md: '# CHAPTER TWO


    # Mathematical Preliminary


    The purpose of this chapter is to familiarize the reader with some of the mathematical
    notations and tools that are useful in an understanding of wavelet theory. Since
    wavelets are continuous functions that satisfy certain admissibility conditions,
    it is prudent to discuss in this chapter some definitions and properties of functional
    spaces. For a more detailed discussion of functional spaces, the reader is referred
    to standard texts on real analysis. The wavelet algorithms discussed in later
    chapters involve digital processing of coefficient sequences. A fundamental understanding
    of topics in digital signal processing, such as sampling, the $z$-transform, linear
    shift-invariant systems, and discrete convolution, are necessary for a good grasp
    of wavelet theory. In addition, a brief discussion of linear algebra and matrix
    manipulations is included that is very useful in discrete-time domain analysis
    of filter banks. Readers already familiar with its contents may skip this chapter.


    # 2.1 LINEAR SPACE


    In the broadest sense, a functional space is simply a collection of functions
    that satisfies a certain mathematical structural pattern. For example, the finite
    energy space $L^2(-\infty, \infty)$ is a collection of functions that are square
    integrable; that is,


    ```

    $$\int_{-\infty}^{\infty} |f(x)|^2 dx < \infty.$

    ```


    Some of the requirements and operational rules on linear spaces are stated as
    follows:


    *Fundamentals of Wavelets: Theory, Algorithms, and Applications, Second Edition,*
    By Jaideva C. Goswami and Andrew K. Chan

    Copyright © 2011 John Wiley & Sons, Inc.'
