  md: '# NOW UPDATED—THE AUTHORITATIVE TREATMENT OF WAVELETS FROM AN ENGINEERING POINT
    OF VIEW


    Wavelet theory originated from research activities in many areas of science and
    engineering. As a result, it finds applications in a wide range of practical problems.
    Wavelet techniques are specifically suited for nonstationary signals where classic
    Fourier methods are ineffective. Developments over the last decade have led to
    many new wavelet applications such as image compression, turbulence, human vision,
    radar, and earthquake prediction.


    Based on courses taught by the authors at Texas A&M University as well as related
    conferences, Fundamentals of Wavelets is a textbook offering an up-to-date engineering
    approach to wavelet theory. It balances a discussion of wavelet theory and algorithms
    with its far-ranging practical applications in signal processing, image processing,
    geophysical applications, electromagnetic wave scattering, and boundary value
    problems.


    In a clear, progressive format, the book describes:


    +   * Basic concepts of linear algebra, Fourier analysis, and discrete signal
    analysis

    * Theoretical aspects of time-frequency analysis and multiresolution analysis

    * Construction and properties of various real and complex wavelets and curvelets

    * Algorithms for computing wavelet transformations

    * Applications to signal processing, geophysical applications, and boundary value
    problems


    This Second Edition features new sections on curvelets, ridgelets, and lifting
    transformations; complex wavelets; edge detection and geophysical applications;
    multiresolution time domain method. It covers time-frequency analysis techniques
    as short-time Fourier transform and Wigner-Ville distribution. Concluding chapters
    present interesting applications of wavelets to signal processing and boundary
    value problems. Numerous examples and figures are also included with simple MATLAB
    programs.


    Fundamentals of Wavelets is an essential introduction to wavelet theory for students
    and professionals alike in a practical, real-world engineering context. It is
    ideally suited for senior and graduate students in electrical engineering, physics,
    mathematics, research engineers and physicists, and design and software engineers
    in the telecommunications and signal processing industries.


    JAIDEA C. GOSWAMI, PhD, is an Engineer at Schlumberger in Sugarland, Texas. He
    is a former professor of Electronics and Communication Engineering at the Indian
    Institute of Technology, Kharagpur. Dr. Goswami has taught several courses on
    wavelets and contributed to the Wiley Encyclopedia of Electrical and Electronics
    Engineering as well as Microwave Engineering. He has many research papers and
    patents to his credit, and is a fellow of IEEE.


    ANDREW K. CHAN, PhD, is on the faculty of Texas A&M University and is the coauthor
    of Wavelets in a Box and Wavelet Toolbox. He is a Life Fellow of IEEE.


    Cover Design: Michael Rulkowski


