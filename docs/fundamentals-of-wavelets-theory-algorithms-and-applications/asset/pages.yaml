    # 7.9 POLYPHASE REPRESENTATION FOR FILTER BANKS


    Polyphase representation of a signal is an alternative approach to discrete signal
    representation other than in the spectral domain and the time domain. It is an
    efficient representation for computation. Consider the process of convolution
    and decimation by 2, we compute all the resulting coefficients and then cast out
    half of them. The polyphase approach decimates the input signal and then convolves
    with only half of the filter coefficients. This approach increases the computational
    efficiency by reducing the redundancy.


    # 7.9.1 Signal Representation in Polyphase Domain


    Let the z-transform of a discrete causal signal separated into segments of $M$
    points, be written as


    ```

    $X(z)=x(0)+x(1)z^{-1}+x(2)z^{-2}+x(3)z^{-3\|+\dots+x(M-1)z^{-M+1}$

    $+x(M)z^{-M}+x(M+1)z^{-(M+1)}+x(M+2)z^{-(M+2)}+\dots$

    $+x(2M)z^{-2M}+x(2M+1)z^{-(2M+1)}+x(2M+2)z^{-(2M+2)}+\dots$

    (7.129)

    ```


    ```

    $\sum_{l=0}^{M-1}z^{-l}X_l(z^M),$

    (7.130)

    ```


    where $X_l(z^M)$ is the z-transform of $x(n)$ decimated by $M (\downarrow M)$.
    The index $\ell$ indicates the number of sample shifts. For the case of $M=2$,
    we have


    ```

    $X(z)=X_0(z^2)+z^{-1}X_1(z^2).$

    (7.131)

    ```


    # 7.9.2 Filter Bank in the Polyphase Domain


    For a filter $H(z)$ in a two-channel system, the polyphase representation is exactly
    the same as in (7.131)


    ```

    $H(z)=H_e(z^2)+z^{-1}H_o(z^2)$

    (7.132)

    ```


    where $H_e(z^2)$ consists of the even samples of $h(n)$ and $H_o(z^2)$ has the
    odd samples. The odd and even parts of the filter are used to process the odd
    and even coefficients of the signal. To formulate the two-channel filter bank
    in the polyphase domain, we need the help of two identities:


    +   1. $(\downarrow M)G(z)=G(z^M)(\downarrow M)$

    2. $(\uparrow M)G(z)=G(z)(\uparrow M)$.

    (7.133)'
