    cluster must be tested for false alarm discrimination. Each cluster must have
    at least three microcalcifications whose individual size does not exceed $5 \times
    5$ pixels. If an initial cluster does not meet this criterion, it is declared
    a false positive (FP) and removed from the list of suspicious regions.


