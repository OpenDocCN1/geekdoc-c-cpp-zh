  md: '# 9.4 INTERFERENCE SUPPRESSION


    The Wigner-Ville distribution and other nonlinear time-frequency distributions
    are often used in radar signal processing. Although they are linear transformations,
    they have an advantage that a linear chirp signal appears as a straight line on
    the time-frequency plane (see Chapter 4). However, the non-linear distribution
    of a multicomponent signal produces interference that may have a high amplitude
    to cover the signal. This example combines the Wigner-Ville distribution decomposition
    and the wavelet packets to suppress the interference [4]. We take the signal with
    interference and decompose it into frequency bands by a best selection [2]. We
    then apply the WWD decomposition to each of the wavelet packets. The cross terms
    are deleted in the distribution before reconstruction. This approach keeps the
    high resolution of WWD yet reduces the cross-term interference to a minimum.


    From the viewpoint of time-frequency analysis, an orthonormal (o.n.) $\psi_{j,k},
    k \in \mathbb{Z}$, of $L^2(\mathbb{R})$ in such a way that for each $j \in \mathbb{Z}$,
    the subfamily $\{\psi_{j,k}; k \in \mathbb{Z}\}$ is not only an o.n. basis of
    $W_j$ but also a time-frequency window for extracting local information within
    the st octave band $H_j := (2^{j+1}\Delta_j^+, 2^{j+2}\Delta_j^+)$, where $\Delta_j^+$
    is the RMS bandwidth of the $\psi$ wavelet. Unlike wavelets for the width of the
    frequency band $H_j$ increases with the frequency ranges, wavelet packets are
    capable of partitioning the higher-frequency octaves to yield better frequency
    resolution. Here, $\Delta_j^+$ as discussed in Chapter 4, is the standard deviation
    of $\psi$ relative to the positive frequency range $(0, \infty)$. Let $\{\mu_n\}$
    be a family of wavelet packets cor-responding to some scaling function $\mu_0
    = \phi$, as defined in Section 8.1. Then the family of subspaces $U_j^0=\{\mu_n(\cdot
    k); k \in \mathbb{Z}\}, n \in \mathbb{Z}^+\}$, is generated by $\{\mu_n\}$ and
    $W_j$ can be expressed as


    ```

    $W_j=U_j^0\oplus U_j^2\oplus \dots\oplus U_j^{2^{j-1}} \quad \quadquad (9.8)$

    ```


    In addition, for each $m=0, \dots, 2^j-1$, and $j=1, 2 \\dots$, the family


    ```

    $H_j^m; m=0, \dots, 2^j-1. \quad \quad\quad\quadquad (9.10)$

    ```


    Of course, the o.n. basis in (3) of $U_{2^j+m}$ provides time-localization within
    the subband $H_j^m$. Any function $s(x) \in L^2(\mathbb{R})$ has a representation


    ```

    $s(t)=\sum_{j=1}^{\infty} \sum_{m=0}^{2^j-1} d_{j,m}^j \mu_{2^j+m}(t-n)=\sum s_{j,m}(t),
    \quad \quad (9.11)$

    ```'
