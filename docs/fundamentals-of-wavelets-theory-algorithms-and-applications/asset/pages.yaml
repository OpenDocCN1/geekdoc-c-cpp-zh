    # 3.9 FURIER ANALYSIS OF DISCRETE-TIME SIGNALS


    Since the computation of the Fourier series coefficients and Fourier transform
    requires integration, the function must be analytically describable by elementary
    functions such as sine and cosine functions, exponential functions and terms from
    a power series. In general, most signals we encounter in real life are not representable
    by elementary functions. We must use numerical algorithms to compute the spectrum.
    If the signals are sampled, the discrete Fourier series and discrete-time Fourier
    transform are directly computable. They produce an approximate spectrum of the
    original analog signal.


