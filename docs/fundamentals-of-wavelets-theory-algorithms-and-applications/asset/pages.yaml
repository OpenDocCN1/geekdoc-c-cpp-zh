  md: '# CHAPTER ONE


    # What Is This Book All About?


    The concept of wavelet analysis has been in place in one form or the other since
    the beginning of this century. The Littlewood-Paley technique and Calderón-Zygmund
    theory in harmonic analysis and digital filter bank theory in signal processing
    can be considered precursors to wavelet analysis. However, in its present form,
    wavelet theory drew attention in the 1980s with the work of several researchers
    from various disciplines—Strömberg, Morlet, Grossmann, Battle, Lemarié, Coifman,
    Mallat, and Choi, to name a few. Many other researchers have also made significant
    contributions.


    In applications to discrete data sets, wavelets may be considered basis functions
    generated by dilations and translations of a single function. Analogous to Fourier
    analysis, there are wavelet series (WS) and integral wavelet transforms (IWT).
    In wavelet analysis, WS and IWT are intimately related. The IWT of a finite-energy
    function on the real line evaluated at certain points in the time-scale domain
    gives the coefficients for its wavelet series representation. No such relation
    exists between the Fourier series and Fourier transform; the former is applied
    to finite periodic functions, whereas the latter is applied to functions that
    have finite energy over the real line. Furthermore, Fourier analysis is global
    in the sense that each frequency (time) component of the function is influenced
    by all the time (frequency) components of the function. On the other hand, wavelet
    analysis is a local analysis. This local nature of wavelet analysis makes it suitable
    for time-frequency analysis of signals.


    Wavelet techniques enable us to divide a complicated function into several simpler
    ones and study them separately. This property, along fast wavelet algorithms are
    comparable in efficiency to fast Fourier transform


    Fundamentals of Wavelets: Theory, Algorithms, and Applications, Second Edition,

    By Jaideva C. Goswami and Andrew K. Chan

    Copyright © 2011 John Wiley & Sons, Inc.'
