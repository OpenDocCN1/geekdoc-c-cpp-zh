  md: '# WHAT IS THIS BOOK ABOUT?


    algorithms, makes these techniques we very attractive for analysis and synthesis.
    Different types of wavelets have been used as tools to solve problems in signal
    analysis, image analysis, medical diagnostics, boundary-value problems, geophysical
    signal processing, statistical analysis, pattern recognition, and many others.
    While wavelets have gained popularity in these areas, new applications are continually
    being investigated.


    A reason for the popularity of wavelets is their effectiveness in representation
    of nonstationary (transient) signals. Since most of the natural and manmade signals
    are transient in nature, different wavelets have been used to represent a much
    larger class of signals than the Fourier representation of stationary signals.
    Unlike Fourier-based analyses that use global (nonlocal) sine and cosine functions
    as bases, wavelet analysis uses bases that are localized in time and frequency
    to more effectively represent nonstationary signals. As a result, a wavelet representation
    is more compact and easier for implementation. Using the powerful multiresolution
    analysis, one can represent a signal by a finite sum of components at different
    resolutions that each component can be adaptively processed based on the objectives
    of the application. This capability of representing signals compactly and in several
    levels of resolutions is the major strength of the wavelet analysis. In the case
    of solving partial differential equations by numerical methods, the unknown solution
    can be represented by wavelets of different resulting in a multigrid representation.
    The dense matrix resulting from an integral operator can be sparsified using wavelet-based
    thresholding techniques to attain an arbitrary degree of solution accuracy.


    There have been many research monographs on wavelet analysis as well as textbooks
    for certain specific areas. However, there does not seem to be a textbook that
    provides a systematic introduction to the subject of wavelets and its wide areas
    of applications. This is the motivating factor for this introductory text. Our
    aims are (1) to present this mathematically elegant analysis in a formal yet readable
    fashion, (2) to introduce to readers possible areas of applications in both signal
    processing and in boundary value problems, and (3) to provide several algorithms
    and computer codes for basic hands-on practices. The level of writing will be
    suitable for college seniors and first-year graduate students. However, specific
    details will be given so that practicing engineers without background in signal
    analysis will find it useful.


    The book is organized in logical. The contents are divided into four major parts.
    Rather than vigorously proving theorems and developing algorithms, the subject
    matter is developed systematically from the very basics in signal representation
    using basis functions. The wavelet analysis is explained via a parallel with the
    Fourier analysis and short-time Fourier transform. The multiresolution analysis
    is developed for demonstrating the decomposition and reconstruction algorithms.
    The filter-bank algorithm is incorporated so that readers may draw a parallel
    between the filter-bank algorithm and the wavelet algorithm. Specific applications
    in signal processing, image processing, electromagnetic wave scattering,'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# WHAT IS THIS ALL ABOUT? 3


    boundary-value problems, geophysical data analysis, wavelet imaging system and
    interference suppression are included in this book. A detailed chapter by chapter
    outline of the book follows.


    Chapters 2 and 3 are devoted to reviewing some of basic mathematical concepts
    and techniques and setting the tone for the time-frequency and time-scale analysis.
    To have a better understanding of wavelet theory, it is necessary to review the
    basics of linear functional analysis. Concepts in Euclidean vectors are extended
    to spaces in higher dimension. Vector projection, basis functions, local and Riesz
    bases, orthogonality, and biorthogonality are discussed in Chapter 2. In addition,
    least-square approximation of functions and mathematical tools like matrix algebra
    and z-transform are also discussed. Chapter 3 provides a brief review of Fourier
    analysis to set the foundation for the development of continuous wavelet transform
    and discrete wavelet series. The main objective of this chapter is not to redevelop
    the Fourier theory to remind readers of some of the important issues and relations
    in Fourier analysis that are relevant to later development. The main properties
    of Fourier series and Fourier transform are discussed. Known theorems, including
    Poisson''s sum formulas, partition of unity, sampling theorem, and Dirichlet kernel
    for partial are developed in this chapter. Discrete-time wavelet transform and
    discrete Fourier transform are also mentioned briefly for the purpose of comparing
    them with the continuous and discrete wavelet transforms. Some advantages and
    drawbacks of Fourier analysis in terms of signal representation are presented.


    Development of time-frequency and time-scale analysis forms the core of the second
    major section of this book. Chapter 4 is devoted to the discussion of short-time
    Fourier transform (time-frequency analysis) and the continuous wavelet transform
    (time-scale analysis). The similarities and the differences between these two
    transforms are pointed out. In addition, window widths as measures of localization
    of a time function and its spectrum are introduced. This chapter also contains
    the major properties of the transform such as perfect reconstruction and uniqueness
    of inverse. Discussions on the Gabor transform and the Wigner-Ville distribution
    complete this chapter on time-frequency analysis. Chapter 5 contains an introduction
    and discussion of multiresolution analysis. The relationships between the nested
    approximation spaces and the wavelet spaces are developed via the derivation of
    the rescale relations and the decomposition relations. Orthogonality and biorthogonality
    between basis functions and their integer translates are also discussed. This
    chapter also contains a discussion on the semiorogonal B-spline function as well
    as mapping techniques of function onto the multiresolution spaces. In Chapter
    6, methods'' and requirements for wavelet construction are developed in detail.
    Orthogonal, semiorogonal and biorthogonal wavelets are constructed via examples
    to elucidate the procedure. Biorthogonal wavelet subspaces and their orthogonal
    properties are also discussed in this chapter. A derivation of formulas used in
    methods to compute and display the wavelet is presented at the end of this chapter.'
  merge: -1
