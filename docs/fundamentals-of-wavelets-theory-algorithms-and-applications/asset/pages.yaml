    and two bases [17–18]. Essential, dual-tree complex wavelets employ two real DWTs
    to produce the real and imaginary parts of the transform. Figure 8.25 illustrates
    decomposition and reconstruction using dual-tree complex wavelets (compare with
    this Figure 7.19). Since there are two DWT-type processes, we have two pairs of
    low-pass $[g_0, h_0]$ filters along with their duals.


    It can be shown that a compactly supported wavelet (time-limited function) can
    only have an approximate Hilbert transform. Hence wavelets cannot entirely eliminate
    the shortcomings of real-valued wavelets mentioned previously; they can only reduce
