  md: '# DWT AND FILTER BANK ALGORITHMS


    point in time. The processing goal of the filter bank is to separate the high-frequency
    and low-frequency components of the signal so that they may be processed or refined
    by different DSP algorithms. Although the DWT algorithms inherently have the same
    function, purpose of DWT is on finding the similarity between the signal and the
    wavelet at a given scale.


    +   3. **Design origin.** A wavelet is designed primarily via the two scale relation
    to satisfy the MRA requirements. Once the two-scale sequences are found, the DWT
    processing sequences have been set. A wavelet can be constructed, and its time
    and scale widows can be computed. In general, a filter bank is designed in the
    spectral domain via spectral factorization to obtain the processing filters. These
    sequences may or may not serve as the two-scale sequences for the approximation
    function and the wavelet. The time-scale or time-frequency characteristics of
    these filters may not be measurable.


    +   4. **Application areas.** Most of signal- and image-processing applications
    can be carried out with DWT or with filter banks. In some application areas, such
    as non-Fourier magnetic resonance imaging where the processing pulse is required
    in the analog domain, wavelet is more suitable for the job because the data set
    is obtained directly via projection.


    +   5. **Flexibility.** Since filter banks may be designed in the spectral domain
