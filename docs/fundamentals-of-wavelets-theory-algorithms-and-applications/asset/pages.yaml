    2. If $x \in S$ and $y \in S$, then $x+y=y+x$.

    3. If $z \in S$, then $(x+y)+z=x+(y+z).

    4. There exists in $S$ a unique element $\mathbf{0}$, such that $x+\mathbf{0}=x$.

    5. There exists in $S$ another unique element $-x$ such that $x+(-x)=\mathbf{0}$.


    Besides these simple yet important rules, we also define *scalar multiplication*
    $y=cx$ such that if $x \in S$, then $y \in S$, for every *scalar* $c$. We have
    the following additional rules for the space $S$:


    +   1. $c(x+y)=cx+cy$.

    2. $(c+d)x=cx+dx$ with scalar $c$ and $d$.

    3. $(cd)x=c(dx)$.

    4. $1 \cdot x=x$.


    Spaces that satisfy these additional rules are called linear spaces. However,
    up to now, we have not defined a measure to gauge the size of an element in a
    linear space. If we assign a number $\|x\|$, the norm of $x$, to each function
    in $S$, this space becomes a *normed linear space* (i.e., a space with a measure
    associated with it). The norm of a space must also satisfy certain mathematical
    properties:


    +   1. $\|x\| \ge 0$ and $\|x\|=0 \Leftrightarrow x=0$.

    2. $\|x+y\| \le \|x\|+\|y\|$.\n3. $\|ax\| = |a|\|x\|$ where $a$ is scalar.


    The norm of a function is simply a measure of the distance of the function to
    the origin (i.e., 0). In other words, we can use the norm


    > $\|x-y\|$ (2.2)


    to measure the difference (distance) between two functions $x$ and $y$.

    There are a variety of norms one may choose as a measure for a particular linear
    space. For example, the finite energy space $L^2(-\infty, \infty)$ uses the norm


    > $\|x\| = \left[\int_{-\infty}^{\infty} |f(x)|^2 dx\right]^{1/2} < \infty$, (2.3)


    which we will call the $L^2$-norm. This norm has also been used to measure the
