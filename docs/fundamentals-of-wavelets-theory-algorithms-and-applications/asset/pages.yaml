    Figure 8.26 show complex wavelets designed using q-shift approach (N = 14).


    # 8.4.3 Common Factor Approach


    By choosing a common factor and introducing it into the low-pass filters


    ```

    $h_0(n) = F(n)* A(n)

    g_0(n) = F(n)* A(L-n)$

    ```


    the amplitude requirement of (8.56) is satisfied. The phase requirement can be
    approximately satisfied if the phase of $A(n)$ is chosen as a fractional delay
    allpass filter. Figure 8.27 show complex wavelets designed using common factor
    approach.'
