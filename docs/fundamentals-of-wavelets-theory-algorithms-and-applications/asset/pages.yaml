  md: '$h_0[k]$ and $h_1[k]$, as shown in Chapter 6, the lifting algorithm can be
    used to construct the wavelet coefficients resulting from the lifting process.


    The advantage of the lifting procedure is that the coefficients can be computed
    to minimize the storage requirement and the reconstruction phase can be carried
    out by running the decomposition process backward. The procedure eliminates the
    need for the Fourier transform as in the classical method for signal processing,
    and new wavelets are constructed out of the lifting process.


    In this section, we use the Haar wavelet to illustrate the decomposition of a
    signal. It proceeds in simple steps, with each step moving toward one-level lower
    in resolution. It computes the average and difference of adjacent signal values.
    $\{x(k)\}$ be a signal that has $2^n$ points. At some resolution $\ell+1$, one
    decomposition step computes the average and difference of the adjacent signal
    value.


    ```

    $a_{k,\ell} = \frac{a_{2k,\ell+1} + a_{2k+1,\ell+1}}{2},\nWnW_{k,\ell} = a_{2k+1,\ell+1}
    - a_{2k,\ell}$.

    ```


    If this step is repeated, it generates the approximation coefficient (the average)
    and wavelet coefficients (the difference) of the next lower resolution.


    It is easy to see that if we wish to reconstruct the signal from level $\ell$
    to $(\ell+1)$, we simply solve for the values of $a_{2k,\ell+1}$ and $a_{2k+1,\ell+1}$,
    using the above equations to obtain


    ```

    $a_{2k,\ell+1} = a_{k,\ell} + \frac{W_{k,\ell}}{2}, \quad (8.58)$

    ```


    ```

    $a_{2k,\ell+1} = a_{k,\ell} - \frac{W_{k,\ell}}{2}, \quad (8.59)$

    ```


    Rewriting (8.59),


    ```

    $a_{k,\ell} = a_{2k,\ell+1} + \frac{W_{k,\ell}}{2}, \quad (8.60)$

    ```


    we observe that the approximation coefficient of the lower resolution can be computed
    from the corresponding approximation coefficients of the higher resolution—namely
    the even coefficient plus half of the difference between its adjacent coefficients.
    Instead of computing the average and difference simultaneously (odd-even) first
    and then the average:'
