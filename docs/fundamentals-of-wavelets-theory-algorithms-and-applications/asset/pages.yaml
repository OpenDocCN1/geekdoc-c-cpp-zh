    # 4.10.1 A Real Quantity


    The Wigner-Ville distribution is always real, regardless of whether the signal
    is real or complex. This can be seen by considering the complex conjugate of the
    Wigner-Ville distribution:


    ```

    $W_s(t,\omega) = \frac{1}{2\pi} \int_{-\infty}^{\infty} s(t-\frac{\tau}{2})\overline{s(t+\frac{\tau}{2})}e^{j\omega\tau}d\tau$\n=
    \frac{1}{2\pi} \int_{-\infty}^{\infty} s(t+\frac{\tau}{2})\overline{s(t-\\frac{\tau}{2})}e^{-j\omega\tau}d\tau$\n=
    W_s(t,\omega). (4.71)

    ```


    The Wigner-Ville distribution is always real but not always positive. Figure 4.13
    shows the WVD of a function that becomes negative near the center. Consequently,
    WVD may not be used as a measure of energy density or probability density.


