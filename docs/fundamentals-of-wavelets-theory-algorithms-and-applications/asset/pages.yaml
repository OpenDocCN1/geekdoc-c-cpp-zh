  md: '# MICROCALCIFICATION CLUSTER DETECTION 277


    For the SOT [15–17], only two symbols zero and one are used, and each symbol has
    a different meaning at a different part of the tree. The symbol one may represent
    (1) a significant DWC, (2) the negative sign of a significant DWC, (3) the case
    that any of the four children is significant, or (4) the case that any of the
    grandchildren is significant. The symbol zero could indicate (1) an insignificant
    DWC, (2) the positive sign of a significant DWC, (3) the case that all four children
    are insignificant, or (4) the case that all grandchildren are insignificant. To
    maintain the SOT for the DWCs along with the different scales, three lists are
    used as follows:


    +   1. List of insignificant sets (LIS) is a list of the roots of a tree for further
    tracing, and type A and B of the roots of the tree are interchangeable to obtain
    better adaptability.


    +   2. List of insignificant pixels (LIP) is a list of the DWCs that are not roots
    of the tree currently are the candidates to be placed into the LSP.


    +   3. List of significant pixels (LSP) is a list of the DWCs that have been encoded
    and are to be further refined.


    # 9.8.6 Generalized Self-Similarity Tree (GST)


    Based on the SOT, a generalized self-similarity tree (GST) coding algorithm has
    been constructed that can handle images of any size and any gray level [18]. In
    the GST, the wavelet decomposition/reconstruction algorithm with boundary reflection
    techniques is used so that perfect reconstruction can be achieved. Analysis of
    the GST coder shows results comparable to the original SOT coder for images of
    dyadic size, and even outperforms the SOT for images of nondyadic size.


    # 9.9 MICROCALCIFICATION CLUSTER DETECTION


    The majority of early breast cancers are indicated by the presence of one or more
    clusters of microcalcifications. Although breast cancer can be fatal, women have
    one of the highest chances of survival among cancer types if the tumors can be
    detected and removed in an early stage. Thus the detection of microcalcifications
    with minimal false positive rates is critical to screening mammograms. Microcalcifications
    are small deposits of calcium hydroxide in breast tissue with sizes ranging from
    .05 to 1.0 mm in diameter that appear as bright spots on photogenic x-ray film
    [19]. They are difficult to detect because they vary in size and shape and are
    embedded in parenchymal tissue structures of varying density [20].


    Screening mammograms have been one of the main trusts in the healthcare program
    of the United States. However, even partial compliance with the the rule set by
    the ACR would produce a huge volume of data to be read by a'
