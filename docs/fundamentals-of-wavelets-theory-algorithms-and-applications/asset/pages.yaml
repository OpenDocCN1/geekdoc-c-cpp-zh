    The algorithm development for wavelet analysis is contained in Chapters 7 and
    8. Chapter 7 provides the construction and implementation of the decomposition
    and reconstruction algorithms. The basic building blocks for these algorithms
    are discussed in the beginning of the chapter. Formulas for decimation, interpolation,
    discrete convolution and their interconnections are derived. Although these algorithms
    are general for various types of wavelets, special attention is given to the compactly
    supported semiorogonal B-spline wavelets. Mapping formulas between the spline
    spaces and the dual space are derived. The algorithms of perfect reconstruction
    filters in digital signal processing are developed via z-transform in this chapter.
    The time-domain and polyphasedomain equivalent of the algorithms are discussed.
    Examples of biorthogonal wavelet construction are given at the end of the chapter.
    In Chapter 8, limitations of the discrete wavelet algorithms, including time-variant
    property of DWT and sparsity of the data distribution are pointed out. To circumvent
    the difficulties, the fast integral wavelet transform (FIWT) is developed for
    the semiorogonal spline wavelet. Starting with an increase in time resolution
    and ending with an increase in scale resolution, a step-by-step development of
    the algorithm is presented in this chapter. A number of applications using FIWT
    are included to illustrate its importance. Special types of wavelets, such as
    ridgelet, curvelets, complex wavelets, and lifting algorithms, are briefly described.


    The final section of this book is on application of wavelets to engineering problems.
    Chapter 9 includes the applications to signal and image processing, and in Chapter
    10, we discuss the use of wavelets in solving boundary value problem. In Chapter
    9, the concept of wavelet packet is discussed as first as an extension of the
    wavelet to improve the spectral domain performance of the wavelet. Wavelet packet
    representation of the signal is seen as a refinement of the wavelet by further
    subdividing the wavelet spectrum into subspectra. This is seen to be useful in
    the subsequent discussion on radar interference suppression. Three types of amplitude
    thresholding are discussed in this chapter and are used in subsequent applications
    to show image compression. Signature recognition on faulty bearing completes the
    one-dimensional wavelet signal processing. The wavelet algorithms in Chapter 7
    are extended to two-dimensions for the processing of images. Several edge detection
    algorithms are described. Major wavelet image-processing applications included
    in this chapter are image compression and detection and recognition. Details of
    the tree-type image coding are not included because of limited space. However,
    the detection, recognition, and clustering of microcalcifications in mammogram
    are given in moderate detail. The application of wavelet packets to mult communication
    systems and the application of wavelet analysis to three-dimensional medical image
    visualization are included. Applications of wavelets in geophysical problems are
    presented.


    Chapter 10 covers wavelets in boundary value problem. The traditional method of
    moment (MOM) and the wavelet-based method of moment are developed in parallel.
    Different techniques of using wavelet in MoM are'
