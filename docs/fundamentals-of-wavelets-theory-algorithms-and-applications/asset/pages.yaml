    inherent capability of global electromagnetic field calculation as well as MRTD
    multi-PEC cell allows for the identification of “hot spots” of high field concentration
    and for the derivation of physics-driven solutions for the improvement of the
    overall system-on-package efficiency. The time- and space-adaptive grid of MRTD
    allows it to be model finely detailed structures. Areas of the grid containing
    small features can use increased resolution, while homogeneous areas can use low
    resolution. It is important to note that this technique can be used to model structures
