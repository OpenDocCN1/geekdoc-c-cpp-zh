    Observe from (7.89) if we allow only causal FIR filters for the analysis filter
    bank, the composite filter $C_0$ is also causal FIR with only odd-indexed coefficient.
    To overcome this restriction, we can design anticausal or nonusal filters and
    then add a delay to make them causal. We first simplify the analysis by adding
    an advance to the composite filter and by making the properties of a half-band
    filter, to be defined below. The composite filter $C_0$ is advanced by $m$ taps
    so that


    $S(z) = z^mC_0(z) \quad (7.97)$


    where $S(z)$ is a noncausal filter symmetric with respect to the origin. The PR
    condition becomes


    $S(z)+S(-z) = 2 \quad (7.98)$


