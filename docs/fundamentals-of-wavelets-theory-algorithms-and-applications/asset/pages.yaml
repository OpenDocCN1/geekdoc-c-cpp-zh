    the original signal to be recovered from its components: the subband filter banks.
    The major applications of subband filtering is in signal compression in which
    the subband components are coded for archiving or transmission purpose. The original
    signal can be recovered from the coded components with various degrees of fidelity.


    We use a basic two-channel PR filter bank to illustrate the main features of this
    algorithm. Filter bank tree structures can be constructed using this basic two-channel
    filter bank. A two-channel filter bank consists of an analysis section and a synthesis
    section, each consists of two filters. The analysis section includes high-pass
    and low-pass filters that are complementary to each other so that information
    in the input signal is processed by either one of the two filters. The block diagram
    for a two-channel PR filter bank-the block diagram for a two-channel PR filter
    bank is shown in Figure 7.19.'
