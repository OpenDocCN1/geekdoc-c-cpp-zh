    # 9.2 WAVELET-PACKET ALGORITHMS


    The decomposition tree for wavelet packets uses the same decomposition block of
    two parallel filtering channels followed by decimation by two ($\downarrow2$),
    as in the wavelet algorithm. Any coefficient set in the tree may be processed
    by the same building block. In the wavelet decomposition tree, only the approximation
    coefficient sets [a] in Figure 7.9 are processed for different resolutions, while
    the wavelet coefficient sets [w] are outputs of the algorithm. In wavelet packet
    decomposition, the wavelet coefficient sets [w] are also processed by the same
    building block to produce wavelet packet coefficient sets [z]. We see from Figure
    9.6 that for each set of N coefficients, we obtain two coefficient sets of $N/2$
    length after processing by the decomposition block. The number of coefficient
    sets is $2^m$ if the original coefficient set is processed for $m$ resolutions.
    Figure 9.6 demonstrates the wavelet packet tree for $m=3$.


    It is important to keep track of the indices of the wavelet packet coefficients
    in the decomposition algorithm. To achieve perfect reconstruction, if a coefficient
    has been processed by $h_0[n]$ and ($\downarrow2$), the result should be processed
    by $g_0[n]$ and ($\uparrow2$). The same order is applicable to $h_1[n]$ and $g_1[n]$.
    For example, if we process a set of data first by $h_0[n]$ and ($\downarrow2$)
    followed by $h_1[n]$ and ($\downarrow2$), the resulting signal must be processed
    by ($\uparrow2$) and $g_1[n]$ and then followed by ($\uparrow2$) and $g_0[n]$
    to achieve perfect reconstruction. Thus signal processing using wavelet packets
    requires accurate bookkeeping of different orders of digital filtering and sampling
    rate changes.'
