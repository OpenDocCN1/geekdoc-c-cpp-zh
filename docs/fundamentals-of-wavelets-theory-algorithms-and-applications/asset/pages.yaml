    **Remarks:** One of the most important features of the orthonormal bases is that
    all of the decomposition and reconstruction filters FIR and have the same length.
    This helps tremendously in the decomposition and reconstruction algorithm described
    in Chapter 7. One of the disadvantages of orthonormal wavelets is that they generally
    do not have closed form expressions, nor does a compactly supported orthonormal
    wavelet have linear phase (no symmetry). The importance of linear phase in signal
    reconstruction will be discussed in Chapter 7. It has also been shown [2] that
    the higher-order orthonormal scaling functions and wavelets have poor localization.


    # 6.4 ORTHONORMAL SCALING FUNCTIONS


