    # 6.4.2 Meyer Scaling Function


    The Shannon scaling function $\phi_{SH}(t)$ has poor time localization $(\Delta_{\phi_{SH}}=\infty$).
    The reason for this is that in the frequency domain, $\hat{\phi}_{SH}(\omega)$
    has a discontinuity at $-\pi$ and $\pi$. Consequently, in the time domain, given
    by (6.42), the function decays as $1/t$ and its rms time window width (4.3) is
    $\infty$. To improve it, Meyer [3, 4] obtained the scaling function $\hat{\phi}_{M,m}(\omega)$
    by applying a smoothing function near the discontinuities of $\hat{\phi}_{SH}(\omega)$
    in such a way that the orthogonality condition


    ```

    $$\sum_k |\hat{\phi}_{M,m}(\omega+2\pi k)|^2=1$

    ```


    is satisfied. In (6.48) the index $m$ indicates the degree of smoothness—that
    is, the $mth$ order corner smoothing function $S_m(w)$ is $m$ continuously differentiable.
    To satisfy the orthogonality requirement (6.48), these corner smoothing functions
    should have the following properties:


    +   $\begin{cases} S_m(y)+S_m(1-y)=1, &quad 0 \le y \le 1; \ S_m(y)=0, &quad y
    < 0; \ S_m(y)=1, &quad y > 1. \end{cases}$


    Examples of corner smoothing functions are given below.'
