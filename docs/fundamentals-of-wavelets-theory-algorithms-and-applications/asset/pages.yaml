    the case of semiorthogonal decomposition of a multiresolution space.


    # 6.1.1 Relationship between the Two-Scale Sequences


    Recall from Chapter 5 that, as a result of the multiresolution properties, the
    scaling functions and wavelets at one scale (coarser) are related to the scaling
    functions at the next higher scale (finer) by the so-called two-scale relations:


