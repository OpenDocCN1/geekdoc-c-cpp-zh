  md: '# CHAPTER THREE


    # Fourier Analysis


    Since the days of Joseph Fourier, his analysis has been used in all branches of
    engineering science and some areas of social science. Simply stated, the Fourier
    method is the most powerful technique for signal analysis. It transforms the signal
    from one domain to another domain in which many characteristics of the signal
    are revealed. One usually refers to this transform as the spectral or frequency
    domain, while the domain of the original signal is usually the time domain or
    spatial domain. The Fourier analysis includes both the Fourier transform (or Fourier
    integral) and the Fourier series. The Fourier transform is applicable to functions
    that are defined on the real line, while the Fourier series is used to analyze
    functions that are periodic. Since wavelet analysis is similar to Fourier analysis
    in many aspects, the purpose of this chapter is to provide the reader with an
    overview of the Fourier analysis from the signal analysis point of view without
    going into the mathematical details. Most of the mathematical identities and properties
    are stated without proof.


    # 3.1 FOURIER SERIES


    Fourier series and Fourier transform are often separately treated by mathematicians
    since they involve two different classes of functions. However, engineers have
    always been taught that Fourier transform is an extension of Fourier series by
    allowing the period $T$ of a periodic function to approach infinity. We will follow
    this route by discussing Fourier series first. The Fourier series representation
    of a real-valued periodic function $p(t)$, $[p(t) = p(t + T)]$, is given by


    Fundamentals of Wavelets: Theory, Algorithms, and Applications, Second Edition,
    By Jaideva C. Goswami and Andrew K. Chan Copyright © 2011 John Wiley & Sons, Inc.


    34'
