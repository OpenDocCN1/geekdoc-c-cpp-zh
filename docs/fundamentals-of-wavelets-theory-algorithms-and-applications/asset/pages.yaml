    have different lengths, in general. We will later show that for o.n cases, all
    of these sequences have the same length and that there is a very simple relation
    among them which can be easily derived as a special case of the relationship among
    semiorthogonal cases. The construction of a semiorthogonal wavelet is followed
    by the construction of several popular orthonormal wavelets: the Shannon, Meyer,
    Battle-Lemarié, and Daubechies wavelets. Finally, we construct a biorthogonal
    wavelet. Other wavelets such as ridges, curvelets, complex wavelets, and lifting
    wavelets are discussed in Chapter 8.


