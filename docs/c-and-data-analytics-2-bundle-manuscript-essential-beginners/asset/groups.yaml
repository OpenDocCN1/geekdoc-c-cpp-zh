  md: "\n## Data Types\n\nYou have to use different variables when you are writing\
    \ a program using any language. These are nothing more than just reserved memory\
    \ values that store locations in some space in the memory of the compiler. The\
    \ above list of reserved keywords are useful here as well. While there are a lot\
    \ of keywords, there are seven basic keywords that define data types.\n\n| Type\
    \ | Keyword |\n|---|---|\n| Wide character | wchar_t |\n| Valueless | void |\n\
    | Double floating point | double |\n| Floating point | float |\n| Integer | int\
    \ |\n| Character | char |\n| Boolean | bool |\n\nMost of the data types that you\
    \ can use can be modified using one of these following modifiers to help:\n\n\
    - Long\n- Short\n- Unsigned\n- Signed\n\n### Variable Types Cont…\n\nWhen you\
    \ are using variables inside of a coding language, you are providing some storage\
    \ space that makes it easier for the program to manipulate. All of the variables\
    \ that you use will be attached to a different type and these types are going\
    \ to determine the layout and the size of the memory of the variable. It is also\
    \ going to set a range of values that you are able to store on this memory space.\n\
    \nNaming the variable is going to be similar to naming the identifier. You will\
    \ only be able to name it with a letter or an underscore and the letters are going\
    \ to be case sensitive. But after that, you are able to use any type of digit,\
    \ letter, and character that you would like.\n\nAgain, the basic variables that\
    \ you will be able to use here in more detail include:\n\n- **wchar_t**: this\
    \ is the wide character type.\n- **void**: this is going to represent the absence\
    \ of a type.\n- **double**: this is a floating value that will have double precision.\n\
    - **float**: this is a floating point that is going to have single precision.\n\
    - **int**: this is an integer.\n- **char**: this is often going to be just one\
    \ byte and is a type of integer.\n- **bool**: this is going to work with values\
    \ that are either true or false.\n\nYou can also define other types of variables.\
    \ These variables are things like pointer, array, reference, enumeration, data\
    \ structures, and classes.\n\n## Creating a new line\n\nNow that you know the\
    \ data types and modifiers, and all about making a comment in your program, it\
    \ is time to learn about how to create a new line. This is a problem that a lot\
    \ of new programmers run into. They have their program all nice and laid out in\
    \ the input, but the output is still really mashed together and really unkempt.\
    \ This is because they did not properly create a new line. Remember that whitespace\
    \ is ignored, so you cannot just skip a line, and expect to have a line skipped\
    \ in your program. You have to indicate to the compiler that you want to start\
    \ a new line. This is really important, as when you play out your program, you\
    \ want it to run smoothly. You do not want to see something like this.\n\nTry\
    \ This Today I ate Pizza and I did math. 6= (7-1) that is what I learned today.\n\
    \nYou would probably rather see this.\n\nTry This  \ntoday I ate pizza and I did\
    \ math  \n6=(7-1)  \nthat is what I learned today\n\nTo make the distinction,\
    \ you have to have the right function, as that is what programming relies on,\
    \ having the correct function.\n\nTo create a line break, you have to use the\
    \ function endl; this will indicate that you want a line break, and you do not\
    \ even have to add whitespace if you do not want to, though it is recommended\
    \ because it makes your program easier to read for a human.\n\nFor example, this:\n\
    \n```cpp\n{\n    cout << \"Try This\" << endl;\n    cout << \"Today I ate Pizza\
    \ and did Math\" << endl;\n    cout << \"6=(7-1)\" << endl;\n    cout << \"That\
    \ is what I learned today\" << endl;\n    return 0;\n}\n```\n\nLooks way better\
    \ than this:\n\n```cpp\n{\n    cout << \"Try This\" << endl; cout << \"Today I\
    \ ate Pizza and did Math\" << endl;\n    cout << \"6=(7-1)\" << endl; cout <<\
    \ \"That is what I learned today\" << endl;\n    return 0;\n}\n```\n\nCan you\
    \ see how confusing that would get for someone reading the code? You want your\
    \ code file to be easy to read, so that if someone else has to fix something,\
    \ they can easily find where the mistake has been made. If everything is all jumbled\
    \ together, then they would not be able to find anything very easily, now would\
    \ they?\n\nYou can also indicate line breaks by using `\\n`. This is the same\
    \ thing as endl; but is a lot faster to type. You can use whichever method you\
    \ want but choose one and stick with it.\n\n## The importance of the basics of\
    \ C++\n\nI know what you are thinking, why must you know all these nonsense tidbits\
    \ of information when you are just beginning, and the reason is, if you don't\
    \ learn them\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main()\n\
    {\n    int j = 10;\n    int k = 5;\n    int l = j + k;\n\n    cout << l << endl;\n\
    \    return 0;\n}\n```\n\nYou should get the answer 15.\n\nYou can also declare\
    \ and define the variables in your program, but that is some higher level stuff,\
    \ so if you would like to look into it you can Google search a tutorial on that.\n\
    \n### QUIZ\n\nHere is the set up. You should have one phrase, a math problem,\
    \ and then the answer to the math problem using said integers. You can make up\
    \ all of the variables yourself, whatever you want them to be.\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n\nint main()\n{\n    int _ = _;\n    int _\
    \ = _;\n    int _ = _ + _;\n    cout << \"''\" << endl;\n    cout << \"''\" <<\
    \ endl;\n    cout << \"int_\" << endl;\n    return 0;\n}\n```\n\nSimply enter\
    \ your digits in and make sure your numbers add up. After you've done so, rerun\
    \ the code without relying on copying and pasting the code without the integers.\
    \ This way, you'll have a basic understanding of variables and playing with the\
    \ basic integer operations within C++.\n\n## Chapter 4: Arrays, Loops, and Conditions\n\
    \nBelieve it or not, you’ve learned so much already. The basics are really not\
    \ that hard and now it’s just about learning about a few more things and putting\
    \ concept after concept together to make sure you’re becoming a better C++ programmer.\
    \ Let’s keep going.\n\n### Arrays\n\n### Initializing arrays\n\nYou can initialize\
    \ arrays one by one or using a single statement. Example:\n\n```cpp\ndouble balance[5]\
    \ = {1000.0, 2.0, 3.4, 17.0, 50.0};\n```\n\nThe numbers that are found between\
    \ the brackets can’t end up higher than the amount of elements that you are using.\
    \ This means that you cannot have six sets of numbers when your array title only\
    \ specified five. However, if you do not specify the size, then an array of just\
    \ the right size is created. You would type it as follows:\n\n```cpp\ndouble balance[]\
    \ = {1000.0, 2.0, 3.4, 17.0, 50.0};\n```\n\nThis creates the exact same array\
    \ as the previous example, only you did not specify the array size so it was created\
    \ for you. Pretty nifty.\n\nNow that you know how to write an array, it is time\
    \ to move on to putting it into the actual program. This program is a bit more\
    \ advanced than the ones before, and has a few more elements. You can look up\
    \ these elements on www.compileonline.com. You will be directed to a lot of tutorials\
    \ and there is even a PDF file for you to download.\n\nHere is the formula for\
    \ your program to assign an array.\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\n#include <iomanip>\nusing std::setw;\n\nint main()\n{\n    int n[10];\
    \  // n is an array of ten integers\n    // initialize elements of array n to\
    \ 0\n    for (int i = 0; i < 10; i++)\n    {\n        n[i] = i + 100; // set element\
    \ at location i to i + 100\n    }\n\n    cout << \"Element\" << setw(13) << \"\
    Value\" << endl;\n    // output each array element's value\n    for (int j = 0;\
    \ j < 10; j++)\n    {\n        cout << setw(7) << j << setw(13) << n[j] << endl;\n\
    \    }\n    return 0;\n}\n```\n\nlike.\n\nThere are four types of loops. These\
    \ loops handle different requirements.\n\n### While loop\n\nThe while loop is\
    \ going to continue repeating the loop as long as a certain condition is met.\
    \ It is going to test out this condition each time it restarts the loop cycle\
    \ and will do this until the condition is no longer true.\n"
  mdcn: "\n\n## 数据类型\n\n当你使用任何语言编写程序时，你都必须使用不同的变量。这些变量不过是在编译器内存的某个空间中存储位置而保留的内存值。上面列出的保留关键字在这里也同样有用。虽然关键字有很多，但有七个定义数据类型的基本关键字。\n\
    \n| 类型 | 关键字 |\n|---|---|\n| 宽字符 | wchar_t |\n| 无类型 | void |\n| 双精度浮点 | double\
    \ |\n| 浮点 | float |\n| 整型 | int |\n| 字符 | char |\n| 布尔 | bool |\n\n你使用的大多数数据类型都可以通过以下修饰符之一进行修改，以帮助你：\n\
    \n- Long（长）\n- Short（短）\n- Unsigned（无符号）\n- Signed（有符号）\n\n### 变量类型（续）\n\n当你在编程语言中使用变量时，你实际上是在提供一些存储空间，以便程序更容易操作这些数据。你使用的所有变量都会与一个不同的类型相关联，这些类型将决定变量内存的布局和大小，还会设定你能够在该内存空间中存储的值的范围。\n\
    \n变量命名与标识符命名类似。你只能使用字母或下划线作为名称的开头，并且字母区分大小写。但在开头之后，你可以使用任何你想要的数字、字母和字符。\n\n同样，你在这里可以使用的更详细的基本变量包括：\n\
    \n- **wchar_t**：这是宽字符类型。\n- **void**：这表示不存在类型。\n- **double**：这是一种具有双精度的浮点值。\n\
    - **float**：这是一种具有单精度的浮点值。\n- **int**：这是一个整数。\n- **char**：这通常只占一个字节，是一种整数类型。\n\
    - **bool**：它处理的值要么为真，要么为假。\n\n你还可以定义其他类型的变量。这些变量包括指针、数组、引用、枚举、数据结构和类等。\n\n## 创建新行\n\
    \n既然你已经了解了数据类型和修饰符，也知道了如何在程序中添加注释，现在是时候学习如何创建新行了。这是很多编程新手都会遇到的问题。他们把程序在输入中排版得很好，但输出结果仍然挤在一起，非常凌乱。这是因为他们没有正确地创建新行。请记住，空白字符会被忽略，所以你不能只在程序中跳过一个空行，就指望输出中也会跳过一行。你必须向编译器表明你想开始新的一行。这非常重要，因为当你运行程序时，你希望它运行得流畅。你不会想看到类似这样的内容：\n\
    \n试试这个 今天我吃了披萨，还做了数学题。6=(7-1) 这就是我今天学到的。\n\n你可能会更希望看到的是这样的：\n\n试试这个  \n今天我吃了披萨，还做了数学题\
    \  \n6=(7-1)  \n这就是我今天学到的\n\n为了做出这种区分，你必须使用正确的函数，因为编程所依赖的正是正确的函数。\n\n要创建换行，你必须使用\
    \ endl 函数；它会表示你想要一个换行。如果你不想，甚至不必添加空白字符，不过还是建议添加，因为它能让你的程序更易于人类阅读。\n\n例如，这样：\n\n\
    ```cpp\n{\n    cout << \"Try This\" << endl;\n    cout << \"Today I ate Pizza\
    \ and did Math\" << endl;\n    cout << \"6=(7-1)\" << endl;\n    cout << \"That\
    \ is what I learned today\" << endl;\n    return 0;\n}\n```\n\n看起来比这样好得多：\n\n\
    ```cpp\n{\n    cout << \"Try This\" << endl; cout << \"Today I ate Pizza and did\
    \ Math\" << endl;\n    cout << \"6=(7-1)\" << endl; cout << \"That is what I learned\
    \ today\" << endl;\n    return 0;\n}\n```\n\n你能看出这会让读代码的人感到多么困惑吗？你希望自己的代码文件易于阅读，这样如果别人需要修复某些内容，他们就能轻松找到出错的地方。如果所有代码都混杂在一起，他们就不太容易找到任何内容了，不是吗？\n\
    \n你也可以使用 `\\n` 来表示换行。这和 endl 是一样的，但输入起来要快得多。你可以使用其中任意一种方法，但请选择一种并坚持下去。\n\n## C++\
    \ 基础的重要性\n\n我知道你在想什么：为什么刚开始学习时要了解这些无聊的琐碎信息？原因是，如果你不学习它们……\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n\nint main()\n{\n    int j = 10;\n    int\
    \ k = 5;\n    int l = j + k;\n\n    cout << l << endl;\n    return 0;\n}\n```\n\
    \n你应该得到答案 15。\n\n你也可以在程序中声明和定义变量，但那是更高级的内容，如果你想了解，可以谷歌搜索相关教程。\n\n### 测验\n\n设置如下：你应该有一个短语、一个数学问题，然后用上述整数给出该数学问题的答案。你可以自己设定所有变量，想设成什么都可以。\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main()\n{\n    int\
    \ _ = _;\n    int _ = _;\n    int _ = _ + _;\n    cout << \"''\" << endl;\n  \
    \  cout << \"''\" << endl;\n    cout << \"int_\" << endl;\n    return 0;\n}\n\
    ```\n\n只需输入你的数字，并确保这些数字加起来结果正确。完成之后，重新运行代码，不要依赖复制粘贴没有整数的代码。这样，你就能对变量以及 C++ 中基本整数运算的操作有一个基本的了解。\n\
    \n## 第 4 章：数组、循环和条件\n\n信不信由你，你已经学到了很多东西。基础知识其实并不难，现在只需要再学一些内容，并把一个又一个概念串联起来，确保你成为更优秀的\
    \ C++ 程序员。让我们继续吧。\n\n### 数组\n\n### 初始化数组\n\n你可以逐个初始化数组，也可以使用一条语句进行初始化。示例：\n\n\
    ```cpp\ndouble balance[5] = {1000.0, 2.0, 3.4, 17.0, 50.0};\n```\n\n方括号中的数字不能大于你正在使用的元素数量。这意味着，当你的数组名只指定了五个元素时，你不能有六组数字。不过，如果你不指定大小，系统会创建一个大小刚好的数组。你可以这样输入：\n\
    \n```cpp\ndouble balance[] = {1000.0, 2.0, 3.4, 17.0, 50.0};\n```\n\n这会创建与上一个示例完全相同的数组，只不过你没有指定数组大小，因此它会被自动创建。相当巧妙。\n\
    \n既然你已经知道如何编写数组，是时候把它应用到实际程序中了。这个程序比之前的程序稍微高级一些，也多了一些元素。你可以在 www.compileonline.com\
    \ 上查找这些元素。你会看到很多教程，甚至还有一个 PDF 文件可供下载。\n\n下面是为你的程序分配数组的公式。\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n\n#include <iomanip>\nusing std::setw;\n\n\
    int main()\n{\n    int n[10];  // n is an array of ten integers\n    // initialize\
    \ elements of array n to 0\n    for (int i = 0; i < 10; i++)\n    {\n        n[i]\
    \ = i + 100; // set element at location i to i + 100\n    }\n\n    cout << \"\
    Element\" << setw(13) << \"Value\" << endl;\n    // output each array element's\
    \ value\n    for (int j = 0; j < 10; j++)\n    {\n        cout << setw(7) << j\
    \ << setw(13) << n[j] << endl;\n    }\n    return 0;\n}\n```\n\n像这样。\n\n共有四种类型的循环。这些循环分别处理不同的需求。\n\
    \n### while 循环\n\n只要某个条件满足，while 循环就会不断重复执行循环。它会在每次重新开始循环时测试该条件，并一直这样执行，直到条件不再为真。\n"
