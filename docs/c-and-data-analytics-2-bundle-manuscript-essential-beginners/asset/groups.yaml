  mdcn: "\n下一种语句类型将更深入地介绍，并展示如何根据用户在系统中输入的内容来获得答案。\n\n### if else 语句\n\n现在，正如我们在上文稍作讨论的那样，使用\
    \ if 语句时可能会出现一些限制。如果用户输入了错误答案，屏幕就会直接变成空白，这对系统来说可能很令人头疼。此外，有时用户需要输入\n\n```\nboolean\
    \ expression is true\n}\nElse\n{\n    // statement(s) will execute if the\nboolean\
    \ expression is false\n}\n```\n\n你可以按需要在自己的语句中加入任意多个这样的结构。因此，如果你想编写一个把人们分为五个不同年龄组的程序，就可以基于语法中更多的“else”来实现。这会让你更容易加入一些其他选项。\n\
    \n那么让我们保持简单。假设系统中有 2 + 2。如果用户猜 4 是答案，你可以在第一部分把它设为真语句，然后屏幕上会出现消息“答对了！干得好！”。但如果用户输入答案\
    \ 5（或除 4 以外的任何其他答案），你可以让屏幕上出现类似“抱歉，那不是正确答案”的消息。\n\n当你要处理代码中想做的事情时，这给了你很大的自由度。你可以向流程中加入一些不同的东西，并且真正扩展你正在编写的代码。\n\
    \n在编写这些内容时，你还可以记住另一点：你可以将一些 if 语句和一些 if else 语句相互嵌套。对初学者来说，这可能会变得有点复杂，但经过一些练习，你会发现它会为整个过程增添很大的能力，并能让你更容易地在这门编程语言中实现你想要做的某些事情。\n\
    \n## 第6章：常量与各种类型的字面量\n\n这门语言很复杂，尽管你上面学到的内容足以运行一些简单的功能，但这门语言还有太多其他部分，如果不在这里加入更深入的知识来帮助你过渡到下一步，那简直是一种罪过。\n\
    \n如果你想成功掌握这门语言，就要准备好花很长时间努力钻研。虽然它对初学者来说是一门不错的语言，因为它具有多个难度层次，但它也需要你努力才能进入下一水平。你越是想学得更多，附加的效果就越困难。\n\
    \n编程本身是一个漫长而艰难的过程，但它绝对值得，因为有许多职业需要 C++ 知识。从游戏设计，到机器人相关工作等等。如果某项工作涉及技术，那么它很可能涉及\
    \ C++。\n\n因此，这里还有一些你可以学习的步骤，以及一些你需要了解的重要功能，以便开始掌握这门语言。\n\n### 常量与字面量\n\n常量和字面量是学习\
    \ C++ 的重要部分。它们涉及数据类型以及这些数据类型中的变量。它们是常量，不能被更改。\n\n|  |  |\n|---|---|\n| 032uu |\
    \ //非法：不能重复后缀 |\n| 078 | //非法：8 不被视为八进制数字 |\n| 0x_Fell | //这个是合法的 |\n| 215 | //这个是合法的\
    \ |\n| 212 | //这个是合法的 |\n| 85 | //这是一个十进制数 |\n| 30ul | //这是一个无符号长整型 |\n| 30l |\
    \ //这是长整型 |\n| 30u | //这是一个无符号整型 |\n| 30 | //这是一个整型 |\n| 0x4b | //这是一个十六进制数 |\n\
    | 0213 | //这是一个八进制数 |\n\n通过指数形式表示时，你应该包含小数部分、整数部分，或两者都包含。你使用的带符号指数也应该以 E 或 e 开头。\n\
    \n你在编写代码时可以使用的一些浮点字面量包括：\n\n```\n.e55   //these are illegal because they are missing\
    \ the fraction or the integer\n21of:  //these are illegal because they don't have\
    \ the exponent or the decimal\n51oE  //these are illegal because they have an\
    \ incomplete exponent\n314159E-5L  //these are legal\n3.15159//these are legal\n\
    ```\n\n### 布尔字面量\n\n接下来我们可以讨论的字面量类型是布尔字面量。在 C++ 代码中，你可以使用两种类型。基本上，布尔值会显示为 true\
    \ 或 false。如果你设定的条件为真，布尔表达式的结果就会为 true。另一方面，如果你设定的条件未满足，你最终会得到一个为 false 的条件。当答案是布尔类型时，所有答案都会是\
    \ true 或 false。\n\n### 字符字面量\n\n当你在代码中看到字符字面量时，你会注意到它们用单引号括起来。这些字面量可以很简单，比如用‘x’来告诉命令，也可以长得多。这些是你可以加入代码中的基础内容，能让事情更容易处理。\n\
    \n### 字符串字面量\n\n你可以使用的另一种字面量类型是字符串字面量。这类字面量会用双引号括起来。字符串将包含类似字符字面量的字符，包括通用字符、转义序列和普通字符等选项。你可以通过多种方式使用字符串字面量，包括将一行拆成两行，以及分离内容以便阅读。你可以使用的字符串示例包括：\n\
    \n```\n\"hello, Mother\"\n\"hello, \\\nMother\"\n\"hello, \" \"M\" \"other\"\n\
    ```\n\n## 结论\n\n再次感谢你购买本书。我希望它既有信息量，又令人愉快。请把这本书当作指南，不仅用于获取知识，也用于获得灵感。C++ 看起来像是一门令人生畏的语言，但你越是有规律地练习它，日复一日、月复一月、年复一年，你就会像掌握生活中的其他事情一样，完全掌握这门编程语言。我请你不要因为出现问题而烦躁焦虑，因为这种情况会发生很多次。\n\
    \n外面有无数资源正等着你去阅读或发现，为了你自己好，你应该尽职尽责地学习、改进和提升你的 C++ 编程技能，使其达到下一水平。\n\n## 附赠：黑客简史与概述\n\
    \n许多人都听过 C++ 这个名字，但真的不把它当回事。如果你不太精通技术，你可能会以为它指的是一个平庸的字母等级，但事实并非如此。\n\n信不信由你，C++\
    \ 是一种黑客语言；虽然它不是唯一的黑客语言，但它是比较重要的语言之一，因为它用途广泛且易于使用。要想最大程度地了解 C++，你必须更多地了解它产生的原因，而那正是黑客行为。\n\
    \n### 黑客行为\n\n黑客行为并不是一个新概念。只要有任何类型的技术存在，就会有人想办法入侵它们。黑客行为是对从一处发送到另一处的任何技术数据流进行操纵和/或中断。这是通过脚本来完成的。虽然你可以在网上获得预先打包好的脚本，但许多人更喜欢老式的方法，即编写自己的脚本，因为这让他们能更灵活地利用信息做自己想做的事。已经打包设置好的脚本灵活性有限，而且相当显眼。一个真正想要进行黑客攻击的黑客，其目标是保持隐蔽。如果你被抓到，除非你有权限做你正在做的事情，否则你可能会陷入大麻烦。\n\
    \n### 黑客史\n\n"
