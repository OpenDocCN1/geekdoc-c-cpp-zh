  mdcn: "\n这个循环会反复执行一个语句序列，同时简化管理循环变量的代码。\n\n写法如下\n\n```\nfor ( init; condition; increment)\n\
    {\n    statement(s);\n}\n```\n\n### Do...while 循环\n\nDo...while 循环与 while 语句类似，但它是在到达语句末尾时测试条件，而不是在开头测试。\n\
    \n写法如下\n\n```\ndo\n{\n    statement(s);\n} while (condition);\n```\n\n### 嵌套循环\n\
    \n嵌套循环是在另一个循环内部工作的循环，从而形成循环的连续嵌套。这种循环时间一长可能会让人困惑。\n\n写法如下\n\n其他语言的教程也一样，不只是 C++；随便涉猎一下，看看你喜欢什么。\n\
    \n## 第5章：在 C++ 中使用运算符\n\n对于你计划使用的任何编程语言，学习如何使用运算符都很重要。它们能帮助你告诉程序你想做什么，并能让你处理自己的代码容易得多。在程序中可以使用四种主要类型的运算符，它们各自会以不同方式告诉程序如何行为。你可以在\
    \ C++ 语言中使用的一些运算符包括：\n\n- 逻辑运算符\n- 算术运算符\n- 赋值运算符\n- 关系运算符\n\n我们来看看其中一些运算符如何工作，以及你在用\
    \ C++ 语言编写代码时如何让它们很好地发挥作用。\n\n### 逻辑运算符\n\n本指南中我们要使用的第一类运算符是逻辑运算符。它们会帮助你比较输入系统的某些部分。你可以使用的一些逻辑运算符包括：\n\
    \n- `||`：这称为逻辑 OR。使用它时，如果你的操作数之一不为零，条件就会为真。\n- `&&`：这称为逻辑 AND。如果你有两个操作数且它们都不为零，条件就为真。\n\
    - `!`：这是逻辑 NOT。你可以用它反转操作数的状态。因此，如果条件最终为假，这个符号会使其变为真。\n\n### 算术运算符\n\n你可以使用的另一类运算符是算术运算符。它们与在学校里做数学几乎一样。你将告诉程序对提供的信息进行加、减和其他运算。你可以使用的一些算术运算符包括：\n\
    \n- `+`：这是加法运算符，会将你选择的两个操作数相加。\n- `-`：这是减法运算符。它会取右侧操作数并从左侧操作数中减去。\n- `*`：这个运算符使得在\
    \ C++ 语言中进行乘法成为可能。\n- `/`：这个运算符帮助你在 C++ 中进行除法。\n- `++`：这是递增运算符。它会把操作数的值增加一。\n\
    - `--`：这是递减运算符。它会把操作数的值减少一。\n\n### 赋值运算符\n\n赋值运算符让你更容易为变量指定名称，并有助于搜索、保存你正在编写的代码的不同部分等。你可以在\
    \ C++ 中使用的一些赋值运算符包括：\n\n- `=`：这个运算符是简单赋值运算符。它会把右侧操作数的值赋给左侧操作数。\n- `+=`：这个称为“加\
    \ AND”运算符。它会把两个操作数的值相加，然后把它们的和赋给左侧操作数。\n- `*=`：这是“乘 AND”运算符。它会把两个操作数相乘，然后把结果赋给左侧操作数。\n\
    - `-=`：这个运算符会从左侧操作数中减去右侧操作数的值，然后把差值赋给左侧操作数。\n- `/=`：这是“除 AND”运算符。它会用左侧的值除以右侧的值，然后把结果赋给左侧操作数。\n\
    \n### 关系运算符\n\n- `==`：这个运算符会检查两个操作数是否相等。如果相等，条件就为真。\n- `>`：这个运算符会检查操作数的值。如果左侧操作数高于右侧操作数，条件就为真。\n\
    - `<`：这个运算符基本上与上面的运算符相反。如果你发现左侧操作数的值小于右侧操作数，条件就为真。\n- `!=`：这个运算符会检查两个操作数是否相等；如果值不相等，条件就为真。\n\
    - `<=`：这个运算符会检查左侧操作数是否小于或等于右侧操作数。如果满足此条件，条件就为真。\n- `>=`：这个运算符会检查左侧操作数的值是否大于或等于右侧操作数。如果为真，条件就为真。\n\
    \n## 第6章：帮助 C++ 做出决策\n\n有时你需要程序为你做决定。你可以根据用户输入计算机的信息，以及你决定条件为真需要满足什么，让它以某种方式行动。在这个系统中，决策稍微高级一些，但你会发现它很容易学习，并且会开启许多你可以在\
    \ C++ 系统中运用的思路。我们来看看你可以做些什么来帮助系统自行做出决策。\n\n### Switch 语句\n\n在这个系统中，我们要处理的第一种决策是\
    \ switch 语句。这些语句很好，因为它们允许你把变量的相等性与一组值（或 case）进行对照检查。你试图检查的变量将与每个 case 进行比较。你可以使用的语法的一个好例子包括：\n\
    \n```\nswitch (expression) {\n    case constant-expression:\n        statement(s);\n\
    \        break; // optional\n    case constant-expression:\n        statement(s);\n\
    \        break; // optional\n\n    // you can add in as many of these case statements\
    \ as you would like\n\n    default: // optional\n        statement(s);\n}\n```\n\
    \n在这些语句中工作时，有几条规则应牢记。首先，switch 语句的表达式应为整型或枚举类类型。此外，它也可以属于具有转换函数的类。在 C++ 中，添加到语法中的\
    \ case 语句数量没有限制，因此你可以根据需要让它们任意长或任意短。只需\n\n### If 语句\n\n你在程序中最基本的事情之一是创建 if 语句。这些语句基于系统中的真/假概念。如果系统表示输入在你设定的条件下为真，那么程序就会运行你要求它运行的任何内容。例如，你设置系统询问\
    \ 2 + 2 的答案是什么。如果用户输入的答案是 4，你可以让一条消息显示“答对了！干得好！”\n\n每当用户输入的输入根据你设定的条件最终为真时，你就会看到你选定的语句显示出来。另一方面，如果这个人输入了错误答案，会发生什么？如果他们对上面的问题输入答案\
    \ 5，那就不正确，系统会认为该答案为假。\n\n由于 if 语句相当基础，你会发现如果这个人输入错误答案，它不会做好准备。在这个阶段，如果他们在上面的示例中输入\
    \ 4 以外的任何数字，屏幕只会变成空白，什么也不会发生。\n"
