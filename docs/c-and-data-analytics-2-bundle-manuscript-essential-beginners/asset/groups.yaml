    - **Diagnostic**: This is the type of data analytics that will look to past performance
    and will tell you what was going on, why that was, and the result of it. The question
    this type of analytic asks is, “Why did it happen?”


    - **Prescriptive**: Prescriptive analytics will tell you when it’s time to take
    action. Now, this is the most important one of them all, because this is the data
    analytics that will tell you what needs to be done next, and it’s sort of what
    will determine the next step of the company. This is the type of data analytics
    that either lets the company go under, or will let the company spring forward
    as a result.


    - **Predictive**: This is more of a prediction of what’s going on in order to
    determine the future course of action and the scenarios that might happen as a
    result of this. This sort of predictive forecast is important because it tells
    you what to do and where to go before you begin with changing or starting things
    up in your business.


    ### Examples of These Analytics


    A big part of understanding data analytics is not just reading about it, but seeing
    examples of it. This chapter will discuss each of the various types of data analytics,
    and how they’re used in big businesses.


    Prescriptive analytics, as said before, are the most valuable, but it’s not the
    most used. For example, only 13% of the organizations reporting on this type of
    data analytics use predictive, but only 3% are using prescriptive.


    For example, many people like to use this to predict what’s going on, but the
    prescription of the correct action can make a difference. When you have big data
    analytics that talks about a certain subject, these prescriptive analytics will
    give you a focus on the various questions. Let’s take, for example, the health
    care industry, and you’re working on the hospital’s analytics based on the sick
    people that are coming in. Maybe you want to manage the amount of obese patient
    cases to see how you can work on focusing the treatment. You can look at the various
    types, such as bad cholesterol, diabetes, or other disorders, and you should use
    this to focus on the type of treatments they should take.

