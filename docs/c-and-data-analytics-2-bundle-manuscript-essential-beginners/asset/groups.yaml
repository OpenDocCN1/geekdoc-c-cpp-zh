    ## Chapter 1: What Are Data Analytics and Why Every Business Should Have It


    Data analytics is very important, but you might wonder what it is, and what is
    so special about it. Well, this chapter will go over what it is, why it matters,
    and why it is essential for every and any business.


    ### Data Analytics


    For example, let’s say that you’re looking at the amount of items you’ve sold
    within the year. Let’s say it was going great at first, but around June or July,
    things start to fizzle out. At first, you might freak out, but upon further analysis,
    you might realize that you put in a new program, or maybe hired on a new person
    to the business. Maybe Joe Schmo might be causing you more harm than good, and
    when you look at his production, you’ll start to see who is at fault here in order
    to handle it accordingly.


    In another sort of situation, maybe sales started to increase. The wrong thing
    to


    It should be fairly obvious as to why a business would need this, but maybe explaining
    it this way may shed some new light on this topic.


    For starters, think about every single decision you’ve made in a business. Most
    of the time, the sound, rational decisions in a business were backed by evidence,
    whether that evidence may be graphs or the like. Business analytics allows you
    to do this. You can look at the online analytical processing or other sorts of
    data and see where things are going. This will allow you to make decisions.


    If you’re running a consulting firm, and maybe you’re monitoring how many clients
    each consultant takes on, you can see which employees aren’t fitting the bill,
    and who is doing above and beyond. This in turn will keep toxic and bad people
    from getting into the company, protecting yourself and the others around you.


    In the same vein, maybe you have a person who is going above and beyond, who should
    be promoted and given a raise because they’re working hard. You can use this as
    a basis to promote people, on the grounds of the statistical evidence. You can
    do this in order to keep morale going. Sometimes, if you don’t reward the ones
    doing well, you’ll end up suffering because the person will then not work as well,
    causing issues for you too.


    But also, look at it in other regards as well. It can even protect you from bad
    situations. For example, let’s say that you’re running a bank or a credit card
    service. These companies and businesses will look at any withdrawal and spending
    of a certain person at any time. If they suddenly see countless amount of money
    withdrawn from there, it actually can be grounds for fraud. This is why cards
    will get cancelled, because they notice the problem and take action. Think about
    it, you wouldn’t want to wake up with a severely negative balance, would you?
    This is used for your own protection, and these businesses know that.


    Furthermore, perhaps you have an employee that seems fine, but upon data analysis,
    you see that they have been embezzling from you for a bit now. You can stop this
    situation from happening to the point where you catch them before they blow off
    the company and you’re left with nothing.


    Now, a business also needs this not just for protection, but for their products
    as well. Let’s say you have an online business that sells different types of clothing.
    Maybe you have the data on all of the articles of clothing and you see that some
    are being sold more than other products. These data analyses will allow you to
    see which products your customers will buy more or less, and you can adjust this
    accordingly so that you’re not wasting money. In this day and age, many of these
    analytics have dashboards that showcase these data streams so that you can see
    them in real time.


    When you get right down to it, it’s downright essential to have data analytics.
    After all, have you ever tried running a business with no information on what’s
    good and bad, no idea on what will and won’t sell? You don’t. You sit there wondering
    why in the world you don’t have customers, why your business is failing and why
    you’re not doing the best. Plus, it can be used in the other way as well. It can
    tell you just what you need. A business needs this, because it will showcase to
    them what they need to fix before it’s too late. This can utterly save you, and
    while you might not have liked doing this back in high school during math class,
    it’s one of the most important things you can do for your company.


    So, at the bottom of all of this is the essential notion that you need data analytics.
