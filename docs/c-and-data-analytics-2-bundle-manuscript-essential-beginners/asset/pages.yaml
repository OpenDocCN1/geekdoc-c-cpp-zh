    # Data Visualization


    Now, this is sort of the final picture and part of all of this. This is data visualization.
    In essence, when you’re dealing with big data, the sheer amount and velocity of
    it, not to mention the fact that it can be all over the place, can make you feel
    like you’re going mad. Well, if you feel confusion when looking at all of those
    numbers, wouldn’t it make sense to visualize them? The best thing to do is to
    use data visualization, which'
  merge: -1
  img_proc: true
- pgno: 261
  md: is the display graphically of various abstract information for two different
    reasons. It’s used to help you make sense of various patterns and other elements
    for one, which is called data analysis, and the other reason is communication
    to others. If you want to get something done and fixed up, you’ve got to communicate
    this effectively, and that’s where data visualization comes in. Many companies
    will live off this data, and for many people, the data visualization will allow
    you to understand what is going on, along with understanding how to present them
    to other people. The information is abstract, because it is statistics and not
    physical things. Sure, statistics might represent physical
  merge: -1
  img_proc: true
