  md: 'systems might not have the data that you need, and you might have to do some
    digging. It saves the time and you’ll be able to look for this easily, and without
    fail.


    It also works to help improve the data quality.  Often,  when  you’re  going through
    a lot of data, there are some bad data that comes about, and sometimes the codes
    and descriptions are off. However, with a data warehouse, you’ll be able to have
    all of that consistently put into there, and there is anything wrong with it,
