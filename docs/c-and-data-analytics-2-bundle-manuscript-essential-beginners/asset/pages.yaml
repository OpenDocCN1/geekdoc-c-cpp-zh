    # Data warehouse


    Now, once you have all of that data, you need to figure out where it’s supposed
    to go, right? Well, there is an option for you to find this, and in essence, it’s
    a software known as the data warehouse.'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'This is a system that is used when you have a data analysis, and in a sense,
    it''s where all of the information is stored when going through various data analysis.
    This is another major component of business intelligence, and for a good reason.


    A data warehouse is a group of repositories that are putting data into different
    areas from sources that aren''t always the same. This takes for example various
    historical data and even some data on recent events in order to create a good,
    analytical report for those what are working in the business. For example, it
    will take the quarterly'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'comparisons that a business might have, and then put the trends up next to
    the detailed sales analysis done daily. From there, you can take the information
    from the data warehouse, and the current information you’ve gotten from mining,
    and you’ll be able to use this in order to form connections.


    Now, the data warehouse is essentially uploaded onto the computer from the various
    operational systems. The marketing, sales, and the rest of the important facets
    of the business will soon be integrated into there. The data will then go towards
    a sort of operational data store in order to go to'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'the data warehouse in order to report it

    later on.


    Now, what this will do is that it’ll take

    the data from various sources into one

    database in order to present data, and

    along with that it’ll help with the

    problem of database isolation contention

    with the transitions. This will be able to

    allow the transactions to still happen

    despite it all.


    Also, look at it in a sort of data history

    sense. If you really need to go back, you

    can look at it. This will also help

    because sometimes the transactions'
