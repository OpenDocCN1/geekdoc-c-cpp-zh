- pgno: 165
  md: '# Bonus: Brief Hacking

    History and Overview


    Many people have heard the name C++ but really think nothing of it. If you are
    not very technologically versed then you may think that it is about having a mediocre
    letter grade, but that is not the case.


    Believe it or not, C++ is a hacking language, and while it is not the only one
    out there, it is one of the more important'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'ones because it is versatile and also easy to use. To learn the most about
    C++, you have to know more about the reason it came about and that would be hacking.


    # Hacking


    Hacking is not a new concept. For as long as there has been any type of technologies
    around, there have been people figuring out ways to hack them. Hacking is the
    manipulations and/or interruptions of any technological stream'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'of data that is being sent from one place to another. This is done with scripts.
    While you can get pre-packaged scripts online, many people prefer the old fashioned
    way of writing their own scripts, as is gives them more flexibility to do what
    they want with the information. Scripts that come already set up into packages
    have limited mobility and are pretty visible. The goal of a hacker who truly wants
    to hack is to remain discreet. If you are caught, unless you have permission to
    be doing what you are doing, you can get in a heap of trouble.


    # History of Hacking'
  merge: -1
  img_proc: true
- pgno: 168
  md: Hacking began officially in the 1970s when teenagers were banned from using
    the phone lines because they were trying to make free calls, and figured out how
    to do so. Phone hacking was the biggest thing, and continued for over a hundred
    years. Making calls used to be expensive, especially when the phone lines were
    new, so of course people were trying to find ways to save money, and usually it
    caught up with them. Such was the case for a man named John Draper. He was arrested
    for figuring out how to make long distance calls simply by blowing a note into
    the receiver that prompted it to make a long distance call
  merge: -1
  img_proc: true
- pgno: 169
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 170
  md: 'actually start until the 1980s. However, once it began, it spread like wildfire,
    and there were a lot of people who thought that it would be a great idea to see
    what all they could do, and how they could manipulate these computers.


    # Types of Hacking


    There are several different types of hacking out there. And while the media portrays
    all hackers as bad, they are not. It is not black and white either. While those
    are the two most popular groups'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'when talking about hacking, there are so many categories in between, that it
    would not be beneficial to only talk about the two that are most known.


    The two main categories that all the sub categories fall between however, are
    ethical and unethical hacking.


    Ethical hacking is hacking that is used only for good purposes. There are a lot
    of people who have full permissions to hack into a system, and to find all of
    the bugs of the software or hardware.'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'Ethical hackers are the ones that are responsible for all of the bug fixes
    in your phone, apps, tablets, or computers. These people are hired by a company
    to figure out what is wrong with their systems, and find the best way to fix it.
    These hackers are an essential part of the hacking community.


    If it were not for hackers we would not have the world wide web, urls or HTML.
    Hacking is an important part if done within the boundaries of ethical hacking.'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'Unethical hacking, however, is not within the realms of hacking that is legal
    with current laws. It is hacking for a malicious purpose. People who hack bank
    mainframes and steal people''s credit card and account information and use it
    to drain accounts are known as unethical hacking.


    Unethical hacking is the bane of true hackers existence. These people are the
    ones that give the good guys a bad name.'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'Now to go on to the terms for all

    different types of hackers.


    +   - White Hat Hackers: These are the

    +     completely ethical hackers. Every

    +     thing that they do is done for good.

    +     They go thru a system, and comb it

    +     down for any bugs, and build

    +     super strong firewalls so that the

    +     systems are safe. They create anti-

    +     malware software.


    +   - Black Hat Hacking: This is the

    +     type of hacking that you have to

    +     stay away from. With great power

    +     comes great responsibility. The'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'great responsibility to not become prey to the temptation that is black hat
    hacking. This type of hacking can get you in a lot of trouble, and are immoral.
    Hacking government files or even other people’s privacy can be tempting but will
    lead to heavy disciplinary actions.


    +   - Grey Hat Hacking: These are the hackers that sometimes do bad things for
    good reasons. Such as Anonymous. They may hack the firewall of an sensitive information
    file, but they do so to expose the corruption that is going on behind the firewall.
    These hackers are often treated like'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'criminals, but in reality, they can be regarded as heroes depending on your
    perspective.


    +   - Red Hats: These are the bounty hunters of the hacking world. They use their
    hacking skills to find illegal hackers, such as black hat hackers, or grey hats
    that are doing bad things that they should not be doing. They then turn them over
    to the feds, so that the illegal hackers are arrested. There are several other
    terms for these hackers, but they are not very appropriate, so we shall leave
    them out.'
  merge: -1
  img_proc: true
- pgno: 177
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 178
  md: 'even become a profession if you go

    about it the right way.


    Now it is important to note that all of

    these hackers are going to work in a

    different way, but they are going to use

    the same kinds of codes in order to get

    the information that they want from other

    computers. A black hat hacker is going

    to concentrate on getting into the system

    and getting the information that they need

    to see success while the white hat

    hackers are going to work to keep these

    hackers off the system. While they are

    working in different ways, they are going

    to use the same tools and see who will'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'come out on top in the end.


    With that said, you need to be careful about what you are doing with your hacking
    abilities. If you are using them to get onto a system or a network that you aren’t
    allowed to be on, then you could get into a lot of trouble. While some people
    find these vulnerabilities and tell the company all about them right away, it
    is still a legal issue if you are on the system when you shouldn’t be. The company
    you mess with could press charges so it is always best to just work within your
    own network and keep that safe rather than trying to get onto a'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'network you don’t belong.


    On the other hand, if you are someone who loves to work in the computer world
    and you want to be able to do this all the time, it may be a good idea to work
    as a white hat hacker. There are many companies that hold onto private and personal
    information for their customers, whether it is hospital information, credit card
    information, or something else. They are always on the lookout for a black hat
    hacker who may try to get into the system and take this information and a good
    white hat hacker can always find the work that they need'
  merge: -1
