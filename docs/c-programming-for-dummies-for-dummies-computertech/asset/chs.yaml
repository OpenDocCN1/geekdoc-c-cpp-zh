  \ 1 开始。”\n\n重复执行的语句作为代码块包含在花括号中。它们会一条接一条地持续执行，直到满足退出条件。\n\n**退出条件**（`exit condition`）决定循环何时停止。它要么是一个被满足的条件，例如“当计数器等于\
  \ 10 时停止”，要么是遇到 `break` 语句时循环可以停止。程序执行将继续进行到最后一个右花括号之后的下一条语句。\n\n![警告](img/warning.png)拥有退出条件是构成循环最重要的部分之一。没有它就会陷入一种称为\
