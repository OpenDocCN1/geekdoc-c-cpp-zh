  \nC 语言的段落级语法涉及代码块（blocks）。这些代码块由一对花括号`{ }`包含一组语句来定义：\n\n```\n{\n    if( money <\
  \ 0 ) getjob();\n    party();\n    sleep(24);\n}\n```\n\n这三个语句构成一个代码块，放在花括号内表示它们属于一起。它们可能是函数的一部分、循环的一部分或类似结构。无论如何，它们都组合在一起并按顺序执行。\n\
  \n你会注意到区块内的每个语句缩进了一个制表位(distance)。这是 C 语言的传统习惯但不是必需的。\"空白\"一词用于指代源码中的制表符(tabs)、空行以及其他无字符区域(source\
  \ code parts)。\n\n通常,C 编译器会忽略空白源文字而寻找分号和圆括弧进行解析 。例如你可以编辑下面的 Listing_**2-1**的版本\n\
  \n```\n#include <stdio.h>\nint main(){puts(\"Greetings, human.\");return 0;}\n```\n\
