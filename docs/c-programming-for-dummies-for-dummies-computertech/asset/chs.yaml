  \n## 批量生成随机数\n\n`rand()`函数是 C 语言最简单的随机数函数。它需要包含 `<stdlib.h>`头文件，并返回一个据称随机的 int 值。清单\
  \ 11-8 展示了示例代码。\n\n**清单 11-8：这才是真·乱码**\n\n```\n#include <stdio.h>\n#include <stdlib.h>\n\
  \nint main()\n{\n    int r,a,b;\n    puts(\"100 个乱序数字\");\n    for(a=0;a<20;a++)\n\
  \    {\n        for(b=0;b<5;b++)\n        {\n            r=rand();\n           \
  \ printf(\"%d\\t\",r);\n        }\n        putchar('\\n');\n    }\n return(0);\n\
  }\n```\n\n[清单 12-x]使用了嵌套循环来连续调用 rand()；这些语句最终 sprintf -style 排列并展示结果 .其中％ d 占位转换符输出整型(int）的值。\n\
