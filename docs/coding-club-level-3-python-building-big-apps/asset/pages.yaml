- pgno: 15
  md: "`random.randint(1, 3)` generates a random number between one and three. The\
    \ `randint()` function is from the random library so it is necessary to use the\
    \ **dot operator** to tell our application where to find it.\n\nMany computer\
    \ languages use the structure:\n\n```\nif: [do something]\nelseif: [do something\
    \ else]\nelse: [do something different again]\n```\n\n`elif` is Python’s version\
    \ of `elseif`. You can have as many `elif` clauses as you wish but they must be\
    \ preceded by an `if` clause and must end with an `else` clause.\n\n# Delving\
    \ Deeper\n\n# Writing less code\n\nCoders love finding ways of performing the\
    \ same task with less code. Hopefully you have found the function in Code Box\
    \ 1.2 easy to understand and follow. It is logical. There is, however, a lot of\
    \ unnecessary code in it because we can simply use **comparative operators** to\
    \ compare two variables and return True if they are the same and False if not.\
    \ Hence the whole function in Code Box 1.2 can be replaced with this:\n\n```\n\
    def is_correct(guess, password):\n    return guess == password\n```\n\nTry it\
    \ out yourself and see that it still works."
