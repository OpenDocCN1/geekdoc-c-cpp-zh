- pgno: 25
  md: 'Constructors have a special bit of code that you will see quite often from
    now on. It looks a little bit frightening at first but it is always the same –
    you will get used to it:


    ```

    ```python

    def __init__(self, name):

    ```

    ```


    It always has the self argument to make sure that everyone understands that this
    method is going to be available to each object built by this class. Next we must
    list the other arguments that we want to pass to the constructor. In the above
    example the other argument needed is name.


    Now let’s pause. You may not have been confused by the __init__ surrounded by
    two underscores on each side of it; you may have noticed that this is actually
    a method because it has def at the beginning and a colon at the end; you may be
    a very clever coder! Most students need a little encouragement at this stage –
    listen to Mr Campbell.


    Now back to work! In this special method called a constructor we have to create
    a self.name variable from name (yes that’s right, so that it is available to the
    object created by this class). We then will use this new variable, self.name,
    in our methods.


    We are adding self. to the front of all the variable names that are going to be
    available to our objects and not simply to the class. This is why we end up with
    a lot of selfs!


    # Delving Deeper


    When we build classes, we write methods that will be available to the objects
    we build (create instances of). In a game of snooker, there may be several balls
    with different locations. Each one has a find_location()


    ![](img/c4403822ba1e00f0a2ce532b3f9d5054_25_0.png)'
  merge: -1
