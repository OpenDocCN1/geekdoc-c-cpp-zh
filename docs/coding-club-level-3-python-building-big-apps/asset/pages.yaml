- pgno: 37
  md: 'The game is made up of:


    +   - two bats

    +   - a table with a net and a score board

    +   - a ball

    +   - two players.


    We now have to decide how to separate this idea into classes by thinking of the
    objects we require. There are several ways of doing this. Never think there is
    only one correct answer!


    Obviously, we are going to create a Ball class and a Bat class. We will also need
    a file called `main.py` which will control most things. There has to be a Table
    class otherwise this chapter’s title would make no sense! But what should we do
    about the net, the rules and the scoring system?


    The obvious place for the rules will be in `main.py`. The net is very simple and
    though we could build a Net class, it seems a lot of effort when all we need to
    do is draw a dashed line: it can become part of the table. We do not have to program
    everything at once though. We can wait and see how we feel later. This is the
    beauty of object-oriented programming in action!


    That is enough of a strategy to be able to start designing the first version of
    our Table class.'
