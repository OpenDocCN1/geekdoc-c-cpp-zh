- pgno: 9
  md: '# Guess My Password


    The game is going to start by asking the player to guess my password. The app
    then waits for the player’s input, which is stored in a variable. Finally, the
    player’s input will be compared with the computer’s own secret password. If the
    guess is correct the player is congratulated, if not, a random message is supplied
    and then the player is asked to try again.


    As in the previous Coding Club books, you will use IDLE, an example of an IDE.
    You can start by opening IDLE and then choosing New Window from the File menu.
    This gets you into IDLE’s script mode. It is a good idea to now re-arrange the
    windows so that the interactive mode console and new window are next to each other
    and both can be seen at the same time (Figure 1.1).


    ![](img/c4403822ba1e00f0a2ce532b3f9d5054_9_0.png)


    Figure 1.1 A simple IDLE arrangement.'
