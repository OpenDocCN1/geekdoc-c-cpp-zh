- pgno: 21
  md: 'Open a new window in IDLE and type in the code from Code Box 2.1. Save this
    as `cat.py` in your Python folder.


    # Analysis of Code Box 2.1


    The first thing to note is that we use the class keyword and that the class name,
    Cat, starts with a capital. The indented code after the colon belongs to the class.
    Inside the class we have provided two methods. Methods are very similar to functions
    except that they belong to a class.


    Remember, this is like a factory. Now, you will learn how to send it orders to
    build some objects – in this case, some cats!


    # Delving Deeper


    # What is the difference between a method and a function?


    A method is just a special function that we make in a class.


    Computer scientists might get upset with us calling classes ‘factories’ as this
    word has another meaning in advanced OOP. They would prefer us to describe classes
    as templates or blueprints. You will find it a lot easier to think of classes
    as factories though.


    If you think of classes as factories, you can understand that by requiring a method
    to have self as an argument, you tell the computer that the method will be available
    to each of the objects made by the factory.'
  merge: -1
  img_proc: true
