- pgno: 53
  md: '# # Adding a ball


    In this chapter we will add a ball to our game (Figure 4.1). First we must design
    a Ball class and then add it to our table object. The ball is to be a simple circle
    which moves around the screen bouncing off four walls. We would like to create
    a class that can be re-used in other games.


    ![](img/c4403822ba1e00f0a2ce532b3f9d5054_53_0.png)


    Figure 4.1 The ball in MyPong.


    First we need to see how Python draws and positions circles (Figure 4.2):


    ![](img/c4403822ba1e00f0a2ce532b3f9d5054_53_1.png)


    Figure 4.2 Drawing a circle.


    The circle is drawn in a square with its position on the table determined by the
    x and y coordinates of the top left corner of this square. So to build a circle
    we provide code like this:


    ```

    ```python

    self.canvas.create_oval(x1, y1, x2, y2, fill="red")

    ```

    ```


    The ball will move and this is controlled by its speed along the x-axis and its
    speed along the y-axis. If they are both positive and equal, the ball will move
    down and to the right, diagonally.


    Now let’s start our Ball class plan.'
