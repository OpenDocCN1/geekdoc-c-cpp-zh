- pgno: 84
  md: "# # Delving Deeper\n\n# ## The function design process\n\nThe collision detection\
    \ could be a simple affair if we decided to detect if the ball had reached the\
    \ leading edge of the two bats. But what if we want to have horizontal bats, or\
    \ perhaps put them in the centre of the screen and have the ball bounce off all\
    \ sides? To make the Bat class more useful, we are going to add this full functionality.\
    \ So with a sketch like the one on page 82 and a book to represent a bat and ball\
    \ colliding, the designer sets about working this out.\n\nAll the variables typed\
    \ here will be used eventually:\n\n+   - `collision_direction`  \n+     will store\
    \ which edge of the bat was collided with (\"N\", \"S\", \"E\" or \"W\").\n+ \
    \  - `collision`  \n+     is a boolean variable which will be set to `True` if\
    \ a collision has been detected.\n+   - `feel`  \n+     is a constant that we\
    \ can use to adjust the sensitivity of the angle the ball bounces off the bat\
    \ later.\n\n# ## Hitting the ball\n\nIf all is well, you can delete `print(\"\
    collision\")` from your new function. Now just as in the case of the ball hitting\
    \ the table wall, all that needs to happen is we reverse the sign of the ball’s\
    \ x or y-speed. However, we have to know which wall it hit first. This is what\
    \ the code in Code Box 5.5 does. You can add it now and think about how it works\
    \ as you type."
  merge: -1
  img_proc: true
- pgno: 85
  md: "# Code Box 5.5 — `bat.py`\n\n```\n```python\nif((bottom_b > top) and (top_b\
    \ < bottom) and (right_b > left) and (left_b < right)):\n    collision = True\n\
    if(collision):\n    if((top_b > top-r) and (bottom_b < bottom+r) and (right_b\
    \ > right) and (left_b <= right)):\n        collision_direction = \"E\"\n    \
    \    ball.x_speed = abs(ball.x_speed)\n\n    elif((left_b > left-r) and (right_b\
    \ < right+r) and (bottom_b > bottom) and (top_b <= bottom)):\n        collision_direction\
    \ = \"S\"\n        ball.y_speed = abs(ball.y_speed)\n\n    elif((left_b > left-r)\
    \ and (right_b < right+r) and (top_b < top) and (bottom_b >= top)):\n        collision_direction\
    \ = \"N\"\n        ball.y_speed = -abs(ball.y_speed)\n\n    elif((top_b > top-r)\
    \ and (bottom_b < bottom+r) and (left_b <= left) and (right_b >= left)):\n   \
    \     collision_direction = \"W\"\n        ball.x_speed = -abs(ball.x_speed)\n\
    \n    else:\n        collision_direction = \"miss\"\n\n    return (collision,\
    \ collision_direction)\n```\n```"
  merge: -1
  img_proc: true
