- pgno: 28
  md: '# # Designing classes


    ![](img/c4403822ba1e00f0a2ce532b3f9d5054_28_0.png)


    This section introduces another simple example where you will get to practise
    what you have learned and you will start to learn how to design a class. You are
    going to build a lift and a lift operator.


    Below is one way to make a class for a lift. There are many properties a lift
    can have, but in terms of a program there are very few essentials.


    The only essential feature of a lift is which floor it is on. Instead of ‘essential
    feature’ we could call this a property or characteristic. In programming we call
    these characteristics **attributes** (or sometimes **parameters**) and we initialise
    them in the constructor.


    > > We call lifts elevators in the USA.


    | Class Name | **Lift** |

    | --- | --- |

    | Attributes | *current floor* |

    | Methods | *get floor*<br>*move to floor* |


    ![](img/c4403822ba1e00f0a2ce532b3f9d5054_28_1.png)


    Class design sheet 2.1 A lift class.'
  merge: -1
  img_proc: true
- pgno: 29
  md: "We might also want to know how many passengers it can hold, or its velocity\
    \ – but this lift is going to be very simple. To plan a lift class we can use\
    \ a class design sheet. You will find a blank one in the Appendix at the end of\
    \ this book and also on the companion website – so you can print out your own\
    \ should you wish. The design work goes into the class design sheet. From this\
    \ we can build our class.\n\nTwo methods are essential: one that finds out what\
    \ floor the lift is on and another to move the lift to a new floor. Now let’s\
    \ see how this gets turned into code:\n\n![](img/c4403822ba1e00f0a2ce532b3f9d5054_29_0.png)\n\
    \n```\n```python\n# lift.py provides a Lift Class\n\nclass Lift:\n    # constructor:\n\
    \    def __init__(self, current_floor=0):\n        self.current_floor = current_floor\n\
    \n    def get_floor(self):\n        return self.current_floor\n\n    def move_to_floor(self,\
    \ floor_number):\n        self.current_floor = floor_number\n```\n```"
