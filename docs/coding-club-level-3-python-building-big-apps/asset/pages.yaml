- pgno: 100
  md: "# Code Box 6.8\n\n```\n```python\n# extra tool for adding the score to the\
    \ canvas:\ndef draw_score(self, left, right):\n    scores = str(right) + \" \"\
    \ + str(left)\n    self.canvas.itemconfigure(self.scoreboard, text=scores)\n```\n\
    ```\n\nNow that you are an experienced coder, you should find that you can understand\
    \ quite a lot here. Remember that our table object is built with a canvas ordered\
    \ from the tkinter library and as such has the canvas methods available to it.\
    \ The itemconfigure() method has been used before but now you can see how it works\
    \ with text. The default values place the text at the top of the canvas and centre\
    \ it, which is ideal. We simply have to pass it a string to use for the scoreboard.\
    \ However, the itemconfigure() method expects strings not integers so we change\
    \ the integers into strings with the Python str() method and build these into\
    \ one string first.\n\n# Delving Deeper\n\n# Casting and concatenating\n\nYou\
    \ know that variables can keep references to text and numbers etc. These are called\
    \ data-types in computer science. The ones you are most familiar with are strings\
    \ and integers, but there are several others.\n\nIn many languages you must declare\
    \ what type of data a variable is referring to when it is made. This is not necessary\
    \ in Python; however, it is not possible to suddenly use an integer as a string.\
    \ It must be changed by casting.\n\nWe cast integers into strings with the str()\
    \ function. Numbers that are stored as strings can be converted into integers\
    \ with the int() function.\n\nWhen we join strings together to make one string,\
    \ this is called concatenating, as we have done with scores."
