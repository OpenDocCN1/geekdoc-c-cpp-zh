- pgno: 66
  md: "Do feel free to skip to the Challenges section at the end of the chapter if\
    \ you are feeling a bit worn out. You will still understand enough to mess around\
    \ with the code and complete the challenges.\n\nTo follow this explanation it\
    \ is best to call up `ball.py` in IDLE so you have the code in front of you. The\
    \ `move_next` method has the job of moving the ball to its next position. In `main.py`\
    \ we call it every 50 milliseconds.\n\nFirst we add the x_speed to the x_posn\
    \ of our ball and then do the same for the y_posn. The x_speed and y_speed are\
    \ integers. They are the number of pixels to move the ball each ‘tick’ of the\
    \ animation. If there are no collisions, this is all that is required to move\
    \ the ball in a straight line:\n\n```\nself.x_posn = self.x_posn + self.x_speed\n\
    self.y_posn = self.y_posn + self.y_speed\n```\n\nWe then need a number of tests\
    \ to see if the ball has hit any of the walls of our canvas object. The ball’s\
    \ x_posn is the top-left coordinate of its bounding box and therefore also the\
    \ left edge of the circle. So, in the first test we look to see if x_posn is less\
    \ than three pixels from the left wall of the canvas (see the next Delving Deeper\
    \ to see why we use 3 pixels). If it is, then the x_speed’s sign is reversed.\
    \ A positive x_speed sends the ball to the right, while a negative x_speed sends\
    \ the ball to the left. So the speed in this case will have been negative and\
    \ we are making it positive. That is all that is necessary to bounce the ball.\n\
    \n```\nif(self.x_posn <= 3):   # if hits the left wall\n    self.x_posn = 3\n\
    \    self.x_speed = -self.x_speed\n```\n\n> “The move_next() method is not all\
    \ that bad. If you have the code in front of you while you read the explanation\
    \ I am sure you’ll get it.”\n\n![](img/c4403822ba1e00f0a2ce532b3f9d5054_66_0.png)"
  merge: -1
  img_proc: true
- pgno: 67
  md: 'The right hand wall is detected and handled in the same way, but detecting
    the right wall requires us to know the width of the canvas and compare it with
    3 pixels less than the right edge of the ball – that is the ball’s x_pos again
    plus the ball’s width.


    The last two if statements test for hitting the bottom and top of the canvas and
    then reverse the y_speed.


    Finally, we take the results of these tests, compile them into a set of new coordinates
    and pass them to the move_item() method in our table object – found in the Table
    class:


    ```

    self.table.move_item(self.circle, x1, y1, x2, y2)

    ```


    We have already updated all of the ball’s attributes but nothing will appear to
    happen until we update the position of the circle that represents our ball. This
    is why we pass self.circle rather than just self to the move_item() method.


    # Delving Deeper


    # Why all the threes?


    Have you noticed that there are quite a few number threes in this code? Without
    the threes, the ball does not appear to bounce naturally. Real balls do not turn
    around as soon as they hit a wall without being squashed. The threes have been
    added to make this look realistic. The code now does not bounce the ball until
    it is going to be 3 pixels beyond the wall. Changing the shape of the ball is
    unnecessarily difficult, but the 3 pixels trick creates the correct illusion.


    The 3 pixels trick has been chosen by experimentation, until it looks right. Experimentation
    sounds so much better than ‘trial and error’ don’t you think?'
  merge: -1
  img_proc: true
