    What about displaying the score? There are many ways of doing this. One that is
    often used successfully is simply to write the score on the canvas. This is what
    we shall do. As such, it makes sense to improve our Table class and give it the
    ability to not only draw a ball and bats on it but to be able to draw the score
    as well.


    We are now going to initialise two more variables in the constructor. We will
    refer to the players as the left player and the right player as these are the
    places where their bats will be, the score on the screen will be and the control
    keys on the keyboard will be. First we add variables to hold our chosen font and
    a canvas text widget to the constructor, where there is a space waiting. Open
    `table.py` from the `pong-score-start` folder and add the code from Code Box 6.7
    where required.


