- pgno: 43
  md: "# # Delving Deeper\n\n# ## When to use self and when it is unnecessary\n\n\
    When we build a class such as a Table class, we need to pass it any attributes\
    \ it is going to require to build its table objects. For example, the table is\
    \ going to go in a window object – so we need to pass the window to it as an argument.\n\
    \nIf on the other hand we are going to pass the Table class an attribute, such\
    \ as width, which we might want other classes or files to query (e.g. Table, how\
    \ wide are you?) then we need to declare it in the constructor as an object variable\
    \ with self. Then, the classes or files could ask the table object how wide it\
    \ is.\n\nThe next thing we have to do is call canvas’ pack() method. It does not\
    \ require any arguments:\n\n```\n```python\nself.canvas.pack()\n```\n```\n\nThe\
    \ pack() method is required to make our table visible while performing other tasks.\
    \ Next we can use canvas’ create_line() method to draw a net. This takes the following\
    \ form:\n\n```\n```python\nself.canvas.create_line([top x-coord], [top y-coord],\
    \ [bottom x-coord],\n                         [bottom y-coord], width=2, fill=net_colour,\
    \ dash=(15, 23))\n```\n```\n\nThe width is in pixels so we want a line that is\
    \ two pixels thick.\n\nThe fill is the colour of the line – we have a variable\
    \ ready for that.\n\nThe dash attribute takes two numbers – the length of the\
    \ dash and the spacing, also in pixels."
  merge: -1
  img_proc: true
- pgno: 44
  md: 'To understand the coordinates, it helps to know that unlike in maths and science
    at school, computers often count pixels from the top left corner of the screen
    or window. This is the case in Python. Look at Figure 3.3 to see how this works.


    ![](img/c4403822ba1e00f0a2ce532b3f9d5054_44_0.png)


    **Figure 3.3** Coordinates.


    So the call to implement the `create_line()` method, could be written as:


    ```

    ```python

    self.canvas.create_line(300, 0, 300, 400, width=2, fill=net_colour, dash=(15,
    23))

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'This is not, however, a good way of doing it as we are trying to build a Table
    class. A factory that can only build one type of table is not much use. What if
    we wanted a longer table? The net would be too far to the left. A taller table
    would have a net that did not reach the bottom! But we have variables that hold
    the width and height properties of the table object, so we can calculate the coordinates
    from these in the method. Then the net will always be in the correct place:


    For a vertical net:


    +   - [top x-coord] becomes self.width/2

    +   - [top y-coord] becomes 0

    +   - [bottom x-coord] becomes self.width/2

    +   - [bottom y-coord] becomes self.height


    For a horizontal net:


    +   - [left x-coord] becomes 0

    +   - [left y-coord] becomes self.height/2

    +   - [right x-coord] becomes self.width

    +   - [right y-coord] becomes self.height/2'
  merge: -1
  img_proc: true
