  md: '# # Bonus chapter

    ## Two more games


    This chapter demonstrates the benefits of building classes well. It has taken
    four chapters to build MyPong. In this chapter we will build a quick breakout
    game and an invaders game – all without altering anything except `main.py`. Again,
    you can work on the start files provided on the website.


    Each book in the *Coding Club* series tries to supply at least one bonus project.
    The purpose of these is to provide some code that does not have any explanations.
    It is an important skill for coders to develop – to be able to look at other people’s
    code and try to work out what is going on. Although you might not understand everything,
    you are sure to learn something!


    In this chapter you are going to:


    +   - see how useful lists are for storing items in games and to keep track of
    them

    +   - see how to add many bricks at once using a loop

    +   - see how flexible your Ball, Bat and Table classes are

    +   - finish the book with two new games that can be further customised to make
    them more polished.


