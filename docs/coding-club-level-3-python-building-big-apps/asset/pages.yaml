- pgno: 122
  md: '# PiFace


    If you have a Raspberry Pi you may want to try your hand at physical computing.
    One way of doing this is to purchase a PiFace from Manchester University which
    can be programmed directly in Python. It will enable you to use your computer
    to control all sorts of things by interfacing with a select set or a talking chicken,
    for instance.


    http://pi.cs.man.ac.uk/


    # Non-Python stuff


    # Arduino


    This is an alternative to the PiFace for physical computing. It works with any
    type of computer rather than just a Raspberry Pi. The language used is C but you
    will find that to sense and control uses far less complicated code than we have
    been using in this book, so it will not take you very long to get used to it.


    http://www.arduino.cc


    # GameMaker


    This has been popular in some schools for a number of years. It uses a drag-and-drop
    system for building games. After a while though, this becomes limiting. At this
    point you can add your own code or download others. Now you will be in a position
    to understand the code and design your own.


    http://www.yoyogames.com/'
  merge: -1
