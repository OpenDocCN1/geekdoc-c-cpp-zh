- pgno: 121
  md: '# # Taking things further


    When you have finished this book your adventure really begins! You might want
    to develop your own projects now in Python. Should you be interested, you are
    now in a good position to start a new language. You will find that all you need
    to do is look up the syntax used in the new language to indicate loops or classes
    etc. You will find there are a lot of similarities in, for example, PHP, Java
    and the C family of languages. Alternatively, you might want to delve into some
    other tools and libraries that add functionality to Python. Here are some starting
    points:


    # ## The Python stuff


    # ### Coding Club books


    This is the first Level 3 book in the series but you may still find things to
    interest you in any of the other project books at lower levels.


    http://www.codingclub.co.uk


    # ### PyGame


    This popular library currently works best using Python 2 rather than 3 but there
    is not too much difference. The library makes extensive use of classes in its
    game implementation.


    http://www.pygame.org/'
