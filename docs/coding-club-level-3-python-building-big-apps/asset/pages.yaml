- pgno: 26
  md: "method that refers only to itself, even though it has been built from the same\
    \ class. This is why the methods in our class have `self` passed to them as an\
    \ argument. It is even cleverer than this though.\n\nProgrammatically the objects\
    \ do, in actual fact, refer back to the class code for the method but each object\
    \ keeps track of its own data. It is as if each object has been built with its\
    \ own methods that are specific to it alone. It is as if the methods act independently\
    \ of the other objects built by the same factory. This is just what we would wish\
    \ for when we build objects, and it is all done with one argument -- `self`.\n\
    \nOpen a new window in IDLE and copy the code from Code Box 2.3. Save it as `cat2.py`.\
    \ Compare this with `cat.py` (Code Box 2.1) to see how we use the new variable\
    \ `self.name` created in the constructor. Yes, that is all this constructor code\
    \ has done: it has given you a new variable that you can use! As before, this\
    \ class does not run anything. It is just a factory, but you are about to see\
    \ how useful factories are.\n\n```\n```python\nclass Cat:\n    # constructor:\n\
    \    def __init__(self, name):\n        self.name = name\n\n    def speak(self):\n\
    \        print(self.name, \" says Meow\")\n\n    def drink(self):\n        print(self.name,\
    \ \" drinks some milk.\")\n        print(self.name, \" takes a nap.\")\n```\n\
    ```\n\n![](img/c4403822ba1e00f0a2ce532b3f9d5054_26_0.png)"
