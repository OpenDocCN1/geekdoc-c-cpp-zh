  md: '# # Chapter 2

    ## Objects, classes and factories


    By the end of this chapter you will have the essential knowledge to start our
    big project – writing the MyPong application. This chapter is important for another
    reason – you will be introduced to a particular way of programming called **object-oriented
    programming (OOP)**. This is one way of coping with the complexity of writing
    big programs. You are not going to learn everything there is to know about OOP
    but you will gain a foundation and understand how classes and methods can be built.


    There is far more in this chapter about how to design programs than about actually
    writing them. You have finished working your way through this book, you hopefully
    be starting to think about how to design your own programs rather than just writing
    the ones that are suggested. The bonus chapter illustrates how well-designed code
    can quickly be adapted to make new applications.


    In this chapter you are going to:


    +   - learn how to design classes

    +   - learn how to make objects from classes

    +   - start to build your own module

    +   - learn how to design larger programs one bit at a time.


    ![](img/c4403822ba1e00f0a2ce532b3f9d5054_18_0.png)'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# # Big programs


    If we sat down and wanted to build ourselves a car (a real one, as in Figure 2.1)
    we might not even know where to start. How about starting with the engine? An
    engine manufacturer does not need to know anything about wheels or windscreen
    wipers or how to make seats – the engine manufacturer makes engines. A car manufacturer
    does not need to know how an engine is made; they just need to know how to attach
    a car to it. A car builder can also get a wheel from one company and a tyre from
    another company – as long as they fit.


    ![](img/c4403822ba1e00f0a2ce532b3f9d5054_19_0.png)


    Figure 2.1 McLaren 12C – a very pretty car!


    A complex computer program, such as an email application or a video game, can
    also be very difficult to build because it is also made of many parts. However,
    just like the car, large applications do not have to be built all at once. The
    latest video games are often made up of millions of lines of code. If they were
    built as one program, can you imagine how hard it would be to find a typing mistake?
    And believe me, everyone makes typing mistakes. The way this problem is avoided
    is by building little bits at a time.


    There are several ways to do this. One of these is to use OOP, which builds programs
    out of coded objects! The great thing about this is that if you build the **objects**
    in the correct'
  merge: -1
  img_proc: true
- pgno: 20
  md: "way, you can make libraries of these objects. These objects can be re-used\
    \ again in other applications. You can of course do a lot of this with functions\
    \ but learning about objects and classes will help you better understand other\
    \ people's code. The popular PyGame library and tkinter both use classes.\n\n\
    # Classes\n\nOur first task is to look at a problem and work out how it can be\
    \ separated into smaller tasks and objects. You have just learned that we build\
    \ libraries of objects. This is not entirely true. We build libraries of classes.\
    \ A class is better than an object, because it can act as a factory for making\
    \ objects.\n\nInstead of explaining with a complex situation, let’s take something\
    \ very simple – a cat.\n\nThere are many ways to build a Cat class. Here is one:\n\
    \n```\n```python\nclass Cat:\n    def speak(self):\n        print(\"Meow!\")\n\
    \n    def drink(self):\n        print(\"The cat drinks its milk.\")\n        print(\"\
    The cat takes a nap.\")\n```\n```\n\n![](img/c4403822ba1e00f0a2ce532b3f9d5054_20_0.png)"
