- pgno: 108
  md: '# MyBreakout


    The first game is a very simple game where the goal is to use a ball to clear
    a load of bricks by hitting them with the ball (Figure 7.1). The player has a
    bat to rebound the ball and the ball must not get past it to the bottom of the
    window.


    ![](img/c4403822ba1e00f0a2ce532b3f9d5054_108_0.png)


    Figure 7.1 MyBreakout.


    To build the game, we order a bat from the Bat factory and it is placed at the
    bottom of the screen. We order a ball from the ball factory. Everything is placed
    on a table which we order from the Table factory.


    The bricks to get rid of are simply more bats from the Bat factory. We do not
    add any movement or control to these. Instead, after detecting a collision we
    destroy them. The code is not too difficult. It can be found in Code Box 7.1.


    > It is probably time to start using the language of professional coders. We should
    say: we make a bat instance from the Bat class which is placed at the bottom of
    our table object. We also make a ball instance from the Ball class and then instantiate
    several bricks from the Bat class.'
