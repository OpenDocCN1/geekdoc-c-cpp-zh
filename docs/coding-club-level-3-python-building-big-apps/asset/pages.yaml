  md: '# # Glossary and index


    +   - **argument** — a piece of information that is required by a function, a
    method or a class so that it can perform its task; this is usually a `string`
    or `number`, for example, `my_function(arguments go here)`. — 11


    +   - **attributes** — the properties of an object such as width, height, colour,
    etc. — 27


    +   - **boolean variable** — a variable that holds only two values – `True` or
    `False` — 11


    +   - **bug** — a piece of code that is causing a program to fail to run properly
    or at all — 48


    +   - **casting** — the process of converting one data-type into another; for
    example, sometimes a number may be stored as text but need to be converted in
    to an integer; this can be done like this: `int ("3")` — 99


    +   - **classes** — in object-oriented programming, classes are sections of code
    that objects are built from; in this book they are compared to factories although
    it is more common to describe them as templates or blueprints — 19


    +   - **comments** — some text in a computer program that is for the human reader
    and is ignored by the computer when running the program; in python all comments
    begin with a hash symbol `#` — 9'
  merge: -1
  img_proc: true
- pgno: 128
  md: '**comparative operators** sometimes called logic operators, they allow us to
    compare data in a program; they include `==` and `>`


    **concatenating** the joining of two strings into one string


    **constant** a number that does not change; it is good practice to name constants
    in capitals e.g. `SPEED_OF_LIGHT`


    **constructor** a special kind of method that is called when an instance of a
    class is created; it is constructed with the Python keyword `__init__`; one of
    its purposes is to initialise an object’s attributes


    **data-types** different types of information stored by the computer, for example
    floats, integers, strings, tuples, lists and dictionaries


    **debugging** the process of finding bugs in a program


    **default value** a value given to an argument or variable as a starting point


    **dot operator** a dot is used in coding to link a method or function with its
    class or module e.g. in `math.random(1, 6)` the dot tells the computer that the
    random function is found in the math module


    **equals operator** the equals sign is used to assign a value to a variable in
    coding, for example `n=2` assigns the value 2 to the variable `n`'
