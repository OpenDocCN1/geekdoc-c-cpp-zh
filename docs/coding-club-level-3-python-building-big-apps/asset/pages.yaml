- pgno: 64
  md: 'To turn this into a game we will need to add a few functions. Because `main.py`
    is not a class, it will have functions rather than methods. First, we need a function
    that animates the ball. `game_flow()` will grow more complex in the next two chapters
    but for now it calls `my_ball`''s `move_next()` method and then creates an animation
    loop using the `window.after()` method:


    ```

    window.after(50, game_flow)

    ```


    The first argument selects a 50 millisecond wait, and the second argument gives
    the function to be called after that wait. The `after()` function has been designed
    to add an event to the `mainloop()`. In our code, `after()` calls its containing
    function; therefore, it effectively produces an **infinite loop** where the `my_ball.move_next()`
    function is called every 50 milliseconds.


    Before we call the `mainloop()` method at the end of `main.py`, we need to add
    one more line of code to call our new function into action: `game_flow()`. Finished!


    # Delving Deeper


    # Global or local?


    A variable that is created in a function or method is said to be a **local variable**.
    These variables exist inside the function but are not available to be called or
    used in the rest of our programs. They can even have the same names as variables
    in other functions or methods, although this is not a good idea. A **global variable**
    is often declared at the beginning of our code. We want access to their values
    at all times. Sometimes we might want to use a global variable inside a method
    or function. This is fine if we only want to read the value of the


    > *continues on the next page*'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'variable. If the method or function needs to change the global variable’s value,
    then it must be re-declared inside the function, with the keyword `global` in
    front.


    If the keyword `global` is omitted, a new local variable with the same name is
    created. If we do not declare it inside the function at all, then we will get
    a ‘local variable referenced before assignment’ error when the function tries
    to change its value! In other words, the computer does not recognise it as the
    global variable we intended, and tells us that we are trying to access a non-existent
    local variable.


    # Testing and debugging


    We are now in a position where we can test our Ball class. First make sure your
    three files are saved. In IDLE run the `main.py` file. If all is well you should
    be presented with a table with a net and a red ball that bounces off the walls!


    If there are any errors, try to sort them out and take particular notice of which
    file the error has occurred in. It can be quite tricky sometimes with several
    files so if you have tried a few times and are not getting anywhere, use the files
    from the companion website. These can be found in the `pong-ball-final` folder
    in the Chapter 4 folder. It is a good learning experience to carefully compare
    your file with the working one. All those days playing spot-the-difference when
    you were younger will truly pay off now. It is good to notice what errors creep
    into your code so that you can try to avoid them in the future.


    # The move_next() method


    Earlier it was stated that we would come back and explain the `move_next()` method
    in `ball.py` – well here is the explanation!'
