  md: '# Analysis of Code Box 5.5


    As well as there being some complicated tests, there are a couple of other things
    to point out.


    abs( ) is a Python function that removes the sign from a number variable. Therefore,
    both −1.5 and 1.5 become 1.5. It enables us to get the value of the speed without
    the positive or negative sign.


    This function now alters the ball’s bounce direction depending on which part of
    the bat the ball collides with. It does more than this though; it stores which
    side of the bat the collision occurred at. Whilst there has been a collision.
    These two extra bits of information are returned by the function in the last line
    as a two item tuple. We are not going to make use of this currently, but again
    it makes this a much more useful class: we can also now test for collisions and
    find out which wall has been hit by selecting which part of the tuple we require,
    using its index:


    ```

    ```python

    bat_hits_ball=bat_L.detect_collision(my_ball)

    print(bat_hits_ball[0]) --> True

    ```

    ```


    or


    ```

    ```python

    bat_hits_ball=bat_L.detect_collision(my_ball)

    print(bat_hits_ball[1]) --> N

    ```

    ```


    or simply


    ```

    ```python

    bat_hits_ball=bat_L.detect_collision(my_ball)

    print(bat_hits_ball) --> (True, N)

    ```

    ```'
