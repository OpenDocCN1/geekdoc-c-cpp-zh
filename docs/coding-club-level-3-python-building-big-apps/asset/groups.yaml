    \n本节将介绍另一个简单的示例，你将有机会练习所学的内容，并开始学习如何设计一个类。你将构建一个电梯和一个电梯操作员。\n\n下面是构建电梯类的一种方法。电梯可以有很多属性，但就程序而言，真正必不可少的属性少之又少。\n\
    \n电梯唯一必不可少的属性是它当前所在楼层。我们也可以不叫“必不可少的属性”，而称之为“特性”或“特征”。在编程中，我们称这些特征为**属性**（有时也称为**参数**），并在构造函数中对它们进行初始化。\n\
