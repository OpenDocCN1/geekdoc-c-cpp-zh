    \ tkinter method call.\n\n## The Table class constructor\n\nOur constructor needs\
    \ to be passed an argument for each of the attributes that we want to be selectable\
    \ when ordering a new object. Then we will assign them to all the `self.variables`,\
    \ as we have done before.\n\nOpen `table.py` from the `pong-table-start` folder.\
    \ This file can be found in the Chapter 3 folder. Open this with IDLE and add\
    \ the missing code from Code Box 3.1. Add your code to the file shown in the header\
    \ bar of the Code Box.\n\nCan you see how this matches the first part of our plan?\n\
    \n### Code Box 3.1 — `table.py`\n\n```python\n# This class defines a Table that\
    \ is a 2D rectangle that is a play area.\n\nfrom tkinter import *\n\nclass Table:\n\
    \    #### constructor\n    def __init__(self, window, colour='black', net_colour='green',\n\
    \                 width=600, height=400,\n                 vertical_net=False,\
    \ horizontal_net=False):\n        self.width = width\n        self.height = height\n\
    \        self.colour = colour\n```\n\nClasses built like this are very much like\
    \ factories. In main.py we will be able to quickly manufacture a table with code\
    \ such as this:\n\n`my_table = table.Table(window)`\n\nBecause of all the default\
    \ values we have supplied in the constructor’s `__init__` line, the only argument\
    \ required will be window. The class will make a table object that is just like\
    \ the one we want, with one exception.\n\n> I never realised that the British\
    \ spelt colour with a ‘u’.\n\n![](img/c4403822ba1e00f0a2ce532b3f9d5054_40_0.png)\n\
    \n### Quick Quiz 3.1\n\nLook back at the `__init__` line in Code Box 3.1 and the\
    \ diagram of the required table on the Table class planning page. What will the\
    \ difference be between the table we get and the one we want?\n\nBuilding classes\
    \ in this way means we can build a variety of tables in the future using one line\
    \ of code. The Table class becomes a very useful little factory (Figure 3.2).\
    \ Do you want a red table with a horizontal net that is 300 pixels by 300 pixels?\
    \ Just ask:\n\n```python\nmy_table = table.Table(window, horizontal_net=True,\
    \ width=300, height=300, colour='red')\n```\n\n![](img/c4403822ba1e00f0a2ce532b3f9d5054_41_0.png)\n\
    \nFigure 3.2 Some table objects.\n\n### Quick Quiz 3.2\n\nWhat would the code\
    \ be to make a blue table object with a vertical red net, which is 600 pixels\
    \ wide by 400 pixels tall?\n\n## More tkinter tools\n\nThe constructor method\
    \ is not quite finished as we have not told it to actually build the table or\
    \ the net yet. We will leave the drawing of the window for main.py (which will\
    \ be written very soon). To build our table we have to use some tkinter code which\
    \ we might have to find by looking up the instructions on the tkinter website.\
    \ This is quite a large library and you do not need to worry about doing this\
    \ yourself as it has been done for you. Feel free to look if you are interested.\
    \ At the time of writing, instructions could be found here:\n\nhttp://docs.python.org/py3k/library/tk.html\n\
    \nFirst we are required to make the canvas, which is coded like this:\n\n```python\n\
    self.canvas = Canvas(window, bg=self.colour, height=self.height, width=self.width)\n\
    ```\n\nThe Canvas class is a tkinter factory that requires the arguments for a\
    \ window, background colour, height and width – all of which we have variables\
    \ of in the first part of our constructor.\n\n## Delving Deeper\n\n### When to\
    \ use self and when it is unnecessary\n\nWhen we build a class such as a Table\
    \ class, we need to pass it any attributes it is going to require to build its\
    \ table objects. For example, the table is going to go in a window object – so\
    \ we need to pass the window to it as an argument.\n\nIf on the other hand we\
    \ are going to pass the Table class an attribute, such as width, which we might\
    \ want other classes or files to query (e.g. Table, how wide are you?) then we\
    \ need to declare it in the constructor as an object variable with self. Then,\
    \ the classes or files could ask the table object how wide it is.\n\nThe next\
    \ thing we have to do is call canvas’ pack() method. It does not require any arguments:\n\
    \n```python\nself.canvas.pack()\n```\n\nThe pack() method is required to make\
    \ our table visible while performing other tasks. Next we can use canvas’ create_line()\
    \ method to draw a net. This takes the following form:\n\n```python\nself.canvas.create_line([top\
    \ x-coord], [top y-coord], [bottom x-coord],\n                         [bottom\
    \ y-coord], width=2, fill=net_colour, dash=(15, 23))\n```\n\nThe width is in pixels\
    \ so we want a line that is two pixels thick.\n\nThe fill is the colour of the\
    \ line – we have a variable ready for that.\n\nThe dash attribute takes two numbers\
    \ – the length of the dash and the spacing, also in pixels.\n\nTo understand the\
    \ coordinates, it helps to know that unlike in maths and science at school, computers\
    \ often count pixels from the top left corner of the screen or window. This is\
    \ the case in Python. Look at Figure 3.3 to see how this works.\n\n![](img/c4403822ba1e00f0a2ce532b3f9d5054_44_0.png)\n\
    \n**Figure 3.3** Coordinates.\n\nSo the call to implement the `create_line()`\
    \ method, could be written as:\n\n```python\nself.canvas.create_line(300, 0, 300,\
    \ 400, width=2, fill=net_colour, dash=(15, 23))\n```\n\nThis is not, however,\
    \ a good way of doing it as we are trying to build a Table class. A factory that\
    \ can only build one type of table is not much use. What if we wanted a longer\
    \ table? The net would be too far to the left. A taller table would have a net\
    \ that did not reach the bottom! But we have variables that hold the width and\
    \ height properties of the table object, so we can calculate the coordinates from\
    \ these in the method. Then the net will always be in the correct place:\n\nFor\
    \ a vertical net:\n\n- [top x-coord] becomes self.width/2\n- [top y-coord] becomes\
    \ 0\n- [bottom x-coord] becomes self.width/2\n- [bottom y-coord] becomes self.height\n\
    \nFor a horizontal net:\n\n- [left x-coord] becomes 0\n- [left y-coord] becomes\
    \ self.height/2\n- [right x-coord] becomes self.width\n- [right y-coord] becomes\
    \ self.height/2\n\nYou can now add the extra code in Code Box 3.2 to your copy\
    \ of `table.py`. Use the comments in the supplied file to guide you as to where\
    \ to add the new code.\n\n### Code Box 3.2\n\n```python\n# order a canvas to draw\
    \ on from the tkinter factory:\nself.canvas = Canvas(window, bg=self.colour, height=self.height,\
    \ width=self.width)\nself.canvas.pack()\n\n# add a net to the canvas using a method\
    \ from the tkinter factory:\nif(vertical_net):\n    self.canvas.create_line(self.width/2,\
    \ 0, self.width/2,\n                            self.height, width=2, fill=net_colour,\
    \ dash=(15, 23))\nif(horizontal_net):\n    self.canvas.create_line(0, self.height/2,\
    \ self.width,\n                            self.height/2, width=2, fill=net_colour,\
    \ dash=(15, 23))\n```\n\n### Warning!\n\nIt is easy to make a typing mistake at\
    \ some stage. Check your code carefully and when you complete it, run the program\
    \ and see if you can find and correct any problems. If you have any difficulties\
    \ and start to get frustrated, then the complete file is available from the companion\
    \ website. After all, coding should be fun. Before using the complete files, please\
    \ do try to type the code in yourself and think about how each line of code works\
    \ as you type. You will learn to code better if you do this. (This phrase appears\
    \ to be in an infinite loop!)\n"
