    \ Python 的 random 模块\n- 如何使用 IDLE 的脚本模式来编写和保存你自己的程序。\n\n由于这是一章复习内容，如果你愿意，现在可以随意使用这个应用程序。如果你觉得需要一些练习，可以尝试下面的想法。\n\
    \n### 想法 1\n\n修改所有变量，使它们更有帮助一些，并给出一个提示。（提示：“仔细阅读问题”会是一个很好的提示。）\n\n### 想法 2\n\n\
    让这个应用程序更有用一点，让玩家能够对“你放弃了吗？”回答“是”。这需要一条单独的消息（也许是 response5？），在玩家猜了三次之后触发。（提示：在\
    \ while 循环中设置一个计数器变量。）最后，如果玩家放弃了，告诉他们密码。\n\n本书的答案和所有源代码可以从配套网站 www.codingclub.co.uk\
    \ 下载。（解决这些问题的方法有很多种，）其中一个答案在 Answers 文件的 Chapter 1 文件夹中，名为 Ch1-Idea2.py。\n\n![](img/c4403822ba1e00f0a2ce532b3f9d5054_17_0.png)\n\
    \n## 第 2 章\n\n### 对象、类和工厂\n\n到本章结束时，你将掌握启动我们大型项目——编写 MyPong 应用程序——所需的基本知识。本章之所以重要还有另一个原因：你将接触到一种特定的编程方式，称为**面向对象编程（OOP）**。这是应对编写大型程序复杂性的一种方法。你不会学到关于\
    \ OOP 的所有知识，但你会奠定基础，并理解如何构建类和对象方法。\n\n本章关于如何设计程序的内容远多于实际编写程序的内容。当你完成本书的阅读后，希望你开始思考如何设计自己的程序，而不仅仅是编写书中建议的程序。补充章节演示了设计良好的代码如何能够快速改编以创建新的应用程序。\n\
