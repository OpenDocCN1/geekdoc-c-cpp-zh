    \n如果你把类想象成工厂，你就能理解：通过要求方法将 self 作为参数，你是在告诉计算机，这个方法将可供工厂制造的每个对象使用。\n\n## 模块\n\n\
    通过将诸如 `cat.py` 这样的类文件存储在一个文件夹中，它们就成了一个模块！同一文件夹中的任何其他 Python 文件都可以通过一个简单的 import\
    \ 语句使用它们：\n\n```python\nimport cat\n```\n\nPython 库中还有其他可以使用的特殊模块。你已经这样做过一次了。\n\
    \n> **快速测验 2.1**\n> \n> 你还记得我们之前用过哪个模块吗？\n\n### main.py\n\n到目前为止，我们还不能用 Cat 类做任何事情。你试过运行它吗？不会发生太多事情，对吧？\n\
    \n在 IDLE 中打开一个新窗口，并输入代码框 2.2 中的代码。然后将这个新文件保存为 `main.py`。注意，代码开头导入了 `cat.py`，这使我们的程序可以访问\
    \ Cat 类。你刚刚创建的文件就是你开始运行程序的地方，这就是它被称为 `main.py` 的原因。\n\n> 哇，我们做出了自己的模块。\n> \n>\
    \ 好吧，它里面只有一个类——但这是个开始。\n\n![](img/c4403822ba1e00f0a2ce532b3f9d5054_22_0.png)\n\
    \n### 代码框 2.2\n\n```python\nimport cat\n\n# create an instance of a cat, named\
    \ Romeo\nromeo = cat.Cat()\n\n# play with Romeo\nromeo.speak()\nromeo.drink()\n\
    ```\n\n### 对代码框 2.2 的分析\n\n```python\nromeo = cat.Cat()\n```\n\n这里就是我们向 cat 工厂订购对象的地方。计算机科学家会说：“我们创建了\
    \ Cat 类的一个实例。”他们甚至可能会说，我们实例化了一个 cat 对象。Romeo 就是这个对象，它由 Cat 类创建（因此类名首字母大写）。Cat\
    \ 类位于 `cat.py` 中，因此我们通过点运算符告诉 `main.py` 它在哪里。这个点用于将类与其所在位置关联起来。用非编程语言来说，这一行代码可以翻译为：\n\
    \n> “使用 `cat.py` 文件中的 cat 工厂创建一个名为 Romeo 的对象。”\n\n这样我们就有一只猫了！他叫 Romeo！这一切只用一行代码就完成了。\n\
    \nRomeo 可以使用其工厂——Cat 类——构建的所有方法。要访问这些方法，我们再次使用点运算符调用它们：\n\n```python\nromeo.speak()\
    \  # calls romeo's speak method\nromeo.drink()  # calls romeo's drink method\n\
    ```\n\n如果你还没有和 Romeo 玩过，现在就可以试试！要和 Romeo 玩，你只需保存并运行 `main.py`。它必须与 `cat.py` 在同一个文件夹中。\n\
    \n### 改进 Cat 类\n\n**警告：** 本节中有很多 self！\n\n调用函数时，我们在括号中向它传递参数，如下所示：\n\n```python\n\
    times_tables(12, 12)\n```\n\n这个函数来自*Python 基础*，调用它会打印出 12 的乘法表，直到 12 × 12 = 144。对象也可以这样做。例如，我们可以提供一个名字：\n\
    \n```python\nromeo = cat.Cat(\"Romeo\")\n```\n\n不过，我们的 Cat 类现在需要重写。这与在函数中的做法并不完全相同。它是在一个称为**构造函数**的特殊方法中完成的。\n\
    \n![](img/c4403822ba1e00f0a2ce532b3f9d5054_24_0.png)\n\n构造函数有一段特殊的代码，从现在起你会经常看到它。它乍看有点吓人，但总是一样的——你会习惯的：\n\
    \n```python\ndef __init__(self, name):\n```\n\n它总是带有 self 参数，以确保每个人都明白：这个方法将可供这个类构建的每个对象使用。接下来，我们必须列出想要传递给构造函数的其他参数。在上面的示例中，需要的另一个参数是\
    \ name。\n\n现在让我们暂停一下。你可能没有被两侧各有两个下划线包围的 __init__ 弄糊涂；你可能已经注意到，这实际上是一个方法，因为它的开头有\
    \ def，结尾有冒号；你可能是一个非常聪明的程序员！大多数学生在这个阶段都需要一点鼓励——听听坎贝尔先生怎么说。\n\n现在继续！在这个称为构造函数的特殊方法中，我们必须根据\
    \ name 创建一个 self.name 变量（没错，这样它就能供这个类创建的对象使用）。然后我们会在方法中使用这个新变量 self.name。\n\n\
    我们正在给所有将要供对象（而不仅仅是供类）使用的变量名前面加上 self.。这就是为什么我们最后会有很多 self！\n\n### 深入探讨\n\n当我们构建类时，我们编写的方法将可供我们构建（创建实例）的对象使用。在一局斯诺克比赛中，可能有好几个位置不同的球。每个球都有一个\
    \ find_location() 方法，它只引用自身，即使它们都是由同一个类构建的。这就是为什么我们类中的方法会把 `self` 作为参数传递。不过，实际情况比这还要巧妙。\n\
    \n![](img/c4403822ba1e00f0a2ce532b3f9d5054_25_0.png)\n\n从编程角度看，对象实际上确实会回到类代码中查找方法，但每个对象都会跟踪自己的数据。就好像每个对象都拥有只针对它自己的方法。就好像这些方法独立于同一工厂构建的其他对象一样。这正是我们构建对象时所希望的，而这一切都通过一个参数——`self`——来完成。\n\
    \n在 IDLE 中打开一个新窗口，并复制代码框 2.3 中的代码。将其保存为 `cat2.py`。将它与 `cat.py`（代码框 2.1）进行比较，看看我们如何使用构造函数中创建的新变量\
    \ `self.name`。是的，这段构造函数代码所做的就是：给了你一个可以使用的新变量！和之前一样，这个类不会运行任何东西。它只是一个工厂，但你马上就会看到工厂多么有用。\n\
    \n```python\nclass Cat:\n    # constructor:\n    def __init__(self, name):\n \
    \       self.name = name\n\n    def speak(self):\n        print(self.name, \"\
    \ says Meow\")\n\n    def drink(self):\n        print(self.name, \" drinks some\
    \ milk.\")\n        print(self.name, \" takes a nap.\")\n```\n\n![](img/c4403822ba1e00f0a2ce532b3f9d5054_26_0.png)\n\
    \n"
