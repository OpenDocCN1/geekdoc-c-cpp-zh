    `False` — 11


    +   - **bug** — a piece of code that is causing a program to fail to run properly
    or at all — 48


    +   - **casting** — the process of converting one data-type into another; for
    example, sometimes a number may be stored as text but need to be converted in
    to an integer; this can be done like this: `int ("3")` — 99


    +   - **classes** — in object-oriented programming, classes are sections of code
