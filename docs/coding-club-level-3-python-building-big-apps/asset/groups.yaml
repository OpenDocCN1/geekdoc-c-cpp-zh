    # Delving Deeper


    # Global or local?


    A variable that is created in a function or method is said to be a **local variable**.
    These variables exist inside the function but are not available to be called or
    used in the rest of our programs. They can even have the same names as variables
    in other functions or methods, although this is not a good idea. A **global variable**
    is often declared at the beginning of our code. We want access to their values
    at all times. Sometimes we might want to use a global variable inside a method
    or function. This is fine if we only want to read the value of the


    > *continues on the next page*'
  - '[PAGE 65]


    variable. If the method or function needs to change the global variable’s value,
    then it must be re-declared inside the function, with the keyword `global` in
    front.


    If the keyword `global` is omitted, a new local variable with the same name is
    created. If we do not declare it inside the function at all, then we will get
    a ‘local variable referenced before assignment’ error when the function tries
    to change its value! In other words, the computer does not recognise it as the
    global variable we intended, and tells us that we are trying to access a non-existent
    local variable.


