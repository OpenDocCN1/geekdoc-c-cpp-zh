    # Delving Deeper


    # When to build classes?


    You may be wondering when it is best to build classes. Many object-oriented programming
    (OOP) experts will try and build everything out of classes, including a Main class!
    However, there are many ways to go about things, OOP is one of them and you have
    many choices within that. In this book you are being introduced to a selection
    of OOP techniques which do not harness all of OOP’s benefits – or its complexities.
    The focus of this book is to teach you how to build and interact with classes.
    We are therefore going to choose a class whenever we want to build an object which
    we may want to use later in our coding life or when we want many of the same kind
    of object.


    To explain why we want a Table class is easy if you think of classes as factories.
    Without the net it can be the stage for many games or animations. Later we are
    going to build a Bat class. We will write it so that it can be a left or right
    bat. Then we may want to add code so we can have a bottom or top bat. If we were
    to serve our ball from a bottom bat, it could now be a racket launcher. If we
    place a pile of top bats above a bottom bat (Figure 3.4) we could build a MyBreakout
    game (or should that be MyBatout?). We would certainly want a lot of bats then,
    and they could all be quickly built using our Bat class (or Bat factory).'
