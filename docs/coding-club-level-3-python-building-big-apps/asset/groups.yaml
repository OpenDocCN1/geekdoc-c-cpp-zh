  mdcn: "\n## 第 6 章\n\n### 规则与计分\n\n到本章结束时，你将完成 MyPong，并构建一个可用于开发其他游戏的有用模块。在本章中，我们将对两个文件进行调整，但不会创建任何新类。还会进一步讨论何时创建新类，以及何时向现有类添加方法。\n\
    \n在本章中，你将：\n\n- 阻止球从左墙和右墙反弹\n- 为游戏添加计分系统\n- 完成 MyPong！\n\n![](img/c4403822ba1e00f0a2ce532b3f9d5054_92_0.png)\n\
    \n### 进球得分\n\n第一项工作是确保我们检测并处理球撞到球桌左墙和右墙的情况，因为这会导致进球。\n\n因此，首先我们必须检测球何时撞到左墙。我们已经在\
    \ Ball 类中实现了这一点：\n\n```python\nif (self.x_pos <= 3):\n    # further code goes\
    \ here\n```\n\n我们不想在 Ball 类中改变这一行为，因为这会降低它对其他游戏的实用性。相反，我们将在 main.py 中检测碰撞，并以新的方式处理它。这是因为这是本游戏的一条特定规则。\n\
    \n让我们看看在 main.py 中重新写出它有多难：\n\n```python\nif (my_ball.x_pos <= 3):\n    # further\
    \ code goes here\n```\n\n![](img/c4403822ba1e00f0a2ce532b3f9d5054_93_0.png)\n\n\
    ### 深入探索\n\n### 再次需要 3 像素\n\n合乎逻辑的做法是测试球的左侧是否到达 0——但情况通常并非如此，因为球实际上是一个圆形从一个位置跳到下一个位置的动画。因此，我们改为测试它是否在\
    \ 3 像素以内。\n\n现在添加处理球撞到左墙的代码。在第 6 章文件夹中，打开 pong-score-start 文件夹里的 `main.py`。按照代码框\
    \ 6.1 中提供的代码，修改 `move_next()` 方法中的代码。\n\n```python\n# detect if ball has hit the\
    \ left wall:\nif(my_ball.x_pos <= 3):\n    my_ball.stop_ball()\n    my_ball.start_position()\n\
    \    bat_L.start_position()\n    bat_R.start_position()\n    my_table.move_item(bat_L.rectangle,\
    \ 20, 150, 35, 250)\n    my_table.move_item(bat_R.rectangle, 575, 150, 590, 250)\n\
    ```\n\n### 代码框 6.1 分析\n\n到现在，希望你能够理解这段代码的大部分内容。首先，我们停止球并重置其位置。然后，我们将球拍重置到起始位置。最后，我们需要调用球桌的\
    \ `move_item()` 方法两次，将代表两个球拍的两个矩形移动到它们的起始位置。我们不需要移动圆形，因为球会在其 `move_next()` 方法中处理这一点。本章后面我们将添加计分系统。\n\
    \n如果运行 `main.py`，它应该能正常启动，球位于画布中央。如果球撞到左墙，它会回到中央，球拍也会返回起始位置。球拍仍然可以移动。现在球会卡住。\n\
    \n现在，将检测左墙的代码复制并粘贴到 `main.py` 中等待检测右墙的位置。然后看看你能否调整它，使球在撞到任一墙时都回到中央。如果遇到困难，请查看代码框\
    \ 6.2。\n\n```python\n# detect if ball has hit the right wall:\nif (my_ball.x_pos\
    \ + my_ball.width >= my_table.width - 3):\n    my_ball.stop_ball()\n    my_ball.start_position()\n\
    \    bat_L.start_position()\n    bat_R.start_position()\n    my_table.move_item(bat_L.rectangle,\
    \ 20, 150, 35, 250)\n    my_table.move_item(bat_R.rectangle, 575, 150, 590, 250)\n\
    ```\n\n### 添加发球能力\n\n当然，如果球只是停下并自行重置，然后游戏结束，那是不行的——所以我们需要能够发球。为此，我们必须向 main.py\
    \ 添加一个 restart() 函数。将代码框 6.3 中的代码添加到你的 main.py 文件中注释所指示的位置。\n\n**代码框 6.3** — `main.py`\n\
    \n```python\n# bind restart to spacebar\nwindow.bind(\"<space>\", restart_game)\n\
    ```\n\nrestart_game() 函数的第一部分已经为你添加好了。它位于 game_flow() 函数下方。代码如代码框 6.4 所示。新代码添加在键盘绑定上方：\n\
    \n**代码框 6.4** — `main.py`\n\n```python\n# add restart_game function here:\ndef\
    \ restart_game(master):\n    my_ball.start_ball(x_speed=x_velocity, y_speed=0)\n\
    ```\n\n这里需要注意几点。Tkinter 期望这个函数有一个额外参数，因此我们需要添加 master。这超出了本书的范围，但请注意这是必需的。在球对象的\
    \ start_ball() 方法中，我们提供了 y_speed=0 作为参数，因为我们不希望使用球的默认 y_speed。这意味着发球现在将是水平的，而不是对角线的。\n\
    \n### 实验\n\n保存并运行 `main.py`，看看应用目前的工作情况。用鼠标点击游戏窗口以获取焦点，然后尝试按几次空格键，看看 `restart_game()`\
    \ 如何工作。你也可以尝试更改 `y_speed` 的值，看看会有什么效果——你可能会更喜欢那样。\n\n### 第一次发球\n\n现在来处理第一次发球。目前，游戏在我们准备好之前就开始了，因此我们将添加一个新的全局布尔变量，用来存储我们是否处于第一次发球。\n\
    \n在 `main.py` 顶部附近提供的位置，添加代码框 6.5 中的代码。与此同时，你还可以添加用于保存比分的变量。\n\n**代码框 6.5** —\
    \ `main.py`\n\n```python\n# initialise global variables\nx_velocity = 10\ny_velocity\
    \ = 0\nscore_left = 0\nscore_right = 0\nfirst_serve = True\n```\n\n现在我们只需要调整 `game_flow()`，使其添加一个\
    \ if 子句并等待第一次发球。\n\n添加代码框 6.6 中的代码。你一直在定期保存，对吧？由于这个函数可以更改我们新的全局变量，我们必须在函数内部再次声明它们。\n\
    \n```python\n# functions:\ndef game_flow():\n    global first_serve\n    global\
    \ score_left\n    global score_right\n    # wait for first serve:\n    if(first_serve\
    \ == True):\n        my_ball.stop_ball()\n        first_serve = False\n```\n\n\
    我们现在知道第一次发球何时发生，因此知道何时开始计分。剩下要添加的就是记分牌。\n\n### 记分牌\n\n当我们在第 3 章开头规划这个游戏时，还不确定要把记分牌放在哪里。现在似乎稍微明显一些了。我们可以再建立一个计分类，但这似乎没有必要，因为几乎所有游戏都有自己的计分系统，而且它实际上属于规则的一部分。在\
