    \ True，否则返回 False。因此，代码框 1.2 中的整个函数可以替换为：\n\n```python\ndef is_correct(guess,\
    \ password):\n    return guess == password\n```\n\n你可以自己尝试一下，看看它是否仍然有效。\n\n##\
