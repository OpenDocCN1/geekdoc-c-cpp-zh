    \ `main.py` 不是类，所以它将使用函数而不是方法。首先，我们需要一个让球动起来的函数。`game_flow()` 在接下来两章中会变得更复杂，但现在它调用\
    \ `my_ball` 的 `move_next()` 方法，然后使用 `window.after()` 方法创建一个动画循环：\n\n```python\n\
    window.after(50, game_flow)\n```\n\n第一个参数选择 50 毫秒的等待时间，第二个参数给出等待之后要调用的函数。`after()`\
    \ 函数被设计为向 `mainloop()` 添加一个事件。在我们的代码中，`after()` 调用包含它的函数；因此，它实际上产生了一个**无限循环**，其中\
    \ `my_ball.move_next()` 函数每 50 毫秒被调用一次。\n\n在 `main.py` 末尾调用 `mainloop()` 方法之前，我们还需要添加一行代码来让新函数开始运行：`game_flow()`。完成了！\n\
    \n## 深入探索\n\n### 全局还是局部？\n\n在函数或方法中创建的变量称为**局部变量**。这些变量存在于函数内部，但不能在程序的其他部分被调用或使用。它们甚至可以与其他函数或方法中的变量同名，尽管这不是一个好主意。**全局变量**通常在我们的代码开头声明。我们希望随时能访问它们的值。有时我们可能想在方法或函数内部使用全局变量。如果我们只想读取变量的值，那没问题。如果方法或函数需要改变全局变量的值，那么必须在函数内部重新声明它，并在前面加上关键字\
    \ `global`。\n\n如果省略关键字 `global`，就会创建一个同名的新局部变量。如果我们完全不在函数内部声明它，那么当函数试图改变它的值时，就会得到“局部变量在赋值前被引用”的错误！换句话说，计算机不会把它识别为我们想要的全局变量，并告诉我们正在尝试访问一个不存在的局部变量。\n\
    \n### 测试与调试\n\n现在我们可以测试 Ball 类了。首先确保你的三个文件都已保存。在 IDLE 中运行 `main.py` 文件。如果一切正常，你应该会看到一个带球网的球桌，以及一个会在墙上反弹的红色球！\n\
    \n如果有任何错误，试着解决它们，并特别注意错误发生在哪个文件中。有时涉及多个文件时会相当棘手，所以如果你已经尝试了几次仍毫无进展，请使用配套网站上的文件。这些文件可以在\
    \ Chapter 4 文件夹中的 `pong-ball-final` 文件夹里找到。仔细比较你的文件与可运行文件是一次很好的学习经历。你年轻时玩“找不同”的那些日子现在真的会有回报。注意到代码中悄悄混入了哪些错误是件好事，这样你以后就能尽量避免它们。\n\
    \n### move_next() 方法\n\n前面说过我们会回来解释 `ball.py` 中的 `move_next()` 方法——好了，解释就在这里！\n\
    \n"
