    \n类设计表 2.1 一个电梯类。\n\n我们可能还想知道它能容纳多少乘客，或者它的速度——但这个电梯会非常简单。为了规划一个电梯类，我们可以使用类设计表。你可以在本书末尾的附录中以及配套网站上找到一张空白的类设计表——这样如果你愿意，就可以打印出自己的表格。设计工作就会写进类设计表中。然后我们可以据此构建我们的类。\n\
    \n两个方法是必不可少的：一个用于找出电梯当前所在楼层，另一个用于将电梯移动到新楼层。现在我们来看看这是如何转换成代码的：\n\n![](img/c4403822ba1e00f0a2ce532b3f9d5054_29_0.png)\n\
    \n```python\n# lift.py provides a Lift Class\n\nclass Lift:\n    # constructor:\n\
    \    def __init__(self, current_floor=0):\n        self.current_floor = current_floor\n\
    \n    def get_floor(self):\n        return self.current_floor\n\n    def move_to_floor(self,\
    \ floor_number):\n        self.current_floor = floor_number\n```\n\n### 代码框 2.5\
    \ 分析\n\n`current_floor` 属性有一个默认值 0。这可以在构造函数方法中看到。现在，如果我们创建新的电梯对象时没有向这个类传递 `current_floor`\
    \ 参数，新电梯将默认从 0 层开始。\n\n第一个方法使用了 `return` 关键字。这意味着如果我们在电梯操作程序里调用这个方法，它会把存储在 `self.current_floor`\
    \ 变量中的值返回（交回）给我们。\n\n### 电梯操作员\n\n`lift_operator.py` 中有一些与电梯互动的简单代码。你不需要手动输入，可以直接从配套网站下载的源代码文件中的\
    \ Chapter 2 文件夹里打开并运行它。代码见下一页的代码框 2.6。\n\n### 代码框 2.6\n\n```python\n# lift_operator.py\n\
    \nimport lift\n\n# create a lift object\nmy_lift = lift.Lift()\n\n# Find out what\
