- md: "\n## Python in:\n\n```python\n>>> a, *b = [1, 2, 3, 4]\n>>> a\n1\n>>> b\n[2,\
    \ 3, 4]\n```\n\nThis means the fastest way to swap two variables in Python:\n\n\
    ```python\n>>> a = 5; b = 8\n>>> a, b = b, a\n>>> a, b\n(8, 5)\n```\n\n## Special\
    \ Methods\n\nThere are certain methods such as `__init__` and `__del__` methods\
    \ which have special significance in classes. Special methods are used to mimic\
    \ behaviors of built-in types. For example, if you want to use the `x[key]` indexing\
    \ operation for your class (just like you use for lists and tuples), then all\
    \ you have to do is implement the `__getitem__` method and your job is done. If\
    \ you think about it, this is what Python does for the list class itself! Some\
    \ special methods are listed in the following table. If you want to know about\
    \ all the special methods, see the manual (http://docs.python.org/dev/3/reference/datamodel.html#special-methods).\n\
    \n| Name | Explanation |\n|---|---|\n| `__init__(self, ...)` | Called just before\
    \ the newly created object is returned for usage. |\n| `__del__(self)` | Called\
    \ after the object is destroyed |\n| `__str__(self)` | Called when we use the\
    \ print function or str() is used. |\n| `__lt__(self, other)` | Called when the\
    \ less operator (<) is used. Similarly, there are special methods for all operators\
    \ (+, *, etc.). |\n| `__getitem__(self, key)` | Called when x[key] indexing operation\
    \ is used. |\n| `__len__(self)` | Called when the built-len() function is used\
    \ for the sequence object. |\n\n## Special Statement Blocks\n\nWe have seen that\
    \ each block of statements is set apart from the rest by its own indentation level.\
    \ Well, if a block of statements contains only one statement, then you can specify\
    \ it on the same line of, a conditional statement or looping statement. The following\
    \ example should make this clear:\n\n```python\n>>> flag = True\n>>> if flag:\
    \ print 'Yes'\n```\n\nYes\n\nNotice that the single statement is used in-place\
    \ and not as a separate block. Although you can use this for making your program\
    \ smaller, I strongly recommend avoiding this short-cut method, except for checking,\
    \ mainly because it will be much easier to add an extra statement Python if you\
    \ are using proper indentation.\n\n## Lambda Forms\n\nA lambda statement is used\
    \ to create new function objects and then return them at runtime.\n\n```python\n\
    #!/usr/bin/python\n# Filename: lambda.py\n\ndef make_repeater(n):\n    return\
    \ lambda s: s * n\n\ntwice = make_repeater(2)\n\nprint(twice('word'))\nprint(twice(5))\n\
    ```\n\nOutput:\n\n```\n$ lambda.py\nwordword\n10\n```\n\nHow It Works:\nHere,\
    \ we use a function `make_repeater` to create new function objects at runtime\
    \ and return it. A lambda statement is used to create the function object. Essentially,\
    \ the lambda takes a parameter followed by a single expression only which becomes\
    \ the body of the function and the value of this expression is returned by the\
    \ new function. Note that even in a print statement cannot be used inside a lambda\
    \ form, only expressions.\n\nTODO\n\nCan we do a `list.sort()` by providing a\
    \ compare function created using lambda?\n```python\npoints = [ {'x': 2, 'y':\
    \ 3}, {'x': 4, 'y': 1} ]\npoints.sort(lambda a, b: cmp(a['x'], b['x']))\n```\n\
    \n## List Comprehension\n\nList comprehensions are used to derive a new list from\
    \ an existing list. Suppose you have a list of numbers and you want to get a corresponding\
    \ list with all the numbers multiplied by 2 only when the number itself is greater\
    \ than 2. List comprehensions are ideal for such situations.\n\n```python\n#!/usr/bin/python\n\
    # Filename: list_comprehension.py\n\nlistone = [2, 3, 4]\nlisttwo = [2*i for i\
    \ in listone if i > 2]\nprint(listtwo)\n```\n\nOutput:\n\n```\n$ python list_comprehension.py\n\
    [6, 8]\n```\n\nHow It Works:\n\nHere, we derive a new list by specifying the manipulation\
    \ to be done (2*i) when some condition is satisfied (if > 2). Note that the original\
    \ list remains unmodified.\n\nThe advantage of using list comprehensions is that\
    \ it reduces the amount of boilerplate code when we use loops to process each\
    \ element of a list and store it in a new list.\n\n## Receiving Tuples and Lists\
    \ in Functions\n\nThere is a special way of receiving parameters to a function\
    \ as a tuple or a dictionary with the `*` or `**` prefix respectively. This is\
    \ useful when taking variable number of arguments in the function.\n\n```python\n\
    >>> powersum(power, args):\n    '''Return the sum of each argument raised to specified\
    \ power.'''\n    total = 0\n    for i in args:\n        total += pow(i, power)\n\
    \    ...\n    return total\n```\n\n```python\n>>> powersum(2, 3, 4)\n25\n```\n\
    \n```python\n>>> powersum(2, 10)\n1024\n```\n\nBecause we have a `*` prefix on\
    \ the `args` all extra arguments passed to the function are stored in `args` as\
    \ a tuple. If a `**` prefix had been used instead the extra parameters would be\
    \ considered to key/value pairs of a dictionary.\n\n## exec and eval\n\nThe `exec`\
    \ function is used to execute Python statements which are stored in a string or\
    \ file, as opposed to be written in the program itself. For example, we can use:\n\
    \n```python\n>>> exec(\"print('Hello World')\")\nHello World\n```\n\nSimilarly,\
    \ `eval` function is used to evaluate valid expressions which are stored in a\
    \ string.\n\n```python\n>>> eval('2*3')\n6\n```\n\n## The assert statement\n\n\
    The `assert` statement is used to assert that something is true. For example,\
    \ if you are very sure that there is at least one element in `mylist`, then `assert`\
    \ is ideal for you to check this. When the `assert` fails, an `AssertionError`\
    \ is raised.\n\n```python\n>>> mylist = ['item']\n>>> assert len(mylist) >= 1\n\
    >>> mylist.pop()\n'item'\n>>> mylist = []\n>>> assert len(mylist) >= 1\nTraceback\
    \ (most recent call last):\n  File \"<stdin>\", line 1, in <module>\nAssertionError\n\
    ```\n\nThe `assert` statement should be used judiciously. Most of the time, it\
    \ is better to catch exceptions or display an error message to the user.\n\n##\
    \ The repr function\n\nThe `repr` function is used to obtain a canonical string\
    \ of the object. You can control how your classes return by defining `__repr__`\
    \ in your class.\n\n```python\n>>> i = []\n>>> i.append('item')\n>>> repr(i)\n\
    \"['item']\"\n>>> repr(i) == i\nFalse\n```\n\n## Summary\n\nWe have covered some\
    \ more features of Python in this chapter and at this stage, we have covered most\
    \ of all features. This is sufficient for you to get started with whatever you\
    \ are going to create. Next, we will discuss how to explore Python further.\n"
  mdcn: "\n\n## Python 示例：\n\n```python\n>>> a, *b = [1, 2, 3, 4]\n>>> a\n1\n>>> b\n\
