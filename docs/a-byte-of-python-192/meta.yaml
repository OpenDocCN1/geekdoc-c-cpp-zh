  md: "Python en:Modules\n\n# The from ...import ...statement\n\nIf you want to directly\
    \ import the argv variable into your program (to avoid typing the sys, everytime\
    \ for it), then you can use the sys import argv. If you want to import all the\
    \ names used in the sys module, then you can use the sys import * statement. This\
    \ works for any module.\n\nIn general, you should avoid using this statement and\
    \ use the import statement instead of your program will avoid name classes and\
    \ will be more readable.\n\n# A module's _name_\n\nEvery module has a name and\
    \ statements in a module can find the name of run module. This is handy in the\
    \ particular situation of figuring out if the module is being run standalone or\
    \ imported. As mentioned previously, when a module is imported for the first time,\
    \ the code in that module is executed. We can use this concept to alter the behavior\
    \ of the module if the program was run by itself and not when it was imported\
    \ from another module. This can be achieved using the _name_ attribute of the\
    \ module.\n\nExample:\n\n```\n#!/usr/bin/python\n# Filename: using_name.py\n\n\
    if name == '__main__':\n    print('This program is being run by itself')\nelse:\n\
    \    print('I am being imported from another module')\n```\n\nOutput:\n\n```\n\
    $ python using_name.py\nThis program is being run by itself\n\n$ python\n>>> import\
    \ using_name\nI am being imported from another module\n>>>\n```\n\nHow It Works:\n\
    \nEvery Python module has its __name__ defined and if this is '__main__', it implies\
    \ that the module is being run standalone by the user and we can take appropriate\
    \ actions."
