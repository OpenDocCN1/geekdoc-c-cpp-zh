    # Annotations


    Functions have another advanced feature called annotations which are a nifty way
    of attaching additional information for each of the parameters as well as the
    return value.

    Since the Python language does not interpret these annotations in any way they
    want (that functionality is left to third-party libraries to interpret in any
    way they), we will skip this feature in our discussion. If you are interested
    to read about annotations, please see the Python Enhancement Proposal No. 3107
    (http/: / www.python.org/dev/peps/pep-3107/).


    # Summary


    We have seen many aspects of functions but note that we still haven''t covered
