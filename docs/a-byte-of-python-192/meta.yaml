    \ If it could not find the method, it starts looking at the methods belonging\
    \ to its base classes one by one in the order they are specified in the tuple\
    \ in the class definition.\n\nA note on terminology - if more than one class is\
    \ listed in the inheritance tuple, then it is called multiple inheritance.\n\n\
    ## Summary\n\nWe have explored the various aspects of classes and objects as well\
