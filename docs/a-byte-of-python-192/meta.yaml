    \n| 名称 | 解释 |\n|---|---|\n| `__init__(self, ...)` | 在新创建的对象返回用于使用之前调用。 |\n| `__del__(self)`\
    \ | 在对象销毁后调用。 |\n| `__str__(self)` | 当我们使用 `print` 函数或使用 `str()` 时调用。 |\n| `__lt__(self,\
    \ other)` | 当使用小于运算符 (<) 时调用。同样，所有运算符 (+, *, 等）都有特殊方法。 |\n| `__getitem__(self,\
    \ key)` | 当使用 x[key] 索引操作时调用。 |\n| `__len__(self)` | 当对序列对象使用内置的 `len()` 函数时调用。\
    \ |\n\n## 特殊语句块 (Special Statement Blocks)\n\n我们已经看到每个语句块都通过其自身的缩进级别与其他部分隔离开。那么，如果一个语句块只包含一条语句，你可以在条件语句或循环语句的同一行中指定它。下面的示例应该得很清楚：\n\
    \n```python\n>>> flag = True\n>>> if flag: print 'Yes'\n```\n\nYes\n\n注意，单条语句是直接使用的，而不是作为一个独立的块。虽然你可以用它来减小程序体积，但我强烈建议避免这种快捷方法，除非是为了进行检查，主要因为如果你使用正确的缩进，为\
    \ Python 添加额外的语句将要容易得多。\n\n## Lambda 表达式 (Lambda Forms)\n\n`lambda` 语句用于创建新的函数对象并在运行时返回它们。\n\
    \n```python\n#!/usr/bin/python\n# 文件名: lambda.py\n\ndef make_repeater(n):\n  \
    \  return lambda s: s * n\n\ntwice = make_repeater(2)\n\nprint(twice('word'))\n\
    print(twice(5))\n```\n\n输出：\n\n```\n$ lambda.py\nwordword\n10\n```\n\n工作原理：\n\
    在这里，我们使用函数 `make_repeater` 在运行时创建新的函数对象并返回。使用 `lambda` 语句来创建函数对象。本质上，lambda 接受一个参数，后面只跟一个表达式，该表达式成为函数体，并且该表达式的值由新函数返回。注意，即使在\
    \ `print` 语句中也不能在 lambda 表达式中使用，只能使用表达式。\n\n待办 (TODO)\n\n我们可以通过提供一个使用 lambda 创建的比较函数来执行\
    \ `list.sort()` 吗？\n```python\npoints = [ {'x': 2, 'y': 3}, {'x': 4, 'y': 1} ]\n\
    points.sort(lambda a, b: cmp(a['x'], b['x']))\n```\n\n## 列表推导式 (List Comprehension)\n\
    \n列表推导式用于从现有列表派生新列表。假设你有一个数字列表，你想得到一个对应的列表，仅当数字本身大于 2 时，将所有数字乘以 2。列表推导式是此类情况的理想选择。\n\
    \n```python\n#!/usr/bin/python\n# 文件名: list_comprehension.py\n\nlistone = [2,\
    \ 3, 4]\nlisttwo = [2*i for i in listone if i > 2]\nprint(listtwo)\n```\n\n输出：\n\
    \n```\n$ python list_comprehension.py\n[6, 8]\n```\n\n工作原理：\n\n在这里，我们通过在满足某些条件（if\
    \ > 2）时指定要执行的操作（2*i）来派生新列表。注意，原始列表保持不变。\n\n使用列表推导式的优势处是，当我们使用循环处理列表的每个元素并将其存储在新列表中时，它减少了样板代码量。\n\
    \n## 在函数中接收元组和列表 (Receiving Tuples and Lists in Functions)\n\n特殊方法可以分别通过 `*` 或\
    \ `**` 前缀以元组或字典的形式接收函数参数。这在函数接收可变数量的参数时非常有用。\n\n```python\n>>> powersum(power,\
    \ args):\n    '''返回每个参数的指定幂的和。'''\n    total = 0\n    for i in args:\n       \
    \ total += pow(i, power)\n    ...\n    return total\n```\n\n```python\n>>> powersum(2,\
    \ 3, 4)\n25\n```\n\n```python\n>>> powersum(2, 10)\n1024\n```\n\n因为我们在 `args`\
    \ 上有 `*` 前缀，传递给函数的所有额外参数将以元组的形式存储在 `args` 中。如果使用 `**` 前缀，则额外参数将被视为字典的键值对。\n\n"
