    [25] http://www.swaroopch.com/buybook\n"
  mdcn: "\n\n# Python 字节 (A Byte of Python)\n\nv1.92 (适用于 Python 3.0)\n\n## Python\n\
    \n选择你的 Python 版本：\n\n如果你想学习当前的 Python 2.x，请[在此处阅读][1] 或下载 PDF [2]\n\n如果你想学习新的\
    \ Python 3.0，请[在此处阅读]或下载 PDF [3]\n\n你也可以购买纸质版。[4]\n\n## 序言\n\n《A Byte of Python》是一本关于使用\
    \ Python 语言进行编程的书籍。它为初学者提供了 Python 语言的教程或指南。如果你们都了解电脑如何保存文本文件，那么这本书就是为你准备的。\n\n\
    本书已针对新的 Python 3.0 进行了更新。如果你正在寻找当前 Python 2.x 版本的教程，请下载该书之前的修订版本 [5]。同样地，如果你在犹豫应该学习\
    \ Python 2.x 还是 3.x，可以阅读 James Bennett 的的这篇文章 [6]。\n\n## 谁在读《Python 字节》？\n\n以下是人们对这本书的评价：\n\
    \n## 读者反馈\n\n- 这是我见过的最好的教程！感谢你的努力。\n- Walt Michalik (wmich50-at-theramp-dot-net)\n\
    - 你做了我在网上找到的最好的教程。做得好。谢谢！\n- Joshua Robin (joshrob-at-poccta-dot-onel-ot-pl)\n\
    - 你好，我来自多米尼加共和国。我叫 Pavel，我最近读了你的书《A Byte of Python》，我认为它太棒了！！ :) 我从所有的示例中中学了很多。这本书对像我这样的新手非常有帮助，比如……\n\
    - Pavel Simo (pavel-dot-simo-at-gmail-dot-com)\n- 我最近读完了《Python 编程》，我觉得我真的应该感谢你。读到最后几页时我很难过，因为我现在必须回到那些枯燥、乏味油腻的手手册来学习\
    \ Python。我非常感谢你的书。\n- Samuel Young (sy-one-three-seven-at-gmail-dot-com)\n- 亲爱的\
    \ Swaroop，我正在上一个对教学毫无兴趣的的课。我们使用的是 O'Reilly 出版的第二版《Learning Python》。它并不是一本写给没有任何编程知识的初者的教材，而且那个老师本应该在另一个领域工作。非常感谢你的书，如果没有它，我对\
    \ Python 和编程将一无所知。万分感谢，你能将“信息拆解”到一个每个人都能理解的水平，并不是人人都能做到。\n- Joseph Duarte (jduarte1-at-cfl-dot-rr-dot-com)\n\
    - 我喜欢你的书！它是史上最优秀的 Python 教程，也是一本非常实用的参考书。太棒了，真正的杰作！继续加油！\n- Chris-André Sommerseth\n\
    \n## Python 3\n\n我写邮件给你是为了感谢你在线编写《Byte of Python》。在发现你的书之前，我已经尝试了几个月的 Python 了，虽然在\
    \ PyGame 上取得了有限成功，但我从未完成过程序。\n\n多亏了你对分类的简化，Python 似乎变得可以实现的目标。似乎我终于学会了基础知识，可以继续我的真实目标——游戏开发了。\n\
    \n再次非常感谢你在网络上发布了如此结构化且有用的基础编程指南。它让我理解并理解出了 OOP（面向对象编程），而这种理解是另外两本书未能提供的。\n\n-\
    \ Matt Gallivan (m-underscore-gallivan-12-at-hotmail-dot-com)\n\n我想感谢你的书《A byte\
    \ of python》，我认为这是学习 Python 的最好方法。我是一个住在埃及的 15 岁少年，我叫 Ahmed。我在学校学习的第二种编程语言是 Visual\
    \ 6，但不喜欢它，然而我很喜欢学习 Python。我做了一个通讯录程序并成功了（如果我尝试开始写自己的源码的话将很有帮助）。如果你能告诉我在哪里可以找到像你写的这么好的教程，将对我非常有帮助。谢谢。\n\
    \n- Ahmed Mohammed (sedo-underscore-91-at-hotmail-dot-com)\n\n对于初学者学习更多 Python\
    \ 的一个绝佳资源是 Swaroop C H. 编写的 110 页 PDF 教程《A Byte of Python》。它写得很好，易于理解，可能是对 Python\
    \ 编程最好的介绍之一。\n\n- Drew Ames 在 Linux.com 上发表的一篇关于 Scripting Scribus 的文章中 [17]\n\
    \n昨天我在我的 Nokia N800 上看完了《Byte of Python》的大部分，这是我遇到过的最简单、最简洁的 Python 介绍。强烈推荐作为学习\
    \ Python 的起点。\n\n- Jasonport 他的网络博客 [8]\n\n## 学术课程\n\n这本书被用作各机构教学材料：\n\n1. 阿姆斯特丹自由大学（Vrije\
    \ Universiteit）的“编程语言原理”课程 [9]\n2. 加州大学戴维斯分校（University California Davis）的“计算基础概念”课程\
    \ [10]\n3. 哈佛大学的“使用 Python 编程”课程 [11]\n4. 莱兹大学的“编程导论”课程 [12]\n5. 波士顿大学的“应用编程导论”课程\
    \ [13]\n6. 俄克拉荷马州立大学的“信息技术技能”课程 [14]\n7. 密歇根州立大学的“处理（Processing）”课程 [15]\n8. 爱丁堡大学的“多智能体网络系统”课程\
    \ [16]\n\n## 甚至还有 NASA\n\nNASA 在使用这本书！它被用于他们喷气推进实验室的深空网络项目。\n\n## 官方推荐\n\n这本书已列在官方网站上，紧邻官方文档。\n\
    \n## 许可证\n\n1. 本书根据知识产权许可署名-相同共享 3.0 许可协议授权。这意味着：\n    - 你可以复制、分发和传输这本书\n    -\
    \ 你可以改编此书\n    - 在以下条件下：\n    - 必须按照作者指定的方式对作品进行署名（但不能以任何方式暗示他们认可你对本书的使用）。\n \
    \   - 如果你修改、转换或基于此作品进行创作，你可以在相同或相似的许可下分发结果作品。\n    - 对于任何重用或分发，你必须向其他人明确条款。\n\
    2. 必须通过链接回 swaroop.com/notes/ 来显示署名，并明确指出原文可以从该地获取。\n3. 本书中提供的所有代码/脚本均根据三条款 BSD\
    \ 许可证授权，除非另有注明。\n4. 对原书的志愿者贡献必须遵循相同的许可，且版权必须转让给本书的主作者。\n\n## 立即阅读\n\n你可以在目录在线阅读这本书。\n\
    \n## 购买书籍\n\n可以购买书籍的纸质版供你离线阅读之乐。\n\n## 下载\n\n- PDF (631KB)\n- Media (276KB) (仅限高级用户)\n\
    \n如果你希望支持本书的发展，请考虑捐赠或购买纸质版。\n\n## 翻译\n\n如果你对本书的翻译感兴趣，请查看翻译。\n\n## 参考文献\n\n[1]\
    \ http://www.ibiblio.org/swaroop/\n[2] http://www.ibiblio.org/swaroop/files/120\n\
    [3] http://www.swaroop.com/byte_of_python_191.pdf\n[4] http://www.swaroop.com/buybook\n\
    [5] http://www.ibiblio.org/swaroop/120/\n[6] http://www.b-list.org/python-300/\n\
    [7] http://www.linux.com/feature/26522\n[8] http://paxmode.pt/blog.html?id=627\n\
    [9] http://www.few.vu.nl/~nilisvis/PPL/207/index.html\n[10] http://cs.ucdavis.edu/courses/exp_course/10.html\n\
    [11] http://www.people.fas.harvard.edu/~preshman/python_winter.html\n[12] http://www.comp.edu/accom/1900/\n\
    [13] http://cs.bu.edu/courses/cs108/materials.html\n[14] http://https.astr.ou.edu/byteofpython/\n\
    [15] http://www.msu.edu/~aston/class/825/index.html\n[16] http://homepages.inf.ac.uk/ewan/maswas/\n\
    [17] http://dsnra.jpl.nasa.gov/software/Python/byte-of-python/output/byteofpython_html/\n\
    [18] http://www.python.org/doc/intros/\n[19] http://www.creativecommons.org/licenses/by-sa/3.0/\n\
    [20] http://www.opensource.org/licenses/bsd-license.php\n[21] http://www.swaroop.com/buybook\n\
    [22] http://www.swaroop.com/files/byteofpython/byte_of_python_v191.pdf\n[23] http://www.swaroop.com/files/byteofpython/byte_of_python_v191.xml\n\
    [24] https://www.paypal.com/cgi-bin/webscr?cmd=_donations&business=swaroop%40swaroop%2ecom&item_name=A20Byte%20of%20Python&no_shipping=0&no_tax=1&0&currency_code=USD&lc=IN&bn=PP%2dDonationsBF&charset=UTF%28\n\
    [25] http://www.swaroopch.com/buybook\n\n"
